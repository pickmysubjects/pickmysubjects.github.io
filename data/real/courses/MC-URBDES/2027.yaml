# Master of Urban Design, 2027 Handbook. Facts re-expressed in our own words.
# 200 points: 125 points of core, a 25-point capstone and 50 points of electives. No entry programs.
# Entry: a bachelor's in urban design, landscape architecture or architecture with a WAM of 65,
# plus a design folio. No UniMelb subject is named, so nothing is assumed done.
code: MC-URBDES
title: Master of Urban Design
year: 2027
total_points: 200
standard_load: 50
