# Bachelor of Science (Extended) course rules, 2026 Handbook. Facts re-expressed in our own words.
# A foundation year, then the Bachelor of Science's own completion rules: the majors,
# specialisations and science/breadth lists are B-SCI's, kept once under B-SCI (based_on).
code: B-SCIEXTD
title: Bachelor of Science (Extended)
year: 2026
total_points: 350
standard_load: 50
categories: [science, breadth]
based_on: B-SCI
# Only for Aboriginal and Torres Strait Islander students; domestic students only.
entry_note: sciextd
handbook: https://handbook.unimelb.edu.au/2026/courses/b-sciextd/course-structure
verified_on: 2026-10-21 # rules checked by hand against the Handbook course structure
rules:
  - id: total
    kind: points
    min: 350
    description: 350 points in total
  # First-year foundation subjects (students with VCE Mathematical Methods 3/4 may get approval to
  # swap MAST10014 and MAST10015 for level-1 science electives; that approval isn't modelled).
  - id: foundation
    kind: compulsory
    subjects: [MAST10014, MAST10015, SCIE10005, SCIE10007, SCIE10010]
    first_year: true
    description: The first-year foundation subjects
  - id: foundation-knowledge
    kind: requirement
    paths:
      - - choose: { points: 12.5, from: [SCIE10006, SCIE10008, SCIE10009] }
    first_year: true
    description: One Science Knowledge Foundations subject (biology, chemistry or physics)
  # From second year, the Bachelor of Science rules. The foundation subjects count towards the
  # total only, so the 225 + 50 points below fill the other 275.
  - id: science
    kind: points
    category: science
    min: 225
    description: At least 225 points of science subjects
  - id: science-l1
    kind: points
    category: science
    level: 1
    min: 62.5
    description: At least 62.5 points of level-1 science
  - id: science-l2
    kind: points
    category: science
    level: 2
    min: 62.5
    description: At least 62.5 points of level-2 science
  - id: science-l3
    kind: points
    category: science
    level: 3
    min: 75
    description: At least 75 points of level-3 science
  - id: breadth
    kind: points
    category: breadth
    min: 50
    description: At least 50 points of breadth
  - id: breadth-l1-cap
    kind: points
    category: breadth
    level: 1
    max: 25
    description: No more than 25 points of level-1 breadth
  # B-SCI's 125, plus the 50 foundation points that sit outside the Bachelor of Science's 300.
  - id: level1-cap
    kind: points
    level: 1
    max: 175
    description: No more than 175 points at level 1 (foundation year included)
  - id: major
    kind: major
    count: 1
    description: Complete one Bachelor of Science major
  - id: specialisation
    kind: specialisation
    max: 1
    description: At most one specialisation
  - id: level1-areas
    kind: level1-areas
    category: science
    min_areas: 2
    max_points_per_area: 37.5
    description: At least two level-1 science areas, at most 37.5 points from any one
  - id: progress-to-l2
    kind: progression
    before_level: 2
    level: 1
    min_points: 50
    description: Normally 50 level-1 points before level-2 subjects
  - id: progress-to-l3
    kind: progression
    before_level: 3
    level: 2
    min_points: 50
    description: Normally 50 level-2 points before level-3 subjects
