# Bachelor of Biomedicine course rules, 2027 Handbook (changes from 2026: BIOL10008 replaces BIOL10002 in the
# level-1 core; level 2 is 50 points chosen from BIOM20003-BIOM20007 instead of BIOM20001/20002; three more
# foundation electives). Facts re-expressed in our own words.
code: B-BMED
title: Bachelor of Biomedicine
year: 2027
total_points: 300
standard_load: 50
categories: [science, breadth]
# Discipline subjects are the science areas (the Handbook's full electives list is a separate
# page, b-bmed-stdopt-1, not pasted yet); everything else is breadth.
area_categories:
  home: science
  areas: [AGRI, ANAT, ANSC, ATOC, BCMB, BIOL, BIOM, BMEN, BOTA, BTCH, CEDB, CHEM, CHEN, COMP, CVEN, ECOL, ELEN, ENEN, ENGR, ENST, ENVS, ERTH, EVSC, FOOD, FRST, GENE, GEOG, GEOL, GEOM, HORT, INFO, MAST, MCEN, MIIM, NEUR, NUTR, OPTO, PATH, PHRM, PHYC, PHYS, PSYC, SWEN, VETS, ZOOL]
  other: breadth
handbook: https://handbook.unimelb.edu.au/2027/courses/b-bmed/course-structure
verified_on: 2026-11-14 # rules checked by hand against the 2027 Handbook course structure
rules:
  - id: total
    kind: points
    min: 300
    description: 300 points in total
  - id: biom10001
    kind: compulsory
    subjects: [BIOM10001]
    first_semester: true
    description: BIOM10001 in your first semester
  - id: core-l1
    kind: compulsory
    subjects: [BIOL10008, CHEM10006, BIOM10002]
    description: The level-1 compulsory subjects
  - id: core-l2
    kind: requirement
    paths:
      - - choose: { points: 50, from: [BIOM20003, BIOM20004, BIOM20005, BIOM20006, BIOM20007] }
    description: 50 points of level-2 biomedical electives
  - id: core-l3
    kind: compulsory
    subjects: [BIOM30001, BIOM30002]
    description: The level-3 compulsory subjects
  - id: foundation
    kind: requirement
    paths:
      - - choose: { points: 25, from: [COMP10001, MAST10005, MAST10006, MAST10007, MAST10008, MAST10009, MAST10010, MAST10021, MAST10022, MAST10024, PHYC10003, PHYC10006, PHYC10007, PHYC10009, PHYC10001, PSYC10003, PSYC10004, PSYC10006, PSYC10007, ENGR10004, COMP10002, ENGR10006, PHYC10002] }
    description: At least 25 points of foundation electives
  - id: discipline
    kind: points
    category: science
    min: 225
    description: At least 225 points of discipline subjects
  - id: discipline-l1
    kind: points
    category: science
    level: 1
    min: 75
    description: At least 75 points of level-1 discipline subjects
  - id: discipline-l2
    kind: points
    category: science
    level: 2
    min: 62.5
    description: At least 62.5 points of level-2 discipline subjects
  - id: discipline-l3
    kind: points
    category: science
    level: 3
    min: 75
    description: At least 75 points of level-3 discipline subjects
  - id: breadth
    kind: points
    category: breadth
    min: 50
    description: At least 50 points of breadth
  - id: breadth-l1-cap
    kind: points
    category: breadth
    level: 1
    max: 37.5
    description: No more than 37.5 points of level-1 breadth
  - id: level1-cap
    kind: points
    level: 1
    max: 125
    description: No more than 125 points at level 1
  - id: major
    kind: major
    count: 1
    description: Complete one major
  # "A maximum of 125 credit points in a single discipline": taken as one subject area (code prefix).
  - id: discipline-cap
    kind: area-cap
    max: 125
    description: No more than 125 points from any one discipline
  - id: progress-to-l2
    kind: progression
    before_level: 2
    level: 1
    min_points: 50
    description: Normally 50 level-1 points before level-2 subjects
  - id: progress-to-l3
    kind: progression
    before_level: 3
    level: 2
    min_points: 50
    description: Normally 50 level-2 points before level-3 subjects
