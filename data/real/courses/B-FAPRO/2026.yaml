# Bachelor of Fine Arts (Production) course rules, 2026 Handbook. Facts re-expressed in our own words.
# The nine Bachelor of Fine Arts streams share one shape (a fixed compulsory sequence, 50 points of
# breadth, in some streams one elective) but no subjects beyond CREA10002, so each is its own file.
code: B-FAPRO
title: Bachelor of Fine Arts (Production)
year: 2026
total_points: 300
standard_load: 50
categories: [fine-arts, breadth]
# The stream's own areas (and CREA, for Stories of Place) are its discipline; a subject elsewhere
# counts as breadth when its page lists this course for breadth. Which other Fine Arts and Music
# areas a stream's students may take as breadth isn't on the course pages.
# GDES30004 (a Production elective) carries B-FAPRO: fine-arts in its own file: GDES is Design.
area_categories:
  home: fine-arts
  areas: [CREA, DPSS, PERF, THTR]
  other: breadth
handbook: https://handbook.unimelb.edu.au/2026/courses/b-fapro/course-structure
verified_on: 2026-10-21 # rules checked by hand against the Handbook course structure
listed: true
rules:
  - id: total
    kind: points
    min: 300
    description: 300 points in total
  - id: stories-of-place
    kind: compulsory
    subjects: [CREA10002]
    first_semester: true
    description: Stories of Place, in the first semester
  - id: compulsory-l1
    kind: compulsory
    subjects: [DPSS10005, DPSS10008, DPSS10009, DPSS10010]
    description: The level-1 compulsory subjects
  - id: compulsory-l2
    kind: compulsory
    subjects: [DPSS20010, DPSS20011, DPSS20012, DPSS20013]
    description: The level-2 compulsory subjects
  - id: compulsory-l3
    kind: compulsory
    subjects: [DPSS30008, DPSS30009, DPSS30010]
    description: The level-3 compulsory subjects
  # DPSS20009, DPSS30007, DPSS30011 not available in 2026.
  - id: elective
    kind: requirement
    paths:
      - - choose: { points: 12.5, from: [DPSS10007, DPSS20009, DPSS30007, DPSS30011, GDES30004, PERF30001, PERF30002, THTR20043, THTR30042] }
    description: One Production elective (12.5 points)
  - id: breadth
    kind: points
    category: breadth
    min: 50
    description: At least 50 points of breadth
  - id: breadth-l1-cap
    kind: points
    category: breadth
    level: 1
    max: 37.5
    description: No more than 37.5 points of level-1 breadth
# Not encoded (engine can't express): every level-1 compulsory subject before the level-2 ones, and
# every level-2 one before level 3 (a progression rule would hold back breadth too; the subjects'
# own prerequisites cover most of it).
# DPSS30008 and DPSS30009 (Production Practice 3, Parts A and B) run in two consecutive study
# periods; the engine plans them as two ordinary subjects. The Handbook recommends a level-3 elective.
