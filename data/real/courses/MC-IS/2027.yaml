  - id: mis-electives
    kind: requirement
    paths:
      - - choose: { points: 25, from: [ISYS90089, ISYS90051, ISYS90097, ISYS90081, ISYS90112, ISYS90039, ISYS90035, ISYS90036, ISYS90069, ISYS90117, ISYS90120] }
    description: At least 25 points of Master of Information Systems electives
  - id: general-cap
    kind: points
    category: course-extra
    max: 25
    description: No more than 25 points of general electives
