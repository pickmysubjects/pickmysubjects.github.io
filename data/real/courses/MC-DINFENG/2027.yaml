  - id: year2-selective
    kind: requirement
    paths:
      - - choose: { points: 12.5, from: [COMP90087, LAWS90203] }
    description: One Year 2 selective (12.5 points)
  - id: year3
    kind: compulsory
    # Students who started before 2025 may follow their entry year's structure instead.
    subjects: [CVEN90045, ENGR90051]
    year: 3
    description: Year 3 compulsory subjects (25 points)
  - id: capstone
