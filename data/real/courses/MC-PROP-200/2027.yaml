# Master of Property, 200-point entry program, 2027 Handbook. The Handbook runs MC-PROP as two
# entry programs (300/200 points); each is kept as its own course here, as for MC-MGMT.
# Facts re-expressed in our own words.
code: MC-PROP-200
title: Master of Property (200-point program)
year: 2027
total_points: 200
standard_load: 50
# Not shown to students until the master's planner is ready (1.2.0).
listed: false
listed_only: true
categories: [course]
# Our reading: the up to 100 points of credit for a cognate bachelor's stands in for the 300-point
# program's Year 1 core subjects (the 200-point program has no Year 1 core).
assumed_done: [ABPL90290, ABPL90274, ABPL90275, ACCT90041, ABPL90130, ABPL90029, FNCE90060, ECON90015]
entry_note: mcprop200
handbook: https://handbook.unimelb.edu.au/2027/components/mc-prop-entry-1
verified_on: 2026-11-28 # structure read from the 2027 Handbook course and entry program pages
rules:
  - id: total
    kind: points
    min: 200
    description: 200 points in total
  - id: core
    kind: compulsory
    subjects: [ABPL90011, ABPL90026, ABPL90045, ABPL90041, ABPL90339, ABPL90036, ABPL90031, ABPL90363, ABPL90416, ABPL90034]
    description: The ten Year 2 and 3 core subjects (125 points)
  - id: research-selective
    kind: requirement
    # Only one of the two research subjects may be taken in the whole course.
    paths:
      - - choose: { points: 12.5, from: [ABPL90362, ABPL90364] }
    description: One of the two research selectives
  - id: electives
    kind: requirement
    # 62.5 points of electives: at least 50 from the Property elective list, and up to 12.5 of
    # multidisciplinary electives (Melbourne School of Design graduate subjects, or another
    # graduate subject with approval). ABPL90130, a Year 1 core subject, is left out of the list.
    # Only the Property list is offered here; our reading is
    # that taking all 62.5 from it meets the rule.
    paths:
      - - choose: { points: 62.5, from: [ABPL90281, ABPL90016, ABPL90038, ABPL90040, ABPL90027, ABPL90032, ABPL90314, ABPL90246, ABPL90406, ABPL90409, ABPL90415, MGMT90031, ABPL90292, ABPL90428, ABPL90311, ABPL90313, ABPL90320, GEOM90045, ENGR90039, ABPL90449] }
    description: 62.5 points of electives, at least 50 of them Property electives
