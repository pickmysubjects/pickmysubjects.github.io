points:
  - en: "Beginners with no music background have done well, and the two recent reviewers got H1."
    zh: "没有音乐基础的新手也能学好，最近两位评论者都拿了 H1。"
    zh-TW: "沒有音樂基礎的新手也能學好，最近兩位評論者都拿了 H1。"
    ja: "音楽経験のない初心者でもうまくいっており、最近の2人はH1を取っている。"
    ko: "음악 경험 없는 초보자도 잘 해냈고, 최근 두 명은 H1을 받음."
    vi: "Người mới chưa học nhạc vẫn làm tốt, hai người đánh giá gần đây đều đạt H1."
    ms: "Pemula tanpa latar muzik berjaya, dan dua pengulas terkini mendapat H1."
    id: "Pemula tanpa latar musik bisa berhasil, dan dua pengulas terbaru dapat H1."
    hi: "बिना संगीत पृष्ठभूमि वाले नए छात्र भी अच्छा कर पाए, हाल के दोनों समीक्षकों को H1 मिला।"
  - en: "Most see it as a relaxed breadth, but one older review warns it isn't easy without a music background."
    zh: "多数人觉得是轻松的通识课，但一条较早的评论提醒：没有音乐基础并不轻松。"
    zh-TW: "多數人覺得是輕鬆的通識課，但一則較早的評論提醒：沒有音樂基礎並不輕鬆。"
    ja: "多くは気楽な選択科目と見るが、古い1件は音楽経験なしでは楽ではないと注意している。"
    ko: "대부분 편한 교양으로 보지만, 예전 리뷰 하나는 음악 경험 없이는 쉽지 않다고 경고."
    vi: "Đa số thấy đây là môn breadth nhẹ nhàng, nhưng một đánh giá cũ cảnh báo không dễ nếu chưa học nhạc."
    ms: "Kebanyakan anggap breadth yang santai, tetapi satu ulasan lama memberi amaran ia tidak mudah tanpa latar muzik."
    id: "Sebagian besar menganggapnya breadth santai, tapi satu ulasan lama memperingatkan tidak mudah tanpa latar musik."
    hi: "ज़्यादातर इसे आरामदेह ब्रेड्थ मानते हैं, पर एक पुरानी समीक्षा कहती है कि संगीत पृष्ठभूमि के बिना आसान नहीं।"
  - en: "Practise every instrument from the first week; you may be given a hard one for the final performance."
    zh: "从第一周起每种乐器都练；期末演出可能分到难的那件。"
    zh-TW: "從第一週起每種樂器都練；期末演出可能分到難的那件。"
    ja: "初週から全ての楽器を練習すること。最終演奏で難しい楽器を割り当てられることがある。"
    ko: "첫 주부터 모든 악기를 연습할 것. 마지막 공연에서 어려운 악기를 맡을 수 있음."
    vi: "Tập mọi nhạc cụ từ tuần đầu; buổi diễn cuối có thể bị giao nhạc cụ khó."
    ms: "Berlatih setiap alat dari minggu pertama; anda mungkin diberi alat yang sukar untuk persembahan akhir."
    id: "Latih setiap alat sejak minggu pertama; kamu bisa diberi alat yang sulit untuk pertunjukan akhir."
    hi: "पहले हफ़्ते से हर वाद्य का अभ्यास करें; अंतिम प्रस्तुति में कठिन वाद्य मिल सकता है।"
  - en: "Practice needed ranges from an hour or two a week to about an hour a day for those who get hooked."
    zh: "练习量从每周一两小时到每天约一小时不等，看你多投入。"
    zh-TW: "練習量從每週一兩小時到每天約一小時不等，看你多投入。"
    ja: "練習量は週1〜2時間から、のめり込んだ人は1日約1時間まで。"
    ko: "연습량은 주 1~2시간부터, 빠져든 사람은 하루 1시간 정도까지."
    vi: "Lượng tập từ một hai giờ mỗi tuần đến khoảng một giờ mỗi ngày nếu mê."
    ms: "Latihan diperlukan antara sejam dua seminggu hingga kira-kira sejam sehari bagi yang minat."
    id: "Latihan yang dibutuhkan dari satu-dua jam seminggu sampai sekitar satu jam sehari bagi yang ketagihan."
    hi: "अभ्यास हफ़्ते में एक-दो घंटे से लेकर, जिन्हें मज़ा आ जाए उनके लिए रोज़ लगभग एक घंटा।"
workload: light
difficulty: easy
