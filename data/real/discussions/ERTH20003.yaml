points:
  - en: "Generally seen as interesting and not too hard, but you still need to take good notes and keep up."
    zh: "普遍认为有趣且不太难，但仍需认真记笔记、跟上进度。"
    zh-TW: "普遍認為有趣又不太難，但還是要認真做筆記、跟上進度。"
    ja: "面白くてそれほど難しくないとされるが、しっかりノートを取り遅れないことは必要。"
    ko: "대체로 재미있고 너무 어렵지 않다는 평이지만, 필기를 잘하고 진도를 따라가야 함."
    vi: "Nhìn chung thú vị và không quá khó, nhưng vẫn cần ghi chép kỹ và theo kịp."
    ms: "Umumnya dilihat menarik dan tidak terlalu sukar, tetapi anda masih perlu catat nota dengan baik dan ikut rentak."
    id: "Umumnya dianggap menarik dan tidak terlalu sulit, tapi tetap perlu mencatat dengan baik dan mengikuti."
    hi: "आम तौर पर दिलचस्प और ज़्यादा कठिन नहीं माना जाता, पर अच्छे नोट्स बनाने और साथ चलते रहने की ज़रूरत है।"
  - en: "Two essays with a choice of topics; some markers are strict on referencing and grammar."
    zh: "有两篇论文，可从多个题目中选择；部分阅卷人对引用和语法要求严格。"
    zh-TW: "有兩篇論文，題目可以選；部分批改者對引用和文法要求很嚴。"
    ja: "エッセイは2本でテーマは選べる。引用と文法に厳しい採点者もいる。"
    ko: "에세이 2편이며 주제를 고를 수 있고, 일부 채점자는 인용과 문법에 엄격함."
    vi: "Hai bài luận được chọn chủ đề; một số người chấm khắt khe về trích dẫn và ngữ pháp."
    ms: "Dua esei dengan pilihan topik; sesetengah pemeriksa tegas tentang rujukan dan tatabahasa."
    id: "Dua esai dengan pilihan topik; sebagian penilai ketat soal sitasi dan tata bahasa."
    hi: "टॉपिक चुनने की छूट के साथ दो निबंध; कुछ मार्कर रेफ़रेंसिंग और ग्रामर पर सख़्त हैं।"
  - en: "Recent exams allow a double-sided A4 cheat sheet, which makes them much more manageable."
    zh: "近年考试允许带一张双面A4小抄，难度大大降低。"
    zh-TW: "近年考試允許帶一張雙面A4小抄，難度降低很多。"
    ja: "最近の試験はA4両面のカンニングペーパー持ち込み可で、かなり楽になった。"
    ko: "최근 시험은 A4 양면 요약지를 허용해 훨씬 수월해짐."
    vi: "Đề thi gần đây cho mang một tờ A4 hai mặt ghi chú, nên dễ thở hơn nhiều."
    ms: "Peperiksaan terkini benarkan helaian nota A4 dua muka, jadi lebih mudah diurus."
    id: "Ujian terbaru membolehkan contekan A4 bolak-balik, jadi jauh lebih mudah dihadapi."
    hi: "हाल के एग्ज़ाम में दोनों तरफ़ लिखी एक A4 चीट शीट ले जाने की छूट है, जिससे ये काफ़ी आसान हो जाते हैं।"
  - en: "Prac quizzes are easy marks, though the pracs themselves can be dull."
    zh: "实验课小测容易拿分，但实验课本身可能较无聊。"
    zh-TW: "實驗課小考很好拿分，但實驗課本身可能有點無聊。"
    ja: "実習の小テストは点が取りやすいが、実習自体は退屈なことも。"
    ko: "실습 퀴즈는 점수 따기 쉽지만 실습 자체는 지루할 수 있음."
    vi: "Quiz prac dễ lấy điểm, dù bản thân buổi prac có thể nhàm."
    ms: "Kuiz prac markah mudah, walaupun prac itu sendiri boleh membosankan."
    id: "Kuis prak gampang dapat nilai, meski praknya sendiri bisa membosankan."
    hi: "प्रैक्टिकल क्विज़ में आसानी से मार्क्स मिलते हैं, हालाँकि प्रैक्टिकल ख़ुद नीरस हो सकते हैं।"
difficulty: easy
