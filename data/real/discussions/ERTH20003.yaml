reviews: 7
from: 2019
to: 2025
checked: 2026-10-08
points:
  - en: "Generally seen as interesting and not too hard, but you still need to take good notes and keep up."
    zh: "普遍认为有趣且不太难，但仍需认真记笔记、跟上进度。"
    zh-TW: "普遍認為有趣又不太難，但還是要認真做筆記、跟上進度。"
    ja: "面白くてそれほど難しくないとされるが、しっかりノートを取り遅れないことは必要。"
    ko: "대체로 재미있고 너무 어렵지 않다는 평이지만, 필기를 잘하고 진도를 따라가야 함."
    vi: "Nhìn chung thú vị và không quá khó, nhưng vẫn cần ghi chép kỹ và theo kịp."
    ms: "Umumnya dilihat menarik dan tidak terlalu sukar, tetapi anda masih perlu catat nota dengan baik dan ikut rentak."
    id: "Umumnya dianggap menarik dan tidak terlalu sulit, tapi tetap perlu mencatat dengan baik dan mengikuti."
    hi: "आम तौर पर दिलचस्प और ज़्यादा कठिन नहीं माना जाता, पर अच्छे नोट्स बनाने और साथ चलते रहने की ज़रूरत है।"
  - en: "Two essays with a choice of topics; some markers are strict on referencing and grammar."
    zh: "有两篇论文，可从多个题目中选择；部分阅卷人对引用和语法要求严格。"
    zh-TW: "有兩篇論文，題目可以選；部分批改者對引用和文法要求很嚴。"
    ja: "エッセイは2本でテーマは選べる。引用と文法に厳しい採点者もいる。"
    ko: "에세이 2편이며 주제를 고를 수 있고, 일부 채점자는 인용과 문법에 엄격함."
    vi: "Hai bài luận được chọn chủ đề; một số người chấm khắt khe về trích dẫn và ngữ pháp."
    ms: "Dua esei dengan pilihan topik; sesetengah pemeriksa tegas tentang rujukan dan tatabahasa."
    id: "Dua esai dengan pilihan topik; sebagian penilai ketat soal sitasi dan tata bahasa."
    hi: "टॉपिक चुनने की छूट के साथ दो निबंध; कुछ मार्कर रेफ़रेंसिंग और ग्रामर पर सख़्त हैं।"
  - en: "Recent exams allow a double-sided A4 cheat sheet, which makes them much more manageable."
    zh: "近年考试允许带一张双面A4小抄，难度大大降低。"
    zh-TW: "近年考試允許帶一張雙面A4小抄，難度降低很多。"
    ja: "最近の試験はA4両面のカンニングペーパー持ち込み可で、かなり楽になった。"
    ko: "최근 시험은 A4 양면 요약지를 허용해 훨씬 수월해짐."
    vi: "Đề thi gần đây cho mang một tờ A4 hai mặt ghi chú, nên dễ thở hơn nhiều."
    ms: "Peperiksaan terkini benarkan helaian nota A4 dua muka, jadi lebih mudah diurus."
    id: "Ujian terbaru membolehkan contekan A4 bolak-balik, jadi jauh lebih mudah dihadapi."
    hi: "हाल के एग्ज़ाम में दोनों तरफ़ लिखी एक A4 चीट शीट ले जाने की छूट है, जिससे ये काफ़ी आसान हो जाते हैं।"
  - en: "Prac quizzes are easy marks, though the pracs themselves can be dull."
    zh: "实验课小测容易拿分，但实验课本身可能较无聊。"
    zh-TW: "實驗課小考很好拿分，但實驗課本身可能有點無聊。"
    ja: "実習の小テストは点が取りやすいが、実習自体は退屈なことも。"
    ko: "실습 퀴즈는 점수 따기 쉽지만 실습 자체는 지루할 수 있음."
    vi: "Quiz prac dễ lấy điểm, dù bản thân buổi prac có thể nhàm."
    ms: "Kuiz prac markah mudah, walaupun prac itu sendiri boleh membosankan."
    id: "Kuis prak gampang dapat nilai, meski praknya sendiri bisa membosankan."
    hi: "प्रैक्टिकल क्विज़ में आसानी से मार्क्स मिलते हैं, हालाँकि प्रैक्टिकल ख़ुद नीरस हो सकते हैं।"
sections:
  content:
    - en: "Earth's climates across past eras and the methods used to reconstruct them. Reviewers, including those new to earth science, found it interesting and not too hard, though not effortless."
      zh: "讲地球各个时期的气候，以及重建古气候的方法。同学（包括没学过地球科学的）觉得有意思、不算太难，但也不是不用花力气。"
      zh-TW: "講地球各時期的氣候，以及重建古氣候的方法。同學（包括沒修過地球科學的）覺得有趣、不算太難，但也不是不用花力氣。"
      ja: "過去の時代の地球の気候と、それを復元する方法を学ぶ。地球科学が初めての人も含め、面白くそれほど難しくないが、楽勝でもないという声。"
      ko: "과거 여러 시대의 지구 기후와 이를 복원하는 방법을 다룬다. 지구과학이 처음인 사람을 포함해 흥미롭고 그리 어렵지 않지만 거저는 아니라는 평."
      vi: "Khí hậu Trái Đất qua các thời kỳ và phương pháp tái dựng chúng. Người học, kể cả người mới với khoa học Trái Đất, thấy thú vị và không quá khó, dù vẫn phải bỏ công."
      ms: "Iklim Bumi merentas era lalu dan kaedah membina semulanya. Pengulas, termasuk yang baharu dengan sains bumi, rasa menarik dan tidak terlalu sukar, walaupun tetap perlu usaha."
      id: "Iklim Bumi di berbagai era dan metode merekonstruksinya. Pengulas, termasuk yang baru dengan ilmu kebumian, merasa menarik dan tidak terlalu sulit, meski tetap butuh usaha."
      hi: "पुराने युगों में पृथ्वी की जलवायु और उसे दोबारा समझने के तरीक़े। रिव्यूअर्स को, जिनमें भू-विज्ञान में नए लोग भी हैं, यह रोचक और ज़्यादा कठिन नहीं लगा, हालाँकि मेहनत तो चाहिए।"
  work:
    - en: "Two essays of about 1,000 words chosen from eight topics, quizzes in pracs, and an exam with a double-sided A4 cheat sheet allowed. Some found essay marking strict on references and grammar."
      zh: "两篇约 1000 字的论文（从八个题目中选），实验课中的小测，以及可带一张双面 A4 小抄的期末。有人觉得论文在引用和语法上扣分严。"
      zh-TW: "兩篇約 1000 字的論文（從八個題目中選），實驗課中的小考，以及可帶一張雙面 A4 小抄的期末。有人覺得論文在引用和文法上扣分嚴。"
      ja: "8つのテーマから選ぶ約1,000語のエッセイ2本、実習中の小テスト、両面A4のカンニングペーパー持ち込み可の期末。参考文献や文法の採点が厳しいという声も。"
      ko: "8개 주제 중 고르는 약 1,000단어 에세이 2편, 실습 중 퀴즈, 양면 A4 요약지 지참이 가능한 기말이 있다. 인용과 문법 채점이 깐깐하다는 의견도 있다."
      vi: "Hai bài luận khoảng 1.000 từ chọn từ tám đề, quiz trong buổi thực hành, và bài thi được mang một tờ A4 ghi hai mặt. Có người thấy chấm luận khắt về trích dẫn và ngữ pháp."
      ms: "Dua esei kira-kira 1,000 perkataan dipilih daripada lapan topik, kuiz dalam amali, dan peperiksaan dengan satu helaian nota A4 dua muka dibenarkan. Ada yang rasa esei dinilai ketat tentang rujukan dan tatabahasa."
      id: "Dua esai sekitar 1.000 kata dari delapan pilihan topik, kuis saat praktikum, dan ujian dengan lembar contekan A4 bolak-balik. Sebagian merasa esai dinilai ketat soal sitasi dan tata bahasa."
      hi: "आठ विषयों में से चुने लगभग 1,000 शब्दों के दो निबंध, प्रैक में क्विज़, और दोनों तरफ़ लिखी एक A4 शीट वाली परीक्षा। कुछ को निबंध में संदर्भ और व्याकरण पर मार्किंग सख़्त लगी।"
  study:
    - en: "Take thorough notes from the lectures through the semester to build your cheat sheet, and pick the essay topic you find easiest to research."
      zh: "整个学期认真记讲课笔记，用来做小抄；论文挑你觉得最容易查资料的题目。"
      zh-TW: "整學期認真記上課筆記，用來做小抄；論文挑你覺得最容易找資料的題目。"
      ja: "カンニングペーパー作りのために学期中から講義ノートをしっかり取り、エッセイは一番調べやすいテーマを選ぶ。"
      ko: "요약지를 만들 수 있게 학기 내내 강의 노트를 꼼꼼히 하고, 에세이는 가장 조사하기 쉬운 주제를 골라라."
      vi: "Ghi chép kỹ bài giảng suốt kỳ để làm tờ tóm tắt mang vào thi, và chọn đề luận dễ tìm tài liệu nhất."
      ms: "Ambil nota kuliah yang teliti sepanjang semester untuk membina helaian nota, dan pilih topik esei yang paling mudah dikaji."
      id: "Catat kuliah dengan teliti sepanjang semester untuk membuat lembar contekan, dan pilih topik esai yang paling mudah diriset."
      hi: "पूरे सेमेस्टर लेक्चर के विस्तृत नोट्स लें ताकि चीट शीट बना सकें, और निबंध के लिए वह विषय चुनें जिस पर रिसर्च सबसे आसान हो।"
  watch:
    - en: "Several found the pracs or tutorials a bit boring, and one 2025 reviewer felt essay marking varied depending on who marked it."
      zh: "好几位觉得实验课或 tutorial 有点无聊；2025 年有同学觉得论文给分会因批改人不同而差异很大。"
      zh-TW: "好幾位覺得實驗課或 tutorial 有點無聊；2025 年有同學覺得論文給分會因批改人不同而差很多。"
      ja: "実習やチュートリアルがやや退屈という声が複数。2025年には採点者によってエッセイの点数に差があったという声も。"
      ko: "여러 명이 실습이나 튜토리얼이 좀 지루하다고 했고, 2025년 한 리뷰어는 채점자에 따라 에세이 점수가 달랐다고 느꼈다."
      vi: "Vài người thấy buổi thực hành hay tutorial hơi chán, và một người năm 2025 thấy điểm luận khác nhau tùy người chấm."
      ms: "Beberapa rasa amali atau tutorial agak membosankan, dan seorang pengulas 2025 rasa markah esei berbeza ikut siapa yang menanda."
      id: "Beberapa merasa praktikum atau tutorial agak membosankan, dan satu pengulas 2025 merasa nilai esai berbeda tergantung siapa penilainya."
      hi: "कई को प्रैक या ट्यूटोरियल थोड़े उबाऊ लगे, और 2025 के एक रिव्यूअर को लगा कि निबंध के अंक इस पर निर्भर थे कि किसने जाँचा।"
difficulty: easy
