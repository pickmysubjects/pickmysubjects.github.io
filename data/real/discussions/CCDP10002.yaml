points:
  - en: "Reviewers found it relaxed and low-stress, with two assessments worth half each; one called it an easy WAM booster."
    zh: "评论者觉得课程轻松、压力小，两项作业各占一半；有人说是提分的水课。"
    zh-TW: "評論者覺得課程輕鬆、壓力小，兩項作業各佔一半；有人說是拉分的涼課。"
    ja: "気楽でストレスが少なく、課題は半々の2つだけ。GPAを上げやすいという声も。"
    ko: "편하고 부담이 적으며 과제 두 개가 각 50%. 학점 올리기 좋다는 평도 있음."
    vi: "Môn nhẹ nhàng, ít áp lực, hai bài mỗi bài 50%; có người gọi là môn kéo điểm WAM."
    ms: "Pengulas dapati subjek ini santai, dua tugasan masing-masing separuh; seorang kata mudah naikkan WAM."
    id: "Pengulas menilai santai dan tidak menekan, dua tugas masing-masing separuh; ada yang bilang pendongkrak WAM."
    hi: "रिव्यूअर्स को यह आरामदेह लगा, दो असेसमेंट आधे-आधे; एक ने इसे आसान WAM बूस्टर कहा।"
  - en: "Several said the assessment instructions were very vague, which some liked and others did not."
    zh: "几位都说作业要求很模糊，有人觉得是好事，有人不喜欢。"
    zh-TW: "幾位都說作業要求很模糊，有人覺得是好事，有人不喜歡。"
    ja: "課題の指示がかなり曖昧だという声が複数あり、好みが分かれる。"
    ko: "과제 안내가 매우 모호하다는 의견이 여럿이며, 호불호가 갈림."
    vi: "Nhiều người nói yêu cầu bài làm rất mơ hồ, người thấy hay, người không thích."
    ms: "Beberapa kata arahan tugasan sangat kabur; ada yang suka, ada yang tidak."
    id: "Beberapa bilang instruksi tugas sangat samar; ada yang suka, ada yang tidak."
    hi: "कई ने कहा असेसमेंट निर्देश बहुत अस्पष्ट थे; कुछ को अच्छा लगा, कुछ को नहीं।"
  - en: "Lectures ramble at times but cover many creative fields with useful insight."
    zh: "讲座有时比较散，但涵盖很多创作领域，见解有用。"
    zh-TW: "講座有時比較散，但涵蓋很多創作領域，見解有用。"
    ja: "講義はやや脱線しがちだが、多くの創作分野を扱い得るものがある。"
    ko: "강의가 가끔 산만하지만 여러 창작 분야를 다뤄 유익함."
    vi: "Bài giảng đôi khi lan man nhưng bao quát nhiều lĩnh vực sáng tạo, hữu ích."
    ms: "Kuliah kadang meleret tetapi merangkumi banyak bidang kreatif dengan pandangan berguna."
    id: "Kuliah kadang bertele-tele tapi mencakup banyak bidang kreatif dengan wawasan berguna."
    hi: "लेक्चर कभी-कभी भटकते हैं, पर कई रचनात्मक क्षेत्रों पर उपयोगी जानकारी देते हैं।"
workload: light
difficulty: easy
