points:
  - en: "Content is interesting and not too difficult; the field trip is enjoyable when it runs."
    zh: "内容有趣且不太难，野外考察（如能成行）很好玩。"
    zh-TW: "內容有趣又不太難；有開的時候，野外考察很好玩。"
    ja: "内容は面白くそれほど難しくない。フィールドトリップは実施されれば楽しい。"
    ko: "내용이 흥미롭고 너무 어렵지 않으며, 현장 답사가 진행되면 즐거움."
    vi: "Nội dung thú vị và không quá khó; chuyến thực địa vui nếu được tổ chức."
    ms: "Kandungan menarik dan tidak terlalu sukar; lawatan lapangan menyeronokkan apabila diadakan."
    id: "Materi menarik dan tidak terlalu sulit; kunjungan lapangan menyenangkan kalau diadakan."
    hi: "कंटेंट दिलचस्प है और ज़्यादा कठिन नहीं; फ़ील्ड ट्रिप होने पर मज़ेदार रहती है।"
  - en: "2025 reviewers felt it was poorly run: assessed pracs had little guidance or unclear wording, and marks came back very late."
    zh: "2025年的评价者认为课程组织欠佳：计分实验缺乏指导、题目表述不清，成绩返还很晚。"
    zh-TW: "2025年的評論者覺得課程運作不佳：計分實驗缺乏指引或敘述不清，成績也很晚才發。"
    ja: "2025年の口コミは運営が悪いと感じた。評価対象の実習は指導が少なく文言も不明確で、成績返却もかなり遅かった。"
    ko: "2025년 후기는 운영이 부실했다고 평가: 평가 실습은 안내가 거의 없거나 표현이 불명확했고, 점수도 매우 늦게 나옴."
    vi: "Đánh giá năm 2025 cho rằng môn tổ chức kém: prac tính điểm ít hướng dẫn hoặc đề không rõ, và điểm trả rất muộn."
    ms: "Pengulas 2025 rasa ia diurus dengan teruk: prac berpenilaian kurang panduan atau ayat tidak jelas, dan markah dipulangkan sangat lewat."
    id: "Pengulas 2025 merasa pengelolaannya buruk: prak yang dinilai minim panduan atau kalimatnya tidak jelas, dan nilai keluar sangat terlambat."
    hi: "2025 के रिव्यूअर को लगा कि इसे ठीक से नहीं चलाया गया: असेस्ड प्रैक्टिकल में कम गाइडेंस या अस्पष्ट भाषा थी, और मार्क्स बहुत देर से आए।"
  - en: "The main report uses your own practical data, which you cannot easily check, so lean on theory and the textbook."
    zh: "主要报告要用自己的实验数据，难以核对，建议多依靠理论和教材。"
    zh-TW: "主要報告要用自己的實驗數據，很難核對，所以多依靠理論和課本。"
    ja: "メインのレポートは自分の実習データを使うため確認が難しい。理論と教科書を頼りにしよう。"
    ko: "주요 보고서는 직접 얻은 실습 데이터를 쓰는데 검증이 어려우니 이론과 교재에 의지하세요."
    vi: "Báo cáo chính dùng dữ liệu thực hành của chính bạn, khó kiểm tra, nên hãy dựa vào lý thuyết và giáo trình."
    ms: "Laporan utama guna data amali sendiri yang sukar disemak, jadi bergantunglah pada teori dan buku teks."
    id: "Laporan utama memakai data praktikum sendiri yang sulit dicek, jadi andalkan teori dan buku teks."
    hi: "मुख्य रिपोर्ट आपके अपने प्रैक्टिकल डेटा पर होती है, जिसे जाँचना आसान नहीं, तो थ्योरी और टेक्स्टबुक पर भरोसा करें।"
  - en: "The final exam was described as straightforward, closely matching the practice exam."
    zh: "期末考试被认为比较直接，与模拟考试高度相似。"
    zh-TW: "期末考被認為很直接，和模擬考非常相似。"
    ja: "期末試験は素直な内容で、練習試験とよく似ていたとのこと。"
    ko: "기말시험은 단순했고 모의시험과 매우 비슷했다고 함."
    vi: "Bài thi cuối kỳ được mô tả là dễ hiểu, rất giống đề luyện tập."
    ms: "Peperiksaan akhir dikatakan mudah, hampir sama dengan peperiksaan latihan."
    id: "Ujian akhir disebut lugas, sangat mirip dengan ujian latihan."
    hi: "फ़ाइनल एग्ज़ाम सीधा-सादा बताया गया, प्रैक्टिस एग्ज़ाम से काफ़ी मिलता-जुलता।"
difficulty: easy
