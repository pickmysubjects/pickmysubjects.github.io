points:
  - en: "Contemporary political theory with dense readings and fast, information-heavy lectures. All three reviewers (2019-2026) say the content is hard but interesting."
    zh: "当代政治理论课，阅读艰深，讲座节奏快、信息量大。三位评论者（2019-2026）都说内容难但有趣。"
    zh-TW: "當代政治理論課，閱讀艱深，講座節奏快、資訊量大。三位評論者（2019-2026）都說內容難但有趣。"
    ja: "現代政治理論の科目で、文献は難解、講義は速く情報量が多い。3人全員（2019-2026）が内容は難しいが面白いとした。"
    ko: "현대 정치 이론 과목으로 읽기가 어렵고 강의는 빠르고 정보량이 많음. 리뷰어 3명 모두(2019-2026) 어렵지만 흥미롭다고 함."
    vi: "Lý thuyết chính trị đương đại với bài đọc khó và bài giảng nhanh, nhiều thông tin. Cả ba người (2019-2026) nói nội dung khó nhưng thú vị."
    ms: "Teori politik kontemporari dengan bacaan padat dan kuliah laju yang sarat maklumat. Ketiga-tiga pengulas (2019-2026) kata kandungannya sukar tetapi menarik."
    id: "Teori politik kontemporer dengan bacaan padat dan kuliah cepat yang sarat informasi. Ketiga pengulas (2019-2026) bilang materinya sulit tapi menarik."
    hi: "समकालीन राजनीतिक सिद्धांत, घनी रीडिंग और तेज़, जानकारी से भरे लेक्चर के साथ। तीनों रिव्यूअर्स (2019-2026) कहते हैं कि कंटेंट कठिन पर दिलचस्प है।"
  - en: "Readings and tutorials are the core, so do the readings. In 2020 assessment was a research essay mid-semester and a take-home exam of short answers."
    zh: "阅读和辅导课是核心，所以一定要读。2020年的考核是学期中的研究论文和带回家完成的简答考试。"
    zh-TW: "閱讀和輔導課是核心，所以一定要讀。2020年的考核是學期中的研究論文和帶回家完成的簡答考試。"
    ja: "文献とチュートリアルが中心なので文献は必ず読むこと。2020年の評価は学期半ばの研究エッセイと持ち帰りの短答式試験だった。"
    ko: "읽기와 튜토리얼이 핵심이니 꼭 읽을 것. 2020년 평가는 학기 중반 연구 에세이와 테이크홈 단답형 시험이었음."
    vi: "Bài đọc và tutorial là cốt lõi, nên hãy đọc. Năm 2020, đánh giá gồm bài luận nghiên cứu giữa kỳ và bài thi làm tại nhà với câu trả lời ngắn."
    ms: "Bacaan dan tutorial adalah teras, jadi buat bacaan. Pada 2020 penilaian ialah esei penyelidikan pertengahan semester dan peperiksaan bawa pulang jawapan pendek."
    id: "Bacaan dan tutorial adalah inti, jadi kerjakan bacaannya. Pada 2020 penilaian berupa esai riset pertengahan semester dan ujian bawa pulang berjawaban singkat."
    hi: "रीडिंग और ट्यूटोरियल ही मूल हैं, इसलिए रीडिंग ज़रूर करें। 2020 में असेसमेंट सेमेस्टर के बीच एक रिसर्च निबंध और घर से करने वाला शॉर्ट-आंसर एग्ज़ाम था।"
difficulty: hard
