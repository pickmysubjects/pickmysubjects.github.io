points:
  - en: "The semester-long site report takes a lot of work for its small weight, but it carries most of the practical construction knowledge."
    zh: "贯穿学期的工地报告工作量大、占分少，但承载了大部分实用的施工知识。"
    zh-TW: "貫穿學期的工地報告工作量大、佔分少，但承載了大部分實用的營造知識。"
    ja: "学期を通した現場レポートは配点の割に大変だが、実用的な施工知識の大半がここにある。"
    ko: "학기 내내 하는 현장 보고서는 배점에 비해 일이 많지만, 실용적인 시공 지식 대부분이 여기에 있음."
    vi: "Báo cáo công trường cả kỳ rất tốn công so với tỷ trọng nhỏ, nhưng chứa phần lớn kiến thức thi công thực tế."
    ms: "Laporan tapak sepanjang semester banyak kerja berbanding wajarannya, tetapi ia membawa kebanyakan ilmu pembinaan praktikal."
    id: "Laporan lokasi sepanjang semester butuh banyak kerja untuk bobot kecil, tapi berisi sebagian besar ilmu konstruksi praktis."
    hi: "पूरे सेमेस्टर की साइट रिपोर्ट कम वज़न के मुक़ाबले बहुत मेहनत माँगती है, पर व्यावहारिक निर्माण ज्ञान ज़्यादातर इसी में है।"
  - en: "All three reviewers found the tutorials weak, while the lecturer was described as friendly and knowledgeable."
    zh: "三位评论者都觉得辅导课较弱，讲师则被形容为友善且知识丰富。"
    zh-TW: "三位評論者都覺得小組課較弱，講師則被形容為友善且知識豐富。"
    ja: "3人ともチュートリアルは弱いと感じたが、講師は親しみやすく知識豊富とされた。"
    ko: "세 명 모두 튜토리얼이 약하다고 봤고, 강사는 친절하고 박식하다는 평."
    vi: "Cả ba đều thấy tutorial yếu, còn giảng viên được nhận xét thân thiện và hiểu biết."
    ms: "Ketiga-tiga pengulas rasa tutorial lemah, manakala pensyarah dikatakan mesra dan berpengetahuan."
    id: "Ketiga pengulas merasa tutorial lemah, sementara dosennya disebut ramah dan berwawasan."
    hi: "तीनों को ट्यूटोरियल कमज़ोर लगे, जबकि लेक्चरर को मिलनसार और जानकार बताया गया।"
  - en: "The exam asks specific questions; the site report helps revision, and the physics is manageable if earlier structures went well."
    zh: "考试题目很具体；工地报告有助复习，之前结构课学得好的话物理部分不难。"
    zh-TW: "考試題目很具體；工地報告有助複習，之前結構課學得好的話物理部分不難。"
    ja: "試験は具体的な問題が出る。現場レポートが復習に役立ち、前の構造科目ができていれば物理は大丈夫。"
    ko: "시험은 구체적인 문제가 나옴. 현장 보고서가 복습에 도움이 되고, 앞선 구조 과목을 잘했다면 물리는 무난함."
    vi: "Đề thi hỏi rất cụ thể; báo cáo công trường giúp ôn tập, phần vật lý ổn nếu môn kết cấu trước học tốt."
    ms: "Peperiksaan bertanya soalan spesifik; laporan tapak membantu ulang kaji, dan fizik terkawal jika subjek struktur sebelum ini baik."
    id: "Ujian berisi soal spesifik; laporan lokasi membantu belajar, dan fisikanya aman jika mata kuliah struktur sebelumnya lancar."
    hi: "एग्ज़ाम में ख़ास सवाल आते हैं; साइट रिपोर्ट दोहराने में मदद करती है, और पहले का स्ट्रक्चर विषय ठीक रहा तो फ़िज़िक्स संभल जाती है।"
workload: heavy
