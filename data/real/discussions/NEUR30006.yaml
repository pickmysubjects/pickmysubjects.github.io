points:
  - en: "Very engaging mix of neuroscience and AI, with a light workload. Reviewers said H1 grades were common."
    zh: "神经科学与AI结合，很吸引人，工作量轻；评价称H1很常见。"
    zh-TW: "神經科學與AI的結合很吸引人，份量輕；評價說H1很常見。"
    ja: "神経科学とAIの組み合わせがとても面白く、負担も軽い。H1はよく取れるとのこと。"
    ko: "신경과학과 AI의 조합이 매우 흥미롭고 공부량은 가볍다. H1이 흔하다는 후기다."
    vi: "Kết hợp khoa học thần kinh và AI rất cuốn hút, khối lượng nhẹ. Theo đánh giá, điểm H1 khá phổ biến."
    ms: "Gabungan neurosains dan AI yang sangat menarik, beban ringan. Pengulas kata gred H1 biasa."
    id: "Perpaduan neurosains dan AI yang sangat menarik, bebannya ringan. Menurut ulasan, nilai H1 umum didapat."
    hi: "न्यूरोसाइंस और AI का बहुत दिलचस्प मेल, हल्का वर्कलोड। रिव्यू के अनुसार H1 ग्रेड आम थे।"
  - en: "Assessments are marked fairly and generously, and the final project lets you be creative."
    zh: "评分公平宽松，期末项目可自由发挥。"
    zh-TW: "評分公平又寬鬆，期末專題可以自由發揮。"
    ja: "採点は公平で甘め。最終プロジェクトでは創造性を発揮できる。"
    ko: "채점이 공정하고 후하며, 기말 프로젝트에서 창의력을 발휘할 수 있다."
    vi: "Chấm điểm công bằng và rộng rãi, dự án cuối kỳ cho phép sáng tạo."
    ms: "Penilaian dimarkah dengan adil dan murah hati, dan projek akhir membolehkan anda kreatif."
    id: "Penilaiannya adil dan murah hati, dan proyek akhir memberi ruang berkreasi."
    hi: "असेसमेंट की मार्किंग फेयर और उदार है, और फ़ाइनल प्रोजेक्ट में क्रिएटिव होने की छूट है।"
  - en: "Without a coding or maths background it is harder and fast-paced, so expect some self-learning."
    zh: "没有编程或数学基础会更难、节奏快，需要一定自学。"
    zh-TW: "沒有程式或數學基礎會更難、節奏快，需要一定自學。"
    ja: "プログラミングや数学の素養がないと難しくペースも速いので、ある程度の独学は覚悟しよう。"
    ko: "코딩이나 수학 배경이 없으면 더 어렵고 빠르게 느껴지니 어느 정도 독학이 필요하다."
    vi: "Không có nền lập trình hay toán thì khó hơn và nhanh, nên chuẩn bị tự học thêm."
    ms: "Tanpa latar belakang pengekodan atau matematik ia lebih sukar dan laju, jadi jangka perlu belajar sendiri."
    id: "Tanpa latar coding atau matematika, ini lebih sulit dan cepat, jadi siap belajar mandiri."
    hi: "कोडिंग या मैथ्स बैकग्राउंड के बिना यह कठिन और तेज़ है, तो कुछ खुद सीखने की उम्मीद रखें।"
