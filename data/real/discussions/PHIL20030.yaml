code: PHIL20030
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/phil20030
reviews: 3
from: 2020
to: 2025
checked: 2026-10-17
points:
  - en: "A technical logic subject (propositional, modal and predicate logic) built around videos, notes and a weekly seminar; a 2020 reviewer noted it had been renamed Logical Methods."
    zh: "一门技术性的逻辑课（命题逻辑、模态逻辑和谓词逻辑），以视频、讲义和每周研讨课为主；一位2020年的评论者提到课程已更名为Logical Methods。"
    zh-TW: "一門技術性的邏輯課（命題邏輯、模態邏輯和述詞邏輯），以影片、講義和每週研討課為主；一位2020年的評論者提到課程已更名為Logical Methods。"
    ja: "命題論理、様相論理、述語論理を扱う技術的な論理学の科目で、動画、ノート、週1のセミナーが中心。2020年のレビューではLogical Methodsに改名されたとのこと。"
    ko: "명제논리, 양상논리, 술어논리를 다루는 기술적인 논리학 과목으로 영상, 노트, 주간 세미나가 중심. 2020년 리뷰어는 Logical Methods로 이름이 바뀌었다고 함."
    vi: "Môn logic mang tính kỹ thuật (logic mệnh đề, logic tình thái và logic vị từ) xoay quanh video, ghi chú và seminar hằng tuần; một người năm 2020 cho biết môn đã đổi tên thành Logical Methods."
    ms: "Subjek logik teknikal (logik proposisi, modal dan predikat) berasaskan video, nota dan seminar mingguan; seorang pengulas 2020 menyatakan ia dinamakan semula Logical Methods."
    id: "Mata kuliah logika teknis (logika proposisional, modal, dan predikat) berbasis video, catatan, dan seminar mingguan; pengulas 2020 mencatat namanya berubah jadi Logical Methods."
    hi: "एक तकनीकी लॉजिक विषय (प्रोपोज़िशनल, मोडल और प्रेडिकेट लॉजिक), जो वीडियो, नोट्स और साप्ताहिक सेमिनार पर आधारित है; 2020 के एक रिव्यूअर ने बताया कि इसका नाम Logical Methods हो गया।"
  - en: "Well organised and enjoyable if you keep up; even a reluctant student found it one of their best subjects, and going to tutorials to practise helps."
    zh: "组织得好，只要跟上就很享受；连一位不情愿选修的学生也觉得是最好的课之一，去辅导课练习很有帮助。"
    zh-TW: "組織得好，只要跟上就很享受；連一位不情願選修的學生也覺得是最好的課之一，去輔導課練習很有幫助。"
    ja: "運営がよく、ついていけば楽しい。しぶしぶ取った学生でさえ最高の科目の一つだったと言い、チュートリアルで練習すると役立つ。"
    ko: "운영이 잘 되고 따라가면 즐거움. 마지못해 들은 학생조차 최고의 과목 중 하나라 했고, 튜토리얼에서 연습하면 도움이 됨."
    vi: "Tổ chức tốt và thú vị nếu theo kịp; ngay cả một sinh viên miễn cưỡng chọn cũng thấy đây là một trong những môn hay nhất, và đi tutorial để luyện rất có ích."
    ms: "Teratur dan menyeronokkan jika anda ikut rentak; malah pelajar yang enggan pun dapati ia antara subjek terbaik, dan pergi ke tutorial untuk berlatih membantu."
    id: "Tertata dan menyenangkan kalau kamu mengikuti; bahkan mahasiswa yang terpaksa mengambilnya merasa ini salah satu mata kuliah terbaiknya, dan ikut tutorial untuk latihan sangat membantu."
    hi: "अच्छी तरह व्यवस्थित और साथ चलें तो मज़ेदार; बेमन से लेने वाले एक छात्र को भी यह अपने सबसे अच्छे विषयों में लगा, और अभ्यास के लिए ट्यूटोरियल जाना मदद करता है।"
