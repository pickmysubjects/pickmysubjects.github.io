points:
  - en: "Extends Newtonian mechanics into 3D, in three parts: kinematics, dynamics and collisions. One reviewer warned of **lots of fiddly, large matrices**."
    zh: "把牛顿力学扩展到三维，分为运动学、动力学和碰撞三部分。有人提醒**会碰到很多又大又繁琐的矩阵**。"
    zh-TW: "把牛頓力學擴展到三維，分為運動學、動力學和碰撞三部分。有人提醒**會碰到很多又大又繁瑣的矩陣**。"
    ja: "ニュートン力学を3次元に拡張し、運動学・動力学・衝突の3部構成。**大きくて面倒な行列が多い**という注意がある。"
    ko: "뉴턴 역학을 3차원으로 확장하며 운동학, 동역학, 충돌 세 부분으로 나뉜다. **크고 까다로운 행렬이 많다**는 경고가 있다."
    vi: "Mở rộng cơ học Newton sang 3 chiều, gồm ba phần: động học, động lực học và va chạm. Một người cảnh báo **có nhiều ma trận lớn và rắc rối**."
    ms: "Melanjutkan mekanik Newton ke 3D dalam tiga bahagian: kinematik, dinamik dan perlanggaran. Seorang memberi amaran tentang **banyak matriks besar yang leceh**."
    id: "Memperluas mekanika Newton ke 3D, dalam tiga bagian: kinematika, dinamika, dan tumbukan. Satu pengulas mengingatkan **banyak matriks besar yang ribet**."
    hi: "न्यूटनियन मैकेनिक्स को 3D तक ले जाता है, तीन हिस्सों में: काइनेमैटिक्स, डायनेमिक्स और टक्कर। एक ने चेताया कि **बड़े और झंझट भरे मैट्रिक्स बहुत हैं**।"
  - en: "Two reviewers said it was well taught with good support, and one praised the extra consultation and study sessions."
    zh: "两位评论者说教得好、支持到位，其中一位称赞老师额外开了答疑和复习课。"
    zh-TW: "兩位評論者說教得好、支援到位，其中一位稱讚老師額外開了答疑和複習課。"
    ja: "2人が教え方が良くサポートも手厚いと言い、うち1人は追加の質問・学習セッションを評価している。"
    ko: "두 명이 잘 가르치고 지원이 좋았다고 했고, 한 명은 추가 상담과 학습 세션을 칭찬했다."
    vi: "Hai người nói môn dạy tốt, hỗ trợ chu đáo, một người khen các buổi tư vấn và ôn tập thêm."
    ms: "Dua pengulas kata ia diajar dengan baik dan sokongan bagus, dan seorang memuji sesi konsultasi dan belajar tambahan."
    id: "Dua pengulas bilang pengajarannya bagus dan dukungannya baik, dan satu memuji sesi konsultasi dan belajar tambahan."
    hi: "दो रिव्यूअर्स ने कहा कि यह अच्छे से पढ़ाया गया और सपोर्ट अच्छा था, और एक ने अतिरिक्त कंसल्टेशन व स्टडी सेशंस की तारीफ़ की।"
  - en: "Content was called interesting though difficult at times, and one reviewer found the assessment manageable."
    zh: "内容被评价为有意思但有时偏难，也有人觉得考核量还可以应付。"
    zh-TW: "內容被評為有趣但有時偏難，也有人覺得評量還應付得來。"
    ja: "内容は面白いが時に難しく、評価課題はこなせる量だったという声がある。"
    ko: "내용은 흥미롭지만 때때로 어렵다는 평이고, 평가는 감당할 만했다는 의견도 있다."
    vi: "Nội dung được cho là thú vị dù đôi lúc khó, và một người thấy bài đánh giá vừa sức."
    ms: "Kandungan dikatakan menarik walaupun kadangkala sukar, dan seorang dapati penilaian boleh diurus."
    id: "Materinya disebut menarik meski kadang sulit, dan satu pengulas merasa penilaiannya masih bisa diatasi."
    hi: "कंटेंट को दिलचस्प पर कभी-कभी कठिन बताया गया, और एक को असेसमेंट संभालने लायक लगा।"
  - en: "All reviews are from 2021 or earlier, so the subject may have changed since."
    zh: "所有评论都在2021年或更早，课程之后可能已有变化。"
    zh-TW: "所有評論都在 2021 年或更早，課程之後可能已有變化。"
    ja: "レビューはすべて2021年以前のもので、その後内容が変わっている可能性がある。"
    ko: "모든 후기가 2021년 이전 것이라 이후 바뀌었을 수 있다."
    vi: "Tất cả đánh giá đều từ năm 2021 trở về trước, nên môn học có thể đã thay đổi."
    ms: "Semua ulasan dari 2021 atau lebih awal, jadi subjek ini mungkin sudah berubah."
    id: "Semua ulasan dari 2021 atau sebelumnya, jadi mata kuliah ini mungkin sudah berubah."
    hi: "सारे रिव्यू 2021 या उससे पहले के हैं, इसलिए विषय अब बदल चुका हो सकता है।"
