code: PSYC20009
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/psyc20009
reviews: 10
from: 2020
to: 2025
checked: 2026-10-08
points:
  - en: "The multiple-choice exam is widely seen as easy and carries many students' grades."
    zh: "选择题期末普遍被认为简单，是很多人拿分的主要来源。"
    zh-TW: "選擇題期末普遍被認為簡單，是很多人拿分的主要來源。"
    ja: "選択式の試験は簡単だと広く見られており、多くの学生の成績を支えています。"
    ko: "객관식 기말은 쉽다는 평이 많고 많은 학생의 성적을 받쳐줍니다."
    vi: "Bài thi trắc nghiệm được xem là dễ và là nguồn điểm chính của nhiều sinh viên."
    ms: "Peperiksaan aneka pilihan umumnya dianggap mudah dan menampung gred ramai pelajar."
    id: "Ujian pilihan ganda umumnya dianggap mudah dan jadi penopang nilai banyak mahasiswa."
    hi: "MCQ एग्ज़ाम को आम तौर पर आसान माना जाता है और कई स्टूडेंट्स के ग्रेड इसी से बनते हैं।"
  - en: "The lab report is marked harshly and due early in the semester. Start soon and follow APA style closely."
    zh: "实验报告评分严且在学期早期截止，要尽早动手并严格遵循APA格式。"
    zh-TW: "實驗報告評分嚴且在學期早期截止，要儘早動手並嚴格遵循APA格式。"
    ja: "実験レポートは採点が厳しく、締め切りも学期の早い時期です。すぐに始め、APA形式をしっかり守りましょう。"
    ko: "실험 보고서는 채점이 엄격하고 학기 초에 마감입니다. 빨리 시작하고 APA 형식을 철저히 따르세요."
    vi: "Báo cáo thí nghiệm bị chấm gắt và hạn nộp sớm trong học kỳ. Bắt đầu ngay và theo sát chuẩn APA."
    ms: "Laporan makmal dimarkah ketat dan perlu dihantar awal semester. Mula segera dan ikut gaya APA dengan teliti."
    id: "Laporan lab dinilai ketat dan tenggatnya di awal semester. Segera mulai dan ikuti gaya APA dengan cermat."
    hi: "लैब रिपोर्ट की मार्किंग सख्त है और यह सेमेस्टर में जल्दी जमा होती है। जल्दी शुरू करें और APA स्टाइल ध्यान से फॉलो करें।"
  - en: "The group debate or presentation is marked leniently."
    zh: "小组辩论或展示评分宽松。"
    zh-TW: "小組辯論或報告評分寬鬆。"
    ja: "グループディベートや発表の採点は甘めです。"
    ko: "조별 토론이나 발표는 채점이 후합니다."
    vi: "Phần tranh biện hoặc thuyết trình nhóm được chấm nhẹ tay."
    ms: "Debat atau pembentangan kumpulan dimarkah dengan longgar."
    id: "Debat atau presentasi kelompok dinilai longgar."
    hi: "ग्रुप डिबेट या प्रेज़ेंटेशन की मार्किंग नरम है।"
  - en: "Much of the content repeats first-year psychology and relies on memorising studies; several found it dry."
    zh: "很多内容与一年级心理课重复，需背大量研究，多人觉得枯燥。"
    zh-TW: "很多內容與一年級心理課重複，需背大量研究，多人覺得枯燥。"
    ja: "内容の多くは1年次の心理学の繰り返しで、研究を暗記することが中心です。退屈だという人も複数います。"
    ko: "내용 상당 부분이 1학년 심리학과 겹치고 연구를 암기해야 합니다. 지루하다는 사람이 여럿입니다."
    vi: "Phần lớn nội dung lặp lại tâm lý học năm 1 và phải học thuộc các nghiên cứu; một số người thấy khô khan."
    ms: "Banyak kandungan mengulang psikologi tahun satu dan bergantung pada hafalan kajian; beberapa dapati ia membosankan."
    id: "Banyak materi mengulang psikologi tahun pertama dan mengandalkan hafalan studi; beberapa merasa membosankan."
    hi: "ज़्यादातर कंटेंट फर्स्ट ईयर साइकोलॉजी दोहराता है और स्टडीज़ रटने पर टिका है; कई लोगों को यह नीरस लगा।"
sections:
  content:
    - en: "Content is easy but many found it dry, with lots of memorising of studies. One reviewer says it largely repeats first-year personality and social psych."
      zh: "内容不难，但很多人觉得枯燥，要背很多研究。有同学说大部分和一年级的人格与社会心理重复。"
      zh-TW: "內容不難，但很多人覺得枯燥，要背很多研究。有同學說大部分跟一年級的人格與社會心理重複。"
      ja: "内容は易しいが退屈で、多くの研究を暗記するという声が多い。1年次のパーソナリティ・社会心理学の繰り返しが多いという人も。"
      ko: "내용은 쉽지만 지루하고 연구를 많이 외워야 한다는 의견이 많다. 1학년 성격·사회심리를 대부분 반복한다는 사람도 있다."
      vi: "Nội dung dễ nhưng nhiều người thấy khô, phải nhớ nhiều nghiên cứu. Một người nói phần lớn lặp lại tâm lý nhân cách và xã hội năm nhất."
      ms: "Kandungan mudah tetapi ramai rasa hambar, banyak menghafal kajian. Seorang pengulas kata ia kebanyakannya mengulang psikologi personaliti dan sosial tahun pertama."
      id: "Materinya mudah tapi banyak yang merasa kering, banyak menghafal studi. Satu pengulas bilang sebagian besar mengulang psikologi kepribadian dan sosial tahun pertama."
      hi: "कंटेंट आसान है पर कई को नीरस लगा, ढेर सारी स्टडीज़ रटनी पड़ती हैं। एक रिव्यूअर के अनुसार यह ज़्यादातर पहले साल की पर्सनैलिटी और सोशल साइकोलॉजी दोहराता है।"
  work:
    - en: "The lab report comes early and is marked harshly by most accounts; one found the instructions vague."
      zh: "实验报告来得早，多数人说给分严；有人觉得要求很模糊。"
      zh-TW: "實驗報告來得早，多數人說給分嚴；有人覺得要求很模糊。"
      ja: "ラボレポートは早い時期にあり、採点が厳しいという声が多い。指示が曖昧だったという人も。"
      ko: "실험 보고서는 일찍 나오고 대부분 채점이 박하다고 한다. 지시가 모호했다는 사람도 있다."
      vi: "Báo cáo thí nghiệm đến sớm và theo đa số thì chấm khắt khe; một người thấy hướng dẫn mơ hồ."
      ms: "Laporan makmal datang awal dan kebanyakan kata dinilai ketat; seorang dapati arahannya kabur."
      id: "Laporan lab datang lebih awal dan menurut kebanyakan dinilai ketat; satu merasa instruksinya kabur."
      hi: "लैब रिपोर्ट जल्दी आती है और ज़्यादातर के अनुसार सख़्ती से जाँची जाती है; एक को निर्देश अस्पष्ट लगे।"
    - en: "The group debate or presentation is leniently marked. The exam is all multiple choice and most found it easy, though questions can be niche, like specific values from slides."
      zh: "小组辩论或展示给分宽松。期末全是选择题，多数人觉得简单，但题目可能很细，比如课件里的具体数值。"
      zh-TW: "小組辯論或報告給分寬鬆。期末全是選擇題，多數人覺得簡單，但題目可能很細，例如投影片裡的具體數值。"
      ja: "グループのディベートや発表は採点が甘い。期末は全問選択式で簡単という声が多いが、スライドの具体的な数値など細かい問題も。"
      ko: "조별 토론이나 발표는 채점이 후하다. 기말은 전부 객관식이고 대부분 쉬웠다지만, 슬라이드의 특정 수치처럼 지엽적인 문제도 있다."
      vi: "Tranh biện hoặc thuyết trình nhóm chấm dễ. Thi cuối toàn trắc nghiệm, đa số thấy dễ, dù câu hỏi có thể rất chi tiết như số liệu cụ thể trong slide."
      ms: "Debat atau pembentangan kumpulan dinilai longgar. Peperiksaan semuanya aneka pilihan dan kebanyakan rasa mudah, walaupun soalan boleh jadi khusus seperti nilai tertentu dari slaid."
      id: "Debat atau presentasi kelompok dinilai longgar. Ujian akhir semua pilihan ganda dan kebanyakan merasa mudah, meski soalnya bisa sangat spesifik seperti angka tertentu dari slide."
      hi: "ग्रुप डिबेट या प्रेज़ेंटेशन का अंकन नरम है। परीक्षा पूरी MCQ है और ज़्यादातर को आसान लगी, हालाँकि सवाल बारीक हो सकते हैं, जैसे स्लाइड के ख़ास मान।"
  study:
    - en: "Start the lab report early, follow APA formatting closely and use the lab-report writing module; do the lecture practice quizzes before the exam."
      zh: "实验报告早点开始，严格按 APA 格式，利用学校的实验报告写作模块；考前把每讲的练习小测都做了。"
      zh-TW: "實驗報告早點開始，嚴格照 APA 格式，利用學校的實驗報告寫作模組；考前把每講的練習小考都做了。"
      ja: "ラボレポートは早めに始め、APA書式を厳守し、レポート作成モジュールを活用。試験前に各講義の練習クイズをやる。"
      ko: "실험 보고서는 일찍 시작하고 APA 형식을 철저히 따르며 보고서 작성 모듈을 활용하라. 시험 전에 강의별 연습 퀴즈를 풀어라."
      vi: "Bắt đầu báo cáo sớm, theo sát định dạng APA và dùng module hướng dẫn viết báo cáo; làm các quiz luyện tập của từng bài giảng trước khi thi."
      ms: "Mula laporan makmal awal, ikut format APA dengan teliti dan guna modul penulisan laporan; buat kuiz latihan setiap kuliah sebelum peperiksaan."
      id: "Mulai laporan lab lebih awal, ikuti format APA dengan cermat dan pakai modul penulisan laporan; kerjakan kuis latihan tiap kuliah sebelum ujian."
      hi: "लैब रिपोर्ट जल्दी शुरू करें, APA फ़ॉर्मैटिंग का बारीकी से पालन करें और रिपोर्ट-लेखन मॉड्यूल का उपयोग करें; परीक्षा से पहले हर लेक्चर के प्रैक्टिस क्विज़ करें।"
  watch:
    - en: "Most say the easy exam carries the grade; one recent reviewer wouldn't recommend it just as a filler subject."
      zh: "多数人说靠简单的期末把成绩拉上来；有位近期的同学不建议只为凑学分来选。"
      zh-TW: "多數人說靠簡單的期末把成績拉上來；有位近期的同學不建議只為湊學分來選。"
      ja: "簡単な期末で成績を支えたという声が多い。最近の1人は単位埋めのためだけに取るのは勧めないという。"
      ko: "대부분 쉬운 기말이 성적을 끌어올렸다고 한다. 최근 한 명은 학점 채우기용으로만 듣는 건 추천하지 않는다."
      vi: "Đa số nói bài thi dễ gánh điểm; một người gần đây không khuyên chọn chỉ để lấp tín chỉ."
      ms: "Kebanyakan kata peperiksaan yang mudah menampung gred; seorang pengulas terkini tidak syorkan ia sekadar subjek pengisi."
      id: "Kebanyakan bilang ujian yang mudah menopang nilai; satu pengulas terbaru tidak menyarankannya sekadar pengisi SKS."
      hi: "ज़्यादातर कहते हैं आसान परीक्षा ग्रेड संभालती है; एक हालिया रिव्यूअर सिर्फ़ खाली जगह भरने के लिए इसे लेने की सलाह नहीं देता।"
difficulty: easy
