points:
  - en: "Very content heavy: learn each drug class's mechanism of action, side effects and uses. Flashcards such as Anki help."
    zh: "内容极多：需掌握各类药物作用机制、副作用和用途，推荐用Anki等卡片。"
    zh-TW: "內容極多：需掌握各類藥物作用機制、副作用和用途，推薦用Anki等字卡。"
    ja: "内容が非常に多く、薬のクラスごとに作用機序・副作用・用途を覚える必要があります。Ankiなどのフラッシュカードが役立ちます。"
    ko: "내용이 매우 많습니다. 약물 계열별 작용 기전, 부작용, 용도를 익혀야 하며 Anki 같은 플래시카드가 도움이 됩니다."
    vi: "Nội dung rất nặng: phải học cơ chế tác dụng, tác dụng phụ và công dụng của từng nhóm thuốc. Flashcard như Anki rất hữu ích."
    ms: "Kandungan sangat banyak: pelajari mekanisme tindakan, kesan sampingan dan kegunaan setiap kelas ubat. Kad imbas seperti Anki membantu."
    id: "Materi sangat banyak: pelajari mekanisme kerja, efek samping, dan kegunaan tiap golongan obat. Flashcard seperti Anki membantu."
    hi: "कंटेंट बहुत ज़्यादा है: हर ड्रग क्लास का मैकेनिज़्म ऑफ एक्शन, साइड इफेक्ट्स और उपयोग सीखें। Anki जैसे फ्लैशकार्ड मदद करते हैं।"
  - en: "The MST was often too long, with averages around the mid-60s, so a H1 takes steady work."
    zh: "期中常被认为太长，平均约65%，拿H1需持续努力。"
    zh-TW: "期中常被認為太長，平均約65%，拿H1需持續努力。"
    ja: "MSTは長すぎることが多く、平均は60点台半ばなので、H1には地道な努力が必要です。"
    ko: "MST는 너무 길다는 평이 많았고 평균이 60점대 중반이라 H1을 받으려면 꾸준히 해야 합니다."
    vi: "Bài MST thường quá dài, điểm trung bình khoảng giữa 60, nên muốn đạt H1 phải học đều đặn."
    ms: "MST selalunya terlalu panjang, dengan purata sekitar pertengahan 60-an, jadi H1 memerlukan usaha berterusan."
    id: "MST sering terlalu panjang dengan rata-rata sekitar pertengahan 60-an, jadi H1 butuh usaha konsisten."
    hi: "MST अक्सर बहुत लंबा होता था, औसत 60 के बीच में रहा, इसलिए H1 के लिए लगातार मेहनत चाहिए।"
  - en: "Most found it interesting and well organised. Studying physiology (PHYS20008) alongside helps a lot."
    zh: "多数认为有趣且组织好；同修生理学（PHYS20008）帮助很大。"
    zh-TW: "多數認為有趣且組織好；同修生理學（PHYS20008）幫助很大。"
    ja: "ほとんどの人が面白くて運営も良いと感じています。生理学（PHYS20008）を同時に取るとかなり助かります。"
    ko: "대부분 흥미롭고 잘 운영된다고 했습니다. 생리학(PHYS20008)을 함께 들으면 큰 도움이 됩니다."
    vi: "Đa số thấy môn thú vị và tổ chức tốt. Học song song sinh lý học (PHYS20008) giúp rất nhiều."
    ms: "Kebanyakan dapati ia menarik dan teratur. Mengambil fisiologi (PHYS20008) serentak sangat membantu."
    id: "Kebanyakan merasa menarik dan tertata. Mengambil fisiologi (PHYS20008) bersamaan sangat membantu."
    hi: "ज़्यादातर को यह दिलचस्प और अच्छी तरह व्यवस्थित लगा। साथ में फिज़ियोलॉजी (PHYS20008) पढ़ना बहुत मदद करता है।"
  - en: "The exam also tests practical content, so revise the practical slides."
    zh: "期末也考实验内容，要复习实验课件。"
    zh-TW: "期末也考實驗內容，要複習實驗課件。"
    ja: "期末試験では実習の内容も出るので、実習スライドも復習しましょう。"
    ko: "기말시험에 실습 내용도 나오니 실습 슬라이드도 복습하세요."
    vi: "Bài thi cũng hỏi nội dung thực hành, nên hãy ôn cả slide thực hành."
    ms: "Peperiksaan juga menguji kandungan amali, jadi ulang kaji slaid amali."
    id: "Ujian juga mencakup materi praktikum, jadi pelajari ulang slide praktikum."
    hi: "एग्ज़ाम में प्रैक्टिकल कंटेंट भी आता है, इसलिए प्रैक्टिकल स्लाइड्स भी दोहराएँ।"
workload: heavy
