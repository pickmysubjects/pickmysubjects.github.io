points:
  - en: "Very content heavy: learn each drug class's mechanism of action, side effects and uses. Flashcards such as Anki help."
    zh: "内容极多：需掌握各类药物作用机制、副作用和用途，推荐用Anki等卡片。"
  - en: "The MST was often too long, with averages around the mid-60s, so a H1 takes steady work."
    zh: "期中常被认为太长，平均约65%，拿H1需持续努力。"
  - en: "Most found it interesting and well organised. Studying physiology (PHYS20008) alongside helps a lot."
    zh: "多数认为有趣且组织好；同修生理学（PHYS20008）帮助很大。"
  - en: "The exam also tests practical content, so revise the practical slides."
    zh: "期末也考实验内容，要复习实验课件。"
