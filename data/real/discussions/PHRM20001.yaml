code: PHRM20001
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/phrm20001
reviews: 10
from: 2018
to: 2025
checked: 2026-10-08
points:
  - en: "Very content heavy: learn each drug class's mechanism of action, side effects and uses. Flashcards such as Anki help."
    zh: "内容极多：需掌握各类药物作用机制、副作用和用途，推荐用Anki等卡片。"
    zh-TW: "內容極多：需掌握各類藥物作用機制、副作用和用途，推薦用Anki等字卡。"
    ja: "内容が非常に多く、薬のクラスごとに作用機序・副作用・用途を覚える必要があります。Ankiなどのフラッシュカードが役立ちます。"
    ko: "내용이 매우 많습니다. 약물 계열별 작용 기전, 부작용, 용도를 익혀야 하며 Anki 같은 플래시카드가 도움이 됩니다."
    vi: "Nội dung rất nặng: phải học cơ chế tác dụng, tác dụng phụ và công dụng của từng nhóm thuốc. Flashcard như Anki rất hữu ích."
    ms: "Kandungan sangat banyak: pelajari mekanisme tindakan, kesan sampingan dan kegunaan setiap kelas ubat. Kad imbas seperti Anki membantu."
    id: "Materi sangat banyak: pelajari mekanisme kerja, efek samping, dan kegunaan tiap golongan obat. Flashcard seperti Anki membantu."
    hi: "कंटेंट बहुत ज़्यादा है: हर ड्रग क्लास का मैकेनिज़्म ऑफ एक्शन, साइड इफेक्ट्स और उपयोग सीखें। Anki जैसे फ्लैशकार्ड मदद करते हैं।"
  - en: "The MST was often too long, with averages around the mid-60s, so a H1 takes steady work."
    zh: "期中常被认为太长，平均约65%，拿H1需持续努力。"
    zh-TW: "期中常被認為太長，平均約65%，拿H1需持續努力。"
    ja: "MSTは長すぎることが多く、平均は60点台半ばなので、H1には地道な努力が必要です。"
    ko: "MST는 너무 길다는 평이 많았고 평균이 60점대 중반이라 H1을 받으려면 꾸준히 해야 합니다."
    vi: "Bài MST thường quá dài, điểm trung bình khoảng giữa 60, nên muốn đạt H1 phải học đều đặn."
    ms: "MST selalunya terlalu panjang, dengan purata sekitar pertengahan 60-an, jadi H1 memerlukan usaha berterusan."
    id: "MST sering terlalu panjang dengan rata-rata sekitar pertengahan 60-an, jadi H1 butuh usaha konsisten."
    hi: "MST अक्सर बहुत लंबा होता था, औसत 60 के बीच में रहा, इसलिए H1 के लिए लगातार मेहनत चाहिए।"
  - en: "Most found it interesting and well organised. Studying physiology (PHYS20008) alongside helps a lot."
    zh: "多数认为有趣且组织好；同修生理学（PHYS20008）帮助很大。"
    zh-TW: "多數認為有趣且組織好；同修生理學（PHYS20008）幫助很大。"
    ja: "ほとんどの人が面白くて運営も良いと感じています。生理学（PHYS20008）を同時に取るとかなり助かります。"
    ko: "대부분 흥미롭고 잘 운영된다고 했습니다. 생리학(PHYS20008)을 함께 들으면 큰 도움이 됩니다."
    vi: "Đa số thấy môn thú vị và tổ chức tốt. Học song song sinh lý học (PHYS20008) giúp rất nhiều."
    ms: "Kebanyakan dapati ia menarik dan teratur. Mengambil fisiologi (PHYS20008) serentak sangat membantu."
    id: "Kebanyakan merasa menarik dan tertata. Mengambil fisiologi (PHYS20008) bersamaan sangat membantu."
    hi: "ज़्यादातर को यह दिलचस्प और अच्छी तरह व्यवस्थित लगा। साथ में फिज़ियोलॉजी (PHYS20008) पढ़ना बहुत मदद करता है।"
  - en: "The exam also tests practical content, so revise the practical slides."
    zh: "期末也考实验内容，要复习实验课件。"
    zh-TW: "期末也考實驗內容，要複習實驗課件。"
    ja: "期末試験では実習の内容も出るので、実習スライドも復習しましょう。"
    ko: "기말시험에 실습 내용도 나오니 실습 슬라이드도 복습하세요."
    vi: "Bài thi cũng hỏi nội dung thực hành, nên hãy ôn cả slide thực hành."
    ms: "Peperiksaan juga menguji kandungan amali, jadi ulang kaji slaid amali."
    id: "Ujian juga mencakup materi praktikum, jadi pelajari ulang slide praktikum."
    hi: "एग्ज़ाम में प्रैक्टिकल कंटेंट भी आता है, इसलिए प्रैक्टिकल स्लाइड्स भी दोहराएँ।"
sections:
  content:
    - en: "Basic principles, then many drug classes for asthma, gut, heart, diabetes, brain and more. Most found it fascinating but very content-heavy, with lots of memorising of mechanisms."
      zh: "先讲基本原理，再讲治疗哮喘、肠胃、心血管、糖尿病、神经等的各类药物。多数人觉得很有意思，但内容超多，要背大量作用机制。"
      zh-TW: "先講基本原理，再講治療氣喘、腸胃、心血管、糖尿病、神經等的各類藥物。多數人覺得很有趣，但內容超多，要背大量作用機制。"
      ja: "基本原理の後、喘息・消化器・循環器・糖尿病・脳などの多くの薬物クラスを扱う。面白いが内容がとても多く、作用機序の暗記量が多いという声が多い。"
      ko: "기본 원리 후 천식, 소화기, 심혈관, 당뇨, 뇌 등 여러 약물 계열을 다룬다. 대부분 흥미롭지만 내용이 매우 많고 기전 암기가 많다고 한다."
      vi: "Nguyên lý cơ bản rồi đến nhiều nhóm thuốc cho hen, tiêu hóa, tim mạch, tiểu đường, thần kinh... Đa số thấy cuốn hút nhưng rất nặng nội dung, phải nhớ nhiều cơ chế."
      ms: "Prinsip asas, kemudian banyak kelas ubat untuk asma, usus, jantung, diabetes, otak dan lain-lain. Kebanyakan rasa menarik tetapi sangat padat, banyak menghafal mekanisme."
      id: "Prinsip dasar, lalu banyak golongan obat untuk asma, pencernaan, jantung, diabetes, otak dan lainnya. Kebanyakan merasa memukau tapi sangat padat, banyak menghafal mekanisme."
      hi: "बुनियादी सिद्धांत, फिर अस्थमा, पाचन, हृदय, मधुमेह, मस्तिष्क आदि की कई दवा श्रेणियाँ। ज़्यादातर को यह रोचक पर बहुत कंटेंट वाला लगा, क्रियाविधियाँ बहुत याद करनी पड़ती हैं।"
    - en: "Physiology helps a lot; several recommend taking it alongside Human Physiology or similar biomed subjects because of the overlap."
      zh: "有生理学基础帮助很大；好几位建议和 Human Physiology 或类似的生物医学课一起修，内容有重叠。"
      zh-TW: "有生理學基礎幫助很大；好幾位建議跟 Human Physiology 或類似的生物醫學課一起修，內容有重疊。"
      ja: "生理学の知識が大いに役立つ。内容が重なるのでHuman Physiologyなどと同時履修を勧める声が複数。"
      ko: "생리학 지식이 큰 도움이 된다. 내용이 겹치니 Human Physiology 같은 생물의학 과목과 함께 들으라는 사람이 여럿이다."
      vi: "Có nền sinh lý giúp rất nhiều; vài người khuyên học cùng Human Physiology hoặc các môn y sinh tương tự vì nội dung trùng nhau."
      ms: "Fisiologi sangat membantu; beberapa orang syorkan ambil bersama Human Physiology atau subjek bioperubatan serupa kerana bertindih."
      id: "Fisiologi sangat membantu; beberapa menyarankan mengambilnya bersamaan dengan Human Physiology atau mata kuliah biomedis serupa karena tumpang tindih."
      hi: "फ़िज़ियोलॉजी बहुत मदद करती है; कई इसे Human Physiology या मिलते-जुलते बायोमेड विषयों के साथ लेने की सलाह देते हैं क्योंकि कंटेंट ओवरलैप होता है।"
  work:
    - en: "Weekly quizzes, an MST and a final that also tests practicals. Multiple choice is fair, but short answers are marked strictly; the MST was called long, with averages in the 60s."
      zh: "每周小测、一次 MST 和期末，期末也考实验内容。选择题公平，但简答题给分严；MST 被说很长，平均分在 60 多。"
      zh-TW: "每週小考、一次 MST 和期末，期末也考實驗內容。選擇題公平，但簡答題給分嚴；MST 被說很長，平均分在 60 多。"
      ja: "毎週のクイズ、MST、実習内容も出る期末。選択問題は公平だが記述の採点は厳しい。MSTは長く、平均は60点台だったという。"
      ko: "주간 퀴즈, MST, 실습 내용도 나오는 기말이 있다. 객관식은 공정하지만 단답형 채점이 엄격하다. MST는 길었고 평균이 60점대였다고 한다."
      vi: "Quiz hằng tuần, một MST và thi cuối có hỏi cả thực hành. Trắc nghiệm công bằng nhưng câu trả lời ngắn chấm chặt; MST được nói là dài, trung bình khoảng 60 điểm."
      ms: "Kuiz mingguan, satu MST dan peperiksaan akhir yang turut menguji amali. Aneka pilihan adil, tetapi jawapan pendek dinilai ketat; MST dikatakan panjang dengan purata 60an."
      id: "Kuis mingguan, satu MST dan ujian akhir yang juga menguji praktikum. Pilihan ganda adil, tapi jawaban singkat dinilai ketat; MST disebut panjang dengan rata-rata 60-an."
      hi: "साप्ताहिक क्विज़, एक MST और फ़ाइनल जो प्रैक्टिकल भी परखता है। MCQ उचित हैं, पर छोटे उत्तरों का अंकन सख़्त; MST लंबा बताया गया, औसत 60 के आसपास।"
  study:
    - en: "Focus on drug classes, mechanisms of action and side effects rather than drug names; several used Anki, and revise practical slides for the exam."
      zh: "重点记药物类别、作用机制和副作用，而不是药名；好几位用 Anki，考前复习实验课件。"
      zh-TW: "重點記藥物類別、作用機制和副作用，而不是藥名；好幾位用 Anki，考前複習實驗投影片。"
      ja: "薬の名前より薬物クラス、作用機序、副作用に集中。Ankiを使った人が複数。試験前に実習スライドも復習する。"
      ko: "약 이름보다 약물 계열, 작용 기전, 부작용에 집중하라. Anki를 쓴 사람이 여럿이다. 시험 전엔 실습 슬라이드도 복습하라."
      vi: "Tập trung vào nhóm thuốc, cơ chế tác dụng và tác dụng phụ hơn là tên thuốc; vài người dùng Anki, và ôn slide thực hành trước thi."
      ms: "Fokus pada kelas ubat, mekanisme tindakan dan kesan sampingan berbanding nama ubat; beberapa guna Anki, dan ulang kaji slaid amali untuk peperiksaan."
      id: "Fokus pada golongan obat, mekanisme kerja dan efek samping daripada nama obat; beberapa memakai Anki, dan ulas slide praktikum sebelum ujian."
      hi: "दवाओं के नाम से ज़्यादा दवा श्रेणियों, क्रियाविधि और दुष्प्रभावों पर ध्यान दें; कई ने Anki इस्तेमाल किया, और परीक्षा के लिए प्रैक्टिकल स्लाइड दोहराएँ।"
  watch:
    - en: "An H1 is achievable but takes steady work; falling behind on the dense lectures makes it much harder."
      zh: "H1 能拿，但要稳定投入；内容密的讲座一落下就难多了。"
      zh-TW: "H1 拿得到，但要穩定投入；內容密的講座一落後就難多了。"
      ja: "H1は取れるが着実な努力が必要。密度の高い講義に遅れるとずっと大変になる。"
      ko: "H1은 가능하지만 꾸준한 노력이 필요하다. 빽빽한 강의에서 뒤처지면 훨씬 힘들어진다."
      vi: "Có thể đạt H1 nhưng cần học đều; tụt lại với các bài giảng dày đặc sẽ khó hơn nhiều."
      ms: "H1 boleh dicapai tetapi perlu usaha berterusan; ketinggalan kuliah yang padat menjadikannya lebih sukar."
      id: "H1 bisa dicapai tapi perlu usaha rutin; tertinggal dari kuliah yang padat membuatnya jauh lebih sulit."
      hi: "H1 संभव है पर लगातार मेहनत चाहिए; घने लेक्चरों में पीछे छूटने पर यह बहुत कठिन हो जाता है।"
workload: heavy
