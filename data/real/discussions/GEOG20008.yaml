points:
  - en: "Recent reviewers (2020-2022) praised engaging teaching, a manageable workload and straightforward, short assignments."
    zh: "近年的评论者（2020-2022）称赞教学生动、工作量适中、作业简短直接。"
    zh-TW: "近年的評論者（2020-2022）稱讚教學生動、工作量適中、作業簡短直接。"
    ja: "最近のレビュー（2020-2022）は、引き込まれる授業、無理のない負担、短く素直な課題を評価。"
    ko: "최근 리뷰(2020-2022)는 흥미로운 수업, 적당한 학습량, 짧고 명확한 과제를 칭찬함."
    vi: "Các đánh giá gần đây (2020-2022) khen cách dạy cuốn hút, khối lượng vừa phải và bài tập ngắn gọn, dễ hiểu."
    ms: "Pengulas terkini (2020-2022) memuji pengajaran yang menarik, beban kerja munasabah dan tugasan pendek yang jelas."
    id: "Pengulas terbaru (2020-2022) memuji pengajaran yang menarik, beban kerja wajar, dan tugas yang singkat serta lugas."
    hi: "हाल के रिव्यूअर्स (2020-2022) ने दिलचस्प पढ़ाई, संभालने लायक वर्कलोड और छोटे, सीधे असाइनमेंट की तारीफ़ की।"
  - en: "It focuses on inequality in cities with a Melbourne angle; earlier reviewers found lectures dry and discussion one-sided."
    zh: "课程聚焦城市不平等，以墨尔本为例；早期评论者觉得讲座枯燥、讨论偏向一边。"
    zh-TW: "課程聚焦城市不平等，以墨爾本為例；早期評論者覺得講課乏味、討論偏向一邊。"
    ja: "都市の不平等をメルボルンの視点で扱う。以前のレビューでは講義が退屈で議論が一方的とされた。"
    ko: "도시 불평등을 멜버른 관점에서 다룸. 예전 리뷰어들은 강의가 건조하고 토론이 한쪽으로 치우쳤다고 함."
    vi: "Môn tập trung vào bất bình đẳng đô thị với góc nhìn Melbourne; người đánh giá trước đây thấy bài giảng khô và thảo luận một chiều."
    ms: "Ia memberi tumpuan kepada ketidaksamaan di bandar dengan sudut Melbourne; pengulas terdahulu dapati kuliah hambar dan perbincangan berat sebelah."
    id: "Fokusnya ketimpangan di kota dengan sudut pandang Melbourne; pengulas terdahulu merasa kuliahnya kering dan diskusinya berat sebelah."
    hi: "यह शहरों में असमानता पर केंद्रित है, मेलबर्न के नज़रिए से; पहले के रिव्यूअर्स को लेक्चर नीरस और चर्चा एकतरफ़ा लगी।"
difficulty: easy
workload: light
