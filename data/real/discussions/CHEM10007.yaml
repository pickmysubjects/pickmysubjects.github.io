points:
  - en: "Many call it very well run and taught, and doable even with no prior chemistry background."
    zh: "许多人认为课程运作和教学都很好，即使没有化学基础也能学好。"
    zh-TW: "許多人說課程辦得和教得都很好，即使沒有化學基礎也能應付。"
    ja: "運営も授業もとても良く、化学の経験がなくてもついていけるという声が多い。"
    ko: "운영과 강의가 아주 좋고, 화학 배경이 없어도 할 만하다는 사람이 많다."
    vi: "Nhiều người nói môn được tổ chức và giảng dạy rất tốt, kể cả không có nền hóa học vẫn học được."
    ms: "Ramai kata ia diurus dan diajar dengan sangat baik, dan boleh diikuti walaupun tanpa latar belakang kimia."
    id: "Banyak yang bilang pengelolaan dan pengajarannya sangat baik, dan bisa diikuti meski tanpa latar kimia."
    hi: "कई लोग कहते हैं यह बहुत अच्छी तरह चलाया और पढ़ाया जाता है, और बिना केमिस्ट्री बैकग्राउंड के भी संभव है।"
  - en: "The workload is heavy because it squeezes years of high school chemistry into one semester, so coverage isn't deep."
    zh: "工作量大，因为一学期压缩了高中几年的化学内容，讲解不会很深入。"
    zh-TW: "工作量大，因為一學期塞進好幾年的高中化學，所以講得不深。"
    ja: "高校化学の数年分を1学期に詰め込むため負担が大きく、その分内容は深くない。"
    ko: "고교 화학 몇 년 치를 한 학기에 몰아넣어 공부량이 많고, 그래서 깊이 다루지는 않는다."
    vi: "Khối lượng nặng vì dồn mấy năm hóa cấp 3 vào một học kỳ, nên không đi sâu."
    ms: "Beban kerja berat kerana ia memampatkan kimia sekolah menengah bertahun-tahun ke dalam satu semester, jadi liputannya tidak mendalam."
    id: "Bebannya berat karena memadatkan kimia SMA bertahun-tahun ke satu semester, jadi pembahasannya tidak mendalam."
    hi: "वर्कलोड भारी है क्योंकि कई साल की हाई-स्कूल केमिस्ट्री एक सेमेस्टर में ठूँसी गई है, इसलिए गहराई कम है।"
  - en: "Keep up weekly and practise problems. Tutorials and past papers help most, and the organic part of the exam is the hardest."
    zh: "要每周跟进并多做题；辅导课和往年试卷最有帮助，考试中有机部分最难。"
    zh-TW: "每週跟上進度並多練習題目。輔導課和考古題最有幫助，考試中有機部分最難。"
    ja: "毎週遅れずに問題演習をしよう。チュートリアルと過去問が一番役立ち、試験では有機化学が一番難しい。"
    ko: "매주 진도를 따라가고 문제를 풀자. 튜토리얼과 기출문제가 가장 도움이 되고, 시험에서는 유기 파트가 가장 어렵다."
    vi: "Theo kịp mỗi tuần và luyện bài tập. Tutorial và đề cũ giúp nhiều nhất, phần hữu cơ trong đề thi là khó nhất."
    ms: "Ikut rentak setiap minggu dan latih soalan. Tutorial dan kertas lepas paling membantu, dan bahagian organik dalam peperiksaan paling sukar."
    id: "Ikuti tiap minggu dan latih soal. Tutorial dan soal tahun lalu paling membantu, dan bagian organik di ujian paling sulit."
    hi: "हर हफ़्ते साथ चलें और सवाल प्रैक्टिस करें। ट्यूटोरियल और पिछले पेपर सबसे मददगार हैं, और परीक्षा का ऑर्गेनिक हिस्सा सबसे कठिन है।"
workload: heavy
difficulty: mixed
