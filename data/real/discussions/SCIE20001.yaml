code: SCIE20001
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/scie20001
reviews: 10
from: 2017
to: 2025
checked: 2026-10-08
points:
  - en: "It is online and essay-based with a take-home exam, and the workload is lighter than most subjects."
    zh: "全在线、以写作为主，期末是带回家完成的考试，工作量比多数课程轻。"
    zh-TW: "全線上、以寫作為主，期末是帶回家完成的考試，工作量比多數科目輕。"
    ja: "オンラインでエッセイ中心、試験は持ち帰り式で、ほとんどの科目より負担が軽いです。"
    ko: "온라인이고 에세이 위주이며 시험은 집에서 보는 테이크홈이고, 대부분 과목보다 부담이 적습니다."
    vi: "Học online, chủ yếu viết luận, thi mang về nhà, và khối lượng nhẹ hơn hầu hết các môn."
    ms: "Ia dalam talian dan berasaskan esei dengan peperiksaan bawa pulang, dan beban kerja lebih ringan daripada kebanyakan subjek."
    id: "Online dan berbasis esai dengan ujian take-home, dan beban kerjanya lebih ringan dari kebanyakan mata kuliah."
    hi: "यह ऑनलाइन और निबंध-आधारित है, टेक-होम एग्ज़ाम के साथ, और वर्कलोड ज़्यादातर सब्जेक्ट्स से हल्का है।"
  - en: "Many reviewers found marking subjective and instructions or rubrics vague, so it is not the easy H1 some expect."
    zh: "很多评价认为评分主观、说明和评分标准模糊，并非预想中的轻松H1。"
    zh-TW: "很多評價認為評分主觀、說明和評分標準模糊，並非預想中的輕鬆H1。"
    ja: "採点が主観的で指示やルーブリックがあいまいだという声が多く、期待されるほど楽にH1は取れません。"
    ko: "채점이 주관적이고 안내나 루브릭이 모호하다는 후기가 많아, 기대만큼 쉬운 H1은 아닙니다."
    vi: "Nhiều người thấy chấm điểm chủ quan, hướng dẫn và rubric mơ hồ, nên không phải H1 dễ như một số người nghĩ."
    ms: "Ramai pengulas dapati pemarkahan subjektif dan arahan atau rubrik kabur, jadi ia bukan H1 mudah seperti yang dijangka."
    id: "Banyak pengulas menilai penilaiannya subjektif dan instruksi atau rubrik kabur, jadi bukan H1 mudah seperti yang diharapkan."
    hi: "कई रिव्यूअर्स को मार्किंग सब्जेक्टिव और निर्देश या रूब्रिक अस्पष्ट लगे, इसलिए यह उतना आसान H1 नहीं जितना कुछ सोचते हैं।"
  - en: "Recorded lectures are old and often only loosely related to the assessments."
    zh: "录播讲座陈旧，与作业关联常常不大。"
    zh-TW: "錄播講座老舊，與作業關聯常常不大。"
    ja: "録画講義は古く、評価課題との関係が薄いことが多いです。"
    ko: "녹화 강의는 오래됐고 평가와 관련이 적은 경우가 많습니다."
    vi: "Bài giảng ghi sẵn đã cũ và thường ít liên quan đến bài đánh giá."
    ms: "Kuliah rakaman sudah lama dan selalunya kurang berkait dengan penilaian."
    id: "Kuliah rekaman sudah lama dan sering kurang terkait dengan penilaian."
    hi: "रिकॉर्डेड लेक्चर पुराने हैं और अक्सर असेसमेंट से कम जुड़े होते हैं।"
sections:
  content:
    - en: "Fully online with recorded lectures. Many say the videos are old and recycled, and much of the general content is irrelevant to the assignments; a few found the very basic stats module interesting."
      zh: "全网课，讲座是录好的视频。很多人说视频很旧、年年重复用，很多通用内容和作业没关系；少数人觉得很基础的统计模块挺有意思。"
      zh-TW: "全線上課，講座是錄好的影片。很多人說影片很舊、年年重複用，很多通用內容跟作業沒關係；少數人覺得很基礎的統計模組蠻有趣。"
      ja: "完全オンラインで録画講義。動画は古く使い回しで、一般的な内容の多くは課題と無関係という声が多い。ごく基礎的な統計モジュールを面白いと感じた人も少数。"
      ko: "완전 온라인이고 녹화 강의다. 영상이 오래되고 재활용되며 일반 내용 대부분이 과제와 무관하다는 의견이 많다. 아주 기초적인 통계 모듈이 흥미로웠다는 사람도 몇 있다."
      vi: "Học hoàn toàn online với video ghi sẵn. Nhiều người nói video cũ, dùng lại nhiều năm, phần nội dung chung phần lớn không liên quan bài tập; vài người thấy phần thống kê rất cơ bản khá thú vị."
      ms: "Sepenuhnya dalam talian dengan kuliah rakaman. Ramai kata video lama dan dikitar semula, banyak kandungan umum tidak berkaitan tugasan; beberapa orang dapati modul statistik asas menarik."
      id: "Sepenuhnya online dengan kuliah rekaman. Banyak yang bilang videonya lama dan didaur ulang, banyak materi umum tak relevan dengan tugas; beberapa orang merasa modul statistik dasarnya menarik."
      hi: "पूरी तरह ऑनलाइन, रिकॉर्डेड लेक्चर। कई कहते हैं वीडियो पुराने और दोहराए गए हैं, और सामान्य कंटेंट का बड़ा हिस्सा असाइनमेंट से जुड़ा नहीं; कुछ को बहुत बुनियादी स्टैट्स मॉड्यूल रोचक लगा।"
  work:
    - en: "Short essay-style assignments every couple of weeks and a take-home essay exam. Many say marking is subjective and the rubrics vague or missing."
      zh: "大约每两周一个短篇论文式作业，期末是带回家写的论文。很多人说评分主观，评分标准模糊甚至没有。"
      zh-TW: "大約每兩週一個短篇論文式作業，期末是帶回家寫的論文。很多人說評分主觀，評分標準模糊甚至沒有。"
      ja: "2週ごとくらいに短いエッセイ型課題があり、期末は持ち帰りのエッセイ試験。採点が主観的で、ルーブリックが曖昧・ないという声が多い。"
      ko: "2주마다 짧은 에세이형 과제가 있고 기말은 재택 에세이 시험이다. 채점이 주관적이고 루브릭이 모호하거나 없다는 의견이 많다."
      vi: "Khoảng hai tuần một bài viết ngắn dạng luận và một bài thi luận làm ở nhà. Nhiều người nói chấm điểm cảm tính, tiêu chí mơ hồ hoặc không có."
      ms: "Tugasan gaya esei pendek setiap dua minggu dan peperiksaan esei bawa pulang. Ramai kata pemarkahan subjektif dan rubrik kabur atau tiada."
      id: "Tugas gaya esai pendek tiap dua minggu dan ujian esai take-home. Banyak yang bilang penilaiannya subjektif dan rubriknya kabur atau tidak ada."
      hi: "हर दो हफ़्ते के आसपास छोटे निबंध जैसे असाइनमेंट और टेक-होम निबंध परीक्षा। कई कहते हैं अंकन व्यक्तिपरक है और रूब्रिक अस्पष्ट या ग़ायब।"
    - en: "One reviewer found the take-home exam harder and marked more strictly than the assignments."
      zh: "有同学觉得带回家考试比平时作业难，评分也更严。"
      zh-TW: "有同學覺得帶回家考試比平時作業難，評分也更嚴。"
      ja: "持ち帰り試験は課題より難しく採点も厳しかったという人も。"
      ko: "재택 시험이 과제보다 어렵고 채점도 더 엄격했다는 사람도 있다."
      vi: "Một người thấy bài thi làm ở nhà khó hơn và chấm chặt hơn các bài tập."
      ms: "Seorang pengulas dapati peperiksaan bawa pulang lebih sukar dan dinilai lebih ketat berbanding tugasan."
      id: "Satu pengulas merasa ujian take-home lebih sulit dan dinilai lebih ketat dari tugas."
      hi: "एक रिव्यूअर को टेक-होम परीक्षा असाइनमेंट से कठिन और ज़्यादा सख़्ती से जाँची गई लगी।"
  study:
    - en: "Follow each rubric closely and watch the module videos tied to assessments; the discussion board is a good place to ask questions."
      zh: "严格对照每份评分标准写，看和作业相关的模块视频；有问题去讨论区问。"
      zh-TW: "嚴格對照每份評分標準寫，看跟作業相關的模組影片；有問題去討論區問。"
      ja: "各ルーブリックに忠実に従い、課題に関係するモジュール動画を見る。質問は掲示板で。"
      ko: "각 루브릭을 꼼꼼히 따르고 과제와 연결된 모듈 영상을 봐라. 질문은 게시판에서 하면 좋다."
      vi: "Bám sát từng tiêu chí chấm và xem video module liên quan bài tập; diễn đàn thảo luận là nơi tốt để hỏi."
      ms: "Ikut setiap rubrik dengan teliti dan tonton video modul yang berkaitan tugasan; papan perbincangan sesuai untuk bertanya."
      id: "Ikuti tiap rubrik dengan cermat dan tonton video modul yang terkait tugas; forum diskusi tempat yang baik untuk bertanya."
      hi: "हर रूब्रिक का बारीकी से पालन करें और असेसमेंट से जुड़े मॉड्यूल वीडियो देखें; सवालों के लिए डिस्कशन बोर्ड अच्छा है।"
  watch:
    - en: "Light workload, but most reviewers warn it is not the easy H1 it seems, mainly because of unpredictable marking and slow or thin feedback."
      zh: "工作量轻，但多数人提醒它并不像看起来那样轻松拿 H1，主要是评分难以预测，反馈又慢又少。"
      zh-TW: "工作量輕，但多數人提醒它並不像看起來那樣輕鬆拿 H1，主要是評分難以預測，回饋又慢又少。"
      ja: "負担は軽いが、見た目ほど簡単にH1は取れないという警告が多い。主に採点が読めず、フィードバックが遅く少ないため。"
      ko: "부담은 적지만 보기만큼 H1이 쉽지 않다는 경고가 많다. 주로 채점이 예측 불가하고 피드백이 느리고 빈약해서다."
      vi: "Khối lượng nhẹ, nhưng đa số cảnh báo không dễ H1 như tưởng, chủ yếu vì chấm điểm khó đoán và phản hồi chậm, sơ sài."
      ms: "Beban ringan, tetapi kebanyakan beri amaran ia bukan H1 mudah seperti disangka, terutamanya kerana pemarkahan sukar dijangka dan maklum balas lambat."
      id: "Bebannya ringan, tapi kebanyakan mengingatkan H1 tidak semudah kelihatannya, terutama karena penilaian sulit ditebak dan umpan balik lambat serta minim."
      hi: "काम हल्का है, पर ज़्यादातर चेताते हैं कि H1 उतना आसान नहीं जितना दिखता, मुख्यतः अप्रत्याशित अंकन और धीमे, कम फ़ीडबैक के कारण।"
workload: light
