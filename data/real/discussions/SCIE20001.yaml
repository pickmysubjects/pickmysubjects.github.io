reviews: 10
from: 2017
to: 2025
checked: 2026-10-08
points:
  - en: "It is online and essay-based with a take-home exam, and the workload is lighter than most subjects."
    zh: "全在线、以写作为主，期末是带回家完成的考试，工作量比多数课程轻。"
    zh-TW: "全線上、以寫作為主，期末是帶回家完成的考試，工作量比多數科目輕。"
    ja: "オンラインでエッセイ中心、試験は持ち帰り式で、ほとんどの科目より負担が軽いです。"
    ko: "온라인이고 에세이 위주이며 시험은 집에서 보는 테이크홈이고, 대부분 과목보다 부담이 적습니다."
    vi: "Học online, chủ yếu viết luận, thi mang về nhà, và khối lượng nhẹ hơn hầu hết các môn."
    ms: "Ia dalam talian dan berasaskan esei dengan peperiksaan bawa pulang, dan beban kerja lebih ringan daripada kebanyakan subjek."
    id: "Online dan berbasis esai dengan ujian take-home, dan beban kerjanya lebih ringan dari kebanyakan mata kuliah."
    hi: "यह ऑनलाइन और निबंध-आधारित है, टेक-होम एग्ज़ाम के साथ, और वर्कलोड ज़्यादातर सब्जेक्ट्स से हल्का है।"
  - en: "Many reviewers found marking subjective and instructions or rubrics vague, so it is not the easy H1 some expect."
    zh: "很多评价认为评分主观、说明和评分标准模糊，并非预想中的轻松H1。"
    zh-TW: "很多評價認為評分主觀、說明和評分標準模糊，並非預想中的輕鬆H1。"
    ja: "採点が主観的で指示やルーブリックがあいまいだという声が多く、期待されるほど楽にH1は取れません。"
    ko: "채점이 주관적이고 안내나 루브릭이 모호하다는 후기가 많아, 기대만큼 쉬운 H1은 아닙니다."
    vi: "Nhiều người thấy chấm điểm chủ quan, hướng dẫn và rubric mơ hồ, nên không phải H1 dễ như một số người nghĩ."
    ms: "Ramai pengulas dapati pemarkahan subjektif dan arahan atau rubrik kabur, jadi ia bukan H1 mudah seperti yang dijangka."
    id: "Banyak pengulas menilai penilaiannya subjektif dan instruksi atau rubrik kabur, jadi bukan H1 mudah seperti yang diharapkan."
    hi: "कई रिव्यूअर्स को मार्किंग सब्जेक्टिव और निर्देश या रूब्रिक अस्पष्ट लगे, इसलिए यह उतना आसान H1 नहीं जितना कुछ सोचते हैं।"
  - en: "Recorded lectures are old and often only loosely related to the assessments."
    zh: "录播讲座陈旧，与作业关联常常不大。"
    zh-TW: "錄播講座老舊，與作業關聯常常不大。"
    ja: "録画講義は古く、評価課題との関係が薄いことが多いです。"
    ko: "녹화 강의는 오래됐고 평가와 관련이 적은 경우가 많습니다."
    vi: "Bài giảng ghi sẵn đã cũ và thường ít liên quan đến bài đánh giá."
    ms: "Kuliah rakaman sudah lama dan selalunya kurang berkait dengan penilaian."
    id: "Kuliah rekaman sudah lama dan sering kurang terkait dengan penilaian."
    hi: "रिकॉर्डेड लेक्चर पुराने हैं और अक्सर असेसमेंट से कम जुड़े होते हैं।"
workload: light
