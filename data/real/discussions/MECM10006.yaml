to: 2023
checked: 2026-10-17
points:
  - en: "A practical writing subject covering news, profiles, reviews and similar styles, built around two folios that need interviews. Those interested in journalism liked building a portfolio."
    zh: "实践型写作课，涵盖新闻、人物特写、评论等文体，围绕两份需要采访的作品集展开。对新闻感兴趣的人喜欢借此积累作品集。"
    zh-TW: "實務型寫作課，涵蓋新聞、人物特寫、評論等文體，圍繞兩份需要採訪的作品集展開。對新聞有興趣的人喜歡藉此累積作品集。"
    ja: "ニュース、人物紹介、レビューなどの文体を扱う実践的な文章科目で、取材が必要な2つのフォリオが中心。ジャーナリズムに興味がある人はポートフォリオ作りを評価。"
    ko: "뉴스, 인물 기사, 리뷰 등 문체를 다루는 실전 글쓰기 과목으로, 인터뷰가 필요한 두 개의 폴리오가 중심. 저널리즘에 관심 있는 사람은 포트폴리오를 쌓을 수 있어 좋아함."
    vi: "Môn viết thực hành gồm tin tức, chân dung, bình luận và các thể loại tương tự, xoay quanh hai tập bài cần phỏng vấn. Người quan tâm báo chí thích việc xây dựng portfolio."
    ms: "Subjek penulisan praktikal merangkumi berita, profil, ulasan dan gaya serupa, berasaskan dua folio yang memerlukan temu bual. Mereka yang berminat kewartawanan suka membina portfolio."
    id: "Mata kuliah menulis praktis yang mencakup berita, profil, ulasan dan gaya serupa, berpusat pada dua folio yang butuh wawancara. Yang tertarik jurnalisme suka membangun portofolio."
    hi: "व्यावहारिक लेखन विषय, जिसमें न्यूज़, प्रोफ़ाइल, रिव्यू जैसी शैलियाँ हैं, और दो फ़ोलियो जिनमें इंटरव्यू करने होते हैं। पत्रकारिता में रुचि वालों को पोर्टफ़ोलियो बनाना पसंद आया।"
  - en: "Lectures are light and fairly common-sense; some found the content too basic. Draft and peer-review deadlines keep you on track but can feel rushed, and a 2019 reviewer found marking harsh."
    zh: "讲座内容轻松，偏常识；有人觉得太基础。草稿和互评的截止日期能督促进度，但可能显得仓促，一位2019年的评论者觉得评分严格。"
    zh-TW: "講座內容輕鬆，偏常識；有人覺得太基礎。草稿和互評的截止日期能督促進度，但可能顯得倉促，一位2019年的評論者覺得評分嚴格。"
    ja: "講義は軽めでほぼ常識的な内容で、基礎的すぎると感じた人も。下書きや相互レビューの締切でペースは保てるが慌ただしく感じることも。2019年のレビューでは採点が厳しいとされた。"
    ko: "강의는 가볍고 상식적인 편이라 너무 기초적이라는 사람도. 초안·동료평가 마감이 진도를 잡아주지만 촉박할 수 있음. 2019년 리뷰어는 채점이 엄격하다고 함."
    vi: "Bài giảng nhẹ và khá thông thường; có người thấy quá cơ bản. Hạn nộp bản nháp và chấm chéo giúp giữ tiến độ nhưng có thể gấp gáp, và một người năm 2019 thấy chấm điểm khắt khe."
    ms: "Kuliah ringan dan agak akal biasa; ada yang dapati terlalu asas. Tarikh akhir draf dan semakan rakan membantu kekal di landasan tetapi boleh terasa tergesa-gesa, dan seorang pengulas 2019 dapati pemarkahan ketat."
    id: "Kuliah ringan dan cukup akal sehat; ada yang merasa terlalu dasar. Tenggat draf dan tinjauan sejawat menjaga ritme tapi bisa terasa terburu-buru, dan seorang pengulas 2019 merasa penilaiannya ketat."
    hi: "लेक्चर हल्के और काफ़ी सामान्य समझ वाले हैं; कुछ को कंटेंट बहुत बुनियादी लगा। ड्राफ़्ट और पीयर-रिव्यू की डेडलाइन ट्रैक पर रखती हैं पर जल्दबाज़ी लग सकती है, और 2019 के एक रिव्यूअर को मार्किंग सख़्त लगी।"
workload: light
