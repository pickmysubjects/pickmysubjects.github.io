code: MECM10006
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/mecm10006
reviews: 10
from: 2016
to: 2023
checked: 2026-10-17
points:
  - en: "A practical writing subject covering news, profiles, reviews and similar styles, built around two folios that need interviews. Those interested in journalism liked building a portfolio."
    zh: "实践型写作课，涵盖新闻、人物特写、评论等文体，围绕两份需要采访的作品集展开。对新闻感兴趣的人喜欢借此积累作品集。"
    zh-TW: "實務型寫作課，涵蓋新聞、人物特寫、評論等文體，圍繞兩份需要採訪的作品集展開。對新聞有興趣的人喜歡藉此累積作品集。"
    ja: "ニュース、人物紹介、レビューなどの文体を扱う実践的な文章科目で、取材が必要な2つのフォリオが中心。ジャーナリズムに興味がある人はポートフォリオ作りを評価。"
    ko: "뉴스, 인물 기사, 리뷰 등 문체를 다루는 실전 글쓰기 과목으로, 인터뷰가 필요한 두 개의 폴리오가 중심. 저널리즘에 관심 있는 사람은 포트폴리오를 쌓을 수 있어 좋아함."
    vi: "Môn viết thực hành gồm tin tức, chân dung, bình luận và các thể loại tương tự, xoay quanh hai tập bài cần phỏng vấn. Người quan tâm báo chí thích việc xây dựng portfolio."
    ms: "Subjek penulisan praktikal merangkumi berita, profil, ulasan dan gaya serupa, berasaskan dua folio yang memerlukan temu bual. Mereka yang berminat kewartawanan suka membina portfolio."
    id: "Mata kuliah menulis praktis yang mencakup berita, profil, ulasan dan gaya serupa, berpusat pada dua folio yang butuh wawancara. Yang tertarik jurnalisme suka membangun portofolio."
    hi: "व्यावहारिक लेखन विषय, जिसमें न्यूज़, प्रोफ़ाइल, रिव्यू जैसी शैलियाँ हैं, और दो फ़ोलियो जिनमें इंटरव्यू करने होते हैं। पत्रकारिता में रुचि वालों को पोर्टफ़ोलियो बनाना पसंद आया।"
  - en: "Lectures are light and fairly common-sense; some found the content too basic. Draft and peer-review deadlines keep you on track but can feel rushed, and a 2019 reviewer found marking harsh."
    zh: "讲座内容轻松，偏常识；有人觉得太基础。草稿和互评的截止日期能督促进度，但可能显得仓促，一位2019年的评论者觉得评分严格。"
    zh-TW: "講座內容輕鬆，偏常識；有人覺得太基礎。草稿和互評的截止日期能督促進度，但可能顯得倉促，一位2019年的評論者覺得評分嚴格。"
    ja: "講義は軽めでほぼ常識的な内容で、基礎的すぎると感じた人も。下書きや相互レビューの締切でペースは保てるが慌ただしく感じることも。2019年のレビューでは採点が厳しいとされた。"
    ko: "강의는 가볍고 상식적인 편이라 너무 기초적이라는 사람도. 초안·동료평가 마감이 진도를 잡아주지만 촉박할 수 있음. 2019년 리뷰어는 채점이 엄격하다고 함."
    vi: "Bài giảng nhẹ và khá thông thường; có người thấy quá cơ bản. Hạn nộp bản nháp và chấm chéo giúp giữ tiến độ nhưng có thể gấp gáp, và một người năm 2019 thấy chấm điểm khắt khe."
    ms: "Kuliah ringan dan agak akal biasa; ada yang dapati terlalu asas. Tarikh akhir draf dan semakan rakan membantu kekal di landasan tetapi boleh terasa tergesa-gesa, dan seorang pengulas 2019 dapati pemarkahan ketat."
    id: "Kuliah ringan dan cukup akal sehat; ada yang merasa terlalu dasar. Tenggat draf dan tinjauan sejawat menjaga ritme tapi bisa terasa terburu-buru, dan seorang pengulas 2019 merasa penilaiannya ketat."
    hi: "लेक्चर हल्के और काफ़ी सामान्य समझ वाले हैं; कुछ को कंटेंट बहुत बुनियादी लगा। ड्राफ़्ट और पीयर-रिव्यू की डेडलाइन ट्रैक पर रखती हैं पर जल्दबाज़ी लग सकती है, और 2019 के एक रिव्यूअर को मार्किंग सख़्त लगी।"
sections:
  content:
    - en: "A practical taste of journalism and media writing styles: profiles, reviews, hard news and opinion. Lectures are short and largely common sense; views split between fun and bland."
      zh: "实际体验新闻和媒体写作的各种文体：人物特写、评论、硬新闻和观点文章。讲座短，多是常识；有人觉得有趣，有人觉得平淡。"
      zh-TW: "實際體驗新聞和媒體寫作的各種文體：人物特寫、評論、硬新聞和評論文章。講座短，多是常識；有人覺得有趣，有人覺得平淡。"
      ja: "人物紹介、レビュー、ハードニュース、オピニオンなどジャーナリズムとメディア文章を実践的に体験。講義は短くほぼ常識的。楽しいという人と平凡という人に分かれる。"
      ko: "인물 기사, 리뷰, 스트레이트 뉴스, 칼럼 등 저널리즘과 미디어 글쓰기를 실습해 본다. 강의는 짧고 대부분 상식적이다. 재밌다는 사람과 밋밋하다는 사람으로 갈린다."
      vi: "Trải nghiệm thực tế báo chí và các thể loại viết truyền thông: chân dung, phê bình, tin cứng và bình luận. Bài giảng ngắn, phần lớn là lẽ thường; ý kiến chia giữa vui và nhạt."
      ms: "Rasa praktikal kewartawanan dan gaya penulisan media: profil, ulasan, berita keras dan pendapat. Kuliah pendek dan kebanyakannya akal biasa; pandangan berbelah antara seronok dan hambar."
      id: "Pengalaman praktis jurnalisme dan gaya tulisan media: profil, ulasan, berita keras dan opini. Kuliah singkat dan kebanyakan akal sehat; pendapat terbelah antara seru dan hambar."
      hi: "पत्रकारिता और मीडिया लेखन शैलियों का व्यावहारिक अनुभव: प्रोफ़ाइल, समीक्षा, हार्ड न्यूज़ और राय लेख। लेक्चर छोटे और ज़्यादातर सामान्य समझ वाले; राय बँटी, मज़ेदार या फीका।"
  work:
    - en: "A media analysis task and two folios of different article types, several requiring interviews. Peer reviews and draft deadlines are required, which some found rushed but helpful."
      zh: "一个媒体分析作业和两份作品集，包含不同类型的文章，好几篇需要采访。必须交同伴互评和草稿，有人觉得赶，但有助于不拖延。"
      zh-TW: "一個媒體分析作業和兩份作品集，包含不同類型的文章，好幾篇需要採訪。必須交同儕互評和草稿，有人覺得趕，但有助於不拖延。"
      ja: "メディア分析課題と、異なる記事タイプのフォリオ2つ。複数がインタビュー必須。ピアレビューと下書き締切があり、急ぎ足だが先延ばし防止に役立ったという。"
      ko: "미디어 분석 과제와 여러 기사 유형으로 된 폴리오 두 개가 있고, 여러 편이 인터뷰를 요구한다. 동료 평가와 초안 마감이 필수인데 빠듯하지만 미루지 않게 도와줬다고 한다."
      vi: "Một bài phân tích truyền thông và hai bộ bài viết với nhiều thể loại, vài bài cần phỏng vấn. Bắt buộc có đánh giá chéo và hạn nộp nháp, có người thấy gấp nhưng giúp không trì hoãn."
      ms: "Satu tugasan analisis media dan dua folio pelbagai jenis artikel, beberapa memerlukan temu bual. Semakan rakan dan tarikh akhir draf diwajibkan, ada yang rasa tergesa tetapi membantu."
      id: "Satu tugas analisis media dan dua folio berbagai jenis artikel, beberapa butuh wawancara. Peer review dan tenggat draf wajib, ada yang merasa terburu-buru tapi membantu tidak menunda."
      hi: "एक मीडिया विश्लेषण कार्य और अलग-अलग लेख प्रकारों के दो फ़ोलियो, कई में इंटरव्यू ज़रूरी। पीयर रिव्यू और ड्राफ़्ट डेडलाइन अनिवार्य हैं, जो कुछ को जल्दबाज़ी वाले पर मददगार लगे।"
  watch:
    - en: "One reviewer found marking very harsh; another says it leans heavily on interviews and finding your own stories, with little editing taught. Your tutor makes a big difference."
      zh: "有同学觉得评分很严；也有人说太依赖采访和自己找选题，几乎不教编辑。tutor 的影响很大。"
      zh-TW: "有同學覺得評分很嚴；也有人說太依賴採訪和自己找題材，幾乎不教編輯。tutor 的影響很大。"
      ja: "採点がとても厳しかったという人や、インタビューと自分でネタを探すことに偏り、編集はほぼ教わらないという人も。チューター次第で大きく変わる。"
      ko: "채점이 매우 박했다는 사람도, 인터뷰와 스스로 기삿거리 찾기에 치우치고 편집은 거의 안 가르친다는 사람도 있다. 튜터에 따라 차이가 크다."
      vi: "Một người thấy chấm rất khắt khe; người khác nói nặng về phỏng vấn và tự tìm đề tài, ít dạy biên tập. Tutor ảnh hưởng rất lớn."
      ms: "Seorang dapati pemarkahan sangat ketat; seorang lagi kata ia banyak bergantung pada temu bual dan mencari cerita sendiri, sedikit penyuntingan diajar. Tutor beri perbezaan besar."
      id: "Satu pengulas merasa penilaian sangat ketat; yang lain bilang sangat bergantung pada wawancara dan mencari cerita sendiri, sedikit penyuntingan diajarkan. Tutor sangat berpengaruh."
      hi: "एक को अंकन बहुत सख़्त लगा; दूसरे के अनुसार यह इंटरव्यू और ख़ुद कहानियाँ ढूँढने पर बहुत टिका है, संपादन कम सिखाया जाता है। ट्यूटर से बड़ा फ़र्क़ पड़ता है।"
workload: light
