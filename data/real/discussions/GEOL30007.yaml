points:
  - en: "Reviewers described it as poorly organised, with some lectures hard to follow."
    zh: "评价者认为课程组织欠佳，部分讲课难以跟上。"
    zh-TW: "評論者認為課程組織不佳，有些講課很難跟上。"
    ja: "運営がまとまっておらず、講義によってはついていくのが難しいとのこと。"
    ko: "운영이 부실하고 일부 강의는 따라가기 어렵다는 평."
    vi: "Được mô tả là tổ chức kém, một số bài giảng khó theo."
    ms: "Pengulas menyifatkannya tidak tersusun, dengan sesetengah kuliah sukar diikuti."
    id: "Pengulas menyebutnya kurang tertata, dengan beberapa kuliah sulit diikuti."
    hi: "रिव्यूअर इसे ख़राब ढंग से व्यवस्थित बताते हैं, कुछ लेक्चर समझना मुश्किल है।"
  - en: "Expect to memorise obscure, specific facts; only take it if you are really interested in fossils."
    zh: "需要记忆许多冷门细节，只有真正对化石感兴趣才建议选。"
    zh-TW: "要背很多冷門又具體的細節；真的對化石有興趣再修。"
    ja: "マニアックで細かい事実を暗記する必要がある。化石に本当に興味がある人だけ取ろう。"
    ko: "생소하고 구체적인 사실을 외워야 하니, 화석에 정말 관심 있을 때만 들으세요."
    vi: "Phải nhớ nhiều chi tiết ít gặp và cụ thể; chỉ nên học nếu thật sự thích hóa thạch."
    ms: "Jangka menghafal fakta khusus yang jarang diketahui; ambil hanya jika benar-benar berminat dengan fosil."
    id: "Siap-siap menghafal fakta spesifik yang jarang dikenal; ambil hanya jika benar-benar tertarik pada fosil."
    hi: "कम जानी-पहचानी, बारीक बातें याद करनी होंगी; तभी लें जब सच में फ़ॉसिल में रुचि हो।"
  - en: "The literature reviews (choice of topic) are marked fairly, but scores above 90 are hard; field trips are a highlight."
    zh: "文献综述（可选题）评分较公平，但很难拿90+；野外考察是亮点。"
    zh-TW: "文獻回顧（題目可選）評分算公平，但要超過90分很難；野外考察是亮點。"
    ja: "文献レビュー（テーマ選択可）の採点は公平だが90点超えは難しい。フィールドトリップが目玉。"
    ko: "문헌 리뷰(주제 선택)는 공정하게 채점되지만 90점 이상은 어려우며, 현장 답사가 하이라이트."
    vi: "Bài tổng quan tài liệu (tự chọn đề) chấm công bằng, nhưng khó vượt 90; chuyến thực địa là điểm nhấn."
    ms: "Kajian literatur (pilihan topik) dimarkah adil, tetapi markah melebihi 90 sukar; lawatan lapangan ialah kemuncak."
    id: "Tinjauan pustaka (pilih topik) dinilai adil, tapi nilai di atas 90 sulit; kunjungan lapangan jadi sorotan."
    hi: "लिटरेचर रिव्यू (टॉपिक अपनी पसंद का) की मार्किंग निष्पक्ष है, पर 90 से ऊपर लाना मुश्किल है; फ़ील्ड ट्रिप सबसे ख़ास है।"
