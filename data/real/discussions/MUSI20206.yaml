points:
  - en: "Most call it an easy WAM booster: the 10 weekly quizzes (two attempts each) make up 40% and are seen as near-free marks."
    zh: "多数人称它是提分课：10 次每周小测（每次两次机会）占 40%，几乎白送分。"
    zh-TW: "多數人稱它是提分課：10 次每週小測（每次兩次機會）占 40%，幾乎白送分。"
    ja: "多くがGPA稼ぎの楽な科目と評価。毎週の小テスト10回（各2回受験可）が40%で、ほぼ確実に取れる。"
    ko: "대부분 학점 올리기 쉬운 과목이라 평가. 주간 퀴즈 10회(각 2회 응시)가 40%로 거의 거저 점수."
    vi: "Đa số coi đây là môn kéo điểm dễ: 10 quiz hằng tuần (mỗi quiz 2 lần làm) chiếm 40%, gần như cho điểm."
    ms: "Kebanyakan kata ia mudah untuk naikkan WAM: 10 kuiz mingguan (dua cubaan) bernilai 40%, hampir markah percuma."
    id: "Sebagian besar menyebutnya pendongkrak IPK mudah: 10 kuis mingguan (dua kali coba) bernilai 40%, nyaris nilai gratis."
    hi: "ज़्यादातर इसे आसान WAM बूस्टर कहते हैं: 10 साप्ताहिक क्विज़ (दो प्रयास) 40% हैं, लगभग मुफ़्त अंक।"
  - en: "Several found the open-topic 2,400-word essay marked harder than expected, with little guidance; starting early is advised."
    zh: "好几位觉得 2400 字自选题论文评分比预期严，指导也少；建议早点开始。"
    zh-TW: "好幾位覺得 2400 字自選題論文評分比預期嚴，指導也少；建議早點開始。"
    ja: "テーマ自由の2400語エッセイは指導が少なく、採点が予想より厳しかったという声が複数。早めの着手を推奨。"
    ko: "자유 주제 2400단어 에세이는 안내가 적고 채점이 생각보다 엄격했다는 평이 여럿. 일찍 시작하라는 조언."
    vi: "Nhiều người thấy bài luận 2.400 từ tự chọn đề chấm khắt hơn dự kiến, ít hướng dẫn; nên bắt đầu sớm."
    ms: "Beberapa orang dapati esei 2,400 patah perkataan bertopik bebas dinilai lebih ketat dan kurang panduan; mula awal."
    id: "Beberapa merasa esai 2.400 kata bertopik bebas dinilai lebih ketat dari dugaan dan minim arahan; mulai lebih awal."
    hi: "कई लोगों को 2,400 शब्दों का खुले विषय वाला निबंध उम्मीद से सख़्ती से जाँचा गया लगा, मार्गदर्शन कम; जल्दी शुरू करें।"
  - en: "The lecturer is described as funny and lively, but many found the long weekly lecture light on content and a bit boring."
    zh: "讲师被形容为风趣活泼，但很多人觉得每周的长讲座内容不多，有点无聊。"
    zh-TW: "講師被形容為風趣活潑，但很多人覺得每週的長講座內容不多，有點無聊。"
    ja: "講師は面白く元気だが、毎週の長い講義は中身が薄く少し退屈という声が多い。"
    ko: "강사는 재미있고 활기차지만 매주 긴 강의는 내용이 적고 다소 지루하다는 평이 많음."
    vi: "Giảng viên vui tính, sôi nổi, nhưng nhiều người thấy bài giảng dài hằng tuần ít nội dung, hơi chán."
    ms: "Pensyarah digambarkan lucu dan bertenaga, tetapi ramai rasa kuliah mingguan panjang kurang isi dan agak bosan."
    id: "Dosennya disebut lucu dan hidup, tapi banyak yang merasa kuliah mingguan yang panjang minim isi dan agak membosankan."
    hi: "लेक्चरर मज़ेदार और जोशीले बताए गए, पर कई को लंबा साप्ताहिक लेक्चर कम सामग्री वाला और थोड़ा उबाऊ लगा।"
workload: light
difficulty: easy
