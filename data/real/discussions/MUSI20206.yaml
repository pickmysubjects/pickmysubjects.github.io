points:
  - en: "Most call it an easy WAM booster: the 10 weekly quizzes (two attempts each) make up 40% and are seen as near-free marks."
    zh: "多数人称它是提分课：10 次每周小测（每次两次机会）占 40%，几乎白送分。"
    zh-TW: "多數人稱它是提分課：10 次每週小測（每次兩次機會）占 40%，幾乎白送分。"
    ja: "多くがGPA稼ぎの楽な科目と評価。毎週の小テスト10回（各2回受験可）が40%で、ほぼ確実に取れる。"
    ko: "대부분 학점 올리기 쉬운 과목이라 평가. 주간 퀴즈 10회(각 2회 응시)가 40%로 거의 거저 점수."
    vi: "Đa số coi đây là môn kéo điểm dễ: 10 quiz hằng tuần (mỗi quiz 2 lần làm) chiếm 40%, gần như cho điểm."
    ms: "Kebanyakan kata ia mudah untuk naikkan WAM: 10 kuiz mingguan (dua cubaan) bernilai 40%, hampir markah percuma."
    id: "Sebagian besar menyebutnya pendongkrak IPK mudah: 10 kuis mingguan (dua kali coba) bernilai 40%, nyaris nilai gratis."
    hi: "ज़्यादातर इसे आसान WAM बूस्टर कहते हैं: 10 साप्ताहिक क्विज़ (दो प्रयास) 40% हैं, लगभग मुफ़्त अंक।"
  - en: "Several found the open-topic 2,400-word essay marked harder than expected, with little guidance; starting early is advised."
    zh: "好几位觉得 2400 字自选题论文评分比预期严，指导也少；建议早点开始。"
    zh-TW: "好幾位覺得 2400 字自選題論文評分比預期嚴，指導也少；建議早點開始。"
    ja: "テーマ自由の2400語エッセイは指導が少なく、採点が予想より厳しかったという声が複数。早めの着手を推奨。"
    ko: "자유 주제 2400단어 에세이는 안내가 적고 채점이 생각보다 엄격했다는 평이 여럿. 일찍 시작하라는 조언."
    vi: "Nhiều người thấy bài luận 2.400 từ tự chọn đề chấm khắt hơn dự kiến, ít hướng dẫn; nên bắt đầu sớm."
    ms: "Beberapa orang dapati esei 2,400 patah perkataan bertopik bebas dinilai lebih ketat dan kurang panduan; mula awal."
    id: "Beberapa merasa esai 2.400 kata bertopik bebas dinilai lebih ketat dari dugaan dan minim arahan; mulai lebih awal."
    hi: "कई लोगों को 2,400 शब्दों का खुले विषय वाला निबंध उम्मीद से सख़्ती से जाँचा गया लगा, मार्गदर्शन कम; जल्दी शुरू करें।"
  - en: "The lecturer is described as funny and lively, but many found the long weekly lecture light on content and a bit boring."
    zh: "讲师被形容为风趣活泼，但很多人觉得每周的长讲座内容不多，有点无聊。"
    zh-TW: "講師被形容為風趣活潑，但很多人覺得每週的長講座內容不多，有點無聊。"
    ja: "講師は面白く元気だが、毎週の長い講義は中身が薄く少し退屈という声が多い。"
    ko: "강사는 재미있고 활기차지만 매주 긴 강의는 내용이 적고 다소 지루하다는 평이 많음."
    vi: "Giảng viên vui tính, sôi nổi, nhưng nhiều người thấy bài giảng dài hằng tuần ít nội dung, hơi chán."
    ms: "Pensyarah digambarkan lucu dan bertenaga, tetapi ramai rasa kuliah mingguan panjang kurang isi dan agak bosan."
    id: "Dosennya disebut lucu dan hidup, tapi banyak yang merasa kuliah mingguan yang panjang minim isi dan agak membosankan."
    hi: "लेक्चरर मज़ेदार और जोशीले बताए गए, पर कई को लंबा साप्ताहिक लेक्चर कम सामग्री वाला और थोड़ा उबाऊ लगा।"
sections:
  content:
    - en: "One 2-hour lecture a week on the music industry. Many found it boring and repetitive, with little meaningful content per lecture, though some found it interesting. Very low time demand."
      zh: "每周一次两小时讲座，讲音乐产业。很多人觉得无聊、重复，每节干货不多，也有人觉得有意思。花的时间非常少。"
      zh-TW: "每週一次兩小時講座，講音樂產業。很多人覺得無聊、重複，每堂乾貨不多，也有人覺得有趣。花的時間非常少。"
      ja: "音楽業界について週1回2時間の講義。退屈で繰り返しが多く、中身は少ないという声が多いが、面白いという人も。時間の負担はとても小さい。"
      ko: "음악 산업에 대한 주 1회 2시간 강의다. 지루하고 반복적이며 알맹이가 적다는 의견이 많지만 흥미롭다는 사람도 있다. 시간 부담은 매우 적다."
      vi: "Mỗi tuần một buổi giảng 2 tiếng về ngành âm nhạc. Nhiều người thấy chán, lặp lại, ít nội dung thực chất, dù có người thấy thú vị. Tốn rất ít thời gian."
      ms: "Satu kuliah 2 jam seminggu tentang industri muzik. Ramai rasa membosankan dan berulang dengan sedikit isi bermakna, walaupun ada yang rasa menarik. Masa yang diperlukan sangat sedikit."
      id: "Satu kuliah 2 jam per minggu tentang industri musik. Banyak yang merasa membosankan dan berulang dengan sedikit isi bermakna, meski ada yang merasa menarik. Waktu yang dibutuhkan sangat sedikit."
      hi: "संगीत उद्योग पर हर हफ़्ते एक 2 घंटे का लेक्चर। कई को यह उबाऊ और दोहराव वाला लगा, हर लेक्चर में काम की बात कम, हालाँकि कुछ को रोचक लगा। समय बहुत कम लगता है।"
  work:
    - en: "Ten short weekly quizzes (40%) with two attempts are near-free marks, though some questions ask things only said aloud in the lecture."
      zh: "十次每周小测（共 40%），每次两次机会，几乎白送分，不过有些题考的是讲座里只口头说过的内容。"
      zh-TW: "十次每週小考（共 40%），每次兩次機會，幾乎白送分，不過有些題考的是講座裡只口頭說過的內容。"
      ja: "毎週の短いクイズ10回（40%）は2回受験でき、ほぼ確実に点が取れる。ただし講義で口頭でしか言われないことを問う問題も。"
      ko: "주간 짧은 퀴즈 10번(40%)은 두 번 응시할 수 있어 거의 공짜 점수지만, 강의에서 말로만 한 내용을 묻는 문제도 있다."
      vi: "Mười quiz ngắn hằng tuần (40%), mỗi bài hai lần làm, gần như cho điểm, dù có câu hỏi về những điều chỉ nói miệng trong bài giảng."
      ms: "Sepuluh kuiz mingguan pendek (40%) dengan dua cubaan hampir markah percuma, walaupun ada soalan tentang perkara yang hanya disebut secara lisan dalam kuliah."
      id: "Sepuluh kuis mingguan singkat (40%) dengan dua kesempatan hampir nilai gratis, meski ada soal tentang hal yang hanya diucapkan di kuliah."
      hi: "दस छोटे साप्ताहिक क्विज़ (40%) दो प्रयासों के साथ लगभग मुफ़्त अंक हैं, हालाँकि कुछ सवाल ऐसी बातों पर हैं जो लेक्चर में सिर्फ़ बोली गईं।"
    - en: "A long open-topic essay of about 2300 words is 60%. No drafts or feedback; several found it marked harsher than expected."
      zh: "大约 2300 字的自选题长论文占 60%。没有草稿反馈；好几位觉得给分比预想的严。"
      zh-TW: "大約 2300 字的自選題長論文占 60%。沒有草稿回饋；好幾位覺得給分比預想的嚴。"
      ja: "約2300語のテーマ自由の長いエッセイが60%。下書きやフィードバックはなく、思ったより採点が厳しかったという声が複数。"
      ko: "약 2300단어의 주제 자유 에세이가 60%다. 초안이나 피드백은 없고, 예상보다 채점이 박했다는 사람이 여럿이다."
      vi: "Bài luận dài khoảng 2300 từ tự chọn đề chiếm 60%. Không có bản nháp hay phản hồi; vài người thấy chấm khắt khe hơn dự kiến."
      ms: "Esei panjang kira-kira 2300 patah perkataan bertopik bebas bernilai 60%. Tiada draf atau maklum balas; beberapa rasa dinilai lebih ketat daripada dijangka."
      id: "Esai panjang sekitar 2300 kata topik bebas bernilai 60%. Tanpa draf atau umpan balik; beberapa merasa dinilai lebih ketat dari dugaan."
      hi: "लगभग 2300 शब्दों का खुले विषय वाला लंबा निबंध 60% है। कोई ड्राफ़्ट या फ़ीडबैक नहीं; कई को अंकन उम्मीद से सख़्त लगा।"
  study:
    - en: "Do each quiz as soon as it opens using the lecture transcript; pick an essay topic you care about, link it to lecture topics and the rubric, and start early."
      zh: "每次小测一开放就做，用讲座文字稿找答案；论文选自己感兴趣的题目，紧扣讲座主题和评分标准，早点开始写。"
      zh-TW: "每次小考一開放就做，用講座逐字稿找答案；論文選自己有興趣的題目，緊扣講座主題和評分標準，早點開始寫。"
      ja: "クイズは公開されたらすぐ講義の文字起こしを使って解く。エッセイは関心のあるテーマを選び、講義内容とルーブリックに結びつけ、早めに始める。"
      ko: "퀴즈는 열리자마자 강의 스크립트를 활용해 풀어라. 에세이는 관심 있는 주제를 골라 강의 주제와 루브릭에 연결하고 일찍 시작하라."
      vi: "Làm quiz ngay khi mở bằng cách dùng bản ghi bài giảng; chọn đề luận mình thích, gắn với các chủ đề bài giảng và tiêu chí chấm, và bắt đầu sớm."
      ms: "Buat setiap kuiz sebaik dibuka menggunakan transkrip kuliah; pilih topik esei yang anda minati, kaitkan dengan topik kuliah dan rubrik, dan mula awal."
      id: "Kerjakan tiap kuis begitu dibuka dengan transkrip kuliah; pilih topik esai yang kamu minati, kaitkan dengan topik kuliah dan rubrik, dan mulai lebih awal."
      hi: "हर क्विज़ खुलते ही लेक्चर ट्रांसक्रिप्ट की मदद से करें; ऐसा निबंध विषय चुनें जिसमें रुचि हो, उसे लेक्चर विषयों और रूब्रिक से जोड़ें, और जल्दी शुरू करें।"
  watch:
    - en: "Widely called a WAM booster, but several say it's overrated because the essay mark is uncertain; one notes assessments may move toward more secure formats."
      zh: "普遍被称为刷分课，但好几位说名不副实，因为论文分数不确定；有人提到考核可能会改成更“安全”的形式。"
      zh-TW: "普遍被稱為拉分課，但好幾位說名不副實，因為論文分數不確定；有人提到考核可能會改成更「安全」的形式。"
      ja: "WAMを稼げる科目と広く言われるが、エッセイの点が読めないので過大評価だという声が複数。評価がより厳格な形式に移る可能性に触れた人も。"
      ko: "널리 WAM 부스터로 불리지만 에세이 점수가 불확실해 과대평가됐다는 사람이 여럿이다. 평가가 더 엄격한 형식으로 바뀔 수 있다는 언급도 있다."
      vi: "Được nhiều người gọi là môn kéo WAM, nhưng vài người nói bị thổi phồng vì điểm luận khó đoán; một người lưu ý đánh giá có thể chuyển sang hình thức chặt chẽ hơn."
      ms: "Ramai gelar ia penaik WAM, tetapi beberapa kata ia dinilai terlalu tinggi kerana markah esei tidak pasti; seorang menyebut penilaian mungkin beralih ke format lebih selamat."
      id: "Banyak yang menyebutnya pendongkrak WAM, tapi beberapa bilang terlalu dibesar-besarkan karena nilai esai tak pasti; satu menyebut penilaian mungkin beralih ke format yang lebih ketat."
      hi: "इसे अक्सर WAM बूस्टर कहा जाता है, पर कई कहते हैं यह ज़्यादा आँका गया है क्योंकि निबंध के अंक अनिश्चित हैं; एक के अनुसार असेसमेंट ज़्यादा सुरक्षित रूप में बदल सकते हैं।"
workload: light
difficulty: easy
