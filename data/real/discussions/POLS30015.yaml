reviews: 5
from: 2017
to: 2023
checked: 2026-10-17
points:
  - en: "Reviewers from 2017 to 2023 all enjoyed it: a wide range of engaging topics, a manageable reading load and tutorials that work well. It takes a more global view than the Politics of Sex."
    zh: "2017到2023年的评论者都很喜欢：话题丰富有吸引力，阅读量适中，辅导课效果好。和 Politics of Sex 相比视角更全球化。"
    zh-TW: "2017到2023年的評論者都很喜歡：話題豐富有吸引力，閱讀量適中，輔導課效果好。和 Politics of Sex 相比視角更全球化。"
    ja: "2017〜2023年の評者は皆満足。幅広く面白いテーマ、無理のない読書量、うまく機能するチュートリアル。Politics of Sex よりもグローバルな視点を取る。"
    ko: "2017~2023년 리뷰어 모두 만족. 흥미로운 주제가 다양하고 읽기 분량이 적당하며 튜토리얼도 잘 운영됨. Politics of Sex보다 더 글로벌한 시각을 다룸."
    vi: "Người đánh giá 2017–2023 đều thích: chủ đề đa dạng, hấp dẫn, lượng đọc vừa phải và tutorial hiệu quả. Góc nhìn toàn cầu hơn môn Politics of Sex."
    ms: "Pengulas 2017 hingga 2023 semuanya menyukainya: topik pelbagai yang menarik, bacaan yang munasabah dan tutorial yang berkesan. Ia mengambil pandangan lebih global daripada Politics of Sex."
    id: "Pengulas 2017 sampai 2023 semuanya menyukainya: topik beragam yang menarik, beban bacaan wajar, dan tutorial yang berjalan baik. Sudut pandangnya lebih global daripada Politics of Sex."
    hi: "2017 से 2023 तक के सभी रिव्यूअर्स को यह पसंद आया: रोचक विषयों की विस्तृत श्रृंखला, संभालने लायक रीडिंग और अच्छे ट्यूटोरियल। यह Politics of Sex से ज़्यादा वैश्विक नज़रिया लेता है।"
  - en: "There are two essays with many topic choices. A narrow focus and checking your plan with your tutor in office hours helped a 2022 reviewer score highly; in 2023 a rigid argument-counterargument template was required."
    zh: "共有两篇论文，题目选择多。2022年一位评论者靠选一个细分切入点、在答疑时间先和导师过思路拿了高分；2023年则要求使用固定的论点-反驳模板。"
    zh-TW: "共有兩篇論文，題目選擇多。2022年一位評論者靠選一個細分切入點、在答疑時間先和導師過思路拿了高分；2023年則要求使用固定的論點-反駁模板。"
    ja: "エッセイは2本でテーマの選択肢が多い。2022年の評者は狭いテーマに絞り、オフィスアワーでチューターに構想を見てもらって高得点を取った。2023年は論点・反論の固定テンプレートが必須だった。"
    ko: "에세이 2편이며 주제 선택지가 많음. 2022년 리뷰어는 주제를 좁히고 오피스 아워에 튜터와 계획을 점검해 고득점을 받음. 2023년엔 주장-반론의 고정 템플릿을 써야 했음."
    vi: "Có hai bài luận với nhiều lựa chọn đề. Người năm 2022 đạt điểm cao nhờ chọn góc hẹp và trao đổi dàn ý với tutor giờ office hours; năm 2023 bắt buộc theo khuôn lập luận - phản biện cố định."
    ms: "Terdapat dua esei dengan banyak pilihan topik. Mengecilkan skop dan menyemak rancangan dengan tutor semasa waktu pejabat membantu pengulas 2022 dapat markah tinggi; pada 2023 templat hujah-balas hujah yang tegar diwajibkan."
    id: "Ada dua esai dengan banyak pilihan topik. Mempersempit fokus dan membahas rencana dengan tutor di jam konsultasi membantu pengulas 2022 dapat nilai tinggi; pada 2023 wajib memakai templat argumen-kontraargumen yang kaku."
    hi: "दो निबंध हैं जिनमें टॉपिक के कई विकल्प हैं। 2022 के एक रिव्यूअर को फ़ोकस संकरा करने और ऑफ़िस आवर्स में ट्यूटर से योजना पर बात करने से ऊँचे अंक मिले; 2023 में तर्क-प्रतितर्क का सख़्त टेम्पलेट अनिवार्य था।"
  - en: "Views on marks differ: earlier reviewers found it not hard to do well, while a 2023 reviewer felt scoring above H2A was difficult."
    zh: "对分数看法不一：早期评论者觉得拿好成绩不难，而2023年一位评论者觉得想拿到H2A以上很难。"
    zh-TW: "對分數看法不一：早期評論者覺得拿好成績不難，而2023年一位評論者覺得想拿到H2A以上很難。"
    ja: "成績についての意見は分かれる。以前の評者は好成績は難しくないとしたが、2023年の評者はH2Aより上は難しいと感じた。"
    ko: "성적에 대한 의견은 갈림. 이전 리뷰어들은 좋은 성적이 어렵지 않다고 했지만 2023년 리뷰어는 H2A 이상은 어렵다고 느낌."
    vi: "Ý kiến về điểm khác nhau: những người trước thấy không khó đạt điểm tốt, còn người năm 2023 thấy khó vượt H2A."
    ms: "Pandangan tentang markah berbeza: pengulas terdahulu dapati tidak sukar untuk berjaya, manakala pengulas 2023 rasa sukar melepasi H2A."
    id: "Pendapat soal nilai berbeda: pengulas sebelumnya merasa tidak sulit dapat nilai bagus, sedangkan pengulas 2023 merasa sulit melampaui H2A."
    hi: "अंकों पर राय अलग है: पहले के रिव्यूअर्स को अच्छे अंक पाना कठिन नहीं लगा, जबकि 2023 के एक रिव्यूअर को H2A से ऊपर जाना मुश्किल लगा।"
sections:
  content:
    - en: "Gender politics with a global scope, covering a wide range of topics. Reviewers found it interesting and engaging, with a manageable amount of reading."
      zh: "从全球视角讲性别政治，话题很广。同学觉得有意思、投入感强，阅读量适中。"
      zh-TW: "從全球視角講性別政治，主題很廣。同學覺得有意思、投入感強，閱讀量適中。"
      ja: "グローバルな視点でジェンダー政治を扱い、テーマは幅広い。面白く引き込まれ、リーディング量もほどよいという。"
      ko: "세계적 관점의 젠더 정치로, 주제가 매우 넓다. 흥미롭고 몰입감 있으며 리딩 양도 적당하다는 평."
      vi: "Chính trị giới ở phạm vi toàn cầu, nhiều chủ đề. Người học thấy thú vị, cuốn hút, lượng đọc vừa phải."
      ms: "Politik gender dengan skop global, meliputi pelbagai topik. Pengulas rasa menarik dan melibatkan, dengan bacaan yang sederhana."
      id: "Politik gender dengan cakupan global, membahas beragam topik. Pengulas merasa menarik dan seru, dengan jumlah bacaan yang wajar."
      hi: "वैश्विक दायरे में जेंडर राजनीति, ढेर सारे विषयों के साथ। रिव्यूअर्स को यह रोचक और दिलचस्प लगा, पढ़ाई की मात्रा ठीक-ठाक।"
  work:
    - en: "Two essays with many topic options, so you can be creative. One reviewer disliked the rigid argument-counterargument template and found it hard to score above H2A; another got high H1s."
      zh: "两篇论文，题目选择多，可以发挥创意。有同学不喜欢固定的“论点—反驳”模板，觉得很难超过 H2A；也有同学两篇都拿了高 H1。"
      zh-TW: "兩篇論文，題目選擇多，可以發揮創意。有同學不喜歡固定的「論點—反駁」模板，覺得很難超過 H2A；也有同學兩篇都拿了高 H1。"
      ja: "テーマの選択肢が多いエッセイ2本で、創造的に書ける。主張と反論の固定テンプレートが嫌でH2A超えは難しいという人もいれば、高いH1を取った人も。"
      ko: "주제 선택지가 많은 에세이 2편으로 창의적으로 쓸 수 있다. 정해진 주장-반론 틀이 싫고 H2A를 넘기 어렵다는 사람도, 높은 H1을 받은 사람도 있다."
      vi: "Hai bài luận với nhiều lựa chọn đề, có thể sáng tạo. Một người không thích khuôn lập luận–phản biện cứng nhắc và thấy khó vượt H2A; người khác được H1 cao."
      ms: "Dua esei dengan banyak pilihan topik, jadi boleh kreatif. Seorang tidak suka templat hujah-hujah balas yang tegar dan rasa sukar melepasi H2A; seorang lagi dapat H1 tinggi."
      id: "Dua esai dengan banyak pilihan topik, jadi bisa kreatif. Satu tidak suka templat argumen-kontraargumen yang kaku dan merasa sulit melewati H2A; lainnya dapat H1 tinggi."
      hi: "विषयों के कई विकल्पों वाले दो निबंध, तो रचनात्मक हो सकते हैं। एक को तर्क-प्रतितर्क का सख़्त ढाँचा पसंद नहीं आया और H2A से ऊपर जाना कठिन लगा; दूसरे को ऊँचे H1 मिले।"
  study:
    - en: "Narrow in on a niche within your topic for depth, and use office hours to run your essay plan past your tutor. Keep up with the readings."
      zh: "在题目里找一个细分角度深入写；利用 office hours 让 tutor 看看论文思路。阅读要跟上。"
      zh-TW: "在題目裡找一個細分角度深入寫；利用 office hours 讓 tutor 看看論文思路。閱讀要跟上。"
      ja: "テーマの中でニッチな切り口を絞って深めること、オフィスアワーでチューターにエッセイの構想を見てもらうこと。リーディングに遅れないこと。"
      ko: "주제 안에서 좁은 틈새를 골라 깊이 파고, 오피스 아워에 튜터에게 에세이 구상을 보여줄 것. 리딩을 따라갈 것."
      vi: "Chọn một góc hẹp trong đề để viết sâu, và dùng giờ office hours nhờ tutor xem dàn ý. Theo kịp bài đọc."
      ms: "Fokus pada satu sudut khusus dalam topik untuk kedalaman, dan guna waktu pejabat untuk semak rancangan esei dengan tutor. Ikuti bacaan."
      id: "Fokus ke satu celah dalam topikmu untuk kedalaman, dan pakai jam konsultasi untuk membahas rencana esai dengan tutor. Ikuti bacaan."
      hi: "गहराई के लिए अपने विषय में एक ख़ास कोण चुनें, और ऑफ़िस आवर्स में ट्यूटर से निबंध की योजना पर राय लें। रीडिंग के साथ बने रहें।"
workload: light
