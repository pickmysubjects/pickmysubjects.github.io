code: COMP30023
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/comp30023
reviews: 7
from: 2017
to: 2026
checked: 2026-10-08
points:
  - en: "It covers networking and operating systems. Most find the content useful but the balance favours networking."
    zh: "课程涵盖网络和操作系统，多数人认为内容有用，但偏重网络部分。"
    zh-TW: "涵蓋網路和作業系統。多數人覺得內容實用，但比重偏向網路。"
    ja: "ネットワークとOSを扱う。内容は役立つという人が多いが、ネットワーク寄りの配分。"
    ko: "네트워크와 운영체제를 다룬다. 대부분 내용이 유용하다고 하지만 비중은 네트워크 쪽이 크다."
    vi: "Môn gồm mạng máy tính và hệ điều hành. Đa số thấy nội dung hữu ích nhưng thiên về mạng."
    ms: "Ia meliputi rangkaian dan sistem pengendalian. Kebanyakan dapati kandungan berguna tetapi lebih berat ke rangkaian."
    id: "Mencakup jaringan dan sistem operasi. Kebanyakan merasa materinya berguna tapi porsinya condong ke jaringan."
    hi: "इसमें नेटवर्किंग और ऑपरेटिंग सिस्टम हैं। ज़्यादातर को कंटेंट उपयोगी लगता है, पर झुकाव नेटवर्किंग की ओर है।"
  - en: "Projects are demanding and time consuming, and they need skills not directly taught in lectures, such as socket programming."
    zh: "项目要求高、耗时长，需要讲座未直接教授的技能，比如套接字编程。"
    zh-TW: "專題要求高又耗時，還需要講課沒直接教的技能，例如 socket 程式設計。"
    ja: "プロジェクトは大変で時間もかかり、ソケットプログラミングなど講義で直接教わらないスキルも必要。"
    ko: "프로젝트는 힘들고 시간이 많이 들며, 소켓 프로그래밍처럼 강의에서 직접 가르치지 않는 기술이 필요하다."
    vi: "Project khó và tốn thời gian, cần cả kỹ năng không được dạy trực tiếp trên lớp như lập trình socket."
    ms: "Projek mencabar dan memakan masa, serta perlukan kemahiran yang tidak diajar terus dalam kuliah, seperti pengaturcaraan soket."
    id: "Proyeknya berat dan menyita waktu, serta butuh keterampilan yang tidak diajarkan langsung di kuliah, seperti socket programming."
    hi: "प्रोजेक्ट मुश्किल और समय लेने वाले हैं, और ऐसी स्किल चाहिए जो लेक्चर में सीधे नहीं सिखाई जातीं, जैसे सॉकेट प्रोग्रामिंग।"
  - en: "Exams are seen as hard, with confusing wording and questions beyond the practised material; this complaint persists into 2026."
    zh: "考试被认为很难，题目表述含糊且超出练习范围，这一抱怨持续到2026年。"
    zh-TW: "考試被認為很難，題目措辭令人困惑，也超出練習範圍；這個抱怨到2026年仍在。"
    ja: "試験は難しいとされ、問題文が分かりにくく、練習範囲を超える問題もある。この不満は2026年まで続いている。"
    ko: "시험은 어렵다는 평이고, 문구가 헷갈리며 연습 범위를 넘는 문제도 있다. 이 불만은 2026년에도 이어진다."
    vi: "Đề thi bị cho là khó, cách hỏi gây rối và có câu vượt ngoài phần đã luyện; lời phàn nàn này vẫn còn đến 2026."
    ms: "Peperiksaan dianggap sukar, dengan susunan kata mengelirukan dan soalan di luar bahan latihan; aduan ini berterusan hingga 2026."
    id: "Ujian dinilai sulit, dengan kalimat soal membingungkan dan soal di luar materi latihan; keluhan ini masih ada hingga 2026."
    hi: "परीक्षा कठिन मानी जाती है, सवालों की भाषा उलझाने वाली और प्रैक्टिस से बाहर के सवाल; यह शिकायत 2026 तक बनी है।"
  - en: "Opinions on teaching are split: some praised the lectures, others found them vague and the tutorials unhelpful."
    zh: "对教学评价不一：有人称赞讲座，也有人认为讲解含糊、辅导课帮助不大。"
    zh-TW: "對教學看法不一：有人稱讚講課，也有人覺得講得含糊、輔導課沒幫助。"
    ja: "授業の評価は分かれる。講義を褒める人もいれば、説明が曖昧でチュートリアルも役に立たないという人もいる。"
    ko: "강의 평가는 갈린다. 강의를 칭찬한 사람도, 설명이 모호하고 튜토리얼이 도움이 안 됐다는 사람도 있다."
    vi: "Ý kiến về giảng dạy trái chiều: có người khen bài giảng, người khác thấy mơ hồ và tutorial không giúp được gì."
    ms: "Pandangan tentang pengajaran berbelah bahagi: ada yang memuji kuliah, ada yang rasa ia kabur dan tutorial tidak membantu."
    id: "Pendapat soal pengajaran terbelah: ada yang memuji kuliahnya, ada yang merasa kabur dan tutorialnya tidak membantu."
    hi: "पढ़ाई पर राय बंटी है: कुछ ने लेक्चर की तारीफ़ की, दूसरों को वे अस्पष्ट और ट्यूटोरियल बेकार लगे।"
sections:
  content:
    - en: "A content-heavy mix of computer networking and operating systems, with networking taking the larger share. Most found the content interesting and useful; views on teaching are split."
      zh: "计算机网络和操作系统的混合课，内容很多，网络部分占比更大。多数人觉得内容有趣、有用；对教学的评价两极。"
      zh-TW: "電腦網路和作業系統的混合課，內容很多，網路部分比重較大。多數人覺得內容有趣、有用；對教學的評價兩極。"
      ja: "コンピュータネットワークとOSを組み合わせた内容の多い科目で、ネットワークの比重が大きい。内容は面白く役立つという声が多いが、教え方の評価は割れる。"
      ko: "컴퓨터 네트워크와 운영체제를 합친 내용 많은 과목으로 네트워크 비중이 크다. 내용은 흥미롭고 유용하다는 평이 많지만 수업 평가는 갈린다."
      vi: "Môn nặng nội dung kết hợp mạng máy tính và hệ điều hành, phần mạng chiếm nhiều hơn. Đa số thấy nội dung thú vị và hữu ích; ý kiến về cách dạy chia rẽ."
      ms: "Gabungan rangkaian komputer dan sistem pengendalian yang berat kandungan, dengan rangkaian mengambil bahagian lebih besar. Kebanyakan rasa kandungan menarik dan berguna; pandangan tentang pengajaran berbelah."
      id: "Gabungan jaringan komputer dan sistem operasi yang berat materi, dengan jaringan mengambil porsi lebih besar. Kebanyakan merasa materinya menarik dan berguna; pendapat soal pengajaran terbelah."
      hi: "कंप्यूटर नेटवर्किंग और ऑपरेटिंग सिस्टम का कंटेंट-भारी मिश्रण, जिसमें नेटवर्किंग का हिस्सा बड़ा है। ज़्यादातर को कंटेंट रोचक और उपयोगी लगा; पढ़ाई पर राय बँटी है।"
  work:
    - en: "Two programming projects, including client-server socket code, and a 60% exam. Many found the projects time-consuming and only loosely covered in lectures, and the exam's wording confusing."
      zh: "两个编程项目（包括客户端和服务器的 socket 编程）和占 60% 的期末。很多人觉得项目耗时，讲课涉及很少；考试题目措辞令人困惑。"
      zh-TW: "兩個程式專題（包括客戶端和伺服器的 socket 程式）和佔 60% 的期末。很多人覺得專題耗時，上課涉及很少；考題措辭令人困惑。"
      ja: "クライアント・サーバのソケット通信を含むプログラミング課題2つと60%の期末試験。課題は時間がかかり講義ではほとんど扱われず、試験の文言が分かりにくいという声が多い。"
      ko: "클라이언트·서버 소켓 코드를 포함한 프로그래밍 프로젝트 2개와 60% 기말. 프로젝트는 시간이 많이 들고 강의에선 거의 다루지 않으며 시험 문구가 헷갈린다는 평이 많다."
      vi: "Hai project lập trình, gồm code socket client-server, và bài thi 60%. Nhiều người thấy project tốn thời gian, bài giảng ít đề cập, và đề thi diễn đạt khó hiểu."
      ms: "Dua projek pengaturcaraan, termasuk kod soket klien-pelayan, dan peperiksaan 60%. Ramai rasa projek memakan masa dan kurang diliputi dalam kuliah, serta soalan peperiksaan mengelirukan."
      id: "Dua proyek pemrograman, termasuk kode socket klien-server, dan ujian 60%. Banyak yang merasa proyeknya menyita waktu dan jarang dibahas di kuliah, serta kalimat soal ujian membingungkan."
      hi: "क्लाइंट-सर्वर सॉकेट कोड समेत दो प्रोग्रामिंग प्रोजेक्ट और 60% की परीक्षा। कई को प्रोजेक्ट समय लेने वाले और लेक्चर में कम कवर हुए लगे, और परीक्षा के सवालों की भाषा उलझाने वाली।"
  study:
    - en: "Keep up with the labs, start the projects early, and work through all practice materials; one 2023 reviewer warns the exam may ask you to apply ideas in new ways."
      zh: "实验课要跟上，项目早点开始，所有练习材料都做一遍；2023 年有同学提醒考试可能要你用新的方式运用概念。"
      zh-TW: "實驗課要跟上，專題早點開始，所有練習資料都做一遍；2023 年有同學提醒考試可能要你用新方式運用概念。"
      ja: "ラボについていき、課題は早めに始め、練習教材はすべてこなす。試験では概念を新しい形で応用させられることがあると2023年のレビューは注意している。"
      ko: "실습을 따라가고 프로젝트를 일찍 시작하며 연습 자료를 모두 풀어라. 2023년 한 리뷰어는 시험이 개념을 새로운 방식으로 적용하게 할 수 있다고 경고한다."
      vi: "Theo kịp các buổi lab, bắt đầu project sớm và làm hết tài liệu luyện tập; một người năm 2023 cảnh báo đề thi có thể bắt vận dụng theo cách mới."
      ms: "Ikuti makmal, mula projek awal, dan buat semua bahan latihan; seorang pengulas 2023 beri amaran peperiksaan mungkin minta anda guna idea dengan cara baharu."
      id: "Ikuti lab, mulai proyek lebih awal, dan kerjakan semua bahan latihan; satu pengulas 2023 mengingatkan ujian bisa meminta penerapan konsep dengan cara baru."
      hi: "लैब के साथ चलें, प्रोजेक्ट जल्दी शुरू करें, और सारी प्रैक्टिस सामग्री करें; 2023 के एक रिव्यूअर चेताते हैं कि परीक्षा में विचारों को नए ढंग से लागू करना पड़ सकता है।"
  watch:
    - en: "Reviewers from several years describe the exam as hard and unevenly weighted toward networking, and earlier ones reported problems with automatic project marking."
      zh: "多年的同学都说期末很难，而且偏重网络部分；早年还有同学反映项目的自动评分出过问题。"
      zh-TW: "多年的同學都說期末很難，而且偏重網路部分；早年還有同學反映專題的自動評分出過問題。"
      ja: "複数年のレビューで、期末は難しくネットワークに偏っているという。以前は課題の自動採点に問題があったという報告も。"
      ko: "여러 해 리뷰어들이 기말이 어렵고 네트워크 쪽에 치우쳤다고 했고, 예전엔 프로젝트 자동 채점에 문제가 있었다는 보고도 있다."
      vi: "Người học qua nhiều năm mô tả bài thi khó và nghiêng về phần mạng, và trước đây từng có lỗi chấm tự động project."
      ms: "Pengulas dari beberapa tahun menyifatkan peperiksaan sukar dan condong kepada rangkaian, dan yang terdahulu melaporkan masalah pemarkahan automatik projek."
      id: "Pengulas dari beberapa tahun menyebut ujiannya sulit dan condong ke jaringan, dan yang lebih awal melaporkan masalah penilaian otomatis proyek."
      hi: "कई सालों के रिव्यूअर्स परीक्षा को कठिन और नेटवर्किंग की ओर झुकी बताते हैं, और पहले वालों ने प्रोजेक्ट की ऑटो-मार्किंग में दिक़्क़तें बताईं।"
workload: heavy
difficulty: hard
