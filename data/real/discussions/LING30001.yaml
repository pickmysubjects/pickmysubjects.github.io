source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/ling30001
reviews: 4
from: 2022
to: 2023
checked: 2026-10-17
points:
  - en: "The linguistics capstone surveys grammar, discourse and language change. One 2022 reviewer liked the breadth; others felt it was a rushed recap without depth."
    zh: "语言学专业的毕业课，概览语法、话语和语言演变。一位2022年的评论者喜欢它的广度，其他人觉得只是仓促的回顾，缺乏深度。"
    zh-TW: "語言學主修的總結課，概覽語法、言談和語言演變。一位2022年的評論者喜歡它的廣度，其他人覺得只是倉促的回顧，缺乏深度。"
    ja: "言語学専攻のキャップストーンで、文法・談話・言語変化を概観する。2022年の1人は幅広さを評価したが、他は駆け足の復習で深みがないと感じた。"
    ko: "언어학 전공 캡스톤으로 문법, 담화, 언어 변화를 개관. 2022년 한 명은 폭넓음을 좋아했지만, 다른 이들은 깊이 없는 급한 복습이라고 느낌."
    vi: "Môn tổng kết chuyên ngành ngôn ngữ học, khái quát ngữ pháp, diễn ngôn và biến đổi ngôn ngữ. Một người năm 2022 thích độ rộng; người khác thấy chỉ là ôn lại vội vàng, thiếu chiều sâu."
    ms: "Capstone linguistik meninjau tatabahasa, wacana dan perubahan bahasa. Seorang pengulas 2022 suka keluasannya; yang lain rasa ia ulang kaji tergesa-gesa tanpa kedalaman."
    id: "Capstone linguistik yang meninjau tata bahasa, wacana dan perubahan bahasa. Seorang pengulas 2022 suka keluasannya; yang lain merasa hanya rekap terburu-buru tanpa kedalaman."
    hi: "भाषाविज्ञान का कैपस्टोन, जो व्याकरण, डिस्कोर्स और भाषा परिवर्तन का सर्वे करता है। 2022 के एक रिव्यूअर को इसकी व्यापकता पसंद आई; दूसरों को यह बिना गहराई का जल्दबाज़ी वाला दोहराव लगा।"
  - en: "Several mentioned harsh marking with little feedback, and the 2023 reviewer described poorly communicated assignments, including a group recording and translation task."
    zh: "好几人提到评分严格、反馈少，2023年的评论者说作业要求沟通不清，包括一项小组录音翻译任务。"
    zh-TW: "好幾個人提到評分嚴格、回饋少，2023年的評論者說作業要求溝通不清，包括一項小組錄音翻譯任務。"
    ja: "採点が厳しくフィードバックが少ないという声が複数あり、2023年のレビューはグループでの録音・翻訳課題を含め、課題の説明が不十分だったとした。"
    ko: "채점이 엄격하고 피드백이 적다는 언급이 여럿이며, 2023년 리뷰어는 그룹 녹음·번역 과제를 포함해 과제 안내가 부실했다고 함."
    vi: "Nhiều người nhắc chấm điểm khắt khe, ít phản hồi, và người năm 2023 mô tả các bài tập được truyền đạt kém, gồm cả bài nhóm ghi âm và dịch."
    ms: "Beberapa orang sebut pemarkahan ketat dengan sedikit maklum balas, dan pengulas 2023 menyatakan tugasan kurang dijelaskan, termasuk tugasan rakaman dan terjemahan berkumpulan."
    id: "Beberapa orang menyebut penilaian ketat dengan sedikit umpan balik, dan pengulas 2023 menggambarkan tugas yang kurang dikomunikasikan, termasuk tugas kelompok merekam dan menerjemahkan."
    hi: "कई लोगों ने कम फ़ीडबैक के साथ सख़्त मार्किंग का ज़िक्र किया, और 2023 के रिव्यूअर ने ख़राब ढंग से बताए गए असाइनमेंट का वर्णन किया, जिसमें ग्रुप रिकॉर्डिंग और अनुवाद का काम भी था।"
