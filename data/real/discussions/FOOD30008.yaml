points:
  - en: "Reviewers almost uniformly rate it very poorly and describe it as disorganised."
    zh: "评论几乎一致给予很低评价，认为课程组织混乱。"
    zh-TW: "評論幾乎一致給很低的評價，認為課程組織混亂。"
    ja: "口コミはほぼ一様に低評価で、運営がまとまっていないとのこと。"
    ko: "후기 대부분이 매우 낮게 평가하며 체계가 없다고 함."
    vi: "Hầu như mọi đánh giá đều rất thấp và cho rằng môn học lộn xộn."
    ms: "Pengulas hampir sebulat suara menilainya sangat rendah dan menyifatkannya tidak teratur."
    id: "Pengulas hampir semuanya menilainya sangat buruk dan menyebutnya berantakan."
    hi: "रिव्यूअर लगभग एक सुर में इसे बहुत ख़राब रेटिंग देते हैं और अव्यवस्थित बताते हैं।"
  - en: "Lab report instructions are unclear or contradictory, and staff responses to questions were unhelpful."
    zh: "实验报告要求不清甚至矛盾，老师对提问的回复帮助不大。"
    zh-TW: "實驗報告的要求不清楚甚至互相矛盾，老師回覆提問也幫助不大。"
    ja: "実験レポートの指示は不明確か矛盾しており、質問への教員の回答も役に立たなかった。"
    ko: "실험 보고서 안내가 불명확하거나 모순되고, 질문에 대한 교수진 답변도 도움이 안 됐음."
    vi: "Hướng dẫn báo cáo lab không rõ hoặc mâu thuẫn, và câu trả lời của giảng viên không giúp được gì."
    ms: "Arahan laporan makmal tidak jelas atau bercanggah, dan jawapan staf kepada soalan tidak membantu."
    id: "Instruksi laporan lab tidak jelas atau saling bertentangan, dan jawaban staf atas pertanyaan tidak membantu."
    hi: "लैब रिपोर्ट के निर्देश अस्पष्ट या विरोधाभासी हैं, और सवालों पर स्टाफ़ के जवाब मददगार नहीं थे।"
  - en: "Labs are chemistry-based; avoid it unless it is required for a food science major."
    zh: "实验以化学为主；如非食品科学专业必修，建议避开。"
    zh-TW: "實驗以化學為主；除非是食品科學主修的必修，否則建議避開。"
    ja: "実験は化学ベース。食品科学専攻の必修でなければ避けた方がいい。"
    ko: "실험은 화학 기반이며, 식품과학 전공 필수가 아니라면 피하는 게 좋음."
    vi: "Lab thiên về hóa học; nên tránh trừ khi là môn bắt buộc của chuyên ngành khoa học thực phẩm."
    ms: "Makmal berasaskan kimia; elakkan kecuali diwajibkan untuk major sains makanan."
    id: "Lab berbasis kimia; hindari kecuali wajib untuk jurusan ilmu pangan."
    hi: "लैब केमिस्ट्री पर आधारित हैं; फ़ूड साइंस मेजर के लिए ज़रूरी न हो तो इससे बचें।"
