code: BUSA30000
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/busa30000
reviews: 3
from: 2018
to: 2020
checked: 2026-10-13
points:
  - en: "All three reviewers were critical: they found the subject loosely structured and said it taught little beyond earlier marketing and management subjects."
    zh: "三位评价者都偏负面：认为课程结构松散，除了之前市场和管理课学过的内容外没学到多少新东西。"
    zh-TW: "三位評價者都偏負面：認為課程結構鬆散，除了先前行銷和管理課學過的內容外沒學到多少新東西。"
    ja: "3人とも批判的で、構成がゆるく、以前のマーケティングや経営の科目以上に学ぶことは少ないと感じている。"
    ko: "세 리뷰어 모두 비판적이었다. 구성이 느슨하고 이전 마케팅·경영 과목 이상으로 배우는 게 적다고 했다."
    vi: "Cả ba người đều chê: môn thiếu cấu trúc và hầu như không dạy thêm gì ngoài các môn marketing và quản trị trước đó."
    ms: "Ketiga-tiga pengulas mengkritik: subjek kurang berstruktur dan tidak banyak mengajar selain subjek pemasaran dan pengurusan terdahulu."
    id: "Ketiga pengulas kritis: mata kuliah ini kurang terstruktur dan hampir tidak mengajarkan hal baru di luar mata kuliah pemasaran dan manajemen sebelumnya."
    hi: "तीनों रिव्यूअर्स आलोचनात्मक थे: विषय ढीले ढांचे वाला लगा और पिछले मार्केटिंग व मैनेजमेंट विषयों से आगे कम सिखाता है।"
  - en: "The assessments drew the most complaints, including the business simulation task; reviewers felt the classes did little to prepare them for the assignments."
    zh: "评估是最大槽点，包括商业模拟作业；评价者觉得课堂对完成作业帮助不大。"
    zh-TW: "評量是最大槽點，包括商業模擬作業；評價者覺得課堂對完成作業幫助不大。"
    ja: "最も不満が多いのは課題で、ビジネスシミュレーションも含む。授業が課題の準備にほとんど役立たないと感じている。"
    ko: "가장 불만이 많은 건 평가로, 비즈니스 시뮬레이션 과제도 포함된다. 수업이 과제 준비에 별 도움이 안 됐다고 했다."
    vi: "Bài đánh giá bị phàn nàn nhiều nhất, kể cả bài mô phỏng kinh doanh; người học thấy giờ học ít giúp cho việc làm bài."
    ms: "Penilaian paling banyak dikritik, termasuk tugasan simulasi perniagaan; pengulas rasa kelas kurang membantu persediaan tugasan."
    id: "Penilaian paling banyak dikeluhkan, termasuk tugas simulasi bisnis; pengulas merasa kelas kurang membantu persiapan tugas."
    hi: "सबसे ज़्यादा शिकायत असेसमेंट को लेकर थी, बिज़नेस सिमुलेशन टास्क समेत; रिव्यूअर्स को लगा कि क्लास असाइनमेंट की तैयारी में कम मदद करती है।"
  - en: "Tutorials reward joining the discussion; one reviewer said the set readings were never discussed in class, which was demotivating."
    zh: "辅导课积极参与讨论会更有收获；有人说指定阅读从未在课上讨论，令人泄气。"
    zh-TW: "輔導課積極參與討論會更有收穫；有人說指定閱讀從未在課堂上討論，讓人洩氣。"
    ja: "チュートリアルは議論に参加するほど得るものがある。指定文献が授業で一度も扱われずやる気が出なかったという声も。"
    ko: "튜토리얼은 토론에 참여할수록 얻는 게 많다. 지정 읽기 자료가 수업에서 다뤄지지 않아 의욕이 떨어졌다는 의견도 있다."
    vi: "Tutorial có ích hơn nếu tham gia thảo luận; một người nói bài đọc chưa từng được bàn trên lớp nên thấy nản."
    ms: "Tutorial lebih berbaloi jika menyertai perbincangan; seorang kata bacaan wajib tidak pernah dibincang dalam kelas, jadi kurang motivasi."
    id: "Tutorial lebih bermanfaat jika ikut berdiskusi; satu pengulas bilang bacaan wajib tak pernah dibahas di kelas, jadi kurang semangat."
    hi: "ट्यूटोरियल में चर्चा में हिस्सा लेने से फ़ायदा होता है; एक रिव्यूअर ने कहा कि तय रीडिंग्स पर क्लास में कभी बात नहीं हुई, जो निराशाजनक था।"
