points:
  - en: "Reviews from 2020-2021 were mostly negative: one called it the worst BCom subject they had taken, and another found tutorials discouraging."
    zh: "2020-2021年的评论大多负面：有人称它是读过最差的商科课，也有人觉得辅导课让人不敢发言。"
    zh-TW: "2020-2021年的評論大多負面：有人說它是修過最差的商科課，也有人覺得小組課讓人不敢發言。"
    ja: "2020-2021年のレビューはほぼ否定的。BComで最悪の科目だという声や、チュートリアルで発言しにくかったという声があった。"
    ko: "2020-2021년 리뷰는 대부분 부정적. BCom 최악의 과목이라는 평과 튜토리얼에서 발언하기 위축됐다는 평이 있음."
    vi: "Đánh giá năm 2020-2021 phần lớn tiêu cực: có người gọi đây là môn BCom tệ nhất, người khác thấy buổi tutorial khiến mình ngại phát biểu."
    ms: "Ulasan 2020-2021 kebanyakannya negatif: seorang menyebutnya subjek BCom paling teruk, seorang lagi rasa tutorial tidak menggalakkan."
    id: "Ulasan 2020-2021 sebagian besar negatif: ada yang menyebutnya mata kuliah BCom terburuk, yang lain merasa tutorial bikin enggan bicara."
    hi: "2020-2021 के रिव्यू ज़्यादातर नकारात्मक थे: एक ने इसे सबसे खराब BCom सब्जेक्ट कहा, दूसरे को ट्यूटोरियल में बोलने से डर लगा।"
  - en: "Some found the content practical for consulting or business analysis, especially business process tools and flowcharts. Know the flowcharts well."
    zh: "有人觉得内容很实用，适合做咨询或业务分析，尤其是业务流程工具和流程图。流程图一定要弄懂。"
    zh-TW: "有人覺得內容很實用，適合做顧問或業務分析，尤其是業務流程工具和流程圖。流程圖一定要弄懂。"
    ja: "コンサルや業務分析に役立つ実践的な内容だという声も。特に業務プロセスのツールやフローチャート。フローチャートはしっかり理解しておくこと。"
    ko: "컨설팅이나 비즈니스 분석에 실용적이라는 평도 있음. 특히 업무 프로세스 도구와 플로차트. 플로차트는 확실히 이해할 것."
    vi: "Một số người thấy nội dung thực tế cho tư vấn hay phân tích kinh doanh, nhất là công cụ quy trình và lưu đồ. Hãy nắm chắc lưu đồ."
    ms: "Ada yang dapati kandungannya praktikal untuk perundingan atau analisis perniagaan, terutama alat proses dan carta alir. Fahami carta alir betul-betul."
    id: "Sebagian merasa materinya praktis untuk konsultan atau analis bisnis, terutama alat proses bisnis dan flowchart. Pahami flowchart dengan baik."
    hi: "कुछ को कंटेंट कंसल्टिंग या बिज़नेस एनालिसिस के लिए काम का लगा, खासकर बिज़नेस प्रोसेस टूल और फ़्लोचार्ट। फ़्लोचार्ट अच्छे से समझ लें।"
  - en: "Effort did not always show in the mark: one left the exam confident and scored lower than expected, and another found the many external tools messy."
    zh: "付出不一定换来分数：有人考完很有信心，成绩却低于预期；也有人觉得要用的外部工具太多太乱。"
    zh-TW: "付出不一定換來分數：有人考完很有信心，成績卻低於預期；也有人覺得要用的外部工具太多太亂。"
    ja: "努力が点数に出るとは限らない。自信満々で試験を終えたのに予想より低かった人や、外部ツールが多くて煩雑だったという人がいた。"
    ko: "노력이 점수로 늘 이어지진 않음. 시험을 자신 있게 마쳤는데 점수가 낮았다는 사람, 외부 도구가 많아 복잡했다는 사람이 있음."
    vi: "Công sức không phải lúc nào cũng thành điểm: có người thi xong rất tự tin nhưng điểm thấp hơn mong đợi, người khác thấy quá nhiều công cụ bên ngoài rối rắm."
    ms: "Usaha tidak selalu tercermin dalam markah: seorang yakin selepas peperiksaan tetapi dapat lebih rendah, seorang lagi rasa banyak alat luaran mengelirukan."
    id: "Usaha tidak selalu tercermin di nilai: ada yang yakin selesai ujian tapi nilainya lebih rendah, yang lain merasa banyak alat eksternal membingungkan."
    hi: "मेहनत हमेशा नंबरों में नहीं दिखी: एक को एग्ज़ाम के बाद भरोसा था पर नंबर कम आए, दूसरे को कई बाहरी टूल उलझाने वाले लगे।"
difficulty: hard
