code: ACCT20007
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/acct20007
reviews: 5
from: 2018
to: 2021
checked: 2026-10-17
points:
  - en: "Reviews from 2020-2021 were mostly negative: one called it the worst BCom subject they had taken, and another found tutorials discouraging."
    zh: "2020-2021年的评论大多负面：有人称它是读过最差的商科课，也有人觉得辅导课让人不敢发言。"
    zh-TW: "2020-2021年的評論大多負面：有人說它是修過最差的商科課，也有人覺得小組課讓人不敢發言。"
    ja: "2020-2021年のレビューはほぼ否定的。BComで最悪の科目だという声や、チュートリアルで発言しにくかったという声があった。"
    ko: "2020-2021년 리뷰는 대부분 부정적. BCom 최악의 과목이라는 평과 튜토리얼에서 발언하기 위축됐다는 평이 있음."
    vi: "Đánh giá năm 2020-2021 phần lớn tiêu cực: có người gọi đây là môn BCom tệ nhất, người khác thấy buổi tutorial khiến mình ngại phát biểu."
    ms: "Ulasan 2020-2021 kebanyakannya negatif: seorang menyebutnya subjek BCom paling teruk, seorang lagi rasa tutorial tidak menggalakkan."
    id: "Ulasan 2020-2021 sebagian besar negatif: ada yang menyebutnya mata kuliah BCom terburuk, yang lain merasa tutorial bikin enggan bicara."
    hi: "2020-2021 के रिव्यू ज़्यादातर नकारात्मक थे: एक ने इसे सबसे खराब BCom सब्जेक्ट कहा, दूसरे को ट्यूटोरियल में बोलने से डर लगा।"
  - en: "Some found the content practical for consulting or business analysis, especially business process tools and flowcharts. Know the flowcharts well."
    zh: "有人觉得内容很实用，适合做咨询或业务分析，尤其是业务流程工具和流程图。流程图一定要弄懂。"
    zh-TW: "有人覺得內容很實用，適合做顧問或業務分析，尤其是業務流程工具和流程圖。流程圖一定要弄懂。"
    ja: "コンサルや業務分析に役立つ実践的な内容だという声も。特に業務プロセスのツールやフローチャート。フローチャートはしっかり理解しておくこと。"
    ko: "컨설팅이나 비즈니스 분석에 실용적이라는 평도 있음. 특히 업무 프로세스 도구와 플로차트. 플로차트는 확실히 이해할 것."
    vi: "Một số người thấy nội dung thực tế cho tư vấn hay phân tích kinh doanh, nhất là công cụ quy trình và lưu đồ. Hãy nắm chắc lưu đồ."
    ms: "Ada yang dapati kandungannya praktikal untuk perundingan atau analisis perniagaan, terutama alat proses dan carta alir. Fahami carta alir betul-betul."
    id: "Sebagian merasa materinya praktis untuk konsultan atau analis bisnis, terutama alat proses bisnis dan flowchart. Pahami flowchart dengan baik."
    hi: "कुछ को कंटेंट कंसल्टिंग या बिज़नेस एनालिसिस के लिए काम का लगा, खासकर बिज़नेस प्रोसेस टूल और फ़्लोचार्ट। फ़्लोचार्ट अच्छे से समझ लें।"
  - en: "Effort did not always show in the mark: one left the exam confident and scored lower than expected, and another found the many external tools messy."
    zh: "付出不一定换来分数：有人考完很有信心，成绩却低于预期；也有人觉得要用的外部工具太多太乱。"
    zh-TW: "付出不一定換來分數：有人考完很有信心，成績卻低於預期；也有人覺得要用的外部工具太多太亂。"
    ja: "努力が点数に出るとは限らない。自信満々で試験を終えたのに予想より低かった人や、外部ツールが多くて煩雑だったという人がいた。"
    ko: "노력이 점수로 늘 이어지진 않음. 시험을 자신 있게 마쳤는데 점수가 낮았다는 사람, 외부 도구가 많아 복잡했다는 사람이 있음."
    vi: "Công sức không phải lúc nào cũng thành điểm: có người thi xong rất tự tin nhưng điểm thấp hơn mong đợi, người khác thấy quá nhiều công cụ bên ngoài rối rắm."
    ms: "Usaha tidak selalu tercermin dalam markah: seorang yakin selepas peperiksaan tetapi dapat lebih rendah, seorang lagi rasa banyak alat luaran mengelirukan."
    id: "Usaha tidak selalu tercermin di nilai: ada yang yakin selesai ujian tapi nilainya lebih rendah, yang lain merasa banyak alat eksternal membingungkan."
    hi: "मेहनत हमेशा नंबरों में नहीं दिखी: एक को एग्ज़ाम के बाद भरोसा था पर नंबर कम आए, दूसरे को कई बाहरी टूल उलझाने वाले लगे।"
sections:
  content:
    - en: "Accounting information systems, risks and controls, including practical tools like SAP and BPMN flowcharts. Some found parts useful for consulting or business analysis; most rated it poorly overall."
      zh: "讲会计信息系统、风险与控制，包括 SAP、BPMN 流程图等实用工具。有人觉得部分内容对咨询或业务分析有用；但多数总体评价很差。"
      zh-TW: "講會計資訊系統、風險與控制，包括 SAP、BPMN 流程圖等實用工具。有人覺得部分內容對顧問或業務分析有用；但多數整體評價很差。"
      ja: "会計情報システム、リスクと統制を扱い、SAPやBPMNフローチャートなど実用的なツールも学ぶ。コンサルや業務分析に役立つ部分もあるというが、全体としては低評価が多い。"
      ko: "회계 정보 시스템, 위험과 통제를 다루며 SAP, BPMN 흐름도 같은 실무 도구도 배운다. 컨설팅이나 비즈니스 분석에 유용한 부분도 있다지만 전반적으로 혹평이 많다."
      vi: "Hệ thống thông tin kế toán, rủi ro và kiểm soát, gồm công cụ thực tế như SAP và lưu đồ BPMN. Vài người thấy hữu ích cho tư vấn hay phân tích kinh doanh; đa số đánh giá thấp."
      ms: "Sistem maklumat perakaunan, risiko dan kawalan, termasuk alat praktikal seperti SAP dan carta alir BPMN. Ada yang rasa berguna untuk perundingan atau analisis perniagaan; kebanyakan menilai rendah."
      id: "Sistem informasi akuntansi, risiko dan pengendalian, termasuk alat praktis seperti SAP dan diagram alir BPMN. Sebagian merasa berguna untuk konsultasi atau analisis bisnis; kebanyakan menilai buruk."
      hi: "अकाउंटिंग सूचना प्रणाली, जोखिम और नियंत्रण, SAP और BPMN फ़्लोचार्ट जैसे व्यावहारिक टूल के साथ। कुछ को कंसल्टिंग या बिज़नेस एनालिसिस के लिए उपयोगी लगा; ज़्यादातर ने कुल मिलाकर ख़राब बताया।"
  work:
    - en: "Lecture participation is marked through live polls, and the subject uses many external tools. Two reviewers say effort and understanding didn't guarantee a good mark, including on the exam."
      zh: "讲课参与通过现场投票计分，课程要用很多外部工具。两位同学说就算努力、理解了也不保证高分，期末也一样。"
      zh-TW: "講課參與透過現場投票計分，課程要用很多外部工具。兩位同學說就算努力、理解了也不保證高分，期末也一樣。"
      ja: "講義の参加はライブ投票で採点され、外部ツールを多く使う。努力して理解しても良い点は保証されない、試験も同じだったという人が二人。"
      ko: "강의 참여는 실시간 투표로 채점되고 외부 도구를 많이 쓴다. 두 리뷰는 노력하고 이해해도 좋은 점수가 보장되지 않았고 시험도 마찬가지였다고 한다."
      vi: "Tham gia bài giảng được chấm qua bình chọn trực tiếp, và môn dùng nhiều công cụ bên ngoài. Hai người nói cố gắng và hiểu bài vẫn không chắc điểm tốt, kể cả bài thi."
      ms: "Penyertaan kuliah dimarkah melalui undian langsung, dan subjek guna banyak alat luaran. Dua pengulas kata usaha dan kefahaman tidak menjamin markah baik, termasuk peperiksaan."
      id: "Partisipasi kuliah dinilai lewat polling langsung, dan mata kuliah memakai banyak alat eksternal. Dua pengulas bilang usaha dan pemahaman tidak menjamin nilai bagus, termasuk ujian."
      hi: "लेक्चर भागीदारी लाइव पोल से गिनी जाती है, और विषय में कई बाहरी टूल इस्तेमाल होते हैं। दो रिव्यूअर्स कहते हैं मेहनत और समझ से भी अच्छे अंक पक्के नहीं थे, परीक्षा में भी।"
  watch:
    - en: "Make sure you understand the flowchart material. All reviews are from 2021 or earlier, when it was a newer core subject, so it may have changed."
      zh: "一定要弄懂流程图部分。所有评价都是 2021 年或更早的，那时还是较新的核心课，课程可能已经变了。"
      zh-TW: "一定要弄懂流程圖部分。所有評價都是 2021 年或更早的，那時還是較新的核心課，課程可能已經變了。"
      ja: "フローチャートの内容は必ず理解すること。レビューはすべて比較的新しい必修科目だった2021年以前のもので、変わっている可能性がある。"
      ko: "흐름도 내용은 꼭 이해할 것. 리뷰는 모두 비교적 새로운 필수 과목이던 2021년 이전 것이라 바뀌었을 수 있다."
      vi: "Hãy hiểu kỹ phần lưu đồ. Mọi đánh giá đều từ 2021 trở về trước, khi đây còn là môn cốt lõi mới, nên có thể đã thay đổi."
      ms: "Pastikan anda faham bahan carta alir. Semua ulasan dari 2021 atau lebih awal, ketika ia subjek teras yang baharu, jadi mungkin telah berubah."
      id: "Pastikan memahami materi diagram alir. Semua ulasan dari 2021 atau sebelumnya, saat masih mata kuliah inti yang baru, jadi mungkin sudah berubah."
      hi: "फ़्लोचार्ट वाला हिस्सा ज़रूर समझें। सभी रिव्यू 2021 या पहले के हैं, जब यह नया कोर विषय था, तो बदल गया हो सकता है।"
difficulty: hard
