points:
  - en: "Older reviews (2014-16) were very positive; more recent ones are mixed to negative."
    zh: "早期评论（2014-16年）非常正面，近年评价则褒贬不一甚至偏负面。"
    zh-TW: "早期評論（2014-16年）非常正面，近年評價則褒貶不一甚至偏負面。"
    ja: "以前の口コミ（2014-16）はとても好意的だが、最近のものは賛否両論からやや否定的。"
    ko: "예전 후기(2014-16)는 매우 긍정적이었지만 최근 후기는 엇갈리거나 부정적임."
    vi: "Đánh giá cũ (2014-16) rất tích cực; gần đây thì lẫn lộn đến tiêu cực."
    ms: "Ulasan lama (2014-16) sangat positif; yang terkini bercampur hingga negatif."
    id: "Ulasan lama (2014-16) sangat positif; yang terbaru campur aduk hingga negatif."
    hi: "पुराने रिव्यू (2014-16) बहुत पॉज़िटिव थे; हाल के मिले-जुले से नेगेटिव हैं।"
  - en: "Lots of memorisation; lecture slides alone are not enough, so expect outside study."
    zh: "需要大量记忆，仅靠讲义不够，需额外自学。"
    zh-TW: "需要大量背誦，光靠講義不夠，要有課外自學的準備。"
    ja: "暗記が多く、講義スライドだけでは不十分。授業外の勉強が必要。"
    ko: "암기량이 많고 강의 슬라이드만으로는 부족하니 따로 공부해야 함."
    vi: "Phải học thuộc nhiều; chỉ slide bài giảng là không đủ, cần tự học thêm."
    ms: "Banyak menghafal; slaid kuliah sahaja tidak cukup, jadi perlu belajar di luar."
    id: "Banyak hafalan; slide kuliah saja tidak cukup, jadi perlu belajar tambahan."
    hi: "काफ़ी रटना पड़ता है; सिर्फ़ लेक्चर स्लाइड काफ़ी नहीं, बाहर से पढ़ाई करनी होगी।"
  - en: "The field trip is enjoyable, but the report assignment had unclear instructions and was hard to do well in."
    zh: "野外考察很有趣，但报告作业要求不清，很难拿高分。"
    zh-TW: "野外考察很好玩，但報告作業要求不清楚，很難拿高分。"
    ja: "フィールドトリップは楽しいが、レポート課題は指示が不明確で高得点を取りにくかった。"
    ko: "현장 답사는 즐겁지만 보고서 과제는 안내가 불명확해 좋은 점수를 받기 어려웠음."
    vi: "Chuyến thực địa rất vui, nhưng bài báo cáo có hướng dẫn không rõ và khó làm tốt."
    ms: "Lawatan lapangan menyeronokkan, tetapi tugasan laporan ada arahan kabur dan sukar mendapat markah baik."
    id: "Kunjungan lapangan menyenangkan, tapi tugas laporannya berinstruksi tidak jelas dan sulit dapat nilai bagus."
    hi: "फ़ील्ड ट्रिप मज़ेदार है, पर रिपोर्ट असाइनमेंट के निर्देश अस्पष्ट थे और उसमें अच्छा करना मुश्किल था।"
sections:
  content:
    - en: "An intro to marine environments with a field trip. Reviews before 2017 were very positive about clear lectures and support; later ones found it a bit boring and memory heavy."
      zh: "海洋环境入门，有野外考察。2017 年以前的评价很正面，觉得讲课清楚、支持多；之后的同学觉得有点无聊、要背的多。"
      zh-TW: "海洋環境入門，有野外考察。2017 年以前的評價很正面，覺得上課清楚、支援多；之後的同學覺得有點無聊、要背的多。"
      ja: "フィールドトリップ付きの海洋環境入門。2017年より前のレビューは講義が明快でサポートも厚いと好評。その後はやや退屈で暗記が多いという声。"
      ko: "현장 학습이 있는 해양 환경 입문. 2017년 이전 리뷰는 강의가 명확하고 지원이 좋다며 매우 긍정적이었고, 이후엔 다소 지루하고 암기가 많다는 평."
      vi: "Nhập môn môi trường biển, có chuyến thực địa. Đánh giá trước 2017 rất tích cực về bài giảng rõ ràng và được hỗ trợ; về sau người học thấy hơi chán và phải nhớ nhiều."
      ms: "Pengenalan persekitaran marin dengan lawatan lapangan. Ulasan sebelum 2017 sangat positif tentang kuliah jelas dan sokongan; ulasan kemudian rasa agak bosan dan banyak menghafal."
      id: "Pengantar lingkungan laut dengan kunjungan lapangan. Ulasan sebelum 2017 sangat positif soal kuliah jelas dan dukungan; ulasan setelahnya merasa agak membosankan dan banyak hafalan."
      hi: "फ़ील्ड ट्रिप के साथ समुद्री पर्यावरण का परिचय। 2017 से पहले के रिव्यू साफ़ लेक्चर और सहयोग को लेकर बहुत सकारात्मक थे; बाद वालों को यह थोड़ा उबाऊ और रटने वाला लगा।"
  work:
    - en: "Online quizzes or an MST, a scientific report from the field trip, and an exam that goes in depth. The quizzes are seen as easy; several found the report brief unclear and the word limit tight."
      zh: "有线上小测或 MST、一份基于野外考察的科学报告，以及考得较深的期末。小测被认为简单；好几位觉得报告要求不清楚、字数限制太紧。"
      zh-TW: "有線上小考或 MST、一份根據野外考察的科學報告，以及考得較深的期末。小考被認為簡單；好幾位覺得報告要求不清楚、字數限制太緊。"
      ja: "オンライン小テストまたはMST、フィールドトリップに基づく科学レポート、深く問う試験。小テストは簡単だが、レポートは指示が不明確で字数制限が厳しいという声が複数。"
      ko: "온라인 퀴즈나 MST, 현장 학습 기반 과학 보고서, 깊이 묻는 시험이 있다. 퀴즈는 쉽지만 보고서 안내가 불분명하고 글자 수 제한이 빡빡하다는 의견이 여럿."
      vi: "Có quiz trực tuyến hoặc MST, một báo cáo khoa học từ chuyến thực địa và bài thi hỏi sâu. Quiz được cho là dễ; vài người thấy đề báo cáo không rõ và giới hạn chữ quá chặt."
      ms: "Kuiz dalam talian atau MST, laporan saintifik daripada lawatan lapangan, dan peperiksaan yang mendalam. Kuiz dianggap mudah; beberapa rasa arahan laporan kabur dan had perkataan ketat."
      id: "Kuis daring atau MST, laporan ilmiah dari kunjungan lapangan, dan ujian yang mendalam. Kuis dianggap mudah; beberapa merasa instruksi laporan tidak jelas dan batas katanya ketat."
      hi: "ऑनलाइन क्विज़ या MST, फ़ील्ड ट्रिप से एक वैज्ञानिक रिपोर्ट, और गहराई से पूछने वाली परीक्षा। क्विज़ आसान माने गए; कई को रिपोर्ट के निर्देश अस्पष्ट और शब्द-सीमा तंग लगी।"
  study:
    - en: "Don't rely on the slides alone, which are mostly pictures; reviewers say you need to study beyond the given material."
      zh: "别只靠 PPT，上面大多是图片；同学说需要在给的材料之外自己多学。"
      zh-TW: "別只靠投影片，上面大多是圖片；同學說需要在給的資料之外自己多讀。"
      ja: "スライドは主に写真なので、それだけに頼らないこと。配布資料以外でも勉強が必要だという。"
      ko: "슬라이드는 대부분 사진이라 그것만 믿지 마라. 주어진 자료 밖에서도 공부해야 한다는 평이다."
      vi: "Đừng chỉ dựa vào slide, chủ yếu là hình ảnh; người học nói cần tự học thêm ngoài tài liệu được phát."
      ms: "Jangan bergantung pada slaid sahaja yang kebanyakannya gambar; pengulas kata anda perlu belajar melebihi bahan yang diberi."
      id: "Jangan cuma mengandalkan slide yang kebanyakan gambar; pengulas bilang kamu perlu belajar di luar materi yang diberikan."
      hi: "सिर्फ़ स्लाइड पर निर्भर न रहें, जो ज़्यादातर तस्वीरें हैं; रिव्यूअर्स कहते हैं दी गई सामग्री से आगे पढ़ना पड़ता है।"
  watch:
    - en: "Only one review is from after 2018; it found the field trip poorly organised and reports marked by graduate students, and advised taking it only if you need it."
      zh: "2018 年以后只有一条评价：觉得野外考察组织不好，报告由研究生批改，建议非必要别选。"
      zh-TW: "2018 年以後只有一則評價：覺得野外考察安排不好，報告由研究生批改，建議非必要別選。"
      ja: "2018年より後のレビューは1件だけ。フィールドトリップの運営が悪く、レポートは大学院生が採点し、必要がなければ取らないよう勧めている。"
      ko: "2018년 이후 리뷰는 하나뿐인데, 현장 학습 운영이 엉성하고 보고서를 대학원생이 채점했다며 필요할 때만 들으라고 했다."
      vi: "Chỉ có một đánh giá sau 2018: thấy chuyến thực địa tổ chức kém, báo cáo do học viên sau đại học chấm, và khuyên chỉ học nếu cần."
      ms: "Hanya satu ulasan selepas 2018; ia dapati lawatan lapangan kurang teratur dan laporan ditanda pelajar siswazah, dan nasihatkan ambil hanya jika perlu."
      id: "Hanya satu ulasan setelah 2018; ia merasa kunjungan lapangan kurang teratur dan laporan dinilai mahasiswa pascasarjana, dan menyarankan ambil hanya kalau perlu."
      hi: "2018 के बाद सिर्फ़ एक रिव्यू है; उसे फ़ील्ड ट्रिप अव्यवस्थित और रिपोर्ट ग्रेजुएट छात्रों द्वारा जाँची हुई लगी, और ज़रूरत हो तभी लेने की सलाह दी।"
