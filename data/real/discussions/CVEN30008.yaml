points:
  - en: "Widely seen as straightforward and easy to score well in, though the content is dry."
    zh: "普遍认为简单易拿高分，但内容比较枯燥。"
    zh-TW: "普遍認為簡單、容易拿高分，不過內容很枯燥。"
    ja: "素直で高得点を取りやすいと広く見られているが、内容は退屈。"
    ko: "대체로 무난하고 고득점이 쉽다는 평이지만 내용은 지루하다."
    vi: "Nhìn chung được xem là dễ và dễ đạt điểm cao, dù nội dung khô khan."
    ms: "Secara meluas dianggap mudah dan senang mendapat markah tinggi, walaupun kandungannya membosankan."
    id: "Banyak dinilai mudah dan gampang dapat nilai bagus, meski materinya membosankan."
    hi: "आम तौर पर सीधा और अच्छे नंबर लाने में आसान माना जाता है, हालाँकि कंटेंट नीरस है।"
  - en: "The closed-book exam mixes memorising qualitative terms with probability calculations; formulas are provided."
    zh: "闭卷考试包括定性术语记忆和概率计算两部分，公式会提供。"
    zh-TW: "閉書考試包含定性術語的記憶和機率計算；公式會提供。"
    ja: "持ち込み不可の試験は、定性的な用語の暗記と確率計算の組み合わせ。公式は与えられる。"
    ko: "클로즈드북 시험은 정성적 용어 암기와 확률 계산이 섞여 있다. 공식은 제공된다."
    vi: "Bài thi đóng tài liệu kết hợp học thuộc thuật ngữ định tính và tính xác suất; có cho sẵn công thức."
    ms: "Peperiksaan buku tertutup menggabungkan hafalan istilah kualitatif dengan pengiraan kebarangkalian; formula disediakan."
    id: "Ujian closed-book memadukan hafalan istilah kualitatif dengan perhitungan probabilitas; rumus disediakan."
    hi: "क्लोज़्ड-बुक परीक्षा में क्वालिटेटिव शब्द याद करना और प्रॉबेबिलिटी कैलकुलेशन दोनों हैं; फ़ॉर्मूले दिए जाते हैं।"
  - en: "Assignments are group based and marked fairly leniently. It is a good elective for non-civil students."
    zh: "作业以小组为主，评分较宽松；适合非土木专业学生作为选修。"
    zh-TW: "作業以小組為主，評分相當寬鬆。很適合非土木系學生當選修。"
    ja: "課題はグループ形式で採点はかなり甘め。土木以外の学生の選択科目に良い。"
    ko: "과제는 조별이고 채점이 꽤 후하다. 토목 전공이 아닌 학생에게 좋은 선택 과목이다."
    vi: "Bài tập làm theo nhóm và chấm khá dễ. Đây là môn tự chọn tốt cho sinh viên không học xây dựng."
    ms: "Tugasan berasaskan kumpulan dan dimarkah agak longgar. Ia elektif yang baik untuk pelajar bukan sivil."
    id: "Tugasnya berbasis kelompok dan dinilai cukup longgar. Pilihan yang baik untuk mahasiswa non-sipil."
    hi: "असाइनमेंट ग्रुप में होते हैं और काफ़ी नरमी से जाँचे जाते हैं। नॉन-सिविल छात्रों के लिए अच्छा इलेक्टिव है।"
sections:
  content:
    - en: "Qualitative risk analysis plus probability-based calculations. Reviewers agree it is dry but straightforward and an easy H1; one called it a good elective outside civil engineering."
      zh: "定性风险分析加上基于概率的计算。同学一致认为内容枯燥但直接，H1 容易拿；有同学说非土木专业也适合当选修。"
      zh-TW: "定性風險分析加上以機率為基礎的計算。同學一致認為內容枯燥但直接，H1 容易拿；有同學說非土木主修也適合當選修。"
      ja: "定性的リスク分析と確率に基づく計算。退屈だが素直でH1は取りやすいという点で一致。土木以外の選択科目にも良いという声も一つ。"
      ko: "정성적 위험 분석과 확률 기반 계산. 지루하지만 직관적이고 H1이 쉽다는 데 의견이 모인다. 토목 외 전공의 선택 과목으로 좋다는 리뷰도 있다."
      vi: "Phân tích rủi ro định tính cộng tính toán dựa trên xác suất. Người học đồng ý là khô nhưng dễ hiểu và dễ đạt H1; một người nói hợp làm môn tự chọn ngoài ngành xây dựng."
      ms: "Analisis risiko kualitatif serta pengiraan berasaskan kebarangkalian. Pengulas sepakat ia hambar tetapi mudah dan H1 senang; seorang kata ia elektif baik di luar kejuruteraan awam."
      id: "Analisis risiko kualitatif plus perhitungan berbasis probabilitas. Pengulas sepakat ini kering tapi lugas dan H1 mudah; satu bilang cocok jadi pilihan di luar teknik sipil."
      hi: "गुणात्मक जोखिम विश्लेषण और प्रायिकता पर आधारित गणनाएँ। रिव्यूअर्स सहमत हैं कि यह नीरस पर सीधा है और H1 आसान; एक ने इसे सिविल इंजीनियरिंग के बाहर अच्छा इलेक्टिव कहा।"
  work:
    - en: "Group assignments, which are marked leniently, and a closed-book exam: defining and explaining qualitative terms, then probability calculations with a formula sheet provided."
      zh: "小组作业给分宽松；闭卷期末：先是解释定性术语，然后是概率计算，提供公式表。"
      zh-TW: "小組作業給分寬鬆；閉書期末：先是解釋定性術語，然後是機率計算，提供公式表。"
      ja: "採点の甘いグループ課題と、持ち込み不可の期末試験。前半は定性的な用語の説明、後半は公式表付きの確率計算。"
      ko: "채점이 후한 조별 과제와 클로즈드북 기말. 앞부분은 정성적 용어 설명, 뒷부분은 공식표가 주어지는 확률 계산이다."
      vi: "Bài nhóm chấm dễ, và bài thi đóng tài liệu: phần đầu định nghĩa, giải thích thuật ngữ định tính, phần sau tính xác suất có bảng công thức."
      ms: "Tugasan kumpulan yang dinilai longgar, dan peperiksaan buku tertutup: mentakrif dan menerangkan istilah kualitatif, kemudian pengiraan kebarangkalian dengan helaian formula disediakan."
      id: "Tugas kelompok yang dinilai longgar, dan ujian closed book: mendefinisikan dan menjelaskan istilah kualitatif, lalu perhitungan probabilitas dengan lembar rumus disediakan."
      hi: "नरमी से जाँचे जाने वाले ग्रुप असाइनमेंट, और बंद-किताब परीक्षा: पहले गुणात्मक शब्दों की परिभाषा और व्याख्या, फिर दिए गए सूत्र-पत्र के साथ प्रायिकता गणना।"
  study:
    - en: "Memorise the qualitative terms, and use tutorials to learn which formula fits each problem."
      zh: "把定性术语背熟；用 tutorial 学会每类题该用哪个公式。"
      zh-TW: "把定性術語背熟；用 tutorial 學會每類題該用哪個公式。"
      ja: "定性的な用語は暗記し、どの問題にどの公式を使うかはチュートリアルで身につける。"
      ko: "정성적 용어는 외우고, 문제마다 어떤 공식을 쓸지는 튜토리얼에서 익혀라."
      vi: "Học thuộc các thuật ngữ định tính, và dùng tutorial để biết bài nào dùng công thức nào."
      ms: "Hafal istilah kualitatif, dan guna tutorial untuk belajar formula mana sesuai untuk setiap masalah."
      id: "Hafalkan istilah kualitatif, dan pakai tutorial untuk belajar rumus mana yang cocok untuk tiap soal."
      hi: "गुणात्मक शब्द याद करें, और ट्यूटोरियल से सीखें कि किस सवाल में कौन-सा सूत्र लगता है।"
  watch:
    - en: "Reviews are mostly short and from 2023 or earlier, so details may have changed."
      zh: "评价大多很短，而且都是 2023 年或更早的，细节可能已有变化。"
      zh-TW: "評價大多很短，而且都是 2023 年或更早的，細節可能已有變化。"
      ja: "レビューの多くは短く、すべて2023年以前のもので、詳細は変わっている可能性がある。"
      ko: "리뷰 대부분이 짧고 2023년 이전 것이라 세부 사항이 바뀌었을 수 있다."
      vi: "Phần lớn đánh giá ngắn và từ 2023 trở về trước, nên chi tiết có thể đã thay đổi."
      ms: "Ulasan kebanyakannya pendek dan dari 2023 atau lebih awal, jadi butiran mungkin telah berubah."
      id: "Ulasan sebagian besar singkat dan dari 2023 atau sebelumnya, jadi detailnya mungkin sudah berubah."
      hi: "रिव्यू ज़्यादातर छोटे और 2023 या पहले के हैं, तो जानकारी बदल गई हो सकती है।"
