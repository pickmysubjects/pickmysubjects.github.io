points:
  - en: "Widely seen as straightforward and easy to score well in, though the content is dry."
    zh: "普遍认为简单易拿高分，但内容比较枯燥。"
    zh-TW: "普遍認為簡單、容易拿高分，不過內容很枯燥。"
    ja: "素直で高得点を取りやすいと広く見られているが、内容は退屈。"
    ko: "대체로 무난하고 고득점이 쉽다는 평이지만 내용은 지루하다."
    vi: "Nhìn chung được xem là dễ và dễ đạt điểm cao, dù nội dung khô khan."
    ms: "Secara meluas dianggap mudah dan senang mendapat markah tinggi, walaupun kandungannya membosankan."
    id: "Banyak dinilai mudah dan gampang dapat nilai bagus, meski materinya membosankan."
    hi: "आम तौर पर सीधा और अच्छे नंबर लाने में आसान माना जाता है, हालाँकि कंटेंट नीरस है।"
  - en: "The closed-book exam mixes memorising qualitative terms with probability calculations; formulas are provided."
    zh: "闭卷考试包括定性术语记忆和概率计算两部分，公式会提供。"
    zh-TW: "閉書考試包含定性術語的記憶和機率計算；公式會提供。"
    ja: "持ち込み不可の試験は、定性的な用語の暗記と確率計算の組み合わせ。公式は与えられる。"
    ko: "클로즈드북 시험은 정성적 용어 암기와 확률 계산이 섞여 있다. 공식은 제공된다."
    vi: "Bài thi đóng tài liệu kết hợp học thuộc thuật ngữ định tính và tính xác suất; có cho sẵn công thức."
    ms: "Peperiksaan buku tertutup menggabungkan hafalan istilah kualitatif dengan pengiraan kebarangkalian; formula disediakan."
    id: "Ujian closed-book memadukan hafalan istilah kualitatif dengan perhitungan probabilitas; rumus disediakan."
    hi: "क्लोज़्ड-बुक परीक्षा में क्वालिटेटिव शब्द याद करना और प्रॉबेबिलिटी कैलकुलेशन दोनों हैं; फ़ॉर्मूले दिए जाते हैं।"
  - en: "Assignments are group based and marked fairly leniently. It is a good elective for non-civil students."
    zh: "作业以小组为主，评分较宽松；适合非土木专业学生作为选修。"
    zh-TW: "作業以小組為主，評分相當寬鬆。很適合非土木系學生當選修。"
    ja: "課題はグループ形式で採点はかなり甘め。土木以外の学生の選択科目に良い。"
    ko: "과제는 조별이고 채점이 꽤 후하다. 토목 전공이 아닌 학생에게 좋은 선택 과목이다."
    vi: "Bài tập làm theo nhóm và chấm khá dễ. Đây là môn tự chọn tốt cho sinh viên không học xây dựng."
    ms: "Tugasan berasaskan kumpulan dan dimarkah agak longgar. Ia elektif yang baik untuk pelajar bukan sivil."
    id: "Tugasnya berbasis kelompok dan dinilai cukup longgar. Pilihan yang baik untuk mahasiswa non-sipil."
    hi: "असाइनमेंट ग्रुप में होते हैं और काफ़ी नरमी से जाँचे जाते हैं। नॉन-सिविल छात्रों के लिए अच्छा इलेक्टिव है।"
difficulty: easy
