points:
  - en: "Clearly taught, but the applied questions can be very hard. Do not treat it as an easy subject."
    zh: "讲授清晰，但应用题可能非常难，别当成轻松课。"
    zh-TW: "講解清楚，但應用題可能非常難，別當成輕鬆課。"
    ja: "教え方は分かりやすいが、応用問題はかなり難しいことも。楽な科目だと思わないこと。"
    ko: "설명은 명확하지만 응용 문제가 매우 어려울 수 있다. 쉬운 과목으로 여기지 말자."
    vi: "Dạy rõ ràng, nhưng câu ứng dụng có thể rất khó. Đừng coi đây là môn dễ."
    ms: "Diajar dengan jelas, tetapi soalan gunaan boleh sangat sukar. Jangan anggap ia subjek mudah."
    id: "Pengajarannya jelas, tapi soal terapan bisa sangat sulit. Jangan anggap mata kuliah mudah."
    hi: "साफ़ पढ़ाया जाता है, पर अप्लाइड सवाल बहुत कठिन हो सकते हैं। इसे आसान सब्जेक्ट न समझें।"
  - en: "Later topics such as fluid mechanics get harder and faster, so study steadily from about week 6."
    zh: "后期内容（如流体力学）更难更快，约第6周起要持续复习。"
    zh-TW: "後期內容（如流體力學）更難更快，大約第6週起要持續複習。"
    ja: "流体力学など後半のトピックは難しく速くなるので、6週目あたりからコツコツ勉強しよう。"
    ko: "유체역학 같은 후반 주제는 더 어렵고 빨라지니 6주차쯤부터 꾸준히 공부하자."
    vi: "Các chủ đề sau như cơ học chất lưu khó và nhanh hơn, nên học đều từ khoảng tuần 6."
    ms: "Topik kemudian seperti mekanik bendalir jadi lebih sukar dan laju, jadi belajar konsisten dari kira-kira minggu 6."
    id: "Topik berikutnya seperti mekanika fluida makin sulit dan cepat, jadi belajar rutin sejak sekitar minggu 6."
    hi: "बाद के टॉपिक जैसे फ़्लूइड मैकेनिक्स कठिन और तेज़ होते हैं, तो करीब हफ्ते 6 से लगातार पढ़ें।"
difficulty: hard
