points:
  - en: "Most reviewers criticised poor organisation, limited staff support and inconsistent feedback and marking."
    zh: "多数评论者批评课程组织差、教职人员支持有限、反馈和评分不一致。"
    zh-TW: "多數評論者批評課程組織差、教學人員支援有限、回饋和評分不一致。"
    ja: "多くのレビュアーが、運営のまずさ、スタッフのサポート不足、フィードバックと採点のばらつきを批判した。"
    ko: "대부분의 리뷰어가 부실한 운영, 제한적인 교직원 지원, 들쭉날쭉한 피드백과 채점을 비판했다."
    vi: "Đa số người đánh giá chê tổ chức kém, hỗ trợ từ giảng viên hạn chế, phản hồi và chấm điểm thiếu nhất quán."
    ms: "Kebanyakan pengulas mengkritik organisasi yang lemah, sokongan staf yang terhad serta maklum balas dan pemarkahan yang tidak konsisten."
    id: "Kebanyakan pengulas mengkritik pengelolaan yang buruk, dukungan staf yang terbatas, serta feedback dan penilaian yang tidak konsisten."
    hi: "ज़्यादातर रिव्यूअर्स ने ख़राब ऑर्गनाइज़ेशन, स्टाफ़ के सीमित सपोर्ट और असंगत फ़ीडबैक व मार्किंग की आलोचना की।"
  - en: "Content is seen as dry by many, and most advise taking it only if it is a prerequisite."
    zh: "许多人认为内容枯燥，多数建议只在作为先修课必须修读时才选。"
    zh-TW: "許多人覺得內容枯燥，多數建議只有當它是先修課時才修。"
    ja: "内容は退屈だという人が多く、前提科目として必要な場合だけ取るよう勧める声が大半。"
    ko: "내용이 지루하다는 사람이 많고, 선수 과목일 때만 들으라는 조언이 대부분이다."
    vi: "Nhiều người thấy nội dung khô khan, và đa số khuyên chỉ học khi đó là môn tiên quyết."
    ms: "Ramai anggap kandungannya membosankan, dan kebanyakan cadang ambil hanya jika ia prasyarat."
    id: "Banyak yang menilai materinya membosankan, dan kebanyakan menyarankan mengambilnya hanya jika jadi prasyarat."
    hi: "कई लोगों को कंटेंट नीरस लगता है, और ज़्यादातर इसे तभी लेने की सलाह देते हैं जब यह प्रीरिक्विज़िट हो।"
  - en: "Difficulty views are split: some called it easy with a high H1, others found questions poor and support lacking."
    zh: "对难度看法不一：有人认为简单、轻松拿高H1，也有人认为题目质量差、缺乏支持。"
    zh-TW: "對難度看法不一：有人認為簡單、能拿高H1，也有人覺得題目品質差、缺乏支援。"
    ja: "難易度の評価は分かれる。簡単で高いH1が取れたという人もいれば、問題の質が悪くサポートも足りないという人もいる。"
    ko: "난이도 평가는 갈린다. 쉽고 높은 H1을 받았다는 사람도, 문제 질이 나쁘고 지원이 부족했다는 사람도 있다."
    vi: "Ý kiến về độ khó trái chiều: có người bảo dễ, đạt H1 cao; người khác thấy câu hỏi kém và thiếu hỗ trợ."
    ms: "Pandangan tentang kesukaran berbeza: ada yang kata mudah dengan H1 tinggi, ada yang dapati soalan lemah dan sokongan kurang."
    id: "Pendapat soal tingkat kesulitan terbelah: ada yang bilang mudah dengan H1 tinggi, ada yang merasa soalnya jelek dan dukungannya kurang."
    hi: "कठिनाई पर राय बंटी है: कुछ ने इसे आसान कहा और ऊँचा H1 पाया, दूसरों को सवाल ख़राब और सपोर्ट कम लगा।"
  - en: "The exam was generally considered fair; group project marking was reported as inconsistent with draft feedback."
    zh: "期末考试普遍被认为公平；有人反映小组项目的评分与草稿反馈不一致。"
    zh-TW: "期末考普遍被認為公平；有人反映小組專題的評分和草稿回饋不一致。"
    ja: "試験はおおむね公平とされた。グループプロジェクトの採点が下書きへのフィードバックと食い違ったという報告もある。"
    ko: "시험은 대체로 공정하다는 평이었다. 조별 프로젝트 채점이 초안 피드백과 맞지 않았다는 말도 있다."
    vi: "Bài thi nhìn chung được coi là công bằng; có phản ánh rằng điểm dự án nhóm không khớp với phản hồi bản nháp."
    ms: "Peperiksaan secara umumnya dianggap adil; pemarkahan projek berkumpulan dilaporkan tidak selari dengan maklum balas draf."
    id: "Ujian umumnya dianggap adil; penilaian proyek kelompok dilaporkan tidak sesuai dengan feedback draf."
    hi: "परीक्षा आम तौर पर निष्पक्ष मानी गई; ग्रुप प्रोजेक्ट की मार्किंग ड्राफ़्ट फ़ीडबैक से मेल नहीं खाती बताई गई।"
difficulty: mixed
