points:
  - en: "Two reviewers found it engaging and **the lecturer passionate**, and called the content useful."
    zh: "两位评论者觉得课程有吸引力、**老师很有热情**，内容也有用。"
    zh-TW: "兩位評論者覺得課程有吸引力、**老師很有熱忱**，內容也有用。"
    ja: "2人は、引き込まれる授業で**講師が熱心**、内容も役に立つと評価している。"
    ko: "두 명은 흥미롭고 **강사가 열정적**이며 내용도 유익하다고 했다."
    vi: "Hai người thấy môn hấp dẫn, **giảng viên nhiệt huyết** và nội dung hữu ích."
    ms: "Dua pengulas dapati subjek ini menarik, **pensyarah bersemangat**, dan kandungannya berguna."
    id: "Dua pengulas merasa mata kuliah ini menarik, **dosennya bersemangat**, dan materinya berguna."
    hi: "दो रिव्यूअर को यह दिलचस्प लगा, **लेक्चरर बहुत उत्साही** और कंटेंट उपयोगी।"
  - en: "One found the lectures boring and hard to follow, though the tutorials were good; **a lot of theory and little practice**."
    zh: "一位觉得讲座无聊、难跟上，但辅导课不错；**理论多、实践少**。"
    zh-TW: "一位覺得講課無聊、難跟上，但輔導課不錯；**理論多、實作少**。"
    ja: "1人は講義が退屈で分かりにくいと感じたが、チュートリアルは良かった。**理論が多く実践が少ない**。"
    ko: "한 명은 강의가 지루하고 따라가기 어려웠지만 튜토리얼은 좋았다고 했다. **이론이 많고 실습은 적다**."
    vi: "Một người thấy bài giảng chán và khó theo, nhưng tutorial tốt; **nhiều lý thuyết, ít thực hành**."
    ms: "Seorang dapati kuliah membosankan dan sukar diikuti, tetapi tutorial bagus; **banyak teori, kurang praktikal**."
    id: "Satu orang merasa kuliahnya membosankan dan sulit diikuti, tapi tutorialnya bagus; **banyak teori, sedikit praktik**."
    hi: "एक को लेक्चर उबाऊ और समझने में कठिन लगे, पर ट्यूटोरियल अच्छे थे; **थ्योरी ज़्यादा, प्रैक्टिस कम**।"
  - en: "All reviews are from 2017 or earlier, so the subject may have changed since."
    zh: "所有评论都在2017年或更早，课程之后可能已有变化。"
    zh-TW: "所有評論都在 2017 年或更早，課程之後可能已有變化。"
    ja: "レビューはすべて2017年以前のもので、その後内容が変わっている可能性がある。"
    ko: "모든 후기가 2017년 이전 것이라 이후 바뀌었을 수 있다."
    vi: "Tất cả đánh giá đều từ năm 2017 trở về trước, nên môn học có thể đã thay đổi."
    ms: "Semua ulasan dari 2017 atau lebih awal, jadi subjek ini mungkin sudah berubah."
    id: "Semua ulasan dari 2017 atau sebelumnya, jadi mata kuliah ini mungkin sudah berubah."
    hi: "सारे रिव्यू 2017 या उससे पहले के हैं, इसलिए विषय अब बदल चुका हो सकता है।"
