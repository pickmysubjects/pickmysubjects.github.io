code: HIST20013
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/hist20013
reviews: 3
from: 2018
to: 2019
checked: 2026-10-17
points:
  - en: "Opinions split by year: a 2018 reviewer found it extremely interesting if you are self-motivated, while both 2019 reviewers found the lectures vague and unengaging and the content poorly organised."
    zh: "评价因年份而异：2018年一位评论者觉得只要自觉主动就非常有意思；2019年的两位则认为讲课空泛、不吸引人，内容组织混乱。"
    zh-TW: "評價因年份而異：2018年一位評論者覺得只要自覺主動就非常有意思；2019年的兩位則認為講課空泛、不吸引人，內容組織混亂。"
    ja: "年によって評価が分かれる。2018年の評者は自主的に取り組めばとても面白いとしたが、2019年の2人は講義が曖昧で退屈、内容の構成も悪いと感じた。"
    ko: "연도별로 평가가 갈림. 2018년 리뷰어는 스스로 동기부여가 되면 매우 흥미롭다고 했지만, 2019년 두 명은 강의가 모호하고 지루하며 구성이 엉성하다고 함."
    vi: "Ý kiến khác nhau theo năm: người năm 2018 thấy cực kỳ thú vị nếu tự giác, còn hai người năm 2019 thấy bài giảng mơ hồ, nhàm chán và nội dung thiếu tổ chức."
    ms: "Pendapat berbeza mengikut tahun: pengulas 2018 dapati ia sangat menarik jika anda bermotivasi sendiri, manakala kedua-dua pengulas 2019 rasa kuliahnya kabur, tidak menarik dan kurang tersusun."
    id: "Pendapat terbelah per tahun: pengulas 2018 merasa sangat menarik jika kamu mandiri, sedangkan dua pengulas 2019 menganggap kuliahnya samar, membosankan, dan isinya kurang tertata."
    hi: "राय साल के हिसाब से बँटी: 2018 के रिव्यूअर को यह ख़ुद-प्रेरित छात्रों के लिए बेहद दिलचस्प लगा, जबकि 2019 के दोनों रिव्यूअर्स को लेक्चर अस्पष्ट, नीरस और सामग्री बेतरतीब लगी।"
  - en: "Genocide is a huge topic, so lectures only give a broad overview; the assessments are your chance to go deep on what interests you, but one 2019 reviewer found the essay instructions too thin."
    zh: "种族灭绝是一个很大的主题，讲课只能概览；作业是深入研究自己感兴趣部分的机会，但2019年一位评论者觉得论文要求说明太少。"
    zh-TW: "種族滅絕是一個很大的主題，講課只能概覽；作業是深入研究自己感興趣部分的機會，但2019年一位評論者覺得論文要求說明太少。"
    ja: "ジェノサイドは大きなテーマなので講義は概観にとどまる。評価課題で興味のある部分を深掘りできるが、2019年の評者はエッセイの指示が少なすぎると感じた。"
    ko: "제노사이드는 방대한 주제라 강의는 개관에 그침. 과제에서 관심 있는 부분을 깊이 파고들 수 있지만, 2019년 리뷰어는 에세이 안내가 너무 부족하다고 느낌."
    vi: "Diệt chủng là chủ đề rất rộng nên bài giảng chỉ khái quát; bài đánh giá là cơ hội đào sâu phần bạn quan tâm, nhưng một người năm 2019 thấy hướng dẫn bài luận quá sơ sài."
    ms: "Genosid ialah topik yang sangat besar, jadi kuliah hanya beri gambaran umum; tugasan ialah peluang mendalami minat anda, tetapi seorang pengulas 2019 rasa arahan esei terlalu sedikit."
    id: "Genosida adalah topik yang sangat luas, jadi kuliah hanya memberi gambaran umum; tugas adalah kesempatan mendalami minatmu, tapi seorang pengulas 2019 merasa petunjuk esainya terlalu minim."
    hi: "नरसंहार बहुत बड़ा विषय है, इसलिए लेक्चर केवल सामान्य झलक देते हैं; असाइनमेंट में अपनी रुचि के हिस्से में गहराई तक जा सकते हैं, पर 2019 के एक रिव्यूअर को निबंध के निर्देश बहुत कम लगे।"
