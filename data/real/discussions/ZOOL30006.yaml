reviews: 5
from: 2014
to: 2022
checked: 2026-10-08
points:
  - en: "Ongoing assessment dominates: readings carry marks and the exam is only about 30%."
    zh: "以平时考核为主：阅读任务计分，期末仅占约30%。"
    zh-TW: "以平時考核為主：閱讀任務計分，期末僅占約30%。"
    ja: "継続評価が中心で、リーディングにも点があり、試験は約30%だけです。"
    ko: "수시 평가가 중심이며 읽기 과제에도 점수가 있고, 시험은 약 30%뿐입니다."
    vi: "Đánh giá thường xuyên chiếm phần lớn: bài đọc có tính điểm và thi chỉ khoảng 30%."
    ms: "Penilaian berterusan mendominasi: bacaan diberi markah dan peperiksaan hanya kira-kira 30%."
    id: "Penilaian berkelanjutan mendominasi: bacaan ada nilainya dan ujian hanya sekitar 30%."
    hi: "लगातार होने वाला असेसमेंट हावी है: रीडिंग्स पर मार्क्स हैं और एग्ज़ाम सिर्फ करीब 30% है।"
  - en: "Keep up with lectures and readings; readings can be long and it is easy to fall behind."
    zh: "要跟上讲座和阅读，阅读量可能很大，容易落后。"
    zh-TW: "要跟上講座和閱讀，閱讀量可能很大，容易落後。"
    ja: "講義とリーディングについていきましょう。リーディングは長いこともあり、遅れやすいです。"
    ko: "강의와 읽기 자료를 잘 따라가세요. 읽기 분량이 길 수 있어 뒤처지기 쉽습니다."
    vi: "Theo kịp bài giảng và bài đọc; bài đọc có thể dài và dễ bị tụt lại."
    ms: "Ikuti kuliah dan bacaan; bacaan boleh panjang dan mudah ketinggalan."
    id: "Ikuti kuliah dan bacaan; bacaannya bisa panjang dan mudah tertinggal."
    hi: "लेक्चर और रीडिंग्स के साथ बने रहें; रीडिंग्स लंबी हो सकती हैं और पीछे छूटना आसान है।"
  - en: "Some found the content dry, and the weekly polls sometimes have confusing wording."
    zh: "有人觉得内容枯燥，每周投票题有时措辞令人困惑。"
    zh-TW: "有人覺得內容枯燥，每週投票題有時措辭令人困惑。"
    ja: "内容が退屈だと感じた人もいて、毎週の投票問題は言い回しが分かりにくいことがあります。"
    ko: "내용이 지루하다는 사람도 있고, 매주 투표 문제의 표현이 헷갈릴 때가 있습니다."
    vi: "Có người thấy nội dung khô khan, và câu hỏi bình chọn hằng tuần đôi khi diễn đạt khó hiểu."
    ms: "Ada yang dapati kandungan membosankan, dan undian mingguan kadangkala bertutur mengelirukan."
    id: "Ada yang merasa materinya membosankan, dan polling mingguan kadang kalimatnya membingungkan."
    hi: "कुछ को कंटेंट नीरस लगा, और वीकली पोल्स की भाषा कभी-कभी उलझाने वाली होती है।"
sections:
  content:
    - en: "Reviewers found the topic interesting, though two say the content is a bit dry. The structure is what stands out: lots of ongoing assessment and a final exam worth only 30%."
      zh: "同学觉得主题有意思，不过有两位说内容有点枯燥。最突出的是课程结构：平时考核多，期末只占 30%。"
      zh-TW: "同學覺得主題有意思，不過有兩位說內容有點枯燥。最突出的是課程結構：平時考核多，期末只占 30%。"
      ja: "テーマは面白いという声が多いが、内容がやや退屈という人も二人。目立つのは構成で、継続的な評価が多く期末は30%だけ。"
      ko: "주제가 흥미롭다는 평이지만 두 명은 내용이 좀 건조하다고 한다. 눈에 띄는 건 구조로, 수시 평가가 많고 기말은 30%뿐이다."
      vi: "Người học thấy chủ đề thú vị, dù hai người nói nội dung hơi khô. Điểm nổi bật là cấu trúc: nhiều bài đánh giá liên tục, thi cuối chỉ 30%."
      ms: "Pengulas rasa topik menarik, walaupun dua kata kandungan agak hambar. Yang menonjol ialah strukturnya: banyak penilaian berterusan dan peperiksaan akhir hanya 30%."
      id: "Pengulas merasa topiknya menarik, meski dua bilang materinya agak kering. Yang menonjol strukturnya: banyak penilaian berkelanjutan dan ujian akhir hanya 30%."
      hi: "रिव्यूअर्स को विषय रोचक लगा, हालाँकि दो कहते हैं सामग्री थोड़ी नीरस है। ख़ास बात इसकी संरचना है: लगातार ढेर सारे आकलन और फ़ाइनल परीक्षा सिर्फ़ 30%।"
  work:
    - en: "Weekly readings (8 to 30+ pages) count for 20% and are fairly easy to get full marks on. Weekly polls keep you up to date, though one found some questions confusingly worded."
      zh: "每周阅读（8 到 30 多页）占 20%，比较容易拿满分。每周小投票让你跟上进度，不过有同学觉得部分题目措辞混乱。"
      zh-TW: "每週閱讀（8 到 30 多頁）占 20%，比較容易拿滿分。每週小投票讓你跟上進度，不過有同學覺得部分題目措辭混亂。"
      ja: "毎週のリーディング（8〜30ページ超）が20%で、満点は比較的取りやすい。毎週の投票で遅れずに済むが、問題文が分かりにくいものがあったという人も。"
      ko: "매주 리딩(8~30쪽 이상)이 20%이고 만점 받기 꽤 쉽다. 주간 투표로 진도를 따라가지만, 일부 문항 표현이 헷갈렸다는 사람도 있다."
      vi: "Bài đọc hằng tuần (8 đến hơn 30 trang) chiếm 20% và khá dễ được trọn điểm. Bình chọn hằng tuần giúp theo kịp, dù một người thấy vài câu diễn đạt khó hiểu."
      ms: "Bacaan mingguan (8 hingga 30+ halaman) bernilai 20% dan agak mudah dapat markah penuh. Undian mingguan membantu anda mengikuti, walaupun seorang rasa beberapa soalan mengelirukan."
      id: "Bacaan mingguan (8 sampai 30+ halaman) bernilai 20% dan cukup mudah dapat nilai penuh. Polling mingguan membuatmu tetap mengikuti, meski satu merasa beberapa soal membingungkan."
      hi: "साप्ताहिक रीडिंग (8 से 30+ पन्ने) 20% की है और पूरे अंक पाना काफ़ी आसान है। साप्ताहिक पोल से आप साथ बने रहते हैं, हालाँकि एक को कुछ सवाल उलझे हुए लगे।"
  study:
    - en: "Keep up with lectures since it's easy to fall behind, and pick out the key points. One reviewer suggests it as preparation for ZOOL30007."
      zh: "讲课要跟上，很容易落后，要抓重点。有同学建议把这门当作 ZOOL30007 的铺垫。"
      zh-TW: "講課要跟上，很容易落後，要抓重點。有同學建議把這門當作 ZOOL30007 的鋪墊。"
      ja: "遅れやすいので講義についていき、要点を拾うこと。ZOOL30007の準備として勧める人がいる。"
      ko: "뒤처지기 쉬우니 강의를 따라가고 핵심을 골라낼 것. 한 리뷰는 ZOOL30007 준비로 추천한다."
      vi: "Theo kịp bài giảng vì rất dễ bị tụt, và lọc ra ý chính. Một người khuyên học môn này để chuẩn bị cho ZOOL30007."
      ms: "Ikuti kuliah kerana mudah ketinggalan, dan pilih isi penting. Seorang pengulas cadangkan sebagai persediaan untuk ZOOL30007."
      id: "Ikuti kuliah karena mudah tertinggal, dan ambil poin pentingnya. Satu pengulas menyarankan sebagai persiapan ZOOL30007."
      hi: "लेक्चर के साथ बने रहें क्योंकि पीछे रह जाना आसान है, और मुख्य बातें चुनें। एक रिव्यूअर इसे ZOOL30007 की तैयारी के तौर पर सुझाता है।"
  watch:
    - en: "One reviewer found the news-article assignment (an extended abstract) not very useful. Reviews are from 2022 or earlier, so the setup may have changed."
      zh: "有同学觉得新闻文章作业（写扩展摘要）没什么用。评价都是 2022 年或更早的，课程安排可能已经变了。"
      zh-TW: "有同學覺得新聞文章作業（寫延伸摘要）沒什麼用。評價都是 2022 年或更早的，課程安排可能已經變了。"
      ja: "ニュース記事課題（拡張アブストラクト）はあまり役に立たないと一人が言う。レビューは2022年以前なので構成が変わっている可能性がある。"
      ko: "뉴스 기사 과제(확장 초록)는 별로 쓸모없었다고 한 리뷰가 말한다. 리뷰가 2022년 이전이라 구성이 바뀌었을 수 있다."
      vi: "Một người thấy bài viết dạng tin tức (tóm tắt mở rộng) không mấy hữu ích. Các đánh giá từ 2022 trở về trước nên cấu trúc có thể đã đổi."
      ms: "Seorang rasa tugasan artikel berita (abstrak lanjutan) kurang berguna. Ulasan dari 2022 atau lebih awal, jadi susunan mungkin telah berubah."
      id: "Satu pengulas merasa tugas artikel berita (abstrak diperluas) kurang berguna. Ulasan dari 2022 atau sebelumnya, jadi susunannya mungkin sudah berubah."
      hi: "एक रिव्यूअर को न्यूज़-लेख असाइनमेंट (विस्तारित सार) ज़्यादा उपयोगी नहीं लगा। रिव्यू 2022 या पहले के हैं, तो ढाँचा बदल गया हो सकता है।"
workload: heavy
