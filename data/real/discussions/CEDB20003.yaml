points:
  - en: "Very content heavy and broad, with lots of memorisation. Several reviewers found it hard to tell which details matter."
    zh: "内容非常多且广，需要大量记忆。多位评价表示很难判断哪些细节是重点。"
    zh-TW: "內容非常多又廣，要背很多。幾位評論者覺得很難判斷哪些細節重要。"
    ja: "内容が非常に多く範囲も広く、暗記量も多い。どの細部が重要か分かりにくいという声が複数ある。"
    ko: "내용이 매우 많고 넓으며 암기할 게 많다. 여러 리뷰어가 어떤 세부 사항이 중요한지 판단하기 어렵다고 했다."
    vi: "Rất nặng và rộng, phải học thuộc nhiều. Vài người thấy khó biết chi tiết nào là quan trọng."
    ms: "Sangat padat dan luas, dengan banyak hafalan. Beberapa pengulas sukar menentukan butiran mana yang penting."
    id: "Materinya sangat padat dan luas, dengan banyak hafalan. Beberapa pengulas sulit menentukan detail mana yang penting."
    hi: "कंटेंट बहुत ज़्यादा और व्यापक है, काफ़ी रटना पड़ता है। कई रिव्यूअर्स को समझ नहीं आया कि कौन-सी डिटेल ज़रूरी है।"
  - en: "Since 2020 it uses self-paced online modules instead of lectures, so you need strong self-discipline. Opinions on this format are split."
    zh: "自2020年起以自学在线模块代替讲座，需要很强的自律。大家对这种形式看法不一。"
    zh-TW: "自2020年起改用自學式線上單元取代講課，需要很強的自律。對這種形式看法不一。"
    ja: "2020年から講義の代わりに自分のペースで進めるオンライン教材を使うため、強い自己管理が必要。この形式への評価は分かれる。"
    ko: "2020년부터 강의 대신 자기 주도형 온라인 모듈을 써서 강한 자기관리가 필요하다. 이 방식에 대한 의견은 갈린다."
    vi: "Từ 2020 môn dùng các module online tự học thay cho bài giảng, nên cần kỷ luật cao. Ý kiến về hình thức này trái chiều."
    ms: "Sejak 2020 ia guna modul dalam talian kendiri menggantikan kuliah, jadi anda perlukan disiplin diri yang kuat. Pendapat tentang format ini berbelah bahagi."
    id: "Sejak 2020 kuliah diganti modul online mandiri, jadi kamu butuh disiplin diri yang kuat. Pendapat soal format ini terbelah."
    hi: "2020 से लेक्चर की जगह अपनी गति वाले ऑनलाइन मॉड्यूल हैं, इसलिए मज़बूत सेल्फ़-डिसिप्लिन चाहिए। इस फ़ॉर्मेट पर राय बंटी है।"
  - en: "The exam expects you to apply concepts, not just recall them. Pace yourself, because early modules support the later dense ones."
    zh: "考试要求应用概念而非单纯记忆。要合理安排进度，前期内容是后面难点模块的基础。"
    zh-TW: "考試要求你應用概念，不只是背誦。要安排好進度，因為前面的單元是後面密集單元的基礎。"
    ja: "試験では暗記だけでなく概念の応用が求められる。前半の単元が後半の難しい単元の土台になるので、ペース配分を大切に。"
    ko: "시험은 단순 암기가 아니라 개념 적용을 요구한다. 앞부분 모듈이 뒤쪽의 빽빽한 모듈을 받쳐 주니 페이스를 잘 조절하자."
    vi: "Bài thi yêu cầu vận dụng khái niệm, không chỉ nhớ lại. Hãy chia nhịp học hợp lý, vì các module đầu là nền cho các module dày đặc phía sau."
    ms: "Peperiksaan menuntut anda mengaplikasi konsep, bukan sekadar mengingat. Atur rentak anda, kerana modul awal menyokong modul padat kemudian."
    id: "Ujian menuntut kamu menerapkan konsep, bukan sekadar menghafal. Atur ritme belajar, karena modul awal menopang modul padat berikutnya."
    hi: "परीक्षा में कॉन्सेप्ट लागू करने होते हैं, सिर्फ़ याद नहीं करने। अपनी रफ़्तार संभालें, क्योंकि शुरुआती मॉड्यूल बाद के घने मॉड्यूल का आधार हैं।"
  - en: "Several suggest taking it only if you need it as a prerequisite or genuinely enjoy cell biology."
    zh: "多位评价建议只有在需要它作为先修课或真心喜欢细胞生物学时才选。"
    zh-TW: "幾位建議只有在需要它當先修課或真心喜歡細胞生物學時才修。"
    ja: "前提科目として必要な場合か、細胞生物学が本当に好きな場合だけ取るよう勧める声が複数ある。"
    ko: "선수 과목으로 필요하거나 세포생물학을 진짜 좋아할 때만 들으라는 조언이 여럿 있다."
    vi: "Vài người khuyên chỉ học nếu cần làm môn tiên quyết hoặc thật sự thích sinh học tế bào."
    ms: "Beberapa orang mencadangkan ambil hanya jika perlu sebagai prasyarat atau benar-benar suka biologi sel."
    id: "Beberapa menyarankan ambil hanya kalau butuh sebagai prasyarat atau benar-benar suka biologi sel."
    hi: "कई लोग इसे तभी लेने की सलाह देते हैं जब यह प्रीरिक्विज़िट हो या सेल बायोलॉजी सच में पसंद हो।"
workload: heavy
