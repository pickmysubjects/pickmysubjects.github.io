code: ENST20001
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/enst20001
reviews: 10
from: 2020
to: 2025
checked: 2026-10-08
points:
  - en: "Despite being a science subject, it is very arts-like, with essays and reports in a psychology/social science style."
    zh: "虽属理科课程，但风格很像文科，以心理学/社科式的论文和报告为主。"
    zh-TW: "雖然是理科科目，但風格很像文科，以心理學/社會科學式的論文和報告為主。"
    ja: "理系科目だがかなり文系寄りで、心理学・社会科学風のエッセイやレポートが中心。"
    ko: "이과 과목이지만 심리학/사회과학 스타일의 에세이와 보고서 위주라 문과에 가까움."
    vi: "Dù là môn khoa học, nó rất giống môn xã hội, với tiểu luận và báo cáo kiểu tâm lý học/khoa học xã hội."
    ms: "Walaupun subjek sains, ia sangat bergaya sastera, dengan esei dan laporan gaya psikologi/sains sosial."
    id: "Meski mata kuliah sains, gayanya sangat seperti ilmu sosial, dengan esai dan laporan bergaya psikologi/ilmu sosial."
    hi: "साइंस सब्जेक्ट होकर भी यह काफ़ी आर्ट्स जैसा है, साइकोलॉजी/सोशल साइंस स्टाइल के निबंध और रिपोर्ट के साथ।"
  - en: "Many say assignment instructions are vague and marking is harsh, so it is not an easy WAM booster."
    zh: "不少人反映作业要求模糊、评分偏严，并非轻松提分课。"
    zh-TW: "不少人反映作業要求模糊、評分偏嚴，不是輕鬆拉分的課。"
    ja: "課題の指示が曖昧で採点が厳しく、楽にWAMを上げられる科目ではないという声が多い。"
    ko: "과제 안내가 모호하고 채점이 엄격해 쉽게 WAM을 올리는 과목은 아니라는 의견이 많음."
    vi: "Nhiều người nói yêu cầu bài tập mơ hồ và chấm gắt, nên không phải môn dễ kéo WAM."
    ms: "Ramai kata arahan tugasan kabur dan pemarkahan ketat, jadi ia bukan penggalak WAM yang mudah."
    id: "Banyak yang bilang instruksi tugas samar dan penilaian ketat, jadi bukan pendongkrak WAM yang mudah."
    hi: "कई लोग कहते हैं असाइनमेंट के निर्देश अस्पष्ट हैं और मार्किंग सख़्त, तो यह आसान WAM बूस्टर नहीं है।"
  - en: "Opinions are split: some found it interesting and enjoyed the tutorials, others found it dry."
    zh: "评价两极：有人觉得有趣、喜欢辅导课讨论，也有人觉得枯燥。"
    zh-TW: "評價兩極：有人覺得有趣、喜歡小組討論課，也有人覺得枯燥。"
    ja: "意見は分かれる。面白くてチュートリアルを楽しんだ人もいれば、退屈だった人もいる。"
    ko: "의견이 갈림: 흥미롭고 튜토리얼이 즐거웠다는 사람도, 지루했다는 사람도 있음."
    vi: "Ý kiến trái chiều: có người thấy thú vị và thích tutorial, người khác thấy khô khan."
    ms: "Pendapat berbelah bahagi: ada yang rasa menarik dan seronok dengan tutorial, ada yang rasa membosankan."
    id: "Pendapat terbelah: ada yang merasa menarik dan menikmati tutorial, ada yang merasa membosankan."
    hi: "राय बँटी है: कुछ को दिलचस्प लगा और ट्यूटोरियल पसंद आए, कुछ को नीरस लगा।"
  - en: "Advice: keep up with readings and attend tutorials; strong essay writers do best."
    zh: "建议：跟上阅读材料并参加辅导课；擅长写论文的人表现最好。"
    zh-TW: "建議：跟上閱讀進度並出席小組討論課；擅長寫論文的人表現最好。"
    ja: "アドバイス：リーディングに遅れず、チュートリアルに出ること。エッセイが得意な人ほど良い結果に。"
    ko: "조언: 읽기 자료를 따라가고 튜토리얼에 참석하세요. 에세이를 잘 쓰는 사람이 가장 유리함."
    vi: "Lời khuyên: theo kịp bài đọc và đi tutorial; người viết luận giỏi làm tốt nhất."
    ms: "Nasihat: ikuti bacaan dan hadiri tutorial; penulis esei yang mahir paling berjaya."
    id: "Saran: ikuti bacaan dan hadiri tutorial; yang jago menulis esai paling unggul."
    hi: "सलाह: रीडिंग के साथ चलते रहें और ट्यूटोरियल में जाएँ; अच्छा निबंध लिखने वाले सबसे अच्छा करते हैं।"
sections:
  content:
    - en: "Environmental psychology: theory-based and much more like an arts subject than a science one. Some found it light and interesting; many found it dry. One psychology student felt it oversimplified things."
      zh: "环境心理学：偏理论，更像文科而不是理科。有人觉得轻松有趣，也有不少人觉得枯燥。一位心理学背景的同学觉得讲得太简化。"
      zh-TW: "環境心理學：偏理論，更像文科而非理科。有人覺得輕鬆有趣，也有不少人覺得乏味。一位心理學背景的同學覺得講得太簡化。"
      ja: "環境心理学。理論中心で、理系というより文系科目に近い。軽くて面白いという人も、退屈という人も多い。心理学専攻の一人は単純化しすぎだと感じた。"
      ko: "환경심리학. 이론 중심이며 이과보다 문과 과목에 가깝다. 가볍고 흥미롭다는 사람도, 건조하다는 사람도 많다. 심리학 전공자 한 명은 너무 단순화한다고 느꼈다."
      vi: "Tâm lý học môi trường: thiên lý thuyết, giống môn nghệ thuật hơn khoa học. Có người thấy nhẹ và thú vị; nhiều người thấy khô. Một sinh viên tâm lý thấy môn đơn giản hóa quá mức."
      ms: "Psikologi alam sekitar: berasaskan teori dan lebih mirip subjek sastera berbanding sains. Ada yang rasa ringan dan menarik; ramai rasa hambar. Seorang pelajar psikologi rasa ia terlalu dipermudah."
      id: "Psikologi lingkungan: berbasis teori dan lebih mirip mata kuliah seni daripada sains. Ada yang merasa ringan dan menarik; banyak yang merasa kering. Satu mahasiswa psikologi merasa terlalu disederhanakan."
      hi: "पर्यावरण मनोविज्ञान: थ्योरी आधारित और साइंस से ज़्यादा आर्ट्स विषय जैसा। कुछ को हल्का और रोचक लगा; कई को नीरस। एक मनोविज्ञान छात्र को लगा यह चीज़ों को ज़्यादा सरल बना देता है।"
  work:
    - en: "Essays and research reports of around 1500 words in a psychology-style structure, plus a take-home exam applying the whole semester. Many say instructions are vague and marking harsh."
      zh: "约 1500 字的 essay 和研究报告，用心理学的写作结构；还有一份运用整学期内容的 take-home 考试。很多人说要求含糊、改分严。"
      zh-TW: "約 1500 字的 essay 和研究報告，用心理學的寫作結構；還有一份運用整學期內容的 take-home 考試。很多人說要求含糊、給分嚴。"
      ja: "心理学形式の約1500語のエッセイや研究レポートと、学期全体を応用する持ち帰り試験。指示があいまいで採点が厳しいという声が多い。"
      ko: "심리학식 구조의 약 1500단어 에세이·연구 보고서와, 학기 전체를 적용하는 take-home 시험. 지침이 모호하고 채점이 가혹하다는 평이 많다."
      vi: "Bài luận và báo cáo nghiên cứu khoảng 1500 chữ theo cấu trúc kiểu tâm lý học, cùng bài thi mang về nhà áp dụng cả học kỳ. Nhiều người nói hướng dẫn mơ hồ, chấm gắt."
      ms: "Esei dan laporan penyelidikan kira-kira 1500 perkataan berstruktur gaya psikologi, serta peperiksaan bawa pulang yang mengaplikasi seluruh semester. Ramai kata arahan kabur dan pemarkahan keras."
      id: "Esai dan laporan riset sekitar 1500 kata dengan struktur gaya psikologi, plus ujian take-home yang menerapkan seluruh semester. Banyak yang bilang instruksinya kabur dan penilaiannya keras."
      hi: "लगभग 1500 शब्दों के निबंध और रिसर्च रिपोर्ट, मनोविज्ञान जैसी संरचना में, और पूरे सेमेस्टर को लागू करने वाली टेक-होम परीक्षा। कई कहते हैं निर्देश अस्पष्ट और मार्किंग सख़्त।"
  study:
    - en: "Do the readings, go to tutorials and use the weekly application questions; ask lots of questions about what a good essay looks like, especially if you haven't written psychology essays before."
      zh: "读完阅读、上 tutorial、做每周的应用题；多问好的 essay 应该是什么样，尤其是没写过心理学 essay 的人。"
      zh-TW: "讀完閱讀、上 tutorial、做每週的應用題；多問好的 essay 應該長什麼樣，尤其是沒寫過心理學 essay 的人。"
      ja: "文献を読み、チュートリアルに出て、毎週の応用問題を活用しよう。心理学のエッセイ経験がなければ、良いエッセイとは何かを積極的に質問を。"
      ko: "읽기를 하고 튜토리얼에 나가 주간 적용 문제를 활용하자. 심리학 에세이를 써 본 적 없다면 좋은 에세이가 어떤지 많이 물어보자."
      vi: "Đọc tài liệu, đi tutorial và làm câu hỏi ứng dụng hằng tuần; hỏi nhiều về một bài luận tốt trông thế nào, nhất là nếu chưa từng viết luận tâm lý học."
      ms: "Buat bacaan, hadir tutorial dan guna soalan aplikasi mingguan; banyak bertanya rupa esei yang baik, terutama jika belum pernah tulis esei psikologi."
      id: "Kerjakan bacaan, ikut tutorial, dan pakai soal aplikasi mingguan; banyak bertanya seperti apa esai yang bagus, terutama jika belum pernah menulis esai psikologi."
      hi: "रीडिंग करें, ट्यूटोरियल जाएँ और साप्ताहिक एप्लिकेशन सवाल इस्तेमाल करें; अच्छा निबंध कैसा होता है, यह खूब पूछें, खासकर अगर मनोविज्ञान निबंध पहले नहीं लिखे।"
  watch:
    - en: "Several reviewers warn it is not the WAM booster the handbook makes it look like; one says the assignment average was around 60 in their semester."
      zh: "好几位同学提醒，它不像 handbook 上看起来那样是拉 WAM 的课；有一位说他们那学期作业平均分约 60。"
      zh-TW: "好幾位同學提醒，它不像 handbook 上看起來那樣是拉 WAM 的課；有一位說他們那學期作業平均約 60。"
      ja: "ハンドブックの印象のようにWAMを上げられる科目ではないと警告する声が複数。ある学期は課題の平均が約60点だったという人が一人。"
      ko: "핸드북에서 보이는 것처럼 WAM을 올려주는 과목이 아니라는 경고가 여럿. 한 리뷰어는 그 학기 과제 평균이 약 60점이었다고 한다."
      vi: "Vài người cảnh báo môn không phải môn kéo WAM như handbook khiến bạn nghĩ; một người nói điểm trung bình bài tập kỳ đó khoảng 60."
      ms: "Beberapa pengulas beri amaran ia bukan penaik WAM seperti gambaran handbook; seorang kata purata tugasan semester mereka sekitar 60."
      id: "Beberapa reviewer mengingatkan ini bukan pendongkrak WAM seperti kesan di handbook; satu bilang rata-rata tugas di semesternya sekitar 60."
      hi: "कई रिव्यूअर चेताते हैं कि यह हैंडबुक में दिखने जैसा WAM बूस्टर नहीं है; एक कहते हैं उनके सेमेस्टर में असाइनमेंट औसत लगभग 60 था।"
