points:
  - en: "A lot of varied content, including special functions, integral equations and differential forms. Some parts are challenging."
    zh: "内容多而杂，含特殊函数、积分方程、微分形式等，部分有难度。"
    zh-TW: "內容多而雜，包括特殊函數、積分方程、微分形式等，部分有難度。"
    ja: "特殊関数、積分方程式、微分形式など多様な内容が多い。難しい部分もある。"
    ko: "특수함수, 적분방정식, 미분형식 등 다양한 내용이 많다. 어려운 부분도 있다."
    vi: "Nhiều nội dung đa dạng, gồm hàm đặc biệt, phương trình tích phân và dạng vi phân. Một số phần khá khó."
    ms: "Banyak kandungan pelbagai, termasuk fungsi khas, persamaan kamiran dan bentuk pembezaan. Sesetengah bahagian mencabar."
    id: "Banyak materi beragam, termasuk fungsi khusus, persamaan integral, dan bentuk diferensial. Beberapa bagian menantang."
    hi: "बहुत विविध कंटेंट: स्पेशल फ़ंक्शन, इंटीग्रल इक्वेशन और डिफ़रेंशियल फ़ॉर्म्स। कुछ हिस्से चुनौतीपूर्ण हैं।"
  - en: "Physics background helps, because many examples are physical, though no physics prerequisite is required."
    zh: "有物理基础会更有优势，例子多为物理问题，但不要求物理先修。"
    zh-TW: "有物理基礎會更有利，因為很多例子是物理問題，但不要求物理先修。"
    ja: "例の多くが物理なので物理の素養があると有利。ただし物理の前提科目は不要。"
    ko: "예시가 대부분 물리라 물리 배경이 있으면 유리하지만, 물리 선수과목은 필요 없다."
    vi: "Có nền vật lý sẽ có lợi vì nhiều ví dụ là vật lý, dù không yêu cầu môn tiên quyết vật lý."
    ms: "Latar belakang fizik membantu kerana banyak contoh berkaitan fizik, walaupun tiada prasyarat fizik."
    id: "Latar belakang fisika membantu karena banyak contoh bersifat fisika, meski tidak ada prasyarat fisika."
    hi: "फ़िज़िक्स बैकग्राउंड मदद करता है, क्योंकि कई उदाहरण फ़िज़िक्स के हैं, हालाँकि फ़िज़िक्स प्रीरिक्विज़िट ज़रूरी नहीं।"
  - en: "Do all tutorial questions. One recent reviewer found the assignment questions unclear."
    zh: "建议做完所有辅导题；近年有人反映作业题目表述不清。"
    zh-TW: "建議做完所有習題；近年有人反映作業題目表述不清。"
    ja: "チュートリアル問題はすべて解こう。最近のレビューでは課題の問題文が分かりにくかったという声も。"
    ko: "튜토리얼 문제를 모두 풀자. 최근 한 후기는 과제 문제가 불명확했다고 했다."
    vi: "Làm hết bài tutorial. Một đánh giá gần đây thấy đề bài tập không rõ ràng."
    ms: "Buat semua soalan tutorial. Seorang pengulas terkini dapati soalan tugasan kurang jelas."
    id: "Kerjakan semua soal tutorial. Satu ulasan terbaru menilai soal tugasnya kurang jelas."
    hi: "सारे ट्यूटोरियल सवाल करें। एक हालिया रिव्यूअर को असाइनमेंट के सवाल अस्पष्ट लगे।"
