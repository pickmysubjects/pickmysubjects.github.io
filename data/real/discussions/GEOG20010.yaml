from: 2016
to: 2024
checked: 2026-10-13
points:
  - en: "Most reviewers found the content interesting and enjoyable, with a view of China that differs from what the media usually shows. The newest (2024) review was briefly positive."
    zh: "多数评论者觉得内容有趣，对中国的呈现与媒体常见的角度不同。最新（2024年）的评论简短正面。"
    zh-TW: "多數評論者覺得內容有趣，對中國的呈現和媒體常見的角度不同。最新（2024年）的評論簡短正面。"
    ja: "多くのレビューで内容は面白く楽しいとされ、メディアでよく見る中国像とは違う視点が得られたという。最新（2024年）のレビューも短く好意的。"
    ko: "대부분 내용이 흥미롭고 재미있다는 평이며, 언론에서 흔히 보는 것과 다른 중국의 모습을 배운다고 함. 최신(2024년) 리뷰도 짧게 긍정적."
    vi: "Phần lớn người đánh giá thấy nội dung thú vị, cho góc nhìn về Trung Quốc khác với truyền thông thường đưa. Đánh giá mới nhất (2024) ngắn gọn và tích cực."
    ms: "Kebanyakan pengulas dapati kandungannya menarik dan menyeronokkan, dengan gambaran China yang berbeza daripada media biasa. Ulasan terbaru (2024) ringkas dan positif."
    id: "Sebagian besar pengulas merasa materinya menarik dan menyenangkan, dengan gambaran China yang berbeda dari media biasanya. Ulasan terbaru (2024) singkat dan positif."
    hi: "ज़्यादातर रिव्यूअर्स को कंटेंट दिलचस्प लगा, जिसमें चीन की तस्वीर मीडिया से अलग दिखती है। सबसे नई (2024) रिव्यू छोटी और पॉज़िटिव थी।"
  - en: "Assessments are mostly written pieces, often on topics you choose yourself, so expect to do some writing and preparation."
    zh: "考核以写作为主，题目常可自选，需要做一定的写作和准备。"
    zh-TW: "考核以寫作為主，題目常可自選，需要做一定的寫作和準備。"
    ja: "評価は主に文章課題で、テーマを自分で選べることが多い。ある程度の執筆と準備が必要。"
    ko: "평가는 주로 글쓰기 과제이고 주제를 직접 고를 수 있는 경우가 많음. 어느 정도 글쓰기와 준비가 필요함."
    vi: "Bài đánh giá chủ yếu là bài viết, thường được tự chọn chủ đề, nên cần chuẩn bị và viết khá nhiều."
    ms: "Penilaian kebanyakannya tugasan bertulis, selalunya dengan topik pilihan sendiri, jadi perlu menulis dan bersedia."
    id: "Penilaian sebagian besar berupa tulisan, sering dengan topik pilihan sendiri, jadi siap-siap menulis dan bersiap."
    hi: "असेसमेंट ज़्यादातर लिखित होते हैं, अक्सर खुद चुने विषय पर, तो कुछ लिखने और तैयारी की उम्मीद रखें।"
  - en: "In 2016 and 2022 some found the organisation weak: readings and tutorial material did not always match lectures, and a 2016 in-class quiz tested scattered lecture details."
    zh: "2016和2022年有人觉得组织欠佳：阅读和辅导内容与讲课不总一致，2016年的课堂小测考的是零散的讲课细节。"
    zh-TW: "2016和2022年有人覺得組織不佳：閱讀和輔導內容與講課不總一致，2016年的課堂小考考的是零散的講課細節。"
    ja: "2016年と2022年には運営が弱いという声も。リーディングやチュートリアルが講義と合わないことがあり、2016年の授業内クイズは講義の細かい点を問うものだった。"
    ko: "2016년과 2022년에는 운영이 아쉽다는 의견도 있음. 읽기 자료와 튜토리얼이 강의와 맞지 않을 때가 있었고, 2016년 수업 중 퀴즈는 강의의 자잘한 내용을 물었음."
    vi: "Năm 2016 và 2022 có người thấy khâu tổ chức chưa tốt: tài liệu đọc và tutorial không luôn khớp bài giảng, bài quiz trên lớp năm 2016 hỏi các chi tiết rời rạc."
    ms: "Pada 2016 dan 2022 ada yang dapati organisasinya lemah: bacaan dan bahan tutorial tidak selalu sepadan dengan kuliah, dan kuiz kelas 2016 menguji butiran kuliah yang berselerak."
    id: "Di 2016 dan 2022 ada yang merasa pengaturannya kurang: bacaan dan materi tutorial tak selalu sesuai kuliah, dan kuis kelas 2016 menguji detail kuliah yang acak."
    hi: "2016 और 2022 में कुछ को व्यवस्था कमज़ोर लगी: रीडिंग और ट्यूटोरियल लेक्चर से हमेशा मेल नहीं खाते थे, और 2016 की इन-क्लास क्विज़ में बिखरी लेक्चर डिटेल पूछी गईं।"
