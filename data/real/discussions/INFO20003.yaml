points:
  - en: "Well organised with very responsive staff on the discussion board and full tutorial solutions provided."
    zh: "课程组织良好，讨论区回复及时，并提供完整的辅导课答案。"
    zh-TW: "課程組織良好，討論區回覆很快，並提供完整的小組課解答。"
    ja: "よく整理され、掲示板での教員の対応も早く、チュートリアルの完全な解答も提供される。"
    ko: "잘 구성되어 있고 토론 게시판 답변이 빠르며, 튜토리얼 전체 해답이 제공됨."
    vi: "Tổ chức tốt, giảng viên trả lời rất nhanh trên diễn đàn và có đáp án tutorial đầy đủ."
    ms: "Tersusun baik dengan staf yang sangat responsif di papan perbincangan dan jawapan tutorial penuh disediakan."
    id: "Tertata dengan staf yang sangat responsif di forum diskusi dan jawaban tutorial lengkap disediakan."
    hi: "अच्छी तरह व्यवस्थित, डिस्कशन बोर्ड पर स्टाफ़ बहुत जल्दी जवाब देता है और ट्यूटोरियल के पूरे सॉल्यूशन मिलते हैं।"
  - en: "Covers ER modelling, SQL and query processing; the second half is more theory-heavy and dry."
    zh: "涵盖ER建模、SQL和查询处理，后半部分偏理论、较枯燥。"
    zh-TW: "涵蓋ER建模、SQL和查詢處理；後半部比較偏理論、較枯燥。"
    ja: "ERモデリング、SQL、クエリ処理を扱う。後半は理論寄りで単調。"
    ko: "ER 모델링, SQL, 쿼리 처리를 다루며, 후반부는 이론 위주라 지루함."
    vi: "Gồm mô hình ER, SQL và xử lý truy vấn; nửa sau nặng lý thuyết và khô khan hơn."
    ms: "Merangkumi pemodelan ER, SQL dan pemprosesan pertanyaan; separuh kedua lebih teori dan membosankan."
    id: "Mencakup pemodelan ER, SQL, dan pemrosesan query; paruh kedua lebih teoretis dan membosankan."
    hi: "ER मॉडलिंग, SQL और क्वेरी प्रोसेसिंग शामिल; दूसरा हिस्सा ज़्यादा थ्योरी वाला और नीरस है।"
  - en: "Assignments are fair: ER modelling is subjective but leniently marked; practise SQL early."
    zh: "作业公平：ER建模较主观但评分宽松，建议尽早练习SQL。"
    zh-TW: "作業公平：ER建模比較主觀但評分寬鬆；SQL要及早練習。"
    ja: "課題は公平。ERモデリングは主観的だが採点は甘い。SQLは早めに練習を。"
    ko: "과제는 공정함: ER 모델링은 주관적이지만 후하게 채점되며, SQL은 일찍 연습하세요."
    vi: "Bài tập công bằng: mô hình ER mang tính chủ quan nhưng chấm dễ; hãy luyện SQL sớm."
    ms: "Tugasan adil: pemodelan ER subjektif tetapi dimarkah longgar; latih SQL awal-awal."
    id: "Tugas adil: pemodelan ER subjektif tapi dinilai longgar; latih SQL sejak awal."
    hi: "असाइनमेंट निष्पक्ष हैं: ER मॉडलिंग सब्जेक्टिव है पर मार्किंग नरम; SQL जल्दी प्रैक्टिस करें।"
  - en: "The open-book exam tests small details, so bring well-organised notes, tutorial solutions and the formula sheet."
    zh: "开卷考试会考细节，建议带上整理好的笔记、辅导课答案和公式表。"
    zh-TW: "開書考試會考小細節，所以帶上整理好的筆記、小組課解答和公式表。"
    ja: "持ち込み可の試験は細かい点を問うので、整理したノート、チュートリアル解答、公式シートを持参しよう。"
    ko: "오픈북 시험은 세부 사항을 묻으니 잘 정리한 노트, 튜토리얼 해답, 공식표를 챙기세요."
    vi: "Bài thi mở sách hỏi chi tiết nhỏ, nên mang ghi chú được sắp xếp tốt, đáp án tutorial và bảng công thức."
    ms: "Peperiksaan buku terbuka menguji butiran kecil, jadi bawa nota tersusun, jawapan tutorial dan helaian formula."
    id: "Ujian open-book menguji detail kecil, jadi bawa catatan yang rapi, jawaban tutorial, dan lembar rumus."
    hi: "ओपन-बुक एग्ज़ाम छोटी बारीकियाँ पूछता है, तो व्यवस्थित नोट्स, ट्यूटोरियल सॉल्यूशन और फ़ॉर्मूला शीट साथ रखें।"
sections:
  content:
    - en: "Practical: ER modelling, SQL, then query processing and optimisation, plus NoSQL and other database theory. Most found it well run; some found the later theory dry."
      zh: "偏实用：ER 建模、SQL，然后是查询处理和优化，还有 NoSQL 等数据库理论。多数人觉得组织得好；也有人觉得后面的理论很枯燥。"
      zh-TW: "偏實用：ER 建模、SQL，接著是查詢處理與最佳化，還有 NoSQL 等資料庫理論。多數人覺得安排得好；也有人覺得後面的理論很乾。"
      ja: "実践的：ERモデリング、SQL、クエリ処理と最適化、NoSQLなどのDB理論。運営が良いという声が多いが、後半の理論が退屈という人も。"
      ko: "실용적이다: ER 모델링, SQL, 쿼리 처리·최적화, NoSQL 등 DB 이론. 대부분 운영이 좋다고 하지만 후반 이론이 지루하다는 사람도 있다."
      vi: "Thực tế: mô hình ER, SQL, rồi xử lý và tối ưu truy vấn, cùng NoSQL và lý thuyết CSDL khác. Đa số thấy tổ chức tốt; vài người thấy phần lý thuyết sau khô khan."
      ms: "Praktikal: pemodelan ER, SQL, kemudian pemprosesan dan pengoptimuman pertanyaan, serta NoSQL dan teori pangkalan data lain. Kebanyakan rasa diurus baik; ada yang rasa teori kemudian hambar."
      id: "Praktis: pemodelan ER, SQL, lalu pemrosesan dan optimasi query, plus NoSQL dan teori basis data lain. Kebanyakan merasa dikelola baik; sebagian merasa teori belakangnya kering."
      hi: "व्यावहारिक: ER मॉडलिंग, SQL, फिर क्वेरी प्रोसेसिंग और ऑप्टिमाइज़ेशन, साथ में NoSQL और अन्य डेटाबेस थ्योरी। ज़्यादातर को अच्छी तरह चलता लगा; कुछ को बाद की थ्योरी नीरस लगी।"
    - en: "Reviewers disagree on difficulty: some found it easy to do well, while others say applying the ideas and the I/O cost calculations take real effort."
      zh: "难度看法不一：有人觉得容易拿高分，也有人说应用概念和 I/O 成本计算需要下功夫。"
      zh-TW: "難度看法不一：有人覺得容易拿高分，也有人說應用概念和 I/O 成本計算需要下功夫。"
      ja: "難易度は意見が分かれ、高得点は簡単という人もいれば、概念の応用やI/Oコスト計算は手間がかかるという人もいる。"
      ko: "난이도 의견이 갈린다. 고득점이 쉽다는 사람도, 개념 적용과 I/O 비용 계산은 품이 든다는 사람도 있다."
      vi: "Ý kiến về độ khó khác nhau: có người thấy dễ đạt điểm cao, người khác nói áp dụng ý tưởng và tính chi phí I/O cần công sức thật."
      ms: "Pengulas tidak sependapat tentang kesukaran: ada yang rasa mudah buat baik, ada yang kata mengaplikasi idea dan pengiraan kos I/O perlukan usaha sebenar."
      id: "Pendapat soal tingkat kesulitan berbeda: ada yang merasa mudah dapat nilai bagus, ada yang bilang menerapkan konsep dan menghitung biaya I/O butuh usaha."
      hi: "कठिनाई पर राय अलग: कुछ को अच्छा करना आसान लगा, कुछ कहते हैं विचारों को लागू करना और I/O लागत की गणना मेहनत माँगती है।"
  work:
    - en: "Three assignments (ER model from a case study, SQL, a query-processing quiz) plus weekly quizzes; ER marking judges whether your design is justified, not one right answer. Some found quiz questions very niche."
      zh: "三份作业（根据案例画 ER 模型、SQL、查询处理测验）加每周小测；ER 评分看设计是否合理，没有唯一答案。有人觉得小测题目很偏。"
      zh-TW: "三份作業（依案例畫 ER 模型、SQL、查詢處理測驗）加每週小考；ER 評分看設計是否有理，沒有唯一答案。有人覺得小考題目很偏。"
      ja: "課題は3つ（ケーススタディからERモデル、SQL、クエリ処理クイズ）と毎週のクイズ。ERは正解一つでなく設計の妥当性で採点。クイズが細かすぎるという声も。"
      ko: "과제 세 개(사례 기반 ER 모델, SQL, 쿼리 처리 퀴즈)와 주간 퀴즈. ER은 정답 하나가 아니라 설계의 타당성으로 채점한다. 퀴즈가 너무 지엽적이라는 사람도 있다."
      vi: "Ba bài tập (mô hình ER từ case study, SQL, quiz xử lý truy vấn) cùng quiz hằng tuần; ER chấm theo lập luận thiết kế, không có một đáp án đúng. Vài người thấy quiz hỏi quá chi tiết."
      ms: "Tiga tugasan (model ER dari kajian kes, SQL, kuiz pemprosesan pertanyaan) serta kuiz mingguan; ER dimarkah ikut justifikasi reka bentuk, bukan satu jawapan betul. Ada yang rasa soalan kuiz terlalu khusus."
      id: "Tiga tugas (model ER dari studi kasus, SQL, kuis pemrosesan query) plus kuis mingguan; ER dinilai dari alasan desainnya, bukan satu jawaban benar. Ada yang merasa soal kuis terlalu detail."
      hi: "तीन असाइनमेंट (केस स्टडी से ER मॉडल, SQL, क्वेरी-प्रोसेसिंग क्विज़) और साप्ताहिक क्विज़; ER में डिज़ाइन का औचित्य जाँचा जाता है, एक सही उत्तर नहीं। कुछ को क्विज़ सवाल बहुत बारीक लगे।"
    - en: "The exam has been open book and is more theoretical; it tests small details from tutorials, and its SQL part builds on the SQL assignment."
      zh: "考试是开卷，偏理论；会考 tutorial 里的小细节，SQL 部分跟 SQL 作业相关。"
      zh-TW: "考試是開書，偏理論；會考 tutorial 裡的小細節，SQL 部分跟 SQL 作業相關。"
      ja: "試験はオープンブックで理論寄り。チュートリアルの細部が出題され、SQL部分はSQL課題が土台。"
      ko: "시험은 오픈북이고 이론 위주다. 튜토리얼의 세부 내용이 나오며 SQL 파트는 SQL 과제를 바탕으로 한다."
      vi: "Bài thi mở sách, thiên lý thuyết; hỏi cả chi tiết nhỏ trong tutorial, phần SQL dựa trên bài tập SQL."
      ms: "Peperiksaan buku terbuka dan lebih teori; ia menguji butiran kecil dari tutorial, dan bahagian SQL berasaskan tugasan SQL."
      id: "Ujiannya open-book dan lebih teoretis; menguji detail kecil dari tutorial, dan bagian SQL berdasar pada tugas SQL."
      hi: "परीक्षा ओपन-बुक और ज़्यादा सैद्धांतिक रही है; यह ट्यूटोरियल की छोटी बातें पूछती है, और SQL भाग SQL असाइनमेंट पर आधारित है।"
  study:
    - en: "Practise SQL early, print the tutorial solutions and formula sheet for the exam, and use Ed Discussion, where staff answer in detail. Keep about a week for each assignment."
      zh: "早点练 SQL，把 tutorial 答案和公式表打印带进考场，多用 Ed Discussion，老师回答很详细。每份作业留一周左右。"
      zh-TW: "早點練 SQL，把 tutorial 解答和公式表印出來帶進考場，多用 Ed Discussion，老師回答很詳細。每份作業留一週左右。"
      ja: "SQLは早めに練習し、チュートリアル解答と公式シートを印刷して試験に持参。Ed Discussionではスタッフが詳しく答えてくれる。各課題に1週間ほど確保を。"
      ko: "SQL을 일찍 연습하고, 튜토리얼 해답과 공식표를 인쇄해 시험에 가져가자. Ed Discussion에선 스태프가 자세히 답해 준다. 과제마다 일주일 정도 잡자."
      vi: "Luyện SQL sớm, in lời giải tutorial và bảng công thức mang vào phòng thi, dùng Ed Discussion vì staff trả lời rất chi tiết. Dành khoảng một tuần cho mỗi bài tập."
      ms: "Latih SQL awal, cetak jawapan tutorial dan helaian formula untuk peperiksaan, dan guna Ed Discussion di mana staf menjawab dengan terperinci. Peruntukkan kira-kira seminggu untuk setiap tugasan."
      id: "Latih SQL sejak awal, cetak solusi tutorial dan lembar rumus untuk ujian, dan pakai Ed Discussion karena staf menjawab detail. Sisihkan sekitar seminggu untuk tiap tugas."
      hi: "SQL जल्दी प्रैक्टिस करें, परीक्षा के लिए ट्यूटोरियल हल और फ़ॉर्मूला शीट प्रिंट करें, और Ed Discussion इस्तेमाल करें जहाँ स्टाफ़ विस्तार से जवाब देता है। हर असाइनमेंट को लगभग एक हफ़्ता दें।"
