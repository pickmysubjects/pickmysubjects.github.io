points:
  - en: "Well organised with very responsive staff on the discussion board and full tutorial solutions provided."
    zh: "课程组织良好，讨论区回复及时，并提供完整的辅导课答案。"
    zh-TW: "課程組織良好，討論區回覆很快，並提供完整的小組課解答。"
    ja: "よく整理され、掲示板での教員の対応も早く、チュートリアルの完全な解答も提供される。"
    ko: "잘 구성되어 있고 토론 게시판 답변이 빠르며, 튜토리얼 전체 해답이 제공됨."
    vi: "Tổ chức tốt, giảng viên trả lời rất nhanh trên diễn đàn và có đáp án tutorial đầy đủ."
    ms: "Tersusun baik dengan staf yang sangat responsif di papan perbincangan dan jawapan tutorial penuh disediakan."
    id: "Tertata dengan staf yang sangat responsif di forum diskusi dan jawaban tutorial lengkap disediakan."
    hi: "अच्छी तरह व्यवस्थित, डिस्कशन बोर्ड पर स्टाफ़ बहुत जल्दी जवाब देता है और ट्यूटोरियल के पूरे सॉल्यूशन मिलते हैं।"
  - en: "Covers ER modelling, SQL and query processing; the second half is more theory-heavy and dry."
    zh: "涵盖ER建模、SQL和查询处理，后半部分偏理论、较枯燥。"
    zh-TW: "涵蓋ER建模、SQL和查詢處理；後半部比較偏理論、較枯燥。"
    ja: "ERモデリング、SQL、クエリ処理を扱う。後半は理論寄りで単調。"
    ko: "ER 모델링, SQL, 쿼리 처리를 다루며, 후반부는 이론 위주라 지루함."
    vi: "Gồm mô hình ER, SQL và xử lý truy vấn; nửa sau nặng lý thuyết và khô khan hơn."
    ms: "Merangkumi pemodelan ER, SQL dan pemprosesan pertanyaan; separuh kedua lebih teori dan membosankan."
    id: "Mencakup pemodelan ER, SQL, dan pemrosesan query; paruh kedua lebih teoretis dan membosankan."
    hi: "ER मॉडलिंग, SQL और क्वेरी प्रोसेसिंग शामिल; दूसरा हिस्सा ज़्यादा थ्योरी वाला और नीरस है।"
  - en: "Assignments are fair: ER modelling is subjective but leniently marked; practise SQL early."
    zh: "作业公平：ER建模较主观但评分宽松，建议尽早练习SQL。"
    zh-TW: "作業公平：ER建模比較主觀但評分寬鬆；SQL要及早練習。"
    ja: "課題は公平。ERモデリングは主観的だが採点は甘い。SQLは早めに練習を。"
    ko: "과제는 공정함: ER 모델링은 주관적이지만 후하게 채점되며, SQL은 일찍 연습하세요."
    vi: "Bài tập công bằng: mô hình ER mang tính chủ quan nhưng chấm dễ; hãy luyện SQL sớm."
    ms: "Tugasan adil: pemodelan ER subjektif tetapi dimarkah longgar; latih SQL awal-awal."
    id: "Tugas adil: pemodelan ER subjektif tapi dinilai longgar; latih SQL sejak awal."
    hi: "असाइनमेंट निष्पक्ष हैं: ER मॉडलिंग सब्जेक्टिव है पर मार्किंग नरम; SQL जल्दी प्रैक्टिस करें।"
  - en: "The open-book exam tests small details, so bring well-organised notes, tutorial solutions and the formula sheet."
    zh: "开卷考试会考细节，建议带上整理好的笔记、辅导课答案和公式表。"
    zh-TW: "開書考試會考小細節，所以帶上整理好的筆記、小組課解答和公式表。"
    ja: "持ち込み可の試験は細かい点を問うので、整理したノート、チュートリアル解答、公式シートを持参しよう。"
    ko: "오픈북 시험은 세부 사항을 묻으니 잘 정리한 노트, 튜토리얼 해답, 공식표를 챙기세요."
    vi: "Bài thi mở sách hỏi chi tiết nhỏ, nên mang ghi chú được sắp xếp tốt, đáp án tutorial và bảng công thức."
    ms: "Peperiksaan buku terbuka menguji butiran kecil, jadi bawa nota tersusun, jawapan tutorial dan helaian formula."
    id: "Ujian open-book menguji detail kecil, jadi bawa catatan yang rapi, jawaban tutorial, dan lembar rumus."
    hi: "ओपन-बुक एग्ज़ाम छोटी बारीकियाँ पूछता है, तो व्यवस्थित नोट्स, ट्यूटोरियल सॉल्यूशन और फ़ॉर्मूला शीट साथ रखें।"
