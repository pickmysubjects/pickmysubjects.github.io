points:
  - en: "Two halves: climate/rainfall and catchment modelling, then soils and soil mechanics; it can feel like two separate subjects."
    zh: "分为两部分：气候/降雨与流域建模，以及土壤和土力学，感觉像两门课拼在一起。"
    zh-TW: "分為兩部分：氣候/降雨與集水區建模，以及土壤和土壤力學，感覺像兩門課拼在一起。"
    ja: "前半は気候・降雨と流域モデリング、後半は土壌と土質力学。別々の2科目のように感じることも。"
    ko: "전반부는 기후/강우와 유역 모델링, 후반부는 토양과 토질역학으로, 별개의 두 과목처럼 느껴질 수 있음."
    vi: "Hai nửa: khí hậu/lượng mưa và mô hình lưu vực, rồi đất và cơ học đất; có cảm giác như hai môn riêng."
    ms: "Dua bahagian: iklim/hujan dan pemodelan tadahan, kemudian tanah dan mekanik tanah; boleh terasa seperti dua subjek berasingan."
    id: "Dua bagian: iklim/curah hujan dan pemodelan DAS, lalu tanah dan mekanika tanah; bisa terasa seperti dua mata kuliah terpisah."
    hi: "दो हिस्से: क्लाइमेट/बारिश और कैचमेंट मॉडलिंग, फिर मिट्टी और सॉइल मैकेनिक्स; दो अलग सब्जेक्ट जैसा लग सकता है।"
  - en: "Content-heavy, with time-consuming Excel-based assignments worth little; rubrics were described as unclear."
    zh: "内容繁重，基于Excel的作业耗时但占分低，评分标准被认为不清晰。"
    zh-TW: "內容繁重，用Excel做的作業耗時但占分低，評分標準被認為不清楚。"
    ja: "内容が多く、Excelを使う課題は時間がかかる割に配点が低い。評価基準も不明確とのこと。"
    ko: "내용이 많고 Excel 기반 과제는 시간이 오래 걸리지만 비중이 작으며, 채점 기준이 불명확하다는 평."
    vi: "Nặng nội dung, bài tập dùng Excel tốn thời gian mà ít điểm; tiêu chí chấm được cho là không rõ."
    ms: "Kandungan padat, tugasan berasaskan Excel makan masa tapi wajaran kecil; rubrik dikatakan tidak jelas."
    id: "Materinya padat, tugas berbasis Excel menyita waktu tapi bobotnya kecil; rubrik dinilai tidak jelas."
    hi: "कंटेंट भारी है, Excel वाले असाइनमेंट में समय बहुत लगता है पर वेटेज कम है; रूब्रिक अस्पष्ट बताई गई।"
  - en: "The exam is tough and a hurdle; not a WAM booster, though an H1 is possible. Tutors were praised."
    zh: "考试较难且为必过门槛，不算提分课，但仍可能拿H1；辅导老师获好评。"
    zh-TW: "考試難而且是必過門檻，不算拉分課，但還是有機會拿H1。助教獲得好評。"
    ja: "試験は難しく合格必須（ハードル）。WAMを上げる科目ではないがH1も可能。チューターは好評。"
    ko: "시험이 어렵고 허들(필수 통과)이라 WAM을 올리는 과목은 아니지만 H1도 가능함. 튜터는 호평."
    vi: "Bài thi khó và là hurdle; không phải môn kéo WAM, dù vẫn có thể đạt H1. Tutor được khen."
    ms: "Peperiksaan sukar dan merupakan halangan; bukan penggalak WAM, walaupun H1 boleh dicapai. Tutor dipuji."
    id: "Ujiannya sulit dan wajib lulus (hurdle); bukan pendongkrak WAM, meski H1 tetap mungkin. Tutor dipuji."
    hi: "एग्ज़ाम कठिन है और हर्डल है; WAM बढ़ाने वाला नहीं, हालाँकि H1 संभव है। ट्यूटर्स की तारीफ़ हुई।"
workload: heavy
