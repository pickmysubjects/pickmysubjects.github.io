points:
  - en: "Reviewers from 2018 and 2020 enjoyed it, from Plato and the Sophists to Aristotle's ethics and the Stoics; one switched major because of it. Video explanations helped newcomers to old texts."
    zh: "2018和2020年的评论者都很喜欢，内容从柏拉图、智者派到亚里士多德伦理学和斯多葛派；有人因此换了专业。讲解视频帮助初读古典文本的人入门。"
    zh-TW: "2018和2020年的評論者都很喜歡，內容從柏拉圖、智者派到亞里斯多德倫理學和斯多葛派；有人因此換了主修。講解影片幫助初讀古典文本的人入門。"
    ja: "2018年と2020年の評者は皆楽しんだ。プラトンやソフィストからアリストテレス倫理学、ストア派まで扱い、1人はこれで専攻を変えた。解説動画は古典に不慣れな人の助けになった。"
    ko: "2018년과 2020년 리뷰어 모두 만족. 플라톤과 소피스트부터 아리스토텔레스 윤리학, 스토아학파까지 다루며 한 명은 이 과목 때문에 전공을 바꿈. 해설 영상이 고전 입문자에게 도움이 됨."
    vi: "Người đánh giá 2018 và 2020 đều thích, từ Plato, phái ngụy biện đến đạo đức học Aristotle và phái Khắc kỷ; một người đổi chuyên ngành vì môn này. Video giải thích giúp người mới đọc văn bản cổ."
    ms: "Pengulas 2018 dan 2020 menyukainya, daripada Plato dan kaum Sofis hingga etika Aristotle dan Stoik; seorang menukar major kerananya. Video penerangan membantu pembaca baru teks klasik."
    id: "Pengulas 2018 dan 2020 menyukainya, dari Plato dan kaum Sofis sampai etika Aristoteles dan Stoa; seorang pindah jurusan karenanya. Video penjelasan membantu pemula membaca teks kuno."
    hi: "2018 और 2020 के रिव्यूअर्स को यह पसंद आया, प्लेटो और सोफ़िस्टों से अरस्तू की नीतिशास्त्र और स्टोइक्स तक; एक ने इसी वजह से मेजर बदल लिया। व्याख्या वाले वीडियो पुराने ग्रंथ पहली बार पढ़ने वालों के काम आए।"
  - en: "In 2020 the lectures were long and content-heavy (one reviewer spent about four hours a week on notes), readings were heavy, and so many texts were covered that few got detailed discussion."
    zh: "2020年讲课长且内容多（有人每周记笔记要约四小时），阅读量大，覆盖文本太多，很少能深入讨论。"
    zh-TW: "2020年講課長且內容多（有人每週記筆記要約四小時），閱讀量大，涵蓋文本太多，很少能深入討論。"
    ja: "2020年は講義が長く内容も多く（ノート作りに週約4時間かかった人も）、読書量も多い。扱うテキストが多すぎて、詳しく議論できたものは少ない。"
    ko: "2020년엔 강의가 길고 내용이 많았고(필기에 주당 약 4시간 쓴 사람도 있음) 읽기도 많음. 다루는 텍스트가 너무 많아 깊이 토론한 것은 적음."
    vi: "Năm 2020 bài giảng dài, nhiều nội dung (một người mất khoảng 4 giờ mỗi tuần để ghi chép), bài đọc nặng, và quá nhiều văn bản nên ít cái được bàn sâu."
    ms: "Pada 2020 kuliah panjang dan padat (seorang luangkan kira-kira empat jam seminggu untuk nota), bacaan berat, dan terlalu banyak teks sehingga sedikit yang dibincang mendalam."
    id: "Pada 2020 kuliahnya panjang dan padat (seorang menghabiskan sekitar empat jam seminggu untuk catatan), bacaannya berat, dan terlalu banyak teks sehingga sedikit yang dibahas mendalam."
    hi: "2020 में लेक्चर लंबे और सामग्री से भरे थे (एक ने नोट्स पर हर हफ़्ते लगभग चार घंटे लगाए), रीडिंग्स भारी थीं, और इतने ग्रंथ थे कि कुछ पर ही गहराई से चर्चा हो पाई।"
  - en: "Tutorials were friendly and good for discussion, and assignments are manageable if you engage with the content and attend."
    zh: "辅导课氛围友好、适合讨论；只要认真投入、按时出勤，作业不算难。"
    zh-TW: "輔導課氛圍友好、適合討論；只要認真投入、按時出席，作業不算難。"
    ja: "チュートリアルは和やかで議論しやすく、内容に取り組み出席していれば課題はこなせる。"
    ko: "튜토리얼은 분위기가 좋고 토론하기 좋으며, 내용에 성실히 참여하고 출석하면 과제는 해낼 만함."
    vi: "Tutorial thân thiện, dễ thảo luận; bài tập vừa sức nếu bạn chịu tìm hiểu và đi học đầy đủ."
    ms: "Tutorial mesra dan baik untuk perbincangan, dan tugasan boleh diurus jika anda libatkan diri dengan kandungan dan hadir."
    id: "Tutorial ramah dan enak untuk diskusi, dan tugas bisa ditangani kalau kamu serius dengan materi dan rajin hadir."
    hi: "ट्यूटोरियल दोस्ताना और चर्चा के लिए अच्छे हैं; सामग्री से जुड़ें और हाज़िर रहें तो असाइनमेंट संभाले जा सकते हैं।"
workload: heavy
