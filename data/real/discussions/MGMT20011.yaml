reviews: 8
from: 2017
to: 2022
checked: 2026-10-14
points:
  - en: "Nearly everyone enjoyed the in-class negotiations with classmates as a fun way to apply the theory, though how they went doesn't count toward marks."
    zh: "几乎所有人都喜欢课上和同学进行的谈判练习，觉得是应用理论的好方式，不过谈判结果本身不计分。"
    zh-TW: "幾乎所有人都喜歡課堂上和同學進行的談判練習，覺得是應用理論的好方式，不過談判結果本身不計分。"
    ja: "クラスメートとの交渉演習は理論を応用できて楽しいとほぼ全員が好評。ただし交渉の結果自体は成績に入らない。"
    ko: "거의 모두가 수업 중 동료와의 협상 실습을 이론을 적용하는 재미있는 방법으로 즐겼다. 다만 협상 결과 자체는 점수에 반영되지 않는다."
    vi: "Gần như ai cũng thích các buổi đàm phán với bạn cùng lớp, một cách vui để áp dụng lý thuyết, dù kết quả đàm phán không tính điểm."
    ms: "Hampir semua suka sesi rundingan dengan rakan sekelas sebagai cara seronok mengaplikasi teori, walaupun keputusannya tidak dikira dalam markah."
    id: "Hampir semua orang menikmati latihan negosiasi dengan teman sekelas sebagai cara seru menerapkan teori, meski hasilnya tidak dihitung ke nilai."
    hi: "लगभग सभी को क्लास में साथियों के साथ होने वाली नेगोशिएशन पसंद आई, थ्योरी लागू करने का मज़ेदार तरीका; हालाँकि उनका नतीजा अंकों में नहीं गिना जाता।"
  - en: "Assessment is mostly writing that links theories to cases. Several found the criteria vague and marking arbitrary or strict, with effort not matching results."
    zh: "考核主要是把理论和案例联系起来的写作。好几位觉得评分标准含糊、打分随意或偏严，付出与成绩不成正比。"
    zh-TW: "考核主要是把理論和案例連結起來的寫作。好幾位覺得評分標準含糊、給分隨意或偏嚴，付出與成績不成正比。"
    ja: "評価は主に理論と事例を結びつける文章課題。基準が曖昧で採点が恣意的・厳しく、努力が点に結びつかないという声が複数。"
    ko: "평가는 대부분 이론과 사례를 연결하는 글쓰기다. 기준이 모호하고 채점이 자의적이거나 엄해서 노력만큼 결과가 안 나왔다는 의견이 여럿이다."
    vi: "Đánh giá chủ yếu là bài viết liên hệ lý thuyết với tình huống. Nhiều người thấy tiêu chí mơ hồ, chấm tùy tiện hoặc khắt khe, công sức không tương xứng kết quả."
    ms: "Penilaian kebanyakannya penulisan yang mengaitkan teori dengan kes. Beberapa orang dapati kriteria kabur dan pemarkahan sewenang-wenang atau ketat, usaha tidak sepadan hasil."
    id: "Penilaian sebagian besar berupa tulisan yang mengaitkan teori dengan kasus. Beberapa orang merasa kriterianya kabur dan penilaian sembarangan atau ketat, usaha tak sebanding hasil."
    hi: "असेसमेंट ज़्यादातर लेखन है जिसमें थ्योरी को केस से जोड़ना होता है। कई लोगों को मानदंड अस्पष्ट और मार्किंग मनमानी या सख़्त लगी, मेहनत के मुताबिक़ नतीजा नहीं मिला।"
  - en: "Reviewers disagree on whether it boosts your average: the newest calls it an easy WAM booster for strong essay writers, while others say typical marks sit around the low 70s."
    zh: "是否能拉高 WAM 看法不一：最新的评价认为擅长写论文的人很容易拿高分，另一些人则说平均分大约在 70 出头。"
    zh-TW: "是否能拉高 WAM 看法不一：最新的評價認為擅長寫論文的人很容易拿高分，另一些人則說平均分大約在 70 出頭。"
    ja: "WAMを上げられるかは意見が分かれる。最新のレビューはエッセイが得意な人には楽に点が取れるとするが、平均は70点台前半という声も。"
    ko: "WAM을 올려주는지는 의견이 갈린다. 최신 리뷰는 에세이를 잘 쓰면 쉽게 점수를 딴다고 하지만, 평균이 70점 초반이라는 사람도 있다."
    vi: "Ý kiến khác nhau về việc kéo WAM: đánh giá mới nhất nói người viết luận giỏi dễ lấy điểm cao, còn người khác nói điểm phổ biến chỉ quanh mức 70 mấy."
    ms: "Pengulas tidak sependapat sama ada ia naikkan WAM: yang terbaru kata mudah bagi penulis esei yang kuat, yang lain kata markah biasa sekitar awal 70-an."
    id: "Pengulas berbeda pendapat apakah ini mendongkrak WAM: yang terbaru bilang gampang bagi yang jago menulis esai, yang lain bilang nilai umumnya sekitar awal 70-an."
    hi: "क्या यह WAM बढ़ाता है, इस पर राय बँटी है: सबसे नया रिव्यू कहता है कि अच्छा निबंध लिखने वालों के लिए आसान है, जबकि दूसरे कहते हैं कि आम अंक 70 के आसपास रहते हैं।"
  - en: "Tip: the exam can differ from tutorial material, so watch the lectures and submit every assessment."
    zh: "建议：考试内容可能和辅导课不太一样，所以要看讲座，并交齐每一项作业。"
    zh-TW: "建議：考試內容可能和輔導課不太一樣，所以要看講座，並交齊每一項作業。"
    ja: "コツ：試験はチュートリアルの内容と違うことがあるので、講義を見て、課題はすべて提出しよう。"
    ko: "팁: 시험이 튜토리얼 내용과 다를 수 있으니 강의를 챙겨 보고 모든 과제를 제출하자."
    vi: "Mẹo: đề thi có thể khác nội dung tutorial, nên hãy xem bài giảng và nộp đủ mọi bài đánh giá."
    ms: "Tip: peperiksaan mungkin berbeza daripada bahan tutorial, jadi tonton kuliah dan hantar setiap tugasan."
    id: "Tips: ujian bisa berbeda dari materi tutorial, jadi tonton kuliah dan kumpulkan semua tugas."
    hi: "सुझाव: परीक्षा ट्यूटोरियल सामग्री से अलग हो सकती है, इसलिए लेक्चर देखें और हर असेसमेंट जमा करें।"
sections:
  content:
    - en: "Almost every reviewer found the in-class negotiations with classmates fun and a good way to apply the lecture concepts and get to know people."
      zh: "几乎所有同学都觉得课上和同学模拟谈判很好玩，能运用讲课概念，也能认识人。"
      zh-TW: "幾乎所有同學都覺得課堂上和同學模擬談判很好玩，能運用上課概念，也能認識人。"
      ja: "ほぼ全員が、授業での学生同士の交渉が楽しく、講義の概念を活かせて人とも知り合えると評価。"
      ko: "거의 모든 리뷰어가 수업 중 동기들과의 협상이 재미있고, 강의 개념을 적용하며 사람을 알아 가기 좋다고 했다."
      vi: "Hầu như ai cũng thấy các buổi đàm phán với bạn cùng lớp rất vui, giúp áp dụng khái niệm bài giảng và làm quen mọi người."
      ms: "Hampir semua pengulas dapati rundingan dalam kelas dengan rakan seronok dan cara baik untuk mengguna konsep kuliah serta berkenalan."
      id: "Hampir semua pengulas merasa negosiasi di kelas dengan teman seru dan cara bagus menerapkan konsep kuliah sekaligus berkenalan."
      hi: "लगभग हर रिव्यूअर को क्लास में सहपाठियों के साथ नेगोशिएशन मज़ेदार लगे, लेक्चर के कॉन्सेप्ट लागू करने और लोगों से जान-पहचान का अच्छा तरीक़ा।"
  work:
    - en: "Marks come from written work linking negotiations to theory, plus an essay and exam, not from how you negotiate. Several found the criteria vague and marking arbitrary or tutor-dependent."
      zh: "分数来自把谈判和理论联系起来的书面作业，以及论文和考试，而不是谈判表现本身。好几位觉得评分标准模糊，给分随意或看 tutor。"
      zh-TW: "分數來自把談判和理論連結的書面作業，以及論文和考試，而不是談判表現本身。好幾位覺得評分標準模糊，給分隨意或看 tutor。"
      ja: "成績は交渉の出来ではなく、交渉と理論を結びつける記述課題、エッセイ、試験で決まる。基準が曖昧で採点が恣意的、チューター次第という声が複数。"
      ko: "점수는 협상 실력이 아니라 협상을 이론과 연결하는 글쓰기 과제, 에세이, 시험에서 나온다. 기준이 모호하고 채점이 자의적이거나 튜터에 좌우된다는 의견이 여럿."
      vi: "Điểm đến từ bài viết liên hệ đàm phán với lý thuyết, cùng tiểu luận và bài thi, không phải từ kết quả đàm phán. Vài người thấy tiêu chí mơ hồ, chấm tùy tiện hoặc tùy tutor."
      ms: "Markah datang daripada kerja bertulis yang mengaitkan rundingan dengan teori, serta esei dan peperiksaan, bukan cara anda berunding. Beberapa rasa kriteria kabur dan pemarkahan sewenang-wenang atau ikut tutor."
      id: "Nilai berasal dari tulisan yang mengaitkan negosiasi dengan teori, plus esai dan ujian, bukan dari cara kamu bernegosiasi. Beberapa merasa kriterianya kabur dan penilaian asal-asalan atau tergantung tutor."
      hi: "अंक नेगोशिएशन को थ्योरी से जोड़ने वाले लिखित काम, निबंध और परीक्षा से मिलते हैं, नेगोशिएशन के प्रदर्शन से नहीं। कई को मानदंड अस्पष्ट और मार्किंग मनमानी या ट्यूटर पर निर्भर लगी।"
  watch:
    - en: "Reviewers disagree on WAM: one 2022 winter student called it an easy booster for good essay writers, others said results don't match the effort."
      zh: "能不能刷分看法不一：2022 年冬季班有同学说会写论文的话很容易拿分，其他人说付出和分数不成正比。"
      zh-TW: "能不能拉分看法分歧：2022 年冬季班有同學說會寫論文的話很容易拿分，其他人說付出和分數不成正比。"
      ja: "WAMについて意見が割れる。2022年ウィンターの学生はエッセイが得意なら簡単に上がるというが、努力に見合う結果が出ないという声も。"
      ko: "WAM 평가가 갈린다. 2022년 겨울 학기 학생은 에세이를 잘 쓰면 쉽게 올린다고 했지만, 노력에 비해 결과가 안 나온다는 의견도 있다."
      vi: "Ý kiến về WAM khác nhau: một người học kỳ đông 2022 nói dễ kéo điểm nếu viết luận tốt, người khác nói kết quả không tương xứng công sức."
      ms: "Pengulas tidak sepakat tentang WAM: seorang pelajar musim sejuk 2022 kata ia penaik mudah bagi penulis esei yang baik, yang lain kata hasil tidak setimpal usaha."
      id: "Pengulas tidak sepakat soal WAM: satu mahasiswa musim dingin 2022 bilang mudah mendongkrak nilai kalau jago esai, yang lain bilang hasilnya tidak sebanding usaha."
      hi: "WAM पर राय बँटी है: 2022 के विंटर के एक छात्र ने अच्छे निबंध लेखकों के लिए इसे आसान बूस्टर कहा, दूसरों ने कहा नतीजे मेहनत के मुताबिक़ नहीं।"
    - en: "All these reviews are from 2022 or earlier; teaching and assessment may have changed since."
      zh: "这些评价都是 2022 年或更早的，现在的教法和考核可能已经变了。"
      zh-TW: "這些評價都是 2022 年或更早的，現在的教法和考核可能已經變了。"
      ja: "レビューはすべて2022年以前のもの。授業や評価は変わっている可能性がある。"
      ko: "모든 리뷰가 2022년 이전 것이라 지금 수업과 평가는 달라졌을 수 있다."
      vi: "Tất cả đánh giá đều từ năm 2022 trở về trước; cách dạy và đánh giá có thể đã thay đổi."
      ms: "Semua ulasan ini dari 2022 atau lebih awal; pengajaran dan penilaian mungkin telah berubah."
      id: "Semua ulasan ini dari 2022 atau sebelumnya; pengajaran dan penilaian mungkin sudah berubah."
      hi: "ये सभी रिव्यू 2022 या उससे पहले के हैं; पढ़ाई और मूल्यांकन अब बदल चुके हो सकते हैं।"
difficulty: mixed
