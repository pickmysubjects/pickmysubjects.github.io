points:
  - en: "Widely called an easy, fair WAM booster with regular quizzes, leniently marked orals and an e-portfolio."
    zh: "普遍认为是轻松公平的提分课，有定期小测、评分宽松的口试和电子作品集。"
    zh-TW: "普遍認為是輕鬆公平的拉分課，有定期小考、評分寬鬆的口試和電子作品集。"
    ja: "定期的な小テスト、採点の甘い口頭試験、eポートフォリオがあり、楽で公平なWAM稼ぎの科目と広く言われる。"
    ko: "정기 퀴즈, 후하게 채점되는 구술시험, e-포트폴리오가 있어 쉽고 공정한 WAM 올리기 과목으로 통한다."
    vi: "Được nhiều người gọi là môn dễ, công bằng để kéo WAM, có quiz định kỳ, thi nói chấm dễ và e-portfolio."
    ms: "Dikenali sebagai subjek mudah dan adil untuk naikkan WAM, dengan kuiz berkala, lisan yang dimarkah longgar dan e-portfolio."
    id: "Banyak disebut mata kuliah mudah dan adil untuk naikkan WAM, dengan kuis rutin, ujian lisan yang longgar, dan e-portofolio."
    hi: "आसान, फेयर WAM बूस्टर माना जाता है: रेगुलर क्विज़, नरमी से मार्क होने वाले ओरल और ई-पोर्टफोलियो।"
  - en: "Two 2-hour seminars a week plus self-study packs; keep up with vocab and grammar consistently."
    zh: "每周两次2小时研讨课加自学材料，需持续跟进词汇和语法。"
    zh-TW: "每週兩次2小時研討課加自學教材，需持續跟上單字和文法。"
    ja: "週2回の2時間セミナーと自習教材。語彙と文法は継続的についていくこと。"
    ko: "주 2회 2시간 세미나와 자습 자료가 있다. 어휘와 문법을 꾸준히 따라가야 한다."
    vi: "Mỗi tuần hai buổi seminar 2 tiếng cùng tài liệu tự học; cần theo kịp từ vựng và ngữ pháp đều đặn."
    ms: "Dua seminar 2 jam seminggu serta pek belajar sendiri; ikuti kosa kata dan tatabahasa secara konsisten."
    id: "Dua seminar 2 jam per minggu plus paket belajar mandiri; ikuti kosakata dan tata bahasa secara konsisten."
    hi: "हफ्ते में दो 2-घंटे के सेमिनार और सेल्फ-स्टडी पैक; वोकैब और ग्रामर लगातार साथ-साथ करते रहें।"
  - en: "Recent reviews say the exam can be harder than expected, and hiragana must be learned early."
    zh: "近期评价称考试可能比预期难，平假名需尽早掌握。"
    zh-TW: "近期評價說考試可能比預期難，平假名要盡早學會。"
    ja: "最近のレビューでは試験が予想より難しいこともあり、ひらがなは早めに覚える必要があるとのこと。"
    ko: "최근 후기에 따르면 시험이 예상보다 어려울 수 있고, 히라가나는 일찍 익혀야 한다."
    vi: "Các đánh giá gần đây nói đề thi có thể khó hơn dự kiến, và cần học hiragana sớm."
    ms: "Ulasan terkini kata peperiksaan boleh lebih sukar daripada dijangka, dan hiragana mesti dipelajari awal."
    id: "Ulasan terbaru bilang ujiannya bisa lebih sulit dari perkiraan, dan hiragana harus dikuasai sejak awal."
    hi: "हाल के रिव्यू कहते हैं एग्ज़ाम उम्मीद से कठिन हो सकता है, और हीरागाना जल्दी सीखना ज़रूरी है।"
  - en: "Pair work can be challenging depending on your class."
    zh: "结对练习的难度取决于所在班级。"
    zh-TW: "兩人練習的難度取決於所在班級。"
    ja: "ペアワークはクラスによっては大変なこともある。"
    ko: "짝 활동은 반에 따라 힘들 수 있다."
    vi: "Làm việc theo cặp có thể khó tùy lớp của bạn."
    ms: "Kerja berpasangan boleh mencabar bergantung pada kelas anda."
    id: "Kerja berpasangan bisa menantang, tergantung kelasmu."
    hi: "क्लास के हिसाब से पेयर वर्क मुश्किल हो सकता है।"
difficulty: easy
