points:
  - en: "Older reviews call it a light extension of Year 12 physics and an easy mark. The 2022 reviews disagree: they found it hard, with a heavy workload."
    zh: "较早的评价认为它只是高中物理的延伸，容易拿分；但2022年的评价认为难度大、工作量重。"
  - en: "Labs ask you to finish experiments and a full write-up in about 2.5 hours. Many found them rushed or dull, but they are marked fairly and help your grade."
    zh: "实验课要在约2.5小时内完成实验和报告，很多人觉得赶或枯燥，但评分公平，能拉高总分。"
  - en: "Recent reviewers felt the lectures added little beyond the textbook. They relied on the textbook, past exams and online videos instead."
    zh: "近年的评价认为讲座内容基本照搬教材，大家更多靠教材、往年试卷和网上视频自学。"
  - en: "Exam views are split: some found it fair, others found it much harder than the past papers. Don't take it as an easy filler subject."
    zh: "对考试看法不一：有人觉得公平，有人觉得比往年题难很多。不要把它当轻松的凑学分课。"
