from: 2020
to: 2024
checked: 2026-10-21
points:
  - en: "Earlier reviewers loved the relaxed days of drawing and painting plants, and beginners felt well supported; marks rewarded effort and engagement."
    zh: "早期评价很喜欢整天画植物的轻松氛围，零基础的人也觉得有人带；分数看重投入和参与度。"
    zh-TW: "早期評價很喜歡整天畫植物的輕鬆氛圍，零基礎的人也覺得有人帶；分數看重投入和參與度。"
    ja: "以前のレビューでは植物を描いて過ごす穏やかな日々が好評で、初心者も支えを感じた。評価は努力と取り組み重視。"
    ko: "예전 후기는 식물을 그리며 보내는 여유로운 날들을 좋아했고 초보자도 도움을 받았다고 함. 점수는 노력과 참여 중심."
    vi: "Đánh giá cũ thích những ngày vẽ cây thư thả, người mới cũng thấy được hỗ trợ; điểm thưởng cho sự nỗ lực."
    ms: "Ulasan awal suka hari-hari santai melukis tumbuhan, pemula rasa dibantu; markah menghargai usaha."
    id: "Ulasan lama menyukai hari-hari santai menggambar tanaman, pemula merasa terbantu; nilai menghargai usaha."
    hi: "पुराने रिव्यू में पौधे बनाने के आरामदायक दिन पसंद आए, शुरुआती लोगों को भी मदद मिली; अंक मेहनत और भागीदारी पर।"
  - en: "The most recent reviews (2024) warn the intensive version is exhausting: long days, very specific briefs and little hands-on guidance."
    zh: "最新的（2024年）评价提醒密集班非常累：每天时间长、作业要求很具体，实际指导不多。"
    zh-TW: "最新的（2024年）評價提醒密集班非常累：每天時間長、作業要求很具體，實際指導不多。"
    ja: "最新（2024年）のレビューは集中講座が非常に大変だと警告：長い一日、細かい課題指定、実技指導は少なめ。"
    ko: "최근(2024년) 후기는 집중 과정이 매우 힘들다고 경고: 긴 하루, 매우 구체적인 과제, 실기 지도 부족."
    vi: "Đánh giá gần nhất (2024) cảnh báo bản cấp tốc rất mệt: ngày dài, yêu cầu rất cụ thể, ít hướng dẫn thực hành."
    ms: "Ulasan terkini (2024) memberi amaran versi intensif amat memenatkan: hari panjang, tugasan khusus, kurang bimbingan."
    id: "Ulasan terbaru (2024) memperingatkan versi intensif sangat melelahkan: hari panjang, tugas spesifik, minim bimbingan."
    hi: "हाल के (2024) रिव्यू चेताते हैं कि इंटेंसिव बहुत थकाऊ है: लंबे दिन, बहुत खास निर्देश और कम व्यावहारिक मार्गदर्शन।"
  - en: "Several say not to treat it as an easy mark: it suits people who already like drawing, and the semester version is gentler than the intensive."
    zh: "多人说别把它当轻松拿分课：适合本来就喜欢画画的人，学期版比密集班轻松。"
    zh-TW: "多人說別把它當輕鬆拿分課：適合本來就喜歡畫畫的人，學期版比密集班輕鬆。"
    ja: "楽に点が取れる科目ではないとの声が複数。もともと絵が好きな人向けで、学期版は集中講座より楽。"
    ko: "쉬운 학점용으로 보지 말라는 의견이 여럿: 원래 그림을 좋아하는 사람에게 맞고, 학기 과정이 집중 과정보다 수월."
    vi: "Nhiều người nói đừng coi đây là môn dễ điểm: hợp với ai đã thích vẽ, bản học kỳ nhẹ hơn bản cấp tốc."
    ms: "Ramai kata jangan anggap ia mudah dapat markah: sesuai bagi yang suka melukis, versi semester lebih ringan."
    id: "Banyak yang bilang jangan anggap mudah dapat nilai: cocok bagi yang suka menggambar, versi semester lebih ringan."
    hi: "कई कहते हैं इसे आसान अंकों वाला न समझें: यह ड्रॉइंग पसंद करने वालों के लिए है, सेमेस्टर वाला इंटेंसिव से हल्का है।"
sections:
  content:
    - en: "A botanical drawing intensive, often over summer or winter: a week of drawing and painting plants in techniques like pencil and watercolour, then time for assessments."
      zh: "植物绘画密集课，常在暑期或冬季上：一周用铅笔、水彩等技法画植物，之后留时间做作业。"
      zh-TW: "植物繪畫密集課，常在暑期或冬季上：一週用鉛筆、水彩等技法畫植物，之後留時間做作業。"
      ja: "夏や冬に行われることが多い植物画の集中講座。鉛筆や水彩などで植物を描く1週間の後、課題に取り組む期間がある。"
      ko: "주로 여름이나 겨울에 열리는 식물화 집중 과정. 연필, 수채화 등으로 식물을 그리는 한 주 뒤에 과제 기간이 있다."
      vi: "Khóa vẽ thực vật cấp tốc, thường vào hè hoặc đông: một tuần vẽ và tô màu cây bằng bút chì, màu nước, rồi thời gian làm bài đánh giá."
      ms: "Kursus intensif lukisan botani, selalunya musim panas atau sejuk: seminggu melukis dan mewarna tumbuhan dengan teknik seperti pensel dan cat air, kemudian masa untuk penilaian."
      id: "Kelas intensif menggambar botani, sering di musim panas atau dingin: seminggu menggambar dan melukis tumbuhan dengan teknik seperti pensil dan cat air, lalu waktu untuk tugas."
      hi: "वनस्पति चित्रकला का इंटेंसिव कोर्स, अक्सर गर्मी या सर्दी में: एक हफ़्ता पेंसिल और वॉटरकलर जैसी तकनीकों से पौधे बनाना, फिर मूल्यांकन के लिए समय।"
  work:
    - en: "A folio of drawings, a visual diary and a short essay analysing botanical artworks. Reviews from 2020–22 said marks reward effort and engagement more than drawing ability."
      zh: "一份作品集、一本视觉日记，以及一篇分析植物艺术作品的短文。2020–22 年的同学说评分更看投入和用心，而不是画功。"
      zh-TW: "一份作品集、一本視覺日誌，以及一篇分析植物藝術作品的短文。2020–22 年的同學說評分更看投入和用心，而不是畫功。"
      ja: "作品フォリオ、ビジュアルダイアリー、植物画を分析する短いエッセイ。2020〜22年のレビューでは、画力より努力と取り組みが評価されたという。"
      ko: "작품 폴리오, 비주얼 다이어리, 식물 미술작품을 분석하는 짧은 에세이. 2020–22년 리뷰는 그림 실력보다 노력과 참여를 평가했다고 한다."
      vi: "Một tập tranh, một nhật ký hình ảnh và một bài luận ngắn phân tích tác phẩm thực vật. Đánh giá 2020–22 nói điểm thưởng cho nỗ lực và sự tham gia hơn là tay nghề vẽ."
      ms: "Folio lukisan, diari visual dan esei pendek menganalisis karya seni botani. Ulasan 2020–22 kata markah lebih menghargai usaha dan penglibatan daripada kebolehan melukis."
      id: "Portofolio gambar, buku harian visual dan esai singkat menganalisis karya seni botani. Ulasan 2020–22 bilang nilai lebih menghargai usaha dan keterlibatan daripada kemampuan menggambar."
      hi: "चित्रों का फ़ोलियो, एक विज़ुअल डायरी और वनस्पति कलाकृतियों पर छोटा निबंध। 2020–22 के रिव्यू कहते हैं अंक चित्रकला कौशल से ज़्यादा मेहनत और जुड़ाव पर मिले।"
  study:
    - en: "Start the folio and essay early, and show your thinking and extra research in your visual diary."
      zh: "作品集和短文早点开始，在视觉日记里展示你的思考过程和额外研究。"
      zh-TW: "作品集和短文早點開始，在視覺日誌裡展示你的思考過程和額外研究。"
      ja: "フォリオとエッセイは早めに始め、ビジュアルダイアリーで考えた過程や追加の調査を見せる。"
      ko: "폴리오와 에세이는 일찍 시작하고, 비주얼 다이어리에 생각 과정과 추가 조사를 드러내라."
      vi: "Bắt đầu tập tranh và bài luận sớm, thể hiện suy nghĩ và tìm hiểu thêm trong nhật ký hình ảnh."
      ms: "Mula folio dan esei awal, dan tunjukkan pemikiran serta kajian tambahan dalam diari visual anda."
      id: "Mulai portofolio dan esai lebih awal, dan tunjukkan proses berpikir serta riset tambahan di buku harian visual."
      hi: "फ़ोलियो और निबंध जल्दी शुरू करें, और विज़ुअल डायरी में अपनी सोच और अतिरिक्त रिसर्च दिखाएँ।"
  watch:
    - en: "The 2024 reviewers all warn the workload is intense with little guidance and that it suits people who already draw; don't take it as an easy WAM booster."
      zh: "2024 年的几位同学都提醒工作量很大、指导很少，更适合本来就会画画的人；别把它当轻松刷分课。"
      zh-TW: "2024 年的幾位同學都提醒工作量很大、指導很少，更適合本來就會畫畫的人；別把它當輕鬆拉分課。"
      ja: "2024年のレビューは全員、作業量が多く指導が少なく、もともと絵を描く人向けだと警告。楽なWAM稼ぎとして取らないこと。"
      ko: "2024년 리뷰어들은 모두 작업량이 많고 지도가 적으며 원래 그림을 그리는 사람에게 맞다고 경고한다. 쉬운 WAM 과목으로 생각하지 마라."
      vi: "Các đánh giá năm 2024 đều cảnh báo khối lượng rất lớn, ít hướng dẫn và hợp với người vốn đã biết vẽ; đừng coi đây là môn kéo WAM dễ."
      ms: "Pengulas 2024 semuanya memberi amaran beban sangat tinggi dengan sedikit panduan dan sesuai untuk yang sudah melukis; jangan ambil sebagai penaik WAM mudah."
      id: "Semua pengulas 2024 mengingatkan bebannya berat dengan sedikit bimbingan dan cocok untuk yang sudah biasa menggambar; jangan ambil sebagai pendongkrak WAM mudah."
      hi: "2024 के सभी रिव्यूअर्स चेताते हैं कि वर्कलोड बहुत भारी और मार्गदर्शन कम है, और यह पहले से चित्र बनाने वालों के लिए है; इसे आसान WAM बूस्टर न समझें।"
workload: heavy
difficulty: hard
