reviews: 8
from: 2014
to: 2026
checked: 2026-10-08
points:
  - en: "Content heavy, with many diseases taught by different lecturers. It can feel disjointed, so group the topics into themes."
    zh: "内容多，多位讲师讲不同疾病，显得零散；按主题归纳会更好。"
    zh-TW: "內容多，多位講師講不同疾病，顯得零散；按主題歸納會更好。"
    ja: "内容が多く、さまざまな病気を複数の講師が教えます。バラバラに感じやすいので、トピックをテーマごとにまとめましょう。"
    ko: "내용이 많고 여러 강사가 각기 다른 질병을 가르칩니다. 산만하게 느껴질 수 있으니 주제별로 묶어 정리하세요."
    vi: "Nội dung nặng, nhiều giảng viên dạy các bệnh khác nhau. Dễ thấy rời rạc, nên hãy gom các chủ đề theo nhóm."
    ms: "Kandungan banyak, dengan banyak penyakit diajar oleh pensyarah berbeza. Ia boleh terasa tidak bersambung, jadi kumpulkan topik ikut tema."
    id: "Materinya banyak, berbagai penyakit diajarkan dosen yang berbeda. Bisa terasa terpisah-pisah, jadi kelompokkan topik per tema."
    hi: "कंटेंट बहुत है, अलग-अलग लेक्चरर कई बीमारियाँ पढ़ाते हैं। यह बिखरा लग सकता है, इसलिए टॉपिक्स को थीम में बाँटें।"
  - en: "The MSTs are mostly MCQ, but the exam is long and short answer essays. Practise planning and writing essays early."
    zh: "期中以选择题为主，期末是长短论述题；要提早练习列提纲和写作。"
    zh-TW: "期中以選擇題為主，期末是長短論述題；要提早練習擬大綱和寫作。"
    ja: "MSTは主に選択式ですが、期末試験は長文・短文の論述です。早めに論述の構成と書き方を練習しましょう。"
    ko: "MST는 대부분 객관식이지만 기말시험은 장·단문 서술형입니다. 서술 구성과 작성을 일찍 연습하세요."
    vi: "Các bài MST chủ yếu trắc nghiệm, nhưng thi cuối kỳ là tự luận dài và ngắn. Hãy luyện lập dàn ý và viết bài sớm."
    ms: "MST kebanyakannya MCQ, tetapi peperiksaan ialah esei panjang dan jawapan pendek. Berlatih merancang dan menulis esei awal."
    id: "MST sebagian besar pilihan ganda, tapi ujian akhirnya esai panjang dan jawaban singkat. Latih menyusun dan menulis esai sejak awal."
    hi: "MST ज़्यादातर MCQ हैं, पर एग्ज़ाम लंबे और छोटे निबंध वाले जवाबों का है। निबंध की प्लानिंग और लेखन जल्दी शुरू करें।"
  - en: "Opinions on the exam are split: some found it fair with question choice, one found it very long and harshly marked."
    zh: "期末评价不一：有人觉得可选题较公平，也有人觉得太长且评分严。"
    zh-TW: "期末評價不一：有人覺得可選題較公平，也有人覺得太長且評分嚴。"
    ja: "試験の評価は分かれます。選択問題があって公平だという人もいれば、とても長く採点が厳しいという人もいました。"
    ko: "시험에 대한 의견은 갈립니다. 문제 선택이 있어 공정했다는 사람도 있고, 매우 길고 채점이 엄격했다는 사람도 있습니다."
    vi: "Ý kiến về bài thi trái chiều: có người thấy công bằng vì được chọn câu, một người thấy rất dài và chấm gắt."
    ms: "Pendapat tentang peperiksaan berbelah bahagi: ada yang rasa adil kerana boleh pilih soalan, seorang rasa sangat panjang dan dimarkah ketat."
    id: "Pendapat soal ujian terbelah: ada yang menilai adil karena bisa pilih soal, satu orang merasa sangat panjang dan dinilai ketat."
    hi: "एग्ज़ाम पर राय बँटी है: कुछ को सवाल चुनने की छूट से यह ठीक लगा, एक को बहुत लंबा और सख्त मार्किंग वाला।"
  - en: "MCQs can test tiny details from the slides."
    zh: "选择题可能考课件中的细节。"
    zh-TW: "選擇題可能考課件中的細節。"
    ja: "選択問題ではスライドの細かい部分まで問われることがあります。"
    ko: "객관식은 슬라이드의 아주 작은 세부 내용까지 물어볼 수 있습니다."
    vi: "Câu trắc nghiệm có thể hỏi chi tiết rất nhỏ trong slide."
    ms: "MCQ boleh menguji butiran kecil daripada slaid."
    id: "Soal pilihan ganda bisa menanyakan detail kecil dari slide."
    hi: "MCQ में स्लाइड्स की छोटी-छोटी डिटेल पूछी जा सकती हैं।"
sections:
  content:
    - en: "Broad mechanisms like cell injury and inflammation, then about 30 diseases, often one per lecture, in blocks such as genetics, the CNS and cancer. Content heavy but not conceptually hard."
      zh: "先讲细胞损伤、炎症等基本机制，然后大约 30 种疾病，常常一节课一种，分遗传、中枢神经、癌症等板块。内容多，但概念不难。"
      zh-TW: "先講細胞損傷、發炎等基本機制，然後約 30 種疾病，常常一堂課一種，分遺傳、中樞神經、癌症等單元。內容多，但概念不難。"
      ja: "細胞傷害や炎症などの基本機序の後、遺伝、中枢神経、がんなどのブロックで約30の疾患を、多くは1講義1疾患で学ぶ。内容は多いが概念は難しくない。"
      ko: "세포 손상, 염증 같은 기본 기전 후 유전, 중추신경, 암 등 블록으로 약 30가지 질환을 대개 강의당 하나씩 배운다. 내용은 많지만 개념은 어렵지 않다."
      vi: "Cơ chế chung như tổn thương tế bào và viêm, rồi khoảng 30 bệnh, thường mỗi bài một bệnh, theo các phần như di truyền, thần kinh trung ương và ung thư. Nhiều nội dung nhưng không khó về khái niệm."
      ms: "Mekanisme umum seperti kecederaan sel dan keradangan, kemudian kira-kira 30 penyakit, selalunya satu setiap kuliah, dalam blok seperti genetik, CNS dan kanser. Banyak kandungan tetapi tidak sukar dari segi konsep."
      id: "Mekanisme umum seperti cedera sel dan inflamasi, lalu sekitar 30 penyakit, sering satu per kuliah, dalam blok seperti genetika, SSP dan kanker. Materinya banyak tapi konsepnya tidak sulit."
      hi: "सेल इंजरी और सूजन जैसे सामान्य तंत्र, फिर लगभग 30 बीमारियाँ, अक्सर हर लेक्चर में एक, जेनेटिक्स, CNS और कैंसर जैसे ब्लॉक में। कंटेंट भारी पर कॉन्सेप्ट कठिन नहीं।"
  work:
    - en: "Two multiple-choice MSTs with a short answer, then a final exam of short and long essay-style answers with some choice of questions. Several warn the exam is very different from the MSTs."
      zh: "两次选择题 MST（各带一道简答），期末是简答加长篇论述，题目有一定选择。好几位提醒期末和 MST 形式差别很大。"
      zh-TW: "兩次選擇題 MST（各帶一題簡答），期末是簡答加長篇申論，題目有一定選擇。好幾位提醒期末和 MST 形式差很多。"
      ja: "記述1問付きの選択式MSTが2回、期末は短答と長文エッセイ型で、問題をある程度選べる。期末はMSTとかなり形式が違うという注意が複数。"
      ko: "단답 하나가 있는 객관식 MST 2회, 기말은 단답과 장문 서술형으로 문제 선택권이 일부 있다. 기말이 MST와 형식이 많이 다르다는 경고가 여럿."
      vi: "Hai MST trắc nghiệm kèm một câu ngắn, rồi bài thi cuối kỳ gồm câu ngắn và câu dạng luận dài, có quyền chọn câu. Vài người cảnh báo bài thi rất khác MST."
      ms: "Dua MST aneka pilihan dengan satu jawapan pendek, kemudian peperiksaan akhir jawapan pendek dan esei panjang dengan sedikit pilihan soalan. Beberapa memberi amaran peperiksaan sangat berbeza daripada MST."
      id: "Dua MST pilihan ganda dengan satu isian singkat, lalu ujian akhir isian singkat dan esai panjang dengan pilihan soal. Beberapa mengingatkan ujian akhirnya sangat berbeda dari MST."
      hi: "एक शॉर्ट आंसर वाले दो MCQ MST, फिर शॉर्ट और लंबे निबंध जैसे उत्तरों वाली फ़ाइनल परीक्षा जिसमें कुछ सवाल चुन सकते हैं। कई चेताते हैं कि परीक्षा MST से बहुत अलग है।"
  study:
    - en: "Start practising planning and writing long answers under timed conditions early, and group diseases by topic so you can join the dots."
      zh: "早点开始在限时条件下练习规划和写长答题；把疾病按主题归类，方便串联起来。"
      zh-TW: "早點開始在限時條件下練習規劃和寫長答題；把疾病按主題歸類，方便串聯起來。"
      ja: "時間を計って長文答案の構成と執筆を早めに練習し、疾患をテーマ別にまとめて関連づける。"
      ko: "시간을 재고 장문 답안을 구상하고 쓰는 연습을 일찍 시작하고, 질환을 주제별로 묶어 연결하라."
      vi: "Sớm luyện lập dàn ý và viết câu trả lời dài có tính giờ, và nhóm các bệnh theo chủ đề để dễ liên kết."
      ms: "Mula berlatih merancang dan menulis jawapan panjang dalam masa ditetapkan dari awal, dan kumpulkan penyakit mengikut topik supaya mudah dihubungkan."
      id: "Mulai latih merencanakan dan menulis jawaban panjang dengan batas waktu sejak awal, dan kelompokkan penyakit per topik agar mudah dihubungkan."
      hi: "समय-सीमा में लंबे उत्तर की योजना बनाने और लिखने का अभ्यास जल्दी शुरू करें, और बीमारियों को टॉपिक के हिसाब से समूहित करें ताकि कड़ियाँ जुड़ें।"
  watch:
    - en: "One 2022 reviewer found the exam long and draining, with essay answers marked harshly even for wording; others found it fair if you know the content."
      zh: "2022 年有同学觉得期末又长又累，论述题连用词都扣分很严；也有人觉得只要懂内容就很公平。"
      zh-TW: "2022 年有同學覺得期末又長又累，申論題連用詞都扣分很嚴；也有人覺得只要懂內容就很公平。"
      ja: "2022年には期末が長く消耗し、論述は言葉遣いまで厳しく採点されたという声。内容を理解していれば公平という声も。"
      ko: "2022년 한 리뷰어는 기말이 길고 지치며 서술형은 표현까지 엄격히 채점됐다고 했다. 내용을 알면 공정하다는 의견도 있다."
      vi: "Một người năm 2022 thấy bài thi dài và mệt, câu luận bị chấm gắt cả về cách dùng từ; người khác thấy công bằng nếu nắm nội dung."
      ms: "Seorang pengulas 2022 rasa peperiksaan panjang dan meletihkan, dengan jawapan esei dinilai keras hingga pilihan kata; yang lain rasa adil jika faham kandungan."
      id: "Satu pengulas 2022 merasa ujiannya panjang dan melelahkan, dengan jawaban esai dinilai keras sampai ke pilihan kata; yang lain merasa adil kalau paham materinya."
      hi: "2022 के एक रिव्यूअर को परीक्षा लंबी और थकाने वाली लगी, निबंध उत्तरों में शब्दों तक पर सख़्त मार्किंग; दूसरों को कंटेंट आता हो तो उचित लगी।"
workload: heavy
