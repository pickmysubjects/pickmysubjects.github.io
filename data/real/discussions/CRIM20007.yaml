points:
  - en: "All three reviewers (2020-2022) found the content on cybercrime engaging and recommended it, especially if you are interested in how crime and the internet intersect."
    zh: "三位评论者（2020-2022）都觉得网络犯罪内容引人入胜并推荐这门课，尤其适合对犯罪与互联网交叉感兴趣的人。"
    zh-TW: "三位評論者（2020-2022）都覺得網路犯罪內容引人入勝並推薦這門課，尤其適合對犯罪與網路交集感興趣的人。"
    ja: "3人のレビュー（2020-2022）全員がサイバー犯罪の内容を面白いとし、特に犯罪とインターネットの関わりに興味がある人に勧めている。"
    ko: "리뷰어 3명(2020-2022) 모두 사이버 범죄 내용이 흥미롭다며 추천, 특히 범죄와 인터넷의 교차점에 관심 있다면."
    vi: "Cả ba người đánh giá (2020-2022) đều thấy nội dung về tội phạm mạng hấp dẫn và giới thiệu môn này, nhất là nếu bạn quan tâm đến giao thoa giữa tội phạm và internet."
    ms: "Ketiga-tiga pengulas (2020-2022) dapati kandungan jenayah siber menarik dan mengesyorkannya, terutama jika berminat dengan kaitan jenayah dan internet."
    id: "Ketiga pengulas (2020-2022) merasa materi kejahatan siber menarik dan merekomendasikannya, terutama jika tertarik pada kaitan kejahatan dan internet."
    hi: "तीनों रिव्यूअर्स (2020-2022) को साइबर क्राइम का कंटेंट दिलचस्प लगा और उन्होंने इसकी सिफ़ारिश की, ख़ासकर अगर अपराध और इंटरनेट के जुड़ाव में रुचि हो।"
  - en: "Assessments were called fair with good feedback available, but one 2022 reviewer warned the very top marks are reserved for near-publishable work."
    zh: "考核被认为公平，也容易得到反馈，但一位2022年的评论者提醒，最高分只给接近可发表水平的作品。"
    zh-TW: "考核被認為公平，也容易得到回饋，但一位2022年的評論者提醒，最高分只給接近可發表水準的作品。"
    ja: "評価は妥当でフィードバックも得やすいとされたが、2022年のレビューでは最高点は発表できるレベルの作品に限られると注意している。"
    ko: "평가는 공정하고 피드백도 받기 쉽다는 평이지만, 2022년 리뷰어는 최고 점수는 거의 출판 가능한 수준에만 준다고 경고함."
    vi: "Đánh giá được cho là công bằng, dễ nhận phản hồi, nhưng một người năm 2022 cảnh báo điểm cao nhất chỉ dành cho bài gần mức có thể xuất bản."
    ms: "Penilaian dikatakan adil dengan maklum balas mudah didapati, tetapi seorang pengulas 2022 memberi amaran markah tertinggi hanya untuk kerja hampir boleh diterbitkan."
    id: "Penilaian disebut adil dan umpan balik mudah didapat, tapi seorang pengulas 2022 mengingatkan nilai tertinggi hanya untuk karya yang hampir layak terbit."
    hi: "असेसमेंट को निष्पक्ष और फ़ीडबैक आसानी से मिलने वाला बताया गया, पर 2022 के एक रिव्यूअर ने चेताया कि सबसे ऊँचे अंक लगभग प्रकाशन-योग्य काम को ही मिलते हैं।"
