points:
  - en: "About 90% of the assessment is reflective writing, unusual for psychology. Several felt the guidance and feedback were lacking."
    zh: "约90%的考核是反思性写作，在心理学课中少见，多人认为指导和反馈不足。"
  - en: "Opinions are split: older reviewers loved it, while recent ones did not recommend it and said it is not a WAM booster."
    zh: "评价两极：早期评价很喜欢，近期评价不推荐，并称不是提分课。"
  - en: "The quizzes are easy marks. Exam essay questions were released in advance, but expectations about personal examples were confusing."
    zh: "测验易拿分；考试论述题提前公布，但对是否写个人经历的要求令人困惑。"
