code: PSYC30016
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/psyc30016
reviews: 5
from: 2019
to: 2025
checked: 2026-10-08
points:
  - en: "About 90% of the assessment is reflective writing, unusual for psychology. Several felt the guidance and feedback were lacking."
    zh: "约90%的考核是反思性写作，在心理学课中少见，多人认为指导和反馈不足。"
    zh-TW: "約90%的考核是反思性寫作，在心理學科目中少見，多人認為指導和回饋不足。"
    ja: "評価の約90%が振り返りの文章で、心理学としては珍しいです。指導やフィードバックが足りないという声が複数あります。"
    ko: "평가의 약 90%가 성찰 글쓰기로, 심리학 과목으로는 드뭅니다. 안내와 피드백이 부족했다는 사람이 여럿입니다."
    vi: "Khoảng 90% bài đánh giá là viết suy ngẫm, hiếm gặp ở môn tâm lý. Một số người thấy thiếu hướng dẫn và phản hồi."
    ms: "Kira-kira 90% penilaian ialah penulisan reflektif, luar biasa untuk psikologi. Beberapa rasa bimbingan dan maklum balas kurang."
    id: "Sekitar 90% penilaian berupa tulisan reflektif, tidak biasa untuk psikologi. Beberapa merasa bimbingan dan feedback kurang."
    hi: "करीब 90% असेसमेंट रिफ्लेक्टिव लेखन है, जो साइकोलॉजी में असामान्य है। कई लोगों को गाइडेंस और फीडबैक की कमी लगी।"
  - en: "Opinions are split: older reviewers loved it, while recent ones did not recommend it and said it is not a WAM booster."
    zh: "评价两极：早期评价很喜欢，近期评价不推荐，并称不是提分课。"
    zh-TW: "評價兩極：早期評價很喜歡，近期評價不推薦，並稱不是提升WAM的課。"
    ja: "意見は分かれます。以前のレビューでは大好評でしたが、最近は勧めない声が多く、WAMを上げる科目ではないとされています。"
    ko: "의견이 갈립니다. 예전 후기는 아주 좋아했지만, 최근 후기는 추천하지 않으며 WAM 올리기용이 아니라고 합니다."
    vi: "Ý kiến trái chiều: đánh giá cũ rất thích, còn gần đây thì không khuyên học và nói không giúp tăng WAM."
    ms: "Pendapat berbelah bahagi: pengulas lama sangat suka, tetapi yang terkini tidak mengesyorkannya dan kata ia bukan penaik WAM."
    id: "Pendapat terbelah: pengulas lama sangat suka, tapi yang terbaru tidak merekomendasikan dan bilang bukan pendongkrak WAM."
    hi: "राय बँटी है: पुराने रिव्यूअर्स को बहुत पसंद आया, जबकि हाल वालों ने इसे नहीं सुझाया और कहा कि यह WAM बूस्टर नहीं है।"
  - en: "The quizzes are easy marks. Exam essay questions were released in advance, but expectations about personal examples were confusing."
    zh: "测验易拿分；考试论述题提前公布，但对是否写个人经历的要求令人困惑。"
    zh-TW: "測驗易拿分；考試論述題提前公布，但對是否寫個人經歷的要求令人困惑。"
    ja: "小テストは点が取りやすいです。試験の論述問題は事前に公開されましたが、個人的な例をどう書くべきかの期待が分かりにくかったです。"
    ko: "퀴즈는 점수 따기 쉽습니다. 시험 서술 문제는 미리 공개되었지만, 개인 사례에 대한 기대치가 헷갈렸습니다."
    vi: "Quiz dễ lấy điểm. Câu tự luận trong đề thi được công bố trước, nhưng yêu cầu về ví dụ cá nhân gây khó hiểu."
    ms: "Kuiz ialah markah mudah. Soalan esei peperiksaan dikeluarkan awal, tetapi jangkaan tentang contoh peribadi mengelirukan."
    id: "Kuis gampang dapat nilai. Soal esai ujian dirilis lebih dulu, tapi ekspektasi soal contoh pribadi membingungkan."
    hi: "क्विज़ आसान मार्क्स हैं। एग्ज़ाम के निबंध सवाल पहले जारी हुए, पर निजी उदाहरणों को लेकर उम्मीदें उलझी हुई थीं।"
sections:
  content:
    - en: "Social and emotional development across the lifespan. Earlier reviewers loved it; recent ones (2023, 2025) were much less positive, and one 2025 reviewer objected to the lectures on gender identity."
      zh: "讲人一生中的社会与情绪发展。早期的同学很喜欢；近期（2023、2025）评价差很多，一位 2025 年的同学不认同讲课中关于性别认同的内容。"
      zh-TW: "講人一生中的社會與情緒發展。早期的同學很喜歡；近期（2023、2025）評價差很多，一位 2025 年的同學不認同講課中關於性別認同的內容。"
      ja: "生涯にわたる社会的・感情的発達。以前のレビューは絶賛だが、最近（2023年・2025年）はかなり低評価で、2025年の一人はジェンダー・アイデンティティに関する講義内容に反発している。"
      ko: "전 생애에 걸친 사회·정서 발달. 예전 리뷰는 매우 좋아했지만 최근(2023, 2025)은 훨씬 부정적이며, 2025년 한 리뷰는 성 정체성에 관한 강의 내용에 반대했다."
      vi: "Phát triển xã hội và cảm xúc qua các giai đoạn đời người. Người học trước rất thích; gần đây (2023, 2025) kém tích cực hơn nhiều, và một người năm 2025 phản đối nội dung giảng về bản dạng giới."
      ms: "Perkembangan sosial dan emosi sepanjang hayat. Pengulas awal sangat suka; yang terkini (2023, 2025) jauh kurang positif, dan seorang pengulas 2025 membantah kuliah tentang identiti jantina."
      id: "Perkembangan sosial dan emosional sepanjang hidup. Pengulas awal sangat suka; yang terbaru (2023, 2025) jauh kurang positif, dan satu pengulas 2025 keberatan dengan kuliah soal identitas gender."
      hi: "जीवन भर का सामाजिक और भावनात्मक विकास। पहले के रिव्यूअर्स को बहुत पसंद आया; हाल के (2023, 2025) काफ़ी कम सकारात्मक हैं, और 2025 के एक ने जेंडर पहचान पर लेक्चर पर आपत्ति जताई।"
  work:
    - en: "Quizzes worth 10% are close to free marks; the other 90% is reflective writing, unusual for psychology. One 2023 reviewer says the exam questions were released in advance, but personal anecdotes were discouraged there."
      zh: "小测占 10%，几乎白送；其余 90% 是反思写作，在心理学课里很少见。一位 2023 年的同学说考题提前公布，但考试里不鼓励写个人经历。"
      zh-TW: "小考占 10%，幾乎白送；其餘 90% 是反思寫作，在心理學課裡很少見。一位 2023 年的同學說考題提前公布，但考試裡不鼓勵寫個人經歷。"
      ja: "10%のクイズはほぼ確実に取れる点。残り90%は心理学では珍しい振り返りの記述。2023年の一人は、試験問題は事前公開されたが試験では個人的な体験談は控えるよう言われたという。"
      ko: "10% 퀴즈는 거의 공짜 점수이고 나머지 90%는 심리학에서 드문 성찰 글쓰기다. 2023년 한 리뷰는 시험 문제가 미리 공개됐지만 시험에선 개인 일화를 쓰지 말라고 했다고 한다."
      vi: "Quiz 10% gần như cho điểm; 90% còn lại là viết suy ngẫm, hiếm trong tâm lý học. Một người năm 2023 nói đề thi được công bố trước nhưng trong bài thi lại không khuyến khích kể trải nghiệm cá nhân."
      ms: "Kuiz 10% hampir markah percuma; 90% lagi penulisan reflektif, luar biasa bagi psikologi. Seorang pengulas 2023 kata soalan peperiksaan diberi awal, tetapi anekdot peribadi tidak digalakkan di situ."
      id: "Kuis 10% hampir nilai gratis; 90% sisanya tulisan reflektif, tak biasa untuk psikologi. Satu pengulas 2023 bilang soal ujian dibagikan lebih dulu, tapi anekdot pribadi tidak dianjurkan di ujian."
      hi: "10% के क्विज़ लगभग मुफ़्त अंक हैं; बाकी 90% रिफ़्लेक्टिव लेखन है, जो मनोविज्ञान में असामान्य है। 2023 का एक रिव्यूअर कहता है परीक्षा के सवाल पहले दे दिए गए, पर वहाँ निजी अनुभव लिखने से मना किया गया।"
  watch:
    - en: "Recent reviewers found guidance and feedback on reflective writing lacking, which is hard if you've never written one. The newest says it's not a WAM booster."
      zh: "近期同学觉得反思写作的指导和反馈都不够，没写过的人会很吃力。最新一条说这门不是拉 WAM 的课。"
      zh-TW: "近期同學覺得反思寫作的指導和回饋都不夠，沒寫過的人會很吃力。最新一則說這門不是拉 WAM 的課。"
      ja: "最近のレビューは振り返り記述の指導やフィードバックが足りないと言い、書いたことがないと大変。最新のものはWAMを上げる科目ではないと言う。"
      ko: "최근 리뷰는 성찰 글쓰기에 대한 안내와 피드백이 부족해 처음 쓰는 사람에겐 어렵다고 한다. 최신 리뷰는 WAM 올리기 과목이 아니라고 한다."
      vi: "Người học gần đây thấy thiếu hướng dẫn và phản hồi cho bài viết suy ngẫm, khó với ai chưa từng viết. Người mới nhất nói đây không phải môn kéo WAM."
      ms: "Pengulas terkini rasa bimbingan dan maklum balas penulisan reflektif kurang, sukar jika belum pernah menulisnya. Yang terbaru kata ia bukan penaik WAM."
      id: "Pengulas terbaru merasa bimbingan dan umpan balik untuk tulisan reflektif kurang, sulit jika belum pernah menulisnya. Yang terbaru bilang ini bukan pendongkrak WAM."
      hi: "हाल के रिव्यूअर्स को रिफ़्लेक्टिव लेखन पर मार्गदर्शन और फ़ीडबैक कम लगा, जो पहली बार लिखने वालों के लिए कठिन है। सबसे नया कहता है यह WAM बढ़ाने वाला विषय नहीं।"
