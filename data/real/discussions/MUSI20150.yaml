points:
  - en: "Widely seen as an easy H1 breadth: short weekly videos and a 4-question quiz, often under an hour a week."
    zh: "普遍认为是容易拿H1的通识：每周短视频加4题测验，常常一周不到一小时。"
    zh-TW: "普遍認為是容易拿H1的通識：每週短影片加4題測驗，常常一週不到一小時。"
    ja: "H1を取りやすい選択科目との評価。毎週短い動画と4問の小テストで、週1時間未満のことも。"
    ko: "H1 받기 쉬운 교양으로 통함. 매주 짧은 영상과 4문항 퀴즈, 주 1시간 미만인 경우가 많음."
    vi: "Được xem là môn breadth dễ lấy H1: video ngắn và quiz 4 câu mỗi tuần, thường chưa tới một giờ."
    ms: "Dianggap breadth mudah untuk H1: video pendek dan kuiz 4 soalan seminggu, selalunya kurang sejam."
    id: "Dianggap breadth mudah dapat H1: video singkat dan kuis 4 soal tiap minggu, sering kurang dari sejam."
    hi: "आसान H1 ब्रेड्थ माना जाता है: छोटे साप्ताहिक वीडियो और 4 सवालों का क्विज़, अक्सर घंटे से कम।"
  - en: "Quiz questions are very specific; searching the video transcripts helps, and one week's quiz caught most people out."
    zh: "测验题非常细，搜视频文字稿有帮助；有一周的测验难倒了大多数人。"
    zh-TW: "測驗題非常細，搜影片逐字稿有幫助；有一週的測驗難倒了大多數人。"
    ja: "小テストは非常に細かい。動画の書き起こし検索が有効で、ある週はほとんどの人がつまずいた。"
    ko: "퀴즈 문제가 매우 세부적. 영상 녹취록 검색이 도움되며, 한 주는 대부분이 틀렸다고."
    vi: "Câu hỏi quiz rất chi tiết; tìm trong bản ghi video giúp ích, có tuần hầu hết mọi người làm sai."
    ms: "Soalan kuiz sangat spesifik; cari dalam transkrip video membantu, satu minggu ramai tersilap."
    id: "Soal kuis sangat spesifik; mencari di transkrip video membantu, satu minggu banyak yang salah."
    hi: "क्विज़ के सवाल बहुत बारीक हैं; वीडियो ट्रांसक्रिप्ट में खोजना मदद करता है, एक हफ़्ते ज़्यादातर अटक गए।"
  - en: "The final essay (built around a health playlist) carries the grade: start early and tie it to the topic's research."
    zh: "期末论文（围绕健康歌单）决定成绩：尽早开始，并紧扣所选主题的研究。"
    zh-TW: "期末論文（圍繞健康歌單）決定成績：盡早開始，並緊扣所選主題的研究。"
    ja: "成績を左右するのは健康プレイリストを軸にした最終論文。早めに始め、テーマの研究と結びつけること。"
    ko: "건강 플레이리스트 중심의 기말 에세이가 성적을 좌우. 일찍 시작하고 주제 연구와 연결할 것."
    vi: "Bài luận cuối (xoay quanh playlist sức khỏe) quyết định điểm: bắt đầu sớm và bám nghiên cứu của chủ đề."
    ms: "Esei akhir (berdasarkan senarai main kesihatan) menentukan gred: mula awal dan kaitkan dengan kajian topik."
    id: "Esai akhir (berbasis playlist kesehatan) menentukan nilai: mulai lebih awal dan kaitkan dengan riset topik."
    hi: "अंतिम निबंध (स्वास्थ्य प्लेलिस्ट पर) ग्रेड तय करता है: जल्दी शुरू करें और विषय के शोध से जोड़ें।"
  - en: "Several found the content dry or not very deep; a few disliked the auto-marked reading annotations used around 2020."
    zh: "有些人觉得内容枯燥或不深入；也有人不喜欢2020年前后自动评分的阅读批注。"
    zh-TW: "有些人覺得內容枯燥或不深入；也有人不喜歡2020年前後自動評分的閱讀批註。"
    ja: "内容が退屈・浅いと感じた人も。2020年頃の自動採点の文献注釈を嫌う声もあった。"
    ko: "내용이 지루하거나 깊이가 없다는 의견도. 2020년경 자동 채점 읽기 주석을 싫어한 사람도."
    vi: "Một số thấy nội dung khô hoặc không sâu; vài người không thích phần chú thích bài đọc chấm tự động khoảng 2020."
    ms: "Ada yang rasa kandungan hambar; segelintir tidak suka anotasi bacaan bertanda automatik sekitar 2020."
    id: "Beberapa merasa isinya kering; sebagian tidak suka anotasi bacaan yang dinilai otomatis sekitar 2020."
    hi: "कुछ को सामग्री नीरस या उथली लगी; कुछ को 2020 के आसपास के ऑटो-जाँच वाले रीडिंग एनोटेशन पसंद नहीं आए।"
workload: light
difficulty: easy
