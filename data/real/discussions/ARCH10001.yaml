code: ARCH10001
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/arch10001
reviews: 10
from: 2017
to: 2026
checked: 2026-10-21
points:
  - en: "Almost every reviewer calls the workload very heavy, with long weekend hours; several advise taking it only if your degree needs it."
    zh: "几乎所有评论者都说工作量很大，周末也要花很多时间；不少人建议只有专业要求才选。"
    zh-TW: "幾乎所有評論者都說工作量很大，週末也要花很多時間；不少人建議只有學位要求才選。"
    ja: "ほぼ全員が課題量はとても多く週末も長時間かかると言い、必修でなければ避けるよう勧める人も多い。"
    ko: "거의 모든 리뷰어가 과제량이 매우 많고 주말에도 오래 해야 한다고 하며, 필수가 아니면 피하라는 조언도 많음."
    vi: "Hầu hết người đánh giá nói khối lượng rất nặng, cuối tuần cũng phải làm lâu; nhiều người khuyên chỉ học nếu bắt buộc."
    ms: "Hampir semua pengulas kata beban kerja sangat berat hingga hujung minggu; ramai nasihat ambil hanya jika diwajibkan."
    id: "Hampir semua pengulas bilang bebannya sangat berat sampai akhir pekan; banyak yang menyarankan ambil hanya jika wajib."
    hi: "लगभग सभी रिव्यूअर कहते हैं काम बहुत भारी है, वीकेंड पर भी घंटों लगते हैं; कई सलाह देते हैं कि ज़रूरी हो तभी लें।"
  - en: "Learning Rhino and several design programs at once is a common struggle, and some found grading depends a lot on the tutor."
    zh: "同时学Rhino和多个设计软件是常见难点，也有人觉得评分很看导师。"
    zh-TW: "同時學 Rhino 和多個設計軟體是常見難點，也有人覺得評分很看助教。"
    ja: "Rhinoなど複数のソフトを同時に覚えるのが大変で、採点がチューター次第だと感じた人もいる。"
    ko: "Rhino 등 여러 디자인 프로그램을 한꺼번에 배우는 게 흔한 어려움이고, 채점이 튜터에 따라 다르다는 의견도 있음."
    vi: "Học Rhino và nhiều phần mềm cùng lúc là khó khăn phổ biến; một số thấy điểm phụ thuộc nhiều vào tutor."
    ms: "Belajar Rhino dan beberapa perisian serentak ialah cabaran biasa, dan ada yang rasa pemarkahan bergantung pada tutor."
    id: "Belajar Rhino dan beberapa software sekaligus jadi kesulitan umum; sebagian merasa nilai sangat tergantung tutor."
    hi: "Rhino और कई डिज़ाइन सॉफ़्टवेयर एक साथ सीखना आम मुश्किल है, और कुछ को लगा ग्रेडिंग ट्यूटर पर निर्भर है।"
  - en: "On the plus side, reviewers say tutors and assignment guidance help, and the drawing and software skills are useful later, especially for architecture."
    zh: "好的一面是导师和作业指引很有帮助，学到的绘图和软件技能之后很有用，尤其对建筑方向。"
    zh-TW: "好的一面是助教和作業指引很有幫助，學到的繪圖和軟體技能之後很有用，尤其對建築方向。"
    ja: "良い点として、チューターや課題の説明が助けになり、図面とソフトの技能は後で役立つ、特に建築志望には、という声。"
    ko: "장점으로 튜터와 과제 안내가 도움이 되고, 도면·소프트웨어 실력은 특히 건축 전공에 나중에 유용하다고 함."
    vi: "Mặt tích cực: tutor và hướng dẫn bài tập hữu ích, kỹ năng vẽ và phần mềm dùng được về sau, nhất là ngành kiến trúc."
    ms: "Dari sudut baik, tutor dan panduan tugasan membantu, dan kemahiran lukisan serta perisian berguna kemudian, terutama seni bina."
    id: "Sisi baiknya, tutor dan panduan tugas membantu, dan keterampilan gambar serta software berguna nanti, terutama arsitektur."
    hi: "अच्छी बात यह कि ट्यूटर और असाइनमेंट गाइडेंस मदद करते हैं, और ड्रॉइंग व सॉफ़्टवेयर कौशल बाद में काम आते हैं, ख़ासकर आर्किटेक्चर में।"
sections:
  content:
    - en: "It teaches how to represent design: drawing, orthographic views, scale, physical and digital models, and pin-up presentations, more than architecture itself."
      zh: "教的是怎么表达设计：画图、正投影、比例、实体和数字模型、pin-up 展示，而不是建筑本身。"
      zh-TW: "教的是怎麼表達設計：繪圖、正投影、比例、實體和數位模型、pin-up 展示，而不是建築本身。"
      ja: "教えるのは建築そのものより設計の表現方法。ドローイング、正投影図、縮尺、模型とデジタルモデル、ピンアップ発表。"
      ko: "건축 자체보다 디자인을 표현하는 법을 배운다. 드로잉, 정투상도, 축척, 실물·디지털 모형, 핀업 발표."
      vi: "Môn dạy cách thể hiện thiết kế: vẽ, hình chiếu vuông góc, tỷ lệ, mô hình thật và số, thuyết trình pin-up, hơn là kiến trúc."
      ms: "Ia mengajar cara mempersembahkan reka bentuk: lukisan, unjuran ortografik, skala, model fizikal dan digital, dan pin-up, lebih daripada seni bina itu sendiri."
      id: "Mengajarkan cara merepresentasikan desain: menggambar, proyeksi ortografis, skala, model fisik dan digital, dan presentasi pin-up, lebih dari arsitektur itu sendiri."
      hi: "यह आर्किटेक्चर से ज़्यादा डिज़ाइन दिखाने का तरीक़ा सिखाता है: ड्रॉइंग, ऑर्थोग्राफ़िक व्यू, स्केल, फ़िज़िकल और डिजिटल मॉडल, और पिन-अप प्रेज़ेंटेशन।"
    - en: "Much of it is learning software, mainly Rhino, plus Affinity in recent years; it is a steep curve if you have never done 3D modelling."
      zh: "很大一部分是学软件，主要是 Rhino，近几年还有 Affinity；没做过 3D 建模的话上手很陡。"
      zh-TW: "很大一部分是學軟體，主要是 Rhino，近幾年還有 Affinity；沒做過 3D 建模的話上手很陡。"
      ja: "大部分はソフトの習得で、主にRhino、近年はAffinityも。3Dモデリング未経験だと習得がきつい。"
      ko: "상당 부분이 소프트웨어 학습으로 주로 Rhino, 최근엔 Affinity도 쓴다. 3D 모델링을 처음 하면 진입 장벽이 높다."
      vi: "Phần lớn là học phần mềm, chủ yếu Rhino, mấy năm gần đây thêm Affinity; chưa từng dựng 3D thì rất khó bắt nhịp."
      ms: "Banyak masa untuk belajar perisian, terutamanya Rhino, serta Affinity pada tahun kebelakangan; lengkung belajar curam jika belum pernah buat model 3D."
      id: "Banyak bagian berupa belajar software, terutama Rhino, plus Affinity belakangan ini; kurva belajarnya curam kalau belum pernah modeling 3D."
      hi: "इसका बड़ा हिस्सा सॉफ़्टवेयर सीखना है, मुख्य रूप से Rhino, हाल में Affinity भी; 3D मॉडलिंग पहले न की हो तो शुरुआत कठिन है।"
  work:
    - en: "No exam: linked assignments and a portfolio built up over the semester. The workload is very high, with some weekends taking many hours."
      zh: "没有考试：几个前后相连的作业加一个作品集，贯穿整个学期。工作量非常大，有的周末要花很多小时。"
      zh-TW: "沒有考試：幾個前後相連的作業加一份作品集，貫穿整學期。工作量非常大，有的週末要花很多小時。"
      ja: "試験なし。つながった課題とポートフォリオを学期を通して作る。作業量はとても多く、週末に何時間もかかることも。"
      ko: "시험은 없고, 이어지는 과제와 포트폴리오를 학기 내내 만든다. 작업량이 매우 많아 주말에 몇 시간씩 걸리기도 한다."
      vi: "Không thi: các bài tập nối tiếp nhau và một portfolio làm suốt học kỳ. Khối lượng rất lớn, có cuối tuần mất nhiều giờ."
      ms: "Tiada peperiksaan: tugasan yang bersambung dan portfolio sepanjang semester. Beban kerja sangat tinggi, ada hujung minggu ambil berjam-jam."
      id: "Tanpa ujian: tugas yang saling terkait dan portofolio sepanjang semester. Bebannya sangat tinggi, ada akhir pekan yang makan berjam-jam."
      hi: "कोई परीक्षा नहीं: पूरे सेमेस्टर में जुड़े हुए असाइनमेंट और एक पोर्टफ़ोलियो। वर्कलोड बहुत ज़्यादा है, कुछ वीकेंड पर कई घंटे लगते हैं।"
    - en: "Several reviewers found the marking subjective and dependent on your tutor; one said there is plenty of guidance and good grades come with the hours."
      zh: "好几位同学觉得评分主观，很看你的 tutor；也有同学说指导很多，花够时间就能拿好成绩。"
      zh-TW: "好幾位同學覺得評分主觀，很看你的 tutor；也有同學說指導很多，花夠時間就能拿好成績。"
      ja: "採点が主観的でチューター次第だという声が複数。一方、指導は十分で時間をかければ良い成績が取れるという声も一つ。"
      ko: "여러 명이 채점이 주관적이고 튜터에 따라 다르다고 했다. 반면 안내가 충분하고 시간을 들이면 좋은 성적이 나온다는 의견도 있다."
      vi: "Vài người thấy chấm điểm chủ quan và phụ thuộc tutor; một người nói hướng dẫn rất đầy đủ, bỏ đủ giờ là được điểm tốt."
      ms: "Beberapa pengulas rasa pemarkahan subjektif dan bergantung pada tutor; seorang kata panduan banyak dan gred baik datang dengan masa diluangkan."
      id: "Beberapa pengulas merasa penilaian subjektif dan bergantung tutor; satu pengulas bilang panduannya banyak dan nilai bagus datang dari jam yang dicurahkan."
      hi: "कई रिव्यूअर्स को मार्किंग व्यक्तिपरक और ट्यूटर पर निर्भर लगी; एक ने कहा मार्गदर्शन काफ़ी है और घंटे लगाने पर अच्छे ग्रेड मिलते हैं।"
  study:
    - en: "Do well on the first assignment, since its work carries into the next ones, and practise the software early to get past the learning curve."
      zh: "第一个作业要做好，因为后面的作业会接着用；软件早点练，熬过一开始的上手期。"
      zh-TW: "第一個作業要做好，因為後面的作業會接著用；軟體早點練，撐過一開始的上手期。"
      ja: "最初の課題をしっかり。作業が次の課題に引き継がれる。ソフトは早めに練習して最初の壁を越える。"
      ko: "첫 과제를 잘해야 한다. 그 작업이 다음 과제로 이어진다. 소프트웨어는 일찍 연습해 초반 고비를 넘겨라."
      vi: "Làm tốt bài đầu tiên vì nó được dùng tiếp cho các bài sau, và luyện phần mềm sớm để qua giai đoạn khó ban đầu."
      ms: "Buat baik tugasan pertama kerana hasilnya dibawa ke tugasan seterusnya, dan latih perisian awal untuk melepasi lengkung belajar."
      id: "Kerjakan tugas pertama dengan baik karena hasilnya terbawa ke tugas berikutnya, dan latih software sejak awal agar lewat masa sulitnya."
      hi: "पहला असाइनमेंट अच्छे से करें, क्योंकि उसका काम आगे के असाइनमेंट में जाता है, और शुरुआती कठिनाई पार करने के लिए सॉफ़्टवेयर जल्दी सीखें।"
  watch:
    - en: "Many reviewers say avoid it as a breadth or WAM booster; take it only if it is a prerequisite or you really like design. One Mac user had Rhino crash often."
      zh: "很多同学说别拿来当 breadth 或刷分课，除非是先修课或你真喜欢设计。有用 Mac 的同学说 Rhino 经常崩溃。"
      zh-TW: "很多同學說別拿來當 breadth 或拉分課，除非是先修課或你真的喜歡設計。有用 Mac 的同學說 Rhino 常常當掉。"
      ja: "ブレドスやWAM稼ぎには避けるべきという声が多い。前提科目かデザインが本当に好きな場合だけ。Macでは Rhinoがよく落ちたという声も一つ。"
      ko: "많은 리뷰어가 브레드스나 WAM용으로는 피하라고 한다. 선수 과목이거나 디자인을 정말 좋아할 때만. Mac에서 Rhino가 자주 튕겼다는 사람도 있다."
      vi: "Nhiều người khuyên đừng học làm môn breadth hay kéo WAM; chỉ học nếu là môn tiên quyết hoặc thật sự thích thiết kế. Một người dùng Mac bị Rhino crash liên tục."
      ms: "Ramai pengulas kata elakkan sebagai breadth atau penaik WAM; ambil hanya jika prasyarat atau benar-benar minat reka bentuk. Seorang pengguna Mac kata Rhino kerap ranap."
      id: "Banyak pengulas bilang hindari sebagai breadth atau pendongkrak WAM; ambil hanya kalau prasyarat atau benar-benar suka desain. Satu pengguna Mac bilang Rhino sering crash."
      hi: "कई रिव्यूअर्स कहते हैं इसे ब्रेड्थ या WAM बढ़ाने के लिए न लें; सिर्फ़ प्रीरिक्विज़िट हो या डिज़ाइन सच में पसंद हो तब लें। एक Mac यूज़र का Rhino बार-बार क्रैश हुआ।"
workload: heavy
difficulty: hard
