    ja: "ペースは程よく、やや遅いくらいで定着させる時間がある。チュートリアルに積極的に参加すれば高得点は簡単。"
    ko: "진도는 적당하거나 약간 느려 복습할 시간이 있음. 튜토리얼에 적극 참여하면 고득점이 쉬움."
    vi: "Tiến độ vừa phải, thậm chí hơi chậm, có thời gian củng cố; tham gia tích cực tutorial là dễ đạt điểm cao."
    ms: "Rentaknya sederhana, malah agak perlahan, memberi masa untuk mengukuhkan; libatkan diri dalam tutorial dan skor tinggi mudah."
    id: "Temponya sedang, bahkan agak lambat, jadi ada waktu memantapkan; aktif di tutorial dan nilai bagus mudah diraih."
    hi: "रफ़्तार मध्यम, बल्कि थोड़ी धीमी है, जिससे पक्का करने का समय मिलता है; ट्यूटोरियल में भाग लें तो अच्छे अंक आसान हैं।"
