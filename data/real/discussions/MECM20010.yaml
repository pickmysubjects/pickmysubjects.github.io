code: MECM20010
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/mecm20010
reviews: 9
from: 2015
to: 2019
checked: 2026-10-17
points:
  - en: "Compares media systems across countries. Most reviewers (2015-2019) found it poorly organised, with overloaded lectures and readings, lectures and tutorials that did not connect."
    zh: "比较各国的媒体体制。多数评论者（2015-2019）觉得课程组织差，讲座内容过多，阅读、讲座和辅导课互不衔接。"
    zh-TW: "比較各國的媒體體制。多數評論者（2015-2019）覺得課程組織差，講座內容過多，閱讀、講座和輔導課互不銜接。"
    ja: "国ごとのメディアシステムを比較する。多くのレビュー（2015-2019）は運営がまとまっておらず、講義は詰め込みすぎで、文献・講義・チュートリアルがつながっていないとした。"
    ko: "국가별 미디어 시스템을 비교. 대부분 리뷰(2015-2019)는 운영이 부실하고 강의가 과밀하며, 읽기·강의·튜토리얼이 연결되지 않는다고 함."
    vi: "So sánh hệ thống truyền thông giữa các nước. Đa số người đánh giá (2015-2019) thấy môn tổ chức kém, bài giảng quá tải, bài đọc, bài giảng và tutorial không ăn khớp."
    ms: "Membandingkan sistem media antara negara. Kebanyakan pengulas (2015-2019) dapati ia kurang teratur, kuliah terlalu padat, dan bacaan, kuliah serta tutorial tidak berkait."
    id: "Membandingkan sistem media antarnegara. Kebanyakan pengulas (2015-2019) merasa pengelolaannya buruk, kuliah terlalu padat, dan bacaan, kuliah serta tutorial tidak nyambung."
    hi: "देशों के मीडिया सिस्टम की तुलना करता है। ज़्यादातर रिव्यूअर्स (2015-2019) को यह ख़राब ढंग से व्यवस्थित लगा, ठूँसे हुए लेक्चर के साथ, और रीडिंग, लेक्चर व ट्यूटोरियल आपस में नहीं जुड़ते थे।"
  - en: "Assignment questions were broad and vague; a few still did well because that left room to write about what interested them."
    zh: "作业题目宽泛模糊；也有几人因此可以写自己感兴趣的内容，反而拿了好成绩。"
    zh-TW: "作業題目寬泛模糊；也有幾個人因此可以寫自己感興趣的內容，反而拿了好成績。"
    ja: "課題の問いは広く曖昧。そのぶん興味のあることを書けたため、好成績を取った人も数人いた。"
    ko: "과제 질문이 넓고 모호함. 그 덕에 관심 있는 걸 쓸 수 있어 좋은 점수를 받은 사람도 몇 있음."
    vi: "Đề bài rộng và mơ hồ; vài người vẫn đạt điểm tốt vì có chỗ để viết về điều mình quan tâm."
    ms: "Soalan tugasan luas dan kabur; beberapa orang tetap berjaya kerana ia memberi ruang menulis tentang minat sendiri."
    id: "Soal tugas luas dan kabur; beberapa orang tetap berhasil karena itu memberi ruang menulis tentang minat mereka."
    hi: "असाइनमेंट के सवाल व्यापक और अस्पष्ट थे; कुछ ने फिर भी अच्छा किया क्योंकि इससे अपनी रुचि पर लिखने की जगह मिली।"
sections:
  content:
    - en: "Compares how media systems differ between countries and regions, with a political lean. A few found that interesting; most found it bland, shallow or confusing."
      zh: "比较不同国家和地区的媒体体系，偏政治。有几位同学觉得有意思，但多数觉得乏味、浅显或让人摸不着头脑。"
      zh-TW: "比較不同國家和地區的媒體體系，偏政治。有幾位同學覺得有趣，但多數覺得乏味、淺顯或摸不著頭緒。"
      ja: "国や地域でメディアシステムがどう違うかを比較し、政治色が強い。面白いという声もあるが、多くは退屈・浅い・分かりにくいと感じた。"
      ko: "국가와 지역별 미디어 체계를 비교하며 정치색이 짙다. 흥미롭다는 사람도 있지만 대부분 밋밋하고 얕거나 혼란스럽다고 했다."
      vi: "So sánh hệ thống truyền thông giữa các nước và khu vực, thiên về chính trị. Vài người thấy thú vị; đa số thấy nhạt, nông hoặc khó hiểu."
      ms: "Membandingkan sistem media antara negara dan rantau, condong kepada politik. Ada yang rasa menarik; kebanyakan rasa hambar, cetek atau mengelirukan."
      id: "Membandingkan sistem media antarnegara dan kawasan, condong ke politik. Beberapa merasa menarik; kebanyakan merasa hambar, dangkal atau membingungkan."
      hi: "देशों और क्षेत्रों के मीडिया सिस्टम की तुलना, राजनीति की ओर झुकाव के साथ। कुछ को रोचक लगा; ज़्यादातर को नीरस, सतही या उलझाने वाला लगा।"
  work:
    - en: "Essays on broad, open questions you can pick yourself. Some liked the freedom and did well; others found the questions vague and the feedback thin."
      zh: "论文题目宽泛开放，可以自己选。有人喜欢这种自由，也拿了好成绩；也有人觉得题目含糊、反馈太少。"
      zh-TW: "論文題目寬泛開放，可以自己選。有人喜歡這種自由，也拿了好成績；也有人覺得題目含糊、回饋太少。"
      ja: "エッセイは自分で選べる広く開かれた問い。自由さを好み良い成績を取った人もいれば、問いが曖昧でフィードバックが少ないと感じた人も。"
      ko: "에세이는 스스로 고를 수 있는 넓고 열린 질문이다. 자유로워서 좋았고 성적도 잘 나왔다는 사람도, 질문이 모호하고 피드백이 부족하다는 사람도 있다."
      vi: "Tiểu luận với câu hỏi rộng, mở và tự chọn. Có người thích sự tự do và làm tốt; người khác thấy đề mơ hồ và phản hồi sơ sài."
      ms: "Esei dengan soalan luas dan terbuka yang boleh dipilih sendiri. Ada yang suka kebebasan itu dan berjaya; ada yang rasa soalan kabur dan maklum balas sedikit."
      id: "Esai dengan pertanyaan luas dan terbuka yang bisa dipilih sendiri. Ada yang suka kebebasannya dan nilainya bagus; ada yang merasa soalnya kabur dan umpan baliknya minim."
      hi: "निबंध के सवाल व्यापक और खुले हैं, जिन्हें ख़ुद चुन सकते हैं। कुछ को यह आज़ादी पसंद आई और अच्छा किया; दूसरों को सवाल अस्पष्ट और फ़ीडबैक कम लगा।"
  watch:
    - en: "Many reviewers found it poorly organised, with rushed lectures and readings, lectures and tutorials that didn't connect."
      zh: "很多同学觉得组织混乱：讲课赶，阅读、讲课和 tutorial 互相对不上。"
      zh-TW: "很多同學覺得安排混亂：上課趕，閱讀、上課和 tutorial 互相對不上。"
      ja: "運営がまとまっておらず、講義は駆け足で、リーディング・講義・チュートリアルがつながっていないという声が多い。"
      ko: "운영이 엉성하고 강의가 급하며 읽기·강의·튜토리얼이 서로 연결되지 않는다는 평이 많다."
      vi: "Nhiều người thấy môn tổ chức kém, bài giảng vội vàng, bài đọc, bài giảng và tutorial không ăn khớp."
      ms: "Ramai pengulas dapati ia kurang teratur, kuliah tergesa-gesa, dan bacaan, kuliah serta tutorial tidak berkaitan."
      id: "Banyak pengulas merasa penyelenggaraannya buruk, kuliah terburu-buru, dan bacaan, kuliah serta tutorial tidak nyambung."
      hi: "कई रिव्यूअर्स को यह अव्यवस्थित लगा, लेक्चर जल्दबाज़ी वाले, और रीडिंग, लेक्चर व ट्यूटोरियल आपस में जुड़े नहीं।"
    - en: "All these reviews are from 2019 or earlier; teaching and exams may have changed since."
      zh: "这些评价都是 2019 年或更早的，现在的教法和考试可能已经变了。"
      zh-TW: "這些評價都是 2019 年或更早的，現在的教法和考試可能已經變了。"
      ja: "レビューはすべて2019年以前のもの。授業や試験は変わっている可能性がある。"
      ko: "모든 리뷰가 2019년 이전 것이라 지금 수업과 시험은 달라졌을 수 있다."
      vi: "Tất cả đánh giá đều từ năm 2019 trở về trước; cách dạy và thi có thể đã thay đổi."
      ms: "Semua ulasan ini dari 2019 atau lebih awal; pengajaran dan peperiksaan mungkin telah berubah."
      id: "Semua ulasan ini dari 2019 atau sebelumnya; pengajaran dan ujian mungkin sudah berubah."
      hi: "ये सभी रिव्यू 2019 या उससे पहले के हैं; पढ़ाई और परीक्षा अब बदल चुकी हो सकती है।"
