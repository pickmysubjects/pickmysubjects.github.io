  - en: "Assessments are clear: an open-book quiz on basic economics, then a mapping task on land prices and density moving out from the city."
    zh: "考核清晰：一次开卷的基础经济学测验，接着做从市中心向外的地价与密度地图分析。"
    zh-TW: "考核清楚：一次開書的基礎經濟學測驗，接著做從市中心往外的地價與密度地圖分析。"
    ja: "評価は明確。基礎経済のオープンブック小テストと、都心から外へ向かう地価・密度の地図課題。"
    ko: "평가가 명확함. 기초 경제 오픈북 퀴즈, 그리고 도심에서 바깥으로 지가·밀도를 보는 지도 과제."
    vi: "Đánh giá rõ ràng: bài kiểm tra mở sách về kinh tế cơ bản, rồi bài bản đồ giá đất và mật độ từ trung tâm ra ngoài."
    ms: "Penilaian jelas: kuiz buku terbuka tentang ekonomi asas, kemudian tugasan peta harga tanah dan kepadatan dari pusat bandar."
    id: "Penilaian jelas: kuis buku terbuka tentang ekonomi dasar, lalu tugas peta harga tanah dan kepadatan dari pusat kota."
    hi: "मूल्यांकन साफ़ है: बुनियादी अर्थशास्त्र पर ओपन-बुक क्विज़, फिर शहर से बाहर ज़मीन की क़ीमत और घनत्व का मैपिंग टास्क।"
  - en: "Content can be boring, and some felt tutorials just repeated the online modules."
