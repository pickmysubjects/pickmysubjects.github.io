code: ARCH20003
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/arch20003
reviews: 5
from: 2018
to: 2020
checked: 2026-10-19
points:
  - en: "Reviewers found it interesting and well taught, one calling it the best history subject in the course."
    zh: "评论者觉得有趣且教得好，有人称其为该课程中最好的历史课。"
    zh-TW: "評論者覺得有趣且教得好，有人稱它是該學程中最好的歷史課。"
    ja: "面白く教え方も良いと好評で、課程で一番の歴史科目だという声もある。"
    ko: "흥미롭고 잘 가르친다는 평. 과정 중 최고의 역사 과목이라는 말도 있음."
    vi: "Người đánh giá thấy môn thú vị, dạy tốt; có người gọi là môn lịch sử hay nhất của chương trình."
    ms: "Pengulas rasa ia menarik dan diajar dengan baik; seorang menggelarnya subjek sejarah terbaik dalam kursus."
    id: "Pengulas merasa menarik dan diajarkan dengan baik; ada yang menyebutnya mata kuliah sejarah terbaik."
    hi: "रिव्यूअर्स को यह रोचक और अच्छा पढ़ाया हुआ लगा; एक ने इसे कोर्स का सबसे अच्छा इतिहास विषय कहा।"
  - en: "The amount of content is very large, and doing well depends on essay writing and detailed notes on the weekly readings."
    zh: "内容量非常大，想拿好成绩要靠论文写作和对每周阅读做详细笔记。"
    zh-TW: "內容量非常大，想拿好成績要靠論文寫作和對每週閱讀做詳細筆記。"
    ja: "内容が非常に多く、良い成績にはレポート力と毎週の文献の丁寧なメモが鍵。"
    ko: "내용이 매우 많고, 좋은 성적은 에세이 실력과 매주 읽기 자료의 꼼꼼한 노트에 달림."
    vi: "Lượng nội dung rất lớn, muốn điểm cao cần viết tiểu luận tốt và ghi chép kỹ bài đọc hằng tuần."
    ms: "Kandungannya sangat banyak, dan prestasi baik bergantung pada penulisan esei dan nota terperinci bacaan mingguan."
    id: "Materinya sangat banyak, dan nilai bagus bergantung pada menulis esai serta catatan rinci bacaan mingguan."
    hi: "कंटेंट बहुत ज़्यादा है, और अच्छा करने के लिए निबंध लेखन और साप्ताहिक रीडिंग के विस्तृत नोट्स ज़रूरी हैं।"
  - en: "Not recommended as a breadth unless you already know some architecture, since essays and exams expect its vocabulary."
    zh: "除非已有一些建筑基础，否则不建议作为跨学科选修，因为论文和考试要求掌握专业词汇。"
    zh-TW: "除非已有一些建築基礎，否則不建議當 Breadth 選修，因為論文和考試要求掌握專業詞彙。"
    ja: "建築の基礎がないならBreadthとしては勧められない。レポートと試験で専門用語が求められる。"
    ko: "건축 기초가 없다면 Breadth로는 비추천. 에세이와 시험에서 전문 용어를 요구함."
    vi: "Không nên chọn làm Breadth nếu chưa biết chút kiến trúc, vì tiểu luận và bài thi đòi thuật ngữ chuyên ngành."
    ms: "Tidak disyorkan sebagai Breadth kecuali anda sudah tahu sedikit seni bina, kerana esei dan peperiksaan memerlukan istilahnya."
    id: "Tidak disarankan sebagai Breadth kecuali sudah paham sedikit arsitektur, karena esai dan ujian menuntut istilahnya."
    hi: "जब तक थोड़ी वास्तुकला न आती हो, Breadth के रूप में सलाह नहीं दी गई, क्योंकि निबंध और एग्ज़ाम में उसकी शब्दावली चाहिए।"
sections:
  content:
    - en: "Modern architecture history. Reviewers found it fascinating and relevant to practice, but with far too much content to get through."
      zh: "讲现代建筑史。同学觉得很吸引人、和实际执业相关，但内容多到难以消化。"
      zh-TW: "講現代建築史。同學覺得很吸引人、和實務相關，但內容多到難以消化。"
      ja: "近代建築史。魅力的で実務にも関係するが、内容が多すぎるという。"
      ko: "현대 건축사. 매혹적이고 실무와도 관련 있지만 내용이 지나치게 많다는 평."
      vi: "Lịch sử kiến trúc hiện đại. Người học thấy cuốn hút và gắn với nghề, nhưng nội dung quá nhiều."
      ms: "Sejarah seni bina moden. Pengulas rasa menarik dan relevan dengan amalan, tetapi kandungannya terlalu banyak."
      id: "Sejarah arsitektur modern. Pengulas merasa memukau dan relevan dengan praktik, tapi materinya terlalu banyak."
      hi: "आधुनिक वास्तुकला का इतिहास। रिव्यूअर्स को आकर्षक और पेशे से जुड़ा लगा, पर सामग्री बहुत ज़्यादा।"
  work:
    - en: "Essays and exams that need architectural vocabulary and critical analysis; one reviewer says strong essay writing is the only way to do well. Notes on the weekly readings help."
      zh: "论文和考试都要用建筑术语做批判分析；有同学说只有论文写得好才能考好。做好每周阅读的笔记有帮助。"
      zh-TW: "論文和考試都要用建築術語做批判分析；有同學說只有論文寫得好才能考好。做好每週閱讀的筆記有幫助。"
      ja: "エッセイと試験では建築用語と批判的分析が必要。良い成績にはエッセイ力が不可欠だという人も。毎週のリーディングのノートが役立つ。"
      ko: "에세이와 시험에 건축 용어와 비판적 분석이 필요하다. 에세이를 잘 써야만 잘할 수 있다는 리뷰도 있다. 주간 리딩 노트가 도움이 된다."
      vi: "Bài luận và thi cần từ vựng kiến trúc và phân tích phản biện; một người nói chỉ viết luận giỏi mới đạt cao. Ghi chú bài đọc hằng tuần giúp ích."
      ms: "Esei dan peperiksaan memerlukan perbendaharaan kata seni bina dan analisis kritis; seorang kata penulisan esei yang kuat satu-satunya cara berjaya. Nota bacaan mingguan membantu."
      id: "Esai dan ujian butuh kosakata arsitektur dan analisis kritis; satu bilang menulis esai yang kuat satu-satunya cara berhasil. Catatan bacaan mingguan membantu."
      hi: "निबंध और परीक्षा में वास्तुकला शब्दावली और आलोचनात्मक विश्लेषण चाहिए; एक कहता है अच्छा निबंध लेखन ही अच्छा करने का तरीका है। साप्ताहिक रीडिंग के नोट्स मदद करते हैं।"
  watch:
    - en: "One reviewer doesn't recommend it as a breadth unless you love modern architecture and have some background."
      zh: "有同学不建议当 breadth 来选，除非你热爱现代建筑、有一定基础。"
      zh-TW: "有同學不建議當 breadth 來修，除非你熱愛現代建築、有一定基礎。"
      ja: "近代建築が大好きで素養がある人以外には、ブレドスとしては勧めないという人も。"
      ko: "현대 건축을 정말 좋아하고 배경 지식이 있지 않다면 브레드스로는 추천하지 않는다는 리뷰가 있다."
      vi: "Một người không khuyên chọn làm môn breadth trừ khi bạn mê kiến trúc hiện đại và có chút nền tảng."
      ms: "Seorang tidak mengesyorkannya sebagai breadth kecuali anda suka seni bina moden dan ada sedikit latar belakang."
      id: "Satu pengulas tidak menyarankannya sebagai breadth kecuali kamu menyukai arsitektur modern dan punya sedikit latar."
      hi: "एक रिव्यूअर इसे ब्रेड्थ के रूप में तभी सुझाता है जब आपको आधुनिक वास्तुकला पसंद हो और कुछ पृष्ठभूमि हो।"
    - en: "All these reviews are from 2020 or earlier; teaching and exams may have changed since."
      zh: "这些评价都是 2020 年或更早的，现在的教法和考试可能已经变了。"
      zh-TW: "這些評價都是 2020 年或更早的，現在的教法和考試可能已經變了。"
      ja: "レビューはすべて2020年以前のもの。授業や試験は変わっている可能性がある。"
      ko: "모든 리뷰가 2020년 이전 것이라 지금 수업과 시험은 달라졌을 수 있다."
      vi: "Tất cả đánh giá đều từ năm 2020 trở về trước; cách dạy và thi có thể đã thay đổi."
      ms: "Semua ulasan ini dari 2020 atau lebih awal; pengajaran dan peperiksaan mungkin telah berubah."
      id: "Semua ulasan ini dari 2020 atau sebelumnya; pengajaran dan ujian mungkin sudah berubah."
      hi: "ये सभी रिव्यू 2020 या उससे पहले के हैं; पढ़ाई और परीक्षा अब बदल चुकी हो सकती है।"
workload: heavy
