points:
  - en: "Content and exam are widely seen as easy; an H1 is possible with modest effort."
    zh: "内容和考试普遍被认为简单，适度投入即可拿H1。"
    zh-TW: "內容和考試普遍被認為簡單，適度投入就能拿H1。"
    ja: "内容も試験も簡単とされ、ほどほどの努力でH1が取れる。"
    ko: "내용과 시험이 쉽다는 평이 많고, 적당한 노력으로 H1이 가능함."
    vi: "Nội dung và bài thi được cho là dễ; bỏ công vừa phải cũng có thể đạt H1."
    ms: "Kandungan dan peperiksaan dilihat mudah; H1 boleh dicapai dengan usaha sederhana."
    id: "Materi dan ujian dinilai mudah; H1 bisa diraih dengan usaha sedang."
    hi: "कंटेंट और एग्ज़ाम आम तौर पर आसान माने जाते हैं; थोड़ी मेहनत से H1 संभव है।"
  - en: "Pracs are repeatedly criticised for unclear instructions and marking; asking tutors and working with peers helps."
    zh: "实验课多次被批评说明和评分不清；多问助教、与同学合作会有帮助。"
    zh-TW: "實驗課多次被批評說明和評分不清楚；多問助教、和同學合作會有幫助。"
    ja: "実習は指示と採点が不明確だと繰り返し批判されている。チューターに聞き、仲間と取り組むと良い。"
    ko: "실습은 안내와 채점이 불명확하다는 비판이 반복되며, 튜터에게 묻고 동료와 함께하면 도움이 됨."
    vi: "Prac nhiều lần bị chê hướng dẫn và chấm điểm không rõ; hỏi tutor và làm cùng bạn sẽ giúp ích."
    ms: "Prac berulang kali dikritik kerana arahan dan pemarkahan tidak jelas; bertanya tutor dan bekerja dengan rakan membantu."
    id: "Prak berulang kali dikritik karena instruksi dan penilaian tidak jelas; bertanya ke tutor dan kerja bareng teman membantu."
    hi: "प्रैक्टिकल की बार-बार आलोचना हुई कि निर्देश और मार्किंग अस्पष्ट हैं; ट्यूटर से पूछना और साथियों के साथ काम करना मदद करता है।"
  - en: "Each disaster topic has a different lecturer, and quality varies between them."
    zh: "每种灾害主题由不同讲师讲授，质量参差不齐。"
    zh-TW: "每種災害主題由不同講師教，品質參差不齊。"
    ja: "災害のテーマごとに講師が違い、質にばらつきがある。"
    ko: "재해 주제마다 강사가 달라 질에 편차가 있음."
    vi: "Mỗi chủ đề thiên tai do một giảng viên khác dạy, chất lượng không đồng đều."
    ms: "Setiap topik bencana ada pensyarah berbeza, dan kualitinya berbeza-beza."
    id: "Tiap topik bencana diajar dosen berbeda, dan kualitasnya bervariasi."
    hi: "हर डिज़ास्टर टॉपिक का लेक्चरर अलग है, और उनकी क्वालिटी अलग-अलग है।"
workload: light
difficulty: easy
