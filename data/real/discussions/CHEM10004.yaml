points:
  - en: "Generally seen as harder than Chemistry 1, mainly because of the organic chemistry section."
    zh: "普遍认为比化学1更难，主要难在有机化学部分。"
    zh-TW: "普遍認為比化學1難，主要難在有機化學部分。"
    ja: "主に有機化学のパートのせいで、Chemistry 1より難しいと一般に見られている。"
    ko: "주로 유기화학 파트 때문에 Chemistry 1보다 어렵다는 평이 일반적이다."
    vi: "Nhìn chung được xem là khó hơn Chemistry 1, chủ yếu do phần hóa hữu cơ."
    ms: "Secara umum dianggap lebih sukar daripada Chemistry 1, terutamanya kerana bahagian kimia organik."
    id: "Umumnya dianggap lebih sulit dari Chemistry 1, terutama karena bagian kimia organik."
    hi: "आम तौर पर Chemistry 1 से कठिन माना जाता है, मुख्य रूप से ऑर्गेनिक केमिस्ट्री वाले हिस्से की वजह से।"
  - en: "Tutorials are repeatedly described as very helpful, and the subject is called well run."
    zh: "辅导课多次被评价为非常有帮助，课程整体运作良好。"
    zh-TW: "輔導課多次被說非常有幫助，整門課也被認為辦得不錯。"
    ja: "チュートリアルはとても役立つと何度も言われ、科目の運営も良いとされている。"
    ko: "튜토리얼은 매우 도움이 된다는 말이 반복되고, 과목 운영도 잘 된다는 평이다."
    vi: "Tutorial nhiều lần được khen rất hữu ích, và môn học được cho là tổ chức tốt."
    ms: "Tutorial berulang kali digambarkan sangat membantu, dan subjek ini dikatakan diurus dengan baik."
    id: "Tutorial berulang kali disebut sangat membantu, dan mata kuliah ini dinilai dikelola dengan baik."
    hi: "ट्यूटोरियल को बार-बार बहुत मददगार बताया गया, और सब्जेक्ट को अच्छी तरह संचालित कहा गया।"
  - en: "Several advise against the summer term: it felt harder and the real exam was tougher than the practice papers."
    zh: "多位建议不要在夏季学期修读：感觉更难，且正式考试比练习卷难。"
    zh-TW: "幾位建議不要修暑期班：感覺更難，正式考試也比練習卷難。"
    ja: "サマータームはおすすめしないという声が複数。より難しく感じ、本番の試験も練習問題より難しかった。"
    ko: "여러 명이 여름 학기는 피하라고 조언한다. 더 어렵게 느껴졌고 실제 시험도 연습 문제보다 어려웠다."
    vi: "Vài người khuyên tránh học kỳ hè: cảm giác khó hơn và đề thi thật khó hơn đề luyện."
    ms: "Beberapa orang menasihatkan elak penggal musim panas: ia terasa lebih sukar dan peperiksaan sebenar lebih susah daripada kertas latihan."
    id: "Beberapa menyarankan hindari semester musim panas: terasa lebih sulit dan ujian aslinya lebih berat dari soal latihan."
    hi: "कई लोग समर टर्म न लेने की सलाह देते हैं: यह ज़्यादा कठिन लगा और असली परीक्षा प्रैक्टिस पेपर से कठिन थी।"
  - en: "Pracs and reports are a good source of marks, so don't neglect them."
    zh: "实验和实验报告是不错的得分来源，不要忽视。"
    zh-TW: "實驗和實驗報告是不錯的得分來源，不要忽略。"
    ja: "実験とレポートは点を稼げるので、手を抜かないこと。"
    ko: "실험과 보고서는 점수를 잘 받을 수 있는 부분이니 소홀히 하지 말자."
    vi: "Thực hành và báo cáo là nguồn điểm tốt, đừng bỏ bê."
    ms: "Amali dan laporan ialah sumber markah yang baik, jadi jangan abaikan."
    id: "Praktikum dan laporan adalah sumber nilai yang bagus, jadi jangan diabaikan."
    hi: "प्रैक्टिकल और रिपोर्ट नंबरों का अच्छा ज़रिया हैं, इन्हें नज़रअंदाज़ न करें।"
difficulty: hard
