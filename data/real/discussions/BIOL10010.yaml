points:
  - en: "Heavy focus on ecology and evolution; many biomed-bound students found it dry and not relevant to later subjects."
    zh: "重点是生态学和进化论；许多准备读生物医学的学生觉得枯燥，且与后续课程关系不大。"
  - en: "Students complained they could not see their MST paper or answers afterwards, making it hard to learn from mistakes."
    zh: "学生抱怨考后看不到期中试卷和自己的答案，难以从错误中学习。"
  - en: "Pracs are widely seen as boring, but practical content is tested in the exam."
    zh: "实践课普遍被认为枯燥，但其内容会出现在考试中。"
  - en: "An H1 is still possible: maximise marks on quizzes and the group report, which is not marked leniently."
    zh: "仍有可能拿H1：要在小测和小组报告上尽量拿分，报告评分并不宽松。"
