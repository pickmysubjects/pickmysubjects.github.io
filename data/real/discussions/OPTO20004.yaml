points:
  - en: "Most found the assessments straightforward."
    zh: "多数人认为考核直接简单。"
    zh-TW: "多數人認為考核簡單直接。"
    ja: "評価課題はシンプルだと感じた人が多い。"
    ko: "대부분 평가가 단순하다고 느꼈다."
    vi: "Đa số thấy các bài đánh giá đơn giản."
    ms: "Kebanyakan dapati penilaian mudah."
    id: "Kebanyakan menilai tugasnya lugas."
    hi: "ज़्यादातर को असेसमेंट सीधे-सादे लगे।"
  - en: "Opinions on difficulty are split: some found the content easy, others said there was a lot of it and it was delivered dryly."
    zh: "难度评价不一：有人觉得内容简单，有人觉得量大且讲得枯燥。"
    zh-TW: "難度評價不一：有人覺得內容簡單，有人覺得量大又講得枯燥。"
    ja: "難易度の評価は分かれる。内容が易しいという人もいれば、量が多く説明が退屈だという人もいる。"
    ko: "난이도 의견은 갈린다. 내용이 쉽다는 사람도, 양이 많고 지루하게 전달된다는 사람도 있다."
    vi: "Ý kiến về độ khó trái chiều: có người thấy dễ, người khác nói nội dung nhiều và giảng khô khan."
    ms: "Pendapat tentang kesukaran berbelah: ada yang rasa kandungan mudah, ada yang kata ia banyak dan disampaikan secara hambar."
    id: "Pendapat soal tingkat kesulitan terbelah: ada yang merasa mudah, ada yang bilang materinya banyak dan disampaikan membosankan."
    hi: "कठिनाई पर राय बँटी है: कुछ को कंटेंट आसान लगा, दूसरों ने कहा यह बहुत है और नीरस ढंग से पढ़ाया गया।"
  - en: "It leans more towards art than science, so check that it suits you."
    zh: "偏向艺术多于科学，选课前确认是否适合自己。"
    zh-TW: "偏向藝術多於科學，選課前先確認是否適合自己。"
    ja: "科学より芸術寄りなので、自分に合うか確認しよう。"
    ko: "과학보다 예술 쪽에 가까우니 자신에게 맞는지 확인하자."
    vi: "Thiên về nghệ thuật hơn khoa học, nên xem có hợp với bạn không."
    ms: "Ia lebih condong kepada seni berbanding sains, jadi pastikan ia sesuai dengan anda."
    id: "Lebih condong ke seni daripada sains, jadi pastikan cocok untukmu."
    hi: "यह साइंस से ज़्यादा आर्ट की ओर झुका है, तो देख लें कि आपके लिए सही है।"
sections:
  content:
    - en: "Optical illusions, the science behind them and how they relate to art; one reviewer warns it's more art than science. Opinions split: some found it easy and well structured, others found a lot of dryly delivered content."
      zh: "讲视错觉、背后的科学以及和艺术的关系；有同学提醒其实艺术多于科学。评价两极：有人觉得简单、结构清楚，也有人觉得内容多、讲得枯燥。"
      zh-TW: "講視錯覺、背後的科學以及和藝術的關係；有同學提醒其實藝術多於科學。評價兩極：有人覺得簡單、結構清楚，也有人覺得內容多、講得枯燥。"
      ja: "錯視とその科学、芸術との関係。科学より芸術寄りだと注意する人も。簡単で構成が良いという人と、内容が多く講義が退屈という人に分かれる。"
      ko: "착시와 그 과학, 예술과의 관계. 과학보다 예술 쪽이라고 경고하는 사람도 있다. 쉽고 구성이 좋다는 평과 내용이 많고 건조하게 전달된다는 평이 갈린다."
      vi: "Ảo giác thị giác, khoa học đằng sau và liên hệ với nghệ thuật; một người cảnh báo thiên về nghệ thuật hơn khoa học. Ý kiến chia: có người thấy dễ, rõ ràng; người khác thấy nhiều nội dung, giảng khô khan."
      ms: "Ilusi optik, sains di sebaliknya dan kaitannya dengan seni; seorang ingatkan ia lebih seni daripada sains. Pandangan berbelah: ada yang rasa mudah dan tersusun, ada yang rasa banyak kandungan disampaikan secara hambar."
      id: "Ilusi optik, sains di baliknya dan kaitannya dengan seni; satu mengingatkan lebih banyak seni daripada sains. Pendapat terbelah: ada yang merasa mudah dan terstruktur, ada yang merasa materi banyak dan disampaikan datar."
      hi: "दृष्टि भ्रम, उनके पीछे का विज्ञान और कला से संबंध; एक चेताता है यह विज्ञान से ज़्यादा कला है। राय बँटी है: कुछ को आसान और सुव्यवस्थित, कुछ को ढेर सारी नीरस ढंग से पढ़ाई सामग्री लगी।"
  work:
    - en: "Reviewers agree the assessments are straightforward, but there's an in-person handwritten exam over a lot of content; one 2022 reviewer said it hurt their WAM."
      zh: "大家都说平时考核很直接，但有一场线下手写期末，内容很多；一位 2022 年的同学说它拉低了 WAM。"
      zh-TW: "大家都說平時考核很直接，但有一場實體手寫期末，內容很多；一位 2022 年的同學說它拉低了 WAM。"
      ja: "課題は素直だという点で一致するが、範囲の広い対面の手書き試験がある。2022年の一人はWAMが下がったと言う。"
      ko: "과제가 간단하다는 데는 동의하지만, 범위가 넓은 대면 손글씨 시험이 있다. 2022년 한 리뷰는 WAM이 떨어졌다고 했다."
      vi: "Mọi người đồng ý bài đánh giá đơn giản, nhưng có bài thi viết tay trực tiếp với rất nhiều nội dung; một người năm 2022 nói nó kéo WAM xuống."
      ms: "Pengulas sepakat penilaian mudah, tetapi ada peperiksaan tulisan tangan bersemuka atas banyak kandungan; seorang pengulas 2022 kata ia menjejaskan WAM."
      id: "Pengulas sepakat penilaian lugas, tapi ada ujian tulis tangan tatap muka dengan banyak materi; satu pengulas 2022 bilang itu menurunkan WAM."
      hi: "सब मानते हैं आकलन सीधे हैं, पर बहुत सामग्री पर आमने-सामने हाथ से लिखी परीक्षा है; 2022 के एक ने कहा इससे WAM गिरा।"
  watch:
    - en: "One reviewer crammed it all in a few days and did fine but doesn't recommend it. Reviews are from 2023 or earlier."
      zh: "有同学考前几天突击也考得不错，但不推荐这么做。评价都是 2023 年或更早的。"
      zh-TW: "有同學考前幾天臨時抱佛腳也考得不錯，但不推薦這麼做。評價都是 2023 年或更早的。"
      ja: "数日で詰め込んで問題なかった人もいるが、勧めないという。レビューは2023年以前のもの。"
      ko: "며칠 만에 벼락치기해서 괜찮았던 사람도 있지만 추천하진 않는다고 한다. 리뷰는 2023년 이전이다."
      vi: "Một người học dồn trong vài ngày vẫn ổn nhưng không khuyến khích. Các đánh giá từ 2023 trở về trước."
      ms: "Seorang belajar semuanya dalam beberapa hari dan berjaya tetapi tidak mengesyorkannya. Ulasan dari 2023 atau lebih awal."
      id: "Satu pengulas belajar kebut dalam beberapa hari dan lumayan, tapi tidak menyarankannya. Ulasan dari 2023 atau sebelumnya."
      hi: "एक ने कुछ दिनों में सब रट लिया और ठीक रहा, पर इसकी सलाह नहीं देता। रिव्यू 2023 या पहले के हैं।"
difficulty: mixed
