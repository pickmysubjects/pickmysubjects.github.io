  - en: "Most found the assessments straightforward."
    zh: "多数人认为考核直接简单。"
    zh-TW: "多數人認為考核簡單直接。"
    ja: "評価課題はシンプルだと感じた人が多い。"
    ko: "대부분 평가가 단순하다고 느꼈다."
    vi: "Đa số thấy các bài đánh giá đơn giản."
    ms: "Kebanyakan dapati penilaian mudah."
    id: "Kebanyakan menilai tugasnya lugas."
    hi: "ज़्यादातर को असेसमेंट सीधे-सादे लगे।"
  - en: "Opinions on difficulty are split: some found the content easy, others said there was a lot of it and it was delivered dryly."
    zh: "难度评价不一：有人觉得内容简单，有人觉得量大且讲得枯燥。"
    zh-TW: "難度評價不一：有人覺得內容簡單，有人覺得量大又講得枯燥。"
    ja: "難易度の評価は分かれる。内容が易しいという人もいれば、量が多く説明が退屈だという人もいる。"
    ko: "난이도 의견은 갈린다. 내용이 쉽다는 사람도, 양이 많고 지루하게 전달된다는 사람도 있다."
    vi: "Ý kiến về độ khó trái chiều: có người thấy dễ, người khác nói nội dung nhiều và giảng khô khan."
    ms: "Pendapat tentang kesukaran berbelah: ada yang rasa kandungan mudah, ada yang kata ia banyak dan disampaikan secara hambar."
    id: "Pendapat soal tingkat kesulitan terbelah: ada yang merasa mudah, ada yang bilang materinya banyak dan disampaikan membosankan."
    hi: "कठिनाई पर राय बँटी है: कुछ को कंटेंट आसान लगा, दूसरों ने कहा यह बहुत है और नीरस ढंग से पढ़ाया गया।"
  - en: "It leans more towards art than science, so check that it suits you."
    zh: "偏向艺术多于科学，选课前确认是否适合自己。"
    zh-TW: "偏向藝術多於科學，選課前先確認是否適合自己。"
    ja: "科学より芸術寄りなので、自分に合うか確認しよう。"
    ko: "과학보다 예술 쪽에 가까우니 자신에게 맞는지 확인하자."
    vi: "Thiên về nghệ thuật hơn khoa học, nên xem có hợp với bạn không."
    ms: "Ia lebih condong kepada seni berbanding sains, jadi pastikan ia sesuai dengan anda."
    id: "Lebih condong ke seni daripada sains, jadi pastikan cocok untukmu."
    hi: "यह साइंस से ज़्यादा आर्ट की ओर झुका है, तो देख लें कि आपके लिए सही है।"
