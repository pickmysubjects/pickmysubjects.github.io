points:
  - en: "Assessment mixes a book review (free choice of book), an in-semester test and a choose-your-own-topic essay."
    zh: "考核包括书评（自由选书）、学期中测验和自选题目的论文。"
    zh-TW: "考核包括書評（自由選書）、學期中小考和一篇自選題目的論文。"
    ja: "評価は書評（本は自由選択）、学期中テスト、テーマ自由のエッセイの組み合わせ。"
    ko: "평가는 서평(책 자유 선택), 학기 중 시험, 자유 주제 에세이로 구성."
    vi: "Đánh giá gồm bài điểm sách (tự chọn sách), bài kiểm tra giữa kỳ và bài luận tự chọn chủ đề."
    ms: "Penilaian gabungan ulasan buku (bebas pilih buku), ujian dalam semester dan esei topik pilihan sendiri."
    id: "Penilaian terdiri dari resensi buku (bebas pilih buku), tes tengah semester, dan esai topik pilihan sendiri."
    hi: "असेसमेंट में बुक रिव्यू (किताब अपनी पसंद की), सेमेस्टर के बीच एक टेस्ट और अपनी पसंद के टॉपिक पर निबंध है।"
  - en: "The test can be tricky, and some said it included material not covered in lectures."
    zh: "测验可能有些难，有人说考到了讲课未涉及的内容。"
    zh-TW: "小考可能有點刁鑽，有人說考到了講課沒教的內容。"
    ja: "テストはひねりがあることも。講義で扱っていない内容が出たという声も。"
    ko: "시험은 까다로울 수 있고, 강의에서 다루지 않은 내용이 나왔다는 의견도 있음."
    vi: "Bài kiểm tra có thể khó nhằn, một số nói có nội dung không được dạy trong bài giảng."
    ms: "Ujian boleh jadi rumit, dan ada yang kata ia termasuk bahan yang tidak diajar dalam kuliah."
    id: "Tesnya bisa menjebak, dan ada yang bilang keluar materi yang tidak dibahas di kuliah."
    hi: "टेस्ट पेचीदा हो सकता है, और कुछ ने कहा उसमें ऐसा मटीरियल था जो लेक्चर में नहीं पढ़ाया गया।"
  - en: "Most found the content interesting, though a couple felt the structure was scattered or tutorials dry."
    zh: "多数人觉得内容有趣，但也有人认为结构松散或辅导课枯燥。"
    zh-TW: "多數人覺得內容有趣，但也有一兩位覺得架構零散或小組討論課枯燥。"
    ja: "大半は内容が面白いと感じたが、構成がまとまらない、チュートリアルが退屈と感じた人も少数いる。"
    ko: "대부분 내용이 흥미롭다고 했지만, 몇몇은 구성이 산만하거나 튜토리얼이 지루하다고 느낌."
    vi: "Đa số thấy nội dung thú vị, dù vài người thấy cấu trúc rời rạc hoặc tutorial khô khan."
    ms: "Kebanyakan rasa kandungan menarik, walaupun beberapa orang rasa strukturnya berselerak atau tutorial membosankan."
    id: "Sebagian besar merasa materinya menarik, meski beberapa merasa strukturnya berantakan atau tutorialnya membosankan."
    hi: "ज़्यादातर को कंटेंट दिलचस्प लगा, हालाँकि एक-दो को ढाँचा बिखरा या ट्यूटोरियल नीरस लगे।"
