reviews: 7
from: 2015
to: 2021
checked: 2026-10-17
points:
  - en: "Good for immersion and oral and listening practice, covering the French language's history, French media and some literature."
    zh: "很适合沉浸式练习口语和听力，内容涵盖法语历史、法国媒体和一些文学。"
    zh-TW: "很適合沉浸式練習口說和聽力，內容涵蓋法語歷史、法國媒體和一些文學。"
    ja: "フランス語に浸ってスピーキングとリスニングを鍛えるのに良い。フランス語の歴史、フランスのメディア、文学の一部を扱う。"
    ko: "몰입식으로 말하기와 듣기를 연습하기 좋음. 프랑스어의 역사, 프랑스 미디어, 일부 문학을 다룸."
    vi: "Tốt để đắm mình luyện nói và nghe, nội dung gồm lịch sử tiếng Pháp, truyền thông Pháp và một ít văn học."
    ms: "Bagus untuk imersi serta latihan lisan dan pendengaran, meliputi sejarah Bahasa Perancis, media Perancis dan sedikit sastera."
    id: "Bagus untuk imersi serta latihan berbicara dan mendengar, mencakup sejarah bahasa Prancis, media Prancis, dan sedikit sastra."
    hi: "डूबकर बोलने-सुनने के अभ्यास के लिए अच्छा, जिसमें फ़्रेंच भाषा का इतिहास, फ़्रांसीसी मीडिया और कुछ साहित्य शामिल है।"
  - en: "Common gripes: content repeats French 5 and 6, the passé simple is taught in a rush before a big final short-story task, and some quizzes take more study than they are worth."
    zh: "常见抱怨：内容与法语5、6重复；简单过去时教得很赶，紧接着就是篇幅很大的短篇小说期末作业；有些小测验投入多、回报少。"
    zh-TW: "常見抱怨：內容與法語5、6重複；簡單過去式教得很趕，緊接著就是篇幅很大的短篇小說期末作業；有些小測驗投入多、回報少。"
    ja: "よくある不満は、French 5・6との内容の重複、大きな最終課題（短編小説）の前に単純過去が駆け足で教えられること、労力の割に配点の低いクイズ。"
    ko: "흔한 불만: French 5, 6과 내용이 겹치고, 큰 기말 단편소설 과제 전에 단순과거를 급히 가르치며, 일부 퀴즈는 노력 대비 배점이 낮음."
    vi: "Phàn nàn thường gặp: nội dung lặp lại French 5 và 6, thì passé simple dạy vội trước bài truyện ngắn cuối kỳ lớn, và vài bài quiz tốn công hơn giá trị điểm."
    ms: "Rungutan biasa: kandungan mengulang French 5 dan 6, passé simple diajar tergesa-gesa sebelum tugasan cerpen akhir yang besar, dan sesetengah kuiz perlukan usaha lebih daripada nilainya."
    id: "Keluhan umum: materi mengulang French 5 dan 6, passé simple diajarkan terburu-buru sebelum tugas cerpen akhir yang besar, dan beberapa kuis butuh usaha melebihi bobotnya."
    hi: "आम शिकायतें: सामग्री French 5 और 6 को दोहराती है, बड़े फ़ाइनल कहानी असाइनमेंट से पहले passé simple जल्दबाज़ी में पढ़ाया जाता है, और कुछ क्विज़ में मेहनत उनके अंकों से ज़्यादा लगती है।"
sections:
  content:
    - en: "Three parts: the history and modern state of French, French journalism and media, then French literature and the passé simple. Good for oral and listening practice; some found it repetitive after French 5 and 6."
      zh: "三部分：法语的历史和现状、法国新闻与媒体，以及法国文学和简单过去时。对练口语和听力很好；有人觉得和法语 5、6 重复。"
      zh-TW: "三部分：法語的歷史和現況、法國新聞與媒體，以及法國文學和簡單過去式。對練口說和聽力很好；有人覺得和法語 5、6 重複。"
      ja: "フランス語の歴史と現状、フランスの報道とメディア、フランス文学と単純過去の3部構成。会話と聞き取りの練習に良いが、フランス語5・6の繰り返しだという声も。"
      ko: "프랑스어의 역사와 현황, 프랑스 언론과 미디어, 프랑스 문학과 단순과거의 세 부분. 말하기·듣기 연습에 좋지만 프랑스어 5·6과 반복된다는 의견도 있다."
      vi: "Ba phần: lịch sử và hiện trạng tiếng Pháp, báo chí và truyền thông Pháp, rồi văn học Pháp và thì passé simple. Tốt để luyện nói và nghe; có người thấy lặp lại French 5 và 6."
      ms: "Tiga bahagian: sejarah dan keadaan semasa bahasa Perancis, kewartawanan dan media Perancis, kemudian kesusasteraan Perancis dan passé simple. Baik untuk latihan lisan dan pendengaran; ada yang rasa berulang selepas French 5 dan 6."
      id: "Tiga bagian: sejarah dan kondisi kini bahasa Prancis, jurnalisme dan media Prancis, lalu sastra Prancis dan passé simple. Bagus untuk latihan lisan dan menyimak; sebagian merasa mengulang French 5 dan 6."
      hi: "तीन हिस्से: फ़्रेंच भाषा का इतिहास और वर्तमान, फ़्रांसीसी पत्रकारिता और मीडिया, फिर फ़्रांसीसी साहित्य और passé simple। बोलने और सुनने के अभ्यास के लिए अच्छा; कुछ को French 5 और 6 का दोहराव लगा।"
  work:
    - en: "Short quizzes, other written tasks and a final assignment writing a short story in the passé simple, a tense taught only shortly before. One reviewer found marking harsh."
      zh: "有简短小测、其他书面作业，以及期末用简单过去时写一篇短篇故事，而这个时态学了没多久。有同学觉得给分严。"
      zh-TW: "有簡短小考、其他書面作業，以及期末用簡單過去式寫一篇短篇故事，而這個時態才學沒多久。有同學覺得給分嚴。"
      ja: "短い小テスト、その他の記述課題、そして習ったばかりの単純過去で短編小説を書く最終課題。採点が厳しいという声も一つ。"
      ko: "짧은 퀴즈, 기타 작문 과제, 그리고 배운 지 얼마 안 된 단순과거로 단편소설을 쓰는 최종 과제가 있다. 채점이 박했다는 리뷰어도 있다."
      vi: "Quiz ngắn, các bài viết khác và bài cuối kỳ viết truyện ngắn bằng passé simple, thì mới học không lâu trước đó. Một người thấy chấm gắt."
      ms: "Kuiz pendek, tugasan bertulis lain dan tugasan akhir menulis cerpen dalam passé simple, kala yang baru diajar tidak lama sebelumnya. Seorang pengulas rasa pemarkahan keras."
      id: "Kuis singkat, tugas tulis lain dan tugas akhir menulis cerpen dengan passé simple, kala yang baru diajarkan tak lama sebelumnya. Satu pengulas merasa penilaiannya keras."
      hi: "छोटे क्विज़, दूसरे लिखित काम, और अंतिम असाइनमेंट में passé simple में लघुकथा लिखना, जो काल कुछ समय पहले ही सिखाया गया। एक रिव्यूअर को मार्किंग सख़्त लगी।"
  study:
    - en: "Revise the passé simple and other grammar outside class, since it is covered quickly, and keep building your vocabulary and speaking."
      zh: "简单过去时等语法课上讲得快，要在课外复习；持续扩充词汇、多练口语。"
      zh-TW: "簡單過去式等文法課堂上講得快，要在課外複習；持續擴充單字、多練口說。"
      ja: "単純過去などの文法は授業で駆け足なので授業外で復習し、語彙と会話力を伸ばし続ける。"
      ko: "단순과거 등 문법은 수업에서 빨리 지나가니 수업 외에 복습하고, 어휘와 말하기를 꾸준히 늘려라."
      vi: "Ôn passé simple và ngữ pháp khác ngoài giờ vì trên lớp dạy nhanh, và liên tục mở rộng từ vựng, luyện nói."
      ms: "Ulang kaji passé simple dan tatabahasa lain di luar kelas kerana ia diajar dengan cepat, dan terus tambah kosa kata serta latih bertutur."
      id: "Ulangi passé simple dan tata bahasa lain di luar kelas karena dibahas cepat, dan terus tambah kosakata serta latih berbicara."
      hi: "passé simple और दूसरे व्याकरण को क्लास के बाहर दोहराएँ, क्योंकि ये जल्दी पढ़ाए जाते हैं, और शब्दावली व बोलना लगातार बढ़ाते रहें।"
  watch:
    - en: "All these reviews are from 2021 or earlier; teaching and exams may have changed since."
      zh: "这些评价都是 2021 年或更早的，现在的教法和考试可能已经变了。"
      zh-TW: "這些評價都是 2021 年或更早的，現在的教法和考試可能已經變了。"
      ja: "レビューはすべて2021年以前のもの。授業や試験は変わっている可能性がある。"
      ko: "모든 리뷰가 2021년 이전 것이라 지금 수업과 시험은 달라졌을 수 있다."
      vi: "Tất cả đánh giá đều từ năm 2021 trở về trước; cách dạy và thi có thể đã thay đổi."
      ms: "Semua ulasan ini dari 2021 atau lebih awal; pengajaran dan peperiksaan mungkin telah berubah."
      id: "Semua ulasan ini dari 2021 atau sebelumnya; pengajaran dan ujian mungkin sudah berubah."
      hi: "ये सभी रिव्यू 2021 या उससे पहले के हैं; पढ़ाई और परीक्षा अब बदल चुकी हो सकती है।"
