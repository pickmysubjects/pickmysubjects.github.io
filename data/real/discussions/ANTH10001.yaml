code: ANTH10001
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/anth10001
reviews: 5
from: 2015
to: 2020
checked: 2026-10-17
points:
  - en: "A decent introduction to anthropology with an enthusiastic lecturer, though some found lectures long or hard to connect to the point."
    zh: "不错的人类学入门课，讲师很有热情，但有人觉得讲座太长或抓不住重点。"
    zh-TW: "不錯的人類學入門課，講師很有熱情，但有人覺得講課太長或抓不到重點。"
    ja: "講師が熱心な、まずまずの人類学入門。ただ講義が長い、要点がつかみにくいと感じた人もいる。"
    ko: "강사가 열정적인 괜찮은 인류학 입문. 다만 강의가 길거나 요점을 잡기 어렵다는 의견도 있음."
    vi: "Môn nhập môn nhân học khá ổn với giảng viên nhiệt tình, dù vài người thấy bài giảng dài hoặc khó nắm ý."
    ms: "Pengenalan antropologi yang baik dengan pensyarah yang bersemangat, walaupun ada yang rasa kuliah panjang atau sukar dikaitkan."
    id: "Pengantar antropologi yang lumayan dengan dosen yang bersemangat, meski ada yang merasa kuliahnya panjang atau sulit ditangkap intinya."
    hi: "एंथ्रोपोलॉजी का ठीक-ठाक परिचय, लेक्चरर उत्साही हैं, हालाँकि कुछ को लेक्चर लंबे या मुद्दे से भटके लगे।"
  - en: "Tutorials are built on the readings, and several said they were poorly structured. Assignments were described as vague and harshly marked, while the quiz was easy."
    zh: "辅导课以阅读材料为基础，好几人说组织得不好。作业被形容为要求模糊、评分严格，测验则很简单。"
    zh-TW: "輔導課以閱讀材料為基礎，好幾人說組織得不好。作業被形容為要求模糊、評分嚴格，測驗則很簡單。"
    ja: "チュートリアルは読み物が前提で、構成がよくないという声が複数。課題は指示があいまいで採点が厳しいとされ、クイズは簡単だった。"
    ko: "튜토리얼은 읽기 자료 기반이며, 구성이 엉성하다는 의견이 여럿. 과제는 지시가 모호하고 채점이 엄격하다는 평이고, 퀴즈는 쉬웠음."
    vi: "Tutorial dựa trên bài đọc, nhiều người nói tổ chức chưa tốt. Bài tập được mô tả là mơ hồ và chấm khắt khe, còn bài quiz thì dễ."
    ms: "Tutorial berasaskan bacaan, dan beberapa orang kata ia kurang tersusun. Tugasan digambarkan kabur dan dimarkah dengan ketat, manakala kuiz mudah."
    id: "Tutorial berbasis bacaan, dan beberapa orang bilang kurang terstruktur. Tugas digambarkan samar dan dinilai ketat, sedangkan kuisnya mudah."
    hi: "ट्यूटोरियल रीडिंग्स पर आधारित हैं, और कई लोगों ने कहा कि ये ठीक से व्यवस्थित नहीं थे। असाइनमेंट अस्पष्ट और सख़्ती से जाँचे गए बताए गए, जबकि क्विज़ आसान था।"
  - en: "Do the readings and plan your essay early: reviewers who did so reached H1 or H2A."
    zh: "做好阅读并提早规划论文：这样做的评论者拿到了H1或H2A。"
    zh-TW: "做好閱讀並提早規劃論文：這樣做的評論者拿到了H1或H2A。"
    ja: "読み物をこなしてエッセイを早めに計画すること。そうした人はH1やH2Aを取っている。"
    ko: "읽기 자료를 하고 에세이를 일찍 계획할 것. 그렇게 한 리뷰어들은 H1이나 H2A를 받음."
    vi: "Hãy đọc bài và lên kế hoạch tiểu luận sớm: những người làm vậy đạt H1 hoặc H2A."
    ms: "Buat bacaan dan rancang esei awal: pengulas yang berbuat begitu mendapat H1 atau H2A."
    id: "Kerjakan bacaan dan rencanakan esai lebih awal: pengulas yang melakukannya mendapat H1 atau H2A."
    hi: "रीडिंग्स करें और निबंध की योजना जल्दी बनाएँ: ऐसा करने वाले रिव्यूअर्स को H1 या H2A मिला।"
sections:
  content:
    - en: "A good introduction to anthropology with interesting content, though some found lectures long, confusing at times or padded with less relevant material."
      zh: "不错的人类学入门，内容有意思；不过有人觉得讲课太长、有时让人困惑，或塞了不太相关的内容。"
      zh-TW: "不錯的人類學入門，內容有意思；不過有人覺得講課太長、有時讓人困惑，或塞了不太相關的內容。"
      ja: "面白い内容の良い人類学入門。ただ講義が長い、時に分かりにくい、関係の薄い話が多いという人も。"
      ko: "흥미로운 내용의 좋은 인류학 입문. 다만 강의가 길고 가끔 헷갈리거나 덜 관련된 내용이 많다는 사람도 있다."
      vi: "Nhập môn nhân học tốt với nội dung thú vị, dù vài người thấy bài giảng dài, đôi khi khó hiểu hoặc lan man."
      ms: "Pengenalan antropologi yang baik dengan kandungan menarik, walaupun ada yang rasa kuliah panjang, kadang mengelirukan atau diisi bahan kurang relevan."
      id: "Pengantar antropologi yang baik dengan materi menarik, meski sebagian merasa kuliah panjang, kadang membingungkan atau berisi hal kurang relevan."
      hi: "रोचक सामग्री के साथ मानवविज्ञान का अच्छा परिचय, हालाँकि कुछ को लेक्चर लंबे, कभी-कभी उलझाऊ या कम प्रासंगिक बातों से भरे लगे।"
  work:
    - en: "Essays, which several found marked harshly and a bit vague, and an easy quiz based on lectures and readings. Start your essay structure at least a week ahead."
      zh: "论文（好几位觉得评分严、要求有点模糊）和一个简单的小测，考讲课和阅读。论文结构至少提前一周开始准备。"
      zh-TW: "論文（好幾位覺得評分嚴、要求有點模糊）和一個簡單的小考，考講課和閱讀。論文架構至少提前一週開始準備。"
      ja: "採点が厳しくややあいまいだという声が複数あるエッセイと、講義とリーディングに基づく簡単なクイズ。エッセイの構成は少なくとも1週間前から準備を。"
      ko: "채점이 엄격하고 다소 모호하다는 평이 여럿인 에세이와, 강의·리딩 기반의 쉬운 퀴즈. 에세이 구조는 최소 일주일 전부터 잡을 것."
      vi: "Bài luận, mà nhiều người thấy chấm khắt khe và hơi mơ hồ, và một quiz dễ dựa trên bài giảng và bài đọc. Lên dàn ý luận trước ít nhất một tuần."
      ms: "Esei, yang beberapa rasa dimarkah ketat dan agak kabur, dan kuiz mudah berdasarkan kuliah dan bacaan. Mula struktur esei sekurang-kurangnya seminggu awal."
      id: "Esai, yang beberapa merasa dinilai ketat dan agak samar, dan kuis mudah berdasarkan kuliah dan bacaan. Mulai kerangka esai minimal seminggu sebelumnya."
      hi: "निबंध, जिन्हें कई ने सख़्ती से और थोड़ा अस्पष्ट जाँचा पाया, और लेक्चर व रीडिंग पर आधारित आसान क्विज़। निबंध की रूपरेखा कम से कम एक हफ़्ता पहले शुरू करें।"
  watch:
    - en: "Tutorials are based on the readings, so do them. Some found tutorials poorly structured."
      zh: "tutorial 完全围绕阅读展开，所以一定要读。也有人觉得 tutorial 组织得不好。"
      zh-TW: "tutorial 完全圍繞閱讀展開，所以一定要讀。也有人覺得 tutorial 組織得不好。"
      ja: "チュートリアルはリーディングに基づくので読んでおくこと。チュートリアルの構成が悪いという人も。"
      ko: "튜토리얼은 리딩 기반이니 꼭 읽을 것. 튜토리얼 구성이 엉성하다는 사람도 있다."
      vi: "Tutorial dựa trên bài đọc, nên hãy đọc. Vài người thấy tutorial tổ chức kém."
      ms: "Tutorial berasaskan bacaan, jadi bacalah. Ada yang rasa tutorial kurang tersusun."
      id: "Tutorial berbasis bacaan, jadi bacalah. Sebagian merasa tutorial kurang terstruktur."
      hi: "ट्यूटोरियल रीडिंग पर आधारित हैं, तो उन्हें पढ़ें। कुछ को ट्यूटोरियल ख़राब ढंग से व्यवस्थित लगे।"
    - en: "All these reviews are from 2020 or earlier; teaching and exams may have changed since."
      zh: "这些评价都是 2020 年或更早的，现在的教法和考试可能已经变了。"
      zh-TW: "這些評價都是 2020 年或更早的，現在的教法和考試可能已經變了。"
      ja: "レビューはすべて2020年以前のもの。授業や試験は変わっている可能性がある。"
      ko: "모든 리뷰가 2020년 이전 것이라 지금 수업과 시험은 달라졌을 수 있다."
      vi: "Tất cả đánh giá đều từ năm 2020 trở về trước; cách dạy và thi có thể đã thay đổi."
      ms: "Semua ulasan ini dari 2020 atau lebih awal; pengajaran dan peperiksaan mungkin telah berubah."
      id: "Semua ulasan ini dari 2020 atau sebelumnya; pengajaran dan ujian mungkin sudah berubah."
      hi: "ये सभी रिव्यू 2020 या उससे पहले के हैं; पढ़ाई और परीक्षा अब बदल चुकी हो सकती है।"
