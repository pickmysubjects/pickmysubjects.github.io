code: ANTH10001
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/anth10001
reviews: 5
from: 2015
to: 2020
checked: 2026-10-17
points:
  - en: "A decent introduction to anthropology with an enthusiastic lecturer, though some found lectures long or hard to connect to the point."
    zh: "不错的人类学入门课，讲师很有热情，但有人觉得讲座太长或抓不住重点。"
    zh-TW: "不錯的人類學入門課，講師很有熱情，但有人覺得講課太長或抓不到重點。"
    ja: "講師が熱心な、まずまずの人類学入門。ただ講義が長い、要点がつかみにくいと感じた人もいる。"
    ko: "강사가 열정적인 괜찮은 인류학 입문. 다만 강의가 길거나 요점을 잡기 어렵다는 의견도 있음."
    vi: "Môn nhập môn nhân học khá ổn với giảng viên nhiệt tình, dù vài người thấy bài giảng dài hoặc khó nắm ý."
    ms: "Pengenalan antropologi yang baik dengan pensyarah yang bersemangat, walaupun ada yang rasa kuliah panjang atau sukar dikaitkan."
    id: "Pengantar antropologi yang lumayan dengan dosen yang bersemangat, meski ada yang merasa kuliahnya panjang atau sulit ditangkap intinya."
    hi: "एंथ्रोपोलॉजी का ठीक-ठाक परिचय, लेक्चरर उत्साही हैं, हालाँकि कुछ को लेक्चर लंबे या मुद्दे से भटके लगे।"
  - en: "Tutorials are built on the readings, and several said they were poorly structured. Assignments were described as vague and harshly marked, while the quiz was easy."
    zh: "辅导课以阅读材料为基础，好几人说组织得不好。作业被形容为要求模糊、评分严格，测验则很简单。"
    zh-TW: "輔導課以閱讀材料為基礎，好幾人說組織得不好。作業被形容為要求模糊、評分嚴格，測驗則很簡單。"
    ja: "チュートリアルは読み物が前提で、構成がよくないという声が複数。課題は指示があいまいで採点が厳しいとされ、クイズは簡単だった。"
    ko: "튜토리얼은 읽기 자료 기반이며, 구성이 엉성하다는 의견이 여럿. 과제는 지시가 모호하고 채점이 엄격하다는 평이고, 퀴즈는 쉬웠음."
    vi: "Tutorial dựa trên bài đọc, nhiều người nói tổ chức chưa tốt. Bài tập được mô tả là mơ hồ và chấm khắt khe, còn bài quiz thì dễ."
    ms: "Tutorial berasaskan bacaan, dan beberapa orang kata ia kurang tersusun. Tugasan digambarkan kabur dan dimarkah dengan ketat, manakala kuiz mudah."
    id: "Tutorial berbasis bacaan, dan beberapa orang bilang kurang terstruktur. Tugas digambarkan samar dan dinilai ketat, sedangkan kuisnya mudah."
    hi: "ट्यूटोरियल रीडिंग्स पर आधारित हैं, और कई लोगों ने कहा कि ये ठीक से व्यवस्थित नहीं थे। असाइनमेंट अस्पष्ट और सख़्ती से जाँचे गए बताए गए, जबकि क्विज़ आसान था।"
  - en: "Do the readings and plan your essay early: reviewers who did so reached H1 or H2A."
    zh: "做好阅读并提早规划论文：这样做的评论者拿到了H1或H2A。"
    zh-TW: "做好閱讀並提早規劃論文：這樣做的評論者拿到了H1或H2A。"
    ja: "読み物をこなしてエッセイを早めに計画すること。そうした人はH1やH2Aを取っている。"
    ko: "읽기 자료를 하고 에세이를 일찍 계획할 것. 그렇게 한 리뷰어들은 H1이나 H2A를 받음."
    vi: "Hãy đọc bài và lên kế hoạch tiểu luận sớm: những người làm vậy đạt H1 hoặc H2A."
    ms: "Buat bacaan dan rancang esei awal: pengulas yang berbuat begitu mendapat H1 atau H2A."
    id: "Kerjakan bacaan dan rencanakan esai lebih awal: pengulas yang melakukannya mendapat H1 atau H2A."
    hi: "रीडिंग्स करें और निबंध की योजना जल्दी बनाएँ: ऐसा करने वाले रिव्यूअर्स को H1 या H2A मिला।"
