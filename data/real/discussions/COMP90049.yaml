points:
  - en: "An introduction to machine learning and information retrieval. Reviewers found it interesting and useful for data science."
    zh: "入门机器学习和信息检索，评价认为有趣且对数据科学方向有用。"
    zh-TW: "機器學習和資訊檢索的入門。評論者覺得有趣，對資料科學也很有用。"
    ja: "機械学習と情報検索の入門。面白く、データサイエンスに役立つという評価。"
    ko: "머신러닝과 정보 검색 입문이다. 흥미롭고 데이터 과학에 유용하다는 평이다."
    vi: "Nhập môn học máy và truy xuất thông tin. Người đánh giá thấy thú vị và hữu ích cho khoa học dữ liệu."
    ms: "Pengenalan kepada pembelajaran mesin dan dapatan semula maklumat. Pengulas dapati ia menarik dan berguna untuk sains data."
    id: "Pengantar machine learning dan temu kembali informasi. Pengulas merasa menarik dan berguna untuk data science."
    hi: "मशीन लर्निंग और इन्फ़ॉर्मेशन रिट्रीवल का परिचय। रिव्यूअर्स को यह दिलचस्प और डेटा साइंस के लिए उपयोगी लगा।"
  - en: "Lectures are compact and dense, so expect to invest a lot of your own time. Tutorials were helpful."
    zh: "讲座紧凑、信息密集，需要投入大量课外时间；辅导课有帮助。"
    zh-TW: "講課精簡又密集，要投入很多自己的時間。輔導課有幫助。"
    ja: "講義はコンパクトで密度が高いので、自習時間をかなり取る必要がある。チュートリアルは役立った。"
    ko: "강의가 압축적이고 빽빽해서 개인 시간을 많이 투자해야 한다. 튜토리얼은 도움이 됐다."
    vi: "Bài giảng ngắn gọn và dày đặc, nên cần dành nhiều thời gian tự học. Tutorial thì hữu ích."
    ms: "Kuliah padat dan ringkas, jadi bersedia melaburkan banyak masa sendiri. Tutorial membantu."
    id: "Kuliahnya ringkas dan padat, jadi siap investasi banyak waktu sendiri. Tutorial membantu."
    hi: "लेक्चर छोटे और घने हैं, इसलिए अपना काफ़ी समय लगाने के लिए तैयार रहें। ट्यूटोरियल मददगार थे।"
  - en: "Projects are self-directed with loose instructions, and the final exam is tough to finish in time."
    zh: "项目自主性强、要求说明较宽泛，期末考试难以在规定时间内完成。"
    zh-TW: "專題自主性高、說明寬鬆，期末考很難在時間內寫完。"
    ja: "プロジェクトは自主性が高く指示もゆるい。期末試験は時間内に終えるのが難しい。"
    ko: "프로젝트는 자기 주도적이고 안내가 느슨하며, 기말시험은 시간 안에 끝내기 어렵다."
    vi: "Project mang tính tự định hướng với hướng dẫn lỏng lẻo, và bài thi cuối khó làm kịp giờ."
    ms: "Projek berbentuk kendiri dengan arahan longgar, dan peperiksaan akhir sukar disiapkan dalam masa."
    id: "Proyeknya mandiri dengan instruksi longgar, dan ujian akhirnya sulit diselesaikan tepat waktu."
    hi: "प्रोजेक्ट स्व-निर्देशित हैं और निर्देश ढीले हैं, और फ़ाइनल परीक्षा समय में पूरी करना मुश्किल है।"
workload: heavy
difficulty: hard
