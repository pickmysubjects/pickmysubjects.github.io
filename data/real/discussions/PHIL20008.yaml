points:
  - en: "Reviewers from 2017 to 2025 say it gives a strong foundation in ethical theory through Aristotle, Kant and Mill."
    zh: "2017到2025年的评论者都说它通过亚里士多德、康德和密尔打下了扎实的伦理学理论基础。"
    zh-TW: "2017到2025年的評論者都說它透過亞里斯多德、康德和彌爾打下了紮實的倫理學理論基礎。"
    ja: "2017〜2025年のレビューでは、アリストテレス、カント、ミルを通して倫理学理論の確かな土台が築けるとのこと。"
    ko: "2017~2025년 리뷰어들은 아리스토텔레스, 칸트, 밀을 통해 윤리 이론의 탄탄한 기초를 쌓는다고 함."
    vi: "Người đánh giá từ 2017 đến 2025 nói môn này cho nền tảng vững về lý thuyết đạo đức qua Aristotle, Kant và Mill."
    ms: "Pengulas dari 2017 hingga 2025 kata ia memberi asas kukuh dalam teori etika melalui Aristotle, Kant dan Mill."
    id: "Pengulas 2017-2025 bilang mata kuliah ini memberi fondasi kuat teori etika lewat Aristoteles, Kant, dan Mill."
    hi: "2017 से 2025 तक के रिव्यूअर्स के अनुसार यह अरस्तू, कांट और मिल के ज़रिए नैतिक सिद्धांत की मज़बूत नींव देता है।"
  - en: "It is quite theoretical, with few real-world dilemmas; lectures are easy to follow and doing well is realistic if you keep up."
    zh: "内容偏理论，现实伦理难题较少；讲座容易跟上，只要跟上进度就能考好。"
    zh-TW: "內容偏理論，現實倫理難題較少；講課容易跟上，只要跟上進度就能考好。"
    ja: "かなり理論寄りで、現実のジレンマは少なめ。講義はわかりやすく、ついていけば良い成績は現実的。"
    ko: "꽤 이론적이고 현실 딜레마는 적음. 강의는 따라가기 쉽고, 꾸준히 하면 좋은 성적이 현실적."
    vi: "Khá nặng lý thuyết, ít tình huống thực tế; bài giảng dễ theo và theo kịp thì đạt điểm tốt là khả thi."
    ms: "Ia agak teori, dengan sedikit dilema dunia sebenar; kuliah mudah diikuti dan berjaya adalah realistik jika anda ikut rentak."
    id: "Cukup teoretis, sedikit dilema dunia nyata; kuliahnya mudah diikuti dan nilai bagus realistis kalau kamu mengikuti."
    hi: "यह काफ़ी सैद्धांतिक है, असल ज़िंदगी की दुविधाएँ कम हैं; लेक्चर समझने में आसान हैं और साथ चलें तो अच्छा करना संभव है।"
