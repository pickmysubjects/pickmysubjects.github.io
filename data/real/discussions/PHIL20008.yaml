reviews: 5
from: 2017
to: 2025
checked: 2026-10-17
points:
  - en: "Reviewers from 2017 to 2025 say it gives a strong foundation in ethical theory through Aristotle, Kant and Mill."
    zh: "2017到2025年的评论者都说它通过亚里士多德、康德和密尔打下了扎实的伦理学理论基础。"
    zh-TW: "2017到2025年的評論者都說它透過亞里斯多德、康德和彌爾打下了紮實的倫理學理論基礎。"
    ja: "2017〜2025年のレビューでは、アリストテレス、カント、ミルを通して倫理学理論の確かな土台が築けるとのこと。"
    ko: "2017~2025년 리뷰어들은 아리스토텔레스, 칸트, 밀을 통해 윤리 이론의 탄탄한 기초를 쌓는다고 함."
    vi: "Người đánh giá từ 2017 đến 2025 nói môn này cho nền tảng vững về lý thuyết đạo đức qua Aristotle, Kant và Mill."
    ms: "Pengulas dari 2017 hingga 2025 kata ia memberi asas kukuh dalam teori etika melalui Aristotle, Kant dan Mill."
    id: "Pengulas 2017-2025 bilang mata kuliah ini memberi fondasi kuat teori etika lewat Aristoteles, Kant, dan Mill."
    hi: "2017 से 2025 तक के रिव्यूअर्स के अनुसार यह अरस्तू, कांट और मिल के ज़रिए नैतिक सिद्धांत की मज़बूत नींव देता है।"
  - en: "It is quite theoretical, with few real-world dilemmas; lectures are easy to follow and doing well is realistic if you keep up."
    zh: "内容偏理论，现实伦理难题较少；讲座容易跟上，只要跟上进度就能考好。"
    zh-TW: "內容偏理論，現實倫理難題較少；講課容易跟上，只要跟上進度就能考好。"
    ja: "かなり理論寄りで、現実のジレンマは少なめ。講義はわかりやすく、ついていけば良い成績は現実的。"
    ko: "꽤 이론적이고 현실 딜레마는 적음. 강의는 따라가기 쉽고, 꾸준히 하면 좋은 성적이 현실적."
    vi: "Khá nặng lý thuyết, ít tình huống thực tế; bài giảng dễ theo và theo kịp thì đạt điểm tốt là khả thi."
    ms: "Ia agak teori, dengan sedikit dilema dunia sebenar; kuliah mudah diikuti dan berjaya adalah realistik jika anda ikut rentak."
    id: "Cukup teoretis, sedikit dilema dunia nyata; kuliahnya mudah diikuti dan nilai bagus realistis kalau kamu mengikuti."
    hi: "यह काफ़ी सैद्धांतिक है, असल ज़िंदगी की दुविधाएँ कम हैं; लेक्चर समझने में आसान हैं और साथ चलें तो अच्छा करना संभव है।"
sections:
  content:
    - en: "Normative ethics through virtue ethics, deontology and consequentialism, using Aristotle, Kant and Mill plus contemporary papers. Most reviewers found it a strong, engaging foundation."
      zh: "讲规范伦理学：德性伦理、义务论和后果主义，读亚里士多德、康德和密尔，加上当代论文。多数同学觉得打下了扎实又有趣的基础。"
      zh-TW: "講規範倫理學：德性倫理、義務論和效益主義，讀亞里斯多德、康德和彌爾，加上當代論文。多數同學覺得打下了紮實又有趣的基礎。"
      ja: "徳倫理・義務論・帰結主義を通じた規範倫理学で、アリストテレス、カント、ミルと現代の論文を読む。しっかりした面白い土台になるという声が多い。"
      ko: "덕 윤리, 의무론, 결과주의를 통한 규범 윤리학으로 아리스토텔레스, 칸트, 밀과 현대 논문을 읽는다. 탄탄하고 흥미로운 기초라는 평이 많다."
      vi: "Đạo đức học chuẩn tắc qua đạo đức đức hạnh, nghĩa vụ luận và hệ quả luận, đọc Aristotle, Kant, Mill và bài báo hiện đại. Đa số thấy là nền tảng vững và cuốn hút."
      ms: "Etika normatif melalui etika kebaikan, deontologi dan konsekuensialisme, menggunakan Aristotle, Kant dan Mill serta kertas kontemporari. Kebanyakan rasa asas yang kukuh dan menarik."
      id: "Etika normatif lewat etika keutamaan, deontologi dan konsekuensialisme, dengan Aristoteles, Kant dan Mill plus makalah kontemporer. Sebagian besar merasa fondasi yang kuat dan menarik."
      hi: "सद्गुण नैतिकता, कर्तव्यवाद और परिणामवाद के ज़रिए मानक नैतिकता, अरस्तू, कांट और मिल के साथ आधुनिक शोधपत्र। ज़्यादातर को यह मज़बूत और दिलचस्प नींव लगी।"
  work:
    - en: "Reviewers call the assessments fair and say it's not hard to do well if you keep up."
      zh: "同学说考核公平，只要跟上进度就不难考好。"
      zh-TW: "同學說考核公平，只要跟上進度就不難考好。"
      ja: "評価は公平で、ついていけば良い成績を取るのは難しくないという。"
      ko: "평가는 공정하고, 따라가기만 하면 잘하기 어렵지 않다는 평."
      vi: "Người học nói bài đánh giá công bằng và theo kịp thì không khó để làm tốt."
      ms: "Pengulas kata penilaian adil dan tidak sukar berjaya jika anda ikuti."
      id: "Pengulas bilang penilaiannya adil dan tidak sulit berhasil jika terus mengikuti."
      hi: "रिव्यूअर्स कहते हैं आकलन उचित हैं और साथ बने रहें तो अच्छा करना कठिन नहीं।"
  watch:
    - en: "Some wanted more real-life dilemmas. The 2025 reviewer says metaethics and applied ethics aren't covered, lectures are compulsory with participation, and the two kinds of tutorial are optional."
      zh: "有人希望多讲现实中的伦理困境。2025 年的同学说不涉及元伦理和应用伦理；讲课必须出席、要互动，两种 tutorial 则是选修的。"
      zh-TW: "有人希望多講現實中的倫理困境。2025 年的同學說不涉及後設倫理和應用倫理；講課必須出席、要互動，兩種 tutorial 則是自由參加。"
      ja: "現実の倫理的ジレンマをもっと扱ってほしいという声も。2025年のレビューによると、メタ倫理と応用倫理は扱わず、講義は出席必須で参加型、2種類のチュートリアルは任意。"
      ko: "현실 윤리 딜레마를 더 원한 사람도 있다. 2025년 리뷰에 따르면 메타윤리와 응용윤리는 다루지 않고, 강의는 출석 필수에 참여형이며 두 종류 튜토리얼은 선택이다."
      vi: "Vài người muốn nhiều tình huống thực tế hơn. Người năm 2025 nói không học siêu đạo đức và đạo đức ứng dụng, bài giảng bắt buộc có tương tác, còn hai loại tutorial là tùy chọn."
      ms: "Ada yang mahu lebih dilema kehidupan sebenar. Pengulas 2025 kata metaetika dan etika gunaan tidak diliputi, kuliah wajib dengan penyertaan, dan dua jenis tutorial adalah pilihan."
      id: "Sebagian ingin lebih banyak dilema nyata. Pengulas 2025 bilang metaetika dan etika terapan tidak dibahas, kuliah wajib dengan partisipasi, dan dua jenis tutorial bersifat opsional."
      hi: "कुछ असल ज़िंदगी की दुविधाएँ ज़्यादा चाहते थे। 2025 का रिव्यूअर कहता है मेटाएथिक्स और एप्लाइड एथिक्स शामिल नहीं, लेक्चर अनिवार्य और भागीदारी वाले हैं, और दोनों तरह के ट्यूटोरियल वैकल्पिक।"
difficulty: easy
