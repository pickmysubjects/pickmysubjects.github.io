points:
  - en: "Same format as Japanese 1 but a step up in grammar; easy to score well if you revise consistently."
    zh: "形式与日语1相同，但语法更难；坚持复习就容易拿高分。"
    zh-TW: "形式與日文1相同，但文法更難；持續複習就容易拿高分。"
    ja: "日本語1と同じ形式だが文法は一段上。継続して復習すれば高得点は取りやすい。"
    ko: "일본어 1과 형식은 같지만 문법이 한 단계 어렵다. 꾸준히 복습하면 좋은 점수를 받기 쉽다."
    vi: "Cùng hình thức với Japanese 1 nhưng ngữ pháp khó hơn; ôn đều thì dễ đạt điểm cao."
    ms: "Format sama seperti Japanese 1 tetapi tatabahasa lebih tinggi; mudah dapat markah baik jika rajin mengulang kaji."
    id: "Format sama dengan Japanese 1 tapi tata bahasanya naik level; mudah dapat nilai bagus kalau rutin mengulang."
    hi: "Japanese 1 जैसा फॉर्मेट, पर ग्रामर एक लेवल ऊपर; लगातार रिवीज़न करें तो अच्छे मार्क्स आसान हैं।"
  - en: "Keep on top of kanji and grammar for the regular quizzes, and the exam becomes much easier."
    zh: "跟上汉字和语法以应对定期小测，考试会轻松很多。"
    zh-TW: "跟上漢字和文法來應付定期小考，考試會輕鬆很多。"
    ja: "定期小テストに向けて漢字と文法をしっかり押さえておけば、試験はずっと楽になる。"
    ko: "정기 퀴즈를 위해 한자와 문법을 꾸준히 챙기면 시험이 훨씬 쉬워진다."
    vi: "Nắm vững kanji và ngữ pháp cho các quiz định kỳ thì kỳ thi sẽ dễ hơn nhiều."
    ms: "Kuasai kanji dan tatabahasa untuk kuiz berkala, dan peperiksaan jadi lebih mudah."
    id: "Kuasai kanji dan tata bahasa untuk kuis rutin, maka ujiannya jauh lebih mudah."
    hi: "रेगुलर क्विज़ के लिए कांजी और ग्रामर पर पकड़ रखें, तो एग्ज़ाम काफ़ी आसान हो जाता है।"
  - en: "Some reviewers felt it was poorly coordinated, though most found tutors engaging."
    zh: "有评价认为课程协调欠佳，但多数人觉得辅导老师很投入。"
    zh-TW: "有評價認為課程協調不佳，但多數人覺得助教很投入。"
    ja: "運営がまずいと感じた人もいるが、多くはチューターが熱心だと感じた。"
    ko: "운영이 미흡했다는 후기도 있지만, 대부분은 튜터가 적극적이었다고 했다."
    vi: "Một số cho rằng môn điều phối kém, dù đa số thấy tutor nhiệt tình."
    ms: "Sesetengah rasa ia kurang diselaraskan, walaupun kebanyakan dapati tutor menarik."
    id: "Sebagian merasa koordinasinya kurang, meski kebanyakan menilai tutornya menarik."
    hi: "कुछ को कोऑर्डिनेशन कमज़ोर लगा, पर ज़्यादातर को ट्यूटर्स दिलचस्प लगे।"
