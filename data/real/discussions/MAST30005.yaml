points:
  - en: "Very abstract, with few obvious real-world uses. It continues from second-year group theory and linear algebra into rings and modules."
    zh: "非常抽象，现实应用不明显，延续二年级群论与线性代数，讲环和模。"
    zh-TW: "非常抽象，實際應用不明顯，延續二年級群論與線性代數，講環和模。"
    ja: "非常に抽象的で、現実での用途は見えにくい。2年次の群論と線形代数から環と加群へ進む。"
    ko: "매우 추상적이고 실생활 활용이 잘 보이지 않는다. 2학년 군론과 선형대수에서 환과 가군으로 이어진다."
    vi: "Rất trừu tượng, ít ứng dụng thực tế rõ ràng. Tiếp nối lý thuyết nhóm và đại số tuyến tính năm hai, sang vành và môđun."
    ms: "Sangat abstrak, dengan sedikit kegunaan dunia sebenar yang jelas. Ia menyambung teori kumpulan dan algebra linear tahun dua ke gelanggang dan modul."
    id: "Sangat abstrak, sedikit penerapan nyata yang jelas. Melanjutkan teori grup dan aljabar linear tahun kedua ke ring dan modul."
    hi: "बहुत एब्स्ट्रैक्ट, असल दुनिया में इस्तेमाल कम दिखता है। सेकंड-ईयर ग्रुप थ्योरी और लीनियर अलजेब्रा से आगे रिंग्स और मॉड्यूल्स तक जाता है।"
  - en: "Pure maths students mostly loved it, and several called it a favourite."
    zh: "纯数学学生普遍很喜欢，多人称是最爱的数学课。"
    zh-TW: "純數學生大多很喜歡，好幾位說是最愛。"
    ja: "純粋数学の学生にはおおむね大好評で、お気に入りに挙げる人も複数いる。"
    ko: "순수수학 학생들은 대부분 좋아했고, 최애 과목으로 꼽은 사람도 여럿이다."
    vi: "Sinh viên toán thuần túy phần lớn rất thích, vài người gọi đây là môn yêu thích."
    ms: "Pelajar matematik tulen kebanyakannya suka, dan beberapa menyebutnya kegemaran."
    id: "Mahasiswa matematika murni kebanyakan menyukainya, beberapa menyebutnya favorit."
    hi: "प्योर मैथ्स के छात्रों को ज़्यादातर बहुत पसंद आया, कई ने इसे फ़ेवरेट बताया।"
