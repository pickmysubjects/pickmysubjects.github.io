source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/crim30010
reviews: 3
from: 2016
to: 2021
checked: 2026-10-17
points:
  - en: "Reviews from 2016 to 2021 found it relevant and rooted in real-world examples, with well-chosen readings, though the 2019 and 2021 reviewers felt the same themes and essay topics became repetitive."
    zh: "2016到2021年的评论认为课程贴近现实、例子真实、阅读材料选得好；但2019和2021年的评论者觉得主题和论文题目重复较多。"
    zh-TW: "2016到2021年的評論認為課程貼近現實、例子真實、閱讀材料選得好；但2019和2021年的評論者覺得主題和論文題目重複較多。"
    ja: "2016〜2021年のレビューでは、現実の事例に根ざした内容と良い文献が評価された。ただ2019年と2021年の評者は、同じテーマやエッセイ課題の繰り返しが多いと感じた。"
    ko: "2016~2021년 리뷰는 실제 사례에 기반한 내용과 잘 고른 읽기 자료를 칭찬함. 다만 2019년과 2021년 리뷰어는 같은 주제와 에세이 주제가 반복된다고 느낌."
    vi: "Đánh giá từ 2016 đến 2021 thấy môn sát thực tế, có ví dụ thật và bài đọc chọn tốt, nhưng người viết năm 2019 và 2021 thấy chủ đề và đề luận lặp lại nhiều."
    ms: "Ulasan dari 2016 hingga 2021 mendapatinya relevan dan berasaskan contoh dunia sebenar dengan bacaan yang dipilih baik, tetapi pengulas 2019 dan 2021 rasa tema dan topik esei berulang-ulang."
    id: "Ulasan 2016 sampai 2021 menilainya relevan dan berakar pada contoh nyata dengan bacaan pilihan yang bagus, tapi pengulas 2019 dan 2021 merasa tema dan topik esainya berulang."
    hi: "2016 से 2021 के रिव्यूज़ ने इसे प्रासंगिक, असली उदाहरणों पर आधारित और अच्छी रीडिंग्स वाला बताया, पर 2019 और 2021 के रिव्यूअर्स को विषय और निबंध टॉपिक दोहराव भरे लगे।"
  - en: "Theory from the second-year punishment subject (such as Foucault and Garland) comes in handy. The essay topics look hard, so talk your plan through with your tutor first."
    zh: "二年级惩罚相关课程学过的理论（如福柯、Garland）会很有用。论文题目看起来难，建议先和导师讨论写作思路。"
    zh-TW: "二年級懲罰相關課程學過的理論（如傅柯、Garland）會很有用。論文題目看起來難，建議先和導師討論寫作思路。"
    ja: "2年次の刑罰系科目で学んだ理論（フーコーやガーランドなど）が役立つ。エッセイ課題は難しく見えるので、先にチューターと構成を相談するとよい。"
    ko: "2학년 형벌 관련 과목에서 배운 이론(푸코, 갈랜드 등)이 도움이 됨. 에세이 주제가 어려워 보이니 먼저 튜터와 계획을 상의하는 것이 좋음."
    vi: "Lý thuyết từ môn về hình phạt năm hai (như Foucault, Garland) rất hữu ích. Đề luận trông khó, nên bàn dàn ý với tutor trước."
    ms: "Teori daripada subjek hukuman tahun kedua (seperti Foucault dan Garland) sangat berguna. Topik esei nampak sukar, jadi bincangkan rancangan anda dengan tutor dahulu."
    id: "Teori dari mata kuliah hukuman tahun kedua (seperti Foucault dan Garland) sangat berguna. Topik esainya terlihat sulit, jadi diskusikan rencanamu dengan tutor dulu."
    hi: "दूसरे साल के सज़ा वाले सब्जेक्ट का सिद्धांत (जैसे फूको और गारलैंड) काम आता है। निबंध के टॉपिक कठिन लगते हैं, इसलिए पहले ट्यूटर से अपनी योजना पर बात करें।"
