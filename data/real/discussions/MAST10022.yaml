points:
  - en: "Rigorous and proof-heavy; well suited to aspiring maths majors who want a challenge."
    zh: "严谨且证明多，适合想挑战自己的数学专业预备生。"
    zh-TW: "嚴謹且證明多，適合想挑戰自己、打算主修數學的學生。"
    ja: "厳密で証明が多い。挑戦したい数学専攻志望者に向いている。"
    ko: "엄밀하고 증명이 많다. 도전을 원하는 수학 전공 지망생에게 잘 맞는다."
    vi: "Chặt chẽ và nhiều chứng minh; hợp với ai định học chuyên ngành toán và thích thử thách."
    ms: "Ketat dan banyak bukti; sesuai untuk bakal pelajar major matematik yang mahu cabaran."
    id: "Ketat dan banyak pembuktian; cocok untuk calon jurusan matematika yang suka tantangan."
    hi: "सख़्त और प्रूफ़ से भरा; चुनौती चाहने वाले भावी मैथ्स मेजर के लिए सही।"
  - en: "Lecture notes with many exercises are a key resource; do all of them."
    zh: "附大量练习的讲义是核心资源，建议全部做完。"
    zh-TW: "附大量練習的講義是核心資源，建議全部做完。"
    ja: "演習が豊富な講義ノートが重要な教材。すべて解こう。"
    ko: "연습 문제가 많은 강의 노트가 핵심 자료다. 전부 풀자."
    vi: "Bài giảng kèm nhiều bài tập là tài liệu chính; hãy làm hết."
    ms: "Nota kuliah dengan banyak latihan ialah sumber utama; buat semuanya."
    id: "Catatan kuliah dengan banyak latihan adalah sumber utama; kerjakan semuanya."
    hi: "ढेर सारी एक्सरसाइज़ वाले लेक्चर नोट्स मुख्य रिसोर्स हैं; सभी करें।"
  - en: "Assignments are hard but good exam prep; start early. The MST is easier than the final."
    zh: "作业难但对备考很有帮助，要尽早开始；期中测验比期末简单。"
    zh-TW: "作業難但對準備考試很有幫助，要及早開始；期中考比期末簡單。"
    ja: "課題は難しいが試験対策に最適。早めに始めよう。MSTは期末より易しい。"
    ko: "과제는 어렵지만 시험 대비에 좋다. 일찍 시작하자. MST는 기말보다 쉽다."
    vi: "Bài tập khó nhưng giúp ôn thi tốt; bắt đầu sớm. MST dễ hơn thi cuối kỳ."
    ms: "Tugasan sukar tetapi persediaan peperiksaan yang baik; mula awal. MST lebih mudah daripada akhir."
    id: "Tugasnya sulit tapi bagus untuk persiapan ujian; mulai lebih awal. MST lebih mudah dari ujian akhir."
    hi: "असाइनमेंट कठिन पर एग्ज़ाम की अच्छी तैयारी; जल्दी शुरू करें। MST फ़ाइनल से आसान है।"
  - en: "Highly sequential, so never fall behind in lectures."
    zh: "内容环环相扣，讲课绝不能落下。"
    zh-TW: "內容環環相扣，上課絕不能落後。"
    ja: "内容が積み上げ式なので、講義に遅れないこと。"
    ko: "내용이 순차적으로 이어지니 강의에서 절대 뒤처지지 말자."
    vi: "Kiến thức nối tiếp nhau chặt chẽ, nên đừng bao giờ bị tụt bài giảng."
    ms: "Sangat berturutan, jadi jangan sekali-kali ketinggalan kuliah."
    id: "Materinya sangat berurutan, jadi jangan pernah tertinggal kuliah."
    hi: "कंटेंट एक-दूसरे पर टिका है, तो लेक्चर में कभी पीछे न रहें।"
sections:
  content:
    - en: "A rigorous, proof-heavy first taste of higher maths, well past Specialist Maths. Most reviewers loved it and recommend it to anyone planning a maths or stats major."
      zh: "严谨、重证明，是第一次接触真正的大学数学，远超 Specialist Maths。多数同学很喜欢，推荐给打算主修数学或统计的人。"
      zh-TW: "嚴謹、重證明，是第一次接觸真正的大學數學，遠超 Specialist Maths。多數同學很喜歡，推薦給打算主修數學或統計的人。"
      ja: "厳密で証明中心、Specialist Mathsをはるかに超える本格的な数学の入口。多くが気に入っていて、数学・統計専攻予定の人に勧めている。"
      ko: "엄밀하고 증명 위주로, Specialist Maths를 훨씬 넘는 대학 수학의 첫 경험. 대부분 매우 좋아했고 수학·통계 전공 예정자에게 추천한다."
      vi: "Lần đầu tiếp xúc toán cao cấp chặt chẽ, nặng chứng minh, vượt xa Specialist Maths. Đa số rất thích và khuyên ai định học ngành toán hoặc thống kê."
      ms: "Pengenalan pertama kepada matematik tinggi yang rapi dan banyak pembuktian, jauh melebihi Specialist Maths. Kebanyakan suka dan syorkan untuk bakal major matematik atau statistik."
      id: "Pengalaman pertama matematika tingkat lanjut yang ketat dan banyak pembuktian, jauh di atas Specialist Maths. Sebagian besar suka dan menyarankan bagi calon jurusan matematika atau statistik."
      hi: "उच्च गणित का पहला कठोर, प्रूफ़-भरा अनुभव, Specialist Maths से कहीं आगे। ज़्यादातर को बहुत पसंद आया और वे गणित या स्टैट्स मेजर की योजना वालों को सुझाते हैं।"
  work:
    - en: "Four assignments, hard but good exam practice, with about two weeks each. The MST and MATLAB parts felt easier; the final mixes computation with harder proofs (one guessed 30–40%)."
      zh: "四个作业，难但很好地帮你备考，每个约有两周时间。MST 和 MATLAB 部分比较轻松；期末有计算题也有较难的证明题（有人估计占 30–40%）。"
      zh-TW: "四份作業，難但很能幫你備考，每份約有兩週時間。MST 和 MATLAB 部分比較輕鬆；期末有計算題也有較難的證明題（有人估計占 30–40%）。"
      ja: "課題は4つで難しいが試験対策に良く、各約2週間ある。MSTとMATLABは楽な方で、期末は計算問題と難しめの証明問題の混合（3〜4割と推測する人も）。"
      ko: "과제 4개, 어렵지만 시험 대비에 좋고 각각 약 2주가 주어진다. MST와 MATLAB은 쉬운 편이고, 기말은 계산과 더 어려운 증명이 섞여 있다(30–40%로 본 사람도)."
      vi: "Bốn bài tập, khó nhưng luyện thi tốt, mỗi bài khoảng hai tuần. MST và phần MATLAB dễ hơn; bài thi cuối pha tính toán và chứng minh khó hơn (một người đoán 30–40%)."
      ms: "Empat tugasan, sukar tetapi latihan baik untuk peperiksaan, kira-kira dua minggu setiap satu. MST dan MATLAB lebih mudah; peperiksaan akhir campur pengiraan dan pembuktian lebih sukar (seorang anggar 30–40%)."
      id: "Empat tugas, sulit tapi latihan ujian yang bagus, masing-masing sekitar dua minggu. MST dan MATLAB lebih mudah; ujian akhir campuran hitungan dan pembuktian lebih sulit (satu orang menebak 30–40%)."
      hi: "चार असाइनमेंट, कठिन पर परीक्षा की अच्छी तैयारी, हर एक के लिए करीब दो हफ़्ते। MST और MATLAB आसान लगे; फ़ाइनल में गणना और कठिन प्रूफ़ मिले हैं (एक ने 30–40% अंदाज़ा लगाया)।"
  study:
    - en: "Do every question in the lecture notes, start assignments as soon as they're out, and never fall behind, since each topic builds on the last."
      zh: "把讲义里的题都做一遍，作业一发就开始写，千万别落下进度，因为每部分都建立在前面基础上。"
      zh-TW: "把講義裡的題目都做一遍，作業一發就開始寫，千萬別落後進度，因為每部分都建立在前面基礎上。"
      ja: "講義ノートの問題を全部解き、課題は出たらすぐ始め、絶対に遅れないこと。各単元が前の内容の上に積み上がるため。"
      ko: "강의 노트 문제를 전부 풀고, 과제는 나오자마자 시작하고, 절대 뒤처지지 말 것. 각 단원이 앞 내용 위에 쌓인다."
      vi: "Làm hết câu hỏi trong tài liệu bài giảng, bắt đầu bài tập ngay khi phát, và đừng bao giờ bị tụt lại vì mỗi phần xây trên phần trước."
      ms: "Buat semua soalan dalam nota kuliah, mula tugasan sebaik dikeluarkan, dan jangan ketinggalan kerana setiap topik dibina atas yang sebelumnya."
      id: "Kerjakan semua soal di catatan kuliah, mulai tugas begitu keluar, dan jangan pernah tertinggal karena tiap topik dibangun di atas yang sebelumnya."
      hi: "लेक्चर नोट्स के सारे सवाल करें, असाइनमेंट आते ही शुरू करें, और कभी पीछे न रहें, क्योंकि हर विषय पिछले पर टिका है।"
  watch:
    - en: "The lecturer changed in 2025, and one 2024 reviewer strongly disliked the teaching while others loved it, so older comments about lectures may not apply."
      zh: "2025 年换了 lecturer；一位 2024 年的同学很不喜欢当时的教学，其他人却很喜欢，所以旧评价里关于讲课的部分可能不适用了。"
      zh-TW: "2025 年換了 lecturer；一位 2024 年的同學很不喜歡當時的教學，其他人卻很喜歡，所以舊評價裡關於講課的部分可能不適用了。"
      ja: "2025年に講師が交代。2024年には教え方を強く嫌った人が一人いた一方で絶賛する人も多く、古い講義の感想は当てはまらないかもしれない。"
      ko: "2025년에 강사가 바뀌었다. 2024년 한 리뷰는 수업을 매우 싫어했지만 다른 이들은 좋아했으니, 예전 강의 평은 지금과 다를 수 있다."
      vi: "Giảng viên đổi năm 2025; một người năm 2024 rất không thích cách dạy trong khi người khác rất thích, nên nhận xét cũ về bài giảng có thể không còn đúng."
      ms: "Pensyarah bertukar pada 2025; seorang pengulas 2024 sangat tidak suka pengajaran manakala yang lain suka, jadi komen lama tentang kuliah mungkin tidak terpakai."
      id: "Dosen berganti pada 2025; satu pengulas 2024 sangat tidak suka pengajarannya sementara yang lain suka, jadi komentar lama soal kuliah mungkin tak berlaku lagi."
      hi: "2025 में लेक्चरर बदल गए; 2024 के एक रिव्यूअर को पढ़ाना बिल्कुल पसंद नहीं आया जबकि बाकियों को बहुत, तो लेक्चर पर पुरानी राय अब लागू न हो।"
difficulty: hard
