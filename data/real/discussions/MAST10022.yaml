points:
  - en: "Rigorous and proof-heavy; well suited to aspiring maths majors who want a challenge."
    zh: "严谨且证明多，适合想挑战自己的数学专业预备生。"
    zh-TW: "嚴謹且證明多，適合想挑戰自己、打算主修數學的學生。"
    ja: "厳密で証明が多い。挑戦したい数学専攻志望者に向いている。"
    ko: "엄밀하고 증명이 많다. 도전을 원하는 수학 전공 지망생에게 잘 맞는다."
    vi: "Chặt chẽ và nhiều chứng minh; hợp với ai định học chuyên ngành toán và thích thử thách."
    ms: "Ketat dan banyak bukti; sesuai untuk bakal pelajar major matematik yang mahu cabaran."
    id: "Ketat dan banyak pembuktian; cocok untuk calon jurusan matematika yang suka tantangan."
    hi: "सख़्त और प्रूफ़ से भरा; चुनौती चाहने वाले भावी मैथ्स मेजर के लिए सही।"
  - en: "Lecture notes with many exercises are a key resource; do all of them."
    zh: "附大量练习的讲义是核心资源，建议全部做完。"
    zh-TW: "附大量練習的講義是核心資源，建議全部做完。"
    ja: "演習が豊富な講義ノートが重要な教材。すべて解こう。"
    ko: "연습 문제가 많은 강의 노트가 핵심 자료다. 전부 풀자."
    vi: "Bài giảng kèm nhiều bài tập là tài liệu chính; hãy làm hết."
    ms: "Nota kuliah dengan banyak latihan ialah sumber utama; buat semuanya."
    id: "Catatan kuliah dengan banyak latihan adalah sumber utama; kerjakan semuanya."
    hi: "ढेर सारी एक्सरसाइज़ वाले लेक्चर नोट्स मुख्य रिसोर्स हैं; सभी करें।"
  - en: "Assignments are hard but good exam prep; start early. The MST is easier than the final."
    zh: "作业难但对备考很有帮助，要尽早开始；期中测验比期末简单。"
    zh-TW: "作業難但對準備考試很有幫助，要及早開始；期中考比期末簡單。"
    ja: "課題は難しいが試験対策に最適。早めに始めよう。MSTは期末より易しい。"
    ko: "과제는 어렵지만 시험 대비에 좋다. 일찍 시작하자. MST는 기말보다 쉽다."
    vi: "Bài tập khó nhưng giúp ôn thi tốt; bắt đầu sớm. MST dễ hơn thi cuối kỳ."
    ms: "Tugasan sukar tetapi persediaan peperiksaan yang baik; mula awal. MST lebih mudah daripada akhir."
    id: "Tugasnya sulit tapi bagus untuk persiapan ujian; mulai lebih awal. MST lebih mudah dari ujian akhir."
    hi: "असाइनमेंट कठिन पर एग्ज़ाम की अच्छी तैयारी; जल्दी शुरू करें। MST फ़ाइनल से आसान है।"
  - en: "Highly sequential, so never fall behind in lectures."
    zh: "内容环环相扣，讲课绝不能落下。"
    zh-TW: "內容環環相扣，上課絕不能落後。"
    ja: "内容が積み上げ式なので、講義に遅れないこと。"
    ko: "내용이 순차적으로 이어지니 강의에서 절대 뒤처지지 말자."
    vi: "Kiến thức nối tiếp nhau chặt chẽ, nên đừng bao giờ bị tụt bài giảng."
    ms: "Sangat berturutan, jadi jangan sekali-kali ketinggalan kuliah."
    id: "Materinya sangat berurutan, jadi jangan pernah tertinggal kuliah."
    hi: "कंटेंट एक-दूसरे पर टिका है, तो लेक्चर में कभी पीछे न रहें।"
difficulty: hard
