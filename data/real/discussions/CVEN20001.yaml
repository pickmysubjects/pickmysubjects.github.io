points:
  - en: "Assignments are a lot of work. Instructions and rubrics were often vague or released late, so start early."
    zh: "作业工作量大，说明和评分标准常常含糊或发布较晚，要尽早开始。"
    zh-TW: "作業量很大。說明和評分標準常常含糊或很晚才公布，所以要早點開始。"
    ja: "課題の量が多い。指示や評価基準が曖昧だったり公開が遅かったりすることが多いので、早めに始めよう。"
    ko: "과제 분량이 많다. 안내와 채점 기준이 모호하거나 늦게 나오는 경우가 많으니 일찍 시작하자."
    vi: "Bài tập rất nhiều việc. Hướng dẫn và rubric thường mơ hồ hoặc công bố muộn, nên hãy bắt đầu sớm."
    ms: "Tugasan sangat banyak kerja. Arahan dan rubrik sering kabur atau dikeluarkan lewat, jadi mula awal."
    id: "Tugasnya banyak kerjaan. Instruksi dan rubrik sering kabur atau dirilis terlambat, jadi mulai lebih awal."
    hi: "असाइनमेंट में बहुत काम है। निर्देश और रूब्रिक अक्सर अस्पष्ट थे या देर से आए, इसलिए जल्दी शुरू करें।"
  - en: "Opinions are split: 2023-2024 reviewers found it disorganised with dull lectures, while 2026 reviewers were more positive."
    zh: "看法不一：2023-2024年的评价认为组织混乱、讲座乏味，2026年的评价则更正面。"
    zh-TW: "看法不一：2023-2024年的評論者覺得組織混亂、講課無聊，2026年的評論者則比較正面。"
    ja: "評価は分かれる。2023-2024年のレビューは運営が雑で講義も退屈としたが、2026年のレビューはより好意的。"
    ko: "의견은 갈린다. 2023-2024년 리뷰어는 운영이 엉망이고 강의가 지루하다고 했지만, 2026년 리뷰어는 더 긍정적이었다."
    vi: "Ý kiến trái chiều: đánh giá 2023-2024 thấy môn lộn xộn, bài giảng chán, còn đánh giá 2026 tích cực hơn."
    ms: "Pandangan berbelah bahagi: pengulas 2023-2024 dapati ia tidak tersusun dengan kuliah membosankan, manakala pengulas 2026 lebih positif."
    id: "Pendapat terbelah: ulasan 2023-2024 menilainya berantakan dengan kuliah membosankan, sedangkan ulasan 2026 lebih positif."
    hi: "राय बंटी है: 2023-2024 के रिव्यूअर्स को यह अव्यवस्थित और लेक्चर उबाऊ लगे, जबकि 2026 के रिव्यूअर्स ज़्यादा सकारात्मक थे।"
  - en: "Recent reviewers liked the open-book exam and enjoyed tutorials more when working with friends."
    zh: "近期评价喜欢开卷考试，并认为和朋友一起上辅导课更愉快。"
    zh-TW: "近期評論者喜歡開書考試，也覺得和朋友一起上輔導課比較愉快。"
    ja: "最近のレビューでは持ち込み可の試験が好評で、友達と一緒だとチュートリアルも楽しかったという。"
    ko: "최근 리뷰어들은 오픈북 시험을 좋아했고, 친구와 함께하면 튜토리얼이 더 즐거웠다고 한다."
    vi: "Đánh giá gần đây thích bài thi mở tài liệu và thấy tutorial vui hơn khi làm cùng bạn bè."
    ms: "Pengulas terkini suka peperiksaan buku terbuka dan lebih menikmati tutorial apabila bekerja dengan rakan."
    id: "Ulasan terbaru menyukai ujian open-book dan lebih menikmati tutorial saat bekerja bersama teman."
    hi: "हाल के रिव्यूअर्स को ओपन-बुक परीक्षा पसंद आई और दोस्तों के साथ काम करने पर ट्यूटोरियल ज़्यादा अच्छे लगे।"
workload: heavy
