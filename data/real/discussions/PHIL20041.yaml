points:
  - en: "Every reviewer from 2021 to 2025 found it very hard: dense continental texts, often book chapters out of context, and abstract ideas."
    zh: "2021到2025年的每位评论者都觉得非常难：欧陆哲学文本艰深，常是脱离上下文的书籍章节，观点抽象。"
    zh-TW: "2021到2025年的每位評論者都覺得非常難：歐陸哲學文本艱深，常是脫離上下文的書籍章節，觀點抽象。"
    ja: "2021〜2025年のレビュアー全員がとても難しいと言う。大陸哲学のテキストは難解で、文脈から切り離された本の章が多く、考えも抽象的。"
    ko: "2021~2025년 리뷰어 모두 매우 어렵다고 함. 대륙철학 텍스트가 난해하고, 맥락 없이 발췌한 책 장이 많으며 개념이 추상적."
    vi: "Mọi người đánh giá từ 2021 đến 2025 đều thấy rất khó: văn bản triết học lục địa dày đặc, thường là chương sách tách khỏi ngữ cảnh, ý tưởng trừu tượng."
    ms: "Setiap pengulas dari 2021 hingga 2025 dapati ia sangat sukar: teks kontinental yang padat, selalunya bab buku tanpa konteks, dan idea abstrak."
    id: "Semua pengulas 2021-2025 merasa sangat sulit: teks kontinental yang padat, sering bab buku yang lepas konteks, dan gagasan abstrak."
    hi: "2021 से 2025 तक हर रिव्यूअर को यह बहुत कठिन लगा: घने कॉन्टिनेंटल ग्रंथ, अक्सर संदर्भ से कटे किताब के अध्याय, और अमूर्त विचार।"
  - en: "Lectures were criticised as unstructured or hard to follow, especially online in 2021; tutors were the bright spot."
    zh: "讲座被批评缺乏结构或难以跟上，2021年线上时尤其如此；辅导老师是亮点。"
    zh-TW: "講課被批評缺乏結構或難以跟上，2021年線上時尤其如此；助教是亮點。"
    ja: "講義は構成がない、ついていきにくいと批判され、2021年のオンライン時は特にそうだった。チューターは良かったとのこと。"
    ko: "강의는 구조가 없거나 따라가기 어렵다는 비판을 받았고, 2021년 온라인 땐 특히 그랬음. 튜터는 좋았다는 평."
    vi: "Bài giảng bị chê thiếu cấu trúc hoặc khó theo, nhất là khi học online năm 2021; tutor là điểm sáng."
    ms: "Kuliah dikritik tidak berstruktur atau sukar diikuti, terutama dalam talian pada 2021; tutor ialah titik terang."
    id: "Kuliahnya dikritik tidak terstruktur atau sulit diikuti, terutama saat online di 2021; tutornya jadi titik terang."
    hi: "लेक्चर बिना ढाँचे के या समझने में कठिन बताए गए, खासकर 2021 में ऑनलाइन; ट्यूटर्स इसकी अच्छी बात रहे।"
difficulty: hard
workload: heavy
