reviews: 5
from: 2021
to: 2023
checked: 2026-10-08
points:
  - en: "Assessment is spread across three modules, each with a group presentation and quizzes, with no heavily weighted exam."
    zh: "考核分散在三个模块，每个模块有小组展示和测验，没有高权重期末考。"
    zh-TW: "考核分散在三個模組，每個模組有小組報告和測驗，沒有高權重期末考。"
    ja: "評価は3つの単元に分かれ、それぞれにグループ発表と小テストがあり、配点の大きい試験はありません。"
    ko: "평가는 세 모듈에 나뉘어 있고 각각 조별 발표와 퀴즈가 있으며, 비중 큰 시험은 없습니다."
    vi: "Đánh giá trải đều 3 module, mỗi module có thuyết trình nhóm và quiz, không có bài thi chiếm tỷ trọng lớn."
    ms: "Penilaian dibahagi kepada tiga modul, setiap satu ada pembentangan kumpulan dan kuiz, tanpa peperiksaan berwajaran besar."
    id: "Penilaian tersebar di tiga modul, masing-masing ada presentasi kelompok dan kuis, tanpa ujian berbobot besar."
    hi: "असेसमेंट तीन मॉड्यूल्स में बँटा है, हर एक में ग्रुप प्रेज़ेंटेशन और क्विज़, कोई भारी वेटेज वाला एग्ज़ाम नहीं।"
  - en: "Group work is central, so good teammates matter. Several found the work repetitive across modules."
    zh: "小组合作是核心，队友很关键；多人觉得各模块任务重复。"
    zh-TW: "小組合作是核心，隊友很關鍵；多人覺得各模組任務重複。"
    ja: "グループワークが中心なので、良いチームメイトが大切です。単元間で作業が繰り返しだと感じた人もいます。"
    ko: "조별 활동이 핵심이라 좋은 팀원이 중요합니다. 모듈마다 과제가 반복된다고 느낀 사람이 여럿입니다."
    vi: "Làm việc nhóm là trọng tâm, nên đồng đội tốt rất quan trọng. Một số người thấy công việc lặp lại giữa các module."
    ms: "Kerja kumpulan ialah teras, jadi rakan sepasukan yang baik penting. Beberapa dapati kerja berulang merentas modul."
    id: "Kerja kelompok jadi inti, jadi rekan tim yang baik penting. Beberapa merasa tugasnya berulang antar modul."
    hi: "ग्रुप वर्क मुख्य है, इसलिए अच्छे टीममेट्स ज़रूरी हैं। कई लोगों को मॉड्यूल्स में काम दोहराव वाला लगा।"
  - en: "The open-ended individual assignment was daunting, with limited guidance or feedback from staff."
    zh: "开放式个人作业令人发怵，教师给的指导和反馈有限。"
    zh-TW: "開放式個人作業令人發怵，教師給的指導和回饋有限。"
    ja: "自由度の高い個人課題は手強く、教員からの指導やフィードバックは限られていました。"
    ko: "자유 주제 개인 과제는 부담스러웠고 교수진의 안내와 피드백도 부족했습니다."
    vi: "Bài tập cá nhân mở khá đáng ngại, với ít hướng dẫn hay phản hồi từ giảng viên."
    ms: "Tugasan individu terbuka agak menakutkan, dengan bimbingan atau maklum balas terhad daripada staf."
    id: "Tugas individu yang terbuka cukup menakutkan, dengan bimbingan atau feedback terbatas dari pengajar."
    hi: "ओपन-एंडेड व्यक्तिगत असाइनमेंट डराने वाला था, और स्टाफ से गाइडेंस या फीडबैक कम मिला।"
sections:
  content:
    - en: "A team-based, capstone-like Physiology subject in three modules (metabolic, cardio, muscle), applying physiology to disease and new treatments. Most reviewers found it interesting and an achievable H1."
      zh: "以小组为主、类似生理学毕业项目的课，分三个模块（代谢、心血管、肌肉），把生理学用到疾病和新疗法上。多数同学觉得有意思，H1 可以拿到。"
      zh-TW: "以小組為主、類似生理學畢業專題的課，分三個模組（代謝、心血管、肌肉），把生理學用到疾病和新療法上。多數同學覺得有意思，H1 拿得到。"
      ja: "チーム中心で生理学専攻の総まとめのような科目。代謝・心血管・筋肉の3モジュールで、生理学を病気や新しい治療に応用する。面白くH1も狙えるという声が多い。"
      ko: "팀 중심의 생리학 캡스톤 같은 과목으로 대사, 심혈관, 근육 3개 모듈에서 생리학을 질병과 새 치료에 적용한다. 대부분 흥미롭고 H1이 가능하다고 한다."
      vi: "Môn Sinh lý theo nhóm, giống đồ án tổng kết, gồm ba module (chuyển hóa, tim mạch, cơ), áp dụng sinh lý vào bệnh và liệu pháp mới. Đa số thấy thú vị và có thể đạt H1."
      ms: "Subjek Fisiologi berasaskan pasukan, seperti projek akhir, dalam tiga modul (metabolik, kardio, otot), mengaplikasi fisiologi pada penyakit dan rawatan baharu. Kebanyakan rasa menarik dan H1 boleh dicapai."
      id: "Mata kuliah Fisiologi berbasis tim, mirip capstone, dalam tiga modul (metabolik, kardio, otot), menerapkan fisiologi pada penyakit dan terapi baru. Sebagian besar merasa menarik dan H1 bisa diraih."
      hi: "टीम-आधारित, कैपस्टोन जैसा फ़िज़ियोलॉजी विषय, तीन मॉड्यूल (मेटाबॉलिक, कार्डियो, मसल) में, फ़िज़ियोलॉजी को बीमारी और नए इलाज पर लागू करता है। ज़्यादातर को रोचक लगा और H1 संभव।"
  work:
    - en: "Each module has a team presentation on a new therapy, a reading quiz and an end-of-module quiz; no big exam. A final individual assignment pitches a therapy for any disease you choose."
      zh: "每个模块都有一次小组展示（设计新疗法）、阅读小测和模块末测验，没有大考。最后有个人作业，针对任选的疾病提出疗法。"
      zh-TW: "每個模組都有一次小組報告（設計新療法）、閱讀小考和模組末測驗，沒有大考。最後有個人作業，針對任選的疾病提出療法。"
      ja: "各モジュールに新しい治療法のチーム発表、リーディングクイズ、モジュール末クイズがあり、大きな試験はない。最後は好きな病気への治療法を提案する個人課題。"
      ko: "모듈마다 새 치료법 팀 발표, 리딩 퀴즈, 모듈 말 퀴즈가 있고 큰 시험은 없다. 마지막 개인 과제는 원하는 질병에 대한 치료법을 제안한다."
      vi: "Mỗi module có thuyết trình nhóm về liệu pháp mới, quiz đọc và quiz cuối module; không có kỳ thi lớn. Bài cá nhân cuối đề xuất liệu pháp cho bệnh tự chọn."
      ms: "Setiap modul ada pembentangan pasukan tentang rawatan baharu, kuiz bacaan dan kuiz akhir modul; tiada peperiksaan besar. Tugasan individu akhir mencadangkan rawatan untuk penyakit pilihan."
      id: "Tiap modul ada presentasi tim tentang terapi baru, kuis bacaan dan kuis akhir modul; tanpa ujian besar. Tugas individu akhir mengusulkan terapi untuk penyakit pilihanmu."
      hi: "हर मॉड्यूल में नई थेरेपी पर टीम प्रेज़ेंटेशन, रीडिंग क्विज़ और मॉड्यूल-अंत क्विज़; कोई बड़ी परीक्षा नहीं। आख़िरी व्यक्तिगत असाइनमेंट में अपनी चुनी बीमारी के लिए थेरेपी प्रस्तावित करनी होती है।"
  watch:
    - en: "2021 reviewers (the first cohort) found it disorganised, with little feedback and vague help on the final assignment. Your experience depends heavily on your team, since you're with them all semester."
      zh: "2021 年（第一届）的同学觉得组织混乱，反馈少，最终作业的答疑也很含糊。整个学期都和同一组人合作，体验很看队友。"
      zh-TW: "2021 年（第一屆）的同學覺得組織混亂，回饋少，最終作業的答疑也很含糊。整個學期都和同一組人合作，體驗很看隊友。"
      ja: "2021年（初年度）のレビューは運営が雑で、フィードバックが少なく最終課題への回答もあいまいだったと言う。学期中ずっと同じチームなので、体験はチーム次第。"
      ko: "2021년(첫 기수) 리뷰는 운영이 엉성하고 피드백이 적으며 최종 과제 답변이 모호했다고 한다. 학기 내내 같은 팀이라 경험은 팀원에 크게 좌우된다."
      vi: "Người học 2021 (khóa đầu) thấy tổ chức lộn xộn, ít phản hồi và hỗ trợ mơ hồ cho bài cuối. Trải nghiệm phụ thuộc nhiều vào nhóm vì làm cùng cả kỳ."
      ms: "Pengulas 2021 (kohort pertama) rasa tidak teratur, sedikit maklum balas dan bantuan kabur untuk tugasan akhir. Pengalaman sangat bergantung pada pasukan kerana bersama sepanjang semester."
      id: "Pengulas 2021 (angkatan pertama) merasa berantakan, sedikit umpan balik dan bantuan samar untuk tugas akhir. Pengalaman sangat bergantung pada tim karena bersama sepanjang semester."
      hi: "2021 के रिव्यूअर्स (पहला बैच) को यह अव्यवस्थित लगा, फ़ीडबैक कम और आख़िरी असाइनमेंट पर मदद अस्पष्ट। अनुभव काफ़ी हद तक टीम पर निर्भर है, क्योंकि पूरे सेमेस्टर साथ रहते हैं।"
