code: ACCT30001
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/acct30001
reviews: 5
from: 2014
to: 2020
checked: 2026-10-13
points:
  - en: "Reviewers call it interesting and application-based; one says it is hard, and recent ones found staff helpful."
    zh: "评价认为内容有趣、偏重应用；有一位说难度较大，近期的评价觉得老师乐于帮忙。"
    zh-TW: "評價認為內容有趣、偏重應用；有一位說難度較高，近期的評價覺得老師樂於幫忙。"
    ja: "面白く応用寄りという評価。難しいという声も一つあり、最近のレビューでは教員が親切だったとのこと。"
    ko: "흥미롭고 응용 중심이라는 평가다. 어렵다는 의견도 하나 있고, 최근 리뷰는 교직원이 친절했다고 한다."
    vi: "Người học thấy môn thú vị và thiên về ứng dụng; một người nói khó, các đánh giá gần đây thấy giảng viên nhiệt tình."
    ms: "Pengulas kata ia menarik dan berasaskan aplikasi; seorang kata ia sukar, dan ulasan terkini dapati staf membantu."
    id: "Pengulas menyebutnya menarik dan berbasis aplikasi; satu bilang sulit, dan ulasan terbaru merasa staf membantu."
    hi: "रिव्यूअर्स इसे दिलचस्प और एप्लिकेशन-आधारित बताते हैं; एक ने कठिन कहा, और हाल के रिव्यू में स्टाफ़ मददगार लगा।"
  - en: "One recent review says the group assignment was marked harshly, though a good overall grade was still possible."
    zh: "一条近期评价说小组作业评分很严，但总成绩仍可以拿高。"
    zh-TW: "一則近期評價說小組作業評分很嚴，但總成績仍可以拿高。"
    ja: "最近のレビューの一つでは、グループ課題の採点が厳しかったが、総合では良い成績も取れたという。"
    ko: "최근 리뷰 하나는 그룹 과제 채점이 엄격했지만 전체 성적은 여전히 잘 받을 수 있었다고 한다."
    vi: "Một đánh giá gần đây nói bài nhóm bị chấm khắt khe, dù vẫn có thể đạt điểm tổng tốt."
    ms: "Satu ulasan terkini kata tugasan berkumpulan dimarkah dengan ketat, namun gred keseluruhan yang baik masih boleh dicapai."
    id: "Satu ulasan terbaru bilang tugas kelompok dinilai ketat, tapi nilai akhir yang bagus tetap mungkin."
    hi: "एक हालिया रिव्यू कहता है ग्रुप असाइनमेंट की मार्किंग सख़्त थी, फिर भी कुल अच्छा ग्रेड संभव था।"
  - en: "Older tips: read the textbook and watch small details in the slides, as they can turn up in the exam."
    zh: "较早的建议：读教材，注意课件里的小细节，考试可能会考到。"
    zh-TW: "較早的建議：讀課本，注意投影片裡的小細節，考試可能會考。"
    ja: "古いレビューのコツ：教科書を読み、スライドの細かい点にも注意。試験に出ることがある。"
    ko: "예전 팁: 교재를 읽고 슬라이드의 작은 세부 사항도 챙기자. 시험에 나올 수 있다."
    vi: "Mẹo từ đánh giá cũ: đọc giáo trình và chú ý chi tiết nhỏ trong slide, vì có thể ra thi."
    ms: "Tip lama: baca buku teks dan perhati butiran kecil dalam slaid, kerana ia boleh keluar dalam peperiksaan."
    id: "Tips lama: baca buku teks dan perhatikan detail kecil di slide, karena bisa muncul di ujian."
    hi: "पुराने टिप्स: टेक्स्टबुक पढ़ें और स्लाइड्स की छोटी बातों पर ध्यान दें, वे परीक्षा में आ सकती हैं।"
sections:
  content:
    - en: "Financial accounting theory, described as interesting and application-based but hard."
      zh: "财务会计理论，同学说有意思、偏应用，但有难度。"
      zh-TW: "財務會計理論，同學說有意思、偏應用，但有難度。"
      ja: "財務会計理論。面白く応用重視だが難しいという。"
      ko: "재무회계 이론. 흥미롭고 응용 중심이지만 어렵다는 평."
      vi: "Lý thuyết kế toán tài chính, được cho là thú vị, thiên ứng dụng nhưng khó."
      ms: "Teori perakaunan kewangan, digambarkan menarik dan berasaskan aplikasi tetapi sukar."
      id: "Teori akuntansi keuangan, disebut menarik dan berbasis penerapan tapi sulit."
      hi: "वित्तीय लेखा सिद्धांत, जिसे रोचक और उपयोग-आधारित पर कठिन बताया गया।"
  study:
    - en: "Reviewers suggest noting the small details in lecture slides, since they get tested, and reading the textbook. One found the group assignment marked harshly but still got an H1."
      zh: "同学建议注意课件里的小细节，因为会考到，也要读教材。有人小组作业被严格评分，但最后仍拿了 H1。"
      zh-TW: "同學建議注意投影片裡的小細節，因為會考到，也要讀課本。有人小組作業被嚴格評分，但最後仍拿了 H1。"
      ja: "講義スライドの細かい点も試験に出るので押さえ、教科書を読むよう勧める声。グループ課題の採点が厳しかったがH1を取った人も。"
      ko: "강의 슬라이드의 작은 디테일도 시험에 나오니 챙기고 교재를 읽으라는 조언. 조별 과제 채점이 엄격했지만 H1을 받은 사람도 있다."
      vi: "Người học khuyên chú ý chi tiết nhỏ trong slide vì sẽ bị hỏi, và đọc giáo trình. Một người bị chấm bài nhóm khắt khe nhưng vẫn được H1."
      ms: "Pengulas cadang catat butiran kecil dalam slaid kuliah kerana ia diuji, dan baca buku teks. Seorang rasa tugasan kumpulan dimarkah ketat tetapi tetap dapat H1."
      id: "Pengulas menyarankan perhatikan detail kecil di slide kuliah karena diujikan, dan baca buku teks. Satu merasa tugas kelompok dinilai ketat tapi tetap dapat H1."
      hi: "रिव्यूअर्स सुझाव देते हैं लेक्चर स्लाइड की छोटी बातें नोट करें क्योंकि वे परीक्षा में आती हैं, और पाठ्यपुस्तक पढ़ें। एक का ग्रुप असाइनमेंट सख़्ती से जाँचा गया फिर भी H1 मिला।"
  watch:
    - en: "Most reviews are very short and all are from 2020 or earlier; teaching and exams may have changed since."
      zh: "大多数评价很短，而且都是 2020 年或更早的，现在的教法和考试可能已经变了。"
      zh-TW: "大多數評價很短，而且都是 2020 年或更早的，現在的教法和考試可能已經變了。"
      ja: "レビューの多くは非常に短く、すべて2020年以前のもの。授業や試験は変わっている可能性がある。"
      ko: "리뷰 대부분이 매우 짧고 모두 2020년 이전이라 지금 수업과 시험은 달라졌을 수 있다."
      vi: "Phần lớn đánh giá rất ngắn và đều từ 2020 trở về trước; cách dạy và thi có thể đã đổi."
      ms: "Kebanyakan ulasan sangat pendek dan semuanya dari 2020 atau lebih awal; pengajaran dan peperiksaan mungkin telah berubah."
      id: "Sebagian besar ulasan sangat singkat dan semuanya dari 2020 atau sebelumnya; pengajaran dan ujian mungkin sudah berubah."
      hi: "ज़्यादातर रिव्यू बहुत छोटे हैं और सभी 2020 या पहले के; पढ़ाई और परीक्षा अब बदल चुकी हो सकती है।"
