points:
  - en: "Content and rigour vary a lot by year, depending on who coordinates it."
    zh: "内容和严谨程度因年份和负责人而差别很大。"
    zh-TW: "內容和嚴謹程度因年份和負責人而差很多。"
    ja: "内容と厳密さは担当者によって年ごとに大きく変わる。"
    ko: "내용과 엄밀성이 담당자에 따라 해마다 크게 다르다."
    vi: "Nội dung và độ chặt chẽ thay đổi nhiều theo năm, tùy người phụ trách."
    ms: "Kandungan dan ketelitian banyak berbeza ikut tahun, bergantung pada penyelaras."
    id: "Materi dan ketelitiannya beda jauh tiap tahun, tergantung koordinatornya."
    hi: "कंटेंट और सख़्ती साल-दर-साल बहुत बदलती है, इस पर निर्भर कि कोऑर्डिनेटर कौन है।"
  - en: "Taking real analysis beforehand or concurrently is recommended, as it uses analysis-style proofs."
    zh: "建议先修或同时修实分析，因为会用到分析类证明。"
    zh-TW: "建議先修或同時修實分析，因為會用到分析類證明。"
    ja: "解析的な証明を使うので、実解析を事前か同時に履修するのがおすすめ。"
    ko: "해석학식 증명을 쓰므로 실해석을 미리 또는 함께 듣는 것을 추천한다."
    vi: "Nên học giải tích thực trước hoặc song song, vì môn dùng chứng minh kiểu giải tích."
    ms: "Disyorkan ambil analisis nyata sebelum atau serentak, kerana ia guna bukti gaya analisis."
    id: "Disarankan ambil analisis real sebelumnya atau bersamaan, karena memakai pembuktian gaya analisis."
    hi: "रियल एनालिसिस पहले या साथ में लेने की सलाह है, क्योंकि इसमें एनालिसिस-स्टाइल प्रूफ़ आते हैं।"
  - en: "Demanding time commitment; some found it rewarding, one found it disorganised."
    zh: "耗时很多；有人觉得收获大，也有人觉得组织混乱。"
    zh-TW: "很花時間；有人覺得收穫大，也有人覺得組織混亂。"
    ja: "時間の負担が大きい。得るものが大きいという人もいれば、運営が雑だという人もいた。"
    ko: "시간이 많이 든다. 보람 있었다는 사람도, 운영이 엉성했다는 사람도 있다."
    vi: "Tốn nhiều thời gian; có người thấy đáng giá, một người thấy thiếu tổ chức."
    ms: "Memerlukan banyak masa; ada yang rasa berbaloi, seorang rasa tidak teratur."
    id: "Menyita banyak waktu; ada yang merasa sepadan, satu orang merasa tidak teratur."
    hi: "बहुत समय माँगता है; कुछ को फ़ायदेमंद लगा, एक को अव्यवस्थित।"
workload: heavy
