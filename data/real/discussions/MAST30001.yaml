points:
  - en: "Mostly about Markov chains, with real-life uses. Reviewers found the ideas easier to grasp than second-year probability."
    zh: "内容以马尔可夫链为主，贴近实际应用。评价认为比二年级概率论更容易理解。"
    zh-TW: "內容以馬可夫鏈為主，貼近實際應用。評價認為比二年級機率論更容易理解。"
    ja: "主にマルコフ連鎖で、実生活での応用もある。2年次の確率より概念がつかみやすいとの評価。"
    ko: "주로 마르코프 연쇄를 다루며 실생활 활용도 있다. 2학년 확률보다 개념 이해가 쉽다는 평이다."
    vi: "Chủ yếu về xích Markov, có ứng dụng thực tế. Người học thấy ý tưởng dễ nắm hơn xác suất năm hai."
    ms: "Kebanyakannya tentang rantai Markov, dengan kegunaan sebenar. Pengulas dapati idea lebih mudah difahami berbanding kebarangkalian tahun dua."
    id: "Sebagian besar tentang rantai Markov, dengan penerapan nyata. Konsepnya dinilai lebih mudah dipahami dari probabilitas tahun kedua."
    hi: "ज़्यादातर मार्कोव चेन पर, असल ज़िंदगी के इस्तेमाल के साथ। रिव्यू के अनुसार आइडिया सेकंड-ईयर प्रोबेबिलिटी से समझने में आसान हैं।"
  - en: "The questions are harder than the material looks, and one reviewer called the exam very hard. Make sure you can do every tutorial question, because many hide tricks."
    zh: "题目比内容看起来难，有人说考试很难。务必弄懂每道辅导课题目，很多题有技巧。"
    zh-TW: "題目比內容看起來難，有人說考試很難。務必弄懂每一題習題，很多題藏有技巧。"
    ja: "問題は見た目より難しく、試験がとても難しかったという人もいる。チュートリアル問題は全部解けるように。ひっかけが多い。"
    ko: "문제가 내용보다 어렵고, 시험이 매우 어려웠다는 후기도 있다. 튜토리얼 문제는 모두 풀 수 있게 하자. 함정이 많다."
    vi: "Câu hỏi khó hơn vẻ ngoài của nội dung, một người nói đề thi rất khó. Hãy chắc làm được mọi bài tutorial, vì nhiều bài có bẫy."
    ms: "Soalan lebih sukar daripada rupa bahannya, dan seorang pengulas kata peperiksaan sangat sukar. Pastikan boleh buat setiap soalan tutorial, kerana banyak ada helah."
    id: "Soalnya lebih sulit dari kesan materinya, dan satu ulasan menyebut ujiannya sangat sulit. Pastikan bisa semua soal tutorial, karena banyak jebakan."
    hi: "सवाल कंटेंट से ज़्यादा कठिन हैं, एक रिव्यूअर ने एग्ज़ाम को बहुत कठिन कहा। हर ट्यूटोरियल सवाल कर पाना पक्का करें, कई में ट्रिक छिपी है।"
  - en: "Tutorials were too full to finish the work in class, so finish the questions at home."
    zh: "辅导课人太多，课上做不完，回家要把题补完。"
    zh-TW: "習題課人太多，課堂上做不完，回家要把題目補完。"
    ja: "チュートリアルは人が多すぎて授業中に終わらないので、残りは家で解こう。"
    ko: "튜토리얼이 너무 붐벼 수업 중에 다 못 끝내니 집에서 마무리하자."
    vi: "Lớp tutorial quá đông nên không làm xong trên lớp, hãy hoàn thành bài ở nhà."
    ms: "Tutorial terlalu penuh untuk siapkan kerja dalam kelas, jadi siapkan soalan di rumah."
    id: "Tutorial terlalu penuh sehingga tidak selesai di kelas, jadi selesaikan soalnya di rumah."
    hi: "ट्यूटोरियल इतने भरे थे कि क्लास में काम पूरा नहीं होता, तो सवाल घर पर पूरे करें।"
difficulty: mixed
