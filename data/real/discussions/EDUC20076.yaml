points:
  - en: "Reviewers loved learning Auslan from Deaf teachers and found the subject eye-opening, even if signing in front of others felt nervy at first."
    zh: "评论者很喜欢跟聋人老师学手语，觉得大开眼界；一开始当众打手语会紧张。"
    zh-TW: "評論者很喜歡跟聾人老師學手語，覺得大開眼界；一開始當眾打手語會緊張。"
    ja: "ろう者の先生から手話を学べて視野が広がったと好評。最初は人前で手話をするのが緊張する。"
    ko: "농인 선생님께 수어를 배우는 게 좋았고 시야가 넓어졌다는 평. 처음엔 남 앞에서 수어하기가 긴장됨."
    vi: "Người học rất thích học Auslan với giáo viên Điếc và thấy mở mang; lúc đầu ra dấu trước lớp hơi ngại."
    ms: "Pengulas suka belajar Auslan daripada guru Pekak dan rasa ia membuka mata, walau mula-mula gementar berisyarat."
    id: "Pengulas senang belajar Auslan dari guru Tuli dan merasa wawasan terbuka, meski awalnya grogi berisyarat."
    hi: "रिव्यूअर्स को बधिर शिक्षकों से ऑसलैन सीखना बहुत पसंद आया; शुरू में सबके सामने साइन करना घबराहट भरा लगा।"
  - en: "Older reviews say the assessment criteria were vague; recent ones say expectations are clear and following the rubric earns high marks."
    zh: "早期评论说评分标准模糊；近期评论则说要求清楚，照标准做就能拿高分。"
    zh-TW: "早期評論說評分標準模糊；近期評論則說要求清楚，照標準做就能拿高分。"
    ja: "以前は評価基準が曖昧との声、最近は要求が明確で基準通りなら高得点との声。"
    ko: "예전 리뷰는 평가 기준이 모호했다고 하고, 최근 리뷰는 기준이 명확해 따르면 고득점 가능하다고 함."
    vi: "Đánh giá cũ nói tiêu chí chấm mơ hồ; gần đây thì nói yêu cầu rõ, làm theo rubric là điểm cao."
    ms: "Ulasan lama kata kriteria kabur; ulasan terkini kata jangkaan jelas dan ikut rubrik dapat markah tinggi."
    id: "Ulasan lama bilang kriteria kabur; ulasan terbaru bilang ekspektasi jelas dan ikut rubrik dapat nilai tinggi."
    hi: "पुराने रिव्यू में मानदंड अस्पष्ट बताए गए; हाल के रिव्यू कहते हैं अपेक्षाएँ साफ़ हैं और रूब्रिक मानने पर अच्छे अंक मिलते हैं।"
  - en: "You don't need to be a strong writer: the reflective essay was called manageable and the final project fun."
    zh: "不必很会写作：反思文章被认为不难，期末项目也很有趣。"
    zh-TW: "不必很會寫作：反思文章被認為不難，期末專題也很有趣。"
    ja: "文章が得意でなくても大丈夫。振り返りエッセイは無理がなく、最終課題は楽しいとの声。"
    ko: "글을 잘 쓰지 않아도 됨. 성찰 에세이는 할 만하고 최종 프로젝트는 재미있다는 평."
    vi: "Không cần viết giỏi: bài luận phản tư vừa sức và dự án cuối khá vui."
    ms: "Tidak perlu pandai menulis: esei reflektif boleh diurus dan projek akhir menyeronokkan."
    id: "Tidak harus jago menulis: esai reflektif masih terjangkau dan proyek akhirnya seru."
    hi: "अच्छा लेखक होना ज़रूरी नहीं: रिफ्लेक्टिव निबंध आसान और अंतिम प्रोजेक्ट मज़ेदार बताया गया।"
sections:
  content:
    - en: "Learning Auslan and visual communication and gaining insight into Deaf culture, taught by Deaf teachers, often as a winter intensive. Reviewers almost all found it eye-opening and fulfilling."
      zh: "学习澳洲手语（Auslan）和视觉沟通，了解聋人文化，由聋人老师授课，常以冬季密集班形式开。几乎所有同学都觉得大开眼界、很有收获。"
      zh-TW: "學習澳洲手語（Auslan）和視覺溝通，了解聾人文化，由聾人老師授課，常以冬季密集班開課。幾乎所有同學都覺得大開眼界、很有收穫。"
      ja: "オーストラリア手話（Auslan）と視覚的コミュニケーションを学びろう文化を知る。ろう者の教員が教え、冬の集中講座が多い。ほぼ全員が視野が広がり充実したという。"
      ko: "호주 수어(Auslan)와 시각적 의사소통을 배우고 농문화를 이해하며, 농인 교사가 가르치고 겨울 집중 과정으로 많이 열린다. 거의 모두가 시야가 넓어지고 보람 있었다고 했다."
      vi: "Học Auslan và giao tiếp bằng hình ảnh, hiểu văn hóa người Điếc, do giáo viên Điếc dạy, thường là khóa cấp tốc mùa đông. Hầu hết người học thấy mở mang và đáng giá."
      ms: "Belajar Auslan dan komunikasi visual serta memahami budaya Pekak, diajar guru Pekak, selalunya kursus intensif musim sejuk. Hampir semua pengulas rasa ia membuka mata dan bermakna."
      id: "Belajar Auslan dan komunikasi visual serta memahami budaya Tuli, diajar guru Tuli, sering sebagai kelas intensif musim dingin. Hampir semua pengulas merasa wawasannya terbuka dan bermakna."
      hi: "Auslan और दृश्य संचार सीखना और बधिर संस्कृति को समझना, बधिर शिक्षकों द्वारा, अक्सर विंटर इंटेंसिव के रूप में। लगभग सभी रिव्यूअर्स को यह आँखें खोलने वाला और संतोषजनक लगा।"
  work:
    - en: "A reflective essay and a resource-making assignment such as a presentation carry most of the grade. Recent reviewers found the rubric clear and generous; older ones found briefs vague."
      zh: "一篇反思论文和一个制作学习资源的作业（比如演示文稿）占大部分成绩。近期同学觉得评分标准清楚、给分大方；早期同学觉得要求含糊。"
      zh-TW: "一篇反思論文和一份製作學習資源的作業（例如簡報）佔大部分成績。近期同學覺得評分標準清楚、給分大方；早期同學覺得要求含糊。"
      ja: "振り返りエッセイと、プレゼンなどの教材を作る課題が成績の大半。最近はルーブリックが明確で採点も甘いという声、以前は指示が曖昧だったという声。"
      ko: "성찰 에세이와 발표 자료 같은 학습 자료 제작 과제가 성적 대부분이다. 최근 리뷰는 루브릭이 명확하고 후하다고 했고, 예전엔 안내가 모호했다고 한다."
      vi: "Một bài luận suy ngẫm và một bài làm tài liệu học như bài trình chiếu chiếm phần lớn điểm. Người học gần đây thấy rubric rõ và chấm rộng rãi; trước đây thấy đề mơ hồ."
      ms: "Esei refleksi dan tugasan membina sumber seperti persembahan membawa kebanyakan gred. Pengulas terkini dapati rubrik jelas dan murah hati; pengulas lama rasa arahan kabur."
      id: "Esai refleksi dan tugas membuat sumber belajar seperti presentasi menentukan sebagian besar nilai. Pengulas terbaru merasa rubriknya jelas dan murah hati; pengulas lama merasa instruksinya kabur."
      hi: "एक चिंतनशील निबंध और प्रेज़ेंटेशन जैसा संसाधन बनाने वाला असाइनमेंट ग्रेड का बड़ा हिस्सा हैं। हाल के रिव्यूअर्स को रूब्रिक साफ़ और उदार लगा; पुराने रिव्यूअर्स को निर्देश अस्पष्ट लगे।"
  study:
    - en: "Follow the rubric closely; one reviewer suggests asking past students for tips and using the lecture references for the essay."
      zh: "严格按评分标准写；有同学建议向修过的同学请教，论文多用讲课里列出的参考文献。"
      zh-TW: "嚴格照評分標準寫；有同學建議向修過的同學請教，論文多用上課列出的參考文獻。"
      ja: "ルーブリックに忠実に。過去の受講者にコツを聞き、エッセイには講義で挙げられた文献を使うよう勧める声も。"
      ko: "루브릭을 꼼꼼히 따르라. 먼저 들은 학생에게 팁을 묻고, 에세이엔 강의에 나온 참고문헌을 쓰라는 조언도 있다."
      vi: "Bám sát rubric; một người khuyên hỏi kinh nghiệm người học trước và dùng tài liệu tham khảo trong bài giảng cho bài luận."
      ms: "Ikut rubrik dengan teliti; seorang pengulas cadangkan tanya pelajar terdahulu untuk tip dan guna rujukan kuliah untuk esei."
      id: "Ikuti rubrik dengan cermat; satu pengulas menyarankan bertanya tips ke mahasiswa sebelumnya dan memakai referensi kuliah untuk esai."
      hi: "रूब्रिक ध्यान से मानें; एक रिव्यूअर पहले के छात्रों से सुझाव लेने और निबंध के लिए लेक्चर के संदर्भ इस्तेमाल करने की सलाह देते हैं।"
  watch:
    - en: "Signing in class can feel daunting if you are introverted or dislike acting, though reviewers say the nerves fade."
      zh: "如果你内向或不喜欢表演，课上打手语一开始会有点紧张，但同学说这种紧张会慢慢消失。"
      zh-TW: "如果你內向或不喜歡表演，課堂上打手語一開始會有點緊張，但同學說這種緊張會慢慢消失。"
      ja: "内向的だったり演技が苦手だと、授業で手話をするのは最初緊張するが、その緊張は薄れていくという。"
      ko: "내향적이거나 연기를 싫어하면 수업 중 수어가 처음엔 부담스러울 수 있지만, 긴장은 사라진다고 한다."
      vi: "Ra dấu trên lớp có thể khiến người hướng nội hoặc ngại diễn thấy e dè, nhưng người học nói cảm giác đó sẽ qua."
      ms: "Berisyarat dalam kelas boleh terasa menakutkan jika anda introvert atau tidak suka berlakon, walaupun pengulas kata rasa gemuruh itu hilang."
      id: "Berisyarat di kelas bisa terasa menegangkan kalau kamu introver atau tidak suka berakting, meski pengulas bilang rasa gugupnya hilang."
      hi: "अगर आप अंतर्मुखी हैं या अभिनय पसंद नहीं, तो क्लास में साइन करना शुरू में डरावना लग सकता है, पर रिव्यूअर्स कहते हैं घबराहट चली जाती है।"
workload: light
