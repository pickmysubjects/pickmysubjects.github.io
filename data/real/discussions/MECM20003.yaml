code: MECM20003
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/mecm20003
reviews: 10
from: 2017
to: 2025
checked: 2026-10-17
points:
  - en: "Now called Internet Communication. Each week looks at a different part of online culture, with a fair amount of theory. Most reviewers found it interesting and not too content-heavy."
    zh: "现名为Internet Communication。每周探讨网络文化的不同方面，理论内容不少。多数评论者觉得有趣，内容量不算大。"
    zh-TW: "現名為Internet Communication。每週探討網路文化的不同面向，理論內容不少。多數評論者覺得有趣，內容量不算大。"
    ja: "現在の名称はInternet Communication。毎週オンライン文化の異なる側面を扱い、理論もそれなりにある。多くは面白く内容量も多すぎないとした。"
    ko: "현재 이름은 Internet Communication. 매주 온라인 문화의 다른 측면을 다루며 이론도 꽤 있음. 대부분 흥미롭고 내용이 과하지 않다고 함."
    vi: "Nay gọi là Internet Communication. Mỗi tuần xem xét một khía cạnh khác của văn hóa mạng, khá nhiều lý thuyết. Đa số thấy thú vị và không quá nặng nội dung."
    ms: "Kini dipanggil Internet Communication. Setiap minggu meneliti aspek berbeza budaya dalam talian, dengan agak banyak teori. Kebanyakan dapati ia menarik dan tidak terlalu padat."
    id: "Kini bernama Internet Communication. Tiap minggu membahas sisi berbeda budaya daring, dengan cukup banyak teori. Kebanyakan merasa menarik dan tidak terlalu padat materi."
    hi: "अब इसका नाम Internet Communication है। हर हफ़्ते ऑनलाइन संस्कृति के अलग पहलू पर, काफ़ी सिद्धांत के साथ। ज़्यादातर को यह दिलचस्प और ज़्यादा भारी नहीं लगा।"
  - en: "The final task is a group app concept and presentation (a mock-up, not a working app); with a good group it is easy, but a 2025 reviewer said the time for it was short."
    zh: "最终任务是小组设计应用概念并展示（只是原型，不是真的应用）；组员好的话很轻松，但一位2025年的评论者说时间很紧。"
    zh-TW: "最終任務是小組設計應用程式概念並展示（只是原型，不是真的應用程式）；組員好的話很輕鬆，但一位2025年的評論者說時間很緊。"
    ja: "最終課題はグループでアプリの構想とプレゼン（動くアプリではなくモックアップ）。良いグループなら楽だが、2025年のレビューでは期間が短かったという。"
    ko: "최종 과제는 그룹 앱 콘셉트와 발표(실제 앱이 아닌 목업). 좋은 조면 쉽지만, 2025년 리뷰어는 준비 기간이 짧았다고 함."
    vi: "Bài cuối là nhóm thiết kế ý tưởng ứng dụng và thuyết trình (bản mô phỏng, không phải app thật); nhóm tốt thì dễ, nhưng một người năm 2025 nói thời gian làm khá ngắn."
    ms: "Tugasan akhir ialah konsep aplikasi berkumpulan dan pembentangan (mock-up, bukan aplikasi sebenar); dengan kumpulan baik ia mudah, tetapi seorang pengulas 2025 kata masanya singkat."
    id: "Tugas akhir berupa konsep aplikasi kelompok dan presentasi (mock-up, bukan aplikasi sungguhan); dengan kelompok bagus mudah, tapi seorang pengulas 2025 bilang waktunya singkat."
    hi: "अंतिम काम ग्रुप में ऐप का कॉन्सेप्ट और प्रेज़ेंटेशन है (मॉक-अप, असली ऐप नहीं); अच्छे ग्रुप के साथ आसान, पर 2025 के एक रिव्यूअर ने कहा इसके लिए समय कम था।"
sections:
  content:
    - en: "Theory and culture of internet media, with a different topic each week such as data tracking, livestream culture and emojis. Most found it interesting and not content-heavy; one found it impractical."
      zh: "讲网络媒体的理论和文化，每周一个主题，比如数据追踪、直播文化、表情符号。多数人觉得有趣、内容不重；有人觉得不太实用。"
      zh-TW: "講網路媒體的理論和文化，每週一個主題，例如數據追蹤、直播文化、表情符號。多數人覺得有趣、內容不重；有人覺得不太實用。"
      ja: "インターネットメディアの理論と文化で、データ追跡、ライブ配信文化、絵文字など毎週テーマが変わる。面白く内容も重くないという声が多いが、実用的でないという人も。"
      ko: "인터넷 미디어의 이론과 문화를 다루며 데이터 추적, 라이브 방송 문화, 이모지 등 매주 주제가 바뀐다. 대부분 흥미롭고 부담이 적다고 하지만 실용적이지 않다는 사람도 있다."
      vi: "Lý thuyết và văn hóa truyền thông internet, mỗi tuần một chủ đề như theo dõi dữ liệu, văn hóa livestream, emoji. Đa số thấy thú vị và không nặng; một người thấy không thực tế."
      ms: "Teori dan budaya media internet, topik berbeza setiap minggu seperti penjejakan data, budaya strim langsung dan emoji. Kebanyakan rasa menarik dan tidak padat; seorang rasa kurang praktikal."
      id: "Teori dan budaya media internet, topik berbeda tiap minggu seperti pelacakan data, budaya livestream dan emoji. Kebanyakan merasa menarik dan tidak padat; satu merasa kurang praktis."
      hi: "इंटरनेट मीडिया का सिद्धांत और संस्कृति, हर हफ़्ते नया विषय जैसे डेटा ट्रैकिंग, लाइवस्ट्रीम संस्कृति और इमोजी। ज़्यादातर को रोचक और हल्का लगा; एक को अव्यावहारिक।"
    - en: "Views on lectures split between well produced and repetitive or poorly structured; tutorials are widely praised."
      zh: "对讲座评价不一，有人觉得做得好，有人觉得重复、结构差；tutorial 普遍受好评。"
      zh-TW: "對講座評價不一，有人覺得做得好，有人覺得重複、結構差；tutorial 普遍受好評。"
      ja: "講義はよくできているという人と、繰り返しが多く構成が悪いという人に分かれる。チュートリアルは広く好評。"
      ko: "강의는 잘 만들었다는 평과 반복적이고 구성이 엉성하다는 평으로 갈린다. 튜토리얼은 대체로 호평이다."
      vi: "Ý kiến về bài giảng chia giữa làm tốt và lặp lại, thiếu cấu trúc; tutorial thì được khen nhiều."
      ms: "Pandangan tentang kuliah berbelah antara dihasilkan dengan baik dan berulang atau kurang tersusun; tutorial dipuji ramai."
      id: "Pendapat soal kuliah terbelah antara digarap baik dan berulang atau kurang terstruktur; tutorial banyak dipuji."
      hi: "लेक्चर पर राय बँटी, अच्छी तरह बने या दोहराव वाले और ख़राब ढाँचे वाले; ट्यूटोरियल की व्यापक तारीफ़।"
  work:
    - en: "A think piece and a final group project designing an app mockup (UI/UX, no real coding) with a presentation. Most found the assessments easier than they sound; one says time for the group project was short."
      zh: "一篇评论文章和期末小组项目：设计一个 app 原型（偏 UI/UX，不用真的写代码）并展示。多数人觉得考核没听上去那么难；有人说小组项目时间很紧。"
      zh-TW: "一篇評論文章和期末小組專題：設計一個 app 原型（偏 UI/UX，不用真的寫程式）並報告。多數人覺得考核沒聽起來那麼難；有人說小組專題時間很緊。"
      ja: "論考エッセイと、アプリのモックアップ（UI/UX中心で実装なし）を設計し発表する最終グループ課題。評価は見た目ほど難しくないという声が多いが、グループ課題の時間が短いという人も。"
      ko: "논평 에세이와 앱 목업(UI/UX 위주, 실제 코딩 없음)을 설계해 발표하는 조별 기말 프로젝트가 있다. 대부분 생각보다 쉽다고 하지만 조별 프로젝트 기간이 짧다는 사람도 있다."
      vi: "Một bài bình luận và dự án nhóm cuối kỳ thiết kế bản mẫu app (UI/UX, không lập trình thật) kèm thuyết trình. Đa số thấy dễ hơn tưởng; một người nói thời gian làm nhóm ngắn."
      ms: "Satu esei pandangan dan projek kumpulan akhir mereka bentuk mockup aplikasi (UI/UX, tiada pengekodan sebenar) dengan pembentangan. Kebanyakan rasa lebih mudah daripada disangka; seorang kata masa projek singkat."
      id: "Satu esai opini dan proyek kelompok akhir merancang mockup aplikasi (UI/UX, tanpa coding sungguhan) beserta presentasi. Kebanyakan merasa lebih mudah dari kedengarannya; satu bilang waktunya singkat."
      hi: "एक विचार लेख और अंत में ग्रुप प्रोजेक्ट जिसमें ऐप का मॉकअप (UI/UX, असली कोडिंग नहीं) बनाकर प्रस्तुत करना है। ज़्यादातर को यह सुनने से आसान लगा; एक के अनुसार ग्रुप प्रोजेक्ट का समय कम था।"
  study:
    - en: "The readings are interesting and help a lot with the assignments; a good group makes the final project much easier."
      zh: "阅读材料有意思，对作业帮助很大；组员靠谱的话期末项目会轻松很多。"
      zh-TW: "閱讀材料有趣，對作業幫助很大；組員靠譜的話期末專題會輕鬆很多。"
      ja: "文献は面白く課題に大いに役立つ。良いグループなら最終課題はずっと楽になる。"
      ko: "읽기 자료가 흥미롭고 과제에 큰 도움이 된다. 좋은 조를 만나면 기말 프로젝트가 훨씬 쉬워진다."
      vi: "Bài đọc thú vị và giúp nhiều cho bài tập; nhóm tốt thì dự án cuối kỳ dễ hơn nhiều."
      ms: "Bacaan menarik dan banyak membantu tugasan; kumpulan yang baik menjadikan projek akhir jauh lebih mudah."
      id: "Bacaannya menarik dan sangat membantu tugas; kelompok yang baik membuat proyek akhir jauh lebih mudah."
      hi: "रीडिंग्स रोचक हैं और असाइनमेंट में बहुत मदद करती हैं; अच्छा ग्रुप हो तो अंतिम प्रोजेक्ट बहुत आसान हो जाता है।"
difficulty: easy
