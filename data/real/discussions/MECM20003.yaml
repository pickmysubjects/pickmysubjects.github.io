points:
  - en: "Now called Internet Communication. Each week looks at a different part of online culture, with a fair amount of theory. Most reviewers found it interesting and not too content-heavy."
    zh: "现名为Internet Communication。每周探讨网络文化的不同方面，理论内容不少。多数评论者觉得有趣，内容量不算大。"
    zh-TW: "現名為Internet Communication。每週探討網路文化的不同面向，理論內容不少。多數評論者覺得有趣，內容量不算大。"
    ja: "現在の名称はInternet Communication。毎週オンライン文化の異なる側面を扱い、理論もそれなりにある。多くは面白く内容量も多すぎないとした。"
    ko: "현재 이름은 Internet Communication. 매주 온라인 문화의 다른 측면을 다루며 이론도 꽤 있음. 대부분 흥미롭고 내용이 과하지 않다고 함."
    vi: "Nay gọi là Internet Communication. Mỗi tuần xem xét một khía cạnh khác của văn hóa mạng, khá nhiều lý thuyết. Đa số thấy thú vị và không quá nặng nội dung."
    ms: "Kini dipanggil Internet Communication. Setiap minggu meneliti aspek berbeza budaya dalam talian, dengan agak banyak teori. Kebanyakan dapati ia menarik dan tidak terlalu padat."
    id: "Kini bernama Internet Communication. Tiap minggu membahas sisi berbeda budaya daring, dengan cukup banyak teori. Kebanyakan merasa menarik dan tidak terlalu padat materi."
    hi: "अब इसका नाम Internet Communication है। हर हफ़्ते ऑनलाइन संस्कृति के अलग पहलू पर, काफ़ी सिद्धांत के साथ। ज़्यादातर को यह दिलचस्प और ज़्यादा भारी नहीं लगा।"
  - en: "The final task is a group app concept and presentation (a mock-up, not a working app); with a good group it is easy, but a 2025 reviewer said the time for it was short."
    zh: "最终任务是小组设计应用概念并展示（只是原型，不是真的应用）；组员好的话很轻松，但一位2025年的评论者说时间很紧。"
    zh-TW: "最終任務是小組設計應用程式概念並展示（只是原型，不是真的應用程式）；組員好的話很輕鬆，但一位2025年的評論者說時間很緊。"
    ja: "最終課題はグループでアプリの構想とプレゼン（動くアプリではなくモックアップ）。良いグループなら楽だが、2025年のレビューでは期間が短かったという。"
    ko: "최종 과제는 그룹 앱 콘셉트와 발표(실제 앱이 아닌 목업). 좋은 조면 쉽지만, 2025년 리뷰어는 준비 기간이 짧았다고 함."
    vi: "Bài cuối là nhóm thiết kế ý tưởng ứng dụng và thuyết trình (bản mô phỏng, không phải app thật); nhóm tốt thì dễ, nhưng một người năm 2025 nói thời gian làm khá ngắn."
    ms: "Tugasan akhir ialah konsep aplikasi berkumpulan dan pembentangan (mock-up, bukan aplikasi sebenar); dengan kumpulan baik ia mudah, tetapi seorang pengulas 2025 kata masanya singkat."
    id: "Tugas akhir berupa konsep aplikasi kelompok dan presentasi (mock-up, bukan aplikasi sungguhan); dengan kelompok bagus mudah, tapi seorang pengulas 2025 bilang waktunya singkat."
    hi: "अंतिम काम ग्रुप में ऐप का कॉन्सेप्ट और प्रेज़ेंटेशन है (मॉक-अप, असली ऐप नहीं); अच्छे ग्रुप के साथ आसान, पर 2025 के एक रिव्यूअर ने कहा इसके लिए समय कम था।"
difficulty: easy
