points:
  - en: "Content (e.g. diabetes, cancer metabolism) is widely seen as interesting and relevant to real life."
    zh: "内容（如糖尿病、癌症代谢）普遍被认为有趣且贴近生活。"
    zh-TW: "內容（如糖尿病、癌症代謝）普遍被認為有趣且貼近生活。"
    ja: "内容（糖尿病やがんの代謝など）は、面白く実生活にも関係があると広く評価されている。"
    ko: "내용(당뇨병, 암 대사 등)은 흥미롭고 실생활과 관련 있다는 평이 많다."
    vi: "Nội dung (như tiểu đường, chuyển hóa ung thư) được nhiều người thấy thú vị và gắn với đời sống."
    ms: "Kandungan (cth. diabetes, metabolisme kanser) secara meluas dianggap menarik dan relevan dengan kehidupan sebenar."
    id: "Materinya (mis. diabetes, metabolisme kanker) banyak dinilai menarik dan relevan dengan kehidupan nyata."
    hi: "कंटेंट (जैसे डायबिटीज़, कैंसर मेटाबॉलिज़्म) को ज़्यादातर लोग दिलचस्प और असल ज़िंदगी से जुड़ा मानते हैं।"
  - en: "Several found assignments and the exam marked to a high standard, making high scores harder than in other BCMB subjects."
    zh: "几位评论者认为作业和考试评分标准高，比其他BCMB课程更难拿高分。"
    zh-TW: "幾位評論者認為作業和考試評分標準高，比其他BCMB課程更難拿高分。"
    ja: "課題も試験も採点基準が高く、他のBCMB科目より高得点が取りにくいという声が複数ある。"
    ko: "여러 리뷰어가 과제와 시험 채점 기준이 높아 다른 BCMB 과목보다 고득점이 어렵다고 했다."
    vi: "Một số người thấy bài tập và bài thi chấm theo chuẩn cao, khó đạt điểm cao hơn các môn BCMB khác."
    ms: "Beberapa pengulas dapati tugasan dan peperiksaan dimarkah dengan standard tinggi, jadi markah tinggi lebih sukar berbanding subjek BCMB lain."
    id: "Beberapa pengulas merasa tugas dan ujian dinilai dengan standar tinggi, jadi nilai tinggi lebih sulit dibanding mata kuliah BCMB lain."
    hi: "कई रिव्यूअर्स के मुताबिक़ असाइनमेंट और परीक्षा ऊँचे मानक से जाँचे गए, इसलिए दूसरे BCMB सब्जेक्ट से ज़्यादा नंबर लाना मुश्किल है।"
  - en: "MSTs were generally fair; attend workshops and do the practice questions, as workshop material can reappear in exams."
    zh: "期中测验总体公平；要参加研讨课并做练习题，研讨课内容可能再次出现在考试中。"
    zh-TW: "期中測驗大致公平；要去上研討課並做練習題，研討課內容可能再出現在考試中。"
    ja: "中間テスト（MST）はおおむね公平。ワークショップの内容が試験に出ることもあるので、出席して練習問題を解こう。"
    ko: "중간고사(MST)는 대체로 공정했다. 워크숍 내용이 시험에 다시 나올 수 있으니 참석하고 연습 문제를 풀자."
    vi: "Các bài MST nhìn chung công bằng; hãy dự workshop và làm bài luyện tập, vì nội dung workshop có thể xuất hiện lại trong đề thi."
    ms: "MST secara umumnya adil; hadiri bengkel dan buat soalan latihan, kerana bahan bengkel boleh muncul semula dalam peperiksaan."
    id: "MST umumnya adil; ikuti workshop dan kerjakan soal latihan, karena materi workshop bisa muncul lagi di ujian."
    hi: "MST आम तौर पर निष्पक्ष थे; वर्कशॉप में जाएँ और प्रैक्टिस सवाल हल करें, क्योंकि वर्कशॉप का मटेरियल परीक्षा में आ सकता है।"
difficulty: mixed
