points:
  - en: "Reviewers from 2013 to 2022 enjoyed it and praised friendly, approachable tutors in small classes; by the end you can hold a basic conversation."
    zh: "2013到2022年的评论者都很喜欢这门课，称赞小班里的辅导老师友善好沟通；学完能进行基本对话。"
    zh-TW: "2013到2022年的評論者都很喜歡這門課，稱讚小班裡的輔導老師友善好溝通；學完能進行基本對話。"
    ja: "2013〜2022年のレビューは好評で、少人数クラスの親しみやすいチューターが評価されている。終わる頃には簡単な会話ができる。"
    ko: "2013~2022년 리뷰는 만족스럽다는 평이며 소규모 수업의 친절한 튜터를 칭찬함. 끝날 즈음엔 기본 회화가 가능함."
    vi: "Người đánh giá từ 2013 đến 2022 đều thích, khen tutor thân thiện, dễ gần trong lớp nhỏ; học xong có thể giao tiếp cơ bản."
    ms: "Pengulas dari 2013 hingga 2022 menyukainya dan memuji tutor yang mesra dan mudah didekati dalam kelas kecil; pada akhirnya anda boleh berbual secara asas."
    id: "Pengulas 2013 sampai 2022 menyukainya dan memuji tutor yang ramah dan mudah didekati di kelas kecil; di akhir kamu bisa bercakap dasar."
    hi: "2013 से 2022 तक के रिव्यूअर्स को यह पसंद आया और छोटी क्लासों के मिलनसार ट्यूटर्स की तारीफ़ की; अंत तक आप बुनियादी बातचीत कर सकते हैं।"
  - en: "It is fast-paced and grammar-heavy with a lot of vocabulary to memorise at home, so expect steady extra study; the winter intensive is even more compressed."
    zh: "进度快、语法多，还有大量单词要在课后背，要准备好持续额外学习；冬季密集班更紧凑。"
    zh-TW: "進度快、文法多，還有大量單字要在課後背，要準備好持續額外學習；冬季密集班更緊湊。"
    ja: "進度が速く文法が多いうえ、家で覚える単語も大量にあるので、継続的な自習が必要。冬の集中版はさらに詰め込み。"
    ko: "진도가 빠르고 문법 비중이 크며 집에서 외울 단어도 많아 꾸준한 추가 공부가 필요함. 겨울 집중 과정은 더 빡빡함."
    vi: "Nhịp nhanh, nặng ngữ pháp, nhiều từ vựng phải tự học thuộc ở nhà, nên cần học thêm đều đặn; lớp mùa đông cấp tốc còn dồn hơn."
    ms: "Ia pantas dan berat dengan tatabahasa serta banyak kosa kata untuk dihafal di rumah, jadi bersedia untuk belajar tambahan secara berterusan; versi intensif musim sejuk lebih padat."
    id: "Tempo cepat, berat di tata bahasa, dan banyak kosakata yang harus dihafal di rumah, jadi siapkan belajar tambahan rutin; versi intensif musim dingin lebih padat lagi."
    hi: "यह तेज़ रफ़्तार और व्याकरण-प्रधान है, घर पर ढेर सारी शब्दावली याद करनी होती है, इसलिए लगातार अतिरिक्त पढ़ाई की उम्मीद रखें; विंटर इंटेंसिव और भी ठसाठस है।"
  - en: "The regular tests are seen as helpful rather than scary: they keep you on track and are good practice for the exam. Reviewers felt a high mark is achievable with consistent effort."
    zh: "定期测验被认为是帮助而不是压力：能让你跟上进度，也是很好的考前练习。评论者认为只要持续用功，高分是可以拿到的。"
    zh-TW: "定期測驗被認為是幫助而不是壓力：能讓你跟上進度，也是很好的考前練習。評論者認為只要持續用功，高分是拿得到的。"
    ja: "定期テストは怖いものではなく役に立つと受け止められている。ペースを保て、試験対策にもなる。コツコツ努力すれば高得点は狙えるとの声。"
    ko: "정기 시험은 부담이라기보다 도움이 된다는 평. 진도를 따라가게 해 주고 시험 대비도 됨. 꾸준히 노력하면 고득점이 가능하다고 봄."
    vi: "Các bài kiểm tra định kỳ được xem là có ích hơn là đáng sợ: giúp theo kịp và là cách ôn thi tốt. Người đánh giá cho rằng chăm chỉ đều đặn thì đạt điểm cao được."
    ms: "Ujian berkala dilihat sebagai membantu, bukan menakutkan: ia membuat anda kekal di landasan dan latihan yang baik untuk peperiksaan. Pengulas rasa markah tinggi boleh dicapai dengan usaha konsisten."
    id: "Tes rutin dianggap membantu, bukan menakutkan: membuatmu tetap di jalur dan jadi latihan bagus untuk ujian. Pengulas merasa nilai tinggi bisa dicapai dengan usaha konsisten."
    hi: "नियमित टेस्ट डराने वाले नहीं, मददगार माने गए: ये आपको लय में रखते हैं और एग्ज़ाम की अच्छी तैयारी कराते हैं। रिव्यूअर्स के मुताबिक़ लगातार मेहनत से ऊँचे अंक मिल सकते हैं।"
workload: heavy
