reviews: 4
from: 2017
to: 2021
checked: 2026-10-17
points:
  - en: "A clear step up from Spanish 1, with many more conjugations to learn, but still well organised with supportive tutors."
    zh: "比西班牙语1明显难一级，要学的动词变位多得多，但组织依然很好，辅导老师也很支持人。"
    zh-TW: "比西班牙語1明顯難一級，要學的動詞變位多得多，但組織依然很好，助教也很支持學生。"
    ja: "Spanish 1より明らかに難しく、覚える活用がずっと多いが、運営は相変わらずよく、チューターも親身。"
    ko: "Spanish 1보다 확실히 어렵고 외울 동사 변화가 훨씬 많지만, 여전히 운영이 잘 되고 튜터도 잘 도와줌."
    vi: "Khó hơn rõ so với Spanish 1, phải học nhiều cách chia động từ hơn, nhưng vẫn tổ chức tốt và tutor hỗ trợ."
    ms: "Lonjakan jelas dari Spanish 1, dengan lebih banyak konjugasi untuk dipelajari, tetapi masih teratur dengan tutor yang menyokong."
    id: "Jelas setingkat di atas Spanish 1, dengan jauh lebih banyak konjugasi untuk dipelajari, tapi tetap tertata dengan tutor yang suportif."
    hi: "Spanish 1 से साफ़ एक कदम आगे, सीखने को कहीं ज़्यादा क्रिया-रूप, पर फिर भी अच्छी तरह व्यवस्थित और मददगार ट्यूटर्स के साथ।"
  - en: "The oral exam is harder than before (a talk about an interview you did, then questions), so study for it; online tasks are easy marks."
    zh: "口试比以前难（先讲述你做过的一次访谈，再回答提问），需要认真准备；线上任务很容易拿分。"
    zh-TW: "口試比以前難（先講述你做過的一次訪談，再回答提問），需要認真準備；線上任務很容易拿分。"
    ja: "口頭試験は前より難しい（自分が行ったインタビューについて話し、その後質疑）ので準備すること。オンライン課題は点が取りやすい。"
    ko: "구술시험이 이전보다 어려우니(자기가 한 인터뷰에 대해 말한 뒤 질의응답) 준비할 것. 온라인 과제는 점수 따기 쉬움."
    vi: "Bài thi nói khó hơn trước (nói về buổi phỏng vấn bạn đã làm rồi trả lời câu hỏi), nên hãy ôn kỹ; bài tập online dễ lấy điểm."
    ms: "Peperiksaan lisan lebih sukar daripada sebelum ini (bercakap tentang temu bual yang anda buat, kemudian soal jawab), jadi bersedia; tugasan dalam talian ialah markah mudah."
    id: "Ujian lisannya lebih sulit dari sebelumnya (bicara tentang wawancara yang kamu lakukan, lalu tanya jawab), jadi siapkan diri; tugas online gampang dapat nilai."
    hi: "मौखिक परीक्षा पहले से कठिन है (अपने किए इंटरव्यू पर बोलना, फिर सवाल-जवाब), इसलिए तैयारी करें; ऑनलाइन काम आसान अंक हैं।"
