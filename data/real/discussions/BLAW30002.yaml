code: BLAW30002
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/blaw30002
reviews: 8
from: 2015
to: 2023
checked: 2026-10-13
points:
  - en: "Often described as dry but well organised and useful, covering income tax, CGT, FBT and GST; it suited students with no tax background too."
    zh: "常被形容为枯燥但组织得好、很实用，内容包括所得税、资本利得税、附加福利税和 GST；没有税务基础也能学。"
    zh-TW: "常被形容枯燥但組織良好、很實用，內容包括所得稅、資本利得稅、附加福利稅和 GST；沒有稅務基礎也能學。"
    ja: "退屈だが構成がよく実用的とよく言われる。所得税、CGT、FBT、GSTを扱い、税の予備知識がなくても大丈夫だった。"
    ko: "지루하지만 잘 짜여 있고 유용하다는 평이 많다. 소득세, CGT, FBT, GST를 다루며 세법 배경이 없어도 괜찮았다."
    vi: "Thường được mô tả là khô nhưng tổ chức tốt và hữu ích, gồm thuế thu nhập, CGT, FBT và GST; người chưa học thuế cũng theo được."
    ms: "Sering digambarkan membosankan tetapi tersusun dan berguna, merangkumi cukai pendapatan, CGT, FBT dan GST; sesuai juga tanpa latar cukai."
    id: "Sering disebut kering tapi tertata dan berguna, mencakup pajak penghasilan, CGT, FBT dan GST; cocok juga tanpa latar pajak."
    hi: "अक्सर नीरस पर सुव्यवस्थित और उपयोगी बताया गया, इनकम टैक्स, CGT, FBT और GST शामिल; बिना टैक्स बैकग्राउंड वालों के लिए भी ठीक रहा।"
  - en: "The reading load is heavy, the newest review calls it demanding but rewarding, and quizzes and assessments can be marked harshly."
    zh: "阅读量大，最新的评价说要求高但有收获，小测和作业评分可能较严。"
    zh-TW: "閱讀量大，最新的評價說要求高但有收穫，小考和作業評分可能較嚴。"
    ja: "読む量が多い。最新のレビューは大変だがやりがいがあると言い、小テストや課題の採点は厳しいことがある。"
    ko: "읽을 양이 많다. 최신 리뷰는 힘들지만 보람 있다고 하며, 퀴즈와 과제 채점이 엄격할 수 있다."
    vi: "Khối lượng đọc nặng, đánh giá mới nhất nói môn đòi hỏi cao nhưng đáng học, và quiz cùng bài đánh giá có thể chấm khắt khe."
    ms: "Bebanan bacaan berat, ulasan terbaru kata ia mencabar tetapi berbaloi, dan kuiz serta penilaian boleh dimarkah dengan ketat."
    id: "Bacaannya banyak, ulasan terbaru bilang menuntut tapi bermanfaat, dan kuis serta penilaian bisa dinilai ketat."
    hi: "पढ़ाई का बोझ भारी है, सबसे नया रिव्यू इसे मेहनत वाला पर फ़ायदेमंद बताता है, और क्विज़ व असेसमेंट की मार्किंग सख़्त हो सकती है।"
  - en: "Tip: tutorial exercises mirror the exam, so prepare them and write full answers; make your own notes, which also help in the open-book exam."
    zh: "建议：辅导课练习和考试题型相似，要提前准备并写完整答案；自己做笔记，开卷考试也用得上。"
    zh-TW: "建議：輔導課練習和考試題型相似，要事先準備並寫完整答案；自己做筆記，開書考試也用得上。"
    ja: "コツ：チュートリアルの演習は試験と似ているので準備して完全な答案を書くこと。自分でノートを作れば持ち込み可の試験でも役立つ。"
    ko: "팁: 튜토리얼 문제가 시험과 비슷하니 미리 준비하고 완전한 답을 써 보자. 직접 노트를 만들면 오픈북 시험에도 도움이 된다."
    vi: "Mẹo: bài tutorial giống đề thi, nên chuẩn bị và viết đáp án đầy đủ; tự làm ghi chú, cũng có ích cho bài thi được mở tài liệu."
    ms: "Tip: latihan tutorial menyerupai peperiksaan, jadi sediakan dan tulis jawapan penuh; buat nota sendiri, yang juga membantu dalam peperiksaan buku terbuka."
    id: "Tips: latihan tutorial mirip ujian, jadi siapkan dan tulis jawaban lengkap; buat catatan sendiri, yang juga berguna di ujian open-book."
    hi: "टिप: ट्यूटोरियल अभ्यास परीक्षा जैसे हैं, इन्हें तैयार करें और पूरे जवाब लिखें; अपने नोट्स बनाएँ, जो ओपन-बुक परीक्षा में भी काम आते हैं।"
sections:
  content:
    - en: "An intro to income tax, CGT, fringe benefits tax and GST. Reviewers call it well structured and taught, and useful for life, though dry and heavy on reading."
      zh: "入门讲所得税、资本利得税、附加福利税和 GST。同学说结构清楚、教得好，对生活也有用，但内容枯燥、阅读量大。"
      zh-TW: "入門講所得稅、資本利得稅、附加福利稅和 GST。同學說架構清楚、教得好，對生活也有用，但內容枯燥、閱讀量大。"
      ja: "所得税、キャピタルゲイン税、フリンジ・ベネフィット税、GSTの入門。構成も教え方も良く生活にも役立つが、単調でリーディングが多いという。"
      ko: "소득세, 양도소득세, 부가급여세, GST 입문. 구성과 수업이 좋고 생활에도 유용하지만 건조하고 읽을 게 많다는 평."
      vi: "Nhập môn thuế thu nhập, thuế lãi vốn, thuế phúc lợi phụ và GST. Người học nói môn có cấu trúc và dạy tốt, hữu ích cho cuộc sống, dù khô và nhiều bài đọc."
      ms: "Pengenalan cukai pendapatan, CGT, cukai faedah sampingan dan GST. Pengulas kata ia tersusun dan diajar dengan baik serta berguna dalam hidup, walaupun hambar dan banyak bacaan."
      id: "Pengantar pajak penghasilan, CGT, pajak tunjangan dan GST. Pengulas bilang tersusun dan diajarkan dengan baik serta berguna untuk hidup, meski kering dan banyak bacaan."
      hi: "आयकर, CGT, फ़्रिंज बेनिफ़िट टैक्स और GST का परिचय। रिव्यूअर्स इसे अच्छी तरह व्यवस्थित, अच्छा पढ़ाया गया और जीवन में उपयोगी बताते हैं, हालाँकि यह नीरस और रीडिंग-भारी है।"
  work:
    - en: "Quizzes, assignments and an open-book final exam. One reviewer found the exam and assignments marked harshly and H1 hard to get; don't miss any quiz."
      zh: "有小测、作业和开卷期末。有同学觉得考试和作业给分严，H1 很难；小测一次都别漏。"
      zh-TW: "有小考、作業和開書期末。有同學覺得考試和作業給分嚴，H1 很難；小考一次都別漏。"
      ja: "小テスト、課題、オープンブックの期末試験。試験と課題の採点が厳しくH1は難しいという声も一つ。小テストは一度も逃さないこと。"
      ko: "퀴즈, 과제, 오픈북 기말시험이 있다. 시험과 과제 채점이 박해 H1이 어렵다는 리뷰어도 있다. 퀴즈는 하나도 놓치지 마라."
      vi: "Có quiz, bài tập và bài thi cuối kỳ mở tài liệu. Một người thấy thi và bài tập chấm gắt, khó đạt H1; đừng bỏ lỡ quiz nào."
      ms: "Kuiz, tugasan dan peperiksaan akhir buku terbuka. Seorang pengulas rasa peperiksaan dan tugasan dinilai keras dan H1 sukar; jangan terlepas mana-mana kuiz."
      id: "Kuis, tugas dan ujian akhir open book. Satu pengulas merasa ujian dan tugas dinilai keras dan H1 sulit; jangan sampai melewatkan kuis apa pun."
      hi: "क्विज़, असाइनमेंट और ओपन-बुक फ़ाइनल परीक्षा। एक रिव्यूअर को परीक्षा और असाइनमेंट की मार्किंग सख़्त और H1 कठिन लगा; कोई भी क्विज़ न छोड़ें।"
  study:
    - en: "Prepare for tutorials and write up full answers afterwards, since the questions mirror the exam; make your own notes during semester to bring into the open-book exam."
      zh: "tutorial 前做好准备，课后把完整答案写出来，因为题目和考试结构一样；学期中自己整理笔记，带进开卷考试。"
      zh-TW: "tutorial 前做好準備，課後把完整答案寫出來，因為題目和考試結構一樣；學期中自己整理筆記，帶進開書考試。"
      ja: "チュートリアルの問題は試験と同じ形式なので、準備して臨み、後で完全な答案を書く。学期中に自分のノートを作り、オープンブック試験に持ち込む。"
      ko: "튜토리얼 문제가 시험과 같은 구조라 준비해 가고 끝난 뒤 완전한 답안을 써 두라. 학기 중 직접 노트를 만들어 오픈북 시험에 가져가라."
      vi: "Chuẩn bị trước tutorial và viết đầy đủ đáp án sau buổi học vì câu hỏi giống đề thi; tự làm ghi chú trong kỳ để mang vào bài thi mở tài liệu."
      ms: "Bersedia untuk tutorial dan tulis jawapan penuh selepasnya kerana soalan menyerupai peperiksaan; buat nota sendiri sepanjang semester untuk dibawa ke peperiksaan buku terbuka."
      id: "Siapkan diri untuk tutorial dan tulis jawaban lengkap setelahnya, karena soalnya mirip ujian; buat catatan sendiri selama semester untuk dibawa ke ujian open book."
      hi: "ट्यूटोरियल की तैयारी करके जाएँ और बाद में पूरे उत्तर लिखें, क्योंकि सवाल परीक्षा जैसे होते हैं; सेमेस्टर में अपने नोट्स बनाएँ ताकि ओपन-बुक परीक्षा में ले जा सकें।"
  watch:
    - en: "Only one review is from after 2020, so details may be out of date. One reviewer warns bought notes may get you a pass but not a high mark."
      zh: "2020 年以后只有一条评价，细节可能过时。有同学提醒买来的笔记也许能让你及格，但拿不了高分。"
      zh-TW: "2020 年以後只有一則評價，細節可能過時。有同學提醒買來的筆記也許能讓你及格，但拿不到高分。"
      ja: "2020年より後のレビューは1件だけで、詳細は古い可能性がある。買ったノートでは合格はできても高得点は難しいという注意も一つ。"
      ko: "2020년 이후 리뷰는 하나뿐이라 세부 내용이 바뀌었을 수 있다. 산 노트로는 통과는 해도 고득점은 어렵다는 경고도 있다."
      vi: "Chỉ có một đánh giá sau 2020 nên chi tiết có thể đã cũ. Một người cảnh báo ghi chú mua sẵn có thể giúp qua môn nhưng khó đạt điểm cao."
      ms: "Hanya satu ulasan selepas 2020, jadi butiran mungkin lapuk. Seorang pengulas beri amaran nota yang dibeli mungkin bantu lulus tetapi bukan markah tinggi."
      id: "Hanya satu ulasan setelah 2020, jadi detailnya mungkin usang. Satu pengulas mengingatkan catatan yang dibeli mungkin bisa membuatmu lulus tapi tidak dapat nilai tinggi."
      hi: "2020 के बाद सिर्फ़ एक रिव्यू है, तो जानकारी पुरानी हो सकती है। एक रिव्यूअर चेताते हैं कि ख़रीदे नोट्स से पास तो हो सकते हैं, पर ऊँचे अंक नहीं।"
tags: [practice-repeats]
workload: heavy
