points:
  - en: "All three reviewers (2019-2026) recommend it, including as a breadth: you get credit for workplace experience, plus a few classes on top of your placement hours."
    zh: "三位评论者（2019-2026）都推荐，包括作为跨学科选修：工作经验可以算学分，除实习时数外只需上少量课。"
    zh-TW: "三位評論者（2019-2026）都推薦，包括作為Breadth選修：工作經驗可以算學分，除實習時數外只需上少量課。"
    ja: "3人全員（2019-2026）がBreadthとしても推薦。職場経験で単位が取れ、実習時間に加えて少しの授業があるだけ。"
    ko: "리뷰어 3명 모두(2019-2026) Breadth로도 추천. 직장 경험으로 학점을 받고, 실습 시간 외에 수업은 조금뿐."
    vi: "Cả ba người (2019-2026) đều giới thiệu, kể cả làm Breadth: kinh nghiệm làm việc được tính tín chỉ, ngoài giờ thực tập chỉ có vài buổi học."
    ms: "Ketiga-tiga pengulas (2019-2026) mengesyorkannya, termasuk sebagai Breadth: anda dapat kredit untuk pengalaman kerja, dengan beberapa kelas selain jam penempatan."
    id: "Ketiga pengulas (2019-2026) merekomendasikannya, termasuk sebagai Breadth: pengalaman kerja dihitung kredit, ditambah beberapa kelas selain jam magang."
    hi: "तीनों रिव्यूअर्स (2019-2026) इसकी सिफ़ारिश करते हैं, Breadth के रूप में भी: कार्यस्थल अनुभव के लिए क्रेडिट मिलता है, प्लेसमेंट घंटों के अलावा कुछ क्लास के साथ।"
  - en: "Assignments are reflective, focusing on your career thinking rather than performance, and were called manageable with plenty of support. Timetabling can be confusing at first."
    zh: "作业以反思为主，关注你的职业思考而非表现，被认为可以应付，支持也充足。排课一开始可能让人困惑。"
    zh-TW: "作業以反思為主，關注你的職涯思考而非表現，被認為可以應付，支援也充足。排課一開始可能讓人困惑。"
    ja: "課題は振り返り型で、成果ではなくキャリアについての考えに焦点を当てる。サポートも多く無理なくこなせるとされた。時間割は最初わかりにくいことも。"
    ko: "과제는 성찰형으로 성과가 아닌 진로에 대한 생각에 초점. 지원이 많아 할 만하다는 평. 시간표 짜기는 처음엔 헷갈릴 수 있음."
    vi: "Bài tập mang tính phản tư, tập trung vào định hướng nghề nghiệp hơn là hiệu suất, được cho là vừa sức với nhiều hỗ trợ. Việc xếp lịch ban đầu có thể rối."
    ms: "Tugasan bersifat reflektif, fokus pada pemikiran kerjaya dan bukan prestasi, dan dikatakan boleh diurus dengan banyak sokongan. Penjadualan boleh mengelirukan pada awalnya."
    id: "Tugas bersifat reflektif, fokus pada pemikiran karier bukan kinerja, dan disebut bisa dikelola dengan banyak dukungan. Penjadwalan bisa membingungkan di awal."
    hi: "असाइनमेंट रिफ़्लेक्टिव हैं, प्रदर्शन के बजाय करियर सोच पर केंद्रित, और भरपूर सहायता के साथ संभालने लायक बताए गए। शुरुआत में टाइमटेबल उलझा सकता है।"
workload: light
difficulty: easy
