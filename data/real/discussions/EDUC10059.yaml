points:
  - en: "Reviewers loved the content as practical and relevant to their own lives, and praised the approachable teaching staff."
    zh: "评论者很喜欢内容，觉得实用、贴近生活，也称赞老师平易近人。"
    zh-TW: "評論者很喜歡內容，覺得實用、貼近生活，也稱讚老師平易近人。"
    ja: "内容が実用的で自分の生活に役立つと好評で、親しみやすい教員も評価されている。"
    ko: "내용이 실용적이고 내 삶과 연결된다는 호평, 친근한 교수진도 칭찬받음."
    vi: "Mọi người rất thích nội dung vì thực tế, gắn với cuộc sống, và khen giảng viên dễ gần."
    ms: "Pengulas suka kandungannya yang praktikal dan relevan, serta memuji staf yang mudah didekati."
    id: "Pengulas menyukai materinya yang praktis dan relevan dengan hidup, serta memuji staf yang ramah."
    hi: "रिव्यूअर्स को सामग्री व्यावहारिक और जीवन से जुड़ी लगी, और स्टाफ़ की सहजता की तारीफ़ की।"
  - en: "Older reviews warn that group work was a big share of the mark, so your group could affect your grade."
    zh: "较早的评论提醒小组作业占分很大，组员会影响成绩。"
    zh-TW: "較早的評論提醒小組作業占分很大，組員會影響成績。"
    ja: "以前のレビューでは、グループ課題の比重が大きく、メンバー次第で成績が左右されたとの注意も。"
    ko: "예전 리뷰는 조별 과제 비중이 커서 조원에 따라 성적이 달라질 수 있다고 경고함."
    vi: "Các review cũ cảnh báo bài nhóm chiếm nhiều điểm, nên nhóm có thể ảnh hưởng điểm số."
    ms: "Ulasan lama memberi amaran kerja berkumpulan membawa markah besar, jadi kumpulan boleh menjejaskan gred."
    id: "Ulasan lama mengingatkan tugas kelompok porsinya besar, jadi kelompok bisa memengaruhi nilai."
    hi: "पुराने रिव्यू चेताते हैं कि समूह कार्य का भार बड़ा था, इसलिए समूह आपके ग्रेड पर असर डाल सकता है।"
  - en: "Reflective writing is new for some, but most felt an H1 is reachable with steady effort."
    zh: "反思性写作对一些人来说很陌生，但多数人认为认真投入就能拿H1。"
    zh-TW: "反思性寫作對一些人來說很陌生，但多數人認為認真投入就能拿H1。"
    ja: "振り返り型の文章に慣れない人もいるが、着実に取り組めばH1は狙えるとの声が多い。"
    ko: "성찰형 글쓰기가 낯설 수 있지만, 꾸준히 노력하면 H1이 가능하다는 의견이 대부분."
    vi: "Viết phản tư lạ với một số người, nhưng đa số thấy cố gắng đều đặn là đạt H1."
    ms: "Penulisan reflektif baharu bagi sesetengah orang, tetapi ramai rasa H1 boleh dicapai dengan usaha."
    id: "Menulis reflektif baru bagi sebagian orang, tapi mayoritas merasa H1 bisa dicapai dengan usaha konsisten."
    hi: "चिंतनात्मक लेखन कुछ के लिए नया है, पर ज़्यादातर को लगा लगातार मेहनत से H1 मिल सकता है।"
workload: mixed
