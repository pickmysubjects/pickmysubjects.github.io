points:
  - en: "Several reviewers found it dry; it reads more like literature or art history than a typical law subject."
    zh: "好几位评论者觉得比较枯燥；它更像文学或艺术史，而不是典型的法律课。"
    zh-TW: "好幾位評論者覺得比較枯燥；它更像文學或藝術史，而不是典型的法律課。"
    ja: "退屈だという声が複数。普通の法律科目より文学や美術史に近い。"
    ko: "여러 리뷰어가 지루하다고 함. 일반 법학 과목보다 문학이나 미술사에 가까움."
    vi: "Nhiều người thấy khô khan; môn giống văn học hay lịch sử nghệ thuật hơn là môn luật thông thường."
    ms: "Beberapa pengulas rasa ia hambar; lebih mirip sastera atau sejarah seni daripada subjek undang-undang biasa."
    id: "Beberapa pengulas merasa kering; lebih mirip sastra atau sejarah seni daripada mata kuliah hukum biasa."
    hi: "कई रिव्यूअर्स को यह नीरस लगा; यह आम क़ानून विषय से ज़्यादा साहित्य या कला इतिहास जैसा है।"
  - en: "It is described as complex: less content to learn, more interpreting and forming your own critical view."
    zh: "被形容为有难度：要背的内容不多，但需要大量解读并形成自己的观点。"
    zh-TW: "被形容為有難度：要背的內容不多，但需要大量解讀並形成自己的觀點。"
    ja: "覚える内容は少ないが、解釈して自分の批判的な見方を作る必要があり難しいとされる。"
    ko: "외울 내용은 적지만 해석하고 자기 비판적 관점을 세워야 해서 어렵다는 평."
    vi: "Được cho là phức tạp: ít nội dung phải học, nhưng phải diễn giải và tự hình thành quan điểm."
    ms: "Digambarkan kompleks: kurang kandungan, lebih banyak tafsiran dan membentuk pandangan kritis sendiri."
    id: "Disebut rumit: materinya sedikit, tapi banyak menafsirkan dan membangun pandangan kritis sendiri."
    hi: "इसे जटिल बताया गया: रटना कम, व्याख्या करना और अपनी आलोचनात्मक राय बनाना ज़्यादा।"
  - en: "Those who liked it praised the teaching and the freedom to pick the final essay topic; joining class discussion helps."
    zh: "喜欢的人称赞教学，也喜欢期末论文可以自选题目；积极参与课堂讨论会有帮助。"
    zh-TW: "喜歡的人稱讚教學，也喜歡期末論文可以自選題目；積極參與課堂討論會有幫助。"
    ja: "好評な人は授業の質と期末エッセイのテーマを選べる自由を評価。授業の議論に参加すると良い。"
    ko: "좋게 본 사람들은 수업과 기말 에세이 주제 선택의 자유를 칭찬함. 수업 토론 참여가 도움 됨."
    vi: "Người thích môn khen cách dạy và được tự chọn đề tài luận cuối kỳ; tham gia thảo luận trên lớp sẽ có lợi."
    ms: "Yang suka memuji pengajaran dan kebebasan memilih topik esei akhir; menyertai perbincangan kelas membantu."
    id: "Yang suka memuji pengajaran dan kebebasan memilih topik esai akhir; aktif berdiskusi di kelas membantu."
    hi: "पसंद करने वालों ने पढ़ाई और अंतिम निबंध का विषय चुनने की आज़ादी की तारीफ़ की; क्लास चर्चा में हिस्सा लेना मददगार है।"
difficulty: hard
