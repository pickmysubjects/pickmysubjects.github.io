code: LAWS20008
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/laws20008
reviews: 5
from: 2018
to: 2023
checked: 2026-10-19
points:
  - en: "Several reviewers found it dry; it reads more like literature or art history than a typical law subject."
    zh: "好几位评论者觉得比较枯燥；它更像文学或艺术史，而不是典型的法律课。"
    zh-TW: "好幾位評論者覺得比較枯燥；它更像文學或藝術史，而不是典型的法律課。"
    ja: "退屈だという声が複数。普通の法律科目より文学や美術史に近い。"
    ko: "여러 리뷰어가 지루하다고 함. 일반 법학 과목보다 문학이나 미술사에 가까움."
    vi: "Nhiều người thấy khô khan; môn giống văn học hay lịch sử nghệ thuật hơn là môn luật thông thường."
    ms: "Beberapa pengulas rasa ia hambar; lebih mirip sastera atau sejarah seni daripada subjek undang-undang biasa."
    id: "Beberapa pengulas merasa kering; lebih mirip sastra atau sejarah seni daripada mata kuliah hukum biasa."
    hi: "कई रिव्यूअर्स को यह नीरस लगा; यह आम क़ानून विषय से ज़्यादा साहित्य या कला इतिहास जैसा है।"
  - en: "It is described as complex: less content to learn, more interpreting and forming your own critical view."
    zh: "被形容为有难度：要背的内容不多，但需要大量解读并形成自己的观点。"
    zh-TW: "被形容為有難度：要背的內容不多，但需要大量解讀並形成自己的觀點。"
    ja: "覚える内容は少ないが、解釈して自分の批判的な見方を作る必要があり難しいとされる。"
    ko: "외울 내용은 적지만 해석하고 자기 비판적 관점을 세워야 해서 어렵다는 평."
    vi: "Được cho là phức tạp: ít nội dung phải học, nhưng phải diễn giải và tự hình thành quan điểm."
    ms: "Digambarkan kompleks: kurang kandungan, lebih banyak tafsiran dan membentuk pandangan kritis sendiri."
    id: "Disebut rumit: materinya sedikit, tapi banyak menafsirkan dan membangun pandangan kritis sendiri."
    hi: "इसे जटिल बताया गया: रटना कम, व्याख्या करना और अपनी आलोचनात्मक राय बनाना ज़्यादा।"
  - en: "Those who liked it praised the teaching and the freedom to pick the final essay topic; joining class discussion helps."
    zh: "喜欢的人称赞教学，也喜欢期末论文可以自选题目；积极参与课堂讨论会有帮助。"
    zh-TW: "喜歡的人稱讚教學，也喜歡期末論文可以自選題目；積極參與課堂討論會有幫助。"
    ja: "好評な人は授業の質と期末エッセイのテーマを選べる自由を評価。授業の議論に参加すると良い。"
    ko: "좋게 본 사람들은 수업과 기말 에세이 주제 선택의 자유를 칭찬함. 수업 토론 참여가 도움 됨."
    vi: "Người thích môn khen cách dạy và được tự chọn đề tài luận cuối kỳ; tham gia thảo luận trên lớp sẽ có lợi."
    ms: "Yang suka memuji pengajaran dan kebebasan memilih topik esei akhir; menyertai perbincangan kelas membantu."
    id: "Yang suka memuji pengajaran dan kebebasan memilih topik esai akhir; aktif berdiskusi di kelas membantu."
    hi: "पसंद करने वालों ने पढ़ाई और अंतिम निबंध का विषय चुनने की आज़ादी की तारीफ़ की; क्लास चर्चा में हिस्सा लेना मददगार है।"
sections:
  content:
    - en: "How language works in judgments and legal texts. It's interpretive rather than content-heavy and feels more like arts, literature or art history than law, which some found dry."
      zh: "讲语言在判决书和法律文本中如何运作。偏重诠释而不是大量知识点，感觉更像文学、艺术史而不是法律，有些人觉得枯燥。"
      zh-TW: "講語言在判決書和法律文本中如何運作。偏重詮釋而不是大量知識點，感覺更像文學、藝術史而不是法律，有些人覺得枯燥。"
      ja: "判決や法的文書で言語がどう働くか。内容量より解釈重視で、法律より文学や美術史のように感じられ、退屈という人も。"
      ko: "판결문과 법률 문서에서 언어가 어떻게 작동하는지 다룬다. 내용 암기보다 해석 중심이며 법보다 문학이나 미술사 같아서 건조하다는 사람도 있다."
      vi: "Ngôn ngữ vận hành thế nào trong bản án và văn bản pháp lý. Thiên về diễn giải hơn là nhiều kiến thức, giống văn học hay lịch sử nghệ thuật hơn luật, nên vài người thấy khô."
      ms: "Cara bahasa berfungsi dalam penghakiman dan teks undang-undang. Lebih kepada tafsiran daripada kandungan berat, terasa seperti sastera atau sejarah seni berbanding undang-undang, dan ada yang rasa hambar."
      id: "Cara bahasa bekerja dalam putusan dan teks hukum. Lebih interpretatif daripada padat materi, terasa seperti sastra atau sejarah seni daripada hukum, sehingga sebagian merasa kering."
      hi: "फ़ैसलों और कानूनी पाठों में भाषा कैसे काम करती है। ज़्यादा सामग्री के बजाय व्याख्या पर ज़ोर, कानून से ज़्यादा साहित्य या कला इतिहास जैसा लगता है, जिससे कुछ को नीरस लगा।"
  work:
    - en: "You need to form your own critical opinions. The final essay is flexible, so you can focus on what interests you; one reviewer found the marking strange."
      zh: "需要形成自己的批判性观点。期末论文比较自由，可以挑你感兴趣的写；有同学觉得评分有点怪。"
      zh-TW: "需要形成自己的批判性觀點。期末論文比較自由，可以挑你有興趣的寫；有同學覺得評分有點怪。"
      ja: "自分なりの批判的な意見を持つ必要がある。最終エッセイは自由度が高く興味のあることに絞れる。採点が変だったという人も一人。"
      ko: "자신만의 비판적 의견을 세워야 한다. 기말 에세이는 자유로워 관심 있는 것에 집중할 수 있다. 채점이 이상했다는 사람도 있다."
      vi: "Bạn cần tự hình thành quan điểm phản biện. Bài luận cuối khá tự do, có thể tập trung điều mình thích; một người thấy cách chấm kỳ lạ."
      ms: "Anda perlu membentuk pendapat kritis sendiri. Esei akhir fleksibel, jadi boleh fokus pada minat; seorang rasa pemarkahan pelik."
      id: "Kamu perlu membentuk opini kritis sendiri. Esai akhir fleksibel, jadi bisa fokus pada minatmu; satu merasa penilaiannya aneh."
      hi: "आपको अपनी आलोचनात्मक राय बनानी होती है। फ़ाइनल निबंध लचीला है, तो अपनी रुचि पर ध्यान दे सकते हैं; एक को जाँच अजीब लगी।"
  watch:
    - en: "One reviewer suggests taking it only if you're into literature, fine art or architecture, and joining in discussions. Reviews are from 2023 or earlier."
      zh: "有同学建议，只有对文学、美术或建筑感兴趣才选，并多参与讨论。评价都是 2023 年或更早的。"
      zh-TW: "有同學建議，只有對文學、美術或建築有興趣才選，並多參與討論。評價都是 2023 年或更早的。"
      ja: "文学、美術、建築に興味がある人だけ取り、議論に参加するよう勧める人がいる。レビューは2023年以前のもの。"
      ko: "문학, 미술, 건축에 관심 있을 때만 듣고 토론에 참여하라는 리뷰가 있다. 리뷰는 2023년 이전이다."
      vi: "Một người khuyên chỉ học nếu thích văn học, mỹ thuật hoặc kiến trúc, và hãy tham gia thảo luận. Các đánh giá từ 2023 trở về trước."
      ms: "Seorang cadang ambil hanya jika minat sastera, seni halus atau seni bina, dan sertai perbincangan. Ulasan dari 2023 atau lebih awal."
      id: "Satu menyarankan ambil hanya jika suka sastra, seni rupa atau arsitektur, dan ikut berdiskusi. Ulasan dari 2023 atau sebelumnya."
      hi: "एक सुझाव देता है इसे तभी लें जब साहित्य, ललित कला या वास्तुकला में रुचि हो, और चर्चाओं में भाग लें। रिव्यू 2023 या पहले के हैं।"
