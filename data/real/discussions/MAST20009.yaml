points:
  - en: "Feels like an extension of Calculus 2; enjoyable if you liked that subject."
    zh: "像是微积分2的延伸，喜欢那门课的人会喜欢它。"
    zh-TW: "像是微積分2的延伸，喜歡那門課的人會喜歡它。"
    ja: "Calculus 2の延長のような感じ。あの科目が好きなら楽しめる。"
    ko: "Calculus 2의 연장처럼 느껴진다. 그 과목을 좋아했다면 즐길 수 있다."
    vi: "Giống phần mở rộng của Calculus 2; thích môn đó thì sẽ thích môn này."
    ms: "Terasa seperti lanjutan Calculus 2; seronok jika anda suka subjek itu."
    id: "Terasa seperti lanjutan Calculus 2; menyenangkan kalau kamu suka mata kuliah itu."
    hi: "Calculus 2 का विस्तार जैसा लगता है; वह सब्जेक्ट पसंद था तो यह भी अच्छा लगेगा।"
  - en: "The exam is heavily weighted (about 80%), so a bad exam hurts a lot; secure assignment marks."
    zh: "考试占比很高（约80%），考砸影响很大，要拿稳作业分。"
    zh-TW: "考試占比很高（約80%），考砸影響很大，要拿穩作業分。"
    ja: "試験の比重が大きく（約80%）、失敗すると痛手。課題点は確実に取ろう。"
    ko: "시험 비중이 커서(약 80%) 시험을 망치면 타격이 크다. 과제 점수를 확보하자."
    vi: "Bài thi chiếm tỷ trọng lớn (khoảng 80%), thi tệ là ảnh hưởng nhiều; hãy chắc điểm bài tập."
    ms: "Peperiksaan berwajaran tinggi (kira-kira 80%), jadi gagal peperiksaan sangat menjejaskan; kumpul markah tugasan."
    id: "Ujian berbobot besar (sekitar 80%), jadi ujian buruk sangat merugikan; amankan nilai tugas."
    hi: "एग्ज़ाम का वेट बहुत है (करीब 80%), खराब एग्ज़ाम बहुत नुकसान करता है; असाइनमेंट के मार्क्स पक्के करें।"
  - en: "Well organised with good materials; notation is confronting at first but manageable."
    zh: "组织良好、资料充分；符号起初令人生畏，但可以掌握。"
    zh-TW: "組織良好、資料充足；符號一開始令人卻步，但可以掌握。"
    ja: "運営が良く教材も充実。記法は最初とっつきにくいが慣れれば大丈夫。"
    ko: "운영이 잘 되고 자료가 좋다. 표기법이 처음엔 부담스럽지만 할 만하다."
    vi: "Tổ chức tốt, tài liệu tốt; ký hiệu lúc đầu gây choáng nhưng vẫn xử lý được."
    ms: "Teratur dengan bahan yang baik; notasi menggerunkan pada mulanya tetapi boleh diurus."
    id: "Tertata dengan materi bagus; notasinya awalnya bikin kaget tapi masih bisa diatasi."
    hi: "अच्छी तरह ऑर्गनाइज़्ड, अच्छे मटीरियल; नोटेशन पहले डराता है पर संभल जाता है।"
  - en: "Not very rigorous on proofs; an advanced stream exists for those who want more."
    zh: "证明不够严谨，想要更深入可选高级版。"
    zh-TW: "證明不太嚴謹，想深入可選進階版。"
    ja: "証明の厳密さはあまりない。もっと学びたい人には上級コースがある。"
    ko: "증명 면에서는 엄밀하지 않다. 더 원하면 심화 과정이 있다."
    vi: "Không quá chặt chẽ về chứng minh; có lớp nâng cao cho ai muốn học thêm."
    ms: "Tidak begitu ketat dari segi bukti; ada aliran lanjutan bagi yang mahu lebih."
    id: "Tidak terlalu ketat soal pembuktian; ada kelas lanjutan bagi yang ingin lebih."
    hi: "प्रूफ़ पर ज़्यादा सख़्त नहीं; ज़्यादा चाहने वालों के लिए एडवांस्ड स्ट्रीम है।"
sections:
  content:
    - en: "Multivariable and vector calculus, building to the big integral theorems; feels like an extension of Calculus 2 and some Linear Algebra. Most found it interesting and well organised."
      zh: "多元和向量微积分，最后串到几大积分定理；感觉像 Calculus 2 加一点线性代数的延伸。多数人觉得有趣、组织得好。"
      zh-TW: "多變數和向量微積分，最後串到幾大積分定理；感覺像 Calculus 2 加一點線性代數的延伸。多數人覺得有趣、組織得好。"
      ja: "多変数・ベクトル解析で、最後に主要な積分定理へつながる。Calculus 2と線形代数の延長のような内容。面白くよく構成されているという声が多い。"
      ko: "다변수·벡터 미적분으로 주요 적분 정리로 이어진다. Calculus 2와 선형대수의 연장 같다. 대부분 흥미롭고 잘 구성됐다고 한다."
      vi: "Giải tích nhiều biến và vector, dẫn đến các định lý tích phân lớn; giống phần mở rộng của Calculus 2 và chút Đại số tuyến tính. Đa số thấy thú vị, tổ chức tốt."
      ms: "Kalkulus pelbagai pemboleh ubah dan vektor, membawa kepada teorem kamiran utama; terasa seperti lanjutan Calculus 2 dan sedikit Linear Algebra. Kebanyakan rasa menarik dan tersusun."
      id: "Kalkulus multivariabel dan vektor, berujung pada teorema integral besar; terasa seperti lanjutan Calculus 2 dan sedikit Linear Algebra. Kebanyakan merasa menarik dan teratur."
      hi: "बहुचर और वेक्टर कैलकुलस, जो बड़े समाकलन प्रमेयों तक पहुँचता है; Calculus 2 और थोड़े रैखिक बीजगणित का विस्तार लगता है। ज़्यादातर को रोचक और व्यवस्थित लगा।"
    - en: "Harder than Calculus 2 for some, so be confident with integration and 3D shapes; those with an analysis background may find it light on rigour."
      zh: "有人觉得比 Calculus 2 难，积分和三维空间感要扎实；学过分析的人可能会觉得不够严谨。"
      zh-TW: "有人覺得比 Calculus 2 難，積分和三維空間感要紮實；學過分析的人可能會覺得不夠嚴謹。"
      ja: "Calculus 2より難しいと感じる人もいるので、積分と3次元の図形感覚に自信が必要。解析の素養がある人には厳密さが物足りないかも。"
      ko: "Calculus 2보다 어렵다는 사람도 있으니 적분과 3차원 공간 감각에 자신이 있어야 한다. 해석학 배경이 있으면 엄밀성이 부족하게 느껴질 수 있다."
      vi: "Với một số người khó hơn Calculus 2, nên cần vững tích phân và hình 3D; ai có nền giải tích có thể thấy thiếu chặt chẽ."
      ms: "Lebih sukar daripada Calculus 2 bagi sesetengah orang, jadi perlu yakin dengan kamiran dan bentuk 3D; yang ada latar analisis mungkin rasa kurang rapi."
      id: "Bagi sebagian orang lebih sulit dari Calculus 2, jadi harus yakin dengan integral dan bentuk 3D; yang punya latar analisis mungkin merasa kurang ketat."
      hi: "कुछ के लिए Calculus 2 से कठिन, इसलिए समाकलन और 3D आकृतियों में भरोसा चाहिए; एनालिसिस बैकग्राउंड वालों को इसमें कठोरता कम लग सकती है।"
  work:
    - en: "The exam is heavily weighted (one reviewer says 80%), so a bad day costs a lot; securing the assignment marks helps. One reviewer found marking not harsh."
      zh: "期末比重很大（有同学说 80%），考砸代价很高；作业分要拿稳。有人觉得给分不算严。"
      zh-TW: "期末比重很大（有同學說 80%），考砸代價很高；作業分要拿穩。有人覺得給分不算嚴。"
      ja: "期末の比重が大きく（80%という人も）、失敗すると痛い。課題の点を確保しておくと楽。採点は厳しくないという人も。"
      ko: "기말 비중이 커서(80%라는 사람도) 망치면 타격이 크다. 과제 점수를 확보해 두면 좋다. 채점이 박하지 않다는 사람도 있다."
      vi: "Thi cuối chiếm tỷ trọng lớn (một người nói 80%), thi hỏng là mất nhiều; giữ chắc điểm bài tập sẽ đỡ. Một người thấy chấm không khắt khe."
      ms: "Peperiksaan sangat berat (seorang kata 80%), jadi hari buruk sangat merugikan; pastikan markah tugasan. Seorang dapati pemarkahan tidak ketat."
      id: "Ujian akhir berbobot besar (satu bilang 80%), jadi gagal di hari itu sangat merugikan; amankan nilai tugas. Satu merasa penilaiannya tidak ketat."
      hi: "परीक्षा का वज़न बहुत है (एक के अनुसार 80%), इसलिए ख़राब दिन बहुत भारी पड़ता है; असाइनमेंट के अंक पक्के करें। एक को अंकन सख़्त नहीं लगा।"
  study:
    - en: "Keep on top of the content, attend lectures, and do lots of past papers and tutorial problems; consultations help."
      zh: "跟上内容，去上讲座，多做往年卷和 tutorial 题；答疑时间很有帮助。"
      zh-TW: "跟上內容，去上講座，多做考古題和 tutorial 題；答疑時間很有幫助。"
      ja: "内容についていき、講義に出て、過去問とチュートリアルの問題を多く解く。質問時間も役立つ。"
      ko: "내용을 따라가고 강의에 참석하며 기출과 튜토리얼 문제를 많이 풀어라. 상담 시간도 도움이 된다."
      vi: "Theo kịp nội dung, đi học đầy đủ, làm nhiều đề cũ và bài tutorial; giờ tư vấn rất có ích."
      ms: "Kekal mengikut kandungan, hadir kuliah, dan buat banyak kertas lepas dan soalan tutorial; sesi konsultasi membantu."
      id: "Ikuti materi, hadiri kuliah, dan kerjakan banyak ujian lama dan soal tutorial; jam konsultasi membantu."
      hi: "कंटेंट के साथ बने रहें, लेक्चर में जाएँ, और ढेर सारे पुराने पेपर व ट्यूटोरियल सवाल करें; कंसल्टेशन मदद करते हैं।"
difficulty: easy
