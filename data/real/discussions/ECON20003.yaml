points:
  - en: "Uses statistical software (formerly EViews, more recently R), which several found painful or not very relevant to the exam."
    zh: "需要使用统计软件（早年EViews，近年R），不少人觉得难用，且与考试关系不大。"
    zh-TW: "需要使用統計軟體（早年EViews，近年R），不少人覺得難用，而且跟考試關係不大。"
    ja: "統計ソフト（以前はEViews、最近はR）を使う。使いにくい、試験とあまり関係ないと感じた人が多い。"
    ko: "통계 소프트웨어(예전엔 EViews, 최근엔 R)를 쓰는데, 불편하거나 시험과 별 관련 없다는 의견이 여럿."
    vi: "Dùng phần mềm thống kê (trước là EViews, gần đây là R), nhiều người thấy khó dùng hoặc ít liên quan đến bài thi."
    ms: "Guna perisian statistik (dulu EViews, kini R), yang ramai rasa menyusahkan atau kurang berkaitan dengan peperiksaan."
    id: "Memakai software statistik (dulu EViews, kini R), yang banyak orang anggap menyulitkan atau kurang relevan untuk ujian."
    hi: "स्टैटिस्टिकल सॉफ़्टवेयर (पहले EViews, अब R) इस्तेमाल होता है, जो कई लोगों को झंझट भरा या एग्ज़ाम से कम जुड़ा लगा।"
  - en: "Frequent assignments and quizzes take a lot of time for little weight, but the final exam was described as fair and similar to practice papers."
    zh: "作业和小测频繁、耗时多但占分少；期末考试较公平，与练习卷相似。"
    zh-TW: "作業和小考頻繁、耗時多但占分少；期末考較公平，和練習卷相似。"
    ja: "課題や小テストが多く時間がかかる割に配点は低い。期末試験は公平で練習問題と似ていた。"
    ko: "잦은 과제와 퀴즈는 시간은 많이 들지만 비중이 작고, 기말시험은 공정하며 연습 문제와 비슷했다고 함."
    vi: "Bài tập và quiz dày đặc, tốn thời gian mà ít điểm, nhưng thi cuối kỳ được cho là công bằng và giống đề luyện tập."
    ms: "Tugasan dan kuiz yang kerap makan masa tapi wajaran kecil, namun peperiksaan akhir dikatakan adil dan serupa kertas latihan."
    id: "Tugas dan kuis yang sering menyita waktu tapi bobotnya kecil, namun ujian akhir dinilai adil dan mirip soal latihan."
    hi: "बार-बार के असाइनमेंट और क्विज़ में समय बहुत लगता है पर वेटेज कम है, लेकिन फ़ाइनल एग्ज़ाम निष्पक्ष और प्रैक्टिस पेपर जैसा बताया गया।"
  - en: "Keeping up with lectures and doing past papers is the main advice; opinions on lecture quality are split."
    zh: "主要建议是跟上讲课进度并做历年真题；对讲课质量评价不一。"
    zh-TW: "主要建議是跟上上課進度並寫考古題；對講課品質評價不一。"
    ja: "講義についていき過去問を解くのが一番のアドバイス。講義の質については意見が分かれる。"
    ko: "강의를 놓치지 말고 기출문제를 풀라는 것이 주된 조언이며, 강의 질에 대한 의견은 갈림."
    vi: "Lời khuyên chính là theo kịp bài giảng và làm đề cũ; ý kiến về chất lượng bài giảng trái chiều."
    ms: "Nasihat utama ialah ikut kuliah dan buat kertas lepas; pendapat tentang kualiti kuliah berbelah bahagi."
    id: "Saran utama: ikuti kuliah dan kerjakan soal tahun lalu; pendapat soal kualitas kuliah terbelah."
    hi: "मुख्य सलाह है लेक्चर के साथ चलते रहें और पिछले पेपर करें; लेक्चर की क्वालिटी पर राय बँटी है।"
sections:
  content:
    - en: "Builds on QM1: hypothesis tests, simple and multiple regression, logit models and time series. Several found it manageable once the lecture content clicks; one called it easier than QM1."
      zh: "在 QM1 基础上继续：假设检验、简单和多元回归、logit 模型和时间序列。好几位说理解了 lecture 内容就不难；有一位觉得比 QM1 简单。"
      zh-TW: "在 QM1 基礎上延伸：假設檢定、簡單與多元迴歸、logit 模型和時間序列。好幾位說理解 lecture 內容就不難；有一位覺得比 QM1 簡單。"
      ja: "QM1の続きで、仮説検定、単回帰・重回帰、ロジットモデル、時系列。講義内容が分かれば難しくないという声が複数。QM1より楽だったという人が一人。"
      ko: "QM1에 이어 가설 검정, 단순·다중 회귀, 로짓 모형, 시계열을 다룬다. 강의 내용을 이해하면 할 만하다는 리뷰가 여럿. QM1보다 쉬웠다는 사람이 한 명."
      vi: "Tiếp nối QM1: kiểm định giả thuyết, hồi quy đơn và bội, mô hình logit và chuỗi thời gian. Vài người thấy dễ xoay xở khi đã hiểu bài giảng; một người nói dễ hơn QM1."
      ms: "Sambungan QM1: ujian hipotesis, regresi mudah dan berganda, model logit dan siri masa. Beberapa rasa boleh diurus bila kandungan kuliah difahami; seorang kata lebih mudah dari QM1."
      id: "Lanjutan QM1: uji hipotesis, regresi sederhana dan berganda, model logit, dan deret waktu. Beberapa merasa bisa diatasi setelah materi kuliah dipahami; satu bilang lebih mudah dari QM1."
      hi: "QM1 के आगे: हाइपोथीसिस टेस्ट, सिंपल और मल्टीपल रिग्रेशन, लॉजिट मॉडल और टाइम सीरीज़। कई को लेक्चर समझने के बाद संभलने लायक लगा; एक ने इसे QM1 से आसान कहा।"
  work:
    - en: "Frequent long assignments and weekly quizzes are worth little but take lots of time in stats software (R lately, EViews before). It barely shows up in the final, which one found like the practice exam."
      zh: "作业频繁又长、每周还有小测，占分少却很花时间，要用统计软件（近年是 R，早年是 EViews）。期末几乎不考软件；有一位同学说期末和模拟考相似。"
      zh-TW: "作業頻繁又長、每週還有小考，配分少卻很花時間，要用統計軟體（近年是 R，早年是 EViews）。期末幾乎不考軟體；有一位同學說期末和模擬考相似。"
      ja: "頻繁で長い課題と毎週のクイズは配点が小さいのに時間がかかり、統計ソフト（近年はR、以前はEViews）を使う。期末試験ではソフトはほぼ出ない。期末は模試に似ていたという人が一人。"
      ko: "잦고 긴 과제와 주간 퀴즈는 배점이 작은데 시간이 많이 들며, 통계 소프트웨어(최근엔 R, 예전엔 EViews)를 쓴다. 기말에선 소프트웨어가 거의 안 나온다. 기말이 모의시험과 비슷했다는 리뷰어가 한 명."
      vi: "Bài tập dài, dày đặc và quiz hằng tuần ít điểm nhưng tốn nhiều thời gian, dùng phần mềm thống kê (R gần đây, trước là EViews). Phần mềm hầu như không có trong bài thi cuối; một người thấy đề giống đề thử."
      ms: "Tugasan kerap dan panjang serta kuiz mingguan yang bernilai kecil tetapi makan masa, menggunakan perisian statistik (R kebelakangan ini, EViews dahulu). Perisian hampir tiada dalam peperiksaan akhir; seorang kata ia serupa peperiksaan latihan."
      id: "Tugas yang sering dan panjang serta kuis mingguan bernilai kecil tapi makan waktu, memakai software statistik (R belakangan ini, dulu EViews). Software hampir tak muncul di ujian akhir; satu reviewer bilang mirip ujian latihan."
      hi: "बार-बार आने वाले लंबे असाइनमेंट और साप्ताहिक क्विज़, अंक कम पर समय बहुत, स्टैटिस्टिक्स सॉफ़्टवेयर के साथ (हाल में R, पहले EViews)। फ़ाइनल में सॉफ़्टवेयर लगभग नहीं आता; एक को परीक्षा प्रैक्टिस परीक्षा जैसी लगी।"
  study:
    - en: "Stay up to date with lectures, refresh QM1 topics you've forgotten, and practise past papers, since exam questions tend to resemble them."
      zh: "跟上 lecture，把忘掉的 QM1 内容补回来，多做往年题，考题通常和往年相似。"
      zh-TW: "跟上 lecture，把忘掉的 QM1 內容補回來，多做考古題，考題通常和往年相似。"
      ja: "講義についていき、忘れたQM1の内容を復習し、過去問を練習しよう。試験問題は過去問に似ている傾向がある。"
      ko: "강의를 따라가고, 잊어버린 QM1 내용을 복습하고, 기출을 풀자. 시험 문제가 기출과 비슷한 편이다."
      vi: "Theo kịp bài giảng, ôn lại phần QM1 đã quên, và luyện đề cũ vì câu hỏi thi thường giống."
      ms: "Ikuti kuliah, segarkan semula topik QM1 yang dilupakan, dan latih kertas lepas kerana soalan peperiksaan cenderung serupa."
      id: "Ikuti kuliah, segarkan lagi topik QM1 yang terlupa, dan latihan soal lama karena soal ujian cenderung mirip."
      hi: "लेक्चर के साथ चलें, भूले हुए QM1 टॉपिक दोहराएँ, और पुराने पेपर प्रैक्टिस करें क्योंकि परीक्षा सवाल अक्सर उन जैसे होते हैं।"
  watch:
    - en: "The most recent reviews are from 2023, so the subject may have changed since."
      zh: "最新的评价是 2023 年的，这门课之后可能有变化。"
      zh-TW: "最新的評價是 2023 年的，這門課之後可能有變化。"
      ja: "最新のレビューは2023年のもので、その後内容が変わっている可能性がある。"
      ko: "가장 최근 리뷰가 2023년 것이라 이후 과목이 바뀌었을 수 있다."
      vi: "Đánh giá mới nhất là từ 2023, nên môn học có thể đã thay đổi."
      ms: "Ulasan terbaru dari 2023, jadi subjek mungkin telah berubah sejak itu."
      id: "Ulasan terbaru dari 2023, jadi mata kuliahnya mungkin sudah berubah."
      hi: "सबसे नए रिव्यू 2023 के हैं, इसलिए विषय तब से बदल सकता है।"
workload: heavy
