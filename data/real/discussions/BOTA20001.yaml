points:
  - en: "Reviewers in 2024 and 2025 called it an easy WAM booster that builds on high school plant biology. Good marks are very reachable with steady effort."
    zh: "2024和2025年的评价认为这门课是轻松拉高WAM的课，内容在高中植物生物基础上扩展，只要稳定投入，拿高分很有希望。"
    zh-TW: "2024和2025年的評價認為這門課能輕鬆拉高WAM，內容以高中植物生物為基礎延伸。穩定投入就很有機會拿高分。"
    ja: "2024年と2025年のレビューでは、高校の植物生物学を土台にした、WAMを上げやすい楽な科目とされた。地道に取り組めば高得点は十分狙える。"
    ko: "2024년과 2025년 리뷰어들은 고교 식물 생물학을 바탕으로 한, WAM 올리기 쉬운 과목이라고 했다. 꾸준히 하면 좋은 점수는 충분히 가능하다."
    vi: "Đánh giá năm 2024 và 2025 gọi đây là môn kéo WAM dễ, xây trên nền sinh học thực vật cấp 3. Chăm chỉ đều đặn thì điểm cao rất trong tầm tay."
    ms: "Pengulas pada 2024 dan 2025 menyebutnya penaik WAM yang mudah, berasaskan biologi tumbuhan sekolah menengah. Markah baik sangat boleh dicapai dengan usaha berterusan."
    id: "Ulasan 2024 dan 2025 menyebutnya pendongkrak WAM yang mudah, melanjutkan biologi tumbuhan SMA. Nilai bagus sangat bisa diraih dengan usaha yang konsisten."
    hi: "2024 और 2025 के रिव्यूअर्स ने इसे आसान WAM बूस्टर कहा जो हाई-स्कूल प्लांट बायोलॉजी पर आधारित है। लगातार मेहनत से अच्छे नंबर काफ़ी संभव हैं।"
  - en: "The exam is short-answer and covers the lecture topics. Memorise the lecture notes and work through practice exams and quizzes."
    zh: "考试为简答题，覆盖讲座各主题。建议熟记讲义，并多做往年试题和练习测验。"
    zh-TW: "考試是簡答題，涵蓋講課主題。把講義背熟，並多做模擬考和小測。"
    ja: "試験は記述式の短答問題で、講義のトピックから出る。講義ノートを覚え、模擬試験や小テストを解こう。"
    ko: "시험은 단답형이고 강의 주제를 다룬다. 강의 노트를 외우고 모의고사와 퀴즈를 풀어 보자."
    vi: "Bài thi dạng trả lời ngắn và bao quát các chủ đề bài giảng. Hãy học thuộc ghi chú bài giảng và làm đề luyện tập, quiz."
    ms: "Peperiksaan berbentuk jawapan pendek dan meliputi topik kuliah. Hafal nota kuliah dan buat peperiksaan latihan serta kuiz."
    id: "Ujiannya jawaban singkat dan mencakup topik kuliah. Hafalkan catatan kuliah dan kerjakan latihan ujian serta kuis."
    hi: "परीक्षा शॉर्ट-आंसर वाली है और लेक्चर के टॉपिक कवर करती है। लेक्चर नोट्स याद करें और प्रैक्टिस एग्ज़ाम व क्विज़ हल करें।"
  - en: "Small classes mean personal teaching and detailed feedback in pracs. Organisation and communication about assessments were said to be weak."
    zh: "班级小，实验课教学更个性化，反馈也详细。但有评价指出课程组织和考核信息沟通较弱。"
    zh-TW: "小班代表實驗課教學更個人化、回饋也詳細。但有人說評量相關的組織和溝通較弱。"
    ja: "少人数クラスなので実習では個別に教えてもらえ、フィードバックも詳しい。一方で評価課題に関する運営や連絡は弱いと言われた。"
    ko: "소규모 수업이라 실습에서 개별 지도와 자세한 피드백을 받을 수 있다. 다만 평가 관련 운영과 소통은 약하다는 말이 있었다."
    vi: "Lớp nhỏ nên được dạy sát sao và nhận phản hồi chi tiết trong giờ thực hành. Tuy vậy, khâu tổ chức và thông tin về bài đánh giá bị cho là yếu."
    ms: "Kelas kecil bermakna pengajaran peribadi dan maklum balas terperinci semasa amali. Organisasi dan komunikasi tentang penilaian dikatakan lemah."
    id: "Kelas kecil berarti pengajaran personal dan feedback detail di praktikum. Pengelolaan dan komunikasi soal penilaian disebut lemah."
    hi: "छोटी क्लास का मतलब प्रैक्टिकल में व्यक्तिगत पढ़ाई और विस्तृत फ़ीडबैक। असेसमेंट से जुड़ा ऑर्गनाइज़ेशन और कम्युनिकेशन कमज़ोर बताया गया।"
difficulty: easy
