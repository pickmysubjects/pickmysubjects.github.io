points:
  - en: "A broad mix of earth science topics; most found the lecturers engaging."
    zh: "涵盖多领域的地球科学内容，多数人认为讲师生动。"
    zh-TW: "涵蓋多個領域的地球科學內容，多數人覺得講師講得很生動。"
    ja: "地球科学の幅広いテーマを扱う。講師は魅力的だという人が多い。"
    ko: "다양한 지구과학 주제를 다루며, 대부분 강사가 흥미롭다고 함."
    vi: "Kết hợp nhiều chủ đề khoa học trái đất; phần lớn thấy giảng viên cuốn hút."
    ms: "Gabungan luas topik sains bumi; kebanyakan rasa pensyarah menarik."
    id: "Campuran luas topik ilmu kebumian; kebanyakan merasa dosennya menarik."
    hi: "अर्थ साइंस के कई तरह के टॉपिक; ज़्यादातर को लेक्चरर दिलचस्प लगे।"
  - en: "Very little maths; it is more concept-based, closer to a humanities style."
    zh: "几乎不涉及数学，以概念理解为主，风格接近文科。"
    zh-TW: "幾乎沒有數學，以概念理解為主，風格接近文科。"
    ja: "数学はほとんどなく、概念中心で文系寄りのスタイル。"
    ko: "수학은 거의 없고 개념 중심이라 인문학 스타일에 가까움."
    vi: "Rất ít toán; thiên về khái niệm, gần với phong cách khoa học xã hội."
    ms: "Sangat sedikit matematik; lebih berasaskan konsep, hampir gaya kemanusiaan."
    id: "Sangat sedikit matematika; lebih berbasis konsep, mendekati gaya humaniora."
    hi: "मैथ्स बहुत कम; यह कॉन्सेप्ट पर ज़्यादा है, ह्यूमैनिटीज़ जैसी स्टाइल।"
  - en: "Pracs became less engaging later in the semester, and the poster's marking seemed to favour looks; opinions on overall difficulty are split."
    zh: "学期后段实验课趣味下降，海报评分似乎偏重美观；对整体难度看法不一。"
    zh-TW: "學期後段實驗課沒那麼有趣，海報評分似乎偏重美觀；對整體難度看法不一。"
    ja: "学期後半は実習の面白さが落ち、ポスターの採点は見た目重視に見えた。全体の難易度については意見が分かれる。"
    ko: "학기 후반 실습은 덜 흥미로워졌고 포스터 채점은 외관을 중시하는 듯했으며, 전체 난이도 의견은 갈림."
    vi: "Prac kém hấp dẫn hơn về cuối kỳ, chấm poster có vẻ thiên về hình thức; ý kiến về độ khó chung trái chiều."
    ms: "Prac kurang menarik lewat semester, dan pemarkahan poster nampak memihak rupa; pendapat tentang kesukaran berbelah bahagi."
    id: "Prak makin kurang menarik di akhir semester, dan penilaian poster tampak mengutamakan tampilan; pendapat soal tingkat kesulitan terbelah."
    hi: "सेमेस्टर के आख़िर में प्रैक्टिकल कम दिलचस्प रहे, और पोस्टर की मार्किंग दिखावट को तरजीह देती लगी; कुल कठिनाई पर राय बँटी है।"
difficulty: mixed
