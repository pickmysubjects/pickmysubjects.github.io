checked: 2026-10-17
points:
  - en: "A short intensive about the ideas behind food and culture, with relaxed tutorials and group work; best if you genuinely love food."
    zh: "一门关于食物与文化背后理念的短期密集课，辅导课轻松，有小组作业；真心热爱美食的人最适合。"
    zh-TW: "一門關於食物與文化背後理念的短期密集課，輔導課輕鬆，有小組作業；真心熱愛美食的人最適合。"
    ja: "食と文化の背後にある考え方を学ぶ短期集中科目。チュートリアルはゆるく、グループワークもある。本当に食べ物が好きな人向け。"
    ko: "음식과 문화 이면의 개념을 다루는 단기 집중 과목. 튜토리얼은 편하고 조별 과제가 있음. 음식을 정말 좋아하는 사람에게 맞음."
    vi: "Môn cấp tốc ngắn về ý tưởng đằng sau ẩm thực và văn hóa, tutorial thoải mái và có làm nhóm; hợp nhất nếu bạn thật sự mê ăn uống."
    ms: "Subjek intensif pendek tentang idea di sebalik makanan dan budaya, dengan tutorial santai dan kerja berkumpulan; paling sesuai jika anda benar-benar suka makanan."
    id: "Mata kuliah intensif singkat tentang gagasan di balik makanan dan budaya, dengan tutorial santai dan kerja kelompok; paling cocok kalau kamu benar-benar suka makanan."
    hi: "खाने और संस्कृति के पीछे के विचारों पर एक छोटा इंटेंसिव, आरामदेह ट्यूटोरियल और ग्रुप वर्क के साथ; सबसे अच्छा तब, जब आपको सच में खाने से प्यार हो।"
  - en: "Opinions are sharply split: some recommend it, while 2020-2021 reviewers complained of poor coordination, unclear expectations and unfair marking."
    zh: "意见两极：有人推荐，2020-2021年的评论者则抱怨组织混乱、要求不清、评分不公。"
    zh-TW: "意見兩極：有人推薦，2020-2021年的評論者則抱怨組織混亂、要求不清、評分不公。"
    ja: "意見ははっきり分かれる。勧める人もいれば、2020-2021年には運営のまずさ、期待のあいまいさ、不公平な採点への不満もあった。"
    ko: "의견이 극명히 갈림. 추천하는 사람도 있지만, 2020-2021년 리뷰어들은 엉성한 운영, 불분명한 기대치, 불공정한 채점을 불평함."
    vi: "Ý kiến chia rẽ mạnh: có người khuyên học, còn người năm 2020-2021 phàn nàn tổ chức kém, yêu cầu không rõ và chấm không công bằng."
    ms: "Pendapat sangat berbelah: ada yang mengesyorkannya, manakala pengulas 2020-2021 mengadu penyelarasan lemah, jangkaan tidak jelas dan pemarkahan tidak adil."
    id: "Pendapat sangat terbelah: ada yang merekomendasikan, sementara pengulas 2020-2021 mengeluhkan koordinasi buruk, ekspektasi tidak jelas, dan penilaian tidak adil."
    hi: "राय बहुत बँटी है: कुछ इसे सुझाते हैं, जबकि 2020-2021 के रिव्यूअर्स ने ख़राब समन्वय, अस्पष्ट अपेक्षाओं और अनुचित मार्किंग की शिकायत की।"
  - en: "It is not a bludge: start the final essay early."
    zh: "这不是混学分的课：期末论文要早点开始。"
    zh-TW: "這不是混學分的課：期末論文要早點開始。"
    ja: "楽な科目ではない。最終エッセイは早めに始めること。"
    ko: "날로 먹는 과목 아님. 기말 에세이는 일찍 시작할 것."
    vi: "Không phải môn học chơi: hãy bắt đầu bài luận cuối kỳ sớm."
    ms: "Ia bukan subjek mudah: mulakan esei akhir awal."
    id: "Bukan mata kuliah santai: mulailah esai akhir lebih awal."
    hi: "यह आसान विषय नहीं है: फ़ाइनल निबंध जल्दी शुरू करें।"
sections:
  content:
    - en: "A two-week summer intensive on food and culture in Europe. Some reviewers enjoyed the content and relaxed, social tutorials; others found the coordination messy and the tutorials dry."
      zh: "为期两周的暑期密集课，讲欧洲的饮食与文化。有同学喜欢内容和轻松、能交朋友的 tutorial；也有人觉得课程组织混乱、tutorial 枯燥。"
      zh-TW: "為期兩週的暑期密集課，講歐洲的飲食與文化。有同學喜歡內容和輕鬆、能交朋友的 tutorial；也有人覺得課程組織混亂、tutorial 枯燥。"
      ja: "ヨーロッパの食と文化を扱う2週間の夏季集中科目。内容や気楽で交流できるチュートリアルを楽しんだ人もいれば、運営が雑でチュートリアルが退屈という人も。"
      ko: "유럽의 음식과 문화를 다루는 2주 여름 집중 과목. 내용과 편안하고 사교적인 튜토리얼을 즐긴 사람도, 운영이 엉망이고 튜토리얼이 지루했다는 사람도 있다."
      vi: "Khóa hè cấp tốc hai tuần về ẩm thực và văn hóa châu Âu. Có người thích nội dung và tutorial thoải mái, dễ kết bạn; người khác thấy tổ chức lộn xộn và tutorial khô khan."
      ms: "Kursus intensif musim panas dua minggu tentang makanan dan budaya Eropah. Ada yang suka kandungan dan tutorial santai yang mesra; ada yang rasa penyelarasan berselerak dan tutorial hambar."
      id: "Kuliah intensif musim panas dua minggu tentang makanan dan budaya Eropa. Ada yang suka materinya dan tutorial santai yang akrab; ada yang merasa koordinasinya berantakan dan tutorial membosankan."
      hi: "यूरोप के खाने और संस्कृति पर दो हफ़्ते का गर्मियों का इंटेंसिव। कुछ को सामग्री और आरामदेह, मिलनसार ट्यूटोरियल पसंद आए; कुछ को समन्वय अव्यवस्थित और ट्यूटोरियल नीरस लगे।"
  work:
    - en: "Two major assessments, including group work and a group presentation, plus a final essay. One reviewer found it hard to tell what was wanted; another warns not to leave the essay to the last minute."
      zh: "两个主要考核，有小组作业和小组展示，还有期末论文。有同学觉得很难搞清老师想要什么；也有人提醒论文别拖到最后。"
      zh-TW: "兩個主要考核，有小組作業和小組報告，還有期末論文。有同學覺得很難搞清老師想要什麼；也有人提醒論文別拖到最後。"
      ja: "グループワークと発表を含む主要課題2つと最終エッセイ。何が求められているか分かりにくいという人、エッセイを直前まで残すなと注意する人がいる。"
      ko: "조별 작업과 발표를 포함한 주요 평가 2개와 기말 에세이. 무엇을 원하는지 알기 어렵다는 리뷰와, 에세이를 막판까지 미루지 말라는 리뷰가 있다."
      vi: "Hai bài đánh giá chính, có làm nhóm và thuyết trình nhóm, cộng bài luận cuối. Một người thấy khó biết giáo viên muốn gì; người khác dặn đừng để bài luận tới phút chót."
      ms: "Dua penilaian utama termasuk kerja kumpulan dan pembentangan kumpulan, serta esei akhir. Seorang rasa sukar tahu apa yang dikehendaki; seorang lagi pesan jangan tangguh esei hingga saat akhir."
      id: "Dua penilaian utama termasuk kerja kelompok dan presentasi kelompok, plus esai akhir. Satu pengulas merasa sulit tahu apa yang diinginkan; lainnya mengingatkan jangan menunda esai sampai menit akhir."
      hi: "दो मुख्य आकलन, जिनमें ग्रुप वर्क और ग्रुप प्रेज़ेंटेशन है, साथ में फ़ाइनल निबंध। एक को समझना मुश्किल लगा कि क्या चाहिए; दूसरा चेताता है निबंध आख़िरी पल तक न छोड़ें।"
  watch:
    - en: "Reviewers are sharply split on the tutors and marking, with one alleging marks felt random. One says it's not an easy mark and suits people who genuinely love food."
      zh: "大家对 tutor 和评分评价很两极，有人觉得分数像随便给的。也有人说这门不是水课，适合真心喜欢美食的人。"
      zh-TW: "大家對 tutor 和評分評價很兩極，有人覺得分數像隨便給的。也有人說這門不是涼課，適合真心喜歡美食的人。"
      ja: "チューターと採点の評価は極端に割れ、点数が適当に感じたという人も。楽に単位が取れる科目ではなく、本当に食が好きな人向けという声もある。"
      ko: "튜터와 채점에 대한 평가가 극단적으로 갈리고, 점수가 임의로 매겨진 것 같았다는 사람도 있다. 쉬운 과목이 아니며 음식을 정말 좋아하는 사람에게 맞는다는 평도."
      vi: "Ý kiến về tutor và cách chấm rất trái chiều, có người cho rằng điểm như cho ngẫu nhiên. Một người nói đây không phải môn dễ điểm, hợp với ai thật sự mê ẩm thực."
      ms: "Pandangan tentang tutor dan pemarkahan sangat berbelah, seorang rasa markah seperti rawak. Seorang kata ia bukan subjek mudah dan sesuai untuk yang benar-benar suka makanan."
      id: "Pendapat soal tutor dan penilaian sangat terbelah, satu merasa nilainya seperti acak. Satu bilang ini bukan mata kuliah gampang dan cocok untuk yang benar-benar suka makanan."
      hi: "ट्यूटर्स और जाँच पर राय बहुत बँटी है, एक को अंक मनमाने लगे। एक कहता है यह आसान विषय नहीं और उनके लिए है जिन्हें सचमुच खाना पसंद है।"
tags: [group-work]
