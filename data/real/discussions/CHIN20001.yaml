reviews: 4
from: 2018
to: 2025
checked: 2026-10-17
points:
  - en: "It moves noticeably faster than first-year Chinese, and you need regular study outside class (one 2022 reviewer said about three hours a week was enough)."
    zh: "进度明显比一年级中文快，课外需要固定复习（一位2022年的评论者说每周约三小时就够）。"
    zh-TW: "進度明顯比一年級中文快，課外需要固定複習（一位2022年的評論者說每週約三小時就夠）。"
    ja: "1年目の中国語よりかなり速く、授業外の定期的な勉強が必要（2022年のレビューでは週3時間ほどで十分とのこと）。"
    ko: "1학년 중국어보다 눈에 띄게 빠르고, 수업 외 꾸준한 공부가 필요(2022년 리뷰어는 주 3시간 정도면 충분했다고 함)."
    vi: "Nhanh hơn rõ so với tiếng Trung năm nhất, cần học đều ngoài giờ (một người năm 2022 nói khoảng ba giờ mỗi tuần là đủ)."
    ms: "Ia jauh lebih pantas daripada bahasa Cina tahun pertama, dan anda perlu belajar secara tetap di luar kelas (seorang pengulas 2022 kata kira-kira tiga jam seminggu memadai)."
    id: "Jauh lebih cepat dari bahasa Mandarin tahun pertama, dan perlu belajar rutin di luar kelas (pengulas 2022 bilang sekitar tiga jam per minggu cukup)."
    hi: "यह फ़र्स्ट-ईयर चीनी से काफ़ी तेज़ है, और क्लास के बाहर नियमित पढ़ाई ज़रूरी है (2022 के एक रिव्यूअर के अनुसार हफ़्ते में लगभग तीन घंटे काफ़ी थे)।"
  - en: "Experiences with the teaching differ by year: 2018 and 2025 reviewers complained of strict, unclear marking (in 2025, no rubric for the essay), while a 2022 reviewer found the class friendly."
    zh: "不同年份的教学体验不一：2018和2025年的评论者抱怨评分严格且标准不清（2025年论文没有评分细则），而2022年的评论者觉得课堂很友好。"
    zh-TW: "不同年份的教學體驗不一：2018和2025年的評論者抱怨評分嚴格且標準不清（2025年論文沒有評分標準），而2022年的評論者覺得課堂很友善。"
    ja: "授業の印象は年で異なる。2018年と2025年は採点が厳しく基準が不明確（2025年はエッセイの評価基準表なし）という不満があり、2022年は和やかなクラスだったとのこと。"
    ko: "수업 경험은 해마다 다름. 2018년과 2025년 리뷰어는 엄격하고 불분명한 채점(2025년엔 에세이 루브릭 없음)을 불평했고, 2022년 리뷰어는 수업이 친근했다고 함."
    vi: "Trải nghiệm khác nhau theo năm: người năm 2018 và 2025 phàn nàn chấm điểm khắt khe, tiêu chí không rõ (năm 2025 bài luận không có rubric), còn người năm 2022 thấy lớp thân thiện."
    ms: "Pengalaman berbeza mengikut tahun: pengulas 2018 dan 2025 mengadu pemarkahan ketat dan tidak jelas (pada 2025, tiada rubrik untuk esei), manakala pengulas 2022 dapati kelasnya mesra."
    id: "Pengalaman berbeda tiap tahun: pengulas 2018 dan 2025 mengeluhkan penilaian ketat dan tidak jelas (di 2025 tak ada rubrik untuk esai), sedangkan pengulas 2022 merasa kelasnya ramah."
    hi: "पढ़ाने का अनुभव साल के हिसाब से अलग रहा: 2018 और 2025 के रिव्यूअर्स ने सख़्त और अस्पष्ट मार्किंग की शिकायत की (2025 में निबंध का कोई रूब्रिक नहीं था), जबकि 2022 के रिव्यूअर को क्लास दोस्ताना लगी।"
