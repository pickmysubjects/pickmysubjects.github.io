points:
  - en: "Widely praised as very well coordinated, with practicals that closely match the lectures."
    zh: "普遍称赞组织极好，实验课与讲课内容紧密对应。"
  - en: "Very content heavy: you must memorise many pathogens and their mechanisms. The volume, not the concepts, is the hard part."
    zh: "内容极多，需记大量病原体及其机制；难在量大而非概念难。"
  - en: "The MSTs test fine details under time pressure, with averages around 50-60%. Reviews differ on whether the exam is harder or easier."
    zh: "期中考细节多、时间紧，平均约50-60%；期末难度评价不一。"
  - en: "Strongly microbiology-focused. A few found the virology section weaker than the rest."
    zh: "偏重微生物学；有人觉得病毒学部分比其他部分弱。"
