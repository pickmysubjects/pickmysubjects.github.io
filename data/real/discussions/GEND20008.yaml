points:
  - en: "Content was called interesting; by 2025 it ran as Feminist Futures and centred on manifestos, rewarding personal, emotional responses to readings."
    zh: "内容被认为有趣；到2025年课程以“女性主义未来”的名义开设，以宣言为中心，更看重对阅读的个人和情感回应。"
    zh-TW: "內容被認為有趣；到2025年課程以「女性主義未來」的名義開設，以宣言為中心，更看重對閱讀的個人和情感回應。"
    ja: "内容は面白いとされる。2025年は「Feminist Futures」として開講され、マニフェスト中心で、読み物への個人的・感情的な反応が重視された。"
    ko: "내용은 흥미롭다는 평. 2025년엔 'Feminist Futures'로 운영되며 선언문 중심이었고, 읽기에 대한 개인적·감정적 반응을 중시함."
    vi: "Nội dung được cho là thú vị; đến 2025 môn mang tên Feminist Futures, xoay quanh các bản tuyên ngôn, đề cao phản hồi cá nhân và cảm xúc với bài đọc."
    ms: "Kandungan dikatakan menarik; menjelang 2025 ia dijalankan sebagai Feminist Futures dan berpusat pada manifesto, menghargai respons peribadi dan emosi terhadap bacaan."
    id: "Isinya disebut menarik; di 2025 berjalan sebagai Feminist Futures dan berpusat pada manifesto, menghargai respons pribadi dan emosional terhadap bacaan."
    hi: "सामग्री को दिलचस्प कहा गया; 2025 तक यह Feminist Futures नाम से चला और घोषणापत्रों पर केंद्रित रहा, जिसमें रीडिंग्स पर निजी, भावनात्मक प्रतिक्रिया को महत्व दिया गया।"
  - en: "Marking felt tougher than other Arts subjects (2020), and a 2025 reviewer found the discussion fairly surface-level."
    zh: "评分感觉比其他文科课更严（2020年），一位2025年的评论者觉得讨论比较浅。"
    zh-TW: "評分感覺比其他文科課更嚴（2020年），一位2025年的評論者覺得討論比較淺。"
    ja: "採点は他の文系科目より厳しく感じた（2020年）。2025年のレビューでは議論がやや表面的とのこと。"
    ko: "채점이 다른 인문 과목보다 박하게 느껴졌고(2020년), 2025년 리뷰어는 토론이 다소 피상적이라고 함."
    vi: "Chấm điểm có vẻ khắt khe hơn các môn Arts khác (2020), và một người năm 2025 thấy thảo luận khá hời hợt."
    ms: "Pemarkahan terasa lebih ketat daripada subjek Sastera lain (2020), dan seorang pengulas 2025 dapati perbincangannya agak cetek."
    id: "Penilaian terasa lebih ketat dari mata kuliah Arts lain (2020), dan pengulas 2025 merasa diskusinya cukup dangkal."
    hi: "मार्किंग दूसरे आर्ट्स विषयों से सख़्त लगी (2020), और 2025 के एक रिव्यूअर को चर्चा काफ़ी सतही लगी।"
