reviews: 7
from: 2018
to: 2025
checked: 2026-10-17
points:
  - en: "Most reviewers (2018-2020) loved it: entertaining lectures that tie philosophy to real-world political economy, with readings that overlap the lectures."
    zh: "大多数评论者（2018-2020）很喜欢：讲座有趣，把哲学和现实政治经济联系起来，阅读材料与讲座高度重合。"
    zh-TW: "大多數評論者（2018-2020）很喜歡：講課有趣，把哲學和現實政治經濟聯繫起來，閱讀材料與講課高度重合。"
    ja: "多くのレビュー（2018-2020）が絶賛。哲学を現実の政治経済に結びつける面白い講義で、読み物も講義とよく重なる。"
    ko: "대부분 리뷰(2018-2020)가 극찬. 철학을 현실 정치경제와 연결하는 재미있는 강의이며, 읽기 자료가 강의와 많이 겹침."
    vi: "Phần lớn (2018-2020) rất thích: bài giảng thú vị gắn triết học với kinh tế chính trị thực tế, bài đọc trùng nhiều với bài giảng."
    ms: "Kebanyakan pengulas (2018-2020) sangat menyukainya: kuliah menghiburkan yang mengaitkan falsafah dengan ekonomi politik sebenar, dengan bacaan yang bertindih dengan kuliah."
    id: "Kebanyakan pengulas (2018-2020) sangat menyukainya: kuliah menghibur yang menghubungkan filsafat dengan ekonomi politik nyata, dengan bacaan yang banyak beririsan dengan kuliah."
    hi: "ज़्यादातर रिव्यूअर्स (2018-2020) को बहुत पसंद आया: मनोरंजक लेक्चर जो दर्शन को असली राजनीतिक अर्थशास्त्र से जोड़ते हैं, और रीडिंग्स लेक्चर से मेल खाती हैं।"
  - en: "Assessments were called well designed, and it suits politics students too. Critics found it repetitive after the opening weeks (2020) and centred on liberal thinkers, with no lecture recordings in 2025."
    zh: "考核被认为设计得好，也适合政治学学生。批评者觉得开头几周之后就有些重复（2020年），且以自由主义思想家为中心；2025年没有讲座录像。"
    zh-TW: "評量被認為設計得好，也適合政治學學生。批評者覺得開頭幾週之後就有些重複（2020年），且以自由主義思想家為中心；2025年沒有講課錄影。"
    ja: "評価はよく設計されているとされ、政治学の学生にも向く。批判的な声では、最初の数週以降は繰り返しが多い（2020年）、自由主義の思想家が中心、2025年は講義録画がなかったとのこと。"
    ko: "평가는 잘 설계됐다는 평이고 정치학 학생에게도 맞음. 비판적인 의견으로는 초반 몇 주 이후 반복적이고(2020년) 자유주의 사상가 중심이며, 2025년엔 강의 녹화가 없었다고 함."
    vi: "Bài đánh giá được khen thiết kế tốt, hợp cả sinh viên chính trị. Người chê thấy lặp lại sau vài tuần đầu (2020) và tập trung vào các nhà tư tưởng tự do, năm 2025 không có ghi hình bài giảng."
    ms: "Penilaian dikatakan direka dengan baik, dan sesuai untuk pelajar politik juga. Pengkritik dapati ia berulang selepas minggu awal (2020) dan berpusat pada pemikir liberal, tanpa rakaman kuliah pada 2025."
    id: "Penilaiannya disebut dirancang dengan baik, dan cocok juga untuk mahasiswa politik. Pengkritik merasa berulang setelah minggu-minggu awal (2020) dan berpusat pada pemikir liberal, tanpa rekaman kuliah di 2025."
    hi: "आकलन को अच्छी तरह डिज़ाइन किया हुआ कहा गया, और यह पॉलिटिक्स छात्रों के लिए भी ठीक है। आलोचकों को शुरुआती हफ़्तों के बाद यह दोहराव भरा लगा (2020) और उदारवादी विचारकों पर केंद्रित, और 2025 में लेक्चर रिकॉर्डिंग नहीं थी।"
