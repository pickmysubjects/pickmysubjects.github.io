code: PHIL20044
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/phil20044
reviews: 7
from: 2018
to: 2025
checked: 2026-10-17
points:
  - en: "Most reviewers (2018-2020) loved it: entertaining lectures that tie philosophy to real-world political economy, with readings that overlap the lectures."
    zh: "大多数评论者（2018-2020）很喜欢：讲座有趣，把哲学和现实政治经济联系起来，阅读材料与讲座高度重合。"
    zh-TW: "大多數評論者（2018-2020）很喜歡：講課有趣，把哲學和現實政治經濟聯繫起來，閱讀材料與講課高度重合。"
    ja: "多くのレビュー（2018-2020）が絶賛。哲学を現実の政治経済に結びつける面白い講義で、読み物も講義とよく重なる。"
    ko: "대부분 리뷰(2018-2020)가 극찬. 철학을 현실 정치경제와 연결하는 재미있는 강의이며, 읽기 자료가 강의와 많이 겹침."
    vi: "Phần lớn (2018-2020) rất thích: bài giảng thú vị gắn triết học với kinh tế chính trị thực tế, bài đọc trùng nhiều với bài giảng."
    ms: "Kebanyakan pengulas (2018-2020) sangat menyukainya: kuliah menghiburkan yang mengaitkan falsafah dengan ekonomi politik sebenar, dengan bacaan yang bertindih dengan kuliah."
    id: "Kebanyakan pengulas (2018-2020) sangat menyukainya: kuliah menghibur yang menghubungkan filsafat dengan ekonomi politik nyata, dengan bacaan yang banyak beririsan dengan kuliah."
    hi: "ज़्यादातर रिव्यूअर्स (2018-2020) को बहुत पसंद आया: मनोरंजक लेक्चर जो दर्शन को असली राजनीतिक अर्थशास्त्र से जोड़ते हैं, और रीडिंग्स लेक्चर से मेल खाती हैं।"
  - en: "Assessments were called well designed, and it suits politics students too. Critics found it repetitive after the opening weeks (2020) and centred on liberal thinkers, with no lecture recordings in 2025."
    zh: "考核被认为设计得好，也适合政治学学生。批评者觉得开头几周之后就有些重复（2020年），且以自由主义思想家为中心；2025年没有讲座录像。"
    zh-TW: "評量被認為設計得好，也適合政治學學生。批評者覺得開頭幾週之後就有些重複（2020年），且以自由主義思想家為中心；2025年沒有講課錄影。"
    ja: "評価はよく設計されているとされ、政治学の学生にも向く。批判的な声では、最初の数週以降は繰り返しが多い（2020年）、自由主義の思想家が中心、2025年は講義録画がなかったとのこと。"
    ko: "평가는 잘 설계됐다는 평이고 정치학 학생에게도 맞음. 비판적인 의견으로는 초반 몇 주 이후 반복적이고(2020년) 자유주의 사상가 중심이며, 2025년엔 강의 녹화가 없었다고 함."
    vi: "Bài đánh giá được khen thiết kế tốt, hợp cả sinh viên chính trị. Người chê thấy lặp lại sau vài tuần đầu (2020) và tập trung vào các nhà tư tưởng tự do, năm 2025 không có ghi hình bài giảng."
    ms: "Penilaian dikatakan direka dengan baik, dan sesuai untuk pelajar politik juga. Pengkritik dapati ia berulang selepas minggu awal (2020) dan berpusat pada pemikir liberal, tanpa rakaman kuliah pada 2025."
    id: "Penilaiannya disebut dirancang dengan baik, dan cocok juga untuk mahasiswa politik. Pengkritik merasa berulang setelah minggu-minggu awal (2020) dan berpusat pada pemikir liberal, tanpa rekaman kuliah di 2025."
    hi: "आकलन को अच्छी तरह डिज़ाइन किया हुआ कहा गया, और यह पॉलिटिक्स छात्रों के लिए भी ठीक है। आलोचकों को शुरुआती हफ़्तों के बाद यह दोहराव भरा लगा (2020) और उदारवादी विचारकों पर केंद्रित, और 2025 में लेक्चर रिकॉर्डिंग नहीं थी।"
sections:
  content:
    - en: "Political economy and the ethics of markets, built around a textbook co-written by the lecturer, with applied topics like price gouging and the environment. Most found it interesting and real-world."
      zh: "讲政治经济学和市场伦理，以讲师参与编写的教材为主线，还有哄抬物价、环境等应用议题。多数人觉得有意思、贴近现实。"
      zh-TW: "講政治經濟學和市場倫理，以講師參與撰寫的教材為主軸，還有哄抬物價、環境等應用議題。多數人覺得有趣、貼近現實。"
      ja: "政治経済と市場の倫理を、講師が共著した教科書に沿って学び、便乗値上げや環境など応用的なテーマも扱う。面白く現実的だという声が多い。"
      ko: "강사가 공저한 교재를 중심으로 정치경제와 시장 윤리를 다루며, 가격 폭리나 환경 같은 응용 주제도 있다. 대부분 흥미롭고 현실적이라고 했다."
      vi: "Kinh tế chính trị và đạo đức thị trường, xoay quanh giáo trình do giảng viên đồng tác giả, có chủ đề ứng dụng như hét giá và môi trường. Đa số thấy thú vị và sát thực tế."
      ms: "Ekonomi politik dan etika pasaran, berpandukan buku teks yang ditulis bersama oleh pensyarah, dengan topik gunaan seperti mencatut harga dan alam sekitar. Kebanyakan rasa menarik dan berpijak di bumi nyata."
      id: "Ekonomi politik dan etika pasar, berdasarkan buku teks yang ditulis bersama dosennya, dengan topik terapan seperti penimbunan harga dan lingkungan. Kebanyakan merasa menarik dan membumi."
      hi: "राजनीतिक अर्थशास्त्र और बाज़ार की नैतिकता, लेक्चरर की सह-लिखित किताब पर आधारित, साथ में मुनाफ़ाख़ोरी और पर्यावरण जैसे व्यावहारिक विषय। ज़्यादातर को रोचक और ज़मीनी लगा।"
  work:
    - en: "Two 2,000-word essays. Most found them fair and fun to write; one reviewer felt feedback from external markers was thin."
      zh: "两篇 2000 字论文。多数人觉得公平、写起来有意思；有同学觉得外部批改人的反馈太少。"
      zh-TW: "兩篇 2000 字論文。多數人覺得公平、寫起來有趣；有同學覺得外部批改人的回饋太少。"
      ja: "2,000語のエッセイ2本。多くは公平で書くのが楽しいと感じたが、外部の採点者からのフィードバックが少ないという声も一つ。"
      ko: "2,000단어 에세이 2편. 대부분 공정하고 쓰는 재미가 있었다고 했지만, 외부 채점자의 피드백이 빈약하다는 리뷰어도 있다."
      vi: "Hai bài luận 2.000 từ. Đa số thấy công bằng và viết vui; một người thấy phản hồi từ người chấm bên ngoài sơ sài."
      ms: "Dua esei 2,000 perkataan. Kebanyakan rasa adil dan seronok ditulis; seorang pengulas rasa maklum balas daripada penanda luar nipis."
      id: "Dua esai 2.000 kata. Kebanyakan merasa adil dan seru ditulis; satu pengulas merasa umpan balik dari penilai luar minim."
      hi: "2,000 शब्दों के दो निबंध। ज़्यादातर को ये उचित और लिखने में मज़ेदार लगे; एक रिव्यूअर को बाहरी मार्करों का फ़ीडबैक कम लगा।"
  watch:
    - en: "Some found it broad but shallow, and a 2025 reviewer said it leans liberal and reformist. That reviewer also said lectures weren't recorded and extensions were hard to get."
      zh: "有人觉得范围广但不深；2025 年有同学说课程偏自由主义和改良主义，还说讲课不录播、延期很难申请。"
      zh-TW: "有人覺得範圍廣但不深；2025 年有同學說課程偏自由主義和改良主義，還說上課不錄影、延期很難申請。"
      ja: "幅広いが浅いという声も。2025年のレビューは、自由主義・改良主義寄りで、講義は録画されず延長申請も通りにくかったという。"
      ko: "넓지만 얕다는 의견도 있다. 2025년 한 리뷰어는 자유주의·개량주의 쪽으로 기울어 있고, 강의가 녹화되지 않으며 연장 승인이 어려웠다고 했다."
      vi: "Có người thấy môn rộng nhưng nông; một người năm 2025 nói môn nghiêng về tự do và cải cách, đồng thời bài giảng không ghi hình và khó xin gia hạn."
      ms: "Ada yang rasa ia luas tetapi cetek, dan seorang pengulas 2025 kata ia condong liberal dan reformis. Pengulas itu juga kata kuliah tidak dirakam dan lanjutan sukar diperoleh."
      id: "Sebagian merasa luas tapi dangkal, dan satu pengulas 2025 bilang condong liberal dan reformis. Pengulas itu juga bilang kuliah tidak direkam dan perpanjangan sulit didapat."
      hi: "कुछ को यह व्यापक पर सतही लगा, और 2025 के एक रिव्यूअर ने कहा यह उदारवादी और सुधारवादी झुकाव वाला है। उन्होंने यह भी कहा कि लेक्चर रिकॉर्ड नहीं होते और एक्सटेंशन मिलना कठिन था।"
