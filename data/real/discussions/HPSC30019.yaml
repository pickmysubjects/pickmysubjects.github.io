points:
  - en: "Reviewers in 2018-2022 found the history of psychiatry and mental illness eye-opening, especially for psychology and biomedicine students, though it is not a WAM booster."
    zh: "2018-2022年的评论者觉得精神病学与精神疾病的历史让人大开眼界，尤其适合心理学和生物医学学生，不过不是拉高WAM的课。"
    zh-TW: "2018-2022年的評論者覺得精神醫學與精神疾病的歷史讓人大開眼界，尤其適合心理學和生物醫學學生，不過不是拉高WAM的課。"
    ja: "2018〜2022年のレビューでは、精神医学と精神疾患の歴史が目からうろこで、特に心理学や生物医学の学生に勧められている。ただしWAMを上げる科目ではない。"
    ko: "2018~2022년 리뷰어들은 정신의학과 정신질환의 역사가 눈을 뜨게 해 줬다고 함. 특히 심리학·생명의학 학생에게 좋지만 WAM 올리기용은 아님."
    vi: "Người đánh giá 2018-2022 thấy lịch sử tâm thần học và bệnh tâm thần rất mở mang, nhất là với sinh viên tâm lý và y sinh, dù không phải môn kéo WAM."
    ms: "Pengulas 2018-2022 dapati sejarah psikiatri dan penyakit mental membuka mata, terutama untuk pelajar psikologi dan bioperubatan, walaupun bukan penaik WAM."
    id: "Pengulas 2018-2022 merasa sejarah psikiatri dan penyakit mental membuka wawasan, terutama bagi mahasiswa psikologi dan biomedis, meski bukan pendongkrak WAM."
    hi: "2018-2022 के रिव्यूअर्स को मनोचिकित्सा और मानसिक बीमारी का इतिहास आँखें खोलने वाला लगा, खासकर साइकोलॉजी और बायोमेडिसिन छात्रों के लिए, हालाँकि यह WAM बढ़ाने वाला नहीं है।"
  - en: "From 2023 the tone changed: content delivered as short weekly videos, dense material and unclear assessment briefs. A 2024 reviewer warned that essays are judged as history, not philosophy."
    zh: "2023年起评价转向负面：内容改为每周短视频，材料密集，考核说明不清。2024年的评论者提醒，论文按历史而非哲学的标准评分。"
    zh-TW: "2023年起評價轉向負面：內容改為每週短影片，材料密集，評量說明不清。2024年的評論者提醒，論文按歷史而非哲學的標準評分。"
    ja: "2023年から評価が変わった。内容は毎週の短い動画で提供され、資料は密度が高く、課題説明も不明確。2024年のレビューでは、エッセイは哲学ではなく歴史として評価されると注意している。"
    ko: "2023년부터 분위기가 바뀜. 매주 짧은 영상으로 내용을 전달하고, 자료가 빽빽하며 과제 안내가 불분명. 2024년 리뷰어는 에세이가 철학이 아닌 역사로 평가된다고 경고함."
    vi: "Từ 2023, đánh giá đổi chiều: nội dung chuyển thành video ngắn hằng tuần, tài liệu dày đặc và đề bài không rõ. Một người năm 2024 cảnh báo bài luận được chấm theo lịch sử, không phải triết học."
    ms: "Sejak 2023 nadanya berubah: kandungan disampaikan sebagai video mingguan pendek, bahan padat dan taklimat penilaian tidak jelas. Seorang pengulas 2024 memberi amaran esei dinilai sebagai sejarah, bukan falsafah."
    id: "Sejak 2023 nadanya berubah: materi diberikan lewat video mingguan singkat, bahannya padat, dan petunjuk penilaian tidak jelas. Pengulas 2024 mengingatkan esai dinilai sebagai sejarah, bukan filsafat."
    hi: "2023 से रुख़ बदल गया: सामग्री हर हफ़्ते छोटे वीडियो में दी गई, मटीरियल घना था और आकलन के निर्देश अस्पष्ट। 2024 के एक रिव्यूअर ने चेताया कि निबंध इतिहास के रूप में जाँचे जाते हैं, दर्शन के रूप में नहीं।"
sections:
  content:
    - en: "The history of psychiatry and mental illness, including how gender, race and society shaped diagnoses. Several psychology and biomed students found it eye-opening."
      zh: "讲精神病学和精神疾病的历史，包括性别、种族和社会如何影响诊断。好几位心理和生物医学的同学觉得大开眼界。"
      zh-TW: "講精神醫學和精神疾病的歷史，包括性別、種族和社會如何影響診斷。好幾位心理和生醫的同學覺得大開眼界。"
      ja: "精神医学と精神疾患の歴史、ジェンダーや人種、社会が診断をどう形作ったかを学ぶ。心理学やバイオメドの学生には目から鱗だったという声が複数。"
      ko: "정신의학과 정신질환의 역사, 젠더·인종·사회가 진단을 어떻게 형성했는지 배운다. 심리학·바이오메드 학생 여럿이 시야가 넓어졌다고 했다."
      vi: "Lịch sử tâm thần học và bệnh tâm thần, gồm cả cách giới, chủng tộc và xã hội định hình chẩn đoán. Vài sinh viên tâm lý và y sinh thấy mở mang tầm mắt."
      ms: "Sejarah psikiatri dan penyakit mental, termasuk bagaimana jantina, kaum dan masyarakat membentuk diagnosis. Beberapa pelajar psikologi dan bioperubatan rasa ia membuka mata."
      id: "Sejarah psikiatri dan penyakit mental, termasuk bagaimana gender, ras dan masyarakat membentuk diagnosis. Beberapa mahasiswa psikologi dan biomedis merasa wawasannya terbuka."
      hi: "मनोरोग विज्ञान और मानसिक बीमारी का इतिहास, जिसमें लिंग, नस्ल और समाज ने निदान को कैसे आकार दिया। कई मनोविज्ञान और बायोमेड छात्रों को यह आँखें खोलने वाला लगा।"
  work:
    - en: "Essay-based, built on historians' interpretations rather than your own philosophy. Several found the briefs confusing and the subject hard to score highly in, though most pass comfortably."
      zh: "以论文为主，要基于历史学家的解读，而不是写自己的哲学观点。好几位觉得作业要求令人困惑、很难拿高分，不过多数人能稳稳通过。"
      zh-TW: "以論文為主，要根據史學家的詮釋，而不是寫自己的哲學觀點。好幾位覺得作業要求令人困惑、很難拿高分，不過多數人能穩穩通過。"
      ja: "エッセイ中心で、自分の哲学ではなく歴史家の解釈に基づいて書く。課題説明が分かりにくく高得点は難しいという声が複数だが、多くは問題なく合格する。"
      ko: "에세이 위주이며 자신의 철학이 아닌 역사가들의 해석을 바탕으로 쓴다. 과제 안내가 혼란스럽고 고득점이 어렵다는 의견이 여럿이지만 대부분 무난히 통과한다."
      vi: "Chủ yếu là tiểu luận, dựa trên cách diễn giải của các nhà sử học chứ không phải triết lý riêng. Vài người thấy đề bài khó hiểu và khó đạt điểm cao, dù đa số đậu thoải mái."
      ms: "Berasaskan esei, dibina atas tafsiran ahli sejarah, bukan falsafah anda sendiri. Beberapa rasa arahan mengelirukan dan sukar dapat markah tinggi, walaupun kebanyakan lulus dengan selesa."
      id: "Berbasis esai, bertumpu pada tafsiran sejarawan, bukan filsafatmu sendiri. Beberapa merasa instruksinya membingungkan dan sulit dapat nilai tinggi, meski kebanyakan lulus dengan nyaman."
      hi: "निबंध-आधारित, जो आपके अपने दर्शन के बजाय इतिहासकारों की व्याख्याओं पर टिका है। कई को निर्देश उलझाने वाले और ऊँचे अंक पाना कठिन लगा, हालाँकि ज़्यादातर आराम से पास हो जाते हैं।"
  watch:
    - en: "Not a WAM booster. Reviews since 2023 found the short weekly videos hard to follow and the subject largely self-guided, while 2020 reviewers called it well organised."
      zh: "不是刷分课。2023 年以来的同学觉得每周短视频难跟、基本靠自学；而 2020 年的同学说组织得很好。"
      zh-TW: "不是拉分課。2023 年以來的同學覺得每週短片難跟、基本靠自學；而 2020 年的同學說安排得很好。"
      ja: "WAMを上げる科目ではない。2023年以降は毎週の短い動画が分かりにくくほぼ自学という声、2020年はよく整理されていたという声。"
      ko: "WAM 올리는 과목이 아니다. 2023년 이후 리뷰는 주간 짧은 영상이 따라가기 어렵고 거의 독학이라 했고, 2020년 리뷰는 운영이 잘됐다고 했다."
      vi: "Không phải môn kéo WAM. Đánh giá từ 2023 thấy video ngắn hằng tuần khó theo và phần lớn phải tự học, trong khi người học 2020 nói môn tổ chức tốt."
      ms: "Bukan penaik WAM. Ulasan sejak 2023 dapati video mingguan pendek sukar diikuti dan kebanyakannya belajar sendiri, manakala pengulas 2020 kata ia teratur."
      id: "Bukan pendongkrak WAM. Ulasan sejak 2023 merasa video mingguan singkat sulit diikuti dan sebagian besar belajar mandiri, sementara pengulas 2020 bilang rapi."
      hi: "यह WAM बूस्टर नहीं है। 2023 से रिव्यू कहते हैं हर हफ़्ते के छोटे वीडियो समझना कठिन और पढ़ाई ज़्यादातर ख़ुद करनी पड़ती है, जबकि 2020 के रिव्यूअर्स ने इसे अच्छी तरह व्यवस्थित बताया।"
difficulty: hard
