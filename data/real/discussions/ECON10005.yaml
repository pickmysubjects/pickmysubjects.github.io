points:
  - en: "Most reviewers found it an easy-to-moderate intro to statistics; an H1 is reachable with steady work, and Year 12 maths helps but is not essential."
    zh: "多数人认为这是难度适中的统计入门课，稳定投入即可拿H1；有高中数学基础会更轻松，但不是必需。"
    zh-TW: "多數評論者覺得這是難度簡單到中等的統計入門；穩定努力就能拿H1，Year 12數學有幫助但不是必要。"
    ja: "多くは易しめから中程度の統計入門と評価。地道にやればH1も狙え、Year 12の数学は役立つが必須ではない。"
    ko: "대부분 쉬운~중간 난이도의 통계 입문이라고 했다. 꾸준히 하면 H1도 가능하고, Year 12 수학은 도움이 되지만 필수는 아니다."
    vi: "Đa số thấy đây là môn nhập môn thống kê dễ đến trung bình; chăm chỉ đều là đạt H1, toán Year 12 có ích nhưng không bắt buộc."
    ms: "Kebanyakan pengulas dapati ia pengenalan statistik yang mudah hingga sederhana; H1 boleh dicapai dengan usaha berterusan, dan matematik Year 12 membantu tetapi tidak wajib."
    id: "Kebanyakan pengulas menilainya pengantar statistik yang mudah sampai sedang; H1 bisa diraih dengan usaha rutin, dan matematika Year 12 membantu tapi tidak wajib."
    hi: "ज़्यादातर रिव्यूअर्स को यह आसान से मध्यम स्टैटिस्टिक्स परिचय लगा; लगातार मेहनत से H1 संभव है, और Year 12 मैथ्स मदद करती है पर ज़रूरी नहीं।"
  - en: "Content is basic and surface-level but useful for later commerce and research-methods subjects."
    zh: "内容偏基础、不深入，但对后续商科课程和研究方法类课程很有用。"
    zh-TW: "內容基礎、偏表面，但對之後的商科和研究方法課程很有用。"
    ja: "内容は基礎的で浅めだが、後の商学系科目や研究手法の科目に役立つ。"
    ko: "내용은 기초적이고 얕지만, 이후 상경 과목과 연구방법론 과목에 유용하다."
    vi: "Nội dung cơ bản, không sâu, nhưng hữu ích cho các môn kinh tế và phương pháp nghiên cứu sau này."
    ms: "Kandungan asas dan di peringkat permukaan tetapi berguna untuk subjek perdagangan dan kaedah penyelidikan kemudian."
    id: "Materinya dasar dan tidak mendalam, tapi berguna untuk mata kuliah bisnis dan metode penelitian berikutnya."
    hi: "कंटेंट बुनियादी और ऊपरी स्तर का है, पर आगे के कॉमर्स और रिसर्च-मेथड सब्जेक्ट के लिए उपयोगी है।"
  - en: "Most found it well run, with clear lectures and tutorials; a few found the material dry or unclear."
    zh: "多数人觉得课程组织良好，讲课和辅导课清楚；少数人觉得内容枯燥或讲解不清。"
    zh-TW: "多數人覺得課程辦得好，講課和輔導課都清楚；少數人覺得內容枯燥或不清楚。"
    ja: "運営が良く講義もチュートリアルも分かりやすいという人が多いが、内容が退屈・不明瞭と感じた人も少しいる。"
    ko: "대부분 운영이 잘 되고 강의와 튜토리얼이 명확하다고 했지만, 소수는 내용이 지루하거나 불분명하다고 느꼈다."
    vi: "Đa số thấy môn tổ chức tốt, bài giảng và tutorial rõ ràng; một số ít thấy nội dung khô khan hoặc khó hiểu."
    ms: "Kebanyakan dapati ia diurus dengan baik, dengan kuliah dan tutorial yang jelas; segelintir dapati bahan membosankan atau tidak jelas."
    id: "Kebanyakan merasa pengelolaannya baik, dengan kuliah dan tutorial yang jelas; sebagian kecil merasa materinya membosankan atau kurang jelas."
    hi: "ज़्यादातर को यह अच्छी तरह संचालित लगा, साफ़ लेक्चर और ट्यूटोरियल के साथ; कुछ को मटेरियल नीरस या अस्पष्ट लगा।"
difficulty: easy
