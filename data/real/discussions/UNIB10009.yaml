points:
  - en: "Content is broad and often called interesting, though some find it dry or repetitive."
    zh: "内容覆盖面广,很多人觉得有意思,但也有人觉得枯燥或重复。"
    zh-TW: "內容涵蓋面廣,很多人覺得有意思,但也有人覺得枯燥或重複。"
    ja: "内容は幅広く面白いという声が多い一方、退屈・繰り返しが多いと感じる人もいます。"
    ko: "내용이 폭넓고 흥미롭다는 평이 많지만, 지루하거나 반복적이라는 의견도 있습니다."
    vi: "Nội dung rộng và nhiều người thấy thú vị, dù có người thấy khô khan hoặc lặp lại."
    ms: "Kandungan luas dan ramai kata menarik, walaupun ada yang rasa kering atau berulang."
    id: "Materinya luas dan banyak yang bilang menarik, meski ada yang merasa kering atau berulang."
    hi: "विषय-वस्तु व्यापक है और कई लोग इसे रोचक कहते हैं, पर कुछ को यह रूखी या दोहराव वाली लगती है।"
  - en: "Opinions split on difficulty: an H1 is possible with good notes from every lecture, but several say it takes more effort than expected."
    zh: "难度看法不一:每节讲座认真做笔记可以拿H1,但不少人说比预想的更费力。"
    zh-TW: "難度看法不一:每堂講座認真做筆記可以拿H1,但不少人說比預想的更費力。"
    ja: "難易度は意見が分かれます。全講義でしっかりノートを取ればH1も可能ですが、想像以上に手間がかかるという声も複数あります。"
    ko: "난이도 평가는 갈립니다. 모든 강의를 잘 정리하면 H1도 가능하지만, 생각보다 노력이 많이 든다는 의견도 여럿입니다."
    vi: "Ý kiến về độ khó trái chiều: ghi chép kỹ mọi bài giảng có thể đạt H1, nhưng nhiều người nói tốn công hơn dự kiến."
    ms: "Pendapat tentang kesukaran berbeza: H1 boleh dicapai dengan nota yang baik setiap kuliah, tetapi ramai kata ia perlukan lebih usaha daripada dijangka."
    id: "Pendapat soal tingkat kesulitan terbelah: H1 bisa diraih dengan catatan bagus dari setiap kuliah, tetapi beberapa bilang butuh usaha lebih dari perkiraan."
    hi: "कठिनाई पर राय बँटी है: हर लेक्चर के अच्छे नोट्स से H1 संभव है, पर कई लोग कहते हैं इसमें उम्मीद से ज़्यादा मेहनत लगती है।"
  - en: "Assessment includes a forum report, a research essay and an exam that can test fine details; writing skills matter."
    zh: "考核包括论坛报告、研究论文和一场可能考细节的考试;写作能力很重要。"
    zh-TW: "評量包括論壇報告、研究論文和一場可能考細節的考試;寫作能力很重要。"
    ja: "評価はフォーラムレポート、リサーチエッセイ、細部まで問われることがある試験。文章力が重要です。"
    ko: "평가는 포럼 리포트, 연구 에세이, 세부 내용까지 묻는 시험으로 구성되며 글쓰기 실력이 중요합니다."
    vi: "Đánh giá gồm báo cáo diễn đàn, bài luận nghiên cứu và bài thi có thể hỏi chi tiết; kỹ năng viết rất quan trọng."
    ms: "Penilaian termasuk laporan forum, esei penyelidikan dan peperiksaan yang mungkin menguji butiran halus; kemahiran menulis penting."
    id: "Penilaian mencakup laporan forum, esai riset, dan ujian yang bisa menanyakan detail; kemampuan menulis penting."
    hi: "आकलन में फ़ोरम रिपोर्ट, शोध निबंध और ऐसी परीक्षा है जो बारीक बातें पूछ सकती है; लेखन कौशल मायने रखता है।"
  - en: "Many mention uneven organisation, with a different lecturer most weeks and variable teaching quality."
    zh: "不少人提到组织不太统一,几乎每周换讲师,教学质量参差不齐。"
    zh-TW: "不少人提到組織不太統一,幾乎每週換講師,教學品質參差不齊。"
    ja: "毎週のように講師が替わり、運営や教え方の質にばらつきがあるという指摘が多いです。"
    ko: "거의 매주 강사가 바뀌어 운영이 고르지 않고 강의 질도 들쭉날쭉하다는 언급이 많습니다."
    vi: "Nhiều người nhắc đến việc tổ chức không đồng đều, gần như tuần nào cũng đổi giảng viên, chất lượng giảng dạy không ổn định."
    ms: "Ramai sebut penganjuran tidak seragam, pensyarah berbeza hampir setiap minggu dan kualiti pengajaran berubah-ubah."
    id: "Banyak yang menyebut pengelolaan kurang konsisten, dosen berganti hampir tiap minggu dan kualitas pengajaran tidak merata."
    hi: "कई लोग असमान संगठन का ज़िक्र करते हैं, लगभग हर हफ़्ते अलग लेक्चरर और पढ़ाने की गुणवत्ता में उतार-चढ़ाव।"
difficulty: mixed
