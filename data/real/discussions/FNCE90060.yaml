points:
  - en: "An introduction to corporate finance and financial maths. Reviewers found it practical, and one who got an exemption said it covers basic undergraduate or CFA Level 1 ideas."
    zh: "公司金融和金融数学的入门课。评论者觉得实用；一位拿了免修的人说内容就是本科或CFA一级的基础概念。"
    zh-TW: "公司理財和金融數學的入門課。評論者覺得實用；一位拿到抵免的人說內容就是大學部或 CFA 一級的基礎概念。"
    ja: "企業財務と金融数学の入門。実用的という評価で、免除を受けた人は学部やCFAレベル1の基礎概念だと言う。"
    ko: "기업재무와 금융수학 입문 과목이다. 실용적이라는 평이고, 면제받은 한 명은 학부나 CFA 레벨 1 수준의 기초 개념이라고 했다."
    vi: "Nhập môn tài chính doanh nghiệp và toán tài chính. Người học thấy thực tế, một người được miễn môn nói nội dung là kiến thức cơ bản đại học hoặc CFA cấp 1."
    ms: "Pengenalan kewangan korporat dan matematik kewangan. Pengulas dapati ia praktikal, dan seorang yang dikecualikan kata ia konsep asas sarjana muda atau CFA Tahap 1."
    id: "Pengantar keuangan korporat dan matematika keuangan. Pengulas merasa praktis, dan satu yang dapat pembebasan bilang isinya konsep dasar S1 atau CFA Level 1."
    hi: "कॉर्पोरेट फ़ाइनेंस और फ़ाइनेंशियल मैथ्स का परिचय। रिव्यूअर्स को यह व्यावहारिक लगा, और छूट पाने वाले एक के अनुसार यह अंडरग्रेजुएट या CFA लेवल 1 की बुनियादी बातें हैं।"
  - en: "Several reviewers said to **keep up with the weekly practice questions**. It starts easy but gets harder near the end, and the calculations can be tough without a maths background."
    zh: "多位评论者建议**每周练习题跟上别落下**。前几周不难，后面会变难；没有数学底子的话计算会比较吃力。"
    zh-TW: "多位評論者建議**每週練習題要跟上**。前幾週不難，後面會變難；沒有數學底子的話計算會比較吃力。"
    ja: "**毎週の練習問題を遅れずにこなす**よう複数が勧める。最初は易しいが終盤に難しくなり、数学の素養がないと計算がきつい。"
    ko: "여러 명이 **매주 연습 문제를 밀리지 말라**고 했다. 처음엔 쉽지만 후반에 어려워지고, 수학 배경이 없으면 계산이 힘들 수 있다."
    vi: "Nhiều người khuyên **theo kịp bài luyện tập hằng tuần**. Đầu kỳ dễ nhưng cuối kỳ khó dần, phần tính toán có thể vất vả nếu không có nền toán."
    ms: "Beberapa pengulas kata **ikuti latihan mingguan**. Mula-mula mudah tetapi makin sukar di hujung, dan pengiraan boleh mencabar tanpa latar matematik."
    id: "Beberapa pengulas bilang **ikuti latihan mingguan**. Awalnya mudah tapi makin sulit menjelang akhir, dan hitungannya bisa berat tanpa latar matematika."
    hi: "कई रिव्यूअर्स ने कहा कि **हर हफ़्ते के प्रैक्टिस सवाल समय पर करते रहें**। शुरुआत आसान है पर आख़िर में कठिन होता है, और मैथ्स बैकग्राउंड के बिना कैलकुलेशन भारी लग सकती है।"
  - en: "One reviewer said the final exam is much harder than the weekly questions, so understand how the concepts connect and work through practice exams."
    zh: "有人说期末比每周练习难得多，要弄懂概念之间的联系，多做几遍模拟考。"
    zh-TW: "有人說期末比每週練習難得多，要弄懂概念之間的關聯，多做幾遍模擬考。"
    ja: "期末試験は毎週の問題よりかなり難しいので、概念のつながりを理解し、模擬試験を繰り返すよう勧める声がある。"
    ko: "기말시험이 주간 문제보다 훨씬 어려우니 개념 간 연결을 이해하고 모의고사를 반복하라는 조언이 있다."
    vi: "Một người nói đề cuối kỳ khó hơn nhiều so với bài hằng tuần, nên hiểu mối liên hệ giữa các khái niệm và làm đề thi thử nhiều lần."
    ms: "Seorang kata peperiksaan akhir jauh lebih sukar daripada soalan mingguan, jadi fahami kaitan antara konsep dan buat kertas latihan berulang kali."
    id: "Satu pengulas bilang ujian akhir jauh lebih sulit dari soal mingguan, jadi pahami hubungan antarkonsep dan kerjakan latihan ujian berkali-kali."
    hi: "एक के अनुसार फ़ाइनल परीक्षा हफ़्तेवार सवालों से काफ़ी कठिन है, इसलिए कॉन्सेप्ट्स का आपसी संबंध समझें और प्रैक्टिस पेपर बार-बार करें।"
  - en: "Reviews of the same lecturer were opposite: one found them patient and helpful, another found them unhelpful and unclear on how to solve problems."
    zh: "同一位讲师评价两极：有人觉得耐心、乐于帮忙，也有人觉得不帮忙、解题思路讲不清。"
    zh-TW: "同一位講師評價兩極：有人覺得有耐心、樂於幫忙，也有人覺得不幫忙、解題思路講不清。"
    ja: "同じ講師の評価が正反対で、辛抱強く親切という人もいれば、非協力的で解き方の説明が不十分という人もいる。"
    ko: "같은 강사에 대한 평이 정반대다. 인내심 있고 친절하다는 사람도, 도움이 안 되고 풀이 설명이 부족하다는 사람도 있다."
    vi: "Đánh giá về cùng một giảng viên trái ngược: một người thấy kiên nhẫn, nhiệt tình, người khác thấy không hỗ trợ và giảng cách giải không rõ."
    ms: "Ulasan tentang pensyarah yang sama bertentangan: seorang dapati sabar dan membantu, seorang lagi rasa tidak membantu dan kurang jelas cara menyelesaikan soalan."
    id: "Ulasan soal dosen yang sama bertolak belakang: satu merasa sabar dan membantu, yang lain merasa tidak membantu dan kurang jelas cara menyelesaikan soal."
    hi: "एक ही लेक्चरर पर राय उलटी थी: एक को वे धैर्यवान और मददगार लगे, दूसरे को बेमददगार और सवाल हल करने का तरीक़ा अस्पष्ट।"
difficulty: mixed
