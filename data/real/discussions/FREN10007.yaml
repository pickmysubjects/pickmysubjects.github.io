points:
  - en: "Very speaking-heavy, with readings to prepare for each of two weekly tutorials; confident speakers found it easier."
    zh: "非常注重口语，每周两次辅导课都要预习阅读材料；口语自信的人会觉得轻松一些。"
    zh-TW: "非常注重口說，每週兩次輔導課都要預習閱讀材料；口說有自信的人會覺得輕鬆一些。"
    ja: "スピーキング重視で、週2回のチュートリアルそれぞれに読み物の予習が必要。話すのに自信がある人には楽。"
    ko: "말하기 비중이 매우 크고, 주 2회 튜토리얼마다 읽기 예습이 필요. 말하기에 자신 있으면 수월함."
    vi: "Rất nặng về nói, phải chuẩn bị bài đọc cho cả hai buổi tutorial mỗi tuần; ai tự tin nói thì thấy dễ hơn."
    ms: "Sangat berat pada pertuturan, dengan bacaan untuk disediakan bagi setiap dua tutorial mingguan; penutur yang yakin dapati ia lebih mudah."
    id: "Sangat menekankan berbicara, dengan bacaan yang harus disiapkan untuk dua tutorial tiap minggu; yang percaya diri bicara merasa lebih mudah."
    hi: "बोलने पर बहुत ज़ोर है, और हफ़्ते के दोनों ट्यूटोरियल के लिए रीडिंग्स तैयार करनी होती हैं; आत्मविश्वास से बोलने वालों को आसान लगा।"
  - en: "In 2018 reviewers found the 19th-century history dry, the assessment unclear and essays in French a big jump; by 2021 instructions and oral practice had improved."
    zh: "2018年的评论者觉得19世纪历史内容枯燥、考核要求不清，用法语写完整论文跨度很大；到2021年，说明和口语练习都有改进。"
    zh-TW: "2018年的評論者覺得19世紀歷史內容乏味、評量要求不清，用法語寫完整論文跨度很大；到2021年，說明和口說練習都有改進。"
    ja: "2018年は19世紀の歴史が退屈、評価の指示が不明確、フランス語での本格的なエッセイへの飛躍が大きいという声。2021年には説明と口頭練習が改善された。"
    ko: "2018년엔 19세기 역사가 지루하고 평가 지침이 불분명하며 프랑스어 본격 에세이가 큰 도약이라는 평. 2021년엔 안내와 말하기 연습이 개선됨."
    vi: "Năm 2018, người đánh giá thấy lịch sử thế kỷ 19 khô khan, yêu cầu đánh giá mơ hồ và viết luận bằng tiếng Pháp là bước nhảy lớn; đến 2021 hướng dẫn và luyện nói đã tốt hơn."
    ms: "Pada 2018 pengulas dapati sejarah abad ke-19 hambar, penilaian tidak jelas dan esei dalam Bahasa Perancis satu lonjakan besar; menjelang 2021 arahan dan latihan lisan bertambah baik."
    id: "Di 2018 pengulas merasa sejarah abad ke-19 membosankan, penilaian tidak jelas, dan esai berbahasa Prancis lompatan besar; pada 2021 instruksi dan latihan lisan sudah membaik."
    hi: "2018 में रिव्यूअर्स को 19वीं सदी का इतिहास नीरस, आकलन अस्पष्ट और फ़्रेंच में पूरे निबंध एक बड़ी छलाँग लगे; 2021 तक निर्देश और बोलने का अभ्यास बेहतर हो गए।"
sections:
  content:
    - en: "Very oral heavy, with a focus on French history such as 19th-century France and a film to write on. Several found the topics dry until later weeks; others found it easy if confident speaking."
      zh: "口语分量很重，内容偏法国历史，比如 19 世纪的法国，还要就一部电影写文章。好几位觉得前几周内容枯燥；也有人说口语有自信就很轻松。"
      zh-TW: "口說分量很重，內容偏法國歷史，例如 19 世紀的法國，還要就一部電影寫文章。好幾位覺得前幾週內容枯燥；也有人說口說有自信就很輕鬆。"
      ja: "会話の比重がとても大きく、19世紀フランスなどの歴史と、映画についての作文が中心。後半まで退屈という声が複数、話すのに自信があれば簡単という声も。"
      ko: "말하기 비중이 매우 크고 19세기 프랑스 같은 역사와 영화 에세이가 중심이다. 후반까지 지루하다는 의견이 여럿이고, 말하기에 자신 있으면 쉽다는 의견도 있다."
      vi: "Nặng về nói, tập trung lịch sử Pháp như nước Pháp thế kỷ 19 và viết về một bộ phim. Vài người thấy chủ đề khô cho đến các tuần sau; người khác thấy dễ nếu tự tin nói."
      ms: "Sangat berat lisan, menumpu sejarah Perancis seperti Perancis abad ke-19 dan sebuah filem untuk ditulis. Beberapa rasa topik hambar hingga minggu kemudian; yang lain rasa mudah jika yakin bertutur."
      id: "Sangat berat di lisan, fokus sejarah Prancis seperti Prancis abad ke-19 dan sebuah film untuk ditulis. Beberapa merasa topiknya kering sampai minggu-minggu akhir; yang lain merasa mudah kalau percaya diri berbicara."
      hi: "बोलने पर बहुत ज़ोर, 19वीं सदी के फ़्रांस जैसे फ़्रांसीसी इतिहास और एक फ़िल्म पर लेखन पर केंद्रित। कई को बाद के हफ़्तों तक विषय नीरस लगे; दूसरों को बोलने में आत्मविश्वास हो तो आसान।"
  work:
    - en: "Lots of preparation for two tutorials a week, with readings and grammar sheets, plus full-length essays in French. Some found tasks unclear and marking harsh; one 2021 reviewer said instructions improved."
      zh: "每周两次 tutorial 都要大量准备，有阅读和语法练习，还要用法语写完整论文。有人觉得任务不清楚、给分严；2021 年有同学说说明有改进。"
      zh-TW: "每週兩次 tutorial 都要大量準備，有閱讀和文法練習，還要用法文寫完整論文。有人覺得任務不清楚、給分嚴；2021 年有同學說說明有改善。"
      ja: "週2回のチュートリアルに向けてリーディングや文法シートなど準備が多く、フランス語で本格的なエッセイも書く。課題が不明確で採点が厳しいという声も、2021年には説明が改善したという声も。"
      ko: "주 2회 튜토리얼마다 읽기와 문법 시트 등 준비가 많고, 프랑스어로 긴 에세이도 쓴다. 과제가 불분명하고 채점이 박하다는 의견도, 2021년엔 안내가 나아졌다는 의견도 있다."
      vi: "Phải chuẩn bị nhiều cho hai buổi tutorial mỗi tuần, gồm bài đọc và bài ngữ pháp, cùng tiểu luận đầy đủ bằng tiếng Pháp. Có người thấy đề không rõ và chấm gắt; một người năm 2021 nói hướng dẫn đã rõ hơn."
      ms: "Banyak persediaan untuk dua tutorial seminggu, dengan bacaan dan lembaran tatabahasa, serta esei penuh dalam bahasa Perancis. Ada yang rasa tugasan kabur dan pemarkahan keras; seorang pengulas 2021 kata arahan bertambah baik."
      id: "Banyak persiapan untuk dua tutorial seminggu, dengan bacaan dan lembar tata bahasa, plus esai penuh dalam bahasa Prancis. Ada yang merasa tugasnya tidak jelas dan penilaian keras; satu pengulas 2021 bilang instruksinya membaik."
      hi: "हफ़्ते के दो ट्यूटोरियल के लिए काफ़ी तैयारी, रीडिंग और व्याकरण शीट के साथ, और फ़्रेंच में पूरे निबंध। कुछ को काम अस्पष्ट और मार्किंग सख़्त लगी; 2021 के एक रिव्यूअर ने कहा निर्देश बेहतर हुए।"
  study:
    - en: "Stay on top of the tutorial prep and practise speaking as much as you can."
      zh: "tutorial 的预习要跟上，尽量多练口语。"
      zh-TW: "tutorial 的預習要跟上，盡量多練口說。"
      ja: "チュートリアルの予習に遅れず、できるだけ話す練習を。"
      ko: "튜토리얼 예습을 놓치지 말고 최대한 말하기를 연습하라."
      vi: "Theo kịp phần chuẩn bị cho tutorial và luyện nói nhiều nhất có thể."
      ms: "Ikuti persediaan tutorial dan berlatih bertutur sebanyak mungkin."
      id: "Ikuti persiapan tutorial dan latih berbicara sebanyak mungkin."
      hi: "ट्यूटोरियल की तैयारी समय पर करें और जितना हो सके बोलने का अभ्यास करें।"
  watch:
    - en: "All these reviews are from 2021 or earlier; teaching and exams may have changed since."
      zh: "这些评价都是 2021 年或更早的，现在的教法和考试可能已经变了。"
      zh-TW: "這些評價都是 2021 年或更早的，現在的教法和考試可能已經變了。"
      ja: "レビューはすべて2021年以前のもの。授業や試験は変わっている可能性がある。"
      ko: "모든 리뷰가 2021년 이전 것이라 지금 수업과 시험은 달라졌을 수 있다."
      vi: "Tất cả đánh giá đều từ năm 2021 trở về trước; cách dạy và thi có thể đã thay đổi."
      ms: "Semua ulasan ini dari 2021 atau lebih awal; pengajaran dan peperiksaan mungkin telah berubah."
      id: "Semua ulasan ini dari 2021 atau sebelumnya; pengajaran dan ujian mungkin sudah berubah."
      hi: "ये सभी रिव्यू 2021 या उससे पहले के हैं; पढ़ाई और परीक्षा अब बदल चुकी हो सकती है।"
workload: heavy
