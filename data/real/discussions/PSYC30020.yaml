points:
  - en: "Topics like sleep, pain and motor control are found very interesting, especially by those with physiology or anatomy background."
    zh: "睡眠、疼痛、运动控制等内容很有趣，尤其适合有生理或解剖基础的学生。"
    zh-TW: "睡眠、疼痛、運動控制等內容很有趣，尤其適合有生理或解剖基礎的學生。"
    ja: "睡眠、痛み、運動制御などのテーマはとても面白く、特に生理学や解剖学の知識がある人に好評です。"
    ko: "수면, 통증, 운동 조절 같은 주제는 매우 흥미롭고, 특히 생리학이나 해부학 배경이 있는 사람에게 그렇습니다."
    vi: "Các chủ đề như giấc ngủ, đau và kiểm soát vận động rất thú vị, nhất là với người có nền sinh lý hoặc giải phẫu."
    ms: "Topik seperti tidur, kesakitan dan kawalan motor sangat menarik, terutamanya bagi yang ada latar fisiologi atau anatomi."
    id: "Topik seperti tidur, nyeri, dan kontrol motorik sangat menarik, terutama bagi yang punya dasar fisiologi atau anatomi."
    hi: "नींद, दर्द और मोटर कंट्रोल जैसे टॉपिक्स बहुत दिलचस्प लगते हैं, खासकर फिज़ियोलॉजी या एनाटॉमी बैकग्राउंड वालों को।"
  - en: "The paper review assignment is hard and harshly marked. Critique every flaw you find, as missed points lose marks."
    zh: "文献评述作业难且评分严，要指出所有发现的问题，遗漏就会扣分。"
    zh-TW: "文獻評述作業難且評分嚴，要指出所有發現的問題，遺漏就會扣分。"
    ja: "論文レビュー課題は難しく採点も厳しいです。見逃した点は減点されるので、見つけた欠点はすべて批評しましょう。"
    ko: "논문 리뷰 과제는 어렵고 채점이 엄격합니다. 놓친 부분은 감점되니 찾은 결함은 모두 비평하세요."
    vi: "Bài phê bình bài báo khó và chấm gắt. Hãy chỉ ra mọi lỗi bạn thấy, vì bỏ sót sẽ bị trừ điểm."
    ms: "Tugasan ulasan kertas sukar dan dimarkah ketat. Kritik setiap kelemahan yang anda temui, kerana yang terlepas akan ditolak markah."
    id: "Tugas review makalah sulit dan dinilai ketat. Kritik setiap kelemahan yang kamu temukan, karena yang terlewat mengurangi nilai."
    hi: "पेपर रिव्यू असाइनमेंट कठिन है और मार्किंग सख्त है। हर कमी की आलोचना करें, क्योंकि छूटे पॉइंट्स पर मार्क्स कटते हैं।"
  - en: "Exam views are split: recent reviewers found it easy, but some earlier ones said it tested material not in the slides."
    zh: "对考试看法不一：近期评价觉得简单，但早期有人称考了讲义外内容。"
    zh-TW: "對考試看法不一：近期評價覺得簡單，但早期有人稱考了講義外內容。"
    ja: "試験の評価は分かれます。最近のレビューは簡単だとしていますが、以前はスライドにない内容が出たという声もありました。"
    ko: "시험 의견은 갈립니다. 최근 후기는 쉽다고 했지만, 예전 후기 중에는 슬라이드에 없는 내용이 나왔다는 의견도 있습니다."
    vi: "Ý kiến về bài thi trái chiều: gần đây thấy dễ, nhưng vài người trước đó nói đề hỏi nội dung không có trong slide."
    ms: "Pandangan tentang peperiksaan berbelah bahagi: pengulas terkini dapati ia mudah, tetapi ada yang lebih awal kata ia menguji bahan di luar slaid."
    id: "Pendapat soal ujian terbelah: pengulas terbaru menilai mudah, tapi beberapa yang lebih lama bilang ada materi di luar slide."
    hi: "एग्ज़ाम पर राय बँटी है: हाल के रिव्यूअर्स को आसान लगा, पर कुछ पुराने ने कहा कि स्लाइड्स के बाहर का मटीरियल पूछा गया।"
  - en: "Some found slides mostly images and unclear, so expect some self-teaching."
    zh: "有人反映讲义多为图片、不够清晰，需要一定自学。"
    zh-TW: "有人反映講義多為圖片、不夠清楚，需要一定自學。"
    ja: "スライドがほぼ画像で分かりにくいという人もいるので、ある程度の独学は覚悟しましょう。"
    ko: "슬라이드가 대부분 이미지라 불분명했다는 사람도 있어 어느 정도 독학이 필요합니다."
    vi: "Có người thấy slide chủ yếu là hình ảnh và không rõ ràng, nên hãy chuẩn bị tự học phần nào."
    ms: "Ada yang dapati slaid kebanyakannya imej dan tidak jelas, jadi jangka sedikit pembelajaran kendiri."
    id: "Ada yang merasa slide kebanyakan gambar dan kurang jelas, jadi siap-siap belajar sendiri sebagian."
    hi: "कुछ को स्लाइड्स ज़्यादातर तस्वीरें और अस्पष्ट लगीं, इसलिए कुछ हद तक खुद पढ़ने के लिए तैयार रहें।"
sections:
  content:
    - en: "Interesting biological psychology: lots of sleep, plus pain, movement, stress and consciousness. Most enjoyed it; a physiology or anatomy background helps since basics are covered fast."
      zh: "有趣的生物心理学：大量讲睡眠，还有疼痛、运动、压力和意识。多数人很喜欢；有生理或解剖基础会轻松些，因为基础讲得很快。"
      zh-TW: "有趣的生物心理學：大量講睡眠，還有疼痛、運動、壓力和意識。多數人很喜歡；有生理或解剖基礎會輕鬆些，因為基礎講得很快。"
      ja: "面白い生物心理学。睡眠が中心で、痛み・運動・ストレス・意識も扱う。多くが楽しんだ。基礎は速く進むので生理学や解剖学の素養があると楽。"
      ko: "흥미로운 생물심리학이다. 수면이 중심이고 통증, 운동, 스트레스, 의식도 다룬다. 대부분 즐겼다. 기초를 빨리 넘어가서 생리학·해부학 배경이 있으면 편하다."
      vi: "Tâm lý sinh học thú vị: nhiều về giấc ngủ, thêm đau, vận động, stress và ý thức. Đa số thích; có nền sinh lý hoặc giải phẫu sẽ dễ hơn vì phần cơ bản đi rất nhanh."
      ms: "Psikologi biologi yang menarik: banyak tentang tidur, juga kesakitan, pergerakan, tekanan dan kesedaran. Kebanyakan suka; latar fisiologi atau anatomi membantu kerana asas diajar laju."
      id: "Psikologi biologis yang menarik: banyak soal tidur, juga nyeri, gerak, stres dan kesadaran. Kebanyakan suka; latar fisiologi atau anatomi membantu karena dasarnya dibahas cepat."
      hi: "रोचक जैविक मनोविज्ञान: नींद पर बहुत, साथ में दर्द, गति, तनाव और चेतना। ज़्यादातर को पसंद आया; फ़िज़ियोलॉजी या एनाटॉमी बैकग्राउंड मदद करता है क्योंकि बुनियादी बातें तेज़ी से निकलती हैं।"
    - en: "Several found the slides unclear (mostly pictures) and had to teach themselves; a couple found the consciousness weeks weaker."
      zh: "好几位觉得课件不清楚（大多是图），只能自学；有一两位觉得讲意识的那几周比较弱。"
      zh-TW: "好幾位覺得投影片不清楚（大多是圖），只能自學；有一兩位覺得講意識的那幾週比較弱。"
      ja: "スライドが分かりにくく（ほぼ図のみ）独学が必要だったという声が複数。意識の週は弱かったという人も数人。"
      ko: "슬라이드가 불명확해(대부분 그림) 독학해야 했다는 사람이 여럿이다. 의식 파트 주간이 약했다는 사람도 몇 있다."
      vi: "Vài người thấy slide khó hiểu (chủ yếu là hình) nên phải tự học; vài người thấy các tuần về ý thức yếu hơn."
      ms: "Beberapa orang dapati slaid kurang jelas (kebanyakan gambar) dan terpaksa belajar sendiri; ada yang rasa minggu kesedaran lebih lemah."
      id: "Beberapa orang merasa slide tidak jelas (kebanyakan gambar) sehingga harus belajar sendiri; beberapa merasa minggu tentang kesadaran lebih lemah."
      hi: "कई को स्लाइड अस्पष्ट लगीं (ज़्यादातर तस्वीरें) और ख़ुद पढ़ना पड़ा; कुछ को चेतना वाले हफ़्ते कमज़ोर लगे।"
  work:
    - en: "Two assignments, including a paper review new to most students; many say they are marked harshly and you lose marks for any point you miss."
      zh: "两个作业，其中论文评析对多数人是全新的；很多人说给分严，漏掉任何一点都会扣分。"
      zh-TW: "兩個作業，其中論文評析對多數人是全新的；很多人說給分嚴，漏掉任何一點都會扣分。"
      ja: "課題は2つで、うち論文レビューは多くの学生にとって初めての形式。採点が厳しく、指摘漏れがあると減点されるという声が多い。"
      ko: "과제 두 개 중 논문 리뷰는 대부분에게 처음이다. 채점이 박하고 빠뜨린 포인트마다 감점된다는 의견이 많다."
      vi: "Hai bài tập, trong đó bài phản biện bài báo là mới với hầu hết sinh viên; nhiều người nói chấm khắt khe, sót ý nào là mất điểm."
      ms: "Dua tugasan, termasuk ulasan kertas kajian yang baharu bagi kebanyakan pelajar; ramai kata dinilai ketat dan setiap poin tertinggal ditolak markah."
      id: "Dua tugas, termasuk review paper yang baru bagi kebanyakan mahasiswa; banyak yang bilang penilaiannya ketat dan tiap poin yang terlewat dipotong."
      hi: "दो असाइनमेंट, जिनमें पेपर रिव्यू ज़्यादातर छात्रों के लिए नया है; कई कहते हैं अंकन सख़्त है और छूटे हर बिंदु पर अंक कटते हैं।"
    - en: "Views split on the exam: recent reviewers found it fair and easy, with short 50-word answers, while earlier ones say it tested material not in the slides."
      zh: "考试评价不一：近期的同学觉得公平简单，简答限 50 词；更早的同学说考了课件里没有的内容。"
      zh-TW: "考試評價不一：近期的同學覺得公平簡單，簡答限 50 字；更早的同學說考了投影片裡沒有的內容。"
      ja: "試験は意見が分かれる。最近のレビューは公平で簡単、記述は50語以内という。以前のレビューはスライドにない内容が出たという。"
      ko: "시험은 의견이 갈린다. 최근 리뷰는 공정하고 쉬우며 단답은 50단어 제한이라고 하고, 이전 리뷰는 슬라이드에 없는 내용이 나왔다고 한다."
      vi: "Ý kiến về bài thi chia đôi: người học gần đây thấy công bằng, dễ, câu trả lời ngắn 50 từ; người học trước nói có hỏi nội dung không có trong slide."
      ms: "Pandangan tentang peperiksaan berbelah: pengulas terkini rasa adil dan mudah dengan jawapan pendek 50 patah perkataan, yang lebih awal kata ia menguji bahan di luar slaid."
      id: "Pendapat soal ujian terbelah: pengulas terbaru merasa adil dan mudah dengan jawaban singkat 50 kata, yang lebih lama bilang ada materi di luar slide."
      hi: "परीक्षा पर राय बँटी: हाल के रिव्यूअर्स को यह उचित और आसान लगी, 50 शब्दों के छोटे जवाब; पहले वालों के अनुसार इसमें स्लाइड से बाहर का कंटेंट था।"
  study:
    - en: "For the paper review, pay attention in the tutorials leading up to it, think critically and list every flaw you find, not just examples."
      zh: "论文评析要认真听前面几周的 tutorial，批判性思考，把找到的每个问题都写上，别只举几个例子。"
      zh-TW: "論文評析要認真聽前面幾週的 tutorial，批判性思考，把找到的每個問題都寫上，別只舉幾個例子。"
      ja: "論文レビューに向けて前のチュートリアルをしっかり聞き、批判的に考え、例だけでなく見つけた欠点をすべて書く。"
      ko: "논문 리뷰는 앞선 튜토리얼을 잘 듣고 비판적으로 생각해, 예시만 들지 말고 찾은 결함을 모두 적어라."
      vi: "Với bài phản biện, chú ý các buổi tutorial trước đó, suy nghĩ phản biện và liệt kê mọi lỗi tìm được, đừng chỉ nêu ví dụ."
      ms: "Untuk ulasan kertas, beri perhatian pada tutorial sebelumnya, fikir secara kritis dan senaraikan setiap kelemahan, bukan sekadar contoh."
      id: "Untuk review paper, perhatikan tutorial menjelang tugas, berpikir kritis dan tulis semua kelemahan yang ditemukan, bukan hanya contoh."
      hi: "पेपर रिव्यू के लिए उससे पहले के ट्यूटोरियल ध्यान से सुनें, आलोचनात्मक सोचें और मिली हर कमी लिखें, सिर्फ़ उदाहरण नहीं।"
difficulty: easy
