points:
  - en: "Widely seen as easy. The final is all multiple choice and repeats many practice-quiz questions, so do those quizzes until you know them well."
    zh: "普遍认为容易；期末全是选择题，很多题来自练习测验，要反复做到熟练。"
    zh-TW: "普遍認為容易；期末全是選擇題，很多題來自練習測驗，要反覆做到熟練。"
    ja: "簡単だと広く見られています。期末試験は全問選択式で、練習テストの問題が多く出るので、しっかり身につくまで繰り返しましょう。"
    ko: "대체로 쉽다고 봅니다. 기말은 전부 객관식이고 연습 퀴즈 문제가 많이 나오니 충분히 익힐 때까지 풀어보세요."
    vi: "Được xem là dễ. Thi cuối kỳ toàn trắc nghiệm và lặp lại nhiều câu trong quiz luyện tập, nên làm quiz đến khi thật thuộc."
    ms: "Umumnya dianggap mudah. Peperiksaan akhir semuanya aneka pilihan dan banyak ulang soalan kuiz latihan, jadi buat kuiz itu sehingga anda mahir."
    id: "Umumnya dianggap mudah. Ujian akhir semuanya pilihan ganda dan banyak mengulang soal kuis latihan, jadi kerjakan kuis itu sampai benar-benar paham."
    hi: "इसे आम तौर पर आसान माना जाता है। फाइनल पूरा MCQ है और कई सवाल प्रैक्टिस क्विज़ से दोहराए जाते हैं, इसलिए उन्हें अच्छी तरह याद होने तक करें।"
  - en: "The essay or research paper is marked strictly. Stick closely to the rubric and the assignment guide."
    zh: "论文或研究报告评分严格，要紧扣评分标准和作业指南。"
    zh-TW: "論文或研究報告評分嚴格，要緊扣評分標準和作業指南。"
    ja: "エッセイや研究論文は採点が厳しいです。ルーブリックと課題ガイドにしっかり従いましょう。"
    ko: "에세이나 연구 보고서는 채점이 엄격합니다. 루브릭과 과제 가이드를 꼼꼼히 따르세요."
    vi: "Bài luận hoặc bài nghiên cứu bị chấm gắt. Bám sát rubric và hướng dẫn bài tập."
    ms: "Esei atau kertas penyelidikan dimarkah dengan ketat. Patuhi rubrik dan panduan tugasan dengan teliti."
    id: "Esai atau makalah riset dinilai ketat. Ikuti rubrik dan panduan tugas dengan cermat."
    hi: "निबंध या रिसर्च पेपर की मार्किंग सख्त है। रूब्रिक और असाइनमेंट गाइड को ध्यान से फॉलो करें।"
  - en: "Pracs were widely seen as dull and of little use."
    zh: "实验课普遍被认为枯燥、用处不大。"
    zh-TW: "實驗課普遍被認為枯燥、用處不大。"
    ja: "実習は退屈であまり役に立たないと広く見られていました。"
    ko: "실습은 지루하고 별로 쓸모없다는 평이 많았습니다."
    vi: "Thực hành bị đa số cho là nhàm chán và ít tác dụng."
    ms: "Amali umumnya dianggap membosankan dan kurang berguna."
    id: "Praktikum umumnya dianggap membosankan dan kurang berguna."
    hi: "प्रैक्टिकल्स को आम तौर पर नीरस और कम उपयोगी माना गया।"
  - en: "Generous scaling has been reported. Do the research participation scheme for easy extra marks."
    zh: "有评价提到调分宽松；参加研究被试计划可轻松获得额外分数。"
    zh-TW: "有評價提到調分寬鬆；參加研究受試計畫可輕鬆獲得額外分數。"
    ja: "大幅な得点調整があったという報告があります。研究参加制度に参加すれば簡単に追加点がもらえます。"
    ko: "점수 조정이 후했다는 후기가 있습니다. 연구 참여 제도로 쉽게 추가 점수를 받으세요."
    vi: "Có người cho biết điểm được scale khá rộng tay. Tham gia chương trình làm người tham gia nghiên cứu để dễ có điểm cộng."
    ms: "Ada laporan penskalaan yang murah hati. Sertai skim penyertaan penyelidikan untuk markah tambahan yang mudah."
    id: "Ada laporan scaling yang cukup murah hati. Ikuti program partisipasi riset untuk nilai tambahan yang mudah."
    hi: "उदार स्केलिंग की बात कही गई है। आसान एक्स्ट्रा मार्क्स के लिए रिसर्च पार्टिसिपेशन स्कीम में हिस्सा लें।"
sections:
  content:
    - en: "Most found the content easy: a refresher if you did VCE Psychology, and still manageable without it."
      zh: "多数人觉得内容不难：学过 VCE 心理学的像复习，没学过也能跟上。"
      zh-TW: "多數人覺得內容不難：學過 VCE 心理學的像複習，沒學過也能跟上。"
      ja: "内容は易しいという声が多い。VCE心理学経験者には復習、未経験でもついていける。"
      ko: "대부분 내용이 쉽다고 한다. VCE 심리학을 했다면 복습이고, 안 했어도 따라갈 만하다."
      vi: "Đa số thấy nội dung không khó: như ôn lại nếu đã học VCE Tâm lý, chưa học vẫn theo được."
      ms: "Kebanyakan dapati kandungannya mudah: ulang kaji jika pernah ambil VCE Psikologi, masih boleh diikuti jika tidak."
      id: "Kebanyakan merasa materinya mudah: seperti mengulang jika pernah VCE Psikologi, tetap bisa diikuti jika belum."
      hi: "ज़्यादातर को विषय आसान लगा: VCE साइकोलॉजी पढ़ी हो तो दोहराव, न पढ़ी हो तब भी संभाल सकते हैं।"
    - en: "The neuroscience part needs memorising, such as brain areas and their functions; some found the sensation and perception part physics-heavy."
      zh: "神经科学部分要背不少，比如大脑各区域的功能；有人觉得感觉与知觉部分偏物理。"
      zh-TW: "神經科學部分要背不少，例如大腦各區域的功能；有人覺得感覺與知覺部分偏物理。"
      ja: "神経科学の部分は脳の部位と機能など暗記が多い。感覚・知覚の部分が物理寄りだと感じた人も。"
      ko: "신경과학 부분은 뇌 부위와 기능 같은 암기가 많다. 감각·지각 부분이 물리 쪽이라고 느낀 사람도 있다."
      vi: "Phần thần kinh học cần học thuộc, như các vùng não và chức năng; một số thấy phần cảm giác và tri giác nặng vật lý."
      ms: "Bahagian neurosains perlu banyak hafalan, seperti kawasan otak dan fungsinya; ada yang rasa bahagian sensasi dan persepsi berat fizik."
      id: "Bagian neurosains butuh banyak hafalan, seperti area otak dan fungsinya; sebagian merasa bagian sensasi dan persepsi berat fisika."
      hi: "न्यूरोसाइंस वाले हिस्से में दिमाग़ के हिस्से और उनके काम जैसी काफ़ी रटाई है; कुछ को सेंसेशन और परसेप्शन वाला हिस्सा फ़िज़िक्स-भारी लगा।"
  work:
    - en: "The final is all multiple choice, with many questions almost the same as the online practice quizzes; several mention scaling."
      zh: "期末全是选择题，很多题和网上练习测验几乎一样；好几位同学提到有调分。"
      zh-TW: "期末全是選擇題，很多題和線上練習測驗幾乎一樣；好幾位同學提到有調分。"
      ja: "期末は全問選択式で、オンライン練習クイズとほぼ同じ問題が多い。スケーリングがあったという声も複数。"
      ko: "기말은 전부 객관식이고 온라인 연습 퀴즈와 거의 같은 문제가 많다. 점수 조정이 있었다는 말도 여럿 있다."
      vi: "Bài cuối kỳ toàn trắc nghiệm, nhiều câu gần như giống bài luyện tập trực tuyến; vài người nhắc đến việc nâng điểm."
      ms: "Peperiksaan akhir semuanya aneka pilihan, banyak soalan hampir sama dengan kuiz latihan dalam talian; beberapa sebut ada penskalaan."
      id: "Ujian akhir semuanya pilihan ganda, banyak soal hampir sama dengan kuis latihan online; beberapa menyebut ada penyesuaian nilai."
      hi: "फ़ाइनल पूरा बहुविकल्पीय है, कई सवाल ऑनलाइन प्रैक्टिस क्विज़ जैसे ही; कई ने स्केलिंग का ज़िक्र किया।"
    - en: "The essay (or report) is marked strictly; the group presentation is worth little. Taking part in research studies (REP) gives 5%."
      zh: "论文（或研究报告）改得严；小组展示占分少。参加心理学研究（REP）可以拿 5%。"
      zh-TW: "論文（或研究報告）改得嚴；小組報告占分少。參加心理學研究（REP）可以拿 5%。"
      ja: "エッセイ（またはレポート）の採点は厳しい。グループ発表の配点は小さい。研究参加（REP）で5%もらえる。"
      ko: "에세이(또는 보고서)는 엄격하게 채점된다. 조별 발표 비중은 작다. 연구 참여(REP)로 5%를 받는다."
      vi: "Bài luận (hoặc báo cáo) chấm chặt; thuyết trình nhóm chiếm ít điểm. Tham gia nghiên cứu (REP) được 5%."
      ms: "Esei (atau laporan) dinilai ketat; pembentangan berkumpulan bernilai kecil. Menyertai kajian (REP) beri 5%."
      id: "Esai (atau laporan) dinilai ketat; presentasi kelompok bobotnya kecil. Ikut studi penelitian (REP) memberi 5%."
      hi: "निबंध (या रिपोर्ट) सख़्ती से जाँचा जाता है; ग्रुप प्रेज़ेंटेशन के नंबर कम हैं। रिसर्च स्टडी (REP) में भाग लेने पर 5% मिलता है।"
  study:
    - en: "Redo the Canvas practice quizzes until you score full marks every time."
      zh: "反复做 Canvas 上的练习测验，直到每次都满分。"
      zh-TW: "反覆做 Canvas 上的練習測驗，直到每次都滿分。"
      ja: "Canvasの練習クイズを毎回満点になるまで繰り返す。"
      ko: "Canvas 연습 퀴즈를 매번 만점이 될 때까지 반복하라."
      vi: "Làm lại các bài quiz luyện tập trên Canvas đến khi lần nào cũng đạt điểm tối đa."
      ms: "Ulang kuiz latihan Canvas sehingga dapat markah penuh setiap kali."
      id: "Ulangi kuis latihan Canvas sampai selalu dapat nilai penuh."
      hi: "Canvas के प्रैक्टिस क्विज़ तब तक दोहराएँ जब तक हर बार पूरे नंबर न आएँ।"
    - en: "Write the essay strictly to the rubric and the task guide; use the Q&A sessions and the forum. PASS and the revision sessions are worth going to."
      zh: "论文严格对照评分标准和作业说明写，多用答疑会和讨论区。PASS 和考前复习课值得去。"
      zh-TW: "論文嚴格對照評分標準和作業說明寫，多用答疑會和討論區。PASS 和考前複習課值得去。"
      ja: "エッセイは評価基準と課題説明に忠実に。質問会と掲示板を活用。PASSと試験前の復習会は行く価値あり。"
      ko: "에세이는 루브릭과 과제 안내를 철저히 따라 쓰고, Q&A 세션과 게시판을 활용하라. PASS와 시험 전 복습 세션은 갈 만하다."
      vi: "Viết bài luận bám sát tiêu chí chấm và hướng dẫn; tận dụng buổi hỏi đáp và diễn đàn. PASS và buổi ôn thi đáng tham gia."
      ms: "Tulis esei mengikut rubrik dan panduan tugasan; guna sesi soal jawab dan forum. PASS dan sesi ulang kaji berbaloi dihadiri."
      id: "Tulis esai persis mengikuti rubrik dan panduan tugas; manfaatkan sesi tanya jawab dan forum. PASS dan sesi review layak didatangi."
      hi: "निबंध रूब्रिक और टास्क गाइड के हिसाब से ही लिखें; Q&A सेशन और फ़ोरम का इस्तेमाल करें। PASS और रिवीज़न सेशन जाने लायक हैं।"
  watch:
    - en: "Several found the weekly practicals of little use and barely linked to the exam."
      zh: "好几位同学觉得每周的实践课作用不大，和考试关系很小。"
      zh-TW: "好幾位同學覺得每週的實作課作用不大，和考試關係很小。"
      ja: "毎週の実習はあまり役に立たず、試験との関係も薄いという声が複数。"
      ko: "주간 실습은 별 도움이 안 되고 시험과도 거의 관련 없다는 의견이 여럿이다."
      vi: "Vài người thấy buổi thực hành hằng tuần ít tác dụng và hầu như không liên quan đến thi."
      ms: "Beberapa dapati amali mingguan kurang berguna dan hampir tiada kaitan dengan peperiksaan."
      id: "Beberapa merasa praktikum mingguan kurang berguna dan hampir tidak terkait ujian."
      hi: "कई को साप्ताहिक प्रैक्टिकल ज़्यादा काम के नहीं लगे और परीक्षा से उनका लेना-देना कम था।"
difficulty: easy
