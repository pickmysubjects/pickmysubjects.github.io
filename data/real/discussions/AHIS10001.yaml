code: AHIS10001
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/ahis10001
reviews: 4
from: 2021
to: 2025
checked: 2026-10-17
points:
  - en: "Reviewers from 2021-2025 found it an interesting introduction, focused on movements, themes and ethics of art rather than technical analysis. No art history background is needed."
    zh: "2021-2025年的评论者认为这是一门有趣的入门课，重点是艺术流派、主题和伦理，而非技法分析。不需要艺术史基础。"
    zh-TW: "2021-2025年的評論者認為這是一門有趣的入門課，重點是藝術流派、主題和倫理，而非技法分析。不需要藝術史基礎。"
    ja: "2021-2025年のレビューでは面白い入門科目とされ、技法分析より美術の潮流・テーマ・倫理が中心。美術史の予備知識は不要。"
    ko: "2021-2025년 리뷰어들은 흥미로운 입문 과목이라고 평가. 기법 분석보다 미술 사조·주제·윤리 중심이며 미술사 배경지식은 필요 없음."
    vi: "Người đánh giá 2021-2025 thấy đây là môn nhập môn thú vị, tập trung vào trào lưu, chủ đề và đạo đức nghệ thuật hơn là phân tích kỹ thuật. Không cần nền tảng lịch sử nghệ thuật."
    ms: "Pengulas 2021-2025 dapati ia pengenalan yang menarik, fokus pada aliran, tema dan etika seni, bukan analisis teknikal. Tidak perlu latar belakang sejarah seni."
    id: "Pengulas 2021-2025 menilainya pengantar yang menarik, fokus pada aliran, tema dan etika seni, bukan analisis teknis. Tidak perlu latar sejarah seni."
    hi: "2021-2025 के रिव्यूअर्स को यह दिलचस्प परिचय लगा, जो तकनीकी विश्लेषण से ज़्यादा कला आंदोलनों, थीम और नैतिकता पर है। आर्ट हिस्ट्री का बैकग्राउंड ज़रूरी नहीं।"
  - en: "Assessment is essays: a short first essay sets expectations, the longer one takes real research time. Feedback is described as tough but useful, and Chicago referencing confused some first-years."
    zh: "考核以论文为主：第一篇短文帮你了解要求，长论文需要花时间查资料。反馈严格但有用，Chicago引用格式让部分新生头疼。"
    zh-TW: "考核以論文為主：第一篇短文幫你了解要求，長論文需要花時間查資料。回饋嚴格但有用，Chicago引用格式讓部分新生頭痛。"
    ja: "評価はエッセイ中心。最初の短いエッセイで求められる水準がわかり、長いエッセイは調べものに時間がかかる。フィードバックは厳しいが役立ち、Chicago形式の引用に戸惑う1年生もいた。"
    ko: "평가는 에세이 위주. 첫 짧은 에세이로 기준을 파악하고, 긴 에세이는 자료 조사에 시간이 걸림. 피드백은 엄격하지만 유용하며, Chicago 인용 형식에 헷갈린 1학년도 있었음."
    vi: "Đánh giá bằng bài luận: bài ngắn đầu tiên cho biết yêu cầu, bài dài cần thời gian nghiên cứu. Phản hồi khắt khe nhưng hữu ích; cách trích dẫn Chicago làm một số sinh viên năm nhất bối rối."
    ms: "Penilaian ialah esei: esei pendek pertama menunjukkan jangkaan, esei panjang perlukan masa penyelidikan. Maklum balas tegas tetapi berguna; rujukan Chicago mengelirukan sesetengah pelajar tahun satu."
    id: "Penilaian berupa esai: esai pendek pertama memberi gambaran standar, esai panjang butuh waktu riset. Umpan balik ketat tapi berguna; sitasi Chicago membingungkan sebagian mahasiswa baru."
    hi: "असेसमेंट निबंध हैं: पहला छोटा निबंध अपेक्षाएँ समझाता है, लंबे वाले में रिसर्च का समय लगता है। फ़ीडबैक सख़्त पर काम का बताया गया; Chicago रेफ़रेंसिंग से कुछ फ़र्स्ट-ईयर उलझे।"
  - en: "Tutorials are discussion-based and were often called the best part, along with a gallery excursion. Several took it as a breadth and found it manageable."
    zh: "辅导课以讨论为主，常被认为是最好的部分，美术馆参观也受好评。有几人把它当跨学科选修，觉得负担可控。"
    zh-TW: "輔導課以討論為主，常被認為是最好的部分，美術館參訪也受好評。有幾人把它當Breadth選修，覺得負擔可控。"
    ja: "チュートリアルはディスカッション中心で、美術館見学と並んで一番良かったという声が多い。Breadthとして取って無理なくこなせたという人も。"
    ko: "튜토리얼은 토론 위주로 미술관 견학과 함께 가장 좋았다는 평이 많음. Breadth로 들었는데 부담이 적당했다는 사람도 있음."
    vi: "Tutorial chủ yếu thảo luận và thường được khen nhất, cùng chuyến tham quan bảo tàng. Vài người học làm Breadth và thấy vừa sức."
    ms: "Tutorial berasaskan perbincangan dan sering dianggap bahagian terbaik, bersama lawatan galeri. Beberapa orang ambil sebagai Breadth dan dapati ia boleh diurus."
    id: "Tutorial berbasis diskusi dan sering disebut bagian terbaik, bersama kunjungan galeri. Beberapa orang mengambilnya sebagai Breadth dan merasa bebannya wajar."
    hi: "ट्यूटोरियल चर्चा पर आधारित हैं और गैलरी विज़िट के साथ इन्हें अक्सर सबसे अच्छा हिस्सा बताया गया। कुछ ने इसे Breadth के रूप में लिया और बोझ संभालने लायक पाया।"
