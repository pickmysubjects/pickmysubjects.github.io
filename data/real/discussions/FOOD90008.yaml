points:
  - en: "Opinions are split: one reviewer praised the teachers and found the ideas interesting, another just called it bad."
    zh: "评价两极：一位夸老师好、内容有意思，另一位只说很差。"
    zh-TW: "評價兩極：一位稱讚老師、覺得內容有趣，另一位只說很差。"
    ja: "評価は分かれる。教員が良く内容も面白いという人もいれば、ひどいと一言で切り捨てる人もいる。"
    ko: "평가가 엇갈린다. 교수진이 좋고 내용이 흥미롭다는 평도 있고, 별로라는 짧은 평도 있다."
    vi: "Ý kiến trái chiều: một người khen giảng viên và thấy nội dung thú vị, người khác chỉ nói là tệ."
    ms: "Pendapat berbelah bahagi: seorang memuji pensyarah dan dapati idea menarik, seorang lagi kata ia teruk."
    id: "Pendapat terbelah: satu pengulas memuji pengajar dan merasa idenya menarik, yang lain hanya bilang buruk."
    hi: "राय बंटी हुई है: एक ने शिक्षकों की तारीफ़ की और विषय दिलचस्प पाया, दूसरे ने बस इसे खराब कहा।"
  - en: "One detailed 2022 review found lectures read from slides, feedback generic, and the **mid-semester test asking about things not taught**."
    zh: "一篇 2022 年的长评说讲课照着幻灯片念、反馈很笼统，**期中考还考了没教过的内容**。"
    zh-TW: "一篇 2022 年的長評說講課照著投影片念、回饋很籠統，**期中考還考了沒教過的內容**。"
    ja: "2022年の詳しいレビューでは、講義はスライドの読み上げ、フィードバックは画一的で、**中間テストに習っていない内容が出た**とある。"
    ko: "2022년의 자세한 후기에 따르면 강의는 슬라이드를 읽는 수준이고 피드백은 형식적이며, **중간고사에 배우지 않은 내용이 나왔다**."
    vi: "Một đánh giá chi tiết năm 2022 cho rằng giảng viên đọc slide, nhận xét chung chung và **bài kiểm tra giữa kỳ hỏi cả phần không dạy**."
    ms: "Satu ulasan terperinci 2022 kata kuliah sekadar membaca slaid, maklum balas umum, dan **ujian pertengahan semester tanya perkara yang tidak diajar**."
    id: "Satu ulasan rinci tahun 2022 menyebut kuliah hanya membaca slide, umpan baliknya umum, dan **ujian tengah semester menanyakan hal yang tidak diajarkan**."
    hi: "2022 के एक विस्तृत रिव्यू के अनुसार लेक्चर स्लाइड पढ़कर होते थे, फ़ीडबैक सामान्य था, और **मिड-सेमेस्टर टेस्ट में बिना पढ़ाए विषय पूछे गए**।"
  - en: "That reviewer also had a group assignment where teammates barely helped, and slow replies from staff."
    zh: "这位评论者还提到小组作业队友几乎不出力，老师回复也慢。"
    zh-TW: "這位評論者還提到小組作業隊友幾乎不出力，老師回覆也慢。"
    ja: "同じレビューでは、グループ課題で班員がほとんど貢献せず、教員の返信も遅かったとしている。"
    ko: "같은 후기에서 조별 과제 팀원이 거의 기여하지 않았고 교직원 답장도 느렸다고 했다."
    vi: "Người này cũng gặp bài nhóm mà thành viên hầu như không đóng góp, và giảng viên trả lời chậm."
    ms: "Pengulas itu juga dapat tugasan berkumpulan dengan ahli yang hampir tidak membantu, dan balasan staf lambat."
    id: "Pengulas itu juga mendapat tugas kelompok yang anggotanya hampir tidak membantu, dan balasan staf lambat."
    hi: "उसी रिव्यूअर के ग्रुप असाइनमेंट में साथियों ने लगभग कुछ नहीं किया, और स्टाफ़ जवाब देने में धीमा था।"
