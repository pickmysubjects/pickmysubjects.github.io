points:
  - en: "Recent reviewers (2025-2026) warn it is no longer a WAM booster since the exam moved on campus and was marked harshly."
    zh: "近期（2025-2026年）评论者提醒，考试改为线下且评分严格后，这门课已不再能拉高WAM。"
  - en: "The exam is worth about 80% and is short, so time is tight even with open-book notes; organise notes well."
    zh: "考试约占80%且时间短，即使开卷时间也很紧；要把笔记整理好。"
  - en: "Content is widely seen as dry and theory-heavy, with many weeks on contract law; the online format makes it easy to fall behind."
    zh: "内容普遍被认为枯燥、理论性强，合同法占了很多周；线上授课很容易落后。"
  - en: "Quizzes are easy; it suits students with an interest in law or who need it as a prerequisite."
    zh: "小测较简单；适合对法律感兴趣或需要作为先修课的学生。"
difficulty: mixed
