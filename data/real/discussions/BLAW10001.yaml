code: BLAW10001
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/blaw10001
reviews: 10
from: 2019
to: 2026
checked: 2026-10-08
points:
  - en: "Recent reviewers (2025-2026) warn it is no longer a WAM booster since the exam moved on campus and was marked harshly."
    zh: "近期（2025-2026年）评论者提醒，考试改为线下且评分严格后，这门课已不再能拉高WAM。"
    zh-TW: "近期（2025-2026年）評論者提醒，考試改為實體且評分嚴格後，這門課已不再能拉高WAM。"
    ja: "最近（2025-2026年）のレビューでは、試験がキャンパスでの実施になり採点も厳しくなったため、もうWAMを上げやすい科目ではないと注意している。"
    ko: "최근(2025-2026년) 리뷰어들은 시험이 캠퍼스 대면으로 바뀌고 채점이 엄격해져 더 이상 WAM 올리기 좋은 과목이 아니라고 경고한다."
    vi: "Đánh giá gần đây (2025-2026) cảnh báo môn không còn kéo WAM vì bài thi chuyển sang thi tại trường và chấm khắt khe."
    ms: "Pengulas terkini (2025-2026) memberi amaran ia bukan lagi penaik WAM sejak peperiksaan dipindah ke kampus dan dimarkah dengan keras."
    id: "Ulasan terbaru (2025-2026) memperingatkan ini bukan lagi pendongkrak WAM sejak ujian pindah ke kampus dan dinilai keras."
    hi: "हाल के रिव्यूअर्स (2025-2026) चेताते हैं कि परीक्षा कैंपस में होने और सख़्त मार्किंग के बाद यह अब WAM बढ़ाने वाला नहीं रहा।"
  - en: "The exam is worth about 80% and is short, so time is tight even with open-book notes; organise notes well."
    zh: "考试约占80%且时间短，即使开卷时间也很紧；要把笔记整理好。"
    zh-TW: "考試約占80%且時間短，即使開書也很趕；筆記要整理好。"
    ja: "試験は約80%の配点で時間が短く、ノート持ち込み可でも時間はギリギリ。ノートをよく整理しておこう。"
    ko: "시험이 약 80% 비중이고 짧아서 오픈북이어도 시간이 빠듯하다. 노트를 잘 정리해 두자."
    vi: "Bài thi chiếm khoảng 80% và ngắn, nên dù được mở tài liệu vẫn rất gấp; hãy sắp xếp ghi chú thật gọn."
    ms: "Peperiksaan bernilai kira-kira 80% dan singkat, jadi masa suntuk walaupun buku terbuka; susun nota dengan baik."
    id: "Ujian berbobot sekitar 80% dan singkat, jadi waktunya mepet walau open-book; rapikan catatanmu."
    hi: "परीक्षा लगभग 80% की और छोटी है, इसलिए ओपन-बुक नोट्स के बावजूद समय कम पड़ता है; नोट्स अच्छे से व्यवस्थित रखें।"
  - en: "Content is widely seen as dry and theory-heavy, with many weeks on contract law; the online format makes it easy to fall behind."
    zh: "内容普遍被认为枯燥、理论性强，合同法占了很多周；线上授课很容易落后。"
    zh-TW: "內容普遍被認為枯燥、偏理論，契約法占了好幾週；線上授課很容易落後。"
    ja: "内容は退屈で理論中心と広く見られ、契約法に何週も使う。オンライン形式なので遅れやすい。"
    ko: "내용은 지루하고 이론 위주라는 평이 많고, 계약법에 여러 주를 쓴다. 온라인 수업이라 뒤처지기 쉽다."
    vi: "Nội dung bị nhiều người thấy khô khan, nặng lý thuyết, nhiều tuần học luật hợp đồng; học online nên dễ bị tụt lại."
    ms: "Kandungan secara meluas dianggap membosankan dan berat teori, dengan banyak minggu tentang undang-undang kontrak; format dalam talian mudah buat ketinggalan."
    id: "Materinya banyak dinilai membosankan dan berat teori, dengan banyak minggu soal hukum kontrak; format online bikin mudah tertinggal."
    hi: "कंटेंट को ज़्यादातर नीरस और थ्योरी-भारी माना जाता है, कई हफ़्ते कॉन्ट्रैक्ट लॉ पर; ऑनलाइन फ़ॉर्मेट में पीछे रह जाना आसान है।"
  - en: "Quizzes are easy; it suits students with an interest in law or who need it as a prerequisite."
    zh: "小测较简单；适合对法律感兴趣或需要作为先修课的学生。"
    zh-TW: "小測很簡單；適合對法律有興趣或需要它當先修課的學生。"
    ja: "小テストは簡単。法律に興味がある人や前提科目として必要な人向け。"
    ko: "퀴즈는 쉽다. 법에 관심 있거나 선수 과목으로 필요한 학생에게 맞다."
    vi: "Quiz dễ; hợp với sinh viên thích luật hoặc cần môn này làm môn tiên quyết."
    ms: "Kuiz mudah; sesuai untuk pelajar yang berminat dalam undang-undang atau perlukannya sebagai prasyarat."
    id: "Kuisnya mudah; cocok untuk mahasiswa yang tertarik hukum atau butuh sebagai prasyarat."
    hi: "क्विज़ आसान हैं; यह क़ानून में रुचि रखने वालों या इसे प्रीरिक्विज़िट के रूप में लेने वालों के लिए ठीक है।"
sections:
  content:
    - en: "An online intro to legal principles for business, with many weeks on contract law. Most found it straightforward but dry; some enjoyed applying the law."
      zh: "面向商科的法律原理入门，网上授课，合同法占很多周。多数人觉得不难但枯燥；也有人喜欢把法律用到案例上。"
      zh-TW: "面向商科的法律原理入門，線上授課，契約法占很多週。多數人覺得不難但乏味；也有人喜歡把法律套用到案例上。"
      ja: "ビジネス向け法原則のオンライン入門で、契約法に多くの週を割く。分かりやすいが退屈という声が多いが、法の適用を楽しんだ人もいる。"
      ko: "비즈니스를 위한 법 원칙 온라인 입문으로, 계약법에 여러 주를 할애한다. 대부분 무난하지만 건조하다고 하며, 법 적용을 즐긴 사람도 있다."
      vi: "Nhập môn nguyên tắc pháp luật cho kinh doanh, học online, nhiều tuần về luật hợp đồng. Đa số thấy dễ hiểu nhưng khô; vài người thích phần áp dụng luật."
      ms: "Pengenalan prinsip undang-undang untuk perniagaan secara dalam talian, dengan banyak minggu tentang undang-undang kontrak. Kebanyakan rasa mudah tetapi hambar; ada yang suka mengaplikasi undang-undang."
      id: "Pengantar prinsip hukum untuk bisnis secara online, dengan banyak minggu tentang hukum kontrak. Kebanyakan merasa lugas tapi kering; ada yang menikmati menerapkan hukumnya."
      hi: "बिज़नेस के लिए कानूनी सिद्धांतों का ऑनलाइन परिचय, कई हफ़्ते कॉन्ट्रैक्ट लॉ पर। ज़्यादातर को सीधा पर नीरस लगा; कुछ को कानून लागू करना पसंद आया।"
  work:
    - en: "Easy quizzes plus an exam worth about 80%. Recent reviewers say the on-campus exam is short, harder than the practice material and marked harshly, so being open book helps less than you'd think."
      zh: "简单的小测，加上约占 80% 的考试。近期同学说校内考试时间短、比练习材料难、改分严，所以开卷的帮助没想象中大。"
      zh-TW: "簡單的小考，加上約占 80% 的考試。近期同學說校內考試時間短、比練習資料難、給分嚴，所以開書的幫助沒想像中大。"
      ja: "簡単なクイズと約80%の試験。最近の受講者によると、対面試験は短く、練習教材より難しく採点も厳しいので、オープンブックの利点は思ったほどない。"
      ko: "쉬운 퀴즈와 약 80%짜리 시험. 최근 리뷰어들은 대면 시험이 짧고 연습 자료보다 어려우며 채점이 가혹해, 오픈북이라는 이점이 생각보다 작다고 한다."
      vi: "Quiz dễ cùng bài thi khoảng 80%. Những người gần đây nói thi tại trường ngắn, khó hơn tài liệu luyện tập và chấm gắt, nên mở sách không giúp nhiều như bạn nghĩ."
      ms: "Kuiz mudah serta peperiksaan kira-kira 80%. Pengulas terkini kata peperiksaan di kampus pendek, lebih sukar dari bahan latihan dan dimarkah keras, jadi buku terbuka kurang membantu dari jangkaan."
      id: "Kuis mudah plus ujian sekitar 80%. Reviewer terbaru bilang ujian di kampus singkat, lebih sulit dari bahan latihan, dan dinilai keras, jadi open-book tak banyak membantu seperti dikira."
      hi: "आसान क्विज़ और लगभग 80% की परीक्षा। हाल के रिव्यूअर कहते हैं कैंपस परीक्षा छोटी, प्रैक्टिस सामग्री से कठिन और सख़्ती से जाँची जाती है, इसलिए ओपन-बुक उतना काम नहीं आता।"
  study:
    - en: "Stay disciplined since it's online and workshops are optional. Build well-organised notes you can find things in quickly, as time in the exam is tight."
      zh: "网课加上 workshop 是选修，要自律。把笔记整理好、能快速找到内容，因为考试时间很紧。"
      zh-TW: "線上課加上 workshop 是選修，要自律。把筆記整理好、能快速找到內容，因為考試時間很緊。"
      ja: "オンラインでワークショップも任意なので自己管理を。試験時間は厳しいので、すぐ探せるよう整理されたノートを作ろう。"
      ko: "온라인이고 워크숍도 선택이라 스스로 관리해야 한다. 시험 시간이 빠듯하니 빨리 찾을 수 있게 잘 정리된 노트를 만들자."
      vi: "Hãy kỷ luật vì học online và workshop không bắt buộc. Soạn ghi chú gọn gàng để tìm nhanh, vì thời gian thi rất gấp."
      ms: "Berdisiplin kerana ia dalam talian dan bengkel pilihan. Sediakan nota tersusun yang mudah dicari dengan cepat, kerana masa peperiksaan suntuk."
      id: "Disiplinlah karena kuliahnya online dan workshop opsional. Buat catatan rapi yang cepat dicari, karena waktu ujian mepet."
      hi: "अनुशासित रहें क्योंकि यह ऑनलाइन है और वर्कशॉप वैकल्पिक हैं। ऐसे व्यवस्थित नोट्स बनाएँ जिनमें जल्दी चीज़ें मिलें, क्योंकि परीक्षा में समय कम है।"
  watch:
    - en: "Recent reviewers warn it's no longer the WAM booster older reviews describe, since the exam moved on campus."
      zh: "近期同学提醒，考试改为校内后，它已经不是旧评价里说的拉 WAM 课了。"
      zh-TW: "近期同學提醒，考試改為校內後，它已不是舊評價裡說的拉 WAM 課了。"
      ja: "試験が対面になってから、古いレビューにあるようなWAMを上げる科目ではなくなったと最近の受講者は警告する。"
      ko: "시험이 대면으로 바뀐 뒤로는 예전 리뷰처럼 WAM을 올려주는 과목이 아니라고 최근 리뷰어들이 경고한다."
      vi: "Những người gần đây cảnh báo môn không còn là môn kéo WAM như đánh giá cũ, vì thi đã chuyển về trường."
      ms: "Pengulas terkini beri amaran ia bukan lagi penaik WAM seperti ulasan lama, kerana peperiksaan kini di kampus."
      id: "Reviewer terbaru mengingatkan ini bukan lagi pendongkrak WAM seperti di ulasan lama, karena ujiannya kini di kampus."
      hi: "हाल के रिव्यूअर चेताते हैं कि परीक्षा कैंपस में होने के बाद यह पुराने रिव्यू वाला WAM बूस्टर नहीं रहा।"
difficulty: hard
