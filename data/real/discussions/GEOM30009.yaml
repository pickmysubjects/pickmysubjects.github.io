points:
  - en: "Widely seen as an easy level-3 science subject where an H1 is achievable, with step-by-step assignments."
    zh: "普遍认为是容易的三年级理科课，作业有分步指导，H1可期。"
    zh-TW: "普遍被認為是簡單的三年級理科科目，作業有分步指引，H1拿得到。"
    ja: "簡単な3年次の理系科目として知られ、課題は段階的でH1も狙える。"
    ko: "쉬운 3학년 이과 과목으로 알려져 있으며, 단계별 과제로 H1도 가능함."
    vi: "Được xem là môn khoa học năm ba dễ, có thể đạt H1, với bài tập theo từng bước."
    ms: "Dilihat sebagai subjek sains tahap 3 yang mudah dan H1 boleh dicapai, dengan tugasan langkah demi langkah."
    id: "Dianggap mata kuliah sains tingkat 3 yang mudah, H1 bisa diraih, dengan tugas langkah demi langkah."
    hi: "आम तौर पर आसान लेवल-3 साइंस सब्जेक्ट माना जाता है जिसमें H1 मिल सकता है, स्टेप-बाय-स्टेप असाइनमेंट के साथ।"
  - en: "Recent reviews flag vague or empty rubrics, so ask tutors exactly what they check."
    zh: "近期评价指出评分标准模糊甚至空白，建议向辅导老师问清检查要点。"
    zh-TW: "近期評論指出評分標準模糊甚至空白，所以要問清楚助教到底看什麼。"
    ja: "最近の口コミでは評価基準が曖昧または空欄との指摘。チューターに何を見るのか正確に聞こう。"
    ko: "최근 후기는 채점 기준이 모호하거나 비어 있다고 지적하니, 튜터에게 무엇을 보는지 정확히 물어보세요."
    vi: "Đánh giá gần đây chỉ ra rubric mơ hồ hoặc trống, nên hãy hỏi tutor chính xác họ chấm gì."
    ms: "Ulasan terkini menandakan rubrik yang kabur atau kosong, jadi tanya tutor dengan tepat apa yang mereka semak."
    id: "Ulasan terbaru menyoroti rubrik yang samar atau kosong, jadi tanyakan ke tutor apa persisnya yang mereka nilai."
    hi: "हाल के रिव्यू अस्पष्ट या ख़ाली रूब्रिक की ओर इशारा करते हैं, तो ट्यूटर से ठीक-ठीक पूछें कि वे क्या जाँचते हैं।"
  - en: "Group assignments use peer evaluations that can scale your mark up or down, so a good group matters."
    zh: "小组作业有同伴互评，会上下调整个人分数，组员很重要。"
    zh-TW: "小組作業有同儕互評，可能會調高或調低你的分數，所以組員很重要。"
    ja: "グループ課題には相互評価があり点数が上下するので、良いグループが大事。"
    ko: "조별 과제는 동료 평가로 점수가 오르내릴 수 있으니 좋은 조가 중요함."
    vi: "Bài tập nhóm có đánh giá chéo có thể nâng hoặc hạ điểm của bạn, nên nhóm tốt rất quan trọng."
    ms: "Tugasan berkumpulan guna penilaian rakan yang boleh naikkan atau turunkan markah anda, jadi kumpulan yang baik penting."
    id: "Tugas kelompok memakai penilaian sejawat yang bisa menaikkan atau menurunkan nilaimu, jadi kelompok yang baik penting."
    hi: "ग्रुप असाइनमेंट में पीयर इवैल्यूएशन होता है जो आपके मार्क्स ऊपर-नीचे कर सकता है, तो अच्छा ग्रुप ज़रूरी है।"
  - en: "Content is dry. Practical software may need Windows and strong hardware, so plan computer access."
    zh: "内容较枯燥；实验软件可能需要Windows和较好配置，要提前安排电脑。"
    zh-TW: "內容枯燥。實作軟體可能需要Windows和較好的硬體，要先安排好電腦。"
    ja: "内容は単調。実習ソフトはWindowsと高性能なPCが必要な場合があるので、使えるPCを確保しておこう。"
    ko: "내용은 지루하며, 실습 소프트웨어는 Windows와 좋은 사양이 필요할 수 있으니 컴퓨터를 미리 준비하세요."
    vi: "Nội dung khô khan. Phần mềm thực hành có thể cần Windows và máy cấu hình mạnh, nên hãy chuẩn bị máy tính."
    ms: "Kandungan membosankan. Perisian amali mungkin perlukan Windows dan perkakasan kuat, jadi rancang akses komputer."
    id: "Materinya membosankan. Software praktikum mungkin butuh Windows dan perangkat keras kuat, jadi siapkan akses komputer."
    hi: "कंटेंट नीरस है। प्रैक्टिकल सॉफ़्टवेयर के लिए Windows और दमदार हार्डवेयर चाहिए हो सकता है, तो कंप्यूटर का इंतज़ाम पहले से करें।"
difficulty: easy
