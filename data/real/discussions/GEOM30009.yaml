reviews: 8
from: 2017
to: 2026
checked: 2026-10-08
points:
  - en: "Widely seen as an easy level-3 science subject where an H1 is achievable, with step-by-step assignments."
    zh: "普遍认为是容易的三年级理科课，作业有分步指导，H1可期。"
    zh-TW: "普遍被認為是簡單的三年級理科科目，作業有分步指引，H1拿得到。"
    ja: "簡単な3年次の理系科目として知られ、課題は段階的でH1も狙える。"
    ko: "쉬운 3학년 이과 과목으로 알려져 있으며, 단계별 과제로 H1도 가능함."
    vi: "Được xem là môn khoa học năm ba dễ, có thể đạt H1, với bài tập theo từng bước."
    ms: "Dilihat sebagai subjek sains tahap 3 yang mudah dan H1 boleh dicapai, dengan tugasan langkah demi langkah."
    id: "Dianggap mata kuliah sains tingkat 3 yang mudah, H1 bisa diraih, dengan tugas langkah demi langkah."
    hi: "आम तौर पर आसान लेवल-3 साइंस सब्जेक्ट माना जाता है जिसमें H1 मिल सकता है, स्टेप-बाय-स्टेप असाइनमेंट के साथ।"
  - en: "Recent reviews flag vague or empty rubrics, so ask tutors exactly what they check."
    zh: "近期评价指出评分标准模糊甚至空白，建议向辅导老师问清检查要点。"
    zh-TW: "近期評論指出評分標準模糊甚至空白，所以要問清楚助教到底看什麼。"
    ja: "最近の口コミでは評価基準が曖昧または空欄との指摘。チューターに何を見るのか正確に聞こう。"
    ko: "최근 후기는 채점 기준이 모호하거나 비어 있다고 지적하니, 튜터에게 무엇을 보는지 정확히 물어보세요."
    vi: "Đánh giá gần đây chỉ ra rubric mơ hồ hoặc trống, nên hãy hỏi tutor chính xác họ chấm gì."
    ms: "Ulasan terkini menandakan rubrik yang kabur atau kosong, jadi tanya tutor dengan tepat apa yang mereka semak."
    id: "Ulasan terbaru menyoroti rubrik yang samar atau kosong, jadi tanyakan ke tutor apa persisnya yang mereka nilai."
    hi: "हाल के रिव्यू अस्पष्ट या ख़ाली रूब्रिक की ओर इशारा करते हैं, तो ट्यूटर से ठीक-ठीक पूछें कि वे क्या जाँचते हैं।"
  - en: "Group assignments use peer evaluations that can scale your mark up or down, so a good group matters."
    zh: "小组作业有同伴互评，会上下调整个人分数，组员很重要。"
    zh-TW: "小組作業有同儕互評，可能會調高或調低你的分數，所以組員很重要。"
    ja: "グループ課題には相互評価があり点数が上下するので、良いグループが大事。"
    ko: "조별 과제는 동료 평가로 점수가 오르내릴 수 있으니 좋은 조가 중요함."
    vi: "Bài tập nhóm có đánh giá chéo có thể nâng hoặc hạ điểm của bạn, nên nhóm tốt rất quan trọng."
    ms: "Tugasan berkumpulan guna penilaian rakan yang boleh naikkan atau turunkan markah anda, jadi kumpulan yang baik penting."
    id: "Tugas kelompok memakai penilaian sejawat yang bisa menaikkan atau menurunkan nilaimu, jadi kelompok yang baik penting."
    hi: "ग्रुप असाइनमेंट में पीयर इवैल्यूएशन होता है जो आपके मार्क्स ऊपर-नीचे कर सकता है, तो अच्छा ग्रुप ज़रूरी है।"
  - en: "Content is dry. Practical software may need Windows and strong hardware, so plan computer access."
    zh: "内容较枯燥；实验软件可能需要Windows和较好配置，要提前安排电脑。"
    zh-TW: "內容枯燥。實作軟體可能需要Windows和較好的硬體，要先安排好電腦。"
    ja: "内容は単調。実習ソフトはWindowsと高性能なPCが必要な場合があるので、使えるPCを確保しておこう。"
    ko: "내용은 지루하며, 실습 소프트웨어는 Windows와 좋은 사양이 필요할 수 있으니 컴퓨터를 미리 준비하세요."
    vi: "Nội dung khô khan. Phần mềm thực hành có thể cần Windows và máy cấu hình mạnh, nên hãy chuẩn bị máy tính."
    ms: "Kandungan membosankan. Perisian amali mungkin perlukan Windows dan perkakasan kuat, jadi rancang akses komputer."
    id: "Materinya membosankan. Software praktikum mungkin butuh Windows dan perangkat keras kuat, jadi siapkan akses komputer."
    hi: "कंटेंट नीरस है। प्रैक्टिकल सॉफ़्टवेयर के लिए Windows और दमदार हार्डवेयर चाहिए हो सकता है, तो कंप्यूटर का इंतज़ाम पहले से करें।"
sections:
  content:
    - en: "Remote sensing and imaging of the environment. Reviewers call it one of the easier level 3 science subjects and a likely H1, though several found the lectures dry."
      zh: "讲环境遥感与成像。同学说是比较简单的三年级理科课之一，H1 很有希望；但好几位觉得讲课枯燥。"
      zh-TW: "講環境遙測與成像。同學說是比較簡單的三年級理科課之一，H1 很有機會；但好幾位覺得上課枯燥。"
      ja: "環境のリモートセンシングと画像解析。3年次の理系科目の中では易しく、H1も取りやすいという声。ただし講義が退屈という声も複数。"
      ko: "환경 원격 탐사와 영상을 다룬다. 쉬운 편인 3학년 이공계 과목으로 H1 가능성이 높다는 평이지만, 강의가 건조하다는 의견도 여럿."
      vi: "Viễn thám và chụp ảnh môi trường. Người học gọi đây là một trong những môn khoa học năm ba dễ hơn và dễ đạt H1, dù vài người thấy bài giảng khô."
      ms: "Penderiaan jauh dan pengimejan alam sekitar. Pengulas kata ia antara subjek sains tahap 3 yang lebih mudah dan H1 berkemungkinan, walaupun beberapa rasa kuliah hambar."
      id: "Penginderaan jauh dan pencitraan lingkungan. Pengulas menyebutnya salah satu mata kuliah sains tingkat 3 yang lebih mudah dan H1 cukup mungkin, meski beberapa merasa kuliahnya kering."
      hi: "पर्यावरण की रिमोट सेंसिंग और इमेजिंग। रिव्यूअर्स इसे तीसरे स्तर के आसान साइंस विषयों में गिनते हैं और H1 संभव बताते हैं, हालाँकि कई को लेक्चर नीरस लगे।"
  work:
    - en: "Step-by-step practical reports, in recent years done in groups of four with peer evaluations that scale your mark, plus an easy multiple-choice MST and a final exam."
      zh: "按步骤完成的实操报告，近几年是四人小组做，还有会调整个人分数的同伴互评；另有简单的选择题 MST 和期末。"
      zh-TW: "照步驟完成的實作報告，近幾年是四人小組做，還有會調整個人分數的同儕互評；另有簡單的選擇題 MST 和期末。"
      ja: "手順に沿って進める実習レポートで、近年は4人グループで行い、相互評価で個人の点数が調整される。簡単な選択式MSTと期末試験もある。"
      ko: "단계별로 진행하는 실습 보고서로 최근엔 4인 조로 하고 동료 평가로 개인 점수가 조정된다. 쉬운 객관식 MST와 기말시험도 있다."
      vi: "Báo cáo thực hành theo từng bước, mấy năm gần đây làm nhóm bốn người với đánh giá chéo điều chỉnh điểm cá nhân, cùng MST trắc nghiệm dễ và thi cuối kỳ."
      ms: "Laporan amali langkah demi langkah, kebelakangan ini dalam kumpulan empat dengan penilaian rakan yang menskala markah anda, serta MST aneka pilihan yang mudah dan peperiksaan akhir."
      id: "Laporan praktikum langkah demi langkah, belakangan dikerjakan berempat dengan penilaian sejawat yang menyesuaikan nilaimu, plus MST pilihan ganda yang mudah dan ujian akhir."
      hi: "चरण-दर-चरण प्रैक्टिकल रिपोर्ट, हाल के सालों में चार के ग्रुप में, साथियों के मूल्यांकन से आपके अंक घटते-बढ़ते हैं; साथ में आसान MCQ MST और फ़ाइनल परीक्षा।"
  study:
    - en: "Keep detailed notes from the slides, and ask your tutor exactly what they check in each report, since the rubrics can be thin."
      zh: "根据 PPT 记好详细笔记；评分标准写得很简略，所以要问清楚 tutor 每份报告看什么。"
      zh-TW: "根據投影片記好詳細筆記；評分標準寫得很簡略，所以要問清楚 tutor 每份報告看什麼。"
      ja: "スライドから詳しいノートを作り、ルーブリックが簡素なので、各レポートで何を見るかチューターに具体的に聞く。"
      ko: "슬라이드로 자세한 노트를 만들고, 루브릭이 빈약하니 보고서마다 무엇을 보는지 튜터에게 구체적으로 물어라."
      vi: "Ghi chép chi tiết từ slide, và hỏi tutor cụ thể họ chấm gì ở mỗi báo cáo vì rubric khá sơ sài."
      ms: "Simpan nota terperinci daripada slaid, dan tanya tutor dengan tepat apa yang mereka semak dalam setiap laporan kerana rubrik boleh jadi nipis."
      id: "Buat catatan rinci dari slide, dan tanyakan ke tutor apa persisnya yang dicek di tiap laporan, karena rubriknya bisa minim."
      hi: "स्लाइड से विस्तृत नोट्स बनाएँ, और ट्यूटर से साफ़ पूछें कि हर रिपोर्ट में वे क्या जाँचते हैं, क्योंकि रूब्रिक काफ़ी अधूरे हो सकते हैं।"
  watch:
    - en: "Since 2022 several reviewers found the marking criteria vague and organisation patchy; one noted the imaging software needs a Windows computer with decent power."
      zh: "2022 年以来好几位同学觉得评分标准模糊、组织不太好；有同学提到成像软件需要性能还行的 Windows 电脑。"
      zh-TW: "2022 年以來好幾位同學覺得評分標準模糊、安排不太好；有同學提到影像軟體需要效能還可以的 Windows 電腦。"
      ja: "2022年以降、採点基準が曖昧で運営にむらがあるという声が複数。画像処理ソフトにはそこそこ性能のあるWindowsパソコンが必要という声も一つ。"
      ko: "2022년 이후 여러 명이 채점 기준이 모호하고 운영이 들쭉날쭉하다고 했다. 영상 소프트웨어는 성능이 괜찮은 Windows 컴퓨터가 필요하다는 리뷰도 있다."
      vi: "Từ 2022 vài người thấy tiêu chí chấm mơ hồ và tổ chức chưa đều; một người lưu ý phần mềm xử lý ảnh cần máy Windows cấu hình khá."
      ms: "Sejak 2022 beberapa pengulas dapati kriteria pemarkahan kabur dan pengurusan tidak konsisten; seorang menyatakan perisian pengimejan perlukan komputer Windows yang agak berkuasa."
      id: "Sejak 2022 beberapa pengulas merasa kriteria penilaian kabur dan penyelenggaraan kurang rapi; satu mencatat software pencitraannya butuh komputer Windows yang cukup bertenaga."
      hi: "2022 से कई रिव्यूअर्स को मार्किंग मानदंड अस्पष्ट और व्यवस्था असमान लगी; एक ने बताया इमेजिंग सॉफ़्टवेयर के लिए ठीक-ठाक क्षमता वाला Windows कंप्यूटर चाहिए।"
difficulty: easy
