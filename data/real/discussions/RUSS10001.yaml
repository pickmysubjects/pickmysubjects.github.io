points:
  - en: "Reviewers from 2017 to 2022 all recommended it, praising passionate, friendly teachers and small classes full of pair and group work where it is easy to make friends."
    zh: "2017到2022年的评论者都推荐这门课，称赞老师热情友善，小班上有很多双人和小组活动，很容易交到朋友。"
    zh-TW: "2017到2022年的評論者都推薦這門課，稱讚老師熱情友善，小班上有很多雙人和小組活動，很容易交到朋友。"
    ja: "2017〜2022年のレビューはすべておすすめ。熱心で親しみやすい先生と、ペア・グループ活動の多い少人数クラスが好評で、友達も作りやすい。"
    ko: "2017~2022년 리뷰 모두 추천. 열정적이고 친절한 강사, 짝·그룹 활동이 많은 소규모 수업이 호평이며 친구 사귀기도 쉬움."
    vi: "Người đánh giá từ 2017 đến 2022 đều khuyên học: giáo viên nhiệt tình, thân thiện, lớp nhỏ nhiều hoạt động cặp và nhóm, dễ kết bạn."
    ms: "Pengulas dari 2017 hingga 2022 semuanya mengesyorkannya, memuji pengajar yang bersemangat dan mesra serta kelas kecil yang banyak aktiviti berpasangan dan berkumpulan, mudah berkawan."
    id: "Pengulas dari 2017 sampai 2022 semuanya merekomendasikan, memuji pengajar yang bersemangat dan ramah serta kelas kecil dengan banyak kerja pasangan dan kelompok, jadi mudah dapat teman."
    hi: "2017 से 2022 तक सभी रिव्यूअर्स ने इसकी सिफ़ारिश की: जोशीले, मिलनसार शिक्षक और छोटी क्लासें जिनमें जोड़ी व ग्रुप एक्टिविटी बहुत होती हैं, दोस्त बनाना आसान है।"
  - en: "No prior language experience is needed. Classes follow the textbook closely, the regular assignments take only a few hours each, and the exam uses the same kinds of questions."
    zh: "不需要任何语言基础。上课紧跟教材，定期作业每次只需几个小时，考试题型和作业一样。"
    zh-TW: "不需要任何語言基礎。上課緊跟教材，定期作業每次只需幾個小時，考試題型和作業一樣。"
    ja: "語学経験は不要。授業は教科書に沿って進み、定期的な課題は1回数時間で終わり、試験も課題と同じタイプの問題。"
    ko: "언어 경험이 없어도 됨. 수업은 교재를 충실히 따르고, 정기 과제는 회당 몇 시간이면 끝나며 시험도 과제와 같은 유형."
    vi: "Không cần biết ngoại ngữ trước. Lớp bám sát giáo trình, bài tập định kỳ mỗi lần chỉ mất vài giờ, và đề thi cùng dạng với bài tập."
    ms: "Tiada pengalaman bahasa diperlukan. Kelas mengikut buku teks dengan rapat, tugasan berkala hanya ambil beberapa jam setiap satu, dan peperiksaan guna jenis soalan yang sama."
    id: "Tidak perlu pengalaman bahasa. Kelas mengikuti buku teks dengan ketat, tugas rutin masing-masing hanya beberapa jam, dan ujian memakai jenis soal yang sama."
    hi: "पहले से कोई भाषा अनुभव ज़रूरी नहीं। क्लास पाठ्यपुस्तक के हिसाब से चलती है, नियमित असाइनमेंट हर बार कुछ ही घंटे लेते हैं, और एग्ज़ाम में भी वैसे ही सवाल आते हैं।"
  - en: "One 2020 reviewer noticed that students who already spoke two or more languages found high marks easier than those learning their first foreign language."
    zh: "2020年有一位评论者发现，已经会两种以上语言的同学比第一次学外语的同学更容易拿高分。"
    zh-TW: "2020年有一位評論者發現，已經會兩種以上語言的同學比第一次學外語的同學更容易拿高分。"
    ja: "2020年のあるレビューによると、すでに2言語以上話せる学生のほうが、初めて外国語を学ぶ学生より高得点を取りやすかった。"
    ko: "2020년 한 리뷰어는 이미 두 개 이상의 언어를 하는 학생이 처음 외국어를 배우는 학생보다 고득점을 받기 쉬웠다고 함."
    vi: "Một người đánh giá năm 2020 nhận thấy ai đã biết từ hai ngôn ngữ trở lên dễ đạt điểm cao hơn người lần đầu học ngoại ngữ."
    ms: "Seorang pengulas 2020 perasan pelajar yang sudah tahu dua bahasa atau lebih lebih mudah dapat markah tinggi berbanding yang baru belajar bahasa asing pertama."
    id: "Seorang pengulas 2020 melihat mahasiswa yang sudah bisa dua bahasa atau lebih lebih mudah dapat nilai tinggi dibanding yang baru belajar bahasa asing pertama."
    hi: "2020 के एक रिव्यूअर ने देखा कि जो छात्र पहले से दो या ज़्यादा भाषाएँ बोलते थे, उन्हें पहली बार विदेशी भाषा सीखने वालों से ऊँचे अंक लाना आसान लगा।"
difficulty: easy
workload: light
