code: MGMT20005
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/mgmt20005
reviews: 5
from: 2016
to: 2020
checked: 2026-10-13
points:
  - en: "The subject covers decision trees, simulation and optimisation applied to business areas; reviewers found the content simple, though the newest also called it mostly dull."
    zh: "课程涵盖决策树、模拟和优化在商业中的应用；评价者觉得内容简单，最新一条也说大部分比较枯燥。"
    zh-TW: "課程涵蓋決策樹、模擬和最佳化在商業中的應用；評價者覺得內容簡單，最新一則也說大部分比較枯燥。"
    ja: "決定木、シミュレーション、最適化をビジネスに応用する内容。内容は簡単だとされ、最新のレビューは大半が退屈とも述べている。"
    ko: "의사결정나무, 시뮬레이션, 최적화를 비즈니스에 적용하는 내용이다. 내용은 쉽다는 평이고, 최신 리뷰는 대부분 지루하다고도 했다."
    vi: "Môn học về cây quyết định, mô phỏng và tối ưu hóa áp dụng cho kinh doanh; người học thấy nội dung đơn giản, dù đánh giá mới nhất nói phần lớn khá nhàm."
    ms: "Subjek meliputi pepohon keputusan, simulasi dan pengoptimuman untuk bidang perniagaan; pengulas dapati kandungan mudah, walaupun yang terbaru kata kebanyakannya membosankan."
    id: "Mata kuliah ini membahas pohon keputusan, simulasi dan optimasi untuk bidang bisnis; pengulas merasa materinya sederhana, meski yang terbaru bilang sebagian besar membosankan."
    hi: "विषय में डिसीज़न ट्री, सिमुलेशन और ऑप्टिमाइज़ेशन को बिज़नेस में लागू करना सिखाया जाता है; रिव्यूअर्स को कंटेंट सरल लगा, हालाँकि सबसे नए ने इसे ज़्यादातर नीरस भी कहा।"
  - en: "A high mark is seen as reachable with modest effort if you attend tutorials, which were rated well; several reviewers earned an H1."
    zh: "认为只要参加辅导课（评价很好），不用太多努力就能拿高分；好几位拿了 H1。"
    zh-TW: "認為只要參加輔導課（評價很好），不用太多努力就能拿高分；好幾位拿了 H1。"
    ja: "評価の高いチュートリアルに出ていれば、それほど努力せずに高得点が狙えるとされる。H1を取った人も複数。"
    ko: "평이 좋은 튜토리얼에 참석하면 큰 노력 없이 고득점이 가능하다는 평이다. H1을 받은 사람도 여럿이다."
    vi: "Điểm cao được xem là đạt được mà không cần quá nhiều công sức nếu đi tutorial (được đánh giá tốt); vài người đạt H1."
    ms: "Markah tinggi dianggap boleh dicapai dengan usaha sederhana jika hadir tutorial, yang dinilai baik; beberapa pengulas dapat H1."
    id: "Nilai tinggi dianggap bisa dicapai dengan usaha sedang jika rajin ikut tutorial, yang dinilai bagus; beberapa pengulas dapat H1."
    hi: "ट्यूटोरियल में जाने पर, जिनकी तारीफ़ हुई, थोड़ी मेहनत से ऊँचे अंक संभव माने गए; कई रिव्यूअर्स को H1 मिला।"
  - en: "The second and group assignments are the tricky parts and lean on computer and Excel skills, so pick teammates who can handle that side."
    zh: "第二次作业和小组作业较难，依赖电脑和 Excel 技能，最好找能搞定这部分的组员。"
    zh-TW: "第二次作業和小組作業較難，依賴電腦和 Excel 技能，最好找能搞定這部分的組員。"
    ja: "2つ目の課題とグループ課題が難所で、PCとExcelのスキルが必要。そこを任せられるメンバーを選ぼう。"
    ko: "두 번째 과제와 조별 과제가 까다롭고 컴퓨터·Excel 실력이 필요하니, 그 부분을 맡을 수 있는 조원을 고르자."
    vi: "Bài tập thứ hai và bài nhóm là phần khó, cần kỹ năng máy tính và Excel, nên chọn đồng đội làm tốt phần đó."
    ms: "Tugasan kedua dan tugasan kumpulan bahagian yang sukar dan perlukan kemahiran komputer serta Excel, jadi pilih rakan yang mampu."
    id: "Tugas kedua dan tugas kelompok bagian yang sulit dan butuh keterampilan komputer serta Excel, jadi pilih rekan yang menguasainya."
    hi: "दूसरा असाइनमेंट और ग्रुप असाइनमेंट मुश्किल हिस्से हैं और कंप्यूटर व Excel स्किल पर निर्भर हैं, इसलिए ऐसे साथी चुनें जो इसे संभाल सकें।"
sections:
  content:
    - en: "Business analysis techniques such as decision trees, simulation and optimisation, applied to business decisions. Reviewers found the content simple, if sometimes boring."
      zh: "讲决策树、模拟、优化等商业分析方法，并用于商业决策。同学觉得内容简单，有时有点无聊。"
      zh-TW: "講決策樹、模擬、最佳化等商業分析方法，並用於商業決策。同學覺得內容簡單，有時有點無聊。"
      ja: "決定木、シミュレーション、最適化などのビジネス分析手法を意思決定に応用する。内容は簡単だが時に退屈という。"
      ko: "의사결정 나무, 시뮬레이션, 최적화 같은 비즈니스 분석 기법을 의사결정에 적용한다. 내용은 쉽지만 가끔 지루하다는 평."
      vi: "Các kỹ thuật phân tích kinh doanh như cây quyết định, mô phỏng và tối ưu hóa, áp dụng vào quyết định kinh doanh. Nội dung đơn giản, đôi khi chán."
      ms: "Teknik analisis perniagaan seperti pepohon keputusan, simulasi dan pengoptimuman, digunakan untuk keputusan perniagaan. Kandungan mudah, walaupun kadang membosankan."
      id: "Teknik analisis bisnis seperti pohon keputusan, simulasi dan optimasi, diterapkan pada keputusan bisnis. Materinya sederhana, meski kadang membosankan."
      hi: "डिसीज़न ट्री, सिमुलेशन और ऑप्टिमाइज़ेशन जैसी बिज़नेस एनालिसिस तकनीकें, व्यावसायिक फ़ैसलों पर लागू। रिव्यूअर्स को सामग्री सरल पर कभी-कभी उबाऊ लगी।"
  work:
    - en: "Two assignments with lots of Excel work; the second (group) one is the tricky part, so good groupmates and Excel skills help. The final exam is on paper. Several got an H1 without much study."
      zh: "两个作业，大量用 Excel；第二个（小组）作业最难，组员靠谱、会 Excel 很重要。期末是纸笔考试。好几位没怎么复习就拿了 H1。"
      zh-TW: "兩份作業，大量用 Excel；第二份（小組）作業最難，組員靠譜、會 Excel 很重要。期末是紙筆考試。好幾位沒怎麼複習就拿了 H1。"
      ja: "Excel作業の多い課題が2つ。2つ目（グループ）が難しく、良いメンバーとExcelスキルが助けになる。期末は紙の試験。あまり勉強せずにH1を取った人が複数。"
      ko: "Excel 작업이 많은 과제 2개. 두 번째(조별)가 까다로워 좋은 조원과 Excel 실력이 도움이 된다. 기말은 지필. 공부를 별로 안 하고 H1을 받은 사람이 여럿."
      vi: "Hai bài tập dùng nhiều Excel; bài thứ hai (nhóm) là phần khó, nên cần bạn nhóm tốt và giỏi Excel. Thi cuối làm trên giấy. Nhiều người được H1 mà không học nhiều."
      ms: "Dua tugasan dengan banyak kerja Excel; yang kedua (kumpulan) paling rumit, jadi rakan kumpulan baik dan kemahiran Excel membantu. Peperiksaan akhir atas kertas. Beberapa dapat H1 tanpa banyak belajar."
      id: "Dua tugas dengan banyak Excel; yang kedua (kelompok) paling sulit, jadi teman kelompok yang baik dan keterampilan Excel membantu. Ujian akhir di kertas. Beberapa dapat H1 tanpa banyak belajar."
      hi: "Excel के काफ़ी काम वाले दो असाइनमेंट; दूसरा (ग्रुप) मुश्किल है, तो अच्छे साथी और Excel कौशल मदद करते हैं। फ़ाइनल परीक्षा काग़ज़ पर। कई को बिना ज़्यादा पढ़े H1 मिला।"
  watch:
    - en: "One reviewer says if you want the maths behind it, other subjects go deeper; this one is more of an easy WAM booster."
      zh: "有同学说如果想学背后的数学，其他课讲得更深；这门更像是轻松拉 WAM 的课。"
      zh-TW: "有同學說如果想學背後的數學，其他課講得更深；這門比較像輕鬆拉 WAM 的課。"
      ja: "背後の数学を学びたいなら他の科目の方が深いと一人が言う。この科目は手軽にWAMを上げる科目に近い。"
      ko: "그 뒤의 수학을 배우고 싶다면 다른 과목이 더 깊다고 한 리뷰가 말한다. 이 과목은 쉬운 WAM 올리기용에 가깝다."
      vi: "Một người nói nếu muốn học phần toán phía sau thì môn khác sâu hơn; môn này giống môn kéo WAM dễ dàng hơn."
      ms: "Seorang pengulas kata jika mahu matematik di sebaliknya, subjek lain lebih mendalam; yang ini lebih kepada penaik WAM mudah."
      id: "Satu pengulas bilang jika ingin matematika di baliknya, mata kuliah lain lebih dalam; yang ini lebih ke pendongkrak WAM yang mudah."
      hi: "एक रिव्यूअर कहता है अगर इसके पीछे का गणित चाहिए तो दूसरे विषय ज़्यादा गहरे हैं; यह आसानी से WAM बढ़ाने वाला विषय ज़्यादा है।"
    - en: "All these reviews are from 2020 or earlier; teaching and exams may have changed since."
      zh: "这些评价都是 2020 年或更早的，现在的教法和考试可能已经变了。"
      zh-TW: "這些評價都是 2020 年或更早的，現在的教法和考試可能已經變了。"
      ja: "レビューはすべて2020年以前のもの。授業や試験は変わっている可能性がある。"
      ko: "모든 리뷰가 2020년 이전 것이라 지금 수업과 시험은 달라졌을 수 있다."
      vi: "Tất cả đánh giá đều từ năm 2020 trở về trước; cách dạy và thi có thể đã thay đổi."
      ms: "Semua ulasan ini dari 2020 atau lebih awal; pengajaran dan peperiksaan mungkin telah berubah."
      id: "Semua ulasan ini dari 2020 atau sebelumnya; pengajaran dan ujian mungkin sudah berubah."
      hi: "ये सभी रिव्यू 2020 या उससे पहले के हैं; पढ़ाई और परीक्षा अब बदल चुकी हो सकती है।"
difficulty: easy
workload: light
