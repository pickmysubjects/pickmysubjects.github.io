points:
  - en: "The 2021 reviewers found the content on violence across eras interesting, though jumping between time periods each week could be confusing. Readings were long and sometimes felt off-topic."
    zh: "2021年的评论者觉得跨时代的暴力主题有趣，但每周在不同时期之间跳跃可能令人困惑。阅读材料长，有时感觉不太相关。"
    zh-TW: "2021年的評論者覺得跨時代的暴力主題有趣，但每週在不同時期之間跳躍可能令人困惑。閱讀材料長，有時感覺不太相關。"
    ja: "2021年のレビューでは、時代を超えた暴力というテーマは面白いが、毎週時代が飛ぶので混乱しやすいとされた。文献は長く、関係が薄く感じることも。"
    ko: "2021년 리뷰어들은 시대를 넘나드는 폭력 주제가 흥미롭지만 매주 시대가 바뀌어 헷갈릴 수 있다고 함. 읽기 자료는 길고 때로 주제와 동떨어져 보임."
    vi: "Người đánh giá 2021 thấy nội dung về bạo lực qua các thời kỳ thú vị, dù việc nhảy giữa các giai đoạn mỗi tuần có thể gây rối. Bài đọc dài và đôi khi lạc đề."
    ms: "Pengulas 2021 dapati kandungan tentang keganasan merentas zaman menarik, walaupun melompat antara zaman setiap minggu boleh mengelirukan. Bacaan panjang dan kadang terasa tidak berkaitan."
    id: "Pengulas 2021 merasa materi kekerasan lintas zaman menarik, meski lompat antar periode tiap minggu bisa membingungkan. Bacaannya panjang dan kadang terasa melenceng."
    hi: "2021 के रिव्यूअर्स को अलग-अलग युगों में हिंसा का कंटेंट दिलचस्प लगा, हालाँकि हर हफ़्ते काल बदलना उलझन भरा हो सकता है। रीडिंग लंबी थीं और कभी-कभी विषय से हटकर लगीं।"
  - en: "In 2021 the first assignment was due mid-semester and worth 55%, leaving little room to recover, with the rest from attendance and a reflective essay. Opinions overall were average."
    zh: "2021年第一份作业在学期中段交，占55%，几乎没有补救余地，其余是出勤分和反思论文。总体评价一般。"
    zh-TW: "2021年第一份作業在學期中段交，佔55%，幾乎沒有補救餘地，其餘是出勤分和反思論文。整體評價一般。"
    ja: "2021年は最初の課題が学期半ば締切で55%を占め、挽回の余地が少なかった。残りは出席点とリフレクティブエッセイ。全体の評価は平均的。"
    ko: "2021년엔 첫 과제가 학기 중반 마감에 55%를 차지해 만회할 여지가 적었고, 나머지는 출석과 성찰 에세이. 전체 평가는 보통."
    vi: "Năm 2021 bài tập đầu nộp giữa kỳ, chiếm 55%, ít cơ hội gỡ điểm; phần còn lại là chuyên cần và bài luận phản tư. Nhìn chung đánh giá ở mức trung bình."
    ms: "Pada 2021 tugasan pertama perlu dihantar pertengahan semester dan bernilai 55%, sukar untuk pulih; selebihnya kehadiran dan esei reflektif. Pendapat keseluruhan sederhana."
    id: "Pada 2021 tugas pertama dikumpulkan pertengahan semester dan bernilai 55%, sulit untuk memperbaiki; sisanya kehadiran dan esai reflektif. Pendapat umumnya biasa saja."
    hi: "2021 में पहला असाइनमेंट सेमेस्टर के बीच में था और 55% का था, सुधार की कम गुंजाइश; बाकी उपस्थिति और रिफ़्लेक्टिव निबंध से। कुल राय औसत रही।"
