points:
  - en: "Content is easy and accessible, and two reviewers called it a good WAM booster, especially if you did similar health studies at school."
    zh: "内容简单易懂，两位评价者认为适合提高均分，高中学过类似健康课程的会更轻松。"
    zh-TW: "內容簡單易懂，兩位評論者認為很適合拉高WAM，尤其高中修過類似健康課程的人。"
    ja: "内容は簡単で取っつきやすく、特に高校で似た保健科目を学んだ人には良いWAMブースターだと2人が評価。"
    ko: "내용이 쉽고 접근하기 좋으며, 특히 고등학교에서 비슷한 보건 과목을 했다면 좋은 WAM 부스터라고 두 명이 평가."
    vi: "Nội dung dễ, dễ tiếp cận; hai người gọi đây là môn kéo WAM tốt, nhất là nếu từng học môn sức khỏe tương tự ở phổ thông."
    ms: "Kandungan mudah dan mesra, dan dua pengulas kata ia penggalak WAM yang baik, terutama jika pernah belajar kesihatan serupa di sekolah."
    id: "Materi mudah dan ramah, dan dua pengulas menyebutnya pendongkrak WAM yang bagus, terutama jika pernah belajar kesehatan serupa di sekolah."
    hi: "कंटेंट आसान और समझने लायक है; दो रिव्यूअर ने इसे अच्छा WAM बूस्टर कहा, ख़ासकर अगर स्कूल में ऐसी हेल्थ स्टडीज़ पढ़ी हो।"
  - en: "Main drawback: the content is broad and surface-level, so do not expect much depth."
    zh: "主要缺点是内容宽泛、停留在表面，不要期待太深入。"
    zh-TW: "主要缺點：內容廣泛但停留在表面，不要期待太深入。"
    ja: "主な欠点は内容が広く浅いこと。深さはあまり期待しないで。"
    ko: "주된 단점: 내용이 넓고 얕아서 깊이는 기대하지 마세요."
    vi: "Nhược điểm chính: nội dung rộng nhưng hời hợt, đừng mong quá sâu."
    ms: "Kelemahan utama: kandungan luas dan cetek, jadi jangan harap terlalu mendalam."
    id: "Kekurangan utama: materinya luas tapi dangkal, jadi jangan berharap terlalu dalam."
    hi: "मुख्य कमी: कंटेंट चौड़ा पर सतही है, तो ज़्यादा गहराई की उम्मीद न करें।"
  - en: "Assignments are straightforward and fairly marked, and tutorials use interactive activities."
    zh: "作业直截了当、评分公平，辅导课以互动活动为主。"
    zh-TW: "作業直截了當、評分公平，小組討論課以互動活動為主。"
    ja: "課題は分かりやすく採点も公平。チュートリアルはインタラクティブな活動中心。"
    ko: "과제는 단순하고 공정하게 채점되며, 튜토리얼은 상호작용 활동 위주."
    vi: "Bài tập đơn giản, chấm công bằng, và tutorial có hoạt động tương tác."
    ms: "Tugasan mudah difahami dan dimarkah adil, dan tutorial guna aktiviti interaktif."
    id: "Tugas lugas dan dinilai adil, dan tutorial memakai aktivitas interaktif."
    hi: "असाइनमेंट सीधे-सादे हैं और मार्किंग निष्पक्ष है, ट्यूटोरियल में इंटरैक्टिव एक्टिविटी होती हैं।"
difficulty: easy
