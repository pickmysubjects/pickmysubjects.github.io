    ja: "最新のレビューでは、週末の試験は詰め込みが必要で点数も低く、GPA稼ぎにはならないとの警告。"
    ko: "최근 리뷰어는 학점용 과목이 아니라고 경고: 주말 시험에 벼락치기가 많이 필요하고 점수가 낮았음."
    vi: "Người gần nhất cảnh báo không dễ lấy điểm: thi cuối tuần phải học dồn nhiều, điểm thấp."
    ms: "Pengulas terkini memberi amaran ia bukan penaik WAM: peperiksaan hujung minggu perlu hafalan berat."
    id: "Pengulas terbaru mengingatkan ini bukan pendongkrak WAM: ujian akhir pekan butuh belajar kebut."
    hi: "हाल के रिव्यूअर की चेतावनी: यह WAM बढ़ाने वाला नहीं, हफ़्ते के अंत की परीक्षा के लिए भारी रटना पड़ता है।"
  - en: "Studying the content before the block, or taking the wine subject first, was the main tip; pack warm for Dookie."
    zh: "主要建议是开课前先预习，或先修葡萄酒那门课；去Dookie要带够保暖衣物。"
    zh-TW: "主要建議是開課前先預習，或先修葡萄酒那門課；去Dookie要帶夠保暖衣物。"
    ja: "事前に予習するか、ワインの科目を先に取るのが一番の助言。Dookieは寒いので防寒を。"
    ko: "사전에 내용을 공부하거나 와인 과목을 먼저 듣는 게 주된 조언. Dookie는 추우니 따뜻하게."
    vi: "Lời khuyên chính: học trước nội dung hoặc học môn rượu vang trước; mang đồ ấm đến Dookie."
    ms: "Nasihat utama: belajar dahulu sebelum blok atau ambil subjek wain dahulu; bawa pakaian panas."
    id: "Saran utama: pelajari materi sebelum blok atau ambil mata kuliah anggur dulu; bawa baju hangat."
    hi: "मुख्य सलाह: ब्लॉक से पहले पढ़ लें या वाइन वाला विषय पहले लें; Dookie के लिए गर्म कपड़े ले जाएँ।"
