points:
  - en: "Covers the main theories of mind (dualism, physicalism, functionalism) plus emotions and extended cognition, with plenty of thought experiments."
    zh: "涵盖心灵哲学的主要理论（二元论、物理主义、功能主义），以及情绪和延展认知，有大量思想实验。"
    zh-TW: "涵蓋心靈哲學的主要理論（二元論、物理主義、功能主義），以及情緒和延展認知，有大量思想實驗。"
    ja: "心の主要理論（二元論、物理主義、機能主義）に加え、感情や拡張された認知も扱い、思考実験が豊富。"
    ko: "마음의 주요 이론(이원론, 물리주의, 기능주의)과 감정, 확장된 인지를 다루며 사고실험이 많음."
    vi: "Bao quát các lý thuyết chính về tâm trí (nhị nguyên, vật lý luận, chức năng luận) cùng cảm xúc và nhận thức mở rộng, nhiều thí nghiệm tư duy."
    ms: "Meliputi teori utama minda (dualisme, fizikalisme, fungsionalisme) serta emosi dan kognisi lanjutan, dengan banyak eksperimen pemikiran."
    id: "Mencakup teori utama tentang pikiran (dualisme, fisikalisme, fungsionalisme) plus emosi dan kognisi diperluas, dengan banyak eksperimen pikiran."
    hi: "मन के मुख्य सिद्धांत (द्वैतवाद, भौतिकवाद, फ़ंक्शनलिज़्म) और भावनाएँ व विस्तारित संज्ञान, ढेर सारे विचार-प्रयोगों के साथ।"
  - en: "Opinions are mixed: one enjoyed the two-hour seminar format, one found the topics blurred together and confusing (2020), and one found tutorial discussion average (2025)."
    zh: "意见不一：有人喜欢两小时研讨课形式，有人觉得主题混在一起令人困惑（2020年），也有人觉得辅导课讨论一般（2025年）。"
    zh-TW: "意見不一：有人喜歡兩小時研討課形式，有人覺得主題混在一起令人困惑（2020年），也有人覺得輔導課討論普通（2025年）。"
    ja: "評価は分かれる。2時間のセミナー形式を楽しんだ人、テーマが似通っていて混乱したという人（2020年）、チュートリアルの議論は平凡だったという人（2025年）がいる。"
    ko: "평은 엇갈림. 2시간 세미나 형식을 즐긴 사람, 주제들이 뒤섞여 헷갈렸다는 사람(2020년), 튜토리얼 토론이 평범했다는 사람(2025년)이 있음."
    vi: "Ý kiến trái chiều: một người thích dạng seminar hai tiếng, một người thấy các chủ đề lẫn vào nhau khó hiểu (2020), và một người thấy thảo luận tutorial bình thường (2025)."
    ms: "Pendapat bercampur: seorang suka format seminar dua jam, seorang dapati topik-topiknya bercampur dan mengelirukan (2020), dan seorang dapati perbincangan tutorial biasa sahaja (2025)."
    id: "Pendapat beragam: ada yang suka format seminar dua jam, ada yang merasa topiknya campur aduk dan membingungkan (2020), dan ada yang merasa diskusi tutorialnya biasa saja (2025)."
    hi: "राय मिली-जुली है: एक को दो घंटे का सेमिनार फ़ॉर्मैट पसंद आया, एक को विषय आपस में घुले-मिले और उलझाऊ लगे (2020), और एक को ट्यूटोरियल चर्चा औसत लगी (2025)।"
