code: CULS10005
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/culs10005
reviews: 8
from: 2015
to: 2023
checked: 2026-10-17
points:
  - en: "Since 2019 most reviewers liked it: well run, supportive tutors, and lively discussion linking culture and media."
    zh: "从2019年起，大多数评论者都喜欢：组织得好，辅导老师很支持人，讨论文化与媒体的课堂很活跃。"
    zh-TW: "從2019年起，大多數評論者都喜歡：組織得好，助教很支持學生，討論文化與媒體的課堂很活躍。"
    ja: "2019年以降はほとんどのレビューが好意的。運営がしっかりしていて、チューターも親身、文化とメディアを結ぶ議論が活発。"
    ko: "2019년 이후 대부분 리뷰가 호평. 운영이 잘 되고 튜터가 잘 도와주며, 문화와 미디어를 잇는 토론이 활발함."
    vi: "Từ 2019, phần lớn người đánh giá đều thích: tổ chức tốt, tutor hỗ trợ nhiệt tình, thảo luận sôi nổi về văn hóa và truyền thông."
    ms: "Sejak 2019 kebanyakan pengulas menyukainya: diurus dengan baik, tutor yang menyokong, dan perbincangan rancak yang mengaitkan budaya dan media."
    id: "Sejak 2019 kebanyakan pengulas menyukainya: dikelola dengan baik, tutor suportif, dan diskusi yang hidup soal budaya dan media."
    hi: "2019 से ज़्यादातर रिव्यूअर्स को यह पसंद आया: अच्छी तरह चलाया गया, मददगार ट्यूटर्स, और संस्कृति व मीडिया को जोड़ने वाली जीवंत चर्चा।"
  - en: "Assessments (blog posts, an ad analysis, an essay with question choice) were mostly called straightforward if you do the readings and attend."
    zh: "考核（博客文章、广告分析、可选题的论文）大多被认为只要做阅读、按时上课就不难。"
    zh-TW: "評量（部落格文章、廣告分析、可選題的論文）大多被認為只要做閱讀、按時上課就不難。"
    ja: "評価（ブログ投稿、広告分析、問いを選べるエッセイ）は、読み物をこなし出席していれば概ね素直とのこと。"
    ko: "평가(블로그 글, 광고 분석, 문제 선택형 에세이)는 읽기를 하고 출석하면 대체로 무난하다는 평."
    vi: "Bài đánh giá (blog, phân tích quảng cáo, tiểu luận được chọn đề) phần lớn được cho là dễ hiểu nếu đọc bài và đi học đầy đủ."
    ms: "Penilaian (catatan blog, analisis iklan, esei dengan pilihan soalan) kebanyakannya dikatakan mudah jika anda membuat bacaan dan hadir."
    id: "Penilaian (posting blog, analisis iklan, esai dengan pilihan soal) umumnya disebut lugas kalau kamu membaca dan hadir."
    hi: "आकलन (ब्लॉग पोस्ट, एक विज्ञापन का विश्लेषण, प्रश्न चुनने वाला निबंध) ज़्यादातर सीधे-सादे बताए गए, बशर्ते आप रीडिंग्स करें और क्लास आएँ।"
  - en: "Earlier reviews (2015-2018) were harsher: dull or rushed lectures, and one student found the marking standard well above what classes prepared you for."
    zh: "早期评价（2015-2018）更负面：讲座枯燥或太赶，一位学生觉得评分标准远高于课堂所教。"
    zh-TW: "早期評價（2015-2018）較負面：講課乏味或太趕，一位學生覺得評分標準遠高於課堂所教。"
    ja: "以前のレビュー（2015-2018）は厳しめ。講義が退屈または駆け足で、採点基準が授業の内容よりずっと高いと感じた学生もいた。"
    ko: "예전 리뷰(2015-2018)는 더 박함. 강의가 지루하거나 서두르고, 한 학생은 채점 기준이 수업 수준보다 훨씬 높다고 느낌."
    vi: "Các đánh giá cũ (2015-2018) gay gắt hơn: bài giảng nhàm chán hoặc vội, và một sinh viên thấy tiêu chuẩn chấm cao hơn nhiều so với những gì lớp dạy."
    ms: "Ulasan awal (2015-2018) lebih keras: kuliah hambar atau tergesa-gesa, dan seorang pelajar dapati standard pemarkahan jauh melebihi apa yang diajar di kelas."
    id: "Ulasan lama (2015-2018) lebih keras: kuliah membosankan atau terburu-buru, dan seorang mahasiswa merasa standar penilaian jauh di atas yang diajarkan di kelas."
    hi: "पुराने रिव्यू (2015-2018) ज़्यादा कड़े थे: नीरस या जल्दबाज़ी वाले लेक्चर, और एक छात्र को मार्किंग का स्तर क्लास में सिखाए गए से काफ़ी ऊपर लगा।"
sections:
  content:
    - en: "An intro to cultural studies through media and identity. Views split: several found it eye-opening and well run with supportive tutors; others found the content dull."
      zh: "通过媒体和身份认同入门文化研究。看法不一：好几位觉得大开眼界、组织好、tutor 很支持；也有人觉得内容乏味。"
      zh-TW: "透過媒體和身分認同入門文化研究。看法分歧：好幾位覺得大開眼界、安排好、tutor 很支持；也有人覺得內容乏味。"
      ja: "メディアとアイデンティティを通じたカルチュラル・スタディーズ入門。視野が広がり運営も良くチューターも支えてくれるという声が複数ある一方、内容が退屈だという声も。"
      ko: "미디어와 정체성을 통한 문화연구 입문. 시야가 넓어지고 운영이 좋으며 튜터가 잘 도와준다는 평이 여럿이지만, 내용이 지루하다는 평도 있다."
      vi: "Nhập môn nghiên cứu văn hóa qua truyền thông và bản sắc. Ý kiến chia rẽ: vài người thấy mở mang, tổ chức tốt, tutor hỗ trợ; người khác thấy nội dung nhàm."
      ms: "Pengenalan kajian budaya melalui media dan identiti. Pandangan berbelah: beberapa rasa ia membuka mata dan teratur dengan tutor yang menyokong; yang lain rasa kandungannya hambar."
      id: "Pengantar kajian budaya lewat media dan identitas. Pendapat terbelah: beberapa merasa membuka wawasan dan rapi dengan tutor yang suportif; yang lain merasa materinya membosankan."
      hi: "मीडिया और पहचान के ज़रिए सांस्कृतिक अध्ययन का परिचय। राय बँटी है: कई को यह आँखें खोलने वाला, अच्छी तरह चलाया गया और सहयोगी ट्यूटर वाला लगा; दूसरों को कंटेंट नीरस लगा।"
  work:
    - en: "Blog posts, an ad analysis and an essay with a choice of questions. Recent reviewers found them straightforward; one 2018 reviewer felt the expected standard was higher than the teaching."
      zh: "博客、一个广告分析和一篇可选题的论文。近期同学觉得都很直接；2018 年有同学觉得要求的水准高于课上所教。"
      zh-TW: "部落格、一份廣告分析和一篇可選題的論文。近期同學覺得都很直接；2018 年有同學覺得要求的水準高於課堂所教。"
      ja: "ブログ投稿、広告分析、問いを選べるエッセイ。最近は素直だという声。2018年には求められる水準が授業より高いと感じた声も。"
      ko: "블로그 글, 광고 분석, 질문을 고를 수 있는 에세이. 최근 리뷰는 무난하다고 했고, 2018년 한 리뷰어는 요구 수준이 수업보다 높다고 느꼈다."
      vi: "Bài blog, một bài phân tích quảng cáo và một tiểu luận được chọn đề. Người học gần đây thấy dễ hiểu; một người năm 2018 thấy yêu cầu cao hơn những gì được dạy."
      ms: "Catatan blog, analisis iklan dan esei dengan pilihan soalan. Pengulas terkini rasa mudah; seorang pengulas 2018 rasa standard yang dijangka lebih tinggi daripada pengajaran."
      id: "Tulisan blog, analisis iklan dan esai dengan pilihan soal. Pengulas terbaru merasa lugas; satu pengulas 2018 merasa standar yang diharapkan lebih tinggi dari yang diajarkan."
      hi: "ब्लॉग पोस्ट, एक विज्ञापन विश्लेषण और सवाल चुनने वाला निबंध। हाल के रिव्यूअर्स को ये सीधे लगे; 2018 के एक रिव्यूअर को अपेक्षित स्तर पढ़ाई से ऊँचा लगा।"
  study:
    - en: "Be detailed in the blog posts, pick an ad with lots of elements to analyse, and do the readings, which are discussed in tutorials."
      zh: "博客写得详细些；广告分析挑元素多的广告；阅读要做，tutorial 会讨论。"
      zh-TW: "部落格寫得詳細些；廣告分析挑元素多的廣告；閱讀要做，tutorial 會討論。"
      ja: "ブログは詳しく書き、広告分析は要素の多い広告を選び、チュートリアルで扱うリーディングはやっておく。"
      ko: "블로그는 자세히 쓰고, 분석할 요소가 많은 광고를 고르며, 튜토리얼에서 다루는 읽기를 해 두라."
      vi: "Viết blog chi tiết, chọn quảng cáo có nhiều yếu tố để phân tích, và làm bài đọc vì sẽ được thảo luận ở tutorial."
      ms: "Tulis blog dengan terperinci, pilih iklan dengan banyak elemen untuk dianalisis, dan buat bacaan yang dibincangkan dalam tutorial."
      id: "Tulis blog dengan rinci, pilih iklan dengan banyak elemen untuk dianalisis, dan kerjakan bacaan yang dibahas di tutorial."
      hi: "ब्लॉग पोस्ट विस्तार से लिखें, विश्लेषण के लिए कई तत्वों वाला विज्ञापन चुनें, और रीडिंग करें जिन पर ट्यूटोरियल में चर्चा होती है।"
  watch:
    - en: "Reviews are mostly from 2015–2023, so the subject may have changed; earlier ones found the lectures fast or poorly taught, later ones more positive."
      zh: "评价大多来自 2015–2023 年，课程可能已有变化；早期的同学觉得讲课太快或教得不好，后来的评价更正面。"
      zh-TW: "評價大多來自 2015–2023 年，課程可能已有變化；早期的同學覺得上課太快或教得不好，後來的評價較正面。"
      ja: "レビューは主に2015〜2023年のもので、内容が変わっている可能性がある。初期は講義が速い・教え方が悪いという声、後年はより好意的。"
      ko: "리뷰는 대부분 2015–2023년 것이라 과목이 바뀌었을 수 있다. 초기엔 강의가 빠르거나 부실하다는 평, 이후엔 더 긍정적이다."
      vi: "Đánh giá chủ yếu từ 2015–2023 nên môn có thể đã thay đổi; những đánh giá sớm thấy bài giảng nhanh hoặc dạy kém, về sau tích cực hơn."
      ms: "Ulasan kebanyakannya dari 2015–2023, jadi subjek mungkin telah berubah; yang awal rasa kuliah laju atau kurang baik, yang kemudian lebih positif."
      id: "Ulasan sebagian besar dari 2015–2023, jadi mata kuliahnya mungkin sudah berubah; yang awal merasa kuliahnya cepat atau kurang baik, yang belakangan lebih positif."
      hi: "रिव्यू ज़्यादातर 2015–2023 के हैं, तो विषय बदल गया हो सकता है; पहले वालों को लेक्चर तेज़ या कमज़ोर लगे, बाद वाले ज़्यादा सकारात्मक थे।"
