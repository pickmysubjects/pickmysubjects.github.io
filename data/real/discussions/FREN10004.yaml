points:
  - en: "A consistently well-liked beginners' course (2016-2023): no prior French needed, clear teaching and lots of speaking with classmates."
    zh: "一直很受欢迎的入门课（2016-2023）：零基础可学，讲解清楚，和同学大量口语练习。"
    zh-TW: "一直很受歡迎的入門課（2016-2023）：零基礎可學，講解清楚，和同學大量口說練習。"
    ja: "2016〜2023年を通して好評の入門科目。フランス語未経験でOK、説明がわかりやすく、クラスメートと話す機会が多い。"
    ko: "2016~2023년 꾸준히 호평받는 입문 과목. 프랑스어 경험 없어도 되고, 설명이 명확하며 친구들과 말하기 연습이 많음."
    vi: "Môn nhập môn luôn được yêu thích (2016-2023): không cần biết tiếng Pháp trước, dạy rõ ràng và nói nhiều với bạn cùng lớp."
    ms: "Kursus pemula yang sentiasa disukai (2016-2023): tiada asas Perancis diperlukan, pengajaran jelas dan banyak bertutur dengan rakan sekelas."
    id: "Kursus pemula yang selalu disukai (2016-2023): tak perlu bisa bahasa Prancis, pengajaran jelas, dan banyak berbicara dengan teman sekelas."
    hi: "2016-2023 तक लगातार पसंद किया गया शुरुआती कोर्स: पहले से फ़्रेंच ज़रूरी नहीं, साफ़ पढ़ाई और सहपाठियों के साथ खूब बोलने का अभ्यास।"
  - en: "It covers a lot quickly and has many small assessments, but most found H1 achievable if they revised regularly and attended."
    zh: "进度快、小考核多，但大多数人觉得只要定期复习、按时上课就能拿H1。"
    zh-TW: "進度快、小評量多，但大多數人覺得只要定期複習、按時上課就能拿H1。"
    ja: "内容が多く進みも速く、小さな評価も多いが、定期的に復習して出席すればH1は取れるという人が大半。"
    ko: "진도가 빠르고 소규모 평가가 많지만, 꾸준히 복습하고 출석하면 H1 가능하다는 사람이 대부분."
    vi: "Học nhiều nội dung nhanh và có nhiều bài đánh giá nhỏ, nhưng đa số thấy đạt H1 được nếu ôn đều và đi học."
    ms: "Ia meliputi banyak perkara dengan pantas dan ada banyak penilaian kecil, tetapi kebanyakan dapati H1 boleh dicapai jika mengulang kaji secara tetap dan hadir."
    id: "Materinya banyak dan cepat dengan banyak penilaian kecil, tapi kebanyakan merasa H1 bisa diraih kalau rutin mengulang dan hadir."
    hi: "यह बहुत कुछ जल्दी कवर करता है और छोटे-छोटे आकलन कई हैं, पर ज़्यादातर को लगा कि नियमित दोहराने और क्लास आने से H1 मिल सकता है।"
  - en: "Several took the winter intensive and recommended it: about three weeks, finished before semester 2."
    zh: "好几人上了冬季密集版并推荐：大约三周，第二学期开学前就结束。"
    zh-TW: "好幾人上了冬季密集版並推薦：大約三週，第二學期開學前就結束。"
    ja: "冬期集中版を受けて勧める人が何人もいた。約3週間で、2学期が始まる前に終わる。"
    ko: "여러 명이 겨울 집중 과정을 듣고 추천함. 약 3주로, 2학기 시작 전에 끝남."
    vi: "Nhiều người học bản cấp tốc mùa đông và khuyên nên học: khoảng ba tuần, xong trước học kỳ 2."
    ms: "Beberapa orang mengambil versi intensif musim sejuk dan mengesyorkannya: kira-kira tiga minggu, selesai sebelum semester 2."
    id: "Beberapa orang mengambil versi intensif musim dingin dan merekomendasikannya: sekitar tiga minggu, selesai sebelum semester 2."
    hi: "कई लोगों ने विंटर इंटेंसिव लिया और सुझाया: लगभग तीन हफ़्ते, सेमेस्टर 2 शुरू होने से पहले ख़त्म।"
sections:
  content:
    - en: "A clear, relaxed intro for complete beginners that still covers a lot in 12 weeks. No lectures, just two 2-hour classes a week with plenty of pair and group speaking, so it's easy to make friends."
      zh: "零基础也能跟上的轻松入门，12 周学的东西却不少。没有 lecture，每周两次两小时的课，大量搭档和小组口语练习，很容易交朋友。"
      zh-TW: "零基礎也跟得上的輕鬆入門，12 週學的東西卻不少。沒有 lecture，每週兩次兩小時的課，大量搭檔和小組口說練習，很容易交朋友。"
      ja: "全くの初心者向けの分かりやすく気楽な入門だが、12週で多くを学ぶ。講義はなく、週2回2時間の授業でペアやグループの会話練習が多く、友達を作りやすい。"
      ko: "완전 초보도 따라갈 수 있는 쉽고 편한 입문이지만 12주 동안 배우는 양이 많다. 강의 없이 주 2회 2시간 수업, 짝·그룹 말하기가 많아 친구 사귀기 좋다."
      vi: "Nhập môn rõ ràng, thoải mái cho người mới hoàn toàn nhưng học được nhiều trong 12 tuần. Không có bài giảng, chỉ hai buổi 2 tiếng mỗi tuần với nhiều bài nói cặp và nhóm, dễ kết bạn."
      ms: "Pengenalan jelas dan santai untuk pemula sepenuhnya tetapi tetap merangkumi banyak dalam 12 minggu. Tiada kuliah, hanya dua kelas 2 jam seminggu dengan banyak latihan bertutur berpasangan dan berkumpulan, mudah berkawan."
      id: "Pengantar yang jelas dan santai untuk pemula total, tapi tetap banyak materi dalam 12 minggu. Tanpa kuliah, hanya dua kelas 2 jam per minggu dengan banyak latihan bicara berpasangan dan kelompok, mudah berteman."
      hi: "बिल्कुल नए लोगों के लिए साफ़, आरामदेह परिचय, फिर भी 12 हफ़्तों में बहुत कुछ। लेक्चर नहीं, हफ़्ते में दो 2-घंटे की क्लास, जोड़ी और समूह में खूब बोलना, दोस्त बनाना आसान।"
  work:
    - en: "Many small assessments every couple of weeks instead of one big exam; the final exam is short. Most say it's not hard to do well."
      zh: "每隔几周就有小测评，没有一次定生死的大考；期末考试很短。多数人说不难拿好成绩。"
      zh-TW: "每隔幾週就有小評量，沒有一次定生死的大考；期末考很短。多數人說不難拿好成績。"
      ja: "大きな試験一発ではなく、数週ごとに小さな評価が多数。期末試験は短い。良い成績は難しくないという声が多い。"
      ko: "큰 시험 한 번 대신 몇 주마다 작은 평가가 많다. 기말시험은 짧다. 좋은 성적이 어렵지 않다는 평이 많다."
      vi: "Nhiều bài đánh giá nhỏ vài tuần một lần thay vì một kỳ thi lớn; bài thi cuối ngắn. Đa số nói không khó đạt điểm tốt."
      ms: "Banyak penilaian kecil setiap beberapa minggu dan bukan satu peperiksaan besar; peperiksaan akhir pendek. Kebanyakan kata tidak sukar untuk buat baik."
      id: "Banyak penilaian kecil tiap beberapa minggu, bukan satu ujian besar; ujian akhirnya singkat. Kebanyakan bilang tidak sulit dapat nilai bagus."
      hi: "एक बड़ी परीक्षा की जगह हर कुछ हफ़्तों में कई छोटे मूल्यांकन; अंतिम परीक्षा छोटी है। ज़्यादातर कहते हैं अच्छा करना कठिन नहीं।"
  study:
    - en: "Attend every class, since missed classes are hard to catch up on, and revise regularly. Practise with friends at home; one reviewer notes apps help with vocab but not grammar."
      zh: "每节课都去，缺课很难补，定期复习。和朋友在家多练；有一位同学提醒 app 能帮背单词但教不了语法。"
      zh-TW: "每堂課都去，缺課很難補，定期複習。和朋友在家多練；有一位同學提醒 app 能幫背單字但教不了文法。"
      ja: "欠席すると追いつきにくいので毎回出席し、定期的に復習を。友達と家でも練習しよう。アプリは語彙には役立つが文法は教えてくれないという人が一人。"
      ko: "결석하면 따라잡기 어려우니 모든 수업에 나가고 꾸준히 복습하자. 친구와 집에서도 연습하자. 앱은 어휘엔 좋지만 문법은 안 가르친다는 리뷰어가 한 명."
      vi: "Đi học đủ vì nghỉ buổi rất khó bắt kịp, và ôn đều. Luyện với bạn ở nhà; một người lưu ý app giúp từ vựng chứ không dạy ngữ pháp."
      ms: "Hadir setiap kelas kerana sukar mengejar jika terlepas, dan ulang kaji selalu. Berlatih dengan kawan di rumah; seorang pengulas kata aplikasi bantu kosa kata tetapi bukan tatabahasa."
      id: "Hadiri setiap kelas karena sulit mengejar kalau bolos, dan rajin mengulang. Latihan dengan teman di rumah; satu reviewer bilang aplikasi membantu kosakata tapi bukan tata bahasa."
      hi: "हर क्लास जाएँ, छूटी क्लास पकड़ना कठिन है, और नियमित दोहराएँ। घर पर दोस्तों के साथ प्रैक्टिस करें; एक रिव्यूअर कहते हैं ऐप शब्दावली में मदद करते हैं, व्याकरण में नहीं।"
  watch:
    - en: "A winter intensive version runs over about three weeks; two reviewers who took it enjoyed it, though it packs a lot in."
      zh: "有冬季密集班，约三周上完；有两位上过的同学很喜欢，不过内容很密集。"
      zh-TW: "有冬季密集班，約三週上完；有兩位上過的同學很喜歡，不過內容很密集。"
      ja: "約3週間の冬季集中版がある。受講した2人は楽しんだが、内容は詰め込み気味。"
      ko: "약 3주간의 겨울 집중 과정이 있다. 들었던 두 명은 즐겼지만 내용이 빽빽하다."
      vi: "Có bản học dồn mùa đông khoảng ba tuần; hai người đã học thấy thích, dù khá dồn dập."
      ms: "Versi intensif musim sejuk berjalan kira-kira tiga minggu; dua pengulas yang mengambilnya suka, walaupun padat."
      id: "Ada versi intensif musim dingin sekitar tiga minggu; dua reviewer yang mengambilnya menikmati, meski materinya padat."
      hi: "लगभग तीन हफ़्ते का विंटर इंटेंसिव संस्करण भी है; लेने वाले दो रिव्यूअर्स को पसंद आया, हालाँकि यह काफ़ी ठसाठस है।"
difficulty: easy
