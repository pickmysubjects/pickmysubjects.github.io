reviews: 6
from: 2014
to: 2024
checked: 2026-10-17
points:
  - en: "Seen as a core object-oriented programming subject in Java that pays off in later subjects and in software jobs."
    zh: "被视为用 Java 学面向对象编程的核心课，对后续课程和软件工作都很有用。"
    zh-TW: "被視為用 Java 學物件導向程式設計的核心課，對後續課程和軟體工作都很有用。"
    ja: "Java でオブジェクト指向を学ぶ中核科目とされ、後の科目やソフトウェアの仕事で役立つ。"
    ko: "Java로 객체지향 프로그래밍을 배우는 핵심 과목으로, 이후 과목과 소프트웨어 취업에 도움이 된다는 평."
    vi: "Được xem là môn cốt lõi về lập trình hướng đối tượng với Java, có ích cho các môn sau và công việc phần mềm."
    ms: "Dianggap subjek teras pengaturcaraan berorientasikan objek dalam Java, berguna untuk subjek lanjutan dan kerja perisian."
    id: "Dianggap mata kuliah inti pemrograman berorientasi objek dengan Java, berguna untuk mata kuliah lanjutan dan kerja software."
    hi: "Java में ऑब्जेक्ट-ओरिएंटेड प्रोग्रामिंग का मुख्य सब्जेक्ट माना जाता है, जो आगे के सब्जेक्ट और सॉफ़्टवेयर जॉब में काम आता है।"
  - en: "Hard with no prior programming. Practise lots of examples, and ask for help after a couple of hours stuck rather than losing a whole evening."
    zh: "没有编程基础会很难。多练例题，卡住一两个小时就去求助，别耗掉一整晚。"
    zh-TW: "沒有程式基礎會很難。多練例題，卡住一兩個小時就去求助，別耗掉一整晚。"
    ja: "プログラミング未経験だと難しい。例題をたくさん練習し、数時間詰まったら一晩無駄にせず助けを求めること。"
    ko: "프로그래밍 경험이 없으면 어려움. 예제를 많이 연습하고, 몇 시간 막히면 밤새 붙잡지 말고 도움을 요청할 것."
    vi: "Khó nếu chưa từng lập trình. Luyện nhiều ví dụ, bị kẹt vài giờ thì hỏi người khác thay vì mất cả buổi tối."
    ms: "Sukar tanpa pengalaman pengaturcaraan. Banyakkan latihan contoh, dan minta bantuan selepas tersekat beberapa jam, jangan bazir semalaman."
    id: "Sulit tanpa pengalaman pemrograman. Banyak latihan contoh, dan minta bantuan setelah buntu beberapa jam, jangan habiskan semalaman."
    hi: "प्रोग्रामिंग अनुभव न हो तो कठिन है। ढेर सारे उदाहरण अभ्यास करें, और कुछ घंटे अटकने पर पूरी शाम गँवाने के बजाय मदद माँगें।"
  - en: "Several 2019 reviewers complained about poor organisation and little feedback before the exam. The final exam was called tough and tight on time."
    zh: "几位2019年的评论者抱怨课程组织差、考前几乎没有反馈。期末考试被认为偏难且时间紧。"
    zh-TW: "幾位2019年的評論者抱怨課程組織差、考前幾乎沒有回饋。期末考被認為偏難且時間緊。"
    ja: "2019年のレビュー数件は運営のまずさと試験前のフィードバック不足に不満。期末試験は難しく時間も厳しいとされた。"
    ko: "2019년 리뷰 몇 개는 운영이 엉성하고 시험 전 피드백이 거의 없다고 불만. 기말시험은 어렵고 시간이 빠듯하다는 평."
    vi: "Vài đánh giá năm 2019 phàn nàn môn tổ chức kém và ít phản hồi trước kỳ thi. Thi cuối kỳ được nói là khó và gấp thời gian."
    ms: "Beberapa pengulas 2019 merungut tentang pengurusan lemah dan kurang maklum balas sebelum peperiksaan. Peperiksaan akhir disifatkan sukar dan masa suntuk."
    id: "Beberapa pengulas 2019 mengeluhkan pengelolaan buruk dan minim umpan balik sebelum ujian. Ujian akhir disebut sulit dan waktunya mepet."
    hi: "2019 के कई रिव्यूअर ने खराब व्यवस्था और एग्ज़ाम से पहले कम फ़ीडबैक की शिकायत की। फ़ाइनल एग्ज़ाम कठिन और समय में तंग बताया गया।"
sections:
  content:
    - en: "Essentially object-oriented programming in Java. Reviewers call it a valuable foundation for later study and jobs, but hard if you've never programmed before."
      zh: "基本上就是 Java 面向对象编程。同学说这是之后学习和工作的重要基础，但完全没编程经验会比较难。"
      zh-TW: "基本上就是 Java 物件導向程式設計。同學說這是之後學習和工作的重要基礎，但完全沒寫過程式會比較難。"
      ja: "実質的にJavaのオブジェクト指向プログラミング。後の勉強や仕事の大事な土台だが、プログラミング未経験だと難しいという。"
      ko: "사실상 Java 객체지향 프로그래밍. 이후 공부와 취업에 중요한 기초지만 프로그래밍 경험이 없으면 어렵다는 평."
      vi: "Về cơ bản là lập trình hướng đối tượng bằng Java. Người học nói đây là nền tảng quý cho học tiếp và đi làm, nhưng khó nếu chưa từng lập trình."
      ms: "Pada dasarnya pengaturcaraan berorientasikan objek dalam Java. Pengulas kata asas penting untuk pengajian dan kerjaya, tetapi sukar jika belum pernah memprogram."
      id: "Pada dasarnya pemrograman berorientasi objek dengan Java. Pengulas bilang fondasi penting untuk studi lanjut dan karier, tapi sulit jika belum pernah memprogram."
      hi: "असल में Java में ऑब्जेक्ट-ओरिएंटेड प्रोग्रामिंग। रिव्यूअर्स इसे आगे की पढ़ाई और नौकरी के लिए अहम नींव कहते हैं, पर पहले कभी प्रोग्रामिंग न की हो तो कठिन।"
  study:
    - en: "One reviewer says to work through every example until it clicks, but ask for help after a couple of hours stuck rather than losing a whole evening. Another found the final exam a bit tough on time."
      zh: "有同学说把每个例子都啃到懂，但卡住两小时左右就去问人，别浪费一整晚。另一位觉得期末时间有点紧。"
      zh-TW: "有同學說把每個例子都啃到懂，但卡住兩小時左右就去問人，別浪費一整晚。另一位覺得期末時間有點緊。"
      ja: "例題は分かるまで全部やり、2時間ほど詰まったら一晩無駄にせず人に聞くこと、と一人が言う。期末は時間的に少し厳しいという人も。"
      ko: "예제를 이해될 때까지 다 풀되, 두 시간쯤 막히면 저녁을 날리지 말고 도움을 청하라고 한 리뷰가 말한다. 다른 리뷰는 기말이 시간상 좀 빠듯했다고 한다."
      vi: "Một người khuyên làm hết mọi ví dụ đến khi hiểu, nhưng kẹt khoảng hai tiếng thì hỏi người khác thay vì mất cả buổi tối. Người khác thấy bài thi cuối hơi gấp thời gian."
      ms: "Seorang pengulas kata buat setiap contoh sehingga faham, tetapi minta bantuan selepas tersekat dua jam daripada membazir sepanjang malam. Seorang lagi rasa peperiksaan akhir agak suntuk masa."
      id: "Satu pengulas bilang kerjakan setiap contoh sampai paham, tapi minta bantuan setelah buntu sekitar dua jam daripada menghabiskan semalaman. Lainnya merasa waktu ujian akhir agak mepet."
      hi: "एक रिव्यूअर कहता है हर उदाहरण तब तक करें जब तक समझ न आए, पर दो घंटे अटकें तो पूरी शाम गँवाने के बजाय मदद माँगें। दूसरे को फ़ाइनल परीक्षा में समय थोड़ा कम लगा।"
  watch:
    - en: "2019 reviewers found it poorly organised with little feedback before the exam. Nearly all reviews are from 2019 or earlier, so it may have changed."
      zh: "2019 年的同学觉得课程组织差、考前几乎没反馈。几乎所有评价都是 2019 年或更早的，课程可能已经变了。"
      zh-TW: "2019 年的同學覺得課程組織差、考前幾乎沒回饋。幾乎所有評價都是 2019 年或更早的，課程可能已經變了。"
      ja: "2019年のレビューは運営がまずく試験前のフィードバックがほとんどないと言う。ほぼ全てのレビューが2019年以前なので変わっている可能性がある。"
      ko: "2019년 리뷰는 운영이 엉성하고 시험 전 피드백이 거의 없었다고 한다. 거의 모든 리뷰가 2019년 이전이라 바뀌었을 수 있다."
      vi: "Người học năm 2019 thấy tổ chức kém, ít phản hồi trước kỳ thi. Gần như mọi đánh giá từ 2019 trở về trước nên môn có thể đã thay đổi."
      ms: "Pengulas 2019 rasa ia kurang teratur dengan sedikit maklum balas sebelum peperiksaan. Hampir semua ulasan dari 2019 atau lebih awal, jadi mungkin telah berubah."
      id: "Pengulas 2019 merasa kurang tertata dengan sedikit umpan balik sebelum ujian. Hampir semua ulasan dari 2019 atau sebelumnya, jadi mungkin sudah berubah."
      hi: "2019 के रिव्यूअर्स को यह अव्यवस्थित लगा और परीक्षा से पहले फ़ीडबैक कम मिला। लगभग सभी रिव्यू 2019 या पहले के हैं, तो विषय बदल गया हो सकता है।"
difficulty: hard
