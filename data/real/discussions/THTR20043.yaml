points:
  - en: "Most reviewers called it an easy, enjoyable breadth delivered over about a week, best suited to students interested in film."
    zh: "多数评论者认为这是一门轻松愉快的跨学科选修，约一周上完，适合对电影感兴趣的学生。"
    zh-TW: "多數評論者認為這是一門輕鬆愉快的 Breadth 選修，約一週上完，適合對電影有興趣的學生。"
    ja: "多くのレビューで、約1週間で終わる気軽で楽しいBreadthとされ、映画好きに向く。"
    ko: "대부분 약 일주일 만에 끝나는 쉽고 즐거운 Breadth라고 평가. 영화에 관심 있는 학생에게 적합."
    vi: "Đa số cho rằng đây là môn Breadth dễ và vui, học trong khoảng một tuần, hợp với người thích phim."
    ms: "Kebanyakan pengulas kata ia Breadth yang mudah dan seronok, diajar kira-kira seminggu, sesuai untuk peminat filem."
    id: "Sebagian besar menyebutnya Breadth yang mudah dan menyenangkan, sekitar seminggu, cocok bagi peminat film."
    hi: "ज़्यादातर ने इसे लगभग एक हफ़्ते में होने वाला आसान और मज़ेदार Breadth बताया, फ़िल्म में रुचि वालों के लिए अच्छा।"
  - en: "Quizzes are quick and easy if done right after each lecture."
    zh: "每次讲座后马上做小测，既快又简单。"
    zh-TW: "每次講座後馬上做小測驗，既快又簡單。"
    ja: "小テストは各講義の直後にやればすぐ終わり簡単。"
    ko: "퀴즈는 강의 직후에 하면 빠르고 쉬움."
    vi: "Bài kiểm tra ngắn làm ngay sau mỗi bài giảng thì nhanh và dễ."
    ms: "Kuiz cepat dan mudah jika dibuat sejurus selepas setiap kuliah."
    id: "Kuis cepat dan mudah jika dikerjakan langsung setelah tiap kuliah."
    hi: "हर लेक्चर के तुरंत बाद करें तो क्विज़ जल्दी और आसान हैं।"
  - en: "The final project carries most of the grade and tutors can mark it closely, so give it a week or two of real effort."
    zh: "期末项目占大部分成绩，导师评分可能很细，建议认真投入一到两周。"
    zh-TW: "期末專案佔大部分成績，助教評分可能很細，建議認真投入一到兩週。"
    ja: "最終課題が成績の大半を占め、採点が細かいこともあるので、1〜2週間しっかり取り組むこと。"
    ko: "최종 프로젝트가 성적 대부분이고 채점이 꼼꼼할 수 있으니 1~2주는 제대로 투자할 것."
    vi: "Dự án cuối chiếm phần lớn điểm và tutor có thể chấm kỹ, nên dành một hai tuần làm nghiêm túc."
    ms: "Projek akhir membawa sebahagian besar gred dan tutor boleh menanda dengan teliti, jadi beri usaha sebenar seminggu dua."
    id: "Proyek akhir menentukan sebagian besar nilai dan tutor bisa menilai teliti, jadi kerjakan serius satu-dua minggu."
    hi: "फ़ाइनल प्रोजेक्ट से ज़्यादातर ग्रेड आता है और ट्यूटर बारीकी से जाँच सकते हैं, इसलिए एक-दो हफ़्ते असली मेहनत दें।"
workload: light
difficulty: easy
