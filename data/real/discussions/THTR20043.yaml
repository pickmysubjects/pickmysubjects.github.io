points:
  - en: "Most reviewers called it an easy, enjoyable breadth delivered over about a week, best suited to students interested in film."
    zh: "多数评论者认为这是一门轻松愉快的跨学科选修，约一周上完，适合对电影感兴趣的学生。"
    zh-TW: "多數評論者認為這是一門輕鬆愉快的 Breadth 選修，約一週上完，適合對電影有興趣的學生。"
    ja: "多くのレビューで、約1週間で終わる気軽で楽しいBreadthとされ、映画好きに向く。"
    ko: "대부분 약 일주일 만에 끝나는 쉽고 즐거운 Breadth라고 평가. 영화에 관심 있는 학생에게 적합."
    vi: "Đa số cho rằng đây là môn Breadth dễ và vui, học trong khoảng một tuần, hợp với người thích phim."
    ms: "Kebanyakan pengulas kata ia Breadth yang mudah dan seronok, diajar kira-kira seminggu, sesuai untuk peminat filem."
    id: "Sebagian besar menyebutnya Breadth yang mudah dan menyenangkan, sekitar seminggu, cocok bagi peminat film."
    hi: "ज़्यादातर ने इसे लगभग एक हफ़्ते में होने वाला आसान और मज़ेदार Breadth बताया, फ़िल्म में रुचि वालों के लिए अच्छा।"
  - en: "Quizzes are quick and easy if done right after each lecture."
    zh: "每次讲座后马上做小测，既快又简单。"
    zh-TW: "每次講座後馬上做小測驗，既快又簡單。"
    ja: "小テストは各講義の直後にやればすぐ終わり簡単。"
    ko: "퀴즈는 강의 직후에 하면 빠르고 쉬움."
    vi: "Bài kiểm tra ngắn làm ngay sau mỗi bài giảng thì nhanh và dễ."
    ms: "Kuiz cepat dan mudah jika dibuat sejurus selepas setiap kuliah."
    id: "Kuis cepat dan mudah jika dikerjakan langsung setelah tiap kuliah."
    hi: "हर लेक्चर के तुरंत बाद करें तो क्विज़ जल्दी और आसान हैं।"
  - en: "The final project carries most of the grade and tutors can mark it closely, so give it a week or two of real effort."
    zh: "期末项目占大部分成绩，导师评分可能很细，建议认真投入一到两周。"
    zh-TW: "期末專案佔大部分成績，助教評分可能很細，建議認真投入一到兩週。"
    ja: "最終課題が成績の大半を占め、採点が細かいこともあるので、1〜2週間しっかり取り組むこと。"
    ko: "최종 프로젝트가 성적 대부분이고 채점이 꼼꼼할 수 있으니 1~2주는 제대로 투자할 것."
    vi: "Dự án cuối chiếm phần lớn điểm và tutor có thể chấm kỹ, nên dành một hai tuần làm nghiêm túc."
    ms: "Projek akhir membawa sebahagian besar gred dan tutor boleh menanda dengan teliti, jadi beri usaha sebenar seminggu dua."
    id: "Proyek akhir menentukan sebagian besar nilai dan tutor bisa menilai teliti, jadi kerjakan serius satu-dua minggu."
    hi: "फ़ाइनल प्रोजेक्ट से ज़्यादातर ग्रेड आता है और ट्यूटर बारीकी से जाँच सकते हैं, इसलिए एक-दो हफ़्ते असली मेहनत दें।"
sections:
  content:
    - en: "Film design such as colour and mise en scène, usually run as a five-day winter intensive with long daily tutorials. Most found it interesting and an easy, creative breadth."
      zh: "讲电影设计，比如色彩和场面调度，通常是五天的冬季密集班，每天 tutorial 时间很长。多数人觉得有意思，是轻松、有创意的 breadth。"
      zh-TW: "講電影設計，例如色彩和場面調度，通常是五天的冬季密集班，每天 tutorial 時間很長。多數人覺得有趣，是輕鬆、有創意的 breadth。"
      ja: "色彩やミザンセーヌなど映画のデザインを学び、通常は毎日長いチュートリアルがある5日間のウィンター集中講座。面白く、楽で創造的なブレドスだという声が多い。"
      ko: "색채, 미장센 같은 영화 디자인을 다루며 보통 매일 긴 튜토리얼이 있는 5일짜리 겨울 집중 과정이다. 대부분 흥미롭고 쉬우며 창의적인 브레드스라고 했다."
      vi: "Thiết kế điện ảnh như màu sắc và dàn dựng cảnh, thường học dạng cấp tốc mùa đông 5 ngày với tutorial dài mỗi ngày. Đa số thấy thú vị, là môn breadth dễ và sáng tạo."
      ms: "Reka bentuk filem seperti warna dan mise en scène, biasanya kursus intensif musim sejuk lima hari dengan tutorial harian yang panjang. Kebanyakan rasa menarik dan breadth kreatif yang mudah."
      id: "Desain film seperti warna dan mise en scène, biasanya kelas intensif musim dingin lima hari dengan tutorial harian yang panjang. Kebanyakan merasa menarik dan breadth kreatif yang mudah."
      hi: "रंग और मीज़-आँ-सेन जैसे फ़िल्म डिज़ाइन पर, आमतौर पर पाँच दिन का विंटर इंटेंसिव जिसमें रोज़ लंबे ट्यूटोरियल होते हैं। ज़्यादातर को रोचक और आसान, रचनात्मक ब्रेड्थ लगा।"
  work:
    - en: "Quick quizzes based on each lecture and a final creative project worth about 70%. Quizzes are easy; one reviewer found tutors picky when marking the final project."
      zh: "每节课后有基于讲课的快速小测，期末是一个约占 70% 的创意项目。小测很简单；有同学觉得 tutor 批改期末项目时很挑剔。"
      zh-TW: "每堂課後有根據上課的快速小考，期末是一個約佔 70% 的創意專題。小考很簡單；有同學覺得 tutor 批改期末專題時很挑剔。"
      ja: "各講義に基づく短い小テストと、約70%を占める最終の創作プロジェクト。小テストは簡単だが、最終プロジェクトの採点が細かいという声も一つ。"
      ko: "강의마다 짧은 퀴즈와 약 70%인 최종 창작 프로젝트. 퀴즈는 쉽지만 최종 프로젝트 채점이 까다로웠다는 리뷰어도 있다."
      vi: "Quiz nhanh dựa trên từng bài giảng và một project sáng tạo cuối kỳ khoảng 70%. Quiz dễ; một người thấy tutor chấm project cuối khá khắt khe."
      ms: "Kuiz pantas berdasarkan setiap kuliah dan projek kreatif akhir kira-kira 70%. Kuiz mudah; seorang pengulas rasa tutor cerewet ketika menanda projek akhir."
      id: "Kuis cepat berdasarkan tiap kuliah dan proyek kreatif akhir sekitar 70%. Kuisnya mudah; satu pengulas merasa tutor rewel saat menilai proyek akhir."
      hi: "हर लेक्चर पर आधारित छोटे क्विज़ और लगभग 70% का अंतिम रचनात्मक प्रोजेक्ट। क्विज़ आसान हैं; एक रिव्यूअर को अंतिम प्रोजेक्ट की मार्किंग में ट्यूटर बारीकी पकड़ने वाले लगे।"
  study:
    - en: "Do each quiz right after its lecture, attend the tutorials for help with the project, and give the final project a week or two rather than a couple of days."
      zh: "每节课后马上做小测；去上 tutorial，可以得到项目指导；期末项目给自己一到两周，而不是两三天。"
      zh-TW: "每堂課後馬上做小考；去上 tutorial，可以得到專題指導；期末專題給自己一到兩週，而不是兩三天。"
      ja: "小テストは講義の直後に受け、チュートリアルに出てプロジェクトの助言をもらい、最終プロジェクトには数日でなく1〜2週間かける。"
      ko: "퀴즈는 강의 직후 풀고, 튜토리얼에 가서 프로젝트 도움을 받으며, 최종 프로젝트엔 이틀이 아니라 한두 주를 투자하라."
      vi: "Làm quiz ngay sau mỗi bài giảng, đi tutorial để được góp ý project, và dành một hai tuần cho project cuối thay vì vài ngày."
      ms: "Buat setiap kuiz sejurus selepas kuliahnya, hadir tutorial untuk bantuan projek, dan beri projek akhir seminggu dua, bukan beberapa hari."
      id: "Kerjakan tiap kuis tepat setelah kuliahnya, hadiri tutorial untuk bantuan proyek, dan beri proyek akhir satu dua minggu, bukan dua tiga hari."
      hi: "हर क्विज़ उसके लेक्चर के तुरंत बाद करें, प्रोजेक्ट में मदद के लिए ट्यूटोरियल में जाएँ, और अंतिम प्रोजेक्ट को कुछ दिनों के बजाय एक-दो हफ़्ते दें।"
  watch:
    - en: "All these reviews are from 2023 or earlier, and one reviewer felt the content could have fit in a day or two rather than five."
      zh: "这些评价都是 2023 年或更早的；有同学觉得内容其实一两天就能讲完，不需要五天。"
      zh-TW: "這些評價都是 2023 年或更早的；有同學覺得內容其實一兩天就能講完，不需要五天。"
      ja: "レビューはすべて2023年以前のもの。内容は5日でなく1〜2日で足りたという声も一つ。"
      ko: "모든 리뷰가 2023년 이전 것이고, 내용이 5일이 아니라 하루이틀이면 충분했다는 리뷰어도 있다."
      vi: "Tất cả đánh giá từ 2023 trở về trước, và một người thấy nội dung chỉ cần một hai ngày thay vì năm."
      ms: "Semua ulasan ini dari 2023 atau lebih awal, dan seorang pengulas rasa kandungan boleh dimuatkan dalam sehari dua, bukan lima."
      id: "Semua ulasan ini dari 2023 atau sebelumnya, dan satu pengulas merasa materinya cukup satu dua hari, bukan lima."
      hi: "ये सभी रिव्यू 2023 या पहले के हैं, और एक रिव्यूअर को लगा कि कंटेंट पाँच के बजाय एक-दो दिन में हो सकता था।"
workload: light
difficulty: easy
