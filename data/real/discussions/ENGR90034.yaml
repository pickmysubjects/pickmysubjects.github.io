points:
  - en: "Built around a group project for a sponsor company, with a mentor. Several reviewers valued it as the closest thing to real work experience at university, building soft skills and professionalism."
    zh: "围绕为赞助企业做的小组项目展开，配有导师。好几位评论者认为这是大学里最接近真实工作的经历，能锻炼软技能和职业素养。"
    zh-TW: "圍繞為贊助企業做的小組專題，有導師帶。好幾位評論者認為這是大學裡最接近真實工作的經驗，能培養軟實力和專業素養。"
    ja: "スポンサー企業向けのグループプロジェクトが中心で、メンターが付く。大学で最も実務に近い経験で、ソフトスキルやプロ意識が身につくと評価する人が複数いる。"
    ko: "후원 기업을 위한 그룹 프로젝트가 중심이며 멘토가 붙는다. 여러 명이 대학에서 실무에 가장 가까운 경험이고 소프트 스킬과 전문성을 기를 수 있다고 평가했다."
    vi: "Xoay quanh một project nhóm cho công ty tài trợ, có mentor hướng dẫn. Nhiều người đánh giá đây là trải nghiệm gần với công việc thật nhất ở đại học, giúp rèn kỹ năng mềm và tác phong chuyên nghiệp."
    ms: "Berpusat pada projek berkumpulan untuk syarikat penaja, dengan mentor. Beberapa pengulas hargainya sebagai pengalaman paling hampir dengan kerja sebenar di universiti, membina kemahiran insaniah dan profesionalisme."
    id: "Berpusat pada proyek kelompok untuk perusahaan sponsor, dengan mentor. Beberapa pengulas menghargainya sebagai pengalaman paling mirip kerja nyata di kampus, melatih soft skill dan profesionalisme."
    hi: "एक स्पॉन्सर कंपनी के लिए ग्रुप प्रोजेक्ट पर आधारित, मेंटर के साथ। कई रिव्यूअर्स ने इसे यूनिवर्सिटी में असली काम के सबसे क़रीब का अनुभव माना, जिससे सॉफ़्ट स्किल्स और प्रोफ़ेशनलिज़्म बढ़ता है।"
  - en: "**It is very time-consuming.** Reviewers who put in full effort found it rewarding, but a lot depends on teammates pulling their weight."
    zh: "**非常耗时。**全力投入的评论者觉得收获很大，但很大程度上取决于组员是否出力。"
    zh-TW: "**非常花時間。**全力投入的評論者覺得收穫很多，但很看組員有沒有出力。"
    ja: "**とても時間がかかる。**全力で取り組んだ人はやりがいを感じているが、チームメイトがきちんと動くかに大きく左右される。"
    ko: "**시간이 아주 많이 든다.** 최선을 다한 사람들은 보람을 느꼈지만, 팀원들이 제 몫을 하느냐에 크게 좌우된다."
    vi: "**Rất tốn thời gian.** Những ai dốc sức thấy rất đáng, nhưng phụ thuộc nhiều vào việc đồng đội có làm phần mình không."
    ms: "**Ia sangat memakan masa.** Pengulas yang berusaha sepenuhnya dapati ia berbaloi, tetapi banyak bergantung pada rakan sekumpulan membuat bahagian mereka."
    id: "**Sangat menyita waktu.** Pengulas yang all-out merasa sepadan, tapi sangat tergantung apakah teman kelompok ikut bekerja."
    hi: "**इसमें बहुत समय लगता है।** पूरी मेहनत करने वालों को यह फ़ायदेमंद लगा, पर बहुत कुछ इस पर निर्भर है कि टीम के साथी अपना हिस्सा करें।"
  - en: "Views are strongly split: others called it one of their worst subjects, disliking the assessments and the compulsory lectures with group activities, which supporters said kept them engaged."
    zh: "看法两极：也有人说这是最糟的课之一，不喜欢评估方式和必须出勤、带小组活动的讲座，而支持者则认为这些活动让人保持投入。"
    zh-TW: "看法兩極：也有人說這是最糟的課之一，不喜歡評量方式和強制出席、有小組活動的講課，支持者則認為這些活動讓人保持投入。"
    ja: "評価は大きく分かれる。最悪の科目の一つと言う人もいて、評価方法や出席必須でグループ活動のある講義を嫌っているが、支持派はその活動で集中が保てたという。"
    ko: "의견이 극명하게 갈린다. 최악의 과목 중 하나라며 평가 방식과 출석 필수에 그룹 활동이 있는 강의를 싫어한 사람도 있지만, 지지하는 쪽은 그 활동 덕분에 몰입할 수 있었다고 한다."
    vi: "Ý kiến chia rẽ mạnh: có người gọi đây là một trong những môn tệ nhất, không thích cách đánh giá và các buổi giảng bắt buộc có hoạt động nhóm, trong khi người ủng hộ thấy các hoạt động đó giúp họ tập trung."
    ms: "Pandangan sangat berbelah: ada yang kata ini antara subjek terburuk, tidak suka penilaian dan kuliah wajib dengan aktiviti berkumpulan, manakala penyokong kata aktiviti itu buat mereka kekal terlibat."
    id: "Pendapat sangat terbelah: ada yang menyebutnya salah satu mata kuliah terburuk, tidak suka penilaiannya dan kuliah wajib hadir dengan aktivitas kelompok, sementara pendukungnya bilang aktivitas itu membuat tetap terlibat."
    hi: "राय बहुत बँटी हुई है: कुछ ने इसे अपने सबसे बुरे विषयों में गिना, उन्हें असेसमेंट और ग्रुप एक्टिविटी वाले अनिवार्य लेक्चर पसंद नहीं आए, जबकि समर्थकों ने कहा कि इन्हीं एक्टिविटी से वे जुड़े रहे।"
workload: heavy
difficulty: hard
