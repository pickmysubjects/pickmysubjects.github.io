points:
  - en: "Most reviewers call it an easy, relaxed breadth with no exam; the written tasks are straightforward if you follow the rubric."
    zh: "多数评论说这是轻松的通识课，没有考试；只要照评分标准写，作业不难。"
    zh-TW: "多數評論說這是輕鬆的通識課，沒有考試；只要照評分標準寫，作業不難。"
    ja: "試験のない気楽なブレッドスとの声が多い。評価基準に沿えば課題は難しくない。"
    ko: "시험 없는 편한 교양이라는 평이 많고, 채점 기준을 따르면 과제는 어렵지 않음."
    vi: "Đa số nói đây là môn breadth nhẹ nhàng, không thi; bài viết dễ nếu làm theo rubric."
    ms: "Kebanyakan pengulas kata ia subjek breadth santai tanpa peperiksaan; tugasan mudah jika ikut rubrik."
    id: "Kebanyakan pengulas bilang ini breadth santai tanpa ujian; tugas tulis mudah kalau mengikuti rubrik."
    hi: "ज़्यादातर रिव्यू कहते हैं यह बिना परीक्षा का आसान ब्रेड्थ है; रूब्रिक मानें तो असाइनमेंट सीधे हैं।"
  - en: "Tutorials were seen as interesting, some with outings to galleries or parks, though a few found lectures dull and classes not essential."
    zh: "辅导课被认为有趣，有时会去美术馆或公园；也有人觉得讲座无聊、课不太必要。"
    zh-TW: "小組課被認為有趣，有時會去美術館或公園；也有人覺得講座無聊、課不太必要。"
    ja: "チュートリアルは面白く美術館や公園への外出もあるが、講義が退屈で授業は必須でないと感じた人も。"
    ko: "튜토리얼은 흥미롭고 미술관·공원 견학도 있지만, 강의가 지루하고 수업이 꼭 필요하진 않다는 의견도 있음."
    vi: "Buổi tutorial được khen thú vị, có khi đi bảo tàng hay công viên; vài người thấy bài giảng chán."
    ms: "Tutorial dianggap menarik, kadang-kadang ke galeri atau taman; ada yang rasa kuliah membosankan."
    id: "Tutorial dinilai menarik, kadang ke galeri atau taman; ada juga yang merasa kuliah membosankan."
    hi: "ट्यूटोरियल रोचक माने गए, कभी गैलरी या पार्क जाना होता है; कुछ को लेक्चर उबाऊ लगे।"
