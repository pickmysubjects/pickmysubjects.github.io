code: CRIM20006
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/crim20006
reviews: 10
from: 2015
to: 2022
checked: 2026-10-17
points:
  - en: "Reviewers from 2015 to 2022 were very positive: interesting, well organised and eye-opening, with many calling it one of their favourite criminology subjects."
    zh: "2015到2022年的评论者评价很高：内容有趣、组织得好、让人大开眼界，不少人说这是最喜欢的犯罪学课之一。"
    zh-TW: "2015到2022年的評論者評價很高：內容有趣、組織得好、讓人大開眼界，不少人說這是最喜歡的犯罪學課之一。"
    ja: "2015〜2022年のレビューは非常に好意的。面白く、よく整理され、視野が広がる内容で、お気に入りの犯罪学科目の一つという声が多い。"
    ko: "2015~2022년 리뷰는 매우 긍정적. 흥미롭고 체계적이며 시야를 넓혀 주는 과목으로, 가장 좋아하는 범죄학 과목 중 하나라는 평이 많음."
    vi: "Người đánh giá từ 2015 đến 2022 rất hài lòng: thú vị, tổ chức tốt, mở mang tầm mắt; nhiều người coi đây là một trong những môn tội phạm học yêu thích nhất."
    ms: "Pengulas dari 2015 hingga 2022 sangat positif: menarik, tersusun baik dan membuka mata, ramai menganggapnya antara subjek kriminologi kegemaran mereka."
    id: "Pengulas dari 2015 sampai 2022 sangat positif: menarik, tertata baik, dan membuka wawasan; banyak yang menyebutnya salah satu mata kuliah kriminologi favorit."
    hi: "2015 से 2022 तक के रिव्यूअर्स बहुत संतुष्ट थे: दिलचस्प, अच्छी तरह व्यवस्थित और आँखें खोलने वाला; कई ने इसे अपने पसंदीदा क्रिमिनोलॉजी सब्जेक्ट्स में गिना।"
  - en: "Most of the content centres on prisons and the criminal justice system, with theory such as Foucault mid-semester, so the title can feel broader than what is taught."
    zh: "内容大多围绕监狱和刑事司法系统，学期中段会讲福柯等理论，所以有人觉得课名比实际内容更宽泛。"
    zh-TW: "內容大多圍繞監獄和刑事司法系統，學期中段會講傅柯等理論，所以有人覺得課名比實際內容更寬泛。"
    ja: "内容の多くは刑務所と刑事司法制度が中心で、学期半ばにフーコーなどの理論を扱う。科目名ほど範囲は広くないと感じる人もいる。"
    ko: "내용 대부분이 교도소와 형사사법 제도를 중심으로 하며 학기 중반에 푸코 등 이론을 다룸. 그래서 과목명보다 범위가 좁게 느껴진다는 의견도 있음."
    vi: "Nội dung chủ yếu xoay quanh nhà tù và hệ thống tư pháp hình sự, giữa kỳ có lý thuyết như Foucault, nên có người thấy tên môn rộng hơn thực tế."
    ms: "Kebanyakan kandungan tertumpu pada penjara dan sistem keadilan jenayah, dengan teori seperti Foucault pada pertengahan semester, jadi tajuknya terasa lebih luas daripada isinya."
    id: "Sebagian besar materi berpusat pada penjara dan sistem peradilan pidana, dengan teori seperti Foucault di pertengahan semester, jadi judulnya terasa lebih luas dari isinya."
    hi: "ज़्यादातर सामग्री जेलों और आपराधिक न्याय प्रणाली पर केंद्रित है, सेमेस्टर के बीच फूको जैसे सिद्धांत आते हैं, इसलिए कुछ को नाम असल सामग्री से व्यापक लगा।"
  - en: "Weekly effort is modest, but the two essays need a lot of reading and research beyond the given material. Several said marking is on the harsh side or curved, so high marks take work."
    zh: "平时投入不大，但两篇论文需要大量超出课程资料的阅读和研究。好几位说评分偏严或按曲线给分，高分需要下功夫。"
    zh-TW: "平時投入不大，但兩篇論文需要大量超出課程資料的閱讀和研究。好幾位說評分偏嚴或按曲線給分，高分需要下功夫。"
    ja: "普段の負担は軽めだが、2本のエッセイは配布資料以上の読書と調査が必要。採点が厳しめ、または相対評価だという声が複数あり、高得点には努力が要る。"
    ko: "평소 부담은 크지 않지만 에세이 2편은 제공 자료 이상의 많은 읽기와 조사가 필요함. 채점이 엄격하거나 상대평가라는 의견이 여럿이라 고득점엔 노력이 필요함."
    vi: "Bình thường không tốn nhiều thời gian, nhưng hai bài luận cần đọc và nghiên cứu nhiều ngoài tài liệu được cho. Vài người nói chấm khá khắt khe hoặc theo đường cong, nên điểm cao cần công sức."
    ms: "Usaha mingguan sederhana, tetapi dua esei memerlukan banyak bacaan dan penyelidikan di luar bahan yang diberi. Beberapa orang kata pemarkahan agak ketat atau berlengkung, jadi markah tinggi perlu usaha."
    id: "Beban mingguan ringan, tapi dua esai butuh banyak bacaan dan riset di luar materi yang diberikan. Beberapa bilang penilaiannya agak ketat atau memakai kurva, jadi nilai tinggi perlu usaha."
    hi: "हफ़्तेवार मेहनत कम है, पर दोनों निबंधों के लिए दी गई सामग्री से आगे बहुत पढ़ना और रिसर्च करना पड़ता है। कई ने कहा मार्किंग सख़्त या कर्व पर होती है, इसलिए ऊँचे अंक मेहनत माँगते हैं।"
sections:
  content:
    - en: "Mostly about prisons: theory, the justice system and ex-prisoners' experiences. Widely called interesting, well organised and eye-opening, with dense readings."
      zh: "主要讲监狱：相关理论、司法体系和前囚犯的经历。普遍被认为有意思、组织好、开眼界，阅读材料又长又密。"
      zh-TW: "主要講監獄：相關理論、司法體系和前受刑人的經歷。普遍被認為有趣、安排好、開眼界，閱讀資料又長又密。"
      ja: "主に刑務所がテーマ：理論、刑事司法制度、元受刑者の経験。面白く、よく構成され、目からうろこという声が多い。文献は長く濃い。"
      ko: "주로 교도소에 관한 내용: 이론, 사법 제도, 전 수감자의 경험. 흥미롭고 잘 짜여 있으며 시야를 넓혀 준다는 평이 많다. 읽기는 길고 빽빽하다."
      vi: "Chủ yếu về nhà tù: lý thuyết, hệ thống tư pháp và trải nghiệm của cựu tù nhân. Được khen thú vị, tổ chức tốt, mở mang; bài đọc dài và đặc."
      ms: "Kebanyakannya tentang penjara: teori, sistem keadilan dan pengalaman bekas banduan. Ramai kata menarik, teratur dan membuka mata, dengan bacaan yang padat."
      id: "Kebanyakan tentang penjara: teori, sistem peradilan, dan pengalaman mantan narapidana. Banyak yang bilang menarik, tertata, dan membuka wawasan, dengan bacaan yang padat."
      hi: "ज़्यादातर जेलों पर: सिद्धांत, न्याय व्यवस्था और पूर्व कैदियों के अनुभव। कई इसे रोचक, व्यवस्थित और आँखें खोलने वाला कहते हैं, रीडिंग घनी है।"
  work:
    - en: "Two research essays that need a lot of reading beyond the provided material. Several say marking is on the harsher side or on a curve, so it's hard to do really well."
      zh: "两篇研究型 essay，需要大量课外阅读和研究。好几位说改分偏严或按曲线给分，想拿高分不容易。"
      zh-TW: "兩篇研究型 essay，需要大量課外閱讀與研究。好幾位說給分偏嚴或按曲線給分，想拿高分不容易。"
      ja: "研究エッセイ2本で、配布資料以外に多くの文献調査が必要。採点は厳しめ、または相対評価で、高得点は難しいという声が複数。"
      ko: "연구 에세이 두 편으로, 제공 자료 외에 많은 읽기와 조사가 필요하다. 채점이 다소 가혹하거나 상대평가라 고득점이 어렵다는 리뷰가 여럿."
      vi: "Hai bài luận nghiên cứu cần đọc nhiều ngoài tài liệu được cho. Vài người nói chấm khá gắt hoặc theo đường cong, nên khó đạt rất cao."
      ms: "Dua esei penyelidikan yang perlukan banyak bacaan di luar bahan diberi. Beberapa kata pemarkahan agak keras atau ikut lengkung, jadi sukar dapat sangat tinggi."
      id: "Dua esai riset yang butuh banyak bacaan di luar materi yang diberikan. Beberapa bilang penilaian cenderung keras atau pakai kurva, jadi sulit dapat sangat tinggi."
      hi: "दो रिसर्च निबंध जिनमें दी गई सामग्री से बाहर काफ़ी पढ़ना पड़ता है। कई कहते हैं मार्किंग सख़्त या कर्व पर होती है, इसलिए बहुत ऊँचे अंक कठिन हैं।"
  study:
    - en: "The week-to-week load is light, so plan ahead for the busy essay periods. One reviewer says a tutor who sets out expectations clearly makes a big difference."
      zh: "平时负担不重，要提前为写 essay 的忙碌期做计划。有一位同学说 tutor 把要求讲清楚差别很大。"
      zh-TW: "平時負擔不重，要提前為寫 essay 的忙碌期做規劃。有一位同學說 tutor 把要求講清楚差別很大。"
      ja: "毎週の負担は軽いので、エッセイ期間の忙しさに備えて早めに計画を。期待をはっきり示すチューターだと大違いだという人が一人。"
      ko: "평소 부담은 가벼우니 에세이 기간의 바쁨에 대비해 미리 계획하자. 기대치를 명확히 알려주는 튜터면 차이가 크다는 리뷰어가 한 명."
      vi: "Khối lượng hằng tuần nhẹ, nên lên kế hoạch trước cho giai đoạn viết luận bận rộn. Một người nói tutor nêu rõ yêu cầu tạo khác biệt lớn."
      ms: "Beban mingguan ringan, jadi rancang awal untuk tempoh esei yang sibuk. Seorang pengulas kata tutor yang jelaskan jangkaan dengan jelas beri perbezaan besar."
      id: "Beban mingguan ringan, jadi rencanakan lebih awal untuk masa sibuk menulis esai. Satu reviewer bilang tutor yang menjelaskan ekspektasi dengan jelas sangat berpengaruh."
      hi: "हर हफ़्ते का बोझ हल्का है, इसलिए निबंधों के व्यस्त समय की पहले से योजना बनाएँ। एक रिव्यूअर कहते हैं अपेक्षाएँ साफ़ बताने वाला ट्यूटर बड़ा फ़र्क लाता है।"
  watch:
    - en: "The most recent reviews are from 2022, so the subject may have changed since."
      zh: "最新的评价是 2022 年的，这门课之后可能有变化。"
      zh-TW: "最新的評價是 2022 年的，這門課之後可能有變化。"
      ja: "最新のレビューは2022年のもので、その後内容が変わっている可能性がある。"
      ko: "가장 최근 리뷰가 2022년 것이라 이후 과목이 바뀌었을 수 있다."
      vi: "Đánh giá mới nhất là từ 2022, nên môn học có thể đã thay đổi."
      ms: "Ulasan terbaru dari 2022, jadi subjek mungkin telah berubah sejak itu."
      id: "Ulasan terbaru dari 2022, jadi mata kuliahnya mungkin sudah berubah."
      hi: "सबसे नए रिव्यू 2022 के हैं, इसलिए विषय तब से बदल सकता है।"
difficulty: mixed
workload: mixed
