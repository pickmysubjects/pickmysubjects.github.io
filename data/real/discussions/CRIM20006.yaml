points:
  - en: "Reviewers from 2015 to 2022 were very positive: interesting, well organised and eye-opening, with many calling it one of their favourite criminology subjects."
    zh: "2015到2022年的评论者评价很高：内容有趣、组织得好、让人大开眼界，不少人说这是最喜欢的犯罪学课之一。"
    zh-TW: "2015到2022年的評論者評價很高：內容有趣、組織得好、讓人大開眼界，不少人說這是最喜歡的犯罪學課之一。"
    ja: "2015〜2022年のレビューは非常に好意的。面白く、よく整理され、視野が広がる内容で、お気に入りの犯罪学科目の一つという声が多い。"
    ko: "2015~2022년 리뷰는 매우 긍정적. 흥미롭고 체계적이며 시야를 넓혀 주는 과목으로, 가장 좋아하는 범죄학 과목 중 하나라는 평이 많음."
    vi: "Người đánh giá từ 2015 đến 2022 rất hài lòng: thú vị, tổ chức tốt, mở mang tầm mắt; nhiều người coi đây là một trong những môn tội phạm học yêu thích nhất."
    ms: "Pengulas dari 2015 hingga 2022 sangat positif: menarik, tersusun baik dan membuka mata, ramai menganggapnya antara subjek kriminologi kegemaran mereka."
    id: "Pengulas dari 2015 sampai 2022 sangat positif: menarik, tertata baik, dan membuka wawasan; banyak yang menyebutnya salah satu mata kuliah kriminologi favorit."
    hi: "2015 से 2022 तक के रिव्यूअर्स बहुत संतुष्ट थे: दिलचस्प, अच्छी तरह व्यवस्थित और आँखें खोलने वाला; कई ने इसे अपने पसंदीदा क्रिमिनोलॉजी सब्जेक्ट्स में गिना।"
  - en: "Most of the content centres on prisons and the criminal justice system, with theory such as Foucault mid-semester, so the title can feel broader than what is taught."
    zh: "内容大多围绕监狱和刑事司法系统，学期中段会讲福柯等理论，所以有人觉得课名比实际内容更宽泛。"
    zh-TW: "內容大多圍繞監獄和刑事司法系統，學期中段會講傅柯等理論，所以有人覺得課名比實際內容更寬泛。"
    ja: "内容の多くは刑務所と刑事司法制度が中心で、学期半ばにフーコーなどの理論を扱う。科目名ほど範囲は広くないと感じる人もいる。"
    ko: "내용 대부분이 교도소와 형사사법 제도를 중심으로 하며 학기 중반에 푸코 등 이론을 다룸. 그래서 과목명보다 범위가 좁게 느껴진다는 의견도 있음."
    vi: "Nội dung chủ yếu xoay quanh nhà tù và hệ thống tư pháp hình sự, giữa kỳ có lý thuyết như Foucault, nên có người thấy tên môn rộng hơn thực tế."
    ms: "Kebanyakan kandungan tertumpu pada penjara dan sistem keadilan jenayah, dengan teori seperti Foucault pada pertengahan semester, jadi tajuknya terasa lebih luas daripada isinya."
    id: "Sebagian besar materi berpusat pada penjara dan sistem peradilan pidana, dengan teori seperti Foucault di pertengahan semester, jadi judulnya terasa lebih luas dari isinya."
    hi: "ज़्यादातर सामग्री जेलों और आपराधिक न्याय प्रणाली पर केंद्रित है, सेमेस्टर के बीच फूको जैसे सिद्धांत आते हैं, इसलिए कुछ को नाम असल सामग्री से व्यापक लगा।"
  - en: "Weekly effort is modest, but the two essays need a lot of reading and research beyond the given material. Several said marking is on the harsh side or curved, so high marks take work."
    zh: "平时投入不大，但两篇论文需要大量超出课程资料的阅读和研究。好几位说评分偏严或按曲线给分，高分需要下功夫。"
    zh-TW: "平時投入不大，但兩篇論文需要大量超出課程資料的閱讀和研究。好幾位說評分偏嚴或按曲線給分，高分需要下功夫。"
    ja: "普段の負担は軽めだが、2本のエッセイは配布資料以上の読書と調査が必要。採点が厳しめ、または相対評価だという声が複数あり、高得点には努力が要る。"
    ko: "평소 부담은 크지 않지만 에세이 2편은 제공 자료 이상의 많은 읽기와 조사가 필요함. 채점이 엄격하거나 상대평가라는 의견이 여럿이라 고득점엔 노력이 필요함."
    vi: "Bình thường không tốn nhiều thời gian, nhưng hai bài luận cần đọc và nghiên cứu nhiều ngoài tài liệu được cho. Vài người nói chấm khá khắt khe hoặc theo đường cong, nên điểm cao cần công sức."
    ms: "Usaha mingguan sederhana, tetapi dua esei memerlukan banyak bacaan dan penyelidikan di luar bahan yang diberi. Beberapa orang kata pemarkahan agak ketat atau berlengkung, jadi markah tinggi perlu usaha."
    id: "Beban mingguan ringan, tapi dua esai butuh banyak bacaan dan riset di luar materi yang diberikan. Beberapa bilang penilaiannya agak ketat atau memakai kurva, jadi nilai tinggi perlu usaha."
    hi: "हफ़्तेवार मेहनत कम है, पर दोनों निबंधों के लिए दी गई सामग्री से आगे बहुत पढ़ना और रिसर्च करना पड़ता है। कई ने कहा मार्किंग सख़्त या कर्व पर होती है, इसलिए ऊँचे अंक मेहनत माँगते हैं।"
difficulty: mixed
workload: mixed
