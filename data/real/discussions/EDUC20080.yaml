reviews: 9
from: 2020
to: 2026
checked: 2026-10-21
points:
  - en: "The school placement is the highlight: a rare chance to work in a real classroom, though you need to take initiative once you are there."
    zh: "最大亮点是学校实习，难得能进真实课堂，但到了学校要主动争取。"
    zh-TW: "最大亮點是學校實習，難得能進真實課堂，但到了學校要主動爭取。"
    ja: "一番の魅力は学校実習。本物の教室に入れる貴重な機会だが、現場では自分から動く必要がある。"
    ko: "가장 큰 장점은 학교 실습. 실제 교실을 경험할 드문 기회지만 현장에선 적극적으로 나서야 함."
    vi: "Điểm nhấn là thực tập ở trường: hiếm có dịp vào lớp thật, nhưng phải tự chủ động."
    ms: "Penempatan sekolah ialah kemuncak: peluang jarang ke bilik darjah sebenar, tetapi perlu ambil inisiatif."
    id: "Praktik di sekolah jadi sorotan: kesempatan langka masuk kelas sungguhan, tapi harus proaktif di sana."
    hi: "स्कूल प्लेसमेंट सबसे अच्छा हिस्सा है: असली क्लासरूम का दुर्लभ मौका, पर वहाँ खुद पहल करनी पड़ती है।"
  - en: "Opinions on marking are split: earlier reviewers called it an easy WAM booster, while several since 2024 found marking harsher and criteria vague."
    zh: "对评分看法不一：早期评论说是轻松提分课，2024年后有几位觉得评分变严、标准模糊。"
    zh-TW: "對評分看法不一：早期評論說是輕鬆拉分課，2024年後有幾位覺得評分變嚴、標準模糊。"
    ja: "採点の評価は分かれる。以前は楽にWAMが上がると言われたが、2024年以降は厳しく基準も曖昧との声。"
    ko: "채점 평가는 엇갈림. 예전엔 쉬운 WAM 부스터였지만 2024년 이후엔 채점이 엄격하고 기준이 모호하다는 의견."
    vi: "Ý kiến về chấm điểm chia rẽ: trước đây là môn dễ kéo WAM, từ 2024 nhiều người thấy chấm khắt khe hơn."
    ms: "Pandangan tentang pemarkahan berbelah: dulu dikatakan mudah naikkan WAM, sejak 2024 ada yang rasa lebih ketat."
    id: "Pendapat soal penilaian terbelah: dulu disebut mudah menaikkan WAM, sejak 2024 beberapa merasa lebih ketat."
    hi: "मार्किंग पर राय बँटी है: पहले इसे आसान WAM बूस्टर कहा गया, 2024 से कुछ को सख़्त और अस्पष्ट लगी।"
  - en: "Feedback on assignments was often described as thin, and the compulsory two-hour seminars as dull for some."
    zh: "不少人说作业反馈很少，也有人觉得必须出勤的两小时研讨课很枯燥。"
    zh-TW: "不少人說作業回饋很少，也有人覺得必須出席的兩小時研討課很枯燥。"
    ja: "課題のフィードバックが少ないとの声が多く、必修の2時間セミナーが退屈という人も。"
    ko: "과제 피드백이 빈약하다는 평이 많고, 필수 출석 2시간 세미나가 지루하다는 의견도 있음."
    vi: "Nhiều người nói phản hồi bài tập sơ sài, và vài người thấy seminar 2 tiếng bắt buộc khá chán."
    ms: "Maklum balas tugasan sering dikatakan nipis, dan seminar wajib dua jam membosankan bagi sesetengah orang."
    id: "Umpan balik tugas sering dibilang minim, dan seminar wajib dua jam terasa membosankan bagi sebagian."
    hi: "असाइनमेंट पर फ़ीडबैक अक्सर कम बताया गया, और कुछ को दो घंटे के अनिवार्य सेमिनार उबाऊ लगे।"
sections:
  content:
    - en: "A breadth built around a 20-hour school placement plus seminars. Many enjoyed the placement and found it useful for a resume, even without plans to teach."
      zh: "以 20 小时学校实习为主的 breadth，再加研讨课。很多人喜欢实习，觉得对简历有帮助，就算不打算当老师也值得。"
      zh-TW: "以 20 小時學校實習為主的 breadth，再加研討課。很多人喜歡實習，覺得對履歷有幫助，就算不打算當老師也值得。"
      ja: "20時間の学校実習とセミナーを軸にしたブレドス。教員志望でなくても実習が楽しく履歴書にも役立つという声が多い。"
      ko: "20시간 학교 실습과 세미나로 이루어진 브레드스. 교사 계획이 없어도 실습이 즐겁고 이력서에 도움이 된다는 평이 많다."
      vi: "Môn breadth xoay quanh 20 giờ kiến tập ở trường cộng với seminar. Nhiều người thích kiến tập và thấy có ích cho CV, dù không định đi dạy."
      ms: "Subjek breadth berasaskan penempatan sekolah 20 jam serta seminar. Ramai seronok dengan penempatan dan rasa berguna untuk resume, walaupun tidak bercadang mengajar."
      id: "Mata kuliah breadth yang berpusat pada penempatan sekolah 20 jam plus seminar. Banyak yang menikmati penempatan dan merasa berguna untuk CV, meski tidak berniat mengajar."
      hi: "20 घंटे के स्कूल प्लेसमेंट और सेमिनार पर बना ब्रेड्थ विषय। कई को प्लेसमेंट पसंद आया और रिज़्यूमे के लिए उपयोगी लगा, भले पढ़ाने का इरादा न हो।"
  work:
    - en: "A personal essay on your own schooling, a group presentation on a school issue and a scholarly essay. Feedback is often seen as thin, even with good marks."
      zh: "一篇关于自己求学经历的个人论文、一个关于学校议题的小组展示，以及一篇学术论文。很多人觉得反馈太少，即使分数不错。"
      zh-TW: "一篇關於自己求學經歷的個人論文、一個關於學校議題的小組報告，以及一篇學術論文。很多人覺得回饋太少，即使分數不錯。"
      ja: "自分の学校経験についての個人エッセイ、学校の課題に関するグループ発表、学術エッセイ。点数が良くてもフィードバックが薄いという声が多い。"
      ko: "자신의 학창 경험에 관한 개인 에세이, 학교 이슈에 관한 조별 발표, 학술 에세이가 있다. 점수가 좋아도 피드백이 빈약하다는 평이 많다."
      vi: "Một bài luận cá nhân về trải nghiệm đi học, một bài thuyết trình nhóm về vấn đề trường học và một bài luận học thuật. Phản hồi thường bị cho là sơ sài, kể cả khi điểm tốt."
      ms: "Esei peribadi tentang persekolahan sendiri, pembentangan kumpulan tentang isu sekolah dan esei ilmiah. Maklum balas sering dianggap nipis, walaupun markah baik."
      id: "Esai pribadi tentang pengalaman sekolahmu, presentasi kelompok tentang isu sekolah dan esai ilmiah. Umpan balik sering dianggap tipis, meski nilainya bagus."
      hi: "अपनी स्कूली ज़िंदगी पर एक निजी निबंध, स्कूल के किसी मुद्दे पर ग्रुप प्रेज़ेंटेशन और एक विद्वत्तापूर्ण निबंध। अच्छे अंक के बावजूद फ़ीडबैक अक्सर कम माना गया।"
  study:
    - en: "Read the instructions closely and check your work against the rubric. On placement, take initiative and say what you want from it, as you are largely left to yourself."
      zh: "仔细读要求，交之前对照评分标准检查。实习时要主动，说清楚你想学到什么，因为基本靠自己。"
      zh-TW: "仔細讀要求，交之前對照評分標準檢查。實習時要主動，講清楚你想學到什麼，因為基本上靠自己。"
      ja: "指示をよく読み、提出前にルーブリックと照らし合わせる。実習ではほぼ放任なので、自分から何を得たいか伝える。"
      ko: "안내를 꼼꼼히 읽고 제출 전 루브릭과 대조하라. 실습에선 거의 혼자이니 주도적으로 원하는 걸 말하라."
      vi: "Đọc kỹ hướng dẫn và đối chiếu bài với rubric. Khi kiến tập, hãy chủ động và nói rõ bạn muốn gì, vì phần lớn bạn tự xoay xở."
      ms: "Baca arahan dengan teliti dan semak kerja dengan rubrik. Semasa penempatan, ambil inisiatif dan nyatakan apa yang anda mahu kerana kebanyakannya bergantung pada diri sendiri."
      id: "Baca instruksi dengan teliti dan cocokkan dengan rubrik. Saat penempatan, ambil inisiatif dan sampaikan apa yang kamu inginkan, karena sebagian besar dilepas sendiri."
      hi: "निर्देश ध्यान से पढ़ें और रूब्रिक से अपना काम मिलाएँ। प्लेसमेंट में पहल करें और बताएँ आप क्या चाहते हैं, क्योंकि ज़्यादातर ख़ुद पर छोड़ा जाता है।"
  watch:
    - en: "Reviewers up to 2023 called it an easy WAM booster; several from 2024–25 say it changed, with harsher or vaguer marking and dull mandatory seminars. A 2026 reviewer was positive again."
      zh: "2023 年及以前的同学说是轻松刷分课；2024–25 年好几位说改版后变了，评分更严或更含糊，强制出勤的研讨课很无聊。2026 年有同学评价又转好。"
      zh-TW: "2023 年以前的同學說是輕鬆拉分課；2024–25 年好幾位說改版後變了，評分更嚴或更含糊，強制出席的研討課很無聊。2026 年有同學評價又轉好。"
      ja: "2023年までは楽にWAMが上がる科目という声。2024〜25年は変わった、採点が厳しく曖昧になり必修セミナーが退屈という声が複数。2026年は再び好意的な声。"
      ko: "2023년까지는 쉬운 WAM 과목이라는 평. 2024–25년엔 바뀌어 채점이 더 가혹하거나 모호해지고 필수 세미나가 지루하다는 의견이 여럿. 2026년엔 다시 긍정적이다."
      vi: "Người học đến 2023 gọi là môn kéo WAM dễ; vài người năm 2024–25 nói môn đã thay đổi, chấm gắt hoặc mơ hồ hơn, seminar bắt buộc nhàm chán. Một người năm 2026 lại đánh giá tốt."
      ms: "Pengulas hingga 2023 kata ia penaik WAM mudah; beberapa dari 2024–25 kata ia berubah, pemarkahan lebih keras atau kabur dan seminar wajib membosankan. Seorang pengulas 2026 positif semula."
      id: "Pengulas hingga 2023 menyebutnya pendongkrak WAM mudah; beberapa dari 2024–25 bilang sudah berubah, penilaian lebih keras atau kabur dan seminar wajib membosankan. Satu pengulas 2026 kembali positif."
      hi: "2023 तक के रिव्यूअर्स ने इसे आसान WAM बूस्टर कहा; 2024–25 के कई कहते हैं यह बदल गया, मार्किंग सख़्त या अस्पष्ट हुई और अनिवार्य सेमिनार उबाऊ। 2026 का एक रिव्यूअर फिर सकारात्मक था।"
workload: light
difficulty: mixed
