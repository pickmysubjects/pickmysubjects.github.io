code: PHYC10007
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/phyc10007
reviews: 10
from: 2018
to: 2020
checked: 2026-10-21
points:
  - en: "Most reviewers, many with no physics background, found it hard and poorly organised, with confusing lectures and practice exams that lacked clear answers."
    zh: "多数评论者（不少没学过物理）觉得这门课难、组织混乱，讲课让人困惑，往年试题也缺少清楚的答案。"
    zh-TW: "多數評論者（不少沒學過物理）覺得這門課難、組織混亂，講課令人困惑，考古題也缺少清楚的解答。"
    ja: "物理未経験者を中心に、難しく運営もまとまりがないとの声が多い。講義がわかりにくく、過去問の解答も不十分。"
    ko: "물리 배경이 없는 수강생이 많았고, 대부분 어렵고 운영이 엉성하며 강의가 혼란스럽고 기출 해설도 부실했다고 함."
    vi: "Phần lớn người review, nhiều người chưa học vật lý, thấy môn khó và tổ chức kém, bài giảng khó hiểu, đề cũ thiếu đáp án rõ."
    ms: "Kebanyakan pengulas, ramai tanpa latar fizik, rasa ia sukar dan kurang teratur, kuliah mengelirukan dan jawapan soalan lepas tidak jelas."
    id: "Sebagian besar pengulas, banyak yang tanpa latar fisika, merasa sulit dan kurang tertata, kuliah membingungkan, soal lama minim jawaban jelas."
    hi: "ज़्यादातर रिव्यूअर, कई बिना फ़िज़िक्स बैकग्राउंड के, इसे कठिन और अव्यवस्थित बताते हैं; लेक्चर उलझाऊ और पुराने पेपरों के जवाब अस्पष्ट।"
  - en: "Lab reports are written within the session, and several said prac marks depend a lot on which demonstrator you get and that feedback was thin."
    zh: "实验报告要在课上当场写完，有几位说实验分数很看带课助教，反馈也很少。"
    zh-TW: "實驗報告要在課堂上當場寫完，有幾位說實驗分數很看帶課助教，回饋也很少。"
    ja: "実験レポートはその場で書き上げる形式。実験の点数は担当デモンストレーター次第で、フィードバックも少ないとの声。"
    ko: "실험 보고서는 수업 중에 써야 하고, 실험 점수가 담당 조교에 크게 좌우되며 피드백이 적었다는 의견이 여럿."
    vi: "Báo cáo thí nghiệm phải viết ngay trong buổi; vài người nói điểm thực hành phụ thuộc nhiều vào người hướng dẫn và ít phản hồi."
    ms: "Laporan makmal ditulis dalam sesi itu sendiri; beberapa kata markah amali banyak bergantung pada demonstrator dan maklum balas sedikit."
    id: "Laporan praktikum ditulis saat sesi; beberapa bilang nilai praktikum sangat tergantung asisten dan umpan baliknya minim."
    hi: "लैब रिपोर्ट सत्र के भीतर लिखनी होती है; कई ने कहा प्रैक के अंक डेमॉन्स्ट्रेटर पर बहुत निर्भर हैं और फ़ीडबैक कम मिला।"
  - en: "Those who did well say an H1 is reachable by working through many textbook and past exam questions; the exam reused past questions and scaling helped."
    zh: "考得好的人说，多做课本题和往年真题就有机会拿H1；考试会重复往年题目，调分也有帮助。"
    zh-TW: "考得好的人說，多做課本題和考古題就有機會拿H1；考試會重複往年題目，調分也有幫助。"
    ja: "高得点の人は、教科書と過去問を大量に解けばH1も狙えると言う。試験は過去問の再利用があり、スケーリングにも助けられた。"
    ko: "잘 받은 사람들은 교재와 기출을 많이 풀면 H1도 가능하다고 함. 시험에 기출이 재사용됐고 스케일링도 도움이 됨."
    vi: "Người đạt điểm cao nói có thể lấy H1 nếu luyện nhiều bài sách và đề cũ; đề thi lặp lại câu cũ và có scaling giúp đỡ."
    ms: "Yang berjaya kata H1 boleh dicapai dengan banyak latihan buku teks dan soalan lepas; peperiksaan ulang soalan lama dan penskalaan membantu."
    id: "Yang berhasil bilang H1 bisa diraih dengan banyak latihan soal buku dan ujian lama; ujian mengulang soal lama dan scaling membantu."
    hi: "अच्छे अंक पाने वाले कहते हैं कि किताब और पुराने पेपर के बहुत सवाल करने से H1 मिल सकता है; परीक्षा में पुराने सवाल दोहराए गए और स्केलिंग से मदद मिली।"
sections:
  content:
    - en: "Physics for biomedicine students, many with no physics background, covering a lot in 12 weeks. Many found the lectures confusing or formula-heavy, and the subject poorly run."
      zh: "给生物医学学生的物理课，很多人没物理基础，12 周要学很多。不少人觉得讲座混乱、只堆公式，课程组织得也不好。"
      zh-TW: "給生物醫學學生的物理課，很多人沒物理基礎，12 週要學很多。不少人覺得講座混亂、只堆公式，課程組織得也不好。"
      ja: "生物医学の学生向けの物理で、物理未経験者も多く、12週で多くを扱う。講義が分かりにくく公式ばかりで、運営も悪いという声が多い。"
      ko: "생물의학 학생을 위한 물리로, 물리 경험이 없는 사람이 많은데 12주에 많은 것을 다룬다. 강의가 혼란스럽고 공식 위주이며 운영도 엉성하다는 의견이 많다."
      vi: "Vật lý cho sinh viên y sinh, nhiều người không có nền vật lý, học rất nhiều trong 12 tuần. Nhiều người thấy bài giảng rối hoặc chỉ toàn công thức, và môn tổ chức kém."
      ms: "Fizik untuk pelajar bioperubatan, ramai tanpa latar fizik, meliputi banyak perkara dalam 12 minggu. Ramai dapati kuliah mengelirukan atau penuh formula, dan subjek diurus dengan lemah."
      id: "Fisika untuk mahasiswa biomedis, banyak yang tanpa latar fisika, mencakup banyak hal dalam 12 minggu. Banyak yang merasa kuliahnya membingungkan atau penuh rumus, dan pengelolaannya buruk."
      hi: "बायोमेडिसिन छात्रों के लिए भौतिकी, कई बिना भौतिकी बैकग्राउंड के, 12 हफ़्तों में बहुत कुछ। कई को लेक्चर उलझे या सूत्रों से भरे लगे, और विषय ख़राब ढंग से चलाया गया।"
  work:
    - en: "Pracs involve writing a lab report within the session; marks depend a lot on your demonstrator and feedback was thin. Homework assignments were tedious but kept people on top of content."
      zh: "实验要在课上写完实验报告；分数很看 demonstrator，反馈也少。作业很繁琐，但能逼人跟上内容。"
      zh-TW: "實驗要在課上寫完實驗報告；分數很看 demonstrator，回饋也少。作業很繁瑣，但能逼人跟上內容。"
      ja: "実習では時間内にラボレポートを書く。点数はデモンストレーター次第で、フィードバックも少ない。宿題は面倒だが内容についていくのに役立った。"
      ko: "실습 시간 안에 실험 보고서를 써야 한다. 점수는 데몬스트레이터에 크게 달렸고 피드백도 적다. 과제는 번거롭지만 진도를 따라가는 데 도움이 됐다."
      vi: "Thực hành phải viết xong báo cáo trong buổi; điểm phụ thuộc nhiều vào demonstrator, phản hồi ít. Bài tập về nhà tẻ nhạt nhưng giúp theo kịp nội dung."
      ms: "Amali melibatkan menulis laporan makmal dalam sesi; markah banyak bergantung pada demonstrator dan maklum balas nipis. Tugasan rumah meletihkan tetapi membantu mengikuti kandungan."
      id: "Praktikum mengharuskan menulis laporan lab dalam sesi; nilai sangat tergantung demonstrator dan umpan balik minim. PR membosankan tapi membantu mengikuti materi."
      hi: "प्रैक्टिकल में सेशन के अंदर ही लैब रिपोर्ट लिखनी होती है; अंक डेमॉन्स्ट्रेटर पर बहुत निर्भर और फ़ीडबैक कम। होमवर्क थकाऊ था पर कंटेंट के साथ बने रहने में मदद करता था।"
    - en: "The exam was called tough, though some questions repeated past papers and scaling helped."
      zh: "期末被说很难，不过有些题和往年重复，scale 也帮了忙。"
      zh-TW: "期末被說很難，不過有些題跟往年重複，調分也幫了忙。"
      ja: "期末は難しいとされるが、過去問と重なる問題もあり、スケーリングにも助けられた。"
      ko: "기말은 어려웠다고 하지만 기출과 겹치는 문제도 있었고 스케일링이 도움이 됐다."
      vi: "Bài thi được nói là khó, dù có câu lặp lại đề cũ và việc scale điểm đã giúp."
      ms: "Peperiksaan dikatakan sukar, walaupun ada soalan berulang dari kertas lepas dan penskalaan membantu."
      id: "Ujiannya disebut sulit, meski ada soal yang mengulang ujian lama dan penskalaan membantu."
      hi: "परीक्षा कठिन बताई गई, हालाँकि कुछ सवाल पुराने पेपरों से दोहराए गए और स्केलिंग से मदद मिली।"
  study:
    - en: "Understanding slides isn't enough: do lots of textbook and past-exam questions, use tutors, and consider a study group."
      zh: "光看懂课件不够：多做教材题和往年题，多找 tutor，可以组个学习小组。"
      zh-TW: "光看懂投影片不夠：多做課本題和考古題，多找 tutor，可以組個讀書會。"
      ja: "スライドを理解するだけでは不十分。教科書や過去問を多く解き、チューターを活用し、勉強会も検討を。"
      ko: "슬라이드 이해만으론 부족하다. 교재와 기출 문제를 많이 풀고 튜터를 활용하며 스터디 그룹도 고려하라."
      vi: "Hiểu slide là chưa đủ: làm nhiều bài trong giáo trình và đề cũ, tận dụng tutor, và cân nhắc nhóm học."
      ms: "Memahami slaid tidak cukup: buat banyak soalan buku teks dan kertas lepas, guna tutor, dan pertimbang kumpulan belajar."
      id: "Memahami slide tidak cukup: kerjakan banyak soal buku teks dan ujian lama, manfaatkan tutor, dan pertimbangkan kelompok belajar."
      hi: "स्लाइड समझना काफ़ी नहीं: पाठ्यपुस्तक और पुराने पेपरों के बहुत सवाल करें, ट्यूटर का उपयोग करें, और स्टडी ग्रुप पर विचार करें।"
  watch:
    - en: "All these reviews are from 2020 or earlier; teaching and assessment may have changed since."
      zh: "这些评价都是 2020 年或更早的，现在的教法和考核可能已经变了。"
      zh-TW: "這些評價都是 2020 年或更早的，現在的教法和考核可能已經變了。"
      ja: "レビューはすべて2020年以前のもの。授業や評価は変わっている可能性がある。"
      ko: "모든 리뷰가 2020년 이전 것이라 지금 수업과 평가는 달라졌을 수 있다."
      vi: "Tất cả đánh giá đều từ năm 2020 trở về trước; cách dạy và đánh giá có thể đã thay đổi."
      ms: "Semua ulasan ini dari 2020 atau lebih awal; pengajaran dan penilaian mungkin telah berubah."
      id: "Semua ulasan ini dari 2020 atau sebelumnya; pengajaran dan penilaian mungkin sudah berubah."
      hi: "ये सभी रिव्यू 2020 या उससे पहले के हैं; पढ़ाई और मूल्यांकन अब बदल चुके हो सकते हैं।"
workload: heavy
difficulty: hard
