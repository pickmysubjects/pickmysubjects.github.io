code: FNCE20005
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/fnce20005
reviews: 10
from: 2018
to: 2026
checked: 2026-10-08
points:
  - en: "More theory-heavy and less calculation than Principles of Finance; the exam and midterm focus on understanding concepts."
    zh: "比金融原理更偏理论、计算更少；期中期末重在理解概念。"
    zh-TW: "比Principles of Finance更偏理論、計算更少；期中和期末考重在理解概念。"
    ja: "Principles of Financeより理論寄りで計算は少ない。中間・期末試験は概念の理解が中心。"
    ko: "Principles of Finance보다 이론 비중이 크고 계산은 적으며, 중간·기말고사는 개념 이해에 중점."
    vi: "Thiên về lý thuyết và ít tính toán hơn Principles of Finance; giữa kỳ và cuối kỳ tập trung vào hiểu khái niệm."
    ms: "Lebih berat teori dan kurang pengiraan berbanding Principles of Finance; peperiksaan dan pertengahan semester fokus pada kefahaman konsep."
    id: "Lebih berat teori dan lebih sedikit hitungan dibanding Principles of Finance; UTS dan ujian akhir fokus pada pemahaman konsep."
    hi: "Principles of Finance से ज़्यादा थ्योरी और कम कैलकुलेशन; एग्ज़ाम और मिडटर्म कॉन्सेप्ट समझने पर केंद्रित हैं।"
  - en: "Practical and valuable for those aiming at corporate finance or investment banking."
    zh: "对有志于公司金融或投行的学生非常实用。"
    zh-TW: "對想走公司金融或投資銀行的人來說很實用、很有價值。"
    ja: "コーポレートファイナンスや投資銀行を目指す人には実践的で価値がある。"
    ko: "기업금융이나 투자은행을 목표로 하는 사람에게 실용적이고 가치 있음."
    vi: "Thực tế và giá trị cho ai nhắm đến tài chính doanh nghiệp hay ngân hàng đầu tư."
    ms: "Praktikal dan bernilai bagi yang menyasarkan kewangan korporat atau perbankan pelaburan."
    id: "Praktis dan berharga bagi yang mengincar keuangan korporat atau investment banking."
    hi: "कॉर्पोरेट फ़ाइनेंस या इन्वेस्टमेंट बैंकिंग की ओर जाने वालों के लिए प्रैक्टिकल और उपयोगी।"
  - en: "Older reviews say in-class exercises were not recorded but appeared in exams, so attend lectures; slides can be sparse."
    zh: "早期评论称课堂练习不录播却会考到，应到场听课；讲义内容较少。"
    zh-TW: "早期評論說課堂練習沒有錄影卻會考，所以要到場上課；投影片內容可能偏少。"
    ja: "古い口コミでは授業中の演習は録画されないのに試験に出たので、講義には出席を。スライドは情報が少なめ。"
    ko: "예전 후기에 따르면 수업 중 연습은 녹화되지 않지만 시험에 나왔으니 강의에 참석하세요. 슬라이드는 빈약할 수 있음."
    vi: "Đánh giá cũ nói bài tập trên lớp không được ghi hình nhưng lại ra thi, nên hãy đi học; slide có thể sơ sài."
    ms: "Ulasan lama kata latihan dalam kelas tidak dirakam tetapi keluar dalam peperiksaan, jadi hadiri kuliah; slaid mungkin ringkas."
    id: "Ulasan lama bilang latihan di kelas tidak direkam tapi keluar di ujian, jadi hadiri kuliah; slide bisa minim isi."
    hi: "पुराने रिव्यू कहते हैं क्लास में कराई एक्सरसाइज़ रिकॉर्ड नहीं होती थीं पर एग्ज़ाम में आईं, तो लेक्चर में जाएँ; स्लाइड्स में कम जानकारी हो सकती है।"
sections:
  content:
    - en: "Follows on from FNCE10002 (Principles of Finance) into how companies raise debt and equity. More theory and rules than calculation, which some found dry; seen as useful for corporate finance or banking careers."
      zh: "接着 FNCE10002（Principles of Finance）讲公司怎么融资（债务和股权）。理论和规则多、计算少，有人觉得枯燥；被认为对想做企业金融或投行的人有用。"
      zh-TW: "接續 FNCE10002（Principles of Finance）講公司如何融資（債務和股權）。理論和規則多、計算少，有人覺得乾；被認為對想做企業金融或投行的人有用。"
      ja: "FNCE10002（Principles of Finance）の続きで、企業の負債・株式による資金調達を学ぶ。計算より理論や規則が多く退屈という人も。コーポレートファイナンスや銀行志望には役立つとされる。"
      ko: "FNCE10002(Principles of Finance)에 이어 기업의 부채·지분 조달을 다룬다. 계산보다 이론과 규칙이 많아 건조하다는 사람도 있다. 기업금융이나 은행 진로에 유용하다는 평."
      vi: "Tiếp nối FNCE10002 (Principles of Finance) về cách công ty huy động nợ và vốn. Nhiều lý thuyết và quy định hơn tính toán, vài người thấy khô; được xem là hữu ích cho nghề tài chính doanh nghiệp hay ngân hàng."
      ms: "Sambungan FNCE10002 (Principles of Finance) tentang cara syarikat mengumpul hutang dan ekuiti. Lebih teori dan peraturan berbanding pengiraan, ada yang rasa hambar; dianggap berguna untuk kerjaya kewangan korporat atau perbankan."
      id: "Lanjutan FNCE10002 (Principles of Finance) tentang cara perusahaan menghimpun utang dan ekuitas. Lebih banyak teori dan aturan daripada hitungan, sebagian merasa kering; dianggap berguna untuk karier keuangan korporat atau perbankan."
      hi: "FNCE10002 (Principles of Finance) के आगे, कंपनियाँ कर्ज़ और इक्विटी कैसे जुटाती हैं। गणना से ज़्यादा थ्योरी और नियम, कुछ को नीरस लगे; कॉर्पोरेट फ़ाइनेंस या बैंकिंग करियर के लिए उपयोगी माना जाता है।"
  work:
    - en: "The MST and exam are theory-heavy: doable but not easy. The maths isn't hard but needs practice."
      zh: "MST 和期末偏理论：能应付但不轻松。数学部分不难，但要多练。"
      zh-TW: "MST 和期末偏理論：能應付但不輕鬆。數學部分不難，但要多練。"
      ja: "MSTと期末試験は理論中心。こなせるが簡単ではない。数学は難しくないが練習が必要。"
      ko: "MST와 기말은 이론 위주로, 할 만하지만 쉽지는 않다. 수학은 어렵지 않지만 연습이 필요하다."
      vi: "MST và bài thi nặng lý thuyết: làm được nhưng không dễ. Phần toán không khó nhưng cần luyện."
      ms: "MST dan peperiksaan berat teori: boleh dibuat tetapi tidak mudah. Matematik tidak sukar tetapi perlu latihan."
      id: "MST dan ujian berat teori: bisa dikerjakan tapi tidak mudah. Matematikanya tidak sulit tapi perlu latihan."
      hi: "MST और परीक्षा थ्योरी-भारी हैं: हो जाते हैं पर आसान नहीं। मैथ्स कठिन नहीं पर प्रैक्टिस चाहिए।"
  study:
    - en: "Read the material before each lecture since they move fast, and make sure you understand the concepts, not just the formulas. Older reviews say some in-lecture exercises weren't recorded, so attend."
      zh: "lecture 节奏快，课前先看材料；要真正理解概念，不只是公式。早年评价说课上有些练习不录播，所以要到场。"
      zh-TW: "lecture 節奏快，課前先看資料；要真正理解概念，不只是公式。早年評價說課堂上有些練習沒錄影，所以要到場。"
      ja: "講義は速いので事前に資料を読み、公式だけでなく概念を理解しよう。古いレビューでは講義中の演習が録画されなかったので出席をとある。"
      ko: "강의가 빠르니 미리 자료를 읽고, 공식만이 아니라 개념을 이해하자. 예전 리뷰에선 강의 중 연습이 녹화되지 않아 출석하라고 한다."
      vi: "Đọc tài liệu trước mỗi bài giảng vì giảng nhanh, và hiểu khái niệm chứ không chỉ công thức. Đánh giá cũ nói vài bài tập trên lớp không được ghi hình, nên hãy đến lớp."
      ms: "Baca bahan sebelum setiap kuliah kerana ia pantas, dan fahami konsep, bukan sekadar formula. Ulasan lama kata sesetengah latihan dalam kuliah tidak dirakam, jadi hadirlah."
      id: "Baca materi sebelum kuliah karena tempo cepat, dan pahami konsep, bukan sekadar rumus. Ulasan lama bilang sebagian latihan di kuliah tak direkam, jadi hadirlah."
      hi: "लेक्चर तेज़ चलते हैं, इसलिए पहले सामग्री पढ़ें, और सिर्फ़ फ़ॉर्मूले नहीं, कॉन्सेप्ट समझें। पुराने रिव्यू कहते हैं क्लास के कुछ अभ्यास रिकॉर्ड नहीं होते थे, तो जाएँ।"
