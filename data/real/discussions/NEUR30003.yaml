points:
  - en: "Opinions are sharply split: several found it the most interesting subject they had taken, others the worst run."
    zh: "评价严重两极：有人称最有趣，也有人称组织最差。"
  - en: "Most lectures lack learning outcomes, and staff did not monitor the discussion board. Ask questions by email or after lectures."
    zh: "多数讲座无学习目标，讨论区无人管理；有问题可发邮件或课后当面问。"
  - en: "Very content heavy, with a hard all-MCQ mid-semester test. Several found the final exam easier than the MST."
    zh: "内容极多，全选择题期中很难；多人觉得期末比期中容易。"
  - en: "Watch the lectures and note what is said, not just the slides. Cramming the slides at the end tends to fail."
    zh: "要认真看讲座并记录口述内容，不能只看课件，临时突击效果差。"
