points:
  - en: "Opinions are sharply split: several found it the most interesting subject they had taken, others the worst run."
    zh: "评价严重两极：有人称最有趣，也有人称组织最差。"
    zh-TW: "評價嚴重兩極：有人說是修過最有趣的課，也有人說是組織最差的課。"
    ja: "意見ははっきり分かれる。今まで受けた中で一番面白い科目という人もいれば、運営が最悪だという人もいる。"
    ko: "의견이 극명하게 갈린다. 들었던 과목 중 가장 흥미로웠다는 사람도, 운영이 최악이었다는 사람도 있다."
    vi: "Ý kiến chia rẽ mạnh: nhiều người thấy đây là môn thú vị nhất từng học, người khác thấy tổ chức tệ nhất."
    ms: "Pendapat sangat berbelah: beberapa dapati ia subjek paling menarik pernah diambil, yang lain paling teruk diurus."
    id: "Pendapat sangat terbelah: beberapa menilainya mata kuliah paling menarik yang pernah diambil, lainnya yang paling buruk pengelolaannya."
    hi: "राय बहुत बँटी है: कई को यह अब तक का सबसे दिलचस्प सब्जेक्ट लगा, दूसरों को सबसे खराब मैनेज्ड।"
  - en: "Most lectures lack learning outcomes, and staff did not monitor the discussion board. Ask questions by email or after lectures."
    zh: "多数讲座无学习目标，讨论区无人管理；有问题可发邮件或课后当面问。"
    zh-TW: "多數講課沒有學習目標，討論區沒人管理；有問題可寄信或下課後當面問。"
    ja: "多くの講義に学習目標がなく、教員は掲示板を見ていなかった。質問はメールか講義後に。"
    ko: "대부분의 강의에 학습 목표가 없고 교수진이 토론 게시판을 확인하지 않았다. 질문은 이메일이나 강의 후에 하자."
    vi: "Hầu hết bài giảng không có mục tiêu học tập, giảng viên không theo dõi diễn đàn. Hãy hỏi qua email hoặc sau giờ giảng."
    ms: "Kebanyakan kuliah tiada hasil pembelajaran, dan staf tidak memantau papan perbincangan. Tanya melalui e-mel atau selepas kuliah."
    id: "Kebanyakan kuliah tanpa capaian pembelajaran, dan pengajar tidak memantau forum diskusi. Tanyakan lewat email atau setelah kuliah."
    hi: "ज़्यादातर लेक्चर में लर्निंग आउटकम नहीं, और स्टाफ़ ने डिस्कशन बोर्ड नहीं देखा। सवाल ईमेल से या लेक्चर के बाद पूछें।"
  - en: "Very content heavy, with a hard all-MCQ mid-semester test. Several found the final exam easier than the MST."
    zh: "内容极多，全选择题期中很难；多人觉得期末比期中容易。"
    zh-TW: "內容極多，全選擇題的期中考很難；多人覺得期末比期中容易。"
    ja: "内容が非常に多く、全問選択式の中間テストは難しい。期末試験はMSTより易しかったという人が複数いる。"
    ko: "내용이 매우 많고 전부 객관식인 중간시험이 어렵다. 기말이 MST보다 쉬웠다는 사람이 여럿이다."
    vi: "Rất nhiều nội dung, bài kiểm tra giữa kỳ toàn trắc nghiệm và khó. Nhiều người thấy thi cuối kỳ dễ hơn MST."
    ms: "Kandungan sangat padat, dengan ujian pertengahan semester semua MCQ yang sukar. Beberapa dapati peperiksaan akhir lebih mudah daripada MST."
    id: "Materi sangat padat, dengan tes tengah semester full pilihan ganda yang sulit. Beberapa menilai ujian akhir lebih mudah dari MST."
    hi: "बहुत भारी कंटेंट, पूरा MCQ वाला कठिन मिड-सेमेस्टर टेस्ट। कई को फ़ाइनल एग्ज़ाम MST से आसान लगा।"
  - en: "Watch the lectures and note what is said, not just the slides. Cramming the slides at the end tends to fail."
    zh: "要认真看讲座并记录口述内容，不能只看课件，临时突击效果差。"
    zh-TW: "要認真看講課並記下口述內容，不能只看投影片，最後才猛K投影片通常沒用。"
    ja: "スライドだけでなく講義を見て、話された内容をメモしよう。最後にスライドを詰め込むやり方は失敗しがち。"
    ko: "슬라이드만 보지 말고 강의를 보며 말한 내용을 필기하자. 막판에 슬라이드만 벼락치기하면 실패하기 쉽다."
    vi: "Hãy xem bài giảng và ghi lại lời giảng, không chỉ slide. Học dồn slide vào cuối thường thất bại."
    ms: "Tonton kuliah dan catat apa yang disebut, bukan slaid sahaja. Menghafal slaid saat akhir biasanya gagal."
    id: "Tonton kuliah dan catat yang diucapkan, bukan hanya slide. Kebut slide di akhir biasanya gagal."
    hi: "लेक्चर देखें और जो बोला गया वह नोट करें, सिर्फ़ स्लाइड्स नहीं। आख़िर में स्लाइड्स रटना अक्सर काम नहीं आता।"
workload: heavy
difficulty: mixed
