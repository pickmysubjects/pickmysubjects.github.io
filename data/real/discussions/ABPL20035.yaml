reviews: 7
from: 2014
to: 2025
checked: 2026-10-19
points:
  - en: "Most reviewers found it interesting and well run, a good general intro to urban planning, including as a breadth subject."
    zh: "多数评论者觉得有趣且组织良好，是城市规划不错的入门，也适合作为跨学科选修。"
    zh-TW: "多數評論者覺得有趣且安排得好，是都市計畫不錯的入門，也適合當 Breadth 選修。"
    ja: "多くのレビューで面白く運営も良いとされ、都市計画の入門として、Breadthとしても好評。"
    ko: "대부분 흥미롭고 운영이 잘 된다고 평가. 도시계획 입문으로 좋고 Breadth로도 괜찮음."
    vi: "Đa số thấy môn thú vị, tổ chức tốt, là nhập môn quy hoạch đô thị hay, kể cả làm Breadth."
    ms: "Kebanyakan pengulas rasa ia menarik dan teratur, pengenalan perancangan bandar yang baik, termasuk sebagai Breadth."
    id: "Sebagian besar merasa menarik dan tertata, pengantar perencanaan kota yang bagus, termasuk sebagai Breadth."
    hi: "ज़्यादातर को यह रोचक और अच्छी तरह चलाया गया लगा, शहरी योजना का अच्छा परिचय, Breadth के रूप में भी।"
  - en: "Assignments centre on a real Melbourne council area and include fieldwork such as counting people and short interviews."
    zh: "作业围绕墨尔本一个真实的地方政府辖区，包括数人流、简短访谈等实地调查。"
    zh-TW: "作業圍繞墨爾本一個真實的地方政府轄區，包括數人流、簡短訪談等實地調查。"
    ja: "課題はメルボルンの実在する自治体が対象で、人数調査や短いインタビューなどの現地調査を含む。"
    ko: "과제는 멜버른의 실제 지자체 지역을 다루며, 유동 인구 세기나 짧은 인터뷰 같은 현장 조사가 포함됨."
    vi: "Bài tập xoay quanh một khu hành chính thật ở Melbourne, có khảo sát thực địa như đếm người và phỏng vấn ngắn."
    ms: "Tugasan berpusat pada kawasan majlis sebenar di Melbourne, termasuk kerja lapangan seperti mengira orang dan temu bual ringkas."
    id: "Tugas berfokus pada wilayah pemerintah lokal nyata di Melbourne, termasuk kerja lapangan seperti menghitung orang dan wawancara singkat."
    hi: "असाइनमेंट मेलबर्न के एक असली काउंसिल इलाक़े पर हैं, जिनमें लोगों की गिनती और छोटे इंटरव्यू जैसा फ़ील्डवर्क है।"
  - en: "Guest panels were a highlight for some, but others found the lectures less relevant to the assignments. A few said marking was tough."
    zh: "嘉宾座谈是部分人的亮点，但也有人觉得讲座与作业关联不大。少数人认为评分偏严。"
    zh-TW: "客座座談是部分人的亮點，但也有人覺得講座與作業關聯不大。少數人認為評分偏嚴。"
    ja: "ゲストのパネルが良かったという人もいれば、講義が課題とあまり関係ないと感じた人もいる。採点が厳しいという声も少し。"
    ko: "게스트 패널이 좋았다는 사람도 있지만, 강의가 과제와 별로 관련 없다는 의견도 있음. 채점이 깐깐하다는 말도 조금."
    vi: "Phần tọa đàm khách mời được vài người khen, nhưng người khác thấy bài giảng ít liên quan bài tập. Vài người nói chấm khắt khe."
    ms: "Panel tetamu menjadi kegemaran sesetengah orang, tetapi ada yang rasa kuliah kurang berkait dengan tugasan. Beberapa kata pemarkahan ketat."
    id: "Panel tamu jadi sorotan bagi sebagian, tapi ada yang merasa kuliah kurang terkait tugas. Beberapa bilang penilaiannya ketat."
    hi: "कुछ के लिए गेस्ट पैनल सबसे अच्छे रहे, पर कुछ को लेक्चर असाइनमेंट से कम जुड़े लगे। कुछ ने मार्किंग सख़्त बताई।"
sections:
  content:
    - en: "A general intro to urban planning and social justice in cities, with lectures often run as panels of industry guests. Most found it interesting, including as a breadth."
      zh: "城市规划和城市社会公义的概括性入门，讲课常以业界嘉宾座谈形式进行。多数人觉得有意思，当 breadth 修也不错。"
      zh-TW: "都市規劃和城市社會正義的概括性入門，上課常以業界來賓座談形式進行。多數人覺得有趣，當 breadth 修也不錯。"
      ja: "都市計画と都市の社会正義の概論で、講義は業界ゲストのパネル形式が多い。ブレドスとしても面白いという声が多い。"
      ko: "도시계획과 도시의 사회 정의를 다루는 개론으로, 강의는 업계 게스트 패널 형식이 많다. 브레드스로도 흥미롭다는 평이 많다."
      vi: "Nhập môn tổng quát về quy hoạch đô thị và công bằng xã hội trong thành phố, bài giảng thường là tọa đàm với khách mời trong ngành. Đa số thấy thú vị, kể cả khi học làm breadth."
      ms: "Pengenalan umum kepada perancangan bandar dan keadilan sosial di bandar, dengan kuliah sering dalam bentuk panel tetamu industri. Kebanyakan rasa menarik, termasuk sebagai breadth."
      id: "Pengantar umum perencanaan kota dan keadilan sosial di kota, dengan kuliah sering berupa panel tamu dari industri. Kebanyakan merasa menarik, termasuk sebagai breadth."
      hi: "शहरी नियोजन और शहरों में सामाजिक न्याय का सामान्य परिचय, लेक्चर अक्सर इंडस्ट्री मेहमानों के पैनल के रूप में। ज़्यादातर को रोचक लगा, ब्रेड्थ के रूप में भी।"
  work:
    - en: "Assignments on social issues in a particular Melbourne council area, usually with fieldwork like people counting and interviews. Recent reviewers found them clear; older ones found the marking harsh."
      zh: "作业围绕墨尔本某个市政区的社会议题，通常有实地调查，比如统计人流和街头访谈。近期同学觉得要求清楚；早年的同学觉得给分严。"
      zh-TW: "作業圍繞墨爾本某個市政區的社會議題，通常有實地調查，例如統計人流和街頭訪談。近期同學覺得要求清楚；早年的同學覺得給分嚴。"
      ja: "メルボルンの特定の自治体の社会問題に関する課題で、通常は人数カウントやインタビューなどの現地調査がある。最近は明確だという声、以前は採点が厳しいという声。"
      ko: "멜버른 특정 지자체의 사회 문제에 관한 과제로, 보통 유동 인구 세기와 인터뷰 같은 현장 조사가 있다. 최근엔 명확하다는 평, 예전엔 채점이 박하다는 평."
      vi: "Bài tập về các vấn đề xã hội ở một khu vực hội đồng thành phố Melbourne, thường có khảo sát thực địa như đếm người và phỏng vấn. Người học gần đây thấy rõ ràng; trước đây thấy chấm gắt."
      ms: "Tugasan tentang isu sosial di kawasan majlis tertentu di Melbourne, biasanya dengan kerja lapangan seperti mengira orang dan temu bual. Pengulas terkini rasa jelas; yang lama rasa pemarkahan keras."
      id: "Tugas tentang isu sosial di wilayah dewan kota tertentu di Melbourne, biasanya dengan kerja lapangan seperti menghitung orang dan wawancara. Pengulas terbaru merasa jelas; yang lama merasa penilaiannya keras."
      hi: "मेलबर्न के किसी ख़ास काउंसिल क्षेत्र के सामाजिक मुद्दों पर असाइनमेंट, आमतौर पर लोगों की गिनती और इंटरव्यू जैसे फ़ील्डवर्क के साथ। हाल के रिव्यूअर्स को स्पष्ट लगे; पुराने वालों को मार्किंग सख़्त लगी।"
  watch:
    - en: "Some 2020 reviewers felt lectures drifted away from the assignments after the first weeks; there are lots of readings. Only one review is from after 2020."
      zh: "2020 年有同学觉得前几周之后讲课和作业关系不大；阅读量也多。2020 年以后只有一条评价。"
      zh-TW: "2020 年有同學覺得前幾週之後上課和作業關係不大；閱讀量也多。2020 年以後只有一則評價。"
      ja: "2020年には最初の数週を過ぎると講義が課題から離れていったという声も。リーディングは多い。2020年より後のレビューは1件のみ。"
      ko: "2020년엔 초반 몇 주 이후 강의가 과제와 동떨어졌다는 의견이 있었고, 읽기가 많다. 2020년 이후 리뷰는 하나뿐이다."
      vi: "Vài người năm 2020 thấy sau mấy tuần đầu bài giảng ít liên quan đến bài tập; bài đọc khá nhiều. Chỉ có một đánh giá sau 2020."
      ms: "Sesetengah pengulas 2020 rasa kuliah menyimpang daripada tugasan selepas minggu awal; bacaan banyak. Hanya satu ulasan selepas 2020."
      id: "Sebagian pengulas 2020 merasa kuliah menjauh dari tugas setelah minggu-minggu awal; bacaannya banyak. Hanya satu ulasan setelah 2020."
      hi: "2020 के कुछ रिव्यूअर्स को लगा कि शुरुआती हफ़्तों के बाद लेक्चर असाइनमेंट से हट गए; रीडिंग बहुत हैं। 2020 के बाद सिर्फ़ एक रिव्यू है।"
difficulty: mixed
