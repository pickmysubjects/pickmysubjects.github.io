points:
  - en: "Most reviewers found it interesting and well run, a good general intro to urban planning, including as a breadth subject."
    zh: "多数评论者觉得有趣且组织良好，是城市规划不错的入门，也适合作为跨学科选修。"
    zh-TW: "多數評論者覺得有趣且安排得好，是都市計畫不錯的入門，也適合當 Breadth 選修。"
    ja: "多くのレビューで面白く運営も良いとされ、都市計画の入門として、Breadthとしても好評。"
    ko: "대부분 흥미롭고 운영이 잘 된다고 평가. 도시계획 입문으로 좋고 Breadth로도 괜찮음."
    vi: "Đa số thấy môn thú vị, tổ chức tốt, là nhập môn quy hoạch đô thị hay, kể cả làm Breadth."
    ms: "Kebanyakan pengulas rasa ia menarik dan teratur, pengenalan perancangan bandar yang baik, termasuk sebagai Breadth."
    id: "Sebagian besar merasa menarik dan tertata, pengantar perencanaan kota yang bagus, termasuk sebagai Breadth."
    hi: "ज़्यादातर को यह रोचक और अच्छी तरह चलाया गया लगा, शहरी योजना का अच्छा परिचय, Breadth के रूप में भी।"
  - en: "Assignments centre on a real Melbourne council area and include fieldwork such as counting people and short interviews."
    zh: "作业围绕墨尔本一个真实的地方政府辖区，包括数人流、简短访谈等实地调查。"
    zh-TW: "作業圍繞墨爾本一個真實的地方政府轄區，包括數人流、簡短訪談等實地調查。"
    ja: "課題はメルボルンの実在する自治体が対象で、人数調査や短いインタビューなどの現地調査を含む。"
    ko: "과제는 멜버른의 실제 지자체 지역을 다루며, 유동 인구 세기나 짧은 인터뷰 같은 현장 조사가 포함됨."
    vi: "Bài tập xoay quanh một khu hành chính thật ở Melbourne, có khảo sát thực địa như đếm người và phỏng vấn ngắn."
    ms: "Tugasan berpusat pada kawasan majlis sebenar di Melbourne, termasuk kerja lapangan seperti mengira orang dan temu bual ringkas."
    id: "Tugas berfokus pada wilayah pemerintah lokal nyata di Melbourne, termasuk kerja lapangan seperti menghitung orang dan wawancara singkat."
    hi: "असाइनमेंट मेलबर्न के एक असली काउंसिल इलाक़े पर हैं, जिनमें लोगों की गिनती और छोटे इंटरव्यू जैसा फ़ील्डवर्क है।"
  - en: "Guest panels were a highlight for some, but others found the lectures less relevant to the assignments. A few said marking was tough."
    zh: "嘉宾座谈是部分人的亮点，但也有人觉得讲座与作业关联不大。少数人认为评分偏严。"
    zh-TW: "客座座談是部分人的亮點，但也有人覺得講座與作業關聯不大。少數人認為評分偏嚴。"
    ja: "ゲストのパネルが良かったという人もいれば、講義が課題とあまり関係ないと感じた人もいる。採点が厳しいという声も少し。"
    ko: "게스트 패널이 좋았다는 사람도 있지만, 강의가 과제와 별로 관련 없다는 의견도 있음. 채점이 깐깐하다는 말도 조금."
    vi: "Phần tọa đàm khách mời được vài người khen, nhưng người khác thấy bài giảng ít liên quan bài tập. Vài người nói chấm khắt khe."
    ms: "Panel tetamu menjadi kegemaran sesetengah orang, tetapi ada yang rasa kuliah kurang berkait dengan tugasan. Beberapa kata pemarkahan ketat."
    id: "Panel tamu jadi sorotan bagi sebagian, tapi ada yang merasa kuliah kurang terkait tugas. Beberapa bilang penilaiannya ketat."
    hi: "कुछ के लिए गेस्ट पैनल सबसे अच्छे रहे, पर कुछ को लेक्चर असाइनमेंट से कम जुड़े लगे। कुछ ने मार्किंग सख़्त बताई।"
difficulty: mixed
