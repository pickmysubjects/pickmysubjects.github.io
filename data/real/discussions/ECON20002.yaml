checked: 2026-10-08
points:
  - en: "Heavily maths-based (calculus, algebra, graphs); students comfortable with maths say an H1 is achievable."
    zh: "以数学为主（微积分、代数、图像），数学好的学生认为拿H1不难。"
    zh-TW: "以數學為主（微積分、代數、圖形），數學好的學生認為拿H1不難。"
    ja: "数学中心（微積分、代数、グラフ）。数学が得意な学生はH1も取れると言う。"
    ko: "미적분, 대수, 그래프 등 수학 위주이며, 수학에 자신 있는 학생들은 H1도 가능하다고 함."
    vi: "Nặng về toán (giải tích, đại số, đồ thị); sinh viên giỏi toán nói đạt H1 là khả thi."
    ms: "Banyak berasaskan matematik (kalkulus, algebra, graf); pelajar yang selesa dengan matematik kata H1 boleh dicapai."
    id: "Sangat berbasis matematika (kalkulus, aljabar, grafik); mahasiswa yang nyaman dengan matematika bilang H1 bisa dicapai."
    hi: "ज़्यादातर मैथ्स पर आधारित (कैलकुलस, अलजेब्रा, ग्राफ़); मैथ्स में सहज स्टूडेंट्स कहते हैं H1 मिल सकता है।"
  - en: "Those weaker at maths found it hard, and some said exam questions were tougher than tutorial work."
    zh: "数学较弱的学生觉得很难，有人反映考试题比辅导课练习更难。"
    zh-TW: "數學較弱的學生覺得很難，有人反映考題比小組課練習更難。"
    ja: "数学が苦手な人には難しく、試験問題はチュートリアルより難しかったという声も。"
    ko: "수학이 약한 학생들은 어려워했고, 시험 문제가 튜토리얼보다 어려웠다는 의견도 있음."
    vi: "Người yếu toán thấy khó, một số nói đề thi khó hơn bài tutorial."
    ms: "Mereka yang lemah matematik rasa sukar, dan ada yang kata soalan peperiksaan lebih susah daripada tutorial."
    id: "Yang lemah matematika merasa sulit, dan ada yang bilang soal ujian lebih sulit dari latihan tutorial."
    hi: "जो मैथ्स में कमज़ोर थे उन्हें मुश्किल लगा, कुछ ने कहा एग्ज़ाम के सवाल ट्यूटोरियल से कठिन थे।"
  - en: "The experience varied a lot by semester and teaching team; the summer offering got better feedback in some reviews."
    zh: "体验因学期和教学团队差异很大，有评论认为夏季学期的口碑更好。"
    zh-TW: "體驗因學期和教學團隊差異很大，有評論認為夏季學期口碑更好。"
    ja: "学期や担当チームによって体験が大きく違う。夏学期の方が評判が良いという口コミもある。"
    ko: "학기와 교수진에 따라 경험 차이가 크며, 일부 후기에서는 여름학기 평가가 더 좋았음."
    vi: "Trải nghiệm khác nhau nhiều theo học kỳ và nhóm giảng dạy; một số đánh giá cho rằng kỳ hè tốt hơn."
    ms: "Pengalaman sangat berbeza mengikut semester dan pasukan pengajar; tawaran musim panas dapat maklum balas lebih baik dalam beberapa ulasan."
    id: "Pengalaman sangat bervariasi tergantung semester dan tim pengajar; beberapa ulasan menilai kelas musim panas lebih baik."
    hi: "अनुभव सेमेस्टर और टीचिंग टीम के हिसाब से काफ़ी बदला; कुछ रिव्यू में समर वाले ऑफ़रिंग को बेहतर फ़ीडबैक मिला।"
sections:
  content:
    - en: "Much more mathematical than intro micro: calculus, graphs and algebra applied the same way to different theory. Those strong in maths found an H1 achievable; others found it very hard."
      zh: "比入门微观数学得多：微积分、图像和代数，用同一套方法套不同理论。数学好的人觉得 H1 能拿；数学一般的人觉得很难。"
      zh-TW: "比入門個經數學得多：微積分、圖形和代數，用同一套方法套不同理論。數學好的人覺得 H1 拿得到；數學普通的人覺得很難。"
      ja: "入門ミクロよりずっと数学的。微積分・グラフ・代数を同じ手順で様々な理論に当てはめる。数学が得意ならH1も狙えるが、そうでないと非常に難しいという声。"
      ko: "입문 미시보다 훨씬 수학적이다. 미적분, 그래프, 대수를 같은 방식으로 여러 이론에 적용한다. 수학에 강하면 H1이 가능하고, 아니면 매우 어렵다는 평."
      vi: "Nặng toán hơn nhiều so với vi mô nhập môn: giải tích, đồ thị và đại số áp dụng cùng cách cho các lý thuyết khác nhau. Người giỏi toán thấy H1 khả thi; người khác thấy rất khó."
      ms: "Jauh lebih matematik dari mikro pengenalan: kalkulus, graf dan algebra digunakan dengan cara sama pada teori berbeza. Yang kuat matematik rasa H1 boleh dicapai; yang lain rasa sangat sukar."
      id: "Jauh lebih matematis dari mikro pengantar: kalkulus, grafik, dan aljabar dipakai dengan cara sama untuk teori berbeda. Yang kuat matematika merasa H1 bisa diraih; yang lain merasa sangat sulit."
      hi: "इंट्रो माइक्रो से कहीं ज़्यादा गणितीय: कैलकुलस, ग्राफ़ और अलजेब्रा अलग-अलग थ्योरी पर एक ही तरह लागू। मैथ्स में मज़बूत लोगों को H1 संभव लगा; बाकियों को बहुत कठिन।"
  work:
    - en: "Some found the exam doable with consistent study; others found it harder than tutorial maths, with tough multiple choice. One reviewer says understanding the theory, not the maths, was the hard part."
      zh: "有人觉得坚持学习考试就能应付；也有人觉得比 tutorial 的数学难，选择题也不简单。有一位同学说难点在理解理论而不是数学。"
      zh-TW: "有人覺得持續學習考試就能應付；也有人覺得比 tutorial 的數學難，選擇題也不簡單。有一位同學說難點在理解理論而不是數學。"
      ja: "継続して勉強すれば試験はこなせるという人も、チュートリアルより数学が難しく選択問題も手ごわいという人も。難しいのは数学より理論の理解だったという人が一人。"
      ko: "꾸준히 공부하면 시험은 할 만하다는 사람도, 튜토리얼보다 수학이 어렵고 객관식도 까다롭다는 사람도 있다. 어려운 건 수학보다 이론 이해였다는 리뷰어가 한 명."
      vi: "Có người thấy thi làm được nếu học đều; người khác thấy khó hơn toán trong tutorial, trắc nghiệm cũng khó. Một người nói khó là hiểu lý thuyết chứ không phải toán."
      ms: "Ada yang rasa peperiksaan boleh dibuat dengan belajar konsisten; ada yang rasa lebih sukar dari matematik tutorial, dengan aneka pilihan yang mencabar. Seorang kata memahami teori, bukan matematik, yang sukar."
      id: "Ada yang merasa ujian bisa dikerjakan dengan belajar konsisten; ada yang merasa lebih sulit dari matematika tutorial, dengan pilihan ganda yang berat. Satu reviewer bilang yang sulit memahami teorinya, bukan matematikanya."
      hi: "कुछ को नियमित पढ़ाई से परीक्षा संभव लगी; कुछ को ट्यूटोरियल से कठिन गणित और मुश्किल MCQ लगे। एक रिव्यूअर कहते हैं कठिन हिस्सा गणित नहीं, थ्योरी समझना था।"
  study:
    - en: "Make sure your calculus and algebra are solid before starting, and practise consistently through the semester."
      zh: "开课前先把微积分和代数打牢，整个学期持续练习。"
      zh-TW: "開課前先把微積分和代數打穩，整個學期持續練習。"
      ja: "始める前に微積分と代数を固め、学期中は継続して練習しよう。"
      ko: "시작 전에 미적분과 대수를 탄탄히 하고, 학기 내내 꾸준히 연습하자."
      vi: "Củng cố giải tích và đại số trước khi học, và luyện đều suốt học kỳ."
      ms: "Pastikan kalkulus dan algebra kukuh sebelum mula, dan berlatih secara konsisten sepanjang semester."
      id: "Pastikan kalkulus dan aljabar kuat sebelum mulai, dan latihan rutin sepanjang semester."
      hi: "शुरू करने से पहले कैलकुलस और अलजेब्रा मज़बूत करें, और पूरे सेमेस्टर लगातार प्रैक्टिस करें।"
  watch:
    - en: "The reviews are all from 2021 or earlier, so the subject may have changed. Several older reviews say the experience depended heavily on who taught it."
      zh: "评价全部来自 2021 年或更早，课程可能已经变了。好几条旧评价说体验很看授课老师。"
      zh-TW: "評價全部來自 2021 年或更早，課程可能已經改變。好幾則舊評價說體驗很看授課老師。"
      ja: "レビューはすべて2021年以前のもので、内容が変わっている可能性がある。古いレビューの複数が、経験は担当者次第だったと言う。"
      ko: "리뷰가 모두 2021년 이전 것이라 과목이 바뀌었을 수 있다. 예전 리뷰 여럿은 경험이 담당 강사에 크게 좌우됐다고 한다."
      vi: "Các đánh giá đều từ 2021 trở về trước, nên môn có thể đã thay đổi. Vài đánh giá cũ nói trải nghiệm phụ thuộc nhiều vào người dạy."
      ms: "Semua ulasan dari 2021 atau lebih awal, jadi subjek mungkin telah berubah. Beberapa ulasan lama kata pengalaman banyak bergantung pada pengajar."
      id: "Semua ulasan dari 2021 atau sebelumnya, jadi mata kuliahnya mungkin sudah berubah. Beberapa ulasan lama bilang pengalamannya sangat tergantung pengajar."
      hi: "सारे रिव्यू 2021 या उससे पहले के हैं, इसलिए विषय बदल चुका हो सकता है। कई पुराने रिव्यू कहते हैं अनुभव पढ़ाने वाले पर बहुत निर्भर था।"
difficulty: mixed
