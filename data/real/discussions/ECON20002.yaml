points:
  - en: "Heavily maths-based (calculus, algebra, graphs); students comfortable with maths say an H1 is achievable."
    zh: "以数学为主（微积分、代数、图像），数学好的学生认为拿H1不难。"
    zh-TW: "以數學為主（微積分、代數、圖形），數學好的學生認為拿H1不難。"
    ja: "数学中心（微積分、代数、グラフ）。数学が得意な学生はH1も取れると言う。"
    ko: "미적분, 대수, 그래프 등 수학 위주이며, 수학에 자신 있는 학생들은 H1도 가능하다고 함."
    vi: "Nặng về toán (giải tích, đại số, đồ thị); sinh viên giỏi toán nói đạt H1 là khả thi."
    ms: "Banyak berasaskan matematik (kalkulus, algebra, graf); pelajar yang selesa dengan matematik kata H1 boleh dicapai."
    id: "Sangat berbasis matematika (kalkulus, aljabar, grafik); mahasiswa yang nyaman dengan matematika bilang H1 bisa dicapai."
    hi: "ज़्यादातर मैथ्स पर आधारित (कैलकुलस, अलजेब्रा, ग्राफ़); मैथ्स में सहज स्टूडेंट्स कहते हैं H1 मिल सकता है।"
  - en: "Those weaker at maths found it hard, and some said exam questions were tougher than tutorial work."
    zh: "数学较弱的学生觉得很难，有人反映考试题比辅导课练习更难。"
    zh-TW: "數學較弱的學生覺得很難，有人反映考題比小組課練習更難。"
    ja: "数学が苦手な人には難しく、試験問題はチュートリアルより難しかったという声も。"
    ko: "수학이 약한 학생들은 어려워했고, 시험 문제가 튜토리얼보다 어려웠다는 의견도 있음."
    vi: "Người yếu toán thấy khó, một số nói đề thi khó hơn bài tutorial."
    ms: "Mereka yang lemah matematik rasa sukar, dan ada yang kata soalan peperiksaan lebih susah daripada tutorial."
    id: "Yang lemah matematika merasa sulit, dan ada yang bilang soal ujian lebih sulit dari latihan tutorial."
    hi: "जो मैथ्स में कमज़ोर थे उन्हें मुश्किल लगा, कुछ ने कहा एग्ज़ाम के सवाल ट्यूटोरियल से कठिन थे।"
  - en: "The experience varied a lot by semester and teaching team; the summer offering got better feedback in some reviews."
    zh: "体验因学期和教学团队差异很大，有评论认为夏季学期的口碑更好。"
    zh-TW: "體驗因學期和教學團隊差異很大，有評論認為夏季學期口碑更好。"
    ja: "学期や担当チームによって体験が大きく違う。夏学期の方が評判が良いという口コミもある。"
    ko: "학기와 교수진에 따라 경험 차이가 크며, 일부 후기에서는 여름학기 평가가 더 좋았음."
    vi: "Trải nghiệm khác nhau nhiều theo học kỳ và nhóm giảng dạy; một số đánh giá cho rằng kỳ hè tốt hơn."
    ms: "Pengalaman sangat berbeza mengikut semester dan pasukan pengajar; tawaran musim panas dapat maklum balas lebih baik dalam beberapa ulasan."
    id: "Pengalaman sangat bervariasi tergantung semester dan tim pengajar; beberapa ulasan menilai kelas musim panas lebih baik."
    hi: "अनुभव सेमेस्टर और टीचिंग टीम के हिसाब से काफ़ी बदला; कुछ रिव्यू में समर वाले ऑफ़रिंग को बेहतर फ़ीडबैक मिला।"
difficulty: mixed
