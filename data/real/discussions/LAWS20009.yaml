points:
  - en: "Reviewers found the topics interesting and the tutorials the best part, but some lecture content and readings felt unfocused."
    zh: "评价认为主题有意思、辅导课最好，但部分讲座内容和阅读材料显得松散。"
    zh-TW: "評價認為主題有意思、輔導課最好，但部分講座內容和閱讀材料顯得鬆散。"
    ja: "テーマは面白くチュートリアルが一番良いが、講義内容や文献にはまとまりのないものもあるとの声。"
    ko: "주제는 흥미롭고 튜토리얼이 가장 좋았지만, 일부 강의와 읽기 자료는 산만했다는 평."
    vi: "Người học thấy chủ đề thú vị, tutorial là phần hay nhất, nhưng một số bài giảng và tài liệu thiếu trọng tâm."
    ms: "Pengulas dapati topik menarik dan tutorial terbaik, tetapi sebahagian kuliah dan bacaan kurang fokus."
    id: "Pengulas menilai topiknya menarik dan tutorial terbaik, tetapi sebagian kuliah dan bacaan kurang fokus."
    hi: "समीक्षकों को विषय रोचक और ट्यूटोरियल सबसे अच्छे लगे, पर कुछ लेक्चर और रीडिंग बिखरे हुए लगे।"
  - en: "The final task is long and heavily weighted, and marking criteria felt unclear to some; the latest reviewer did well but wouldn't take it again."
    zh: "期末任务篇幅长、占分重，有人觉得评分标准不清楚；最新的评价者成绩不错，但不会再选。"
    zh-TW: "期末任務篇幅長、占分重，有人覺得評分標準不清楚；最新的評價者成績不錯，但不會再選。"
    ja: "最終課題は長く配点も大きく、採点基準が不明確との声も。最新の評者は好成績だったが再履修はしないと。"
    ko: "기말 과제는 길고 비중이 크며 채점 기준이 불명확하다는 의견도. 최근 후기 작성자는 성적은 좋았지만 다시 듣진 않겠다고."
    vi: "Bài cuối dài và chiếm nhiều điểm, có người thấy tiêu chí chấm mơ hồ; người đánh giá gần nhất đạt điểm tốt nhưng không học lại."
    ms: "Tugasan akhir panjang dan berwajaran tinggi, kriteria kurang jelas; pengulas terkini dapat markah baik tetapi tidak akan ulang."
    id: "Tugas akhir panjang dan bobotnya besar, kriteria dinilai kurang jelas; pengulas terbaru bernilai baik tapi tak mau ulang."
    hi: "अंतिम काम लंबा और भारी अंकों वाला है, कुछ को मानदंड अस्पष्ट लगे; हाल के समीक्षक के अंक अच्छे थे पर दोबारा नहीं लेंगे।"
  - en: "Best suited to people keen on environmental law or thinking about law later; be ready to cite and apply cases."
    zh: "最适合对环境法感兴趣或以后想读法律的人；要准备好引用并运用案例。"
    zh-TW: "最適合對環境法感興趣或以後想讀法律的人；要準備好引用並運用案例。"
    ja: "環境法に関心がある人や将来法律を学びたい人向け。判例を引用し当てはめる準備が必要。"
    ko: "환경법에 관심 있거나 나중에 법을 공부할 사람에게 적합. 판례를 인용하고 적용할 준비 필요."
    vi: "Hợp nhất với ai mê luật môi trường hoặc định học luật sau này; cần sẵn sàng trích dẫn và áp dụng án lệ."
    ms: "Paling sesuai bagi yang minat undang-undang alam sekitar; bersedia memetik dan mengaplikasi kes."
    id: "Paling cocok bagi yang tertarik hukum lingkungan atau ingin kuliah hukum; siap mengutip dan menerapkan kasus."
    hi: "पर्यावरण कानून में रुचि या आगे कानून पढ़ने वालों के लिए सबसे उपयुक्त; केस उद्धृत और लागू करने को तैयार रहें।"
workload: heavy
difficulty: mixed
