code: CRIM30006
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/crim30006
reviews: 8
from: 2019
to: 2024
checked: 2026-10-17
points:
  - en: "You apply criminology theory to film and TV. Most reviewers (2019-2022) loved it as a fresh break from reading-heavy criminology subjects, with lots of creative freedom in the essays."
    zh: "这门课用犯罪学理论分析电影和电视剧。多数评论者（2019-2022）很喜欢，觉得它让人从阅读繁重的犯罪学课程中解脱，论文有很大创作自由。"
    zh-TW: "這門課用犯罪學理論分析電影和電視劇。多數評論者（2019-2022）很喜歡，覺得它讓人從閱讀繁重的犯罪學課程中解脫，論文有很大創作自由。"
    ja: "犯罪学の理論を映画やテレビに当てはめる科目。多くのレビュー（2019-2022）は、文献の多い犯罪学科目からの新鮮な息抜きとして気に入り、エッセイの自由度も高いとした。"
    ko: "범죄학 이론을 영화·TV에 적용하는 과목. 대부분 리뷰(2019-2022)는 읽기 많은 범죄학 과목 사이의 신선한 휴식이라며 좋아했고 에세이 자유도가 높다고 함."
    vi: "Môn áp dụng lý thuyết tội phạm học vào phim và truyền hình. Đa số người đánh giá (2019-2022) rất thích vì mới mẻ so với các môn tội phạm học nặng bài đọc, bài luận rất tự do sáng tạo."
    ms: "Anda gunakan teori kriminologi pada filem dan TV. Kebanyakan pengulas (2019-2022) sangat suka kerana segar berbanding subjek kriminologi yang berat bacaan, dengan kebebasan kreatif dalam esei."
    id: "Teori kriminologi diterapkan pada film dan TV. Kebanyakan pengulas (2019-2022) sangat suka karena segar dibanding mata kuliah kriminologi yang berat bacaan, dengan kebebasan kreatif di esai."
    hi: "इसमें क्रिमिनोलॉजी सिद्धांतों को फ़िल्म और टीवी पर लागू करते हैं। ज़्यादातर रिव्यूअर्स (2019-2022) को यह रीडिंग-भारी क्रिमिनोलॉजी विषयों से ताज़ा बदलाव लगा, निबंधों में रचनात्मक आज़ादी के साथ।"
  - en: "The 2023-2024 reviews were more critical: vague essay briefs, dry lectures, and a hard balance between film analysis and criminology research made high marks tough."
    zh: "2023-2024年的评论更挑剔：论文要求模糊、讲座枯燥，电影分析与犯罪学研究难以平衡，高分不易。"
    zh-TW: "2023-2024年的評論更挑剔：論文要求模糊、講座枯燥，電影分析與犯罪學研究難以平衡，高分不易。"
    ja: "2023-2024年のレビューはより批判的。エッセイ課題の説明が曖昧、講義が退屈で、映画分析と犯罪学研究の両立が難しく高得点は取りにくいという。"
    ko: "2023-2024년 리뷰는 더 비판적. 에세이 안내가 모호하고 강의가 지루하며, 영화 분석과 범죄학 연구의 균형이 어려워 고득점이 힘들다고 함."
    vi: "Đánh giá 2023-2024 khắt khe hơn: yêu cầu bài luận mơ hồ, bài giảng khô khan, khó cân bằng giữa phân tích phim và nghiên cứu tội phạm học nên khó đạt điểm cao."
    ms: "Ulasan 2023-2024 lebih kritis: taklimat esei kabur, kuliah hambar, dan sukar mengimbangi analisis filem dengan penyelidikan kriminologi, jadi markah tinggi sukar."
    id: "Ulasan 2023-2024 lebih kritis: arahan esai kabur, kuliah kering, dan sulit menyeimbangkan analisis film dengan riset kriminologi sehingga nilai tinggi sulit."
    hi: "2023-2024 के रिव्यू ज़्यादा आलोचनात्मक थे: निबंध के निर्देश अस्पष्ट, लेक्चर नीरस, और फ़िल्म विश्लेषण व क्रिमिनोलॉजी रिसर्च के बीच संतुलन मुश्किल, इसलिए ऊँचे अंक कठिन।"
  - en: "It suits criminology majors who enjoy film most; one non-major found it confusing and poorly structured."
    zh: "最适合喜欢电影的犯罪学专业学生；一位非本专业学生觉得课程混乱、结构差。"
    zh-TW: "最適合喜歡電影的犯罪學主修學生；一位非本主修學生覺得課程混亂、結構差。"
    ja: "映画好きの犯罪学専攻に最も向く。専攻外の1人は混乱していて構成が悪いと感じた。"
    ko: "영화를 좋아하는 범죄학 전공자에게 가장 적합. 비전공자 한 명은 혼란스럽고 구성이 부실하다고 느낌."
    vi: "Phù hợp nhất với sinh viên chuyên ngành tội phạm học thích phim; một người không học chuyên ngành thấy môn rối và thiếu cấu trúc."
    ms: "Paling sesuai untuk pelajar major kriminologi yang suka filem; seorang bukan major dapati ia mengelirukan dan kurang tersusun."
    id: "Paling cocok untuk mahasiswa jurusan kriminologi yang suka film; seorang non-jurusan merasa membingungkan dan kurang terstruktur."
    hi: "यह फ़िल्म पसंद करने वाले क्रिमिनोलॉजी मेजर के लिए सबसे उपयुक्त है; एक नॉन-मेजर को यह उलझा और ख़राब ढाँचे वाला लगा।"
