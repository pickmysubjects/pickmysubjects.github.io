code: DEVT10001
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/devt10001
reviews: 9
from: 2017
to: 2022
checked: 2026-10-17
points:
  - en: "Reviewers from 2017 to 2022 found the content eye-opening and the lectures and tutorials engaging, with plenty of discussion and debate."
    zh: "2017到2022年的评论者都觉得内容让人大开眼界，讲课和辅导课都很吸引人，讨论和辩论很多。"
    zh-TW: "2017到2022年的評論者都覺得內容讓人大開眼界，講課和輔導課都很吸引人，討論和辯論很多。"
    ja: "2017〜2022年のレビューは、内容が視野を広げてくれ、講義もチュートリアルも面白く、議論やディベートが多いと評価。"
    ko: "2017~2022년 리뷰는 내용이 시야를 넓혀 주고 강의와 튜토리얼이 흥미로우며 토론과 논쟁이 많다고 평가."
    vi: "Người đánh giá từ 2017 đến 2022 thấy nội dung mở mang tầm mắt, bài giảng và tutorial cuốn hút, nhiều thảo luận và tranh biện."
    ms: "Pengulas dari 2017 hingga 2022 mendapati kandungannya membuka mata, serta kuliah dan tutorial yang menarik dengan banyak perbincangan dan perdebatan."
    id: "Pengulas 2017 sampai 2022 merasa isinya membuka wawasan, kuliah dan tutorialnya menarik, dengan banyak diskusi dan debat."
    hi: "2017 से 2022 तक के रिव्यूअर्स को सामग्री आँखें खोलने वाली और लेक्चर व ट्यूटोरियल दिलचस्प लगे, जिनमें चर्चा और बहस भरपूर होती है।"
  - en: "Assessment is essay-based with a wide choice of topics, starting with a graded essay plan; in 2022 there was also a tutorial presentation and no exam."
    zh: "考核以论文为主，选题范围很广，第一项是计分的论文提纲；2022年还有一次辅导课演讲，没有考试。"
    zh-TW: "評量以論文為主，選題範圍很廣，第一項是計分的論文大綱；2022年還有一次輔導課簡報，沒有考試。"
    ja: "評価はエッセイ中心でテーマの選択肢が広く、最初は採点対象のエッセイ構成案から。2022年はチュートリアルでの発表もあり、試験はなかった。"
    ko: "평가는 에세이 위주이고 주제 선택 폭이 넓으며, 첫 과제는 점수에 들어가는 에세이 개요. 2022년엔 튜토리얼 발표도 있었고 시험은 없었음."
    vi: "Đánh giá chủ yếu là tiểu luận với nhiều đề để chọn, bắt đầu bằng dàn ý có chấm điểm; năm 2022 còn có thuyết trình ở tutorial và không có thi."
    ms: "Penilaian berasaskan esei dengan pilihan topik yang luas, bermula dengan rangka esei yang dimarkah; pada 2022 ada juga pembentangan tutorial dan tiada peperiksaan."
    id: "Penilaian berbasis esai dengan pilihan topik luas, diawali kerangka esai yang dinilai; di 2022 juga ada presentasi tutorial dan tanpa ujian."
    hi: "आकलन निबंधों पर आधारित है और विषय चुनने की काफ़ी छूट है, शुरुआत एक अंकित निबंध-रूपरेखा से होती है; 2022 में ट्यूटोरियल प्रेज़ेंटेशन भी थी और कोई एग्ज़ाम नहीं था।"
  - en: "Several 2020–2021 reviewers felt marking was harsh and feedback vague, and one wanted more guidance on assessments; this seems to depend on your tutor."
    zh: "2020–2021年有好几位评论者觉得评分严、反馈笼统，也有人希望作业有更多指导；这似乎取决于你的辅导老师。"
    zh-TW: "2020–2021年有好幾位評論者覺得評分嚴、回饋籠統，也有人希望作業有更多指導；這似乎取決於你的輔導老師。"
    ja: "2020〜2021年には採点が厳しくフィードバックが曖昧だという声が複数あり、課題への指導がもっと欲しいという人も。担当チューターによるようだ。"
    ko: "2020~2021년엔 채점이 박하고 피드백이 모호하다는 리뷰가 여럿, 과제 안내가 더 필요하다는 의견도 있음. 튜터에 따라 다른 듯."
    vi: "Một số người đánh giá năm 2020–2021 thấy chấm điểm khắt khe và nhận xét chung chung, một người muốn hướng dẫn bài tập rõ hơn; có vẻ tùy tutor."
    ms: "Beberapa pengulas 2020–2021 rasa pemarkahan ketat dan maklum balas kabur, dan seorang mahukan lebih panduan untuk tugasan; ini nampaknya bergantung pada tutor anda."
    id: "Beberapa pengulas 2020–2021 merasa penilaiannya ketat dan umpan baliknya samar, dan satu orang ingin panduan tugas lebih banyak; tampaknya tergantung tutor."
    hi: "2020–2021 के कई रिव्यूअर्स को मार्किंग सख़्त और फ़ीडबैक अस्पष्ट लगा, और एक को असाइनमेंट पर और मार्गदर्शन चाहिए था; यह शायद आपके ट्यूटर पर निर्भर करता है।"
