code: DEVT10001
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/devt10001
reviews: 9
from: 2017
to: 2022
checked: 2026-10-17
points:
  - en: "Reviewers from 2017 to 2022 found the content eye-opening and the lectures and tutorials engaging, with plenty of discussion and debate."
    zh: "2017到2022年的评论者都觉得内容让人大开眼界，讲课和辅导课都很吸引人，讨论和辩论很多。"
    zh-TW: "2017到2022年的評論者都覺得內容讓人大開眼界，講課和輔導課都很吸引人，討論和辯論很多。"
    ja: "2017〜2022年のレビューは、内容が視野を広げてくれ、講義もチュートリアルも面白く、議論やディベートが多いと評価。"
    ko: "2017~2022년 리뷰는 내용이 시야를 넓혀 주고 강의와 튜토리얼이 흥미로우며 토론과 논쟁이 많다고 평가."
    vi: "Người đánh giá từ 2017 đến 2022 thấy nội dung mở mang tầm mắt, bài giảng và tutorial cuốn hút, nhiều thảo luận và tranh biện."
    ms: "Pengulas dari 2017 hingga 2022 mendapati kandungannya membuka mata, serta kuliah dan tutorial yang menarik dengan banyak perbincangan dan perdebatan."
    id: "Pengulas 2017 sampai 2022 merasa isinya membuka wawasan, kuliah dan tutorialnya menarik, dengan banyak diskusi dan debat."
    hi: "2017 से 2022 तक के रिव्यूअर्स को सामग्री आँखें खोलने वाली और लेक्चर व ट्यूटोरियल दिलचस्प लगे, जिनमें चर्चा और बहस भरपूर होती है।"
  - en: "Assessment is essay-based with a wide choice of topics, starting with a graded essay plan; in 2022 there was also a tutorial presentation and no exam."
    zh: "考核以论文为主，选题范围很广，第一项是计分的论文提纲；2022年还有一次辅导课演讲，没有考试。"
    zh-TW: "評量以論文為主，選題範圍很廣，第一項是計分的論文大綱；2022年還有一次輔導課簡報，沒有考試。"
    ja: "評価はエッセイ中心でテーマの選択肢が広く、最初は採点対象のエッセイ構成案から。2022年はチュートリアルでの発表もあり、試験はなかった。"
    ko: "평가는 에세이 위주이고 주제 선택 폭이 넓으며, 첫 과제는 점수에 들어가는 에세이 개요. 2022년엔 튜토리얼 발표도 있었고 시험은 없었음."
    vi: "Đánh giá chủ yếu là tiểu luận với nhiều đề để chọn, bắt đầu bằng dàn ý có chấm điểm; năm 2022 còn có thuyết trình ở tutorial và không có thi."
    ms: "Penilaian berasaskan esei dengan pilihan topik yang luas, bermula dengan rangka esei yang dimarkah; pada 2022 ada juga pembentangan tutorial dan tiada peperiksaan."
    id: "Penilaian berbasis esai dengan pilihan topik luas, diawali kerangka esai yang dinilai; di 2022 juga ada presentasi tutorial dan tanpa ujian."
    hi: "आकलन निबंधों पर आधारित है और विषय चुनने की काफ़ी छूट है, शुरुआत एक अंकित निबंध-रूपरेखा से होती है; 2022 में ट्यूटोरियल प्रेज़ेंटेशन भी थी और कोई एग्ज़ाम नहीं था।"
  - en: "Several 2020–2021 reviewers felt marking was harsh and feedback vague, and one wanted more guidance on assessments; this seems to depend on your tutor."
    zh: "2020–2021年有好几位评论者觉得评分严、反馈笼统，也有人希望作业有更多指导；这似乎取决于你的辅导老师。"
    zh-TW: "2020–2021年有好幾位評論者覺得評分嚴、回饋籠統，也有人希望作業有更多指導；這似乎取決於你的輔導老師。"
    ja: "2020〜2021年には採点が厳しくフィードバックが曖昧だという声が複数あり、課題への指導がもっと欲しいという人も。担当チューターによるようだ。"
    ko: "2020~2021년엔 채점이 박하고 피드백이 모호하다는 리뷰가 여럿, 과제 안내가 더 필요하다는 의견도 있음. 튜터에 따라 다른 듯."
    vi: "Một số người đánh giá năm 2020–2021 thấy chấm điểm khắt khe và nhận xét chung chung, một người muốn hướng dẫn bài tập rõ hơn; có vẻ tùy tutor."
    ms: "Beberapa pengulas 2020–2021 rasa pemarkahan ketat dan maklum balas kabur, dan seorang mahukan lebih panduan untuk tugasan; ini nampaknya bergantung pada tutor anda."
    id: "Beberapa pengulas 2020–2021 merasa penilaiannya ketat dan umpan baliknya samar, dan satu orang ingin panduan tugas lebih banyak; tampaknya tergantung tutor."
    hi: "2020–2021 के कई रिव्यूअर्स को मार्किंग सख़्त और फ़ीडबैक अस्पष्ट लगा, और एक को असाइनमेंट पर और मार्गदर्शन चाहिए था; यह शायद आपके ट्यूटर पर निर्भर करता है।"
sections:
  content:
    - en: "Reviewers found the content eye-opening and well linked, with engaging lectures and tutorials full of discussion and debate. Recommended for social science, geography or as a breadth."
      zh: "同学觉得内容让人开眼界、前后衔接好，讲课有趣，tutorial 讨论和辩论很多。推荐给社科、地理方向或当 breadth 修。"
      zh-TW: "同學覺得內容讓人大開眼界、前後連貫，上課有趣，tutorial 討論和辯論很多。推薦給社科、地理方向或當 breadth 修。"
      ja: "内容は視野が広がり、つながりも良いという声。講義は面白く、チュートリアルは議論やディベートが多い。社会科学や地理、ブレドスにおすすめ。"
      ko: "내용이 시야를 넓혀 주고 잘 연결되며, 강의가 흥미롭고 튜토리얼엔 토론이 많다는 평. 사회과학, 지리 전공이나 브레드스로 추천한다."
      vi: "Người học thấy nội dung mở mang tầm mắt và liên kết tốt, bài giảng cuốn hút, tutorial nhiều thảo luận và tranh luận. Phù hợp cho khoa học xã hội, địa lý hoặc làm breadth."
      ms: "Pengulas dapati kandungan membuka mata dan saling berkait, dengan kuliah menarik dan tutorial penuh perbincangan dan debat. Disyorkan untuk sains sosial, geografi atau breadth."
      id: "Pengulas merasa materinya membuka wawasan dan saling terkait, dengan kuliah menarik dan tutorial penuh diskusi dan debat. Cocok untuk ilmu sosial, geografi atau sebagai breadth."
      hi: "रिव्यूअर्स को कंटेंट आँखें खोलने वाला और अच्छी तरह जुड़ा लगा, लेक्चर रोचक और ट्यूटोरियल में चर्चा व बहस भरपूर। सामाजिक विज्ञान, भूगोल या ब्रेड्थ के लिए सुझाया गया।"
  work:
    - en: "No exam: an essay plan with peer feedback, a tutorial presentation and a final essay, with a wide choice of topics. Several found the marking harsh and feedback vague."
      zh: "没有考试：一份有同伴互评的论文大纲、一次 tutorial 展示和期末论文，题目可选范围很广。好几位觉得给分严、反馈含糊。"
      zh-TW: "沒有考試：一份有同儕互評的論文大綱、一次 tutorial 報告和期末論文，題目可選範圍很廣。好幾位覺得給分嚴、回饋含糊。"
      ja: "試験なし。相互フィードバック付きのエッセイ計画、チュートリアル発表、最終エッセイで、テーマの選択肢は幅広い。採点が厳しくフィードバックが曖昧という声が複数。"
      ko: "시험은 없고, 동료 피드백이 있는 에세이 계획서, 튜토리얼 발표, 기말 에세이가 있으며 주제 선택 폭이 넓다. 채점이 박하고 피드백이 모호하다는 의견이 여럿."
      vi: "Không thi: dàn ý tiểu luận có góp ý chéo, thuyết trình tutorial và tiểu luận cuối kỳ, nhiều chủ đề để chọn. Vài người thấy chấm gắt và phản hồi mơ hồ."
      ms: "Tiada peperiksaan: rangka esei dengan maklum balas rakan, pembentangan tutorial dan esei akhir, dengan banyak pilihan topik. Beberapa rasa pemarkahan keras dan maklum balas kabur."
      id: "Tanpa ujian: rencana esai dengan umpan balik teman, presentasi tutorial dan esai akhir, dengan banyak pilihan topik. Beberapa merasa penilaiannya keras dan umpan baliknya kabur."
      hi: "कोई परीक्षा नहीं: साथियों की राय वाला निबंध प्लान, ट्यूटोरियल प्रेज़ेंटेशन और फ़ाइनल निबंध, विषयों के कई विकल्प। कई को मार्किंग सख़्त और फ़ीडबैक अस्पष्ट लगा।"
  study:
    - en: "One reviewer advises a clear argument in essays, and for the presentation a single visual slide, cue cards rather than a phone, and use of the topic readings."
      zh: "有同学建议论文要论点清楚；展示时只放一张图片幻灯片，拿提示卡而不是手机，并结合该主题的阅读材料。"
      zh-TW: "有同學建議論文要論點清楚；報告時只放一張圖片投影片，拿提示卡而不是手機，並結合該主題的閱讀資料。"
      ja: "エッセイは主張を明確に。発表は画像スライド1枚、スマホではなく手元カードを使い、テーマのリーディングに触れるとよいという声が一つ。"
      ko: "에세이는 주장을 분명히 하고, 발표는 시각 자료 슬라이드 한 장에 휴대폰 대신 큐카드를 쓰며 해당 주제 읽기 자료를 활용하라는 조언이 있다."
      vi: "Một người khuyên tiểu luận cần lập luận rõ; khi thuyết trình dùng một slide hình ảnh, cầm thẻ ghi chú thay vì điện thoại, và dùng bài đọc của chủ đề."
      ms: "Seorang pengulas sarankan hujah jelas dalam esei, dan untuk pembentangan satu slaid visual, kad isyarat bukan telefon, serta guna bacaan topik."
      id: "Satu pengulas menyarankan argumen yang jelas di esai, dan untuk presentasi satu slide visual, kartu catatan alih-alih ponsel, serta memakai bacaan topik."
      hi: "एक रिव्यूअर सलाह देते हैं कि निबंध में साफ़ तर्क हो, और प्रेज़ेंटेशन में एक विज़ुअल स्लाइड, फ़ोन के बजाय क्यू कार्ड, और टॉपिक की रीडिंग का इस्तेमाल हो।"
  watch:
    - en: "All these reviews are from 2022 or earlier; teaching and assessment may have changed since."
      zh: "这些评价都是 2022 年或更早的，现在的教法和考核可能已经变了。"
      zh-TW: "這些評價都是 2022 年或更早的，現在的教法和考核可能已經變了。"
      ja: "レビューはすべて2022年以前のもの。授業や評価は変わっている可能性がある。"
      ko: "모든 리뷰가 2022년 이전 것이라 지금 수업과 평가는 달라졌을 수 있다."
      vi: "Tất cả đánh giá đều từ năm 2022 trở về trước; cách dạy và đánh giá có thể đã thay đổi."
      ms: "Semua ulasan ini dari 2022 atau lebih awal; pengajaran dan penilaian mungkin telah berubah."
      id: "Semua ulasan ini dari 2022 atau sebelumnya; pengajaran dan penilaian mungkin sudah berubah."
      hi: "ये सभी रिव्यू 2022 या उससे पहले के हैं; पढ़ाई और मूल्यांकन अब बदल चुके हो सकते हैं।"
