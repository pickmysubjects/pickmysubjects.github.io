points:
  - en: "Theory-based international relations with a lot of reading; a 2023 reviewer advises doing the level 1 international politics subject first."
    zh: "偏理论的国际关系课，阅读量大；一位2023年的评论者建议先修一年级的国际政治课。"
    zh-TW: "偏理論的國際關係課，閱讀量大；一位2023年的評論者建議先修一年級的國際政治課。"
    ja: "理論中心の国際関係論で文献が多い。2023年のレビューは先に1年次の国際政治科目を取るよう勧めている。"
    ko: "이론 중심 국제관계학으로 읽을 양이 많음. 2023년 리뷰어는 1학년 국제정치 과목을 먼저 들으라고 조언."
    vi: "Quan hệ quốc tế thiên lý thuyết với nhiều bài đọc; một người năm 2023 khuyên học môn chính trị quốc tế năm nhất trước."
    ms: "Hubungan antarabangsa berasaskan teori dengan banyak bacaan; seorang pengulas 2023 cadangkan ambil subjek politik antarabangsa tahap 1 dahulu."
    id: "Hubungan internasional berbasis teori dengan banyak bacaan; seorang pengulas 2023 menyarankan mengambil mata kuliah politik internasional level 1 lebih dulu."
    hi: "सिद्धांत-आधारित अंतरराष्ट्रीय संबंध, बहुत सारी रीडिंग के साथ; 2023 के एक रिव्यूअर ने पहले लेवल 1 का अंतरराष्ट्रीय राजनीति विषय लेने की सलाह दी।"
  - en: "2019-2020 reviewers described poor organisation and little assessment guidance, while others enjoyed the weekly key questions and wide essay choice."
    zh: "2019-2020年的评论者说课程组织差、考核指导少，也有人喜欢每周的核心问题和丰富的论文选题。"
    zh-TW: "2019-2020年的評論者說課程組織差、考核指導少，也有人喜歡每週的核心問題和豐富的論文選題。"
    ja: "2019-2020年のレビューは運営がまとまらず評価についての指導も少ないとしたが、毎週の中心的な問いや幅広いエッセイ課題を楽しんだ人もいる。"
    ko: "2019-2020년 리뷰는 운영이 부실하고 평가 안내가 적다고 했지만, 매주 핵심 질문과 다양한 에세이 선택지를 즐긴 사람도 있음."
    vi: "Người đánh giá 2019-2020 mô tả môn tổ chức kém và ít hướng dẫn đánh giá, trong khi người khác thích các câu hỏi trọng tâm hằng tuần và nhiều lựa chọn đề luận."
    ms: "Pengulas 2019-2020 menyatakan organisasi lemah dan sedikit panduan penilaian, manakala yang lain suka soalan utama mingguan dan pilihan esei yang luas."
    id: "Pengulas 2019-2020 menggambarkan pengelolaan buruk dan minim panduan penilaian, sementara yang lain menikmati pertanyaan kunci mingguan dan pilihan esai yang luas."
    hi: "2019-2020 के रिव्यूअर्स ने ख़राब व्यवस्था और असेसमेंट पर कम मार्गदर्शन बताया, जबकि दूसरों को हर हफ़्ते के मुख्य सवाल और निबंध के व्यापक विकल्प पसंद आए।"
