points:
  - en: "All three 2022 reviewers loved it but called it very challenging: it goes deep into complex grammar of Australian languages and assumes solid Syntax and Phonetics."
    zh: "三位2022年的评论者都很喜欢，但都说非常有挑战性：深入讲澳大利亚原住民语言的复杂语法，默认你已扎实掌握句法学和语音学。"
    zh-TW: "三位2022年的評論者都很喜歡，但都說非常有挑戰性：深入講澳洲原住民語言的複雜語法，預設你已紮實掌握句法學和語音學。"
    ja: "2022年の3人全員が気に入ったが、非常に難しいとした。オーストラリア先住民言語の複雑な文法を深く扱い、統語論と音声学の確かな知識が前提。"
    ko: "2022년 리뷰어 3명 모두 매우 좋아했지만 아주 어렵다고 함. 호주 원주민 언어의 복잡한 문법을 깊이 다루며 통사론·음성학 기초를 전제로 함."
    vi: "Cả ba người năm 2022 đều rất thích nhưng nói môn rất khó: đi sâu vào ngữ pháp phức tạp của các ngôn ngữ bản địa Úc, đòi hỏi nền Cú pháp và Ngữ âm vững."
    ms: "Ketiga-tiga pengulas 2022 sangat suka tetapi kata ia sangat mencabar: mendalami tatabahasa kompleks bahasa Australia dan mengandaikan asas Sintaksis dan Fonetik yang kukuh."
    id: "Ketiga pengulas 2022 sangat suka tapi menyebutnya sangat menantang: membahas mendalam tata bahasa kompleks bahasa-bahasa Australia dan mengandaikan dasar Sintaksis dan Fonetik yang kuat."
    hi: "2022 के तीनों रिव्यूअर्स को यह बहुत पसंद आया पर बहुत चुनौतीपूर्ण बताया: यह ऑस्ट्रेलियाई भाषाओं के जटिल व्याकरण में गहराई से जाता है और मज़बूत सिंटैक्स व फ़ोनेटिक्स मानकर चलता है।"
  - en: "You follow one language's grammar through the semester. Problem-solving assignments were called fun, and the final essay offers a choice of topics. Students wanted more tutorial time."
    zh: "整个学期跟随一种语言的语法描述学习。解题式作业被认为有趣，期末论文可选题目。学生希望辅导课时间更长。"
    zh-TW: "整個學期跟隨一種語言的語法描述學習。解題式作業被認為有趣，期末論文可選題目。學生希望輔導課時間更長。"
    ja: "学期を通して1つの言語の文法記述を追う。問題解決型の課題は楽しいとされ、期末エッセイはテーマを選べる。チュートリアルの時間をもっと欲しいという声も。"
    ko: "한 학기 동안 한 언어의 문법 기술을 따라감. 문제 풀이형 과제는 재미있다는 평이고 기말 에세이는 주제를 고를 수 있음. 튜토리얼 시간이 더 있었으면 한다는 의견도."
    vi: "Bạn theo dõi ngữ pháp của một ngôn ngữ suốt học kỳ. Bài tập giải quyết vấn đề được khen là vui, bài luận cuối có nhiều đề để chọn. Sinh viên muốn thêm thời gian tutorial."
    ms: "Anda mengikuti tatabahasa satu bahasa sepanjang semester. Tugasan penyelesaian masalah dikatakan seronok, dan esei akhir ada pilihan topik. Pelajar mahu lebih masa tutorial."
    id: "Kamu mengikuti tata bahasa satu bahasa sepanjang semester. Tugas pemecahan masalah disebut seru, dan esai akhir punya pilihan topik. Mahasiswa ingin waktu tutorial lebih banyak."
    hi: "पूरे सेमेस्टर एक भाषा का व्याकरण पढ़ते हैं। समस्या-समाधान वाले असाइनमेंट मज़ेदार बताए गए, और अंतिम निबंध में विषय चुनने का विकल्प है। छात्र ज़्यादा ट्यूटोरियल समय चाहते थे।"
difficulty: hard
