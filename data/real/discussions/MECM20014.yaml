points:
  - en: "About images and visual culture. Reviewers (2021-2023) found the themes interesting and fresh compared with other media subjects, though lectures were weak and later ones were often skipped."
    zh: "关于图像和视觉文化。评论者（2021-2023）觉得主题有趣，比其他媒体课新颖，但讲座较弱，后期常被跳过。"
    zh-TW: "關於圖像和視覺文化。評論者（2021-2023）覺得主題有趣，比其他媒體課新穎，但講座較弱，後期常被跳過。"
    ja: "イメージと視覚文化を扱う。レビュー（2021-2023）は他のメディア科目より新鮮で面白いテーマとしたが、講義は弱く後半はよく飛ばされた。"
    ko: "이미지와 시각 문화를 다룸. 리뷰(2021-2023)는 다른 미디어 과목보다 신선하고 흥미로운 주제라고 했지만, 강의는 약해서 후반엔 자주 건너뜀."
    vi: "Về hình ảnh và văn hóa thị giác. Người đánh giá (2021-2023) thấy chủ đề thú vị, mới mẻ so với các môn truyền thông khác, dù bài giảng yếu và các buổi sau thường bị bỏ."
    ms: "Tentang imej dan budaya visual. Pengulas (2021-2023) dapati temanya menarik dan segar berbanding subjek media lain, walaupun kuliah lemah dan yang kemudian sering dilangkau."
    id: "Tentang gambar dan budaya visual. Pengulas (2021-2023) merasa temanya menarik dan segar dibanding mata kuliah media lain, meski kuliahnya lemah dan yang belakangan sering dilewati."
    hi: "छवियों और विज़ुअल कल्चर के बारे में। रिव्यूअर्स (2021-2023) को थीम दूसरे मीडिया विषयों की तुलना में दिलचस्प और ताज़ा लगीं, हालाँकि लेक्चर कमज़ोर थे और बाद वाले अक्सर छोड़ दिए गए।"
  - en: "Two essays, the first a visual analysis of any image you choose, with good guidelines. Several called it an easy, manageable subject."
    zh: "两篇论文，第一篇是对任选图像的视觉分析，指引清楚。好几人说这门课轻松好应付。"
    zh-TW: "兩篇論文，第一篇是對任選圖像的視覺分析，指引清楚。好幾個人說這門課輕鬆好應付。"
    ja: "エッセイ2本で、1本目は自由に選んだ画像の視覚分析。ガイドラインも十分。易しく取り組みやすい科目という声が複数。"
    ko: "에세이 2편이며 첫 번째는 원하는 이미지의 시각 분석, 가이드라인이 충실함. 쉽고 부담 없는 과목이라는 의견이 여럿."
    vi: "Hai bài luận, bài đầu là phân tích thị giác một hình ảnh tùy chọn, có hướng dẫn tốt. Nhiều người nói đây là môn dễ và vừa sức."
    ms: "Dua esei, yang pertama analisis visual imej pilihan anda, dengan garis panduan baik. Beberapa orang kata ia subjek mudah dan boleh diurus."
    id: "Dua esai, yang pertama analisis visual gambar pilihanmu, dengan panduan yang baik. Beberapa orang menyebutnya mata kuliah mudah dan ringan."
    hi: "दो निबंध, पहला अपनी पसंद की किसी भी छवि का विज़ुअल विश्लेषण, अच्छे दिशानिर्देशों के साथ। कई ने इसे आसान और संभालने लायक विषय बताया।"
workload: light
difficulty: easy
