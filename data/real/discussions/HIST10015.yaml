code: HIST10015
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/hist10015
reviews: 4
from: 2019
to: 2026
checked: 2026-10-17
points:
  - en: "Each week dives into a different topic from the 18th century on, often with guest lecturers, which some found broad and inconsistent."
    zh: "每周深入一个18世纪以来的不同主题，常有客座讲师，有人觉得太宽泛、不连贯。"
    zh-TW: "每週深入一個18世紀以來的不同主題，常有客座講師，有人覺得太寬泛、不連貫。"
    ja: "毎週18世紀以降の異なるテーマを扱い、ゲスト講師も多いため、範囲が広く一貫性に欠けると感じた人もいた。"
    ko: "매주 18세기 이후의 다른 주제를 다루고 초청 강사가 많아, 너무 넓고 일관성이 없다고 느낀 사람도 있음."
    vi: "Mỗi tuần đi sâu một chủ đề khác từ thế kỷ 18 trở đi, thường có giảng viên khách mời, nên có người thấy quá rộng và thiếu nhất quán."
    ms: "Setiap minggu menyelami topik berbeza dari abad ke-18, sering dengan pensyarah jemputan, yang sesetengah dapati terlalu luas dan tidak konsisten."
    id: "Tiap minggu membahas topik berbeda sejak abad ke-18, sering dengan dosen tamu, yang menurut sebagian terlalu luas dan tidak konsisten."
    hi: "हर हफ़्ता 18वीं सदी से आगे के अलग टॉपिक पर जाता है, अक्सर अतिथि लेक्चरर के साथ, जो कुछ को बहुत व्यापक और असंगत लगा।"
  - en: "Assessment is a creative final project (any medium) and an essay-style exam rather than standard essays. The 2020 reviewer liked the freedom; 2019 and 2026 reviewers found the tasks hard and poorly explained."
    zh: "考核是创意期末项目（任何形式）和论文式考试，而非常规论文。2020年的评论者喜欢这种自由；2019和2026年的评论者觉得任务难、说明不清。"
    zh-TW: "考核是創意期末專案（任何形式）和論文式考試，而非常規論文。2020年的評論者喜歡這種自由；2019和2026年的評論者覺得任務難、說明不清。"
    ja: "評価は通常のエッセイではなく、形式自由の創作プロジェクトとエッセイ型試験。2020年は自由度が好評、2019年と2026年は課題が難しく説明不足とされた。"
    ko: "평가는 일반 에세이가 아니라 형식 자유의 창작 프로젝트와 에세이형 시험. 2020년엔 자유도가 호평, 2019·2026년엔 과제가 어렵고 설명이 부족하다고 함."
    vi: "Đánh giá gồm dự án sáng tạo cuối kỳ (hình thức tùy chọn) và bài thi dạng luận, không phải luận thông thường. Người năm 2020 thích sự tự do; người năm 2019 và 2026 thấy bài khó và giải thích kém."
    ms: "Penilaian ialah projek akhir kreatif (sebarang medium) dan peperiksaan gaya esei, bukan esei biasa. Pengulas 2020 suka kebebasannya; pengulas 2019 dan 2026 dapati tugasan sukar dan kurang dijelaskan."
    id: "Penilaian berupa proyek akhir kreatif (media apa pun) dan ujian bergaya esai, bukan esai biasa. Pengulas 2020 suka kebebasannya; pengulas 2019 dan 2026 merasa tugasnya sulit dan kurang dijelaskan."
    hi: "असेसमेंट सामान्य निबंध नहीं, बल्कि किसी भी माध्यम में रचनात्मक अंतिम प्रोजेक्ट और निबंध-शैली एग्ज़ाम है। 2020 के रिव्यूअर को आज़ादी पसंद आई; 2019 और 2026 वालों को काम कठिन और ठीक से न समझाया गया लगा।"
  - en: "Readings can be very long, sometimes a whole book for a tutorial. Overall opinion is mostly negative, and the newest review (2026) is critical of how it is run."
    zh: "阅读量可能很大，有时一次辅导课要读整本书。总体评价偏负面，最新（2026年）的评论批评课程的组织方式。"
    zh-TW: "閱讀量可能很大，有時一次輔導課要讀整本書。整體評價偏負面，最新（2026年）的評論批評課程的組織方式。"
    ja: "文献が非常に長いことがあり、1回のチュートリアルで本1冊のことも。全体の評価は否定的寄りで、最新（2026年）のレビューも運営を批判している。"
    ko: "읽을거리가 매우 길 수 있고, 튜토리얼 한 번에 책 한 권인 경우도. 전반적 평가는 부정적이며, 최신(2026년) 리뷰도 운영을 비판함."
    vi: "Bài đọc có thể rất dài, đôi khi cả một cuốn sách cho một buổi tutorial. Nhìn chung đánh giá tiêu cực, và bài mới nhất (2026) chê cách tổ chức môn."
    ms: "Bacaan boleh sangat panjang, kadangkala sebuah buku untuk satu tutorial. Pendapat keseluruhan kebanyakannya negatif, dan ulasan terbaru (2026) mengkritik cara ia dijalankan."
    id: "Bacaan bisa sangat panjang, kadang satu buku untuk satu tutorial. Secara umum ulasannya negatif, dan ulasan terbaru (2026) mengkritik pengelolaannya."
    hi: "रीडिंग बहुत लंबी हो सकती हैं, कभी एक ट्यूटोरियल के लिए पूरी किताब। कुल मिलाकर राय ज़्यादातर नकारात्मक है, और सबसे नया रिव्यू (2026) इसके संचालन की आलोचना करता है।"
