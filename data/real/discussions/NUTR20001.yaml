reviews: 6
from: 2021
to: 2023
checked: 2026-10-08
points:
  - en: "The content is easy and relevant to real life, but the lectures are widely described as dry."
    zh: "内容简单且贴近生活，但讲课普遍被认为枯燥。"
    zh-TW: "內容簡單又貼近生活，但講課普遍被認為枯燥。"
    ja: "内容は易しく実生活にも関係するが、講義は退屈だという声が多い。"
    ko: "내용은 쉽고 실생활과 관련 있지만 강의는 지루하다는 평이 많다."
    vi: "Nội dung dễ và gần với đời sống, nhưng bài giảng bị nhiều người chê khô khan."
    ms: "Kandungan mudah dan berkait dengan kehidupan sebenar, tetapi kuliah ramai kata membosankan."
    id: "Materinya mudah dan relevan dengan kehidupan nyata, tapi kuliahnya banyak disebut membosankan."
    hi: "कंटेंट आसान और असल ज़िंदगी से जुड़ा है, पर लेक्चर ज़्यादातर नीरस बताए जाते हैं।"
  - en: "The group assignment is a common complaint, and tutorials were seen as not very helpful."
    zh: "小组作业常被吐槽，辅导课被认为帮助不大。"
    zh-TW: "小組作業常被抱怨，習題課被認為幫助不大。"
    ja: "グループ課題は不満が多く、チュートリアルもあまり役に立たないとされた。"
    ko: "조별 과제는 흔한 불만이고, 튜토리얼은 별 도움이 안 된다는 평이다."
    vi: "Bài tập nhóm hay bị than phiền, tutorial bị cho là không mấy hữu ích."
    ms: "Tugasan kumpulan sering dirungut, dan tutorial dianggap kurang membantu."
    id: "Tugas kelompok sering dikeluhkan, dan tutorial dinilai kurang membantu."
    hi: "ग्रुप असाइनमेंट की अक्सर शिकायत होती है, और ट्यूटोरियल ज़्यादा मददगार नहीं माने गए।"
  - en: "Recent reviews say it is not a WAM booster: marking and rubrics are unclear, and the exam drew on readings. Do the readings."
    zh: "近年评价称并非刷分课：评分标准不清，考试考阅读材料，务必读。"
    zh-TW: "近年評價說這不是拉WAM的課：評分標準不清楚，考試考閱讀材料，務必要讀。"
    ja: "最近のレビューではWAM稼ぎにはならないとのこと。採点基準が不明確で、試験は文献から出た。文献は読もう。"
    ko: "최근 후기에 따르면 WAM 올리기 과목이 아니다. 채점과 루브릭이 불명확하고 시험이 읽기 자료에서 나왔다. 읽기 자료를 꼭 읽자."
    vi: "Đánh giá gần đây nói đây không phải môn kéo WAM: cách chấm và rubric không rõ, đề thi lấy từ bài đọc. Hãy đọc tài liệu."
    ms: "Ulasan terkini kata ia bukan penaik WAM: pemarkahan dan rubrik kurang jelas, dan peperiksaan ambil dari bacaan. Buat bacaan."
    id: "Ulasan terbaru bilang ini bukan penaik WAM: penilaian dan rubrik tidak jelas, dan ujian diambil dari bacaan. Baca materinya."
    hi: "हाल के रिव्यू: यह WAM बूस्टर नहीं है; मार्किंग और रूब्रिक अस्पष्ट हैं, एग्ज़ाम रीडिंग से आया। रीडिंग ज़रूर करें।"
sections:
  content:
    - en: "Nutrition topics that relate to real life. Reviewers agree the content is easy to grasp but the lectures are dry, often read from statistics-heavy slides."
      zh: "讲与生活相关的营养话题。同学一致认为内容好懂，但讲课枯燥，常常是照着满是数据的 PPT 念。"
      zh-TW: "講與生活相關的營養主題。同學一致認為內容好懂，但上課枯燥，常常是照著滿是數據的投影片念。"
      ja: "日常生活に関わる栄養学のテーマ。内容は理解しやすいが、講義は単調で統計だらけのスライドを読み上げることが多いという点で一致。"
      ko: "실생활과 관련된 영양 주제. 내용은 이해하기 쉽지만 강의가 건조하고 통계 가득한 슬라이드를 읽는 경우가 많다는 데 의견이 모인다."
      vi: "Các chủ đề dinh dưỡng gần với đời sống. Người học đồng ý nội dung dễ nắm nhưng bài giảng khô, thường đọc theo slide đầy số liệu."
      ms: "Topik pemakanan yang berkait dengan kehidupan sebenar. Pengulas sepakat kandungan mudah difahami tetapi kuliah hambar, sering dibaca daripada slaid penuh statistik."
      id: "Topik gizi yang terkait kehidupan nyata. Pengulas sepakat materinya mudah dipahami tapi kuliahnya kering, sering membaca slide penuh statistik."
      hi: "रोज़मर्रा की ज़िंदगी से जुड़े पोषण विषय। रिव्यूअर्स सहमत हैं कि कंटेंट समझना आसान है पर लेक्चर नीरस हैं, अक्सर आँकड़ों से भरी स्लाइड पढ़कर।"
  work:
    - en: "A critical review, group assignments including a video, an MST and a final exam. The multiple choice is easy; short answers need detail, and one 2023 reviewer said the exam leaned on the readings."
      zh: "有一篇评论性综述、包括视频在内的小组作业、MST 和期末。选择题简单，简答要写得很细；2023 年有同学说期末很多题出自指定阅读。"
      zh-TW: "有一篇評論性回顧、包括影片在內的小組作業、MST 和期末。選擇題簡單，簡答要寫得很細；2023 年有同學說期末很多題出自指定閱讀。"
      ja: "批評的レビュー、動画を含むグループ課題、MST、期末試験。選択式は簡単だが記述は詳しさが必要。2023年には期末が指定リーディングから多く出たという声。"
      ko: "비평적 리뷰, 영상 포함 조별 과제, MST, 기말시험이 있다. 객관식은 쉽고 단답형은 자세해야 하며, 2023년엔 기말이 지정 읽기에서 많이 나왔다는 리뷰가 있다."
      vi: "Một bài phê bình, các bài nhóm gồm cả video, MST và thi cuối kỳ. Trắc nghiệm dễ; câu ngắn cần chi tiết, và một người năm 2023 nói đề thi dựa nhiều vào bài đọc."
      ms: "Ulasan kritis, tugasan kumpulan termasuk video, MST dan peperiksaan akhir. Aneka pilihan mudah; jawapan pendek perlu terperinci, dan seorang pengulas 2023 kata peperiksaan banyak daripada bacaan."
      id: "Ulasan kritis, tugas kelompok termasuk video, MST dan ujian akhir. Pilihan gandanya mudah; isian singkat butuh detail, dan satu pengulas 2023 bilang ujian banyak diambil dari bacaan."
      hi: "एक आलोचनात्मक समीक्षा, वीडियो समेत ग्रुप असाइनमेंट, MST और फ़ाइनल परीक्षा। MCQ आसान हैं; शॉर्ट आंसर में विस्तार चाहिए, और 2023 के एक रिव्यूअर के अनुसार परीक्षा रीडिंग पर ज़्यादा टिकी थी।"
  study:
    - en: "Do the readings, and write short answers in full detail, for example define a term before explaining how it affects health."
      zh: "阅读一定要做；简答要写得很详细，比如先定义一个概念，再解释它对健康的影响。"
      zh-TW: "閱讀一定要做；簡答要寫得很詳細，例如先定義一個概念，再解釋它對健康的影響。"
      ja: "リーディングはやること。記述は詳しく書き、例えば用語を定義してから健康への影響を説明する。"
      ko: "읽기는 꼭 하라. 단답형은 자세히, 예를 들어 용어를 먼저 정의하고 건강에 미치는 영향을 설명하라."
      vi: "Làm bài đọc, và viết câu trả lời ngắn thật chi tiết, chẳng hạn định nghĩa thuật ngữ trước khi giải thích ảnh hưởng đến sức khỏe."
      ms: "Buat bacaan, dan tulis jawapan pendek dengan terperinci, contohnya takrifkan istilah sebelum menerangkan kesannya terhadap kesihatan."
      id: "Kerjakan bacaan, dan tulis jawaban singkat dengan rinci, misalnya definisikan istilah dulu sebelum menjelaskan dampaknya bagi kesehatan."
      hi: "रीडिंग करें, और शॉर्ट आंसर पूरे विस्तार से लिखें, जैसे स्वास्थ्य पर असर बताने से पहले शब्द की परिभाषा दें।"
  watch:
    - en: "2023 reviewers found it poorly coordinated, with contradictory rubrics and unhelpful tutorials, and warned it is not the WAM booster it seems; several disliked the group work."
      zh: "2023 年的同学觉得组织混乱，评分标准自相矛盾，tutorial 没帮助，提醒它不是看起来那样的刷分课；好几位不喜欢小组作业。"
      zh-TW: "2023 年的同學覺得安排混亂，評分標準自相矛盾，tutorial 沒幫助，提醒它不是看起來那樣的拉分課；好幾位不喜歡小組作業。"
      ja: "2023年のレビューでは運営がまずく、ルーブリックが矛盾しチュートリアルも役に立たず、見た目ほどWAMは上がらないと警告。グループ作業が嫌だったという声も複数。"
      ko: "2023년 리뷰는 운영이 엉망이고 루브릭이 모순되며 튜토리얼이 쓸모없다며, 보이는 것만큼 WAM 과목이 아니라고 경고했다. 조별 과제를 싫어한 사람도 여럿."
      vi: "Người học năm 2023 thấy môn tổ chức kém, rubric mâu thuẫn và tutorial vô ích, cảnh báo đây không phải môn kéo WAM như tưởng; vài người không thích bài nhóm."
      ms: "Pengulas 2023 dapati ia kurang diselaras, rubrik bercanggah dan tutorial tidak membantu, serta beri amaran ia bukan penaik WAM seperti disangka; beberapa tidak suka kerja kumpulan."
      id: "Pengulas 2023 merasa koordinasinya buruk, rubrik saling bertentangan dan tutorial tidak membantu, serta mengingatkan ini bukan pendongkrak WAM seperti kelihatannya; beberapa tidak suka tugas kelompok."
      hi: "2023 के रिव्यूअर्स को समन्वय कमज़ोर, रूब्रिक विरोधाभासी और ट्यूटोरियल बेकार लगे, और चेताया कि यह दिखने जैसा WAM बूस्टर नहीं है; कई को ग्रुप काम नापसंद था।"
tags: [group-work]
difficulty: mixed
