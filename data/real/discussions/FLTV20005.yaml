points:
  - en: "Reviewers enjoyed the hands-on tasks: marking up a script and storyboarding it, then choosing between a short film, adaptation, animation or documentary plan."
    zh: "评价喜欢动手的作业：给剧本做标注并画分镜，再从短片、改编、动画或纪录片方案中自选一项。"
    zh-TW: "評價喜歡動手的作業：給劇本做標註並畫分鏡，再從短片、改編、動畫或紀錄片企劃中自選一項。"
    ja: "脚本への書き込みと絵コンテ、さらに短編・脚色・アニメ・ドキュメンタリー企画から選ぶ課題が好評。"
    ko: "대본에 표시하고 스토리보드를 그린 뒤 단편, 각색, 애니메이션, 다큐 기획 중 고르는 실습 과제가 호평."
    vi: "Người học thích các bài thực hành: đánh dấu kịch bản, vẽ phân cảnh, rồi chọn làm phim ngắn, chuyển thể, hoạt hình hay tài liệu."
    ms: "Pengulas suka tugasan praktikal: tanda skrip dan papan cerita, kemudian pilih filem pendek, adaptasi atau dokumentari."
    id: "Pengulas suka tugas praktik: menandai naskah dan storyboard, lalu memilih film pendek, adaptasi, animasi, atau dokumenter."
    hi: "समीक्षकों को व्यावहारिक काम पसंद आए: स्क्रिप्ट मार्क कर स्टोरीबोर्ड बनाना, फिर फ़िल्म, रूपांतरण, एनिमेशन या डॉक्यूमेंट्री चुनना।"
  - en: "Lectures are easy to follow and the quizzes are easy marks; most called it a high-scoring subject if you keep up with the lectures."
    zh: "讲座好跟，小测是送分题；多数人说只要跟上讲座，分数会很高。"
    zh-TW: "講座好跟，小測是送分題；多數人說只要跟上講座，分數會很高。"
    ja: "講義はわかりやすく小テストは得点源。講義についていけば高得点が取れるという声が多い。"
    ko: "강의는 따라가기 쉽고 퀴즈는 점수 벌기 좋음. 강의만 잘 따라가면 고득점 과목이라는 평이 다수."
    vi: "Bài giảng dễ theo, quiz dễ lấy điểm; đa số nói chỉ cần theo kịp bài giảng là điểm cao."
    ms: "Kuliah mudah difahami dan kuiz mudah dapat markah; kebanyakan kata markah tinggi jika ikut kuliah."
    id: "Kuliah mudah diikuti dan kuis mudah dapat nilai; kebanyakan bilang nilainya tinggi asal ikuti kuliah."
    hi: "लेक्चर समझने में आसान और क्विज़ आसान अंक; ज़्यादातर ने कहा लेक्चर साथ रखें तो अंक अच्छे आते हैं।"
  - en: "One older review found the set stories for adaptation dull and the tasks less fun than Making Movies 1."
    zh: "一条较早的评价觉得指定改编的故事很无聊，作业不如拍电影1有意思。"
    zh-TW: "一則較早的評價覺得指定改編的故事很無聊，作業不如拍電影1有意思。"
    ja: "古いレビュー1件は、脚色用の指定作品が退屈で「映画制作1」より課題がつまらないと感じた。"
    ko: "오래된 후기 하나는 각색용 지정 이야기가 지루하고 과제가 영화 만들기 1보다 재미없다고 함."
    vi: "Một đánh giá cũ thấy truyện chuyển thể được giao nhàm chán, bài tập kém vui hơn Làm phim 1."
    ms: "Satu ulasan lama dapati cerita adaptasi yang ditetapkan membosankan berbanding Making Movies 1."
    id: "Satu ulasan lama merasa cerita adaptasi yang ditentukan membosankan dibanding Making Movies 1."
    hi: "एक पुराने रिव्यू को रूपांतरण की तय कहानियाँ उबाऊ और काम मेकिंग मूवीज़ 1 से कम मज़ेदार लगे।"
workload: light
difficulty: easy
