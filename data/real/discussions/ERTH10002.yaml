points:
  - en: "Strongly recommended as a fun, interesting intro to geology, even for those not sure they like earth science."
    zh: "被强烈推荐为有趣的地质学入门课，即使对地球科学没把握的人也适合。"
    zh-TW: "被大力推薦為有趣的地質學入門課，就算不確定自己喜不喜歡地球科學也適合。"
    ja: "面白い地質学入門として強くおすすめ。地球科学が好きか分からない人にも。"
    ko: "지구과학을 좋아할지 확신이 없는 사람에게도 재미있는 지질학 입문으로 강력 추천."
    vi: "Rất được khuyên học như một môn nhập môn địa chất vui và thú vị, kể cả khi chưa chắc mình thích khoa học trái đất."
    ms: "Sangat disyorkan sebagai pengenalan geologi yang seronok, walaupun bagi yang tidak pasti suka sains bumi."
    id: "Sangat direkomendasikan sebagai pengantar geologi yang seru, bahkan bagi yang belum yakin suka ilmu kebumian."
    hi: "जियोलॉजी के मज़ेदार, दिलचस्प इंट्रो के रूप में ज़ोरदार सिफ़ारिश, भले आपको अर्थ साइंस पसंद होने का भरोसा न हो।"
  - en: "The field trip is a highlight and carries a lot of marks, so put in the work there."
    zh: "野外考察是亮点且占分很高，要认真对待。"
    zh-TW: "野外考察是亮點，占分也很高，一定要認真做。"
    ja: "フィールドトリップは目玉で配点も高いので、しっかり取り組もう。"
    ko: "현장 답사가 하이라이트이고 배점도 크니 성실히 임하세요."
    vi: "Chuyến đi thực địa là điểm nhấn và chiếm nhiều điểm, nên hãy đầu tư vào đó."
    ms: "Lawatan lapangan ialah kemuncak dan membawa banyak markah, jadi berusahalah di situ."
    id: "Kunjungan lapangan adalah sorotan utama dan nilainya besar, jadi seriuslah di sana."
    hi: "फ़ील्ड ट्रिप सबसे ख़ास हिस्सा है और इसमें काफ़ी मार्क्स हैं, तो वहाँ मेहनत करें।"
  - en: "Pracs on rocks and minerals are enjoyable; one recent review warns it still needs real study for quizzes and exams."
    zh: "岩石矿物实验课很有趣；近期有评论提醒，测验和考试仍需认真复习。"
    zh-TW: "岩石礦物實驗課很有趣；最近有評論提醒，小考和考試還是要認真念。"
    ja: "岩石と鉱物の実習は楽しい。ただ小テストと試験にはきちんと勉強が必要だと最近の口コミは警告。"
    ko: "암석과 광물 실습은 즐겁지만, 퀴즈와 시험은 여전히 제대로 공부해야 한다는 최근 후기가 있음."
    vi: "Prac về đá và khoáng vật rất vui; một đánh giá gần đây nhắc vẫn phải học thật sự cho quiz và thi."
    ms: "Prac tentang batuan dan mineral menyeronokkan; satu ulasan terkini ingatkan kuiz dan peperiksaan masih perlu belajar sungguh-sungguh."
    id: "Prak batuan dan mineral menyenangkan; satu ulasan terbaru mengingatkan kuis dan ujian tetap perlu belajar sungguhan."
    hi: "चट्टानों और खनिजों वाले प्रैक्टिकल मज़ेदार हैं; हाल का एक रिव्यू चेताता है कि क्विज़ और एग्ज़ाम के लिए अब भी ठीक से पढ़ना होगा।"
sections:
  content:
    - en: "A general intro to geology: rock types, plate tectonics, deformation, fossils, Australian geology, ore deposits, groundwater and hazards. Reviewers found it fun and interesting, but one says it's mildly content heavy."
      zh: "地质学入门：岩石类型、板块构造、变形、化石、澳洲地质、矿床、地下水和地质灾害。同学觉得有趣，但有人说内容不算少。"
      zh-TW: "地質學入門：岩石類型、板塊構造、變形、化石、澳洲地質、礦床、地下水和地質災害。同學覺得有趣，但有人說內容不算少。"
      ja: "地質学の総合入門。岩石の種類、プレートテクトニクス、変形、化石、オーストラリアの地質、鉱床、地下水、災害。楽しく面白いが、内容はやや多めという人も。"
      ko: "지질학 개론: 암석 종류, 판 구조론, 변형, 화석, 호주 지질, 광상, 지하수, 재해. 재미있고 흥미롭지만 내용이 다소 많다는 리뷰도 있다."
      vi: "Nhập môn địa chất: các loại đá, kiến tạo mảng, biến dạng, hóa thạch, địa chất Úc, mỏ quặng, nước ngầm và thiên tai. Người học thấy vui, thú vị, dù một người nói nội dung hơi nhiều."
      ms: "Pengenalan geologi: jenis batuan, tektonik plat, canggaan, fosil, geologi Australia, longgokan bijih, air bawah tanah dan bahaya. Pengulas rasa seronok, walaupun seorang kata kandungan agak banyak."
      id: "Pengantar geologi: jenis batuan, tektonik lempeng, deformasi, fosil, geologi Australia, endapan bijih, air tanah dan bencana. Pengulas merasa seru, meski satu bilang materinya agak banyak."
      hi: "भूविज्ञान का परिचय: चट्टानों के प्रकार, प्लेट टेक्टॉनिक्स, विरूपण, जीवाश्म, ऑस्ट्रेलिया का भूविज्ञान, अयस्क भंडार, भूजल और आपदाएँ। रिव्यूअर्स को मज़ेदार लगा, हालाँकि एक कहता है सामग्री थोड़ी ज़्यादा है।"
  work:
    - en: "Weekly quizzes with very specific questions, hands-on pracs with rocks and fossils, a practical exam, a field trip worth a big share of marks, and a written exam."
      zh: "每周小测，题目很细；实验课动手看岩石和化石；有实验考试、占分很重的野外考察，以及笔试。"
      zh-TW: "每週小考，題目很細；實驗課動手看岩石和化石；有實驗考試、占分很重的野外考察，以及筆試。"
      ja: "非常に具体的な問題の毎週のクイズ、岩石や化石に触れる実習、実技試験、配点の大きい巡検、筆記試験。"
      ko: "매우 구체적인 문제의 주간 퀴즈, 암석과 화석을 직접 보는 실습, 실기 시험, 배점이 큰 야외 답사, 필기 시험."
      vi: "Quiz hằng tuần với câu hỏi rất cụ thể, prac thực hành với đá và hóa thạch, thi thực hành, chuyến thực địa chiếm nhiều điểm, và thi viết."
      ms: "Kuiz mingguan dengan soalan sangat khusus, amali dengan batuan dan fosil, peperiksaan amali, lawatan lapangan yang bernilai banyak markah, dan peperiksaan bertulis."
      id: "Kuis mingguan dengan soal sangat spesifik, praktikum dengan batuan dan fosil, ujian praktik, kunjungan lapangan yang bobotnya besar, dan ujian tulis."
      hi: "बहुत खास सवालों वाले साप्ताहिक क्विज़, चट्टानों और जीवाश्मों के साथ प्रैक, प्रैक्टिकल परीक्षा, बड़े अंकों वाली फ़ील्ड ट्रिप, और लिखित परीक्षा।"
  study:
    - en: "Review lectures weekly for the quizzes, photograph rocks in pracs to revise mineral properties, use the practice exams, and take the field trip booklet seriously."
      zh: "每周复习讲课应对小测；实验课拍下岩石照片，用来复习矿物性质；多做练习卷；认真对待野外考察手册。"
      zh-TW: "每週複習講課應對小考；實驗課拍下岩石照片，用來複習礦物性質；多做練習卷；認真對待野外考察手冊。"
      ja: "クイズに向け毎週講義を復習し、実習で岩石の写真を撮って鉱物の性質を復習、練習試験を使い、巡検の冊子は真剣に取り組むこと。"
      ko: "퀴즈 대비로 매주 강의를 복습하고, 실습 때 암석 사진을 찍어 광물 성질을 복습하고, 연습 시험을 활용하고, 답사 책자를 성실히 작성할 것."
      vi: "Ôn bài giảng hằng tuần cho quiz, chụp ảnh đá trong prac để ôn tính chất khoáng vật, dùng đề luyện, và làm nghiêm túc sổ thực địa."
      ms: "Ulang kaji kuliah setiap minggu untuk kuiz, ambil gambar batuan semasa amali untuk ulang kaji sifat mineral, guna peperiksaan latihan, dan serius dengan buku lawatan lapangan."
      id: "Ulas kuliah tiap minggu untuk kuis, foto batuan saat praktikum untuk mengulang sifat mineral, pakai soal latihan, dan serius mengerjakan buku kunjungan lapangan."
      hi: "क्विज़ के लिए हर हफ़्ते लेक्चर दोहराएँ, प्रैक में चट्टानों की फ़ोटो लें ताकि खनिज गुण दोहरा सकें, अभ्यास परीक्षाएँ करें, और फ़ील्ड ट्रिप बुकलेट को गंभीरता से लें।"
  watch:
    - en: "The 2025 reviewer calls it Geoscience: Evolution of the Earth, so the name may have changed. One says it's not a WAM booster to lighten your load."
      zh: "2025 年的同学称它为 Geoscience: Evolution of the Earth，课程名可能已经改了。有人说这门不是用来减负、拉 WAM 的课。"
      zh-TW: "2025 年的同學稱它為 Geoscience: Evolution of the Earth，課名可能已經改了。有人說這門不是用來減負、拉 WAM 的課。"
      ja: "2025年のレビューはGeoscience: Evolution of the Earthと呼んでおり、名称が変わった可能性がある。負担を減らしWAMを上げる科目ではないという人も。"
      ko: "2025년 리뷰는 Geoscience: Evolution of the Earth라고 불러 이름이 바뀌었을 수 있다. 부담을 덜고 WAM을 올리는 과목은 아니라는 리뷰도 있다."
      vi: "Người năm 2025 gọi môn là Geoscience: Evolution of the Earth, nên tên có thể đã đổi. Một người nói đây không phải môn nhẹ để kéo WAM."
      ms: "Pengulas 2025 menyebutnya Geoscience: Evolution of the Earth, jadi nama mungkin telah berubah. Seorang kata ia bukan penaik WAM untuk meringankan beban."
      id: "Pengulas 2025 menyebutnya Geoscience: Evolution of the Earth, jadi namanya mungkin sudah berubah. Satu bilang ini bukan pendongkrak WAM untuk meringankan beban."
      hi: "2025 का रिव्यूअर इसे Geoscience: Evolution of the Earth कहता है, तो नाम बदल गया हो सकता है। एक कहता है यह बोझ हल्का करने वाला WAM बूस्टर नहीं।"
