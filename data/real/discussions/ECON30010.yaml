points:
  - en: "Reviewers found it interesting: it extends intermediate micro by loosening model assumptions, and one felt they learned more here than in earlier micro subjects."
    zh: "评价认为内容有意思：在中级微观基础上放宽模型假设，有人觉得这里学到的比之前的微观课都多。"
    zh-TW: "評價認為內容有趣：在中級個體經濟的基礎上放寬模型假設，有人覺得這裡學到的比之前的個經課都多。"
    ja: "面白いという評価。中級ミクロのモデルの仮定を緩めて発展させる内容で、以前のミクロ科目より多くを学べたという声も。"
    ko: "흥미롭다는 평. 중급 미시의 모델 가정을 완화해 확장하며, 이전 미시 과목보다 더 많이 배웠다는 사람도 있다."
    vi: "Người học thấy môn thú vị: mở rộng kinh tế vi mô trung cấp bằng cách nới lỏng giả định mô hình, có người thấy học được nhiều hơn các môn vi mô trước."
    ms: "Pengulas dapati ia menarik: ia melanjutkan mikro pertengahan dengan melonggarkan andaian model, dan seorang rasa belajar lebih banyak berbanding subjek mikro sebelumnya."
    id: "Pengulas merasa menarik: memperluas mikro menengah dengan melonggarkan asumsi model, dan seorang merasa belajar lebih banyak dibanding mata kuliah mikro sebelumnya."
    hi: "रिव्यूअर्स को यह दिलचस्प लगा: यह मॉडल की मान्यताओं को ढीला करके इंटरमीडिएट माइक्रो को आगे बढ़ाता है, और एक को पहले के माइक्रो विषयों से ज़्यादा सीखने को मिला।"
  - en: "Opinions on difficulty differ: one called it simple if you pay attention, while another found the assignments very hard and the two-hour exam tight."
    zh: "对难度看法不一：有人说只要认真听就很简单，也有人觉得作业很难、两小时考试时间紧。"
    zh-TW: "對難度看法不一：有人說只要認真聽就很簡單，也有人覺得作業很難、兩小時考試時間緊。"
    ja: "難易度の評価は分かれる。集中していれば簡単という人もいれば、課題がとても難しく2時間の試験は時間が足りないという人も。"
    ko: "난이도 평가는 엇갈린다. 집중하면 쉽다는 사람도 있고, 과제가 매우 어렵고 2시간 시험이 빠듯했다는 사람도 있다."
    vi: "Ý kiến về độ khó khác nhau: có người nói đơn giản nếu chú ý, người khác thấy bài tập rất khó và bài thi hai tiếng gấp gáp."
    ms: "Pendapat tentang kesukaran berbeza: seorang kata mudah jika beri perhatian, seorang lagi dapati tugasan sangat sukar dan peperiksaan dua jam terlalu suntuk."
    id: "Pendapat soal tingkat kesulitan berbeda: ada yang bilang mudah asal memperhatikan, yang lain merasa tugasnya sangat sulit dan ujian dua jam terlalu mepet."
    hi: "कठिनाई पर राय अलग है: एक के मुताबिक़ ध्यान दें तो आसान है, जबकि दूसरे को असाइनमेंट बहुत कठिन और दो घंटे की परीक्षा तंग लगी।"
  - en: "Strong maths helps but is not essential, as logical reasoning matters more; lectures are mostly Q&A and tutorials are not compulsory."
    zh: "数学好有帮助但不是必需，逻辑推理更重要；讲座以问答为主，辅导课不强制。"
    zh-TW: "數學好有幫助但不是必要，邏輯推理更重要；講座以問答為主，輔導課不強制。"
    ja: "数学が得意だと有利だが必須ではなく、論理的思考の方が大事。講義は主に質疑応答形式で、チュートリアルは必須ではない。"
    ko: "수학 실력이 도움은 되지만 필수는 아니고 논리적 추론이 더 중요하다. 강의는 주로 질의응답이고 튜토리얼은 의무가 아니다."
    vi: "Giỏi toán có lợi nhưng không bắt buộc, lập luận logic quan trọng hơn; bài giảng chủ yếu là hỏi đáp và tutorial không bắt buộc."
    ms: "Matematik yang kuat membantu tetapi tidak wajib kerana penaakulan logik lebih penting; kuliah kebanyakannya soal jawab dan tutorial tidak wajib."
    id: "Matematika yang kuat membantu tapi tidak wajib, karena penalaran logis lebih penting; kuliah kebanyakan tanya jawab dan tutorial tidak wajib."
    hi: "मज़बूत गणित मदद करता है पर ज़रूरी नहीं, तार्किक सोच ज़्यादा मायने रखती है; लेक्चर ज़्यादातर सवाल-जवाब हैं और ट्यूटोरियल अनिवार्य नहीं।"
difficulty: mixed
