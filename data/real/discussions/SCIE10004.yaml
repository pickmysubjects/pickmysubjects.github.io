points:
  - en: "Widely seen as a low-effort WAM booster that suits a filler or breadth slot."
    zh: "普遍认为投入少、可提分，适合凑学分或通识选修。"
    zh-TW: "普遍認為投入少、可提升WAM，適合湊學分或Breadth選修。"
    ja: "労力が少なくWAMを上げられる科目として知られ、埋め合わせやBreadth枠に向いています。"
    ko: "노력이 적게 드는 WAM 올리기 과목으로 알려져 있어 채우기용이나 Breadth 자리에 적합합니다."
    vi: "Được xem là môn ít tốn sức, giúp tăng WAM, hợp để lấp chỗ trống hoặc làm môn Breadth."
    ms: "Umumnya dianggap penaik WAM yang tidak memerlukan banyak usaha, sesuai untuk slot pengisi atau Breadth."
    id: "Umumnya dianggap pendongkrak WAM yang ringan usaha, cocok untuk slot pengisi atau Breadth."
    hi: "इसे कम मेहनत वाला WAM बूस्टर माना जाता है, जो फिलर या Breadth स्लॉट के लिए सही है।"
  - en: "The open-book quizzes are easy to score highly on, but recent reviewers say you must watch lectures because some questions use lecture-only details."
    zh: "开卷测验容易拿高分，但近期评价说要看讲座，有些题考讲座独有的细节。"
    zh-TW: "開書測驗容易拿高分，但近期評價說要看講座，有些題考講座獨有的細節。"
    ja: "持ち込み可の小テストは高得点を取りやすいですが、講義でしか出てこない細部を問う問題もあるので、講義は見るべきだと最近のレビューは言っています。"
    ko: "오픈북 퀴즈는 고득점이 쉽지만, 강의에만 나오는 내용을 묻는 문제가 있어 강의를 꼭 봐야 한다고 최근 후기는 말합니다."
    vi: "Quiz mở tài liệu dễ đạt điểm cao, nhưng đánh giá gần đây nói phải xem bài giảng vì có câu hỏi chi tiết chỉ có trong bài giảng."
    ms: "Kuiz buku terbuka mudah dapat markah tinggi, tetapi pengulas terkini kata anda mesti tonton kuliah kerana sesetengah soalan guna butiran yang hanya ada dalam kuliah."
    id: "Kuis open book mudah dapat nilai tinggi, tapi pengulas terbaru bilang kuliah wajib ditonton karena beberapa soal memakai detail yang hanya ada di kuliah."
    hi: "ओपन-बुक क्विज़ में ज़्यादा मार्क्स लाना आसान है, पर हाल के रिव्यूअर्स कहते हैं लेक्चर देखना ज़रूरी है क्योंकि कुछ सवाल सिर्फ लेक्चर की डिटेल पर हैं।"
  - en: "The 2000-word essay is worth about 60%. Marking views are split, and some found the guidance and feedback vague, so don't leave it late."
    zh: "2000字论文约占60%，对评分看法不一，有人觉得指导和反馈模糊，别拖到最后。"
    zh-TW: "2000字論文約占60%，對評分看法不一，有人覺得指導和回饋模糊，別拖到最後。"
    ja: "2000語のエッセイが約60%を占めます。採点の評価は分かれ、指導やフィードバックがあいまいだという人もいるので、後回しにしないように。"
    ko: "2000단어 에세이가 약 60%입니다. 채점 의견은 갈리고 안내와 피드백이 모호했다는 사람도 있으니 미루지 마세요."
    vi: "Bài luận 2000 từ chiếm khoảng 60%. Ý kiến về cách chấm trái chiều, có người thấy hướng dẫn và phản hồi mơ hồ, nên đừng để nước đến chân."
    ms: "Esei 2000 patah perkataan bernilai kira-kira 60%. Pandangan tentang pemarkahan berbelah bahagi, ada yang dapati bimbingan dan maklum balas kabur, jadi jangan tangguh."
    id: "Esai 2000 kata bernilai sekitar 60%. Pendapat soal penilaian terbelah, ada yang merasa bimbingan dan feedback kabur, jadi jangan menunda."
    hi: "2000 शब्दों का निबंध करीब 60% का है। मार्किंग पर राय बँटी है, कुछ को गाइडेंस और फीडबैक अस्पष्ट लगे, इसलिए इसे आखिर तक न टालें।"
sections:
  content:
    - en: "Disease spread and pandemics seen through biomedicine, ecology, psychology and geography. Most found it interesting, though only at surface level; the psych part is information-heavy."
      zh: "从生物医学、生态、心理和地理几个角度看疾病传播和大流行。多数人觉得有趣，但只学到皮毛；心理部分信息量很大。"
      zh-TW: "從生物醫學、生態、心理和地理幾個角度看疾病傳播和大流行。多數人覺得有趣，但只學到皮毛；心理部分資訊量很大。"
      ja: "感染症の広がりやパンデミックを生物医学・生態学・心理学・地理学から見る。面白いが浅いという声が多い。心理パートは情報量が多い。"
      ko: "질병 확산과 팬데믹을 생물의학, 생태학, 심리학, 지리학 관점에서 본다. 대부분 흥미롭다고 하지만 겉핥기 수준이며, 심리 파트는 정보량이 많다."
      vi: "Sự lây lan bệnh và đại dịch nhìn qua y sinh, sinh thái, tâm lý và địa lý. Đa số thấy thú vị dù chỉ ở mức bề mặt; phần tâm lý rất nhiều thông tin."
      ms: "Penyebaran penyakit dan pandemik dilihat melalui bioperubatan, ekologi, psikologi dan geografi. Kebanyakan rasa menarik walaupun cetek; bahagian psikologi padat maklumat."
      id: "Penyebaran penyakit dan pandemi dilihat lewat biomedis, ekologi, psikologi dan geografi. Kebanyakan merasa menarik meski dangkal; bagian psikologi padat informasi."
      hi: "रोग फैलाव और महामारी को बायोमेडिसिन, इकोलॉजी, मनोविज्ञान और भूगोल से देखा जाता है। ज़्यादातर को रोचक पर सतही लगा; मनोविज्ञान वाला हिस्सा जानकारी से भरा है।"
  work:
    - en: "Four open-book quizzes on the lectures are easy to score 90+ on, but they ask specific details only found in the lecture content."
      zh: "四次开卷小测都考讲座内容，拿 90+ 不难，但会考只有讲座里才有的具体细节。"
      zh-TW: "四次開書小考都考講座內容，拿 90+ 不難，但會考只有講座裡才有的具體細節。"
      ja: "講義に基づく4回のオープンブッククイズは90点以上を取りやすいが、講義にしか出てこない細かい点も問われる。"
      ko: "강의 기반 오픈북 퀴즈 4번은 90점 이상 받기 쉽지만, 강의에만 나오는 구체적 내용도 묻는다."
      vi: "Bốn bài quiz mở sách về bài giảng dễ đạt 90+, nhưng có hỏi chi tiết chỉ có trong bài giảng."
      ms: "Empat kuiz buku terbuka tentang kuliah mudah dapat 90+, tetapi ada soalan butiran khusus yang hanya ada dalam kuliah."
      id: "Empat kuis open-book tentang kuliah mudah dapat 90+, tapi ada detail spesifik yang hanya ada di materi kuliah."
      hi: "लेक्चर पर चार ओपन-बुक क्विज़ में 90+ लाना आसान है, पर कुछ बातें ऐसी पूछी जाती हैं जो सिर्फ़ लेक्चर में हैं।"
    - en: "A 2000-word open-topic essay is 60%. Views split on marking: some found it fair or generous, others harsh, vague on rubric and dependent on the marker."
      zh: "2000 字自选题论文占 60%。评分看法不一：有人觉得公平甚至宽松，有人觉得严、评分标准模糊、全看批改的人。"
      zh-TW: "2000 字自選題論文占 60%。評分看法不一：有人覺得公平甚至寬鬆，有人覺得嚴、評分標準模糊、全看批改的人。"
      ja: "テーマ自由の2000語エッセイが60%。採点は、公平・甘いという人と、厳しくルーブリックが曖昧で採点者次第という人に分かれる。"
      ko: "주제 자유 2000단어 에세이가 60%. 채점은 공정하거나 후했다는 사람과, 박하고 루브릭이 모호하며 채점자에 달렸다는 사람으로 갈린다."
      vi: "Bài luận 2000 từ tự chọn đề chiếm 60%. Ý kiến về chấm điểm chia: có người thấy công bằng hoặc rộng rãi, có người thấy khắt khe, tiêu chí mơ hồ, tùy người chấm."
      ms: "Esei 2000 patah perkataan bertopik bebas bernilai 60%. Pandangan tentang pemarkahan berbelah: ada yang rasa adil atau murah hati, ada yang rasa ketat, rubrik kabur dan bergantung pada pemeriksa."
      id: "Esai 2000 kata topik bebas bernilai 60%. Pendapat soal penilaian terbelah: ada yang merasa adil atau murah, ada yang merasa ketat, rubrik kabur dan tergantung penilai."
      hi: "2000 शब्दों का खुले विषय वाला निबंध 60% है। अंकन पर राय बँटी: कुछ को उचित या उदार, कुछ को सख़्त, रूब्रिक अस्पष्ट और जाँचने वाले पर निर्भर लगा।"
  study:
    - en: "Watch the lectures (2x speed works) and take notes you can search during quizzes; start the essay early and check the sample paragraphs in the academic skills section."
      zh: "讲座要看（2 倍速就行），笔记做成能搜索的方便小测时 Ctrl+F；论文早点开始，参考学术技能栏目里的范文段落。"
      zh-TW: "講座要看（2 倍速就好），筆記做成能搜尋的方便小考時 Ctrl+F；論文早點開始，參考學術技能專區的範文段落。"
      ja: "講義は見る（2倍速で可）。クイズで検索できるノートを作る。エッセイは早めに始め、アカデミックスキルのサンプル段落を参考に。"
      ko: "강의는 봐라(2배속 가능). 퀴즈 때 검색할 수 있게 노트를 만들어라. 에세이는 일찍 시작하고 학업 기술 섹션의 예시 문단을 참고하라."
      vi: "Xem bài giảng (tốc độ 2x cũng được) và ghi chép để tra khi làm quiz; viết luận sớm và xem đoạn văn mẫu ở mục kỹ năng học thuật."
      ms: "Tonton kuliah (kelajuan 2x pun boleh) dan buat nota yang boleh dicari semasa kuiz; mula esei awal dan semak contoh perenggan di bahagian kemahiran akademik."
      id: "Tonton kuliah (kecepatan 2x bisa) dan buat catatan yang bisa dicari saat kuis; mulai esai lebih awal dan lihat contoh paragraf di bagian keterampilan akademik."
      hi: "लेक्चर देखें (2x स्पीड चलेगी) और ऐसे नोट्स बनाएँ जो क्विज़ में सर्च हो सकें; निबंध जल्दी शुरू करें और अकादमिक स्किल्स सेक्शन के सैंपल पैराग्राफ़ देखें।"
  watch:
    - en: "Most call it a WAM booster with low effort, but a few warn an H1 is not guaranteed because the essay carries so much weight."
      zh: "多数人说是省力的刷分课，但有几位提醒论文比重太大，H1 并不保险。"
      zh-TW: "多數人說是省力的拉分課，但有幾位提醒論文比重太大，H1 並不保險。"
      ja: "少ない労力でWAMを稼げるという声が多いが、エッセイの比重が大きいのでH1は確実でないという警告も数件。"
      ko: "대부분 적은 노력으로 WAM을 올릴 수 있다고 하지만, 에세이 비중이 커서 H1이 보장되진 않는다는 경고도 몇 있다."
      vi: "Đa số gọi là môn kéo WAM ít tốn sức, nhưng vài người cảnh báo H1 không chắc vì bài luận chiếm tỷ trọng lớn."
      ms: "Kebanyakan kata ia penaik WAM dengan sedikit usaha, tetapi beberapa beri amaran H1 tidak terjamin kerana esei sangat berat."
      id: "Kebanyakan bilang pendongkrak WAM yang ringan, tapi beberapa mengingatkan H1 tidak terjamin karena bobot esainya besar."
      hi: "ज़्यादातर इसे कम मेहनत वाला WAM बूस्टर कहते हैं, पर कुछ चेताते हैं कि निबंध का वज़न ज़्यादा होने से H1 पक्का नहीं।"
workload: light
difficulty: easy
