code: CRIM10001
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/crim10001
reviews: 10
from: 2018
to: 2026
checked: 2026-10-17
points:
  - en: "Opinions are split: some enjoyed it as a good intro to criminology, but many found the lectures dry and only loosely linked to the assignments."
    zh: "评价两极：有人觉得是不错的犯罪学入门，但很多人认为讲座枯燥，与作业关系不大。"
    zh-TW: "評價兩極：有人覺得是不錯的犯罪學入門，但很多人認為講座枯燥，與作業關係不大。"
    ja: "意見は分かれる。犯罪学の良い入門として楽しんだ人もいるが、講義が退屈で課題とのつながりが薄いと感じた人が多い。"
    ko: "의견이 갈림. 좋은 범죄학 입문으로 즐긴 사람도 있지만, 강의가 지루하고 과제와 연결이 약하다는 의견이 많음."
    vi: "Ý kiến chia rẽ: có người thích vì là phần nhập môn tội phạm học tốt, nhưng nhiều người thấy bài giảng khô khan và ít liên quan đến bài tập."
    ms: "Pendapat berbelah: ada yang suka sebagai pengenalan kriminologi yang baik, tetapi ramai dapati kuliah hambar dan kurang berkait dengan tugasan."
    id: "Pendapat terbelah: sebagian menikmatinya sebagai pengantar kriminologi yang baik, tapi banyak yang merasa kuliahnya kering dan kurang terkait dengan tugas."
    hi: "राय बँटी है: कुछ को यह क्रिमिनोलॉजी का अच्छा परिचय लगा, पर कई को लेक्चर नीरस और असाइनमेंट से कम जुड़े लगे।"
  - en: "Weekly readings are heavy, but tutorials help unpack them. Essays give a lot of freedom to choose a crime or topic, which many liked."
    zh: "每周阅读量大，但辅导课会帮你拆解。论文可以自由选择犯罪类型或题目，很多人喜欢这一点。"
    zh-TW: "每週閱讀量大，但輔導課會幫你拆解。論文可以自由選擇犯罪類型或題目，很多人喜歡這一點。"
    ja: "毎週の文献は多いが、チュートリアルで理解を助けてくれる。エッセイは犯罪やテーマを自由に選べ、それを好む人が多い。"
    ko: "매주 읽을거리가 많지만 튜토리얼에서 풀어줌. 에세이는 범죄나 주제를 자유롭게 고를 수 있어 좋아한 사람이 많음."
    vi: "Bài đọc hằng tuần nhiều, nhưng tutorial giúp giải thích. Bài luận cho tự do chọn loại tội phạm hoặc chủ đề, nhiều người thích điều này."
    ms: "Bacaan mingguan banyak, tetapi tutorial membantu menghuraikannya. Esei memberi kebebasan memilih jenayah atau topik, yang ramai suka."
    id: "Bacaan mingguan banyak, tapi tutorial membantu menguraikannya. Esai memberi kebebasan memilih jenis kejahatan atau topik, yang disukai banyak orang."
    hi: "हर हफ़्ते की रीडिंग भारी है, पर ट्यूटोरियल उन्हें समझाने में मदद करते हैं। निबंधों में अपराध या विषय चुनने की काफ़ी आज़ादी है, जो कई लोगों को पसंद आई।"
  - en: "Several said a good mark is reachable without huge effort if you know the main theories and write clearly."
    zh: "好几人说只要掌握主要理论、写得清楚，不需太多努力也能拿到好成绩。"
    zh-TW: "好幾個人說只要掌握主要理論、寫得清楚，不需太多努力也能拿到好成績。"
    ja: "主要な理論を押さえて明確に書けば、大きな努力なしでも良い成績が取れるという声が複数。"
    ko: "주요 이론을 알고 명확하게 쓰면 큰 노력 없이도 좋은 점수가 가능하다는 의견이 여럿."
    vi: "Nhiều người nói có thể đạt điểm tốt mà không quá vất vả nếu nắm các lý thuyết chính và viết rõ ràng."
    ms: "Beberapa orang kata markah baik boleh dicapai tanpa usaha besar jika faham teori utama dan menulis dengan jelas."
    id: "Beberapa orang bilang nilai bagus bisa dicapai tanpa usaha besar jika paham teori utama dan menulis dengan jelas."
    hi: "कई लोगों ने कहा कि मुख्य सिद्धांत समझकर साफ़ लिखें तो बहुत मेहनत के बिना भी अच्छे अंक मिल सकते हैं।"
sections:
  content:
    - en: "An intro to criminology theories applied to different crimes. Some found it engaging; many found the long lectures dry and not much help for assignments, while tutorials were the useful part."
      zh: "犯罪学理论入门，套用到各种犯罪上。有人觉得有意思；很多人觉得两小时 lecture 枯燥、对作业帮助不大，tutorial 才是有用的部分。"
      zh-TW: "犯罪學理論入門，套用到各類犯罪上。有人覺得有趣；很多人覺得長 lecture 乏味、對作業幫助不大，tutorial 才是有用的部分。"
      ja: "犯罪学理論の入門で、様々な犯罪に当てはめる。面白いという人もいるが、長い講義が退屈で課題に役立たず、チュートリアルこそ有益だったという声が多い。"
      ko: "범죄학 이론 입문으로 여러 범죄에 적용한다. 흥미롭다는 사람도 있지만, 긴 강의가 지루하고 과제에 별 도움이 안 되며 튜토리얼이 유용했다는 평이 많다."
      vi: "Nhập môn lý thuyết tội phạm học áp dụng vào các loại tội phạm. Có người thấy cuốn hút; nhiều người thấy bài giảng dài, khô và ít giúp cho bài tập, còn tutorial mới hữu ích."
      ms: "Pengenalan teori kriminologi yang digunakan pada pelbagai jenayah. Ada yang rasa menarik; ramai rasa kuliah panjang hambar dan kurang bantu tugasan, manakala tutorial bahagian berguna."
      id: "Pengantar teori kriminologi yang diterapkan pada berbagai kejahatan. Ada yang merasa menarik; banyak yang merasa kuliahnya panjang, kering, dan kurang membantu tugas, sedangkan tutorial yang berguna."
      hi: "क्रिमिनोलॉजी सिद्धांतों का परिचय, अलग-अलग अपराधों पर लागू। कुछ को रोचक लगा; कई को लंबे लेक्चर नीरस और असाइनमेंट में कम मददगार लगे, ट्यूटोरियल ही काम के थे।"
  work:
    - en: "Essays including a research essay, with a lot of freedom to choose your crime or topic. Several found this stressful but rewarding, and a few found the assessments easy."
      zh: "有几篇 essay，包括一篇研究型 essay，选题自由度很大。好几位觉得有压力但很有收获，也有几人觉得评估挺简单。"
      zh-TW: "有幾篇 essay，包括一篇研究型 essay，選題自由度很大。好幾位覺得有壓力但很有收穫，也有幾人覺得評量挺簡單。"
      ja: "研究エッセイを含むエッセイ課題で、扱う犯罪やテーマを自由に選べる。ストレスはあるがやりがいがあったという声が複数、簡単だったという人も数人。"
      ko: "연구 에세이를 포함한 에세이 과제로, 다룰 범죄나 주제를 자유롭게 고를 수 있다. 스트레스는 있지만 보람 있었다는 리뷰가 여럿, 쉬웠다는 사람도 몇 명."
      vi: "Các bài luận, gồm một bài nghiên cứu, rất tự do chọn loại tội phạm hay chủ đề. Vài người thấy căng nhưng đáng công, vài người thấy đánh giá khá dễ."
      ms: "Esei termasuk esei penyelidikan, dengan banyak kebebasan memilih jenayah atau topik. Beberapa rasa tertekan tetapi berbaloi, dan ada yang rasa penilaian mudah."
      id: "Esai termasuk esai riset, dengan kebebasan besar memilih kejahatan atau topik. Beberapa merasa menegangkan tapi memuaskan, dan ada yang merasa penilaiannya mudah."
      hi: "रिसर्च निबंध सहित निबंध, अपराध या विषय चुनने की काफ़ी आज़ादी। कई को तनाव भरा पर फ़ायदेमंद लगा, कुछ को मूल्यांकन आसान लगा।"
  study:
    - en: "Know the main theories of criminal behaviour and key definitions well, and argue clearly. Readings are heavy; tutorials help break them down."
      zh: "把犯罪行为的主要理论和关键定义掌握好，论证要清晰。阅读量大，tutorial 会帮你拆解。"
      zh-TW: "把犯罪行為的主要理論和關鍵定義掌握好，論證要清楚。閱讀量大，tutorial 會幫你拆解。"
      ja: "犯罪行動の主要理論と重要な定義をしっかり押さえ、明快に論じよう。文献は多いが、チュートリアルで噛み砕いてくれる。"
      ko: "범죄 행동의 주요 이론과 핵심 정의를 잘 익히고 명확하게 논증하자. 읽기가 많지만 튜토리얼에서 풀어 준다."
      vi: "Nắm vững các lý thuyết chính về hành vi phạm tội và định nghĩa quan trọng, lập luận rõ ràng. Bài đọc nhiều; tutorial giúp phân tích."
      ms: "Kuasai teori utama tingkah laku jenayah dan definisi penting, dan berhujah dengan jelas. Bacaan berat; tutorial membantu memecahkannya."
      id: "Kuasai teori utama perilaku kriminal dan definisi kunci, dan berargumen dengan jelas. Bacaannya berat; tutorial membantu menguraikannya."
      hi: "आपराधिक व्यवहार के मुख्य सिद्धांत और ज़रूरी परिभाषाएँ अच्छी तरह जानें, और साफ़ तर्क दें। रीडिंग भारी है; ट्यूटोरियल उन्हें समझाने में मदद करते हैं।"
  watch:
    - en: "Several reviews describe it under the name Crime, Criminology and Critique, so details may differ from the current version."
      zh: "好几条评价用的是 Crime, Criminology and Critique 这个名字，细节可能和现在的版本不同。"
      zh-TW: "好幾則評價用的是 Crime, Criminology and Critique 這個名稱，細節可能和現在的版本不同。"
      ja: "複数のレビューはCrime, Criminology and Critiqueという名称で書かれており、現行版と細部が異なる可能性がある。"
      ko: "여러 리뷰가 Crime, Criminology and Critique라는 이름으로 쓰여 있어 현재 버전과 세부 사항이 다를 수 있다."
      vi: "Vài đánh giá gọi môn là Crime, Criminology and Critique, nên chi tiết có thể khác bản hiện tại."
      ms: "Beberapa ulasan menyebutnya dengan nama Crime, Criminology and Critique, jadi butiran mungkin berbeza dari versi semasa."
      id: "Beberapa ulasan menyebutnya dengan nama Crime, Criminology and Critique, jadi detailnya mungkin berbeda dari versi sekarang."
      hi: "कई रिव्यू इसे Crime, Criminology and Critique नाम से बताते हैं, इसलिए मौजूदा संस्करण से ब्योरे अलग हो सकते हैं।"
difficulty: easy
