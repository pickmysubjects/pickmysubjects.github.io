reviews: 10
from: 2018
to: 2026
checked: 2026-10-17
points:
  - en: "Opinions are split: some enjoyed it as a good intro to criminology, but many found the lectures dry and only loosely linked to the assignments."
    zh: "评价两极：有人觉得是不错的犯罪学入门，但很多人认为讲座枯燥，与作业关系不大。"
    zh-TW: "評價兩極：有人覺得是不錯的犯罪學入門，但很多人認為講座枯燥，與作業關係不大。"
    ja: "意見は分かれる。犯罪学の良い入門として楽しんだ人もいるが、講義が退屈で課題とのつながりが薄いと感じた人が多い。"
    ko: "의견이 갈림. 좋은 범죄학 입문으로 즐긴 사람도 있지만, 강의가 지루하고 과제와 연결이 약하다는 의견이 많음."
    vi: "Ý kiến chia rẽ: có người thích vì là phần nhập môn tội phạm học tốt, nhưng nhiều người thấy bài giảng khô khan và ít liên quan đến bài tập."
    ms: "Pendapat berbelah: ada yang suka sebagai pengenalan kriminologi yang baik, tetapi ramai dapati kuliah hambar dan kurang berkait dengan tugasan."
    id: "Pendapat terbelah: sebagian menikmatinya sebagai pengantar kriminologi yang baik, tapi banyak yang merasa kuliahnya kering dan kurang terkait dengan tugas."
    hi: "राय बँटी है: कुछ को यह क्रिमिनोलॉजी का अच्छा परिचय लगा, पर कई को लेक्चर नीरस और असाइनमेंट से कम जुड़े लगे।"
  - en: "Weekly readings are heavy, but tutorials help unpack them. Essays give a lot of freedom to choose a crime or topic, which many liked."
    zh: "每周阅读量大，但辅导课会帮你拆解。论文可以自由选择犯罪类型或题目，很多人喜欢这一点。"
    zh-TW: "每週閱讀量大，但輔導課會幫你拆解。論文可以自由選擇犯罪類型或題目，很多人喜歡這一點。"
    ja: "毎週の文献は多いが、チュートリアルで理解を助けてくれる。エッセイは犯罪やテーマを自由に選べ、それを好む人が多い。"
    ko: "매주 읽을거리가 많지만 튜토리얼에서 풀어줌. 에세이는 범죄나 주제를 자유롭게 고를 수 있어 좋아한 사람이 많음."
    vi: "Bài đọc hằng tuần nhiều, nhưng tutorial giúp giải thích. Bài luận cho tự do chọn loại tội phạm hoặc chủ đề, nhiều người thích điều này."
    ms: "Bacaan mingguan banyak, tetapi tutorial membantu menghuraikannya. Esei memberi kebebasan memilih jenayah atau topik, yang ramai suka."
    id: "Bacaan mingguan banyak, tapi tutorial membantu menguraikannya. Esai memberi kebebasan memilih jenis kejahatan atau topik, yang disukai banyak orang."
    hi: "हर हफ़्ते की रीडिंग भारी है, पर ट्यूटोरियल उन्हें समझाने में मदद करते हैं। निबंधों में अपराध या विषय चुनने की काफ़ी आज़ादी है, जो कई लोगों को पसंद आई।"
  - en: "Several said a good mark is reachable without huge effort if you know the main theories and write clearly."
    zh: "好几人说只要掌握主要理论、写得清楚，不需太多努力也能拿到好成绩。"
    zh-TW: "好幾個人說只要掌握主要理論、寫得清楚，不需太多努力也能拿到好成績。"
    ja: "主要な理論を押さえて明確に書けば、大きな努力なしでも良い成績が取れるという声が複数。"
    ko: "주요 이론을 알고 명확하게 쓰면 큰 노력 없이도 좋은 점수가 가능하다는 의견이 여럿."
    vi: "Nhiều người nói có thể đạt điểm tốt mà không quá vất vả nếu nắm các lý thuyết chính và viết rõ ràng."
    ms: "Beberapa orang kata markah baik boleh dicapai tanpa usaha besar jika faham teori utama dan menulis dengan jelas."
    id: "Beberapa orang bilang nilai bagus bisa dicapai tanpa usaha besar jika paham teori utama dan menulis dengan jelas."
    hi: "कई लोगों ने कहा कि मुख्य सिद्धांत समझकर साफ़ लिखें तो बहुत मेहनत के बिना भी अच्छे अंक मिल सकते हैं।"
difficulty: easy
