points:
  - en: "Reviewers describe it as the most theoretical, maths-like computer science subject, well suited to those who enjoy theory."
    zh: "评价认为这是最偏理论、最像数学的计算机课程，适合喜欢理论的学生。"
    zh-TW: "評論者說這是最偏理論、最像數學的資工課，很適合喜歡理論的人。"
    ja: "最も理論的で数学に近いコンピュータサイエンスの科目と言われ、理論が好きな人に向いている。"
    ko: "가장 이론적이고 수학 같은 컴퓨터과학 과목이라 이론을 좋아하는 사람에게 잘 맞는다고 한다."
    vi: "Được mô tả là môn khoa học máy tính nặng lý thuyết và giống toán nhất, rất hợp với ai thích lý thuyết."
    ms: "Pengulas menggambarkannya sebagai subjek sains komputer paling teori dan seperti matematik, sesuai bagi yang suka teori."
    id: "Pengulas menyebutnya mata kuliah ilmu komputer paling teoretis dan paling mirip matematika, cocok bagi yang suka teori."
    hi: "रिव्यूअर्स इसे सबसे थ्योरी वाला, मैथ्स जैसा कंप्यूटर साइंस सब्जेक्ट बताते हैं, जो थ्योरी पसंद करने वालों के लिए अच्छा है।"
  - en: "Opinions on lecturing are split across years, but tutorials and extra materials were praised as helpful."
    zh: "不同年份对讲课评价不一，但辅导题和额外资料被称赞很有帮助。"
    zh-TW: "不同年份對講課評價不一，但輔導課和額外教材被稱讚很有幫助。"
    ja: "講義の評価は年によって分かれるが、チュートリアルと追加資料は役立つと好評。"
    ko: "강의 평가는 해마다 갈리지만, 튜토리얼과 추가 자료는 도움이 된다는 칭찬을 받았다."
    vi: "Ý kiến về bài giảng khác nhau theo năm, nhưng tutorial và tài liệu bổ sung được khen là hữu ích."
    ms: "Pandangan tentang kuliah berbeza mengikut tahun, tetapi tutorial dan bahan tambahan dipuji sebagai membantu."
    id: "Pendapat soal kuliah berbeda tiap tahun, tapi tutorial dan materi tambahan dipuji membantu."
    hi: "लेक्चर पर राय सालों के हिसाब से बंटी है, पर ट्यूटोरियल और अतिरिक्त मटेरियल की मददगार होने के लिए तारीफ़ हुई।"
  - en: "Assignments are challenging but fair, and there is a lot of content."
    zh: "作业有挑战但公平，课程内容较多。"
    zh-TW: "作業有挑戰但公平，內容也很多。"
    ja: "課題は難しいが公平で、内容も多い。"
    ko: "과제는 어렵지만 공정하고, 내용이 많다."
    vi: "Bài tập khó nhưng công bằng, và nội dung khá nhiều."
    ms: "Tugasan mencabar tetapi adil, dan kandungannya banyak."
    id: "Tugasnya menantang tapi adil, dan materinya banyak."
    hi: "असाइनमेंट कठिन पर निष्पक्ष हैं, और कंटेंट काफ़ी है।"
