reviews: 6
from: 2015
to: 2024
checked: 2026-10-08
points:
  - en: "Content is conceptually difficult and broad, and the exam tests applying knowledge (e.g. experimental design) rather than rote learning."
    zh: "内容概念难、范围广，考试侧重应用（如实验设计），而非死记硬背。"
    zh-TW: "內容概念難、範圍廣，考試重在應用（例如實驗設計），而不是死背。"
    ja: "内容は概念的に難しく範囲も広い。試験は丸暗記ではなく知識の応用（実験計画など）を問う。"
    ko: "내용이 개념적으로 어렵고 범위가 넓음. 시험은 암기보다 지식 적용(예: 실험 설계)을 평가함."
    vi: "Nội dung khó về khái niệm và rộng, đề thi kiểm tra khả năng vận dụng (như thiết kế thí nghiệm) chứ không học thuộc."
    ms: "Kandungan sukar dari segi konsep dan luas, dan peperiksaan menguji aplikasi ilmu (cth. reka bentuk eksperimen), bukan hafalan."
    id: "Materinya sulit secara konsep dan luas, ujiannya menguji penerapan (mis. desain eksperimen), bukan hafalan."
    hi: "कंटेंट कॉन्सेप्ट में कठिन और व्यापक है, एग्ज़ाम रटने की बजाय ज्ञान लागू करना (जैसे प्रयोग डिज़ाइन) परखता है।"
  - en: "Assessments were described as fair; one 2024 reviewer noted the assignments, MST and exam were open book."
    zh: "考核被认为公平；一位2024年的评论者提到作业、期中测验和期末考试均为开卷。"
    zh-TW: "考核被認為公平；一位2024年的評論者提到作業、期中測驗和期末考都是開書。"
    ja: "評価は公平とされた。2024年のレビューでは課題、中間テスト、期末試験がすべて持ち込み可だったとのこと。"
    ko: "평가는 공정하다는 평. 2024년 리뷰어는 과제, 중간시험, 기말시험이 모두 오픈북이었다고 함."
    vi: "Các bài đánh giá được cho là công bằng; một người năm 2024 cho biết bài tập, giữa kỳ và thi cuối đều được mở tài liệu."
    ms: "Penilaian dianggap adil; seorang pengulas 2024 menyatakan tugasan, ujian pertengahan semester dan peperiksaan adalah buku terbuka."
    id: "Penilaian dinilai adil; satu pengulas 2024 menyebut tugas, ujian tengah semester, dan ujian akhir bersifat open book."
    hi: "असेसमेंट निष्पक्ष बताए गए; 2024 के एक रिव्यूअर ने कहा कि असाइनमेंट, मिड-सेमेस्टर टेस्ट और एग्ज़ाम ओपन बुक थे।"
  - en: "Several reviewers found some lecture videos hard to follow and organisation patchy at times."
    zh: "几位评论者认为部分讲课视频难以理解，课程组织有时不够完善。"
    zh-TW: "好幾位評論者覺得部分講課影片很難跟上，課程安排有時也不夠完善。"
    ja: "講義動画の一部がわかりにくく、運営が不十分なときもあったという人が何人かいた。"
    ko: "여러 리뷰어가 일부 강의 영상이 따라가기 어렵고 운영이 가끔 허술했다고 함."
    vi: "Vài người thấy một số video bài giảng khó theo và việc tổ chức đôi khi lộn xộn."
    ms: "Beberapa pengulas dapati sesetengah video kuliah sukar difahami dan pengurusan kadang-kadang kurang teratur."
    id: "Beberapa pengulas merasa sebagian video kuliah sulit diikuti dan pengaturannya kadang kurang rapi."
    hi: "कई रिव्यूअर को कुछ लेक्चर वीडियो समझने में कठिन लगे और व्यवस्था कभी-कभी अधूरी लगी।"
  - en: "Tutorials are hands-on and collaborative (e.g. building protein models); one noted using PyMOL can be frustrating."
    zh: "辅导课注重动手与合作（如搭建蛋白质模型）；有人提到使用PyMOL比较麻烦。"
    zh-TW: "輔導課重動手和合作（例如做蛋白質模型）；有人提到用PyMOL會讓人很挫折。"
    ja: "チュートリアルは実践的で協力型（タンパク質モデルの作成など）。PyMOLの操作にイライラしたという声も。"
    ko: "튜토리얼은 실습형·협업형(예: 단백질 모델 만들기). PyMOL 사용이 답답할 수 있다는 의견도 있음."
    vi: "Tutorial mang tính thực hành và hợp tác (như dựng mô hình protein); có người nói dùng PyMOL khá bực mình."
    ms: "Tutorial bersifat amali dan kolaboratif (cth. membina model protein); ada yang kata guna PyMOL boleh mengecewakan."
    id: "Tutorial bersifat praktik dan kolaboratif (mis. membuat model protein); ada yang bilang memakai PyMOL bisa bikin frustrasi."
    hi: "ट्यूटोरियल हैंड्स-ऑन और मिलजुलकर होते हैं (जैसे प्रोटीन मॉडल बनाना); एक ने कहा PyMOL इस्तेमाल करना परेशान कर सकता है।"
sections:
  content:
    - en: "Protein folding and misfolding, and how cryo-EM, X-ray crystallography, NMR and mass spec reveal structure. Reviewers found it interesting and conceptually hard, with the exam testing application, e.g. experiment design."
      zh: "讲蛋白质折叠与错误折叠，以及冷冻电镜、X 射线晶体学、NMR 和质谱怎么解析结构。同学觉得有意思但概念难，期末考应用，比如实验设计。"
      zh-TW: "講蛋白質摺疊與錯誤摺疊，以及冷凍電鏡、X 光晶體學、NMR 和質譜怎麼解析結構。同學覺得有意思但概念難，期末考應用，例如實驗設計。"
      ja: "タンパク質のフォールディングとミスフォールディング、クライオ電顕・X線結晶構造解析・NMR・質量分析による構造解明。面白いが概念的に難しく、試験は実験計画などの応用を問う。"
      ko: "단백질 접힘과 잘못 접힘, 그리고 cryo-EM, X선 결정학, NMR, 질량분석으로 구조를 밝히는 법. 흥미롭지만 개념적으로 어렵고, 시험은 실험 설계 같은 응용을 묻는다."
      vi: "Gấp cuộn và gấp sai protein, cách cryo-EM, tinh thể học tia X, NMR và khối phổ cho thấy cấu trúc. Người học thấy thú vị, khái niệm khó, bài thi hỏi ứng dụng như thiết kế thí nghiệm."
      ms: "Lipatan dan salah lipatan protein, serta cara cryo-EM, kristalografi sinar-X, NMR dan spektrometri jisim mendedahkan struktur. Menarik tetapi sukar, peperiksaan menguji aplikasi seperti reka bentuk eksperimen."
      id: "Pelipatan dan salah lipat protein, serta cara cryo-EM, kristalografi sinar-X, NMR dan spektrometri massa mengungkap struktur. Menarik tapi sulit, ujian menguji penerapan seperti desain eksperimen."
      hi: "प्रोटीन फ़ोल्डिंग और मिसफ़ोल्डिंग, और cryo-EM, X-ray क्रिस्टलोग्राफ़ी, NMR व मास स्पेक से संरचना कैसे पता चलती है। रोचक पर कॉन्सेप्ट में कठिन, परीक्षा प्रयोग डिज़ाइन जैसे उपयोग जाँचती है।"
  work:
    - en: "Small, roughly weekly assessments instead of a big essay, plus an MST and exam reviewers call difficult but fair. One 2024 reviewer says everything is open book; using PyMOL was a pain."
      zh: "没有大论文，而是差不多每周的小考核，加上 MST 和期末，同学说难但公平。一位 2024 年的同学说所有考核都开卷；用 PyMOL 很折腾。"
      zh-TW: "沒有大論文，而是差不多每週的小考核，加上 MST 和期末，同學說難但公平。一位 2024 年的同學說所有考核都開書；用 PyMOL 很折騰。"
      ja: "大きなエッセイではなく、ほぼ毎週の小課題とMST・期末試験。難しいが公平という。2024年の一人は全部オープンブックだと言い、PyMOLは面倒だったという。"
      ko: "큰 에세이 대신 거의 매주 작은 평가와 MST, 기말이 있으며 어렵지만 공정하다는 평. 2024년 한 리뷰는 모두 오픈북이라고 하며, PyMOL 사용이 번거로웠다고 한다."
      vi: "Thay vì bài luận lớn là các bài nhỏ gần như hằng tuần, cộng MST và thi cuối, được cho là khó nhưng công bằng. Một người năm 2024 nói tất cả đều mở tài liệu; dùng PyMOL rất mệt."
      ms: "Penilaian kecil hampir mingguan dan bukan esei besar, serta MST dan peperiksaan yang sukar tetapi adil. Seorang pengulas 2024 kata semuanya buku terbuka; guna PyMOL menyusahkan."
      id: "Penilaian kecil hampir mingguan alih-alih esai besar, plus MST dan ujian yang sulit tapi adil. Satu pengulas 2024 bilang semuanya buku terbuka; memakai PyMOL merepotkan."
      hi: "बड़े निबंध की जगह लगभग साप्ताहिक छोटे आकलन, साथ में MST और परीक्षा जिन्हें कठिन पर उचित कहा गया। 2024 का एक रिव्यूअर कहता है सब ओपन-बुक है; PyMOL इस्तेमाल करना झंझट था।"
  watch:
    - en: "Several reviewers found the organisation messy, with late uploads and slow forum replies. Tutorials are hands-on, so work with classmates."
      zh: "好几位同学觉得组织混乱，上传迟、论坛回复慢。tutorial 动手多，要和同学合作。"
      zh-TW: "好幾位同學覺得組織混亂，上傳遲、論壇回覆慢。tutorial 動手多，要和同學合作。"
      ja: "アップロードの遅れや掲示板の返信の遅さなど、運営が雑だという声が複数。チュートリアルは手を動かすので仲間と協力すること。"
      ko: "업로드 지연과 느린 포럼 답변 등 운영이 엉성했다는 평이 여럿. 튜토리얼은 실습 위주라 동료와 협력해야 한다."
      vi: "Nhiều người thấy tổ chức lộn xộn, tải bài muộn và trả lời diễn đàn chậm. Tutorial nhiều thực hành nên hãy làm cùng bạn."
      ms: "Beberapa pengulas rasa penyusunan berselerak, muat naik lewat dan balasan forum lambat. Tutorial banyak aktiviti tangan, jadi bekerjasama dengan rakan."
      id: "Beberapa pengulas merasa pengaturannya berantakan, unggahan terlambat dan balasan forum lambat. Tutorial banyak praktik, jadi bekerja sama dengan teman."
      hi: "कई रिव्यूअर्स को व्यवस्था बिखरी लगी, देर से अपलोड और फ़ोरम पर धीमे जवाब। ट्यूटोरियल में हाथ से काम होता है, इसलिए साथियों के साथ मिलकर करें।"
difficulty: hard
