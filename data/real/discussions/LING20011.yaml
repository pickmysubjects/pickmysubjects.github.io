code: LING20011
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/ling20011
reviews: 5
from: 2016
to: 2021
checked: 2026-10-17
points:
  - en: "Lectures, tutorial exercises, assignments and the exam are closely linked, and topics build week by week, so keep up and ask for help early. Reviewers praised the teaching."
    zh: "讲座、辅导练习、作业和考试紧密相连，主题每周递进，所以要跟上并尽早求助。评论者称赞教学质量。"
    zh-TW: "講座、輔導練習、作業和考試緊密相連，主題每週遞進，所以要跟上並儘早求助。評論者稱讚教學品質。"
    ja: "講義・チュートリアル演習・課題・試験が密接につながり、毎週積み重なるので、遅れずに早めに助けを求めること。教え方は好評。"
    ko: "강의, 튜토리얼 연습, 과제, 시험이 긴밀히 연결되고 매주 내용이 쌓이므로 따라가며 일찍 도움을 구할 것. 강의는 호평."
    vi: "Bài giảng, bài tập tutorial, bài tập lớn và bài thi liên kết chặt, chủ đề nối tiếp từng tuần, nên hãy theo kịp và hỏi sớm. Người đánh giá khen cách dạy."
    ms: "Kuliah, latihan tutorial, tugasan dan peperiksaan berkait rapat, dan topik membina setiap minggu, jadi ikut rentak dan minta bantuan awal. Pengulas memuji pengajarannya."
    id: "Kuliah, latihan tutorial, tugas dan ujian saling terkait erat, dan topik membangun tiap minggu, jadi ikuti terus dan minta bantuan sejak awal. Pengulas memuji pengajarannya."
    hi: "लेक्चर, ट्यूटोरियल अभ्यास, असाइनमेंट और एग्ज़ाम आपस में गहराई से जुड़े हैं और टॉपिक हर हफ़्ते आगे बढ़ते हैं, इसलिए साथ चलें और जल्दी मदद माँगें। रिव्यूअर्स ने पढ़ाई की तारीफ़ की।"
  - en: "Earlier reviews (2016-2019) called it straightforward to do well, but the 2021 reviewer found it much harder than expected. Taking it before LING20006 Syntax is strongly recommended."
    zh: "早期评论（2016-2019）说拿好成绩不难，但2021年的评论者觉得比预期难得多。强烈建议在LING20006句法学之前修。"
    zh-TW: "早期評論（2016-2019）說拿好成績不難，但2021年的評論者覺得比預期難得多。強烈建議在LING20006句法學之前修。"
    ja: "以前のレビュー（2016-2019）は好成績を取りやすいとしたが、2021年のレビューでは予想よりずっと難しかったという。LING20006（統語論）の前に取ることが強く勧められている。"
    ko: "예전 리뷰(2016-2019)는 좋은 성적 받기 무난하다고 했지만, 2021년 리뷰어는 예상보다 훨씬 어려웠다고 함. LING20006 통사론 전에 들을 것을 강력 추천."
    vi: "Đánh giá cũ (2016-2019) nói dễ đạt điểm tốt, nhưng người năm 2021 thấy khó hơn nhiều so với dự kiến. Rất nên học trước LING20006 Cú pháp."
    ms: "Ulasan awal (2016-2019) kata mudah dapat markah baik, tetapi pengulas 2021 dapati jauh lebih sukar daripada dijangka. Sangat disyorkan ambil sebelum LING20006 Sintaksis."
    id: "Ulasan awal (2016-2019) bilang mudah dapat nilai bagus, tapi pengulas 2021 merasa jauh lebih sulit dari perkiraan. Sangat disarankan diambil sebelum LING20006 Sintaksis."
    hi: "पुराने रिव्यू (2016-2019) ने अच्छे अंक पाना आसान बताया, पर 2021 के रिव्यूअर को यह उम्मीद से बहुत कठिन लगा। LING20006 सिंटैक्स से पहले इसे लेने की ज़ोरदार सलाह है।"
sections:
  content:
    - en: "English grammar, well structured, with lectures, tutorial exercises, assignments and exam closely linked. Each week builds on the last. Earlier reviewers found it straightforward; a 2021 reviewer found it tough."
      zh: "讲英语语法，结构清楚，讲课、tutorial 练习、作业和期末紧密相关。每周内容层层递进。早期同学觉得不难；一位 2021 年的同学觉得挺难。"
      zh-TW: "講英語文法，架構清楚，講課、tutorial 練習、作業和期末緊密相關。每週內容層層遞進。早期同學覺得不難；一位 2021 年的同學覺得蠻難。"
      ja: "英文法を扱い、構成がしっかりしていて講義・チュートリアル演習・課題・試験が密接につながる。毎週積み上がる。以前は素直という声、2021年の一人は難しかったと言う。"
      ko: "영문법을 다루며 구성이 탄탄하고 강의, 튜토리얼 연습, 과제, 시험이 긴밀히 연결된다. 매주 내용이 쌓인다. 예전엔 무난하다는 평, 2021년 한 리뷰는 어려웠다고 한다."
      vi: "Ngữ pháp tiếng Anh, cấu trúc rõ, bài giảng, bài tập tutorial, bài tập lớn và thi liên kết chặt. Mỗi tuần xây trên tuần trước. Người học trước thấy dễ theo; một người năm 2021 thấy khó."
      ms: "Tatabahasa Inggeris, tersusun baik, dengan kuliah, latihan tutorial, tugasan dan peperiksaan berkait rapat. Setiap minggu dibina atas yang sebelumnya. Pengulas awal rasa mudah; seorang pengulas 2021 rasa sukar."
      id: "Tata bahasa Inggris, terstruktur baik, dengan kuliah, latihan tutorial, tugas dan ujian saling terkait. Tiap minggu dibangun di atas minggu sebelumnya. Pengulas awal merasa lugas; satu pengulas 2021 merasa sulit."
      hi: "अंग्रेज़ी व्याकरण, अच्छी संरचना के साथ, जिसमें लेक्चर, ट्यूटोरियल अभ्यास, असाइनमेंट और परीक्षा आपस में जुड़े हैं। हर हफ़्ता पिछले पर टिका है। पहले वालों को सीधा लगा; 2021 के एक को कठिन।"
  work:
    - en: "Weekly tutorial exercises, two assignments and an exam. One 2021 reviewer with a high WAM got an H3 and found the online exam very hard."
      zh: "每周 tutorial 练习、两个作业和一场期末。一位 WAM 很高的 2021 年同学只拿了 H3，觉得线上期末非常难。"
      zh-TW: "每週 tutorial 練習、兩份作業和一場期末。一位 WAM 很高的 2021 年同學只拿了 H3，覺得線上期末非常難。"
      ja: "毎週のチュートリアル演習、課題2つ、試験。WAMの高い2021年の一人はH3で、オンライン試験がとても難しかったという。"
      ko: "매주 튜토리얼 연습, 과제 2개, 시험. WAM이 높은 2021년 한 리뷰는 H3를 받았고 온라인 시험이 매우 어려웠다고 한다."
      vi: "Bài tập tutorial hằng tuần, hai bài tập lớn và thi. Một người năm 2021 có WAM cao chỉ được H3 và thấy bài thi online rất khó."
      ms: "Latihan tutorial mingguan, dua tugasan dan peperiksaan. Seorang pengulas 2021 dengan WAM tinggi dapat H3 dan rasa peperiksaan dalam talian sangat sukar."
      id: "Latihan tutorial mingguan, dua tugas dan ujian. Satu pengulas 2021 dengan WAM tinggi dapat H3 dan merasa ujian daring sangat sulit."
      hi: "साप्ताहिक ट्यूटोरियल अभ्यास, दो असाइनमेंट और एक परीक्षा। ऊँचे WAM वाले 2021 के एक रिव्यूअर को H3 मिला और ऑनलाइन परीक्षा बहुत कठिन लगी।"
  study:
    - en: "Do the textbook readings and tutorial activities before class so you can ask questions, and don't fall behind. One reviewer says take it before Syntax if you're doing that next."
      zh: "课前完成课本阅读和 tutorial 练习，这样能提问；不要落下。有同学说如果之后要上 Syntax，一定先修这门。"
      zh-TW: "課前完成課本閱讀和 tutorial 練習，這樣能提問；不要落後。有同學說如果之後要修 Syntax，一定先修這門。"
      ja: "教科書のリーディングとチュートリアル課題は授業前に済ませて質問できるようにし、遅れないこと。次にSyntaxを取るなら先にこれを取るよう勧める人も。"
      ko: "교재 리딩과 튜토리얼 활동을 수업 전에 해서 질문할 수 있게 하고 뒤처지지 말 것. 다음에 Syntax를 듣는다면 이걸 먼저 들으라는 리뷰도 있다."
      vi: "Đọc giáo trình và làm hoạt động tutorial trước buổi học để có thể hỏi, và đừng tụt lại. Một người nói nếu sắp học Syntax thì nên học môn này trước."
      ms: "Buat bacaan buku teks dan aktiviti tutorial sebelum kelas supaya boleh bertanya, dan jangan ketinggalan. Seorang kata ambil ini sebelum Syntax jika anda akan mengambilnya."
      id: "Kerjakan bacaan buku dan aktivitas tutorial sebelum kelas agar bisa bertanya, dan jangan tertinggal. Satu bilang ambil ini sebelum Syntax jika akan mengambilnya."
      hi: "कक्षा से पहले पाठ्यपुस्तक की रीडिंग और ट्यूटोरियल गतिविधियाँ करें ताकि सवाल पूछ सकें, और पीछे न रहें। एक कहता है अगर आगे Syntax लेना है तो पहले यह लें।"
  watch:
    - en: "All these reviews are from 2021 or earlier; teaching and exams may have changed since."
      zh: "这些评价都是 2021 年或更早的，现在的教法和考试可能已经变了。"
      zh-TW: "這些評價都是 2021 年或更早的，現在的教法和考試可能已經變了。"
      ja: "レビューはすべて2021年以前のもの。授業や試験は変わっている可能性がある。"
      ko: "모든 리뷰가 2021년 이전 것이라 지금 수업과 시험은 달라졌을 수 있다."
      vi: "Tất cả đánh giá đều từ năm 2021 trở về trước; cách dạy và thi có thể đã thay đổi."
      ms: "Semua ulasan ini dari 2021 atau lebih awal; pengajaran dan peperiksaan mungkin telah berubah."
      id: "Semua ulasan ini dari 2021 atau sebelumnya; pengajaran dan ujian mungkin sudah berubah."
      hi: "ये सभी रिव्यू 2021 या उससे पहले के हैं; पढ़ाई और परीक्षा अब बदल चुकी हो सकती है।"
difficulty: hard
