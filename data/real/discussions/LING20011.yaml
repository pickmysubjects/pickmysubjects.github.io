points:
  - en: "Lectures, tutorial exercises, assignments and the exam are closely linked, and topics build week by week, so keep up and ask for help early. Reviewers praised the teaching."
    zh: "讲座、辅导练习、作业和考试紧密相连，主题每周递进，所以要跟上并尽早求助。评论者称赞教学质量。"
    zh-TW: "講座、輔導練習、作業和考試緊密相連，主題每週遞進，所以要跟上並儘早求助。評論者稱讚教學品質。"
    ja: "講義・チュートリアル演習・課題・試験が密接につながり、毎週積み重なるので、遅れずに早めに助けを求めること。教え方は好評。"
    ko: "강의, 튜토리얼 연습, 과제, 시험이 긴밀히 연결되고 매주 내용이 쌓이므로 따라가며 일찍 도움을 구할 것. 강의는 호평."
    vi: "Bài giảng, bài tập tutorial, bài tập lớn và bài thi liên kết chặt, chủ đề nối tiếp từng tuần, nên hãy theo kịp và hỏi sớm. Người đánh giá khen cách dạy."
    ms: "Kuliah, latihan tutorial, tugasan dan peperiksaan berkait rapat, dan topik membina setiap minggu, jadi ikut rentak dan minta bantuan awal. Pengulas memuji pengajarannya."
    id: "Kuliah, latihan tutorial, tugas dan ujian saling terkait erat, dan topik membangun tiap minggu, jadi ikuti terus dan minta bantuan sejak awal. Pengulas memuji pengajarannya."
    hi: "लेक्चर, ट्यूटोरियल अभ्यास, असाइनमेंट और एग्ज़ाम आपस में गहराई से जुड़े हैं और टॉपिक हर हफ़्ते आगे बढ़ते हैं, इसलिए साथ चलें और जल्दी मदद माँगें। रिव्यूअर्स ने पढ़ाई की तारीफ़ की।"
  - en: "Earlier reviews (2016-2019) called it straightforward to do well, but the 2021 reviewer found it much harder than expected. Taking it before LING20006 Syntax is strongly recommended."
    zh: "早期评论（2016-2019）说拿好成绩不难，但2021年的评论者觉得比预期难得多。强烈建议在LING20006句法学之前修。"
    zh-TW: "早期評論（2016-2019）說拿好成績不難，但2021年的評論者覺得比預期難得多。強烈建議在LING20006句法學之前修。"
    ja: "以前のレビュー（2016-2019）は好成績を取りやすいとしたが、2021年のレビューでは予想よりずっと難しかったという。LING20006（統語論）の前に取ることが強く勧められている。"
    ko: "예전 리뷰(2016-2019)는 좋은 성적 받기 무난하다고 했지만, 2021년 리뷰어는 예상보다 훨씬 어려웠다고 함. LING20006 통사론 전에 들을 것을 강력 추천."
    vi: "Đánh giá cũ (2016-2019) nói dễ đạt điểm tốt, nhưng người năm 2021 thấy khó hơn nhiều so với dự kiến. Rất nên học trước LING20006 Cú pháp."
    ms: "Ulasan awal (2016-2019) kata mudah dapat markah baik, tetapi pengulas 2021 dapati jauh lebih sukar daripada dijangka. Sangat disyorkan ambil sebelum LING20006 Sintaksis."
    id: "Ulasan awal (2016-2019) bilang mudah dapat nilai bagus, tapi pengulas 2021 merasa jauh lebih sulit dari perkiraan. Sangat disarankan diambil sebelum LING20006 Sintaksis."
    hi: "पुराने रिव्यू (2016-2019) ने अच्छे अंक पाना आसान बताया, पर 2021 के रिव्यूअर को यह उम्मीद से बहुत कठिन लगा। LING20006 सिंटैक्स से पहले इसे लेने की ज़ोरदार सलाह है।"
difficulty: hard
