points:
  - en: "Value depends heavily on where you do your internship, so choose your organisation carefully."
    zh: "收获很大程度取决于实习单位，要谨慎选择。"
    zh-TW: "收穫很大程度取決於實習單位，要謹慎選擇。"
    ja: "得られるものはインターン先に大きく左右されるので、受け入れ先は慎重に選びましょう。"
    ko: "얻는 것은 인턴십 기관에 크게 좌우되니 신중하게 고르세요."
    vi: "Giá trị môn học phụ thuộc nhiều vào nơi thực tập, nên hãy chọn tổ chức cẩn thận."
    ms: "Nilainya banyak bergantung pada tempat latihan amali anda, jadi pilih organisasi dengan teliti."
    id: "Manfaatnya sangat tergantung tempat magangmu, jadi pilih organisasi dengan cermat."
    hi: "इसका फायदा काफी हद तक इस पर निर्भर है कि आप इंटर्नशिप कहाँ करते हैं, इसलिए संस्था सोच-समझकर चुनें।"
  - en: "Assessments are reflective tasks such as a case study, presentation and essay. Several found the instructions vague."
    zh: "考核为反思类任务，如案例分析、展示和论文，多人觉得要求模糊。"
    zh-TW: "考核為反思類任務，如個案分析、報告和論文，多人覺得要求模糊。"
    ja: "評価はケーススタディ、発表、エッセイなどの振り返り課題です。指示があいまいだという人が複数います。"
    ko: "평가는 사례 연구, 발표, 에세이 같은 성찰 과제입니다. 안내가 모호하다는 사람이 여럿입니다."
    vi: "Bài đánh giá là các bài suy ngẫm như case study, thuyết trình và bài luận. Một số người thấy hướng dẫn mơ hồ."
    ms: "Penilaian ialah tugasan reflektif seperti kajian kes, pembentangan dan esei. Beberapa dapati arahan kabur."
    id: "Penilaian berupa tugas reflektif seperti studi kasus, presentasi, dan esai. Beberapa merasa instruksinya kabur."
    hi: "असेसमेंट रिफ्लेक्टिव टास्क हैं, जैसे केस स्टडी, प्रेज़ेंटेशन और निबंध। कई लोगों को निर्देश अस्पष्ट लगे।"
  - en: "Marking views are split: some got high H1s with little effort, others found marking arbitrary and ended with H2B."
    zh: "对评分看法不一：有人轻松拿高H1，也有人觉得评分随意、只拿到H2B。"
    zh-TW: "對評分看法不一：有人輕鬆拿高H1，也有人覺得評分隨意、只拿到H2B。"
    ja: "採点の評価は分かれ、少ない努力で高いH1を取った人もいれば、採点が恣意的でH2Bに終わった人もいます。"
    ko: "채점 의견은 갈립니다. 적은 노력으로 높은 H1을 받은 사람도 있고, 채점이 자의적이라 H2B로 끝난 사람도 있습니다."
    vi: "Ý kiến về chấm điểm trái chiều: có người đạt H1 cao mà ít công sức, người khác thấy chấm tùy tiện và chỉ được H2B."
    ms: "Pandangan tentang pemarkahan berbelah bahagi: ada yang dapat H1 tinggi dengan sedikit usaha, ada yang dapati pemarkahan sewenang-wenang dan berakhir dengan H2B."
    id: "Pendapat soal penilaian terbelah: ada yang dapat H1 tinggi dengan sedikit usaha, ada yang merasa penilaiannya asal-asalan dan berakhir H2B."
    hi: "मार्किंग पर राय बँटी है: कुछ को कम मेहनत में ऊँचा H1 मिला, दूसरों को मार्किंग मनमानी लगी और H2B मिला।"
sections:
  content:
    - en: "A credit-bearing internship, often done over summer. Reviewers say the experience depends mostly on where you are placed, and it is good for your resume and contacts."
      zh: "可以拿学分的实习，常在暑期完成。同学说体验主要看你被安排到哪里，对简历和人脉都有帮助。"
      zh-TW: "可以拿學分的實習，常在暑期完成。同學說體驗主要看你被安排到哪裡，對履歷和人脈都有幫助。"
      ja: "単位になるインターンシップで、夏に行うことが多い。経験の質は主に配属先次第で、履歴書や人脈にも役立つという。"
      ko: "학점이 인정되는 인턴십으로 여름에 하는 경우가 많다. 경험은 주로 배치되는 곳에 달려 있고, 이력서와 인맥에 도움이 된다는 평."
      vi: "Kỳ thực tập có tính tín chỉ, thường làm vào hè. Người học nói trải nghiệm phụ thuộc chủ yếu vào nơi bạn được nhận, và tốt cho CV cùng các mối quan hệ."
      ms: "Latihan industri berkredit, selalunya pada musim panas. Pengulas kata pengalaman bergantung terutamanya pada tempat penempatan, dan baik untuk resume serta kenalan."
      id: "Magang yang bernilai SKS, sering dilakukan saat musim panas. Pengulas bilang pengalamannya sangat bergantung pada tempat penempatan, dan bagus untuk CV serta relasi."
      hi: "क्रेडिट वाली इंटर्नशिप, अक्सर गर्मियों में। रिव्यूअर्स कहते हैं अनुभव मुख्य रूप से इस पर निर्भर है कि आपको कहाँ भेजा गया, और यह रिज़्यूमे व संपर्कों के लिए अच्छा है।"
  work:
    - en: "A case study interviewing someone in the field, a log book, a presentation and a reflective essay of about 2,000 words. Your grade comes from these, not from how well the placement went."
      zh: "包括采访业内人士的案例研究、工作日志、一次展示和约 2000 字的反思论文。成绩来自这些作业，而不是实习表现本身。"
      zh-TW: "包括訪談業界人士的個案研究、工作日誌、一次報告和約 2000 字的反思論文。成績來自這些作業，而不是實習表現本身。"
      ja: "業界の人に話を聞くケーススタディ、ログブック、発表、約2,000語の振り返りエッセイ。成績は実習の出来ではなくこれらで決まる。"
      ko: "현직자를 인터뷰하는 사례 연구, 로그북, 발표, 약 2,000단어 성찰 에세이가 있다. 성적은 실습 성과가 아니라 이 과제들로 매겨진다."
      vi: "Một case study phỏng vấn người trong ngành, sổ nhật ký, bài thuyết trình và bài luận suy ngẫm khoảng 2.000 từ. Điểm dựa vào các bài này, không phải kết quả thực tập."
      ms: "Kajian kes menemu bual orang dalam bidang, buku log, pembentangan dan esei refleksi kira-kira 2,000 perkataan. Gred datang daripada ini, bukan prestasi penempatan."
      id: "Studi kasus mewawancarai orang di bidangnya, buku log, presentasi dan esai refleksi sekitar 2.000 kata. Nilaimu berasal dari tugas ini, bukan dari seberapa baik magangnya."
      hi: "क्षेत्र के किसी व्यक्ति से बातचीत वाली केस स्टडी, लॉग बुक, प्रेज़ेंटेशन और लगभग 2,000 शब्दों का चिंतनशील निबंध। ग्रेड इन्हीं से मिलता है, प्लेसमेंट कितना अच्छा रहा उससे नहीं।"
  study:
    - en: "Choose your placement carefully, and follow the rubric closely, linking your degree to the career in the reflective tasks."
      zh: "实习单位要慎选；严格按评分标准写，在反思类作业里把专业和职业联系起来。"
      zh-TW: "實習單位要慎選；嚴格照評分標準寫，在反思類作業裡把主修和職涯連結起來。"
      ja: "配属先は慎重に選び、ルーブリックに忠実に従い、振り返り課題では学位とキャリアを結びつける。"
      ko: "배치처를 신중히 고르고, 루브릭을 꼼꼼히 따르며, 성찰 과제에서 전공과 진로를 연결하라."
      vi: "Chọn nơi thực tập cẩn thận, bám sát rubric, và liên hệ ngành học với nghề nghiệp trong các bài suy ngẫm."
      ms: "Pilih tempat penempatan dengan teliti, dan ikut rubrik dengan rapat, kaitkan ijazah anda dengan kerjaya dalam tugasan refleksi."
      id: "Pilih tempat magang dengan cermat, dan ikuti rubrik dengan teliti, kaitkan jurusanmu dengan karier di tugas refleksi."
      hi: "प्लेसमेंट सोच-समझकर चुनें, और रूब्रिक ध्यान से मानें, चिंतन वाले कामों में अपनी डिग्री को करियर से जोड़ें।"
  watch:
    - en: "Reviewers disagree on marking: some found it generous and a WAM booster, others found the tasks vague and the marking arbitrary enough to pull their WAM down."
      zh: "对评分看法不一：有人觉得给分大方、能刷分，也有人觉得任务含糊、评分随意，反而拉低了 WAM。"
      zh-TW: "對評分看法分歧：有人覺得給分大方、能拉分，也有人覺得任務含糊、評分隨意，反而拉低了 WAM。"
      ja: "採点の評価は割れる。甘くてWAMが上がるという声と、課題が曖昧で採点が恣意的、WAMが下がったという声がある。"
      ko: "채점 평가가 엇갈린다. 후해서 WAM이 오른다는 의견과, 과제가 모호하고 채점이 자의적이라 WAM이 떨어졌다는 의견이 있다."
      vi: "Ý kiến về chấm điểm trái ngược: có người thấy rộng rãi, kéo được WAM; người khác thấy đề mơ hồ, chấm tùy tiện đến mức làm tụt WAM."
      ms: "Pengulas tidak sepakat tentang pemarkahan: ada yang rasa murah hati dan penaik WAM, ada yang rasa tugasan kabur dan pemarkahan sewenang-wenang sehingga menurunkan WAM."
      id: "Pengulas tidak sepakat soal penilaian: ada yang merasa murah hati dan pendongkrak WAM, ada yang merasa tugasnya kabur dan penilaiannya asal sampai menurunkan WAM."
      hi: "मार्किंग पर राय बँटी है: कुछ को यह उदार और WAM बूस्टर लगी, दूसरों को काम अस्पष्ट और मार्किंग इतनी मनमानी लगी कि WAM गिर गया।"
difficulty: mixed
