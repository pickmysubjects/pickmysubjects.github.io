code: FREN20004
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/fren20004
reviews: 6
from: 2016
to: 2022
checked: 2026-10-17
points:
  - en: "Reviewers from 2017 to 2022 saw it as one of the easier French subjects to score well in, since all tests translate from French into English; 2021 class averages were around 80."
    zh: "2017到2022年的评论者认为这是较容易拿高分的法语课，因为所有测试都是法译英；2021年班级平均分约80。"
    zh-TW: "2017到2022年的評論者認為這是較容易拿高分的法語課，因為所有測驗都是法譯英；2021年班級平均分約80。"
    ja: "2017〜2022年の評者は、試験がすべて仏→英翻訳なので高得点を取りやすいフランス語科目の一つと見ている。2021年のクラス平均は約80。"
    ko: "2017~2022년 리뷰어들은 모든 시험이 불→영 번역이라 고득점이 쉬운 편인 프랑스어 과목으로 봄. 2021년 반 평균은 약 80."
    vi: "Người đánh giá 2017–2022 coi đây là môn tiếng Pháp dễ lấy điểm cao, vì mọi bài kiểm tra đều dịch Pháp sang Anh; trung bình lớp năm 2021 khoảng 80."
    ms: "Pengulas 2017 hingga 2022 melihatnya antara subjek Perancis yang lebih mudah dapat markah tinggi kerana semua ujian menterjemah dari Perancis ke Inggeris; purata kelas 2021 sekitar 80."
    id: "Pengulas 2017 sampai 2022 melihatnya sebagai salah satu mata kuliah Prancis yang lebih mudah dapat nilai tinggi karena semua tes menerjemahkan Prancis ke Inggris; rata-rata kelas 2021 sekitar 80."
    hi: "2017 से 2022 के रिव्यूअर्स ने इसे ऊँचे अंक पाने में आसान फ़्रेंच सब्जेक्ट माना, क्योंकि सभी टेस्ट फ़्रेंच से अंग्रेज़ी अनुवाद हैं; 2021 में क्लास औसत लगभग 80 था।"
  - en: "Lectures were widely seen as of little use apart from guest talks by working translators. The two-hour tutorials of hands-on translation with quick feedback are where the learning happens, though they can be tiring."
    zh: "讲课普遍被认为用处不大，只有职业译者的客座讲座比较好。两小时的辅导课动手翻译、即时反馈，是真正学东西的地方，但也挺累。"
    zh-TW: "講課普遍被認為用處不大，只有職業譯者的客座講座比較好。兩小時的輔導課動手翻譯、即時回饋，是真正學東西的地方，但也挺累。"
    ja: "講義はプロ翻訳者のゲスト講演以外あまり役に立たないという声が多い。2時間のチュートリアルで実際に訳しすぐフィードバックをもらうのが学びの中心だが、疲れることもある。"
    ko: "강의는 현직 번역가 초청 강연 외엔 별 도움이 안 된다는 평이 많음. 2시간짜리 튜토리얼에서 직접 번역하고 바로 피드백받는 것이 핵심이지만 피곤할 수 있음."
    vi: "Bài giảng bị coi là ít tác dụng, trừ các buổi khách mời là dịch giả chuyên nghiệp. Tutorial 2 tiếng thực hành dịch và nhận phản hồi ngay mới là nơi học thật, dù khá mệt."
    ms: "Kuliah umumnya dianggap kurang berguna kecuali ceramah tetamu oleh penterjemah profesional. Tutorial dua jam dengan latihan terjemahan dan maklum balas segera ialah tempat sebenar belajar, walaupun memenatkan."
    id: "Kuliah umumnya dianggap kurang berguna kecuali sesi tamu dari penerjemah profesional. Tutorial dua jam berisi latihan menerjemah dengan umpan balik cepat adalah inti pembelajarannya, meski melelahkan."
    hi: "लेक्चर्स को ज़्यादातर बेकार माना गया, सिवाय पेशेवर अनुवादकों के गेस्ट टॉक के। दो घंटे के ट्यूटोरियल में सीधे अनुवाद और तुरंत फ़ीडबैक से असली सीख होती है, हालाँकि वे थका देते हैं।"
  - en: "Translation is harder than it sounds, and a 2019 reviewer struggled on the first test. Learn which style your tutor prefers (literal or freer), and expect to pick up a lot of vocabulary. No speaking tasks."
    zh: "翻译比想象中难，2019年一位评论者第一次测试就吃力。要了解导师偏好直译还是意译；会学到大量词汇。没有口语任务。"
    zh-TW: "翻譯比想像中難，2019年一位評論者第一次測驗就吃力。要了解導師偏好直譯還是意譯；會學到大量詞彙。沒有口說任務。"
    ja: "翻訳は思ったより難しく、2019年の評者は最初のテストで苦戦した。チューターが直訳と意訳のどちらを好むか把握しておくこと。語彙は大きく増える。スピーキング課題はない。"
    ko: "번역은 생각보다 어렵고, 2019년 리뷰어는 첫 시험에서 고전함. 튜터가 직역과 의역 중 무엇을 선호하는지 파악할 것. 어휘가 많이 늘며 말하기 과제는 없음."
    vi: "Dịch khó hơn tưởng, một người năm 2019 chật vật ở bài kiểm tra đầu. Nên biết tutor thích dịch sát hay thoát ý; bạn sẽ học được rất nhiều từ vựng. Không có phần nói."
    ms: "Terjemahan lebih sukar daripada sangkaan, dan pengulas 2019 bergelut pada ujian pertama. Ketahui gaya pilihan tutor (literal atau bebas), dan anda akan belajar banyak kosa kata. Tiada tugasan lisan."
    id: "Menerjemah lebih sulit dari kedengarannya, dan pengulas 2019 kesulitan di tes pertama. Pahami gaya yang disukai tutor (harfiah atau bebas), dan kamu akan menambah banyak kosakata. Tidak ada tugas berbicara."
    hi: "अनुवाद जितना लगता है उससे कठिन है, 2019 के एक रिव्यूअर को पहले टेस्ट में दिक़्क़त हुई। जान लें कि ट्यूटर शाब्दिक या भावानुवाद में से क्या पसंद करते हैं; शब्दावली बहुत बढ़ती है। बोलने वाला कोई काम नहीं।"
sections:
  content:
    - en: "Continuous French-to-English translation of stories, articles and other texts. Most reviewers found it easier to score highly than other French subjects, though one says translation is harder than it looks."
      zh: "一直在做法译英，材料有故事、文章等。多数同学觉得比其他法语课更容易拿高分，不过也有人说翻译比想象中难。"
      zh-TW: "一直在做法譯英，材料有故事、文章等。多數同學覺得比其他法語課更容易拿高分，不過也有人說翻譯比想像中難。"
      ja: "物語や記事などをひたすら仏英翻訳する。他のフランス語科目より高得点を取りやすいという声が多いが、翻訳は見た目より難しいと言う人も。"
      ko: "이야기, 기사 등 다양한 글을 계속 불영 번역한다. 다른 프랑스어 과목보다 고득점이 쉽다는 평이 많지만, 번역이 생각보다 어렵다는 사람도 있다."
      vi: "Dịch liên tục từ Pháp sang Anh với truyện, bài báo và văn bản khác. Đa số thấy dễ đạt điểm cao hơn các môn tiếng Pháp khác, dù một người nói dịch khó hơn tưởng."
      ms: "Terjemahan berterusan dari Perancis ke Inggeris bagi cerita, artikel dan teks lain. Kebanyakan rasa lebih mudah skor tinggi berbanding subjek Perancis lain, walaupun seorang kata terjemahan lebih sukar daripada disangka."
      id: "Terjemahan terus-menerus dari Prancis ke Inggris untuk cerita, artikel dan teks lain. Sebagian besar merasa lebih mudah dapat nilai tinggi dibanding mata kuliah Prancis lain, meski satu bilang menerjemah lebih sulit dari kelihatannya."
      hi: "कहानियों, लेखों और दूसरे पाठों का लगातार फ़्रेंच से अंग्रेज़ी अनुवाद। ज़्यादातर को दूसरे फ़्रेंच विषयों से ऊँचे अंक आसान लगे, हालाँकि एक कहता है अनुवाद दिखने से कठिन है।"
  work:
    - en: "Assessments include translating idiom-heavy phrases, transcribing and translating a spoken text, and a longer translation. There's no speaking or oral presentation."
      zh: "考核有翻译大量习语的句子、听写并翻译一段口语材料，以及一篇较长的翻译。没有口语或演讲。"
      zh-TW: "考核有翻譯大量慣用語的句子、聽寫並翻譯一段口語材料，以及一篇較長的翻譯。沒有口說或上台報告。"
      ja: "評価は慣用句だらけの文の翻訳、音声の書き取りと翻訳、長めの翻訳。スピーキングや口頭発表はない。"
      ko: "평가는 관용구가 많은 문장 번역, 음성 받아쓰기와 번역, 긴 글 번역. 말하기나 발표는 없다."
      vi: "Bài đánh giá gồm dịch câu nhiều thành ngữ, chép và dịch một đoạn nói, và một bài dịch dài. Không có phần nói hay thuyết trình."
      ms: "Penilaian termasuk menterjemah frasa penuh simpulan bahasa, transkripsi dan terjemahan teks lisan, dan terjemahan lebih panjang. Tiada pertuturan atau pembentangan lisan."
      id: "Penilaian meliputi menerjemahkan frasa penuh idiom, mentranskripsi dan menerjemahkan teks lisan, dan terjemahan yang lebih panjang. Tidak ada berbicara atau presentasi lisan."
      hi: "आकलन में मुहावरों भरे वाक्यों का अनुवाद, बोले गए पाठ को लिखकर अनुवाद करना, और एक लंबा अनुवाद है। बोलना या मौखिक प्रस्तुति नहीं है।"
  study:
    - en: "Reviewers say the two-hour tutorials, translating with classmates and getting quick feedback, are where you learn. One suggests checking whether your tutor prefers literal or freer translation."
      zh: "同学说真正学东西的是两小时的 tutorial，和同学一起翻译、马上得到反馈。有人建议先弄清 tutor 偏好直译还是意译。"
      zh-TW: "同學說真正學東西的是兩小時的 tutorial，和同學一起翻譯、馬上得到回饋。有人建議先弄清 tutor 偏好直譯還是意譯。"
      ja: "学びの場は2時間のチュートリアルで、仲間と訳してすぐフィードバックをもらえる。チューターが直訳派か意訳派か確認しておくよう勧める人も。"
      ko: "배움은 2시간 튜토리얼에서 일어난다는 평. 동료와 번역하고 바로 피드백을 받는다. 튜터가 직역과 의역 중 무엇을 선호하는지 확인하라는 조언도 있다."
      vi: "Người học nói tutorial hai tiếng, dịch cùng bạn và nhận phản hồi ngay, là nơi học thật sự. Một người khuyên xem tutor thích dịch sát hay dịch thoáng."
      ms: "Pengulas kata tutorial dua jam, menterjemah bersama rakan dan dapat maklum balas segera, ialah tempat belajar sebenar. Seorang cadang semak sama ada tutor suka terjemahan literal atau bebas."
      id: "Pengulas bilang tutorial dua jam, menerjemah bersama teman dan dapat umpan balik langsung, adalah tempat belajar sesungguhnya. Satu menyarankan cek apakah tutor lebih suka terjemahan harfiah atau bebas."
      hi: "रिव्यूअर्स कहते हैं असली सीख दो घंटे के ट्यूटोरियल में होती है, साथियों के साथ अनुवाद और तुरंत फ़ीडबैक। एक सुझाव देता है जाँच लें कि ट्यूटर शाब्दिक या खुला अनुवाद पसंद करता है।"
  watch:
    - en: "Most reviewers call the lectures boring or not very useful, apart from guest speakers who work as translators. The long tutorials can be tiring."
      zh: "多数同学觉得讲课无聊、用处不大，只有做翻译工作的嘉宾讲座还不错。tutorial 时间长，有点累。"
      zh-TW: "多數同學覺得講課無聊、用處不大，只有做翻譯工作的來賓演講還不錯。tutorial 時間長，有點累。"
      ja: "講義は退屈で役に立たないという声が多いが、翻訳者のゲスト講演は良かったという。長いチュートリアルは疲れる。"
      ko: "강의는 지루하고 별 도움이 안 된다는 평이 많지만, 번역가 초청 강연은 괜찮았다고 한다. 긴 튜토리얼은 피곤할 수 있다."
      vi: "Đa số thấy bài giảng chán hoặc ít ích, trừ các khách mời làm nghề dịch. Tutorial dài có thể mệt."
      ms: "Kebanyakan kata kuliah membosankan atau kurang berguna, kecuali penceramah jemputan yang bekerja sebagai penterjemah. Tutorial panjang boleh memenatkan."
      id: "Sebagian besar bilang kuliahnya membosankan atau kurang berguna, kecuali pembicara tamu yang bekerja sebagai penerjemah. Tutorial yang panjang bisa melelahkan."
      hi: "ज़्यादातर कहते हैं लेक्चर उबाऊ या कम काम के हैं, सिवाय अनुवादक का काम करने वाले मेहमान वक्ताओं के। लंबे ट्यूटोरियल थका सकते हैं।"
difficulty: easy
