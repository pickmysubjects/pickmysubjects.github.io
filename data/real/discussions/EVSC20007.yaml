points:
  - en: "Four themed blocks, each with a different lecturer, rather than one ongoing modelling project."
    zh: "课程分为四个主题模块，各由不同讲师授课，而非一个贯穿全学期的建模项目。"
    zh-TW: "課程分成四個主題單元，各由不同講師授課，而不是一個貫穿整學期的建模專題。"
    ja: "1つの継続的なモデリングプロジェクトではなく、講師の異なる4つのテーマ別ブロックで構成。"
    ko: "하나의 연속 모델링 프로젝트가 아니라 강사가 각기 다른 4개의 주제 블록으로 구성됨."
    vi: "Gồm bốn khối chủ đề, mỗi khối một giảng viên, chứ không phải một dự án mô hình xuyên suốt."
    ms: "Empat blok bertema, setiap satu dengan pensyarah berbeza, bukan satu projek pemodelan berterusan."
    id: "Empat blok bertema dengan dosen berbeda di tiap blok, bukan satu proyek pemodelan berkelanjutan."
    hi: "एक लगातार चलने वाले मॉडलिंग प्रोजेक्ट की बजाय चार थीम वाले ब्लॉक, हर एक का लेक्चरर अलग।"
  - en: "Pracs guide you through building models in Python, which reviewers found valuable."
    zh: "实验课引导你用Python搭建模型，评论认为很有价值。"
    zh-TW: "實驗課帶你用Python建立模型，評論認為很有價值。"
    ja: "実習ではPythonでモデルを作る手順を学べ、価値があると好評。"
    ko: "실습에서 Python으로 모델을 만드는 과정을 안내해 주며, 유익했다는 평."
    vi: "Prac hướng dẫn bạn xây dựng mô hình bằng Python, được đánh giá là rất bổ ích."
    ms: "Prac membimbing anda membina model dalam Python, yang pengulas rasa bernilai."
    id: "Prak memandu kamu membangun model dengan Python, yang dinilai bermanfaat."
    hi: "प्रैक्टिकल में Python से मॉडल बनाना सिखाया जाता है, जिसे रिव्यूअर ने काफ़ी उपयोगी पाया।"
  - en: "Lecture delivery was criticised as dull in recent years; climate science parts may be hard without background."
    zh: "近年讲课被批评乏味；缺乏气候科学背景者可能觉得相关部分较难。"
    zh-TW: "近年講課被批評很乏味；缺乏氣候科學背景的人可能覺得相關部分較難。"
    ja: "近年は講義が退屈だと批判されている。気候科学の予備知識がないとその部分は難しいかも。"
    ko: "최근 몇 년 강의가 지루하다는 비판이 있고, 배경지식이 없으면 기후과학 부분이 어려울 수 있음."
    vi: "Cách giảng bị chê nhàm trong những năm gần đây; phần khoa học khí hậu có thể khó nếu thiếu nền tảng."
    ms: "Penyampaian kuliah dikritik membosankan sejak kebelakangan ini; bahagian sains iklim mungkin sukar tanpa latar belakang."
    id: "Penyampaian kuliah dikritik membosankan beberapa tahun terakhir; bagian ilmu iklim bisa sulit tanpa latar belakang."
    hi: "हाल के सालों में लेक्चर नीरस होने की आलोचना हुई; बैकग्राउंड न हो तो क्लाइमेट साइंस वाले हिस्से कठिन लग सकते हैं।"
