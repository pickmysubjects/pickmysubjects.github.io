points:
  - en: "You learn to research social media data with software tools, analysing brands on a platform. It suits self-guided learners; start early and pick your brands and platform early, as that decides the tools."
    zh: "学习用软件工具研究社交媒体数据，分析某平台上的品牌。适合能自主学习的人；尽早开始，早点选好品牌和平台，因为这决定要用什么工具。"
    zh-TW: "學習用軟體工具研究社群媒體資料，分析某平台上的品牌。適合能自主學習的人；儘早開始，早點選好品牌和平台，因為這決定要用什麼工具。"
    ja: "ソフトウェアツールでSNSデータを調べ、プラットフォーム上のブランドを分析する方法を学ぶ。自主的に学べる人向け。使うツールが決まるので、早めにブランドとプラットフォームを選んで始めること。"
    ko: "소프트웨어 도구로 소셜미디어 데이터를 조사해 플랫폼의 브랜드를 분석하는 법을 배움. 자기주도 학습자에게 맞음. 쓸 도구가 정해지니 브랜드와 플랫폼을 일찍 정하고 빨리 시작할 것."
    vi: "Học cách nghiên cứu dữ liệu mạng xã hội bằng công cụ phần mềm, phân tích thương hiệu trên một nền tảng. Hợp với người tự học; bắt đầu sớm và chọn thương hiệu, nền tảng sớm vì điều đó quyết định công cụ."
    ms: "Anda belajar mengkaji data media sosial dengan perisian, menganalisis jenama di sesuatu platform. Sesuai untuk pelajar berdikari; mula awal dan pilih jenama serta platform awal kerana ia menentukan alat."
    id: "Kamu belajar meneliti data media sosial dengan perangkat lunak, menganalisis merek di suatu platform. Cocok untuk yang mandiri; mulai lebih awal dan pilih merek serta platform sejak awal karena itu menentukan alatnya."
    hi: "सॉफ़्टवेयर टूल से सोशल मीडिया डेटा पर रिसर्च और किसी प्लेटफ़ॉर्म पर ब्रांड का विश्लेषण सीखते हैं। ख़ुद से सीखने वालों के लिए उपयुक्त; जल्दी शुरू करें और ब्रांड व प्लेटफ़ॉर्म जल्दी चुनें, क्योंकि उसी से टूल तय होते हैं।"
  - en: "Several (2022 and 2025) found assignment briefs poorly explained and the subject hard to navigate, while others said tutorials were what got them through."
    zh: "好几人（2022和2025年）觉得作业说明不清楚，课程难以摸索，也有人说是辅导课帮他们撑了过来。"
    zh-TW: "好幾個人（2022和2025年）覺得作業說明不清楚，課程難以摸索，也有人說是輔導課幫他們撐了過來。"
    ja: "複数人（2022年と2025年）が課題の説明が不十分で全体を把握しにくいとした一方、チュートリアルのおかげで乗り切れたという声もある。"
    ko: "여럿(2022·2025년)은 과제 안내가 부실하고 과목 파악이 어렵다고 했지만, 튜토리얼 덕에 버텼다는 사람도 있음."
    vi: "Nhiều người (2022 và 2025) thấy yêu cầu bài tập giải thích kém và khó định hướng, trong khi người khác nói nhờ tutorial mà qua được."
    ms: "Beberapa orang (2022 dan 2025) dapati taklimat tugasan kurang dijelaskan dan subjek sukar dilayari, manakala yang lain kata tutorial yang membantu mereka."
    id: "Beberapa orang (2022 dan 2025) merasa arahan tugas kurang dijelaskan dan mata kuliahnya sulit dipahami alurnya, sementara yang lain bilang tutorial yang membuat mereka bertahan."
    hi: "कई लोगों (2022 और 2025) को असाइनमेंट ब्रीफ़ ठीक से न समझाए गए और विषय में रास्ता ढूँढना कठिन लगा, जबकि दूसरों ने कहा कि ट्यूटोरियल ने ही उन्हें पार लगाया।"
