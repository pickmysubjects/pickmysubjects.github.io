points:
  - en: "It is very content heavy, so stay on top of the material."
    zh: "内容量很大，要及时跟上进度。"
    zh-TW: "內容量很大，要及時跟上進度。"
    ja: "内容がとても多いので、遅れないようにしましょう。"
    ko: "내용이 매우 많으니 진도를 잘 따라가세요."
    vi: "Nội dung rất nặng, nên hãy theo kịp bài."
    ms: "Kandungan sangat banyak, jadi sentiasa ikuti bahan."
    id: "Materinya sangat banyak, jadi jangan sampai tertinggal."
    hi: "कंटेंट बहुत ज़्यादा है, इसलिए मटीरियल के साथ बने रहें।"
  - en: "The hands-on pracs are fun and help reinforce the theory."
    zh: "动手实验课有趣，能帮助巩固理论。"
    zh-TW: "動手實驗課有趣，能幫助鞏固理論。"
    ja: "手を動かす実習は楽しく、理論の定着に役立ちます。"
    ko: "직접 하는 실습이 재미있고 이론을 다지는 데 도움이 됩니다."
    vi: "Các buổi thực hành tự tay làm rất vui và giúp củng cố lý thuyết."
    ms: "Amali secara langsung menyeronokkan dan membantu mengukuhkan teori."
    id: "Praktikum langsungnya seru dan membantu memperkuat teori."
    hi: "हाथ से किए जाने वाले प्रैक्टिकल मज़ेदार हैं और थ्योरी पक्की करने में मदद करते हैं।"
  - en: "The most recent review (2024) praised strong assignment support, short lecture quizzes and an application-focused exam with a page of notes allowed."
    zh: "最新评价（2024）称作业指导充分，有课后小测，期末侧重应用并可带一页笔记。"
    zh-TW: "最新評價（2024）稱作業指導充分，有簡短的講座小測，期末側重應用並可帶一頁筆記。"
    ja: "最新のレビュー（2024）では、課題のサポートが手厚いこと、短い講義小テスト、ノート1枚持ち込み可の応用重視の試験が評価されています。"
    ko: "최신 후기(2024)는 탄탄한 과제 지원, 짧은 강의 퀴즈, 노트 한 장을 허용하는 응용 중심 시험을 칭찬했습니다."
    vi: "Đánh giá mới nhất (2024) khen hỗ trợ bài tập tốt, quiz ngắn sau bài giảng và bài thi thiên vận dụng được mang một trang ghi chú."
    ms: "Ulasan terkini (2024) memuji sokongan tugasan yang kukuh, kuiz kuliah pendek dan peperiksaan berfokus aplikasi yang membenarkan sehelai nota."
    id: "Ulasan terbaru (2024) memuji dukungan tugas yang kuat, kuis kuliah singkat, dan ujian berfokus penerapan dengan satu halaman catatan."
    hi: "सबसे नए रिव्यू (2024) ने असाइनमेंट में अच्छी मदद, छोटे लेक्चर क्विज़ और एक पेज नोट्स की अनुमति वाले एप्लिकेशन-केंद्रित एग्ज़ाम की तारीफ की।"
sections:
  content:
    - en: "A broad, content-heavy look at animal structure and function with hands-on pracs, some involving drawing. Most found the pracs fun and the lecturers supportive."
      zh: "广泛讲动物的结构与功能，内容多，有动手实验，部分要画图。多数人觉得实验好玩，老师很支持学生。"
      zh-TW: "廣泛講動物的結構與功能，內容多，有動手實驗，部分要畫圖。多數人覺得實驗好玩，老師很支持學生。"
      ja: "動物の構造と機能を幅広く扱う内容の多い科目で、スケッチを含む実習もある。実習は楽しく講師も親身だという声が多い。"
      ko: "동물의 구조와 기능을 폭넓게 다루는 내용 많은 과목으로, 그림을 그리는 실습도 있다. 실습이 재미있고 강사들이 잘 도와준다는 평이 많다."
      vi: "Tìm hiểu rộng về cấu trúc và chức năng động vật, nhiều nội dung, có thực hành, một số phải vẽ. Đa số thấy thực hành vui và giảng viên hỗ trợ tốt."
      ms: "Tinjauan luas dan berat kandungan tentang struktur dan fungsi haiwan dengan amali praktikal, sebahagiannya melukis. Kebanyakan rasa amali seronok dan pensyarah menyokong."
      id: "Kajian luas dan padat materi tentang struktur dan fungsi hewan dengan praktikum langsung, sebagian menggambar. Kebanyakan merasa praktikumnya seru dan dosennya suportif."
      hi: "जानवरों की संरचना और कार्य पर व्यापक, कंटेंट-भारी विषय, हाथ से किए जाने वाले प्रैक के साथ, कुछ में चित्र बनाना। ज़्यादातर को प्रैक मज़ेदार और लेक्चरर मददगार लगे।"
  work:
    - en: "In 2024: short quizzes after each lecture worth about 10% in total, graphical and extended abstract assignments with strong workshop support, and an exam with one A4 page of notes."
      zh: "2024 年：每节课后有简短小测，合计约 10%；图形摘要和扩展摘要作业，workshop 支持很到位；期末可带一页 A4 笔记。"
      zh-TW: "2024 年：每堂課後有簡短小考，合計約 10%；圖形摘要和延伸摘要作業，workshop 支援很到位；期末可帶一頁 A4 筆記。"
      ja: "2024年は各講義後の短い小テスト（合計約10%）、ワークショップの手厚い支援がある図解アブストラクトと拡張アブストラクトの課題、A4メモ1枚持ち込み可の試験。"
      ko: "2024년엔 강의마다 짧은 퀴즈(합계 약 10%), 워크숍 지원이 탄탄한 그래픽 초록·확장 초록 과제, A4 노트 한 장 지참 가능한 시험이 있었다."
      vi: "Năm 2024: quiz ngắn sau mỗi bài giảng tổng khoảng 10%, bài tóm tắt dạng đồ họa và tóm tắt mở rộng có workshop hỗ trợ tốt, và bài thi được mang một trang A4 ghi chú."
      ms: "Pada 2024: kuiz pendek selepas setiap kuliah kira-kira 10% keseluruhan, tugasan abstrak grafik dan lanjutan dengan sokongan bengkel yang kukuh, dan peperiksaan dengan satu halaman nota A4."
      id: "Pada 2024: kuis singkat setelah tiap kuliah total sekitar 10%, tugas abstrak grafis dan abstrak panjang dengan dukungan workshop yang kuat, dan ujian dengan satu halaman catatan A4."
      hi: "2024 में: हर लेक्चर के बाद छोटे क्विज़ कुल लगभग 10%, मज़बूत वर्कशॉप सहायता वाले ग्राफ़िकल और विस्तारित एब्स्ट्रैक्ट असाइनमेंट, और एक A4 पेज नोट्स वाली परीक्षा।"
  study:
    - en: "Stay on top of the content, as there is a lot of it; the after-lecture quizzes help you keep up."
      zh: "内容很多，一定要跟上；课后小测能帮你保持进度。"
      zh-TW: "內容很多，一定要跟上；課後小考能幫你保持進度。"
      ja: "内容が多いので遅れないこと。講義後の小テストがペース維持に役立つ。"
      ko: "내용이 많으니 놓치지 마라. 강의 후 퀴즈가 진도 유지에 도움이 된다."
      vi: "Theo kịp nội dung vì rất nhiều; quiz sau bài giảng giúp bạn không bị tụt lại."
      ms: "Ikuti kandungan kerana ia banyak; kuiz selepas kuliah membantu anda kekal mengikut rentak."
      id: "Ikuti materinya karena sangat banyak; kuis setelah kuliah membantu menjaga tempo."
      hi: "कंटेंट बहुत है, इसलिए साथ बने रहें; लेक्चर के बाद के क्विज़ गति बनाए रखने में मदद करते हैं।"
  watch:
    - en: "Only one review is from after 2016, and it describes a quite different, better-supported subject, so older complaints about difficulty and marking may no longer apply."
      zh: "2016 年以后只有一条评价，描述的课程和以前很不一样、支持更多，所以以前关于难度和评分的抱怨可能已不适用。"
      zh-TW: "2016 年以後只有一則評價，描述的課程和以前很不一樣、支援更多，所以以前關於難度和評分的抱怨可能已不適用。"
      ja: "2016年より後のレビューは1件だけで、以前とはかなり違いサポートも手厚い科目として描かれている。難しさや採点への昔の不満は今は当てはまらないかもしれない。"
      ko: "2016년 이후 리뷰는 하나뿐인데, 예전과 꽤 다르고 지원이 더 좋은 과목으로 묘사한다. 난이도와 채점에 대한 옛 불만은 더 이상 해당되지 않을 수 있다."
      vi: "Chỉ có một đánh giá sau 2016, mô tả một môn học khá khác và được hỗ trợ tốt hơn, nên những phàn nàn cũ về độ khó và chấm điểm có thể không còn đúng."
      ms: "Hanya satu ulasan selepas 2016, dan ia menggambarkan subjek yang agak berbeza dan lebih disokong, jadi aduan lama tentang kesukaran dan pemarkahan mungkin tidak lagi berkaitan."
      id: "Hanya satu ulasan setelah 2016, dan ulasan itu menggambarkan mata kuliah yang cukup berbeda dan lebih didukung, jadi keluhan lama soal kesulitan dan penilaian mungkin sudah tidak berlaku."
      hi: "2016 के बाद सिर्फ़ एक रिव्यू है, और वह काफ़ी अलग, बेहतर सहयोग वाले विषय का वर्णन करता है, तो कठिनाई और मार्किंग की पुरानी शिकायतें शायद अब लागू न हों।"
workload: heavy
