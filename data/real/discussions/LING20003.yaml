points:
  - en: "Covers theories of how people learn second languages, more theoretical than practical for teaching. Reviewers found the content interesting, especially if you like psycholinguistics."
    zh: "讲授人们如何学习第二语言的理论，偏理论而非教学实践。评论者觉得内容有趣，尤其适合喜欢心理语言学的人。"
    zh-TW: "講授人們如何學習第二語言的理論，偏理論而非教學實務。評論者覺得內容有趣，尤其適合喜歡心理語言學的人。"
    ja: "人が第二言語をどう習得するかの理論を扱い、教えるための実践より理論寄り。内容は面白いとされ、特に心理言語学が好きな人に向く。"
    ko: "사람들이 제2언어를 배우는 방식에 관한 이론을 다루며, 교수법 실무보다 이론 중심. 내용이 흥미롭다는 평이며 특히 심리언어학을 좋아하면 잘 맞음."
    vi: "Học các lý thuyết về cách con người học ngôn ngữ thứ hai, thiên về lý thuyết hơn là thực hành giảng dạy. Người đánh giá thấy nội dung thú vị, nhất là nếu thích ngôn ngữ học tâm lý."
    ms: "Meliputi teori bagaimana orang belajar bahasa kedua, lebih teoretikal daripada praktikal untuk mengajar. Pengulas dapati kandungan menarik, terutama jika suka psikolinguistik."
    id: "Membahas teori bagaimana orang belajar bahasa kedua, lebih teoretis daripada praktis untuk mengajar. Pengulas merasa materinya menarik, terutama jika suka psikolinguistik."
    hi: "यह इस पर सिद्धांत पढ़ाता है कि लोग दूसरी भाषा कैसे सीखते हैं, पढ़ाने के व्यवहार से ज़्यादा सैद्धांतिक। रिव्यूअर्स को कंटेंट दिलचस्प लगा, ख़ासकर साइकोलिंग्विस्टिक्स पसंद हो तो।"
  - en: "Assignments involve interviewing a second language learner. Instructions were often called unclear, and the 2026 reviewer found marking harsh."
    zh: "作业需要访谈一位第二语言学习者。说明常被认为不清楚，2026年的评论者觉得评分严格。"
    zh-TW: "作業需要訪談一位第二語言學習者。說明常被認為不清楚，2026年的評論者覺得評分嚴格。"
    ja: "課題では第二言語学習者へのインタビューを行う。指示がわかりにくいという声が多く、2026年のレビューでは採点が厳しいとされた。"
    ko: "과제는 제2언어 학습자를 인터뷰하는 것. 안내가 불명확하다는 평이 많고, 2026년 리뷰어는 채점이 엄격하다고 함."
    vi: "Bài tập có phỏng vấn một người học ngôn ngữ thứ hai. Hướng dẫn thường bị cho là không rõ, và người năm 2026 thấy chấm điểm khắt khe."
    ms: "Tugasan melibatkan temu bual pelajar bahasa kedua. Arahan sering dikatakan tidak jelas, dan pengulas 2026 dapati pemarkahan ketat."
    id: "Tugas melibatkan wawancara dengan pembelajar bahasa kedua. Instruksinya sering disebut tidak jelas, dan pengulas 2026 merasa penilaiannya ketat."
    hi: "असाइनमेंट में किसी दूसरी भाषा सीखने वाले का इंटरव्यू करना होता है। निर्देश अक्सर अस्पष्ट बताए गए, और 2026 के रिव्यूअर को मार्किंग सख़्त लगी।"
