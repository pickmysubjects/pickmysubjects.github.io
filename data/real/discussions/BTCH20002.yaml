points:
  - en: "The content isn't hard but there is a lot of it, with plenty of memorisation. Most reviewers say good marks or an H1 are reachable with steady study."
    zh: "内容不难但量大，需要大量记忆。多数评价认为稳定复习就能拿到好成绩甚至H1。"
    zh-TW: "內容不難但很多，要背很多東西。多數評論者說穩定讀書就能拿好成績甚至H1。"
    ja: "内容は難しくないが量が多く、暗記も多い。地道に勉強すれば良い成績やH1も狙えるという声が多い。"
    ko: "내용은 어렵지 않지만 양이 많고 암기할 것도 많다. 대부분은 꾸준히 공부하면 좋은 점수나 H1도 가능하다고 한다."
    vi: "Nội dung không khó nhưng nhiều, phải học thuộc nhiều. Đa số nói học đều đặn thì đạt điểm tốt, thậm chí H1."
    ms: "Kandungan tidak sukar tetapi banyak, dengan banyak hafalan. Kebanyakan pengulas kata markah baik atau H1 boleh dicapai dengan belajar secara konsisten."
    id: "Materinya tidak sulit tapi banyak, dengan banyak hafalan. Kebanyakan pengulas bilang nilai bagus atau H1 bisa diraih dengan belajar rutin."
    hi: "कंटेंट कठिन नहीं पर बहुत है, और काफ़ी रटना पड़ता है। ज़्यादातर रिव्यूअर्स कहते हैं लगातार पढ़ाई से अच्छे नंबर या H1 मिल सकता है।"
  - en: "The mid-semester tests and exam have only about five questions each, so a weak answer on one question costs a lot."
    zh: "期中测验和期末考试各只有约五道题，一道题答不好就会明显拉低分数。"
    zh-TW: "期中測驗和期末考各只有約五題，一題沒答好就扣很多分。"
    ja: "中間テストと試験はそれぞれ5問ほどしかないので、1問の失敗が大きく響く。"
    ko: "중간 테스트와 시험은 각각 문제가 5개 정도라서 한 문제만 못 써도 타격이 크다."
    vi: "Bài kiểm tra giữa kỳ và bài thi mỗi bài chỉ khoảng năm câu, nên làm kém một câu là mất nhiều điểm."
    ms: "Ujian pertengahan semester dan peperiksaan masing-masing hanya ada kira-kira lima soalan, jadi satu jawapan lemah menjejaskan banyak markah."
    id: "Ujian tengah semester dan ujian akhir masing-masing hanya sekitar lima soal, jadi satu jawaban lemah berdampak besar."
    hi: "मिड-सेमेस्टर टेस्ट और परीक्षा में लगभग पाँच-पाँच सवाल ही होते हैं, इसलिए एक सवाल ख़राब होने पर काफ़ी नंबर कटते हैं।"
  - en: "Lectures are often called long and boring. Tutorials and sample questions are the most useful way to prepare for the exam."
    zh: "多位评价认为讲座冗长乏味；辅导课和样题是备考最有用的资源。"
    zh-TW: "講課常被說又長又無聊。輔導課和樣題是準備考試最有用的方法。"
    ja: "講義は長くて退屈だとよく言われる。試験対策にはチュートリアルとサンプル問題が一番役立つ。"
    ko: "강의는 길고 지루하다는 말이 많다. 튜토리얼과 예시 문제가 시험 준비에 가장 유용하다."
    vi: "Bài giảng thường bị chê dài và chán. Tutorial và câu hỏi mẫu là cách ôn thi hữu ích nhất."
    ms: "Kuliah sering dikatakan panjang dan membosankan. Tutorial dan soalan contoh ialah cara paling berguna untuk bersedia menghadapi peperiksaan."
    id: "Kuliah sering disebut panjang dan membosankan. Tutorial dan soal contoh adalah cara paling berguna untuk persiapan ujian."
    hi: "लेक्चर को अक्सर लंबा और उबाऊ कहा जाता है। परीक्षा की तैयारी के लिए ट्यूटोरियल और सैंपल सवाल सबसे उपयोगी हैं।"
sections:
  content:
    - en: "How technology is used in biology, from microbes and enzymes to stem cells and plants. The content isn't hard but there is a lot to memorise, and many found the lectures boring."
      zh: "讲技术在生物中的应用，从微生物、酶到干细胞和植物。内容不难，但要背的多；很多人觉得讲课无聊。"
      zh-TW: "講技術在生物中的應用，從微生物、酵素到幹細胞和植物。內容不難，但要背的多；很多人覺得上課無聊。"
      ja: "微生物や酵素から幹細胞、植物まで、生物学での技術の使われ方を学ぶ。内容は難しくないが暗記が多く、講義は退屈だという声が多い。"
      ko: "미생물, 효소부터 줄기세포, 식물까지 생물학에서 기술이 쓰이는 방식을 다룬다. 내용은 어렵지 않지만 외울 게 많고 강의가 지루하다는 평이 많다."
      vi: "Công nghệ được dùng trong sinh học thế nào, từ vi sinh vật, enzyme đến tế bào gốc và thực vật. Nội dung không khó nhưng phải nhớ nhiều, nhiều người thấy bài giảng chán."
      ms: "Cara teknologi digunakan dalam biologi, daripada mikrob dan enzim hingga sel stem dan tumbuhan. Kandungan tidak sukar tetapi banyak dihafal, dan ramai rasa kuliah membosankan."
      id: "Bagaimana teknologi dipakai dalam biologi, dari mikroba dan enzim sampai sel punca dan tumbuhan. Materinya tidak sulit tapi banyak hafalan, dan banyak yang merasa kuliahnya membosankan."
      hi: "जीव विज्ञान में तकनीक का उपयोग, सूक्ष्मजीव और एंज़ाइम से स्टेम सेल और पौधों तक। कंटेंट कठिन नहीं पर रटना बहुत है, और कई को लेक्चर उबाऊ लगे।"
  work:
    - en: "The MSTs and exam each have only around five questions, so missing one costs a lot. Reviewers still found good marks easy to get with steady study."
      zh: "MST 和期末每次只有大约五道题，错一道就丢很多分。不过同学说稳定复习的话还是很容易拿好成绩。"
      zh-TW: "MST 和期末每次只有大約五題，錯一題就丟很多分。不過同學說穩定複習的話還是很容易拿好成績。"
      ja: "MSTも期末も問題は5問ほどしかなく、1問落とすと大きく響く。それでも地道に勉強すれば良い点は取りやすいという。"
      ko: "MST와 기말은 각각 다섯 문제 정도라 하나만 놓쳐도 타격이 크다. 그래도 꾸준히 공부하면 좋은 점수를 받기 쉽다고 한다."
      vi: "MST và bài thi mỗi bài chỉ khoảng năm câu, sai một câu là mất nhiều điểm. Dù vậy người học thấy học đều thì dễ đạt điểm tốt."
      ms: "MST dan peperiksaan masing-masing hanya kira-kira lima soalan, jadi tersilap satu memberi kesan besar. Pengulas tetap rasa markah baik mudah dengan belajar konsisten."
      id: "MST dan ujian masing-masing hanya sekitar lima soal, jadi meleset satu berdampak besar. Pengulas tetap merasa nilai bagus mudah diraih dengan belajar rutin."
      hi: "MST और परीक्षा में लगभग पाँच-पाँच सवाल ही होते हैं, तो एक चूकने से बहुत नुक़सान। फिर भी रिव्यूअर्स को लगातार पढ़ाई से अच्छे अंक आसान लगे।"
  study:
    - en: "Study the slides thoroughly, do the sample exam questions, and use tutorials, which reviewers say show what to focus on."
      zh: "把 PPT 认真吃透，做样题；多用 tutorial，同学说它能告诉你重点在哪。"
      zh-TW: "把投影片認真讀透，寫樣題；多用 tutorial，同學說它能告訴你重點在哪。"
      ja: "スライドを徹底的に勉強し、サンプル問題を解き、何に絞るべきか教えてくれるチュートリアルを活用する。"
      ko: "슬라이드를 꼼꼼히 공부하고 샘플 문제를 풀며, 무엇에 집중할지 알려 주는 튜토리얼을 활용하라."
      vi: "Học kỹ slide, làm câu hỏi thi mẫu và tận dụng tutorial, người học nói nó chỉ ra cần tập trung vào đâu."
      ms: "Kaji slaid dengan teliti, buat soalan peperiksaan contoh, dan guna tutorial yang pengulas kata menunjukkan apa yang perlu ditumpukan."
      id: "Pelajari slide dengan tuntas, kerjakan contoh soal ujian, dan manfaatkan tutorial, yang menurut pengulas menunjukkan apa yang perlu difokuskan."
      hi: "स्लाइड अच्छी तरह पढ़ें, सैंपल परीक्षा सवाल करें, और ट्यूटोरियल का इस्तेमाल करें, जो रिव्यूअर्स के अनुसार बताते हैं किस पर ध्यान दें।"
  watch:
    - en: "Only two reviews are from after 2019, so details may be out of date."
      zh: "2019 年以后只有两条评价，细节可能已经过时。"
      zh-TW: "2019 年以後只有兩則評價，細節可能已經過時。"
      ja: "2019年より後のレビューは2件だけで、詳細は古くなっている可能性がある。"
      ko: "2019년 이후 리뷰는 두 개뿐이라 세부 내용이 바뀌었을 수 있다."
      vi: "Chỉ có hai đánh giá sau 2019, nên chi tiết có thể đã lỗi thời."
      ms: "Hanya dua ulasan selepas 2019, jadi butiran mungkin sudah lapuk."
      id: "Hanya dua ulasan setelah 2019, jadi detailnya mungkin sudah usang."
      hi: "2019 के बाद सिर्फ़ दो रिव्यू हैं, तो जानकारी पुरानी हो सकती है।"
workload: heavy
difficulty: easy
