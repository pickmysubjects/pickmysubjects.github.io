points:
  - en: "A continental philosophy subject on interpretation, structuralism and post-structuralism, with some overlap with linguistics."
    zh: "一门关于诠释、结构主义和后结构主义的欧陆哲学课，与语言学有一些重叠。"
    zh-TW: "一門關於詮釋、結構主義和後結構主義的歐陸哲學課，與語言學有一些重疊。"
    ja: "解釈、構造主義、ポスト構造主義を扱う大陸哲学の科目で、言語学とも一部重なる。"
    ko: "해석, 구조주의, 후기구조주의를 다루는 대륙철학 과목으로, 언어학과 일부 겹침."
    vi: "Môn triết học lục địa về diễn giải, chủ nghĩa cấu trúc và hậu cấu trúc, có phần trùng với ngôn ngữ học."
    ms: "Subjek falsafah kontinental tentang tafsiran, strukturalisme dan pascastrukturalisme, dengan sedikit pertindihan dengan linguistik."
    id: "Mata kuliah filsafat kontinental tentang interpretasi, strukturalisme, dan pascastrukturalisme, dengan sedikit irisan dengan linguistik."
    hi: "व्याख्या, संरचनावाद और उत्तर-संरचनावाद पर एक कॉन्टिनेंटल फ़िलॉसफ़ी विषय, जिसका भाषाविज्ञान से कुछ मेल है।"
  - en: "Interesting but widely called exceptionally hard; a 2022 linguistics student advised against it unless you are strong in philosophy."
    zh: "内容有趣，但普遍被认为极难；一位2022年的语言学学生建议，除非哲学基础很好，否则别选。"
    zh-TW: "內容有趣，但普遍被認為極難；一位2022年的語言學學生建議，除非哲學基礎很好，否則別選。"
    ja: "面白いが、非常に難しいという声が多い。2022年の言語学の学生は、哲学に強くなければ取らない方がいいと助言している。"
    ko: "흥미롭지만 매우 어렵다는 평이 많음. 2022년 언어학 전공 학생은 철학에 강하지 않으면 듣지 말라고 조언함."
    vi: "Thú vị nhưng bị nhiều người cho là cực khó; một sinh viên ngôn ngữ học năm 2022 khuyên đừng học trừ khi giỏi triết."
    ms: "Menarik tetapi ramai menggelarnya sangat sukar; seorang pelajar linguistik 2022 menasihatkan supaya tidak mengambilnya melainkan anda kuat dalam falsafah."
    id: "Menarik tapi banyak yang menyebutnya luar biasa sulit; mahasiswa linguistik 2022 menyarankan jangan ambil kecuali kamu kuat di filsafat."
    hi: "दिलचस्प है पर इसे बड़े पैमाने पर बेहद कठिन कहा गया; 2022 के एक भाषाविज्ञान छात्र ने सलाह दी कि फ़िलॉसफ़ी में मज़बूत न हों तो इसे न लें।"
difficulty: hard
