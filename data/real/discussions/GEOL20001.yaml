points:
  - en: "Built around a roughly 6-day field trip with field exercises, followed by a 2000-word research essay."
    zh: "课程核心是约6天的野外考察和野外练习，之后写一篇2000字的研究论文。"
    zh-TW: "課程核心是約6天的野外考察和野外練習，之後要寫一篇2000字的研究論文。"
    ja: "約6日間のフィールドトリップと野外演習が中心で、その後に2000語の研究エッセイを書く。"
    ko: "약 6일간의 현장 답사와 야외 실습을 중심으로 하며, 이후 2000단어 연구 에세이를 씀."
    vi: "Xoay quanh chuyến thực địa khoảng 6 ngày với bài tập thực địa, sau đó là bài luận nghiên cứu 2000 từ."
    ms: "Berpusat pada lawatan lapangan kira-kira 6 hari dengan latihan lapangan, diikuti esei penyelidikan 2000 patah perkataan."
    id: "Berpusat pada kunjungan lapangan sekitar 6 hari dengan latihan lapangan, lalu esai riset 2000 kata."
    hi: "लगभग 6 दिन की फ़ील्ड ट्रिप और फ़ील्ड एक्सरसाइज़ पर आधारित, उसके बाद 2000 शब्दों का रिसर्च निबंध।"
  - en: "Field booklet drawings are marked closely: include a scale, a key and proper rock-layer notation."
    zh: "野外手册绘图评分细致：要标比例尺、图例和规范的岩层符号。"
    zh-TW: "野外手冊的繪圖評分很細：要標比例尺、圖例和正確的岩層符號。"
    ja: "フィールドノートの図は細かく採点される。縮尺、凡例、正しい地層表記を入れること。"
    ko: "현장 노트 그림은 꼼꼼히 채점되니 축척, 범례, 올바른 지층 표기를 넣으세요."
    vi: "Hình vẽ trong sổ thực địa được chấm kỹ: cần có tỉ lệ, chú giải và ký hiệu lớp đá đúng chuẩn."
    ms: "Lukisan buku lapangan dimarkah teliti: sertakan skala, petunjuk dan notasi lapisan batuan yang betul."
    id: "Gambar buku lapangan dinilai teliti: sertakan skala, legenda, dan notasi lapisan batuan yang benar."
    hi: "फ़ील्ड बुकलेट के ड्रॉइंग बारीकी से जाँचे जाते हैं: स्केल, की और सही रॉक-लेयर नोटेशन ज़रूर दें।"
  - en: "Essay marking stresses clear writing and grammar; some found it harsh or inconsistent between markers."
    zh: "论文评分重视表达和语法，有人觉得评分严格或不同批改人标准不一。"
    zh-TW: "論文評分重視表達清楚和文法；有人覺得評分嚴或不同批改者標準不一。"
    ja: "エッセイの採点は明快な文章と文法を重視。厳しい、採点者によってばらつくと感じた人も。"
    ko: "에세이 채점은 명확한 글쓰기와 문법을 중시하며, 엄격하거나 채점자마다 다르다는 의견도 있음."
    vi: "Chấm luận chú trọng viết rõ ràng và ngữ pháp; một số thấy chấm gắt hoặc không đồng đều giữa người chấm."
    ms: "Pemarkahan esei menekankan penulisan jelas dan tatabahasa; ada yang rasa ketat atau tidak konsisten antara pemeriksa."
    id: "Penilaian esai menekankan tulisan yang jelas dan tata bahasa; sebagian merasa ketat atau tidak konsisten antarpenilai."
    hi: "निबंध की मार्किंग साफ़ लेखन और ग्रामर पर ज़ोर देती है; कुछ को यह सख़्त या मार्कर के हिसाब से असंगत लगी।"
  - en: "Opinions are split for non-geology students: some loved it, others found it disorganised and not an easy WAM booster."
    zh: "对非地质专业学生评价不一：有人很喜欢，也有人觉得组织混乱，并非轻松提分课。"
    zh-TW: "非地質系學生評價不一：有人很喜歡，也有人覺得組織混亂，不是輕鬆拉分課。"
    ja: "地質学以外の学生の意見は分かれる。大好きという人もいれば、運営が雑で楽なWAMブースターではないという人も。"
    ko: "비지질 전공 학생들 의견은 갈림: 아주 좋았다는 사람도, 체계가 없고 쉬운 WAM 부스터가 아니라는 사람도 있음."
    vi: "Ý kiến của sinh viên ngoài ngành địa chất trái chiều: có người rất thích, người khác thấy lộn xộn và không phải môn dễ kéo WAM."
    ms: "Pendapat pelajar bukan geologi berbelah bahagi: ada yang suka sangat, ada yang rasa tidak teratur dan bukan penggalak WAM mudah."
    id: "Pendapat mahasiswa non-geologi terbelah: ada yang sangat suka, ada yang merasa berantakan dan bukan pendongkrak WAM yang mudah."
    hi: "नॉन-जियोलॉजी स्टूडेंट्स की राय बँटी है: कुछ को बहुत पसंद आया, कुछ को अव्यवस्थित लगा और आसान WAM बूस्टर नहीं।"
