points:
  - en: "Built around a roughly 6-day field trip with field exercises, followed by a 2000-word research essay."
    zh: "课程核心是约6天的野外考察和野外练习，之后写一篇2000字的研究论文。"
  - en: "Field booklet drawings are marked closely: include a scale, a key and proper rock-layer notation."
    zh: "野外手册绘图评分细致：要标比例尺、图例和规范的岩层符号。"
  - en: "Essay marking stresses clear writing and grammar; some found it harsh or inconsistent between markers."
    zh: "论文评分重视表达和语法，有人觉得评分严格或不同批改人标准不一。"
  - en: "Opinions are split for non-geology students: some loved it, others found it disorganised and not an easy WAM booster."
    zh: "对非地质专业学生评价不一：有人很喜欢，也有人觉得组织混乱，并非轻松提分课。"
