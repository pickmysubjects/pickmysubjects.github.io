code: POPH20001
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/poph20001
reviews: 10
from: 2020
to: 2026
checked: 2026-10-21
points:
  - en: "Most reviewers call it an interesting, low-workload breadth and a WAM booster, with an average mark said to sit around the mid-80s."
    zh: "多数评论者认为这门通识课有趣、负担轻，是提分课，据说平均分在85左右。"
    zh-TW: "多數評論者認為這門通識課有趣、負擔輕，是拉分課，據說平均分數在85左右。"
    ja: "多くの人が、面白く負担の軽いブレッドスでWAMを上げやすいと評価。平均点は85前後とされる。"
    ko: "대부분 흥미롭고 부담이 적은 교양으로 WAM 올리기 좋다고 평가. 평균 점수는 85 안팎이라고 함."
    vi: "Đa số coi đây là môn breadth thú vị, nhẹ nhàng, dễ kéo WAM, điểm trung bình được cho là khoảng 85."
    ms: "Kebanyakan pengulas kata ia subjek breadth menarik, beban ringan dan penaik WAM, purata markah sekitar 85."
    id: "Sebagian besar menyebutnya breadth menarik, beban ringan, dan pendongkrak WAM, dengan rata-rata nilai sekitar 85."
    hi: "ज़्यादातर रिव्यूअर इसे रोचक, कम वर्कलोड वाला ब्रेड्थ और WAM बूस्टर कहते हैं; औसत अंक लगभग 85 बताए जाते हैं।"
  - en: "The quizzes are short and the group creative project is light, but your mark there depends on your group and on how creative the presentation is."
    zh: "小测很短，小组创意项目也不重，但这部分分数取决于组员，以及展示是否够有创意。"
    zh-TW: "小考很短，小組創意專案也不重，但這部分分數取決於組員，以及展示是否夠有創意。"
    ja: "小テストは短く、グループの創作課題も軽め。ただし点数はメンバー次第で、発表の独創性が重視される。"
    ko: "퀴즈는 짧고 그룹 창작 과제도 가볍지만, 점수는 조원과 발표의 창의성에 달려 있음."
    vi: "Quiz ngắn và dự án sáng tạo nhóm nhẹ, nhưng điểm phụ thuộc vào nhóm và độ sáng tạo của bài trình bày."
    ms: "Kuiz pendek dan projek kreatif kumpulan ringan, tetapi markah bergantung pada ahli kumpulan dan kreativiti pembentangan."
    id: "Kuis singkat dan proyek kreatif kelompok ringan, tapi nilainya tergantung kelompok dan seberapa kreatif presentasinya."
    hi: "क्विज़ छोटे हैं और ग्रुप क्रिएटिव प्रोजेक्ट हल्का है, पर अंक आपके ग्रुप और प्रस्तुति की रचनात्मकता पर निर्भर हैं।"
  - en: "The exam is long on writing and tight on time, but open-ended answers are marked generously; going to tutorials and knowing the core ethical principles helps most."
    zh: "考试写作量大、时间紧，但开放题给分宽松；去上辅导课、掌握核心伦理原则最有帮助。"
    zh-TW: "考試寫作量大、時間緊，但開放題給分寬鬆；去上輔導課、掌握核心倫理原則最有幫助。"
    ja: "試験は記述が多く時間に追われるが、自由記述の採点は甘め。チュートリアル出席と主要な倫理原則の理解が鍵。"
    ko: "시험은 쓸 게 많고 시간이 빠듯하지만 서술형 채점은 후한 편. 튜토리얼 참석과 핵심 윤리 원칙 이해가 가장 도움 됨."
    vi: "Bài thi viết nhiều và gấp thời gian, nhưng câu mở chấm rộng tay; đi tutorial và nắm các nguyên tắc đạo đức cốt lõi là quan trọng nhất."
    ms: "Peperiksaan banyak menulis dan masa suntuk, tetapi jawapan terbuka dimarkah murah; hadir tutorial dan fahami prinsip etika teras paling membantu."
    id: "Ujian banyak menulis dan waktunya ketat, tapi jawaban terbuka dinilai longgar; hadir tutorial dan paham prinsip etika inti paling membantu."
    hi: "परीक्षा में लिखना बहुत और समय कम है, पर खुले जवाबों पर उदार अंक मिलते हैं; ट्यूटोरियल जाना और मूल नैतिक सिद्धांत जानना सबसे ज़्यादा मदद करता है।"
  - en: "A minority disagreed: one 2023 reviewer found the quizzes hard and said it was no WAM booster without steady effort."
    zh: "也有少数不同意见：一位2023年的评论者觉得小测不简单，认为不持续用功就谈不上提分。"
    zh-TW: "也有少數不同意見：一位2023年的評論者覺得小考不簡單，認為不持續用功就談不上拉分。"
    ja: "少数の反対意見も。2023年のある人は小テストが難しく、継続して努力しないとWAMは上がらないと述べた。"
    ko: "소수 반대 의견도 있음. 2023년 한 리뷰어는 퀴즈가 어려웠고 꾸준히 노력하지 않으면 WAM 부스터가 아니라고 함."
    vi: "Một số ít không đồng ý: một người năm 2023 thấy quiz khó và cho rằng không chăm chỉ thì không dễ kéo WAM."
    ms: "Segelintir tidak setuju: seorang pengulas 2023 rasa kuiz sukar dan kata ia bukan penaik WAM tanpa usaha berterusan."
    id: "Sebagian kecil tak setuju: satu pengulas 2023 merasa kuisnya sulit dan bilang bukan pendongkrak WAM tanpa usaha konsisten."
    hi: "कुछ असहमत भी: 2023 के एक रिव्यूअर को क्विज़ कठिन लगे और कहा कि लगातार मेहनत के बिना यह WAM बूस्टर नहीं है।"
sections:
  content:
    - en: "Ethical, legal and social sides of genetics: testing, counselling, law, identity and genetics in art. Light content after the first few science weeks; it can feel close to an arts subject."
      zh: "讲遗传学的伦理、法律和社会层面：基因检测、遗传咨询、法律、身份认同、艺术中的遗传学。前几周偏科学，之后内容轻松，有点像文科课。"
      zh-TW: "講遺傳學的倫理、法律和社會層面：基因檢測、遺傳諮詢、法律、身分認同、藝術中的遺傳學。前幾週偏科學，之後內容輕鬆，有點像文科課。"
      ja: "遺伝学の倫理・法・社会的側面（遺伝子検査、カウンセリング、法律、アイデンティティ、芸術と遺伝学）。最初の数週の科学パート以降は軽く、文系科目に近い感覚。"
      ko: "유전학의 윤리·법·사회적 측면(유전자 검사, 상담, 법, 정체성, 예술 속 유전학)을 다룬다. 처음 몇 주 과학 파트 이후엔 가볍고 문과 과목 느낌이다."
      vi: "Các khía cạnh đạo đức, pháp lý, xã hội của di truyền: xét nghiệm, tư vấn, luật, bản sắc, di truyền trong nghệ thuật. Sau vài tuần đầu khoa học thì nhẹ, gần như môn xã hội."
      ms: "Aspek etika, undang-undang dan sosial genetik: ujian, kaunseling, undang-undang, identiti dan genetik dalam seni. Ringan selepas beberapa minggu sains awal; terasa seperti subjek sastera."
      id: "Sisi etika, hukum dan sosial genetika: tes, konseling, hukum, identitas dan genetika dalam seni. Ringan setelah beberapa minggu awal sains; terasa mirip mata kuliah humaniora."
      hi: "जेनेटिक्स के नैतिक, कानूनी और सामाजिक पहलू: टेस्टिंग, काउंसलिंग, कानून, पहचान और कला में जेनेटिक्स। शुरुआती साइंस हफ़्तों के बाद हल्का; आर्ट्स विषय जैसा लगता है।"
    - en: "A different lecturer most weeks, so quality varies and some content overlaps. The bioinformatics lecture is the hard one; one reviewer says it was assessed thoroughly."
      zh: "几乎每周换讲师，质量参差，也有内容重复。生物信息学那节最难；有同学说那部分考得很细。"
      zh-TW: "幾乎每週換講師，品質參差，也有內容重複。生物資訊學那堂最難；有同學說那部分考得很細。"
      ja: "ほぼ毎週講師が替わり、質に差があり内容の重複も。バイオインフォマティクスの講義が難関で、しっかり出題されたという人も。"
      ko: "거의 매주 강사가 바뀌어 질이 들쭉날쭉하고 내용이 겹치기도 한다. 생물정보학 강의가 어려운데, 그 부분이 꼼꼼히 출제됐다는 사람도 있다."
      vi: "Gần như tuần nào cũng đổi giảng viên nên chất lượng không đều, có phần trùng lặp. Bài tin sinh học là khó nhất; một người nói phần này bị hỏi kỹ."
      ms: "Pensyarah berbeza hampir setiap minggu, jadi kualiti berbeza dan ada kandungan bertindih. Kuliah bioinformatik paling sukar; seorang kata ia diuji dengan teliti."
      id: "Hampir tiap minggu dosennya beda, jadi kualitas bervariasi dan ada materi tumpang tindih. Kuliah bioinformatika paling sulit; satu pengulas bilang bagian itu diujikan mendalam."
      hi: "लगभग हर हफ़्ते अलग लेक्चरर, इसलिए गुणवत्ता बदलती है और कुछ कंटेंट दोहराया जाता है। बायोइन्फ़ॉर्मेटिक्स लेक्चर कठिन है; एक के अनुसार इसे अच्छी तरह परखा गया।"
  work:
    - en: "Three online quizzes (25%), a group creative presentation on a book, show or film (15%), and a 60% exam. Most found the quizzes easy, though one found them hard and oddly worded."
      zh: "三次网上小测（25%）、一个围绕书或影视作品的小组创意展示（15%），期末占 60%。多数人觉得小测简单，也有人觉得难、措辞奇怪。"
      zh-TW: "三次線上小考（25%）、一個圍繞書或影視作品的小組創意報告（15%），期末占 60%。多數人覺得小考簡單，也有人覺得難、措辭奇怪。"
      ja: "オンラインクイズ3回（25%）、本や映像作品についてのグループ創作発表（15%）、期末60%。クイズは簡単という声が多いが、難しく言い回しが変だという人も。"
      ko: "온라인 퀴즈 3번(25%), 책이나 영상 작품에 대한 조별 창작 발표(15%), 기말 60%. 퀴즈는 대부분 쉬웠다지만 어렵고 문구가 이상했다는 사람도 있다."
      vi: "Ba quiz online (25%), thuyết trình nhóm sáng tạo về sách, phim (15%) và thi cuối 60%. Đa số thấy quiz dễ, dù một người thấy khó và diễn đạt lạ."
      ms: "Tiga kuiz dalam talian (25%), pembentangan kreatif kumpulan tentang buku, rancangan atau filem (15%), dan peperiksaan 60%. Kebanyakan rasa kuiz mudah, seorang rasa sukar dan bahasanya pelik."
      id: "Tiga kuis online (25%), presentasi kreatif kelompok tentang buku, serial atau film (15%), dan ujian 60%. Kebanyakan merasa kuisnya mudah, satu merasa sulit dan kalimatnya aneh."
      hi: "तीन ऑनलाइन क्विज़ (25%), किताब, शो या फ़िल्म पर ग्रुप क्रिएटिव प्रेज़ेंटेशन (15%), और 60% परीक्षा। ज़्यादातर को क्विज़ आसान लगे, एक को कठिन और अजीब शब्दों वाले।"
    - en: "The exam is time-pressured with lots of writing, but you choose some long questions and marking is generous for reasonable, well-justified answers."
      zh: "期末时间很紧、要写很多，但长题可以自选几道，只要答得合理、有理有据，给分很宽松。"
      zh-TW: "期末時間很緊、要寫很多，但長題可以自選幾道，只要答得合理、有理有據，給分很寬鬆。"
      ja: "期末は時間がきつく書く量が多いが、長い問題は選択制で、筋の通った答えなら採点は甘い。"
      ko: "기말은 시간이 빠듯하고 쓸 게 많지만 긴 문제는 골라 풀 수 있고, 타당한 근거가 있으면 채점이 후하다."
      vi: "Bài thi gấp thời gian, viết nhiều, nhưng được chọn một số câu dài và chấm rộng tay cho câu trả lời hợp lý, có lập luận."
      ms: "Peperiksaan suntuk masa dengan banyak menulis, tetapi anda pilih beberapa soalan panjang dan pemarkahan murah hati untuk jawapan munasabah yang berhujah."
      id: "Ujian mepet waktu dan banyak menulis, tapi bisa memilih beberapa soal panjang dan penilaian murah untuk jawaban yang masuk akal dan beralasan."
      hi: "परीक्षा में समय कम और लिखना बहुत, पर कुछ लंबे सवाल चुन सकते हैं और तर्कसंगत, सही ठहराए जवाबों पर अंकन उदार है।"
  study:
    - en: "Go to tutorials, since answers aren't posted and they show which topics matter; know the four core ethical principles well. Be creative in the group presentation."
      zh: "tutorial 要去，答案不会发出来，而且能看出哪些主题重要；四个核心伦理原则一定要吃透。小组展示要尽量有创意。"
      zh-TW: "tutorial 要去，答案不會公布，而且能看出哪些主題重要；四個核心倫理原則一定要吃透。小組報告要盡量有創意。"
      ja: "チュートリアルは出る。解答は公開されず、重要なテーマが分かる。4つの基本的な倫理原則はしっかり押さえる。グループ発表は創造性を重視。"
      ko: "튜토리얼에 가라. 답이 공개되지 않고 어떤 주제가 중요한지 알 수 있다. 4대 윤리 원칙을 확실히 알아 둬라. 조별 발표는 창의적으로."
      vi: "Đi tutorial vì đáp án không được đăng và nó cho thấy chủ đề nào quan trọng; nắm chắc bốn nguyên tắc đạo đức cốt lõi. Thuyết trình nhóm hãy sáng tạo."
      ms: "Hadir tutorial kerana jawapan tidak disiarkan dan ia tunjuk topik penting; fahami empat prinsip etika teras. Jadilah kreatif dalam pembentangan kumpulan."
      id: "Ikuti tutorial karena jawaban tidak diunggah dan menunjukkan topik penting; kuasai empat prinsip etika inti. Buat presentasi kelompok sekreatif mungkin."
      hi: "ट्यूटोरियल में जाएँ, क्योंकि जवाब पोस्ट नहीं होते और इनसे पता चलता है कौन से टॉपिक ज़रूरी हैं; चार मूल नैतिक सिद्धांत अच्छी तरह जानें। ग्रुप प्रेज़ेंटेशन में रचनात्मक रहें।"
  watch:
    - en: "Most call it a WAM booster, but group marks depend on your groupmates (one reviewer notes there's no peer review), and one found it far from easy."
      zh: "多数人说是刷分课，但小组分数取决于组员（有人提到没有互评），也有人觉得一点都不轻松。"
      zh-TW: "多數人說是拉分課，但小組分數取決於組員（有人提到沒有互評），也有人覺得一點都不輕鬆。"
      ja: "WAMを稼げるという声が多いが、グループの点はメンバー次第（相互評価なしとの指摘も）。全然簡単でなかったという人も。"
      ko: "대부분 WAM 부스터라고 하지만 조별 점수는 조원에 달렸고(동료 평가가 없다는 지적도) 전혀 쉽지 않았다는 사람도 있다."
      vi: "Đa số gọi là môn kéo WAM, nhưng điểm nhóm phụ thuộc bạn cùng nhóm (một người nói không có đánh giá chéo), và một người thấy không hề dễ."
      ms: "Kebanyakan kata penaik WAM, tetapi markah kumpulan bergantung pada ahli (seorang kata tiada penilaian rakan), dan seorang rasa ia jauh dari mudah."
      id: "Kebanyakan bilang pendongkrak WAM, tapi nilai kelompok tergantung anggota (satu bilang tidak ada peer review), dan satu merasa jauh dari mudah."
      hi: "ज़्यादातर इसे WAM बूस्टर कहते हैं, पर ग्रुप के अंक साथियों पर निर्भर हैं (एक के अनुसार पीयर रिव्यू नहीं), और एक को यह बिल्कुल आसान नहीं लगा।"
workload: light
difficulty: easy
