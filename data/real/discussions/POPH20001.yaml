reviews: 10
from: 2020
to: 2026
checked: 2026-10-21
points:
  - en: "Most reviewers call it an interesting, low-workload breadth and a WAM booster, with an average mark said to sit around the mid-80s."
    zh: "多数评论者认为这门通识课有趣、负担轻，是提分课，据说平均分在85左右。"
    zh-TW: "多數評論者認為這門通識課有趣、負擔輕，是拉分課，據說平均分數在85左右。"
    ja: "多くの人が、面白く負担の軽いブレッドスでWAMを上げやすいと評価。平均点は85前後とされる。"
    ko: "대부분 흥미롭고 부담이 적은 교양으로 WAM 올리기 좋다고 평가. 평균 점수는 85 안팎이라고 함."
    vi: "Đa số coi đây là môn breadth thú vị, nhẹ nhàng, dễ kéo WAM, điểm trung bình được cho là khoảng 85."
    ms: "Kebanyakan pengulas kata ia subjek breadth menarik, beban ringan dan penaik WAM, purata markah sekitar 85."
    id: "Sebagian besar menyebutnya breadth menarik, beban ringan, dan pendongkrak WAM, dengan rata-rata nilai sekitar 85."
    hi: "ज़्यादातर रिव्यूअर इसे रोचक, कम वर्कलोड वाला ब्रेड्थ और WAM बूस्टर कहते हैं; औसत अंक लगभग 85 बताए जाते हैं।"
  - en: "The quizzes are short and the group creative project is light, but your mark there depends on your group and on how creative the presentation is."
    zh: "小测很短，小组创意项目也不重，但这部分分数取决于组员，以及展示是否够有创意。"
    zh-TW: "小考很短，小組創意專案也不重，但這部分分數取決於組員，以及展示是否夠有創意。"
    ja: "小テストは短く、グループの創作課題も軽め。ただし点数はメンバー次第で、発表の独創性が重視される。"
    ko: "퀴즈는 짧고 그룹 창작 과제도 가볍지만, 점수는 조원과 발표의 창의성에 달려 있음."
    vi: "Quiz ngắn và dự án sáng tạo nhóm nhẹ, nhưng điểm phụ thuộc vào nhóm và độ sáng tạo của bài trình bày."
    ms: "Kuiz pendek dan projek kreatif kumpulan ringan, tetapi markah bergantung pada ahli kumpulan dan kreativiti pembentangan."
    id: "Kuis singkat dan proyek kreatif kelompok ringan, tapi nilainya tergantung kelompok dan seberapa kreatif presentasinya."
    hi: "क्विज़ छोटे हैं और ग्रुप क्रिएटिव प्रोजेक्ट हल्का है, पर अंक आपके ग्रुप और प्रस्तुति की रचनात्मकता पर निर्भर हैं।"
  - en: "The exam is long on writing and tight on time, but open-ended answers are marked generously; going to tutorials and knowing the core ethical principles helps most."
    zh: "考试写作量大、时间紧，但开放题给分宽松；去上辅导课、掌握核心伦理原则最有帮助。"
    zh-TW: "考試寫作量大、時間緊，但開放題給分寬鬆；去上輔導課、掌握核心倫理原則最有幫助。"
    ja: "試験は記述が多く時間に追われるが、自由記述の採点は甘め。チュートリアル出席と主要な倫理原則の理解が鍵。"
    ko: "시험은 쓸 게 많고 시간이 빠듯하지만 서술형 채점은 후한 편. 튜토리얼 참석과 핵심 윤리 원칙 이해가 가장 도움 됨."
    vi: "Bài thi viết nhiều và gấp thời gian, nhưng câu mở chấm rộng tay; đi tutorial và nắm các nguyên tắc đạo đức cốt lõi là quan trọng nhất."
    ms: "Peperiksaan banyak menulis dan masa suntuk, tetapi jawapan terbuka dimarkah murah; hadir tutorial dan fahami prinsip etika teras paling membantu."
    id: "Ujian banyak menulis dan waktunya ketat, tapi jawaban terbuka dinilai longgar; hadir tutorial dan paham prinsip etika inti paling membantu."
    hi: "परीक्षा में लिखना बहुत और समय कम है, पर खुले जवाबों पर उदार अंक मिलते हैं; ट्यूटोरियल जाना और मूल नैतिक सिद्धांत जानना सबसे ज़्यादा मदद करता है।"
  - en: "A minority disagreed: one 2023 reviewer found the quizzes hard and said it was no WAM booster without steady effort."
    zh: "也有少数不同意见：一位2023年的评论者觉得小测不简单，认为不持续用功就谈不上提分。"
    zh-TW: "也有少數不同意見：一位2023年的評論者覺得小考不簡單，認為不持續用功就談不上拉分。"
    ja: "少数の反対意見も。2023年のある人は小テストが難しく、継続して努力しないとWAMは上がらないと述べた。"
    ko: "소수 반대 의견도 있음. 2023년 한 리뷰어는 퀴즈가 어려웠고 꾸준히 노력하지 않으면 WAM 부스터가 아니라고 함."
    vi: "Một số ít không đồng ý: một người năm 2023 thấy quiz khó và cho rằng không chăm chỉ thì không dễ kéo WAM."
    ms: "Segelintir tidak setuju: seorang pengulas 2023 rasa kuiz sukar dan kata ia bukan penaik WAM tanpa usaha berterusan."
    id: "Sebagian kecil tak setuju: satu pengulas 2023 merasa kuisnya sulit dan bilang bukan pendongkrak WAM tanpa usaha konsisten."
    hi: "कुछ असहमत भी: 2023 के एक रिव्यूअर को क्विज़ कठिन लगे और कहा कि लगातार मेहनत के बिना यह WAM बूस्टर नहीं है।"
workload: light
difficulty: easy
