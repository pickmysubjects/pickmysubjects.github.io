points:
  - en: "Fun if you like pop culture: each week covers a different trend or phenomenon, from films and memes to music."
    zh: "如果喜欢流行文化会很有趣：每周讲一个不同的潮流或现象，从电影、表情包到音乐。"
    zh-TW: "如果喜歡流行文化會很有趣：每週講一個不同的潮流或現象，從電影、迷因到音樂。"
    ja: "ポップカルチャー好きなら楽しい。映画やミームから音楽まで、毎週違うトレンドや現象を扱う。"
    ko: "대중문화를 좋아하면 재미있음. 영화와 밈부터 음악까지 매주 다른 유행이나 현상을 다룸."
    vi: "Thú vị nếu bạn thích văn hóa đại chúng: mỗi tuần một xu hướng hay hiện tượng khác, từ phim, meme đến âm nhạc."
    ms: "Seronok jika anda suka budaya pop: setiap minggu meliputi trend atau fenomena berbeza, daripada filem dan meme hingga muzik."
    id: "Seru kalau kamu suka budaya pop: tiap minggu membahas tren atau fenomena berbeda, dari film dan meme sampai musik."
    hi: "अगर आपको पॉप कल्चर पसंद है तो मज़ेदार है: हर हफ़्ते एक अलग ट्रेंड या घटना, फ़िल्मों और मीम्स से लेकर संगीत तक।"
  - en: "Do not expect K-pop all semester: a 2022 reviewer said it only came up near the end."
    zh: "别指望整学期都讲K-pop：一位2022年的评论者说只在快结束时讲到。"
    zh-TW: "別期待整學期都講K-pop：一位2022年的評論者說只在快結束時講到。"
    ja: "学期中ずっとK-POPを扱うわけではない。2022年のレビューでは終盤に少し出てきただけとのこと。"
    ko: "학기 내내 K-pop을 다룰 거라 기대하지 말 것. 2022년 리뷰어는 막바지에만 나왔다고 함."
    vi: "Đừng mong học K-pop cả kỳ: người đánh giá năm 2022 nói chỉ có ở gần cuối."
    ms: "Jangan harap K-pop sepanjang semester: seorang pengulas 2022 kata ia hanya muncul menjelang akhir."
    id: "Jangan berharap K-pop sepanjang semester: pengulas 2022 bilang itu hanya muncul menjelang akhir."
    hi: "पूरे सेमेस्टर K-pop की उम्मीद न करें: 2022 के एक रिव्यूअर के अनुसार यह सिर्फ़ आख़िर में आया।"
  - en: "Assessment is short blog posts plus essays and was considered manageable; the readings can drag."
    zh: "考核是简短的博客文章加论文，被认为不难应付；阅读材料可能有点拖沓。"
    zh-TW: "評量是簡短的部落格文章加論文，被認為不難應付；閱讀材料可能有點冗長。"
    ja: "評価は短いブログ投稿とエッセイで、こなしやすいとのこと。読み物は退屈なこともある。"
    ko: "평가는 짧은 블로그 글과 에세이로 해볼 만하다는 평. 읽기 자료는 지루할 수 있음."
    vi: "Đánh giá gồm các bài blog ngắn và tiểu luận, được cho là vừa sức; bài đọc có thể hơi lê thê."
    ms: "Penilaian ialah catatan blog pendek serta esei dan dianggap boleh diurus; bacaan boleh meleret."
    id: "Penilaian berupa posting blog singkat plus esai dan dianggap bisa dikelola; bacaannya bisa bertele-tele."
    hi: "आकलन छोटे ब्लॉग पोस्ट और निबंधों से होता है और संभालने लायक माना गया; रीडिंग्स थोड़ी उबाऊ हो सकती हैं।"
difficulty: easy
