points:
  - en: "A semantics and meaning subject with no prerequisites. Most reviewers found it fairly logical and decent, with good marks reachable without huge effort."
    zh: "关于语义和意义的课程，没有先修要求。多数评论者觉得逻辑性强、还不错，不用太费力也能拿好成绩。"
    zh-TW: "關於語意和意義的課程，沒有先修要求。多數評論者覺得邏輯性強、還不錯，不用太費力也能拿好成績。"
    ja: "意味論・意味を扱う科目で前提科目なし。多くは論理的でまずまずの科目とし、大きな努力なしでも良い成績が取れるという。"
    ko: "의미론 과목으로 선수과목 없음. 대부분 논리적이고 괜찮은 과목이며, 큰 노력 없이도 좋은 점수가 가능하다고 함."
    vi: "Môn về ngữ nghĩa, không yêu cầu môn tiên quyết. Đa số thấy môn khá logic, ổn, có thể đạt điểm tốt mà không quá vất vả."
    ms: "Subjek semantik dan makna tanpa prasyarat. Kebanyakan pengulas dapati ia agak logik dan baik, dengan markah baik boleh dicapai tanpa usaha besar."
    id: "Mata kuliah semantik dan makna tanpa prasyarat. Kebanyakan pengulas merasa cukup logis dan lumayan, dengan nilai bagus bisa dicapai tanpa usaha besar."
    hi: "अर्थविज्ञान (semantics) का विषय, कोई पूर्व-आवश्यकता नहीं। ज़्यादातर को यह काफ़ी तार्किक और ठीक-ठाक लगा, बहुत मेहनत के बिना अच्छे अंक संभव।"
  - en: "The data-collection assignments were often called vague, and the formal logic section is rushed and tough if logic is new to you. The final essay is free-topic, so note topics you like."
    zh: "收集数据的作业常被认为要求模糊，形式逻辑部分讲得仓促，没学过逻辑会比较难。期末论文题目自由，留意自己喜欢的主题。"
    zh-TW: "蒐集資料的作業常被認為要求模糊，形式邏輯部分講得倉促，沒學過邏輯會比較難。期末論文題目自由，留意自己喜歡的主題。"
    ja: "データ収集の課題は曖昧だという声が多く、形式論理の部分は駆け足で、論理学が初めてだと難しい。期末エッセイはテーマ自由なので、気に入ったトピックをメモしておくとよい。"
    ko: "데이터 수집 과제는 모호하다는 평이 많고, 형식 논리 부분은 급하게 지나가 논리학이 처음이면 어려움. 기말 에세이는 주제 자유라 관심 주제를 메모해 둘 것."
    vi: "Bài thu thập dữ liệu thường bị cho là mơ hồ, phần logic hình thức dạy vội và khó nếu chưa học logic. Bài luận cuối kỳ tự chọn đề, nên ghi lại chủ đề bạn thích."
    ms: "Tugasan pengumpulan data sering dikatakan kabur, dan bahagian logik formal tergesa-gesa serta sukar jika logik baharu bagi anda. Esei akhir bertopik bebas, jadi catat topik yang anda suka."
    id: "Tugas pengumpulan data sering disebut kabur, dan bagian logika formal terburu-buru serta sulit jika logika masih baru. Esai akhir bebas topik, jadi catat topik yang kamu suka."
    hi: "डेटा इकट्ठा करने वाले असाइनमेंट अक्सर अस्पष्ट बताए गए, और फ़ॉर्मल लॉजिक वाला हिस्सा जल्दबाज़ी में है और लॉजिक नया हो तो कठिन। अंतिम निबंध का विषय खुला है, इसलिए पसंद के टॉपिक नोट करते रहें।"
difficulty: easy
