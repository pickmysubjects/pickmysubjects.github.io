code: CWRI20002
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/cwri20002
reviews: 5
from: 2013
to: 2020
checked: 2026-10-17
points:
  - en: "Tutorials and feedback on your short fiction were the highlight for most, though how much you get out of it depends on your tutor and class."
    zh: "对大多数人来说，辅导课和对自己短篇小说的反馈是最大亮点，不过收获多少取决于辅导老师和同班同学。"
    zh-TW: "對大多數人來說，輔導課和對自己短篇小說的回饋是最大亮點，不過收穫多少取決於助教和同班同學。"
    ja: "多くの人にとってチュートリアルと自作の短編へのフィードバックが一番の収穫だが、得られるものはチューターとクラス次第。"
    ko: "대부분에게 튜토리얼과 자기 단편소설에 대한 피드백이 가장 좋았지만, 얼마나 얻는지는 튜터와 반에 달림."
    vi: "Với đa số, tutorial và phản hồi cho truyện ngắn của mình là điểm sáng, dù thu được bao nhiêu còn tùy tutor và lớp."
    ms: "Tutorial dan maklum balas terhadap cerpen anda menjadi kemuncak bagi kebanyakan orang, walaupun manfaatnya bergantung pada tutor dan kelas anda."
    id: "Tutorial dan umpan balik untuk cerpenmu jadi bagian terbaik bagi kebanyakan orang, meski manfaatnya tergantung tutor dan kelasmu."
    hi: "ज़्यादातर के लिए ट्यूटोरियल और अपनी छोटी कहानी पर मिला फ़ीडबैक सबसे अच्छा हिस्सा था, हालाँकि कितना सीखेंगे यह ट्यूटर और क्लास पर निर्भर है।"
  - en: "Lectures rotate between many guest speakers, which some found disjointed; in 2020 lectures stopped after week 9."
    zh: "讲座由很多客座讲者轮流上，有人觉得零散；2020年讲座在第9周后就停了。"
    zh-TW: "講課由很多客座講者輪流上，有人覺得零散；2020年講課在第9週後就停了。"
    ja: "講義は多くのゲストが交代で担当し、まとまりがないと感じた人もいる。2020年は第9週で講義が終わった。"
    ko: "강의는 여러 초청 연사가 돌아가며 맡아 산만하다는 의견도 있음. 2020년엔 9주차 이후 강의가 없었음."
    vi: "Bài giảng do nhiều khách mời thay nhau, vài người thấy rời rạc; năm 2020 bài giảng dừng sau tuần 9."
    ms: "Kuliah bergilir antara ramai penceramah jemputan, yang ada rasa tidak bersambung; pada 2020 kuliah berhenti selepas minggu 9."
    id: "Kuliah bergantian antara banyak pembicara tamu, yang dirasa sebagian orang tidak nyambung; di 2020 kuliah berhenti setelah minggu 9."
    hi: "लेक्चर कई अतिथि वक्ताओं के बीच बदलते रहते हैं, जो कुछ को बिखरा लगा; 2020 में हफ़्ता 9 के बाद लेक्चर बंद हो गए।"
  - en: "Time commitment is low, with the two main pieces due at the end, so it helps to arrive with a story idea. Not ideal as your first creative writing subject."
    zh: "时间投入不多，两项主要作业都在期末交，所以最好带着故事构想来上课。不太适合作为第一门创意写作课。"
    zh-TW: "時間投入不多，兩項主要作業都在期末交，所以最好帶著故事構想來上課。不太適合作為第一門創意寫作課。"
    ja: "時間的負担は軽く、主要な2つの課題は学期末提出なので、物語のアイデアを持って臨むとよい。最初の創作科目には向かない。"
    ko: "시간 부담은 적고 주요 과제 두 개가 학기말 마감이라, 이야기 아이디어를 갖고 시작하면 좋음. 첫 창작 과목으로는 별로."
    vi: "Tốn ít thời gian, hai bài chính nộp cuối kỳ, nên nên có sẵn ý tưởng truyện. Không lý tưởng làm môn sáng tác đầu tiên."
    ms: "Komitmen masa rendah, dengan dua tugasan utama dihantar di hujung, jadi baik datang dengan idea cerita. Kurang sesuai sebagai subjek penulisan kreatif pertama."
    id: "Komitmen waktu rendah, dua tugas utama dikumpulkan di akhir, jadi sebaiknya datang dengan ide cerita. Kurang cocok sebagai mata kuliah menulis kreatif pertama."
    hi: "समय कम लगता है, दोनों मुख्य काम आख़िर में जमा होते हैं, इसलिए कहानी का आइडिया लेकर आना मददगार है। पहले क्रिएटिव राइटिंग विषय के रूप में आदर्श नहीं।"
sections:
  content:
    - en: "Writing short fiction, reading classic writers and workshopping your own and classmates' pieces. Reviewers enjoyed the tutorials, but several found the rotating lecturers made it disjointed."
      zh: "学写短篇小说，读经典作家作品，并在课上互评自己和同学的作品。同学喜欢 tutorial，但好几位觉得 lecturer 轮换导致内容零散。"
      zh-TW: "學寫短篇小說，讀經典作家作品，並在課上互評自己和同學的作品。同學喜歡 tutorial，但好幾位覺得 lecturer 輪換導致內容零散。"
      ja: "短編小説を書き、古典的な作家を読み、自分や仲間の作品を講評し合う。チュートリアルは好評だが、講師が入れ替わるためまとまりがないという声が複数。"
      ko: "단편 소설을 쓰고 고전 작가를 읽으며 자신과 동료의 작품을 합평한다. 튜토리얼은 좋았지만 강사가 계속 바뀌어 산만하다는 평이 여럿."
      vi: "Viết truyện ngắn, đọc các nhà văn kinh điển và góp ý bài của mình và bạn. Người học thích tutorial, nhưng nhiều người thấy giảng viên thay liên tục nên rời rạc."
      ms: "Menulis cerpen, membaca penulis klasik dan bengkel karya sendiri dan rakan. Pengulas suka tutorial, tetapi beberapa rasa pensyarah yang bertukar-tukar membuatnya bercelaru."
      id: "Menulis cerpen, membaca penulis klasik dan membedah karya sendiri dan teman. Pengulas suka tutorialnya, tapi beberapa merasa dosen yang bergantian membuatnya tidak runtut."
      hi: "लघु कथाएँ लिखना, क्लासिक लेखकों को पढ़ना और अपनी व साथियों की रचनाओं पर वर्कशॉप। रिव्यूअर्स को ट्यूटोरियल पसंद आए, पर कई को बदलते लेक्चररों से यह बिखरा लगा।"
  work:
    - en: "Two major assessments, both near the end of semester. Your experience depends heavily on your tutor and class, and one 2023 reviewer felt marking was vague and based on personal preference."
      zh: "两个主要考核，都在学期末交。体验很看 tutor 和同班同学；一位 2023 年的同学觉得评分标准模糊、凭个人喜好。"
      zh-TW: "兩個主要考核，都在學期末交。體驗很看 tutor 和同班同學；一位 2023 年的同學覺得評分標準模糊、憑個人喜好。"
      ja: "主要課題は2つで、どちらも学期末。体験はチューターとクラス次第。2023年の一人は採点があいまいで個人の好みに左右されると感じた。"
      ko: "주요 평가 2개로 둘 다 학기 말. 경험은 튜터와 반에 크게 좌우되며, 2023년 한 리뷰는 채점이 모호하고 개인 취향에 따른다고 느꼈다."
      vi: "Hai bài đánh giá chính, đều gần cuối kỳ. Trải nghiệm phụ thuộc nhiều vào tutor và lớp, và một người năm 2023 thấy chấm điểm mơ hồ, theo sở thích cá nhân."
      ms: "Dua penilaian utama, kedua-duanya hampir akhir semester. Pengalaman sangat bergantung pada tutor dan kelas, dan seorang pengulas 2023 rasa pemarkahan kabur dan ikut citarasa peribadi."
      id: "Dua penilaian utama, keduanya menjelang akhir semester. Pengalaman sangat bergantung pada tutor dan kelas, dan satu pengulas 2023 merasa penilaian samar dan berdasar selera pribadi."
      hi: "दो मुख्य आकलन, दोनों सेमेस्टर के आख़िर में। अनुभव काफ़ी हद तक ट्यूटर और कक्षा पर निर्भर है, और 2023 के एक को जाँच अस्पष्ट और निजी पसंद पर आधारित लगी।"
  watch:
    - en: "Reviewers suggest having a story idea in mind before you start, and not taking it as your first creative writing subject. One found lectures stopped after week 9."
      zh: "同学建议开课前心里先有个故事构想，也别把它当作第一门创意写作课。有人说第 9 周后就没有讲课了。"
      zh-TW: "同學建議開課前心裡先有個故事構想，也別把它當作第一門創意寫作課。有人說第 9 週後就沒有講課了。"
      ja: "始める前に書きたい物語の案を持っておくこと、最初の創作科目にはしないことを勧める声。第9週以降は講義がなかったという人も。"
      ko: "시작 전에 쓸 이야기 아이디어를 갖고 있을 것, 첫 창작 과목으로 듣지 말 것을 권한다. 9주차 이후 강의가 없었다는 리뷰도 있다."
      vi: "Người học khuyên nên có sẵn ý tưởng truyện trước khi bắt đầu, và đừng chọn làm môn viết sáng tạo đầu tiên. Một người nói sau tuần 9 không còn bài giảng."
      ms: "Pengulas cadang ada idea cerita sebelum bermula, dan jangan jadikan ia subjek penulisan kreatif pertama. Seorang kata kuliah berhenti selepas minggu 9."
      id: "Pengulas menyarankan punya ide cerita sebelum mulai, dan jangan jadikan mata kuliah menulis kreatif pertama. Satu bilang kuliah berhenti setelah minggu 9."
      hi: "रिव्यूअर्स सुझाव देते हैं शुरू करने से पहले कहानी का विचार तय रखें, और इसे पहला रचनात्मक लेखन विषय न बनाएँ। एक को हफ़्ता 9 के बाद लेक्चर बंद मिले।"
workload: light
