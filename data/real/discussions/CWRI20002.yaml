points:
  - en: "Tutorials and feedback on your short fiction were the highlight for most, though how much you get out of it depends on your tutor and class."
    zh: "对大多数人来说，辅导课和对自己短篇小说的反馈是最大亮点，不过收获多少取决于辅导老师和同班同学。"
    zh-TW: "對大多數人來說，輔導課和對自己短篇小說的回饋是最大亮點，不過收穫多少取決於助教和同班同學。"
    ja: "多くの人にとってチュートリアルと自作の短編へのフィードバックが一番の収穫だが、得られるものはチューターとクラス次第。"
    ko: "대부분에게 튜토리얼과 자기 단편소설에 대한 피드백이 가장 좋았지만, 얼마나 얻는지는 튜터와 반에 달림."
    vi: "Với đa số, tutorial và phản hồi cho truyện ngắn của mình là điểm sáng, dù thu được bao nhiêu còn tùy tutor và lớp."
    ms: "Tutorial dan maklum balas terhadap cerpen anda menjadi kemuncak bagi kebanyakan orang, walaupun manfaatnya bergantung pada tutor dan kelas anda."
    id: "Tutorial dan umpan balik untuk cerpenmu jadi bagian terbaik bagi kebanyakan orang, meski manfaatnya tergantung tutor dan kelasmu."
    hi: "ज़्यादातर के लिए ट्यूटोरियल और अपनी छोटी कहानी पर मिला फ़ीडबैक सबसे अच्छा हिस्सा था, हालाँकि कितना सीखेंगे यह ट्यूटर और क्लास पर निर्भर है।"
  - en: "Lectures rotate between many guest speakers, which some found disjointed; in 2020 lectures stopped after week 9."
    zh: "讲座由很多客座讲者轮流上，有人觉得零散；2020年讲座在第9周后就停了。"
    zh-TW: "講課由很多客座講者輪流上，有人覺得零散；2020年講課在第9週後就停了。"
    ja: "講義は多くのゲストが交代で担当し、まとまりがないと感じた人もいる。2020年は第9週で講義が終わった。"
    ko: "강의는 여러 초청 연사가 돌아가며 맡아 산만하다는 의견도 있음. 2020년엔 9주차 이후 강의가 없었음."
    vi: "Bài giảng do nhiều khách mời thay nhau, vài người thấy rời rạc; năm 2020 bài giảng dừng sau tuần 9."
    ms: "Kuliah bergilir antara ramai penceramah jemputan, yang ada rasa tidak bersambung; pada 2020 kuliah berhenti selepas minggu 9."
    id: "Kuliah bergantian antara banyak pembicara tamu, yang dirasa sebagian orang tidak nyambung; di 2020 kuliah berhenti setelah minggu 9."
    hi: "लेक्चर कई अतिथि वक्ताओं के बीच बदलते रहते हैं, जो कुछ को बिखरा लगा; 2020 में हफ़्ता 9 के बाद लेक्चर बंद हो गए।"
  - en: "Time commitment is low, with the two main pieces due at the end, so it helps to arrive with a story idea. Not ideal as your first creative writing subject."
    zh: "时间投入不多，两项主要作业都在期末交，所以最好带着故事构想来上课。不太适合作为第一门创意写作课。"
    zh-TW: "時間投入不多，兩項主要作業都在期末交，所以最好帶著故事構想來上課。不太適合作為第一門創意寫作課。"
    ja: "時間的負担は軽く、主要な2つの課題は学期末提出なので、物語のアイデアを持って臨むとよい。最初の創作科目には向かない。"
    ko: "시간 부담은 적고 주요 과제 두 개가 학기말 마감이라, 이야기 아이디어를 갖고 시작하면 좋음. 첫 창작 과목으로는 별로."
    vi: "Tốn ít thời gian, hai bài chính nộp cuối kỳ, nên nên có sẵn ý tưởng truyện. Không lý tưởng làm môn sáng tác đầu tiên."
    ms: "Komitmen masa rendah, dengan dua tugasan utama dihantar di hujung, jadi baik datang dengan idea cerita. Kurang sesuai sebagai subjek penulisan kreatif pertama."
    id: "Komitmen waktu rendah, dua tugas utama dikumpulkan di akhir, jadi sebaiknya datang dengan ide cerita. Kurang cocok sebagai mata kuliah menulis kreatif pertama."
    hi: "समय कम लगता है, दोनों मुख्य काम आख़िर में जमा होते हैं, इसलिए कहानी का आइडिया लेकर आना मददगार है। पहले क्रिएटिव राइटिंग विषय के रूप में आदर्श नहीं।"
workload: light
