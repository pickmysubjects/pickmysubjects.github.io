points:
  - en: "Your experience depends heavily on your team and your assigned supervisor. Be proactive in choosing a good team."
    zh: "体验很大程度取决于团队和分配的导师，要主动挑选好的队友。"
    zh-TW: "體驗很大程度取決於你的團隊和分配到的指導老師。要主動挑好隊友。"
    ja: "経験はチームと割り当てられた指導担当に大きく左右される。良いチームを自分から探そう。"
    ko: "경험은 팀과 배정된 지도교수에 크게 좌우된다. 좋은 팀을 적극적으로 꾸리자."
    vi: "Trải nghiệm phụ thuộc nhiều vào nhóm và người hướng dẫn được phân công. Hãy chủ động chọn nhóm tốt."
    ms: "Pengalaman anda sangat bergantung pada pasukan dan penyelia yang ditetapkan. Bersikap proaktif memilih pasukan yang baik."
    id: "Pengalamanmu sangat tergantung tim dan pembimbing yang ditugaskan. Proaktiflah memilih tim yang bagus."
    hi: "आपका अनुभव काफ़ी हद तक टीम और दिए गए सुपरवाइज़र पर निर्भर है। अच्छी टीम चुनने में पहल करें।"
  - en: "All reviewers criticised the subject management and found the lectures of little use."
    zh: "所有评价都批评课程管理，并认为讲座用处不大。"
    zh-TW: "所有評論者都批評課程管理，也覺得講課用處不大。"
    ja: "レビュアー全員が科目の運営を批判し、講義はあまり役に立たないと感じた。"
    ko: "모든 리뷰어가 과목 운영을 비판했고 강의는 별 도움이 안 된다고 했다."
    vi: "Tất cả người đánh giá đều chê cách quản lý môn học và thấy bài giảng ít hữu ích."
    ms: "Semua pengulas mengkritik pengurusan subjek dan dapati kuliah kurang berguna."
    id: "Semua pengulas mengkritik pengelolaan mata kuliah dan merasa kuliahnya kurang berguna."
    hi: "सभी रिव्यूअर्स ने सब्जेक्ट मैनेजमेंट की आलोचना की और लेक्चर को कम उपयोगी पाया।"
  - en: "Some felt the project brief was restrictive or dull, though one found the project itself interesting."
    zh: "有人认为项目题目限制多或乏味，也有人觉得项目本身挺有意思。"
    zh-TW: "有人覺得專題題目限制多或無聊，但也有人覺得專題本身很有趣。"
    ja: "プロジェクトの課題設定が窮屈、または退屈だと感じた人もいたが、プロジェクト自体は面白かったという人もいる。"
    ko: "프로젝트 주제가 제약이 많거나 지루하다는 사람도 있었지만, 프로젝트 자체는 흥미로웠다는 사람도 있다."
    vi: "Có người thấy đề bài dự án gò bó hoặc nhàm chán, dù một người thấy bản thân dự án thú vị."
    ms: "Ada yang rasa taklimat projek terhad atau membosankan, walaupun seorang dapati projek itu sendiri menarik."
    id: "Ada yang merasa brief proyek membatasi atau membosankan, meski satu orang merasa proyeknya sendiri menarik."
    hi: "कुछ को प्रोजेक्ट ब्रीफ़ सीमित या उबाऊ लगा, हालाँकि एक को प्रोजेक्ट ख़ुद दिलचस्प लगा।"
