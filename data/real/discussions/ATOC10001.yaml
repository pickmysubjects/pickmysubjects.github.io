points:
  - en: "Generally seen as an easy, interesting elective; several got an H1 with little study."
    zh: "普遍认为是轻松有趣的选修课；几位评论者没怎么复习就拿到了H1。"
    zh-TW: "普遍認為是輕鬆有趣的選修；有幾個人沒怎麼讀就拿到H1。"
    ja: "気楽で面白い選択科目という評価が多い。あまり勉強せずにH1を取った人も何人かいる。"
    ko: "대체로 쉽고 재미있는 선택 과목으로 봄. 별로 공부 안 하고 H1을 받은 사람도 여럿."
    vi: "Thường được xem là môn tự chọn dễ và thú vị; vài người đạt H1 mà học rất ít."
    ms: "Umumnya dianggap elektif yang mudah dan menarik; beberapa orang dapat H1 dengan sedikit belajar."
    id: "Umumnya dianggap mata kuliah pilihan yang mudah dan menarik; beberapa dapat H1 dengan sedikit belajar."
    hi: "आमतौर पर आसान और दिलचस्प इलेक्टिव माना जाता है; कई लोगों को कम पढ़ाई में H1 मिला।"
  - en: "Labs are long and dull; you mainly attend to get the password for the weekly quiz."
    zh: "实验课时间长且枯燥，去上课主要是为了拿每周小测的密码。"
    zh-TW: "實驗課又長又無聊；去上課主要是為了拿每週小考的密碼。"
    ja: "実験は長くて退屈。主に毎週の小テストのパスワードをもらうために出席する。"
    ko: "실험은 길고 지루함. 주로 매주 퀴즈 비밀번호를 받으려고 참석함."
    vi: "Buổi lab dài và chán; đi chủ yếu để lấy mật khẩu làm quiz hằng tuần."
    ms: "Makmal panjang dan membosankan; anda hadir terutamanya untuk dapat kata laluan kuiz mingguan."
    id: "Lab-nya lama dan membosankan; datang terutama untuk dapat kata sandi kuis mingguan."
    hi: "लैब लंबे और उबाऊ हैं; आप मुख्य रूप से हफ़्ते के क्विज़ का पासवर्ड लेने जाते हैं।"
  - en: "Assignments are easy to score well in; the group project involves collecting data over a long period."
    zh: "作业容易拿高分；小组项目需要长时间收集数据。"
    zh-TW: "作業很容易拿高分；小組專題要長時間收集數據。"
    ja: "課題は高得点を取りやすい。グループプロジェクトは長期間データを集める必要がある。"
    ko: "과제는 고득점이 쉬움. 그룹 프로젝트는 오랜 기간 데이터를 모아야 함."
    vi: "Bài tập dễ đạt điểm cao; dự án nhóm phải thu thập dữ liệu trong thời gian dài."
    ms: "Tugasan mudah dapat markah tinggi; projek kumpulan melibatkan pengumpulan data dalam tempoh panjang."
    id: "Tugas gampang dapat nilai bagus; proyek kelompok butuh pengumpulan data dalam waktu lama."
    hi: "असाइनमेंट में अच्छे नंबर लाना आसान है; ग्रुप प्रोजेक्ट में लंबे समय तक डेटा इकट्ठा करना पड़ता है।"
  - en: "Opinions on the exam are split: most found it reasonable, but one 2018 reviewer found it difficult."
    zh: "对考试意见不一：多数人认为合理，但一位2018年的评论者觉得很难。"
    zh-TW: "對考試意見不一：多數人覺得合理，但一位2018年的評論者覺得很難。"
    ja: "試験の評価は分かれる。多くは妥当と感じたが、2018年のレビュー1件は難しかったとしている。"
    ko: "시험에 대한 의견은 갈림: 대부분 무난하다고 했지만, 2018년 리뷰어 한 명은 어려웠다고 함."
    vi: "Ý kiến về bài thi chia rẽ: đa số thấy hợp lý, nhưng một người năm 2018 thấy khó."
    ms: "Pendapat tentang peperiksaan berbeza: kebanyakan rasa munasabah, tetapi seorang pengulas 2018 rasa sukar."
    id: "Pendapat soal ujian terbelah: kebanyakan merasa wajar, tapi satu pengulas 2018 merasa sulit."
    hi: "एग्ज़ाम पर राय बँटी है: ज़्यादातर को ठीक लगा, पर 2018 के एक रिव्यूअर को कठिन लगा।"
workload: light
difficulty: easy
