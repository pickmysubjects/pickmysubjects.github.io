code: PHYC10009
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/phyc10009
reviews: 10
from: 2021
to: 2026
checked: 2026-10-08
points:
  - en: "Most reviewers say it is hard and not a WAM booster. It packs high school physics plus Physics 1 content into one fast-paced semester."
    zh: "多数评价认为很难，不是提分课；一学期快速覆盖高中物理加物理1的内容。"
    zh-TW: "多數評價認為很難，不是提升WAM的課；一學期快速涵蓋高中物理加物理1的內容。"
    ja: "ほとんどのレビューで難しく、WAMを上げる科目ではないとされています。高校物理と物理1の内容を1学期で一気に詰め込みます。"
    ko: "대부분 어렵고 WAM 올리기용 과목이 아니라고 합니다. 고교 물리와 물리 1 내용을 한 학기에 빠르게 다룹니다."
    vi: "Đa số nói môn khó và không giúp tăng WAM. Nó dồn vật lý cấp 3 cộng nội dung Vật lý 1 vào một học kỳ tốc độ nhanh."
    ms: "Kebanyakan pengulas kata ia sukar dan bukan penaik WAM. Ia memadatkan fizik sekolah menengah dan Fizik 1 dalam satu semester yang laju."
    id: "Kebanyakan pengulas bilang sulit dan bukan pendongkrak WAM. Fisika SMA plus materi Fisika 1 dipadatkan dalam satu semester yang cepat."
    hi: "ज़्यादातर रिव्यूअर्स कहते हैं कि यह कठिन है और WAM बढ़ाने वाला नहीं। इसमें हाई स्कूल फिज़िक्स और Physics 1 एक तेज़ सेमेस्टर में ठूँसे गए हैं।"
  - en: "Many found the lectures hard to follow. They relied on the textbook, YouTube and the problem-solving classes, which were widely praised."
    zh: "很多人觉得讲座难懂，主要靠教材、YouTube和备受好评的习题课学习。"
    zh-TW: "很多人覺得講座難懂，主要靠教材、YouTube和備受好評的習題課學習。"
    ja: "講義が分かりにくいという人が多く、教科書、YouTube、評判の良い演習クラスに頼っていました。"
    ko: "강의를 따라가기 어렵다는 사람이 많았고, 교과서, YouTube, 호평받는 문제 풀이 수업에 의존했습니다."
    vi: "Nhiều người thấy bài giảng khó theo, nên dựa vào giáo trình, YouTube và các lớp giải bài tập vốn được khen nhiều."
    ms: "Ramai dapati kuliah sukar diikuti. Mereka bergantung pada buku teks, YouTube dan kelas penyelesaian masalah yang dipuji ramai."
    id: "Banyak yang merasa kuliah sulit diikuti. Mereka mengandalkan buku teks, YouTube, dan kelas latihan soal yang banyak dipuji."
    hi: "कई लोगों को लेक्चर समझना मुश्किल लगा। वे टेक्स्टबुक, YouTube और प्रॉब्लम-सॉल्विंग क्लासेज़ पर निर्भर रहे, जिनकी खूब तारीफ हुई।"
  - en: "The weekly quizzes are manageable, but pracs feel rushed. Prepare the lab questions before class."
    zh: "每周小测较容易拿分，但实验课时间紧，建议课前先准备好实验题目。"
    zh-TW: "每週小測驗不難應付，但實驗課時間緊，建議課前先準備好實驗題目。"
    ja: "毎週の小テストはこなせますが、実習は慌ただしいです。授業前に実験の問題を準備しておきましょう。"
    ko: "매주 퀴즈는 할 만하지만 실습은 촉박합니다. 수업 전에 실험 문제를 준비하세요."
    vi: "Quiz hằng tuần làm được, nhưng thực hành thì gấp. Hãy chuẩn bị câu hỏi lab trước buổi học."
    ms: "Kuiz mingguan boleh diurus, tetapi amali terasa tergesa-gesa. Sediakan soalan makmal sebelum kelas."
    id: "Kuis mingguan masih bisa diatasi, tapi praktikum terasa terburu-buru. Siapkan soal lab sebelum kelas."
    hi: "वीकली क्विज़ संभल जाते हैं, पर प्रैक्टिकल्स में जल्दबाज़ी रहती है। क्लास से पहले लैब के सवाल तैयार रखें।"
  - en: "Many took it for the GAMSAT, but several say it isn't needed for that. Expect 8+ hours a week if you have little physics background."
    zh: "很多人为GAMSAT选修，但多位评价说没必要；物理基础薄弱的话每周需投入8小时以上。"
    zh-TW: "很多人為GAMSAT選修，但多位評價說沒必要；物理基礎薄弱的話每週需投入8小時以上。"
    ja: "GAMSAT対策で取る人が多いですが、そのためには不要だという声も複数あります。物理の基礎が少ないなら週8時間以上は見込みましょう。"
    ko: "GAMSAT 때문에 듣는 사람이 많지만 그럴 필요 없다는 의견도 여럿입니다. 물리 배경이 적다면 주 8시간 이상 예상하세요."
    vi: "Nhiều người học để thi GAMSAT, nhưng một số nói không cần thiết. Nếu ít nền tảng vật lý, hãy dự trù 8+ giờ mỗi tuần."
    ms: "Ramai ambil untuk GAMSAT, tetapi beberapa kata ia tidak perlu. Jangka 8+ jam seminggu jika latar fizik anda sedikit."
    id: "Banyak yang ambil untuk GAMSAT, tapi beberapa bilang tidak perlu. Siapkan 8+ jam per minggu kalau dasar fisikamu minim."
    hi: "कई लोगों ने इसे GAMSAT के लिए लिया, पर कई कहते हैं इसकी ज़रूरत नहीं। फिज़िक्स बैकग्राउंड कम हो तो हफ्ते में 8+ घंटे लगेंगे।"
sections:
  content:
    - en: "Despite the name it's hard: high-school physics plus Physics 1 material in one semester, with many formulas and little time to understand them. Mechanics at the start is the easier part."
      zh: "名字听着基础，其实很难：一学期塞进高中物理加 Physics 1 的内容，公式一大堆，没时间真正理解。开头的力学算简单的部分。"
      zh-TW: "名字聽起來基礎，其實很難：一學期塞進高中物理加 Physics 1 的內容，公式一大堆，沒時間真正理解。開頭的力學算簡單的部分。"
      ja: "名前に反して難しい。高校物理とPhysics 1の内容を1学期で扱い、公式が多く理解する時間がない。最初の力学は比較的楽。"
      ko: "이름과 달리 어렵다. 고등학교 물리와 Physics 1 내용을 한 학기에 다루며 공식은 많고 이해할 시간은 없다. 초반 역학은 쉬운 편이다."
      vi: "Tên nghe cơ bản nhưng khó: vật lý cấp 3 cộng nội dung Physics 1 trong một kỳ, rất nhiều công thức mà ít thời gian để hiểu. Phần cơ học đầu kỳ là dễ hơn."
      ms: "Walaupun namanya asas, ia sukar: fizik sekolah menengah dan kandungan Physics 1 dalam satu semester, banyak formula dan sedikit masa untuk faham. Mekanik di awal lebih mudah."
      id: "Meski namanya dasar, ini sulit: fisika SMA plus materi Physics 1 dalam satu semester, banyak rumus dan sedikit waktu untuk memahami. Mekanika di awal bagian yang lebih mudah."
      hi: "नाम के बावजूद यह कठिन है: हाई-स्कूल भौतिकी और Physics 1 का कंटेंट एक सेमेस्टर में, ढेर सारे सूत्र और समझने का समय कम। शुरुआत की यांत्रिकी आसान हिस्सा है।"
    - en: "Most found the lectures hard to follow, with worked examples pushed to a separate session; many relied on the textbook or YouTube."
      zh: "多数人觉得讲座很难跟，例题都放到另一节课才讲；很多人靠教材或 YouTube 自学。"
      zh-TW: "多數人覺得講座很難跟，例題都放到另一堂課才講；很多人靠課本或 YouTube 自學。"
      ja: "講義はついていきにくく、例題の解説は別のセッションに回されるという声が多い。教科書やYouTubeで学んだ人が多い。"
      ko: "강의를 따라가기 어렵고 예제 풀이는 별도 시간으로 미뤄진다는 의견이 많다. 교재나 YouTube에 의지한 사람이 많다."
      vi: "Đa số thấy bài giảng khó theo, ví dụ mẫu bị dời sang buổi khác; nhiều người dựa vào giáo trình hoặc YouTube."
      ms: "Kebanyakan dapati kuliah sukar diikuti, dengan contoh penyelesaian ditolak ke sesi lain; ramai bergantung pada buku teks atau YouTube."
      id: "Kebanyakan merasa kuliah sulit diikuti, contoh soal dipindah ke sesi lain; banyak yang mengandalkan buku teks atau YouTube."
      hi: "ज़्यादातर को लेक्चर समझना कठिन लगा, हल किए उदाहरण अलग सेशन में होते हैं; कई पाठ्यपुस्तक या YouTube पर निर्भर रहे।"
  work:
    - en: "Weekly online quizzes with multiple attempts are achievable marks if you keep up; pracs and activities are marked fairly leniently. Several found the exam very hard, though one says it is scaled."
      zh: "每周网上小测可以多次作答，跟上进度就能拿分；实验和活动给分比较宽松。好几位觉得期末很难，不过有人说会 scale。"
      zh-TW: "每週線上小考可以多次作答，跟上進度就能拿分；實驗和活動給分比較寬鬆。好幾位覺得期末很難，不過有人說會調分。"
      ja: "毎週のオンラインクイズは複数回受験でき、ついていけば点が取れる。実験やアクティビティの採点は比較的甘い。期末はとても難しいという声が複数だが、スケーリングされるという人も。"
      ko: "주간 온라인 퀴즈는 여러 번 응시할 수 있어 진도만 따라가면 점수를 받는다. 실험과 활동은 채점이 비교적 후하다. 기말이 매우 어려웠다는 사람이 여럿이지만 스케일링된다는 말도 있다."
      vi: "Quiz online hằng tuần được làm nhiều lần, theo kịp là lấy được điểm; thực hành và hoạt động chấm khá dễ. Vài người thấy bài thi cuối rất khó, dù một người nói có scale điểm."
      ms: "Kuiz dalam talian mingguan dengan beberapa cubaan boleh dapat markah jika ikut rentak; amali dan aktiviti dinilai agak longgar. Beberapa rasa peperiksaan sangat sukar, walaupun seorang kata ia diskala."
      id: "Kuis online mingguan dengan beberapa percobaan bisa dapat nilai kalau mengikuti; praktikum dan aktivitas dinilai cukup longgar. Beberapa merasa ujian akhir sangat sulit, meski satu bilang nilainya diskalakan."
      hi: "कई प्रयासों वाले साप्ताहिक ऑनलाइन क्विज़ में साथ चलें तो अंक मिलते हैं; प्रैक्टिकल और गतिविधियों का अंकन काफ़ी नरम है। कई को परीक्षा बहुत कठिन लगी, हालाँकि एक के अनुसार इसे स्केल किया जाता है।"
  study:
    - en: "Attend problem-solving classes with the sheet done beforehand so you can ask questions; read prac notes before labs, and consider learning basic mechanics before semester."
      zh: "上 problem-solving 课前先把题做了，课上好提问；实验前读好实验说明，开学前可以先学点基础力学。"
      zh-TW: "上 problem-solving 課前先把題做了，課上好提問；實驗前讀好實驗說明，開學前可以先學點基礎力學。"
      ja: "問題演習クラスは事前にシートを解いて質問できるように。実験前に資料を読み、学期前に基礎的な力学を学んでおくのも手。"
      ko: "문제풀이 수업 전에 시트를 미리 풀어 질문할 수 있게 하라. 실험 전엔 실험 자료를 읽고, 개강 전에 기초 역학을 공부해 두는 것도 좋다."
      vi: "Đi lớp giải bài tập với bài đã làm trước để hỏi; đọc tài liệu thực hành trước khi vào lab, và cân nhắc học cơ học cơ bản trước học kỳ."
      ms: "Hadir kelas penyelesaian masalah dengan helaian sudah dibuat supaya boleh bertanya; baca nota amali sebelum makmal, dan pertimbang belajar mekanik asas sebelum semester."
      id: "Ikuti kelas problem-solving dengan lembar sudah dikerjakan agar bisa bertanya; baca catatan praktikum sebelum lab, dan pertimbangkan belajar mekanika dasar sebelum semester."
      hi: "प्रॉब्लम-सॉल्विंग क्लास में शीट पहले से हल करके जाएँ ताकि सवाल पूछ सकें; लैब से पहले प्रैक्टिकल नोट्स पढ़ें, और सेमेस्टर से पहले बुनियादी यांत्रिकी सीखने पर विचार करें।"
  watch:
    - en: "Not a WAM booster: many advise avoiding it unless it's a prerequisite, and several say you don't need it for the GAMSAT."
      zh: "不是刷分课：很多人建议除非是先修要求否则别选，好几位说考 GAMSAT 也不需要它。"
      zh-TW: "不是拉分課：很多人建議除非是先修要求否則別選，好幾位說考 GAMSAT 也不需要它。"
      ja: "WAMは稼げない。前提科目でなければ避けるよう勧める声が多く、GAMSATのためには不要という人も複数。"
      ko: "WAM 부스터가 아니다. 선수 과목이 아니면 피하라는 사람이 많고, GAMSAT에도 필요 없다는 사람이 여럿이다."
      vi: "Không phải môn kéo WAM: nhiều người khuyên tránh trừ khi là môn tiên quyết, vài người nói thi GAMSAT cũng không cần."
      ms: "Bukan penaik WAM: ramai nasihat elakkan kecuali ia prasyarat, dan beberapa kata anda tidak perlukannya untuk GAMSAT."
      id: "Bukan pendongkrak WAM: banyak yang menyarankan menghindarinya kecuali prasyarat, dan beberapa bilang tidak perlu untuk GAMSAT."
      hi: "WAM बूस्टर नहीं: कई कहते हैं पूर्वापेक्षा न हो तो इससे बचें, और कई के अनुसार GAMSAT के लिए इसकी ज़रूरत नहीं।"
workload: heavy
difficulty: hard
