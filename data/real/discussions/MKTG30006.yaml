points:
  - en: "Reviewers disagree, and the newest is the harshest: the 2022 review criticised the lectures and the assignment design and found the take on modern retail out of touch."
    zh: "评价有分歧，最新的一条最负面：2022 年的评价批评讲座和作业设计，并觉得对现代零售的看法脱节。"
    zh-TW: "評價有分歧，最新的一則最負面：2022 年的評價批評講座和作業設計，並覺得對現代零售的看法脫節。"
    ja: "評価は分かれ、最新のものが最も厳しい。2022年のレビューは講義と課題設計を批判し、現代の小売への見方がずれていると感じた。"
    ko: "평가가 엇갈리며 최신 리뷰가 가장 혹평이다. 2022년 리뷰는 강의와 과제 설계를 비판하고 현대 소매에 대한 시각이 뒤처졌다고 봤다."
    vi: "Ý kiến trái chiều, và đánh giá mới nhất gay gắt nhất: bài 2022 chê bài giảng, cách thiết kế bài tập và cho rằng góc nhìn về bán lẻ hiện đại đã lỗi thời."
    ms: "Pengulas tidak sependapat, dan yang terbaru paling keras: ulasan 2022 mengkritik kuliah dan reka bentuk tugasan serta dapati pandangan tentang runcit moden ketinggalan."
    id: "Pengulas tidak sepakat, dan yang terbaru paling keras: ulasan 2022 mengkritik kuliah dan desain tugas serta merasa pandangan soal ritel modern ketinggalan."
    hi: "रिव्यूअर्स असहमत हैं, और सबसे नया सबसे कड़ा है: 2022 के रिव्यू ने लेक्चर और असाइनमेंट की बनावट की आलोचना की और आधुनिक रिटेल पर नज़रिया पुराना पाया।"
  - en: "Older reviews (2015–2017) found it well organised, practical and enjoyable, with informative slides."
    zh: "较早的评价（2015–2017）觉得课程组织好、实用、有趣，课件信息量足。"
    zh-TW: "較早的評價（2015–2017）覺得課程組織好、實用、有趣，投影片資訊量足。"
    ja: "古いレビュー（2015〜2017年）は、構成がよく実践的で楽しく、スライドも充実していたと評価。"
    ko: "예전 리뷰(2015–2017)는 구성이 좋고 실용적이며 재미있고, 슬라이드가 알차다고 봤다."
    vi: "Các đánh giá cũ (2015–2017) thấy môn được tổ chức tốt, thực tế, thú vị, slide nhiều thông tin."
    ms: "Ulasan lama (2015–2017) dapati ia teratur, praktikal dan menyeronokkan, dengan slaid yang bermaklumat."
    id: "Ulasan lama (2015–2017) menilai mata kuliah ini tertata, praktis dan menyenangkan, dengan slide yang informatif."
    hi: "पुराने रिव्यू (2015–2017) ने इसे सुव्यवस्थित, व्यावहारिक और मज़ेदार पाया, जानकारी भरी स्लाइड्स के साथ।"
  - en: "Tip: lectures are dense and group work depends on your team, so consolidate notes as you go rather than cramming at the end."
    zh: "建议：讲座内容密集，小组作业好坏取决于组员，平时就整理笔记，别留到最后突击。"
    zh-TW: "建議：講座內容密集，小組作業好壞取決於組員，平時就整理筆記，別留到最後衝刺。"
    ja: "コツ：講義は密度が高く、グループワークはメンバー次第。最後に詰め込まず、こまめにノートを整理しよう。"
    ko: "팁: 강의 밀도가 높고 조별 과제는 팀원에 달렸으니, 막판 벼락치기 대신 평소에 노트를 정리하자."
    vi: "Mẹo: bài giảng dày đặc và bài nhóm phụ thuộc đồng đội, nên tổng hợp ghi chép đều đặn thay vì dồn đến cuối."
    ms: "Tip: kuliah padat dan kerja kumpulan bergantung pada pasukan, jadi kemas kini nota dari semasa ke semasa, jangan tunggu saat akhir."
    id: "Tips: kuliahnya padat dan kerja kelompok tergantung tim, jadi rapikan catatan secara rutin, jangan menumpuk di akhir."
    hi: "सुझाव: लेक्चर घने हैं और ग्रुप वर्क टीम पर निर्भर है, इसलिए आख़िर में रटने की बजाय साथ-साथ नोट्स व्यवस्थित करें।"
