reviews: 10
from: 2014
to: 2023
checked: 2026-10-08
points:
  - en: "The content is challenging, and electricity and magnetism take up a large share. The life-science side is mostly just examples."
    zh: "内容有挑战，电磁学占很大比重，所谓生命科学部分主要只是举例。"
    zh-TW: "內容有挑戰，電磁學占很大比重，所謂生命科學部分主要只是舉例。"
    ja: "内容は難しく、電気と磁気が大部分を占めます。生命科学の部分はほとんど例として出てくるだけです。"
    ko: "내용이 어렵고 전기와 자기가 큰 비중을 차지합니다. 생명과학 부분은 대부분 예시일 뿐입니다."
    vi: "Nội dung khó, điện và từ chiếm phần lớn. Phần khoa học sự sống chủ yếu chỉ là ví dụ."
    ms: "Kandungan mencabar, dan elektrik serta magnetisme mengambil bahagian besar. Bahagian sains hayat kebanyakannya hanya contoh."
    id: "Materinya menantang, listrik dan magnet porsinya besar. Bagian ilmu hayati kebanyakan hanya contoh."
    hi: "कंटेंट चुनौतीपूर्ण है, और बिजली व चुंबकत्व का बड़ा हिस्सा है। लाइफ साइंस वाला हिस्सा ज़्यादातर बस उदाहरण है।"
  - en: "Pracs are often time-pressured and logbooks take effort. Do the pre-lab work and read the prac notes beforehand."
    zh: "实验课时间紧，实验记录本写起来费劲，务必提前完成预习任务并读好实验说明。"
    zh-TW: "實驗課時間緊，實驗紀錄本寫起來費勁，務必提前完成預習任務並讀好實驗說明。"
    ja: "実習は時間に追われがちで、ログブックも手間がかかります。事前課題をやり、実習ノートを前もって読みましょう。"
    ko: "실습은 시간이 촉박하고 로그북 작성도 품이 듭니다. 사전 과제를 하고 실습 안내를 미리 읽으세요."
    vi: "Buổi thực hành thường gấp, sổ ghi chép tốn công. Làm bài chuẩn bị trước lab và đọc hướng dẫn thực hành trước."
    ms: "Amali selalunya dikejar masa dan buku log memerlukan usaha. Buat kerja pra-makmal dan baca nota amali terlebih dahulu."
    id: "Praktikum sering dikejar waktu dan logbook butuh usaha. Kerjakan tugas pra-lab dan baca catatan praktikum lebih dulu."
    hi: "प्रैक्टिकल्स में अक्सर समय कम पड़ता है और लॉगबुक में मेहनत लगती है। प्री-लैब काम करें और प्रैक्टिकल नोट्स पहले पढ़ें।"
  - en: "The exam is long and can be hard. Revise the lecture demonstrations, know how to derive formulas, and use the problem classes and past exams."
    zh: "考试题量大、可能较难；要复习课堂演示、会推导公式，多利用习题课和往年试卷。"
    zh-TW: "考試題量大、可能較難；要複習課堂示範、會推導公式，多利用習題課和歷屆試卷。"
    ja: "試験は長く難しいこともあります。講義の実演を復習し、公式を導出できるようにし、演習クラスと過去問を活用しましょう。"
    ko: "시험이 길고 어려울 수 있습니다. 강의 시연을 복습하고, 공식 유도법을 익히고, 문제 풀이 수업과 기출을 활용하세요."
    vi: "Bài thi dài và có thể khó. Ôn các thí nghiệm minh họa, biết cách chứng minh công thức, và tận dụng lớp bài tập cùng đề cũ."
    ms: "Peperiksaan panjang dan boleh sukar. Ulang kaji demonstrasi kuliah, tahu cara terbitkan formula, dan guna kelas penyelesaian masalah serta kertas lepas."
    id: "Ujiannya panjang dan bisa sulit. Pelajari ulang demonstrasi kuliah, pahami cara menurunkan rumus, dan manfaatkan kelas latihan soal serta soal lama."
    hi: "एग्ज़ाम लंबा और कठिन हो सकता है। लेक्चर डेमो दोहराएँ, फॉर्मूले डेराइव करना जानें, और प्रॉब्लम क्लासेज़ व पुराने पेपर्स का इस्तेमाल करें।"
  - en: "Opinions on the teaching are split. Some liked the lectures, while others mostly taught themselves from the textbook and videos."
    zh: "对教学评价不一：有人喜欢讲座，也有人主要靠教材和视频自学。"
    zh-TW: "對教學評價不一：有人喜歡講座，也有人主要靠教材和影片自學。"
    ja: "教え方の評価は分かれます。講義が好きな人もいれば、主に教科書と動画で独学した人もいます。"
    ko: "강의에 대한 의견은 갈립니다. 강의를 좋아한 사람도 있고, 주로 교과서와 영상으로 독학한 사람도 있습니다."
    vi: "Ý kiến về việc giảng dạy trái chiều. Có người thích bài giảng, người khác chủ yếu tự học qua giáo trình và video."
    ms: "Pendapat tentang pengajaran berbelah bahagi. Ada yang suka kuliah, ada yang kebanyakannya belajar sendiri daripada buku teks dan video."
    id: "Pendapat soal pengajaran terbelah. Ada yang suka kuliahnya, ada yang lebih banyak belajar sendiri dari buku teks dan video."
    hi: "पढ़ाई पर राय बँटी है। कुछ को लेक्चर पसंद आए, बाकियों ने ज़्यादातर टेक्स्टबुक और वीडियो से खुद पढ़ा।"
sections:
  content:
    - en: "Physics applied to biology, but the life-science part is mostly examples; electricity and magnetism take up a big share and are the hardest. The pace picks up in later weeks."
      zh: "把物理用到生物上，但“生命科学”多半只是举例；电磁学占很大比重，也是最难的。后几周进度明显加快。"
      zh-TW: "把物理用到生物上，但「生命科學」多半只是舉例；電磁學占很大比重，也是最難的。後幾週進度明顯加快。"
      ja: "生物に応用した物理だが、生命科学要素は主に例だけ。電磁気学の比重が大きく最も難しい。後半はペースが上がる。"
      ko: "생물에 응용한 물리지만 생명과학 부분은 대부분 예시일 뿐이다. 전자기학 비중이 크고 가장 어렵다. 후반부엔 속도가 빨라진다."
      vi: "Vật lý áp dụng vào sinh học, nhưng phần khoa học sự sống chủ yếu là ví dụ; điện từ học chiếm phần lớn và khó nhất. Nhịp tăng nhanh ở các tuần sau."
      ms: "Fizik yang diaplikasi kepada biologi, tetapi bahagian sains hayat kebanyakannya contoh; elektrik dan kemagnetan mengambil bahagian besar dan paling sukar. Rentak makin laju kemudian."
      id: "Fisika yang diterapkan ke biologi, tapi bagian ilmu hayatnya kebanyakan contoh; listrik dan magnet porsinya besar dan paling sulit. Tempo makin cepat di minggu-minggu akhir."
      hi: "जीव विज्ञान पर लागू भौतिकी, पर लाइफ़-साइंस वाला हिस्सा ज़्यादातर उदाहरण हैं; बिजली और चुंबकत्व का बड़ा हिस्सा है और सबसे कठिन है। बाद के हफ़्तों में रफ़्तार बढ़ती है।"
    - en: "Views on teaching split: some found the lectures clear with good demos, others learned mostly from the textbook, friends or online videos."
      zh: "对教学评价不一：有人觉得讲座清楚、演示很棒，也有人主要靠教材、同学或网上视频学。"
      zh-TW: "對教學評價不一：有人覺得講座清楚、示範很棒，也有人主要靠課本、同學或網路影片學。"
      ja: "授業の評価は分かれる。講義が分かりやすくデモが良いという人と、主に教科書や友人、オンライン動画で学んだという人。"
      ko: "강의 평가는 갈린다. 강의가 명확하고 시연이 좋았다는 사람과, 주로 교재, 친구, 온라인 영상으로 배웠다는 사람이 있다."
      vi: "Ý kiến về giảng dạy chia: có người thấy bài giảng rõ, thí nghiệm minh họa hay, người khác chủ yếu tự học qua sách, bạn bè hoặc video."
      ms: "Pandangan tentang pengajaran berbelah: ada yang rasa kuliah jelas dengan demo baik, yang lain belajar kebanyakannya dari buku teks, rakan atau video dalam talian."
      id: "Pendapat soal pengajaran terbelah: ada yang merasa kuliah jelas dengan demo bagus, yang lain lebih banyak belajar dari buku teks, teman atau video online."
      hi: "पढ़ाई पर राय बँटी: कुछ को लेक्चर साफ़ और डेमो अच्छे लगे, दूसरों ने ज़्यादातर पाठ्यपुस्तक, दोस्तों या ऑनलाइन वीडियो से सीखा।"
  work:
    - en: "Online homework tasks, time-pressured pracs with log books, and a long final exam. One reviewer says the exam included lecture demonstrations; another found it brutal and unable to finish."
      zh: "有网上作业、时间很紧的实验（要写实验记录本），期末又长。有同学说期末会考讲座里的演示实验；也有人觉得非常难、做不完。"
      zh-TW: "有線上作業、時間很緊的實驗（要寫實驗記錄本），期末又長。有同學說期末會考講座裡的示範實驗；也有人覺得非常難、做不完。"
      ja: "オンライン宿題、時間に追われる実習（ログブックあり）、長い期末試験。講義のデモ実験が出たという人や、とても厳しく解き終わらなかったという人も。"
      ko: "온라인 과제, 시간에 쫓기는 실습(로그북 작성), 긴 기말 시험이 있다. 강의 시연이 기말에 나왔다는 사람도, 너무 어려워 다 못 풀었다는 사람도 있다."
      vi: "Có bài tập online, thực hành gấp thời gian kèm sổ ghi chép, và bài thi cuối dài. Một người nói đề có hỏi các thí nghiệm minh họa trong bài giảng; người khác thấy rất khó, làm không kịp."
      ms: "Tugasan rumah dalam talian, amali yang suntuk masa dengan buku log, dan peperiksaan akhir yang panjang. Seorang kata peperiksaan termasuk demonstrasi kuliah; seorang lagi rasa ia kejam dan tidak sempat habis."
      id: "PR online, praktikum yang mepet waktu dengan buku log, dan ujian akhir yang panjang. Satu bilang ujian memuat demonstrasi kuliah; yang lain merasa sangat berat dan tidak sempat selesai."
      hi: "ऑनलाइन होमवर्क, लॉग बुक वाले समय-दबाव भरे प्रैक्टिकल और लंबी फ़ाइनल परीक्षा। एक के अनुसार परीक्षा में लेक्चर के डेमो आए; दूसरे को यह बहुत कठिन लगी और पूरी नहीं हो पाई।"
  study:
    - en: "Do the pre-labs before pracs, revise lecture demonstrations, work through problem-solving sheets and past exams, and practise deriving formulas."
      zh: "实验前做好 pre-lab，复习讲座里的演示实验，多做 problem-solving 题和往年卷，练习推导公式。"
      zh-TW: "實驗前做好 pre-lab，複習講座裡的示範實驗，多做 problem-solving 題和考古題，練習推導公式。"
      ja: "実習前にプレラボを済ませ、講義のデモを復習し、問題演習シートと過去問を解き、公式の導出を練習する。"
      ko: "실습 전에 프리랩을 하고, 강의 시연을 복습하며, 문제풀이 시트와 기출을 풀고, 공식 유도를 연습하라."
      vi: "Làm pre-lab trước thực hành, ôn các thí nghiệm minh họa, làm bài giải bài tập và đề cũ, và luyện suy ra công thức."
      ms: "Buat pra-makmal sebelum amali, ulang kaji demonstrasi kuliah, selesaikan helaian penyelesaian masalah dan kertas lepas, dan latih menerbitkan formula."
      id: "Kerjakan pra-lab sebelum praktikum, ulas demonstrasi kuliah, kerjakan lembar problem-solving dan ujian lama, dan latih menurunkan rumus."
      hi: "प्रैक्टिकल से पहले प्री-लैब करें, लेक्चर डेमो दोहराएँ, प्रॉब्लम-सॉल्विंग शीट और पुराने पेपर हल करें, और सूत्र निकालने का अभ्यास करें।"
  watch:
    - en: "One reviewer says the workload feels like 1.5 to 2 subjects; several biomed students who had to take it disliked it more than science students did."
      zh: "有同学说工作量相当于 1.5 到 2 门课；好几位必修这门的生物医学学生比理科生更不喜欢它。"
      zh-TW: "有同學說工作量相當於 1.5 到 2 門課；好幾位必修這門的生物醫學學生比理科生更不喜歡它。"
      ja: "負担は1.5〜2科目分に感じるという人も。必修で取った生物医学の学生は理学部の学生より不満が多かった。"
      ko: "부담이 1.5~2과목 수준이라는 사람도 있다. 필수로 들은 생물의학 학생들은 이과 학생보다 더 싫어했다."
      vi: "Một người nói khối lượng như 1,5 đến 2 môn; vài sinh viên y sinh bắt buộc học thì không thích bằng sinh viên khoa học."
      ms: "Seorang pengulas kata beban terasa seperti 1.5 hingga 2 subjek; beberapa pelajar bioperubatan yang wajib mengambilnya kurang suka berbanding pelajar sains."
      id: "Satu pengulas bilang bebannya terasa seperti 1,5 sampai 2 mata kuliah; beberapa mahasiswa biomedis yang wajib mengambilnya kurang suka dibanding mahasiswa sains."
      hi: "एक के अनुसार काम 1.5 से 2 विषयों जितना लगता है; जिन बायोमेड छात्रों को यह अनिवार्य रूप से लेना पड़ा, उन्हें यह साइंस छात्रों से कम पसंद आया।"
difficulty: hard
