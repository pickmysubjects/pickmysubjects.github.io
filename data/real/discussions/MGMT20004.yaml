code: MGMT20004
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/mgmt20004
reviews: 6
from: 2016
to: 2021
checked: 2026-10-13
points:
  - en: "Reviewers found the content interesting and relevant, covering recruitment, training and retention, with career advice along the way; even a breadth student rated it a favourite."
    zh: "评价者觉得内容有趣实用，涵盖招聘、培训和留才，还附带职业建议；有修作广度课的同学把它列为最爱之一。"
    zh-TW: "評價者覺得內容有趣實用，涵蓋招募、培訓和留才，還附帶職涯建議；有修作廣度課的同學把它列為最愛之一。"
    ja: "採用、研修、定着などを扱い、キャリアの助言もあって面白く実用的だという声。ブレス科目で取った学生もお気に入りに挙げている。"
    ko: "채용, 교육, 인재 유지를 다루고 커리어 조언도 있어 흥미롭고 실용적이라는 평. 교양(브레드스)으로 들은 학생도 최애 과목으로 꼽았다."
    vi: "Người học thấy nội dung thú vị và thiết thực, về tuyển dụng, đào tạo và giữ chân nhân viên, kèm lời khuyên nghề nghiệp; cả sinh viên học môn breadth cũng rất thích."
    ms: "Pengulas dapati kandungan menarik dan relevan, meliputi pengambilan, latihan dan pengekalan pekerja, berserta nasihat kerjaya; pelajar breadth pun menyukainya."
    id: "Pengulas merasa materinya menarik dan relevan, mencakup rekrutmen, pelatihan dan retensi, plus saran karier; bahkan mahasiswa breadth menjadikannya favorit."
    hi: "रिव्यूअर्स को कंटेंट दिलचस्प और काम का लगा, जिसमें भर्ती, ट्रेनिंग और रिटेंशन शामिल हैं, साथ में करियर सलाह भी; ब्रेड्थ के तौर पर लेने वाले एक छात्र ने भी इसे पसंदीदा बताया।"
  - en: "Most called it easy and straightforward, with many self-explanatory ideas, though one noted a fast pace."
    zh: "多数人认为它简单直接，很多概念一看就懂，但也有人说进度快。"
    zh-TW: "多數人認為它簡單直接，很多概念一看就懂，但也有人說進度快。"
    ja: "多くは簡単でわかりやすく、説明不要な概念が多いとしているが、ペースが速いという声も。"
    ko: "대부분 쉽고 명확하며 자명한 개념이 많다고 했지만, 진도가 빠르다는 의견도 있었다."
    vi: "Đa số thấy môn dễ và rõ ràng, nhiều ý tự hiểu được, dù có người nói tốc độ nhanh."
    ms: "Kebanyakan kata ia mudah dan jelas, banyak idea mudah difahami sendiri, walaupun seorang kata rentaknya laju."
    id: "Kebanyakan bilang mudah dan lugas, banyak konsep yang jelas dengan sendirinya, meski satu orang menyebut temponya cepat."
    hi: "ज़्यादातर ने इसे आसान और सीधा बताया, कई विचार खुद समझ आ जाते हैं, हालाँकि एक ने तेज़ रफ़्तार की बात कही।"
  - en: "For the exam, good writing matters and answers should draw on the readings; older reviews say how hard it is depends on how much the exam scope is narrowed."
    zh: "考试重视写作，答案要结合阅读材料；较早的评价说难度取决于考试范围是否被缩小。"
    zh-TW: "考試重視寫作，答案要結合閱讀材料；較早的評價說難度取決於考試範圍是否被縮小。"
    ja: "試験では文章力が重要で、指定文献を踏まえて答えるべき。古いレビューでは、難しさは試験範囲がどれだけ絞られるかによるという。"
    ko: "시험에서는 글쓰기가 중요하고 읽기 자료를 근거로 답해야 한다. 예전 리뷰는 시험 범위를 얼마나 좁혀 주느냐에 따라 난이도가 달라진다고 했다."
    vi: "Khi thi, viết tốt rất quan trọng và câu trả lời nên dựa vào tài liệu đọc; các đánh giá cũ nói độ khó tùy vào phạm vi thi được thu hẹp đến đâu."
    ms: "Untuk peperiksaan, penulisan baik penting dan jawapan perlu merujuk bacaan; ulasan lama kata tahap sukar bergantung pada sejauh mana skop peperiksaan disempitkan."
    id: "Untuk ujian, tulisan yang baik penting dan jawaban harus merujuk bacaan; ulasan lama bilang tingkat kesulitan tergantung seberapa sempit cakupan ujian."
    hi: "परीक्षा में अच्छा लेखन ज़रूरी है और जवाबों में रीडिंग्स का सहारा लें; पुराने रिव्यू कहते हैं कि कठिनाई इस पर निर्भर है कि परीक्षा का दायरा कितना सीमित किया गया।"
sections:
  content:
    - en: "Reviewers found it easy to follow and useful, covering how companies recruit, train and keep staff, with job-hunting advice. One reviewer said it was quite fast paced."
      zh: "同学觉得好跟、实用，讲公司怎么招人、培训、留人，还有找工作的建议。有一位同学说节奏挺快。"
      zh-TW: "同學覺得好跟、實用，講公司怎麼招人、培訓、留人，還有找工作的建議。有一位同學說節奏蠻快。"
      ja: "分かりやすく役に立つという声。企業の採用・研修・定着の仕方や就活のアドバイスを扱う。進みが速いと言う人も一人いる。"
      ko: "따라가기 쉽고 유용하다는 평. 회사가 사람을 뽑고 교육하고 붙잡는 방법과 취업 조언을 다룬다. 한 리뷰는 진도가 빠르다고 했다."
      vi: "Người học thấy dễ theo và hữu ích, nói về cách công ty tuyển, đào tạo và giữ nhân viên, kèm lời khuyên tìm việc. Một người nói nhịp khá nhanh."
      ms: "Pengulas rasa mudah diikuti dan berguna, tentang cara syarikat merekrut, melatih dan mengekalkan pekerja, dengan nasihat mencari kerja. Seorang kata agak laju."
      id: "Pengulas merasa mudah diikuti dan berguna, membahas cara perusahaan merekrut, melatih dan mempertahankan karyawan, plus saran cari kerja. Satu pengulas bilang temponya cepat."
      hi: "रिव्यूअर्स को यह समझने में आसान और उपयोगी लगा: कंपनियाँ कैसे भर्ती, ट्रेनिंग और कर्मचारियों को बनाए रखती हैं, साथ में नौकरी खोजने की सलाह। एक रिव्यूअर ने कहा रफ़्तार काफ़ी तेज़ है।"
  study:
    - en: "One reviewer says to score well in the final exam you need to write well and bring the readings into your answers."
      zh: "有同学说期末想拿高分，要会写，并把 readings 用进答案里。"
      zh-TW: "有同學說期末想拿高分，要會寫，並把 readings 用進答案裡。"
      ja: "期末で高得点を取るには文章力と、リーディングを答案に組み込むことが必要だと一人が言う。"
      ko: "기말에서 높은 점수를 받으려면 글을 잘 쓰고 리딩을 답안에 넣어야 한다고 한 리뷰가 말한다."
      vi: "Một người nói muốn điểm thi cao thì cần viết tốt và đưa các bài đọc vào câu trả lời."
      ms: "Seorang pengulas kata untuk skor tinggi dalam peperiksaan akhir, anda perlu menulis dengan baik dan masukkan bacaan dalam jawapan."
      id: "Satu pengulas bilang untuk nilai ujian akhir yang bagus, kamu perlu menulis dengan baik dan memasukkan bacaan ke jawaban."
      hi: "एक रिव्यूअर कहता है फ़ाइनल में अच्छे अंक के लिए अच्छा लिखना और रीडिंग्स को जवाबों में शामिल करना ज़रूरी है।"
  watch:
    - en: "One reviewer says how easy a high mark is depends on the lecturer, since some narrow down what to study for the exam and some don't."
      zh: "有同学说拿高分难不难要看 lecturer，有的会划考试范围，有的不会。"
      zh-TW: "有同學說拿高分難不難要看 lecturer，有的會劃考試範圍，有的不會。"
      ja: "高得点の取りやすさは講師次第で、試験範囲を絞ってくれる人とそうでない人がいると一人が言う。"
      ko: "고득점이 쉬운지는 강사에 따라 다르다고 한 리뷰가 말한다. 시험 범위를 좁혀 주는 강사도, 아닌 강사도 있다."
      vi: "Một người nói dễ đạt điểm cao hay không tùy giảng viên, vì có người khoanh vùng ôn thi, có người thì không."
      ms: "Seorang pengulas kata mudah atau tidak dapat markah tinggi bergantung pada pensyarah, ada yang menyempitkan skop peperiksaan, ada yang tidak."
      id: "Satu pengulas bilang mudah tidaknya dapat nilai tinggi tergantung dosen, ada yang mempersempit materi ujian, ada yang tidak."
      hi: "एक रिव्यूअर कहता है ऊँचे अंक कितने आसान हैं यह लेक्चरर पर निर्भर है, कुछ परीक्षा का दायरा छोटा कर देते हैं, कुछ नहीं।"
    - en: "All these reviews are from 2021 or earlier; teaching and exams may have changed since."
      zh: "这些评价都是 2021 年或更早的，现在的教法和考试可能已经变了。"
      zh-TW: "這些評價都是 2021 年或更早的，現在的教法和考試可能已經變了。"
      ja: "レビューはすべて2021年以前のもの。授業や試験は変わっている可能性がある。"
      ko: "모든 리뷰가 2021년 이전 것이라 지금 수업과 시험은 달라졌을 수 있다."
      vi: "Tất cả đánh giá đều từ năm 2021 trở về trước; cách dạy và thi có thể đã thay đổi."
      ms: "Semua ulasan ini dari 2021 atau lebih awal; pengajaran dan peperiksaan mungkin telah berubah."
      id: "Semua ulasan ini dari 2021 atau sebelumnya; pengajaran dan ujian mungkin sudah berubah."
      hi: "ये सभी रिव्यू 2021 या उससे पहले के हैं; पढ़ाई और परीक्षा अब बदल चुकी हो सकती है।"
difficulty: easy
