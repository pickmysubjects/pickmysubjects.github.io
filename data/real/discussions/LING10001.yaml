code: LING10001
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/ling10001
reviews: 10
from: 2020
to: 2026
checked: 2026-10-17
points:
  - en: "A survey of the main areas of linguistics (phonetics, syntax, semantics and more), good for testing interest in the major and popular as a breadth. Most found some areas they loved and some they struggled with."
    zh: "概览语言学主要领域（语音、句法、语义等），适合试探是否想主修，也是热门的跨学科选修。多数人觉得有些部分很喜欢，有些很吃力。"
    zh-TW: "概覽語言學主要領域（語音、句法、語意等），適合試探是否想主修，也是熱門的Breadth選修。多數人覺得有些部分很喜歡，有些很吃力。"
    ja: "言語学の主要分野（音声学、統語論、意味論など）を概観する科目で、専攻の適性を試すのに良く、Breadthとしても人気。好きな分野と苦手な分野がそれぞれあったという人が多い。"
    ko: "언어학 주요 분야(음성학, 통사론, 의미론 등)를 훑는 과목으로 전공 적성 확인에 좋고 Breadth로도 인기. 대부분 좋아한 분야와 어려웠던 분야가 있었다고 함."
    vi: "Tổng quan các lĩnh vực chính của ngôn ngữ học (ngữ âm, cú pháp, ngữ nghĩa...), tốt để thử xem có hợp chuyên ngành, cũng phổ biến làm Breadth. Đa số có phần rất thích và phần thấy khó."
    ms: "Tinjauan bidang utama linguistik (fonetik, sintaksis, semantik dan lain-lain), baik untuk menguji minat terhadap major dan popular sebagai Breadth. Kebanyakan ada bahagian yang disukai dan yang sukar."
    id: "Gambaran bidang utama linguistik (fonetik, sintaksis, semantik, dll.), bagus untuk menguji minat pada jurusan dan populer sebagai Breadth. Kebanyakan menemukan bagian yang disukai dan yang sulit."
    hi: "भाषाविज्ञान के मुख्य क्षेत्रों (फ़ोनेटिक्स, सिंटैक्स, सिमैंटिक्स आदि) का सर्वे, मेजर में रुचि परखने के लिए अच्छा और Breadth के रूप में लोकप्रिय। ज़्यादातर को कुछ हिस्से बहुत पसंद आए और कुछ में मुश्किल हुई।"
  - en: "Assessments are puzzle-like problem solving on language data. Since 2024 reviewers found the exam fair, with a double-sided cheat sheet allowed, and high marks reachable with steady effort."
    zh: "考核是像解谜一样分析语言数据。2024年以来的评论者认为考试公平，可带一张双面小抄，稳定努力就能拿高分。"
    zh-TW: "考核是像解謎一樣分析語言資料。2024年以來的評論者認為考試公平，可帶一張雙面小抄，穩定努力就能拿高分。"
    ja: "評価は言語データを使ったパズルのような問題解決。2024年以降のレビューは試験が妥当で、両面のカンニングペーパー持ち込み可、地道に努力すれば高得点も狙えるとした。"
    ko: "평가는 언어 데이터를 퍼즐처럼 푸는 문제 해결형. 2024년 이후 리뷰는 시험이 공정하고 양면 요약지를 허용하며, 꾸준히 노력하면 고득점 가능하다고 함."
    vi: "Bài đánh giá là giải bài toán kiểu đố trên dữ liệu ngôn ngữ. Từ 2024, người đánh giá thấy bài thi công bằng, được mang một tờ ghi chú hai mặt, và chăm chỉ đều đặn có thể đạt điểm cao."
    ms: "Penilaian ialah penyelesaian masalah seperti teka-teki pada data bahasa. Sejak 2024 pengulas dapati peperiksaan adil, helaian nota dua muka dibenarkan, dan markah tinggi boleh dicapai dengan usaha konsisten."
    id: "Penilaian berupa pemecahan soal ala teka-teki pada data bahasa. Sejak 2024 pengulas merasa ujiannya adil, boleh membawa catatan dua sisi, dan nilai tinggi bisa dicapai dengan usaha konsisten."
    hi: "असेसमेंट भाषा डेटा पर पहेली जैसी समस्याएँ हल करना है। 2024 से रिव्यूअर्स को एग्ज़ाम निष्पक्ष लगा, दो तरफ़ा चीट शीट की अनुमति है, और लगातार मेहनत से ऊँचे अंक संभव हैं।"
  - en: "2021 reviewers found the lectures dry and hard to follow, but reviews from 2023-2026 describe clear teaching and comprehensive lecture notes."
    zh: "2021年的评论者觉得讲座枯燥难懂，但2023-2026年的评论说讲解清晰，讲义全面。"
    zh-TW: "2021年的評論者覺得講座枯燥難懂，但2023-2026年的評論說講解清晰，講義全面。"
    ja: "2021年のレビューは講義が退屈でわかりにくいとしたが、2023-2026年は説明が明確で講義ノートも充実しているという。"
    ko: "2021년 리뷰는 강의가 지루하고 따라가기 어렵다고 했지만, 2023-2026년 리뷰는 설명이 명확하고 강의 노트가 충실하다고 함."
    vi: "Người đánh giá 2021 thấy bài giảng khô khan, khó theo, nhưng đánh giá 2023-2026 mô tả cách dạy rõ ràng và ghi chú bài giảng đầy đủ."
    ms: "Pengulas 2021 dapati kuliah hambar dan sukar diikuti, tetapi ulasan 2023-2026 menyebut pengajaran jelas dan nota kuliah lengkap."
    id: "Pengulas 2021 merasa kuliah kering dan sulit diikuti, tapi ulasan 2023-2026 menggambarkan pengajaran jelas dan catatan kuliah lengkap."
    hi: "2021 के रिव्यूअर्स को लेक्चर नीरस और समझने में कठिन लगे, पर 2023-2026 के रिव्यू साफ़ पढ़ाई और विस्तृत लेक्चर नोट्स बताते हैं।"
sections:
  content:
    - en: "A broad tour of linguistics, from phonetics and syntax to language learning and history. Many describe it as logic puzzles with words, and some breadth students loved it."
      zh: "语言学的全面入门：从语音、句法到语言习得和历史语言学。很多人说像用文字做逻辑题，有些 breadth 学生非常喜欢。"
      zh-TW: "語言學的全面入門：從語音、句法到語言習得和歷史語言學。很多人說像用文字解邏輯題，有些 breadth 學生非常喜歡。"
      ja: "音声学や統語論から言語習得、歴史言語学まで言語学を幅広く巡る。言葉を使った論理パズルのようだという声が多く、大好きになったブレッドス生もいる。"
      ko: "음성학, 통사론부터 언어 습득, 역사언어학까지 언어학을 폭넓게 다룬다. 단어로 하는 논리 퍼즐 같다는 평이 많고, 이 과목을 아주 좋아한 브레드스 학생도 있다."
      vi: "Một vòng tổng quan ngôn ngữ học, từ ngữ âm, cú pháp đến học ngôn ngữ và lịch sử. Nhiều người ví như giải đố logic bằng chữ, vài sinh viên breadth rất thích."
      ms: "Lawatan luas linguistik, dari fonetik dan sintaksis hingga pemerolehan dan sejarah bahasa. Ramai gambarkan ia seperti teka-teki logik dengan perkataan, dan ada pelajar breadth sangat suka."
      id: "Tur luas linguistik, dari fonetik dan sintaksis sampai pemerolehan dan sejarah bahasa. Banyak yang bilang seperti teka-teki logika dengan kata, dan beberapa mahasiswa breadth sangat suka."
      hi: "भाषाविज्ञान का व्यापक परिचय, फ़ोनेटिक्स और सिंटैक्स से भाषा सीखने और इतिहास तक। कई इसे शब्दों वाली लॉजिक पहेली कहते हैं, और कुछ ब्रेड्थ छात्रों को बहुत पसंद आया।"
    - en: "It stays at surface level; some topics will click and others won't. Experience depends on the year: some found lectures excellent, others dry."
      zh: "内容偏浅，有的主题你会很喜欢，有的会搞不懂。体验看年份：有人觉得 lecture 很棒，也有人觉得干巴巴。"
      zh-TW: "內容偏淺，有的主題你會很喜歡，有的會搞不懂。體驗看年份：有人覺得 lecture 很棒，也有人覺得很乾。"
      ja: "広く浅く、ハマる単元と分からない単元が出てくる。年によって経験が違い、講義が素晴らしかった人も無味乾燥だった人もいる。"
      ko: "깊이는 얕고, 잘 맞는 주제와 안 맞는 주제가 있다. 연도에 따라 달라 강의가 훌륭했다는 사람도, 건조했다는 사람도 있다."
      vi: "Chỉ ở mức bề mặt; có chủ đề bạn sẽ thích, có chủ đề khó hiểu. Tùy năm: có người thấy bài giảng rất hay, người khác thấy khô."
      ms: "Ia kekal di peringkat permukaan; ada topik yang serasi, ada yang tidak. Pengalaman ikut tahun: ada yang rasa kuliah cemerlang, ada yang rasa hambar."
      id: "Hanya di permukaan; ada topik yang langsung nyambung, ada yang tidak. Pengalaman tergantung tahun: ada yang merasa kuliahnya luar biasa, ada yang merasa kering."
      hi: "यह सतही स्तर पर रहता है; कुछ टॉपिक जमेंगे, कुछ नहीं। अनुभव साल पर निर्भर: कुछ को लेक्चर शानदार लगे, कुछ को नीरस।"
  work:
    - en: "Assignments give you a dataset to solve with course concepts; marking can be tricky. A double-sided A4 cheat sheet is allowed in the mid-semester test and exam. Views on the exam range from fair to very hard."
      zh: "作业是给一组语料，用课上概念去分析；评分有时不好拿。期中和期末都能带一张双面 A4 cheat sheet。对期末的看法从“公平”到“非常难”都有。"
      zh-TW: "作業是給一組語料，用課堂概念去分析；給分有時不好拿。期中和期末都能帶一張雙面 A4 cheat sheet。對期末的看法從「公平」到「非常難」都有。"
      ja: "課題はデータを与えられ、授業の概念で解くもの。採点は厳しめなことも。中間テストと期末試験は両面A4のチートシート持ち込み可。期末の評価は公平から非常に難しいまで。"
      ko: "과제는 주어진 데이터를 수업 개념으로 푸는 방식이며 채점이 까다로울 수 있다. 중간고사와 기말에 양면 A4 치트시트 허용. 기말 평가는 공정하다부터 매우 어렵다까지."
      vi: "Bài tập cho một bộ dữ liệu để giải bằng khái niệm môn học; chấm có lúc khó. Được mang cheat sheet A4 hai mặt vào bài giữa kỳ và thi. Ý kiến về bài thi từ công bằng đến rất khó."
      ms: "Tugasan beri set data untuk diselesaikan dengan konsep kursus; pemarkahan boleh rumit. Helaian nota A4 dua muka dibenarkan untuk ujian pertengahan semester dan peperiksaan. Pandangan tentang peperiksaan dari adil hingga sangat sukar."
      id: "Tugas memberi dataset untuk dipecahkan dengan konsep kuliah; penilaian bisa rumit. Cheat sheet A4 bolak-balik boleh dibawa ke ujian tengah semester dan ujian akhir. Pendapat soal ujian dari adil sampai sangat sulit."
      hi: "असाइनमेंट में डेटासेट मिलता है जिसे कोर्स कॉन्सेप्ट से हल करना है; मार्किंग पेचीदा हो सकती है। मिड-सेम टेस्ट और परीक्षा में दो-तरफ़ा A4 चीट शीट की छूट है। परीक्षा पर राय 'उचित' से 'बहुत कठिन' तक।"
  study:
    - en: "Watch the lectures, do the exercises for each topic and go to tutorials. Some relied heavily on the workbook and lecture notes, especially in swotvac. You don't need to learn IPA beforehand."
      zh: "看 lecture、每个主题的练习都做、按时上 tutorial。有人很依赖 workbook 和 lecture 笔记，swotvac 特别有用。不用提前学 IPA。"
      zh-TW: "看 lecture、每個主題的練習都做、準時上 tutorial。有人很依賴 workbook 和 lecture 筆記，swotvac 時特別有用。不必先學 IPA。"
      ja: "講義を見て、各単元の演習を解き、チュートリアルに出よう。ワークブックや講義ノートに頼った人も多く、特にswotvacで役立つ。IPAの事前学習は不要。"
      ko: "강의를 보고, 주제별 연습문제를 풀고, 튜토리얼에 나가자. 워크북과 강의 노트에 크게 의존한 사람도 있고 swotvac 때 특히 유용하다. IPA를 미리 배울 필요는 없다."
      vi: "Xem bài giảng, làm bài tập từng chủ đề và đi tutorial. Một số người dựa nhiều vào workbook và ghi chú bài giảng, nhất là lúc swotvac. Không cần học IPA trước."
      ms: "Tonton kuliah, buat latihan setiap topik dan hadir tutorial. Ada yang banyak bergantung pada buku kerja dan nota kuliah, terutama semasa swotvac. Tak perlu belajar IPA dahulu."
      id: "Tonton kuliah, kerjakan latihan tiap topik, dan ikut tutorial. Ada yang sangat mengandalkan workbook dan catatan kuliah, terutama saat swotvac. Tak perlu belajar IPA dulu."
      hi: "लेक्चर देखें, हर टॉपिक के अभ्यास करें और ट्यूटोरियल जाएँ। कुछ ने वर्कबुक और लेक्चर नोट्स पर बहुत भरोसा किया, खासकर swotvac में। IPA पहले से सीखना ज़रूरी नहीं।"
