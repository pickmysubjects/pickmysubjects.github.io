points:
  - en: "Hands-on outdoor surveying with real equipment; almost all assessment except the exam is group work."
    zh: "使用真实仪器进行户外测量实践，除考试外几乎全是小组作业。"
    zh-TW: "用真實儀器做戶外測量實作；除了考試外幾乎全是小組作業。"
    ja: "本物の機材を使った屋外測量の実習。試験以外の評価はほぼすべてグループワーク。"
    ko: "실제 장비로 하는 야외 측량 실습이며, 시험을 제외한 거의 모든 평가가 조별 활동."
    vi: "Thực hành đo đạc ngoài trời với thiết bị thật; gần như mọi bài đánh giá trừ bài thi đều làm nhóm."
    ms: "Ukur luar secara amali dengan peralatan sebenar; hampir semua penilaian kecuali peperiksaan ialah kerja berkumpulan."
    id: "Survei lapangan langsung dengan alat sungguhan; hampir semua penilaian selain ujian adalah kerja kelompok."
    hi: "असली उपकरणों के साथ आउटडोर सर्वेइंग; एग्ज़ाम के अलावा लगभग सारा असेसमेंट ग्रुप वर्क है।"
  - en: "Pre-2021 reviewers found it fun with supportive staff and an easy exam similar to past years."
    zh: "2021年前的评价认为课程有趣、老师支持，考试简单且与往年相似。"
    zh-TW: "2021年以前的評論者覺得很有趣，老師很支持，考試簡單且和往年相似。"
    ja: "2021年以前の口コミでは楽しく教員も協力的で、試験は簡単で過去と似ていたとのこと。"
    ko: "2021년 이전 후기는 재미있고 교수진이 협조적이며, 시험이 쉽고 예년과 비슷했다고 함."
    vi: "Đánh giá trước 2021 thấy vui, giảng viên hỗ trợ tốt và bài thi dễ, giống các năm trước."
    ms: "Pengulas sebelum 2021 rasa ia seronok dengan staf yang menyokong dan peperiksaan mudah serupa tahun lepas."
    id: "Pengulas sebelum 2021 merasa seru dengan staf yang suportif dan ujian mudah yang mirip tahun-tahun lalu."
    hi: "2021 से पहले के रिव्यूअर को यह मज़ेदार लगा, सपोर्टिव स्टाफ़ और पिछले सालों जैसा आसान एग्ज़ाम।"
  - en: "A 2021 reviewer said disruptions left it with lectures only and little support, so check how it runs now."
    zh: "2021年有评价称因受干扰只剩讲课、支持很少，建议了解现在的开课情况。"
    zh-TW: "一位2021年的評論者說受到干擾後只剩講課、支援很少，建議先了解現在的開課方式。"
    ja: "2021年の口コミでは混乱のため講義のみになりサポートも少なかったとのこと。現在の実施状況を確認しよう。"
    ko: "2021년 한 후기는 여러 차질로 강의만 남고 지원이 적었다고 하니, 지금은 어떻게 운영되는지 확인하세요."
    vi: "Một đánh giá năm 2021 nói do gián đoạn nên chỉ còn bài giảng và ít hỗ trợ, vì vậy hãy kiểm tra cách môn học hiện nay."
    ms: "Seorang pengulas 2021 kata gangguan menyebabkan hanya ada kuliah dan sedikit sokongan, jadi semak cara ia dijalankan sekarang."
    id: "Seorang pengulas 2021 bilang gangguan membuatnya hanya berisi kuliah dan minim dukungan, jadi cek bagaimana jalannya sekarang."
    hi: "2021 के एक रिव्यूअर ने कहा कि रुकावटों की वजह से सिर्फ़ लेक्चर बचे और सपोर्ट कम रहा, तो अभी यह कैसे चलता है, जाँच लें।"
difficulty: easy
