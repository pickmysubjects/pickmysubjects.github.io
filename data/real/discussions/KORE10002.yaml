points:
  - en: "The jump from Korean 1 is big, and classes often include advanced students, so beginners can feel left behind."
    zh: "从韩语1过来跨度很大，班上常有程度较高的学生，初学者可能觉得跟不上。"
    zh-TW: "從韓語1過來跨度很大，班上常有程度較高的學生，初學者可能覺得跟不上。"
    ja: "Korean 1からの飛躍が大きく、上級者もよくいるので、初心者は置いていかれる感じがすることも。"
    ko: "Korean 1에서 넘어가는 격차가 크고, 상급자가 많아 초보자는 뒤처진 느낌을 받을 수 있음."
    vi: "Bước nhảy từ Korean 1 rất lớn, lớp thường có người trình độ cao nên người mới dễ thấy bị bỏ lại."
    ms: "Lonjakan dari Korean 1 besar, dan kelas sering ada pelajar mahir, jadi pemula boleh rasa ketinggalan."
    id: "Lompatan dari Korean 1 besar, dan kelas sering berisi mahasiswa mahir, jadi pemula bisa merasa tertinggal."
    hi: "Korean 1 से यह छलाँग बड़ी है, और क्लास में अक्सर एडवांस छात्र होते हैं, इसलिए शुरुआती लोग पीछे छूटा महसूस कर सकते हैं।"
  - en: "A 2021 reviewer found communication poor and the subject stressful, while a 2023 reviewer with prior Korean found homework and tests straightforward."
    zh: "一位2021年的评论者觉得沟通差、压力大；而一位有韩语基础的2023年评论者觉得作业和测验都不难。"
    zh-TW: "一位2021年的評論者覺得溝通差、壓力大；而一位有韓語基礎的2023年評論者覺得作業和測驗都不難。"
    ja: "2021年のレビューでは連絡が悪くストレスの多い科目だったが、韓国語の経験がある2023年のレビュアーは宿題もテストも素直だったとのこと。"
    ko: "2021년 리뷰어는 소통이 부족하고 스트레스가 컸다고 했지만, 한국어 경험이 있는 2023년 리뷰어는 숙제와 시험이 무난했다고 함."
    vi: "Một người năm 2021 thấy giao tiếp kém và áp lực, còn người năm 2023 đã biết tiếng Hàn thấy bài tập và kiểm tra dễ hiểu."
    ms: "Seorang pengulas 2021 dapati komunikasi lemah dan subjek ini menekan, manakala pengulas 2023 yang ada asas Korea dapati kerja rumah dan ujian mudah."
    id: "Pengulas 2021 merasa komunikasinya buruk dan bikin stres, sementara pengulas 2023 yang sudah bisa bahasa Korea merasa PR dan tesnya lugas."
    hi: "2021 के एक रिव्यूअर को संवाद ख़राब और विषय तनाव भरा लगा, जबकि पहले से कोरियाई जानने वाले 2023 के रिव्यूअर को होमवर्क और टेस्ट सीधे लगे।"
