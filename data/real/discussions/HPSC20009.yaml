  - en: "Essentially a philosophy subject with lots of reading and essay writing."
    zh: "本质上是一门哲学课，阅读和论文写作量都很大。"
    zh-TW: "本質上是一門哲學課，閱讀和論文寫作量都很大。"
    ja: "実質的には哲学の科目で、読む量もエッセイを書く量も多い。"
    ko: "사실상 철학 과목으로, 읽기와 에세이 쓰기 양이 많음."
    vi: "Về cơ bản là môn triết học, đọc nhiều và viết luận nhiều."
    ms: "Pada dasarnya subjek falsafah dengan banyak bacaan dan penulisan esei."
    id: "Pada dasarnya mata kuliah filsafat dengan banyak bacaan dan penulisan esai."
    hi: "असल में यह दर्शनशास्त्र का विषय है, जिसमें बहुत पढ़ना और निबंध लिखना होता है।"
  - en: "An Arts student in 2024 found the marking reasonable and the workshops interesting, while a 2023 science student said it hurt their WAM and advised non-Arts students to think twice."
    zh: "2024年的一位文科生觉得评分合理、研讨有趣；而2023年的一位理科生说它拉低了自己的WAM，建议非文科生慎重考虑。"
    zh-TW: "2024年的一位文科生覺得評分合理、研討有趣；而2023年的一位理科生說它拉低了自己的WAM，建議非文科生慎重考慮。"
    ja: "2024年の文系学生は採点が妥当でワークショップも面白かったと言う一方、2023年の理系学生はWAMが下がったので文系以外はよく考えるべきだと述べている。"
    ko: "2024년 인문계 학생은 채점이 합리적이고 워크숍이 흥미로웠다고 했지만, 2023년 이과생은 WAM이 깎였다며 비인문계 학생은 신중하라고 함."
    vi: "Một sinh viên Arts năm 2024 thấy chấm điểm hợp lý và workshop thú vị, còn một sinh viên khoa học năm 2023 nói môn này kéo WAM xuống và khuyên người ngoài Arts cân nhắc kỹ."
    ms: "Seorang pelajar Sastera pada 2024 dapati pemarkahan munasabah dan bengkel menarik, manakala seorang pelajar sains 2023 kata ia menjejaskan WAM dan menasihati pelajar bukan Sastera berfikir dua kali."
    id: "Mahasiswa Arts di 2024 merasa penilaiannya wajar dan workshop-nya menarik, sementara mahasiswa sains 2023 bilang WAM-nya turun dan menyarankan mahasiswa non-Arts berpikir dua kali."
    hi: "2024 के एक आर्ट्स छात्र को मार्किंग उचित और वर्कशॉप दिलचस्प लगीं, जबकि 2023 के एक साइंस छात्र ने कहा कि इससे उसका WAM गिरा और गैर-आर्ट्स छात्रों को सोच-समझकर लेना चाहिए।"
