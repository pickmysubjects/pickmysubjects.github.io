code: COMP20007
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/comp20007
reviews: 9
from: 2017
to: 2022
checked: 2026-10-08
points:
  - en: "More theoretical than COMP20003; the exam is in pseudocode and C is only needed for the assignments."
    zh: "比 COMP20003 更偏理论；考试用伪代码，只有作业要用 C。"
    zh-TW: "比 COMP20003 更偏理論；考試用虛擬碼，只有作業需要 C。"
    ja: "COMP20003より理論寄り。試験は疑似コードで、Cは課題でのみ使う。"
    ko: "COMP20003보다 이론적이다. 시험은 의사코드로 보고, C는 과제에서만 필요하다."
    vi: "Thiên về lý thuyết hơn COMP20003; bài thi viết bằng mã giả, C chỉ cần cho bài tập."
    ms: "Lebih teori daripada COMP20003; peperiksaan dalam pseudokod dan C hanya perlu untuk tugasan."
    id: "Lebih teoretis dari COMP20003; ujiannya pakai pseudocode dan C hanya untuk tugas."
    hi: "COMP20003 से ज़्यादा थ्योरी वाला; परीक्षा स्यूडोकोड में होती है और C सिर्फ़ असाइनमेंट में चाहिए।"
  - en: "Opinions are split: some found the content interesting and the exam fair, others found lectures fast-paced and marking unclear."
    zh: "评价两极：有人觉得内容有趣、考试公平，也有人觉得讲课节奏快、评分标准不清楚。"
    zh-TW: "評價兩極：有人覺得內容有趣、考試公平，也有人覺得講課太快、評分標準不清楚。"
    ja: "評価は分かれる。内容が面白く試験も公平という人もいれば、講義のペースが速く採点基準が不明確という人もいる。"
    ko: "의견은 갈린다. 내용이 흥미롭고 시험이 공정하다는 사람도, 강의가 빠르고 채점이 불명확하다는 사람도 있다."
    vi: "Ý kiến trái chiều: có người thấy nội dung hay và đề công bằng, người khác thấy bài giảng nhanh và cách chấm không rõ."
    ms: "Pandangan berbelah bahagi: ada yang dapati kandungan menarik dan peperiksaan adil, ada yang rasa kuliah laju dan pemarkahan tidak jelas."
    id: "Pendapat terbelah: ada yang merasa materinya menarik dan ujiannya adil, ada yang merasa kuliahnya cepat dan penilaiannya tidak jelas."
    hi: "राय बंटी है: कुछ को कंटेंट दिलचस्प और परीक्षा निष्पक्ष लगी, दूसरों को लेक्चर तेज़ और मार्किंग अस्पष्ट लगी।"
  - en: "Tutorials and outside videos were what several reviewers relied on to understand the harder algorithms such as dynamic programming."
    zh: "好几位同学说主要靠辅导课和网上的视频才弄懂较难的算法，比如动态规划。"
    zh-TW: "好幾位評論者說主要靠輔導課和外部影片才弄懂較難的演算法，例如動態規劃。"
    ja: "動的計画法などの難しいアルゴリズムは、チュートリアルと外部の動画に頼って理解したという声が複数。"
    ko: "여러 리뷰어가 동적 계획법 같은 어려운 알고리즘은 튜토리얼과 외부 영상에 의지해 이해했다고 한다."
    vi: "Vài người nói họ dựa vào tutorial và video bên ngoài để hiểu các thuật toán khó như quy hoạch động."
    ms: "Beberapa pengulas bergantung pada tutorial dan video luar untuk memahami algoritma lebih sukar seperti pengaturcaraan dinamik."
    id: "Beberapa pengulas mengandalkan tutorial dan video luar untuk memahami algoritma sulit seperti dynamic programming."
    hi: "कई रिव्यूअर्स ने डायनेमिक प्रोग्रामिंग जैसे कठिन एल्गोरिदम समझने के लिए ट्यूटोरियल और बाहरी वीडियो का सहारा लिया।"
sections:
  content:
    - en: "A theory-leaning algorithms subject: complexity, sorting, trees, graphs, hashing and dynamic programming. More theoretical than COMP20003; some found parts tricky to grasp."
      zh: "偏理论的算法课：复杂度、排序、树、图、哈希和动态规划。比 COMP20003 更理论；有人觉得部分内容难懂。"
      zh-TW: "偏理論的演算法課：複雜度、排序、樹、圖、雜湊和動態規劃。比 COMP20003 更理論；有人覺得部分內容難懂。"
      ja: "理論寄りのアルゴリズム科目。計算量、ソート、木、グラフ、ハッシュ、動的計画法。COMP20003より理論的で、難しい部分もあるという声。"
      ko: "이론 쪽 알고리즘 과목. 복잡도, 정렬, 트리, 그래프, 해싱, 동적 계획법. COMP20003보다 이론적이고 일부는 이해하기 어렵다는 평."
      vi: "Môn thuật toán thiên lý thuyết: độ phức tạp, sắp xếp, cây, đồ thị, băm và quy hoạch động. Lý thuyết hơn COMP20003; có người thấy vài phần khó nắm."
      ms: "Subjek algoritma yang condong teori: kerumitan, isihan, pokok, graf, cincangan dan pengaturcaraan dinamik. Lebih teori daripada COMP20003; ada yang rasa sebahagiannya sukar difahami."
      id: "Mata kuliah algoritma yang condong teori: kompleksitas, pengurutan, pohon, graf, hashing dan pemrograman dinamis. Lebih teoretis dari COMP20003; sebagian merasa ada bagian yang sulit dipahami."
      hi: "थ्योरी की ओर झुका एल्गोरिदम विषय: कॉम्प्लेक्सिटी, सॉर्टिंग, ट्री, ग्राफ़, हैशिंग और डायनामिक प्रोग्रामिंग। COMP20003 से ज़्यादा सैद्धांतिक; कुछ हिस्से कुछ को कठिन लगे।"
  work:
    - en: "An early MST, two assignments in C with generous starter code plus written questions, and a 60% exam in pseudocode. A 2022 reviewer found the exam close to the sample one."
      zh: "较早的 MST，两个用 C 写的作业（给了不少起始代码，另有书面题），以及占 60% 的伪代码期末。2022 年有同学觉得期末和样卷很像。"
      zh-TW: "較早的 MST，兩份用 C 寫的作業（給了不少起始程式碼，另有書面題），以及佔 60% 的虛擬碼期末。2022 年有同學覺得期末和樣卷很像。"
      ja: "早めのMST、スターターコードが多めのC言語課題2つと記述問題、擬似コードで解く60%の期末試験。2022年は期末がサンプル試験に近かったという声。"
      ko: "이른 MST, 시작 코드를 넉넉히 주는 C 과제 2개와 서술 문제, 의사코드로 푸는 60% 기말이 있다. 2022년엔 기말이 샘플 시험과 비슷했다는 리뷰가 있다."
      vi: "MST sớm, hai bài tập bằng C có sẵn nhiều code khởi đầu cùng câu hỏi viết, và bài thi 60% bằng mã giả. Một người năm 2022 thấy đề thi gần giống đề mẫu."
      ms: "MST awal, dua tugasan dalam C dengan kod permulaan yang banyak serta soalan bertulis, dan peperiksaan 60% dalam pseudokod. Seorang pengulas 2022 rasa peperiksaan hampir sama dengan contoh."
      id: "MST di awal, dua tugas dengan C yang diberi banyak kode awal plus soal tertulis, dan ujian 60% dengan pseudokode. Satu pengulas 2022 merasa ujiannya mirip ujian contoh."
      hi: "शुरुआती MST, C में दो असाइनमेंट जिनमें काफ़ी स्टार्टर कोड और लिखित सवाल हैं, और 60% की परीक्षा स्यूडोकोड में। 2022 के एक रिव्यूअर को परीक्षा सैंपल पेपर जैसी लगी।"
  study:
    - en: "Go to tutorials, which several say teach more than the lectures; use outside videos for hard algorithms, review the whole course early, and practise running each algorithm by hand."
      zh: "tutorial 一定要去，好几位说比讲课学得多；难的算法看课外视频；早点把整门课复习一遍，并练习手动跑每个算法。"
      zh-TW: "tutorial 一定要去，好幾位說比上課學得多；難的演算法看課外影片；早點把整門課複習一遍，並練習手動跑每個演算法。"
      ja: "チュートリアルに出ること。講義より学べるという声が複数。難しいアルゴリズムは外部動画で補い、早めに全体を復習し、各アルゴリズムを手で動かす練習を。"
      ko: "튜토리얼에 가라. 강의보다 더 배운다는 평이 여럿이다. 어려운 알고리즘은 외부 영상으로 보충하고, 전체를 일찍 복습하며 각 알고리즘을 손으로 돌려 보라."
      vi: "Đi tutorial, vài người nói học được nhiều hơn bài giảng; xem video ngoài cho thuật toán khó, ôn toàn môn sớm, và luyện chạy tay từng thuật toán."
      ms: "Hadir tutorial, yang beberapa kata lebih mengajar daripada kuliah; guna video luar untuk algoritma sukar, ulang kaji seluruh kursus awal, dan latih jalankan setiap algoritma dengan tangan."
      id: "Hadiri tutorial, yang menurut beberapa pengulas lebih mengajar daripada kuliah; pakai video luar untuk algoritma sulit, ulang seluruh materi lebih awal, dan latih menjalankan tiap algoritma secara manual."
      hi: "ट्यूटोरियल में जाएँ, जो कई के अनुसार लेक्चर से ज़्यादा सिखाते हैं; कठिन एल्गोरिदम के लिए बाहरी वीडियो देखें, पूरा कोर्स जल्दी दोहराएँ, और हर एल्गोरिदम हाथ से चलाने का अभ्यास करें।"
  watch:
    - en: "Many reviewers found lectures rushed on hard parts with poor audio, and some found marking unclear. All reviews are from 2022 or earlier, so it may have changed."
      zh: "很多同学觉得讲课在难点处讲太快、录音质量差，也有人觉得评分不清楚。所有评价都是 2022 年或更早的，课程可能已有变化。"
      zh-TW: "很多同學覺得上課在難點處講太快、錄音品質差，也有人覺得評分不清楚。所有評價都是 2022 年或更早的，課程可能已有變化。"
      ja: "難しい部分で講義が駆け足で音質も悪いという声が多く、採点が不明確だという声も。レビューはすべて2022年以前で、変わっている可能性がある。"
      ko: "많은 리뷰어가 어려운 부분에서 강의가 너무 빠르고 음질이 나쁘다고 했고, 채점이 불분명하다는 의견도 있다. 모든 리뷰가 2022년 이전이라 바뀌었을 수 있다."
      vi: "Nhiều người thấy bài giảng vội ở phần khó và âm thanh kém, một số thấy chấm điểm không rõ ràng. Tất cả đánh giá từ 2022 trở về trước nên môn có thể đã thay đổi."
      ms: "Ramai pengulas dapati kuliah tergesa-gesa pada bahagian sukar dengan audio lemah, dan ada yang rasa pemarkahan tidak jelas. Semua ulasan dari 2022 atau lebih awal, jadi mungkin telah berubah."
      id: "Banyak pengulas merasa kuliah terburu-buru di bagian sulit dengan audio buruk, dan sebagian merasa penilaian tidak jelas. Semua ulasan dari 2022 atau sebelumnya, jadi mungkin sudah berubah."
      hi: "कई रिव्यूअर्स को कठिन हिस्सों पर लेक्चर जल्दबाज़ी वाले और ऑडियो ख़राब लगा, और कुछ को मार्किंग अस्पष्ट। सभी रिव्यू 2022 या पहले के हैं, तो यह बदल गया हो सकता है।"
difficulty: mixed
