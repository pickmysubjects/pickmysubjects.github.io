points:
  - en: "More theoretical than COMP20003; the exam is in pseudocode and C is only needed for the assignments."
    zh: "比 COMP20003 更偏理论；考试用伪代码，只有作业要用 C。"
    zh-TW: "比 COMP20003 更偏理論；考試用虛擬碼，只有作業需要 C。"
    ja: "COMP20003より理論寄り。試験は疑似コードで、Cは課題でのみ使う。"
    ko: "COMP20003보다 이론적이다. 시험은 의사코드로 보고, C는 과제에서만 필요하다."
    vi: "Thiên về lý thuyết hơn COMP20003; bài thi viết bằng mã giả, C chỉ cần cho bài tập."
    ms: "Lebih teori daripada COMP20003; peperiksaan dalam pseudokod dan C hanya perlu untuk tugasan."
    id: "Lebih teoretis dari COMP20003; ujiannya pakai pseudocode dan C hanya untuk tugas."
    hi: "COMP20003 से ज़्यादा थ्योरी वाला; परीक्षा स्यूडोकोड में होती है और C सिर्फ़ असाइनमेंट में चाहिए।"
  - en: "Opinions are split: some found the content interesting and the exam fair, others found lectures fast-paced and marking unclear."
    zh: "评价两极：有人觉得内容有趣、考试公平，也有人觉得讲课节奏快、评分标准不清楚。"
    zh-TW: "評價兩極：有人覺得內容有趣、考試公平，也有人覺得講課太快、評分標準不清楚。"
    ja: "評価は分かれる。内容が面白く試験も公平という人もいれば、講義のペースが速く採点基準が不明確という人もいる。"
    ko: "의견은 갈린다. 내용이 흥미롭고 시험이 공정하다는 사람도, 강의가 빠르고 채점이 불명확하다는 사람도 있다."
    vi: "Ý kiến trái chiều: có người thấy nội dung hay và đề công bằng, người khác thấy bài giảng nhanh và cách chấm không rõ."
    ms: "Pandangan berbelah bahagi: ada yang dapati kandungan menarik dan peperiksaan adil, ada yang rasa kuliah laju dan pemarkahan tidak jelas."
    id: "Pendapat terbelah: ada yang merasa materinya menarik dan ujiannya adil, ada yang merasa kuliahnya cepat dan penilaiannya tidak jelas."
    hi: "राय बंटी है: कुछ को कंटेंट दिलचस्प और परीक्षा निष्पक्ष लगी, दूसरों को लेक्चर तेज़ और मार्किंग अस्पष्ट लगी।"
  - en: "Tutorials and outside videos were what several reviewers relied on to understand the harder algorithms such as dynamic programming."
    zh: "好几位同学说主要靠辅导课和网上的视频才弄懂较难的算法，比如动态规划。"
    zh-TW: "好幾位評論者說主要靠輔導課和外部影片才弄懂較難的演算法，例如動態規劃。"
    ja: "動的計画法などの難しいアルゴリズムは、チュートリアルと外部の動画に頼って理解したという声が複数。"
    ko: "여러 리뷰어가 동적 계획법 같은 어려운 알고리즘은 튜토리얼과 외부 영상에 의지해 이해했다고 한다."
    vi: "Vài người nói họ dựa vào tutorial và video bên ngoài để hiểu các thuật toán khó như quy hoạch động."
    ms: "Beberapa pengulas bergantung pada tutorial dan video luar untuk memahami algoritma lebih sukar seperti pengaturcaraan dinamik."
    id: "Beberapa pengulas mengandalkan tutorial dan video luar untuk memahami algoritma sulit seperti dynamic programming."
    hi: "कई रिव्यूअर्स ने डायनेमिक प्रोग्रामिंग जैसे कठिन एल्गोरिदम समझने के लिए ट्यूटोरियल और बाहरी वीडियो का सहारा लिया।"
difficulty: mixed
