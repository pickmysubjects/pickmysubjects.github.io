points:
  - en: "Reviewers from 2020 to 2022 found it well organised, with easy content and H1 quite achievable; one called it a WAM booster."
    zh: "2020到2022年的评论者觉得组织得好，内容简单，拿H1不难；有人称它是拉高WAM的课。"
    zh-TW: "2020到2022年的評論者覺得組織得好，內容簡單，拿H1不難；有人稱它是拉高WAM的課。"
    ja: "2020〜2022年のレビューでは運営がよく内容も易しく、H1も十分狙えるとのこと。WAMを上げる科目と言う人もいた。"
    ko: "2020~2022년 리뷰어들은 운영이 잘 되고 내용이 쉬워 H1이 충분히 가능하다고 함. WAM 올리기용이라는 사람도 있음."
    vi: "Người đánh giá 2020-2022 thấy môn tổ chức tốt, nội dung dễ và dễ đạt H1; một người gọi là môn kéo WAM."
    ms: "Pengulas dari 2020 hingga 2022 dapati ia teratur, kandungan mudah dan H1 boleh dicapai; seorang menggelarnya penaik WAM."
    id: "Pengulas 2020-2022 merasa tertata, isinya mudah, dan H1 cukup bisa diraih; seorang menyebutnya pendongkrak WAM."
    hi: "2020 से 2022 के रिव्यूअर्स को यह व्यवस्थित, आसान सामग्री वाला और H1 पाने लायक लगा; एक ने इसे WAM बढ़ाने वाला कहा।"
  - en: "Case studies lean heavily on India, which can get repetitive, and there are many assignments; a 2025 reviewer found them unclear on how to do well."
    zh: "案例大量集中在印度，可能有些重复，作业也多；一位2025年的评论者觉得作业要求不清楚怎样才能拿高分。"
    zh-TW: "案例大量集中在印度，可能有些重複，作業也多；一位2025年的評論者覺得作業要求不清楚怎樣才能拿高分。"
    ja: "事例研究はインドに偏っていて繰り返しに感じることがあり、課題も多い。2025年のレビューでは、高得点の取り方が課題からはわかりにくかったとのこと。"
    ko: "사례 연구가 인도에 치우쳐 반복적일 수 있고 과제도 많음. 2025년 리뷰어는 잘하는 방법이 과제에서 불분명했다고 함."
    vi: "Các nghiên cứu điển hình tập trung nhiều vào Ấn Độ, có thể lặp lại, và có nhiều bài tập; một người năm 2025 thấy không rõ làm sao để đạt điểm cao."
    ms: "Kajian kes banyak tertumpu pada India, yang boleh jadi berulang, dan banyak tugasan; seorang pengulas 2025 dapati tidak jelas cara untuk berjaya."
    id: "Studi kasusnya banyak berfokus ke India, bisa terasa berulang, dan tugasnya banyak; pengulas 2025 merasa tidak jelas cara mendapat nilai bagus."
    hi: "केस स्टडीज़ ज़्यादातर भारत पर हैं, जो दोहराव जैसा लग सकता है, और असाइनमेंट कई हैं; 2025 के एक रिव्यूअर को साफ़ नहीं था कि अच्छे अंक कैसे मिलें।"
sections:
  content:
    - en: "Young people around the world, with interesting readings and easy content; one reviewer notes case studies lean heavily on India, which got repetitive. Most found it a WAM booster."
      zh: "讲全球青年，阅读材料有意思、内容简单；有同学说案例大量集中在印度，有点重复。多数同学觉得能拉 WAM。"
      zh-TW: "講全球青年，閱讀材料有意思、內容簡單；有同學說案例大量集中在印度，有點重複。多數同學覺得能拉 WAM。"
      ja: "世界の若者を扱い、リーディングは面白く内容は簡単。事例がインドに偏り繰り返しが多いという人も。多くはWAMを上げられる科目だと言う。"
      ko: "전 세계 청년을 다루며 리딩이 흥미롭고 내용이 쉽다. 사례가 인도에 치우쳐 반복적이라는 리뷰도 있다. 대부분 WAM 올리기 좋다고 한다."
      vi: "Về giới trẻ toàn cầu, bài đọc thú vị và nội dung dễ; một người nói các tình huống tập trung nhiều vào Ấn Độ nên hơi lặp. Đa số thấy là môn kéo WAM."
      ms: "Tentang golongan muda di seluruh dunia, bacaan menarik dan kandungan mudah; seorang kata kajian kes banyak tertumpu pada India, jadi berulang. Kebanyakan rasa ia penaik WAM."
      id: "Tentang anak muda di seluruh dunia, bacaannya menarik dan materinya mudah; satu bilang studi kasus banyak berfokus di India sehingga berulang. Sebagian besar merasa pendongkrak WAM."
      hi: "दुनिया भर के युवाओं पर, रोचक रीडिंग और आसान सामग्री; एक बताता है केस स्टडी ज़्यादातर भारत पर हैं, जिससे दोहराव हुआ। ज़्यादातर को यह WAM बढ़ाने वाला लगा।"
  work:
    - en: "Assignments are mostly straightforward and an H1 is achievable, though one found there were a lot of them. Two reviewers found an assignment a bit odd or unclear on how to do well."
      zh: "作业大多比较直接，H1 拿得到，不过有人觉得作业数量多。两位同学觉得某个作业有点怪，不太清楚怎么拿高分。"
      zh-TW: "作業大多比較直接，H1 拿得到，不過有人覺得作業數量多。兩位同學覺得某份作業有點怪，不太清楚怎麼拿高分。"
      ja: "課題はほぼ素直でH1も狙えるが、数が多いと感じた人も。ある課題が少し変で、高得点の取り方が分かりにくかったという人が二人。"
      ko: "과제는 대체로 무난하고 H1도 가능하지만 개수가 많다는 사람도 있다. 두 명은 어떤 과제가 좀 이상하고 잘하는 법이 불분명했다고 한다."
      vi: "Bài tập phần lớn đơn giản và có thể đạt H1, dù một người thấy hơi nhiều. Hai người thấy một bài hơi lạ hoặc không rõ cách làm tốt."
      ms: "Tugasan kebanyakannya mudah dan H1 boleh dicapai, walaupun seorang rasa jumlahnya banyak. Dua pengulas rasa satu tugasan agak pelik atau tidak jelas cara skor tinggi."
      id: "Tugas sebagian besar lugas dan H1 bisa diraih, meski satu merasa jumlahnya banyak. Dua pengulas merasa satu tugas agak aneh atau tidak jelas cara dapat nilai bagus."
      hi: "असाइनमेंट ज़्यादातर सीधे हैं और H1 संभव है, हालाँकि एक को ये बहुत ज़्यादा लगे। दो को एक असाइनमेंट थोड़ा अजीब या अच्छा करने के बारे में अस्पष्ट लगा।"
difficulty: easy
