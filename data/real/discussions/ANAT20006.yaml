points:
  - en: "Very content-heavy and memorisation-based; the first weeks (neuroanatomy, embryology) feel hardest, and embryology is often named the toughest topic."
    zh: "内容极多，以记忆为主；前几周（神经解剖、胚胎学）最难，胚胎学常被认为是最难的部分。"
    zh-TW: "內容非常多、以背誦為主；前幾週（神經解剖、胚胎學）最難，胚胎學常被認為是最難的部分。"
    ja: "内容が非常に多く暗記中心。最初の数週（神経解剖、発生学）が一番きつく、発生学が最難関とよく言われる。"
    ko: "내용이 매우 많고 암기 위주. 초반 몇 주(신경해부학, 발생학)가 가장 어렵고, 발생학이 가장 힘든 주제로 자주 꼽힘."
    vi: "Rất nặng nội dung, chủ yếu học thuộc; mấy tuần đầu (giải phẫu thần kinh, phôi học) khó nhất, phôi học hay bị coi là phần khó nhất."
    ms: "Sangat padat dan berasaskan hafalan; minggu awal (neuroanatomi, embriologi) paling sukar, dan embriologi sering disebut topik paling sukar."
    id: "Materinya sangat padat dan berbasis hafalan; minggu awal (neuroanatomi, embriologi) terasa paling berat, embriologi sering disebut topik tersulit."
    hi: "बहुत ज़्यादा कंटेंट और रटने पर आधारित; शुरुआती हफ़्ते (न्यूरोएनाटॉमी, एम्ब्रियोलॉजी) सबसे कठिन, एम्ब्रियोलॉजी को अक्सर सबसे मुश्किल टॉपिक कहा जाता है।"
  - en: "Mid-semester tests are all multiple choice and seen as fair; the final exam (about 60%) was generally called reasonable, with a few niche questions."
    zh: "期中测验全为选择题，被认为公平；期末考试（约60%）普遍认为合理，但有少数冷门题。"
    zh-TW: "期中測驗全是選擇題，被認為公平；期末考（約60%）普遍被認為合理，但有少數冷門題。"
    ja: "中間テストはすべて選択式で公平とされる。期末試験（約60%）も概ね妥当だが、マニアックな問題が少しある。"
    ko: "중간시험은 모두 객관식이고 공정하다는 평. 기말시험(약 60%)도 대체로 무난하지만 지엽적인 문제가 몇 개 있음."
    vi: "Bài kiểm tra giữa kỳ toàn trắc nghiệm, được cho là công bằng; thi cuối kỳ (khoảng 60%) nhìn chung hợp lý, có vài câu khó hiếm."
    ms: "Ujian pertengahan semester semuanya aneka pilihan dan dianggap adil; peperiksaan akhir (kira-kira 60%) umumnya munasabah, ada beberapa soalan luar biasa."
    id: "Ujian tengah semester semua pilihan ganda dan dinilai adil; ujian akhir (sekitar 60%) umumnya wajar, dengan beberapa soal yang jarang dibahas."
    hi: "मिड-सेमेस्टर टेस्ट सब बहुविकल्पीय हैं और ठीक माने गए; फ़ाइनल (लगभग 60%) आमतौर पर ठीक कहा गया, कुछ अनोखे सवालों के साथ।"
  - en: "Cadaver practicals are a highlight but most useful if you prepare beforehand; review lectures and repeatable online quizzes are easy marks."
    zh: "尸体解剖实践课是亮点，但课前预习才最有收获；复习讲座和可重复作答的在线小测是容易拿的分。"
    zh-TW: "大體解剖實作是亮點，但課前預習才最有收穫；複習講座和可重複作答的線上小考是容易拿的分數。"
    ja: "献体を使う実習が目玉だが、予習しておくと一番役立つ。復習講義と何度も受けられるオンライン小テストは取りやすい点。"
    ko: "카데바 실습이 하이라이트지만 미리 준비해야 가장 유익함. 복습 강의와 반복 응시 가능한 온라인 퀴즈는 쉬운 점수."
    vi: "Thực hành trên xác là điểm nhấn nhưng chỉ hữu ích nhất khi chuẩn bị trước; bài giảng ôn tập và quiz online làm lại được là điểm dễ."
    ms: "Amali kadaver ialah kemuncak tetapi paling berguna jika bersedia awal; kuliah ulang kaji dan kuiz dalam talian yang boleh diulang ialah markah mudah."
    id: "Praktikum kadaver jadi sorotan tapi paling berguna kalau persiapan dulu; kuliah ulasan dan kuis online yang bisa diulang adalah nilai mudah."
    hi: "कैडेवर प्रैक्टिकल सबसे खास हैं, पर पहले से तैयारी करने पर ही सबसे काम के; रिव्यू लेक्चर और दोबारा दिए जा सकने वाले ऑनलाइन क्विज़ आसान नंबर हैं।"
  - en: "Many say an H1 is very achievable with consistent effort; spaced repetition such as Anki is widely recommended."
    zh: "许多人表示只要持续努力很容易拿H1；普遍推荐用Anki等间隔重复法复习。"
    zh-TW: "很多人說只要持續努力，拿H1很有機會；普遍推薦用Anki等間隔重複法複習。"
    ja: "コツコツ努力すればH1は十分狙えるという声が多い。Ankiなどの間隔反復が広く勧められている。"
    ko: "꾸준히 노력하면 H1을 충분히 받을 수 있다는 의견이 많음. Anki 같은 간격 반복 학습을 많이 추천함."
    vi: "Nhiều người nói đạt H1 rất khả thi nếu chăm chỉ đều đặn; lặp lại ngắt quãng như Anki được khuyên dùng rộng rãi."
    ms: "Ramai kata H1 sangat boleh dicapai dengan usaha konsisten; ulangan berjarak seperti Anki banyak disyorkan."
    id: "Banyak yang bilang H1 sangat bisa diraih dengan usaha konsisten; pengulangan berjarak seperti Anki banyak direkomendasikan."
    hi: "कई लोग कहते हैं कि लगातार मेहनत से H1 पाना काफ़ी संभव है; Anki जैसी स्पेस्ड रिपिटिशन की खूब सलाह दी जाती है।"
workload: heavy
difficulty: mixed
