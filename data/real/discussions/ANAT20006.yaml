points:
  - en: "Very content-heavy and memorisation-based; the first weeks (neuroanatomy, embryology) feel hardest, and embryology is often named the toughest topic."
    zh: "内容极多，以记忆为主；前几周（神经解剖、胚胎学）最难，胚胎学常被认为是最难的部分。"
  - en: "Mid-semester tests are all multiple choice and seen as fair; the final exam (about 60%) was generally called reasonable, with a few niche questions."
    zh: "期中测验全为选择题，被认为公平；期末考试（约60%）普遍认为合理，但有少数冷门题。"
  - en: "Cadaver practicals are a highlight but most useful if you prepare beforehand; review lectures and repeatable online quizzes are easy marks."
    zh: "尸体解剖实践课是亮点，但课前预习才最有收获；复习讲座和可重复作答的在线小测是容易拿的分。"
  - en: "Many say an H1 is very achievable with consistent effort; spaced repetition such as Anki is widely recommended."
    zh: "许多人表示只要持续努力很容易拿H1；普遍推荐用Anki等间隔重复法复习。"
workload: heavy
