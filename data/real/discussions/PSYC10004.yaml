points:
  - en: "Many find it an easy H1 with a multiple-choice exam, but there is a lot of content and some reading-based questions are niche."
    zh: "很多人觉得容易拿H1，期末是选择题，但内容多，部分基于阅读材料的题目较偏。"
    zh-TW: "很多人覺得容易拿H1，期末是選擇題，但內容多，部分基於閱讀材料的題目較偏。"
    ja: "選択式の試験でH1が取りやすいという人が多いですが、内容は多く、読書課題に基づく問題には細かいものもあります。"
    ko: "객관식 시험이라 H1이 쉽다는 사람이 많지만 내용이 많고, 읽기 자료 기반 문제 중 지엽적인 것도 있습니다."
    vi: "Nhiều người thấy dễ đạt H1 với bài thi trắc nghiệm, nhưng nội dung nhiều và một số câu dựa trên bài đọc khá hiếm gặp."
    ms: "Ramai dapati H1 mudah dengan peperiksaan aneka pilihan, tetapi kandungan banyak dan sesetengah soalan berasaskan bacaan agak khusus."
    id: "Banyak yang merasa H1 mudah dengan ujian pilihan ganda, tapi materinya banyak dan beberapa soal dari bacaan cukup spesifik."
    hi: "कई लोगों को MCQ एग्ज़ाम के साथ H1 आसान लगा, पर कंटेंट बहुत है और रीडिंग पर आधारित कुछ सवाल काफी खास होते हैं।"
  - en: "The lab report or essay is marked harshly; scores above 80 are hard. Follow the rubric and use the many resources and examples provided."
    zh: "实验报告或论文评分严格，80分以上不易；紧扣评分标准，善用课程提供的大量资料和范例。"
    zh-TW: "實驗報告或論文評分嚴格，80分以上不易；緊扣評分標準，善用課程提供的大量資料和範例。"
    ja: "実験レポートやエッセイは採点が厳しく、80点以上は難しいです。ルーブリックに従い、豊富に用意された資料や例を活用しましょう。"
    ko: "실험 보고서나 에세이는 채점이 엄격해 80점 이상이 어렵습니다. 루브릭을 따르고 제공되는 많은 자료와 예시를 활용하세요."
    vi: "Báo cáo thí nghiệm hoặc bài luận bị chấm gắt; trên 80 điểm là khó. Bám rubric và tận dụng nhiều tài liệu, ví dụ được cung cấp."
    ms: "Laporan makmal atau esei dimarkah ketat; markah melebihi 80 sukar. Ikut rubrik dan guna banyak sumber serta contoh yang disediakan."
    id: "Laporan lab atau esai dinilai ketat; nilai di atas 80 sulit. Ikuti rubrik dan manfaatkan banyak sumber serta contoh yang disediakan."
    hi: "लैब रिपोर्ट या निबंध की मार्किंग सख्त है; 80 से ऊपर लाना मुश्किल है। रूब्रिक फॉलो करें और दिए गए ढेर सारे रिसोर्सेज़ व उदाहरण इस्तेमाल करें।"
  - en: "The clinical, developmental and social modules were popular; personality was seen as the driest."
    zh: "临床、发展和社会心理模块受欢迎，人格模块被认为最枯燥。"
    zh-TW: "臨床、發展和社會心理模組受歡迎，人格模組被認為最枯燥。"
    ja: "臨床、発達、社会の単元が人気で、パーソナリティが一番退屈だとされました。"
    ko: "임상, 발달, 사회 모듈이 인기였고 성격 모듈이 가장 지루하다는 평이었습니다."
    vi: "Các module lâm sàng, phát triển và xã hội được yêu thích; tâm lý nhân cách bị xem là khô khan nhất."
    ms: "Modul klinikal, perkembangan dan sosial popular; personaliti dianggap paling kering."
    id: "Modul klinis, perkembangan, dan sosial populer; kepribadian dianggap paling membosankan."
    hi: "क्लिनिकल, डेवलपमेंटल और सोशल मॉड्यूल्स लोकप्रिय थे; पर्सनैलिटी को सबसे नीरस माना गया।"
  - en: "Don't take it only as a WAM booster if the people-focused side of psychology doesn't interest you."
    zh: "如果对偏人文的心理学内容不感兴趣，不要只为提分而选。"
    zh-TW: "如果對偏人文的心理學內容不感興趣，不要只為提升WAM而選。"
    ja: "心理学の人に関わる側面に興味がないなら、WAMを上げるためだけに取るのはやめましょう。"
    ko: "심리학의 사람 중심 측면에 관심이 없다면 WAM 올리기용으로만 듣지 마세요."
    vi: "Đừng học chỉ để tăng WAM nếu bạn không hứng thú với mảng tâm lý học về con người."
    ms: "Jangan ambil hanya untuk naikkan WAM jika anda tidak berminat dengan sisi psikologi yang berfokus pada manusia."
    id: "Jangan ambil hanya untuk menaikkan WAM kalau kamu tidak tertarik pada sisi psikologi yang berfokus pada manusia."
    hi: "अगर साइकोलॉजी का लोगों से जुड़ा पहलू आपको पसंद नहीं, तो इसे सिर्फ WAM बढ़ाने के लिए न लें।"
sections:
  content:
    - en: "Four blocks: clinical, developmental, social and personality. More about people than the brain-anatomy side of MBB1; social is often the favourite and personality the driest."
      zh: "四个板块：临床、发展、社会和人格。比 MBB1 偏大脑解剖的内容更“心理”；社会心理常被说最好看，人格最干。"
      zh-TW: "四個板塊：臨床、發展、社會和人格。比 MBB1 偏大腦解剖的內容更「心理」；社會心理常被說最好看，人格最乾。"
      ja: "臨床・発達・社会・パーソナリティの4ブロック。脳の解剖寄りのMBB1より心理学らしい内容。社会心理が人気で、パーソナリティが一番退屈とされがち。"
      ko: "임상, 발달, 사회, 성격 네 블록이다. 뇌 해부 위주인 MBB1보다 더 심리학적이다. 사회심리가 가장 인기 있고 성격심리가 가장 지루하다는 평이 많다."
      vi: "Bốn phần: lâm sàng, phát triển, xã hội và nhân cách. Thiên về con người hơn phần giải phẫu não của MBB1; tâm lý xã hội thường được thích nhất, nhân cách khô nhất."
      ms: "Empat blok: klinikal, perkembangan, sosial dan personaliti. Lebih tentang manusia berbanding anatomi otak dalam MBB1; sosial selalunya kegemaran, personaliti paling hambar."
      id: "Empat blok: klinis, perkembangan, sosial dan kepribadian. Lebih soal manusia daripada anatomi otak di MBB1; sosial sering jadi favorit, kepribadian paling kering."
      hi: "चार ब्लॉक: क्लिनिकल, विकासात्मक, सामाजिक और व्यक्तित्व। MBB1 के मस्तिष्क-शरीर रचना वाले हिस्से से ज़्यादा लोगों के बारे में; सामाजिक अक्सर पसंदीदा, व्यक्तित्व सबसे नीरस।"
  work:
    - en: "One written assignment (lab report or essay) and an MCQ exam. The assignment is marked harshly by most accounts, though recent reviewers say lots of resources and a detailed rubric are provided."
      zh: "一个写作作业（实验报告或论文）加一场选择题考试。多数人说作业给分严，不过近期的同学说提供了很多资料和详细的评分标准。"
      zh-TW: "一個寫作作業（實驗報告或論文）加一場選擇題考試。多數人說作業給分嚴，不過近期的同學說提供了很多資料和詳細的評分標準。"
      ja: "文章課題1つ（ラボレポートかエッセイ）と選択式試験。課題の採点は厳しいという声が多いが、最近は資料と詳細なルーブリックが充実しているという。"
      ko: "글쓰기 과제 하나(실험 보고서나 에세이)와 객관식 시험이다. 과제 채점은 대부분 박하다고 하지만, 최근엔 자료와 상세한 루브릭이 많이 제공된다고 한다."
      vi: "Một bài viết (báo cáo thí nghiệm hoặc luận) và bài thi trắc nghiệm. Đa số nói bài viết chấm khắt khe, dù người học gần đây nói có nhiều tài liệu và tiêu chí chi tiết."
      ms: "Satu tugasan bertulis (laporan makmal atau esei) dan peperiksaan aneka pilihan. Kebanyakan kata tugasan dinilai ketat, walaupun pengulas terkini kata banyak sumber dan rubrik terperinci disediakan."
      id: "Satu tugas tulis (laporan lab atau esai) dan ujian pilihan ganda. Kebanyakan bilang tugasnya dinilai ketat, meski pengulas terbaru bilang banyak sumber dan rubrik rinci disediakan."
      hi: "एक लिखित असाइनमेंट (लैब रिपोर्ट या निबंध) और MCQ परीक्षा। ज़्यादातर के अनुसार असाइनमेंट का अंकन सख़्त है, हालाँकि हाल के रिव्यूअर कहते हैं ढेर सारे संसाधन और विस्तृत रूब्रिक मिलते हैं।"
    - en: "Most found the exam straightforward and close to the practice material; one recent reviewer says it tested niche details from long readings."
      zh: "多数人觉得期末简单，和练习材料很像；有位近期同学说考了长篇阅读里很细的内容。"
      zh-TW: "多數人覺得期末簡單，跟練習材料很像；有位近期同學說考了長篇閱讀裡很細的內容。"
      ja: "期末は素直で練習教材に近いという声が多い。最近の1人は長い文献の細かい部分が出たという。"
      ko: "기말은 대체로 쉽고 연습 자료와 비슷했다고 한다. 최근 한 명은 긴 읽기 자료의 지엽적인 부분이 나왔다고 한다."
      vi: "Đa số thấy bài thi đơn giản, giống tài liệu luyện tập; một người gần đây nói có hỏi chi tiết nhỏ trong các bài đọc dài."
      ms: "Kebanyakan rasa peperiksaan mudah dan hampir sama dengan bahan latihan; seorang pengulas terkini kata ia menguji butiran kecil dari bacaan panjang."
      id: "Kebanyakan merasa ujiannya lugas dan mirip bahan latihan; satu pengulas terbaru bilang ada detail kecil dari bacaan panjang."
      hi: "ज़्यादातर को परीक्षा सीधी और प्रैक्टिस सामग्री जैसी लगी; एक हालिया रिव्यूअर के अनुसार लंबी रीडिंग्स की बारीक बातें पूछी गईं।"
  study:
    - en: "Address every part of the rubric in the assignment, do the research participation credit for easy marks, and write your own PeerWise questions for revision."
      zh: "作业要逐条回应评分标准；研究参与学分（REP）一定要做，白送的分；复习时自己出 PeerWise 题更有用。"
      zh-TW: "作業要逐條回應評分標準；研究參與學分（REP）一定要做，白送的分；複習時自己出 PeerWise 題更有用。"
      ja: "課題はルーブリックの全項目に対応する。研究参加単位（REP）は簡単な点なので必ずやる。復習ではPeerWiseの問題を自分で作ると効果的。"
      ko: "과제는 루브릭 항목을 빠짐없이 다뤄라. 연구 참여 학점(REP)은 공짜 점수니 꼭 해라. 복습 땐 PeerWise 문제를 직접 만들어 보는 게 도움이 된다."
      vi: "Đáp ứng mọi mục trong tiêu chí chấm, làm tín chỉ tham gia nghiên cứu (REP) để lấy điểm dễ, và tự ra câu hỏi PeerWise để ôn."
      ms: "Jawab setiap bahagian rubrik dalam tugasan, buat kredit penyertaan penyelidikan (REP) untuk markah mudah, dan tulis soalan PeerWise sendiri untuk ulang kaji."
      id: "Penuhi setiap bagian rubrik di tugas, ikuti kredit partisipasi riset (REP) untuk nilai gampang, dan buat soal PeerWise sendiri untuk belajar."
      hi: "असाइनमेंट में रूब्रिक के हर हिस्से को कवर करें, आसान अंकों के लिए रिसर्च पार्टिसिपेशन क्रेडिट (REP) करें, और दोहराने के लिए अपने PeerWise सवाल लिखें।"
  watch:
    - en: "Most call it an easy H1, but one reviewer warns it isn't a WAM booster if the humanities side of psych doesn't interest you."
      zh: "多数人说很容易拿 H1，但有人提醒：如果对心理学偏人文的一面没兴趣，它就不算刷分课。"
      zh-TW: "多數人說很容易拿 H1，但有人提醒：如果對心理學偏人文的一面沒興趣，它就不算拉分課。"
      ja: "簡単にH1が取れるという声が多いが、心理学の人文的な面に興味がなければWAMは稼げないという人も。"
      ko: "대부분 H1 받기 쉽다고 하지만, 심리학의 인문적 측면에 관심이 없으면 WAM 부스터가 아니라는 경고도 있다."
      vi: "Đa số nói dễ đạt H1, nhưng một người cảnh báo đây không phải môn kéo WAM nếu bạn không thích mặt nhân văn của tâm lý học."
      ms: "Kebanyakan kata H1 mudah, tetapi seorang pengulas beri amaran ia bukan penaik WAM jika anda tidak berminat dengan sisi kemanusiaan psikologi."
      id: "Kebanyakan bilang H1 mudah, tapi satu pengulas mengingatkan ini bukan pendongkrak WAM kalau tidak tertarik sisi humaniora psikologi."
      hi: "ज़्यादातर इसे आसान H1 कहते हैं, पर एक रिव्यूअर चेताता है कि अगर मनोविज्ञान के मानविकी पक्ष में रुचि नहीं तो यह WAM बूस्टर नहीं।"
difficulty: easy
