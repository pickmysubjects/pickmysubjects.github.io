points:
  - en: "Recent reviews say early assessments are easy to score well on, so mainly the final essay needs effort; good as a filler."
    zh: "近期评价称前期考核容易拿高分，主要精力放在期末论文上，适合凑学分。"
  - en: "Opinions on marking are split: some 2019 and 2021 reviewers found it harsh with unclear expectations."
    zh: "对评分看法不一：2019和2021年有人认为评分严格、要求不清晰。"
  - en: "Content is broad and fairly basic for third year; lectures were seen as of limited use for the assessments."
    zh: "内容宽泛，对三年级来说偏基础；讲课对作业帮助有限。"
  - en: "Tutorials include presentations on readings. Check the readings before choosing your week, and pick a case study you like."
    zh: "辅导课要就阅读做展示，选周次前先看看阅读材料，并选自己感兴趣的案例。"
