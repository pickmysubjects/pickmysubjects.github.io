reviews: 10
from: 2016
to: 2025
checked: 2026-10-08
points:
  - en: "Recent reviews say early assessments are easy to score well on, so mainly the final essay needs effort; good as a filler."
    zh: "近期评价称前期考核容易拿高分，主要精力放在期末论文上，适合凑学分。"
    zh-TW: "近期評論說前期考核很容易拿高分，主要是期末論文要下功夫；適合湊學分。"
    ja: "最近の口コミでは前半の評価は高得点を取りやすく、努力が要るのは主に期末エッセイ。穴埋め科目に良い。"
    ko: "최근 후기에 따르면 초반 평가는 점수 받기 쉬워 주로 기말 에세이에만 공을 들이면 되며, 채우기용으로 좋음."
    vi: "Đánh giá gần đây nói các bài đầu dễ đạt điểm cao, chủ yếu chỉ bài luận cuối cần đầu tư; hợp làm môn lấp chỗ."
    ms: "Ulasan terkini kata penilaian awal mudah dapat markah baik, jadi hanya esei akhir perlu usaha; bagus sebagai pengisi."
    id: "Ulasan terbaru bilang penilaian awal mudah dapat nilai bagus, jadi terutama esai akhir yang butuh usaha; cocok sebagai pengisi."
    hi: "हाल के रिव्यू कहते हैं शुरुआती असेसमेंट में अच्छे मार्क्स आसानी से मिलते हैं, मेहनत मुख्य रूप से फ़ाइनल निबंध में चाहिए; फ़िलर के रूप में अच्छा।"
  - en: "Opinions on marking are split: some 2019 and 2021 reviewers found it harsh with unclear expectations."
    zh: "对评分看法不一：2019和2021年有人认为评分严格、要求不清晰。"
    zh-TW: "對評分看法不一：2019和2021年有些評論者覺得評分嚴、要求不清楚。"
    ja: "採点の評価は分かれる。2019年と2021年の口コミには、厳しく期待が不明確だったという声も。"
    ko: "채점에 대한 의견은 갈리며, 2019년과 2021년 일부 후기는 엄격하고 기대치가 불명확했다고 함."
    vi: "Ý kiến về chấm điểm trái chiều: một số đánh giá 2019 và 2021 thấy chấm gắt và yêu cầu không rõ."
    ms: "Pendapat tentang pemarkahan berbelah bahagi: sesetengah pengulas 2019 dan 2021 rasa ia ketat dengan jangkaan tidak jelas."
    id: "Pendapat soal penilaian terbelah: beberapa pengulas 2019 dan 2021 merasa ketat dengan ekspektasi tidak jelas."
    hi: "मार्किंग पर राय बँटी है: 2019 और 2021 के कुछ रिव्यूअर को यह सख़्त और अस्पष्ट उम्मीदों वाली लगी।"
  - en: "Content is broad and fairly basic for third year; lectures were seen as of limited use for the assessments."
    zh: "内容宽泛，对三年级来说偏基础；讲课对作业帮助有限。"
    zh-TW: "內容廣泛，對三年級來說偏基礎；講課被認為對考核幫助有限。"
    ja: "内容は幅広く3年次としてはかなり基礎的。講義は評価にはあまり役立たないとされる。"
    ko: "내용이 넓고 3학년치고는 꽤 기초적이며, 강의는 평가에 별 도움이 안 된다는 평."
    vi: "Nội dung rộng và khá cơ bản cho năm ba; bài giảng được cho là ít giúp ích cho bài đánh giá."
    ms: "Kandungan luas dan agak asas untuk tahun tiga; kuliah dilihat kurang berguna untuk penilaian."
    id: "Materi luas dan cukup dasar untuk tahun ketiga; kuliah dianggap kurang membantu penilaian."
    hi: "कंटेंट चौड़ा और थर्ड ईयर के हिसाब से काफ़ी बेसिक है; लेक्चर असेसमेंट के लिए कम काम के माने गए।"
  - en: "Tutorials include presentations on readings. Check the readings before choosing your week, and pick a case study you like."
    zh: "辅导课要就阅读做展示，选周次前先看看阅读材料，并选自己感兴趣的案例。"
    zh-TW: "小組討論課要針對閱讀做報告。選週次前先看閱讀資料，並挑自己喜歡的案例。"
    ja: "チュートリアルにはリーディングの発表がある。担当週を選ぶ前にリーディングを確認し、好きなケーススタディを選ぼう。"
    ko: "튜토리얼에 읽기 자료 발표가 있으니, 주차를 고르기 전에 자료를 확인하고 마음에 드는 사례를 고르세요."
    vi: "Tutorial có thuyết trình về bài đọc. Hãy xem bài đọc trước khi chọn tuần, và chọn tình huống bạn thích."
    ms: "Tutorial termasuk pembentangan bacaan. Semak bacaan sebelum pilih minggu anda, dan pilih kajian kes yang anda suka."
    id: "Tutorial mencakup presentasi bacaan. Cek bacaan sebelum memilih minggu, dan pilih studi kasus yang kamu suka."
    hi: "ट्यूटोरियल में रीडिंग पर प्रेज़ेंटेशन होते हैं। अपना हफ़्ता चुनने से पहले रीडिंग देख लें, और अपनी पसंद की केस स्टडी चुनें।"
sections:
  content:
    - en: "A broad mix of disaster topics with an urban focus, starting from the basics of risk, vulnerability and resilience. No background needed; some found it eye-opening, others basic and repetitive for third year."
      zh: "灾害相关话题的大杂烩，偏城市，从风险、脆弱性、韧性的基础讲起。不需要背景；有人觉得大开眼界，也有人觉得作为三年级课太基础、重复。"
      zh-TW: "災害相關主題的大雜燴，偏城市，從風險、脆弱性、韌性的基礎講起。不需要背景；有人覺得大開眼界，也有人覺得作為三年級課太基礎、重複。"
      ja: "都市に重点を置いた災害関連の幅広い寄せ集めで、リスク・脆弱性・レジリエンスの基礎から始まる。予備知識不要。目からうろこという人も、3年次にしては基礎的で繰り返しが多いという人も。"
      ko: "도시에 초점을 둔 재난 관련 주제 모음으로, 위험·취약성·회복력의 기초부터 시작한다. 배경지식 불필요. 눈이 뜨였다는 사람도, 3학년 과목치고 기초적이고 반복적이라는 사람도 있다."
      vi: "Tập hợp rộng các chủ đề thảm họa, nghiêng về đô thị, bắt đầu từ cơ bản về rủi ro, tính dễ tổn thương và khả năng chống chịu. Không cần nền; có người thấy mở mang, người khác thấy quá cơ bản, lặp lại so với năm ba."
      ms: "Campuran luas topik bencana dengan fokus bandar, bermula dari asas risiko, kerentanan dan daya tahan. Tiada latar diperlukan; ada yang rasa membuka mata, ada yang rasa asas dan berulang untuk tahun tiga."
      id: "Campuran luas topik bencana dengan fokus perkotaan, dimulai dari dasar risiko, kerentanan, dan ketahanan. Tak perlu latar; ada yang merasa membuka wawasan, ada yang merasa terlalu dasar dan berulang untuk tahun ketiga."
      hi: "शहरी फ़ोकस के साथ आपदा विषयों का व्यापक मिश्रण, जोखिम, असुरक्षा और लचीलेपन की बुनियाद से शुरू। पृष्ठभूमि ज़रूरी नहीं; कुछ को आँखें खोलने वाला लगा, कुछ को तीसरे साल के लिए बुनियादी और दोहराव भरा।"
  work:
    - en: "Tutorial presentations on readings, participation marks and a final case-study essay. Views on marking split: one recent reviewer found it a WAM booster, while others found expectations vague and marking harsh."
      zh: "tutorial 上做阅读展示、有参与分，最后是案例研究 essay。改分看法分歧：一位近期同学觉得是拉 WAM 的课，也有人觉得要求含糊、改分严。"
      zh-TW: "tutorial 上做閱讀報告、有參與分，最後是個案研究 essay。給分看法分歧：一位近期同學覺得是拉 WAM 的課，也有人覺得要求含糊、給分嚴。"
      ja: "文献についてのチュートリアル発表、参加点、最終のケーススタディエッセイ。採点の評価は割れ、最近の一人はWAMを上げられたと言うが、期待があいまいで採点が厳しいという声も。"
      ko: "읽기 자료 튜토리얼 발표, 참여 점수, 마지막 사례 연구 에세이. 채점 평가는 갈려, 최근 한 리뷰어는 WAM을 올려줬다고 하지만 요구가 모호하고 채점이 가혹하다는 사람도 있다."
      vi: "Thuyết trình bài đọc trong tutorial, điểm tham gia và bài luận nghiên cứu tình huống cuối kỳ. Ý kiến về chấm điểm chia rẽ: một người gần đây thấy kéo WAM tốt, người khác thấy yêu cầu mơ hồ và chấm gắt."
      ms: "Pembentangan bacaan dalam tutorial, markah penyertaan dan esei kajian kes akhir. Pandangan tentang pemarkahan berbelah: seorang pengulas terkini rasa ia penaik WAM, yang lain rasa jangkaan kabur dan pemarkahan keras."
      id: "Presentasi bacaan di tutorial, nilai partisipasi, dan esai studi kasus akhir. Pendapat soal penilaian terbelah: satu reviewer terbaru merasa ini pendongkrak WAM, yang lain merasa ekspektasinya kabur dan penilaiannya keras."
      hi: "रीडिंग पर ट्यूटोरियल प्रेज़ेंटेशन, भागीदारी अंक और अंतिम केस-स्टडी निबंध। मार्किंग पर राय बँटी: एक हालिया रिव्यूअर को यह WAM बूस्टर लगा, दूसरों को अपेक्षाएँ अस्पष्ट और मार्किंग सख़्त लगी।"
  study:
    - en: "Pick a case study you're genuinely interested in for the final essay, and skim the readings before signing up for a presentation week since some are easier than others."
      zh: "期末 essay 选一个你真正感兴趣的案例；报名展示周之前先扫一下阅读，有的比别的好做。"
      zh-TW: "期末 essay 選一個你真正有興趣的個案；報名報告週之前先瀏覽一下閱讀，有的比較好做。"
      ja: "最終エッセイには本当に興味のある事例を選ぼう。発表週を申し込む前に文献をざっと見ておくこと。難易度に差がある。"
      ko: "마지막 에세이는 정말 관심 있는 사례를 고르자. 발표 주를 신청하기 전에 읽기 자료를 훑어보자. 쉬운 것과 어려운 것이 있다."
      vi: "Chọn tình huống bạn thật sự quan tâm cho bài luận cuối, và lướt qua bài đọc trước khi đăng ký tuần thuyết trình vì có bài dễ hơn."
      ms: "Pilih kajian kes yang anda benar-benar minat untuk esei akhir, dan imbas bacaan sebelum daftar minggu pembentangan kerana ada yang lebih mudah."
      id: "Pilih studi kasus yang benar-benar kamu minati untuk esai akhir, dan baca sekilas bacaannya sebelum mendaftar minggu presentasi karena ada yang lebih mudah."
      hi: "अंतिम निबंध के लिए ऐसा केस चुनें जिसमें सच में रुचि हो, और प्रेज़ेंटेशन हफ़्ता चुनने से पहले रीडिंग देख लें, कुछ आसान होती हैं।"
  watch:
    - en: "Several reviewers felt lectures and tutorials added little to the assignments, and that many students take it as a filler."
      zh: "好几位同学觉得 lecture 和 tutorial 对作业帮助不大，很多人是拿它来凑学分的。"
      zh-TW: "好幾位同學覺得 lecture 和 tutorial 對作業幫助不大，很多人是拿它來湊學分的。"
      ja: "講義やチュートリアルは課題にあまり役立たず、穴埋めで取る人が多いと感じた人が複数。"
      ko: "강의와 튜토리얼이 과제에 별 도움이 안 되고, 많은 학생이 빈칸 채우기로 듣는다는 리뷰가 여럿."
      vi: "Vài người thấy bài giảng và tutorial ít giúp cho bài tập, và nhiều sinh viên học chỉ để lấp chỗ trống."
      ms: "Beberapa pengulas rasa kuliah dan tutorial kurang membantu tugasan, dan ramai ambil sebagai pengisi."
      id: "Beberapa reviewer merasa kuliah dan tutorial kurang membantu tugas, dan banyak yang mengambilnya sebagai pengisi."
      hi: "कई रिव्यूअर्स को लगा लेक्चर और ट्यूटोरियल असाइनमेंट में कम मदद करते हैं, और कई छात्र इसे खाली जगह भरने के लिए लेते हैं।"
workload: light
difficulty: easy
