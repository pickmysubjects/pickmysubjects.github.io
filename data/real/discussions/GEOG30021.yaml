points:
  - en: "Recent reviews say early assessments are easy to score well on, so mainly the final essay needs effort; good as a filler."
    zh: "近期评价称前期考核容易拿高分，主要精力放在期末论文上，适合凑学分。"
    zh-TW: "近期評論說前期考核很容易拿高分，主要是期末論文要下功夫；適合湊學分。"
    ja: "最近の口コミでは前半の評価は高得点を取りやすく、努力が要るのは主に期末エッセイ。穴埋め科目に良い。"
    ko: "최근 후기에 따르면 초반 평가는 점수 받기 쉬워 주로 기말 에세이에만 공을 들이면 되며, 채우기용으로 좋음."
    vi: "Đánh giá gần đây nói các bài đầu dễ đạt điểm cao, chủ yếu chỉ bài luận cuối cần đầu tư; hợp làm môn lấp chỗ."
    ms: "Ulasan terkini kata penilaian awal mudah dapat markah baik, jadi hanya esei akhir perlu usaha; bagus sebagai pengisi."
    id: "Ulasan terbaru bilang penilaian awal mudah dapat nilai bagus, jadi terutama esai akhir yang butuh usaha; cocok sebagai pengisi."
    hi: "हाल के रिव्यू कहते हैं शुरुआती असेसमेंट में अच्छे मार्क्स आसानी से मिलते हैं, मेहनत मुख्य रूप से फ़ाइनल निबंध में चाहिए; फ़िलर के रूप में अच्छा।"
  - en: "Opinions on marking are split: some 2019 and 2021 reviewers found it harsh with unclear expectations."
    zh: "对评分看法不一：2019和2021年有人认为评分严格、要求不清晰。"
    zh-TW: "對評分看法不一：2019和2021年有些評論者覺得評分嚴、要求不清楚。"
    ja: "採点の評価は分かれる。2019年と2021年の口コミには、厳しく期待が不明確だったという声も。"
    ko: "채점에 대한 의견은 갈리며, 2019년과 2021년 일부 후기는 엄격하고 기대치가 불명확했다고 함."
    vi: "Ý kiến về chấm điểm trái chiều: một số đánh giá 2019 và 2021 thấy chấm gắt và yêu cầu không rõ."
    ms: "Pendapat tentang pemarkahan berbelah bahagi: sesetengah pengulas 2019 dan 2021 rasa ia ketat dengan jangkaan tidak jelas."
    id: "Pendapat soal penilaian terbelah: beberapa pengulas 2019 dan 2021 merasa ketat dengan ekspektasi tidak jelas."
    hi: "मार्किंग पर राय बँटी है: 2019 और 2021 के कुछ रिव्यूअर को यह सख़्त और अस्पष्ट उम्मीदों वाली लगी।"
  - en: "Content is broad and fairly basic for third year; lectures were seen as of limited use for the assessments."
    zh: "内容宽泛，对三年级来说偏基础；讲课对作业帮助有限。"
    zh-TW: "內容廣泛，對三年級來說偏基礎；講課被認為對考核幫助有限。"
    ja: "内容は幅広く3年次としてはかなり基礎的。講義は評価にはあまり役立たないとされる。"
    ko: "내용이 넓고 3학년치고는 꽤 기초적이며, 강의는 평가에 별 도움이 안 된다는 평."
    vi: "Nội dung rộng và khá cơ bản cho năm ba; bài giảng được cho là ít giúp ích cho bài đánh giá."
    ms: "Kandungan luas dan agak asas untuk tahun tiga; kuliah dilihat kurang berguna untuk penilaian."
    id: "Materi luas dan cukup dasar untuk tahun ketiga; kuliah dianggap kurang membantu penilaian."
    hi: "कंटेंट चौड़ा और थर्ड ईयर के हिसाब से काफ़ी बेसिक है; लेक्चर असेसमेंट के लिए कम काम के माने गए।"
  - en: "Tutorials include presentations on readings. Check the readings before choosing your week, and pick a case study you like."
    zh: "辅导课要就阅读做展示，选周次前先看看阅读材料，并选自己感兴趣的案例。"
    zh-TW: "小組討論課要針對閱讀做報告。選週次前先看閱讀資料，並挑自己喜歡的案例。"
    ja: "チュートリアルにはリーディングの発表がある。担当週を選ぶ前にリーディングを確認し、好きなケーススタディを選ぼう。"
    ko: "튜토리얼에 읽기 자료 발표가 있으니, 주차를 고르기 전에 자료를 확인하고 마음에 드는 사례를 고르세요."
    vi: "Tutorial có thuyết trình về bài đọc. Hãy xem bài đọc trước khi chọn tuần, và chọn tình huống bạn thích."
    ms: "Tutorial termasuk pembentangan bacaan. Semak bacaan sebelum pilih minggu anda, dan pilih kajian kes yang anda suka."
    id: "Tutorial mencakup presentasi bacaan. Cek bacaan sebelum memilih minggu, dan pilih studi kasus yang kamu suka."
    hi: "ट्यूटोरियल में रीडिंग पर प्रेज़ेंटेशन होते हैं। अपना हफ़्ता चुनने से पहले रीडिंग देख लें, और अपनी पसंद की केस स्टडी चुनें।"
workload: light
difficulty: easy
