points:
  - en: "Needs steady weekly practice (tutorial, textbook and past-exam questions); topics build on each other, so don't cram in SWOTVAC."
    zh: "需要每周持续练习（辅导课、课本和往年试题）；内容层层递进，别留到复习周临时抱佛脚。"
    zh-TW: "需要每週持續練習（輔導課、課本和考古題）；內容層層遞進，別留到複習週臨時抱佛腳。"
    ja: "毎週コツコツ演習が必要（チュートリアル、教科書、過去問）。内容が積み重なるので、試験前の復習期間に詰め込まないこと。"
    ko: "매주 꾸준한 연습 필요(튜토리얼, 교재, 기출문제). 내용이 이어지므로 시험 전 복습 기간에 몰아서 하지 말 것."
    vi: "Cần luyện đều mỗi tuần (bài tutorial, giáo trình, đề cũ); kiến thức nối tiếp nhau nên đừng dồn học vào tuần ôn thi."
    ms: "Perlu latihan mingguan yang konsisten (tutorial, buku teks, soalan peperiksaan lepas); topik bersambung, jadi jangan tunggu minggu ulang kaji."
    id: "Butuh latihan rutin tiap minggu (tutorial, buku teks, soal ujian lama); topiknya bersambung, jadi jangan SKS di minggu tenang."
    hi: "हर हफ़्ते लगातार प्रैक्टिस चाहिए (ट्यूटोरियल, किताब, पुराने पेपर); टॉपिक एक-दूसरे पर टिके हैं, तो रिवीज़न वीक में रटना मत।"
  - en: "Workload is a step up from ACCT10001, with a strong focus on journal entries and T-accounts."
    zh: "工作量比ACCT10001明显增加，重点是会计分录和T型账户。"
    zh-TW: "工作量比ACCT10001明顯增加，重點是會計分錄和T字帳。"
    ja: "ACCT10001より負担が一段上がり、仕訳とT勘定が中心。"
    ko: "ACCT10001보다 업무량이 한 단계 높고, 분개와 T계정에 집중."
    vi: "Khối lượng nặng hơn ACCT10001, tập trung nhiều vào bút toán và tài khoản chữ T."
    ms: "Beban kerja meningkat daripada ACCT10001, dengan fokus kuat pada catatan jurnal dan akaun-T."
    id: "Beban kerja naik dari ACCT10001, dengan fokus kuat pada jurnal dan akun-T."
    hi: "ACCT10001 से ज़्यादा वर्कलोड, जर्नल एंट्री और T-अकाउंट पर खास ध्यान।"
  - en: "Assignments take real effort while quizzes are easy; exams are moderate and past papers are good preparation."
    zh: "作业需要花不少功夫，小测较简单；考试难度中等，做往年试卷是很好的准备。"
    zh-TW: "作業要花不少功夫，小考則簡單；考試難度中等，做考古題是很好的準備。"
    ja: "課題はかなり手間がかかるが小テストは簡単。試験は普通程度で、過去問がよい対策になる。"
    ko: "과제는 꽤 노력이 들지만 퀴즈는 쉬움. 시험은 보통 수준이고 기출문제가 좋은 대비가 됨."
    vi: "Bài tập tốn công thật sự, còn quiz thì dễ; đề thi mức trung bình và làm đề cũ là cách ôn tốt."
    ms: "Tugasan perlukan usaha sebenar, kuiz mudah; peperiksaan sederhana dan kertas lepas ialah persediaan baik."
    id: "Tugas butuh usaha serius, kuis mudah; ujian sedang dan soal lama jadi persiapan yang bagus."
    hi: "असाइनमेंट में अच्छी मेहनत लगती है, क्विज़ आसान हैं; एग्ज़ाम मध्यम हैं और पुराने पेपर अच्छी तैयारी हैं।"
  - en: "Most found it a well-organised intro and doable without high-school accounting. Note that all reviews date from 2017-2018."
    zh: "多数人认为这是组织良好的入门课，没学过高中会计也能跟上。注意所有评价都来自2017-2018年。"
    zh-TW: "多數人覺得這是組織良好的入門課，高中沒學過會計也跟得上。注意所有評價都來自2017-2018年。"
    ja: "多くの人がよく構成された入門科目で、高校で会計を学んでいなくてもついていけると評価。なお、レビューはすべて2017-2018年のもの。"
    ko: "대부분 잘 짜인 입문 과목이며 고등학교 회계 없이도 할 만하다고 봄. 단, 모든 리뷰가 2017-2018년 것임."
    vi: "Đa số thấy đây là môn nhập môn được tổ chức tốt, không học kế toán cấp ba vẫn theo được. Lưu ý mọi đánh giá đều từ 2017-2018."
    ms: "Kebanyakan dapati ia pengenalan yang teratur dan boleh diikuti tanpa perakaunan sekolah menengah. Semua ulasan dari 2017-2018."
    id: "Mayoritas menilai ini pengantar yang tertata dan bisa diikuti tanpa akuntansi SMA. Catatan: semua ulasan dari 2017-2018."
    hi: "ज़्यादातर को यह अच्छी तरह व्यवस्थित इंट्रो लगा, स्कूल अकाउंटिंग के बिना भी संभव। ध्यान दें: सभी रिव्यू 2017-2018 के हैं।"
difficulty: easy
