code: ACCT10002
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/acct10002
reviews: 10
from: 2017
to: 2018
checked: 2026-10-08
points:
  - en: "Needs steady weekly practice (tutorial, textbook and past-exam questions); topics build on each other, so don't cram in SWOTVAC."
    zh: "需要每周持续练习（辅导课、课本和往年试题）；内容层层递进，别留到复习周临时抱佛脚。"
    zh-TW: "需要每週持續練習（輔導課、課本和考古題）；內容層層遞進，別留到複習週臨時抱佛腳。"
    ja: "毎週コツコツ演習が必要（チュートリアル、教科書、過去問）。内容が積み重なるので、試験前の復習期間に詰め込まないこと。"
    ko: "매주 꾸준한 연습 필요(튜토리얼, 교재, 기출문제). 내용이 이어지므로 시험 전 복습 기간에 몰아서 하지 말 것."
    vi: "Cần luyện đều mỗi tuần (bài tutorial, giáo trình, đề cũ); kiến thức nối tiếp nhau nên đừng dồn học vào tuần ôn thi."
    ms: "Perlu latihan mingguan yang konsisten (tutorial, buku teks, soalan peperiksaan lepas); topik bersambung, jadi jangan tunggu minggu ulang kaji."
    id: "Butuh latihan rutin tiap minggu (tutorial, buku teks, soal ujian lama); topiknya bersambung, jadi jangan SKS di minggu tenang."
    hi: "हर हफ़्ते लगातार प्रैक्टिस चाहिए (ट्यूटोरियल, किताब, पुराने पेपर); टॉपिक एक-दूसरे पर टिके हैं, तो रिवीज़न वीक में रटना मत।"
  - en: "Workload is a step up from ACCT10001, with a strong focus on journal entries and T-accounts."
    zh: "工作量比ACCT10001明显增加，重点是会计分录和T型账户。"
    zh-TW: "工作量比ACCT10001明顯增加，重點是會計分錄和T字帳。"
    ja: "ACCT10001より負担が一段上がり、仕訳とT勘定が中心。"
    ko: "ACCT10001보다 업무량이 한 단계 높고, 분개와 T계정에 집중."
    vi: "Khối lượng nặng hơn ACCT10001, tập trung nhiều vào bút toán và tài khoản chữ T."
    ms: "Beban kerja meningkat daripada ACCT10001, dengan fokus kuat pada catatan jurnal dan akaun-T."
    id: "Beban kerja naik dari ACCT10001, dengan fokus kuat pada jurnal dan akun-T."
    hi: "ACCT10001 से ज़्यादा वर्कलोड, जर्नल एंट्री और T-अकाउंट पर खास ध्यान।"
  - en: "Assignments take real effort while quizzes are easy; exams are moderate and past papers are good preparation."
    zh: "作业需要花不少功夫，小测较简单；考试难度中等，做往年试卷是很好的准备。"
    zh-TW: "作業要花不少功夫，小考則簡單；考試難度中等，做考古題是很好的準備。"
    ja: "課題はかなり手間がかかるが小テストは簡単。試験は普通程度で、過去問がよい対策になる。"
    ko: "과제는 꽤 노력이 들지만 퀴즈는 쉬움. 시험은 보통 수준이고 기출문제가 좋은 대비가 됨."
    vi: "Bài tập tốn công thật sự, còn quiz thì dễ; đề thi mức trung bình và làm đề cũ là cách ôn tốt."
    ms: "Tugasan perlukan usaha sebenar, kuiz mudah; peperiksaan sederhana dan kertas lepas ialah persediaan baik."
    id: "Tugas butuh usaha serius, kuis mudah; ujian sedang dan soal lama jadi persiapan yang bagus."
    hi: "असाइनमेंट में अच्छी मेहनत लगती है, क्विज़ आसान हैं; एग्ज़ाम मध्यम हैं और पुराने पेपर अच्छी तैयारी हैं।"
  - en: "Most found it a well-organised intro and doable without high-school accounting. Note that all reviews date from 2017-2018."
    zh: "多数人认为这是组织良好的入门课，没学过高中会计也能跟上。注意所有评价都来自2017-2018年。"
    zh-TW: "多數人覺得這是組織良好的入門課，高中沒學過會計也跟得上。注意所有評價都來自2017-2018年。"
    ja: "多くの人がよく構成された入門科目で、高校で会計を学んでいなくてもついていけると評価。なお、レビューはすべて2017-2018年のもの。"
    ko: "대부분 잘 짜인 입문 과목이며 고등학교 회계 없이도 할 만하다고 봄. 단, 모든 리뷰가 2017-2018년 것임."
    vi: "Đa số thấy đây là môn nhập môn được tổ chức tốt, không học kế toán cấp ba vẫn theo được. Lưu ý mọi đánh giá đều từ 2017-2018."
    ms: "Kebanyakan dapati ia pengenalan yang teratur dan boleh diikuti tanpa perakaunan sekolah menengah. Semua ulasan dari 2017-2018."
    id: "Mayoritas menilai ini pengantar yang tertata dan bisa diikuti tanpa akuntansi SMA. Catatan: semua ulasan dari 2017-2018."
    hi: "ज़्यादातर को यह अच्छी तरह व्यवस्थित इंट्रो लगा, स्कूल अकाउंटिंग के बिना भी संभव। ध्यान दें: सभी रिव्यू 2017-2018 के हैं।"
sections:
  content:
    - en: "A good intro to financial accounting that goes deeper than ARA into T-accounts and journal entries. Reviewers without high school accounting still managed."
      zh: "财务会计的不错入门，比 ARA 更深入讲 T 型账户和分录。高中没学过会计的同学也能跟上。"
      zh-TW: "財務會計的不錯入門，比 ARA 更深入講 T 字帳和分錄。高中沒學過會計的同學也跟得上。"
      ja: "財務会計の良い入門で、ARAよりT勘定や仕訳を深く扱う。高校で会計をやっていなくても何とかなったという声。"
      ko: "재무회계의 좋은 입문으로 ARA보다 T계정과 분개를 깊이 다룬다. 고교 회계를 안 해도 따라갔다는 평이다."
      vi: "Nhập môn kế toán tài chính tốt, đi sâu hơn ARA vào tài khoản chữ T và bút toán. Người chưa học kế toán ở phổ thông vẫn theo được."
      ms: "Pengenalan perakaunan kewangan yang baik, lebih mendalam daripada ARA tentang akaun-T dan catatan jurnal. Pengulas tanpa perakaunan sekolah tetap boleh ikut."
      id: "Pengantar akuntansi keuangan yang bagus, lebih dalam dari ARA soal akun T dan jurnal. Pengulas tanpa akuntansi SMA tetap bisa mengikuti."
      hi: "फ़ाइनेंशियल अकाउंटिंग का अच्छा परिचय, जो ARA से ज़्यादा T-अकाउंट और जर्नल एंट्री में जाता है। स्कूल में अकाउंटिंग न पढ़ने वाले भी संभाल पाए।"
  work:
    - en: "Two assignments and two quizzes plus the exam. Quizzes are easy; assignments take more time. One reviewer found the exam harder than expected."
      zh: "两个作业、两个小测加期末。小测简单，作业更花时间。有同学觉得考试比预想的难。"
      zh-TW: "兩份作業、兩次小考加期末。小考簡單，作業較花時間。有同學覺得考試比預期難。"
      ja: "課題2つ、小テスト2回、期末試験。小テストは簡単で課題は時間がかかる。試験は予想より難しかったという声も一つ。"
      ko: "과제 2개, 퀴즈 2회와 시험. 퀴즈는 쉽고 과제는 시간이 더 든다. 시험이 예상보다 어려웠다는 리뷰어도 있다."
      vi: "Hai bài tập, hai quiz và bài thi. Quiz dễ; bài tập tốn thời gian hơn. Một người thấy bài thi khó hơn dự đoán."
      ms: "Dua tugasan dan dua kuiz serta peperiksaan. Kuiz mudah; tugasan ambil masa lebih. Seorang pengulas rasa peperiksaan lebih sukar daripada jangkaan."
      id: "Dua tugas dan dua kuis plus ujian. Kuis mudah; tugas lebih makan waktu. Satu pengulas merasa ujiannya lebih sulit dari perkiraan."
      hi: "दो असाइनमेंट, दो क्विज़ और परीक्षा। क्विज़ आसान हैं; असाइनमेंट में ज़्यादा समय लगता है। एक रिव्यूअर को परीक्षा उम्मीद से कठिन लगी।"
  study:
    - en: "Practise every week with tutorial and textbook questions and past exams, since each week builds on the last; reviewers warn against cramming in SWOTVAC."
      zh: "每周都练 tutorial 题、课本题和往年考题，因为每周内容层层递进；同学提醒别留到 SWOTVAC 才突击。"
      zh-TW: "每週都練 tutorial 題、課本題和考古題，因為每週內容層層堆疊；同學提醒別留到 SWOTVAC 才衝刺。"
      ja: "毎週チュートリアル、教科書の問題、過去問で練習を。内容が積み上がるので、SWOTVACで詰め込むなという声。"
      ko: "매주 튜토리얼, 교재 문제, 기출로 연습하라. 내용이 쌓이는 구조라 SWOTVAC에 몰아서 하지 말라고 한다."
      vi: "Luyện hằng tuần với câu tutorial, sách và đề cũ, vì tuần sau xây trên tuần trước; người học khuyên đừng dồn đến SWOTVAC."
      ms: "Berlatih setiap minggu dengan soalan tutorial, buku teks dan kertas lepas, kerana setiap minggu dibina atas yang sebelumnya; elak sumbat saat SWOTVAC."
      id: "Latihan tiap minggu dengan soal tutorial, buku teks dan ujian lama, karena tiap minggu dibangun di atas minggu sebelumnya; jangan kebut saat SWOTVAC."
      hi: "हर हफ़्ते ट्यूटोरियल, किताब के सवाल और पुराने पेपर से अभ्यास करें, क्योंकि हर हफ़्ता पिछले पर टिका है; रिव्यूअर्स SWOTVAC में रटने से मना करते हैं।"
  watch:
    - en: "All these reviews are from 2018 or earlier; teaching and exams may have changed since."
      zh: "这些评价都是 2018 年或更早的，现在的教法和考试可能已经变了。"
      zh-TW: "這些評價都是 2018 年或更早的，現在的教法和考試可能已經變了。"
      ja: "レビューはすべて2018年以前のもの。授業や試験は変わっている可能性がある。"
      ko: "모든 리뷰가 2018년 이전 것이라 지금 수업과 시험은 달라졌을 수 있다."
      vi: "Tất cả đánh giá đều từ năm 2018 trở về trước; cách dạy và thi có thể đã thay đổi."
      ms: "Semua ulasan ini dari 2018 atau lebih awal; pengajaran dan peperiksaan mungkin telah berubah."
      id: "Semua ulasan ini dari 2018 atau sebelumnya; pengajaran dan ujian mungkin sudah berubah."
      hi: "ये सभी रिव्यू 2018 या उससे पहले के हैं; पढ़ाई और परीक्षा अब बदल चुकी हो सकती है।"
difficulty: easy
