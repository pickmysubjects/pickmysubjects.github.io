points:
  - en: "Problem-solving and application focused rather than rote recall; some concepts are hard to grasp."
    zh: "侧重解题和应用而非死记；部分概念较难理解。"
    zh-TW: "著重解題和應用而不是死背；有些概念比較難理解。"
    ja: "丸暗記より問題解決と応用が中心。理解しにくい概念もある。"
    ko: "암기보다 문제 해결과 응용 중심이며, 일부 개념은 이해하기 어려움."
    vi: "Tập trung giải quyết vấn đề và ứng dụng thay vì học thuộc; một số khái niệm khó nắm."
    ms: "Fokus penyelesaian masalah dan aplikasi, bukan hafalan; sesetengah konsep sukar difahami."
    id: "Fokus pada pemecahan masalah dan penerapan, bukan hafalan; beberapa konsep sulit dipahami."
    hi: "रटने की बजाय प्रॉब्लम-सॉल्विंग और एप्लिकेशन पर ज़ोर; कुछ कॉन्सेप्ट समझना कठिन है।"
  - en: "Earlier reviews complained of poor exam preparation and practice material that did not match exam difficulty."
    zh: "早期评论抱怨备考支持不足，练习题难度与考试不匹配。"
    zh-TW: "早期評論抱怨備考支援不足，練習題難度和考試不相符。"
    ja: "以前の口コミでは試験対策が不十分で、練習教材が試験の難しさと合っていないと不満が出ていた。"
    ko: "예전 후기는 시험 대비가 부실하고 연습 자료가 시험 난이도와 맞지 않는다고 불평함."
    vi: "Đánh giá cũ phàn nàn khâu chuẩn bị thi kém và tài liệu luyện tập không sát độ khó của đề."
    ms: "Ulasan lama mengadu persediaan peperiksaan lemah dan bahan latihan tidak setara kesukaran peperiksaan."
    id: "Ulasan lama mengeluhkan persiapan ujian yang kurang dan bahan latihan yang tidak sesuai tingkat kesulitan ujian."
    hi: "पुराने रिव्यू ने एग्ज़ाम की कमज़ोर तैयारी और ऐसे प्रैक्टिस मटीरियल की शिकायत की जो एग्ज़ाम की कठिनाई से मेल नहीं खाता था।"
  - en: "Recent years (2025-26) are more positive: workshop quizzes give steady marks and solutions are provided."
    zh: "近年（2025-26）评价更正面：研讨课小测可稳定拿分，并提供答案。"
    zh-TW: "近年（2025-26）評價比較正面：工作坊小考可以穩定拿分，也有提供解答。"
    ja: "最近（2025-26）はより好意的。ワークショップの小テストで着実に点が取れ、解答も提供される。"
    ko: "최근(2025-26)에는 더 긍정적: 워크숍 퀴즈로 꾸준히 점수를 얻을 수 있고 해답도 제공됨."
    vi: "Những năm gần đây (2025-26) tích cực hơn: quiz workshop cho điểm đều và có đáp án."
    ms: "Tahun terkini (2025-26) lebih positif: kuiz bengkel beri markah stabil dan jawapan disediakan."
    id: "Tahun-tahun terbaru (2025-26) lebih positif: kuis workshop memberi nilai stabil dan jawaban disediakan."
    hi: "हाल के साल (2025-26) ज़्यादा पॉज़िटिव हैं: वर्कशॉप क्विज़ से लगातार मार्क्स मिलते हैं और सॉल्यूशन दिए जाते हैं।"
  - en: "Attend early workshops on reading DNA annotations, as they matter for the assignment and the exam."
    zh: "务必参加前几次讲解DNA注释的研讨课，对作业和考试都很重要。"
    zh-TW: "前幾次教判讀DNA註解的工作坊一定要去，對作業和考試都很重要。"
    ja: "DNAアノテーションの読み方を扱う初期のワークショップには出席を。課題と試験に重要。"
    ko: "DNA 주석 읽기를 다루는 초반 워크숍에 꼭 참석하세요. 과제와 시험에 중요함."
    vi: "Hãy đi các workshop đầu về đọc chú giải DNA, vì chúng quan trọng cho bài tập và bài thi."
    ms: "Hadiri bengkel awal tentang membaca anotasi DNA, kerana ia penting untuk tugasan dan peperiksaan."
    id: "Hadiri workshop awal tentang membaca anotasi DNA, karena penting untuk tugas dan ujian."
    hi: "DNA एनोटेशन पढ़ने वाली शुरुआती वर्कशॉप में ज़रूर जाएँ, ये असाइनमेंट और एग्ज़ाम दोनों के लिए अहम हैं।"
sections:
  content:
    - en: "Problem-solving and application rather than rote recall. Some topics, like transmission genetics and chromosome rearrangements, can be hard to grasp. Recent reviews are more positive than older ones."
      zh: "重在解题和应用，不是死记。有些主题如遗传传递、染色体重排比较难懂。近几年的评价比早年好。"
      zh-TW: "重在解題和應用，不是死背。有些主題如遺傳傳遞、染色體重排比較難懂。近幾年的評價比早年好。"
      ja: "暗記より問題解決と応用が中心。伝達遺伝学や染色体再編成などは理解しにくいことも。最近のレビューは以前より好意的。"
      ko: "암기보다 문제 해결과 응용 중심. 전달유전학, 염색체 재배열 같은 주제는 이해하기 어려울 수 있다. 최근 리뷰가 예전보다 긍정적이다."
      vi: "Thiên về giải bài và ứng dụng hơn học thuộc. Một số chủ đề như di truyền truyền đạt, sắp xếp lại nhiễm sắc thể khá khó hiểu. Đánh giá gần đây tích cực hơn trước."
      ms: "Penyelesaian masalah dan aplikasi, bukan hafalan. Sesetengah topik seperti genetik transmisi dan penyusunan semula kromosom sukar difahami. Ulasan terkini lebih positif dari dahulu."
      id: "Fokus pada pemecahan masalah dan penerapan, bukan hafalan. Beberapa topik seperti genetika transmisi dan penataan ulang kromosom sulit dipahami. Ulasan terbaru lebih positif dari yang lama."
      hi: "रटने से ज़्यादा प्रॉब्लम सॉल्विंग और एप्लिकेशन। ट्रांसमिशन जेनेटिक्स और क्रोमोसोम रीअरेंजमेंट जैसे कुछ टॉपिक समझना कठिन। हाल के रिव्यू पुराने से ज़्यादा सकारात्मक हैं।"
  work:
    - en: "Workshop quizzes make up a good share of the mark and are manageable if you pay attention. The written assignment uses DNA annotation skills taught in early workshops; one reviewer found the word limit tight."
      zh: "workshop 小测占分不少，认真听就不难。书面作业要用到前几次 workshop 教的 DNA 注释判读；有一位同学觉得字数限制很紧。"
      zh-TW: "workshop 小考占分不少，認真聽就不難。書面作業會用到前幾次 workshop 教的 DNA 註解判讀；有一位同學覺得字數限制很緊。"
      ja: "ワークショップのクイズは配点が大きく、集中して聞けば難しくない。レポート課題は初期のワークショップで習うDNAアノテーションの読み方を使う。字数制限が厳しいと感じた人が一人。"
      ko: "워크숍 퀴즈 비중이 크고 집중하면 어렵지 않다. 서면 과제는 초반 워크숍에서 배우는 DNA 주석 읽기를 쓴다. 단어 제한이 빡빡했다는 리뷰어가 한 명."
      vi: "Quiz workshop chiếm phần điểm đáng kể và dễ nếu chú ý. Bài viết dùng kỹ năng đọc chú giải DNA học ở các workshop đầu; một người thấy giới hạn chữ chật."
      ms: "Kuiz bengkel membentuk bahagian besar markah dan boleh diurus jika beri perhatian. Tugasan bertulis guna kemahiran anotasi DNA dari bengkel awal; seorang rasa had perkataan ketat."
      id: "Kuis workshop porsinya besar dan bisa diatasi jika memperhatikan. Tugas tertulis memakai keterampilan membaca anotasi DNA dari workshop awal; satu reviewer merasa batas katanya ketat."
      hi: "वर्कशॉप क्विज़ अंकों का बड़ा हिस्सा हैं और ध्यान दें तो आसान। लिखित असाइनमेंट शुरुआती वर्कशॉप में सिखाई DNA एनोटेशन पढ़ने की कला पर आधारित है; एक को शब्द सीमा तंग लगी।"
    - en: "The exam focuses on applying ideas to data, some released beforehand, and recent years allowed prepared notes. One reviewer found it very rushed; older reviews say practice material didn't match the exam."
      zh: "考试重在把概念用到数据上，部分数据提前发布，近年允许带准备好的笔记。有一位同学觉得时间很赶；早年评价说练习材料和考试不对应。"
      zh-TW: "考試重在把概念用到資料上，部分資料提前公布，近年允許帶準備好的筆記。有一位同學覺得時間很趕；早年評價說練習材料和考試不對應。"
      ja: "試験はデータへの応用が中心で、一部のデータは事前公開、近年は準備したノートの持ち込み可。とても時間が足りなかった人が一人。古いレビューでは練習教材が試験と合わないと言われていた。"
      ko: "시험은 데이터에 개념을 적용하는 위주이며 일부 데이터는 미리 공개되고, 최근엔 준비한 노트 지참이 허용됐다. 시간이 매우 촉박했다는 리뷰어가 한 명. 예전 리뷰는 연습 자료가 시험과 안 맞았다고 한다."
      vi: "Bài thi tập trung áp dụng vào dữ liệu, một phần được công bố trước, các năm gần đây cho mang ghi chú chuẩn bị sẵn. Một người thấy rất gấp; đánh giá cũ nói tài liệu luyện tập không khớp đề."
      ms: "Peperiksaan tertumpu pada mengaplikasi idea pada data, sebahagiannya dikeluarkan awal, dan tahun-tahun kebelakangan benarkan nota disediakan. Seorang rasa sangat tergesa-gesa; ulasan lama kata bahan latihan tidak sepadan."
      id: "Ujian fokus pada penerapan ke data, sebagian dirilis lebih dulu, dan beberapa tahun terakhir boleh bawa catatan yang disiapkan. Satu reviewer merasa sangat terburu-buru; ulasan lama bilang bahan latihan tak sesuai ujian."
      hi: "परीक्षा डेटा पर विचार लागू करने पर केंद्रित है, कुछ डेटा पहले दिया जाता है, और हाल के सालों में तैयार नोट्स ले जाने की छूट थी। एक को बहुत जल्दबाज़ी लगी; पुराने रिव्यू कहते हैं प्रैक्टिस सामग्री परीक्षा से मेल नहीं खाती थी।"
  study:
    - en: "Go to the early workshops, use the posted workshop and seminar solutions, and know the pre-released data well so you're not slowed down in the exam."
      zh: "前几次 workshop 一定要去，用好发布的 workshop 和 seminar 答案，把提前发布的数据吃透，考试时才不会拖慢。"
      zh-TW: "前幾次 workshop 一定要去，善用公布的 workshop 和 seminar 解答，把事先公布的資料吃透，考試時才不會拖慢。"
      ja: "初期のワークショップには必ず出席し、公開されるワークショップとセミナーの解答を活用。事前公開のデータをよく理解しておけば試験で手間取らない。"
      ko: "초반 워크숍에 꼭 나가고, 공개되는 워크숍·세미나 해답을 활용하자. 미리 공개된 데이터를 잘 알아 두면 시험에서 시간을 아낀다."
      vi: "Đi các workshop đầu, dùng lời giải workshop và seminar được đăng, và nắm kỹ dữ liệu công bố trước để không bị chậm trong phòng thi."
      ms: "Hadir bengkel awal, guna jawapan bengkel dan seminar yang disiarkan, dan kuasai data yang dikeluarkan awal supaya tidak lambat dalam peperiksaan."
      id: "Datang ke workshop awal, manfaatkan solusi workshop dan seminar yang dibagikan, dan kuasai data yang dirilis lebih dulu agar tak lambat saat ujian."
      hi: "शुरुआती वर्कशॉप ज़रूर जाएँ, पोस्ट किए गए वर्कशॉप और सेमिनार हल इस्तेमाल करें, और पहले दिया डेटा अच्छी तरह समझें ताकि परीक्षा में धीमे न पड़ें।"
difficulty: mixed
