points:
  - en: "Many small assignments (about 12 in 2020) that each take time, and in 2020 there were three final exams."
    zh: "小作业很多（2020年约12项），每项都花时间；2020年还有三场期末考试。"
    zh-TW: "小作業很多（2020年約12項），每項都花時間；2020年還有三場期末考試。"
    ja: "小さな課題が多く（2020年は約12個）、どれも時間がかかる。2020年は期末試験が3つあった。"
    ko: "작은 과제가 많고(2020년 약 12개) 각각 시간이 걸림. 2020년엔 기말시험이 3개였음."
    vi: "Nhiều bài tập nhỏ (khoảng 12 bài năm 2020), bài nào cũng tốn thời gian, và năm 2020 có ba bài thi cuối kỳ."
    ms: "Banyak tugasan kecil (kira-kira 12 pada 2020) yang masing-masing makan masa, dan pada 2020 ada tiga peperiksaan akhir."
    id: "Banyak tugas kecil (sekitar 12 di 2020) yang masing-masing makan waktu, dan di 2020 ada tiga ujian akhir."
    hi: "कई छोटे असाइनमेंट (2020 में लगभग 12), हर एक में समय लगता है, और 2020 में तीन फ़ाइनल एग्ज़ाम थे।"
  - en: "By 2021-2022 reviewers found it well organised, with clear tasks and a practice exam, and said H1 is achievable with steady study."
    zh: "到2021-2022年，评论者觉得组织得好，任务清楚，还有模拟考，稳定学习就能拿H1。"
    zh-TW: "到2021-2022年，評論者覺得組織得好，任務清楚，還有模擬考，穩定學習就能拿H1。"
    ja: "2021〜2022年には運営がよく、課題も明確で模擬試験もあり、着実に勉強すればH1も取れるとのこと。"
    ko: "2021~2022년엔 운영이 잘 되고 과제가 명확하며 모의시험도 있어, 꾸준히 공부하면 H1 가능하다는 평."
    vi: "Đến 2021-2022, người đánh giá thấy tổ chức tốt, yêu cầu rõ ràng, có đề thi thử, và học đều là đạt H1."
    ms: "Menjelang 2021-2022 pengulas dapati ia teratur, dengan tugasan jelas dan peperiksaan latihan, dan kata H1 boleh dicapai dengan belajar secara konsisten."
    id: "Pada 2021-2022 pengulas merasa tertata, dengan tugas jelas dan ujian latihan, dan bilang H1 bisa diraih dengan belajar konsisten."
    hi: "2021-2022 तक रिव्यूअर्स को यह व्यवस्थित लगा, साफ़ काम और प्रैक्टिस एग्ज़ाम के साथ, और कहा कि लगातार पढ़ाई से H1 मिल सकता है।"
workload: heavy
