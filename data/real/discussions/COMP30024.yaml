points:
  - en: "The game-playing AI projects, done in pairs, are the highlight but are tricky and time consuming. Pick a good partner."
    zh: "两人合作开发游戏AI的项目是亮点，但难度大、耗时长，务必找好搭档。"
    zh-TW: "兩人一組做遊戲AI的專題是亮點，但很難又耗時。要挑個好搭檔。"
    ja: "ペアで取り組むゲームAIのプロジェクトが目玉だが、難しく時間もかかる。良いパートナーを選ぼう。"
    ko: "2인 1조 게임 AI 프로젝트가 하이라이트지만 까다롭고 시간이 많이 든다. 좋은 파트너를 고르자."
    vi: "Project AI chơi game làm theo cặp là điểm sáng nhưng khó và tốn thời gian. Hãy chọn bạn cùng nhóm tốt."
    ms: "Projek AI permainan yang dibuat berpasangan ialah bahagian terbaik tetapi rumit dan memakan masa. Pilih pasangan yang baik."
    id: "Proyek AI game yang dikerjakan berpasangan jadi sorotan tapi rumit dan menyita waktu. Pilih partner yang bagus."
    hi: "जोड़ी में किए जाने वाले गेम-प्लेइंग AI प्रोजेक्ट सबसे अच्छा हिस्सा हैं, पर पेचीदा और समय लेने वाले। अच्छा पार्टनर चुनें।"
  - en: "The probability section is hard for students without recent probability study, so a solid maths background helps a lot."
    zh: "概率部分对近期没学过概率的学生很难，扎实的数学基础帮助很大。"
    zh-TW: "對最近沒學過機率的學生來說，機率部分很難，所以扎實的數學基礎很有幫助。"
    ja: "最近確率を勉強していない人には確率のパートが難しいので、しっかりした数学の基礎がとても役立つ。"
    ko: "최근에 확률을 공부하지 않은 학생에게는 확률 파트가 어려워서, 탄탄한 수학 기초가 큰 도움이 된다."
    vi: "Phần xác suất khó với ai lâu rồi không học xác suất, nên nền toán vững giúp ích rất nhiều."
    ms: "Bahagian kebarangkalian sukar bagi pelajar yang tidak belajar kebarangkalian baru-baru ini, jadi asas matematik yang kukuh sangat membantu."
    id: "Bagian probabilitas sulit bagi yang belakangan tidak belajar probabilitas, jadi dasar matematika yang kuat sangat membantu."
    hi: "जिन्होंने हाल में प्रॉबेबिलिटी नहीं पढ़ी, उनके लिए यह हिस्सा कठिन है, इसलिए मज़बूत मैथ्स बैकग्राउंड बहुत मदद करता है।"
  - en: "The exam carries about 70% and is seen as harsh, so tutorials, which are tough, are key preparation."
    zh: "考试约占70%，被认为偏严苛；辅导题虽难但是备考关键。"
    zh-TW: "考試約占70%，被認為很嚴苛，所以雖然很難，輔導題是準備的關鍵。"
    ja: "試験は約70%で厳しいとされるので、難しいチュートリアル問題が試験対策のカギになる。"
    ko: "시험이 약 70%이고 가혹하다는 평이라, 어렵긴 해도 튜토리얼이 시험 준비의 핵심이다."
    vi: "Bài thi chiếm khoảng 70% và bị cho là khắt khe, nên tutorial dù khó lại là phần chuẩn bị then chốt."
    ms: "Peperiksaan bernilai kira-kira 70% dan dianggap keras, jadi tutorial, walaupun sukar, ialah persediaan utama."
    id: "Ujian berbobot sekitar 70% dan dinilai keras, jadi tutorial, yang memang sulit, adalah persiapan kunci."
    hi: "परीक्षा लगभग 70% की है और सख़्त मानी जाती है, इसलिए कठिन होने के बावजूद ट्यूटोरियल तैयारी की कुंजी हैं।"
  - en: "Some recent reviewers felt the content is classical and outdated AI, and forum support was mixed."
    zh: "部分近期评价认为内容属于较陈旧的经典AI，线上论坛答疑质量参差不齐。"
    zh-TW: "部分近期評論者覺得內容是傳統、過時的AI，論壇的支援品質也參差不齊。"
    ja: "最近のレビューの中には、内容が古典的で時代遅れのAIだという声や、掲示板のサポートにばらつきがあったという声もある。"
    ko: "일부 최근 리뷰어는 내용이 고전적이고 낡은 AI라고 느꼈고, 포럼 지원도 들쭉날쭉했다고 한다."
    vi: "Một số đánh giá gần đây thấy nội dung là AI cổ điển, lỗi thời, và hỗ trợ trên diễn đàn không đều."
    ms: "Sesetengah pengulas terkini rasa kandungannya AI klasik dan lapuk, dan sokongan forum bercampur-campur."
    id: "Beberapa ulasan terbaru merasa materinya AI klasik dan usang, dan dukungan forumnya campur aduk."
    hi: "कुछ हाल के रिव्यूअर्स को कंटेंट क्लासिकल और पुराना AI लगा, और फ़ोरम सपोर्ट मिला-जुला रहा।"
workload: heavy
difficulty: hard
