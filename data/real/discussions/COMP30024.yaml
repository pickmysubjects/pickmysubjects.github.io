code: COMP30024
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/comp30024
reviews: 6
from: 2019
to: 2026
checked: 2026-10-08
points:
  - en: "The game-playing AI projects, done in pairs, are the highlight but are tricky and time consuming. Pick a good partner."
    zh: "两人合作开发游戏AI的项目是亮点，但难度大、耗时长，务必找好搭档。"
    zh-TW: "兩人一組做遊戲AI的專題是亮點，但很難又耗時。要挑個好搭檔。"
    ja: "ペアで取り組むゲームAIのプロジェクトが目玉だが、難しく時間もかかる。良いパートナーを選ぼう。"
    ko: "2인 1조 게임 AI 프로젝트가 하이라이트지만 까다롭고 시간이 많이 든다. 좋은 파트너를 고르자."
    vi: "Project AI chơi game làm theo cặp là điểm sáng nhưng khó và tốn thời gian. Hãy chọn bạn cùng nhóm tốt."
    ms: "Projek AI permainan yang dibuat berpasangan ialah bahagian terbaik tetapi rumit dan memakan masa. Pilih pasangan yang baik."
    id: "Proyek AI game yang dikerjakan berpasangan jadi sorotan tapi rumit dan menyita waktu. Pilih partner yang bagus."
    hi: "जोड़ी में किए जाने वाले गेम-प्लेइंग AI प्रोजेक्ट सबसे अच्छा हिस्सा हैं, पर पेचीदा और समय लेने वाले। अच्छा पार्टनर चुनें।"
  - en: "The probability section is hard for students without recent probability study, so a solid maths background helps a lot."
    zh: "概率部分对近期没学过概率的学生很难，扎实的数学基础帮助很大。"
    zh-TW: "對最近沒學過機率的學生來說，機率部分很難，所以扎實的數學基礎很有幫助。"
    ja: "最近確率を勉強していない人には確率のパートが難しいので、しっかりした数学の基礎がとても役立つ。"
    ko: "최근에 확률을 공부하지 않은 학생에게는 확률 파트가 어려워서, 탄탄한 수학 기초가 큰 도움이 된다."
    vi: "Phần xác suất khó với ai lâu rồi không học xác suất, nên nền toán vững giúp ích rất nhiều."
    ms: "Bahagian kebarangkalian sukar bagi pelajar yang tidak belajar kebarangkalian baru-baru ini, jadi asas matematik yang kukuh sangat membantu."
    id: "Bagian probabilitas sulit bagi yang belakangan tidak belajar probabilitas, jadi dasar matematika yang kuat sangat membantu."
    hi: "जिन्होंने हाल में प्रॉबेबिलिटी नहीं पढ़ी, उनके लिए यह हिस्सा कठिन है, इसलिए मज़बूत मैथ्स बैकग्राउंड बहुत मदद करता है।"
  - en: "The exam carries about 70% and is seen as harsh, so tutorials, which are tough, are key preparation."
    zh: "考试约占70%，被认为偏严苛；辅导题虽难但是备考关键。"
    zh-TW: "考試約占70%，被認為很嚴苛，所以雖然很難，輔導題是準備的關鍵。"
    ja: "試験は約70%で厳しいとされるので、難しいチュートリアル問題が試験対策のカギになる。"
    ko: "시험이 약 70%이고 가혹하다는 평이라, 어렵긴 해도 튜토리얼이 시험 준비의 핵심이다."
    vi: "Bài thi chiếm khoảng 70% và bị cho là khắt khe, nên tutorial dù khó lại là phần chuẩn bị then chốt."
    ms: "Peperiksaan bernilai kira-kira 70% dan dianggap keras, jadi tutorial, walaupun sukar, ialah persediaan utama."
    id: "Ujian berbobot sekitar 70% dan dinilai keras, jadi tutorial, yang memang sulit, adalah persiapan kunci."
    hi: "परीक्षा लगभग 70% की है और सख़्त मानी जाती है, इसलिए कठिन होने के बावजूद ट्यूटोरियल तैयारी की कुंजी हैं।"
  - en: "Some recent reviewers felt the content is classical and outdated AI, and forum support was mixed."
    zh: "部分近期评价认为内容属于较陈旧的经典AI，线上论坛答疑质量参差不齐。"
    zh-TW: "部分近期評論者覺得內容是傳統、過時的AI，論壇的支援品質也參差不齊。"
    ja: "最近のレビューの中には、内容が古典的で時代遅れのAIだという声や、掲示板のサポートにばらつきがあったという声もある。"
    ko: "일부 최근 리뷰어는 내용이 고전적이고 낡은 AI라고 느꼈고, 포럼 지원도 들쭉날쭉했다고 한다."
    vi: "Một số đánh giá gần đây thấy nội dung là AI cổ điển, lỗi thời, và hỗ trợ trên diễn đàn không đều."
    ms: "Sesetengah pengulas terkini rasa kandungannya AI klasik dan lapuk, dan sokongan forum bercampur-campur."
    id: "Beberapa ulasan terbaru merasa materinya AI klasik dan usang, dan dukungan forumnya campur aduk."
    hi: "कुछ हाल के रिव्यूअर्स को कंटेंट क्लासिकल और पुराना AI लगा, और फ़ोरम सपोर्ट मिला-जुला रहा।"
sections:
  content:
    - en: "Classical AI: search algorithms, adversarial game search and constraint satisfaction, plus probability. The probability part is hard without uni probability; one 2026 reviewer found the content dated."
      zh: "讲经典 AI：搜索算法、博弈搜索、约束满足问题，还有概率。同学说没学过大学概率的话概率部分很难；一位 2026 年的同学觉得内容过时。"
      zh-TW: "講經典 AI：搜尋演算法、賽局搜尋、限制滿足問題，還有機率。同學說沒修過大學機率的話機率部分很難；一位 2026 年的同學覺得內容過時。"
      ja: "古典的AI：探索アルゴリズム、ゲーム木探索、制約充足、確率。大学で確率を学んでいないと確率パートは難しいという。2026年の一人は内容が古いと感じた。"
      ko: "고전 AI: 탐색 알고리즘, 게임 탐색, 제약 충족 문제, 그리고 확률. 대학 확률을 안 들었다면 확률 부분이 어렵다는 평. 2026년 한 리뷰는 내용이 낡았다고 했다."
      vi: "AI cổ điển: thuật toán tìm kiếm, tìm kiếm đối kháng trong trò chơi, bài toán thỏa ràng buộc, cùng xác suất. Phần xác suất khó nếu chưa học ở đại học; một người năm 2026 thấy nội dung lỗi thời."
      ms: "AI klasik: algoritma carian, carian permainan berlawan dan kepuasan kekangan, serta kebarangkalian. Bahagian kebarangkalian sukar jika belum belajar di universiti; seorang pengulas 2026 rasa kandungan lapuk."
      id: "AI klasik: algoritma pencarian, pencarian permainan adversarial dan constraint satisfaction, plus probabilitas. Bagian probabilitas sulit jika belum belajar di universitas; satu pengulas 2026 merasa materinya usang."
      hi: "क्लासिकल AI: सर्च एल्गोरिद्म, खेलों में प्रतिद्वंद्वी सर्च और कंस्ट्रेंट सैटिस्फ़ैक्शन, साथ में प्रायिकता। रिव्यूअर्स कहते हैं विश्वविद्यालय में प्रायिकता न पढ़ी हो तो वह हिस्सा कठिन है; 2026 के एक को सामग्री पुरानी लगी।"
  work:
    - en: "Two pair projects building a game-playing agent, which reviewers found the best and most demanding part, with reports that can save marks. The exam is 70%, closed-book, and several found it harsh."
      zh: "两个两人项目，做一个玩棋盘游戏的 AI，同学认为是最精彩也最费力的部分，报告部分能挽回不少分。期末占 70%，闭卷，好几位觉得太重。"
      zh-TW: "兩個兩人專題，做一個玩棋盤遊戲的 AI，同學認為是最精彩也最費力的部分，報告部分能挽回不少分。期末占 70%，閉書，好幾位覺得太重。"
      ja: "ゲームをプレイするエージェントを作るペア課題が2つで、最も面白く大変な部分。レポートで点を拾える。試験は70%でクローズドブック、重すぎるという声が複数。"
      ko: "게임을 하는 에이전트를 만드는 2인 프로젝트 2개가 가장 좋고 가장 힘든 부분이며, 보고서로 점수를 만회할 수 있다. 시험은 70%, 오픈북 아님, 가혹하다는 평이 여럿."
      vi: "Hai dự án theo cặp xây agent chơi game, được cho là phần hay và nặng nhất, báo cáo có thể cứu điểm. Thi chiếm 70%, không mở tài liệu, nhiều người thấy quá nặng."
      ms: "Dua projek berpasangan membina ejen bermain permainan, dianggap bahagian terbaik dan paling berat, dengan laporan yang boleh menyelamatkan markah. Peperiksaan 70%, buku tertutup, beberapa rasa keterlaluan."
      id: "Dua proyek berpasangan membuat agen pemain game, dianggap bagian terbaik dan terberat, dengan laporan yang bisa menyelamatkan nilai. Ujian 70%, buku tertutup, beberapa merasa terlalu berat."
      hi: "जोड़ी में दो प्रोजेक्ट जिनमें गेम खेलने वाला एजेंट बनाना है, जिसे सबसे अच्छा और सबसे मेहनत वाला हिस्सा माना गया, रिपोर्ट से अंक बच सकते हैं। परीक्षा 70%, क्लोज़्ड-बुक, कई को कठोर लगी।"
  watch:
    - en: "Find a good project partner. Some found tutorials and forum support patchy, and one reviewer felt the probability lectures were rushed and relied on heavy scaling."
      zh: "一定要找个靠谱的项目搭档。有人觉得 tutorial 和论坛答疑参差不齐；有同学觉得概率部分讲得太赶，最后靠大幅 scaling。"
      zh-TW: "一定要找個靠譜的專題夥伴。有人覺得 tutorial 和論壇答疑良莠不齊；有同學覺得機率部分講得太趕，最後靠大幅 scaling。"
      ja: "良いプロジェクトの相方を見つけること。チュートリアルや掲示板のサポートにムラがあるという声も。一人は確率の講義が駆け足で、大幅なスケーリング頼みだったと言う。"
      ko: "좋은 프로젝트 파트너를 찾을 것. 튜토리얼과 포럼 지원이 들쭉날쭉했다는 사람도 있고, 한 리뷰는 확률 강의가 급했고 큰 스케일링에 의존했다고 느꼈다."
      vi: "Tìm bạn làm dự án đáng tin. Một số thấy tutorial và hỗ trợ trên diễn đàn thất thường; một người thấy phần xác suất dạy vội và nhờ scaling nhiều."
      ms: "Cari rakan projek yang baik. Ada yang rasa tutorial dan sokongan forum tidak konsisten; seorang rasa kuliah kebarangkalian tergesa-gesa dan bergantung pada scaling besar."
      id: "Cari partner proyek yang baik. Sebagian merasa tutorial dan dukungan forum tidak konsisten; satu merasa kuliah probabilitas terburu-buru dan bergantung pada scaling besar."
      hi: "अच्छा प्रोजेक्ट पार्टनर ढूँढें। कुछ को ट्यूटोरियल और फ़ोरम सहायता असमान लगी; एक को प्रायिकता के लेक्चर जल्दबाज़ी वाले और भारी स्केलिंग पर निर्भर लगे।"
workload: heavy
difficulty: hard
