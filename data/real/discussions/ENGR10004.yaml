reviews: 9
from: 2014
to: 2021
checked: 2026-10-08
points:
  - en: "The group design project is a large share of the grade, so choosing a good team early is the top advice."
    zh: "小组设计项目占成绩很大比重，最重要的建议是尽早找到好队友。"
    zh-TW: "小組設計專題占成績很大比重，最重要的建議是儘早找到好隊友。"
    ja: "グループ設計プロジェクトの配点が大きいので、早めに良いチームを組むのが一番のアドバイス。"
    ko: "조별 설계 프로젝트 비중이 크므로 일찍 좋은 팀을 꾸리는 것이 가장 중요한 조언."
    vi: "Đồ án thiết kế nhóm chiếm phần lớn điểm, nên lời khuyên hàng đầu là chọn nhóm tốt từ sớm."
    ms: "Projek reka bentuk berkumpulan menyumbang sebahagian besar gred, jadi nasihat utama ialah pilih pasukan yang baik awal-awal."
    id: "Proyek desain kelompok porsinya besar di nilai, jadi saran utamanya pilih tim yang bagus sejak awal."
    hi: "ग्रुप डिज़ाइन प्रोजेक्ट ग्रेड का बड़ा हिस्सा है, इसलिए सबसे बड़ी सलाह है जल्दी अच्छी टीम चुनें।"
  - en: "Many found the content dry or of limited use, especially the chemical engineering part for non-chem students."
    zh: "不少人觉得内容枯燥或用处有限，尤其化工部分对非化工方向学生而言。"
    zh-TW: "不少人覺得內容枯燥或用處有限，尤其化工部分對非化工方向的學生來說。"
    ja: "内容が退屈、あまり役に立たないと感じた人が多い。特に化学工学以外の学生にとっての化学工学パート。"
    ko: "내용이 지루하거나 쓸모가 적다는 의견이 많으며, 특히 비화공 학생에게 화학공학 파트가 그렇다고 함."
    vi: "Nhiều người thấy nội dung khô khan hoặc ít hữu ích, nhất là phần kỹ thuật hóa học với sinh viên không học hóa."
    ms: "Ramai rasa kandungan membosankan atau kurang berguna, terutama bahagian kejuruteraan kimia bagi pelajar bukan kimia."
    id: "Banyak yang merasa materinya membosankan atau kurang berguna, terutama bagian teknik kimia bagi mahasiswa non-kimia."
    hi: "कई लोगों को कंटेंट नीरस या कम काम का लगा, ख़ासकर नॉन-केमिकल स्टूडेंट्स को केमिकल इंजीनियरिंग वाला हिस्सा।"
  - en: "Teaches technical report writing and teamwork, which help in later subjects; with a good group it can be an easy H1."
    zh: "能学会技术报告写作和团队合作，对后续课程有帮助；组员给力的话H1不难。"
    zh-TW: "能學會技術報告寫作和團隊合作，對後續課程有幫助；組員給力的話H1不難。"
    ja: "技術レポートの書き方とチームワークが身につき、後の科目で役立つ。良いグループならH1も楽に取れる。"
    ko: "기술 보고서 작성과 팀워크를 배워 이후 과목에 도움이 되며, 좋은 조라면 H1도 쉽게 가능."
    vi: "Dạy viết báo cáo kỹ thuật và làm việc nhóm, có ích cho các môn sau; nhóm tốt thì H1 dễ dàng."
    ms: "Mengajar penulisan laporan teknikal dan kerja berpasukan yang membantu subjek kemudian; dengan kumpulan baik, H1 mudah."
    id: "Mengajarkan menulis laporan teknis dan kerja tim yang berguna di mata kuliah berikutnya; dengan kelompok bagus, H1 bisa mudah."
    hi: "टेक्निकल रिपोर्ट लिखना और टीमवर्क सिखाता है जो आगे के सब्जेक्ट में काम आता है; अच्छे ग्रुप के साथ H1 आसान हो सकता है।"
sections:
  content:
    - en: "A first-year engineering design subject. Some found the content dry or of little use outside chemical engineering, but it teaches how to write an engineering report."
      zh: "大一工程设计课。有人觉得内容枯燥，除了化工方向用处不大；但能学会怎么写工程报告。"
      zh-TW: "大一工程設計課。有人覺得內容枯燥，除了化工方向用處不大；但能學會怎麼寫工程報告。"
      ja: "1年次の工学設計科目。内容が退屈、化学工学以外ではあまり役立たないという声もあるが、工学レポートの書き方が身につく。"
      ko: "1학년 공학 설계 과목. 내용이 건조하고 화공 외에는 쓸모가 적다는 의견도 있지만 공학 보고서 쓰는 법을 배운다."
      vi: "Môn thiết kế kỹ thuật năm nhất. Có người thấy nội dung khô hoặc ít hữu ích ngoài kỹ thuật hóa, nhưng môn dạy cách viết báo cáo kỹ thuật."
      ms: "Subjek reka bentuk kejuruteraan tahun satu. Ada yang rasa kandungannya hambar atau kurang berguna selain kejuruteraan kimia, tetapi ia mengajar cara menulis laporan kejuruteraan."
      id: "Mata kuliah desain teknik tahun pertama. Sebagian merasa materinya kering atau kurang berguna di luar teknik kimia, tapi mengajarkan cara menulis laporan teknik."
      hi: "पहले साल का इंजीनियरिंग डिज़ाइन विषय। कुछ को कंटेंट नीरस या केमिकल इंजीनियरिंग के बाहर कम उपयोगी लगा, पर इंजीनियरिंग रिपोर्ट लिखना सिखाता है।"
  work:
    - en: "A group design project worth over half the grade, in 2019 a water system leaning on fluid mechanics, plus individual work. Some found it boring and time-consuming."
      zh: "小组设计项目占一半以上成绩，2019 年是设计供水系统，偏流体力学；另有个人作业。有人觉得项目无聊、费时间。"
      zh-TW: "小組設計專題佔一半以上成績，2019 年是設計供水系統，偏流體力學；另有個人作業。有人覺得專題無聊、很花時間。"
      ja: "成績の半分以上を占めるグループ設計プロジェクト（2019年は流体力学寄りの給水システム）と個人課題。退屈で時間がかかるという声も。"
      ko: "성적의 절반 이상인 조별 설계 프로젝트(2019년엔 유체역학 중심의 급수 시스템)와 개인 과제가 있다. 지루하고 시간이 많이 든다는 의견도 있다."
      vi: "Project thiết kế nhóm chiếm hơn nửa điểm, năm 2019 là hệ thống cấp nước thiên về cơ học chất lỏng, cùng bài cá nhân. Có người thấy chán và tốn thời gian."
      ms: "Projek reka bentuk berkumpulan melebihi separuh gred, pada 2019 sistem air yang bersandar pada mekanik bendalir, serta kerja individu. Ada yang rasa bosan dan memakan masa."
      id: "Proyek desain kelompok bernilai lebih dari separuh nilai, pada 2019 berupa sistem air yang bertumpu pada mekanika fluida, plus tugas individu. Sebagian merasa membosankan dan makan waktu."
      hi: "आधे से ज़्यादा ग्रेड वाला ग्रुप डिज़ाइन प्रोजेक्ट, 2019 में फ़्लूइड मैकेनिक्स पर टिका जल-प्रणाली डिज़ाइन, साथ में व्यक्तिगत काम। कुछ को यह उबाऊ और समय लेने वाला लगा।"
  study:
    - en: "Choose a good team early, since the project carries most of the grade, and keep up with the content; reviewers say H1 is then within easy reach."
      zh: "尽早找个好组，因为项目占大头；内容跟上进度，同学说这样 H1 不难。"
      zh-TW: "儘早找個好組，因為專題佔大頭；內容跟上進度，同學說這樣 H1 不難。"
      ja: "プロジェクトが成績の大半なので早めに良いチームを組み、内容についていく。そうすればH1は難しくないという。"
      ko: "프로젝트 비중이 크니 일찍 좋은 팀을 꾸리고 진도를 따라가라. 그러면 H1은 어렵지 않다고 한다."
      vi: "Chọn nhóm tốt sớm vì project chiếm phần lớn điểm, và theo kịp nội dung; người học nói như vậy H1 không khó."
      ms: "Pilih pasukan yang baik awal kerana projek membawa kebanyakan gred, dan ikuti kandungan; pengulas kata H1 kemudian mudah dicapai."
      id: "Pilih tim yang baik sejak awal karena proyek menentukan sebagian besar nilai, dan ikuti materinya; pengulas bilang H1 jadi mudah diraih."
      hi: "जल्दी अच्छी टीम चुनें, क्योंकि प्रोजेक्ट ग्रेड का बड़ा हिस्सा है, और कंटेंट के साथ चलें; रिव्यूअर्स कहते हैं तब H1 आसान है।"
  watch:
    - en: "All these reviews are from 2021 or earlier; teaching and exams may have changed since."
      zh: "这些评价都是 2021 年或更早的，现在的教法和考试可能已经变了。"
      zh-TW: "這些評價都是 2021 年或更早的，現在的教法和考試可能已經變了。"
      ja: "レビューはすべて2021年以前のもの。授業や試験は変わっている可能性がある。"
      ko: "모든 리뷰가 2021년 이전 것이라 지금 수업과 시험은 달라졌을 수 있다."
      vi: "Tất cả đánh giá đều từ năm 2021 trở về trước; cách dạy và thi có thể đã thay đổi."
      ms: "Semua ulasan ini dari 2021 atau lebih awal; pengajaran dan peperiksaan mungkin telah berubah."
      id: "Semua ulasan ini dari 2021 atau sebelumnya; pengajaran dan ujian mungkin sudah berubah."
      hi: "ये सभी रिव्यू 2021 या उससे पहले के हैं; पढ़ाई और परीक्षा अब बदल चुकी हो सकती है।"
tags: [group-work]
difficulty: easy
