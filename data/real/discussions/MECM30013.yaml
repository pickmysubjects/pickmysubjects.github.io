points:
  - en: "Marketing Communication is consistently recommended (2017-2024): practical, easy-to-follow lectures with real ad examples, and engaging tutorials, a welcome break from theory."
    zh: "Marketing Communication一直受推荐（2017-2024）：实用，讲座易懂，有真实广告案例，辅导课也有趣，是摆脱理论的好选择。"
    zh-TW: "Marketing Communication一直受推薦（2017-2024）：實用，講座易懂，有真實廣告案例，輔導課也有趣，是擺脫理論的好選擇。"
    ja: "Marketing Communicationは一貫して推薦されている（2017-2024）。実践的で、実際の広告例を使った講義はわかりやすく、チュートリアルも面白い。理論からの良い息抜き。"
    ko: "Marketing Communication은 꾸준히 추천됨(2017-2024). 실용적이고 실제 광고 사례로 강의가 이해하기 쉬우며 튜토리얼도 재미있어 이론에서 벗어난 반가운 휴식."
    vi: "Marketing Communication luôn được giới thiệu (2017-2024): thực tế, bài giảng dễ hiểu với ví dụ quảng cáo thật, tutorial hấp dẫn, giúp nghỉ ngơi khỏi lý thuyết."
    ms: "Marketing Communication sentiasa disyorkan (2017-2024): praktikal, kuliah mudah difahami dengan contoh iklan sebenar, dan tutorial menarik, rehat yang baik daripada teori."
    id: "Marketing Communication konsisten direkomendasikan (2017-2024): praktis, kuliah mudah diikuti dengan contoh iklan nyata, dan tutorial menarik, jeda yang menyenangkan dari teori."
    hi: "Marketing Communication की लगातार सिफ़ारिश हुई (2017-2024): व्यावहारिक, असली विज्ञापन उदाहरणों के साथ आसानी से समझ आने वाले लेक्चर और रोचक ट्यूटोरियल, सिद्धांत से अच्छी राहत।"
  - en: "Assignments include analysing an existing campaign and developing your own. They were called manageable, though different from typical Arts essays."
    zh: "作业包括分析一个现有营销活动和策划自己的活动。被认为可以应付，但与一般文科论文不同。"
    zh-TW: "作業包括分析一個現有行銷活動和策劃自己的活動。被認為可以應付，但與一般文科論文不同。"
    ja: "課題は既存キャンペーンの分析と自分のキャンペーンの立案。こなせる量とされたが、一般的な文系のエッセイとは異なる。"
    ko: "과제는 기존 캠페인 분석과 자신의 캠페인 기획. 할 만하다는 평이지만 일반 인문 에세이와는 다름."
    vi: "Bài tập gồm phân tích một chiến dịch có sẵn và xây dựng chiến dịch của riêng bạn. Được cho là vừa sức, dù khác với bài luận khối Nghệ thuật thông thường."
    ms: "Tugasan termasuk menganalisis kempen sedia ada dan membangunkan kempen sendiri. Ia dikatakan boleh diurus, walaupun berbeza daripada esei Sastera biasa."
    id: "Tugasnya menganalisis kampanye yang ada dan merancang kampanye sendiri. Disebut bisa dikelola, meski berbeda dari esai Arts biasa."
    hi: "असाइनमेंट में किसी मौजूदा कैंपेन का विश्लेषण और अपना कैंपेन तैयार करना है। इन्हें संभालने लायक बताया गया, हालाँकि ये आम Arts निबंधों से अलग हैं।"
sections:
  content:
    - en: "A practical subject on building successful marketing campaigns, taught with real ads. Reviewers found the concepts easy to follow, the readings light and the tutorials engaging."
      zh: "很实用的课，讲怎么做出成功的营销活动，用真实广告举例。同学觉得概念好懂、阅读量少、tutorial 很投入。"
      zh-TW: "很實用的課，講怎麼做出成功的行銷活動，用真實廣告舉例。同學覺得概念好懂、閱讀量少、tutorial 很投入。"
      ja: "成功するマーケティングキャンペーンの作り方を実際の広告を使って学ぶ実践的な科目。概念は分かりやすく、リーディングは少なく、チュートリアルも楽しいという。"
      ko: "실제 광고를 예로 성공적인 마케팅 캠페인 만드는 법을 배우는 실용 과목. 개념이 이해하기 쉽고 읽기가 적으며 튜토리얼이 재미있다는 평."
      vi: "Môn thực tế về xây dựng chiến dịch marketing thành công, dạy bằng quảng cáo thật. Người học thấy khái niệm dễ hiểu, ít bài đọc và tutorial cuốn hút."
      ms: "Subjek praktikal tentang membina kempen pemasaran yang berjaya, diajar dengan iklan sebenar. Pengulas dapati konsep mudah difahami, bacaan ringan dan tutorial menarik."
      id: "Mata kuliah praktis tentang membangun kampanye pemasaran yang sukses, diajarkan dengan iklan nyata. Pengulas merasa konsepnya mudah, bacaannya ringan dan tutorialnya seru."
      hi: "सफल मार्केटिंग कैंपेन बनाने पर व्यावहारिक विषय, असली विज्ञापनों से पढ़ाया गया। रिव्यूअर्स को कॉन्सेप्ट आसान, रीडिंग हल्की और ट्यूटोरियल दिलचस्प लगे।"
  work:
    - en: "Assignments include analysing an existing campaign and developing your own for a chosen brand. Most found them fun and manageable; one said they differ from typical Arts essays."
      zh: "作业包括分析一个现有的营销活动，以及为选定品牌策划自己的活动。多数人觉得好玩、能应付；有同学说和一般文科论文很不一样。"
      zh-TW: "作業包括分析一個現有的行銷活動，以及為選定品牌企劃自己的活動。多數人覺得好玩、應付得來；有同學說和一般文科論文很不一樣。"
      ja: "課題は既存キャンペーンの分析と、選んだブランドのキャンペーン立案。多くは楽しく無理がないと感じたが、一般的な文系エッセイとは違うという声も一つ。"
      ko: "과제는 기존 캠페인 분석과 선택한 브랜드의 캠페인 기획이다. 대부분 재미있고 할 만하다고 했고, 일반 인문 에세이와 다르다는 의견도 있다."
      vi: "Bài tập gồm phân tích một chiến dịch có sẵn và tự xây dựng chiến dịch cho một thương hiệu. Đa số thấy vui và vừa sức; một người nói khác với tiểu luận khối Arts thường gặp."
      ms: "Tugasan termasuk menganalisis kempen sedia ada dan membangunkan kempen sendiri untuk jenama pilihan. Kebanyakan rasa seronok dan boleh diurus; seorang kata ia berbeza daripada esei Arts biasa."
      id: "Tugasnya menganalisis kampanye yang ada dan merancang kampanye sendiri untuk merek pilihan. Kebanyakan merasa seru dan bisa ditangani; satu bilang berbeda dari esai Arts biasa."
      hi: "असाइनमेंट में किसी मौजूदा कैंपेन का विश्लेषण और चुने हुए ब्रांड के लिए अपना कैंपेन बनाना शामिल है। ज़्यादातर को मज़ेदार और संभालने लायक लगे; एक ने कहा ये सामान्य आर्ट्स निबंध से अलग हैं।"
  watch:
    - en: "Reviews are short and mostly from 2017–2022, with only one from 2024. One 2017 reviewer found the lecturer hard to follow."
      zh: "评价都比较短，大多来自 2017–2022 年，2024 年只有一条。2017 年有同学觉得讲师的课难跟。"
      zh-TW: "評價都比較短，大多來自 2017–2022 年，2024 年只有一則。2017 年有同學覺得講師的課難跟。"
      ja: "レビューは短く、多くは2017〜2022年のもので、2024年は1件のみ。2017年には講師の話についていきにくいという声も。"
      ko: "리뷰는 짧고 대부분 2017–2022년 것이며 2024년은 하나뿐이다. 2017년 한 리뷰어는 강의를 따라가기 어려웠다고 했다."
      vi: "Các đánh giá ngắn và phần lớn từ 2017–2022, chỉ một từ 2024. Một người năm 2017 thấy bài giảng khó theo."
      ms: "Ulasan pendek dan kebanyakannya dari 2017–2022, hanya satu dari 2024. Seorang pengulas 2017 rasa pensyarah sukar diikuti."
      id: "Ulasannya singkat dan sebagian besar dari 2017–2022, hanya satu dari 2024. Satu pengulas 2017 merasa dosennya sulit diikuti."
      hi: "रिव्यू छोटे हैं और ज़्यादातर 2017–2022 के, 2024 का सिर्फ़ एक। 2017 के एक रिव्यूअर को लेक्चर समझना मुश्किल लगा।"
difficulty: easy
