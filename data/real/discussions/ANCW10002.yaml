points:
  - en: "Most found the Greek and Roman topics fascinating, and many science students took it as a breadth and were glad they did."
    zh: "大多数人觉得希腊罗马的主题很吸引人，不少理科生把它当跨学科选修，也觉得选得值。"
    zh-TW: "大多數人覺得希臘羅馬的主題很吸引人，不少理科生把它當Breadth選修，也覺得選得值。"
    ja: "ギリシャ・ローマのテーマは面白いという声が大半で、Breadthとして取った理系学生も満足していた。"
    ko: "그리스·로마 주제가 흥미롭다는 의견이 대부분이며, Breadth로 들은 이과생들도 만족했음."
    vi: "Phần lớn thấy các chủ đề Hy Lạp và La Mã rất cuốn hút, nhiều sinh viên khoa học học làm Breadth và thấy đáng."
    ms: "Kebanyakan dapati topik Yunani dan Rom sangat menarik, dan ramai pelajar sains mengambilnya sebagai Breadth dan berpuas hati."
    id: "Kebanyakan merasa topik Yunani dan Romawi sangat menarik, dan banyak mahasiswa sains mengambilnya sebagai Breadth dan tidak menyesal."
    hi: "ज़्यादातर को ग्रीक और रोमन विषय बहुत दिलचस्प लगे, और कई साइंस छात्रों ने इसे Breadth के रूप में लिया और खुश रहे।"
  - en: "Expect a lot of reading and research. Keeping up is what earns good marks."
    zh: "阅读和研究量很大。跟上进度就能拿到好成绩。"
    zh-TW: "閱讀和研究量很大。跟上進度就能拿到好成績。"
    ja: "読む量と調べる量が多い。ついていけば良い成績が取れる。"
    ko: "읽을거리와 조사할 양이 많음. 꾸준히 따라가면 좋은 성적을 받을 수 있음."
    vi: "Phải đọc và nghiên cứu nhiều. Theo kịp bài là có điểm tốt."
    ms: "Banyak bacaan dan penyelidikan. Kekal mengikut rentak ialah kunci markah baik."
    id: "Banyak bacaan dan riset. Mengikuti terus materinya adalah kunci nilai bagus."
    hi: "पढ़ाई और रिसर्च बहुत है। साथ-साथ चलते रहें तो अच्छे अंक मिलते हैं।"
  - en: "From 2022 on, some said the weekly topics felt disconnected, and in 2023 the first weeks covered other civilisations before Greece and Rome. A 2025 reviewer found it hard for a first-year subject."
    zh: "从2022年起，有人觉得每周主题之间缺乏联系；2023年开头几周讲的是希腊罗马以外的文明。2025年的一位评论者觉得作为一年级课程偏难。"
    zh-TW: "從2022年起，有人覺得每週主題之間缺乏聯繫；2023年開頭幾週講的是希臘羅馬以外的文明。2025年一位評論者覺得以一年級課程來說偏難。"
    ja: "2022年以降、週ごとのテーマのつながりが薄いという声があり、2023年は最初の数週がギリシャ・ローマ以外の文明だった。2025年のレビューでは1年生向けにしては難しいとのこと。"
    ko: "2022년부터 주차별 주제가 따로 논다는 의견이 있었고, 2023년엔 처음 몇 주가 그리스·로마 이외 문명을 다룸. 2025년 리뷰어는 1학년 과목치고 어렵다고 함."
    vi: "Từ 2022, vài người thấy chủ đề các tuần rời rạc; năm 2023 vài tuần đầu nói về các nền văn minh khác trước Hy Lạp và La Mã. Một người năm 2025 thấy khó so với môn năm nhất."
    ms: "Sejak 2022, ada yang rasa topik mingguan tidak bersambung, dan pada 2023 minggu awal meliputi tamadun lain sebelum Yunani dan Rom. Seorang pengulas 2025 rasa ia sukar untuk subjek tahun pertama."
    id: "Sejak 2022, ada yang merasa topik mingguan tidak nyambung, dan di 2023 minggu-minggu awal membahas peradaban lain sebelum Yunani dan Romawi. Pengulas 2025 merasa sulit untuk mata kuliah tahun pertama."
    hi: "2022 से कुछ लोगों को हफ़्तों के विषय आपस में जुड़े नहीं लगे, और 2023 में शुरुआती हफ़्ते ग्रीस-रोम से पहले दूसरी सभ्यताओं पर थे। 2025 के एक रिव्यूअर को यह फ़र्स्ट-ईयर विषय के हिसाब से कठिन लगा।"
workload: heavy
