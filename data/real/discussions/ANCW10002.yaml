points:
  - en: "Most found the Greek and Roman topics fascinating, and many science students took it as a breadth and were glad they did."
    zh: "大多数人觉得希腊罗马的主题很吸引人，不少理科生把它当跨学科选修，也觉得选得值。"
    zh-TW: "大多數人覺得希臘羅馬的主題很吸引人，不少理科生把它當Breadth選修，也覺得選得值。"
    ja: "ギリシャ・ローマのテーマは面白いという声が大半で、Breadthとして取った理系学生も満足していた。"
    ko: "그리스·로마 주제가 흥미롭다는 의견이 대부분이며, Breadth로 들은 이과생들도 만족했음."
    vi: "Phần lớn thấy các chủ đề Hy Lạp và La Mã rất cuốn hút, nhiều sinh viên khoa học học làm Breadth và thấy đáng."
    ms: "Kebanyakan dapati topik Yunani dan Rom sangat menarik, dan ramai pelajar sains mengambilnya sebagai Breadth dan berpuas hati."
    id: "Kebanyakan merasa topik Yunani dan Romawi sangat menarik, dan banyak mahasiswa sains mengambilnya sebagai Breadth dan tidak menyesal."
    hi: "ज़्यादातर को ग्रीक और रोमन विषय बहुत दिलचस्प लगे, और कई साइंस छात्रों ने इसे Breadth के रूप में लिया और खुश रहे।"
  - en: "Expect a lot of reading and research. Keeping up is what earns good marks."
    zh: "阅读和研究量很大。跟上进度就能拿到好成绩。"
    zh-TW: "閱讀和研究量很大。跟上進度就能拿到好成績。"
    ja: "読む量と調べる量が多い。ついていけば良い成績が取れる。"
    ko: "읽을거리와 조사할 양이 많음. 꾸준히 따라가면 좋은 성적을 받을 수 있음."
    vi: "Phải đọc và nghiên cứu nhiều. Theo kịp bài là có điểm tốt."
    ms: "Banyak bacaan dan penyelidikan. Kekal mengikut rentak ialah kunci markah baik."
    id: "Banyak bacaan dan riset. Mengikuti terus materinya adalah kunci nilai bagus."
    hi: "पढ़ाई और रिसर्च बहुत है। साथ-साथ चलते रहें तो अच्छे अंक मिलते हैं।"
  - en: "From 2022 on, some said the weekly topics felt disconnected, and in 2023 the first weeks covered other civilisations before Greece and Rome. A 2025 reviewer found it hard for a first-year subject."
    zh: "从2022年起，有人觉得每周主题之间缺乏联系；2023年开头几周讲的是希腊罗马以外的文明。2025年的一位评论者觉得作为一年级课程偏难。"
    zh-TW: "從2022年起，有人覺得每週主題之間缺乏聯繫；2023年開頭幾週講的是希臘羅馬以外的文明。2025年一位評論者覺得以一年級課程來說偏難。"
    ja: "2022年以降、週ごとのテーマのつながりが薄いという声があり、2023年は最初の数週がギリシャ・ローマ以外の文明だった。2025年のレビューでは1年生向けにしては難しいとのこと。"
    ko: "2022년부터 주차별 주제가 따로 논다는 의견이 있었고, 2023년엔 처음 몇 주가 그리스·로마 이외 문명을 다룸. 2025년 리뷰어는 1학년 과목치고 어렵다고 함."
    vi: "Từ 2022, vài người thấy chủ đề các tuần rời rạc; năm 2023 vài tuần đầu nói về các nền văn minh khác trước Hy Lạp và La Mã. Một người năm 2025 thấy khó so với môn năm nhất."
    ms: "Sejak 2022, ada yang rasa topik mingguan tidak bersambung, dan pada 2023 minggu awal meliputi tamadun lain sebelum Yunani dan Rom. Seorang pengulas 2025 rasa ia sukar untuk subjek tahun pertama."
    id: "Sejak 2022, ada yang merasa topik mingguan tidak nyambung, dan di 2023 minggu-minggu awal membahas peradaban lain sebelum Yunani dan Romawi. Pengulas 2025 merasa sulit untuk mata kuliah tahun pertama."
    hi: "2022 से कुछ लोगों को हफ़्तों के विषय आपस में जुड़े नहीं लगे, और 2023 में शुरुआती हफ़्ते ग्रीस-रोम से पहले दूसरी सभ्यताओं पर थे। 2025 के एक रिव्यूअर को यह फ़र्स्ट-ईयर विषय के हिसाब से कठिन लगा।"
sections:
  content:
    - en: "Reviewers found the topics and readings interesting, especially the primary sources, and several science students enjoyed it as a breadth."
      zh: "同学觉得话题和阅读都很有意思，尤其是原始文献；好几位理科生拿它当 breadth 修，也很喜欢。"
      zh-TW: "同學覺得主題和閱讀都很有趣，尤其是原始史料；好幾位理科生拿它當 breadth 修，也很喜歡。"
      ja: "トピックとリーディング、特に一次資料が面白いという声。理系の学生がブレドスとして楽しんだ例も複数。"
      ko: "주제와 읽기 자료, 특히 1차 사료가 흥미롭다는 평. 이공계 학생 여럿이 브레드스로 듣고 만족했다."
      vi: "Người học thấy chủ đề và bài đọc thú vị, nhất là tư liệu gốc; vài sinh viên khoa học học làm môn breadth và rất thích."
      ms: "Pengulas dapati topik dan bacaan menarik, terutama sumber primer; beberapa pelajar sains seronok mengambilnya sebagai breadth."
      id: "Pengulas merasa topik dan bacaannya menarik, terutama sumber primer; beberapa mahasiswa sains senang mengambilnya sebagai breadth."
      hi: "रिव्यूअर्स को टॉपिक और रीडिंग, ख़ासकर प्राथमिक स्रोत, रोचक लगे; कई साइंस छात्रों ने इसे ब्रेड्थ के रूप में पसंद किया।"
    - en: "Some felt the structure was loose: weekly topics felt unconnected, one reviewer said the first weeks weren't about Greece or Rome, and Rome got less time."
      zh: "有人觉得结构松散：每周话题联系不大；有同学说开头几周讲的不是希腊罗马，罗马部分时间也偏少。"
      zh-TW: "有人覺得架構鬆散：每週主題關聯不大；有同學說前幾週講的不是希臘羅馬，羅馬部分時間也偏少。"
      ja: "構成がゆるいという声も。毎週のテーマにつながりがなく、最初の数週はギリシャ・ローマ以外だったという声や、ローマの時間が少ないという声。"
      ko: "구성이 느슨하다는 의견도 있다. 주차별 주제가 따로 놀고, 초반 몇 주는 그리스·로마가 아니었으며 로마 비중이 적었다는 리뷰가 있다."
      vi: "Một số thấy cấu trúc rời rạc: chủ đề mỗi tuần ít liên kết; một người nói mấy tuần đầu không nói về Hy Lạp hay La Mã, và La Mã được ít thời gian hơn."
      ms: "Ada yang rasa strukturnya longgar: topik mingguan tidak berkait; seorang kata minggu awal bukan tentang Greece atau Rom, dan Rom dapat masa kurang."
      id: "Sebagian merasa strukturnya longgar: topik mingguan tidak nyambung; satu pengulas bilang minggu awal bukan soal Yunani atau Romawi, dan Romawi dapat porsi lebih sedikit."
      hi: "कुछ को ढाँचा ढीला लगा: हर हफ़्ते के टॉपिक जुड़े नहीं लगे; एक के अनुसार शुरुआती हफ़्ते ग्रीस या रोम पर नहीं थे, और रोम को कम समय मिला।"
  work:
    - en: "Assignments are essays; most found them fun and fairly marked with detailed feedback, but one recent reviewer found the requirements many and the marking strict."
      zh: "作业是论文，多数人觉得好写、评分公平、反馈详细；但最近有同学觉得要求多、给分严。"
      zh-TW: "作業是論文，多數人覺得好寫、評分公平、回饋詳細；但最近有同學覺得要求多、給分嚴。"
      ja: "課題はエッセイ。多くは楽しく公平に採点され、フィードバックも丁寧だと評価。最近のレビューでは要件が多く採点が厳しいという声も一つ。"
      ko: "과제는 에세이다. 대부분 재미있고 공정하게 채점되며 피드백이 자세하다고 했지만, 최근 한 리뷰어는 요구 사항이 많고 채점이 엄격하다고 했다."
      vi: "Bài tập là tiểu luận; đa số thấy viết vui, chấm công bằng, phản hồi chi tiết, nhưng một người gần đây thấy nhiều yêu cầu và chấm gắt."
      ms: "Tugasan berbentuk esei; kebanyakan rasa seronok, dinilai adil dengan maklum balas terperinci, tetapi seorang pengulas terkini rasa banyak syarat dan pemarkahan ketat."
      id: "Tugasnya esai; kebanyakan merasa seru, dinilai adil dengan umpan balik rinci, tapi satu pengulas terbaru merasa syaratnya banyak dan penilaiannya ketat."
      hi: "असाइनमेंट निबंध हैं; ज़्यादातर को मज़ेदार, उचित मार्किंग वाले और विस्तृत फ़ीडबैक वाले लगे, पर हाल के एक रिव्यूअर को शर्तें ज़्यादा और मार्किंग सख़्त लगी।"
  study:
    - en: "Keep up with the readings and the recorded lectures; one reviewer advises sitting with engaged classmates, as tutorial discussions are done in groups."
      zh: "阅读和录播课都要跟上；有同学建议 tutorial 坐在认真的同学旁边，因为讨论是分组进行的。"
      zh-TW: "閱讀和錄播課都要跟上；有同學建議 tutorial 坐在認真的同學旁邊，因為討論是分組進行的。"
      ja: "リーディングと録画講義についていく。チュートリアルはグループ討論なので、熱心な人の近くに座るとよいという声も一つ。"
      ko: "읽기 자료와 녹화 강의를 꾸준히 따라가라. 튜토리얼 토론이 조별이라 열심히 하는 사람 옆에 앉으라는 조언도 있다."
      vi: "Theo kịp bài đọc và bài giảng ghi sẵn; một người khuyên ngồi cạnh bạn chăm chỉ vì thảo luận tutorial theo nhóm."
      ms: "Ikuti bacaan dan kuliah rakaman; seorang pengulas sarankan duduk dengan rakan yang aktif kerana perbincangan tutorial dibuat dalam kumpulan."
      id: "Ikuti bacaan dan kuliah rekaman; satu pengulas menyarankan duduk dekat teman yang aktif karena diskusi tutorial dilakukan berkelompok."
      hi: "रीडिंग और रिकॉर्डेड लेक्चर के साथ चलें; एक रिव्यूअर सलाह देते हैं कि सक्रिय सहपाठियों के पास बैठें, क्योंकि ट्यूटोरियल चर्चा ग्रुप में होती है।"
  watch:
    - en: "Reviewers disagree on difficulty: some found it easy to follow with no background, while a recent one found the lectures assume prior knowledge and need a lot of research."
      zh: "难度看法不一：有人说零基础也容易跟上；最近也有同学觉得讲课默认你懂，要自己查很多资料。"
      zh-TW: "難度看法分歧：有人說零基礎也容易跟上；最近也有同學覺得上課預設你懂，要自己查很多資料。"
      ja: "難易度の評価は分かれる。予備知識なしでもついていけたという声と、最近は講義が前提知識ありきで調べ物が多いという声。"
      ko: "난이도는 의견이 갈린다. 배경 지식 없이도 따라가기 쉬웠다는 평과, 최근 강의가 사전 지식을 전제해 조사할 게 많다는 평이 있다."
      vi: "Ý kiến về độ khó khác nhau: có người thấy không cần nền tảng vẫn theo được, nhưng một người gần đây thấy bài giảng mặc định bạn đã biết và phải tự tìm hiểu nhiều."
      ms: "Pendapat tentang kesukaran berbeza: ada yang mudah ikut tanpa latar belakang, tetapi seorang pengulas terkini rasa kuliah anggap anda sudah tahu dan perlu banyak kajian."
      id: "Pendapat soal tingkat kesulitan berbeda: ada yang mudah mengikuti tanpa latar, tapi satu pengulas terbaru merasa kuliah menganggap kamu sudah tahu dan perlu banyak riset."
      hi: "कठिनाई पर राय बँटी है: कुछ को बिना बैकग्राउंड के भी आसान लगा, पर हाल के एक रिव्यूअर को लगा लेक्चर पहले से ज्ञान मानते हैं और बहुत रिसर्च चाहिए।"
workload: heavy
