points:
  - en: "First run in 2025, and all reviewers said it was poorly run, with little staff response and slow feedback."
    zh: "2025年首次开设，评价一致认为组织差，员工回应少、反馈慢。"
    zh-TW: "2025年首次開課，評價一致認為組織差，老師回應少、回饋慢。"
    ja: "2025年に初開講。レビューは全員、運営が悪く、教員の対応が少なくフィードバックも遅いと指摘。"
    ko: "2025년 처음 개설됐고, 모든 후기가 운영이 엉망이며 교수진 응답이 적고 피드백이 느리다고 했다."
    vi: "Mở lần đầu năm 2025, mọi đánh giá đều nói tổ chức kém, giảng viên ít phản hồi và nhận xét chậm."
    ms: "Pertama kali ditawarkan pada 2025, dan semua pengulas kata ia diurus dengan teruk, dengan sedikit respons staf dan maklum balas lambat."
    id: "Pertama dibuka pada 2025, dan semua ulasan bilang pengelolaannya buruk, pengajar jarang merespons dan feedback lambat."
    hi: "2025 में पहली बार चला, और सभी रिव्यू में खराब मैनेजमेंट, स्टाफ़ का कम जवाब और धीमा फ़ीडबैक बताया गया।"
  - en: "Workshops are compulsory for weekly quiz marks to count. This was not clearly announced, so check the rules early."
    zh: "必须参加研讨课每周测验才计分，此规定没讲清楚，务必提前确认。"
    zh-TW: "必須參加工作坊，每週測驗才計分；此規定沒講清楚，務必提早確認。"
    ja: "毎週の小テストの点数を得るにはワークショップ出席が必須。明確に告知されていなかったので、早めにルールを確認しよう。"
    ko: "주간 퀴즈 점수가 인정되려면 워크숍 참석이 필수다. 명확히 공지되지 않았으니 규칙을 일찍 확인하자."
    vi: "Phải dự workshop thì điểm quiz hằng tuần mới được tính. Điều này không được thông báo rõ, nên kiểm tra quy định sớm."
    ms: "Bengkel wajib dihadiri untuk markah kuiz mingguan dikira. Ini tidak diumumkan dengan jelas, jadi semak peraturan awal."
    id: "Workshop wajib dihadiri agar nilai kuis mingguan dihitung. Ini tidak diumumkan dengan jelas, jadi cek aturannya sejak awal."
    hi: "साप्ताहिक क्विज़ के मार्क्स गिने जाएँ, इसके लिए वर्कशॉप ज़रूरी हैं। यह साफ़ नहीं बताया गया, तो नियम जल्दी चेक करें।"
  - en: "Lectures were described as dry and often read word for word from text-heavy slides."
    zh: "讲课被形容枯燥，常照读文字密集的课件。"
    zh-TW: "講課被形容枯燥，常照唸文字密密麻麻的投影片。"
    ja: "講義は退屈で、文字だらけのスライドをそのまま読み上げることが多いとされた。"
    ko: "강의는 지루하고, 글자가 빽빽한 슬라이드를 그대로 읽는 경우가 많다고 한다."
    vi: "Bài giảng bị mô tả là khô khan, thường đọc nguyên văn từ slide dày chữ."
    ms: "Kuliah digambarkan membosankan dan selalu dibaca kata demi kata dari slaid yang penuh teks."
    id: "Kuliah disebut membosankan dan sering membaca kata per kata dari slide yang penuh teks."
    hi: "लेक्चर नीरस बताए गए, अक्सर टेक्स्ट से भरी स्लाइड्स से शब्दशः पढ़े जाते थे।"
