points:
  - en: "Applied, formula-based maths with almost no proofs, covering vector calculus, ODEs, Laplace and Fourier series."
    zh: "偏应用、套公式，几乎无证明，涵盖向量微积分、微分方程、拉普拉斯和傅里叶级数。"
    zh-TW: "偏應用、套公式，幾乎沒有證明，涵蓋向量微積分、常微分方程、拉普拉斯和傅立葉級數。"
    ja: "証明はほぼなく、公式中心の応用数学。ベクトル解析、常微分方程式、ラプラス変換、フーリエ級数を扱う。"
    ko: "증명이 거의 없는 공식 위주 응용수학으로, 벡터 미적분, 상미분방정식, 라플라스, 푸리에 급수를 다룬다."
    vi: "Toán ứng dụng dựa vào công thức, gần như không chứng minh, gồm giải tích vectơ, ODE, Laplace và chuỗi Fourier."
    ms: "Matematik gunaan berasaskan formula hampir tanpa bukti, merangkumi kalkulus vektor, ODE, Laplace dan siri Fourier."
    id: "Matematika terapan berbasis rumus nyaris tanpa pembuktian, mencakup kalkulus vektor, PDB, Laplace, dan deret Fourier."
    hi: "लगभग बिना प्रूफ़ का, फ़ॉर्मूला-आधारित अप्लाइड मैथ्स: वेक्टर कैलकुलस, ODE, लाप्लास और फ़ूरिये सीरीज़।"
  - en: "Exams are time-pressured, so practise to work fast; the exam is heavily weighted."
    zh: "考试时间紧，要多练提高速度；考试占比很高。"
    zh-TW: "考試時間緊，要多練習提升速度；考試占比很高。"
    ja: "試験は時間が厳しいので、速く解けるよう練習を。試験の比重は大きい。"
    ko: "시험 시간이 빠듯하니 빨리 풀도록 연습하자. 시험 비중이 크다."
    vi: "Thi gấp thời gian, nên luyện để làm nhanh; bài thi chiếm tỷ trọng lớn."
    ms: "Peperiksaan suntuk masa, jadi berlatih untuk cepat; peperiksaan berwajaran tinggi."
    id: "Ujian mepet waktu, jadi latihan agar cepat; bobot ujiannya besar."
    hi: "एग्ज़ाम में समय कम पड़ता है, तेज़ी के लिए प्रैक्टिस करें; एग्ज़ाम का वेट ज़्यादा है।"
  - en: "Assignments are tricky and pedantically marked, so show all working."
    zh: "作业有难度且评分苛刻，要写出全部步骤。"
    zh-TW: "作業有難度且評分挑剔，要寫出所有步驟。"
    ja: "課題は手ごわく採点も細かいので、途中式はすべて書こう。"
    ko: "과제는 까다롭고 채점이 깐깐하니 풀이 과정을 모두 쓰자."
    vi: "Bài tập hóc búa và chấm rất kỹ, nên ghi đủ mọi bước."
    ms: "Tugasan rumit dan dimarkah dengan cerewet, jadi tunjukkan semua langkah kerja."
    id: "Tugasnya rumit dan dinilai sangat teliti, jadi tulis semua langkah."
    hi: "असाइनमेंट पेचीदा हैं और बारीकी से मार्क होते हैं, तो सारे स्टेप लिखें।"
  - en: "Well organised; keep up and complete the problem booklet."
    zh: "课程组织良好，跟上进度并做完习题册。"
    zh-TW: "課程組織良好，跟上進度並做完習題本。"
    ja: "運営は良好。遅れずに問題集をやり切ろう。"
    ko: "운영이 잘 된다. 진도를 따라가고 문제집을 끝내자."
    vi: "Tổ chức tốt; theo kịp và làm hết cuốn bài tập."
    ms: "Teratur; ikuti rentak dan siapkan buku soalan."
    id: "Tertata baik; ikuti terus dan selesaikan buku soal."
    hi: "अच्छी तरह ऑर्गनाइज़्ड; साथ बने रहें और प्रॉब्लम बुकलेट पूरी करें।"
sections:
  content:
    - en: "Vector calculus, differential equations, series, Laplace, Fourier and PDEs in one subject, with almost no proofs. Mostly recognising question types and applying formulas; PDEs are often the hardest part."
      zh: "一门课里包含向量微积分、微分方程、级数、拉普拉斯、傅里叶和偏微分方程，几乎没有证明。主要是认题型、套公式；偏微分方程常被说最难。"
      zh-TW: "一門課裡包含向量微積分、微分方程、級數、拉普拉斯、傅立葉和偏微分方程，幾乎沒有證明。主要是認題型、套公式；偏微分方程常被說最難。"
      ja: "ベクトル解析、微分方程式、級数、ラプラス、フーリエ、偏微分方程式を1科目で扱い、証明はほぼない。問題の型を見抜いて公式を当てはめるのが中心。偏微分方程式が一番難しいという声が多い。"
      ko: "벡터 미적분, 미분방정식, 급수, 라플라스, 푸리에, 편미분방정식을 한 과목에서 다루며 증명은 거의 없다. 주로 문제 유형을 알아보고 공식을 적용한다. 편미분방정식이 가장 어렵다는 평이 많다."
      vi: "Giải tích vector, phương trình vi phân, chuỗi, Laplace, Fourier và PDE trong một môn, gần như không chứng minh. Chủ yếu nhận dạng câu hỏi và áp công thức; PDE thường là phần khó nhất."
      ms: "Kalkulus vektor, persamaan pembezaan, siri, Laplace, Fourier dan PDE dalam satu subjek, hampir tiada bukti. Kebanyakannya kenal jenis soalan dan guna formula; PDE sering bahagian paling sukar."
      id: "Kalkulus vektor, persamaan diferensial, deret, Laplace, Fourier dan PDP dalam satu mata kuliah, hampir tanpa bukti. Kebanyakan mengenali tipe soal dan memakai rumus; PDP sering bagian tersulit."
      hi: "वेक्टर कैलकुलस, अवकल समीकरण, श्रेणियाँ, लाप्लास, फ़ूरियर और PDE एक ही विषय में, लगभग बिना प्रमाण। ज़्यादातर सवाल का प्रकार पहचानना और सूत्र लगाना; PDE अक्सर सबसे कठिन हिस्सा।"
  work:
    - en: "Assignments are tricky and marked pedantically, so show all working. The exam carries most of the grade, about 65% in a recent review, and the main difficulty is time pressure."
      zh: "作业有难度、扣分很细，所以每一步都要写。期末占大头（近期有同学说约 65%），主要难在时间紧。"
      zh-TW: "作業有難度、扣分很細，所以每一步都要寫。期末占大頭（近期有同學說約 65%），主要難在時間緊。"
      ja: "課題は難しく採点も細かいので途中式は全部書く。成績の大半は期末（最近のレビューでは約65%）で、主な難しさは時間の厳しさ。"
      ko: "과제는 까다롭고 채점이 세세하니 풀이 과정을 모두 써라. 성적 대부분이 기말(최근 리뷰로는 약 65%)이고, 주된 어려움은 시간 압박이다."
      vi: "Bài tập khá khó và chấm rất kỹ, nên ghi đủ các bước. Thi cuối chiếm phần lớn điểm (khoảng 65% theo một đánh giá gần đây), khó chủ yếu vì áp lực thời gian."
      ms: "Tugasan agak rumit dan dinilai dengan teliti, jadi tunjuk semua jalan kerja. Peperiksaan membawa kebanyakan gred, kira-kira 65% menurut ulasan terkini, dan kesukaran utama ialah tekanan masa."
      id: "Tugas cukup rumit dan dinilai sangat teliti, jadi tulis semua langkah. Ujian akhir memegang sebagian besar nilai, sekitar 65% menurut ulasan terbaru, dan kesulitan utamanya tekanan waktu."
      hi: "असाइनमेंट पेचीदा हैं और बारीकी से जाँचे जाते हैं, इसलिए हर क़दम लिखें। ग्रेड का बड़ा हिस्सा परीक्षा का है, एक हालिया रिव्यू के अनुसार लगभग 65%, और मुख्य कठिनाई समय का दबाव है।"
  study:
    - en: "Keep up each week and finish the problem booklet; one reviewer says everything in tutorials, assignments and the booklet can appear on the exam. Practise for speed."
      zh: "每周跟上，把 problem booklet 做完；有同学说 tutorial、作业和 booklet 里的东西都可能考。多练速度。"
      zh-TW: "每週跟上，把 problem booklet 做完；有同學說 tutorial、作業和 booklet 裡的東西都可能考。多練速度。"
      ja: "毎週ついていき、問題集をやり切る。チュートリアル、課題、問題集の内容はすべて試験に出うるという人も。スピードを鍛える。"
      ko: "매주 진도를 따라가고 문제집을 끝내라. 튜토리얼, 과제, 문제집 내용이 모두 시험에 나올 수 있다는 사람도 있다. 속도를 연습하라."
      vi: "Theo kịp mỗi tuần và làm hết problem booklet; một người nói mọi thứ trong tutorial, bài tập và booklet đều có thể ra thi. Luyện tốc độ."
      ms: "Ikut rentak setiap minggu dan siapkan buku masalah; seorang kata semua dalam tutorial, tugasan dan buku itu boleh keluar dalam peperiksaan. Latih kelajuan."
      id: "Ikuti tiap minggu dan selesaikan buku soal; satu pengulas bilang semua isi tutorial, tugas dan buku soal bisa keluar di ujian. Latih kecepatan."
      hi: "हर हफ़्ते साथ चलें और प्रॉब्लम बुकलेट पूरी करें; एक के अनुसार ट्यूटोरियल, असाइनमेंट और बुकलेट का सब कुछ परीक्षा में आ सकता है। तेज़ी का अभ्यास करें।"
  watch:
    - en: "Maths students may find it unsatisfying with no proofs; one reviewer suggests those in maths-heavy engineering streams also take Vector Calculus and Differential Equations."
      zh: "数学专业的同学可能会觉得没有证明不过瘾；有人建议数学要求高的工程方向再去修向量微积分和微分方程。"
      zh-TW: "數學主修的同學可能會覺得沒有證明不過癮；有人建議數學要求高的工程方向再去修向量微積分和微分方程。"
      ja: "証明がないので数学専攻には物足りないかも。数学の比重が大きい工学分野ならベクトル解析と微分方程式も取るよう勧める人も。"
      ko: "증명이 없어 수학 전공생에겐 아쉬울 수 있다. 수학 비중이 큰 공학 분야라면 벡터 미적분과 미분방정식도 들으라는 사람도 있다."
      vi: "Sinh viên toán có thể thấy thiếu vì không có chứng minh; một người khuyên ai theo ngành kỹ thuật nặng toán nên học thêm Vector Calculus và Differential Equations."
      ms: "Pelajar matematik mungkin tidak puas kerana tiada bukti; seorang cadang mereka dalam aliran kejuruteraan berat matematik juga ambil Vector Calculus dan Differential Equations."
      id: "Mahasiswa matematika mungkin kurang puas karena tanpa bukti; satu menyarankan yang di jalur teknik berat matematika juga mengambil Vector Calculus dan Differential Equations."
      hi: "गणित के छात्रों को बिना प्रमाण के यह अधूरा लग सकता है; एक सुझाव देता है कि गणित-भारी इंजीनियरिंग वाले Vector Calculus और Differential Equations भी लें।"
