points:
  - en: "Applied, formula-based maths with almost no proofs, covering vector calculus, ODEs, Laplace and Fourier series."
    zh: "偏应用、套公式，几乎无证明，涵盖向量微积分、微分方程、拉普拉斯和傅里叶级数。"
    zh-TW: "偏應用、套公式，幾乎沒有證明，涵蓋向量微積分、常微分方程、拉普拉斯和傅立葉級數。"
    ja: "証明はほぼなく、公式中心の応用数学。ベクトル解析、常微分方程式、ラプラス変換、フーリエ級数を扱う。"
    ko: "증명이 거의 없는 공식 위주 응용수학으로, 벡터 미적분, 상미분방정식, 라플라스, 푸리에 급수를 다룬다."
    vi: "Toán ứng dụng dựa vào công thức, gần như không chứng minh, gồm giải tích vectơ, ODE, Laplace và chuỗi Fourier."
    ms: "Matematik gunaan berasaskan formula hampir tanpa bukti, merangkumi kalkulus vektor, ODE, Laplace dan siri Fourier."
    id: "Matematika terapan berbasis rumus nyaris tanpa pembuktian, mencakup kalkulus vektor, PDB, Laplace, dan deret Fourier."
    hi: "लगभग बिना प्रूफ़ का, फ़ॉर्मूला-आधारित अप्लाइड मैथ्स: वेक्टर कैलकुलस, ODE, लाप्लास और फ़ूरिये सीरीज़।"
  - en: "Exams are time-pressured, so practise to work fast; the exam is heavily weighted."
    zh: "考试时间紧，要多练提高速度；考试占比很高。"
    zh-TW: "考試時間緊，要多練習提升速度；考試占比很高。"
    ja: "試験は時間が厳しいので、速く解けるよう練習を。試験の比重は大きい。"
    ko: "시험 시간이 빠듯하니 빨리 풀도록 연습하자. 시험 비중이 크다."
    vi: "Thi gấp thời gian, nên luyện để làm nhanh; bài thi chiếm tỷ trọng lớn."
    ms: "Peperiksaan suntuk masa, jadi berlatih untuk cepat; peperiksaan berwajaran tinggi."
    id: "Ujian mepet waktu, jadi latihan agar cepat; bobot ujiannya besar."
    hi: "एग्ज़ाम में समय कम पड़ता है, तेज़ी के लिए प्रैक्टिस करें; एग्ज़ाम का वेट ज़्यादा है।"
  - en: "Assignments are tricky and pedantically marked, so show all working."
    zh: "作业有难度且评分苛刻，要写出全部步骤。"
    zh-TW: "作業有難度且評分挑剔，要寫出所有步驟。"
    ja: "課題は手ごわく採点も細かいので、途中式はすべて書こう。"
    ko: "과제는 까다롭고 채점이 깐깐하니 풀이 과정을 모두 쓰자."
    vi: "Bài tập hóc búa và chấm rất kỹ, nên ghi đủ mọi bước."
    ms: "Tugasan rumit dan dimarkah dengan cerewet, jadi tunjukkan semua langkah kerja."
    id: "Tugasnya rumit dan dinilai sangat teliti, jadi tulis semua langkah."
    hi: "असाइनमेंट पेचीदा हैं और बारीकी से मार्क होते हैं, तो सारे स्टेप लिखें।"
  - en: "Well organised; keep up and complete the problem booklet."
    zh: "课程组织良好，跟上进度并做完习题册。"
    zh-TW: "課程組織良好，跟上進度並做完習題本。"
    ja: "運営は良好。遅れずに問題集をやり切ろう。"
    ko: "운영이 잘 된다. 진도를 따라가고 문제집을 끝내자."
    vi: "Tổ chức tốt; theo kịp và làm hết cuốn bài tập."
    ms: "Teratur; ikuti rentak dan siapkan buku soalan."
    id: "Tertata baik; ikuti terus dan selesaikan buku soal."
    hi: "अच्छी तरह ऑर्गनाइज़्ड; साथ बने रहें और प्रॉब्लम बुकलेट पूरी करें।"
