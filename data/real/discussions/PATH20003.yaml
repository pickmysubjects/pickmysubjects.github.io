  - en: "Reports and lab books are marked harshly, and marking depends heavily on your demonstrator."
    zh: "报告和实验记录评分严格，很大程度取决于助教。"
  - en: "The pracs themselves are interesting and give a good taste of lab pathology."
    zh: "实验本身有趣，能很好体验病理实验工作。"
  - en: "Several reviewers suggest BCMB20005 as a better-run alternative for lab skills."
    zh: "多人建议想练实验技能可改选组织更好的BCMB20005。"
