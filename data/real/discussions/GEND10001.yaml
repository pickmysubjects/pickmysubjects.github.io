code: GEND10001
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/gend10001
reviews: 10
from: 2018
to: 2026
checked: 2026-10-17
points:
  - en: "Many reviewers, including science students taking it as a breadth, found it eye-opening and enjoyed the lectures and discussions."
    zh: "许多评论者，包括把它当跨学科选修的理科生，都觉得开阔了眼界，也喜欢讲座和讨论。"
    zh-TW: "許多評論者，包括把它當Breadth選修的理科生，都覺得開闊了眼界，也喜歡講課和討論。"
    ja: "Breadthとして取った理系学生も含め、多くの人が視野が広がったと感じ、講義と議論を楽しんだ。"
    ko: "Breadth로 들은 이과생을 포함해 많은 리뷰어가 시야가 넓어졌다고 느꼈고 강의와 토론을 즐김."
    vi: "Nhiều người, kể cả sinh viên khoa học học làm Breadth, thấy mở mang tầm mắt và thích bài giảng lẫn thảo luận."
    ms: "Ramai pengulas, termasuk pelajar sains yang mengambilnya sebagai Breadth, dapati ia membuka mata dan menikmati kuliah serta perbincangan."
    id: "Banyak pengulas, termasuk mahasiswa sains yang mengambilnya sebagai Breadth, merasa wawasannya terbuka dan menikmati kuliah serta diskusi."
    hi: "कई रिव्यूअर्स, जिनमें इसे Breadth के रूप में लेने वाले साइंस छात्र भी हैं, को यह आँखें खोलने वाला लगा और लेक्चर व चर्चाएँ पसंद आईं।"
  - en: "Readings are heavy, and there is regular reflective journal writing (plus alternating quizzes in 2026), so you need to keep up every week."
    zh: "阅读量大，还要定期写反思日志（2026年还有交替进行的小测验），所以每周都得跟上。"
    zh-TW: "閱讀量大，還要定期寫反思日誌（2026年還有交替進行的小測驗），所以每週都得跟上。"
    ja: "読み物が多く、定期的な振り返りジャーナル（2026年は交互にクイズも）があるので、毎週ついていく必要がある。"
    ko: "읽기 자료가 많고 정기적인 성찰 저널(2026년엔 번갈아 퀴즈도)이 있어 매주 따라가야 함."
    vi: "Đọc nhiều, lại phải viết nhật ký suy ngẫm định kỳ (năm 2026 xen kẽ thêm quiz), nên phải theo kịp mỗi tuần."
    ms: "Bacaan berat, dan ada penulisan jurnal reflektif secara tetap (serta kuiz berselang pada 2026), jadi anda perlu ikut rentak setiap minggu."
    id: "Bacaannya berat, dan ada penulisan jurnal reflektif rutin (plus kuis berselang di 2026), jadi kamu harus mengikuti tiap minggu."
    hi: "रीडिंग्स भारी हैं, और नियमित रिफ़्लेक्टिव जर्नल लिखना होता है (2026 में बीच-बीच में क्विज़ भी), इसलिए हर हफ़्ते साथ चलना ज़रूरी है।"
  - en: "Not a WAM booster: 2018-2021 reviewers mention harsh marking, and tutorial quality depended on your tutor."
    zh: "不是拉高WAM的课：2018-2021年的评论者提到评分严格，辅导课质量取决于辅导老师。"
    zh-TW: "不是拉高WAM的課：2018-2021年的評論者提到評分嚴格，輔導課品質取決於助教。"
    ja: "WAMを上げる科目ではない。2018〜2021年のレビューでは採点が厳しく、チュートリアルの質はチューター次第とのこと。"
    ko: "WAM 올리기용 아님. 2018~2021년 리뷰어들은 채점이 엄격하고 튜토리얼 질이 튜터에 따라 다르다고 함."
    vi: "Không phải môn kéo WAM: người đánh giá 2018-2021 nhắc chấm khắt khe, và chất lượng tutorial tùy tutor."
    ms: "Bukan penaik WAM: pengulas 2018-2021 menyebut pemarkahan ketat, dan kualiti tutorial bergantung pada tutor."
    id: "Bukan pendongkrak WAM: pengulas 2018-2021 menyebut penilaian ketat, dan kualitas tutorial tergantung tutornya."
    hi: "WAM बढ़ाने वाला विषय नहीं: 2018-2021 के रिव्यूअर्स ने सख़्त मार्किंग बताई, और ट्यूटोरियल की गुणवत्ता ट्यूटर पर निर्भर थी।"
sections:
  content:
    - en: "Each week covers a different contemporary gender issue. Many breadth students, including science students, enjoyed it and found it changed how they think about gender."
      zh: "每周讲一个不同的当代性别议题。很多 breadth 学生（包括理科生）很喜欢，觉得改变了自己对性别的看法。"
      zh-TW: "每週講一個不同的當代性別議題。很多 breadth 學生（包括理科生）很喜歡，覺得改變了自己對性別的看法。"
      ja: "毎週異なる現代のジェンダー問題を扱う。理系を含む多くのブレッドス生が楽しみ、ジェンダー観が変わったと言う。"
      ko: "매주 다른 현대 젠더 이슈를 다룬다. 이과생을 포함한 많은 브레드스 학생이 즐겼고 젠더에 대한 생각이 바뀌었다고 한다."
      vi: "Mỗi tuần một vấn đề giới hiện đại khác nhau. Nhiều sinh viên breadth, kể cả khối khoa học, rất thích và thấy thay đổi cách nghĩ về giới."
      ms: "Setiap minggu membincangkan isu gender semasa yang berbeza. Ramai pelajar breadth, termasuk pelajar sains, suka dan rasa ia mengubah cara fikir tentang gender."
      id: "Tiap minggu membahas isu gender kontemporer yang berbeda. Banyak mahasiswa breadth, termasuk dari sains, menikmatinya dan merasa cara pandang soal gender berubah."
      hi: "हर हफ़्ते एक अलग समकालीन जेंडर मुद्दा। साइंस छात्रों समेत कई ब्रेड्थ छात्रों को पसंद आया और जेंडर पर सोच बदली लगी।"
  work:
    - en: "A reflective journal through the semester (small regular entries), quizzes in recent years, and essays including a short final one. Several say it's not easy and a few found the marking harsh."
      zh: "整学期写反思日志（定期写短篇），近年还有小测，以及 essay（期末那篇较短）。好几位说不算简单，也有几人觉得改分严。"
      zh-TW: "整學期寫反思日誌（定期寫短篇），近年還有小考，以及 essay（期末那篇較短）。好幾位說不算簡單，也有幾人覺得給分嚴。"
      ja: "学期を通じた振り返りジャーナル（定期的な短い記入）、近年はクイズ、そしてエッセイ（最終は短め）。簡単ではないという声が複数、採点が厳しいという人も数人。"
      ko: "학기 내내 쓰는 성찰 일지(정기적인 짧은 글), 최근엔 퀴즈, 그리고 에세이(기말은 짧음). 쉽지 않다는 리뷰가 여럿이고 채점이 가혹하다는 사람도 몇 명."
      vi: "Nhật ký suy ngẫm suốt học kỳ (viết ngắn định kỳ), quiz ở các năm gần đây, và bài luận, bài cuối khá ngắn. Vài người nói không dễ, vài người thấy chấm gắt."
      ms: "Jurnal refleksi sepanjang semester (catatan kecil berkala), kuiz pada tahun-tahun kebelakangan, dan esei termasuk esei akhir yang pendek. Beberapa kata tidak mudah dan ada yang rasa pemarkahan keras."
      id: "Jurnal reflektif sepanjang semester (catatan singkat rutin), kuis di tahun-tahun terakhir, dan esai termasuk esai akhir yang pendek. Beberapa bilang tidak mudah dan ada yang merasa penilaian keras."
      hi: "पूरे सेमेस्टर रिफ़्लेक्टिव जर्नल (छोटी नियमित प्रविष्टियाँ), हाल के सालों में क्विज़, और निबंध, अंतिम वाला छोटा। कई कहते हैं आसान नहीं, कुछ को मार्किंग सख़्त लगी।"
  study:
    - en: "Readings are heavy and drive the tutorials, so keep on top of them and don't leave journal entries to the end. Speaking up in tutorials makes a big difference."
      zh: "阅读量大，tutorial 围绕阅读展开，要跟上，日志别拖到最后。在 tutorial 多发言差别很大。"
      zh-TW: "閱讀量大，tutorial 圍繞閱讀進行，要跟上，日誌別拖到最後。在 tutorial 多發言差別很大。"
      ja: "文献が多くチュートリアルはそれを中心に進むので遅れないこと。ジャーナルを最後まで溜めないように。チュートリアルで発言すると大きく違う。"
      ko: "읽기가 많고 튜토리얼이 그것을 중심으로 진행되니 따라가자. 일지를 마지막까지 미루지 말자. 튜토리얼에서 발언하면 차이가 크다."
      vi: "Bài đọc nhiều và là trọng tâm của tutorial, nên theo kịp và đừng để nhật ký dồn đến cuối. Phát biểu trong tutorial tạo khác biệt lớn."
      ms: "Bacaan berat dan jadi teras tutorial, jadi ikuti dan jangan tangguh catatan jurnal hingga akhir. Bercakap dalam tutorial beri perbezaan besar."
      id: "Bacaannya berat dan jadi inti tutorial, jadi ikuti terus dan jangan tunda jurnal sampai akhir. Aktif bicara di tutorial sangat berpengaruh."
      hi: "रीडिंग भारी है और ट्यूटोरियल उसी पर चलते हैं, तो साथ रहें और जर्नल अंत तक न टालें। ट्यूटोरियल में बोलने से बड़ा फ़र्क पड़ता है।"
  watch:
    - en: "Most reviews describe the subject under its earlier name, Sex, Gender and Culture, so the current version may differ."
      zh: "大部分评价写的是它的旧名 Sex, Gender and Culture，现在的版本可能不一样。"
      zh-TW: "大部分評價寫的是它的舊名 Sex, Gender and Culture，現在的版本可能不同。"
      ja: "レビューの多くは旧名称Sex, Gender and Cultureの頃のもので、現在の内容とは違う可能性がある。"
      ko: "대부분의 리뷰는 예전 이름 Sex, Gender and Culture 시절의 것이라 현재 버전과 다를 수 있다."
      vi: "Phần lớn đánh giá nói về môn dưới tên cũ Sex, Gender and Culture, nên bản hiện tại có thể khác."
      ms: "Kebanyakan ulasan menggambarkan subjek dengan nama lamanya, Sex, Gender and Culture, jadi versi semasa mungkin berbeza."
      id: "Sebagian besar ulasan membahas mata kuliah dengan nama lamanya, Sex, Gender and Culture, jadi versi sekarang mungkin berbeda."
      hi: "ज़्यादातर रिव्यू इसके पुराने नाम Sex, Gender and Culture के समय के हैं, इसलिए मौजूदा रूप अलग हो सकता है।"
workload: heavy
