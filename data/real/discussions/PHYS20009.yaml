points:
  - en: "The workload is very heavy, with many reports. Several call it the most stressful subject they took and suggest underloading."
    zh: "工作量很大，报告很多；多人称这是压力最大的课，建议减少同期选课。"
    zh-TW: "工作量很大，報告很多；多人稱這是壓力最大的課，建議減少同期選課。"
    ja: "課題量がとても多く、レポートも多いです。今まで取った中で一番ストレスが大きかったという声が複数あり、履修数を減らすよう勧めています。"
    ko: "과제량이 매우 많고 보고서도 많습니다. 들은 과목 중 가장 스트레스가 컸다는 사람이 여럿이고 수강 과목 수를 줄이라고 권합니다."
    vi: "Khối lượng rất nặng, nhiều báo cáo. Một số người gọi đây là môn áp lực nhất họ từng học và khuyên nên học ít môn hơn kỳ đó."
    ms: "Beban kerja sangat berat, dengan banyak laporan. Beberapa kata ia subjek paling tertekan pernah diambil dan cadangkan kurangkan beban subjek."
    id: "Beban kerjanya sangat berat dengan banyak laporan. Beberapa menyebutnya mata kuliah paling bikin stres dan menyarankan ambil SKS lebih sedikit."
    hi: "वर्कलोड बहुत भारी है, कई रिपोर्ट्स हैं। कई लोग इसे अपना सबसे तनाव भरा सब्जेक्ट बताते हैं और कम सब्जेक्ट लेने की सलाह देते हैं।"
  - en: "Your experience depends a lot on your randomly assigned group. Weekly 3-hour labs build close bonds."
    zh: "体验很大程度取决于随机分到的小组，每周3小时的实验课让组员关系紧密。"
    zh-TW: "體驗很大程度取決於隨機分到的小組，每週3小時的實驗課讓組員關係緊密。"
    ja: "体験はランダムに割り当てられるグループに大きく左右されます。毎週3時間の実験で仲が深まります。"
    ko: "경험은 무작위로 배정되는 조에 크게 좌우됩니다. 매주 3시간 실험으로 조원들과 가까워집니다."
    vi: "Trải nghiệm phụ thuộc nhiều vào nhóm được xếp ngẫu nhiên. Các buổi lab 3 giờ mỗi tuần giúp mọi người gắn bó."
    ms: "Pengalaman anda banyak bergantung pada kumpulan yang ditetapkan secara rawak. Makmal 3 jam setiap minggu merapatkan hubungan."
    id: "Pengalamanmu sangat tergantung kelompok yang dibagi acak. Lab 3 jam tiap minggu membuat kalian akrab."
    hi: "आपका अनुभव काफी हद तक रैंडम ग्रुप पर निर्भर है। हर हफ्ते 3 घंटे की लैब से अच्छी दोस्ती बनती है।"
  - en: "Marking is strict and detail-focused. Follow the rubric closely and note the hints demonstrators give in class."
    zh: "评分严格注重细节；要紧扣评分标准，并记下助教课上给的提示。"
    zh-TW: "評分嚴格注重細節；要緊扣評分標準，並記下助教課上給的提示。"
    ja: "採点は厳しく細部重視です。ルーブリックにしっかり従い、デモンストレーターが授業中に出すヒントをメモしましょう。"
    ko: "채점은 엄격하고 세부 사항을 봅니다. 루브릭을 꼼꼼히 따르고 조교가 수업 중 주는 힌트를 적어두세요."
    vi: "Chấm điểm nghiêm và chú trọng chi tiết. Bám sát rubric và ghi lại gợi ý người hướng dẫn đưa ra trên lớp."
    ms: "Pemarkahan ketat dan fokus pada butiran. Ikut rubrik dengan teliti dan catat petunjuk demonstrator dalam kelas."
    id: "Penilaian ketat dan detail. Ikuti rubrik dengan cermat dan catat petunjuk dari asisten lab di kelas."
    hi: "मार्किंग सख्त और डिटेल पर ध्यान देने वाली है। रूब्रिक को ध्यान से फॉलो करें और क्लास में डेमोंस्ट्रेटर के दिए हिंट्स नोट करें।"
  - en: "Submit full drafts for feedback on the final report; reviewers say this lifts marks. Taking it alongside PHYS20008 helps."
    zh: "期末报告务必提交完整草稿获取反馈，评价说能明显提分；与PHYS20008同修有帮助。"
    zh-TW: "期末報告務必提交完整草稿取得回饋，評價說能明顯提分；與PHYS20008同修有幫助。"
    ja: "最終レポートは完成した下書きを出してフィードバックをもらいましょう。点数が上がるそうです。PHYS20008と一緒に取ると役立ちます。"
    ko: "최종 보고서는 완성된 초안을 내서 피드백을 받으세요. 점수가 오른다고 합니다. PHYS20008과 함께 들으면 도움이 됩니다."
    vi: "Nộp bản nháp hoàn chỉnh để nhận phản hồi cho báo cáo cuối; người đánh giá nói việc này giúp tăng điểm. Học cùng PHYS20008 có ích."
    ms: "Hantar draf penuh untuk maklum balas laporan akhir; pengulas kata ini menaikkan markah. Mengambilnya bersama PHYS20008 membantu."
    id: "Kirim draf lengkap untuk mendapat feedback laporan akhir; pengulas bilang ini menaikkan nilai. Mengambilnya bersama PHYS20008 membantu."
    hi: "फाइनल रिपोर्ट पर फीडबैक के लिए पूरा ड्राफ्ट जमा करें; रिव्यूअर्स कहते हैं इससे मार्क्स बढ़ते हैं। PHYS20008 के साथ लेना मदद करता है।"
workload: heavy
