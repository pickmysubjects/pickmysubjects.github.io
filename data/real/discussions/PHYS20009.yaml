code: PHYS20009
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/phys20009
reviews: 10
from: 2020
to: 2026
checked: 2026-10-08
points:
  - en: "The workload is very heavy, with many reports. Several call it the most stressful subject they took and suggest underloading."
    zh: "工作量很大，报告很多；多人称这是压力最大的课，建议减少同期选课。"
    zh-TW: "工作量很大，報告很多；多人稱這是壓力最大的課，建議減少同期選課。"
    ja: "課題量がとても多く、レポートも多いです。今まで取った中で一番ストレスが大きかったという声が複数あり、履修数を減らすよう勧めています。"
    ko: "과제량이 매우 많고 보고서도 많습니다. 들은 과목 중 가장 스트레스가 컸다는 사람이 여럿이고 수강 과목 수를 줄이라고 권합니다."
    vi: "Khối lượng rất nặng, nhiều báo cáo. Một số người gọi đây là môn áp lực nhất họ từng học và khuyên nên học ít môn hơn kỳ đó."
    ms: "Beban kerja sangat berat, dengan banyak laporan. Beberapa kata ia subjek paling tertekan pernah diambil dan cadangkan kurangkan beban subjek."
    id: "Beban kerjanya sangat berat dengan banyak laporan. Beberapa menyebutnya mata kuliah paling bikin stres dan menyarankan ambil SKS lebih sedikit."
    hi: "वर्कलोड बहुत भारी है, कई रिपोर्ट्स हैं। कई लोग इसे अपना सबसे तनाव भरा सब्जेक्ट बताते हैं और कम सब्जेक्ट लेने की सलाह देते हैं।"
  - en: "Your experience depends a lot on your randomly assigned group. Weekly 3-hour labs build close bonds."
    zh: "体验很大程度取决于随机分到的小组，每周3小时的实验课让组员关系紧密。"
    zh-TW: "體驗很大程度取決於隨機分到的小組，每週3小時的實驗課讓組員關係緊密。"
    ja: "体験はランダムに割り当てられるグループに大きく左右されます。毎週3時間の実験で仲が深まります。"
    ko: "경험은 무작위로 배정되는 조에 크게 좌우됩니다. 매주 3시간 실험으로 조원들과 가까워집니다."
    vi: "Trải nghiệm phụ thuộc nhiều vào nhóm được xếp ngẫu nhiên. Các buổi lab 3 giờ mỗi tuần giúp mọi người gắn bó."
    ms: "Pengalaman anda banyak bergantung pada kumpulan yang ditetapkan secara rawak. Makmal 3 jam setiap minggu merapatkan hubungan."
    id: "Pengalamanmu sangat tergantung kelompok yang dibagi acak. Lab 3 jam tiap minggu membuat kalian akrab."
    hi: "आपका अनुभव काफी हद तक रैंडम ग्रुप पर निर्भर है। हर हफ्ते 3 घंटे की लैब से अच्छी दोस्ती बनती है।"
  - en: "Marking is strict and detail-focused. Follow the rubric closely and note the hints demonstrators give in class."
    zh: "评分严格注重细节；要紧扣评分标准，并记下助教课上给的提示。"
    zh-TW: "評分嚴格注重細節；要緊扣評分標準，並記下助教課上給的提示。"
    ja: "採点は厳しく細部重視です。ルーブリックにしっかり従い、デモンストレーターが授業中に出すヒントをメモしましょう。"
    ko: "채점은 엄격하고 세부 사항을 봅니다. 루브릭을 꼼꼼히 따르고 조교가 수업 중 주는 힌트를 적어두세요."
    vi: "Chấm điểm nghiêm và chú trọng chi tiết. Bám sát rubric và ghi lại gợi ý người hướng dẫn đưa ra trên lớp."
    ms: "Pemarkahan ketat dan fokus pada butiran. Ikut rubrik dengan teliti dan catat petunjuk demonstrator dalam kelas."
    id: "Penilaian ketat dan detail. Ikuti rubrik dengan cermat dan catat petunjuk dari asisten lab di kelas."
    hi: "मार्किंग सख्त और डिटेल पर ध्यान देने वाली है। रूब्रिक को ध्यान से फॉलो करें और क्लास में डेमोंस्ट्रेटर के दिए हिंट्स नोट करें।"
  - en: "Submit full drafts for feedback on the final report; reviewers say this lifts marks. Taking it alongside PHYS20008 helps."
    zh: "期末报告务必提交完整草稿获取反馈，评价说能明显提分；与PHYS20008同修有帮助。"
    zh-TW: "期末報告務必提交完整草稿取得回饋，評價說能明顯提分；與PHYS20008同修有幫助。"
    ja: "最終レポートは完成した下書きを出してフィードバックをもらいましょう。点数が上がるそうです。PHYS20008と一緒に取ると役立ちます。"
    ko: "최종 보고서는 완성된 초안을 내서 피드백을 받으세요. 점수가 오른다고 합니다. PHYS20008과 함께 들으면 도움이 됩니다."
    vi: "Nộp bản nháp hoàn chỉnh để nhận phản hồi cho báo cáo cuối; người đánh giá nói việc này giúp tăng điểm. Học cùng PHYS20008 có ích."
    ms: "Hantar draf penuh untuk maklum balas laporan akhir; pengulas kata ini menaikkan markah. Mengambilnya bersama PHYS20008 membantu."
    id: "Kirim draf lengkap untuk mendapat feedback laporan akhir; pengulas bilang ini menaikkan nilai. Mengambilnya bersama PHYS20008 membantu."
    hi: "फाइनल रिपोर्ट पर फीडबैक के लिए पूरा ड्राफ्ट जमा करें; रिव्यूअर्स कहते हैं इससे मार्क्स बढ़ते हैं। PHYS20008 के साथ लेना मदद करता है।"
sections:
  content:
    - en: "A hands-on research and lab-skills subject with no lectures, just pre-tutorial videos and a weekly 3-hour prac in an assigned group. Pairs well with Human Physiology taken at the same time."
      zh: "偏动手的科研和实验技能课，没有讲座，只有课前视频和每周三小时的分组实验。和 Human Physiology 同时修会互相帮助。"
      zh-TW: "偏動手的研究和實驗技能課，沒有講座，只有課前影片和每週三小時的分組實驗。跟 Human Physiology 同時修會互相幫助。"
      ja: "実践的な研究・実験スキルの科目で講義はなく、事前動画と毎週3時間の割り当てグループでの実習のみ。Human Physiologyと同時履修すると相乗効果がある。"
      ko: "강의 없이 사전 영상과 배정된 조로 매주 3시간 실습을 하는 실습형 연구·실험 기술 과목이다. Human Physiology와 동시에 들으면 서로 도움이 된다."
      vi: "Môn thực hành về kỹ năng nghiên cứu và thí nghiệm, không có bài giảng, chỉ có video trước tutorial và buổi thực hành 3 tiếng mỗi tuần theo nhóm được xếp. Học cùng lúc với Human Physiology rất hợp."
      ms: "Subjek kemahiran penyelidikan dan makmal secara praktikal tanpa kuliah, hanya video pra-tutorial dan amali 3 jam mingguan dalam kumpulan yang ditetapkan. Sesuai diambil bersama Human Physiology."
      id: "Mata kuliah praktik riset dan keterampilan lab tanpa kuliah, hanya video pra-tutorial dan praktikum 3 jam mingguan dalam kelompok yang ditentukan. Cocok diambil bersamaan dengan Human Physiology."
      hi: "बिना लेक्चर वाला व्यावहारिक रिसर्च और लैब-कौशल विषय, सिर्फ़ प्री-ट्यूटोरियल वीडियो और तय ग्रुप में हर हफ़्ते 3 घंटे का प्रैक्टिकल। Human Physiology के साथ लेना अच्छा रहता है।"
  work:
    - en: "Many assessments: in-class group tasks and quizzes that are near-free marks, an individual research task, two post-prac reports and a final journal-style report. Most found the post-pracs stressful and marked strictly."
      zh: "考核很多：课上小组任务和小测几乎白送分，一份个人研究作业，两份实验后报告，最后是期刊格式的大报告。多数人觉得实验后报告压力大、给分严。"
      zh-TW: "考核很多：課上小組任務和小考幾乎白送分，一份個人研究作業，兩份實驗後報告，最後是期刊格式的大報告。多數人覺得實驗後報告壓力大、給分嚴。"
      ja: "評価が多い。授業内のグループ課題とクイズはほぼ確実に点が取れる。個人の研究課題、実習後レポート2本、最後に論文形式のレポート。実習後レポートはストレスが大きく採点も厳しいという声が多い。"
      ko: "평가가 많다. 수업 중 조별 과제와 퀴즈는 거의 공짜 점수이고, 개인 연구 과제, 실습 후 보고서 두 편, 마지막에 학술지 형식의 보고서가 있다. 실습 후 보고서는 스트레스가 크고 채점이 엄격하다는 의견이 많다."
      vi: "Rất nhiều bài: nhiệm vụ nhóm và quiz trên lớp gần như cho điểm, một bài nghiên cứu cá nhân, hai báo cáo sau thực hành và báo cáo cuối dạng bài báo. Đa số thấy báo cáo sau thực hành căng thẳng, chấm chặt."
      ms: "Banyak penilaian: tugasan kumpulan dalam kelas dan kuiz hampir markah percuma, tugasan penyelidikan individu, dua laporan selepas amali dan laporan akhir gaya jurnal. Kebanyakan rasa laporan selepas amali menekan dan dinilai ketat."
      id: "Banyak penilaian: tugas kelompok di kelas dan kuis hampir nilai gratis, tugas riset individu, dua laporan pasca-praktikum dan laporan akhir gaya jurnal. Kebanyakan merasa laporan pasca-praktikum bikin stres dan dinilai ketat."
      hi: "बहुत सारे असेसमेंट: क्लास के ग्रुप टास्क और क्विज़ लगभग मुफ़्त अंक, एक व्यक्तिगत रिसर्च टास्क, दो पोस्ट-प्रैक रिपोर्ट और अंत में जर्नल शैली की रिपोर्ट। ज़्यादातर को पोस्ट-प्रैक तनावपूर्ण और सख़्ती से जाँची गई लगीं।"
    - en: "You can submit drafts of the final report for feedback, which recent reviewers say is the key to a good mark; a different demonstrator may mark the final."
      zh: "期末报告可以交草稿拿反馈，近期同学说这是拿高分的关键；期末可能换另一位 demonstrator 批改。"
      zh-TW: "期末報告可以交草稿拿回饋，近期同學說這是拿高分的關鍵；期末可能換另一位 demonstrator 批改。"
      ja: "最終レポートは下書きを提出してフィードバックをもらえ、最近のレビューでは高得点の鍵だという。最終は別のデモンストレーターが採点することも。"
      ko: "최종 보고서는 초안을 내서 피드백을 받을 수 있고, 최근 리뷰는 이것이 고득점의 핵심이라고 한다. 최종 채점은 다른 데몬스트레이터가 할 수도 있다."
      vi: "Có thể nộp bản nháp báo cáo cuối để nhận góp ý, người học gần đây nói đây là chìa khóa điểm cao; bài cuối có thể do demonstrator khác chấm."
      ms: "Anda boleh hantar draf laporan akhir untuk maklum balas, yang pengulas terkini kata kunci markah baik; demonstrator lain mungkin menilai laporan akhir."
      id: "Draf laporan akhir bisa dikumpulkan untuk umpan balik, yang menurut pengulas terbaru kunci nilai bagus; laporan akhir mungkin dinilai demonstrator lain."
      hi: "अंतिम रिपोर्ट के ड्राफ़्ट फ़ीडबैक के लिए जमा कर सकते हैं, जिसे हाल के रिव्यूअर अच्छे अंकों की कुंजी बताते हैं; अंतिम रिपोर्ट कोई दूसरा डेमॉन्स्ट्रेटर जाँच सकता है।"
  study:
    - en: "Write with the rubric beside you, note down every hint demonstrators give in class, ask questions early, and submit full drafts rather than plans."
      zh: "写的时候把评分标准放在旁边，记下 demonstrator 课上给的每个提示，有问题早点问，草稿要交完整的，别只交提纲。"
      zh-TW: "寫的時候把評分標準放旁邊，記下 demonstrator 課上給的每個提示，有問題早點問，草稿要交完整的，別只交大綱。"
      ja: "ルーブリックを横に置いて書き、デモンストレーターが授業で出すヒントは全部メモ。質問は早めに。下書きは構想でなく全文を出す。"
      ko: "루브릭을 옆에 두고 쓰고, 데몬스트레이터가 수업 중 주는 힌트를 모두 적어 둬라. 질문은 일찍 하고, 초안은 개요가 아닌 완성본을 내라."
      vi: "Viết với tiêu chí chấm bên cạnh, ghi lại mọi gợi ý demonstrator đưa ra trên lớp, hỏi sớm, và nộp bản nháp đầy đủ chứ không chỉ dàn ý."
      ms: "Tulis dengan rubrik di sebelah, catat setiap petunjuk demonstrator dalam kelas, tanya awal, dan hantar draf penuh bukan sekadar rangka."
      id: "Menulis dengan rubrik di samping, catat setiap petunjuk demonstrator di kelas, bertanya lebih awal, dan kumpulkan draf lengkap bukan sekadar kerangka."
      hi: "रूब्रिक पास रखकर लिखें, क्लास में डेमॉन्स्ट्रेटर के हर संकेत को नोट करें, सवाल जल्दी पूछें, और सिर्फ़ रूपरेखा नहीं, पूरा ड्राफ़्ट जमा करें।"
  watch:
    - en: "The workload is very high and many found it the most stressful subject they've done; your experience depends a lot on your group. Several say only take it if your major requires it."
      zh: "工作量非常大，很多人说是读过压力最大的课；体验很看组员。好几位说只有专业要求才选。"
      zh-TW: "工作量非常大，很多人說是修過壓力最大的課；體驗很看組員。好幾位說只有主修要求才選。"
      ja: "負担が非常に大きく、これまでで最もストレスの多い科目だったという声が多い。体験はグループ次第。専攻で必要な場合のみ取るべきという人も複数。"
      ko: "부담이 매우 크고 지금까지 가장 스트레스 받은 과목이라는 사람이 많다. 경험은 조에 크게 좌우된다. 전공 필수일 때만 들으라는 사람이 여럿이다."
      vi: "Khối lượng rất nặng, nhiều người nói đây là môn căng thẳng nhất từng học; trải nghiệm phụ thuộc nhiều vào nhóm. Vài người nói chỉ học nếu chuyên ngành bắt buộc."
      ms: "Beban kerja sangat tinggi dan ramai kata ia subjek paling menekan pernah diambil; pengalaman banyak bergantung pada kumpulan. Beberapa kata ambil hanya jika major memerlukannya."
      id: "Bebannya sangat tinggi dan banyak yang bilang ini mata kuliah paling bikin stres; pengalaman sangat tergantung kelompok. Beberapa bilang ambil hanya jika jurusan mewajibkan."
      hi: "काम का बोझ बहुत ज़्यादा है और कई ने इसे अब तक का सबसे तनावपूर्ण विषय बताया; अनुभव ग्रुप पर बहुत निर्भर है। कई कहते हैं इसे तभी लें जब मेजर में ज़रूरी हो।"
workload: heavy
