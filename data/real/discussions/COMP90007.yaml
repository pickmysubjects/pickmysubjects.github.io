points:
  - en: "A broad overview of computer networks with a lot of content. One reviewer found it well taught and interesting, but others felt the lectures were disorganised."
    zh: "计算机网络的概览课，内容很多。一位评论者觉得教得不错、挺有意思，其他人则觉得讲座比较混乱。"
    zh-TW: "電腦網路的概論課，內容很多。一位評論者覺得教得不錯、蠻有趣，其他人則覺得講課很亂。"
    ja: "コンピュータネットワークの概論で、内容がとても多い。教え方が良く面白いという人もいれば、講義がまとまりに欠けると感じた人もいる。"
    ko: "컴퓨터 네트워크 개론으로 내용이 많다. 잘 가르치고 흥미롭다는 평도 있지만, 강의가 산만하다는 의견도 있다."
    vi: "Môn tổng quan về mạng máy tính với rất nhiều nội dung. Một người thấy dạy tốt và thú vị, nhưng những người khác thấy bài giảng lộn xộn."
    ms: "Gambaran luas rangkaian komputer dengan banyak kandungan. Seorang pengulas dapati ia diajar dengan baik dan menarik, tetapi yang lain rasa kuliahnya tidak teratur."
    id: "Gambaran umum jaringan komputer dengan materi yang banyak. Satu pengulas merasa pengajarannya bagus dan menarik, tapi yang lain merasa kuliahnya berantakan."
    hi: "कंप्यूटर नेटवर्क्स का व्यापक परिचय, जिसमें बहुत सारा कंटेंट है। एक रिव्यूअर को यह अच्छा पढ़ाया गया और दिलचस्प लगा, पर बाकियों को लेक्चर बिखरे हुए लगे।"
  - en: "Expect to learn much on your own or from your tutor. One reviewer said the assignments were more about spreadsheets than networking, and another suggested getting advanced standing if you can."
    zh: "很多内容要靠自学或问辅导老师。有人说作业更多是在折腾Excel而不是学网络，也有人建议能申请学分减免就申请。"
    zh-TW: "很多內容要靠自學或問助教。有人說作業比較像在弄 Excel 而不是學網路，也有人建議能申請學分抵免就申請。"
    ja: "多くは独学かチューターに頼ることになる。課題はネットワークよりExcel作業が中心だったという声や、可能なら単位認定を受けたほうがいいという声もある。"
    ko: "많은 부분을 혼자 공부하거나 튜터에게 배워야 한다. 과제가 네트워크보다 엑셀 작업에 가깝다는 의견과, 가능하면 학점 인정을 받으라는 의견도 있다."
    vi: "Phần lớn phải tự học hoặc hỏi tutor. Có người nói bài tập thiên về bảng tính hơn là mạng, người khác khuyên nên xin miễn môn nếu được."
    ms: "Banyak perlu dipelajari sendiri atau daripada tutor. Seorang kata tugasan lebih kepada hamparan Excel berbanding rangkaian, dan seorang lagi cadangkan mohon pengecualian kredit jika boleh."
    id: "Banyak yang harus dipelajari sendiri atau dari tutor. Ada yang bilang tugasnya lebih soal Excel daripada jaringan, dan ada yang menyarankan ambil advanced standing kalau bisa."
    hi: "बहुत कुछ खुद से या ट्यूटर से सीखना पड़ता है। एक के अनुसार असाइनमेंट नेटवर्किंग से ज़्यादा स्प्रेडशीट पर थे, और दूसरे ने कहा कि हो सके तो एडवांस्ड स्टैंडिंग ले लें।"
  - en: "Marking was described as generous. **Exam questions are close to the workshop problems but with small changes**, so memorising answers doesn't work."
    zh: "有人说给分宽松。**考题和研讨课题目很像但会改动细节**，死记答案行不通。"
    zh-TW: "有人說給分寬鬆。**考題和 workshop 題目很像但會改細節**，死背答案行不通。"
    ja: "採点は甘めだったという声がある。**試験はワークショップの問題に近いが細部が変えてある**ので、答えの暗記は通用しない。"
    ko: "채점은 후한 편이라는 평이다. **시험 문제는 워크숍 문제와 비슷하지만 조금씩 바뀌어서** 답을 외우는 방식은 통하지 않는다."
    vi: "Chấm điểm được cho là rộng rãi. **Đề thi gần giống bài workshop nhưng đổi chi tiết nhỏ**, nên học thuộc đáp án không hiệu quả."
    ms: "Pemarkahan dikatakan murah hati. **Soalan peperiksaan hampir sama dengan soalan bengkel tetapi diubah sedikit**, jadi menghafal jawapan tidak berkesan."
    id: "Penilaiannya disebut murah hati. **Soal ujian mirip soal workshop tapi diubah sedikit**, jadi menghafal jawaban tidak mempan."
    hi: "मार्किंग को उदार बताया गया। **परीक्षा के सवाल वर्कशॉप के सवालों जैसे होते हैं पर छोटे बदलाव के साथ**, इसलिए जवाब रटना काम नहीं करता।"
  - en: "All reviews are from 2021 or earlier, so the subject may have changed since."
    zh: "所有评论都在2021年或更早，课程之后可能已有变化。"
    zh-TW: "所有評論都在 2021 年或更早，課程之後可能已有變化。"
    ja: "レビューはすべて2021年以前のもので、その後内容が変わっている可能性がある。"
    ko: "모든 후기가 2021년 이전 것이라 이후 바뀌었을 수 있다."
    vi: "Tất cả đánh giá đều từ năm 2021 trở về trước, nên môn học có thể đã thay đổi."
    ms: "Semua ulasan dari 2021 atau lebih awal, jadi subjek ini mungkin sudah berubah."
    id: "Semua ulasan dari 2021 atau sebelumnya, jadi mata kuliah ini mungkin sudah berubah."
    hi: "सारे रिव्यू 2021 या उससे पहले के हैं, इसलिए विषय अब बदल चुका हो सकता है।"
workload: heavy
difficulty: mixed
