points:
  - en: "Content heavy and time consuming, around 6 hours of content a week. Understanding how topics connect is key."
    zh: "内容多且耗时，每周约6小时内容；关键是理解各部分之间的联系。"
    zh-TW: "內容多又耗時，每週約6小時內容；關鍵是理解各主題之間的關聯。"
    ja: "内容が多く時間もかかり、週に約6時間分。トピック間のつながりを理解するのが鍵。"
    ko: "내용이 많고 시간이 많이 들며 주당 약 6시간 분량이다. 주제 간 연결을 이해하는 게 핵심이다."
    vi: "Nhiều nội dung và tốn thời gian, khoảng 6 giờ mỗi tuần. Chìa khóa là hiểu các chủ đề liên kết thế nào."
    ms: "Kandungan padat dan memakan masa, kira-kira 6 jam kandungan seminggu. Memahami kaitan antara topik ialah kunci."
    id: "Materi padat dan menyita waktu, sekitar 6 jam materi per minggu. Kuncinya memahami keterkaitan antar topik."
    hi: "भारी कंटेंट और समय लेने वाला, हफ्ते में करीब 6 घंटे का कंटेंट। टॉपिक आपस में कैसे जुड़ते हैं, यह समझना अहम है।"
  - en: "Coordinators were widely praised as supportive, but some found the online modules low quality."
    zh: "协调员普遍被赞支持学生，但有人觉得线上模块质量差。"
    zh-TW: "課程協調人普遍被稱讚很支持學生，但有人覺得線上模組品質差。"
    ja: "コーディネーターは親身だと広く好評だが、オンラインモジュールの質が低いと感じた人もいる。"
    ko: "코디네이터는 학생을 잘 도와준다는 호평이 많지만, 온라인 모듈의 질이 낮다는 사람도 있다."
    vi: "Người điều phối được khen là hỗ trợ tốt, nhưng một số thấy các module online chất lượng thấp."
    ms: "Penyelaras dipuji secara meluas kerana menyokong, tetapi ada yang rasa modul dalam talian bermutu rendah."
    id: "Koordinator banyak dipuji suportif, tapi sebagian menilai modul online-nya berkualitas rendah."
    hi: "कोऑर्डिनेटर्स की मददगार होने के लिए खूब तारीफ़ हुई, पर कुछ को ऑनलाइन मॉड्यूल कमज़ोर लगे।"
  - en: "The MSTs are mostly MCQ with a short answer, and seen as fair. In 2026 the exam felt harder and more memorisation based than the MSTs."
    zh: "期中以选择加一道简答，较公平；2026年期末比期中更难、更偏记忆。"
    zh-TW: "期中考以選擇題加一題簡答為主，算公平；2026年期末比期中更難、更偏記憶。"
    ja: "MSTは主に選択式と短答1問で、公平とされる。2026年の期末試験はMSTより難しく、暗記寄りだったという。"
    ko: "MST는 주로 객관식에 단답 하나로 공정하다는 평이다. 2026년 기말은 MST보다 어렵고 암기 위주였다고 한다."
    vi: "MST chủ yếu trắc nghiệm kèm một câu ngắn, được xem là công bằng. Năm 2026 thi cuối kỳ khó hơn và thiên học thuộc hơn MST."
    ms: "MST kebanyakannya MCQ dengan satu jawapan pendek, dan dianggap adil. Pada 2026 peperiksaan terasa lebih sukar dan lebih bergantung hafalan berbanding MST."
    id: "MST sebagian besar pilihan ganda dengan satu isian singkat, dinilai adil. Pada 2026 ujian akhir terasa lebih sulit dan lebih berbasis hafalan dari MST."
    hi: "MST ज़्यादातर MCQ और एक शॉर्ट आंसर, फेयर माने जाते हैं। 2026 में एग्ज़ाम MST से कठिन और ज़्यादा रटने वाला लगा।"
  - en: "Attend the tutorials and interactive sessions, because they help explain the content and hint at what is assessed."
    zh: "建议参加辅导和互动课，有助理解并了解考点。"
    zh-TW: "建議參加習題課和互動課，有助理解內容並掌握考點。"
    ja: "チュートリアルとインタラクティブセッションに出よう。内容の理解に役立ち、出題のヒントも得られる。"
    ko: "튜토리얼과 인터랙티브 세션에 참석하자. 내용 이해에 도움이 되고 평가 범위의 힌트도 준다."
    vi: "Hãy dự tutorial và các buổi tương tác, vì chúng giúp giải thích nội dung và gợi ý phần sẽ thi."
    ms: "Hadiri tutorial dan sesi interaktif, kerana ia bantu terangkan kandungan dan beri petunjuk apa yang dinilai."
    id: "Ikuti tutorial dan sesi interaktif, karena membantu menjelaskan materi dan memberi petunjuk apa yang diujikan."
    hi: "ट्यूटोरियल और इंटरैक्टिव सेशन में जाएँ, ये कंटेंट समझाते हैं और असेसमेंट के संकेत देते हैं।"
