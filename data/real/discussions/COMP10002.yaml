points:
  - en: "Repeatedly described as a big step up from COMP10001: C, pointers, memory management and data structures."
    zh: "多次被形容为比 COMP10001 难很多：要学 C 语言、指针、内存管理和数据结构。"
    zh-TW: "多次被形容比 COMP10001 難很多：要學 C、指標、記憶體管理和資料結構。"
    ja: "COMP10001から大きくレベルアップすると何度も言われる。C、ポインタ、メモリ管理、データ構造を学ぶ。"
    ko: "COMP10001보다 훨씬 어렵다는 말이 반복된다. C, 포인터, 메모리 관리, 자료구조를 배운다."
    vi: "Nhiều lần được mô tả là khó hơn hẳn COMP10001: C, con trỏ, quản lý bộ nhớ và cấu trúc dữ liệu."
    ms: "Berulang kali digambarkan sebagai lonjakan besar daripada COMP10001: C, penuding, pengurusan memori dan struktur data."
    id: "Berulang kali disebut lonjakan besar dari COMP10001: C, pointer, manajemen memori, dan struktur data."
    hi: "बार-बार COMP10001 से बड़ा कदम बताया गया: C, पॉइंटर, मेमोरी मैनेजमेंट और डेटा स्ट्रक्चर।"
  - en: "The first few weeks are gentle; the second half (linked lists, trees, sorting) is where most people struggle."
    zh: "前几周比较轻松，后半段（链表、树、排序）是大多数人吃力的地方。"
    zh-TW: "前幾週比較輕鬆，後半段（鏈結串列、樹、排序）是多數人卡關的地方。"
    ja: "最初の数週間は易しいが、後半（連結リスト、木、ソート）で多くの人が苦戦する。"
    ko: "처음 몇 주는 무난하지만, 후반부(연결 리스트, 트리, 정렬)에서 대부분 고전한다."
    vi: "Vài tuần đầu nhẹ nhàng; nửa sau (danh sách liên kết, cây, sắp xếp) là chỗ hầu hết mọi người vật lộn."
    ms: "Beberapa minggu pertama ringan; separuh kedua (senarai berpaut, pepohon, isihan) ialah tempat kebanyakan orang bergelut."
    id: "Beberapa minggu awal santai; paruh kedua (linked list, tree, sorting) adalah bagian yang bikin kebanyakan orang kesulitan."
    hi: "पहले कुछ हफ़्ते हल्के हैं; दूसरा हिस्सा (लिंक्ड लिस्ट, ट्री, सॉर्टिंग) वह है जहाँ ज़्यादातर लोग अटकते हैं।"
  - en: "Projects take a lot of time, especially the later questions; reviewers advise not falling behind on lectures and using the textbook's exercises."
    zh: "大作业很花时间，尤其是后面的题；建议不要落下课程进度，多做教材的习题。"
    zh-TW: "大作業很花時間，尤其是後面的題目；建議不要落後講課進度，並多做課本習題。"
    ja: "プロジェクトは特に後半の問題に時間がかかる。講義に遅れず、教科書の演習を活用しよう。"
    ko: "프로젝트는 시간이 많이 들고 특히 뒤쪽 문제가 그렇다. 강의에 뒤처지지 말고 교재 연습문제를 활용하자."
    vi: "Project rất tốn thời gian, nhất là các câu sau; nên đừng để tụt bài giảng và hãy làm bài tập trong giáo trình."
    ms: "Projek ambil banyak masa, terutamanya soalan akhir; pengulas menasihatkan jangan ketinggalan kuliah dan guna latihan buku teks."
    id: "Proyek makan banyak waktu, terutama soal-soal akhirnya; pengulas menyarankan jangan tertinggal kuliah dan pakai latihan buku teks."
    hi: "प्रोजेक्ट में बहुत समय लगता है, ख़ासकर बाद के सवालों में; लेक्चर में पीछे न रहें और टेक्स्टबुक की एक्सरसाइज़ करें।"
  - en: "Opinions on the exam vary, but several say it mixes plenty of straightforward marks with a few very hard questions."
    zh: "对考试的看法不一，但好几位说有不少基础分，也有几道很难的题。"
    zh-TW: "對考試的看法不一，但好幾位說有不少基本分，也有幾題很難。"
    ja: "試験の評価は分かれるが、素直に取れる点が多い一方で、非常に難しい問題も数問あるという声が複数。"
    ko: "시험에 대한 의견은 다양하지만, 쉽게 받을 점수가 많고 몇 문제는 매우 어렵다는 말이 여럿 있다."
    vi: "Ý kiến về đề thi khác nhau, nhưng vài người nói có nhiều điểm dễ lấy xen vài câu rất khó."
    ms: "Pendapat tentang peperiksaan berbeza, tetapi beberapa kata ia gabungan banyak markah mudah dengan beberapa soalan sangat sukar."
    id: "Pendapat soal ujian beragam, tapi beberapa bilang isinya banyak nilai mudah plus beberapa soal yang sangat sulit."
    hi: "परीक्षा पर राय अलग-अलग है, पर कई कहते हैं इसमें काफ़ी आसान नंबर और कुछ बहुत कठिन सवाल होते हैं।"
sections:
  content:
    - en: "Programming in C: the first weeks cover basics, then it jumps to pointers, memory management, linked lists, trees and sorting. Widely called a big step up from COMP10001 and a filter subject for computing."
      zh: "用 C 编程：前几周学基础，之后跳到指针、内存管理、链表、树和排序。普遍认为比 COMP10001 难一大截，是计算机方向的筛选课。"
      zh-TW: "用 C 寫程式：前幾週學基礎，之後跳到指標、記憶體管理、鏈結串列、樹和排序。普遍認為比 COMP10001 難一大截，是資訊方向的篩選課。"
      ja: "C言語でのプログラミング。最初の数週は基礎、その後ポインタ、メモリ管理、連結リスト、木、ソートへ一気に進む。COMP10001から大きく難しくなる、コンピューティングのふるい落とし科目と言われる。"
      ko: "C 프로그래밍. 처음 몇 주는 기초, 이후 포인터, 메모리 관리, 연결 리스트, 트리, 정렬로 급격히 넘어간다. COMP10001보다 훨씬 어렵고 컴퓨팅 전공의 걸러내기 과목이라는 평."
      vi: "Lập trình C: vài tuần đầu học cơ bản, rồi nhảy sang con trỏ, quản lý bộ nhớ, danh sách liên kết, cây và sắp xếp. Được xem là khó hơn hẳn COMP10001 và là môn sàng lọc ngành máy tính."
      ms: "Pengaturcaraan C: minggu awal asas, kemudian melompat ke penunjuk, pengurusan memori, senarai berpaut, pokok dan pengisihan. Ramai kata ia lonjakan besar dari COMP10001 dan subjek penapis bagi pengkomputeran."
      id: "Pemrograman C: minggu awal dasar, lalu melompat ke pointer, manajemen memori, linked list, tree, dan sorting. Banyak yang bilang jauh lebih sulit dari COMP10001 dan jadi mata kuliah penyaring jurusan komputer."
      hi: "C में प्रोग्रामिंग: पहले हफ़्ते बेसिक्स, फिर पॉइंटर, मेमोरी मैनेजमेंट, लिंक्ड लिस्ट, ट्री और सॉर्टिंग पर छलांग। आम राय है कि यह COMP10001 से बहुत कठिन और कंप्यूटिंग का छँटाई वाला विषय है।"
  work:
    - en: "Two projects, the second much harder with memory management; their last questions are very tough. Chapter quizzes come from the textbook. The exam mixes many easy marks with some very hard questions."
      zh: "两个 project，第二个难很多，涉及内存管理；最后几题非常难。章节小测出自课本。考试有不少送分题，也有很难的题。"
      zh-TW: "兩個 project，第二個難很多，涉及記憶體管理；最後幾題非常難。章節小考出自課本。考試有不少送分題，也有很難的題目。"
      ja: "プロジェクト2つで、2つ目はメモリ管理を含みずっと難しい。最後の問題は非常に手ごわい。章末クイズは教科書から出題。試験は易しい得点源が多く、非常に難しい問題も混ざる。"
      ko: "프로젝트 두 개로, 두 번째는 메모리 관리를 포함해 훨씬 어렵고 마지막 문제들은 매우 까다롭다. 챕터 퀴즈는 교재에서 나온다. 시험은 쉬운 점수가 많고 매우 어려운 문제도 섞여 있다."
      vi: "Hai project, cái thứ hai khó hơn nhiều với quản lý bộ nhớ; các câu cuối rất khó. Quiz theo chương lấy từ giáo trình. Bài thi có nhiều điểm dễ xen vài câu rất khó."
      ms: "Dua projek, yang kedua jauh lebih sukar dengan pengurusan memori; soalan terakhirnya sangat sukar. Kuiz bab datang dari buku teks. Peperiksaan ada banyak markah mudah bercampur soalan sangat sukar."
      id: "Dua proyek, yang kedua jauh lebih sulit dengan manajemen memori; soal terakhirnya sangat berat. Kuis per bab diambil dari buku teks. Ujian berisi banyak nilai mudah bercampur soal sangat sulit."
      hi: "दो प्रोजेक्ट, दूसरा मेमोरी मैनेजमेंट के साथ कहीं ज़्यादा कठिन; आख़िरी सवाल बहुत कठिन। चैप्टर क्विज़ पाठ्यपुस्तक से। परीक्षा में आसान अंक बहुत, साथ में कुछ बहुत कठिन सवाल।"
  study:
    - en: "Never fall behind on lectures, since projects need a solid grasp of recent topics. The textbook and its end-of-chapter exercises are highly praised; one reviewer suggests starting it over the break."
      zh: "千万别落下 lecture，project 需要吃透最近几讲的内容。课本和章末习题很受好评；有一位同学建议假期就开始看。"
      zh-TW: "千萬別落後 lecture，project 需要吃透最近幾講的內容。課本和章末習題很受好評；有一位同學建議假期就開始讀。"
      ja: "講義を溜めないこと。プロジェクトには直近の内容の確かな理解が必要。教科書と章末問題は高評価で、休暇中に始めることを勧める人が一人。"
      ko: "강의를 밀리지 말자. 프로젝트에는 최근 주제의 확실한 이해가 필요하다. 교재와 장 끝 연습문제가 호평이며, 방학 때 미리 시작하라는 리뷰어가 한 명."
      vi: "Đừng bao giờ tụt bài giảng, vì project cần hiểu chắc các chủ đề gần nhất. Giáo trình và bài tập cuối chương được khen nhiều; một người gợi ý bắt đầu đọc từ kỳ nghỉ."
      ms: "Jangan ketinggalan kuliah, kerana projek perlukan kefahaman kukuh topik terkini. Buku teks dan latihan hujung bab sangat dipuji; seorang pengulas cadang mula membacanya semasa cuti."
      id: "Jangan pernah tertinggal kuliah, karena proyek butuh pemahaman kuat atas topik terbaru. Buku teks dan latihan akhir bab sangat dipuji; satu reviewer menyarankan mulai membacanya saat libur."
      hi: "लेक्चर में कभी पीछे न रहें, क्योंकि प्रोजेक्ट के लिए हाल के टॉपिक अच्छी तरह समझने ज़रूरी हैं। पाठ्यपुस्तक और अध्याय के अंत के अभ्यास की खूब तारीफ़; एक रिव्यूअर छुट्टियों में ही शुरू करने को कहते हैं।"
    - en: "Go to workshops, especially before project deadlines, and ask your tutor to walk through the spec again if you're stuck."
      zh: "workshop 要去，尤其是 project 截止前；卡住了就请 tutor 再讲一遍要求。"
      zh-TW: "workshop 要去，尤其是 project 截止前；卡住了就請 tutor 再講一次要求。"
      ja: "ワークショップには出よう。特にプロジェクト締切前。行き詰まったら仕様をもう一度説明してもらおう。"
      ko: "워크숍에 나가자. 특히 프로젝트 마감 전에. 막히면 튜터에게 요구사항을 다시 설명해 달라고 하자."
      vi: "Đi workshop, nhất là trước hạn nộp project, và nhờ tutor giải thích lại đề nếu bị bí."
      ms: "Hadir bengkel, terutama sebelum tarikh akhir projek, dan minta tutor terangkan semula spesifikasi jika buntu."
      id: "Datang ke workshop, terutama sebelum tenggat proyek, dan minta tutor menjelaskan ulang spesifikasinya jika buntu."
      hi: "वर्कशॉप जाएँ, खासकर प्रोजेक्ट की डेडलाइन से पहले, और अटकें तो ट्यूटर से निर्देश दोबारा समझाने को कहें।"
  watch:
    - en: "Several reviewers who came in new to coding, or took it out of interest, strongly advise against it unless you really want to program."
      zh: "好几位编程新手或出于兴趣选课的同学强烈劝退，除非你真心想写代码。"
      zh-TW: "好幾位程式新手或出於興趣選課的同學強烈勸退，除非你真心想寫程式。"
      ja: "プログラミング初心者や興味本位で取った人の複数が、本気でコードを書きたいのでなければ取らない方がいいと強く言う。"
      ko: "코딩 초보이거나 관심으로 들었던 여러 리뷰어가, 정말 프로그래밍을 원하지 않는다면 듣지 말라고 강하게 말한다."
      vi: "Vài người mới học lập trình hoặc học vì tò mò khuyên mạnh là đừng học, trừ khi bạn thật sự muốn lập trình."
      ms: "Beberapa pengulas yang baru dalam pengekodan, atau ambil kerana minat, sangat tidak menggalakkan kecuali anda benar-benar mahu memprogram."
      id: "Beberapa reviewer yang baru belajar coding, atau mengambil karena penasaran, sangat tidak menyarankan kecuali kamu benar-benar ingin memprogram."
      hi: "कोडिंग में नए या सिर्फ़ रुचि से लेने वाले कई रिव्यूअर साफ़ मना करते हैं, जब तक आप सच में प्रोग्रामिंग नहीं करना चाहते।"
workload: heavy
difficulty: hard
