points:
  - en: "Repeatedly described as a big step up from COMP10001: C, pointers, memory management and data structures."
    zh: "多次被形容为比 COMP10001 难很多：要学 C 语言、指针、内存管理和数据结构。"
    zh-TW: "多次被形容比 COMP10001 難很多：要學 C、指標、記憶體管理和資料結構。"
    ja: "COMP10001から大きくレベルアップすると何度も言われる。C、ポインタ、メモリ管理、データ構造を学ぶ。"
    ko: "COMP10001보다 훨씬 어렵다는 말이 반복된다. C, 포인터, 메모리 관리, 자료구조를 배운다."
    vi: "Nhiều lần được mô tả là khó hơn hẳn COMP10001: C, con trỏ, quản lý bộ nhớ và cấu trúc dữ liệu."
    ms: "Berulang kali digambarkan sebagai lonjakan besar daripada COMP10001: C, penuding, pengurusan memori dan struktur data."
    id: "Berulang kali disebut lonjakan besar dari COMP10001: C, pointer, manajemen memori, dan struktur data."
    hi: "बार-बार COMP10001 से बड़ा कदम बताया गया: C, पॉइंटर, मेमोरी मैनेजमेंट और डेटा स्ट्रक्चर।"
  - en: "The first few weeks are gentle; the second half (linked lists, trees, sorting) is where most people struggle."
    zh: "前几周比较轻松，后半段（链表、树、排序）是大多数人吃力的地方。"
    zh-TW: "前幾週比較輕鬆，後半段（鏈結串列、樹、排序）是多數人卡關的地方。"
    ja: "最初の数週間は易しいが、後半（連結リスト、木、ソート）で多くの人が苦戦する。"
    ko: "처음 몇 주는 무난하지만, 후반부(연결 리스트, 트리, 정렬)에서 대부분 고전한다."
    vi: "Vài tuần đầu nhẹ nhàng; nửa sau (danh sách liên kết, cây, sắp xếp) là chỗ hầu hết mọi người vật lộn."
    ms: "Beberapa minggu pertama ringan; separuh kedua (senarai berpaut, pepohon, isihan) ialah tempat kebanyakan orang bergelut."
    id: "Beberapa minggu awal santai; paruh kedua (linked list, tree, sorting) adalah bagian yang bikin kebanyakan orang kesulitan."
    hi: "पहले कुछ हफ़्ते हल्के हैं; दूसरा हिस्सा (लिंक्ड लिस्ट, ट्री, सॉर्टिंग) वह है जहाँ ज़्यादातर लोग अटकते हैं।"
  - en: "Projects take a lot of time, especially the later questions; reviewers advise not falling behind on lectures and using the textbook's exercises."
    zh: "大作业很花时间，尤其是后面的题；建议不要落下课程进度，多做教材的习题。"
    zh-TW: "大作業很花時間，尤其是後面的題目；建議不要落後講課進度，並多做課本習題。"
    ja: "プロジェクトは特に後半の問題に時間がかかる。講義に遅れず、教科書の演習を活用しよう。"
    ko: "프로젝트는 시간이 많이 들고 특히 뒤쪽 문제가 그렇다. 강의에 뒤처지지 말고 교재 연습문제를 활용하자."
    vi: "Project rất tốn thời gian, nhất là các câu sau; nên đừng để tụt bài giảng và hãy làm bài tập trong giáo trình."
    ms: "Projek ambil banyak masa, terutamanya soalan akhir; pengulas menasihatkan jangan ketinggalan kuliah dan guna latihan buku teks."
    id: "Proyek makan banyak waktu, terutama soal-soal akhirnya; pengulas menyarankan jangan tertinggal kuliah dan pakai latihan buku teks."
    hi: "प्रोजेक्ट में बहुत समय लगता है, ख़ासकर बाद के सवालों में; लेक्चर में पीछे न रहें और टेक्स्टबुक की एक्सरसाइज़ करें।"
  - en: "Opinions on the exam vary, but several say it mixes plenty of straightforward marks with a few very hard questions."
    zh: "对考试的看法不一，但好几位说有不少基础分，也有几道很难的题。"
    zh-TW: "對考試的看法不一，但好幾位說有不少基本分，也有幾題很難。"
    ja: "試験の評価は分かれるが、素直に取れる点が多い一方で、非常に難しい問題も数問あるという声が複数。"
    ko: "시험에 대한 의견은 다양하지만, 쉽게 받을 점수가 많고 몇 문제는 매우 어렵다는 말이 여럿 있다."
    vi: "Ý kiến về đề thi khác nhau, nhưng vài người nói có nhiều điểm dễ lấy xen vài câu rất khó."
    ms: "Pendapat tentang peperiksaan berbeza, tetapi beberapa kata ia gabungan banyak markah mudah dengan beberapa soalan sangat sukar."
    id: "Pendapat soal ujian beragam, tapi beberapa bilang isinya banyak nilai mudah plus beberapa soal yang sangat sulit."
    hi: "परीक्षा पर राय अलग-अलग है, पर कई कहते हैं इसमें काफ़ी आसान नंबर और कुछ बहुत कठिन सवाल होते हैं।"
workload: heavy
difficulty: hard
