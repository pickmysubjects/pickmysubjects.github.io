  - en: "Readings are not optional: there are weekly short reflections and a presentation on the readings."
    zh: "阅读材料必须读：每周要写简短反思，还要就阅读做课堂展示。"
  - en: "Tutorials mostly involve watching classmates present on the readings, which some find tedious."
    zh: "辅导课主要是听同学讲阅读内容，有人觉得比较乏味。"
  - en: "Marking is generally seen as fair and the effort you put in is rewarded, so it can work as a filler or WAM booster."
    zh: "评分总体公平，付出就有回报，可作为凑学分或提高均分的课。"
