points:
  - en: "Opinions are split: many found the content and guest lectures engaging, but some recent reviewers found the topics loosely connected and dull."
    zh: "评价不一：许多人觉得内容和客座讲座很吸引人，但近年也有人认为主题松散、比较无聊。"
    zh-TW: "評價不一：很多人覺得內容和客座講座很吸引人，但近年也有人認為主題鬆散、很無聊。"
    ja: "意見は分かれる。内容とゲスト講義が魅力的だという人が多いが、最近はテーマのつながりが薄く退屈だという人も。"
    ko: "의견이 갈림: 내용과 초청 강연이 흥미롭다는 사람이 많지만, 최근에는 주제가 산만하고 지루하다는 후기도 있음."
    vi: "Ý kiến trái chiều: nhiều người thấy nội dung và bài giảng khách mời cuốn hút, nhưng vài đánh giá gần đây thấy chủ đề rời rạc và nhàm."
    ms: "Pendapat berbelah bahagi: ramai rasa kandungan dan kuliah tetamu menarik, tetapi ulasan terkini rasa topik kurang berkait dan membosankan."
    id: "Pendapat terbelah: banyak yang merasa materi dan kuliah tamu menarik, tapi sebagian ulasan terbaru merasa topiknya kurang nyambung dan membosankan."
    hi: "राय बँटी है: कई को कंटेंट और गेस्ट लेक्चर दिलचस्प लगे, पर हाल के कुछ रिव्यूअर को टॉपिक बिखरे और नीरस लगे।"
  - en: "Readings are not optional: there are weekly short reflections and a presentation on the readings."
    zh: "阅读材料必须读：每周要写简短反思，还要就阅读做课堂展示。"
    zh-TW: "閱讀資料一定要讀：每週要寫簡短心得，還要針對閱讀做報告。"
    ja: "リーディングは必須。毎週の短い振り返りと、リーディングについての発表がある。"
    ko: "읽기 자료는 필수: 매주 짧은 성찰문과 읽기 자료 발표가 있음."
    vi: "Bài đọc là bắt buộc: có phần suy ngẫm ngắn mỗi tuần và một bài thuyết trình về bài đọc."
    ms: "Bacaan bukan pilihan: ada refleksi ringkas mingguan dan pembentangan tentang bacaan."
    id: "Bacaan wajib: ada refleksi singkat tiap minggu dan presentasi tentang bacaan."
    hi: "रीडिंग वैकल्पिक नहीं हैं: हर हफ़्ते छोटे रिफ़्लेक्शन और रीडिंग पर एक प्रेज़ेंटेशन होता है।"
  - en: "Tutorials mostly involve watching classmates present on the readings, which some find tedious."
    zh: "辅导课主要是听同学讲阅读内容，有人觉得比较乏味。"
    zh-TW: "小組討論課主要是聽同學報告閱讀內容，有人覺得很乏味。"
    ja: "チュートリアルは主にクラスメイトのリーディング発表を聞く形で、退屈だという人も。"
    ko: "튜토리얼은 주로 동료들의 읽기 자료 발표를 보는 방식이라 지루하다는 사람도 있음."
    vi: "Tutorial chủ yếu là xem bạn cùng lớp thuyết trình về bài đọc, một số thấy tẻ nhạt."
    ms: "Tutorial kebanyakannya menonton rakan membentang bacaan, yang sesetengah rasa membosankan."
    id: "Tutorial sebagian besar menonton teman presentasi bacaan, yang bagi sebagian orang membosankan."
    hi: "ट्यूटोरियल में ज़्यादातर क्लासमेट्स को रीडिंग पर प्रेज़ेंट करते देखना होता है, जो कुछ को उबाऊ लगता है।"
  - en: "Marking is generally seen as fair and the effort you put in is rewarded, so it can work as a filler or WAM booster."
    zh: "评分总体公平，付出就有回报，可作为凑学分或提高均分的课。"
    zh-TW: "評分整體公平，付出就有回報，可以當作湊學分或拉高WAM的課。"
    ja: "採点はおおむね公平で努力が報われるので、穴埋めやWAMを上げる科目として使える。"
    ko: "채점은 대체로 공정하고 노력한 만큼 보상받아, 채우기용이나 WAM 부스터로 괜찮음."
    vi: "Chấm điểm nhìn chung công bằng, nỗ lực được đền đáp, nên có thể dùng làm môn lấp chỗ hoặc kéo WAM."
    ms: "Pemarkahan umumnya adil dan usaha dihargai, jadi boleh jadi subjek pengisi atau penggalak WAM."
    id: "Penilaian umumnya adil dan usaha dihargai, jadi bisa jadi mata kuliah pengisi atau pendongkrak WAM."
    hi: "मार्किंग आम तौर पर निष्पक्ष है और मेहनत का फल मिलता है, तो इसे फ़िलर या WAM बूस्टर की तरह लिया जा सकता है।"
