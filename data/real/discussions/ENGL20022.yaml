points:
  - en: "The wide text list (novels, plays, poems, manifestos) won over a 2022 reviewer, who found the subject formative."
    zh: "广泛的书单（小说、戏剧、诗歌、宣言）打动了一位2022年的评论者，觉得这门课对自己影响很大。"
    zh-TW: "廣泛的書單（小說、戲劇、詩歌、宣言）打動了一位2022年的評論者，覺得這門課對自己影響很大。"
    ja: "小説、戯曲、詩、マニフェストまで幅広い作品リストが2022年のレビュアーに刺さり、大きな影響を受けたとのこと。"
    ko: "소설, 희곡, 시, 선언문까지 폭넓은 작품 목록이 2022년 리뷰어를 사로잡았고, 큰 영향을 받았다고 함."
    vi: "Danh sách tác phẩm rộng (tiểu thuyết, kịch, thơ, tuyên ngôn) đã chinh phục một người năm 2022, người thấy môn này rất định hình."
    ms: "Senarai teks yang luas (novel, drama, puisi, manifesto) memikat seorang pengulas 2022, yang dapati subjek ini sangat membentuk."
    id: "Daftar teks yang luas (novel, drama, puisi, manifesto) memikat pengulas 2022, yang merasa mata kuliah ini sangat membentuk dirinya."
    hi: "उपन्यास, नाटक, कविताएँ, घोषणापत्र जैसी व्यापक टेक्स्ट लिस्ट ने 2022 के एक रिव्यूअर को काफ़ी प्रभावित किया।"
  - en: "Others noted a dull tutor (2022) and called it the one English subject that is genuinely hard (2018)."
    zh: "也有人提到辅导老师很沉闷（2022年），并称它是唯一真正难的英文课（2018年）。"
    zh-TW: "也有人提到助教很沉悶（2022年），並稱它是唯一真正難的英文課（2018年）。"
    ja: "チューターが退屈だった（2022年）、英文学で唯一本当に難しい科目だ（2018年）という声もある。"
    ko: "튜터가 지루했다(2022년), 영문학 과목 중 유일하게 진짜 어렵다(2018년)는 의견도 있음."
    vi: "Người khác nhắc tutor nhàm chán (2022) và gọi đây là môn tiếng Anh duy nhất thật sự khó (2018)."
    ms: "Yang lain menyebut tutor yang membosankan (2022) dan menggelarnya satu-satunya subjek Bahasa Inggeris yang benar-benar sukar (2018)."
    id: "Yang lain menyebut tutor yang membosankan (2022) dan menyebutnya satu-satunya mata kuliah sastra Inggris yang benar-benar sulit (2018)."
    hi: "दूसरों ने एक उबाऊ ट्यूटर (2022) का ज़िक्र किया और इसे अंग्रेज़ी का इकलौता सच में कठिन विषय बताया (2018)।"
difficulty: hard
