points:
  - en: "Interesting but challenging; some topics are dry and take time to grasp."
    zh: "内容有趣但有挑战性；部分主题较枯燥，需要时间理解。"
    zh-TW: "內容有趣但有挑戰性；部分主題較枯燥，需要時間理解。"
    ja: "面白いが難しい。一部のトピックは退屈で、理解に時間がかかる。"
    ko: "재미있지만 어렵다. 일부 주제는 지루하고 이해하는 데 시간이 걸린다."
    vi: "Thú vị nhưng khó; một số chủ đề khô khan và cần thời gian để hiểu."
    ms: "Menarik tetapi mencabar; sesetengah topik membosankan dan ambil masa untuk difahami."
    id: "Menarik tapi menantang; beberapa topik membosankan dan butuh waktu untuk dipahami."
    hi: "दिलचस्प लेकिन कठिन; कुछ टॉपिक नीरस हैं और समझने में समय लगता है।"
  - en: "MSTs were often described as tricky, while the final exam was generally considered fair."
    zh: "期中测验常被认为有难度，而期末考试普遍被认为公平。"
    zh-TW: "期中測驗常被認為有難度，而期末考普遍被認為公平。"
    ja: "中間テスト（MST）はひっかけが多いと言われがちだが、期末試験はおおむね公平とされる。"
    ko: "중간고사(MST)는 까다롭다는 평이 많았고, 기말시험은 대체로 공정하다는 평이었다."
    vi: "Các bài MST thường bị cho là khó nhằn, còn bài thi cuối kỳ nhìn chung được coi là công bằng."
    ms: "MST sering dikatakan sukar, manakala peperiksaan akhir secara umumnya dianggap adil."
    id: "MST sering disebut menjebak, sedangkan ujian akhir umumnya dianggap adil."
    hi: "MST को अक्सर पेचीदा बताया गया, जबकि फ़ाइनल परीक्षा आम तौर पर निष्पक्ष मानी गई।"
  - en: "Written assignments are relatively easy marks, especially if you attend the related workshops."
    zh: "书面作业相对容易拿分，尤其是参加了相关研讨课的话。"
    zh-TW: "書面作業相對容易拿分，尤其是有去上相關研討課的話。"
    ja: "レポート課題は比較的点が取りやすい。関連するワークショップに出ていれば特に。"
    ko: "서면 과제는 비교적 점수 받기 쉽다. 관련 워크숍에 참석했다면 더욱 그렇다."
    vi: "Bài tập viết khá dễ lấy điểm, nhất là nếu bạn tham gia các buổi workshop liên quan."
    ms: "Tugasan bertulis agak mudah dapat markah, terutamanya jika anda hadir bengkel berkaitan."
    id: "Tugas tertulis relatif mudah dapat nilai, terutama kalau kamu ikut workshop terkait."
    hi: "लिखित असाइनमेंट में नंबर लाना आसान है, ख़ासकर अगर आप संबंधित वर्कशॉप में जाते हैं।"
  - en: "Usually seen as well coordinated with helpful lecturers; one 2025 reviewer found tutorials slow and missed in-person lectures."
    zh: "通常认为课程协调良好、讲师乐于助人；一位2025年的评论者觉得辅导课节奏慢，也希望有线下讲课。"
    zh-TW: "通常認為課程協調良好、講師樂於助人；一位2025年的評論者覺得輔導課節奏慢，也希望有實體講課。"
    ja: "運営は良く講師も親切という評価が多い。2025年のあるレビューでは、チュートリアルが遅く対面講義がないのが残念とされた。"
    ko: "대체로 운영이 잘 되고 강사도 친절하다는 평이다. 2025년 한 리뷰어는 튜토리얼이 느리고 대면 강의가 없어 아쉬웠다고 했다."
    vi: "Thường được đánh giá là tổ chức tốt, giảng viên nhiệt tình; một người năm 2025 thấy tutorial chậm và tiếc vì không có giờ học trực tiếp."
    ms: "Biasanya dianggap diselaraskan dengan baik dan pensyarah membantu; seorang pengulas 2025 rasa tutorial perlahan dan rindu kuliah bersemuka."
    id: "Biasanya dinilai terkoordinasi baik dengan dosen yang membantu; satu ulasan 2025 merasa tutorial lambat dan merindukan kuliah tatap muka."
    hi: "आम तौर पर अच्छी तरह संचालित और मददगार लेक्चरर वाला माना गया; 2025 के एक रिव्यू में ट्यूटोरियल धीमे लगे और आमने-सामने लेक्चर की कमी खली।"
difficulty: hard
