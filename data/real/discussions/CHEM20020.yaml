points:
  - en: "Introduces new topics such as quantum chemistry, symmetry and organometallics. It is a step up and the exam is described as tough."
    zh: "引入量子化学、对称性和有机金属等新内容，难度提升，考试被认为较难。"
    zh-TW: "引入量子化學、對稱性和有機金屬等新主題。難度提升，考試被形容很難。"
    ja: "量子化学、対称性、有機金属などの新しいトピックが入る。レベルが上がり、試験は難しいと言われる。"
    ko: "양자화학, 대칭성, 유기금속 같은 새 주제를 다룬다. 난이도가 올라가고 시험도 어렵다는 평이다."
    vi: "Giới thiệu chủ đề mới như hóa lượng tử, đối xứng và cơ kim. Khó hơn hẳn và đề thi được mô tả là khó."
    ms: "Memperkenalkan topik baharu seperti kimia kuantum, simetri dan organologam. Ia lebih sukar dan peperiksaan digambarkan sebagai susah."
    id: "Memperkenalkan topik baru seperti kimia kuantum, simetri, dan organologam. Tingkatnya naik dan ujiannya disebut berat."
    hi: "क्वांटम केमिस्ट्री, सिमेट्री और ऑर्गेनोमेटैलिक्स जैसे नए टॉपिक आते हैं। स्तर बढ़ता है और परीक्षा को कठिन बताया गया।"
  - en: "Recent reviewers found the quantum section hard to learn from lectures and had to self-study it."
    zh: "近期评价认为量子部分仅靠讲座难以掌握，需要自学。"
    zh-TW: "近期評論者覺得量子部分很難靠講課學會，只好自學。"
    ja: "最近のレビューでは、量子のパートは講義だけでは理解しにくく、独学が必要だったという。"
    ko: "최근 리뷰어들은 양자 파트를 강의만으로 배우기 어려워 독학해야 했다고 한다."
    vi: "Đánh giá gần đây thấy phần lượng tử khó học qua bài giảng và phải tự học."
    ms: "Pengulas terkini dapati bahagian kuantum sukar dipelajari daripada kuliah dan terpaksa belajar sendiri."
    id: "Ulasan terbaru merasa bagian kuantum sulit dipelajari dari kuliah dan harus belajar sendiri."
    hi: "हाल के रिव्यूअर्स को क्वांटम हिस्सा लेक्चर से सीखना मुश्किल लगा और उन्हें ख़ुद पढ़ना पड़ा।"
  - en: "Opinions are split: older reviews praised it as cohesive and useful, while recent ones enjoyed it less."
    zh: "看法不一：早期评价称其连贯且实用，近期评价则不太喜欢。"
    zh-TW: "看法不一：較早的評價稱讚它連貫又實用，近期的則沒那麼喜歡。"
    ja: "評価は分かれる。以前のレビューはまとまりがあり役立つと評価したが、最近のレビューはそれほど楽しめなかった。"
    ko: "의견은 갈린다. 예전 리뷰는 짜임새 있고 유용하다고 칭찬했지만, 최근 리뷰는 덜 좋아했다."
    vi: "Ý kiến trái chiều: đánh giá cũ khen môn mạch lạc và hữu ích, còn gần đây thì ít thích hơn."
    ms: "Pandangan berbelah bahagi: ulasan lama memujinya sebagai padu dan berguna, manakala ulasan terkini kurang menyukainya."
    id: "Pendapat terbelah: ulasan lama memujinya runtut dan berguna, sedangkan ulasan terbaru kurang menyukainya."
    hi: "राय बंटी है: पुराने रिव्यू ने इसे सुसंगत और उपयोगी बताया, जबकि हाल के रिव्यू में यह कम पसंद आया।"
difficulty: hard
