code: CHEM20020
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/chem20020
reviews: 5
from: 2015
to: 2023
checked: 2026-10-08
points:
  - en: "Introduces new topics such as quantum chemistry, symmetry and organometallics. It is a step up and the exam is described as tough."
    zh: "引入量子化学、对称性和有机金属等新内容，难度提升，考试被认为较难。"
    zh-TW: "引入量子化學、對稱性和有機金屬等新主題。難度提升，考試被形容很難。"
    ja: "量子化学、対称性、有機金属などの新しいトピックが入る。レベルが上がり、試験は難しいと言われる。"
    ko: "양자화학, 대칭성, 유기금속 같은 새 주제를 다룬다. 난이도가 올라가고 시험도 어렵다는 평이다."
    vi: "Giới thiệu chủ đề mới như hóa lượng tử, đối xứng và cơ kim. Khó hơn hẳn và đề thi được mô tả là khó."
    ms: "Memperkenalkan topik baharu seperti kimia kuantum, simetri dan organologam. Ia lebih sukar dan peperiksaan digambarkan sebagai susah."
    id: "Memperkenalkan topik baru seperti kimia kuantum, simetri, dan organologam. Tingkatnya naik dan ujiannya disebut berat."
    hi: "क्वांटम केमिस्ट्री, सिमेट्री और ऑर्गेनोमेटैलिक्स जैसे नए टॉपिक आते हैं। स्तर बढ़ता है और परीक्षा को कठिन बताया गया।"
  - en: "Recent reviewers found the quantum section hard to learn from lectures and had to self-study it."
    zh: "近期评价认为量子部分仅靠讲座难以掌握，需要自学。"
    zh-TW: "近期評論者覺得量子部分很難靠講課學會，只好自學。"
    ja: "最近のレビューでは、量子のパートは講義だけでは理解しにくく、独学が必要だったという。"
    ko: "최근 리뷰어들은 양자 파트를 강의만으로 배우기 어려워 독학해야 했다고 한다."
    vi: "Đánh giá gần đây thấy phần lượng tử khó học qua bài giảng và phải tự học."
    ms: "Pengulas terkini dapati bahagian kuantum sukar dipelajari daripada kuliah dan terpaksa belajar sendiri."
    id: "Ulasan terbaru merasa bagian kuantum sulit dipelajari dari kuliah dan harus belajar sendiri."
    hi: "हाल के रिव्यूअर्स को क्वांटम हिस्सा लेक्चर से सीखना मुश्किल लगा और उन्हें ख़ुद पढ़ना पड़ा।"
  - en: "Opinions are split: older reviews praised it as cohesive and useful, while recent ones enjoyed it less."
    zh: "看法不一：早期评价称其连贯且实用，近期评价则不太喜欢。"
    zh-TW: "看法不一：較早的評價稱讚它連貫又實用，近期的則沒那麼喜歡。"
    ja: "評価は分かれる。以前のレビューはまとまりがあり役立つと評価したが、最近のレビューはそれほど楽しめなかった。"
    ko: "의견은 갈린다. 예전 리뷰는 짜임새 있고 유용하다고 칭찬했지만, 최근 리뷰는 덜 좋아했다."
    vi: "Ý kiến trái chiều: đánh giá cũ khen môn mạch lạc và hữu ích, còn gần đây thì ít thích hơn."
    ms: "Pandangan berbelah bahagi: ulasan lama memujinya sebagai padu dan berguna, manakala ulasan terkini kurang menyukainya."
    id: "Pendapat terbelah: ulasan lama memujinya runtut dan berguna, sedangkan ulasan terbaru kurang menyukainya."
    hi: "राय बंटी है: पुराने रिव्यू ने इसे सुसंगत और उपयोगी बताया, जबकि हाल के रिव्यू में यह कम पसंद आया।"
sections:
  content:
    - en: "Organic chemistry (mechanisms, spectroscopy, stereochemistry), quantum mechanics, symmetry and organometallics. Several found it a step up with many new concepts; others called it cohesive and a favourite."
      zh: "包括有机化学（反应机理、光谱、立体化学）、量子力学、对称性和金属有机。好几位觉得难度上了一个台阶、新概念多；也有人觉得各部分衔接好，是最爱的化学课。"
      zh-TW: "包括有機化學（反應機構、光譜、立體化學）、量子力學、對稱性和有機金屬。好幾位覺得難度上了一個台階、新概念多；也有人覺得各部分銜接好，是最愛的化學課。"
      ja: "有機化学（反応機構、分光法、立体化学）、量子力学、対称性、有機金属化学。新概念が多くレベルが上がったという声が複数、まとまりが良くお気に入りという人も。"
      ko: "유기화학(반응 메커니즘, 분광학, 입체화학), 양자역학, 대칭, 유기금속. 새 개념이 많아 한 단계 어렵다는 평이 여럿이고, 잘 연결돼 가장 좋아하는 과목이라는 사람도 있다."
      vi: "Hóa hữu cơ (cơ chế, phổ, hóa lập thể), cơ học lượng tử, đối xứng và hóa cơ kim. Nhiều người thấy khó hơn hẳn với nhiều khái niệm mới; người khác thấy gắn kết và rất thích."
      ms: "Kimia organik (mekanisme, spektroskopi, stereokimia), mekanik kuantum, simetri dan organologam. Beberapa rasa ia lonjakan dengan banyak konsep baharu; yang lain kata padu dan kegemaran."
      id: "Kimia organik (mekanisme, spektroskopi, stereokimia), mekanika kuantum, simetri dan organologam. Beberapa merasa ada lonjakan dengan banyak konsep baru; yang lain menyebutnya padu dan favorit."
      hi: "कार्बनिक रसायन (मैकेनिज़्म, स्पेक्ट्रोस्कोपी, स्टीरियोकेमिस्ट्री), क्वांटम मैकेनिक्स, सममिति और ऑर्गेनोमेटैलिक्स। कई को यह नए कॉन्सेप्ट्स के साथ कठिन छलांग लगी; कुछ ने इसे सुसंगत और पसंदीदा कहा।"
  work:
    - en: "Recent reviewers found the exam tough even after doing many past papers. Symmetry and 3D visualisation were hard at first, and one 2022 reviewer had to largely self-learn the quantum section."
      zh: "近期同学觉得即使做了很多往年试卷，期末还是很难。对称性和三维想象一开始很难；一位 2022 年的同学说量子部分基本靠自学。"
      zh-TW: "近期同學覺得即使做了很多考古題，期末還是很難。對稱性和立體想像一開始很難；一位 2022 年的同學說量子部分基本靠自學。"
      ja: "最近のレビューは、過去問を多くこなしても試験は難しかったと言う。対称性と3Dの把握は最初難しく、2022年の一人は量子の部分をほぼ独学した。"
      ko: "최근 리뷰는 기출을 많이 풀어도 시험이 어려웠다고 한다. 대칭과 3D 시각화는 처음에 어렵고, 2022년 한 리뷰는 양자 부분을 거의 독학했다."
      vi: "Người học gần đây thấy đề thi khó dù đã làm nhiều đề cũ. Đối xứng và hình dung 3D ban đầu khó, và một người năm 2022 phải gần như tự học phần lượng tử."
      ms: "Pengulas terkini rasa peperiksaan sukar walaupun selepas banyak kertas lepas. Simetri dan visualisasi 3D sukar pada mulanya, dan seorang pengulas 2022 terpaksa belajar sendiri bahagian kuantum."
      id: "Pengulas terbaru merasa ujian sulit meski sudah banyak latihan soal lama. Simetri dan visualisasi 3D awalnya sulit, dan satu pengulas 2022 harus belajar sendiri bagian kuantum."
      hi: "हाल के रिव्यूअर्स को कई पुराने पेपर करने के बाद भी परीक्षा कठिन लगी। सममिति और 3D कल्पना शुरू में कठिन थी, और 2022 के एक को क्वांटम हिस्सा ज़्यादातर खुद सीखना पड़ा।"
  watch:
    - en: "Reviews are from 2023 or earlier, and lecturers for each section may have changed since."
      zh: "评价都是 2023 年或更早的，各部分的 lecturer 可能已经换了。"
      zh-TW: "評價都是 2023 年或更早的，各部分的 lecturer 可能已經換了。"
      ja: "レビューは2023年以前のもので、各パートの講師は変わっている可能性がある。"
      ko: "리뷰는 2023년 이전이며 각 파트 강사가 바뀌었을 수 있다."
      vi: "Các đánh giá từ 2023 trở về trước, giảng viên từng phần có thể đã thay đổi."
      ms: "Ulasan dari 2023 atau lebih awal, dan pensyarah setiap bahagian mungkin telah bertukar."
      id: "Ulasan dari 2023 atau sebelumnya, dan dosen tiap bagian mungkin sudah berganti."
      hi: "रिव्यू 2023 या पहले के हैं, और हर हिस्से के लेक्चरर तब से बदल गए हो सकते हैं।"
difficulty: hard
