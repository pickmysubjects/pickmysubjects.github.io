points:
  - en: "Very content-heavy and demanding, but many call it one of their favourite subjects thanks to engaging lecturers."
    zh: "内容极多、要求高，但讲课生动，许多人称之为最喜欢的课程之一。"
    zh-TW: "內容極多、要求高，但講課生動，許多人說這是最喜歡的課之一。"
    ja: "内容が非常に多く大変だが、講師の授業が魅力的で、お気に入りの科目の一つという人も多い。"
    ko: "내용이 매우 많고 힘들지만, 강사가 흥미롭게 가르쳐서 가장 좋아하는 과목 중 하나로 꼽는 사람이 많다."
    vi: "Rất nặng nội dung và đòi hỏi cao, nhưng nhiều người coi đây là một trong những môn yêu thích nhờ giảng viên cuốn hút."
    ms: "Sangat padat dan mencabar, tetapi ramai menyebutnya antara subjek kegemaran berkat pensyarah yang menarik."
    id: "Sangat padat dan berat, tapi banyak yang menyebutnya salah satu mata kuliah favorit berkat dosen yang menarik."
    hi: "कंटेंट बहुत ज़्यादा और मेहनत वाला है, पर दिलचस्प लेक्चरर्स की वजह से कई इसे अपना पसंदीदा सब्जेक्ट कहते हैं।"
  - en: "Weekly quizzes and the MST are seen as relatively easy marks; keeping up with lectures helps."
    zh: "每周小测和期中测验被认为相对容易拿分；紧跟讲课进度很有帮助。"
    zh-TW: "每週小測和期中測驗被認為相對容易拿分；跟上講課進度很有幫助。"
    ja: "毎週の小テストとMSTは比較的点が取りやすい。講義についていくことが大切。"
    ko: "주간 퀴즈와 MST는 비교적 점수 따기 쉽다는 평이다. 강의 진도를 따라가면 도움이 된다."
    vi: "Quiz hằng tuần và MST được xem là khá dễ lấy điểm; theo kịp bài giảng sẽ giúp ích."
    ms: "Kuiz mingguan dan MST dianggap agak mudah dapat markah; ikut rentak kuliah membantu."
    id: "Kuis mingguan dan MST dianggap relatif mudah dapat nilai; mengikuti kuliah dengan rutin sangat membantu."
    hi: "साप्ताहिक क्विज़ और MST में नंबर लाना आसान माना जाता है; लेक्चर के साथ चलते रहना मदद करता है।"
  - en: "Recent reviewers (2023-2024) found the final exam tough, with application and scenario questions and big long-answer questions."
    zh: "近期（2023-2024年）评论者认为期末考试很难，有应用和情景题，以及分值很高的长答题。"
    zh-TW: "近期（2023-2024年）評論者認為期末考很難，有應用題和情境題，還有分數很重的長答題。"
    ja: "最近（2023-2024年）のレビューでは、期末試験は難しく、応用・場面設定型の問題や配点の大きい長文記述があったという。"
    ko: "최근(2023-2024년) 리뷰어들은 기말시험이 어려웠다고 한다. 응용·상황 문제와 배점 큰 서술형 문제가 나왔다."
    vi: "Đánh giá gần đây (2023-2024) thấy bài thi cuối khó, có câu hỏi ứng dụng, tình huống và câu tự luận dài nhiều điểm."
    ms: "Pengulas terkini (2023-2024) dapati peperiksaan akhir sukar, dengan soalan aplikasi dan senario serta soalan jawapan panjang yang besar."
    id: "Ulasan terbaru (2023-2024) menilai ujian akhir berat, dengan soal aplikasi dan skenario serta soal esai panjang berbobot besar."
    hi: "हाल के रिव्यूअर्स (2023-2024) को फ़ाइनल परीक्षा कठिन लगी, जिसमें एप्लिकेशन व सिनेरियो सवाल और बड़े लंबे जवाब वाले सवाल थे।"
  - en: "Attending lectures in person and using extra resources (e.g. videos) to understand the basics is recommended."
    zh: "建议现场听课，并借助额外资源（如视频）理解基础概念。"
    zh-TW: "建議到現場聽課，並利用額外資源（如影片）理解基礎概念。"
    ja: "対面で講義に出て、動画などの追加資料で基礎を理解するのがおすすめ。"
    ko: "대면 강의에 참석하고 영상 같은 추가 자료로 기초를 이해하는 것을 추천한다."
    vi: "Nên đi học trực tiếp và dùng thêm tài liệu (như video) để hiểu phần cơ bản."
    ms: "Digalakkan hadir kuliah secara bersemuka dan guna sumber tambahan (cth. video) untuk faham asas."
    id: "Disarankan hadir kuliah langsung dan memakai sumber tambahan (mis. video) untuk memahami dasar-dasarnya."
    hi: "लेक्चर में ख़ुद जाने और बेसिक्स समझने के लिए अतिरिक्त संसाधन (जैसे वीडियो) इस्तेमाल करने की सलाह दी जाती है।"
workload: heavy
difficulty: mixed
