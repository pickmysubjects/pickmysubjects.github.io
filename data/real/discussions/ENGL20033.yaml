points:
  - en: "Most reviews (2019-2023) are glowing: deep knowledge of Shakespeare in performance, and a focus on how the plays live on today."
    zh: "大多数评价（2019-2023）都很高：对莎士比亚演出有深厚了解，也关注这些剧作在今天的生命力。"
    zh-TW: "大多數評價（2019-2023）都很高：對莎士比亞演出有深厚了解，也關注這些劇作在今天的生命力。"
    ja: "ほとんどのレビュー（2019-2023）が絶賛。上演としてのシェイクスピアに詳しく、作品が今どう生きているかにも焦点を当てる。"
    ko: "대부분 리뷰(2019-2023)가 극찬. 공연으로서의 셰익스피어에 대한 깊은 지식과, 작품이 오늘날 어떻게 이어지는지에 초점."
    vi: "Hầu hết đánh giá (2019-2023) đều rất tốt: hiểu sâu về Shakespeare trên sân khấu, và chú trọng cách các vở kịch sống tiếp ngày nay."
    ms: "Kebanyakan ulasan (2019-2023) amat memuji: pengetahuan mendalam tentang Shakespeare dalam persembahan, dan fokus pada bagaimana drama itu kekal relevan hari ini."
    id: "Kebanyakan ulasan (2019-2023) sangat memuji: pengetahuan mendalam tentang Shakespeare dalam pementasan, dan fokus pada bagaimana dramanya tetap hidup kini."
    hi: "ज़्यादातर रिव्यू (2019-2023) बेहद तारीफ़ भरे हैं: मंचन के रूप में शेक्सपियर की गहरी समझ, और यह कि नाटक आज भी कैसे जीवित हैं।"
  - en: "Assessments are open-ended, with creative options instead of an essay, and the performance element is only a short presentation. A 2017 reviewer would have preferred lectures over the seminar format."
    zh: "考核形式开放，可以用创意作品代替论文，表演部分只是一个简短展示。一位2017年的评论者更希望用讲座而不是研讨课形式。"
    zh-TW: "評量形式開放，可以用創意作品代替論文，表演部分只是一個簡短展示。一位2017年的評論者更希望用講課而不是研討課形式。"
    ja: "評価は自由度が高く、エッセイの代わりに創作的な選択肢もあり、パフォーマンス要素は短い発表だけ。2017年のレビューではセミナー形式より講義の方がよかったとのこと。"
    ko: "평가는 자유로운 형식으로 에세이 대신 창작 옵션도 있고, 공연 요소는 짧은 발표뿐. 2017년 리뷰어는 세미나보다 강의 형식을 선호했음."
    vi: "Bài đánh giá mở, có lựa chọn sáng tạo thay cho tiểu luận, phần trình diễn chỉ là bài thuyết trình ngắn. Một người năm 2017 thích dạng bài giảng hơn seminar."
    ms: "Penilaian terbuka, dengan pilihan kreatif selain esei, dan elemen persembahan hanya pembentangan pendek. Seorang pengulas 2017 lebih suka kuliah berbanding format seminar."
    id: "Penilaiannya terbuka, dengan opsi kreatif sebagai ganti esai, dan unsur pertunjukan hanya presentasi singkat. Pengulas 2017 lebih suka kuliah daripada format seminar."
    hi: "आकलन खुले हैं, निबंध की जगह रचनात्मक विकल्प भी हैं, और परफ़ॉर्मेंस वाला हिस्सा बस एक छोटी प्रस्तुति है। 2017 के एक रिव्यूअर को सेमिनार की जगह लेक्चर बेहतर लगते।"
