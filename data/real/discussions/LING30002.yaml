points:
  - en: "Phonology is built around practical problem solving and suits those who liked Phonetics. The 2022 reviewer found the first half mostly revision and the second half more interesting."
    zh: "音系学以实际解题为核心，适合喜欢语音学的人。2022年的评论者觉得前半段主要是复习，后半段更有意思。"
    zh-TW: "音系學以實際解題為核心，適合喜歡語音學的人。2022年的評論者覺得前半段主要是複習，後半段更有意思。"
    ja: "音韻論は実践的な問題解決が中心で、音声学が好きだった人に向く。2022年のレビューでは前半はほぼ復習、後半の方が面白いとされた。"
    ko: "음운론은 실전 문제 풀이 중심이라 음성학을 좋아했다면 잘 맞음. 2022년 리뷰어는 전반부는 주로 복습이고 후반부가 더 흥미롭다고 함."
    vi: "Âm vị học xoay quanh giải bài tập thực hành, hợp với ai thích Ngữ âm học. Người năm 2022 thấy nửa đầu chủ yếu là ôn lại, nửa sau thú vị hơn."
    ms: "Fonologi berasaskan penyelesaian masalah praktikal dan sesuai untuk yang suka Fonetik. Pengulas 2022 dapati separuh pertama kebanyakan ulang kaji dan separuh kedua lebih menarik."
    id: "Fonologi berpusat pada pemecahan soal praktis dan cocok bagi yang suka Fonetik. Pengulas 2022 merasa paruh pertama kebanyakan pengulangan dan paruh kedua lebih menarik."
    hi: "फ़ोनोलॉजी व्यावहारिक समस्या-समाधान पर आधारित है और फ़ोनेटिक्स पसंद करने वालों के लिए उपयुक्त है। 2022 के रिव्यूअर को पहला हिस्सा ज़्यादातर दोहराव और दूसरा ज़्यादा दिलचस्प लगा।"
  - en: "All three found it tough, and lectures and tutorials were described as dry."
    zh: "三位评论者都觉得这门课难，讲座和辅导课也被形容为枯燥。"
    zh-TW: "三位評論者都覺得這門課難，講座和輔導課也被形容為枯燥。"
    ja: "3人とも難しいと感じ、講義やチュートリアルは退屈だとされた。"
    ko: "세 명 모두 어렵다고 느꼈고, 강의와 튜토리얼은 지루하다고 묘사됨."
    vi: "Cả ba đều thấy môn khó, bài giảng và tutorial được mô tả là khô khan."
    ms: "Ketiga-tiganya dapati ia sukar, dan kuliah serta tutorial digambarkan hambar."
    id: "Ketiganya merasa sulit, dan kuliah serta tutorial digambarkan kering."
    hi: "तीनों को यह कठिन लगा, और लेक्चर व ट्यूटोरियल को नीरस बताया गया।"
difficulty: hard
