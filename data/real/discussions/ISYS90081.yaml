points:
  - en: "Reviewers found it well organised and fun, with resources clearly available. It teaches practical skills in organisational processes and data flow diagrams."
    zh: "评论认为课程组织得好、有趣，资料清楚易得。能学到组织流程和数据流图方面的实用技能。"
    zh-TW: "評論認為課程組織良好又有趣，資料清楚好找。能學到組織流程和資料流程圖的實用技能。"
    ja: "よく整理されていて楽しく、資料も分かりやすく用意されているという評価。組織のプロセスやデータフロー図の実践的なスキルが身につく。"
    ko: "구성이 잘 되어 있고 재미있으며 자료도 잘 갖춰져 있다는 평이다. 조직 프로세스와 데이터 흐름도에 대한 실용적인 기술을 배운다."
    vi: "Người đánh giá thấy môn được tổ chức tốt, vui và tài liệu rõ ràng. Môn dạy kỹ năng thực tế về quy trình tổ chức và sơ đồ luồng dữ liệu."
    ms: "Pengulas dapati ia tersusun dan seronok, dengan sumber yang jelas tersedia. Ia mengajar kemahiran praktikal tentang proses organisasi dan rajah aliran data."
    id: "Pengulas merasa mata kuliah ini tertata dan seru, dengan sumber yang jelas tersedia. Mengajarkan keterampilan praktis soal proses organisasi dan diagram aliran data."
    hi: "रिव्यूअर्स को यह सुव्यवस्थित और मज़ेदार लगा, और सामग्री साफ़ तौर पर उपलब्ध है। यह संगठन की प्रक्रियाओं और डेटा फ़्लो डायग्राम के व्यावहारिक कौशल सिखाता है।"
  - en: "Work involves spotting gaps and solving them with set principles, which takes creativity. **For good marks, answers need to be specific**, not just broadly right."
    zh: "要找出缺漏并用既定原则去解决，需要创造力。**想拿高分，答案必须具体**，大致正确不够。"
    zh-TW: "要找出缺漏並用既定原則解決，需要創意。**想拿高分，答案必須具體**，大致正確不夠。"
    ja: "足りない点を見つけ、決められた原則で解決する作業で、創意工夫が要る。**高得点には具体的な答えが必要**で、大まかに合っているだけでは足りない。"
    ko: "빠진 부분을 찾아 정해진 원칙으로 해결하는 방식이라 창의력이 필요하다. **좋은 점수를 받으려면 답이 구체적이어야 하며**, 대략 맞는 것으로는 부족하다."
    vi: "Bài làm là tìm chỗ thiếu và giải quyết bằng các nguyên tắc có sẵn, cần sáng tạo. **Muốn điểm cao thì câu trả lời phải cụ thể**, không chỉ đúng đại khái."
    ms: "Kerjanya melibatkan mencari jurang dan menyelesaikannya dengan prinsip yang ditetapkan, jadi perlu kreativiti. **Untuk markah baik, jawapan mesti spesifik**, bukan sekadar betul secara umum."
    id: "Tugasnya mencari celah lalu menyelesaikannya dengan prinsip yang sudah ditentukan, jadi butuh kreativitas. **Untuk nilai bagus, jawaban harus spesifik**, tidak cukup benar secara garis besar."
    hi: "काम में कमियाँ ढूँढकर तय सिद्धांतों से उन्हें हल करना होता है, जिसमें रचनात्मकता चाहिए। **अच्छे अंकों के लिए जवाब सटीक होने चाहिए**, सिर्फ़ मोटे तौर पर सही काफ़ी नहीं।"
  - en: "All reviews are from 2017 or earlier, so the subject may have changed since."
    zh: "所有评论都在2017年或更早，课程之后可能已有变化。"
    zh-TW: "所有評論都在 2017 年或更早，課程之後可能已有變化。"
    ja: "レビューはすべて2017年以前のもので、その後内容が変わっている可能性がある。"
    ko: "모든 후기가 2017년 이전 것이라 이후 바뀌었을 수 있다."
    vi: "Tất cả đánh giá đều từ năm 2017 trở về trước, nên môn học có thể đã thay đổi."
    ms: "Semua ulasan dari 2017 atau lebih awal, jadi subjek ini mungkin sudah berubah."
    id: "Semua ulasan dari 2017 atau sebelumnya, jadi mata kuliah ini mungkin sudah berubah."
    hi: "सारे रिव्यू 2017 या उससे पहले के हैं, इसलिए विषय अब बदल चुका हो सकता है।"
