code: CHEM20018
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/chem20018
reviews: 10
from: 2016
to: 2025
checked: 2026-10-08
points:
  - en: "A clear step up from first-year chemistry, very content heavy, with modules that feel disconnected from each other."
    zh: "相比一年级化学难度明显提升，内容量大，各模块之间联系较弱。"
    zh-TW: "比大一化學明顯難一級，內容很多，各單元之間感覺沒什麼關聯。"
    ja: "1年次の化学から明らかにレベルが上がり、内容が非常に多く、単元同士のつながりも薄く感じる。"
    ko: "1학년 화학보다 확실히 어려워지고 내용이 매우 많으며, 모듈끼리 따로 노는 느낌이다."
    vi: "Khó hơn rõ rệt so với hóa năm nhất, rất nặng nội dung, các module có vẻ rời rạc với nhau."
    ms: "Peningkatan yang jelas daripada kimia tahun pertama, sangat padat, dengan modul yang terasa tidak berkait antara satu sama lain."
    id: "Lonjakan jelas dari kimia tahun pertama, sangat padat, dengan modul yang terasa tidak saling terhubung."
    hi: "फ़र्स्ट-ईयर केमिस्ट्री से साफ़ तौर पर कठिन, कंटेंट बहुत ज़्यादा, और मॉड्यूल आपस में जुड़े हुए नहीं लगते।"
  - en: "Assessment is exam heavy (about 80% final, plus a few online quizzes), so small mistakes cost a lot."
    zh: "考核以考试为主（期末约占80%，另有少量在线测验），小失误代价很大。"
    zh-TW: "評量以考試為主（期末約80%，加上幾次線上小測），小失誤代價很大。"
    ja: "評価は試験中心（期末約80%と数回のオンライン小テスト）なので、小さなミスが大きく響く。"
    ko: "평가는 시험 위주(기말 약 80%와 온라인 퀴즈 몇 개)라서 작은 실수도 크게 깎인다."
    vi: "Đánh giá nặng về thi (cuối kỳ khoảng 80%, cộng vài quiz online), nên sai sót nhỏ cũng mất nhiều điểm."
    ms: "Penilaian berat pada peperiksaan (akhir kira-kira 80%, serta beberapa kuiz dalam talian), jadi kesilapan kecil menjejaskan banyak."
    id: "Penilaian berat di ujian (akhir sekitar 80%, plus beberapa kuis online), jadi kesalahan kecil berdampak besar."
    hi: "असेसमेंट परीक्षा-भारी है (फ़ाइनल लगभग 80%, साथ में कुछ ऑनलाइन क्विज़), इसलिए छोटी ग़लतियाँ भी महँगी पड़ती हैं।"
  - en: "Physical chemistry needs some physics and calculus. Attend tutorials, because exams can test theory you may not expect."
    zh: "物理化学部分需要一定物理和微积分基础；要去上辅导课，考试可能考到意想不到的理论内容。"
    zh-TW: "物理化學需要一些物理和微積分。要去上輔導課，因為考試可能考到意想不到的理論。"
    ja: "物理化学には物理と微積分の知識が少し必要。試験で予想外の理論が出ることもあるので、チュートリアルに出よう。"
    ko: "물리화학은 물리와 미적분이 어느 정도 필요하다. 시험에 예상 못한 이론이 나올 수 있으니 튜토리얼에 참석하자."
    vi: "Hóa lý cần chút vật lý và giải tích. Hãy đi tutorial, vì đề thi có thể hỏi lý thuyết bạn không ngờ tới."
    ms: "Kimia fizikal perlukan sedikit fizik dan kalkulus. Hadiri tutorial, kerana peperiksaan boleh menguji teori yang anda tidak jangka."
    id: "Kimia fisik butuh sedikit fisika dan kalkulus. Ikuti tutorial, karena ujian bisa menguji teori yang tidak kamu duga."
    hi: "फ़िज़िकल केमिस्ट्री के लिए कुछ फ़िज़िक्स और कैलकुलस चाहिए। ट्यूटोरियल में जाएँ, क्योंकि परीक्षा में अनपेक्षित थ्योरी आ सकती है।"
  - en: "Practise past exams a lot; several say the exam is doable with practice. Note that exam solutions are not released."
    zh: "多做往年试卷，多位认为认真练习就能应对考试；注意学院不公布考试答案。"
    zh-TW: "多練考古題；幾位說有練習就能應付考試。注意考試解答不會公布。"
    ja: "過去問をたくさん解こう。練習すれば試験は何とかなるという声が複数ある。なお試験の解答は公開されない。"
    ko: "기출문제를 많이 풀자. 연습하면 시험은 할 만하다는 사람이 여럿이다. 단, 시험 해답은 공개되지 않는다."
    vi: "Luyện thật nhiều đề cũ; vài người nói luyện kỹ thì đề thi làm được. Lưu ý đáp án đề thi không được công bố."
    ms: "Banyakkan latihan kertas lepas; beberapa kata peperiksaan boleh dihadapi dengan latihan. Ambil perhatian bahawa jawapan peperiksaan tidak dikeluarkan."
    id: "Banyak latihan soal tahun lalu; beberapa bilang ujian bisa diatasi dengan latihan. Perhatikan bahwa kunci jawaban ujian tidak dirilis."
    hi: "पिछले पेपर ख़ूब प्रैक्टिस करें; कई कहते हैं प्रैक्टिस से परीक्षा संभव है। ध्यान दें कि परीक्षा के सॉल्यूशन जारी नहीं होते।"
sections:
  content:
    - en: "A clear step up from first-year chemistry, split into separate modules (organic, coordination/inorganic, thermodynamics, and a materials or biological option). Content heavy, and modules can feel like different subjects."
      zh: "比一年级化学明显难，分成几个独立模块（有机、配位/无机、热力学，最后选材料或生物化学）。内容多，各模块之间感觉像不同的课。"
      zh-TW: "比一年級化學明顯難，分成幾個獨立模組（有機、配位/無機、熱力學，最後選材料或生物化學）。內容多，各模組之間感覺像不同的課。"
      ja: "1年次の化学から明らかに難しくなる。有機、配位・無機、熱力学、最後に材料か生物の選択と、独立したモジュールに分かれる。内容が多く、モジュール同士が別科目のように感じられる。"
      ko: "1학년 화학보다 확실히 어렵다. 유기, 배위·무기, 열역학, 마지막에 재료 또는 생물 선택 등 독립 모듈로 나뉜다. 내용이 많고 모듈끼리 다른 과목처럼 느껴진다."
      vi: "Khó hơn hẳn hóa năm nhất, chia thành các module riêng (hữu cơ, phối trí/vô cơ, nhiệt động học, và lựa chọn vật liệu hoặc sinh học). Nội dung nhiều, các module như những môn khác nhau."
      ms: "Lonjakan jelas dari kimia tahun pertama, dibahagi kepada modul berasingan (organik, koordinasi/bukan organik, termodinamik, dan pilihan bahan atau biologi). Kandungan padat, modul terasa seperti subjek berbeza."
      id: "Jelas lebih sulit dari kimia tahun pertama, dibagi menjadi modul terpisah (organik, koordinasi/anorganik, termodinamika, dan pilihan material atau biologi). Materinya padat, modulnya terasa seperti mata kuliah berbeda."
      hi: "फ़र्स्ट-ईयर केमिस्ट्री से साफ़ तौर पर कठिन, अलग-अलग मॉड्यूल में बँटा (ऑर्गेनिक, कोऑर्डिनेशन/इनऑर्गेनिक, थर्मोडायनामिक्स, और मटीरियल्स या बायोलॉजिकल विकल्प)। कंटेंट भारी, मॉड्यूल अलग-अलग विषयों जैसे लगते हैं।"
    - en: "The physical chemistry part can feel like physics; one reviewer says some high school physics and calculus helps. One BBiomed student found extra pre-reading useful."
      zh: "物理化学部分感觉像在学物理；有一位同学说有高中物理和微积分基础会好些。一位 BBiomed 同学觉得提前预习很有用。"
      zh-TW: "物理化學部分感覺像在學物理；有一位同學說有高中物理和微積分基礎會好些。一位 BBiomed 同學覺得事先預習很有用。"
      ja: "物理化学の部分は物理のように感じることも。高校物理と微積分の素地があると良いという人が一人。BBiomedの一人は事前の予習が役立ったと言う。"
      ko: "물리화학 부분은 물리처럼 느껴질 수 있다. 고등학교 물리와 미적분 배경이 도움이 된다는 리뷰어가 한 명. BBiomed 학생 한 명은 미리 예습한 것이 유용했다고 한다."
      vi: "Phần hóa lý có thể giống học vật lý; một người nói có nền vật lý cấp 3 và giải tích sẽ đỡ hơn. Một sinh viên BBiomed thấy đọc trước rất hữu ích."
      ms: "Bahagian kimia fizikal boleh terasa seperti fizik; seorang pengulas kata asas fizik sekolah dan kalkulus membantu. Seorang pelajar BBiomed rasa pra-bacaan tambahan berguna."
      id: "Bagian kimia fisik bisa terasa seperti fisika; satu reviewer bilang dasar fisika SMA dan kalkulus membantu. Satu mahasiswa BBiomed merasa membaca lebih dulu sangat berguna."
      hi: "फ़िज़िकल केमिस्ट्री वाला हिस्सा फ़िज़िक्स जैसा लग सकता है; एक रिव्यूअर कहते हैं हाई स्कूल फ़िज़िक्स और कैलकुलस मदद करते हैं। एक BBiomed छात्र को पहले से पढ़ना उपयोगी लगा।"
  work:
    - en: "Very exam heavy: weekly online open-book quizzes and an 80% final exam. One recent reviewer found the exam harder than first year, with theory questions drawn from tutorial content."
      zh: "非常看考试：每周网上开卷小测，加占 80% 的期末。一位近期同学说考试比一年级难，有些理论题出自 tutorial 内容。"
      zh-TW: "非常看考試：每週線上開書小考，加占 80% 的期末。一位近期同學說考試比一年級難，有些理論題出自 tutorial 內容。"
      ja: "試験比重が非常に大きい：毎週のオンライン・オープンブックのクイズと80%の期末試験。最近の一人は1年次より難しく、チュートリアルの内容から理論問題が出たと言う。"
      ko: "시험 비중이 매우 크다: 매주 온라인 오픈북 퀴즈와 80% 기말. 최근 한 리뷰어는 1학년보다 어려웠고 튜토리얼 내용에서 이론 문제가 나왔다고 한다."
      vi: "Rất nặng thi: quiz online mở sách hằng tuần và bài thi cuối 80%. Một người gần đây thấy đề khó hơn năm nhất, có câu lý thuyết lấy từ nội dung tutorial."
      ms: "Sangat bergantung pada peperiksaan: kuiz dalam talian buku terbuka mingguan dan peperiksaan akhir 80%. Seorang pengulas terkini rasa peperiksaan lebih sukar dari tahun pertama, dengan soalan teori dari kandungan tutorial."
      id: "Sangat berat di ujian: kuis online open-book mingguan dan ujian akhir 80%. Satu reviewer terbaru merasa ujiannya lebih sulit dari tahun pertama, dengan soal teori dari materi tutorial."
      hi: "बहुत परीक्षा-केंद्रित: साप्ताहिक ऑनलाइन ओपन-बुक क्विज़ और 80% की फ़ाइनल परीक्षा। एक हालिया रिव्यूअर को परीक्षा फ़र्स्ट ईयर से कठिन लगी, कुछ थ्योरी सवाल ट्यूटोरियल से आए।"
  study:
    - en: "Attend tutorials in person, practise with past exams (solutions aren't released, but tutorial solutions are), and keep up through the semester; cramming it all in swotvac is very hard."
      zh: "tutorial 要亲自去，用往年考题练习（不公布考试答案，但有 tutorial 答案），整个学期保持进度；全留到 swotvac 会非常吃力。"
      zh-TW: "tutorial 要親自去，用考古題練習（不公布考試解答，但有 tutorial 解答），整個學期保持進度；全留到 swotvac 會非常吃力。"
      ja: "チュートリアルには対面で出席し、過去問で練習しよう（試験の解答は非公開だがチュートリアル解答はある）。学期中に遅れないこと。swotvacで全部詰め込むのは非常に難しい。"
      ko: "튜토리얼에 직접 나가고 기출로 연습하자(시험 해답은 공개 안 되지만 튜토리얼 해답은 있다). 학기 내내 진도를 유지하자. swotvac에 몰아서 하기는 매우 어렵다."
      vi: "Đi tutorial trực tiếp, luyện đề cũ (không công bố đáp án đề thi, nhưng có lời giải tutorial), và theo kịp suốt học kỳ; dồn hết vào swotvac rất khó."
      ms: "Hadir tutorial secara bersemuka, latih kertas lepas (jawapan peperiksaan tidak dikeluarkan, tetapi jawapan tutorial ada), dan ikuti sepanjang semester; menelaah semua semasa swotvac sangat sukar."
      id: "Datang tutorial langsung, latihan soal lama (solusi ujian tak dirilis, tapi solusi tutorial ada), dan ikuti terus sepanjang semester; menumpuk semua di swotvac sangat berat."
      hi: "ट्यूटोरियल में खुद जाएँ, पुरानी परीक्षाओं से प्रैक्टिस करें (परीक्षा के हल नहीं मिलते, ट्यूटोरियल के मिलते हैं), और पूरे सेमेस्टर साथ चलें; सब swotvac में रटना बहुत कठिन है।"
workload: heavy
difficulty: mixed
