points:
  - en: "A clear step up from first-year chemistry, very content heavy, with modules that feel disconnected from each other."
    zh: "相比一年级化学难度明显提升，内容量大，各模块之间联系较弱。"
  - en: "Assessment is exam heavy (about 80% final, plus a few online quizzes), so small mistakes cost a lot."
    zh: "考核以考试为主（期末约占80%，另有少量在线测验），小失误代价很大。"
  - en: "Physical chemistry needs some physics and calculus. Attend tutorials, because exams can test theory you may not expect."
    zh: "物理化学部分需要一定物理和微积分基础；要去上辅导课，考试可能考到意想不到的理论内容。"
  - en: "Practise past exams a lot; several say the exam is doable with practice. Note that exam solutions are not released."
    zh: "多做往年试卷，多位认为认真练习就能应对考试；注意学院不公布考试答案。"
workload: heavy
