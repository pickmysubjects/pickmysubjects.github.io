code: LING20006
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/ling20006
reviews: 10
from: 2017
to: 2026
checked: 2026-10-17
points:
  - en: "Syntax is abstract problem solving: working out the grammar of other languages from data. Most reviewers call it hard and a lot of work, and advise against it as a breadth unless you enjoy puzzles."
    zh: "句法学是抽象的解题：从语料推出其他语言的语法。多数评论者说很难、工作量大，除非你喜欢解谜，否则不建议当跨学科选修。"
    zh-TW: "句法學是抽象的解題：從語料推出其他語言的語法。多數評論者說很難、工作量大，除非你喜歡解謎，否則不建議當Breadth選修。"
    ja: "統語論は抽象的な問題解決で、データから他言語の文法を導き出す。多くは難しく負担が大きいとし、パズル好きでなければBreadthには勧めない。"
    ko: "통사론은 데이터로 다른 언어의 문법을 추론하는 추상적 문제 해결. 대부분 어렵고 할 일이 많다며, 퍼즐을 좋아하지 않으면 Breadth로 권하지 않음."
    vi: "Cú pháp học là giải quyết vấn đề trừu tượng: suy ra ngữ pháp của ngôn ngữ khác từ dữ liệu. Đa số nói khó và nhiều việc, không khuyên chọn làm Breadth trừ khi bạn thích giải đố."
    ms: "Sintaksis ialah penyelesaian masalah abstrak: mencari tatabahasa bahasa lain daripada data. Kebanyakan kata ia sukar dan banyak kerja, tidak disyorkan sebagai Breadth kecuali anda suka teka-teki."
    id: "Sintaksis adalah pemecahan masalah abstrak: menyimpulkan tata bahasa bahasa lain dari data. Kebanyakan bilang sulit dan banyak kerja, tidak disarankan sebagai Breadth kecuali suka teka-teki."
    hi: "सिंटैक्स अमूर्त समस्या-समाधान है: डेटा से दूसरी भाषाओं का व्याकरण निकालना। ज़्यादातर इसे कठिन और मेहनत वाला बताते हैं, और पहेलियाँ पसंद न हों तो Breadth के रूप में न लेने की सलाह देते हैं।"
  - en: "Best preparation: do the tutorial exercises and understand the worked solutions; taking LING20011 first helps. PASS sessions were praised but a 2026 reviewer said they no longer run."
    zh: "最佳准备：做辅导课练习，弄懂例题解答；先修LING20011有帮助。PASS辅导曾备受好评，但一位2026年的评论者说已经没有了。"
    zh-TW: "最佳準備：做輔導課練習，弄懂例題解答；先修LING20011有幫助。PASS輔導曾備受好評，但一位2026年的評論者說已經沒有了。"
    ja: "最善の準備はチュートリアル演習をこなし解答例を理解すること。先にLING20011を取ると役立つ。PASSは好評だったが、2026年のレビューではもう実施されていないという。"
    ko: "최선의 준비는 튜토리얼 연습을 하고 풀이를 이해하는 것, LING20011을 먼저 들으면 도움이 됨. PASS 세션이 호평이었지만 2026년 리뷰어는 더 이상 없다고 함."
    vi: "Cách chuẩn bị tốt nhất: làm bài tập tutorial và hiểu lời giải mẫu; học LING20011 trước sẽ giúp ích. Buổi PASS từng được khen nhưng một người năm 2026 nói không còn nữa."
    ms: "Persediaan terbaik: buat latihan tutorial dan fahami penyelesaian contoh; ambil LING20011 dahulu membantu. Sesi PASS dipuji tetapi seorang pengulas 2026 kata ia tidak lagi diadakan."
    id: "Persiapan terbaik: kerjakan latihan tutorial dan pahami contoh penyelesaian; mengambil LING20011 lebih dulu membantu. Sesi PASS dipuji tapi seorang pengulas 2026 bilang sudah tidak ada."
    hi: "सबसे अच्छी तैयारी: ट्यूटोरियल अभ्यास करें और हल किए गए उदाहरण समझें; पहले LING20011 लेना मदद करता है। PASS सेशन की तारीफ़ हुई, पर 2026 के एक रिव्यूअर ने कहा कि अब ये नहीं होते।"
  - en: "Several found the exam harder than practice papers, though a 2025 reviewer said lecture content alone covered it well."
    zh: "好几人觉得考试比练习卷难，不过一位2025年的评论者说只靠讲座内容就足以应对。"
    zh-TW: "好幾個人覺得考試比練習卷難，不過一位2025年的評論者說只靠講座內容就足以應對。"
    ja: "試験が練習問題より難しいと感じた人が複数いたが、2025年のレビューでは講義内容だけで十分対応できたという。"
    ko: "시험이 연습 문제보다 어렵다는 의견이 여럿이지만, 2025년 리뷰어는 강의 내용만으로 충분했다고 함."
    vi: "Nhiều người thấy bài thi khó hơn đề luyện tập, dù một người năm 2025 nói chỉ cần nội dung bài giảng là đủ."
    ms: "Beberapa orang dapati peperiksaan lebih sukar daripada kertas latihan, walaupun seorang pengulas 2025 kata kandungan kuliah sahaja sudah memadai."
    id: "Beberapa orang merasa ujian lebih sulit dari soal latihan, meski seorang pengulas 2025 bilang materi kuliah saja sudah cukup."
    hi: "कई लोगों को एग्ज़ाम प्रैक्टिस पेपर से कठिन लगा, हालाँकि 2025 के एक रिव्यूअर ने कहा कि सिर्फ़ लेक्चर कंटेंट से अच्छी तैयारी हो गई।"
sections:
  content:
    - en: "Mostly problem solving: working out the grammar of other languages. People who like puzzles enjoy it; others found it hard, dry and a lot of work."
      zh: "主要是解题：分析其他语言的语法。喜欢解谜的人会喜欢；也有人觉得难、枯燥、工作量大。"
      zh-TW: "主要是解題：分析其他語言的文法。喜歡解謎的人會喜歡；也有人覺得難、乏味、工作量大。"
      ja: "中心は問題解決で、他言語の文法を解き明かす。パズル好きには楽しいが、難しく退屈で大変だという人もいる。"
      ko: "주로 문제 풀이로, 다른 언어의 문법을 분석한다. 퍼즐을 좋아하면 즐겁지만, 어렵고 지루하고 일이 많다는 사람도 있다."
      vi: "Chủ yếu là giải bài: tìm ra ngữ pháp của các ngôn ngữ khác. Ai thích giải đố sẽ thích; người khác thấy khó, khô khan và nhiều việc."
      ms: "Kebanyakannya penyelesaian masalah: merungkai tatabahasa bahasa lain. Peminat teka-teki suka; yang lain rasa sukar, hambar dan banyak kerja."
      id: "Kebanyakan pemecahan masalah: mengurai tata bahasa bahasa lain. Penyuka teka-teki menikmatinya; yang lain merasa sulit, kering, dan banyak kerja."
      hi: "ज़्यादातर प्रॉब्लम सॉल्विंग: दूसरी भाषाओं का व्याकरण निकालना। पहेली पसंद करने वालों को मज़ा आता है; बाकियों को कठिन, नीरस और भारी लगा।"
  work:
    - en: "Assignments are hard and push past what's done in class. Views on the exam differ: some found it much harder than the practice exam, others very manageable."
      zh: "作业难，要求超出课上内容。对考试看法不一：有人觉得比模拟考难很多，也有人觉得完全能应付。"
      zh-TW: "作業難，要求超出課堂內容。對考試看法不一：有人覺得比模擬考難很多，也有人覺得完全能應付。"
      ja: "課題は難しく、授業の範囲を超える。試験の評価は分かれ、模試よりずっと難しかった人も、十分こなせた人もいる。"
      ko: "과제가 어렵고 수업 범위를 넘어선다. 시험 평가는 갈려, 모의시험보다 훨씬 어려웠다는 사람도, 충분히 할 만했다는 사람도 있다."
      vi: "Bài tập khó, vượt quá những gì học trên lớp. Ý kiến về bài thi khác nhau: có người thấy khó hơn đề thử nhiều, có người thấy dễ xoay xở."
      ms: "Tugasan sukar dan melangkaui apa yang dibuat di kelas. Pandangan tentang peperiksaan berbeza: ada yang rasa jauh lebih sukar dari latihan, ada yang rasa mudah diurus."
      id: "Tugasnya sulit dan melampaui materi kelas. Pendapat soal ujian berbeda: ada yang merasa jauh lebih sulit dari ujian latihan, ada yang merasa cukup mudah."
      hi: "असाइनमेंट कठिन हैं और क्लास से आगे जाते हैं। परीक्षा पर राय अलग: कुछ को प्रैक्टिस परीक्षा से बहुत कठिन लगी, कुछ को आसानी से संभलने लायक।"
  study:
    - en: "Actually do the tutorial exercises and understand the solutions, plus the worked examples in lecture notes. One recent reviewer says the exam sticks to lecture content, so revise the slides."
      zh: "认真做 tutorial 练习并搞懂答案，再看 lecture 笔记里的例题。一位近期同学说考试只考 lecture 内容，所以要复习 slides。"
      zh-TW: "認真做 tutorial 練習並弄懂解答，再看 lecture 筆記裡的例題。一位近期同學說考試只考 lecture 內容，所以要複習 slides。"
      ja: "チュートリアルの練習を実際に解き、解答を理解し、講義ノートの例題も押さえる。最近の一人は試験が講義内容のみと言うので、スライドを復習しよう。"
      ko: "튜토리얼 연습을 직접 풀고 해답을 이해하고, 강의 노트의 예제도 보자. 최근 한 리뷰어는 시험이 강의 내용만 나온다고 하니 슬라이드를 복습하자."
      vi: "Làm thật bài tập tutorial và hiểu lời giải, cùng ví dụ trong ghi chú bài giảng. Một người gần đây nói đề chỉ ra trong bài giảng, nên ôn slide."
      ms: "Benar-benar buat latihan tutorial dan fahami jawapan, serta contoh dalam nota kuliah. Seorang pengulas baru-baru ini kata peperiksaan ikut kandungan kuliah, jadi ulang kaji slaid."
      id: "Kerjakan latihan tutorial dan pahami jawabannya, plus contoh di catatan kuliah. Satu reviewer terbaru bilang ujian hanya dari materi kuliah, jadi ulang slide-nya."
      hi: "ट्यूटोरियल अभ्यास सच में करें और हल समझें, साथ में लेक्चर नोट्स के उदाहरण। एक हालिया रिव्यूअर कहते हैं परीक्षा लेक्चर से ही आती है, तो स्लाइड्स दोहराएँ।"
  watch:
    - en: "Most reviewers advise against taking it as breadth without a linguistics background, though one breadth student did fine. PASS sessions were praised, but one recent reviewer says they no longer run."
      zh: "多数同学不建议没有语言学基础的人当 breadth 选，不过有一位 breadth 学生学得不错。PASS 很受好评，但一位近期同学说现在已经没有了。"
      zh-TW: "多數同學不建議沒有語言學基礎的人當 breadth 選，不過有一位 breadth 學生學得不錯。PASS 很受好評，但一位近期同學說現在已經沒有了。"
      ja: "言語学の素地なしにブレッドスで取るのは勧めないという声が多いが、問題なかったブレッドス生も一人。PASSは好評だったが、最近の一人はもう実施されていないと言う。"
      ko: "언어학 배경 없이 브레드스로 듣는 건 비추라는 평이 많지만, 잘 해낸 브레드스 학생도 한 명 있다. PASS는 호평이었으나 최근 한 리뷰어는 이제 없다고 한다."
      vi: "Đa số khuyên không nên học làm breadth nếu chưa có nền ngôn ngữ học, dù một sinh viên breadth vẫn ổn. PASS được khen, nhưng một người gần đây nói nay không còn."
      ms: "Kebanyakan pengulas tidak galakkan ambil sebagai breadth tanpa asas linguistik, walaupun seorang pelajar breadth okey. Sesi PASS dipuji, tetapi seorang pengulas terkini kata ia tiada lagi."
      id: "Kebanyakan reviewer tidak menyarankan diambil sebagai breadth tanpa dasar linguistik, meski satu mahasiswa breadth baik-baik saja. Sesi PASS dipuji, tapi satu reviewer terbaru bilang sudah tidak ada."
      hi: "ज़्यादातर रिव्यूअर बिना भाषाविज्ञान पृष्ठभूमि के ब्रेड्थ में लेने से मना करते हैं, हालाँकि एक ब्रेड्थ छात्र ठीक रहे। PASS की तारीफ़ हुई, पर एक हालिया रिव्यूअर कहते हैं अब नहीं होते।"
workload: heavy
difficulty: hard
