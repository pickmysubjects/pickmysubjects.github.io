points:
  - en: "Reviewers call it fun, with practical classes where you play and coach different sports, and you run a short coaching session yourself."
    zh: "评论者觉得很有趣，实践课可以玩和教各种运动，还要自己带一节短训练课。"
    zh-TW: "評論者覺得很有趣，實作課可以玩和教各種運動，還要自己帶一堂短訓練課。"
    ja: "楽しいという声が多い。実技でさまざまなスポーツを体験・指導し、自分で短い練習も担当する。"
    ko: "재미있다는 평. 실습에서 여러 스포츠를 해보고 가르치며, 직접 짧은 코칭 세션도 진행함."
    vi: "Mọi người thấy vui, có giờ thực hành chơi và huấn luyện nhiều môn thể thao, và tự dẫn một buổi tập ngắn."
    ms: "Pengulas kata seronok, ada kelas amali bermain dan melatih pelbagai sukan, serta mengendali sesi latihan sendiri."
    id: "Pengulas bilang seru, ada kelas praktik bermain dan melatih berbagai olahraga, juga memimpin sesi latihan singkat."
    hi: "रिव्यूअर्स इसे मज़ेदार बताते हैं; प्रैक्टिकल में अलग-अलग खेल खेलते-सिखाते हैं और ख़ुद एक छोटा सत्र चलाते हैं।"
  - en: "Most say it is easy to do well in; following the rubric closely and asking tutors what they want helps a lot."
    zh: "多数人认为容易拿好成绩；紧扣评分标准、多问导师要求很有帮助。"
    zh-TW: "多數人認為容易拿好成績；緊扣評分標準、多問助教要求很有幫助。"
    ja: "高得点は取りやすいとの声が多い。評価基準をよく読み、チューターに確認すると効果的。"
    ko: "대체로 좋은 성적 받기 쉽다고 함. 루브릭을 꼼꼼히 따르고 튜터에게 기대치를 묻는 게 도움됨."
    vi: "Đa số nói dễ đạt điểm cao; bám sát tiêu chí chấm và hỏi tutor họ muốn gì giúp ích nhiều."
    ms: "Kebanyakan kata mudah berjaya; ikut rubrik dengan teliti dan tanya tutor apa yang dikehendaki."
    id: "Mayoritas bilang mudah dapat nilai bagus; ikuti rubrik dengan teliti dan tanya tutor apa yang diminta."
    hi: "ज़्यादातर कहते हैं अच्छे अंक आसान हैं; रूब्रिक ध्यान से मानना और ट्यूटर से अपेक्षा पूछना बहुत मदद करता है।"
  - en: "Several felt it was poorly organised at times, and quizzes sometimes asked about things not covered in lectures."
    zh: "几位觉得课程组织有时较乱，测验偶尔考讲座没讲的内容。"
    zh-TW: "幾位覺得課程安排有時較亂，測驗偶爾考講座沒講的內容。"
    ja: "運営がまずい時があり、小テストに講義で扱わない内容が出たという声もある。"
    ko: "운영이 가끔 엉성하고, 퀴즈에 강의에서 안 다룬 내용이 나왔다는 의견도 있음."
    vi: "Vài người thấy tổ chức đôi lúc lộn xộn, và quiz có khi hỏi điều chưa dạy."
    ms: "Beberapa orang rasa pengurusan kadang-kadang lemah, dan kuiz ada menyoal perkara yang tidak diajar."
    id: "Beberapa merasa pengelolaannya kadang kurang rapi, dan kuis kadang menanyakan materi yang tak dibahas."
    hi: "कुछ को लगा प्रबंधन कभी-कभी कमज़ोर था, और क्विज़ में बिना पढ़ाई चीज़ें पूछी गईं।"
workload: light
difficulty: easy
