points:
  - en: "Most found it well organised, with plenty of practice questions, active online Q&A and supportive staff."
    zh: "多数人认为课程组织良好，练习题丰富，线上答疑活跃，教学人员很支持学生。"
    zh-TW: "多數人覺得課程組織良好，練習題多，線上答疑活躍，教學人員也很支持。"
    ja: "運営が良く、練習問題が豊富で、オンラインQ&Aも活発、スタッフも協力的という声が多い。"
    ko: "대부분 운영이 잘 되고 연습 문제가 많으며 온라인 Q&A가 활발하고 교직원도 잘 도와준다고 했다."
    vi: "Đa số thấy môn tổ chức tốt, nhiều bài luyện tập, hỏi đáp online sôi nổi và đội ngũ hỗ trợ nhiệt tình."
    ms: "Kebanyakan dapati ia tersusun baik, dengan banyak soalan latihan, Soal Jawab dalam talian yang aktif dan staf yang menyokong."
    id: "Kebanyakan menilai pengelolaannya baik, banyak soal latihan, tanya-jawab online aktif, dan staf suportif."
    hi: "ज़्यादातर को यह अच्छी तरह संचालित लगा, जिसमें बहुत प्रैक्टिस सवाल, सक्रिय ऑनलाइन Q&A और मददगार स्टाफ़ है।"
  - en: "The final exam is worth about 65%. Pracs, worksheets and weekly quizzes are easier marks, so secure them."
    zh: "期末考试约占65%；实验、工作表和每周测验相对容易拿分，要尽量拿满。"
    zh-TW: "期末考約占65%。實驗、練習單和每週小測比較好拿分，要把這些分數拿穩。"
    ja: "期末試験は約65%。実験、ワークシート、毎週の小テストは点が取りやすいので確実に取ろう。"
    ko: "기말시험은 약 65%이다. 실험, 워크시트, 주간 퀴즈는 점수 따기 쉬우니 확실히 챙기자."
    vi: "Bài thi cuối chiếm khoảng 65%. Thực hành, worksheet và quiz hằng tuần dễ lấy điểm hơn, nên hãy nắm chắc."
    ms: "Peperiksaan akhir bernilai kira-kira 65%. Amali, lembaran kerja dan kuiz mingguan lebih mudah dapat markah, jadi pastikan anda dapat."
    id: "Ujian akhir berbobot sekitar 65%. Praktikum, lembar kerja, dan kuis mingguan lebih mudah dapat nilai, jadi amankan."
    hi: "फ़ाइनल परीक्षा लगभग 65% की है। प्रैक्टिकल, वर्कशीट और साप्ताहिक क्विज़ में नंबर आसान हैं, इन्हें पक्का करें।"
  - en: "Keep up with lectures and do the tutorial problems weekly. Several who fell behind or underestimated it did poorly."
    zh: "要跟上讲座并每周完成辅导题；多位落后或轻视课程的人成绩不理想。"
    zh-TW: "要跟上講課並每週做輔導題。幾位落後或輕忽這門課的人成績不理想。"
    ja: "講義についていき、チュートリアル問題を毎週解こう。遅れたり甘く見たりした人の中には成績が悪かった人も多い。"
    ko: "강의를 따라가고 튜토리얼 문제를 매주 풀자. 뒤처지거나 얕본 사람 여럿이 성적이 안 좋았다."
    vi: "Theo kịp bài giảng và làm bài tutorial mỗi tuần. Vài người bị tụt lại hoặc xem nhẹ môn này đã có kết quả kém."
    ms: "Ikut rentak kuliah dan buat soalan tutorial setiap minggu. Beberapa yang ketinggalan atau memandang rendah mendapat keputusan lemah."
    id: "Ikuti kuliah dan kerjakan soal tutorial tiap minggu. Beberapa yang tertinggal atau meremehkannya mendapat nilai buruk."
    hi: "लेक्चर के साथ चलें और हर हफ़्ते ट्यूटोरियल सवाल हल करें। कई लोग जो पीछे रहे या इसे हल्के में लिया, उनका रिज़ल्ट ख़राब रहा।"
  - en: "Difficulty is split: many say an H1 is reachable with effort, but some found the maths heavy or the final much harder than the practice exams."
    zh: "难度评价不一：许多人认为努力可拿H1，但也有人觉得数学多，或期末明显难于模拟题。"
    zh-TW: "對難度看法不一：很多人說努力就能拿H1，但也有人覺得數學很重，或期末比模擬考難很多。"
    ja: "難易度の評価は分かれる。努力すればH1も取れるという人が多いが、数学が重い、期末が模擬試験よりずっと難しいと感じた人もいる。"
    ko: "난이도 평가는 갈린다. 노력하면 H1도 가능하다는 사람이 많지만, 수학 비중이 크거나 기말이 모의고사보다 훨씬 어렵다는 사람도 있다."
    vi: "Độ khó được đánh giá khác nhau: nhiều người bảo cố gắng là đạt H1, nhưng có người thấy nặng toán hoặc đề cuối kỳ khó hơn nhiều so với đề luyện."
    ms: "Kesukaran berbelah bahagi: ramai kata H1 boleh dicapai dengan usaha, tetapi ada yang dapati matematiknya berat atau peperiksaan akhir jauh lebih sukar daripada latihan."
    id: "Soal tingkat kesulitan terbelah: banyak yang bilang H1 bisa diraih dengan usaha, tapi ada yang merasa matematikanya berat atau ujian akhir jauh lebih sulit dari latihan."
    hi: "कठिनाई पर राय बंटी है: कई कहते हैं मेहनत से H1 मिल सकता है, पर कुछ को मैथ्स भारी या फ़ाइनल प्रैक्टिस एग्ज़ाम से काफ़ी कठिन लगा।"
difficulty: mixed
