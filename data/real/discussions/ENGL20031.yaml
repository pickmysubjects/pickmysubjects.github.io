points:
  - en: "Now called Literature, Adaptation, Media. Reviewers from 2020 to 2022 found the mix of film and literature interesting, with lectures that stretch the idea of adaptation into history and philosophy."
    zh: "现名 Literature, Adaptation, Media。2020到2022年的评论者觉得电影与文学结合很有意思，讲课会把“改编”的概念延伸到历史和哲学。"
    zh-TW: "現名 Literature, Adaptation, Media。2020到2022年的評論者覺得電影與文學結合很有意思，講課會把「改編」的概念延伸到歷史和哲學。"
    ja: "現在の名称は Literature, Adaptation, Media。2020〜2022年の評者は映画と文学の組み合わせを面白いと感じ、講義は「翻案」の概念を歴史や哲学にまで広げる。"
    ko: "현재 이름은 Literature, Adaptation, Media. 2020~2022년 리뷰어들은 영화와 문학의 결합이 흥미롭다고 했고, 강의는 '각색' 개념을 역사와 철학으로 넓힘."
    vi: "Nay gọi là Literature, Adaptation, Media. Người đánh giá 2020–2022 thấy kết hợp phim và văn học thú vị, bài giảng mở rộng khái niệm chuyển thể sang lịch sử và triết học."
    ms: "Kini dinamakan Literature, Adaptation, Media. Pengulas 2020 hingga 2022 dapati gabungan filem dan sastera menarik, dengan kuliah yang meluaskan idea adaptasi ke sejarah dan falsafah."
    id: "Sekarang bernama Literature, Adaptation, Media. Pengulas 2020 sampai 2022 menganggap perpaduan film dan sastra menarik, dengan kuliah yang memperluas gagasan adaptasi ke sejarah dan filsafat."
    hi: "अब इसका नाम Literature, Adaptation, Media है। 2020 से 2022 के रिव्यूअर्स को फ़िल्म और साहित्य का मेल दिलचस्प लगा; लेक्चर 'अनुकूलन' के विचार को इतिहास और दर्शन तक ले जाते हैं।"
  - en: "There is a film to watch every week plus several books, and a 2020 reviewer found some of them very slow going. Essay questions offer wide choice, leaning to either film or literature."
    zh: "每周要看一部电影，另外还有几本书；2020年一位评论者觉得其中有些非常沉闷。论文题目选择很多，可偏电影也可偏文学。"
    zh-TW: "每週要看一部電影，另外還有幾本書；2020年一位評論者覺得其中有些非常沉悶。論文題目選擇很多，可偏電影也可偏文學。"
    ja: "毎週1本映画を観て、さらに数冊の本を読む。2020年の評者はその一部をかなり退屈に感じた。エッセイ課題は選択肢が多く、映画寄りにも文学寄りにもできる。"
    ko: "매주 영화 한 편과 책 몇 권을 봐야 함. 2020년 리뷰어는 일부가 매우 지루했다고 함. 에세이 문제는 선택지가 넓어 영화나 문학 쪽 중 골라 쓸 수 있음."
    vi: "Mỗi tuần xem một bộ phim cộng thêm vài cuốn sách; người viết năm 2020 thấy vài tác phẩm rất khó nuốt. Đề luận có nhiều lựa chọn, nghiêng về phim hoặc văn học tùy ý."
    ms: "Ada satu filem untuk ditonton setiap minggu serta beberapa buku, dan pengulas 2020 dapati sebahagiannya sangat membosankan. Soalan esei banyak pilihan, sama ada ke arah filem atau sastera."
    id: "Ada satu film untuk ditonton tiap minggu ditambah beberapa buku, dan pengulas 2020 merasa sebagian sangat membosankan. Soal esai punya banyak pilihan, bisa condong ke film atau sastra."
    hi: "हर हफ़्ते एक फ़िल्म देखनी होती है और कुछ किताबें भी पढ़नी होती हैं; 2020 के एक रिव्यूअर को इनमें से कुछ बहुत उबाऊ लगीं। निबंध के सवालों में काफ़ी विकल्प हैं, फ़िल्म या साहित्य किसी पर भी झुकाव रख सकते हैं।"
  - en: "Assignment feedback was singled out as useful; one 2021 reviewer said their essay writing improved and it was their best English mark."
    zh: "作业反馈被特别称赞很有用；2021年一位评论者说写作能力提升了，这是他英语系课程里最好的成绩。"
    zh-TW: "作業回饋被特別稱讚很有用；2021年一位評論者說寫作能力提升了，這是他英文系課程裡最好的成績。"
    ja: "課題のフィードバックが役立つと評価された。2021年の評者はエッセイ力が伸び、英文学科目で一番の成績だったという。"
    ko: "과제 피드백이 유용하다는 평이 있었고, 2021년 리뷰어는 에세이 실력이 늘어 영문학 과목 중 최고 점수를 받았다고 함."
    vi: "Phản hồi bài tập được khen là hữu ích; một người năm 2021 nói kỹ năng viết tiến bộ và đó là điểm môn tiếng Anh cao nhất của họ."
    ms: "Maklum balas tugasan dipuji sebagai berguna; seorang pengulas 2021 kata penulisan eseinya bertambah baik dan ia markah English terbaiknya."
    id: "Umpan balik tugas disebut sangat berguna; seorang pengulas 2021 bilang kemampuan menulis esainya meningkat dan itu nilai English terbaiknya."
    hi: "असाइनमेंट फ़ीडबैक को ख़ास तौर पर उपयोगी बताया गया; 2021 के एक रिव्यूअर ने कहा उनका निबंध लेखन सुधरा और यह उनका सबसे अच्छा इंग्लिश अंक था।"
workload: heavy
