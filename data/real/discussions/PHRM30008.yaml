    vi: "Học quá trình thuốc đi từ đích tác dụng đến thị trường qua các case study. Đánh giá cho biết môn đã cải thiện những năm gần đây."
    ms: "Merangkumi perjalanan ubat dari sasaran ke pasaran melalui kajian kes. Pengulas kata ia bertambah baik sejak beberapa tahun lalu."
