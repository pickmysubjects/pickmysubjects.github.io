points:
  - en: "Reviewers found the models very simplified and hard to link to the real world, though some real-world material is covered; one called the content dry and mostly memorisation."
    zh: "评价者认为模型高度简化、难以联系现实，尽管也涉及一些现实内容；有人说内容枯燥、主要靠背。"
    zh-TW: "評價者認為模型高度簡化、難以連結現實，雖然也有一些現實內容；有人說內容枯燥、主要靠背。"
    ja: "モデルがかなり単純化され現実と結びつけにくいという声。現実の話題も一部ある。内容が無味乾燥で暗記中心という人も。"
    ko: "모델이 매우 단순화돼 현실과 연결하기 어렵다는 평이다. 현실 사례도 일부 다룬다. 내용이 건조하고 주로 암기라는 의견도 있다."
    vi: "Người học thấy các mô hình quá đơn giản, khó liên hệ thực tế dù có một số nội dung thực tế; một người nói nội dung khô khan, chủ yếu học thuộc."
    ms: "Pengulas dapati model sangat dipermudah dan sukar dikaitkan dengan dunia sebenar, walaupun ada sedikit bahan dunia sebenar; seorang kata kandungan hambar dan banyak menghafal."
    id: "Pengulas merasa modelnya sangat disederhanakan dan sulit dikaitkan dengan dunia nyata, meski ada sedikit materi nyata; satu orang bilang materinya kering dan banyak hafalan."
    hi: "रिव्यूअर्स को मॉडल बहुत सरलीकृत और असल दुनिया से जोड़ना मुश्किल लगे, हालाँकि कुछ असल दुनिया की सामग्री भी है; एक ने कंटेंट को नीरस और ज़्यादातर रटने वाला बताया।"
  - en: "One reviewer found it simpler than expected; another noted the exam was scaled."
    zh: "有人觉得比预想的简单；另一位提到考试成绩做过调分。"
    zh-TW: "有人覺得比預期簡單；另一位提到考試成績有調分。"
    ja: "予想より簡単だったという人もいれば、試験の点数が調整されたと述べる人もいる。"
    ko: "예상보다 쉬웠다는 사람도 있고, 시험 점수가 조정됐다고 언급한 사람도 있다."
    vi: "Một người thấy môn dễ hơn dự kiến; người khác nói điểm thi đã được scale."
    ms: "Seorang dapati ia lebih mudah daripada dijangka; seorang lagi kata markah peperiksaan diskala."
    id: "Satu pengulas merasa lebih mudah dari dugaan; yang lain menyebut nilai ujiannya diskalakan."
    hi: "एक रिव्यूअर को यह उम्मीद से आसान लगा; दूसरे ने बताया कि परीक्षा के अंक स्केल किए गए थे।"
  - en: "Best suited to students with a real interest in monetary policy."
    zh: "最适合真正对货币政策感兴趣的学生。"
    zh-TW: "最適合真正對貨幣政策有興趣的學生。"
    ja: "金融政策に本当に興味がある学生に最も向いている。"
    ko: "통화정책에 진짜 관심이 있는 학생에게 가장 잘 맞는다."
    vi: "Phù hợp nhất với sinh viên thật sự quan tâm đến chính sách tiền tệ."
    ms: "Paling sesuai untuk pelajar yang benar-benar berminat dengan dasar monetari."
    id: "Paling cocok untuk mahasiswa yang benar-benar tertarik pada kebijakan moneter."
    hi: "मौद्रिक नीति में सच्ची रुचि रखने वाले छात्रों के लिए सबसे उपयुक्त।"
