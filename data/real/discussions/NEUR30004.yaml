points:
  - en: "Has a strong philosophical side. Opinions are split: some love the contemplative content, others found it rambling and unstructured."
    zh: "偏哲学思辨；评价两极，有人喜欢，有人觉得散漫无结构。"
    zh-TW: "哲學思辨色彩濃；評價兩極，有人喜歡這種思考型內容，有人覺得散漫沒結構。"
    ja: "哲学的な側面が強い。意見は分かれ、思索的な内容が大好きな人もいれば、とりとめがなく構成に欠けると感じた人もいる。"
    ko: "철학적 성격이 강하다. 의견이 갈려, 사색적인 내용을 좋아하는 사람도, 산만하고 구성이 없다는 사람도 있다."
    vi: "Mang màu sắc triết học rõ. Ý kiến trái chiều: có người mê nội dung suy ngẫm, người khác thấy lan man, thiếu cấu trúc."
    ms: "Ada sisi falsafah yang kuat. Pendapat berbelah: ada yang suka kandungan reflektif, ada yang rasa meleret dan tidak tersusun."
    id: "Sisi filosofisnya kuat. Pendapat terbelah: ada yang suka materi kontemplatifnya, ada yang merasa bertele-tele dan tidak terstruktur."
    hi: "इसका दार्शनिक पक्ष मज़बूत है। राय बँटी है: कुछ को चिंतनशील कंटेंट बहुत पसंद, कुछ को बिखरा और बेतरतीब लगा।"
  - en: "The exam is MCQ plus a choice of broad essays. Several found it fair and the assignment leniently marked."
    zh: "期末为选择题加自选宽泛论文题；多人认为公平，作业评分宽松。"
    zh-TW: "期末為選擇題加自選的廣泛論述題；多人認為公平，作業評分寬鬆。"
    ja: "試験は選択式と、幅広いテーマから選ぶ論述。公平で課題の採点も甘いと感じた人が複数いる。"
    ko: "시험은 객관식과 폭넓은 주제 중 고르는 에세이다. 공정하고 과제 채점이 후했다는 사람이 여럿이다."
    vi: "Bài thi gồm trắc nghiệm và chọn một bài luận chủ đề rộng. Nhiều người thấy công bằng và bài tập chấm dễ."
    ms: "Peperiksaan ialah MCQ serta pilihan esei umum. Beberapa dapati ia adil dan tugasan dimarkah dengan longgar."
    id: "Ujiannya pilihan ganda plus esai dengan topik luas yang bisa dipilih. Beberapa menilai adil dan tugasnya dinilai longgar."
    hi: "एग्ज़ाम में MCQ और चुनने के लिए व्यापक एसे। कई को फेयर लगा और असाइनमेंट की मार्किंग नरम।"
  - en: "In 2023 the MST drew random questions from a bank, some on untaught content, which felt unfair."
    zh: "2023年期中从题库随机抽题，部分未教过，显得不公平。"
    zh-TW: "2023年期中考從題庫隨機抽題，部分是沒教過的內容，讓人覺得不公平。"
    ja: "2023年のMSTは問題バンクからランダム出題で、教わっていない内容もあり不公平に感じられた。"
    ko: "2023년 MST는 문제 은행에서 무작위로 출제됐고, 일부는 배우지 않은 내용이라 불공정하게 느껴졌다."
    vi: "Năm 2023, MST lấy câu ngẫu nhiên từ ngân hàng đề, có câu về nội dung chưa dạy, khiến thấy không công bằng."
    ms: "Pada 2023 MST mengambil soalan rawak dari bank soalan, sebahagian tentang kandungan yang tidak diajar, terasa tidak adil."
    id: "Pada 2023 MST mengambil soal acak dari bank soal, sebagian tentang materi yang belum diajarkan, terasa tidak adil."
    hi: "2023 में MST के सवाल बैंक से रैंडम आए, कुछ बिना पढ़ाए कंटेंट से, जो अनुचित लगा।"
