points:
  - en: "Reviewers in 2020 and 2026 found it very enjoyable; one called it a favourite of their whole course."
    zh: "2020和2026年的评论者都觉得很享受；其中一人说这是整个学位里最喜欢的课。"
    zh-TW: "2020和2026年的評論者都覺得很享受；其中一人說這是整個學位裡最喜歡的課。"
    ja: "2020年と2026年のレビューはどちらも大満足で、学位全体で一番好きな科目だという人もいた。"
    ko: "2020년과 2026년 리뷰어 모두 매우 즐거웠다고 함. 한 명은 학위 과정 전체에서 최애 과목이라고 함."
    vi: "Người đánh giá năm 2020 và 2026 đều rất thích; một người gọi đây là môn yêu thích nhất cả khóa."
    ms: "Pengulas pada 2020 dan 2026 sangat menikmatinya; seorang menyebutnya kegemaran dalam seluruh kursus."
    id: "Pengulas di 2020 dan 2026 sangat menikmatinya; seorang menyebutnya favorit di seluruh studinya."
    hi: "2020 और 2026 के रिव्यूअर्स को यह बहुत पसंद आया; एक ने इसे पूरे कोर्स का सबसे पसंदीदा विषय कहा।"
  - en: "The semester builds toward writing your own short-film script: lectures cover formatting, pitching and structure, then workshops give feedback on pitches and drafts."
    zh: "整个学期围绕写一部自己的短片剧本：讲座讲格式、提案和结构，之后写作坊对提案和草稿给反馈。"
    zh-TW: "整個學期圍繞寫一部自己的短片劇本：講課講格式、提案和結構，之後工作坊對提案和草稿給回饋。"
    ja: "学期を通して自分の短編映画の脚本を書く。講義で書式、ピッチ、構成を学び、ワークショップでピッチと草稿にフィードバックをもらう。"
    ko: "학기 전체가 자기 단편영화 대본 쓰기로 이어짐. 강의에서 형식, 피칭, 구조를 배우고 워크숍에서 피칭과 초고에 피드백을 받음."
    vi: "Cả kỳ hướng tới việc viết kịch bản phim ngắn của riêng bạn: bài giảng về định dạng, pitch và cấu trúc, rồi workshop góp ý cho pitch và bản nháp."
    ms: "Semester ini menuju kepada menulis skrip filem pendek sendiri: kuliah meliputi format, pitching dan struktur, kemudian bengkel memberi maklum balas pada pitch dan draf."
    id: "Semester ini mengarah ke penulisan naskah film pendek sendiri: kuliah membahas format, pitching, dan struktur, lalu workshop memberi masukan untuk pitch dan draf."
    hi: "पूरा सेमेस्टर अपनी शॉर्ट-फ़िल्म स्क्रिप्ट लिखने की ओर बढ़ता है: लेक्चर में फ़ॉर्मैटिंग, पिचिंग और संरचना, फिर वर्कशॉप में पिच और ड्राफ़्ट पर फ़ीडबैक।"
  - en: "Assessment is the script, a script report on an unseen screenplay, and a verbal pitch."
    zh: "考核包括剧本、对一部未看过的剧本写评估报告，以及口头提案。"
    zh-TW: "評量包括劇本、對一部沒看過的劇本寫評估報告，以及口頭提案。"
    ja: "評価は脚本、未見の脚本についてのスクリプト・レポート、口頭ピッチ。"
    ko: "평가는 대본, 처음 보는 시나리오에 대한 스크립트 리포트, 구두 피칭."
    vi: "Đánh giá gồm kịch bản, báo cáo nhận xét một kịch bản chưa từng xem, và pitch bằng lời."
    ms: "Penilaian ialah skrip, laporan skrip tentang lakon layar yang belum pernah dilihat, dan pitch lisan."
    id: "Penilaian berupa naskah, laporan naskah atas skenario yang belum pernah ditonton, dan pitch lisan."
    hi: "आकलन में स्क्रिप्ट, किसी अनदेखी पटकथा पर स्क्रिप्ट रिपोर्ट, और मौखिक पिच शामिल हैं।"
