points:
  - en: "Opinions are split on difficulty: some found it easy, others said it ramps up quickly after the first weeks."
    zh: "对难度看法不一：有人觉得简单，也有人说开课几周后难度迅速上升。"
    zh-TW: "對難度看法不一：有人覺得簡單，也有人說開課幾週後難度很快上升。"
    ja: "難しさの評価は分かれる。簡単だという人もいれば、最初の数週を過ぎると急に難しくなるという人も。"
    ko: "난이도 의견은 갈림: 쉽다는 사람도 있고, 첫 몇 주 이후 급격히 어려워진다는 사람도 있음."
    vi: "Ý kiến về độ khó trái chiều: có người thấy dễ, người khác nói nó khó lên nhanh sau vài tuần đầu."
    ms: "Pendapat tentang kesukaran berbelah bahagi: ada yang rasa mudah, ada yang kata ia cepat jadi sukar selepas minggu awal."
    id: "Pendapat soal tingkat kesulitan terbelah: ada yang merasa mudah, ada yang bilang cepat jadi sulit setelah minggu-minggu awal."
    hi: "कठिनाई पर राय बँटी है: कुछ को आसान लगा, कुछ ने कहा शुरुआती हफ़्तों के बाद यह तेज़ी से कठिन हो जाता है।"
  - en: "The maths is simple, but understanding finance terms and question wording is the real challenge; some formulas are not on the sheet."
    zh: "数学不难，真正的挑战是理解金融术语和题目表述；部分公式不在公式表上。"
    zh-TW: "數學不難，真正的挑戰是理解金融術語和題目敘述；有些公式不在公式表上。"
    ja: "数学は簡単だが、本当の難関は金融用語と問題文の理解。公式シートにない公式もある。"
    ko: "수학은 쉽지만 금융 용어와 문제 표현을 이해하는 게 진짜 어려움이며, 공식표에 없는 공식도 있음."
    vi: "Toán thì đơn giản, cái khó thật sự là hiểu thuật ngữ tài chính và cách đặt câu hỏi; vài công thức không có trong bảng."
    ms: "Matematiknya mudah, tetapi cabaran sebenar ialah memahami istilah kewangan dan ayat soalan; sesetengah formula tiada dalam helaian."
    id: "Matematikanya sederhana, tapi tantangan sebenarnya memahami istilah keuangan dan kalimat soal; beberapa rumus tidak ada di lembar rumus."
    hi: "मैथ्स आसान है, असली चुनौती फ़ाइनेंस के शब्द और सवालों की भाषा समझना है; कुछ फ़ॉर्मूले शीट पर नहीं होते।"
  - en: "Long two-hour lectures can be hard to focus on; do readings beforehand and practise tutorial questions and sample exams."
    zh: "两小时的长课难以集中注意力；建议课前阅读，并多练辅导课习题和样卷。"
    zh-TW: "兩小時的長課很難專心；建議課前先讀，並多練小組課習題和模擬考卷。"
    ja: "2時間の長い講義は集中しにくい。事前にリーディングをし、チュートリアル問題と模擬試験を練習しよう。"
    ko: "2시간짜리 긴 강의는 집중하기 어려우니, 미리 읽기 자료를 보고 튜토리얼 문제와 모의시험을 연습하세요."
    vi: "Bài giảng dài hai tiếng khó tập trung; hãy đọc trước và luyện câu hỏi tutorial cùng đề mẫu."
    ms: "Kuliah dua jam yang panjang sukar untuk fokus; buat bacaan dahulu dan latih soalan tutorial serta contoh peperiksaan."
    id: "Kuliah dua jam sulit untuk fokus; baca materi sebelumnya dan latih soal tutorial serta contoh ujian."
    hi: "दो घंटे के लंबे लेक्चर में ध्यान लगाना मुश्किल है; पहले से रीडिंग करें और ट्यूटोरियल सवाल व सैंपल एग्ज़ाम प्रैक्टिस करें।"
sections:
  content:
    - en: "Core ideas: time value of money, risk and return, CAPM, bond and share valuation. The maths is just algebra, but views on difficulty split: some breadth students found it easy, others found it ramps up fast."
      zh: "核心概念：货币时间价值、风险与收益、CAPM、债券和股票估值。数学只是代数，但难度看法分歧：有的 breadth 学生觉得简单，也有人觉得很快就变难。"
      zh-TW: "核心概念：貨幣時間價值、風險與報酬、CAPM、債券和股票評價。數學只是代數，但難度看法分歧：有的 breadth 學生覺得簡單，也有人覺得很快就變難。"
      ja: "貨幣の時間価値、リスクとリターン、CAPM、債券・株式の評価が中心。数学は代数程度だが難易度の評価は割れ、簡単だったブレッドス生も、すぐ難しくなると感じた人もいる。"
      ko: "화폐의 시간가치, 위험과 수익, CAPM, 채권·주식 평가가 핵심. 수학은 대수 수준이지만 난이도 평가는 갈려 쉬웠다는 브레드스 학생도, 금방 어려워진다는 사람도 있다."
      vi: "Ý chính: giá trị thời gian của tiền, rủi ro và lợi nhuận, CAPM, định giá trái phiếu và cổ phiếu. Toán chỉ là đại số, nhưng độ khó gây tranh cãi: vài sinh viên breadth thấy dễ, người khác thấy khó lên nhanh."
      ms: "Idea teras: nilai masa wang, risiko dan pulangan, CAPM, penilaian bon dan saham. Matematik hanya algebra, tetapi pandangan tentang kesukaran berbeza: sesetengah pelajar breadth rasa mudah, yang lain rasa cepat jadi sukar."
      id: "Inti: nilai waktu uang, risiko dan imbal hasil, CAPM, valuasi obligasi dan saham. Matematikanya hanya aljabar, tapi pendapat soal kesulitan terbelah: sebagian mahasiswa breadth merasa mudah, yang lain merasa cepat jadi sulit."
      hi: "मुख्य विचार: पैसे का समय मूल्य, जोखिम और रिटर्न, CAPM, बॉन्ड और शेयर का मूल्यांकन। मैथ्स बस अलजेब्रा है, पर कठिनाई पर राय बँटी: कुछ ब्रेड्थ छात्रों को आसान लगा, कुछ को जल्दी कठिन होता लगा।"
  work:
    - en: "Small participation-marked assignments, an MST and a final exam. The exam can be conceptual with tricky wording; one reviewer says some needed formulas aren't on the formula sheet."
      zh: "有几份按参与给分的小作业、MST 和期末考试。考试偏概念，措辞容易绕；有一位同学说有些要用的公式不在公式表上。"
      zh-TW: "有幾份按參與給分的小作業、MST 和期末考。考試偏概念，措辭容易繞；有一位同學說有些要用的公式不在公式表上。"
      ja: "参加点の小課題、MST、期末試験。試験は概念的で言い回しが紛らわしいことも。必要な公式の一部が公式シートにないという人が一人。"
      ko: "참여 점수 소과제, MST, 기말시험. 시험은 개념적이고 문장이 까다로울 수 있다. 필요한 공식 일부가 공식표에 없다는 리뷰어가 한 명."
      vi: "Vài bài nhỏ chấm theo tham gia, MST và thi cuối kỳ. Đề có thể thiên khái niệm, câu chữ đánh đố; một người nói vài công thức cần dùng không có trong bảng công thức."
      ms: "Tugasan kecil bermarkah penyertaan, MST dan peperiksaan akhir. Peperiksaan boleh bersifat konsep dengan ayat mengelirukan; seorang kata ada formula diperlukan tiada dalam helaian formula."
      id: "Tugas kecil bernilai partisipasi, MST, dan ujian akhir. Ujian bisa konseptual dengan kalimat menjebak; satu reviewer bilang beberapa rumus yang dibutuhkan tak ada di lembar rumus."
      hi: "भागीदारी अंक वाले छोटे असाइनमेंट, MST और फ़ाइनल परीक्षा। परीक्षा कॉन्सेप्चुअल और उलझे शब्दों वाली हो सकती है; एक रिव्यूअर कहते हैं कुछ ज़रूरी फ़ॉर्मूले फ़ॉर्मूला शीट पर नहीं होते।"
  study:
    - en: "Do the readings before lectures so the terms make sense, try tutorial questions before checking answers, and do at least one sample exam in swotvac. Understand why formulas work."
      zh: "看 lecture 前先读材料，术语才看得懂；tutorial 题先自己做再对答案；swotvac 至少做一套模拟卷。要理解公式背后的道理。"
      zh-TW: "看 lecture 前先讀資料，術語才看得懂；tutorial 題先自己做再對答案；swotvac 至少做一份模擬考。要理解公式背後的道理。"
      ja: "講義前に文献を読んで用語を把握し、チュートリアル問題は解答を見る前に自分で解こう。swotvacでは模試を最低1回。公式が成り立つ理由を理解すること。"
      ko: "강의 전에 읽기를 해 용어를 익히고, 튜토리얼 문제는 답을 보기 전에 직접 풀자. swotvac에 모의시험을 최소 한 번. 공식이 왜 성립하는지 이해하자."
      vi: "Đọc tài liệu trước bài giảng để hiểu thuật ngữ, tự làm bài tutorial trước khi xem đáp án, và làm ít nhất một đề mẫu trong swotvac. Hiểu vì sao công thức đúng."
      ms: "Buat bacaan sebelum kuliah supaya istilah difahami, cuba soalan tutorial sebelum semak jawapan, dan buat sekurang-kurangnya satu peperiksaan contoh semasa swotvac. Fahami kenapa formula berfungsi."
      id: "Baca materi sebelum kuliah agar istilahnya paham, coba soal tutorial sebelum lihat jawaban, dan kerjakan minimal satu ujian contoh saat swotvac. Pahami kenapa rumusnya berlaku."
      hi: "लेक्चर से पहले रीडिंग करें ताकि शब्द समझ आएँ, जवाब देखने से पहले ट्यूटोरियल सवाल खुद करें, और swotvac में कम से कम एक सैंपल परीक्षा दें। फ़ॉर्मूले क्यों काम करते हैं, यह समझें।"
  watch:
    - en: "Several breadth students found the long lectures hard to focus through, and said the subject is clearly aimed at commerce students."
      zh: "好几位 breadth 学生说两小时的 lecture 很难集中，而且课程明显是面向商科学生设计的。"
      zh-TW: "好幾位 breadth 學生說兩小時的 lecture 很難專心，而且課程明顯是為商科學生設計的。"
      ja: "長い講義に集中しにくく、明らかに商学部生向けの科目だと感じたブレッドス生が複数いる。"
      ko: "긴 강의에 집중하기 어렵고 상경계 학생을 위한 과목이라는 게 분명하다는 브레드스 학생이 여럿 있다."
      vi: "Vài sinh viên breadth thấy khó tập trung trong các bài giảng dài, và nói môn này rõ ràng dành cho sinh viên thương mại."
      ms: "Beberapa pelajar breadth rasa sukar fokus dalam kuliah panjang, dan kata subjek ini jelas ditujukan kepada pelajar perdagangan."
      id: "Beberapa mahasiswa breadth sulit fokus di kuliah yang panjang, dan bilang mata kuliah ini jelas ditujukan untuk mahasiswa bisnis."
      hi: "कई ब्रेड्थ छात्रों को लंबे लेक्चर में ध्यान लगाना कठिन लगा, और कहा कि यह साफ़ तौर पर कॉमर्स छात्रों के लिए बना है।"
difficulty: mixed
