code: LAWS30024
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/laws30024
reviews: 4
from: 2019
to: 2024
checked: 2026-10-19
points:
  - en: "Reviews are mostly positive: engaging lectures and a close look at landmark Australian cases from legal and social angles."
    zh: "评价大多正面：讲座吸引人，从法律和社会角度细看澳大利亚的标志性案件。"
    zh-TW: "評價大多正面：講座吸引人，從法律和社會角度細看澳洲的指標性案件。"
    ja: "おおむね好評。講義が面白く、オーストラリアの重要判例を法と社会の両面から詳しく見る。"
    ko: "대체로 호평. 강의가 흥미롭고 호주의 대표 판례를 법과 사회 양쪽에서 자세히 봄."
    vi: "Phần lớn đánh giá tích cực: bài giảng cuốn hút, xem kỹ các vụ án mốc của Úc từ góc độ pháp lý và xã hội."
    ms: "Kebanyakan ulasan positif: kuliah menarik dan kajian dekat kes penting Australia dari sudut undang-undang dan sosial."
    id: "Ulasan umumnya positif: kuliah menarik dan membahas kasus penting Australia dari sisi hukum dan sosial."
    hi: "ज़्यादातर राय सकारात्मक: दिलचस्प लेक्चर, और ऑस्ट्रेलिया के अहम मुक़दमों को क़ानूनी व सामाजिक नज़र से देखना।"
  - en: "The assessment is a fair amount of work and marking is seen as strict, but reviewers found it rewarding."
    zh: "作业量不小、评分偏严，但评论者觉得收获很大。"
    zh-TW: "作業量不小、評分偏嚴，但評論者覺得收穫很大。"
    ja: "課題の量はそれなりで採点も厳しめだが、得るものは大きいという。"
    ko: "과제 양이 꽤 되고 채점이 엄격한 편이지만 보람 있다는 평."
    vi: "Bài đánh giá khá nhiều việc và chấm khắt khe, nhưng người học thấy rất đáng."
    ms: "Penilaian agak banyak kerja dan pemarkahan dianggap ketat, tetapi pengulas rasa berbaloi."
    id: "Tugasnya cukup banyak dan penilaian dianggap ketat, tapi pengulas merasa sepadan."
    hi: "असेसमेंट में काफ़ी काम है और मार्किंग सख़्त मानी जाती है, पर रिव्यूअर्स को फ़ायदेमंद लगा।"
  - en: "Seen as a good taste of law for anyone unsure about studying it; one wished the assessment covered more than a single trial."
    zh: "适合想试试法律、又还没拿定主意的人；有人希望考核不只研究一场审判。"
    zh-TW: "適合想試試法律、又還沒拿定主意的人；有人希望考核不只研究一場審判。"
    ja: "法学に迷っている人のお試しに良いとされる。課題が一つの裁判だけなのが惜しいという声も。"
    ko: "법 공부를 고민 중인 사람에게 맛보기로 좋다는 평. 과제가 재판 하나만 다뤄 아쉽다는 의견도 있음."
    vi: "Được xem là cách nếm thử ngành luật tốt cho người còn phân vân; có người muốn bài đánh giá không chỉ một phiên tòa."
    ms: "Dilihat sebagai cubaan undang-undang yang baik bagi yang ragu; seorang mahu penilaian merangkumi lebih dari satu perbicaraan."
    id: "Dianggap cicipan hukum yang baik bagi yang ragu; satu orang ingin tugasnya mencakup lebih dari satu pengadilan."
    hi: "क़ानून पढ़ने को लेकर असमंजस वालों के लिए अच्छा परिचय माना गया; एक ने चाहा कि असेसमेंट एक से ज़्यादा मुक़दमे पर हो।"
