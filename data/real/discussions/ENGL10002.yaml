code: ENGL10002
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/engl10002
reviews: 5
from: 2015
to: 2026
checked: 2026-10-17
points:
  - en: "Fast-paced, usually a new text each week, with a lot of reading. Reviewers enjoyed the range of texts and found tutorials useful if you speak up. (Renamed Literary Canons: Then and Now by 2026.)"
    zh: "节奏快，通常每周一部新作品，阅读量大。评论者喜欢作品的多样性，认为积极发言的话辅导课很有用。（2026年已改名为Literary Canons: Then and Now。）"
    zh-TW: "節奏快，通常每週一部新作品，閱讀量大。評論者喜歡作品的多樣性，認為積極發言的話輔導課很有用。（2026年已改名為Literary Canons: Then and Now。）"
    ja: "ペースが速く、たいてい毎週新しい作品を読むので読書量が多い。作品の幅広さが好評で、積極的に発言すればチュートリアルは役立つ。（2026年までにLiterary Canons: Then and Nowに改名。）"
    ko: "진도가 빠르고 보통 매주 새 작품을 읽어 읽을 양이 많음. 다양한 작품이 호평이며, 적극 발언하면 튜토리얼이 유용함. (2026년 Literary Canons: Then and Now로 개명.)"
    vi: "Nhịp nhanh, thường mỗi tuần một tác phẩm mới, đọc rất nhiều. Người đánh giá thích sự đa dạng tác phẩm và thấy tutorial hữu ích nếu bạn chịu phát biểu. (Đến 2026 đổi tên thành Literary Canons: Then and Now.)"
    ms: "Laju, biasanya teks baharu setiap minggu, dengan banyak bacaan. Pengulas suka kepelbagaian teks dan dapati tutorial berguna jika anda bersuara. (Dinamakan semula Literary Canons: Then and Now menjelang 2026.)"
    id: "Tempo cepat, biasanya teks baru tiap minggu, dengan banyak bacaan. Pengulas menyukai ragam teksnya dan merasa tutorial berguna jika aktif bicara. (Berganti nama Literary Canons: Then and Now pada 2026.)"
    hi: "तेज़ रफ़्तार, आमतौर पर हर हफ़्ते नया टेक्स्ट, बहुत पढ़ना पड़ता है। रिव्यूअर्स को टेक्स्ट की विविधता पसंद आई और बोलने पर ट्यूटोरियल उपयोगी लगे। (2026 तक नाम Literary Canons: Then and Now हुआ।)"
  - en: "Essays are a big step up from VCE English, but the subject teaches uni essay writing, and several said it became enjoyable once they got the hang of it."
    zh: "论文比高中英语难度高出一大截，但课程会教大学论文写作，好几人说掌握之后就乐在其中了。"
    zh-TW: "論文比高中英文難度高出一大截，但課程會教大學論文寫作，好幾個人說掌握之後就樂在其中了。"
    ja: "エッセイはVCEの英語から大きくレベルアップするが、大学のエッセイの書き方を教えてくれ、慣れると楽しくなったという声が複数。"
    ko: "에세이는 VCE 영어보다 수준이 크게 올라가지만 대학 에세이 쓰는 법을 가르쳐주며, 익숙해지면 즐거워졌다는 의견이 여럿."
    vi: "Bài luận khó hơn hẳn môn tiếng Anh VCE, nhưng môn có dạy cách viết luận đại học, và nhiều người nói khi quen rồi thì thấy thích."
    ms: "Esei jauh lebih tinggi tahapnya daripada Bahasa Inggeris VCE, tetapi subjek ini mengajar penulisan esei universiti, dan beberapa orang kata ia jadi seronok setelah biasa."
    id: "Esai jauh lebih menantang dari bahasa Inggris VCE, tapi mata kuliah ini mengajarkan menulis esai kuliah, dan beberapa orang bilang jadi menyenangkan setelah terbiasa."
    hi: "निबंध VCE इंग्लिश से काफ़ी ऊँचे स्तर के हैं, पर विषय यूनि-स्तर का निबंध लेखन सिखाता है, और कई ने कहा कि आदत होने पर यह मज़ेदार हो गया।"
sections:
  content:
    - en: "A wide range of texts and genres at a fast pace, about one text a week, with lots of reading. Reviewers found it challenging but rewarding, with mostly engaging lectures and great tutorial discussions."
      zh: "节奏很快地读各种文本和体裁，大约一周一本，阅读量大。同学觉得有挑战但收获很大，讲课大多吸引人，tutorial 讨论很棒。"
      zh-TW: "節奏很快地讀各種文本和文類，大約一週一本，閱讀量大。同學覺得有挑戰但收穫很大，講課大多吸引人，tutorial 討論很棒。"
      ja: "幅広い作品とジャンルを週1作ほどのハイペースで読み、リーディングは多い。難しいが得るものが大きく、講義は概ね魅力的でチュートリアルの議論も良いという。"
      ko: "다양한 작품과 장르를 주 1편 정도의 빠른 속도로 읽으며 리딩이 많다. 어렵지만 보람 있고, 강의는 대체로 흥미롭고 튜토리얼 토론이 훌륭하다는 평."
      vi: "Đọc nhiều văn bản và thể loại với nhịp nhanh, khoảng một tác phẩm mỗi tuần, đọc rất nhiều. Người học thấy thử thách nhưng đáng, bài giảng phần lớn hấp dẫn, thảo luận tutorial rất hay."
      ms: "Pelbagai teks dan genre pada rentak pantas, kira-kira satu teks seminggu, dengan banyak bacaan. Pengulas rasa mencabar tetapi berbaloi, kuliah kebanyakannya menarik dan perbincangan tutorial hebat."
      id: "Beragam teks dan genre dengan tempo cepat, sekitar satu teks per minggu, dengan banyak bacaan. Pengulas merasa menantang tapi bermanfaat, kuliah sebagian besar menarik dan diskusi tutorial bagus."
      hi: "तेज़ रफ़्तार में कई तरह के ग्रंथ और विधाएँ, लगभग हर हफ़्ते एक, ढेर सारी पढ़ाई। रिव्यूअर्स को चुनौतीपूर्ण पर फ़ायदेमंद लगा, ज़्यादातर दिलचस्प लेक्चर और बढ़िया ट्यूटोरियल चर्चाएँ।"
  work:
    - en: "Essays are a big step up from VCE, but lectures and tutorials teach uni essay writing. One reviewer found the assessments a bit vague at times."
      zh: "论文比 VCE 难一大截，不过讲课和 tutorial 会教大学论文写法。有同学觉得考核要求有时有点模糊。"
      zh-TW: "論文比 VCE 難一大截，不過講課和 tutorial 會教大學論文寫法。有同學覺得考核要求有時有點模糊。"
      ja: "エッセイはVCEより大きくレベルアップするが、講義とチュートリアルで大学のエッセイの書き方を教わる。課題が時々あいまいだという人も。"
      ko: "에세이는 VCE보다 한참 어렵지만 강의와 튜토리얼에서 대학 에세이 쓰는 법을 가르친다. 평가가 가끔 모호했다는 사람도 있다."
      vi: "Bài luận khó hơn hẳn VCE, nhưng bài giảng và tutorial có dạy cách viết luận đại học. Một người thấy yêu cầu đôi khi hơi mơ hồ."
      ms: "Esei jauh lebih sukar daripada VCE, tetapi kuliah dan tutorial mengajar penulisan esei universiti. Seorang rasa penilaian kadang agak kabur."
      id: "Esai jauh lebih sulit dari VCE, tapi kuliah dan tutorial mengajarkan cara menulis esai universitas. Satu merasa penilaian kadang agak samar."
      hi: "निबंध VCE से बड़ी छलांग हैं, पर लेक्चर और ट्यूटोरियल विश्वविद्यालय निबंध लिखना सिखाते हैं। एक को आकलन कभी-कभी थोड़े अस्पष्ट लगे।"
  watch:
    - en: "The 2026 reviewer says it's now called Literary Canons: Then and Now, and found it overwhelming at first coming from mainstream English rather than VCE Literature. Speak up in tutorials."
      zh: "2026 年的同学说这门课现在叫 Literary Canons: Then and Now；这位同学高中读的是普通 English 而不是 VCE Literature，一开始觉得压力很大。tutorial 要多发言。"
      zh-TW: "2026 年的同學說這門課現在叫 Literary Canons: Then and Now；高中修的是一般 English 而不是 VCE Literature，一開始覺得壓力很大。tutorial 要多發言。"
      ja: "2026年のレビューによると現在の名称はLiterary Canons: Then and Now。VCE LiteratureでなくEnglishだった人には最初きつかったという。チュートリアルでは発言すること。"
      ko: "2026년 리뷰에 따르면 지금 이름은 Literary Canons: Then and Now이며, VCE Literature 대신 일반 English를 했던 사람에게 처음엔 벅찼다고 한다. 튜토리얼에서 적극 발언할 것."
      vi: "Người năm 2026 nói môn giờ tên Literary Canons: Then and Now, và lúc đầu thấy choáng vì chỉ học English thường chứ không phải VCE Literature. Hãy phát biểu trong tutorial."
      ms: "Pengulas 2026 kata ia kini dipanggil Literary Canons: Then and Now, dan rasa terbeban pada mulanya kerana datang dari English biasa, bukan VCE Literature. Bercakap dalam tutorial."
      id: "Pengulas 2026 bilang namanya kini Literary Canons: Then and Now, dan awalnya kewalahan karena berasal dari English biasa, bukan VCE Literature. Aktiflah bicara di tutorial."
      hi: "2026 का रिव्यूअर बताता है अब इसका नाम Literary Canons: Then and Now है, और VCE Literature के बजाय सामान्य English से आने पर शुरू में भारी लगा। ट्यूटोरियल में बोलें।"
