points:
  - en: "The philosophy capstone surveys a very broad range of thinkers with no single thread, so there is something for everyone, but it can feel disconnected at first."
    zh: "这门哲学毕业总结课覆盖非常多的思想家，没有单一主线，人人都能找到感兴趣的内容，但一开始可能觉得零散。"
    zh-TW: "這門哲學畢業總結課涵蓋非常多的思想家，沒有單一主線，人人都能找到感興趣的內容，但一開始可能覺得零散。"
    ja: "哲学のキャップストーンで、一本の筋はなく非常に幅広い思想家を扱う。誰でも興味を持てる部分があるが、最初はばらばらに感じるかも。"
    ko: "철학 캡스톤으로, 하나의 줄기 없이 매우 다양한 사상가를 다룸. 누구나 관심 가질 부분이 있지만 처음엔 산만하게 느껴질 수 있음."
    vi: "Môn capstone triết học điểm qua rất nhiều nhà tư tưởng mà không có mạch chung, nên ai cũng tìm được thứ mình thích, nhưng lúc đầu có thể thấy rời rạc."
    ms: "Capstone falsafah ini meninjau pelbagai pemikir tanpa satu benang merah, jadi ada sesuatu untuk semua orang, tetapi boleh terasa tidak bersambung pada mulanya."
    id: "Capstone filsafat ini menelusuri sangat banyak pemikir tanpa satu benang merah, jadi ada sesuatu untuk semua orang, tapi awalnya bisa terasa tidak nyambung."
    hi: "फ़िलॉसफ़ी का कैपस्टोन बिना किसी एक धागे के बहुत सारे विचारकों को देखता है, इसलिए सबके लिए कुछ है, पर शुरू में बिखरा लग सकता है।"
  - en: "Seminars were called engaging in 2020; in 2025 a reviewer found it middling, with recordings stopped after week 3 and extensions hard to get."
    zh: "2020年的研讨课被认为很吸引人；2025年有评论者觉得一般，第3周后不再提供录像，延期也很难申请。"
    zh-TW: "2020年的研討課被認為很吸引人；2025年有評論者覺得普通，第3週後不再提供錄影，延期也很難申請。"
    ja: "2020年はセミナーが面白いと評判だったが、2025年のレビューでは平凡で、第3週以降は録画がなく、提出延長も取りにくかったとのこと。"
    ko: "2020년엔 세미나가 흥미롭다는 평이었지만, 2025년 리뷰어는 그저 그렇고, 3주차 이후 녹화가 없으며 연장 받기도 어려웠다고 함."
    vi: "Năm 2020 seminar được khen cuốn hút; năm 2025 một người thấy bình thường, sau tuần 3 không còn ghi hình và khó xin gia hạn."
    ms: "Seminar dikatakan menarik pada 2020; pada 2025 seorang pengulas dapati ia sederhana, dengan rakaman dihentikan selepas minggu 3 dan lanjutan sukar diperoleh."
    id: "Seminarnya disebut menarik di 2020; di 2025 seorang pengulas merasa biasa saja, rekaman berhenti setelah minggu 3, dan perpanjangan tenggat sulit didapat."
    hi: "2020 में सेमिनार दिलचस्प बताए गए; 2025 में एक रिव्यूअर को यह औसत लगा, हफ़्ता 3 के बाद रिकॉर्डिंग बंद हो गई और एक्सटेंशन मिलना मुश्किल था।"
