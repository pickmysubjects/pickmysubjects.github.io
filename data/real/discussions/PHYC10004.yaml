points:
  - en: "Reviewers found it more interesting than Physics 1, but harder and with more maths, such as integrals in electromagnetism."
    zh: "普遍认为比物理1有趣，但更难、数学更多（如电磁学中的积分）。"
    zh-TW: "普遍認為比物理1有趣，但更難、數學更多（如電磁學中的積分）。"
    ja: "物理1より面白いという声が多いですが、より難しく、電磁気学の積分など数学も増えます。"
    ko: "물리 1보다 재미있지만 더 어렵고, 전자기학의 적분 같은 수학이 더 많다고 합니다."
    vi: "Được đánh giá thú vị hơn Vật lý 1 nhưng khó hơn và nhiều toán hơn, ví dụ tích phân trong điện từ học."
    ms: "Pengulas dapati ia lebih menarik daripada Fizik 1, tetapi lebih sukar dan lebih banyak matematik, seperti kamiran dalam elektromagnetisme."
    id: "Pengulas menilai lebih menarik dari Fisika 1, tapi lebih sulit dan lebih banyak matematika, seperti integral di elektromagnetisme."
    hi: "रिव्यूअर्स को यह Physics 1 से ज़्यादा दिलचस्प लगा, पर कठिन और ज़्यादा मैथ्स वाला, जैसे इलेक्ट्रोमैग्नेटिज़्म में इंटीग्रल।"
  - en: "Read the textbook or lecture notes before each lecture. Several said the lectures are hard to follow otherwise."
    zh: "建议课前预习教材或讲义，多位评价说不预习很难跟上讲座。"
    zh-TW: "建議課前預習教材或講義，多位評價說不預習很難跟上講座。"
    ja: "毎回の講義前に教科書か講義ノートを読みましょう。そうしないと講義についていくのが難しいという声が複数あります。"
    ko: "강의 전에 교과서나 강의 노트를 읽으세요. 그렇지 않으면 강의를 따라가기 어렵다는 후기가 여럿입니다."
    vi: "Đọc giáo trình hoặc ghi chú bài giảng trước mỗi buổi. Nhiều người nói không đọc trước thì khó theo kịp."
    ms: "Baca buku teks atau nota kuliah sebelum setiap kuliah. Beberapa kata kuliah sukar diikuti jika tidak."
    id: "Baca buku teks atau catatan kuliah sebelum tiap kuliah. Beberapa orang bilang kuliahnya sulit diikuti kalau tidak."
    hi: "हर लेक्चर से पहले टेक्स्टबुक या लेक्चर नोट्स पढ़ें। कई लोगों ने कहा कि वरना लेक्चर समझना मुश्किल है।"
  - en: "The exam can be hard and tests real understanding, including the lecture demonstrations. Keep up every week and do past exams."
    zh: "考试可能较难，考察真正的理解，包括课堂演示实验。要每周跟上进度并做往年试卷。"
    zh-TW: "考試可能較難，考察真正的理解，包括課堂示範實驗。要每週跟上進度並做歷屆試卷。"
    ja: "試験は難しいことがあり、講義での実演も含めて本当の理解が問われます。毎週ついていき、過去問を解きましょう。"
    ko: "시험은 어려울 수 있고 강의 시연을 포함해 진짜 이해를 묻습니다. 매주 진도를 따라가고 기출을 푸세요."
    vi: "Bài thi có thể khó và kiểm tra hiểu thật sự, kể cả các thí nghiệm minh họa trên lớp. Theo kịp mỗi tuần và làm đề cũ."
    ms: "Peperiksaan boleh sukar dan menguji kefahaman sebenar, termasuk demonstrasi kuliah. Ikuti setiap minggu dan buat kertas lepas."
    id: "Ujian bisa sulit dan menguji pemahaman sungguhan, termasuk demonstrasi di kuliah. Ikuti tiap minggu dan kerjakan soal lama."
    hi: "एग्ज़ाम कठिन हो सकता है और असली समझ जाँचता है, लेक्चर डेमोंस्ट्रेशन समेत। हर हफ्ते साथ चलें और पुराने पेपर्स करें।"
sections:
  content:
    - en: "Covers topics like electromagnetism, fluids and modern physics, with more maths than Physics 1. Several found it more interesting than Physics 1 but harder."
      zh: "内容包括电磁学、流体和近代物理等，数学比 Physics 1 多。好几位同学觉得比 Physics 1 有意思，但也更难。"
      zh-TW: "內容包括電磁學、流體和近代物理等，數學比 Physics 1 多。好幾位同學覺得比 Physics 1 有趣，但也更難。"
      ja: "電磁気、流体、現代物理などを扱い、Physics 1より数学が多い。Physics 1より面白いが難しいという声が複数。"
      ko: "전자기, 유체, 현대물리 등을 다루며 Physics 1보다 수학이 많다. Physics 1보다 흥미롭지만 더 어렵다는 평이 여럿."
      vi: "Gồm điện từ học, chất lỏng và vật lý hiện đại, nhiều toán hơn Physics 1. Vài người thấy thú vị hơn Physics 1 nhưng khó hơn."
      ms: "Merangkumi topik seperti elektromagnetisme, bendalir dan fizik moden, dengan lebih banyak matematik daripada Physics 1. Beberapa rasa lebih menarik daripada Physics 1 tetapi lebih sukar."
      id: "Mencakup topik seperti elektromagnetisme, fluida dan fisika modern, dengan lebih banyak matematika dari Physics 1. Beberapa merasa lebih menarik dari Physics 1 tapi lebih sulit."
      hi: "विद्युत-चुंबकत्व, तरल और आधुनिक भौतिकी जैसे विषय, Physics 1 से ज़्यादा गणित के साथ। कई को यह Physics 1 से ज़्यादा रोचक पर कठिन लगा।"
  work:
    - en: "Weekly homework questions largely adapted from the textbook, labs with basic pracs and old equipment, and a hard exam that can ask you to explain lecture demonstrations."
      zh: "每周作业题大多改编自课本，实验比较基础、设备也旧，期末很难，可能会让你解释课上的演示实验。"
      zh-TW: "每週作業題大多改編自課本，實驗比較基礎、設備也舊，期末很難，可能會要你解釋課堂上的演示實驗。"
      ja: "毎週の宿題は主に教科書の問題を改変したもの、実験は基礎的で機材は古い。期末は難しく、講義での実演の説明を求められることも。"
      ko: "주간 과제는 주로 교재 문제를 변형한 것이고, 실험은 기초적이며 장비가 낡았다. 기말은 어렵고 강의 시연을 설명하라는 문제가 나올 수 있다."
      vi: "Bài tập hằng tuần phần lớn lấy từ sách giáo trình, thí nghiệm cơ bản với thiết bị cũ, và bài thi khó có thể bắt giải thích các thí nghiệm minh họa trên lớp."
      ms: "Soalan kerja rumah mingguan kebanyakannya diadaptasi daripada buku teks, makmal dengan amali asas dan peralatan lama, serta peperiksaan sukar yang boleh minta anda terangkan demonstrasi kuliah."
      id: "Soal PR mingguan sebagian besar diadaptasi dari buku teks, praktikum dasar dengan alat lama, dan ujian sulit yang bisa meminta menjelaskan demonstrasi di kuliah."
      hi: "हर हफ़्ते के होमवर्क सवाल ज़्यादातर किताब से लिए गए, बुनियादी प्रैक और पुराने उपकरणों वाली लैब, और कठिन परीक्षा जिसमें लेक्चर के डेमो समझाने को कहा जा सकता है।"
  study:
    - en: "Read the textbook or lecture notes before each lecture, never fall behind, brush up on integrals, and do past exams."
      zh: "每节课前先读课本或讲义，千万别落下，复习积分，多做往年试卷。"
      zh-TW: "每堂課前先讀課本或講義，千萬別落後，複習積分，多寫考古題。"
      ja: "講義前に教科書や講義ノートを読み、絶対に遅れず、積分を復習し、過去問を解く。"
      ko: "강의 전에 교재나 강의 노트를 읽고, 절대 뒤처지지 말며, 적분을 복습하고 기출을 풀어라."
      vi: "Đọc sách hoặc bài giảng trước mỗi buổi, đừng bao giờ để tụt lại, ôn tích phân và làm đề cũ."
      ms: "Baca buku teks atau nota kuliah sebelum setiap kuliah, jangan ketinggalan, ulang kaji kamiran, dan buat kertas lepas."
      id: "Baca buku teks atau catatan kuliah sebelum tiap kuliah, jangan pernah tertinggal, ulangi integral, dan kerjakan soal ujian lama."
      hi: "हर लेक्चर से पहले किताब या लेक्चर नोट्स पढ़ें, कभी पीछे न रहें, इंटीग्रल दोहराएँ, और पुराने पेपर करें।"
  watch:
    - en: "One 2024 reviewer found tutorial questions overly complicated and some lectures unclear or off topic."
      zh: "2024 年有同学觉得 tutorial 题目过于复杂，部分讲课不够清楚或跑题。"
      zh-TW: "2024 年有同學覺得 tutorial 題目過於複雜，部分上課不夠清楚或離題。"
      ja: "2024年のレビューでは、チュートリアルの問題が複雑すぎ、一部の講義が分かりにくく脱線もあったという声。"
      ko: "2024년 한 리뷰어는 튜토리얼 문제가 지나치게 복잡하고 일부 강의가 불명확하거나 주제를 벗어났다고 했다."
      vi: "Một người năm 2024 thấy câu hỏi tutorial quá phức tạp và vài bài giảng chưa rõ hoặc lạc đề."
      ms: "Seorang pengulas 2024 dapati soalan tutorial terlalu rumit dan sesetengah kuliah kurang jelas atau menyimpang."
      id: "Satu pengulas 2024 merasa soal tutorial terlalu rumit dan sebagian kuliah kurang jelas atau melenceng."
      hi: "2024 के एक रिव्यूअर को ट्यूटोरियल के सवाल ज़रूरत से ज़्यादा जटिल और कुछ लेक्चर अस्पष्ट या विषय से हटे लगे।"
difficulty: hard
