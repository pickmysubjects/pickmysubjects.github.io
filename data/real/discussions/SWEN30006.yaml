code: SWEN30006
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/swen30006
reviews: 5
from: 2018
to: 2023
checked: 2026-10-08
points:
  - en: "Reviewers found the content thin and outdated, mainly a set of design patterns you can easily find online."
    zh: "评价认为内容单薄过时，主要是一些网上就能查到的设计模式。"
    zh-TW: "評價認為內容單薄過時，主要是一些網路上就能查到的設計模式。"
    ja: "内容が薄く古いとされ、主にネットで簡単に見つかるデザインパターンの寄せ集めです。"
    ko: "내용이 빈약하고 낡았다는 평이며, 주로 온라인에서 쉽게 찾을 수 있는 디자인 패턴 모음입니다."
    vi: "Nội dung bị cho là mỏng và lỗi thời, chủ yếu là các design pattern dễ tìm trên mạng."
    ms: "Pengulas dapati kandungan nipis dan lapuk, kebanyakannya set corak reka bentuk yang mudah dicari dalam talian."
    id: "Pengulas menilai materinya tipis dan usang, kebanyakan kumpulan design pattern yang mudah dicari online."
    hi: "रिव्यूअर्स को कंटेंट हल्का और पुराना लगा, जो मुख्य रूप से ऑनलाइन आसानी से मिलने वाले डिज़ाइन पैटर्न्स का सेट है।"
  - en: "Many said coordination was poor, with vague project specs and inconsistent answers from staff."
    zh: "很多人认为课程协调差，项目要求模糊，教师回答不一致。"
    zh-TW: "很多人認為課程協調差，專題要求模糊，教師回答不一致。"
    ja: "運営が悪く、プロジェクトの仕様があいまいで、教員の回答も一貫しないという声が多いです。"
    ko: "운영이 부실하고 프로젝트 명세가 모호하며 교수진 답변이 일관되지 않다는 의견이 많습니다."
    vi: "Nhiều người nói môn điều phối kém, đề bài dự án mơ hồ và giảng viên trả lời không nhất quán."
    ms: "Ramai kata penyelarasan lemah, spesifikasi projek kabur dan jawapan staf tidak konsisten."
    id: "Banyak yang bilang koordinasinya buruk, spesifikasi proyek kabur, dan jawaban pengajar tidak konsisten."
    hi: "कई लोगों ने कहा कि कोऑर्डिनेशन खराब था, प्रोजेक्ट स्पेक्स अस्पष्ट थे और स्टाफ के जवाब असंगत थे।"
  - en: "Tutorials mostly mean working silently in groups with little tutor input. Group projects depend on your teammates."
    zh: "辅导课多是小组默默做题，导师参与少；小组项目取决于队友。"
    zh-TW: "輔導課多是小組默默做題，助教參與少；小組專題取決於隊友。"
    ja: "チュートリアルはほとんどグループで黙々と作業するだけで、チューターの関与は少ないです。グループ課題はメンバー次第です。"
    ko: "튜토리얼은 대부분 튜터 개입 없이 조별로 조용히 작업하는 시간입니다. 조별 프로젝트는 팀원에 달려 있습니다."
    vi: "Tutorial chủ yếu là làm việc nhóm im lặng, ít sự tham gia của tutor. Dự án nhóm phụ thuộc vào đồng đội."
    ms: "Tutorial kebanyakannya bekerja senyap dalam kumpulan dengan sedikit input tutor. Projek kumpulan bergantung pada rakan sepasukan."
    id: "Tutorial kebanyakan kerja diam-diam dalam kelompok dengan sedikit masukan tutor. Proyek kelompok tergantung rekan tim."
    hi: "ट्यूटोरियल्स में ज़्यादातर ग्रुप में चुपचाप काम होता है, ट्यूटर का योगदान कम है। ग्रुप प्रोजेक्ट्स टीममेट्स पर निर्भर हैं।"
sections:
  content:
    - en: "Software design centred on GRASP and Gang of Four patterns. Every reviewer rated it poorly: easy, thin and outdated content, with slides that sometimes contradict each other."
      zh: "讲软件设计，核心是 GRASP 和 GoF 设计模式。所有同学评价都差：简单、内容单薄又过时，课件有时前后矛盾。"
      zh-TW: "講軟體設計，核心是 GRASP 和 GoF 設計模式。所有同學評價都差：簡單、內容單薄又過時，投影片有時前後矛盾。"
      ja: "GRASPとGoFパターンを中心としたソフトウェア設計。全員が低評価で、簡単で中身が薄く古く、スライドに矛盾もあるという。"
      ko: "GRASP와 GoF 패턴 중심의 소프트웨어 설계. 모든 리뷰가 혹평한다. 쉽고 빈약하며 낡은 내용에, 슬라이드끼리 모순되기도 한다고."
      vi: "Thiết kế phần mềm xoay quanh mẫu GRASP và Gang of Four. Ai cũng chê: dễ, mỏng và lỗi thời, slide đôi khi mâu thuẫn nhau."
      ms: "Reka bentuk perisian berpusat pada corak GRASP dan Gang of Four. Semua pengulas nilai rendah: mudah, nipis dan lapuk, dengan slaid kadang bercanggah."
      id: "Desain perangkat lunak berpusat pada pola GRASP dan Gang of Four. Semua pengulas menilai buruk: mudah, tipis dan usang, slide kadang saling bertentangan."
      hi: "GRASP और Gang of Four पैटर्न पर केंद्रित सॉफ़्टवेयर डिज़ाइन। हर रिव्यूअर ने इसे ख़राब बताया: आसान, पतली और पुरानी सामग्री, स्लाइड्स कभी-कभी एक-दूसरे के उलट।"
  work:
    - en: "Group projects applying a few patterns in code and diagrams. Easy marks, but a good group matters, and in 2023 the specs were vague and tutors gave conflicting answers."
      zh: "小组项目，把几个设计模式用在代码和图上。分数好拿，但组员很关键；2023 年作业说明模糊，tutor 的说法也互相矛盾。"
      zh-TW: "小組專題，把幾個設計模式用在程式和圖上。分數好拿，但組員很關鍵；2023 年作業說明模糊，tutor 的說法也互相矛盾。"
      ja: "いくつかのパターンをコードと図に適用するグループ課題。点は取りやすいが、良いグループが大事。2023年は仕様があいまいでチューターの回答も食い違った。"
      ko: "몇 가지 패턴을 코드와 다이어그램에 적용하는 조별 프로젝트. 점수는 쉽지만 좋은 조가 중요하고, 2023년엔 명세가 모호하고 튜터 답변이 엇갈렸다."
      vi: "Dự án nhóm áp dụng vài mẫu vào code và sơ đồ. Dễ điểm, nhưng nhóm tốt rất quan trọng; năm 2023 đề mơ hồ và tutor trả lời trái ngược."
      ms: "Projek kumpulan mengaplikasi beberapa corak dalam kod dan rajah. Markah mudah, tetapi kumpulan yang baik penting; pada 2023 spesifikasi kabur dan tutor beri jawapan bercanggah."
      id: "Proyek kelompok menerapkan beberapa pola dalam kode dan diagram. Nilai mudah, tapi kelompok yang baik penting; pada 2023 spesifikasi samar dan tutor memberi jawaban bertentangan."
      hi: "ग्रुप प्रोजेक्ट जिनमें कुछ पैटर्न कोड और डायग्राम में लगाने हैं। अंक आसान, पर अच्छा ग्रुप ज़रूरी; 2023 में स्पेसिफ़िकेशन अस्पष्ट थे और ट्यूटर्स के जवाब अलग-अलग।"
  watch:
    - en: "Several found the two-hour tutorials unhelpful, mostly working through sheets in silence, though there's a participation mark. One 2023 reviewer says forum questions went unanswered before the exam."
      zh: "好几位觉得两小时的 tutorial 没什么用，基本是默默做练习，但有出勤分。一位 2023 年的同学说考前论坛问题几乎没人回。"
      zh-TW: "好幾位覺得兩小時的 tutorial 沒什麼用，基本上是默默做練習，但有出席分。一位 2023 年的同學說考前論壇問題幾乎沒人回。"
      ja: "2時間のチュートリアルはほぼ黙々とシートを解くだけで役に立たないという声が複数だが、参加点がある。2023年の一人は試験前に掲示板の質問が放置されたと言う。"
      ko: "2시간 튜토리얼은 거의 말없이 시트만 풀어 도움이 안 됐다는 평이 여럿이지만 참여 점수가 있다. 2023년 한 리뷰는 시험 전 포럼 질문에 답이 없었다고 한다."
      vi: "Nhiều người thấy tutorial hai tiếng vô ích, chủ yếu im lặng làm bài, nhưng có điểm chuyên cần. Một người năm 2023 nói trước kỳ thi câu hỏi trên diễn đàn không được trả lời."
      ms: "Beberapa rasa tutorial dua jam tidak membantu, kebanyakannya buat lembaran secara senyap, tetapi ada markah penyertaan. Seorang pengulas 2023 kata soalan forum tidak dijawab sebelum peperiksaan."
      id: "Beberapa merasa tutorial dua jam tidak membantu, kebanyakan mengerjakan lembar kerja dalam diam, tapi ada nilai partisipasi. Satu pengulas 2023 bilang pertanyaan forum tak dijawab sebelum ujian."
      hi: "कई को दो घंटे के ट्यूटोरियल बेकार लगे, ज़्यादातर चुपचाप शीट हल करना, पर भागीदारी के अंक हैं। 2023 का एक रिव्यूअर कहता है परीक्षा से पहले फ़ोरम के सवालों के जवाब नहीं मिले।"
