points:
  - en: "Builds closely on VCE Specialist Maths; reviewers find it mostly computational and well organised, with useful practice sheets."
    zh: "内容和 VCE Specialist 数学衔接紧密；大家觉得以计算为主、组织得好，练习题很有用。"
    zh-TW: "內容和 VCE Specialist 數學銜接緊密；大家覺得以計算為主、組織得好，練習題很有用。"
    ja: "VCE Specialist Mathsと密接につながる内容。計算中心で運営も良く、演習シートが役立つと評価されている。"
    ko: "VCE Specialist Maths와 밀접하게 이어진다. 계산 위주에 운영이 잘 되고 연습 문제지가 유용하다는 평이다."
    vi: "Nối tiếp sát VCE Specialist Maths; người học thấy chủ yếu là tính toán, tổ chức tốt, bài luyện tập hữu ích."
    ms: "Berkait rapat dengan VCE Specialist Maths; pengulas dapati ia kebanyakan pengiraan, teratur, dengan lembaran latihan berguna."
    id: "Melanjutkan langsung VCE Specialist Maths; dinilai lebih banyak hitungan, tertata baik, dan lembar latihannya berguna."
    hi: "VCE Specialist Maths पर सीधे आधारित; रिव्यू के अनुसार ज़्यादातर कैलकुलेशन वाला, अच्छी तरह ऑर्गनाइज़्ड, प्रैक्टिस शीट काम की।"
  - en: "It starts easy and speeds up after the first few weeks; keeping up with practice problems is the most common advice."
    zh: "前几周简单，之后节奏变快；最常见的建议是跟上进度、多做练习。"
    zh-TW: "前幾週簡單，之後節奏變快；最常見的建議是跟上進度、多做練習。"
    ja: "最初は易しいが数週間後にペースが上がる。演習問題についていくのが一番多いアドバイス。"
    ko: "처음엔 쉽지만 몇 주 후 속도가 빨라진다. 연습 문제를 밀리지 않는 것이 가장 흔한 조언이다."
    vi: "Ban đầu dễ, sau vài tuần thì nhanh hơn; lời khuyên phổ biến nhất là theo kịp bài tập."
    ms: "Mula mudah dan semakin laju selepas beberapa minggu; nasihat paling biasa ialah ikuti soalan latihan."
    id: "Awalnya mudah lalu makin cepat setelah beberapa minggu; saran paling umum: jangan tertinggal soal latihan."
    hi: "शुरू में आसान, कुछ हफ्तों बाद रफ़्तार बढ़ती है; सबसे आम सलाह: प्रैक्टिस प्रॉब्लम्स के साथ बने रहें।"
  - en: "The summer version is intense (a week of content per day); take it alone if you choose summer."
    zh: "暑期版很紧凑（一天学一周的内容）；如果选暑期，最好只修这一门。"
    zh-TW: "暑期版很緊湊（一天上一週的內容）；如果選暑期，最好只修這一門。"
    ja: "サマー版は過密（1日で1週間分）。サマーで取るならこの科目だけにしよう。"
    ko: "여름 학기 버전은 빡빡하다(하루에 일주일 분량). 여름에 듣는다면 이 과목만 듣자."
    vi: "Bản học kỳ hè rất dày (một ngày học nội dung một tuần); nếu học hè thì chỉ nên học môn này."
    ms: "Versi musim panas sangat padat (kandungan seminggu sehari); ambil subjek ini sahaja jika pilih musim panas."
    id: "Versi musim panas sangat padat (materi seminggu per hari); kalau ambil saat musim panas, ambil ini saja."
    hi: "समर वर्ज़न बहुत इंटेंस है (एक दिन में हफ्ते भर का कंटेंट); समर में लें तो सिर्फ़ यही लें।"
  - en: "No calculator is allowed; check whether a summary sheet is permitted in the exam."
    zh: "不允许用计算器；记得确认考试能否带一页笔记。"
    zh-TW: "不能用計算機；記得確認考試能否帶一頁筆記。"
    ja: "電卓は使用不可。試験にまとめシートを持ち込めるか確認しよう。"
    ko: "계산기는 사용할 수 없다. 시험에 요약지를 가져갈 수 있는지 확인하자."
    vi: "Không được dùng máy tính; hãy kiểm tra xem có được mang tờ tóm tắt vào phòng thi không."
    ms: "Kalkulator tidak dibenarkan; semak sama ada helaian ringkasan dibenarkan dalam peperiksaan."
    id: "Kalkulator tidak boleh dipakai; cek apakah lembar ringkasan diizinkan saat ujian."
    hi: "कैलकुलेटर की अनुमति नहीं; चेक करें कि एग्ज़ाम में समरी शीट ले जा सकते हैं या नहीं।"
difficulty: mixed
