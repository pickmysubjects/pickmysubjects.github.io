  - en: "Many reviewers (especially 2023-2026) found the content dull or common sense and not representative of linguistics; several recommend LING10001 instead."
    zh: "很多评论者（尤其2023-2026）觉得内容枯燥或都是常识，不能代表语言学；好几人建议改修LING10001。"
    zh-TW: "很多評論者（尤其2023-2026）覺得內容枯燥或都是常識，不能代表語言學；好幾個人建議改修LING10001。"
    ja: "多くのレビュー（特に2023-2026）は内容が退屈か常識的で言語学らしくないとし、代わりにLING10001を勧める人も複数。"
    ko: "많은 리뷰(특히 2023-2026)는 내용이 지루하거나 상식 수준이며 언어학을 대표하지 않는다고 하고, 여럿이 LING10001을 대신 권함."
    vi: "Nhiều người (đặc biệt 2023-2026) thấy nội dung nhàm hoặc chỉ là hiểu biết thông thường, không tiêu biểu cho ngôn ngữ học; nhiều người khuyên học LING10001 thay thế."
    ms: "Ramai pengulas (terutama 2023-2026) dapati kandungan membosankan atau sekadar akal biasa dan tidak mewakili linguistik; beberapa orang syorkan LING10001 sebagai ganti."
    id: "Banyak pengulas (terutama 2023-2026) merasa materinya membosankan atau sekadar akal sehat dan tidak mewakili linguistik; beberapa menyarankan LING10001 sebagai gantinya."
    hi: "कई रिव्यूअर्स (ख़ासकर 2023-2026) को कंटेंट उबाऊ या सामान्य समझ जैसा लगा और भाषाविज्ञान का प्रतिनिधि नहीं; कई ने इसकी जगह LING10001 सुझाया।"
  - en: "Two assignments and no exam, involving collecting real language data. It is easy to pass, but assignment instructions were often called vague."
    zh: "两份作业、无考试，需要收集真实语言数据。容易通过，但作业说明常被认为模糊。"
    zh-TW: "兩份作業、無考試，需要蒐集真實語言資料。容易通過，但作業說明常被認為模糊。"
    ja: "課題2つで試験なし。実際の言語データを集める内容。合格は易しいが、課題の指示が曖昧だという声が多い。"
    ko: "과제 2개, 시험 없음. 실제 언어 데이터를 수집함. 통과는 쉽지만 과제 안내가 모호하다는 평이 많음."
    vi: "Hai bài tập, không thi, có thu thập dữ liệu ngôn ngữ thực tế. Dễ qua môn, nhưng hướng dẫn bài tập thường bị chê mơ hồ."
    ms: "Dua tugasan tanpa peperiksaan, melibatkan pengumpulan data bahasa sebenar. Mudah lulus, tetapi arahan tugasan sering dikatakan kabur."
    id: "Dua tugas tanpa ujian, dengan mengumpulkan data bahasa nyata. Mudah lulus, tapi instruksi tugas sering disebut kabur."
    hi: "दो असाइनमेंट, कोई एग्ज़ाम नहीं, जिनमें असली भाषा डेटा इकट्ठा करना होता है। पास होना आसान है, पर असाइनमेंट निर्देश अक्सर अस्पष्ट बताए गए।"
workload: light
