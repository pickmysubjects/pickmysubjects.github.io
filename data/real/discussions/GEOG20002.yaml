  - en: "Reviewers found it an enjoyable subject where a good mark is easy to get."
    zh: "评价者认为这门课很有意思，拿高分比较容易。"
    zh-TW: "評論者覺得這門課很有趣，拿好成績也很容易。"
    ja: "楽しい科目で、良い成績も取りやすいという評価。"
    ko: "즐거운 과목이고 좋은 점수를 받기도 쉽다는 평."
    vi: "Mọi người thấy đây là môn thú vị và dễ đạt điểm tốt."
    ms: "Pengulas rasa subjek ini menyeronokkan dan mudah dapat markah baik."
    id: "Pengulas merasa mata kuliah ini menyenangkan dan mudah dapat nilai bagus."
    hi: "रिव्यूअर को यह मज़ेदार सब्जेक्ट लगा जिसमें अच्छे मार्क्स लाना आसान है।"
  - en: "The field trip is a highlight. Practicals can be dry, but the instructions are clear and easy to follow."
    zh: "野外考察是一大亮点；实验课有些枯燥，但说明清楚，容易跟上。"
    zh-TW: "野外考察是一大亮點。實驗課有點枯燥，但說明清楚、容易跟上。"
    ja: "フィールドトリップが目玉。実習は単調なこともあるが、指示は明確で分かりやすい。"
    ko: "현장 답사가 하이라이트. 실습은 지루할 수 있지만 안내가 명확하고 따라가기 쉬움."
    vi: "Chuyến thực địa là điểm nhấn. Buổi thực hành có thể khô khan, nhưng hướng dẫn rõ ràng, dễ làm theo."
    ms: "Lawatan lapangan ialah kemuncak. Amali boleh membosankan, tetapi arahannya jelas dan mudah diikuti."
    id: "Kunjungan lapangan jadi sorotan. Praktikum bisa membosankan, tapi instruksinya jelas dan mudah diikuti."
    hi: "फ़ील्ड ट्रिप सबसे ख़ास है। प्रैक्टिकल थोड़े नीरस हो सकते हैं, पर निर्देश साफ़ और आसान हैं।"
  - en: "Recommended if you are interested in earth science, even though some find the lecture content a little dull."
    zh: "对地球科学感兴趣的同学值得选，不过有人觉得讲课内容略显平淡。"
    zh-TW: "對地球科學有興趣的話值得修，不過有人覺得講課內容有點平淡。"
    ja: "地球科学に興味があればおすすめ。ただし講義内容が少し退屈だという人もいる。"
    ko: "지구과학에 관심 있다면 추천하지만, 일부는 강의 내용이 조금 지루하다고 함."
    vi: "Nên học nếu bạn thích khoa học trái đất, dù một số người thấy bài giảng hơi nhạt."
    ms: "Disyorkan jika anda berminat dengan sains bumi, walaupun ada yang rasa kandungan kuliah agak hambar."
    id: "Direkomendasikan jika kamu tertarik ilmu kebumian, meski sebagian merasa materi kuliahnya agak datar."
    hi: "अगर अर्थ साइंस में रुचि है तो सिफ़ारिश की जाती है, हालाँकि कुछ को लेक्चर कंटेंट थोड़ा फीका लगता है।"
difficulty: easy
