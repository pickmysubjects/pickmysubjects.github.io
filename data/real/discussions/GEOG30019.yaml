points:
  - en: "About 30% comes from weekly quizzes and tutorial reflections, which most reviewers called easy marks."
    zh: "约30%的成绩来自每周测验和辅导课反思，多数人认为容易拿分。"
    zh-TW: "約30%來自每週小考和小組課心得，多數評論者認為很好拿分。"
    ja: "約30%は毎週の小テストとチュートリアルの振り返りで、ほとんどの人が点を取りやすいと評価。"
    ko: "약 30%는 주간 퀴즈와 튜토리얼 성찰문이며, 대부분 쉽게 점수를 얻을 수 있다고 함."
    vi: "Khoảng 30% đến từ quiz hằng tuần và bài suy ngẫm tutorial, đa số cho là dễ lấy điểm."
    ms: "Kira-kira 30% daripada kuiz mingguan dan refleksi tutorial, yang kebanyakan pengulas kata markah mudah."
    id: "Sekitar 30% dari kuis mingguan dan refleksi tutorial, yang menurut sebagian besar pengulas nilai gampang."
    hi: "लगभग 30% वीकली क्विज़ और ट्यूटोरियल रिफ़्लेक्शन से आता है, जिन्हें ज़्यादातर रिव्यूअर ने आसान मार्क्स बताया।"
  - en: "The two essays decide your grade. Strong, critical essay writers can get an H1, but several found the prompts vague or hard."
    zh: "两篇论文决定成绩；擅长批判性写作的人可拿H1，但不少人觉得题目模糊或难写。"
    zh-TW: "兩篇論文決定成績。擅長批判性寫作的人可以拿H1，但不少人覺得題目模糊或難寫。"
    ja: "2本のエッセイで成績が決まる。批判的に書ける人はH1も取れるが、課題文が曖昧・難しいと感じた人も多い。"
    ko: "에세이 두 편이 성적을 좌우하며, 비판적 글쓰기에 강하면 H1도 가능하지만 주제가 모호하거나 어렵다는 의견이 여럿."
    vi: "Hai bài luận quyết định điểm. Người viết luận phản biện tốt có thể đạt H1, nhưng nhiều người thấy đề mơ hồ hoặc khó."
    ms: "Dua esei menentukan gred. Penulis esei kritis yang mahir boleh dapat H1, tetapi ramai rasa soalan kabur atau sukar."
    id: "Dua esai menentukan nilai. Penulis esai kritis yang kuat bisa dapat H1, tapi banyak yang merasa soalnya samar atau sulit."
    hi: "दो निबंध आपका ग्रेड तय करते हैं। अच्छा क्रिटिकल लिखने वाले H1 ला सकते हैं, पर कई को सवाल अस्पष्ट या कठिन लगे।"
  - en: "Content is broad and abstract, and some found it vague; tutorial discussions were generally enjoyed."
    zh: "内容宽泛抽象，有人觉得空泛；辅导课讨论普遍受欢迎。"
    zh-TW: "內容廣泛又抽象，有人覺得空泛；小組討論普遍受歡迎。"
    ja: "内容は幅広く抽象的で、曖昧だと感じた人も。チュートリアルの議論はおおむね好評。"
    ko: "내용이 넓고 추상적이라 모호하다는 사람도 있으며, 튜토리얼 토론은 대체로 호평."
    vi: "Nội dung rộng và trừu tượng, một số thấy mơ hồ; thảo luận tutorial nhìn chung được thích."
    ms: "Kandungan luas dan abstrak, ada yang rasa kabur; perbincangan tutorial umumnya digemari."
    id: "Materi luas dan abstrak, sebagian merasa samar; diskusi tutorial umumnya disukai."
    hi: "कंटेंट चौड़ा और अमूर्त है, कुछ को धुँधला लगा; ट्यूटोरियल चर्चाएँ आम तौर पर पसंद की गईं।"
  - en: "A 2026 reviewer noted the final essay required using AI tools, so check this if you object to AI."
    zh: "2026年有评价提到期末论文要求使用AI工具，若不愿用AI需留意。"
    zh-TW: "一位2026年的評論者提到期末論文要求使用AI工具，若你排斥AI要先確認。"
    ja: "2026年の口コミによると期末エッセイでAIツールの使用が必須だった。AIに抵抗があるなら確認を。"
    ko: "2026년 한 후기에 따르면 기말 에세이에서 AI 도구 사용이 필수였으니, AI가 싫다면 확인하세요."
    vi: "Một đánh giá năm 2026 cho biết bài luận cuối bắt buộc dùng công cụ AI, nên hãy kiểm tra nếu bạn phản đối AI."
    ms: "Seorang pengulas 2026 menyatakan esei akhir memerlukan penggunaan alat AI, jadi semak jika anda membantah AI."
    id: "Seorang pengulas 2026 mencatat esai akhir wajib memakai alat AI, jadi cek dulu jika kamu keberatan dengan AI."
    hi: "2026 के एक रिव्यूअर ने बताया कि फ़ाइनल निबंध में AI टूल इस्तेमाल करना ज़रूरी था, तो अगर AI से आपत्ति है तो जाँच लें।"
difficulty: mixed
