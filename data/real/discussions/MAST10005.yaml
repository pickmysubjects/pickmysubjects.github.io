points:
  - en: "Most reviewers say steady practice (tutorial sheets, worksheets, past exams) makes a good mark achievable."
    zh: "多数评价认为坚持练习（辅导题、练习册、往年试卷）就能拿到好成绩。"
    zh-TW: "多數評價認為持續練習（習題、練習卷、考古題）就能拿到好成績。"
    ja: "多くのレビューでは、演習（チュートリアル問題、ワークシート、過去問）を着実にこなせば良い成績が取れるという。"
    ko: "대부분의 후기는 튜토리얼 문제, 워크시트, 기출을 꾸준히 풀면 좋은 점수가 가능하다고 한다."
    vi: "Đa số cho rằng luyện tập đều (bài tutorial, worksheet, đề cũ) là đạt điểm tốt."
    ms: "Kebanyakan pengulas kata latihan konsisten (soalan tutorial, lembaran kerja, soalan lepas) membolehkan markah baik."
    id: "Kebanyakan ulasan bilang latihan rutin (soal tutorial, lembar kerja, soal ujian lama) membuat nilai bagus bisa dicapai."
    hi: "ज़्यादातर रिव्यू कहते हैं लगातार प्रैक्टिस (ट्यूटोरियल शीट, वर्कशीट, पुराने पेपर) से अच्छे मार्क्स मिल सकते हैं।"
  - en: "The final exam carries a heavy weight (about 60-80%) and is long and algebra-heavy, so avoid careless errors."
    zh: "期末考试占比高（约60-80%），题量大、代数运算多，要避免粗心。"
    zh-TW: "期末考占比高（約60-80%），題量大、代數運算多，要避免粗心。"
    ja: "期末試験の比重は大きく（約60-80%）、長くて代数計算が多いので、ケアレスミスに注意。"
    ko: "기말시험 비중이 크고(약 60-80%) 길며 대수 계산이 많으니 실수를 조심하자."
    vi: "Thi cuối kỳ chiếm tỷ trọng lớn (khoảng 60-80%), dài và nhiều đại số, nên tránh sai sót do bất cẩn."
    ms: "Peperiksaan akhir berwajaran tinggi (kira-kira 60-80%), panjang dan banyak algebra, jadi elakkan kesilapan cuai."
    id: "Ujian akhir berbobot besar (sekitar 60-80%), panjang dan banyak aljabar, jadi hindari kesalahan ceroboh."
    hi: "फ़ाइनल एग्ज़ाम का वेट ज़्यादा है (करीब 60-80%), लंबा और अलजेब्रा-भरा है, तो लापरवाही वाली गलतियों से बचें।"
  - en: "Opinions are split recently: some found it well taught, while others found it poorly organised with abstract tutorials."
    zh: "近期评价不一：有人认为教得好，也有人觉得组织混乱、辅导题太抽象。"
    zh-TW: "近期評價分歧：有人認為教得好，也有人覺得組織混亂、習題課太抽象。"
    ja: "最近は意見が分かれる。教え方が良いという人もいれば、運営が悪くチュートリアルが抽象的すぎるという人もいる。"
    ko: "최근 의견이 갈린다. 잘 가르친다는 쪽도 있고, 운영이 엉성하고 튜토리얼이 추상적이라는 쪽도 있다."
    vi: "Gần đây ý kiến trái chiều: có người thấy dạy tốt, người khác thấy tổ chức kém và tutorial trừu tượng."
    ms: "Pendapat terkini berbelah: ada yang rasa diajar dengan baik, ada yang rasa kurang teratur dengan tutorial abstrak."
    id: "Belakangan pendapat terbelah: ada yang menilai pengajarannya bagus, ada yang menilai kurang teratur dengan tutorial abstrak."
    hi: "हाल में राय बँटी है: कुछ को पढ़ाई अच्छी लगी, कुछ को अव्यवस्थित और ट्यूटोरियल बहुत एब्स्ट्रैक्ट लगे।"
