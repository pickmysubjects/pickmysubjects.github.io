points:
  - en: "Reviewers from 2015 to 2019 were mostly negative: a flipped-classroom setup where you learn the material at home, with lectures seen as unhelpful."
    zh: "2015到2019年的评论者大多是负面的：采用翻转课堂，内容要在家自学，讲座被认为帮助不大。"
    zh-TW: "2015到2019年的評論者大多是負面的：採用翻轉課堂，內容要在家自學，講課被認為幫助不大。"
    ja: "2015〜2019年のレビューは概ね否定的。反転授業で内容は自宅で自習し、講義はあまり役立たないとされた。"
    ko: "2015~2019년 리뷰는 대체로 부정적. 거꾸로 수업 방식이라 내용을 집에서 독학해야 하고, 강의는 별 도움이 안 된다는 평."
    vi: "Đánh giá từ 2015 đến 2019 phần lớn tiêu cực: học theo mô hình lớp học đảo ngược, tự học ở nhà, còn bài giảng bị cho là ít ích."
    ms: "Pengulas dari 2015 hingga 2019 kebanyakannya negatif: susunan kelas terbalik di mana anda belajar bahan di rumah, dengan kuliah dilihat kurang membantu."
    id: "Pengulas 2015-2019 kebanyakan negatif: model kelas terbalik di mana materi dipelajari sendiri di rumah, dan kuliahnya dianggap kurang membantu."
    hi: "2015 से 2019 तक के रिव्यू ज़्यादातर नकारात्मक थे: फ़्लिप्ड-क्लासरूम ढाँचा जिसमें सामग्री घर पर ख़ुद पढ़नी होती है, और लेक्चर कम मददगार माने गए।"
  - en: "Assessments and the exam were said to have little to do with the textbook, speaking tasks came with little preparation guidance, and you should study all the kanji."
    zh: "据说考核和考试与课本关系不大，口语任务几乎没有准备指引；汉字要全部掌握。"
    zh-TW: "據說評量和考試與課本關係不大，口說任務幾乎沒有準備指引；漢字要全部掌握。"
    ja: "評価や試験は教科書とあまり関係がなく、スピーキング課題の準備案内もほとんどなかったとのこと。漢字はすべて覚えること。"
    ko: "평가와 시험이 교재와 거의 관련 없고, 말하기 과제는 준비 안내가 거의 없었다고 함. 한자는 전부 공부할 것."
    vi: "Bài đánh giá và bài thi được cho là ít liên quan đến giáo trình, bài nói gần như không có hướng dẫn chuẩn bị, và nên học hết kanji."
    ms: "Penilaian dan peperiksaan dikatakan kurang berkait dengan buku teks, tugasan lisan datang dengan sedikit panduan persediaan, dan anda patut belajar semua kanji."
    id: "Penilaian dan ujiannya disebut kurang berkaitan dengan buku teks, tugas berbicara minim panduan persiapan, dan sebaiknya pelajari semua kanji."
    hi: "कहा गया कि आकलन और एग्ज़ाम का टेक्स्टबुक से ज़्यादा संबंध नहीं था, बोलने के कामों के लिए तैयारी का मार्गदर्शन बहुत कम था, और सारे कांजी पढ़ने चाहिए।"
