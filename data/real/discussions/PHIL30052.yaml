points:
  - en: "All three reviewers (2021-2025) enjoyed this look at socially constructed identity categories, with strong teaching and good discussion."
    zh: "三位评论者（2021-2025）都喜欢这门探讨社会建构身份类别的课，教学扎实，讨论也好。"
    zh-TW: "三位評論者（2021-2025）都喜歡這門探討社會建構身分類別的課，教學紮實，討論也好。"
    ja: "3人のレビュアー（2021-2025）全員が、社会的に構築されたアイデンティティ分類を扱うこの科目を楽しんだ。授業も議論も充実。"
    ko: "리뷰어 3명(2021-2025) 모두 사회적으로 구성된 정체성 범주를 다루는 이 과목을 즐김. 수업과 토론이 좋음."
    vi: "Cả ba người (2021-2025) đều thích môn bàn về các phạm trù bản sắc do xã hội kiến tạo, dạy tốt và thảo luận hay."
    ms: "Ketiga-tiga pengulas (2021-2025) menikmati kajian tentang kategori identiti yang dibina secara sosial ini, dengan pengajaran mantap dan perbincangan baik."
    id: "Ketiga pengulas (2021-2025) menikmati kajian tentang kategori identitas yang dikonstruksi secara sosial ini, dengan pengajaran kuat dan diskusi bagus."
    hi: "तीनों रिव्यूअर्स (2021-2025) को सामाजिक रूप से बनी पहचान श्रेणियों पर यह विषय पसंद आया, मज़बूत पढ़ाई और अच्छी चर्चा के साथ।"
  - en: "It asks for independent digging, and a background in gender studies or ethical theory helps."
    zh: "需要自己深入钻研，有性别研究或伦理学理论基础会有帮助。"
    zh-TW: "需要自己深入鑽研，有性別研究或倫理學理論基礎會有幫助。"
    ja: "自主的に掘り下げる姿勢が必要で、ジェンダー研究や倫理学理論の素養があると役立つ。"
    ko: "스스로 깊이 파고들어야 하며, 젠더 연구나 윤리 이론 배경이 있으면 도움이 됨."
    vi: "Cần tự đào sâu, và có nền tảng nghiên cứu giới hoặc lý thuyết đạo đức sẽ giúp ích."
    ms: "Ia memerlukan penerokaan sendiri, dan latar belakang kajian gender atau teori etika membantu."
    id: "Butuh menggali secara mandiri, dan latar belakang studi gender atau teori etika membantu."
    hi: "इसमें ख़ुद गहराई में उतरना पड़ता है, और जेंडर स्टडीज़ या नैतिक सिद्धांत की पृष्ठभूमि मदद करती है।"
