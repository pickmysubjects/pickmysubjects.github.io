to: 2025
checked: 2026-10-17
points:
  - en: "Most reviewers (2018-2023) enjoyed it: a film every week, analysed in tutorials, and no film background needed."
    zh: "大多数评论者（2018-2023）都喜欢：每周看一部电影，在辅导课上分析，不需要电影基础。"
    zh-TW: "大多數評論者（2018-2023）都喜歡：每週看一部電影，在輔導課上分析，不需要電影基礎。"
    ja: "多くのレビュー（2018-2023）が好評。毎週1本映画を観てチュートリアルで分析する。映画の予備知識は不要。"
    ko: "대부분 리뷰(2018-2023)가 호평. 매주 영화 한 편을 보고 튜토리얼에서 분석하며, 영화 배경지식은 필요 없음."
    vi: "Phần lớn người đánh giá (2018-2023) đều thích: mỗi tuần một bộ phim, phân tích trong tutorial, không cần nền tảng điện ảnh."
    ms: "Kebanyakan pengulas (2018-2023) menikmatinya: satu filem setiap minggu, dianalisis dalam tutorial, dan tiada latar belakang filem diperlukan."
    id: "Kebanyakan pengulas (2018-2023) menikmatinya: satu film tiap minggu, dianalisis di tutorial, dan tak perlu latar belakang film."
    hi: "ज़्यादातर रिव्यूअर्स (2018-2023) को पसंद आया: हर हफ़्ते एक फ़िल्म, ट्यूटोरियल में उसका विश्लेषण, और फ़िल्म की कोई पृष्ठभूमि ज़रूरी नहीं।"
  - en: "Assessment is mainly three essays and was called fair, though some found the theory and readings demanding; a 2025 first-year student found the long weekly contact hours and readings a hard start."
    zh: "考核主要是三篇论文，被认为公平，但有人觉得理论和阅读要求较高；一位2025年的大一新生觉得每周课时长、阅读多，起步很吃力。"
    zh-TW: "評量主要是三篇論文，被認為公平，但有人覺得理論和閱讀要求較高；一位2025年的大一新生覺得每週課時長、閱讀多，起步很吃力。"
    ja: "評価は主にエッセイ3本で妥当とされるが、理論と読み物がきついと感じた人もいる。2025年の1年生は、毎週の長い授業時間と読み物で大変なスタートだったとのこと。"
    ko: "평가는 주로 에세이 3편으로 공정하다는 평이지만, 이론과 읽기가 버겁다는 사람도 있음. 2025년 신입생은 긴 주간 수업 시간과 읽기 때문에 시작이 힘들었다고 함."
    vi: "Đánh giá chủ yếu là ba bài luận và được cho là công bằng, dù vài người thấy lý thuyết và bài đọc nặng; một tân sinh viên năm 2025 thấy số giờ học dài mỗi tuần và bài đọc khiến khởi đầu rất vất vả."
    ms: "Penilaian terutamanya tiga esei dan dikatakan adil, walaupun ada yang dapati teori dan bacaan mencabar; seorang pelajar tahun pertama 2025 dapati jam kelas mingguan yang panjang dan bacaan menjadikan permulaan sukar."
    id: "Penilaian utamanya tiga esai dan dianggap adil, meski ada yang merasa teori dan bacaannya berat; mahasiswa baru 2025 merasa jam kelas mingguan yang panjang dan bacaannya bikin awal yang berat."
    hi: "आकलन मुख्य रूप से तीन निबंध हैं और इसे उचित माना गया, हालाँकि कुछ को थ्योरी और रीडिंग्स भारी लगीं; 2025 के एक फ़र्स्ट-ईयर छात्र को हफ़्ते के लंबे क्लास घंटों और रीडिंग्स से शुरुआत कठिन लगी।"
sections:
  content:
    - en: "Each week a film screening, a lecture and a tutorial analysing the film, covering film form, sound and theories like trauma and feminism. Most enjoyed the film selection; no background is needed."
      zh: "每周一场电影放映、一节讲课和一节分析影片的 tutorial，涉及电影形式、声音以及创伤、女性主义等理论。多数人喜欢选片；不需要背景。"
      zh-TW: "每週一場電影放映、一堂課和一堂分析影片的 tutorial，涉及電影形式、聲音以及創傷、女性主義等理論。多數人喜歡選片；不需要背景。"
      ja: "毎週、映画上映、講義、映画を分析するチュートリアル。映画の形式や音、トラウマ論やフェミニズムなどの理論を扱う。作品選びが好評で、予備知識は不要。"
      ko: "매주 영화 상영, 강의, 영화를 분석하는 튜토리얼이 있고 영화 형식, 사운드, 트라우마·페미니즘 이론 등을 다룬다. 대부분 선정 영화가 좋았다고 했고 배경 지식은 필요 없다."
      vi: "Mỗi tuần một buổi chiếu phim, một bài giảng và một tutorial phân tích phim, gồm hình thức điện ảnh, âm thanh và các lý thuyết như sang chấn, nữ quyền. Đa số thích danh sách phim; không cần nền tảng."
      ms: "Setiap minggu tayangan filem, kuliah dan tutorial menganalisis filem, meliputi bentuk filem, bunyi dan teori seperti trauma dan feminisme. Kebanyakan suka pilihan filem; tiada latar diperlukan."
      id: "Tiap minggu ada pemutaran film, kuliah dan tutorial yang menganalisis film, mencakup bentuk film, suara dan teori seperti trauma dan feminisme. Kebanyakan suka pilihan filmnya; tidak perlu latar."
      hi: "हर हफ़्ते फ़िल्म स्क्रीनिंग, एक लेक्चर और फ़िल्म का विश्लेषण करने वाला ट्यूटोरियल, जिसमें फ़िल्म का रूप, ध्वनि और ट्रॉमा व नारीवाद जैसे सिद्धांत शामिल हैं। ज़्यादातर को फ़िल्मों का चयन पसंद आया; बैकग्राउंड ज़रूरी नहीं।"
  work:
    - en: "Three essays. Most reviewers up to 2023 found them manageable and H1 reachable with effort; one found some readings hard and good marks not easy."
      zh: "三篇论文。2023 年及以前的大多数同学觉得能应付，努力的话能拿 H1；有同学觉得部分阅读难懂，拿高分不容易。"
      zh-TW: "三篇論文。2023 年以前的多數同學覺得應付得來，努力的話能拿 H1；有同學覺得部分閱讀難懂，拿高分不容易。"
      ja: "エッセイ3本。2023年までのレビューの多くは無理なく、努力すればH1も狙えるという。一部のリーディングが難しく高得点は簡単でないという声も一つ。"
      ko: "에세이 3편. 2023년까지의 리뷰 대부분은 할 만하고 노력하면 H1도 가능하다고 했다. 일부 읽기가 어렵고 고득점이 쉽지 않다는 의견도 있다."
      vi: "Ba bài luận. Đa số người học đến 2023 thấy vừa sức và cố gắng thì đạt H1; một người thấy vài bài đọc khó và không dễ được điểm cao."
      ms: "Tiga esei. Kebanyakan pengulas hingga 2023 rasa boleh diurus dan H1 boleh dicapai dengan usaha; seorang rasa sesetengah bacaan sukar dan markah baik tidak mudah."
      id: "Tiga esai. Kebanyakan pengulas hingga 2023 merasa bisa ditangani dan H1 bisa diraih dengan usaha; satu merasa sebagian bacaan sulit dan nilai bagus tidak mudah."
      hi: "तीन निबंध। 2023 तक के ज़्यादातर रिव्यूअर्स को ये संभालने लायक लगे और मेहनत से H1 संभव; एक को कुछ रीडिंग कठिन और अच्छे अंक पाना आसान नहीं लगा।"
  study:
    - en: "Watch every weekly film, pay attention in lectures, and do the readings, since tutorial discussion is built around them."
      zh: "每周的电影都要看，讲课认真听，阅读也要做，因为 tutorial 讨论都围绕它们。"
      zh-TW: "每週的電影都要看，上課認真聽，閱讀也要做，因為 tutorial 討論都圍繞它們。"
      ja: "毎週の映画は必ず見て、講義に集中し、チュートリアルの議論の土台となるリーディングもこなす。"
      ko: "매주 영화는 꼭 보고 강의에 집중하며, 튜토리얼 토론의 바탕인 읽기 자료도 해 두라."
      vi: "Xem đủ phim mỗi tuần, chú ý bài giảng và làm bài đọc, vì thảo luận tutorial xoay quanh chúng."
      ms: "Tonton setiap filem mingguan, beri perhatian dalam kuliah, dan buat bacaan kerana perbincangan tutorial dibina berdasarkannya."
      id: "Tonton setiap film mingguan, perhatikan kuliah, dan kerjakan bacaan, karena diskusi tutorial bertumpu padanya."
      hi: "हर हफ़्ते की फ़िल्म देखें, लेक्चर में ध्यान दें, और रीडिंग करें, क्योंकि ट्यूटोरियल चर्चा उन्हीं पर टिकी है।"
  watch:
    - en: "The only 2025 reviewer, a first-semester student, found the weekly hours and readings heavy and the essays marked harshly, and warned against expecting a WAM booster."
      zh: "唯一一条 2025 年的评价来自大一第一学期的同学，觉得每周课时和阅读量都重、论文给分严，提醒别指望它刷分。"
      zh-TW: "唯一一則 2025 年的評價來自大一第一學期的同學，覺得每週課時和閱讀量都重、論文給分嚴，提醒別指望它拉分。"
      ja: "2025年唯一のレビューは1年前期の学生で、毎週の時間とリーディングが重く、エッセイの採点も厳しかったとし、WAM稼ぎを期待しないよう警告。"
      ko: "유일한 2025년 리뷰어는 1학년 첫 학기 학생으로, 주당 시간과 읽기가 많고 에세이 채점이 박했다며 WAM 과목을 기대하지 말라고 했다."
      vi: "Người duy nhất năm 2025, sinh viên học kỳ đầu, thấy số giờ và bài đọc mỗi tuần nặng, bài luận chấm gắt, và khuyên đừng kỳ vọng đây là môn kéo WAM."
      ms: "Satu-satunya pengulas 2025, pelajar semester pertama, rasa jam dan bacaan mingguan berat dan esei dinilai keras, serta pesan jangan harap ia penaik WAM."
      id: "Satu-satunya pengulas 2025, mahasiswa semester pertama, merasa jam dan bacaan mingguan berat serta esai dinilai keras, dan mengingatkan jangan berharap ini pendongkrak WAM."
      hi: "2025 के इकलौते रिव्यूअर, पहले सेमेस्टर के छात्र, को हर हफ़्ते के घंटे और रीडिंग भारी और निबंध की मार्किंग सख़्त लगी, और उन्होंने इसे WAM बूस्टर न समझने की चेतावनी दी।"
workload: heavy
difficulty: hard
