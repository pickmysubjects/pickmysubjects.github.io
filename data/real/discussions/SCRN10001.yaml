points:
  - en: "Most reviewers (2018-2023) enjoyed it: a film every week, analysed in tutorials, and no film background needed."
    zh: "大多数评论者（2018-2023）都喜欢：每周看一部电影，在辅导课上分析，不需要电影基础。"
    zh-TW: "大多數評論者（2018-2023）都喜歡：每週看一部電影，在輔導課上分析，不需要電影基礎。"
    ja: "多くのレビュー（2018-2023）が好評。毎週1本映画を観てチュートリアルで分析する。映画の予備知識は不要。"
    ko: "대부분 리뷰(2018-2023)가 호평. 매주 영화 한 편을 보고 튜토리얼에서 분석하며, 영화 배경지식은 필요 없음."
    vi: "Phần lớn người đánh giá (2018-2023) đều thích: mỗi tuần một bộ phim, phân tích trong tutorial, không cần nền tảng điện ảnh."
    ms: "Kebanyakan pengulas (2018-2023) menikmatinya: satu filem setiap minggu, dianalisis dalam tutorial, dan tiada latar belakang filem diperlukan."
    id: "Kebanyakan pengulas (2018-2023) menikmatinya: satu film tiap minggu, dianalisis di tutorial, dan tak perlu latar belakang film."
    hi: "ज़्यादातर रिव्यूअर्स (2018-2023) को पसंद आया: हर हफ़्ते एक फ़िल्म, ट्यूटोरियल में उसका विश्लेषण, और फ़िल्म की कोई पृष्ठभूमि ज़रूरी नहीं।"
  - en: "Assessment is mainly three essays and was called fair, though some found the theory and readings demanding; a 2025 first-year student found the long weekly contact hours and readings a hard start."
    zh: "考核主要是三篇论文，被认为公平，但有人觉得理论和阅读要求较高；一位2025年的大一新生觉得每周课时长、阅读多，起步很吃力。"
    zh-TW: "評量主要是三篇論文，被認為公平，但有人覺得理論和閱讀要求較高；一位2025年的大一新生覺得每週課時長、閱讀多，起步很吃力。"
    ja: "評価は主にエッセイ3本で妥当とされるが、理論と読み物がきついと感じた人もいる。2025年の1年生は、毎週の長い授業時間と読み物で大変なスタートだったとのこと。"
    ko: "평가는 주로 에세이 3편으로 공정하다는 평이지만, 이론과 읽기가 버겁다는 사람도 있음. 2025년 신입생은 긴 주간 수업 시간과 읽기 때문에 시작이 힘들었다고 함."
    vi: "Đánh giá chủ yếu là ba bài luận và được cho là công bằng, dù vài người thấy lý thuyết và bài đọc nặng; một tân sinh viên năm 2025 thấy số giờ học dài mỗi tuần và bài đọc khiến khởi đầu rất vất vả."
    ms: "Penilaian terutamanya tiga esei dan dikatakan adil, walaupun ada yang dapati teori dan bacaan mencabar; seorang pelajar tahun pertama 2025 dapati jam kelas mingguan yang panjang dan bacaan menjadikan permulaan sukar."
    id: "Penilaian utamanya tiga esai dan dianggap adil, meski ada yang merasa teori dan bacaannya berat; mahasiswa baru 2025 merasa jam kelas mingguan yang panjang dan bacaannya bikin awal yang berat."
    hi: "आकलन मुख्य रूप से तीन निबंध हैं और इसे उचित माना गया, हालाँकि कुछ को थ्योरी और रीडिंग्स भारी लगीं; 2025 के एक फ़र्स्ट-ईयर छात्र को हफ़्ते के लंबे क्लास घंटों और रीडिंग्स से शुरुआत कठिन लगी।"
