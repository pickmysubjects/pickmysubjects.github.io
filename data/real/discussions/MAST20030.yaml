points:
  - en: "Consistently described as hard and demanding, but rewarding."
    zh: "普遍认为难度大、要求高，但收获丰富。"
    zh-TW: "普遍認為難度大、要求高，但收穫豐富。"
    ja: "一貫して難しく負担が大きいが、得るものも大きいとされる。"
    ko: "일관되게 어렵고 힘들지만 보람 있다는 평이다."
    vi: "Luôn được mô tả là khó và nặng, nhưng đáng giá."
    ms: "Sentiasa digambarkan sukar dan menuntut, tetapi berbaloi."
    id: "Selalu disebut sulit dan menuntut, tapi sepadan."
    hi: "लगातार कठिन और मेहनत वाला बताया गया, पर फ़ायदेमंद।"
  - en: "Lectures need full concentration; small lapses leave you lost."
    zh: "讲课需全神贯注，稍一走神就会跟不上。"
    zh-TW: "上課需全神貫注，稍一分心就會跟不上。"
    ja: "講義は集中が必要。少し気を抜くと置いていかれる。"
    ko: "강의는 완전히 집중해야 한다. 잠깐 놓치면 길을 잃는다."
    vi: "Bài giảng cần tập trung cao độ; lơ là chút là mất dấu."
    ms: "Kuliah perlukan tumpuan penuh; leka sedikit pun anda akan hilang arah."
    id: "Kuliah butuh konsentrasi penuh; lengah sedikit langsung tersesat."
    hi: "लेक्चर में पूरा ध्यान चाहिए; थोड़ा चूके तो समझ से बाहर।"
  - en: "Questions are long and tedious with heavy integration; exams can be harder than past papers."
    zh: "题目冗长、积分计算多，考试可能比往年试卷难。"
    zh-TW: "題目冗長、積分計算多，考試可能比考古題難。"
    ja: "問題は長く面倒で積分が多い。試験は過去問より難しいことも。"
    ko: "문제가 길고 지루하며 적분이 많다. 시험은 기출보다 어려울 수 있다."
    vi: "Câu hỏi dài, tẻ nhạt, nhiều tích phân; đề thi có thể khó hơn đề cũ."
    ms: "Soalan panjang dan meletihkan dengan banyak kamiran; peperiksaan boleh lebih sukar daripada soalan lepas."
    id: "Soalnya panjang dan melelahkan dengan banyak integral; ujian bisa lebih sulit dari soal lama."
    hi: "सवाल लंबे और थकाऊ, बहुत इंटीग्रेशन; एग्ज़ाम पुराने पेपर से कठिन हो सकते हैं।"
  - en: "Relies on Calculus 2, linear algebra and vector calculus, so revise them first."
    zh: "依赖微积分2、线性代数和向量微积分，需先复习。"
    zh-TW: "依賴微積分2、線性代數和向量微積分，需先複習。"
    ja: "Calculus 2、線形代数、ベクトル解析が前提なので、先に復習しておこう。"
    ko: "Calculus 2, 선형대수, 벡터 미적분을 바탕으로 하니 먼저 복습하자."
    vi: "Dựa trên Calculus 2, đại số tuyến tính và giải tích vectơ, nên ôn trước."
    ms: "Bergantung pada Calculus 2, algebra linear dan kalkulus vektor, jadi ulang kaji dahulu."
    id: "Bergantung pada Calculus 2, aljabar linear, dan kalkulus vektor, jadi ulangi dulu."
    hi: "Calculus 2, लीनियर अलजेब्रा और वेक्टर कैलकुलस पर आधारित, तो पहले इन्हें दोहरा लें।"
workload: heavy
difficulty: hard
