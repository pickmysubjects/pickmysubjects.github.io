points:
  - en: "Consistently described as hard and demanding, but rewarding."
    zh: "普遍认为难度大、要求高，但收获丰富。"
    zh-TW: "普遍認為難度大、要求高，但收穫豐富。"
    ja: "一貫して難しく負担が大きいが、得るものも大きいとされる。"
    ko: "일관되게 어렵고 힘들지만 보람 있다는 평이다."
    vi: "Luôn được mô tả là khó và nặng, nhưng đáng giá."
    ms: "Sentiasa digambarkan sukar dan menuntut, tetapi berbaloi."
    id: "Selalu disebut sulit dan menuntut, tapi sepadan."
    hi: "लगातार कठिन और मेहनत वाला बताया गया, पर फ़ायदेमंद।"
  - en: "Lectures need full concentration; small lapses leave you lost."
    zh: "讲课需全神贯注，稍一走神就会跟不上。"
    zh-TW: "上課需全神貫注，稍一分心就會跟不上。"
    ja: "講義は集中が必要。少し気を抜くと置いていかれる。"
    ko: "강의는 완전히 집중해야 한다. 잠깐 놓치면 길을 잃는다."
    vi: "Bài giảng cần tập trung cao độ; lơ là chút là mất dấu."
    ms: "Kuliah perlukan tumpuan penuh; leka sedikit pun anda akan hilang arah."
    id: "Kuliah butuh konsentrasi penuh; lengah sedikit langsung tersesat."
    hi: "लेक्चर में पूरा ध्यान चाहिए; थोड़ा चूके तो समझ से बाहर।"
  - en: "Questions are long and tedious with heavy integration; exams can be harder than past papers."
    zh: "题目冗长、积分计算多，考试可能比往年试卷难。"
    zh-TW: "題目冗長、積分計算多，考試可能比考古題難。"
    ja: "問題は長く面倒で積分が多い。試験は過去問より難しいことも。"
    ko: "문제가 길고 지루하며 적분이 많다. 시험은 기출보다 어려울 수 있다."
    vi: "Câu hỏi dài, tẻ nhạt, nhiều tích phân; đề thi có thể khó hơn đề cũ."
    ms: "Soalan panjang dan meletihkan dengan banyak kamiran; peperiksaan boleh lebih sukar daripada soalan lepas."
    id: "Soalnya panjang dan melelahkan dengan banyak integral; ujian bisa lebih sulit dari soal lama."
    hi: "सवाल लंबे और थकाऊ, बहुत इंटीग्रेशन; एग्ज़ाम पुराने पेपर से कठिन हो सकते हैं।"
  - en: "Relies on Calculus 2, linear algebra and vector calculus, so revise them first."
    zh: "依赖微积分2、线性代数和向量微积分，需先复习。"
    zh-TW: "依賴微積分2、線性代數和向量微積分，需先複習。"
    ja: "Calculus 2、線形代数、ベクトル解析が前提なので、先に復習しておこう。"
    ko: "Calculus 2, 선형대수, 벡터 미적분을 바탕으로 하니 먼저 복습하자."
    vi: "Dựa trên Calculus 2, đại số tuyến tính và giải tích vectơ, nên ôn trước."
    ms: "Bergantung pada Calculus 2, algebra linear dan kalkulus vektor, jadi ulang kaji dahulu."
    id: "Bergantung pada Calculus 2, aljabar linear, dan kalkulus vektor, jadi ulangi dulu."
    hi: "Calculus 2, लीनियर अलजेब्रा और वेक्टर कैलकुलस पर आधारित, तो पहले इन्हें दोहरा लें।"
sections:
  content:
    - en: "Hard but rewarding: ODEs, Laplace transforms, Fourier series and PDEs. It leans on Calculus 2 and linear algebra more than Vector Calculus; one reviewer found it too focused on tedious integrals."
      zh: "难但有收获：常微分方程、拉普拉斯变换、傅里叶级数和偏微分方程。更依赖 Calculus 2 和线性代数，而不是向量微积分；有人觉得太偏重繁琐的积分。"
      zh-TW: "難但有收穫：常微分方程、拉普拉斯轉換、傅立葉級數和偏微分方程。更依賴 Calculus 2 和線性代數，而不是向量微積分；有人覺得太偏重繁瑣的積分。"
      ja: "難しいがやりがいがある。常微分方程式、ラプラス変換、フーリエ級数、偏微分方程式。ベクトル解析よりCalculus 2と線形代数に頼る。面倒な積分ばかりだという人も。"
      ko: "어렵지만 보람 있다. 상미분방정식, 라플라스 변환, 푸리에 급수, 편미분방정식을 다룬다. 벡터 미적분보다 Calculus 2와 선형대수에 더 기댄다. 지루한 적분 위주라는 사람도 있다."
      vi: "Khó nhưng đáng: phương trình vi phân thường, biến đổi Laplace, chuỗi Fourier và PDE. Dựa vào Calculus 2 và đại số tuyến tính hơn là Giải tích vector; một người thấy quá tập trung vào tích phân dài dòng."
      ms: "Sukar tetapi berbaloi: ODE, jelmaan Laplace, siri Fourier dan PDE. Lebih bergantung pada Calculus 2 dan algebra linear berbanding Vector Calculus; seorang rasa terlalu tertumpu pada kamiran meletihkan."
      id: "Sulit tapi memuaskan: PDB biasa, transformasi Laplace, deret Fourier dan PDP. Lebih bergantung pada Calculus 2 dan aljabar linear daripada Vector Calculus; satu merasa terlalu fokus pada integral yang melelahkan."
      hi: "कठिन पर फलदायी: ODE, लाप्लास रूपांतरण, फ़ूरियर श्रेणी और PDE। वेक्टर कैलकुलस से ज़्यादा Calculus 2 और रैखिक बीजगणित पर टिका; एक को यह थकाऊ इंटीग्रल पर बहुत केंद्रित लगा।"
  work:
    - en: "Assessments are seen as fair and well tied to lectures, with plenty of practice exams; the final has long, tedious questions, and one found it much harder than past papers."
      zh: "考核被认为公平、和讲座结合紧，练习卷很多；期末题目又长又繁，有人觉得比往年卷难得多。"
      zh-TW: "考核被認為公平、跟講座結合緊，練習卷很多；期末題目又長又繁，有人覺得比考古題難很多。"
      ja: "評価は公平で講義とよく結びついており、練習試験も多い。期末は長く面倒な問題で、過去問よりずっと難しかったという人も。"
      ko: "평가는 공정하고 강의와 잘 연결되며 연습 시험도 많다. 기말은 길고 지루한 문제이며, 기출보다 훨씬 어려웠다는 사람도 있다."
      vi: "Đánh giá được cho là công bằng, bám sát bài giảng, có nhiều đề luyện; thi cuối câu dài và mệt, một người thấy khó hơn đề cũ nhiều."
      ms: "Penilaian dianggap adil dan berkait rapat dengan kuliah, dengan banyak peperiksaan latihan; peperiksaan akhir ada soalan panjang dan meletihkan, seorang rasa jauh lebih sukar daripada kertas lepas."
      id: "Penilaian dianggap adil dan terkait erat dengan kuliah, dengan banyak ujian latihan; ujian akhir soalnya panjang dan melelahkan, satu merasa jauh lebih sulit dari ujian lama."
      hi: "मूल्यांकन उचित और लेक्चर से जुड़ा माना गया, प्रैक्टिस परीक्षाएँ बहुत; फ़ाइनल में लंबे, थकाऊ सवाल, एक को पुराने पेपरों से कहीं कठिन लगा।"
  study:
    - en: "Concentrate fully in lectures, since losing a few minutes means getting lost; revise linear algebra, and practise questions until the patterns click."
      zh: "上课要全神贯注，走神几分钟就会跟不上；复习线性代数，多做题直到看出套路。"
      zh-TW: "上課要全神貫注，分心幾分鐘就會跟不上；複習線性代數，多做題直到看出套路。"
      ja: "講義には集中すること。数分気を抜くとついていけなくなる。線形代数を復習し、パターンが見えるまで問題を解く。"
      ko: "강의엔 완전히 집중하라. 몇 분만 놓쳐도 길을 잃는다. 선형대수를 복습하고 패턴이 보일 때까지 문제를 풀어라."
      vi: "Tập trung hoàn toàn trong giờ giảng vì lơ đãng vài phút là lạc; ôn đại số tuyến tính và luyện đề đến khi thấy quy luật."
      ms: "Tumpu sepenuhnya dalam kuliah kerana hilang beberapa minit bermakna tersesat; ulang kaji algebra linear, dan latih soalan sehingga nampak coraknya."
      id: "Fokus penuh di kuliah karena lengah beberapa menit berarti tersesat; ulangi aljabar linear, dan latih soal sampai polanya terlihat."
      hi: "लेक्चर में पूरा ध्यान दें, क्योंकि कुछ मिनट चूके तो भटक जाएँगे; रैखिक बीजगणित दोहराएँ, और पैटर्न समझ आने तक सवाल करें।"
  watch:
    - en: "All these reviews are from 2021 or earlier; teaching and exams may have changed since."
      zh: "这些评价都是 2021 年或更早的，现在的教法和考试可能已经变了。"
      zh-TW: "這些評價都是 2021 年或更早的，現在的教法和考試可能已經變了。"
      ja: "レビューはすべて2021年以前のもの。授業や試験は変わっている可能性がある。"
      ko: "모든 리뷰가 2021년 이전 것이라 지금 수업과 시험은 달라졌을 수 있다."
      vi: "Tất cả đánh giá đều từ năm 2021 trở về trước; cách dạy và thi có thể đã thay đổi."
      ms: "Semua ulasan ini dari 2021 atau lebih awal; pengajaran dan peperiksaan mungkin telah berubah."
      id: "Semua ulasan ini dari 2021 atau sebelumnya; pengajaran dan ujian mungkin sudah berubah."
      hi: "ये सभी रिव्यू 2021 या उससे पहले के हैं; पढ़ाई और परीक्षा अब बदल चुकी हो सकती है।"
workload: heavy
difficulty: hard
