points:
  - en: "Opinions changed over the years: 2019 and 2020 reviewers liked the relevant content and straightforward assessments, 2021 and 2022 were mostly negative, and in 2025 a new teaching team had greatly improved it."
    zh: "评价随年份变化：2019和2020年的评论者喜欢内容贴近时事、考核直接；2021和2022年以负面为主；2025年的评论者说新的教学团队让课程大幅改进。"
    zh-TW: "評價隨年份變化：2019和2020年的評論者喜歡內容貼近時事、考核直接；2021和2022年以負面為主；2025年的評論者說新的教學團隊讓課程大幅改進。"
    ja: "評価は年によって変化。2019・2020年は時事的な内容と分かりやすい評価が好評、2021・2022年は否定的な声が中心、2025年の評者は新しい教員チームで大きく改善したという。"
    ko: "평가가 해마다 바뀜. 2019·2020년은 시의성 있는 내용과 명확한 평가로 호평, 2021·2022년은 주로 부정적, 2025년 리뷰어는 새 교수진 덕에 크게 개선됐다고 함."
    vi: "Ý kiến thay đổi theo năm: 2019 và 2020 thích nội dung thời sự và bài đánh giá rõ ràng, 2021 và 2022 chủ yếu tiêu cực, còn người năm 2025 nói đội ngũ giảng dạy mới đã cải thiện nhiều."
    ms: "Pendapat berubah mengikut tahun: pengulas 2019 dan 2020 suka kandungan yang relevan dan penilaian yang jelas, 2021 dan 2022 kebanyakannya negatif, dan pengulas 2025 kata pasukan pengajar baharu banyak memperbaikinya."
    id: "Pendapat berubah dari tahun ke tahun: pengulas 2019 dan 2020 menyukai isi yang relevan dan penilaian yang lugas, 2021 dan 2022 kebanyakan negatif, dan pengulas 2025 bilang tim pengajar baru sangat memperbaikinya."
    hi: "राय सालों में बदली: 2019 और 2020 के रिव्यूअर्स को प्रासंगिक सामग्री और सीधे मूल्यांकन पसंद आए, 2021 और 2022 में ज़्यादातर नकारात्मक राय रही, और 2025 के रिव्यूअर ने कहा नई टीचिंग टीम ने इसे काफ़ी बेहतर बनाया।"
  - en: "Earlier complaints were that lectures got repetitive after the first weeks (fake news, partisanship, democracy), marking was harsh, and media students found little on the media industry itself."
    zh: "早期的抱怨包括：前几周后讲课内容重复（假新闻、党派、民主），评分严格，传媒专业学生觉得涉及传媒行业本身的内容很少。"
    zh-TW: "早期的抱怨包括：前幾週後講課內容重複（假新聞、黨派、民主），評分嚴格，傳媒主修學生覺得涉及傳媒產業本身的內容很少。"
    ja: "以前の不満は、最初の数週間以降の講義が繰り返し（フェイクニュース、党派性、民主主義）になること、採点の厳しさ、メディア専攻にとってメディア業界そのものの内容が少ないことだった。"
    ko: "이전 불만은 초반 몇 주 이후 강의가 반복적(가짜뉴스, 당파성, 민주주의)이라는 점, 채점이 엄격하다는 점, 미디어 전공생에게 미디어 산업 자체에 대한 내용이 적다는 점이었음."
    vi: "Phàn nàn trước đây: sau vài tuần đầu bài giảng lặp lại (tin giả, đảng phái, dân chủ), chấm điểm khắt khe, và sinh viên truyền thông thấy ít nội dung về chính ngành truyền thông."
    ms: "Aduan terdahulu ialah kuliah jadi berulang selepas minggu awal (berita palsu, kepartian, demokrasi), pemarkahan ketat, dan pelajar media dapati sedikit tentang industri media itu sendiri."
    id: "Keluhan sebelumnya: kuliah jadi berulang setelah minggu-minggu awal (berita palsu, partisanship, demokrasi), penilaian ketat, dan mahasiswa media merasa sedikit membahas industri media itu sendiri."
    hi: "पहले की शिकायतें थीं कि शुरुआती हफ़्तों के बाद लेक्चर दोहराव वाले हो गए (फ़ेक न्यूज़, पक्षपात, लोकतंत्र), मार्किंग सख़्त थी, और मीडिया छात्रों को मीडिया उद्योग पर कम सामग्री मिली।"
  - en: "In 2025 it was described as fun and relatively easy to do well in, leaning more on media theory applied to politics. Mixed politics and media cohorts make for lively tutorials, but sources for essays can be scarce."
    zh: "2025年被形容为有趣、相对容易拿好成绩，更偏重把传媒理论应用到政治上。政治和传媒学生混合上课，辅导课讨论活跃，但论文可用资料较少。"
    zh-TW: "2025年被形容為有趣、相對容易拿好成績，更偏重把傳媒理論應用到政治上。政治和傳媒學生混合上課，輔導課討論活躍，但論文可用資料較少。"
    ja: "2025年は楽しく比較的好成績を取りやすいとされ、メディア理論を政治に応用する比重が大きい。政治とメディアの学生が混ざるのでチュートリアルは活発だが、エッセイの資料は少なめ。"
    ko: "2025년엔 재미있고 비교적 좋은 성적을 받기 쉬우며 미디어 이론을 정치에 적용하는 비중이 크다고 함. 정치·미디어 전공생이 섞여 튜토리얼이 활발하지만 에세이 자료는 부족할 수 있음."
    vi: "Năm 2025 được tả là vui và tương đối dễ đạt điểm tốt, thiên về áp dụng lý thuyết truyền thông vào chính trị. Lớp trộn sinh viên chính trị và truyền thông nên tutorial sôi nổi, nhưng tài liệu cho bài luận khá ít."
    ms: "Pada 2025 ia digambarkan seronok dan agak mudah untuk berjaya, lebih kepada teori media yang diterapkan pada politik. Gabungan pelajar politik dan media menjadikan tutorial rancak, tetapi sumber esei mungkin terhad."
    id: "Pada 2025 digambarkan seru dan relatif mudah dapat nilai bagus, lebih condong ke teori media yang diterapkan pada politik. Campuran mahasiswa politik dan media membuat tutorial hidup, tapi sumber esai bisa terbatas."
    hi: "2025 में इसे मज़ेदार और अच्छे अंक पाने में अपेक्षाकृत आसान बताया गया, जिसमें राजनीति पर मीडिया सिद्धांत लागू करने पर ज़ोर है। राजनीति और मीडिया छात्रों के मेल से ट्यूटोरियल जीवंत रहते हैं, पर निबंध के स्रोत कम मिल सकते हैं।"
difficulty: mixed
