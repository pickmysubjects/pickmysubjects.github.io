code: GEOM20013
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/geom20013
reviews: 9
from: 2017
to: 2025
checked: 2026-10-08
points:
  - en: "Most of the work is group GIS projects, so choosing a good group strongly affects your experience."
    zh: "大部分工作是GIS小组项目，组员好坏很大程度决定体验。"
    zh-TW: "大部分作業是GIS小組專題，組員好壞大大影響你的體驗。"
    ja: "作業の大半はGISのグループプロジェクトなので、良いグループ選びが体験を大きく左右する。"
    ko: "대부분 GIS 조별 프로젝트라 좋은 조를 고르는 것이 경험을 크게 좌우함."
    vi: "Phần lớn là dự án GIS theo nhóm, nên chọn nhóm tốt ảnh hưởng lớn đến trải nghiệm."
    ms: "Kebanyakan kerja ialah projek GIS berkumpulan, jadi memilih kumpulan yang baik sangat mempengaruhi pengalaman anda."
    id: "Sebagian besar kerja berupa proyek GIS kelompok, jadi memilih kelompok yang baik sangat memengaruhi pengalaman."
    hi: "ज़्यादातर काम ग्रुप GIS प्रोजेक्ट हैं, तो अच्छा ग्रुप चुनना आपके अनुभव पर बड़ा असर डालता है।"
  - en: "2024-25 reviews were very negative: lectures felt unrelated to assignments, a heavy workload, and strict rules on late work and special consideration."
    zh: "2024-25年评价很负面：讲课与作业脱节、工作量大，迟交和特殊考虑规定严格。"
    zh-TW: "2024-25年的評價很負面：講課和作業脫節、工作量大，遲交和特殊考量的規定很嚴。"
    ja: "2024-25年の口コミはかなり否定的。講義が課題と無関係に感じられ、負担が重く、遅延提出や特別配慮のルールも厳しい。"
    ko: "2024-25년 후기는 매우 부정적: 강의가 과제와 동떨어지고 부담이 크며, 지각 제출과 특별 고려 규정이 엄격함."
    vi: "Đánh giá 2024-25 rất tiêu cực: bài giảng không liên quan bài tập, khối lượng nặng, quy định nộp muộn và xét đặc biệt khắt khe."
    ms: "Ulasan 2024-25 sangat negatif: kuliah terasa tidak berkaitan dengan tugasan, beban kerja berat, dan peraturan ketat tentang kerja lewat serta pertimbangan khas."
    id: "Ulasan 2024-25 sangat negatif: kuliah terasa tidak terkait tugas, beban kerja berat, dan aturan ketat soal keterlambatan dan pertimbangan khusus."
    hi: "2024-25 के रिव्यू बहुत नेगेटिव थे: लेक्चर असाइनमेंट से जुड़े नहीं लगे, वर्कलोड भारी था, और लेट वर्क व स्पेशल कंसिडरेशन के नियम सख़्त थे।"
  - en: "Earlier reviews (2017-2020) were positive, with lenient marking and practical GIS skills."
    zh: "较早（2017-2020年）评价正面，评分宽松，能学到实用GIS技能。"
    zh-TW: "較早（2017-2020年）的評價正面，評分寬鬆，能學到實用的GIS技能。"
    ja: "以前（2017-2020）の口コミは好意的で、採点は甘く実用的なGISスキルが身についた。"
    ko: "예전(2017-2020) 후기는 긍정적이었으며, 채점이 후하고 실용적인 GIS 기술을 배울 수 있었음."
    vi: "Đánh giá trước đây (2017-2020) tích cực, chấm dễ và học được kỹ năng GIS thực tế."
    ms: "Ulasan lebih awal (2017-2020) positif, dengan pemarkahan longgar dan kemahiran GIS praktikal."
    id: "Ulasan lebih awal (2017-2020) positif, dengan penilaian longgar dan keterampilan GIS praktis."
    hi: "पहले के रिव्यू (2017-2020) पॉज़िटिव थे, नरम मार्किंग और काम की GIS स्किल्स के साथ।"
  - en: "Tutors were widely praised as helpful even when the subject overall was criticised."
    zh: "即使课程整体受批评，辅导老师仍普遍被认为很有帮助。"
    zh-TW: "就算整體課程被批評，助教還是普遍被認為很有幫助。"
    ja: "科目全体が批判されていても、チューターは親切だと広く評価されている。"
    ko: "과목 전체가 비판받을 때도 튜터는 도움이 된다는 호평이 많았음."
    vi: "Tutor được khen là nhiệt tình ngay cả khi môn học bị chê."
    ms: "Tutor dipuji meluas sebagai membantu walaupun subjek secara keseluruhan dikritik."
    id: "Tutor banyak dipuji membantu meski mata kuliahnya secara umum dikritik."
    hi: "सब्जेक्ट की कुल आलोचना होने पर भी ट्यूटर्स को काफ़ी मददगार बताया गया।"
sections:
  content:
    - en: "Older reviewers liked the hands-on GIS skills and real-world use. Since the redesign, reviewers say lectures feel random and only partly linked to the assignments."
      zh: "早期的同学喜欢上手学 GIS、能用到实际问题上。改版后，同学说讲课内容很散，和作业只有部分相关。"
      zh-TW: "早期的同學喜歡動手學 GIS、能用在實際問題上。改版後，同學說上課內容很散，和作業只有部分相關。"
      ja: "以前のレビューはGISを実践的に学べ実務に使える点を評価。刷新後は講義がばらばらで課題と一部しかつながらないという声。"
      ko: "예전 리뷰는 GIS를 직접 익히고 실제 문제에 쓰는 점을 좋아했다. 개편 후엔 강의가 산만하고 과제와 일부만 연결된다는 평이다."
      vi: "Người học trước đây thích được thực hành GIS và ứng dụng thực tế. Sau khi thiết kế lại, người học nói bài giảng rời rạc, chỉ liên quan một phần đến bài tập."
      ms: "Pengulas lama suka kemahiran GIS praktikal dan kegunaan dunia sebenar. Selepas reka semula, pengulas kata kuliah terasa rawak dan hanya separa berkait dengan tugasan."
      id: "Pengulas lama suka keterampilan GIS praktis dan penerapan nyata. Setelah dirombak, pengulas bilang kuliahnya acak dan hanya sebagian terkait tugas."
      hi: "पुराने रिव्यूअर्स को GIS का व्यावहारिक कौशल और असली दुनिया में उपयोग पसंद आया। नए रूप के बाद रिव्यूअर्स कहते हैं लेक्चर बेतरतीब हैं और असाइनमेंट से आंशिक रूप से ही जुड़े।"
  work:
    - en: "Most of the work is group projects, plus quizzes. Recent reviewers found the briefs unclear, the marking harsh, part of it on looks, and the workload very high."
      zh: "大部分工作量是小组项目，另有小测。近期同学觉得作业要求不清楚、给分严、有一部分看排版美观，工作量非常大。"
      zh-TW: "大部分工作量是小組專題，另有小考。近期同學覺得作業要求不清楚、給分嚴、有一部分看版面美觀，工作量非常大。"
      ja: "作業の大半はグループプロジェクトで、小テストもある。最近は課題説明が不明確で採点が厳しく、見た目も評価され、負担がとても大きいという声。"
      ko: "작업 대부분이 조별 프로젝트이고 퀴즈도 있다. 최근 리뷰는 과제 안내가 불분명하고 채점이 가혹하며 일부는 디자인으로 평가되고 작업량이 매우 많다고 한다."
      vi: "Phần lớn là project nhóm, kèm quiz. Người học gần đây thấy đề bài không rõ, chấm gắt, một phần chấm theo hình thức, và khối lượng rất lớn."
      ms: "Kebanyakan kerja ialah projek kumpulan, serta kuiz. Pengulas terkini rasa arahan tidak jelas, pemarkahan keras, sebahagiannya pada rupa, dan beban sangat tinggi."
      id: "Sebagian besar beban berupa proyek kelompok, plus kuis. Pengulas terbaru merasa instruksinya tidak jelas, penilaian keras, sebagian dinilai dari tampilan, dan bebannya sangat tinggi."
      hi: "ज़्यादातर काम ग्रुप प्रोजेक्ट हैं, साथ में क्विज़। हाल के रिव्यूअर्स को निर्देश अस्पष्ट, मार्किंग सख़्त, कुछ हिस्सा दिखावट पर, और वर्कलोड बहुत ज़्यादा लगा।"
  study:
    - en: "Pick a reliable group, since it makes or breaks the subject, and lean on your tutor, whom recent reviewers found helpful."
      zh: "组员一定要选靠谱的，这决定你的体验；多找 tutor 帮忙，近期同学觉得 tutor 很有帮助。"
      zh-TW: "組員一定要選可靠的，這決定你的體驗；多找 tutor 幫忙，近期同學覺得 tutor 很有幫助。"
      ja: "グループは信頼できる人を選ぶこと。体験を左右する。チューターを頼るとよい、最近のレビューでは親切だったという。"
      ko: "믿을 만한 조를 골라라. 과목 경험을 좌우한다. 튜터에게 도움을 청하라. 최근 리뷰는 튜터가 많이 도와줬다고 한다."
      vi: "Chọn nhóm đáng tin vì nó quyết định trải nghiệm, và nhờ tutor nhiều, người học gần đây thấy tutor rất hữu ích."
      ms: "Pilih kumpulan yang boleh diharap kerana ia menentukan pengalaman anda, dan dapatkan bantuan tutor, yang pengulas terkini dapati membantu."
      id: "Pilih kelompok yang bisa diandalkan karena itu menentukan pengalamanmu, dan andalkan tutor, yang menurut pengulas terbaru sangat membantu."
      hi: "भरोसेमंद ग्रुप चुनें, क्योंकि वही अनुभव तय करता है, और ट्यूटर की मदद लें, जिन्हें हाल के रिव्यूअर्स ने मददगार पाया।"
  watch:
    - en: "Per a 2024 reviewer, it was renamed Applying Digital Infrastructure with less GIS focus. Recent reviewers say lectures weren't recorded and late group work wasn't accepted."
      zh: "据 2024 年的同学说，课程已改名为 Applying Digital Infrastructure，GIS 比重降低。近期同学说讲课不录播，小组作业迟交不收。"
      zh-TW: "據 2024 年的同學說，課程已改名為 Applying Digital Infrastructure，GIS 比重降低。近期同學說上課不錄影，小組作業遲交不收。"
      ja: "2024年のレビューによると、名称がApplying Digital Infrastructureに変わりGISの比重が下がった。最近は講義が録画されず、グループ課題の遅延提出は受け付けられなかったという。"
      ko: "2024년 리뷰에 따르면 Applying Digital Infrastructure로 이름이 바뀌고 GIS 비중이 줄었다. 최근엔 강의가 녹화되지 않았고 조별 과제 지각 제출을 받지 않았다고 한다."
      vi: "Theo một người năm 2024, môn đã đổi tên thành Applying Digital Infrastructure và ít tập trung vào GIS hơn. Gần đây bài giảng không được ghi hình và bài nhóm nộp muộn không được nhận."
      ms: "Menurut pengulas 2024, ia dinamakan semula Applying Digital Infrastructure dengan kurang tumpuan GIS. Pengulas terkini kata kuliah tidak dirakam dan kerja kumpulan lewat tidak diterima."
      id: "Menurut pengulas 2024, namanya diganti menjadi Applying Digital Infrastructure dengan fokus GIS lebih sedikit. Pengulas terbaru bilang kuliah tidak direkam dan tugas kelompok terlambat tidak diterima."
      hi: "2024 के एक रिव्यूअर के अनुसार इसका नाम Applying Digital Infrastructure हो गया और GIS पर ज़ोर कम हुआ। हाल के रिव्यूअर्स कहते हैं लेक्चर रिकॉर्ड नहीं हुए और देर से जमा ग्रुप काम स्वीकार नहीं हुआ।"
workload: heavy
