points:
  - en: "Lectures are engaging and the topic is interesting; teaching is generally praised."
    zh: "讲座吸引人,主题有意思;教学整体评价不错。"
    zh-TW: "講座吸引人,主題有意思;教學整體評價不錯。"
    ja: "講義は引き込まれる内容でテーマも面白く、教え方は概ね好評です。"
    ko: "강의가 흥미롭고 주제도 재미있으며, 강의 평가는 대체로 좋습니다."
    vi: "Bài giảng cuốn hút, chủ đề thú vị; việc giảng dạy nhìn chung được khen."
    ms: "Kuliah menarik dan topiknya menarik; pengajaran secara umum dipuji."
    id: "Kuliahnya menarik dan topiknya seru; pengajaran umumnya dipuji."
    hi: "लेक्चर दिलचस्प हैं और विषय रोचक है; पढ़ाने की आम तौर पर तारीफ़ होती है।"
  - en: "Assessment is writing-heavy, so plan time for essays."
    zh: "考核以写作为主,要给论文预留时间。"
    zh-TW: "評量以寫作為主,要給論文預留時間。"
    ja: "評価は文章課題が中心なので、エッセイの時間を確保しましょう。"
    ko: "평가가 글쓰기 위주라 에세이에 쓸 시간을 확보해야 합니다."
    vi: "Đánh giá thiên về viết, nên dành thời gian cho bài luận."
    ms: "Penilaian banyak penulisan, jadi peruntukkan masa untuk esei."
    id: "Penilaian banyak menulis, jadi siapkan waktu untuk esai."
    hi: "आकलन लेखन-प्रधान है, इसलिए निबंधों के लिए समय रखें।"
  - en: "Readings can feel disorganised or out of step with lectures, and assessment info has been inconsistent at times."
    zh: "阅读材料有时显得杂乱,和讲座内容不太对应,考核信息也偶尔前后不一。"
    zh-TW: "閱讀材料有時顯得雜亂,和講座內容不太對應,評量資訊也偶爾前後不一。"
    ja: "リーディングがまとまりに欠け講義と噛み合わないことがあり、評価に関する情報が食い違うこともありました。"
    ko: "읽기 자료가 정리되지 않거나 강의와 맞지 않을 때가 있고, 평가 안내가 일관되지 않은 적도 있습니다."
    vi: "Tài liệu đọc đôi khi lộn xộn, không khớp bài giảng, và thông tin đánh giá có lúc không nhất quán."
    ms: "Bahan bacaan kadang tidak tersusun atau tidak selari dengan kuliah, dan maklumat penilaian pernah tidak konsisten."
    id: "Bacaan kadang terasa tidak teratur atau tidak sejalan dengan kuliah, dan info penilaian sempat tidak konsisten."
    hi: "रीडिंग कभी-कभी बिखरी या लेक्चर से मेल न खाती लगती हैं, और आकलन की जानकारी भी कभी-कभी असंगत रही है।"
