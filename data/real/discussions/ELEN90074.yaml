points:
  - en: "Split into two halves: electromagnetism theory for the mid-semester test and circuit theory for the final. One reviewer found **the first half much harder**, with overly complicated slides."
    zh: "课程分两半：期中考电磁学理论，期末考电路理论。有人觉得**前半部分难得多**，幻灯片也写得很复杂。"
    zh-TW: "課程分兩半：期中考電磁學理論，期末考電路理論。有人覺得**前半部分難得多**，投影片也寫得很複雜。"
    ja: "前半は電磁気学の理論で中間試験、後半は回路理論で期末試験。**前半の方がずっと難しく**、スライドも複雑すぎたという声がある。"
    ko: "전반부 전자기학 이론은 중간시험, 후반부 회로 이론은 기말시험에 나온다. **전반부가 훨씬 어렵고** 슬라이드도 지나치게 복잡했다는 평이 있다."
    vi: "Chia làm hai nửa: lý thuyết điện từ cho bài giữa kỳ và lý thuyết mạch cho cuối kỳ. Một người thấy **nửa đầu khó hơn nhiều**, slide lại quá rối."
    ms: "Dibahagi dua: teori elektromagnet untuk ujian pertengahan semester dan teori litar untuk peperiksaan akhir. Seorang dapati **separuh pertama jauh lebih sukar**, dengan slaid yang terlalu rumit."
    id: "Dibagi dua: teori elektromagnetik untuk ujian tengah semester dan teori rangkaian untuk ujian akhir. Satu pengulas merasa **paruh pertama jauh lebih sulit**, slide-nya juga terlalu rumit."
    hi: "दो हिस्सों में बँटा है: मिड-सेम टेस्ट के लिए इलेक्ट्रोमैग्नेटिज़्म थ्योरी और फ़ाइनल के लिए सर्किट थ्योरी। एक को **पहला हिस्सा कहीं ज़्यादा कठिन** लगा, स्लाइड्स भी बहुत उलझी हुई।"
  - en: "Several reviewers were strongly negative, criticising the lecturers and content and warning against taking it unless you have to. One also found the workshops poorly organised."
    zh: "好几位评论者评价很差，批评讲师和内容，劝大家不是必修就别选。也有人觉得研讨课组织得不好。"
    zh-TW: "好幾位評論者評價很差，批評講師和內容，勸大家不是必修就別選。也有人覺得 workshop 安排得不好。"
    ja: "複数の人が強く否定的で、講師や内容を批判し、必要でなければ取らないよう警告している。ワークショップの運営がまずかったという声もある。"
    ko: "여러 명이 매우 부정적으로, 강사와 내용을 비판하며 꼭 필요하지 않으면 듣지 말라고 했다. 워크숍 운영이 엉망이었다는 의견도 있다."
    vi: "Nhiều người đánh giá rất tiêu cực, chê giảng viên và nội dung, khuyên đừng học nếu không bắt buộc. Một người còn thấy workshop tổ chức kém."
    ms: "Beberapa pengulas sangat negatif, mengkritik pensyarah dan kandungan serta menasihatkan jangan ambil melainkan wajib. Seorang juga dapati bengkel kurang teratur."
    id: "Beberapa pengulas sangat negatif, mengkritik dosen dan materinya serta menyarankan jangan ambil kecuali wajib. Satu juga merasa workshop kurang tertata."
    hi: "कई रिव्यूअर्स बहुत नकारात्मक थे, लेक्चरर्स और कंटेंट की आलोचना की और कहा कि ज़रूरी न हो तो न लें। एक को वर्कशॉप्स भी ख़राब तरीक़े से आयोजित लगीं।"
  - en: "On the positive side, one reviewer said it is an enjoyable intro if you are interested in power engineering, and another liked the second-half lecturer."
    zh: "正面评价也有：有人说如果对电力工程方向感兴趣，这门入门课会很喜欢；也有人喜欢后半部分的讲师。"
    zh-TW: "正面評價也有：有人說如果對電力工程方向有興趣，這門入門課會很喜歡；也有人喜歡後半部分的講師。"
    ja: "良い面として、電力工学に興味があれば楽しめる入門科目だという声や、後半の講師が良かったという声もある。"
    ko: "긍정적인 평으로는, 전력공학에 관심 있다면 즐길 만한 입문 과목이라는 의견과 후반부 강사가 좋았다는 의견이 있다."
    vi: "Mặt tích cực, một người nói đây là môn nhập môn thú vị nếu bạn thích kỹ thuật điện năng, người khác thích giảng viên nửa sau."
    ms: "Dari sudut positif, seorang kata ia pengenalan yang menyeronokkan jika berminat dengan kejuruteraan kuasa, dan seorang lagi suka pensyarah separuh kedua."
    id: "Sisi positifnya, satu pengulas bilang ini pengantar yang menyenangkan kalau tertarik teknik tenaga listrik, dan yang lain suka dosen paruh kedua."
    hi: "अच्छी बात यह कि एक के अनुसार पावर इंजीनियरिंग में रुचि हो तो यह मज़ेदार परिचय है, और दूसरे को दूसरे हिस्से के लेक्चरर पसंद आए।"
difficulty: hard
