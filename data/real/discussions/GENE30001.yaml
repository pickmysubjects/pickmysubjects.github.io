    zh-TW: "多位講師教授不同主題；大部分教得不錯，但有些部分（如系統發生學、族群遺傳學）感覺太複雜。"
    ja: "複数の講師が多様なテーマを担当。大半はよく教えられているが、系統学や集団遺伝学などは複雑すぎると感じた人も。"
    ko: "여러 강사가 다양한 주제를 다루며 대부분 잘 가르치지만, 계통학·집단유전학 등 일부는 지나치게 복잡했음."
    vi: "Nhiều giảng viên dạy các chủ đề khác nhau; phần lớn dạy tốt, nhưng vài phần (như phát sinh chủng loại, di truyền quần thể) quá rối."
    ms: "Ramai pensyarah meliputi topik pelbagai; kebanyakan bahagian diajar baik, tetapi ada (cth. filogenetik, genetik populasi) terasa terlalu rumit."
    id: "Banyak dosen membahas topik beragam; sebagian besar diajarkan dengan baik, tapi beberapa (mis. filogenetik, genetika populasi) terasa terlalu rumit."
    hi: "कई लेक्चरर अलग-अलग टॉपिक पढ़ाते हैं; ज़्यादातर हिस्से अच्छे से पढ़ाए गए, पर कुछ (जैसे फ़ाइलोजेनेटिक्स, पॉपुलेशन जेनेटिक्स) ज़रूरत से ज़्यादा उलझे लगे।"
  - en: "Assignments can be difficult and require independent work and extra resources."
