points:
  - en: "All three reviews are positive: a practical, well-run follow-on from the first tax law subject, with thorough lecture slides."
    zh: "三条评价都是正面的：实用、组织得好，是第一门税法课的延续，讲座课件很全面。"
    zh-TW: "三則評價都是正面的：實用、組織良好，是第一門稅法課的延續，講座投影片很完整。"
    ja: "3件とも好意的。最初の税法科目の続きとして実践的でよく運営されており、講義スライドも充実している。"
    ko: "세 리뷰 모두 긍정적이다. 첫 세법 과목에 이어지는 실용적이고 잘 운영되는 과목이며 강의 슬라이드가 충실하다."
    vi: "Cả ba đánh giá đều tích cực: môn thực tế, tổ chức tốt, nối tiếp môn luật thuế đầu tiên, slide bài giảng đầy đủ."
    ms: "Ketiga-tiga ulasan positif: sambungan praktikal dan teratur daripada subjek undang-undang cukai pertama, dengan slaid kuliah yang lengkap."
    id: "Ketiga ulasan positif: lanjutan yang praktis dan tertata dari mata kuliah hukum pajak pertama, dengan slide kuliah yang lengkap."
    hi: "तीनों रिव्यू सकारात्मक हैं: पहले टैक्स लॉ विषय का व्यावहारिक, अच्छी तरह चलाया गया अगला हिस्सा, लेक्चर स्लाइड पूरी हैं।"
  - en: "Tutorials help reinforce the theory and flag what matters for assessment; if you liked the first tax law subject, you'll likely enjoy this one."
    zh: "辅导课有助巩固理论，也会点出考核重点；如果喜欢第一门税法课，这门大概也会喜欢。"
    zh-TW: "輔導課有助鞏固理論，也會點出考核重點；如果喜歡第一門稅法課，這門大概也會喜歡。"
    ja: "チュートリアルは理論の定着に役立ち、評価で大事な点も示してくれる。最初の税法科目が好きなら、これも楽しめるはず。"
    ko: "튜토리얼은 이론을 다지고 평가에 중요한 부분을 짚어준다. 첫 세법 과목이 좋았다면 이 과목도 좋아할 것이다."
    vi: "Tutorial giúp củng cố lý thuyết và chỉ ra phần quan trọng cho bài đánh giá; nếu thích môn luật thuế đầu tiên, bạn có lẽ sẽ thích môn này."
    ms: "Tutorial bantu mengukuhkan teori dan tunjukkan apa yang penting untuk penilaian; jika anda suka subjek cukai pertama, anda mungkin suka yang ini."
    id: "Tutorial membantu memperkuat teori dan menunjukkan yang penting untuk penilaian; kalau suka mata kuliah pajak pertama, kemungkinan suka yang ini juga."
    hi: "ट्यूटोरियल थ्योरी पक्की करते हैं और असेसमेंट के लिए ज़रूरी बातें बताते हैं; अगर पहला टैक्स लॉ विषय पसंद आया था तो यह भी शायद पसंद आएगा।"
