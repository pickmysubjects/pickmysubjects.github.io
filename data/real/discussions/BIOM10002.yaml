points:
  - en: "Every reviewer (2022-2025) found the first six weeks a dull repeat of first-semester biology, and the second half on biomedical topics much more interesting."
    zh: "所有评论者（2022-2025）都觉得前六周是第一学期生物的枯燥重复，后半段的生物医学主题有趣得多。"
    zh-TW: "所有評論者（2022-2025）都覺得前六週是第一學期生物的枯燥重複，後半段的生物醫學主題有趣得多。"
    ja: "レビュー全員（2022-2025）が、前半6週は1学期の生物の退屈な繰り返しで、後半の生物医学トピックの方がずっと面白いとした。"
    ko: "리뷰어 모두(2022-2025) 앞 6주는 1학기 생물의 지루한 반복이고, 후반부 생의학 주제가 훨씬 흥미롭다고 함."
    vi: "Mọi người đánh giá (2022-2025) đều thấy sáu tuần đầu là lặp lại nhàm chán môn sinh học kỳ 1, còn nửa sau về chủ đề y sinh thú vị hơn nhiều."
    ms: "Semua pengulas (2022-2025) dapati enam minggu pertama ulangan membosankan biologi semester satu, manakala separuh kedua tentang topik bioperubatan jauh lebih menarik."
    id: "Semua pengulas (2022-2025) merasa enam minggu pertama hanya pengulangan membosankan biologi semester satu, sedangkan paruh kedua tentang topik biomedis jauh lebih menarik."
    hi: "सभी रिव्यूअर्स (2022-2025) को पहले छह हफ़्ते पहले सेमेस्टर की बायोलॉजी का उबाऊ दोहराव लगे, और दूसरा हिस्सा बायोमेडिकल विषयों पर कहीं ज़्यादा दिलचस्प।"
  - en: "The assignments teach research skills like literature reviews. The final exam was called fair or easy, but it tests things only covered in workshops, so attend them."
    zh: "作业训练文献综述等研究技能。期末考试被认为公平甚至简单，但会考只在研讨课讲过的内容，所以要去上。"
    zh-TW: "作業訓練文獻回顧等研究技能。期末考被認為公平甚至簡單，但會考只在研討課講過的內容，所以要去上。"
    ja: "課題では文献レビューなどの研究スキルを学ぶ。期末試験は妥当または易しいとされたが、ワークショップでしか扱わない内容も出るので出席すべき。"
    ko: "과제로 문헌 리뷰 같은 연구 기술을 배움. 기말시험은 공정하거나 쉽다는 평이지만 워크숍에서만 다룬 내용도 나오니 꼭 참석할 것."
    vi: "Bài tập rèn kỹ năng nghiên cứu như tổng quan tài liệu. Thi cuối kỳ được cho là công bằng hoặc dễ, nhưng có hỏi phần chỉ học trong workshop, nên hãy đi học."
    ms: "Tugasan mengajar kemahiran penyelidikan seperti kajian literatur. Peperiksaan akhir dikatakan adil atau mudah, tetapi menguji perkara yang hanya diajar dalam bengkel, jadi hadirilah."
    id: "Tugas melatih keterampilan riset seperti tinjauan pustaka. Ujian akhir disebut adil atau mudah, tapi menguji hal yang hanya dibahas di workshop, jadi hadirlah."
    hi: "असाइनमेंट लिटरेचर रिव्यू जैसी रिसर्च स्किल सिखाते हैं। फ़ाइनल एग्ज़ाम ठीक या आसान बताया गया, पर इसमें वे बातें भी आती हैं जो सिर्फ़ वर्कशॉप में पढ़ाई गईं, इसलिए उनमें जाएँ।"
  - en: "A 2025 reviewer said instructions for the poster and video task were very unclear, while the written assignment had clear guidance."
    zh: "一位2025年的评论者说海报和视频任务的说明非常不清楚，而书面作业的指引很清晰。"
    zh-TW: "一位2025年的評論者說海報和影片任務的說明非常不清楚，而書面作業的指引很清楚。"
    ja: "2025年のレビューでは、ポスターと動画課題の指示が非常に不明確だった一方、レポート課題の指示は明確だったという。"
    ko: "2025년 리뷰어는 포스터·영상 과제 안내가 매우 불명확했지만 서면 과제 안내는 명확했다고 함."
    vi: "Một người đánh giá năm 2025 nói hướng dẫn cho poster và video rất mơ hồ, còn bài viết thì hướng dẫn rõ ràng."
    ms: "Seorang pengulas 2025 kata arahan tugasan poster dan video sangat tidak jelas, manakala tugasan bertulis ada panduan yang jelas."
    id: "Seorang pengulas 2025 bilang instruksi tugas poster dan video sangat tidak jelas, sedangkan tugas tertulis punya panduan yang jelas."
    hi: "2025 के एक रिव्यूअर ने कहा कि पोस्टर और वीडियो टास्क के निर्देश बहुत अस्पष्ट थे, जबकि लिखित असाइनमेंट के निर्देश साफ़ थे।"
difficulty: easy
