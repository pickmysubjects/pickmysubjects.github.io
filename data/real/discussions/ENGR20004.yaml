code: ENGR20004
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/engr20004
reviews: 10
from: 2015
to: 2025
checked: 2026-10-08
points:
  - en: "Statics is fairly intuitive, but dynamics is much harder; many found the subject tough overall."
    zh: "静力学较直观，但动力学难很多；不少人认为整体难度较大。"
    zh-TW: "靜力學比較直觀，但動力學難很多；不少人覺得整體難度偏高。"
    ja: "静力学は比較的直感的だが動力学はずっと難しい。全体的に難しいと感じた人が多い。"
    ko: "정역학은 꽤 직관적이지만 동역학은 훨씬 어렵고, 전체적으로 힘들었다는 의견이 많음."
    vi: "Tĩnh học khá trực quan, nhưng động lực học khó hơn nhiều; nhiều người thấy môn này nhìn chung khó."
    ms: "Statik agak intuitif, tetapi dinamik jauh lebih sukar; ramai rasa subjek ini sukar secara keseluruhan."
    id: "Statika cukup intuitif, tapi dinamika jauh lebih sulit; banyak yang merasa mata kuliah ini berat secara keseluruhan."
    hi: "स्टैटिक्स काफ़ी सहज है, पर डायनेमिक्स बहुत कठिन; कई लोगों को सब्जेक्ट कुल मिलाकर कठिन लगा।"
  - en: "Experience depends heavily on the lecturer for that semester; several advise checking who teaches it before enrolling."
    zh: "体验很大程度取决于当学期讲师，多人建议选课前先确认授课老师。"
    zh-TW: "體驗很大程度取決於當學期的講師，多人建議選課前先確認授課老師。"
    ja: "体験はその学期の講師次第。履修前に誰が教えるか確認するよう勧める声が多い。"
    ko: "경험은 그 학기 강사에 크게 좌우되므로, 수강 전 누가 가르치는지 확인하라는 조언이 많음."
    vi: "Trải nghiệm phụ thuộc nhiều vào giảng viên kỳ đó; nhiều người khuyên kiểm tra ai dạy trước khi đăng ký."
    ms: "Pengalaman sangat bergantung pada pensyarah semester itu; ramai nasihatkan semak siapa mengajar sebelum mendaftar."
    id: "Pengalaman sangat bergantung pada dosen semester itu; banyak yang menyarankan cek siapa pengajarnya sebelum mendaftar."
    hi: "अनुभव उस सेमेस्टर के लेक्चरर पर बहुत निर्भर है; कई लोग एनरोल करने से पहले देखने की सलाह देते हैं कि कौन पढ़ा रहा है।"
  - en: "Lab-based group reports were described as disorganised, with vague marking and slow feedback."
    zh: "基于实验的小组报告被认为组织混乱，评分模糊、反馈慢。"
    zh-TW: "以實驗為主的小組報告被認為組織混亂，評分模糊、回饋很慢。"
    ja: "実験ベースのグループレポートは運営がまとまっておらず、採点が曖昧でフィードバックも遅いとのこと。"
    ko: "실험 기반 조별 보고서는 체계가 없고 채점이 모호하며 피드백이 느리다는 평."
    vi: "Báo cáo nhóm dựa trên lab bị cho là lộn xộn, chấm điểm mơ hồ và phản hồi chậm."
    ms: "Laporan kumpulan berasaskan makmal dikatakan tidak teratur, pemarkahan kabur dan maklum balas lambat."
    id: "Laporan kelompok berbasis lab dinilai berantakan, penilaiannya samar, dan umpan baliknya lambat."
    hi: "लैब-आधारित ग्रुप रिपोर्ट को अव्यवस्थित बताया गया, मार्किंग अस्पष्ट और फ़ीडबैक धीमा।"
  - en: "Workshop tutors are generally helpful; similar problems recur across workshops, the mid-semester test and the exam, so practise them."
    zh: "研讨课助教普遍乐于帮忙；同类题会在研讨课、期中和期末反复出现，务必多练。"
    zh-TW: "工作坊助教普遍很熱心；同類題目會在工作坊、期中考和期末考反覆出現，一定要多練。"
    ja: "ワークショップのチューターはおおむね親切。似た問題がワークショップ、中間テスト、期末試験で繰り返し出るので練習しよう。"
    ko: "워크숍 튜터는 대체로 도움이 되며, 비슷한 문제가 워크숍, 중간고사, 기말시험에 반복되니 꼭 연습하세요."
    vi: "Tutor workshop nhìn chung nhiệt tình; dạng bài tương tự lặp lại ở workshop, bài kiểm tra giữa kỳ và thi cuối, nên hãy luyện chúng."
    ms: "Tutor bengkel umumnya membantu; soalan serupa berulang dalam bengkel, ujian pertengahan semester dan peperiksaan, jadi latihlah."
    id: "Tutor workshop umumnya membantu; soal serupa muncul lagi di workshop, UTS, dan ujian akhir, jadi latihlah."
    hi: "वर्कशॉप ट्यूटर आम तौर पर मददगार हैं; मिलते-जुलते सवाल वर्कशॉप, मिड-सेमेस्टर टेस्ट और एग्ज़ाम में दोहराए जाते हैं, तो उन्हें प्रैक्टिस करें।"
sections:
  content:
    - en: "Statics first, then dynamics; statics feels fairly intuitive but dynamics is a big step up. Most reviews are negative about how it's taught and organised, though a few enjoyed it."
      zh: "先学静力学，后学动力学；静力学比较直观，动力学难度一下就上去了。多数评价对教学和组织很不满，也有少数人喜欢。"
      zh-TW: "先學靜力學，後學動力學；靜力學比較直觀，動力學難度一下就上去了。多數評價對教學和安排很不滿，也有少數人喜歡。"
      ja: "前半は静力学、後半は動力学。静力学は比較的直感的だが、動力学で一気に難しくなる。教え方や運営への否定的な声が多いが、楽しめた人も少数いる。"
      ko: "전반은 정역학, 후반은 동역학. 정역학은 비교적 직관적이지만 동역학에서 크게 어려워진다. 수업 방식과 운영에 부정적인 리뷰가 많지만 즐긴 사람도 소수 있다."
      vi: "Tĩnh học trước, động lực học sau; tĩnh học khá trực quan nhưng động lực học khó hơn hẳn. Phần lớn đánh giá tiêu cực về cách dạy và tổ chức, dù vài người vẫn thích."
      ms: "Statik dahulu, kemudian dinamik; statik agak intuitif tetapi dinamik jauh lebih sukar. Kebanyakan ulasan negatif tentang cara ia diajar dan diurus, walaupun beberapa orang suka."
      id: "Statika dulu, lalu dinamika; statika cukup intuitif tapi dinamika jauh lebih sulit. Kebanyakan ulasan negatif soal cara pengajaran dan pengelolaannya, meski beberapa menikmatinya."
      hi: "पहले स्टैटिक्स, फिर डायनामिक्स; स्टैटिक्स काफ़ी सहज है पर डायनामिक्स में बड़ा उछाल है। ज़्यादातर रिव्यू पढ़ाने और व्यवस्था को लेकर नकारात्मक हैं, हालाँकि कुछ को पसंद आया।"
  work:
    - en: "Group lab reports from in-class experiments with shared kits and little time; several found the marking vague. Workshop problems can reappear in the MST and exam."
      zh: "小组实验报告，实验在课上用共用器材完成、时间很紧；好几位觉得评分标准含糊。workshop 的题可能会在 MST 和考试里再出现。"
      zh-TW: "小組實驗報告，實驗在課堂上用共用器材完成、時間很緊；好幾位覺得評分標準含糊。workshop 的題目可能會在 MST 和考試中再出現。"
      ja: "授業中に共用キットで短時間に行う実験のグループレポート。採点基準があいまいという声が複数。ワークショップの問題がMSTや試験に再登場することも。"
      ko: "수업 중 공용 키트로 짧게 하는 실험의 그룹 보고서. 채점 기준이 모호하다는 리뷰가 여럿. 워크숍 문제가 MST와 시험에 다시 나올 수 있다."
      vi: "Báo cáo thí nghiệm nhóm từ thí nghiệm trên lớp với bộ dụng cụ dùng chung và ít thời gian; vài người thấy chấm mơ hồ. Bài workshop có thể xuất hiện lại trong MST và bài thi."
      ms: "Laporan makmal berkumpulan dari eksperimen dalam kelas dengan kit dikongsi dan masa singkat; beberapa rasa pemarkahan kabur. Soalan bengkel boleh muncul semula dalam MST dan peperiksaan."
      id: "Laporan praktikum kelompok dari eksperimen di kelas dengan kit bersama dan waktu singkat; beberapa merasa penilaiannya kabur. Soal workshop bisa muncul lagi di MST dan ujian."
      hi: "कक्षा में साझा किट और कम समय में किए प्रयोगों की ग्रुप लैब रिपोर्ट; कई को मार्किंग अस्पष्ट लगी। वर्कशॉप के सवाल MST और परीक्षा में फिर आ सकते हैं।"
  study:
    - en: "Use the workshop tutors, who are widely praised, and try PASS if offered. Make friends in other lab groups to compare data and figure out what's going on."
      zh: "多找 workshop 的 tutor，他们普遍很受好评；有 PASS 就去试试。和其他实验组的人交朋友，可以对数据、互相弄清楚状况。"
      zh-TW: "多找 workshop 的 tutor，他們普遍很受好評；有 PASS 就去試試。和其他實驗組的人交朋友，可以對資料、互相搞清楚狀況。"
      ja: "評判の良いワークショップのチューターを頼り、PASSがあれば参加を。他の実験グループとも仲良くなり、データを比べて状況を把握しよう。"
      ko: "평이 좋은 워크숍 튜터를 적극 활용하고, PASS가 있으면 참여하자. 다른 실험 조와도 친해져 데이터를 비교하고 상황을 파악하자."
      vi: "Tận dụng tutor workshop, vốn được khen nhiều, và thử PASS nếu có. Kết bạn với nhóm thí nghiệm khác để so dữ liệu và hiểu chuyện gì đang diễn ra."
      ms: "Gunakan tutor bengkel yang dipuji ramai, dan cuba PASS jika ada. Berkawan dengan kumpulan makmal lain untuk bandingkan data dan faham apa yang berlaku."
      id: "Manfaatkan tutor workshop yang banyak dipuji, dan coba PASS jika ada. Berteman dengan kelompok praktikum lain untuk membandingkan data dan memahami situasinya."
      hi: "वर्कशॉप ट्यूटर्स का इस्तेमाल करें, जिनकी खूब तारीफ़ होती है, और PASS हो तो आज़माएँ। दूसरे लैब ग्रुप में दोस्त बनाएँ ताकि डेटा मिला सकें और समझ सकें क्या चल रहा है।"
  watch:
    - en: "Experience depends heavily on which semester and teaching team you get; several reviewers suggest checking who is running it and say semester 2 or summer has been better."
      zh: "体验很看学期和授课团队；好几位建议先查清当学期谁来教，并说第二学期或夏季学期更好。"
      zh-TW: "體驗很看學期和授課團隊；好幾位建議先查清當學期由誰授課，並說第二學期或暑期學期較好。"
      ja: "どの学期・どの担当チームかで経験が大きく変わる。担当者を事前に確認し、第2学期か夏学期の方が良かったという声が複数。"
      ko: "어느 학기, 어느 교수진이냐에 따라 경험이 크게 달라진다. 담당자를 미리 확인하라고 하며 2학기나 여름 학기가 더 나았다는 리뷰가 여럿."
      vi: "Trải nghiệm phụ thuộc nhiều vào học kỳ và đội ngũ giảng dạy; vài người khuyên kiểm tra ai phụ trách và nói học kỳ 2 hoặc hè tốt hơn."
      ms: "Pengalaman banyak bergantung pada semester dan pasukan pengajar; beberapa pengulas cadang semak siapa yang mengendalikan dan kata semester 2 atau musim panas lebih baik."
      id: "Pengalaman sangat tergantung semester dan tim pengajar; beberapa reviewer menyarankan cek siapa pengampunya dan bilang semester 2 atau musim panas lebih baik."
      hi: "अनुभव बहुत हद तक सेमेस्टर और टीचिंग टीम पर निर्भर है; कई रिव्यूअर सुझाते हैं कि पहले देखें कौन पढ़ा रहा है, और कहते हैं सेमेस्टर 2 या समर बेहतर रहे।"
difficulty: hard
