points:
  - en: "The two 2019 reviewers found it an engaging, interesting subject on metaphysics with a strong lecturer."
    zh: "2019年的两位评论者认为这是一门有吸引力、有意思的形而上学课程，讲课很出色。"
    zh-TW: "2019年的兩位評論者認為這是一門有吸引力、有意思的形上學課程，講課很出色。"
    ja: "2019年の評者2人は、講義の質が高く、面白く引き込まれる形而上学の科目だと評価。"
    ko: "2019년 리뷰어 두 명은 강의가 훌륭하고 흥미로운 형이상학 과목이라고 평가."
    vi: "Hai người năm 2019 thấy đây là môn siêu hình học hấp dẫn, thú vị, giảng viên giỏi."
    ms: "Dua pengulas 2019 mendapatinya subjek metafizik yang menarik dan mengasyikkan dengan pensyarah yang hebat."
    id: "Dua pengulas 2019 menilainya mata kuliah metafisika yang menarik dengan dosen yang hebat."
    hi: "2019 के दोनों रिव्यूअर्स को यह बेहतरीन लेक्चरर वाला, दिलचस्प और रोचक मेटाफ़िज़िक्स सब्जेक्ट लगा।"
  - en: "The 2020 reviewer found the move online chaotic, with little communication and shifting deadlines, and said it largely repeats material for those who have done the first-year big-thinkers philosophy subject."
    zh: "2020年的评论者觉得转到线上后很混乱，沟通少、截止日期变来变去；还说如果上过一年级的“大思想家”哲学课，内容大多是重复。"
    zh-TW: "2020年的評論者覺得轉到線上後很混亂，溝通少、截止日期變來變去；還說如果上過一年級的「大思想家」哲學課，內容大多是重複。"
    ja: "2020年の評者は、オンライン移行が混乱し連絡も少なく締切も変わったと指摘。1年次の「偉大な思想家」系哲学科目を履修済みなら内容の多くは重複するという。"
    ko: "2020년 리뷰어는 온라인 전환이 혼란스러웠고 소통이 적고 마감이 자주 바뀌었다고 함. 1학년 '위대한 사상가' 철학 과목을 들었다면 내용 상당 부분이 반복된다고 함."
    vi: "Người năm 2020 thấy chuyển sang học online rất lộn xộn, ít liên lạc, hạn nộp thay đổi; và nói nếu đã học môn triết học về các nhà tư tưởng lớn năm nhất thì phần lớn là lặp lại."
    ms: "Pengulas 2020 dapati peralihan ke dalam talian huru-hara, komunikasi kurang dan tarikh akhir berubah-ubah, serta kata kebanyakannya ulangan bagi yang sudah ambil subjek falsafah pemikir besar tahun pertama."
    id: "Pengulas 2020 merasa peralihan ke daring kacau, komunikasi minim dan tenggat berubah-ubah, serta bilang isinya banyak mengulang bagi yang sudah ambil mata kuliah filsafat pemikir besar tahun pertama."
    hi: "2020 के रिव्यूअर को ऑनलाइन बदलाव अव्यवस्थित लगा, कम संवाद और बदलती डेडलाइन; उन्होंने कहा कि पहले साल का 'बड़े विचारक' दर्शन सब्जेक्ट कर चुके लोगों के लिए यह ज़्यादातर दोहराव है।"
