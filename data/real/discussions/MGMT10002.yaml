points:
  - en: "Reviewers disagree on whether it boosts your WAM: the newest found it easy to score highly, while several earlier ones found marking harsh for a first-year subject."
    zh: "对能否拉高 WAM 意见不一：最新评价觉得很容易拿高分，而几位较早的同学觉得作为一年级课评分偏严。"
    zh-TW: "對能否拉高 WAM 意見不一：最新評價覺得很容易拿高分，而幾位較早的同學覺得以一年級課來說評分偏嚴。"
    ja: "WAMを上げられるかは意見が分かれる。最新のレビューは高得点が取りやすいとし、以前の数件は1年生科目にしては採点が厳しいと感じている。"
    ko: "WAM을 올려 주는지는 의견이 갈린다. 최신 리뷰는 고득점이 쉽다고 했고, 이전 리뷰 몇 개는 1학년 과목치고 채점이 엄하다고 했다."
    vi: "Ý kiến chia rẽ về việc có kéo WAM lên không: đánh giá mới nhất thấy dễ đạt điểm cao, còn vài đánh giá cũ thấy chấm khắt khe cho môn năm nhất."
    ms: "Pengulas tidak sependapat sama ada ia menaikkan WAM: yang terbaru dapati mudah dapat markah tinggi, manakala beberapa yang lebih awal dapati pemarkahan keras untuk subjek tahun pertama."
    id: "Pengulas berbeda pendapat soal apakah ini mendongkrak WAM: yang terbaru merasa mudah dapat nilai tinggi, sedangkan beberapa ulasan lama merasa penilaiannya keras untuk mata kuliah tahun pertama."
    hi: "क्या यह WAM बढ़ाता है, इस पर राय बंटी है: सबसे नए रिव्यू को ऊँचे अंक लाना आसान लगा, जबकि कई पुराने रिव्यूअर्स को पहले साल के विषय के हिसाब से मार्किंग सख़्त लगी।"
  - en: "Assignment marks depend a lot on which tutor marks them, a point raised in more than one review."
    zh: "不止一条评价提到，作业分数很大程度取决于由哪位助教批改。"
    zh-TW: "不只一則評價提到，作業分數很大程度取決於由哪位助教批改。"
    ja: "課題の点数は採点するチューターに大きく左右される、という指摘が複数ある。"
    ko: "과제 점수가 어느 튜터가 채점하느냐에 크게 좌우된다는 지적이 여러 리뷰에서 나왔다."
    vi: "Nhiều đánh giá nói điểm bài tập phụ thuộc nhiều vào tutor chấm bài."
    ms: "Lebih daripada satu ulasan kata markah tugasan banyak bergantung pada tutor yang menanda."
    id: "Lebih dari satu ulasan menyebut nilai tugas sangat bergantung pada tutor yang menilai."
    hi: "एक से ज़्यादा रिव्यू में कहा गया कि असाइनमेंट के अंक काफ़ी हद तक इस पर निर्भर करते हैं कि कौन-सा ट्यूटर जाँचता है।"
  - en: "Recently, lectures are compulsory but their in-class tasks are easy marks; one reviewer prepared for the exam in two days."
    zh: "最近讲座要求必须出席，但课堂小测很容易拿分；有人只花两天准备考试。"
    zh-TW: "最近講座要求必須出席，但課堂小測很容易拿分；有人只花兩天準備考試。"
    ja: "最近は講義が必須だが、講義内の課題は点が取りやすい。試験準備を2日で済ませた人も。"
    ko: "최근에는 강의 출석이 필수지만 강의 중 과제는 점수 따기 쉽다. 시험 준비를 이틀 만에 한 사람도 있다."
    vi: "Gần đây bài giảng là bắt buộc nhưng các bài làm trên lớp dễ lấy điểm; một người chỉ ôn thi trong hai ngày."
    ms: "Kebelakangan ini kuliah wajib tetapi tugasan dalam kuliah markah mudah; seorang pengulas bersedia untuk peperiksaan dalam dua hari."
    id: "Belakangan kuliah wajib dihadiri tapi tugas di kelas gampang dapat nilai; satu pengulas belajar untuk ujian hanya dua hari."
    hi: "हाल में लेक्चर अनिवार्य हैं लेकिन उनके अंदर के टास्क आसान नंबर हैं; एक रिव्यूअर ने परीक्षा की तैयारी दो दिन में की।"
  - en: "Pick your group carefully: the group assignment carries a lot of weight. Content is seen as a useful intro to management."
    zh: "小组作业占比大，要慎选组员。内容被认为是不错的管理入门。"
    zh-TW: "小組作業占比大，要慎選組員。內容被認為是不錯的管理入門。"
    ja: "グループ課題の比重が大きいのでメンバー選びは慎重に。内容は経営学の入門として役立つとされる。"
    ko: "조별 과제 비중이 크니 조원을 신중히 고르자. 내용은 유용한 경영학 입문으로 평가된다."
    vi: "Chọn nhóm cẩn thận: bài nhóm chiếm tỷ trọng lớn. Nội dung được xem là phần nhập môn quản trị hữu ích."
    ms: "Pilih kumpulan dengan teliti: tugasan berkumpulan berwajaran besar. Kandungan dianggap pengenalan pengurusan yang berguna."
    id: "Pilih kelompok dengan cermat: tugas kelompok bobotnya besar. Materinya dianggap pengantar manajemen yang berguna."
    hi: "ग्रुप सोच-समझकर चुनें: ग्रुप असाइनमेंट का वज़न ज़्यादा है। कंटेंट को मैनेजमेंट का उपयोगी परिचय माना जाता है।"
sections:
  content:
    - en: "A useful, practical intro to management that reviewers found relevant to real business situations like job interviews."
      zh: "实用的管理学入门，同学觉得和求职面试等真实商业情境很相关。"
      zh-TW: "實用的管理學入門，同學覺得和求職面試等真實商業情境很相關。"
      ja: "実用的な経営学入門で、就職面接など実際のビジネス場面に役立つという声。"
      ko: "실용적인 경영 입문으로, 취업 면접 같은 실제 비즈니스 상황과 관련이 깊다는 평."
      vi: "Nhập môn quản trị hữu ích và thực tế, người học thấy liên quan đến tình huống kinh doanh thật như phỏng vấn xin việc."
      ms: "Pengenalan pengurusan yang berguna dan praktikal, yang pengulas dapati relevan dengan situasi perniagaan sebenar seperti temu duga kerja."
      id: "Pengantar manajemen yang berguna dan praktis, yang menurut pengulas relevan dengan situasi bisnis nyata seperti wawancara kerja."
      hi: "प्रबंधन का उपयोगी और व्यावहारिक परिचय, जिसे रिव्यूअर्स ने नौकरी के इंटरव्यू जैसी असली व्यावसायिक स्थितियों से जुड़ा पाया।"
  work:
    - en: "In-lecture assessments that are easy marks, assignments including a heavily weighted group project, and an exam that has been a hurdle."
      zh: "有课堂内的小测，分数很好拿；作业里有一个占比很大的小组项目；期末曾经是 hurdle。"
      zh-TW: "有課堂內的小考，分數很好拿；作業裡有一個比重很大的小組專題；期末曾經是 hurdle。"
      ja: "点が取りやすい講義中の評価、配点の大きいグループ課題を含む課題、ハードルだったこともある期末試験。"
      ko: "점수 따기 쉬운 강의 중 평가, 비중 큰 조별 과제를 포함한 과제, 허들이었던 적도 있는 기말시험."
      vi: "Bài đánh giá ngay trong giờ giảng dễ lấy điểm, các bài tập gồm một project nhóm tỷ trọng lớn, và bài thi từng là hurdle."
      ms: "Penilaian dalam kuliah yang markahnya mudah, tugasan termasuk projek kumpulan berwajaran tinggi, dan peperiksaan yang pernah menjadi hurdle."
      id: "Penilaian di dalam kuliah yang nilainya mudah, tugas termasuk proyek kelompok berbobot besar, dan ujian yang pernah menjadi hurdle."
      hi: "लेक्चर के दौरान आसान अंक वाले मूल्यांकन, भारी वेटेज वाले ग्रुप प्रोजेक्ट समेत असाइनमेंट, और परीक्षा जो हर्डल रही है।"
  watch:
    - en: "Several reviewers say your mark depends heavily on your tutor, some of whom were unclear and marked harshly; reviewers disagree on whether it is a WAM booster."
      zh: "好几位同学说分数很看 tutor，有的 tutor 讲不清楚、给分严；能不能刷分，大家看法不一。"
      zh-TW: "好幾位同學說分數很看 tutor，有的 tutor 講不清楚、給分嚴；能不能拉分，大家看法不一。"
      ja: "成績はチューター次第という声が複数で、説明が不明確で採点の厳しいチューターもいた。WAMを上げられるかは意見が分かれる。"
      ko: "점수가 튜터에 크게 좌우된다는 의견이 여럿이고, 설명이 불분명하고 채점이 박한 튜터도 있었다. WAM을 올릴 수 있는지는 의견이 갈린다."
      vi: "Vài người nói điểm phụ thuộc nhiều vào tutor, có tutor giảng không rõ và chấm gắt; ý kiến khác nhau về việc đây có phải môn kéo WAM."
      ms: "Beberapa pengulas kata markah sangat bergantung pada tutor, ada yang kurang jelas dan menilai keras; pengulas tidak sepakat sama ada ia penaik WAM."
      id: "Beberapa pengulas bilang nilai sangat bergantung tutor, sebagian kurang jelas dan menilai keras; pengulas tidak sepakat apakah ini pendongkrak WAM."
      hi: "कई रिव्यूअर्स कहते हैं अंक काफ़ी हद तक ट्यूटर पर निर्भर हैं, जिनमें कुछ अस्पष्ट थे और सख़्ती से जाँचते थे; यह WAM बूस्टर है या नहीं, इस पर राय बँटी है।"
tags: [group-work, hurdle]
difficulty: mixed
