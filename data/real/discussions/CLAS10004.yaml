points:
  - en: "The 2023 reviewers called it challenging but rewarding: content moves fast, with tests and grammar exercises every week, so falling behind is costly."
    zh: "2023年的评论者认为它很难但很值得：进度快，每周都有测验和语法练习，一旦落后就很吃亏。"
    zh-TW: "2023年的評論者認為它很難但很值得：進度快，每週都有測驗和文法練習，一旦落後就很吃虧。"
    ja: "2023年のレビューは「難しいがやりがいがある」。進度が速く、毎週テストと文法演習があるので、遅れると挽回が大変。"
    ko: "2023년 리뷰는 어렵지만 보람 있다는 평. 진도가 빠르고 매주 시험과 문법 연습이 있어 뒤처지면 손해가 큼."
    vi: "Người đánh giá năm 2023 thấy môn khó nhưng đáng: tiến độ nhanh, tuần nào cũng có kiểm tra và bài ngữ pháp, nên tụt lại là rất thiệt."
    ms: "Pengulas 2023 menyifatkannya mencabar tetapi berbaloi: kandungan bergerak pantas, dengan ujian dan latihan tatabahasa setiap minggu, jadi ketinggalan amat merugikan."
    id: "Pengulas 2023 menyebutnya menantang tapi sepadan: materinya cepat, ada tes dan latihan tata bahasa tiap minggu, jadi tertinggal sangat merugikan."
    hi: "2023 के रिव्यूअर्स ने इसे कठिन पर फ़ायदेमंद बताया: सामग्री तेज़ी से आगे बढ़ती है, हर हफ़्ते टेस्ट और व्याकरण अभ्यास होते हैं, इसलिए पीछे रह जाना महँगा पड़ता है।"
  - en: "Attending in person matters: much of the teaching happens on the whiteboard, which is hard to follow from recordings, and you may be asked to translate on the spot."
    zh: "最好亲自到场上课：很多讲解写在白板上，看录播很难跟上，而且课上可能被点名当场翻译。"
    zh-TW: "最好親自到場上課：很多講解寫在白板上，看錄影很難跟上，而且課上可能被點名當場翻譯。"
    ja: "対面出席が大事。説明の多くはホワイトボードで行われ録画では追いにくいうえ、その場で訳すよう当てられることもある。"
    ko: "대면 출석이 중요함. 설명 대부분이 화이트보드로 이뤄져 녹화로는 따라가기 어렵고, 즉석에서 번역을 시킬 수도 있음."
    vi: "Nên đi học trực tiếp: phần lớn bài giảng viết trên bảng trắng, xem bản ghi rất khó theo, và có thể bị gọi dịch ngay tại lớp."
    ms: "Hadir secara bersemuka penting: banyak pengajaran berlaku di papan putih yang sukar diikuti melalui rakaman, dan anda mungkin diminta menterjemah serta-merta."
    id: "Hadir langsung itu penting: banyak pengajaran terjadi di papan tulis yang sulit diikuti dari rekaman, dan kamu bisa diminta menerjemahkan di tempat."
    hi: "क्लास में ख़ुद आना ज़रूरी है: ज़्यादातर पढ़ाई व्हाइटबोर्ड पर होती है जिसे रिकॉर्डिंग से समझना मुश्किल है, और आपसे मौके पर ही अनुवाद करवाया जा सकता है।"
  - en: "Views on teaching have varied: the 2015 and 2023 reviewers found it well taught, while a 2020 reviewer found explanations hard to follow. One 2023 reviewer suggested it mainly for classics majors."
    zh: "对教学的评价有过起伏：2015年和2023年的评论者觉得教得很好，而2020年有人觉得讲解难以跟上。2023年有一位建议主要适合古典学专业的学生。"
    zh-TW: "對教學的評價有過起伏：2015年和2023年的評論者覺得教得很好，而2020年有人覺得講解難以跟上。2023年有一位建議主要適合古典學主修的學生。"
    ja: "教え方の評価は年によって異なる。2015年と2023年は分かりやすいとの声、2020年は説明が追いにくいとの声。2023年の1人は主に古典学専攻向けと勧めている。"
    ko: "강의 평가는 해마다 달랐음. 2015년과 2023년엔 잘 가르친다는 평, 2020년엔 설명이 따라가기 어렵다는 평. 2023년 한 명은 주로 고전학 전공자에게 권함."
    vi: "Đánh giá về giảng dạy thay đổi theo năm: 2015 và 2023 thấy dạy tốt, còn một người năm 2020 thấy giải thích khó theo. Một người năm 2023 khuyên môn này chủ yếu hợp với sinh viên chuyên ngành cổ điển học."
    ms: "Pandangan tentang pengajaran berbeza: pengulas 2015 dan 2023 rasa ia diajar dengan baik, manakala seorang pengulas 2020 rasa penerangan sukar diikuti. Seorang pengulas 2023 mencadangkannya terutamanya untuk major klasik."
    id: "Pendapat soal pengajaran berbeda-beda: pengulas 2015 dan 2023 merasa diajar dengan baik, sementara satu pengulas 2020 merasa penjelasannya sulit diikuti. Satu pengulas 2023 menyarankannya terutama untuk jurusan klasik."
    hi: "पढ़ाने को लेकर राय बदलती रही: 2015 और 2023 के रिव्यूअर्स को यह अच्छा पढ़ाया हुआ लगा, जबकि 2020 के एक रिव्यूअर को समझाना मुश्किल लगा। 2023 के एक रिव्यूअर ने इसे मुख्य रूप से क्लासिक्स मेजर वालों के लिए सुझाया।"
difficulty: hard
workload: heavy
