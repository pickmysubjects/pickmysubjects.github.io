points:
  - en: "Three modules (biology, geology, astronomy) with lots of contact hours. Most enjoyed it as an elective."
    zh: "分生物、地质、天文三个模块，课时多；多数人作为选修很享受。"
    zh-TW: "分生物、地質、天文三個模組，上課時數多；多數人當選修修得很開心。"
    ja: "生物・地質・天文の3モジュールで、対面時間が多い。選択科目として楽しんだ人が多い。"
    ko: "생물, 지질, 천문 3개 모듈로 수업 시간이 많다. 대부분 선택 과목으로 즐겁게 들었다."
    vi: "Ba module (sinh học, địa chất, thiên văn) với nhiều giờ lên lớp. Đa số thích học như môn tự chọn."
    ms: "Tiga modul (biologi, geologi, astronomi) dengan banyak jam pertemuan. Kebanyakan seronok mengambilnya sebagai elektif."
    id: "Tiga modul (biologi, geologi, astronomi) dengan banyak jam tatap muka. Kebanyakan menikmatinya sebagai mata kuliah pilihan."
    hi: "तीन मॉड्यूल (बायोलॉजी, जियोलॉजी, एस्ट्रोनॉमी), काफ़ी कॉन्टैक्ट आवर्स। ज़्यादातर को इलेक्टिव के तौर पर अच्छा लगा।"
  - en: "The geology lectures were often seen as unstructured, and the astronomy pracs as long. Preparing before pracs saves time."
    zh: "地质课常被认为缺乏条理，天文实验较长；课前预习可省时。"
    zh-TW: "地質課常被認為缺乏條理，天文實驗較長；課前預習可省時間。"
    ja: "地質の講義はまとまりがないと見られがちで、天文の実習は長い。実習前に準備すると時間の節約になる。"
    ko: "지질 강의는 구성이 엉성하고 천문 실습은 길다는 평이 많다. 실습 전에 준비하면 시간이 절약된다."
    vi: "Bài giảng địa chất hay bị cho là thiếu cấu trúc, thực hành thiên văn thì dài. Chuẩn bị trước buổi thực hành sẽ tiết kiệm thời gian."
    ms: "Kuliah geologi sering dianggap tidak tersusun, dan amali astronomi panjang. Bersedia sebelum amali menjimatkan masa."
    id: "Kuliah geologi sering dinilai tidak terstruktur, praktikum astronomi panjang. Persiapan sebelum praktikum menghemat waktu."
    hi: "जियोलॉजी लेक्चर अक्सर बेतरतीब और एस्ट्रोनॉमी प्रैक लंबे माने गए। प्रैक से पहले तैयारी समय बचाती है।"
  - en: "Exam views are split: one found a new exam very hard (with scaling), while a later one found it easy, with repeated past questions."
    zh: "考试评价不一：有人觉得新版考试很难（有调分），后来有人称简单且重复往年题。"
    zh-TW: "考試評價不一：有人覺得新版考試很難（有調分），後來有人說簡單且重複考古題。"
    ja: "試験の評価は分かれる。新形式の試験はとても難しかった（得点調整あり）という人がいる一方、後の人は過去問の使い回しで簡単だったという。"
    ko: "시험 의견은 갈린다. 새 시험이 매우 어려웠다(점수 조정 있음)는 후기도, 나중엔 기출이 반복돼 쉬웠다는 후기도 있다."
    vi: "Ý kiến về thi trái chiều: một người thấy đề mới rất khó (có scaling), người sau lại thấy dễ, lặp lại câu cũ."
    ms: "Pandangan tentang peperiksaan berbelah: seorang dapati peperiksaan baharu sangat sukar (dengan penskalaan), seorang lagi kemudian dapati mudah, dengan soalan lepas berulang."
    id: "Pendapat soal ujian terbelah: satu menilai ujian baru sangat sulit (ada scaling), yang berikutnya menilai mudah, dengan soal lama yang berulang."
    hi: "एग्ज़ाम पर राय बँटी: एक को नया एग्ज़ाम बहुत कठिन लगा (स्केलिंग के साथ), बाद वाले को आसान, पुराने सवाल दोहराए गए।"
difficulty: mixed
