reviews: 6
from: 2018
to: 2024
checked: 2026-10-08
points:
  - en: "Three modules (biology, geology, astronomy) with lots of contact hours. Most enjoyed it as an elective."
    zh: "分生物、地质、天文三个模块，课时多；多数人作为选修很享受。"
    zh-TW: "分生物、地質、天文三個模組，上課時數多；多數人當選修修得很開心。"
    ja: "生物・地質・天文の3モジュールで、対面時間が多い。選択科目として楽しんだ人が多い。"
    ko: "생물, 지질, 천문 3개 모듈로 수업 시간이 많다. 대부분 선택 과목으로 즐겁게 들었다."
    vi: "Ba module (sinh học, địa chất, thiên văn) với nhiều giờ lên lớp. Đa số thích học như môn tự chọn."
    ms: "Tiga modul (biologi, geologi, astronomi) dengan banyak jam pertemuan. Kebanyakan seronok mengambilnya sebagai elektif."
    id: "Tiga modul (biologi, geologi, astronomi) dengan banyak jam tatap muka. Kebanyakan menikmatinya sebagai mata kuliah pilihan."
    hi: "तीन मॉड्यूल (बायोलॉजी, जियोलॉजी, एस्ट्रोनॉमी), काफ़ी कॉन्टैक्ट आवर्स। ज़्यादातर को इलेक्टिव के तौर पर अच्छा लगा।"
  - en: "The geology lectures were often seen as unstructured, and the astronomy pracs as long. Preparing before pracs saves time."
    zh: "地质课常被认为缺乏条理，天文实验较长；课前预习可省时。"
    zh-TW: "地質課常被認為缺乏條理，天文實驗較長；課前預習可省時間。"
    ja: "地質の講義はまとまりがないと見られがちで、天文の実習は長い。実習前に準備すると時間の節約になる。"
    ko: "지질 강의는 구성이 엉성하고 천문 실습은 길다는 평이 많다. 실습 전에 준비하면 시간이 절약된다."
    vi: "Bài giảng địa chất hay bị cho là thiếu cấu trúc, thực hành thiên văn thì dài. Chuẩn bị trước buổi thực hành sẽ tiết kiệm thời gian."
    ms: "Kuliah geologi sering dianggap tidak tersusun, dan amali astronomi panjang. Bersedia sebelum amali menjimatkan masa."
    id: "Kuliah geologi sering dinilai tidak terstruktur, praktikum astronomi panjang. Persiapan sebelum praktikum menghemat waktu."
    hi: "जियोलॉजी लेक्चर अक्सर बेतरतीब और एस्ट्रोनॉमी प्रैक लंबे माने गए। प्रैक से पहले तैयारी समय बचाती है।"
  - en: "Exam views are split: one found a new exam very hard (with scaling), while a later one found it easy, with repeated past questions."
    zh: "考试评价不一：有人觉得新版考试很难（有调分），后来有人称简单且重复往年题。"
    zh-TW: "考試評價不一：有人覺得新版考試很難（有調分），後來有人說簡單且重複考古題。"
    ja: "試験の評価は分かれる。新形式の試験はとても難しかった（得点調整あり）という人がいる一方、後の人は過去問の使い回しで簡単だったという。"
    ko: "시험 의견은 갈린다. 새 시험이 매우 어려웠다(점수 조정 있음)는 후기도, 나중엔 기출이 반복돼 쉬웠다는 후기도 있다."
    vi: "Ý kiến về thi trái chiều: một người thấy đề mới rất khó (có scaling), người sau lại thấy dễ, lặp lại câu cũ."
    ms: "Pandangan tentang peperiksaan berbelah: seorang dapati peperiksaan baharu sangat sukar (dengan penskalaan), seorang lagi kemudian dapati mudah, dengan soalan lepas berulang."
    id: "Pendapat soal ujian terbelah: satu menilai ujian baru sangat sulit (ada scaling), yang berikutnya menilai mudah, dengan soal lama yang berulang."
    hi: "एग्ज़ाम पर राय बँटी: एक को नया एग्ज़ाम बहुत कठिन लगा (स्केलिंग के साथ), बाद वाले को आसान, पुराने सवाल दोहराए गए।"
sections:
  content:
    - en: "Three modules, biology, astronomy and geology, which reviewers felt flowed well together. No geology or astronomy background is needed; most found the lecturers engaging."
      zh: "分三个模块：生物、天文和地质，同学觉得衔接得不错。不需要地质或天文基础；多数人觉得老师讲得吸引人。"
      zh-TW: "分三個模組：生物、天文和地質，同學覺得銜接得不錯。不需要地質或天文基礎；多數人覺得老師講得吸引人。"
      ja: "生物、天文、地質の3モジュールで、うまくつながっているという声。地質や天文の予備知識は不要で、講師は面白いという声が多い。"
      ko: "생물, 천문, 지질 세 모듈로 잘 이어진다는 평. 지질이나 천문 배경은 필요 없고, 대부분 강사가 흥미롭다고 했다."
      vi: "Ba phần: sinh học, thiên văn và địa chất, người học thấy nối với nhau tốt. Không cần nền địa chất hay thiên văn; đa số thấy giảng viên cuốn hút."
      ms: "Tiga modul, biologi, astronomi dan geologi, yang pengulas rasa bersambung dengan baik. Tiada latar geologi atau astronomi diperlukan; kebanyakan rasa pensyarah menarik."
      id: "Tiga modul, biologi, astronomi dan geologi, yang menurut pengulas nyambung dengan baik. Tidak perlu latar geologi atau astronomi; kebanyakan merasa dosennya menarik."
      hi: "तीन मॉड्यूल, जीव विज्ञान, खगोल विज्ञान और भूविज्ञान, जो रिव्यूअर्स को अच्छी तरह जुड़े लगे। भूविज्ञान या खगोल का बैकग्राउंड ज़रूरी नहीं; ज़्यादातर को लेक्चरर दिलचस्प लगे।"
  work:
    - en: "Weekly pracs for each module, a poster assignment and a final exam. Astronomy pracs can be long and confusing; reviewers split on the exam, from very hard in 2023 to largely repeated from past papers in 2024."
      zh: "每个模块都有每周实验课，还有一个海报作业和期末。天文实验可能又长又绕；对期末看法不一，2023 年有人觉得极难，2024 年有人说大多是往年原题。"
      zh-TW: "每個模組都有每週實驗課，還有一個海報作業和期末。天文實驗可能又長又繞；對期末看法分歧，2023 年有人覺得極難，2024 年有人說大多是考古題原題。"
      ja: "各モジュールの毎週の実習、ポスター課題、期末試験。天文の実習は長く分かりにくいことも。期末の評価は割れ、2023年は非常に難しかったという声、2024年は過去問の使い回しが多かったという声。"
      ko: "모듈마다 주간 실습, 포스터 과제, 기말시험이 있다. 천문 실습은 길고 헷갈릴 수 있다. 기말은 2023년엔 매우 어려웠다는 평, 2024년엔 대부분 기출 반복이었다는 평으로 갈린다."
      vi: "Mỗi phần có buổi thực hành hằng tuần, một bài poster và thi cuối kỳ. Thực hành thiên văn có thể dài và rối; ý kiến về bài thi khác nhau, năm 2023 thấy rất khó, năm 2024 thấy phần lớn lặp lại đề cũ."
      ms: "Amali mingguan untuk setiap modul, tugasan poster dan peperiksaan akhir. Amali astronomi boleh panjang dan mengelirukan; pandangan tentang peperiksaan berbeza, sangat sukar pada 2023 hingga kebanyakan diulang daripada kertas lepas pada 2024."
      id: "Praktikum mingguan tiap modul, tugas poster dan ujian akhir. Praktikum astronomi bisa panjang dan membingungkan; pendapat soal ujian terbelah, sangat sulit di 2023 sampai kebanyakan mengulang soal lama di 2024."
      hi: "हर मॉड्यूल के साप्ताहिक प्रैक, एक पोस्टर असाइनमेंट और फ़ाइनल परीक्षा। खगोल वाले प्रैक लंबे और उलझाने वाले हो सकते हैं; परीक्षा पर राय बँटी है, 2023 में बहुत कठिन से 2024 में ज़्यादातर पुराने पेपर से दोहराए सवालों तक।"
  study:
    - en: "Prepare for the astronomy pracs beforehand so you finish faster, use the recommended course book for geology, and look at past exams."
      zh: "天文实验提前预习，可以做得更快；地质部分用推荐的课本；多看往年试卷。"
      zh-TW: "天文實驗提前預習，可以做得更快；地質部分用推薦的課本；多看考古題。"
      ja: "天文の実習は事前に準備しておくと早く終わる。地質は推奨の教科書を使い、過去問にも目を通す。"
      ko: "천문 실습은 미리 준비하면 빨리 끝난다. 지질은 추천 교재를 쓰고 기출을 살펴보라."
      vi: "Chuẩn bị trước cho buổi thực hành thiên văn để làm nhanh hơn, dùng sách giáo trình được giới thiệu cho phần địa chất, và xem đề thi cũ."
      ms: "Bersedia sebelum amali astronomi supaya cepat siap, guna buku kursus yang disyorkan untuk geologi, dan lihat kertas lepas."
      id: "Siapkan praktikum astronomi sebelumnya agar cepat selesai, pakai buku yang direkomendasikan untuk geologi, dan lihat soal ujian lama."
      hi: "खगोल प्रैक की पहले से तैयारी करें ताकि जल्दी ख़त्म हो, भूविज्ञान के लिए सुझाई गई किताब का उपयोग करें, और पुराने पेपर देखें।"
  watch:
    - en: "Several reviewers found the geology lectures disorganised, with picture-heavy slides that make it hard to know what matters, and one found assessments harshly marked."
      zh: "好几位同学觉得地质部分讲课没条理，PPT 多是图片，很难知道重点；有同学觉得作业给分严。"
      zh-TW: "好幾位同學覺得地質部分上課沒條理，投影片多是圖片，很難知道重點；有同學覺得作業給分嚴。"
      ja: "地質の講義はまとまりがなく、スライドが写真中心で何が重要か分かりにくいという声が複数。評価の採点が厳しかったという声も一つ。"
      ko: "여러 명이 지질 강의가 산만하고 슬라이드가 사진 위주라 무엇이 중요한지 알기 어렵다고 했다. 평가 채점이 박했다는 리뷰어도 있다."
      vi: "Vài người thấy bài giảng địa chất lộn xộn, slide chủ yếu là hình nên khó biết đâu là trọng tâm, và một người thấy bài đánh giá chấm gắt."
      ms: "Beberapa pengulas dapati kuliah geologi tidak teratur, dengan slaid penuh gambar yang menyukarkan mengetahui apa yang penting, dan seorang rasa penilaian dinilai keras."
      id: "Beberapa pengulas merasa kuliah geologi berantakan, dengan slide penuh gambar yang menyulitkan tahu mana yang penting, dan satu merasa penilaiannya keras."
      hi: "कई रिव्यूअर्स को भूविज्ञान के लेक्चर अव्यवस्थित लगे, तस्वीरों भरी स्लाइड से समझना मुश्किल कि क्या ज़रूरी है, और एक को मूल्यांकन की मार्किंग सख़्त लगी।"
tags: [practice-repeats]
difficulty: mixed
