reviews: 9
from: 2015
to: 2025
checked: 2026-10-17
points:
  - en: "Since about 2018 it stresses big-picture understanding and skills like writing, debate and data graphics, across four blocks: metabolic syndrome, stem cells, respiratory and mental health."
    zh: "约从2018年起，这门课注重宏观理解和毕业生技能（面向不同读者的写作、辩论、数据图表），分四个模块：代谢综合征、干细胞、呼吸健康和心理健康。"
    zh-TW: "約從2018年起，這門課注重宏觀理解和畢業生技能（面向不同讀者的寫作、辯論、數據圖表），分四個模組：代謝症候群、幹細胞、呼吸健康和心理健康。"
    ja: "2018年頃から全体像の理解と卒業生スキル（読者別の文章、ディベート、データ図表）重視。代謝症候群・幹細胞・呼吸器の健康・メンタルヘルスの4ブロック。"
    ko: "2018년경부터 큰 그림 이해와 졸업생 역량(독자별 글쓰기, 토론, 데이터 그래픽)에 중점. 대사증후군·줄기세포·호흡기 건강·정신건강 4개 블록."
    vi: "Từ khoảng 2018, môn tập trung vào hiểu bức tranh tổng thể và kỹ năng tốt nghiệp (viết cho nhiều đối tượng, tranh biện, biểu đồ dữ liệu) qua bốn phần: hội chứng chuyển hóa, tế bào gốc, sức khỏe hô hấp và sức khỏe tâm thần."
    ms: "Sejak kira-kira 2018 ia fokus pada pemahaman gambaran besar dan kemahiran graduan (menulis untuk pelbagai khalayak, debat, grafik data) dalam empat blok: sindrom metabolik, sel stem, kesihatan pernafasan dan kesihatan mental."
    id: "Sejak sekitar 2018 fokusnya pemahaman gambaran besar dan keterampilan lulusan (menulis untuk berbagai pembaca, debat, grafik data) dalam empat blok: sindrom metabolik, sel punca, kesehatan pernapasan dan kesehatan mental."
    hi: "लगभग 2018 से यह बड़ी तस्वीर की समझ और ग्रेजुएट स्किल (अलग पाठकों के लिए लेखन, डिबेट, डेटा ग्राफ़िक्स) पर केंद्रित है, चार ब्लॉक में: मेटाबॉलिक सिंड्रोम, स्टेम सेल, श्वसन स्वास्थ्य और मानसिक स्वास्थ्य।"
  - en: "Recent reviewers (2023-2025) found it more manageable than other Biomed cores. The MST and exam are open book, so detailed printed notes from each lecture help."
    zh: "近年评论者（2023-2025）觉得比其他生物医学核心课好应付。小测和考试都是开卷，所以每讲做详细的打印笔记很有帮助。"
    zh-TW: "近年評論者（2023-2025）覺得比其他生醫核心課好應付。小考和考試都是開書，所以每講做詳細的列印筆記很有幫助。"
    ja: "最近のレビュー（2023-2025）では他のBiomed必修より取り組みやすいとされた。MSTと試験は持ち込み可なので、講義ごとの詳しい印刷ノートが役立つ。"
    ko: "최근 리뷰(2023-2025)는 다른 Biomed 필수과목보다 수월하다고 함. MST와 시험이 오픈북이라 강의별 자세한 인쇄 노트가 도움이 됨."
    vi: "Người đánh giá gần đây (2023-2025) thấy môn dễ thở hơn các môn lõi Biomed khác. MST và thi cuối kỳ được mở tài liệu, nên ghi chú in chi tiết từng bài giảng rất hữu ích."
    ms: "Pengulas terkini (2023-2025) dapati ia lebih mudah diurus berbanding teras Biomed lain. MST dan peperiksaan buku terbuka, jadi nota bercetak terperinci setiap kuliah membantu."
    id: "Pengulas terbaru (2023-2025) merasa lebih mudah dikelola dibanding inti Biomed lainnya. MST dan ujian open book, jadi catatan cetak rinci tiap kuliah sangat membantu."
    hi: "हाल के रिव्यूअर्स (2023-2025) को यह बाकी Biomed कोर से आसान लगा। MST और एग्ज़ाम ओपन बुक हैं, इसलिए हर लेक्चर के विस्तृत प्रिंटेड नोट्स मदद करते हैं।"
  - en: "The graphical analysis assignment takes the most time; other tasks like the debate and peer marking were called easy marks. Some later blocks felt less organised."
    zh: "图表分析作业最耗时；辩论和互评等其他任务被认为是容易拿的分。后面几个模块有人觉得组织得不太好。"
    zh-TW: "圖表分析作業最耗時；辯論和互評等其他任務被認為是容易拿的分。後面幾個模組有人覺得組織得不太好。"
    ja: "図表分析課題が最も時間がかかる。ディベートや相互採点など他の課題は取りやすい点とされた。後半のブロックはまとまりに欠けると感じた人もいた。"
    ko: "그래프 분석 과제가 가장 시간이 걸림. 토론, 동료 채점 같은 다른 과제는 쉬운 점수라는 평. 후반 블록은 덜 정리됐다는 의견도 있음."
    vi: "Bài phân tích biểu đồ tốn thời gian nhất; các phần khác như tranh biện và chấm chéo được coi là điểm dễ. Một số phần sau bị cho là kém tổ chức."
    ms: "Tugasan analisis grafik paling memakan masa; tugasan lain seperti debat dan penilaian rakan dianggap markah mudah. Sesetengah blok kemudian terasa kurang teratur."
    id: "Tugas analisis grafik paling memakan waktu; tugas lain seperti debat dan penilaian sejawat dianggap nilai mudah. Beberapa blok akhir terasa kurang tertata."
    hi: "ग्राफ़िकल एनालिसिस असाइनमेंट में सबसे ज़्यादा समय लगता है; डिबेट और पीयर मार्किंग जैसे बाकी काम आसान अंक बताए गए। बाद के कुछ ब्लॉक कम व्यवस्थित लगे।"
  - en: "Older reviews (2015-2016) called it confusing and poorly run, but later reviewers say it has improved a lot."
    zh: "较早的评论（2015-2016）说课程混乱、组织差，但之后的评论者认为已大有改善。"
    zh-TW: "較早的評論（2015-2016）說課程混亂、組織差，但之後的評論者認為已大有改善。"
    ja: "古いレビュー（2015-2016）は混乱していて運営が悪いとしたが、その後のレビューでは大きく改善したという。"
    ko: "예전 리뷰(2015-2016)는 혼란스럽고 운영이 부실하다고 했지만, 이후 리뷰어들은 많이 나아졌다고 함."
    vi: "Đánh giá cũ (2015-2016) nói môn rối và tổ chức kém, nhưng người đánh giá sau này cho biết đã cải thiện nhiều."
    ms: "Ulasan lama (2015-2016) kata ia mengelirukan dan kurang teratur, tetapi pengulas kemudian kata ia banyak bertambah baik."
    id: "Ulasan lama (2015-2016) menyebutnya membingungkan dan buruk pengelolaannya, tapi pengulas berikutnya bilang sudah jauh membaik."
    hi: "पुराने रिव्यू (2015-2016) ने इसे उलझा हुआ और ख़राब ढंग से चलाया गया बताया, पर बाद के रिव्यूअर्स कहते हैं कि यह काफ़ी सुधरा है।"
sections:
  content:
    - en: "Four blocks: metabolic syndrome, stem cells, respiratory health and mental health, taught from biological, public health and ethical angles. It values big-picture integration over fine detail."
      zh: "四个板块：代谢综合征、干细胞、呼吸健康和心理健康，从生物、公共卫生和伦理多角度讲。重在整合大局，而不是抠细节。"
      zh-TW: "四個單元：代謝症候群、幹細胞、呼吸健康和心理健康，從生物、公衛和倫理多角度講。重在整合全局，而不是摳細節。"
      ja: "代謝症候群、幹細胞、呼吸器の健康、メンタルヘルスの4ブロックを生物学・公衆衛生・倫理の観点から学ぶ。細部より全体像の統合を重視。"
      ko: "대사증후군, 줄기세포, 호흡기 건강, 정신 건강 네 블록을 생물학·공중보건·윤리 관점에서 다룬다. 세부보다 큰 그림의 통합을 중시한다."
      vi: "Bốn phần: hội chứng chuyển hóa, tế bào gốc, sức khỏe hô hấp và sức khỏe tâm thần, dạy từ góc độ sinh học, y tế công cộng và đạo đức. Chú trọng tổng hợp bức tranh lớn hơn chi tiết."
      ms: "Empat blok: sindrom metabolik, sel stem, kesihatan pernafasan dan kesihatan mental, dari sudut biologi, kesihatan awam dan etika. Ia mementingkan integrasi gambaran besar berbanding butiran halus."
      id: "Empat blok: sindrom metabolik, sel punca, kesehatan pernapasan dan kesehatan mental, dari sudut biologi, kesehatan masyarakat dan etika. Lebih menekankan integrasi gambaran besar daripada detail."
      hi: "चार ब्लॉक: मेटाबॉलिक सिंड्रोम, स्टेम सेल, श्वसन स्वास्थ्य और मानसिक स्वास्थ्य, जैविक, जन-स्वास्थ्य और नैतिक नज़रिए से। बारीकियों से ज़्यादा बड़ी तस्वीर जोड़ने पर ज़ोर।"
  work:
    - en: "Skill-building tasks: writing for different audiences, a group debate, peer marking and a graphical report, plus open-book MST and exam with integrative extended answers."
      zh: "以能力培养为主的作业：针对不同读者写作、小组辩论、同伴评分和图表报告；另有开卷 MST 和期末，长答题要求融会贯通。"
      zh-TW: "以能力培養為主的作業：針對不同讀者寫作、小組辯論、同儕評分和圖表報告；另有開書 MST 和期末，長答題要求融會貫通。"
      ja: "スキル養成型の課題（読者に合わせた文章、グループ討論、相互採点、図表レポート）と、統合的な長文記述があるオープンブックのMSTと期末試験。"
      ko: "독자별 글쓰기, 조별 토론, 동료 채점, 그래픽 보고서 같은 역량 과제와, 통합적 서술형이 있는 오픈북 MST와 기말이 있다."
      vi: "Các bài rèn kỹ năng: viết cho nhiều đối tượng, tranh luận nhóm, chấm chéo và báo cáo đồ họa, cùng MST và thi cuối kỳ mở tài liệu với câu trả lời dài cần tổng hợp."
      ms: "Tugasan membina kemahiran: menulis untuk khalayak berbeza, debat kumpulan, penilaian rakan dan laporan grafik, serta MST dan peperiksaan buku terbuka dengan jawapan panjang yang integratif."
      id: "Tugas pengembangan keterampilan: menulis untuk audiens berbeda, debat kelompok, penilaian sejawat dan laporan grafis, plus MST dan ujian open book dengan jawapan panjang yang integratif."
      hi: "कौशल बढ़ाने वाले काम: अलग-अलग पाठकों के लिए लेखन, ग्रुप डिबेट, साथियों की मार्किंग और ग्राफ़िकल रिपोर्ट, साथ में ओपन-बुक MST और परीक्षा जिनमें जोड़कर लिखे लंबे उत्तर चाहिए।"
  study:
    - en: "Write detailed notes from each lecture through the semester to bring into the open-book exams, and practise linking ideas across lectures."
      zh: "整个学期把每节课的笔记记详细，开卷考试时带进去；多练习把不同课的内容串起来。"
      zh-TW: "整學期把每堂課的筆記記詳細，開書考試時帶進去；多練習把不同課的內容串起來。"
      ja: "学期を通して各講義の詳しいノートを作り、オープンブック試験に持ち込む。講義をまたいで考えをつなげる練習を。"
      ko: "학기 내내 강의별로 자세한 노트를 만들어 오픈북 시험에 가져가고, 강의 간 내용을 연결하는 연습을 하라."
      vi: "Ghi chép chi tiết từng bài giảng suốt kỳ để mang vào bài thi mở tài liệu, và luyện liên kết ý giữa các bài giảng."
      ms: "Tulis nota terperinci bagi setiap kuliah sepanjang semester untuk dibawa ke peperiksaan buku terbuka, dan latih menghubungkan idea antara kuliah."
      id: "Buat catatan rinci tiap kuliah sepanjang semester untuk dibawa ke ujian open book, dan latih menghubungkan ide antarkuliah."
      hi: "पूरे सेमेस्टर हर लेक्चर के विस्तृत नोट्स बनाएँ ताकि ओपन-बुक परीक्षा में ले जा सकें, और लेक्चरों के बीच विचार जोड़ने का अभ्यास करें।"
  watch:
    - en: "Reviewers found some blocks better taught than others and the extended answers challenging; assignment marks depend on your tutor, and one said the debate was marked unevenly."
      zh: "同学觉得有些板块讲得比别的好，长答题有难度；作业分数看 tutor，有同学说辩论的评分标准不一致。"
      zh-TW: "同學覺得有些單元教得比其他好，長答題有難度；作業分數看 tutor，有同學說辯論的評分標準不一致。"
      ja: "ブロックによって教え方の質に差があり、長文記述は難しいという声。課題の点数はチューター次第で、討論の採点にばらつきがあったという声も一つ。"
      ko: "블록마다 수업 질이 다르고 서술형이 어렵다는 평. 과제 점수는 튜터에 좌우되며, 토론 채점이 들쭉날쭉했다는 리뷰어도 있다."
      vi: "Người học thấy có phần dạy tốt hơn phần khác và câu trả lời dài khá khó; điểm bài tập tùy tutor, một người nói phần tranh luận chấm không đồng đều."
      ms: "Pengulas dapati sesetengah blok diajar lebih baik daripada yang lain dan jawapan panjang mencabar; markah tugasan bergantung tutor, dan seorang kata debat dinilai tidak sekata."
      id: "Pengulas merasa sebagian blok diajarkan lebih baik dari yang lain dan jawaban panjangnya menantang; nilai tugas tergantung tutor, dan satu pengulas bilang debat dinilai tidak merata."
      hi: "रिव्यूअर्स को कुछ ब्लॉक बाक़ियों से बेहतर पढ़ाए गए लगे और लंबे उत्तर चुनौतीपूर्ण; असाइनमेंट के अंक ट्यूटर पर निर्भर हैं, और एक ने कहा डिबेट की मार्किंग असमान थी।"
tags: [group-work]
