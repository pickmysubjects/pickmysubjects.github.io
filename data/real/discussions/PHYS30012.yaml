points:
  - en: "The weekly quizzes are fairly easy marks. The exam is lightly weighted and some found it simple, so an H1 is seen as achievable."
    zh: "每周测验比较容易拿分，期末权重低、部分人觉得简单，H1被认为可以拿到。"
    zh-TW: "每週測驗比較容易拿分，期末權重低、部分人覺得簡單，H1被認為可以拿到。"
    ja: "毎週の小テストは比較的点が取りやすいです。期末試験の配点は小さく簡単だという人もいるので、H1は狙えると見られています。"
    ko: "매주 퀴즈는 점수 따기 쉬운 편입니다. 시험 비중이 낮고 쉽다는 사람도 있어 H1이 가능하다고 봅니다."
    vi: "Quiz hằng tuần khá dễ lấy điểm. Bài thi tỷ trọng thấp và một số người thấy đơn giản, nên H1 được xem là khả thi."
    ms: "Kuiz mingguan agak mudah dapat markah. Peperiksaan berwajaran rendah dan ada yang rasa mudah, jadi H1 dilihat boleh dicapai."
    id: "Kuis mingguan cukup mudah dapat nilai. Bobot ujiannya kecil dan sebagian merasa mudah, jadi H1 dianggap bisa diraih."
    hi: "वीकली क्विज़ में मार्क्स आसानी से मिलते हैं। एग्ज़ाम का वेटेज कम है और कुछ को आसान लगा, इसलिए H1 संभव माना जाता है।"
  - en: "Feedback on the lay assignment and group project often arrives only after the semester or exam, and those tasks were marked more harshly."
    zh: "科普作业和小组项目的反馈常在学期或考试后才发，且评分偏严。"
    zh-TW: "科普作業和小組專題的回饋常在學期或考試後才發，且評分偏嚴。"
    ja: "一般向け課題とグループ課題のフィードバックは学期後や試験後に来ることが多く、採点も厳しめでした。"
    ko: "일반인 대상 과제와 조별 프로젝트 피드백은 학기나 시험이 끝난 뒤에야 오는 경우가 많고, 채점도 더 엄격했습니다."
    vi: "Phản hồi cho bài viết phổ thông và dự án nhóm thường chỉ có sau khi hết học kỳ hoặc thi, và các bài này bị chấm gắt hơn."
    ms: "Maklum balas tugasan orang awam dan projek kumpulan selalunya hanya tiba selepas semester atau peperiksaan, dan tugasan itu dimarkah lebih ketat."
    id: "Feedback untuk tugas tulisan populer dan proyek kelompok sering baru datang setelah semester atau ujian, dan tugas itu dinilai lebih ketat."
    hi: "लेय असाइनमेंट और ग्रुप प्रोजेक्ट का फीडबैक अक्सर सेमेस्टर या एग्ज़ाम के बाद ही आता है, और इनकी मार्किंग ज़्यादा सख्त थी।"
  - en: "Some topics, like altitude, diving and thermoregulation, felt dry. Opinions on the subject overall are split."
    zh: "部分主题（如高原、潜水、体温调节）较枯燥，整体评价不一。"
    zh-TW: "部分主題（如高原、潛水、體溫調節）較枯燥，整體評價不一。"
    ja: "高地、潜水、体温調節などのテーマは退屈に感じた人もいます。科目全体の評価は分かれています。"
    ko: "고도, 잠수, 체온 조절 같은 주제는 지루했다는 의견이 있습니다. 과목 전반의 평가는 갈립니다."
    vi: "Một số chủ đề như độ cao, lặn và điều hòa thân nhiệt khá khô khan. Ý kiến về môn nhìn chung trái chiều."
    ms: "Sesetengah topik seperti altitud, menyelam dan termoregulasi terasa kering. Pendapat keseluruhan tentang subjek ini berbelah bahagi."
    id: "Beberapa topik seperti ketinggian, menyelam, dan termoregulasi terasa membosankan. Pendapat soal mata kuliah ini terbelah."
    hi: "ऊँचाई, डाइविंग और थर्मोरेगुलेशन जैसे कुछ टॉपिक्स नीरस लगे। सब्जेक्ट पर कुल मिलाकर राय बँटी है।"
  - en: "For the group presentation, start early, meet regularly and set firm deadlines."
    zh: "小组展示要尽早开始，定期碰面并设定明确截止时间。"
    zh-TW: "小組報告要儘早開始，定期碰面並設定明確截止時間。"
    ja: "グループ発表は早めに始め、定期的に集まり、締め切りをしっかり決めましょう。"
    ko: "조별 발표는 일찍 시작하고 정기적으로 만나며 확실한 마감을 정하세요."
    vi: "Với bài thuyết trình nhóm, hãy bắt đầu sớm, họp đều đặn và đặt hạn chót rõ ràng."
    ms: "Untuk pembentangan kumpulan, mula awal, berjumpa secara berkala dan tetapkan tarikh akhir yang tegas."
    id: "Untuk presentasi kelompok, mulai lebih awal, rutin bertemu, dan tetapkan tenggat yang jelas."
    hi: "ग्रुप प्रेज़ेंटेशन के लिए जल्दी शुरू करें, नियमित मिलें और पक्की डेडलाइन तय करें।"
difficulty: easy
