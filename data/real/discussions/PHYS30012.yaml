from: 2021
to: 2025
checked: 2026-10-08
points:
  - en: "The weekly quizzes are fairly easy marks. The exam is lightly weighted and some found it simple, so an H1 is seen as achievable."
    zh: "每周测验比较容易拿分，期末权重低、部分人觉得简单，H1被认为可以拿到。"
    zh-TW: "每週測驗比較容易拿分，期末權重低、部分人覺得簡單，H1被認為可以拿到。"
    ja: "毎週の小テストは比較的点が取りやすいです。期末試験の配点は小さく簡単だという人もいるので、H1は狙えると見られています。"
    ko: "매주 퀴즈는 점수 따기 쉬운 편입니다. 시험 비중이 낮고 쉽다는 사람도 있어 H1이 가능하다고 봅니다."
    vi: "Quiz hằng tuần khá dễ lấy điểm. Bài thi tỷ trọng thấp và một số người thấy đơn giản, nên H1 được xem là khả thi."
    ms: "Kuiz mingguan agak mudah dapat markah. Peperiksaan berwajaran rendah dan ada yang rasa mudah, jadi H1 dilihat boleh dicapai."
    id: "Kuis mingguan cukup mudah dapat nilai. Bobot ujiannya kecil dan sebagian merasa mudah, jadi H1 dianggap bisa diraih."
    hi: "वीकली क्विज़ में मार्क्स आसानी से मिलते हैं। एग्ज़ाम का वेटेज कम है और कुछ को आसान लगा, इसलिए H1 संभव माना जाता है।"
  - en: "Feedback on the lay assignment and group project often arrives only after the semester or exam, and those tasks were marked more harshly."
    zh: "科普作业和小组项目的反馈常在学期或考试后才发，且评分偏严。"
    zh-TW: "科普作業和小組專題的回饋常在學期或考試後才發，且評分偏嚴。"
    ja: "一般向け課題とグループ課題のフィードバックは学期後や試験後に来ることが多く、採点も厳しめでした。"
    ko: "일반인 대상 과제와 조별 프로젝트 피드백은 학기나 시험이 끝난 뒤에야 오는 경우가 많고, 채점도 더 엄격했습니다."
    vi: "Phản hồi cho bài viết phổ thông và dự án nhóm thường chỉ có sau khi hết học kỳ hoặc thi, và các bài này bị chấm gắt hơn."
    ms: "Maklum balas tugasan orang awam dan projek kumpulan selalunya hanya tiba selepas semester atau peperiksaan, dan tugasan itu dimarkah lebih ketat."
    id: "Feedback untuk tugas tulisan populer dan proyek kelompok sering baru datang setelah semester atau ujian, dan tugas itu dinilai lebih ketat."
    hi: "लेय असाइनमेंट और ग्रुप प्रोजेक्ट का फीडबैक अक्सर सेमेस्टर या एग्ज़ाम के बाद ही आता है, और इनकी मार्किंग ज़्यादा सख्त थी।"
  - en: "Some topics, like altitude, diving and thermoregulation, felt dry. Opinions on the subject overall are split."
    zh: "部分主题（如高原、潜水、体温调节）较枯燥，整体评价不一。"
    zh-TW: "部分主題（如高原、潛水、體溫調節）較枯燥，整體評價不一。"
    ja: "高地、潜水、体温調節などのテーマは退屈に感じた人もいます。科目全体の評価は分かれています。"
    ko: "고도, 잠수, 체온 조절 같은 주제는 지루했다는 의견이 있습니다. 과목 전반의 평가는 갈립니다."
    vi: "Một số chủ đề như độ cao, lặn và điều hòa thân nhiệt khá khô khan. Ý kiến về môn nhìn chung trái chiều."
    ms: "Sesetengah topik seperti altitud, menyelam dan termoregulasi terasa kering. Pendapat keseluruhan tentang subjek ini berbelah bahagi."
    id: "Beberapa topik seperti ketinggian, menyelam, dan termoregulasi terasa membosankan. Pendapat soal mata kuliah ini terbelah."
    hi: "ऊँचाई, डाइविंग और थर्मोरेगुलेशन जैसे कुछ टॉपिक्स नीरस लगे। सब्जेक्ट पर कुल मिलाकर राय बँटी है।"
  - en: "For the group presentation, start early, meet regularly and set firm deadlines."
    zh: "小组展示要尽早开始，定期碰面并设定明确截止时间。"
    zh-TW: "小組報告要儘早開始，定期碰面並設定明確截止時間。"
    ja: "グループ発表は早めに始め、定期的に集まり、締め切りをしっかり決めましょう。"
    ko: "조별 발표는 일찍 시작하고 정기적으로 만나며 확실한 마감을 정하세요."
    vi: "Với bài thuyết trình nhóm, hãy bắt đầu sớm, họp đều đặn và đặt hạn chót rõ ràng."
    ms: "Untuk pembentangan kumpulan, mula awal, berjumpa secara berkala dan tetapkan tarikh akhir yang tegas."
    id: "Untuk presentasi kelompok, mulai lebih awal, rutin bertemu, dan tetapkan tenggat yang jelas."
    hi: "ग्रुप प्रेज़ेंटेशन के लिए जल्दी शुरू करें, नियमित मिलें और पक्की डेडलाइन तय करें।"
sections:
  content:
    - en: "How the body adapts to stress, exercise, altitude, diving, ageing and other challenges. Some weeks are engaging and others dry; reviewers see H1 as reachable but the depth as limited."
      zh: "讲身体如何适应压力、运动、高原、潜水、衰老等挑战。有些周很有意思，有些很枯燥；同学觉得 H1 能拿，但学得不深。"
      zh-TW: "講身體如何適應壓力、運動、高海拔、潛水、老化等挑戰。有些週很有趣，有些很枯燥；同學覺得 H1 拿得到，但學得不深。"
      ja: "ストレス、運動、高地、潜水、加齢などへの身体の適応を学ぶ。面白い週と退屈な週がある。H1は取れるが深さは物足りないという声。"
      ko: "스트레스, 운동, 고지대, 잠수, 노화 등에 몸이 어떻게 적응하는지 배운다. 흥미로운 주도 지루한 주도 있으며, H1은 가능하지만 깊이는 얕다는 평."
      vi: "Cơ thể thích nghi thế nào với căng thẳng, vận động, độ cao, lặn, lão hóa và các thách thức khác. Có tuần hay có tuần khô; người học thấy H1 đạt được nhưng kiến thức chưa sâu."
      ms: "Bagaimana badan menyesuaikan diri dengan tekanan, senaman, altitud, selaman, penuaan dan cabaran lain. Ada minggu menarik dan ada yang hambar; pengulas rasa H1 boleh dicapai tetapi kedalamannya terhad."
      id: "Cara tubuh beradaptasi dengan stres, olahraga, ketinggian, menyelam, penuaan dan tantangan lain. Ada minggu yang menarik dan ada yang kering; pengulas merasa H1 bisa diraih tapi kedalamannya terbatas."
      hi: "शरीर तनाव, व्यायाम, ऊँचाई, गोताख़ोरी, बुढ़ापे और दूसरी चुनौतियों के अनुसार कैसे ढलता है। कुछ हफ़्ते रोचक और कुछ नीरस; रिव्यूअर्स H1 संभव मानते हैं पर गहराई सीमित।"
  work:
    - en: "Weekly quizzes that are mostly easy marks, a lay-audience assignment and a group presentation that are marked harder, and an open-book case-study exam worth about 20%."
      zh: "每周小测大多好拿分；面向大众的写作作业和小组展示给分较严；期末是开卷案例题，约占 20%。"
      zh-TW: "每週小考大多好拿分；面向大眾的寫作作業和小組報告給分較嚴；期末是開書案例題，約佔 20%。"
      ja: "毎週の小テストは概ね取りやすい。一般向けの課題とグループ発表は採点が厳しめ。期末は約20%のオープンブックのケース問題。"
      ko: "주간 퀴즈는 대체로 쉬운 점수, 일반인 대상 과제와 조별 발표는 더 엄격히 채점된다. 기말은 약 20%인 오픈북 사례 시험이다."
      vi: "Quiz hằng tuần phần lớn dễ lấy điểm, bài viết cho người đọc phổ thông và bài thuyết trình nhóm chấm khắt hơn, và bài thi tình huống mở tài liệu khoảng 20%."
      ms: "Kuiz mingguan yang kebanyakannya markah mudah, tugasan untuk orang awam dan pembentangan kumpulan yang dinilai lebih ketat, dan peperiksaan kajian kes buku terbuka kira-kira 20%."
      id: "Kuis mingguan yang umumnya nilai mudah, tugas untuk pembaca awam dan presentasi kelompok yang dinilai lebih ketat, dan ujian studi kasus open book sekitar 20%."
      hi: "साप्ताहिक क्विज़ ज़्यादातर आसान अंक, आम पाठकों के लिए असाइनमेंट और ग्रुप प्रेज़ेंटेशन की मार्किंग सख़्त, और लगभग 20% की ओपन-बुक केस-स्टडी परीक्षा।"
  study:
    - en: "Start the group project early, meet regularly and set deadlines; for the exam, mind maps linking topics across the semester help."
      zh: "小组项目早点开始，定期碰面并设定截止时间；期末用思维导图把整个学期的主题串起来会有帮助。"
      zh-TW: "小組專題早點開始，定期碰面並設定截止時間；期末用心智圖把整學期的主題串起來會有幫助。"
      ja: "グループプロジェクトは早めに始め、定期的に集まり締め切りを決める。期末は学期全体をつなぐマインドマップが役立つ。"
      ko: "조별 프로젝트는 일찍 시작해 정기적으로 만나고 마감을 정하라. 기말엔 학기 전체 주제를 잇는 마인드맵이 도움이 된다."
      vi: "Bắt đầu project nhóm sớm, họp thường xuyên và đặt hạn; ôn thi bằng sơ đồ tư duy nối các chủ đề cả kỳ sẽ giúp ích."
      ms: "Mula projek kumpulan awal, berjumpa kerap dan tetapkan tarikh akhir; untuk peperiksaan, peta minda yang menghubungkan topik sepanjang semester membantu."
      id: "Mulai proyek kelompok lebih awal, rutin bertemu dan tetapkan tenggat; untuk ujian, mind map yang menghubungkan topik sepanjang semester membantu."
      hi: "ग्रुप प्रोजेक्ट जल्दी शुरू करें, नियमित मिलें और समय-सीमा तय करें; परीक्षा के लिए पूरे सेमेस्टर के टॉपिक जोड़ने वाले माइंड मैप मदद करते हैं।"
  watch:
    - en: "Several reviewers say feedback on assignments only arrived after the exam or semester ended, and some would pick an anatomy or neuroscience subject instead."
      zh: "好几位同学说作业反馈要到考完或学期结束后才出来，也有人建议改选解剖或神经科学的课。"
      zh-TW: "好幾位同學說作業回饋要到考完或學期結束後才出來，也有人建議改修解剖或神經科學的課。"
      ja: "課題のフィードバックは試験や学期終了後にしか届かなかったという声が複数。代わりに解剖学や神経科学の科目を選ぶという人も。"
      ko: "과제 피드백이 시험이나 학기가 끝난 뒤에야 왔다는 의견이 여럿이고, 대신 해부학이나 신경과학 과목을 고르겠다는 사람도 있다."
      vi: "Vài người nói phản hồi bài tập chỉ có sau kỳ thi hoặc khi hết kỳ, và một số sẽ chọn môn giải phẫu hoặc khoa học thần kinh thay thế."
      ms: "Beberapa pengulas kata maklum balas tugasan hanya tiba selepas peperiksaan atau semester tamat, dan ada yang akan pilih subjek anatomi atau neurosains."
      id: "Beberapa pengulas bilang umpan balik tugas baru datang setelah ujian atau semester selesai, dan sebagian akan memilih mata kuliah anatomi atau neurosains."
      hi: "कई रिव्यूअर्स कहते हैं असाइनमेंट का फ़ीडबैक परीक्षा या सेमेस्टर ख़त्म होने के बाद ही मिला, और कुछ इसकी जगह एनाटॉमी या न्यूरोसाइंस विषय चुनेंगे।"
tags: [group-work]
difficulty: easy
