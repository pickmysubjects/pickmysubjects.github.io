reviews: 10
from: 2017
to: 2022
checked: 2026-10-17
points:
  - en: "The biggest theme from 2017 to 2022 is marking: it is seen as subjective and dependent on your tutor's taste, with no cross-marking, so it is not an easy H1."
    zh: "2017到2022年最突出的话题是评分：被认为很主观、取决于辅导老师的口味，没有交叉评分，所以不容易拿H1。"
    zh-TW: "2017到2022年最突出的話題是評分：被認為很主觀、取決於助教的口味，沒有交叉評分，所以不容易拿H1。"
    ja: "2017〜2022年で一番多い話題は採点。主観的でチューターの好み次第、クロス採点もないため、H1は取りにくい。"
    ko: "2017~2022년 가장 많이 나온 얘기는 채점. 주관적이고 튜터 취향에 좌우되며 교차 채점이 없어 H1 받기 쉽지 않음."
    vi: "Chủ đề nổi bật nhất từ 2017 đến 2022 là chấm điểm: bị cho là chủ quan, tùy khẩu vị tutor, không chấm chéo, nên không dễ lấy H1."
    ms: "Tema terbesar dari 2017 hingga 2022 ialah pemarkahan: ia dilihat subjektif dan bergantung pada citarasa tutor, tanpa pemarkahan silang, jadi bukan H1 yang mudah."
    id: "Tema terbesar dari 2017 sampai 2022 adalah penilaian: dianggap subjektif dan tergantung selera tutor, tanpa penilaian silang, jadi H1 tidak mudah."
    hi: "2017 से 2022 तक सबसे बड़ा मुद्दा मार्किंग रहा: इसे व्यक्तिपरक और ट्यूटर की पसंद पर निर्भर माना गया, क्रॉस-मार्किंग नहीं होती, इसलिए H1 आसान नहीं।"
  - en: "Lectures bring in guest writers across fiction, poetry and non-fiction; some found them interesting, others said they gave little practical writing advice."
    zh: "讲座请来小说、诗歌和非虚构写作的客座作家；有人觉得有意思，也有人说缺少实用的写作建议。"
    zh-TW: "講課請來小說、詩歌和非虛構寫作的客座作家；有人覺得有意思，也有人說缺少實用的寫作建議。"
    ja: "講義には小説、詩、ノンフィクションのゲスト作家が登場する。面白いという人もいれば、実践的な助言が少ないという人もいる。"
    ko: "강의엔 소설, 시, 논픽션 분야 초청 작가가 나옴. 흥미롭다는 사람도 있고, 실질적인 글쓰기 조언은 적다는 사람도 있음."
    vi: "Bài giảng mời các nhà văn khách mời về tiểu thuyết, thơ và phi hư cấu; có người thấy thú vị, người khác nói ít lời khuyên thực tế."
    ms: "Kuliah membawa penulis jemputan dalam fiksyen, puisi dan bukan fiksyen; ada yang rasa menarik, yang lain kata kurang nasihat penulisan praktikal."
    id: "Kuliah menghadirkan penulis tamu dari fiksi, puisi, dan nonfiksi; ada yang merasa menarik, yang lain bilang minim saran menulis praktis."
    hi: "लेक्चर में कथा, कविता और नॉन-फ़िक्शन के अतिथि लेखक आते हैं; कुछ को दिलचस्प लगे, दूसरों ने कहा कि लिखने की व्यावहारिक सलाह कम मिली।"
  - en: "Workshops and tutor feedback were the most useful part for many, but your experience depends heavily on the tutor; expect your work to be read and discussed in class."
    zh: "很多人觉得写作坊和辅导老师的反馈最有用，但体验很大程度取决于辅导老师；作品会在课堂上被朗读和讨论。"
    zh-TW: "很多人覺得寫作工作坊和助教的回饋最有用，但體驗很大程度取決於助教；作品會在課堂上被朗讀和討論。"
    ja: "多くの人にとってワークショップとチューターのフィードバックが一番役立ったが、体験はチューター次第。自分の作品が授業で読まれ議論されることも覚悟しておくこと。"
    ko: "많은 사람에게 워크숍과 튜터 피드백이 가장 유용했지만, 경험은 튜터에 크게 좌우됨. 자기 글이 수업에서 읽히고 토론될 수 있음."
    vi: "Với nhiều người, workshop và phản hồi của tutor là hữu ích nhất, nhưng trải nghiệm phụ thuộc nhiều vào tutor; bài của bạn sẽ được đọc và bàn trong lớp."
    ms: "Bengkel dan maklum balas tutor paling berguna bagi ramai orang, tetapi pengalaman sangat bergantung pada tutor; jangkakan karya anda dibaca dan dibincang di kelas."
    id: "Bagi banyak orang, workshop dan umpan balik tutor paling berguna, tapi pengalamannya sangat tergantung tutor; karyamu akan dibacakan dan dibahas di kelas."
    hi: "कई लोगों के लिए वर्कशॉप और ट्यूटर का फ़ीडबैक सबसे उपयोगी रहा, पर अनुभव काफ़ी हद तक ट्यूटर पर निर्भर है; आपका लेखन क्लास में पढ़ा और चर्चा किया जा सकता है।"
difficulty: hard
