code: CWRI10001
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/cwri10001
reviews: 10
from: 2017
to: 2022
checked: 2026-10-17
points:
  - en: "The biggest theme from 2017 to 2022 is marking: it is seen as subjective and dependent on your tutor's taste, with no cross-marking, so it is not an easy H1."
    zh: "2017到2022年最突出的话题是评分：被认为很主观、取决于辅导老师的口味，没有交叉评分，所以不容易拿H1。"
    zh-TW: "2017到2022年最突出的話題是評分：被認為很主觀、取決於助教的口味，沒有交叉評分，所以不容易拿H1。"
    ja: "2017〜2022年で一番多い話題は採点。主観的でチューターの好み次第、クロス採点もないため、H1は取りにくい。"
    ko: "2017~2022년 가장 많이 나온 얘기는 채점. 주관적이고 튜터 취향에 좌우되며 교차 채점이 없어 H1 받기 쉽지 않음."
    vi: "Chủ đề nổi bật nhất từ 2017 đến 2022 là chấm điểm: bị cho là chủ quan, tùy khẩu vị tutor, không chấm chéo, nên không dễ lấy H1."
    ms: "Tema terbesar dari 2017 hingga 2022 ialah pemarkahan: ia dilihat subjektif dan bergantung pada citarasa tutor, tanpa pemarkahan silang, jadi bukan H1 yang mudah."
    id: "Tema terbesar dari 2017 sampai 2022 adalah penilaian: dianggap subjektif dan tergantung selera tutor, tanpa penilaian silang, jadi H1 tidak mudah."
    hi: "2017 से 2022 तक सबसे बड़ा मुद्दा मार्किंग रहा: इसे व्यक्तिपरक और ट्यूटर की पसंद पर निर्भर माना गया, क्रॉस-मार्किंग नहीं होती, इसलिए H1 आसान नहीं।"
  - en: "Lectures bring in guest writers across fiction, poetry and non-fiction; some found them interesting, others said they gave little practical writing advice."
    zh: "讲座请来小说、诗歌和非虚构写作的客座作家；有人觉得有意思，也有人说缺少实用的写作建议。"
    zh-TW: "講課請來小說、詩歌和非虛構寫作的客座作家；有人覺得有意思，也有人說缺少實用的寫作建議。"
    ja: "講義には小説、詩、ノンフィクションのゲスト作家が登場する。面白いという人もいれば、実践的な助言が少ないという人もいる。"
    ko: "강의엔 소설, 시, 논픽션 분야 초청 작가가 나옴. 흥미롭다는 사람도 있고, 실질적인 글쓰기 조언은 적다는 사람도 있음."
    vi: "Bài giảng mời các nhà văn khách mời về tiểu thuyết, thơ và phi hư cấu; có người thấy thú vị, người khác nói ít lời khuyên thực tế."
    ms: "Kuliah membawa penulis jemputan dalam fiksyen, puisi dan bukan fiksyen; ada yang rasa menarik, yang lain kata kurang nasihat penulisan praktikal."
    id: "Kuliah menghadirkan penulis tamu dari fiksi, puisi, dan nonfiksi; ada yang merasa menarik, yang lain bilang minim saran menulis praktis."
    hi: "लेक्चर में कथा, कविता और नॉन-फ़िक्शन के अतिथि लेखक आते हैं; कुछ को दिलचस्प लगे, दूसरों ने कहा कि लिखने की व्यावहारिक सलाह कम मिली।"
  - en: "Workshops and tutor feedback were the most useful part for many, but your experience depends heavily on the tutor; expect your work to be read and discussed in class."
    zh: "很多人觉得写作坊和辅导老师的反馈最有用，但体验很大程度取决于辅导老师；作品会在课堂上被朗读和讨论。"
    zh-TW: "很多人覺得寫作工作坊和助教的回饋最有用，但體驗很大程度取決於助教；作品會在課堂上被朗讀和討論。"
    ja: "多くの人にとってワークショップとチューターのフィードバックが一番役立ったが、体験はチューター次第。自分の作品が授業で読まれ議論されることも覚悟しておくこと。"
    ko: "많은 사람에게 워크숍과 튜터 피드백이 가장 유용했지만, 경험은 튜터에 크게 좌우됨. 자기 글이 수업에서 읽히고 토론될 수 있음."
    vi: "Với nhiều người, workshop và phản hồi của tutor là hữu ích nhất, nhưng trải nghiệm phụ thuộc nhiều vào tutor; bài của bạn sẽ được đọc và bàn trong lớp."
    ms: "Bengkel dan maklum balas tutor paling berguna bagi ramai orang, tetapi pengalaman sangat bergantung pada tutor; jangkakan karya anda dibaca dan dibincang di kelas."
    id: "Bagi banyak orang, workshop dan umpan balik tutor paling berguna, tapi pengalamannya sangat tergantung tutor; karyamu akan dibacakan dan dibahas di kelas."
    hi: "कई लोगों के लिए वर्कशॉप और ट्यूटर का फ़ीडबैक सबसे उपयोगी रहा, पर अनुभव काफ़ी हद तक ट्यूटर पर निर्भर है; आपका लेखन क्लास में पढ़ा और चर्चा किया जा सकता है।"
sections:
  content:
    - en: "Covers short fiction, poetry and creative non-fiction, with guest writers in lectures. Several found lectures interesting but light on practical technique; some said writers talked mostly about their own work."
      zh: "涵盖短篇小说、诗歌和创意非虚构，lecture 请作家来讲。好几位觉得 lecture 有意思但实用技巧少；也有人说作家多半在讲自己的作品。"
      zh-TW: "涵蓋短篇小說、詩和創意非虛構，lecture 邀請作家來講。好幾位覺得 lecture 有趣但實用技巧少；也有人說作家多半在講自己的作品。"
      ja: "短編小説、詩、クリエイティブ・ノンフィクションを扱い、講義には作家がゲストで来る。面白いが実践的な技法は少ないという声が複数。作家が自作の話ばかりだったという人も。"
      ko: "단편소설, 시, 창작 논픽션을 다루며 강의에 작가가 초청된다. 흥미롭지만 실용적인 기법은 적다는 리뷰가 여럿. 작가들이 주로 자기 작품 이야기만 했다는 사람도 있다."
      vi: "Gồm truyện ngắn, thơ và phi hư cấu sáng tạo, có nhà văn khách mời giảng. Vài người thấy bài giảng thú vị nhưng ít kỹ thuật thực tế; có người nói nhà văn chủ yếu nói về tác phẩm của mình."
      ms: "Merangkumi cereka pendek, puisi dan bukan fiksyen kreatif, dengan penulis jemputan dalam kuliah. Beberapa rasa kuliah menarik tetapi kurang teknik praktikal; ada yang kata penulis kebanyakan bercakap tentang karya sendiri."
      id: "Mencakup fiksi pendek, puisi, dan nonfiksi kreatif, dengan penulis tamu di kuliah. Beberapa merasa kuliahnya menarik tapi minim teknik praktis; ada yang bilang penulis kebanyakan membahas karyanya sendiri."
      hi: "लघु कथा, कविता और क्रिएटिव नॉन-फ़िक्शन, लेक्चर में अतिथि लेखक। कई को लेक्चर रोचक पर व्यावहारिक तकनीक में कम लगे; कुछ ने कहा लेखक ज़्यादातर अपने काम की बात करते थे।"
  work:
    - en: "Two-hour workshops where classmates read and critique each other's pieces, which many found the most useful part. Assignments give freedom, but grading is described as tough and dependent on your tutor's taste."
      zh: "两小时的 workshop，同学们互相读作品、给意见，很多人觉得这是最有用的部分。作业自由度大，但评分被形容为严格、看 tutor 的个人口味。"
      zh-TW: "兩小時的 workshop，同學們互相讀作品、給意見，很多人覺得這是最有用的部分。作業自由度大，但評分被形容為嚴格、看 tutor 的個人喜好。"
      ja: "2時間のワークショップで互いの作品を読み講評し合い、そこが最も役立ったという声が多い。課題の自由度は高いが、採点は厳しくチューターの好み次第と言われる。"
      ko: "2시간 워크숍에서 서로의 글을 읽고 비평하며, 이것이 가장 유용했다는 평이 많다. 과제 자유도는 높지만 채점은 까다롭고 튜터 취향에 달렸다고 한다."
      vi: "Workshop 2 tiếng, các bạn đọc và góp ý bài của nhau, nhiều người thấy đây là phần hữu ích nhất. Bài tập tự do, nhưng chấm được cho là gắt và tùy khẩu vị tutor."
      ms: "Bengkel dua jam di mana rakan sekelas membaca dan mengkritik karya masing-masing, yang ramai rasa paling berguna. Tugasan bebas, tetapi pemarkahan digambarkan keras dan bergantung pada citarasa tutor."
      id: "Workshop dua jam tempat teman sekelas membaca dan mengkritik karya satu sama lain, yang banyak dianggap bagian paling berguna. Tugasnya bebas, tapi penilaian disebut keras dan tergantung selera tutor."
      hi: "दो घंटे की वर्कशॉप जहाँ सहपाठी एक-दूसरे का लेखन पढ़कर समीक्षा करते हैं, कई के लिए यही सबसे उपयोगी हिस्सा। असाइनमेंट में आज़ादी है, पर मार्किंग सख़्त और ट्यूटर की पसंद पर निर्भर बताई गई।"
  watch:
    - en: "Many reviewers say marking feels subjective and inconsistent across tutors, with no cross-marking. Your tutor shapes the experience; one suggests switching class if it isn't working."
      zh: "很多同学说评分主观、不同 tutor 之间不一致，也没有交叉批改。体验很看 tutor；有一位建议不合适就换班。"
      zh-TW: "很多同學說評分主觀、不同 tutor 之間不一致，也沒有交叉批改。體驗很看 tutor；有一位建議不適合就換班。"
      ja: "採点が主観的でチューター間でばらつき、クロス採点もないという声が多い。経験はチューター次第。合わなければクラス変更を勧める人が一人。"
      ko: "채점이 주관적이고 튜터마다 일관성이 없으며 교차 채점도 없다는 리뷰가 많다. 경험은 튜터에 달렸고, 맞지 않으면 반을 바꾸라는 사람이 한 명."
      vi: "Nhiều người nói chấm điểm chủ quan, không đồng đều giữa các tutor, không có chấm chéo. Tutor quyết định trải nghiệm; một người khuyên đổi lớp nếu không hợp."
      ms: "Ramai pengulas kata pemarkahan terasa subjektif dan tidak konsisten antara tutor, tanpa pemarkahan silang. Tutor menentukan pengalaman; seorang cadang tukar kelas jika tidak serasi."
      id: "Banyak reviewer bilang penilaian terasa subjektif dan tak konsisten antar tutor, tanpa penilaian silang. Tutor menentukan pengalaman; satu menyarankan pindah kelas jika tak cocok."
      hi: "कई रिव्यूअर कहते हैं मार्किंग व्यक्तिपरक और ट्यूटर्स के बीच असंगत लगती है, क्रॉस-मार्किंग नहीं होती। अनुभव ट्यूटर तय करता है; एक कहते हैं न जमे तो क्लास बदल लें।"
    - en: "The most recent reviews are from 2022, so the subject may have changed since."
      zh: "最新的评价是 2022 年的，这门课之后可能有变化。"
      zh-TW: "最新的評價是 2022 年的，這門課之後可能有變化。"
      ja: "最新のレビューは2022年のもので、その後内容が変わっている可能性がある。"
      ko: "가장 최근 리뷰가 2022년 것이라 이후 과목이 바뀌었을 수 있다."
      vi: "Đánh giá mới nhất là từ 2022, nên môn học có thể đã thay đổi."
      ms: "Ulasan terbaru dari 2022, jadi subjek mungkin telah berubah sejak itu."
      id: "Ulasan terbaru dari 2022, jadi mata kuliahnya mungkin sudah berubah."
      hi: "सबसे नए रिव्यू 2022 के हैं, इसलिए विषय तब से बदल सकता है।"
difficulty: hard
