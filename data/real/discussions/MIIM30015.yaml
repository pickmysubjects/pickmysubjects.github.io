points:
  - en: "A lab-based subject with heavy weekly work. Keep up with the practicals and weekly lab notebook, which also helps exam revision."
    zh: "实验课为主，每周工作量大；需跟上实验和每周实验记录，也利于复习。"
    zh-TW: "以實驗課為主，每週份量重；要跟上實驗和每週實驗紀錄，也有助複習。"
    ja: "実験中心の科目で毎週の負担が大きい。実習と毎週のラボノートに遅れないこと。試験の復習にも役立つ。"
    ko: "실험 기반 과목으로 매주 공부량이 많다. 실습과 주간 실험 노트를 밀리지 말자. 시험 복습에도 도움이 된다."
    vi: "Môn dựa trên phòng lab, khối lượng hằng tuần nặng. Theo kịp thực hành và sổ lab hằng tuần, cũng giúp ôn thi."
    ms: "Subjek berasaskan makmal dengan kerja mingguan berat. Ikuti amali dan buku nota makmal mingguan, yang juga bantu ulang kaji."
    id: "Mata kuliah berbasis lab dengan beban mingguan berat. Ikuti praktikum dan buku catatan lab mingguan, yang juga membantu belajar ujian."
    hi: "लैब-आधारित सब्जेक्ट, हर हफ्ते भारी काम। प्रैक्टिकल और साप्ताहिक लैब नोटबुक के साथ बने रहें, इससे एग्ज़ाम रिवीज़न में भी मदद मिलती है।"
  - en: "Strong hands-on learning, especially flow cytometry and analysis software, though the software takes some getting used to."
    zh: "动手实践收获大，尤其是流式细胞术和分析软件，但软件需要适应。"
    zh-TW: "動手實作收穫大，尤其是流式細胞術和分析軟體，但軟體需要時間適應。"
    ja: "実践的な学びが充実しており、特にフローサイトメトリーと解析ソフト。ただしソフトには慣れが必要。"
    ko: "실습으로 배우는 게 많다. 특히 유세포 분석과 분석 소프트웨어인데, 소프트웨어는 익숙해지는 데 시간이 걸린다."
    vi: "Học thực hành rất tốt, nhất là flow cytometry và phần mềm phân tích, dù phần mềm cần thời gian làm quen."
    ms: "Pembelajaran praktikal yang kukuh, terutamanya flow cytometry dan perisian analisis, walaupun perisian perlu masa untuk biasa."
    id: "Belajar praktik yang kuat, terutama flow cytometry dan software analisis, meski software-nya butuh waktu untuk terbiasa."
    hi: "बढ़िया हैंड्स-ऑन लर्निंग, खासकर फ़्लो साइटोमेट्री और एनालिसिस सॉफ़्टवेयर, हालाँकि सॉफ़्टवेयर की आदत पड़ने में समय लगता है।"
  - en: "The written exam can be very hard. Marking was also inconsistent between demonstrators."
    zh: "笔试可能很难；不同助教之间评分曾不一致。"
    zh-TW: "筆試可能很難；不同助教之間評分也曾不一致。"
    ja: "筆記試験はかなり難しいことも。デモンストレーターによって採点にばらつきもあった。"
    ko: "필기시험이 매우 어려울 수 있다. 조교마다 채점도 일관되지 않았다."
    vi: "Bài thi viết có thể rất khó. Việc chấm điểm giữa các trợ giảng cũng không đồng đều."
    ms: "Peperiksaan bertulis boleh sangat sukar. Pemarkahan juga tidak konsisten antara demonstrator."
    id: "Ujian tertulis bisa sangat sulit. Penilaian juga tidak konsisten antar asisten."
    hi: "लिखित एग्ज़ाम बहुत कठिन हो सकता है। डेमोंस्ट्रेटर्स के बीच मार्किंग भी एक जैसी नहीं थी।"
workload: heavy
difficulty: hard
