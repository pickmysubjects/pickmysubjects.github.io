code: POLS20031
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/pols20031
reviews: 5
from: 2015
to: 2021
checked: 2026-10-17
points:
  - en: "Explores links between politics, economics and inequality. Reviewers found it thought-provoking, with no maths and little straight economic theory, though it can be dry."
    zh: "探讨政治、经济与不平等之间的联系。评论者觉得发人深省，没有数学，纯经济理论也很少，不过可能有点枯燥。"
    zh-TW: "探討政治、經濟與不平等之間的關聯。評論者覺得發人深省，沒有數學，純經濟理論也很少，不過可能有點枯燥。"
    ja: "政治・経済・不平等のつながりを探る。考えさせられる内容で、数学はなく純粋な経済理論も少ないが、退屈なこともあるとされた。"
    ko: "정치, 경제, 불평등의 연결을 탐구. 생각할 거리가 많고 수학은 없으며 순수 경제 이론도 적지만 다소 건조할 수 있다는 평."
    vi: "Tìm hiểu mối liên hệ giữa chính trị, kinh tế và bất bình đẳng. Người đánh giá thấy đáng suy ngẫm, không có toán và ít lý thuyết kinh tế thuần, dù có thể khô khan."
    ms: "Meneroka kaitan antara politik, ekonomi dan ketidaksamaan. Pengulas dapati ia merangsang fikiran, tiada matematik dan sedikit teori ekonomi tulen, walaupun boleh hambar."
    id: "Menelusuri kaitan politik, ekonomi dan ketimpangan. Pengulas merasa menggugah pikiran, tanpa matematika dan sedikit teori ekonomi murni, meski bisa terasa kering."
    hi: "राजनीति, अर्थशास्त्र और असमानता के संबंधों की पड़ताल। रिव्यूअर्स को यह सोचने पर मजबूर करने वाला लगा, बिना गणित और कम शुद्ध आर्थिक सिद्धांत के, हालाँकि यह नीरस हो सकता है।"
  - en: "Students without economics background found the terminology hard at first; keeping up with readings helps. Assessments let you focus on the parts you find most interesting."
    zh: "没有经济学背景的学生一开始觉得术语难懂；跟上阅读会有帮助。考核允许你专注于最感兴趣的部分。"
    zh-TW: "沒有經濟學背景的學生一開始覺得術語難懂；跟上閱讀會有幫助。考核允許你專注於最感興趣的部分。"
    ja: "経済学の背景がない学生は最初用語に苦労した。文献を読み続けると楽になる。評価では最も興味のある部分に絞れる。"
    ko: "경제학 배경이 없는 학생은 처음에 용어가 어려웠음. 읽기를 따라가면 도움이 됨. 평가는 가장 관심 있는 부분에 집중할 수 있음."
    vi: "Sinh viên không có nền kinh tế thấy thuật ngữ khó lúc đầu; theo kịp bài đọc sẽ giúp ích. Bài đánh giá cho phép tập trung vào phần bạn thấy thú vị nhất."
    ms: "Pelajar tanpa latar ekonomi dapati istilahnya sukar pada mulanya; ikut bacaan membantu. Penilaian membolehkan anda fokus pada bahagian paling menarik."
    id: "Mahasiswa tanpa latar ekonomi merasa istilahnya sulit di awal; mengikuti bacaan membantu. Penilaian memungkinkan fokus pada bagian yang paling menarik bagimu."
    hi: "बिना अर्थशास्त्र बैकग्राउंड वाले छात्रों को शुरू में शब्दावली कठिन लगी; रीडिंग के साथ चलना मदद करता है। असेसमेंट में आप सबसे दिलचस्प हिस्सों पर ध्यान दे सकते हैं।"
sections:
  content:
    - en: "Explores links between politics and the economy, including inequality. It's broad and can be dry at times; reviewers disagree on how much economics background you need."
      zh: "探讨政治与经济的关系，包括不平等问题。范围广，有时有点枯燥；对需要多少经济学基础，同学看法不一。"
      zh-TW: "探討政治與經濟的關係，包括不平等問題。範圍廣，有時有點枯燥；對需要多少經濟學基礎，同學看法不一。"
      ja: "政治と経済のつながり、不平等などを探る。幅広く時に退屈。経済学の素養がどれだけ必要かは意見が分かれる。"
      ko: "정치와 경제의 연결, 불평등 등을 다룬다. 범위가 넓고 때로 건조하며, 경제학 배경이 얼마나 필요한지는 의견이 갈린다."
      vi: "Tìm hiểu mối liên hệ giữa chính trị và kinh tế, gồm bất bình đẳng. Rộng và đôi khi khô; người học không thống nhất cần bao nhiêu nền kinh tế học."
      ms: "Meneroka kaitan politik dan ekonomi, termasuk ketidaksamaan. Luas dan kadang hambar; pengulas tidak sepakat tentang berapa banyak latar ekonomi diperlukan."
      id: "Menelusuri hubungan politik dan ekonomi, termasuk ketimpangan. Luas dan kadang kering; pengulas berbeda pendapat soal seberapa perlu latar ekonomi."
      hi: "राजनीति और अर्थव्यवस्था के संबंध, असमानता समेत। व्यापक और कभी-कभी नीरस; कितनी अर्थशास्त्र पृष्ठभूमि चाहिए इस पर रिव्यूअर्स सहमत नहीं।"
  work:
    - en: "Essays let you focus on the parts that interest you. One reviewer says there's no maths; others found economics jargon hard without a background."
      zh: "论文可以聚焦你感兴趣的部分。有同学说完全没有数学；也有人觉得没经济学基础的话，术语很难懂。"
      zh-TW: "論文可以聚焦你感興趣的部分。有同學說完全沒有數學；也有人覺得沒經濟學基礎的話，術語很難懂。"
      ja: "エッセイは興味のある部分に絞れる。数学はないという人もいれば、経済の素養がないと用語が難しいという人も。"
      ko: "에세이는 관심 있는 부분에 집중할 수 있다. 수학은 없다는 사람도, 경제학 배경 없이는 용어가 어렵다는 사람도 있다."
      vi: "Bài luận cho phép tập trung vào phần bạn thích. Một người nói không có toán; người khác thấy thuật ngữ kinh tế khó nếu không có nền."
      ms: "Esei membolehkan anda fokus pada bahagian yang diminati. Seorang kata tiada matematik; yang lain rasa istilah ekonomi sukar tanpa latar belakang."
      id: "Esai memungkinkan fokus pada bagian yang kamu minati. Satu bilang tidak ada matematika; yang lain merasa istilah ekonomi sulit tanpa latar."
      hi: "निबंधों में आप अपनी रुचि वाले हिस्सों पर ध्यान दे सकते हैं। एक कहता है गणित नहीं है; दूसरों को बिना पृष्ठभूमि के अर्थशास्त्र की शब्दावली कठिन लगी।"
  study:
    - en: "One reviewer with no economics background says keeping up with readings and engaging with the literature in the first essay makes the second half easier."
      zh: "一位没有经济学基础的同学说，跟上阅读、在第一篇论文里好好用文献，后半学期会轻松些。"
      zh-TW: "一位沒有經濟學基礎的同學說，跟上閱讀、在第一篇論文裡好好用文獻，後半學期會輕鬆些。"
      ja: "経済の素養がなかった一人は、リーディングについていき最初のエッセイで文献にしっかり取り組めば後半が楽になると言う。"
      ko: "경제학 배경이 없던 한 리뷰는 리딩을 따라가고 첫 에세이에서 문헌을 충실히 다루면 후반이 쉬워진다고 한다."
      vi: "Một người không có nền kinh tế nói theo kịp bài đọc và dùng tốt tài liệu trong bài luận đầu sẽ giúp nửa sau dễ hơn."
      ms: "Seorang tanpa latar ekonomi kata mengikuti bacaan dan menggunakan literatur dalam esei pertama memudahkan separuh kedua."
      id: "Satu pengulas tanpa latar ekonomi bilang mengikuti bacaan dan mendalami literatur di esai pertama membuat paruh kedua lebih mudah."
      hi: "बिना अर्थशास्त्र पृष्ठभूमि वाला एक रिव्यूअर कहता है रीडिंग के साथ रहना और पहले निबंध में साहित्य से जुड़ना दूसरा हिस्सा आसान बनाता है।"
  watch:
    - en: "All these reviews are from 2021 or earlier; teaching and exams may have changed since."
      zh: "这些评价都是 2021 年或更早的，现在的教法和考试可能已经变了。"
      zh-TW: "這些評價都是 2021 年或更早的，現在的教法和考試可能已經變了。"
      ja: "レビューはすべて2021年以前のもの。授業や試験は変わっている可能性がある。"
      ko: "모든 리뷰가 2021년 이전 것이라 지금 수업과 시험은 달라졌을 수 있다."
      vi: "Tất cả đánh giá đều từ năm 2021 trở về trước; cách dạy và thi có thể đã thay đổi."
      ms: "Semua ulasan ini dari 2021 atau lebih awal; pengajaran dan peperiksaan mungkin telah berubah."
      id: "Semua ulasan ini dari 2021 atau sebelumnya; pengajaran dan ujian mungkin sudah berubah."
      hi: "ये सभी रिव्यू 2021 या उससे पहले के हैं; पढ़ाई और परीक्षा अब बदल चुकी हो सकती है।"
