points:
  - en: "Semester 1 2026 reviews were strongly negative: disorganised, lectures often left unfinished, and an exam testing material barely taught."
    zh: "2026年第一学期评价很差：组织混乱、讲座常讲不完，考试考了几乎没讲的内容。"
    zh-TW: "2026年第一學期評價很差：組織混亂、講座常講不完，考試考了幾乎沒教的內容。"
    ja: "2026年第1学期のレビューは非常に否定的でした。運営が乱れ、講義が終わらないことが多く、ほとんど教わっていない内容が試験に出ました。"
    ko: "2026년 1학기 후기는 매우 부정적이었습니다. 운영이 엉망이고 강의가 자주 끝나지 않았으며, 거의 안 배운 내용이 시험에 나왔습니다."
    vi: "Đánh giá học kỳ 1 năm 2026 rất tiêu cực: lộn xộn, bài giảng thường dạy dở dang, và đề thi hỏi phần gần như không được dạy."
    ms: "Ulasan Semester 1 2026 sangat negatif: tidak teratur, kuliah sering tidak habis, dan peperiksaan menguji bahan yang hampir tidak diajar."
    id: "Ulasan Semester 1 2026 sangat negatif: berantakan, kuliah sering tidak tuntas, dan ujian menguji materi yang nyaris tak diajarkan."
    hi: "सेमेस्टर 1 2026 के रिव्यूज़ बहुत नेगेटिव थे: अव्यवस्था, लेक्चर अक्सर अधूरे, और एग्ज़ाम में लगभग न पढ़ाया गया मटीरियल।"
  - en: "Assessments are now closed book and in person, not open book. Keep up weekly, as there is a lot of content and questions test application."
    zh: "考核已从开卷改为线下闭卷；内容多且考应用，需每周跟进。"
    zh-TW: "考核已從開書改為實體閉書考；內容多且考應用，需每週跟上。"
    ja: "評価は持ち込み可から、対面の持ち込み不可に変わりました。内容が多く応用が問われるので、毎週ついていきましょう。"
    ko: "평가는 이제 오픈북이 아닌 대면 클로즈드북입니다. 내용이 많고 응용을 묻기 때문에 매주 따라가세요."
    vi: "Bài đánh giá nay là thi đóng tài liệu, trực tiếp, không còn mở tài liệu. Hãy theo kịp mỗi tuần vì nội dung nhiều và đề hỏi vận dụng."
    ms: "Penilaian kini buku tertutup dan bersemuka, bukan buku terbuka. Ikuti setiap minggu kerana kandungan banyak dan soalan menguji aplikasi."
    id: "Penilaian sekarang closed book dan tatap muka, bukan open book. Ikuti tiap minggu karena materinya banyak dan soalnya menguji penerapan."
    hi: "असेसमेंट अब ओपन बुक नहीं, बल्कि क्लोज़्ड बुक और आमने-सामने हैं। हर हफ्ते साथ चलें, क्योंकि कंटेंट बहुत है और सवाल एप्लिकेशन पर हैं।"
  - en: "Several advise checking who coordinates that semester; reviewers of the semester 2 offering were more positive."
    zh: "多人建议选课前确认当学期的课程负责人；第二学期开课的评价更正面。"
    zh-TW: "多人建議選課前確認當學期的課程負責人；第二學期開課的評價較正面。"
    ja: "その学期のコーディネーターを確認するよう勧める声が複数あります。第2学期開講のレビューの方が好意的でした。"
    ko: "그 학기 코디네이터가 누구인지 확인하라는 조언이 여럿 있습니다. 2학기 개설 후기는 더 긍정적이었습니다."
    vi: "Một số người khuyên nên xem ai phụ trách môn học kỳ đó; đánh giá học kỳ 2 tích cực hơn."
    ms: "Beberapa menasihatkan semak siapa penyelaras semester itu; ulasan untuk tawaran semester 2 lebih positif."
    id: "Beberapa menyarankan cek siapa koordinator semester itu; ulasan untuk semester 2 lebih positif."
    hi: "कई लोग सलाह देते हैं कि उस सेमेस्टर का कोऑर्डिनेटर कौन है, यह देख लें; सेमेस्टर 2 वाले रिव्यूज़ ज़्यादा पॉज़िटिव थे।"
  - en: "The online modules, practice tests and the creative group resource task were seen as helpful, and H1s are still achievable."
    zh: "在线学习模块、模拟测验和创意小组作业被认为有帮助，仍有可能拿H1。"
    zh-TW: "線上學習模組、模擬測驗和創意小組資源作業被認為有幫助，仍有可能拿H1。"
    ja: "オンライン教材、練習テスト、グループでの創作課題は役立つと評価され、H1も今なお狙えます。"
    ko: "온라인 모듈, 연습 시험, 창의적 조별 자료 과제는 도움이 된다는 평이며 H1도 여전히 가능합니다."
    vi: "Các module online, bài kiểm tra luyện tập và bài nhóm làm tài liệu sáng tạo được thấy là hữu ích, và vẫn có thể đạt H1."
    ms: "Modul dalam talian, ujian latihan dan tugasan sumber kreatif berkumpulan dianggap membantu, dan H1 masih boleh dicapai."
    id: "Modul online, tes latihan, dan tugas kelompok membuat materi kreatif dinilai membantu, dan H1 masih bisa diraih."
    hi: "ऑनलाइन मॉड्यूल्स, प्रैक्टिस टेस्ट और क्रिएटिव ग्रुप रिसोर्स टास्क मददगार माने गए, और H1 अब भी मिल सकता है।"
