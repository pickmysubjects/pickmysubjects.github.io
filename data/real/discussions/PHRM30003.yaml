points:
  - en: "A step up from second-year pharmacology. Having done PHRM20001 (and physiology or pathology) is strongly recommended."
    zh: "比二年级药理难度更高，强烈建议先修PHRM20001（及生理或病理）。"
    zh-TW: "比二年級藥理難度更高，強烈建議先修PHRM20001（及生理或病理）。"
    ja: "2年次の薬理学より一段難しいです。PHRM20001（と生理学か病理学）を履修済みであることを強く勧めます。"
    ko: "2학년 약리학보다 한 단계 어렵습니다. PHRM20001(및 생리학이나 병리학)을 먼저 듣는 것을 강력히 추천합니다."
    vi: "Khó hơn dược lý năm 2. Rất nên học PHRM20001 (và sinh lý hoặc bệnh học) trước."
    ms: "Lebih mencabar daripada farmakologi tahun dua. Sangat disyorkan telah mengambil PHRM20001 (dan fisiologi atau patologi)."
    id: "Lebih sulit dari farmakologi tahun kedua. Sangat disarankan sudah mengambil PHRM20001 (dan fisiologi atau patologi)."
    hi: "यह सेकंड ईयर फार्माकोलॉजी से कठिन है। पहले PHRM20001 (और फिज़ियोलॉजी या पैथोलॉजी) करना बहुत ज़रूरी माना जाता है।"
  - en: "Short and essay-style answers are the main challenge. Link topics such as shared drug mechanisms across diseases."
    zh: "简答和论述题是主要难点，要把不同疾病中相通的药物机制联系起来。"
    zh-TW: "簡答和論述題是主要難點，要把不同疾病中相通的藥物機制連結起來。"
    ja: "短答や論述形式の解答が一番の難関です。病気をまたいで共通する薬の作用機序など、トピック同士を関連付けましょう。"
    ko: "단답형과 서술형 답안이 가장 어렵습니다. 여러 질병에 공통된 약물 기전처럼 주제들을 연결하세요."
    vi: "Câu trả lời ngắn và tự luận là thử thách chính. Hãy liên kết các chủ đề, ví dụ cơ chế thuốc dùng chung cho nhiều bệnh."
    ms: "Jawapan pendek dan gaya esei ialah cabaran utama. Kaitkan topik seperti mekanisme ubat yang sama merentas penyakit."
    id: "Jawaban singkat dan esai adalah tantangan utama. Hubungkan topik, misalnya mekanisme obat yang sama di berbagai penyakit."
    hi: "छोटे और निबंध वाले जवाब सबसे बड़ी चुनौती हैं। टॉपिक्स को जोड़ें, जैसे अलग-अलग बीमारियों में एक जैसे ड्रग मैकेनिज़्म।"
  - en: "Most found it interesting and well run, with H1 achievable. In 2026 one module was criticised for weak guest teaching."
    zh: "多数认为有趣、组织好、H1可期；2026年某模块客座讲课被批。"
    zh-TW: "多數認為有趣、組織好、H1可期；2026年某模組客座講課被批。"
    ja: "多くの人が面白く運営も良いと感じ、H1も狙えるとしています。2026年はある単元のゲスト講義が弱いと批判されました。"
    ko: "대부분 흥미롭고 잘 운영되며 H1도 가능하다고 했습니다. 2026년에는 한 모듈의 초청 강의가 부실하다는 비판이 있었습니다."
    vi: "Đa số thấy thú vị, tổ chức tốt và có thể đạt H1. Năm 2026, một module bị chê vì giảng viên khách mời dạy yếu."
    ms: "Kebanyakan dapati ia menarik dan teratur, dan H1 boleh dicapai. Pada 2026 satu modul dikritik kerana pengajaran tetamu yang lemah."
    id: "Kebanyakan merasa menarik dan tertata, H1 bisa diraih. Pada 2026 satu modul dikritik karena pengajaran dosen tamu yang lemah."
    hi: "ज़्यादातर को यह दिलचस्प और अच्छी तरह चलाया गया लगा, H1 मिल सकता है। 2026 में एक मॉड्यूल की कमज़ोर गेस्ट टीचिंग की आलोचना हुई।"
  - en: "Revise the workshops as well as the lectures, and make cards on each drug's mechanism and side effects."
    zh: "除讲课外也要复习研讨课，可为每种药做机制和副作用卡片。"
    zh-TW: "除講課外也要複習研討課，可為每種藥做機制和副作用字卡。"
    ja: "講義だけでなくワークショップも復習し、薬ごとに作用機序と副作用のカードを作りましょう。"
    ko: "강의뿐 아니라 워크숍도 복습하고, 약마다 기전과 부작용 카드를 만드세요."
    vi: "Ôn cả workshop lẫn bài giảng, và làm thẻ về cơ chế và tác dụng phụ của từng thuốc."
    ms: "Ulang kaji bengkel serta kuliah, dan buat kad tentang mekanisme dan kesan sampingan setiap ubat."
    id: "Pelajari ulang workshop juga selain kuliah, dan buat kartu mekanisme serta efek samping tiap obat."
    hi: "लेक्चर के साथ वर्कशॉप्स भी दोहराएँ, और हर दवा के मैकेनिज़्म और साइड इफेक्ट्स के कार्ड बनाएँ।"
