points:
  - en: "Very fast-paced with four lectures a week; falling behind makes it much harder."
    zh: "节奏很快，每周四节讲课，一旦落后会困难得多。"
    zh-TW: "節奏很快，每週四堂課，一旦落後會困難得多。"
    ja: "週4回の講義でペースが非常に速い。遅れるとずっと大変になる。"
    ko: "주 4회 강의로 진도가 매우 빠르다. 뒤처지면 훨씬 힘들어진다."
    vi: "Tốc độ rất nhanh với bốn bài giảng mỗi tuần; bị tụt lại thì khó hơn nhiều."
    ms: "Sangat laju dengan empat kuliah seminggu; ketinggalan menjadikannya jauh lebih sukar."
    id: "Sangat cepat dengan empat kuliah per minggu; kalau tertinggal jadi jauh lebih sulit."
    hi: "हफ्ते में चार लेक्चर, बहुत तेज़ रफ़्तार; पीछे रह गए तो काफ़ी मुश्किल हो जाता है।"
  - en: "Do all the practice problems; they are key for the exam, which carries most of the weight."
    zh: "务必做完所有练习题，这是应对占比最大的期末考试的关键。"
    zh-TW: "務必做完所有練習題，這是應付占比最大的期末考的關鍵。"
    ja: "演習問題はすべて解くこと。配点の大半を占める試験の鍵になる。"
    ko: "연습 문제를 모두 풀자. 비중 대부분을 차지하는 시험의 핵심이다."
    vi: "Làm hết bài luyện tập; đây là chìa khóa cho kỳ thi, vốn chiếm phần lớn điểm."
    ms: "Buat semua soalan latihan; ia kunci untuk peperiksaan, yang membawa sebahagian besar wajaran."
    id: "Kerjakan semua soal latihan; itu kunci untuk ujian, yang bobotnya paling besar."
    hi: "सारे प्रैक्टिस प्रॉब्लम करें; ये एग्ज़ाम की कुंजी हैं, जिसका वेट सबसे ज़्यादा है।"
  - en: "Rewarding for students who love maths, but not recommended if you were not strong at school maths."
    zh: "适合热爱数学的学生，高中数学不强的不建议选。"
    zh-TW: "適合熱愛數學的學生，高中數學不強的不建議選。"
    ja: "数学好きには得るものが大きいが、高校数学が得意でなかった人にはおすすめしない。"
    ko: "수학을 좋아하면 보람 있지만, 고등학교 수학이 약했다면 추천하지 않는다."
    vi: "Đáng học với ai mê toán, nhưng không nên chọn nếu toán phổ thông của bạn không vững."
    ms: "Berbaloi untuk pelajar yang suka matematik, tetapi tidak disyorkan jika matematik sekolah anda lemah."
    id: "Bermanfaat bagi yang suka matematika, tapi tidak disarankan kalau matematika SMA-mu kurang kuat."
    hi: "मैथ्स पसंद करने वालों के लिए फ़ायदेमंद, पर स्कूल मैथ्स में कमज़ोर थे तो सलाह नहीं दी जाती।"
  - en: "Some assessments are hard and time-consuming but worth little; the exam can have very hard questions."
    zh: "部分作业难且耗时但分值低，考试可能有很难的题。"
    zh-TW: "部分作業難又耗時但分數占比低，考試可能有很難的題目。"
    ja: "難しく時間がかかるのに配点の低い課題もある。試験には非常に難しい問題が出ることも。"
    ko: "어렵고 시간이 많이 들지만 배점이 낮은 과제도 있다. 시험엔 매우 어려운 문제가 나올 수 있다."
    vi: "Một số bài đánh giá khó, tốn thời gian mà ít điểm; đề thi có thể có câu rất khó."
    ms: "Sesetengah tugasan sukar dan memakan masa tetapi markahnya kecil; peperiksaan boleh ada soalan sangat sukar."
    id: "Beberapa tugas sulit dan makan waktu tapi bobotnya kecil; ujian bisa berisi soal yang sangat sulit."
    hi: "कुछ असेसमेंट कठिन और समय लेने वाले हैं पर मार्क्स कम; एग्ज़ाम में बहुत कठिन सवाल आ सकते हैं।"
sections:
  content:
    - en: "Fast-paced, with four lectures a week. Early topics may feel familiar from Year 12, then new material arrives quickly. Those who love maths find the content engaging and rewarding."
      zh: "节奏很快，每周四节 lecture。前面的内容可能和高三重叠，之后新东西来得很快。喜欢数学的人觉得内容有意思、很有收获。"
      zh-TW: "節奏很快，每週四堂 lecture。前面內容可能和高三重疊，之後新東西來得很快。喜歡數學的人覺得內容有趣、很有收穫。"
      ja: "ペースが速く、講義は週4回。序盤は高校の内容と重なるが、すぐに新しい内容が次々来る。数学好きには面白くやりがいがある。"
      ko: "진도가 빠르고 강의가 주 4회. 초반은 고3 내용과 겹칠 수 있지만 곧 새 내용이 빠르게 나온다. 수학을 좋아하면 흥미롭고 보람 있다."
      vi: "Tốc độ nhanh, bốn bài giảng mỗi tuần. Đầu môn có thể quen từ lớp 12, sau đó kiến thức mới đến rất nhanh. Người mê toán thấy nội dung hấp dẫn và đáng công."
      ms: "Rentak pantas, empat kuliah seminggu. Topik awal mungkin biasa dari Tahun 12, kemudian bahan baharu datang dengan cepat. Peminat matematik rasa kandungannya menarik dan berbaloi."
      id: "Tempo cepat, empat kuliah seminggu. Topik awal mungkin familiar dari kelas 12, lalu materi baru datang cepat. Pencinta matematika merasa isinya menarik dan memuaskan."
      hi: "तेज़ रफ़्तार, हफ़्ते में चार लेक्चर। शुरुआती टॉपिक Year 12 जैसे लग सकते हैं, फिर नया मटेरियल जल्दी आता है। मैथ्स पसंद करने वालों को यह दिलचस्प और फ़ायदेमंद लगता है।"
    - en: "One pure maths reviewer wished they had taken the standard pathway to have more time to take the content in; one other said not to take it if maths wasn't a strength in high school."
      zh: "有一位纯数同学希望当初走普通路线，好有时间慢慢消化；另一位说高中数学不强的话别选。"
      zh-TW: "有一位純數同學希望當初走一般路線，才有時間慢慢消化；另一位說高中數學不強的話別選。"
      ja: "純粋数学の一人は、内容をじっくり味わうため通常ルートにすればよかったと言う。高校数学が得意でないなら勧めないという人も一人。"
      ko: "순수수학 전공 한 명은 내용을 음미할 시간을 위해 일반 경로를 택할 걸 그랬다고 한다. 고등학교 수학이 강하지 않으면 비추라는 사람도 한 명."
      vi: "Một người học toán thuần túy ước gì đã chọn lộ trình thường để có thời gian thấm; một người khác nói đừng học nếu toán cấp 3 không giỏi."
      ms: "Seorang pelajar matematik tulen berharap ambil laluan biasa supaya ada masa hadam kandungan; seorang lagi kata jangan ambil jika matematik sekolah bukan kekuatan."
      id: "Satu mahasiswa matematika murni berharap ambil jalur standar agar punya waktu mencerna; satu lagi bilang jangan ambil kalau matematika SMA bukan keahlianmu."
      hi: "एक प्योर मैथ्स छात्र चाहते थे कि स्टैंडर्ड पाथवे लिया होता ताकि समझने का समय मिलता; एक और कहते हैं हाई स्कूल मैथ्स मज़बूत न हो तो न लें।"
  work:
    - en: "The exam is worth around 80% with no formula sheet, so axioms and theorems must be memorised. It usually has many accessible questions plus a few very hard ones."
      zh: "考试约占 80%，不给公式表，公理和定理都要背。一般大部分题能做，但会有几道很难的。"
      zh-TW: "考試約占 80%，不給公式表，公理和定理都要背。通常大部分題目能寫，但會有幾題很難。"
      ja: "試験は約80%で公式シートなし。公理や定理は暗記が必要。解きやすい問題が多いが、非常に難しい問題も数問ある。"
      ko: "시험이 약 80%이고 공식표가 없어 공리와 정리를 외워야 한다. 대체로 풀 만한 문제가 많고 아주 어려운 문제가 몇 개 있다."
      vi: "Bài thi chiếm khoảng 80%, không có bảng công thức nên phải thuộc tiên đề và định lý. Thường nhiều câu làm được, kèm vài câu rất khó."
      ms: "Peperiksaan kira-kira 80% tanpa helaian formula, jadi aksiom dan teorem perlu dihafal. Biasanya banyak soalan boleh dijawab serta beberapa yang sangat sukar."
      id: "Ujian sekitar 80% tanpa lembar rumus, jadi aksioma dan teorema harus dihafal. Biasanya banyak soal yang bisa dikerjakan plus beberapa yang sangat sulit."
      hi: "परीक्षा लगभग 80% की है और फ़ॉर्मूला शीट नहीं मिलती, इसलिए एक्सिओम और थ्योरम याद करने पड़ते हैं। ज़्यादातर सवाल आसान, कुछ बहुत कठिन।"
    - en: "Assignments are worth little but some are hard and time-consuming; one reviewer notes their content gets woven into lectures. Reviewers disagree on whether the MATLAB part is useful."
      zh: "作业分值很低，但有几份又难又花时间；有一位同学说作业内容会融进 lecture。MATLAB 部分有用与否，大家看法不一。"
      zh-TW: "作業配分很低，但有幾份又難又花時間；有一位同學說作業內容會融入 lecture。MATLAB 部分有沒有用，大家看法不一。"
      ja: "課題の配点は小さいが、難しく時間がかかるものもある。課題の内容が講義に織り込まれるという人が一人。MATLABが役立つかは意見が分かれる。"
      ko: "과제 배점은 작지만 일부는 어렵고 시간이 많이 든다. 과제 내용이 강의에 녹아 있다는 리뷰어가 한 명. MATLAB이 유용한지는 의견이 갈린다."
      vi: "Bài tập ít điểm nhưng vài bài khó và tốn thời gian; một người nói nội dung bài tập được lồng vào bài giảng. Ý kiến về phần MATLAB trái chiều."
      ms: "Tugasan bernilai kecil tetapi ada yang sukar dan makan masa; seorang pengulas kata isinya diselitkan dalam kuliah. Pendapat tentang bahagian MATLAB berbeza."
      id: "Tugas bobotnya kecil tapi beberapa sulit dan makan waktu; satu reviewer bilang isinya diselipkan di kuliah. Pendapat soal bagian MATLAB berbeda-beda."
      hi: "असाइनमेंट के अंक कम हैं पर कुछ कठिन और समय लेने वाले हैं; एक रिव्यूअर कहते हैं इनकी बातें लेक्चर में आती हैं। MATLAB उपयोगी है या नहीं, इस पर राय बँटी है।"
  study:
    - en: "Don't fall behind: catching up near the exam piles on work. Do all the unmarked practice and workbook questions regularly, and go to consultations early when stuck."
      zh: "千万别落下，临考再补压力会很大。不计分的练习题和 workbook 也要定期做，有疑问尽早去 consultation。"
      zh-TW: "千萬別落後，考前再補壓力會很大。不計分的練習題和 workbook 也要定期做，有疑問盡早去 consultation。"
      ja: "遅れないこと。試験直前に追いつこうとすると負担が激増する。採点されない練習問題やワークブックも定期的に解き、詰まったら早めにコンサルテーションへ。"
      ko: "뒤처지지 말자. 시험 직전에 따라잡으려면 부담이 크게 늘어난다. 채점 안 되는 연습문제와 워크북도 꾸준히 풀고, 막히면 빨리 상담 시간에 가자."
      vi: "Đừng để bị tụt lại: gần thi mới bắt kịp thì rất nặng. Làm đều mọi bài tập luyện và workbook dù không chấm, và đi consultation sớm khi bí."
      ms: "Jangan ketinggalan: mengejar dekat peperiksaan menambah beban. Buat semua soalan latihan dan buku kerja walaupun tidak dimarkah, dan hadir konsultasi awal bila buntu."
      id: "Jangan ketinggalan: mengejar menjelang ujian bikin beban menumpuk. Kerjakan rutin semua soal latihan dan workbook meski tak dinilai, dan datang konsultasi sejak awal jika bingung."
      hi: "पीछे न रहें: परीक्षा के पास पकड़ना भारी पड़ता है। बिना अंक वाले प्रैक्टिस और वर्कबुक सवाल नियमित करें, और अटकें तो जल्दी कंसल्टेशन जाएँ।"
workload: heavy
difficulty: hard
