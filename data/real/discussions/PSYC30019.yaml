code: PSYC30019
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/psyc30019
reviews: 6
from: 2018
to: 2021
checked: 2026-10-08
points:
  - en: "There is no exam; the grade comes entirely from assignments."
    zh: "没有考试，成绩全部来自作业。"
    zh-TW: "沒有考試，成績全部來自作業。"
    ja: "試験はなく、成績はすべて課題で決まります。"
    ko: "시험이 없고 성적은 전부 과제로 정해집니다."
    vi: "Không có thi; điểm hoàn toàn từ bài tập."
    ms: "Tiada peperiksaan; gred sepenuhnya daripada tugasan."
    id: "Tidak ada ujian; nilai sepenuhnya dari tugas."
    hi: "कोई एग्ज़ाम नहीं है; ग्रेड पूरी तरह असाइनमेंट्स से आता है।"
  - en: "Several reviewers said instructions and rubrics were unclear and marking was inconsistent between tutors."
    zh: "多位评价称作业说明和评分标准不清，不同导师评分不一致。"
    zh-TW: "多位評價稱作業說明和評分標準不清，不同助教評分不一致。"
    ja: "指示やルーブリックが不明確で、チューターによって採点にばらつきがあったという声が複数あります。"
    ko: "여러 후기에서 안내와 루브릭이 불분명하고 튜터마다 채점이 달랐다고 했습니다."
    vi: "Một số người nói hướng dẫn và rubric không rõ, và chấm điểm không đồng đều giữa các tutor."
    ms: "Beberapa pengulas kata arahan dan rubrik tidak jelas dan pemarkahan tidak konsisten antara tutor."
    id: "Beberapa pengulas bilang instruksi dan rubrik tidak jelas, dan penilaian antar tutor tidak konsisten."
    hi: "कई रिव्यूअर्स ने कहा कि निर्देश और रूब्रिक साफ नहीं थे और ट्यूटर्स के बीच मार्किंग असंगत थी।"
  - en: "Reviewers liked the content but found the subject poorly run, and some felt concerns went unaddressed. Background in psych writing helps."
    zh: "内容受好评但课程管理差，有人觉得意见未被重视；有心理学写作基础会更好。"
    zh-TW: "內容受好評但課程管理差，有人覺得意見未被重視；有心理學寫作基礎會更好。"
    ja: "内容は好評ですが運営が悪く、懸念が放置されたと感じた人もいます。心理学の文章を書いた経験があると役立ちます。"
    ko: "내용은 좋았지만 운영이 부실했고, 문제 제기가 해결되지 않았다는 사람도 있습니다. 심리학 글쓰기 경험이 도움이 됩니다."
    vi: "Nội dung được khen nhưng môn quản lý kém, có người thấy ý kiến không được giải quyết. Có nền tảng viết tâm lý học sẽ có lợi."
    ms: "Pengulas suka kandungannya tetapi subjek kurang teratur, dan ada yang rasa kebimbangan tidak ditangani. Latar penulisan psikologi membantu."
    id: "Pengulas suka materinya tapi pengelolaannya buruk, dan ada yang merasa keluhan tak ditanggapi. Pengalaman menulis psikologi membantu."
    hi: "रिव्यूअर्स को कंटेंट पसंद आया पर सब्जेक्ट खराब तरीके से चला, और कुछ को लगा उनकी चिंताओं पर ध्यान नहीं दिया गया। साइकोलॉजी लेखन का अनुभव मदद करता है।"
sections:
  content:
    - en: "Child and adolescent development in three streams, including ADHD, autism and neuropsychology. Most found the content interesting; one 2021 reviewer felt the ADHD and autism material was basic and outdated."
      zh: "分三部分讲儿童和青少年发展，包括多动症、自闭症和神经心理学。多数人觉得内容有趣；2021 年有同学觉得多动症和自闭症部分讲得浅、观念过时。"
      zh-TW: "分三部分講兒童和青少年發展，包括過動症、自閉症和神經心理學。多數人覺得內容有趣；2021 年有同學覺得過動症和自閉症部分講得淺、觀念過時。"
      ja: "子どもと青年の発達を3つの流れで学び、ADHD、自閉症、神経心理学も扱う。内容は面白いという声が多いが、2021年にはADHDと自閉症の内容が浅く古いという声も。"
      ko: "아동·청소년 발달을 세 갈래로 다루며 ADHD, 자폐, 신경심리도 포함한다. 대부분 내용이 흥미롭다고 했지만, 2021년 한 리뷰어는 ADHD와 자폐 내용이 얕고 낡았다고 느꼈다."
      vi: "Sự phát triển của trẻ em và thanh thiếu niên theo ba mảng, gồm ADHD, tự kỷ và tâm lý học thần kinh. Đa số thấy thú vị; một người năm 2021 thấy phần ADHD và tự kỷ sơ sài và lỗi thời."
      ms: "Perkembangan kanak-kanak dan remaja dalam tiga aliran, termasuk ADHD, autisme dan neuropsikologi. Kebanyakan rasa menarik; seorang pengulas 2021 rasa bahan ADHD dan autisme asas dan lapuk."
      id: "Perkembangan anak dan remaja dalam tiga bagian, termasuk ADHD, autisme dan neuropsikologi. Kebanyakan merasa menarik; satu pengulas 2021 merasa materi ADHD dan autisme dangkal dan usang."
      hi: "बच्चों और किशोरों का विकास तीन धाराओं में, जिनमें ADHD, ऑटिज़्म और न्यूरोसाइकोलॉजी शामिल हैं। ज़्यादातर को कंटेंट रोचक लगा; 2021 के एक रिव्यूअर को ADHD और ऑटिज़्म वाला हिस्सा सतही और पुराना लगा।"
  work:
    - en: "No exam: one assignment per stream, such as a digital poster and a clinician-style written task. Tutorials are few and short."
      zh: "没有考试：每部分一个作业，比如电子海报和以临床人员视角写的书面作业。tutorial 次数少、时间短。"
      zh-TW: "沒有考試：每部分一份作業，例如數位海報和以臨床人員視角撰寫的書面作業。tutorial 次數少、時間短。"
      ja: "試験なし。各流れに1つずつ課題があり、デジタルポスターや臨床家の立場で書く課題など。チュートリアルは回数が少なく短い。"
      ko: "시험은 없고 갈래마다 과제 하나씩, 예를 들어 디지털 포스터와 임상가 관점의 글쓰기 과제가 있다. 튜토리얼은 횟수가 적고 짧다."
      vi: "Không thi: mỗi mảng một bài, như poster điện tử và bài viết từ góc nhìn nhà lâm sàng. Tutorial ít buổi và ngắn."
      ms: "Tiada peperiksaan: satu tugasan setiap aliran, seperti poster digital dan tugasan bertulis gaya klinikal. Tutorial sedikit dan pendek."
      id: "Tanpa ujian: satu tugas per bagian, seperti poster digital dan tugas tulis ala klinisi. Tutorialnya sedikit dan singkat."
      hi: "कोई परीक्षा नहीं: हर धारा का एक असाइनमेंट, जैसे डिजिटल पोस्टर और क्लिनिशियन की तरह लिखा गया काम। ट्यूटोरियल कम और छोटे हैं।"
  watch:
    - en: "Several reviewers from 2019–21 found briefs unclear, marking beyond the rubric and dependent on your tutor, and staff unresponsive to feedback; a 2026 reviewer was very positive."
      zh: "2019–21 年好几位同学觉得作业要求不清楚，评分超出评分标准、很看 tutor，教学团队不听反馈；2026 年有同学评价很正面。"
      zh-TW: "2019–21 年好幾位同學覺得作業要求不清楚，評分超出評分標準、很看 tutor，教學團隊不聽回饋；2026 年有同學評價很正面。"
      ja: "2019〜21年には、課題説明が不明確で、採点がルーブリック外の点に及びチューター次第、教員がフィードバックに応じないという声が複数。2026年はとても好意的な声。"
      ko: "2019–21년 여러 리뷰어는 과제 안내가 불분명하고 채점이 루브릭을 벗어나며 튜터에 좌우되고 교수진이 피드백에 무응답이라고 했다. 2026년 리뷰는 매우 긍정적이다."
      vi: "Vài người năm 2019–21 thấy đề bài không rõ, chấm ngoài rubric và tùy tutor, giảng viên không tiếp thu góp ý; một người năm 2026 đánh giá rất tích cực."
      ms: "Beberapa pengulas 2019–21 dapati arahan kabur, pemarkahan melangkaui rubrik dan bergantung pada tutor, serta staf tidak responsif terhadap maklum balas; seorang pengulas 2026 sangat positif."
      id: "Beberapa pengulas 2019–21 merasa instruksi tidak jelas, penilaian di luar rubrik dan tergantung tutor, serta staf tidak tanggap umpan balik; satu pengulas 2026 sangat positif."
      hi: "2019–21 के कई रिव्यूअर्स को निर्देश अस्पष्ट, मार्किंग रूब्रिक से बाहर और ट्यूटर पर निर्भर, और स्टाफ़ फ़ीडबैक पर उदासीन लगा; 2026 का एक रिव्यूअर बहुत सकारात्मक था।"
