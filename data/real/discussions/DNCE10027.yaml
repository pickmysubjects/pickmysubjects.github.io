points:
  - en: "Although it is listed for beginners, reviewers say many classmates already dance well, so the pace is fast and true beginners struggle to keep up."
    zh: "虽然写着面向零基础，评论者说很多同学本来就会跳，进度很快，真正的新手很难跟上。"
    zh-TW: "雖然寫著適合零基礎，評論者說很多同學本來就會跳，進度很快，真正的新手很難跟上。"
    ja: "初心者向けとされるが、経験者が多く進度が速いため、本当の初心者はついていくのが大変だという声。"
    ko: "초보자용이라지만 이미 잘 추는 학생이 많아 진도가 빠르고, 진짜 초보는 따라가기 힘들다는 평."
    vi: "Dù ghi là cho người mới, nhiều bạn cùng lớp đã múa giỏi nên tiến độ nhanh, người mới thật sự khó theo kịp."
    ms: "Walaupun untuk pemula, ramai rakan sekelas sudah pandai menari, jadi rentaknya laju dan pemula sebenar sukar mengikut."
    id: "Meski untuk pemula, banyak teman sekelas sudah pandai menari, jadi tempo cepat dan pemula sungguhan sulit mengikuti."
    hi: "शुरुआती लोगों के लिए बताए जाने पर भी कई सहपाठी पहले से अच्छा नाचते हैं, इसलिए गति तेज़ है और नए लोग पिछड़ते हैं।"
  - en: "Several found the marking of routines and short essays strict, and said feedback came back too late to help with the next task."
    zh: "好几位觉得舞蹈和小论文评分严格，反馈回来得太晚，帮不上下一个作业。"
    zh-TW: "好幾位覺得舞蹈和小論文評分嚴格，回饋太晚才回來，幫不上下一份作業。"
    ja: "振付や短いレポートの採点が厳しく、フィードバックが遅くて次の課題に活かせなかったという声が複数。"
    ko: "안무와 짧은 에세이 채점이 엄격하고, 피드백이 늦어 다음 과제에 도움이 안 됐다는 의견이 여럿."
    vi: "Nhiều người thấy chấm bài múa và bài luận ngắn khắt khe, phản hồi lại đến quá muộn để giúp bài sau."
    ms: "Beberapa orang rasa pemarkahan rutin tarian dan esei pendek ketat, dan maklum balas lambat untuk membantu tugasan seterusnya."
    id: "Beberapa merasa penilaian koreografi dan esai pendek ketat, dan umpan balik datang terlambat untuk tugas berikutnya."
    hi: "कई लोगों को डांस और छोटे निबंधों की मार्किंग सख़्त लगी, और फ़ीडबैक अगले काम के लिए बहुत देर से आया।"
  - en: "One reviewer with some dance experience enjoyed it as a fun break, but said meeting your group outside class to choreograph takes time."
    zh: "一位有点舞蹈基础的评论者觉得它是轻松有趣的调剂，但课外和组员约排练很花时间。"
    zh-TW: "一位有些舞蹈基礎的評論者覺得它是輕鬆有趣的調劑，但課外和組員約排練很花時間。"
    ja: "多少経験のある人は楽しい息抜きだったが、授業外でグループと振付を合わせるのに時間がかかると言う。"
    ko: "춤 경험이 조금 있는 리뷰어는 즐거운 휴식이었지만, 수업 외에 조원과 안무 맞추는 데 시간이 든다고 함."
    vi: "Một người có chút kinh nghiệm múa thấy vui, nhưng gặp nhóm ngoài giờ để biên đạo khá tốn thời gian."
    ms: "Seorang pengulas yang ada sedikit pengalaman menari rasa ia rehat yang seronok, tetapi berjumpa kumpulan di luar kelas memakan masa."
    id: "Satu pengulas yang punya sedikit pengalaman menari merasa seru, tapi bertemu kelompok di luar kelas untuk koreografi makan waktu."
    hi: "थोड़ा नृत्य अनुभव वाले एक रिव्यूअर को यह मज़ेदार ब्रेक लगा, पर क्लास के बाहर ग्रुप के साथ कोरियोग्राफी में समय लगता है।"
difficulty: hard
