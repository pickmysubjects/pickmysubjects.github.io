points:
  - en: "The newest reviews (2020) found it disorganised: repetitive lectures, slow marks, and assignment feedback that arrived only after the exam."
    zh: "最新的评价（2020）觉得课程混乱：讲座重复，成绩出得慢，作业反馈直到考试后才发。"
    zh-TW: "最新的評價（2020）覺得課程混亂：講座重複，成績出得慢，作業回饋直到考試後才發。"
    ja: "最新のレビュー（2020年）はまとまりがないと感じた。講義は繰り返しが多く、成績返却は遅く、課題のフィードバックは試験後にしか届かなかった。"
    ko: "최신 리뷰(2020)는 체계가 없다고 봤다. 강의가 반복적이고, 성적 발표가 느리며, 과제 피드백이 시험 뒤에야 나왔다."
    vi: "Các đánh giá mới nhất (2020) thấy môn lộn xộn: bài giảng lặp lại, điểm ra chậm, và nhận xét bài tập chỉ có sau kỳ thi."
    ms: "Ulasan terbaru (2020) dapati ia tidak teratur: kuliah berulang, markah lambat, dan maklum balas tugasan tiba hanya selepas peperiksaan."
    id: "Ulasan terbaru (2020) merasa kuliah ini berantakan: materi berulang, nilai keluar lambat, dan umpan balik tugas baru datang setelah ujian."
    hi: "सबसे नए रिव्यू (2020) को यह अव्यवस्थित लगा: लेक्चर दोहराव वाले, अंक देर से, और असाइनमेंट का फ़ीडबैक परीक्षा के बाद ही आया।"
  - en: "The topic itself is widely seen as interesting; older reviews call it a fresh, well-rounded view of business ethics."
    zh: "大家普遍觉得主题本身有意思；较早的评价说它为商业伦理提供了新鲜、全面的视角。"
    zh-TW: "大家普遍覺得主題本身有意思；較早的評價說它為商業倫理提供了新鮮、全面的視角。"
    ja: "テーマ自体は面白いという声が多い。古いレビューはビジネス倫理への新鮮で幅広い視点だと評価。"
    ko: "주제 자체는 흥미롭다는 평이 많다. 예전 리뷰는 비즈니스 윤리에 대한 신선하고 폭넓은 시각이라고 했다."
    vi: "Chủ đề được nhiều người thấy thú vị; các đánh giá cũ gọi đây là góc nhìn mới mẻ, toàn diện về đạo đức kinh doanh."
    ms: "Topiknya sendiri dianggap menarik; ulasan lama menyebutnya pandangan segar dan menyeluruh tentang etika perniagaan."
    id: "Topiknya sendiri banyak dinilai menarik; ulasan lama menyebutnya pandangan segar dan menyeluruh soal etika bisnis."
    hi: "विषय ख़ुद ज़्यादातर रोचक माना गया; पुराने रिव्यू इसे व्यावसायिक नैतिकता पर ताज़ा और व्यापक नज़रिया कहते हैं।"
  - en: "Assessment is essays and reports needing solid theory and critical thinking; take it only if the topic genuinely interests you."
    zh: "考核是论文和报告，需要扎实的理论和批判性思维；真有兴趣再选。"
    zh-TW: "考核是論文和報告，需要扎實的理論和批判性思考；真有興趣再選。"
    ja: "評価はエッセイとレポートで、理論の理解と批判的思考が必要。テーマに本当に興味がある場合に取ろう。"
    ko: "평가는 에세이와 보고서로, 탄탄한 이론과 비판적 사고가 필요하다. 주제에 정말 관심 있을 때 듣자."
    vi: "Đánh giá bằng bài luận và báo cáo, cần nắm chắc lý thuyết và tư duy phản biện; chỉ nên học nếu thật sự quan tâm chủ đề."
    ms: "Penilaian ialah esei dan laporan yang perlukan teori kukuh dan pemikiran kritis; ambil hanya jika benar-benar berminat."
    id: "Penilaian berupa esai dan laporan yang butuh teori kuat dan berpikir kritis; ambil hanya jika benar-benar tertarik topiknya."
    hi: "मूल्यांकन निबंध और रिपोर्ट से है, जिनमें मज़बूत थ्योरी और आलोचनात्मक सोच चाहिए; तभी लें जब विषय में सच्ची रुचि हो।"
