code: MKTG30012
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/mktg30012
reviews: 5
from: 2017
to: 2020
checked: 2026-10-14
points:
  - en: "The newest reviews (2020) found it disorganised: repetitive lectures, slow marks, and assignment feedback that arrived only after the exam."
    zh: "最新的评价（2020）觉得课程混乱：讲座重复，成绩出得慢，作业反馈直到考试后才发。"
    zh-TW: "最新的評價（2020）覺得課程混亂：講座重複，成績出得慢，作業回饋直到考試後才發。"
    ja: "最新のレビュー（2020年）はまとまりがないと感じた。講義は繰り返しが多く、成績返却は遅く、課題のフィードバックは試験後にしか届かなかった。"
    ko: "최신 리뷰(2020)는 체계가 없다고 봤다. 강의가 반복적이고, 성적 발표가 느리며, 과제 피드백이 시험 뒤에야 나왔다."
    vi: "Các đánh giá mới nhất (2020) thấy môn lộn xộn: bài giảng lặp lại, điểm ra chậm, và nhận xét bài tập chỉ có sau kỳ thi."
    ms: "Ulasan terbaru (2020) dapati ia tidak teratur: kuliah berulang, markah lambat, dan maklum balas tugasan tiba hanya selepas peperiksaan."
    id: "Ulasan terbaru (2020) merasa kuliah ini berantakan: materi berulang, nilai keluar lambat, dan umpan balik tugas baru datang setelah ujian."
    hi: "सबसे नए रिव्यू (2020) को यह अव्यवस्थित लगा: लेक्चर दोहराव वाले, अंक देर से, और असाइनमेंट का फ़ीडबैक परीक्षा के बाद ही आया।"
  - en: "The topic itself is widely seen as interesting; older reviews call it a fresh, well-rounded view of business ethics."
    zh: "大家普遍觉得主题本身有意思；较早的评价说它为商业伦理提供了新鲜、全面的视角。"
    zh-TW: "大家普遍覺得主題本身有意思；較早的評價說它為商業倫理提供了新鮮、全面的視角。"
    ja: "テーマ自体は面白いという声が多い。古いレビューはビジネス倫理への新鮮で幅広い視点だと評価。"
    ko: "주제 자체는 흥미롭다는 평이 많다. 예전 리뷰는 비즈니스 윤리에 대한 신선하고 폭넓은 시각이라고 했다."
    vi: "Chủ đề được nhiều người thấy thú vị; các đánh giá cũ gọi đây là góc nhìn mới mẻ, toàn diện về đạo đức kinh doanh."
    ms: "Topiknya sendiri dianggap menarik; ulasan lama menyebutnya pandangan segar dan menyeluruh tentang etika perniagaan."
    id: "Topiknya sendiri banyak dinilai menarik; ulasan lama menyebutnya pandangan segar dan menyeluruh soal etika bisnis."
    hi: "विषय ख़ुद ज़्यादातर रोचक माना गया; पुराने रिव्यू इसे व्यावसायिक नैतिकता पर ताज़ा और व्यापक नज़रिया कहते हैं।"
  - en: "Assessment is essays and reports needing solid theory and critical thinking; take it only if the topic genuinely interests you."
    zh: "考核是论文和报告，需要扎实的理论和批判性思维；真有兴趣再选。"
    zh-TW: "考核是論文和報告，需要扎實的理論和批判性思考；真有興趣再選。"
    ja: "評価はエッセイとレポートで、理論の理解と批判的思考が必要。テーマに本当に興味がある場合に取ろう。"
    ko: "평가는 에세이와 보고서로, 탄탄한 이론과 비판적 사고가 필요하다. 주제에 정말 관심 있을 때 듣자."
    vi: "Đánh giá bằng bài luận và báo cáo, cần nắm chắc lý thuyết và tư duy phản biện; chỉ nên học nếu thật sự quan tâm chủ đề."
    ms: "Penilaian ialah esei dan laporan yang perlukan teori kukuh dan pemikiran kritis; ambil hanya jika benar-benar berminat."
    id: "Penilaian berupa esai dan laporan yang butuh teori kuat dan berpikir kritis; ambil hanya jika benar-benar tertarik topiknya."
    hi: "मूल्यांकन निबंध और रिपोर्ट से है, जिनमें मज़बूत थ्योरी और आलोचनात्मक सोच चाहिए; तभी लें जब विषय में सच्ची रुचि हो।"
sections:
  content:
    - en: "Ethical challenges in business and marketing, from sweatshops to green products. Earlier reviewers found it inspiring; 2020 reviewers found lectures unstructured and full of news articles."
      zh: "讲商业和营销中的伦理问题，从血汗工厂到绿色产品。早期同学觉得很有启发；2020 年的同学觉得讲课没结构，塞满新闻报道。"
      zh-TW: "講商業和行銷中的倫理問題，從血汗工廠到綠色產品。早期同學覺得很有啟發；2020 年的同學覺得講課沒結構，塞滿新聞報導。"
      ja: "搾取工場からグリーン製品まで、ビジネスとマーケティングの倫理的課題。以前は刺激的と好評だったが、2020年のレビューは講義に構成がなくニュース記事ばかりだと言う。"
      ko: "착취 공장부터 친환경 제품까지 비즈니스와 마케팅의 윤리 문제. 예전 리뷰는 영감을 준다고 했지만, 2020년 리뷰는 강의가 구조 없이 뉴스 기사로 가득하다고 했다."
      vi: "Thách thức đạo đức trong kinh doanh và marketing, từ xưởng bóc lột đến sản phẩm xanh. Người học trước thấy truyền cảm hứng; năm 2020 thấy bài giảng thiếu cấu trúc, toàn tin tức báo chí."
      ms: "Cabaran etika dalam perniagaan dan pemasaran, dari kilang peluh hingga produk hijau. Pengulas awal rasa memberi inspirasi; pengulas 2020 rasa kuliah tidak tersusun dan penuh artikel berita."
      id: "Tantangan etika dalam bisnis dan pemasaran, dari pabrik eksploitatif hingga produk hijau. Pengulas awal merasa menginspirasi; pengulas 2020 merasa kuliah tak terstruktur dan penuh artikel berita."
      hi: "स्वेटशॉप से लेकर ग्रीन प्रोडक्ट तक, बिज़नेस और मार्केटिंग की नैतिक चुनौतियाँ। पहले के रिव्यूअर्स को प्रेरक लगा; 2020 वालों को लेक्चर बिना ढाँचे के और ख़बरों से भरे लगे।"
  work:
    - en: "Highly qualitative essays and reports needing critical perspectives. In 2020, assignment feedback came only after the exam and marks were slow."
      zh: "以质性的论文和报告为主，需要批判性观点。2020 年作业反馈到考完才发，出分也很慢。"
      zh-TW: "以質性的論文和報告為主，需要批判性觀點。2020 年作業回饋到考完才發，出分也很慢。"
      ja: "批判的な視点が求められる質的なエッセイとレポート中心。2020年は課題のフィードバックが試験後で、成績発表も遅かった。"
      ko: "비판적 관점이 필요한 정성적 에세이와 보고서 위주. 2020년엔 과제 피드백이 시험 후에야 나왔고 점수 발표도 늦었다."
      vi: "Chủ yếu là bài luận và báo cáo định tính cần góc nhìn phản biện. Năm 2020 phản hồi bài tập chỉ có sau kỳ thi và điểm ra chậm."
      ms: "Esei dan laporan kualitatif yang perlukan perspektif kritis. Pada 2020 maklum balas tugasan hanya selepas peperiksaan dan markah lambat."
      id: "Esai dan laporan kualitatif yang butuh sudut pandang kritis. Pada 2020 umpan balik tugas baru keluar setelah ujian dan nilai lambat."
      hi: "आलोचनात्मक दृष्टिकोण माँगने वाले गुणात्मक निबंध और रिपोर्ट। 2020 में असाइनमेंट फ़ीडबैक परीक्षा के बाद ही आया और अंक देर से मिले।"
  watch:
    - en: "All three 2020 reviewers call it poorly organised with slow email replies; one still got an H1 but says take it only if the topic really interests you."
      zh: "三位 2020 年的同学都说组织很差、邮件回复慢；其中一位仍拿了 H1，但说只有真感兴趣才选。"
      zh-TW: "三位 2020 年的同學都說組織很差、郵件回覆慢；其中一位仍拿了 H1，但說只有真的有興趣才選。"
      ja: "2020年の3人とも運営がまずくメールの返信が遅いと言う。うち一人はH1を取ったが、本当に興味がある場合だけ取るべきだと言う。"
      ko: "2020년 리뷰 세 명 모두 운영이 엉망이고 이메일 답장이 느렸다고 한다. 그중 한 명은 H1을 받았지만 정말 관심 있을 때만 들으라고 한다."
      vi: "Cả ba người năm 2020 đều nói tổ chức kém, trả lời email chậm; một người vẫn được H1 nhưng khuyên chỉ học nếu thật sự thích chủ đề."
      ms: "Ketiga-tiga pengulas 2020 kata ia tidak teratur dengan balasan e-mel lambat; seorang tetap dapat H1 tetapi kata ambil hanya jika benar-benar berminat."
      id: "Ketiga pengulas 2020 bilang pengaturannya buruk dan balasan email lambat; satu tetap dapat H1 tapi bilang ambil hanya jika benar-benar tertarik."
      hi: "2020 के तीनों रिव्यूअर्स इसे अव्यवस्थित और ईमेल के धीमे जवाब वाला बताते हैं; एक को फिर भी H1 मिला पर वह कहता है तभी लें जब विषय में सचमुच रुचि हो।"
    - en: "All these reviews are from 2020 or earlier; teaching and exams may have changed since."
      zh: "这些评价都是 2020 年或更早的，现在的教法和考试可能已经变了。"
      zh-TW: "這些評價都是 2020 年或更早的，現在的教法和考試可能已經變了。"
      ja: "レビューはすべて2020年以前のもの。授業や試験は変わっている可能性がある。"
      ko: "모든 리뷰가 2020년 이전 것이라 지금 수업과 시험은 달라졌을 수 있다."
      vi: "Tất cả đánh giá đều từ năm 2020 trở về trước; cách dạy và thi có thể đã thay đổi."
      ms: "Semua ulasan ini dari 2020 atau lebih awal; pengajaran dan peperiksaan mungkin telah berubah."
      id: "Semua ulasan ini dari 2020 atau sebelumnya; pengajaran dan ujian mungkin sudah berubah."
      hi: "ये सभी रिव्यू 2020 या उससे पहले के हैं; पढ़ाई और परीक्षा अब बदल चुकी हो सकती है।"
