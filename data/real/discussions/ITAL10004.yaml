from: 2014
to: 2024
checked: 2026-10-17
points:
  - en: "A consistently well-liked beginners' Italian course (2014-2024): well organised, friendly tutors, and some everyday colloquial Italian too."
    zh: "一直很受欢迎的意大利语入门课（2014-2024）：组织得好，老师友善，还会学些日常口语。"
    zh-TW: "一直很受歡迎的義大利語入門課（2014-2024）：組織得好，老師友善，還會學些日常口語。"
    ja: "2014〜2024年を通して好評のイタリア語入門。運営がよく、チューターも親切で、日常の口語表現も学べる。"
    ko: "2014~2024년 꾸준히 호평받는 이탈리아어 입문. 운영이 잘 되고 튜터가 친절하며 일상 구어 표현도 배움."
    vi: "Môn tiếng Ý nhập môn luôn được yêu thích (2014-2024): tổ chức tốt, tutor thân thiện, còn học cả khẩu ngữ đời thường."
    ms: "Kursus Itali pemula yang sentiasa disukai (2014-2024): teratur, tutor mesra, dan ada sedikit bahasa Itali harian."
    id: "Kursus bahasa Italia pemula yang selalu disukai (2014-2024): tertata, tutornya ramah, dan ada bahasa sehari-hari juga."
    hi: "2014-2024 तक लगातार पसंद किया गया शुरुआती इतालवी कोर्स: अच्छी तरह व्यवस्थित, दोस्ताना ट्यूटर्स, और कुछ रोज़मर्रा की बोलचाल भी।"
  - en: "It is easy to score well if you participate, review weekly and practise for the oral; the two-hour tutorials are the only real downside mentioned."
    zh: "只要积极参与、每周复习、准备好口试，就容易拿高分；唯一被提到的缺点是每周两小时的辅导课。"
    zh-TW: "只要積極參與、每週複習、準備好口試，就容易拿高分；唯一被提到的缺點是每週兩小時的輔導課。"
    ja: "参加して毎週復習し、口頭試験の練習をすれば高得点は取りやすい。挙がった欠点は2時間のチュートリアルくらい。"
    ko: "참여하고 매주 복습하며 구술시험을 연습하면 고득점이 쉬움. 언급된 단점은 2시간짜리 튜토리얼 정도."
    vi: "Dễ đạt điểm cao nếu tham gia, ôn hằng tuần và luyện cho bài thi nói; nhược điểm duy nhất được nhắc là tutorial hai tiếng."
    ms: "Mudah skor tinggi jika anda mengambil bahagian, mengulang kaji setiap minggu dan berlatih untuk lisan; satu-satunya kelemahan yang disebut ialah tutorial dua jam."
    id: "Mudah dapat nilai bagus kalau aktif, mengulang tiap minggu, dan berlatih untuk ujian lisan; satu-satunya kekurangan yang disebut adalah tutorial dua jam."
    hi: "भाग लें, हर हफ़्ते दोहराएँ और मौखिक परीक्षा का अभ्यास करें तो अच्छे अंक आसान हैं; बताई गई इकलौती कमी दो घंटे के ट्यूटोरियल हैं।"
sections:
  content:
    - en: "A well-organised beginners' Italian subject that also covers everyday expressions. Reviewers say it's fairly easy to score well if you join in and practise."
      zh: "组织得很好的意大利语入门课，也教日常口语表达。同学说只要多参与、多练习，拿高分不算难。"
      zh-TW: "組織得很好的義大利語入門課，也教日常口語表達。同學說只要多參與、多練習，拿高分不算難。"
      ja: "よく整理された初心者向けイタリア語で、日常的な言い回しも学ぶ。参加して練習すれば高得点は比較的取りやすいという。"
      ko: "잘 짜인 초급 이탈리아어 과목으로 일상 표현도 배운다. 참여하고 연습하면 고득점이 비교적 쉽다는 평."
      vi: "Môn tiếng Ý cho người mới, tổ chức tốt, có cả cách nói hằng ngày. Người học nói chỉ cần tham gia và luyện tập thì khá dễ đạt điểm cao."
      ms: "Subjek bahasa Itali pemula yang tersusun baik, turut merangkumi ungkapan harian. Pengulas kata agak mudah dapat markah tinggi jika aktif dan berlatih."
      id: "Mata kuliah bahasa Italia pemula yang tertata baik, juga mencakup ungkapan sehari-hari. Pengulas bilang cukup mudah dapat nilai bagus jika aktif dan berlatih."
      hi: "शुरुआती लोगों के लिए अच्छी तरह व्यवस्थित इतालवी विषय, जिसमें रोज़मर्रा के मुहावरे भी हैं। रिव्यूअर्स कहते हैं भाग लें और अभ्यास करें तो अच्छे अंक आसान हैं।"
  study:
    - en: "One reviewer says to prepare answers to the oral questions you're given, since they're used in the real oral, and to review each week with practice questions or flashcards."
      zh: "有同学说要提前准备好给出的口语题答案，正式口试真的会用；每周复习，多做练习题或用 Quizlet 卡片。"
      zh-TW: "有同學說要先準備好給的口說題答案，正式口試真的會用；每週複習，多做練習題或用 Quizlet 字卡。"
      ja: "配られる口頭試験の質問への答えを準備しておくこと（本番で実際に使われる）、毎週練習問題や単語カードで復習することを一人が勧める。"
      ko: "주어지는 말하기 질문에 대한 답을 미리 준비하라(실제 시험에 나온다), 매주 연습 문제나 플래시카드로 복습하라고 한 리뷰가 말한다."
      vi: "Một người khuyên chuẩn bị sẵn câu trả lời cho các câu hỏi nói được phát (thi thật dùng đúng câu đó), và ôn mỗi tuần bằng bài luyện hoặc thẻ từ."
      ms: "Seorang pengulas kata sediakan jawapan untuk soalan lisan yang diberi kerana ia digunakan dalam ujian lisan sebenar, dan ulang kaji setiap minggu dengan soalan latihan atau kad imbas."
      id: "Satu pengulas bilang siapkan jawaban untuk soal lisan yang diberikan karena dipakai di ujian lisan sungguhan, dan ulas tiap minggu dengan latihan soal atau flashcard."
      hi: "एक रिव्यूअर कहता है दिए गए मौखिक सवालों के जवाब पहले से तैयार करें, क्योंकि असली मौखिक परीक्षा में वही आते हैं, और हर हफ़्ते अभ्यास सवालों या फ़्लैशकार्ड से दोहराएँ।"
  watch:
    - en: "One reviewer's only complaint is the two-hour tutorial every week. It's easy to slack off, so keep up weekly."
      zh: "有同学唯一的抱怨是每周两小时的 tutorial。很容易偷懒，要每周跟上。"
      zh-TW: "有同學唯一的抱怨是每週兩小時的 tutorial。很容易偷懶，要每週跟上。"
      ja: "毎週2時間のチュートリアルが唯一の不満という人がいる。怠けやすいので毎週ついていくこと。"
      ko: "한 리뷰의 유일한 불만은 매주 2시간짜리 튜토리얼. 게을러지기 쉬우니 매주 따라가야 한다."
      vi: "Một người chỉ phàn nàn về tutorial hai tiếng mỗi tuần. Rất dễ lơ là nên phải theo kịp hằng tuần."
      ms: "Satu-satunya rungutan seorang pengulas ialah tutorial dua jam setiap minggu. Mudah culas, jadi ikuti setiap minggu."
      id: "Satu-satunya keluhan satu pengulas adalah tutorial dua jam tiap minggu. Mudah malas, jadi ikuti tiap minggu."
      hi: "एक रिव्यूअर की इकलौती शिकायत हर हफ़्ते दो घंटे का ट्यूटोरियल है। ढील देना आसान है, इसलिए हर हफ़्ते साथ बने रहें।"
difficulty: easy
