code: GEOG20001
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/geog20001
reviews: 5
from: 2016
to: 2022
checked: 2026-10-08
points:
  - en: "Very theoretical and more sociology than geography; suits students comfortable with arts-style content."
    zh: "理论性很强，更像社会学而非地理学，适合习惯文科内容的学生。"
    zh-TW: "理論性很強，比較像社會學而不是地理學，適合習慣文科內容的學生。"
    ja: "非常に理論的で地理学より社会学寄り。文系の内容に慣れた学生向け。"
    ko: "매우 이론적이고 지리학보다 사회학에 가까워, 인문 계열 내용에 익숙한 학생에게 맞음."
    vi: "Rất lý thuyết, giống xã hội học hơn địa lý; hợp với sinh viên quen nội dung kiểu xã hội."
    ms: "Sangat teori dan lebih kepada sosiologi berbanding geografi; sesuai pelajar yang selesa dengan kandungan gaya sastera."
    id: "Sangat teoretis dan lebih mirip sosiologi daripada geografi; cocok bagi yang nyaman dengan materi gaya humaniora."
    hi: "काफ़ी थ्योरी वाला और ज्योग्राफ़ी से ज़्यादा सोशियोलॉजी जैसा; आर्ट्स-स्टाइल कंटेंट में सहज स्टूडेंट्स के लिए ठीक।"
  - en: "Assessment criteria and feedback are repeatedly described as vague, making a high mark hard."
    zh: "考核标准和反馈多次被指模糊，较难拿高分。"
    zh-TW: "考核標準和回饋多次被指模糊，很難拿高分。"
    ja: "評価基準とフィードバックが曖昧だと繰り返し指摘され、高得点は難しい。"
    ko: "평가 기준과 피드백이 모호하다는 지적이 반복되어 높은 점수를 받기 어려움."
    vi: "Tiêu chí chấm và phản hồi nhiều lần bị nói là mơ hồ, khiến khó đạt điểm cao."
    ms: "Kriteria penilaian dan maklum balas berulang kali dikatakan kabur, menyukarkan markah tinggi."
    id: "Kriteria penilaian dan umpan balik berulang kali disebut samar, sehingga sulit dapat nilai tinggi."
    hi: "असेसमेंट के मानदंड और फ़ीडबैक को बार-बार अस्पष्ट बताया गया, जिससे ऊँचे मार्क्स लाना मुश्किल है।"
  - en: "Workload is light and tutorials can be engaging; assessments rely more on readings than lectures."
    zh: "工作量轻，辅导课讨论较有意思；考核更依赖阅读材料而非讲课。"
    zh-TW: "工作量輕，小組討論課可能蠻有意思；考核比較依賴閱讀資料而不是講課。"
    ja: "負担は軽く、チュートリアルは面白いことも。評価は講義よりリーディング重視。"
    ko: "부담이 가볍고 튜토리얼은 흥미로울 수 있으며, 평가는 강의보다 읽기 자료에 더 의존함."
    vi: "Khối lượng nhẹ, tutorial có thể thú vị; bài đánh giá dựa vào tài liệu đọc nhiều hơn bài giảng."
    ms: "Beban kerja ringan dan tutorial boleh menarik; penilaian lebih bergantung pada bacaan daripada kuliah."
    id: "Beban kerja ringan dan tutorial bisa menarik; penilaian lebih bergantung pada bacaan daripada kuliah."
    hi: "वर्कलोड हल्का है और ट्यूटोरियल दिलचस्प हो सकते हैं; असेसमेंट लेक्चर से ज़्यादा रीडिंग पर टिके हैं।"
sections:
  content:
    - en: "Theoretical, closer to sociology than geography, with ideas like dualism and embodiment. Some found it fascinating with fun tutorial discussions; others found it vague with little solid content."
      zh: "偏理论，更像社会学而不是地理，会讲二元论、具身性等概念。有人觉得很精彩、tutorial 讨论有趣；也有人觉得空泛、没什么实在内容。"
      zh-TW: "偏理論，更像社會學而不是地理，會講二元論、具身性等概念。有人覺得很精彩、tutorial 討論有趣；也有人覺得空泛、沒什麼實在內容。"
      ja: "理論的で地理より社会学に近く、二元論や身体性などの概念を扱う。魅力的でチュートリアルの議論も楽しいという人もいれば、あいまいで中身が薄いという人も。"
      ko: "이론적이고 지리보다 사회학에 가까우며 이원론, 체화 같은 개념을 다룬다. 매혹적이고 튜토리얼 토론이 재미있다는 사람도, 모호하고 실속 없다는 사람도 있다."
      vi: "Thiên lý thuyết, gần xã hội học hơn địa lý, với các ý như nhị nguyên và tính hiện thân. Có người thấy cuốn hút, thảo luận tutorial vui; người khác thấy mơ hồ, ít nội dung chắc."
      ms: "Berteori, lebih dekat dengan sosiologi daripada geografi, dengan idea seperti dualisme dan penjelmaan. Ada yang rasa menarik dengan perbincangan tutorial seronok; ada yang rasa kabur dan kurang isi."
      id: "Teoretis, lebih dekat ke sosiologi daripada geografi, dengan gagasan seperti dualisme dan embodiment. Ada yang merasa memukau dengan diskusi tutorial seru; ada yang merasa samar dan kurang isi."
      hi: "सैद्धांतिक, भूगोल से ज़्यादा समाजशास्त्र जैसा, द्वैतवाद और देहबोध जैसे विचारों के साथ। कुछ को आकर्षक और ट्यूटोरियल चर्चा मज़ेदार लगी; कुछ को अस्पष्ट और कम ठोस सामग्री वाला।"
  work:
    - en: "Assessments, including a field report with observations, are based mostly on readings and well spread out. Several found criteria and feedback vague and an H1 hard, though one says reading the rubric closely helps."
      zh: "考核（包括要做观察的实地报告）主要基于阅读，时间分布合理。好几位觉得评分标准和反馈模糊、H1 难拿，不过有人说仔细看评分标准会有帮助。"
      zh-TW: "考核（包括要做觀察的田野報告）主要根據閱讀，時間分布合理。好幾位覺得評分標準和回饋模糊、H1 難拿，不過有人說仔細看評分標準會有幫助。"
      ja: "観察を伴うフィールドレポートを含む課題は主にリーディングに基づき、時期もよく分散。基準とフィードバックがあいまいでH1は難しいという声が複数だが、ルーブリックをよく読むと助かるという人も。"
      ko: "관찰이 들어가는 현장 보고서를 포함한 과제는 주로 리딩 기반이고 일정이 잘 분산돼 있다. 기준과 피드백이 모호하고 H1이 어렵다는 평이 여럿이지만, 루브릭을 꼼꼼히 보면 도움이 된다는 사람도 있다."
      vi: "Bài đánh giá, gồm báo cáo thực địa có quan sát, chủ yếu dựa vào bài đọc và rải đều. Nhiều người thấy tiêu chí và phản hồi mơ hồ, khó đạt H1, dù một người nói đọc kỹ rubric sẽ giúp."
      ms: "Penilaian, termasuk laporan lapangan dengan pemerhatian, kebanyakannya berdasarkan bacaan dan tersebar baik. Beberapa rasa kriteria dan maklum balas kabur dan H1 sukar, walaupun seorang kata membaca rubrik dengan teliti membantu."
      id: "Penilaian, termasuk laporan lapangan dengan observasi, sebagian besar berbasis bacaan dan tersebar baik. Beberapa merasa kriteria dan umpan balik samar dan H1 sulit, meski satu bilang membaca rubrik dengan teliti membantu."
      hi: "आकलन, जिनमें अवलोकन वाली फ़ील्ड रिपोर्ट है, ज़्यादातर रीडिंग पर आधारित और अच्छे से फैले हैं। कई को मानदंड और फ़ीडबैक अस्पष्ट और H1 कठिन लगा, हालाँकि एक कहता है रूब्रिक ध्यान से पढ़ना मदद करता है।"
  watch:
    - en: "Lectures have little to do with the assessments. Most reviews are from 2017 or earlier, with one from 2022, so it may have changed."
      zh: "讲课和考核关系不大。大部分评价是 2017 年或更早的，只有一条是 2022 年，课程可能已经变了。"
      zh-TW: "講課和考核關係不大。大部分評價是 2017 年或更早的，只有一則是 2022 年，課程可能已經變了。"
      ja: "講義は課題とあまり関係がない。レビューの多くは2017年以前で2022年のものは1件のみ。内容が変わっている可能性がある。"
      ko: "강의는 평가와 별 관련이 없다. 리뷰 대부분이 2017년 이전이고 2022년 것은 하나뿐이라 바뀌었을 수 있다."
      vi: "Bài giảng ít liên quan đến bài đánh giá. Phần lớn đánh giá từ 2017 trở về trước, chỉ một từ 2022, nên môn có thể đã đổi."
      ms: "Kuliah kurang berkait dengan penilaian. Kebanyakan ulasan dari 2017 atau lebih awal, satu dari 2022, jadi mungkin telah berubah."
      id: "Kuliah tidak banyak terkait dengan penilaian. Sebagian besar ulasan dari 2017 atau sebelumnya, satu dari 2022, jadi mungkin sudah berubah."
      hi: "लेक्चर का आकलन से कम संबंध है। ज़्यादातर रिव्यू 2017 या पहले के हैं, एक 2022 का, तो विषय बदल गया हो सकता है।"
difficulty: hard
