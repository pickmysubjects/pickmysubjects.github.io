points:
  - en: "Reviewers found the content very interesting, with guest lecturers and research-based material."
    zh: "评价认为内容非常有趣，有客座讲师和基于科研论文的材料。"
    zh-TW: "評論者覺得內容非常有趣，有客座講師和以研究為基礎的教材。"
    ja: "ゲスト講師や研究に基づいた教材があり、内容がとても面白いと評価されている。"
    ko: "게스트 강사와 연구 기반 자료가 있어 내용이 매우 흥미롭다는 평이다."
    vi: "Người đánh giá thấy nội dung rất thú vị, có giảng viên khách mời và tài liệu dựa trên nghiên cứu."
    ms: "Pengulas dapati kandungan sangat menarik, dengan pensyarah jemputan dan bahan berasaskan penyelidikan."
    id: "Pengulas menilai materinya sangat menarik, dengan dosen tamu dan bahan berbasis riset."
    hi: "रिव्यूअर्स को कंटेंट बहुत दिलचस्प लगा, जिसमें गेस्ट लेक्चरर और रिसर्च-आधारित मटेरियल है।"
  - en: "Assessments and exams were seen as fair, and several said an H1 is quite reachable."
    zh: "考核和考试被认为公平，多位表示较容易拿到H1。"
    zh-TW: "評量和考試被認為公平，幾位說H1相當容易拿。"
    ja: "評価課題も試験も公平とされ、H1は十分狙えるという声が複数ある。"
    ko: "평가와 시험은 공정하다는 평이고, 여러 명이 H1도 꽤 가능하다고 했다."
    vi: "Bài đánh giá và bài thi được xem là công bằng, và vài người nói H1 khá dễ đạt."
    ms: "Penilaian dan peperiksaan dianggap adil, dan beberapa orang kata H1 agak mudah dicapai."
    id: "Penilaian dan ujian dianggap adil, dan beberapa bilang H1 cukup mudah diraih."
    hi: "असेसमेंट और परीक्षा निष्पक्ष मानी गईं, और कई लोगों ने कहा कि H1 काफ़ी संभव है।"
  - en: "Lectures pack in a lot of information and the readings can feel daunting at first. The workload is significant, so take it if the topic interests you."
    zh: "讲座信息量大，论文阅读起初可能令人畏惧；工作量不小，建议对该领域感兴趣再选。"
    zh-TW: "講課資訊量很大，一開始讀文獻可能讓人卻步。工作量不小，對主題有興趣再修。"
    ja: "講義は情報量が多く、文献購読も最初は大変に感じる。負担は大きいので、テーマに興味があれば取ろう。"
    ko: "강의는 정보량이 많고 읽기 자료도 처음엔 부담스럽다. 공부량이 상당하니 주제에 관심이 있으면 듣자."
    vi: "Bài giảng chứa rất nhiều thông tin và phần đọc lúc đầu có thể làm bạn ngợp. Khối lượng khá lớn, nên học nếu bạn thích chủ đề."
    ms: "Kuliah padat dengan maklumat dan bacaan mungkin menakutkan pada mulanya. Beban kerja besar, jadi ambil jika topik menarik minat anda."
    id: "Kuliahnya padat informasi dan bacaannya bisa terasa menakutkan di awal. Bebannya besar, jadi ambil kalau topiknya menarik bagimu."
    hi: "लेक्चर में बहुत जानकारी होती है और रीडिंग शुरू में भारी लग सकती है। वर्कलोड काफ़ी है, इसलिए टॉपिक में रुचि हो तो लें।"
workload: heavy
