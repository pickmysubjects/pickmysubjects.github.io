points:
  - en: "Most reviewers found it easy to get good marks, especially if you write well; the assignments feel like personal reflections rather than dry essays."
    zh: "多数评论者认为拿高分不难，尤其是擅长写作的人；作业更像个人反思而非枯燥论文。"
    zh-TW: "多數評論者認為拿高分不難，尤其是擅長寫作的人；作業更像個人反思而非枯燥論文。"
    ja: "文章が得意なら高得点を取りやすいという声が多い。課題は堅い論文より個人的な振り返りに近い。"
    ko: "글을 잘 쓰면 좋은 점수를 받기 쉽다는 평이 많음. 과제는 딱딱한 에세이보다 개인 성찰에 가까움."
    vi: "Đa số thấy dễ đạt điểm cao, nhất là nếu viết tốt; bài tập giống phản tư cá nhân hơn là tiểu luận khô khan."
    ms: "Kebanyakan pengulas kata mudah dapat markah baik jika pandai menulis; tugasan lebih seperti refleksi peribadi."
    id: "Mayoritas pengulas bilang mudah dapat nilai bagus kalau pandai menulis; tugasnya lebih mirip refleksi pribadi."
    hi: "ज़्यादातर रिव्यूअर्स के अनुसार अच्छा लिखने वालों के लिए अच्छे अंक आसान हैं; असाइनमेंट निजी चिंतन जैसे हैं।"
  - en: "The volunteer tutoring is a highlight, giving real experience with students, which suits anyone thinking about teaching."
    zh: "志愿辅导是一大亮点，能真正接触学生，适合考虑当老师的人。"
    zh-TW: "志工輔導是一大亮點，能真正接觸學生，適合考慮當老師的人。"
    ja: "ボランティアの学習支援が魅力で、実際に生徒と関われる。教職を考える人に向く。"
    ko: "봉사 튜터링이 큰 장점으로 실제 학생을 만나 볼 수 있어 교사 지망생에게 좋음."
    vi: "Dạy kèm tình nguyện là điểm sáng, cho trải nghiệm thật với học sinh, hợp với ai muốn làm giáo viên."
    ms: "Tunjuk ajar sukarela ialah kemuncak, memberi pengalaman sebenar dengan pelajar, sesuai bagi bakal guru."
    id: "Les relawan jadi sorotan, memberi pengalaman nyata dengan murid, cocok bagi yang ingin jadi guru."
    hi: "स्वयंसेवी ट्यूशन इसकी ख़ास बात है, छात्रों के साथ असली अनुभव मिलता है, शिक्षक बनने वालों के लिए अच्छा।"
  - en: "Opinions on lectures are mixed, from engaging to boring, and one recent reviewer said assessment expectations were unclear."
    zh: "对讲座评价不一，有人觉得有趣，有人觉得无聊；最近一位说作业要求不够清楚。"
    zh-TW: "對講座評價不一，有人覺得有趣，有人覺得無聊；最近一位說作業要求不夠清楚。"
    ja: "講義の評価は面白いから退屈まで分かれる。最近の人は課題の要求が不明確だったと言う。"
    ko: "강의 평은 흥미롭다부터 지루하다까지 엇갈림. 최근 리뷰어는 과제 기준이 불명확했다고 함."
    vi: "Ý kiến về bài giảng trái chiều, từ hấp dẫn đến nhàm chán; một người gần đây nói yêu cầu bài tập chưa rõ."
    ms: "Pandangan tentang kuliah bercampur; seorang pengulas terkini kata jangkaan tugasan kurang jelas."
    id: "Pendapat soal kuliah beragam, dari menarik hingga membosankan; satu pengulas terbaru bilang ekspektasi tugas kurang jelas."
    hi: "लेक्चर पर राय मिली-जुली है; हाल के एक रिव्यूअर ने कहा असाइनमेंट की अपेक्षाएँ साफ़ नहीं थीं।"
workload: light
difficulty: easy
