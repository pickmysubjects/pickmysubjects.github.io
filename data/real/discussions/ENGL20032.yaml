    ms: "Seorang pengulas 2023 memberi amaran bahawa analisis rapinya sukar dan menggunakan banyak istilah khusus puisi yang baharu."
    id: "Pengulas 2023 mengingatkan analisis mendalamnya sulit dan memakai banyak istilah khusus puisi yang baru."
