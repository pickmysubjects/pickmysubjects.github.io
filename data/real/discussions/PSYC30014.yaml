points:
  - en: "It is a must for those aiming at clinical psychology. There is lots of DSM-based content and heavy memorisation."
    zh: "想走临床心理方向的必修推荐，内容大量基于DSM，需大量记忆。"
    zh-TW: "想走臨床心理方向的必修推薦，內容大量基於DSM，需大量記憶。"
    ja: "臨床心理学を目指す人には必須です。DSMに基づく内容が多く、暗記量も多いです。"
    ko: "임상심리학을 목표로 한다면 필수입니다. DSM 기반 내용이 많고 암기량이 많습니다."
    vi: "Môn bắt buộc nên học nếu hướng tới tâm lý lâm sàng. Nhiều nội dung dựa trên DSM và phải học thuộc nhiều."
    ms: "Wajib bagi yang menyasarkan psikologi klinikal. Banyak kandungan berasaskan DSM dan banyak hafalan."
    id: "Wajib bagi yang mengincar psikologi klinis. Banyak materi berbasis DSM dan banyak hafalan."
    hi: "क्लिनिकल साइकोलॉजी का लक्ष्य रखने वालों के लिए ज़रूरी। DSM पर आधारित बहुत कंटेंट है और काफी रटना पड़ता है।"
  - en: "The argumentative essay is heavily weighted, around 50%, and hard to do well in. Strong essay skills are needed."
    zh: "议论文权重高（约50%）且不易拿高分，需要较强的写作能力。"
    zh-TW: "議論文權重高（約50%）且不易拿高分，需要較強的寫作能力。"
    ja: "論証型エッセイは配点が大きく約50%で、高得点は難しいです。しっかりした文章力が必要です。"
    ko: "논증 에세이는 비중이 약 50%로 크고 잘 받기 어렵습니다. 탄탄한 글쓰기 실력이 필요합니다."
    vi: "Bài luận nghị luận chiếm tỷ trọng lớn, khoảng 50%, và khó đạt điểm cao. Cần kỹ năng viết luận tốt."
    ms: "Esei hujahan berwajaran besar, sekitar 50%, dan sukar dapat markah tinggi. Kemahiran menulis esei yang kukuh diperlukan."
    id: "Esai argumentatif berbobot besar, sekitar 50%, dan sulit dapat nilai bagus. Perlu kemampuan menulis esai yang kuat."
    hi: "आर्ग्युमेंटेटिव निबंध का वेटेज ज़्यादा है, करीब 50%, और इसमें अच्छा करना मुश्किल है। मज़बूत लेखन कौशल चाहिए।"
  - en: "The multiple-choice quizzes and exam are seen as easy and can offset a weaker essay mark."
    zh: "选择题测验和期末被认为简单，可弥补论文分数。"
    zh-TW: "選擇題測驗和期末被認為簡單，可彌補論文分數。"
    ja: "選択式の小テストと試験は簡単とされ、エッセイの点が低めでも補えます。"
    ko: "객관식 퀴즈와 시험은 쉽다는 평이고, 에세이 점수가 낮아도 만회할 수 있습니다."
    vi: "Quiz và bài thi trắc nghiệm được xem là dễ và có thể bù cho điểm bài luận thấp."
    ms: "Kuiz dan peperiksaan aneka pilihan dianggap mudah dan boleh mengimbangi markah esei yang lemah."
    id: "Kuis dan ujian pilihan ganda dianggap mudah dan bisa menutup nilai esai yang lemah."
    hi: "MCQ क्विज़ और एग्ज़ाम आसान माने जाते हैं और कमज़ोर निबंध मार्क्स की भरपाई कर सकते हैं।"
sections:
  content:
    - en: "A popular elective on mental disorders, with lots of DSM-5 criteria each week. Most found it interesting and say it suits anyone heading toward clinical psychology; one calls it mostly rote memory."
      zh: "很受欢迎的选修，讲各种精神障碍，每周都有大量 DSM-5 标准。多数人觉得有趣，适合想走临床心理方向的人；有人说主要靠死记。"
      zh-TW: "很受歡迎的選修，講各種精神疾患，每週都有大量 DSM-5 標準。多數人覺得有趣，適合想走臨床心理方向的人；有人說主要靠死背。"
      ja: "精神障害を扱う人気選択科目で、毎週DSM-5の基準が多く出る。面白く、臨床心理を目指す人に向くという声が多い。ほぼ暗記だという人も。"
      ko: "정신장애를 다루는 인기 선택 과목으로 매주 DSM-5 기준이 많이 나온다. 대부분 흥미롭고 임상심리 지망생에게 맞다고 한다. 거의 암기라는 사람도 있다."
      vi: "Môn tự chọn phổ biến về rối loạn tâm thần, tuần nào cũng nhiều tiêu chí DSM-5. Đa số thấy thú vị, hợp với ai theo tâm lý lâm sàng; một người nói chủ yếu học thuộc."
      ms: "Elektif popular tentang gangguan mental, dengan banyak kriteria DSM-5 setiap minggu. Kebanyakan rasa menarik dan sesuai bagi yang menuju psikologi klinikal; seorang kata kebanyakan hafalan."
      id: "Mata kuliah pilihan populer tentang gangguan mental, banyak kriteria DSM-5 tiap minggu. Kebanyakan merasa menarik dan cocok bagi yang mengarah ke psikologi klinis; satu bilang kebanyakan hafalan."
      hi: "मानसिक विकारों पर लोकप्रिय इलेक्टिव, हर हफ़्ते DSM-5 मापदंड बहुत। ज़्यादातर को रोचक लगा और क्लिनिकल साइकोलॉजी की ओर जाने वालों के लिए ठीक; एक के अनुसार ज़्यादातर रटना है।"
  work:
    - en: "An argumentative essay worth about half the grade is the hard part; several say you need strong essay skills and found parts of it vague."
      zh: "论证性论文占大约一半成绩，是难点；好几位说要有很强的写作能力，部分要求也比较模糊。"
      zh-TW: "論證性論文占大約一半成績，是難點；好幾位說要有很強的寫作能力，部分要求也比較模糊。"
      ja: "成績の約半分を占める論証エッセイが難所。高いエッセイ力が必要で、一部曖昧だったという声が複数。"
      ko: "성적의 약 절반인 논증 에세이가 어렵다. 에세이 실력이 좋아야 하고 일부 요구가 모호했다는 사람이 여럿이다."
      vi: "Bài luận lập luận chiếm khoảng nửa điểm là phần khó; vài người nói cần kỹ năng viết tốt và thấy một số yêu cầu mơ hồ."
      ms: "Esei berhujah bernilai kira-kira separuh gred ialah bahagian sukar; beberapa orang kata perlu kemahiran esei kuat dan sebahagiannya kabur."
      id: "Esai argumentatif sekitar separuh nilai adalah bagian sulit; beberapa bilang perlu kemampuan menulis esai yang kuat dan sebagian instruksinya kabur."
      hi: "लगभग आधे ग्रेड वाला तर्कपूर्ण निबंध कठिन हिस्सा है; कई कहते हैं इसके लिए मज़बूत लेखन चाहिए और कुछ हिस्से अस्पष्ट थे।"
    - en: "The multiple-choice quizzes and exam are seen as easy and can make up for a weaker essay, though one reviewer says unexpected things were tested."
      zh: "选择题小测和期末被认为简单，能弥补论文的失分；不过有人说考到了意想不到的内容。"
      zh-TW: "選擇題小考和期末被認為簡單，能彌補論文的失分；不過有人說考到了意想不到的內容。"
      ja: "選択式のクイズと期末は簡単とされ、エッセイの失点を補える。ただ予想外の内容が出たという人も。"
      ko: "객관식 퀴즈와 기말은 쉬운 편이라 에세이 감점을 만회할 수 있다. 다만 예상 못한 내용이 나왔다는 사람도 있다."
      vi: "Quiz trắc nghiệm và bài thi được cho là dễ, bù được cho bài luận yếu, dù một người nói có hỏi những thứ không ngờ."
      ms: "Kuiz aneka pilihan dan peperiksaan dianggap mudah dan boleh menampung esei yang lemah, walaupun seorang kata ada perkara tidak dijangka diuji."
      id: "Kuis pilihan ganda dan ujian dianggap mudah dan bisa menutup esai yang lemah, meski satu pengulas bilang ada hal tak terduga yang diujikan."
      hi: "MCQ क्विज़ और परीक्षा आसान मानी जाती हैं और कमज़ोर निबंध की भरपाई कर सकती हैं, हालाँकि एक के अनुसार अनपेक्षित बातें पूछी गईं।"
  watch:
    - en: "Not recommended if you aren't interested in clinical psychology or aren't confident writing essays."
      zh: "如果对临床心理不感兴趣，或者对写论文没信心，不太推荐。"
      zh-TW: "如果對臨床心理沒興趣，或對寫論文沒信心，不太推薦。"
      ja: "臨床心理に興味がない人やエッセイに自信がない人にはあまり勧められない。"
      ko: "임상심리에 관심이 없거나 에세이 작성에 자신 없으면 추천하지 않는다."
      vi: "Không khuyến khích nếu bạn không quan tâm tâm lý lâm sàng hoặc không tự tin viết luận."
      ms: "Tidak disyorkan jika anda tidak berminat dengan psikologi klinikal atau kurang yakin menulis esei."
      id: "Tidak disarankan kalau tidak tertarik psikologi klinis atau kurang percaya diri menulis esai."
      hi: "अगर क्लिनिकल साइकोलॉजी में रुचि नहीं या निबंध लिखने में भरोसा नहीं, तो सलाह नहीं दी जाती।"
workload: heavy
difficulty: mixed
