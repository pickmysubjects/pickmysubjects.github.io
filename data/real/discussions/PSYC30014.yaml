points:
  - en: "It is a must for those aiming at clinical psychology. There is lots of DSM-based content and heavy memorisation."
    zh: "想走临床心理方向的必修推荐，内容大量基于DSM，需大量记忆。"
    zh-TW: "想走臨床心理方向的必修推薦，內容大量基於DSM，需大量記憶。"
    ja: "臨床心理学を目指す人には必須です。DSMに基づく内容が多く、暗記量も多いです。"
    ko: "임상심리학을 목표로 한다면 필수입니다. DSM 기반 내용이 많고 암기량이 많습니다."
    vi: "Môn bắt buộc nên học nếu hướng tới tâm lý lâm sàng. Nhiều nội dung dựa trên DSM và phải học thuộc nhiều."
    ms: "Wajib bagi yang menyasarkan psikologi klinikal. Banyak kandungan berasaskan DSM dan banyak hafalan."
    id: "Wajib bagi yang mengincar psikologi klinis. Banyak materi berbasis DSM dan banyak hafalan."
    hi: "क्लिनिकल साइकोलॉजी का लक्ष्य रखने वालों के लिए ज़रूरी। DSM पर आधारित बहुत कंटेंट है और काफी रटना पड़ता है।"
  - en: "The argumentative essay is heavily weighted, around 50%, and hard to do well in. Strong essay skills are needed."
    zh: "议论文权重高（约50%）且不易拿高分，需要较强的写作能力。"
    zh-TW: "議論文權重高（約50%）且不易拿高分，需要較強的寫作能力。"
    ja: "論証型エッセイは配点が大きく約50%で、高得点は難しいです。しっかりした文章力が必要です。"
    ko: "논증 에세이는 비중이 약 50%로 크고 잘 받기 어렵습니다. 탄탄한 글쓰기 실력이 필요합니다."
    vi: "Bài luận nghị luận chiếm tỷ trọng lớn, khoảng 50%, và khó đạt điểm cao. Cần kỹ năng viết luận tốt."
    ms: "Esei hujahan berwajaran besar, sekitar 50%, dan sukar dapat markah tinggi. Kemahiran menulis esei yang kukuh diperlukan."
    id: "Esai argumentatif berbobot besar, sekitar 50%, dan sulit dapat nilai bagus. Perlu kemampuan menulis esai yang kuat."
    hi: "आर्ग्युमेंटेटिव निबंध का वेटेज ज़्यादा है, करीब 50%, और इसमें अच्छा करना मुश्किल है। मज़बूत लेखन कौशल चाहिए।"
  - en: "The multiple-choice quizzes and exam are seen as easy and can offset a weaker essay mark."
    zh: "选择题测验和期末被认为简单，可弥补论文分数。"
    zh-TW: "選擇題測驗和期末被認為簡單，可彌補論文分數。"
    ja: "選択式の小テストと試験は簡単とされ、エッセイの点が低めでも補えます。"
    ko: "객관식 퀴즈와 시험은 쉽다는 평이고, 에세이 점수가 낮아도 만회할 수 있습니다."
    vi: "Quiz và bài thi trắc nghiệm được xem là dễ và có thể bù cho điểm bài luận thấp."
    ms: "Kuiz dan peperiksaan aneka pilihan dianggap mudah dan boleh mengimbangi markah esei yang lemah."
    id: "Kuis dan ujian pilihan ganda dianggap mudah dan bisa menutup nilai esai yang lemah."
    hi: "MCQ क्विज़ और एग्ज़ाम आसान माने जाते हैं और कमज़ोर निबंध मार्क्स की भरपाई कर सकते हैं।"
workload: heavy
difficulty: mixed
