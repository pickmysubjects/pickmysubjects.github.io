reviews: 6
from: 2017
to: 2024
checked: 2026-10-08
points:
  - en: "The content is challenging, dense and abstract, so you can't coast through it. Best if you enjoyed second-year cognitive psychology."
    zh: "内容难、密集且抽象，无法轻松应付；适合喜欢二年级认知心理学的学生。"
    zh-TW: "內容難、密集且抽象，無法輕鬆應付；適合喜歡二年級認知心理學的學生。"
    ja: "内容は難しく濃密で抽象的なので、楽には乗り切れません。2年次の認知心理学が好きだった人に最適です。"
    ko: "내용이 어렵고 빽빽하며 추상적이라 대충 넘어갈 수 없습니다. 2학년 인지심리학을 좋아했다면 잘 맞습니다."
    vi: "Nội dung khó, dày đặc và trừu tượng nên không thể học qua loa. Hợp nhất nếu bạn thích tâm lý học nhận thức năm 2."
    ms: "Kandungan mencabar, padat dan abstrak, jadi anda tidak boleh ambil mudah. Paling sesuai jika anda suka psikologi kognitif tahun dua."
    id: "Materinya menantang, padat, dan abstrak, jadi tidak bisa santai. Paling cocok kalau kamu suka psikologi kognitif tahun kedua."
    hi: "कंटेंट कठिन, घना और एब्स्ट्रैक्ट है, इसलिए इसे हल्के में नहीं ले सकते। अगर सेकंड ईयर कॉग्निटिव साइकोलॉजी पसंद आई थी तो सबसे सही।"
  - en: "Most reviewers found it well run and the staff passionate, though one recent reviewer disliked the tutorials."
    zh: "多数评价认为课程组织良好、教师投入，但一位近期评价者不喜欢辅导课。"
    zh-TW: "多數評價認為課程組織良好、教師投入，但一位近期評價者不喜歡輔導課。"
    ja: "多くのレビューで運営が良く教員も熱心だとされていますが、最近の1人はチュートリアルが気に入りませんでした。"
    ko: "대부분 잘 운영되고 교수진이 열정적이라고 했지만, 최근 한 명은 튜토리얼이 마음에 들지 않았다고 했습니다."
    vi: "Đa số thấy môn được tổ chức tốt và giảng viên nhiệt huyết, dù một người gần đây không thích tutorial."
    ms: "Kebanyakan pengulas dapati ia teratur dan staf bersemangat, walaupun seorang pengulas terkini tidak suka tutorial."
    id: "Kebanyakan pengulas menilai tertata baik dan pengajarnya bersemangat, meski satu pengulas terbaru tidak suka tutorialnya."
    hi: "ज़्यादातर रिव्यूअर्स को यह अच्छी तरह चलाया गया और स्टाफ उत्साही लगा, हालाँकि एक हालिया रिव्यूअर को ट्यूटोरियल पसंद नहीं आए।"
  - en: "The short-answer exam covers all weeks and felt tough, but appeared to be scaled. Marking is more objective than in other psych subjects."
    zh: "简答题期末覆盖全部内容、较难，但似乎有调分；评分比其他心理课更客观。"
    zh-TW: "簡答題期末涵蓋全部內容、較難，但似乎有調分；評分比其他心理學科目更客觀。"
    ja: "短答式の試験は全週の範囲で難しく感じましたが、得点調整されたようです。採点は他の心理学の科目より客観的です。"
    ko: "단답형 시험은 전 주차를 다루고 어려웠지만 점수 조정이 된 듯합니다. 채점은 다른 심리학 과목보다 객관적입니다."
    vi: "Bài thi trả lời ngắn bao quát mọi tuần và khá khó, nhưng có vẻ đã được scale. Chấm điểm khách quan hơn các môn tâm lý khác."
    ms: "Peperiksaan jawapan pendek merangkumi semua minggu dan terasa sukar, tetapi nampaknya diskala. Pemarkahan lebih objektif berbanding subjek psikologi lain."
    id: "Ujian jawaban singkat mencakup semua minggu dan terasa sulit, tapi tampaknya di-scale. Penilaiannya lebih objektif dari mata kuliah psikologi lain."
    hi: "शॉर्ट-आंसर एग्ज़ाम सभी हफ्तों को कवर करता है और कठिन लगा, पर लगता है स्केल हुआ। मार्किंग दूसरे साइकोलॉजी सब्जेक्ट्स से ज़्यादा ऑब्जेक्टिव है।"
sections:
  content:
    - en: "Perception, memory and cognition, including psychophysics and signal detection theory. Dense, abstract and challenging, but most found it fascinating, well run and more objective than other psych subjects."
      zh: "讲知觉、记忆和认知，包括心理物理学和信号检测论。内容密、抽象、有挑战，但多数人觉得很吸引人、组织得好，比其他心理课更客观。"
      zh-TW: "講知覺、記憶和認知，包括心理物理學和訊號偵測論。內容密、抽象、有挑戰，但多數人覺得很吸引人、安排得好，比其他心理課更客觀。"
      ja: "知覚・記憶・認知を扱い、心理物理学や信号検出理論も含む。密度が高く抽象的で難しいが、多くは非常に面白く運営も良く、他の心理学科目より客観的だという。"
      ko: "지각, 기억, 인지를 다루며 정신물리학과 신호탐지 이론도 포함한다. 빽빽하고 추상적이며 어렵지만, 대부분 매우 흥미롭고 운영이 좋으며 다른 심리 과목보다 객관적이라고 했다."
      vi: "Tri giác, trí nhớ và nhận thức, gồm tâm vật lý học và lý thuyết phát hiện tín hiệu. Dày, trừu tượng và khó, nhưng đa số thấy cuốn hút, tổ chức tốt và khách quan hơn các môn tâm lý khác."
      ms: "Persepsi, ingatan dan kognisi, termasuk psikofizik dan teori pengesanan isyarat. Padat, abstrak dan mencabar, tetapi kebanyakan rasa menarik, teratur dan lebih objektif daripada subjek psikologi lain."
      id: "Persepsi, memori dan kognisi, termasuk psikofisika dan teori deteksi sinyal. Padat, abstrak dan menantang, tapi kebanyakan merasa sangat menarik, rapi dan lebih objektif dari mata kuliah psikologi lain."
      hi: "प्रत्यक्षण, स्मृति और संज्ञान, जिसमें साइकोफ़िज़िक्स और सिग्नल डिटेक्शन थ्योरी शामिल हैं। घना, अमूर्त और चुनौतीपूर्ण, पर ज़्यादातर को बहुत रोचक, अच्छी तरह चलाया गया और बाक़ी मनोविज्ञान विषयों से ज़्यादा वस्तुनिष्ठ लगा।"
  work:
    - en: "One 2024 reviewer described a tough short-answer exam covering all 12 weeks, which seemed to scale up."
      zh: "2024 年有同学说期末是覆盖全部 12 周的简答题，很难，但成绩似乎有往上调。"
      zh-TW: "2024 年有同學說期末是涵蓋全部 12 週的簡答題，很難，但成績似乎有往上調。"
      ja: "2024年のレビューでは、期末は12週分すべてを範囲とする難しい記述式で、得点は上方調整されたようだという。"
      ko: "2024년 한 리뷰어는 기말이 12주 전체를 다루는 어려운 단답형이었고 점수가 상향 조정된 것 같다고 했다."
      vi: "Một người năm 2024 mô tả bài thi tự luận ngắn khó, bao gồm cả 12 tuần, và điểm dường như được nâng lên."
      ms: "Seorang pengulas 2024 menggambarkan peperiksaan jawapan pendek yang sukar merangkumi kesemua 12 minggu, yang nampaknya diskala naik."
      id: "Satu pengulas 2024 menggambarkan ujian isian singkat yang sulit mencakup 12 minggu penuh, yang tampaknya diskalakan naik."
      hi: "2024 के एक रिव्यूअर ने सभी 12 हफ़्तों पर कठिन शॉर्ट-आंसर परीक्षा बताई, जिसके अंक बढ़ाकर स्केल किए गए लगे।"
  study:
    - en: "Keep up with lectures and tutorials, which reviewers found supplement each other well; it is best if you enjoyed second-year cognitive psychology."
      zh: "讲课和 tutorial 都要跟上，同学觉得两者互补得很好；最适合喜欢二年级认知心理学的人。"
      zh-TW: "上課和 tutorial 都要跟上，同學覺得兩者互補得很好；最適合喜歡二年級認知心理學的人。"
      ja: "講義とチュートリアルについていく。互いをよく補完しているという声。2年次の認知心理学が好きだった人に最適。"
      ko: "강의와 튜토리얼을 따라가라. 서로 잘 보완한다는 평이다. 2학년 인지심리학을 좋아했다면 가장 잘 맞는다."
      vi: "Theo kịp bài giảng và tutorial, người học thấy hai phần bổ trợ nhau tốt; hợp nhất nếu bạn thích tâm lý học nhận thức năm hai."
      ms: "Ikuti kuliah dan tutorial yang pengulas dapati saling melengkapi; paling sesuai jika anda suka psikologi kognitif tahun dua."
      id: "Ikuti kuliah dan tutorial, yang menurut pengulas saling melengkapi; paling cocok kalau kamu suka psikologi kognitif tahun kedua."
      hi: "लेक्चर और ट्यूटोरियल के साथ चलें, जो रिव्यूअर्स के अनुसार एक-दूसरे को अच्छी तरह पूरा करते हैं; यह तब सबसे अच्छा है जब दूसरे साल की कॉग्निटिव साइकोलॉजी पसंद आई हो।"
  watch:
    - en: "One 2024 reviewer found it too theoretical with no application and the tutors unhelpful, though they liked the memory section."
      zh: "2024 年有同学觉得太理论、没有应用，tutor 也帮不上忙，不过喜欢记忆那部分。"
      zh-TW: "2024 年有同學覺得太理論、沒有應用，tutor 也幫不上忙，不過喜歡記憶那部分。"
      ja: "2024年のレビューでは、理論的すぎて応用がなくチューターも役に立たなかったが、記憶のパートは良かったという声も一つ。"
      ko: "2024년 한 리뷰어는 너무 이론적이고 응용이 없으며 튜터가 도움이 안 됐다고 했지만, 기억 파트는 좋았다고 했다."
      vi: "Một người năm 2024 thấy quá lý thuyết, không có ứng dụng và tutor không giúp được gì, dù thích phần trí nhớ."
      ms: "Seorang pengulas 2024 dapati ia terlalu teori tanpa aplikasi dan tutor kurang membantu, walaupun suka bahagian ingatan."
      id: "Satu pengulas 2024 merasa terlalu teoretis tanpa penerapan dan tutornya kurang membantu, meski suka bagian memori."
      hi: "2024 के एक रिव्यूअर को यह बहुत सैद्धांतिक, बिना प्रयोग वाला और ट्यूटर बेकार लगे, हालाँकि स्मृति वाला हिस्सा उन्हें पसंद आया।"
tags: [scaled]
difficulty: hard
