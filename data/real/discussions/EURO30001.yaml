points:
  - en: "All three 2022 reviewers took it as a linguistics or French elective and found it heavy on language policy, law, history and geography rather than languages and cultures themselves."
    zh: "三位2022年的评论者都是把它当语言学或法语选修课，觉得内容偏重语言政策、法律、历史和地理，而不是语言和文化本身。"
    zh-TW: "三位2022年的評論者都是把它當語言學或法語選修課，覺得內容偏重語言政策、法律、歷史和地理，而不是語言和文化本身。"
    ja: "2022年の評者3人はいずれも言語学かフランス語の選択科目として履修。言語や文化そのものより、言語政策・法律・歴史・地理が中心だと感じた。"
    ko: "2022년 리뷰어 3명 모두 언어학 또는 프랑스어 선택 과목으로 수강했으며, 언어와 문화 자체보다 언어 정책·법·역사·지리 비중이 크다고 느낌."
    vi: "Cả ba người năm 2022 học như môn tự chọn ngôn ngữ học hoặc tiếng Pháp, và thấy nặng về chính sách ngôn ngữ, luật, lịch sử, địa lý hơn là bản thân ngôn ngữ và văn hóa."
    ms: "Ketiga-tiga pengulas 2022 mengambilnya sebagai elektif linguistik atau Perancis dan dapati ia berat pada dasar bahasa, undang-undang, sejarah dan geografi, bukan bahasa dan budaya itu sendiri."
    id: "Ketiga pengulas 2022 mengambilnya sebagai pilihan linguistik atau Prancis dan merasa isinya berat ke kebijakan bahasa, hukum, sejarah, dan geografi, bukan bahasa dan budaya itu sendiri."
    hi: "2022 के तीनों रिव्यूअर्स ने इसे भाषाविज्ञान या फ़्रेंच इलेक्टिव के रूप में लिया और पाया कि यह भाषाओं व संस्कृतियों से ज़्यादा भाषा नीति, क़ानून, इतिहास और भूगोल पर केंद्रित है।"
  - en: "Two of the three found it very dry, with long lectures where it was unclear what mattered; one still found it interesting overall."
    zh: "三人中有两人觉得非常枯燥，讲课很长，不清楚哪些是重点；另一人总体上仍觉得有意思。"
    zh-TW: "三人中有兩人覺得非常枯燥，講課很長，不清楚哪些是重點；另一人整體上仍覺得有意思。"
    ja: "3人中2人はとても退屈だと感じ、講義が長く何が重要か分かりにくかったという。残る1人は全体として面白いと評価。"
    ko: "3명 중 2명은 매우 지루했고 강의가 길어 무엇이 중요한지 불분명했다고 함. 나머지 1명은 전반적으로 흥미로웠다고 평가."
    vi: "Hai trong ba người thấy rất khô khan, bài giảng dài và khó biết phần nào quan trọng; người còn lại vẫn thấy nhìn chung thú vị."
    ms: "Dua daripada tiga dapati ia sangat hambar, dengan kuliah panjang yang tidak jelas apa yang penting; seorang lagi masih rasa ia menarik secara keseluruhan."
    id: "Dua dari tiga merasa sangat kering, kuliahnya panjang dan tidak jelas mana yang penting; satu lagi tetap menganggapnya menarik secara umum."
    hi: "तीन में से दो को यह बहुत नीरस लगा, लंबे लेक्चर जिनमें साफ़ नहीं था कि क्या ज़रूरी है; तीसरे को फिर भी कुल मिलाकर दिलचस्प लगा।"
  - en: "The assessments were described as simple: an open-book mid-semester exam and an oral presentation on a reading."
    zh: "考核被认为比较简单：一次开卷期中考试，加上一次针对阅读材料的口头报告。"
    zh-TW: "考核被認為比較簡單：一次開卷期中考試，加上一次針對閱讀材料的口頭報告。"
    ja: "評価は簡単だったとされる。持ち込み可の中間試験と、文献1本についての口頭発表。"
    ko: "평가는 쉬운 편이라고 함: 오픈북 중간고사와 읽기 자료 하나에 대한 구두 발표."
    vi: "Bài đánh giá được nói là đơn giản: thi giữa kỳ mở sách và một bài thuyết trình về một bài đọc."
    ms: "Penilaian digambarkan mudah: peperiksaan pertengahan semester buku terbuka dan pembentangan lisan tentang satu bacaan."
    id: "Penilaiannya disebut mudah: ujian tengah semester buku terbuka dan presentasi lisan tentang satu bacaan."
    hi: "मूल्यांकन आसान बताए गए: ओपन-बुक मिड-सेमेस्टर परीक्षा और एक रीडिंग पर मौखिक प्रस्तुति।"
difficulty: easy
