code: HPSC10001
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/hpsc10001
reviews: 8
from: 2015
to: 2021
checked: 2026-10-17
points:
  - en: "Reviewers (2015-2021) loved the passionate lectures on how science and philosophy developed, and no background is needed."
    zh: "评论者（2015-2021）很喜欢关于科学与哲学发展的激情讲座，不需要任何基础。"
    zh-TW: "評論者（2015-2021）很喜歡關於科學與哲學發展的熱情講課，不需要任何基礎。"
    ja: "レビュー（2015-2021）では、科学と哲学の発展を語る熱のこもった講義が大好評。予備知識は不要。"
    ko: "리뷰어들(2015-2021)은 과학과 철학의 발전을 다루는 열정적인 강의를 매우 좋아함. 배경지식은 필요 없음."
    vi: "Người đánh giá (2015-2021) rất thích các bài giảng đầy nhiệt huyết về sự phát triển của khoa học và triết học, không cần kiến thức nền."
    ms: "Pengulas (2015-2021) sangat suka kuliah bersemangat tentang perkembangan sains dan falsafah, dan tiada latar belakang diperlukan."
    id: "Pengulas (2015-2021) sangat menyukai kuliah penuh semangat tentang perkembangan sains dan filsafat, dan tak perlu latar belakang."
    hi: "रिव्यूअर्स (2015-2021) को विज्ञान और दर्शन के विकास पर जोशीले लेक्चर बहुत पसंद आए, और किसी पृष्ठभूमि की ज़रूरत नहीं।"
  - en: "Readings of old texts are long and tutorials were mixed. The small assignments are fairly easy, but the heavily weighted final research essay is hard."
    zh: "古代文本阅读篇幅长，辅导课评价不一。小作业比较简单，但占比很大的期末研究论文很难。"
    zh-TW: "古代文本閱讀篇幅長，輔導課評價不一。小作業比較簡單，但佔比很大的期末研究論文很難。"
    ja: "古いテキストの読み物は長く、チュートリアルの評価は分かれる。小課題は比較的易しいが、配点の大きい最終リサーチ・エッセイは難しい。"
    ko: "옛 텍스트 읽기가 길고 튜토리얼 평은 엇갈림. 작은 과제는 쉬운 편이지만 비중이 큰 기말 연구 에세이는 어려움."
    vi: "Bài đọc văn bản cổ dài và tutorial được đánh giá trái chiều. Các bài tập nhỏ khá dễ, nhưng tiểu luận nghiên cứu cuối kỳ chiếm tỷ trọng lớn thì khó."
    ms: "Bacaan teks lama panjang dan tutorial mendapat ulasan bercampur. Tugasan kecil agak mudah, tetapi esei penyelidikan akhir yang berwajaran besar sukar."
    id: "Bacaan teks lama panjang dan tutorialnya mendapat tanggapan beragam. Tugas kecil cukup mudah, tapi esai riset akhir yang berbobot besar sulit."
    hi: "पुराने ग्रंथों की रीडिंग्स लंबी हैं और ट्यूटोरियल पर राय मिली-जुली है। छोटे असाइनमेंट काफ़ी आसान हैं, पर भारी वेटेज वाला फ़ाइनल रिसर्च निबंध कठिन है।"
  - en: "Science students taking it as a breadth enjoyed it, but one noted it is not a WAM booster."
    zh: "把它当跨学科选修的理科生都很喜欢，但有人提醒它不是拉高WAM的课。"
    zh-TW: "把它當Breadth選修的理科生都很喜歡，但有人提醒它不是拉高WAM的課。"
    ja: "Breadthとして取った理系学生は楽しんだが、WAMを上げる科目ではないという指摘もある。"
    ko: "Breadth로 들은 이과생들은 즐겼지만, WAM 올리기용은 아니라는 지적도 있음."
    vi: "Sinh viên khoa học học làm Breadth đều thích, nhưng có người lưu ý đây không phải môn kéo WAM."
    ms: "Pelajar sains yang mengambilnya sebagai Breadth menikmatinya, tetapi seorang menyatakan ia bukan penaik WAM."
    id: "Mahasiswa sains yang mengambilnya sebagai Breadth menikmatinya, tapi ada yang mencatat ini bukan pendongkrak WAM."
    hi: "Breadth के रूप में लेने वाले साइंस छात्रों को यह पसंद आया, पर एक ने कहा कि यह WAM बढ़ाने वाला विषय नहीं है।"
