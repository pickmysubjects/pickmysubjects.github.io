code: HPSC10001
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/hpsc10001
reviews: 8
from: 2015
to: 2021
checked: 2026-10-17
points:
  - en: "Reviewers (2015-2021) loved the passionate lectures on how science and philosophy developed, and no background is needed."
    zh: "评论者（2015-2021）很喜欢关于科学与哲学发展的激情讲座，不需要任何基础。"
    zh-TW: "評論者（2015-2021）很喜歡關於科學與哲學發展的熱情講課，不需要任何基礎。"
    ja: "レビュー（2015-2021）では、科学と哲学の発展を語る熱のこもった講義が大好評。予備知識は不要。"
    ko: "리뷰어들(2015-2021)은 과학과 철학의 발전을 다루는 열정적인 강의를 매우 좋아함. 배경지식은 필요 없음."
    vi: "Người đánh giá (2015-2021) rất thích các bài giảng đầy nhiệt huyết về sự phát triển của khoa học và triết học, không cần kiến thức nền."
    ms: "Pengulas (2015-2021) sangat suka kuliah bersemangat tentang perkembangan sains dan falsafah, dan tiada latar belakang diperlukan."
    id: "Pengulas (2015-2021) sangat menyukai kuliah penuh semangat tentang perkembangan sains dan filsafat, dan tak perlu latar belakang."
    hi: "रिव्यूअर्स (2015-2021) को विज्ञान और दर्शन के विकास पर जोशीले लेक्चर बहुत पसंद आए, और किसी पृष्ठभूमि की ज़रूरत नहीं।"
  - en: "Readings of old texts are long and tutorials were mixed. The small assignments are fairly easy, but the heavily weighted final research essay is hard."
    zh: "古代文本阅读篇幅长，辅导课评价不一。小作业比较简单，但占比很大的期末研究论文很难。"
    zh-TW: "古代文本閱讀篇幅長，輔導課評價不一。小作業比較簡單，但佔比很大的期末研究論文很難。"
    ja: "古いテキストの読み物は長く、チュートリアルの評価は分かれる。小課題は比較的易しいが、配点の大きい最終リサーチ・エッセイは難しい。"
    ko: "옛 텍스트 읽기가 길고 튜토리얼 평은 엇갈림. 작은 과제는 쉬운 편이지만 비중이 큰 기말 연구 에세이는 어려움."
    vi: "Bài đọc văn bản cổ dài và tutorial được đánh giá trái chiều. Các bài tập nhỏ khá dễ, nhưng tiểu luận nghiên cứu cuối kỳ chiếm tỷ trọng lớn thì khó."
    ms: "Bacaan teks lama panjang dan tutorial mendapat ulasan bercampur. Tugasan kecil agak mudah, tetapi esei penyelidikan akhir yang berwajaran besar sukar."
    id: "Bacaan teks lama panjang dan tutorialnya mendapat tanggapan beragam. Tugas kecil cukup mudah, tapi esai riset akhir yang berbobot besar sulit."
    hi: "पुराने ग्रंथों की रीडिंग्स लंबी हैं और ट्यूटोरियल पर राय मिली-जुली है। छोटे असाइनमेंट काफ़ी आसान हैं, पर भारी वेटेज वाला फ़ाइनल रिसर्च निबंध कठिन है।"
  - en: "Science students taking it as a breadth enjoyed it, but one noted it is not a WAM booster."
    zh: "把它当跨学科选修的理科生都很喜欢，但有人提醒它不是拉高WAM的课。"
    zh-TW: "把它當Breadth選修的理科生都很喜歡，但有人提醒它不是拉高WAM的課。"
    ja: "Breadthとして取った理系学生は楽しんだが、WAMを上げる科目ではないという指摘もある。"
    ko: "Breadth로 들은 이과생들은 즐겼지만, WAM 올리기용은 아니라는 지적도 있음."
    vi: "Sinh viên khoa học học làm Breadth đều thích, nhưng có người lưu ý đây không phải môn kéo WAM."
    ms: "Pelajar sains yang mengambilnya sebagai Breadth menikmatinya, tetapi seorang menyatakan ia bukan penaik WAM."
    id: "Mahasiswa sains yang mengambilnya sebagai Breadth menikmatinya, tapi ada yang mencatat ini bukan pendongkrak WAM."
    hi: "Breadth के रूप में लेने वाले साइंस छात्रों को यह पसंद आया, पर एक ने कहा कि यह WAM बढ़ाने वाला विषय नहीं है।"
sections:
  content:
    - en: "The history of science and philosophy, with very engaging lectures. Reviewers with no background did fine; readings are long and in older English, and tutorials got mixed reviews."
      zh: "讲科学与哲学史，讲课非常精彩。没有背景的同学也学得不错；阅读材料长，还是旧式英语；tutorial 评价不一。"
      zh-TW: "講科學與哲學史，上課非常精彩。沒有背景的同學也學得不錯；閱讀材料長，還是舊式英文；tutorial 評價不一。"
      ja: "科学と哲学の歴史を学び、講義はとても面白い。予備知識なしでも問題なかったという声。リーディングは長く古い英語で、チュートリアルの評価は分かれる。"
      ko: "과학과 철학의 역사를 다루며 강의가 매우 흥미롭다. 배경 지식이 없어도 괜찮았다는 평. 읽기 자료는 길고 옛 영어이며 튜토리얼 평은 엇갈린다."
      vi: "Lịch sử khoa học và triết học, bài giảng rất cuốn hút. Người không có nền tảng vẫn học ổn; bài đọc dài và bằng tiếng Anh cổ, tutorial được đánh giá trái chiều."
      ms: "Sejarah sains dan falsafah, dengan kuliah yang sangat menarik. Pengulas tanpa latar belakang tetap okey; bacaan panjang dan dalam bahasa Inggeris lama, tutorial dapat ulasan bercampur."
      id: "Sejarah sains dan filsafat, dengan kuliah yang sangat menarik. Pengulas tanpa latar belakang tetap baik-baik saja; bacaan panjang dan berbahasa Inggris kuno, tutorial dapat ulasan beragam."
      hi: "विज्ञान और दर्शन का इतिहास, बहुत दिलचस्प लेक्चर के साथ। बिना बैकग्राउंड वाले भी ठीक रहे; रीडिंग लंबी और पुरानी अंग्रेज़ी में हैं, ट्यूटोरियल पर राय मिली-जुली।"
  work:
    - en: "Small assignments on the readings, which most found easy, and a heavily weighted 2,000-word research essay with your own question instead of an exam, which most found hard."
      zh: "几个基于阅读的小作业，多数人觉得简单；还有一篇占比很大的 2000 字研究论文，要自己定研究问题，代替考试，多数人觉得难。"
      zh-TW: "幾份根據閱讀的小作業，多數人覺得簡單；還有一篇比重很大的 2000 字研究論文，要自己訂研究問題，取代考試，多數人覺得難。"
      ja: "リーディングに基づく小課題（多くは簡単と感じた）と、試験の代わりに自分で問いを立てる配点の大きい2,000語の研究エッセイ（多くは難しいと感じた）。"
      ko: "읽기 기반 소과제는 대부분 쉽다고 했고, 시험 대신 스스로 질문을 세우는 비중 큰 2,000단어 연구 에세이는 대부분 어렵다고 했다."
      vi: "Vài bài tập nhỏ về bài đọc, đa số thấy dễ, và một tiểu luận nghiên cứu 2.000 từ tỷ trọng lớn với câu hỏi tự đặt thay cho thi, đa số thấy khó."
      ms: "Tugasan kecil tentang bacaan, yang kebanyakan rasa mudah, dan esei penyelidikan 2,000 perkataan berwajaran tinggi dengan soalan sendiri sebagai ganti peperiksaan, yang kebanyakan rasa sukar."
      id: "Tugas kecil tentang bacaan, yang kebanyakan merasa mudah, dan esai riset 2.000 kata berbobot besar dengan pertanyaan sendiri sebagai pengganti ujian, yang kebanyakan merasa sulit."
      hi: "रीडिंग पर छोटे असाइनमेंट, जो ज़्यादातर को आसान लगे, और परीक्षा की जगह अपने सवाल वाला भारी वेटेज का 2,000 शब्दों का रिसर्च निबंध, जो ज़्यादातर को कठिन लगा।"
  study:
    - en: "Look up the background of each reading before you start it, plan the essay structure well, start research early, and take care with referencing."
      zh: "读每篇材料前先上网查背景；论文结构要规划好，早点开始找资料，引用格式要认真。"
      zh-TW: "讀每篇資料前先上網查背景；論文架構要規劃好，早點開始找資料，引用格式要認真。"
      ja: "各リーディングの前に背景を調べ、エッセイの構成をしっかり練り、調査は早めに始め、参考文献の書き方に注意する。"
      ko: "읽기 전에 배경을 먼저 찾아보고, 에세이 구조를 잘 짜며, 조사를 일찍 시작하고 참고문헌에 신경 써라."
      vi: "Tra cứu bối cảnh trước mỗi bài đọc, lập dàn ý tiểu luận kỹ, bắt đầu tìm tài liệu sớm và cẩn thận phần trích dẫn."
      ms: "Cari latar belakang setiap bacaan sebelum membacanya, rancang struktur esei dengan baik, mula kajian awal, dan teliti rujukan."
      id: "Cari latar belakang tiap bacaan sebelum membacanya, rencanakan struktur esai dengan baik, mulai riset sejak awal, dan teliti sitasinya."
      hi: "हर रीडिंग से पहले उसका संदर्भ खोज लें, निबंध का ढाँचा अच्छी तरह बनाएँ, रिसर्च जल्दी शुरू करें, और संदर्भ-सूची पर ध्यान दें।"
  watch:
    - en: "All these reviews are from 2021 or earlier; teaching and exams may have changed since."
      zh: "这些评价都是 2021 年或更早的，现在的教法和考试可能已经变了。"
      zh-TW: "這些評價都是 2021 年或更早的，現在的教法和考試可能已經變了。"
      ja: "レビューはすべて2021年以前のもの。授業や試験は変わっている可能性がある。"
      ko: "모든 리뷰가 2021년 이전 것이라 지금 수업과 시험은 달라졌을 수 있다."
      vi: "Tất cả đánh giá đều từ năm 2021 trở về trước; cách dạy và thi có thể đã thay đổi."
      ms: "Semua ulasan ini dari 2021 atau lebih awal; pengajaran dan peperiksaan mungkin telah berubah."
      id: "Semua ulasan ini dari 2021 atau sebelumnya; pengajaran dan ujian mungkin sudah berubah."
      hi: "ये सभी रिव्यू 2021 या उससे पहले के हैं; पढ़ाई और परीक्षा अब बदल चुकी हो सकती है।"
