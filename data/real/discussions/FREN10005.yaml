code: FREN10005
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/fren10005
reviews: 7
from: 2015
to: 2022
checked: 2026-10-17
points:
  - en: "A natural continuation of French 1 with a similar relaxed feel, small classes and films and songs along the way."
    zh: "法语1的自然延续，氛围同样轻松，小班教学，还会用电影和歌曲辅助学习。"
    zh-TW: "法語1的自然延續，氛圍同樣輕鬆，小班教學，還會用電影和歌曲輔助學習。"
    ja: "French 1の自然な続きで、雰囲気は同じくゆるく、少人数クラスで映画や歌も使う。"
    ko: "French 1의 자연스러운 연장선. 분위기는 비슷하게 편하고, 소규모 수업에 영화와 노래도 활용함."
    vi: "Tiếp nối tự nhiên của French 1 với không khí thoải mái tương tự, lớp nhỏ, có phim và bài hát."
    ms: "Sambungan semula jadi French 1 dengan suasana santai yang sama, kelas kecil serta filem dan lagu."
    id: "Kelanjutan alami French 1 dengan suasana santai yang mirip, kelas kecil, serta film dan lagu."
    hi: "French 1 का स्वाभाविक अगला कदम, वैसा ही आरामदेह माहौल, छोटी क्लास और साथ में फ़िल्में व गाने।"
  - en: "Grammar gets harder (past tenses and especially pronouns), so expose yourself to as much French as you can and speak often."
    zh: "语法变难（过去时，尤其是代词），所以尽量多接触法语、多开口说。"
    zh-TW: "文法變難（過去式，尤其是代名詞），所以盡量多接觸法語、多開口說。"
    ja: "文法は難しくなる（過去時制、特に代名詞）。できるだけフランス語に触れ、たくさん話すこと。"
    ko: "문법이 어려워짐(과거 시제, 특히 대명사). 가능한 한 프랑스어를 많이 접하고 자주 말할 것."
    vi: "Ngữ pháp khó hơn (các thì quá khứ, đặc biệt là đại từ), nên hãy tiếp xúc tiếng Pháp càng nhiều càng tốt và nói thường xuyên."
    ms: "Tatabahasa menjadi lebih sukar (kala lampau dan terutama kata ganti), jadi dedahkan diri kepada sebanyak mungkin Bahasa Perancis dan kerap bertutur."
    id: "Tata bahasa makin sulit (bentuk lampau dan terutama kata ganti), jadi paparkan dirimu ke bahasa Prancis sebanyak mungkin dan sering berbicara."
    hi: "ग्रामर कठिन होती है (भूतकाल और खासकर सर्वनाम), इसलिए जितना हो सके फ़्रेंच सुनें-पढ़ें और अक्सर बोलें।"
sections:
  content:
    - en: "Follows on from French 1 at a fairly fast pace, with more grammar: passé composé, imparfait, near future and an intro to the future and conditional. Most found it enjoyable."
      zh: "接着法语 1，节奏较快，语法更多：复合过去时、未完成过去时、最近将来时，还会初步接触简单将来时和条件式。多数人觉得学得开心。"
      zh-TW: "接續法語 1，節奏較快，文法更多：複合過去式、未完成過去式、近未來式，還會初步接觸簡單未來式和條件式。多數人覺得學得開心。"
      ja: "フランス語1の続きで進みはやや速く、文法が増える。複合過去、半過去、近接未来、単純未来と条件法の入門。多くは楽しく学べたという。"
      ko: "프랑스어 1에 이어 꽤 빠르게 진행되며 문법이 늘어난다. 복합과거, 반과거, 근접미래, 단순미래와 조건법 입문. 대부분 즐거웠다고 했다."
      vi: "Tiếp nối French 1 với nhịp khá nhanh, nhiều ngữ pháp hơn: passé composé, imparfait, tương lai gần và làm quen thì tương lai, điều kiện. Đa số thấy vui."
      ms: "Sambungan French 1 dengan rentak agak laju dan lebih banyak tatabahasa: passé composé, imparfait, masa depan dekat dan pengenalan masa depan serta kondisional. Kebanyakan rasa seronok."
      id: "Lanjutan French 1 dengan tempo cukup cepat dan lebih banyak tata bahasa: passé composé, imparfait, futur proche dan pengenalan futur serta kondisional. Kebanyakan merasa senang."
      hi: "French 1 के बाद, काफ़ी तेज़ रफ़्तार और ज़्यादा व्याकरण: passé composé, imparfait, निकट भविष्य, और भविष्य व कंडीशनल का परिचय। ज़्यादातर को मज़ा आया।"
  work:
    - en: "Assessments include a final exam; one 2022 reviewer found pronouns (direct, indirect, en and y) the hardest part and struggled with them on the exam."
      zh: "考核包括期末考试；2022 年有同学觉得代词（直接、间接宾语代词以及 en 和 y）最难，考试时栽在这上面。"
      zh-TW: "考核包括期末考；2022 年有同學覺得代名詞（直接、間接受詞代名詞以及 en 和 y）最難，考試時栽在這上面。"
      ja: "評価には期末試験がある。2022年には代名詞（直接・間接目的語、en、y）が一番難しく、試験でつまずいたという声。"
      ko: "평가에는 기말시험이 있다. 2022년 한 리뷰어는 대명사(직접·간접 목적어, en, y)가 가장 어려워 시험에서 고전했다고 했다."
      vi: "Đánh giá có bài thi cuối kỳ; một người năm 2022 thấy đại từ (trực tiếp, gián tiếp, en và y) là phần khó nhất và bị vấp ở bài thi."
      ms: "Penilaian termasuk peperiksaan akhir; seorang pengulas 2022 dapati kata ganti (langsung, tidak langsung, en dan y) paling sukar dan bergelut dengannya dalam peperiksaan."
      id: "Penilaian termasuk ujian akhir; satu pengulas 2022 merasa kata ganti (langsung, tak langsung, en dan y) bagian tersulit dan kesulitan di ujian."
      hi: "मूल्यांकन में फ़ाइनल परीक्षा शामिल है; 2022 के एक रिव्यूअर को सर्वनाम (प्रत्यक्ष, अप्रत्यक्ष, en और y) सबसे कठिन लगे और परीक्षा में उनसे जूझना पड़ा।"
  study:
    - en: "Revise regularly, practise speaking with friends and expose yourself to as much French as possible; apps help with vocab but not much with grammar."
      zh: "定期复习，和朋友练口语，尽量多接触法语；学习 app 对单词有帮助，但对语法帮助不大。"
      zh-TW: "定期複習，和朋友練口說，盡量多接觸法語；學習 app 對單字有幫助，但對文法幫助不大。"
      ja: "定期的に復習し、友人と会話練習をし、できるだけフランス語に触れる。アプリは語彙には役立つが文法にはあまり役立たない。"
      ko: "꾸준히 복습하고 친구와 말하기를 연습하며 최대한 프랑스어에 노출되라. 앱은 어휘엔 도움이 되지만 문법엔 별로다."
      vi: "Ôn đều, luyện nói với bạn bè và tiếp xúc tiếng Pháp càng nhiều càng tốt; app giúp từ vựng nhưng ít giúp ngữ pháp."
      ms: "Ulang kaji kerap, berlatih bertutur dengan kawan dan dedahkan diri kepada bahasa Perancis sebanyak mungkin; aplikasi bantu kosa kata tetapi kurang untuk tatabahasa."
      id: "Rutin mengulang, latih berbicara dengan teman dan sering terpapar bahasa Prancis; aplikasi membantu kosakata tapi kurang untuk tata bahasa."
      hi: "नियमित दोहराएँ, दोस्तों के साथ बोलने का अभ्यास करें और जितना हो सके फ़्रेंच सुनें-पढ़ें; ऐप शब्दावली में मदद करते हैं पर व्याकरण में ज़्यादा नहीं।"
  watch:
    - en: "Most reviews are short and from 2022 or earlier, so the subject may have changed."
      zh: "评价大多很短，而且都是 2022 年或更早的，课程可能已经变了。"
      zh-TW: "評價大多很短，而且都是 2022 年或更早的，課程可能已經變了。"
      ja: "レビューの多くは短く、すべて2022年以前のもので、内容が変わっている可能性がある。"
      ko: "리뷰 대부분이 짧고 2022년 이전 것이라 과목이 바뀌었을 수 있다."
      vi: "Phần lớn đánh giá ngắn và từ 2022 trở về trước, nên môn có thể đã thay đổi."
      ms: "Kebanyakan ulasan pendek dan dari 2022 atau lebih awal, jadi subjek mungkin telah berubah."
      id: "Sebagian besar ulasan singkat dan dari 2022 atau sebelumnya, jadi mata kuliahnya mungkin sudah berubah."
      hi: "ज़्यादातर रिव्यू छोटे और 2022 या पहले के हैं, तो विषय बदल गया हो सकता है।"
