points:
  - en: "A natural continuation of French 1 with a similar relaxed feel, small classes and films and songs along the way."
    zh: "法语1的自然延续，氛围同样轻松，小班教学，还会用电影和歌曲辅助学习。"
    zh-TW: "法語1的自然延續，氛圍同樣輕鬆，小班教學，還會用電影和歌曲輔助學習。"
    ja: "French 1の自然な続きで、雰囲気は同じくゆるく、少人数クラスで映画や歌も使う。"
    ko: "French 1의 자연스러운 연장선. 분위기는 비슷하게 편하고, 소규모 수업에 영화와 노래도 활용함."
    vi: "Tiếp nối tự nhiên của French 1 với không khí thoải mái tương tự, lớp nhỏ, có phim và bài hát."
    ms: "Sambungan semula jadi French 1 dengan suasana santai yang sama, kelas kecil serta filem dan lagu."
    id: "Kelanjutan alami French 1 dengan suasana santai yang mirip, kelas kecil, serta film dan lagu."
    hi: "French 1 का स्वाभाविक अगला कदम, वैसा ही आरामदेह माहौल, छोटी क्लास और साथ में फ़िल्में व गाने।"
  - en: "Grammar gets harder (past tenses and especially pronouns), so expose yourself to as much French as you can and speak often."
    zh: "语法变难（过去时，尤其是代词），所以尽量多接触法语、多开口说。"
    zh-TW: "文法變難（過去式，尤其是代名詞），所以盡量多接觸法語、多開口說。"
    ja: "文法は難しくなる（過去時制、特に代名詞）。できるだけフランス語に触れ、たくさん話すこと。"
    ko: "문법이 어려워짐(과거 시제, 특히 대명사). 가능한 한 프랑스어를 많이 접하고 자주 말할 것."
    vi: "Ngữ pháp khó hơn (các thì quá khứ, đặc biệt là đại từ), nên hãy tiếp xúc tiếng Pháp càng nhiều càng tốt và nói thường xuyên."
    ms: "Tatabahasa menjadi lebih sukar (kala lampau dan terutama kata ganti), jadi dedahkan diri kepada sebanyak mungkin Bahasa Perancis dan kerap bertutur."
    id: "Tata bahasa makin sulit (bentuk lampau dan terutama kata ganti), jadi paparkan dirimu ke bahasa Prancis sebanyak mungkin dan sering berbicara."
    hi: "ग्रामर कठिन होती है (भूतकाल और खासकर सर्वनाम), इसलिए जितना हो सके फ़्रेंच सुनें-पढ़ें और अक्सर बोलें।"
