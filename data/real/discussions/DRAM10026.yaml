points:
  - en: "Earlier reviewers called it an enjoyable breadth with a helpful coordinator and a good mark, and liked that most of it is online."
    zh: "早期评论者说这是一门愉快的通识课，协调人很热心、分数不错，也喜欢大部分内容在线上。"
    zh-TW: "早期評論者說這是一門愉快的通識課，協調人很熱心、分數不錯，也喜歡大部分內容在線上。"
    ja: "以前のレビューでは、楽しいブレッドスで担当者も親切、成績も良く、ほぼオンラインなのが良いとの声。"
    ko: "예전 리뷰어들은 즐거운 교양 과목이고 코디네이터가 친절하며 점수도 좋고, 대부분 온라인이라 좋았다고 함."
    vi: "Các review trước nói đây là môn breadth vui, điều phối viên nhiệt tình, điểm tốt, và thích việc học phần lớn online."
    ms: "Pengulas terdahulu kata ia subjek breadth yang seronok, penyelaras membantu, markah baik, dan suka kebanyakannya dalam talian."
    id: "Pengulas lama bilang ini mata kuliah breadth yang menyenangkan, koordinator membantu, nilai bagus, dan sebagian besar daring."
    hi: "पहले के रिव्यूअर्स ने इसे मज़ेदार ब्रेड्थ विषय बताया, मददगार कोऑर्डिनेटर, अच्छे अंक, और ज़्यादातर ऑनलाइन होना पसंद किया।"
  - en: "More recent reviews (2024–2025) say the marking is harsh and detailed, and that it pulled their average down rather than up."
    zh: "较新的评论（2024–2025）说评分严格、抠细节，反而拉低了平均分。"
    zh-TW: "較新的評論（2024–2025）說評分嚴格、挑細節，反而拉低了平均分數。"
    ja: "最近（2024〜2025年）のレビューでは採点が細かく厳しく、平均点が下がったという声。"
    ko: "최근(2024–2025) 리뷰는 채점이 깐깐하고 엄격해서 오히려 평균을 깎았다고 함."
    vi: "Các review gần đây (2024–2025) nói chấm điểm khắt khe, soi chi tiết, kéo điểm trung bình xuống."
    ms: "Ulasan terkini (2024–2025) kata pemarkahan ketat dan terperinci, malah menurunkan purata mereka."
    id: "Ulasan terbaru (2024–2025) bilang penilaian ketat dan detail, malah menurunkan rata-rata nilai."
    hi: "हाल के रिव्यू (2024–2025) कहते हैं कि मार्किंग सख़्त और बारीक है, जिससे औसत बढ़ने के बजाय घटा।"
  - en: "One student in a short intensive offering felt the major written tasks had too little guidance."
    zh: "一位上过短期集中班的学生觉得主要写作作业的指导太少。"
    zh-TW: "一位上過短期密集班的學生覺得主要寫作作業的指導太少。"
    ja: "短期集中で受けた学生は、主要な課題への指導が少なすぎたと感じた。"
    ko: "단기 집중반을 들은 한 학생은 주요 글쓰기 과제에 대한 안내가 너무 적었다고 느낌."
    vi: "Một bạn học lớp cấp tốc thấy các bài viết chính được hướng dẫn quá ít."
    ms: "Seorang pelajar dalam tawaran intensif pendek rasa tugasan bertulis utama kurang bimbingan."
    id: "Seorang mahasiswa di kelas intensif singkat merasa tugas tulis utama kurang arahan."
    hi: "छोटे इंटेंसिव में पढ़े एक छात्र को लगा कि मुख्य लेखन कार्यों पर मार्गदर्शन बहुत कम था।"
sections:
  content:
    - en: "An online intensive linked to Melbourne Theatre Company, covering theatre and how to review it. Reviewers liked the content, but views on the experience are sharply split."
      zh: "和墨尔本剧院公司（MTC）合作的线上密集课，讲戏剧和怎么写剧评。同学喜欢内容，但整体体验评价两极。"
      zh-TW: "和墨爾本劇院公司（MTC）合作的線上密集課，講戲劇和怎麼寫劇評。同學喜歡內容，但整體體驗評價兩極。"
      ja: "メルボルン・シアター・カンパニーと連携したオンライン集中科目で、演劇と劇評の書き方を学ぶ。内容は好評だが、全体の評価は真っ二つ。"
      ko: "멜버른 시어터 컴퍼니와 연계된 온라인 집중 과목으로 연극과 리뷰 쓰는 법을 다룬다. 내용은 좋다는 평이지만 전체 경험 평가는 극명히 갈린다."
      vi: "Khóa online cấp tốc gắn với Melbourne Theatre Company, học về sân khấu và cách viết phê bình. Người học thích nội dung, nhưng trải nghiệm thì ý kiến rất trái chiều."
      ms: "Kursus intensif dalam talian berkaitan Melbourne Theatre Company, tentang teater dan cara mengulasnya. Pengulas suka kandungan, tetapi pengalaman keseluruhan sangat berbelah."
      id: "Kuliah intensif daring yang terkait Melbourne Theatre Company, membahas teater dan cara mengulasnya. Pengulas suka materinya, tapi pengalaman keseluruhan sangat terbelah."
      hi: "मेलबर्न थिएटर कंपनी से जुड़ा ऑनलाइन इंटेंसिव, थिएटर और उसकी समीक्षा लिखना। रिव्यूअर्स को सामग्री पसंद आई, पर पूरे अनुभव पर राय बहुत बँटी है।"
  work:
    - en: "One reviewer lists an online quiz (20%), a five-entry research journal (40%) and a comparative review of two plays (40%). Reading professional reviews helps with the last one."
      zh: "有同学列出考核：线上测验（20%）、五篇的研究日志（40%）、比较两部戏的剧评（40%）。多读专业剧评对最后一项有帮助。"
      zh-TW: "有同學列出考核：線上測驗（20%）、五篇的研究日誌（40%）、比較兩部戲的劇評（40%）。多讀專業劇評對最後一項有幫助。"
      ja: "オンラインクイズ（20%）、5回分の研究日誌（40%）、2作品の比較劇評（40%）と一人が説明。最後のものはプロの劇評を読むと参考になる。"
      ko: "한 리뷰에 따르면 온라인 퀴즈(20%), 5편의 연구 일지(40%), 두 작품 비교 리뷰(40%). 마지막은 전문 리뷰를 읽으면 도움이 된다."
      vi: "Một người liệt kê: quiz online (20%), nhật ký nghiên cứu 5 bài (40%) và bài phê bình so sánh hai vở (40%). Đọc phê bình chuyên nghiệp giúp cho bài cuối."
      ms: "Seorang pengulas senaraikan kuiz dalam talian (20%), jurnal penyelidikan lima entri (40%) dan ulasan perbandingan dua drama (40%). Membaca ulasan profesional membantu yang terakhir."
      id: "Satu pengulas menyebut kuis daring (20%), jurnal riset lima entri (40%) dan ulasan perbandingan dua drama (40%). Membaca ulasan profesional membantu untuk yang terakhir."
      hi: "एक रिव्यूअर बताता है: ऑनलाइन क्विज़ (20%), पाँच प्रविष्टियों वाला रिसर्च जर्नल (40%) और दो नाटकों की तुलनात्मक समीक्षा (40%)। आख़िरी के लिए पेशेवर समीक्षाएँ पढ़ना मदद करता है।"
  watch:
    - en: "Earlier reviewers called it a WAM booster, but every review from 2024 on says the marking is very harsh and pulled their average down. One winter-term reviewer found guidance lacking."
      zh: "早期评价说能拉 WAM，但 2024 年以后的每条评价都说评分非常严，拖低了平均分。有位冬季学期的同学觉得缺少指导。"
      zh-TW: "早期評價說能拉 WAM，但 2024 年以後的每則評價都說評分非常嚴，拖低了平均。有位冬季學期的同學覺得缺少指導。"
      ja: "以前はWAMを上げる科目と言われたが、2024年以降のレビューは全て採点が非常に厳しく平均を下げたと言う。冬学期の一人は指導不足を感じた。"
      ko: "예전엔 WAM 올리기 좋다는 평이었지만, 2024년 이후 리뷰는 모두 채점이 매우 엄격해 평균이 깎였다고 한다. 겨울 학기 한 리뷰는 안내가 부족했다고 했다."
      vi: "Trước đây được gọi là môn kéo WAM, nhưng mọi đánh giá từ 2024 đều nói chấm rất khắt khe và kéo điểm trung bình xuống. Một người học kỳ đông thấy thiếu hướng dẫn."
      ms: "Pengulas awal kata ia penaik WAM, tetapi setiap ulasan sejak 2024 kata pemarkahan sangat ketat dan menurunkan purata. Seorang pengulas penggal musim sejuk rasa bimbingan kurang."
      id: "Pengulas awal menyebutnya pendongkrak WAM, tapi setiap ulasan sejak 2024 bilang penilaiannya sangat ketat dan menurunkan rata-rata. Satu pengulas semester musim dingin merasa kurang bimbingan."
      hi: "पहले के रिव्यूअर्स ने इसे WAM बढ़ाने वाला कहा, पर 2024 से हर रिव्यू कहता है जाँच बहुत सख़्त है और औसत गिरा। विंटर टर्म के एक रिव्यूअर को मार्गदर्शन कम लगा।"
difficulty: mixed
