points:
  - en: "Combines first-year linear algebra with second-year statistics, with more proofs than expected. Reviewers praised the teaching and structure."
    zh: "结合一年级线代与二年级统计，证明比预期多；讲授和结构广受好评。"
    zh-TW: "結合一年級線性代數與二年級統計，證明比預期多；教學和架構廣受好評。"
    ja: "1年次の線形代数と2年次の統計を組み合わせた内容で、証明は予想より多い。教え方と構成は好評。"
    ko: "1학년 선형대수와 2학년 통계를 결합하며 증명이 예상보다 많다. 강의와 구성은 호평받았다."
    vi: "Kết hợp đại số tuyến tính năm nhất với thống kê năm hai, nhiều chứng minh hơn dự kiến. Cách dạy và cấu trúc được khen."
    ms: "Gabungan algebra linear tahun satu dengan statistik tahun dua, lebih banyak bukti daripada dijangka. Pengajaran dan struktur dipuji."
    id: "Menggabungkan aljabar linear tahun pertama dan statistika tahun kedua, pembuktiannya lebih banyak dari dugaan. Pengajaran dan strukturnya dipuji."
    hi: "फ़र्स्ट-ईयर लीनियर अलजेब्रा और सेकंड-ईयर स्टैटिस्टिक्स का मेल, उम्मीद से ज़्यादा प्रूफ़। पढ़ाई और स्ट्रक्चर की तारीफ़ हुई।"
  - en: "Most found the workload manageable with steady effort, and the exams fair. One recent review found the exam tough but scaled."
    zh: "多数认为持续用功即可应付，考试公平；最近有人觉得考试偏难但有调分。"
    zh-TW: "多數認為持續用功就能應付，考試公平；最近有人覺得考試偏難但有調分。"
    ja: "多くは着実に取り組めば負担はこなせ、試験も公平だとした。最近のレビューでは試験が難しかったが得点調整があったという。"
    ko: "대부분 꾸준히 하면 감당할 만하고 시험도 공정하다고 했다. 최근 한 후기는 시험이 어려웠지만 점수 조정이 있었다고 했다."
    vi: "Đa số thấy khối lượng ổn nếu chăm đều, đề thi công bằng. Một đánh giá gần đây thấy đề khó nhưng có scaling."
    ms: "Kebanyakan rasa beban boleh diurus dengan usaha berterusan, dan peperiksaan adil. Satu ulasan terkini dapati peperiksaan sukar tetapi diskalakan."
    id: "Kebanyakan menilai bebannya terkelola dengan usaha rutin, dan ujiannya adil. Satu ulasan terbaru menilai ujiannya berat tapi ada scaling."
    hi: "ज़्यादातर को लगातार मेहनत से वर्कलोड संभलने लायक और एग्ज़ाम फेयर लगे। एक हालिया रिव्यू में एग्ज़ाम कठिन पर स्केल्ड बताया गया।"
  - en: "Three assignments use R. Labs mainly help with the assignments rather than the exam."
    zh: "三次作业需用R；实验课主要帮助完成作业而非备考。"
    zh-TW: "三次作業要用R；實驗課主要幫助完成作業而不是準備考試。"
    ja: "3つの課題でRを使う。ラボは試験より主に課題の助けになる。"
    ko: "과제 3개에 R을 쓴다. 실습은 시험보다 주로 과제에 도움이 된다."
    vi: "Ba bài tập dùng R. Lab chủ yếu giúp làm bài tập hơn là ôn thi."
    ms: "Tiga tugasan guna R. Makmal kebanyakannya bantu tugasan, bukan peperiksaan."
    id: "Tiga tugas memakai R. Lab lebih membantu tugas daripada ujian."
    hi: "तीन असाइनमेंट में R इस्तेमाल होता है। लैब ज़्यादातर असाइनमेंट में मदद करती हैं, एग्ज़ाम में नहीं।"
difficulty: easy
