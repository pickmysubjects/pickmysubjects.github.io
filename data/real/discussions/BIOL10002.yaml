points:
  - en: "Content jumps between many areas of biology, which several found disjointed and a lot to manage in 12 weeks."
    zh: "内容在生物学多个领域之间跳跃，几位评论者觉得零散，12周内要掌握很多。"
  - en: "Harder without high-school biology; keeping up with lectures is strongly advised."
    zh: "没学过高中生物会更吃力；强烈建议紧跟讲课进度。"
  - en: "Organisation and lecture quality were seen as inconsistent, and written-task marking varied by marker."
    zh: "课程组织和讲课质量被认为参差不齐，书面作业的评分也因阅卷人而异。"
  - en: "Practicals, especially dissections, are a highlight, and the practice question booklets help."
    zh: "实践课（尤其是解剖）是亮点，练习题册也很有帮助。"
