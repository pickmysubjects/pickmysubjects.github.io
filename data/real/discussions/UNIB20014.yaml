points:
  - en: "Reviewers consistently call it an enjoyable, well-run breadth with relevant content and helpful tutors, and no science background needed."
    zh: "评论者普遍认为这是一门愉快、组织良好的通识课，内容贴近生活，辅导老师很热心，不需要理科背景。"
    zh-TW: "評論者普遍認為這是一門愉快、組織良好的通識課，內容貼近生活，助教很熱心，不需要理科背景。"
    ja: "楽しく運営もしっかりしたブレッドスで、内容が身近、チューターも親切、理系の素養は不要という評価が一貫している。"
    ko: "즐겁고 잘 운영되는 교양으로, 내용이 생활과 밀접하고 튜터가 친절하며 이과 배경이 필요 없다는 평이 일관됨."
    vi: "Người review đều nói đây là môn breadth thú vị, tổ chức tốt, nội dung thiết thực, tutor nhiệt tình, không cần nền khoa học."
    ms: "Pengulas konsisten kata ia subjek breadth menyeronokkan dan teratur, kandungan relevan, tutor membantu, tanpa perlu latar sains."
    id: "Pengulas konsisten menyebutnya breadth menyenangkan dan tertata, materi relevan, tutor membantu, tanpa perlu latar sains."
    hi: "रिव्यूअर लगातार इसे मज़ेदार, अच्छी तरह चलने वाला ब्रेड्थ बताते हैं; विषय उपयोगी, ट्यूटर मददगार, साइंस बैकग्राउंड ज़रूरी नहीं।"
  - en: "The forum report, which summarises a guest lecture, is seen as easy to score in, and the exam allows a double-sided A4 cheat sheet."
    zh: "论坛报告只需总结一场嘉宾讲座，被认为很好拿分；考试允许带一张双面A4小抄。"
    zh-TW: "論壇報告只需總結一場來賓講座，被認為很好拿分；考試允許帶一張雙面A4小抄。"
    ja: "ゲスト講義を要約するフォーラムレポートは点を取りやすく、試験にはA4両面のメモを持ち込める。"
    ko: "초청 강연을 요약하는 포럼 보고서는 점수 받기 쉽고, 시험에 A4 양면 요약지를 가져갈 수 있음."
    vi: "Bài báo cáo forum chỉ cần tóm tắt một bài giảng khách mời, dễ lấy điểm; thi được mang một tờ A4 hai mặt."
    ms: "Laporan forum, ringkasan kuliah jemputan, dianggap mudah dapat markah, dan peperiksaan benarkan helaian nota A4 dua muka."
    id: "Laporan forum, yang merangkum kuliah tamu, dinilai mudah dapat nilai, dan ujian boleh membawa catatan A4 bolak-balik."
    hi: "फ़ोरम रिपोर्ट, जिसमें एक गेस्ट लेक्चर का सार लिखना होता है, आसान मानी जाती है, और परीक्षा में दो तरफ़ा A4 चीट शीट की अनुमति है।"
  - en: "The food economics weeks were often called dull, and a couple found essay marking strict on referencing; it covers a fair amount of content for a breadth."
    zh: "食品经济学那几周常被说枯燥，也有人觉得论文在引用格式上评分严格；作为通识课内容量不算少。"
    zh-TW: "食品經濟學那幾週常被說枯燥，也有人覺得論文在引用格式上評分嚴格；作為通識課內容量不算少。"
    ja: "食料経済の回は退屈との声が多く、エッセイの引用の採点が厳しいという人も。ブレッドスとしては内容量はそこそこ多い。"
    ko: "식품 경제 주차는 지루하다는 평이 많고, 에세이 인용 채점이 엄격하다는 의견도. 교양치고 분량은 꽤 됨."
    vi: "Các tuần kinh tế thực phẩm hay bị chê nhàm chán, vài người thấy chấm luận chặt về trích dẫn; nội dung khá nhiều so với môn breadth."
    ms: "Minggu ekonomi makanan sering dikatakan membosankan, dan ada yang rasa pemarkahan esei ketat soal rujukan; kandungan agak banyak."
    id: "Minggu ekonomi pangan sering disebut membosankan, dan beberapa merasa penilaian esai ketat soal referensi; materinya cukup banyak."
    hi: "खाद्य अर्थशास्त्र वाले हफ़्ते अक्सर उबाऊ बताए गए, और कुछ को निबंध में संदर्भों पर सख़्त मार्किंग लगी; ब्रेड्थ के हिसाब से सामग्री काफ़ी है।"
workload: light
difficulty: easy
