code: UNIB20014
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/unib20014
reviews: 10
from: 2014
to: 2024
checked: 2026-10-21
points:
  - en: "Reviewers consistently call it an enjoyable, well-run breadth with relevant content and helpful tutors, and no science background needed."
    zh: "评论者普遍认为这是一门愉快、组织良好的通识课，内容贴近生活，辅导老师很热心，不需要理科背景。"
    zh-TW: "評論者普遍認為這是一門愉快、組織良好的通識課，內容貼近生活，助教很熱心，不需要理科背景。"
    ja: "楽しく運営もしっかりしたブレッドスで、内容が身近、チューターも親切、理系の素養は不要という評価が一貫している。"
    ko: "즐겁고 잘 운영되는 교양으로, 내용이 생활과 밀접하고 튜터가 친절하며 이과 배경이 필요 없다는 평이 일관됨."
    vi: "Người review đều nói đây là môn breadth thú vị, tổ chức tốt, nội dung thiết thực, tutor nhiệt tình, không cần nền khoa học."
    ms: "Pengulas konsisten kata ia subjek breadth menyeronokkan dan teratur, kandungan relevan, tutor membantu, tanpa perlu latar sains."
    id: "Pengulas konsisten menyebutnya breadth menyenangkan dan tertata, materi relevan, tutor membantu, tanpa perlu latar sains."
    hi: "रिव्यूअर लगातार इसे मज़ेदार, अच्छी तरह चलने वाला ब्रेड्थ बताते हैं; विषय उपयोगी, ट्यूटर मददगार, साइंस बैकग्राउंड ज़रूरी नहीं।"
  - en: "The forum report, which summarises a guest lecture, is seen as easy to score in, and the exam allows a double-sided A4 cheat sheet."
    zh: "论坛报告只需总结一场嘉宾讲座，被认为很好拿分；考试允许带一张双面A4小抄。"
    zh-TW: "論壇報告只需總結一場來賓講座，被認為很好拿分；考試允許帶一張雙面A4小抄。"
    ja: "ゲスト講義を要約するフォーラムレポートは点を取りやすく、試験にはA4両面のメモを持ち込める。"
    ko: "초청 강연을 요약하는 포럼 보고서는 점수 받기 쉽고, 시험에 A4 양면 요약지를 가져갈 수 있음."
    vi: "Bài báo cáo forum chỉ cần tóm tắt một bài giảng khách mời, dễ lấy điểm; thi được mang một tờ A4 hai mặt."
    ms: "Laporan forum, ringkasan kuliah jemputan, dianggap mudah dapat markah, dan peperiksaan benarkan helaian nota A4 dua muka."
    id: "Laporan forum, yang merangkum kuliah tamu, dinilai mudah dapat nilai, dan ujian boleh membawa catatan A4 bolak-balik."
    hi: "फ़ोरम रिपोर्ट, जिसमें एक गेस्ट लेक्चर का सार लिखना होता है, आसान मानी जाती है, और परीक्षा में दो तरफ़ा A4 चीट शीट की अनुमति है।"
  - en: "The food economics weeks were often called dull, and a couple found essay marking strict on referencing; it covers a fair amount of content for a breadth."
    zh: "食品经济学那几周常被说枯燥，也有人觉得论文在引用格式上评分严格；作为通识课内容量不算少。"
    zh-TW: "食品經濟學那幾週常被說枯燥，也有人覺得論文在引用格式上評分嚴格；作為通識課內容量不算少。"
    ja: "食料経済の回は退屈との声が多く、エッセイの引用の採点が厳しいという人も。ブレッドスとしては内容量はそこそこ多い。"
    ko: "식품 경제 주차는 지루하다는 평이 많고, 에세이 인용 채점이 엄격하다는 의견도. 교양치고 분량은 꽤 됨."
    vi: "Các tuần kinh tế thực phẩm hay bị chê nhàm chán, vài người thấy chấm luận chặt về trích dẫn; nội dung khá nhiều so với môn breadth."
    ms: "Minggu ekonomi makanan sering dikatakan membosankan, dan ada yang rasa pemarkahan esei ketat soal rujukan; kandungan agak banyak."
    id: "Minggu ekonomi pangan sering disebut membosankan, dan beberapa merasa penilaian esai ketat soal referensi; materinya cukup banyak."
    hi: "खाद्य अर्थशास्त्र वाले हफ़्ते अक्सर उबाऊ बताए गए, और कुछ को निबंध में संदर्भों पर सख़्त मार्किंग लगी; ब्रेड्थ के हिसाब से सामग्री काफ़ी है।"
sections:
  content:
    - en: "Broad, easy-to-follow topics from nutrition and sugar or salt to GM foods and aquaculture; no science background needed. Most found it interesting and relevant to life."
      zh: "主题很广，从营养、糖和盐到转基因食品、水产养殖，好跟上，不需要理科背景。多数人觉得有趣又贴近生活。"
      zh-TW: "主題很廣，從營養、糖和鹽到基改食品、水產養殖，好跟上，不需要理科背景。多數人覺得有趣又貼近生活。"
      ja: "栄養や砂糖・塩からGM食品、養殖まで幅広く、ついていきやすい。理系の背景は不要。面白く生活に関係あるという声が多い。"
      ko: "영양, 설탕·소금부터 GM 식품, 양식업까지 주제가 넓고 따라가기 쉽다. 이과 배경은 필요 없다. 대부분 흥미롭고 생활과 관련 있다고 한다."
      vi: "Chủ đề rộng, dễ theo, từ dinh dưỡng, đường, muối đến thực phẩm biến đổi gen và nuôi trồng thủy sản; không cần nền khoa học. Đa số thấy thú vị, gần gũi."
      ms: "Topik luas dan mudah diikuti, dari pemakanan, gula dan garam hingga makanan GM dan akuakultur; tiada latar sains diperlukan. Kebanyakan rasa menarik dan relevan."
      id: "Topiknya luas dan mudah diikuti, dari gizi, gula dan garam sampai pangan GM dan akuakultur; tidak perlu latar sains. Kebanyakan merasa menarik dan relevan."
      hi: "पोषण, चीनी-नमक से लेकर GM फ़ूड और जलकृषि तक, व्यापक और समझने में आसान टॉपिक; साइंस बैकग्राउंड ज़रूरी नहीं। ज़्यादातर को रोचक और जीवन से जुड़ा लगा।"
    - en: "Several found the food economy and supply-and-demand part boring."
      zh: "好几位觉得食品经济和供需那部分很无聊。"
      zh-TW: "好幾位覺得食品經濟和供需那部分很無聊。"
      ja: "食品経済や需要と供給のパートは退屈だったという声が複数。"
      ko: "식품 경제와 수요·공급 파트가 지루했다는 사람이 여럿이다."
      vi: "Vài người thấy phần kinh tế thực phẩm và cung cầu rất chán."
      ms: "Beberapa orang dapati bahagian ekonomi makanan dan penawaran-permintaan membosankan."
      id: "Beberapa orang merasa bagian ekonomi pangan dan penawaran-permintaan membosankan."
      hi: "कई लोगों को फ़ूड इकॉनमी और माँग-आपूर्ति वाला हिस्सा उबाऊ लगा।"
  work:
    - en: "The forum report just summarises a guest lecture, no research or referencing, and is seen as easy marks. Most found the MST and exam fair."
      zh: "论坛报告只要总结一场客座讲座，不用查资料也不用引用，被认为好拿分。多数人觉得 MST 和期末都公平。"
      zh-TW: "論壇報告只要總結一場客座講座，不用查資料也不用引用，被認為好拿分。多數人覺得 MST 和期末都公平。"
      ja: "フォーラムレポートはゲスト講義を要約するだけで、調査も引用も不要。点が取りやすいとされる。MSTと期末は公平という声が多い。"
      ko: "포럼 보고서는 게스트 강의를 요약만 하면 되고 조사나 인용이 필요 없어 점수 받기 쉽다. MST와 기말은 대부분 공정했다고 한다."
      vi: "Báo cáo forum chỉ tóm tắt một buổi giảng khách mời, không cần nghiên cứu hay trích dẫn, dễ lấy điểm. Đa số thấy MST và thi cuối công bằng."
      ms: "Laporan forum hanya meringkaskan kuliah tetamu, tiada penyelidikan atau rujukan, dianggap markah mudah. Kebanyakan rasa MST dan peperiksaan adil."
      id: "Laporan forum cukup merangkum kuliah tamu, tanpa riset atau referensi, dianggap nilai gampang. Kebanyakan merasa MST dan ujian akhir adil."
      hi: "फ़ोरम रिपोर्ट में बस एक गेस्ट लेक्चर का सार लिखना है, न रिसर्च न रेफ़रेंसिंग, आसान अंक माने जाते हैं। ज़्यादातर को MST और परीक्षा ठीक लगी।"
    - en: "The final exam allows a double-sided A4 cheat sheet (the MST does not). One reviewer found the short research essay marked tough on referencing."
      zh: "期末可以带一张双面 A4 cheat sheet（MST 不行）。有同学觉得短篇研究论文在引用格式上扣得严。"
      zh-TW: "期末可以帶一張雙面 A4 cheat sheet（MST 不行）。有同學覺得短篇研究論文在引用格式上扣得嚴。"
      ja: "期末は両面A4のチートシート持ち込み可（MSTは不可）。短い研究エッセイは引用の採点が厳しかったという人も。"
      ko: "기말엔 양면 A4 치트시트를 가져갈 수 있다(MST는 불가). 짧은 연구 에세이가 인용 부분에서 박하게 채점됐다는 사람도 있다."
      vi: "Thi cuối kỳ được mang một tờ A4 hai mặt (MST thì không). Một người thấy bài luận nghiên cứu ngắn bị chấm khắt khe phần trích dẫn."
      ms: "Peperiksaan akhir benarkan helaian ringkasan A4 dua muka (MST tidak). Seorang pengulas rasa esei penyelidikan pendek dinilai ketat pada rujukan."
      id: "Ujian akhir boleh bawa contekan A4 bolak-balik (MST tidak). Satu pengulas merasa esai riset pendek dinilai ketat soal referensi."
      hi: "फ़ाइनल में दो तरफ़ा A4 चीट शीट की अनुमति है (MST में नहीं)। एक रिव्यूअर को छोटे रिसर्च निबंध में रेफ़रेंसिंग पर सख़्त अंकन लगा।"
  study:
    - en: "Take clear notes on lectures, tutorials and readings through the semester to build your cheat sheet; tutors point out what matters for the exam."
      zh: "整个学期把讲座、tutorial 和阅读都记好笔记，用来做 cheat sheet；tutor 会提示考试重点。"
      zh-TW: "整個學期把講座、tutorial 和閱讀都做好筆記，用來做 cheat sheet；tutor 會提示考試重點。"
      ja: "学期中に講義・チュートリアル・文献のノートをきちんと取り、チートシート作りに使う。チューターが試験の要点を教えてくれる。"
      ko: "학기 내내 강의, 튜토리얼, 읽기 자료를 잘 정리해 치트시트를 만들라. 튜터가 시험에 중요한 걸 짚어 준다."
      vi: "Ghi chép rõ bài giảng, tutorial và bài đọc suốt kỳ để làm tờ tóm tắt; tutor sẽ chỉ ra phần quan trọng cho kỳ thi."
      ms: "Buat nota jelas tentang kuliah, tutorial dan bacaan sepanjang semester untuk helaian ringkasan; tutor tunjukkan apa yang penting untuk peperiksaan."
      id: "Catat kuliah, tutorial dan bacaan dengan rapi sepanjang semester untuk bahan contekan; tutor menunjukkan apa yang penting untuk ujian."
      hi: "पूरे सेमेस्टर लेक्चर, ट्यूटोरियल और रीडिंग्स के साफ़ नोट्स बनाएँ ताकि चीट शीट बने; ट्यूटर बताते हैं कि परीक्षा के लिए क्या ज़रूरी है।"
  watch:
    - en: "One 2024 reviewer notes the exam format has changed over time, from online open-book to in person with a cheat sheet, so check the current setup."
      zh: "有 2024 年的同学提到考试形式变过，从线上开卷改成线下带 cheat sheet，选课前确认一下现在的安排。"
      zh-TW: "有 2024 年的同學提到考試形式變過，從線上開書改成實體帶 cheat sheet，選課前確認一下現在的安排。"
      ja: "2024年のレビューでは、試験形式がオンラインのオープンブックからチートシート付き対面式に変わったとのこと。現在の形式を確認しよう。"
      ko: "2024년 리뷰에 따르면 시험 형식이 온라인 오픈북에서 치트시트 지참 대면 시험으로 바뀌었다. 현재 방식을 확인하라."
      vi: "Một người học năm 2024 cho biết hình thức thi đã đổi, từ online mở sách sang thi trực tiếp có tờ tóm tắt, nên kiểm tra cách thi hiện tại."
      ms: "Seorang pengulas 2024 kata format peperiksaan berubah, dari dalam talian buku terbuka ke bersemuka dengan helaian ringkasan, jadi semak susunan semasa."
      id: "Satu pengulas 2024 bilang format ujian berubah, dari online open-book ke tatap muka dengan contekan, jadi cek format yang sekarang."
      hi: "2024 के एक रिव्यूअर के अनुसार परीक्षा का तरीका बदला है, ऑनलाइन ओपन-बुक से चीट शीट वाली ऑफ़लाइन परीक्षा तक, तो मौजूदा व्यवस्था जाँच लें।"
workload: light
difficulty: easy
