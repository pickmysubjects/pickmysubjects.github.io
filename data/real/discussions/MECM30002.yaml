reviews: 5
from: 2017
to: 2025
checked: 2026-10-17
points:
  - en: "The media and communications capstone. Several found it repeats earlier subjects (globalisation, digital tech and news) and is easy to do well in, with free choice of assignment topics."
    zh: "媒体与传播专业的毕业课。好几人觉得它重复了之前课程的内容（全球化、数字技术与新闻），容易拿好成绩，作业题目可自由选择。"
    zh-TW: "媒體與傳播主修的總結課。好幾個人覺得它重複了之前課程的內容（全球化、數位科技與新聞），容易拿好成績，作業題目可自由選擇。"
    ja: "メディア・コミュニケーション専攻のキャップストーン。以前の科目（グローバル化、デジタル技術とニュース）の繰り返しで好成績を取りやすく、課題のテーマは自由という声が複数。"
    ko: "미디어·커뮤니케이션 전공 캡스톤. 이전 과목(세계화, 디지털 기술과 뉴스)의 반복이라 좋은 점수 받기 쉽고 과제 주제는 자유라는 의견이 여럿."
    vi: "Môn tổng kết chuyên ngành truyền thông. Nhiều người thấy môn lặp lại các môn trước (toàn cầu hóa, công nghệ số và tin tức), dễ đạt điểm tốt, đề bài tự chọn."
    ms: "Capstone media dan komunikasi. Beberapa orang dapati ia mengulang subjek terdahulu (globalisasi, teknologi digital dan berita) dan mudah dapat markah baik, dengan topik tugasan bebas."
    id: "Capstone media dan komunikasi. Beberapa orang merasa isinya mengulang mata kuliah sebelumnya (globalisasi, teknologi digital dan berita) dan mudah dapat nilai bagus, dengan topik tugas bebas."
    hi: "मीडिया और कम्युनिकेशन का कैपस्टोन। कई को यह पहले के विषयों (ग्लोबलाइज़ेशन, डिजिटल टेक और न्यूज़) का दोहराव लगा और अच्छे अंक पाना आसान, असाइनमेंट विषय चुनने की आज़ादी के साथ।"
  - en: "There are short videos instead of full lectures, and tutorials can feel unfocused. The newest review (2025) called it poorly designed and a waste of time."
    zh: "没有完整讲座，只有短视频，辅导课可能显得散乱。最新的评论（2025）说这门课设计差、浪费时间。"
    zh-TW: "沒有完整講座，只有短影片，輔導課可能顯得散亂。最新的評論（2025）說這門課設計差、浪費時間。"
    ja: "通常の講義の代わりに短い動画があり、チュートリアルはまとまりに欠けることも。最新のレビュー（2025）は設計が悪く時間の無駄だとした。"
    ko: "정식 강의 대신 짧은 영상이 있고, 튜토리얼은 산만할 수 있음. 최신 리뷰(2025)는 설계가 부실하고 시간 낭비라고 함."
    vi: "Có video ngắn thay cho bài giảng đầy đủ, và tutorial có thể thiếu tập trung. Đánh giá mới nhất (2025) nói môn thiết kế kém và tốn thời gian."
    ms: "Ada video pendek dan bukan kuliah penuh, dan tutorial boleh terasa tidak fokus. Ulasan terbaru (2025) kata ia direka dengan teruk dan membuang masa."
    id: "Ada video pendek alih-alih kuliah penuh, dan tutorial bisa terasa tidak fokus. Ulasan terbaru (2025) menyebutnya dirancang buruk dan buang waktu."
    hi: "पूरे लेक्चर के बजाय छोटे वीडियो हैं, और ट्यूटोरियल बिखरे लग सकते हैं। सबसे नए रिव्यू (2025) ने इसे ख़राब डिज़ाइन वाला और समय की बर्बादी बताया।"
sections:
  content:
    - en: "The Media and Communications capstone, revisiting earlier topics like globalisation and digital tech in news, time and relationships. One 2022 reviewer says there are no lectures, just short videos and slides."
      zh: "媒体与传播专业的 capstone，回顾之前学过的话题，比如全球化、数字技术与新闻、时间和人际关系。一位 2022 年的同学说没有讲课，只有短视频和课件。"
      zh-TW: "媒體與傳播主修的 capstone，回顧之前學過的主題，例如全球化、數位科技與新聞、時間和人際關係。一位 2022 年的同學說沒有講課，只有短影片和投影片。"
      ja: "メディア・コミュニケーション専攻のキャップストーン。グローバル化、ニュース・時間・人間関係とデジタル技術など既習テーマを振り返る。2022年の一人は講義がなく短い動画とスライドだけだったと言う。"
      ko: "미디어·커뮤니케이션 캡스톤으로 세계화, 뉴스·시간·관계와 디지털 기술 등 이전 주제를 다시 다룬다. 2022년 한 리뷰는 강의 없이 짧은 영상과 슬라이드만 있었다고 한다."
      vi: "Môn capstone ngành Truyền thông, ôn lại chủ đề cũ như toàn cầu hóa, công nghệ số với tin tức, thời gian và quan hệ. Một người năm 2022 nói không có bài giảng, chỉ video ngắn và slide."
      ms: "Capstone Media dan Komunikasi, mengulang topik awal seperti globalisasi dan teknologi digital dalam berita, masa dan hubungan. Seorang pengulas 2022 kata tiada kuliah, hanya video pendek dan slaid."
      id: "Capstone Media dan Komunikasi, mengulang topik sebelumnya seperti globalisasi dan teknologi digital dalam berita, waktu dan hubungan. Satu pengulas 2022 bilang tidak ada kuliah, hanya video pendek dan slide."
      hi: "मीडिया और कम्युनिकेशन का कैपस्टोन, पहले के विषय जैसे वैश्वीकरण और ख़बरों, समय व रिश्तों में डिजिटल तकनीक दोहराता है। 2022 का एक कहता है लेक्चर नहीं, सिर्फ़ छोटे वीडियो और स्लाइड।"
  work:
    - en: "Standard media assignments where you pick your own topics. Several reviewers found it easy to do well, one even without doing the lectures or readings."
      zh: "典型的媒体传播作业，题目可以自己选。好几位同学觉得很容易考好，有人甚至没看讲课和阅读也考得不错。"
      zh-TW: "典型的媒體傳播作業，題目可以自己選。好幾位同學覺得很容易考好，有人甚至沒看講課和閱讀也考得不錯。"
      ja: "テーマを自分で選べる典型的なメディア系課題。好成績は取りやすいという声が複数で、講義もリーディングもせずに良かった人もいる。"
      ko: "주제를 직접 고르는 전형적인 미디어 과제. 잘하기 쉽다는 평이 여럿이고, 강의와 리딩을 안 하고도 잘 받은 사람도 있다."
      vi: "Bài tập truyền thông kiểu quen thuộc, tự chọn đề. Nhiều người thấy dễ điểm tốt, có người còn không xem bài giảng hay đọc tài liệu."
      ms: "Tugasan media biasa di mana anda pilih topik sendiri. Beberapa pengulas rasa mudah berjaya, seorang bahkan tanpa kuliah atau bacaan."
      id: "Tugas media standar dengan topik pilihan sendiri. Beberapa pengulas merasa mudah dapat nilai bagus, satu bahkan tanpa kuliah atau bacaan."
      hi: "सामान्य मीडिया असाइनमेंट जिनमें विषय खुद चुनते हैं। कई रिव्यूअर्स को अच्छा करना आसान लगा, एक को तो बिना लेक्चर या रीडिंग के।"
  watch:
    - en: "Opinions split sharply: some enjoyed it, while the newest (2025) reviewer and a 2017 one called it a poorly designed waste of time. As a capstone you may not be able to avoid it."
      zh: "评价很两极：有人喜欢，但最新（2025）和一位 2017 年的同学说设计很差、浪费时间。作为 capstone，你可能躲不开。"
      zh-TW: "評價很兩極：有人喜歡，但最新（2025）和一位 2017 年的同學說設計很差、浪費時間。作為 capstone，你可能躲不掉。"
      ja: "評価は真っ二つ。楽しんだ人もいれば、最新（2025年）と2017年のレビューは設計が悪く時間の無駄だと言う。キャップストーンなので避けられないかもしれない。"
      ko: "평가가 극명히 갈린다. 즐긴 사람도 있지만, 최신(2025)과 2017년 리뷰는 설계가 엉망인 시간 낭비라고 했다. 캡스톤이라 피할 수 없을 수도 있다."
      vi: "Ý kiến rất trái chiều: có người thích, nhưng người mới nhất (2025) và một người 2017 gọi đây là môn thiết kế kém, phí thời gian. Là capstone nên có thể không tránh được."
      ms: "Pandangan sangat berbelah: ada yang suka, tetapi pengulas terbaru (2025) dan seorang dari 2017 kata ia direka buruk dan membuang masa. Sebagai capstone, anda mungkin tidak dapat mengelaknya."
      id: "Pendapat sangat terbelah: ada yang suka, tapi pengulas terbaru (2025) dan satu dari 2017 menyebutnya dirancang buruk dan buang waktu. Sebagai capstone, mungkin tak bisa dihindari."
      hi: "राय बहुत बँटी है: कुछ को पसंद आया, पर सबसे नए (2025) और 2017 के एक ने इसे ख़राब डिज़ाइन वाला और समय की बर्बादी कहा। कैपस्टोन होने से शायद इसे टाल न सकें।"
difficulty: easy
