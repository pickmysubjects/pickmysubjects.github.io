points:
  - en: "The media and communications capstone. Several found it repeats earlier subjects (globalisation, digital tech and news) and is easy to do well in, with free choice of assignment topics."
    zh: "媒体与传播专业的毕业课。好几人觉得它重复了之前课程的内容（全球化、数字技术与新闻），容易拿好成绩，作业题目可自由选择。"
    zh-TW: "媒體與傳播主修的總結課。好幾個人覺得它重複了之前課程的內容（全球化、數位科技與新聞），容易拿好成績，作業題目可自由選擇。"
    ja: "メディア・コミュニケーション専攻のキャップストーン。以前の科目（グローバル化、デジタル技術とニュース）の繰り返しで好成績を取りやすく、課題のテーマは自由という声が複数。"
    ko: "미디어·커뮤니케이션 전공 캡스톤. 이전 과목(세계화, 디지털 기술과 뉴스)의 반복이라 좋은 점수 받기 쉽고 과제 주제는 자유라는 의견이 여럿."
    vi: "Môn tổng kết chuyên ngành truyền thông. Nhiều người thấy môn lặp lại các môn trước (toàn cầu hóa, công nghệ số và tin tức), dễ đạt điểm tốt, đề bài tự chọn."
    ms: "Capstone media dan komunikasi. Beberapa orang dapati ia mengulang subjek terdahulu (globalisasi, teknologi digital dan berita) dan mudah dapat markah baik, dengan topik tugasan bebas."
    id: "Capstone media dan komunikasi. Beberapa orang merasa isinya mengulang mata kuliah sebelumnya (globalisasi, teknologi digital dan berita) dan mudah dapat nilai bagus, dengan topik tugas bebas."
    hi: "मीडिया और कम्युनिकेशन का कैपस्टोन। कई को यह पहले के विषयों (ग्लोबलाइज़ेशन, डिजिटल टेक और न्यूज़) का दोहराव लगा और अच्छे अंक पाना आसान, असाइनमेंट विषय चुनने की आज़ादी के साथ।"
  - en: "There are short videos instead of full lectures, and tutorials can feel unfocused. The newest review (2025) called it poorly designed and a waste of time."
    zh: "没有完整讲座，只有短视频，辅导课可能显得散乱。最新的评论（2025）说这门课设计差、浪费时间。"
    zh-TW: "沒有完整講座，只有短影片，輔導課可能顯得散亂。最新的評論（2025）說這門課設計差、浪費時間。"
    ja: "通常の講義の代わりに短い動画があり、チュートリアルはまとまりに欠けることも。最新のレビュー（2025）は設計が悪く時間の無駄だとした。"
    ko: "정식 강의 대신 짧은 영상이 있고, 튜토리얼은 산만할 수 있음. 최신 리뷰(2025)는 설계가 부실하고 시간 낭비라고 함."
    vi: "Có video ngắn thay cho bài giảng đầy đủ, và tutorial có thể thiếu tập trung. Đánh giá mới nhất (2025) nói môn thiết kế kém và tốn thời gian."
    ms: "Ada video pendek dan bukan kuliah penuh, dan tutorial boleh terasa tidak fokus. Ulasan terbaru (2025) kata ia direka dengan teruk dan membuang masa."
    id: "Ada video pendek alih-alih kuliah penuh, dan tutorial bisa terasa tidak fokus. Ulasan terbaru (2025) menyebutnya dirancang buruk dan buang waktu."
    hi: "पूरे लेक्चर के बजाय छोटे वीडियो हैं, और ट्यूटोरियल बिखरे लग सकते हैं। सबसे नए रिव्यू (2025) ने इसे ख़राब डिज़ाइन वाला और समय की बर्बादी बताया।"
difficulty: easy
