to: 2020
checked: 2026-10-14
points:
  - en: "The newest reviews (2020, online) are negative: heavy required readings, missing or hard-to-follow recordings, and little guidance on what the exam would cover."
    zh: "最新的评价（2020 年网课）偏负面：必读材料多，录播缺失或难懂，考试范围也缺乏指引。"
    zh-TW: "最新的評價（2020 年線上課）偏負面：必讀材料多，錄影缺漏或難懂，考試範圍也缺乏指引。"
    ja: "最新のレビュー（2020年・オンライン）は否定的。必読文献が多く、録画が欠けていたり分かりにくかったりし、試験範囲の案内も乏しかった。"
    ko: "가장 최근 리뷰(2020년 온라인)는 부정적이다. 필독 자료가 많고, 녹화 강의가 빠지거나 이해하기 어려웠으며, 시험 범위 안내도 부족했다."
    vi: "Các đánh giá mới nhất (2020, học online) tiêu cực: nhiều bài đọc bắt buộc, bản ghi bài giảng thiếu hoặc khó theo, và ít hướng dẫn về phạm vi thi."
    ms: "Ulasan terbaru (2020, dalam talian) negatif: banyak bacaan wajib, rakaman hilang atau sukar diikuti, dan sedikit panduan tentang skop peperiksaan."
    id: "Ulasan terbaru (2020, daring) negatif: banyak bacaan wajib, rekaman hilang atau sulit diikuti, dan sedikit arahan soal cakupan ujian."
    hi: "सबसे नए रिव्यू (2020, ऑनलाइन) नकारात्मक हैं: ज़रूरी रीडिंग बहुत, रिकॉर्डिंग गायब या समझने में मुश्किल, और परीक्षा में क्या आएगा इस पर कम मार्गदर्शन।"
  - en: "The pair assignment is worth about half the grade and takes a lot of work, so reviewers stress picking a good partner; one disliked partners being drawn at random."
    zh: "两人作业约占一半成绩，工作量大，评价都强调要找好搭档；有人不喜欢搭档是随机抽的。"
    zh-TW: "兩人作業約占一半成績，工作量大，評價都強調要找好搭檔；有人不喜歡搭檔是隨機抽的。"
    ja: "ペア課題が成績の約半分を占め作業量も多いので、良い相手を選ぶことが大事という声。相手がくじで決まるのが嫌だったという人も。"
    ko: "2인 과제가 성적의 약 절반이고 작업량이 많아 좋은 파트너를 고르라는 조언이 많다. 파트너를 무작위로 뽑는 게 싫었다는 사람도 있다."
    vi: "Bài làm theo cặp chiếm khoảng nửa điểm và tốn nhiều công, nên mọi người nhấn mạnh chọn bạn cặp tốt; một người không thích việc ghép cặp ngẫu nhiên."
    ms: "Tugasan berpasangan bernilai kira-kira separuh gred dan banyak kerja, jadi pengulas tekankan pilih pasangan yang baik; seorang tidak suka pasangan dicabut secara rawak."
    id: "Tugas berpasangan bernilai sekitar separuh nilai dan banyak kerja, jadi pengulas menekankan memilih pasangan yang baik; satu orang tidak suka pasangan diundi acak."
    hi: "जोड़ी वाला असाइनमेंट लगभग आधे अंकों का है और मेहनत ज़्यादा लगती है, इसलिए अच्छा साथी चुनने पर ज़ोर है; एक को साथी का रैंडम चुना जाना पसंद नहीं आया।"
  - en: "Older reviews (2017–2018) are split: some found the material clear and useful for strategy and operations, others found lectures disorganised; a few suggest buying the textbook."
    zh: "较早的评价（2017–2018）有分歧：有人觉得内容清楚、对战略和运营有用，也有人觉得讲座杂乱；有几位建议买教材。"
    zh-TW: "較早的評價（2017–2018）有分歧：有人覺得內容清楚、對策略和營運有用，也有人覺得講座雜亂；有幾位建議買教科書。"
    ja: "古いレビュー（2017〜2018年）は賛否両論。内容が明快で戦略・オペレーションに役立つという声もあれば、講義がまとまりに欠けるという声も。教科書購入を勧める人も。"
    ko: "예전 리뷰(2017–2018)는 엇갈린다. 내용이 명확하고 전략·운영에 유용했다는 사람도, 강의가 산만했다는 사람도 있다. 교재 구입을 권하는 사람도 있다."
    vi: "Các đánh giá cũ (2017–2018) trái chiều: có người thấy nội dung rõ ràng, hữu ích cho chiến lược và vận hành, người khác thấy bài giảng lộn xộn; vài người khuyên mua giáo trình."
    ms: "Ulasan lama (2017–2018) berbelah bahagi: ada yang dapati bahan jelas dan berguna untuk strategi dan operasi, yang lain dapati kuliah tidak teratur; beberapa cadang beli buku teks."
    id: "Ulasan lama (2017–2018) terbelah: ada yang merasa materinya jelas dan berguna untuk strategi dan operasi, yang lain merasa kuliahnya berantakan; beberapa menyarankan membeli buku teks."
    hi: "पुराने रिव्यू (2017–2018) बँटे हुए हैं: कुछ को सामग्री साफ़ और रणनीति व ऑपरेशंस के लिए उपयोगी लगी, कुछ को लेक्चर बिखरे हुए; कुछ ने पाठ्यपुस्तक खरीदने की सलाह दी।"
workload: heavy
