reviews: 10
from: 2018
to: 2024
checked: 2026-10-17
points:
  - en: "An intro to political theory with dense lectures and dense, sometimes archaic readings that you must understand for the essays. Many found it hard to do well in."
    zh: "政治理论入门，讲座和阅读材料都很艰深，有时还很古旧，而论文要求你真正读懂它们。很多人觉得难拿高分。"
    zh-TW: "政治理論入門，講座和閱讀材料都很艱深，有時還很古舊，而論文要求你真正讀懂它們。很多人覺得難拿高分。"
    ja: "政治理論の入門で、講義も文献も難解、時に古めかしい文献をエッセイのためにしっかり理解する必要がある。高得点は難しいという声が多い。"
    ko: "정치 이론 입문으로 강의와 읽기 자료가 모두 어렵고 때로 고전적인데, 에세이를 위해 제대로 이해해야 함. 고득점이 어렵다는 의견이 많음."
    vi: "Nhập môn lý thuyết chính trị với bài giảng dày đặc và bài đọc khó, đôi khi cổ điển, mà bạn phải hiểu để viết luận. Nhiều người thấy khó đạt điểm cao."
    ms: "Pengenalan teori politik dengan kuliah padat dan bacaan padat, kadangkala kuno, yang perlu difahami untuk esei. Ramai dapati sukar mendapat markah baik."
    id: "Pengantar teori politik dengan kuliah padat dan bacaan padat, kadang kuno, yang harus dipahami untuk esai. Banyak yang merasa sulit dapat nilai bagus."
    hi: "राजनीतिक सिद्धांत का परिचय, घने लेक्चर और घनी, कभी-कभी पुरानी रीडिंग के साथ जिन्हें निबंधों के लिए समझना ज़रूरी है। कई को अच्छे अंक पाना कठिन लगा।"
  - en: "Opinions split sharply: some call it boring and not for breadth students, others call it high effort but eye-opening. Tutorials were usually the best part, and keeping up with readings from week one is key."
    zh: "评价两极：有人说枯燥、不适合跨学科选修，也有人说虽然费力但令人大开眼界。辅导课通常是最好的部分，从第一周起跟上阅读是关键。"
    zh-TW: "評價兩極：有人說枯燥、不適合Breadth選修，也有人說雖然費力但令人大開眼界。輔導課通常是最好的部分，從第一週起跟上閱讀是關鍵。"
    ja: "評価ははっきり分かれる。退屈でBreadth向きではないという人もいれば、大変だが視野が広がるという人も。チュートリアルが一番良いことが多く、1週目から文献についていくことが鍵。"
    ko: "의견이 크게 갈림. 지루하고 Breadth로는 비추라는 사람도, 힘들지만 눈이 트인다는 사람도 있음. 튜토리얼이 대체로 가장 좋았고, 1주차부터 읽기를 따라가는 게 핵심."
    vi: "Ý kiến chia rẽ mạnh: có người nói nhàm và không hợp làm Breadth, người khác nói tốn sức nhưng mở mang tầm mắt. Tutorial thường là phần hay nhất, và theo kịp bài đọc từ tuần một là chìa khóa."
    ms: "Pendapat sangat berbelah: ada yang kata membosankan dan tidak sesuai untuk Breadth, ada yang kata memerlukan usaha tinggi tetapi membuka mata. Tutorial biasanya bahagian terbaik, dan ikut bacaan dari minggu pertama adalah kunci."
    id: "Pendapat sangat terbelah: ada yang bilang membosankan dan tak cocok untuk Breadth, ada yang bilang butuh usaha besar tapi membuka wawasan. Tutorial biasanya bagian terbaik, dan mengikuti bacaan sejak minggu pertama adalah kunci."
    hi: "राय तीखे ढंग से बँटी है: कुछ इसे उबाऊ और Breadth के लिए ठीक नहीं कहते, दूसरे इसे मेहनत वाला पर आँखें खोलने वाला। ट्यूटोरियल आमतौर पर सबसे अच्छे रहे, और पहले हफ़्ते से रीडिंग के साथ चलना ज़रूरी है।"
sections:
  content:
    - en: "An introduction to political theory, from Marxism and capitalism to conservative and progressive ideas. Lectures are dense; views split between eye-opening and dull."
      zh: "政治理论入门，从马克思主义、资本主义到保守和进步思想。讲座信息密；评价两极，有人觉得大开眼界，有人觉得很闷。"
      zh-TW: "政治理論入門，從馬克思主義、資本主義到保守和進步思想。講座資訊密；評價兩極，有人覺得大開眼界，有人覺得很悶。"
      ja: "政治理論の入門で、マルクス主義と資本主義、保守と進歩などを扱う。講義は濃密。目から鱗という人と退屈という人に分かれる。"
      ko: "마르크스주의와 자본주의, 보수와 진보 사상 등을 다루는 정치이론 입문이다. 강의가 빽빽하다. 눈이 트였다는 사람과 지루했다는 사람으로 갈린다."
      vi: "Nhập môn lý thuyết chính trị, từ chủ nghĩa Marx, tư bản đến tư tưởng bảo thủ và cấp tiến. Bài giảng dày đặc; ý kiến chia giữa mở mang tầm mắt và nhàm chán."
      ms: "Pengenalan teori politik, dari Marxisme dan kapitalisme hingga idea konservatif dan progresif. Kuliah padat; pandangan berbelah antara membuka minda dan membosankan."
      id: "Pengantar teori politik, dari Marxisme dan kapitalisme hingga gagasan konservatif dan progresif. Kuliahnya padat; pendapat terbelah antara membuka wawasan dan membosankan."
      hi: "राजनीतिक सिद्धांत का परिचय, मार्क्सवाद और पूँजीवाद से लेकर रूढ़िवादी और प्रगतिशील विचारों तक। लेक्चर घने हैं; राय बँटी है, आँखें खोलने वाला या उबाऊ।"
    - en: "Many found the readings long, dense and old-fashioned, and hard to link to the lectures; most liked the tutorials."
      zh: "很多人觉得阅读又长又难、偏老派，也很难和讲座联系起来；多数人喜欢 tutorial。"
      zh-TW: "很多人覺得閱讀又長又難、偏古老，也很難跟講座連起來；多數人喜歡 tutorial。"
      ja: "文献は長く難解で古風、講義と結びつけにくいという声が多い。チュートリアルは好評。"
      ko: "읽기 자료가 길고 어렵고 고전적이며 강의와 연결하기 어렵다는 의견이 많다. 튜토리얼은 대체로 좋았다고 한다."
      vi: "Nhiều người thấy bài đọc dài, nặng, cổ điển và khó nối với bài giảng; đa số thích tutorial."
      ms: "Ramai dapati bacaan panjang, padat dan kuno, serta sukar dikaitkan dengan kuliah; kebanyakan suka tutorial."
      id: "Banyak yang merasa bacaan panjang, padat dan kuno, serta sulit dikaitkan dengan kuliah; kebanyakan suka tutorialnya."
      hi: "कई को रीडिंग्स लंबी, घनी और पुराने ढंग की लगीं, और लेक्चर से जोड़ना कठिन; ज़्यादातर को ट्यूटोरियल पसंद आए।"
  work:
    - en: "Assessment is essay-based, including a research essay; doing well needs a firm grasp of the theoretical frameworks and readings, and several found high marks hard to get."
      zh: "考核以论文为主，包括一篇研究论文；要拿高分得吃透理论框架和阅读，好几位觉得很难拿高分。"
      zh-TW: "考核以論文為主，包括一篇研究論文；要拿高分得吃透理論框架和閱讀，好幾位覺得很難拿高分。"
      ja: "評価はエッセイ中心で研究エッセイも含む。理論的枠組みと文献の理解が必要で、高得点は難しいという声が複数。"
      ko: "평가는 연구 에세이를 포함한 에세이 위주다. 이론 틀과 읽기 자료를 잘 이해해야 하고, 고득점이 어렵다는 사람이 여럿이다."
      vi: "Đánh giá chủ yếu bằng bài luận, có cả bài luận nghiên cứu; muốn điểm cao phải nắm chắc các khung lý thuyết và bài đọc, vài người thấy rất khó đạt điểm cao."
      ms: "Penilaian berasaskan esei, termasuk esei penyelidikan; untuk berjaya perlu faham kerangka teori dan bacaan, beberapa orang dapati markah tinggi sukar dicapai."
      id: "Penilaian berbasis esai, termasuk esai riset; untuk nilai bagus harus paham kerangka teori dan bacaan, beberapa orang merasa nilai tinggi sulit dicapai."
      hi: "मूल्यांकन निबंध-आधारित है, जिसमें एक रिसर्च निबंध भी; अच्छा करने के लिए सैद्धांतिक ढाँचे और रीडिंग्स की पक्की समझ चाहिए, कई को ऊँचे अंक लाना कठिन लगा।"
  study:
    - en: "Keep up with readings from week one, since the final assessment draws on them; find good sources and plan the research essay early."
      zh: "从第一周就跟上阅读，期末考核要用到；研究论文要找好资料、早做规划。"
      zh-TW: "從第一週就跟上閱讀，期末考核要用到；研究論文要找好資料、早做規劃。"
      ja: "最終課題で使うので1週目から文献についていく。研究エッセイは良い資料を探し早めに計画を。"
      ko: "마지막 평가에 쓰이니 첫 주부터 읽기 자료를 따라가라. 연구 에세이는 좋은 자료를 찾고 일찍 계획하라."
      vi: "Theo kịp bài đọc từ tuần đầu vì bài đánh giá cuối dựa vào đó; tìm nguồn tốt và lên kế hoạch luận nghiên cứu sớm."
      ms: "Ikuti bacaan dari minggu pertama kerana penilaian akhir bergantung padanya; cari sumber baik dan rancang esei penyelidikan awal."
      id: "Ikuti bacaan sejak minggu pertama karena penilaian akhir memakainya; cari sumber bagus dan rencanakan esai riset lebih awal."
      hi: "पहले हफ़्ते से रीडिंग्स के साथ चलें, क्योंकि अंतिम असेसमेंट उन पर आधारित है; अच्छे स्रोत ढूँढें और रिसर्च निबंध की योजना जल्दी बनाएँ।"
  watch:
    - en: "Several advise against it unless you enjoy theory and philosophy; one wouldn't recommend it as a breadth."
      zh: "好几位说除非喜欢理论和哲学，否则别选；有人不推荐当 breadth 修。"
      zh-TW: "好幾位說除非喜歡理論和哲學，否則別選；有人不推薦當 breadth 修。"
      ja: "理論や哲学が好きでなければ勧めないという声が複数。ブレッドスとしては勧めないという人も。"
      ko: "이론과 철학을 좋아하지 않으면 추천하지 않는다는 사람이 여럿이다. 브레스 과목으로는 비추천이라는 사람도 있다."
      vi: "Vài người khuyên đừng học trừ khi thích lý thuyết và triết học; một người không khuyên chọn làm môn breadth."
      ms: "Beberapa orang tidak syorkan kecuali anda suka teori dan falsafah; seorang tidak syorkan ia sebagai breadth."
      id: "Beberapa orang tidak menyarankan kecuali suka teori dan filsafat; satu tidak menyarankannya sebagai breadth."
      hi: "कई कहते हैं थ्योरी और दर्शन पसंद न हो तो न लें; एक इसे breadth के रूप में लेने की सलाह नहीं देता।"
workload: heavy
difficulty: hard
