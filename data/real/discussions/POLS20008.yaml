code: POLS20008
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/pols20008
reviews: 5
from: 2018
to: 2025
checked: 2026-10-17
points:
  - en: "Theory-based lectures and topic-based tutorials feel like separate courses, several said. It mainly targets people aiming for the public service."
    zh: "好几人说以理论为主的讲座和按议题展开的辅导课感觉像两门不同的课。主要面向想进公共部门工作的人。"
    zh-TW: "好幾個人說以理論為主的講座和按議題展開的輔導課感覺像兩門不同的課。主要面向想進公部門工作的人。"
    ja: "理論中心の講義とトピック別のチュートリアルが別々の科目のようだという声が複数。主に公務員志望者向け。"
    ko: "이론 중심 강의와 주제별 튜토리얼이 별개의 과목 같다는 의견이 여럿. 주로 공무원을 목표로 하는 사람 대상."
    vi: "Nhiều người nói bài giảng thiên lý thuyết và tutorial theo chủ đề như hai môn khác nhau. Môn chủ yếu hướng tới người muốn làm trong khu vực công."
    ms: "Beberapa orang kata kuliah berasaskan teori dan tutorial berasaskan topik terasa seperti kursus berasingan. Ia terutama untuk mereka yang menyasarkan perkhidmatan awam."
    id: "Beberapa orang bilang kuliah berbasis teori dan tutorial berbasis topik terasa seperti mata kuliah terpisah. Terutama ditujukan bagi yang ingin bekerja di sektor publik."
    hi: "कई लोगों ने कहा कि सिद्धांत-आधारित लेक्चर और टॉपिक-आधारित ट्यूटोरियल अलग-अलग कोर्स जैसे लगते हैं। यह मुख्यतः सरकारी सेवा का लक्ष्य रखने वालों के लिए है।"
  - en: "Assessments are policy briefs rather than standard essays. Reviewers struggled with little guidance on how to write them, though one found the provided guide clear and got H1s."
    zh: "考核是政策简报而非常规论文。评论者因缺乏写作指导而吃力，不过有一人觉得提供的指南清晰，拿了H1。"
    zh-TW: "考核是政策簡報而非常規論文。評論者因缺乏寫作指導而吃力，不過有一人覺得提供的指南清楚，拿了H1。"
    ja: "評価は通常のエッセイではなく政策ブリーフ。書き方の指導が少なく苦労したという声が多いが、配布されたガイドが明確でH1を取った人もいる。"
    ko: "평가는 일반 에세이가 아닌 정책 브리프. 작성 지침이 부족해 고생했다는 의견이 많지만, 제공된 가이드가 명확해 H1을 받은 사람도 있음."
    vi: "Đánh giá là bản tóm tắt chính sách chứ không phải luận thông thường. Người đánh giá vất vả vì ít hướng dẫn cách viết, dù một người thấy tài liệu hướng dẫn rõ và đạt H1."
    ms: "Penilaian ialah taklimat dasar, bukan esei biasa. Pengulas bergelut kerana kurang panduan cara menulisnya, walaupun seorang dapati panduan yang diberi jelas dan dapat H1."
    id: "Penilaian berupa policy brief, bukan esai biasa. Pengulas kesulitan karena minim panduan menulisnya, meski satu orang merasa panduan yang diberikan jelas dan dapat H1."
    hi: "असेसमेंट सामान्य निबंध नहीं, बल्कि पॉलिसी ब्रीफ़ हैं। इन्हें लिखने के कम मार्गदर्शन से रिव्यूअर्स को कठिनाई हुई, हालाँकि एक को दी गई गाइड साफ़ लगी और H1 मिले।"
  - en: "A 2025 reviewer found the lectures rambling and wished actual policy examples were studied."
    zh: "一位2025年的评论者觉得讲座啰嗦，希望能学习真实的政策案例。"
    zh-TW: "一位2025年的評論者覺得講座囉嗦，希望能學習真實的政策案例。"
    ja: "2025年のレビューは講義が冗長で、実際の政策事例を学びたかったとした。"
    ko: "2025년 리뷰어는 강의가 장황하다며 실제 정책 사례를 공부하길 바랐음."
    vi: "Một người năm 2025 thấy bài giảng lan man và mong được học các ví dụ chính sách thực tế."
    ms: "Seorang pengulas 2025 dapati kuliah meleret dan mahu contoh dasar sebenar dikaji."
    id: "Seorang pengulas 2025 merasa kuliahnya bertele-tele dan berharap contoh kebijakan nyata dipelajari."
    hi: "2025 के एक रिव्यूअर को लेक्चर भटकते हुए लगे और वे चाहते थे कि असली पॉलिसी उदाहरण पढ़ाए जाएँ।"
sections:
  content:
    - en: "Lectures are theory-based while tutorials cover a different policy topic each week, so several found it felt like two separate courses. Reviewers say it suits those aiming for the public service."
      zh: "讲课偏理论，tutorial 每周讲不同的政策话题，好几位觉得像两门不同的课。同学说这门适合想当公务员的人。"
      zh-TW: "講課偏理論，tutorial 每週講不同的政策主題，好幾位覺得像兩門不同的課。同學說這門適合想當公務員的人。"
      ja: "講義は理論中心、チュートリアルは毎週異なる政策テーマで、別々の科目のようだという声が複数。公務員志望の人向けだという。"
      ko: "강의는 이론 위주이고 튜토리얼은 매주 다른 정책 주제를 다뤄 두 과목 같다는 평이 여럿. 공무원을 목표로 하는 사람에게 맞는다고 한다."
      vi: "Bài giảng thiên lý thuyết còn tutorial mỗi tuần một chủ đề chính sách khác, nên nhiều người thấy như hai môn riêng. Hợp với ai muốn làm công chức."
      ms: "Kuliah berasaskan teori manakala tutorial meliputi topik dasar berbeza setiap minggu, jadi beberapa rasa seperti dua kursus berasingan. Sesuai untuk yang mahu menjadi penjawat awam."
      id: "Kuliah berbasis teori sementara tutorial membahas topik kebijakan berbeda tiap minggu, jadi beberapa merasa seperti dua mata kuliah terpisah. Cocok untuk yang ingin jadi pegawai negeri."
      hi: "लेक्चर थ्योरी पर आधारित हैं जबकि ट्यूटोरियल हर हफ़्ते अलग नीति विषय पर, इसलिए कई को यह दो अलग कोर्स जैसा लगा। रिव्यूअर्स कहते हैं यह सरकारी सेवा का लक्ष्य रखने वालों के लिए है।"
  work:
    - en: "Two policy briefs or research papers instead of standard essays. Most reviewers found guidance thin and struggled to start, though one 2019 reviewer got a clear guide and two H1s."
      zh: "两份政策简报或研究报告，不是普通论文。多数同学觉得指导少、很难下手；不过一位 2019 年的同学拿到了清楚的指南，两份都是 H1。"
      zh-TW: "兩份政策簡報或研究報告，不是一般論文。多數同學覺得指導少、很難下手；不過一位 2019 年的同學拿到了清楚的指南，兩份都是 H1。"
      ja: "普通のエッセイではなく政策ブリーフか研究論文が2本。指導が乏しく書き始めに苦労したという声が多いが、2019年の一人は明確なガイドがありH1を2つ取った。"
      ko: "일반 에세이 대신 정책 브리프나 연구 보고서 2편. 대부분 안내가 부족해 시작하기 힘들었다고 하지만, 2019년 한 리뷰는 명확한 가이드를 받아 둘 다 H1을 받았다."
      vi: "Hai bản tóm tắt chính sách hoặc bài nghiên cứu thay vì bài luận thường. Đa số thấy ít hướng dẫn và khó bắt đầu, dù một người năm 2019 có hướng dẫn rõ và được hai H1."
      ms: "Dua ringkasan dasar atau kertas penyelidikan, bukan esei biasa. Kebanyakan rasa bimbingan kurang dan sukar bermula, walaupun seorang pengulas 2019 dapat panduan jelas dan dua H1."
      id: "Dua ringkasan kebijakan atau makalah riset, bukan esai biasa. Kebanyakan merasa bimbingan kurang dan sulit memulai, meski satu pengulas 2019 dapat panduan jelas dan dua H1."
      hi: "सामान्य निबंध की जगह दो पॉलिसी ब्रीफ़ या रिसर्च पेपर। ज़्यादातर को मार्गदर्शन कम लगा और शुरुआत मुश्किल रही, हालाँकि 2019 के एक को साफ़ गाइड मिला और दोनों में H1।"
  study:
    - en: "The newest reviewer suggests picking an assignment topic you already have some idea of a solution for, since the subject looks at few real policy examples."
      zh: "最新的同学建议选一个你已经有点解决思路的作业题目，因为课上很少看真实的政策案例。"
      zh-TW: "最新的同學建議選一個你已經有點解決思路的作業題目，因為課上很少看真實的政策案例。"
      ja: "授業で実際の政策例をほとんど扱わないので、ある程度解決策の見当がつくテーマを選ぶよう最新のレビューが勧める。"
      ko: "실제 정책 사례를 거의 다루지 않으니, 해결책이 어느 정도 떠오르는 과제 주제를 고르라고 최신 리뷰가 조언한다."
      vi: "Người mới nhất khuyên chọn đề bài mà bạn đã có sẵn ý tưởng giải pháp, vì môn học ít xem ví dụ chính sách thật."
      ms: "Pengulas terbaru cadang pilih topik tugasan yang anda sudah ada idea penyelesaian, kerana subjek ini jarang melihat contoh dasar sebenar."
      id: "Pengulas terbaru menyarankan pilih topik tugas yang sudah ada gambaran solusinya, karena mata kuliah ini jarang membahas contoh kebijakan nyata."
      hi: "सबसे नया रिव्यूअर सुझाव देता है ऐसा असाइनमेंट विषय चुनें जिसके हल का आपको कुछ अंदाज़ा हो, क्योंकि विषय में असली नीति उदाहरण कम देखे जाते हैं।"
  watch:
    - en: "Reviewers describe it as disorganised, with late slides and templates, and the 2025 reviewer found tutorials unproductive. One suggests skipping it as a breadth or elective."
      zh: "同学说课程组织混乱，课件和模板发得晚；2025 年的同学觉得 tutorial 没什么收获。有人建议别当 breadth 或选修课来上。"
      zh-TW: "同學說課程組織混亂，投影片和範本發得晚；2025 年的同學覺得 tutorial 沒什麼收穫。有人建議別當 breadth 或選修課來修。"
      ja: "スライドやテンプレートの公開が遅く運営が雑だという。2025年のレビューはチュートリアルが非生産的だったと言う。ブレドスや選択では取らない方がいいという人も。"
      ko: "슬라이드와 템플릿이 늦게 나오는 등 운영이 엉성하다는 평이며, 2025년 리뷰는 튜토리얼이 비생산적이었다고 한다. 브레드스나 선택 과목으로는 듣지 말라는 의견도."
      vi: "Người học nói môn lộn xộn, slide và mẫu ra muộn, và người năm 2025 thấy tutorial không hiệu quả. Một người khuyên đừng học làm môn breadth hay tự chọn."
      ms: "Pengulas kata ia tidak teratur, slaid dan templat lewat, dan pengulas 2025 rasa tutorial tidak produktif. Seorang cadang jangan ambil sebagai breadth atau elektif."
      id: "Pengulas bilang berantakan, slide dan templat terlambat, dan pengulas 2025 merasa tutorial tidak produktif. Satu menyarankan jangan ambil sebagai breadth atau pilihan."
      hi: "रिव्यूअर्स इसे अव्यवस्थित बताते हैं, स्लाइड और टेम्पलेट देर से, और 2025 के रिव्यूअर को ट्यूटोरियल बेकार लगे। एक सुझाव देता है इसे ब्रेड्थ या इलेक्टिव के रूप में न लें।"
