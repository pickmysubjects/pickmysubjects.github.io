reviews: 10
from: 2018
to: 2023
checked: 2026-10-17
points:
  - en: "Lectures are theoretical, especially early on, and many found them dry; tutorials are discussion-based. The content picks up in the later weeks."
    zh: "讲座偏理论，尤其是前期，很多人觉得枯燥；辅导课以讨论为主。后几周内容更有意思。"
    zh-TW: "講座偏理論，尤其是前期，很多人覺得枯燥；輔導課以討論為主。後幾週內容更有意思。"
    ja: "講義は特に序盤が理論的で退屈だと感じた人が多い。チュートリアルはディスカッション中心。後半の週で内容が面白くなる。"
    ko: "강의는 특히 초반에 이론적이라 지루하다는 사람이 많음. 튜토리얼은 토론 위주. 후반부로 갈수록 내용이 나아짐."
    vi: "Bài giảng thiên lý thuyết, nhất là giai đoạn đầu, nhiều người thấy khô khan; tutorial chủ yếu thảo luận. Nội dung hấp dẫn hơn ở các tuần sau."
    ms: "Kuliah teoretikal, terutama di awal, dan ramai dapati hambar; tutorial berasaskan perbincangan. Kandungan menjadi lebih menarik pada minggu-minggu kemudian."
    id: "Kuliah bersifat teoretis, terutama di awal, dan banyak yang merasa kering; tutorial berbasis diskusi. Materinya membaik di minggu-minggu akhir."
    hi: "लेक्चर सैद्धांतिक हैं, ख़ासकर शुरुआत में, और कई को नीरस लगे; ट्यूटोरियल चर्चा पर आधारित हैं। बाद के हफ़्तों में कंटेंट बेहतर होता है।"
  - en: "The essay assignments were the highlight for most, with lots of freedom to pick a social or media issue. Several found it easy to score well if you like analytical writing."
    zh: "多数人认为论文作业是亮点，可以自由选择社会或媒体议题。好几人说如果喜欢分析型写作，很容易拿高分。"
    zh-TW: "多數人認為論文作業是亮點，可以自由選擇社會或媒體議題。好幾個人說如果喜歡分析型寫作，很容易拿高分。"
    ja: "多くにとってエッセイ課題が一番の魅力で、社会やメディアの問題を自由に選べる。分析的な文章が好きなら高得点を取りやすいという声も複数。"
    ko: "대부분에게 에세이 과제가 가장 좋았고, 사회·미디어 이슈를 자유롭게 고를 수 있음. 분석적 글쓰기를 좋아하면 고득점이 쉽다는 의견도 여럿."
    vi: "Bài luận là điểm sáng với đa số, được tự do chọn vấn đề xã hội hoặc truyền thông. Nhiều người thấy dễ đạt điểm cao nếu thích viết phân tích."
    ms: "Tugasan esei ialah kemuncak bagi kebanyakan orang, dengan kebebasan memilih isu sosial atau media. Beberapa orang dapati mudah dapat markah baik jika suka penulisan analitikal."
    id: "Tugas esai jadi sorotan bagi kebanyakan orang, dengan kebebasan memilih isu sosial atau media. Beberapa orang merasa mudah dapat nilai bagus jika suka menulis analitis."
    hi: "ज़्यादातर के लिए निबंध असाइनमेंट सबसे अच्छा हिस्सा थे, सामाजिक या मीडिया मुद्दा चुनने की काफ़ी आज़ादी के साथ। कई को लगा कि विश्लेषणात्मक लेखन पसंद हो तो अच्छे अंक आसान हैं।"
  - en: "One reviewer warned that matching tutorial discussion is not enough for a H1: assignments expect a higher level than the class content."
    zh: "一位评论者提醒，只写出辅导课讨论的水平拿不到H1：作业的要求高于课堂内容。"
    zh-TW: "一位評論者提醒，只寫出輔導課討論的水準拿不到H1：作業的要求高於課堂內容。"
    ja: "チュートリアルでの議論程度ではH1は取れず、課題は授業内容より高い水準を求めるという注意も。"
    ko: "한 리뷰어는 튜토리얼 토론 수준으론 H1이 어렵고, 과제는 수업 내용보다 높은 수준을 요구한다고 경고함."
    vi: "Một người cảnh báo chỉ viết đúng như thảo luận trong tutorial thì không đủ H1: bài tập đòi hỏi cao hơn nội dung trên lớp."
    ms: "Seorang pengulas beri amaran bahawa setakat perbincangan tutorial tidak cukup untuk H1: tugasan menjangkakan tahap lebih tinggi daripada kandungan kelas."
    id: "Seorang pengulas mengingatkan bahwa sekadar menyamai diskusi tutorial tidak cukup untuk H1: tugas menuntut level lebih tinggi dari materi kelas."
    hi: "एक रिव्यूअर ने चेताया कि सिर्फ़ ट्यूटोरियल चर्चा के स्तर से H1 नहीं मिलता: असाइनमेंट क्लास कंटेंट से ऊँचे स्तर की उम्मीद करते हैं।"
sections:
  content:
    - en: "An introduction to media's role in society. The first half is very theoretical and dry, picking up later; lecture quality varied, while tutorials are mostly discussion."
      zh: "媒体与社会的入门课。前半段很理论、很干，后面才好起来；讲座质量参差，tutorial 主要是讨论。"
      zh-TW: "媒體與社會的入門課。前半段很理論、很乾，後面才好起來；講座品質參差，tutorial 主要是討論。"
      ja: "社会におけるメディアの役割の入門。前半は理論的で退屈、後半から面白くなる。講義の質にはばらつきがあり、チュートリアルは主に討論。"
      ko: "사회 속 미디어의 역할에 대한 입문이다. 전반부는 이론적이고 건조하다가 후반에 나아진다. 강의 질은 들쭉날쭉하고 튜토리얼은 주로 토론이다."
      vi: "Nhập môn về vai trò của truyền thông trong xã hội. Nửa đầu rất lý thuyết và khô, về sau khá hơn; chất lượng bài giảng không đều, tutorial chủ yếu là thảo luận."
      ms: "Pengenalan peranan media dalam masyarakat. Separuh pertama sangat teori dan hambar, bertambah baik kemudian; kualiti kuliah berbeza, tutorial kebanyakannya perbincangan."
      id: "Pengantar peran media dalam masyarakat. Paruh pertama sangat teoretis dan kering, membaik kemudian; kualitas kuliah bervariasi, tutorial kebanyakan diskusi."
      hi: "समाज में मीडिया की भूमिका का परिचय। पहला आधा बहुत सैद्धांतिक और नीरस, बाद में बेहतर; लेक्चर की गुणवत्ता बदलती रही, ट्यूटोरियल ज़्यादातर चर्चा।"
  work:
    - en: "Essay-based assignments with lots of freedom to choose topics, which most enjoyed; several found marking not too strict, though one says tutorial-level discussion isn't enough for an H1."
      zh: "以论文为主的作业，选题自由度很大，多数人喜欢；好几位觉得给分不算严，但有人说只停留在 tutorial 讨论的水平拿不到 H1。"
      zh-TW: "以論文為主的作業，選題自由度很大，多數人喜歡；好幾位覺得給分不算嚴，但有人說只停留在 tutorial 討論的程度拿不到 H1。"
      ja: "エッセイ型の課題でテーマ選択の自由度が高く、好評。採点はそれほど厳しくないという声が複数だが、チュートリアルの議論レベルではH1に届かないという人も。"
      ko: "에세이형 과제로 주제 선택의 자유가 커서 대부분 좋아했다. 채점이 그리 엄격하지 않다는 사람이 여럿이지만, 튜토리얼 토론 수준으론 H1이 어렵다는 사람도 있다."
      vi: "Bài tập dạng luận với nhiều tự do chọn đề, đa số thích; vài người thấy chấm không quá chặt, dù một người nói chỉ ở mức thảo luận tutorial thì không đạt H1."
      ms: "Tugasan berasaskan esei dengan banyak kebebasan memilih topik, yang kebanyakan suka; beberapa rasa pemarkahan tidak terlalu ketat, walaupun seorang kata tahap perbincangan tutorial tidak cukup untuk H1."
      id: "Tugas berbasis esai dengan kebebasan memilih topik, yang kebanyakan suka; beberapa merasa penilaiannya tidak terlalu ketat, meski satu bilang level diskusi tutorial tidak cukup untuk H1."
      hi: "निबंध-आधारित असाइनमेंट जिनमें विषय चुनने की बहुत आज़ादी है, ज़्यादातर को पसंद; कई को अंकन ज़्यादा सख़्त नहीं लगा, हालाँकि एक के अनुसार ट्यूटोरियल स्तर की चर्चा H1 के लिए काफ़ी नहीं।"
  study:
    - en: "Readings are long; several only did the ones they referenced in essays. It suits people who follow current social issues and like critical analysis."
      zh: "阅读很长；好几位只读了论文里要引用的那些。适合关注时事、喜欢批判分析的人。"
      zh-TW: "閱讀很長；好幾位只讀了論文裡要引用的那些。適合關注時事、喜歡批判分析的人。"
      ja: "文献は長く、エッセイで引用するものだけ読んだ人が複数。社会問題に関心があり批判的分析が好きな人向き。"
      ko: "읽기 자료가 길어 에세이에 인용할 것만 읽은 사람이 여럿이다. 시사에 관심 있고 비판적 분석을 좋아하는 사람에게 맞다."
      vi: "Bài đọc dài; vài người chỉ đọc những bài trích dẫn trong luận. Hợp với người theo dõi vấn đề xã hội và thích phân tích phản biện."
      ms: "Bacaan panjang; beberapa hanya baca yang dirujuk dalam esei. Sesuai bagi yang mengikuti isu sosial semasa dan suka analisis kritis."
      id: "Bacaannya panjang; beberapa hanya membaca yang dikutip di esai. Cocok bagi yang mengikuti isu sosial terkini dan suka analisis kritis."
      hi: "रीडिंग्स लंबी हैं; कई ने सिर्फ़ वही पढ़ीं जिनका निबंध में हवाला दिया। यह समसामयिक सामाजिक मुद्दों पर नज़र रखने और आलोचनात्मक विश्लेषण पसंद करने वालों के लिए है।"
difficulty: easy
