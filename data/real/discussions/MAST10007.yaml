points:
  - en: "Seen as more conceptual than Calculus 1 and 2, with a light introduction to proofs; several found it easier than Calculus 2."
    zh: "被认为比微积分 1、2 更偏概念，会接触一点证明；好几位觉得比 Calculus 2 容易。"
    zh-TW: "被認為比微積分 1、2 更偏概念，會接觸一點證明；好幾位覺得比 Calculus 2 容易。"
    ja: "Calculus 1・2より概念寄りで、証明の入門も少しある。Calculus 2より易しいと感じた人も複数いる。"
    ko: "Calculus 1, 2보다 개념 중심이고 증명을 가볍게 다룬다. Calculus 2보다 쉬웠다는 사람도 여럿이다."
    vi: "Được xem là thiên về khái niệm hơn Calculus 1 và 2, có giới thiệu nhẹ về chứng minh; nhiều người thấy dễ hơn Calculus 2."
    ms: "Dianggap lebih konseptual daripada Calculus 1 dan 2, dengan pengenalan ringan kepada bukti; ramai rasa lebih mudah daripada Calculus 2."
    id: "Dinilai lebih konseptual dari Calculus 1 dan 2, dengan pengenalan ringan ke pembuktian; beberapa orang merasa lebih mudah dari Calculus 2."
    hi: "Calculus 1 और 2 से ज़्यादा कॉन्सेप्चुअल, प्रूफ़ का हल्का परिचय; कई लोगों को Calculus 2 से आसान लगा।"
  - en: "Includes MATLAB labs and a MATLAB test, which some found harder for time than the written tests."
    zh: "有 MATLAB 实验课和 MATLAB 测验，有人觉得测验时间比笔试紧。"
    zh-TW: "有 MATLAB 實驗課和 MATLAB 測驗，有人覺得測驗時間比筆試緊。"
    ja: "MATLABの演習とMATLABテストがあり、筆記テストより時間的に厳しいと感じた人もいる。"
    ko: "MATLAB 실습과 MATLAB 시험이 있는데, 필기시험보다 시간이 빠듯했다는 사람도 있다."
    vi: "Có lab MATLAB và bài kiểm tra MATLAB, một số thấy thời gian gấp hơn bài thi viết."
    ms: "Ada makmal MATLAB dan ujian MATLAB, yang sesetengah rasa lebih suntuk masanya berbanding ujian bertulis."
    id: "Ada lab MATLAB dan tes MATLAB, yang menurut sebagian lebih mepet waktunya dibanding tes tertulis."
    hi: "MATLAB लैब और एक MATLAB टेस्ट है, जिसमें कुछ को लिखित टेस्ट से ज़्यादा समय की कमी लगी।"
  - en: "Tutorial sheets and past exams are the usual advice; opinions on teaching quality vary by semester."
    zh: "普遍建议多做辅导课习题和往年试卷；对教学质量的评价因学期而异。"
    zh-TW: "普遍建議多做習題和考古題；對教學品質的評價因學期而異。"
    ja: "よくあるアドバイスはチュートリアル問題と過去問。教え方の評価は学期によって異なる。"
    ko: "튜토리얼 문제와 기출이 흔한 조언이다. 강의 질에 대한 평가는 학기마다 다르다."
    vi: "Lời khuyên thường gặp là làm bài tutorial và đề cũ; đánh giá chất lượng giảng dạy khác nhau theo học kỳ."
    ms: "Nasihat biasa ialah soalan tutorial dan soalan lepas; pendapat tentang mutu pengajaran berbeza ikut semester."
    id: "Saran umumnya soal tutorial dan soal ujian lama; penilaian kualitas pengajaran beda tiap semester."
    hi: "आम सलाह: ट्यूटोरियल शीट और पुराने पेपर; पढ़ाई की क्वालिटी पर राय सेमेस्टर के हिसाब से बदलती है।"
difficulty: easy
