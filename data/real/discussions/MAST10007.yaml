points:
  - en: "Seen as more conceptual than Calculus 1 and 2, with a light introduction to proofs; several found it easier than Calculus 2."
    zh: "被认为比微积分 1、2 更偏概念，会接触一点证明；好几位觉得比 Calculus 2 容易。"
    zh-TW: "被認為比微積分 1、2 更偏概念，會接觸一點證明；好幾位覺得比 Calculus 2 容易。"
    ja: "Calculus 1・2より概念寄りで、証明の入門も少しある。Calculus 2より易しいと感じた人も複数いる。"
    ko: "Calculus 1, 2보다 개념 중심이고 증명을 가볍게 다룬다. Calculus 2보다 쉬웠다는 사람도 여럿이다."
    vi: "Được xem là thiên về khái niệm hơn Calculus 1 và 2, có giới thiệu nhẹ về chứng minh; nhiều người thấy dễ hơn Calculus 2."
    ms: "Dianggap lebih konseptual daripada Calculus 1 dan 2, dengan pengenalan ringan kepada bukti; ramai rasa lebih mudah daripada Calculus 2."
    id: "Dinilai lebih konseptual dari Calculus 1 dan 2, dengan pengenalan ringan ke pembuktian; beberapa orang merasa lebih mudah dari Calculus 2."
    hi: "Calculus 1 और 2 से ज़्यादा कॉन्सेप्चुअल, प्रूफ़ का हल्का परिचय; कई लोगों को Calculus 2 से आसान लगा।"
  - en: "Includes MATLAB labs and a MATLAB test, which some found harder for time than the written tests."
    zh: "有 MATLAB 实验课和 MATLAB 测验，有人觉得测验时间比笔试紧。"
    zh-TW: "有 MATLAB 實驗課和 MATLAB 測驗，有人覺得測驗時間比筆試緊。"
    ja: "MATLABの演習とMATLABテストがあり、筆記テストより時間的に厳しいと感じた人もいる。"
    ko: "MATLAB 실습과 MATLAB 시험이 있는데, 필기시험보다 시간이 빠듯했다는 사람도 있다."
    vi: "Có lab MATLAB và bài kiểm tra MATLAB, một số thấy thời gian gấp hơn bài thi viết."
    ms: "Ada makmal MATLAB dan ujian MATLAB, yang sesetengah rasa lebih suntuk masanya berbanding ujian bertulis."
    id: "Ada lab MATLAB dan tes MATLAB, yang menurut sebagian lebih mepet waktunya dibanding tes tertulis."
    hi: "MATLAB लैब और एक MATLAB टेस्ट है, जिसमें कुछ को लिखित टेस्ट से ज़्यादा समय की कमी लगी।"
  - en: "Tutorial sheets and past exams are the usual advice; opinions on teaching quality vary by semester."
    zh: "普遍建议多做辅导课习题和往年试卷；对教学质量的评价因学期而异。"
    zh-TW: "普遍建議多做習題和考古題；對教學品質的評價因學期而異。"
    ja: "よくあるアドバイスはチュートリアル問題と過去問。教え方の評価は学期によって異なる。"
    ko: "튜토리얼 문제와 기출이 흔한 조언이다. 강의 질에 대한 평가는 학기마다 다르다."
    vi: "Lời khuyên thường gặp là làm bài tutorial và đề cũ; đánh giá chất lượng giảng dạy khác nhau theo học kỳ."
    ms: "Nasihat biasa ialah soalan tutorial dan soalan lepas; pendapat tentang mutu pengajaran berbeza ikut semester."
    id: "Saran umumnya soal tutorial dan soal ujian lama; penilaian kualitas pengajaran beda tiap semester."
    hi: "आम सलाह: ट्यूटोरियल शीट और पुराने पेपर; पढ़ाई की क्वालिटी पर राय सेमेस्टर के हिसाब से बदलती है।"
sections:
  content:
    - en: "Vectors, matrices, systems of equations, eigenvalues and vector spaces, with a first taste of proofs. Several found it more interesting and conceptual than Calculus 1 and 2."
      zh: "向量、矩阵、方程组、特征值和向量空间，还会初步接触证明。好几位同学觉得比 Calculus 1 和 2 更有意思、更偏概念。"
      zh-TW: "向量、矩陣、方程組、特徵值和向量空間，還會初步接觸證明。好幾位同學覺得比 Calculus 1 和 2 更有趣、更偏概念。"
      ja: "ベクトル、行列、連立方程式、固有値、ベクトル空間に、証明の入門も。Calculus 1・2より面白く概念的だという声が複数。"
      ko: "벡터, 행렬, 연립방정식, 고윳값, 벡터 공간과 증명 맛보기. Calculus 1·2보다 흥미롭고 개념적이라는 평이 여럿."
      vi: "Vectơ, ma trận, hệ phương trình, trị riêng và không gian vectơ, kèm làm quen với chứng minh. Vài người thấy thú vị và thiên khái niệm hơn Calculus 1 và 2."
      ms: "Vektor, matriks, sistem persamaan, nilai eigen dan ruang vektor, dengan pengenalan kepada pembuktian. Beberapa rasa ia lebih menarik dan berkonsep daripada Calculus 1 dan 2."
      id: "Vektor, matriks, sistem persamaan, nilai eigen dan ruang vektor, dengan pengenalan pembuktian. Beberapa merasa lebih menarik dan konseptual daripada Calculus 1 dan 2."
      hi: "वेक्टर, मैट्रिक्स, समीकरण प्रणाली, आइगेनवैल्यू और वेक्टर स्पेस, साथ में प्रूफ़ की शुरुआत। कई को यह Calculus 1 और 2 से ज़्यादा रोचक और कॉन्सेप्चुअल लगा।"
  work:
    - en: "Assignments, an MST, a MATLAB test and a final exam, with MATLAB labs. The MATLAB test is tight on time; reviewers differ on whether the exam was fair or hard."
      zh: "有作业、MST、MATLAB 测验和期末，另有 MATLAB 上机课。MATLAB 测验时间紧；期末公平还是难，同学看法不一。"
      zh-TW: "有作業、MST、MATLAB 測驗和期末，另有 MATLAB 上機課。MATLAB 測驗時間緊；期末公平還是難，同學看法不一。"
      ja: "課題、MST、MATLABテスト、期末試験があり、MATLAB実習もある。MATLABテストは時間が厳しい。期末が公平か難しいかは意見が分かれる。"
      ko: "과제, MST, MATLAB 시험, 기말시험이 있고 MATLAB 실습도 있다. MATLAB 시험은 시간이 빠듯하다. 기말이 공정했는지 어려웠는지는 의견이 갈린다."
      vi: "Có bài tập, MST, bài kiểm tra MATLAB và thi cuối kỳ, kèm buổi lab MATLAB. Bài MATLAB thiếu thời gian; ý kiến khác nhau về việc bài cuối kỳ công bằng hay khó."
      ms: "Tugasan, MST, ujian MATLAB dan peperiksaan akhir, serta makmal MATLAB. Ujian MATLAB suntuk masa; pengulas berbeza pendapat sama ada peperiksaan adil atau sukar."
      id: "Tugas, MST, tes MATLAB dan ujian akhir, plus lab MATLAB. Tes MATLAB waktunya mepet; pengulas berbeda pendapat apakah ujian akhir adil atau sulit."
      hi: "असाइनमेंट, MST, MATLAB टेस्ट और फ़ाइनल परीक्षा, साथ में MATLAB लैब। MATLAB टेस्ट में समय कम पड़ता है; परीक्षा उचित थी या कठिन, इस पर राय बँटी है।"
  study:
    - en: "Keep up, do the tutorial sheets and recent past exams, and pick the trickier problems from the booklet rather than every routine one; go to both tutorials and labs."
      zh: "跟上进度，做 tutorial 练习和近几年的真题；习题册挑难题做，不用每道常规题都做；tutorial 和 lab 都要去。"
      zh-TW: "跟上進度，做 tutorial 練習和近幾年的考古題；習題本挑難題做，不必每道常規題都做；tutorial 和 lab 都要去。"
      ja: "遅れず、チュートリアルシートと最近の過去問をやる。問題集は定型問題を全部ではなく難しめのものを選ぶ。チュートリアルとラボの両方に出る。"
      ko: "진도를 따라가고 튜토리얼 시트와 최근 기출을 풀어라. 문제집은 단순 계산 문제 전부보다 까다로운 문제를 골라 풀고, 튜토리얼과 랩 둘 다 가라."
      vi: "Theo kịp, làm bài tutorial và đề thi gần đây, chọn bài khó trong tập bài tập thay vì làm hết bài tính toán thường; đi cả tutorial lẫn lab."
      ms: "Ikut rentak, buat lembaran tutorial dan kertas lepas terkini, dan pilih soalan lebih sukar dari buku masalah, bukan semua soalan rutin; hadir tutorial dan makmal."
      id: "Ikuti tempo, kerjakan lembar tutorial dan soal ujian terbaru, dan pilih soal sulit dari buku soal alih-alih semua soal rutin; hadiri tutorial dan lab."
      hi: "साथ चलें, ट्यूटोरियल शीट और हाल के पुराने पेपर करें, और बुकलेट से हर रूटीन सवाल के बजाय कठिन सवाल चुनें; ट्यूटोरियल और लैब दोनों में जाएँ।"
  watch:
    - en: "Opinions on teaching vary by semester; one 2025 reviewer found lectures and tutorials poor at explaining. Summer term covers a lot quickly, though one found its exam easier."
      zh: "教学评价因学期而异；2025 年有同学觉得讲课和 tutorial 都讲不清楚。暑期课节奏很快，但有同学觉得暑期考试更容易。"
      zh-TW: "教學評價因學期而異；2025 年有同學覺得上課和 tutorial 都講不清楚。暑期班節奏很快，但有同學覺得暑期考試比較容易。"
      ja: "教え方の評価は学期によって違う。2025年には講義もチュートリアルも説明が下手だったという声。サマーは進みが速いが、試験は易しかったという声も。"
      ko: "수업 평가는 학기마다 다르다. 2025년 한 리뷰어는 강의와 튜토리얼 설명이 부족했다고 했다. 여름 학기는 빠르게 많이 나가지만 시험은 더 쉬웠다는 의견도 있다."
      vi: "Đánh giá về cách dạy thay đổi theo kỳ; một người năm 2025 thấy bài giảng và tutorial giải thích kém. Học kỳ hè dạy nhiều trong thời gian ngắn, dù có người thấy đề thi dễ hơn."
      ms: "Pendapat tentang pengajaran berbeza ikut semester; seorang pengulas 2025 rasa kuliah dan tutorial lemah menerangkan. Penggal musim panas laju, walaupun seorang rasa peperiksaannya lebih mudah."
      id: "Pendapat soal pengajaran beda tiap semester; satu pengulas 2025 merasa kuliah dan tutorial kurang jelas menjelaskan. Semester musim panas padat dan cepat, meski satu pengulas merasa ujiannya lebih mudah."
      hi: "पढ़ाई पर राय सेमेस्टर के हिसाब से बदलती है; 2025 के एक रिव्यूअर को लेक्चर और ट्यूटोरियल में समझाना कमज़ोर लगा। समर टर्म में बहुत कुछ जल्दी पढ़ाया जाता है, हालाँकि एक को उसकी परीक्षा आसान लगी।"
difficulty: easy
