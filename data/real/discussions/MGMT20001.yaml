code: MGMT20001
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/mgmt20001
reviews: 10
from: 2018
to: 2026
checked: 2026-10-13
points:
  - en: "Most reviewers, including the newest, say it is hard to score highly: marking felt rigid or harsh for such a subjective subject, and effort did not always match marks."
    zh: "多数评价（包括最新的）认为很难拿高分：对这样主观的科目来说评分死板或偏严，付出与分数不一定成正比。"
    zh-TW: "多數評價（包括最新的）認為很難拿高分：以這麼主觀的科目來說評分死板或偏嚴，付出與分數不一定成正比。"
    ja: "最新を含む多くのレビューが高得点は難しいとしている。主観的な科目なのに採点が硬直的・厳しく、努力が点に結びつかないことも。"
    ko: "최신 리뷰를 포함해 대부분이 고득점이 어렵다고 한다. 주관적인 과목인데 채점이 경직되거나 엄하고, 노력만큼 점수가 나오지 않기도 했다."
    vi: "Phần lớn đánh giá, kể cả mới nhất, nói khó đạt điểm cao: chấm cứng nhắc hoặc khắt khe với một môn chủ quan, và công sức không luôn tương xứng với điểm."
    ms: "Kebanyakan pengulas, termasuk yang terbaru, kata sukar dapat markah tinggi: pemarkahan terasa kaku atau keras untuk subjek yang subjektif, dan usaha tidak selalu sepadan markah."
    id: "Sebagian besar pengulas, termasuk yang terbaru, bilang sulit dapat nilai tinggi: penilaian terasa kaku atau keras untuk mata kuliah yang subjektif, dan usaha tak selalu sebanding nilai."
    hi: "ज़्यादातर रिव्यूअर्स, सबसे नए समेत, कहते हैं कि ऊँचे अंक लाना मुश्किल है: इतने सब्जेक्टिव विषय के लिए मार्किंग कठोर या सख़्त लगी, और मेहनत के हिसाब से अंक हमेशा नहीं मिले।"
  - en: "The large group assignment is the main pain point; several ended up carrying the work themselves, so choose teammates with care."
    zh: "占比大的小组作业是最大痛点；好几位最后自己扛下了大部分工作，所以要慎选组员。"
    zh-TW: "占比大的小組作業是最大痛點；好幾位最後自己扛下大部分工作，所以要慎選組員。"
    ja: "大きなグループ課題が一番の悩みどころ。結局ほぼ一人でこなした人も複数いるので、メンバーは慎重に選ぼう。"
    ko: "비중 큰 조별 과제가 가장 큰 고충이다. 결국 혼자 대부분을 떠맡은 사람이 여럿이니 조원을 신중히 고르자."
    vi: "Bài nhóm lớn là điểm khổ nhất; vài người phải tự gánh phần lớn công việc, nên hãy chọn đồng đội cẩn thận."
    ms: "Tugasan kumpulan besar ialah masalah utama; beberapa orang akhirnya buat sendiri, jadi pilih rakan sepasukan dengan teliti."
    id: "Tugas kelompok besar adalah titik paling menyulitkan; beberapa orang akhirnya mengerjakan sendiri, jadi pilih rekan dengan cermat."
    hi: "बड़ा ग्रुप असाइनमेंट सबसे बड़ी परेशानी है; कई लोगों को ज़्यादातर काम खुद करना पड़ा, इसलिए साथी सोच-समझकर चुनें."
  - en: "Contact hours are light. Some liked the case studies and found the concepts easy to apply; others found lectures and tutorials vague."
    zh: "上课时间少。有人喜欢案例分析、觉得概念容易应用；也有人觉得讲座和辅导课内容含糊。"
    zh-TW: "上課時數少。有人喜歡案例分析、覺得概念容易應用；也有人覺得講座和輔導課內容含糊。"
    ja: "授業時間は少なめ。ケーススタディが好きで概念も応用しやすいという人もいれば、講義やチュートリアルが曖昧だという人も。"
    ko: "수업 시간은 적다. 사례 연구가 좋고 개념 적용이 쉽다는 사람도 있지만, 강의와 튜토리얼이 모호하다는 사람도 있다."
    vi: "Số giờ lên lớp ít. Có người thích case study và thấy dễ áp dụng khái niệm; người khác thấy bài giảng và tutorial mơ hồ."
    ms: "Waktu kelas sedikit. Ada yang suka kajian kes dan dapati konsep mudah diaplikasi; yang lain dapati kuliah dan tutorial kabur."
    id: "Jam tatap muka sedikit. Ada yang suka studi kasus dan merasa konsepnya mudah diterapkan; yang lain merasa kuliah dan tutorial kurang jelas."
    hi: "क्लास के घंटे कम हैं। कुछ को केस स्टडी पसंद आईं और कॉन्सेप्ट लागू करना आसान लगा; कुछ को लेक्चर और ट्यूटोरियल अस्पष्ट लगे।"
  - en: "Tips: attend classes, don't miss the graded weekly quiz, and expect essays to need extra research."
    zh: "建议：按时上课，别漏掉计分的每周小测，论文需要额外查资料。"
    zh-TW: "建議：按時上課，別漏掉計分的每週小測，論文需要額外查資料。"
    ja: "コツ：授業に出る、採点される毎週のクイズを忘れない、エッセイには追加の調査が必要。"
    ko: "팁: 수업에 출석하고, 점수에 들어가는 주간 퀴즈를 놓치지 말고, 에세이는 추가 조사가 필요하다."
    vi: "Mẹo: đi học đầy đủ, đừng bỏ bài quiz hằng tuần có tính điểm, và bài luận cần tìm thêm tài liệu."
    ms: "Tip: hadiri kelas, jangan terlepas kuiz mingguan yang bermarkah, dan esei perlukan kajian tambahan."
    id: "Tips: hadiri kelas, jangan lewatkan kuis mingguan yang dinilai, dan esai butuh riset tambahan."
    hi: "सुझाव: क्लास में जाएँ, नंबर वाला साप्ताहिक क्विज़ न छोड़ें, और निबंधों के लिए अतिरिक्त रिसर्च की उम्मीद रखें।"
sections:
  content:
    - en: "Organisational behaviour concepts like perception, power, change and culture, applied to case studies. Concepts are easy to apply, but many found lectures vague or boring."
      zh: "组织行为学概念，比如认知、权力、变革和文化，用案例来分析。概念好应用，但很多人觉得讲座空泛或无聊。"
      zh-TW: "組織行為學概念，例如知覺、權力、變革和文化，用案例來分析。概念好應用，但很多人覺得講座空泛或無聊。"
      ja: "知覚、権力、変革、文化などの組織行動論の概念をケーススタディに当てはめる。概念は応用しやすいが、講義は曖昧・退屈という声が多い。"
      ko: "지각, 권력, 변화, 문화 같은 조직행동 개념을 사례 연구에 적용한다. 개념은 적용하기 쉽지만 강의가 모호하거나 지루하다는 의견이 많다."
      vi: "Các khái niệm hành vi tổ chức như nhận thức, quyền lực, thay đổi và văn hóa, áp dụng vào tình huống. Khái niệm dễ áp dụng, nhưng nhiều người thấy bài giảng mơ hồ hoặc chán."
      ms: "Konsep tingkah laku organisasi seperti persepsi, kuasa, perubahan dan budaya, diaplikasi pada kajian kes. Konsep mudah diaplikasi, tetapi ramai rasa kuliah kabur atau membosankan."
      id: "Konsep perilaku organisasi seperti persepsi, kekuasaan, perubahan dan budaya, diterapkan pada studi kasus. Konsepnya mudah diterapkan, tapi banyak yang merasa kuliahnya kabur atau membosankan."
      hi: "धारणा, शक्ति, परिवर्तन और संस्कृति जैसी संगठनात्मक व्यवहार की अवधारणाएँ, केस स्टडी पर लागू। अवधारणाएँ लागू करना आसान, पर कई को लेक्चर अस्पष्ट या उबाऊ लगे।"
  work:
    - en: "Graded weekly quizzes, an individual assignment, a heavy group assignment (one reviewer says 5000 words, about 30%) and a case-study exam. Many found essays harshly or subjectively marked."
      zh: "每周计分小测、一个个人作业、一个很重的小组作业（有同学说 5000 字，约占 30%），还有案例分析期末。很多人觉得论文给分严或很主观。"
      zh-TW: "每週計分小考、一個個人作業、一個很重的小組作業（有同學說 5000 字，約占 30%），還有案例分析期末。很多人覺得論文給分嚴或很主觀。"
      ja: "採点される毎週のクイズ、個人課題、重いグループ課題（5000語で約30%という人も）、ケーススタディの期末。エッセイの採点が厳しい・主観的という声が多い。"
      ko: "채점되는 주간 퀴즈, 개인 과제, 부담 큰 조별 과제(5000단어, 약 30%라는 말도), 사례 분석 기말이 있다. 에세이 채점이 박하거나 주관적이라는 의견이 많다."
      vi: "Quiz hằng tuần có tính điểm, một bài cá nhân, một bài nhóm nặng (một người nói 5000 từ, khoảng 30%) và thi cuối về tình huống. Nhiều người thấy bài luận chấm khắt khe hoặc cảm tính."
      ms: "Kuiz mingguan bergred, satu tugasan individu, tugasan kumpulan yang berat (seorang kata 5000 patah perkataan, kira-kira 30%) dan peperiksaan kajian kes. Ramai rasa esei dinilai ketat atau subjektif."
      id: "Kuis mingguan yang dinilai, satu tugas individu, tugas kelompok yang berat (satu bilang 5000 kata, sekitar 30%) dan ujian studi kasus. Banyak yang merasa esai dinilai ketat atau subjektif."
      hi: "अंक वाले साप्ताहिक क्विज़, एक व्यक्तिगत असाइनमेंट, भारी ग्रुप असाइनमेंट (एक के अनुसार 5000 शब्द, लगभग 30%) और केस-स्टडी परीक्षा। कई को निबंधों का अंकन सख़्त या व्यक्तिपरक लगा।"
  study:
    - en: "Don't miss the weekly quizzes, go the extra mile on research for essays, and start the group assignment early; prepare the case studies for the exam."
      zh: "每周小测别漏做，论文多花力气查资料，小组作业早点开始；期末要准备好各个案例。"
      zh-TW: "每週小考別漏做，論文多花力氣查資料，小組作業早點開始；期末要準備好各個案例。"
      ja: "毎週のクイズは逃さず、エッセイは調査に力を入れ、グループ課題は早めに始める。期末に向けてケーススタディを準備。"
      ko: "주간 퀴즈를 놓치지 말고, 에세이는 조사에 더 공을 들이며, 조별 과제는 일찍 시작하라. 기말용 사례를 준비하라."
      vi: "Đừng bỏ quiz hằng tuần, đầu tư nghiên cứu thêm cho bài luận, bắt đầu bài nhóm sớm; chuẩn bị các tình huống cho kỳ thi."
      ms: "Jangan terlepas kuiz mingguan, buat penyelidikan lebih untuk esei, dan mula tugasan kumpulan awal; sediakan kajian kes untuk peperiksaan."
      id: "Jangan lewatkan kuis mingguan, riset lebih untuk esai, dan mulai tugas kelompok lebih awal; siapkan studi kasus untuk ujian."
      hi: "साप्ताहिक क्विज़ न छोड़ें, निबंधों के लिए अतिरिक्त रिसर्च करें, और ग्रुप असाइनमेंट जल्दी शुरू करें; परीक्षा के लिए केस स्टडी तैयार करें।"
  watch:
    - en: "Many found high marks hard to get despite effort, and the group work frustrating; several say don't take it unless you have to."
      zh: "很多人说再努力也很难拿高分，小组作业也很折磨；好几位说除非必修否则别选。"
      zh-TW: "很多人說再努力也很難拿高分，小組作業也很折磨；好幾位說除非必修否則別選。"
      ja: "努力しても高得点は取りにくく、グループ作業がつらかったという声が多い。必修でなければ取らないようにという人も複数。"
      ko: "노력해도 고득점이 어렵고 조별 과제가 괴로웠다는 의견이 많다. 필수가 아니면 듣지 말라는 사람이 여럿이다."
      vi: "Nhiều người thấy dù cố gắng vẫn khó điểm cao, và bài nhóm rất mệt; vài người nói đừng học trừ khi bắt buộc."
      ms: "Ramai dapati markah tinggi sukar dicapai walaupun berusaha, dan kerja kumpulan mengecewakan; beberapa kata jangan ambil kecuali wajib."
      id: "Banyak yang merasa nilai tinggi sulit diraih meski sudah berusaha, dan kerja kelompok bikin frustrasi; beberapa bilang jangan ambil kecuali wajib."
      hi: "कई को मेहनत के बावजूद ऊँचे अंक लाना कठिन लगा, और ग्रुप वर्क निराशाजनक; कई कहते हैं ज़रूरी न हो तो न लें।"
difficulty: hard
