code: ECON20001
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/econ20001
reviews: 10
from: 2017
to: 2023
checked: 2026-10-08
points:
  - en: "Very mathematical: strong algebra and economic intuition are needed, and assignments can be tricky and harshly marked."
    zh: "数学性很强，需要扎实的代数和经济直觉；作业可能很刁钻，评分也偏严。"
    zh-TW: "數學性很強，需要紮實的代數和經濟直覺；作業可能很刁鑽，評分也偏嚴。"
    ja: "かなり数学的で、しっかりした代数と経済的な直感が必要。課題はひねりがあり、採点も厳しめ。"
    ko: "수학 비중이 매우 커서 탄탄한 대수와 경제적 직관이 필요하고, 과제는 까다롭고 채점도 엄격할 수 있음."
    vi: "Rất nặng toán: cần đại số vững và trực giác kinh tế tốt; bài tập có thể khó nhằn và chấm khắt khe."
    ms: "Sangat bermatematik: perlu algebra kukuh dan intuisi ekonomi; tugasan boleh jadi rumit dan dimarkah dengan ketat."
    id: "Sangat matematis: butuh aljabar yang kuat dan intuisi ekonomi; tugas bisa menjebak dan dinilai ketat."
    hi: "काफ़ी मैथ्स वाला: मज़बूत अलजेब्रा और इकोनॉमिक समझ चाहिए; असाइनमेंट पेचीदा हो सकते हैं और मार्किंग सख़्त होती है।"
  - en: "Tutorials are often described as rushed."
    zh: "多位学生反映辅导课节奏过于仓促。"
    zh-TW: "多位學生反映小組討論課節奏太趕。"
    ja: "チュートリアルは駆け足だとよく言われる。"
    ko: "튜토리얼이 너무 급하게 진행된다는 평이 많음."
    vi: "Nhiều người nói buổi tutorial thường bị vội."
    ms: "Tutorial sering dikatakan terlalu tergesa-gesa."
    id: "Tutorial sering disebut terlalu terburu-buru."
    hi: "ट्यूटोरियल अक्सर जल्दबाज़ी में चलते बताए जाते हैं।"
  - en: "Views on teaching are split: earlier years were praised, while recent reviews (2022-23) complain of poor explanations and little support."
    zh: "对教学评价两极：早年口碑较好，但2022-23年的评论抱怨讲解不足、支持很少。"
    zh-TW: "對教學評價兩極：早年口碑較好，但2022-23年的評論抱怨講解不足、支援很少。"
    ja: "教え方の評価は分かれる。以前は好評だったが、最近（2022-23）の口コミでは説明が不十分でサポートも少ないという不満が多い。"
    ko: "강의 평가는 갈림: 예전에는 호평이었지만 최근(2022-23) 후기에서는 설명이 부족하고 지원이 적다는 불만이 나옴."
    vi: "Ý kiến về giảng dạy trái chiều: những năm trước được khen, còn đánh giá gần đây (2022-23) chê giải thích kém và ít hỗ trợ."
    ms: "Pandangan tentang pengajaran berbelah bahagi: tahun-tahun awal dipuji, tetapi ulasan terkini (2022-23) mengadu penerangan lemah dan sokongan kurang."
    id: "Pendapat soal pengajaran terbelah: tahun-tahun awal dipuji, tapi ulasan terbaru (2022-23) mengeluhkan penjelasan buruk dan minim dukungan."
    hi: "पढ़ाई पर राय बँटी है: पहले के सालों की तारीफ़ हुई, पर हाल के (2022-23) रिव्यू ख़राब समझाने और कम सपोर्ट की शिकायत करते हैं।"
  - en: "For the exam, practise the tutorial problem sheets and past papers; consistent effort can give a good score."
    zh: "备考建议反复练习辅导课习题和历年真题，持续投入可以拿到好成绩。"
    zh-TW: "備考建議反覆練習小組課習題和歷屆考古題，持續投入就能拿到好成績。"
    ja: "試験対策はチュートリアルの問題シートと過去問の演習。コツコツ努力すれば良い点が取れる。"
    ko: "시험 대비는 튜토리얼 문제지와 기출문제 연습이 핵심이며, 꾸준히 하면 좋은 점수를 받을 수 있음."
    vi: "Ôn thi bằng cách luyện bài tập tutorial và đề cũ; chăm chỉ đều đặn có thể đạt điểm tốt."
    ms: "Untuk peperiksaan, latih soalan tutorial dan kertas lepas; usaha yang konsisten boleh beri markah baik."
    id: "Untuk ujian, latih soal tutorial dan soal tahun lalu; usaha yang konsisten bisa memberi nilai bagus."
    hi: "एग्ज़ाम के लिए ट्यूटोरियल प्रॉब्लम शीट और पिछले पेपर प्रैक्टिस करें; लगातार मेहनत से अच्छा स्कोर मिल सकता है।"
sections:
  content:
    - en: "Extends intro macro with a focus on the maths behind the models. Strong algebra and economic intuition help a lot. Older reviews are mostly positive; the most recent ones are very negative about the teaching."
      zh: "在入门宏观基础上延伸，重点是模型背后的数学。代数扎实、经济直觉好会轻松很多。早年评价多为正面，最近几条对教学非常不满。"
      zh-TW: "在入門總經基礎上延伸，重點是模型背後的數學。代數扎實、經濟直覺好會輕鬆很多。早年評價多為正面，最近幾則對教學非常不滿。"
      ja: "入門マクロを発展させ、モデルの背後にある数学が中心。代数力と経済の直感があると大いに助かる。古いレビューは概ね好意的だが、最近のものは教え方に非常に否定的。"
      ko: "입문 거시를 확장하며 모델 뒤의 수학에 초점을 둔다. 대수 실력과 경제적 직관이 큰 도움이 된다. 예전 리뷰는 대체로 긍정적이지만 최근 리뷰는 수업에 매우 부정적이다."
      vi: "Mở rộng vĩ mô nhập môn, tập trung vào toán đằng sau các mô hình. Đại số vững và trực giác kinh tế giúp nhiều. Đánh giá cũ phần lớn tích cực; mới nhất thì rất tiêu cực về cách dạy."
      ms: "Melanjutkan makro pengenalan dengan fokus pada matematik di sebalik model. Algebra kukuh dan intuisi ekonomi sangat membantu. Ulasan lama kebanyakan positif; yang terbaru sangat negatif tentang pengajaran."
      id: "Melanjutkan makro pengantar dengan fokus pada matematika di balik model. Aljabar yang kuat dan intuisi ekonomi sangat membantu. Ulasan lama kebanyakan positif; yang terbaru sangat negatif soal pengajaran."
      hi: "इंट्रो मैक्रो को आगे बढ़ाता है, मॉडलों के पीछे के गणित पर ज़ोर। मज़बूत अलजेब्रा और आर्थिक समझ बहुत मदद करती है। पुराने रिव्यू ज़्यादातर सकारात्मक; सबसे नए पढ़ाई को लेकर बहुत नकारात्मक हैं।"
  work:
    - en: "Assignments need tricky algebra and out-of-the-box thinking; one recent reviewer found them harshly marked. Tutorials are often described as rushed."
      zh: "作业需要复杂的代数推导和跳出框架的思考；一位近期同学觉得改分很严。tutorial 常被形容很赶。"
      zh-TW: "作業需要複雜的代數推導和跳脫框架的思考；一位近期同學覺得給分很嚴。tutorial 常被形容很趕。"
      ja: "課題は込み入った代数と柔軟な発想が必要。最近の一人は採点が厳しかったと言う。チュートリアルは駆け足だという声が多い。"
      ko: "과제는 까다로운 대수와 틀을 벗어난 사고가 필요하다. 최근 한 리뷰어는 채점이 가혹했다고 한다. 튜토리얼은 서두른다는 평이 많다."
      vi: "Bài tập cần biến đổi đại số khó và tư duy sáng tạo; một người gần đây thấy chấm gắt. Tutorial thường bị nói là vội vàng."
      ms: "Tugasan perlukan algebra rumit dan pemikiran luar kotak; seorang pengulas terkini rasa dimarkah dengan keras. Tutorial sering digambarkan tergesa-gesa."
      id: "Tugas butuh aljabar rumit dan berpikir di luar kebiasaan; satu reviewer terbaru merasa dinilai keras. Tutorial sering disebut terburu-buru."
      hi: "असाइनमेंट में पेचीदा अलजेब्रा और लीक से हटकर सोच चाहिए; एक हालिया रिव्यूअर को मार्किंग सख़्त लगी। ट्यूटोरियल अक्सर जल्दबाज़ी वाले बताए गए।"
  study:
    - en: "Keep up and work through the lecture slides, tutorial problem sheets and recent exams; the exam can include tricky questions."
      zh: "跟上进度，把 lecture slides、tutorial 题单和近几年考题都做一遍；考试可能有难题。"
      zh-TW: "跟上進度，把 lecture slides、tutorial 題單和近幾年考題都做一遍；考試可能有難題。"
      ja: "遅れずに、講義スライド、チュートリアルの問題シート、最近の過去問に取り組もう。試験には難しい問題も出る。"
      ko: "진도를 따라가며 강의 슬라이드, 튜토리얼 문제지, 최근 기출을 풀어 보자. 시험에 까다로운 문제가 나올 수 있다."
      vi: "Theo kịp và làm hết slide bài giảng, đề tutorial và đề thi gần đây; bài thi có thể có câu khó."
      ms: "Ikuti perkembangan dan selesaikan slaid kuliah, helaian soalan tutorial dan peperiksaan terkini; peperiksaan boleh ada soalan rumit."
      id: "Ikuti terus dan kerjakan slide kuliah, lembar soal tutorial, dan ujian terbaru; ujian bisa berisi soal rumit."
      hi: "साथ चलें और लेक्चर स्लाइड्स, ट्यूटोरियल प्रॉब्लम शीट्स और हाल की परीक्षाएँ हल करें; परीक्षा में पेचीदा सवाल हो सकते हैं।"
  watch:
    - en: "The most recent reviews are from 2023, so the subject may have changed since."
      zh: "最新的评价是 2023 年的，这门课之后可能有变化。"
      zh-TW: "最新的評價是 2023 年的，這門課之後可能有變化。"
      ja: "最新のレビューは2023年のもので、その後内容が変わっている可能性がある。"
      ko: "가장 최근 리뷰가 2023년 것이라 이후 과목이 바뀌었을 수 있다."
      vi: "Đánh giá mới nhất là từ 2023, nên môn học có thể đã thay đổi."
      ms: "Ulasan terbaru dari 2023, jadi subjek mungkin telah berubah sejak itu."
      id: "Ulasan terbaru dari 2023, jadi mata kuliahnya mungkin sudah berubah."
      hi: "सबसे नए रिव्यू 2023 के हैं, इसलिए विषय तब से बदल सकता है।"
difficulty: hard
