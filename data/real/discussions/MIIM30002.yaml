points:
  - en: "Considered one of the hardest subjects, and a big step up from second year. MST averages are often in the 50s-60s."
    zh: "被认为是最难的课之一，比二年级跨度大；期中平均常在50-60%。"
    zh-TW: "被認為是最難的課之一，比二年級跨度大；期中平均常在50-60%。"
    ja: "最難関科目の一つとされ、2年次から大きくレベルが上がる。MSTの平均は50-60点台が多い。"
    ko: "가장 어려운 과목 중 하나로 꼽히며 2학년에서 크게 어려워진다. MST 평균은 보통 50-60점대다."
    vi: "Được coi là một trong những môn khó nhất, nhảy vọt so với năm hai. Điểm trung bình MST thường 50-60."
    ms: "Dianggap antara subjek paling sukar, lonjakan besar dari tahun dua. Purata MST selalunya 50-an hingga 60-an."
    id: "Dianggap salah satu mata kuliah tersulit, lompatan besar dari tahun kedua. Rata-rata MST sering di kisaran 50-60."
    hi: "सबसे कठिन सब्जेक्ट्स में गिना जाता है, सेकंड ईयर से बड़ी छलांग। MST औसत अक्सर 50-60 के बीच।"
  - en: "Very well coordinated, with revision sessions, MST reviews and help on how to answer short and long answer questions."
    zh: "组织非常好，有复习课、期中复盘，并教如何作答简答和长答题。"
    zh-TW: "組織非常好，有複習課、期中檢討，並教如何作答簡答和長答題。"
    ja: "運営が非常に良く、復習セッション、MSTの振り返り、短答・長答問題の答え方の指導がある。"
    ko: "운영이 매우 잘 되어 복습 세션, MST 리뷰, 단답·서술형 답안 작성법 지도까지 있다."
    vi: "Điều phối rất tốt, có buổi ôn tập, chữa MST và hướng dẫn cách trả lời câu ngắn và câu dài."
    ms: "Sangat diselaraskan, dengan sesi ulang kaji, ulasan MST dan bantuan menjawab soalan jawapan pendek dan panjang."
    id: "Koordinasinya sangat baik, ada sesi review, pembahasan MST, dan bantuan cara menjawab soal isian singkat dan esai."
    hi: "बहुत अच्छा कोऑर्डिनेशन: रिवीज़न सेशन, MST रिव्यू, और शॉर्ट व लॉन्ग आंसर लिखने में मदद।"
  - en: "Short and long answer questions are the hardest part. Practise them and link topics across modules."
    zh: "简答和长答题最难，要多练并把各模块内容串联起来。"
    zh-TW: "簡答和長答題最難，要多練習並把各模組內容串起來。"
    ja: "短答・長答問題が一番難しい。練習を重ね、モジュールをまたいでトピックを結びつけよう。"
    ko: "단답형과 서술형 문제가 가장 어렵다. 연습하고 모듈 간 주제를 연결하자."
    vi: "Câu trả lời ngắn và dài là khó nhất. Hãy luyện và liên kết các chủ đề giữa các module."
    ms: "Soalan jawapan pendek dan panjang paling sukar. Latih dan kaitkan topik merentas modul."
    id: "Soal isian singkat dan esai paling sulit. Latih dan hubungkan topik antar modul."
    hi: "शॉर्ट और लॉन्ग आंसर सवाल सबसे कठिन हैं। इनकी प्रैक्टिस करें और मॉड्यूल्स के टॉपिक जोड़ें।"
  - en: "Only take it if you are keen on immunology, and keep up weekly. A study group helps."
    zh: "只有对免疫学真有兴趣再选，每周跟上进度，组队学习有帮助。"
    zh-TW: "只有對免疫學真有興趣再選，每週跟上進度，組讀書會有幫助。"
    ja: "免疫学に強い関心がある場合だけ取ろう。毎週遅れずに。勉強会が役立つ。"
    ko: "면역학에 관심이 많을 때만 듣고, 매주 진도를 따라가자. 스터디 그룹이 도움이 된다."
    vi: "Chỉ học nếu bạn thật sự thích miễn dịch học, và theo kịp hằng tuần. Học nhóm sẽ có ích."
    ms: "Ambil hanya jika anda minat imunologi, dan ikuti setiap minggu. Kumpulan belajar membantu."
    id: "Ambil hanya jika kamu tertarik imunologi, dan ikuti tiap minggu. Kelompok belajar membantu."
    hi: "तभी लें जब इम्यूनोलॉजी में सच में रुचि हो, और हर हफ्ते साथ बने रहें। स्टडी ग्रुप मदद करता है।"
difficulty: hard
