code: COMP20003
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/comp20003
reviews: 9
from: 2017
to: 2025
checked: 2026-10-08
points:
  - en: "Generally well liked: practical algorithms with real applications, often compared favourably with COMP20007 for people who prefer applications over theory."
    zh: "整体评价较好：算法偏实用、贴近实际应用；喜欢应用多于理论的同学常拿它和 COMP20007 比较，觉得更合适。"
    zh-TW: "整體評價不錯：演算法偏實用、有真實應用；喜歡應用多於理論的人常覺得它比 COMP20007 合適。"
    ja: "全体的に好評。実用的なアルゴリズムと実際の応用を扱い、理論より応用が好きな人にはCOMP20007より良いとよく言われる。"
    ko: "대체로 평이 좋다. 실제 응용이 있는 실용적 알고리즘을 다루며, 이론보다 응용을 좋아하면 COMP20007보다 낫다는 말이 많다."
    vi: "Nhìn chung được yêu thích: thuật toán thực tế có ứng dụng thật, thường được đánh giá hơn COMP20007 với ai thích ứng dụng hơn lý thuyết."
    ms: "Secara umum disukai: algoritma praktikal dengan aplikasi sebenar, sering dibandingkan lebih baik daripada COMP20007 bagi yang lebih suka aplikasi."
    id: "Umumnya disukai: algoritma praktis dengan aplikasi nyata, sering dinilai lebih cocok dari COMP20007 bagi yang lebih suka aplikasi daripada teori."
    hi: "आम तौर पर पसंद किया जाता है: असली उपयोग वाले प्रैक्टिकल एल्गोरिदम; थ्योरी से ज़्यादा एप्लिकेशन पसंद करने वाले इसे COMP20007 से बेहतर मानते हैं।"
  - en: "The assignments are the main workload: written in C with heavy use of pointers, often from scratch. Start early; do not leave them to the last minute."
    zh: "作业是主要的工作量：用 C 写，大量用到指针，常常要从零开始。一定要早点开始，不要拖到最后。"
    zh-TW: "作業是主要的工作量：用 C 寫、大量用到指標，常常要從零開始。一定要早點開始，不要拖到最後。"
    ja: "課題が主な負担。Cで書き、ポインタを多用し、ゼロから作ることも多い。早めに始めて、ギリギリまで放置しないこと。"
    ko: "과제가 주된 공부량이다. C로 작성하고 포인터를 많이 쓰며 처음부터 짜는 경우가 많다. 일찍 시작하고 막판까지 미루지 말자."
    vi: "Bài tập là phần việc chính: viết bằng C, dùng con trỏ nhiều, thường từ đầu. Bắt đầu sớm, đừng để đến phút cuối."
    ms: "Tugasan ialah beban utama: ditulis dalam C dengan banyak penggunaan penuding, selalunya dari awal. Mula awal; jangan tangguh hingga saat akhir."
    id: "Tugas adalah beban utama: ditulis dalam C dengan banyak pointer, sering dari nol. Mulai lebih awal; jangan ditunda sampai menit terakhir."
    hi: "असाइनमेंट मुख्य वर्कलोड हैं: C में, पॉइंटर का भारी इस्तेमाल, अक्सर शुरू से। जल्दी शुरू करें; आख़िरी समय तक न टालें।"
  - en: "Reviewers say the theory and maths are not especially heavy; a solid intuition for how each algorithm works is usually enough."
    zh: "大家认为理论和数学要求不算高，理解每个算法大致怎么运作通常就够了。"
    zh-TW: "評論者說理論和數學要求不算重；對每個演算法怎麼運作有扎實的直覺通常就夠了。"
    ja: "理論や数学はそれほど重くなく、各アルゴリズムの仕組みを直感的にしっかり理解していれば十分だという。"
    ko: "리뷰어들은 이론과 수학이 아주 무겁진 않으며, 각 알고리즘이 어떻게 작동하는지 직관적으로 잘 이해하면 대개 충분하다고 한다."
    vi: "Người đánh giá nói lý thuyết và toán không quá nặng; hiểu trực quan chắc chắn cách mỗi thuật toán chạy thường là đủ."
    ms: "Pengulas kata teori dan matematik tidak terlalu berat; gerak hati yang kukuh tentang cara setiap algoritma berfungsi biasanya mencukupi."
    id: "Pengulas bilang teori dan matematikanya tidak terlalu berat; intuisi yang kuat soal cara kerja tiap algoritma biasanya cukup."
    hi: "रिव्यूअर्स कहते हैं थ्योरी और मैथ्स ज़्यादा भारी नहीं; हर एल्गोरिदम कैसे काम करता है, इसकी पक्की समझ आम तौर पर काफ़ी है।"
sections:
  content:
    - en: "Applied algorithms and data structures in C, including trees and path finding. Most reviewers liked it and preferred it to COMP20007; it is not very maths heavy."
      zh: "用 C 实现的应用型算法与数据结构，包括树和寻路算法。多数同学喜欢，觉得比 COMP20007 好；数学要求不算高。"
      zh-TW: "用 C 實作的應用型演算法與資料結構，包括樹和尋路演算法。多數同學喜歡，覺得比 COMP20007 好；數學要求不算高。"
      ja: "C言語で学ぶ応用寄りのアルゴリズムとデータ構造で、木や経路探索も扱う。多くが高評価でCOMP20007より好むという声。数学はそれほど重くない。"
      ko: "C로 배우는 응용 위주의 알고리즘과 자료구조로 트리와 경로 탐색도 다룬다. 대부분 좋아했고 COMP20007보다 낫다고 했다. 수학 부담은 크지 않다."
      vi: "Thuật toán và cấu trúc dữ liệu ứng dụng bằng C, gồm cây và tìm đường. Đa số thích và chuộng hơn COMP20007; không nặng toán."
      ms: "Algoritma dan struktur data gunaan dalam C, termasuk pokok dan pencarian laluan. Kebanyakan suka dan lebih gemar berbanding COMP20007; tidak terlalu berat matematik."
      id: "Algoritma dan struktur data terapan dengan C, termasuk pohon dan pencarian jalur. Kebanyakan suka dan lebih memilihnya dibanding COMP20007; tidak terlalu berat matematika."
      hi: "C में व्यावहारिक एल्गोरिदम और डेटा स्ट्रक्चर, जिसमें ट्री और पाथ फ़ाइंडिंग शामिल हैं। ज़्यादातर को पसंद आया और COMP20007 से बेहतर लगा; गणित ज़्यादा भारी नहीं।"
  work:
    - en: "The assignments are a hurdle and very demanding, built largely from scratch with heavy pointer use, but many found them the most rewarding part. The exam is seen as fair."
      zh: "作业是 hurdle，要求很高，基本从零写起、大量用指针；但很多人觉得这是最有收获的部分。考试被认为公平。"
      zh-TW: "作業是 hurdle，要求很高，基本從零寫起、大量用指標；但很多人覺得這是最有收穫的部分。考試被認為公平。"
      ja: "課題はハードルで非常に大変。ほぼゼロから書き、ポインタを多用する。それでも一番やりがいがあったという声が多い。試験は公平とされる。"
      ko: "과제는 허들이며 매우 힘들다. 대부분 처음부터 짜고 포인터를 많이 쓴다. 그래도 가장 보람 있었다는 평이 많다. 시험은 공정하다는 평."
      vi: "Bài tập là hurdle và rất nặng, gần như viết từ đầu và dùng con trỏ nhiều, nhưng nhiều người thấy đây là phần đáng giá nhất. Bài thi được cho là công bằng."
      ms: "Tugasan ialah hurdle dan sangat mencabar, dibina sebahagian besar dari awal dengan banyak penuding, tetapi ramai rasa ia bahagian paling berbaloi. Peperiksaan dianggap adil."
      id: "Tugasnya hurdle dan sangat berat, sebagian besar dibuat dari nol dengan banyak pointer, tapi banyak yang merasa ini bagian paling memuaskan. Ujiannya dianggap adil."
      hi: "असाइनमेंट हर्डल हैं और बहुत मेहनत वाले, ज़्यादातर शुरू से बनाने पड़ते हैं और पॉइंटर का भारी उपयोग, पर कई को यही सबसे संतोषजनक हिस्सा लगा। परीक्षा उचित मानी गई।"
  study:
    - en: "Never leave the assignments to the last minute, get comfortable with pointers in C, and use the textbook and outside videos for the harder algorithms."
      zh: "作业千万别拖到最后；把 C 的指针练熟；难一点的算法多看课本和课外视频。"
      zh-TW: "作業千萬別拖到最後；把 C 的指標練熟；難一點的演算法多看課本和課外影片。"
      ja: "課題は絶対にギリギリまで残さない。Cのポインタに慣れ、難しいアルゴリズムは教科書と外部動画で補う。"
      ko: "과제는 절대 막판까지 미루지 말고, C 포인터에 익숙해지며, 어려운 알고리즘은 교재와 외부 영상으로 보충하라."
      vi: "Đừng bao giờ để bài tập đến phút chót, làm quen với con trỏ trong C, và dùng sách cùng video ngoài cho các thuật toán khó."
      ms: "Jangan sesekali tangguh tugasan ke saat akhir, biasakan diri dengan penuding dalam C, dan guna buku teks serta video luar untuk algoritma sukar."
      id: "Jangan pernah menunda tugas sampai menit terakhir, biasakan diri dengan pointer di C, dan pakai buku teks serta video luar untuk algoritma yang sulit."
      hi: "असाइनमेंट कभी आख़िरी समय पर न छोड़ें, C के पॉइंटर में सहज हों, और कठिन एल्गोरिदम के लिए किताब और बाहरी वीडियो की मदद लें।"
  watch:
    - en: "One 2024 reviewer found the first half's lectures hard to absorb, the assignments heavy for their weight, and marks for later assignments released only after the exam."
      zh: "2024 年有同学觉得前半学期的课不好吸收，作业工作量大但占分少，后面几个作业的成绩到考完才出。"
      zh-TW: "2024 年有同學覺得前半學期的課不好吸收，作業工作量大但配分少，後面幾份作業的成績考完才出來。"
      ja: "2024年のレビューでは、前半の講義は頭に入りにくく、課題は配点の割に重く、後半の課題の点数は試験後まで出なかったという。"
      ko: "2024년 한 리뷰어는 전반부 강의가 흡수하기 어렵고, 과제가 비중에 비해 무거우며, 후반 과제 점수가 시험 후에야 나왔다고 했다."
      vi: "Một người năm 2024 thấy bài giảng nửa đầu khó tiếp thu, bài tập nặng so với tỷ trọng, và điểm các bài sau chỉ có sau kỳ thi."
      ms: "Seorang pengulas 2024 rasa kuliah separuh pertama sukar diserap, tugasan berat berbanding wajarannya, dan markah tugasan kemudian dikeluarkan selepas peperiksaan."
      id: "Satu pengulas 2024 merasa kuliah paruh pertama sulit dicerna, tugasnya berat dibanding bobotnya, dan nilai tugas akhir baru keluar setelah ujian."
      hi: "2024 के एक रिव्यूअर को पहले हिस्से के लेक्चर समझने में कठिन, असाइनमेंट अपने वेटेज के मुक़ाबले भारी, और बाद के असाइनमेंट के अंक परीक्षा के बाद ही मिले।"
workload: heavy
