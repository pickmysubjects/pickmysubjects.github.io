reviews: 6
from: 2016
to: 2026
checked: 2026-10-08
points:
  - en: "In 2026, R coding was added but not really taught (just worksheets), and assignment instructions were seen as vague."
    zh: "2026年新增了R编程，但几乎没有讲授（只发练习表），作业要求也被认为不清晰。"
    zh-TW: "2026年新增了R程式設計，但幾乎沒有教（只發練習單），作業要求也被認為不清楚。"
    ja: "2026年にRのコーディングが追加されたが、ほぼ教えられず（ワークシートのみ）、課題の指示も曖昧と言われた。"
    ko: "2026년에 R 코딩이 추가됐지만 제대로 가르치지 않았고(워크시트만 제공), 과제 안내도 모호하다는 평이었다."
    vi: "Năm 2026 có thêm phần lập trình R nhưng gần như không được dạy (chỉ có worksheet), và hướng dẫn bài tập bị cho là mơ hồ."
    ms: "Pada 2026, pengekodan R ditambah tetapi tidak benar-benar diajar (hanya lembaran kerja), dan arahan tugasan dianggap kabur."
    id: "Pada 2026, coding R ditambahkan tapi tidak benar-benar diajarkan (hanya lembar kerja), dan instruksi tugas dinilai kurang jelas."
    hi: "2026 में R कोडिंग जोड़ी गई पर ठीक से पढ़ाई नहीं गई (सिर्फ़ वर्कशीट), और असाइनमेंट के निर्देश अस्पष्ट लगे।"
  - en: "MSTs were considered straightforward, but some exam questions went beyond what was taught."
    zh: "期中测验被认为简单直接，但期末考试有些题目超出了授课范围。"
    zh-TW: "期中測驗被認為簡單直接，但期末考有些題目超出授課範圍。"
    ja: "中間テスト（MST）は素直な内容だったが、試験には授業範囲を超える問題もあった。"
    ko: "중간고사(MST)는 무난했지만 시험 일부 문제는 수업 범위를 벗어났다."
    vi: "Các bài MST được cho là dễ, nhưng một số câu thi vượt quá nội dung đã dạy."
    ms: "MST dianggap mudah, tetapi beberapa soalan peperiksaan melebihi apa yang diajar."
    id: "MST dianggap cukup mudah, tapi beberapa soal ujian melampaui materi yang diajarkan."
    hi: "MST आसान माने गए, पर परीक्षा के कुछ सवाल पढ़ाए गए हिस्से से बाहर थे।"
  - en: "Views on the content are split: some found it dry and disorganised, others enjoyed it and some saw it as a WAM booster."
    zh: "对内容看法不一：有人觉得枯燥、杂乱，也有人很喜欢，甚至认为能拉高WAM。"
    zh-TW: "對內容看法不一：有人覺得枯燥、雜亂，也有人很喜歡，甚至認為能拉高WAM。"
    ja: "内容の評価は分かれる。退屈でまとまりがないという声もあれば、楽しめた人や、WAMを上げやすいと見る人もいる。"
    ko: "내용에 대한 의견은 갈린다. 지루하고 산만하다는 사람도, 재미있었다는 사람도, WAM 올리기 좋다는 사람도 있다."
    vi: "Ý kiến về nội dung trái chiều: có người thấy khô khan, lộn xộn, có người thích, có người xem là môn kéo WAM."
    ms: "Pandangan tentang kandungan berbelah bahagi: ada yang rasa bosan dan tidak tersusun, ada yang suka, ada yang anggap penaik WAM."
    id: "Pendapat soal materinya terbelah: ada yang merasa membosankan dan berantakan, ada yang suka, ada yang menganggapnya pendongkrak WAM."
    hi: "कंटेंट पर राय बंटी है: कुछ को यह नीरस और बिखरा लगा, कुछ को पसंद आया, और कुछ इसे WAM बढ़ाने वाला मानते हैं।"
  - en: "The cancer genetics and epigenetics modules are repeatedly named as highlights."
    zh: "癌症遗传学和表观遗传学模块多次被评为亮点。"
    zh-TW: "癌症遺傳學和表觀遺傳學單元多次被評為亮點。"
    ja: "がん遺伝学とエピジェネティクスの単元は、何度も見どころとして挙げられている。"
    ko: "암 유전학과 후성유전학 모듈은 여러 번 하이라이트로 꼽혔다."
    vi: "Các phần di truyền học ung thư và biểu sinh học nhiều lần được nhắc là điểm sáng."
    ms: "Modul genetik kanser dan epigenetik berulang kali disebut sebagai bahagian terbaik."
    id: "Modul genetika kanker dan epigenetika berulang kali disebut sebagai bagian terbaik."
    hi: "कैंसर जेनेटिक्स और एपिजेनेटिक्स मॉड्यूल को बार-बार सबसे अच्छा हिस्सा बताया गया।"
sections:
  content:
    - en: "Covers genomics, sequencing, bioinformatics, R coding, gene editing, epigenetics, RNA and cancer genetics. Reviewers split: some found it broad and useful, others dry and disjointed. Cancer modules were liked."
      zh: "讲基因组学、测序、生物信息、R 编程、基因编辑、表观遗传、RNA 和癌症遗传。评价两极：有人觉得全面实用，也有人觉得枯燥、零散。癌症模块大家都喜欢。"
      zh-TW: "講基因體學、定序、生物資訊、R 程式、基因編輯、表觀遺傳、RNA 和癌症遺傳。評價兩極：有人覺得全面實用，也有人覺得枯燥、零散。癌症模組大家都喜歡。"
      ja: "ゲノミクス、シーケンシング、バイオインフォマティクス、R、遺伝子編集、エピジェネティクス、RNA、がん遺伝学を扱う。幅広く有用という人と退屈でまとまりがないという人に分かれ、がんのモジュールは好評。"
      ko: "유전체학, 시퀀싱, 생물정보학, R 코딩, 유전자 편집, 후성유전학, RNA, 암 유전학을 다룬다. 폭넓고 유용하다는 평과 건조하고 산만하다는 평이 갈리며, 암 모듈은 호평."
      vi: "Gồm hệ gen, giải trình tự, tin sinh học, code R, chỉnh sửa gen, di truyền ngoại gen, RNA và di truyền ung thư. Ý kiến chia: có người thấy rộng và hữu ích, người khác thấy khô và rời rạc. Module ung thư được thích."
      ms: "Meliputi genomik, penjujukan, bioinformatik, kod R, penyuntingan gen, epigenetik, RNA dan genetik kanser. Pandangan berbelah: ada yang rasa luas dan berguna, ada yang hambar dan bercelaru. Modul kanser disukai."
      id: "Mencakup genomik, sekuensing, bioinformatika, coding R, penyuntingan gen, epigenetik, RNA dan genetika kanker. Pendapat terbelah: ada yang merasa luas dan berguna, ada yang kering dan tidak runtut. Modul kanker disukai."
      hi: "जीनोमिक्स, सीक्वेंसिंग, बायोइन्फ़ॉर्मेटिक्स, R कोडिंग, जीन एडिटिंग, एपिजेनेटिक्स, RNA और कैंसर जेनेटिक्स। राय बँटी है: कुछ को व्यापक और उपयोगी, कुछ को नीरस और बिखरा लगा। कैंसर मॉड्यूल पसंद किए गए।"
  work:
    - en: "MSTs and written assignments were fairly straightforward for many, with high averages. In 2026 the assignments had vague or conflicting criteria, and one exam had questions not covered in class."
      zh: "很多同学觉得 MST 和书面作业都比较直接，平均分高。2026 年的作业评分标准模糊或前后不一致，期末也有课上没讲过的题。"
      zh-TW: "很多同學覺得 MST 和書面作業都比較直接，平均分高。2026 年的作業評分標準模糊或前後不一，期末也有課上沒講過的題目。"
      ja: "MSTとレポート課題は素直で平均も高いという声が多い。2026年は課題の基準があいまい・食い違いがあり、授業で扱っていない問題が試験に出たという。"
      ko: "많은 이들이 MST와 글 과제가 꽤 무난하고 평균이 높았다고 한다. 2026년엔 과제 기준이 모호하거나 서로 달랐고, 시험에 수업에서 안 다룬 문제가 나왔다고 한다."
      vi: "Nhiều người thấy MST và bài viết khá dễ, điểm trung bình cao. Năm 2026 tiêu chí bài tập mơ hồ hoặc mâu thuẫn, và bài thi có câu không học trên lớp."
      ms: "Ramai rasa MST dan tugasan bertulis agak mudah, dengan purata tinggi. Pada 2026 kriteria tugasan kabur atau bercanggah, dan peperiksaan ada soalan yang tidak diajar."
      id: "Banyak yang merasa MST dan tugas tertulis cukup lugas, rata-rata tinggi. Pada 2026 kriteria tugas samar atau bertentangan, dan ujian ada soal yang tidak diajarkan."
      hi: "कई लोगों को MST और लिखित असाइनमेंट सीधे लगे, औसत ऊँचा रहा। 2026 में असाइनमेंट के मानदंड अस्पष्ट या विरोधाभासी थे, और परीक्षा में कुछ सवाल कक्षा में नहीं पढ़ाए गए थे।"
  watch:
    - en: "R coding was added recently but isn't really taught; you work through worksheets yourself. Reviewers expect the subject to keep changing, with one hearing of a curriculum change next year."
      zh: "最近加入了 R 编程，但其实不怎么教，要自己做练习表。同学预计这门课还会继续调整，有人听说明年课程又要改。"
      zh-TW: "最近加入了 R 程式，但其實不太教，要自己做練習單。同學預計這門課還會繼續調整，有人聽說明年課程又要改。"
      ja: "最近Rのコーディングが加わったが実質教わらず、ワークシートを自力で進める。科目は今後も変わる見込みで、来年カリキュラムが変わると聞いた人も。"
      ko: "최근 R 코딩이 추가됐지만 사실상 가르치지 않아 워크시트를 혼자 풀어야 한다. 과목이 계속 바뀔 것으로 보이며, 내년에 커리큘럼이 바뀐다고 들은 사람도 있다."
      vi: "Code R mới được thêm nhưng gần như không dạy; bạn tự làm worksheet. Người học cho rằng môn sẽ còn thay đổi, một người nghe nói năm sau đổi chương trình."
      ms: "Pengekodan R baru ditambah tetapi tidak benar-benar diajar; anda buat lembaran kerja sendiri. Pengulas jangka subjek terus berubah, seorang dengar kurikulum berubah tahun depan."
      id: "Coding R baru ditambahkan tapi tidak benar-benar diajarkan; kamu mengerjakan lembar kerja sendiri. Pengulas memperkirakan mata kuliah terus berubah, satu mendengar kurikulum berubah tahun depan."
      hi: "R कोडिंग हाल में जोड़ी गई पर ठीक से पढ़ाई नहीं जाती; वर्कशीट खुद करनी होती हैं। रिव्यूअर्स मानते हैं विषय बदलता रहेगा, एक ने अगले साल पाठ्यक्रम बदलने की बात सुनी।"
difficulty: mixed
