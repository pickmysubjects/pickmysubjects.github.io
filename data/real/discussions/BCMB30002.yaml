points:
  - en: "In 2026, R coding was added but not really taught (just worksheets), and assignment instructions were seen as vague."
    zh: "2026年新增了R编程，但几乎没有讲授（只发练习表），作业要求也被认为不清晰。"
    zh-TW: "2026年新增了R程式設計，但幾乎沒有教（只發練習單），作業要求也被認為不清楚。"
    ja: "2026年にRのコーディングが追加されたが、ほぼ教えられず（ワークシートのみ）、課題の指示も曖昧と言われた。"
    ko: "2026년에 R 코딩이 추가됐지만 제대로 가르치지 않았고(워크시트만 제공), 과제 안내도 모호하다는 평이었다."
    vi: "Năm 2026 có thêm phần lập trình R nhưng gần như không được dạy (chỉ có worksheet), và hướng dẫn bài tập bị cho là mơ hồ."
    ms: "Pada 2026, pengekodan R ditambah tetapi tidak benar-benar diajar (hanya lembaran kerja), dan arahan tugasan dianggap kabur."
    id: "Pada 2026, coding R ditambahkan tapi tidak benar-benar diajarkan (hanya lembar kerja), dan instruksi tugas dinilai kurang jelas."
    hi: "2026 में R कोडिंग जोड़ी गई पर ठीक से पढ़ाई नहीं गई (सिर्फ़ वर्कशीट), और असाइनमेंट के निर्देश अस्पष्ट लगे।"
  - en: "MSTs were considered straightforward, but some exam questions went beyond what was taught."
    zh: "期中测验被认为简单直接，但期末考试有些题目超出了授课范围。"
    zh-TW: "期中測驗被認為簡單直接，但期末考有些題目超出授課範圍。"
    ja: "中間テスト（MST）は素直な内容だったが、試験には授業範囲を超える問題もあった。"
    ko: "중간고사(MST)는 무난했지만 시험 일부 문제는 수업 범위를 벗어났다."
    vi: "Các bài MST được cho là dễ, nhưng một số câu thi vượt quá nội dung đã dạy."
    ms: "MST dianggap mudah, tetapi beberapa soalan peperiksaan melebihi apa yang diajar."
    id: "MST dianggap cukup mudah, tapi beberapa soal ujian melampaui materi yang diajarkan."
    hi: "MST आसान माने गए, पर परीक्षा के कुछ सवाल पढ़ाए गए हिस्से से बाहर थे।"
  - en: "Views on the content are split: some found it dry and disorganised, others enjoyed it and some saw it as a WAM booster."
    zh: "对内容看法不一：有人觉得枯燥、杂乱，也有人很喜欢，甚至认为能拉高WAM。"
    zh-TW: "對內容看法不一：有人覺得枯燥、雜亂，也有人很喜歡，甚至認為能拉高WAM。"
    ja: "内容の評価は分かれる。退屈でまとまりがないという声もあれば、楽しめた人や、WAMを上げやすいと見る人もいる。"
    ko: "내용에 대한 의견은 갈린다. 지루하고 산만하다는 사람도, 재미있었다는 사람도, WAM 올리기 좋다는 사람도 있다."
    vi: "Ý kiến về nội dung trái chiều: có người thấy khô khan, lộn xộn, có người thích, có người xem là môn kéo WAM."
    ms: "Pandangan tentang kandungan berbelah bahagi: ada yang rasa bosan dan tidak tersusun, ada yang suka, ada yang anggap penaik WAM."
    id: "Pendapat soal materinya terbelah: ada yang merasa membosankan dan berantakan, ada yang suka, ada yang menganggapnya pendongkrak WAM."
    hi: "कंटेंट पर राय बंटी है: कुछ को यह नीरस और बिखरा लगा, कुछ को पसंद आया, और कुछ इसे WAM बढ़ाने वाला मानते हैं।"
  - en: "The cancer genetics and epigenetics modules are repeatedly named as highlights."
    zh: "癌症遗传学和表观遗传学模块多次被评为亮点。"
    zh-TW: "癌症遺傳學和表觀遺傳學單元多次被評為亮點。"
    ja: "がん遺伝学とエピジェネティクスの単元は、何度も見どころとして挙げられている。"
    ko: "암 유전학과 후성유전학 모듈은 여러 번 하이라이트로 꼽혔다."
    vi: "Các phần di truyền học ung thư và biểu sinh học nhiều lần được nhắc là điểm sáng."
    ms: "Modul genetik kanser dan epigenetik berulang kali disebut sebagai bahagian terbaik."
    id: "Modul genetika kanker dan epigenetika berulang kali disebut sebagai bagian terbaik."
    hi: "कैंसर जेनेटिक्स और एपिजेनेटिक्स मॉड्यूल को बार-बार सबसे अच्छा हिस्सा बताया गया।"
difficulty: mixed
