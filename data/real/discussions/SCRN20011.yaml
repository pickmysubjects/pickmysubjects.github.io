checked: 2026-10-17
points:
  - en: "Reviews from 2014 to 2023 are all positive: it traces Hollywood decade by decade with the theory and politics behind it."
    zh: "2014到2023年的评价全部正面：按年代梳理好莱坞，以及背后的理论和政治。"
    zh-TW: "2014到2023年的評價全部正面：按年代梳理好萊塢，以及背後的理論和政治。"
    ja: "2014〜2023年のレビューはすべて好意的。ハリウッドを10年ごとにたどり、その背後の理論と政治も扱う。"
    ko: "2014~2023년 리뷰는 모두 긍정적. 할리우드를 10년 단위로 따라가며 그 이면의 이론과 정치도 다룸."
    vi: "Đánh giá từ 2014 đến 2023 đều tích cực: đi qua Hollywood theo từng thập niên cùng lý thuyết và chính trị phía sau."
    ms: "Ulasan dari 2014 hingga 2023 semuanya positif: ia menjejak Hollywood dekad demi dekad bersama teori dan politik di sebaliknya."
    id: "Ulasan 2014-2023 semuanya positif: menelusuri Hollywood dekade demi dekade beserta teori dan politik di baliknya."
    hi: "2014 से 2023 तक के सभी रिव्यू सकारात्मक हैं: यह हॉलीवुड को दशक-दर-दशक, उसके पीछे की थ्योरी और राजनीति के साथ देखता है।"
  - en: "Students liked being able to write their own essay questions; one 2019 reviewer found the student-led tutorial presentations chaotic."
    zh: "学生喜欢可以自拟论文题目；一位2019年的评论者觉得学生主导的辅导课展示有些混乱。"
    zh-TW: "學生喜歡可以自擬論文題目；一位2019年的評論者覺得學生主導的輔導課報告有些混亂。"
    ja: "エッセイの問いを自分で立てられる点が好評。2019年のレビューでは学生主導のチュートリアル発表がやや混乱していたとのこと。"
    ko: "에세이 질문을 직접 만들 수 있는 점이 호평. 2019년 리뷰어는 학생 주도 튜토리얼 발표가 다소 혼란스러웠다고 함."
    vi: "Sinh viên thích được tự đặt đề luận; một người năm 2019 thấy phần thuyết trình do sinh viên dẫn dắt trong tutorial khá lộn xộn."
    ms: "Pelajar suka boleh menulis soalan esei sendiri; seorang pengulas 2019 dapati pembentangan tutorial yang dipimpin pelajar agak huru-hara."
    id: "Mahasiswa suka bisa membuat soal esai sendiri; pengulas 2019 merasa presentasi tutorial yang dipimpin mahasiswa agak kacau."
    hi: "छात्रों को अपने निबंध प्रश्न ख़ुद बनाने की छूट पसंद आई; 2019 के एक रिव्यूअर को छात्रों द्वारा चलाई गई ट्यूटोरियल प्रस्तुतियाँ अव्यवस्थित लगीं।"
sections:
  content:
    - en: "Moves decade by decade through Hollywood, with the theories and politics behind each era and a film to watch every week. Reviewers found it fascinating and well taught."
      zh: "按年代梳理好莱坞，讲每个时期背后的理论和政治，每周看一部电影。同学觉得很有意思、教得好。"
      zh-TW: "按年代梳理好萊塢，講每個時期背後的理論和政治，每週看一部電影。同學覺得很有趣、教得好。"
      ja: "ハリウッドを年代ごとにたどり、各時代の理論や政治的背景を学び、毎週映画を1本見る。とても面白く教え方も良いという声。"
      ko: "할리우드를 10년 단위로 훑으며 각 시대의 이론과 정치적 배경을 배우고 매주 영화 한 편을 본다. 매우 흥미롭고 잘 가르친다는 평."
      vi: "Đi qua Hollywood theo từng thập kỷ, cùng lý thuyết và chính trị đằng sau mỗi thời kỳ, mỗi tuần xem một bộ phim. Người học thấy rất cuốn hút và dạy tốt."
      ms: "Menelusuri Hollywood dekad demi dekad, dengan teori dan politik di sebalik setiap era serta sebuah filem setiap minggu. Pengulas rasa sangat menarik dan diajar dengan baik."
      id: "Menelusuri Hollywood dekade demi dekade, dengan teori dan politik di balik tiap era serta satu film tiap minggu. Pengulas merasa sangat menarik dan diajarkan dengan baik."
      hi: "दशक-दर-दशक हॉलीवुड, हर दौर के सिद्धांत और राजनीति के साथ, और हर हफ़्ते एक फ़िल्म। रिव्यूअर्स को यह बहुत रोचक और अच्छा पढ़ाया हुआ लगा।"
  work:
    - en: "Essays where you write your own question, which reviewers loved, plus a tutorial presentation leading discussion; one reviewer found that part chaotic."
      zh: "论文可以自己出题，同学很喜欢；还有一次带领 tutorial 讨论的展示，有同学觉得那部分有点乱。"
      zh-TW: "論文可以自己出題，同學很喜歡；還有一次帶領 tutorial 討論的報告，有同學覺得那部分有點亂。"
      ja: "自分で問いを立てるエッセイ（好評）と、チュートリアルの議論を主導する発表。その部分は混乱していたという声も一つ。"
      ko: "직접 질문을 정하는 에세이(호평)와 튜토리얼 토론을 이끄는 발표가 있다. 그 부분이 어수선했다는 리뷰어도 있다."
      vi: "Bài luận tự đặt câu hỏi, được người học rất thích, cùng phần thuyết trình dẫn dắt thảo luận tutorial; một người thấy phần này khá lộn xộn."
      ms: "Esei di mana anda tulis soalan sendiri, yang pengulas sangat suka, serta pembentangan tutorial yang memimpin perbincangan; seorang pengulas rasa bahagian itu kucar-kacir."
      id: "Esai dengan pertanyaan buatan sendiri, yang sangat disukai pengulas, plus presentasi tutorial yang memandu diskusi; satu pengulas merasa bagian itu kacau."
      hi: "ऐसे निबंध जिनमें आप अपना सवाल ख़ुद तय करते हैं, जो रिव्यूअर्स को बहुत पसंद आया, साथ में चर्चा शुरू करने वाला ट्यूटोरियल प्रेज़ेंटेशन; एक को वह हिस्सा अव्यवस्थित लगा।"
  watch:
    - en: "Reviews are mostly short and from 2023 or earlier, and one reviewer found some of the weekly films not to their taste."
      zh: "评价大多很短，都是 2023 年或更早的；有同学觉得有些每周放映的电影不合口味。"
      zh-TW: "評價大多很短，都是 2023 年或更早的；有同學覺得有些每週放映的電影不合口味。"
      ja: "レビューの多くは短く、すべて2023年以前のもの。毎週の映画の一部は好みに合わなかったという声も一つ。"
      ko: "리뷰 대부분이 짧고 2023년 이전 것이며, 매주 영화 중 일부는 취향이 아니었다는 리뷰어도 있다."
      vi: "Phần lớn đánh giá ngắn và từ 2023 trở về trước, và một người thấy vài phim hằng tuần không hợp gu."
      ms: "Ulasan kebanyakannya pendek dan dari 2023 atau lebih awal, dan seorang pengulas rasa sesetengah filem mingguan bukan citarasanya."
      id: "Ulasan sebagian besar singkat dan dari 2023 atau sebelumnya, dan satu pengulas merasa sebagian film mingguan tidak sesuai selera."
      hi: "रिव्यू ज़्यादातर छोटे और 2023 या पहले के हैं, और एक रिव्यूअर को हर हफ़्ते की कुछ फ़िल्में पसंद नहीं आईं।"
