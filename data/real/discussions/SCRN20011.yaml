points:
  - en: "Reviews from 2014 to 2023 are all positive: it traces Hollywood decade by decade with the theory and politics behind it."
    zh: "2014到2023年的评价全部正面：按年代梳理好莱坞，以及背后的理论和政治。"
    zh-TW: "2014到2023年的評價全部正面：按年代梳理好萊塢，以及背後的理論和政治。"
    ja: "2014〜2023年のレビューはすべて好意的。ハリウッドを10年ごとにたどり、その背後の理論と政治も扱う。"
    ko: "2014~2023년 리뷰는 모두 긍정적. 할리우드를 10년 단위로 따라가며 그 이면의 이론과 정치도 다룸."
    vi: "Đánh giá từ 2014 đến 2023 đều tích cực: đi qua Hollywood theo từng thập niên cùng lý thuyết và chính trị phía sau."
    ms: "Ulasan dari 2014 hingga 2023 semuanya positif: ia menjejak Hollywood dekad demi dekad bersama teori dan politik di sebaliknya."
    id: "Ulasan 2014-2023 semuanya positif: menelusuri Hollywood dekade demi dekade beserta teori dan politik di baliknya."
    hi: "2014 से 2023 तक के सभी रिव्यू सकारात्मक हैं: यह हॉलीवुड को दशक-दर-दशक, उसके पीछे की थ्योरी और राजनीति के साथ देखता है।"
  - en: "Students liked being able to write their own essay questions; one 2019 reviewer found the student-led tutorial presentations chaotic."
    zh: "学生喜欢可以自拟论文题目；一位2019年的评论者觉得学生主导的辅导课展示有些混乱。"
    zh-TW: "學生喜歡可以自擬論文題目；一位2019年的評論者覺得學生主導的輔導課報告有些混亂。"
    ja: "エッセイの問いを自分で立てられる点が好評。2019年のレビューでは学生主導のチュートリアル発表がやや混乱していたとのこと。"
    ko: "에세이 질문을 직접 만들 수 있는 점이 호평. 2019년 리뷰어는 학생 주도 튜토리얼 발표가 다소 혼란스러웠다고 함."
    vi: "Sinh viên thích được tự đặt đề luận; một người năm 2019 thấy phần thuyết trình do sinh viên dẫn dắt trong tutorial khá lộn xộn."
    ms: "Pelajar suka boleh menulis soalan esei sendiri; seorang pengulas 2019 dapati pembentangan tutorial yang dipimpin pelajar agak huru-hara."
    id: "Mahasiswa suka bisa membuat soal esai sendiri; pengulas 2019 merasa presentasi tutorial yang dipimpin mahasiswa agak kacau."
    hi: "छात्रों को अपने निबंध प्रश्न ख़ुद बनाने की छूट पसंद आई; 2019 के एक रिव्यूअर को छात्रों द्वारा चलाई गई ट्यूटोरियल प्रस्तुतियाँ अव्यवस्थित लगीं।"
