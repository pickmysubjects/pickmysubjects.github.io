    ja: "メインのプロジェクトはゲーム制作で、ほとんどの人が楽しくやりがいがあると感じています。バグ取りに時間がかかるので早めに始めましょう。"
    ko: "주요 프로젝트는 게임 만들기로, 대부분 재미있고 보람 있다고 했습니다. 버그 잡는 데 시간이 걸리니 일찍 시작하세요."
    vi: "Dự án chính là làm game, đa số thấy vui và đáng công. Hãy bắt đầu sớm vì sửa bug tốn thời gian."
    ms: "Projek utama ialah membina permainan, yang kebanyakan dapati seronok dan berbaloi. Mula awal kerana pepijat ambil masa."
    id: "Proyek utamanya membuat game, yang kebanyakan merasa seru dan memuaskan. Mulai lebih awal karena bug makan waktu."
    hi: "मुख्य प्रोजेक्ट एक गेम बनाना है, जो ज़्यादातर को मज़ेदार और संतोषजनक लगा। जल्दी शुरू करें, क्योंकि बग्स में समय लगता है।"
  - en: "The exam was not considered hard. Workshops can be finished quickly if you prepare beforehand."
    zh: "考试不算难；提前准备的话，工作坊可以很快完成。"
    zh-TW: "考試不算難；提前準備的話，工作坊可以很快完成。"
