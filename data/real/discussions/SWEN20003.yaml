    id: "Ujiannya tidak dianggap sulit. Workshop bisa cepat selesai kalau kamu menyiapkan diri sebelumnya."
    hi: "एग्ज़ाम कठिन नहीं माना गया। पहले से तैयारी करें तो वर्कशॉप्स जल्दी खत्म हो जाती हैं।"
