reviews: 9
from: 2018
to: 2022
checked: 2026-10-08
points:
  - en: "It is a solid introduction to object-oriented programming in Java and seen as useful for a computing career."
    zh: "用Java扎实入门面向对象编程，被认为对计算机职业有用。"
    zh-TW: "用Java紮實入門物件導向程式設計，被認為對資訊相關職涯有用。"
    ja: "Javaによるオブジェクト指向プログラミングのしっかりした入門で、IT系のキャリアに役立つとされています。"
    ko: "Java로 객체지향 프로그래밍을 탄탄하게 입문하는 과목이며, 컴퓨팅 진로에 유용하다고 평가됩니다."
    vi: "Là phần nhập môn vững chắc về lập trình hướng đối tượng bằng Java, được xem là hữu ích cho nghề IT."
    ms: "Pengenalan kukuh kepada pengaturcaraan berorientasikan objek dalam Java dan dianggap berguna untuk kerjaya pengkomputeran."
    id: "Pengantar yang solid ke pemrograman berorientasi objek dengan Java dan dianggap berguna untuk karier di bidang komputer."
    hi: "यह Java में ऑब्जेक्ट-ओरिएंटेड प्रोग्रामिंग का मज़बूत परिचय है और कंप्यूटिंग करियर के लिए उपयोगी माना जाता है।"
  - en: "The main project is building a game, which most found fun and rewarding. Start early, as bugs take time."
    zh: "主要项目是做游戏，多数人觉得有趣有成就感；要尽早开始，调试很费时。"
    zh-TW: "主要專題是做遊戲，多數人覺得有趣有成就感；要儘早開始，除錯很花時間。"
    ja: "メインのプロジェクトはゲーム制作で、ほとんどの人が楽しくやりがいがあると感じています。バグ取りに時間がかかるので早めに始めましょう。"
    ko: "주요 프로젝트는 게임 만들기로, 대부분 재미있고 보람 있다고 했습니다. 버그 잡는 데 시간이 걸리니 일찍 시작하세요."
    vi: "Dự án chính là làm game, đa số thấy vui và đáng công. Hãy bắt đầu sớm vì sửa bug tốn thời gian."
    ms: "Projek utama ialah membina permainan, yang kebanyakan dapati seronok dan berbaloi. Mula awal kerana pepijat ambil masa."
    id: "Proyek utamanya membuat game, yang kebanyakan merasa seru dan memuaskan. Mulai lebih awal karena bug makan waktu."
    hi: "मुख्य प्रोजेक्ट एक गेम बनाना है, जो ज़्यादातर को मज़ेदार और संतोषजनक लगा। जल्दी शुरू करें, क्योंकि बग्स में समय लगता है।"
  - en: "The exam was not considered hard. Workshops can be finished quickly if you prepare beforehand."
    zh: "考试不算难；提前准备的话，工作坊可以很快完成。"
    zh-TW: "考試不算難；提前準備的話，工作坊可以很快完成。"
    ja: "試験は難しくないとされています。事前に準備すればワークショップはすぐに終わります。"
    ko: "시험은 어렵지 않다는 평입니다. 미리 준비하면 워크숍은 금방 끝낼 수 있습니다."
    vi: "Bài thi không bị coi là khó. Nếu chuẩn bị trước, workshop có thể làm xong nhanh."
    ms: "Peperiksaan tidak dianggap sukar. Bengkel boleh disiapkan dengan cepat jika anda bersedia lebih awal."
    id: "Ujiannya tidak dianggap sulit. Workshop bisa cepat selesai kalau kamu menyiapkan diri sebelumnya."
    hi: "एग्ज़ाम कठिन नहीं माना गया। पहले से तैयारी करें तो वर्कशॉप्स जल्दी खत्म हो जाती हैं।"
sections:
  content:
    - en: "An intro to object-oriented design in Java that most reviewers enjoyed and found useful for industry. Not especially hard; UML is the part people find dull."
      zh: "用 Java 入门面向对象设计，多数同学喜欢，觉得对工作有用。不算特别难；UML 是大家觉得最无聊的部分。"
      zh-TW: "用 Java 入門物件導向設計，多數同學喜歡，覺得對業界有用。不算特別難；UML 是大家覺得最無聊的部分。"
      ja: "Javaによるオブジェクト指向設計の入門で、多くが楽しく実務に役立つと評価。特に難しくはなく、退屈なのはUMLの部分。"
      ko: "Java로 배우는 객체지향 설계 입문으로 대부분 재미있고 실무에 유용하다고 했다. 특별히 어렵진 않고, UML이 지루한 부분이다."
      vi: "Nhập môn thiết kế hướng đối tượng bằng Java, đa số thích và thấy hữu ích cho công việc. Không quá khó; UML là phần bị coi là chán."
      ms: "Pengenalan reka bentuk berorientasikan objek dalam Java yang kebanyakan pengulas suka dan rasa berguna untuk industri. Tidak terlalu sukar; UML bahagian yang membosankan."
      id: "Pengantar desain berorientasi objek dengan Java yang disukai kebanyakan pengulas dan dianggap berguna untuk industri. Tidak terlalu sulit; UML bagian yang membosankan."
      hi: "Java में ऑब्जेक्ट-ओरिएंटेड डिज़ाइन का परिचय, जो ज़्यादातर रिव्यूअर्स को पसंद आया और इंडस्ट्री के लिए उपयोगी लगा। ख़ास कठिन नहीं; UML उबाऊ हिस्सा माना गया।"
  work:
    - en: "The project is building a game with a graphics library, which most found fun and rewarding but bug-prone. One reviewer found the exam not hard."
      zh: "大作业是用图形库做一个游戏，多数人觉得好玩、有成就感，但 bug 不少。有同学觉得考试不难。"
      zh-TW: "大作業是用圖形函式庫做一個遊戲，多數人覺得好玩、有成就感，但 bug 不少。有同學覺得考試不難。"
      ja: "プロジェクトはグラフィックライブラリでゲームを作るもので、多くが楽しくやりがいがあると評価。ただしバグは出やすい。試験は難しくなかったという声も一つ。"
      ko: "프로젝트는 그래픽 라이브러리로 게임을 만드는 것으로, 대부분 재미있고 보람 있지만 버그가 많다고 했다. 시험은 어렵지 않았다는 리뷰어도 있다."
      vi: "Project là làm một trò chơi bằng thư viện đồ họa, đa số thấy vui và đáng công nhưng dễ dính lỗi. Một người thấy bài thi không khó."
      ms: "Projeknya membina permainan dengan pustaka grafik, kebanyakan rasa seronok dan berbaloi tetapi mudah ada pepijat. Seorang pengulas rasa peperiksaan tidak sukar."
      id: "Proyeknya membuat game dengan library grafis, kebanyakan merasa seru dan memuaskan tapi rawan bug. Satu pengulas merasa ujiannya tidak sulit."
      hi: "प्रोजेक्ट में ग्राफ़िक्स लाइब्रेरी से एक गेम बनाना होता है, जो ज़्यादातर को मज़ेदार और संतोषजनक लगा पर बग बहुत आते हैं। एक रिव्यूअर को परीक्षा कठिन नहीं लगी।"
  study:
    - en: "Start the project early. Workshops are worksheets; one reviewer says you can do them beforehand and leave once they are marked."
      zh: "大作业早点开始。workshop 就是做练习；有同学说可以提前做好，批改完就能走。"
      zh-TW: "大作業早點開始。workshop 就是做練習；有同學說可以先做好，批改完就能走。"
      ja: "プロジェクトは早めに始める。ワークショップは演習で、事前に済ませれば採点後に帰れるという声も一つ。"
      ko: "프로젝트는 일찍 시작하라. 워크숍은 워크시트를 푸는 시간이라 미리 해 가면 채점받고 바로 갈 수 있다는 리뷰도 있다."
      vi: "Bắt đầu project sớm. Workshop là làm bài tập; một người nói có thể làm trước và về khi được chấm xong."
      ms: "Mula projek awal. Bengkel ialah lembaran kerja; seorang pengulas kata boleh siapkan lebih awal dan pulang selepas ditanda."
      id: "Mulai proyek lebih awal. Workshop berupa lembar kerja; satu pengulas bilang bisa dikerjakan duluan dan pulang setelah dinilai."
      hi: "प्रोजेक्ट जल्दी शुरू करें। वर्कशॉप में वर्कशीट होती हैं; एक रिव्यूअर के अनुसार पहले से करके जाँच करवाकर निकल सकते हैं।"
  watch:
    - en: "Some found the pacing uneven, with easy topics given too long and the end of semester dry. One 2021 reviewer found assessment instructions unclear and scattered."
      zh: "有人觉得节奏不均，简单话题讲太久，学期末比较枯燥。2021 年有同学觉得作业说明不清楚、信息很分散。"
      zh-TW: "有人覺得節奏不均，簡單主題講太久，學期末比較枯燥。2021 年有同學覺得作業說明不清楚、資訊很分散。"
      ja: "ペース配分が偏っていて簡単な内容に時間をかけすぎ、学期末は退屈という声も。2021年には課題の説明が不明確で情報が散らばっていたという声。"
      ko: "진도가 고르지 않아 쉬운 주제에 시간을 너무 쓰고 학기 말은 지루하다는 의견도 있다. 2021년엔 과제 안내가 불분명하고 흩어져 있었다는 리뷰가 있다."
      vi: "Có người thấy nhịp độ không đều, chủ đề dễ học quá lâu, cuối kỳ khô khan. Một người năm 2021 thấy hướng dẫn bài tập không rõ và rải rác."
      ms: "Ada yang rasa rentak tidak sekata, topik mudah diberi masa terlalu lama dan hujung semester hambar. Seorang pengulas 2021 rasa arahan tugasan tidak jelas dan berselerak."
      id: "Ada yang merasa temponya tidak rata, topik mudah dibahas terlalu lama dan akhir semester membosankan. Satu pengulas 2021 merasa instruksi tugas tidak jelas dan tersebar."
      hi: "कुछ को रफ़्तार असमान लगी, आसान टॉपिक पर ज़्यादा समय और सेमेस्टर का अंत नीरस। 2021 के एक रिव्यूअर को असाइनमेंट निर्देश अस्पष्ट और बिखरे लगे।"
workload: heavy
difficulty: easy
