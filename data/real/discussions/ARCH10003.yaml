reviews: 5
from: 2018
to: 2023
checked: 2026-10-19
points:
  - en: "Workload is the main complaint: several said the studio took over their nights and weekends, far more than a first-year subject should."
    zh: "工作量是主要抱怨：多人说这门工作室占满了夜晚和周末，远超一年级课程该有的量。"
    zh-TW: "工作量是主要抱怨：很多人說這門工作室佔滿了晚上和週末，遠超一年級課該有的量。"
    ja: "一番の不満は作業量。夜や週末まで潰れ、1年生の科目としては多すぎるという声が複数あった。"
    ko: "가장 큰 불만은 작업량. 밤과 주말까지 다 쓰게 되어 1학년 과목치고 너무 많다는 의견이 여럿."
    vi: "Khối lượng việc là phàn nàn chính: nhiều người nói studio chiếm hết buổi tối và cuối tuần, quá nhiều cho môn năm nhất."
    ms: "Beban kerja ialah aduan utama: beberapa orang kata studio ini mengambil malam dan hujung minggu, terlalu banyak untuk subjek tahun satu."
    id: "Beban kerja jadi keluhan utama: beberapa orang bilang studio ini menyita malam dan akhir pekan, terlalu berat untuk mata kuliah tahun pertama."
    hi: "सबसे बड़ी शिकायत काम का बोझ है: कई लोगों ने कहा स्टूडियो ने रातें और वीकेंड ले लिए, पहले साल के विषय के लिए बहुत ज़्यादा।"
  - en: "Briefs and marking were often called vague and subjective, with different tutors giving different advice."
    zh: "任务说明和评分常被认为含糊且主观，不同导师给的建议也不一样。"
    zh-TW: "作業說明和評分常被認為含糊又主觀，不同助教給的建議也不一樣。"
    ja: "課題の説明と採点はあいまいで主観的だとよく言われ、チューターによって助言も違った。"
    ko: "과제 설명과 채점이 모호하고 주관적이라는 평이 많았고, 튜터마다 조언도 달랐음."
    vi: "Đề bài và cách chấm thường bị cho là mơ hồ, chủ quan, mỗi tutor lại khuyên một kiểu."
    ms: "Taklimat dan pemarkahan sering dikatakan kabur dan subjektif, dan tutor berbeza memberi nasihat berbeza."
    id: "Brief dan penilaian sering disebut kabur dan subjektif, dan tiap tutor memberi saran berbeda."
    hi: "ब्रीफ़ और मार्किंग को अक्सर अस्पष्ट और व्यक्तिपरक बताया गया, और अलग ट्यूटर अलग सलाह देते थे।"
  - en: "Students who already sketch, model and use Rhino found it much easier; others learned a lot but had to work hard to catch up."
    zh: "已经会手绘、做模型和用Rhino的学生轻松很多；其他人收获不少，但要拼命追赶。"
    zh-TW: "已經會手繪、做模型和用 Rhino 的學生輕鬆很多；其他人收穫不少，但要拼命追趕。"
    ja: "スケッチ・模型・Rhinoに慣れた人はかなり楽。そうでない人も多くを学べるが、追いつくのに苦労する。"
    ko: "스케치·모형·Rhino에 익숙하면 훨씬 수월함. 그렇지 않으면 배우는 건 많지만 따라잡느라 고생함."
    vi: "Ai đã biết phác thảo, làm mô hình và dùng Rhino thấy dễ hơn nhiều; người khác học được nhiều nhưng phải cố gắng bắt kịp."
    ms: "Pelajar yang sudah pandai melakar, membuat model dan guna Rhino rasa lebih mudah; yang lain belajar banyak tetapi perlu bekerja keras."
    id: "Yang sudah bisa sketsa, membuat maket, dan memakai Rhino merasa jauh lebih mudah; yang lain belajar banyak tapi harus kerja keras mengejar."
    hi: "जो पहले से स्केच, मॉडल और Rhino जानते थे उन्हें आसान लगा; बाकी ने बहुत सीखा पर पकड़ने में मेहनत लगी।"
sections:
  content:
    - en: "A first architecture studio with lecture ideas you apply in studio. Reviewers are split: some found it well planned and engaging, others vague and confusing, with briefs and lectures that feel pretentious."
      zh: "第一门建筑设计工作室课，把讲课里的概念用到工作室作业中。评价两极：有人觉得规划好、有意思，也有人觉得模糊混乱，任务书和讲课有点故作高深。"
      zh-TW: "第一門建築設計工作室課，把講課裡的概念用到工作室作業中。評價兩極：有人覺得規劃好、有意思，也有人覺得模糊混亂，任務書和講課有點故作高深。"
      ja: "最初の建築スタジオで、講義の考え方をスタジオで応用する。よく計画され面白いという人と、あいまいで混乱し課題文や講義が気取っているという人に分かれる。"
      ko: "첫 건축 스튜디오로 강의 개념을 스튜디오 작업에 적용한다. 잘 기획되고 흥미롭다는 평과, 모호하고 혼란스러우며 과제와 강의가 허세스럽다는 평이 갈린다."
      vi: "Studio kiến trúc đầu tiên, áp dụng ý từ bài giảng vào studio. Ý kiến chia: có người thấy chuẩn bị tốt, hấp dẫn; người khác thấy mơ hồ, rối, đề bài và bài giảng hơi màu mè."
      ms: "Studio seni bina pertama yang mengaplikasi idea kuliah dalam studio. Pandangan berbelah: ada yang rasa dirancang baik dan menarik, ada yang rasa kabur dan mengelirukan, dengan taklimat dan kuliah yang berlagak."
      id: "Studio arsitektur pertama yang menerapkan gagasan kuliah di studio. Pendapat terbelah: ada yang merasa terencana dan menarik, ada yang merasa samar dan membingungkan, dengan brief dan kuliah yang terkesan sok."
      hi: "पहला आर्किटेक्चर स्टूडियो, जिसमें लेक्चर के विचार स्टूडियो में लागू होते हैं। राय बँटी है: कुछ को सुनियोजित और दिलचस्प, कुछ को अस्पष्ट और उलझाऊ लगा, ब्रीफ़ और लेक्चर दिखावटी।"
  work:
    - en: "The workload is very heavy; two reviewers describe losing sleep, and say an H1 is hard without strong sketching, Rhino and modelling skills. Some found marking vague and subjective."
      zh: "工作量非常大；两位同学说为此熬夜，没有扎实的手绘、Rhino 和模型功底很难拿 H1。也有人觉得评分模糊、主观。"
      zh-TW: "工作量非常大；兩位同學說為此熬夜，沒有紮實的手繪、Rhino 和模型功底很難拿 H1。也有人覺得評分模糊、主觀。"
      ja: "負担は非常に重く、睡眠を削ったという人が二人。スケッチ、Rhino、模型の技術がないとH1は難しいという。採点があいまいで主観的という声も。"
      ko: "작업량이 매우 많아 두 리뷰는 잠을 줄였다고 하며, 스케치·Rhino·모형 실력이 없으면 H1이 어렵다고 한다. 채점이 모호하고 주관적이라는 평도 있다."
      vi: "Khối lượng rất nặng; hai người kể phải thức khuya, và nói khó đạt H1 nếu không giỏi phác thảo, Rhino và làm mô hình. Vài người thấy chấm mơ hồ, chủ quan."
      ms: "Beban kerja sangat berat; dua pengulas kata kurang tidur, dan H1 sukar tanpa kemahiran lakaran, Rhino dan model yang kukuh. Ada yang rasa pemarkahan kabur dan subjektif."
      id: "Beban kerjanya sangat berat; dua pengulas bilang kurang tidur, dan H1 sulit tanpa keterampilan sketsa, Rhino dan maket yang kuat. Sebagian merasa penilaian samar dan subjektif."
      hi: "काम का बोझ बहुत भारी है; दो रिव्यूअर्स नींद गँवाने की बात कहते हैं, और कहते हैं मज़बूत स्केचिंग, Rhino और मॉडलिंग कौशल के बिना H1 कठिन है। कुछ को जाँच अस्पष्ट और व्यक्तिपरक लगी।"
  watch:
    - en: "One reviewer advises against taking it as a breadth outside the Bachelor of Design. Asking questions helps with the vague briefs."
      zh: "有同学建议非设计学士的学生别把它当 breadth 选。任务书模糊时多问会有帮助。"
      zh-TW: "有同學建議非設計學士的學生別把它當 breadth 修。任務書模糊時多問會有幫助。"
      ja: "デザイン学士以外の人はブレドスで取らない方がいいという人も。課題文があいまいなときは質問すると助かる。"
      ko: "디자인 학사가 아니면 브레드스로 듣지 말라는 리뷰가 있다. 과제 설명이 모호할 땐 질문하면 도움이 된다."
      vi: "Một người khuyên không nên học làm môn breadth nếu không thuộc Bachelor of Design. Hỏi nhiều sẽ giúp với đề bài mơ hồ."
      ms: "Seorang nasihat jangan ambil sebagai breadth di luar Bachelor of Design. Bertanya membantu dengan taklimat yang kabur."
      id: "Satu menyarankan jangan ambil sebagai breadth di luar Bachelor of Design. Bertanya membantu menghadapi brief yang samar."
      hi: "एक रिव्यूअर Bachelor of Design के बाहर इसे ब्रेड्थ के रूप में न लेने की सलाह देता है। अस्पष्ट ब्रीफ़ में सवाल पूछना मदद करता है।"
workload: heavy
difficulty: hard
