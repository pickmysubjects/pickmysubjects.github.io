points:
  - en: "Widely praised as a fascinating breadth subject that needs no physics or maths background."
    zh: "普遍好评，内容有趣，适合作为通识选修，不需要物理或数学基础。"
  - en: "The pracs are computer-based tasks rather than hands-on work. Some found them dull, and marking depended on the demonstrator."
    zh: "实验课是电脑上的分析任务而非动手操作，有人觉得枯燥，评分松紧取决于助教。"
  - en: "The mid-semester test and exam are open book but include application questions that some found surprisingly hard. The test has been scaled."
    zh: "期中和期末为开卷，但有应用题，部分人觉得出乎意料地难，期中测验曾被调分。"
  - en: "Physics and maths students may find it too light; one reviewer suggested the third-year astrophysics subject instead."
    zh: "物理或数学专业的学生可能觉得太浅，有评价建议改修三年级的天体物理课。"
