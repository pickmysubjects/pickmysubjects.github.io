code: PHYC10008
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/phyc10008
reviews: 10
from: 2018
to: 2025
checked: 2026-10-08
points:
  - en: "Widely praised as a fascinating breadth subject that needs no physics or maths background."
    zh: "普遍好评，内容有趣，适合作为通识选修，不需要物理或数学基础。"
    zh-TW: "普遍好評，內容有趣，適合作為Breadth選修，不需要物理或數學基礎。"
    ja: "物理や数学の予備知識が不要な、とても面白いBreadth科目として広く好評です。"
    ko: "물리나 수학 배경이 필요 없는 아주 흥미로운 Breadth 과목으로 널리 호평받습니다."
    vi: "Được khen rộng rãi là môn Breadth rất thú vị, không cần nền tảng vật lý hay toán."
    ms: "Dipuji ramai sebagai subjek Breadth yang menarik tanpa perlu latar fizik atau matematik."
    id: "Banyak dipuji sebagai mata kuliah Breadth yang menarik tanpa perlu latar fisika atau matematika."
    hi: "इसे बहुत दिलचस्प Breadth सब्जेक्ट माना जाता है, जिसके लिए फिज़िक्स या मैथ्स बैकग्राउंड ज़रूरी नहीं।"
  - en: "The pracs are computer-based tasks rather than hands-on work. Some found them dull, and marking depended on the demonstrator."
    zh: "实验课是电脑上的分析任务而非动手操作，有人觉得枯燥，评分松紧取决于助教。"
    zh-TW: "實驗課是電腦上的任務而非動手操作，有人覺得枯燥，評分取決於助教。"
    ja: "実習は手を動かす作業ではなくパソコン上の課題です。退屈だと感じた人もおり、採点はデモンストレーター次第でした。"
    ko: "실습은 직접 하는 실험이 아니라 컴퓨터 과제입니다. 지루하다는 사람도 있고 채점은 조교에 따라 달랐습니다."
    vi: "Thực hành là bài làm trên máy tính chứ không phải thao tác tay. Có người thấy chán, và điểm phụ thuộc người hướng dẫn."
    ms: "Amali ialah tugasan berasaskan komputer, bukan kerja tangan. Ada yang rasa bosan, dan markah bergantung pada demonstrator."
    id: "Praktikumnya tugas di komputer, bukan kerja langsung. Ada yang merasa bosan, dan nilai tergantung asisten lab."
    hi: "प्रैक्टिकल्स हाथ से करने के बजाय कंप्यूटर पर किए जाने वाले टास्क हैं। कुछ को ये बोरिंग लगे, और मार्किंग डेमोंस्ट्रेटर पर निर्भर थी।"
  - en: "The mid-semester test and exam are open book but include application questions that some found surprisingly hard. The test has been scaled."
    zh: "期中和期末为开卷，但有应用题，部分人觉得出乎意料地难，期中测验曾被调分。"
    zh-TW: "期中和期末為開書考，但有應用題，部分人覺得出乎意料地難，期中測驗曾被調分。"
    ja: "中間テストと期末試験は持ち込み可ですが、応用問題があり、意外に難しいと感じた人もいます。テストは得点調整されたことがあります。"
    ko: "중간시험과 기말시험은 오픈북이지만 응용 문제가 있어 의외로 어렵다는 사람도 있었습니다. 시험은 점수 조정이 된 적이 있습니다."
    vi: "Bài kiểm tra giữa kỳ và thi cuối kỳ được mở tài liệu nhưng có câu vận dụng mà một số người thấy khó bất ngờ. Bài kiểm tra từng được scale điểm."
    ms: "Ujian pertengahan semester dan peperiksaan ialah buku terbuka tetapi ada soalan aplikasi yang sesetengah dapati sukar. Ujian pernah diskala."
    id: "UTS dan ujian akhir open book, tapi ada soal penerapan yang menurut sebagian orang ternyata sulit. Nilai tesnya pernah di-scale."
    hi: "मिड-सेमेस्टर टेस्ट और एग्ज़ाम ओपन बुक हैं, पर एप्लिकेशन सवाल आते हैं जो कुछ को अचानक कठिन लगे। टेस्ट को स्केल किया गया है।"
  - en: "Physics and maths students may find it too light; one reviewer suggested the third-year astrophysics subject instead."
    zh: "物理或数学专业的学生可能觉得太浅，有评价建议改修三年级的天体物理课。"
    zh-TW: "物理或數學系的學生可能覺得太淺，有評價建議改修三年級的天文物理課。"
    ja: "物理や数学の学生には物足りないかもしれません。代わりに3年次の天体物理学の科目を勧めたレビューもあります。"
    ko: "물리·수학 전공생에게는 너무 쉬울 수 있습니다. 한 후기는 대신 3학년 천체물리 과목을 추천했습니다."
    vi: "Sinh viên vật lý và toán có thể thấy quá nhẹ; một người gợi ý học môn vật lý thiên văn năm 3 thay thế."
    ms: "Pelajar fizik dan matematik mungkin rasa terlalu ringan; seorang pengulas cadangkan subjek astrofizik tahun tiga sebagai ganti."
    id: "Mahasiswa fisika dan matematika mungkin merasa terlalu ringan; satu pengulas menyarankan mata kuliah astrofisika tahun ketiga."
    hi: "फिज़िक्स और मैथ्स स्टूडेंट्स को यह बहुत हल्का लग सकता है; एक रिव्यूअर ने इसके बजाय थर्ड ईयर एस्ट्रोफिज़िक्स सब्जेक्ट सुझाया।"
sections:
  content:
    - en: "Astronomy from planets and stars to galaxies, relativity, black holes and dark matter. Most found it fascinating and accessible with no physics background; little maths is needed."
      zh: "天文学，从行星、恒星到星系、相对论、黑洞和暗物质。多数人觉得很有意思，没有物理基础也能学；数学很少。"
      zh-TW: "天文學，從行星、恆星到星系、相對論、黑洞和暗物質。多數人覺得很有趣，沒有物理基礎也能學；數學很少。"
      ja: "惑星や恒星から銀河、相対論、ブラックホール、ダークマターまでの天文学。物理の背景がなくても面白く取り組めるという声が多い。数学はわずか。"
      ko: "행성과 별부터 은하, 상대성이론, 블랙홀, 암흑물질까지 다루는 천문학이다. 물리 배경 없이도 흥미롭고 접근하기 쉽다는 의견이 많다. 수학은 거의 없다."
      vi: "Thiên văn học từ hành tinh, sao đến thiên hà, thuyết tương đối, hố đen và vật chất tối. Đa số thấy cuốn hút và dễ tiếp cận dù không có nền vật lý; rất ít toán."
      ms: "Astronomi dari planet dan bintang hingga galaksi, relativiti, lubang hitam dan jirim gelap. Kebanyakan rasa menarik dan mudah diikuti tanpa latar fizik; sedikit matematik."
      id: "Astronomi dari planet dan bintang sampai galaksi, relativitas, lubang hitam dan materi gelap. Kebanyakan merasa memukau dan mudah diikuti tanpa latar fisika; sedikit matematika."
      hi: "ग्रहों और तारों से लेकर आकाशगंगाओं, सापेक्षता, ब्लैक होल और डार्क मैटर तक खगोल विज्ञान। ज़्यादातर को यह रोचक और बिना भौतिकी बैकग्राउंड के सुलभ लगा; गणित बहुत कम।"
    - en: "Physics and maths students may find it watered down; one reviewer says it doesn't show what the physics major is like, and another found topic order messy."
      zh: "物理和数学专业的同学可能会觉得太浅；有人说它不能代表物理专业是什么样，也有人觉得主题顺序很乱。"
      zh-TW: "物理和數學主修的同學可能會覺得太淺；有人說它不能代表物理主修是什麼樣，也有人覺得主題順序很亂。"
      ja: "物理・数学の学生には物足りないかも。物理専攻の雰囲気は分からないという人や、トピックの順序がバラバラだという人も。"
      ko: "물리·수학 전공생에겐 너무 쉬울 수 있다. 물리 전공이 어떤지는 알 수 없다는 사람, 주제 순서가 엉성하다는 사람도 있다."
      vi: "Sinh viên vật lý và toán có thể thấy quá nhẹ; một người nói nó không cho thấy chuyên ngành vật lý thế nào, người khác thấy thứ tự chủ đề lộn xộn."
      ms: "Pelajar fizik dan matematik mungkin rasa ia terlalu ringan; seorang kata ia tidak tunjuk rupa major fizik, seorang lagi rasa susunan topik bercelaru."
      id: "Mahasiswa fisika dan matematika mungkin merasa terlalu ringan; satu bilang ini tidak menggambarkan jurusan fisika, yang lain merasa urutan topiknya berantakan."
      hi: "भौतिकी और गणित के छात्रों को यह हल्का लग सकता है; एक के अनुसार यह भौतिकी मेजर जैसा नहीं दिखाता, दूसरे को टॉपिक का क्रम गड़बड़ लगा।"
  work:
    - en: "Pracs are theoretical, like working with astronomical images, and often finish early; marking depends on your demonstrator. The MST is only 10% but some found it poorly written and it was scaled."
      zh: "实验偏理论，比如处理天文图像，常常提前做完；给分看 demonstrator。MST 只占 10%，但有人觉得出得不好，后来做了 scale。"
      zh-TW: "實驗偏理論，例如處理天文影像，常常提前做完；給分看 demonstrator。MST 只占 10%，但有人覺得出得不好，後來有調分。"
      ja: "実習は天文画像の処理など理論的なもので、早めに終わることが多い。採点はデモンストレーター次第。MSTは10%だけだが出来が悪く、スケーリングされたという人も。"
      ko: "실습은 천문 이미지 처리 같은 이론형이고 일찍 끝나는 경우가 많다. 채점은 데몬스트레이터에 달렸다. MST는 10%뿐이지만 문제가 엉성해 스케일링됐다는 사람도 있다."
      vi: "Thực hành mang tính lý thuyết, như xử lý ảnh thiên văn, thường xong sớm; điểm tùy demonstrator. MST chỉ 10% nhưng có người thấy đề ra kém và đã được scale."
      ms: "Amali bersifat teori, seperti mengolah imej astronomi, dan selalunya habis awal; markah bergantung pada demonstrator. MST hanya 10% tetapi ada yang rasa ia ditulis kurang baik dan telah diskala."
      id: "Praktikumnya teoretis, seperti mengolah citra astronomi, dan sering selesai lebih awal; nilai tergantung demonstrator. MST hanya 10% tapi ada yang merasa soalnya buruk dan diskalakan."
      hi: "प्रैक्टिकल सैद्धांतिक हैं, जैसे खगोलीय चित्रों पर काम, और अक्सर जल्दी ख़त्म होते हैं; अंक डेमॉन्स्ट्रेटर पर निर्भर। MST सिर्फ़ 10% है पर कुछ को यह ख़राब बना लगा और इसे स्केल किया गया।"
    - en: "Most found the exam fair with plenty of practice exams; a couple say the application questions were harder than expected."
      zh: "多数人觉得期末公平，练习卷也很多；有一两位说应用题比预想的难。"
      zh-TW: "多數人覺得期末公平，練習卷也很多；有一兩位說應用題比預想的難。"
      ja: "期末は公平で練習試験も豊富という声が多い。応用問題が予想より難しかったという人も数人。"
      ko: "기말은 대체로 공정하고 연습 시험도 많다. 응용 문제가 예상보다 어려웠다는 사람도 몇 있다."
      vi: "Đa số thấy bài thi công bằng, có nhiều đề luyện tập; vài người nói câu ứng dụng khó hơn dự kiến."
      ms: "Kebanyakan rasa peperiksaan adil dengan banyak peperiksaan latihan; beberapa kata soalan aplikasi lebih sukar daripada dijangka."
      id: "Kebanyakan merasa ujian adil dengan banyak ujian latihan; beberapa bilang soal aplikasinya lebih sulit dari dugaan."
      hi: "ज़्यादातर को परीक्षा उचित लगी और प्रैक्टिस परीक्षाएँ बहुत हैं; कुछ कहते हैं अनुप्रयोग वाले सवाल उम्मीद से कठिन थे।"
  study:
    - en: "Look over prac questions before class; one reviewer says lectures follow the textbook closely, so it is a good fallback."
      zh: "上实验课前先看题；有同学说讲座基本照教材讲，听不懂可以看教材。"
      zh-TW: "上實驗課前先看題；有同學說講座基本照課本講，聽不懂可以看課本。"
      ja: "実習の問題は授業前に目を通す。講義はほぼ教科書通りなので、教科書が頼りになるという人も。"
      ko: "실습 문제는 수업 전에 훑어봐라. 강의가 교재를 거의 그대로 따르니 교재로 보충하면 된다는 사람도 있다."
      vi: "Xem trước câu hỏi thực hành; một người nói bài giảng bám sát giáo trình nên có thể dựa vào sách."
      ms: "Semak soalan amali sebelum kelas; seorang pengulas kata kuliah mengikut buku teks rapat, jadi ia sandaran yang baik."
      id: "Lihat soal praktikum sebelum kelas; satu pengulas bilang kuliah mengikuti buku teks, jadi buku bisa jadi andalan."
      hi: "क्लास से पहले प्रैक्टिकल सवाल देख लें; एक के अनुसार लेक्चर पाठ्यपुस्तक के क़रीब चलते हैं, तो वह अच्छा सहारा है।"
difficulty: mixed
