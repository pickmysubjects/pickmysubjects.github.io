points:
  - en: "All three reviewers from 2025 and 2026 rated it highly: clearly organised, with engaging lectures and plenty of resources."
    zh: "2025和2026年的三位评论者评价都很高：结构清晰，讲课吸引人，资料也很充足。"
    zh-TW: "2025和2026年的三位評論者評價都很高：結構清晰，講課吸引人，資料也很充足。"
    ja: "2025年と2026年のレビュー3件はいずれも高評価。構成が分かりやすく、講義も面白く、資料も豊富。"
    ko: "2025년과 2026년 리뷰 3개 모두 높은 평가. 구성이 명확하고 강의가 흥미로우며 자료도 넉넉함."
    vi: "Cả ba người đánh giá năm 2025 và 2026 đều khen: tổ chức rõ ràng, bài giảng cuốn hút, tài liệu đầy đủ."
    ms: "Ketiga-tiga pengulas pada 2025 dan 2026 memberi penilaian tinggi: tersusun jelas, kuliah menarik dan bahan yang banyak."
    id: "Ketiga pengulas di 2025 dan 2026 menilainya tinggi: tertata jelas, kuliah menarik, dan materinya banyak."
    hi: "2025 और 2026 के तीनों रिव्यूअर्स ने इसे बहुत पसंद किया: साफ़-सुथरा ढाँचा, दिलचस्प लेक्चर और भरपूर सामग्री।"
  - en: "It starts with the basic tools of conversation analysis, then applies them to settings like teaching, law, medicine and journalism; you pick which area to write about."
    zh: "课程先讲会话分析的基本方法，再应用到教学、法律、医疗、新闻等场景；作业可以自选感兴趣的领域来写。"
    zh-TW: "課程先講會話分析的基本方法，再應用到教學、法律、醫療、新聞等場景；作業可以自選感興趣的領域來寫。"
    ja: "まず会話分析の基本的な手法を学び、それを教育・法律・医療・報道などの場面に当てはめる。課題はどの分野で書くか自分で選べる。"
    ko: "먼저 대화 분석의 기본 도구를 배우고, 이를 교육·법·의료·언론 같은 현장에 적용함. 과제는 원하는 분야를 골라 쓸 수 있음."
    vi: "Môn bắt đầu với công cụ cơ bản của phân tích hội thoại, rồi áp dụng vào giảng dạy, luật, y tế, báo chí; bài viết được tự chọn lĩnh vực."
    ms: "Ia bermula dengan alat asas analisis perbualan, kemudian menerapkannya dalam bidang seperti pengajaran, undang-undang, perubatan dan kewartawanan; anda pilih bidang untuk ditulis."
    id: "Dimulai dengan alat dasar analisis percakapan, lalu diterapkan ke bidang seperti pengajaran, hukum, kedokteran, dan jurnalistik; kamu memilih bidang yang ingin ditulis."
    hi: "शुरुआत बातचीत के विश्लेषण (conversation analysis) के बुनियादी तरीकों से होती है, फिर उन्हें पढ़ाने, क़ानून, चिकित्सा और पत्रकारिता जैसे क्षेत्रों में लागू किया जाता है; किस क्षेत्र पर लिखना है, यह आप चुनते हैं।"
  - en: "Quizzes are easy if you follow the lectures and marking felt fair, but averages were high, so a top grade needs near-full quiz marks. The 2025 summer intensive ran two hours a day for two weeks."
    zh: "只要跟上讲课，小测都很好拿分，评分也公平；但班级平均分很高，想拿顶尖成绩小测要接近满分。有一位上的是暑期密集版：两周内每天两小时课。"
    zh-TW: "只要跟上講課，小考都很好拿分，評分也公平；但班級平均分很高，想拿頂尖成績小考要接近滿分。有一位上的是暑期密集版：兩週內每天兩小時課。"
    ja: "講義についていけば小テストは十分こなせ、採点も公正。ただしクラス平均が高いので、最高評価にはほぼ満点が必要。1人は夏の集中版を受講し、2週間毎日2時間の授業だった。"
    ko: "강의만 따라가면 퀴즈는 무난하고 채점도 공정함. 다만 반 평균이 높아서 최고 등급을 받으려면 퀴즈 거의 만점이 필요함. 한 명은 여름 집중 과정으로 2주간 매일 2시간 수업을 들음."
    vi: "Quiz rất dễ nếu theo kịp bài giảng, chấm điểm công bằng, nhưng điểm trung bình lớp cao nên muốn điểm cao nhất cần gần tuyệt đối quiz. Một người học bản hè cấp tốc: mỗi ngày 2 giờ trong 2 tuần."
    ms: "Kuiz mudah diurus jika anda ikut kuliah dan pemarkahan terasa adil, tetapi purata kelas tinggi, jadi gred tertinggi perlukan markah kuiz hampir penuh. Seorang mengambil versi intensif musim panas: dua jam kelas sehari selama dua minggu."
    id: "Kuis cukup mudah kalau mengikuti kuliah dan penilaiannya adil, tapi rata-rata kelas tinggi, jadi nilai tertinggi butuh skor kuis hampir penuh. Satu pengulas ikut versi intensif musim panas: dua jam kelas per hari selama dua minggu."
    hi: "लेक्चर फ़ॉलो करें तो क्विज़ आसान हैं और मार्किंग निष्पक्ष लगी, पर क्लास का औसत ऊँचा था, इसलिए टॉप ग्रेड के लिए क्विज़ में लगभग पूरे अंक चाहिए। एक रिव्यूअर ने गर्मियों का इंटेंसिव वर्ज़न लिया: दो हफ़्ते तक रोज़ दो घंटे की क्लास।"
difficulty: easy
