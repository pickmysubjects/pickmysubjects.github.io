points:
  - en: "This is a compulsory pass/fail subject. Most say minimal effort is enough to pass."
    zh: "必修的通过/不通过课程，多数人说投入很少即可通过。"
    zh-TW: "必修的通過/不通過科目，多數人說投入很少即可通過。"
    ja: "必修の合否判定のみの科目です。最低限の努力で合格できるという人がほとんどです。"
    ko: "필수 Pass/Fail 과목입니다. 대부분 최소한의 노력으로 통과할 수 있다고 합니다."
    vi: "Đây là môn bắt buộc chỉ tính đạt/không đạt. Đa số nói bỏ ít công sức là qua."
    ms: "Ini subjek wajib lulus/gagal. Kebanyakan kata usaha minimum sudah cukup untuk lulus."
    id: "Ini mata kuliah wajib lulus/tidak lulus. Kebanyakan bilang usaha minimal sudah cukup untuk lulus."
    hi: "यह अनिवार्य पास/फेल सब्जेक्ट है। ज़्यादातर कहते हैं कि पास होने के लिए थोड़ी मेहनत काफी है।"
  - en: "Most reviewers felt they learned little; lectures were seen as unnecessary for the assessments."
    zh: "多数评价认为学不到什么，讲座对考核没什么帮助。"
    zh-TW: "多數評價認為學不到什麼，講座對考核沒什麼幫助。"
    ja: "ほとんどの人があまり学べなかったと感じ、講義は評価課題に不要だと見られていました。"
    ko: "대부분 별로 배운 게 없다고 느꼈고, 강의는 평가에 필요 없다고 봤습니다."
    vi: "Đa số thấy học được rất ít; bài giảng bị cho là không cần cho bài đánh giá."
    ms: "Kebanyakan pengulas rasa sedikit sahaja dipelajari; kuliah dianggap tidak perlu untuk penilaian."
    id: "Kebanyakan pengulas merasa hanya belajar sedikit; kuliah dianggap tidak perlu untuk penilaian."
    hi: "ज़्यादातर रिव्यूअर्स को लगा कि उन्होंने बहुत कम सीखा; लेक्चर असेसमेंट के लिए गैरज़रूरी माने गए।"
  - en: "There is a group presentation late in the semester; attend so you aren't left without a group. Assignment instructions can be unclear."
    zh: "学期后段有小组展示，务必出席以免没组可进；作业要求可能不清晰。"
    zh-TW: "學期後段有小組報告，務必出席以免沒組可進；作業要求可能不清楚。"
    ja: "学期の後半にグループ発表があります。グループからあぶれないよう出席しましょう。課題の指示は分かりにくいことがあります。"
    ko: "학기 후반에 조별 발표가 있으니 조 없이 남지 않도록 출석하세요. 과제 안내가 불분명할 수 있습니다."
    vi: "Cuối học kỳ có thuyết trình nhóm; hãy đi học để không bị lẻ nhóm. Yêu cầu bài tập có thể không rõ."
    ms: "Ada pembentangan kumpulan lewat semester; hadir supaya anda tidak tertinggal tanpa kumpulan. Arahan tugasan boleh jadi tidak jelas."
    id: "Ada presentasi kelompok di akhir semester; hadirlah supaya tidak kehabisan kelompok. Instruksi tugas bisa kurang jelas."
    hi: "सेमेस्टर के आखिर में ग्रुप प्रेज़ेंटेशन है; हाज़िर रहें ताकि बिना ग्रुप के न रह जाएँ। असाइनमेंट निर्देश अस्पष्ट हो सकते हैं।"
sections:
  content:
    - en: "A compulsory pass/fail first-year subject that doesn't count toward your WAM. Almost all reviewers found it pointless, with content unrelated to their interests or already covered in other science subjects."
      zh: "一年级必修的 pass/fail 课，不计入 WAM。几乎所有评价都觉得没意义，内容和自己兴趣无关，或者其他理科课已经教过。"
      zh-TW: "一年級必修的 pass/fail 課，不計入 WAM。幾乎所有評價都覺得沒意義，內容跟自己興趣無關，或其他理科課已經教過。"
      ja: "1年次必修のpass/fail科目でWAMに入らない。ほぼ全員が意味がないと言い、内容は興味と無関係か他の理系科目で既に習うものだという。"
      ko: "1학년 필수 pass/fail 과목으로 WAM에 반영되지 않는다. 거의 모두 무의미하다고 하며, 내용이 관심사와 무관하거나 다른 과학 과목에서 이미 배운다고 한다."
      vi: "Môn bắt buộc năm nhất chấm đạt/không đạt, không tính vào WAM. Hầu hết đều thấy vô ích, nội dung không liên quan sở thích hoặc đã học ở môn khoa học khác."
      ms: "Subjek wajib tahun pertama lulus/gagal yang tidak dikira dalam WAM. Hampir semua rasa ia sia-sia, kandungan tidak berkaitan minat atau sudah diajar dalam subjek sains lain."
      id: "Mata kuliah wajib tahun pertama lulus/gagal yang tidak dihitung ke WAM. Hampir semua merasa tidak berguna, materinya tak terkait minat atau sudah diajarkan di mata kuliah sains lain."
      hi: "पहले साल का अनिवार्य पास/फ़ेल विषय, WAM में नहीं गिना जाता। लगभग सभी को यह बेकार लगा, कंटेंट उनकी रुचि से असंबंधित या दूसरे साइंस विषयों में पहले से पढ़ाया हुआ।"
    - en: "Many say the lectures aren't needed, since nothing from them shows up in the assessments."
      zh: "很多人说讲座不用看，考核里基本不考讲座内容。"
      zh-TW: "很多人說講座不用看，考核裡基本不考講座內容。"
      ja: "講義は内容が評価に出ないので見なくていいという声が多い。"
      ko: "강의 내용이 평가에 나오지 않아 강의는 안 들어도 된다는 의견이 많다."
      vi: "Nhiều người nói không cần xem bài giảng, vì đánh giá gần như không hỏi gì từ đó."
      ms: "Ramai kata kuliah tidak perlu kerana tiada isinya muncul dalam penilaian."
      id: "Banyak yang bilang kuliah tidak perlu karena isinya tidak muncul di penilaian."
      hi: "कई कहते हैं लेक्चर ज़रूरी नहीं, क्योंकि उनसे कुछ भी असेसमेंट में नहीं आता।"
  work:
    - en: "Online module quizzes, two written pieces (essay and report) and a group presentation at the end. Several found the instructions unclear, and marks depend on your tutor."
      zh: "有网上模块小测、两篇写作（论文和报告），期末还有小组展示。好几位觉得要求不清楚，分数看 tutor。"
      zh-TW: "有線上模組小考、兩篇寫作（論文和報告），期末還有小組報告。好幾位覺得要求不清楚，分數看 tutor。"
      ja: "オンラインのモジュールクイズ、文章課題2本（エッセイとレポート）、最後にグループ発表。指示が不明確で、点はチューター次第という声が複数。"
      ko: "온라인 모듈 퀴즈, 글쓰기 두 편(에세이와 보고서), 마지막에 조별 발표가 있다. 지시가 불명확하고 점수가 튜터에 달렸다는 사람이 여럿이다."
      vi: "Có quiz module online, hai bài viết (luận và báo cáo) và thuyết trình nhóm cuối kỳ. Vài người thấy yêu cầu không rõ, điểm tùy tutor."
      ms: "Kuiz modul dalam talian, dua penulisan (esei dan laporan) serta pembentangan kumpulan di akhir. Beberapa orang dapati arahan kabur dan markah bergantung pada tutor."
      id: "Ada kuis modul online, dua tulisan (esai dan laporan) dan presentasi kelompok di akhir. Beberapa orang merasa instruksinya tidak jelas dan nilai tergantung tutor."
      hi: "ऑनलाइन मॉड्यूल क्विज़, दो लिखित काम (निबंध और रिपोर्ट) और अंत में ग्रुप प्रेज़ेंटेशन। कई को निर्देश अस्पष्ट लगे, और अंक ट्यूटर पर निर्भर हैं।"
  study:
    - en: "Do the assignments and submit on time so you don't have to repeat it; one reviewer suggests running your paragraph ideas past your tutor a week before the due date."
      zh: "作业按时交，免得挂科重修；有同学建议截止前一周把段落思路拿去和 tutor 聊聊。"
      zh-TW: "作業準時交，免得被當重修；有同學建議截止前一週把段落思路拿去跟 tutor 聊聊。"
      ja: "再履修にならないよう課題は期限内に出す。締切の1週間前に段落の構想をチューターに相談するよう勧める人も。"
      ko: "재수강하지 않도록 과제는 제때 내라. 마감 일주일 전에 문단 구상을 튜터와 상의하라는 사람도 있다."
      vi: "Làm bài và nộp đúng hạn để khỏi phải học lại; một người khuyên đem ý tưởng đoạn văn hỏi tutor một tuần trước hạn."
      ms: "Siapkan tugasan dan hantar tepat masa supaya tidak perlu ulang; seorang pengulas cadang bincang idea perenggan dengan tutor seminggu sebelum tarikh akhir."
      id: "Kerjakan tugas dan kumpulkan tepat waktu agar tidak mengulang; satu pengulas menyarankan diskusikan ide paragraf dengan tutor seminggu sebelum tenggat."
      hi: "असाइनमेंट करें और समय पर जमा करें ताकि दोबारा न पढ़ना पड़े; एक रिव्यूअर सुझाता है कि डेडलाइन से एक हफ़्ता पहले अपने पैराग्राफ़ के विचार ट्यूटर से चर्चा करें।"
  watch:
    - en: "Show up for the group presentation weeks or you may be left without a group; a couple of reviewers had bad group or tutor experiences."
      zh: "小组展示那几周一定要去，不然可能找不到组；有一两位遇到了很糟的组员或 tutor。"
      zh-TW: "小組報告那幾週一定要去，不然可能找不到組；有一兩位遇到很糟的組員或 tutor。"
      ja: "グループ発表の週は必ず出席しないとグループに入れないことも。グループやチューターで嫌な経験をした人も数人。"
      ko: "조별 발표 주간엔 꼭 나가라. 안 그러면 조가 없을 수 있다. 조원이나 튜터 때문에 나쁜 경험을 한 사람도 몇 있다."
      vi: "Nhớ đi học những tuần thuyết trình nhóm, kẻo không có nhóm; vài người gặp nhóm hoặc tutor rất tệ."
      ms: "Hadir pada minggu pembentangan kumpulan atau anda mungkin tiada kumpulan; beberapa pengulas ada pengalaman buruk dengan kumpulan atau tutor."
      id: "Datang di minggu presentasi kelompok atau bisa tidak kebagian kelompok; beberapa pengulas punya pengalaman buruk dengan kelompok atau tutor."
      hi: "ग्रुप प्रेज़ेंटेशन वाले हफ़्तों में ज़रूर आएँ, वरना ग्रुप नहीं मिलेगा; कुछ रिव्यूअर्स का ग्रुप या ट्यूटर के साथ बुरा अनुभव रहा।"
workload: light
difficulty: easy
