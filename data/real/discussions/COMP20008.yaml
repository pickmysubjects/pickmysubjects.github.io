points:
  - en: "The content (data wrangling, visualisation, intro machine learning) is widely seen as useful and interesting."
    zh: "内容（数据处理、可视化、机器学习入门）普遍被认为有用、有趣。"
    zh-TW: "內容（資料處理、視覺化、機器學習入門）普遍被認為實用又有趣。"
    ja: "内容（データ整形、可視化、機械学習入門）は役立ち面白いと広く評価されている。"
    ko: "내용(데이터 정리, 시각화, 머신러닝 입문)은 유용하고 흥미롭다는 평이 많다."
    vi: "Nội dung (xử lý dữ liệu, trực quan hóa, nhập môn học máy) được nhiều người thấy hữu ích và thú vị."
    ms: "Kandungan (pemprosesan data, visualisasi, pengenalan pembelajaran mesin) secara meluas dianggap berguna dan menarik."
    id: "Materinya (pengolahan data, visualisasi, pengantar machine learning) banyak dinilai berguna dan menarik."
    hi: "कंटेंट (डेटा रैंगलिंग, विज़ुअलाइज़ेशन, मशीन लर्निंग का परिचय) को ज़्यादातर उपयोगी और दिलचस्प माना जाता है।"
  - en: "Many reviewers say much of it is self-taught: lectures stay high-level and the assignments need Python libraries you largely learn yourself."
    zh: "很多同学说大部分要靠自学：讲课比较概括，作业需要的 Python 库基本要自己学。"
    zh-TW: "很多評論者說大部分要靠自學：講課偏概括，作業需要的 Python 套件基本上要自己學。"
    ja: "多くは独学だという声が多い。講義は概要レベルで、課題に必要なPythonライブラリはほぼ自分で学ぶことになる。"
    ko: "많은 리뷰어가 대부분 독학이라고 한다. 강의는 개괄적이고, 과제에 필요한 Python 라이브러리는 거의 스스로 배워야 한다."
    vi: "Nhiều người nói phần lớn phải tự học: bài giảng chỉ ở mức tổng quát, còn thư viện Python cho bài tập chủ yếu tự tìm hiểu."
    ms: "Ramai pengulas kata kebanyakannya belajar sendiri: kuliah kekal di peringkat umum dan tugasan perlukan pustaka Python yang anda pelajari sendiri."
    id: "Banyak pengulas bilang sebagian besar belajar sendiri: kuliahnya umum saja, dan tugas butuh library Python yang sebagian besar kamu pelajari sendiri."
    hi: "कई रिव्यूअर्स कहते हैं ज़्यादातर ख़ुद सीखना पड़ता है: लेक्चर ऊपरी स्तर पर रहते हैं और असाइनमेंट के लिए Python लाइब्रेरी ख़ुद सीखनी होती हैं।"
  - en: "Assignments include group work and a report; reviewers mention vague specifications and inconsistent marking, though a recent review was much more positive."
    zh: "作业包括小组项目和报告；有人提到作业要求含糊、评分不一致，不过最近有一条评价正面很多。"
    zh-TW: "作業包括小組作業和報告；有人提到要求含糊、評分不一致，不過最近一則評價正面很多。"
    ja: "課題にはグループワークとレポートがある。指示が曖昧で採点にばらつきがあるという声があるが、最近のレビューはずっと好意的だった。"
    ko: "과제에는 조별 활동과 보고서가 있다. 요구 사항이 모호하고 채점이 들쭉날쭉하다는 말이 있지만, 최근 리뷰는 훨씬 긍정적이었다."
    vi: "Bài tập có làm nhóm và báo cáo; có người nói đề bài mơ hồ và chấm điểm không đều, dù một đánh giá gần đây tích cực hơn nhiều."
    ms: "Tugasan termasuk kerja berkumpulan dan laporan; pengulas sebut spesifikasi kabur dan pemarkahan tidak konsisten, walaupun ulasan terkini jauh lebih positif."
    id: "Tugas mencakup kerja kelompok dan laporan; pengulas menyebut spesifikasi kabur dan penilaian tidak konsisten, meski ulasan terbaru jauh lebih positif."
    hi: "असाइनमेंट में ग्रुप वर्क और रिपोर्ट है; रिव्यूअर्स ने अस्पष्ट निर्देश और असंगत मार्किंग बताई, हालाँकि हाल का एक रिव्यू काफ़ी सकारात्मक था।"
  - en: "A statistics background helps with the theory-based exam."
    zh: "有统计基础会对偏理论的考试有帮助。"
    zh-TW: "有統計背景對偏理論的考試有幫助。"
    ja: "統計の知識があると理論中心の試験に役立つ。"
    ko: "통계 배경이 있으면 이론 위주의 시험에 도움이 된다."
    vi: "Có nền thống kê sẽ giúp ích cho bài thi thiên lý thuyết."
    ms: "Latar belakang statistik membantu untuk peperiksaan berasaskan teori."
    id: "Latar statistik membantu untuk ujian yang berbasis teori."
    hi: "स्टैटिस्टिक्स बैकग्राउंड थ्योरी-आधारित परीक्षा में मदद करता है।"
sections:
  content:
    - en: "Interesting, practical data-science content, but most say it's poorly taught and mostly self-taught: lectures stay high level, while tutorials and assignments need Python you learn alone. One recent reviewer loved it."
      zh: "数据科学内容有趣实用，但多数同学说教得差、基本靠自学：lecture 很浅，tutorial 和作业要用的 Python 得自己学。有一位近期同学很喜欢。"
      zh-TW: "資料科學內容有趣實用，但多數同學說教得差、基本靠自學：lecture 很淺，tutorial 和作業要用的 Python 得自己學。有一位近期同學很喜歡。"
      ja: "データサイエンスの内容は面白く実践的だが、教え方が悪くほぼ独学だという声が多い。講義は抽象的で、チュートリアルや課題のPythonは自力で学ぶ必要がある。大好きだったという最近の人も一人。"
      ko: "데이터 과학 내용은 흥미롭고 실용적이지만, 대부분 잘 못 가르치고 거의 독학이라고 한다. 강의는 개괄적이고 튜토리얼·과제에 필요한 파이썬은 스스로 배워야 한다. 아주 좋았다는 최근 리뷰어도 한 명."
      vi: "Nội dung khoa học dữ liệu thú vị, thực tế, nhưng đa số nói dạy kém và phần lớn phải tự học: bài giảng chung chung, còn tutorial và bài tập cần Python tự học. Một người gần đây rất thích."
      ms: "Kandungan sains data menarik dan praktikal, tetapi kebanyakan kata pengajaran lemah dan banyak belajar sendiri: kuliah terlalu umum, tutorial dan tugasan perlukan Python yang dipelajari sendiri. Seorang pengulas terkini sangat suka."
      id: "Materi data science menarik dan praktis, tapi kebanyakan bilang pengajarannya buruk dan banyak belajar sendiri: kuliah terlalu umum, tutorial dan tugas butuh Python yang dipelajari sendiri. Satu reviewer terbaru sangat suka."
      hi: "डेटा साइंस का कंटेंट रोचक और व्यावहारिक, पर ज़्यादातर कहते हैं पढ़ाई कमज़ोर और खुद ही सीखना पड़ता है: लेक्चर ऊपरी, ट्यूटोरियल और असाइनमेंट के लिए Python खुद सीखनी पड़ती है। एक हालिया रिव्यूअर को बहुत पसंद आया।"
  work:
    - en: "Assignments use pandas, plotting and machine learning, including a group project with a report and slides; several found specs vague and marking inconsistent. The exam has been theory only, no coding."
      zh: "作业要用 pandas、画图和机器学习，包括一个要写报告、做 slides 的小组项目；好几位觉得要求含糊、评分不一致。考试只考理论，不写代码。"
      zh-TW: "作業要用 pandas、繪圖和機器學習，包括一個要寫報告、做 slides 的小組專案；好幾位覺得要求含糊、評分不一致。考試只考理論，不寫程式。"
      ja: "課題はpandas、可視化、機械学習を使い、レポートとスライドを作るグループプロジェクトも。仕様があいまいで採点にばらつきがあるという声が複数。試験は理論のみでコーディングなし。"
      ko: "과제는 pandas, 시각화, 머신러닝을 쓰며 보고서와 슬라이드를 만드는 그룹 프로젝트도 있다. 요구가 모호하고 채점이 들쭉날쭉하다는 리뷰가 여럿. 시험은 이론만, 코딩 없음."
      vi: "Bài tập dùng pandas, vẽ đồ thị và máy học, có dự án nhóm làm báo cáo và slide; vài người thấy đề mơ hồ, chấm không nhất quán. Bài thi chỉ lý thuyết, không lập trình."
      ms: "Tugasan guna pandas, plot dan pembelajaran mesin, termasuk projek berkumpulan dengan laporan dan slaid; beberapa rasa spesifikasi kabur dan pemarkahan tidak konsisten. Peperiksaan hanya teori, tiada pengekodan."
      id: "Tugas memakai pandas, plotting, dan machine learning, termasuk proyek kelompok dengan laporan dan slide; beberapa merasa spesifikasinya kabur dan penilaiannya tak konsisten. Ujian hanya teori, tanpa coding."
      hi: "असाइनमेंट में pandas, प्लॉटिंग और मशीन लर्निंग, जिसमें रिपोर्ट और स्लाइड वाला ग्रुप प्रोजेक्ट भी; कई को निर्देश अस्पष्ट और मार्किंग असंगत लगी। परीक्षा सिर्फ़ थ्योरी की रही, कोडिंग नहीं।"
  study:
    - en: "Go to the tutorials, since much of what you need isn't in lectures, and expect to learn libraries from documentation and searching. Some statistics background and solid Python help a lot; Ed Discussion has active tutors."
      zh: "tutorial 要去，很多需要的东西 lecture 不讲；准备好自己查文档和搜索来学各种库。有些统计基础和扎实的 Python 会帮大忙；Ed Discussion 上 tutor 很活跃。"
      zh-TW: "tutorial 要去，很多需要的東西 lecture 不講；準備好自己查文件和搜尋來學各種函式庫。有點統計基礎和扎實的 Python 會幫大忙；Ed Discussion 上 tutor 很活躍。"
      ja: "必要な内容の多くは講義にないのでチュートリアルに出よう。ライブラリはドキュメントや検索で自習する覚悟を。統計の素地と確かなPython力が大いに役立つ。Ed Discussionではチューターが活発。"
      ko: "필요한 내용 상당수가 강의에 없으니 튜토리얼에 나가자. 라이브러리는 문서와 검색으로 스스로 익힐 각오를 하자. 통계 배경과 탄탄한 파이썬이 큰 도움이 된다. Ed Discussion엔 튜터가 활발하다."
      vi: "Đi tutorial vì nhiều thứ cần thiết không có trong bài giảng, và chuẩn bị tự học thư viện qua tài liệu và tìm kiếm. Nền thống kê và Python vững giúp nhiều; tutor trên Ed Discussion rất tích cực."
      ms: "Hadir tutorial kerana banyak keperluan tiada dalam kuliah, dan bersedia belajar pustaka dari dokumentasi dan carian. Asas statistik dan Python yang kukuh sangat membantu; tutor di Ed Discussion aktif."
      id: "Datang ke tutorial karena banyak yang dibutuhkan tak ada di kuliah, dan siap belajar library dari dokumentasi dan pencarian. Dasar statistik dan Python yang kuat sangat membantu; tutor di Ed Discussion aktif."
      hi: "ट्यूटोरियल जाएँ, क्योंकि ज़रूरी बहुत कुछ लेक्चर में नहीं है, और लाइब्रेरी डॉक्यूमेंटेशन व सर्च से खुद सीखने को तैयार रहें। कुछ स्टैटिस्टिक्स और मज़बूत Python बहुत मदद करते हैं; Ed Discussion पर ट्यूटर सक्रिय हैं।"
