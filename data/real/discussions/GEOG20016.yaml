points:
  - en: "Assessments are seen as fair: short take-home reviews/exam plus a larger choose-your-own-topic essay (around 50%)."
    zh: "考核被认为公平：短的居家测验加一篇自选题目的大论文（约占50%）。"
  - en: "Content is interesting and not conceptually hard, but it gets repetitive from week to week and lectures are dense."
    zh: "内容有趣、概念不难，但每周内容有些重复，讲课信息量大。"
  - en: "Tutorials are often dry and centred on student presentations, and participation can be marked."
    zh: "辅导课常较枯燥，以学生展示为主，且可能计入参与分。"
  - en: "Suitable as a breadth subject even without a geography background."
    zh: "即使没有地理背景，也适合作为跨学科选修课。"
