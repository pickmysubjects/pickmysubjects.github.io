reviews: 5
from: 2021
to: 2026
checked: 2026-10-08
points:
  - en: "Assessments are seen as fair: short take-home reviews/exam plus a larger choose-your-own-topic essay (around 50%)."
    zh: "考核被认为公平：短的居家测验加一篇自选题目的大论文（约占50%）。"
    zh-TW: "考核被認為公平：簡短的帶回家作答/考試，加上一篇自選題目的大論文（約50%）。"
    ja: "評価は公平とされる。短い持ち帰りレビュー/試験と、テーマ自由の大きめのエッセイ（約50%）。"
    ko: "평가는 공정하다는 평: 짧은 재택 리뷰/시험과 자유 주제의 큰 에세이(약 50%)."
    vi: "Đánh giá được cho là công bằng: bài ôn/bài thi ngắn làm tại nhà cộng một bài luận lớn tự chọn chủ đề (khoảng 50%)."
    ms: "Penilaian dilihat adil: ulasan/peperiksaan pendek bawa balik serta esei besar topik pilihan sendiri (sekitar 50%)."
    id: "Penilaian dianggap adil: review/ujian singkat take-home plus esai besar dengan topik pilihan sendiri (sekitar 50%)."
    hi: "असेसमेंट निष्पक्ष माने जाते हैं: छोटे टेक-होम रिव्यू/एग्ज़ाम और अपनी पसंद के टॉपिक पर बड़ा निबंध (लगभग 50%)।"
  - en: "Content is interesting and not conceptually hard, but it gets repetitive from week to week and lectures are dense."
    zh: "内容有趣、概念不难，但每周内容有些重复，讲课信息量大。"
    zh-TW: "內容有趣、概念不難，但每週內容有點重複，講課資訊量大。"
    ja: "内容は面白く概念的に難しくないが、毎週似た内容になりがちで講義は密度が高い。"
    ko: "내용은 흥미롭고 개념적으로 어렵지 않지만, 매주 반복적이고 강의 밀도가 높음."
    vi: "Nội dung thú vị và không khó về khái niệm, nhưng lặp lại qua các tuần và bài giảng dày đặc."
    ms: "Kandungan menarik dan konsepnya tidak sukar, tetapi berulang dari minggu ke minggu dan kuliah padat."
    id: "Materi menarik dan konsepnya tidak sulit, tapi berulang tiap minggu dan kuliahnya padat."
    hi: "कंटेंट दिलचस्प है और कॉन्सेप्ट कठिन नहीं, पर हर हफ़्ते दोहराव आता है और लेक्चर भारी होते हैं।"
  - en: "Tutorials are often dry and centred on student presentations, and participation can be marked."
    zh: "辅导课常较枯燥，以学生展示为主，且可能计入参与分。"
    zh-TW: "小組討論課常常很枯燥，以學生報告為主，而且可能會算參與分數。"
    ja: "チュートリアルは退屈なことが多く学生発表が中心で、参加点がつくこともある。"
    ko: "튜토리얼은 학생 발표 위주라 지루한 경우가 많고, 참여 점수가 있을 수 있음."
    vi: "Tutorial thường khô khan và xoay quanh thuyết trình của sinh viên, có thể chấm điểm tham gia."
    ms: "Tutorial selalunya membosankan dan berpusat pada pembentangan pelajar, dan penyertaan mungkin dimarkah."
    id: "Tutorial sering membosankan dan berpusat pada presentasi mahasiswa, dan partisipasi bisa dinilai."
    hi: "ट्यूटोरियल अक्सर नीरस होते हैं और स्टूडेंट प्रेज़ेंटेशन पर टिके होते हैं, और पार्टिसिपेशन के मार्क्स हो सकते हैं।"
  - en: "Suitable as a breadth subject even without a geography background."
    zh: "即使没有地理背景，也适合作为跨学科选修课。"
    zh-TW: "就算沒有地理背景，也適合當作Breadth科目。"
    ja: "地理の知識がなくてもBreadth科目として向いている。"
    ko: "지리 배경이 없어도 Breadth 과목으로 적합함."
    vi: "Phù hợp làm môn Breadth kể cả khi không có nền địa lý."
    ms: "Sesuai sebagai subjek Breadth walaupun tanpa latar geografi."
    id: "Cocok sebagai mata kuliah Breadth meski tanpa latar geografi."
    hi: "ज्योग्राफ़ी बैकग्राउंड न हो तब भी Breadth सब्जेक्ट के रूप में ठीक है।"
sections:
  content:
    - en: "Population change over time: fertility, mortality, migration and ageing. Reviewers found it interesting, practical and not conceptually hard, though lectures are dense and topics repeat a bit."
      zh: "讲人口随时间的变化：生育、死亡、迁移和老龄化。同学觉得有意思、贴近实际、概念不难，不过讲课内容密、话题有点重复。"
      zh-TW: "講人口隨時間的變化：生育、死亡、遷移和高齡化。同學覺得有意思、貼近實際、概念不難，不過講課內容密、主題有點重複。"
      ja: "出生、死亡、移住、高齢化など人口の時間的変化。面白く実際的で概念的に難しくないが、講義は密度が高くテーマがやや繰り返すという。"
      ko: "출산, 사망, 이주, 고령화 등 시간에 따른 인구 변화. 흥미롭고 실용적이며 개념이 어렵지 않지만 강의가 빽빽하고 주제가 다소 반복된다는 평."
      vi: "Biến động dân số theo thời gian: sinh, tử, di cư và già hóa. Người học thấy thú vị, thực tế, không khó về khái niệm, dù bài giảng dày và chủ đề hơi lặp."
      ms: "Perubahan penduduk dari masa ke masa: kesuburan, kematian, migrasi dan penuaan. Pengulas rasa menarik, praktikal dan tidak sukar, walaupun kuliah padat dan topik sedikit berulang."
      id: "Perubahan penduduk dari waktu ke waktu: kesuburan, kematian, migrasi dan penuaan. Pengulas merasa menarik, praktis dan tidak sulit, meski kuliah padat dan topik agak berulang."
      hi: "समय के साथ जनसंख्या परिवर्तन: प्रजनन, मृत्यु, प्रवास और बुढ़ापा। रिव्यूअर्स को रोचक, व्यावहारिक और कॉन्सेप्ट में आसान लगा, हालाँकि लेक्चर घने हैं और विषय थोड़े दोहराते हैं।"
  work:
    - en: "Two straightforward take-home reviews, an oral reading summary and a research essay (around 50%) on any demography topic you choose. Tutorial participation is marked."
      zh: "两次简单的 take-home 测验、一次口头阅读总结，以及一篇研究论文（约占 50%），题目可在人口学范围内自选。tutorial 参与算分。"
      zh-TW: "兩次簡單的 take-home 測驗、一次口頭閱讀摘要，以及一篇研究論文（約占 50%），題目可在人口學範圍內自選。tutorial 參與算分。"
      ja: "素直な持ち帰りレビュー2回、リーディングの口頭要約、人口学なら何でも選べる研究エッセイ（約50%）。チュートリアルの参加も採点される。"
      ko: "무난한 테이크홈 리뷰 2회, 리딩 구두 요약, 인구학 내에서 자유 주제인 연구 에세이(약 50%). 튜토리얼 참여도 채점된다."
      vi: "Hai bài ôn tập làm tại nhà đơn giản, một bài tóm tắt đọc bằng lời, và bài luận nghiên cứu (khoảng 50%) về chủ đề nhân khẩu học tự chọn. Tham gia tutorial có tính điểm."
      ms: "Dua ulasan bawa pulang yang mudah, ringkasan bacaan lisan dan esei penyelidikan (kira-kira 50%) tentang mana-mana topik demografi. Penyertaan tutorial dimarkah."
      id: "Dua ulasan bawa pulang yang lugas, ringkasan bacaan lisan dan esai riset (sekitar 50%) tentang topik demografi pilihanmu. Partisipasi tutorial dinilai."
      hi: "दो सीधी टेक-होम समीक्षाएँ, एक मौखिक रीडिंग सारांश, और जनसांख्यिकी के किसी भी चुने विषय पर रिसर्च निबंध (लगभग 50%)। ट्यूटोरियल भागीदारी के अंक हैं।"
  watch:
    - en: "Tutorials can be dry, and engagement depends on your tutor, which matters since participation counts. One 2021 reviewer found communication between tutors lacking."
      zh: "tutorial 可能比较枯燥，参与度看 tutor，而参与又算分。一位 2021 年的同学觉得 tutor 之间沟通不够。"
      zh-TW: "tutorial 可能比較枯燥，參與度看 tutor，而參與又算分。一位 2021 年的同學覺得 tutor 之間溝通不夠。"
      ja: "チュートリアルは退屈なこともあり、盛り上がりはチューター次第で、参加点があるので重要。2021年の一人はチューター間の連携不足を感じた。"
      ko: "튜토리얼은 건조할 수 있고 참여 분위기는 튜터에 달렸는데, 참여 점수가 있어 중요하다. 2021년 한 리뷰는 튜터 간 소통이 부족했다고 한다."
      vi: "Tutorial có thể khô, mức tương tác tùy tutor, mà tham gia lại tính điểm. Một người năm 2021 thấy các tutor ít trao đổi với nhau."
      ms: "Tutorial boleh hambar dan penglibatan bergantung pada tutor, yang penting kerana penyertaan dikira. Seorang pengulas 2021 rasa komunikasi antara tutor kurang."
      id: "Tutorial bisa membosankan dan keterlibatan bergantung pada tutor, padahal partisipasi dinilai. Satu pengulas 2021 merasa komunikasi antar tutor kurang."
      hi: "ट्यूटोरियल नीरस हो सकते हैं और जुड़ाव ट्यूटर पर निर्भर है, जो मायने रखता है क्योंकि भागीदारी गिनी जाती है। 2021 के एक को ट्यूटर्स के बीच संवाद कम लगा।"
difficulty: easy
