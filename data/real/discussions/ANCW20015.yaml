code: ANCW20015
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/ancw20015
reviews: 9
from: 2016
to: 2024
checked: 2026-10-17
points:
  - en: "Reviews from 2016 to 2024 are almost all positive: the myths are engaging and the essay tasks are enjoyable to write."
    zh: "2016到2024年的评价几乎都是正面的：神话内容很吸引人，论文写起来也有意思。"
    zh-TW: "2016到2024年的評價幾乎都是正面的：神話內容很吸引人，論文寫起來也有意思。"
    ja: "2016〜2024年のレビューはほぼすべて好意的。神話の内容が面白く、エッセイも楽しく書ける。"
    ko: "2016~2024년 리뷰는 거의 모두 긍정적. 신화 내용이 흥미롭고 에세이 과제도 즐겁게 쓸 수 있음."
    vi: "Đánh giá từ 2016 đến 2024 gần như đều tích cực: thần thoại cuốn hút và các bài luận viết rất vui."
    ms: "Ulasan dari 2016 hingga 2024 hampir semuanya positif: mitos-mitosnya menarik dan tugasan esei seronok ditulis."
    id: "Ulasan dari 2016 sampai 2024 hampir semuanya positif: mitosnya menarik dan tugas esainya menyenangkan untuk ditulis."
    hi: "2016 से 2024 तक के रिव्यू लगभग सभी सकारात्मक हैं: मिथक दिलचस्प हैं और निबंध लिखने में मज़ा आता है।"
  - en: "Weekly reading can feel overwhelming if you have never studied classics, with many unfamiliar names, but science students still did well."
    zh: "如果没学过古典学，每周阅读量和大量陌生名字会让人有点吃不消，不过理科生也照样考得不错。"
    zh-TW: "如果沒學過古典學，每週閱讀量和大量陌生名字會讓人有點吃不消，不過理科生也照樣考得不錯。"
    ja: "古典学が初めてだと、毎週の読書量と知らない名前の多さに圧倒されがちだが、理系学生でも良い成績を取っている。"
    ko: "고전학이 처음이면 주간 읽기 양과 낯선 이름들이 벅찰 수 있지만, 이과생들도 좋은 성적을 받았음."
    vi: "Nếu chưa học cổ điển học, lượng đọc hằng tuần và nhiều cái tên lạ có thể gây choáng, nhưng sinh viên khoa học vẫn đạt điểm tốt."
    ms: "Bacaan mingguan boleh terasa berat jika anda belum pernah belajar klasik, dengan banyak nama asing, tetapi pelajar sains tetap berjaya."
    id: "Bacaan mingguan bisa terasa berat kalau belum pernah belajar klasik, dengan banyak nama asing, tapi mahasiswa sains tetap dapat nilai bagus."
    hi: "अगर आपने क्लासिक्स नहीं पढ़ा है तो हर हफ़्ते की पढ़ाई और ढेर सारे अनजान नाम भारी लग सकते हैं, फिर भी साइंस छात्रों ने अच्छा किया।"
  - en: "The winter intensive moves fast, and one 2021 reviewer found the online version less engaging than in person."
    zh: "冬季密集版节奏很快，一位2021年的评论者觉得线上版不如线下有吸引力。"
    zh-TW: "冬季密集版節奏很快，一位2021年的評論者覺得線上版不如實體上課有吸引力。"
    ja: "冬期集中版は進みが速く、2021年のレビューではオンライン版は対面ほど引き込まれなかったとのこと。"
    ko: "겨울 집중 과정은 진도가 빠르고, 2021년 리뷰어는 온라인 버전이 대면보다 덜 흥미로웠다고 함."
    vi: "Bản học cấp tốc mùa đông đi rất nhanh, và một người năm 2021 thấy bản online kém hấp dẫn hơn học trực tiếp."
    ms: "Versi intensif musim sejuk bergerak pantas, dan seorang pengulas 2021 dapati versi dalam talian kurang menarik berbanding bersemuka."
    id: "Versi intensif musim dingin berjalan cepat, dan seorang pengulas 2021 merasa versi online kurang menarik dibanding tatap muka."
    hi: "विंटर इंटेंसिव बहुत तेज़ चलता है, और 2021 के एक रिव्यूअर को ऑनलाइन वर्ज़न आमने-सामने जितना दिलचस्प नहीं लगा।"
sections:
  content:
    - en: "Reviewers found the classical myths and primary texts fascinating and the subject well run. Without a classics background the readings and unfamiliar names can feel overwhelming at first."
      zh: "同学觉得古典神话和原始文本很吸引人，课程组织得好。没学过古典学的话，一开始阅读量和陌生名字会让人有点吃不消。"
      zh-TW: "同學覺得古典神話和原典很吸引人，課程安排得好。沒修過古典學的話，一開始閱讀量和陌生名字會讓人有點吃不消。"
      ja: "古典神話と一次テキストがとても面白く、運営も良いという声。古典学の経験がないと、最初はリーディングと見慣れない名前に圧倒されがち。"
      ko: "고전 신화와 1차 텍스트가 매우 흥미롭고 운영이 좋다는 평. 고전학 배경이 없으면 처음엔 읽기 분량과 낯선 이름에 압도될 수 있다."
      vi: "Người học thấy thần thoại cổ điển và văn bản gốc rất cuốn hút, môn được tổ chức tốt. Chưa học cổ điển thì lúc đầu bài đọc và tên lạ có thể gây choáng."
      ms: "Pengulas dapati mitos klasik dan teks primer sangat menarik dan subjek teratur. Tanpa latar klasik, bacaan dan nama asing boleh terasa berat pada mulanya."
      id: "Pengulas merasa mitos klasik dan teks primer sangat menarik dan mata kuliahnya rapi. Tanpa latar klasik, bacaan dan nama-nama asing bisa terasa berat di awal."
      hi: "रिव्यूअर्स को क्लासिकल मिथक और मूल ग्रंथ बहुत रोचक और विषय अच्छी तरह चलाया गया लगा। क्लासिक्स का बैकग्राउंड न हो तो शुरुआत में रीडिंग और अनजान नाम भारी लग सकते हैं।"
  work:
    - en: "Short fortnightly quizzes on lecture content, a document analysis, a research essay and a take-home exam essay. Reviewers found them fair and often fun; citations are checked closely."
      zh: "每两周一次关于讲课内容的小测、一份文献分析、一篇研究论文和一篇带回家写的考试论文。同学觉得公平，常常还挺好玩；引用格式查得很严。"
      zh-TW: "每兩週一次關於上課內容的小考、一份文獻分析、一篇研究論文和一篇帶回家寫的考試論文。同學覺得公平，常常還蠻好玩；引用格式查得很嚴。"
      ja: "隔週の講義内容の小テスト、資料分析、研究エッセイ、持ち帰り試験のエッセイ。公平で楽しいことも多いが、引用は厳しくチェックされる。"
      ko: "격주 강의 내용 퀴즈, 문헌 분석, 연구 에세이, 테이크홈 시험 에세이가 있다. 공정하고 재미있다는 평이지만 인용은 꼼꼼히 확인한다."
      vi: "Quiz ngắn hai tuần một lần về bài giảng, một bài phân tích tư liệu, một tiểu luận nghiên cứu và bài thi viết luận làm ở nhà. Người học thấy công bằng, thường còn vui; trích dẫn được kiểm rất kỹ."
      ms: "Kuiz pendek dua minggu sekali tentang kuliah, analisis dokumen, esei penyelidikan dan esei peperiksaan bawa pulang. Pengulas rasa adil dan sering seronok; petikan disemak dengan teliti."
      id: "Kuis singkat dua mingguan tentang materi kuliah, analisis dokumen, esai riset dan esai ujian take-home. Pengulas merasa adil dan sering seru; sitasi diperiksa ketat."
      hi: "हर दो हफ़्ते लेक्चर पर छोटे क्विज़, एक दस्तावेज़ विश्लेषण, एक रिसर्च निबंध और टेक-होम परीक्षा निबंध। रिव्यूअर्स को ये उचित और अक्सर मज़ेदार लगे; संदर्भ बारीकी से जाँचे जाते हैं।"
  study:
    - en: "Do at least the primary readings each week, since seminars and assessments build on them and discussions are better when you have."
      zh: "每周至少把原始文本读了，研讨课和作业都以此为基础，读了讨论也更有意思。"
      zh-TW: "每週至少把原典讀了，研討課和作業都以此為基礎，讀了討論也更有意思。"
      ja: "毎週少なくとも一次テキストは読むこと。セミナーと課題はそれを前提にしており、読んでいれば議論も楽しい。"
      ko: "매주 최소한 1차 텍스트는 읽어라. 세미나와 과제가 그것을 바탕으로 하고, 읽어 두면 토론도 더 재미있다."
      vi: "Mỗi tuần ít nhất đọc văn bản gốc, vì seminar và bài đánh giá dựa trên đó và thảo luận sẽ hay hơn khi bạn đã đọc."
      ms: "Buat sekurang-kurangnya bacaan primer setiap minggu kerana seminar dan penilaian berasaskannya, dan perbincangan lebih baik jika anda membacanya."
      id: "Setidaknya baca teks primer tiap minggu, karena seminar dan penilaian bertumpu padanya dan diskusi jadi lebih seru kalau sudah membaca."
      hi: "हर हफ़्ते कम से कम मूल रीडिंग करें, क्योंकि सेमिनार और मूल्यांकन उन्हीं पर टिके हैं और पढ़कर आने पर चर्चा बेहतर होती है।"
  watch:
    - en: "The winter term version is fast paced, and one reviewer found it less engaging online. Several note few classmates do the readings, which can make discussions quiet."
      zh: "冬季班节奏快，有同学觉得网课形式不够投入。好几位提到很少有同学读材料，讨论可能会冷场。"
      zh-TW: "冬季班節奏快，有同學覺得線上形式不夠投入。好幾位提到很少有同學讀資料，討論可能會冷場。"
      ja: "ウィンター開講は進みが速く、オンラインでは引き込まれにくかったという声も。リーディングをする人が少なく議論が静かになりがちという声が複数。"
      ko: "겨울 학기는 진도가 빠르고 온라인은 덜 몰입됐다는 리뷰가 있다. 읽기를 하는 학생이 적어 토론이 조용할 수 있다는 의견이 여럿."
      vi: "Học kỳ đông nhịp nhanh, một người thấy học trực tuyến kém hấp dẫn. Vài người nói ít bạn chịu đọc bài nên thảo luận có thể trầm."
      ms: "Versi penggal musim sejuk laju, dan seorang rasa kurang menarik secara dalam talian. Beberapa menyatakan sedikit rakan buat bacaan, jadi perbincangan boleh senyap."
      id: "Versi semester musim dingin cepat, dan satu pengulas merasa kurang menarik secara daring. Beberapa mencatat sedikit teman yang membaca, jadi diskusi bisa sepi."
      hi: "विंटर टर्म वाला संस्करण तेज़ है, और एक को ऑनलाइन कम दिलचस्प लगा। कई बताते हैं कि कम सहपाठी रीडिंग करते हैं, जिससे चर्चा फीकी रह सकती है।"
