points:
  - en: "Reviews from 2016 to 2024 are almost all positive: the myths are engaging and the essay tasks are enjoyable to write."
    zh: "2016到2024年的评价几乎都是正面的：神话内容很吸引人，论文写起来也有意思。"
    zh-TW: "2016到2024年的評價幾乎都是正面的：神話內容很吸引人，論文寫起來也有意思。"
    ja: "2016〜2024年のレビューはほぼすべて好意的。神話の内容が面白く、エッセイも楽しく書ける。"
    ko: "2016~2024년 리뷰는 거의 모두 긍정적. 신화 내용이 흥미롭고 에세이 과제도 즐겁게 쓸 수 있음."
    vi: "Đánh giá từ 2016 đến 2024 gần như đều tích cực: thần thoại cuốn hút và các bài luận viết rất vui."
    ms: "Ulasan dari 2016 hingga 2024 hampir semuanya positif: mitos-mitosnya menarik dan tugasan esei seronok ditulis."
    id: "Ulasan dari 2016 sampai 2024 hampir semuanya positif: mitosnya menarik dan tugas esainya menyenangkan untuk ditulis."
    hi: "2016 से 2024 तक के रिव्यू लगभग सभी सकारात्मक हैं: मिथक दिलचस्प हैं और निबंध लिखने में मज़ा आता है।"
  - en: "Weekly reading can feel overwhelming if you have never studied classics, with many unfamiliar names, but science students still did well."
    zh: "如果没学过古典学，每周阅读量和大量陌生名字会让人有点吃不消，不过理科生也照样考得不错。"
    zh-TW: "如果沒學過古典學，每週閱讀量和大量陌生名字會讓人有點吃不消，不過理科生也照樣考得不錯。"
    ja: "古典学が初めてだと、毎週の読書量と知らない名前の多さに圧倒されがちだが、理系学生でも良い成績を取っている。"
    ko: "고전학이 처음이면 주간 읽기 양과 낯선 이름들이 벅찰 수 있지만, 이과생들도 좋은 성적을 받았음."
    vi: "Nếu chưa học cổ điển học, lượng đọc hằng tuần và nhiều cái tên lạ có thể gây choáng, nhưng sinh viên khoa học vẫn đạt điểm tốt."
    ms: "Bacaan mingguan boleh terasa berat jika anda belum pernah belajar klasik, dengan banyak nama asing, tetapi pelajar sains tetap berjaya."
    id: "Bacaan mingguan bisa terasa berat kalau belum pernah belajar klasik, dengan banyak nama asing, tapi mahasiswa sains tetap dapat nilai bagus."
    hi: "अगर आपने क्लासिक्स नहीं पढ़ा है तो हर हफ़्ते की पढ़ाई और ढेर सारे अनजान नाम भारी लग सकते हैं, फिर भी साइंस छात्रों ने अच्छा किया।"
  - en: "The winter intensive moves fast, and one 2021 reviewer found the online version less engaging than in person."
    zh: "冬季密集版节奏很快，一位2021年的评论者觉得线上版不如线下有吸引力。"
    zh-TW: "冬季密集版節奏很快，一位2021年的評論者覺得線上版不如實體上課有吸引力。"
    ja: "冬期集中版は進みが速く、2021年のレビューではオンライン版は対面ほど引き込まれなかったとのこと。"
    ko: "겨울 집중 과정은 진도가 빠르고, 2021년 리뷰어는 온라인 버전이 대면보다 덜 흥미로웠다고 함."
    vi: "Bản học cấp tốc mùa đông đi rất nhanh, và một người năm 2021 thấy bản online kém hấp dẫn hơn học trực tiếp."
    ms: "Versi intensif musim sejuk bergerak pantas, dan seorang pengulas 2021 dapati versi dalam talian kurang menarik berbanding bersemuka."
    id: "Versi intensif musim dingin berjalan cepat, dan seorang pengulas 2021 merasa versi online kurang menarik dibanding tatap muka."
    hi: "विंटर इंटेंसिव बहुत तेज़ चलता है, और 2021 के एक रिव्यूअर को ऑनलाइन वर्ज़न आमने-सामने जितना दिलचस्प नहीं लगा।"
