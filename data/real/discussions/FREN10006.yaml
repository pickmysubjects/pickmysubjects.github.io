reviews: 9
from: 2015
to: 2021
checked: 2026-10-17
points:
  - en: "Classes are entirely in French on broad, complex topics such as feminism, Islam in France and the Algerian War; several found the jump from VCE or IB hard."
    zh: "课堂全法语，讨论女性主义、法国的伊斯兰、阿尔及利亚战争等宽泛复杂的话题；好几人觉得从VCE或IB过来跨度很大。"
    zh-TW: "課堂全法語，討論女性主義、法國的伊斯蘭、阿爾及利亞戰爭等寬泛複雜的話題；好幾人覺得從VCE或IB過來跨度很大。"
    ja: "授業はすべてフランス語で、フェミニズム、フランスのイスラム、アルジェリア戦争など広く複雑なテーマを扱う。VCEやIBからの差が大きいと感じた人が多い。"
    ko: "수업은 전부 프랑스어로, 페미니즘, 프랑스의 이슬람, 알제리 전쟁 등 폭넓고 복잡한 주제를 다룸. VCE나 IB에서 올라오면 격차가 크다는 사람이 여럿."
    vi: "Lớp học hoàn toàn bằng tiếng Pháp về các chủ đề rộng và phức tạp như nữ quyền, Hồi giáo ở Pháp và chiến tranh Algérie; nhiều người thấy bước nhảy từ VCE hay IB rất lớn."
    ms: "Kelas sepenuhnya dalam Bahasa Perancis tentang topik luas dan kompleks seperti feminisme, Islam di Perancis dan Perang Algeria; beberapa orang dapati lonjakan dari VCE atau IB sukar."
    id: "Kelas sepenuhnya berbahasa Prancis dengan topik luas dan rumit seperti feminisme, Islam di Prancis, dan Perang Aljazair; beberapa orang merasa lompatan dari VCE atau IB berat."
    hi: "क्लास पूरी तरह फ़्रेंच में होती है, नारीवाद, फ़्रांस में इस्लाम और अल्जीरियाई युद्ध जैसे व्यापक, जटिल विषयों पर; कई लोगों को VCE या IB से यह छलाँग कठिन लगी।"
  - en: "Expect a lot of writing and self-study; speak up in tutorials, as oral skills count. Hard workers still reached H1."
    zh: "写作和自学量很大；辅导课上要积极发言，口语很重要。肯努力的人照样能拿H1。"
    zh-TW: "寫作和自學量很大；輔導課上要積極發言，口說很重要。肯努力的人照樣能拿H1。"
    ja: "書く量と自習が多い。口頭能力も評価されるのでチュートリアルでは積極的に発言すること。努力した人はH1も取れている。"
    ko: "글쓰기와 자습량이 많음. 말하기 능력도 중요하니 튜토리얼에서 적극적으로 말할 것. 열심히 한 사람은 H1도 받음."
    vi: "Viết nhiều và phải tự học nhiều; hãy phát biểu trong tutorial vì kỹ năng nói được tính điểm. Người chăm vẫn đạt H1."
    ms: "Jangkakan banyak penulisan dan belajar sendiri; bercakap dalam tutorial kerana kemahiran lisan dikira. Yang rajin masih mencapai H1."
    id: "Siap banyak menulis dan belajar mandiri; aktiflah bicara di tutorial karena kemampuan lisan dinilai. Yang tekun tetap meraih H1."
    hi: "बहुत लिखना और ख़ुद पढ़ना पड़ता है; ट्यूटोरियल में बोलें, क्योंकि मौखिक कौशल गिना जाता है। मेहनती छात्रों को फिर भी H1 मिला।"
sections:
  content:
    - en: "Taught fully in French, focused on discussing society and culture rather than grammar; topics have included feminism, politics and French history."
      zh: "全法语授课，重点是讨论社会和文化，而不是语法；话题包括女性主义、政治和法国历史等。"
      zh-TW: "全法語授課，重點是討論社會和文化，而不是文法；主題包括女性主義、政治和法國歷史等。"
      ja: "授業はすべてフランス語で、文法より社会や文化の議論が中心。フェミニズム、政治、フランス史などを扱ってきた。"
      ko: "수업은 전부 프랑스어이고 문법보다 사회와 문화 토론이 중심이다. 페미니즘, 정치, 프랑스 역사 등을 다뤘다."
      vi: "Dạy hoàn toàn bằng tiếng Pháp, tập trung thảo luận xã hội và văn hóa hơn ngữ pháp; chủ đề từng có nữ quyền, chính trị và lịch sử Pháp."
      ms: "Diajar sepenuhnya dalam bahasa Perancis, menumpu pada perbincangan masyarakat dan budaya, bukan tatabahasa; topik termasuk feminisme, politik dan sejarah Perancis."
      id: "Diajarkan sepenuhnya dalam bahasa Prancis, fokus pada diskusi masyarakat dan budaya alih-alih tata bahasa; topiknya termasuk feminisme, politik dan sejarah Prancis."
      hi: "पूरी तरह फ़्रेंच में पढ़ाया जाता है, व्याकरण के बजाय समाज और संस्कृति पर चर्चा पर ज़ोर; विषयों में नारीवाद, राजनीति और फ़्रांसीसी इतिहास रहे हैं।"
    - en: "Most found it challenging, a step up from VCE or IB French with less guided teaching, but several still did well."
      zh: "多数人觉得有挑战，比 VCE 或 IB 法语难一截，教学也没那么手把手；但好几位还是考得不错。"
      zh-TW: "多數人覺得有挑戰，比 VCE 或 IB 法語難一截，教學也沒那麼手把手；但好幾位還是考得不錯。"
      ja: "VCEやIBのフランス語より一段難しく、手取り足取り教えてくれないので大変という声が多いが、良い成績の人も複数。"
      ko: "VCE나 IB 프랑스어보다 한 단계 어렵고 덜 친절한 수업이라 힘들다는 평이 많지만, 잘 받은 사람도 여럿이다."
      vi: "Đa số thấy khó, cao hơn VCE hay IB tiếng Pháp một bậc và ít được hướng dẫn kỹ, nhưng vài người vẫn đạt kết quả tốt."
      ms: "Kebanyakan rasa mencabar, setingkat lebih tinggi daripada Perancis VCE atau IB dengan pengajaran kurang berpandu, tetapi beberapa masih berjaya."
      id: "Kebanyakan merasa menantang, naik satu tingkat dari bahasa Prancis VCE atau IB dengan pengajaran yang kurang terbimbing, tapi beberapa tetap berhasil."
      hi: "ज़्यादातर को यह चुनौतीपूर्ण लगा, VCE या IB फ़्रेंच से एक स्तर ऊपर और कम मार्गदर्शन वाला, फिर भी कई ने अच्छा किया।"
  work:
    - en: "Many assessments across the semester, lots of writing, and a final exam of about 30%. Some found assignment briefs vague, and one said marking varies by tutor."
      zh: "学期中考核很多，写作量大，期末约占 30%。有人觉得作业要求含糊，也有同学说评分看 tutor。"
      zh-TW: "學期中考核很多，寫作量大，期末約佔 30%。有人覺得作業要求含糊，也有同學說評分看 tutor。"
      ja: "学期を通じて評価が多く、書く量も多い。期末は約30%。課題の説明が曖昧だという声や、採点がチューターで違うという声も。"
      ko: "학기 내내 평가가 많고 글쓰기가 많으며 기말은 약 30%다. 과제 안내가 모호하다는 의견과 튜터마다 채점이 다르다는 의견이 있다."
      vi: "Nhiều bài đánh giá trong kỳ, viết nhiều, thi cuối kỳ khoảng 30%. Có người thấy đề bài mơ hồ, một người nói chấm điểm tùy tutor."
      ms: "Banyak penilaian sepanjang semester, banyak menulis, dan peperiksaan akhir kira-kira 30%. Ada yang rasa arahan tugasan kabur, seorang kata pemarkahan ikut tutor."
      id: "Banyak penilaian sepanjang semester, banyak menulis, dan ujian akhir sekitar 30%. Ada yang merasa instruksi tugas kabur, satu bilang penilaian tergantung tutor."
      hi: "सेमेस्टर भर कई मूल्यांकन, बहुत लेखन, और लगभग 30% की फ़ाइनल परीक्षा। कुछ को असाइनमेंट निर्देश अस्पष्ट लगे, एक ने कहा मार्किंग ट्यूटर पर निर्भर है।"
  study:
    - en: "Speak up as much as you can in tutorials, since that is your main chance to practise oral skills, and make sure your written French is solid."
      zh: "tutorial 上尽量多开口，这是练口语的主要机会；书面法语也要打牢。"
      zh-TW: "tutorial 上盡量多開口，這是練口說的主要機會；書面法語也要打穩。"
      ja: "チュートリアルではできるだけ発言を。会話力を練習する主な機会になる。書くフランス語もしっかり固めておく。"
      ko: "튜토리얼에서 최대한 말하라. 회화를 연습할 주된 기회다. 작문 실력도 탄탄히 해 두라."
      vi: "Phát biểu nhiều nhất có thể trong tutorial vì đó là cơ hội chính luyện nói, và đảm bảo tiếng Pháp viết vững."
      ms: "Bercakap sebanyak mungkin dalam tutorial kerana itu peluang utama melatih lisan, dan pastikan penulisan Perancis anda kukuh."
      id: "Bicara sebanyak mungkin di tutorial karena itu kesempatan utama melatih lisan, dan pastikan bahasa Prancis tulismu kuat."
      hi: "ट्यूटोरियल में जितना हो सके बोलें, क्योंकि बोलने का अभ्यास का यही मुख्य मौका है, और लिखित फ़्रेंच मज़बूत रखें।"
  watch:
    - en: "All these reviews are from 2021 or earlier; teaching and exams may have changed since."
      zh: "这些评价都是 2021 年或更早的，现在的教法和考试可能已经变了。"
      zh-TW: "這些評價都是 2021 年或更早的，現在的教法和考試可能已經變了。"
      ja: "レビューはすべて2021年以前のもの。授業や試験は変わっている可能性がある。"
      ko: "모든 리뷰가 2021년 이전 것이라 지금 수업과 시험은 달라졌을 수 있다."
      vi: "Tất cả đánh giá đều từ năm 2021 trở về trước; cách dạy và thi có thể đã thay đổi."
      ms: "Semua ulasan ini dari 2021 atau lebih awal; pengajaran dan peperiksaan mungkin telah berubah."
      id: "Semua ulasan ini dari 2021 atau sebelumnya; pengajaran dan ujian mungkin sudah berubah."
      hi: "ये सभी रिव्यू 2021 या उससे पहले के हैं; पढ़ाई और परीक्षा अब बदल चुकी हो सकती है।"
difficulty: hard
workload: heavy
