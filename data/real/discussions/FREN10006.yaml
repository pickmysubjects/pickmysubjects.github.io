points:
  - en: "Classes are entirely in French on broad, complex topics such as feminism, Islam in France and the Algerian War; several found the jump from VCE or IB hard."
    zh: "课堂全法语，讨论女性主义、法国的伊斯兰、阿尔及利亚战争等宽泛复杂的话题；好几人觉得从VCE或IB过来跨度很大。"
    zh-TW: "課堂全法語，討論女性主義、法國的伊斯蘭、阿爾及利亞戰爭等寬泛複雜的話題；好幾人覺得從VCE或IB過來跨度很大。"
    ja: "授業はすべてフランス語で、フェミニズム、フランスのイスラム、アルジェリア戦争など広く複雑なテーマを扱う。VCEやIBからの差が大きいと感じた人が多い。"
    ko: "수업은 전부 프랑스어로, 페미니즘, 프랑스의 이슬람, 알제리 전쟁 등 폭넓고 복잡한 주제를 다룸. VCE나 IB에서 올라오면 격차가 크다는 사람이 여럿."
    vi: "Lớp học hoàn toàn bằng tiếng Pháp về các chủ đề rộng và phức tạp như nữ quyền, Hồi giáo ở Pháp và chiến tranh Algérie; nhiều người thấy bước nhảy từ VCE hay IB rất lớn."
    ms: "Kelas sepenuhnya dalam Bahasa Perancis tentang topik luas dan kompleks seperti feminisme, Islam di Perancis dan Perang Algeria; beberapa orang dapati lonjakan dari VCE atau IB sukar."
    id: "Kelas sepenuhnya berbahasa Prancis dengan topik luas dan rumit seperti feminisme, Islam di Prancis, dan Perang Aljazair; beberapa orang merasa lompatan dari VCE atau IB berat."
    hi: "क्लास पूरी तरह फ़्रेंच में होती है, नारीवाद, फ़्रांस में इस्लाम और अल्जीरियाई युद्ध जैसे व्यापक, जटिल विषयों पर; कई लोगों को VCE या IB से यह छलाँग कठिन लगी।"
  - en: "Expect a lot of writing and self-study; speak up in tutorials, as oral skills count. Hard workers still reached H1."
    zh: "写作和自学量很大；辅导课上要积极发言，口语很重要。肯努力的人照样能拿H1。"
    zh-TW: "寫作和自學量很大；輔導課上要積極發言，口說很重要。肯努力的人照樣能拿H1。"
    ja: "書く量と自習が多い。口頭能力も評価されるのでチュートリアルでは積極的に発言すること。努力した人はH1も取れている。"
    ko: "글쓰기와 자습량이 많음. 말하기 능력도 중요하니 튜토리얼에서 적극적으로 말할 것. 열심히 한 사람은 H1도 받음."
    vi: "Viết nhiều và phải tự học nhiều; hãy phát biểu trong tutorial vì kỹ năng nói được tính điểm. Người chăm vẫn đạt H1."
    ms: "Jangkakan banyak penulisan dan belajar sendiri; bercakap dalam tutorial kerana kemahiran lisan dikira. Yang rajin masih mencapai H1."
    id: "Siap banyak menulis dan belajar mandiri; aktiflah bicara di tutorial karena kemampuan lisan dinilai. Yang tekun tetap meraih H1."
    hi: "बहुत लिखना और ख़ुद पढ़ना पड़ता है; ट्यूटोरियल में बोलें, क्योंकि मौखिक कौशल गिना जाता है। मेहनती छात्रों को फिर भी H1 मिला।"
difficulty: hard
workload: heavy
