points:
  - en: "Expect many assignments and a fairly heavy workload, though reviewers found them relevant and fun."
    zh: "作业多、工作量较大，但评价认为作业相关且有趣。"
    zh-TW: "作業多、工作量相當大，但評論者覺得作業切題又有趣。"
    ja: "課題が多く負担もかなり大きいが、内容に沿っていて楽しいという評価。"
    ko: "과제가 많고 공부량도 꽤 크지만, 리뷰어들은 과제가 의미 있고 재미있다고 했다."
    vi: "Có nhiều bài tập và khối lượng khá nặng, dù người đánh giá thấy chúng sát nội dung và vui."
    ms: "Jangka banyak tugasan dan beban kerja agak berat, walaupun pengulas dapati ia relevan dan seronok."
    id: "Siap-siap banyak tugas dan beban cukup berat, meski pengulas merasa tugasnya relevan dan seru."
    hi: "कई असाइनमेंट और काफ़ी भारी वर्कलोड की उम्मीद रखें, हालाँकि रिव्यूअर्स को वे प्रासंगिक और मज़ेदार लगे।"
  - en: "Some knowledge of R is needed for the pracs."
    zh: "实验需要一定的R语言基础。"
    zh-TW: "實驗需要一點R的基礎。"
    ja: "実習にはRの知識が多少必要。"
    ko: "실습에는 R 지식이 어느 정도 필요하다."
    vi: "Cần biết chút R cho các buổi thực hành."
    ms: "Sedikit pengetahuan R diperlukan untuk amali."
    id: "Praktikum butuh sedikit pengetahuan R."
    hi: "प्रैक्टिकल के लिए R की कुछ जानकारी चाहिए।"
  - en: "Communication between staff and students was a weak point for some reviewers."
    zh: "部分评价认为教学人员与学生的沟通较弱。"
    zh-TW: "部分評論者認為教學人員和學生的溝通是弱點。"
    ja: "スタッフと学生のコミュニケーションが弱点だったというレビュアーもいる。"
    ko: "일부 리뷰어는 교직원과 학생 간 소통이 약점이었다고 했다."
    vi: "Với một số người, giao tiếp giữa giảng viên và sinh viên là điểm yếu."
    ms: "Komunikasi antara staf dan pelajar ialah kelemahan bagi sesetengah pengulas."
    id: "Komunikasi antara staf dan mahasiswa jadi titik lemah bagi sebagian pengulas."
    hi: "कुछ रिव्यूअर्स के लिए स्टाफ़ और छात्रों के बीच कम्युनिकेशन कमज़ोर पहलू था।"
workload: heavy
