points:
  - en: "Reviewers liked the mix of theory and practice, with plenty of real ads used as examples; the newest found it better than expected with helpful staff."
    zh: "评价喜欢理论与实践结合，用了很多真实广告当例子；最新的一条说比预期好，教学人员也很帮忙。"
    zh-TW: "評價喜歡理論與實務結合，用了很多真實廣告當例子；最新的一則說比預期好，教學人員也很幫忙。"
    ja: "理論と実践のバランスや実際の広告を多く使う例が好評。最新のレビューは期待以上でスタッフも親切だったと言う。"
    ko: "이론과 실습의 조화, 실제 광고를 많이 활용한 예시가 호평받는다. 최신 리뷰는 기대 이상이었고 교수진도 도움이 됐다고 한다."
    vi: "Mọi người thích sự kết hợp lý thuyết và thực hành, với nhiều quảng cáo thật làm ví dụ; đánh giá mới nhất thấy tốt hơn mong đợi, giảng viên nhiệt tình."
    ms: "Pengulas suka gabungan teori dan amalan, dengan banyak iklan sebenar sebagai contoh; yang terbaru dapati ia lebih baik daripada jangkaan dengan staf yang membantu."
    id: "Pengulas suka perpaduan teori dan praktik, dengan banyak iklan nyata sebagai contoh; yang terbaru merasa lebih baik dari dugaan dengan staf yang membantu."
    hi: "रिव्यूअर्स को थ्योरी और प्रैक्टिस का मेल पसंद आया, उदाहरण के तौर पर कई असली विज्ञापन; सबसे नए को यह उम्मीद से बेहतर और स्टाफ़ मददगार लगा।"
  - en: "Content is easy to follow during semester, but reviewers disagree on the exam: one found a high mark very hard, while the newest says past papers make the essay topics predictable."
    zh: "学期中内容好懂，但对考试看法不一：有人觉得很难拿高分，最新的一条则说看往年试卷就能猜到论述题方向。"
    zh-TW: "學期中內容好懂，但對考試看法不一：有人覺得很難拿高分，最新的一則則說看歷屆試題就能猜到申論題方向。"
    ja: "学期中の内容は分かりやすいが、試験については意見が分かれる。高得点は非常に難しいという声もあれば、最新のものは過去問で論述テーマが予想できると言う。"
    ko: "학기 중 내용은 이해하기 쉽지만 시험에 대해선 의견이 갈린다. 고득점이 매우 어렵다는 사람도 있고, 최신 리뷰는 기출로 에세이 주제를 예측할 수 있다고 한다."
    vi: "Nội dung trong kỳ dễ theo, nhưng ý kiến về bài thi khác nhau: một người thấy rất khó đạt điểm cao, còn bài mới nhất nói đề cũ giúp đoán được chủ đề bài luận."
    ms: "Kandungan mudah diikuti semasa semester, tetapi pendapat tentang peperiksaan berbeza: seorang dapati markah tinggi sangat sukar, manakala yang terbaru kata kertas lepas buat topik esei mudah dijangka."
    id: "Materi mudah diikuti selama semester, tapi soal ujian pendapatnya beda: satu orang merasa nilai tinggi sangat sulit, sementara yang terbaru bilang soal lama membuat topik esai mudah ditebak."
    hi: "सेमेस्टर में सामग्री समझना आसान है, पर परीक्षा पर राय अलग है: एक को ऊँचे अंक बहुत मुश्किल लगे, जबकि सबसे नया कहता है कि पुराने पेपर से निबंध के विषय अंदाज़ा लग जाते हैं।"
  - en: "There is a lot of exam content; the group assignment depends on your team, and the textbook is optional."
    zh: "考试内容多；小组作业看组员，教材可买可不买。"
    zh-TW: "考試內容多；小組作業看組員，教科書可買可不買。"
    ja: "試験範囲は広い。グループ課題はメンバー次第で、教科書は任意。"
    ko: "시험 범위가 넓다. 조별 과제는 팀원에 달렸고 교재는 선택이다."
    vi: "Nội dung thi nhiều; bài nhóm phụ thuộc đồng đội, giáo trình không bắt buộc."
    ms: "Kandungan peperiksaan banyak; tugasan kumpulan bergantung pada pasukan, dan buku teks pilihan."
    id: "Materi ujian banyak; tugas kelompok tergantung tim, dan buku teks opsional."
    hi: "परीक्षा की सामग्री बहुत है; ग्रुप असाइनमेंट टीम पर निर्भर है, और पाठ्यपुस्तक वैकल्पिक है।"
