code: COMP30020
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/comp30020
reviews: 5
from: 2017
to: 2022
checked: 2026-10-08
points:
  - en: "Haskell and Prolog are very different from everyday languages, and the abstract concepts can be challenging."
    zh: "Haskell和Prolog与常用编程语言差别很大，抽象概念较有挑战。"
    zh-TW: "Haskell和Prolog跟日常用的語言差很多，抽象概念可能很有挑戰性。"
    ja: "HaskellとPrologは普段使う言語とはかなり違い、抽象的な概念は難しく感じることがある。"
    ko: "Haskell과 Prolog는 평소 쓰는 언어와 매우 달라서 추상적인 개념이 어려울 수 있다."
    vi: "Haskell và Prolog rất khác các ngôn ngữ thường dùng, và các khái niệm trừu tượng có thể khó."
    ms: "Haskell dan Prolog sangat berbeza daripada bahasa harian, dan konsep abstraknya boleh mencabar."
    id: "Haskell dan Prolog sangat berbeda dari bahasa sehari-hari, dan konsep abstraknya bisa menantang."
    hi: "Haskell और Prolog रोज़ की भाषाओं से बहुत अलग हैं, और एब्स्ट्रैक्ट कॉन्सेप्ट कठिन हो सकते हैं।"
  - en: "Since 2020 the module order was swapped without updating materials, which made the Prolog part confusing; this was still an issue in 2022."
    zh: "2020年起调换了模块顺序但未更新材料，导致Prolog部分混乱，2022年仍有此问题。"
    zh-TW: "2020年起單元順序對調但教材沒更新，讓Prolog部分很混亂；到2022年仍有這問題。"
    ja: "2020年から単元の順番が入れ替わったのに教材が更新されず、Prologの部分が分かりにくくなった。2022年もまだこの問題があった。"
    ko: "2020년부터 모듈 순서가 바뀌었는데 자료가 업데이트되지 않아 Prolog 부분이 혼란스러웠고, 2022년에도 여전했다."
    vi: "Từ 2020 thứ tự module bị đảo mà tài liệu không cập nhật, khiến phần Prolog khó hiểu; năm 2022 vẫn còn vấn đề này."
    ms: "Sejak 2020 susunan modul ditukar tanpa mengemas kini bahan, menjadikan bahagian Prolog mengelirukan; ia masih isu pada 2022."
    id: "Sejak 2020 urutan modul ditukar tanpa memperbarui materi, sehingga bagian Prolog membingungkan; ini masih jadi masalah di 2022."
    hi: "2020 से मॉड्यूल का क्रम बदला गया पर मटेरियल अपडेट नहीं हुआ, जिससे Prolog वाला हिस्सा उलझाऊ बना; 2022 में भी यह समस्या थी।"
  - en: "Opinions are split. Students who like pure programming and problem solving enjoyed it; others felt it had little practical use."
    zh: "看法不一：喜欢纯编程和解题的学生很享受，其他人觉得实用性不强。"
    zh-TW: "看法不一。喜歡純寫程式和解題的學生很享受；其他人覺得實用性不高。"
    ja: "評価は分かれる。純粋なプログラミングや問題解決が好きな人は楽しめたが、実用性が低いと感じた人もいる。"
    ko: "의견은 갈린다. 순수 프로그래밍과 문제 해결을 좋아하는 학생은 즐겼지만, 실용성이 낮다고 느낀 사람도 있다."
    vi: "Ý kiến trái chiều. Ai thích lập trình thuần túy và giải bài toán thì thích môn này; người khác thấy ít ứng dụng thực tế."
    ms: "Pandangan berbelah bahagi. Pelajar yang suka pengaturcaraan tulen dan penyelesaian masalah menikmatinya; yang lain rasa kurang kegunaan praktikal."
    id: "Pendapat terbelah. Mahasiswa yang suka pemrograman murni dan pemecahan masalah menikmatinya; yang lain merasa kurang berguna secara praktis."
    hi: "राय बंटी है। शुद्ध प्रोग्रामिंग और प्रॉब्लम सॉल्विंग पसंद करने वालों को मज़ा आया; बाकी को इसका व्यावहारिक उपयोग कम लगा।"
  - en: "Start projects early. Tutors and the online forum were helpful, and exams resemble the tutorials."
    zh: "项目要尽早开始；助教和线上论坛很有帮助，考试与辅导题相似。"
    zh-TW: "專題要早點開始。助教和線上論壇很有幫助，考試和輔導題很像。"
    ja: "プロジェクトは早めに始めよう。チューターとオンライン掲示板が役立ち、試験はチュートリアルに似ている。"
    ko: "프로젝트는 일찍 시작하자. 튜터와 온라인 포럼이 도움이 되었고, 시험은 튜토리얼과 비슷하다."
    vi: "Bắt đầu project sớm. Trợ giảng và diễn đàn online rất hữu ích, và đề thi giống bài tutorial."
    ms: "Mulakan projek awal. Tutor dan forum dalam talian membantu, dan peperiksaan menyerupai tutorial."
    id: "Mulai proyek lebih awal. Tutor dan forum online membantu, dan ujiannya mirip tutorial."
    hi: "प्रोजेक्ट जल्दी शुरू करें। ट्यूटर और ऑनलाइन फ़ोरम मददगार थे, और परीक्षा ट्यूटोरियल जैसी होती है।"
sections:
  content:
    - en: "Declarative programming in Haskell and Prolog, very different from everyday languages like Java or Python. Some found it fun and interesting; others found it abstract and of little practical use."
      zh: "用 Haskell 和 Prolog 学声明式编程，和 Java、Python 等常用语言很不一样。有人觉得有趣；也有人觉得抽象、不太实用。"
      zh-TW: "用 Haskell 和 Prolog 學宣告式程式設計，和 Java、Python 等常用語言很不一樣。有人覺得有趣；也有人覺得抽象、不太實用。"
      ja: "HaskellとPrologで学ぶ宣言型プログラミングで、JavaやPythonとは大きく違う。楽しく面白いという人もいれば、抽象的で実用性が低いという人も。"
      ko: "Haskell과 Prolog로 배우는 선언형 프로그래밍으로 Java나 Python과 매우 다르다. 재미있다는 사람도, 추상적이고 실용성이 낮다는 사람도 있다."
      vi: "Lập trình khai báo với Haskell và Prolog, rất khác các ngôn ngữ quen như Java hay Python. Có người thấy vui và thú vị; người khác thấy trừu tượng, ít dùng thực tế."
      ms: "Pengaturcaraan deklaratif dalam Haskell dan Prolog, sangat berbeza daripada bahasa harian seperti Java atau Python. Ada yang rasa seronok; ada yang rasa abstrak dan kurang praktikal."
      id: "Pemrograman deklaratif dengan Haskell dan Prolog, sangat berbeda dari bahasa sehari-hari seperti Java atau Python. Ada yang merasa seru; ada yang merasa abstrak dan kurang praktis."
      hi: "Haskell और Prolog में डिक्लेरेटिव प्रोग्रामिंग, Java या Python जैसी रोज़ की भाषाओं से बहुत अलग। कुछ को मज़ेदार और रोचक लगा; कुछ को अमूर्त और कम व्यावहारिक।"
  work:
    - en: "Projects you can't find similar examples for, so they need creativity; don't leave them to the last day. One reviewer says the exam is close to the tutorial questions."
      zh: "项目找不到类似的参考，需要创意；别拖到最后一天。有同学说期末和 tutorial 题很像。"
      zh-TW: "專題找不到類似的參考，需要創意；別拖到最後一天。有同學說期末和 tutorial 題很像。"
      ja: "似た例が見つからないプロジェクトなので創意工夫が必要。最終日まで残さないこと。試験はチュートリアルの問題に近いという人も。"
      ko: "비슷한 예를 찾을 수 없는 프로젝트라 창의력이 필요하니 마지막 날까지 미루지 말 것. 시험은 튜토리얼 문제와 비슷하다는 리뷰도 있다."
      vi: "Các dự án không tìm được ví dụ tương tự nên cần sáng tạo; đừng để tới ngày cuối. Một người nói đề thi gần với câu hỏi tutorial."
      ms: "Projek yang tiada contoh serupa, jadi perlu kreatif; jangan tangguh hingga hari terakhir. Seorang kata peperiksaan hampir sama dengan soalan tutorial."
      id: "Proyek yang tak ada contoh serupa, jadi butuh kreativitas; jangan tunda sampai hari terakhir. Satu bilang ujian mirip soal tutorial."
      hi: "ऐसे प्रोजेक्ट जिनके मिलते-जुलते उदाहरण नहीं मिलते, तो रचनात्मकता चाहिए; आख़िरी दिन तक न छोड़ें। एक कहता है परीक्षा ट्यूटोरियल सवालों के क़रीब है।"
  watch:
    - en: "In 2020 the Prolog and Haskell halves were swapped without updating the materials, which confused students; a 2022 reviewer says it still wasn't fixed. Forum support was praised in 2022."
      zh: "2020 年把 Prolog 和 Haskell 两部分调换了顺序，但材料没改，让学生很困惑；一位 2022 年的同学说还没改好。2022 年论坛答疑受到好评。"
      zh-TW: "2020 年把 Prolog 和 Haskell 兩部分調換了順序，但教材沒改，讓學生很困惑；一位 2022 年的同學說還沒改好。2022 年論壇答疑受到好評。"
      ja: "2020年にPrologとHaskellの順序が入れ替えられたが教材は更新されず混乱を招いた。2022年の一人はまだ直っていないと言う。2022年は掲示板のサポートが好評。"
      ko: "2020년에 Prolog와 Haskell 순서를 바꾸고도 자료를 고치지 않아 혼란스러웠고, 2022년 리뷰는 여전히 안 고쳐졌다고 한다. 2022년엔 포럼 지원이 호평받았다."
      vi: "Năm 2020 hai phần Prolog và Haskell bị đổi chỗ mà không cập nhật tài liệu, gây rối; người năm 2022 nói vẫn chưa sửa. Hỗ trợ trên diễn đàn năm 2022 được khen."
      ms: "Pada 2020 bahagian Prolog dan Haskell ditukar tanpa mengemas kini bahan, mengelirukan pelajar; pengulas 2022 kata masih belum dibaiki. Sokongan forum dipuji pada 2022."
      id: "Pada 2020 bagian Prolog dan Haskell ditukar tanpa memperbarui materi, membingungkan mahasiswa; pengulas 2022 bilang masih belum diperbaiki. Dukungan forum dipuji pada 2022."
      hi: "2020 में Prolog और Haskell वाले हिस्से बिना सामग्री बदले आगे-पीछे कर दिए गए, जिससे छात्र उलझे; 2022 का एक कहता है यह अब भी ठीक नहीं हुआ। 2022 में फ़ोरम सहायता की तारीफ़ हुई।"
difficulty: mixed
