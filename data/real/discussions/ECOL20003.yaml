points:
  - en: "Pracs and fieldwork were enjoyed by most reviewers, though one found the online pracs messy."
    zh: "多数人喜欢实验和野外考察，但有人认为线上实验组织混乱。"
    zh-TW: "多數評論者喜歡實驗和野外工作，不過有一位覺得線上實驗很亂。"
    ja: "実習とフィールドワークはほとんどのレビュアーに好評だったが、オンライン実習はごちゃごちゃしていたという声もある。"
    ko: "대부분의 리뷰어는 실습과 현장 조사를 즐겼지만, 한 명은 온라인 실습이 엉망이었다고 했다."
    vi: "Đa số thích thực hành và đi thực địa, dù có người thấy phần thực hành online lộn xộn."
    ms: "Amali dan kerja lapangan disukai kebanyakan pengulas, walaupun seorang dapati amali dalam talian berselerak."
    id: "Praktikum dan kerja lapangan disukai kebanyakan pengulas, meski satu orang merasa praktikum online berantakan."
    hi: "ज़्यादातर रिव्यूअर्स को प्रैक्टिकल और फ़ील्डवर्क पसंद आए, हालाँकि एक को ऑनलाइन प्रैक्टिकल अव्यवस्थित लगे।"
  - en: "The exam had ambiguous questions, and studying felt broad since you are pointed to the whole textbook."
    zh: "考试有含糊不清的题目，复习范围很广，基本要看整本教材。"
    zh-TW: "考試有模稜兩可的題目，而且被指向整本課本，複習範圍感覺很廣。"
    ja: "試験には曖昧な問題があり、教科書全体を指定されるので勉強範囲が広く感じる。"
    ko: "시험에 모호한 문제가 있었고, 교재 전체를 보라고 해서 공부 범위가 넓게 느껴졌다."
    vi: "Đề thi có câu hỏi mơ hồ, và việc ôn tập thấy rất rộng vì được chỉ cả cuốn giáo trình."
    ms: "Peperiksaan ada soalan yang samar, dan ulang kaji terasa luas kerana anda dirujuk kepada seluruh buku teks."
    id: "Ujian punya soal yang ambigu, dan belajar terasa luas karena kamu diarahkan ke seluruh buku teks."
    hi: "परीक्षा में अस्पष्ट सवाल थे, और पढ़ाई का दायरा बड़ा लगा क्योंकि पूरी टेक्स्टबुक पढ़ने को कहा जाता है।"
  - en: "Opinions on teaching quality are split, from pleasant to poor."
    zh: "对教学质量看法不一，从还不错到较差都有。"
    zh-TW: "對教學品質看法不一，從還不錯到很差都有。"
    ja: "授業の質の評価は、良いから悪いまで分かれる。"
    ko: "강의 질에 대한 의견은 괜찮다부터 나쁘다까지 갈린다."
    vi: "Ý kiến về chất lượng giảng dạy khác nhau, từ dễ chịu đến kém."
    ms: "Pandangan tentang kualiti pengajaran berbeza, dari menyenangkan hingga lemah."
    id: "Pendapat soal kualitas pengajaran terbelah, dari menyenangkan sampai buruk."
    hi: "पढ़ाई की क्वालिटी पर राय बंटी है, अच्छी से लेकर ख़राब तक।"
