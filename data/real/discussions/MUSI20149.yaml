points:
  - en: "Most call it an easy WAM booster, especially as an online summer breadth, needing only a few hours a week."
    zh: "多数人认为是提分课，尤其适合暑期网课当通识，每周只需几小时。"
    zh-TW: "多數人認為是提分課，尤其適合暑期線上當通識，每週只需幾小時。"
    ja: "GPA稼ぎの楽な科目という声が多い。特に夏期オンラインの選択科目として週数時間で済む。"
    ko: "대부분 학점 올리기 쉬운 과목이라 함. 특히 여름 온라인 교양으로 주당 몇 시간이면 충분."
    vi: "Đa số coi đây là môn kéo điểm dễ, nhất là học online mùa hè làm môn breadth, chỉ vài giờ mỗi tuần."
    ms: "Ramai kata ia mudah naikkan WAM, terutama sebagai breadth musim panas dalam talian, beberapa jam seminggu."
    id: "Banyak yang bilang pendongkrak IPK mudah, terutama sebagai breadth daring musim panas, cukup beberapa jam seminggu."
    hi: "ज़्यादातर इसे आसान WAM बूस्टर कहते हैं, ख़ासकर ऑनलाइन समर ब्रेड्थ के रूप में, हफ़्ते में कुछ घंटे।"
  - en: "Don't underestimate the weekly quizzes: details come from the lecture and podcast, so read the transcripts first."
    zh: "别小看每周测验：细节出自讲课和播客，先读文字稿。"
    zh-TW: "別小看每週測驗：細節出自講課和播客，先讀逐字稿。"
    ja: "毎週の小テストは侮れない。講義やポッドキャストの細部が出るので、先に書き起こしを読むこと。"
    ko: "주간 퀴즈를 얕보지 말 것. 강의·팟캐스트 세부 내용이 나오니 녹취록을 먼저 읽기."
    vi: "Đừng xem nhẹ quiz hằng tuần: chi tiết lấy từ bài giảng và podcast, nên đọc bản ghi trước."
    ms: "Jangan pandang ringan kuiz mingguan: butiran dari kuliah dan podcast, baca transkrip dahulu."
    id: "Jangan remehkan kuis mingguan: detailnya dari kuliah dan podcast, baca transkrip dulu."
    hi: "साप्ताहिक क्विज़ को हल्का न लें: बारीकियाँ लेक्चर और पॉडकास्ट से आती हैं, पहले ट्रांसक्रिप्ट पढ़ें।"
  - en: "The 60% essay is where marks are lost; several found it harshly marked. Follow the rubric and add your own experience."
    zh: "60%的论文最容易失分，有人觉得评分严格。照评分标准写，并加入个人经历。"
    zh-TW: "60%的論文最容易失分，有人覺得評分嚴格。照評分標準寫，並加入個人經歷。"
    ja: "失点しやすいのは60%の論文で、採点が厳しいとの声も。ルーブリックに沿い、自分の経験を入れること。"
    ko: "점수를 잃는 건 60% 에세이. 채점이 엄격하다는 의견도. 루브릭을 따르고 개인 경험을 넣을 것."
    vi: "Bài luận 60% là chỗ dễ mất điểm, vài người thấy chấm khắt. Bám rubric và thêm trải nghiệm riêng."
    ms: "Esei 60% ialah tempat markah hilang; ada yang rasa penilaian ketat. Ikut rubrik dan masukkan pengalaman sendiri."
    id: "Esai 60% tempat nilai hilang; beberapa merasa penilaiannya ketat. Ikuti rubrik dan sertakan pengalaman pribadi."
    hi: "60% वाला निबंध अंक गँवाने की जगह है; कुछ को जाँच सख़्त लगी। रूब्रिक मानें और अपना अनुभव जोड़ें।"
  - en: "Opinions on the content are split: some found it fun and thought-provoking, others dry and forgettable."
    zh: "对内容评价不一：有人觉得有趣、发人深思，也有人觉得枯燥、学完就忘。"
    zh-TW: "對內容評價不一：有人覺得有趣、發人深省，也有人覺得枯燥、學完就忘。"
    ja: "内容の評価は分かれる。面白く考えさせられるという声と、退屈で記憶に残らないという声。"
    ko: "내용 평가는 갈림. 재미있고 생각할 거리가 많다는 쪽과 지루하고 기억에 안 남는다는 쪽."
    vi: "Ý kiến về nội dung chia hai: có người thấy thú vị, có người thấy khô khan, học xong là quên."
    ms: "Pendapat tentang kandungan berbelah: ada yang rasa menarik, ada yang rasa hambar."
    id: "Pendapat soal isi terbelah: ada yang merasa seru dan menggugah, ada yang merasa kering."
    hi: "विषय-वस्तु पर राय बँटी है: कुछ को मज़ेदार और विचारोत्तेजक लगा, कुछ को नीरस।"
sections:
  content:
    - en: "Music, emotion and cognition, often taken online in summer as a low-workload breadth. Some found the topics fun; many found the content not very engaging."
      zh: "讲音乐、情绪和认知，很多人在暑期网课修，当作轻松的 breadth。有人觉得话题有趣；也有不少人觉得内容不太吸引人。"
      zh-TW: "講音樂、情緒和認知，很多人在暑期線上修，當作輕鬆的 breadth。有人覺得主題有趣；也有不少人覺得內容不太吸引人。"
      ja: "音楽・感情・認知を扱い、負担の軽いブレドスとして夏にオンラインで取る人が多い。テーマが楽しいという声もあるが、あまり引き込まれないという声も多い。"
      ko: "음악, 정서, 인지를 다루며 부담 적은 브레드스로 여름에 온라인으로 듣는 경우가 많다. 주제가 재미있다는 사람도, 별로 흥미롭지 않다는 사람도 많다."
      vi: "Về âm nhạc, cảm xúc và nhận thức, thường học trực tuyến hè như môn breadth nhẹ. Có người thấy chủ đề vui; nhiều người thấy nội dung không mấy cuốn hút."
      ms: "Muzik, emosi dan kognisi, sering diambil dalam talian pada musim panas sebagai breadth ringan. Ada yang rasa topiknya seronok; ramai rasa kandungan kurang menarik."
      id: "Musik, emosi dan kognisi, sering diambil daring saat musim panas sebagai breadth ringan. Sebagian merasa topiknya seru; banyak yang merasa materinya kurang menarik."
      hi: "संगीत, भावना और संज्ञान, जिसे अक्सर हल्के ब्रेड्थ के रूप में गर्मियों में ऑनलाइन लिया जाता है। कुछ को विषय मज़ेदार लगे; कई को कंटेंट ज़्यादा दिलचस्प नहीं लगा।"
  work:
    - en: "Weekly four-question multiple-choice quizzes on short videos and podcasts, and a critical essay worth about 60%. Reviewers disagree on whether the essay is marked harshly or generously."
      zh: "每周基于短视频和播客的四道选择题小测，加一篇约占 60% 的评析论文。论文给分严还是松，同学看法不一。"
      zh-TW: "每週根據短片和 podcast 的四題選擇題小考，加一篇約佔 60% 的評析論文。論文給分嚴還是鬆，同學看法不一。"
      ja: "短い動画とポッドキャストに基づく毎週4問の選択式小テストと、約60%の批評エッセイ。エッセイの採点が厳しいか甘いかは意見が分かれる。"
      ko: "짧은 영상과 팟캐스트를 바탕으로 한 주간 4문항 객관식 퀴즈와 약 60%의 비평 에세이가 있다. 에세이 채점이 박한지 후한지는 의견이 갈린다."
      vi: "Quiz trắc nghiệm bốn câu hằng tuần dựa trên video ngắn và podcast, và một bài luận phản biện khoảng 60%. Ý kiến khác nhau về việc bài luận chấm gắt hay rộng rãi."
      ms: "Kuiz aneka pilihan empat soalan mingguan berdasarkan video pendek dan podcast, serta esei kritis kira-kira 60%. Pengulas tidak sepakat sama ada esei dinilai keras atau longgar."
      id: "Kuis pilihan ganda empat soal tiap minggu dari video pendek dan podcast, dan esai kritis sekitar 60%. Pengulas tidak sepakat apakah esainya dinilai keras atau longgar."
      hi: "छोटे वीडियो और पॉडकास्ट पर हर हफ़्ते चार सवालों के MCQ क्विज़, और लगभग 60% का आलोचनात्मक निबंध। निबंध की मार्किंग सख़्त है या नरम, इस पर राय बँटी है।"
  study:
    - en: "Do each quiz right after the video and podcast, with notes or the transcript if one is available, and check answers before submitting. For the essay, follow the rubric and bring in your own background."
      zh: "看完视频和播客后马上做小测，有讲稿就用讲稿，没有就记笔记；提交前检查答案。论文按评分标准写，并结合自己的背景经历。"
      zh-TW: "看完影片和 podcast 後馬上做小考，有逐字稿就用，沒有就做筆記；提交前檢查答案。論文照評分標準寫，並結合自己的背景經歷。"
      ja: "動画とポッドキャストを見た直後に小テストを受け、書き起こしがあれば使い、なければメモを取る。提出前に見直す。エッセイはルーブリックに従い、自分の経験を盛り込む。"
      ko: "영상과 팟캐스트를 본 직후 퀴즈를 풀고, 스크립트가 있으면 활용하고 없으면 메모하라. 제출 전 답을 확인하라. 에세이는 루브릭을 따르고 자신의 배경을 녹여라."
      vi: "Làm quiz ngay sau khi xem video và podcast, dùng bản ghi nếu có hoặc ghi chép, và kiểm tra lại trước khi nộp. Với bài luận, bám rubric và đưa trải nghiệm của bạn vào."
      ms: "Buat kuiz sejurus selepas video dan podcast, guna nota atau transkrip jika ada, dan semak jawapan sebelum hantar. Untuk esei, ikut rubrik dan masukkan latar belakang anda sendiri."
      id: "Kerjakan kuis tepat setelah video dan podcast, pakai catatan atau transkrip kalau ada, dan cek jawaban sebelum mengirim. Untuk esai, ikuti rubrik dan masukkan latar belakangmu sendiri."
      hi: "वीडियो और पॉडकास्ट के तुरंत बाद क्विज़ करें, ट्रांसक्रिप्ट हो तो उसका, वरना नोट्स का सहारा लें, और जमा करने से पहले जाँचें। निबंध में रूब्रिक मानें और अपना अनुभव जोड़ें।"
  watch:
    - en: "The quizzes are trickier than they look; several got low marks on the first ones. A 2026 reviewer said no transcripts were given and suggested another music breadth instead."
      zh: "小测比看起来难，好几位前几次都考得很低。2026 年有同学说没有提供讲稿，建议改修别的音乐类 breadth。"
      zh-TW: "小考比看起來難，好幾位前幾次都考得很低。2026 年有同學說沒有提供逐字稿，建議改修別的音樂類 breadth。"
      ja: "小テストは見た目より難しく、最初の数回で低得点だった人が複数。2026年には書き起こしが提供されず、他の音楽系ブレドスを勧める声も。"
      ko: "퀴즈는 보기보다 까다로워 초반에 낮은 점수를 받은 사람이 여럿이다. 2026년 한 리뷰어는 스크립트가 제공되지 않았다며 다른 음악 브레드스를 권했다."
      vi: "Quiz khó hơn vẻ ngoài; vài người bị điểm thấp ở mấy bài đầu. Một người năm 2026 nói không có bản ghi và khuyên học môn breadth âm nhạc khác."
      ms: "Kuiz lebih rumit daripada yang disangka; beberapa dapat markah rendah pada kuiz awal. Seorang pengulas 2026 kata tiada transkrip diberi dan cadangkan breadth muzik lain."
      id: "Kuisnya lebih rumit dari kelihatannya; beberapa dapat nilai rendah di kuis awal. Satu pengulas 2026 bilang tidak ada transkrip dan menyarankan breadth musik lain."
      hi: "क्विज़ दिखने से ज़्यादा पेचीदा हैं; कई के शुरुआती क्विज़ में अंक कम आए। 2026 के एक रिव्यूअर ने कहा ट्रांसक्रिप्ट नहीं मिले और कोई दूसरा संगीत ब्रेड्थ लेने की सलाह दी।"
workload: light
difficulty: easy
