points:
  - en: "The French Revolution taught with a focus on regional and social detail rather than the big picture of events. Several found this hard to follow without prior knowledge."
    zh: "讲法国大革命，侧重地区和社会细节而非事件全貌。好几人觉得没有先备知识很难跟上。"
    zh-TW: "講法國大革命，側重地區和社會細節而非事件全貌。好幾個人覺得沒有先備知識很難跟上。"
    ja: "フランス革命を、出来事の全体像より地域や社会の細部に焦点を当てて扱う。予備知識がないと追いにくいという声が複数。"
    ko: "프랑스 혁명을 사건 전체보다는 지역·사회적 세부에 초점을 맞춰 다룸. 사전 지식 없이는 따라가기 어렵다는 의견이 여럿."
    vi: "Học về Cách mạng Pháp, tập trung vào chi tiết vùng miền và xã hội hơn là bức tranh tổng thể. Nhiều người thấy khó theo nếu chưa có kiến thức trước."
    ms: "Revolusi Perancis diajar dengan fokus pada butiran serantau dan sosial, bukan gambaran besar peristiwa. Beberapa orang dapati sukar diikuti tanpa pengetahuan awal."
    id: "Revolusi Prancis diajarkan dengan fokus pada detail regional dan sosial, bukan gambaran besar peristiwa. Beberapa orang merasa sulit diikuti tanpa pengetahuan awal."
    hi: "फ़्रांसीसी क्रांति को घटनाओं की बड़ी तस्वीर के बजाय क्षेत्रीय और सामाजिक बारीकियों पर ध्यान देकर पढ़ाया जाता है। कई को पूर्व ज्ञान के बिना इसे समझना कठिन लगा।"
  - en: "Workload is manageable and tutorials were often the best part, but assignments were marked strictly. The most recent reviews (2019-2021) are mostly negative, partly because of reused recorded lectures."
    zh: "工作量可控，辅导课常是最好的部分，但作业评分严格。最近的评论（2019-2021）大多负面，部分原因是讲座重复使用旧录像。"
    zh-TW: "工作量可控，輔導課常是最好的部分，但作業評分嚴格。最近的評論（2019-2021）大多負面，部分原因是講座重複使用舊錄影。"
    ja: "負担は適度でチュートリアルが一番良かったという声が多いが、課題の採点は厳しい。最近のレビュー（2019-2021）は否定的なものが多く、録画講義の使い回しも一因。"
    ko: "부담은 적당하고 튜토리얼이 가장 좋았다는 평이 많지만 과제 채점은 엄격. 최근 리뷰(2019-2021)는 대부분 부정적이며, 녹화 강의 재사용도 한 이유."
    vi: "Khối lượng vừa phải và tutorial thường là phần hay nhất, nhưng bài tập chấm khắt khe. Các đánh giá gần nhất (2019-2021) phần lớn tiêu cực, một phần vì dùng lại bài giảng ghi hình cũ."
    ms: "Beban kerja boleh diurus dan tutorial sering bahagian terbaik, tetapi tugasan dimarkah dengan ketat. Ulasan terkini (2019-2021) kebanyakannya negatif, sebahagiannya kerana kuliah rakaman diguna semula."
    id: "Beban kerja wajar dan tutorial sering jadi bagian terbaik, tapi tugas dinilai ketat. Ulasan terbaru (2019-2021) kebanyakan negatif, sebagian karena kuliah rekaman lama dipakai ulang."
    hi: "वर्कलोड संभालने लायक है और ट्यूटोरियल अक्सर सबसे अच्छा हिस्सा रहे, पर असाइनमेंट की मार्किंग सख़्त थी। हाल के रिव्यू (2019-2021) ज़्यादातर नकारात्मक हैं, कुछ हद तक पुराने रिकॉर्डेड लेक्चर दोबारा इस्तेमाल होने से।"
