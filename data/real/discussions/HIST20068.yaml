from: 2013
to: 2021
checked: 2026-10-17
points:
  - en: "The French Revolution taught with a focus on regional and social detail rather than the big picture of events. Several found this hard to follow without prior knowledge."
    zh: "讲法国大革命，侧重地区和社会细节而非事件全貌。好几人觉得没有先备知识很难跟上。"
    zh-TW: "講法國大革命，側重地區和社會細節而非事件全貌。好幾個人覺得沒有先備知識很難跟上。"
    ja: "フランス革命を、出来事の全体像より地域や社会の細部に焦点を当てて扱う。予備知識がないと追いにくいという声が複数。"
    ko: "프랑스 혁명을 사건 전체보다는 지역·사회적 세부에 초점을 맞춰 다룸. 사전 지식 없이는 따라가기 어렵다는 의견이 여럿."
    vi: "Học về Cách mạng Pháp, tập trung vào chi tiết vùng miền và xã hội hơn là bức tranh tổng thể. Nhiều người thấy khó theo nếu chưa có kiến thức trước."
    ms: "Revolusi Perancis diajar dengan fokus pada butiran serantau dan sosial, bukan gambaran besar peristiwa. Beberapa orang dapati sukar diikuti tanpa pengetahuan awal."
    id: "Revolusi Prancis diajarkan dengan fokus pada detail regional dan sosial, bukan gambaran besar peristiwa. Beberapa orang merasa sulit diikuti tanpa pengetahuan awal."
    hi: "फ़्रांसीसी क्रांति को घटनाओं की बड़ी तस्वीर के बजाय क्षेत्रीय और सामाजिक बारीकियों पर ध्यान देकर पढ़ाया जाता है। कई को पूर्व ज्ञान के बिना इसे समझना कठिन लगा।"
  - en: "Workload is manageable and tutorials were often the best part, but assignments were marked strictly. The most recent reviews (2019-2021) are mostly negative, partly because of reused recorded lectures."
    zh: "工作量可控，辅导课常是最好的部分，但作业评分严格。最近的评论（2019-2021）大多负面，部分原因是讲座重复使用旧录像。"
    zh-TW: "工作量可控，輔導課常是最好的部分，但作業評分嚴格。最近的評論（2019-2021）大多負面，部分原因是講座重複使用舊錄影。"
    ja: "負担は適度でチュートリアルが一番良かったという声が多いが、課題の採点は厳しい。最近のレビュー（2019-2021）は否定的なものが多く、録画講義の使い回しも一因。"
    ko: "부담은 적당하고 튜토리얼이 가장 좋았다는 평이 많지만 과제 채점은 엄격. 최근 리뷰(2019-2021)는 대부분 부정적이며, 녹화 강의 재사용도 한 이유."
    vi: "Khối lượng vừa phải và tutorial thường là phần hay nhất, nhưng bài tập chấm khắt khe. Các đánh giá gần nhất (2019-2021) phần lớn tiêu cực, một phần vì dùng lại bài giảng ghi hình cũ."
    ms: "Beban kerja boleh diurus dan tutorial sering bahagian terbaik, tetapi tugasan dimarkah dengan ketat. Ulasan terkini (2019-2021) kebanyakannya negatif, sebahagiannya kerana kuliah rakaman diguna semula."
    id: "Beban kerja wajar dan tutorial sering jadi bagian terbaik, tapi tugas dinilai ketat. Ulasan terbaru (2019-2021) kebanyakan negatif, sebagian karena kuliah rekaman lama dipakai ulang."
    hi: "वर्कलोड संभालने लायक है और ट्यूटोरियल अक्सर सबसे अच्छा हिस्सा रहे, पर असाइनमेंट की मार्किंग सख़्त थी। हाल के रिव्यू (2019-2021) ज़्यादातर नकारात्मक हैं, कुछ हद तक पुराने रिकॉर्डेड लेक्चर दोबारा इस्तेमाल होने से।"
sections:
  content:
    - en: "Reviewers are split. Early ones loved the depth and the tutorial discussions; later ones found lectures focused on small social details and glossed over major events, making them hard to follow."
      zh: "评价两极。较早的同学喜欢讲得深、tutorial 讨论好；后来的同学觉得讲课抓着细枝末节的社会文化细节，重大事件一笔带过，很难跟上脉络。"
      zh-TW: "評價兩極。較早的同學喜歡講得深、tutorial 討論好；後來的同學覺得講課抓著細枝末節的社會文化細節，重大事件一筆帶過，很難跟上脈絡。"
      ja: "評価は割れる。初期のレビューは深さと議論を褒め、後のレビューは講義が細かい社会的話題に偏り大事件を素通りして流れが追いにくいと言う。"
      ko: "평가는 갈린다. 예전 리뷰는 깊이와 토론을 좋아했고, 최근 리뷰는 강의가 작은 사회적 디테일에 치중하고 큰 사건을 대충 넘겨 흐름을 따라가기 어렵다고 했다."
      vi: "Ý kiến chia rẽ. Người học trước thích độ sâu và thảo luận tutorial; người sau thấy bài giảng sa vào chi tiết xã hội nhỏ, lướt qua sự kiện lớn, khó theo dõi."
      ms: "Pandangan berbelah. Pengulas awal suka kedalaman dan perbincangan tutorial; yang kemudian rasa kuliah fokus pada butiran sosial kecil dan melangkau peristiwa besar, sukar diikuti."
      id: "Pendapat terbelah. Pengulas awal suka kedalaman dan diskusi tutorial; yang belakangan merasa kuliah terfokus pada detail sosial kecil dan melewatkan peristiwa besar, sulit diikuti."
      hi: "राय बँटी है। पहले वालों को गहराई और ट्यूटोरियल चर्चा पसंद आई; बाद वालों को लगा लेक्चर छोटी सामाजिक बातों पर टिके रहे, बड़ी घटनाएँ छोड़ दीं, जिससे समझना मुश्किल हुआ।"
  work:
    - en: "Assessments are standard for arts, but several reviewers say they're marked strictly, and one felt you lose marks if you don't take the angle the tutors expect."
      zh: "考核是文科常见形式，但好几位说批改很严，有人觉得不按 tutor 期待的角度写就会被扣很多分。"
      zh-TW: "考核是文科常見形式，但好幾位說批改很嚴，有人覺得不照 tutor 期待的角度寫就會被扣很多分。"
      ja: "課題は文系として標準的だが、採点が厳しいという声が複数。チューターの期待する切り口でないと大きく減点されたと感じた人も。"
      ko: "평가는 인문계 표준이지만 채점이 엄격하다는 평이 여럿이고, 튜터가 원하는 관점으로 안 쓰면 크게 감점된다고 느낀 사람도 있다."
      vi: "Bài đánh giá theo kiểu thường thấy của ngành nghệ thuật, nhưng nhiều người nói chấm khắt khe; một người thấy bị trừ nhiều nếu không đi theo hướng tutor muốn."
      ms: "Penilaian biasa bagi subjek sastera, tetapi beberapa pengulas kata pemarkahan ketat; seorang rasa hilang markah jika tidak ikut sudut yang tutor mahu."
      id: "Penilaian standar untuk mata kuliah humaniora, tapi beberapa pengulas bilang penilaiannya ketat; satu merasa nilai dipotong jika tidak mengikuti sudut pandang yang diinginkan tutor."
      hi: "आकलन आर्ट्स के लिए सामान्य हैं, पर कई रिव्यूअर्स कहते हैं जाँच सख़्त है, और एक को लगा ट्यूटर की अपेक्षित दिशा न लें तो अंक कटते हैं।"
  watch:
    - en: "Some reviewers suggest knowing the basic events of the Revolution beforehand. In 2021 lectures were reused recordings, and all reviews are from 2021 or earlier, so it may have changed."
      zh: "有同学建议先了解法国大革命的基本事件。2021 年的讲课是旧录像；所有评价都是 2021 年或更早的，课程可能已经变了。"
      zh-TW: "有同學建議先了解法國大革命的基本事件。2021 年的講課是舊錄影；所有評價都是 2021 年或更早的，課程可能已經變了。"
      ja: "革命の基本的な出来事を事前に知っておくと良いという声も。2021年は講義が録画の使い回しで、レビューはすべて2021年以前なので変わっている可能性がある。"
      ko: "혁명의 기본 사건을 미리 알아두라는 의견도 있다. 2021년엔 강의가 예전 녹화였고, 리뷰가 모두 2021년 이전이라 바뀌었을 수 있다."
      vi: "Vài người khuyên nên biết trước các sự kiện cơ bản của Cách mạng. Năm 2021 bài giảng là bản ghi cũ, và mọi đánh giá đều từ 2021 trở về trước nên môn có thể đã đổi."
      ms: "Ada yang cadang ketahui peristiwa asas Revolusi dahulu. Pada 2021 kuliah ialah rakaman lama, dan semua ulasan dari 2021 atau lebih awal, jadi mungkin telah berubah."
      id: "Ada yang menyarankan tahu dulu peristiwa dasar Revolusi. Pada 2021 kuliahnya rekaman lama, dan semua ulasan dari 2021 atau sebelumnya, jadi mungkin sudah berubah."
      hi: "कुछ कहते हैं क्रांति की बुनियादी घटनाएँ पहले से जान लें। 2021 में लेक्चर पुरानी रिकॉर्डिंग थे, और सभी रिव्यू 2021 या पहले के हैं, तो विषय बदल गया हो सकता है।"
