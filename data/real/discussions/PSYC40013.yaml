points:
  - en: "All three reviewers say the semester-long research project is the best part, including presenting it to the class."
    zh: "三位评论者都说，贯穿整个学期的研究项目（包括课堂展示）是最大亮点。"
    zh-TW: "三位評論者都說，貫穿整個學期的研究專案（包括課堂展示）是最大亮點。"
    ja: "3人とも、学期を通した研究プロジェクト（クラス発表を含む）が一番良かったと述べている。"
    ko: "세 리뷰어 모두 학기 내내 진행하는 연구 프로젝트(수업 발표 포함)가 가장 좋았다고 함."
    vi: "Cả ba người đều nói dự án nghiên cứu kéo dài cả học kỳ, kể cả phần thuyết trình, là phần hay nhất."
    ms: "Ketiga-tiga pengulas kata projek kajian sepanjang semester, termasuk pembentangan, ialah bahagian terbaik."
    id: "Ketiga pengulas bilang proyek riset sepanjang semester, termasuk presentasinya, adalah bagian terbaik."
    hi: "तीनों रिव्यूअर कहते हैं कि पूरे सेमेस्टर का शोध प्रोजेक्ट, कक्षा में प्रस्तुति सहित, सबसे अच्छा हिस्सा है।"
  - en: "The lectures got mixed reviews, covering a scattered spread of topics, but the exam closely followed the practice questions."
    zh: "讲课评价不一，内容比较零散，但考试和练习题非常接近。"
    zh-TW: "講課評價不一，內容比較零散，但考試和練習題非常接近。"
    ja: "講義はテーマがばらばらで評価が分かれるが、試験は練習問題にかなり近かった。"
    ko: "강의는 주제가 흩어져 있어 평이 엇갈리지만, 시험은 연습 문제와 매우 비슷했음."
    vi: "Bài giảng được đánh giá trái chiều, chủ đề khá rời rạc, nhưng đề thi rất sát câu luyện tập."
    ms: "Kuliah dapat ulasan bercampur kerana topik berselerak, tetapi peperiksaan hampir sama dengan soalan latihan."
    id: "Kuliah mendapat ulasan beragam karena topiknya tersebar, tapi ujian sangat mirip soal latihan."
    hi: "लेक्चर पर राय मिली-जुली है, विषय बिखरे हुए हैं, पर परीक्षा अभ्यास प्रश्नों से काफ़ी मिलती थी।"
difficulty: easy
