points:
  - en: "Content-heavy and application-focused; you need steady effort, but doing well is very possible."
    zh: "内容多且重应用；需要持续投入，但取得好成绩完全可能。"
    zh-TW: "內容多且重應用；需要持續投入，但要拿好成績完全有可能。"
    ja: "内容が多く応用重視。継続的な努力が必要だが、良い成績も十分可能。"
    ko: "내용이 많고 응용 중심. 꾸준한 노력이 필요하지만 좋은 성적도 충분히 가능."
    vi: "Nặng nội dung và thiên về ứng dụng; cần cố gắng đều đặn, nhưng đạt điểm tốt hoàn toàn khả thi."
    ms: "Padat dan berfokus aplikasi; perlu usaha berterusan, tetapi cemerlang sangat mungkin."
    id: "Materi padat dan fokus penerapan; perlu usaha konsisten, tapi nilai bagus sangat mungkin."
    hi: "कंटेंट भारी और एप्लीकेशन पर ज़ोर; लगातार मेहनत चाहिए, पर अच्छा करना बिल्कुल संभव है।"
  - en: "MSTs and the exam closely follow tutorial questions, quizzes and the practice exam. Attend tutes and redo the practice papers."
    zh: "期中测验和期末考试与辅导课题目、小测和模拟卷高度相似。要上辅导课并反复做模拟卷。"
    zh-TW: "期中測驗和考試跟輔導課題目、小考和模擬考很像。要去上輔導課並重做模擬卷。"
    ja: "中間テストと期末試験はチュートリアル問題、小テスト、模擬試験にかなり沿っている。チュートリアルに出て模擬問題を解き直そう。"
    ko: "중간시험과 기말시험은 튜토리얼 문제, 퀴즈, 모의시험과 매우 비슷함. 튜토리얼에 참석하고 모의시험을 다시 풀 것."
    vi: "Bài giữa kỳ và thi cuối bám sát câu hỏi tutorial, quiz và đề thi thử. Hãy đi tutorial và làm lại đề thử."
    ms: "Ujian pertengahan semester dan peperiksaan sangat mengikut soalan tutorial, kuiz dan peperiksaan latihan. Hadir tutorial dan buat semula kertas latihan."
    id: "Ujian tengah semester dan ujian akhir sangat mirip soal tutorial, kuis, dan ujian latihan. Ikut tutorial dan kerjakan ulang soal latihan."
    hi: "मिड-सेमेस्टर टेस्ट और एग्ज़ाम ट्यूटोरियल सवालों, क्विज़ और प्रैक्टिस एग्ज़ाम से काफ़ी मिलते हैं। ट्यूटोरियल जाएँ और प्रैक्टिस पेपर दोबारा करें।"
  - en: "Marking rewards specific details in short answers and assignments, and some found it harsh."
    zh: "简答题和作业中写出具体细节才能得分，部分人认为评分严格。"
    zh-TW: "簡答題和作業要寫出具體細節才給分，有些人覺得評分很嚴。"
    ja: "記述問題と課題では具体的な細部を書くと点になり、厳しいと感じた人もいる。"
    ko: "단답형과 과제는 구체적 세부를 써야 점수를 주며, 일부는 채점이 가혹하다고 느낌."
    vi: "Chấm điểm thưởng cho chi tiết cụ thể trong câu trả lời ngắn và bài tập, vài người thấy khắt khe."
    ms: "Pemarkahan menghargai butiran khusus dalam jawapan pendek dan tugasan, dan sesetengah rasa ia keras."
    id: "Penilaian menghargai detail spesifik di jawaban singkat dan tugas, dan sebagian merasa itu keras."
    hi: "छोटे उत्तरों और असाइनमेंट में खास बारीकियाँ लिखने पर ही नंबर मिलते हैं, कुछ को मार्किंग सख्त लगी।"
  - en: "Several found the later modules' video lectures unclear and had to rely on the slides and learning outcomes."
    zh: "多人认为后半部分模块的视频讲解不清楚，只能依靠课件和学习目标自学。"
    zh-TW: "好幾個人覺得後面模組的影片講解不清楚，只能靠投影片和學習目標自學。"
    ja: "後半モジュールの動画講義がわかりにくく、スライドと学習目標に頼るしかなかったという人が何人かいた。"
    ko: "여러 명이 후반 모듈의 영상 강의가 불명확해서 슬라이드와 학습 목표에 의존해야 했다고 함."
    vi: "Vài người thấy video bài giảng của các phần sau khó hiểu và phải dựa vào slide và mục tiêu học tập."
    ms: "Beberapa orang dapati video kuliah modul akhir kurang jelas dan terpaksa bergantung pada slaid dan hasil pembelajaran."
    id: "Beberapa orang merasa video kuliah modul akhir kurang jelas dan harus mengandalkan slide serta capaian pembelajaran."
    hi: "कई लोगों को बाद के मॉड्यूल के वीडियो लेक्चर अस्पष्ट लगे और उन्हें स्लाइड व लर्निंग आउटकम पर निर्भर रहना पड़ा।"
workload: heavy
