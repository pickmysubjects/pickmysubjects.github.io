points:
  - en: "Content-heavy and application-focused; you need steady effort, but doing well is very possible."
    zh: "内容多且重应用；需要持续投入，但取得好成绩完全可能。"
    zh-TW: "內容多且重應用；需要持續投入，但要拿好成績完全有可能。"
    ja: "内容が多く応用重視。継続的な努力が必要だが、良い成績も十分可能。"
    ko: "내용이 많고 응용 중심. 꾸준한 노력이 필요하지만 좋은 성적도 충분히 가능."
    vi: "Nặng nội dung và thiên về ứng dụng; cần cố gắng đều đặn, nhưng đạt điểm tốt hoàn toàn khả thi."
    ms: "Padat dan berfokus aplikasi; perlu usaha berterusan, tetapi cemerlang sangat mungkin."
    id: "Materi padat dan fokus penerapan; perlu usaha konsisten, tapi nilai bagus sangat mungkin."
    hi: "कंटेंट भारी और एप्लीकेशन पर ज़ोर; लगातार मेहनत चाहिए, पर अच्छा करना बिल्कुल संभव है।"
  - en: "MSTs and the exam closely follow tutorial questions, quizzes and the practice exam. Attend tutes and redo the practice papers."
    zh: "期中测验和期末考试与辅导课题目、小测和模拟卷高度相似。要上辅导课并反复做模拟卷。"
    zh-TW: "期中測驗和考試跟輔導課題目、小考和模擬考很像。要去上輔導課並重做模擬卷。"
    ja: "中間テストと期末試験はチュートリアル問題、小テスト、模擬試験にかなり沿っている。チュートリアルに出て模擬問題を解き直そう。"
    ko: "중간시험과 기말시험은 튜토리얼 문제, 퀴즈, 모의시험과 매우 비슷함. 튜토리얼에 참석하고 모의시험을 다시 풀 것."
    vi: "Bài giữa kỳ và thi cuối bám sát câu hỏi tutorial, quiz và đề thi thử. Hãy đi tutorial và làm lại đề thử."
    ms: "Ujian pertengahan semester dan peperiksaan sangat mengikut soalan tutorial, kuiz dan peperiksaan latihan. Hadir tutorial dan buat semula kertas latihan."
    id: "Ujian tengah semester dan ujian akhir sangat mirip soal tutorial, kuis, dan ujian latihan. Ikut tutorial dan kerjakan ulang soal latihan."
    hi: "मिड-सेमेस्टर टेस्ट और एग्ज़ाम ट्यूटोरियल सवालों, क्विज़ और प्रैक्टिस एग्ज़ाम से काफ़ी मिलते हैं। ट्यूटोरियल जाएँ और प्रैक्टिस पेपर दोबारा करें।"
  - en: "Marking rewards specific details in short answers and assignments, and some found it harsh."
    zh: "简答题和作业中写出具体细节才能得分，部分人认为评分严格。"
    zh-TW: "簡答題和作業要寫出具體細節才給分，有些人覺得評分很嚴。"
    ja: "記述問題と課題では具体的な細部を書くと点になり、厳しいと感じた人もいる。"
    ko: "단답형과 과제는 구체적 세부를 써야 점수를 주며, 일부는 채점이 가혹하다고 느낌."
    vi: "Chấm điểm thưởng cho chi tiết cụ thể trong câu trả lời ngắn và bài tập, vài người thấy khắt khe."
    ms: "Pemarkahan menghargai butiran khusus dalam jawapan pendek dan tugasan, dan sesetengah rasa ia keras."
    id: "Penilaian menghargai detail spesifik di jawaban singkat dan tugas, dan sebagian merasa itu keras."
    hi: "छोटे उत्तरों और असाइनमेंट में खास बारीकियाँ लिखने पर ही नंबर मिलते हैं, कुछ को मार्किंग सख्त लगी।"
  - en: "Several found the later modules' video lectures unclear and had to rely on the slides and learning outcomes."
    zh: "多人认为后半部分模块的视频讲解不清楚，只能依靠课件和学习目标自学。"
    zh-TW: "好幾個人覺得後面模組的影片講解不清楚，只能靠投影片和學習目標自學。"
    ja: "後半モジュールの動画講義がわかりにくく、スライドと学習目標に頼るしかなかったという人が何人かいた。"
    ko: "여러 명이 후반 모듈의 영상 강의가 불명확해서 슬라이드와 학습 목표에 의존해야 했다고 함."
    vi: "Vài người thấy video bài giảng của các phần sau khó hiểu và phải dựa vào slide và mục tiêu học tập."
    ms: "Beberapa orang dapati video kuliah modul akhir kurang jelas dan terpaksa bergantung pada slaid dan hasil pembelajaran."
    id: "Beberapa orang merasa video kuliah modul akhir kurang jelas dan harus mengandalkan slide serta capaian pembelajaran."
    hi: "कई लोगों को बाद के मॉड्यूल के वीडियो लेक्चर अस्पष्ट लगे और उन्हें स्लाइड व लर्निंग आउटकम पर निर्भर रहना पड़ा।"
sections:
  content:
    - en: "Content heavy and application heavy rather than conceptually hard. First-year bio and chem are enough; little chemistry is needed and it gets re-taught."
      zh: "内容多、偏应用，概念本身不算难。有大一生物和化学就够，化学用得很少，需要的会重新教。"
      zh-TW: "內容多、偏應用，概念本身不算難。有大一生物和化學就夠，化學用得很少，需要的會重新教。"
      ja: "概念が難しいというより内容量と応用が多い。1年の生物と化学で十分で、化学はほとんど使わず必要な分は教え直してくれる。"
      ko: "개념이 어렵기보다 내용과 응용이 많다. 1학년 생물과 화학이면 충분하고, 화학은 거의 안 쓰며 필요한 건 다시 가르쳐 준다."
      vi: "Nhiều nội dung và nặng ứng dụng hơn là khó về khái niệm. Sinh và hóa năm nhất là đủ; hóa dùng rất ít và sẽ được dạy lại."
      ms: "Banyak kandungan dan berat aplikasi, bukan sukar dari segi konsep. Bio dan kimia tahun satu sudah cukup; sedikit kimia diperlukan dan diajar semula."
      id: "Materinya banyak dan berat di penerapan, bukan sulit secara konsep. Bio dan kimia tahun pertama cukup; kimia jarang dipakai dan diajarkan ulang."
      hi: "कॉन्सेप्ट कठिन कम, कंटेंट और एप्लिकेशन ज़्यादा है। पहले साल की बायो और केमिस्ट्री काफ़ी है; केमिस्ट्री बहुत कम लगती है और दोबारा सिखाई जाती है।"
    - en: "Opinions split on enjoyment: some loved it, others found it a grind and would only take it as a prerequisite."
      zh: "喜不喜欢意见不一：有人很喜欢，也有人觉得很磨人，只建议当先修课才修。"
      zh-TW: "喜不喜歡意見分歧：有人很喜歡，也有人覺得很磨人，只建議當先修課才修。"
      ja: "楽しめたかは意見が分かれる。大好きな人もいれば、苦行で前提科目でなければ取らないという人も。"
      ko: "재미는 의견이 갈린다. 아주 좋아한 사람도 있고, 고되서 선수 과목일 때만 들으라는 사람도 있다."
      vi: "Ý kiến chia rẽ về độ thú vị: có người rất thích, người khác thấy vất vả và chỉ nên học nếu là môn tiên quyết."
      ms: "Pendapat berbeza tentang keseronokan: ada yang sangat suka, ada yang rasa memenatkan dan hanya ambil jika ia prasyarat."
      id: "Pendapat terbelah soal seru tidaknya: ada yang sangat suka, ada yang merasa melelahkan dan hanya ambil kalau jadi prasyarat."
      hi: "मज़े को लेकर राय बँटी है: कुछ को बहुत पसंद आया, दूसरों को थकाऊ लगा और वे इसे सिर्फ़ प्रीरिक्विज़िट होने पर लेने की सलाह देते हैं।"
  work:
    - en: "The MSTs and final closely follow the tutorial questions and the practice exam. Weekly quizzes are easy marks."
      zh: "两次 MST 和期末都跟 tutorial 题和模拟卷很像。每周小测很容易拿分。"
      zh-TW: "兩次 MST 和期末都跟 tutorial 題和模擬考很像。每週小考很容易拿分。"
      ja: "MSTと期末はチュートリアルの問題と模試にかなり近い。毎週の小テストは点が取りやすい。"
      ko: "MST와 기말은 튜토리얼 문제와 모의고사와 매우 비슷하다. 주간 퀴즈는 점수 따기 쉽다."
      vi: "Các bài MST và cuối kỳ rất giống câu hỏi tutorial và đề thi thử. Quiz hằng tuần dễ lấy điểm."
      ms: "MST dan peperiksaan akhir sangat mengikut soalan tutorial dan kertas latihan. Kuiz mingguan markah mudah."
      id: "MST dan ujian akhir sangat mirip soal tutorial dan ujian latihan. Kuis mingguan nilai gampang."
      hi: "MST और फ़ाइनल ट्यूटोरियल सवालों और प्रैक्टिस पेपर से काफ़ी मिलते हैं। साप्ताहिक क्विज़ आसान नंबर हैं।"
    - en: "Short answers reward specific detail, so write more than the marks suggest, but wrong statements lose marks. Several found assignments marked strictly."
      zh: "简答题看重细节，写得比分值看起来要多，但写错会扣分。好几位同学觉得作业扣分严格。"
      zh-TW: "簡答題看重細節，寫得比配分看起來多一些，但寫錯會扣分。好幾位同學覺得作業評分嚴格。"
      ja: "記述問題は具体的な細部で点が入るので配点以上に書くとよいが、誤りは減点される。課題の採点が厳しいという声が複数。"
      ko: "단답형은 구체적인 세부 내용에 점수를 주니 배점보다 많이 쓰되, 틀린 말은 감점된다. 과제 채점이 깐깐하다는 평이 여럿."
      vi: "Câu tự luận ngắn chấm theo chi tiết cụ thể, nên viết nhiều hơn số điểm gợi ý, nhưng viết sai bị trừ. Vài người thấy bài tập chấm khắt khe."
      ms: "Jawapan pendek beri markah untuk butiran khusus, jadi tulis lebih daripada markahnya, tetapi kenyataan salah ditolak. Beberapa rasa tugasan dinilai ketat."
      id: "Isian singkat memberi nilai untuk detail spesifik, jadi tulis lebih dari bobotnya, tapi pernyataan salah dipotong. Beberapa merasa tugas dinilai ketat."
      hi: "शॉर्ट आंसर में ख़ास बारीकियों पर नंबर मिलते हैं, इसलिए अंकों से ज़्यादा लिखें, पर ग़लत बात पर नंबर कटते हैं। कई को असाइनमेंट की मार्किंग सख़्त लगी।"
  study:
    - en: "Watch the weekly videos on time, redo the tutorial questions and worksheets, and do every practice exam; reviewers say the final mirrors the mock paper."
      zh: "每周视频按时看，tutorial 题和练习反复做，所有模拟卷都做；同学说期末和模拟卷很像。"
      zh-TW: "每週影片準時看，tutorial 題和練習反覆做，所有模擬考都寫；同學說期末和模擬考很像。"
      ja: "毎週の動画を期限内に見て、チュートリアル問題とワークシートを解き直し、模試は全部やる。期末は模試にそっくりだという。"
      ko: "주간 영상은 제때 보고, 튜토리얼 문제와 워크시트를 다시 풀고, 모의고사는 전부 풀어라. 기말이 모의고사와 닮았다고 한다."
      vi: "Xem video hằng tuần đúng hạn, làm lại câu tutorial và worksheet, làm hết đề thi thử; người học nói bài cuối kỳ rất giống đề thử."
      ms: "Tonton video mingguan tepat masa, buat semula soalan tutorial dan lembaran kerja, dan buat semua kertas latihan; pengulas kata peperiksaan akhir mirip kertas olok-olok."
      id: "Tonton video mingguan tepat waktu, ulangi soal tutorial dan lembar kerja, dan kerjakan semua ujian latihan; pengulas bilang ujian akhir mirip ujian latihan."
      hi: "हर हफ़्ते के वीडियो समय पर देखें, ट्यूटोरियल सवाल और वर्कशीट दोबारा करें, और हर प्रैक्टिस पेपर दें; रिव्यूअर्स कहते हैं फ़ाइनल मॉक पेपर जैसा होता है।"
  watch:
    - en: "Several reviewers found the later gene modules' videos vague and their practice questions unlike the exam, though most of the final draws on them."
      zh: "好几位同学觉得后面基因部分的视频讲得含糊，练习题和考试也不像，但期末很多内容考这部分。"
      zh-TW: "好幾位同學覺得後面基因部分的影片講得含糊，練習題和考試也不像，但期末很多內容考這部分。"
      ja: "後半の遺伝子モジュールの動画が曖昧で練習問題も試験と違うという声が複数。ただし期末の多くはそこから出る。"
      ko: "여러 명이 후반 유전자 모듈 영상이 모호하고 연습 문제도 시험과 다르다고 했다. 그런데 기말의 상당 부분이 거기서 나온다."
      vi: "Vài người thấy video phần gen về sau mơ hồ và câu luyện tập không giống đề thi, dù phần lớn bài cuối kỳ lại hỏi phần này."
      ms: "Beberapa pengulas dapati video modul gen kemudian kabur dan soalan latihannya tidak seperti peperiksaan, walaupun banyak soalan akhir dari situ."
      id: "Beberapa pengulas merasa video modul gen bagian akhir kabur dan soal latihannya tidak mirip ujian, padahal banyak soal akhir dari sana."
      hi: "कई रिव्यूअर्स को बाद के जीन मॉड्यूल के वीडियो अस्पष्ट लगे और प्रैक्टिस सवाल परीक्षा जैसे नहीं, जबकि फ़ाइनल का बड़ा हिस्सा उन्हीं से आता है।"
workload: heavy
difficulty: mixed
