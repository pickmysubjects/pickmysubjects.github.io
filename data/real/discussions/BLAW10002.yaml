points:
  - en: "Almost every reviewer warns about a very heavy weekly reading load, with dense legal texts that are hard going for students with no law background."
    zh: "几乎所有评价都提醒每周阅读量非常大，法律文本艰涩，没有法律背景的同学读起来很吃力。"
    zh-TW: "幾乎所有評價都提醒每週閱讀量非常大，法律文本艱澀，沒有法律背景的同學讀起來很吃力。"
    ja: "ほぼ全員が毎週の読書量の多さを警告している。法律の文章は難解で、法律の素養がない学生にはきつい。"
    ko: "거의 모든 리뷰어가 매주 읽을 분량이 매우 많다고 경고한다. 법률 문헌이 어려워 법 배경이 없는 학생에게는 힘들다."
    vi: "Gần như mọi người đều cảnh báo lượng đọc hằng tuần rất nặng, văn bản luật khó hiểu với người chưa học luật."
    ms: "Hampir semua pengulas memberi amaran tentang bacaan mingguan yang sangat berat, dengan teks undang-undang yang sukar bagi pelajar tanpa latar undang-undang."
    id: "Hampir semua pengulas memperingatkan beban bacaan mingguan yang sangat berat, dengan teks hukum yang sulit bagi mahasiswa tanpa latar hukum."
    hi: "लगभग हर रिव्यूअर हर हफ़्ते की भारी रीडिंग के बारे में चेताता है; क़ानूनी टेक्स्ट कठिन हैं, ख़ासकर बिना लॉ बैकग्राउंड वालों के लिए।"
  - en: "Content and lectures were mostly liked, but many found tutorials vague or unhelpful and expectations for the assessment unclear; the newest reviews also mention a high fail rate."
    zh: "内容和讲座大多受好评，但不少人觉得辅导课含糊、帮助不大，作业要求不清楚；最新的评价还提到挂科率高。"
    zh-TW: "內容和講座大多受好評，但不少人覺得輔導課含糊、幫助不大，作業要求不清楚；最新的評價還提到不及格率高。"
    ja: "内容と講義はおおむね好評だが、チュートリアルが曖昧で役に立たない、課題の要求が不明確という声が多い。最新のレビューでは不合格率の高さも指摘。"
    ko: "내용과 강의는 대체로 호평이지만, 튜토리얼이 모호하고 도움이 안 되며 과제 기준이 불분명하다는 의견이 많다. 최신 리뷰는 낙제율이 높다고도 한다."
    vi: "Nội dung và bài giảng phần lớn được khen, nhưng nhiều người thấy tutorial mơ hồ, ít giúp ích và yêu cầu bài đánh giá không rõ; các đánh giá mới nhất còn nói tỷ lệ trượt cao."
    ms: "Kandungan dan kuliah kebanyakannya disukai, tetapi ramai dapati tutorial kabur atau kurang membantu dan jangkaan tugasan tidak jelas; ulasan terbaru juga sebut kadar gagal yang tinggi."
    id: "Materi dan kuliah umumnya disukai, tapi banyak yang merasa tutorial kurang jelas atau tidak membantu dan ekspektasi tugas tidak jelas; ulasan terbaru juga menyebut tingkat gagal yang tinggi."
    hi: "कंटेंट और लेक्चर ज़्यादातर पसंद किए गए, पर कई लोगों को ट्यूटोरियल अस्पष्ट या बेकार और असेसमेंट की अपेक्षाएँ साफ़ नहीं लगीं; सबसे नए रिव्यू ज़्यादा फ़ेल रेट भी बताते हैं।"
  - en: "Reviewers disagree on assessment: one found the case study and open-book exam fair, others said the assessment didn't match the exam or the marks took weeks to come back."
    zh: "对考核看法不一：有人觉得案例作业和开卷考试公平，也有人说作业与考试结构不一致，或成绩要等好几周才出。"
    zh-TW: "對考核看法不一：有人覺得案例作業和開書考試公平，也有人說作業與考試結構不一致，或成績要等好幾週才出。"
    ja: "評価については意見が分かれる。ケース課題と持ち込み可の試験は公平だという人もいれば、課題と試験の形式が合っていない、採点結果が何週間も返ってこないという人も。"
    ko: "평가에 대해서는 의견이 갈린다. 사례 과제와 오픈북 시험이 공정했다는 사람도 있고, 과제와 시험 구조가 맞지 않거나 점수가 몇 주 뒤에야 나왔다는 사람도 있다."
    vi: "Ý kiến về đánh giá khác nhau: có người thấy bài tình huống và thi mở sách công bằng, người khác nói bài tập không khớp với đề thi hoặc điểm trả về sau nhiều tuần."
    ms: "Pengulas tidak sependapat tentang penilaian: seorang dapati kajian kes dan peperiksaan buku terbuka adil, yang lain kata tugasan tidak sepadan dengan peperiksaan atau markah lambat berminggu-minggu."
    id: "Pengulas berbeda pendapat soal penilaian: satu merasa studi kasus dan ujian open-book adil, yang lain bilang tugas tidak sesuai dengan ujian atau nilainya keluar berminggu-minggu kemudian."
    hi: "असेसमेंट पर राय बँटी है: एक को केस स्टडी और ओपन-बुक परीक्षा उचित लगी, बाकियों ने कहा कि असाइनमेंट परीक्षा से मेल नहीं खाता था या अंक हफ़्तों बाद आए।"
  - en: "Several say it suits students thinking about a law degree later, but is a tough pick as a casual breadth subject."
    zh: "好几位认为它适合以后想读法律的同学，但如果只是随便选的 breadth 科目，会比较辛苦。"
    zh-TW: "好幾位認為它適合以後想讀法律的同學，但如果只是隨意選的 breadth 科目，會比較辛苦。"
    ja: "将来法律を学びたい人には向いているが、気軽なブレドス科目として選ぶには厳しいという声が複数。"
    ko: "나중에 법학을 고려하는 학생에게는 맞지만, 가볍게 고르는 브레드스 과목으로는 힘들다는 의견이 여럿이다."
    vi: "Nhiều người nói môn hợp với ai định học luật sau này, nhưng là lựa chọn vất vả nếu chỉ chọn làm môn breadth."
    ms: "Beberapa orang kata ia sesuai untuk pelajar yang mahu ambil ijazah undang-undang kelak, tetapi berat sebagai subjek breadth sambil lalu."
    id: "Beberapa orang bilang cocok bagi yang berencana kuliah hukum nanti, tapi berat kalau diambil sekadar sebagai mata kuliah breadth."
    hi: "कई लोग कहते हैं कि यह आगे लॉ पढ़ने की सोच रहे छात्रों के लिए ठीक है, पर हल्के ब्रेड्थ विषय के तौर पर यह कठिन चुनाव है।"
workload: heavy
difficulty: hard
