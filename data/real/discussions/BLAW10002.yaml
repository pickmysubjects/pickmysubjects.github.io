code: BLAW10002
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/blaw10002
reviews: 10
from: 2015
to: 2019
checked: 2026-10-14
points:
  - en: "Almost every reviewer warns about a very heavy weekly reading load, with dense legal texts that are hard going for students with no law background."
    zh: "几乎所有评价都提醒每周阅读量非常大，法律文本艰涩，没有法律背景的同学读起来很吃力。"
    zh-TW: "幾乎所有評價都提醒每週閱讀量非常大，法律文本艱澀，沒有法律背景的同學讀起來很吃力。"
    ja: "ほぼ全員が毎週の読書量の多さを警告している。法律の文章は難解で、法律の素養がない学生にはきつい。"
    ko: "거의 모든 리뷰어가 매주 읽을 분량이 매우 많다고 경고한다. 법률 문헌이 어려워 법 배경이 없는 학생에게는 힘들다."
    vi: "Gần như mọi người đều cảnh báo lượng đọc hằng tuần rất nặng, văn bản luật khó hiểu với người chưa học luật."
    ms: "Hampir semua pengulas memberi amaran tentang bacaan mingguan yang sangat berat, dengan teks undang-undang yang sukar bagi pelajar tanpa latar undang-undang."
    id: "Hampir semua pengulas memperingatkan beban bacaan mingguan yang sangat berat, dengan teks hukum yang sulit bagi mahasiswa tanpa latar hukum."
    hi: "लगभग हर रिव्यूअर हर हफ़्ते की भारी रीडिंग के बारे में चेताता है; क़ानूनी टेक्स्ट कठिन हैं, ख़ासकर बिना लॉ बैकग्राउंड वालों के लिए।"
  - en: "Content and lectures were mostly liked, but many found tutorials vague or unhelpful and expectations for the assessment unclear; the newest reviews also mention a high fail rate."
    zh: "内容和讲座大多受好评，但不少人觉得辅导课含糊、帮助不大，作业要求不清楚；最新的评价还提到挂科率高。"
    zh-TW: "內容和講座大多受好評，但不少人覺得輔導課含糊、幫助不大，作業要求不清楚；最新的評價還提到不及格率高。"
    ja: "内容と講義はおおむね好評だが、チュートリアルが曖昧で役に立たない、課題の要求が不明確という声が多い。最新のレビューでは不合格率の高さも指摘。"
    ko: "내용과 강의는 대체로 호평이지만, 튜토리얼이 모호하고 도움이 안 되며 과제 기준이 불분명하다는 의견이 많다. 최신 리뷰는 낙제율이 높다고도 한다."
    vi: "Nội dung và bài giảng phần lớn được khen, nhưng nhiều người thấy tutorial mơ hồ, ít giúp ích và yêu cầu bài đánh giá không rõ; các đánh giá mới nhất còn nói tỷ lệ trượt cao."
    ms: "Kandungan dan kuliah kebanyakannya disukai, tetapi ramai dapati tutorial kabur atau kurang membantu dan jangkaan tugasan tidak jelas; ulasan terbaru juga sebut kadar gagal yang tinggi."
    id: "Materi dan kuliah umumnya disukai, tapi banyak yang merasa tutorial kurang jelas atau tidak membantu dan ekspektasi tugas tidak jelas; ulasan terbaru juga menyebut tingkat gagal yang tinggi."
    hi: "कंटेंट और लेक्चर ज़्यादातर पसंद किए गए, पर कई लोगों को ट्यूटोरियल अस्पष्ट या बेकार और असेसमेंट की अपेक्षाएँ साफ़ नहीं लगीं; सबसे नए रिव्यू ज़्यादा फ़ेल रेट भी बताते हैं।"
  - en: "Reviewers disagree on assessment: one found the case study and open-book exam fair, others said the assessment didn't match the exam or the marks took weeks to come back."
    zh: "对考核看法不一：有人觉得案例作业和开卷考试公平，也有人说作业与考试结构不一致，或成绩要等好几周才出。"
    zh-TW: "對考核看法不一：有人覺得案例作業和開書考試公平，也有人說作業與考試結構不一致，或成績要等好幾週才出。"
    ja: "評価については意見が分かれる。ケース課題と持ち込み可の試験は公平だという人もいれば、課題と試験の形式が合っていない、採点結果が何週間も返ってこないという人も。"
    ko: "평가에 대해서는 의견이 갈린다. 사례 과제와 오픈북 시험이 공정했다는 사람도 있고, 과제와 시험 구조가 맞지 않거나 점수가 몇 주 뒤에야 나왔다는 사람도 있다."
    vi: "Ý kiến về đánh giá khác nhau: có người thấy bài tình huống và thi mở sách công bằng, người khác nói bài tập không khớp với đề thi hoặc điểm trả về sau nhiều tuần."
    ms: "Pengulas tidak sependapat tentang penilaian: seorang dapati kajian kes dan peperiksaan buku terbuka adil, yang lain kata tugasan tidak sepadan dengan peperiksaan atau markah lambat berminggu-minggu."
    id: "Pengulas berbeda pendapat soal penilaian: satu merasa studi kasus dan ujian open-book adil, yang lain bilang tugas tidak sesuai dengan ujian atau nilainya keluar berminggu-minggu kemudian."
    hi: "असेसमेंट पर राय बँटी है: एक को केस स्टडी और ओपन-बुक परीक्षा उचित लगी, बाकियों ने कहा कि असाइनमेंट परीक्षा से मेल नहीं खाता था या अंक हफ़्तों बाद आए।"
  - en: "Several say it suits students thinking about a law degree later, but is a tough pick as a casual breadth subject."
    zh: "好几位认为它适合以后想读法律的同学，但如果只是随便选的 breadth 科目，会比较辛苦。"
    zh-TW: "好幾位認為它適合以後想讀法律的同學，但如果只是隨意選的 breadth 科目，會比較辛苦。"
    ja: "将来法律を学びたい人には向いているが、気軽なブレドス科目として選ぶには厳しいという声が複数。"
    ko: "나중에 법학을 고려하는 학생에게는 맞지만, 가볍게 고르는 브레드스 과목으로는 힘들다는 의견이 여럿이다."
    vi: "Nhiều người nói môn hợp với ai định học luật sau này, nhưng là lựa chọn vất vả nếu chỉ chọn làm môn breadth."
    ms: "Beberapa orang kata ia sesuai untuk pelajar yang mahu ambil ijazah undang-undang kelak, tetapi berat sebagai subjek breadth sambil lalu."
    id: "Beberapa orang bilang cocok bagi yang berencana kuliah hukum nanti, tapi berat kalau diambil sekadar sebagai mata kuliah breadth."
    hi: "कई लोग कहते हैं कि यह आगे लॉ पढ़ने की सोच रहे छात्रों के लिए ठीक है, पर हल्के ब्रेड्थ विषय के तौर पर यह कठिन चुनाव है।"
sections:
  content:
    - en: "Interesting content (free speech theory, defamation and more) with good lectures, but very heavy weekly reading and high expectations; several felt prior law knowledge was assumed."
      zh: "内容有意思（言论自由理论、诽谤等），lecture 讲得好，但每周阅读量很大、要求高；好几位觉得默认你有法律基础。"
      zh-TW: "內容有趣（言論自由理論、誹謗等），lecture 講得好，但每週閱讀量很大、要求高；好幾位覺得預設你有法律基礎。"
      ja: "言論の自由の理論や名誉毀損などの面白い内容で講義も良いが、毎週の文献が非常に多く要求も高い。法律の予備知識が前提にされていると感じた人が複数。"
      ko: "표현의 자유 이론, 명예훼손 등 흥미로운 내용에 강의도 좋지만, 매주 읽기 양이 매우 많고 기대치가 높다. 법률 사전 지식을 전제한다고 느낀 사람이 여럿."
      vi: "Nội dung thú vị (lý thuyết tự do ngôn luận, phỉ báng...) với bài giảng tốt, nhưng bài đọc hằng tuần rất nặng và yêu cầu cao; vài người thấy môn mặc định bạn đã biết luật."
      ms: "Kandungan menarik (teori kebebasan bersuara, fitnah dan lain-lain) dengan kuliah yang baik, tetapi bacaan mingguan sangat berat dan jangkaan tinggi; beberapa rasa pengetahuan undang-undang diandaikan."
      id: "Materi menarik (teori kebebasan berpendapat, pencemaran nama baik, dll.) dengan kuliah yang bagus, tapi bacaan mingguan sangat berat dan ekspektasi tinggi; beberapa merasa pengetahuan hukum dianggap sudah dimiliki."
      hi: "रोचक कंटेंट (अभिव्यक्ति की आज़ादी का सिद्धांत, मानहानि आदि) और अच्छे लेक्चर, पर हर हफ़्ते बहुत भारी रीडिंग और ऊँची अपेक्षाएँ; कई को लगा कानून का पूर्व ज्ञान मान लिया गया।"
  work:
    - en: "A hypothetical case-study assignment and an open-book exam. Several found the assignment instructions unclear and hard to do well in; one said the assignment structure didn't match the exam."
      zh: "一份假设案例分析作业和一场开卷考试。好几位觉得作业说明不清楚、很难拿高分；有一位说作业的结构和考试对不上。"
      zh-TW: "一份假設個案分析作業和一場開書考試。好幾位覺得作業說明不清楚、很難拿高分；有一位說作業的結構和考試對不上。"
      ja: "仮想事例の課題とオープンブック試験。課題の指示が不明確で高得点が難しいという声が複数。課題の構成が試験と合っていなかったという人が一人。"
      ko: "가상 사례 과제와 오픈북 시험. 과제 안내가 불분명하고 고득점이 어렵다는 리뷰가 여럿. 과제 구조가 시험과 맞지 않았다는 사람이 한 명."
      vi: "Một bài tập tình huống giả định và bài thi mở sách. Vài người thấy hướng dẫn bài tập không rõ, khó đạt điểm cao; một người nói cấu trúc bài tập không khớp bài thi."
      ms: "Tugasan kajian kes hipotetikal dan peperiksaan buku terbuka. Beberapa rasa arahan tugasan tidak jelas dan sukar buat baik; seorang kata struktur tugasan tidak sepadan dengan peperiksaan."
      id: "Tugas studi kasus hipotetis dan ujian open-book. Beberapa merasa instruksi tugasnya tak jelas dan sulit dapat nilai bagus; satu bilang struktur tugas tak sesuai dengan ujian."
      hi: "एक काल्पनिक केस-स्टडी असाइनमेंट और ओपन-बुक परीक्षा। कई को असाइनमेंट के निर्देश अस्पष्ट और अच्छे अंक कठिन लगे; एक ने कहा असाइनमेंट की संरचना परीक्षा से मेल नहीं खाती थी।"
  watch:
    - en: "Most reviewers recommend it mainly to those considering the JD rather than as a casual breadth. Tutorials were often described as vague, though it depended on the tutor."
      zh: "多数同学主要推荐给考虑读 JD 的人，不太适合随便选的 breadth。tutorial 常被说很含糊，不过要看 tutor。"
      zh-TW: "多數同學主要推薦給考慮讀 JD 的人，不太適合隨便選的 breadth。tutorial 常被說很含糊，不過要看 tutor。"
      ja: "気軽なブレッドスより、JD進学を考えている人向けだという声が多い。チュートリアルはあいまいだと言われがちだが、チューター次第。"
      ko: "가벼운 브레드스보다 JD를 고려하는 사람에게 주로 권한다는 평이 많다. 튜토리얼은 모호하다는 평이 많지만 튜터에 따라 다르다."
      vi: "Đa số chủ yếu gợi ý cho người đang cân nhắc học JD hơn là học breadth cho vui. Tutorial thường bị nói là mơ hồ, dù tùy tutor."
      ms: "Kebanyakan pengulas cadangkan terutamanya bagi yang pertimbang JD dan bukan sebagai breadth santai. Tutorial sering digambarkan kabur, walaupun bergantung pada tutor."
      id: "Kebanyakan reviewer terutama menyarankannya bagi yang mempertimbangkan JD, bukan sebagai breadth santai. Tutorial sering disebut kabur, meski tergantung tutornya."
      hi: "ज़्यादातर रिव्यूअर इसे हल्के ब्रेड्थ के बजाय JD सोचने वालों को सुझाते हैं। ट्यूटोरियल अक्सर अस्पष्ट बताए गए, हालाँकि यह ट्यूटर पर निर्भर था।"
    - en: "The reviews are all from 2019 or earlier, so the subject may have changed."
      zh: "评价全部来自 2019 年或更早，课程可能已经变了。"
      zh-TW: "評價全部來自 2019 年或更早，課程可能已經改變。"
      ja: "レビューはすべて2019年以前のもので、内容が変わっている可能性がある。"
      ko: "리뷰가 모두 2019년 이전 것이라 과목이 바뀌었을 수 있다."
      vi: "Các đánh giá đều từ 2019 trở về trước, nên môn có thể đã thay đổi."
      ms: "Semua ulasan dari 2019 atau lebih awal, jadi subjek mungkin telah berubah."
      id: "Semua ulasan dari 2019 atau sebelumnya, jadi mata kuliahnya mungkin sudah berubah."
      hi: "सारे रिव्यू 2019 या उससे पहले के हैं, इसलिए विषय बदल चुका हो सकता है।"
workload: heavy
difficulty: hard
