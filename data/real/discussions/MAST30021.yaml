points:
  - en: "Many call it a beautiful subject. It is more applied than real analysis, with a mix of proofs and calculation."
    zh: "多人称其优美，比实分析更偏应用，证明与计算结合。"
  - en: "The experience depended heavily on who taught it. Earlier reviews of one semester were very split, with complaints about no solutions being provided."
    zh: "体验很受授课人影响；早年某学期评价两极，曾有不提供答案的抱怨。"
  - en: "Keep up with the work, because lectures build on earlier results and tutorials. Assignments are a good guide to the exam."
    zh: "需跟上进度，讲课依赖前面结论和辅导题；作业是备考的好参考。"
  - en: "The most recent review found the exam mainly conceptual and computational and not too hard. Watch for careless mistakes in long calculations."
    zh: "最新评价称考试以概念和计算为主、不太难；长计算要小心出错。"
