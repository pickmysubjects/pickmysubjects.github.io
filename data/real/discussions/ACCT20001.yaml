code: ACCT20001
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/acct20001
reviews: 10
from: 2017
to: 2021
checked: 2026-10-13
points:
  - en: "Most found it logical and manageable if you keep up each week; some say the content still takes real effort to grasp."
    zh: "多数人觉得内容有逻辑，每周跟上就能应付；也有人说理解内容仍需下功夫。"
    zh-TW: "多數人覺得內容有邏輯，每週跟上就能應付；也有人說理解內容仍需下功夫。"
    ja: "毎週ついていけば論理的で対応しやすいという声が多い。一方で理解にはそれなりの努力が要るという人もいる。"
    ko: "매주 따라가면 논리적이고 할 만하다는 의견이 많다. 다만 내용을 이해하려면 꽤 노력이 필요하다는 사람도 있다."
    vi: "Đa số thấy môn logic và theo được nếu học đều mỗi tuần; một số nói vẫn cần nỗ lực thật sự để hiểu nội dung."
    ms: "Kebanyakan dapati ia logik dan boleh diurus jika ikut setiap minggu; ada yang kata kandungannya tetap perlukan usaha untuk faham."
    id: "Kebanyakan merasa logis dan bisa diatasi jika mengikuti tiap minggu; sebagian bilang materinya tetap butuh usaha untuk dipahami."
    hi: "ज़्यादातर को यह तर्कसंगत और हर हफ़्ते साथ चलने पर संभालने लायक लगा; कुछ कहते हैं कंटेंट समझने में फिर भी मेहनत लगती है।"
  - en: "Several say the multiple-choice mid-semester test is harder than expected, while the final felt fairer and helped lift marks."
    zh: "好几位说期中选择题测验比预想的难，而期末考试较公平，能把分数拉上来。"
    zh-TW: "好幾位說期中選擇題測驗比預想的難，而期末考較公平，能把分數拉上來。"
    ja: "多肢選択式の中間テストは予想より難しく、期末の方が公平で点数を挽回しやすかったという声が複数。"
    ko: "객관식 중간시험이 예상보다 어렵고, 기말은 더 공정해서 점수를 끌어올리는 데 도움이 됐다는 의견이 여럿이다."
    vi: "Vài người nói bài kiểm tra giữa kỳ trắc nghiệm khó hơn dự kiến, còn bài thi cuối công bằng hơn và giúp kéo điểm lên."
    ms: "Beberapa kata ujian pertengahan semester aneka pilihan lebih sukar daripada dijangka, manakala peperiksaan akhir lebih adil dan bantu naikkan markah."
    id: "Beberapa bilang tes tengah semester pilihan ganda lebih sulit dari dugaan, sedangkan ujian akhir lebih adil dan membantu menaikkan nilai."
    hi: "कई कहते हैं मल्टीपल-चॉइस मिड-सेमेस्टर टेस्ट उम्मीद से कठिन है, जबकि फ़ाइनल ज़्यादा निष्पक्ष लगा और नंबर बढ़ाने में मदद की।"
  - en: "Lectures and slides were mostly praised, though one older review was unhappy after a staffing change. Tip: do the tutorial work and practise applying ideas to cases."
    zh: "讲课和课件大多受到好评，但一条较早的评价对换人后的教学不满意。建议：认真完成辅导课练习，多练把理论用到案例上。"
    zh-TW: "講課和投影片大多受好評，但一則較早的評價對換人後的教學不滿意。建議：認真完成輔導課練習，多練把理論用到案例上。"
    ja: "講義とスライドはおおむね好評だが、古いレビューの一つは担当交代後に不満を述べている。コツ：チュートリアル課題をこなし、理論をケースに当てはめる練習を。"
    ko: "강의와 슬라이드는 대체로 호평이지만, 오래된 리뷰 하나는 담당 교체 후 불만을 표했다. 팁: 튜토리얼 과제를 하고 이론을 사례에 적용하는 연습을 하자."
    vi: "Bài giảng và slide phần lớn được khen, dù một đánh giá cũ không hài lòng sau khi đổi người dạy. Mẹo: làm bài tutorial và luyện áp dụng lý thuyết vào tình huống."
    ms: "Kuliah dan slaid kebanyakannya dipuji, walaupun satu ulasan lama tidak berpuas hati selepas pertukaran pengajar. Tip: buat kerja tutorial dan latih aplikasi teori pada kes."
    id: "Kuliah dan slide umumnya dipuji, meski satu ulasan lama kecewa setelah pergantian pengajar. Tips: kerjakan tugas tutorial dan latih penerapan teori ke kasus."
    hi: "लेक्चर और स्लाइड्स की ज़्यादातर तारीफ़ हुई, हालाँकि एक पुराना रिव्यू स्टाफ़ बदलने के बाद नाख़ुश था। टिप: ट्यूटोरियल का काम करें और थ्योरी को केस पर लागू करने का अभ्यास करें।"
sections:
  content:
    - en: "Mostly seen as useful and logical, applying cost theory to real-life cases. Fine if you keep up and are comfortable with basic maths; some found the concepts hard at first."
      zh: "多数人觉得实用、有逻辑，用成本理论分析真实案例。跟上进度、数学过得去就没问题；也有人一开始觉得概念难懂。"
      zh-TW: "多數人覺得實用、有邏輯，用成本理論分析真實案例。跟上進度、數學過得去就沒問題；也有人一開始覺得概念難懂。"
      ja: "実用的で論理的、コスト理論を実際のケースに当てはめる科目という声が多い。ついていけて基本的な数学ができれば大丈夫だが、最初は概念が難しいという人も。"
      ko: "대체로 유용하고 논리적이며 원가 이론을 실제 사례에 적용한다는 평. 진도를 따라가고 기초 수학이 되면 괜찮지만 처음엔 개념이 어렵다는 사람도 있다."
      vi: "Phần lớn thấy hữu ích và logic, áp dụng lý thuyết chi phí vào tình huống thực tế. Theo kịp và ổn toán cơ bản là được; có người thấy khái niệm khó lúc đầu."
      ms: "Kebanyakan anggap berguna dan logik, menggunakan teori kos pada kes sebenar. Okey jika ikut rentak dan selesa dengan matematik asas; ada yang rasa konsep sukar pada mulanya."
      id: "Umumnya dianggap berguna dan logis, menerapkan teori biaya ke kasus nyata. Aman kalau mengikuti tempo dan nyaman dengan matematika dasar; ada yang merasa konsepnya sulit di awal."
      hi: "ज़्यादातर इसे उपयोगी और तार्किक मानते हैं, जिसमें लागत सिद्धांत असली केस पर लगाया जाता है। साथ चलें और बुनियादी गणित ठीक हो तो ठीक; कुछ को शुरुआत में कॉन्सेप्ट कठिन लगे।"
  work:
    - en: "Several reviewers found the all multiple-choice mid-semester test hard but the final exam fair, testing understanding and application."
      zh: "好几位同学觉得全选择题的期中考难，但期末公平，考的是理解和应用。"
      zh-TW: "好幾位同學覺得全選擇題的期中考難，但期末公平，考的是理解和應用。"
      ja: "全問選択式の中間テストは難しいが、期末は理解と応用を問う公平な試験だったという声が複数。"
      ko: "여러 명이 전부 객관식인 중간고사는 어렵지만 기말은 이해와 적용을 묻는 공정한 시험이었다고 한다."
      vi: "Vài người thấy bài giữa kỳ toàn trắc nghiệm khó, nhưng bài cuối kỳ công bằng, kiểm tra sự hiểu và vận dụng."
      ms: "Beberapa pengulas dapati ujian pertengahan semester yang semuanya aneka pilihan sukar tetapi peperiksaan akhir adil, menguji kefahaman dan aplikasi."
      id: "Beberapa pengulas merasa ujian tengah semester yang semuanya pilihan ganda sulit, tapi ujian akhir adil, menguji pemahaman dan penerapan."
      hi: "कई रिव्यूअर्स को पूरी तरह MCQ वाला मिड-सेम टेस्ट कठिन लगा, पर फ़ाइनल परीक्षा उचित, जो समझ और प्रयोग जाँचती है।"
  study:
    - en: "Do the tutorial work, since reviewers say tutorials prepare you well for the exam, and make sure you understand each week's topic before moving on."
      zh: "tutorial 的题要认真做，同学说 tutorial 很能帮你备考；每周的内容弄懂了再往下学。"
      zh-TW: "tutorial 的題目要認真做，同學說 tutorial 很能幫你準備考試；每週的內容弄懂了再往下學。"
      ja: "チュートリアル課題をやること。試験対策に役立つという声。各週の内容を理解してから次へ進む。"
      ko: "튜토리얼 과제를 꼭 하라. 시험 대비에 큰 도움이 된다고 한다. 매주 주제를 이해한 뒤 다음으로 넘어가라."
      vi: "Làm bài tutorial, vì người học nói tutorial chuẩn bị rất tốt cho kỳ thi, và hiểu chủ đề mỗi tuần trước khi sang tuần mới."
      ms: "Buat kerja tutorial kerana pengulas kata tutorial menyediakan anda dengan baik untuk peperiksaan, dan fahami topik setiap minggu sebelum teruskan."
      id: "Kerjakan soal tutorial, karena pengulas bilang tutorial menyiapkan ujian dengan baik, dan pahami topik tiap minggu sebelum lanjut."
      hi: "ट्यूटोरियल का काम करें, क्योंकि रिव्यूअर्स कहते हैं ट्यूटोरियल परीक्षा के लिए अच्छी तैयारी कराते हैं, और हर हफ़्ते का टॉपिक समझकर ही आगे बढ़ें।"
  watch:
    - en: "All these reviews are from 2021 or earlier; teaching and exams may have changed since."
      zh: "这些评价都是 2021 年或更早的，现在的教法和考试可能已经变了。"
      zh-TW: "這些評價都是 2021 年或更早的，現在的教法和考試可能已經變了。"
      ja: "レビューはすべて2021年以前のもの。授業や試験は変わっている可能性がある。"
      ko: "모든 리뷰가 2021년 이전 것이라 지금 수업과 시험은 달라졌을 수 있다."
      vi: "Tất cả đánh giá đều từ năm 2021 trở về trước; cách dạy và thi có thể đã thay đổi."
      ms: "Semua ulasan ini dari 2021 atau lebih awal; pengajaran dan peperiksaan mungkin telah berubah."
      id: "Semua ulasan ini dari 2021 atau sebelumnya; pengajaran dan ujian mungkin sudah berubah."
      hi: "ये सभी रिव्यू 2021 या उससे पहले के हैं; पढ़ाई और परीक्षा अब बदल चुकी हो सकती है।"
