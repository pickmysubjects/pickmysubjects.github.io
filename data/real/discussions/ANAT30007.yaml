  - en: "A big jump from second-year anatomy: heavy memorisation of muscle attachments and nerve supply. Revise steadily instead of cramming."
    zh: "比二年级解剖难度跨度大：需大量记忆肌肉附着点和神经支配。要持续复习，不要临时突击。"
  - en: "Weekly hands-on dissections in small groups are a favourite; preparing tables beforehand makes the long sessions more useful."
    zh: "每周小组亲手解剖深受好评；课前准备好表格，能让长时间的课更有收获。"
  - en: "MSTs are often seen as manageable, but exams test small details, including clinical points and guest-lecture content."
    zh: "期中测验通常被认为不难，但考试会考细节，包括临床知识和客座讲座内容。"
  - en: "Short answers need precise terms; practise labelling and drawing diagrams such as the brachial plexus."
    zh: "简答题需用词精确；要多练习标注和绘图，例如臂丛神经。"
