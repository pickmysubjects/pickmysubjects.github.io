points:
  - en: "A big jump from second-year anatomy: heavy memorisation of muscle attachments and nerve supply. Revise steadily instead of cramming."
    zh: "比二年级解剖难度跨度大：需大量记忆肌肉附着点和神经支配。要持续复习，不要临时突击。"
    zh-TW: "比二年級解剖難度跳很多：要大量背肌肉附著點和神經支配。要持續複習，不要臨時衝刺。"
    ja: "2年次の解剖学から大きくレベルアップ。筋の付着部と神経支配を大量に暗記する。詰め込まず着実に復習を。"
    ko: "2학년 해부학보다 크게 어려워짐: 근육 부착부와 신경 지배를 많이 외워야 함. 몰아서 하지 말고 꾸준히 복습할 것."
    vi: "Khó hơn hẳn giải phẫu năm hai: phải thuộc rất nhiều điểm bám cơ và chi phối thần kinh. Ôn đều, đừng nhồi nhét."
    ms: "Lonjakan besar dari anatomi tahun dua: banyak hafalan lekatan otot dan bekalan saraf. Ulang kaji secara berterusan, jangan tunggu saat akhir."
    id: "Lompatan besar dari anatomi tahun kedua: banyak hafalan perlekatan otot dan persarafan. Belajar rutin, jangan SKS."
    hi: "दूसरे साल की एनाटॉमी से बड़ी छलांग: मांसपेशियों के जुड़ाव और नसों की सप्लाई ढेर सारा याद करना। लगातार रिवाइज़ करें, रटें नहीं।"
  - en: "Weekly hands-on dissections in small groups are a favourite; preparing tables beforehand makes the long sessions more useful."
    zh: "每周小组亲手解剖深受好评；课前准备好表格，能让长时间的课更有收获。"
    zh-TW: "每週小組親手解剖很受歡迎；課前先準備好表格，能讓長時間的課更有收穫。"
    ja: "毎週の少人数での解剖実習が人気。事前に表を準備しておくと長い実習がより有意義になる。"
    ko: "매주 소그룹 직접 해부 실습이 인기. 미리 표를 준비하면 긴 실습이 더 유익해짐."
    vi: "Giải phẫu thực hành hằng tuần theo nhóm nhỏ rất được yêu thích; chuẩn bị bảng trước giúp buổi học dài hiệu quả hơn."
    ms: "Pembedahan amali mingguan dalam kumpulan kecil sangat digemari; sediakan jadual lebih awal supaya sesi panjang lebih berguna."
    id: "Diseksi langsung tiap minggu dalam kelompok kecil jadi favorit; menyiapkan tabel dulu bikin sesi panjang lebih berguna."
    hi: "हर हफ़्ते छोटे ग्रुप में खुद डिसेक्शन करना सबको पसंद है; पहले से टेबल तैयार करने से लंबे सेशन ज़्यादा काम के बनते हैं।"
  - en: "MSTs are often seen as manageable, but exams test small details, including clinical points and guest-lecture content."
    zh: "期中测验通常被认为不难，但考试会考细节，包括临床知识和客座讲座内容。"
    zh-TW: "期中測驗通常被認為還好，但考試會考小細節，包括臨床重點和客座講座內容。"
    ja: "中間テストは何とかなると言われがちだが、試験では臨床ポイントやゲスト講義の内容など細かい点が問われる。"
    ko: "중간시험은 할 만하다는 평이 많지만, 시험은 임상 포인트와 초청 강의 내용 등 세부 사항까지 물어봄."
    vi: "Bài kiểm tra giữa kỳ thường được cho là vừa sức, nhưng thi lại hỏi chi tiết nhỏ, cả ý lâm sàng và nội dung bài giảng khách mời."
    ms: "Ujian pertengahan semester biasanya boleh diurus, tetapi peperiksaan menguji butiran kecil, termasuk perkara klinikal dan kuliah tetamu."
    id: "Ujian tengah semester biasanya masih aman, tapi ujian menguji detail kecil, termasuk poin klinis dan materi kuliah tamu."
    hi: "मिड-सेमेस्टर टेस्ट आमतौर पर संभलने लायक माने जाते हैं, पर एग्ज़ाम में छोटी बातें पूछी जाती हैं, क्लिनिकल पॉइंट और गेस्ट लेक्चर भी।"
  - en: "Short answers need precise terms; practise labelling and drawing diagrams such as the brachial plexus."
    zh: "简答题需用词精确；要多练习标注和绘图，例如臂丛神经。"
    zh-TW: "簡答題用詞要精確；多練習標註和畫圖，例如臂神經叢。"
    ja: "記述問題は正確な用語が必要。腕神経叢などの図のラベル付けや作図を練習しよう。"
    ko: "단답형은 정확한 용어가 필요함. 상완신경총 같은 그림 라벨링과 그리기를 연습할 것."
    vi: "Câu trả lời ngắn cần thuật ngữ chính xác; luyện ghi chú và vẽ sơ đồ như đám rối cánh tay."
    ms: "Jawapan pendek perlukan istilah tepat; latih melabel dan melukis rajah seperti pleksus brakial."
    id: "Jawaban singkat butuh istilah yang tepat; latihan melabeli dan menggambar diagram seperti pleksus brakialis."
    hi: "छोटे उत्तरों में सटीक शब्द चाहिए; ब्रेकियल प्लेक्सस जैसे डायग्राम लेबल करने और बनाने की प्रैक्टिस करें।"
workload: heavy
difficulty: mixed
