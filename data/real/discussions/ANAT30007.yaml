points:
  - en: "A big jump from second-year anatomy: heavy memorisation of muscle attachments and nerve supply. Revise steadily instead of cramming."
    zh: "比二年级解剖难度跨度大：需大量记忆肌肉附着点和神经支配。要持续复习，不要临时突击。"
    zh-TW: "比二年級解剖難度跳很多：要大量背肌肉附著點和神經支配。要持續複習，不要臨時衝刺。"
    ja: "2年次の解剖学から大きくレベルアップ。筋の付着部と神経支配を大量に暗記する。詰め込まず着実に復習を。"
    ko: "2학년 해부학보다 크게 어려워짐: 근육 부착부와 신경 지배를 많이 외워야 함. 몰아서 하지 말고 꾸준히 복습할 것."
    vi: "Khó hơn hẳn giải phẫu năm hai: phải thuộc rất nhiều điểm bám cơ và chi phối thần kinh. Ôn đều, đừng nhồi nhét."
    ms: "Lonjakan besar dari anatomi tahun dua: banyak hafalan lekatan otot dan bekalan saraf. Ulang kaji secara berterusan, jangan tunggu saat akhir."
    id: "Lompatan besar dari anatomi tahun kedua: banyak hafalan perlekatan otot dan persarafan. Belajar rutin, jangan SKS."
    hi: "दूसरे साल की एनाटॉमी से बड़ी छलांग: मांसपेशियों के जुड़ाव और नसों की सप्लाई ढेर सारा याद करना। लगातार रिवाइज़ करें, रटें नहीं।"
  - en: "Weekly hands-on dissections in small groups are a favourite; preparing tables beforehand makes the long sessions more useful."
    zh: "每周小组亲手解剖深受好评；课前准备好表格，能让长时间的课更有收获。"
    zh-TW: "每週小組親手解剖很受歡迎；課前先準備好表格，能讓長時間的課更有收穫。"
    ja: "毎週の少人数での解剖実習が人気。事前に表を準備しておくと長い実習がより有意義になる。"
    ko: "매주 소그룹 직접 해부 실습이 인기. 미리 표를 준비하면 긴 실습이 더 유익해짐."
    vi: "Giải phẫu thực hành hằng tuần theo nhóm nhỏ rất được yêu thích; chuẩn bị bảng trước giúp buổi học dài hiệu quả hơn."
    ms: "Pembedahan amali mingguan dalam kumpulan kecil sangat digemari; sediakan jadual lebih awal supaya sesi panjang lebih berguna."
    id: "Diseksi langsung tiap minggu dalam kelompok kecil jadi favorit; menyiapkan tabel dulu bikin sesi panjang lebih berguna."
    hi: "हर हफ़्ते छोटे ग्रुप में खुद डिसेक्शन करना सबको पसंद है; पहले से टेबल तैयार करने से लंबे सेशन ज़्यादा काम के बनते हैं।"
  - en: "MSTs are often seen as manageable, but exams test small details, including clinical points and guest-lecture content."
    zh: "期中测验通常被认为不难，但考试会考细节，包括临床知识和客座讲座内容。"
    zh-TW: "期中測驗通常被認為還好，但考試會考小細節，包括臨床重點和客座講座內容。"
    ja: "中間テストは何とかなると言われがちだが、試験では臨床ポイントやゲスト講義の内容など細かい点が問われる。"
    ko: "중간시험은 할 만하다는 평이 많지만, 시험은 임상 포인트와 초청 강의 내용 등 세부 사항까지 물어봄."
    vi: "Bài kiểm tra giữa kỳ thường được cho là vừa sức, nhưng thi lại hỏi chi tiết nhỏ, cả ý lâm sàng và nội dung bài giảng khách mời."
    ms: "Ujian pertengahan semester biasanya boleh diurus, tetapi peperiksaan menguji butiran kecil, termasuk perkara klinikal dan kuliah tetamu."
    id: "Ujian tengah semester biasanya masih aman, tapi ujian menguji detail kecil, termasuk poin klinis dan materi kuliah tamu."
    hi: "मिड-सेमेस्टर टेस्ट आमतौर पर संभलने लायक माने जाते हैं, पर एग्ज़ाम में छोटी बातें पूछी जाती हैं, क्लिनिकल पॉइंट और गेस्ट लेक्चर भी।"
  - en: "Short answers need precise terms; practise labelling and drawing diagrams such as the brachial plexus."
    zh: "简答题需用词精确；要多练习标注和绘图，例如臂丛神经。"
    zh-TW: "簡答題用詞要精確；多練習標註和畫圖，例如臂神經叢。"
    ja: "記述問題は正確な用語が必要。腕神経叢などの図のラベル付けや作図を練習しよう。"
    ko: "단답형은 정확한 용어가 필요함. 상완신경총 같은 그림 라벨링과 그리기를 연습할 것."
    vi: "Câu trả lời ngắn cần thuật ngữ chính xác; luyện ghi chú và vẽ sơ đồ như đám rối cánh tay."
    ms: "Jawapan pendek perlukan istilah tepat; latih melabel dan melukis rajah seperti pleksus brakial."
    id: "Jawaban singkat butuh istilah yang tepat; latihan melabeli dan menggambar diagram seperti pleksus brakialis."
    hi: "छोटे उत्तरों में सटीक शब्द चाहिए; ब्रेकियल प्लेक्सस जैसे डायग्राम लेबल करने और बनाने की प्रैक्टिस करें।"
sections:
  content:
    - en: "Neuroanatomy, back, upper and lower limb in much more detail than second year, plus guest lectures. Almost all memorisation: muscle attachments and nerve supply."
      zh: "神经解剖、背部、上肢和下肢，比二年级细很多，另有客座讲座。几乎全靠背：肌肉附着点和神经支配。"
      zh-TW: "神經解剖、背部、上肢和下肢，比二年級細很多，另有客座講座。幾乎全靠背：肌肉附著點和神經支配。"
      ja: "神経解剖、背部、上肢、下肢を2年次よりずっと詳しく学び、ゲスト講義もある。ほぼ暗記で、筋の付着と神経支配が中心。"
      ko: "신경해부, 등, 상지와 하지를 2학년보다 훨씬 자세히 배우고 초청 강의도 있다. 거의 암기로, 근육 부착과 신경 지배가 핵심이다."
      vi: "Giải phẫu thần kinh, lưng, chi trên và chi dưới chi tiết hơn năm hai nhiều, thêm bài giảng khách mời. Gần như toàn học thuộc: bám cơ và chi phối thần kinh."
      ms: "Neuroanatomi, belakang, anggota atas dan bawah jauh lebih terperinci daripada tahun dua, serta kuliah jemputan. Hampir semua menghafal: lekatan otot dan saraf."
      id: "Neuroanatomi, punggung, anggota gerak atas dan bawah jauh lebih rinci dari tahun kedua, plus kuliah tamu. Hampir semuanya hafalan: perlekatan otot dan persarafan."
      hi: "न्यूरोएनाटॉमी, पीठ, ऊपरी और निचले अंग, दूसरे साल से कहीं ज़्यादा विस्तार में, साथ में गेस्ट लेक्चर। लगभग सब रटना: मांसपेशी जुड़ाव और नसों की आपूर्ति।"
    - en: "Most reviewers loved it, especially doing their own dissections in small groups. H1 is seen as very doable with steady effort."
      zh: "多数同学很喜欢，尤其是小组亲手做解剖。只要稳定投入，H1 被认为很有希望。"
      zh-TW: "多數同學很喜歡，尤其是小組親手做解剖。只要穩定投入，H1 被認為很有機會。"
      ja: "多くのレビュアーが高評価で、特に少人数で自ら解剖できる点が好評。地道に努力すればH1は十分可能。"
      ko: "대부분 아주 좋아했고, 특히 소그룹으로 직접 해부하는 것이 좋았다고 한다. 꾸준히 하면 H1이 충분히 가능하다."
      vi: "Đa số rất thích, nhất là được tự mổ xẻ theo nhóm nhỏ. Cố gắng đều đặn thì H1 được cho là rất khả thi."
      ms: "Kebanyakan pengulas sangat suka, terutama melakukan pembedahan sendiri dalam kumpulan kecil. H1 dianggap sangat boleh dicapai dengan usaha berterusan."
      id: "Kebanyakan pengulas sangat suka, terutama melakukan pembedahan sendiri dalam kelompok kecil. H1 dianggap sangat bisa diraih dengan usaha konsisten."
      hi: "ज़्यादातर रिव्यूअर्स को बहुत पसंद आया, ख़ासकर छोटे ग्रुप में ख़ुद डिसेक्शन करना। लगातार मेहनत से H1 काफ़ी संभव माना गया।"
  work:
    - en: "Two multiple-choice MSTs, mostly seen as easy, then a practical exam on labelled images and a theory exam with short answers that asks for very specific details."
      zh: "两次选择题 MST，多数人觉得简单；之后是看图辨认的实操考试，和带简答题的理论考试，问得很细。"
      zh-TW: "兩次選擇題 MST，多數人覺得簡單；之後是看圖辨認的實作考試，和有簡答題的理論考試，問得很細。"
      ja: "選択式のMSTが2回で概ね簡単。その後、画像の名称を答える実技試験と、細かい点を問う記述式を含む理論試験。"
      ko: "객관식 MST 2회는 대체로 쉽다는 평. 이후 사진 라벨링 실기 시험과, 아주 세부적인 걸 묻는 단답형이 있는 이론 시험이 있다."
      vi: "Hai bài MST trắc nghiệm, phần lớn thấy dễ; sau đó là thi thực hành nhận diện trên ảnh và thi lý thuyết có câu tự luận ngắn hỏi rất chi tiết."
      ms: "Dua MST aneka pilihan, kebanyakan rasa mudah, kemudian peperiksaan amali melabel imej dan peperiksaan teori dengan jawapan pendek yang tanya butiran sangat khusus."
      id: "Dua MST pilihan ganda, umumnya dianggap mudah, lalu ujian praktik melabel gambar dan ujian teori dengan isian singkat yang menanyakan detail sangat spesifik."
      hi: "दो MCQ वाले MST, ज़्यादातर को आसान लगे; फिर तस्वीरों पर लेबल वाली प्रैक्टिकल परीक्षा और शॉर्ट आंसर वाली थ्योरी परीक्षा, जो बहुत बारीक बातें पूछती है।"
    - en: "Guest lectures and clinical examples are examined, often a question or two each, and several reviewers say small details mentioned briefly still get tested."
      zh: "客座讲座和临床例子都会考，通常每个一两道题；好几位同学说一笔带过的小细节也会考。"
      zh-TW: "客座講座和臨床例子都會考，通常每個一兩題；好幾位同學說一筆帶過的小細節也會考。"
      ja: "ゲスト講義や臨床例も出題され、各1〜2問程度。軽く触れただけの細部も出るという声が複数。"
      ko: "초청 강의와 임상 사례도 각각 한두 문제씩 나오고, 잠깐 언급된 세부도 시험에 나온다는 평이 여럿."
      vi: "Bài giảng khách mời và ví dụ lâm sàng đều được thi, thường một hai câu mỗi phần; vài người nói chi tiết nhỏ chỉ nhắc qua vẫn bị hỏi."
      ms: "Kuliah jemputan dan contoh klinikal diuji, biasanya satu dua soalan setiap satu; beberapa pengulas kata butiran kecil yang disebut sekilas tetap diuji."
      id: "Kuliah tamu dan contoh klinis ikut diujikan, biasanya satu dua soal masing-masing; beberapa pengulas bilang detail kecil yang disebut sekilas tetap keluar."
      hi: "गेस्ट लेक्चर और क्लिनिकल उदाहरण भी परीक्षा में आते हैं, अक्सर हर एक से एक-दो सवाल; कई रिव्यूअर्स कहते हैं थोड़ी देर बताई गई बारीकियाँ भी पूछी जाती हैं।"
  study:
    - en: "Use active recall: draw the brachial plexus, label diagrams, fill in muscle tables before pracs, and revise weekly instead of cramming."
      zh: "用主动回忆：画臂丛，给图标注，实验前先填好肌肉表，每周复习，不要临时抱佛脚。"
      zh-TW: "用主動回想：畫臂神經叢，幫圖標註，實驗前先填好肌肉表，每週複習，不要臨時抱佛腳。"
      ja: "アクティブリコールを。腕神経叢を描き、図に名称を書き込み、実習前に筋の表を埋め、詰め込みではなく毎週復習する。"
      ko: "능동적 회상을 써라. 상완신경총을 그리고, 그림에 라벨을 달고, 실습 전에 근육 표를 채우며, 벼락치기 말고 매주 복습하라."
      vi: "Dùng cách tự nhớ lại: vẽ đám rối cánh tay, điền tên lên hình, điền bảng cơ trước buổi thực hành, và ôn hằng tuần thay vì nhồi nhét."
      ms: "Guna ingat semula aktif: lukis pleksus brakial, labelkan rajah, isi jadual otot sebelum amali, dan ulang kaji setiap minggu, bukan sumbat saat akhir."
      id: "Pakai active recall: gambar pleksus brakialis, beri label diagram, isi tabel otot sebelum praktikum, dan ulang tiap minggu, bukan sistem kebut semalam."
      hi: "एक्टिव रिकॉल अपनाएँ: ब्रैकियल प्लेक्सस बनाएँ, डायग्राम लेबल करें, प्रैक से पहले मांसपेशी टेबल भरें, और रटने के बजाय हर हफ़्ते दोहराएँ।"
  watch:
    - en: "The workload is heavy. Some found the neuro lectures dense, with much left to read in your own time, and earlier reviewers found the first exam hard."
      zh: "工作量大。有人觉得神经部分的课很密，很多内容让你自己读；更早的同学觉得第一场考试很难。"
      zh-TW: "工作量大。有人覺得神經部分的課很密，很多內容要你自己讀；較早的同學覺得第一場考試很難。"
      ja: "作業量は多い。神経の講義は密度が高く自習に回される部分が多いという声、以前のレビューでは最初の試験が難しかったという声も。"
      ko: "작업량이 많다. 신경 파트 강의가 빽빽하고 혼자 읽으라는 내용이 많다는 의견, 예전 리뷰에선 첫 시험이 어려웠다는 의견도 있다."
      vi: "Khối lượng nặng. Có người thấy bài giảng thần kinh dày đặc, nhiều phần phải tự đọc; người học trước đây thấy bài thi đầu tiên khó."
      ms: "Beban kerja berat. Ada yang rasa kuliah neuro padat dan banyak ditinggalkan untuk dibaca sendiri, dan pengulas terdahulu rasa peperiksaan pertama sukar."
      id: "Bebannya berat. Ada yang merasa kuliah neuro padat dan banyak yang disuruh baca sendiri, dan pengulas sebelumnya merasa ujian pertama sulit."
      hi: "वर्कलोड भारी है। कुछ को न्यूरो लेक्चर घने लगे, जिनमें बहुत कुछ ख़ुद पढ़ने को छोड़ा गया, और पहले के रिव्यूअर्स को पहली परीक्षा कठिन लगी।"
workload: heavy
difficulty: mixed
