points:
  - en: "The group research project is the highlight and gives a taste of Honours research."
    zh: "小组研究项目是亮点，让人提前体验荣誉学位的研究。"
    zh-TW: "小組研究專題是亮點，讓人提前體驗榮譽學位的研究。"
    ja: "グループ研究プロジェクトが目玉で、Honoursの研究を体験できます。"
    ko: "조별 연구 프로젝트가 핵심이며 Honours 연구를 미리 맛볼 수 있습니다."
    vi: "Dự án nghiên cứu nhóm là điểm nổi bật và cho bạn nếm thử nghiên cứu Honours."
    ms: "Projek penyelidikan berkumpulan ialah kemuncak dan memberi gambaran penyelidikan Honours."
    id: "Proyek riset kelompok jadi sorotan dan memberi gambaran riset Honours."
    hi: "ग्रुप रिसर्च प्रोजेक्ट इसकी खासियत है और Honours रिसर्च का अनुभव देता है।"
  - en: "Your experience depends on your topic and group, though the main lab report is individual."
    zh: "体验取决于分到的课题和组员，但主要实验报告是个人完成。"
    zh-TW: "體驗取決於分到的題目和組員，但主要實驗報告是個人完成。"
    ja: "体験はテーマとグループ次第ですが、メインの実験レポートは個人で書きます。"
    ko: "경험은 주제와 조에 따라 달라지지만, 주요 실험 보고서는 개인 과제입니다."
    vi: "Trải nghiệm phụ thuộc vào đề tài và nhóm, dù báo cáo thí nghiệm chính là cá nhân."
    ms: "Pengalaman anda bergantung pada topik dan kumpulan, walaupun laporan makmal utama adalah individu."
    id: "Pengalamanmu tergantung topik dan kelompok, meski laporan lab utamanya individu."
    hi: "आपका अनुभव टॉपिक और ग्रुप पर निर्भर है, हालाँकि मुख्य लैब रिपोर्ट व्यक्तिगत है।"
  - en: "Many found the lectures random or jumpy in topic, and the exam somewhat challenging."
    zh: "很多人觉得讲座主题跳跃、缺乏连贯，考试有一定难度。"
    zh-TW: "很多人覺得講座主題跳躍、缺乏連貫，考試有一定難度。"
    ja: "講義はテーマがばらばらで飛びがちだと感じた人が多く、試験もやや難しいです。"
    ko: "강의 주제가 뒤죽박죽이고 왔다 갔다 한다는 사람이 많았고, 시험도 다소 어렵습니다."
    vi: "Nhiều người thấy bài giảng chủ đề lộn xộn, nhảy cóc, và bài thi khá khó."
    ms: "Ramai dapati kuliah rawak atau melompat-lompat topiknya, dan peperiksaan agak mencabar."
    id: "Banyak yang merasa topik kuliah acak atau melompat-lompat, dan ujiannya cukup menantang."
    hi: "कई लोगों को लेक्चर्स के टॉपिक बेतरतीब या उछलते हुए लगे, और एग्ज़ाम कुछ हद तक कठिन।"
