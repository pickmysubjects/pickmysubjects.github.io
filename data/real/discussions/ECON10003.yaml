code: ECON10003
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/econ10003
reviews: 10
from: 2017
to: 2024
checked: 2026-10-08
points:
  - en: "Many found the lectures long and dull, and recent reviewers felt the teaching relied on rote learning of models."
    zh: "许多人认为讲座冗长乏味，近期评价认为教学过于依赖死记模型。"
    zh-TW: "許多人覺得講課又長又無聊，近期評論者覺得教學太依賴死背模型。"
    ja: "講義が長く退屈だという人が多く、最近のレビューではモデルの丸暗記に頼った授業だと感じられた。"
    ko: "강의가 길고 지루하다는 사람이 많고, 최근 리뷰어들은 모델 암기에 의존하는 수업이라고 느꼈다."
    vi: "Nhiều người thấy bài giảng dài và chán, và đánh giá gần đây cho rằng cách dạy dựa vào học thuộc mô hình."
    ms: "Ramai dapati kuliah panjang dan membosankan, dan pengulas terkini rasa pengajaran bergantung pada hafalan model."
    id: "Banyak yang merasa kuliahnya panjang dan membosankan, dan ulasan terbaru merasa pengajarannya bergantung pada hafalan model."
    hi: "कई लोगों को लेक्चर लंबे और उबाऊ लगे, और हाल के रिव्यूअर्स को लगा कि पढ़ाई मॉडल रटने पर टिकी है।"
  - en: "Understand the logic behind the models so you can apply them to new situations. Review sessions help."
    zh: "要理解模型背后的逻辑，以便应用到新情境；复习课很有帮助。"
    zh-TW: "要理解模型背後的邏輯，才能應用到新情境。複習課有幫助。"
    ja: "新しい状況に応用できるよう、モデルの背後にある論理を理解しよう。復習セッションが役立つ。"
    ko: "새로운 상황에 적용할 수 있도록 모델 뒤의 논리를 이해하자. 복습 세션이 도움이 된다."
    vi: "Hiểu logic đằng sau các mô hình để áp dụng vào tình huống mới. Các buổi ôn tập rất hữu ích."
    ms: "Fahami logik di sebalik model supaya anda boleh mengaplikasikannya pada situasi baharu. Sesi ulang kaji membantu."
    id: "Pahami logika di balik model agar bisa menerapkannya ke situasi baru. Sesi review membantu."
    hi: "मॉडल के पीछे का तर्क समझें ताकि उन्हें नई स्थितियों में लागू कर सकें। रिव्यू सेशन मदद करते हैं।"
  - en: "Opinions on difficulty are split: some found the exam easy, others found it very challenging."
    zh: "难度看法不一：有人觉得考试简单，也有人认为很难。"
    zh-TW: "對難度看法不一：有人覺得考試簡單，也有人覺得非常難。"
    ja: "難易度の評価は分かれる。試験が簡単だった人もいれば、非常に難しかった人もいる。"
    ko: "난이도 의견은 갈린다. 시험이 쉬웠다는 사람도, 매우 어려웠다는 사람도 있다."
    vi: "Ý kiến về độ khó trái chiều: có người thấy đề dễ, người khác thấy rất khó."
    ms: "Pandangan tentang kesukaran berbelah bahagi: ada yang dapati peperiksaan mudah, ada yang rasa sangat mencabar."
    id: "Pendapat soal kesulitan terbelah: ada yang merasa ujiannya mudah, ada yang merasa sangat menantang."
    hi: "कठिनाई पर राय बंटी है: कुछ को परीक्षा आसान लगी, दूसरों को बहुत कठिन।"
  - en: "Compared with Intro Micro it has lighter maths but more theory and writing, and several found it less interesting."
    zh: "与微观经济学入门相比，数学较少但理论和写作更多，多位认为趣味性较低。"
    zh-TW: "和Intro Micro相比，數學較少但理論和寫作較多，幾位覺得比較沒那麼有趣。"
    ja: "Intro Microと比べて数学は軽いが理論と記述が多く、面白さで劣るという声が複数。"
    ko: "Intro Micro에 비해 수학은 가볍지만 이론과 글쓰기가 많고, 여러 명이 덜 재미있다고 느꼈다."
    vi: "So với Intro Micro, phần toán nhẹ hơn nhưng nhiều lý thuyết và viết hơn, và vài người thấy kém thú vị hơn."
    ms: "Berbanding Intro Micro, matematiknya lebih ringan tetapi lebih banyak teori dan penulisan, dan beberapa dapati ia kurang menarik."
    id: "Dibanding Intro Micro, matematikanya lebih ringan tapi lebih banyak teori dan menulis, dan beberapa merasa kurang menarik."
    hi: "Intro Micro की तुलना में मैथ्स हल्की पर थ्योरी और लिखना ज़्यादा है, और कई को यह कम दिलचस्प लगा।"
sections:
  content:
    - en: "Macro models and diagrams, with more theory and less maths than intro micro. Some found it clear and interesting; many found the long lectures dry and the models abstract."
      zh: "宏观模型和图像，比入门微观理论多、数学少。有人觉得清楚有趣；很多人觉得 lecture 冗长枯燥、模型很抽象。"
      zh-TW: "總經模型和圖形，比入門個經理論多、數學少。有人覺得清楚有趣；很多人覺得 lecture 冗長乏味、模型很抽象。"
      ja: "マクロのモデルと図表。入門ミクロより理論が多く数学は少ない。分かりやすく面白いという人も、長い講義が退屈でモデルが抽象的だという人も多い。"
      ko: "거시 모형과 그래프. 입문 미시보다 이론이 많고 수학은 적다. 명확하고 흥미롭다는 사람도, 긴 강의가 지루하고 모형이 추상적이라는 사람도 많다."
      vi: "Mô hình và đồ thị vĩ mô, nhiều lý thuyết, ít toán hơn vi mô nhập môn. Có người thấy rõ ràng, thú vị; nhiều người thấy bài giảng dài, khô và mô hình trừu tượng."
      ms: "Model dan rajah makro, lebih teori dan kurang matematik dari mikro pengenalan. Ada yang rasa jelas dan menarik; ramai rasa kuliah panjang hambar dan model abstrak."
      id: "Model dan diagram makro, lebih banyak teori dan lebih sedikit matematika dari mikro pengantar. Ada yang merasa jelas dan menarik; banyak yang merasa kuliahnya panjang, kering, dan modelnya abstrak."
      hi: "मैक्रो मॉडल और डायग्राम, इंट्रो माइक्रो से ज़्यादा थ्योरी और कम मैथ्स। कुछ को साफ़ और रोचक लगा; कई को लंबे लेक्चर नीरस और मॉडल अमूर्त लगे।"
  work:
    - en: "Marks depend on applying theory in writing and diagrams. Views on the exam vary from quite easy to very challenging; one reviewer found diagram marking harsh."
      zh: "分数取决于能否用文字和图像运用理论。对考试的看法从“挺简单”到“很难”都有；有一位同学觉得画图题改得很严。"
      zh-TW: "分數取決於能否用文字和圖形運用理論。對考試的看法從「挺簡單」到「很難」都有；有一位同學覺得畫圖題改得很嚴。"
      ja: "点数は理論を文章や図で応用できるか次第。試験の評価は簡単から非常に難しいまで様々。図の採点が厳しかったという人が一人。"
      ko: "점수는 이론을 글과 그래프로 적용하는 능력에 달렸다. 시험 평가는 꽤 쉬웠다부터 매우 어려웠다까지. 그래프 채점이 가혹했다는 리뷰어가 한 명."
      vi: "Điểm phụ thuộc vào việc áp dụng lý thuyết bằng lời và đồ thị. Ý kiến về bài thi từ khá dễ đến rất khó; một người thấy chấm đồ thị gắt."
      ms: "Markah bergantung pada mengaplikasi teori dalam penulisan dan rajah. Pandangan tentang peperiksaan dari agak mudah hingga sangat mencabar; seorang rasa pemarkahan rajah keras."
      id: "Nilai tergantung pada penerapan teori dalam tulisan dan diagram. Pendapat soal ujian dari cukup mudah sampai sangat menantang; satu reviewer merasa penilaian diagram keras."
      hi: "अंक इस पर निर्भर हैं कि आप थ्योरी को लिखकर और डायग्राम से कितना लागू कर पाते हैं। परीक्षा पर राय 'काफ़ी आसान' से 'बहुत चुनौतीपूर्ण' तक; एक को डायग्राम की मार्किंग सख़्त लगी।"
  study:
    - en: "Understand the logic behind each model so you can apply it to new situations; falling behind on one concept makes later ones hard. Review sessions are worth watching."
      zh: "弄懂每个模型背后的逻辑，才能套用到新情境；一个概念没懂，后面就很难跟。复习课值得看。"
      zh-TW: "弄懂每個模型背後的邏輯，才能套用到新情境；一個概念沒懂，後面就很難跟。複習課值得看。"
      ja: "各モデルの論理を理解し、新しい状況に応用できるように。一つの概念でつまずくと後が難しくなる。復習セッションは見る価値あり。"
      ko: "각 모형의 논리를 이해해 새 상황에 적용할 수 있게 하자. 한 개념에서 막히면 뒤가 어려워진다. 복습 세션은 볼 가치가 있다."
      vi: "Hiểu logic đằng sau mỗi mô hình để áp dụng vào tình huống mới; hổng một khái niệm thì phần sau rất khó. Các buổi ôn tập đáng xem."
      ms: "Fahami logik di sebalik setiap model supaya boleh digunakan pada situasi baharu; ketinggalan satu konsep menyukarkan yang seterusnya. Sesi ulang kaji berbaloi ditonton."
      id: "Pahami logika di balik tiap model agar bisa diterapkan pada situasi baru; tertinggal satu konsep bikin yang berikutnya sulit. Sesi review layak ditonton."
      hi: "हर मॉडल के पीछे का तर्क समझें ताकि नई स्थितियों पर लागू कर सकें; एक कॉन्सेप्ट छूटा तो आगे कठिन होता है। रिव्यू सेशन देखने लायक हैं।"
difficulty: mixed
