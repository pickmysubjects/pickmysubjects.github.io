code: MKTG20001
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/mktg20001
reviews: 5
from: 2016
to: 2019
checked: 2026-10-13
points:
  - en: "Several reviewers say there is a lot of content, so keep up each week and get a feel for how the subject is structured."
    zh: "好几位评价者说内容很多，要每周跟上，并弄清课程的整体结构。"
    zh-TW: "好幾位評價者說內容很多，要每週跟上，並弄清課程的整體結構。"
    ja: "内容が多いという声が複数。毎週ついていき、科目の構成を把握しておこう。"
    ko: "내용이 많다는 리뷰가 여럿이다. 매주 따라가고 과목 구성을 파악해 두자."
    vi: "Vài người nói nội dung rất nhiều, nên theo kịp mỗi tuần và nắm cấu trúc môn học."
    ms: "Beberapa pengulas kata kandungannya banyak, jadi ikuti setiap minggu dan fahami struktur subjek."
    id: "Beberapa pengulas bilang materinya banyak, jadi ikuti tiap minggu dan pahami struktur mata kuliahnya."
    hi: "कई रिव्यूअर्स कहते हैं कि कंटेंट बहुत है, इसलिए हर हफ़्ते साथ चलें और विषय की संरचना समझ लें।"
  - en: "Most found the assessments and final exam fairly easy, with an H1 within reach, but one reviewer found the exam very hard."
    zh: "多数人觉得作业和期末考试比较简单，H1 有望拿到，但有一位觉得考试非常难。"
    zh-TW: "多數人覺得作業和期末考比較簡單，H1 有望拿到，但有一位覺得考試非常難。"
    ja: "多くは課題も期末試験も比較的簡単でH1も狙えるとするが、試験がとても難しかったという人も1人いる。"
    ko: "대부분 과제와 기말시험이 비교적 쉽고 H1도 가능하다고 했지만, 시험이 매우 어려웠다는 사람도 한 명 있다."
    vi: "Đa số thấy bài tập và thi cuối khá dễ, có thể đạt H1, nhưng một người thấy bài thi rất khó."
    ms: "Kebanyakan dapati penilaian dan peperiksaan akhir agak mudah, H1 boleh dicapai, tetapi seorang dapati peperiksaan sangat sukar."
    id: "Sebagian besar merasa tugas dan ujian akhir cukup mudah, H1 bisa diraih, tapi satu pengulas merasa ujiannya sangat sulit."
    hi: "ज़्यादातर को असेसमेंट और फ़ाइनल परीक्षा काफ़ी आसान लगे, H1 पहुँच में है, लेकिन एक रिव्यूअर को परीक्षा बहुत कठिन लगी।"
  - en: "Views on teaching are split: some found lectures long or repetitive and preferred self-study, while others found the subject well organised and enjoyable."
    zh: "对教学看法不一：有人觉得讲座冗长重复，宁愿自学；也有人觉得课程组织得好、学得开心。"
    zh-TW: "對教學看法不一：有人覺得講座冗長重複，寧願自學；也有人覺得課程組織良好、學得開心。"
    ja: "授業の評価は分かれる。講義が長く繰り返しが多いので独学を好んだ人もいれば、よく整理されていて楽しいという人も。"
    ko: "수업 평가는 갈린다. 강의가 길고 반복적이라 독학을 선호한 사람도 있고, 잘 짜여 있고 즐거웠다는 사람도 있다."
    vi: "Ý kiến về giảng dạy chia rẽ: có người thấy bài giảng dài, lặp lại và thích tự học hơn, người khác thấy môn được tổ chức tốt và thú vị."
    ms: "Pandangan tentang pengajaran berbelah: ada yang dapati kuliah panjang atau berulang dan lebih suka belajar sendiri, ada yang dapati subjek tersusun dan menyeronokkan."
    id: "Pendapat soal pengajaran terbelah: ada yang merasa kuliah panjang atau berulang dan lebih suka belajar sendiri, ada yang merasa mata kuliah tertata dan menyenangkan."
    hi: "पढ़ाई पर राय बंटी है: कुछ को लेक्चर लंबे या दोहराव भरे लगे और उन्होंने खुद पढ़ना बेहतर समझा, जबकि कुछ को विषय सुव्यवस्थित और मज़ेदार लगा।"
sections:
  content:
    - en: "Reviewers found the subject enjoyable but say there's a heap of content, and one found the lectures boring. Understanding how the course is structured helps."
      zh: "同学觉得这门课不错，但内容非常多，也有人觉得讲课无聊。弄清楚课程的结构会有帮助。"
      zh-TW: "同學覺得這門課不錯，但內容非常多，也有人覺得講課無聊。弄清楚課程的架構會有幫助。"
      ja: "楽しい科目だが内容が非常に多く、講義が退屈という人も。コースの構成を理解しておくと助かる。"
      ko: "즐거운 과목이지만 내용이 아주 많고, 강의가 지루했다는 사람도 있다. 과목 구성을 이해하면 도움이 된다."
      vi: "Người học thấy môn này hay nhưng nội dung rất nhiều, và một người thấy bài giảng chán. Hiểu cách khóa học được sắp xếp sẽ giúp ích."
      ms: "Pengulas rasa subjek ini seronok tetapi kandungannya sangat banyak, dan seorang rasa kuliah membosankan. Memahami struktur kursus membantu."
      id: "Pengulas merasa mata kuliah ini menyenangkan tapi materinya sangat banyak, dan satu merasa kuliahnya membosankan. Memahami struktur kursus membantu."
      hi: "रिव्यूअर्स को विषय मज़ेदार लगा पर सामग्री बहुत है, और एक को लेक्चर उबाऊ लगे। कोर्स की संरचना समझना मदद करता है।"
  work:
    - en: "Assessments are fairly easy and an H1 isn't too hard, but several found studying for the exam tough because of the volume; others found the exam straightforward."
      zh: "考核比较简单，H1 不算太难；但好几位说内容太多，备考很辛苦，也有人觉得期末很直接。"
      zh-TW: "考核比較簡單，H1 不算太難；但好幾位說內容太多，準備考試很辛苦，也有人覺得期末很直接。"
      ja: "課題は比較的簡単でH1もそれほど難しくないが、量が多く試験勉強が大変という声が複数。試験は素直だったという人もいる。"
      ko: "평가는 꽤 쉽고 H1도 어렵지 않지만, 양이 많아 시험 공부가 힘들었다는 사람이 여럿. 시험이 무난했다는 사람도 있다."
      vi: "Bài đánh giá khá dễ và H1 không quá khó, nhưng nhiều người thấy ôn thi vất vả vì khối lượng; người khác thấy đề dễ hiểu."
      ms: "Penilaian agak mudah dan H1 tidak terlalu sukar, tetapi beberapa rasa ulang kaji peperiksaan berat kerana jumlahnya; yang lain rasa peperiksaan mudah."
      id: "Penilaian cukup mudah dan H1 tidak terlalu sulit, tapi beberapa merasa belajar untuk ujian berat karena banyaknya materi; yang lain merasa ujiannya lugas."
      hi: "आकलन काफ़ी आसान हैं और H1 ज़्यादा कठिन नहीं, पर कई को मात्रा के कारण परीक्षा की तैयारी कठिन लगी; दूसरों को परीक्षा सीधी लगी।"
  watch:
    - en: "Keep on top of the content week by week. Opinions on tutorials vary with the tutor."
      zh: "每周都要跟上内容。对 tutorial 的评价因 tutor 而异。"
      zh-TW: "每週都要跟上內容。對 tutorial 的評價因 tutor 而異。"
      ja: "毎週内容についていくこと。チュートリアルの評価はチューター次第で分かれる。"
      ko: "매주 내용을 따라갈 것. 튜토리얼 평가는 튜터에 따라 다르다."
      vi: "Theo kịp nội dung từng tuần. Đánh giá về tutorial tùy tutor."
      ms: "Ikuti kandungan minggu demi minggu. Pendapat tentang tutorial berbeza mengikut tutor."
      id: "Ikuti materi minggu demi minggu. Pendapat soal tutorial berbeda tergantung tutor."
      hi: "हर हफ़्ते सामग्री के साथ बने रहें। ट्यूटोरियल पर राय ट्यूटर के हिसाब से अलग है।"
    - en: "All these reviews are from 2019 or earlier; teaching and exams may have changed since."
      zh: "这些评价都是 2019 年或更早的，现在的教法和考试可能已经变了。"
      zh-TW: "這些評價都是 2019 年或更早的，現在的教法和考試可能已經變了。"
      ja: "レビューはすべて2019年以前のもの。授業や試験は変わっている可能性がある。"
      ko: "모든 리뷰가 2019년 이전 것이라 지금 수업과 시험은 달라졌을 수 있다."
      vi: "Tất cả đánh giá đều từ năm 2019 trở về trước; cách dạy và thi có thể đã thay đổi."
      ms: "Semua ulasan ini dari 2019 atau lebih awal; pengajaran dan peperiksaan mungkin telah berubah."
      id: "Semua ulasan ini dari 2019 atau sebelumnya; pengajaran dan ujian mungkin sudah berubah."
      hi: "ये सभी रिव्यू 2019 या उससे पहले के हैं; पढ़ाई और परीक्षा अब बदल चुकी हो सकती है।"
