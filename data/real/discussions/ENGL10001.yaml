code: ENGL10001
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/engl10001
reviews: 6
from: 2017
to: 2021
checked: 2026-10-17
points:
  - en: "Reviewers liked the text list (modernist novels, plays and poetry) and the tutorial discussions; lectures got mixed comments."
    zh: "评论者喜欢书单（现代主义小说、戏剧和诗歌）和辅导课讨论；讲座评价不一。"
    zh-TW: "評論者喜歡書單（現代主義小說、戲劇和詩歌）和輔導課討論；講課評價不一。"
    ja: "作品リスト（モダニズムの小説、戯曲、詩）とチュートリアルの議論は好評。講義の評価は分かれる。"
    ko: "작품 목록(모더니즘 소설, 희곡, 시)과 튜토리얼 토론은 호평. 강의는 평이 엇갈림."
    vi: "Người đánh giá thích danh sách tác phẩm (tiểu thuyết, kịch và thơ hiện đại chủ nghĩa) và thảo luận tutorial; bài giảng thì ý kiến trái chiều."
    ms: "Pengulas suka senarai teks (novel, drama dan puisi modenis) dan perbincangan tutorial; kuliah mendapat ulasan bercampur."
    id: "Pengulas suka daftar teksnya (novel, drama, dan puisi modernis) dan diskusi tutorial; kuliahnya mendapat tanggapan beragam."
    hi: "रिव्यूअर्स को टेक्स्ट लिस्ट (मॉडर्निस्ट उपन्यास, नाटक और कविता) और ट्यूटोरियल चर्चाएँ पसंद आईं; लेक्चर पर राय मिली-जुली रही।"
  - en: "It moves at about a text a week, which some found rushed. You only need to write on a few texts, so understanding key themes matters more than finishing every book."
    zh: "大约每周一本书，有人觉得太赶。只需针对其中几本写作，所以抓住核心主题比读完每本书更重要。"
    zh-TW: "大約每週一本書，有人覺得太趕。只需針對其中幾本寫作，所以抓住核心主題比讀完每本書更重要。"
    ja: "ほぼ週に1作品のペースで、駆け足と感じた人もいる。書くのは数作品だけなので、全部読み切るより主要テーマの理解が大事。"
    ko: "대략 매주 한 작품 속도라 빠르다고 느낀 사람도 있음. 몇 작품에 대해서만 쓰면 되니 다 읽기보다 핵심 주제 파악이 중요."
    vi: "Khoảng một tác phẩm mỗi tuần, vài người thấy vội. Bạn chỉ cần viết về vài tác phẩm, nên nắm chủ đề chính quan trọng hơn đọc hết."
    ms: "Ia bergerak kira-kira satu teks seminggu, yang ada rasa tergesa-gesa. Anda hanya perlu menulis tentang beberapa teks, jadi memahami tema utama lebih penting daripada menghabiskan setiap buku."
    id: "Temponya sekitar satu teks per minggu, yang dirasa terburu-buru oleh sebagian orang. Kamu hanya perlu menulis tentang beberapa teks, jadi memahami tema utama lebih penting daripada menamatkan semua buku."
    hi: "लगभग हर हफ़्ते एक किताब चलती है, जो कुछ को जल्दबाज़ी लगी। लिखना सिर्फ़ कुछ किताबों पर है, इसलिए हर किताब पूरी करने से ज़्यादा ज़रूरी मुख्य थीम समझना है।"
sections:
  content:
    - en: "An intro to uni-level literature with well-chosen modern texts, about one a week. Most reviewers enjoyed it; some found it rushed compared with VCE Literature."
      zh: "大学文学入门，选的现代作品不错，大约一周一本。多数同学很喜欢；也有人觉得比起 VCE Literature 太赶。"
      zh-TW: "大學文學入門，選的現代作品不錯，大約一週一本。多數同學很喜歡；也有人覺得比起 VCE Literature 太趕。"
      ja: "大学レベルの文学入門で、よく選ばれた現代作品を週1冊ほど読む。多くは楽しんだが、VCE Literatureに比べて駆け足だという声も。"
      ko: "대학 수준 문학 입문으로, 잘 고른 현대 작품을 주 1권 정도 읽는다. 대부분 즐겼지만 VCE Literature에 비해 급하다는 사람도 있다."
      vi: "Nhập môn văn học đại học với tác phẩm hiện đại được chọn kỹ, khoảng một quyển mỗi tuần. Đa số thích; vài người thấy gấp so với VCE Literature."
      ms: "Pengenalan sastera peringkat universiti dengan teks moden pilihan baik, kira-kira satu seminggu. Kebanyakan suka; ada yang rasa tergesa-gesa berbanding VCE Literature."
      id: "Pengantar sastra tingkat universitas dengan teks modern pilihan, sekitar satu per minggu. Sebagian besar suka; ada yang merasa terburu-buru dibanding VCE Literature."
      hi: "विश्वविद्यालय स्तर के साहित्य का परिचय, अच्छी तरह चुनी आधुनिक किताबों के साथ, लगभग एक हर हफ़्ते। ज़्यादातर को पसंद आया; कुछ को VCE Literature की तुलना में जल्दबाज़ी लगी।"
  work:
    - en: "Essays with flexible questions built around given themes, and a final portfolio. You only need to write on a few of the texts (one reviewer said four)."
      zh: "论文题目比较灵活，围绕给定主题写，还有期末 portfolio。只需写其中几本书（有同学说四本）。"
      zh-TW: "論文題目比較彈性，圍繞給定主題寫，還有期末 portfolio。只需寫其中幾本書（有同學說四本）。"
      ja: "与えられたテーマに沿う柔軟な問いのエッセイと最終ポートフォリオ。書くのは数冊分だけでよい（4冊という人も）。"
      ko: "주어진 주제를 바탕으로 한 유연한 에세이 문제와 기말 포트폴리오. 몇 작품에 대해서만 쓰면 된다(한 리뷰는 4권)."
      vi: "Bài luận với câu hỏi linh hoạt quanh các chủ đề cho sẵn, và portfolio cuối kỳ. Chỉ cần viết về vài tác phẩm (một người nói bốn)."
      ms: "Esei dengan soalan fleksibel berdasarkan tema yang diberi, dan portfolio akhir. Anda hanya perlu menulis tentang beberapa teks (seorang kata empat)."
      id: "Esai dengan pertanyaan fleksibel seputar tema yang diberikan, dan portofolio akhir. Kamu hanya perlu menulis tentang beberapa teks (satu bilang empat)."
      hi: "दिए गए विषयों पर लचीले सवालों वाले निबंध, और एक फ़ाइनल पोर्टफ़ोलियो। सिर्फ़ कुछ किताबों पर लिखना होता है (एक ने कहा चार)।"
  study:
    - en: "Reviewers say not to stress about finishing every book; focus on key themes and context, but read the week's text so the one-hour tutorial is worth it."
      zh: "同学说不用纠结每本都读完，抓住主题和背景就好；不过要读当周的书，一小时的 tutorial 才有收获。"
      zh-TW: "同學說不用糾結每本都讀完，抓住主題和背景就好；不過要讀當週的書，一小時的 tutorial 才有收穫。"
      ja: "全部読み切ろうと焦らず、主要テーマと背景をつかめばよいという。ただ1時間のチュートリアルを生かすにはその週の作品は読むこと。"
      ko: "모든 책을 다 읽으려 애쓰지 말고 핵심 주제와 맥락에 집중하되, 1시간 튜토리얼이 의미 있으려면 그 주 작품은 읽으라는 평."
      vi: "Người học nói đừng áp lực phải đọc hết mọi cuốn; tập trung chủ đề chính và bối cảnh, nhưng hãy đọc tác phẩm của tuần để tutorial một tiếng có ích."
      ms: "Pengulas kata jangan tertekan untuk habiskan setiap buku; fokus pada tema utama dan konteks, tetapi baca teks minggu itu supaya tutorial sejam berbaloi."
      id: "Pengulas bilang jangan stres menamatkan setiap buku; fokus pada tema utama dan konteks, tapi baca teks minggu itu agar tutorial satu jam bermanfaat."
      hi: "रिव्यूअर्स कहते हैं हर किताब खत्म करने का तनाव न लें; मुख्य विषयों और संदर्भ पर ध्यान दें, पर उस हफ़्ते की किताब पढ़ें ताकि एक घंटे का ट्यूटोरियल काम आए।"
  watch:
    - en: "Opinions on lectures differ: some loved them, others found them heavy on history and author background and not much help for assessments."
      zh: "对讲课看法不一：有人很喜欢，也有人觉得讲太多历史和作者背景，对考核帮助不大。"
      zh-TW: "對講課看法不一：有人很喜歡，也有人覺得講太多歷史和作者背景，對考核幫助不大。"
      ja: "講義の評価は分かれ、大好きな人もいれば、歴史や作家の背景に偏り課題の役に立たないという人も。"
      ko: "강의 평가는 갈린다. 아주 좋아한 사람도, 역사와 작가 배경 위주라 평가에 별 도움이 안 됐다는 사람도 있다."
      vi: "Ý kiến về bài giảng khác nhau: có người rất thích, người khác thấy nặng lịch sử và tiểu sử tác giả, ít giúp cho bài đánh giá."
      ms: "Pendapat tentang kuliah berbeza: ada yang suka, ada yang rasa terlalu banyak latar sejarah dan pengarang serta kurang membantu penilaian."
      id: "Pendapat soal kuliah berbeda: ada yang suka, ada yang merasa terlalu banyak latar sejarah dan pengarang serta kurang membantu penilaian."
      hi: "लेक्चर पर राय अलग है: कुछ को बहुत पसंद आए, कुछ को इतिहास और लेखक की पृष्ठभूमि से भरे और आकलन में कम मददगार लगे।"
    - en: "All these reviews are from 2021 or earlier; teaching and exams may have changed since."
      zh: "这些评价都是 2021 年或更早的，现在的教法和考试可能已经变了。"
      zh-TW: "這些評價都是 2021 年或更早的，現在的教法和考試可能已經變了。"
      ja: "レビューはすべて2021年以前のもの。授業や試験は変わっている可能性がある。"
      ko: "모든 리뷰가 2021년 이전 것이라 지금 수업과 시험은 달라졌을 수 있다."
      vi: "Tất cả đánh giá đều từ năm 2021 trở về trước; cách dạy và thi có thể đã thay đổi."
      ms: "Semua ulasan ini dari 2021 atau lebih awal; pengajaran dan peperiksaan mungkin telah berubah."
      id: "Semua ulasan ini dari 2021 atau sebelumnya; pengajaran dan ujian mungkin sudah berubah."
      hi: "ये सभी रिव्यू 2021 या उससे पहले के हैं; पढ़ाई और परीक्षा अब बदल चुकी हो सकती है।"
workload: heavy
