points:
  - en: "Reviewers liked the text list (modernist novels, plays and poetry) and the tutorial discussions; lectures got mixed comments."
    zh: "评论者喜欢书单（现代主义小说、戏剧和诗歌）和辅导课讨论；讲座评价不一。"
    zh-TW: "評論者喜歡書單（現代主義小說、戲劇和詩歌）和輔導課討論；講課評價不一。"
    ja: "作品リスト（モダニズムの小説、戯曲、詩）とチュートリアルの議論は好評。講義の評価は分かれる。"
    ko: "작품 목록(모더니즘 소설, 희곡, 시)과 튜토리얼 토론은 호평. 강의는 평이 엇갈림."
    vi: "Người đánh giá thích danh sách tác phẩm (tiểu thuyết, kịch và thơ hiện đại chủ nghĩa) và thảo luận tutorial; bài giảng thì ý kiến trái chiều."
    ms: "Pengulas suka senarai teks (novel, drama dan puisi modenis) dan perbincangan tutorial; kuliah mendapat ulasan bercampur."
    id: "Pengulas suka daftar teksnya (novel, drama, dan puisi modernis) dan diskusi tutorial; kuliahnya mendapat tanggapan beragam."
    hi: "रिव्यूअर्स को टेक्स्ट लिस्ट (मॉडर्निस्ट उपन्यास, नाटक और कविता) और ट्यूटोरियल चर्चाएँ पसंद आईं; लेक्चर पर राय मिली-जुली रही।"
  - en: "It moves at about a text a week, which some found rushed. You only need to write on a few texts, so understanding key themes matters more than finishing every book."
    zh: "大约每周一本书，有人觉得太赶。只需针对其中几本写作，所以抓住核心主题比读完每本书更重要。"
    zh-TW: "大約每週一本書，有人覺得太趕。只需針對其中幾本寫作，所以抓住核心主題比讀完每本書更重要。"
    ja: "ほぼ週に1作品のペースで、駆け足と感じた人もいる。書くのは数作品だけなので、全部読み切るより主要テーマの理解が大事。"
    ko: "대략 매주 한 작품 속도라 빠르다고 느낀 사람도 있음. 몇 작품에 대해서만 쓰면 되니 다 읽기보다 핵심 주제 파악이 중요."
    vi: "Khoảng một tác phẩm mỗi tuần, vài người thấy vội. Bạn chỉ cần viết về vài tác phẩm, nên nắm chủ đề chính quan trọng hơn đọc hết."
    ms: "Ia bergerak kira-kira satu teks seminggu, yang ada rasa tergesa-gesa. Anda hanya perlu menulis tentang beberapa teks, jadi memahami tema utama lebih penting daripada menghabiskan setiap buku."
    id: "Temponya sekitar satu teks per minggu, yang dirasa terburu-buru oleh sebagian orang. Kamu hanya perlu menulis tentang beberapa teks, jadi memahami tema utama lebih penting daripada menamatkan semua buku."
    hi: "लगभग हर हफ़्ते एक किताब चलती है, जो कुछ को जल्दबाज़ी लगी। लिखना सिर्फ़ कुछ किताबों पर है, इसलिए हर किताब पूरी करने से ज़्यादा ज़रूरी मुख्य थीम समझना है।"
workload: heavy
