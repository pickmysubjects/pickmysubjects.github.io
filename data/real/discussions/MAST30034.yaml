points:
  - en: "Project-based capstone: individual tasks plus a large group project. Lectures mostly recap earlier machine learning and statistics."
    zh: "以项目为主的毕业课：个人任务加大型小组项目，讲课多为机器学习和统计复习。"
    zh-TW: "以專題為主的總結性課程：個人任務加大型小組專題，講課多為機器學習和統計複習。"
    ja: "プロジェクト型のキャップストーン。個人課題と大規模なグループプロジェクトがある。講義は主に機械学習と統計の復習。"
    ko: "프로젝트 기반 캡스톤으로, 개인 과제와 대형 조별 프로젝트가 있다. 강의는 주로 이전 머신러닝과 통계 복습이다."
    vi: "Môn capstone theo dự án: nhiệm vụ cá nhân cộng một dự án nhóm lớn. Bài giảng chủ yếu ôn lại học máy và thống kê."
    ms: "Capstone berasaskan projek: tugasan individu serta projek kumpulan besar. Kuliah kebanyakannya ulang kaji pembelajaran mesin dan statistik."
    id: "Capstone berbasis proyek: tugas individu plus proyek kelompok besar. Kuliah sebagian besar mengulang machine learning dan statistika."
    hi: "प्रोजेक्ट-आधारित कैपस्टोन: इंडिविजुअल टास्क और एक बड़ा ग्रुप प्रोजेक्ट। लेक्चर ज़्यादातर पहले के मशीन लर्निंग और स्टैटिस्टिक्स का रिकैप।"
  - en: "Choose reliable group mates, because the group project experience depends heavily on your team."
    zh: "务必找靠谱组员，小组项目体验很大程度取决于队友。"
    zh-TW: "務必找可靠的組員，小組專題體驗很大程度取決於隊友。"
    ja: "グループプロジェクトの経験はチーム次第なので、信頼できるメンバーを選ぼう。"
    ko: "조별 프로젝트 경험은 팀에 크게 좌우되니 믿을 만한 팀원을 고르자."
    vi: "Chọn bạn nhóm đáng tin, vì trải nghiệm dự án nhóm phụ thuộc nhiều vào đội."
    ms: "Pilih rakan kumpulan yang boleh diharap, kerana pengalaman projek kumpulan banyak bergantung pada pasukan."
    id: "Pilih teman kelompok yang bisa diandalkan, karena pengalaman proyek kelompok sangat tergantung timmu."
    hi: "भरोसेमंद ग्रुप मेट चुनें, क्योंकि ग्रुप प्रोजेक्ट का अनुभव टीम पर बहुत निर्भर है।"
  - en: "Worth putting in a lot of time, because effort is rewarded and the skills are practical."
    zh: "值得投入大量时间，付出有回报，技能很实用。"
    zh-TW: "值得投入大量時間，付出有回報，技能很實用。"
    ja: "努力が報われ、スキルも実用的なので、たっぷり時間をかける価値がある。"
    ko: "노력한 만큼 보상받고 실용적인 기술이라 시간을 많이 쏟을 가치가 있다."
    vi: "Đáng bỏ nhiều thời gian, vì nỗ lực được đền đáp và kỹ năng thực tế."
    ms: "Berbaloi luangkan banyak masa, kerana usaha dihargai dan kemahirannya praktikal."
    id: "Layak meluangkan banyak waktu, karena usaha dihargai dan skill-nya praktis."
    hi: "काफ़ी समय लगाने लायक, क्योंकि मेहनत का फल मिलता है और स्किल्स प्रैक्टिकल हैं।"
workload: heavy
