points:
  - en: "Your experience depends heavily on the lab and project; choose one that truly interests you and with supportive supervisors."
    zh: "体验很大程度上取决于实验室和项目；要选真正感兴趣且导师支持的项目。"
    zh-TW: "體驗很大程度取決於實驗室和專題；要選真正有興趣、指導老師也支持你的。"
    ja: "経験はラボとプロジェクト次第。本当に興味があり、指導教員が協力的なところを選ぼう。"
    ko: "경험은 연구실과 프로젝트에 크게 좌우된다. 진짜 관심 있고 지도교수가 잘 도와주는 곳을 고르자."
    vi: "Trải nghiệm phụ thuộc nhiều vào lab và dự án; hãy chọn cái bạn thật sự thích và có người hướng dẫn hỗ trợ tốt."
    ms: "Pengalaman anda sangat bergantung pada makmal dan projek; pilih yang benar-benar menarik minat anda dan penyelianya menyokong."
    id: "Pengalamanmu sangat tergantung lab dan proyeknya; pilih yang benar-benar kamu minati dan pembimbingnya suportif."
    hi: "आपका अनुभव काफ़ी हद तक लैब और प्रोजेक्ट पर निर्भर है; ऐसा चुनें जिसमें सच में रुचि हो और सुपरवाइज़र मददगार हों।"
  - en: "Demanding: assessment is mostly at the end (report and presentation), and the report can grow far beyond the word limit."
    zh: "要求很高：考核主要集中在期末（报告和展示），报告实际篇幅可能远超字数限制。"
    zh-TW: "要求高：評量大多集中在期末（報告和簡報），報告實際篇幅可能遠超字數限制。"
    ja: "負担が大きい。評価はほぼ最後に集中（レポートと発表）し、レポートは字数制限を大きく超えがち。"
    ko: "부담이 크다. 평가는 대부분 막바지(보고서와 발표)에 몰려 있고, 보고서는 분량 제한을 훨씬 넘기기 쉽다."
    vi: "Đòi hỏi cao: đánh giá chủ yếu dồn vào cuối kỳ (báo cáo và thuyết trình), và báo cáo có thể dài vượt xa giới hạn số từ."
    ms: "Mencabar: penilaian kebanyakannya di akhir (laporan dan pembentangan), dan laporan boleh jauh melebihi had perkataan."
    id: "Berat: penilaian sebagian besar di akhir (laporan dan presentasi), dan laporan bisa jauh melebihi batas kata."
    hi: "मेहनत वाला: असेसमेंट ज़्यादातर आख़िर में है (रिपोर्ट और प्रेज़ेंटेशन), और रिपोर्ट शब्द-सीमा से बहुत आगे बढ़ सकती है।"
  - en: "Recommended for anyone considering honours or research; it builds lab connections and research skills."
    zh: "推荐给考虑读荣誉学位或从事研究的人；能建立实验室人脉并培养科研能力。"
    zh-TW: "推薦給考慮讀榮譽學位或做研究的人；能建立實驗室人脈並培養研究能力。"
    ja: "Honoursや研究を考えている人におすすめ。ラボとのつながりと研究スキルが身につく。"
    ko: "아너스나 연구를 고민하는 사람에게 추천한다. 연구실 인맥과 연구 역량을 쌓을 수 있다."
    vi: "Nên học nếu bạn tính học honours hoặc làm nghiên cứu; giúp tạo quan hệ với lab và kỹ năng nghiên cứu."
    ms: "Disyorkan untuk sesiapa yang mempertimbangkan honours atau penyelidikan; ia membina hubungan makmal dan kemahiran penyelidikan."
    id: "Direkomendasikan bagi yang mempertimbangkan honours atau riset; membangun koneksi lab dan keterampilan riset."
    hi: "honours या रिसर्च सोचने वालों के लिए सुझाया जाता है; इससे लैब कनेक्शन और रिसर्च स्किल बनती हैं।"
  - en: "One reviewer advised against taking it with a full or heavy load."
    zh: "一位评论者建议不要在满负荷或课程繁重时修读。"
    zh-TW: "一位評論者建議不要在修滿或課業繁重時修。"
    ja: "履修が多い・重い学期には取らないほうがいいという声もあった。"
    ko: "한 리뷰어는 수강 과목이 많거나 버거운 학기에 듣지 말라고 조언했다."
    vi: "Một người khuyên không nên học khi đang học đủ tải hoặc tải nặng."
    ms: "Seorang pengulas menasihatkan supaya tidak mengambilnya dengan beban penuh atau berat."
    id: "Satu pengulas menyarankan jangan ambil saat beban studi penuh atau berat."
    hi: "एक रिव्यूअर ने पूरे या भारी लोड के साथ इसे न लेने की सलाह दी।"
workload: heavy
