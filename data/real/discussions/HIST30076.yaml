points:
  - en: "This is a historiography subject on Stalinism: you study historians' debates, not the events themselves. All reviewers (2020-2026) advise some prior knowledge of the USSR or an earlier history subject."
    zh: "这是关于斯大林主义的史学史课程：学的是历史学家的争论，而非事件本身。所有评论者（2020-2026）都建议先有一些苏联知识或修过相关历史课。"
    zh-TW: "這是關於史達林主義的史學史課程：學的是歷史學家的爭論，而非事件本身。所有評論者（2020-2026）都建議先有一些蘇聯知識或修過相關歷史課。"
    ja: "スターリン主義の史学史の科目で、出来事そのものではなく歴史家の論争を学ぶ。レビュー全員（2020-2026）がソ連の予備知識か先行する歴史科目を勧めている。"
    ko: "스탈린주의에 관한 사학사 과목으로, 사건 자체가 아니라 역사가들의 논쟁을 배움. 리뷰어 모두(2020-2026) 소련에 대한 사전 지식이나 선행 역사 과목을 권함."
    vi: "Đây là môn sử học về chủ nghĩa Stalin: học các tranh luận của sử gia chứ không phải bản thân sự kiện. Mọi người đánh giá (2020-2026) khuyên nên có kiến thức về Liên Xô hoặc đã học một môn sử trước."
    ms: "Ini subjek historiografi tentang Stalinisme: anda mengkaji perdebatan ahli sejarah, bukan peristiwa itu sendiri. Semua pengulas (2020-2026) cadangkan pengetahuan awal tentang USSR atau subjek sejarah terdahulu."
    id: "Ini mata kuliah historiografi tentang Stalinisme: yang dipelajari perdebatan sejarawan, bukan peristiwanya. Semua pengulas (2020-2026) menyarankan pengetahuan awal tentang Uni Soviet atau mata kuliah sejarah sebelumnya."
    hi: "यह स्टालिनवाद पर इतिहास-लेखन (historiography) का विषय है: घटनाएँ नहीं, इतिहासकारों की बहसें पढ़ते हैं। सभी रिव्यूअर्स (2020-2026) सोवियत संघ का कुछ ज्ञान या पहले कोई इतिहास विषय लेने की सलाह देते हैं।"
  - en: "Classes are seminar discussions of shared and group readings, so a 2026 reviewer warned your table group strongly shapes the experience. Overall reviews are very positive."
    zh: "课堂是围绕共同阅读和小组阅读的研讨，所以一位2026年的评论者提醒，同桌小组对体验影响很大。总体评价非常正面。"
    zh-TW: "課堂是圍繞共同閱讀和小組閱讀的研討，所以一位2026年的評論者提醒，同桌小組對體驗影響很大。整體評價非常正面。"
    ja: "授業は共通文献とグループ文献についてのセミナー形式の議論なので、2026年のレビューではテーブルのグループ次第で体験が大きく変わると注意している。全体の評価はとても良い。"
    ko: "수업은 공통·조별 읽기 자료에 대한 세미나 토론이라, 2026년 리뷰어는 테이블 조가 경험을 크게 좌우한다고 경고함. 전반적 평가는 매우 긍정적."
    vi: "Lớp học là thảo luận seminar về bài đọc chung và bài đọc nhóm, nên một người năm 2026 cảnh báo nhóm bàn của bạn ảnh hưởng lớn. Nhìn chung đánh giá rất tích cực."
    ms: "Kelas ialah perbincangan seminar tentang bacaan bersama dan berkumpulan, jadi seorang pengulas 2026 beri amaran kumpulan meja anda sangat mempengaruhi pengalaman. Ulasan keseluruhan sangat positif."
    id: "Kelas berupa diskusi seminar atas bacaan bersama dan kelompok, jadi seorang pengulas 2026 mengingatkan kelompok mejamu sangat memengaruhi pengalaman. Ulasan umumnya sangat positif."
    hi: "क्लास साझा और ग्रुप रीडिंग पर सेमिनार चर्चा हैं, इसलिए 2026 के एक रिव्यूअर ने चेताया कि आपका टेबल ग्रुप अनुभव को बहुत प्रभावित करता है। कुल रिव्यू बहुत सकारात्मक हैं।"
