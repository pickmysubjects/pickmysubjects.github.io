points:
  - en: "The 2022 reviewer praised clear assignment guidance and organisation, but the 2023-2025 reviewers found lectures overloaded and running over time, and tutorials poorly linked to lectures."
    zh: "2022年的评论者称赞作业指引清晰、组织良好，但2023-2025年的评论者觉得讲座内容过多、经常超时，辅导课与讲座脱节。"
    zh-TW: "2022年的評論者稱讚作業指引清晰、組織良好，但2023-2025年的評論者覺得講座內容過多、經常超時，輔導課與講座脫節。"
    ja: "2022年のレビューは課題の説明が明確で運営が良いと評価したが、2023-2025年は講義が詰め込みすぎで時間超過が多く、チュートリアルが講義とつながっていないとされた。"
    ko: "2022년 리뷰는 과제 안내가 명확하고 운영이 좋다고 했지만, 2023-2025년 리뷰는 강의 내용이 과하고 시간을 넘기며 튜토리얼이 강의와 연결되지 않는다고 함."
    vi: "Người đánh giá 2022 khen hướng dẫn bài tập rõ và tổ chức tốt, nhưng người 2023-2025 thấy bài giảng quá tải, hay quá giờ, và tutorial ít liên kết với bài giảng."
    ms: "Pengulas 2022 memuji panduan tugasan yang jelas dan teratur, tetapi pengulas 2023-2025 dapati kuliah terlalu padat, sering lewat masa, dan tutorial kurang berkait dengan kuliah."
    id: "Pengulas 2022 memuji panduan tugas yang jelas dan tertata, tapi pengulas 2023-2025 merasa kuliah terlalu padat, sering lewat waktu, dan tutorial kurang terhubung dengan kuliah."
    hi: "2022 के रिव्यूअर ने असाइनमेंट के साफ़ निर्देश और व्यवस्था की तारीफ़ की, पर 2023-2025 वालों को लेक्चर ठूँसे हुए, समय से ज़्यादा चलने वाले और ट्यूटोरियल लेक्चर से कटे हुए लगे।"
  - en: "Topics were called interesting and the assignments doable, though one felt a 2000-word essay is a lot for level 1. You need to keep up with readings."
    zh: "主题被认为有趣，作业也不难，但有人觉得一年级就写2000字论文太多。需要跟上阅读。"
    zh-TW: "主題被認為有趣，作業也不難，但有人覺得一年級就寫2000字論文太多。需要跟上閱讀。"
    ja: "テーマは面白く課題もこなせるとされたが、1年次で2000語のエッセイは多いという声も。文献を継続的に読む必要がある。"
    ko: "주제가 흥미롭고 과제도 할 만하다는 평이지만, 1학년에 2000단어 에세이는 많다는 의견도. 읽기를 꾸준히 따라가야 함."
    vi: "Chủ đề được cho là thú vị và bài tập làm được, dù có người thấy bài luận 2000 từ là nhiều cho năm nhất. Cần theo kịp bài đọc."
    ms: "Topik dikatakan menarik dan tugasan boleh dibuat, walaupun seorang rasa esei 2000 patah perkataan terlalu banyak untuk tahap 1. Perlu ikut bacaan."
    id: "Topiknya disebut menarik dan tugasnya bisa dikerjakan, meski ada yang merasa esai 2000 kata terlalu banyak untuk level 1. Harus mengikuti bacaan."
    hi: "टॉपिक दिलचस्प और असाइनमेंट करने लायक बताए गए, हालाँकि एक को लेवल 1 के लिए 2000 शब्द का निबंध ज़्यादा लगा। रीडिंग के साथ चलना ज़रूरी है।"
