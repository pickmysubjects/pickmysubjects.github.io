  - en: "Reviewers (2016-2020) describe a theoretical subject with little practical skill, including weeks on journalism and newspapers that some found less interesting."
    zh: "评论者（2016-2020）认为这是一门偏理论、实践技能少的课，其中包括新闻和报纸的几周，有人觉得不太有趣。"
    zh-TW: "評論者（2016-2020）認為這是一門偏理論、實務技能少的課，其中包括新聞和報紙的幾週，有人覺得不太有趣。"
    ja: "レビュー（2016-2020）は理論中心で実践的なスキルは少ない科目とし、ジャーナリズムや新聞を扱う週はあまり面白くないと感じた人もいた。"
    ko: "리뷰(2016-2020)는 이론 중심이고 실용적 기술은 적은 과목이라 하며, 저널리즘·신문을 다루는 주는 덜 흥미로웠다는 사람도 있음."
    vi: "Người đánh giá (2016-2020) mô tả đây là môn lý thuyết, ít kỹ năng thực hành, có vài tuần về báo chí mà một số người thấy kém thú vị."
    ms: "Pengulas (2016-2020) menggambarkan subjek teoretikal dengan sedikit kemahiran praktikal, termasuk minggu tentang kewartawanan dan akhbar yang sesetengah dapati kurang menarik."
    id: "Pengulas (2016-2020) menggambarkan mata kuliah teoretis dengan sedikit keterampilan praktis, termasuk minggu tentang jurnalisme dan koran yang menurut sebagian kurang menarik."
    hi: "रिव्यूअर्स (2016-2020) इसे सैद्धांतिक विषय बताते हैं जिसमें व्यावहारिक कौशल कम है, जिसमें पत्रकारिता और अख़बारों वाले हफ़्ते भी हैं जो कुछ को कम दिलचस्प लगे।"
  - en: "Assessment is a couple of straightforward essays, and it was described as fairly relaxed."
    zh: "考核是几篇简单直接的论文，整体被形容为比较轻松。"
    zh-TW: "考核是幾篇簡單直接的論文，整體被形容為比較輕鬆。"
    ja: "評価は素直なエッセイが2本ほどで、比較的気楽な科目とされた。"
    ko: "평가는 무난한 에세이 두어 편이며, 비교적 여유로운 과목으로 묘사됨."
    vi: "Đánh giá gồm vài bài luận đơn giản, và môn được mô tả là khá nhẹ nhàng."
    ms: "Penilaian ialah beberapa esei mudah, dan ia digambarkan agak santai."
    id: "Penilaian berupa beberapa esai sederhana, dan mata kuliah ini digambarkan cukup santai."
    hi: "असेसमेंट में कुछ सीधे-सादे निबंध हैं, और इसे काफ़ी आरामदायक बताया गया।"
