points:
  - en: "Assessments expect deeper understanding than lectures provide, and marks can swing widely. The exam is tough."
    zh: "考核要求的理解深度超过讲课内容，分数波动大，期末较难。"
    zh-TW: "考核要求的理解深度超過講課內容，分數波動大，期末較難。"
    ja: "評価では講義以上に深い理解が求められ、点数の振れ幅も大きいです。試験は難しいです。"
    ko: "평가는 강의보다 깊은 이해를 요구하고 점수 편차가 큽니다. 시험이 어렵습니다."
    vi: "Bài đánh giá đòi hỏi hiểu sâu hơn những gì bài giảng cung cấp, và điểm có thể dao động lớn. Bài thi khó."
    ms: "Penilaian menjangkakan kefahaman lebih mendalam daripada yang diberi kuliah, dan markah boleh berubah-ubah. Peperiksaan sukar."
    id: "Penilaian menuntut pemahaman lebih dalam dari yang diberikan kuliah, dan nilai bisa naik-turun jauh. Ujiannya sulit."
    hi: "असेसमेंट्स लेक्चर से गहरी समझ की उम्मीद करते हैं, और मार्क्स में काफी उतार-चढ़ाव हो सकता है। एग्ज़ाम कठिन है।"
  - en: "It builds report-writing skills. Follow the rubric and get referencing right, as marks are lost for it."
    zh: "能锻炼报告写作；要紧扣评分标准并规范引用，引用错误会扣分。"
    zh-TW: "能鍛鍊報告寫作；要緊扣評分標準並規範引用，引用錯誤會扣分。"
    ja: "レポートを書く力がつきます。ルーブリックに従い、引用の書き方を正しくしましょう。ミスは減点されます。"
    ko: "보고서 작성 능력을 길러줍니다. 루브릭을 따르고 인용을 정확히 하세요. 틀리면 감점됩니다."
    vi: "Giúp rèn kỹ năng viết báo cáo. Bám rubric và trích dẫn đúng, vì sai sẽ bị trừ điểm."
    ms: "Ia membina kemahiran menulis laporan. Ikut rubrik dan buat rujukan dengan betul, kerana markah ditolak jika salah."
    id: "Melatih keterampilan menulis laporan. Ikuti rubrik dan tulis sitasi dengan benar, karena salah sitasi mengurangi nilai."
    hi: "यह रिपोर्ट लेखन कौशल बढ़ाता है। रूब्रिक फॉलो करें और रेफरेंसिंग सही करें, क्योंकि इसमें मार्क्स कटते हैं।"
  - en: "The coordinators are supportive and the pracs are a highlight in person, but reviewers say the online version was much weaker."
    zh: "课程负责人很支持学生，线下实验课是亮点，但评价称线上版本差很多。"
    zh-TW: "課程負責人很支持學生，實體實驗課是亮點，但評價稱線上版本差很多。"
    ja: "コーディネーターは親身で、対面の実習は目玉ですが、オンライン版はかなり劣っていたというレビューがあります。"
    ko: "코디네이터가 잘 도와주고 대면 실습이 핵심이지만, 온라인 버전은 훨씬 부족했다는 후기가 있습니다."
    vi: "Người phụ trách môn rất hỗ trợ và thực hành trực tiếp là điểm nổi bật, nhưng bản online được cho là kém hơn nhiều."
    ms: "Penyelaras menyokong dan amali bersemuka ialah kemuncak, tetapi pengulas kata versi dalam talian jauh lebih lemah."
    id: "Koordinatornya suportif dan praktikum tatap muka jadi sorotan, tapi pengulas bilang versi online jauh lebih lemah."
    hi: "कोऑर्डिनेटर मददगार हैं और आमने-सामने के प्रैक्टिकल खास हैं, पर रिव्यूअर्स कहते हैं ऑनलाइन वर्ज़न काफी कमज़ोर था।"
sections:
  content:
    - en: "How animals cope with their environments, with engaging lectures and well-liked coordinators. Several found the depth of understanding expected well beyond what is taught."
      zh: "讲动物如何适应环境，讲课吸引人，协调老师很受好评。但好几位觉得要求的理解深度远超课上教的。"
      zh-TW: "講動物如何適應環境，上課吸引人，協調老師很受好評。但好幾位覺得要求的理解深度遠超課堂所教。"
      ja: "動物が環境にどう対処するかを学び、講義は面白くコーディネーターも好評。ただし求められる理解の深さが教わる内容をかなり超えるという声が複数。"
      ko: "동물이 환경에 어떻게 적응하는지 배우며 강의가 흥미롭고 코디네이터도 호평이다. 다만 요구되는 이해 수준이 가르치는 것보다 훨씬 깊다는 의견이 여럿."
      vi: "Về cách động vật thích nghi với môi trường, bài giảng cuốn hút, điều phối viên được quý mến. Vài người thấy mức hiểu biết được yêu cầu vượt xa những gì được dạy."
      ms: "Bagaimana haiwan menghadapi persekitaran, dengan kuliah menarik dan penyelaras yang disenangi. Beberapa rasa tahap kefahaman yang dijangka jauh melebihi apa yang diajar."
      id: "Cara hewan menghadapi lingkungannya, dengan kuliah menarik dan koordinator yang disukai. Beberapa merasa kedalaman pemahaman yang diharapkan jauh melebihi yang diajarkan."
      hi: "जानवर अपने परिवेश से कैसे निपटते हैं, रोचक लेक्चर और पसंद किए गए कोऑर्डिनेटर के साथ। कई को लगा कि अपेक्षित समझ की गहराई पढ़ाए गए से कहीं ज़्यादा है।"
  work:
    - en: "Pracs make up a large share, about 40%, with written prac reports, plus an exam of about 40%. Marks can swing widely and several found the exam tough but testing understanding."
      zh: "实验占很大比重，大约 40%，要写实验报告；期末约 40%。分数波动大，好几位觉得期末难，但考的是理解。"
      zh-TW: "實驗佔很大比重，大約 40%，要寫實驗報告；期末約 40%。分數波動大，好幾位覺得期末難，但考的是理解。"
      ja: "実習が約40%と大きく、実習レポートを書く。期末も約40%。点数の振れ幅が大きく、試験は難しいが理解を問うという声が複数。"
      ko: "실습 비중이 약 40%로 크고 실습 보고서를 쓰며, 기말도 약 40%다. 점수 변동이 크고 시험은 어렵지만 이해를 묻는다는 평이 여럿."
      vi: "Thực hành chiếm phần lớn, khoảng 40%, có viết báo cáo; thi cuối kỳ khoảng 40%. Điểm dao động mạnh, vài người thấy bài thi khó nhưng kiểm tra sự hiểu."
      ms: "Amali membawa bahagian besar, kira-kira 40%, dengan laporan amali bertulis, serta peperiksaan kira-kira 40%. Markah boleh berubah-ubah dan beberapa rasa peperiksaan sukar tetapi menguji kefahaman."
      id: "Praktikum porsinya besar, sekitar 40%, dengan laporan tertulis, plus ujian sekitar 40%. Nilai bisa naik turun jauh dan beberapa merasa ujiannya berat tapi menguji pemahaman."
      hi: "प्रैक का हिस्सा बड़ा है, लगभग 40%, लिखित प्रैक रिपोर्ट के साथ, और परीक्षा लगभग 40%। अंक बहुत ऊपर-नीचे हो सकते हैं और कई को परीक्षा कठिन पर समझ जाँचने वाली लगी।"
  study:
    - en: "Watch every lecture, follow the detailed rubrics closely, take referencing seriously, and learn from feedback on each report; the coordinators reply quickly on the discussion boards."
      zh: "每节课都要看，严格按详细的评分标准写，认真对待引用格式，并从每份报告的反馈里改进；协调老师在讨论区回复很快。"
      zh-TW: "每堂課都要看，嚴格照詳細的評分標準寫，認真看待引用格式，並從每份報告的回饋改進；協調老師在討論區回覆很快。"
      ja: "講義はすべて見て、詳細なルーブリックに従い、参考文献の書き方に気を配り、各レポートのフィードバックから学ぶ。コーディネーターは掲示板ですぐ返信してくれる。"
      ko: "강의는 모두 보고, 자세한 루브릭을 꼼꼼히 따르며, 참고문헌을 신경 쓰고, 보고서마다 피드백에서 배워라. 코디네이터가 게시판에 빨리 답해 준다."
      vi: "Xem hết bài giảng, bám sát rubric chi tiết, chú ý trích dẫn và học từ phản hồi của từng báo cáo; điều phối viên trả lời nhanh trên diễn đàn."
      ms: "Tonton setiap kuliah, ikut rubrik terperinci dengan teliti, ambil serius rujukan, dan belajar daripada maklum balas setiap laporan; penyelaras cepat membalas di papan perbincangan."
      id: "Tonton setiap kuliah, ikuti rubrik rinci dengan cermat, seriusi sitasi, dan belajar dari umpan balik tiap laporan; koordinator cepat membalas di forum diskusi."
      hi: "हर लेक्चर देखें, विस्तृत रूब्रिक ध्यान से मानें, संदर्भ गंभीरता से लें, और हर रिपोर्ट के फ़ीडबैक से सीखें; कोऑर्डिनेटर चर्चा बोर्ड पर जल्दी जवाब देते हैं।"
  watch:
    - en: "Several reviewers say take it only if your course requires it; one suggests ANSC20001 for animal physiology. All reviews are from 2022 or earlier."
      zh: "好几位同学说只有课程要求时再选；有同学建议想学动物生理可以选 ANSC20001。所有评价都是 2022 年或更早的。"
      zh-TW: "好幾位同學說只有課程要求時再選；有同學建議想學動物生理可以修 ANSC20001。所有評價都是 2022 年或更早的。"
      ja: "コースで必須の場合だけ取るべきという声が複数。動物生理学ならANSC20001を勧める声も一つ。レビューはすべて2022年以前のもの。"
      ko: "여러 명이 과정에서 필수일 때만 들으라고 한다. 동물생리학이라면 ANSC20001을 권하는 리뷰어도 있다. 모든 리뷰가 2022년 이전 것이다."
      vi: "Vài người khuyên chỉ học khi ngành bắt buộc; một người gợi ý ANSC20001 nếu muốn học sinh lý động vật. Tất cả đánh giá đều từ 2022 trở về trước."
      ms: "Beberapa pengulas kata ambil hanya jika kursus anda memerlukannya; seorang cadangkan ANSC20001 untuk fisiologi haiwan. Semua ulasan dari 2022 atau lebih awal."
      id: "Beberapa pengulas bilang ambil hanya kalau diwajibkan jurusanmu; satu menyarankan ANSC20001 untuk fisiologi hewan. Semua ulasan dari 2022 atau sebelumnya."
      hi: "कई रिव्यूअर्स कहते हैं इसे तभी लें जब कोर्स में ज़रूरी हो; एक जानवर फ़िज़ियोलॉजी के लिए ANSC20001 सुझाते हैं। सभी रिव्यू 2022 या पहले के हैं।"
difficulty: hard
