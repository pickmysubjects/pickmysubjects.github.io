points:
  - en: "Assessments expect deeper understanding than lectures provide, and marks can swing widely. The exam is tough."
    zh: "考核要求的理解深度超过讲课内容，分数波动大，期末较难。"
    zh-TW: "考核要求的理解深度超過講課內容，分數波動大，期末較難。"
    ja: "評価では講義以上に深い理解が求められ、点数の振れ幅も大きいです。試験は難しいです。"
    ko: "평가는 강의보다 깊은 이해를 요구하고 점수 편차가 큽니다. 시험이 어렵습니다."
    vi: "Bài đánh giá đòi hỏi hiểu sâu hơn những gì bài giảng cung cấp, và điểm có thể dao động lớn. Bài thi khó."
    ms: "Penilaian menjangkakan kefahaman lebih mendalam daripada yang diberi kuliah, dan markah boleh berubah-ubah. Peperiksaan sukar."
    id: "Penilaian menuntut pemahaman lebih dalam dari yang diberikan kuliah, dan nilai bisa naik-turun jauh. Ujiannya sulit."
    hi: "असेसमेंट्स लेक्चर से गहरी समझ की उम्मीद करते हैं, और मार्क्स में काफी उतार-चढ़ाव हो सकता है। एग्ज़ाम कठिन है।"
  - en: "It builds report-writing skills. Follow the rubric and get referencing right, as marks are lost for it."
    zh: "能锻炼报告写作；要紧扣评分标准并规范引用，引用错误会扣分。"
    zh-TW: "能鍛鍊報告寫作；要緊扣評分標準並規範引用，引用錯誤會扣分。"
    ja: "レポートを書く力がつきます。ルーブリックに従い、引用の書き方を正しくしましょう。ミスは減点されます。"
    ko: "보고서 작성 능력을 길러줍니다. 루브릭을 따르고 인용을 정확히 하세요. 틀리면 감점됩니다."
    vi: "Giúp rèn kỹ năng viết báo cáo. Bám rubric và trích dẫn đúng, vì sai sẽ bị trừ điểm."
    ms: "Ia membina kemahiran menulis laporan. Ikut rubrik dan buat rujukan dengan betul, kerana markah ditolak jika salah."
    id: "Melatih keterampilan menulis laporan. Ikuti rubrik dan tulis sitasi dengan benar, karena salah sitasi mengurangi nilai."
    hi: "यह रिपोर्ट लेखन कौशल बढ़ाता है। रूब्रिक फॉलो करें और रेफरेंसिंग सही करें, क्योंकि इसमें मार्क्स कटते हैं।"
  - en: "The coordinators are supportive and the pracs are a highlight in person, but reviewers say the online version was much weaker."
    zh: "课程负责人很支持学生，线下实验课是亮点，但评价称线上版本差很多。"
    zh-TW: "課程負責人很支持學生，實體實驗課是亮點，但評價稱線上版本差很多。"
    ja: "コーディネーターは親身で、対面の実習は目玉ですが、オンライン版はかなり劣っていたというレビューがあります。"
    ko: "코디네이터가 잘 도와주고 대면 실습이 핵심이지만, 온라인 버전은 훨씬 부족했다는 후기가 있습니다."
    vi: "Người phụ trách môn rất hỗ trợ và thực hành trực tiếp là điểm nổi bật, nhưng bản online được cho là kém hơn nhiều."
    ms: "Penyelaras menyokong dan amali bersemuka ialah kemuncak, tetapi pengulas kata versi dalam talian jauh lebih lemah."
    id: "Koordinatornya suportif dan praktikum tatap muka jadi sorotan, tapi pengulas bilang versi online jauh lebih lemah."
    hi: "कोऑर्डिनेटर मददगार हैं और आमने-सामने के प्रैक्टिकल खास हैं, पर रिव्यूअर्स कहते हैं ऑनलाइन वर्ज़न काफी कमज़ोर था।"
difficulty: hard
