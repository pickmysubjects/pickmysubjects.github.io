reviews: 5
from: 2022
to: 2024
checked: 2026-10-14
points:
  - en: "Most reviewers of this compulsory subject were negative: content felt vague, assignment briefs unclear, and the slides didn't match what the assignments asked."
    zh: "这门必修课的评价大多负面：内容空泛，作业说明不清楚，课件和作业要求对不上。"
    zh-TW: "這門必修課的評價大多負面：內容空泛，作業說明不清楚，投影片和作業要求對不上。"
    ja: "この必修科目のレビューは多くが否定的。内容が漠然としていて、課題の説明が不明確、スライドと課題の内容が合っていない。"
    ko: "이 필수 과목의 리뷰는 대부분 부정적이다. 내용이 모호하고 과제 설명이 불명확하며 슬라이드와 과제 요구가 맞지 않았다."
    vi: "Phần lớn đánh giá về môn bắt buộc này là tiêu cực: nội dung mơ hồ, đề bài không rõ, và slide không khớp với yêu cầu bài tập."
    ms: "Kebanyakan pengulas subjek wajib ini negatif: kandungan terasa kabur, taklimat tugasan tidak jelas, dan slaid tidak sepadan dengan tugasan."
    id: "Sebagian besar ulasan mata kuliah wajib ini negatif: materinya terasa kabur, instruksi tugas tidak jelas, dan slide tidak sesuai dengan tugas."
    hi: "इस अनिवार्य विषय के ज़्यादातर रिव्यू नकारात्मक थे: कंटेंट अस्पष्ट लगा, असाइनमेंट के निर्देश साफ़ नहीं थे, और स्लाइड असाइनमेंट से मेल नहीं खाती थीं।"
  - en: "Marking is described as harsh with little feedback, and group work was unpopular, though one reviewer did better than expected and another got a high grade."
    zh: "评分被形容为严苛且反馈很少，小组作业也不受欢迎；不过有人成绩比预期好，也有人拿了高分。"
    zh-TW: "評分被形容為嚴苛且回饋很少，小組作業也不受歡迎；不過有人成績比預期好，也有人拿了高分。"
    ja: "採点は厳しくフィードバックも少ないとされ、グループワークも不評。ただし予想より良い成績だった人や高得点を取った人もいる。"
    ko: "채점이 엄하고 피드백이 거의 없으며 조별 과제도 인기가 없었다. 다만 예상보다 잘 받은 사람도, 높은 점수를 받은 사람도 있다."
    vi: "Chấm điểm được mô tả là khắt khe, ít nhận xét, và làm nhóm không được ưa; tuy vậy một người đạt kết quả tốt hơn mong đợi và người khác được điểm cao."
    ms: "Pemarkahan digambarkan keras dengan sedikit maklum balas, dan kerja kumpulan tidak disukai, walaupun seorang dapat lebih baik daripada jangkaan dan seorang lagi dapat gred tinggi."
    id: "Penilaian disebut keras dengan sedikit umpan balik, dan kerja kelompok tidak disukai, meski satu pengulas dapat hasil lebih baik dari dugaan dan yang lain dapat nilai tinggi."
    hi: "मार्किंग सख़्त और फ़ीडबैक कम बताया गया है, और ग्रुप वर्क पसंद नहीं किया गया; फिर भी एक को उम्मीद से बेहतर और दूसरे को ऊँचा ग्रेड मिला।"
  - en: "Several say the tutorial class shapes most of the experience: a supportive tutor made it worthwhile for one reviewer, so pick your class with care."
    zh: "好几位认为辅导课决定了大部分体验：有位同学遇到很支持学生的辅导老师，觉得收获不少，所以要慎选班级。"
    zh-TW: "好幾位認為輔導課決定了大部分體驗：有位同學遇到很支持學生的助教，覺得收穫不少，所以要慎選班級。"
    ja: "体験の大半はチュートリアルのクラス次第だという声が複数。支えてくれる担当者に当たって有意義だった人もいるので、クラスは慎重に選ぼう。"
    ko: "튜토리얼 반이 경험의 대부분을 좌우한다는 의견이 여럿이다. 잘 도와주는 튜터를 만나 보람 있었다는 사람도 있으니 반을 신중히 고르자."
    vi: "Nhiều người nói lớp tutorial quyết định phần lớn trải nghiệm: một người gặp tutor tận tình nên thấy đáng học, vì vậy hãy chọn lớp cẩn thận."
    ms: "Beberapa orang kata kelas tutorial menentukan sebahagian besar pengalaman: seorang pengulas dapat tutor yang menyokong dan rasa berbaloi, jadi pilih kelas dengan teliti."
    id: "Beberapa orang bilang kelas tutorial menentukan sebagian besar pengalaman: satu pengulas dapat tutor yang suportif dan merasa sepadan, jadi pilih kelas dengan cermat."
    hi: "कई लोग कहते हैं कि ट्यूटोरियल क्लास ही अनुभव तय करती है: एक को मददगार ट्यूटर मिला तो विषय फ़ायदेमंद लगा, इसलिए क्लास सोच-समझकर चुनें।"
sections:
  content:
    - en: "A compulsory first-year Commerce subject on ethics across the commerce disciplines. Most reviewers rated it very poorly, finding it vague, with lectures unrelated to the assignments."
      zh: "商科大一必修课，讲各商科领域中的伦理。多数同学评价很差，觉得内容空泛，讲课和作业也对不上。"
      zh-TW: "商科大一必修課，講各商科領域中的倫理。多數同學評價很差，覺得內容空泛，講課和作業也對不上。"
      ja: "商学部1年の必修科目で、商学の各分野における倫理を扱う。多くが低評価で、内容があいまいで講義が課題と関係ないという。"
      ko: "상경 1학년 필수 과목으로 상경 각 분야의 윤리를 다룬다. 대부분 혹평하며, 내용이 모호하고 강의가 과제와 무관하다고 한다."
      vi: "Môn bắt buộc năm 1 ngành Thương mại về đạo đức trong các lĩnh vực thương mại. Đa số chấm rất thấp, thấy mơ hồ và bài giảng không liên quan bài tập."
      ms: "Subjek wajib Perdagangan tahun 1 tentang etika merentas disiplin perdagangan. Kebanyakan pengulas nilai sangat rendah, rasa kabur dan kuliah tidak berkait dengan tugasan."
      id: "Mata kuliah wajib tahun 1 Bisnis tentang etika di berbagai bidang bisnis. Sebagian besar menilai sangat buruk, merasa samar dan kuliah tak terkait tugas."
      hi: "कॉमर्स का अनिवार्य पहले साल का विषय, कॉमर्स के सभी क्षेत्रों में नैतिकता पर। ज़्यादातर ने इसे बहुत ख़राब बताया, अस्पष्ट और असाइनमेंट से न जुड़े लेक्चर वाला।"
  work:
    - en: "Group and individual assignments with vague instructions, hurdle discussions and marked attendance. Several found the marking harsh with little feedback, though one got an H1 with little effort."
      zh: "有小组和个人作业，要求模糊，还有 hurdle 讨论和出勤分。好几位觉得评分严、反馈少，不过也有人没怎么花力气就拿了 H1。"
      zh-TW: "有小組和個人作業，要求模糊，還有 hurdle 討論和出席分。好幾位覺得評分嚴、回饋少，不過也有人沒怎麼花力氣就拿了 H1。"
      ja: "指示があいまいなグループ・個人課題、ハードルのディスカッション、出席点。採点が厳しくフィードバックが少ないという声が複数だが、楽にH1を取った人も。"
      ko: "지시가 모호한 조별·개인 과제, hurdle 토론, 출석 점수. 채점이 엄격하고 피드백이 적다는 평이 여럿이지만, 별 노력 없이 H1을 받은 사람도 있다."
      vi: "Bài nhóm và cá nhân với hướng dẫn mơ hồ, thảo luận hurdle và điểm chuyên cần. Nhiều người thấy chấm khắt khe, ít phản hồi, dù một người được H1 mà ít cố gắng."
      ms: "Tugasan kumpulan dan individu dengan arahan kabur, perbincangan hurdle dan kehadiran dimarkah. Beberapa rasa pemarkahan ketat dengan sedikit maklum balas, walaupun seorang dapat H1 tanpa banyak usaha."
      id: "Tugas kelompok dan individu dengan instruksi samar, diskusi hurdle dan nilai kehadiran. Beberapa merasa penilaian ketat dengan sedikit umpan balik, meski satu dapat H1 tanpa banyak usaha."
      hi: "अस्पष्ट निर्देशों वाले ग्रुप और व्यक्तिगत असाइनमेंट, हर्डल चर्चाएँ और उपस्थिति के अंक। कई को जाँच सख़्त और फ़ीडबैक कम लगा, हालाँकि एक को कम मेहनत में H1 मिला।"
  watch:
    - en: "Reviewers agree your tutor shapes most of the experience; one suggests trying several tutorials in week one to find a good fit."
      zh: "大家都认为 tutor 决定了大部分体验；有同学建议第一周多试几个 tutorial，找个合适的。"
      zh-TW: "大家都認為 tutor 決定了大部分體驗；有同學建議第一週多試幾個 tutorial，找個合適的。"
      ja: "体験の大半はチューター次第という点で一致。1週目にいくつかのチュートリアルを試して合うものを探すよう勧める人も。"
      ko: "경험의 대부분이 튜터에 달렸다는 데 의견이 일치한다. 첫 주에 여러 튜토리얼을 들어보고 맞는 곳을 찾으라는 리뷰도 있다."
      vi: "Mọi người đồng ý tutor quyết định phần lớn trải nghiệm; một người khuyên tuần đầu thử vài lớp tutorial để chọn lớp hợp."
      ms: "Pengulas sepakat tutor menentukan kebanyakan pengalaman; seorang cadang cuba beberapa tutorial pada minggu pertama untuk cari yang sesuai."
      id: "Pengulas sepakat tutor menentukan sebagian besar pengalaman; satu menyarankan coba beberapa tutorial di minggu pertama untuk menemukan yang cocok."
      hi: "रिव्यूअर्स सहमत हैं कि ज़्यादातर अनुभव ट्यूटर तय करता है; एक सुझाव देता है पहले हफ़्ते कई ट्यूटोरियल आज़माकर सही चुनें।"
