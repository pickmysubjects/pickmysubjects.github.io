points:
  - en: "Most reviewers of this compulsory subject were negative: content felt vague, assignment briefs unclear, and the slides didn't match what the assignments asked."
    zh: "这门必修课的评价大多负面：内容空泛，作业说明不清楚，课件和作业要求对不上。"
    zh-TW: "這門必修課的評價大多負面：內容空泛，作業說明不清楚，投影片和作業要求對不上。"
    ja: "この必修科目のレビューは多くが否定的。内容が漠然としていて、課題の説明が不明確、スライドと課題の内容が合っていない。"
    ko: "이 필수 과목의 리뷰는 대부분 부정적이다. 내용이 모호하고 과제 설명이 불명확하며 슬라이드와 과제 요구가 맞지 않았다."
    vi: "Phần lớn đánh giá về môn bắt buộc này là tiêu cực: nội dung mơ hồ, đề bài không rõ, và slide không khớp với yêu cầu bài tập."
    ms: "Kebanyakan pengulas subjek wajib ini negatif: kandungan terasa kabur, taklimat tugasan tidak jelas, dan slaid tidak sepadan dengan tugasan."
    id: "Sebagian besar ulasan mata kuliah wajib ini negatif: materinya terasa kabur, instruksi tugas tidak jelas, dan slide tidak sesuai dengan tugas."
    hi: "इस अनिवार्य विषय के ज़्यादातर रिव्यू नकारात्मक थे: कंटेंट अस्पष्ट लगा, असाइनमेंट के निर्देश साफ़ नहीं थे, और स्लाइड असाइनमेंट से मेल नहीं खाती थीं।"
  - en: "Marking is described as harsh with little feedback, and group work was unpopular, though one reviewer did better than expected and another got a high grade."
    zh: "评分被形容为严苛且反馈很少，小组作业也不受欢迎；不过有人成绩比预期好，也有人拿了高分。"
    zh-TW: "評分被形容為嚴苛且回饋很少，小組作業也不受歡迎；不過有人成績比預期好，也有人拿了高分。"
    ja: "採点は厳しくフィードバックも少ないとされ、グループワークも不評。ただし予想より良い成績だった人や高得点を取った人もいる。"
    ko: "채점이 엄하고 피드백이 거의 없으며 조별 과제도 인기가 없었다. 다만 예상보다 잘 받은 사람도, 높은 점수를 받은 사람도 있다."
    vi: "Chấm điểm được mô tả là khắt khe, ít nhận xét, và làm nhóm không được ưa; tuy vậy một người đạt kết quả tốt hơn mong đợi và người khác được điểm cao."
    ms: "Pemarkahan digambarkan keras dengan sedikit maklum balas, dan kerja kumpulan tidak disukai, walaupun seorang dapat lebih baik daripada jangkaan dan seorang lagi dapat gred tinggi."
    id: "Penilaian disebut keras dengan sedikit umpan balik, dan kerja kelompok tidak disukai, meski satu pengulas dapat hasil lebih baik dari dugaan dan yang lain dapat nilai tinggi."
    hi: "मार्किंग सख़्त और फ़ीडबैक कम बताया गया है, और ग्रुप वर्क पसंद नहीं किया गया; फिर भी एक को उम्मीद से बेहतर और दूसरे को ऊँचा ग्रेड मिला।"
  - en: "Several say the tutorial class shapes most of the experience: a supportive tutor made it worthwhile for one reviewer, so pick your class with care."
    zh: "好几位认为辅导课决定了大部分体验：有位同学遇到很支持学生的辅导老师，觉得收获不少，所以要慎选班级。"
    zh-TW: "好幾位認為輔導課決定了大部分體驗：有位同學遇到很支持學生的助教，覺得收穫不少，所以要慎選班級。"
    ja: "体験の大半はチュートリアルのクラス次第だという声が複数。支えてくれる担当者に当たって有意義だった人もいるので、クラスは慎重に選ぼう。"
    ko: "튜토리얼 반이 경험의 대부분을 좌우한다는 의견이 여럿이다. 잘 도와주는 튜터를 만나 보람 있었다는 사람도 있으니 반을 신중히 고르자."
    vi: "Nhiều người nói lớp tutorial quyết định phần lớn trải nghiệm: một người gặp tutor tận tình nên thấy đáng học, vì vậy hãy chọn lớp cẩn thận."
    ms: "Beberapa orang kata kelas tutorial menentukan sebahagian besar pengalaman: seorang pengulas dapat tutor yang menyokong dan rasa berbaloi, jadi pilih kelas dengan teliti."
    id: "Beberapa orang bilang kelas tutorial menentukan sebagian besar pengalaman: satu pengulas dapat tutor yang suportif dan merasa sepadan, jadi pilih kelas dengan cermat."
    hi: "कई लोग कहते हैं कि ट्यूटोरियल क्लास ही अनुभव तय करती है: एक को मददगार ट्यूटर मिला तो विषय फ़ायदेमंद लगा, इसलिए क्लास सोच-समझकर चुनें।"
