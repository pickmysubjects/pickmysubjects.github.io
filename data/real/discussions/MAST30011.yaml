points:
  - en: "Split between proofs and algorithms. Proofs are where marks are lost, and the algorithm questions are the more reliable marks on the exam."
    zh: "证明与算法各占一半；丢分主要在证明，算法题较容易拿分。"
  - en: "Expect to memorise a lot of theorems: no formula sheet is given in the exam."
    zh: "需记大量定理，考试不提供公式表。"
  - en: "Opinions on assignments are split. Most found them fair, but the most recent review said they were harder than the exam and harshly marked."
    zh: "作业评价不一：多数觉得公平，最新评价称比考试难且评分严。"
  - en: "Lectures can drag and spend time on proofs that are not assessed. Some board work is not recorded, so going in person helps."
    zh: "讲课有时拖沓，常讲不考的证明；部分板书不录像，最好到场听。"
