reviews: 10
from: 2010
to: 2026
checked: 2026-10-08
points:
  - en: "Split between proofs and algorithms. Proofs are where marks are lost, and the algorithm questions are the more reliable marks on the exam."
    zh: "证明与算法各占一半；丢分主要在证明，算法题较容易拿分。"
    zh-TW: "證明與演算法各占一半；失分主要在證明，演算法題較容易拿分。"
    ja: "証明とアルゴリズムが半々。失点は主に証明で、試験ではアルゴリズム問題の方が確実に点を取れる。"
    ko: "증명과 알고리즘으로 나뉜다. 점수는 주로 증명에서 깎이고, 시험에서는 알고리즘 문제가 더 확실한 점수원이다."
    vi: "Chia giữa chứng minh và thuật toán. Mất điểm chủ yếu ở chứng minh, câu thuật toán là phần dễ ăn điểm hơn."
    ms: "Terbahagi antara bukti dan algoritma. Markah hilang pada bukti, dan soalan algoritma lebih pasti markahnya dalam peperiksaan."
    id: "Terbagi antara pembuktian dan algoritma. Nilai hilang di pembuktian, soal algoritma lebih pasti dapat nilai saat ujian."
    hi: "प्रूफ़ और एल्गोरिदम में बँटा। मार्क्स प्रूफ़ में कटते हैं, एग्ज़ाम में एल्गोरिदम वाले सवाल ज़्यादा भरोसेमंद मार्क्स देते हैं।"
  - en: "Expect to memorise a lot of theorems: no formula sheet is given in the exam."
    zh: "需记大量定理，考试不提供公式表。"
    zh-TW: "需背大量定理，考試不提供公式表。"
    ja: "多くの定理を暗記する必要あり。試験で公式集は配られない。"
    ko: "많은 정리를 외워야 한다. 시험에 공식표가 제공되지 않는다."
    vi: "Phải học thuộc nhiều định lý: đề thi không kèm bảng công thức."
    ms: "Jangka perlu hafal banyak teorem: tiada helaian formula diberi dalam peperiksaan."
    id: "Siap menghafal banyak teorema: tidak ada lembar rumus saat ujian."
    hi: "बहुत सारे थ्योरम याद करने होंगे: एग्ज़ाम में फ़ॉर्मूला शीट नहीं मिलती।"
  - en: "Opinions on assignments are split. Most found them fair, but the most recent review said they were harder than the exam and harshly marked."
    zh: "作业评价不一：多数觉得公平，最新评价称比考试难且评分严。"
    zh-TW: "作業評價不一：多數覺得公平，最新評價則說比考試難且評分嚴。"
    ja: "課題の評価は分かれる。多くは公平だとしたが、最新のレビューでは試験より難しく採点も厳しいとのこと。"
    ko: "과제에 대한 의견은 갈린다. 대부분 공정하다고 했지만, 최근 후기는 시험보다 어렵고 채점이 가혹했다고 했다."
    vi: "Ý kiến về bài tập trái chiều. Đa số thấy công bằng, nhưng đánh giá mới nhất nói khó hơn bài thi và chấm gắt."
    ms: "Pendapat tentang tugasan berbelah. Kebanyakan rasa adil, tetapi ulasan terbaru kata lebih sukar daripada peperiksaan dan dimarkah dengan keras."
    id: "Pendapat soal tugas terbelah. Kebanyakan menilai adil, tapi ulasan terbaru bilang lebih sulit dari ujian dan dinilai keras."
    hi: "असाइनमेंट पर राय बँटी है। ज़्यादातर को फेयर लगे, पर सबसे नए रिव्यू में एग्ज़ाम से कठिन और सख़्त मार्किंग बताई गई।"
  - en: "Lectures can drag and spend time on proofs that are not assessed. Some board work is not recorded, so going in person helps."
    zh: "讲课有时拖沓，常讲不考的证明；部分板书不录像，最好到场听。"
    zh-TW: "講課有時拖沓，常講不考的證明；部分板書沒錄到，最好到場聽。"
    ja: "講義はだらだらしがちで、評価対象外の証明に時間を使うことも。板書の一部は録画されないので、対面出席が役立つ。"
    ko: "강의가 늘어지고 평가하지 않는 증명에 시간을 쓰기도 한다. 판서 일부는 녹화되지 않으니 직접 출석하면 좋다."
    vi: "Bài giảng có lúc lê thê, dành thời gian cho chứng minh không thi. Một số phần viết bảng không được ghi hình, nên đi học trực tiếp sẽ có ích."
    ms: "Kuliah boleh meleret dan habiskan masa pada bukti yang tidak dinilai. Sebahagian tulisan papan tidak dirakam, jadi hadir sendiri membantu."
    id: "Kuliah bisa bertele-tele dan membahas bukti yang tidak diujikan. Sebagian tulisan papan tidak terekam, jadi hadir langsung membantu."
    hi: "लेक्चर खिंच सकते हैं और ऐसे प्रूफ़ पर समय जाता है जो असेस नहीं होते। बोर्ड का कुछ काम रिकॉर्ड नहीं होता, तो खुद जाना बेहतर है।"
sections:
  content:
    - en: "About half theory and proofs, half algorithms; many found the algorithms the fun, real-world part. It suits people into discrete maths or computer science."
      zh: "大约一半理论和证明，一半算法；很多人觉得算法部分最有趣、贴近实际。适合喜欢离散数学或计算机的人。"
      zh-TW: "大約一半理論和證明，一半演算法；很多人覺得演算法部分最有趣、貼近實際。適合喜歡離散數學或資工的人。"
      ja: "理論と証明が約半分、アルゴリズムが約半分。アルゴリズムが楽しく実用的という声が多い。離散数学や情報科学が好きな人向け。"
      ko: "이론과 증명이 절반, 알고리즘이 절반 정도다. 알고리즘이 재미있고 실용적이라는 사람이 많다. 이산수학이나 컴퓨터과학을 좋아하는 사람에게 맞다."
      vi: "Khoảng nửa lý thuyết và chứng minh, nửa thuật toán; nhiều người thấy phần thuật toán vui và thực tế. Hợp với ai thích toán rời rạc hoặc khoa học máy tính."
      ms: "Kira-kira separuh teori dan bukti, separuh algoritma; ramai dapati algoritma bahagian yang seronok dan praktikal. Sesuai bagi peminat matematik diskret atau sains komputer."
      id: "Sekitar separuh teori dan bukti, separuh algoritma; banyak yang merasa algoritma bagian paling seru dan nyata. Cocok bagi penyuka matematika diskret atau ilmu komputer."
      hi: "लगभग आधा सिद्धांत और प्रमाण, आधा एल्गोरिद्म; कई को एल्गोरिद्म मज़ेदार और व्यावहारिक लगे। डिस्क्रीट गणित या कंप्यूटर साइंस पसंद करने वालों के लिए ठीक।"
    - en: "Several found lectures long or dragging, mostly proofs that aren't assessed; some content is only written on the board."
      zh: "好几位觉得讲座拖沓，大多在讲不考的定理证明；有些内容只写在白板上。"
      zh-TW: "好幾位覺得講座拖沓，大多在講不考的定理證明；有些內容只寫在白板上。"
      ja: "講義は長く間延びし、主に試験に出ない証明の説明だという声が複数。板書だけの内容もある。"
      ko: "강의가 길고 늘어지며 주로 시험에 안 나오는 증명이라는 사람이 여럿이다. 칠판에만 쓰는 내용도 있다."
      vi: "Vài người thấy bài giảng dài, lê thê, chủ yếu chứng minh không thi; có nội dung chỉ viết trên bảng."
      ms: "Beberapa dapati kuliah panjang dan meleret, kebanyakan bukti yang tidak dinilai; sesetengah kandungan hanya ditulis di papan."
      id: "Beberapa merasa kuliah panjang dan bertele-tele, kebanyakan bukti yang tidak diujikan; sebagian materi hanya ditulis di papan."
      hi: "कई को लेक्चर लंबे और खिंचे हुए लगे, ज़्यादातर ऐसे प्रमाण जो परखे नहीं जाते; कुछ कंटेंट सिर्फ़ बोर्ड पर लिखा जाता है।"
  work:
    - en: "The exam is roughly half applying algorithms and half proofs, with no formula sheet. Most found it fair; one recent reviewer found assignments harder than the exam, with harsh marking and vague feedback."
      zh: "期末大约一半是套用算法、一半是证明，没有公式表。多数人觉得公平；有位近期同学觉得作业比期末难，给分严、反馈模糊。"
      zh-TW: "期末大約一半是套用演算法、一半是證明，沒有公式表。多數人覺得公平；有位近期同學覺得作業比期末難，給分嚴、回饋模糊。"
      ja: "期末はアルゴリズムの適用が約半分、証明が約半分で、公式集はない。公平という声が多いが、最近の1人は課題の方が難しく、採点が厳しくフィードバックが曖昧だったという。"
      ko: "기말은 알고리즘 적용 절반, 증명 절반 정도이고 공식표는 없다. 대부분 공정하다고 하지만 최근 한 명은 과제가 기말보다 어렵고 채점이 박하며 피드백이 모호했다고 한다."
      vi: "Bài thi khoảng nửa áp dụng thuật toán, nửa chứng minh, không có bảng công thức. Đa số thấy công bằng; một người gần đây thấy bài tập khó hơn đề thi, chấm chặt, phản hồi mơ hồ."
      ms: "Peperiksaan kira-kira separuh aplikasi algoritma dan separuh bukti, tanpa helaian formula. Kebanyakan rasa adil; seorang pengulas terkini dapati tugasan lebih sukar daripada peperiksaan, dinilai ketat dengan maklum balas kabur."
      id: "Ujian sekitar separuh penerapan algoritma dan separuh bukti, tanpa lembar rumus. Kebanyakan merasa adil; satu pengulas terbaru merasa tugas lebih sulit dari ujian, dinilai ketat dan umpan balik kabur."
      hi: "परीक्षा लगभग आधी एल्गोरिद्म लागू करने और आधी प्रमाणों की है, कोई फ़ॉर्मूला शीट नहीं। ज़्यादातर को उचित लगी; एक हालिया रिव्यूअर को असाइनमेंट परीक्षा से कठिन, सख़्त अंकन और अस्पष्ट फ़ीडबैक वाले लगे।"
  study:
    - en: "Memorise the many theorems you may need, since none are provided; go to tutorials in person, as problem-set answers aren't always posted."
      zh: "要背很多可能用到的定理，考试不提供；tutorial 要亲自去，problem set 答案不一定会放上网。"
      zh-TW: "要背很多可能用到的定理，考試不提供；tutorial 要親自去，problem set 答案不一定會放上網。"
      ja: "必要になりうる多くの定理は配布されないので暗記する。問題セットの解答が常に公開されるわけではないので、チュートリアルには対面で出る。"
      ko: "필요할 수 있는 많은 정리를 외워라. 제공되지 않는다. 문제 세트 답이 항상 올라오지 않으니 튜토리얼에 직접 가라."
      vi: "Học thuộc nhiều định lý có thể cần vì không được cho sẵn; đi tutorial trực tiếp, vì đáp án problem set không phải lúc nào cũng đăng."
      ms: "Hafal banyak teorem yang mungkin diperlukan kerana tiada disediakan; hadir tutorial secara bersemuka kerana jawapan set masalah tidak selalu disiarkan."
      id: "Hafalkan banyak teorema yang mungkin dibutuhkan karena tidak disediakan; datang tutorial langsung, karena jawaban problem set tidak selalu diunggah."
      hi: "कई प्रमेय याद करें जो ज़रूरी हो सकते हैं, क्योंकि दिए नहीं जाते; ट्यूटोरियल में ख़ुद जाएँ, क्योंकि प्रॉब्लम सेट के जवाब हमेशा पोस्ट नहीं होते।"
