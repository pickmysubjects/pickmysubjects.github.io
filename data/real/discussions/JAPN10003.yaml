points:
  - en: "A 2026 reviewer coming from VCE found the amount of instruction in Japanese a big shock at first, and noted that teachers differ in how much English they use."
    zh: "一位2026年从VCE过来的评论者起初对大量日语授课很不适应，并提到不同老师用英语的多少不一样。"
    zh-TW: "一位2026年從VCE過來的評論者起初對大量日語授課很不適應，並提到不同老師用英語的多少不一樣。"
    ja: "VCEから来た2026年のレビュアーは、最初は日本語での指導の多さに大きなショックを受けたとのこと。先生によって英語の使用量が違うとも指摘。"
    ko: "VCE에서 올라온 2026년 리뷰어는 처음엔 일본어 수업 비중에 크게 놀랐고, 선생님마다 영어 사용량이 다르다고 함."
    vi: "Một người năm 2026 từ VCE lên thấy sốc lúc đầu vì học bằng tiếng Nhật quá nhiều, và nhận xét mỗi giáo viên dùng tiếng Anh nhiều ít khác nhau."
    ms: "Seorang pengulas 2026 dari VCE terkejut pada awalnya dengan banyaknya pengajaran dalam Bahasa Jepun, dan menyatakan guru berbeza dalam penggunaan Bahasa Inggeris."
    id: "Pengulas 2026 lulusan VCE awalnya kaget dengan banyaknya pengajaran dalam bahasa Jepang, dan mencatat tiap pengajar beda-beda dalam memakai bahasa Inggris."
    hi: "VCE से आए 2026 के एक रिव्यूअर को शुरुआत में जापानी में इतनी पढ़ाई से झटका लगा, और बताया कि हर टीचर अलग मात्रा में अंग्रेज़ी इस्तेमाल करता है।"
  - en: "There are many assessments; older reviews (2014-2015) found it well taught but the lecture pace slow."
    zh: "考核很多；较早的评价（2014-2015）认为教得不错，但讲座节奏偏慢。"
    zh-TW: "評量很多；較早的評價（2014-2015）認為教得不錯，但講課節奏偏慢。"
    ja: "評価の数が多い。以前のレビュー（2014-2015）では教え方は良いが講義のペースが遅いとのこと。"
    ko: "평가가 많음. 예전 리뷰(2014-2015)는 잘 가르치지만 강의 속도가 느리다고 함."
    vi: "Có nhiều bài đánh giá; các đánh giá cũ (2014-2015) thấy dạy tốt nhưng bài giảng chậm."
    ms: "Terdapat banyak penilaian; ulasan lama (2014-2015) dapati pengajarannya baik tetapi rentak kuliah perlahan."
    id: "Penilaiannya banyak; ulasan lama (2014-2015) merasa pengajarannya baik tapi tempo kuliahnya lambat."
    hi: "आकलन कई हैं; पुराने रिव्यू (2014-2015) के अनुसार पढ़ाई अच्छी थी पर लेक्चर की रफ़्तार धीमी थी।"
