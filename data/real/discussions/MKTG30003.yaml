points:
  - en: "Most reviewers liked it: interesting, practical content and helpful tutorials, though the newest review says the material feels dated."
    zh: "多数评价正面：内容有趣、实用，辅导课有帮助；不过最新一条评价说内容有些过时。"
    zh-TW: "多數評價正面：內容有趣、實用，輔導課有幫助；不過最新一則評價說內容有些過時。"
    ja: "多くは好評で、内容が面白く実践的、チュートリアルも役立つ。ただし最新のレビューは内容が古く感じると言う。"
    ko: "대부분 호평이다. 내용이 흥미롭고 실용적이며 튜토리얼이 도움이 된다. 다만 최신 리뷰는 내용이 낡았다고 한다."
    vi: "Đa số thích môn này: nội dung thú vị, thực tế, tutorial hữu ích, dù đánh giá mới nhất cho rằng tài liệu hơi cũ."
    ms: "Kebanyakan pengulas suka: kandungan menarik dan praktikal, tutorial membantu, walaupun ulasan terbaru kata bahannya terasa lapuk."
    id: "Sebagian besar pengulas suka: materi menarik dan praktis, tutorial membantu, meski ulasan terbaru bilang materinya terasa usang."
    hi: "ज़्यादातर रिव्यूअर्स को यह पसंद आया: रोचक, व्यावहारिक सामग्री और मददगार ट्यूटोरियल, हालाँकि सबसे नया रिव्यू कहता है कि सामग्री पुरानी लगती है।"
  - en: "Concepts are not hard and the group assignment is practical and fun, but there is a lot of content, which makes exam study the toughest part."
    zh: "概念不难，小组作业实用又有趣，但内容很多，复习考试是最吃力的部分。"
    zh-TW: "概念不難，小組作業實用又有趣，但內容很多，準備考試是最吃力的部分。"
    ja: "概念は難しくなく、グループ課題は実践的で楽しい。ただ内容が多く、試験勉強が一番大変。"
    ko: "개념은 어렵지 않고 조별 과제는 실용적이고 재미있지만, 내용이 많아 시험 공부가 가장 힘들다."
    vi: "Khái niệm không khó, bài nhóm thực tế và vui, nhưng nội dung nhiều nên ôn thi là phần vất vả nhất."
    ms: "Konsep tidak sukar dan tugasan kumpulan praktikal serta seronok, tetapi kandungan banyak, jadi ulang kaji peperiksaan paling mencabar."
    id: "Konsepnya tidak sulit dan tugas kelompok praktis serta seru, tapi materinya banyak sehingga belajar untuk ujian jadi bagian terberat."
    hi: "कॉन्सेप्ट कठिन नहीं हैं और ग्रुप असाइनमेंट व्यावहारिक व मज़ेदार है, पर सामग्री बहुत है, इसलिए परीक्षा की तैयारी सबसे कठिन हिस्सा है।"
sections:
  content:
    - en: "Reviewers call it fairly easy and interesting, with real-life content and engaging tutorial topics. The newest review (2022) says the content feels stale."
      zh: "同学觉得比较简单、有趣，内容贴近生活，tutorial 话题也吸引人。不过最新一条（2022）说内容有点老。"
      zh-TW: "同學覺得比較簡單、有趣，內容貼近生活，tutorial 主題也吸引人。不過最新一則（2022）說內容有點舊。"
      ja: "比較的簡単で面白く、実生活に結びつく内容で、チュートリアルの話題も魅力的という声。ただ最新（2022年）のレビューは内容が古いと言う。"
      ko: "꽤 쉽고 재미있으며 실생활과 연결된 내용, 흥미로운 튜토리얼 주제라는 평. 다만 최신(2022) 리뷰는 내용이 낡았다고 한다."
      vi: "Người học thấy môn khá dễ và thú vị, nội dung gắn với đời thực, chủ đề tutorial hấp dẫn. Đánh giá mới nhất (2022) nói nội dung hơi cũ."
      ms: "Pengulas kata agak mudah dan menarik, kandungan dekat dengan kehidupan sebenar dan topik tutorial menarik. Ulasan terbaru (2022) kata kandungan terasa lapuk."
      id: "Pengulas bilang cukup mudah dan menarik, materinya dekat dengan kehidupan nyata dan topik tutorial seru. Ulasan terbaru (2022) bilang materinya terasa usang."
      hi: "रिव्यूअर्स इसे काफ़ी आसान और रोचक बताते हैं, असल ज़िंदगी से जुड़ी सामग्री और दिलचस्प ट्यूटोरियल विषय। सबसे नया रिव्यू (2022) कहता है सामग्री पुरानी लगती है।"
  work:
    - en: "The major group assignment is practical and reviewers found the assignments fun. The exam is the hard part, because there is a lot of content to study."
      zh: "大组作业很实用，同学觉得作业挺好玩。难的是期末，因为要复习的内容很多。"
      zh-TW: "大組作業很實用，同學覺得作業蠻好玩。難的是期末，因為要複習的內容很多。"
      ja: "大きなグループ課題は実践的で、課題は楽しいという声。大変なのは期末試験で、勉強する内容が多い。"
      ko: "큰 조별 과제는 실용적이고 과제가 재미있다는 평. 어려운 건 기말로, 공부할 내용이 많다."
      vi: "Bài nhóm lớn rất thực tế và người học thấy bài tập vui. Phần khó là bài thi cuối kỳ vì có nhiều nội dung phải ôn."
      ms: "Tugasan kumpulan utama praktikal dan pengulas rasa tugasan seronok. Bahagian sukar ialah peperiksaan kerana banyak kandungan perlu diulang kaji."
      id: "Tugas kelompok utama praktis dan pengulas merasa tugasnya seru. Bagian sulitnya ujian akhir karena banyak materi yang harus dipelajari."
      hi: "मुख्य ग्रुप असाइनमेंट व्यावहारिक है और रिव्यूअर्स को असाइनमेंट मज़ेदार लगे। कठिन हिस्सा फ़ाइनल परीक्षा है, क्योंकि पढ़ने को बहुत सामग्री है।"
  watch:
    - en: "Most reviews are from 2019 or earlier, with only one from 2022, so the subject may have changed."
      zh: "大部分评价是 2019 年或更早的，只有一条是 2022 年，课程可能已经变了。"
      zh-TW: "大部分評價是 2019 年或更早的，只有一則是 2022 年，課程可能已經變了。"
      ja: "レビューの多くは2019年以前で、2022年のものは1件だけ。内容が変わっている可能性がある。"
      ko: "리뷰 대부분이 2019년 이전이고 2022년 것은 하나뿐이라 과목이 바뀌었을 수 있다."
      vi: "Phần lớn đánh giá từ 2019 trở về trước, chỉ một cái từ 2022, nên môn có thể đã thay đổi."
      ms: "Kebanyakan ulasan dari 2019 atau lebih awal, hanya satu dari 2022, jadi subjek mungkin telah berubah."
      id: "Sebagian besar ulasan dari 2019 atau sebelumnya, hanya satu dari 2022, jadi mata kuliahnya mungkin sudah berubah."
      hi: "ज़्यादातर रिव्यू 2019 या पहले के हैं, सिर्फ़ एक 2022 का है, तो विषय बदल गया हो सकता है।"
