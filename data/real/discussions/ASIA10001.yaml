code: ASIA10001
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/asia10001
reviews: 3
from: 2018
to: 2020
checked: 2026-10-17
points:
  - en: "Lectures were often called long and dry, with a lot of material only loosely tied to the language-and-power theme."
    zh: "讲座常被说冗长枯燥，很多内容和“语言与权力”主题联系不紧。"
    zh-TW: "講課常被說冗長乏味，很多內容和「語言與權力」主題聯繫不緊。"
    ja: "講義は長くて退屈と言われがちで、「言語と権力」というテーマとのつながりが薄い内容も多かった。"
    ko: "강의가 길고 지루하다는 평이 많고, '언어와 권력'이라는 주제와 느슨하게만 연결된 내용이 많았음."
    vi: "Bài giảng thường bị cho là dài và khô, nhiều nội dung chỉ liên quan lỏng lẻo đến chủ đề ngôn ngữ và quyền lực."
    ms: "Kuliah sering dikatakan panjang dan hambar, dengan banyak bahan yang hanya longgar berkait dengan tema bahasa dan kuasa."
    id: "Kuliah sering disebut panjang dan membosankan, dengan banyak materi yang hanya longgar terkait tema bahasa dan kekuasaan."
    hi: "लेक्चर अक्सर लंबे और नीरस बताए गए, और बहुत सी सामग्री 'भाषा और सत्ता' वाली थीम से बस हल्के से जुड़ी थी।"
  - en: "The 2020 reviewers liked the tutorial discussions and the freedom to pick essay questions on topics you are comfortable with; one recommended it as a breadth."
    zh: "2020年的评论者喜欢辅导课讨论，也喜欢可以挑自己擅长的题目写论文；其中一人推荐作为跨学科选修。"
    zh-TW: "2020年的評論者喜歡輔導課討論，也喜歡可以挑自己擅長的題目寫論文；其中一人推薦作為Breadth選修。"
    ja: "2020年のレビューではチュートリアルの議論と、得意なテーマでエッセイの問いを選べる自由が好評で、Breadthとして勧める声もあった。"
    ko: "2020년 리뷰어들은 튜토리얼 토론과 자신 있는 주제로 에세이 문제를 고를 수 있는 점을 좋아했고, 한 명은 Breadth로 추천함."
    vi: "Người đánh giá năm 2020 thích phần thảo luận tutorial và được tự chọn đề luận mình tự tin; một người khuyên học làm Breadth."
    ms: "Pengulas 2020 suka perbincangan tutorial dan kebebasan memilih soalan esei yang anda selesa; seorang mengesyorkannya sebagai Breadth."
    id: "Pengulas 2020 suka diskusi tutorial dan kebebasan memilih soal esai yang kamu kuasai; seorang merekomendasikannya sebagai Breadth."
    hi: "2020 के रिव्यूअर्स को ट्यूटोरियल की चर्चाएँ और अपनी पसंद के विषय पर निबंध प्रश्न चुनने की छूट पसंद आई; एक ने इसे Breadth के रूप में सुझाया।"
