code: ACCT10001
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/acct10001
reviews: 10
from: 2021
to: 2023
checked: 2026-10-08
points:
  - en: "The final exam (about 70% of the grade) was the main pain point in 2021-2022: many said it was much harder than, and unlike, the practice exams."
    zh: "2021-2022年期末考试（约占70%）是主要难点：多人表示比练习卷难得多，题型也不同。"
    zh-TW: "2021-2022年期末考（約佔70%）是主要難點：很多人說比練習卷難得多，題型也不一樣。"
    ja: "2021-2022年は期末試験（成績の約70%）が一番の悩みどころ。練習問題よりずっと難しく、傾向も違ったという声が多かった。"
    ko: "2021-2022년에는 기말시험(성적의 약 70%)이 가장 힘든 부분이었음. 연습 시험보다 훨씬 어렵고 유형도 달랐다는 의견이 많음."
    vi: "Năm 2021-2022, thi cuối kỳ (khoảng 70% điểm) là phần khó nhất: nhiều người nói khó hơn hẳn và khác đề luyện tập."
    ms: "Peperiksaan akhir (kira-kira 70% gred) ialah masalah utama pada 2021-2022: ramai kata jauh lebih sukar dan berbeza daripada peperiksaan latihan."
    id: "Ujian akhir (sekitar 70% nilai) jadi masalah utama di 2021-2022: banyak yang bilang jauh lebih sulit dan beda dari ujian latihan."
    hi: "2021-2022 में फ़ाइनल एग्ज़ाम (लगभग 70% ग्रेड) सबसे बड़ी परेशानी था: कई लोगों ने कहा यह प्रैक्टिस एग्ज़ाम से बहुत कठिन और अलग था।"
  - en: "A 2023 reviewer said exams had become noticeably easier, so older complaints about the exam may no longer apply."
    zh: "一位2023年的评论者表示考试明显变简单了，早年对考试的抱怨可能已不适用。"
    zh-TW: "一位2023年的評論者說考試明顯變簡單了，早年對考試的抱怨可能已不適用。"
    ja: "2023年のレビューでは試験がかなり易しくなったとのことで、以前の試験への不満は当てはまらないかもしれない。"
    ko: "2023년 리뷰어는 시험이 눈에 띄게 쉬워졌다고 해서, 예전 시험 불만은 더 이상 해당되지 않을 수 있음."
    vi: "Một người đánh giá năm 2023 nói đề thi đã dễ hơn rõ rệt, nên những phàn nàn cũ có thể không còn đúng."
    ms: "Seorang pengulas 2023 kata peperiksaan sudah jauh lebih mudah, jadi aduan lama mungkin tidak lagi relevan."
    id: "Seorang pengulas 2023 bilang ujian sudah jauh lebih mudah, jadi keluhan lama mungkin tak berlaku lagi."
    hi: "2023 के एक रिव्यूअर ने कहा कि एग्ज़ाम काफ़ी आसान हो गए हैं, इसलिए पुरानी शिकायतें अब शायद लागू न हों।"
  - en: "Weekly content and assignments were seen as fair. Knowing basic commerce terms helps, especially without high-school accounting."
    zh: "每周内容和作业被认为难度合理。掌握基本商科术语会有帮助，没学过高中会计的尤其如此。"
    zh-TW: "每週內容和作業被認為難度合理。懂基本商科術語會有幫助，高中沒學過會計的尤其如此。"
    ja: "毎週の内容と課題は妥当とされた。基本的なビジネス用語を知っていると役立ち、高校で会計を学んでいない人は特にそう。"
    ko: "매주 내용과 과제는 적절하다는 평. 기본 상경 용어를 알면 도움이 되며, 고등학교 회계를 안 배웠다면 특히 그럼."
    vi: "Nội dung hằng tuần và bài tập được cho là vừa phải. Biết thuật ngữ thương mại cơ bản sẽ giúp ích, nhất là khi chưa học kế toán ở cấp ba."
    ms: "Kandungan dan tugasan mingguan dianggap adil. Tahu istilah asas perdagangan membantu, terutama jika tiada asas perakaunan sekolah menengah."
    id: "Materi dan tugas mingguan dinilai wajar. Paham istilah dasar bisnis membantu, terutama kalau belum belajar akuntansi di SMA."
    hi: "हर हफ़्ते का कंटेंट और असाइनमेंट ठीक माने गए। बेसिक कॉमर्स शब्द जानना मदद करता है, खासकर अगर स्कूल में अकाउंटिंग नहीं पढ़ी।"
  - en: "Opinions on enjoyment are split: some liked it, several disliked it and would not take it as a breadth."
    zh: "对是否喜欢这门课意见分歧：有人喜欢，也有几人不喜欢，不建议作为跨学科选修。"
    zh-TW: "對喜不喜歡這門課意見分歧：有人喜歡，也有幾個人不喜歡，不會把它當Breadth選修。"
    ja: "楽しめたかは意見が分かれる。気に入った人もいるが、嫌いでBreadthとしては取らないという人も何人かいた。"
    ko: "재미에 대한 의견은 엇갈림. 좋아한 사람도 있지만, 여러 명은 싫어했고 Breadth로는 듣지 않겠다고 함."
    vi: "Ý kiến về độ thú vị chia rẽ: có người thích, vài người không thích và sẽ không chọn làm Breadth."
    ms: "Pendapat tentang keseronokan berbelah bahagi: ada yang suka, beberapa tidak suka dan tidak akan ambil sebagai Breadth."
    id: "Pendapat soal seru tidaknya terbelah: ada yang suka, beberapa tidak suka dan tak akan mengambilnya sebagai Breadth."
    hi: "मज़े को लेकर राय बँटी है: कुछ को पसंद आया, कई को नहीं और वे इसे Breadth के रूप में नहीं लेंगे।"
sections:
  content:
    - en: "The concepts are fairly simple, but it helps to learn the commerce terms early; one reviewer with no VCE accounting skimmed the textbook's key terms and did well."
      zh: "概念本身挺简单，但最好早点把商科术语搞懂；有位没学过 VCE 会计的同学靠看课本重点术语也考得不错。"
      zh-TW: "概念本身蠻簡單，但最好早點把商科術語弄懂；有位沒修過 VCE 會計的同學靠看課本重點術語也考得不錯。"
      ja: "概念自体は簡単だが、商学の用語は早めに押さえるとよい。VCE会計未履修でも教科書の重要語を読んで高得点だった人も。"
      ko: "개념은 꽤 쉽지만 상경 용어를 일찍 익히는 게 좋다. VCE 회계 없이 교재 핵심 용어만 훑고 잘 받은 리뷰어도 있다."
      vi: "Khái niệm khá đơn giản, nhưng nên nắm thuật ngữ thương mại sớm; một người chưa học kế toán VCE chỉ đọc lướt thuật ngữ chính trong sách vẫn làm tốt."
      ms: "Konsepnya agak mudah, tetapi belajar istilah perdagangan awal membantu; seorang tanpa perakaunan VCE hanya baca istilah utama buku teks dan berjaya."
      id: "Konsepnya cukup sederhana, tapi pelajari istilah bisnis sejak awal; satu pengulas tanpa akuntansi VCE cuma membaca istilah kunci buku teks dan nilainya bagus."
      hi: "कॉन्सेप्ट काफ़ी सरल हैं, पर कॉमर्स की शब्दावली जल्दी सीख लें; बिना VCE अकाउंटिंग वाले एक रिव्यूअर ने किताब के मुख्य शब्द पढ़कर ही अच्छा किया।"
    - en: "Many reviewers disliked it, often as a core or breadth they didn't choose; one called it not recommended as a breadth despite good organisation."
      zh: "不少同学不喜欢，常常是被迫修的核心课或 breadth；有同学说虽然组织得好，但不推荐当 breadth。"
      zh-TW: "不少同學不喜歡，常常是不得不修的核心課或 breadth；有同學說雖然安排得好，但不推薦當 breadth。"
      ja: "嫌いだという声も多く、必修や自分で選んでいないブレドスとして取った人が多い。運営は良いがブレドスにはおすすめしないという声も。"
      ko: "싫어한 리뷰어가 많고, 대개 어쩔 수 없이 듣는 필수나 브레드스였다. 운영은 좋지만 브레드스로는 비추천이라는 의견도 있다."
      vi: "Nhiều người không thích, thường vì là môn bắt buộc hoặc breadth không tự chọn; một người nói dù tổ chức tốt vẫn không khuyên học làm breadth."
      ms: "Ramai pengulas tidak suka, selalunya sebagai subjek teras atau breadth yang tidak dipilih; seorang kata tidak disyorkan sebagai breadth walaupun teratur."
      id: "Banyak pengulas tidak suka, sering karena mata kuliah wajib atau breadth yang tidak dipilih sendiri; satu bilang tidak disarankan sebagai breadth meski rapi."
      hi: "कई रिव्यूअर्स को यह पसंद नहीं आया, अक्सर मजबूरी का कोर या ब्रेड्थ होने से; एक ने अच्छी व्यवस्था के बावजूद इसे ब्रेड्थ के लिए न लेने की सलाह दी।"
  work:
    - en: "The final exam carries most of the grade. In 2021–22 reviewers found it far harder than the practice exams, with unfamiliar wording; a 2023 reviewer found it easy."
      zh: "期末占成绩大头。2021–22 年的同学觉得比模拟卷难很多，用词陌生；2023 年有同学觉得很简单。"
      zh-TW: "期末佔成績大頭。2021–22 年的同學覺得比模擬考難很多，用詞陌生；2023 年有同學覺得很簡單。"
      ja: "期末が成績の大部分。2021〜22年は模試よりずっと難しく言い回しも見慣れないという声。2023年は簡単だったという声も。"
      ko: "기말이 성적 대부분을 차지한다. 2021–22년엔 모의고사보다 훨씬 어렵고 표현이 낯설었다는 평, 2023년엔 쉬웠다는 평이 있다."
      vi: "Bài thi cuối kỳ chiếm phần lớn điểm. Năm 2021–22 người học thấy khó hơn đề thử nhiều, từ ngữ lạ; một người năm 2023 thấy dễ."
      ms: "Peperiksaan akhir membawa sebahagian besar gred. Pada 2021–22 pengulas rasa jauh lebih sukar daripada kertas latihan dengan istilah asing; seorang pada 2023 rasa mudah."
      id: "Ujian akhir menentukan sebagian besar nilai. Pada 2021–22 pengulas merasa jauh lebih sulit dari ujian latihan dengan istilah asing; satu pengulas 2023 merasa mudah."
      hi: "फ़ाइनल परीक्षा ग्रेड का बड़ा हिस्सा है। 2021–22 में रिव्यूअर्स को यह प्रैक्टिस पेपर से कहीं कठिन और अनजान शब्दों वाली लगी; 2023 के एक रिव्यूअर को आसान लगी।"
  study:
    - en: "Don't rely only on the practice exams given; one reviewer suggests finding harder real past papers to prepare."
      zh: "别只靠发的模拟卷；有同学建议找更难的真题来准备。"
      zh-TW: "別只靠發的模擬考；有同學建議找更難的考古題來準備。"
      ja: "配られる模試だけに頼らないこと。より難しい本物の過去問を探して準備するよう勧める声も一つ。"
      ko: "제공되는 모의고사에만 의존하지 마라. 더 어려운 실제 기출을 찾아 준비하라는 의견도 있다."
      vi: "Đừng chỉ dựa vào đề thử được phát; một người khuyên tìm đề thi thật khó hơn để luyện."
      ms: "Jangan bergantung hanya pada kertas latihan yang diberi; seorang pengulas cadangkan cari kertas sebenar yang lebih sukar."
      id: "Jangan hanya mengandalkan ujian latihan yang diberikan; satu pengulas menyarankan cari soal ujian asli yang lebih sulit."
      hi: "सिर्फ़ दिए गए प्रैक्टिस पेपर पर निर्भर न रहें; एक रिव्यूअर कठिन असली पुराने पेपर ढूँढकर तैयारी की सलाह देते हैं।"
  watch:
    - en: "Most negative reviews are from 2021–22 and are about teaching staff who, per one reviewer, have since left; the only 2023 reviews were more positive."
      zh: "多数差评来自 2021–22 年，针对的是教学人员；有同学说那位老师后来离开了。2023 年的评价更正面。"
      zh-TW: "多數負評來自 2021–22 年，針對的是教學人員；有同學說那位老師後來離開了。2023 年的評價較正面。"
      ja: "否定的なレビューの多くは2021〜22年のもので教員に関するもの。その教員はその後去ったという声も。2023年のレビューはより好意的。"
      ko: "부정적 리뷰 대부분은 2021–22년 것으로 교수진에 관한 것인데, 한 리뷰어에 따르면 그 후 떠났다. 2023년 리뷰는 더 긍정적이다."
      vi: "Phần lớn đánh giá tiêu cực là từ 2021–22 và về đội ngũ giảng dạy mà theo một người đã rời đi; các đánh giá năm 2023 tích cực hơn."
      ms: "Kebanyakan ulasan negatif dari 2021–22 dan tentang staf pengajar yang, menurut seorang pengulas, sudah pergi; ulasan 2023 lebih positif."
      id: "Sebagian besar ulasan negatif dari 2021–22 dan soal staf pengajar yang, menurut satu pengulas, sudah pergi; ulasan 2023 lebih positif."
      hi: "ज़्यादातर नकारात्मक रिव्यू 2021–22 के हैं और शिक्षण स्टाफ़ के बारे में हैं, जो एक रिव्यूअर के अनुसार अब जा चुके हैं; 2023 के रिव्यू ज़्यादा सकारात्मक थे।"
difficulty: easy
