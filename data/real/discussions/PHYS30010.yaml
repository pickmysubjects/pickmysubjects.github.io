reviews: 10
from: 2021
to: 2026
checked: 2026-10-08
points:
  - en: "After the first weeks, each week has a different guest lecturer on narrow topics, so it feels quite unlike second-year physiology."
    zh: "头几周后每周换客座讲师讲很细的专题，与二年级生理课感觉差别很大。"
    zh-TW: "頭幾週後每週換客座講師講很細的專題，與二年級生理課感覺差別很大。"
    ja: "最初の数週を過ぎると、毎週違うゲスト講師が狭いテーマを扱うので、2年次の生理学とはかなり雰囲気が違います。"
    ko: "처음 몇 주 이후에는 매주 다른 초청 강사가 좁은 주제를 다뤄서 2학년 생리학과 꽤 다르게 느껴집니다."
    vi: "Sau vài tuần đầu, mỗi tuần có giảng viên khách mời khác dạy chủ đề hẹp, nên rất khác sinh lý năm 2."
    ms: "Selepas minggu awal, setiap minggu ada pensyarah tetamu berbeza dengan topik sempit, jadi ia terasa sangat berbeza daripada fisiologi tahun dua."
    id: "Setelah minggu awal, tiap minggu ada dosen tamu berbeda dengan topik sempit, jadi terasa sangat beda dari fisiologi tahun kedua."
    hi: "शुरुआती हफ्तों के बाद हर हफ्ते अलग गेस्ट लेक्चरर संकरे टॉपिक्स पढ़ाते हैं, इसलिए यह सेकंड ईयर फिज़ियोलॉजी से काफी अलग लगता है।"
  - en: "The challenge questions carry heavy weight. Many reviewers found the marking vague, inconsistent and short on feedback."
    zh: "挑战题占分高，很多评价认为评分模糊、不一致且反馈很少。"
    zh-TW: "挑戰題占分高，很多評價認為評分模糊、不一致且回饋很少。"
    ja: "チャレンジ問題の配点が大きいです。採点があいまいで一貫性がなく、フィードバックも少ないという声が多くあります。"
    ko: "챌린지 문제 비중이 큽니다. 채점이 모호하고 일관성 없으며 피드백이 부족하다는 후기가 많습니다."
    vi: "Câu hỏi thử thách chiếm tỷ trọng lớn. Nhiều người thấy chấm điểm mơ hồ, không nhất quán và ít phản hồi."
    ms: "Soalan cabaran membawa wajaran besar. Ramai pengulas dapati pemarkahan kabur, tidak konsisten dan kurang maklum balas."
    id: "Soal tantangan bobotnya besar. Banyak pengulas menilai penilaiannya kabur, tidak konsisten, dan minim feedback."
    hi: "चैलेंज सवालों का वेटेज ज़्यादा है। कई रिव्यूअर्स को मार्किंग अस्पष्ट, असंगत और कम फीडबैक वाली लगी।"
  - en: "Studying with a group for the weekly quizzes and challenge questions is strongly recommended and allowed."
    zh: "强烈建议组建学习小组一起做每周测验和挑战题，课程允许合作。"
    zh-TW: "強烈建議組讀書小組一起做每週測驗和挑戰題，課程允許合作。"
    ja: "毎週の小テストとチャレンジ問題はグループで取り組むことが強く勧められており、認められています。"
    ko: "매주 퀴즈와 챌린지 문제를 스터디 그룹으로 함께 푸는 것을 강력히 추천하며, 허용됩니다."
    vi: "Rất nên học nhóm cho quiz hằng tuần và câu hỏi thử thách, và việc này được cho phép."
    ms: "Belajar berkumpulan untuk kuiz mingguan dan soalan cabaran sangat disyorkan dan dibenarkan."
    id: "Belajar kelompok untuk kuis mingguan dan soal tantangan sangat disarankan dan diperbolehkan."
    hi: "वीकली क्विज़ और चैलेंज सवालों के लिए ग्रुप में पढ़ना बहुत सुझाया जाता है और इसकी अनुमति है।"
  - en: "Opinions are split: some loved it and got H1s, but 2025-2026 reviews were mostly negative. Think twice if taking it only as an elective."
    zh: "评价两极：有人很喜欢并拿H1，但2025-2026年评价多为负面；仅作选修需三思。"
    zh-TW: "評價兩極：有人很喜歡並拿H1，但2025-2026年評價多為負面；僅作選修需三思。"
    ja: "意見は分かれ、とても気に入ってH1を取った人もいますが、2025-2026年のレビューは主に否定的です。選択科目として取るだけなら慎重に。"
    ko: "의견이 갈립니다. 아주 좋아하고 H1을 받은 사람도 있지만 2025-2026년 후기는 대부분 부정적입니다. 선택 과목으로만 듣는다면 다시 생각해 보세요."
    vi: "Ý kiến trái chiều: có người rất thích và đạt H1, nhưng đánh giá 2025-2026 phần lớn tiêu cực. Cân nhắc kỹ nếu chỉ học làm môn tự chọn."
    ms: "Pendapat berbelah bahagi: ada yang suka dan dapat H1, tetapi ulasan 2025-2026 kebanyakannya negatif. Fikir semula jika hanya sebagai elektif."
    id: "Pendapat terbelah: ada yang suka dan dapat H1, tapi ulasan 2025-2026 kebanyakan negatif. Pikir lagi kalau hanya sebagai pilihan."
    hi: "राय बँटी है: कुछ को बहुत पसंद आया और H1 मिला, पर 2025-2026 के रिव्यूज़ ज़्यादातर नेगेटिव थे। सिर्फ इलेक्टिव के तौर पर ले रहे हों तो दोबारा सोचें।"
