points:
  - en: "Two reviewers said it was **poorly organised**, with unclear content all semester and little useful feedback from staff."
    zh: "两位评论者说课程**组织混乱**，整个学期内容都不清晰，老师也很少给有用的反馈。"
    zh-TW: "兩位評論者說課程**組織混亂**，整個學期內容都不清楚，老師也很少給有用的回饋。"
    ja: "2人が**運営がずさん**で、学期を通して内容が不明確、教員からの有益なフィードバックも少なかったと言う。"
    ko: "두 명이 **운영이 엉망**이고 학기 내내 내용이 불분명하며 교수진의 유용한 피드백도 거의 없었다고 했다."
    vi: "Hai người nói môn **tổ chức kém**, nội dung không rõ ràng cả kỳ và ít nhận được phản hồi hữu ích từ giảng viên."
    ms: "Dua pengulas kata ia **tidak teratur**, kandungan kabur sepanjang semester dan kurang maklum balas berguna daripada staf."
    id: "Dua pengulas bilang mata kuliah ini **tidak tertata**, materinya tidak jelas sepanjang semester dan minim umpan balik berguna dari staf."
    hi: "दो रिव्यूअर्स ने कहा कि यह **ख़राब तरीक़े से आयोजित** है, पूरे सेमेस्टर कंटेंट अस्पष्ट रहा और स्टाफ़ से काम का फ़ीडबैक कम मिला।"
  - en: "Both of them found the tutorials not useful. One said a lot of reading was posted for self-study and expectations for the final exam were unclear."
    zh: "这两位都觉得辅导课没什么用。其中一位说大量材料都丢给学生自学，期末要求也不明确。"
    zh-TW: "這兩位都覺得 tutorial 沒什麼用。其中一位說大量資料都丟給學生自學，期末要求也不明確。"
    ja: "2人ともチュートリアルは役に立たなかったと言う。大量の資料が自習用に置かれ、期末試験で何が求められるか不明確だったという声もある。"
    ko: "두 명 모두 튜토리얼이 쓸모없었다고 했다. 한 명은 자습용 자료가 잔뜩 올라오고 기말시험 기대치가 불분명했다고 했다."
    vi: "Cả hai đều thấy tutorial không hữu ích. Một người nói rất nhiều tài liệu được đưa lên để tự học và yêu cầu thi cuối kỳ không rõ."
    ms: "Kedua-duanya dapati tutorial tidak berguna. Seorang kata banyak bahan dimuat naik untuk belajar sendiri dan jangkaan peperiksaan akhir tidak jelas."
    id: "Keduanya merasa tutorial tidak berguna. Satu bilang banyak bahan diunggah untuk belajar sendiri dan ekspektasi ujian akhir tidak jelas."
    hi: "दोनों को ट्यूटोरियल बेकार लगे। एक ने कहा कि खुद पढ़ने के लिए ढेर सारा मटीरियल डाला गया और फ़ाइनल परीक्षा की अपेक्षाएँ साफ़ नहीं थीं।"
  - en: "One reviewer warned that **assignment marks vary a lot between tutors**."
    zh: "有一位评论者提醒，**不同辅导老师给作业打分差别很大**。"
    zh-TW: "有一位評論者提醒，**不同助教給作業打分差異很大**。"
    ja: "**チューターによって課題の採点が大きく違う**と1人が注意している。"
    ko: "한 명은 **튜터마다 과제 점수 차이가 크다**고 경고했다."
    vi: "Một người cảnh báo rằng **điểm bài tập chênh lệch nhiều giữa các tutor**."
    ms: "Seorang pengulas memberi amaran bahawa **markah tugasan sangat berbeza antara tutor**."
    id: "Satu pengulas mengingatkan bahwa **nilai tugas sangat berbeda antar tutor**."
    hi: "एक रिव्यूअर ने चेताया कि **अलग-अलग ट्यूटर असाइनमेंट के नंबर बहुत अलग देते हैं**।"
  - en: "All reviews are from 2018 or earlier, so the subject may have changed since."
    zh: "所有评论都在2018年或更早，课程之后可能已有变化。"
    zh-TW: "所有評論都在 2018 年或更早，課程之後可能已有變化。"
    ja: "レビューはすべて2018年以前のもので、その後内容が変わっている可能性がある。"
    ko: "모든 후기가 2018년 이전 것이라 이후 바뀌었을 수 있다."
    vi: "Tất cả đánh giá đều từ năm 2018 trở về trước, nên môn học có thể đã thay đổi."
    ms: "Semua ulasan dari 2018 atau lebih awal, jadi subjek ini mungkin sudah berubah."
    id: "Semua ulasan dari 2018 atau sebelumnya, jadi mata kuliah ini mungkin sudah berubah."
    hi: "सारे रिव्यू 2018 या उससे पहले के हैं, इसलिए विषय अब बदल चुका हो सकता है।"
