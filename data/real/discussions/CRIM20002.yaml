points:
  - en: "Nearly every week and both assignments come back to the public/private space theme. Some found the essay questions thought-provoking, others found it narrow and repetitive."
    zh: "几乎每周和两份作业都围绕公共/私人空间这一主题。有人觉得论文题目发人深省，也有人觉得范围窄、重复。"
    zh-TW: "幾乎每週和兩份作業都圍繞公共/私人空間這一主題。有人覺得論文題目發人深省，也有人覺得範圍窄、重複。"
    ja: "ほぼ毎週と2つの課題がすべて公共/私的空間というテーマに戻る。エッセイ課題が考えさせられるという人もいれば、狭く繰り返しが多いという人も。"
    ko: "거의 매주와 두 과제 모두 공적/사적 공간이라는 주제로 돌아옴. 에세이 질문이 생각할 거리를 준다는 사람도, 좁고 반복적이라는 사람도 있음."
    vi: "Gần như mọi tuần và cả hai bài tập đều xoay quanh chủ đề không gian công cộng/riêng tư. Có người thấy đề luận đáng suy ngẫm, người khác thấy hẹp và lặp lại."
    ms: "Hampir setiap minggu dan kedua-dua tugasan kembali kepada tema ruang awam/peribadi. Ada yang dapati soalan esei merangsang fikiran, ada yang rasa sempit dan berulang."
    id: "Hampir tiap minggu dan kedua tugas kembali ke tema ruang publik/privat. Ada yang merasa soal esainya menggugah, ada yang merasa sempit dan berulang."
    hi: "लगभग हर हफ़्ता और दोनों असाइनमेंट सार्वजनिक/निजी स्थान की थीम पर लौटते हैं। कुछ को निबंध के सवाल सोचने लायक लगे, दूसरों को यह संकीर्ण और दोहराव वाला लगा।"
  - en: "Classes stay fairly surface level, so the readings matter. It overlaps with some first-year law and criminology subjects. A 2020 reviewer found marking harsh."
    zh: "课堂讨论较浅，所以阅读材料很重要。与部分一年级法律和犯罪学课程有重叠。一位2020年的评论者认为评分严格。"
    zh-TW: "課堂討論較淺，所以閱讀材料很重要。與部分一年級法律和犯罪學課程有重疊。一位2020年的評論者認為評分嚴格。"
    ja: "授業は表面的な内容にとどまりがちなので文献が重要。1年次の法学・犯罪学科目と重なる部分がある。2020年のレビューでは採点が厳しいとされた。"
    ko: "수업이 비교적 얕아서 읽기 자료가 중요함. 일부 1학년 법학·범죄학 과목과 겹침. 2020년 리뷰어는 채점이 엄격했다고 함."
    vi: "Lớp học khá hời hợt nên bài đọc rất quan trọng. Có trùng lặp với một số môn luật và tội phạm học năm nhất. Một người đánh giá 2020 thấy chấm điểm khắt khe."
    ms: "Kelas agak cetek, jadi bacaan penting. Ia bertindih dengan beberapa subjek undang-undang dan kriminologi tahun satu. Seorang pengulas 2020 dapati pemarkahan ketat."
    id: "Kelas cenderung dangkal, jadi bacaan penting. Ada tumpang tindih dengan beberapa mata kuliah hukum dan kriminologi tahun pertama. Seorang pengulas 2020 merasa penilaiannya ketat."
    hi: "क्लास काफ़ी सतही रहती हैं, इसलिए रीडिंग अहम हैं। यह पहले साल के कुछ लॉ और क्रिमिनोलॉजी विषयों से मेल खाता है। 2020 के एक रिव्यूअर को मार्किंग सख़्त लगी।"
