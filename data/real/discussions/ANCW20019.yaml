points:
  - en: "All four reviews (2016-2022) praise the teaching: humorous, knowledgeable and linked to modern examples."
    zh: "全部四条评价（2016-2022）都称赞教学：幽默、有学识，还常联系现代例子。"
    zh-TW: "全部四則評價（2016-2022）都稱讚教學：幽默、有學識，還常聯繫現代例子。"
    ja: "4件のレビュー（2016-2022）はすべて授業を高評価。ユーモアがあり知識豊富で、現代の例とも結びつけてくれる。"
    ko: "리뷰 4개(2016-2022) 모두 수업을 칭찬. 유머 있고 박식하며 현대 사례와도 연결해 줌."
    vi: "Cả bốn đánh giá (2016-2022) đều khen cách dạy: hài hước, uyên bác và liên hệ với ví dụ hiện đại."
    ms: "Keempat-empat ulasan (2016-2022) memuji pengajaran: lucu, berpengetahuan dan dikaitkan dengan contoh moden."
    id: "Keempat ulasan (2016-2022) memuji pengajarannya: lucu, berwawasan, dan dikaitkan dengan contoh modern."
    hi: "चारों रिव्यू (2016-2022) पढ़ाने की तारीफ़ करते हैं: मज़ेदार, जानकार और आधुनिक उदाहरणों से जोड़ने वाला।"
  - en: "Classes are seminars that mix a lecture with group discussion. The textbook readings are long but worth it, and assessment is spread across the semester."
    zh: "课程是讲授加小组讨论的研讨课。课本阅读篇幅长但值得读，考核分散在整个学期。"
    zh-TW: "課程是講授加小組討論的研討課。課本閱讀篇幅長但值得讀，評量分散在整個學期。"
    ja: "授業は講義とグループ討論を組み合わせたセミナー形式。教科書の読書は長いが読む価値があり、評価は学期中に分散している。"
    ko: "수업은 강의와 그룹 토론을 섞은 세미나 형식. 교재 읽기는 길지만 읽을 가치가 있고, 평가는 학기 내내 분산됨."
    vi: "Lớp học là seminar kết hợp giảng bài và thảo luận nhóm. Bài đọc trong giáo trình dài nhưng đáng đọc, và đánh giá rải đều cả kỳ."
    ms: "Kelas berbentuk seminar yang menggabungkan kuliah dan perbincangan kumpulan. Bacaan buku teks panjang tetapi berbaloi, dan penilaian diagihkan sepanjang semester."
    id: "Kelasnya seminar yang menggabungkan kuliah dan diskusi kelompok. Bacaan buku teks panjang tapi layak dibaca, dan penilaian tersebar sepanjang semester."
    hi: "क्लास सेमिनार होती हैं जिनमें लेक्चर और ग्रुप चर्चा दोनों होते हैं। टेक्स्टबुक की पढ़ाई लंबी है पर फ़ायदेमंद, और आकलन पूरे सेमेस्टर में बँटा है।"
