code: ANCW30016
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/ancw30016
reviews: 3
from: 2016
to: 2023
checked: 2026-10-17
points:
  - en: "The topics, from the Peloponnesian War to the kingdoms after Alexander, were seen as interesting, with room to follow your own interests."
    zh: "从伯罗奔尼撒战争到亚历山大之后的诸王国，主题被认为很有意思，也有空间按自己的兴趣深入。"
    zh-TW: "從伯羅奔尼撒戰爭到亞歷山大之後的諸王國，主題被認為很有意思，也有空間依自己的興趣深入。"
    ja: "ペロポネソス戦争からアレクサンドロス後の諸王国まで、テーマは面白く、自分の関心に沿って掘り下げる余地もある。"
    ko: "펠로폰네소스 전쟁부터 알렉산드로스 이후 왕국들까지 주제가 흥미롭고, 자기 관심사를 파고들 여지도 있음."
    vi: "Các chủ đề, từ chiến tranh Peloponnese đến các vương quốc sau Alexander, được cho là thú vị, có chỗ để theo sở thích riêng."
    ms: "Topik-topiknya, dari Perang Peloponnesia hingga kerajaan selepas Alexander, dianggap menarik, dengan ruang untuk mengikut minat sendiri."
    id: "Topiknya, dari Perang Peloponnesos sampai kerajaan-kerajaan setelah Aleksander, dianggap menarik, dengan ruang mengikuti minat sendiri."
    hi: "पेलोपोनेशियन युद्ध से लेकर सिकंदर के बाद के राज्यों तक, विषय दिलचस्प माने गए, और अपनी रुचि के हिसाब से गहराई में जाने की गुंजाइश है।"
  - en: "It is research-essay heavy and needs strong essay writing for top marks. The 2016 reviewer found marking harsh and the readings hard to follow."
    zh: "以研究论文为主，想拿高分需要很强的写作能力。2016年的评论者觉得评分严格、阅读材料难以跟上。"
    zh-TW: "以研究論文為主，想拿高分需要很強的寫作能力。2016年的評論者覺得評分嚴格、閱讀材料難以跟上。"
    ja: "リサーチ・エッセイ中心で、高得点には確かな文章力が必要。2016年のレビューでは採点が厳しく、読み物も追いにくかったとのこと。"
    ko: "연구 에세이 중심이라 고득점엔 탄탄한 글쓰기 실력이 필요. 2016년 리뷰어는 채점이 엄격하고 읽기 자료가 따라가기 어려웠다고 함."
    vi: "Nặng về tiểu luận nghiên cứu, cần viết tốt mới đạt điểm cao. Người đánh giá năm 2016 thấy chấm khắt khe và bài đọc khó theo."
    ms: "Banyak esei penyelidikan dan perlu penulisan yang kuat untuk markah tertinggi. Pengulas 2016 dapati pemarkahan ketat dan bacaan sukar diikuti."
    id: "Banyak esai riset dan butuh kemampuan menulis yang kuat untuk nilai tertinggi. Pengulas 2016 merasa penilaian ketat dan bacaannya sulit diikuti."
    hi: "यह रिसर्च निबंधों पर टिका है और टॉप अंकों के लिए मज़बूत लेखन चाहिए। 2016 के रिव्यूअर को मार्किंग सख़्त और रीडिंग्स समझने में मुश्किल लगीं।"
  - en: "In 2023 much of the discussion happened inside the lectures, so students who could not attend because of clashes felt they missed out."
    zh: "2023年很多讨论在讲座中进行，因时间冲突无法到场的学生觉得错过了不少。"
    zh-TW: "2023年很多討論在講課中進行，因時間衝堂無法到場的學生覺得錯過了不少。"
    ja: "2023年は議論の多くが講義中に行われたため、時間割の重複で出られない学生は取り残された感じがした。"
    ko: "2023년엔 토론 상당 부분이 강의 중에 진행돼, 시간이 겹쳐 못 가는 학생들은 많이 놓쳤다고 느낌."
    vi: "Năm 2023, nhiều phần thảo luận diễn ra trong giờ giảng, nên ai bị trùng lịch không dự được thì thấy bị thiệt."
    ms: "Pada 2023 banyak perbincangan berlaku dalam kuliah, jadi pelajar yang tidak dapat hadir kerana pertembungan jadual rasa ketinggalan."
    id: "Di 2023 banyak diskusi terjadi saat kuliah, jadi mahasiswa yang tak bisa hadir karena jadwal bentrok merasa ketinggalan."
    hi: "2023 में ज़्यादातर चर्चा लेक्चर के अंदर होती थी, इसलिए टाइम-क्लैश की वजह से न आ पाने वाले छात्रों को लगा कि वे बहुत कुछ चूक गए।"
