points:
  - en: "Highly praised as one of the best organised and most engaging subjects, with a very supportive coordinator."
    zh: "被高度评价为组织最好、最吸引人的课之一，协调员很支持学生。"
    zh-TW: "被高度評價為組織最好、最吸引人的課之一，課程協調人很支持學生。"
    ja: "最も運営が良く面白い科目の一つと高く評価され、コーディネーターもとても親身。"
    ko: "가장 잘 운영되고 흥미로운 과목 중 하나로 호평받으며, 코디네이터가 매우 잘 도와준다."
    vi: "Được khen là một trong những môn tổ chức tốt và cuốn hút nhất, người điều phối rất hỗ trợ."
    ms: "Sangat dipuji sebagai antara subjek paling teratur dan menarik, dengan penyelaras yang sangat menyokong."
    id: "Sangat dipuji sebagai salah satu mata kuliah paling tertata dan menarik, dengan koordinator yang sangat suportif."
    hi: "सबसे अच्छी तरह ऑर्गनाइज़्ड और दिलचस्प सब्जेक्ट्स में से एक के रूप में खूब तारीफ़, कोऑर्डिनेटर बहुत मददगार।"
  - en: "The open-book quizzes and short group video are easy marks. A H1 is described as very achievable."
    zh: "开卷测验和短视频小组作业容易拿分，H1被认为很有希望。"
    zh-TW: "開書測驗和小組短片容易拿分，H1被認為很有機會。"
    ja: "持ち込み可の小テストと短いグループ動画は点を取りやすい。H1は十分狙えるとされる。"
    ko: "오픈북 퀴즈와 짧은 조별 영상은 점수 따기 쉽다. H1은 충분히 가능하다고 한다."
    vi: "Quiz mở sách và video nhóm ngắn dễ lấy điểm. H1 được cho là hoàn toàn đạt được."
    ms: "Kuiz buku terbuka dan video kumpulan pendek mudah dapat markah. H1 digambarkan sangat boleh dicapai."
    id: "Kuis open-book dan video kelompok singkat mudah dapat nilai. H1 disebut sangat bisa dicapai."
    hi: "ओपन-बुक क्विज़ और छोटा ग्रुप वीडियो आसान मार्क्स हैं। H1 पाना काफ़ी संभव बताया गया।"
  - en: "The final exam is harder: multi-select MCQs and fill-in-the-blanks that test detail, including points only said aloud in lectures."
    zh: "期末较难：多选题和填空考细节，包括讲课中仅口头提到的内容。"
    zh-TW: "期末較難：多選題和填空考細節，包括講課中只口頭提到的內容。"
    ja: "期末試験は難しめ。複数選択式と穴埋めで細部が問われ、講義で口頭のみ触れた点も出る。"
    ko: "기말시험은 더 어렵다. 복수 선택 객관식과 빈칸 채우기로 세부를 묻고, 강의에서 말로만 한 내용도 나온다."
    vi: "Thi cuối kỳ khó hơn: trắc nghiệm nhiều đáp án và điền khuyết hỏi chi tiết, kể cả ý chỉ nói miệng trong bài giảng."
    ms: "Peperiksaan akhir lebih sukar: MCQ pelbagai pilihan dan isi tempat kosong yang menguji butiran, termasuk perkara yang hanya disebut dalam kuliah."
    id: "Ujian akhir lebih sulit: pilihan ganda multi-jawaban dan isian yang menguji detail, termasuk poin yang hanya diucapkan di kuliah."
    hi: "फ़ाइनल एग्ज़ाम कठिन है: मल्टी-सेलेक्ट MCQ और फ़िल-इन-द-ब्लैंक जो डिटेल जाँचते हैं, लेक्चर में सिर्फ़ बोले गए पॉइंट भी।"
  - en: "Attend tutorials, because the applied content covered there is tested."
    zh: "要参加辅导课，课上讲的应用内容会考。"
    zh-TW: "要參加習題課，課上講的應用內容會考。"
    ja: "チュートリアルに出よう。そこで扱う応用的な内容が試験に出る。"
    ko: "튜토리얼에 참석하자. 거기서 다루는 응용 내용이 시험에 나온다."
    vi: "Hãy đi tutorial, vì nội dung ứng dụng ở đó sẽ được thi."
    ms: "Hadiri tutorial, kerana kandungan gunaan di sana diuji."
    id: "Ikuti tutorial, karena materi terapan di sana diujikan."
    hi: "ट्यूटोरियल में जाएँ, क्योंकि वहाँ का अप्लाइड कंटेंट एग्ज़ाम में आता है।"
sections:
  content:
    - en: "The auditory system, hearing pathologies and cochlear implants, plus research lectures. Reviewers loved it, calling it very well organised and clearly explained, and many recommend it among neuro subjects."
      zh: "讲听觉系统、听力疾病和人工耳蜗，还有科研讲座。同学非常喜欢，说组织得很好、讲得清楚，很多人推荐在神经类课程中选它。"
      zh-TW: "講聽覺系統、聽力疾病和人工電子耳，還有研究講座。同學非常喜歡，說安排得很好、講得清楚，很多人推薦在神經類課程中選它。"
      ja: "聴覚系、聴覚の病態、人工内耳と研究紹介の講義。運営がとても良く説明も明快だと大好評で、神経系の科目の中でおすすめという声が多い。"
      ko: "청각계, 청각 질환, 인공와우와 연구 강의를 다룬다. 운영이 매우 좋고 설명이 명확하다며 리뷰어들이 아주 좋아했고, 신경 과목 중 추천한다는 평이 많다."
      vi: "Hệ thính giác, các bệnh về thính lực và ốc tai điện tử, cùng các bài giảng nghiên cứu. Người học rất thích, nói môn tổ chức tốt, giảng rõ, và nhiều người khuyên chọn trong các môn thần kinh."
      ms: "Sistem pendengaran, patologi pendengaran dan implan koklea, serta kuliah penyelidikan. Pengulas sangat suka, katanya sangat teratur dan jelas, dan ramai mengesyorkannya antara subjek neuro."
      id: "Sistem pendengaran, patologi pendengaran dan implan koklea, plus kuliah riset. Pengulas sangat suka, menyebutnya sangat rapi dan jelas, dan banyak yang merekomendasikannya di antara mata kuliah neuro."
      hi: "श्रवण तंत्र, सुनने की बीमारियाँ और कॉक्लियर इम्प्लांट, साथ में रिसर्च लेक्चर। रिव्यूअर्स को बहुत पसंद आया, इसे बहुत व्यवस्थित और साफ़ समझाया हुआ बताया, और कई इसे न्यूरो विषयों में सुझाते हैं।"
  work:
    - en: "Four open-book online multiple-choice tests, an easy group project making a one-minute video, simple lab worksheets, and an exam of multi-select and fill-in-the-blank questions that several found hard."
      zh: "四次开卷线上选择题测验、一个做一分钟视频的简单小组项目、简单的实验练习，以及期末多选和填空题，好几位觉得期末难。"
      zh-TW: "四次開書線上選擇題測驗、一個做一分鐘影片的簡單小組專題、簡單的實驗練習，以及期末多選和填空題，好幾位覺得期末難。"
      ja: "オンラインのオープンブック選択式テスト4回、1分動画を作る簡単なグループ課題、簡単な実習ワークシート、複数選択と穴埋めの期末試験。期末は難しいという声が複数。"
      ko: "오픈북 온라인 객관식 시험 4회, 1분 영상을 만드는 쉬운 조별 과제, 간단한 실습 워크시트, 복수 선택과 빈칸 채우기의 기말이 있다. 기말이 어렵다는 평이 여럿."
      vi: "Bốn bài trắc nghiệm trực tuyến mở tài liệu, project nhóm dễ làm video một phút, phiếu thí nghiệm đơn giản, và bài thi chọn nhiều đáp án và điền khuyết mà vài người thấy khó."
      ms: "Empat ujian aneka pilihan dalam talian buku terbuka, projek kumpulan mudah membuat video seminit, lembaran makmal ringkas, dan peperiksaan pilihan berbilang dan isi tempat kosong yang beberapa rasa sukar."
      id: "Empat tes pilihan ganda daring open book, proyek kelompok mudah membuat video satu menit, lembar kerja lab sederhana, dan ujian pilihan jamak serta isian yang menurut beberapa orang sulit."
      hi: "चार ओपन-बुक ऑनलाइन MCQ टेस्ट, एक मिनट का वीडियो बनाने वाला आसान ग्रुप प्रोजेक्ट, सरल लैब वर्कशीट, और मल्टी-सेलेक्ट व रिक्त स्थान वाली परीक्षा, जो कई को कठिन लगी।"
  study:
    - en: "Attend tutorials, which cover tested application content and pathologies; note details said but not on slides, learn the cochlear implant material closely, and practise reading hearing-test graphs."
      zh: "去上 tutorial，那里讲的应用内容和疾病会考；记下 PPT 上没有但口头讲的细节；人工耳蜗部分要仔细掌握；多练读听力测试图。"
      zh-TW: "去上 tutorial，那裡講的應用內容和疾病會考；記下投影片上沒有但口頭講的細節；人工電子耳部分要仔細掌握；多練讀聽力測驗圖。"
      ja: "チュートリアルに出ること。出題される応用内容や病態を扱う。スライドにない口頭の細部をメモし、人工内耳の内容は細かく覚え、聴力検査のグラフの読み方を練習する。"
      ko: "튜토리얼에 가라. 시험에 나오는 응용 내용과 질환을 다룬다. 슬라이드에 없는 구두 설명을 메모하고, 인공와우 내용을 꼼꼼히 익히며, 청력 검사 그래프 해석을 연습하라."
      vi: "Đi tutorial vì có nội dung vận dụng và bệnh lý được thi; ghi lại chi tiết chỉ nói miệng, học kỹ phần ốc tai điện tử, và luyện đọc biểu đồ kiểm tra thính lực."
      ms: "Hadir tutorial yang merangkumi kandungan aplikasi dan patologi yang diuji; catat butiran yang disebut tetapi tiada pada slaid, pelajari bahan implan koklea dengan teliti, dan latih membaca graf ujian pendengaran."
      id: "Hadiri tutorial yang membahas materi penerapan dan patologi yang diujikan; catat detail yang diucapkan tapi tidak ada di slide, pelajari materi implan koklea dengan teliti, dan latih membaca grafik tes pendengaran."
      hi: "ट्यूटोरियल में जाएँ, जिनमें परीक्षा में आने वाला प्रयोग और बीमारियाँ पढ़ाई जाती हैं; जो बातें बोली गईं पर स्लाइड पर नहीं उन्हें नोट करें, कॉक्लियर इम्प्लांट वाला हिस्सा ध्यान से सीखें, और श्रवण-परीक्षण ग्राफ़ पढ़ने का अभ्यास करें।"
  watch:
    - en: "The final exam can be harder than the practice questions, since multi-select items don't say how many answers are correct, and one reviewer found the cochlear implant lectures dry."
      zh: "期末可能比练习题难，因为多选题不告诉你有几个正确答案；有同学觉得人工耳蜗的讲课比较枯燥。"
      zh-TW: "期末可能比練習題難，因為多選題不告訴你有幾個正確答案；有同學覺得人工電子耳的課比較枯燥。"
      ja: "複数選択問題は正解の数が示されないので、期末は練習問題より難しいことがある。人工内耳の講義は退屈だったという声も一つ。"
      ko: "복수 선택 문제는 정답 개수를 알려 주지 않아 기말이 연습 문제보다 어려울 수 있다. 인공와우 강의가 건조했다는 리뷰어도 있다."
      vi: "Bài thi có thể khó hơn câu luyện tập vì câu chọn nhiều không cho biết có bao nhiêu đáp án đúng, và một người thấy bài giảng về ốc tai điện tử khô."
      ms: "Peperiksaan akhir boleh lebih sukar daripada soalan latihan kerana soalan pilihan berbilang tidak menyatakan berapa jawapan betul, dan seorang pengulas rasa kuliah implan koklea hambar."
      id: "Ujian akhir bisa lebih sulit dari soal latihan karena soal pilihan jamak tidak menyebut berapa jawaban yang benar, dan satu pengulas merasa kuliah implan koklea kering."
      hi: "फ़ाइनल परीक्षा प्रैक्टिस सवालों से कठिन हो सकती है, क्योंकि मल्टी-सेलेक्ट सवाल नहीं बताते कितने उत्तर सही हैं, और एक रिव्यूअर को कॉक्लियर इम्प्लांट वाले लेक्चर नीरस लगे।"
difficulty: mixed
