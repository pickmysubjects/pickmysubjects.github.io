points:
  - en: "Fun and engaging, especially the hands-on pracs looking at rocks under the microscope and the field trip."
    zh: "课程有趣，尤其是用显微镜观察岩石的实验课和野外考察。"
    zh-TW: "有趣又吸引人，尤其是用顯微鏡看岩石的動手實驗和野外考察。"
    ja: "楽しく引き込まれる。特に顕微鏡で岩石を観察する実習とフィールドトリップ。"
    ko: "재미있고 몰입도가 높으며, 특히 현미경으로 암석을 관찰하는 실습과 현장 답사가 좋음."
    vi: "Vui và cuốn hút, nhất là các buổi thực hành xem đá dưới kính hiển vi và chuyến thực địa."
    ms: "Seronok dan menarik, terutama prac amali melihat batuan di bawah mikroskop dan lawatan lapangan."
    id: "Seru dan menarik, terutama prak melihat batuan di bawah mikroskop dan kunjungan lapangan."
    hi: "मज़ेदार और दिलचस्प, ख़ासकर माइक्रोस्कोप से चट्टानें देखने वाले प्रैक्टिकल और फ़ील्ड ट्रिप।"
  - en: "Content is hard and detail-heavy with lots to memorise, and the exam is applied and difficult."
    zh: "内容难且细节多、需大量记忆，考试偏应用且难度高。"
    zh-TW: "內容難、細節多，要背的東西很多，考試偏應用而且難。"
    ja: "内容は難しく細かく暗記も多い。試験は応用的で難しい。"
    ko: "내용이 어렵고 세부 사항이 많아 암기할 게 많으며, 시험은 응용형이고 어려움."
    vi: "Nội dung khó, nhiều chi tiết phải nhớ, và bài thi thiên về vận dụng, khó."
    ms: "Kandungan sukar dan penuh butiran untuk dihafal, dan peperiksaan bersifat aplikasi dan sukar."
    id: "Materi sulit dan penuh detail untuk dihafal, dan ujiannya aplikatif dan sulit."
    hi: "कंटेंट कठिन और बारीकियों से भरा है, बहुत कुछ याद करना पड़ता है, और एग्ज़ाम एप्लाइड व कठिन है।"
  - en: "Best for geology majors; not recommended as a casual elective or breadth subject."
    zh: "最适合地质专业学生，不建议当作轻松选修或跨学科课。"
    zh-TW: "最適合地質系學生；不建議當成輕鬆選修或Breadth科目。"
    ja: "地質学専攻向け。気軽な選択科目やBreadth科目にはおすすめしない。"
    ko: "지질학 전공자에게 가장 적합하며, 가벼운 선택 과목이나 Breadth 과목으로는 비추천."
    vi: "Phù hợp nhất cho sinh viên chuyên ngành địa chất; không nên học như môn tự chọn nhẹ nhàng hay môn Breadth."
    ms: "Terbaik untuk major geologi; tidak disyorkan sebagai elektif santai atau subjek Breadth."
    id: "Paling cocok untuk jurusan geologi; tidak disarankan sebagai pilihan santai atau mata kuliah Breadth."
    hi: "जियोलॉजी मेजर के लिए सबसे अच्छा; हल्के इलेक्टिव या Breadth सब्जेक्ट के तौर पर सिफ़ारिश नहीं।"
workload: heavy
difficulty: hard
