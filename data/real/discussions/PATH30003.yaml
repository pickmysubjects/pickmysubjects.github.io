points:
  - en: "Mostly guest lectures by research experts. Teaching quality varies and it is often unclear what you need to know."
    zh: "多为研究专家客座讲课，质量参差，常不清楚需要掌握什么。"
    zh-TW: "多為研究專家客座講課，品質參差，常不清楚需要掌握什麼。"
    ja: "主に研究者によるゲスト講義です。教え方の質にばらつきがあり、何を覚えればいいか分かりにくいことが多いです。"
    ko: "대부분 연구 전문가의 초청 강의입니다. 강의 질이 들쑥날쑥하고 무엇을 알아야 하는지 불분명할 때가 많습니다."
    vi: "Chủ yếu là bài giảng của chuyên gia nghiên cứu khách mời. Chất lượng không đều và thường không rõ cần nắm gì."
    ms: "Kebanyakannya kuliah tetamu oleh pakar penyelidikan. Kualiti pengajaran berbeza-beza dan selalunya tidak jelas apa yang perlu diketahui."
    id: "Kebanyakan kuliah tamu dari pakar riset. Kualitas pengajaran beragam dan sering tidak jelas apa yang harus dikuasai."
    hi: "ज़्यादातर रिसर्च एक्सपर्ट्स के गेस्ट लेक्चर हैं। पढ़ाने की क्वालिटी अलग-अलग है और अक्सर साफ नहीं होता कि क्या जानना ज़रूरी है।"
  - en: "Two reviewers advise avoiding it unless your major requires it, though one recent reviewer loved it."
    zh: "两位建议非专业必修就别选，但最近有一人很喜欢。"
    zh-TW: "兩位建議非主修必修就別選，但最近有一人很喜歡。"
    ja: "2人のレビューは専攻で必須でなければ避けるよう勧めていますが、最近の1人はとても気に入っていました。"
    ko: "두 명은 전공 필수가 아니면 피하라고 했지만, 최근 한 명은 아주 좋아했습니다."
    vi: "Hai người khuyên nên tránh nếu chuyên ngành không bắt buộc, dù một người gần đây rất thích môn này."
    ms: "Dua pengulas menasihatkan elakkan kecuali major anda memerlukannya, walaupun seorang pengulas terkini sangat menyukainya."
    id: "Dua pengulas menyarankan hindari kecuali wajib untuk jurusanmu, meski satu pengulas terbaru sangat menyukainya."
    hi: "दो रिव्यूअर्स कहते हैं कि मेजर में ज़रूरी न हो तो इसे न लें, हालाँकि एक हालिया रिव्यूअर को यह बहुत पसंद आया।"
