points:
  - en: "Everyone agrees it moves fast: about five class hours a week, and you are soon expected to read and write characters."
    zh: "大家都说进度很快：每周约五小时课，很快就要求会读写汉字。"
    zh-TW: "大家都說進度很快：每週約五小時課，很快就要求會讀寫漢字。"
    ja: "全員が進みが速いと言う。週に約5時間の授業があり、すぐに漢字の読み書きを求められる。"
    ko: "모두 진도가 빠르다고 함. 주당 약 5시간 수업이 있고, 금방 한자를 읽고 쓸 수 있어야 함."
    vi: "Ai cũng nói tiến độ rất nhanh: khoảng năm giờ học mỗi tuần, và sớm phải đọc viết được chữ Hán."
    ms: "Semua bersetuju ia bergerak pantas: kira-kira lima jam kelas seminggu, dan anda cepat dijangka membaca dan menulis aksara."
    id: "Semua sepakat temponya cepat: sekitar lima jam kelas per minggu, dan kamu segera diharapkan bisa membaca dan menulis aksara."
    hi: "सब मानते हैं कि यह तेज़ चलता है: हफ़्ते में लगभग पाँच घंटे की क्लास, और जल्दी ही अक्षर पढ़ने-लिखने की उम्मीद की जाती है।"
  - en: "Not an easy breadth for non-speakers and it takes a lot of study time, but the teachers are energetic and most felt the effort paid off."
    zh: "对零基础的人来说不是轻松的跨学科选修，需要大量学习时间，但老师很有活力，大多数人觉得付出值得。"
    zh-TW: "對零基礎的人來說不是輕鬆的Breadth選修，需要大量讀書時間，但老師很有活力，大多數人覺得付出值得。"
    ja: "中国語を話さない人には楽なBreadthではなく勉強時間もかかるが、先生たちは元気で、努力は報われたという人が多い。"
    ko: "중국어를 못하는 사람에겐 쉬운 Breadth가 아니고 공부 시간도 많이 들지만, 선생님들이 활기차고 대부분 노력한 보람이 있었다고 함."
    vi: "Không phải Breadth dễ với người chưa biết tiếng Trung và tốn nhiều thời gian học, nhưng giáo viên nhiệt huyết và đa số thấy công sức xứng đáng."
    ms: "Bukan Breadth yang mudah bagi bukan penutur dan perlukan banyak masa belajar, tetapi guru-gurunya bertenaga dan kebanyakan rasa usaha itu berbaloi."
    id: "Bukan Breadth yang mudah bagi yang belum bisa bahasa Mandarin dan butuh banyak waktu belajar, tapi pengajarnya energik dan kebanyakan merasa usahanya sepadan."
    hi: "चीनी न बोलने वालों के लिए यह आसान Breadth नहीं है और पढ़ाई में बहुत समय लगता है, पर टीचर्स ऊर्जावान हैं और ज़्यादातर को मेहनत सफल लगी।"
difficulty: hard
workload: heavy
