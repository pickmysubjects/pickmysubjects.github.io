reviews: 4
from: 2020
to: 2025
checked: 2026-10-17
points:
  - en: "A very theoretical, abstract subject on the past and future of media technology, with dense readings. Students who prefer practical media subjects found it hard to grasp."
    zh: "一门非常理论、抽象的课，讲媒体技术的过去与未来，阅读材料艰深。偏好实践型媒体课的学生觉得难以把握。"
    zh-TW: "一門非常理論、抽象的課，講媒體科技的過去與未來，閱讀材料艱深。偏好實務型媒體課的學生覺得難以掌握。"
    ja: "メディア技術の過去と未来を扱う非常に理論的・抽象的な科目で、文献も難解。実践的なメディア科目を好む学生には理解しにくかった。"
    ko: "미디어 기술의 과거와 미래를 다루는 매우 이론적이고 추상적인 과목이며 읽기 자료가 어려움. 실용적 미디어 과목을 선호하는 학생은 이해하기 힘들었다고 함."
    vi: "Môn rất lý thuyết và trừu tượng về quá khứ và tương lai của công nghệ truyền thông, bài đọc khó. Sinh viên thích các môn truyền thông thực hành thấy khó nắm bắt."
    ms: "Subjek yang sangat teoretikal dan abstrak tentang masa lalu dan masa depan teknologi media, dengan bacaan padat. Pelajar yang lebih suka subjek media praktikal dapati sukar difahami."
    id: "Mata kuliah sangat teoretis dan abstrak tentang masa lalu dan masa depan teknologi media, dengan bacaan padat. Mahasiswa yang lebih suka mata kuliah media praktis merasa sulit memahaminya."
    hi: "मीडिया तकनीक के अतीत और भविष्य पर बहुत सैद्धांतिक, अमूर्त विषय, घनी रीडिंग के साथ। व्यावहारिक मीडिया विषय पसंद करने वाले छात्रों को इसे समझना कठिन लगा।"
  - en: "The 2024-2025 reviewers said assignment expectations were not made clear; a 2020 reviewer who liked the topics found it one of their best subjects."
    zh: "2024-2025年的评论者说作业要求没讲清楚；一位喜欢这些主题的2020年评论者则认为这是自己最好的课之一。"
    zh-TW: "2024-2025年的評論者說作業要求沒講清楚；一位喜歡這些主題的2020年評論者則認為這是自己最好的課之一。"
    ja: "2024-2025年のレビューは課題の求めることが明確でなかったとした。テーマが好きだった2020年の1人は最高の科目の一つと評価。"
    ko: "2024-2025년 리뷰는 과제 기대치가 명확하지 않았다고 함. 주제를 좋아했던 2020년 리뷰어는 최고의 과목 중 하나로 꼽음."
    vi: "Người đánh giá 2024-2025 nói yêu cầu bài tập không được làm rõ; một người năm 2020 thích các chủ đề thì coi đây là một trong những môn hay nhất."
    ms: "Pengulas 2024-2025 kata jangkaan tugasan tidak dijelaskan; seorang pengulas 2020 yang suka topiknya anggap ia antara subjek terbaiknya."
    id: "Pengulas 2024-2025 bilang ekspektasi tugas tidak dijelaskan; seorang pengulas 2020 yang menyukai topiknya menganggapnya salah satu mata kuliah terbaik."
    hi: "2024-2025 के रिव्यूअर्स ने कहा कि असाइनमेंट की अपेक्षाएँ साफ़ नहीं बताई गईं; विषय पसंद करने वाले 2020 के एक रिव्यूअर ने इसे अपने सबसे अच्छे विषयों में गिना।"
