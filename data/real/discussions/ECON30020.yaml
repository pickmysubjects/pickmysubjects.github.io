code: ECON30020
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/econ30020
reviews: 3
from: 2015
to: 2019
checked: 2026-10-14
points:
  - en: "Reviewers say it feels more like a maths subject than economics, covering tools used in micro, macro and econometrics, with few economic applications."
    zh: "评价说它更像数学课而不是经济课，涵盖微观、宏观和计量用到的工具，经济应用较少。"
    zh-TW: "評價說它更像數學課而不是經濟課，涵蓋個經、總經和計量用到的工具，經濟應用較少。"
    ja: "経済学というより数学の科目に近く、ミクロ・マクロ・計量経済で使う道具を扱い、経済への応用は少ないという声。"
    ko: "경제학보다 수학 과목에 가깝고, 미시·거시·계량경제학에 쓰이는 도구를 다루며 경제적 응용은 적다고 한다."
    vi: "Người học nói môn giống toán hơn kinh tế, gồm các công cụ dùng trong vi mô, vĩ mô và kinh tế lượng, ít ứng dụng kinh tế."
    ms: "Pengulas kata ia lebih seperti subjek matematik daripada ekonomi, merangkumi alat untuk mikro, makro dan ekonometrik, dengan sedikit aplikasi ekonomi."
    id: "Pengulas bilang ini lebih mirip mata kuliah matematika daripada ekonomi, mencakup alat untuk mikro, makro dan ekonometrika, dengan sedikit aplikasi ekonomi."
    hi: "रिव्यूअर्स कहते हैं कि यह अर्थशास्त्र से ज़्यादा गणित का विषय लगता है, जिसमें माइक्रो, मैक्रो और इकोनोमेट्रिक्स के टूल हैं और आर्थिक उपयोग कम हैं।"
  - en: "All three found it manageable or easy with a solid maths background such as Calculus 2 and Linear Algebra; the Lagrangian is a key idea."
    zh: "三位都认为有扎实数学基础（如 Calculus 2 和线性代数）就不难甚至容易；拉格朗日方法是重点。"
    zh-TW: "三位都認為有紮實數學基礎（如 Calculus 2 和線性代數）就不難甚至容易；拉格朗日方法是重點。"
    ja: "3人とも、微積分2や線形代数など数学の基礎があればこなせる・簡単だとしている。ラグランジュ法が重要。"
    ko: "세 명 모두 미적분2와 선형대수 같은 수학 기초가 있으면 할 만하거나 쉽다고 했다. 라그랑주 방법이 핵심이다."
    vi: "Cả ba thấy dễ hoặc vừa sức nếu có nền toán vững như Calculus 2 và Đại số tuyến tính; phương pháp Lagrange là ý chính."
    ms: "Ketiga-tiganya dapati ia mudah atau boleh diurus dengan asas matematik kukuh seperti Kalkulus 2 dan Aljabar Linear; Lagrangian ialah idea utama."
    id: "Ketiganya merasa mudah atau bisa diatasi dengan dasar matematika kuat seperti Kalkulus 2 dan Aljabar Linear; Lagrangian adalah ide kunci."
    hi: "तीनों को Calculus 2 और लीनियर अलजेब्रा जैसी मज़बूत गणित की नींव के साथ यह आसान या संभालने लायक लगा; लैग्रांजियन मुख्य विचार है।"
  - en: "Tutorials were seen as helpful and assignments resemble tutorial questions; steady practice is the main tip."
    zh: "辅导课被认为很有帮助，作业和辅导课题目相似；主要建议是持续练习。"
    zh-TW: "輔導課被認為很有幫助，作業和輔導課題目相似；主要建議是持續練習。"
    ja: "チュートリアルは役に立ち、課題はチュートリアルの問題に似ている。継続的な演習が一番のコツ。"
    ko: "튜토리얼이 도움이 되고 과제는 튜토리얼 문제와 비슷하다. 꾸준한 연습이 핵심 팁이다."
    vi: "Tutorial được đánh giá hữu ích và bài tập giống câu hỏi tutorial; lời khuyên chính là luyện tập đều đặn."
    ms: "Tutorial dianggap membantu dan tugasan menyerupai soalan tutorial; tip utama ialah latihan berterusan."
    id: "Tutorial dinilai membantu dan tugasnya mirip soal tutorial; tips utamanya latihan rutin."
    hi: "ट्यूटोरियल मददगार माने गए और असाइनमेंट ट्यूटोरियल के सवालों जैसे हैं; मुख्य सुझाव है लगातार अभ्यास।"
difficulty: easy
