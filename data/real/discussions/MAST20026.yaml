points:
  - en: "A big jump from first-year maths: proof-based, epsilon-delta style, with no fixed procedures to follow."
    zh: "与一年级数学相比跨度大：以证明为主、ε-δ风格，没有固定套路。"
    zh-TW: "和一年級數學相比跨度大：以證明為主、ε-δ風格，沒有固定套路。"
    ja: "1年次の数学から大きな飛躍。証明中心のε-δ流で、決まった解法手順がない。"
    ko: "1학년 수학에서 크게 도약한다. 증명 기반의 엡실론-델타 방식이고 정해진 풀이 절차가 없다."
    vi: "Bước nhảy lớn so với toán năm nhất: dựa trên chứng minh, kiểu epsilon-delta, không có quy trình cố định."
    ms: "Lonjakan besar dari matematik tahun pertama: berasaskan bukti, gaya epsilon-delta, tanpa prosedur tetap."
    id: "Lompatan besar dari matematika tahun pertama: berbasis pembuktian, gaya epsilon-delta, tanpa prosedur baku."
    hi: "फ़र्स्ट-ईयर मैथ्स से बड़ी छलांग: प्रूफ़-आधारित, एप्सिलॉन-डेल्टा स्टाइल, कोई तय तरीका नहीं।"
  - en: "Requires substantial time and practice; memorise key proofs and theorems."
    zh: "需要大量时间和练习，要记住关键证明和定理。"
    zh-TW: "需要大量時間和練習，要背熟關鍵證明和定理。"
    ja: "多くの時間と練習が必要。重要な証明と定理は暗記しよう。"
    ko: "상당한 시간과 연습이 필요하다. 핵심 증명과 정리를 외우자."
    vi: "Cần nhiều thời gian và luyện tập; học thuộc các chứng minh và định lý chính."
    ms: "Memerlukan banyak masa dan latihan; hafal bukti dan teorem utama."
    id: "Butuh banyak waktu dan latihan; hafalkan bukti dan teorema penting."
    hi: "काफ़ी समय और प्रैक्टिस चाहिए; मुख्य प्रूफ़ और थ्योरम याद करें।"
  - en: "Experience depends heavily on the lecturer; many years were praised, but one year had very hard assignments."
    zh: "体验很大程度取决于讲师；多数年份口碑好，但有一年作业很难。"
    zh-TW: "體驗很大程度取決於講師；多數年份口碑好，但有一年作業很難。"
    ja: "経験は講師次第。多くの年は好評だったが、課題がとても難しい年もあった。"
    ko: "경험은 강사에 크게 좌우된다. 대부분의 해는 호평이었지만 과제가 매우 어려웠던 해도 있었다."
    vi: "Trải nghiệm phụ thuộc nhiều vào giảng viên; nhiều năm được khen, nhưng có một năm bài tập rất khó."
    ms: "Pengalaman banyak bergantung pada pensyarah; banyak tahun dipuji, tetapi satu tahun tugasannya sangat sukar."
    id: "Pengalaman sangat tergantung dosen; banyak tahun dipuji, tapi satu tahun tugasnya sangat sulit."
    hi: "अनुभव लेक्चरर पर बहुत निर्भर; कई सालों की तारीफ़ हुई, पर एक साल असाइनमेंट बहुत कठिन थे।"
  - en: "Exams can be tough, but assignments were generally well spaced."
    zh: "考试可能较难，但作业安排一般较合理。"
    zh-TW: "考試可能較難，但作業時間安排大致合理。"
    ja: "試験は厳しいこともあるが、課題の間隔はおおむね適切だった。"
    ko: "시험은 어려울 수 있지만 과제 간격은 대체로 적절했다."
    vi: "Đề thi có thể khó, nhưng bài tập thường được giãn cách hợp lý."
    ms: "Peperiksaan boleh sukar, tetapi tugasan umumnya dijarakkan dengan baik."
    id: "Ujian bisa berat, tapi jadwal tugas umumnya berjarak cukup."
    hi: "एग्ज़ाम कठिन हो सकते हैं, पर असाइनमेंट आम तौर पर अच्छे अंतराल पर थे।"
sections:
  content:
    - en: "A first deep, rigorous look at calculus built on proofs, with lots of epsilon-delta arguments. Many find it a big jump from Calculus 2 and Linear Algebra, as there are no standard steps to follow."
      zh: "第一次深入、严谨地看微积分，以证明为主，大量 epsilon-delta 论证。很多人觉得从 Calculus 2 和线性代数过来是个大跳跃，没有固定步骤可套。"
      zh-TW: "第一次深入、嚴謹地看微積分，以證明為主，大量 epsilon-delta 論證。很多人覺得從 Calculus 2 和線性代數過來是個大跳躍，沒有固定步驟可套。"
      ja: "証明を軸に微積分を初めて深く厳密に学ぶ。イプシロン・デルタ論法が多い。決まった手順がなく、Calculus 2や線形代数からの飛躍が大きいという声が多い。"
      ko: "증명 중심으로 미적분을 처음 깊고 엄밀하게 본다. 엡실론-델타 논증이 많다. 정해진 절차가 없어 Calculus 2와 선형대수에서 큰 도약이라는 의견이 많다."
      vi: "Lần đầu nhìn sâu và chặt chẽ vào giải tích dựa trên chứng minh, nhiều lập luận epsilon-delta. Nhiều người thấy là bước nhảy lớn từ Calculus 2 và Đại số tuyến tính vì không có các bước cố định."
      ms: "Pandangan mendalam dan rapi pertama tentang kalkulus berasaskan bukti, dengan banyak hujah epsilon-delta. Ramai dapati ia lonjakan besar dari Calculus 2 dan Linear Algebra kerana tiada langkah standard."
      id: "Pertama kali melihat kalkulus secara mendalam dan ketat berbasis bukti, banyak argumen epsilon-delta. Banyak yang merasa lompatan besar dari Calculus 2 dan Linear Algebra karena tidak ada langkah baku."
      hi: "प्रमाणों पर आधारित कैलकुलस को पहली बार गहराई और कठोरता से देखना, ढेर सारे एप्सिलॉन-डेल्टा तर्क। कई को Calculus 2 और रैखिक बीजगणित से यह बड़ी छलांग लगी, क्योंकि कोई तय क़दम नहीं।"
    - en: "Pure-maths fans tend to love it; one reviewer says it can feel very tedious if you study maths mainly as a tool for science. Experience depends a lot on the lecturer."
      zh: "喜欢纯数学的人往往很爱这门课；有同学说如果只是把数学当理科工具，会觉得非常枯燥。体验很看讲师。"
      zh-TW: "喜歡純數學的人往往很愛這門課；有同學說如果只是把數學當理科工具，會覺得非常枯燥。體驗很看講師。"
      ja: "純粋数学好きには好評。数学を主に理系の道具として学ぶ人にはとても退屈かもという人も。体験は講師次第。"
      ko: "순수수학을 좋아하면 대개 아주 좋아한다. 수학을 과학의 도구로만 공부한다면 매우 지루할 수 있다는 사람도 있다. 강사에 따라 경험이 크게 다르다."
      vi: "Người thích toán thuần túy thường mê môn này; một người nói nếu chỉ học toán như công cụ cho khoa học thì sẽ rất tẻ nhạt. Trải nghiệm phụ thuộc nhiều vào giảng viên."
      ms: "Peminat matematik tulen biasanya suka; seorang kata ia boleh terasa sangat meletihkan jika anda belajar matematik sebagai alat sains. Pengalaman banyak bergantung pada pensyarah."
      id: "Penggemar matematika murni biasanya menyukainya; satu bilang bisa terasa sangat membosankan kalau belajar matematika hanya sebagai alat sains. Pengalaman sangat tergantung dosen."
      hi: "शुद्ध गणित पसंद करने वाले इसे अक्सर बहुत पसंद करते हैं; एक के अनुसार अगर गणित सिर्फ़ विज्ञान का औज़ार है तो यह बहुत नीरस लग सकता है। अनुभव लेक्चरर पर बहुत निर्भर है।"
  work:
    - en: "Assignments are generally seen as fair and well spaced, though one year's were very hard; several found the exam tough."
      zh: "作业大多被认为公平、安排得均匀，但有一年特别难；好几位觉得期末难。"
      zh-TW: "作業大多被認為公平、安排得平均，但有一年特別難；好幾位覺得期末難。"
      ja: "課題はおおむね公平で間隔も適切とされるが、とても難しい年もあった。期末は難しかったという声が複数。"
      ko: "과제는 대체로 공정하고 간격도 적절하다고 하지만 매우 어려웠던 해도 있었다. 기말이 어려웠다는 사람이 여럿이다."
      vi: "Bài tập nhìn chung công bằng và giãn đều, dù có năm rất khó; vài người thấy thi cuối khó."
      ms: "Tugasan umumnya adil dan dijarakkan dengan baik, walaupun satu tahun sangat sukar; beberapa dapati peperiksaan sukar."
      id: "Tugas umumnya dianggap adil dan berjarak baik, meski satu tahun sangat sulit; beberapa merasa ujian akhir berat."
      hi: "असाइनमेंट आम तौर पर उचित और अच्छे अंतराल पर माने गए, हालाँकि एक साल बहुत कठिन थे; कई को परीक्षा कठिन लगी।"
  study:
    - en: "Practise writing proofs yourself, build a visual feel for the definitions, and know the key theorems and proofs; it takes a large chunk of time."
      zh: "多自己动手写证明，对定义建立直观感受，关键定理和证明要掌握；这门课很花时间。"
      zh-TW: "多自己動手寫證明，對定義建立直觀感受，關鍵定理和證明要掌握；這門課很花時間。"
      ja: "自分で証明を書く練習をし、定義を視覚的にイメージできるようにし、主要な定理と証明を押さえる。時間をかなり取られる。"
      ko: "직접 증명을 써 보고, 정의를 시각적으로 감 잡으며, 핵심 정리와 증명을 익혀라. 시간이 많이 든다."
      vi: "Tự luyện viết chứng minh, hình dung trực quan các định nghĩa, và nắm các định lý, chứng minh chính; môn này tốn nhiều thời gian."
      ms: "Latih menulis bukti sendiri, bina gambaran visual definisi, dan kuasai teorem dan bukti utama; ia memerlukan banyak masa."
      id: "Latih menulis bukti sendiri, bangun gambaran visual definisi, dan kuasai teorema serta bukti utama; butuh banyak waktu."
      hi: "ख़ुद प्रमाण लिखने का अभ्यास करें, परिभाषाओं की दृश्य समझ बनाएँ, और मुख्य प्रमेय व प्रमाण जानें; इसमें काफ़ी समय लगता है।"
workload: heavy
difficulty: hard
