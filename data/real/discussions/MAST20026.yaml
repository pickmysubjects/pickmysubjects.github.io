points:
  - en: "A big jump from first-year maths: proof-based, epsilon-delta style, with no fixed procedures to follow."
    zh: "与一年级数学相比跨度大：以证明为主、ε-δ风格，没有固定套路。"
    zh-TW: "和一年級數學相比跨度大：以證明為主、ε-δ風格，沒有固定套路。"
    ja: "1年次の数学から大きな飛躍。証明中心のε-δ流で、決まった解法手順がない。"
    ko: "1학년 수학에서 크게 도약한다. 증명 기반의 엡실론-델타 방식이고 정해진 풀이 절차가 없다."
    vi: "Bước nhảy lớn so với toán năm nhất: dựa trên chứng minh, kiểu epsilon-delta, không có quy trình cố định."
    ms: "Lonjakan besar dari matematik tahun pertama: berasaskan bukti, gaya epsilon-delta, tanpa prosedur tetap."
    id: "Lompatan besar dari matematika tahun pertama: berbasis pembuktian, gaya epsilon-delta, tanpa prosedur baku."
    hi: "फ़र्स्ट-ईयर मैथ्स से बड़ी छलांग: प्रूफ़-आधारित, एप्सिलॉन-डेल्टा स्टाइल, कोई तय तरीका नहीं।"
  - en: "Requires substantial time and practice; memorise key proofs and theorems."
    zh: "需要大量时间和练习，要记住关键证明和定理。"
    zh-TW: "需要大量時間和練習，要背熟關鍵證明和定理。"
    ja: "多くの時間と練習が必要。重要な証明と定理は暗記しよう。"
    ko: "상당한 시간과 연습이 필요하다. 핵심 증명과 정리를 외우자."
    vi: "Cần nhiều thời gian và luyện tập; học thuộc các chứng minh và định lý chính."
    ms: "Memerlukan banyak masa dan latihan; hafal bukti dan teorem utama."
    id: "Butuh banyak waktu dan latihan; hafalkan bukti dan teorema penting."
    hi: "काफ़ी समय और प्रैक्टिस चाहिए; मुख्य प्रूफ़ और थ्योरम याद करें।"
  - en: "Experience depends heavily on the lecturer; many years were praised, but one year had very hard assignments."
    zh: "体验很大程度取决于讲师；多数年份口碑好，但有一年作业很难。"
    zh-TW: "體驗很大程度取決於講師；多數年份口碑好，但有一年作業很難。"
    ja: "経験は講師次第。多くの年は好評だったが、課題がとても難しい年もあった。"
    ko: "경험은 강사에 크게 좌우된다. 대부분의 해는 호평이었지만 과제가 매우 어려웠던 해도 있었다."
    vi: "Trải nghiệm phụ thuộc nhiều vào giảng viên; nhiều năm được khen, nhưng có một năm bài tập rất khó."
    ms: "Pengalaman banyak bergantung pada pensyarah; banyak tahun dipuji, tetapi satu tahun tugasannya sangat sukar."
    id: "Pengalaman sangat tergantung dosen; banyak tahun dipuji, tapi satu tahun tugasnya sangat sulit."
    hi: "अनुभव लेक्चरर पर बहुत निर्भर; कई सालों की तारीफ़ हुई, पर एक साल असाइनमेंट बहुत कठिन थे।"
  - en: "Exams can be tough, but assignments were generally well spaced."
    zh: "考试可能较难，但作业安排一般较合理。"
    zh-TW: "考試可能較難，但作業時間安排大致合理。"
    ja: "試験は厳しいこともあるが、課題の間隔はおおむね適切だった。"
    ko: "시험은 어려울 수 있지만 과제 간격은 대체로 적절했다."
    vi: "Đề thi có thể khó, nhưng bài tập thường được giãn cách hợp lý."
    ms: "Peperiksaan boleh sukar, tetapi tugasan umumnya dijarakkan dengan baik."
    id: "Ujian bisa berat, tapi jadwal tugas umumnya berjarak cukup."
    hi: "एग्ज़ाम कठिन हो सकते हैं, पर असाइनमेंट आम तौर पर अच्छे अंतराल पर थे।"
workload: heavy
difficulty: hard
