points:
  - en: "The 2020-2021 reviewers found the two-hour lectures long and dry and tutorials unproductive, and some preferred SOCI10001 as an intro."
    zh: "2020-2021年的评论者觉得两小时的讲座冗长枯燥，辅导课收获不大，有人更推荐SOCI10001作为入门。"
    zh-TW: "2020-2021年的評論者覺得兩小時的講座冗長枯燥，輔導課收穫不大，有人更推薦SOCI10001作為入門。"
    ja: "2020-2021年のレビューは2時間の講義が長く退屈で、チュートリアルも実りが少ないとし、入門にはSOCI10001の方が良いという人も。"
    ko: "2020-2021년 리뷰는 2시간 강의가 길고 지루하며 튜토리얼도 얻는 게 적다고 했고, 입문으로는 SOCI10001을 선호한 사람도 있음."
    vi: "Người đánh giá 2020-2021 thấy bài giảng hai tiếng dài và khô, tutorial ít hiệu quả, và một số thích SOCI10001 hơn để nhập môn."
    ms: "Pengulas 2020-2021 dapati kuliah dua jam panjang dan hambar serta tutorial kurang berhasil, dan ada yang lebih suka SOCI10001 sebagai pengenalan."
    id: "Pengulas 2020-2021 merasa kuliah dua jam terlalu panjang dan kering serta tutorial kurang bermanfaat, dan sebagian lebih memilih SOCI10001 sebagai pengantar."
    hi: "2020-2021 के रिव्यूअर्स को दो घंटे के लेक्चर लंबे और नीरस और ट्यूटोरियल कम उपयोगी लगे, और कुछ ने परिचय के लिए SOCI10001 को बेहतर माना।"
  - en: "Assignments were called interesting and not too hard, with good resources. The 2024 reviewer found it relatively easy to score well and said it improved their writing."
    zh: "作业被认为有趣且不太难，资源充足。2024年的评论者觉得较容易拿高分，并说写作能力因此提高了。"
    zh-TW: "作業被認為有趣且不太難，資源充足。2024年的評論者覺得較容易拿高分，並說寫作能力因此提高了。"
    ja: "課題は面白く難しすぎず、資料も充実しているとされた。2024年のレビューでは比較的高得点を取りやすく、文章力が上がったという。"
    ko: "과제는 흥미롭고 너무 어렵지 않으며 자료도 충분하다는 평. 2024년 리뷰어는 비교적 고득점이 쉽고 글쓰기 실력이 늘었다고 함."
    vi: "Bài tập được cho là thú vị, không quá khó, có nhiều tài liệu. Người năm 2024 thấy khá dễ đạt điểm cao và nói kỹ năng viết được cải thiện."
    ms: "Tugasan dikatakan menarik dan tidak terlalu sukar, dengan sumber yang baik. Pengulas 2024 dapati agak mudah dapat markah baik dan kata penulisannya bertambah baik."
    id: "Tugas disebut menarik dan tidak terlalu sulit, dengan sumber yang memadai. Pengulas 2024 merasa cukup mudah dapat nilai bagus dan bilang kemampuan menulisnya meningkat."
    hi: "असाइनमेंट दिलचस्प और ज़्यादा कठिन नहीं बताए गए, अच्छे संसाधनों के साथ। 2024 के रिव्यूअर को अच्छे अंक पाना अपेक्षाकृत आसान लगा और उन्होंने कहा कि उनका लेखन सुधरा।"
difficulty: easy
