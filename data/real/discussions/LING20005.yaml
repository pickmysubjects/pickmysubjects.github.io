code: LING20005
source: StudentVIP
url: https://studentvip.com.au/unimelb/subjects/ling20005
reviews: 9
from: 2017
to: 2022
checked: 2026-10-17
points:
  - en: "Phonetics is largely learning the IPA and training your ear. Assessments are transcription exercises, which several found very hard if you struggle to hear sound differences."
    zh: "语音学主要是学国际音标和训练听力。作业是转写练习，好几人说如果听不出音的差别会非常难。"
    zh-TW: "語音學主要是學國際音標和訓練聽力。作業是轉寫練習，好幾個人說如果聽不出音的差別會非常難。"
    ja: "音声学は主にIPAを覚えて耳を鍛える科目。課題は書き取り（転写）練習で、音の違いが聞き取りにくい人にはとても難しいという声が複数。"
    ko: "음성학은 주로 IPA를 배우고 귀를 훈련하는 과목. 과제는 전사 연습이라 소리 차이를 잘 못 듣는다면 매우 어렵다는 의견이 여럿."
    vi: "Ngữ âm học chủ yếu là học IPA và luyện tai. Bài tập là phiên âm, nhiều người thấy rất khó nếu bạn không phân biệt được các âm."
    ms: "Fonetik kebanyakannya belajar IPA dan melatih pendengaran. Tugasan ialah latihan transkripsi, yang beberapa orang dapati sangat sukar jika sukar membezakan bunyi."
    id: "Fonetik sebagian besar belajar IPA dan melatih pendengaran. Tugasnya latihan transkripsi, yang menurut beberapa orang sangat sulit jika susah membedakan bunyi."
    hi: "फ़ोनेटिक्स मुख्यतः IPA सीखना और कान को प्रशिक्षित करना है। असाइनमेंट ट्रांसक्रिप्शन अभ्यास हैं, जो कई लोगों को बहुत कठिन लगे अगर ध्वनियों का अंतर सुनना मुश्किल हो।"
  - en: "The written exam was generally called straightforward. The common advice is to keep up and use the many practice resources provided, as topics build on each other."
    zh: "笔试一般被认为直截了当。常见建议是跟上进度，多用课程提供的大量练习资源，因为各主题层层递进。"
    zh-TW: "筆試一般被認為直截了當。常見建議是跟上進度，多用課程提供的大量練習資源，因為各主題層層遞進。"
    ja: "筆記試験は概ね素直とされた。トピックが積み重ね式なので、遅れずに進み、豊富な練習教材を使うのが定番のアドバイス。"
    ko: "필기시험은 대체로 무난하다는 평. 주제가 이어지므로 진도를 따라가고 제공되는 많은 연습 자료를 활용하라는 조언이 흔함."
    vi: "Bài thi viết nhìn chung được cho là dễ hiểu. Lời khuyên chung là theo kịp và tận dụng nhiều tài liệu luyện tập được cung cấp, vì các chủ đề nối tiếp nhau."
    ms: "Peperiksaan bertulis umumnya dikatakan mudah. Nasihat biasa ialah ikut rentak dan guna banyak sumber latihan yang disediakan, kerana topik saling membina."
    id: "Ujian tertulis umumnya disebut lugas. Saran umumnya: ikuti terus dan manfaatkan banyak bahan latihan yang disediakan, karena topik saling membangun."
    hi: "लिखित एग्ज़ाम आमतौर पर सीधा बताया गया। आम सलाह है कि साथ चलें और दिए गए ढेर सारे अभ्यास संसाधन इस्तेमाल करें, क्योंकि टॉपिक एक-दूसरे पर बनते हैं।"
  - en: "Opinions split: some called it the hardest linguistics subject, others found it manageable and satisfying. A 2021 review complained the tone assignment went beyond what was taught."
    zh: "意见分歧：有人说这是最难的语言学课，也有人觉得可控且有成就感。一位2021年的评论抱怨声调作业超出了所教内容。"
    zh-TW: "意見分歧：有人說這是最難的語言學課，也有人覺得可控且有成就感。一位2021年的評論抱怨聲調作業超出了所教內容。"
    ja: "意見は分かれる。最も難しい言語学科目という人もいれば、こなせて達成感があるという人も。2021年のレビューでは声調の課題が授業内容を超えていたという不満。"
    ko: "의견이 갈림. 가장 어려운 언어학 과목이라는 사람도, 할 만하고 성취감 있다는 사람도 있음. 2021년 리뷰는 성조 과제가 배운 범위를 넘었다고 불평함."
    vi: "Ý kiến chia rẽ: có người gọi đây là môn ngôn ngữ học khó nhất, người khác thấy vừa sức và thỏa mãn. Một đánh giá 2021 phàn nàn bài về thanh điệu vượt quá những gì đã dạy."
    ms: "Pendapat berbelah: ada yang kata ia subjek linguistik paling sukar, ada yang dapati boleh diurus dan memuaskan. Satu ulasan 2021 mengadu tugasan nada melampaui apa yang diajar."
    id: "Pendapat terbelah: ada yang menyebutnya mata kuliah linguistik tersulit, ada yang merasa bisa dikelola dan memuaskan. Satu ulasan 2021 mengeluh tugas nada melampaui yang diajarkan."
    hi: "राय बँटी है: कुछ ने इसे सबसे कठिन भाषाविज्ञान विषय कहा, दूसरों को यह संभालने लायक और संतोषजनक लगा। 2021 के एक रिव्यू ने शिकायत की कि टोन असाइनमेंट पढ़ाए गए से आगे था।"
sections:
  content:
    - en: "The first half is learning the IPA and producing every sound yourself; the second covers tone, stress and Australian English. Reviewers see it as a must for linguistics majors."
      zh: "前半学期学 IPA，并自己把每个音发出来；后半学期讲声调、重音和澳洲英语。同学认为语言学专业必修。"
      zh-TW: "前半學期學 IPA，並自己把每個音發出來；後半學期講聲調、重音和澳洲英語。同學認為語言學主修必修。"
      ja: "前半はIPAを学び、すべての音を自分で発音する。後半は声調、強勢、オーストラリア英語。言語学専攻には必須という声。"
      ko: "전반부는 IPA를 배우고 모든 소리를 직접 내 보며, 후반부는 성조, 강세, 호주 영어를 다룬다. 언어학 전공이면 필수라는 평."
      vi: "Nửa đầu học IPA và tự phát âm mọi âm; nửa sau học thanh điệu, trọng âm và tiếng Anh Úc. Người học coi đây là môn bắt buộc cho ngành ngôn ngữ học."
      ms: "Separuh pertama belajar IPA dan menyebut setiap bunyi sendiri; separuh kedua tentang nada, tekanan dan Bahasa Inggeris Australia. Dianggap wajib untuk major linguistik."
      id: "Paruh pertama belajar IPA dan melafalkan setiap bunyi sendiri; paruh kedua soal nada, tekanan dan bahasa Inggris Australia. Dianggap wajib untuk jurusan linguistik."
      hi: "पहले हिस्से में IPA सीखना और हर ध्वनि ख़ुद बोलना; दूसरे में टोन, स्ट्रेस और ऑस्ट्रेलियाई अंग्रेज़ी। रिव्यूअर्स इसे लिंग्विस्टिक्स मेजर के लिए ज़रूरी मानते हैं।"
  work:
    - en: "Assignments are listening and transcription exercises, and the exam has a transcription part too. Many found ear training the hardest bit; the written exam is seen as straightforward."
      zh: "作业是听音和转写练习，考试也有转写部分。很多人觉得练耳朵最难；笔试部分被认为比较直接。"
      zh-TW: "作業是聽音和轉寫練習，考試也有轉寫部分。很多人覺得練耳朵最難；筆試部分被認為比較直接。"
      ja: "課題は聞き取りと音声表記の演習で、試験にも表記問題がある。耳の訓練が一番難しいという声が多く、筆記試験は素直だという。"
      ko: "과제는 듣기와 전사 연습이고 시험에도 전사 파트가 있다. 귀 훈련이 가장 어렵다는 평이 많고, 필기시험은 무난하다고 한다."
      vi: "Bài tập là nghe và phiên âm, bài thi cũng có phần phiên âm. Nhiều người thấy luyện tai là khó nhất; phần thi viết được cho là dễ hiểu."
      ms: "Tugasan ialah latihan mendengar dan transkripsi, dan peperiksaan juga ada bahagian transkripsi. Ramai rasa latihan telinga paling sukar; peperiksaan bertulis dianggap mudah."
      id: "Tugasnya latihan menyimak dan transkripsi, dan ujiannya juga ada bagian transkripsi. Banyak yang merasa melatih telinga paling sulit; ujian tertulis dianggap lugas."
      hi: "असाइनमेंट सुनने और ट्रांसक्रिप्शन के अभ्यास हैं, और परीक्षा में भी ट्रांसक्रिप्शन हिस्सा है। कई को कान का अभ्यास सबसे कठिन लगा; लिखित परीक्षा सीधी मानी गई।"
  study:
    - en: "Learn the IPA early, keep up, and use the many practice and ear-training resources on the LMS."
      zh: "早点把 IPA 记熟，跟上进度，多用 LMS 上大量的练习和听辨资源。"
      zh-TW: "早點把 IPA 記熟，跟上進度，多用 LMS 上大量的練習和聽辨資源。"
      ja: "IPAは早めに覚え、遅れずについていき、LMSにある多くの練習・聞き取り教材を使う。"
      ko: "IPA를 일찍 외우고 진도를 따라가며, LMS의 많은 연습·청취 자료를 활용하라."
      vi: "Học IPA sớm, theo kịp tiến độ và dùng nhiều tài liệu luyện tập, luyện tai trên LMS."
      ms: "Hafal IPA awal, ikut rentak, dan guna banyak sumber latihan dan latihan telinga di LMS."
      id: "Kuasai IPA sejak awal, ikuti tempo, dan pakai banyak latihan dan materi melatih telinga di LMS."
      hi: "IPA जल्दी सीखें, साथ चलें, और LMS पर मौजूद ढेर सारे अभ्यास और कान-प्रशिक्षण संसाधनों का इस्तेमाल करें।"
  watch:
    - en: "Reviewers in 2021–22 say the second assignment had tone transcription after little class time on tones. Some found it boring or poorly explained."
      zh: "2021–22 年的同学说第二个作业要转写声调，但课上讲声调的时间很少。也有人觉得无聊或讲解不清。"
      zh-TW: "2021–22 年的同學說第二份作業要轉寫聲調，但課堂上講聲調的時間很少。也有人覺得無聊或講解不清。"
      ja: "2021〜22年のレビューでは、声調の授業はわずかなのに2つ目の課題で声調の表記が出たという。退屈、説明不足という声も。"
      ko: "2021–22년 리뷰에 따르면 성조 수업은 조금뿐인데 두 번째 과제에 성조 전사가 나왔다. 지루하거나 설명이 부족했다는 의견도 있다."
      vi: "Người học năm 2021–22 nói bài tập thứ hai có phiên âm thanh điệu dù trên lớp ít học về thanh điệu. Một số thấy chán hoặc giảng chưa rõ."
      ms: "Pengulas 2021–22 kata tugasan kedua ada transkripsi nada walaupun sedikit masa kelas tentang nada. Ada yang rasa membosankan atau kurang dijelaskan."
      id: "Pengulas 2021–22 bilang tugas kedua berisi transkripsi nada padahal pembahasan nada di kelas sedikit. Sebagian merasa membosankan atau kurang dijelaskan."
      hi: "2021–22 के रिव्यूअर्स कहते हैं दूसरे असाइनमेंट में टोन का ट्रांसक्रिप्शन था, जबकि क्लास में टोन पर कम समय दिया गया। कुछ को यह उबाऊ या कम समझाया हुआ लगा।"
difficulty: mixed
