  - en: "A step up from French 3, but reviewers still found it fun and manageable, even as a breadth."
    zh: "比法语3难一级，但评论者仍觉得有趣、可应付，作为跨学科选修也行。"
    zh-TW: "比法語3難一級，但評論者仍覺得有趣、可應付，作為Breadth選修也行。"
    ja: "French 3より一段階難しいが、Breadthとしても楽しくこなせたとのこと。"
    ko: "French 3보다 한 단계 어렵지만, Breadth로도 재미있고 해볼 만했다는 평."
    vi: "Khó hơn French 3 một bậc, nhưng người đánh giá vẫn thấy vui và vừa sức, kể cả học làm Breadth."
    ms: "Setingkat lebih tinggi daripada French 3, tetapi pengulas masih dapati ia seronok dan boleh diurus, walaupun sebagai Breadth."
    id: "Setingkat di atas French 3, tapi pengulas tetap merasa seru dan bisa dikelola, bahkan sebagai Breadth."
    hi: "French 3 से एक कदम आगे, फिर भी रिव्यूअर्स को यह मज़ेदार और संभालने लायक लगा, Breadth के रूप में भी।"
  - en: "Tests and assignments take real effort; practise outside class with French films, reading and conversation."
    zh: "测验和作业需要下真功夫；课外多看法语电影、多阅读、多找人练口语。"
    zh-TW: "測驗和作業需要下真功夫；課外多看法語電影、多閱讀、多找人練口說。"
    ja: "小テストと課題にはしっかり努力が必要。授業外でもフランス映画や読書、会話で練習すること。"
    ko: "시험과 과제엔 제대로 노력이 필요. 수업 밖에서도 프랑스 영화, 읽기, 회화로 연습할 것."
    vi: "Bài kiểm tra và bài tập cần nỗ lực thật; hãy luyện ngoài giờ bằng phim, sách và trò chuyện tiếng Pháp."
    ms: "Ujian dan tugasan memerlukan usaha sebenar; berlatih di luar kelas dengan filem, bacaan dan perbualan Perancis."
    id: "Tes dan tugas butuh usaha sungguhan; berlatihlah di luar kelas lewat film, bacaan, dan percakapan bahasa Prancis."
    hi: "टेस्ट और असाइनमेंट में असली मेहनत लगती है; क्लास के बाहर फ़्रेंच फ़िल्मों, पढ़ाई और बातचीत से अभ्यास करें।"
