points:
  - en: "All three reviewers loved it as a breadth: almost all drawing, with unusual experiences like life models and anatomy specimens."
    zh: "三位评论者都很喜欢这门跨学科选修：几乎全是画画，还有真人模特和解剖标本等少见体验。"
    zh-TW: "三位評論者都很喜歡這門 Breadth 選修：幾乎全是畫畫，還有真人模特兒和解剖標本等少見體驗。"
    ja: "3人ともBreadthとして気に入った。ほぼ描くだけで、ヌードモデルや解剖標本など珍しい体験がある。"
    ko: "세 명 모두 Breadth로 매우 만족. 거의 그림만 그리고 누드모델과 해부 표본 같은 특별한 경험이 있음."
    vi: "Cả ba người rất thích làm Breadth: gần như chỉ vẽ, có trải nghiệm hiếm như mẫu thật và tiêu bản giải phẫu."
    ms: "Ketiga-tiga pengulas sangat suka sebagai Breadth: hampir semuanya melukis, dengan pengalaman unik seperti model hidup dan spesimen anatomi."
    id: "Ketiga pengulas sangat suka sebagai Breadth: hampir semuanya menggambar, dengan pengalaman unik seperti model hidup dan spesimen anatomi."
    hi: "तीनों को Breadth के रूप में बहुत पसंद आया: लगभग सिर्फ़ ड्रॉइंग, लाइव मॉडल और एनाटॉमी नमूनों जैसे अनोखे अनुभव।"
  - en: "The intensive is fast-paced, with daily homework and lots of drawing outside class; expect to be tired by the end."
    zh: "密集课节奏快，每天有作业，课外还要画很多；结课时会很累。"
    zh-TW: "密集課節奏快，每天有作業，課外還要畫很多；結課時會很累。"
    ja: "集中講座は進度が速く、毎日の宿題と授業外の描画が多い。最後は疲れ切る覚悟を。"
    ko: "집중 과정은 빠르고 매일 숙제와 수업 외 드로잉이 많음. 끝날 땐 지칠 각오를."
    vi: "Lớp cấp tốc nhịp nhanh, có bài tập mỗi ngày và vẽ nhiều ngoài giờ; cuối khóa sẽ khá mệt."
    ms: "Kursus intensif ini laju, dengan kerja rumah harian dan banyak melukis di luar kelas; bersedia untuk penat."
    id: "Kelas intensif bertempo cepat, ada PR harian dan banyak menggambar di luar kelas; bersiaplah lelah di akhir."
    hi: "इंटेंसिव तेज़ है, रोज़ होमवर्क और क्लास के बाहर बहुत ड्रॉइंग; अंत तक थकान तय है।"
  - en: "No drawing experience is needed since marks focus on improvement, but one reviewer said a high mark took a lot of effort. There is a cost for an art kit."
    zh: "不需要绘画经验，评分看进步，但有人说拿高分很费力。需要自费购买画具。"
    zh-TW: "不需要繪畫經驗，評分看進步，但有人說拿高分很費力。需要自費購買畫具。"
    ja: "評価は上達重視なので経験不要。ただし高得点には相当の努力が要ったという声も。画材キットは自費。"
    ko: "채점은 발전 중심이라 경험이 없어도 됨. 다만 고득점엔 노력이 많이 든다는 의견도. 화구 키트는 자비."
    vi: "Không cần biết vẽ vì điểm dựa trên tiến bộ, nhưng có người nói điểm cao rất tốn công. Phải tự mua bộ dụng cụ vẽ."
    ms: "Tiada pengalaman diperlukan kerana markah fokus pada kemajuan, tetapi seorang kata markah tinggi perlu usaha besar. Ada kos kit seni."
    id: "Tak perlu pengalaman karena nilai fokus pada kemajuan, tapi satu pengulas bilang nilai tinggi butuh usaha besar. Ada biaya kit seni."
    hi: "अनुभव ज़रूरी नहीं क्योंकि अंक प्रगति पर हैं, पर एक ने कहा ऊँचे अंक में बहुत मेहनत लगी। आर्ट किट का ख़र्च अलग है।"
workload: heavy
difficulty: mixed
