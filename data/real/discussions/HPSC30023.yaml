points:
  - en: "Reviewers from 2018 to 2024 found the content thought-provoking: it looks at science through a sociological lens and applies this to controversies like pandemics and climate change. It takes a few weeks to click."
    zh: "2018到2024年的评论者觉得内容发人深省：用社会学视角看科学，并应用到疫情、气候变化等争议上。前几周需要一点时间才能进入状态。"
    zh-TW: "2018到2024年的評論者覺得內容發人深省：用社會學視角看科學，並應用到疫情、氣候變遷等爭議上。前幾週需要一點時間才能進入狀態。"
    ja: "2018〜2024年の評者は内容が刺激的だと評価。社会学の視点から科学を見て、パンデミックや気候変動などの論争に当てはめる。最初の数週間は慣れるまで時間がかかる。"
    ko: "2018~2024년 리뷰어들은 내용이 생각할 거리를 준다고 평가. 사회학적 시각으로 과학을 보고 팬데믹, 기후변화 같은 논쟁에 적용함. 처음 몇 주는 적응이 필요함."
    vi: "Người đánh giá 2018–2024 thấy nội dung gợi suy nghĩ: nhìn khoa học qua lăng kính xã hội học và áp dụng vào tranh cãi như đại dịch, biến đổi khí hậu. Cần vài tuần mới thấm."
    ms: "Pengulas 2018 hingga 2024 dapati kandungannya merangsang fikiran: melihat sains dari kaca mata sosiologi dan menerapkannya pada kontroversi seperti pandemik dan perubahan iklim. Perlu beberapa minggu untuk faham."
    id: "Pengulas 2018 sampai 2024 menilai isinya menggugah pikiran: melihat sains lewat lensa sosiologi dan menerapkannya pada kontroversi seperti pandemi dan perubahan iklim. Butuh beberapa minggu untuk nyambung."
    hi: "2018 से 2024 के रिव्यूअर्स को सामग्री सोचने पर मजबूर करने वाली लगी: विज्ञान को समाजशास्त्रीय नज़र से देखना और महामारी व जलवायु परिवर्तन जैसे विवादों पर लागू करना। समझ बैठने में कुछ हफ़्ते लगते हैं।"
  - en: "Tutorials were consistently praised as engaging, with good discussion."
    zh: "辅导课一直被称赞，互动性强，讨论质量高。"
    zh-TW: "輔導課一直被稱讚，互動性強，討論品質高。"
    ja: "チュートリアルは一貫して好評で、議論が活発。"
    ko: "튜토리얼은 꾸준히 흥미롭고 토론이 좋다는 호평을 받음."
    vi: "Tutorial luôn được khen là cuốn hút, thảo luận tốt."
    ms: "Tutorial sentiasa dipuji kerana menarik dengan perbincangan yang baik."
    id: "Tutorial selalu dipuji menarik dengan diskusi yang bagus."
    hi: "ट्यूटोरियल्स की लगातार तारीफ़ हुई: रोचक और अच्छी चर्चा वाले।"
  - en: "Both 2024 reviewers criticised the organisation: instructions for the big final assessment (around 60%) came out much later than promised, leaving little time, and emails often went unanswered."
    zh: "2024年的两位评论者都批评组织问题：占比约60%的期末大作业说明比承诺晚很多才发布，留给学生的时间很少，邮件也常没人回复。"
    zh-TW: "2024年的兩位評論者都批評組織問題：佔比約60%的期末大作業說明比承諾晚很多才發布，留給學生的時間很少，郵件也常沒人回覆。"
    ja: "2024年の評者2人はともに運営を批判。配点約60%の最終課題の指示が予定よりかなり遅れて出され時間が足りず、メールにも返事がないことが多かった。"
    ko: "2024년 리뷰어 두 명 모두 운영을 비판함. 약 60% 비중의 기말 과제 안내가 약속보다 훨씬 늦게 나와 시간이 부족했고, 이메일 답장도 자주 없었음."
    vi: "Cả hai người năm 2024 chê khâu tổ chức: hướng dẫn bài cuối kỳ lớn (khoảng 60%) ra muộn hơn nhiều so với hứa, còn rất ít thời gian, và email thường không được trả lời."
    ms: "Kedua-dua pengulas 2024 mengkritik pengurusan: arahan penilaian akhir besar (kira-kira 60%) keluar jauh lebih lewat daripada dijanjikan, masa tinggal sedikit, dan e-mel sering tidak dibalas."
    id: "Kedua pengulas 2024 mengkritik pengelolaannya: petunjuk tugas akhir besar (sekitar 60%) keluar jauh lebih lambat dari janji, waktunya jadi sempit, dan email sering tidak dibalas."
    hi: "2024 के दोनों रिव्यूअर्स ने प्रबंधन की आलोचना की: लगभग 60% वाले बड़े अंतिम असाइनमेंट के निर्देश वादे से बहुत देर से आए, समय कम बचा, और ईमेल का अक्सर जवाब नहीं मिला।"
difficulty: hard
