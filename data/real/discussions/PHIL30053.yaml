reviews: 7
from: 2019
to: 2025
checked: 2026-10-17
points:
  - en: "Reviewers from 2019 to 2025 rate it highly: weekly recorded videos plus a two-hour seminar, well-written handouts and engaging discussion."
    zh: "2019到2025年的评论者评价很高：每周录播视频加两小时研讨课，讲义写得好，讨论也吸引人。"
    zh-TW: "2019到2025年的評論者評價很高：每週錄播影片加兩小時研討課，講義寫得好，討論也吸引人。"
    ja: "2019〜2025年のレビューで高評価。毎週の録画動画と2時間のセミナー、よく書かれた配布資料、引き込まれる議論。"
    ko: "2019~2025년 리뷰에서 높은 평가. 매주 녹화 영상과 2시간 세미나, 잘 쓰인 자료, 흥미로운 토론."
    vi: "Người đánh giá từ 2019 đến 2025 đánh giá cao: video ghi sẵn hằng tuần cộng seminar hai tiếng, tài liệu viết tốt và thảo luận cuốn hút."
    ms: "Pengulas dari 2019 hingga 2025 menilainya tinggi: video rakaman mingguan serta seminar dua jam, nota edaran yang ditulis baik dan perbincangan menarik."
    id: "Pengulas 2019-2025 menilainya tinggi: video rekaman mingguan plus seminar dua jam, handout yang ditulis dengan baik, dan diskusi yang menarik."
    hi: "2019 से 2025 तक के रिव्यूअर्स ने इसे ऊँचा आँका: हर हफ़्ते रिकॉर्डेड वीडियो और दो घंटे का सेमिनार, अच्छी तरह लिखे हैंडआउट और दिलचस्प चर्चा।"
  - en: "It is firmly analytic philosophy of language, which some found dry or more abstract than expected; marking was described as fair."
    zh: "这是地道的分析哲学（语言哲学），有人觉得枯燥或比预期更抽象；评分被认为公平。"
    zh-TW: "這是道地的分析哲學（語言哲學），有人覺得乏味或比預期更抽象；評分被認為公平。"
    ja: "完全に分析哲学寄りの言語哲学で、退屈、または思ったより抽象的と感じた人もいる。採点は公平とのこと。"
    ko: "철저히 분석철학 계열의 언어철학이라 건조하거나 예상보다 추상적이라는 사람도 있음. 채점은 공정하다는 평."
    vi: "Đây là triết học ngôn ngữ thuần phân tích, vài người thấy khô hoặc trừu tượng hơn mong đợi; chấm điểm được cho là công bằng."
    ms: "Ia benar-benar falsafah bahasa analitik, yang ada rasa hambar atau lebih abstrak daripada dijangka; pemarkahan digambarkan adil."
    id: "Ini filsafat bahasa analitik sepenuhnya, yang dirasa kering atau lebih abstrak dari dugaan oleh sebagian orang; penilaiannya disebut adil."
    hi: "यह पूरी तरह एनालिटिक भाषा-दर्शन है, जो कुछ को नीरस या उम्मीद से ज़्यादा अमूर्त लगा; मार्किंग को निष्पक्ष बताया गया।"
sections:
  content:
    - en: "Analytic philosophy of language: sense and reference, speech acts, metaphors, slurs and language and politics. Most loved it; some found the content dry or cerebral."
      zh: "分析哲学视角的语言哲学：涵义与指称、言语行为、隐喻、歧视性用语以及语言与政治。多数人很喜欢；也有人觉得内容枯燥、偏抽象。"
      zh-TW: "分析哲學角度的語言哲學：意義與指涉、言語行為、隱喻、歧視性用語以及語言與政治。多數人很喜歡；也有人覺得內容枯燥、偏抽象。"
      ja: "分析哲学の言語哲学。意義と指示、言語行為、比喩、差別語、言語と政治を扱う。多くが大好きだったが、内容が単調で抽象的だという声も。"
      ko: "분석철학의 언어철학: 뜻과 지시, 화행, 은유, 비하어, 언어와 정치. 대부분 아주 좋아했지만 내용이 건조하고 관념적이라는 의견도 있다."
      vi: "Triết học ngôn ngữ theo hướng phân tích: nghĩa và quy chiếu, hành vi ngôn từ, ẩn dụ, từ miệt thị, ngôn ngữ và chính trị. Đa số rất thích; có người thấy khô hoặc trừu tượng."
      ms: "Falsafah bahasa analitik: makna dan rujukan, lakuan tutur, metafora, kata hinaan serta bahasa dan politik. Kebanyakan sangat suka; ada yang rasa kandungannya hambar atau terlalu abstrak."
      id: "Filsafat bahasa analitik: makna dan referensi, tindak tutur, metafora, kata hinaan serta bahasa dan politik. Kebanyakan sangat suka; sebagian merasa materinya kering atau terlalu abstrak."
      hi: "विश्लेषणात्मक भाषा-दर्शन: अर्थ और संदर्भ, वाक्-कर्म, रूपक, अपशब्द और भाषा व राजनीति। ज़्यादातर को बहुत पसंद आया; कुछ को कंटेंट नीरस या बहुत बौद्धिक लगा।"
  work:
    - en: "Recorded weekly videos and long seminars with handouts, then assignments that start basic and broaden. Reviewers found the marking fair and prompts open to your own interests."
      zh: "每周看录好的视频，再上配有讲义的长研讨课；作业从基础开始逐步放宽。同学觉得评分公平，题目可以按兴趣发挥。"
      zh-TW: "每週看錄好的影片，再上配有講義的長研討課；作業從基礎開始逐步放寬。同學覺得評分公平，題目可依興趣發揮。"
      ja: "毎週の録画動画と配布資料付きの長いセミナー、基礎から徐々に広がる課題。採点は公平で、自分の関心に沿って書けるという。"
      ko: "매주 녹화 영상과 유인물이 있는 긴 세미나, 기초에서 점점 넓어지는 과제. 채점이 공정하고 관심 분야로 쓸 수 있다는 평."
      vi: "Video ghi sẵn hằng tuần và seminar dài có tài liệu phát tay, rồi các bài tập bắt đầu cơ bản và rộng dần. Người học thấy chấm công bằng và đề cho phép theo sở thích."
      ms: "Video mingguan rakaman dan seminar panjang dengan edaran, kemudian tugasan yang bermula asas dan makin luas. Pengulas rasa pemarkahan adil dan soalan terbuka kepada minat sendiri."
      id: "Video mingguan rekaman dan seminar panjang dengan handout, lalu tugas yang dimulai dari dasar dan makin luas. Pengulas merasa penilaiannya adil dan soal terbuka untuk minat sendiri."
      hi: "हर हफ़्ते रिकॉर्डेड वीडियो और हैंडआउट वाले लंबे सेमिनार, फिर असाइनमेंट जो बुनियादी से शुरू होकर व्यापक होते हैं। रिव्यूअर्स को मार्किंग उचित और विषय अपनी रुचि के अनुसार लगे।"
  study:
    - en: "Use the seminars to ask questions and discuss, and one reviewer found office hours a big help for writing the assignments well."
      zh: "多利用研讨课提问和讨论；有同学觉得去 office hours 对写好作业帮助很大。"
      zh-TW: "多利用研討課提問和討論；有同學覺得去 office hours 對寫好作業幫助很大。"
      ja: "セミナーで質問や議論をし、オフィスアワーも活用する。課題をうまく書くのに大いに役立ったという声も一つ。"
      ko: "세미나에서 질문하고 토론하라. 오피스 아워가 과제를 잘 쓰는 데 큰 도움이 됐다는 리뷰어도 있다."
      vi: "Tận dụng seminar để hỏi và thảo luận; một người thấy giờ tiếp sinh viên giúp rất nhiều để viết bài tốt."
      ms: "Guna seminar untuk bertanya dan berbincang, dan seorang pengulas dapati waktu pejabat sangat membantu menulis tugasan dengan baik."
      id: "Manfaatkan seminar untuk bertanya dan berdiskusi, dan satu pengulas merasa jam konsultasi sangat membantu menulis tugas dengan baik."
      hi: "सेमिनार में सवाल पूछने और चर्चा का फ़ायदा उठाएँ, और एक रिव्यूअर को ऑफ़िस आवर्स असाइनमेंट अच्छे से लिखने में बहुत मददगार लगे।"
  watch:
    - en: "It is firmly analytic; reviewers say skip it if you don't enjoy analytic philosophy, and non-philosophy majors may find it a bit harder."
      zh: "这门课非常偏分析哲学；同学说不喜欢分析哲学就别选，非哲学专业的同学可能会觉得难一点。"
      zh-TW: "這門課非常偏分析哲學；同學說不喜歡分析哲學就別修，非哲學主修的同學可能會覺得難一點。"
      ja: "完全に分析哲学寄り。分析哲学が好きでなければ避けるべき、哲学専攻でないと少し難しいかもという声。"
      ko: "확실히 분석철학 중심이다. 분석철학을 좋아하지 않으면 피하라는 평이고, 철학 비전공자에겐 조금 더 어려울 수 있다."
      vi: "Môn thiên hẳn về triết học phân tích; người học nói nếu không thích thì bỏ qua, và người không học ngành triết có thể thấy khó hơn chút."
      ms: "Ia sangat analitik; pengulas kata elakkan jika tidak suka falsafah analitik, dan bukan major falsafah mungkin rasa ia sedikit sukar."
      id: "Sangat analitik; pengulas bilang lewati kalau tidak suka filsafat analitik, dan mahasiswa non-filsafat mungkin merasa sedikit lebih sulit."
      hi: "यह पूरी तरह विश्लेषणात्मक है; रिव्यूअर्स कहते हैं विश्लेषणात्मक दर्शन पसंद न हो तो छोड़ दें, और गैर-दर्शन छात्रों को थोड़ा कठिन लग सकता है।"
