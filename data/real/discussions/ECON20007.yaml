  - en: "Reviewers disagree on the teaching: the oldest praised it and found the topics interesting, while the newest had a poor experience and found it hard to engage."
    zh: "对教学看法不一：最早的评价称赞教学、觉得主题有趣；最新的评价体验较差，很难投入。"
    zh-TW: "對教學看法不一：最早的評價稱讚教學、覺得主題有趣；最新的評價體驗較差，很難投入。"
    ja: "教え方の評価は分かれる。最も古いレビューは称賛し内容も面白いとしたが、最新のレビューは体験が悪く、集中しにくかったという。"
    ko: "강의 평가는 엇갈린다. 가장 오래된 리뷰는 칭찬하며 주제가 흥미롭다고 했지만, 최신 리뷰는 경험이 나빠 몰입하기 어려웠다고 했다."
    vi: "Ý kiến về giảng dạy trái ngược: đánh giá cũ nhất khen và thấy chủ đề thú vị, còn đánh giá mới nhất có trải nghiệm kém và khó tập trung."
    ms: "Pengulas tidak sependapat tentang pengajaran: yang terawal memuji dan dapati topik menarik, yang terbaru alami pengalaman buruk dan sukar terlibat."
    id: "Pengulas berbeda soal pengajaran: yang paling lama memuji dan merasa topiknya menarik, yang terbaru punya pengalaman buruk dan sulit terlibat."
    hi: "पढ़ाई पर राय बँटी है: सबसे पुराने रिव्यू ने तारीफ़ की और विषय रोचक पाए, जबकि सबसे नए का अनुभव खराब रहा और मन लगाना मुश्किल लगा।"
  - en: "Expect more maths than you might assume; the newest reviewer still thought the content itself was manageable."
    zh: "数学成分比想象中多；最新的评价仍认为内容本身应付得来。"
    zh-TW: "數學成分比想像中多；最新的評價仍認為內容本身應付得來。"
    ja: "想像より数学が多めなので覚悟を。それでも最新のレビューは内容自体はこなせるとしている。"
    ko: "생각보다 수학이 많다. 그래도 최신 리뷰는 내용 자체는 감당할 만하다고 했다."
    vi: "Hãy chuẩn bị nhiều toán hơn bạn nghĩ; người đánh giá mới nhất vẫn thấy bản thân nội dung theo được."
    ms: "Jangka lebih banyak matematik daripada sangkaan; pengulas terbaru masih rasa kandungannya boleh diurus."
    id: "Siapkan diri untuk matematika yang lebih banyak dari dugaan; pengulas terbaru tetap merasa materinya bisa diatasi."
    hi: "जितना सोचते हैं उससे ज़्यादा गणित की उम्मीद रखें; सबसे नए रिव्यूअर को फिर भी कंटेंट संभालने लायक लगा।"
