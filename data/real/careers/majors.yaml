  accreditation:
    body: "CPA Australia (CPA), Chartered Accountants ANZ (CA ANZ)"
    summary: { en: "Take the accreditation version of the major: ECON10003, the two Level 3 core subjects ACCT30002 and ACCT30004, and three business law breadth subjects. Full membership may also need work experience or further study.", zh: "要修这个专业的认证版本：ECON10003、两门三年级核心课 ACCT30002 和 ACCT30004，加三门商法 breadth 课。成为正式会员可能还需要工作经验或进一步学习。", zh-TW: "要修這個主修的認證版本：ECON10003、兩門三年級核心課 ACCT30002 和 ACCT30004，再加三門商法 breadth 課。成為正式會員可能還需要工作經驗或進一步進修。", ja: "専攻の認定版を履修します：ECON10003、3年次のコア科目 ACCT30002 と ACCT30004、それに商法の breadth 科目3つ。正会員になるには実務経験や追加の学修も必要な場合があります。", ko: "전공의 인증 버전을 이수하세요: ECON10003, 3학년 핵심 과목 ACCT30002와 ACCT30004, 그리고 상법 breadth 과목 3개. 정회원이 되려면 실무 경력이나 추가 학업이 필요할 수 있습니다.", vi: "Học phiên bản kiểm định của ngành: ECON10003, hai môn cốt lõi năm 3 ACCT30002 và ACCT30004, cùng ba môn breadth về luật kinh doanh. Để thành hội viên chính thức có thể cần thêm kinh nghiệm làm việc hoặc học tiếp.", ms: "Ambil versi akreditasi major ini: ECON10003, dua subjek teras Tahap 3 ACCT30002 dan ACCT30004, serta tiga subjek breadth undang-undang perniagaan. Keahlian penuh mungkin juga memerlukan pengalaman kerja atau pengajian lanjut.", id: "Ambil versi akreditasi jurusan ini: ECON10003, dua mata kuliah inti Level 3 ACCT30002 dan ACCT30004, serta tiga mata kuliah breadth hukum bisnis. Keanggotaan penuh mungkin juga memerlukan pengalaman kerja atau studi lanjut.", hi: "मेजर का मान्यता वाला संस्करण लें: ECON10003, लेवल 3 के दो कोर विषय ACCT30002 और ACCT30004, और बिज़नेस लॉ के तीन breadth विषय। पूर्ण सदस्यता के लिए कार्य अनुभव या आगे की पढ़ाई भी लग सकती है।" }
