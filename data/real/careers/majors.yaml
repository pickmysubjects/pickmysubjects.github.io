    summary: { en: "High marks in the matching subjects earn exemptions from the Actuaries Institute Foundation Program (not full accreditation). The route needs two extra Level 2 electives and the Actuarial Risk Management specialisation.", zh: "相应科目成绩够高，可以免考精算师协会（Actuaries Institute）的 Foundation Program（不是完整认证）。这条路线要多修两门二年级选修课，并完成 Actuarial Risk Management 方向。", zh-TW: "相應科目成績夠高，可以免考精算師協會（Actuaries Institute）的 Foundation Program（不是完整認證）。這條路線要多修兩門二年級選修課，並完成 Actuarial Risk Management 專攻。", ja: "対応する科目で高得点を取ると、Actuaries Institute（アクチュアリー会）の Foundation Program が免除されます（完全な認定ではありません）。このルートでは2年次の選択科目を2つ追加し、Actuarial Risk Management の specialisation を修める必要があります。", ko: "해당 과목에서 높은 점수를 받으면 Actuaries Institute(보험계리사 협회) Foundation Program이 면제됩니다(완전한 인증은 아님). 이 경로는 2학년 선택 과목 2개를 추가로 듣고 Actuarial Risk Management 세부 전공을 이수해야 합니다.", vi: "Điểm cao ở các môn tương ứng giúp được miễn Foundation Program của Actuaries Institute (không phải kiểm định đầy đủ). Lộ trình này cần thêm hai môn tự chọn năm 2 và chuyên ngành hẹp Actuarial Risk Management.", ms: "Markah tinggi dalam subjek berkaitan memberi pengecualian daripada Foundation Program Actuaries Institute (bukan akreditasi penuh). Laluan ini memerlukan dua elektif Tahap 2 tambahan dan pengkhususan Actuarial Risk Management.", id: "Nilai tinggi di mata kuliah terkait memberi pembebasan dari Foundation Program Actuaries Institute (bukan akreditasi penuh). Jalur ini butuh dua mata kuliah pilihan Level 2 tambahan dan peminatan Actuarial Risk Management.", hi: "संबंधित विषयों में ऊँचे अंक लाने पर Actuaries Institute के Foundation Program से छूट मिलती है (पूर्ण मान्यता नहीं)। इस रास्ते के लिए दो अतिरिक्त लेवल 2 वैकल्पिक विषय और Actuarial Risk Management स्पेशलाइज़ेशन चाहिए।" }
    required: ["ACTL20005", "ACTL20006", "ACTL30002", "ACTL30004"]
    recommended: ["ACTL10001", "MAST10008", "ACTL30008"]
    source: https://handbook.unimelb.edu.au/2026/components/b-com-major-2
