    summary: { en: "The 125-point accredited major (8 compulsory subjects plus two Level 3 psychology electives) is a prerequisite for further study to become a practising psychologist.", zh: "125 学分的认证版专业（8 门必修课，加两门三年级心理学选修）是之后继续读书、成为执业心理师的前提。", zh-TW: "125 學分的認證版主修（8 門必修課，加兩門三年級心理學選修）是之後繼續讀書、成為執業心理師的前提。", ja: "125単位の認定版専攻（必修8科目と3年次の心理学選択科目2つ）は、開業心理士を目指して進学するための前提条件です。", ko: "125학점짜리 인증 전공(필수 8과목과 3학년 심리학 선택 2과목)은 임상 심리사가 되기 위한 추가 학업의 선수 조건입니다.", vi: "Ngành 125 tín chỉ được kiểm định (8 môn bắt buộc và hai môn tự chọn tâm lý học năm 3) là điều kiện để học tiếp và trở thành nhà tâm lý hành nghề.", ms: "Major terakreditasi 125 mata (8 subjek wajib dan dua elektif psikologi Tahap 3) ialah prasyarat untuk pengajian lanjut bagi menjadi ahli psikologi berdaftar.", id: "Jurusan terakreditasi 125 poin (8 mata kuliah wajib plus dua pilihan psikologi Level 3) adalah prasyarat studi lanjut untuk menjadi psikolog praktik.", hi: "125 पॉइंट वाला मान्यता प्राप्त मेजर (8 अनिवार्य विषय और दो लेवल 3 मनोविज्ञान वैकल्पिक) प्रैक्टिसिंग मनोवैज्ञानिक बनने की आगे की पढ़ाई की पूर्व-शर्त है।" }
