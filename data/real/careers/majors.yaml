    summary: { en: "The 125-point accredited major (not the 75-point minor) is the first step to registration. 25 points of its Level 2 and 3 psychology go in your breadth.", zh: "125 学分的认证版专业（不是 75 学分的辅修）是注册心理师的第一步。其中 25 学分的二、三年级心理学课算在 breadth 里。", zh-TW: "125 學分的認證版主修（不是 75 學分的輔修）是註冊心理師的第一步。其中 25 學分的二、三年級心理學課算在 breadth 裡。", ja: "125単位の認定版専攻（75単位の副専攻ではない）が登録への第一歩です。そのうち2・3年次の心理学25単位は breadth に入ります。", ko: "125학점짜리 인증 전공(75학점 부전공이 아님)이 등록을 향한 첫 단계입니다. 그중 2·3학년 심리학 25학점은 breadth로 들어갑니다.", vi: "Ngành 125 tín chỉ được kiểm định (không phải ngành phụ 75 tín chỉ) là bước đầu để được đăng ký hành nghề. 25 tín chỉ tâm lý học năm 2 và 3 trong đó được tính vào phần breadth.", ms: "Major terakreditasi 125 mata (bukan minor 75 mata) ialah langkah pertama ke arah pendaftaran. 25 mata psikologi Tahap 2 dan 3 daripadanya dikira dalam breadth anda.", id: "Jurusan terakreditasi 125 poin (bukan minor 75 poin) adalah langkah pertama menuju registrasi. 25 poin psikologi Level 2 dan 3 di dalamnya masuk ke breadth Anda.", hi: "125 पॉइंट वाला मान्यता प्राप्त मेजर (75 पॉइंट का माइनर नहीं) पंजीकरण की पहली सीढ़ी है। इसके लेवल 2 और 3 मनोविज्ञान के 25 पॉइंट आपके breadth में जाते हैं।" }
