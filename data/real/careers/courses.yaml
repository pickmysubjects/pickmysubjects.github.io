- course: B-SCI
  source: https://handbook.unimelb.edu.au/2026/courses/b-sci/further-study
  checked: 2026-10-23
  summary: { en: "Honours (depending on the major; see BH-SCI), graduate professional entry degrees (some with research training), and research higher degrees (masters/doctoral) after research training in Honours, a Postgraduate Diploma or a Masters.", zh: "荣誉学位（视专业而定，见 BH-SCI）、研究生专业入门学位（部分含研究训练），以及在荣誉学位、研究生文凭或硕士阶段完成研究训练后的研究型硕士/博士。", zh-TW: "榮譽學位（視主修而定，見 BH-SCI）、研究所專業入門學位（部分含研究訓練），以及在榮譽學位、研究所文憑或碩士階段完成研究訓練後的研究型碩士／博士。", ja: "Honours（専攻による。BH-SCI を参照）、大学院の専門職入門学位（一部は研究訓練を含む）、そして Honours・Postgraduate Diploma・修士で研究訓練を受けた後の研究学位（修士・博士）。", ko: "Honours(전공에 따라 다름, BH-SCI 참고), 대학원 전문직 입문 학위(일부는 연구 훈련 포함), 그리고 Honours·Postgraduate Diploma·석사에서 연구 훈련을 받은 뒤의 연구 학위(석사·박사).", vi: "Honours (tùy ngành; xem BH-SCI), các bằng sau đại học để vào nghề (một số có đào tạo nghiên cứu), và bằng nghiên cứu (thạc sĩ/tiến sĩ) sau khi được đào tạo nghiên cứu ở Honours, Postgraduate Diploma hoặc thạc sĩ.", ms: "Honours (bergantung pada major; lihat BH-SCI), ijazah siswazah kemasukan profesional (sesetengahnya dengan latihan penyelidikan), dan ijazah tinggi penyelidikan (sarjana/doktor falsafah) selepas latihan penyelidikan dalam Honours, Postgraduate Diploma atau sarjana.", id: "Honours (tergantung jurusan; lihat BH-SCI), gelar pascasarjana untuk masuk profesi (sebagian dengan pelatihan riset), dan gelar riset (magister/doktor) setelah pelatihan riset di Honours, Postgraduate Diploma, atau magister.", hi: "Honours (मेजर पर निर्भर; BH-SCI देखें), प्रोफ़ेशनल प्रवेश वाली स्नातकोत्तर डिग्रियाँ (कुछ में शोध प्रशिक्षण), और Honours, Postgraduate Diploma या मास्टर में शोध प्रशिक्षण के बाद शोध डिग्रियाँ (मास्टर/डॉक्टरेट)।" }
