prerequisites:
  manual: "Entry is via a competitive selection process as places are limited. In order to apply: Students enrolled in a MBS program or eligible non-MBS program must have completed a minimum of 50 points of their program at the time of application. Students must have achieved a minimum weighted average mark for their graduate subjects of 70%. Permission from the Subject Coordinator via a selection process. Please note: Students are not able to self-enrol. Successful applicants will be enrolled in the subject upon conclusion of the selection process Students who have already completed the Business Practicum may submit an Expression of Interest to be placed on a waiting list. Students on the list will only be considered if there is adequate availability. Students enrolled in the Master of Engineering (Electrical, Mechanical, and Software streams), Master of Information Systems and Master of Information Technology are eligible to apply. Students must be available for the entire project period and be available to work on the final report with their team once the teaching period is over, until it is due. For information on how to apply: Link"
