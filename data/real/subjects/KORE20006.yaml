    - manual: All students enrolling in a language subject for the first time are required to complete the online language questionnaire and the placement test (if applicable) to the best of their knowledge and ability. This applies to all students, from beginners through to students who have completed formal language study (such as VCE or equivalent), or learned language informally through family, social networks or travel. The language questionnaire and placement test are designed to place students in the class that will best develop their language skills. Upon completion of the placement procedure, students will receive an email with the outcome. Within five working days of receiving the email, study plans will be updated, and students will be able to self-enrol into the first subject of their entry point. Students can appeal the outcome of the placement test by emailing the subject or program coordinator, who will review the case and make a final decision. Program staff are responsible for placing students appropriately. This means that, if program staff believe a student has been incorrectly placed in a subject, they have the right to move that student after classes have already begun. Program staff may make this decision upon further assessment of a student’s language skills. All students must read carefully and accept the academic staff rights clause before continuing. Link It is recommended that students undertake the language placement test at least two weeks prior to the commencement of semester.
