code: SCIE90039
title: Advanced Science Internship
level: 9
points: 12.5
offerings:
  "2027":
    - summer
    - semester-1
    - semester-2
prerequisites:
  permission: application
  note: "Students must have a bachelor-level degree to enrol in this subject. Approval from the subject coordinator is required to enrol in this subject, following a review of the student's internship application form. To be approved, students should demonstrate that a minimum of 70% of the placement activities are aligned with their course and the intended learning objectives of this subject, and that a maximum of 15% of the placement activities are administrative in nature. The placements must be new opportunity in a new organisation that the student has sourced specifically for this subject. Entering an entirely new work environment is an important requirement of this subject. If you have questions on how and where to find an internship you should contact the Careers and Industry team in the Faculty of Science at hyperlink: https://forms.your.unimelb.edu.au/4747166?SID=a3xOY000000018z More information can be found at: https: https://science.unimelb.edu.au/students/enrich-your-studies/internship-subjects"
