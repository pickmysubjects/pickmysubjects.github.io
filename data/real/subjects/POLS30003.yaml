    - manual: "The WAM of the above four subjects will be taken into consideration when assessing student applications. All students should have at least a WAM of 70. If students completed more than required points at that year level, the highest marks will be calculated for the WAM. Making the application: Students should make this application via the online application form: Application Form Applications will be reviewed in two rounds: Round 1 (Semester 1 availability): closing 31 October Round 2 (Semester 2 availability): closing 31 May Students will receive outcomes within two weeks of the closing date for the relevant round. For further information including FAQS on the Application and Selection Process see: Faculty of Arts - WIL FAQs *Late applications will be considered in both semesters if you meet the eligibility requirements and have secured a placement except in the event of the quota subject places reaching capacity. Please contact Experiential Learning Officer if you’re submitting a late application form: ssps-internships@unimelb.edu.au"
