prerequisites:
  permission: coordinator
  note: "A weighted average mark of 75 or above, and no more than 75 points short of degree completion. Students who meet the above criteria will need to complete an Enrolment Assistance form; Coordinator approval is not required: https://students.unimelb.edu.au/your-course/manage-your-course/course-enrolment/enrolment-assistance Completing enrolment into the subject will give students access, via the LMS, to information about possible topics, supervision, and timelines. Students should negotiate a project topic with a project supervisor well before the start of semester. By the end of Week 1 of semester, students must formally register their project, using an online form available via the LMS. Students applying for summer intake will require approval from the subject coordinator, where students will only be considered if a supervisor from the School of CIS has agreed to supervise in collaboration with an identified overseas partner."
