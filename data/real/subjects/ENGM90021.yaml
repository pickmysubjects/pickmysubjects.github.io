prerequisites:
  permission: application
  note: "There is an application process for this subject: Students are required to source and secure their own internship, subject to subject coordinator approval. Approval from the subject coordinator is required to enrol in this subject, following review of the student's internship application form. An application for a student-sourced internship must be made well in advance of both the commencement of the teaching period and of the internship. For specific dates, please refer to the Internships website, which can be found in the section on “Further information”. Students are likely to find the internship subject to be significantly more challenging than most other subjects due to the very high workload requirements of being on an industry internship, and the need to adapt to an industry environment. As such, students completing the internship subject as part of a full study load will need to manage their time very carefully. Please do note that 'At Risk' students are not eligible to enrol in this subject."
