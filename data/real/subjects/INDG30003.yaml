prerequisites:
  manual: "Approval from the Subject Coordinator is required to enrol in this subject, and a quota of 20 students applies. Preference will be given to students majoring in Indigenous Studies and Indigenous students. For non-Indigenous students not studying Indigenous Studies, selection will be based on academic performance and a personal statement. To apply for approval to enrol, please email the Subject Coordinator by Friday 14 November 2025 (Summer intensive) and Friday 22 May 2026 (June intensive): • A copy of your academic transcript (a statement of results is fine) with a short statement highlighting the Indigenous Studies or other Indigenous-related subjects you have completed; • A paragraph explaining why you would like to complete this subject (no more than 300 words); and Students who identify as Indigenous are encouraged to apply for this subject. While we ask that you send through your paragraph outlining your interest in the subject and your transcript, there is no need for a statement outlining your study in Indigenous studies or related subjects."
