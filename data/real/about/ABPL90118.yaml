code: ABPL90118
year: 2027
learn:
  en: "Developing complex buildings like high-rises: structure, enclosure, materials, regulations and environmental design."
  zh: "深化高层等复杂建筑的设计：结构、围护、材料、法规和环境设计。"
  zh-TW: "深化高層等複雜建築的設計：結構、圍護、材料、法規和環境設計。"
  ja: "高層など複雑な建物の設計展開：構造、外皮、材料、法規、環境設計。"
  ko: "고층 등 복잡한 건물 설계 발전: 구조, 외피, 재료, 규정, 환경 설계."
  vi: "Phát triển thiết kế công trình phức tạp như nhà cao tầng: kết cấu, vỏ bao, vật liệu, quy chuẩn và thiết kế môi trường."
  ms: "Membangunkan bangunan kompleks seperti bangunan tinggi: struktur, sampul, bahan, peraturan dan reka bentuk alam sekitar."
  id: "Mengembangkan bangunan kompleks seperti gedung tinggi: struktur, selubung, material, regulasi, dan desain lingkungan."
  hi: "ऊँची इमारतों जैसे जटिल भवनों का विकास: संरचना, आवरण, सामग्री, नियम और पर्यावरणीय डिज़ाइन।"
outcomes:
  - en: "Document large, complex architectural projects"
    zh: "为大型复杂建筑项目编制图纸文件"
    zh-TW: "為大型複雜建築專案編製圖說文件"
    ja: "大規模で複雑な建築プロジェクトを図書化する"
    ko: "대형 복합 건축 프로젝트 도면 작성하기"
    vi: "Lập hồ sơ cho dự án kiến trúc lớn và phức tạp"
    ms: "Mendokumentasikan projek seni bina besar dan kompleks"
    id: "Mendokumentasikan proyek arsitektur besar dan kompleks"
    hi: "बड़ी, जटिल वास्तुकला परियोजनाओं का दस्तावेज़ीकरण"
  - en: "Choose building systems, materials and finishes"
    zh: "选择建筑系统、材料和饰面"
    zh-TW: "選擇建築系統、材料和飾面"
    ja: "建築システム・材料・仕上げを選ぶ"
    ko: "건축 시스템, 재료, 마감 선택하기"
    vi: "Chọn hệ thống, vật liệu và hoàn thiện công trình"
    ms: "Memilih sistem bangunan, bahan dan kemasan"
    id: "Memilih sistem bangunan, material, dan finishing"
    hi: "भवन प्रणालियाँ, सामग्री और फ़िनिश चुनना"
