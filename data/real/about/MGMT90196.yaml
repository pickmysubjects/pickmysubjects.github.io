code: MGMT90196
year: 2027
learn:
  en: "Advanced study of operations: resource planning and control, quality, the people side and operations strategy."
  zh: "运营管理进阶：资源规划与控制、质量、人的因素和运营战略。"
  zh-TW: "營運管理進階：資源規劃與控制、品質、人的因素和營運策略。"
  ja: "オペレーションの発展的学習：資源の計画と管理、品質、人の側面、戦略。"
  ko: "운영관리 심화: 자원 계획과 통제, 품질, 인적 요소, 운영 전략."
  vi: "Quản trị vận hành nâng cao: lập kế hoạch và kiểm soát nguồn lực, chất lượng, con người và chiến lược."
  ms: "Pengurusan operasi lanjutan: perancangan dan kawalan sumber, kualiti, aspek manusia dan strategi."
  id: "Manajemen operasi lanjutan: perencanaan dan pengendalian sumber daya, kualitas, aspek manusia, dan strategi."
  hi: "उन्नत संचालन प्रबंधन: संसाधन योजना व नियंत्रण, गुणवत्ता, मानवीय पहलू और रणनीति।"
outcomes:
  - en: "Explain key decisions in running business processes"
    zh: "解释业务流程管理中的关键决策"
    zh-TW: "解釋業務流程管理中的關鍵決策"
    ja: "業務プロセス運営の主要な判断を説明する"
    ko: "업무 프로세스 운영의 핵심 결정 설명하기"
    vi: "Giải thích các quyết định chính khi vận hành quy trình"
    ms: "Menerangkan keputusan utama dalam proses perniagaan"
    id: "Menjelaskan keputusan utama dalam proses bisnis"
    hi: "व्यावसायिक प्रक्रियाओं के मुख्य निर्णय समझाना"
  - en: "Link operations management to strategy and performance"
    zh: "把运营管理与战略和绩效联系起来"
    zh-TW: "把營運管理與策略和績效連結起來"
    ja: "オペレーションを戦略と業績に結びつける"
    ko: "운영관리를 전략·성과와 연결하기"
    vi: "Liên kết quản trị vận hành với chiến lược và hiệu quả"
    ms: "Mengaitkan operasi dengan strategi dan prestasi"
    id: "Mengaitkan operasi dengan strategi dan kinerja"
    hi: "संचालन को रणनीति और प्रदर्शन से जोड़ना"
  - en: "Analyse resource allocation decisions"
    zh: "分析资源分配决策"
    zh-TW: "分析資源分配決策"
    ja: "資源配分の判断を分析する"
    ko: "자원 배분 결정 분석하기"
    vi: "Phân tích quyết định phân bổ nguồn lực"
    ms: "Menganalisis keputusan peruntukan sumber"
    id: "Menganalisis keputusan alokasi sumber daya"
    hi: "संसाधन आवंटन निर्णयों का विश्लेषण"
