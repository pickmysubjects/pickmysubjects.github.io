code: MGMT90201
year: 2027
learn:
  en: "A hands-on take on entrepreneurship: you develop an idea in an incubator setting, with input from founders."
  zh: "实践型创业课：在孵化器式环境中发展创意，并听取创业者的意见。"
  zh-TW: "實作型創業課：在育成中心式環境中發展構想，並聽取創業者的意見。"
  ja: "実践的な起業の授業：インキュベーター形式でアイデアを育て、起業家の意見も聞く。"
  ko: "실전형 창업 수업: 인큐베이터 환경에서 아이디어를 발전시키고 창업가 조언을 듣는다."
  vi: "Khởi nghiệp thực hành: bạn phát triển ý tưởng trong môi trường vườn ươm, có góp ý từ nhà sáng lập."
  ms: "Keusahawanan secara praktikal: anda membangunkan idea dalam suasana inkubator, dengan input pengasas."
  id: "Kewirausahaan praktis: Anda mengembangkan ide dalam suasana inkubator, dengan masukan dari pendiri."
  hi: "उद्यमिता का व्यावहारिक रूप: आप इनक्यूबेटर जैसे माहौल में संस्थापकों की सलाह के साथ एक विचार विकसित करते हैं।"
outcomes:
  - en: "Spot and develop new opportunities"
    zh: "发现并发展新的机会"
    zh-TW: "發掘並發展新機會"
    ja: "新しい機会を見つけて育てる"
    ko: "새로운 기회 발견·발전시키기"
    vi: "Nhận ra và phát triển cơ hội mới"
    ms: "Mengenal pasti dan membangunkan peluang baharu"
    id: "Menemukan dan mengembangkan peluang baru"
    hi: "नए अवसर पहचानना और विकसित करना"
  - en: "Plan an innovation ready to implement"
    zh: "规划一个可落地的创新方案"
    zh-TW: "規劃一個可落地的創新方案"
    ja: "実行できるイノベーションを計画する"
    ko: "실행 가능한 혁신안 계획하기"
    vi: "Lên kế hoạch đổi mới sẵn sàng triển khai"
    ms: "Merancang inovasi yang sedia dilaksana"
    id: "Merencanakan inovasi yang siap dijalankan"
    hi: "लागू करने लायक नवाचार की योजना बनाना"
