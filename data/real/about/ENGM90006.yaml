code: ENGM90006
year: 2027
learn:
  en: "Engineering contracts and procurement: tendering, estimating, contract terms, administration and risk."
  zh: "工程合同与采购：投标、估价、合同条款、合同管理与风险。"
  zh-TW: "工程合約與採購：投標、估價、合約條款、合約管理與風險。"
  ja: "エンジニアリング契約と調達：入札、積算、契約条件、契約管理、リスク。"
  ko: "엔지니어링 계약과 조달: 입찰, 견적, 계약 조건, 계약 관리, 위험."
  vi: "Hợp đồng và mua sắm kỹ thuật: đấu thầu, dự toán, điều khoản, quản lý hợp đồng, rủi ro."
  ms: "Kontrak dan perolehan kejuruteraan: tender, anggaran, terma kontrak, pentadbiran dan risiko."
  id: "Kontrak dan pengadaan teknik: tender, estimasi, ketentuan kontrak, administrasi, risiko."
  hi: "इंजीनियरिंग अनुबंध और खरीद: टेंडर, लागत अनुमान, अनुबंध शर्तें, प्रशासन और जोखिम।"
outcomes:
  - en: "Price and prepare a tender for engineering work"
    zh: "为工程项目估价并准备投标"
    zh-TW: "為工程項目估價並準備投標"
    ja: "工事の積算と入札書類を作る"
    ko: "엔지니어링 공사 견적과 입찰 준비하기"
    vi: "Dự toán và chuẩn bị hồ sơ thầu cho công trình"
    ms: "Menganggar harga dan menyediakan tender kerja kejuruteraan"
    id: "Menghitung harga dan menyiapkan tender pekerjaan teknik"
    hi: "इंजीनियरिंग काम की लागत आँकना और टेंडर तैयार करना"
  - en: "Administer a contract and handle variations and claims"
    zh: "管理合同执行，处理变更和索赔"
    zh-TW: "管理合約執行，處理變更與求償"
    ja: "契約を管理し、変更や請求に対応する"
    ko: "계약을 관리하고 변경·클레임 처리하기"
    vi: "Quản lý hợp đồng, xử lý thay đổi và khiếu nại"
    ms: "Mentadbir kontrak serta mengurus perubahan dan tuntutan"
    id: "Mengelola kontrak serta menangani perubahan dan klaim"
    hi: "अनुबंध चलाना और बदलाव व दावों को संभालना"
