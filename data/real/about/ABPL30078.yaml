code: ABPL30078
year: 2027
learn:
  en: "Acoustic design in buildings and outdoor spaces: how sound travels, how we hear it, and modelling it to shape design."
  zh: "建筑与户外空间的声学设计：声音如何传播、人如何感知，以及用模拟来指导设计。"
  zh-TW: "建築與戶外空間的聲學設計：聲音如何傳播、人如何感知，以及用模擬來引導設計。"
  ja: "建物と屋外空間の音響設計：音の伝わり方、聞こえ方、そしてモデル化を設計に生かす。"
  ko: "건물과 야외 공간의 음향 설계: 소리의 전파, 인지 방식, 그리고 시뮬레이션을 설계에 활용."
  vi: "Thiết kế âm học cho công trình và không gian ngoài trời: âm thanh lan truyền ra sao, con người cảm nhận thế nào, và mô phỏng để định hướng thiết kế."
  ms: "Reka bentuk akustik bangunan dan ruang luar: cara bunyi merambat, cara kita mendengarnya, dan pemodelan untuk membentuk reka bentuk."
  id: "Desain akustik bangunan dan ruang luar: cara suara merambat, cara kita mendengarnya, dan pemodelan untuk membentuk desain."
  hi: "इमारतों और बाहरी जगहों का ध्वनिक डिज़ाइन: आवाज़ कैसे फैलती है, हम कैसे सुनते हैं, और डिज़ाइन के लिए उसका मॉडल बनाना।"
outcomes:
  - en: "Apply sound propagation to indoor and outdoor design"
    zh: "把声音传播原理用于室内外设计"
    zh-TW: "把聲音傳播原理用於室內外設計"
    ja: "音の伝搬の原理を屋内外の設計に使う"
    ko: "소리 전파 원리를 실내외 설계에 적용하기"
    vi: "Áp dụng nguyên lý lan truyền âm vào thiết kế trong nhà và ngoài trời"
    ms: "Guna prinsip perambatan bunyi dalam reka bentuk dalam dan luar"
    id: "Menerapkan perambatan suara pada desain dalam dan luar ruang"
    hi: "आवाज़ के फैलाव के सिद्धांत अंदरूनी व बाहरी डिज़ाइन में लगाना"
  - en: "Assess acoustics with modelling and simulation"
    zh: "用建模和模拟评估声学性能"
    zh-TW: "用建模和模擬評估聲學性能"
    ja: "モデリングとシミュレーションで音響性能を評価する"
    ko: "모델링과 시뮬레이션으로 음향 성능 평가하기"
    vi: "Đánh giá âm học bằng mô hình hóa và mô phỏng"
    ms: "Menilai akustik dengan pemodelan dan simulasi"
    id: "Menilai akustik dengan pemodelan dan simulasi"
    hi: "मॉडलिंग और सिमुलेशन से ध्वनिक प्रदर्शन आँकना"
  - en: "Plan room acoustics and noise control"
    zh: "规划室内声学和噪声控制"
    zh-TW: "規劃室內聲學和噪音控制"
    ja: "室内音響と騒音対策を計画する"
    ko: "실내 음향과 소음 제어 계획하기"
    vi: "Lên phương án âm học phòng và kiểm soát tiếng ồn"
    ms: "Rancang akustik bilik dan kawalan bunyi bising"
    id: "Merencanakan akustik ruang dan pengendalian bising"
    hi: "कमरे की ध्वनिकी और शोर नियंत्रण की योजना बनाना"
