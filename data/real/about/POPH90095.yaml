code: POPH90095
year: 2027
learn:
  en: "Hands-on economic evaluation: analysing cost and outcome data, decision-tree modelling and common software."
  zh: "实操经济评价：分析成本和结果数据、决策树建模和常用软件。"
  zh-TW: "實作經濟評估：分析成本與結果資料、決策樹建模與常用軟體。"
  ja: "実践的な経済評価。費用と結果のデータ分析、決定木モデル、一般的なソフト。"
  ko: "실습형 경제성 평가: 비용·결과 데이터 분석, 의사결정나무 모델링, 주요 소프트웨어."
  vi: "Thực hành đánh giá kinh tế: phân tích dữ liệu chi phí và kết quả, mô hình cây quyết định và phần mềm phổ biến."
  ms: "Penilaian ekonomi secara praktikal: data kos dan hasil, pemodelan pokok keputusan dan perisian biasa."
  id: "Praktik evaluasi ekonomi: analisis data biaya dan hasil, model pohon keputusan, dan perangkat lunak umum."
  hi: "व्यावहारिक आर्थिक मूल्यांकन: लागत और परिणाम डेटा, निर्णय-वृक्ष मॉडलिंग और आम सॉफ़्टवेयर।"
outcomes:
  - en: "Analyse cost and outcome data"
    zh: "分析成本和结果数据"
    zh-TW: "分析成本與結果資料"
    ja: "費用と結果のデータを分析する"
    ko: "비용·결과 데이터 분석하기"
    vi: "Phân tích dữ liệu chi phí và kết quả"
    ms: "Menganalisis data kos dan hasil"
    id: "Menganalisis data biaya dan hasil"
    hi: "लागत और परिणाम डेटा का विश्लेषण"
  - en: "Build decision-tree models"
    zh: "构建决策树模型"
    zh-TW: "建立決策樹模型"
    ja: "決定木モデルを作る"
    ko: "의사결정나무 모델 만들기"
    vi: "Xây dựng mô hình cây quyết định"
    ms: "Membina model pokok keputusan"
    id: "Membangun model pohon keputusan"
    hi: "निर्णय-वृक्ष मॉडल बनाना"
  - en: "Critically appraise economic studies"
    zh: "批判性评估经济学文献"
    zh-TW: "批判性評估經濟學文獻"
    ja: "経済学の文献を批判的に評価する"
    ko: "경제 연구 비판적으로 평가하기"
    vi: "Thẩm định phản biện các nghiên cứu kinh tế"
    ms: "Menilai secara kritis kajian ekonomi"
    id: "Menilai kritis studi ekonomi"
    hi: "आर्थिक अध्ययनों का आलोचनात्मक मूल्यांकन"
