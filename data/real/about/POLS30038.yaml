code: POLS30038
year: 2026
learn:
  en: "Beginner-friendly stats for democracy research: analysing and charting data, hypothesis tests and regression. No strong maths needed."
  zh: "面向民主研究的入门量化方法：分析和可视化数据、假设检验与回归，无需很强的数学基础。"
  zh-TW: "面向民主研究的入門量化方法：分析和視覺化資料、假設檢定與迴歸，無需很強的數學基礎。"
  ja: "民主主義研究のための入門的な計量手法。データの分析と可視化、仮説検定、回帰分析。高度な数学は不要。"
  ko: "민주주의 연구를 위한 입문 계량 방법. 데이터 분석과 시각화, 가설 검정, 회귀분석. 수학 실력은 크게 필요 없다."
  vi: "Phương pháp định lượng nhập môn cho nghiên cứu dân chủ: phân tích, vẽ biểu đồ dữ liệu, kiểm định giả thuyết và hồi quy."
  ms: "Kaedah kuantitatif mesra pemula untuk kajian demokrasi: analisis dan carta data, ujian hipotesis dan regresi. Tidak perlu matematik kuat."
  id: "Metode kuantitatif ramah pemula untuk riset demokrasi: analisis dan visualisasi data, uji hipotesis dan regresi. Tak perlu matematika kuat."
  hi: "लोकतंत्र शोध के लिए आसान मात्रात्मक तरीके: डेटा का विश्लेषण और चार्ट, परिकल्पना परीक्षण और रिग्रेशन। गहरा गणित ज़रूरी नहीं।"
outcomes:
  - en: "Analyse and visualise data with software"
    zh: "用软件分析和可视化数据"
    zh-TW: "用軟體分析和視覺化資料"
    ja: "ソフトでデータを分析し可視化する"
    ko: "소프트웨어로 데이터 분석하고 시각화하기"
    vi: "Phân tích và trực quan hóa dữ liệu bằng phần mềm"
    ms: "Analisis dan visualkan data dengan perisian"
    id: "Menganalisis dan memvisualkan data dengan perangkat lunak"
    hi: "सॉफ़्टवेयर से डेटा का विश्लेषण और विज़ुअलाइज़ेशन करना"
  - en: "Run hypothesis tests and simple regressions"
    zh: "进行假设检验和简单回归"
    zh-TW: "進行假設檢定和簡單迴歸"
    ja: "仮説検定と簡単な回帰分析を行う"
    ko: "가설 검정과 간단한 회귀분석 하기"
    vi: "Thực hiện kiểm định giả thuyết và hồi quy đơn giản"
    ms: "Jalankan ujian hipotesis dan regresi mudah"
    id: "Menjalankan uji hipotesis dan regresi sederhana"
    hi: "परिकल्पना परीक्षण और सरल रिग्रेशन करना"
  - en: "Judge the quality of quantitative research"
    zh: "评判量化研究的质量"
    zh-TW: "評判量化研究的品質"
    ja: "計量研究の質を見極める"
    ko: "계량 연구의 질 판단하기"
    vi: "Đánh giá chất lượng nghiên cứu định lượng"
    ms: "Nilai kualiti penyelidikan kuantitatif"
    id: "Menilai kualitas riset kuantitatif"
    hi: "मात्रात्मक शोध की गुणवत्ता परखना"
