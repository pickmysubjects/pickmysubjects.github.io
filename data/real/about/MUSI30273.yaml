code: MUSI30273
year: 2026
learn:
  en: "Major capstone: research one issue in music studies (2026: digital musicology with Python) and present it at a student conference."
  zh: "专业毕业项目：研究一个音乐学议题（2026年为用Python做数字音乐学），并在学生会议上展示。"
  zh-TW: "專業畢業專案：研究一個音樂學議題（2026年為用Python做數位音樂學），並在學生研討會上發表。"
  ja: "専攻の総仕上げ。音楽学の一課題を研究し（2026年はPythonを使うデジタル音楽学）、学生会議で発表。"
  ko: "전공 캡스톤: 음악학 주제 하나를 연구하고(2026년은 Python 디지털 음악학) 학생 학회에서 발표."
  vi: "Đồ án cuối ngành: nghiên cứu một vấn đề âm nhạc học (2026: âm nhạc học số với Python), trình bày tại hội nghị."
  ms: "Projek akhir: kaji satu isu muzikologi (2026: muzikologi digital dengan Python) dan bentang di persidangan."
  id: "Capstone jurusan: meneliti satu isu musikologi (2026: musikologi digital dengan Python), dipresentasikan di konferensi."
  hi: "कैपस्टोन: संगीत अध्ययन का एक मुद्दा शोधना (2026: Python से डिजिटल संगीतशास्त्र), सम्मेलन में प्रस्तुत करना।"
outcomes:
  - en: "Frame and answer a research question"
    zh: "提出并回答研究问题"
    zh-TW: "提出並回答研究問題"
    ja: "研究課題を立てて答える"
    ko: "연구 질문을 세우고 답하기"
    vi: "Đặt và trả lời câu hỏi nghiên cứu"
    ms: "Bentuk dan jawab soalan kajian"
    id: "Merumuskan dan menjawab pertanyaan riset"
    hi: "शोध प्रश्न बनाना और उत्तर देना"
  - en: "Work with music metadata"
    zh: "处理和分析音乐元数据"
    zh-TW: "處理與分析音樂後設資料"
    ja: "音楽のメタデータを扱う"
    ko: "음악 메타데이터 다루기"
    vi: "Xử lý siêu dữ liệu âm nhạc"
    ms: "Kendalikan metadata muzik"
    id: "Mengolah metadata musik"
    hi: "संगीत मेटाडेटा के साथ काम"
  - en: "Present research to a public audience"
    zh: "向公众展示研究成果"
    zh-TW: "向大眾發表研究成果"
    ja: "研究を一般向けに発表する"
    ko: "대중에게 연구 발표하기"
    vi: "Trình bày nghiên cứu trước công chúng"
    ms: "Bentang kajian kepada umum"
    id: "Mempresentasikan riset ke publik"
    hi: "जनता के सामने शोध प्रस्तुत करना"
