code: NUTR30002
year: 2026
learn:
  en: "Measuring what people eat, food composition, dietary guidelines and Australian food law."
  zh: "如何测量人们吃了什么、食物成分、膳食指南和澳洲食品法规。"
  zh-TW: "如何測量人們吃了什麼、食物成分、膳食指南與澳洲食品法規。"
  ja: "食事摂取量の測定、食品成分、食事ガイドライン、豪州の食品法。"
  ko: "섭취량 측정, 식품 성분, 식이 지침, 호주 식품법."
  vi: "Đo lường lượng ăn uống, thành phần thực phẩm, hướng dẫn dinh dưỡng và luật thực phẩm Úc."
  ms: "Mengukur pengambilan makanan, komposisi makanan, garis panduan diet dan undang-undang makanan Australia."
  id: "Mengukur asupan makanan, komposisi pangan, pedoman gizi dan hukum pangan Australia."
  hi: "लोग क्या खाते हैं उसे मापना, खाद्य संरचना, आहार दिशानिर्देश और ऑस्ट्रेलियाई खाद्य कानून।"
