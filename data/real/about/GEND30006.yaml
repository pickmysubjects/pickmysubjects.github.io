code: GEND30006
year: 2026
learn:
  en: "How trauma is felt, remembered and told, and whose memories get believed, from psychoanalysis to cultural politics."
  zh: "创伤如何被感受、记忆和讲述，谁的记忆被相信，从精神分析到文化政治。"
  zh-TW: "創傷如何被感受、記憶和講述，誰的記憶被相信，從精神分析到文化政治。"
  ja: "精神分析から文化の政治まで、トラウマがどう感じられ記憶され語られ、誰の記憶が信じられるかを学ぶ。"
  ko: "정신분석부터 문화 정치까지, 트라우마가 어떻게 느껴지고 기억되고 이야기되며 누구의 기억이 믿어지는지 배운다."
  vi: "Chấn thương được cảm nhận, ghi nhớ và kể lại ra sao, ký ức của ai được tin, từ phân tâm học đến chính trị văn hóa."
  ms: "Cara trauma dirasai, diingati dan diceritakan, dan ingatan siapa yang dipercayai, daripada psikoanalisis hingga politik budaya."
  id: "Cara trauma dirasakan, diingat, dan diceritakan, serta ingatan siapa yang dipercaya, dari psikoanalisis hingga politik budaya."
  hi: "आघात कैसे महसूस, याद और बयान किया जाता है, और किसकी यादों पर भरोसा होता है, मनोविश्लेषण से सांस्कृतिक राजनीति तक।"
outcomes:
  - en: "Trace the history of the idea of trauma"
    zh: "梳理“创伤”概念的历史"
    zh-TW: "梳理「創傷」概念的歷史"
    ja: "トラウマという概念の歴史をたどる"
    ko: "트라우마 개념의 역사 따라가기"
    vi: "Lần theo lịch sử khái niệm chấn thương"
    ms: "Jejaki sejarah konsep trauma"
    id: "Menelusuri sejarah konsep trauma"
    hi: "आघात की अवधारणा का इतिहास समझना"
  - en: "Analyse how gender and race shape memory"
    zh: "分析性别与种族如何影响记忆"
    zh-TW: "分析性別與種族如何影響記憶"
    ja: "ジェンダーと人種が記憶をどう形づくるか分析する"
    ko: "젠더와 인종이 기억을 만드는 방식 분석하기"
    vi: "Phân tích giới và chủng tộc định hình ký ức ra sao"
    ms: "Analisis cara gender dan kaum membentuk ingatan"
    id: "Menganalisis cara gender dan ras membentuk ingatan"
    hi: "जेंडर और नस्ल स्मृति को कैसे गढ़ते हैं, विश्लेषण करना"
  - en: "Assess ways of representing traumatic events"
    zh: "评估呈现创伤事件的方式"
    zh-TW: "評估呈現創傷事件的方式"
    ja: "トラウマ的な出来事の表し方を評価する"
    ko: "트라우마 사건을 재현하는 방식 평가하기"
    vi: "Đánh giá cách thể hiện các sự kiện chấn thương"
    ms: "Nilai cara menggambarkan peristiwa traumatik"
    id: "Menilai cara merepresentasikan peristiwa traumatis"
    hi: "आघातपूर्ण घटनाओं को दर्शाने के तरीकों का आकलन करना"
