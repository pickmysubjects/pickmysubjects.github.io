code: AHIS20011
year: 2026
learn:
  en: "Art in Renaissance Europe from 1300 to 1600, especially Italy, France and Spain, from artists' lives to the birth of museums."
  zh: "1300至1600年欧洲文艺复兴艺术，尤其是意大利、法国和西班牙，从艺术家生平到博物馆的诞生。"
  zh-TW: "1300至1600年歐洲文藝復興藝術，尤其是義大利、法國和西班牙，從藝術家生平到博物館的誕生。"
  ja: "1300〜1600年のルネサンス期ヨーロッパ美術。特に伊・仏・西を中心に、画家の生涯から美術館の誕生まで。"
  ko: "1300~1600년 르네상스 유럽 미술. 특히 이탈리아·프랑스·스페인을 중심으로 화가의 삶부터 박물관의 탄생까지."
  vi: "Nghệ thuật Phục hưng châu Âu 1300–1600, nhất là Ý, Pháp, Tây Ban Nha, từ cuộc đời nghệ sĩ đến sự ra đời của bảo tàng."
  ms: "Seni Renaissance Eropah 1300 hingga 1600, terutama Itali, Perancis dan Sepanyol, dari kehidupan artis hingga lahirnya muzium."
  id: "Seni Renaisans Eropa 1300–1600, terutama Italia, Prancis dan Spanyol, dari kehidupan seniman sampai lahirnya museum."
  hi: "1300 से 1600 तक पुनर्जागरण यूरोप की कला, ख़ासकर इटली, फ़्रांस और स्पेन, कलाकारों के जीवन से संग्रहालयों के जन्म तक।"
outcomes:
  - en: "Describe key Renaissance artists and works"
    zh: "介绍文艺复兴的重要艺术家和作品"
    zh-TW: "介紹文藝復興的重要藝術家和作品"
    ja: "ルネサンスの主な画家と作品を説明する"
    ko: "르네상스의 주요 화가와 작품 설명하기"
    vi: "Mô tả các nghệ sĩ và tác phẩm Phục hưng chính"
    ms: "Huraikan artis dan karya Renaissance utama"
    id: "Menguraikan seniman dan karya Renaisans utama"
    hi: "पुनर्जागरण के मुख्य कलाकारों और कृतियों का वर्णन करना"
  - en: "Explain the rise of art theory and collecting"
    zh: "说明艺术理论和收藏的兴起"
    zh-TW: "說明藝術理論和收藏的興起"
    ja: "美術理論と収集の始まりを説明する"
    ko: "미술 이론과 수집의 등장 설명하기"
    vi: "Giải thích sự ra đời của lý luận nghệ thuật và sưu tầm"
    ms: "Terangkan kemunculan teori seni dan pengumpulan"
    id: "Menjelaskan munculnya teori seni dan koleksi"
    hi: "कला सिद्धांत और संग्रह के उदय को समझाना"
  - en: "Analyse artworks using period sources"
    zh: "运用当时的史料分析艺术品"
    zh-TW: "運用當時的史料分析藝術品"
    ja: "当時の資料を使って作品を分析する"
    ko: "당대 자료로 작품 분석하기"
    vi: "Phân tích tác phẩm bằng nguồn tư liệu đương thời"
    ms: "Analisis karya seni menggunakan sumber zaman itu"
    id: "Menganalisis karya seni memakai sumber sezaman"
    hi: "उस दौर के स्रोतों से कलाकृतियों का विश्लेषण करना"
