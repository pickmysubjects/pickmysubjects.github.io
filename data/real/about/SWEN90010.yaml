code: SWEN90010
year: 2027
learn:
  en: "How to build dependable systems where safety, security and reliability are critical, including formal checks."
  zh: "如何构建对安全、保密与可靠性要求极高的系统，包括形式化验证。"
  zh-TW: "如何建構對安全、保密與可靠性要求極高的系統，包括形式化驗證。"
  ja: "安全性・セキュリティ・信頼性が重要なシステムの作り方。形式的検証も含む。"
  ko: "안전·보안·신뢰성이 중요한 시스템을 만드는 방법, 정형 검증 포함."
  vi: "Cách xây dựng hệ thống đáng tin cậy khi an toàn, bảo mật, độ tin cậy là then chốt, kể cả kiểm chứng hình thức."
  ms: "Cara membina sistem boleh harap yang kritikal dari segi keselamatan dan kebolehpercayaan, termasuk semakan formal."
  id: "Cara membangun sistem andal yang kritis keselamatan dan keamanan, termasuk verifikasi formal."
  hi: "ऐसे सिस्टम बनाना जिनमें सुरक्षा और विश्वसनीयता सबसे ज़रूरी हो, औपचारिक जाँच समेत।"
outcomes:
  - en: "Analyse safety risks in a critical system"
    zh: "分析关键系统中的安全风险"
    zh-TW: "分析關鍵系統中的安全風險"
    ja: "重要システムの安全リスクを分析する"
    ko: "핵심 시스템의 안전 위험 분석하기"
    vi: "Phân tích rủi ro an toàn trong hệ thống quan trọng"
    ms: "Menganalisis risiko keselamatan dalam sistem kritikal"
    id: "Menganalisis risiko keselamatan pada sistem kritis"
    hi: "महत्वपूर्ण सिस्टम में सुरक्षा जोखिम का विश्लेषण करना"
  - en: "Use contracts and static checks to verify code"
    zh: "用契约式设计和静态验证检查代码"
    zh-TW: "用契約式設計與靜態驗證檢查程式碼"
    ja: "契約による設計と静的検証でコードを確かめる"
    ko: "계약 기반 설계와 정적 검증으로 코드 확인하기"
    vi: "Dùng hợp đồng và kiểm tra tĩnh để kiểm chứng mã"
    ms: "Menggunakan kontrak dan semakan statik untuk mengesahkan kod"
    id: "Memakai kontrak dan pemeriksaan statis untuk verifikasi kode"
    hi: "कॉन्ट्रैक्ट और स्टैटिक जाँच से कोड सत्यापित करना"
