code: SOCI20022
year: 2026
learn:
  en: "A sociological look at health and illness: who gets sick, what being ill is like, and how people deal with medicine."
  zh: "从社会学看健康与疾病：谁容易生病、患病的经历，以及人们如何面对医疗体系。"
  zh-TW: "從社會學看健康與疾病：誰容易生病、患病的經歷，以及人們如何面對醫療體系。"
  ja: "健康と病気を社会学から見る。誰が病気になるか、病の経験、医療との関わりを学ぶ。"
  ko: "건강과 질병을 사회학적으로 본다. 누가 아프고, 아픔은 어떤 경험이며, 의료와 어떻게 만나는지 배운다."
  vi: "Góc nhìn xã hội học về sức khỏe và bệnh tật: ai dễ ốm, trải nghiệm bệnh ra sao và con người tiếp cận y tế thế nào."
  ms: "Pandangan sosiologi tentang kesihatan dan penyakit: siapa jatuh sakit, pengalaman sakit dan cara orang berdepan dengan perubatan."
  id: "Pandangan sosiologis tentang kesehatan dan penyakit: siapa yang sakit, pengalaman sakit, dan cara orang berurusan dengan layanan medis."
  hi: "स्वास्थ्य और बीमारी पर समाजशास्त्रीय नज़र: कौन बीमार पड़ता है, बीमारी का अनुभव कैसा है, और लोग चिकित्सा से कैसे जुड़ते हैं।"
outcomes:
  - en: "Explain how social factors shape health"
    zh: "说明社会因素如何影响健康"
    zh-TW: "說明社會因素如何影響健康"
    ja: "社会的要因が健康にどう影響するか説明する"
    ko: "사회적 요인이 건강에 미치는 영향 설명하기"
    vi: "Giải thích các yếu tố xã hội ảnh hưởng sức khỏe ra sao"
    ms: "Terangkan cara faktor sosial membentuk kesihatan"
    id: "Menjelaskan cara faktor sosial membentuk kesehatan"
    hi: "सामाजिक कारक स्वास्थ्य को कैसे प्रभावित करते हैं, समझाना"
  - en: "Analyse debates such as vaccine hesitancy"
    zh: "分析疫苗犹豫等争议"
    zh-TW: "分析疫苗猶豫等爭議"
    ja: "ワクチン忌避などの論争を分析する"
    ko: "백신 망설임 같은 논쟁 분석하기"
    vi: "Phân tích các tranh luận như sự ngần ngại tiêm vắc-xin"
    ms: "Analisis perdebatan seperti keraguan vaksin"
    id: "Menganalisis perdebatan seperti keraguan vaksin"
    hi: "टीका हिचकिचाहट जैसी बहसों का विश्लेषण करना"
  - en: "Apply sociological concepts to illness experiences"
    zh: "用社会学概念分析患病经历"
    zh-TW: "用社會學概念分析患病經歷"
    ja: "社会学の概念を病の経験に当てはめる"
    ko: "사회학 개념을 질병 경험에 적용하기"
    vi: "Áp dụng khái niệm xã hội học vào trải nghiệm bệnh tật"
    ms: "Gunakan konsep sosiologi pada pengalaman sakit"
    id: "Menerapkan konsep sosiologi pada pengalaman sakit"
    hi: "बीमारी के अनुभवों पर समाजशास्त्रीय अवधारणाएं लागू करना"
