code: EVSC30009
year: 2026
learn:
  en: "What it takes to move the energy system to net-zero, and how to judge different transition pathways."
  zh: "能源系统如何走向净零排放，以及如何评判不同的转型路径。"
  zh-TW: "能源系統如何走向淨零排放，以及如何評判不同的轉型路徑。"
  ja: "エネルギーシステムをネットゼロへ移すには何が必要か、移行経路をどう評価するか。"
  ko: "에너지 시스템을 넷제로로 전환하는 데 필요한 것과 전환 경로 평가법."
  vi: "Cần gì để đưa hệ thống năng lượng về net-zero, và cách đánh giá các lộ trình chuyển đổi."
  ms: "Apa yang diperlukan untuk bawa sistem tenaga ke sifar bersih, dan cara menilai laluan peralihan."
  id: "Apa yang dibutuhkan untuk membawa sistem energi ke net-zero, dan cara menilai jalur transisinya."
  hi: "ऊर्जा प्रणाली को नेट-ज़ीरो तक ले जाने में क्या लगता है, और ट्रांज़िशन रास्तों को कैसे परखें।"
outcomes:
  - en: "Critique energy transition pathways"
    zh: "评析能源转型路径"
    zh-TW: "評析能源轉型路徑"
    ja: "エネルギー移行経路を批判的に検討する"
    ko: "에너지 전환 경로를 비판적으로 검토한다"
    vi: "Phản biện các lộ trình chuyển đổi năng lượng"
    ms: "Kritik laluan peralihan tenaga"
    id: "Mengkritisi jalur transisi energi"
    hi: "ऊर्जा ट्रांज़िशन रास्तों की समीक्षा"
  - en: "Identify what must change to reach net-zero"
    zh: "找出实现净零需改变的环节"
    zh-TW: "找出達成淨零需改變的環節"
    ja: "ネットゼロに向け変えるべき点を特定する"
    ko: "넷제로를 위해 바꿀 요소를 찾는다"
    vi: "Xác định điều cần thay đổi để đạt net-zero"
    ms: "Kenal pasti perubahan untuk capai sifar bersih"
    id: "Mengenali hal yang harus berubah demi net-zero"
    hi: "नेट-ज़ीरो के लिए क्या बदलना है, पहचानना"
