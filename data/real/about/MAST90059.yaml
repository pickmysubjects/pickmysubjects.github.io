code: MAST90059
year: 2027
learn:
  en: "Stochastic calculus, integrating with respect to random processes, and its use in pricing financial derivatives."
  zh: "随机微积分（对随机过程积分）及其在金融衍生品定价中的应用。"
  zh-TW: "隨機微積分（對隨機過程積分）及其在金融衍生性商品定價中的應用。"
  ja: "確率過程に関する積分（確率解析）と金融派生商品の価格付けへの応用。"
  ko: "확률미적분(확률과정에 대한 적분)과 금융 파생상품 가격결정 응용."
  vi: "Giải tích ngẫu nhiên (tích phân theo quá trình ngẫu nhiên) và ứng dụng định giá phái sinh."
  ms: "Kalkulus stokastik, pengamiran terhadap proses rawak, dan penggunaannya dalam harga derivatif kewangan."
  id: "Kalkulus stokastik, integrasi terhadap proses acak, dan penggunaannya untuk harga derivatif."
  hi: "स्टोकेस्टिक कैलकुलस, रैंडम प्रक्रियाओं पर इंटीग्रेशन, और डेरिवेटिव मूल्य निर्धारण में उपयोग।"
outcomes:
  - en: "Use Itô calculus to work with random processes"
    zh: "用伊藤微积分处理随机过程"
    zh-TW: "用伊藤微積分處理隨機過程"
    ja: "伊藤解析で確率過程を扱う"
    ko: "이토 미적분으로 확률과정 다루기"
    vi: "Dùng giải tích Itô với quá trình ngẫu nhiên"
    ms: "Menggunakan kalkulus Itô untuk proses rawak"
    id: "Memakai kalkulus Itô untuk proses acak"
    hi: "इटो कैलकुलस से रैंडम प्रक्रियाओं पर काम करना"
  - en: "Apply the theory to price financial derivatives"
    zh: "将理论用于金融衍生品定价"
    zh-TW: "將理論用於衍生性商品定價"
    ja: "理論を派生商品の価格付けに使う"
    ko: "이론을 파생상품 가격결정에 적용하기"
    vi: "Áp dụng lý thuyết để định giá phái sinh"
    ms: "Mengaplikasi teori untuk menilai harga derivatif"
    id: "Menerapkan teori untuk harga derivatif"
    hi: "सिद्धांत से डेरिवेटिव की कीमत निकालना"
