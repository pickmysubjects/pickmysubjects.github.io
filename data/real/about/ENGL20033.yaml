code: ENGL20033
year: 2026
learn:
  en: "How Shakespeare's plays move from page to stage, film and TV, in Western and non-Western settings."
  zh: "莎士比亚剧作如何从文本走向舞台、电影和电视，包括西方和非西方的演绎。"
  zh-TW: "莎士比亞劇作如何從文本走向舞台、電影和電視，包括西方和非西方的演繹。"
  ja: "シェイクスピア劇が紙面から舞台・映画・テレビへどう移るか、西洋と非西洋の上演を見る。"
  ko: "셰익스피어 희곡이 지면에서 무대·영화·TV로 옮겨 가는 방식을 서구와 비서구 사례로 본다."
  vi: "Kịch Shakespeare đi từ trang giấy lên sân khấu, điện ảnh và truyền hình ra sao, ở cả phương Tây và ngoài phương Tây."
  ms: "Bagaimana drama Shakespeare bergerak dari halaman ke pentas, filem dan TV, dalam latar Barat dan bukan Barat."
  id: "Bagaimana lakon Shakespeare berpindah dari halaman ke panggung, film dan TV, di latar Barat dan non-Barat."
  hi: "शेक्सपियर के नाटक पन्ने से मंच, फ़िल्म और टीवी तक कैसे पहुंचते हैं, पश्चिमी और गैर-पश्चिमी संदर्भों में।"
outcomes:
  - en: "Analyse Shakespeare's plays as texts"
    zh: "把莎士比亚剧作作为文本分析"
    zh-TW: "把莎士比亞劇作作為文本分析"
    ja: "シェイクスピア劇をテキストとして分析する"
    ko: "셰익스피어 희곡을 텍스트로 분석하기"
    vi: "Phân tích kịch Shakespeare như văn bản"
    ms: "Analisis drama Shakespeare sebagai teks"
    id: "Menganalisis lakon Shakespeare sebagai teks"
    hi: "शेक्सपियर के नाटकों का पाठ के रूप में विश्लेषण करना"
  - en: "Compare stage and screen adaptations"
    zh: "比较舞台和影视改编"
    zh-TW: "比較舞台和影視改編"
    ja: "舞台版と映像版の翻案を比べる"
    ko: "무대와 영상 각색 비교하기"
    vi: "So sánh các bản chuyển thể sân khấu và màn ảnh"
    ms: "Bandingkan adaptasi pentas dan layar"
    id: "Membandingkan adaptasi panggung dan layar"
    hi: "मंच और स्क्रीन रूपांतरणों की तुलना करना"
  - en: "Discuss power and culture in Shakespeare"
    zh: "讨论莎士比亚作品中的权力与文化"
    zh-TW: "討論莎士比亞作品中的權力與文化"
    ja: "シェイクスピアにおける権力と文化を論じる"
    ko: "셰익스피어 속 권력과 문화 논의하기"
    vi: "Thảo luận quyền lực và văn hóa trong Shakespeare"
    ms: "Bincangkan kuasa dan budaya dalam Shakespeare"
    id: "Membahas kekuasaan dan budaya dalam Shakespeare"
    hi: "शेक्सपियर में सत्ता और संस्कृति पर चर्चा करना"
