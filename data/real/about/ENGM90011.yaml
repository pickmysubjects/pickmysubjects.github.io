code: ENGM90011
year: 2027
learn:
  en: "Economics for engineers: markets, costs, production limits, financial statements and project evaluation."
  zh: "面向工程师的经济学：市场、成本、生产约束、财务报表与项目评估。"
  zh-TW: "給工程師的經濟學：市場、成本、生產限制、財務報表與專案評估。"
  ja: "エンジニアのための経済学：市場、コスト、生産制約、財務諸表、プロジェクト評価。"
  ko: "엔지니어를 위한 경제학: 시장, 비용, 생산 제약, 재무제표, 프로젝트 평가."
  vi: "Kinh tế cho kỹ sư: thị trường, chi phí, giới hạn sản xuất, báo cáo tài chính, đánh giá dự án."
  ms: "Ekonomi untuk jurutera: pasaran, kos, had pengeluaran, penyata kewangan dan penilaian projek."
  id: "Ekonomi untuk insinyur: pasar, biaya, batasan produksi, laporan keuangan, evaluasi proyek."
  hi: "इंजीनियरों के लिए अर्थशास्त्र: बाज़ार, लागत, उत्पादन सीमाएँ, वित्तीय विवरण, प्रोजेक्ट मूल्यांकन।"
outcomes:
  - en: "Compare project options on cost and value"
    zh: "从成本和价值上比较项目方案"
    zh-TW: "從成本與價值比較專案方案"
    ja: "コストと価値でプロジェクト案を比べる"
    ko: "비용과 가치로 프로젝트 대안 비교하기"
    vi: "So sánh phương án dự án theo chi phí và giá trị"
    ms: "Membandingkan pilihan projek dari segi kos dan nilai"
    id: "Membandingkan opsi proyek dari sisi biaya dan nilai"
    hi: "लागत और मूल्य के आधार पर प्रोजेक्ट विकल्पों की तुलना करना"
  - en: "Read financial figures to judge how a firm is doing"
    zh: "读懂财务数据，判断企业经营状况"
    zh-TW: "讀懂財務數據，判斷企業經營狀況"
    ja: "財務数値から企業の状態を判断する"
    ko: "재무 수치로 기업 상태 판단하기"
    vi: "Đọc số liệu tài chính để đánh giá doanh nghiệp"
    ms: "Membaca angka kewangan untuk menilai prestasi syarikat"
    id: "Membaca angka keuangan untuk menilai kinerja perusahaan"
    hi: "वित्तीय आँकड़ों से कंपनी की स्थिति आँकना"
