code: ABPL30051
year: 2026
learn:
  en: "Ways to map and read a city's form: figure-ground, density, streets, public space and use, to inform urban design."
  zh: "绘制与解读城市形态的方法：图底关系、密度、街道、公共空间与使用，用于城市设计。"
  zh-TW: "繪製與解讀城市形態的方法：圖底關係、密度、街道、公共空間與使用，用於都市設計。"
  ja: "都市の形を地図化し読む方法：図と地、密度、街路、公共空間と利用を都市デザインに生かす。"
  ko: "도시 형태를 지도화하고 읽는 법: 도-지, 밀도, 가로, 공공공간과 이용을 도시설계에 활용."
  vi: "Cách lập bản đồ và đọc hình thái đô thị: hình-nền, mật độ, đường phố, không gian công cộng cho thiết kế."
  ms: "Cara memeta dan membaca bentuk bandar: rajah-latar, kepadatan, jalan, ruang awam dan guna, untuk reka bandar."
  id: "Cara memetakan dan membaca bentuk kota: figur-latar, kepadatan, jalan, ruang publik, untuk desain kota."
  hi: "शहर के रूप को मैप करने-पढ़ने के तरीक़े: फ़िगर-ग्राउंड, घनत्व, सड़कें, सार्वजनिक स्पेस, अर्बन डिज़ाइन के लिए।"
outcomes:
  - en: "Map layers of a city's form and use"
    zh: "绘制城市形态与使用的各层地图"
    zh-TW: "繪製城市形態與使用的各層地圖"
    ja: "都市の形と利用を層ごとに地図化する"
    ko: "도시 형태와 이용을 층별로 지도화하기"
    vi: "Lập bản đồ các lớp hình thái và sử dụng đô thị"
    ms: "Petakan lapisan bentuk dan guna bandar"
    id: "Memetakan lapisan bentuk dan fungsi kota"
    hi: "शहर के रूप और उपयोग की परतें मैप करना"
  - en: "Read patterns from urban maps"
    zh: "从城市地图中读出规律"
    zh-TW: "從城市地圖中讀出規律"
    ja: "都市地図からパターンを読む"
    ko: "도시 지도에서 패턴 읽기"
    vi: "Đọc quy luật từ bản đồ đô thị"
    ms: "Baca corak daripada peta bandar"
    id: "Membaca pola dari peta kota"
    hi: "शहरी नक्शों से पैटर्न पढ़ना"
  - en: "Use mapping to support a design idea"
    zh: "用地图分析支撑设计构想"
    zh-TW: "用地圖分析支撐設計構想"
    ja: "地図分析を設計案に生かす"
    ko: "지도 분석으로 설계 아이디어 뒷받침하기"
    vi: "Dùng bản đồ để hỗ trợ ý tưởng thiết kế"
    ms: "Guna pemetaan untuk menyokong idea reka bentuk"
    id: "Memakai pemetaan untuk mendukung ide desain"
    hi: "डिज़ाइन विचार के समर्थन में मैपिंग इस्तेमाल करना"
