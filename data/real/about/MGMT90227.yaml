code: MGMT90227
year: 2027
learn:
  en: "Designing and running an entrepreneurial firm from launch to maturity: structure, leadership, culture and talent."
  zh: "从创立到成熟，设计和经营创业型企业：结构、领导力、文化与人才。"
  zh-TW: "從創立到成熟，設計與經營創業型企業：結構、領導力、文化與人才。"
  ja: "創業から成熟まで、起業的な組織の設計と運営：組織構造、リーダーシップ、文化、人材。"
  ko: "창업부터 성숙기까지 기업가적 조직의 설계와 운영: 구조, 리더십, 문화, 인재."
  vi: "Thiết kế và vận hành doanh nghiệp khởi nghiệp từ lúc ra đời đến trưởng thành: cơ cấu, lãnh đạo, văn hóa, nhân tài."
  ms: "Mereka bentuk dan mengurus firma keusahawanan dari pelancaran hingga matang: struktur, kepimpinan, budaya dan bakat."
  id: "Merancang dan menjalankan perusahaan wirausaha dari awal hingga matang: struktur, kepemimpinan, budaya, dan talenta."
  hi: "शुरुआत से परिपक्वता तक उद्यमी संगठन बनाना और चलाना: ढाँचा, नेतृत्व, संस्कृति और प्रतिभा।"
outcomes:
  - en: "Plan a design to grow entrepreneurship in a firm"
    zh: "制定提升组织创业精神的方案"
    zh-TW: "制定提升組織創業精神的方案"
    ja: "組織の起業家精神を高める計画を立てる"
    ko: "조직의 기업가 정신을 키우는 계획 세우기"
    vi: "Lập kế hoạch thúc đẩy tinh thần khởi nghiệp trong tổ chức"
    ms: "Merancang reka bentuk untuk memupuk keusahawanan dalam firma"
    id: "Merancang desain untuk menumbuhkan kewirausahaan di perusahaan"
    hi: "संगठन में उद्यमिता बढ़ाने की योजना बनाना"
  - en: "Explain how leadership, structure and culture shape it"
    zh: "解释领导力、结构和文化的影响"
    zh-TW: "解釋領導力、結構與文化的影響"
    ja: "リーダーシップ・構造・文化の影響を説明する"
    ko: "리더십, 구조, 문화의 영향 설명하기"
    vi: "Giải thích vai trò của lãnh đạo, cơ cấu và văn hóa"
    ms: "Menerangkan peranan kepimpinan, struktur dan budaya"
    id: "Menjelaskan peran kepemimpinan, struktur, dan budaya"
    hi: "नेतृत्व, ढाँचे और संस्कृति की भूमिका समझाना"
  - en: "Evaluate ways to attract and keep entrepreneurial people"
    zh: "评估吸引和留住创业型人才的做法"
    zh-TW: "評估吸引與留住創業型人才的做法"
    ja: "起業家的な人材を惹きつけ定着させる方法を評価する"
    ko: "기업가적 인재를 유치하고 유지하는 방법 평가하기"
    vi: "Đánh giá cách thu hút và giữ chân người có tinh thần khởi nghiệp"
    ms: "Menilai cara menarik dan mengekalkan individu berjiwa usahawan"
    id: "Menilai cara menarik dan mempertahankan orang berjiwa wirausaha"
    hi: "उद्यमी लोगों को आकर्षित करने और रोकने के तरीके आँकना"
