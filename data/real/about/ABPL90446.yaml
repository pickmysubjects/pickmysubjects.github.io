code: ABPL90446
year: 2027
learn:
  en: "How the built environment affects food security, and how design can improve it locally, with partner schools worldwide."
  zh: "建成环境如何影响粮食安全，以及设计如何在本地改善它，并与海外院校合作。"
  zh-TW: "建成環境如何影響糧食安全，以及設計如何在在地改善它，並與海外院校合作。"
  ja: "建築環境が食料安全保障に与える影響と、設計で地域から改善する方法を海外校と学ぶ。"
  ko: "건조 환경이 식량 안보에 미치는 영향과 설계로 지역에서 개선하는 법을 해외 학교와 배웁니다."
  vi: "Môi trường xây dựng ảnh hưởng an ninh lương thực ra sao và thiết kế cải thiện tại chỗ thế nào."
  ms: "Kesan persekitaran binaan pada keselamatan makanan dan cara reka bentuk memperbaikinya."
  id: "Pengaruh lingkungan binaan pada ketahanan pangan dan cara desain memperbaikinya secara lokal."
  hi: "निर्मित पर्यावरण खाद्य सुरक्षा को कैसे प्रभावित करता है और डिज़ाइन उसे स्थानीय स्तर पर कैसे सुधारे।"
outcomes:
  - en: "Explain food security and the built environment"
    zh: "解释粮食安全与建成环境的关系"
    zh-TW: "解釋糧食安全與建成環境的關係"
    ja: "食料安全保障と建築環境を説明する"
    ko: "식량 안보와 건조 환경 설명하기"
    vi: "Giải thích an ninh lương thực và môi trường xây dựng"
    ms: "Menerangkan keselamatan makanan dan persekitaran binaan"
    id: "Menjelaskan ketahanan pangan dan lingkungan binaan"
    hi: "खाद्य सुरक्षा और निर्मित पर्यावरण समझाना"
  - en: "Design for food security"
    zh: "为粮食安全做设计"
    zh-TW: "為糧食安全做設計"
    ja: "食料安全保障のために設計する"
    ko: "식량 안보를 위한 설계하기"
    vi: "Thiết kế vì an ninh lương thực"
    ms: "Mereka untuk keselamatan makanan"
    id: "Mendesain untuk ketahanan pangan"
    hi: "खाद्य सुरक्षा के लिए डिज़ाइन"
