code: MAST90103
year: 2027
learn:
  en: "Random matrix theory from several angles, linking linear algebra, probability and analysis, with uses across science."
  zh: "从多个角度学习随机矩阵理论，结合线性代数、概率与分析，并了解其应用。"
  zh-TW: "從多個角度學習隨機矩陣理論，結合線性代數、機率與分析，並了解其應用。"
  ja: "線形代数・確率・解析を結ぶランダム行列理論を多角的に学び、応用も知る。"
  ko: "선형대수·확률·해석을 잇는 랜덤 행렬 이론을 여러 관점에서 배우고 응용 알기."
  vi: "Lý thuyết ma trận ngẫu nhiên từ nhiều góc độ, nối đại số tuyến tính, xác suất, giải tích và ứng dụng."
  ms: "Teori matriks rawak dari pelbagai sudut, menghubungkan aljabar linear, kebarangkalian dan analisis."
  id: "Teori matriks acak dari berbagai sudut, menghubungkan aljabar linear, probabilitas, dan analisis."
  hi: "रैंडम मैट्रिक्स सिद्धांत कई नज़रियों से, रैखिक बीजगणित, प्रायिकता और विश्लेषण को जोड़ते हुए।"
outcomes:
  - en: "Work with classic random matrix ensembles"
    zh: "处理经典随机矩阵系综"
    zh-TW: "處理經典隨機矩陣系綜"
    ja: "代表的なランダム行列アンサンブルを扱う"
    ko: "대표적인 랜덤 행렬 앙상블 다루기"
    vi: "Làm việc với các họ ma trận ngẫu nhiên kinh điển"
    ms: "Bekerja dengan ensembel matriks rawak klasik"
    id: "Bekerja dengan ensemble matriks acak klasik"
    hi: "क्लासिक रैंडम मैट्रिक्स एन्सेम्बल पर काम करना"
  - en: "Connect the theory to applications in other fields"
    zh: "把理论与其他领域的应用联系起来"
    zh-TW: "將理論與其他領域的應用連結"
    ja: "理論を他分野の応用と結びつける"
    ko: "이론을 다른 분야 응용과 연결하기"
    vi: "Liên hệ lý thuyết với ứng dụng ở lĩnh vực khác"
    ms: "Menghubungkan teori dengan aplikasi bidang lain"
    id: "Menghubungkan teori dengan penerapan di bidang lain"
    hi: "सिद्धांत को दूसरे क्षेत्रों के उपयोग से जोड़ना"
