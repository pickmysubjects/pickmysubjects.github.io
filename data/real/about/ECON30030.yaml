code: ECON30030
year: 2026
learn:
  en: "The economic history of Asian economies such as China and Japan, seen through a growth-model lens."
  zh: "用增长模型视角看中国、日本等亚洲经济的历史。"
  zh-TW: "用成長模型視角看中國、日本等亞洲經濟的歷史。"
  ja: "成長モデルの視点で見る中国・日本などアジア経済の歴史。"
  ko: "성장 모형의 관점으로 보는 중국·일본 등 아시아 경제사."
  vi: "Lịch sử kinh tế các nền kinh tế châu Á như Trung Quốc và Nhật Bản, nhìn qua lăng kính mô hình tăng trưởng."
  ms: "Sejarah ekonomi negara Asia seperti China dan Jepun, dilihat melalui model pertumbuhan."
  id: "Sejarah ekonomi negara Asia seperti Tiongkok dan Jepang, dilihat lewat model pertumbuhan."
  hi: "चीन और जापान जैसी एशियाई अर्थव्यवस्थाओं का आर्थिक इतिहास, ग्रोथ मॉडल के नज़रिए से।"
outcomes:
  - en: "Apply growth models to Asia's past and present"
    zh: "用增长模型分析亚洲的过去和现在"
    zh-TW: "用成長模型分析亞洲的過去和現在"
    ja: "成長モデルをアジアの過去と現在に当てはめる"
    ko: "성장 모형을 아시아의 과거와 현재에 적용하기"
    vi: "Áp dụng mô hình tăng trưởng cho châu Á xưa và nay"
    ms: "Guna model pertumbuhan pada Asia dulu dan kini"
    id: "Menerapkan model pertumbuhan pada Asia dulu dan kini"
    hi: "एशिया के अतीत और वर्तमान पर ग्रोथ मॉडल लागू करना"
  - en: "Use case studies to inform policy"
    zh: "借案例研究为政策提供参考"
    zh-TW: "藉個案研究為政策提供參考"
    ja: "事例研究を政策に生かす"
    ko: "사례 연구로 정책에 시사점 주기"
    vi: "Dùng nghiên cứu tình huống để góp ý chính sách"
    ms: "Guna kajian kes untuk bantu dasar"
    id: "Memakai studi kasus untuk masukan kebijakan"
    hi: "केस स्टडी से नीति के लिए सुझाव देना"
  - en: "Critically compare theories using evidence"
    zh: "用证据批判性地比较各种理论"
    zh-TW: "用證據批判性地比較各種理論"
    ja: "証拠をもとに理論を批判的に比べる"
    ko: "근거를 들어 이론을 비판적으로 비교하기"
    vi: "So sánh các lý thuyết một cách phản biện dựa trên bằng chứng"
    ms: "Bandingkan teori secara kritis berdasarkan bukti"
    id: "Membandingkan teori secara kritis dengan bukti"
    hi: "सबूतों के आधार पर थ्योरीज़ की आलोचनात्मक तुलना करना"
