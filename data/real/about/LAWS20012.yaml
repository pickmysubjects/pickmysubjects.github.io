code: LAWS20012
year: 2026
learn:
  en: "The UN human rights system and its critics: treaties, courts, refugees, children's and Indigenous rights, and how rights are enforced."
  zh: "联合国人权体系及其争议：条约、法院、难民、儿童与原住民权利，以及人权如何落实"
  zh-TW: "聯合國人權體系及其爭議：條約、法院、難民、兒童與原住民權利，以及人權如何落實"
  ja: "国連人権体制とその批判。条約、裁判所、難民、子どもと先住民の権利、人権の実現方法。"
  ko: "유엔 인권 체계와 비판: 조약, 법원, 난민, 아동·원주민 권리, 그리고 인권의 집행 방식."
  vi: "Hệ thống nhân quyền LHQ và các phê phán: công ước, tòa án, người tị nạn, quyền trẻ em và bản địa, thực thi."
  ms: "Sistem hak asasi PBB dan kritikannya: perjanjian, mahkamah, pelarian, hak kanak-kanak dan Orang Asal."
  id: "Sistem HAM PBB dan kritiknya: perjanjian, pengadilan, pengungsi, hak anak dan masyarakat adat, penegakannya."
  hi: "संयुक्त राष्ट्र मानवाधिकार व्यवस्था और आलोचना: संधियाँ, अदालतें, शरणार्थी, बाल व आदिवासी अधिकार, लागू करना।"
outcomes:
  - en: "Explain the main human rights treaties and bodies"
    zh: "说明主要人权条约和机构"
    zh-TW: "說明主要人權條約和機構"
    ja: "主な人権条約と機関を説明する"
    ko: "주요 인권 조약과 기구 설명하기"
    vi: "Giải thích các công ước và cơ quan nhân quyền chính"
    ms: "Menerangkan perjanjian dan badan hak asasi utama"
    id: "Menjelaskan perjanjian dan lembaga HAM utama"
    hi: "मुख्य मानवाधिकार संधियाँ और संस्थाएँ समझाना"
  - en: "Apply human rights law to current social problems"
    zh: "把人权法应用到当下的社会问题"
    zh-TW: "把人權法應用到當下的社會問題"
    ja: "人権法を現在の社会問題に当てはめる"
    ko: "인권법을 오늘날 사회 문제에 적용하기"
    vi: "Áp dụng luật nhân quyền vào vấn đề xã hội hiện nay"
    ms: "Mengaplikasi undang-undang hak asasi pada isu semasa"
    id: "Menerapkan hukum HAM pada masalah sosial terkini"
    hi: "मानवाधिकार कानून को आज की सामाजिक समस्याओं पर लागू करना"
  - en: "Judge where the global system works and where it fails"
    zh: "评估全球人权体系的成效与不足"
    zh-TW: "評估全球人權體系的成效與不足"
    ja: "国際人権体制の長所と限界を評価する"
    ko: "세계 인권 체계의 강점과 한계 평가하기"
    vi: "Đánh giá điểm mạnh và hạn chế của hệ thống toàn cầu"
    ms: "Menilai kekuatan dan kelemahan sistem global"
    id: "Menilai kekuatan dan keterbatasan sistem global"
    hi: "वैश्विक व्यवस्था कहाँ सफल और कहाँ विफल है, आँकना"
