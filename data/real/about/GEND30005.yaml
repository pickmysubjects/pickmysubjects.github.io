code: GEND30005
year: 2026
learn:
  en: "How gender, sexuality and race inequality shows up in organisations, how it is measured, and practical ways to change it."
  zh: "组织中的性别、性和种族不平等如何出现、如何衡量，以及可行的改变方式。"
  zh-TW: "組織中的性別、性和種族不平等如何出現、如何衡量，以及可行的改變方式。"
  ja: "組織の中でジェンダー・性・人種の格差がどう現れ、どう測られ、どう変えられるかを学ぶ。"
  ko: "조직 안에서 젠더·섹슈얼리티·인종 불평등이 어떻게 나타나고 측정되며 어떻게 바꿀 수 있는지 배운다."
  vi: "Bất bình đẳng về giới, tính dục và chủng tộc xuất hiện trong tổ chức ra sao, đo lường thế nào và cách thực tế để thay đổi."
  ms: "Cara ketaksamaan gender, seksualiti dan kaum muncul dalam organisasi, cara mengukurnya dan langkah praktikal mengubahnya."
  id: "Cara ketimpangan gender, seksualitas, dan ras muncul di organisasi, cara mengukurnya, dan langkah praktis untuk mengubahnya."
  hi: "संगठनों में जेंडर, यौनिकता और नस्ल की असमानता कैसे दिखती है, कैसे मापी जाती है, और इसे बदलने के व्यावहारिक तरीके।"
outcomes:
  - en: "Explain how workplace inequality persists"
    zh: "解释职场不平等为何持续存在"
    zh-TW: "解釋職場不平等為何持續存在"
    ja: "職場の格差がなぜ続くか説明する"
    ko: "직장 내 불평등이 지속되는 이유 설명하기"
    vi: "Giải thích vì sao bất bình đẳng nơi làm việc tồn tại"
    ms: "Terangkan mengapa ketaksamaan di tempat kerja berterusan"
    id: "Menjelaskan mengapa ketimpangan di tempat kerja bertahan"
    hi: "कार्यस्थल पर असमानता क्यों बनी रहती है, समझाना"
  - en: "Assess how diversity is measured"
    zh: "评估多元性如何被衡量"
    zh-TW: "評估多元性如何被衡量"
    ja: "多様性の測り方を評価する"
    ko: "다양성 측정 방식 평가하기"
    vi: "Đánh giá cách đo lường sự đa dạng"
    ms: "Nilai cara kepelbagaian diukur"
    id: "Menilai cara keberagaman diukur"
    hi: "विविधता को कैसे मापा जाता है, आकलन करना"
  - en: "Propose practical strategies for inclusion"
    zh: "提出切实可行的包容策略"
    zh-TW: "提出切實可行的包容策略"
    ja: "包摂のための実践的な方策を提案する"
    ko: "포용을 위한 실천 전략 제안하기"
    vi: "Đề xuất chiến lược hòa nhập thực tế"
    ms: "Cadangkan strategi praktikal untuk keterangkuman"
    id: "Mengusulkan strategi praktis untuk inklusi"
    hi: "समावेशन के लिए व्यावहारिक रणनीतियाँ सुझाना"
