code: NEUR30003
year: 2026
learn:
  en: "How the nervous system works, from nerve cells and circuits to senses, movement and thinking."
  zh: "神经系统怎么运作，从神经细胞和回路到感觉、运动和思维。"
  zh-TW: "神經系統怎麼運作，從神經細胞和迴路到感覺、運動和思考。"
  ja: "神経系の働き：神経細胞と回路から、感覚・運動・思考まで。"
  ko: "신경계의 작동 방식: 신경세포와 회로부터 감각, 운동, 사고까지."
  vi: "Hệ thần kinh hoạt động ra sao, từ tế bào và mạch thần kinh đến giác quan, vận động và tư duy."
  ms: "Cara sistem saraf berfungsi, daripada sel saraf dan litar hingga deria, pergerakan dan pemikiran."
  id: "Cara kerja sistem saraf, dari sel saraf dan sirkuit hingga indra, gerakan, dan berpikir."
  hi: "तंत्रिका तंत्र कैसे काम करता है, कोशिकाओं और सर्किट से लेकर इंद्रियों, गति और सोच तक।"
outcomes:
  - en: "Explain how neurons connect and store information"
    zh: "解释神经元怎么连接和储存信息"
    zh-TW: "解釋神經元怎麼連接和儲存資訊"
    ja: "ニューロンのつながり方と情報の蓄え方を説明する"
    ko: "뉴런이 연결되고 정보를 저장하는 방식 설명하기"
    vi: "Giải thích nơ-ron kết nối và lưu thông tin ra sao"
    ms: "Menerangkan cara neuron bersambung dan menyimpan maklumat"
    id: "Menjelaskan cara neuron terhubung dan menyimpan informasi"
    hi: "न्यूरॉन कैसे जुड़ते और जानकारी सहेजते हैं"
  - en: "Describe how the brain processes senses and movement"
    zh: "描述大脑怎么处理感觉和运动"
    zh-TW: "描述大腦怎麼處理感覺和運動"
    ja: "脳が感覚と運動を処理する仕組みを説明する"
    ko: "뇌가 감각과 운동을 처리하는 방식 설명하기"
    vi: "Mô tả não xử lý giác quan và vận động ra sao"
    ms: "Menghuraikan cara otak memproses deria dan pergerakan"
    id: "Menjelaskan cara otak memproses indra dan gerakan"
    hi: "दिमाग इंद्रियों और गति को कैसे संभालता है"
  - en: "Explain how the brain adapts to ageing and injury"
    zh: "解释大脑怎么适应衰老和损伤"
    zh-TW: "解釋大腦怎麼適應老化和損傷"
    ja: "脳が老化や損傷に適応する仕組みを説明する"
    ko: "뇌가 노화와 손상에 적응하는 방식 설명하기"
    vi: "Giải thích não thích nghi với lão hóa và tổn thương ra sao"
    ms: "Menerangkan cara otak menyesuaikan diri dengan penuaan dan kecederaan"
    id: "Menjelaskan cara otak beradaptasi dengan penuaan dan cedera"
    hi: "दिमाग बुढ़ापे और चोट के साथ कैसे ढलता है"
