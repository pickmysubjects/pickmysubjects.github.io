code: AHIS30003
year: 2026
learn:
  en: "Art and objects from Europe, Asia and the Americas in the long 18th century, and how power shaped what was made."
  zh: "漫长18世纪欧洲、亚洲和美洲的艺术与器物，以及权力如何影响创作。"
  zh-TW: "漫長18世紀歐洲、亞洲和美洲的藝術與器物，以及權力如何影響創作。"
  ja: "長い18世紀のヨーロッパ・アジア・アメリカの美術と工芸品、そして権力が制作にどう影響したかを学ぶ。"
  ko: "긴 18세기 유럽·아시아·아메리카의 미술과 공예품, 그리고 권력이 창작에 미친 영향을 배운다."
  vi: "Nghệ thuật và đồ vật ở châu Âu, châu Á và châu Mỹ trong thế kỷ 18 kéo dài, và quyền lực định hình sáng tác ra sao."
  ms: "Seni dan objek dari Eropah, Asia dan Amerika dalam abad ke-18 yang panjang, serta cara kuasa membentuk apa yang dihasilkan."
  id: "Seni dan benda dari Eropa, Asia dan Amerika pada abad ke-18 yang panjang, serta cara kekuasaan membentuk apa yang dibuat."
  hi: "लंबी 18वीं सदी में यूरोप, एशिया और अमेरिका की कला और वस्तुएं, और सत्ता ने तय किया कि क्या बनाया जाए।"
outcomes:
  - en: "Describe art and design of the 18th century"
    zh: "描述18世纪的艺术与设计"
    zh-TW: "描述18世紀的藝術與設計"
    ja: "18世紀の美術とデザインを説明する"
    ko: "18세기의 미술과 디자인 설명하기"
    vi: "Mô tả nghệ thuật và thiết kế thế kỷ 18"
    ms: "Huraikan seni dan reka bentuk abad ke-18"
    id: "Menguraikan seni dan desain abad ke-18"
    hi: "18वीं सदी की कला और डिज़ाइन का वर्णन करना"
  - en: "Analyse how patrons and power shaped art"
    zh: "分析赞助人和权力如何影响艺术"
    zh-TW: "分析贊助人和權力如何影響藝術"
    ja: "パトロンと権力が美術をどう形づくったか分析する"
    ko: "후원자와 권력이 미술에 미친 영향 분석하기"
    vi: "Phân tích người bảo trợ và quyền lực định hình nghệ thuật ra sao"
    ms: "Analisis cara penaung dan kuasa membentuk seni"
    id: "Menganalisis cara patron dan kekuasaan membentuk seni"
    hi: "संरक्षकों और सत्ता ने कला को कैसे गढ़ा, विश्लेषण करना"
  - en: "Study objects in real collections closely"
    zh: "细致研究真实馆藏中的器物"
    zh-TW: "細緻研究真實館藏中的器物"
    ja: "実際の収蔵品を間近で研究する"
    ko: "실제 소장품을 면밀히 연구하기"
    vi: "Nghiên cứu kỹ đồ vật trong các bộ sưu tập thật"
    ms: "Kaji objek dalam koleksi sebenar dengan teliti"
    id: "Meneliti benda dalam koleksi nyata dengan cermat"
    hi: "असली संग्रहों की वस्तुओं का बारीकी से अध्ययन करना"
