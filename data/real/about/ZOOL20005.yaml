code: ZOOL20005
year: 2026
learn:
  en: "How different animals solve the same jobs like moving, breathing, feeding and sensing, with lab work."
  zh: "不同动物如何解决运动、呼吸、进食等难题，含实验课。"
  zh-TW: "不同動物如何解決運動、呼吸、進食等難題，含實驗課。"
  ja: "移動・呼吸・摂食・感覚を動物ごとにどう解決したか、実習付き。"
  ko: "움직임, 호흡, 섭식, 감각 문제를 동물마다 푸는 방식, 실험 포함."
  vi: "Các loài vật giải quyết việc di chuyển, thở, ăn, cảm nhận khác nhau ra sao, có thực hành."
  ms: "Cara haiwan berbeza bergerak, bernafas, makan dan mengesan, dengan kerja makmal."
  id: "Cara hewan berbeda bergerak, bernapas, makan, dan mengindra, dengan praktikum."
  hi: "अलग-अलग जानवर चलना, साँस लेना, खाना और महसूस करना कैसे करते हैं, लैब के साथ।"
outcomes:
  - en: "Identify animals to broad groups"
    zh: "把动物鉴定到大类"
    zh-TW: "把動物鑑定到大類"
    ja: "動物を大まかなグループに同定する"
    ko: "동물을 큰 분류군으로 동정하기"
    vi: "Định loại động vật đến nhóm lớn"
    ms: "Mengenal pasti haiwan mengikut kumpulan besar"
    id: "Mengidentifikasi hewan ke kelompok besar"
    hi: "जानवरों को बड़े समूहों में पहचानना"
  - en: "Handle and study specimens in the lab"
    zh: "在实验室处理和研究标本"
    zh-TW: "在實驗室處理和研究標本"
    ja: "実験室で標本を扱い調べる"
    ko: "실험실에서 표본 다루고 관찰하기"
    vi: "Xử lý và nghiên cứu mẫu vật trong phòng thí nghiệm"
    ms: "Mengendali dan mengkaji spesimen di makmal"
    id: "Menangani dan meneliti spesimen di lab"
    hi: "लैब में नमूनों को सँभालना और जाँचना"
  - en: "Compare how animals move, breathe, feed and sense"
    zh: "比较动物如何运动、呼吸、进食和感知"
    zh-TW: "比較動物如何運動、呼吸、進食和感知"
    ja: "動物の運動・呼吸・摂食・感覚の仕組みを比べる"
    ko: "동물의 이동·호흡·섭식·감각 방식 비교하기"
    vi: "So sánh cách động vật di chuyển, thở, ăn và cảm nhận"
    ms: "Bandingkan cara haiwan bergerak, bernafas, makan dan mengesan"
    id: "Membandingkan cara hewan bergerak, bernapas, makan dan mengindra"
    hi: "तुलना करना कि जानवर कैसे चलते, सांस लेते, खाते और महसूस करते हैं"
