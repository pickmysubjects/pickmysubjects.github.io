code: MULT30015
year: 2026
learn:
  en: "Run your own Arts research project with a supervisor: pick a topic, write a proposal and finish a 4000-word paper, like mini-Honours."
  zh: "在导师指导下做自己的文科研究：选题、写计划书、完成4000字论文，像迷你荣誉课"
  zh-TW: "在導師指導下做自己的文科研究：選題、寫計畫書、完成4000字論文，像迷你榮譽課"
  ja: "指導教員のもとで自分の人文研究を行う。テーマ選び、計画書、4000語の論文。小さなオナーズ体験。"
  ko: "지도교수와 함께 나만의 인문학 연구: 주제 선정, 계획서, 4000단어 논문 완성. 미니 아너스."
  vi: "Tự làm dự án nghiên cứu Nhân văn với người hướng dẫn: chọn đề tài, viết đề cương, hoàn thành bài 4000 từ."
  ms: "Jalankan projek kajian Sastera sendiri dengan penyelia: pilih topik, tulis cadangan, siapkan kertas 4000 patah perkataan."
  id: "Jalankan proyek riset Sastra sendiri dengan pembimbing: pilih topik, tulis proposal, selesaikan makalah 4000 kata."
  hi: "सुपरवाइज़र के साथ अपना आर्ट्स शोध प्रोजेक्ट: विषय चुनना, प्रस्ताव लिखना, 4000 शब्दों का पेपर पूरा करना।"
outcomes:
  - en: "Turn a topic into a workable research proposal"
    zh: "把一个题目变成可行的研究计划"
    zh-TW: "把一個題目變成可行的研究計畫"
    ja: "テーマを実行可能な研究計画にする"
    ko: "주제를 실행 가능한 연구 계획으로 만들기"
    vi: "Biến một đề tài thành đề cương nghiên cứu khả thi"
    ms: "Menjadikan topik sebagai cadangan kajian yang boleh dilaksana"
    id: "Mengubah topik menjadi proposal riset yang layak"
    hi: "किसी विषय को व्यावहारिक शोध प्रस्ताव में बदलना"
  - en: "Find, analyse and combine primary and secondary sources"
    zh: "查找、分析并整合原始和二手资料"
    zh-TW: "查找、分析並整合原始和二手資料"
    ja: "一次・二次資料を探し、分析し、統合する"
    ko: "1차·2차 자료를 찾고 분석해 종합하기"
    vi: "Tìm, phân tích và tổng hợp tài liệu gốc và thứ cấp"
    ms: "Mencari, menganalisis dan menggabung sumber"
    id: "Mencari, menganalisis, dan memadukan sumber primer dan sekunder"
    hi: "मूल और द्वितीयक स्रोत खोजना, विश्लेषण करना और जोड़ना"
  - en: "Write a sophisticated research paper"
    zh: "写出一篇有深度的研究论文"
    zh-TW: "寫出一篇有深度的研究論文"
    ja: "質の高い研究論文を書く"
    ko: "수준 높은 연구 논문 쓰기"
    vi: "Viết một bài nghiên cứu có chiều sâu"
    ms: "Menulis kertas kajian yang matang"
    id: "Menulis makalah riset yang matang"
    hi: "एक परिपक्व शोध पेपर लिखना"
