code: PHYC10008
year: 2026
learn:
  en: "The universe from our solar system to galaxies and cosmology, with basic maths taught as needed."
  zh: "从太阳系到星系和宇宙学，需要的数学会现教。"
  zh-TW: "從太陽系到星系和宇宙學，需要的數學會現教。"
  ja: "太陽系から銀河、宇宙論まで。必要な基礎数学はその都度教わる。"
  ko: "태양계부터 은하와 우주론까지, 필요한 기초 수학은 그때그때 배움."
  vi: "Vũ trụ từ hệ Mặt Trời đến thiên hà và vũ trụ học, toán cơ bản được dạy khi cần."
  ms: "Alam semesta dari sistem suria ke galaksi dan kosmologi, matematik asas diajar bila perlu."
  id: "Alam semesta dari tata surya ke galaksi dan kosmologi, matematika dasar diajarkan sesuai kebutuhan."
  hi: "सौरमंडल से गैलेक्सी और कॉस्मोलॉजी तक ब्रह्मांड, ज़रूरत पड़ने पर बेसिक मैथ्स सिखाई जाती है।"
outcomes:
  - en: "Explain how stars, galaxies and planets form"
    zh: "解释恒星、星系和行星怎么形成"
    zh-TW: "解釋恆星、星系和行星怎麼形成"
    ja: "恒星、銀河、惑星がどう形成されるか説明する"
    ko: "별, 은하, 행성이 어떻게 형성되는지 설명"
    vi: "Giải thích sao, thiên hà và hành tinh hình thành ra sao"
    ms: "Terangkan cara bintang, galaksi dan planet terbentuk"
    id: "Menjelaskan cara bintang, galaksi, dan planet terbentuk"
    hi: "तारे, गैलेक्सी और ग्रह कैसे बनते हैं, समझाना"
  - en: "Discuss open questions like dark matter"
    zh: "讨论暗物质等未解之谜"
    zh-TW: "討論暗物質等未解之謎"
    ja: "暗黒物質などの未解決問題を論じる"
    ko: "암흑물질 같은 미해결 문제 논의"
    vi: "Thảo luận các câu hỏi mở như vật chất tối"
    ms: "Bincang persoalan terbuka seperti jirim gelap"
    id: "Membahas pertanyaan terbuka seperti materi gelap"
    hi: "डार्क मैटर जैसे अनसुलझे सवालों पर चर्चा"
  - en: "Use the scientific method on space questions"
    zh: "用科学方法思考天文问题"
    zh-TW: "用科學方法思考天文問題"
    ja: "宇宙の問題に科学的方法を使う"
    ko: "우주 문제에 과학적 방법 적용"
    vi: "Dùng phương pháp khoa học cho câu hỏi về vũ trụ"
    ms: "Guna kaedah saintifik pada persoalan angkasa"
    id: "Memakai metode ilmiah untuk pertanyaan antariksa"
    hi: "अंतरिक्ष के सवालों पर वैज्ञानिक तरीका अपनाना"
