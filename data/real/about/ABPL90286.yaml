code: ABPL90286
year: 2027
learn:
  en: "Construction principles, materials and systems, with a residential week of hands-on building work in Barmah."
  zh: "建造原理、材料与系统，并在 Barmah 进行一周驻地实地建造。"
  zh-TW: "建造原理、材料與系統，並在 Barmah 進行一週駐地實地建造。"
  ja: "建設の原理・材料・システム。Barmah での1週間の滞在型実地施工を含む。"
  ko: "건축 원리, 재료, 시스템과 Barmah에서 1주간 숙박형 현장 시공."
  vi: "Nguyên lý, vật liệu và hệ thống xây dựng, kèm một tuần thực hành lưu trú tại Barmah."
  ms: "Prinsip, bahan dan sistem pembinaan, dengan seminggu kerja lapangan berasrama di Barmah."
  id: "Prinsip, material, dan sistem konstruksi, dengan seminggu praktik lapangan menginap di Barmah."
  hi: "निर्माण सिद्धांत, सामग्री और प्रणालियाँ, Barmah में एक सप्ताह के आवासीय फ़ील्ड कार्य के साथ।"
outcomes:
  - en: "Relate building principles to small and medium projects"
    zh: "把建造原理用于中小型项目"
    zh-TW: "把建造原理用於中小型專案"
    ja: "建設の原理を中小規模の案件に結びつける"
    ko: "건축 원리를 중소형 프로젝트에 연결하기"
    vi: "Liên hệ nguyên lý xây dựng với dự án vừa và nhỏ"
    ms: "Mengaitkan prinsip binaan dengan projek kecil dan sederhana"
    id: "Mengaitkan prinsip bangunan dengan proyek kecil dan menengah"
    hi: "छोटे-मध्यम प्रोजेक्ट में निर्माण सिद्धांत लागू करना"
  - en: "Read and use technical construction drawings"
    zh: "读懂并运用建造技术图纸"
    zh-TW: "讀懂並運用建造技術圖紙"
    ja: "施工の技術図面を読み解き使う"
    ko: "시공 기술 도면 읽고 활용하기"
    vi: "Đọc và dùng bản vẽ kỹ thuật xây dựng"
    ms: "Membaca dan menggunakan lukisan teknikal binaan"
    id: "Membaca dan memakai gambar teknik konstruksi"
    hi: "तकनीकी निर्माण ड्रॉइंग पढ़ना और उपयोग करना"
