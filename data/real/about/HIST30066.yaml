code: HIST30066
year: 2026
learn:
  en: "How the Cold War shaped culture across Asia, from music and sport to protest and consumption, and how Asia shaped it."
  zh: "冷战如何塑造亚洲各地的文化，从音乐体育到抗议和消费，以及亚洲如何反过来影响冷战。"
  zh-TW: "冷戰如何形塑亞洲各地的文化，從音樂體育到抗議和消費，以及亞洲如何反過來影響冷戰。"
  ja: "音楽やスポーツから抗議や消費まで、冷戦がアジアの文化をどう形づくり、アジアが冷戦をどう動かしたかを学ぶ。"
  ko: "음악과 스포츠부터 저항과 소비까지 냉전이 아시아 문화를 어떻게 만들었는지, 아시아가 냉전에 어떤 영향을 줬는지 배운다."
  vi: "Chiến tranh Lạnh định hình văn hóa khắp châu Á ra sao, từ âm nhạc, thể thao đến phản kháng, tiêu dùng, và châu Á tác động ngược lại thế nào."
  ms: "Cara Perang Dingin membentuk budaya di Asia, daripada muzik dan sukan hingga bantahan dan penggunaan, dan cara Asia membentuknya."
  id: "Cara Perang Dingin membentuk budaya di Asia, dari musik dan olahraga hingga protes dan konsumsi, dan cara Asia memengaruhinya."
  hi: "शीत युद्ध ने पूरे एशिया की संस्कृति को कैसे आकार दिया, संगीत और खेल से विरोध और उपभोग तक, और एशिया ने उसे कैसे बदला।"
outcomes:
  - en: "Show how the Cold War shaped culture in Asia"
    zh: "说明冷战如何塑造亚洲文化"
    zh-TW: "說明冷戰如何形塑亞洲文化"
    ja: "冷戦がアジアの文化をどう形づくったか示す"
    ko: "냉전이 아시아 문화를 어떻게 만들었는지 보여 주기"
    vi: "Chỉ ra Chiến tranh Lạnh định hình văn hóa châu Á ra sao"
    ms: "Tunjukkan cara Perang Dingin membentuk budaya Asia"
    id: "Menunjukkan cara Perang Dingin membentuk budaya Asia"
    hi: "शीत युद्ध ने एशिया की संस्कृति को कैसे आकार दिया, दिखाना"
  - en: "Compare global, regional and national factors"
    zh: "比较全球、区域和国家层面的因素"
    zh-TW: "比較全球、區域和國家層面的因素"
    ja: "世界・地域・国家レベルの要因を比べる"
    ko: "세계·지역·국가 차원의 요인 비교하기"
    vi: "So sánh các yếu tố toàn cầu, khu vực và quốc gia"
    ms: "Bandingkan faktor global, serantau dan nasional"
    id: "Membandingkan faktor global, regional, dan nasional"
    hi: "वैश्विक, क्षेत्रीय और राष्ट्रीय कारकों की तुलना करना"
  - en: "Examine new scholarship on Cold War history"
    zh: "研读冷战史的新研究"
    zh-TW: "研讀冷戰史的新研究"
    ja: "冷戦史の新しい研究を検討する"
    ko: "냉전사에 관한 새로운 연구 살펴보기"
    vi: "Xem xét các nghiên cứu mới về lịch sử Chiến tranh Lạnh"
    ms: "Teliti kajian baharu tentang sejarah Perang Dingin"
    id: "Mengkaji riset baru tentang sejarah Perang Dingin"
    hi: "शीत युद्ध इतिहास पर नए शोध की जाँच करना"
