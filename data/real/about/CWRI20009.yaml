code: CWRI20009
year: 2026
learn:
  en: "The history and craft of screenwriting, reading real scripts and writing a short original screenplay of your own."
  zh: "编剧的历史与技巧，阅读真实剧本并写出一部原创短剧本。"
  zh-TW: "編劇的歷史與技巧，閱讀真實劇本並寫出一部原創短劇本。"
  ja: "脚本の歴史と技法を学び、実際の脚本を読み、自分の短いオリジナル脚本を書く。"
  ko: "시나리오 작법의 역사와 기술을 배우고, 실제 대본을 읽고 짧은 오리지널 각본을 쓴다."
  vi: "Lịch sử và kỹ thuật viết kịch bản phim, đọc kịch bản thật và tự viết một kịch bản ngắn nguyên tác."
  ms: "Sejarah dan kemahiran penulisan lakon layar, membaca skrip sebenar dan menulis lakon layar pendek asli sendiri."
  id: "Sejarah dan teknik penulisan skenario, membaca naskah nyata dan menulis skenario pendek orisinal sendiri."
  hi: "पटकथा लेखन का इतिहास और कारीगरी, असली स्क्रिप्ट पढ़ना और अपनी एक छोटी मौलिक पटकथा लिखना।"
outcomes:
  - en: "Explain how screenplays are structured"
    zh: "说明剧本的结构"
    zh-TW: "說明劇本的結構"
    ja: "脚本の構成を説明する"
    ko: "각본의 구조 설명하기"
    vi: "Giải thích cấu trúc của kịch bản phim"
    ms: "Terangkan struktur lakon layar"
    id: "Menjelaskan struktur skenario"
    hi: "पटकथा की संरचना समझाना"
  - en: "Analyse scripts from film and TV"
    zh: "分析电影和电视剧本"
    zh-TW: "分析電影和電視劇本"
    ja: "映画やテレビの脚本を分析する"
    ko: "영화와 TV 대본 분석하기"
    vi: "Phân tích kịch bản phim và truyền hình"
    ms: "Analisis skrip filem dan TV"
    id: "Menganalisis naskah film dan TV"
    hi: "फ़िल्म और टीवी स्क्रिप्ट का विश्लेषण करना"
  - en: "Write a short original screenplay"
    zh: "写一部原创短剧本"
    zh-TW: "寫一部原創短劇本"
    ja: "短いオリジナル脚本を書く"
    ko: "짧은 오리지널 각본 쓰기"
    vi: "Viết một kịch bản phim ngắn nguyên tác"
    ms: "Tulis lakon layar pendek asli"
    id: "Menulis skenario pendek orisinal"
    hi: "एक छोटी मौलिक पटकथा लिखना"
