code: COMP20003
year: 2026
learn:
  en: "Common data structures and algorithms, why they work, how fast they are and when to use each."
  zh: "常用数据结构和算法：为什么对、有多快、什么时候用。"
  zh-TW: "常用資料結構和演算法：為什麼正確、有多快、什麼時候用。"
  ja: "よく使うデータ構造とアルゴリズム：なぜ正しいか、どれだけ速いか、いつ使うか。"
  ko: "자주 쓰는 자료구조와 알고리즘: 왜 맞는지, 얼마나 빠른지, 언제 쓰는지."
  vi: "Cấu trúc dữ liệu và thuật toán phổ biến: vì sao đúng, nhanh cỡ nào, khi nào dùng."
  ms: "Struktur data dan algoritma biasa: kenapa ia betul, sepantas mana dan bila guna."
  id: "Struktur data dan algoritma umum: kenapa benar, seberapa cepat, dan kapan dipakai."
  hi: "आम डेटा स्ट्रक्चर और एल्गोरिद्म: ये क्यों काम करते हैं, कितने तेज़ हैं और कब इस्तेमाल करें।"
outcomes:
  - en: "Argue whether an algorithm is correct"
    zh: "论证一个算法是否正确"
    zh-TW: "論證一個演算法是否正確"
    ja: "アルゴリズムが正しいかを論証する"
    ko: "알고리즘이 올바른지 논증하기"
    vi: "Lập luận một thuật toán có đúng không"
    ms: "Hujah sama ada algoritma itu betul"
    id: "Membuktikan apakah algoritma benar"
    hi: "तर्क देना कि एल्गोरिद्म सही है या नहीं"
  - en: "Pick the right data structure for a problem"
    zh: "为问题选合适的数据结构"
    zh-TW: "為問題選擇合適的資料結構"
    ja: "問題に合ったデータ構造を選ぶ"
    ko: "문제에 맞는 자료구조 선택"
    vi: "Chọn cấu trúc dữ liệu phù hợp cho bài toán"
    ms: "Pilih struktur data yang sesuai untuk masalah"
    id: "Memilih struktur data yang tepat"
    hi: "समस्या के लिए सही डेटा स्ट्रक्चर चुनना"
  - en: "Implement sorting, search and graph algorithms"
    zh: "实现排序、查找和图算法"
    zh-TW: "實作排序、搜尋和圖論演算法"
    ja: "ソート・探索・グラフアルゴリズムを実装する"
    ko: "정렬·탐색·그래프 알고리즘 구현"
    vi: "Cài đặt thuật toán sắp xếp, tìm kiếm và đồ thị"
    ms: "Laksanakan algoritma isihan, carian dan graf"
    id: "Mengimplementasikan algoritma sorting, pencarian, dan graf"
    hi: "सॉर्टिंग, सर्च और ग्राफ़ एल्गोरिद्म लागू करना"
