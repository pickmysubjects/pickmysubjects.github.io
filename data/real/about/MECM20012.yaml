code: MECM20012
year: 2026
learn:
  en: "How talk works at work, in classrooms, clinics, courts and radio, using conversation analysis to fix communication problems."
  zh: "运用会话分析研究课堂、诊室、法庭和电台等职场中的交谈，并解决沟通问题。"
  zh-TW: "運用會話分析研究課堂、診間、法庭和電台等職場中的交談，並解決溝通問題。"
  ja: "教室、診察室、法廷、ラジオなど職場での会話を会話分析で読み解き、コミュニケーションの問題を解決する。"
  ko: "교실, 진료실, 법정, 라디오 등 직장 속 대화를 대화 분석으로 살피고 소통 문제를 해결한다."
  vi: "Cách trò chuyện diễn ra nơi làm việc, lớp học, phòng khám, tòa án, đài phát thanh, dùng phân tích hội thoại để gỡ vấn đề giao tiếp."
  ms: "Cara perbualan berlaku di tempat kerja, kelas, klinik, mahkamah dan radio, dengan analisis perbualan untuk atasi masalah komunikasi."
  id: "Cara percakapan berjalan di tempat kerja, kelas, klinik, pengadilan dan radio, memakai analisis percakapan untuk atasi masalah komunikasi."
  hi: "कक्षा, क्लिनिक, अदालत और रेडियो जैसे कामकाजी माहौल में बातचीत कैसे चलती है, संवाद-विश्लेषण से समस्याएँ सुलझाना।"
outcomes:
  - en: "Analyse real workplace talk using conversation analysis"
    zh: "运用会话分析研究真实职场对话"
    zh-TW: "運用會話分析研究真實職場對話"
    ja: "会話分析で実際の職場の会話を分析する"
    ko: "대화 분석으로 실제 직장 대화 분석하기"
    vi: "Phân tích hội thoại công sở thật bằng phân tích hội thoại"
    ms: "Analisis perbualan sebenar di tempat kerja"
    id: "Menganalisis percakapan kerja nyata dengan analisis percakapan"
    hi: "संवाद-विश्लेषण से असली कार्यस्थल बातचीत का विश्लेषण करना"
  - en: "Spot causes of misunderstanding and conflict"
    zh: "找出误解和冲突的原因"
    zh-TW: "找出誤解和衝突的原因"
    ja: "誤解や対立の原因を見つける"
    ko: "오해와 갈등의 원인 찾아내기"
    vi: "Nhận ra nguyên nhân hiểu lầm và xung đột"
    ms: "Kenal pasti punca salah faham dan konflik"
    id: "Mengenali penyebab salah paham dan konflik"
    hi: "ग़लतफ़हमी और टकराव के कारण पहचानना"
  - en: "Suggest practical fixes for communication problems"
    zh: "为沟通问题提出实用的解决办法"
    zh-TW: "為溝通問題提出實用的解決辦法"
    ja: "コミュニケーションの問題に実践的な解決策を示す"
    ko: "소통 문제에 실용적인 해결책 제시하기"
    vi: "Đề xuất cách khắc phục thực tế cho vấn đề giao tiếp"
    ms: "Cadangkan penyelesaian praktikal untuk masalah komunikasi"
    id: "Mengusulkan solusi praktis untuk masalah komunikasi"
    hi: "संवाद की समस्याओं के व्यावहारिक हल सुझाना"
