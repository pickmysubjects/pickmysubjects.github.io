code: ABPL90367
year: 2027
learn:
  en: "Design criticism and curating: how design is interpreted, exhibited and documented, through real exhibition projects."
  zh: "设计批评与策展：通过真实展览项目，学习如何解读、展示和记录设计。"
  zh-TW: "設計批評與策展：透過真實展覽專案，學習如何詮釋、展示和記錄設計。"
  ja: "デザイン批評とキュレーション：展覧会を通して、デザインの解釈・展示・記録を学ぶ。"
  ko: "디자인 비평과 큐레이션: 실제 전시로 디자인의 해석·전시·기록을 배웁니다."
  vi: "Phê bình và giám tuyển thiết kế: diễn giải, trưng bày, lưu trữ thiết kế qua dự án triển lãm thật."
  ms: "Kritikan dan kurasi reka bentuk: mentafsir, mempamer dan mendokumen reka bentuk melalui projek pameran."
  id: "Kritik dan kurasi desain: menafsirkan, memamerkan, dan mendokumentasikan desain lewat proyek pameran."
  hi: "डिज़ाइन आलोचना और क्यूरेशन: प्रदर्शनी प्रोजेक्ट से डिज़ाइन की व्याख्या, प्रदर्शन और दस्तावेज़ीकरण।"
outcomes:
  - en: "Compare ways of interpreting design"
    zh: "比较诠释设计的不同理论"
    zh-TW: "比較詮釋設計的不同理論"
    ja: "デザイン解釈の理論を比べる"
    ko: "디자인 해석 이론 비교하기"
    vi: "So sánh cách diễn giải thiết kế"
    ms: "Membandingkan cara mentafsir reka bentuk"
    id: "Membandingkan cara menafsirkan desain"
    hi: "डिज़ाइन व्याख्या के तरीकों की तुलना"
  - en: "Write a curatorial proposal"
    zh: "撰写策展提案"
    zh-TW: "撰寫策展提案"
    ja: "キュレーション企画を書く"
    ko: "큐레이션 제안서 쓰기"
    vi: "Viết đề xuất giám tuyển"
    ms: "Menulis cadangan kurasi"
    id: "Menulis proposal kuratorial"
    hi: "क्यूरेटोरियल प्रस्ताव लिखना"
