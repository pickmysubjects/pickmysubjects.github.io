code: MAST20035
year: 2026
learn:
  en: "Maths for making the best decisions in areas like logistics, scheduling and network design."
  zh: "用数学做最优决策，用在物流、排班、网络设计等方面。"
  zh-TW: "用數學做最佳決策，用在物流、排班、網路設計等方面。"
  ja: "物流・スケジューリング・ネットワーク設計などで最適な判断をするための数学。"
  ko: "물류, 일정 관리, 네트워크 설계 같은 분야에서 최선의 결정을 내리는 수학."
  vi: "Toán để ra quyết định tốt nhất trong logistics, lập lịch và thiết kế mạng."
  ms: "Matematik untuk membuat keputusan terbaik dalam logistik, penjadualan dan reka bentuk rangkaian."
  id: "Matematika untuk mengambil keputusan terbaik di logistik, penjadwalan, dan desain jaringan."
  hi: "लॉजिस्टिक्स, शेड्यूलिंग और नेटवर्क डिज़ाइन में सबसे अच्छे फ़ैसले लेने का गणित।"
outcomes:
  - en: "Turn decision problems into optimisation models"
    zh: "把决策问题写成优化模型"
    zh-TW: "把決策問題寫成最佳化模型"
    ja: "意思決定の問題を最適化モデルにする"
    ko: "의사결정 문제를 최적화 모델로 바꾸기"
    vi: "Chuyển bài toán quyết định thành mô hình tối ưu"
    ms: "Menukar masalah keputusan kepada model pengoptimuman"
    id: "Mengubah masalah keputusan jadi model optimasi"
    hi: "निर्णय समस्याओं को ऑप्टिमाइज़ेशन मॉडल में बदलना"
  - en: "Solve problems with linear and dynamic programming"
    zh: "用线性规划和动态规划求解"
    zh-TW: "用線性規劃和動態規劃求解"
    ja: "線形計画法と動的計画法で解く"
    ko: "선형계획법과 동적계획법으로 풀기"
    vi: "Giải bằng quy hoạch tuyến tính và quy hoạch động"
    ms: "Menyelesaikan masalah dengan pengaturcaraan linear dan dinamik"
    id: "Menyelesaikan masalah dengan pemrograman linear dan dinamis"
    hi: "रैखिक और डायनेमिक प्रोग्रामिंग से समस्याएँ हल करना"
  - en: "Check how sensitive a solution is to changes"
    zh: "分析结果对条件变化的敏感度"
    zh-TW: "分析結果對條件變化的敏感度"
    ja: "解が変化にどれだけ敏感か調べる"
    ko: "해가 변화에 얼마나 민감한지 확인하기"
    vi: "Kiểm tra độ nhạy của nghiệm khi có thay đổi"
    ms: "Menyemak kepekaan penyelesaian terhadap perubahan"
    id: "Mengecek seberapa sensitif solusi terhadap perubahan"
    hi: "जाँचना कि हल बदलावों पर कितना संवेदनशील है"
