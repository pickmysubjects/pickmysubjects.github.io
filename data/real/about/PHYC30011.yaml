code: PHYC30011
year: 2026
learn:
  en: "Quarks, leptons and atomic nuclei: how particles combine and interact, and how we study them."
  zh: "夸克、轻子和原子核：粒子如何组合、相互作用及如何研究。"
  zh-TW: "夸克、輕子和原子核：粒子如何組合、交互作用及如何研究。"
  ja: "クォーク・レプトン・原子核の組み合わせ方、相互作用、その調べ方。"
  ko: "쿼크, 렙톤, 원자핵: 입자가 결합·상호작용하는 방식과 연구 방법."
  vi: "Quark, lepton và hạt nhân: hạt kết hợp, tương tác ra sao và cách nghiên cứu."
  ms: "Kuark, lepton dan nukleus: cara zarah bergabung, berinteraksi dan dikaji."
  id: "Kuark, lepton, dan inti atom: cara partikel bergabung, berinteraksi, dan diteliti."
  hi: "क्वार्क, लेप्टॉन और परमाणु नाभिक: कण कैसे जुड़ते, इंटरैक्ट करते और कैसे पढ़े जाते हैं।"
outcomes:
  - en: "Explain quarks, leptons, hadrons and nuclei"
    zh: "解释夸克、轻子、强子和原子核"
    zh-TW: "解釋夸克、輕子、強子和原子核"
    ja: "クォーク・レプトン・ハドロン・原子核を説明する"
    ko: "쿼크·렙톤·강입자·원자핵 설명하기"
    vi: "Giải thích quark, lepton, hadron và hạt nhân"
    ms: "Menerangkan kuark, lepton, hadron dan nukleus"
    id: "Menjelaskan kuark, lepton, hadron, dan inti"
    hi: "क्वार्क, लेप्टॉन, हैड्रॉन और नाभिक समझाना"
  - en: "Solve problems with simple quantum reasoning"
    zh: "用简单量子推理解题"
    zh-TW: "用簡單量子推理解題"
    ja: "簡単な量子的考え方で問題を解く"
    ko: "간단한 양자 추론으로 문제 풀기"
    vi: "Giải bài bằng lập luận lượng tử đơn giản"
    ms: "Menyelesaikan masalah dengan penaakulan kuantum mudah"
    id: "Memecahkan soal dengan penalaran kuantum sederhana"
    hi: "सरल क्वांटम तर्क से सवाल हल करना"
