code: GERM20008
year: 2026
learn:
  en: "German through the idea of Heimat (home and belonging), from media on the Nazi past to today's debates on migration."
  zh: "通过“Heimat”（家园与归属）学德语，从纳粹历史的媒体到当今的移民讨论。"
  zh-TW: "透過「Heimat」（家園與歸屬）學德語，從納粹歷史的媒體到當今的移民討論。"
  ja: "「ハイマート」（故郷と帰属）を通してドイツ語を学ぶ。ナチ時代を扱うメディアから今の移民論争まで。"
  ko: "'하이마트'(고향과 소속)를 통해 독일어를 배운다. 나치 과거를 다룬 미디어부터 오늘의 이주 논쟁까지."
  vi: "Tiếng Đức qua ý niệm Heimat (quê hương, thuộc về), từ truyền thông về thời Quốc xã đến tranh luận di cư hôm nay."
  ms: "Bahasa Jerman melalui idea Heimat (kampung halaman dan rasa milik), dari media era Nazi hingga isu migrasi kini."
  id: "Bahasa Jerman lewat gagasan Heimat (rumah dan rasa memiliki), dari media masa Nazi hingga debat migrasi kini."
  hi: "हाइमाट (घर और अपनापन) के विचार से जर्मन: नाज़ी अतीत पर मीडिया से आज की प्रवास बहसों तक।"
outcomes:
  - en: "Discuss social and cultural topics in German"
    zh: "用德语讨论社会和文化话题"
    zh-TW: "用德語討論社會和文化話題"
    ja: "社会や文化の話題をドイツ語で話し合う"
    ko: "사회·문화 주제를 독일어로 토론하기"
    vi: "Thảo luận chủ đề xã hội, văn hóa bằng tiếng Đức"
    ms: "Bincangkan topik sosial dan budaya dalam bahasa Jerman"
    id: "Membahas topik sosial dan budaya dalam bahasa Jerman"
    hi: "सामाजिक और सांस्कृतिक विषयों पर जर्मन में चर्चा करना"
  - en: "Read and write longer German texts"
    zh: "读写较长的德语文章"
    zh-TW: "讀寫較長的德語文章"
    ja: "長めのドイツ語の文章を読み書きする"
    ko: "긴 독일어 글 읽고 쓰기"
    vi: "Đọc và viết văn bản tiếng Đức dài hơn"
    ms: "Baca dan tulis teks bahasa Jerman yang lebih panjang"
    id: "Membaca dan menulis teks bahasa Jerman yang lebih panjang"
    hi: "लंबे जर्मन पाठ पढ़ना-लिखना"
  - en: "Give a clear presentation in German"
    zh: "用德语做清楚的口头报告"
    zh-TW: "用德語做清楚的口頭報告"
    ja: "ドイツ語で分かりやすく発表する"
    ko: "독일어로 명확하게 발표하기"
    vi: "Thuyết trình rõ ràng bằng tiếng Đức"
    ms: "Buat pembentangan yang jelas dalam bahasa Jerman"
    id: "Melakukan presentasi yang jelas dalam bahasa Jerman"
    hi: "जर्मन में स्पष्ट प्रस्तुति देना"
