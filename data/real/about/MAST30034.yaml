code: MAST30034
year: 2026
learn:
  en: "Data science capstone: a team project solving real problems with big data, stats and computing."
  zh: "数据科学毕业课：小组用大数据、统计和编程解决实际问题。"
  zh-TW: "資料科學總結課：小組用大數據、統計和程式解決實際問題。"
  ja: "データサイエンスの総まとめ科目：ビッグデータ・統計・計算で実問題を解くチーム課題。"
  ko: "데이터 과학 캡스톤: 빅데이터, 통계, 컴퓨팅으로 실제 문제를 푸는 팀 프로젝트."
  vi: "Môn capstone khoa học dữ liệu: dự án nhóm giải bài toán thực tế bằng dữ liệu lớn, thống kê và tính toán."
  ms: "Capstone sains data: projek pasukan menyelesaikan masalah sebenar dengan data raya, statistik dan pengkomputeran."
  id: "Capstone sains data: proyek tim memecahkan masalah nyata dengan big data, statistik, dan komputasi."
  hi: "डेटा साइंस कैपस्टोन: बिग डेटा, सांख्यिकी और कंप्यूटिंग से असली समस्याएँ हल करने वाला टीम प्रोजेक्ट।"
outcomes:
  - en: "Clean and organise large data sets"
    zh: "清洗和整理大型数据集"
    zh-TW: "清理和整理大型資料集"
    ja: "大規模データを整理・クリーニングする"
    ko: "대용량 데이터셋 정리하기"
    vi: "Làm sạch và sắp xếp bộ dữ liệu lớn"
    ms: "Membersih dan menyusun set data besar"
    id: "Membersihkan dan merapikan data set besar"
    hi: "बड़े डेटा सेट साफ़ और व्यवस्थित करना"
  - en: "Fit and refine models, then visualise the results"
    zh: "拟合和改进模型并做可视化"
    zh-TW: "擬合和改進模型並做視覺化"
    ja: "モデルを当てはめ改良し、結果を可視化する"
    ko: "모델을 적합·개선하고 결과 시각화하기"
    vi: "Khớp và cải thiện mô hình, rồi trực quan hóa kết quả"
    ms: "Memadan dan memperhalus model, kemudian memvisualkan hasil"
    id: "Mencocokkan dan menyempurnakan model, lalu memvisualisasikan hasil"
    hi: "मॉडल फिट और बेहतर करना, फिर नतीजों का विज़ुअलाइज़ेशन"
  - en: "Present findings to technical and general audiences"
    zh: "向专业和非专业的人讲结果"
    zh-TW: "向專業和非專業的人報告結果"
    ja: "専門家にも一般の人にも結果を発表する"
    ko: "전문가와 일반인에게 결과 발표하기"
    vi: "Trình bày kết quả cho người trong ngành và người ngoài"
    ms: "Membentangkan dapatan kepada khalayak teknikal dan umum"
    id: "Mempresentasikan temuan ke audiens teknis dan umum"
    hi: "तकनीकी और आम लोगों के सामने नतीजे पेश करना"
