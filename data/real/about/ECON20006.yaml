code: ECON20006
year: 2026
learn:
  en: "Economic tools for real business decisions: pricing, products, mergers, regulation and e-commerce."
  zh: "用于商业决策的经济学工具：定价、产品、并购、监管和电商。"
  zh-TW: "用於商業決策的經濟學工具：定價、產品、併購、監管和電商。"
  ja: "ビジネス判断のための経済学：価格設定、製品、合併、規制、eコマース。"
  ko: "비즈니스 결정을 위한 경제학 도구: 가격, 제품, 인수합병, 규제, 전자상거래."
  vi: "Công cụ kinh tế cho quyết định kinh doanh: định giá, sản phẩm, sáp nhập, quy định và thương mại điện tử."
  ms: "Alat ekonomi untuk keputusan perniagaan: harga, produk, penggabungan, peraturan dan e-dagang."
  id: "Alat ekonomi untuk keputusan bisnis: harga, produk, merger, regulasi, dan e-commerce."
  hi: "बिज़नेस फ़ैसलों के लिए अर्थशास्त्र के औज़ार: क़ीमत, प्रोडक्ट, विलय, नियम और ई-कॉमर्स।"
outcomes:
  - en: "Explain pricing, product and advertising decisions"
    zh: "解释定价、产品和广告决策"
    zh-TW: "說明定價、產品和廣告決策"
    ja: "価格・製品・広告の判断を説明する"
    ko: "가격, 제품, 광고 결정 설명"
    vi: "Giải thích quyết định giá, sản phẩm và quảng cáo"
    ms: "Terangkan keputusan harga, produk dan pengiklanan"
    id: "Menjelaskan keputusan harga, produk, dan iklan"
    hi: "क़ीमत, प्रोडक्ट और विज्ञापन के फ़ैसले समझाना"
  - en: "Show how costs, demand and regulation shape business choices"
    zh: "说明成本、需求和监管如何影响商业选择"
    zh-TW: "說明成本、需求和監管如何影響商業選擇"
    ja: "コスト・需要・規制が企業の選択に与える影響を示す"
    ko: "원가, 수요, 규제가 기업 선택에 주는 영향 설명"
    vi: "Chỉ ra chi phí, cầu và quy định ảnh hưởng lựa chọn kinh doanh"
    ms: "Tunjuk kesan kos, permintaan dan peraturan pada pilihan"
    id: "Menunjukkan pengaruh biaya, permintaan, dan regulasi pada bisnis"
    hi: "लागत, माँग और नियम बिज़नेस के फ़ैसलों को कैसे बदलते हैं"
  - en: "Use benefit-cost analysis for risky decisions"
    zh: "用成本收益分析做有风险的决策"
    zh-TW: "用成本效益分析做有風險的決策"
    ja: "リスクのある判断に費用便益分析を使う"
    ko: "위험한 결정에 비용편익 분석 활용"
    vi: "Dùng phân tích lợi ích - chi phí cho quyết định rủi ro"
    ms: "Guna analisis kos-faedah untuk keputusan berisiko"
    id: "Memakai analisis biaya-manfaat untuk keputusan berisiko"
    hi: "जोखिम वाले फ़ैसलों में लागत-लाभ विश्लेषण"
