code: ECON30005
year: 2026
learn:
  en: "How banks and other financial institutions work, and how the Reserve Bank runs monetary policy in Australia."
  zh: "银行等金融机构如何运作，以及澳洲储备银行如何执行货币政策。"
  zh-TW: "銀行等金融機構如何運作，以及澳洲央行如何執行貨幣政策。"
  ja: "銀行などの金融機関の仕組みと、オーストラリア準備銀行の金融政策。"
  ko: "은행 등 금융기관의 작동 방식과 호주 중앙은행의 통화정책."
  vi: "Ngân hàng và tổ chức tài chính vận hành ra sao, và Ngân hàng Dự trữ Úc điều hành chính sách tiền tệ thế nào."
  ms: "Cara bank dan institusi kewangan berfungsi, dan cara Reserve Bank Australia jalankan dasar monetari."
  id: "Cara kerja bank dan lembaga keuangan, serta cara Reserve Bank Australia menjalankan kebijakan moneter."
  hi: "बैंक और दूसरी वित्तीय संस्थाएँ कैसे काम करती हैं, और ऑस्ट्रेलिया का रिज़र्व बैंक मौद्रिक नीति कैसे चलाता है।"
outcomes:
  - en: "Explain how banks make borrowing and lending possible"
    zh: "解释银行如何促成借贷"
    zh-TW: "解釋銀行如何促成借貸"
    ja: "銀行が貸し借りを可能にする仕組みを説明する"
    ko: "은행이 대출·차입을 가능하게 하는 방식 설명"
    vi: "Giải thích ngân hàng giúp việc vay và cho vay ra sao"
    ms: "Terangkan cara bank membolehkan pinjam meminjam"
    id: "Menjelaskan cara bank memungkinkan pinjam-meminjam"
    hi: "बैंक उधार लेना-देना कैसे संभव बनाते हैं, समझाना"
  - en: "Trace how monetary policy reaches the economy"
    zh: "追踪货币政策如何传导到经济"
    zh-TW: "追蹤貨幣政策如何傳導到經濟"
    ja: "金融政策が経済に届く経路をたどる"
    ko: "통화정책이 경제에 전달되는 경로 추적"
    vi: "Lần theo cách chính sách tiền tệ tác động đến nền kinh tế"
    ms: "Jejak cara dasar monetari sampai ke ekonomi"
    id: "Melacak cara kebijakan moneter sampai ke ekonomi"
    hi: "मौद्रिक नीति अर्थव्यवस्था तक कैसे पहुँचती है, समझना"
  - en: "Weigh the case for financial regulation"
    zh: "权衡金融监管的利弊"
    zh-TW: "權衡金融監理的利弊"
    ja: "金融規制の是非を考える"
    ko: "금융 규제의 근거 평가"
    vi: "Cân nhắc lý lẽ cho quản lý tài chính"
    ms: "Timbang hujah untuk peraturan kewangan"
    id: "Menimbang alasan regulasi keuangan"
    hi: "वित्तीय नियमन के पक्ष-विपक्ष तौलना"
