code: MUSI20240
year: 2026
learn:
  en: "Learn the shakuhachi, the Japanese bamboo flute, the traditional way: by listening, imitating and repeating with a master."
  zh: "学习日本尺八，按传统师徒方式：聆听、模仿、反复练习。"
  zh-TW: "學習日本尺八，按傳統師徒方式：聆聽、模仿、反覆練習。"
  ja: "尺八を伝統的な師弟方式で学ぶ：聴く、まねる、繰り返す。"
  ko: "일본 대나무 피리 샤쿠하치를 전통 도제식으로: 듣고, 따라 하고, 반복."
  vi: "Học shakuhachi, sáo trúc Nhật, theo lối truyền thống: nghe, bắt chước, lặp lại."
  ms: "Belajar shakuhachi, seruling buluh Jepun, secara tradisional: dengar, tiru, ulang."
  id: "Belajar shakuhachi, suling bambu Jepang, secara tradisional: dengar, tiru, ulangi."
  hi: "जापानी बाँसुरी शकुहाची पारंपरिक तरीके से: सुनना, नकल करना, दोहराना।"
outcomes:
  - en: "Play a traditional instrument with sound basic technique"
    zh: "掌握一件传统乐器的基本技巧"
    zh-TW: "掌握一件傳統樂器的基本技巧"
    ja: "伝統楽器の基本奏法を身につける"
    ko: "전통 악기의 기본 주법 익히기"
    vi: "Chơi một nhạc cụ truyền thống với kỹ thuật cơ bản"
    ms: "Main alat muzik tradisional dengan teknik asas"
    id: "Memainkan alat musik tradisional dengan teknik dasar"
    hi: "एक पारंपरिक वाद्य को बुनियादी तकनीक से बजाना"
  - en: "Learn music the traditional way: by listening and copying"
    zh: "以传统方式学习：靠听与模仿"
    zh-TW: "以傳統方式學習：靠聽與模仿"
    ja: "伝統的に学ぶ：聴いてまねる"
    ko: "전통 방식대로 듣고 따라 하며 배우기"
    vi: "Học theo lối truyền thống: nghe và bắt chước"
    ms: "Belajar cara tradisional: dengar dan tiru"
    id: "Belajar cara tradisional: mendengar dan meniru"
    hi: "पारंपरिक तरीके से सीखना: सुनकर और दोहराकर"
  - en: "Understand the culture behind the music"
    zh: "理解音乐背后的文化"
    zh-TW: "理解音樂背後的文化"
    ja: "音楽の背景にある文化を理解する"
    ko: "음악 뒤의 문화 이해하기"
    vi: "Hiểu văn hóa đứng sau âm nhạc"
    ms: "Fahami budaya di sebalik muzik"
    id: "Memahami budaya di balik musiknya"
    hi: "संगीत के पीछे की संस्कृति समझना"
