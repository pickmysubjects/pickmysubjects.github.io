code: RUSS10001
year: 2026
learn:
  en: "Russian from zero: talking about yourself, family, friends, where you live and what you do, plus life in Russia today."
  zh: "零基础俄语：谈自己、家人朋友、住处和日常活动，并了解当今俄罗斯生活。"
  zh-TW: "零基礎俄語：談自己、家人朋友、住處和日常活動，並了解當今俄羅斯生活。"
  ja: "ゼロから学ぶロシア語。自分や家族・友人、住まい、日々の活動、今のロシアの暮らし。"
  ko: "처음 배우는 러시아어. 나와 가족·친구, 사는 곳, 하는 일, 오늘날 러시아의 생활."
  vi: "Tiếng Nga từ đầu: nói về bản thân, gia đình, bạn bè, nơi ở, việc làm và đời sống Nga ngày nay."
  ms: "Bahasa Rusia dari asas: bercerita tentang diri, keluarga, kawan, tempat tinggal dan aktiviti, serta kehidupan Rusia kini."
  id: "Bahasa Rusia dari nol: bercerita tentang diri, keluarga, teman, tempat tinggal dan kegiatan, serta kehidupan Rusia kini."
  hi: "शून्य से रूसी: अपने, परिवार, दोस्तों, घर और रोज़ के कामों के बारे में बात, और आज के रूस का जीवन।"
outcomes:
  - en: "Hold simple everyday conversations in Russian"
    zh: "用俄语进行简单的日常对话"
    zh-TW: "用俄語進行簡單的日常對話"
    ja: "ロシア語で簡単な日常会話をする"
    ko: "러시아어로 간단한 일상 대화하기"
    vi: "Trò chuyện đơn giản hằng ngày bằng tiếng Nga"
    ms: "Berbual ringkas harian dalam bahasa Rusia"
    id: "Bercakap sederhana sehari-hari dalam bahasa Rusia"
    hi: "रूसी में सरल रोज़मर्रा की बातचीत करना"
  - en: "Read and write basic Russian words and sentences"
    zh: "读写基础俄语词句"
    zh-TW: "讀寫基礎俄語詞句"
    ja: "ロシア語の基本的な語や文を読み書きする"
    ko: "기초 러시아어 단어와 문장 읽고 쓰기"
    vi: "Đọc và viết từ, câu tiếng Nga cơ bản"
    ms: "Baca dan tulis perkataan serta ayat asas bahasa Rusia"
    id: "Membaca dan menulis kata serta kalimat dasar bahasa Rusia"
    hi: "रूसी के बुनियादी शब्द और वाक्य पढ़ना-लिखना"
  - en: "Understand everyday customs where Russian is spoken"
    zh: "了解使用俄语地区的日常习俗"
    zh-TW: "了解使用俄語地區的日常習俗"
    ja: "ロシア語が話される地域の日常の習慣を知る"
    ko: "러시아어 사용 지역의 일상 관습 이해하기"
    vi: "Hiểu phong tục hằng ngày nơi nói tiếng Nga"
    ms: "Fahami adat harian di tempat bahasa Rusia dituturkan"
    id: "Memahami kebiasaan sehari-hari di tempat bahasa Rusia dipakai"
    hi: "रूसी बोलने वाली जगहों के रोज़मर्रा के रीति-रिवाज समझना"
