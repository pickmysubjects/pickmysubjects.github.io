code: IBUS90002
year: 2027
learn:
  en: "How business is managed in Asia, seen through economics, culture and institutions, and making decisions there."
  zh: "从经济、文化和制度角度理解亚洲的企业管理，并在亚洲情境中作决策。"
  zh-TW: "從經濟、文化與制度角度理解亞洲的企業管理，並在亞洲情境中作決策。"
  ja: "経済・文化・制度の視点から見たアジアの経営と、そこでの意思決定。"
  ko: "경제·문화·제도 관점에서 본 아시아 경영과 그 속의 의사결정."
  vi: "Quản trị doanh nghiệp ở châu Á qua góc nhìn kinh tế, văn hóa, thể chế và cách ra quyết định ở đó."
  ms: "Pengurusan perniagaan di Asia dari sudut ekonomi, budaya dan institusi, serta membuat keputusan di sana."
  id: "Manajemen bisnis di Asia dari sisi ekonomi, budaya, dan institusi, serta pengambilan keputusan di sana."
  hi: "आर्थिक, सांस्कृतिक और संस्थागत नज़रिए से एशिया में व्यवसाय प्रबंधन और वहाँ निर्णय लेना।"
outcomes:
  - en: "Analyse the business environment in Asian countries"
    zh: "分析亚洲各国的商业环境"
    zh-TW: "分析亞洲各國的商業環境"
    ja: "アジア各国のビジネス環境を分析する"
    ko: "아시아 국가의 비즈니스 환경 분석하기"
    vi: "Phân tích môi trường kinh doanh ở các nước châu Á"
    ms: "Menganalisis persekitaran perniagaan negara Asia"
    id: "Menganalisis lingkungan bisnis negara-negara Asia"
    hi: "एशियाई देशों के व्यावसायिक माहौल का विश्लेषण"
  - en: "Solve problems for firms expanding in Asia"
    zh: "为拓展亚洲市场的企业解决问题"
    zh-TW: "為拓展亞洲市場的企業解決問題"
    ja: "アジアに進出する企業の課題を解決する"
    ko: "아시아 진출 기업의 문제 해결하기"
    vi: "Giải quyết vấn đề cho doanh nghiệp mở rộng ở châu Á"
    ms: "Menyelesaikan masalah firma yang berkembang di Asia"
    id: "Memecahkan masalah perusahaan yang berekspansi ke Asia"
    hi: "एशिया में विस्तार कर रही कंपनियों की समस्याएँ हल करना"
