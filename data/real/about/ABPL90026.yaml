code: ABPL90026
year: 2027
learn:
  en: "The property development process: market research, development appraisal, cash flow modelling, risk and return, using ARGUS tools."
  zh: "房地产开发流程：市场研究、开发评估、现金流建模、风险与回报，使用 ARGUS 工具。"
  zh-TW: "不動產開發流程：市場研究、開發評估、現金流建模、風險與報酬，使用 ARGUS 工具。"
  ja: "不動産開発の流れ：市場調査、開発収支評価、キャッシュフロー、リスクとリターン。ARGUS使用。"
  ko: "부동산 개발 과정: 시장 조사, 사업성 평가, 현금흐름 모델링, 위험과 수익. ARGUS 사용."
  vi: "Quy trình phát triển bất động sản: nghiên cứu thị trường, thẩm định, mô hình dòng tiền, rủi ro."
  ms: "Proses pembangunan hartanah: kajian pasaran, penilaian, model aliran tunai dan risiko, guna ARGUS."
  id: "Proses pengembangan properti: riset pasar, penilaian, model arus kas dan risiko, dengan ARGUS."
  hi: "संपत्ति विकास प्रक्रिया: बाज़ार शोध, मूल्यांकन, कैश फ़्लो मॉडल, जोखिम और रिटर्न, ARGUS के साथ।"
outcomes:
  - en: "Judge whether a development is worth building"
    zh: "判断一个开发项目是否值得建"
    zh-TW: "判斷一個開發案是否值得興建"
    ja: "開発が建てる価値があるか判断する"
    ko: "개발 사업의 추진 가치 판단하기"
    vi: "Đánh giá dự án có đáng xây không"
    ms: "Menilai sama ada pembangunan berbaloi"
    id: "Menilai apakah suatu pengembangan layak"
    hi: "विकास परियोजना बनाने लायक है या नहीं, आँकना"
  - en: "Model development cash flows and risk"
    zh: "为开发项目建立现金流和风险模型"
    zh-TW: "為開發案建立現金流與風險模型"
    ja: "開発のキャッシュフローとリスクをモデル化する"
    ko: "개발 현금흐름과 위험 모델링하기"
    vi: "Lập mô hình dòng tiền và rủi ro"
    ms: "Memodelkan aliran tunai dan risiko"
    id: "Memodelkan arus kas dan risiko"
    hi: "विकास का कैश फ़्लो और जोखिम मॉडल बनाना"
