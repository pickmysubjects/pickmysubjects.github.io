code: CRIM20013
year: 2026
learn:
  en: "Research methods for criminology, mostly qualitative and text-based, plus reading crime statistics with a critical eye."
  zh: "犯罪学的研究方法，以定性和文本分析为主，也学会批判地看犯罪数据。"
  zh-TW: "犯罪學的研究方法，以質性和文本分析為主，也學會批判地看犯罪數據。"
  ja: "犯罪学の研究方法を、質的・テキスト分析を中心に学び、犯罪統計を批判的に読む力もつける。"
  ko: "범죄학 연구 방법을 질적·텍스트 분석 중심으로 배우고, 범죄 통계를 비판적으로 읽는 법도 익힌다."
  vi: "Phương pháp nghiên cứu tội phạm học, chủ yếu định tính và phân tích văn bản, cùng cách đọc số liệu tội phạm một cách phản biện."
  ms: "Kaedah penyelidikan kriminologi, kebanyakannya kualitatif dan berasaskan teks, serta membaca statistik jenayah secara kritis."
  id: "Metode riset kriminologi, terutama kualitatif dan berbasis teks, serta membaca statistik kejahatan secara kritis."
  hi: "क्रिमिनोलॉजी की शोध विधियाँ, ज़्यादातर गुणात्मक और पाठ-आधारित, साथ में अपराध के आँकड़ों को आलोचनात्मक नज़र से पढ़ना।"
outcomes:
  - en: "Explain how research produces knowledge in criminology"
    zh: "说明研究如何在犯罪学中产生知识"
    zh-TW: "說明研究如何在犯罪學中產生知識"
    ja: "犯罪学で研究が知識を生む仕組みを説明する"
    ko: "범죄학에서 연구가 지식을 만드는 방식 설명하기"
    vi: "Giải thích cách nghiên cứu tạo ra tri thức trong tội phạm học"
    ms: "Terangkan cara penyelidikan menghasilkan ilmu dalam kriminologi"
    id: "Menjelaskan cara riset menghasilkan pengetahuan di kriminologi"
    hi: "समझाना कि क्रिमिनोलॉजी में शोध से ज्ञान कैसे बनता है"
  - en: "Compare knowledge systems, including Indigenous ones"
    zh: "比较不同知识体系，包括原住民的认知方式"
    zh-TW: "比較不同知識體系，包括原住民的認知方式"
    ja: "先住民の知を含むさまざまな知の体系を比べる"
    ko: "원주민 지식을 포함한 여러 지식 체계 비교하기"
    vi: "So sánh các hệ thống tri thức, kể cả của người bản địa"
    ms: "Bandingkan sistem ilmu, termasuk cara mengetahui Orang Asal"
    id: "Membandingkan sistem pengetahuan, termasuk cara pandang Pribumi"
    hi: "आदिवासी ज्ञान सहित अलग-अलग ज्ञान प्रणालियों की तुलना करना"
  - en: "Choose suitable methods for a criminology question"
    zh: "为犯罪学问题选择合适的研究方法"
    zh-TW: "為犯罪學問題選擇合適的研究方法"
    ja: "犯罪学の問いに合った研究方法を選ぶ"
    ko: "범죄학 질문에 맞는 연구 방법 고르기"
    vi: "Chọn phương pháp phù hợp cho một câu hỏi tội phạm học"
    ms: "Pilih kaedah sesuai untuk soalan kriminologi"
    id: "Memilih metode yang cocok untuk pertanyaan kriminologi"
    hi: "क्रिमिनोलॉजी के किसी सवाल के लिए सही विधि चुनना"
