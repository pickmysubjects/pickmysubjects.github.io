code: MCEN90018
year: 2027
learn:
  en: "Boundary layers and turbulence, plus collecting and analysing measurement data."
  zh: "边界层与湍流，以及测量数据的采集与分析。"
  zh-TW: "邊界層與紊流，以及量測資料的擷取與分析。"
  ja: "境界層と乱流、そして計測データの収集と解析。"
  ko: "경계층과 난류, 그리고 측정 데이터 수집·분석."
  vi: "Lớp biên và rối, cùng thu thập và phân tích dữ liệu đo."
  ms: "Lapisan sempadan dan gelora, serta pengumpulan dan analisis data ukuran."
  id: "Lapisan batas dan turbulensi, serta pengumpulan dan analisis data ukur."
  hi: "बाउंड्री लेयर और टर्बुलेंस, साथ ही मापन डेटा का संग्रह व विश्लेषण।"
outcomes:
  - en: "Apply boundary-layer theory to flow problems"
    zh: "把边界层理论用于流动问题"
    zh-TW: "把邊界層理論用於流動問題"
    ja: "境界層理論を流れの問題に適用する"
    ko: "경계층 이론을 유동 문제에 적용하기"
    vi: "Áp dụng lý thuyết lớp biên vào bài toán dòng chảy"
    ms: "Menggunakan teori lapisan sempadan pada masalah aliran"
    id: "Menerapkan teori lapisan batas pada masalah aliran"
    hi: "प्रवाह समस्याओं पर बाउंड्री-लेयर सिद्धांत लागू करना"
  - en: "Acquire and analyse sensor data"
    zh: "采集并分析传感器数据"
    zh-TW: "擷取並分析感測器資料"
    ja: "センサーデータを取得・解析する"
    ko: "센서 데이터 수집·분석하기"
    vi: "Thu thập và phân tích dữ liệu cảm biến"
    ms: "Memperoleh dan menganalisis data penderia"
    id: "Mengambil dan menganalisis data sensor"
    hi: "सेंसर डेटा एकत्र और विश्लेषण करना"
