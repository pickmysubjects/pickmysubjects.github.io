code: CRIM20002
year: 2026
learn:
  en: "The social and political side of criminal law: how it decides what counts as crime and how it governs areas like public space."
  zh: "刑法的社会和政治面向：它如何决定什么算犯罪，又如何管理公共空间等领域。"
  zh-TW: "刑法的社會和政治面向：它如何決定什麼算犯罪，又如何管理公共空間等領域。"
  ja: "刑法の社会的・政治的な側面、何を犯罪とするかをどう決め、公共空間などをどう規制するかを学ぶ。"
  ko: "형법의 사회적·정치적 측면, 무엇을 범죄로 정하는지, 공공 공간 같은 영역을 어떻게 규율하는지 배운다."
  vi: "Khía cạnh xã hội và chính trị của luật hình sự: cách nó quyết định điều gì là tội phạm và quản lý những lĩnh vực như không gian công cộng."
  ms: "Sisi sosial dan politik undang-undang jenayah: cara ia menentukan apa itu jenayah dan mengawal bidang seperti ruang awam."
  id: "Sisi sosial dan politik hukum pidana: cara menentukan apa yang termasuk kejahatan dan mengatur bidang seperti ruang publik."
  hi: "आपराधिक कानून का सामाजिक और राजनीतिक पहलू: यह कैसे तय करता है कि क्या अपराध है और सार्वजनिक जगह जैसे क्षेत्रों को कैसे नियंत्रित करता है।"
outcomes:
  - en: "Compare how law and criminology define crime"
    zh: "比较法律和犯罪学对犯罪的界定"
    zh-TW: "比較法律和犯罪學對犯罪的界定"
    ja: "法と犯罪学による犯罪の定義を比べる"
    ko: "법과 범죄학의 범죄 정의 비교하기"
    vi: "So sánh cách luật và tội phạm học định nghĩa tội phạm"
    ms: "Bandingkan takrif jenayah oleh undang-undang dan kriminologi"
    id: "Membandingkan definisi kejahatan menurut hukum dan kriminologi"
    hi: "कानून और क्रिमिनोलॉजी अपराध को कैसे परिभाषित करते हैं, तुलना करना"
  - en: "Explain the main steps of the criminal justice process"
    zh: "说明刑事司法程序的主要环节"
    zh-TW: "說明刑事司法程序的主要環節"
    ja: "刑事司法手続きの主な流れを説明する"
    ko: "형사 사법 절차의 주요 단계 설명하기"
    vi: "Giải thích các bước chính của tiến trình tư pháp hình sự"
    ms: "Terangkan langkah utama proses keadilan jenayah"
    id: "Menjelaskan tahap utama proses peradilan pidana"
    hi: "आपराधिक न्याय प्रक्रिया के मुख्य चरण समझाना"
  - en: "Analyse current debates over criminal law"
    zh: "分析当前围绕刑法的争论"
    zh-TW: "分析當前圍繞刑法的爭論"
    ja: "刑法をめぐる今の論争を分析する"
    ko: "형법을 둘러싼 현재 논쟁 분석하기"
    vi: "Phân tích các tranh luận hiện nay về luật hình sự"
    ms: "Analisis perdebatan semasa tentang undang-undang jenayah"
    id: "Menganalisis perdebatan terkini soal hukum pidana"
    hi: "आपराधिक कानून पर मौजूदा बहसों का विश्लेषण करना"
