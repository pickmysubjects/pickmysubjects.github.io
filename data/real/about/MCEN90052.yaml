code: MCEN90052
year: 2027
learn:
  en: "How microstructure gives materials their strength, and Python tools to model deformation and predict failure."
  zh: "显微组织如何决定材料强度，以及用 Python 工具模拟变形、预测失效。"
  zh-TW: "顯微組織如何決定材料強度，以及用 Python 工具模擬變形、預測破壞。"
  ja: "微細組織が材料の強さを生む仕組みと、Pythonで変形と破壊を予測する方法。"
  ko: "미세조직이 재료 강도를 만드는 원리와 Python으로 변형·파손 예측하기."
  vi: "Vi cấu trúc tạo nên độ bền vật liệu ra sao, và dùng Python mô phỏng biến dạng, dự đoán phá hủy."
  ms: "Cara mikrostruktur memberi kekuatan bahan, dan alat Python untuk memodel ubah bentuk serta meramal kegagalan."
  id: "Cara mikrostruktur memberi kekuatan material, dan alat Python untuk memodelkan deformasi serta memprediksi kegagalan."
  hi: "सूक्ष्म संरचना से सामग्री की मज़बूती, और Python से विरूपण मॉडल व विफलता का अनुमान।"
outcomes:
  - en: "Explain structure-property-processing links"
    zh: "解释结构、性能与加工之间的关系"
    zh-TW: "解釋結構、性質與加工之間的關係"
    ja: "組織・特性・加工の関係を説明する"
    ko: "구조-성질-가공 관계 설명하기"
    vi: "Giải thích mối liên hệ cấu trúc - tính chất - gia công"
    ms: "Menerangkan hubungan struktur-sifat-pemprosesan"
    id: "Menjelaskan hubungan struktur-sifat-pemrosesan"
    hi: "संरचना-गुण-प्रोसेसिंग संबंध समझाना"
  - en: "Use Python to predict material behaviour"
    zh: "用 Python 预测材料行为"
    zh-TW: "用 Python 預測材料行為"
    ja: "Pythonで材料の挙動を予測する"
    ko: "Python으로 재료 거동 예측하기"
    vi: "Dùng Python dự đoán hành vi vật liệu"
    ms: "Menggunakan Python untuk meramal kelakuan bahan"
    id: "Memakai Python untuk memprediksi perilaku material"
    hi: "Python से सामग्री के व्यवहार का अनुमान"
