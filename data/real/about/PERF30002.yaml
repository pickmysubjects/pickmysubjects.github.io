code: PERF30002
year: 2026
learn:
  en: "Work with Buxton Contemporary to curate and stage a live performance in a mixed team of musicians, dancers and designers."
  zh: "与Buxton当代美术馆合作，在音乐、舞蹈与设计的跨领域团队中策划并上演现场表演。"
  zh-TW: "與Buxton當代美術館合作，在音樂、舞蹈與設計的跨領域團隊中策劃並演出現場表演。"
  ja: "Buxton Contemporaryと組み、音楽・ダンス・デザインの混成チームでライブ公演を企画・上演する。"
  ko: "Buxton Contemporary와 함께 음악·무용·디자인 혼합 팀으로 라이브 공연을 기획·상연한다."
  vi: "Hợp tác Buxton Contemporary, cùng nhóm liên ngành dàn dựng một buổi biểu diễn trực tiếp."
  ms: "Bersama Buxton Contemporary, kurasi dan pentaskan persembahan langsung dalam pasukan rentas bidang."
  id: "Bersama Buxton Contemporary, mengkurasi dan mementaskan pertunjukan langsung dalam tim lintas bidang."
  hi: "Buxton Contemporary के साथ, बहु-विषयक टीम में लाइव परफ़ॉर्मेंस का क्यूरेशन और मंचन।"
outcomes:
  - en: "Curate a performance from an art collection"
    zh: "以艺术藏品为灵感策划表演"
    zh-TW: "以藝術典藏為靈感策劃表演"
    ja: "美術コレクションから公演を企画する"
    ko: "미술 소장품에서 공연 기획하기"
    vi: "Dựng biểu diễn lấy cảm hứng từ bộ sưu tập"
    ms: "Kurasi persembahan daripada koleksi seni"
    id: "Mengkurasi pertunjukan dari koleksi seni"
    hi: "कला संग्रह से प्रेरित परफ़ॉर्मेंस क्यूरेट करना"
  - en: "Collaborate across art and production roles"
    zh: "跨艺术与制作岗位协作"
    zh-TW: "跨藝術與製作職務協作"
    ja: "芸術と制作の役割を越えて協働する"
    ko: "예술·제작 역할을 넘나들며 협업하기"
    vi: "Phối hợp giữa vai trò nghệ thuật và sản xuất"
    ms: "Bekerjasama merentas peranan seni dan produksi"
    id: "Berkolaborasi lintas peran seni dan produksi"
    hi: "कला और प्रोडक्शन भूमिकाओं में मिलकर काम करना"
  - en: "Stage the show for a live audience"
    zh: "为现场观众完成演出"
    zh-TW: "為現場觀眾完成演出"
    ja: "観客の前で上演する"
    ko: "관객 앞에서 공연 올리기"
    vi: "Biểu diễn trước khán giả trực tiếp"
    ms: "Pentaskan persembahan untuk penonton"
    id: "Mementaskan pertunjukan di depan penonton"
    hi: "लाइव दर्शकों के सामने शो करना"
