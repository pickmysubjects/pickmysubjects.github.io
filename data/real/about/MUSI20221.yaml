code: MUSI20221
year: 2026
learn:
  en: "The last Sound Studies subject: advanced listening and how sound works with other media, ending in a creative folio."
  zh: 声音研究系列最后一门：进阶聆听，探讨声音与其他媒体的关系，最后交创作作品集。
  zh-TW: 聲音研究系列最後一門：進階聆聽，探討聲音與其他媒體的關係，最後交創作作品集。
  ja: サウンド・スタディーズ最終科目。高度なリスニングと他メディアでの音の役割を学び、創作作品集を提出。
  ko: 사운드 스터디 마지막 과목. 고급 듣기와 다른 매체 속 소리의 역할, 창작 포트폴리오로 마무리.
  vi: "Môn cuối chuỗi Sound Studies: nghe nâng cao, vai trò âm thanh trong các phương tiện khác, nộp bộ tác phẩm."
  ms: "Subjek terakhir Kajian Bunyi: mendengar lanjutan dan bunyi dalam media lain, diakhiri folio kreatif."
  id: "Mata kuliah terakhir Studi Bunyi: mendengar lanjutan, suara dalam media lain, diakhiri portofolio kreatif."
  hi: "साउंड स्टडीज़ का आख़िरी विषय: उन्नत श्रवण, अन्य मीडिया में ध्वनि, अंत में रचनात्मक फ़ोलियो।"
outcomes:
  - en: Analyse sound in media contexts
    zh: 分析媒体中的声音
    zh-TW: 分析媒體中的聲音
    ja: メディアの中の音を分析する
    ko: 매체 속 소리 분석하기
    vi: Phân tích âm thanh trong truyền thông
    ms: Analisis bunyi dalam konteks media
    id: Menganalisis suara dalam media
    hi: मीडिया में ध्वनि का विश्लेषण
  - en: Think critically about sound
    zh: 对声音进行批判性思考
    zh-TW: 對聲音進行批判性思考
    ja: 音について批判的に考える
    ko: 소리에 대해 비판적으로 사고하기
    vi: Tư duy phản biện về âm thanh
    ms: Berfikir kritis tentang bunyi
    id: Berpikir kritis tentang suara
    hi: ध्वनि पर आलोचनात्मक सोच
  - en: Build a creative folio of sound work
    zh: 完成声音创作作品集
    zh-TW: 完成聲音創作作品集
    ja: 音の創作作品集をまとめる
    ko: 사운드 창작 포트폴리오 만들기
    vi: Hoàn thành bộ tác phẩm âm thanh
    ms: Hasilkan folio karya bunyi kreatif
    id: Menyusun portofolio karya suara
    hi: ध्वनि कार्य का रचनात्मक फ़ोलियो बनाना
