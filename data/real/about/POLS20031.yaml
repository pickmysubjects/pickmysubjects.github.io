code: POLS20031
year: 2026
learn:
  en: "How politics and economics shape each other, through issues like inequality, trade, financial crises, climate and the rise of China."
  zh: "政治和经济如何相互影响，通过不平等、贸易、金融危机、气候和中国崛起等议题来看。"
  zh-TW: "政治和經濟如何相互影響，透過不平等、貿易、金融危機、氣候和中國崛起等議題來看。"
  ja: "政治と経済がどう影響し合うかを、格差、貿易、金融危機、気候、中国の台頭などの問題から学ぶ。"
  ko: "정치와 경제가 서로 어떻게 영향을 주는지 불평등, 무역, 금융 위기, 기후, 중국의 부상 같은 문제로 살펴본다."
  vi: "Chính trị và kinh tế tác động lẫn nhau ra sao, qua các vấn đề như bất bình đẳng, thương mại, khủng hoảng tài chính, khí hậu và sự trỗi dậy của Trung Quốc."
  ms: "Bagaimana politik dan ekonomi saling mempengaruhi, melalui isu seperti ketaksamaan, perdagangan, krisis kewangan, iklim dan kebangkitan China."
  id: "Bagaimana politik dan ekonomi saling memengaruhi, lewat isu seperti ketimpangan, perdagangan, krisis keuangan, iklim, dan kebangkitan Tiongkok."
  hi: "राजनीति और अर्थव्यवस्था एक-दूसरे को कैसे प्रभावित करती हैं, असमानता, व्यापार, वित्तीय संकट, जलवायु और चीन के उभार जैसे मुद्दों से।"
outcomes:
  - en: "Use political economy theories on current issues"
    zh: "用政治经济学理论分析当下议题"
    zh-TW: "用政治經濟學理論分析當下議題"
    ja: "政治経済学の理論で今の問題を分析する"
    ko: "정치경제학 이론으로 현재 문제 분석하기"
    vi: "Dùng lý thuyết kinh tế chính trị cho các vấn đề hiện nay"
    ms: "Guna teori ekonomi politik pada isu semasa"
    id: "Memakai teori ekonomi politik untuk isu terkini"
    hi: "मौजूदा मुद्दों पर राजनीतिक अर्थशास्त्र के सिद्धांत लागू करना"
  - en: "Explain the politics behind trade, tax and inequality"
    zh: "说明贸易、税收和不平等背后的政治"
    zh-TW: "說明貿易、稅收和不平等背後的政治"
    ja: "貿易、税、格差の背後にある政治を説明する"
    ko: "무역, 세금, 불평등 뒤의 정치 설명하기"
    vi: "Giải thích chính trị đằng sau thương mại, thuế và bất bình đẳng"
    ms: "Terangkan politik di sebalik perdagangan, cukai dan ketaksamaan"
    id: "Menjelaskan politik di balik perdagangan, pajak, dan ketimpangan"
    hi: "व्यापार, टैक्स और असमानता के पीछे की राजनीति समझाना"
  - en: "Analyse the causes and effects of financial crises"
    zh: "分析金融危机的成因和后果"
    zh-TW: "分析金融危機的成因和後果"
    ja: "金融危機の原因と影響を分析する"
    ko: "금융 위기의 원인과 결과 분석하기"
    vi: "Phân tích nguyên nhân và hậu quả của khủng hoảng tài chính"
    ms: "Analisis punca dan kesan krisis kewangan"
    id: "Menganalisis sebab dan akibat krisis keuangan"
    hi: "वित्तीय संकटों के कारणों और असर का विश्लेषण करना"
