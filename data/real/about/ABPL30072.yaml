code: ABPL30072
year: 2026
learn:
  en: "An interior design studio on materials: their properties and feel, plus sustainable, ethical and new material choices."
  zh: "关于材料的室内设计课：材料的性能与质感，以及可持续、合乎伦理和新兴材料的选择。"
  zh-TW: "關於材料的室內設計課：材料的性能與質感，以及永續、合乎倫理與新興材料的選擇。"
  ja: "素材を扱うインテリアスタジオ。素材の性質と表情、持続可能で倫理的な新素材の選び方。"
  ko: "재료를 다루는 실내디자인 스튜디오. 재료의 성질과 느낌, 지속가능·윤리적 신소재 선택."
  vi: "Studio nội thất về vật liệu: tính chất, cảm nhận, cùng lựa chọn vật liệu bền vững, có đạo đức và mới."
  ms: "Studio reka bentuk dalaman tentang bahan: sifat dan rasa, serta pilihan bahan lestari, beretika dan baharu."
  id: "Studio desain interior tentang material: sifat dan kesan, serta pilihan material berkelanjutan, etis, dan baru."
  hi: "सामग्री पर इंटीरियर स्टूडियो: उनके गुण और एहसास, टिकाऊ, नैतिक और नई सामग्री के चुनाव।"
outcomes:
  - en: "Compare material properties and uses in interiors"
    zh: "比较材料在室内中的性能和用途"
    zh-TW: "比較材料在室內中的性能與用途"
    ja: "室内での素材の性質と用途を比べる"
    ko: "실내에서 재료의 성질과 용도 비교하기"
    vi: "So sánh tính chất và công dụng vật liệu nội thất"
    ms: "Banding sifat dan kegunaan bahan dalaman"
    id: "Membandingkan sifat dan kegunaan material interior"
    hi: "इंटीरियर में सामग्री के गुण और उपयोग की तुलना"
  - en: "Choose sustainable and ethical materials"
    zh: "选择可持续且合乎伦理的材料"
    zh-TW: "選擇永續且合乎倫理的材料"
    ja: "持続可能で倫理的な素材を選ぶ"
    ko: "지속가능하고 윤리적인 재료 고르기"
    vi: "Chọn vật liệu bền vững và có đạo đức"
    ms: "Pilih bahan lestari dan beretika"
    id: "Memilih material berkelanjutan dan etis"
    hi: "टिकाऊ और नैतिक सामग्री चुनना"
  - en: "Balance function, looks and sustainability"
    zh: "兼顾功能、美观和可持续性"
    zh-TW: "兼顧機能、美觀與永續"
    ja: "機能・美しさ・持続可能性を両立させる"
    ko: "기능·미관·지속가능성 균형 맞추기"
    vi: "Cân bằng công năng, thẩm mỹ và bền vững"
    ms: "Seimbangkan fungsi, estetika dan kelestarian"
    id: "Menyeimbangkan fungsi, estetika, dan keberlanjutan"
    hi: "काम, सुंदरता और टिकाऊपन में संतुलन"
