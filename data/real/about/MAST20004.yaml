code: MAST20004
year: 2026
learn:
  en: "The maths of chance: random variables, distributions, and models like Poisson processes and Markov chains."
  zh: "概率的数学基础：随机变量、分布，以及泊松过程、马尔可夫链等模型。"
  zh-TW: "機率的數學基礎：隨機變數、分布，以及卜瓦松過程、馬可夫鏈等模型。"
  ja: "確率の数学：確率変数、分布、ポアソン過程やマルコフ連鎖などのモデル。"
  ko: "확률의 수학: 확률변수, 분포, 포아송 과정과 마르코프 연쇄 같은 모형."
  vi: "Toán xác suất: biến ngẫu nhiên, phân phối và các mô hình như quá trình Poisson, chuỗi Markov."
  ms: "Matematik peluang: pemboleh ubah rawak, taburan dan model seperti proses Poisson dan rantai Markov."
  id: "Matematika peluang: variabel acak, distribusi, dan model seperti proses Poisson dan rantai Markov."
  hi: "संभावना का गणित: रैंडम वेरिएबल, डिस्ट्रीब्यूशन और पॉइसन प्रोसेस व मार्कोव चेन जैसे मॉडल।"
outcomes:
  - en: "Turn uncertain real situations into probability models"
    zh: "把有不确定性的实际问题建成概率模型"
    zh-TW: "把有不確定性的實際問題建成機率模型"
    ja: "不確実な現実の状況を確率モデルにする"
    ko: "불확실한 실제 상황을 확률 모형으로 만들기"
    vi: "Biến tình huống thực tế bất định thành mô hình xác suất"
    ms: "Tukar situasi sebenar yang tidak pasti kepada model kebarangkalian"
    id: "Mengubah situasi nyata yang tak pasti jadi model peluang"
    hi: "अनिश्चित असली स्थितियों को प्रायिकता मॉडल में बदलना"
  - en: "Use conditional expectation and generating functions"
    zh: "会用条件期望和生成函数"
    zh-TW: "會用條件期望值和生成函數"
    ja: "条件付き期待値と母関数を使う"
    ko: "조건부 기댓값과 생성함수 활용"
    vi: "Dùng kỳ vọng có điều kiện và hàm sinh"
    ms: "Guna jangkaan bersyarat dan fungsi penjana"
    id: "Memakai ekspektasi bersyarat dan fungsi pembangkit"
    hi: "कंडीशनल एक्सपेक्टेशन और जनरेटिंग फ़ंक्शन इस्तेमाल करना"
  - en: "Interpret Poisson processes and Markov chains"
    zh: "理解泊松过程和马尔可夫链"
    zh-TW: "理解卜瓦松過程和馬可夫鏈"
    ja: "ポアソン過程とマルコフ連鎖を解釈する"
    ko: "포아송 과정과 마르코프 연쇄 해석"
    vi: "Diễn giải quá trình Poisson và chuỗi Markov"
    ms: "Tafsir proses Poisson dan rantai Markov"
    id: "Menafsirkan proses Poisson dan rantai Markov"
    hi: "पॉइसन प्रोसेस और मार्कोव चेन की व्याख्या करना"
