code: EURO20009
year: 2026
learn:
  en: "Wine in European culture: regions, styles, tasting and its place in social and business life."
  zh: "欧洲文化中的葡萄酒：产区、风格、品鉴及其在社交和商务中的角色。"
  zh-TW: "歐洲文化中的葡萄酒：產區、風格、品鑑及其在社交和商務中的角色。"
  ja: "ヨーロッパ文化におけるワイン。産地・スタイル・テイスティング、社交やビジネスでの役割。"
  ko: "유럽 문화 속 와인. 산지·스타일·시음, 그리고 사교와 비즈니스에서의 역할."
  vi: "Rượu vang trong văn hóa châu Âu: vùng trồng, phong cách, thưởng thức và vai trò trong giao tiếp."
  ms: "Wain dalam budaya Eropah: wilayah, gaya, rasa dan peranannya dalam kehidupan sosial dan perniagaan."
  id: "Anggur (wine) dalam budaya Eropa: wilayah, gaya, mencicipi dan perannya dalam kehidupan sosial."
  hi: "यूरोपीय संस्कृति में वाइन: क्षेत्र, शैलियाँ, चखना और सामाजिक व व्यावसायिक जीवन में इसकी जगह।"
outcomes:
  - en: "Describe the main wine regions and styles"
    zh: "介绍主要葡萄酒产区和风格"
    zh-TW: "介紹主要葡萄酒產區和風格"
    ja: "主なワイン産地とスタイルを説明する"
    ko: "주요 와인 산지와 스타일 설명하기"
    vi: "Mô tả các vùng và phong cách rượu vang chính"
    ms: "Huraikan wilayah dan gaya wain utama"
    id: "Menjelaskan wilayah dan gaya wine utama"
    hi: "मुख्य वाइन क्षेत्रों और शैलियों का वर्णन करना"
  - en: "Taste and describe wine systematically"
    zh: "系统地品鉴和描述葡萄酒"
    zh-TW: "系統地品鑑和描述葡萄酒"
    ja: "ワインを体系的に味わい表現する"
    ko: "와인을 체계적으로 맛보고 묘사하기"
    vi: "Nếm và mô tả rượu vang có hệ thống"
    ms: "Rasa dan huraikan wain secara sistematik"
    id: "Mencicipi dan mendeskripsikan wine secara sistematis"
    hi: "वाइन को व्यवस्थित ढंग से चखना और बताना"
  - en: "Explain wine's role in European social life"
    zh: "说明葡萄酒在欧洲社交生活中的作用"
    zh-TW: "說明葡萄酒在歐洲社交生活中的作用"
    ja: "ヨーロッパの社交でのワインの役割を説明する"
    ko: "유럽 사교 생활에서 와인의 역할 설명하기"
    vi: "Giải thích vai trò của rượu vang trong đời sống xã hội châu Âu"
    ms: "Terangkan peranan wain dalam kehidupan sosial Eropah"
    id: "Menjelaskan peran wine dalam kehidupan sosial Eropa"
    hi: "यूरोपीय सामाजिक जीवन में वाइन की भूमिका समझाना"
