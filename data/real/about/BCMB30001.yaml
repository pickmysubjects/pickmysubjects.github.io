code: BCMB30001
year: 2026
learn:
  en: "How a protein's 3D shape relates to what it does, and how this helps with drug design."
  zh: "蛋白质的三维结构和功能，以及它们怎样帮助药物设计。"
  zh-TW: "蛋白質的三維結構和功能，以及它們如何幫助藥物設計。"
  ja: "タンパク質の立体構造と機能の関係、それが創薬にどう役立つか。"
  ko: "단백질의 3D 구조와 기능의 관계, 그리고 신약 설계에 어떻게 도움이 되는지."
  vi: "Hình dạng 3D của protein liên quan chức năng ra sao, và giúp thiết kế thuốc thế nào."
  ms: "Kaitan bentuk 3D protein dengan fungsinya, dan cara ia membantu reka bentuk ubat."
  id: "Kaitan bentuk 3D protein dengan fungsinya, dan cara ini membantu desain obat."
  hi: "प्रोटीन की 3D बनावट उसके काम से कैसे जुड़ी है, और यह ड्रग डिज़ाइन में कैसे मदद करती है।"
outcomes:
  - en: "Analyse protein sequence and structure with software"
    zh: "用软件分析蛋白质序列和结构"
    zh-TW: "用軟體分析蛋白質序列和結構"
    ja: "ソフトでタンパク質の配列と構造を解析する"
    ko: "소프트웨어로 단백질 서열과 구조 분석하기"
    vi: "Phân tích trình tự và cấu trúc protein bằng phần mềm"
    ms: "Analisis jujukan dan struktur protein dengan perisian"
    id: "Menganalisis sekuens dan struktur protein dengan software"
    hi: "सॉफ़्टवेयर से प्रोटीन सीक्वेंस और संरचना का विश्लेषण"
  - en: "Plan experiments to study protein function"
    zh: "设计实验研究蛋白质功能"
    zh-TW: "設計實驗研究蛋白質功能"
    ja: "タンパク質の機能を調べる実験を計画する"
    ko: "단백질 기능 연구 실험 설계하기"
    vi: "Lên kế hoạch thí nghiệm nghiên cứu chức năng protein"
    ms: "Rancang eksperimen untuk kaji fungsi protein"
    id: "Merancang eksperimen untuk mempelajari fungsi protein"
    hi: "प्रोटीन के काम को समझने के प्रयोग प्लान करना"
  - en: "Critically read protein research papers"
    zh: "批判性阅读蛋白质研究论文"
    zh-TW: "批判性閱讀蛋白質研究論文"
    ja: "タンパク質の研究論文を批判的に読む"
    ko: "단백질 연구 논문 비판적으로 읽기"
    vi: "Đọc phản biện bài báo nghiên cứu protein"
    ms: "Baca kertas kajian protein secara kritis"
    id: "Membaca makalah riset protein secara kritis"
    hi: "प्रोटीन रिसर्च पेपर आलोचनात्मक रूप से पढ़ना"
