code: POLS10001
year: 2026
learn:
  en: "How Australian democracy works: the constitution, parliament, courts, parties, elections and voters, and how it handles policy challenges."
  zh: "澳大利亚民主如何运作：宪法、议会、法院、政党、选举和选民，以及它如何应对重大政策挑战。"
  zh-TW: "澳洲民主如何運作：憲法、國會、法院、政黨、選舉和選民，以及它如何因應重大政策挑戰。"
  ja: "オーストラリアの民主主義の仕組みを、憲法、議会、裁判所、政党、選挙、有権者から学び、大きな政策課題への対応も考える。"
  ko: "호주 민주주의가 어떻게 작동하는지 헌법, 의회, 법원, 정당, 선거, 유권자를 통해 배우고 큰 정책 과제에 어떻게 대응하는지 본다."
  vi: "Nền dân chủ Úc vận hành ra sao: hiến pháp, quốc hội, tòa án, đảng phái, bầu cử và cử tri, và cách nó xử lý các thách thức chính sách lớn."
  ms: "Cara demokrasi Australia berfungsi: perlembagaan, parlimen, mahkamah, parti, pilihan raya dan pengundi, serta cara ia menangani cabaran dasar besar."
  id: "Cara kerja demokrasi Australia: konstitusi, parlemen, pengadilan, partai, pemilu, dan pemilih, serta cara menghadapi tantangan kebijakan besar."
  hi: "ऑस्ट्रेलियाई लोकतंत्र कैसे चलता है: संविधान, संसद, अदालतें, पार्टियाँ, चुनाव और मतदाता, और यह बड़ी नीतिगत चुनौतियों से कैसे निपटता है।"
outcomes:
  - en: "Describe Australia's main political institutions"
    zh: "描述澳大利亚的主要政治机构"
    zh-TW: "描述澳洲的主要政治機構"
    ja: "オーストラリアの主な政治制度を説明する"
    ko: "호주의 주요 정치 제도 설명하기"
    vi: "Mô tả các thể chế chính trị chính của Úc"
    ms: "Huraikan institusi politik utama Australia"
    id: "Menjelaskan lembaga politik utama Australia"
    hi: "ऑस्ट्रेलिया की मुख्य राजनीतिक संस्थाओं का वर्णन करना"
  - en: "Explain the role of parties, voters and the media"
    zh: "说明政党、选民和媒体的作用"
    zh-TW: "說明政黨、選民和媒體的作用"
    ja: "政党、有権者、メディアの役割を説明する"
    ko: "정당, 유권자, 미디어의 역할 설명하기"
    vi: "Giải thích vai trò của đảng phái, cử tri và truyền thông"
    ms: "Terangkan peranan parti, pengundi dan media"
    id: "Menjelaskan peran partai, pemilih, dan media"
    hi: "पार्टियों, मतदाताओं और मीडिया की भूमिका समझाना"
  - en: "Judge how well the system deals with policy problems"
    zh: "评判这一体制应对政策难题的效果"
    zh-TW: "評判這一體制因應政策難題的成效"
    ja: "制度が政策課題にどれだけうまく対応できるか評価する"
    ko: "이 체제가 정책 문제에 얼마나 잘 대응하는지 평가하기"
    vi: "Đánh giá hệ thống xử lý các vấn đề chính sách tốt đến đâu"
    ms: "Nilai sejauh mana sistem menangani masalah dasar"
    id: "Menilai seberapa baik sistem menangani masalah kebijakan"
    hi: "परखना कि यह व्यवस्था नीतिगत समस्याओं को कितनी अच्छी तरह संभालती है"
