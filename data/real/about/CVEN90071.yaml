code: CVEN90071
year: 2027
learn:
  en: "Foundations for offshore wind turbines: seabed soils, geohazards, loads, site investigation and anchor design."
  zh: "海上风机基础：海床土、地质灾害、荷载、场地勘察和锚固设计。"
  zh-TW: "離岸風機基礎：海床土壤、地質災害、載重、基地調查與錨碇設計。"
  ja: "洋上風車の基礎：海底地盤、地盤災害、荷重、地盤調査、アンカー設計。"
  ko: "해상풍력 기초: 해저 지반, 지반 재해, 하중, 현장 조사, 앵커 설계."
  vi: "Móng tuabin gió ngoài khơi: đất đáy biển, tai biến địa chất, tải trọng, khảo sát và thiết kế neo."
  ms: "Asas turbin angin luar pesisir: tanah dasar laut, geobahaya, beban, penyiasatan tapak dan reka bentuk sauh."
  id: "Fondasi turbin angin lepas pantai: tanah dasar laut, geohazard, beban, penyelidikan lokasi dan desain jangkar."
  hi: "अपतटीय पवन टर्बाइनों की नींव: समुद्र तल की मिट्टी, भू-खतरे, भार, साइट जाँच और एंकर डिज़ाइन।"
outcomes:
  - en: "Describe seabed sediments and offshore geohazards"
    zh: "描述海床沉积物和海上地质灾害"
    zh-TW: "描述海床沉積物與離岸地質災害"
    ja: "海底堆積物と洋上の地盤災害を説明する"
    ko: "해저 퇴적물과 해상 지반 재해 설명하기"
    vi: "Mô tả trầm tích đáy biển và tai biến địa chất ngoài khơi"
    ms: "Menerangkan sedimen dasar laut dan geobahaya luar pesisir"
    id: "Menjelaskan sedimen dasar laut dan geohazard lepas pantai"
    hi: "समुद्र तल की तलछट और अपतटीय भू-खतरों का वर्णन"
  - en: "Analyse the loads on an offshore wind turbine"
    zh: "分析海上风机承受的荷载"
    zh-TW: "分析離岸風機承受的載重"
    ja: "洋上風車に作用する荷重を解析する"
    ko: "해상 풍력 터빈에 작용하는 하중 분석하기"
    vi: "Phân tích tải trọng tác dụng lên tuabin gió ngoài khơi"
    ms: "Menganalisis beban pada turbin angin luar pesisir"
    id: "Menganalisis beban pada turbin angin lepas pantai"
    hi: "अपतटीय पवन टर्बाइन पर भार का विश्लेषण"
  - en: "Design offshore wind foundations and anchors"
    zh: "设计海上风电基础和锚"
    zh-TW: "設計離岸風電基礎與錨碇"
    ja: "洋上風力の基礎とアンカーを設計する"
    ko: "해상풍력 기초와 앵커 설계하기"
    vi: "Thiết kế móng và neo cho điện gió ngoài khơi"
    ms: "Mereka bentuk asas dan sauh angin luar pesisir"
    id: "Merancang fondasi dan jangkar angin lepas pantai"
    hi: "अपतटीय पवन नींव और एंकर डिज़ाइन करना"
