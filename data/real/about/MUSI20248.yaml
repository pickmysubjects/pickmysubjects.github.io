code: MUSI20248
year: 2027
learn:
  en: "Hands-on team projects with industry and community partners: running jazz events, gigs, workshops and collaborations."
  zh: "与业界和社区合作的实践团队项目：组织爵士活动、演出、工作坊和合作。"
  zh-TW: "與業界和社區合作的實作團隊專案：籌辦爵士活動、演出、工作坊和合作。"
  ja: "業界や地域と組むチームプロジェクト：ジャズイベント、演奏、ワークショップ、共同制作の運営。"
  ko: "업계·지역사회와 함께하는 실전 팀 프로젝트: 재즈 행사, 공연, 워크숍, 협업 진행."
  vi: "Dự án nhóm thực tế với đối tác ngành và cộng đồng: tổ chức sự kiện jazz, biểu diễn, workshop và hợp tác."
  ms: "Projek pasukan praktikal bersama industri dan komuniti: anjur acara jazz, persembahan, bengkel dan kolaborasi."
  id: "Proyek tim praktik bersama industri dan komunitas: menggelar acara jazz, pertunjukan, workshop, dan kolaborasi."
  hi: "उद्योग व समुदाय के साथ व्यावहारिक टीम प्रोजेक्ट: जैज़ इवेंट, परफ़ॉर्मेंस, वर्कशॉप और सहयोग।"
outcomes:
  - en: "Work with industry professionals and organisations"
    zh: "与业界专业人士和机构合作"
    zh-TW: "與業界專業人士和機構合作"
    ja: "業界のプロや団体と協働する"
    ko: "업계 전문가 및 단체와 협업하기"
    vi: "Làm việc với chuyên gia và tổ chức trong ngành"
    ms: "Bekerja dengan profesional dan organisasi industri"
    id: "Bekerja dengan profesional dan organisasi industri"
    hi: "उद्योग के पेशेवरों व संगठनों के साथ काम करना"
  - en: "Engage diverse communities and audiences through music"
    zh: "用音乐吸引不同社群和观众"
    zh-TW: "用音樂吸引不同社群和觀眾"
    ja: "音楽で多様な地域や聴衆とつながる"
    ko: "음악으로 다양한 공동체와 관객 참여 이끌기"
    vi: "Kết nối cộng đồng và khán giả đa dạng qua âm nhạc"
    ms: "Libatkan komuniti dan penonton pelbagai melalui muzik"
    id: "Melibatkan komunitas dan penonton beragam lewat musik"
    hi: "संगीत से विविध समुदायों व दर्शकों को जोड़ना"
  - en: "Plan strategies for a career in music"
    zh: "规划音乐职业发展的策略"
    zh-TW: "規劃音樂職涯發展的策略"
    ja: "音楽のキャリア戦略を立てる"
    ko: "음악 커리어 전략 세우기"
    vi: "Xây dựng chiến lược cho sự nghiệp âm nhạc"
    ms: "Rancang strategi untuk kerjaya muzik"
    id: "Menyusun strategi karier di bidang musik"
    hi: "संगीत करियर की रणनीति बनाना"
