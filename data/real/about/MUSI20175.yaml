code: MUSI20175
year: 2026
learn:
  en: "One-on-one and group lessons in jazz and improvisation, building technique and the skill of composing in real time."
  zh: "爵士与即兴的个别课和小组课，提升技巧与即时创作能力。"
  zh-TW: "爵士與即興的個別課和小組課，提升技巧與即時創作能力。"
  ja: "ジャズと即興の個人・グループレッスンで技術とリアルタイム作曲力を磨く。"
  ko: "재즈·즉흥 개인/그룹 레슨으로 기술과 실시간 작곡 능력을 키움."
  vi: "Học cá nhân và nhóm về jazz, ngẫu hứng, rèn kỹ thuật và sáng tác tức thì."
  ms: "Pelajaran individu dan kumpulan jaz dan improvisasi, bina teknik dan gubahan masa nyata."
  id: "Les privat dan kelompok jazz dan improvisasi, melatih teknik dan menggubah seketika."
  hi: "जैज़ और इम्प्रोवाइज़ेशन की व्यक्तिगत व समूह कक्षाएँ, तकनीक और तत्काल रचना।"
outcomes:
  - en: "Apply intermediate jazz harmony and rhythm"
    zh: "运用中级爵士和声与节奏"
    zh-TW: "運用中級爵士和聲與節奏"
    ja: "中級のジャズ和声とリズムを使う"
    ko: "중급 재즈 화성과 리듬 활용하기"
    vi: "Áp dụng hòa âm, tiết tấu jazz trung cấp"
    ms: "Guna harmoni dan ritma jaz pertengahan"
    id: "Menerapkan harmoni dan ritme jazz menengah"
    hi: "मध्य-स्तर जैज़ हार्मनी और लय लगाना"
  - en: "Improvise with composing tools"
    zh: "运用作曲手法即兴演奏"
    zh-TW: "運用作曲手法即興演奏"
    ja: "作曲の手法を使って即興する"
    ko: "작곡 도구로 즉흥 연주하기"
    vi: "Ngẫu hứng bằng công cụ sáng tác"
    ms: "Berimprovisasi dengan alat gubahan"
    id: "Berimprovisasi dengan alat gubahan"
    hi: "रचना-तकनीकों से इम्प्रोवाइज़ करना"
  - en: "Plan and review your own practice"
    zh: "规划并检讨自己的练习"
    zh-TW: "規劃並檢討自己的練習"
    ja: "自分の練習を計画し見直す"
    ko: "자신의 연습 계획·점검하기"
    vi: "Lập kế hoạch và đánh giá việc luyện tập"
    ms: "Rancang dan nilai latihan sendiri"
    id: "Merencanakan dan menilai latihan sendiri"
    hi: "अपने अभ्यास की योजना और समीक्षा"
