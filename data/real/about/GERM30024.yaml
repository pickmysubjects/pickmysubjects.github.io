code: GERM30024
year: 2026
learn:
  en: "A study trip to Berlin and two other German states, exploring German identity, life in East Germany and migration."
  zh: "柏林及另外两个德国州的游学，探讨德国身份认同、东德生活和移民。"
  zh-TW: "柏林及另外兩個德國邦的遊學，探討德國身分認同、東德生活和移民。"
  ja: "ベルリンと他の2州をめぐる研修旅行。ドイツのアイデンティティ、東ドイツの暮らし、移民を探る。"
  ko: "베를린과 다른 두 주를 찾는 연수. 독일 정체성, 동독의 삶, 이주를 살펴본다."
  vi: "Chuyến học tại Berlin và hai bang khác của Đức, tìm hiểu bản sắc Đức, đời sống Đông Đức và di cư."
  ms: "Lawatan belajar ke Berlin dan dua negeri lain di Jerman, meneroka identiti Jerman, kehidupan Jerman Timur dan migrasi."
  id: "Perjalanan studi ke Berlin dan dua negara bagian lain, menelusuri identitas Jerman, kehidupan Jerman Timur dan migrasi."
  hi: "बर्लिन और जर्मनी के दो अन्य राज्यों की अध्ययन यात्रा: जर्मन पहचान, पूर्वी जर्मनी का जीवन और प्रवास।"
outcomes:
  - en: "Explain how the idea of Germany has changed"
    zh: "解释“德国”这一概念如何演变"
    zh-TW: "解釋「德國」這一概念如何演變"
    ja: "「ドイツ」という考えの移り変わりを説明する"
    ko: "'독일'이라는 개념의 변화 설명하기"
    vi: "Giải thích ý niệm về nước Đức đã thay đổi ra sao"
    ms: "Terangkan bagaimana idea tentang Jerman berubah"
    id: "Menjelaskan bagaimana gagasan tentang Jerman berubah"
    hi: "समझाना कि 'जर्मनी' का विचार कैसे बदला"
  - en: "Learn from sites and experiences on the ground"
    zh: "从实地参观和体验中学习"
    zh-TW: "從實地參訪和體驗中學習"
    ja: "現地の訪問や体験から学ぶ"
    ko: "현장 방문과 체험에서 배우기"
    vi: "Học từ các địa điểm và trải nghiệm thực tế"
    ms: "Belajar daripada lawatan dan pengalaman di lokasi"
    id: "Belajar dari kunjungan dan pengalaman di lapangan"
    hi: "स्थलों और ज़मीनी अनुभवों से सीखना"
  - en: "Compare regional histories and identities"
    zh: "比较各地区的历史和身份认同"
    zh-TW: "比較各地區的歷史和身分認同"
    ja: "地域ごとの歴史とアイデンティティを比べる"
    ko: "지역별 역사와 정체성 비교하기"
    vi: "So sánh lịch sử và bản sắc các vùng"
    ms: "Bandingkan sejarah dan identiti serantau"
    id: "Membandingkan sejarah dan identitas daerah"
    hi: "क्षेत्रीय इतिहासों और पहचानों की तुलना करना"
