code: PLAN10001
year: 2026
learn:
  en: "How cities like Melbourne grew and changed, the forces behind it, and what cities might become next."
  zh: "墨尔本等城市如何成长与变化、背后的力量，以及城市的未来。"
  zh-TW: "墨爾本等城市如何成長與變化、背後的力量，以及城市的未來。"
  ja: "メルボルンなどの都市の成長と変化、その原動力、そして都市の将来。"
  ko: "멜버른 같은 도시가 어떻게 성장·변화했는지, 그 원동력과 도시의 미래."
  vi: "Các thành phố như Melbourne phát triển và thay đổi ra sao, động lực phía sau, và tương lai đô thị."
  ms: "Cara bandar seperti Melbourne berkembang dan berubah, daya di sebaliknya, dan masa depan bandar."
  id: "Bagaimana kota seperti Melbourne tumbuh dan berubah, pendorongnya, dan masa depan kota."
  hi: "मेलबर्न जैसे शहर कैसे बढ़े और बदले, इसके पीछे की ताक़तें, और शहरों का भविष्य।"
outcomes:
  - en: "Explain the forces behind urban change"
    zh: "说明城市变化背后的力量"
    zh-TW: "說明城市變化背後的力量"
    ja: "都市変化の要因を説明する"
    ko: "도시 변화의 원인 설명하기"
    vi: "Giải thích động lực của thay đổi đô thị"
    ms: "Jelaskan daya di sebalik perubahan bandar"
    id: "Menjelaskan pendorong perubahan kota"
    hi: "शहरी बदलाव के पीछे की ताक़तें समझाना"
  - en: "Read a city's history from its streets"
    zh: "从街道读出城市的历史"
    zh-TW: "從街道讀出城市的歷史"
    ja: "街並みから都市の歴史を読む"
    ko: "거리에서 도시의 역사 읽기"
    vi: "Đọc lịch sử thành phố qua đường phố"
    ms: "Baca sejarah bandar dari jalannya"
    id: "Membaca sejarah kota dari jalan-jalannya"
    hi: "गलियों से शहर का इतिहास पढ़ना"
  - en: "Argue a view on the future of cities"
    zh: "就城市的未来提出观点"
    zh-TW: "就城市的未來提出觀點"
    ja: "都市の将来について意見を述べる"
    ko: "도시의 미래에 대한 관점 제시하기"
    vi: "Lập luận về tương lai của thành phố"
    ms: "Berhujah tentang masa depan bandar"
    id: "Berargumen tentang masa depan kota"
    hi: "शहरों के भविष्य पर अपनी राय रखना"
