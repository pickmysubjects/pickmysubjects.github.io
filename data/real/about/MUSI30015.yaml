code: MUSI30015
year: 2026
learn:
  en: "Western music from Hildegard to pop songs about sex, death and ecstasy, read through modern cultural theory."
  zh: "从希尔德加德到流行歌曲，用当代文化理论解读关于性、死亡与狂喜的西方音乐。"
  zh-TW: "從希爾德加德到流行歌曲，用當代文化理論解讀關於性、死亡與狂喜的西方音樂。"
  ja: "ヒルデガルトからポップまで、性・死・恍惚を扱う西洋音楽を現代文化理論で読む。"
  ko: "힐데가르트부터 팝까지 성·죽음·황홀을 다룬 서양음악을 현대 문화이론으로 읽는다."
  vi: "Nhạc phương Tây từ Hildegard tới nhạc pop về tình dục, cái chết, xuất thần, qua lý thuyết văn hóa."
  ms: "Muzik Barat dari Hildegard hingga lagu pop tentang seks, kematian dan ekstasi."
  id: "Musik Barat dari Hildegard hingga lagu pop tentang seks, kematian dan ekstase."
  hi: "हिल्डेगार्ड से पॉप तक सेक्स, मृत्यु और परमानंद पर पश्चिमी संगीत, सांस्कृतिक सिद्धांत से।"
outcomes:
  - en: "Discuss how music expresses sex, death and ecstasy"
    zh: "讨论音乐如何表达性、死亡与狂喜"
    zh-TW: "討論音樂如何表達性、死亡與狂喜"
    ja: "音楽が性・死・恍惚をどう表すか論じる"
    ko: "음악이 성·죽음·황홀을 표현하는 방식 논하기"
    vi: "Bàn về cách âm nhạc diễn tả tình dục, cái chết"
    ms: "Bincang cara muzik meluahkan seks dan kematian"
    id: "Membahas cara musik mengungkap seks dan kematian"
    hi: "संगीत सेक्स, मृत्यु और परमानंद कैसे दिखाता है, चर्चा"
  - en: "Apply cultural theory to musical works"
    zh: "将文化理论应用于音乐作品"
    zh-TW: "將文化理論應用於音樂作品"
    ja: "音楽作品に文化理論を当てはめる"
    ko: "음악 작품에 문화이론 적용하기"
    vi: "Áp dụng lý thuyết văn hóa vào tác phẩm"
    ms: "Guna teori budaya pada karya muzik"
    id: "Menerapkan teori budaya pada karya musik"
    hi: "संगीत रचनाओं पर सांस्कृतिक सिद्धांत लागू करना"
  - en: "Present and write well-argued responses"
    zh: "做有理有据的展示与写作"
    zh-TW: "做有理有據的展示與寫作"
    ja: "根拠ある発表と文章をまとめる"
    ko: "근거 있는 발표와 글 쓰기"
    vi: "Thuyết trình và viết có lập luận chặt"
    ms: "Bentang dan tulis respons berhujah kukuh"
    id: "Presentasi dan menulis tanggapan beralasan"
    hi: "सुतर्कित प्रस्तुति और लेखन करना"
