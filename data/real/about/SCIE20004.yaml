code: SCIE20004
year: 2026
learn:
  en: "One Health: how the health of people, animals and ecosystems connects, and solving problems across disciplines."
  zh: "同一健康：人、动物与生态系统的健康如何相连，以及跨学科解决问题。"
  zh-TW: "同一健康：人、動物與生態系統的健康如何相連，以及跨學科解決問題。"
  ja: "ワンヘルス：人・動物・生態系の健康のつながりと、分野を越えた問題解決。"
  ko: "원헬스: 사람·동물·생태계 건강의 연결과 학문을 넘나드는 문제 해결."
  vi: "One Health: sức khỏe con người, động vật và hệ sinh thái gắn kết ra sao, giải quyết vấn đề liên ngành."
  ms: "One Health: kaitan kesihatan manusia, haiwan dan ekosistem, serta penyelesaian masalah rentas bidang."
  id: "One Health: keterkaitan kesehatan manusia, hewan, dan ekosistem, serta pemecahan masalah lintas disiplin."
  hi: "वन हेल्थ: इंसानों, जानवरों और पारिस्थितिकी तंत्र का स्वास्थ्य कैसे जुड़ा है, और बहुविषयी समाधान।"
outcomes:
  - en: "Use systems thinking on global health problems"
    zh: "用系统思维分析全球健康问题"
    zh-TW: "用系統思維分析全球健康問題"
    ja: "地球規模の健康問題をシステム思考で捉える"
    ko: "세계 보건 문제에 시스템 사고 적용하기"
    vi: "Dùng tư duy hệ thống cho vấn đề sức khỏe toàn cầu"
    ms: "Guna pemikiran sistem untuk isu kesihatan global"
    id: "Memakai berpikir sistem untuk masalah kesehatan global"
    hi: "वैश्विक स्वास्थ्य समस्याओं पर सिस्टम थिंकिंग लगाना"
  - en: "Link human, animal and environmental health"
    zh: "把人类、动物和环境健康联系起来"
    zh-TW: "把人類、動物和環境健康聯繫起來"
    ja: "人・動物・環境の健康を結びつける"
    ko: "사람·동물·환경 건강 연결하기"
    vi: "Liên kết sức khỏe người, động vật và môi trường"
    ms: "Kaitkan kesihatan manusia, haiwan dan alam sekitar"
    id: "Mengaitkan kesehatan manusia, hewan, dan lingkungan"
    hi: "मानव, पशु और पर्यावरण स्वास्थ्य को जोड़ना"
  - en: "Work with ideas from other fields and cultures"
    zh: "吸收其他学科和文化的观点"
    zh-TW: "吸收其他學科和文化的觀點"
    ja: "他分野や他文化の考えを取り入れる"
    ko: "다른 분야·문화의 관점 활용하기"
    vi: "Vận dụng ý tưởng từ ngành và văn hóa khác"
    ms: "Gunakan idea dari bidang dan budaya lain"
    id: "Memakai gagasan dari bidang dan budaya lain"
    hi: "दूसरे क्षेत्रों और संस्कृतियों के विचार अपनाना"
