code: PSYC30016
year: 2026
learn:
  en: "Social and emotional growth across life, from childhood to old age: identity, gender, morals and relationships."
  zh: "从童年到老年的社交和情感发展：身份、性别、道德和关系。"
  zh-TW: "從童年到老年的社交和情感發展：身分認同、性別、道德和關係。"
  ja: "子ども時代から老年期までの社会的・感情的な成長：アイデンティティ、ジェンダー、道徳、人間関係。"
  ko: "아동기부터 노년기까지의 사회·정서 발달: 정체성, 젠더, 도덕, 관계."
  vi: "Phát triển xã hội và cảm xúc suốt đời, từ thơ ấu đến tuổi già: bản sắc, giới, đạo đức, các mối quan hệ."
  ms: "Perkembangan sosial dan emosi sepanjang hayat, dari kanak-kanak ke usia tua: identiti, gender, moral, hubungan."
  id: "Perkembangan sosial dan emosi sepanjang hidup, dari anak hingga lansia: identitas, gender, moral, hubungan."
  hi: "बचपन से बुढ़ापे तक सामाजिक व भावनात्मक विकास: पहचान, जेंडर, नैतिकता और रिश्ते।"
outcomes:
  - en: "Compare theories of lifelong social development"
    zh: "比较终身社会发展的各种理论"
    zh-TW: "比較終身社會發展的各種理論"
    ja: "生涯にわたる社会的発達の理論を比較する"
    ko: "전 생애 사회 발달 이론 비교"
    vi: "So sánh các lý thuyết phát triển xã hội suốt đời"
    ms: "Bandingkan teori perkembangan sosial sepanjang hayat"
    id: "Membandingkan teori perkembangan sosial sepanjang hidup"
    hi: "जीवनभर के सामाजिक विकास के सिद्धांतों की तुलना"
  - en: "Name the key tasks of each life stage"
    zh: "说出各人生阶段的主要任务"
    zh-TW: "說出各人生階段的主要任務"
    ja: "各ライフステージの主な課題を挙げる"
    ko: "각 생애 단계의 핵심 과제 말하기"
    vi: "Nêu nhiệm vụ chính của từng giai đoạn đời"
    ms: "Namakan tugas utama setiap peringkat hidup"
    id: "Menyebutkan tugas utama tiap tahap hidup"
    hi: "हर जीवन-पड़ाव के मुख्य काम बताना"
  - en: "Apply development theory to real lives"
    zh: "把发展理论用到真实生活中"
    zh-TW: "把發展理論用到真實生活中"
    ja: "発達理論を実際の人生に当てはめる"
    ko: "발달 이론을 실제 삶에 적용"
    vi: "Áp dụng lý thuyết phát triển vào đời thực"
    ms: "Gunakan teori perkembangan pada kehidupan sebenar"
    id: "Menerapkan teori perkembangan pada kehidupan nyata"
    hi: "विकास सिद्धांत को असल ज़िंदगी पर लागू करना"
