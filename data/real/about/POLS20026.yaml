code: POLS20026
year: 2026
learn:
  en: "How politics and media shape each other: agenda-setting, fake news, propaganda, celebrity politicians, satire and nonstop campaigning."
  zh: "政治与媒体如何相互塑造：议程设置、假新闻、宣传、明星政客、讽刺和永不停歇的竞选。"
  zh-TW: "政治與媒體如何相互塑造：議程設定、假新聞、宣傳、明星政客、諷刺和永不停歇的競選。"
  ja: "政治とメディアの相互作用。議題設定、フェイクニュース、プロパガンダ、タレント政治家、風刺、終わらない選挙運動。"
  ko: "정치와 미디어는 서로를 어떻게 만드나. 의제 설정, 가짜 뉴스, 선전, 셀럽 정치인, 풍자, 끝없는 선거운동."
  vi: "Chính trị và truyền thông định hình nhau ra sao: thiết lập nghị trình, tin giả, tuyên truyền, chính trị gia nổi tiếng, châm biếm."
  ms: "Cara politik dan media saling membentuk: penetapan agenda, berita palsu, propaganda, ahli politik selebriti, satira dan kempen berterusan."
  id: "Cara politik dan media saling membentuk: penentuan agenda, berita palsu, propaganda, politisi selebritas, satire dan kampanye tanpa henti."
  hi: "राजनीति और मीडिया एक-दूसरे को कैसे गढ़ते हैं: एजेंडा तय करना, फ़ेक न्यूज़, प्रचार, सेलिब्रिटी नेता, व्यंग्य और लगातार चुनाव प्रचार।"
outcomes:
  - en: "Explain how media set the political agenda"
    zh: "说明媒体如何设定政治议程"
    zh-TW: "說明媒體如何設定政治議程"
    ja: "メディアが政治の議題をどう決めるか説明する"
    ko: "미디어가 정치 의제를 정하는 방식 설명하기"
    vi: "Giải thích truyền thông thiết lập nghị trình chính trị ra sao"
    ms: "Terangkan cara media menetapkan agenda politik"
    id: "Menjelaskan cara media menentukan agenda politik"
    hi: "मीडिया राजनीतिक एजेंडा कैसे तय करता है, समझाना"
  - en: "Spot misinformation and propaganda"
    zh: "识别错误信息和宣传"
    zh-TW: "辨識錯誤資訊和宣傳"
    ja: "誤情報とプロパガンダを見抜く"
    ko: "허위 정보와 선전 알아보기"
    vi: "Nhận diện thông tin sai lệch và tuyên truyền"
    ms: "Kenal pasti maklumat salah dan propaganda"
    id: "Mengenali misinformasi dan propaganda"
    hi: "ग़लत सूचना और प्रचार पहचानना"
  - en: "Analyse real cases in writing and speech"
    zh: "通过写作和口头表达分析真实案例"
    zh-TW: "透過寫作和口頭表達分析真實案例"
    ja: "実例を文章と口頭で分析する"
    ko: "실제 사례를 글과 말로 분석하기"
    vi: "Phân tích tình huống thật qua viết và nói"
    ms: "Analisis kes sebenar secara bertulis dan lisan"
    id: "Menganalisis kasus nyata secara tertulis dan lisan"
    hi: "असली मामलों का लिखकर और बोलकर विश्लेषण करना"
