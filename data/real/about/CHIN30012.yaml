code: CHIN30012
year: 2026
learn:
  en: "Reading real Chinese economic and business documents, with guided help on vocabulary and style."
  zh: "在指导下阅读真实的中文经济和商务文件，学习相关词汇和文体。"
  zh-TW: "在指導下閱讀真實的中文經濟和商務文件，學習相關詞彙和文體。"
  ja: "中国語の経済・ビジネス文書を、語彙や文体の手引きを受けながら読む。"
  ko: "중국어 경제·비즈니스 문서를 어휘와 문체 안내를 받으며 읽는다."
  vi: "Đọc tài liệu kinh tế và kinh doanh tiếng Trung thật, có hướng dẫn về từ vựng và văn phong."
  ms: "Membaca dokumen ekonomi dan perniagaan sebenar dalam bahasa Cina, dengan bimbingan kosa kata dan gaya."
  id: "Membaca dokumen ekonomi dan bisnis asli berbahasa Mandarin, dengan panduan kosakata dan gaya."
  hi: "असली चीनी आर्थिक और व्यावसायिक दस्तावेज़ पढ़ना, शब्दावली और शैली पर मार्गदर्शन के साथ।"
outcomes:
  - en: "Read Chinese economic reports and documents"
    zh: "阅读中文经济报告和文件"
    zh-TW: "閱讀中文經濟報告和文件"
    ja: "中国語の経済報告や文書を読む"
    ko: "중국어 경제 보고서와 문서 읽기"
    vi: "Đọc báo cáo và tài liệu kinh tế tiếng Trung"
    ms: "Baca laporan dan dokumen ekonomi berbahasa Cina"
    id: "Membaca laporan dan dokumen ekonomi berbahasa Mandarin"
    hi: "चीनी आर्थिक रिपोर्टें और दस्तावेज़ पढ़ना"
  - en: "Use economic terms in Chinese accurately"
    zh: "准确使用中文经济术语"
    zh-TW: "準確使用中文經濟術語"
    ja: "中国語の経済用語を正しく使う"
    ko: "중국어 경제 용어 정확히 쓰기"
    vi: "Dùng chính xác thuật ngữ kinh tế tiếng Trung"
    ms: "Guna istilah ekonomi bahasa Cina dengan tepat"
    id: "Memakai istilah ekonomi bahasa Mandarin dengan tepat"
    hi: "चीनी आर्थिक शब्द सही इस्तेमाल करना"
  - en: "Summarise a Chinese document in your own words"
    zh: "用自己的话概括中文文件"
    zh-TW: "用自己的話概括中文文件"
    ja: "中国語の文書を自分の言葉で要約する"
    ko: "중국어 문서를 자기 말로 요약하기"
    vi: "Tóm tắt tài liệu tiếng Trung bằng lời của mình"
    ms: "Ringkaskan dokumen bahasa Cina dengan kata sendiri"
    id: "Merangkum dokumen berbahasa Mandarin dengan kata sendiri"
    hi: "चीनी दस्तावेज़ का अपने शब्दों में सार लिखना"
