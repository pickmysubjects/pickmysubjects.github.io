code: ABPL90458
year: 2027
learn:
  en: "A travelling studio in Hong Kong where you design interventions for a major urban development after site visits."
  zh: "赴香港的游学工作室，实地考察后为大型城市开发项目做设计。"
  zh-TW: "赴香港的遊學工作室，實地考察後為大型城市開發專案做設計。"
  ja: "香港を訪れ、現地見学の後に大規模都市開発の設計案をつくるスタジオ。"
  ko: "홍콩 답사 후 대규모 도시 개발을 위한 설계 개입을 만드는 스튜디오."
  vi: "Studio thực địa Hồng Kông: thiết kế can thiệp cho dự án phát triển đô thị lớn sau khi tham quan."
  ms: "Studio kembara Hong Kong untuk mereka intervensi bagi pembangunan bandar besar."
  id: "Studio perjalanan Hong Kong untuk mendesain intervensi bagi proyek kota besar."
  hi: "हांगकांग यात्रा स्टूडियो: साइट विज़िट के बाद बड़े शहरी विकास के लिए डिज़ाइन।"
outcomes:
  - en: "Analyse a city as a four-dimensional system"
    zh: "把城市当作四维系统来分析"
    zh-TW: "把城市當作四維系統來分析"
    ja: "都市を4次元のシステムとして分析する"
    ko: "도시를 4차원 시스템으로 분석하기"
    vi: "Phân tích đô thị như hệ thống bốn chiều"
    ms: "Menganalisis bandar sebagai sistem empat dimensi"
    id: "Menganalisis kota sebagai sistem empat dimensi"
    hi: "शहर को चार-आयामी प्रणाली के रूप में देखना"
  - en: "Design across scales"
    zh: "跨尺度进行设计"
    zh-TW: "跨尺度進行設計"
    ja: "スケールを越えて設計する"
    ko: "여러 스케일로 설계하기"
    vi: "Thiết kế qua nhiều tỷ lệ"
    ms: "Mereka merentas skala"
    id: "Mendesain lintas skala"
    hi: "विभिन्न पैमानों पर डिज़ाइन"
