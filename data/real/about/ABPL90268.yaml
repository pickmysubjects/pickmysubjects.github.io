code: ABPL90268
year: 2027
learn:
  en: "Designing and building facades and roofs: materials like glass and metal, waterproofing, wind, thermal control, fire safety and acoustics."
  zh: "立面与屋面的设计和施工：玻璃、金属等材料，防水、抗风、热工、防火和声学。"
  zh-TW: "立面與屋面的設計與施工：玻璃、金屬等材料，防水、抗風、熱工、防火與聲學。"
  ja: "ファサードと屋根の設計・施工：ガラスや金属、防水、風、断熱、防火、音響。"
  ko: "외피·지붕 설계와 시공: 유리·금속, 방수, 풍하중, 단열, 방화, 음향."
  vi: "Thiết kế và thi công mặt dựng, mái: kính, kim loại, chống thấm, gió, nhiệt, cháy, âm học."
  ms: "Reka bentuk dan pembinaan fasad dan bumbung: kaca, logam, kalis air, angin, haba dan kebakaran."
  id: "Desain dan konstruksi fasad dan atap: kaca, logam, kedap air, angin, termal dan kebakaran."
  hi: "फ़साड और छत का डिज़ाइन व निर्माण: काँच, धातु, जलरोधन, हवा, ताप, अग्नि और ध्वनि।"
outcomes:
  - en: "Assess a facade design against performance needs"
    zh: "按性能要求评估立面设计"
    zh-TW: "依性能要求評估立面設計"
    ja: "性能要件でファサード設計を評価する"
    ko: "성능 요건으로 외피 설계 평가하기"
    vi: "Đánh giá thiết kế mặt dựng theo yêu cầu"
    ms: "Menilai reka bentuk fasad mengikut keperluan"
    id: "Menilai desain fasad sesuai kebutuhan kinerja"
    hi: "प्रदर्शन ज़रूरतों पर फ़साड डिज़ाइन आँकना"
  - en: "Propose a construction method for a facade"
    zh: "为立面提出施工方法"
    zh-TW: "為立面提出施工方法"
    ja: "ファサードの施工方法を提案する"
    ko: "외피 시공 방법 제안하기"
    vi: "Đề xuất phương pháp thi công mặt dựng"
    ms: "Mencadang kaedah pembinaan fasad"
    id: "Mengusulkan metode konstruksi fasad"
    hi: "फ़साड के लिए निर्माण विधि सुझाना"
