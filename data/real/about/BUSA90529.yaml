code: BUSA90529
year: 2027
learn:
  en: "Taking a venture from an idea to a minimum viable product and first customer, with business and financial models."
  zh: "借助商业模式和财务模型，把创业想法做成最小可行产品并赢得首个客户。"
  zh-TW: "藉助商業模式與財務模型，把創業構想做成最小可行產品並贏得首位客戶。"
  ja: "ビジネスモデルと財務モデルを使い、アイデアからMVPと最初の顧客まで事業を育てる。"
  ko: "비즈니스 모델과 재무 모델로 아이디어를 최소기능제품과 첫 고객까지 발전시키기."
  vi: "Đưa ý tưởng khởi nghiệp thành sản phẩm khả thi tối thiểu và khách hàng đầu tiên, với mô hình kinh doanh, tài chính."
  ms: "Membawa idea usaha niaga kepada produk berdaya maju minimum dan pelanggan pertama, dengan model perniagaan dan kewangan."
  id: "Membawa ide usaha ke produk layak minimum dan pelanggan pertama, dengan model bisnis dan keuangan."
  hi: "बिज़नेस और वित्तीय मॉडल के साथ विचार से न्यूनतम व्यवहार्य उत्पाद और पहले ग्राहक तक उद्यम बनाना।"
outcomes:
  - en: "Build a business model with product-market fit"
    zh: "构建实现产品市场契合的商业模式"
    zh-TW: "建構達成產品市場契合的商業模式"
    ja: "プロダクトマーケットフィットのあるビジネスモデルを作る"
    ko: "제품-시장 적합성을 갖춘 비즈니스 모델 만들기"
    vi: "Xây dựng mô hình kinh doanh phù hợp sản phẩm-thị trường"
    ms: "Membina model perniagaan dengan kesesuaian produk-pasaran"
    id: "Membangun model bisnis dengan product-market fit"
    hi: "प्रोडक्ट-मार्केट फ़िट वाला बिज़नेस मॉडल बनाना"
  - en: "Develop a financial model for a new venture"
    zh: "为新创企业建立财务模型"
    zh-TW: "為新創事業建立財務模型"
    ja: "新規事業の財務モデルを作る"
    ko: "신생 기업의 재무 모델 개발하기"
    vi: "Xây dựng mô hình tài chính cho doanh nghiệp mới"
    ms: "Membangunkan model kewangan untuk usaha niaga baharu"
    id: "Menyusun model keuangan untuk usaha baru"
    hi: "नए उद्यम के लिए वित्तीय मॉडल बनाना"
