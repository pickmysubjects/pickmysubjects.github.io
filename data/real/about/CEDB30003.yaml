code: CEDB30003
year: 2026
learn:
  en: "How a fertilised egg becomes a whole animal, and how that links to genetic disease and tissue engineering."
  zh: "受精卵如何发育成完整动物，以及与遗传病和组织工程的联系。"
  zh-TW: "受精卵如何發育成完整動物，以及與遺傳疾病和組織工程的關聯。"
  ja: "受精卵が動物の体になるまでと、遺伝病や組織工学とのつながり。"
  ko: "수정란이 동물 한 개체가 되는 과정과 유전 질환·조직공학과의 연관."
  vi: "Trứng thụ tinh phát triển thành con vật thế nào, và liên hệ với bệnh di truyền, kỹ thuật mô."
  ms: "Bagaimana telur yang disenyawakan menjadi haiwan, dan kaitannya dengan penyakit genetik serta kejuruteraan tisu."
  id: "Bagaimana sel telur yang dibuahi menjadi hewan utuh, dan kaitannya dengan penyakit genetik serta rekayasa jaringan."
  hi: "निषेचित अंडा पूरा जानवर कैसे बनता है, और इसका आनुवंशिक रोग व टिशू इंजीनियरिंग से संबंध।"
outcomes:
  - en: "Explain how tissues and organs form"
    zh: "解释组织和器官如何形成"
    zh-TW: "解釋組織與器官如何形成"
    ja: "組織や器官の形成を説明する"
    ko: "조직과 기관의 형성 설명하기"
    vi: "Giải thích cách mô và cơ quan hình thành"
    ms: "Menerangkan pembentukan tisu dan organ"
    id: "Menjelaskan pembentukan jaringan dan organ"
    hi: "ऊतक और अंग कैसे बनते हैं, समझाना"
  - en: "Use lab and microscopy skills to collect data"
    zh: "用实验和显微技术收集数据"
    zh-TW: "用實驗與顯微技術收集數據"
    ja: "実験と顕微鏡技術でデータを集める"
    ko: "실험·현미경 기술로 데이터 수집하기"
    vi: "Dùng kỹ năng thí nghiệm, kính hiển vi thu dữ liệu"
    ms: "Guna kemahiran makmal dan mikroskop untuk data"
    id: "Memakai keterampilan lab dan mikroskop untuk data"
    hi: "लैब और माइक्रोस्कोपी से डेटा इकट्ठा करना"
  - en: "Critique key papers in developmental biology"
    zh: "评析发育生物学经典论文"
    zh-TW: "評析發育生物學經典論文"
    ja: "発生生物学の重要論文を批評する"
    ko: "발생생물학 주요 논문 비평하기"
    vi: "Phân tích các bài báo then chốt về sinh học phát triển"
    ms: "Menilai kertas penting biologi perkembangan"
    id: "Mengkritisi makalah penting biologi perkembangan"
    hi: "विकासात्मक जीवविज्ञान के प्रमुख शोधपत्र परखना"
