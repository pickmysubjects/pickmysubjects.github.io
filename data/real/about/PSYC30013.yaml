code: PSYC30013
year: 2026
learn:
  en: "Research methods and stats for psychology, plus how psychological tests measure traits."
  zh: "心理学的研究方法和统计，以及心理测验怎么测性格特质。"
  zh-TW: "心理學的研究方法和統計，以及心理測驗怎麼測量特質。"
  ja: "心理学の研究法と統計、そして心理テストで特性をどう測るか。"
  ko: "심리학 연구 방법과 통계, 그리고 심리 검사가 특성을 측정하는 방식."
  vi: "Phương pháp nghiên cứu và thống kê tâm lý, cùng cách trắc nghiệm tâm lý đo đặc điểm."
  ms: "Kaedah penyelidikan dan statistik psikologi, serta cara ujian psikologi mengukur sifat."
  id: "Metode riset dan statistik psikologi, plus cara tes psikologi mengukur sifat."
  hi: "साइकोलॉजी के रिसर्च तरीके और स्टैट्स, और मनोवैज्ञानिक टेस्ट गुणों को कैसे मापते हैं।"
outcomes:
  - en: "Turn a question into a testable research plan"
    zh: "把问题变成可检验的研究方案"
    zh-TW: "把問題變成可檢驗的研究計畫"
    ja: "問いを検証可能な研究計画にする"
    ko: "질문을 검증 가능한 연구 계획으로 만들기"
    vi: "Biến câu hỏi thành kế hoạch nghiên cứu kiểm chứng được"
    ms: "Jadikan soalan sebagai pelan kajian yang boleh diuji"
    id: "Mengubah pertanyaan jadi rencana riset yang bisa diuji"
    hi: "सवाल को जाँचने लायक रिसर्च प्लान में बदलना"
  - en: "Judge if a psychological test is reliable and valid"
    zh: "判断心理测验是否可靠有效"
    zh-TW: "判斷心理測驗是否可靠有效"
    ja: "心理テストの信頼性と妥当性を判断する"
    ko: "심리 검사의 신뢰도와 타당도 판단"
    vi: "Đánh giá trắc nghiệm tâm lý có tin cậy và hợp lệ không"
    ms: "Nilai sama ada ujian psikologi boleh dipercayai dan sah"
    id: "Menilai apakah tes psikologi reliabel dan valid"
    hi: "परखना कि मनोवैज्ञानिक टेस्ट भरोसेमंद और वैध है या नहीं"
  - en: "Spot limits of quantitative results in papers"
    zh: "看出论文中定量结果的局限"
    zh-TW: "看出論文中定量結果的局限"
    ja: "論文の量的結果の限界を見抜く"
    ko: "논문 속 정량적 결과의 한계 파악"
    vi: "Nhận ra giới hạn của kết quả định lượng trong bài báo"
    ms: "Kenal pasti had hasil kuantitatif dalam kertas kajian"
    id: "Mengenali batasan hasil kuantitatif di makalah"
    hi: "पेपर्स में मात्रात्मक नतीजों की सीमाएँ पहचानना"
