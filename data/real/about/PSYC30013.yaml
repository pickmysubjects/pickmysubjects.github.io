code: PSYC30013
year: 2026
learn:
  en: "Research methods and stats for psychology, plus how psychological tests measure traits."
  zh: "心理学的研究方法和统计，以及心理测验怎么测性格特质。"
outcomes:
  - en: "Turn a question into a testable research plan"
    zh: "把问题变成可检验的研究方案"
  - en: "Judge if a psychological test is reliable and valid"
    zh: "判断心理测验是否可靠有效"
  - en: "Spot limits of quantitative results in papers"
    zh: "看出论文中定量结果的局限"
