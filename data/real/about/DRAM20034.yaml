code: DRAM20034
year: 2026
learn:
  en: "Make theatre outside the usual stage: audio walks, durational and community work, ending in a festival show."
  zh: "在传统舞台外做戏：音频漫步、长时剧场与社区戏剧，最后在艺术节演出。"
  zh-TW: "在傳統舞台外做戲：音訊漫步、長時劇場與社區戲劇，最後在藝術節演出。"
  ja: "劇場の外で作る：音声ウォーク、長時間劇、地域演劇を経てフェスで上演。"
  ko: "극장 밖 연극: 오디오 워크, 장시간·지역 연극, 축제 공연으로 마무리."
  vi: "Làm kịch ngoài sân khấu: đi bộ âm thanh, kịch dài, kịch cộng đồng, diễn ở lễ hội."
  ms: "Teater di luar pentas biasa: jalan audio, durasi panjang, komuniti, pentas di festival."
  id: "Teater di luar panggung: jalan audio, durasional, komunitas, lalu tampil di festival."
  hi: "मंच से बाहर थिएटर: ऑडियो वॉक, लंबी अवधि और सामुदायिक काम, फिर फ़ेस्टिवल शो।"
outcomes:
  - en: "Create work for a public festival audience"
    zh: "为艺术节观众创作作品"
    zh-TW: "為藝術節觀眾創作作品"
    ja: "フェスの観客に向けて作品を作る"
    ko: "축제 관객을 위한 작품 만들기"
    vi: "Làm tác phẩm cho khán giả lễ hội"
    ms: "Cipta karya untuk penonton festival"
    id: "Membuat karya untuk penonton festival"
    hi: "फ़ेस्टिवल दर्शकों के लिए काम बनाना"
  - en: "Use applied and community theatre methods"
    zh: "运用应用与社区戏剧方法"
    zh-TW: "運用應用與社區戲劇方法"
    ja: "応用演劇・地域演劇の手法を使う"
    ko: "응용·지역 연극 방법 쓰기"
    vi: "Dùng phương pháp kịch cộng đồng"
    ms: "Guna kaedah teater gunaan dan komuniti"
    id: "Memakai metode teater terapan dan komunitas"
    hi: "एप्लाइड और सामुदायिक थिएटर तरीके अपनाना"
  - en: "Collaborate with students from another art form"
    zh: "与其他艺术专业学生合作"
    zh-TW: "與其他藝術專業學生合作"
    ja: "他分野の学生と協働する"
    ko: "다른 예술 분야 학생과 협업하기"
    vi: "Hợp tác với sinh viên ngành nghệ thuật khác"
    ms: "Bekerjasama dengan pelajar bidang seni lain"
    id: "Berkolaborasi dengan mahasiswa seni lain"
    hi: "दूसरी कला के छात्रों के साथ सहयोग"
