code: MUSI20246
year: 2027
learn:
  en: "A relaxed weekly session learning to play and sing traditional Celtic tunes and songs, and the history behind them."
  zh: "在轻松的每周聚会里学演奏和唱凯尔特传统曲调与歌曲，并了解背后的历史。"
  zh-TW: "在輕鬆的每週聚會裡學演奏和唱凱爾特傳統曲調與歌曲，並了解背後的歷史。"
  ja: "気軽な毎週のセッションで、ケルトの伝統曲や歌の演奏・歌唱とその歴史を学ぶ。"
  ko: "편안한 주간 세션에서 켈트 전통 곡과 노래를 연주하고 부르며 그 역사를 배움."
  vi: "Buổi sinh hoạt hằng tuần thoải mái để học chơi, hát các giai điệu, bài hát Celtic truyền thống và lịch sử của chúng."
  ms: "Sesi mingguan santai untuk belajar main dan nyanyi lagu tradisional Celtic serta sejarahnya."
  id: "Sesi mingguan santai untuk belajar memainkan dan menyanyikan lagu tradisional Celtic beserta sejarahnya."
  hi: "साप्ताहिक सहज सत्र में पारंपरिक केल्टिक धुनें व गीत बजाना-गाना और उनका इतिहास सीखना।"
outcomes:
  - en: "Play basic tunes from Celtic music"
    zh: "演奏凯尔特音乐的基本曲调"
    zh-TW: "演奏凱爾特音樂的基本曲調"
    ja: "ケルト音楽の基本的な曲を演奏する"
    ko: "켈트 음악의 기본 곡 연주하기"
    vi: "Chơi các giai điệu Celtic cơ bản"
    ms: "Main lagu asas muzik Celtic"
    id: "Memainkan lagu dasar musik Celtic"
    hi: "केल्टिक संगीत की बुनियादी धुनें बजाना"
  - en: "Play well with others in a traditional session"
    zh: "在传统聚会中与他人配合演奏"
    zh-TW: "在傳統聚會中與他人配合演奏"
    ja: "伝統的なセッションで他の人と協力して演奏する"
    ko: "전통 세션에서 다른 사람과 함께 연주하기"
    vi: "Phối hợp cùng người khác trong buổi chơi nhạc truyền thống"
    ms: "Bekerjasama dengan orang lain dalam sesi tradisional"
    id: "Bekerja sama dengan orang lain dalam sesi tradisional"
    hi: "पारंपरिक सत्र में दूसरों के साथ मिलकर बजाना"
  - en: "Understand where Celtic music is played today"
    zh: "了解凯尔特音乐如今的演出场合"
    zh-TW: "了解凱爾特音樂如今的演出場合"
    ja: "現在のケルト音楽の演奏の場を理解する"
    ko: "오늘날 켈트 음악의 연주 맥락 이해하기"
    vi: "Hiểu bối cảnh biểu diễn nhạc Celtic ngày nay"
    ms: "Fahami konteks persembahan muzik Celtic kini"
    id: "Memahami konteks pertunjukan musik Celtic saat ini"
    hi: "आज केल्टिक संगीत कहाँ-कैसे बजता है, समझना"
