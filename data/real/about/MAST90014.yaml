code: MAST90014
year: 2027
learn:
  en: "Operations research for industry: turning business problems into maths models and solving them with integer programming."
  zh: "面向工业的运筹学：把实际问题建成数学模型，并用混合整数规划求解。"
  zh-TW: "面向產業的作業研究：把實際問題建成數學模型，並用混合整數規劃求解。"
  ja: "産業向けOR：実問題を数理モデル化し、混合整数計画で解く。"
  ko: "산업용 운영과학: 실제 문제를 수리 모델로 만들고 혼합정수계획법으로 풀기."
  vi: "Vận trù học cho công nghiệp: mô hình hóa bài toán thực tế và giải bằng quy hoạch nguyên hỗn hợp."
  ms: "Penyelidikan operasi untuk industri: jadikan masalah sebenar model matematik dan selesaikan dengan pengaturcaraan integer."
  id: "Riset operasi untuk industri: ubah masalah nyata jadi model matematika dan selesaikan dengan pemrograman integer."
  hi: "उद्योग के लिए ऑपरेशंस रिसर्च: असली समस्याओं को गणितीय मॉडल बनाकर इंटीजर प्रोग्रामिंग से हल करना।"
outcomes:
  - en: "Formulate an industrial problem as an optimisation model"
    zh: "把工业问题表述为优化模型"
    zh-TW: "把產業問題表述為最佳化模型"
    ja: "産業の問題を最適化モデルに定式化する"
    ko: "산업 문제를 최적화 모델로 정식화하기"
    vi: "Lập mô hình tối ưu cho một bài toán công nghiệp"
    ms: "Merumus masalah industri sebagai model pengoptimuman"
    id: "Merumuskan masalah industri sebagai model optimasi"
    hi: "औद्योगिक समस्या को ऑप्टिमाइज़ेशन मॉडल में बदलना"
  - en: "Solve mixed-integer programs with software"
    zh: "用软件求解混合整数规划"
    zh-TW: "用軟體求解混合整數規劃"
    ja: "ソフトで混合整数計画問題を解く"
    ko: "소프트웨어로 혼합정수계획 풀기"
    vi: "Giải quy hoạch nguyên hỗn hợp bằng phần mềm"
    ms: "Menyelesaikan pengaturcaraan integer campuran dengan perisian"
    id: "Menyelesaikan program integer campuran dengan perangkat lunak"
    hi: "सॉफ़्टवेयर से मिक्स्ड-इंटीजर प्रोग्राम हल करना"
