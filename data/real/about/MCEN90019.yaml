code: MCEN90019
year: 2027
learn:
  en: "Combustion theory and how it applies to engines, gas turbines and rockets."
  zh: "燃烧理论及其在发动机、燃气轮机和火箭中的应用。"
  zh-TW: "燃燒理論及其在引擎、燃氣渦輪與火箭中的應用。"
  ja: "燃焼理論と、エンジン・ガスタービン・ロケットへの応用。"
  ko: "연소 이론과 엔진·가스터빈·로켓에의 응용."
  vi: "Lý thuyết cháy và ứng dụng trong động cơ, tua-bin khí, tên lửa."
  ms: "Teori pembakaran dan penggunaannya dalam enjin, turbin gas dan roket."
  id: "Teori pembakaran dan penerapannya pada mesin, turbin gas, dan roket."
  hi: "दहन सिद्धांत और इंजन, गैस टर्बाइन व रॉकेट में उसका उपयोग।"
outcomes:
  - en: "Use chemical thermodynamics and kinetics for flames"
    zh: "用化学热力学和动力学分析火焰"
    zh-TW: "用化學熱力學與動力學分析火焰"
    ja: "化学熱力学と反応速度論で火炎を扱う"
    ko: "화학 열역학과 반응속도론으로 화염 분석하기"
    vi: "Dùng nhiệt động hóa học và động học cho ngọn lửa"
    ms: "Menggunakan termodinamik kimia dan kinetik untuk nyalaan"
    id: "Memakai termodinamika kimia dan kinetika untuk nyala api"
    hi: "ज्वाला के लिए रासायनिक ऊष्मागतिकी और गतिकी"
  - en: "Analyse combustion and emissions in real engines"
    zh: "分析实际发动机中的燃烧与排放"
    zh-TW: "分析實際引擎中的燃燒與排放"
    ja: "実エンジンの燃焼と排出を分析する"
    ko: "실제 엔진의 연소와 배출 분석하기"
    vi: "Phân tích quá trình cháy và khí thải trong động cơ"
    ms: "Menganalisis pembakaran dan pelepasan dalam enjin"
    id: "Menganalisis pembakaran dan emisi pada mesin"
    hi: "असली इंजनों में दहन और उत्सर्जन का विश्लेषण"
