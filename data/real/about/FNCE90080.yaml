code: FNCE90080
year: 2027
learn:
  en: "Building and managing portfolios of cash, bonds and shares: index funds, ETFs, factor investing, investment software."
  zh: "构建和管理现金、债券和股票组合：指数基金、ETF、因子投资和投资软件。"
  zh-TW: "建構與管理現金、債券與股票組合：指數基金、ETF、因子投資與投資軟體。"
  ja: "現金・債券・株式のポートフォリオ構築と運用：インデックス、ETF、ファクター投資、投資ソフト。"
  ko: "현금·채권·주식 포트폴리오 구성과 운용: 인덱스펀드, ETF, 팩터 투자, 투자 소프트웨어."
  vi: "Xây dựng và quản lý danh mục tiền, trái phiếu, cổ phiếu: quỹ chỉ số, ETF, đầu tư theo nhân tố."
  ms: "Membina dan mengurus portfolio tunai, bon dan saham: dana indeks, ETF, pelaburan faktor, perisian."
  id: "Menyusun dan mengelola portofolio kas, obligasi dan saham: reksa dana indeks, ETF, investasi faktor."
  hi: "नकद, बॉन्ड और शेयर के पोर्टफोलियो बनाना-चलाना: इंडेक्स फंड, ETF, फैक्टर निवेश, निवेश सॉफ्टवेयर।"
outcomes:
  - en: "Design portfolios that fit an investor's goals"
    zh: "设计符合投资者目标的投资组合"
    zh-TW: "設計符合投資人目標的投資組合"
    ja: "投資家の目的に合うポートフォリオを設計する"
    ko: "투자자 목표에 맞는 포트폴리오 설계하기"
    vi: "Thiết kế danh mục phù hợp mục tiêu nhà đầu tư"
    ms: "Mereka portfolio yang sesuai matlamat pelabur"
    id: "Merancang portofolio sesuai tujuan investor"
    hi: "निवेशक के लक्ष्य के अनुसार पोर्टफोलियो बनाना"
  - en: "Use factor models to structure portfolios"
    zh: "用因子模型构建投资组合"
    zh-TW: "用因子模型建構投資組合"
    ja: "ファクターモデルでポートフォリオを組む"
    ko: "팩터 모형으로 포트폴리오 구성하기"
    vi: "Dùng mô hình nhân tố để cấu trúc danh mục"
    ms: "Menggunakan model faktor untuk menyusun portfolio"
    id: "Memakai model faktor untuk menyusun portofolio"
    hi: "फैक्टर मॉडल से पोर्टफोलियो की संरचना बनाना"
