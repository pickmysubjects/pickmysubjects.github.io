code: MKTG20006
year: 2026
learn:
  en: "How brands are built, positioned and measured, and how to make better decisions about them."
  zh: "品牌如何建立、定位和衡量，以及如何做出更好的品牌决策。"
  zh-TW: "品牌如何建立、定位和衡量，以及如何做出更好的品牌決策。"
  ja: "ブランドの築き方・位置づけ・測り方と、より良いブランド判断。"
  ko: "브랜드를 구축·포지셔닝·측정하는 법과 더 나은 브랜드 결정."
  vi: "Thương hiệu được xây dựng, định vị và đo lường ra sao, và cách ra quyết định tốt hơn về chúng."
  ms: "Cara jenama dibina, diposisikan dan diukur, serta cara buat keputusan jenama yang lebih baik."
  id: "Cara merek dibangun, diposisikan, dan diukur, serta cara membuat keputusan merek yang lebih baik."
  hi: "ब्रांड कैसे बनते हैं, उनकी पोज़िशनिंग और माप कैसे होती है, और उन पर बेहतर फ़ैसले कैसे लें।"
outcomes:
  - en: "Explain why brand management matters to firms"
    zh: "解释品牌管理对企业的重要性"
    zh-TW: "解釋品牌管理對企業的重要性"
    ja: "企業にとってのブランド管理の重要性を説明する"
    ko: "기업에 브랜드 관리가 중요한 이유 설명"
    vi: "Giải thích vì sao quản lý thương hiệu quan trọng với doanh nghiệp"
    ms: "Terangkan kepentingan pengurusan jenama bagi firma"
    id: "Menjelaskan pentingnya manajemen merek bagi perusahaan"
    hi: "कंपनियों के लिए ब्रांड मैनेजमेंट क्यों अहम है, समझाना"
  - en: "Use theory on brand equity and positioning"
    zh: "运用品牌资产和定位理论"
    zh-TW: "運用品牌權益和定位理論"
    ja: "ブランドエクイティとポジショニングの理論を使う"
    ko: "브랜드 자산과 포지셔닝 이론 활용"
    vi: "Dùng lý thuyết về tài sản và định vị thương hiệu"
    ms: "Guna teori ekuiti dan kedudukan jenama"
    id: "Memakai teori ekuitas dan posisi merek"
    hi: "ब्रांड इक्विटी और पोज़िशनिंग के सिद्धांत लगाना"
  - en: "Propose workable fixes for tricky brand problems"
    zh: "为棘手的品牌问题提出可行方案"
    zh-TW: "為棘手的品牌問題提出可行方案"
    ja: "難しいブランド課題に実行可能な解決策を出す"
    ko: "까다로운 브랜드 문제에 실행 가능한 해법 제시"
    vi: "Đề xuất giải pháp khả thi cho vấn đề thương hiệu khó"
    ms: "Cadang penyelesaian praktikal untuk masalah jenama sukar"
    id: "Mengusulkan solusi layak untuk masalah merek yang rumit"
    hi: "कठिन ब्रांड समस्याओं के व्यावहारिक हल सुझाना"
