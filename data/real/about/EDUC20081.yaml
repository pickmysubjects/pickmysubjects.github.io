code: EDUC20081
year: 2026
learn:
  en: "How literacy gives or takes away power, from censorship and propaganda to what schools choose to teach."
  zh: "读写能力如何赋予或剥夺权力，从审查到课程选择。"
  zh-TW: "讀寫能力如何賦予或剝奪權力，從審查到課程選擇。"
  ja: "検閲やプロパガンダから教材選びまで、読み書きが力をどう与え奪うか。"
  ko: "검열·선전부터 교육과정 선택까지, 문해력이 권력을 주고 빼앗는 방식."
  vi: "Khả năng đọc viết trao hay tước quyền lực ra sao, từ kiểm duyệt đến chương trình học."
  ms: "Cara literasi memberi atau merampas kuasa, daripada penapisan hingga pilihan kurikulum."
  id: "Cara literasi memberi atau merampas kuasa, dari sensor hingga pilihan kurikulum."
  hi: "साक्षरता कैसे ताकत देती या छीनती है, सेंसरशिप से लेकर पाठ्यक्रम चयन तक।"
outcomes:
  - en: "Explain the idea of multiple literacies"
    zh: "解释多元读写能力的概念"
    zh-TW: "解釋多元讀寫能力的概念"
    ja: "多様なリテラシーの考え方を説明する"
    ko: "다중 문해력 개념 설명하기"
    vi: "Giải thích khái niệm đa năng lực đọc viết"
    ms: "Terangkan konsep literasi pelbagai"
    id: "Menjelaskan konsep literasi majemuk"
    hi: "बहु-साक्षरता की अवधारणा समझाना"
  - en: "Analyse written, visual, oral and digital texts"
    zh: "分析文字、视觉、口头和数字文本"
    zh-TW: "分析文字、視覺、口語和數位文本"
    ja: "文字・視覚・口頭・デジタルのテキストを分析する"
    ko: "문자·시각·구술·디지털 텍스트 분석하기"
    vi: "Phân tích văn bản viết, hình ảnh, lời nói và số"
    ms: "Analisis teks bertulis, visual, lisan dan digital"
    id: "Menganalisis teks tulis, visual, lisan, dan digital"
    hi: "लिखित, दृश्य, मौखिक और डिजिटल पाठों का विश्लेषण"
  - en: "Link literacy practices to power and culture"
    zh: "把读写实践与权力和文化联系起来"
    zh-TW: "把讀寫實踐與權力和文化聯繫起來"
    ja: "読み書きの実践を権力や文化と結びつける"
    ko: "문해 실천을 권력·문화와 연결하기"
    vi: "Liên hệ việc đọc viết với quyền lực và văn hóa"
    ms: "Kaitkan amalan literasi dengan kuasa dan budaya"
    id: "Mengaitkan praktik literasi dengan kuasa dan budaya"
    hi: "साक्षरता प्रथाओं को सत्ता और संस्कृति से जोड़ना"
