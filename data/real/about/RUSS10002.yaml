code: RUSS10002
year: 2026
learn:
  en: "Follows Russian 1: telling stories in the past, school, work and free time, and the world around you."
  zh: "接续俄语 1：用过去时讲故事，谈学习、工作、休闲和身边的环境。"
  zh-TW: "接續俄語 1：用過去式講故事，談學習、工作、休閒和身邊的環境。"
  ja: "ロシア語1の続き。過去の出来事を語り、学校・仕事・余暇、身の回りの世界について話す。"
  ko: "러시아어 1에 이어 과거 이야기하기, 학교·일·여가, 주변 세계에 대해 말한다."
  vi: "Tiếp nối Russian 1: kể chuyện quá khứ, việc học, công việc, thời gian rảnh và thế giới quanh ta."
  ms: "Sambungan Russian 1: bercerita dalam kala lampau, sekolah, kerja, masa lapang dan dunia sekeliling."
  id: "Lanjutan Russian 1: bercerita tentang masa lalu, sekolah, kerja, waktu luang dan dunia sekitar."
  hi: "रूसी 1 के आगे: भूतकाल में किस्से, पढ़ाई, काम, ख़ाली समय और आसपास की दुनिया।"
outcomes:
  - en: "Talk about familiar topics in Russian with more confidence"
    zh: "更自信地用俄语谈论熟悉的话题"
    zh-TW: "更自信地用俄語談論熟悉的話題"
    ja: "身近な話題をロシア語でより自信を持って話す"
    ko: "익숙한 주제를 러시아어로 더 자신 있게 말하기"
    vi: "Nói về chủ đề quen thuộc bằng tiếng Nga tự tin hơn"
    ms: "Bercakap tentang topik biasa dalam bahasa Rusia dengan lebih yakin"
    id: "Membicarakan topik akrab dalam bahasa Rusia dengan lebih percaya diri"
    hi: "परिचित विषयों पर रूसी में ज़्यादा आत्मविश्वास से बात करना"
  - en: "Read and write short Russian texts"
    zh: "读写简短的俄语文章"
    zh-TW: "讀寫簡短的俄語文章"
    ja: "短いロシア語の文章を読み書きする"
    ko: "짧은 러시아어 글 읽고 쓰기"
    vi: "Đọc và viết đoạn văn tiếng Nga ngắn"
    ms: "Baca dan tulis teks pendek bahasa Rusia"
    id: "Membaca dan menulis teks pendek bahasa Rusia"
    hi: "छोटे रूसी पाठ पढ़ना-लिखना"
  - en: "Use new grammar and vocabulary correctly"
    zh: "正确运用新语法和词汇"
    zh-TW: "正確運用新文法和詞彙"
    ja: "新しい文法と語彙を正しく使う"
    ko: "새 문법과 어휘를 정확히 쓰기"
    vi: "Dùng đúng ngữ pháp và từ vựng mới"
    ms: "Guna tatabahasa dan kosa kata baharu dengan betul"
    id: "Memakai tata bahasa dan kosakata baru dengan benar"
    hi: "नया व्याकरण और शब्दावली सही इस्तेमाल करना"
