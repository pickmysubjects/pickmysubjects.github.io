code: EDUC10048
year: 2026
learn:
  en: "How play, creativity and the arts help children and adults learn, with hands-on art workshops and sessions with kids."
  zh: "游戏、创造力和艺术如何帮助儿童和成人学习，含动手艺术工作坊和与孩子互动。"
  zh-TW: "遊戲、創造力和藝術如何幫助兒童和成人學習，含動手藝術工作坊和與孩子互動。"
  ja: "遊び・創造性・芸術が子どもと大人の学びをどう支えるか。実技ワークショップと子どもとの活動あり。"
  ko: "놀이·창의성·예술이 아이와 어른의 배움을 어떻게 돕는지, 실습 워크숍과 아이들과의 활동 포함."
  vi: "Vui chơi, sáng tạo và nghệ thuật giúp trẻ em và người lớn học ra sao, có workshop thực hành và hoạt động cùng trẻ."
  ms: "Bagaimana permainan, kreativiti dan seni membantu kanak-kanak dan dewasa belajar, dengan bengkel seni dan sesi bersama kanak-kanak."
  id: "Bagaimana bermain, kreativitas dan seni membantu anak dan orang dewasa belajar, dengan lokakarya seni dan sesi bersama anak."
  hi: "खेल, रचनात्मकता और कला बच्चों व बड़ों के सीखने में कैसे मदद करते हैं, आर्ट वर्कशॉप और बच्चों के साथ सत्र।"
outcomes:
  - en: "Reflect critically on arts and play experiences"
    zh: "批判性反思艺术与游戏体验"
    zh-TW: "批判性反思藝術與遊戲體驗"
    ja: "芸術と遊びの経験を批判的に振り返る"
    ko: "예술과 놀이 경험을 비판적으로 성찰하기"
    vi: "Suy ngẫm phản biện về trải nghiệm nghệ thuật và vui chơi"
    ms: "Renungkan secara kritis pengalaman seni dan bermain"
    id: "Merefleksikan kritis pengalaman seni dan bermain"
    hi: "कला और खेल के अनुभवों पर आलोचनात्मक चिंतन"
  - en: "Explain how the arts and play engage young people"
    zh: "解释艺术和游戏如何吸引年轻人参与"
    zh-TW: "解釋藝術和遊戲如何吸引年輕人參與"
    ja: "芸術と遊びが若者をどう引きつけるか説明する"
    ko: "예술과 놀이가 아이들을 어떻게 몰입시키는지 설명하기"
    vi: "Giải thích nghệ thuật và vui chơi thu hút người trẻ ra sao"
    ms: "Terangkan cara seni dan bermain melibatkan anak muda"
    id: "Menjelaskan cara seni dan bermain melibatkan anak muda"
    hi: "समझाना कि कला और खेल युवाओं को कैसे जोड़ते हैं"
  - en: "Analyse your own practice working with children"
    zh: "分析自己与孩子互动的实践"
    zh-TW: "分析自己與孩子互動的實踐"
    ja: "子どもと関わる自分の実践を分析する"
    ko: "아이들과 함께한 자신의 실천 분석하기"
    vi: "Phân tích cách bạn làm việc với trẻ em"
    ms: "Analisis amalan sendiri bersama kanak-kanak"
    id: "Menganalisis praktik sendiri bersama anak-anak"
    hi: "बच्चों के साथ अपने काम का विश्लेषण करना"
