code: ABPL90031
year: 2027
learn:
  en: "Managing the property organisations use for their operations: strategy, tenure decisions, portfolios, workplaces and performance."
  zh: "管理企业自用物业：战略、租买决策、资产组合、办公场所和绩效。"
  zh-TW: "管理企業自用不動產：策略、租購決策、資產組合、工作場所與績效。"
  ja: "企業が使う不動産の管理：戦略、保有形態、ポートフォリオ、職場、評価。"
  ko: "기업 사용 부동산 관리: 전략, 보유 방식, 포트폴리오, 업무 공간, 성과."
  vi: "Quản lý bất động sản doanh nghiệp: chiến lược, thuê hay mua, danh mục, nơi làm việc."
  ms: "Mengurus hartanah korporat: strategi, keputusan pegangan, portfolio dan tempat kerja."
  id: "Mengelola properti korporat: strategi, keputusan sewa/beli, portofolio dan tempat kerja."
  hi: "संगठनों की परिचालन संपत्ति का प्रबंधन: रणनीति, किराया-खरीद, पोर्टफ़ोलियो और कार्यस्थल।"
outcomes:
  - en: "Align property decisions with business strategy"
    zh: "使物业决策与企业战略一致"
    zh-TW: "使不動產決策與企業策略一致"
    ja: "不動産の判断を経営戦略に合わせる"
    ko: "부동산 결정을 경영 전략과 맞추기"
    vi: "Gắn quyết định bất động sản với chiến lược"
    ms: "Menyelaraskan keputusan hartanah dengan strategi"
    id: "Menyelaraskan keputusan properti dengan strategi"
    hi: "संपत्ति निर्णयों को व्यावसायिक रणनीति से जोड़ना"
  - en: "Analyse a corporate property portfolio"
    zh: "分析企业物业组合"
    zh-TW: "分析企業不動產組合"
    ja: "企業の不動産ポートフォリオを分析する"
    ko: "기업 부동산 포트폴리오 분석하기"
    vi: "Phân tích danh mục bất động sản doanh nghiệp"
    ms: "Menganalisis portfolio hartanah korporat"
    id: "Menganalisis portofolio properti korporat"
    hi: "कॉरपोरेट संपत्ति पोर्टफ़ोलियो का विश्लेषण"
