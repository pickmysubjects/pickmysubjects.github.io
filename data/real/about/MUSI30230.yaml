code: MUSI30230
year: 2026
learn:
  en: "Build a collaboration and stage your own audio-visual event of new music and sound made this semester."
  zh: "建立合作，并举办本学期新创音乐与声音的个人视听活动。"
  zh-TW: "建立合作，並舉辦本學期新創音樂與聲音的個人視聽活動。"
  ja: "共同制作を組み、今学期の新作による視聴覚イベントを自ら開く。"
  ko: "협업을 꾸려 이번 학기 신작으로 개인 시청각 이벤트 열기."
  vi: "Xây dựng hợp tác và tổ chức sự kiện nghe nhìn với tác phẩm mới trong kỳ."
  ms: "Bina kolaborasi dan anjurkan acara audio-visual karya baharu semester ini."
  id: "Membangun kolaborasi dan menggelar acara audio-visual karya baru semester ini."
  hi: "सहयोग बनाकर इस सेमेस्टर की नई कृतियों का अपना ऑडियो-विज़ुअल इवेंट करना।"
outcomes:
  - en: "Compose music and sound for other media"
    zh: "为其他媒体创作音乐和声音"
    zh-TW: "為其他媒體創作音樂與聲音"
    ja: "他メディアのための音楽と音を作る"
    ko: "다른 매체를 위한 음악·사운드 작곡"
    vi: "Sáng tác âm nhạc cho truyền thông khác"
    ms: "Gubah muzik dan bunyi untuk media lain"
    id: "Menggubah musik dan suara untuk media lain"
    hi: "अन्य मीडिया के लिए संगीत व ध्वनि रचना"
  - en: "Use sound production techniques"
    zh: "运用声音制作技术"
    zh-TW: "運用聲音製作技術"
    ja: "音響制作の技術を使う"
    ko: "사운드 제작 기법 활용"
    vi: "Dùng kỹ thuật sản xuất âm thanh"
    ms: "Guna teknik penerbitan bunyi"
    id: "Memakai teknik produksi suara"
    hi: "साउंड प्रोडक्शन तकनीकें प्रयोग करना"
  - en: "Plan and run a live event"
    zh: "策划并执行现场活动"
    zh-TW: "策劃並執行現場活動"
    ja: "ライブイベントを企画・運営する"
    ko: "라이브 이벤트 기획·운영"
    vi: "Lên kế hoạch và tổ chức sự kiện"
    ms: "Rancang dan jalankan acara langsung"
    id: "Merencanakan dan menjalankan acara"
    hi: "लाइव इवेंट की योजना और संचालन"
