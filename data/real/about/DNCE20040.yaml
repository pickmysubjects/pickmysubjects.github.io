code: DNCE20040
year: 2026
learn:
  en: "A travelling dance studio with practical workshops, a group presentation and a journal documenting the trip."
  zh: "旅行舞蹈工作室：实践工作坊、小组展示和记录旅程的日志。"
  zh-TW: "旅行舞蹈工作室：實作工作坊、小組發表與記錄旅程的日誌。"
  ja: "旅するダンススタジオ。実技ワークショップ、グループ発表、旅の記録日誌。"
  ko: "여행 무용 스튜디오. 실기 워크숍, 그룹 발표, 여행 기록 일지."
  vi: "Studio múa lưu động: hội thảo thực hành, thuyết trình nhóm và nhật ký chuyến đi."
  ms: "Studio tari kembara: bengkel amali, pembentangan kumpulan dan jurnal perjalanan."
  id: "Studio tari keliling: lokakarya praktik, presentasi kelompok, dan jurnal perjalanan."
  hi: "यात्रा डांस स्टूडियो: प्रैक्टिकल वर्कशॉप, समूह प्रस्तुति और यात्रा का जर्नल।"
outcomes:
  - en: "Take part in workshops in a new setting"
    zh: "在新环境中参与工作坊"
    zh-TW: "在新環境中參與工作坊"
    ja: "新しい環境でワークショップに参加する"
    ko: "새로운 환경에서 워크숍 참여하기"
    vi: "Tham gia hội thảo ở môi trường mới"
    ms: "Sertai bengkel dalam suasana baharu"
    id: "Ikut lokakarya di tempat baru"
    hi: "नए माहौल में वर्कशॉप में भाग लेना"
  - en: "Create movement material with others"
    zh: "与他人一起创作动作素材"
    zh-TW: "與他人一起創作動作素材"
    ja: "仲間と動きの素材を作る"
    ko: "다른 사람과 움직임 소재 만들기"
    vi: "Cùng người khác sáng tạo động tác"
    ms: "Cipta bahan gerak bersama orang lain"
    id: "Membuat materi gerak bersama"
    hi: "दूसरों के साथ मूवमेंट सामग्री बनाना"
  - en: "Keep a reflective journal of the trip"
    zh: "写旅程反思日志"
    zh-TW: "寫旅程反思日誌"
    ja: "旅の振り返り日誌をつける"
    ko: "여행 성찰 일지 쓰기"
    vi: "Viết nhật ký suy ngẫm chuyến đi"
    ms: "Simpan jurnal refleksi perjalanan"
    id: "Menulis jurnal refleksi perjalanan"
    hi: "यात्रा का चिंतनशील जर्नल लिखना"
