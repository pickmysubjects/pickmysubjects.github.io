code: ENGR20004
year: 2026
learn:
  en: "Forces, stresses and motion: how loaded structures and machines balance, bend and move."
  zh: "力、应力和运动：受载结构和机器如何平衡、弯曲和运动。"
  zh-TW: "力、應力和運動：受載結構和機器如何平衡、彎曲和運動。"
  ja: "力・応力・運動：荷重を受けた構造物や機械がどう釣り合い、曲がり、動くか。"
  ko: "힘·응력·운동: 하중을 받은 구조물과 기계가 어떻게 평형을 이루고 휘고 움직이는지."
  vi: "Lực, ứng suất và chuyển động: kết cấu và máy chịu tải cân bằng, uốn và chuyển động ra sao."
  ms: "Daya, tegasan dan gerakan: bagaimana struktur dan mesin berbeban seimbang, melentur dan bergerak."
  id: "Gaya, tegangan, dan gerak: bagaimana struktur dan mesin yang dibebani seimbang, melentur, dan bergerak."
  hi: "बल, स्ट्रेस और गति: लोड वाली संरचनाएँ और मशीनें कैसे संतुलित होती, मुड़ती और चलती हैं।"
outcomes:
  - en: "Find loads and stresses in beams and frames"
    zh: "求梁和框架的载荷与应力"
    zh-TW: "求梁和框架的載重與應力"
    ja: "梁やフレームの荷重と応力を求める"
    ko: "보와 프레임의 하중과 응력을 구한다"
    vi: "Tính tải và ứng suất trong dầm, khung"
    ms: "Cari beban dan tegasan dalam rasuk dan rangka"
    id: "Menghitung beban dan tegangan balok dan rangka"
    hi: "बीम और फ्रेम में लोड और स्ट्रेस निकालना"
  - en: "Analyse rigid-body motion in 2D"
    zh: "分析二维刚体运动"
    zh-TW: "分析二維剛體運動"
    ja: "2次元の剛体運動を解析する"
    ko: "2차원 강체 운동을 해석한다"
    vi: "Phân tích chuyển động vật rắn 2D"
    ms: "Analisis gerakan jasad tegar 2D"
    id: "Menganalisis gerak benda tegar 2D"
    hi: "2D में रिजिड बॉडी की गति का विश्लेषण"
