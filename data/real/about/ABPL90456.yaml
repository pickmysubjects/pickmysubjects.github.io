code: ABPL90456
year: 2027
learn:
  en: "A design studio comparing Indonesian and Australian cities, leading to fieldwork and a final urban design proposal."
  zh: "比较印尼与澳大利亚城市的设计工作室，经实地调查完成最终城市设计方案。"
  zh-TW: "比較印尼與澳洲城市的設計工作室，經實地調查完成最終城市設計方案。"
  ja: "インドネシアと豪州の都市を比べ、現地調査を経て都市デザイン案をまとめるスタジオ。"
  ko: "인도네시아와 호주 도시를 비교하고 현장조사를 거쳐 도시설계안을 만드는 스튜디오."
  vi: "Studio so sánh đô thị Indonesia và Úc, thực địa và hoàn thành đề xuất thiết kế đô thị."
  ms: "Studio membandingkan bandar Indonesia dan Australia, kerja lapangan dan cadangan reka bentuk bandar."
  id: "Studio membandingkan kota Indonesia dan Australia, kerja lapangan, dan usulan desain kota."
  hi: "इंडोनेशियाई व ऑस्ट्रेलियाई शहरों की तुलना, फ़ील्डवर्क और अंतिम शहरी डिज़ाइन प्रस्ताव वाला स्टूडियो।"
outcomes:
  - en: "Evaluate urban theories critically"
    zh: "批判性评估城市理论"
    zh-TW: "批判性評估城市理論"
    ja: "都市理論を批判的に評価する"
    ko: "도시 이론 비판적으로 평가하기"
    vi: "Đánh giá phản biện lý thuyết đô thị"
    ms: "Menilai teori bandar secara kritis"
    id: "Mengevaluasi teori kota secara kritis"
    hi: "शहरी सिद्धांतों का आलोचनात्मक मूल्यांकन"
  - en: "Develop a final urban design proposal"
    zh: "完成最终城市设计方案"
    zh-TW: "完成最終城市設計方案"
    ja: "最終的な都市デザイン案をつくる"
    ko: "최종 도시설계안 만들기"
    vi: "Hoàn thành đề xuất thiết kế đô thị"
    ms: "Membangunkan cadangan reka bentuk bandar akhir"
    id: "Menyusun usulan desain kota akhir"
    hi: "अंतिम शहरी डिज़ाइन प्रस्ताव बनाना"
