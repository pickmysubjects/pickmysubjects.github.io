code: BLAW30002
year: 2026
learn:
  en: "The basics of Australian tax: who pays, what counts as income, what you can deduct, and how GST works."
  zh: "澳大利亚税务基础：谁要交税、什么算收入、哪些可扣除、GST怎么运作。"
  zh-TW: "澳洲稅務基礎：誰要繳稅、什麼算所得、哪些可扣除、GST怎麼運作。"
  ja: "オーストラリアの税の基本：誰が払うか、何が所得か、何を控除できるか、GSTの仕組み。"
  ko: "호주 세금의 기초: 누가 내는지, 무엇이 소득인지, 무엇을 공제할 수 있는지, GST의 원리."
  vi: "Cơ bản về thuế Úc: ai phải nộp, gì được tính là thu nhập, gì được khấu trừ và GST hoạt động ra sao."
  ms: "Asas cukai Australia: siapa bayar, apa dikira pendapatan, apa boleh ditolak, dan cara GST berfungsi."
  id: "Dasar pajak Australia: siapa yang bayar, apa yang dihitung penghasilan, apa yang bisa dikurangkan, dan cara GST bekerja."
  hi: "ऑस्ट्रेलियाई टैक्स की बुनियाद: टैक्स कौन देता है, आय क्या है, क्या घटाया जा सकता है, और GST कैसे काम करता है।"
outcomes:
  - en: "Work out what amounts are taxable income"
    zh: "判断哪些款项属于应税收入"
    zh-TW: "判斷哪些款項屬於應稅所得"
    ja: "どの金額が課税所得になるか判断する"
    ko: "어떤 금액이 과세 소득인지 판단"
    vi: "Xác định khoản nào là thu nhập chịu thuế"
    ms: "Tentukan jumlah yang menjadi pendapatan bercukai"
    id: "Menentukan jumlah yang termasuk penghasilan kena pajak"
    hi: "कौन-सी रकम कर-योग्य आय है, यह तय करना"
  - en: "Decide which expenses can be deducted"
    zh: "判断哪些支出可以扣除"
    zh-TW: "判斷哪些支出可以扣除"
    ja: "どの経費が控除できるか判断する"
    ko: "어떤 비용을 공제할 수 있는지 판단"
    vi: "Xác định chi phí nào được khấu trừ"
    ms: "Tentukan perbelanjaan yang boleh ditolak"
    id: "Menentukan biaya mana yang bisa dikurangkan"
    hi: "कौन-से खर्च घटाए जा सकते हैं, यह तय करना"
  - en: "Explain how GST applies to everyday transactions"
    zh: "解释GST如何适用于日常交易"
    zh-TW: "說明GST如何適用於日常交易"
    ja: "日常の取引にGSTがどう適用されるか説明する"
    ko: "일상 거래에 GST가 적용되는 방식 설명"
    vi: "Giải thích GST áp dụng cho giao dịch hằng ngày ra sao"
    ms: "Terangkan cara GST dikenakan pada urus niaga harian"
    id: "Menjelaskan penerapan GST pada transaksi sehari-hari"
    hi: "रोज़मर्रा के लेन-देन पर GST कैसे लगता है, समझाना"
