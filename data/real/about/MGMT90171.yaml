code: MGMT90171
year: 2027
learn:
  en: "Leadership styles in science, from research groups to industry, covering motivation, ethics, risk and building teams."
  zh: "科学领域的领导风格，从研究团队到产业，涵盖激励、伦理、风险和团队建设。"
  zh-TW: "科學領域的領導風格，從研究團隊到產業，涵蓋激勵、倫理、風險與團隊建立。"
  ja: "研究室から産業まで、科学分野のリーダーシップ。動機づけ、倫理、リスク、チームづくり。"
  ko: "연구실부터 산업까지 과학 분야 리더십: 동기 부여, 윤리, 위험, 팀 구축."
  vi: "Phong cách lãnh đạo trong khoa học, từ nhóm nghiên cứu đến ngành, gồm động lực, đạo đức, rủi ro và xây dựng nhóm."
  ms: "Gaya kepimpinan dalam sains, dari kumpulan penyelidikan hingga industri: motivasi, etika, risiko dan membina pasukan."
  id: "Gaya kepemimpinan di sains, dari kelompok riset hingga industri: motivasi, etika, risiko, dan membangun tim."
  hi: "विज्ञान में नेतृत्व शैलियाँ, शोध समूह से उद्योग तक: प्रेरणा, नैतिकता, जोखिम और टीम बनाना।"
outcomes:
  - en: "Compare leadership styles and their effects"
    zh: "比较不同领导风格及其影响"
    zh-TW: "比較不同領導風格及其影響"
    ja: "リーダーシップのスタイルと影響を比べる"
    ko: "리더십 유형과 효과 비교하기"
    vi: "So sánh phong cách lãnh đạo và tác động"
    ms: "Membandingkan gaya kepimpinan dan kesannya"
    id: "Membandingkan gaya kepemimpinan dan dampaknya"
    hi: "नेतृत्व शैलियों और उनके प्रभावों की तुलना"
  - en: "Explain a leader's ethical responsibilities"
    zh: "解释领导者的伦理责任"
    zh-TW: "解釋領導者的倫理責任"
    ja: "リーダーの倫理的責任を説明する"
    ko: "리더의 윤리적 책임 설명하기"
    vi: "Giải thích trách nhiệm đạo đức của người lãnh đạo"
    ms: "Menerangkan tanggungjawab etika pemimpin"
    id: "Menjelaskan tanggung jawab etis pemimpin"
    hi: "नेता की नैतिक ज़िम्मेदारियाँ समझाना"
  - en: "Spot risks and opportunities as a leader"
    zh: "作为领导者识别风险与机会"
    zh-TW: "作為領導者辨識風險與機會"
    ja: "リーダーとしてリスクと機会を見極める"
    ko: "리더로서 위험과 기회 파악하기"
    vi: "Nhận diện rủi ro và cơ hội khi lãnh đạo"
    ms: "Mengenal pasti risiko dan peluang sebagai pemimpin"
    id: "Mengenali risiko dan peluang sebagai pemimpin"
    hi: "नेता के रूप में जोखिम और अवसर पहचानना"
