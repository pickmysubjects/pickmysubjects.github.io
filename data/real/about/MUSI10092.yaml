code: MUSI10092
year: 2026
learn:
  en: "Sing in a small vocal group: tuning, breathing together, matched diction, plus chamber songs and opera ensembles."
  zh: "参加小型声乐重唱：练习音准、统一呼吸和咬字，演唱室内声乐与歌剧重唱。"
  zh-TW: "參加小型聲樂重唱：練習音準、統一呼吸與咬字，演唱室內聲樂與歌劇重唱。"
  ja: "少人数の声楽アンサンブルで音程、呼吸、発音をそろえ、室内声楽やオペラの重唱を歌う。"
  ko: "소규모 성악 앙상블에서 음정, 호흡, 발음을 맞추고 실내 성악곡과 오페라 중창을 부름."
  vi: "Hát trong nhóm thanh nhạc nhỏ: cao độ, thở cùng nhau, phát âm đồng đều, nhạc thính phòng và opera."
  ms: "Menyanyi dalam kumpulan vokal kecil: intonasi, pernafasan, sebutan seragam, lagu kamar dan ensembel opera."
  id: "Bernyanyi dalam grup vokal kecil: intonasi, napas bersama, diksi seragam, lagu kamar dan ansambel opera."
  hi: "छोटे गायन समूह में सुर, साथ में साँस, एक-सा उच्चारण, चैंबर गीत और ओपेरा समूह गायन।"
outcomes:
  - en: "Improve vocal technique and diction"
    zh: "提高发声技巧和咬字"
    zh-TW: "提升發聲技巧與咬字"
    ja: "発声技術と発音を磨く"
    ko: "발성 기술과 발음 향상하기"
    vi: "Cải thiện kỹ thuật thanh nhạc và phát âm"
    ms: "Tingkatkan teknik vokal dan sebutan"
    id: "Meningkatkan teknik vokal dan dikasi"
    hi: "गायन तकनीक और उच्चारण सुधारना"
  - en: "Work confidently as part of an ensemble"
    zh: "自信地作为合奏团的一员合作"
    zh-TW: "自信地作為合奏團的一員合作"
    ja: "アンサンブルの一員として自信を持って演奏する"
    ko: "앙상블의 일원으로 자신 있게 협업하기"
    vi: "Tự tin phối hợp trong một ban nhạc"
    ms: "Bekerja yakin sebagai ahli ensembel"
    id: "Bekerja percaya diri dalam ensambel"
    hi: "समूह के सदस्य के रूप में आत्मविश्वास से बजाना"
  - en: "Perform repertoire to concert standard"
    zh: "以音乐会水准演出曲目"
    zh-TW: "以音樂會水準演出曲目"
    ja: "演奏会レベルで曲を演奏する"
    ko: "연주회 수준으로 곡 연주하기"
    vi: "Biểu diễn tác phẩm ở chuẩn hòa nhạc"
    ms: "Persembahkan karya pada tahap konsert"
    id: "Membawakan repertoar setara konser"
    hi: "कॉन्सर्ट स्तर पर रचनाएँ प्रस्तुत करना"
