code: SPAN10001
year: 2026
learn:
  en: "Spanish for complete beginners: basic speaking, listening, reading and writing for everyday situations."
  zh: "零基础西班牙语：日常场景下的基本听说读写。"
  zh-TW: "零基礎西班牙語：日常場景下的基本聽說讀寫。"
  ja: "まったくの初心者向けのスペイン語。日常場面での基本的な聞く・話す・読む・書く。"
  ko: "완전 초보자를 위한 스페인어. 일상 상황에서의 기본 듣기·말하기·읽기·쓰기."
  vi: "tiếng Tây Ban Nha cho người mới hoàn toàn: nghe, nói, đọc, viết cơ bản trong tình huống hằng ngày."
  ms: "bahasa Sepanyol untuk pemula sepenuhnya: asas bertutur, mendengar, membaca dan menulis untuk situasi harian."
  id: "bahasa Spanyol untuk pemula total: dasar berbicara, mendengar, membaca dan menulis untuk situasi sehari-hari."
  hi: "बिल्कुल शुरुआती छात्रों के लिए स्पेनिश: रोज़मर्रा की स्थितियों में बोलना, सुनना, पढ़ना और लिखना।"
outcomes:
  - en: "Hold simple everyday conversations in Spanish"
    zh: "用西班牙语进行简单的日常对话"
    zh-TW: "用西班牙語進行簡單的日常對話"
    ja: "スペイン語で簡単な日常会話をする"
    ko: "스페인어로 간단한 일상 대화하기"
    vi: "Trò chuyện đơn giản hằng ngày bằng tiếng Tây Ban Nha"
    ms: "Berbual ringkas harian dalam bahasa Sepanyol"
    id: "Bercakap sederhana sehari-hari dalam bahasa Spanyol"
    hi: "स्पेनिश में सरल रोज़मर्रा की बातचीत करना"
  - en: "Read and write basic Spanish words and sentences"
    zh: "读写基础西班牙语词句"
    zh-TW: "讀寫基礎西班牙語詞句"
    ja: "スペイン語の基本的な語や文を読み書きする"
    ko: "기초 스페인어 단어와 문장 읽고 쓰기"
    vi: "Đọc và viết từ, câu tiếng Tây Ban Nha cơ bản"
    ms: "Baca dan tulis perkataan serta ayat asas bahasa Sepanyol"
    id: "Membaca dan menulis kata serta kalimat dasar bahasa Spanyol"
    hi: "स्पेनिश के बुनियादी शब्द और वाक्य पढ़ना-लिखना"
  - en: "Understand everyday customs where Spanish is spoken"
    zh: "了解使用西班牙语地区的日常习俗"
    zh-TW: "了解使用西班牙語地區的日常習俗"
    ja: "スペイン語が話される地域の日常の習慣を知る"
    ko: "스페인어 사용 지역의 일상 관습 이해하기"
    vi: "Hiểu phong tục hằng ngày nơi nói tiếng Tây Ban Nha"
    ms: "Fahami adat harian di tempat bahasa Sepanyol dituturkan"
    id: "Memahami kebiasaan sehari-hari di tempat bahasa Spanyol dipakai"
    hi: "स्पेनिश बोलने वाली जगहों के रोज़मर्रा के रीति-रिवाज समझना"
