code: HEBR10001
year: 2026
learn:
  en: "Modern Hebrew from the start: word building, basic grammar, reading, writing, simple talk, and a bit of the language's history."
  zh: "从零学现代希伯来语：构词、基础语法、读写、简单对话，以及语言的历史。"
  zh-TW: "從零學現代希伯來語：構詞、基礎文法、讀寫、簡單對話，以及語言的歷史。"
  ja: "ゼロから学ぶ現代ヘブライ語。語の成り立ち、基礎文法、読み書き、簡単な会話、言語の歴史。"
  ko: "처음 배우는 현대 히브리어. 단어 구성, 기초 문법, 읽기·쓰기, 간단한 대화, 언어의 역사."
  vi: "Tiếng Do Thái hiện đại từ đầu: cấu tạo từ, ngữ pháp cơ bản, đọc, viết, nói đơn giản và chút lịch sử ngôn ngữ."
  ms: "Bahasa Ibrani moden dari asas: pembentukan kata, tatabahasa asas, membaca, menulis, perbualan mudah dan sejarah bahasanya."
  id: "Bahasa Ibrani modern dari nol: pembentukan kata, tata bahasa dasar, membaca, menulis, percakapan sederhana dan sejarah bahasanya."
  hi: "शुरू से आधुनिक हिब्रू: शब्द-निर्माण, बुनियादी व्याकरण, पढ़ना-लिखना, सरल बातचीत और भाषा का थोड़ा इतिहास।"
outcomes:
  - en: "Hold simple everyday conversations in Hebrew"
    zh: "用希伯来语进行简单的日常对话"
    zh-TW: "用希伯來語進行簡單的日常對話"
    ja: "ヘブライ語で簡単な日常会話をする"
    ko: "히브리어로 간단한 일상 대화하기"
    vi: "Trò chuyện đơn giản hằng ngày bằng tiếng Do Thái"
    ms: "Berbual ringkas harian dalam bahasa Ibrani"
    id: "Bercakap sederhana sehari-hari dalam bahasa Ibrani"
    hi: "हिब्रू में सरल रोज़मर्रा की बातचीत करना"
  - en: "Read and write basic Hebrew words and sentences"
    zh: "读写基础希伯来语词句"
    zh-TW: "讀寫基礎希伯來語詞句"
    ja: "ヘブライ語の基本的な語や文を読み書きする"
    ko: "기초 히브리어 단어와 문장 읽고 쓰기"
    vi: "Đọc và viết từ, câu tiếng Do Thái cơ bản"
    ms: "Baca dan tulis perkataan serta ayat asas bahasa Ibrani"
    id: "Membaca dan menulis kata serta kalimat dasar bahasa Ibrani"
    hi: "हिब्रू के बुनियादी शब्द और वाक्य पढ़ना-लिखना"
  - en: "Understand everyday customs where Hebrew is spoken"
    zh: "了解使用希伯来语地区的日常习俗"
    zh-TW: "了解使用希伯來語地區的日常習俗"
    ja: "ヘブライ語が話される地域の日常の習慣を知る"
    ko: "히브리어 사용 지역의 일상 관습 이해하기"
    vi: "Hiểu phong tục hằng ngày nơi nói tiếng Do Thái"
    ms: "Fahami adat harian di tempat bahasa Ibrani dituturkan"
    id: "Memahami kebiasaan sehari-hari di tempat bahasa Ibrani dipakai"
    hi: "हिब्रू बोलने वाली जगहों के रोज़मर्रा के रीति-रिवाज समझना"
