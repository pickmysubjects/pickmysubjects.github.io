code: BCMB30011
year: 2026
learn:
  en: "How the body processes nutrients, what goes wrong in diseases like diabetes and cancer, and how it's studied."
  zh: "人体怎样代谢营养，糖尿病和癌症等疾病里代谢怎样出问题。"
  zh-TW: "人體如何代謝營養，糖尿病和癌症等疾病中代謝如何出問題。"
  ja: "体が栄養をどう処理するか、糖尿病やがんで何が起きるか、それをどう研究するか。"
  ko: "몸이 영양소를 처리하는 방식, 당뇨병·암에서 생기는 문제, 그 연구 방법."
  vi: "Cơ thể xử lý dinh dưỡng thế nào, điều gì sai trong bệnh như tiểu đường, ung thư, và cách nghiên cứu."
  ms: "Cara badan memproses nutrien, apa yang salah dalam penyakit seperti diabetes dan kanser, dan cara mengkajinya."
  id: "Cara tubuh mengolah nutrisi, apa yang salah pada penyakit seperti diabetes dan kanker, dan cara menelitinya."
  hi: "शरीर पोषक तत्व कैसे प्रोसेस करता है, डायबिटीज़ व कैंसर में क्या बिगड़ता है, और इसे कैसे पढ़ा जाता है।"
outcomes:
  - en: "Analyse data to spot changes in metabolism"
    zh: "分析数据找出代谢变化"
    zh-TW: "分析資料找出代謝變化"
    ja: "データを分析して代謝の変化を見つける"
    ko: "데이터를 분석해 대사 변화 찾기"
    vi: "Phân tích dữ liệu để tìm thay đổi chuyển hóa"
    ms: "Analisis data untuk kesan perubahan metabolisme"
    id: "Menganalisis data untuk melihat perubahan metabolisme"
    hi: "मेटाबॉलिज़्म में बदलाव पकड़ने के लिए डेटा विश्लेषण"
  - en: "Explain how cancer cells change their metabolism"
    zh: "解释癌细胞怎样改变代谢"
    zh-TW: "解釋癌細胞如何改變代謝"
    ja: "がん細胞が代謝をどう変えるか説明する"
    ko: "암세포가 대사를 어떻게 바꾸는지 설명하기"
    vi: "Giải thích tế bào ung thư thay đổi chuyển hóa ra sao"
    ms: "Terangkan cara sel kanser ubah metabolismenya"
    id: "Menjelaskan cara sel kanker mengubah metabolismenya"
    hi: "समझाना कि कैंसर सेल अपना मेटाबॉलिज़्म कैसे बदलते हैं"
  - en: "Critically read research on metabolism in disease"
    zh: "批判性阅读代谢疾病研究"
    zh-TW: "批判性閱讀代謝疾病研究"
    ja: "病気と代謝に関する研究を批判的に読む"
    ko: "질병 속 대사 연구 비판적으로 읽기"
    vi: "Đọc phản biện nghiên cứu về chuyển hóa trong bệnh"
    ms: "Baca kajian metabolisme dalam penyakit secara kritis"
    id: "Membaca riset metabolisme pada penyakit secara kritis"
    hi: "बीमारी में मेटाबॉलिज़्म पर रिसर्च आलोचनात्मक रूप से पढ़ना"
