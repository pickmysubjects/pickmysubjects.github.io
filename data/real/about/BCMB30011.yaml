code: BCMB30011
year: 2026
learn:
  en: "How the body processes nutrients, what goes wrong in diseases like diabetes and cancer, and how it's studied."
  zh: "人体怎样代谢营养，糖尿病和癌症等疾病里代谢怎样出问题。"
outcomes:
  - en: "Analyse data to spot changes in metabolism"
    zh: "分析数据找出代谢变化"
  - en: "Explain how cancer cells change their metabolism"
    zh: "解释癌细胞怎样改变代谢"
  - en: "Critically read research on metabolism in disease"
    zh: "批判性阅读代谢疾病研究"
