code: BMEN30006
year: 2026
learn:
  en: "Electronic circuits and biosignal analysis, with hands-on circuit building and MATLAB simulation."
  zh: "电子电路与生物信号分析，动手搭电路并用MATLAB仿真。"
  zh-TW: "電子電路與生物訊號分析，動手接電路並用MATLAB模擬。"
  ja: "電子回路と生体信号解析。回路を組みMATLABでシミュレーション。"
  ko: "전자회로와 생체신호 분석, 회로 제작과 MATLAB 시뮬레이션."
  vi: "Mạch điện tử và phân tích tín hiệu sinh học, tự lắp mạch và mô phỏng bằng MATLAB."
  ms: "Litar elektronik dan analisis isyarat bio, bina litar sendiri dan simulasi MATLAB."
  id: "Rangkaian elektronik dan analisis sinyal biologis, merakit rangkaian dan simulasi MATLAB."
  hi: "इलेक्ट्रॉनिक सर्किट और बायोसिग्नल विश्लेषण, सर्किट बनाना और MATLAB सिमुलेशन।"
outcomes:
  - en: "Analyse circuits with node and mesh methods"
    zh: "用节点法和网孔法分析电路"
    zh-TW: "用節點法與網目法分析電路"
    ja: "節点法・網目法で回路を解析する"
    ko: "노드·메시 해석으로 회로 분석하기"
    vi: "Phân tích mạch bằng phương pháp nút và vòng"
    ms: "Analisis litar dengan kaedah nod dan jaringan"
    id: "Menganalisis rangkaian dengan metode node dan mesh"
    hi: "नोड और मेश विधि से सर्किट विश्लेषण करें"
  - en: "Build and test simple circuits in the lab"
    zh: "在实验室搭建并测试简单电路"
    zh-TW: "在實驗室組裝並測試簡單電路"
    ja: "実験室で簡単な回路を組み試す"
    ko: "실험실에서 간단한 회로 제작·시험하기"
    vi: "Lắp và thử mạch đơn giản trong phòng lab"
    ms: "Bina dan uji litar mudah di makmal"
    id: "Merakit dan menguji rangkaian sederhana di lab"
    hi: "लैब में सरल सर्किट बनाएँ और जाँचें"
  - en: "Simulate and measure biosignals"
    zh: "仿真并测量生物信号"
    zh-TW: "模擬並量測生物訊號"
    ja: "生体信号をシミュレーション・測定する"
    ko: "생체신호 시뮬레이션·측정하기"
    vi: "Mô phỏng và đo tín hiệu sinh học"
    ms: "Simulasi dan ukur isyarat bio"
    id: "Menyimulasikan dan mengukur sinyal biologis"
    hi: "बायोसिग्नल का सिमुलेशन और मापन करें"
