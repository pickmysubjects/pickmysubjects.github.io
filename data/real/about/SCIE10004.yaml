code: SCIE10004
year: 2026
learn:
  en: "How evolutionary biology, physiology, psychology and geography each study humans, applied to one real question."
  zh: "进化生物、生理、心理和地理如何各自研究人类"
  zh-TW: "演化生物、生理、心理和地理如何各自研究人類"
  ja: "進化生物学・生理学・心理学・地理学が人間をどう捉えるか、一つの問いで比べる。"
  ko: "진화생물학·생리학·심리학·지리학이 인간을 어떻게 연구하는지 한 질문으로 비교."
  vi: "Sinh học tiến hóa, sinh lý, tâm lý và địa lý nghiên cứu con người ra sao, qua một câu hỏi thực tế."
  ms: "Cara biologi evolusi, fisiologi, psikologi dan geografi mengkaji manusia, melalui satu soalan sebenar."
  id: "Cara biologi evolusi, fisiologi, psikologi, dan geografi mempelajari manusia, lewat satu pertanyaan nyata."
  hi: "विकासवादी जीवविज्ञान, शरीर क्रिया, मनोविज्ञान और भूगोल मनुष्य को कैसे देखते हैं, एक असली प्रश्न पर।"
outcomes:
  - en: "Compare how four disciplines study humans"
    zh: "比较四个学科研究人类的方式"
    zh-TW: "比較四個學科研究人類的方式"
    ja: "4分野の人間の捉え方を比べる"
    ko: "네 학문의 인간 연구 방식 비교하기"
    vi: "So sánh cách bốn ngành nghiên cứu con người"
    ms: "Membandingkan cara empat disiplin mengkaji manusia"
    id: "Membandingkan cara empat disiplin mempelajari manusia"
    hi: "चार विषयों के मानव-अध्ययन की तुलना करना"
  - en: "Communicate contrasting approaches in writing"
    zh: "用文字表达不同学科的观点"
    zh-TW: "用文字表達不同學科的觀點"
    ja: "異なるアプローチを文章で伝える"
    ko: "서로 다른 접근을 글로 전달하기"
    vi: "Trình bày các cách tiếp cận khác nhau bằng văn bản"
    ms: "Menyampaikan pendekatan berbeza secara bertulis"
    id: "Menyampaikan pendekatan berbeda secara tertulis"
    hi: "भिन्न दृष्टिकोणों को लिखकर व्यक्त करना"
