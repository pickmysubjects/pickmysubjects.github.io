code: POPH90144
year: 2027
learn:
  en: "Linear and logistic regression for health research, applied to epidemiological data in Stata."
  zh: "健康研究中的线性和逻辑回归，用Stata分析流行病学数据。"
  zh-TW: "健康研究中的線性與邏輯迴歸，用Stata分析流行病學資料。"
  ja: "健康研究のための線形・ロジスティック回帰。Stataで疫学データに適用。"
  ko: "건강 연구를 위한 선형·로지스틱 회귀, Stata로 역학 데이터에 적용."
  vi: "Hồi quy tuyến tính và logistic cho nghiên cứu sức khỏe, áp dụng dữ liệu dịch tễ trong Stata."
  ms: "Regresi linear dan logistik untuk penyelidikan kesihatan, digunakan pada data epidemiologi dalam Stata."
  id: "Regresi linear dan logistik untuk riset kesehatan, diterapkan pada data epidemiologi dengan Stata."
  hi: "स्वास्थ्य शोध के लिए रैखिक और लॉजिस्टिक रिग्रेशन, Stata में महामारी विज्ञान डेटा पर।"
outcomes:
  - en: "Interpret regression parameters and interactions"
    zh: "解读回归参数和交互作用"
    zh-TW: "解讀迴歸參數與交互作用"
    ja: "回帰係数と交互作用を解釈する"
    ko: "회귀 계수와 상호작용 해석하기"
    vi: "Diễn giải tham số hồi quy và tương tác"
    ms: "Mentafsir parameter regresi dan interaksi"
    id: "Menafsirkan parameter regresi dan interaksi"
    hi: "रिग्रेशन पैरामीटर और इंटरैक्शन की व्याख्या"
  - en: "Estimate causal effects while adjusting for confounding"
    zh: "在调整混杂因素后估计因果效应"
    zh-TW: "在調整干擾因子後估計因果效應"
    ja: "交絡を調整して因果効果を推定する"
    ko: "교란을 보정해 인과 효과 추정하기"
    vi: "Ước lượng hiệu ứng nhân quả có hiệu chỉnh nhiễu"
    ms: "Menganggar kesan sebab dengan pelarasan pengeliru"
    id: "Mengestimasi efek kausal dengan penyesuaian perancu"
    hi: "कन्फ़ाउंडिंग समायोजित कर कारण प्रभाव आँकना"
  - en: "Build regression models for prediction"
    zh: "构建用于预测的回归模型"
    zh-TW: "建立用於預測的迴歸模型"
    ja: "予測のための回帰モデルを作る"
    ko: "예측용 회귀 모델 만들기"
    vi: "Xây mô hình hồi quy để dự đoán"
    ms: "Membina model regresi untuk ramalan"
    id: "Membangun model regresi untuk prediksi"
    hi: "पूर्वानुमान के लिए रिग्रेशन मॉडल बनाना"
