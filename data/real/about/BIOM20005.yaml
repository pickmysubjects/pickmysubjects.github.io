code: BIOM20005
year: 2027
learn:
  en: "Molecular biology, biochemistry and pharmacology: how biomolecules work and how drugs act in the body."
  zh: "分子生物学、生物化学和药理学：生物分子如何运作，药物如何在体内起作用。"
  zh-TW: "分子生物學、生物化學和藥理學：生物分子如何運作，藥物如何在體內作用。"
  ja: "分子生物学・生化学・薬理学：生体分子のはたらきと、薬が体内でどう作用するか。"
  ko: "분자생물학·생화학·약리학: 생체분자의 작동과 약물이 몸에서 작용하는 방식."
  vi: "Sinh học phân tử, hóa sinh và dược lý: phân tử sinh học hoạt động ra sao và thuốc tác động thế nào trong cơ thể."
  ms: "Biologi molekul, biokimia dan farmakologi: cara biomolekul berfungsi dan cara ubat bertindak dalam badan."
  id: "Biologi molekuler, biokimia, dan farmakologi: cara biomolekul bekerja dan cara obat bekerja di tubuh."
  hi: "मॉलिक्यूलर बायोलॉजी, बायोकेमिस्ट्री और फ़ार्माकोलॉजी: जैव-अणु कैसे काम करते हैं और दवाएँ शरीर में कैसे असर करती हैं।"
outcomes:
  - en: "Explain enzymes and interpret kinetic data"
    zh: "解释酶的作用并解读动力学数据"
    zh-TW: "解釋酵素的作用並解讀動力學資料"
    ja: "酵素のはたらきを説明し、速度論データを読む"
    ko: "효소 작용을 설명하고 동역학 데이터 해석하기"
    vi: "Giải thích enzyme và đọc dữ liệu động học"
    ms: "Terangkan enzim dan tafsir data kinetik"
    id: "Menjelaskan enzim dan menafsirkan data kinetik"
    hi: "एंजाइम समझाना और काइनेटिक डेटा पढ़ना"
  - en: "Use pharmacology ideas for safe drug use"
    zh: "运用药理学原理指导安全用药"
    zh-TW: "運用藥理學原理指引安全用藥"
    ja: "薬理学の考え方を安全な薬の使用に生かす"
    ko: "약리학 원리를 안전한 약물 사용에 적용하기"
    vi: "Dùng nguyên lý dược lý để dùng thuốc an toàn"
    ms: "Guna konsep farmakologi untuk penggunaan ubat selamat"
    id: "Memakai konsep farmakologi untuk penggunaan obat yang aman"
    hi: "सुरक्षित दवा उपयोग के लिए फ़ार्माकोलॉजी के सिद्धांत लगाना"
  - en: "Describe the stages of drug discovery"
    zh: "描述药物研发的各个阶段"
    zh-TW: "描述藥物研發的各個階段"
    ja: "創薬の各段階を説明する"
    ko: "신약 개발 단계 설명하기"
    vi: "Mô tả các giai đoạn phát triển thuốc"
    ms: "Huraikan peringkat penemuan ubat"
    id: "Menjelaskan tahap penemuan obat"
    hi: "दवा खोज के चरणों का वर्णन"
