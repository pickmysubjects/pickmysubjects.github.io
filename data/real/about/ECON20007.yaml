code: ECON20007
year: 2026
learn:
  en: "Trade theory applied to the history of globalisation, from the industrial revolution to the Global Financial Crisis."
  zh: "用贸易理论分析全球化历史，从工业革命到全球金融危机。"
  zh-TW: "用貿易理論分析全球化歷史，從工業革命到全球金融海嘯。"
  ja: "貿易理論でグローバル化の歴史を分析：産業革命から世界金融危機まで。"
  ko: "무역 이론으로 세계화의 역사 분석: 산업혁명부터 글로벌 금융위기까지."
  vi: "Áp dụng lý thuyết thương mại vào lịch sử toàn cầu hóa, từ cách mạng công nghiệp đến khủng hoảng tài chính toàn cầu."
  ms: "Teori perdagangan untuk sejarah globalisasi, dari revolusi perindustrian hingga Krisis Kewangan Global."
  id: "Teori perdagangan untuk sejarah globalisasi, dari revolusi industri hingga Krisis Keuangan Global."
  hi: "व्यापार सिद्धांत से वैश्वीकरण का इतिहास, औद्योगिक क्रांति से वैश्विक वित्तीय संकट तक।"
outcomes:
  - en: "Use international trade models to study globalisation"
    zh: "用国际贸易模型研究全球化"
    zh-TW: "用國際貿易模型研究全球化"
    ja: "国際貿易モデルでグローバル化を学ぶ"
    ko: "국제무역 모형으로 세계화 연구"
    vi: "Dùng mô hình thương mại quốc tế để nghiên cứu toàn cầu hóa"
    ms: "Guna model perdagangan antarabangsa untuk kaji globalisasi"
    id: "Memakai model perdagangan internasional untuk mengkaji globalisasi"
    hi: "अंतरराष्ट्रीय व्यापार मॉडल से वैश्वीकरण का अध्ययन"
  - en: "Explain what drove globalisation in the 19th and 20th centuries"
    zh: "解释19和20世纪全球化的推动因素"
    zh-TW: "說明19和20世紀全球化的推動因素"
    ja: "19〜20世紀のグローバル化の要因を説明する"
    ko: "19~20세기 세계화를 이끈 요인 설명"
    vi: "Giải thích động lực toàn cầu hóa thế kỷ 19 và 20"
    ms: "Terangkan pendorong globalisasi abad ke-19 dan ke-20"
    id: "Menjelaskan pendorong globalisasi abad ke-19 dan ke-20"
    hi: "19वीं और 20वीं सदी में वैश्वीकरण के कारण समझाना"
  - en: "Weigh arguments on globalisation, poverty and inequality"
    zh: "评估关于全球化、贫困与不平等的论点"
    zh-TW: "評估關於全球化、貧窮與不平等的論點"
    ja: "グローバル化と貧困・格差をめぐる議論を評価する"
    ko: "세계화, 빈곤, 불평등에 관한 주장 평가"
    vi: "Cân nhắc lập luận về toàn cầu hóa, nghèo đói và bất bình đẳng"
    ms: "Nilai hujah tentang globalisasi, kemiskinan dan ketaksamaan"
    id: "Menimbang argumen soal globalisasi, kemiskinan, dan ketimpangan"
    hi: "वैश्वीकरण, ग़रीबी और असमानता पर तर्कों को परखना"
