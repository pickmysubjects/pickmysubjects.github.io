code: ECOM90010
year: 2027
learn:
  en: "Bayesian inference for econometric models, using MCMC methods such as Gibbs and Metropolis-Hastings samplers."
  zh: "计量模型的贝叶斯推断，使用 Gibbs、Metropolis-Hastings 等 MCMC 方法。"
  zh-TW: "計量模型的貝氏推論，使用 Gibbs、Metropolis-Hastings 等 MCMC 方法。"
  ja: "計量モデルのベイズ推論。GibbsやMetropolis-HastingsなどのMCMCを使う。"
  ko: "계량 모형의 베이즈 추론, Gibbs·Metropolis-Hastings 등 MCMC 기법 사용."
  vi: "Suy luận Bayes cho mô hình kinh tế lượng, dùng MCMC như Gibbs và Metropolis-Hastings."
  ms: "Inferens Bayes untuk model ekonometrik dengan MCMC seperti pensampel Gibbs dan Metropolis-Hastings."
  id: "Inferensi Bayes untuk model ekonometrika dengan MCMC seperti sampler Gibbs dan Metropolis-Hastings."
  hi: "इकोनोमेट्रिक मॉडलों के लिए बायेसियन अनुमान, Gibbs और Metropolis-Hastings जैसे MCMC तरीकों से।"
outcomes:
  - en: "Derive posteriors for common models"
    zh: "推导常见模型的后验分布"
    zh-TW: "推導常見模型的後驗分配"
    ja: "よく使うモデルの事後分布を導く"
    ko: "주요 모형의 사후분포 유도하기"
    vi: "Suy ra phân phối hậu nghiệm cho mô hình thường gặp"
    ms: "Menerbitkan taburan posterior model lazim"
    id: "Menurunkan distribusi posterior model umum"
    hi: "आम मॉडलों के पोस्टीरियर निकालना"
  - en: "Program Gibbs and Metropolis-Hastings samplers"
    zh: "编写 Gibbs 和 MH 抽样程序"
    zh-TW: "撰寫 Gibbs 與 MH 抽樣程式"
    ja: "GibbsとMHサンプラーを実装する"
    ko: "Gibbs·MH 샘플러 구현하기"
    vi: "Lập trình bộ lấy mẫu Gibbs và MH"
    ms: "Memprogram pensampel Gibbs dan MH"
    id: "Memprogram sampler Gibbs dan MH"
    hi: "Gibbs व MH सैंपलर प्रोग्राम करना"
