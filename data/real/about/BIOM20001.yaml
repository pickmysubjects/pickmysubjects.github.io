code: BIOM20001
year: 2026
learn:
  en: "How cells work at the molecular level, and what goes wrong in infection, immunity and disease."
  zh: "细胞在分子层面如何运作，以及感染、免疫和疾病中出了什么问题。"
  zh-TW: "細胞在分子層面如何運作，以及感染、免疫和疾病中出了什麼問題。"
  ja: "細胞が分子レベルでどう働くか、そして感染・免疫・病気で何が起きるか。"
  ko: "세포가 분자 수준에서 어떻게 작동하는지, 감염·면역·질병에서 무엇이 잘못되는지."
  vi: "Tế bào hoạt động thế nào ở mức phân tử, và điều gì xảy ra khi nhiễm trùng, miễn dịch và bệnh tật."
  ms: "Cara sel berfungsi pada tahap molekul, dan apa yang berlaku semasa jangkitan, keimunan dan penyakit."
  id: "Cara sel bekerja di tingkat molekul, dan apa yang terjadi saat infeksi, imunitas, dan penyakit."
  hi: "कोशिकाएँ अणु स्तर पर कैसे काम करती हैं, और संक्रमण, इम्युनिटी व बीमारी में क्या बिगड़ता है।"
outcomes:
  - en: "Use biochemistry, genetics and cell biology to explain normal cells"
    zh: "用生化、遗传和细胞生物学解释正常细胞"
    zh-TW: "用生化、遺傳和細胞生物學解釋正常細胞"
    ja: "生化学・遺伝学・細胞生物学で正常な細胞を説明する"
    ko: "생화학, 유전학, 세포생물학으로 정상 세포 설명하기"
    vi: "Dùng hóa sinh, di truyền và sinh học tế bào để giải thích tế bào bình thường"
    ms: "Guna biokimia, genetik dan biologi sel untuk terangkan sel normal"
    id: "Memakai biokimia, genetika, dan biologi sel untuk menjelaskan sel normal"
    hi: "बायोकेमिस्ट्री, जेनेटिक्स और सेल बायोलॉजी से सामान्य कोशिका समझाना"
  - en: "Explain how infections and the immune system change cells and tissues"
    zh: "解释感染和免疫如何改变细胞和组织"
    zh-TW: "解釋感染和免疫如何改變細胞和組織"
    ja: "感染や免疫が細胞・組織をどう変えるか説明する"
    ko: "감염과 면역이 세포와 조직을 어떻게 바꾸는지 설명하기"
    vi: "Giải thích nhiễm trùng và miễn dịch làm thay đổi tế bào, mô ra sao"
    ms: "Terangkan bagaimana jangkitan dan imun mengubah sel dan tisu"
    id: "Menjelaskan bagaimana infeksi dan imun mengubah sel dan jaringan"
    hi: "समझाना कि संक्रमण और इम्यून सिस्टम कोशिकाओं व ऊतकों को कैसे बदलते हैं"
  - en: "Work in a team to interpret lab results and case studies"
    zh: "和组员一起解读实验结果和病例"
    zh-TW: "和組員一起解讀實驗結果和病例"
    ja: "チームで実験結果や症例を読み解く"
    ko: "팀으로 실험 결과와 사례 해석하기"
    vi: "Làm việc nhóm để phân tích kết quả thí nghiệm và ca bệnh"
    ms: "Bekerja dalam pasukan untuk mentafsir keputusan makmal dan kajian kes"
    id: "Bekerja dalam tim untuk menafsirkan hasil lab dan studi kasus"
    hi: "टीम में लैब नतीजों और केस स्टडी को समझना"
