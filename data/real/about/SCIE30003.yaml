code: SCIE30003
year: 2027
learn:
  en: "Do your own supervised research project at a university overseas, from planning it to presenting what you found."
  zh: "在海外院校做一个有导师指导的个人研究项目，从设计到展示成果。"
  zh-TW: "在海外學校做一個有指導老師的個人研究計畫，從設計到發表成果。"
  ja: "海外の大学で指導を受けながら自分の研究プロジェクトを行い、計画から成果発表までを経験する。"
  ko: "해외 대학에서 지도를 받으며 개인 연구 프로젝트를 설계부터 결과 발표까지 진행한다."
  vi: "Tự thực hiện một dự án nghiên cứu có người hướng dẫn tại một trường ở nước ngoài, từ lên kế hoạch đến trình bày kết quả."
  ms: "Jalankan projek penyelidikan sendiri dengan penyelia di institusi luar negara, dari merancang hingga membentangkan dapatan."
  id: "Mengerjakan proyek riset sendiri dengan pembimbing di institusi luar negeri, dari merancang hingga mempresentasikan hasil."
  hi: "विदेश के किसी संस्थान में सुपरवाइज़र के साथ अपना रिसर्च प्रोजेक्ट करना, योजना से लेकर नतीजे पेश करने तक।"
outcomes:
  - en: "Design a research project to answer a set question"
    zh: "针对研究问题设计研究项目"
    zh-TW: "針對研究問題設計研究計畫"
    ja: "研究課題に答えるためのプロジェクトを設計する"
    ko: "연구 질문에 맞춰 연구 프로젝트 설계하기"
    vi: "Thiết kế dự án nghiên cứu để trả lời một câu hỏi cụ thể"
    ms: "Reka projek penyelidikan untuk menjawab soalan kajian"
    id: "Merancang proyek riset untuk menjawab pertanyaan penelitian"
    hi: "किसी शोध प्रश्न का जवाब देने के लिए प्रोजेक्ट बनाना"
  - en: "Collect and analyse data, including statistics"
    zh: "收集并分析数据，包括统计分析"
    zh-TW: "蒐集並分析資料，包括統計分析"
    ja: "データを集めて統計を含めて分析する"
    ko: "데이터를 모으고 통계를 포함해 분석하기"
    vi: "Thu thập và phân tích dữ liệu, kể cả thống kê"
    ms: "Kumpul dan analisis data, termasuk statistik"
    id: "Mengumpulkan dan menganalisis data, termasuk statistik"
    hi: "डेटा इकट्ठा करना और आँकड़ों समेत उसका विश्लेषण करना"
  - en: "Report results in writing and as a talk or poster"
    zh: "用书面报告及口头或海报展示成果"
    zh-TW: "用書面報告及口頭或海報發表成果"
    ja: "結果をレポートと口頭発表やポスターで伝える"
    ko: "결과를 보고서와 발표 또는 포스터로 전달하기"
    vi: "Trình bày kết quả bằng bài viết và thuyết trình hoặc poster"
    ms: "Laporkan dapatan secara bertulis dan melalui pembentangan atau poster"
    id: "Melaporkan hasil secara tertulis dan lewat presentasi atau poster"
    hi: "नतीजों को लिखकर और प्रेज़ेंटेशन या पोस्टर से बताना"
