code: MUSI30293
year: 2026
learn:
  en: "Write about music for everyday readers: program notes, reviews, magazine pieces and podcast scripts."
  zh: "为大众写音乐：节目单说明、乐评、杂志文章和播客脚本。"
  zh-TW: "為大眾寫音樂：節目單說明、樂評、雜誌文章與播客腳本。"
  ja: "一般読者向けの音楽文章：曲目解説、レビュー、雑誌記事、ポッドキャスト台本。"
  ko: "일반 독자를 위한 음악 글쓰기: 프로그램 노트, 리뷰, 잡지 글, 팟캐스트 대본."
  vi: "Viết về âm nhạc cho độc giả phổ thông: chú giải chương trình, phê bình, podcast."
  ms: "Tulis tentang muzik untuk pembaca umum: nota program, ulasan, skrip podcast."
  id: "Menulis musik untuk pembaca umum: catatan program, ulasan, naskah podcast."
  hi: "आम पाठकों के लिए संगीत पर लेखन: प्रोग्राम नोट्स, समीक्षा, पत्रिका लेख, पॉडकास्ट स्क्रिप्ट।"
outcomes:
  - en: "Write clearly for non-specialist readers"
    zh: "为非专业读者清晰写作"
    zh-TW: "為非專業讀者清晰寫作"
    ja: "専門外の読者にわかりやすく書く"
    ko: "비전문 독자에게 쉽게 쓰기"
    vi: "Viết rõ cho người không chuyên"
    ms: "Tulis dengan jelas untuk pembaca umum"
    id: "Menulis jelas untuk pembaca awam"
    hi: "ग़ैर-विशेषज्ञ पाठकों के लिए साफ़ लिखना"
  - en: "Write in genres like reviews and notes"
    zh: "撰写乐评、节目说明等文体"
    zh-TW: "撰寫樂評、節目說明等文體"
    ja: "レビューや解説などの形式で書く"
    ko: "리뷰·해설 등 여러 장르로 쓰기"
    vi: "Viết phê bình, chú giải và thể loại khác"
    ms: "Tulis ulasan, nota dan genre lain"
    id: "Menulis ulasan, catatan dan genre lain"
    hi: "समीक्षा और नोट्स जैसी विधाओं में लिखना"
  - en: "Build and revise a writing folio"
    zh: "完成并修改写作作品集"
    zh-TW: "完成並修改寫作作品集"
    ja: "文章のポートフォリオを作り直していく"
    ko: "글쓰기 포트폴리오 만들고 다듬기"
    vi: "Xây dựng và sửa tập bài viết"
    ms: "Bina dan semak folio penulisan"
    id: "Menyusun dan merevisi portofolio tulisan"
    hi: "लेखन फ़ोलियो बनाना और सुधारना"
