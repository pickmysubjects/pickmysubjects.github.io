code: MUSI40016
year: 2026
learn:
  en: "Weekly lessons and classes on your instrument, voice or conducting, ending in a technical exam."
  zh: "每周上乐器、声乐或指挥课，期末参加技术考核。"
  zh-TW: "每週上樂器、聲樂或指揮課，期末參加技術考核。"
  ja: "楽器・声楽・指揮の週1レッスンとクラスを受け、最後に技術試験を受ける。"
  ko: "악기·성악·지휘 주간 레슨과 수업을 듣고 마지막에 기술 시험 보기."
  vi: "Học hàng tuần về nhạc cụ, thanh nhạc hoặc chỉ huy, kết thúc bằng bài thi kỹ thuật."
  ms: "Kelas mingguan alat muzik, vokal atau konduktor, diakhiri peperiksaan teknikal."
  id: "Les dan kelas mingguan alat musik, vokal, atau konduktor, diakhiri ujian teknik."
  hi: "वाद्य, गायन या कंडक्टिंग की साप्ताहिक कक्षाएँ, अंत में तकनीकी परीक्षा।"
outcomes:
  - en: "Build technique at an advanced level"
    zh: "把演奏技术提升到高阶水平"
    zh-TW: "把演奏技術提升到高階水準"
    ja: "上級レベルの技術を身につける"
    ko: "고급 수준의 테크닉 쌓기"
    vi: "Rèn kỹ thuật ở trình độ nâng cao"
    ms: "Bina teknik pada tahap lanjutan"
    id: "Membangun teknik di tingkat lanjut"
    hi: "उन्नत स्तर की तकनीक विकसित करना"
  - en: "Understand the style of the music you play"
    zh: "理解所演奏音乐的风格特点"
    zh-TW: "理解所演奏音樂的風格特點"
    ja: "演奏する音楽の様式を理解する"
    ko: "연주하는 음악의 양식 이해하기"
    vi: "Hiểu phong cách của nhạc mình chơi"
    ms: "Fahami gaya muzik yang dimainkan"
    id: "Memahami gaya musik yang dimainkan"
    hi: "जो संगीत बजाते हैं उसकी शैली समझना"
  - en: "Perform set technical work under exam conditions"
    zh: "在考试条件下演奏指定技术曲目"
    zh-TW: "在考試條件下演奏指定技術曲目"
    ja: "試験の場で指定の技術課題を演奏する"
    ko: "시험 상황에서 지정 기술곡 연주하기"
    vi: "Trình diễn bài kỹ thuật quy định trong điều kiện thi"
    ms: "Persembahkan kerja teknikal ditetapkan dalam peperiksaan"
    id: "Membawakan materi teknik wajib dalam kondisi ujian"
    hi: "परीक्षा में निर्धारित तकनीकी अंश प्रस्तुत करना"
