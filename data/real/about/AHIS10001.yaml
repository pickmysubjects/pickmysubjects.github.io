code: AHIS10001
year: 2026
learn:
  en: "An introduction to art history: how to read artworks from different periods and why some of them caused fights."
  zh: "艺术史入门：怎么看懂不同时代的作品，以及有些作品为什么会引起争议。"
  zh-TW: "藝術史入門：怎麼看懂不同時代的作品，以及有些作品為什麼會引起爭議。"
  ja: "美術史の入門：さまざまな時代の作品の見方と、なぜ一部の作品が論争を呼んだのかを学ぶ。"
  ko: "미술사 입문: 여러 시대의 작품을 읽는 법과 어떤 작품이 왜 논란이 됐는지 배운다."
  vi: "Nhập môn lịch sử nghệ thuật: cách đọc tác phẩm qua các thời kỳ và vì sao có tác phẩm gây tranh cãi."
  ms: "Pengenalan sejarah seni: cara membaca karya seni dari zaman berbeza dan kenapa ada yang mencetuskan kontroversi."
  id: "Pengantar sejarah seni: cara membaca karya seni dari berbagai zaman dan kenapa sebagian memicu kontroversi."
  hi: "कला इतिहास की शुरुआत: अलग-अलग दौर की कलाकृतियों को कैसे समझें और कुछ पर विवाद क्यों हुआ।"
outcomes:
  - en: "Look closely at an artwork and describe what you see"
    zh: "仔细观察一件作品并说清楚看到了什么"
    zh-TW: "仔細觀察一件作品並說清楚看到了什麼"
    ja: "作品をよく観察し、見えたものを言葉にする"
    ko: "작품을 자세히 보고 보이는 것을 설명하기"
    vi: "Quan sát kỹ một tác phẩm và mô tả điều mình thấy"
    ms: "Teliti sesebuah karya seni dan huraikan apa yang dilihat"
    id: "Mengamati karya seni dengan teliti dan menjelaskan apa yang terlihat"
    hi: "किसी कलाकृति को ध्यान से देखना और जो दिखे उसे बताना"
  - en: "Explain an artwork in light of when and where it was made"
    zh: "结合创作的时代和地点解读作品"
    zh-TW: "結合創作的時代和地點解讀作品"
    ja: "作られた時代や場所をふまえて作品を解釈する"
    ko: "작품이 만들어진 시대와 장소를 바탕으로 해석하기"
    vi: "Giải thích tác phẩm dựa trên thời gian và nơi nó ra đời"
    ms: "Tafsir karya berdasarkan bila dan di mana ia dihasilkan"
    id: "Menafsirkan karya berdasarkan kapan dan di mana karya itu dibuat"
    hi: "कलाकृति को उसके समय और जगह के हिसाब से समझाना"
  - en: "Present your reading of art in essays and in class"
    zh: "用文章和课堂发言表达你对作品的看法"
    zh-TW: "用文章和課堂發言表達你對作品的看法"
    ja: "作品についての考えをレポートや授業で発表する"
    ko: "작품에 대한 생각을 글과 수업 발표로 전달하기"
    vi: "Trình bày cách hiểu về tác phẩm qua bài viết và trên lớp"
    ms: "Sampaikan tafsiran seni melalui esei dan di dalam kelas"
    id: "Menyampaikan tafsiran karya lewat esai dan diskusi kelas"
    hi: "निबंध और क्लास में कला पर अपनी समझ रखना"
