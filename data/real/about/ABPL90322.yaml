code: ABPL90322
year: 2027
learn:
  en: "Research linking human behaviour to the built environment, and how it informs evidence-based design."
  zh: "研究人的行为与建成环境的关系，以及如何指导循证设计。"
  zh-TW: "研究人的行為與建成環境的關係，以及如何指導實證設計。"
  ja: "人の行動と建築環境の関係を研究し、エビデンスに基づく設計に生かす。"
  ko: "인간 행동과 건조 환경의 관계 연구와 근거 기반 설계에의 활용."
  vi: "Nghiên cứu mối liên hệ giữa hành vi con người và môi trường xây dựng, phục vụ thiết kế dựa trên bằng chứng."
  ms: "Kajian yang mengaitkan tingkah laku manusia dengan persekitaran binaan untuk reka bentuk berasaskan bukti."
  id: "Riset yang mengaitkan perilaku manusia dengan lingkungan binaan untuk desain berbasis bukti."
  hi: "मानव व्यवहार और निर्मित पर्यावरण के संबंध पर शोध, और साक्ष्य-आधारित डिज़ाइन में उसका उपयोग।"
outcomes:
  - en: "Explain human-environment theories"
    zh: "解释人与环境关系的理论"
    zh-TW: "解釋人與環境關係的理論"
    ja: "人間と環境の理論を説明する"
    ko: "인간-환경 이론 설명하기"
    vi: "Giải thích lý thuyết con người–môi trường"
    ms: "Menerangkan teori manusia-persekitaran"
    id: "Menjelaskan teori manusia-lingkungan"
    hi: "मानव-पर्यावरण सिद्धांत समझाना"
  - en: "Run and report a small empirical study"
    zh: "开展并报告一项小型实证研究"
    zh-TW: "進行並報告一項小型實證研究"
    ja: "小さな実証研究を行い報告する"
    ko: "소규모 실증 연구 수행·보고하기"
    vi: "Thực hiện và báo cáo nghiên cứu thực nghiệm nhỏ"
    ms: "Menjalankan dan melapor kajian empirikal kecil"
    id: "Melakukan dan melaporkan studi empiris kecil"
    hi: "छोटा अनुभवजन्य अध्ययन करना और रिपोर्ट करना"
