code: ENGL20022
year: 2026
learn:
  en: "Modernism from about 1890 to 1950 as a worldwide experiment in writing and art, from Dada to the Harlem Renaissance."
  zh: "约1890至1950年的现代主义：从达达到哈莱姆文艺复兴的全球文学艺术实验。"
  zh-TW: "約1890至1950年的現代主義：從達達到哈林文藝復興的全球文學藝術實驗。"
  ja: "1890〜1950年頃のモダニズムを、ダダからハーレム・ルネサンスまでの世界的な実験として学ぶ。"
  ko: "약 1890~1950년의 모더니즘을 다다부터 할렘 르네상스까지 세계적 실험으로 배운다."
  vi: "Chủ nghĩa hiện đại khoảng 1890–1950 như một thử nghiệm toàn cầu trong văn chương và nghệ thuật, từ Dada đến Phục hưng Harlem."
  ms: "Modenisme sekitar 1890 hingga 1950 sebagai eksperimen sedunia dalam penulisan dan seni, dari Dada hingga Harlem Renaissance."
  id: "Modernisme sekitar 1890–1950 sebagai eksperimen global dalam sastra dan seni, dari Dada sampai Harlem Renaissance."
  hi: "लगभग 1890 से 1950 तक का आधुनिकतावाद, लेखन और कला का एक विश्वव्यापी प्रयोग, दादा से हार्लेम रेनेसां तक।"
outcomes:
  - en: "Describe major modernist and avant-garde movements"
    zh: "描述主要的现代主义和先锋派运动"
    zh-TW: "描述主要的現代主義和前衛派運動"
    ja: "主なモダニズム・前衛運動を説明する"
    ko: "주요 모더니즘·아방가르드 운동 설명하기"
    vi: "Mô tả các trào lưu hiện đại và tiên phong chính"
    ms: "Huraikan gerakan modenis dan avant-garde utama"
    id: "Menguraikan gerakan modernis dan avant-garde utama"
    hi: "मुख्य आधुनिकतावादी और अवांगार्द आंदोलनों का वर्णन करना"
  - en: "Analyse experimental form in modernist texts"
    zh: "分析现代主义作品中的实验形式"
    zh-TW: "分析現代主義作品中的實驗形式"
    ja: "モダニズム作品の実験的な形式を分析する"
    ko: "모더니즘 작품의 실험적 형식 분석하기"
    vi: "Phân tích hình thức thử nghiệm trong văn bản hiện đại"
    ms: "Analisis bentuk eksperimen dalam teks modenis"
    id: "Menganalisis bentuk eksperimental dalam teks modernis"
    hi: "आधुनिकतावादी पाठों के प्रयोगात्मक रूप का विश्लेषण करना"
  - en: "Compare modernism across different places"
    zh: "比较不同地区的现代主义"
    zh-TW: "比較不同地區的現代主義"
    ja: "地域ごとのモダニズムを比べる"
    ko: "여러 지역의 모더니즘 비교하기"
    vi: "So sánh chủ nghĩa hiện đại ở nhiều nơi"
    ms: "Bandingkan modenisme di tempat berbeza"
    id: "Membandingkan modernisme di berbagai tempat"
    hi: "अलग-अलग जगहों के आधुनिकतावाद की तुलना करना"
