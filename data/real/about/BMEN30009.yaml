code: BMEN30009
year: 2026
learn:
  en: "How materials like polymers, metals and ceramics behave in the body, and how to choose them for medical use."
  zh: "聚合物、金属、陶瓷等材料在体内的表现，以及如何为医疗选材。"
  zh-TW: "聚合物、金屬、陶瓷等材料在體內的表現，以及如何為醫療選材。"
  ja: "高分子・金属・セラミックスの体内での振る舞いと医療用の材料選び。"
  ko: "고분자·금속·세라믹이 체내에서 어떻게 작용하는지, 의료용 선택법."
  vi: "Vật liệu như polyme, kim loại, gốm hoạt động thế nào trong cơ thể và cách chọn cho y tế."
  ms: "Cara bahan seperti polimer, logam dan seramik bertindak dalam badan, dan cara memilihnya."
  id: "Perilaku bahan seperti polimer, logam, dan keramik di tubuh, dan cara memilihnya untuk medis."
  hi: "पॉलिमर, धातु और सिरेमिक शरीर में कैसे व्यवहार करते हैं, और मेडिकल उपयोग के लिए चयन।"
outcomes:
  - en: "Evaluate how well a biomaterial performs"
    zh: "评估生物材料的性能"
    zh-TW: "評估生物材料的性能"
    ja: "生体材料の性能を評価する"
    ko: "생체재료 성능 평가하기"
    vi: "Đánh giá hiệu năng của vật liệu sinh học"
    ms: "Nilai prestasi bahan bio"
    id: "Menilai kinerja biomaterial"
    hi: "बायोमटेरियल के प्रदर्शन का आकलन करें"
  - en: "Write a protocol to test material properties"
    zh: "编写材料性能测试方案"
    zh-TW: "撰寫材料性質測試流程"
    ja: "材料特性の試験手順を作る"
    ko: "재료 특성 시험 절차 작성하기"
    vi: "Viết quy trình thử tính chất vật liệu"
    ms: "Tulis protokol menguji sifat bahan"
    id: "Menyusun protokol uji sifat bahan"
    hi: "सामग्री गुण परखने का प्रोटोकॉल लिखें"
  - en: "Apply ethics and regulation to biomaterials"
    zh: "将伦理和法规用于生物材料"
    zh-TW: "將倫理與法規應用於生物材料"
    ja: "生体材料に倫理と規制を当てはめる"
    ko: "생체재료에 윤리·규제 적용하기"
    vi: "Áp dụng đạo đức và quy định cho vật liệu sinh học"
    ms: "Guna etika dan peraturan pada bahan bio"
    id: "Menerapkan etika dan regulasi pada biomaterial"
    hi: "बायोमटेरियल पर नैतिकता और नियम लागू करें"
