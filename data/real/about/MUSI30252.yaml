code: MUSI30252
year: 2026
learn:
  en: "Advanced performance study: lessons, classes and ensemble work on varied styles, ending in a 20-minute exam."
  zh: "进阶演奏学习：个别课、小组课和合奏，涵盖多种风格，最后20分钟考核。"
  zh-TW: "進階演奏學習：個別課、小組課與合奏，涵蓋多種風格，最後20分鐘考核。"
  ja: "上級の演奏学習。レッスン、クラス、アンサンブルで多様な様式に取り組み、最後に20分の試験。"
  ko: "고급 연주 학습: 레슨, 수업, 앙상블로 다양한 양식을 다루고 20분 시험으로 마무리."
  vi: "Học biểu diễn nâng cao: học riêng, lớp và hòa tấu nhiều phong cách, kết thúc bằng bài thi 20 phút."
  ms: "Pengajian persembahan lanjutan: kelas, latihan ensembel pelbagai gaya, diakhiri ujian 20 minit."
  id: "Studi pertunjukan lanjutan: les, kelas dan ansambel berbagai gaya, diakhiri ujian 20 menit."
  hi: "उन्नत प्रस्तुति अध्ययन: पाठ, कक्षाएँ और समूह वादन, अंत में 20 मिनट की परीक्षा।"
outcomes:
  - en: "Handle varied stylistic demands"
    zh: "应对多种风格的演奏要求"
    zh-TW: "應對多種風格的演奏要求"
    ja: "多様な様式の要求に対応する"
    ko: "다양한 양식 요구에 대응하기"
    vi: "Đáp ứng yêu cầu nhiều phong cách"
    ms: "Hadapi tuntutan gaya yang pelbagai"
    id: "Menghadapi tuntutan gaya beragam"
    hi: "विविध शैलियों की माँग सँभालना"
  - en: "Control technique with consistency"
    zh: "稳定地掌控演奏技巧"
    zh-TW: "穩定地掌控演奏技巧"
    ja: "安定して技術をコントロールする"
    ko: "기술을 일관되게 다루기"
    vi: "Kiểm soát kỹ thuật ổn định"
    ms: "Kawal teknik dengan konsisten"
    id: "Mengendalikan teknik secara konsisten"
    hi: "तकनीक पर लगातार नियंत्रण"
  - en: "Perform with confidence and professionalism"
    zh: "自信而专业地演出"
    zh-TW: "自信而專業地演出"
    ja: "自信を持ってプロらしく演奏する"
    ko: "자신감 있고 프로답게 연주하기"
    vi: "Biểu diễn tự tin, chuyên nghiệp"
    ms: "Membuat persembahan dengan yakin dan profesional"
    id: "Tampil percaya diri dan profesional"
    hi: "आत्मविश्वास और पेशेवर ढंग से प्रस्तुति"
