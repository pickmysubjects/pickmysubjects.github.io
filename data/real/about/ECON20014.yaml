code: ECON20014
year: 2026
learn:
  en: "A research-style seminar for keen economics students, reading classic and current papers and spotting open questions."
  zh: "面向热爱经济学学生的研究型研讨课，读经典与前沿论文。"
  zh-TW: "給熱愛經濟學學生的研究型專題課，讀經典與前沿論文。"
  ja: "経済学好きの学生向け研究型ゼミ。古典と最新の論文を読み、未解決の問いを探す。"
  ko: "경제학에 열정 있는 학생을 위한 연구형 세미나: 고전·최신 논문 읽기."
  vi: "Seminar kiểu nghiên cứu cho sinh viên đam mê kinh tế: đọc bài báo kinh điển, hiện đại và tìm câu hỏi mở."
  ms: "Seminar gaya penyelidikan untuk pelajar minat ekonomi: baca kertas klasik dan terkini, cari soalan terbuka."
  id: "Seminar gaya riset untuk mahasiswa yang suka ekonomi: membaca paper klasik dan terbaru, mencari pertanyaan terbuka."
  hi: "अर्थशास्त्र के शौक़ीन छात्रों के लिए रिसर्च जैसा सेमिनार: पुराने और नए पेपर पढ़ना, खुले सवाल ढूँढना।"
outcomes:
  - en: "Understand major ideas in economics and where they came from"
    zh: "理解经济学的重要思想及其来源"
    zh-TW: "理解經濟學的重要思想及其來源"
    ja: "経済学の主要な考え方とその由来を理解する"
    ko: "경제학의 주요 사상과 그 기원 이해"
    vi: "Hiểu các ý tưởng lớn của kinh tế học và nguồn gốc"
    ms: "Fahami idea utama ekonomi dan asal-usulnya"
    id: "Memahami gagasan besar ekonomi dan asal-usulnya"
    hi: "अर्थशास्त्र के बड़े विचार और उनकी शुरुआत समझना"
  - en: "Think independently about economic questions"
    zh: "独立思考经济问题"
    zh-TW: "獨立思考經濟問題"
    ja: "経済の問題を自分で考える"
    ko: "경제 문제를 독립적으로 사고하기"
    vi: "Tư duy độc lập về các vấn đề kinh tế"
    ms: "Berfikir secara bebas tentang persoalan ekonomi"
    id: "Berpikir mandiri tentang persoalan ekonomi"
    hi: "आर्थिक सवालों पर स्वतंत्र रूप से सोचना"
  - en: "Improve your academic writing"
    zh: "提高学术写作能力"
    zh-TW: "提升學術寫作能力"
    ja: "学術的な文章力を高める"
    ko: "학술적 글쓰기 실력 향상"
    vi: "Nâng cao kỹ năng viết học thuật"
    ms: "Tingkatkan penulisan akademik"
    id: "Meningkatkan kemampuan menulis akademik"
    hi: "अकादमिक लेखन बेहतर करना"
