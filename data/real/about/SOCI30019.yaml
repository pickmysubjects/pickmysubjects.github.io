code: SOCI30019
year: 2027
learn:
  en: "Looking at social issues through the life course: how institutions, time and place shape people's lives and identities."
  zh: "从生命历程视角看社会问题：制度、时间和地点如何塑造人的经历与身份。"
  zh-TW: "從生命歷程視角看社會議題：制度、時間和地點如何形塑人的經歷與身分。"
  ja: "ライフコースの視点で社会問題を見る：制度・時代・場所が人の経験やアイデンティティをどう形づくるか。"
  ko: "생애과정 관점으로 사회 문제 보기: 제도, 시간, 장소가 사람의 경험과 정체성을 어떻게 만드는지."
  vi: "Nhìn các vấn đề xã hội qua lăng kính vòng đời: thể chế, thời gian và nơi chốn định hình trải nghiệm và bản sắc con người ra sao."
  ms: "Melihat isu sosial melalui perspektif kitaran hidup: bagaimana institusi, masa dan tempat membentuk pengalaman dan identiti seseorang."
  id: "Melihat isu sosial lewat perspektif perjalanan hidup: bagaimana institusi, waktu, dan tempat membentuk pengalaman dan identitas orang."
  hi: "जीवन-क्रम के नज़रिए से सामाजिक मुद्दे: संस्थाएँ, समय और जगह लोगों के अनुभव और पहचान को कैसे गढ़ते हैं।"
outcomes:
  - en: "Use life course ideas to study current social issues"
    zh: "用生命历程框架研究当代社会问题"
    zh-TW: "用生命歷程框架研究當代社會議題"
    ja: "ライフコースの枠組みで現代の社会問題を調べる"
    ko: "생애과정 틀로 현대 사회 문제 탐구하기"
    vi: "Dùng khung lý thuyết vòng đời để nghiên cứu vấn đề xã hội hiện nay"
    ms: "Guna rangka kitaran hidup untuk mengkaji isu sosial semasa"
    id: "Memakai kerangka perjalanan hidup untuk meneliti isu sosial terkini"
    hi: "जीवन-क्रम के विचारों से आज के सामाजिक मुद्दे पढ़ना"
  - en: "Analyse how individual lives link to wider social change"
    zh: "分析个人生活与更大社会变迁的联系"
    zh-TW: "分析個人生活與更大社會變遷的關聯"
    ja: "個人の人生と社会全体の変化のつながりを分析する"
    ko: "개인의 삶과 넓은 사회 변화의 연결 분석하기"
    vi: "Phân tích mối liên hệ giữa đời sống cá nhân và biến đổi xã hội"
    ms: "Analisis kaitan kehidupan individu dengan perubahan sosial yang lebih luas"
    id: "Menganalisis kaitan hidup individu dengan perubahan sosial yang lebih luas"
    hi: "व्यक्ति के जीवन और बड़े सामाजिक बदलाव का संबंध समझना"
  - en: "Critique social research and policy from a life course view"
    zh: "从生命历程角度评析社会研究与政策"
    zh-TW: "從生命歷程角度評析社會研究與政策"
    ja: "ライフコースの視点で社会調査や政策を評価する"
    ko: "생애과정 관점에서 사회 연구와 정책 평가하기"
    vi: "Đánh giá nghiên cứu và chính sách xã hội từ góc nhìn vòng đời"
    ms: "Nilai penyelidikan dan dasar sosial dari sudut kitaran hidup"
    id: "Mengkritisi riset dan kebijakan sosial dari sudut perjalanan hidup"
    hi: "जीवन-क्रम के नज़रिए से सामाजिक शोध और नीति की समीक्षा करना"
