code: PHYS30010
year: 2026
learn:
  en: "A deeper look at key body systems, combining them to answer clinical and real-life physiology questions."
  zh: "更深入学主要身体系统，综合起来回答临床和实际问题。"
outcomes:
  - en: "Explain how body systems combine in complex functions"
    zh: "解释多个系统怎么共同完成功能"
  - en: "Predict how the body copes with clinical or extreme stress"
    zh: "预测身体怎么应对疾病或极端情况"
  - en: "Work in a group to build a shared answer"
    zh: "和小组一起得出共同答案"
