code: PHYS30010
year: 2026
learn:
  en: "A deeper look at key body systems, combining them to answer clinical and real-life physiology questions."
  zh: "更深入学主要身体系统，综合起来回答临床和实际问题。"
  zh-TW: "更深入學主要身體系統，綜合起來回答臨床和實際問題。"
  ja: "主な体のシステムをより深く学び、組み合わせて臨床や実生活の生理学の問いに答える。"
  ko: "주요 신체 계통을 더 깊이 배우고, 이를 종합해 임상·실생활 생리학 질문에 답함."
  vi: "Tìm hiểu sâu các hệ cơ quan chính, kết hợp để trả lời câu hỏi sinh lý lâm sàng và thực tế."
  ms: "Kajian lebih mendalam sistem badan utama, digabung untuk menjawab soalan fisiologi klinikal dan sebenar."
  id: "Pembahasan lebih dalam sistem tubuh utama, digabung untuk menjawab soal fisiologi klinis dan nyata."
  hi: "शरीर के मुख्य सिस्टम का गहरा अध्ययन, जिन्हें जोड़कर क्लिनिकल व असल ज़िंदगी के सवाल हल होते हैं।"
outcomes:
  - en: "Explain how body systems combine in complex functions"
    zh: "解释多个系统怎么共同完成功能"
    zh-TW: "解釋多個系統怎麼共同完成複雜功能"
    ja: "複数のシステムが複雑な機能でどう組み合わさるか説明する"
    ko: "여러 계통이 복잡한 기능에서 어떻게 결합하는지 설명"
    vi: "Giải thích các hệ phối hợp trong chức năng phức tạp ra sao"
    ms: "Terangkan cara sistem badan bergabung dalam fungsi kompleks"
    id: "Menjelaskan cara sistem tubuh bergabung dalam fungsi kompleks"
    hi: "जटिल कार्यों में शरीर के सिस्टम कैसे मिलते हैं, समझाना"
  - en: "Predict how the body copes with clinical or extreme stress"
    zh: "预测身体怎么应对疾病或极端情况"
    zh-TW: "預測身體怎麼應對疾病或極端壓力"
    ja: "病気や極端なストレスに体がどう対応するか予測する"
    ko: "임상적·극한 스트레스에 몸이 어떻게 대응할지 예측"
    vi: "Dự đoán cơ thể đối phó với bệnh hoặc áp lực cực độ ra sao"
    ms: "Ramal cara badan menghadapi tekanan klinikal atau ekstrem"
    id: "Memprediksi cara tubuh menghadapi stres klinis atau ekstrem"
    hi: "बीमारी या अत्यधिक दबाव में शरीर कैसे संभलता है, अनुमान लगाना"
  - en: "Work in a group to build a shared answer"
    zh: "和小组一起得出共同答案"
    zh-TW: "和小組一起得出共同答案"
    ja: "グループで協力して共通の答えをまとめる"
    ko: "그룹으로 공동 답안 만들기"
    vi: "Làm việc nhóm để đưa ra câu trả lời chung"
    ms: "Bekerja dalam kumpulan untuk bina jawapan bersama"
    id: "Bekerja dalam kelompok untuk menyusun jawaban bersama"
    hi: "ग्रुप में मिलकर साझा जवाब बनाना"
