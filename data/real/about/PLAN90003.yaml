code: PLAN90003
year: 2027
learn:
  en: "How cities are led and governed amid global challenges, with practical leadership skills taught alongside expert partners."
  zh: "在全球挑战下城市如何被领导和治理，并与行业专家一起学习实用的领导技能。"
  zh-TW: "在全球挑戰下城市如何被領導與治理，並與業界專家一起學習實用的領導技能。"
  ja: "世界的課題の中で都市がどう率いられ統治されるかを、専門家と共に実践的なリーダー技能として学ぶ。"
  ko: "세계적 과제 속 도시의 리더십과 거버넌스를 전문가 파트너와 함께 실용적 리더십 기술로 배웁니다."
  vi: "Cách đô thị được lãnh đạo và quản trị trước thách thức toàn cầu, học kỹ năng lãnh đạo cùng chuyên gia."
  ms: "Cara bandar dipimpin dan ditadbir dalam cabaran global, dengan kemahiran kepimpinan praktikal."
  id: "Cara kota dipimpin dan dikelola di tengah tantangan global, dengan keterampilan kepemimpinan praktis."
  hi: "वैश्विक चुनौतियों में शहरों का नेतृत्व और शासन, विशेषज्ञ साझेदारों के साथ व्यावहारिक नेतृत्व कौशल।"
outcomes:
  - en: "Explain trends shaping city leadership"
    zh: "解释影响城市领导力的趋势"
    zh-TW: "解釋影響城市領導力的趨勢"
    ja: "都市のリーダーシップを形づくる潮流を説明する"
    ko: "도시 리더십을 이끄는 흐름 설명하기"
    vi: "Giải thích xu hướng định hình lãnh đạo đô thị"
    ms: "Menerangkan trend yang membentuk kepimpinan bandar"
    id: "Menjelaskan tren kepemimpinan kota"
    hi: "शहरी नेतृत्व को आकार देने वाले रुझान समझाना"
  - en: "Apply practical urban leadership tools"
    zh: "运用实用的城市领导工具"
    zh-TW: "運用實用的城市領導工具"
    ja: "実践的な都市リーダー手法を使う"
    ko: "실용적인 도시 리더십 도구 활용하기"
    vi: "Áp dụng công cụ lãnh đạo đô thị thực tế"
    ms: "Menggunakan alat kepimpinan bandar praktikal"
    id: "Menerapkan alat kepemimpinan kota praktis"
    hi: "व्यावहारिक शहरी नेतृत्व उपकरण अपनाना"
