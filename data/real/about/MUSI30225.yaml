code: MUSI30225
year: 2026
learn:
  en: "Contemporary ensemble work where you take the lead: rehearsals, workshops, a big band and your own songs and arrangements."
  zh: "当代合奏课，由你担任领导：排练、工作坊、大乐团以及自己的歌曲和编曲。"
  zh-TW: "當代合奏課，由你擔任領導：排練、工作坊、大樂團以及自己的歌曲與編曲。"
  ja: "現代音楽のアンサンブルで主導役に。リハーサル、ワークショップ、大編成、自作曲と編曲。"
  ko: "현대 앙상블에서 리더 역할: 리허설, 워크숍, 대편성, 자작곡과 편곡."
  vi: "Hòa tấu đương đại, bạn giữ vai trò dẫn dắt: tập luyện, workshop, ban lớn và sáng tác riêng."
  ms: "Ensembel kontemporari sebagai pemimpin: latihan, bengkel, ensembel besar dan lagu sendiri."
  id: "Ansambel kontemporer sebagai pemimpin: latihan, lokakarya, ansambel besar, lagu sendiri."
  hi: "समकालीन एन्सेम्बल में नेतृत्व: रिहर्सल, वर्कशॉप, बड़ा बैंड और अपने गीत व अरेंजमेंट।"
outcomes:
  - en: "Lead and contribute in an ensemble"
    zh: "在乐团中担任领导并贡献"
    zh-TW: "在樂團中擔任領導並貢獻"
    ja: "アンサンブルを率い、貢献する"
    ko: "앙상블을 이끌고 기여하기"
    vi: "Dẫn dắt và đóng góp trong ban nhạc"
    ms: "Memimpin dan menyumbang dalam ensembel"
    id: "Memimpin dan berkontribusi di ansambel"
    hi: "एन्सेम्बल में नेतृत्व और योगदान"
  - en: "Perform original repertoire well"
    zh: "出色演奏原创曲目"
    zh-TW: "出色演奏原創曲目"
    ja: "オリジナル曲を上手に演奏する"
    ko: "창작곡 수준 높게 연주하기"
    vi: "Biểu diễn tác phẩm tự sáng tác"
    ms: "Persembahkan karya asli dengan baik"
    id: "Membawakan karya orisinal dengan baik"
    hi: "मौलिक रचनाएँ अच्छे से प्रस्तुत करना"
  - en: "Compose and arrange songs"
    zh: "创作并编配歌曲"
    zh-TW: "創作並編配歌曲"
    ja: "曲を作り編曲する"
    ko: "곡 쓰고 편곡하기"
    vi: "Sáng tác và phối khí bài hát"
    ms: "Menggubah dan mengatur lagu"
    id: "Menulis dan mengaransemen lagu"
    hi: "गीत रचना और अरेंजमेंट"
