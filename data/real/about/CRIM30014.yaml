code: CRIM30014
year: 2026
learn:
  en: "The criminology capstone: build your own research or policy project on a real social justice or justice system problem."
  zh: "犯罪学毕业课：针对真实的社会正义或司法问题，做自己的研究或政策项目。"
  zh-TW: "犯罪學總整課：針對真實的社會正義或司法問題，做自己的研究或政策專題。"
  ja: "犯罪学の総まとめ科目。実際の社会正義や司法の問題について、自分で研究か政策のプロジェクトを作る。"
  ko: "범죄학 캡스톤 과목으로, 실제 사회 정의나 사법 문제에 대해 직접 연구 또는 정책 프로젝트를 만든다."
  vi: "Môn tổng kết tội phạm học: tự xây dựng dự án nghiên cứu hoặc chính sách về một vấn đề công lý xã hội hay tư pháp có thật."
  ms: "Subjek kemuncak kriminologi: bina projek kajian atau dasar sendiri tentang masalah keadilan sosial atau sistem keadilan sebenar."
  id: "Mata kuliah puncak kriminologi: menyusun proyek riset atau kebijakan sendiri tentang masalah keadilan sosial atau peradilan nyata."
  hi: "क्रिमिनोलॉजी का कैपस्टोन: किसी असली सामाजिक न्याय या न्याय व्यवस्था की समस्या पर अपना शोध या नीति प्रोजेक्ट बनाना।"
outcomes:
  - en: "Identify a current problem in criminology"
    zh: "找出犯罪学中一个当前的问题"
    zh-TW: "找出犯罪學中一個當前的問題"
    ja: "犯罪学の今の課題を見つける"
    ko: "범죄학의 현재 문제 찾아내기"
    vi: "Xác định một vấn đề hiện nay trong tội phạm học"
    ms: "Kenal pasti satu masalah semasa dalam kriminologi"
    id: "Mengenali satu masalah terkini dalam kriminologi"
    hi: "क्रिमिनोलॉजी की कोई मौजूदा समस्या पहचानना"
  - en: "Apply theory or practice skills to that problem"
    zh: "把理论或实务技能用在这个问题上"
    zh-TW: "把理論或實務技能用在這個問題上"
    ja: "その課題に理論や実務の力を使う"
    ko: "그 문제에 이론이나 실무 역량 적용하기"
    vi: "Áp dụng lý thuyết hoặc kỹ năng thực hành vào vấn đề đó"
    ms: "Aplikasikan teori atau kemahiran amalan pada masalah itu"
    id: "Menerapkan teori atau keterampilan praktik pada masalah itu"
    hi: "उस समस्या पर सिद्धांत या व्यावहारिक कौशल लागू करना"
  - en: "Develop and present a research project"
    zh: "完成并展示一个研究项目"
    zh-TW: "完成並展示一個研究專題"
    ja: "研究プロジェクトを作って発表する"
    ko: "연구 프로젝트를 만들고 발표하기"
    vi: "Xây dựng và trình bày một dự án nghiên cứu"
    ms: "Bangunkan dan bentangkan projek kajian"
    id: "Menyusun dan memaparkan proyek riset"
    hi: "एक शोध प्रोजेक्ट बनाना और प्रस्तुत करना"
