code: DPSS20014
year: 2027
learn:
  en: "Design for live performance: learning to catch and develop unexpected ideas when answering design briefs."
  zh: "为现场表演做设计：学会在回应设计任务时抓住并发展意外的灵感。"
  zh-TW: "為現場表演做設計：學會在回應設計任務時抓住並發展意外的靈感。"
  ja: "舞台芸術のためのデザイン：課題に取り組む中で思いがけないアイデアをつかみ、発展させる方法を学ぶ。"
  ko: "공연을 위한 디자인: 디자인 과제에 답하며 뜻밖의 아이디어를 포착하고 발전시키는 법을 배운다."
  vi: "Thiết kế cho biểu diễn trực tiếp: học cách nắm bắt và phát triển ý tưởng bất ngờ khi làm đề bài thiết kế."
  ms: "Reka bentuk untuk persembahan langsung: belajar menangkap dan kembangkan idea tidak dijangka semasa menjawab taklimat reka bentuk."
  id: "Desain untuk pertunjukan langsung: belajar menangkap dan mengembangkan ide tak terduga saat menjawab brief desain."
  hi: "लाइव परफ़ॉर्मेंस के लिए डिज़ाइन: डिज़ाइन ब्रीफ़ पर काम करते हुए अचानक आए विचारों को पकड़ना और विकसित करना।"
outcomes:
  - en: "Analyse a design brief and plan a visual response"
    zh: "分析设计任务并构思视觉方案"
    zh-TW: "分析設計任務並構思視覺方案"
    ja: "デザイン課題を分析し視覚的な案を考える"
    ko: "디자인 과제를 분석하고 시각적 답안 구상하기"
    vi: "Phân tích đề bài thiết kế và lên ý tưởng hình ảnh"
    ms: "Analisis taklimat reka bentuk dan rancang respons visual"
    id: "Menganalisis brief desain dan menyusun respons visual"
    hi: "डिज़ाइन ब्रीफ़ का विश्लेषण कर दृश्य जवाब सोचना"
  - en: "Bring unexpected ideas into the design process"
    zh: "把意外灵感融入设计过程"
    zh-TW: "把意外靈感融入設計過程"
    ja: "思いがけないアイデアをデザインに取り込む"
    ko: "뜻밖의 아이디어를 디자인 과정에 녹이기"
    vi: "Đưa ý tưởng bất ngờ vào quá trình thiết kế"
    ms: "Masukkan idea tidak dijangka ke dalam proses reka bentuk"
    id: "Memasukkan ide tak terduga ke proses desain"
    hi: "अप्रत्याशित विचारों को डिज़ाइन प्रक्रिया में लाना"
