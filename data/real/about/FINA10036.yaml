code: FINA10036
year: 2026
learn:
  en: "Life drawing for beginners: draw the human figure from a live model and see how artists have shown the body through history."
  zh: "零基础人体写生：对着真人模特画人体，并了解艺术史上如何表现身体"
  zh-TW: "零基礎人體寫生：對著真人模特畫人體，並了解藝術史上如何表現身體"
  ja: "初心者向けの人体デッサン。モデルを前に人体を描き、美術史における身体表現を学ぶ。"
  ko: "초보자를 위한 인체 드로잉: 실제 모델을 보고 그리며 미술사 속 신체 표현을 살펴봄."
  vi: "Vẽ người mẫu cho người mới: vẽ cơ thể từ mẫu thật và tìm hiểu cách nghệ thuật thể hiện cơ thể qua lịch sử."
  ms: "Lukisan figura untuk pemula: lukis tubuh manusia daripada model hidup dan lihat cara seni menggambarkannya."
  id: "Menggambar figur untuk pemula: gambar tubuh dari model langsung dan pelajari cara seni menampilkan tubuh."
  hi: "शुरुआती लोगों के लिए लाइफ़ ड्रॉइंग: जीवित मॉडल से मानव शरीर बनाना और कला इतिहास में शरीर का चित्रण समझना।"
outcomes:
  - en: "Draw the figure from direct observation"
    zh: "通过直接观察画出人体"
    zh-TW: "透過直接觀察畫出人體"
    ja: "直接観察で人体を描く"
    ko: "직접 관찰로 인체 그리기"
    vi: "Vẽ cơ thể người từ quan sát trực tiếp"
    ms: "Melukis figura melalui pemerhatian langsung"
    id: "Menggambar figur dari pengamatan langsung"
    hi: "सीधे देखकर मानव आकृति बनाना"
  - en: "Explain how art has represented the body, past and present"
    zh: "解释古今艺术如何表现人体"
    zh-TW: "解釋古今藝術如何表現人體"
    ja: "古今の美術が身体をどう表してきたか説明する"
    ko: "과거와 현재 미술이 신체를 어떻게 표현했는지 설명하기"
    vi: "Giải thích nghệ thuật xưa nay thể hiện cơ thể ra sao"
    ms: "Menerangkan cara seni dahulu dan kini menggambarkan tubuh"
    id: "Menjelaskan cara seni dulu dan kini menampilkan tubuh"
    hi: "समझाना कि कला ने अतीत और वर्तमान में शरीर को कैसे दर्शाया"
  - en: "Experiment with media and ideas in a finished folio"
    zh: "在完整作品集中尝试不同材料和想法"
    zh-TW: "在完整作品集中嘗試不同材料和想法"
    ja: "画材やアイデアを試し、作品集にまとめる"
    ko: "다양한 재료와 아이디어를 실험해 포트폴리오 완성하기"
    vi: "Thử nghiệm chất liệu và ý tưởng trong hồ sơ tác phẩm"
    ms: "Bereksperimen dengan bahan dan idea dalam folio"
    id: "Bereksperimen dengan media dan ide dalam portofolio"
    hi: "सामग्री और विचारों के प्रयोग से फ़ोलियो तैयार करना"
