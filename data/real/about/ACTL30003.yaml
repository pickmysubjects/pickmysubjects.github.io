code: ACTL30003
year: 2026
learn:
  en: "Pricing life insurance and annuities and setting reserves when payments depend on one or more lives."
  zh: "为取决于一人或多人生死的寿险和年金定价并计提准备金。"
  zh-TW: "替取決於一人或多人生存的壽險與年金定價並提存準備金。"
  ja: "一人または複数の生死に左右される生命保険・年金の価格付けと責任準備金。"
  ko: "한 명 이상의 생존에 따라 지급되는 생명보험·연금의 가격과 준비금 산정."
  vi: "Định giá bảo hiểm nhân thọ, niên kim và lập dự phòng khi khoản chi trả phụ thuộc vào một hay nhiều người."
  ms: "Menentukan harga insurans hayat dan anuiti serta rizab apabila bayaran bergantung pada satu atau lebih nyawa."
  id: "Menentukan harga asuransi jiwa dan anuitas serta cadangan ketika pembayaran bergantung pada satu atau lebih jiwa."
  hi: "जब भुगतान एक या अधिक लोगों के जीवन पर निर्भर हो, तब जीवन बीमा और एन्युइटी की कीमत और रिज़र्व तय करना।"
outcomes:
  - en: "Value insurance and annuities on one or two lives"
    zh: "对单人或两人的保险和年金估值"
    zh-TW: "對單人或兩人的保險與年金估值"
    ja: "一人・二人の保険と年金を評価する"
    ko: "1인 또는 2인 보험·연금 가치 평가"
    vi: "Định giá bảo hiểm và niên kim cho một hoặc hai người"
    ms: "Nilai insurans dan anuiti untuk satu atau dua nyawa"
    id: "Menilai asuransi dan anuitas untuk satu atau dua jiwa"
    hi: "एक या दो लोगों के बीमा और एन्युइटी का मूल्यांकन"
  - en: "Calculate gross premiums and reserves"
    zh: "计算毛保费和准备金"
    zh-TW: "計算總保費與準備金"
    ja: "営業保険料と責任準備金を計算する"
    ko: "영업보험료와 준비금 계산"
    vi: "Tính phí bảo hiểm gộp và dự phòng"
    ms: "Kira premium kasar dan rizab"
    id: "Menghitung premi bruto dan cadangan"
    hi: "ग्रॉस प्रीमियम और रिज़र्व की गणना"
  - en: "Profit-test policies with spreadsheet cash flows"
    zh: "用电子表格现金流做利润测试"
    zh-TW: "用試算表現金流量做利潤測試"
    ja: "表計算のキャッシュフローで収益性を検証する"
    ko: "스프레드시트 현금흐름으로 수익성 검증"
    vi: "Kiểm tra lợi nhuận hợp đồng bằng dòng tiền trên bảng tính"
    ms: "Uji keuntungan polisi dengan aliran tunai hamparan"
    id: "Menguji laba polis dengan arus kas di spreadsheet"
    hi: "स्प्रेडशीट कैश फ़्लो से पॉलिसी की प्रॉफ़िट टेस्टिंग"
