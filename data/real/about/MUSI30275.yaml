code: MUSI30275
year: 2026
learn:
  en: "Large ensemble projects and chamber music coaching at ANAM, ending in a 30-minute chamber performance."
  zh: "在ANAM参加大型乐团项目和室内乐辅导，最后进行30分钟室内乐演出。"
  zh-TW: "在ANAM參加大型樂團專案與室內樂指導，最後進行30分鐘室內樂演出。"
  ja: "ANAMで大編成アンサンブルと室内楽指導に参加し、最後に30分の室内楽演奏。"
  ko: "ANAM에서 대편성 앙상블과 실내악 코칭에 참여하고 30분 실내악 공연으로 마무리."
  vi: "Dự án dàn nhạc lớn và hướng dẫn nhạc thính phòng tại ANAM, kết thúc bằng buổi diễn 30 phút."
  ms: "Projek ensembel besar dan bimbingan muzik kamar di ANAM, diakhiri persembahan 30 minit."
  id: "Proyek ansambel besar dan pembinaan musik kamar di ANAM, diakhiri pertunjukan 30 menit."
  hi: "ANAM में बड़े समूह प्रोजेक्ट और चैंबर संगीत कोचिंग, अंत में 30 मिनट की प्रस्तुति।"
outcomes:
  - en: "Lead within an ensemble"
    zh: "在合奏中发挥引领作用"
    zh-TW: "在合奏中發揮引領作用"
    ja: "アンサンブルの中で先導する"
    ko: "앙상블 안에서 리드하기"
    vi: "Dẫn dắt trong dàn hòa tấu"
    ms: "Memimpin dalam ensembel"
    id: "Memimpin dalam ansambel"
    hi: "समूह में नेतृत्व करना"
  - en: "Shape balance, blend and phrasing"
    zh: "把握声部平衡、融合与乐句"
    zh-TW: "把握聲部平衡、融合與樂句"
    ja: "バランス・溶け合い・フレーズを作る"
    ko: "균형, 조화, 프레이징 다듬기"
    vi: "Điều chỉnh cân bằng, hòa âm, câu nhạc"
    ms: "Bentuk imbangan, adunan dan frasa"
    id: "Mengatur keseimbangan, paduan dan frasa"
    hi: "संतुलन, मेल और फ़्रेज़िंग साधना"
  - en: "Perform demanding repertoire in concert"
    zh: "在音乐会上演奏高难度曲目"
    zh-TW: "在音樂會上演奏高難度曲目"
    ja: "難しい曲を演奏会水準で弾く"
    ko: "어려운 곡을 연주회 수준으로 연주하기"
    vi: "Biểu diễn tác phẩm khó trên sân khấu"
    ms: "Persembahkan repertoir sukar di konsert"
    id: "Membawakan repertoar sulit di konser"
    hi: "कठिन रचनाएँ कॉन्सर्ट में बजाना"
