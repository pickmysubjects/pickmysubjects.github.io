code: PHIL20030
year: 2026
learn:
  en: "Logics of necessity, time and conditionals, and how possible-worlds semantics is used in theories of meaning."
  zh: "关于必然性、时间和条件句的逻辑，以及可能世界语义学如何用于意义理论。"
  zh-TW: "關於必然性、時間和條件句的邏輯，以及可能世界語意學如何用於意義理論。"
  ja: "必然性・時間・条件文の論理と、可能世界意味論が意味の理論でどう使われるかを学ぶ。"
  ko: "필연성·시간·조건문의 논리와, 가능세계 의미론이 의미 이론에 어떻게 쓰이는지 배운다."
  vi: "Logic về tất yếu, thời gian và câu điều kiện, và cách ngữ nghĩa thế giới khả hữu được dùng trong lý thuyết ý nghĩa."
  ms: "Logik keperluan, masa dan syarat, serta cara semantik dunia mungkin digunakan dalam teori makna."
  id: "Logika keniscayaan, waktu dan kondisional, serta cara semantik dunia mungkin dipakai dalam teori makna."
  hi: "आवश्यकता, समय और सशर्त कथनों के तर्कशास्त्र, और अर्थ के सिद्धांतों में संभव-विश्व अर्थविज्ञान का उपयोग।"
outcomes:
  - en: "Use modal and temporal logic"
    zh: "运用模态逻辑和时态逻辑"
    zh-TW: "運用模態邏輯和時態邏輯"
    ja: "様相論理と時制論理を使う"
    ko: "양상 논리와 시제 논리 활용하기"
    vi: "Sử dụng logic tình thái và logic thời gian"
    ms: "Guna logik modal dan temporal"
    id: "Memakai logika modal dan temporal"
    hi: "मोडल और टेम्पोरल लॉजिक का उपयोग करना"
  - en: "Explain possible-worlds semantics"
    zh: "解释可能世界语义学"
    zh-TW: "解釋可能世界語意學"
    ja: "可能世界意味論を説明する"
    ko: "가능세계 의미론 설명하기"
    vi: "Giải thích ngữ nghĩa thế giới khả hữu"
    ms: "Terangkan semantik dunia mungkin"
    id: "Menjelaskan semantik dunia mungkin"
    hi: "संभव-विश्व अर्थविज्ञान समझाना"
  - en: "Apply formal tools to questions about meaning"
    zh: "把形式工具用于意义问题"
    zh-TW: "把形式工具用於意義問題"
    ja: "形式的な道具を意味の問題に当てはめる"
    ko: "형식적 도구를 의미 문제에 적용하기"
    vi: "Áp dụng công cụ hình thức vào câu hỏi về ý nghĩa"
    ms: "Gunakan alat formal pada persoalan makna"
    id: "Menerapkan alat formal pada soal makna"
    hi: "अर्थ से जुड़े सवालों पर औपचारिक औज़ार लागू करना"
