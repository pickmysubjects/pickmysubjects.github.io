code: MAST90111
year: 2027
learn:
  en: "Statistical models for dependent data over time and space, like functional, geostatistical, lattice and point process data."
  zh: "处理时空相依数据的统计模型：函数型、地统计、格点与点过程数据。"
  zh-TW: "處理時空相依資料的統計模型：函數型、地理統計、格點與點過程資料。"
  ja: "時空間で依存するデータの統計モデル：関数データ、地球統計、格子、点過程。"
  ko: "시공간 의존 자료의 통계모형: 함수형, 지구통계, 격자, 점과정 자료."
  vi: "Mô hình thống kê cho dữ liệu phụ thuộc theo thời gian và không gian: hàm, địa thống kê, lưới, quá trình điểm."
  ms: "Model statistik untuk data bergantung masa dan ruang: fungsian, geostatistik, kekisi, proses titik."
  id: "Model statistik untuk data dependen ruang-waktu: fungsional, geostatistik, lattice, proses titik."
  hi: "समय और स्थान में निर्भर डेटा के सांख्यिकीय मॉडल: फ़ंक्शनल, जियोस्टैटिस्टिकल, लैटिस, पॉइंट प्रोसेस।"
outcomes:
  - en: "Choose models that handle dependence in data"
    zh: "选择能处理数据相依性的模型"
    zh-TW: "選擇能處理資料相依性的模型"
    ja: "データの依存性を扱えるモデルを選ぶ"
    ko: "자료의 의존성을 다루는 모형 고르기"
    vi: "Chọn mô hình xử lý được sự phụ thuộc trong dữ liệu"
    ms: "Memilih model yang mengendali kebergantungan data"
    id: "Memilih model yang menangani dependensi data"
    hi: "डेटा की निर्भरता संभालने वाले मॉडल चुनना"
  - en: "Make predictions and inferences from complex data"
    zh: "对复杂数据进行预测与推断"
    zh-TW: "對複雜資料進行預測與推論"
    ja: "複雑なデータから予測・推論する"
    ko: "복잡한 자료로 예측·추론하기"
    vi: "Dự đoán và suy luận từ dữ liệu phức tạp"
    ms: "Membuat ramalan dan inferens daripada data kompleks"
    id: "Membuat prediksi dan inferensi dari data kompleks"
    hi: "जटिल डेटा से अनुमान और भविष्यवाणी करना"
