code: GEOG10001
year: 2026
learn:
  en: "Why famine and hunger happen when the world grows enough food, and how theories of scarcity shape fixes."
  zh: "世界粮食充足却仍有饥荒的原因，以及稀缺理论如何影响对策。"
  zh-TW: "世界糧食充足卻仍有饑荒的原因，以及稀缺理論如何影響對策。"
  ja: "食料が足りても飢饉が起きる理由と、欠乏の理論が対策をどう左右するか。"
  ko: "식량이 충분한데도 기근이 생기는 이유와 희소성 이론이 해결책에 주는 영향."
  vi: "Vì sao vẫn có nạn đói dù thế giới đủ lương thực, và lý thuyết khan hiếm định hình giải pháp ra sao."
  ms: "Kenapa kebuluran berlaku walau makanan cukup, dan bagaimana teori kekurangan membentuk penyelesaian."
  id: "Mengapa kelaparan terjadi meski pangan cukup, dan bagaimana teori kelangkaan membentuk solusi."
  hi: "दुनिया में पर्याप्त भोजन होते हुए भी अकाल क्यों होता है, और अभाव के सिद्धांत समाधान कैसे तय करते हैं।"
outcomes:
  - en: "Identify the causes of hunger and famine"
    zh: "找出饥饿和饥荒的成因"
    zh-TW: "找出飢餓與饑荒的成因"
    ja: "飢餓と飢饉の原因を特定する"
    ko: "기아와 기근의 원인 파악하기"
    vi: "Xác định nguyên nhân đói và nạn đói"
    ms: "Kenal pasti punca kelaparan dan kebuluran"
    id: "Mengidentifikasi penyebab kelaparan"
    hi: "भूख और अकाल के कारण पहचानना"
  - en: "Link climate, population and food supply"
    zh: "联系气候、人口与粮食供应"
    zh-TW: "連結氣候、人口與糧食供應"
    ja: "気候・人口・食料供給を結びつける"
    ko: "기후·인구·식량 공급 연결하기"
    vi: "Liên hệ khí hậu, dân số và nguồn lương thực"
    ms: "Kaitkan iklim, penduduk dan bekalan makanan"
    id: "Mengaitkan iklim, penduduk, dan pasokan pangan"
    hi: "जलवायु, जनसंख्या और खाद्य आपूर्ति को जोड़ना"
