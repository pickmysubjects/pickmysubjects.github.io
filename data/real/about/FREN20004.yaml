code: FREN20004
year: 2026
learn:
  en: "Translating French into English, in theory and practice: weekly method seminars and workshops on news, technical and literary texts."
  zh: "法译英的理论与实践：每周讲授翻译方法，并在工作坊中翻译新闻、技术和文学文本。"
  zh-TW: "法譯英的理論與實務：每週講授翻譯方法，並在工作坊中翻譯新聞、技術和文學文本。"
  ja: "フランス語から英語への翻訳を理論と実践で。毎週の方法論セミナーと、報道・技術・文学テキストの演習。"
  ko: "프랑스어를 영어로 옮기는 번역의 이론과 실제. 매주 방법론 세미나와 뉴스·기술·문학 텍스트 워크숍."
  vi: "Dịch Pháp sang Anh, lý thuyết và thực hành: seminar phương pháp hằng tuần và workshop dịch báo chí, kỹ thuật, văn học."
  ms: "Terjemahan Perancis ke Inggeris, teori dan amalan: seminar kaedah mingguan dan bengkel teks berita, teknikal dan sastera."
  id: "Menerjemahkan Prancis ke Inggris, teori dan praktik: seminar metode mingguan dan lokakarya teks berita, teknis dan sastra."
  hi: "फ़्रेंच से अंग्रेज़ी अनुवाद, सिद्धांत और अभ्यास: हर हफ़्ते तरीकों पर सेमिनार और खबर, तकनीकी व साहित्यिक पाठों पर वर्कशॉप।"
outcomes:
  - en: "Compare French and English style"
    zh: "比较法语和英语的文体差异"
    zh-TW: "比較法語和英語的文體差異"
    ja: "フランス語と英語の文体を比べる"
    ko: "프랑스어와 영어의 문체 비교하기"
    vi: "So sánh phong cách tiếng Pháp và tiếng Anh"
    ms: "Bandingkan gaya bahasa Perancis dan Inggeris"
    id: "Membandingkan gaya bahasa Prancis dan Inggris"
    hi: "फ़्रेंच और अंग्रेज़ी शैली की तुलना करना"
  - en: "Translate different kinds of French text"
    zh: "翻译不同类型的法语文本"
    zh-TW: "翻譯不同類型的法語文本"
    ja: "さまざまな種類のフランス語を訳す"
    ko: "다양한 종류의 프랑스어 텍스트 번역하기"
    vi: "Dịch nhiều loại văn bản tiếng Pháp"
    ms: "Terjemah pelbagai jenis teks Perancis"
    id: "Menerjemahkan berbagai jenis teks Prancis"
    hi: "अलग-अलग तरह के फ़्रेंच पाठों का अनुवाद करना"
  - en: "Explain and justify your translation choices"
    zh: "说明并论证自己的翻译选择"
    zh-TW: "說明並論證自己的翻譯選擇"
    ja: "自分の訳の選択を説明し根拠を示す"
    ko: "자신의 번역 선택을 설명하고 근거 대기"
    vi: "Giải thích và biện minh cho lựa chọn dịch"
    ms: "Terang dan wajarkan pilihan terjemahan anda"
    id: "Menjelaskan dan membenarkan pilihan terjemahan"
    hi: "अपने अनुवाद के फ़ैसलों को समझाना और सही ठहराना"
