code: ASIA30004
year: 2026
learn:
  en: "What corruption is, its causes and effects on development in Asia, and which strategies to fight it have worked."
  zh: "什么是腐败，它对亚洲发展的成因和影响，以及哪些反腐策略有效。"
  zh-TW: "什麼是貪腐，它對亞洲發展的成因和影響，以及哪些反貪策略有效。"
  ja: "汚職とは何か、アジアの発展への原因と影響、そしてどの対策が効いたかを学ぶ。"
  ko: "부패란 무엇인지, 아시아 발전에 미친 원인과 영향, 어떤 반부패 전략이 효과가 있었는지 배운다."
  vi: "Tham nhũng là gì, nguyên nhân và tác động đến phát triển ở châu Á, và chiến lược chống tham nhũng nào hiệu quả."
  ms: "Apa itu rasuah, punca dan kesannya terhadap pembangunan di Asia, dan strategi membanterasnya yang berkesan."
  id: "Apa itu korupsi, penyebab dan dampaknya pada pembangunan di Asia, dan strategi pemberantasan mana yang berhasil."
  hi: "भ्रष्टाचार क्या है, एशिया के विकास पर इसके कारण और असर, और इससे लड़ने की कौन-सी रणनीतियाँ कारगर रहीं।"
outcomes:
  - en: "Compare frameworks for understanding corruption"
    zh: "比较理解腐败的分析框架"
    zh-TW: "比較理解貪腐的分析框架"
    ja: "汚職を理解する枠組みを比べる"
    ko: "부패 이해 틀 비교하기"
    vi: "So sánh các khung phân tích về tham nhũng"
    ms: "Bandingkan rangka kerja untuk memahami rasuah"
    id: "Membandingkan kerangka untuk memahami korupsi"
    hi: "भ्रष्टाचार समझने के ढाँचों की तुलना करना"
  - en: "Analyse causes and effects of corruption in Asia"
    zh: "分析亚洲腐败的成因与后果"
    zh-TW: "分析亞洲貪腐的成因與後果"
    ja: "アジアの汚職の原因と結果を分析する"
    ko: "아시아 부패의 원인과 결과 분석하기"
    vi: "Phân tích nguyên nhân và hậu quả tham nhũng ở châu Á"
    ms: "Analisis punca dan kesan rasuah di Asia"
    id: "Menganalisis penyebab dan akibat korupsi di Asia"
    hi: "एशिया में भ्रष्टाचार के कारण और प्रभावों का विश्लेषण करना"
  - en: "Evaluate anti-corruption strategies"
    zh: "评估反腐策略"
    zh-TW: "評估反貪策略"
    ja: "汚職対策を評価する"
    ko: "반부패 전략 평가하기"
    vi: "Đánh giá các chiến lược chống tham nhũng"
    ms: "Nilai strategi pencegahan rasuah"
    id: "Menilai strategi antikorupsi"
    hi: "भ्रष्टाचार-विरोधी रणनीतियों का मूल्यांकन करना"
