code: ECOM90001
year: 2027
learn:
  en: "Multiple regression for economics and business: testing hypotheses, fixing common problems, and a project on real data."
  zh: "面向经管的多元回归：假设检验、常见问题处理，并用真实数据做项目。"
  zh-TW: "面向經管的多元迴歸：假設檢定、常見問題處理，並用真實資料做專題。"
  ja: "経済・ビジネス向けの重回帰：仮説検定、典型的な問題への対処、実データでのプロジェクト。"
  ko: "경제·경영을 위한 다중회귀: 가설 검정, 흔한 문제 해결, 실제 데이터 프로젝트."
  vi: "Hồi quy bội cho kinh tế và kinh doanh: kiểm định giả thuyết, xử lý lỗi thường gặp và dự án dữ liệu thật."
  ms: "Regresi berganda untuk ekonomi dan perniagaan: ujian hipotesis, masalah lazim dan projek data sebenar."
  id: "Regresi berganda untuk ekonomi dan bisnis: uji hipotesis, masalah umum, dan proyek data nyata."
  hi: "अर्थशास्त्र व व्यवसाय के लिए मल्टीपल रिग्रेशन: परिकल्पना परीक्षण, आम समस्याएँ और असली डेटा पर प्रोजेक्ट।"
outcomes:
  - en: "Fit and test regression models on real data"
    zh: "用真实数据拟合并检验回归模型"
    zh-TW: "用真實資料擬合並檢定迴歸模型"
    ja: "実データで回帰モデルを推定・検定する"
    ko: "실제 데이터로 회귀모형 추정·검정하기"
    vi: "Ước lượng và kiểm định hồi quy trên dữ liệu thật"
    ms: "Menganggar dan menguji regresi pada data sebenar"
    id: "Mengestimasi dan menguji regresi pada data nyata"
    hi: "असली डेटा पर रिग्रेशन मॉडल बनाना व जाँचना"
  - en: "Spot and handle broken model assumptions"
    zh: "发现并处理违背模型假设的情况"
    zh-TW: "發現並處理違反模型假設的情況"
    ja: "モデル仮定の違反を見つけて対処する"
    ko: "모형 가정 위반을 찾아 대처하기"
    vi: "Phát hiện và xử lý vi phạm giả định"
    ms: "Mengesan dan menangani andaian model yang dilanggar"
    id: "Mendeteksi dan menangani pelanggaran asumsi"
    hi: "मॉडल की टूटी मान्यताएँ पहचानना और सुधारना"
