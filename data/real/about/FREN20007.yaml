code: FREN20007
year: 2026
learn:
  en: "Exile, immigration and decolonisation in France, and how they shape French identity today."
  zh: "法国的流亡、移民与去殖民化，以及它们如何塑造今天的法国身份。"
  zh-TW: "法國的流亡、移民與去殖民化，以及它們如何塑造今天的法國身分。"
  ja: "フランスにおける亡命・移民・脱植民地化と、それが今のフランスのアイデンティティに与える影響。"
  ko: "프랑스의 망명·이민·탈식민화, 그리고 그것이 오늘날 프랑스 정체성에 미치는 영향."
  vi: "Lưu vong, nhập cư và phi thực dân hóa ở Pháp, và cách chúng định hình bản sắc Pháp hôm nay."
  ms: "Buangan, imigresen dan dekolonisasi di Perancis, dan cara ia membentuk identiti Perancis hari ini."
  id: "Pengasingan, imigrasi dan dekolonisasi di Prancis, dan cara itu membentuk identitas Prancis kini."
  hi: "फ़्रांस में निर्वासन, आप्रवास और उपनिवेशवाद की समाप्ति, और ये आज की फ़्रांसीसी पहचान को कैसे गढ़ते हैं।"
outcomes:
  - en: "Explain France's immigration history and policy"
    zh: "说明法国的移民历史和政策"
    zh-TW: "說明法國的移民歷史和政策"
    ja: "フランスの移民の歴史と政策を説明する"
    ko: "프랑스의 이민 역사와 정책 설명하기"
    vi: "Giải thích lịch sử và chính sách nhập cư của Pháp"
    ms: "Terangkan sejarah dan dasar imigresen Perancis"
    id: "Menjelaskan sejarah dan kebijakan imigrasi Prancis"
    hi: "फ़्रांस का आप्रवास इतिहास और नीति समझाना"
  - en: "Analyse texts and films on migrant life"
    zh: "分析关于移民生活的文本和电影"
    zh-TW: "分析關於移民生活的文本和電影"
    ja: "移民の暮らしを描く文章や映画を分析する"
    ko: "이주민의 삶을 다룬 글과 영화 분석하기"
    vi: "Phân tích văn bản và phim về đời sống người nhập cư"
    ms: "Analisis teks dan filem tentang kehidupan migran"
    id: "Menganalisis teks dan film tentang kehidupan migran"
    hi: "प्रवासी जीवन पर पाठों और फ़िल्मों का विश्लेषण करना"
  - en: "Discuss identity debates in French"
    zh: "用法语讨论身份认同问题"
    zh-TW: "用法語討論身分認同問題"
    ja: "アイデンティティをめぐる議論をフランス語で行う"
    ko: "정체성 논쟁을 프랑스어로 토론하기"
    vi: "Thảo luận tranh luận về bản sắc bằng tiếng Pháp"
    ms: "Bincangkan perdebatan identiti dalam bahasa Perancis"
    id: "Membahas perdebatan identitas dalam bahasa Prancis"
    hi: "पहचान से जुड़ी बहसों पर फ़्रेंच में चर्चा करना"
