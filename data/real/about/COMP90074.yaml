code: COMP90074
year: 2027
learn:
  en: "Common web vulnerabilities and attacks, how to reduce the risk, and the ethics of finding and disclosing them."
  zh: "常见 Web 漏洞与攻击、降低风险的方法，以及发现和披露漏洞的伦理。"
  zh-TW: "常見 Web 漏洞與攻擊、降低風險的方法，以及發現與揭露漏洞的倫理。"
  ja: "よくある Web の脆弱性と攻撃、その対策、発見・公開の倫理。"
  ko: "흔한 웹 취약점과 공격, 위험 완화, 발견·공개의 윤리."
  vi: "Lỗ hổng và tấn công web phổ biến, cách giảm rủi ro, và đạo đức khi công bố."
  ms: "Kelemahan dan serangan web biasa, cara kurangkan risiko, dan etika mendedahkannya."
  id: "Kerentanan dan serangan web umum, cara mengurangi risiko, dan etika pengungkapannya."
  hi: "आम वेब कमज़ोरियाँ और हमले, जोखिम घटाना, और उन्हें खोजने व बताने की नैतिकता।"
outcomes:
  - en: "Explain how common web attacks work"
    zh: "解释常见 Web 攻击的原理"
    zh-TW: "解釋常見 Web 攻擊的原理"
    ja: "よくある Web 攻撃の仕組みを説明する"
    ko: "흔한 웹 공격 원리 설명하기"
    vi: "Giải thích cách các tấn công web phổ biến hoạt động"
    ms: "Terangkan cara serangan web biasa berfungsi"
    id: "Menjelaskan cara kerja serangan web umum"
    hi: "आम वेब हमले कैसे होते हैं, समझाना"
  - en: "Suggest fixes that reduce security risks"
    zh: "提出降低安全风险的修复方案"
    zh-TW: "提出降低安全風險的修補方案"
    ja: "リスクを下げる対策を提案する"
    ko: "보안 위험을 줄이는 수정안 제시하기"
    vi: "Đề xuất cách sửa giảm rủi ro bảo mật"
    ms: "Cadangkan pembaikan untuk kurangkan risiko"
    id: "Mengusulkan perbaikan untuk mengurangi risiko"
    hi: "सुरक्षा जोखिम घटाने वाले सुधार सुझाना"
