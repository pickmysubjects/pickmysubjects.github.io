code: GEOG90020
year: 2027
learn:
  en: "Learning community engagement for disaster risk reduction by doing it: door-knocking field research with the CEDRR method."
  zh: "在实践中学习减灾社区参与：用CEDRR方法挨家挨户开展实地研究。"
  zh-TW: "在實作中學習減災社區參與：用CEDRR方法挨家挨戶進行實地研究。"
  ja: "CEDRR手法で戸別訪問の現地調査を行い、防災のための地域との関わり方を実践で学ぶ。"
  ko: "CEDRR 방법으로 집집마다 방문하는 현장 조사를 하며 재난 위험 감소를 위한 주민 참여를 배웁니다."
  vi: "Học gắn kết cộng đồng giảm rủi ro thiên tai qua thực hành: gõ cửa từng nhà theo phương pháp CEDRR."
  ms: "Belajar penglibatan komuniti untuk kurangkan risiko bencana dengan amalan: kajian lapangan CEDRR."
  id: "Belajar keterlibatan komunitas untuk pengurangan risiko bencana dengan praktik: riset lapangan CEDRR."
  hi: "CEDRR विधि से घर-घर फ़ील्ड शोध करके आपदा जोखिम कम करने हेतु सामुदायिक जुड़ाव सीखना।"
outcomes:
  - en: "Use the CEDRR community engagement method"
    zh: "运用CEDRR社区参与方法"
    zh-TW: "運用CEDRR社區參與方法"
    ja: "CEDRRの地域参加手法を使う"
    ko: "CEDRR 주민 참여 방법 활용하기"
    vi: "Áp dụng phương pháp gắn kết CEDRR"
    ms: "Menggunakan kaedah penglibatan CEDRR"
    id: "Menerapkan metode keterlibatan CEDRR"
    hi: "CEDRR सामुदायिक जुड़ाव विधि का उपयोग"
  - en: "Run self-directed field research on risk"
    zh: "自主开展风险实地研究"
    zh-TW: "自主進行風險實地研究"
    ja: "リスクの現地調査を自ら行う"
    ko: "위험에 관한 현장 조사 스스로 수행하기"
    vi: "Tự thực hiện nghiên cứu thực địa về rủi ro"
    ms: "Menjalankan kajian lapangan risiko sendiri"
    id: "Melakukan riset lapangan risiko secara mandiri"
    hi: "जोखिम पर स्व-निर्देशित फ़ील्ड शोध करना"
