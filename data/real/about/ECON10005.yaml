code: ECON10005
year: 2026
learn:
  en: "Basic statistics for business and economics: describing data, probability, testing ideas and regression."
  zh: "商科和经济用的基础统计：描述数据、概率、假设检验和回归。"
  zh-TW: "商科和經濟用的基礎統計：描述資料、機率、假設檢定和迴歸。"
  ja: "ビジネス・経済のための基礎統計：データの記述、確率、仮説検定、回帰。"
  ko: "경영·경제를 위한 기초 통계: 데이터 기술, 확률, 가설 검정, 회귀."
  vi: "Thống kê cơ bản cho kinh doanh và kinh tế: mô tả dữ liệu, xác suất, kiểm định và hồi quy."
  ms: "Statistik asas untuk perniagaan dan ekonomi: huraian data, kebarangkalian, ujian hipotesis dan regresi."
  id: "Statistika dasar untuk bisnis dan ekonomi: deskripsi data, peluang, uji hipotesis, dan regresi."
  hi: "बिज़नेस और इकोनॉमिक्स के लिए बेसिक स्टैटिस्टिक्स: डेटा का वर्णन, प्रायिकता, परिकल्पना जाँच और रिग्रेशन।"
outcomes:
  - en: "Graph and summarise data in Excel"
    zh: "用Excel画图和总结数据"
    zh-TW: "用Excel畫圖和彙整資料"
    ja: "Excelでデータをグラフ化し要約する"
    ko: "Excel로 데이터 그래프 및 요약"
    vi: "Vẽ biểu đồ và tóm tắt dữ liệu bằng Excel"
    ms: "Graf dan ringkaskan data dalam Excel"
    id: "Membuat grafik dan ringkasan data di Excel"
    hi: "Excel में डेटा का ग्राफ़ और सारांश बनाना"
  - en: "Estimate values and test hypotheses"
    zh: "做估计和假设检验"
    zh-TW: "做估計和假設檢定"
    ja: "値を推定し仮説を検定する"
    ko: "값 추정과 가설 검정"
    vi: "Ước lượng giá trị và kiểm định giả thuyết"
    ms: "Anggar nilai dan uji hipotesis"
    id: "Mengestimasi nilai dan menguji hipotesis"
    hi: "मानों का अनुमान और परिकल्पना जाँच"
  - en: "Run a simple regression"
    zh: "做简单回归分析"
    zh-TW: "做簡單迴歸分析"
    ja: "単回帰分析を行う"
    ko: "단순 회귀분석 수행"
    vi: "Chạy hồi quy đơn giản"
    ms: "Jalankan regresi mudah"
    id: "Menjalankan regresi sederhana"
    hi: "सरल रिग्रेशन चलाना"
