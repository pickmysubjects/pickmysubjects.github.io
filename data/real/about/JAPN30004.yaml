code: JAPN30004
year: 2026
learn:
  en: "Social and political issues in Japanese and Australian media, studied through Japanese sources."
  zh: "通过日语资料研究日本和澳大利亚媒体中的社会与政治议题。"
  zh-TW: "透過日語資料研究日本和澳洲媒體中的社會與政治議題。"
  ja: "日本とオーストラリアのメディアに見る社会・政治問題を日本語の資料で学ぶ。"
  ko: "일본어 자료로 일본과 호주 미디어 속 사회·정치 문제를 공부한다."
  vi: "Các vấn đề xã hội, chính trị trên truyền thông Nhật và Úc, học qua tài liệu tiếng Nhật."
  ms: "Isu sosial dan politik dalam media Jepun dan Australia, dikaji melalui sumber bahasa Jepun."
  id: "Isu sosial dan politik di media Jepang dan Australia, dipelajari lewat sumber berbahasa Jepang."
  hi: "जापानी और ऑस्ट्रेलियाई मीडिया के सामाजिक-राजनीतिक मुद्दे, जापानी स्रोतों से।"
outcomes:
  - en: "Read Japanese news and opinion pieces"
    zh: "阅读日语新闻和评论"
    zh-TW: "閱讀日語新聞和評論"
    ja: "日本語のニュースや論説を読む"
    ko: "일본어 뉴스와 칼럼 읽기"
    vi: "Đọc tin tức và bài bình luận tiếng Nhật"
    ms: "Baca berita dan rencana pendapat Jepun"
    id: "Membaca berita dan opini berbahasa Jepang"
    hi: "जापानी समाचार और राय लेख पढ़ना"
  - en: "Compare media coverage in Japan and Australia"
    zh: "比较日本和澳大利亚的媒体报道"
    zh-TW: "比較日本和澳洲的媒體報導"
    ja: "日本とオーストラリアの報道を比べる"
    ko: "일본과 호주의 보도 비교하기"
    vi: "So sánh cách đưa tin ở Nhật và Úc"
    ms: "Bandingkan liputan media di Jepun dan Australia"
    id: "Membandingkan liputan media di Jepang dan Australia"
    hi: "जापान और ऑस्ट्रेलिया की मीडिया कवरेज की तुलना करना"
  - en: "Write in Japanese about a current issue"
    zh: "用日语就时事问题写作"
    zh-TW: "用日語就時事問題寫作"
    ja: "時事問題について日本語で書く"
    ko: "시사 문제에 대해 일본어로 쓰기"
    vi: "Viết bằng tiếng Nhật về một vấn đề thời sự"
    ms: "Tulis dalam bahasa Jepun tentang isu semasa"
    id: "Menulis dalam bahasa Jepang tentang isu terkini"
    hi: "किसी ताज़ा मुद्दे पर जापानी में लिखना"
