code: EDUC10053
year: 2026
learn:
  en: "Hands-on drama and improv workshops that build confidence, empathy and connection, plus research on famous improvisers."
  zh: "通过戏剧和即兴表演工作坊建立自信与同理心，并研究知名即兴艺术家。"
  zh-TW: "透過戲劇與即興表演工作坊建立自信與同理心，並研究知名即興藝術家。"
  ja: "演劇と即興のワークショップで自信と共感を育て、著名な即興家を調べる。"
  ko: "연극·즉흥 워크숍으로 자신감과 공감을 키우고 유명 즉흥 예술가를 연구."
  vi: "Workshop kịch và ứng tác giúp tự tin, đồng cảm và kết nối, kèm tìm hiểu các nghệ sĩ ứng tác nổi tiếng."
  ms: "Bengkel drama dan improvisasi untuk bina keyakinan dan empati, serta kajian tentang tokoh improvisasi."
  id: "Lokakarya drama dan improvisasi untuk membangun percaya diri dan empati, plus riset tokoh improvisasi."
  hi: "ड्रामा और इम्प्रोव वर्कशॉप से आत्मविश्वास व सहानुभूति, साथ में प्रसिद्ध इम्प्रोवाइज़र्स पर शोध।"
outcomes:
  - en: "Explain how improv builds confidence and belonging"
    zh: "解释即兴表演如何增强自信和归属感"
    zh-TW: "解釋即興表演如何增強自信與歸屬感"
    ja: "即興が自信と帰属感をどう育てるか説明する"
    ko: "즉흥 연기가 자신감과 소속감을 키우는 방식 설명하기"
    vi: "Giải thích ứng tác giúp tự tin và gắn kết thế nào"
    ms: "Terangkan cara improvisasi membina keyakinan dan rasa kekitaan"
    id: "Menjelaskan cara improvisasi membangun percaya diri dan rasa memiliki"
    hi: "समझाना कि इम्प्रोव आत्मविश्वास और अपनापन कैसे बढ़ाता है"
  - en: "Use a range of improvisation skills"
    zh: "运用多种即兴表演技巧"
    zh-TW: "運用多種即興表演技巧"
    ja: "さまざまな即興の技術を使う"
    ko: "다양한 즉흥 기술 활용하기"
    vi: "Sử dụng nhiều kỹ năng ứng tác"
    ms: "Guna pelbagai kemahiran improvisasi"
    id: "Memakai beragam keterampilan improvisasi"
    hi: "तरह-तरह के इम्प्रोवाइज़ेशन कौशल इस्तेमाल करना"
  - en: "Discuss the work of key theatre practitioners"
    zh: "讨论重要戏剧实践者的作品"
    zh-TW: "討論重要戲劇實踐者的作品"
    ja: "主要な演劇実践者の仕事を論じる"
    ko: "주요 연극인의 작업 논의하기"
    vi: "Thảo luận tác phẩm của các nhà sân khấu tiêu biểu"
    ms: "Bincang karya pengamal teater utama"
    id: "Membahas karya praktisi teater penting"
    hi: "प्रमुख रंगमंच कलाकारों के काम पर चर्चा करना"
