code: ZOOL30010
year: 2027
learn:
  en: "How animals' bodies and behaviour let them cope with land, water and extreme habitats, studied through lectures and lab work."
  zh: "动物的生理和行为如何让它们适应陆地、水中和极端环境，配合讲课和实验。"
  zh-TW: "動物的生理和行為如何讓牠們適應陸地、水中和極端環境，搭配講課和實驗。"
  ja: "動物の体の仕組みと行動が陸・水・極端な環境への適応をどう支えるかを、講義と実験で学ぶ。"
  ko: "동물의 생리와 행동이 육지, 물, 극한 환경에 어떻게 적응하게 하는지 강의와 실험으로 배운다."
  vi: "Cơ thể và hành vi giúp động vật thích nghi với môi trường trên cạn, dưới nước và khắc nghiệt ra sao, học qua bài giảng và thí nghiệm."
  ms: "Bagaimana fisiologi dan tingkah laku haiwan membantu mereka menyesuaikan diri di darat, air dan habitat ekstrem, melalui kuliah dan makmal."
  id: "Bagaimana fisiologi dan perilaku hewan membantu mereka beradaptasi di darat, air, dan habitat ekstrem, lewat kuliah dan praktikum."
  hi: "जानवरों का शरीर और व्यवहार उन्हें ज़मीन, पानी और कठोर माहौल में कैसे टिकाए रखता है, लेक्चर और लैब के ज़रिए।"
outcomes:
  - en: "Compare how body systems work across animal groups and settings"
    zh: "比较不同动物和环境中身体系统的运作"
    zh-TW: "比較不同動物和環境中身體系統的運作"
    ja: "動物群や環境ごとに体の仕組みの働きを比べる"
    ko: "동물군과 환경에 따른 신체 기관의 작동 비교하기"
    vi: "So sánh cách các hệ cơ quan hoạt động giữa các nhóm động vật và môi trường"
    ms: "Bandingkan cara sistem badan berfungsi antara kumpulan haiwan dan persekitaran"
    id: "Membandingkan cara kerja sistem tubuh antar kelompok hewan dan lingkungan"
    hi: "अलग-अलग जानवरों और माहौल में शरीर के तंत्रों का काम तुलना करना"
  - en: "Read and judge lab data to back up an argument"
    zh: "分析实验数据来支持论点"
    zh-TW: "分析實驗數據來支持論點"
    ja: "実験データを読み解いて主張の裏付けにする"
    ko: "실험 데이터를 해석해 주장 뒷받침하기"
    vi: "Đọc và đánh giá dữ liệu thí nghiệm để củng cố lập luận"
    ms: "Baca dan nilai data makmal untuk menyokong hujah"
    id: "Membaca dan menilai data praktikum untuk mendukung argumen"
    hi: "लैब डेटा पढ़कर और परखकर तर्क को सहारा देना"
  - en: "Handle animals and record data with animal welfare in mind"
    zh: "在顾及动物福利的前提下操作动物并记录数据"
    zh-TW: "在顧及動物福利的前提下操作動物並記錄數據"
    ja: "動物福祉に配慮しながら動物を扱い記録をとる"
    ko: "동물 복지를 고려하며 동물을 다루고 기록하기"
    vi: "Xử lý động vật và ghi chép dữ liệu có chú ý đến phúc lợi động vật"
    ms: "Kendalikan haiwan dan rekod data dengan menjaga kebajikan haiwan"
    id: "Menangani hewan dan mencatat data dengan memperhatikan kesejahteraan hewan"
    hi: "पशु कल्याण का ध्यान रखते हुए जानवरों को संभालना और डेटा दर्ज करना"
