code: NEUR30005
year: 2026
learn:
  en: "How a sheet of cells in the embryo grows into a working brain with connected neurons."
  zh: "胚胎里的一层细胞怎么长成有神经连接的大脑。"
  zh-TW: "胚胎裡的一層細胞怎麼長成有神經連結的大腦。"
  ja: "胚の細胞のシートが、つながったニューロンを持つ脳へと育つ過程。"
  ko: "배아의 세포 한 층이 뉴런이 연결된 뇌로 자라는 과정."
  vi: "Một lớp tế bào trong phôi phát triển thành bộ não có nơ-ron kết nối ra sao."
  ms: "Cara lapisan sel dalam embrio membesar menjadi otak berfungsi dengan neuron bersambung."
  id: "Cara lapisan sel di embrio tumbuh menjadi otak yang berfungsi dengan neuron terhubung."
  hi: "भ्रूण की कोशिकाओं की एक परत जुड़े न्यूरॉन वाले दिमाग में कैसे बदलती है।"
outcomes:
  - en: "Describe the main steps of nervous system development"
    zh: "描述神经系统发育的主要步骤"
    zh-TW: "描述神經系統發育的主要步驟"
    ja: "神経系の発生の主な段階を説明する"
    ko: "신경계 발달의 주요 단계 설명하기"
    vi: "Mô tả các bước chính trong phát triển hệ thần kinh"
    ms: "Menghuraikan langkah utama perkembangan sistem saraf"
    id: "Menjelaskan tahap utama perkembangan sistem saraf"
    hi: "तंत्रिका तंत्र के विकास के मुख्य चरण बताना"
  - en: "Explain how faulty development causes neural defects"
    zh: "解释发育出错怎么导致神经缺陷"
    zh-TW: "解釋發育出錯怎麼導致神經缺陷"
    ja: "発生の異常が神経の欠陥を生む仕組みを説明する"
    ko: "발달 이상이 신경 결함을 일으키는 방식 설명하기"
    vi: "Giải thích phát triển lỗi gây dị tật thần kinh ra sao"
    ms: "Menerangkan cara perkembangan rosak menyebabkan kecacatan saraf"
    id: "Menjelaskan cara kelainan perkembangan memicu cacat saraf"
    hi: "गलत विकास से तंत्रिका दोष कैसे होते हैं"
  - en: "Judge the strengths and limits of research methods"
    zh: "评价研究方法的优缺点"
    zh-TW: "評價研究方法的優缺點"
    ja: "研究手法の長所と限界を判断する"
    ko: "연구 방법의 장점과 한계 판단하기"
    vi: "Đánh giá ưu điểm và hạn chế của phương pháp nghiên cứu"
    ms: "Menilai kekuatan dan had kaedah penyelidikan"
    id: "Menilai kelebihan dan batasan metode riset"
    hi: "रिसर्च के तरीकों की खूबियाँ और सीमाएँ आँकना"
