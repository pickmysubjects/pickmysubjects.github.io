code: FLTV20020
year: 2026
learn:
  en: "Attend an international film festival, join screenings and talks, then make new screen work and a reflective journal."
  zh: "参加国际电影节，观影听讲座，然后创作新的影像作品并写反思日志。"
  zh-TW: "參加國際影展，觀影聽講座，然後創作新的影像作品並寫反思日誌。"
  ja: "国際映画祭に参加し上映やトークを体験、その後新作映像と振り返り日誌を作る。"
  ko: "국제 영화제에 참가해 상영·토크를 보고 새 영상 작품과 성찰 일지를 만든다."
  vi: "Dự liên hoan phim quốc tế, xem phim, nghe tọa đàm, rồi làm phim mới và nhật ký."
  ms: "Hadiri festival filem antarabangsa, kemudian hasilkan karya skrin dan jurnal."
  id: "Menghadiri festival film internasional, lalu membuat karya layar dan jurnal."
  hi: "अंतरराष्ट्रीय फ़िल्म फ़ेस्टिवल, स्क्रीनिंग और चर्चाएँ, फिर नया स्क्रीन काम और जर्नल।"
outcomes:
  - en: "Engage with films and industry at a festival"
    zh: "在电影节中接触影片与行业"
    zh-TW: "在影展中接觸影片與產業"
    ja: "映画祭で作品と業界に触れる"
    ko: "영화제에서 작품·업계 접하기"
    vi: "Tiếp xúc phim và ngành tại liên hoan"
    ms: "Terlibat dengan filem dan industri"
    id: "Terlibat dengan film dan industri"
    hi: "फ़ेस्टिवल में फ़िल्मों और उद्योग से जुड़ना"
  - en: "Make screen work from an international view"
    zh: "从国际视角创作影像作品"
    zh-TW: "從國際視角創作影像作品"
    ja: "国際的な視点で映像作品を作る"
    ko: "국제적 시각으로 영상 만들기"
    vi: "Làm phim từ góc nhìn quốc tế"
    ms: "Hasilkan karya skrin berperspektif global"
    id: "Membuat karya layar berperspektif global"
    hi: "अंतरराष्ट्रीय नज़र से स्क्रीन काम बनाना"
  - en: "Reflect critically in a journal"
    zh: "在日志中批判性反思"
    zh-TW: "在日誌中批判性反思"
    ja: "日誌で批判的に振り返る"
    ko: "일지에서 비판적으로 성찰하기"
    vi: "Suy ngẫm phản biện trong nhật ký"
    ms: "Renung secara kritis dalam jurnal"
    id: "Merefleksikan secara kritis di jurnal"
    hi: "जर्नल में आलोचनात्मक चिंतन"
