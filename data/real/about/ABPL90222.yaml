code: ABPL90222
year: 2027
learn:
  en: "Designing and making bespoke furniture: materials, body measurements, hand tools, woodworking machines and digital fabrication."
  zh: "设计并制作定制家具：材料、人体尺度、手工工具、木工机械和数字制造。"
  zh-TW: "設計並製作客製家具：材料、人體尺度、手工具、木工機械與數位製造。"
  ja: "オーダー家具の設計と製作：素材、人体寸法、手工具、木工機械、デジタル製作。"
  ko: "맞춤 가구 설계·제작: 재료, 인체 치수, 수공구, 목공 기계, 디지털 제작."
  vi: "Thiết kế và làm đồ nội thất riêng: vật liệu, kích thước cơ thể, dụng cụ, máy mộc, chế tạo số."
  ms: "Mereka dan membuat perabot khas: bahan, antropometri, alat tangan, mesin kayu dan fabrikasi digital."
  id: "Merancang dan membuat furnitur khusus: material, antropometri, alat tangan, mesin kayu dan fabrikasi digital."
  hi: "बेस्पोक फ़र्नीचर डिज़ाइन व निर्माण: सामग्री, शरीर माप, हाथ के औज़ार, लकड़ी मशीनें, डिजिटल फ़ैब्रिकेशन।"
outcomes:
  - en: "Design furniture around materials and the human body"
    zh: "围绕材料和人体尺度设计家具"
    zh-TW: "圍繞材料與人體尺度設計家具"
    ja: "素材と人体寸法から家具を設計する"
    ko: "재료와 인체에 맞춘 가구 설계하기"
    vi: "Thiết kế nội thất theo vật liệu và cơ thể"
    ms: "Mereka perabot mengikut bahan dan tubuh manusia"
    id: "Mendesain furnitur sesuai material dan tubuh"
    hi: "सामग्री और मानव शरीर के अनुसार फ़र्नीचर डिज़ाइन"
  - en: "Make a piece using hand and machine tools"
    zh: "用手工和机械工具做出成品"
    zh-TW: "用手工具與機械做出成品"
    ja: "手工具と機械で作品を作る"
    ko: "수공구와 기계로 작품 만들기"
    vi: "Làm sản phẩm bằng dụng cụ tay và máy"
    ms: "Membuat karya dengan alat tangan dan mesin"
    id: "Membuat karya dengan alat tangan dan mesin"
    hi: "हाथ और मशीन औज़ारों से वस्तु बनाना"
