code: PHYC40012
year: 2026
learn:
  en: "Start an original physics research project with a supervisor, in astrophysics, condensed matter, optics or particle physics."
  zh: "在导师指导下开展原创物理研究，方向含天体物理、凝聚态、光学或粒子物理。"
  zh-TW: "在導師指導下開展原創物理研究，方向含天體物理、凝聚態、光學或粒子物理。"
  ja: "指導教員のもと、天体・物性・光学・素粒子物理のいずれかで独自の研究を始める。"
  ko: "지도교수와 함께 천체·응집물질·광학·입자물리 분야의 독창적 연구 시작하기."
  vi: "Bắt đầu dự án nghiên cứu vật lý độc lập có người hướng dẫn: thiên văn, chất rắn, quang học hoặc hạt."
  ms: "Mulakan projek penyelidikan fizik asli dengan penyelia, dalam astrofizik, jirim terkondensasi, optik atau zarah."
  id: "Memulai riset fisika orisinal dengan pembimbing, di astrofisika, materi terkondensasi, optika, atau partikel."
  hi: "पर्यवेक्षक के साथ खगोलभौतिकी, संघनित पदार्थ, प्रकाशिकी या कण भौतिकी में मौलिक शोध शुरू करना।"
outcomes:
  - en: "Plan a research question and method"
    zh: "规划研究问题和方法"
    zh-TW: "規劃研究問題和方法"
    ja: "研究課題と方法を計画する"
    ko: "연구 질문과 방법 계획하기"
    vi: "Lên câu hỏi và phương pháp nghiên cứu"
    ms: "Rancang soalan dan kaedah kajian"
    id: "Merancang pertanyaan dan metode riset"
    hi: "शोध प्रश्न और विधि की योजना बनाना"
  - en: "Carry out experimental or theoretical work"
    zh: "开展实验或理论研究工作"
    zh-TW: "開展實驗或理論研究工作"
    ja: "実験または理論の研究を進める"
    ko: "실험 또는 이론 연구 수행하기"
    vi: "Thực hiện công việc thực nghiệm hoặc lý thuyết"
    ms: "Jalankan kerja eksperimen atau teori"
    id: "Melakukan kerja eksperimen atau teori"
    hi: "प्रायोगिक या सैद्धांतिक कार्य करना"
  - en: "Report results in a thesis and talk"
    zh: "以论文和报告呈现研究结果"
    zh-TW: "以論文和報告呈現研究結果"
    ja: "成果を論文と発表で報告する"
    ko: "논문과 발표로 결과 보고하기"
    vi: "Trình bày kết quả qua luận văn và bài nói"
    ms: "Laporkan hasil dalam tesis dan pembentangan"
    id: "Melaporkan hasil dalam tesis dan presentasi"
    hi: "नतीजे थीसिस और प्रस्तुति में बताना"
