code: MUSI20245
year: 2026
learn:
  en: "Ensemble playing for experienced percussionists across many styles and instruments, ending in a concert."
  zh: "面向有经验打击乐手的合奏课，涵盖多种风格与乐器，以音乐会收尾。"
  zh-TW: "面向有經驗打擊樂手的合奏課，涵蓋多種風格與樂器，以音樂會收尾。"
  ja: "経験ある打楽器奏者向けの合奏。多様な様式と楽器で演奏会へ向かう。"
  ko: "숙련된 타악기 주자를 위한 합주. 다양한 양식과 악기로 공연까지."
  vi: "Hòa tấu cho người chơi bộ gõ có kinh nghiệm, nhiều phong cách, kết thúc bằng buổi diễn."
  ms: "Ensembel untuk pemain perkusi berpengalaman, pelbagai gaya, berakhir dengan konsert."
  id: "Ansambel bagi perkusionis berpengalaman, beragam gaya, ditutup dengan konser."
  hi: "अनुभवी तालवादकों के लिए समूह वादन, कई शैलियाँ, अंत में कॉन्सर्ट।"
outcomes:
  - en: "Prepare parts for percussion ensemble works"
    zh: "为打击乐合奏作品准备声部"
    zh-TW: "為打擊樂合奏作品準備聲部"
    ja: "打楽器アンサンブルのパートを準備する"
    ko: "타악 합주곡 파트 준비하기"
    vi: "Chuẩn bị bè cho tác phẩm hòa tấu bộ gõ"
    ms: "Sediakan bahagian untuk karya ensembel perkusi"
    id: "Menyiapkan partisi karya ansambel perkusi"
    hi: "ताल समूह रचनाओं के भाग तैयार करना"
  - en: "Play a wide range of percussion instruments"
    zh: "演奏多种打击乐器"
    zh-TW: "演奏多種打擊樂器"
    ja: "さまざまな打楽器を演奏する"
    ko: "다양한 타악기 연주하기"
    vi: "Chơi nhiều loại nhạc cụ gõ"
    ms: "Mainkan pelbagai alat perkusi"
    id: "Memainkan beragam alat perkusi"
    hi: "कई तरह के ताल वाद्य बजाना"
  - en: "Perform new and classic works in concert"
    zh: "在音乐会上演奏新作与经典作品"
    zh-TW: "在音樂會上演奏新作與經典作品"
    ja: "新作と名作を演奏会で披露する"
    ko: "공연에서 신작과 명작 연주하기"
    vi: "Biểu diễn tác phẩm mới và kinh điển"
    ms: "Persembahkan karya baharu dan klasik"
    id: "Membawakan karya baru dan klasik di konser"
    hi: "कॉन्सर्ट में नई और प्रसिद्ध रचनाएँ बजाना"
