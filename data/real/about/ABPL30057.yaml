code: ABPL30057
year: 2026
learn:
  en: "Looks at cities, buildings and landscapes across Asia and Australia: colonial legacies, heritage, tourism and globalisation."
  zh: "考察亚洲与澳洲的城市、建筑与景观：殖民遗产、遗产保护、旅游与全球化。"
  zh-TW: "考察亞洲與澳洲的城市、建築與地景：殖民遺緒、文化資產、觀光與全球化。"
  ja: "アジアとオーストラリアの都市・建築・景観を、植民地の遺産、観光、グローバル化から考える。"
  ko: "아시아·호주의 도시·건축·경관을 식민 유산, 관광, 세계화의 관점에서 살펴본다."
  vi: "Tìm hiểu đô thị, kiến trúc, cảnh quan châu Á và Úc: di sản thuộc địa, du lịch, toàn cầu hóa."
  ms: "Meneliti bandar, bangunan dan landskap Asia dan Australia: warisan kolonial, pelancongan, globalisasi."
  id: "Mengkaji kota, bangunan dan lanskap Asia dan Australia: warisan kolonial, pariwisata, globalisasi."
  hi: "एशिया और ऑस्ट्रेलिया के शहर, इमारतें और भू-दृश्य: औपनिवेशिक विरासत, पर्यटन और वैश्वीकरण।"
outcomes:
  - en: "Compare modern design across Asia Pacific places"
    zh: "比较亚太各地的现代设计"
    zh-TW: "比較亞太各地的現代設計"
    ja: "アジア太平洋各地の近代デザインを比較する"
    ko: "아시아태평양 각지의 근대 디자인 비교하기"
    vi: "So sánh thiết kế hiện đại khắp châu Á–Thái Bình Dương"
    ms: "Banding reka bentuk moden di Asia Pasifik"
    id: "Membandingkan desain modern di Asia Pasifik"
    hi: "एशिया-प्रशांत के आधुनिक डिज़ाइन की तुलना"
  - en: "Link built form to colonial and national history"
    zh: "把建成形态与殖民和国家历史联系起来"
    zh-TW: "把建成形態與殖民和國家歷史連結起來"
    ja: "建築形態を植民地史・国家史と結びつける"
    ko: "건축 형태를 식민·국가 역사와 연결하기"
    vi: "Gắn hình thái xây dựng với lịch sử thuộc địa, quốc gia"
    ms: "Kaitkan bentuk binaan dengan sejarah kolonial"
    id: "Mengaitkan bentuk bangunan dengan sejarah kolonial"
    hi: "निर्मित रूप को औपनिवेशिक व राष्ट्रीय इतिहास से जोड़ना"
  - en: "Study real sites on Melbourne field visits"
    zh: "通过墨尔本实地考察研究真实场所"
    zh-TW: "透過墨爾本實地考察研究真實場所"
    ja: "メルボルンの現地見学で実際の場所を調べる"
    ko: "멜버른 현장 답사로 실제 장소 연구하기"
    vi: "Khảo sát địa điểm thực tế ở Melbourne"
    ms: "Kaji tapak sebenar melalui lawatan di Melbourne"
    id: "Mengkaji lokasi nyata lewat kunjungan di Melbourne"
    hi: "मेलबर्न फ़ील्ड विज़िट में असली जगहों का अध्ययन"
