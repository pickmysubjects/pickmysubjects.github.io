code: DNCE10031
year: 2026
learn:
  en: "Builds on Dance Lab 1 with live musicians in class, more technique and a group-devised dance piece."
  zh: "在舞蹈实验室 1 基础上加入现场伴奏、深化技术并集体编创作品。"
  zh-TW: "在舞蹈實驗室 1 基礎上加入現場伴奏、深化技術並集體編創作品。"
  ja: "ダンスラボ1を発展させ、生演奏の授業で技術を深め、グループで作品を創る。"
  ko: "댄스 랩 1을 이어 라이브 반주 수업으로 테크닉을 넓히고 그룹 작품을 만든다."
  vi: "Nối tiếp Dance Lab 1: nhạc công chơi trực tiếp, nâng kỹ thuật và dàn dựng tác phẩm nhóm."
  ms: "Lanjutan Dance Lab 1 dengan pemuzik secara langsung, teknik lebih mendalam dan karya kumpulan."
  id: "Lanjutan Dance Lab 1 dengan musisi langsung, teknik lebih dalam dan karya kelompok."
  hi: "डांस लैब 1 के आगे: लाइव संगीतकार, गहरी तकनीक और समूह में रचा गया डांस पीस।"
outcomes:
  - en: "Apply technique to set and devised material"
    zh: "将技术用于规定与自编材料"
    zh-TW: "將技術用於規定與自編材料"
    ja: "技術を既定・創作の素材に生かす"
    ko: "테크닉을 정해진 안무와 창작에 적용하기"
    vi: "Áp dụng kỹ thuật cho bài mẫu và bài tự dựng"
    ms: "Gunakan teknik pada bahan tetap dan ciptaan"
    id: "Menerapkan teknik pada materi baku dan ciptaan"
    hi: "तय और स्वयं रचे मटीरियल में तकनीक लगाना"
  - en: "Dance in time with live music"
    zh: "随现场音乐起舞"
    zh-TW: "隨現場音樂起舞"
    ja: "生演奏に合わせて踊る"
    ko: "라이브 음악에 맞춰 춤추기"
    vi: "Múa theo nhạc sống"
    ms: "Menari mengikut muzik secara langsung"
    id: "Menari mengikuti musik langsung"
    hi: "लाइव संगीत के साथ नाचना"
  - en: "Create and perform a dance work in a group"
    zh: "小组编创并演出舞蹈作品"
    zh-TW: "小組編創並演出舞蹈作品"
    ja: "グループで作品を創り上演する"
    ko: "그룹으로 작품을 만들고 공연하기"
    vi: "Cùng nhóm sáng tác và biểu diễn tác phẩm"
    ms: "Cipta dan persembahkan karya tarian berkumpulan"
    id: "Membuat dan mementaskan karya tari kelompok"
    hi: "समूह में डांस रचना और प्रस्तुति"
