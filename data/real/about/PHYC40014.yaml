code: PHYC40014
year: 2026
learn:
  en: "Finish your supervised physics research project and write it up as a thesis with a short talk."
  zh: "完成导师指导的物理研究项目，撰写论文并做简短报告。"
  zh-TW: "完成導師指導的物理研究專案，撰寫論文並做簡短報告。"
  ja: "指導を受けた物理研究を完成させ、論文と短い発表にまとめる。"
  ko: "지도받은 물리 연구 프로젝트를 마치고 논문과 짧은 발표로 정리하기."
  vi: "Hoàn thành dự án nghiên cứu vật lý có hướng dẫn, viết luận văn và trình bày ngắn."
  ms: "Siapkan projek penyelidikan fizik berpenyelia dan tulis sebagai tesis dengan pembentangan ringkas."
  id: "Menuntaskan riset fisika terbimbing dan menuliskannya sebagai tesis dengan presentasi singkat."
  hi: "पर्यवेक्षित भौतिकी शोध परियोजना पूरी करना और थीसिस व छोटी प्रस्तुति लिखना।"
outcomes:
  - en: "Complete and analyse your research results"
    zh: "完成研究并分析结果"
    zh-TW: "完成研究並分析結果"
    ja: "研究を仕上げ結果を分析する"
    ko: "연구를 마치고 결과 분석하기"
    vi: "Hoàn tất và phân tích kết quả nghiên cứu"
    ms: "Lengkapkan dan analisis hasil kajian"
    id: "Menuntaskan dan menganalisis hasil riset"
    hi: "शोध पूरा कर नतीजों का विश्लेषण करना"
  - en: "Write a clear physics thesis"
    zh: "写出清晰的物理学论文"
    zh-TW: "寫出清晰的物理學論文"
    ja: "わかりやすい物理学の論文を書く"
    ko: "명확한 물리학 논문 쓰기"
    vi: "Viết luận văn vật lý rõ ràng"
    ms: "Tulis tesis fizik yang jelas"
    id: "Menulis tesis fisika yang jelas"
    hi: "स्पष्ट भौतिकी थीसिस लिखना"
  - en: "Present and defend your findings"
    zh: "展示并为研究发现答辩"
    zh-TW: "展示並為研究發現答辯"
    ja: "成果を発表し質問に答える"
    ko: "연구 결과 발표하고 질문에 답하기"
    vi: "Trình bày và bảo vệ kết quả"
    ms: "Bentang dan pertahankan dapatan"
    id: "Mempresentasikan dan mempertahankan temuan"
    hi: "अपने निष्कर्ष प्रस्तुत करना और उनका बचाव करना"
