code: ARBC10005
year: 2026
learn:
  en: "Arabic from scratch: its sounds and script, first words and grammar, and everyday social customs in the Arab world."
  zh: "零基础阿拉伯语：发音和字母、入门词汇和语法，以及阿拉伯世界的日常社交习俗。"
  zh-TW: "零基礎阿拉伯語：發音和字母、入門詞彙和文法，以及阿拉伯世界的日常社交習俗。"
  ja: "ゼロから学ぶアラビア語。発音と文字、最初の語彙と文法、アラブ世界の日常の習慣。"
  ko: "처음 배우는 아랍어. 발음과 문자, 기초 어휘와 문법, 아랍 세계의 일상 관습."
  vi: "Tiếng Ả Rập từ đầu: âm và chữ viết, từ vựng và ngữ pháp đầu tiên, cùng phong tục hằng ngày ở thế giới Ả Rập."
  ms: "Bahasa Arab dari asas: bunyi dan tulisan, kosa kata serta tatabahasa awal, dan adat harian dunia Arab."
  id: "Bahasa Arab dari nol: bunyi dan aksara, kosakata serta tata bahasa awal, dan kebiasaan sehari-hari dunia Arab."
  hi: "शून्य से अरबी: ध्वनियाँ और लिपि, पहले शब्द और व्याकरण, और अरब दुनिया के रोज़मर्रा के रिवाज।"
outcomes:
  - en: "Hold simple everyday conversations in Arabic"
    zh: "用阿拉伯语进行简单的日常对话"
    zh-TW: "用阿拉伯語進行簡單的日常對話"
    ja: "アラビア語で簡単な日常会話をする"
    ko: "아랍어로 간단한 일상 대화하기"
    vi: "Trò chuyện đơn giản hằng ngày bằng tiếng Ả Rập"
    ms: "Berbual ringkas harian dalam bahasa Arab"
    id: "Bercakap sederhana sehari-hari dalam bahasa Arab"
    hi: "अरबी में सरल रोज़मर्रा की बातचीत करना"
  - en: "Read and write basic Arabic words and sentences"
    zh: "读写基础阿拉伯语词句"
    zh-TW: "讀寫基礎阿拉伯語詞句"
    ja: "アラビア語の基本的な語や文を読み書きする"
    ko: "기초 아랍어 단어와 문장 읽고 쓰기"
    vi: "Đọc và viết từ, câu tiếng Ả Rập cơ bản"
    ms: "Baca dan tulis perkataan serta ayat asas bahasa Arab"
    id: "Membaca dan menulis kata serta kalimat dasar bahasa Arab"
    hi: "अरबी के बुनियादी शब्द और वाक्य पढ़ना-लिखना"
  - en: "Understand everyday customs where Arabic is spoken"
    zh: "了解使用阿拉伯语地区的日常习俗"
    zh-TW: "了解使用阿拉伯語地區的日常習俗"
    ja: "アラビア語が話される地域の日常の習慣を知る"
    ko: "아랍어 사용 지역의 일상 관습 이해하기"
    vi: "Hiểu phong tục hằng ngày nơi nói tiếng Ả Rập"
    ms: "Fahami adat harian di tempat bahasa Arab dituturkan"
    id: "Memahami kebiasaan sehari-hari di tempat bahasa Arab dipakai"
    hi: "अरबी बोलने वाली जगहों के रोज़मर्रा के रीति-रिवाज समझना"
