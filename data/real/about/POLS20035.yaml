code: POLS20035
year: 2026
learn:
  en: "Indigenous politics in Australia compared with other settler societies, from dispossession and exclusion to land rights and recognition."
  zh: "把澳大利亚原住民政治与其他移民殖民社会比较，从土地被剥夺和被排斥，到土地权和承认。"
  zh-TW: "把澳洲原住民政治與其他移墾殖民社會比較，從土地被剝奪和被排斥，到土地權和承認。"
  ja: "オーストラリアの先住民政治を他の入植者社会と比べ、土地の剥奪と排除から土地権と承認までを学ぶ。"
  ko: "호주 원주민 정치를 다른 정착민 사회와 비교하며, 토지 박탈과 배제에서 토지권과 인정까지 다룬다."
  vi: "Chính trị bản địa ở Úc so với các xã hội định cư khác, từ bị tước đoạt và loại trừ đến quyền đất đai và sự công nhận."
  ms: "Politik Orang Asli di Australia berbanding masyarakat peneroka lain, dari perampasan dan penyisihan hingga hak tanah dan pengiktirafan."
  id: "Politik Pribumi di Australia dibandingkan dengan masyarakat pemukim lain, dari perampasan dan pengucilan hingga hak tanah dan pengakuan."
  hi: "ऑस्ट्रेलिया की आदिवासी राजनीति की दूसरे बसावट वाले समाजों से तुलना, ज़मीन छिनने और बहिष्कार से भूमि अधिकार और मान्यता तक।"
outcomes:
  - en: "Explain the history of Indigenous dispossession"
    zh: "解释原住民土地被剥夺的历史"
    zh-TW: "解釋原住民土地被剝奪的歷史"
    ja: "先住民が土地を奪われた歴史を説明する"
    ko: "원주민 토지 박탈의 역사 설명하기"
    vi: "Giải thích lịch sử người bản địa bị tước đoạt đất đai"
    ms: "Terangkan sejarah perampasan tanah Orang Asli"
    id: "Menjelaskan sejarah perampasan tanah masyarakat Pribumi"
    hi: "आदिवासियों की ज़मीन छिनने का इतिहास समझाना"
  - en: "Assess land rights and recognition policies"
    zh: "评估土地权和承认相关政策"
    zh-TW: "評估土地權和承認相關政策"
    ja: "土地権と承認に関する政策を評価する"
    ko: "토지권과 인정 정책 평가하기"
    vi: "Đánh giá các chính sách về quyền đất đai và sự công nhận"
    ms: "Nilai dasar hak tanah dan pengiktirafan"
    id: "Menilai kebijakan hak tanah dan pengakuan"
    hi: "भूमि अधिकार और मान्यता से जुड़ी नीतियों का आकलन करना"
  - en: "Compare Australia with other settler societies"
    zh: "把澳大利亚和其他移民殖民社会作比较"
    zh-TW: "把澳洲和其他移墾殖民社會作比較"
    ja: "オーストラリアを他の入植者社会と比較する"
    ko: "호주를 다른 정착민 사회와 비교하기"
    vi: "So sánh Úc với các xã hội định cư khác"
    ms: "Bandingkan Australia dengan masyarakat peneroka lain"
    id: "Membandingkan Australia dengan masyarakat pemukim lain"
    hi: "ऑस्ट्रेलिया की तुलना दूसरे बसावट वाले समाजों से करना"
