code: EDUC20064
year: 2026
learn:
  en: "How ideas of childhood have changed over history, from Locke and Piaget to children's rights, and what shapes childhood today."
  zh: "童年观念如何随历史变化，从洛克、皮亚杰到儿童权利，以及今天的童年。"
  zh-TW: "童年觀念如何隨歷史變化，從洛克、皮亞傑到兒童權利，以及今天的童年。"
  ja: "ロックやピアジェから子どもの権利まで、子ども観の歴史的な変化と現代の子ども時代。"
  ko: "로크와 피아제에서 아동 권리까지, 아동기 개념의 역사적 변화와 오늘날의 아동기."
  vi: "Quan niệm về tuổi thơ thay đổi qua lịch sử ra sao, từ Locke, Piaget đến quyền trẻ em, và tuổi thơ ngày nay."
  ms: "Bagaimana idea zaman kanak-kanak berubah, dari Locke dan Piaget hingga hak kanak-kanak, dan zaman kanak-kanak kini."
  id: "Bagaimana gagasan masa kanak-kanak berubah, dari Locke dan Piaget hingga hak anak, dan masa kanak-kanak kini."
  hi: "इतिहास में बचपन की धारणा कैसे बदली, लॉक और पियाजे से बाल अधिकारों तक, और आज का बचपन।"
outcomes:
  - en: "Describe past and present theories of childhood"
    zh: "描述过去和现在关于童年的理论"
    zh-TW: "描述過去和現在關於童年的理論"
    ja: "過去と現在の子ども観の理論を説明する"
    ko: "과거와 현재의 아동기 이론 설명하기"
    vi: "Mô tả các lý thuyết về tuổi thơ xưa và nay"
    ms: "Menghuraikan teori zaman kanak-kanak dahulu dan kini"
    id: "Menjelaskan teori masa kanak-kanak dulu dan kini"
    hi: "बचपन के पुराने और वर्तमान सिद्धांत बताना"
  - en: "Analyse how institutions shape modern childhoods"
    zh: "分析各种机构如何塑造现代童年"
    zh-TW: "分析各種機構如何形塑現代童年"
    ja: "制度が現代の子ども時代をどう形づくるか分析する"
    ko: "제도가 현대 아동기를 만드는 방식 분석하기"
    vi: "Phân tích cách các thiết chế định hình tuổi thơ hiện đại"
    ms: "Menganalisis cara institusi membentuk zaman kanak-kanak moden"
    id: "Menganalisis cara lembaga membentuk masa kanak-kanak modern"
    hi: "संस्थाएँ आधुनिक बचपन को कैसे आकार देती हैं, विश्लेषण करना"
  - en: "Weigh evidence behind claims about childhood"
    zh: "评估关于童年说法背后的证据"
    zh-TW: "評估關於童年說法背後的證據"
    ja: "子ども時代に関する主張の根拠を評価する"
    ko: "아동기에 관한 주장의 근거 평가하기"
    vi: "Đánh giá bằng chứng đằng sau các nhận định về tuổi thơ"
    ms: "Menilai bukti di sebalik dakwaan tentang zaman kanak-kanak"
    id: "Menimbang bukti di balik klaim tentang masa kanak-kanak"
    hi: "बचपन से जुड़े दावों के पीछे के सबूत परखना"
