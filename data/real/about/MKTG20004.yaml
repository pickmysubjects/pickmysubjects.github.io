code: MKTG20004
year: 2026
learn:
  en: "How to plan and run market research, from defining the problem to analysing data and using the results."
  zh: "如何规划和执行市场调研，从定义问题到分析数据和运用结果。"
  zh-TW: "如何規劃和執行市場調查，從界定問題到分析資料和運用結果。"
  ja: "市場調査の計画と実施：問題の設定からデータ分析、結果の活用まで。"
  ko: "시장조사 계획과 실행: 문제 정의부터 데이터 분석, 결과 활용까지."
  vi: "Cách lên kế hoạch và thực hiện nghiên cứu thị trường, từ xác định vấn đề đến phân tích dữ liệu và dùng kết quả."
  ms: "Cara rancang dan jalankan kajian pasaran, daripada takrif masalah hingga analisis data dan guna hasilnya."
  id: "Cara merencanakan dan menjalankan riset pasar, dari merumuskan masalah sampai analisis data dan memakai hasilnya."
  hi: "मार्केट रिसर्च कैसे प्लान करें और चलाएँ, समस्या तय करने से लेकर डेटा विश्लेषण और नतीजे इस्तेमाल करने तक।"
outcomes:
  - en: "Design a research project and collect the data"
    zh: "设计调研项目并收集数据"
    zh-TW: "設計調查專案並蒐集資料"
    ja: "調査を設計しデータを集める"
    ko: "조사 프로젝트를 설계하고 데이터 수집"
    vi: "Thiết kế dự án nghiên cứu và thu thập dữ liệu"
    ms: "Reka projek kajian dan kumpul data"
    id: "Merancang proyek riset dan mengumpulkan data"
    hi: "रिसर्च प्रोजेक्ट डिज़ाइन करना और डेटा जुटाना"
  - en: "Analyse data, including with multiple regression"
    zh: "分析数据，包括多元回归"
    zh-TW: "分析資料，包括多元迴歸"
    ja: "重回帰を含めてデータを分析する"
    ko: "다중회귀를 포함한 데이터 분석"
    vi: "Phân tích dữ liệu, kể cả hồi quy bội"
    ms: "Analisis data, termasuk regresi berganda"
    id: "Menganalisis data, termasuk regresi berganda"
    hi: "मल्टीपल रिग्रेशन सहित डेटा का विश्लेषण"
  - en: "Turn research findings into business decisions"
    zh: "把调研结果转化为商业决策"
    zh-TW: "把調查結果轉化為商業決策"
    ja: "調査結果を経営判断に生かす"
    ko: "조사 결과를 경영 결정으로 연결"
    vi: "Biến kết quả nghiên cứu thành quyết định kinh doanh"
    ms: "Jadikan dapatan kajian keputusan perniagaan"
    id: "Mengubah temuan riset jadi keputusan bisnis"
    hi: "रिसर्च के नतीजों को बिज़नेस फ़ैसलों में बदलना"
