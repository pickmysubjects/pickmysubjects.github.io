code: GEOM90038
year: 2027
learn:
  en: "Advanced imaging tools and how to pull measurements, including 3D shape, from images from several sources."
  zh: "先进成像技术，以及如何从多源影像中提取测量数据和三维信息。"
  zh-TW: "先進影像技術，以及如何從多源影像中擷取量測資料與三維資訊。"
  ja: "高度な画像計測技術と、複数の画像から3D形状などの数値を取り出す方法。"
  ko: "첨단 영상 기술과 여러 출처의 영상에서 3D 형상 등 측정값을 얻는 방법."
  vi: "Công nghệ chụp ảnh tiên tiến và cách trích xuất số đo, kể cả hình dạng 3D, từ ảnh nhiều nguồn."
  ms: "Teknologi pengimejan maju dan cara mendapatkan ukuran, termasuk bentuk 3D, daripada imej pelbagai sumber."
  id: "Teknologi pencitraan lanjut dan cara mengambil ukuran, termasuk bentuk 3D, dari citra multisumber."
  hi: "उन्नत इमेजिंग तकनीक और कई स्रोतों की तस्वीरों से 3D आकार समेत माप निकालना।"
outcomes:
  - en: "Build 3D models from multiple images"
    zh: "用多张影像构建三维模型"
    zh-TW: "用多張影像建立三維模型"
    ja: "複数の画像から3Dモデルを作る"
    ko: "여러 영상으로 3D 모델 만들기"
    vi: "Dựng mô hình 3D từ nhiều ảnh"
    ms: "Membina model 3D daripada beberapa imej"
    id: "Membangun model 3D dari beberapa citra"
    hi: "कई तस्वीरों से 3D मॉडल बनाना"
  - en: "Understand imaging where the sensor supplies its own light"
    zh: "理解主动光源成像的原理"
    zh-TW: "理解主動光源成像的原理"
    ja: "センサー自身が光を出す画像計測を理解する"
    ko: "센서가 직접 빛을 내는 영상 방식 이해하기"
    vi: "Hiểu kiểu chụp ảnh mà cảm biến tự phát sáng"
    ms: "Memahami pengimejan yang sensornya membekalkan cahaya sendiri"
    id: "Memahami pencitraan dengan sensor yang memancarkan cahaya sendiri"
    hi: "ऐसी इमेजिंग समझना जिसमें सेंसर खुद रोशनी देता है"
