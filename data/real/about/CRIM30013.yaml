code: CRIM30013
year: 2026
learn:
  en: "How gender shapes offending, victimisation and the way the criminal justice system works."
  zh: "性别如何影响犯罪、受害以及刑事司法系统的运作。"
  zh-TW: "性別如何影響犯罪、受害以及刑事司法體系的運作。"
  ja: "ジェンダーが犯罪、被害、刑事司法制度の働きにどう影響するかを学ぶ。"
  ko: "젠더가 범죄, 피해, 형사 사법 제도의 작동에 어떤 영향을 주는지 배운다."
  vi: "Giới tính định hình hành vi phạm tội, việc trở thành nạn nhân và cách hệ thống tư pháp hình sự vận hành ra sao."
  ms: "Cara gender membentuk kesalahan jenayah, pengalaman mangsa dan cara sistem keadilan jenayah berfungsi."
  id: "Cara gender membentuk pelanggaran, viktimisasi, dan cara kerja sistem peradilan pidana."
  hi: "जेंडर अपराध करने, पीड़ित होने और आपराधिक न्याय व्यवस्था के काम करने के तरीके को कैसे आकार देता है।"
outcomes:
  - en: "Describe key frameworks for understanding gender"
    zh: "描述理解性别的主要理论框架"
    zh-TW: "描述理解性別的主要理論架構"
    ja: "ジェンダーを理解する主な枠組みを説明する"
    ko: "젠더를 이해하는 주요 틀 설명하기"
    vi: "Mô tả các khung lý thuyết chính để hiểu về giới"
    ms: "Huraikan kerangka utama untuk memahami gender"
    id: "Menguraikan kerangka utama untuk memahami gender"
    hi: "जेंडर समझने के मुख्य ढाँचों का वर्णन करना"
  - en: "Explain why gender matters in criminology"
    zh: "说明性别在犯罪学中为何重要"
    zh-TW: "說明性別在犯罪學中為何重要"
    ja: "犯罪学でジェンダーが重要な理由を説明する"
    ko: "범죄학에서 젠더가 중요한 이유 설명하기"
    vi: "Giải thích vì sao giới quan trọng trong tội phạm học"
    ms: "Terangkan mengapa gender penting dalam kriminologi"
    id: "Menjelaskan mengapa gender penting dalam kriminologi"
    hi: "समझाना कि क्रिमिनोलॉजी में जेंडर क्यों मायने रखता है"
  - en: "Critique research and justice practice on gender"
    zh: "评析与性别有关的研究和司法实践"
    zh-TW: "評析與性別有關的研究和司法實務"
    ja: "ジェンダーに関する研究と司法実務を批判的に見る"
    ko: "젠더 관련 연구와 사법 실무 비판적으로 평가하기"
    vi: "Phê bình nghiên cứu và thực tiễn tư pháp liên quan đến giới"
    ms: "Kritik kajian dan amalan keadilan berkaitan gender"
    id: "Mengkritisi riset dan praktik peradilan terkait gender"
    hi: "जेंडर से जुड़े शोध और न्याय व्यवहार की आलोचनात्मक समीक्षा करना"
