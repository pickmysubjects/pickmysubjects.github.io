code: MAST90081
year: 2027
learn:
  en: "Measure-theoretic probability: measurable spaces, product measure, conditional expectation and martingales."
  zh: "测度论概率：可测空间、乘积测度、条件期望与鞅。"
  zh-TW: "測度論機率：可測空間、乘積測度、條件期望值與鞅。"
  ja: "測度論的確率論：可測空間、直積測度、条件付き期待値、マルチンゲール。"
  ko: "측도론적 확률: 가측공간, 곱측도, 조건부 기댓값, 마팅게일."
  vi: "Xác suất theo lý thuyết độ đo: không gian đo được, độ đo tích, kỳ vọng có điều kiện, martingale."
  ms: "Kebarangkalian teori ukuran: ruang boleh ukur, ukuran hasil darab, jangkaan bersyarat, martingale."
  id: "Probabilitas teori ukuran: ruang terukur, ukuran produk, ekspektasi bersyarat, martingale."
  hi: "माप-सिद्धांत आधारित प्रायिकता: मापनीय स्पेस, प्रोडक्ट माप, सशर्त अपेक्षा, मार्टिंगेल।"
outcomes:
  - en: "Use measure theory to reason about probability"
    zh: "用测度论推理概率问题"
    zh-TW: "用測度論推理機率問題"
    ja: "測度論で確率を論じる"
    ko: "측도론으로 확률 추론하기"
    vi: "Dùng lý thuyết độ đo để lập luận xác suất"
    ms: "Menggunakan teori ukuran untuk menaakul kebarangkalian"
    id: "Memakai teori ukuran untuk menalar probabilitas"
    hi: "माप सिद्धांत से प्रायिकता पर तर्क करना"
  - en: "Write rigorous proofs in probability"
    zh: "写出严谨的概率证明"
    zh-TW: "寫出嚴謹的機率證明"
    ja: "確率論の厳密な証明を書く"
    ko: "확률론의 엄밀한 증명 쓰기"
    vi: "Viết chứng minh chặt chẽ về xác suất"
    ms: "Menulis bukti ketat dalam kebarangkalian"
    id: "Menulis bukti probabilitas yang ketat"
    hi: "प्रायिकता में सख़्त प्रमाण लिखना"
