code: ASIA20004
year: 2026
learn:
  en: "Visual and performing arts across Asia as entertainment, ritual, business and politics, and how they build or break identities."
  zh: "亚洲各地的视觉与表演艺术：作为娱乐、仪式、商品和政治行为，以及它们如何建立或打破身份认同。"
  zh-TW: "亞洲各地的視覺與表演藝術：作為娛樂、儀式、商品和政治行為，以及它們如何建立或打破身分認同。"
  ja: "アジア各地の視覚芸術と舞台芸術。娯楽、儀礼、商品、政治行為としての役割と、アイデンティティとの関わり。"
  ko: "아시아 곳곳의 시각·공연 예술. 오락, 의례, 상품, 정치 행위로서의 역할과 정체성을 만들고 허무는 방식."
  vi: "Nghệ thuật thị giác và biểu diễn khắp châu Á như giải trí, nghi lễ, hàng hóa và chính trị, cùng vai trò với bản sắc."
  ms: "Seni visual dan persembahan di seluruh Asia sebagai hiburan, ritual, komoditi dan politik, serta kaitannya dengan identiti."
  id: "Seni rupa dan pertunjukan di seluruh Asia sebagai hiburan, ritual, komoditas dan politik, serta kaitannya dengan identitas."
  hi: "एशिया भर की दृश्य और प्रदर्शन कलाएँ मनोरंजन, अनुष्ठान, व्यापार और राजनीति के रूप में, और पहचान से उनका रिश्ता।"
outcomes:
  - en: "Analyse arts as social and political acts"
    zh: "把艺术当作社会和政治行为来分析"
    zh-TW: "把藝術當作社會和政治行為來分析"
    ja: "芸術を社会的・政治的な行為として分析する"
    ko: "예술을 사회적·정치적 행위로 분석하기"
    vi: "Phân tích nghệ thuật như hành động xã hội, chính trị"
    ms: "Analisis seni sebagai tindakan sosial dan politik"
    id: "Menganalisis seni sebagai tindakan sosial dan politik"
    hi: "कला का सामाजिक और राजनीतिक कर्म के रूप में विश्लेषण करना"
  - en: "Compare traditional and contemporary Asian arts"
    zh: "比较亚洲的传统与当代艺术"
    zh-TW: "比較亞洲的傳統與當代藝術"
    ja: "アジアの伝統芸術と現代芸術を比べる"
    ko: "아시아의 전통 예술과 현대 예술 비교하기"
    vi: "So sánh nghệ thuật truyền thống và đương đại châu Á"
    ms: "Bandingkan seni tradisional dan kontemporari Asia"
    id: "Membandingkan seni tradisional dan kontemporer Asia"
    hi: "पारंपरिक और समकालीन एशियाई कलाओं की तुलना करना"
  - en: "Research an arts network or hub"
    zh: "研究一个艺术网络或中心"
    zh-TW: "研究一個藝術網絡或中心"
    ja: "芸術のネットワークや拠点を調べる"
    ko: "예술 네트워크나 거점 조사하기"
    vi: "Nghiên cứu một mạng lưới hoặc trung tâm nghệ thuật"
    ms: "Kaji satu rangkaian atau hab seni"
    id: "Meneliti satu jaringan atau pusat seni"
    hi: "किसी कला नेटवर्क या केंद्र पर शोध करना"
