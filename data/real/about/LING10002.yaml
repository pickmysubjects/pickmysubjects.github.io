code: LING10002
year: 2026
learn:
  en: "How people communicate across languages and cultures, and what that means for living in a diverse society."
  zh: "人们如何跨越语言和文化沟通，以及这对生活在多元社会里意味着什么。"
  zh-TW: "人們如何跨越語言和文化溝通，以及這對生活在多元社會裡意味著什麼。"
  ja: "言語や文化の違いを越えて人がどう伝え合うのか、それが多様な社会で暮らすうえで何を意味するのかを学ぶ。"
  ko: "사람들이 언어와 문화를 넘어 어떻게 소통하는지, 그리고 다양한 사회에서 산다는 것이 무엇을 뜻하는지 배운다."
  vi: "Con người giao tiếp thế nào qua ranh giới ngôn ngữ và văn hóa, và điều đó có ý nghĩa gì khi sống trong xã hội đa dạng."
  ms: "Bagaimana orang berkomunikasi merentas bahasa dan budaya, dan maksudnya bagi hidup dalam masyarakat pelbagai."
  id: "Bagaimana orang berkomunikasi lintas bahasa dan budaya, dan artinya bagi hidup di masyarakat yang beragam."
  hi: "लोग भाषाओं और संस्कृतियों के पार कैसे बात करते हैं, और विविध समाज में रहने के लिए इसका क्या मतलब है।"
outcomes:
  - en: "Explain the main ideas in intercultural communication"
    zh: "说明跨文化交际的主要观点"
    zh-TW: "說明跨文化溝通的主要觀點"
    ja: "異文化コミュニケーションの主な考え方を説明する"
    ko: "상호문화 소통의 주요 개념 설명하기"
    vi: "Giải thích các ý chính về giao tiếp liên văn hóa"
    ms: "Terangkan idea utama komunikasi antara budaya"
    id: "Menjelaskan gagasan utama komunikasi antarbudaya"
    hi: "अंतर-सांस्कृतिक संवाद के मुख्य विचार समझाना"
  - en: "Analyse real conversations across cultures"
    zh: "分析真实的跨文化对话"
    zh-TW: "分析真實的跨文化對話"
    ja: "文化をまたぐ実際の会話を分析する"
    ko: "실제 문화 간 대화 분석하기"
    vi: "Phân tích các cuộc trò chuyện liên văn hóa thực tế"
    ms: "Analisis perbualan sebenar merentas budaya"
    id: "Menganalisis percakapan nyata lintas budaya"
    hi: "संस्कृतियों के बीच असली बातचीत का विश्लेषण करना"
  - en: "Join debates on diversity, respect and inclusion"
    zh: "参与关于多元、尊重和包容的讨论"
    zh-TW: "參與關於多元、尊重和包容的討論"
    ja: "多様性・尊重・包摂をめぐる議論に参加する"
    ko: "다양성, 존중, 포용에 관한 토론에 참여하기"
    vi: "Tham gia tranh luận về đa dạng, tôn trọng và hòa nhập"
    ms: "Sertai perbahasan tentang kepelbagaian, hormat dan keterangkuman"
    id: "Ikut berdebat soal keberagaman, rasa hormat, dan inklusi"
    hi: "विविधता, सम्मान और समावेश पर बहस में हिस्सा लेना"
