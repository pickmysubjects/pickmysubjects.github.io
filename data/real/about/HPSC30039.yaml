code: HPSC30039
year: 2026
learn:
  en: "How to spot \"bad science\", from misleading graphs to biased algorithms, and why it matters for democracy."
  zh: "如何识别\"坏科学\"，从误导性图表到带偏见的算法，以及这为何关乎民主。"
  zh-TW: "如何識別「壞科學」，從誤導性圖表到帶偏見的演算法，以及這為何關乎民主。"
  ja: "誤解を招くグラフから偏ったアルゴリズムまで「悪い科学」を見抜く方法と、それが民主主義に大切な理由。"
  ko: "오해를 부르는 그래프부터 편향된 알고리즘까지 '나쁜 과학'을 가려내는 법과 그것이 민주주의에 중요한 이유."
  vi: "Cách nhận ra \"khoa học tồi\", từ biểu đồ gây hiểu lầm đến thuật toán thiên lệch, và vì sao điều này quan trọng với dân chủ."
  ms: "Cara mengesan \"sains buruk\", daripada graf mengelirukan hingga algoritma berat sebelah, dan mengapa ia penting untuk demokrasi."
  id: "Cara mengenali \"sains buruk\", dari grafik menyesatkan sampai algoritma bias, dan mengapa hal ini penting bagi demokrasi."
  hi: "\"खराब विज्ञान\" को कैसे पहचानें, भ्रामक ग्राफ़ से पक्षपाती एल्गोरिदम तक, और यह लोकतंत्र के लिए क्यों अहम है।"
outcomes:
  - en: "Spot misleading data and graphs"
    zh: "识别误导性的数据和图表"
    zh-TW: "識別誤導性的資料和圖表"
    ja: "誤解を招くデータやグラフを見抜く"
    ko: "오해를 부르는 데이터와 그래프 가려내기"
    vi: "Nhận ra dữ liệu và biểu đồ gây hiểu lầm"
    ms: "Kesan data dan graf yang mengelirukan"
    id: "Mengenali data dan grafik yang menyesatkan"
    hi: "भ्रामक डेटा और ग्राफ़ पहचानना"
  - en: "Explain how bias can enter algorithms"
    zh: "说明偏见如何进入算法"
    zh-TW: "說明偏見如何進入演算法"
    ja: "偏りがアルゴリズムに入り込む仕組みを説明する"
    ko: "편향이 알고리즘에 들어가는 방식 설명하기"
    vi: "Giải thích thiên lệch có thể lọt vào thuật toán ra sao"
    ms: "Terangkan cara bias boleh masuk ke algoritma"
    id: "Menjelaskan cara bias bisa masuk ke algoritma"
    hi: "पक्षपात एल्गोरिदम में कैसे घुसता है, समझाना"
  - en: "Assess scientific claims in public debate"
    zh: "评估公共讨论中的科学主张"
    zh-TW: "評估公共討論中的科學主張"
    ja: "公の議論での科学的主張を評価する"
    ko: "공적 논쟁 속 과학적 주장 평가하기"
    vi: "Đánh giá các tuyên bố khoa học trong tranh luận công khai"
    ms: "Nilai dakwaan saintifik dalam perdebatan awam"
    id: "Menilai klaim ilmiah dalam perdebatan publik"
    hi: "सार्वजनिक बहस में वैज्ञानिक दावों को परखना"
