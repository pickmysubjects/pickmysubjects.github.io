code: MKTG20007
year: 2026
learn:
  en: "Turning new ideas into products: finding market needs, pricing, and developing and launching new offerings."
  zh: "把新点子变成产品：发现市场需求、定价、开发并推出新产品。"
  zh-TW: "把新點子變成產品：發掘市場需求、定價、開發並推出新產品。"
  ja: "アイデアを製品に：市場ニーズの発見、価格設定、新商品の開発と投入。"
  ko: "새 아이디어를 제품으로: 시장 수요 찾기, 가격 책정, 신제품 개발과 출시."
  vi: "Biến ý tưởng mới thành sản phẩm: tìm nhu cầu thị trường, định giá, phát triển và ra mắt sản phẩm mới."
  ms: "Menjadikan idea baharu produk: cari keperluan pasaran, harga, serta bangun dan lancar tawaran baharu."
  id: "Mengubah ide baru jadi produk: menemukan kebutuhan pasar, menetapkan harga, serta mengembangkan dan meluncurkannya."
  hi: "नए आइडिया को प्रोडक्ट बनाना: बाज़ार की ज़रूरत खोजना, क़ीमत तय करना, नया प्रोडक्ट बनाना और लॉन्च करना।"
outcomes:
  - en: "Explain why entrepreneurship and innovation create value"
    zh: "解释创业和创新为何能创造价值"
    zh-TW: "說明創業和創新為何能創造價值"
    ja: "起業とイノベーションが価値を生む理由を説明する"
    ko: "창업과 혁신이 가치를 만드는 이유 설명"
    vi: "Giải thích vì sao khởi nghiệp và đổi mới tạo giá trị"
    ms: "Terangkan mengapa keusahawanan dan inovasi cipta nilai"
    id: "Menjelaskan mengapa kewirausahaan dan inovasi menciptakan nilai"
    hi: "उद्यमिता और नवाचार मूल्य कैसे बनाते हैं, समझाना"
  - en: "Write a marketing plan for a new venture"
    zh: "为新创业项目写营销计划"
    zh-TW: "為新創事業撰寫行銷企劃"
    ja: "新規事業のマーケティング計画を作る"
    ko: "신규 사업의 마케팅 계획 작성"
    vi: "Lập kế hoạch marketing cho dự án kinh doanh mới"
    ms: "Tulis pelan pemasaran untuk usaha baharu"
    id: "Menyusun rencana pemasaran untuk usaha baru"
    hi: "नए उद्यम के लिए मार्केटिंग योजना बनाना"
  - en: "Evaluate market entry and new product development"
    zh: "评估市场进入和新产品开发"
    zh-TW: "評估市場進入和新產品開發"
    ja: "市場参入と新商品開発を評価する"
    ko: "시장 진입과 신제품 개발 평가"
    vi: "Đánh giá việc gia nhập thị trường và phát triển sản phẩm"
    ms: "Nilai kemasukan pasaran dan pembangunan produk baharu"
    id: "Menilai masuk pasar dan pengembangan produk baru"
    hi: "बाज़ार में प्रवेश और नए प्रोडक्ट विकास का आकलन"
