code: ABPL90438
year: 2027
learn:
  en: "A studio on organising space for a complex program in a medium to large building, meeting building code needs."
  zh: "设计课：为中大型建筑的复杂功能组织空间，并满足建筑规范要求。"
  zh-TW: "設計課：為中大型建築的複雜機能組織空間，並符合建築規範要求。"
  ja: "中・大規模建築の複雑なプログラムを空間に構成するスタジオ。建築基準も満たす。"
  ko: "중대형 건물의 복잡한 프로그램을 공간으로 구성하는 스튜디오, 건축 기준 충족."
  vi: "Studio tổ chức không gian cho công năng phức tạp của công trình vừa và lớn, đáp ứng quy chuẩn xây dựng."
  ms: "Studio menyusun ruang untuk program kompleks bangunan sederhana hingga besar, memenuhi kod bangunan."
  id: "Studio menata ruang untuk program kompleks bangunan menengah hingga besar, sesuai kode bangunan."
  hi: "मध्यम से बड़े भवन के जटिल प्रोग्राम के लिए स्थान व्यवस्था का स्टूडियो, भवन संहिता के अनुसार।"
outcomes:
  - en: "Explore spatial options in plan, section and models"
    zh: "用平面、剖面和模型推敲空间方案"
    zh-TW: "用平面、剖面和模型推敲空間方案"
    ja: "平面・断面・模型で空間案を検討する"
    ko: "평면, 단면, 모형으로 공간 대안 탐구하기"
    vi: "Khám phá phương án không gian qua mặt bằng, mặt cắt, mô hình"
    ms: "Meneroka pilihan ruang melalui pelan, keratan dan model"
    id: "Menjelajahi opsi ruang lewat denah, potongan, dan maket"
    hi: "प्लान, सेक्शन और मॉडल से स्थानिक विकल्प खोजना"
  - en: "Design a complex building for function and access"
    zh: "设计兼顾功能与无障碍的复杂建筑"
    zh-TW: "設計兼顧機能與無障礙的複雜建築"
    ja: "機能とアクセスを満たす複雑な建物を設計する"
    ko: "기능과 접근성을 갖춘 복합 건물 설계하기"
    vi: "Thiết kế công trình phức tạp đáp ứng công năng và tiếp cận"
    ms: "Mereka bangunan kompleks untuk fungsi dan akses"
    id: "Mendesain bangunan kompleks untuk fungsi dan aksesibilitas"
    hi: "कार्य और पहुँच के लिए जटिल भवन का डिज़ाइन"
