code: FLTV30027
year: 2026
learn:
  en: "The capstone: make your 5 to 10-minute graduate film through pre-production, shoot and post, and crew on others'."
  zh: "毕业项目：完成5到10分钟毕业短片的前期、拍摄与后期，并为同学剧组工作。"
  zh-TW: "畢業專案：完成 5 到 10 分鐘畢業短片的前期、拍攝與後期，並為同學劇組工作。"
  ja: "卒業制作：5〜10分の卒業映画を準備・撮影・仕上げまで行い、他作品のスタッフも務める。"
  ko: "캡스톤: 5~10분 졸업 영화를 프리·촬영·후반까지 만들고 다른 작품 스태프도 한다."
  vi: "Đồ án cuối: làm phim tốt nghiệp 5–10 phút từ tiền kỳ đến hậu kỳ, làm đoàn cho bạn."
  ms: "Projek akhir: hasilkan filem graduan 5–10 minit dan jadi kru untuk filem lain."
  id: "Proyek akhir: buat film kelulusan 5–10 menit dari praproduksi hingga pascaproduksi."
  hi: "कैपस्टोन: 5–10 मिनट की ग्रेजुएट फ़िल्म बनाना और दूसरों की फ़िल्मों में क्रू बनना।"
outcomes:
  - en: "Prepare production paperwork to industry rules"
    zh: "按行业规范准备制片文件"
    zh-TW: "按業界規範準備製片文件"
    ja: "業界ルールに沿った制作書類を整える"
    ko: "업계 규정에 맞게 제작 서류 준비하기"
    vi: "Chuẩn bị giấy tờ sản xuất đúng chuẩn ngành"
    ms: "Sedia dokumen produksi ikut amalan industri"
    id: "Menyiapkan dokumen produksi sesuai standar"
    hi: "इंडस्ट्री नियमों से प्रोडक्शन कागज़ात तैयार करना"
  - en: "Finish a 5 to 10-minute graduate film"
    zh: "完成5到10分钟的毕业短片"
    zh-TW: "完成 5 到 10 分鐘的畢業短片"
    ja: "5〜10分の卒業映画を完成させる"
    ko: "5~10분 졸업 영화 완성하기"
    vi: "Hoàn thành phim tốt nghiệp 5–10 phút"
    ms: "Siapkan filem graduan 5 hingga 10 minit"
    id: "Menyelesaikan film kelulusan 5–10 menit"
    hi: "5 से 10 मिनट की ग्रेजुएट फ़िल्म पूरी करना"
  - en: "Crew on other students' films"
    zh: "在其他同学的剧组担任职位"
    zh-TW: "在其他同學的劇組擔任職位"
    ja: "他の学生の作品でスタッフを務める"
    ko: "다른 학생 영화 스태프로 일하기"
    vi: "Làm thành viên đoàn phim của bạn khác"
    ms: "Jadi kru filem pelajar lain"
    id: "Menjadi kru film mahasiswa lain"
    hi: "दूसरे छात्रों की फ़िल्मों में क्रू बनना"
