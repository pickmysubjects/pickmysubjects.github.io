code: MUSI30290
year: 2026
learn:
  en: "English and German diction for singers: IPA transcription and clear, natural sung pronunciation."
  zh: "英语和德语歌唱语音：国际音标转写和自然清晰的演唱发音。"
  zh-TW: "英語和德語歌唱語音：國際音標轉寫與自然清晰的演唱發音。"
  ja: "歌手のための英語・ドイツ語ディクション：IPA表記と自然な発音。"
  ko: "가수를 위한 영어·독일어 딕션: IPA 표기와 자연스러운 발음."
  vi: "Phát âm tiếng Anh và Đức khi hát: phiên âm IPA và phát âm rõ, tự nhiên."
  ms: "Diksi Inggeris dan Jerman untuk penyanyi: transkripsi IPA dan sebutan jelas."
  id: "Diksi Inggris dan Jerman untuk penyanyi: transkripsi IPA dan lafal jelas."
  hi: "गायकों के लिए अंग्रेज़ी और जर्मन उच्चारण: IPA लिप्यंतरण और साफ़ गायन।"
outcomes:
  - en: "Transcribe song texts into IPA"
    zh: "把歌词转写为国际音标"
    zh-TW: "把歌詞轉寫為國際音標"
    ja: "歌詞をIPAで書き表す"
    ko: "가사를 IPA로 옮겨 적기"
    vi: "Phiên âm lời bài hát sang IPA"
    ms: "Transkripsi lirik ke IPA"
    id: "Mentranskripsi lirik ke IPA"
    hi: "गीत के बोल IPA में लिखना"
  - en: "Sing English and German with clear diction"
    zh: "用清晰发音演唱英语和德语"
    zh-TW: "用清晰發音演唱英語和德語"
    ja: "英語とドイツ語を明瞭に歌う"
    ko: "영어·독일어를 또렷하게 노래하기"
    vi: "Hát tiếng Anh và Đức phát âm rõ"
    ms: "Nyanyi Inggeris dan Jerman dengan jelas"
    id: "Bernyanyi Inggris dan Jerman dengan jelas"
    hi: "अंग्रेज़ी और जर्मन साफ़ उच्चारण से गाना"
  - en: "Hear the gap between spoken and sung words"
    zh: "辨别说话与歌唱发音的差异"
    zh-TW: "辨別說話與歌唱發音的差異"
    ja: "話す発音と歌う発音の違いを聞き分ける"
    ko: "말소리와 노래 발음 차이 구별하기"
    vi: "Phân biệt phát âm nói và hát"
    ms: "Kenal beza sebutan cakap dan nyanyi"
    id: "Membedakan lafal bicara dan nyanyi"
    hi: "बोलने और गाने के उच्चारण का अंतर पहचानना"
