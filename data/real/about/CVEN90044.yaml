code: CVEN90044
year: 2027
learn:
  en: "How to investigate a site before building: geology, soil, groundwater, natural hazards and surveying."
  zh: "建设前如何调查场地：地质、土壤、地下水、自然灾害和测量。"
  zh-TW: "興建前如何調查基地：地質、土壤、地下水、天然災害與測量。"
  ja: "建設前の敷地調査の方法：地質・土・地下水・自然災害・測量。"
  ko: "건설 전 부지를 조사하는 방법: 지질, 토양, 지하수, 자연재해, 측량."
  vi: "Cách khảo sát hiện trường trước khi xây dựng: địa chất, đất, nước ngầm, thiên tai và trắc địa."
  ms: "Cara menyiasat tapak sebelum membina: geologi, tanah, air bawah tanah, bencana alam dan ukur."
  id: "Cara menyelidiki lokasi sebelum membangun: geologi, tanah, air tanah, bencana alam dan survei."
  hi: "निर्माण से पहले साइट की जाँच कैसे करें: भूविज्ञान, मिट्टी, भूजल, प्राकृतिक आपदाएँ और सर्वेक्षण।"
outcomes:
  - en: "Carry out a simple topographic survey"
    zh: "完成简单的地形测量"
    zh-TW: "完成簡單的地形測量"
    ja: "簡単な地形測量を行う"
    ko: "간단한 지형 측량 수행하기"
    vi: "Thực hiện khảo sát địa hình đơn giản"
    ms: "Menjalankan ukur topografi mudah"
    id: "Melakukan survei topografi sederhana"
    hi: "सरल स्थलाकृतिक सर्वेक्षण करना"
  - en: "Choose the right tools for a site investigation"
    zh: "为场地勘察选择合适的技术手段"
    zh-TW: "為基地調查選擇合適的技術工具"
    ja: "敷地調査に適した手法を選ぶ"
    ko: "현장 조사에 맞는 도구 고르기"
    vi: "Chọn công cụ phù hợp cho khảo sát hiện trường"
    ms: "Memilih alat yang sesuai untuk penyiasatan tapak"
    id: "Memilih alat yang tepat untuk penyelidikan lokasi"
    hi: "साइट जाँच के लिए सही उपकरण चुनना"
  - en: "Assess natural hazard risks and report on a site"
    zh: "评估自然灾害风险并撰写场地报告"
    zh-TW: "評估天然災害風險並撰寫基地報告"
    ja: "自然災害リスクを評価し敷地の報告書を書く"
    ko: "자연재해 위험 평가 및 부지 보고서 작성하기"
    vi: "Đánh giá rủi ro thiên tai và viết báo cáo hiện trường"
    ms: "Menilai risiko bencana alam dan melapor tentang tapak"
    id: "Menilai risiko bencana alam dan menulis laporan lokasi"
    hi: "प्राकृतिक आपदा जोखिम आँकना और साइट रिपोर्ट लिखना"
