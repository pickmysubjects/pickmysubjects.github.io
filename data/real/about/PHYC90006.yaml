code: PHYC90006
year: 2027
learn:
  en: "Modern optics from Fourier optics and lasers to nonlinear and quantum optics, solved with analysis and MATLAB."
  zh: "从傅里叶光学、激光到非线性光学和量子光学，用解析和 MATLAB 求解问题。"
  zh-TW: "從傅立葉光學、雷射到非線性光學與量子光學，以解析與 MATLAB 解題。"
  ja: "フーリエ光学・レーザーから非線形光学・量子光学まで、解析とMATLABで解く。"
  ko: "푸리에 광학·레이저부터 비선형·양자 광학까지, 해석과 MATLAB으로 풀기."
  vi: "Quang học hiện đại từ quang Fourier, laser đến quang phi tuyến, lượng tử, giải bằng giải tích và MATLAB."
  ms: "Optik moden daripada optik Fourier dan laser hingga optik tak linear dan kuantum, diselesaikan secara analitik dan MATLAB."
  id: "Optika modern dari optika Fourier dan laser hingga optika nonlinier dan kuantum, diselesaikan secara analitik dan MATLAB."
  hi: "फ़ूरिये प्रकाशिकी व लेज़र से नॉन-लीनियर और क्वांटम प्रकाशिकी तक, विश्लेषण व MATLAB से हल।"
outcomes:
  - en: "Solve diffraction problems with Fourier optics"
    zh: "用傅里叶光学求解衍射问题"
    zh-TW: "用傅立葉光學求解繞射問題"
    ja: "フーリエ光学で回折の問題を解く"
    ko: "푸리에 광학으로 회절 문제 풀기"
    vi: "Giải bài toán nhiễu xạ bằng quang học Fourier"
    ms: "Menyelesaikan masalah pembelauan dengan optik Fourier"
    id: "Menyelesaikan soal difraksi dengan optika Fourier"
    hi: "फ़ूरिये प्रकाशिकी से विवर्तन समस्याएँ हल करना"
  - en: "Explain light-atom interactions and quantum states of light"
    zh: "解释光与原子的相互作用和光的量子态"
    zh-TW: "解釋光與原子的交互作用與光的量子態"
    ja: "光と原子の相互作用、光の量子状態を説明する"
    ko: "빛-원자 상호작용과 빛의 양자 상태 설명하기"
    vi: "Giải thích tương tác ánh sáng - nguyên tử và trạng thái lượng tử của ánh sáng"
    ms: "Menerangkan interaksi cahaya-atom dan keadaan kuantum cahaya"
    id: "Menjelaskan interaksi cahaya-atom dan keadaan kuantum cahaya"
    hi: "प्रकाश-परमाणु अंतःक्रिया और प्रकाश की क्वांटम अवस्थाएँ समझाना"
