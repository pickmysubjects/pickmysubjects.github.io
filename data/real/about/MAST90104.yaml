code: MAST90104
year: 2027
learn:
  en: "Linear models for prediction and testing, then classification, the EM algorithm, Bayesian and Monte Carlo methods."
  zh: "用于预测和检验的线性模型，以及分类、EM算法、贝叶斯与蒙特卡罗方法。"
  zh-TW: "用於預測與檢定的線性模型，以及分類、EM演算法、貝氏與蒙地卡羅方法。"
  ja: "予測と検定のための線形モデル、分類、EMアルゴリズム、ベイズ法、モンテカルロ法。"
  ko: "예측·검정용 선형모형, 분류, EM 알고리즘, 베이즈·몬테카를로 방법."
  vi: "Mô hình tuyến tính cho dự đoán và kiểm định, phân loại, thuật toán EM, Bayes, Monte Carlo."
  ms: "Model linear untuk ramalan dan ujian, klasifikasi, algoritma EM, kaedah Bayes dan Monte Carlo."
  id: "Model linear untuk prediksi dan uji, klasifikasi, algoritma EM, metode Bayes dan Monte Carlo."
  hi: "प्रेडिक्शन और टेस्टिंग के लिए लीनियर मॉडल, क्लासिफ़िकेशन, EM एल्गोरिदम, बेज़ और मोंटे कार्लो।"
outcomes:
  - en: "Fit, test and check linear models"
    zh: "拟合、检验和诊断线性模型"
    zh-TW: "配適、檢定與診斷線性模型"
    ja: "線形モデルを当てはめ、検定・診断する"
    ko: "선형모형 적합·검정·진단하기"
    vi: "Khớp, kiểm định và kiểm tra mô hình tuyến tính"
    ms: "Memadankan, menguji dan menyemak model linear"
    id: "Mencocokkan, menguji, dan memeriksa model linear"
    hi: "लीनियर मॉडल फ़िट, टेस्ट और जाँचना"
  - en: "Use classification and computational methods on data"
    zh: "在数据上使用分类和计算方法"
    zh-TW: "在資料上使用分類與計算方法"
    ja: "データに分類や計算手法を使う"
    ko: "데이터에 분류와 계산 기법 적용하기"
    vi: "Dùng phân loại và phương pháp tính toán trên dữ liệu"
    ms: "Menggunakan klasifikasi dan kaedah pengiraan pada data"
    id: "Memakai klasifikasi dan metode komputasi pada data"
    hi: "डेटा पर क्लासिफ़िकेशन और कम्प्यूटेशनल तरीके लगाना"
