code: COMP90014
year: 2027
learn:
  en: "Algorithms and data structures for handling large DNA, RNA and protein datasets in bioinformatics."
  zh: "处理大规模 DNA、RNA 与蛋白质数据的生物信息学算法和数据结构。"
  zh-TW: "處理大規模 DNA、RNA 與蛋白質資料的生物資訊學演算法與資料結構。"
  ja: "大規模な DNA・RNA・タンパク質データを扱うバイオインフォマティクスのアルゴリズムとデータ構造。"
  ko: "대규모 DNA·RNA·단백질 데이터를 다루는 생물정보학 알고리즘과 자료구조."
  vi: "Thuật toán và cấu trúc dữ liệu xử lý dữ liệu DNA, RNA, protein lớn trong tin sinh học."
  ms: "Algoritma dan struktur data untuk data DNA, RNA dan protein berskala besar dalam bioinformatik."
  id: "Algoritma dan struktur data untuk data DNA, RNA, dan protein skala besar di bioinformatika."
  hi: "बायोइन्फॉर्मेटिक्स में बड़े DNA, RNA और प्रोटीन डेटा के लिए एल्गोरिद्म और डेटा स्ट्रक्चर।"
outcomes:
  - en: "Choose suitable algorithms for large biological datasets"
    zh: "为大规模生物数据选择合适算法"
    zh-TW: "為大規模生物資料選擇合適演算法"
    ja: "大規模生物データに合うアルゴリズムを選ぶ"
    ko: "대규모 생물 데이터에 맞는 알고리즘 선택하기"
    vi: "Chọn thuật toán phù hợp cho dữ liệu sinh học lớn"
    ms: "Pilih algoritma sesuai untuk data biologi besar"
    id: "Memilih algoritma yang tepat untuk data biologi besar"
    hi: "बड़े जैविक डेटा के लिए सही एल्गोरिद्म चुनना"
  - en: "Implement and use common bioinformatics data structures"
    zh: "实现并使用常见生物信息学数据结构"
    zh-TW: "實作並使用常見生物資訊學資料結構"
    ja: "主要なデータ構造を実装して使う"
    ko: "주요 생물정보학 자료구조 구현·활용하기"
    vi: "Cài đặt và dùng các cấu trúc dữ liệu tin sinh học phổ biến"
    ms: "Laksana dan guna struktur data bioinformatik biasa"
    id: "Mengimplementasikan struktur data bioinformatika umum"
    hi: "आम बायोइन्फॉर्मेटिक्स डेटा स्ट्रक्चर बनाना और इस्तेमाल करना"
