code: MUSI30300
year: 2027
learn:
  en: "How to build a music career in arts organisations or on your own: strategy, governance, funding, programming and audiences."
  zh: "如何在艺术机构或独立创业中发展音乐事业：战略、治理、资金、节目策划和观众。"
  zh-TW: "如何在藝術機構或獨立創業中發展音樂事業：策略、治理、資金、節目規劃和觀眾。"
  ja: "芸術団体や独立した形で音楽のキャリアを築く方法：戦略、ガバナンス、資金、企画、観客。"
  ko: "예술 단체나 독립적으로 음악 커리어를 쌓는 법: 전략, 거버넌스, 자금, 프로그램 기획, 관객."
  vi: "Cách xây dựng sự nghiệp âm nhạc trong tổ chức nghệ thuật hoặc tự kinh doanh: chiến lược, quản trị, tài trợ, chương trình và khán giả."
  ms: "Cara membina kerjaya muzik dalam organisasi seni atau sendiri: strategi, tadbir urus, dana, pengaturcaraan dan penonton."
  id: "Cara membangun karier musik di organisasi seni atau mandiri: strategi, tata kelola, pendanaan, program, dan penonton."
  hi: "कला संगठनों में या स्वतंत्र रूप से संगीत करियर बनाना: रणनीति, गवर्नेंस, फ़ंडिंग, प्रोग्रामिंग और दर्शक।"
outcomes:
  - en: "Set out your goals and strengths for a music career"
    zh: "明确自己在音乐事业上的目标和能力"
    zh-TW: "釐清自己在音樂職涯上的目標和能力"
    ja: "音楽キャリアの目標と強みを整理する"
    ko: "음악 커리어 목표와 역량 정리하기"
    vi: "Xác định mục tiêu và năng lực cho sự nghiệp âm nhạc"
    ms: "Nyatakan matlamat dan kekuatan untuk kerjaya muzik"
    id: "Merumuskan tujuan dan kemampuan untuk karier musik"
    hi: "संगीत करियर के लक्ष्य व क्षमताएँ स्पष्ट करना"
  - en: "Develop strategies for a lasting music career"
    zh: "制定可持续的音乐事业策略"
    zh-TW: "制定可持續的音樂職涯策略"
    ja: "続けられる音楽キャリアの戦略を立てる"
    ko: "지속 가능한 음악 커리어 전략 세우기"
    vi: "Xây dựng chiến lược cho sự nghiệp âm nhạc lâu dài"
    ms: "Bangunkan strategi kerjaya muzik yang berkekalan"
    id: "Menyusun strategi karier musik jangka panjang"
    hi: "टिकाऊ संगीत करियर की रणनीति बनाना"
  - en: "Assess challenges facing music organisations"
    zh: "评估音乐机构面临的问题和挑战"
    zh-TW: "評估音樂機構面臨的問題和挑戰"
    ja: "音楽団体が直面する課題を評価する"
    ko: "음악 단체가 직면한 과제 평가하기"
    vi: "Đánh giá thách thức mà tổ chức âm nhạc gặp phải"
    ms: "Nilai cabaran yang dihadapi organisasi muzik"
    id: "Menilai tantangan yang dihadapi organisasi musik"
    hi: "संगीत संगठनों की चुनौतियों का आकलन करना"
