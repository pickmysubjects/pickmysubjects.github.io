code: EDUC20071
year: 2027
learn:
  en: "For exchange students: reflecting online with peers on your study-abroad experience and how you learn across cultures."
  zh: "面向交换生：与同学在线交流反思留学经历和跨文化学习。"
  zh-TW: "給交換生：與同學線上交流反思留學經驗和跨文化學習。"
  ja: "交換留学生向け：留学経験と異文化での学びを仲間とオンラインで振り返る。"
  ko: "교환학생 대상: 동료들과 온라인으로 유학 경험과 문화 간 학습을 성찰한다."
  vi: "Dành cho sinh viên trao đổi: cùng bạn học suy ngẫm trực tuyến về trải nghiệm du học và việc học giữa các nền văn hóa."
  ms: "Untuk pelajar pertukaran: bersama rakan merenung secara dalam talian tentang pengalaman belajar di luar negara dan pembelajaran merentas budaya."
  id: "Untuk mahasiswa pertukaran: merefleksikan pengalaman studi di luar negeri dan belajar lintas budaya secara daring bersama teman."
  hi: "एक्सचेंज छात्रों के लिए: साथियों के साथ ऑनलाइन विदेश में पढ़ाई के अनुभव और अलग-अलग संस्कृतियों में सीखने पर विचार करना।"
outcomes:
  - en: "Understand culture shock and intercultural effectiveness"
    zh: "理解文化冲击和跨文化适应"
    zh-TW: "理解文化衝擊和跨文化適應"
    ja: "カルチャーショックと異文化対応力を理解する"
    ko: "문화 충격과 문화 간 역량 이해하기"
    vi: "Hiểu sốc văn hóa và hiệu quả giao tiếp liên văn hóa"
    ms: "Fahami kejutan budaya dan keberkesanan antara budaya"
    id: "Memahami gegar budaya dan efektivitas antarbudaya"
    hi: "कल्चर शॉक और अंतर-सांस्कृतिक प्रभावशीलता समझना"
  - en: "Improve your intercultural communication skills"
    zh: "提高跨文化沟通能力"
    zh-TW: "提升跨文化溝通能力"
    ja: "異文化コミュニケーション力を高める"
    ko: "문화 간 의사소통 능력 키우기"
    vi: "Nâng cao kỹ năng giao tiếp liên văn hóa"
    ms: "Tingkatkan kemahiran komunikasi antara budaya"
    id: "Meningkatkan keterampilan komunikasi antarbudaya"
    hi: "अंतर-सांस्कृतिक संवाद कौशल सुधारना"
  - en: "Discuss cultural views on your own field of study"
    zh: "探讨不同文化对自己专业的看法"
    zh-TW: "探討不同文化對自己專業的看法"
    ja: "自分の専攻に対する文化ごとの見方を論じる"
    ko: "자기 전공에 대한 문화별 관점 논의하기"
    vi: "Thảo luận góc nhìn văn hóa về ngành học của mình"
    ms: "Bincang pandangan budaya tentang bidang pengajian sendiri"
    id: "Membahas pandangan budaya tentang bidang studi sendiri"
    hi: "अपने विषय पर अलग-अलग सांस्कृतिक नज़रियों पर चर्चा करना"
