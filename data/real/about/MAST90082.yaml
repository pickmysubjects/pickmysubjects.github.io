code: MAST90082
year: 2027
learn:
  en: "The theory of statistical inference: estimators, data reduction, hypothesis tests and confidence intervals."
  zh: "统计推断理论：估计量、数据约简、假设检验与置信区间。"
  zh-TW: "統計推論理論：估計量、資料縮減、假設檢定與信賴區間。"
  ja: "統計的推論の理論：推定量、データ縮約、仮説検定、信頼区間。"
  ko: "통계적 추론 이론: 추정량, 자료 축약, 가설검정, 신뢰구간."
  vi: "Lý thuyết suy luận thống kê: ước lượng, rút gọn dữ liệu, kiểm định, khoảng tin cậy."
  ms: "Teori inferens statistik: penganggar, pengurangan data, ujian hipotesis, selang keyakinan."
  id: "Teori inferensi statistik: estimator, reduksi data, uji hipotesis, selang kepercayaan."
  hi: "सांख्यिकीय अनुमान का सिद्धांत: एस्टिमेटर, डेटा रिडक्शन, परिकल्पना परीक्षण, विश्वास अंतराल।"
outcomes:
  - en: "Derive and compare estimators for statistical models"
    zh: "推导并比较统计模型的估计量"
    zh-TW: "推導並比較統計模型的估計量"
    ja: "統計モデルの推定量を導き比較する"
    ko: "통계 모델의 추정량 유도·비교하기"
    vi: "Suy ra và so sánh các ước lượng"
    ms: "Menerbitkan dan membanding penganggar model statistik"
    id: "Menurunkan dan membandingkan estimator"
    hi: "सांख्यिकीय मॉडल के एस्टिमेटर निकालना और तुलना करना"
  - en: "Build hypothesis tests and interval estimates"
    zh: "构建假设检验和区间估计"
    zh-TW: "建立假設檢定與區間估計"
    ja: "仮説検定と区間推定を作る"
    ko: "가설검정과 구간추정 만들기"
    vi: "Xây dựng kiểm định và ước lượng khoảng"
    ms: "Membina ujian hipotesis dan anggaran selang"
    id: "Menyusun uji hipotesis dan estimasi interval"
    hi: "परिकल्पना परीक्षण और अंतराल अनुमान बनाना"
