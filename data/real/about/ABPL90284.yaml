code: ABPL90284
year: 2027
learn:
  en: "An introduction to architectural design through three short projects, each with a different design method."
  zh: "通过三个短项目入门建筑设计，每个项目用不同的设计方法。"
  zh-TW: "透過三個短專案入門建築設計，每個專案用不同的設計方法。"
  ja: "3つの短い課題で建築設計を学ぶ入門。課題ごとに異なる設計手法を使う。"
  ko: "세 개의 짧은 과제로 배우는 건축 설계 입문, 과제마다 다른 설계 방법 사용."
  vi: "Nhập môn thiết kế kiến trúc qua ba dự án ngắn, mỗi dự án một phương pháp thiết kế."
  ms: "Pengenalan reka bentuk seni bina melalui tiga projek pendek, setiap satu dengan kaedah berbeza."
  id: "Pengantar desain arsitektur lewat tiga proyek singkat, masing-masing dengan metode desain berbeda."
  hi: "तीन छोटे प्रोजेक्ट के ज़रिए वास्तुकला डिज़ाइन का परिचय, हर एक में अलग डिज़ाइन पद्धति।"
outcomes:
  - en: "Design small buildings and spaces"
    zh: "设计小型建筑和空间"
    zh-TW: "設計小型建築和空間"
    ja: "小さな建物や空間を設計する"
    ko: "소규모 건물과 공간 설계하기"
    vi: "Thiết kế công trình và không gian nhỏ"
    ms: "Mereka bentuk bangunan dan ruang kecil"
    id: "Mendesain bangunan dan ruang kecil"
    hi: "छोटे भवनों और स्थानों का डिज़ाइन"
  - en: "Present your designs clearly and professionally"
    zh: "清晰专业地展示设计"
    zh-TW: "清晰專業地展示設計"
    ja: "設計を明快かつプロらしく発表する"
    ko: "설계를 명확하고 전문적으로 발표하기"
    vi: "Trình bày thiết kế rõ ràng, chuyên nghiệp"
    ms: "Membentangkan reka bentuk dengan jelas dan profesional"
    id: "Mempresentasikan desain secara jelas dan profesional"
    hi: "अपने डिज़ाइन स्पष्ट और पेशेवर ढंग से प्रस्तुत करना"
