code: ISYS20006
year: 2026
learn:
  en: "How big business software like ERP and CRM is chosen, rolled out and made worth it, with hands-on SAP work."
  zh: "ERP、CRM 等大型企业软件如何选型、上线并发挥价值，含 SAP 实操。"
  zh-TW: "ERP、CRM 等大型企業軟體如何選型、導入並發揮價值，含 SAP 實作。"
  ja: "ERPやCRMなど業務パッケージの選定・導入・活用を、SAP実習を交えて学ぶ。"
  ko: "ERP·CRM 같은 기업용 패키지 선정, 도입, 효과 내기를 SAP 실습과 함께."
  vi: "Phần mềm doanh nghiệp như ERP, CRM được chọn, triển khai, tạo giá trị ra sao; có thực hành SAP."
  ms: "Cara perisian perusahaan seperti ERP dan CRM dipilih, dilaksana dan dimanfaatkan, dengan SAP."
  id: "Cara software perusahaan seperti ERP dan CRM dipilih, diterapkan, dan dimanfaatkan, praktik SAP."
  hi: "ERP और CRM जैसे बड़े बिज़नेस सॉफ़्टवेयर कैसे चुने, लागू और फ़ायदेमंद बनें, SAP के साथ।"
outcomes:
  - en: "Explain what ERP, CRM and similar systems are"
    zh: "说明 ERP、CRM 等系统是什么"
    zh-TW: "說明 ERP、CRM 等系統是什麼"
    ja: "ERPやCRMなどのシステムを説明する"
    ko: "ERP·CRM 등 시스템이 무엇인지 설명하기"
    vi: "Giải thích ERP, CRM và hệ thống tương tự"
    ms: "Jelaskan apa itu ERP, CRM dan sistem serupa"
    id: "Menjelaskan apa itu ERP, CRM, dan sejenisnya"
    hi: "ERP, CRM जैसे सिस्टम क्या हैं, समझाना"
  - en: "Plan how such software is put in place"
    zh: "规划这类软件如何落地实施"
    zh-TW: "規劃這類軟體如何導入實施"
    ja: "こうしたソフトの導入を計画する"
    ko: "이런 소프트웨어 도입 계획 세우기"
    vi: "Lập kế hoạch triển khai phần mềm này"
    ms: "Rancang cara perisian ini dilaksanakan"
    id: "Merencanakan penerapan software ini"
    hi: "ऐसे सॉफ़्टवेयर को लागू करने की योजना बनाना"
  - en: "Judge how firms get value from the investment"
    zh: "判断企业如何从投入中获益"
    zh-TW: "判斷企業如何從投資中獲益"
    ja: "企業が投資から価値を得る方法を考える"
    ko: "기업이 투자에서 가치를 얻는 방법 판단하기"
    vi: "Đánh giá cách doanh nghiệp thu lợi từ đầu tư"
    ms: "Nilai cara syarikat dapat manfaat pelaburan"
    id: "Menilai cara perusahaan meraih nilai investasi"
    hi: "कंपनियाँ निवेश से फ़ायदा कैसे लें, आँकना"
