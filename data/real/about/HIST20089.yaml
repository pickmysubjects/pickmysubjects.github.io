code: HIST20089
year: 2026
learn:
  en: "How the British Empire recovered and grew from about 1763 to 1900, seen from both the colonisers and the colonised."
  zh: "约1763至1900年间大英帝国如何复苏和扩张，从殖民者和被殖民者两方看。"
  zh-TW: "約1763至1900年間大英帝國如何復甦和擴張，從殖民者和被殖民者兩方看。"
  ja: "1763年頃から1900年までに大英帝国がどう立て直し拡大したかを、植民する側とされる側の両方から見る。"
  ko: "약 1763년부터 1900년까지 대영제국이 어떻게 회복하고 커졌는지 식민자와 피식민자 양쪽 시각으로 본다."
  vi: "Đế quốc Anh phục hồi và mở rộng ra sao từ khoảng 1763 đến 1900, nhìn từ cả phía thực dân lẫn người bị đô hộ."
  ms: "Cara Empayar British pulih dan berkembang dari sekitar 1763 hingga 1900, dilihat dari pihak penjajah dan yang dijajah."
  id: "Cara Kekaisaran Inggris pulih dan meluas dari sekitar 1763 hingga 1900, dilihat dari sisi penjajah dan yang dijajah."
  hi: "लगभग 1763 से 1900 तक ब्रिटिश साम्राज्य कैसे संभला और फैला, उपनिवेशकों और उपनिवेशितों दोनों की नज़र से।"
outcomes:
  - en: "Describe how Britain's empire changed over time"
    zh: "描述大英帝国如何随时间变化"
    zh-TW: "描述大英帝國如何隨時間變化"
    ja: "大英帝国の時代ごとの変化を説明する"
    ko: "대영제국이 시간에 따라 어떻게 변했는지 설명하기"
    vi: "Mô tả đế quốc Anh thay đổi theo thời gian ra sao"
    ms: "Huraikan perubahan empayar British dari masa ke masa"
    id: "Menguraikan perubahan Kekaisaran Inggris dari waktu ke waktu"
    hi: "ब्रिटिश साम्राज्य समय के साथ कैसे बदला, बताना"
  - en: "Analyse how colonised and colonising peoples interacted"
    zh: "分析被殖民者与殖民者之间的互动"
    zh-TW: "分析被殖民者與殖民者之間的互動"
    ja: "植民する側とされる側の関わりを分析する"
    ko: "식민자와 피식민자 사이의 상호작용 분석하기"
    vi: "Phân tích sự tương tác giữa người đi đô hộ và người bị đô hộ"
    ms: "Analisis interaksi antara penjajah dan yang dijajah"
    id: "Menganalisis interaksi penjajah dan yang dijajah"
    hi: "उपनिवेशकों और उपनिवेशितों के आपसी संबंधों का विश्लेषण करना"
  - en: "Locate and analyse sources on empire"
    zh: "查找并分析有关帝国的史料"
    zh-TW: "查找並分析有關帝國的史料"
    ja: "帝国に関する史料を探して分析する"
    ko: "제국 관련 사료 찾아 분석하기"
    vi: "Tìm và phân tích nguồn tư liệu về đế quốc"
    ms: "Cari dan analisis sumber tentang empayar"
    id: "Mencari dan menganalisis sumber tentang kekaisaran"
    hi: "साम्राज्य से जुड़े स्रोत खोजना और उनका विश्लेषण करना"
