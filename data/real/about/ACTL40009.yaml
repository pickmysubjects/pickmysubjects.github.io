code: ACTL40009
year: 2027
learn:
  en: "Investments from an appointed actuary's view: matching asset classes to insurance, super and defined benefit liabilities."
  zh: "从指定精算师角度看投资：为保险、养老金和设定受益负债匹配合适的资产类别。"
  zh-TW: "從簽證精算師角度看投資：為保險、退休金和確定給付負債搭配合適的資產類別。"
  ja: "任命アクチュアリーの視点で見る投資：保険・年金・確定給付の負債に合う資産クラスを選ぶ。"
  ko: "선임계리사 관점의 투자: 보험·연금·확정급여 부채에 맞는 자산군 고르기."
  vi: "Đầu tư nhìn từ góc độ chuyên gia định phí được bổ nhiệm: chọn loại tài sản phù hợp với nợ bảo hiểm, hưu trí và quỹ phúc lợi xác định."
  ms: "Pelaburan dari sudut aktuari yang dilantik: memadankan kelas aset dengan liabiliti insurans, pencen dan faedah tertakrif."
  id: "Investasi dari sudut aktuaris yang ditunjuk: mencocokkan kelas aset dengan liabilitas asuransi, dana pensiun, dan manfaat pasti."
  hi: "नियुक्त एक्चुअरी की नज़र से निवेश: बीमा, सुपरएन्युएशन और डिफ़ाइंड बेनिफ़िट देनदारियों के लिए सही एसेट क्लास चुनना।"
outcomes:
  - en: "Assess the investment needs of insurers and funds"
    zh: "评估保险公司和基金的投资需求"
    zh-TW: "評估保險公司和基金的投資需求"
    ja: "保険会社や基金の投資ニーズを評価する"
    ko: "보험사와 기금의 투자 요구 평가하기"
    vi: "Đánh giá nhu cầu đầu tư của công ty bảo hiểm và quỹ"
    ms: "Menilai keperluan pelaburan syarikat insurans dan dana"
    id: "Menilai kebutuhan investasi perusahaan asuransi dan dana"
    hi: "बीमा कंपनियों और फ़ंड्स की निवेश ज़रूरतें आँकना"
  - en: "Set an investment strategy using asset models"
    zh: "用资产模型制定投资策略"
    zh-TW: "用資產模型制定投資策略"
    ja: "資産モデルを使って投資戦略を立てる"
    ko: "자산 모형으로 투자 전략 세우기"
    vi: "Xây dựng chiến lược đầu tư bằng mô hình tài sản"
    ms: "Bina strategi pelaburan dengan model aset"
    id: "Menyusun strategi investasi dengan model aset"
    hi: "एसेट मॉडलों से निवेश रणनीति बनाना"
  - en: "Monitor portfolios against goals and liabilities"
    zh: "对照目标和负债监控投资组合"
    zh-TW: "對照目標和負債監控投資組合"
    ja: "目標と負債に照らしてポートフォリオを監視する"
    ko: "목표와 부채에 비춰 포트폴리오 점검하기"
    vi: "Theo dõi danh mục so với mục tiêu và nợ phải trả"
    ms: "Pantau portfolio berbanding matlamat dan liabiliti"
    id: "Memantau portofolio terhadap tujuan dan liabilitas"
    hi: "लक्ष्यों और देनदारियों के मुकाबले पोर्टफ़ोलियो पर नज़र रखना"
