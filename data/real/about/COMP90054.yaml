code: COMP90054
year: 2027
learn:
  en: "How autonomous agents decide what to do, using automated planning and reinforcement learning."
  zh: "自主智能体如何决策：自动规划与强化学习。"
  zh-TW: "自主代理如何決策：自動規劃與強化學習。"
  ja: "自律エージェントの意思決定：自動計画と強化学習。"
  ko: "자율 에이전트의 의사결정: 자동 계획과 강화학습."
  vi: "Tác tử tự hành quyết định ra sao: lập kế hoạch tự động và học tăng cường."
  ms: "Cara ejen autonomi membuat keputusan: perancangan automatik dan pembelajaran pengukuhan."
  id: "Cara agen otonom memutuskan tindakan: perencanaan otomatis dan reinforcement learning."
  hi: "स्वायत्त एजेंट कैसे निर्णय लेते हैं: ऑटोमेटेड प्लानिंग और रीइन्फ़ोर्समेंट लर्निंग।"
outcomes:
  - en: "Model a decision problem for an agent"
    zh: "为智能体建模决策问题"
    zh-TW: "為代理建模決策問題"
    ja: "エージェントの意思決定問題をモデル化する"
    ko: "에이전트 의사결정 문제 모델링하기"
    vi: "Mô hình hóa bài toán quyết định cho tác tử"
    ms: "Model masalah keputusan untuk ejen"
    id: "Memodelkan masalah keputusan untuk agen"
    hi: "एजेंट के लिए निर्णय समस्या मॉडल करना"
  - en: "Apply planning and reinforcement learning methods"
    zh: "应用规划与强化学习方法"
    zh-TW: "應用規劃與強化學習方法"
    ja: "計画手法と強化学習を使う"
    ko: "계획·강화학습 방법 적용하기"
    vi: "Áp dụng phương pháp lập kế hoạch và học tăng cường"
    ms: "Guna kaedah perancangan dan pembelajaran pengukuhan"
    id: "Menerapkan metode perencanaan dan reinforcement learning"
    hi: "प्लानिंग और रीइन्फ़ोर्समेंट लर्निंग विधियाँ लागू करना"
