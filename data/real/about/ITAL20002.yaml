code: ITAL20002
year: 2026
learn:
  en: "Italian for students who finished Italian 6: reading real texts and discussing social and cultural topics."
  zh: "适合学完意大利语 6的学生：阅读真实材料，讨论社会和文化话题。"
  zh-TW: "適合學完義大利語 6的學生：閱讀真實材料，討論社會和文化話題。"
  ja: "イタリア語6を終えた学生向け。生の文章を読み、社会や文化の話題を話し合う。"
  ko: "이탈리아어 6을(를) 마친 학생 대상. 실제 자료를 읽고 사회·문화 주제를 토론한다."
  vi: "tiếng Ý cho sinh viên đã học xong tiếng Ý 6: đọc tài liệu thật và thảo luận chủ đề xã hội, văn hóa."
  ms: "bahasa Itali untuk pelajar yang sudah tamat bahasa Itali 6: membaca teks sebenar dan membincangkan topik sosial dan budaya."
  id: "bahasa Italia untuk mahasiswa yang sudah lulus bahasa Italia 6: membaca teks asli dan membahas topik sosial dan budaya."
  hi: "इतालवी 6 पूरा कर चुके छात्रों के लिए इतालवी: असली पाठ पढ़ना और सामाजिक व सांस्कृतिक विषयों पर चर्चा।"
outcomes:
  - en: "Discuss social and cultural topics in Italian"
    zh: "用意大利语讨论社会和文化话题"
    zh-TW: "用義大利語討論社會和文化話題"
    ja: "社会や文化の話題をイタリア語で話し合う"
    ko: "사회·문화 주제를 이탈리아어로 토론하기"
    vi: "Thảo luận chủ đề xã hội, văn hóa bằng tiếng Ý"
    ms: "Bincangkan topik sosial dan budaya dalam bahasa Itali"
    id: "Membahas topik sosial dan budaya dalam bahasa Italia"
    hi: "सामाजिक और सांस्कृतिक विषयों पर इतालवी में चर्चा करना"
  - en: "Read and write longer Italian texts"
    zh: "读写较长的意大利语文章"
    zh-TW: "讀寫較長的義大利語文章"
    ja: "長めのイタリア語の文章を読み書きする"
    ko: "긴 이탈리아어 글 읽고 쓰기"
    vi: "Đọc và viết văn bản tiếng Ý dài hơn"
    ms: "Baca dan tulis teks bahasa Itali yang lebih panjang"
    id: "Membaca dan menulis teks bahasa Italia yang lebih panjang"
    hi: "लंबे इतालवी पाठ पढ़ना-लिखना"
  - en: "Give a clear presentation in Italian"
    zh: "用意大利语做清楚的口头报告"
    zh-TW: "用義大利語做清楚的口頭報告"
    ja: "イタリア語で分かりやすく発表する"
    ko: "이탈리아어로 명확하게 발표하기"
    vi: "Thuyết trình rõ ràng bằng tiếng Ý"
    ms: "Buat pembentangan yang jelas dalam bahasa Itali"
    id: "Melakukan presentasi yang jelas dalam bahasa Italia"
    hi: "इतालवी में स्पष्ट प्रस्तुति देना"
