code: FINA30002
year: 2026
learn:
  en: "Pull your practice together into a resolved body of work for the Graduate Exhibition and Honours entry."
  zh: "整合创作，完成一组成熟作品，用于毕业展和申请荣誉学位。"
  zh-TW: "整合創作，完成一組成熟作品，用於畢業展和申請榮譽學位。"
  ja: "制作をまとめ、卒業展とオナーズ進学に向けた作品群を仕上げる。"
  ko: "작업을 정리해 졸업전과 아너스 진학용 작품군을 완성한다."
  vi: "Gom lại quá trình sáng tác thành bộ tác phẩm cho triển lãm tốt nghiệp và Honours."
  ms: "Satukan amalan menjadi himpunan karya untuk Pameran Graduan dan Honours."
  id: "Menyatukan praktik menjadi karya untuk Pameran Kelulusan dan Honours."
  hi: "अपने काम को ग्रेजुएट प्रदर्शनी और ऑनर्स के लिए परिपक्व कृतियों में समेटना।"
outcomes:
  - en: "Prepare work for the Graduate Exhibition"
    zh: "为毕业展准备作品"
    zh-TW: "為畢業展準備作品"
    ja: "卒業展に向けて作品を準備する"
    ko: "졸업전 작품 준비하기"
    vi: "Chuẩn bị tác phẩm cho triển lãm tốt nghiệp"
    ms: "Sedia karya untuk Pameran Graduan"
    id: "Menyiapkan karya untuk pameran kelulusan"
    hi: "ग्रेजुएट प्रदर्शनी के लिए काम तैयार करना"
  - en: "Back your work with artistic research"
    zh: "用艺术研究支撑作品"
    zh-TW: "用藝術研究支撐作品"
    ja: "芸術的リサーチで作品を裏付ける"
    ko: "예술적 리서치로 작업 뒷받침하기"
    vi: "Dựa tác phẩm trên nghiên cứu nghệ thuật"
    ms: "Sokong karya dengan kajian seni"
    id: "Mendukung karya dengan riset seni"
    hi: "कलात्मक शोध से अपने काम को मज़बूत करना"
  - en: "Learn the practical side of an art career"
    zh: "了解艺术职业的实际面"
    zh-TW: "了解藝術職涯的實際面"
    ja: "アーティストとして働く実務を学ぶ"
    ko: "예술가 커리어의 실무 익히기"
    vi: "Học mặt thực tế của nghề nghệ sĩ"
    ms: "Pelajari sisi praktikal kerjaya seni"
    id: "Mempelajari sisi praktis karier seni"
    hi: "कला-करियर का व्यावहारिक पक्ष सीखना"
