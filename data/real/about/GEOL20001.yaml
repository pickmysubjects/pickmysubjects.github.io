code: GEOL20001
year: 2026
learn:
  en: "Southeast Victoria's geological history, worked out from rocks and volcanic evidence you see in the field."
  zh: "通过野外观察岩石和火山证据，重建维州东南部地质史。"
  zh-TW: "透過野外觀察岩石與火山證據，重建維州東南部地質史。"
  ja: "野外で岩石と火山の痕跡を見て、ビクトリア南東部の地質史を読み解く。"
  ko: "현장에서 암석과 화산 증거를 보고 빅토리아 남동부 지질사를 재구성함."
  vi: "Lịch sử địa chất đông nam Victoria, dựng lại từ đá và dấu vết núi lửa ngoài thực địa."
  ms: "Sejarah geologi tenggara Victoria, dibina dari batuan dan bukti gunung berapi di lapangan."
  id: "Sejarah geologi tenggara Victoria, disusun dari batuan dan bukti gunung api di lapangan."
  hi: "दक्षिण-पूर्व विक्टोरिया का भूवैज्ञानिक इतिहास, फ़ील्ड में चट्टानों और ज्वालामुखी साक्ष्य से।"
outcomes:
  - en: "Reconstruct geological history from field data"
    zh: "用野外数据重建地质史"
    zh-TW: "用野外資料重建地質史"
    ja: "野外データで地質史を復元する"
    ko: "현장 데이터로 지질사 재구성하기"
    vi: "Dựng lại lịch sử địa chất từ dữ liệu thực địa"
    ms: "Bina semula sejarah geologi dari data lapangan"
    id: "Merekonstruksi sejarah geologi dari data lapangan"
    hi: "फ़ील्ड डेटा से भूवैज्ञानिक इतिहास बनाना"
  - en: "Interpret relationships between rock units"
    zh: "解读岩石单元之间的关系"
    zh-TW: "解讀岩石單元之間的關係"
    ja: "岩石単元の関係を解釈する"
    ko: "암석 단위 간 관계 해석하기"
    vi: "Diễn giải quan hệ giữa các đơn vị đá"
    ms: "Tafsir hubungan antara unit batuan"
    id: "Menafsirkan hubungan antar satuan batuan"
    hi: "चट्टान इकाइयों के संबंध समझना"
