code: GEND20003
year: 2026
learn:
  en: "Gender, bodies and sexuality on screen, with weekly films read through feminist, queer, trans and decolonial approaches."
  zh: "银幕上的性别、身体与性，每周观影，并以女性主义、酷儿、跨性别和去殖民视角解读。"
  zh-TW: "銀幕上的性別、身體與性，每週觀影，並以女性主義、酷兒、跨性別和去殖民視角解讀。"
  ja: "スクリーン上のジェンダー、身体、セクシュアリティ。毎週映画を観て、フェミニズム、クィア、トランス、脱植民地の視点で読む。"
  ko: "스크린 속 젠더, 몸, 섹슈얼리티. 매주 영화를 보고 페미니즘·퀴어·트랜스·탈식민 관점으로 읽는다."
  vi: "Giới, cơ thể và tính dục trên màn ảnh, xem phim hằng tuần qua góc nhìn nữ quyền, queer, chuyển giới và giải thực dân."
  ms: "Gender, tubuh dan seksualiti di skrin, dengan filem mingguan dibaca melalui pendekatan feminis, queer, trans dan dekolonial."
  id: "Gender, tubuh dan seksualitas di layar, dengan film mingguan dibaca lewat pendekatan feminis, queer, trans dan dekolonial."
  hi: "परदे पर जेंडर, शरीर और कामुकता, हर हफ़्ते फ़िल्में नारीवादी, क्वीयर, ट्रांस और विउपनिवेशी नज़रिए से।"
outcomes:
  - en: "Analyse how films show bodies and desire"
    zh: "分析电影如何呈现身体与欲望"
    zh-TW: "分析電影如何呈現身體與慾望"
    ja: "映画が身体と欲望をどう描くか分析する"
    ko: "영화가 몸과 욕망을 그리는 방식 분석하기"
    vi: "Phân tích cách phim thể hiện cơ thể và khát khao"
    ms: "Analisis cara filem menggambarkan tubuh dan keinginan"
    id: "Menganalisis cara film menampilkan tubuh dan hasrat"
    hi: "फ़िल्में शरीर और इच्छा को कैसे दिखाती हैं, विश्लेषण करना"
  - en: "Apply gender and sexuality theory to film"
    zh: "把性别与性理论用于电影分析"
    zh-TW: "把性別與性理論用於電影分析"
    ja: "ジェンダーとセクシュアリティの理論を映画に当てはめる"
    ko: "젠더·섹슈얼리티 이론을 영화에 적용하기"
    vi: "Áp dụng lý thuyết giới và tính dục vào phim"
    ms: "Gunakan teori gender dan seksualiti pada filem"
    id: "Menerapkan teori gender dan seksualitas pada film"
    hi: "फ़िल्म पर जेंडर और कामुकता सिद्धांत लागू करना"
  - en: "Compare film movements across countries"
    zh: "比较不同国家的电影运动"
    zh-TW: "比較不同國家的電影運動"
    ja: "国ごとの映画運動を比べる"
    ko: "여러 나라의 영화 운동 비교하기"
    vi: "So sánh các trào lưu điện ảnh giữa các nước"
    ms: "Bandingkan gerakan filem merentas negara"
    id: "Membandingkan gerakan film lintas negara"
    hi: "देशों के फ़िल्म आंदोलनों की तुलना करना"
