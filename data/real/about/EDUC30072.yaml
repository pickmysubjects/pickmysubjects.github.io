code: EDUC30072
year: 2026
learn:
  en: "Use wellbeing science and design thinking to plan your career and build leadership skills."
  zh: "用幸福感科学和设计思维规划职业、培养领导力。"
  zh-TW: "用幸福感科學和設計思考規劃職涯、培養領導力。"
  ja: "ウェルビーイング科学とデザイン思考でキャリアを計画し、リーダーシップを育てる。"
  ko: "웰빙 과학과 디자인 씽킹으로 커리어를 계획하고 리더십 키우기."
  vi: "Dùng khoa học hạnh phúc và tư duy thiết kế để lên kế hoạch sự nghiệp và rèn kỹ năng lãnh đạo."
  ms: "Guna sains kesejahteraan dan pemikiran reka bentuk untuk merancang kerjaya dan memimpin."
  id: "Pakai ilmu kesejahteraan dan design thinking untuk merancang karier dan kepemimpinan."
  hi: "वेलबीइंग विज्ञान और डिज़ाइन थिंकिंग से करियर योजना बनाना और नेतृत्व कौशल विकसित करना।"
outcomes:
  - en: "Link wellbeing research to career and leadership"
    zh: "把幸福感研究与职业和领导力联系起来"
    zh-TW: "把幸福感研究與職涯和領導力連結起來"
    ja: "ウェルビーイング研究をキャリアやリーダーシップに結びつける"
    ko: "웰빙 연구를 커리어·리더십과 연결하기"
    vi: "Gắn nghiên cứu hạnh phúc với sự nghiệp và lãnh đạo"
    ms: "Kaitkan kajian kesejahteraan dengan kerjaya dan kepimpinan"
    id: "Mengaitkan riset kesejahteraan dengan karier dan kepemimpinan"
    hi: "वेलबीइंग शोध को करियर और नेतृत्व से जोड़ना"
  - en: "Give useful feedback and coaching to others"
    zh: "给他人提供有用的反馈和辅导"
    zh-TW: "給他人提供有用的回饋和指導"
    ja: "相手に役立つフィードバックやコーチングをする"
    ko: "다른 사람에게 유용한 피드백과 코칭 주기"
    vi: "Góp ý và hướng dẫn người khác một cách hữu ích"
    ms: "Beri maklum balas dan bimbingan yang berguna"
    id: "Memberi umpan balik dan coaching yang berguna"
    hi: "दूसरों को उपयोगी फ़ीडबैक और कोचिंग देना"
  - en: "Build a portfolio for your career and leadership growth"
    zh: "为职业和领导力发展制作作品集"
    zh-TW: "為職涯和領導力發展製作作品集"
    ja: "キャリアとリーダーシップの成長をポートフォリオにまとめる"
    ko: "커리어·리더십 성장을 담은 포트폴리오 만들기"
    vi: "Lập hồ sơ năng lực cho sự nghiệp và khả năng lãnh đạo"
    ms: "Bina portfolio untuk kerjaya dan kepimpinan anda"
    id: "Menyusun portofolio untuk karier dan kepemimpinan"
    hi: "करियर और नेतृत्व विकास के लिए पोर्टफ़ोलियो बनाना"
