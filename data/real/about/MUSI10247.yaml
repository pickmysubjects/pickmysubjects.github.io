code: MUSI10247
year: 2027
learn:
  en: "One-on-one and group tuition on your instrument or voice, building technique and musical awareness."
  zh: "乐器或声乐的个别课与小组课，打好技术和音乐感基础。"
  zh-TW: "樂器或聲樂的個別課與小組課，打好技術和音樂感基礎。"
  ja: "楽器または声楽の個人・グループレッスンで、技術と音楽的感覚を養う。"
  ko: "악기나 성악 개인·그룹 레슨으로 기술과 음악적 감각 쌓기."
  vi: "Học nhạc cụ hoặc thanh nhạc theo hình thức cá nhân và nhóm, xây dựng kỹ thuật và cảm thụ âm nhạc."
  ms: "Tuisyen individu dan berkumpulan untuk alat muzik atau vokal, membina teknik dan kepekaan muzik."
  id: "Les individu dan kelompok untuk instrumen atau vokal, membangun teknik dan kepekaan musik."
  hi: "अपने वाद्य या गायन की व्यक्तिगत व समूह शिक्षा, तकनीक और संगीत-समझ बनाना।"
outcomes:
  - en: "Build control and coordination in your technique"
    zh: "建立技术上的控制与协调"
    zh-TW: "建立技術上的控制與協調"
    ja: "技術面でのコントロールと協調を身につける"
    ko: "기술적 통제력과 협응력 기르기"
    vi: "Rèn khả năng kiểm soát và phối hợp kỹ thuật"
    ms: "Bina kawalan dan koordinasi teknik"
    id: "Membangun kendali dan koordinasi teknik"
    hi: "तकनीक में नियंत्रण और तालमेल बनाना"
  - en: "Play exercises and pieces fluently and accurately"
    zh: "流畅准确地演奏练习曲和曲目"
    zh-TW: "流暢準確地演奏練習曲和曲目"
    ja: "練習曲や曲を流暢かつ正確に演奏する"
    ko: "연습곡과 곡을 유창하고 정확하게 연주하기"
    vi: "Chơi bài tập và tác phẩm trôi chảy, chính xác"
    ms: "Mainkan latihan dan karya dengan lancar dan tepat"
    id: "Memainkan latihan dan karya dengan lancar dan tepat"
    hi: "अभ्यास और रचनाएँ सहजता व सटीकता से बजाना"
  - en: "Perform with commitment and confidence"
    zh: "投入而自信地演出"
    zh-TW: "投入而自信地演出"
    ja: "気持ちを込めて自信を持って演奏する"
    ko: "몰입과 자신감을 갖고 연주하기"
    vi: "Biểu diễn tận tâm và tự tin"
    ms: "Membuat persembahan dengan komitmen dan yakin"
    id: "Tampil dengan sepenuh hati dan percaya diri"
    hi: "लगन और आत्मविश्वास से प्रस्तुति देना"
