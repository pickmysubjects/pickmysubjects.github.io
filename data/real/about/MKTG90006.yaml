code: MKTG90006
year: 2027
learn:
  en: "Building and managing brands: brand strategy, product lines, responding to competitors and measuring brand equity."
  zh: "打造和管理品牌：品牌战略、产品线、应对竞争对手和衡量品牌资产。"
  zh-TW: "打造與管理品牌：品牌策略、產品線、因應競爭對手與衡量品牌權益。"
  ja: "ブランドの構築と管理：ブランド戦略、製品ライン、競合への対応、ブランド・エクイティの測定。"
  ko: "브랜드 구축과 관리: 브랜드 전략, 제품 라인, 경쟁 대응, 브랜드 자산 측정."
  vi: "Xây dựng và quản lý thương hiệu: chiến lược, dòng sản phẩm, đối phó đối thủ, đo lường tài sản thương hiệu."
  ms: "Membina dan mengurus jenama: strategi jenama, barisan produk, bertindak balas kepada pesaing, mengukur ekuiti jenama."
  id: "Membangun dan mengelola merek: strategi merek, lini produk, merespons pesaing dan mengukur ekuitas merek."
  hi: "ब्रांड बनाना और संभालना: ब्रांड रणनीति, उत्पाद श्रृंखला, प्रतिस्पर्धियों को जवाब और ब्रांड इक्विटी मापना।"
outcomes:
  - en: "Explain why branding drives performance"
    zh: "解释品牌为何影响企业绩效"
    zh-TW: "說明品牌為何影響企業績效"
    ja: "ブランドが業績を左右する理由を説明する"
    ko: "브랜드가 성과를 좌우하는 이유 설명하기"
    vi: "Giải thích vì sao thương hiệu quyết định hiệu quả"
    ms: "Menerangkan mengapa jenama memacu prestasi"
    id: "Menjelaskan mengapa merek mendorong kinerja"
    hi: "ब्रांडिंग प्रदर्शन क्यों बढ़ाती है, समझाना"
  - en: "Do a brand project on a real company"
    zh: "以真实公司做品牌管理项目"
    zh-TW: "以真實公司做品牌管理專案"
    ja: "実在企業でブランド管理プロジェクトを行う"
    ko: "실제 기업으로 브랜드 프로젝트 수행하기"
    vi: "Làm dự án thương hiệu với một công ty thực"
    ms: "Menjalankan projek jenama syarikat sebenar"
    id: "Mengerjakan proyek merek perusahaan nyata"
    hi: "किसी असली कंपनी पर ब्रांड प्रोजेक्ट करना"
