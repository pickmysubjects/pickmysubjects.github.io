code: ACCT10002
year: 2026
learn:
  en: "Recording business transactions and preparing financial reports under Australian accounting rules."
  zh: "按澳洲会计准则记账、编制财务报表。"
  zh-TW: "按澳洲會計準則記帳、編製財務報表。"
  ja: "オーストラリアの会計基準に沿って取引を記録し、財務報告を作成する。"
  ko: "호주 회계 기준에 따라 거래를 기록하고 재무 보고서를 작성하기."
  vi: "Ghi sổ giao dịch và lập báo cáo tài chính theo chuẩn mực kế toán Úc."
  ms: "Merekod urus niaga dan menyediakan laporan kewangan mengikut peraturan perakaunan Australia."
  id: "Mencatat transaksi bisnis dan menyusun laporan keuangan sesuai aturan akuntansi Australia."
  hi: "ऑस्ट्रेलियाई अकाउंटिंग नियमों के तहत लेन-देन दर्ज करना और फ़ाइनेंशियल रिपोर्ट बनाना।"
outcomes:
  - en: "Record transactions and prepare a balance sheet"
    zh: "记账并编制资产负债表和利润表"
    zh-TW: "記帳並編製資產負債表和損益表"
    ja: "取引を記録し貸借対照表を作成する"
    ko: "거래를 기록하고 대차대조표 작성하기"
    vi: "Ghi sổ giao dịch và lập bảng cân đối kế toán"
    ms: "Rekod urus niaga dan sediakan kunci kira-kira"
    id: "Mencatat transaksi dan menyusun neraca"
    hi: "लेन-देन दर्ज करना और बैलेंस शीट बनाना"
  - en: "Build and analyse a cash flow statement"
    zh: "编制并分析现金流量表"
    zh-TW: "編製並分析現金流量表"
    ja: "キャッシュフロー計算書を作成・分析する"
    ko: "현금흐름표 작성 및 분석하기"
    vi: "Lập và phân tích báo cáo lưu chuyển tiền tệ"
    ms: "Bina dan analisis penyata aliran tunai"
    id: "Menyusun dan menganalisis laporan arus kas"
    hi: "कैश फ़्लो स्टेटमेंट बनाना और उसका विश्लेषण"
  - en: "Compare a company's performance with other firms"
    zh: "和其他公司对比分析业绩"
    zh-TW: "和其他公司比較分析業績"
    ja: "企業の業績を他社と比較する"
    ko: "회사의 실적을 다른 기업과 비교하기"
    vi: "So sánh kết quả kinh doanh với công ty khác"
    ms: "Banding prestasi syarikat dengan firma lain"
    id: "Membandingkan kinerja perusahaan dengan perusahaan lain"
    hi: "कंपनी के प्रदर्शन की दूसरी फ़र्मों से तुलना"
