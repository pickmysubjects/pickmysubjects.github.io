code: ACCT90006
year: 2027
learn:
  en: "Systems firms use to measure performance and carry out strategy: target costing, balanced scorecard, EVA and incentives."
  zh: "企业衡量绩效、落实战略的系统：目标成本法、平衡计分卡、EVA和激励。"
  zh-TW: "企業衡量績效、落實策略的系統：目標成本法、平衡計分卡、EVA與激勵。"
  ja: "業績を測り戦略を実行する仕組み：原価企画、バランススコアカード、EVA、インセンティブ。"
  ko: "성과를 측정하고 전략을 실행하는 시스템: 목표원가, 균형성과표, EVA, 인센티브."
  vi: "Hệ thống đo lường hiệu quả và thực thi chiến lược: chi phí mục tiêu, thẻ điểm cân bằng, EVA và khen thưởng."
  ms: "Sistem untuk mengukur prestasi dan melaksana strategi: kos sasaran, kad skor seimbang, EVA dan insentif."
  id: "Sistem untuk mengukur kinerja dan menjalankan strategi: target costing, balanced scorecard, EVA, dan insentif."
  hi: "प्रदर्शन मापने और रणनीति लागू करने की प्रणालियाँ: टारगेट कॉस्टिंग, बैलेंस्ड स्कोरकार्ड, EVA और प्रोत्साहन।"
outcomes:
  - en: "Analyse performance management systems"
    zh: "分析绩效管理系统"
    zh-TW: "分析績效管理系統"
    ja: "業績管理システムを分析する"
    ko: "성과관리 시스템 분석하기"
    vi: "Phân tích hệ thống quản lý hiệu quả"
    ms: "Menganalisis sistem pengurusan prestasi"
    id: "Menganalisis sistem manajemen kinerja"
    hi: "प्रदर्शन प्रबंधन प्रणालियों का विश्लेषण"
  - en: "Design measures that support a firm's strategy"
    zh: "设计支持企业战略的绩效指标"
    zh-TW: "設計支援企業策略的績效指標"
    ja: "戦略を支える業績指標を設計する"
    ko: "전략을 뒷받침하는 성과지표 설계하기"
