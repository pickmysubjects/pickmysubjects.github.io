code: ENGL30046
year: 2026
learn:
  en: "Medieval writing, especially Chaucer and women writers of his time, and how later fiction and film picture the Middle Ages."
  zh: "中世纪写作，尤其是乔叟及同时代女作家，以及后世小说和电影如何描绘中世纪。"
  zh-TW: "中世紀寫作，尤其是喬叟及同時代女作家，以及後世小說和電影如何描繪中世紀。"
  ja: "チョーサーや同時代の女性作家を中心とする中世の文学と、後の小説や映画が中世をどう描くかを学ぶ。"
  ko: "초서와 동시대 여성 작가를 중심으로 한 중세 문학과, 후대 소설·영화가 중세를 어떻게 그리는지 배운다."
  vi: "Văn chương trung cổ, nhất là Chaucer và các nữ tác giả cùng thời, và cách tiểu thuyết, phim sau này hình dung thời Trung cổ."
  ms: "Penulisan zaman pertengahan, terutama Chaucer dan penulis wanita sezamannya, serta cara fiksyen dan filem kemudian menggambarkannya."
  id: "Tulisan abad pertengahan, terutama Chaucer dan penulis perempuan sezamannya, serta cara fiksi dan film kemudian menggambarkan masa itu."
  hi: "मध्यकालीन लेखन, ख़ासकर चॉसर और उनके दौर की महिला लेखक, और बाद की कथा व फ़िल्में मध्ययुग को कैसे दिखाती हैं।"
outcomes:
  - en: "Read medieval texts, some in Middle English"
    zh: "阅读中世纪作品，部分为中古英语原文"
    zh-TW: "閱讀中世紀作品，部分為中古英語原文"
    ja: "中世の作品を一部中英語で読む"
    ko: "일부는 중세 영어로 중세 작품 읽기"
    vi: "Đọc văn bản trung cổ, một số bằng tiếng Anh trung đại"
    ms: "Baca teks zaman pertengahan, sebahagian dalam Inggeris Pertengahan"
    id: "Membaca teks abad pertengahan, sebagian dalam Inggris Pertengahan"
    hi: "मध्यकालीन पाठ पढ़ना, कुछ मध्य अंग्रेज़ी में"
  - en: "Explain how medieval books were made and copied"
    zh: "说明中世纪书籍如何制作和传抄"
    zh-TW: "說明中世紀書籍如何製作和傳抄"
    ja: "中世の本がどう作られ写されたか説明する"
    ko: "중세 책이 만들어지고 필사된 방식 설명하기"
    vi: "Giải thích sách trung cổ được làm và chép ra sao"
    ms: "Terangkan cara buku zaman pertengahan dibuat dan disalin"
    id: "Menjelaskan cara buku abad pertengahan dibuat dan disalin"
    hi: "मध्यकालीन किताबें कैसे बनती और नकल होती थीं, समझाना"
  - en: "Compare medieval works with modern versions"
    zh: "比较中世纪作品与现代改编"
    zh-TW: "比較中世紀作品與現代改編"
    ja: "中世の作品と現代版を比べる"
    ko: "중세 작품과 현대판 비교하기"
    vi: "So sánh tác phẩm trung cổ với phiên bản hiện đại"
    ms: "Bandingkan karya zaman pertengahan dengan versi moden"
    id: "Membandingkan karya abad pertengahan dengan versi modern"
    hi: "मध्यकालीन रचनाओं की आधुनिक रूपों से तुलना करना"
