code: ELEN30014
year: 2026
learn:
  en: "The core ideas behind analog circuits and digital logic, explored through simulation and hardware labs."
  zh: "模拟电路和数字逻辑的核心概念，通过仿真和硬件实验学习。"
  zh-TW: "類比電路與數位邏輯的核心概念，透過模擬與硬體實驗學習。"
  ja: "アナログ回路とデジタル論理の基本を、シミュレーションとハードウェア実験で学ぶ。"
  ko: "아날로그 회로와 디지털 논리의 핵심을 시뮬레이션과 하드웨어 실험으로 배운다."
  vi: "Ý tưởng cốt lõi của mạch tương tự và logic số, học qua mô phỏng và thí nghiệm phần cứng."
  ms: "Idea teras litar analog dan logik digital, diterokai melalui simulasi dan amali perkakasan."
  id: "Konsep inti rangkaian analog dan logika digital, dipelajari lewat simulasi dan praktikum perangkat keras."
  hi: "एनालॉग सर्किट और डिजिटल लॉजिक के मूल विचार, सिमुलेशन और हार्डवेयर लैब से।"
outcomes:
  - en: "Analyse circuits in time and frequency"
    zh: "在时域和频域分析电路"
    zh-TW: "在時域與頻域分析電路"
    ja: "時間・周波数領域で回路を解析する"
    ko: "시간·주파수 영역에서 회로 분석하기"
    vi: "Phân tích mạch theo thời gian và tần số"
    ms: "Menganalisis litar dalam masa dan frekuensi"
    id: "Menganalisis rangkaian dalam waktu dan frekuensi"
    hi: "टाइम और फ़्रीक्वेंसी में सर्किट विश्लेषण करना"
  - en: "Design combinational and sequential logic"
    zh: "设计组合逻辑和时序逻辑"
    zh-TW: "設計組合邏輯與循序邏輯"
    ja: "組合せ・順序回路を設計する"
    ko: "조합·순차 논리 설계하기"
    vi: "Thiết kế logic tổ hợp và tuần tự"
    ms: "Mereka bentuk logik gabungan dan berjujukan"
    id: "Merancang logika kombinasional dan sekuensial"
    hi: "कॉम्बिनेशनल और सीक्वेंशियल लॉजिक डिज़ाइन करना"
  - en: "Configure and test digital hardware boards"
    zh: "配置并测试数字硬件平台"
    zh-TW: "設定並測試數位硬體平台"
    ja: "デジタル開発ボードを設定・試験する"
    ko: "디지털 하드웨어 보드 설정·시험하기"
    vi: "Cấu hình và kiểm thử bo mạch số"
    ms: "Mengkonfigurasi dan menguji papan perkakasan digital"
    id: "Mengonfigurasi dan menguji papan perangkat digital"
    hi: "डिजिटल हार्डवेयर बोर्ड कॉन्फ़िगर और टेस्ट करना"
