code: MUSI30053
year: 2026
learn:
  en: "Plan and try out ethnographic research on music: field notes, interviews and research ethics."
  zh: "策划音乐民族志研究：田野笔记、访谈和研究伦理。"
  zh-TW: "規劃音樂民族誌研究：田野筆記、訪談與研究倫理。"
  ja: "音楽の民族誌研究を計画：フィールドノート、インタビュー、研究倫理。"
  ko: "음악 민족지 연구 기획: 현장 노트, 인터뷰, 연구 윤리."
  vi: "Lập kế hoạch nghiên cứu dân tộc học âm nhạc: ghi chép thực địa, phỏng vấn, đạo đức."
  ms: "Rancang kajian etnografi muzik: nota lapangan, temu bual dan etika kajian."
  id: "Merancang riset etnografi musik: catatan lapangan, wawancara dan etika riset."
  hi: "संगीत पर नृवंशविज्ञान शोध की योजना: फ़ील्ड नोट्स, साक्षात्कार और शोध नैतिकता।"
outcomes:
  - en: "Write field notes and run interviews"
    zh: "撰写田野笔记并做访谈"
    zh-TW: "撰寫田野筆記並做訪談"
    ja: "フィールドノートを書き、インタビューする"
    ko: "현장 노트 작성과 인터뷰 진행"
    vi: "Viết ghi chép thực địa và phỏng vấn"
    ms: "Tulis nota lapangan dan buat temu bual"
    id: "Menulis catatan lapangan dan wawancara"
    hi: "फ़ील्ड नोट्स लिखना और साक्षात्कार करना"
  - en: "Handle ethical issues in music research"
    zh: "处理音乐研究中的伦理问题"
    zh-TW: "處理音樂研究中的倫理問題"
    ja: "音楽研究の倫理問題に対処する"
    ko: "음악 연구의 윤리 문제 다루기"
    vi: "Xử lý vấn đề đạo đức trong nghiên cứu"
    ms: "Tangani isu etika dalam kajian muzik"
    id: "Menangani isu etika riset musik"
    hi: "संगीत शोध के नैतिक मुद्दे सँभालना"
  - en: "Write a workable research proposal"
    zh: "写出可行的研究计划书"
    zh-TW: "寫出可行的研究計畫書"
    ja: "実行可能な研究計画書を書く"
    ko: "실행 가능한 연구 계획서 쓰기"
    vi: "Viết đề cương nghiên cứu khả thi"
    ms: "Tulis cadangan kajian yang boleh dilaksana"
    id: "Menulis proposal riset yang layak"
    hi: "व्यावहारिक शोध प्रस्ताव लिखना"
