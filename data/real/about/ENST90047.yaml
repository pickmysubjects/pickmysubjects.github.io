code: ENST90047
year: 2027
learn:
  en: "How microbes shape ecosystems, and the technologies used to study microbiomes, health and climate change."
  zh: "微生物如何影响生态系统，以及研究微生物组、健康和气候变化的技术。"
  zh-TW: "微生物如何影響生態系統，以及研究微生物組、健康與氣候變遷的技術。"
  ja: "微生物が生態系に与える影響と、マイクロバイオーム・健康・気候変動を調べる技術。"
  ko: "미생물이 생태계에 미치는 영향과 마이크로바이옴·건강·기후변화 연구 기술."
  vi: "Vi sinh vật định hình hệ sinh thái ra sao và các công nghệ nghiên cứu hệ vi sinh, sức khỏe, biến đổi khí hậu."
  ms: "Cara mikrob membentuk ekosistem, dan teknologi untuk mengkaji mikrobiom, kesihatan dan perubahan iklim."
  id: "Cara mikroba membentuk ekosistem, serta teknologi untuk meneliti mikrobioma, kesehatan, dan perubahan iklim."
  hi: "सूक्ष्मजीव पारिस्थितिक तंत्र को कैसे आकार देते हैं, और माइक्रोबायोम, स्वास्थ्य व जलवायु परिवर्तन के अध्ययन की तकनीकें।"
outcomes:
  - en: "Assess microbiome diversity across ecosystems"
    zh: "评估不同生态系统中的微生物组多样性"
    zh-TW: "評估不同生態系統中的微生物組多樣性"
    ja: "生態系ごとのマイクロバイオーム多様性を評価する"
    ko: "생태계별 마이크로바이옴 다양성 평가하기"
    vi: "Đánh giá đa dạng hệ vi sinh ở các hệ sinh thái"
    ms: "Menilai kepelbagaian mikrobiom merentas ekosistem"
    id: "Menilai keragaman mikrobioma di berbagai ekosistem"
    hi: "विभिन्न पारिस्थितिक तंत्रों में माइक्रोबायोम विविधता आँकना"
  - en: "Choose technologies to study microbiomes"
    zh: "选择研究微生物组的技术"
    zh-TW: "選擇研究微生物組的技術"
    ja: "マイクロバイオーム研究の技術を選ぶ"
    ko: "마이크로바이옴 연구 기술 선택하기"
    vi: "Chọn công nghệ để nghiên cứu hệ vi sinh"
    ms: "Memilih teknologi untuk mengkaji mikrobiom"
    id: "Memilih teknologi untuk meneliti mikrobioma"
    hi: "माइक्रोबायोम अध्ययन की तकनीकें चुनना"
  - en: "Link microbiomes to health, farming and climate"
    zh: "把微生物组与健康、农业和气候联系起来"
    zh-TW: "把微生物組與健康、農業和氣候連結起來"
    ja: "マイクロバイオームを健康・農業・気候と結びつける"
    ko: "마이크로바이옴을 건강·농업·기후와 연결하기"
    vi: "Liên hệ hệ vi sinh với sức khỏe, nông nghiệp, khí hậu"
    ms: "Mengaitkan mikrobiom dengan kesihatan, pertanian dan iklim"
    id: "Mengaitkan mikrobioma dengan kesehatan, pertanian, dan iklim"
    hi: "माइक्रोबायोम को स्वास्थ्य, खेती और जलवायु से जोड़ना"
