code: MUST30011
year: 2026
learn:
  en: "A two-week overseas intensive in music theatre, with dance and masterclass showings and a final concert performance."
  zh: "两周海外音乐剧密集课，有舞蹈和大师班展演，最后是音乐会演出。"
  zh-TW: "兩週海外音樂劇密集課，有舞蹈與大師班展演，最後是音樂會演出。"
  ja: "2週間の海外ミュージカル集中講義。ダンスとマスタークラスの発表、最後にコンサート。"
  ko: "2주 해외 뮤지컬 집중 과정. 무용·마스터클래스 발표와 마지막 콘서트 공연."
  vi: "Khóa nhạc kịch hai tuần ở nước ngoài, có múa, lớp chuyên đề và buổi hòa nhạc cuối."
  ms: "Intensif teater muzikal dua minggu di luar negara, dengan persembahan dan konsert akhir."
  id: "Intensif teater musikal dua minggu di luar negeri, dengan pentas dan konser akhir."
  hi: "दो हफ़्ते का विदेशी म्यूज़िक थिएटर इंटेंसिव: डांस, मास्टरक्लास और अंतिम कॉन्सर्ट।"
outcomes:
  - en: "Learn from international teachers and artists"
    zh: "向国际导师和艺术家学习"
    zh-TW: "向國際導師與藝術家學習"
    ja: "海外の講師や芸術家から学ぶ"
    ko: "해외 강사·예술가에게 배우기"
    vi: "Học từ giảng viên, nghệ sĩ quốc tế"
    ms: "Belajar dari guru dan artis antarabangsa"
    id: "Belajar dari pengajar dan seniman internasional"
    hi: "अंतरराष्ट्रीय शिक्षकों और कलाकारों से सीखना"
  - en: "Perform in dance and solo settings"
    zh: "进行舞蹈和独唱/独演表演"
    zh-TW: "進行舞蹈與獨唱／獨演表演"
    ja: "ダンスとソロで発表する"
    ko: "무용과 솔로로 공연하기"
    vi: "Biểu diễn múa và đơn ca"
    ms: "Membuat persembahan tarian dan solo"
    id: "Tampil dalam tari dan solo"
    hi: "डांस और सोलो प्रस्तुति देना"
  - en: "Reflect on your growth as a performer"
    zh: "反思自己作为表演者的成长"
    zh-TW: "反思自己作為表演者的成長"
    ja: "表現者としての成長を振り返る"
    ko: "공연자로서의 성장 성찰하기"
    vi: "Suy ngẫm sự tiến bộ của bản thân"
    ms: "Renung perkembangan diri sebagai penghibur"
    id: "Merefleksikan perkembangan sebagai penampil"
    hi: "कलाकार के रूप में अपनी प्रगति पर चिंतन"
