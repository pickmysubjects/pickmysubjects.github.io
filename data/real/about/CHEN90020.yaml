code: CHEN90020
year: 2027
learn:
  en: "Plant economics, project management, environmental and safety issues for chemical projects."
  zh: "化工项目的工厂经济、项目管理以及环境与安全问题。"
  zh-TW: "化工專案的工廠經濟、專案管理以及環境與安全問題。"
  ja: "化学プロジェクトのプラント経済、プロジェクト管理、環境・安全の問題。"
  ko: "화공 프로젝트의 플랜트 경제성, 프로젝트 관리, 환경·안전 문제."
  vi: "Kinh tế nhà máy, quản lý dự án, môi trường và an toàn cho dự án hóa chất."
  ms: "Ekonomi loji, pengurusan projek, isu alam sekitar dan keselamatan bagi projek kimia."
  id: "Ekonomi pabrik, manajemen proyek, isu lingkungan dan keselamatan untuk proyek kimia."
  hi: "केमिकल परियोजनाओं के लिए प्लांट अर्थशास्त्र, परियोजना प्रबंधन, पर्यावरण और सुरक्षा।"
outcomes:
  - en: "Build feasibility studies weighing cost, environment and society"
    zh: "完成兼顾经济、环境和社会的可行性研究"
    zh-TW: "完成兼顧經濟、環境與社會的可行性研究"
    ja: "経済・環境・社会を比べた事業性調査を行う"
    ko: "경제·환경·사회를 따지는 타당성 조사 하기"
    vi: "Lập nghiên cứu khả thi cân nhắc kinh tế, môi trường và xã hội"
    ms: "Membina kajian kebolehlaksanaan yang menimbang ekonomi, alam sekitar dan masyarakat"
    id: "Menyusun studi kelayakan yang menimbang ekonomi, lingkungan, dan sosial"
    hi: "लागत, पर्यावरण और समाज को तौलकर व्यवहार्यता अध्ययन बनाना"
  - en: "Use project management skills on large projects"
    zh: "在大型项目中运用项目管理技能"
    zh-TW: "在大型專案中運用專案管理技能"
    ja: "大規模プロジェクトでプロジェクト管理を使う"
    ko: "대형 프로젝트에 프로젝트 관리 기술 쓰기"
    vi: "Dùng kỹ năng quản lý dự án cho dự án lớn"
    ms: "Menggunakan kemahiran pengurusan projek untuk projek besar"
    id: "Memakai keterampilan manajemen proyek pada proyek besar"
    hi: "बड़ी परियोजनाओं में परियोजना प्रबंधन कौशल लगाना"
