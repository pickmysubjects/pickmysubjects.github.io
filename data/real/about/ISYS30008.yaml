code: ISYS30008
year: 2026
learn:
  en: "Using data for business decisions: data warehouse design, data quality, OLAP, dashboards and data mining."
  zh: "用数据支持商业决策：数据仓库设计、数据质量、OLAP、仪表盘与数据挖掘。"
  zh-TW: "用資料支援商業決策：資料倉儲設計、資料品質、OLAP、儀表板與資料探勘。"
  ja: "データで経営判断：DWH設計、データ品質、OLAP、ダッシュボード、データマイニング。"
  ko: "데이터로 비즈니스 의사결정: DW 설계, 데이터 품질, OLAP, 대시보드, 데이터 마이닝."
  vi: "Dùng dữ liệu cho quyết định kinh doanh: kho dữ liệu, chất lượng, OLAP, dashboard, khai phá."
  ms: "Guna data untuk keputusan perniagaan: gudang data, kualiti data, OLAP, papan pemuka."
  id: "Data untuk keputusan bisnis: desain gudang data, kualitas data, OLAP, dasbor, data mining."
  hi: "बिज़नेस फ़ैसलों के लिए डेटा: डेटा वेयरहाउस, डेटा क्वालिटी, OLAP, डैशबोर्ड, डेटा माइनिंग।"
outcomes:
