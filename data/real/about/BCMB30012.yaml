code: BCMB30012
year: 2026
learn:
  en: "Reading and critiquing current research in biochemistry and molecular biology, and presenting it to different audiences."
  zh: "研读和点评生化与分子生物学的最新研究，并讲给不同人听。"
  zh-TW: "研讀和評論生化與分子生物學的最新研究，並講給不同的人聽。"
  ja: "生化学・分子生物学の最新研究を読んで批評し、さまざまな相手に発表する。"
  ko: "생화학·분자생물학 최신 연구를 읽고 비평하며, 다양한 청중에게 발표하기."
  vi: "Đọc và phản biện nghiên cứu mới về hóa sinh, sinh học phân tử, rồi trình bày cho nhiều đối tượng."
  ms: "Membaca dan mengkritik kajian terkini biokimia dan biologi molekul, serta membentangkannya kepada pelbagai audiens."
  id: "Membaca dan mengkritisi riset terbaru biokimia dan biologi molekuler, lalu mempresentasikannya ke berbagai audiens."
  hi: "बायोकेमिस्ट्री व मॉलिक्यूलर बायोलॉजी की नई रिसर्च पढ़ना, परखना और अलग-अलग लोगों के सामने पेश करना।"
outcomes:
  - en: "Judge whether an experiment is valid and ethical"
    zh: "判断实验是否严谨、合乎伦理"
    zh-TW: "判斷實驗是否嚴謹、合乎倫理"
    ja: "実験が妥当で倫理的か判断する"
    ko: "실험이 타당하고 윤리적인지 판단하기"
    vi: "Đánh giá thí nghiệm có hợp lệ và đạo đức không"
    ms: "Nilai sama ada eksperimen sah dan beretika"
    id: "Menilai apakah eksperimen valid dan etis"
    hi: "जाँचना कि प्रयोग सही और नैतिक है या नहीं"
  - en: "Critique a published paper in writing and in talks"
    zh: "用书面和口头点评论文"
    zh-TW: "用書面和口頭評論論文"
    ja: "発表済み論文を文章と口頭で批評する"
    ko: "출판 논문을 글과 발표로 비평하기"
    vi: "Phản biện bài báo đã đăng bằng viết và thuyết trình"
    ms: "Kritik kertas terbitan secara bertulis dan lisan"
    id: "Mengkritisi makalah terbit secara tulisan dan lisan"
    hi: "प्रकाशित पेपर की लिखकर और बोलकर समीक्षा"
  - en: "Explain research to different audiences"
    zh: "向不同听众讲解研究"
    zh-TW: "向不同聽眾講解研究"
    ja: "研究をさまざまな相手に説明する"
    ko: "다양한 청중에게 연구 설명하기"
    vi: "Giải thích nghiên cứu cho nhiều đối tượng"
    ms: "Terangkan kajian kepada pelbagai audiens"
    id: "Menjelaskan riset ke berbagai audiens"
    hi: "अलग-अलग लोगों को रिसर्च समझाना"
