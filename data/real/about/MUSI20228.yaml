code: MUSI20228
year: 2026
learn:
  en: "Online subject on getting better at anything: the psychology of expertise, motivation, feedback and focus, applied to your own goals."
  zh: "在线课：如何在任何领域进步——专长、动机、反馈和专注的心理学，并用在自己的目标上"
  zh-TW: "線上課：如何在任何領域進步——專長、動機、回饋和專注的心理學，並用在自己的目標上"
  ja: "何事も上達するためのオンライン科目。熟達、動機づけ、フィードバック、集中の心理学を自分の目標に。"
  ko: "무엇이든 더 잘하는 법을 다루는 온라인 과목: 전문성, 동기, 피드백, 집중의 심리학을 내 목표에 적용."
  vi: "Môn trực tuyến về cách tiến bộ ở mọi việc: tâm lý học về chuyên môn, động lực, phản hồi, tập trung."
  ms: "Subjek dalam talian tentang menjadi lebih baik: psikologi kepakaran, motivasi, maklum balas dan fokus."
  id: "Mata kuliah daring tentang menjadi lebih baik: psikologi keahlian, motivasi, umpan balik, dan fokus."
  hi: "किसी भी चीज़ में बेहतर होने पर ऑनलाइन विषय: विशेषज्ञता, प्रेरणा, फ़ीडबैक और एकाग्रता का मनोविज्ञान।"
outcomes:
  - en: "Explain what drives high performance in many fields"
    zh: "解释各领域高水平表现背后的因素"
    zh-TW: "解釋各領域高水準表現背後的因素"
    ja: "さまざまな分野で高い成果を生む要因を説明する"
    ko: "여러 분야에서 높은 성과를 이끄는 요인 설명하기"
    vi: "Giải thích điều thúc đẩy thành tích cao ở nhiều lĩnh vực"
    ms: "Menerangkan pendorong prestasi tinggi dalam pelbagai bidang"
    id: "Menjelaskan pendorong kinerja tinggi di berbagai bidang"
    hi: "कई क्षेत्रों में उत्कृष्ट प्रदर्शन के कारण समझाना"
  - en: "Compare research on arts, sport, business and medicine"
    zh: "比较艺术、体育、商业和医学领域的研究"
    zh-TW: "比較藝術、體育、商業和醫學領域的研究"
    ja: "芸術、スポーツ、ビジネス、医学の研究を比べる"
    ko: "예술, 스포츠, 비즈니스, 의학 연구 비교하기"
    vi: "So sánh nghiên cứu về nghệ thuật, thể thao, kinh doanh, y học"
    ms: "Membandingkan kajian seni, sukan, perniagaan dan perubatan"
    id: "Membandingkan riset seni, olahraga, bisnis, dan kedokteran"
    hi: "कला, खेल, व्यवसाय और चिकित्सा पर शोध की तुलना करना"
  - en: "Reflect on and improve your own practice"
    zh: "反思并改进自己的练习方式"
    zh-TW: "反思並改進自己的練習方式"
    ja: "自分の取り組み方を振り返り改善する"
    ko: "자신의 연습 방식을 돌아보고 개선하기"
    vi: "Tự suy ngẫm và cải thiện cách luyện tập"
    ms: "Menilai dan memperbaiki amalan sendiri"
    id: "Merefleksikan dan memperbaiki cara berlatih sendiri"
    hi: "अपने अभ्यास पर विचार कर उसे सुधारना"
