code: ELEN90054
year: 2027
learn:
  en: "Probability for engineers: random variables and vectors, distributions, decision tests and random processes."
  zh: "面向工程师的概率：随机变量与随机向量、概率分布、判决检验与随机过程。"
  zh-TW: "給工程師的機率：隨機變數與隨機向量、機率分布、判決檢定與隨機過程。"
  ja: "エンジニアのための確率：確率変数とベクトル、分布、判定検定、確率過程。"
  ko: "엔지니어를 위한 확률: 확률 변수와 벡터, 분포, 판정 검정, 확률 과정."
  vi: "Xác suất cho kỹ sư: biến và vectơ ngẫu nhiên, phân phối, kiểm định quyết định, quá trình ngẫu nhiên."
  ms: "Kebarangkalian untuk jurutera: pemboleh ubah dan vektor rawak, taburan, ujian keputusan dan proses rawak."
  id: "Probabilitas untuk insinyur: variabel dan vektor acak, distribusi, uji keputusan, proses acak."
  hi: "इंजीनियरों के लिए प्रायिकता: यादृच्छिक चर और सदिश, वितरण, निर्णय परीक्षण, यादृच्छिक प्रक्रियाएँ।"
outcomes:
  - en: "Model uncertainty in an engineering system with probability"
    zh: "用概率为工程系统中的不确定性建模"
    zh-TW: "用機率為工程系統中的不確定性建模"
    ja: "工学システムの不確かさを確率でモデル化する"
    ko: "공학 시스템의 불확실성을 확률로 모델링하기"
    vi: "Mô hình hóa sự bất định của hệ thống kỹ thuật bằng xác suất"
    ms: "Memodelkan ketidakpastian sistem kejuruteraan dengan kebarangkalian"
    id: "Memodelkan ketidakpastian sistem teknik dengan probabilitas"
    hi: "प्रायिकता से इंजीनियरिंग सिस्टम की अनिश्चितता का मॉडल बनाना"
  - en: "Make decisions from noisy data using tests"
    zh: "用检验方法从含噪声的数据中做判断"
    zh-TW: "用檢定方法從含雜訊的資料中做判斷"
    ja: "検定を使い、ノイズのあるデータから判断する"
    ko: "검정으로 잡음 섞인 데이터에서 판단하기"
    vi: "Dùng kiểm định để ra quyết định từ dữ liệu nhiễu"
    ms: "Membuat keputusan daripada data bising menggunakan ujian"
    id: "Mengambil keputusan dari data bising dengan uji"
    hi: "परीक्षणों से शोर भरे डेटा पर निर्णय लेना"
