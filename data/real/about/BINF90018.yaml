code: BINF90018
year: 2027
learn:
  en: "Hands-on command line, automation, version control and workflows for reproducible data-heavy research."
  zh: "动手学习命令行、自动化、版本控制和工作流，做可复现的数据密集型研究。"
  zh-TW: "動手學習命令列、自動化、版本控制與工作流程，做可重現的資料密集研究。"
  ja: "コマンドライン、自動化、バージョン管理、ワークフローを実践し再現可能な研究を行う。"
  ko: "명령줄, 자동화, 버전 관리, 워크플로를 실습해 재현 가능한 연구를 한다."
  vi: "Thực hành dòng lệnh, tự động hóa, quản lý phiên bản và quy trình cho nghiên cứu tái lập."
  ms: "Praktikal baris arahan, automasi, kawalan versi dan aliran kerja untuk kajian boleh ulang."
  id: "Praktik baris perintah, otomasi, kontrol versi, dan workflow untuk riset yang dapat diulang."
  hi: "कमांड लाइन, ऑटोमेशन, वर्ज़न कंट्रोल और वर्कफ़्लो का अभ्यास, दोहराने योग्य शोध के लिए।"
outcomes:
  - en: "Use the command line to handle files and data"
    zh: "用命令行处理文件和数据"
    zh-TW: "用命令列處理檔案與資料"
    ja: "コマンドラインでファイルとデータを扱う"
    ko: "명령줄로 파일·데이터 다루기"
    vi: "Dùng dòng lệnh để xử lý tệp và dữ liệu"
    ms: "Menggunakan baris arahan untuk fail dan data"
    id: "Memakai baris perintah untuk file dan data"
    hi: "कमांड लाइन से फ़ाइल और डेटा संभालना"
  - en: "Track work with version control and packaging"
    zh: "用版本控制和软件打包记录工作"
    zh-TW: "用版本控制與套件管理記錄工作"
    ja: "バージョン管理とパッケージで作業を記録する"
    ko: "버전 관리와 패키징으로 작업 기록하기"
    vi: "Ghi lại công việc bằng quản lý phiên bản"
    ms: "Merekod kerja dengan kawalan versi dan pembungkusan"
    id: "Mencatat kerja dengan kontrol versi dan paket"
    hi: "वर्ज़न कंट्रोल और पैकेजिंग से काम दर्ज करना"
  - en: "Build automated, scalable analysis workflows"
    zh: "构建自动化、可扩展的分析流程"
    zh-TW: "建立自動化、可擴展的分析流程"
    ja: "自動化された拡張可能な解析フローを作る"
    ko: "자동화·확장 가능한 분석 워크플로 만들기"
    vi: "Xây dựng quy trình phân tích tự động, mở rộng được"
    ms: "Membina aliran analisis automatik dan berskala"
    id: "Membangun workflow analisis otomatis dan skalabel"
    hi: "स्वचालित, स्केलेबल विश्लेषण वर्कफ़्लो बनाना"
