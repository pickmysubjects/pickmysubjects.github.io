code: FINA20030
year: 2026
learn:
  en: "Deepen one chosen line of studio enquiry, link it to art theory, and try a real professional setting."
  zh: "深入一个创作方向，结合艺术理论，并接触真实的行业场景。"
  zh-TW: "深入一個創作方向，結合藝術理論，並接觸真實的業界場景。"
  ja: "選んだ探究テーマを深め、美術理論と結び、実際の現場も体験する。"
  ko: "하나의 작업 방향을 깊이 파고 미술 이론과 잇고 실제 현장을 경험한다."
  vi: "Đào sâu một hướng sáng tác, nối với lý thuyết nghệ thuật, thử môi trường thật."
  ms: "Dalami satu bidang studio, kaitkan dengan teori seni, cuba suasana profesional."
  id: "Mendalami satu arah studio, kaitkan dengan teori seni, coba dunia profesional."
  hi: "स्टूडियो की एक दिशा गहराना, कला-सिद्धांत से जोड़ना और असली पेशेवर माहौल आज़माना।"
outcomes:
  - en: "Gather research material behind your work"
    zh: "为作品整理研究资料"
    zh-TW: "為作品整理研究資料"
    ja: "作品の裏付けとなる調査資料をまとめる"
    ko: "작업 뒷받침 자료 모으기"
    vi: "Thu thập tư liệu nghiên cứu cho tác phẩm"
    ms: "Kumpul bahan kajian untuk karya"
    id: "Mengumpulkan bahan riset untuk karya"
    hi: "अपने काम के पीछे का शोध जुटाना"
  - en: "Finish a resolved body of work"
    zh: "完成一组成熟的作品"
    zh-TW: "完成一組成熟的作品"
    ja: "完成度の高い作品群を仕上げる"
    ko: "완성도 있는 작품군 마무리하기"
    vi: "Hoàn thiện một bộ tác phẩm chỉn chu"
    ms: "Siapkan himpunan karya yang matang"
    id: "Menyelesaikan rangkaian karya yang matang"
    hi: "परिपक्व कृतियों का समूह पूरा करना"
  - en: "Manage your studio time and safety"
    zh: "管理工作室时间与安全"
    zh-TW: "管理工作室時間與安全"
    ja: "制作時間と安全を管理する"
    ko: "작업 시간과 안전 관리하기"
    vi: "Quản lý thời gian và an toàn ở xưởng"
    ms: "Urus masa dan keselamatan studio"
    id: "Mengatur waktu dan keselamatan studio"
    hi: "स्टूडियो समय और सुरक्षा संभालना"
