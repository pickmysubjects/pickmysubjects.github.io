code: IBUS90001
year: 2027
learn:
  en: "Capstone where teams act as consultants, shaping strategy for firms abroad: where to go, how to enter and how to compete."
  zh: "毕业项目：团队以咨询形式为跨国企业制定战略，包括选址和进入方式。"
  zh-TW: "畢業專題：團隊以顧問形式為跨國企業制定策略，包括選址與進入方式。"
  ja: "キャップストーン科目。チームでコンサルタントとして、海外展開する企業の立地選択や参入方法などの戦略を立てる。"
  ko: "캡스톤 과목. 팀이 컨설턴트가 되어 해외 진출 기업의 입지, 진입 방식 등 전략을 세운다."
  vi: "Môn capstone: làm việc nhóm như tư vấn, xây dựng chiến lược cho doanh nghiệp ra nước ngoài: chọn địa điểm, cách thâm nhập."
  ms: "Subjek capstone: pasukan bertindak sebagai perunding, merangka strategi firma di luar negara, termasuk lokasi dan cara kemasukan."
  id: "Mata kuliah capstone: tim berperan sebagai konsultan, menyusun strategi perusahaan di luar negeri, termasuk lokasi dan cara masuk."
  hi: "कैपस्टोन विषय: टीमें सलाहकार बनकर विदेश में काम करने वाली कंपनियों की रणनीति बनाती हैं, जैसे स्थान और प्रवेश का तरीका।"
outcomes:
  - en: "Apply theories of location choice and entry mode"
    zh: "运用选址与进入方式的理论"
    zh-TW: "運用選址與進入方式的理論"
    ja: "立地選択と参入方法の理論を応用する"
    ko: "입지 선택과 진입 방식 이론 적용하기"
    vi: "Vận dụng lý thuyết về chọn địa điểm và cách thâm nhập"
    ms: "Mengaplikasi teori pilihan lokasi dan cara kemasukan"
    id: "Menerapkan teori pemilihan lokasi dan cara masuk pasar"
    hi: "स्थान चयन और प्रवेश के तरीके के सिद्धांत लागू करना"
  - en: "Judge how useful strategy models are for real managers"
    zh: "评判各种战略模型对管理者的实用性"
    zh-TW: "評判各種策略模型對管理者的實用性"
    ja: "戦略モデルが実際の経営にどれだけ役立つかを評価する"
    ko: "전략 모델이 실제 경영에 얼마나 유용한지 평가하기"
    vi: "Đánh giá mức hữu ích của các mô hình chiến lược"
    ms: "Menilai kegunaan model strategi bagi pengurus"
    id: "Menilai kegunaan model strategi bagi manajer"
    hi: "रणनीति मॉडल प्रबंधकों के लिए कितने उपयोगी हैं, आँकना"
  - en: "Present a strategy for a case, spoken and in writing"
    zh: "就案例提出战略，口头和书面呈现"
    zh-TW: "針對案例提出策略，以口頭和書面呈現"
    ja: "ケースに対する戦略を口頭と文書で提示する"
    ko: "사례에 대한 전략을 말과 글로 제시하기"
    vi: "Trình bày chiến lược cho tình huống, bằng lời và văn bản"
    ms: "Membentangkan strategi bagi kes, secara lisan dan bertulis"
    id: "Menyajikan strategi untuk kasus, lisan dan tertulis"
    hi: "किसी केस के लिए रणनीति मौखिक और लिखित रूप में रखना"
