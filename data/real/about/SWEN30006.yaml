code: SWEN30006
year: 2026
learn:
  en: "Analysing requirements and modelling software designs with UML diagrams and design patterns, in an Agile way."
  zh: "分析需求，用UML图和设计模式做软件设计，采用敏捷方法。"
  zh-TW: "分析需求，用UML圖和設計模式做軟體設計，採用敏捷方法。"
  ja: "要件を分析し、UML図とデザインパターンでソフトウェア設計をモデル化する。アジャイル方式。"
  ko: "요구사항 분석과 UML 다이어그램·디자인 패턴을 이용한 소프트웨어 설계 모델링, 애자일 방식."
  vi: "Phân tích yêu cầu và mô hình hóa thiết kế phần mềm bằng UML và mẫu thiết kế, theo Agile."
  ms: "Menganalisis keperluan dan memodelkan reka bentuk perisian dengan rajah UML dan corak reka bentuk, secara Agile."
  id: "Menganalisis kebutuhan dan memodelkan desain perangkat lunak dengan diagram UML dan design pattern, secara Agile."
  hi: "ज़रूरतों का विश्लेषण और UML डायग्राम व डिज़ाइन पैटर्न से सॉफ़्टवेयर डिज़ाइन, Agile तरीके से।"
outcomes:
  - en: "Model requirements and designs with UML"
    zh: "用UML画需求和设计模型"
    zh-TW: "用UML建立需求和設計模型"
    ja: "UMLで要件と設計をモデル化する"
    ko: "UML로 요구사항과 설계 모델링"
    vi: "Mô hình hóa yêu cầu và thiết kế bằng UML"
    ms: "Modelkan keperluan dan reka bentuk dengan UML"
    id: "Memodelkan kebutuhan dan desain dengan UML"
    hi: "UML से ज़रूरतें और डिज़ाइन मॉडल करना"
  - en: "Use design patterns to solve software problems"
    zh: "用设计模式解决软件问题"
    zh-TW: "用設計模式解決軟體問題"
    ja: "デザインパターンでソフトウェアの問題を解く"
    ko: "디자인 패턴으로 소프트웨어 문제 해결"
    vi: "Dùng mẫu thiết kế để giải quyết vấn đề phần mềm"
    ms: "Guna corak reka bentuk untuk selesaikan masalah perisian"
    id: "Memakai design pattern untuk memecahkan masalah software"
    hi: "डिज़ाइन पैटर्न से सॉफ़्टवेयर समस्याएँ हल करना"
  - en: "Pick suitable tools for software design"
    zh: "选择合适的软件设计工具"
    zh-TW: "選擇合適的軟體設計工具"
    ja: "ソフトウェア設計に適したツールを選ぶ"
    ko: "소프트웨어 설계에 맞는 도구 선택"
    vi: "Chọn công cụ phù hợp cho thiết kế phần mềm"
    ms: "Pilih alat sesuai untuk reka bentuk perisian"
    id: "Memilih alat yang tepat untuk desain software"
    hi: "सॉफ़्टवेयर डिज़ाइन के लिए सही टूल चुनना"
