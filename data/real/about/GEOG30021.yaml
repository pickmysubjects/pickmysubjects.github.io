code: GEOG30021
year: 2026
learn:
  en: "Why some city groups are hit harder by disasters, and how cities can build resilience, with a local field trip."
  zh: "为何城市中某些群体受灾更重，以及城市如何增强韧性，含本地考察。"
  zh-TW: "為何城市中某些族群受災更重，以及城市如何強化韌性，含在地考察。"
  ja: "都市で災害の被害が偏る理由と、レジリエンスを高める方法。地元での野外調査あり。"
  ko: "도시에서 일부 집단이 재난 피해를 더 받는 이유와 회복력 키우기, 지역 답사 포함."
  vi: "Vì sao một số nhóm ở đô thị chịu thiên tai nặng hơn và cách tăng khả năng chống chịu, có thực địa."
  ms: "Kenapa sesetengah kumpulan bandar lebih terjejas bencana dan cara bina daya tahan, dengan lawatan tempatan."
  id: "Mengapa kelompok kota tertentu lebih terdampak bencana dan cara membangun ketahanan, dengan kunjungan lokal."
  hi: "शहर में कुछ समूहों पर आपदा का असर ज़्यादा क्यों होता है, और लचीलापन कैसे बने, स्थानीय फ़ील्ड ट्रिप सहित।"
outcomes:
  - en: "Explain why some groups are more vulnerable"
    zh: "解释某些群体为何更脆弱"
    zh-TW: "解釋某些族群為何更脆弱"
    ja: "一部の集団が脆弱な理由を説明する"
    ko: "일부 집단이 더 취약한 이유 설명하기"
    vi: "Giải thích vì sao một số nhóm dễ tổn thương"
    ms: "Terangkan kenapa sesetengah kumpulan lebih terdedah"
    id: "Menjelaskan mengapa kelompok tertentu rentan"
    hi: "कुछ समूह ज़्यादा असुरक्षित क्यों हैं समझाना"
  - en: "Evaluate urban disaster management policies"
    zh: "评估城市灾害管理政策"
    zh-TW: "評估都市災害管理政策"
    ja: "都市の防災政策を評価する"
    ko: "도시 재난관리 정책 평가하기"
    vi: "Đánh giá chính sách quản lý thiên tai đô thị"
    ms: "Nilai dasar pengurusan bencana bandar"
    id: "Menilai kebijakan penanggulangan bencana kota"
    hi: "शहरी आपदा प्रबंधन नीतियाँ परखना"
