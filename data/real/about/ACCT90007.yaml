code: ACCT90007
year: 2027
learn:
  en: "Advanced auditing taught by practitioners: data analytics, engagement risk and auditing asset and liability values."
  zh: "由业界人士讲授的高级审计：数据分析、业务风险以及资产负债计价审计。"
  zh-TW: "由業界人士講授的進階審計：資料分析、委任風險及資產負債評價審計。"
  ja: "実務家による上級監査：データ分析、契約リスク、資産・負債評価の監査。"
  ko: "실무자가 가르치는 고급 감사: 데이터 분석, 업무 위험, 자산·부채 평가 감사."
  vi: "Kiểm toán nâng cao do người hành nghề dạy: phân tích dữ liệu, rủi ro hợp đồng, kiểm toán giá trị tài sản và nợ."
  ms: "Pengauditan lanjutan oleh pengamal: analitik data, risiko penugasan dan audit nilai aset serta liabiliti."
  id: "Audit lanjutan oleh praktisi: analitik data, risiko penugasan, dan audit nilai aset serta liabilitas."
  hi: "पेशेवरों द्वारा उन्नत ऑडिट: डेटा एनालिटिक्स, एंगेजमेंट जोखिम और परिसंपत्ति-देनदारी मूल्य का ऑडिट।"
outcomes:
  - en: "Carry out risk assessments and make audit judgements"
    zh: "进行风险评估并作出审计判断"
    zh-TW: "進行風險評估並作出審計判斷"
    ja: "リスク評価を行い監査判断を下す"
    ko: "위험평가를 하고 감사 판단 내리기"
    vi: "Đánh giá rủi ro và đưa ra xét đoán kiểm toán"
    ms: "Menjalankan penilaian risiko dan membuat pertimbangan audit"
    id: "Melakukan penilaian risiko dan membuat pertimbangan audit"
    hi: "जोखिम आकलन करना और ऑडिट निर्णय लेना"
  - en: "Analyse complex issues in real audit settings"
    zh: "分析真实审计情境中的复杂问题"
    zh-TW: "分析真實審計情境中的複雜問題"
    ja: "実際の監査場面の複雑な問題を分析する"
    ko: "실제 감사 상황의 복잡한 문제 분석하기"
    vi: "Phân tích vấn đề phức tạp trong kiểm toán thực tế"
    ms: "Menganalisis isu kompleks dalam situasi audit sebenar"
    id: "Menganalisis masalah kompleks dalam audit nyata"
    hi: "वास्तविक ऑडिट स्थितियों के जटिल मुद्दों का विश्लेषण"
