code: ABPL90035
year: 2027
learn:
  en: "Finding, analysing and managing risk in construction projects and firms, using real industry cases."
  zh: "识别、分析和管理建筑项目与企业中的风险，结合真实行业案例。"
  zh-TW: "辨識、分析和管理營建專案與企業中的風險，搭配真實產業案例。"
  ja: "実際の業界事例を使い、建設プロジェクトと企業のリスクを見つけ、分析し、管理する。"
  ko: "실제 업계 사례로 건설 프로젝트와 기업의 위험을 찾고 분석하고 관리하기."
  vi: "Nhận diện, phân tích và quản lý rủi ro trong dự án và doanh nghiệp xây dựng qua ví dụ thực tế."
  ms: "Mengenal pasti, menganalisis dan mengurus risiko dalam projek dan syarikat pembinaan melalui kes industri sebenar."
  id: "Mengenali, menganalisis, dan mengelola risiko di proyek dan perusahaan konstruksi lewat kasus industri nyata."
  hi: "असली उद्योग उदाहरणों से निर्माण परियोजनाओं और कंपनियों में जोखिम पहचानना, विश्लेषण और प्रबंधन।"
outcomes:
  - en: "Explain where construction risk comes from and its impact"
    zh: "解释建筑风险的来源和影响"
    zh-TW: "解釋營建風險的來源與影響"
    ja: "建設リスクの原因と影響を説明する"
    ko: "건설 위험의 원인과 영향 설명하기"
    vi: "Giải thích nguồn gốc và tác động của rủi ro xây dựng"
    ms: "Menerangkan punca dan kesan risiko pembinaan"
    id: "Menjelaskan sumber dan dampak risiko konstruksi"
    hi: "निर्माण जोखिम के स्रोत और प्रभाव समझाना"
  - en: "Analyse risk with qualitative and quantitative methods"
    zh: "用定性和定量方法分析风险"
    zh-TW: "用質性與量化方法分析風險"
    ja: "定性・定量の手法でリスクを分析する"
    ko: "정성·정량 방법으로 위험 분석하기"
    vi: "Phân tích rủi ro bằng phương pháp định tính và định lượng"
    ms: "Menganalisis risiko dengan kaedah kualitatif dan kuantitatif"
    id: "Menganalisis risiko dengan metode kualitatif dan kuantitatif"
    hi: "गुणात्मक और मात्रात्मक तरीकों से जोखिम विश्लेषण"
  - en: "Propose risk strategies at site and company level"
    zh: "提出工地和公司层面的风险应对策略"
    zh-TW: "提出工地與公司層面的風險因應策略"
    ja: "現場と企業レベルのリスク対策を提案する"
    ko: "현장과 회사 차원의 위험 대응 전략 제안하기"
    vi: "Đề xuất chiến lược rủi ro ở cấp công trường và công ty"
    ms: "Mencadangkan strategi risiko di peringkat tapak dan syarikat"
    id: "Mengusulkan strategi risiko di tingkat lokasi dan perusahaan"
    hi: "साइट और कंपनी स्तर पर जोखिम रणनीतियाँ सुझाना"
