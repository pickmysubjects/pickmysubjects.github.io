code: GDES30008
year: 2026
learn:
  en: "Studio projects in interactive media, from simple websites to public installations, with some coding classes."
  zh: "交互媒体工作室项目，从简单网站到公共装置，并配有编程课。"
  zh-TW: "互動媒體工作室專案，從簡單網站到公共裝置，並搭配程式課。"
  ja: "シンプルなウェブサイトから公共インスタレーションまでのインタラクティブメディア課題。コーディング授業あり。"
  ko: "간단한 웹사이트부터 공공 설치물까지 인터랙티브 미디어 스튜디오 프로젝트. 코딩 수업 포함."
  vi: "Dự án studio về truyền thông tương tác, từ website đơn giản đến sắp đặt công cộng, có học lập trình."
  ms: "Projek studio media interaktif, dari laman web ringkas hingga instalasi awam, dengan kelas pengekodan."
  id: "Proyek studio media interaktif, dari situs web sederhana hingga instalasi publik, ada kelas coding."
  hi: "इंटरैक्टिव मीडिया के स्टूडियो प्रोजेक्ट, साधारण वेबसाइट से सार्वजनिक इंस्टॉलेशन तक, कोडिंग क्लास सहित।"
outcomes:
