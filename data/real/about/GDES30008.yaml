    ko: "간단한 웹사이트 설계·제작하기"
    vi: "Thiết kế và làm website đơn giản"
    ms: "Reka dan bina laman web ringkas"
    id: "Merancang dan membuat situs web sederhana"
    hi: "साधारण वेबसाइट डिज़ाइन करना और बनाना"
  - en: "Prototype an interactive installation"
    zh: "制作交互装置原型"
    zh-TW: "製作互動裝置原型"
    ja: "インタラクティブ展示の試作をする"
    ko: "인터랙티브 설치물 프로토타입 만들기"
