code: GDES30007
year: 2026
learn:
  en: "Making imagery for graphic design: illustration, photography, animation and art direction, building an industry-ready folio."
  zh: "为平面设计制作图像：插画、摄影、动画和艺术指导，逐步完成面向行业的作品集。"
  zh-TW: "為平面設計製作圖像：插畫、攝影、動畫與藝術指導，逐步完成面向業界的作品集。"
  ja: "グラフィックデザインのための画像制作。イラスト、写真、アニメ、アートディレクションで業界向け作品集を作る。"
  ko: "그래픽디자인을 위한 이미지 제작: 일러스트, 사진, 애니메이션, 아트 디렉션으로 업계용 포트폴리오 완성."
  vi: "Tạo hình ảnh cho thiết kế đồ họa: minh họa, nhiếp ảnh, hoạt hình, chỉ đạo nghệ thuật, làm portfolio theo chuẩn ngành."
  ms: "Menghasilkan imej untuk reka bentuk grafik: ilustrasi, fotografi, animasi dan arahan seni, membina folio sedia industri."
  id: "Membuat citra untuk desain grafis: ilustrasi, fotografi, animasi, art direction, menyusun portofolio siap industri."
  hi: "ग्राफ़िक डिज़ाइन के लिए इमेजरी: इलस्ट्रेशन, फ़ोटोग्राफ़ी, एनिमेशन और आर्ट डायरेक्शन, इंडस्ट्री-लायक पोर्टफ़ोलियो।"
outcomes:
  - en: "Compose images for different design uses"
    zh: "为不同设计用途构图"
    zh-TW: "為不同設計用途構圖"
    ja: "用途に応じた画像を構成する"
    ko: "용도에 맞게 이미지 구성하기"
    vi: "Bố cục hình ảnh cho nhiều mục đích thiết kế"
    ms: "Gubah imej untuk pelbagai kegunaan reka bentuk"
    id: "Menyusun gambar untuk berbagai keperluan desain"
    hi: "अलग डिज़ाइन ज़रूरतों के लिए चित्र रचना"
  - en: "Work across drawing, photo and animation"
    zh: "综合运用手绘、摄影和动画"
    zh-TW: "綜合運用手繪、攝影與動畫"
    ja: "手描き・写真・アニメを使い分ける"
    ko: "드로잉·사진·애니메이션 넘나들기"
    vi: "Kết hợp vẽ tay, ảnh chụp và hoạt hình"
    ms: "Guna lukisan, foto dan animasi"
    id: "Memakai gambar tangan, foto, dan animasi"
    hi: "ड्रॉइंग, फ़ोटो और एनिमेशन में काम करना"
  - en: "Build an industry-ready design folio"
    zh: "打造面向行业的作品集"
    zh-TW: "打造面向業界的作品集"
    ja: "業界向けの作品集をつくる"
    ko: "업계 수준의 포트폴리오 만들기"
    vi: "Xây dựng portfolio theo chuẩn ngành"
    ms: "Bina folio reka bentuk sedia industri"
    id: "Menyusun portofolio desain siap industri"
    hi: "इंडस्ट्री-लायक डिज़ाइन पोर्टफ़ोलियो बनाना"
