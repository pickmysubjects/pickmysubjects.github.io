code: MAST30026
year: 2026
learn:
  en: "Distance, convergence and continuity in general spaces, including infinite-dimensional Hilbert spaces."
  zh: "一般空间里的距离、收敛和连续，包括无穷维的希尔伯特空间。"
  zh-TW: "一般空間裡的距離、收斂和連續，包括無窮維的希爾伯特空間。"
  ja: "一般の空間での距離・収束・連続性。無限次元ヒルベルト空間も含む。"
  ko: "일반 공간에서의 거리, 수렴, 연속성. 무한차원 힐베르트 공간 포함."
  vi: "Khoảng cách, hội tụ và liên tục trong không gian tổng quát, kể cả không gian Hilbert vô hạn chiều."
  ms: "Jarak, penumpuan dan keselanjaran dalam ruang am, termasuk ruang Hilbert berdimensi tak terhingga."
  id: "Jarak, konvergensi, dan kontinuitas di ruang umum, termasuk ruang Hilbert berdimensi tak hingga."
  hi: "सामान्य स्पेस में दूरी, अभिसरण और सांतत्य, अनंत-आयामी हिल्बर्ट स्पेस सहित।"
outcomes:
  - en: "Prove standard results about metric spaces"
    zh: "证明度量空间的基本结论"
    zh-TW: "證明度量空間的基本結論"
    ja: "距離空間の標準的な結果を証明する"
    ko: "거리공간의 표준 결과 증명하기"
    vi: "Chứng minh các kết quả cơ bản về không gian metric"
    ms: "Membuktikan hasil standard tentang ruang metrik"
    id: "Membuktikan hasil standar tentang ruang metrik"
    hi: "मेट्रिक स्पेस के मानक परिणाम सिद्ध करना"
  - en: "Analyse linear maps between Hilbert spaces"
    zh: "分析希尔伯特空间之间的线性映射"
    zh-TW: "分析希爾伯特空間之間的線性映射"
    ja: "ヒルベルト空間の間の線形写像を分析する"
    ko: "힐베르트 공간 사이의 선형사상 분석하기"
    vi: "Phân tích ánh xạ tuyến tính giữa các không gian Hilbert"
    ms: "Menganalisis pemetaan linear antara ruang Hilbert"
    id: "Menganalisis pemetaan linear antar ruang Hilbert"
    hi: "हिल्बर्ट स्पेस के बीच रैखिक मैप का विश्लेषण"
  - en: "Apply the theory to differential equations"
    zh: "把理论用到微分方程上"
    zh-TW: "把理論用到微分方程上"
    ja: "理論を微分方程式に応用する"
    ko: "이론을 미분방정식에 적용하기"
    vi: "Áp dụng lý thuyết vào phương trình vi phân"
    ms: "Menggunakan teori pada persamaan pembezaan"
    id: "Menerapkan teori pada persamaan diferensial"
    hi: "सिद्धांत को अवकल समीकरणों पर लागू करना"
