code: MUSI20207
year: 2026
learn:
  en: "Aural skills, second step: sing and read melodies, rhythms and bass lines, and hear harmony in context. You pick what to focus on."
  zh: "视唱练耳第二阶段：视唱旋律、节奏与低音线，在语境中听辨和声，可自选重点。"
  zh-TW: "視唱練耳第二階段：視唱旋律、節奏與低音線，在語境中聽辨和聲，可自選重點。"
  ja: "聴音・ソルフェージュ第2段階：旋律・リズム・バスを歌い読み、文脈で和声を聴く。"
  ko: "청음·시창 2단계: 선율·리듬·베이스 시창, 맥락 속 화성 듣기. 중점 선택."
  vi: "Luyện tai bước hai: hát và đọc giai điệu, nhịp, bè trầm, nghe hòa âm trong ngữ cảnh."
  ms: "Kemahiran aural tahap dua: nyanyi dan baca melodi, ritma, garis bes, dengar harmoni."
  id: "Keterampilan aural tahap dua: menyanyi dan membaca melodi, ritme, bas, mendengar harmoni."
  hi: "ऑरल कौशल दूसरा चरण: धुन, लय, बास लाइन गाना-पढ़ना और हार्मनी पहचानना।"
outcomes:
  - en: "Sight-sing melodies and bass lines with solfège"
    zh: "用唱名视唱旋律与低音线"
    zh-TW: "用唱名視唱旋律與低音線"
    ja: "階名で旋律やバスを初見で歌う"
    ko: "계이름으로 선율·베이스 시창하기"
    vi: "Xướng âm giai điệu và bè trầm"
    ms: "Nyanyi pandang melodi dan garis bes dengan solfa"
    id: "Menyanyikan melodi dan bas dengan solmisasi"
    hi: "सोलफ़ेज से धुन और बास लाइन गाना"
  - en: "Transcribe melodies, rhythms and chord progressions"
    zh: "记写旋律、节奏与和弦进行"
    zh-TW: "記寫旋律、節奏與和弦進行"
    ja: "旋律・リズム・和音進行を書き取る"
    ko: "선율·리듬·화성 진행 받아쓰기"
    vi: "Ghi lại giai điệu, nhịp và vòng hợp âm"
    ms: "Transkripsi melodi, ritma dan progresi kord"
    id: "Mentranskripsi melodi, ritme, dan progresi akor"
    hi: "धुन, लय और कॉर्ड प्रोग्रेशन लिखना"
  - en: "Hear how harmony works across a whole piece"
    zh: "听懂整首作品的和声结构"
    zh-TW: "聽懂整首作品的和聲結構"
    ja: "曲全体の和声構造を聴き取る"
    ko: "곡 전체의 화성 구조 듣기"
    vi: "Nghe cấu trúc hòa âm của cả bản nhạc"
    ms: "Dengar struktur harmoni sepanjang karya"
    id: "Mendengar struktur harmoni sepanjang karya"
    hi: "पूरी रचना में हार्मनी का ढाँचा सुनना"
