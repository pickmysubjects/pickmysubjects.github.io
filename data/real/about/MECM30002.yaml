code: MECM30002
year: 2026
learn:
  en: "How media works across cultures and regions, covering ownership, global versus local, identity and the politics of representation."
  zh: "媒体在不同文化和地区如何运作，涉及所有权、全球与本地的关系、身份认同和再现政治。"
  zh-TW: "媒體在不同文化和地區如何運作，涉及所有權、全球與在地的關係、身分認同和再現政治。"
  ja: "文化や地域を越えてメディアがどう働くかを、所有、グローバルとローカル、アイデンティティ、表象の政治から考える。"
  ko: "문화와 지역을 넘나드는 미디어의 작동을 소유 구조, 글로벌과 로컬, 정체성, 재현의 정치로 살펴본다."
  vi: "Truyền thông vận hành thế nào qua các nền văn hóa và khu vực, gồm quyền sở hữu, toàn cầu và địa phương, bản sắc và chính trị của sự khắc họa."
  ms: "Bagaimana media berfungsi merentas budaya dan rantau, meliputi pemilikan, global lawan tempatan, identiti dan politik representasi."
  id: "Bagaimana media bekerja lintas budaya dan wilayah, mencakup kepemilikan, global versus lokal, identitas, dan politik representasi."
  hi: "अलग-अलग संस्कृतियों और क्षेत्रों में मीडिया कैसे काम करता है: स्वामित्व, वैश्विक बनाम स्थानीय, पहचान और प्रतिनिधित्व की राजनीति।"
outcomes:
  - en: "Compare media cultures in different world regions"
    zh: "比较世界不同地区的媒体文化"
    zh-TW: "比較世界不同地區的媒體文化"
    ja: "世界の地域ごとのメディア文化を比べる"
    ko: "세계 여러 지역의 미디어 문화 비교하기"
    vi: "So sánh văn hóa truyền thông ở các khu vực trên thế giới"
    ms: "Bandingkan budaya media di rantau dunia berbeza"
    id: "Membandingkan budaya media di berbagai kawasan dunia"
    hi: "दुनिया के अलग क्षेत्रों की मीडिया संस्कृतियों की तुलना करना"
  - en: "Explain how global and local media interact"
    zh: "说明全球媒体与本地媒体如何互动"
    zh-TW: "說明全球媒體與在地媒體如何互動"
    ja: "グローバルとローカルのメディアの関わりを説明する"
    ko: "글로벌 미디어와 로컬 미디어의 상호작용 설명하기"
    vi: "Giải thích truyền thông toàn cầu và địa phương tương tác ra sao"
    ms: "Terangkan interaksi media global dan tempatan"
    id: "Menjelaskan interaksi media global dan lokal"
    hi: "समझाना कि वैश्विक और स्थानीय मीडिया कैसे आपस में जुड़ते हैं"
  - en: "Analyse questions of identity and representation"
    zh: "分析身份认同和再现问题"
    zh-TW: "分析身分認同和再現問題"
    ja: "アイデンティティと表象の問題を分析する"
    ko: "정체성과 재현의 문제 분석하기"
    vi: "Phân tích các vấn đề về bản sắc và sự khắc họa"
    ms: "Analisis isu identiti dan representasi"
    id: "Menganalisis isu identitas dan representasi"
    hi: "पहचान और प्रतिनिधित्व से जुड़े सवालों का विश्लेषण करना"
