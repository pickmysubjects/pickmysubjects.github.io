code: BTCH30002
year: 2026
learn:
  en: "New biotech in farming and food, how it gets to market, and the social and economic issues it raises."
  zh: "农业和食品领域的新生物技术、商业化过程和社会经济问题。"
  zh-TW: "農業和食品領域的新生物技術、商業化過程和社會經濟問題。"
  ja: "農業・食品の新しいバイオテク、その市場化、社会的・経済的な課題。"
  ko: "농업·식품 분야의 새 생명공학, 시장 진출 과정, 사회·경제적 쟁점."
  vi: "Công nghệ sinh học mới trong nông nghiệp, thực phẩm, cách ra thị trường và các vấn đề kinh tế xã hội."
  ms: "Biotek baharu dalam pertanian dan makanan, cara ia ke pasaran, serta isu sosial dan ekonominya."
  id: "Bioteknologi baru di pertanian dan pangan, jalannya ke pasar, serta isu sosial dan ekonominya."
  hi: "खेती और खाने में नई बायोटेक, यह मार्केट तक कैसे पहुँचती है, और इससे उठने वाले सामाजिक-आर्थिक मुद्दे।"
outcomes:
  - en: "Explain how agri-food biotech reaches the market"
    zh: "说明农业生物技术怎样商业化"
    zh-TW: "說明農業生物技術如何商業化"
    ja: "農業・食品バイオテクが市場に出るまでを説明する"
    ko: "농식품 생명공학이 시장에 나오는 과정 설명하기"
    vi: "Giải thích công nghệ sinh học nông sản ra thị trường ra sao"
    ms: "Terangkan cara biotek agro-makanan sampai ke pasaran"
    id: "Menjelaskan cara bioteknologi agri-pangan masuk pasar"
    hi: "समझाना कि एग्री-फ़ूड बायोटेक मार्केट तक कैसे पहुँचती है"
  - en: "Discuss solutions for a sustainable food supply"
    zh: "讨论可持续粮食供应的方案"
    zh-TW: "討論永續糧食供應的方案"
    ja: "持続可能な食料供給の解決策を議論する"
    ko: "지속 가능한 식량 공급 방안 논의하기"
    vi: "Thảo luận giải pháp cho nguồn lương thực bền vững"
    ms: "Bincang penyelesaian bekalan makanan mampan"
    id: "Membahas solusi pasokan pangan berkelanjutan"
    hi: "टिकाऊ खाद्य आपूर्ति के उपायों पर चर्चा"
  - en: "Argue a position in group discussion"
    zh: "在小组讨论中论证观点"
    zh-TW: "在小組討論中論證觀點"
    ja: "グループ討論で自分の立場を主張する"
    ko: "그룹 토론에서 입장 논증하기"
    vi: "Lập luận cho quan điểm khi thảo luận nhóm"
    ms: "Pertahankan pendirian dalam perbincangan kumpulan"
    id: "Mempertahankan pendapat dalam diskusi kelompok"
    hi: "ग्रुप डिस्कशन में अपनी बात तर्क से रखना"
