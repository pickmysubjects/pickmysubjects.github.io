code: ARCH20002
year: 2026
learn:
  en: "Architecture studio on dense city living: design housing with green infrastructure on an inner Melbourne site."
  zh: "关于高密度城市居住的建筑工作室：在墨尔本市区场地设计含绿色基础设施的住宅。"
  zh-TW: "關於高密度城市居住的建築工作室：在墨爾本市區基地設計含綠色基礎設施的住宅。"
  ja: "高密度都市居住がテーマの建築スタジオ：メルボルン中心部で緑のインフラを含む住宅を設計。"
  ko: "고밀도 도시 주거 건축 스튜디오: 멜버른 도심 부지에 녹색 인프라를 갖춘 주거 설계."
  vi: "Studio kiến trúc về sống đô thị mật độ cao: thiết kế nhà ở có hạ tầng xanh ở nội đô Melbourne."
  ms: "Studio seni bina tentang kediaman bandar padat: reka perumahan dengan infrastruktur hijau di tapak Melbourne."
  id: "Studio arsitektur hunian kota padat: merancang perumahan dengan infrastruktur hijau di pusat Melbourne."
  hi: "घने शहरी जीवन पर आर्किटेक्चर स्टूडियो: मेलबर्न के अंदरूनी इलाक़े में हरित ढाँचे वाला आवास डिज़ाइन।"
outcomes:
  - en: "Design dwellings for a dense urban site"
    zh: "为高密度城市场地设计住宅"
    zh-TW: "為高密度都市基地設計住宅"
    ja: "高密度な都市敷地に住まいを設計する"
    ko: "고밀도 도시 부지에 주거 설계하기"
    vi: "Thiết kế nhà ở cho khu đất đô thị dày đặc"
    ms: "Reka kediaman untuk tapak bandar padat"
    id: "Merancang hunian untuk tapak kota padat"
    hi: "घनी शहरी साइट के लिए आवास डिज़ाइन करना"
  - en: "Bring plants and living systems into a building"
    zh: "把植物与生态系统引入建筑"
    zh-TW: "把植物與生態系統引入建築"
    ja: "植物や生態系を建物に取り込む"
    ko: "식물과 생태계를 건물에 들이기"
    vi: "Đưa cây xanh và hệ sinh thái vào công trình"
    ms: "Bawa tumbuhan dan sistem hidup ke dalam bangunan"
    id: "Memasukkan tanaman dan sistem hidup ke bangunan"
    hi: "इमारत में पौधे और जीवित तंत्र लाना"
  - en: "Communicate a housing proposal clearly"
    zh: "清楚表达住宅方案"
    zh-TW: "清楚表達住宅方案"
    ja: "住宅案を分かりやすく伝える"
    ko: "주거 제안을 명확히 전달하기"
    vi: "Trình bày rõ ràng phương án nhà ở"
    ms: "Sampaikan cadangan perumahan dengan jelas"
    id: "Menyampaikan usulan hunian dengan jelas"
    hi: "आवास प्रस्ताव साफ़ तरीक़े से पेश करना"
