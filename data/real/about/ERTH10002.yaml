code: ERTH10002
year: 2026
learn:
  en: "How Earth formed and changed over 4.6 billion years: rocks, fossils, volcanoes and past climates, plus a field trip."
  zh: "地球46亿年的形成与演变：岩石、化石、火山和古气候，含野外考察。"
  zh-TW: "地球46億年的形成與演變：岩石、化石、火山和古氣候，含野外考察。"
  ja: "46億年の地球の形成と変化：岩石・化石・火山・過去の気候、野外実習つき。"
  ko: "46억 년 지구의 형성과 변화: 암석·화석·화산·과거 기후, 야외 답사 포함."
  vi: "Trái Đất hình thành và thay đổi qua 4.6 tỷ năm: đá, hóa thạch, núi lửa, khí hậu cổ, kèm thực địa."
  ms: "Bagaimana Bumi terbentuk dan berubah selama 4.6 bilion tahun: batuan, fosil, gunung berapi, iklim lampau, serta lawatan lapangan."
  id: "Bagaimana Bumi terbentuk dan berubah selama 4.6 miliar tahun: batuan, fosil, gunung api, iklim purba, plus kunjungan lapangan."
  hi: "4.6 अरब वर्षों में पृथ्वी कैसे बनी और बदली: चट्टानें, जीवाश्म, ज्वालामुखी, पुरानी जलवायु, फ़ील्ड ट्रिप सहित।"
outcomes:
  - en: "Identify minerals, rocks and fossils"
    zh: "识别矿物、岩石和化石"
    zh-TW: "辨識礦物、岩石和化石"
    ja: "鉱物・岩石・化石を見分ける"
    ko: "광물·암석·화석을 식별한다"
    vi: "Nhận biết khoáng vật, đá và hóa thạch"
    ms: "Kenal pasti mineral, batuan dan fosil"
    id: "Mengenali mineral, batuan, dan fosil"
    hi: "खनिज, चट्टानें और जीवाश्म पहचानना"
  - en: "Collect data in the field and lab"
    zh: "在野外和实验室采集数据"
    zh-TW: "在野外和實驗室採集數據"
    ja: "野外と実験室でデータを集める"
    ko: "야외와 실험실에서 데이터를 수집한다"
    vi: "Thu thập dữ liệu ngoài thực địa và phòng thí nghiệm"
    ms: "Kumpul data di lapangan dan makmal"
    id: "Mengumpulkan data di lapangan dan laboratorium"
    hi: "फ़ील्ड और लैब में डेटा जुटाना"
