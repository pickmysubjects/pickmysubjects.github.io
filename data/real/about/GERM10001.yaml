code: GERM10001
year: 2026
learn:
  en: "Building your German through real films, songs, books and media on one theme: gender in German-speaking societies."
  zh: "通过真实的电影、歌曲、书籍和媒体提升德语，主题是德语社会中的性别。"
  zh-TW: "透過真實的電影、歌曲、書籍和媒體提升德語，主題是德語社會中的性別。"
  ja: "本物の映画・歌・本・メディアでドイツ語を伸ばす。テーマはドイツ語圏社会のジェンダー。"
  ko: "실제 영화·노래·책·미디어로 독일어를 키운다. 주제는 독일어권 사회의 젠더."
  vi: "Nâng tiếng Đức qua phim, bài hát, sách và truyền thông thật về một chủ đề: giới trong xã hội nói tiếng Đức."
  ms: "Membina bahasa Jerman melalui filem, lagu, buku dan media sebenar bertema gender dalam masyarakat berbahasa Jerman."
  id: "Mengembangkan bahasa Jerman lewat film, lagu, buku dan media asli bertema gender di masyarakat berbahasa Jerman."
  hi: "असली फ़िल्मों, गीतों, किताबों और मीडिया से जर्मन बढ़ाना; विषय: जर्मन-भाषी समाजों में जेंडर।"
outcomes:
  - en: "Talk about familiar topics in German with more confidence"
    zh: "更自信地用德语谈论熟悉的话题"
    zh-TW: "更自信地用德語談論熟悉的話題"
    ja: "身近な話題をドイツ語でより自信を持って話す"
    ko: "익숙한 주제를 독일어로 더 자신 있게 말하기"
    vi: "Nói về chủ đề quen thuộc bằng tiếng Đức tự tin hơn"
    ms: "Bercakap tentang topik biasa dalam bahasa Jerman dengan lebih yakin"
    id: "Membicarakan topik akrab dalam bahasa Jerman dengan lebih percaya diri"
    hi: "परिचित विषयों पर जर्मन में ज़्यादा आत्मविश्वास से बात करना"
  - en: "Read and write short German texts"
    zh: "读写简短的德语文章"
    zh-TW: "讀寫簡短的德語文章"
    ja: "短いドイツ語の文章を読み書きする"
    ko: "짧은 독일어 글 읽고 쓰기"
    vi: "Đọc và viết đoạn văn tiếng Đức ngắn"
    ms: "Baca dan tulis teks pendek bahasa Jerman"
    id: "Membaca dan menulis teks pendek bahasa Jerman"
    hi: "छोटे जर्मन पाठ पढ़ना-लिखना"
  - en: "Use new grammar and vocabulary correctly"
    zh: "正确运用新语法和词汇"
    zh-TW: "正確運用新文法和詞彙"
    ja: "新しい文法と語彙を正しく使う"
    ko: "새 문법과 어휘를 정확히 쓰기"
    vi: "Dùng đúng ngữ pháp và từ vựng mới"
    ms: "Guna tatabahasa dan kosa kata baharu dengan betul"
    id: "Memakai tata bahasa dan kosakata baru dengan benar"
    hi: "नया व्याकरण और शब्दावली सही इस्तेमाल करना"
