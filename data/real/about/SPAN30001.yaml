code: SPAN30001
year: 2026
learn:
  en: "Gender and sexuality in Spain and Latin America through books, film and TV: gender violence, marriage equality, new masculinities."
  zh: "通过书籍、电影和电视看西班牙与拉丁美洲的性别与性：性别暴力、婚姻平权、新男性气质。"
  zh-TW: "透過書籍、電影和電視看西班牙與拉丁美洲的性別與性：性別暴力、婚姻平權、新男性氣質。"
  ja: "本、映画、テレビから見るスペインと中南米のジェンダーとセクシュアリティ。ジェンダー暴力、婚姻の平等、新しい男性性。"
  ko: "책, 영화, TV로 보는 스페인과 라틴아메리카의 젠더와 섹슈얼리티. 젠더 폭력, 혼인 평등, 새로운 남성성."
  vi: "Giới và tính dục ở Tây Ban Nha, Mỹ Latinh qua sách, phim, TV: bạo lực giới, hôn nhân bình đẳng, nam tính mới."
  ms: "Gender dan seksualiti di Sepanyol dan Amerika Latin melalui buku, filem dan TV: keganasan gender, kesaksamaan perkahwinan, kelelakian baharu."
  id: "Gender dan seksualitas di Spanyol dan Amerika Latin lewat buku, film dan TV: kekerasan gender, kesetaraan pernikahan, maskulinitas baru."
  hi: "किताबों, फ़िल्म और टीवी से स्पेन व लातिन अमेरिका में जेंडर और कामुकता: जेंडर हिंसा, विवाह समानता, नई मर्दानगी।"
outcomes:
  - en: "Analyse gender in Hispanic books and film"
    zh: "分析西语书籍和电影中的性别"
    zh-TW: "分析西語書籍和電影中的性別"
    ja: "スペイン語圏の本と映画のジェンダーを分析する"
    ko: "스페인어권 책과 영화 속 젠더 분석하기"
    vi: "Phân tích vấn đề giới trong sách, phim tiếng Tây Ban Nha"
    ms: "Analisis gender dalam buku dan filem Hispanik"
    id: "Menganalisis gender dalam buku dan film Hispanik"
    hi: "हिस्पैनिक किताबों और फ़िल्मों में जेंडर का विश्लेषण करना"
  - en: "Explain recent gender laws and debates"
    zh: "说明近年的性别相关法律与争论"
    zh-TW: "說明近年的性別相關法律與爭論"
    ja: "近年のジェンダーをめぐる法と論争を説明する"
    ko: "최근의 젠더 관련 법과 논쟁 설명하기"
    vi: "Giải thích các luật và tranh luận gần đây về giới"
    ms: "Terangkan undang-undang dan perdebatan gender terkini"
    id: "Menjelaskan aturan dan debat gender terkini"
    hi: "हाल के जेंडर क़ानूनों और बहसों को समझाना"
  - en: "Discuss sexism in language"
    zh: "讨论语言中的性别歧视"
    zh-TW: "討論語言中的性別歧視"
    ja: "言葉に潜む性差別を議論する"
    ko: "언어 속 성차별 토론하기"
    vi: "Thảo luận sự phân biệt giới trong ngôn ngữ"
    ms: "Bincangkan seksisme dalam bahasa"
    id: "Membahas seksisme dalam bahasa"
    hi: "भाषा में लैंगिक भेदभाव पर चर्चा करना"
