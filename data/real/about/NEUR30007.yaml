code: NEUR30007
year: 2026
learn:
  en: "How the ear and brain handle hearing and balance, and new treatments like cochlear implants."
  zh: "耳朵和大脑怎么负责听觉和平衡，以及人工耳蜗等新疗法。"
  zh-TW: "耳朵和大腦怎麼負責聽覺和平衡，以及人工電子耳等新療法。"
  ja: "耳と脳が聴覚と平衡感覚を担う仕組みと、人工内耳などの新しい治療。"
  ko: "귀와 뇌가 청각과 균형을 담당하는 방식, 그리고 인공와우 같은 새 치료법."
  vi: "Tai và não xử lý thính giác, thăng bằng ra sao, và các cách chữa mới như ốc tai điện tử."
  ms: "Cara telinga dan otak mengendalikan pendengaran dan keseimbangan, serta rawatan baharu seperti implan koklea."
  id: "Cara telinga dan otak mengatur pendengaran dan keseimbangan, serta terapi baru seperti implan koklea."
  hi: "कान और दिमाग सुनने व संतुलन को कैसे संभालते हैं, और कॉक्लियर इम्प्लांट जैसे नए इलाज।"
outcomes:
  - en: "Describe the structure of the ear and hearing pathways"
    zh: "描述耳朵和听觉通路的结构"
    zh-TW: "描述耳朵和聽覺通路的結構"
    ja: "耳と聴覚経路の構造を説明する"
    ko: "귀와 청각 경로의 구조 설명하기"
    vi: "Mô tả cấu trúc tai và đường dẫn thính giác"
    ms: "Menghuraikan struktur telinga dan laluan pendengaran"
    id: "Menjelaskan struktur telinga dan jalur pendengaran"
    hi: "कान और सुनने के मार्गों की बनावट बताना"
  - en: "Explain how hearing and balance work"
    zh: "解释听觉和平衡的原理"
    zh-TW: "解釋聽覺和平衡的原理"
    ja: "聴覚と平衡感覚の仕組みを説明する"
    ko: "청각과 균형의 원리 설명하기"
    vi: "Giải thích thính giác và thăng bằng hoạt động ra sao"
    ms: "Menerangkan cara pendengaran dan keseimbangan berfungsi"
    id: "Menjelaskan cara kerja pendengaran dan keseimbangan"
    hi: "सुनना और संतुलन कैसे काम करते हैं"
  - en: "Explain the basis of cochlear implants and gene therapy"
    zh: "解释人工耳蜗和基因疗法的原理"
    zh-TW: "解釋人工電子耳和基因療法的原理"
    ja: "人工内耳と遺伝子治療の基本を説明する"
    ko: "인공와우와 유전자 치료의 원리 설명하기"
    vi: "Giải thích nguyên lý ốc tai điện tử và liệu pháp gen"
    ms: "Menerangkan asas implan koklea dan terapi gen"
    id: "Menjelaskan dasar implan koklea dan terapi gen"
    hi: "कॉक्लियर इम्प्लांट और जीन थेरेपी का आधार समझाना"
