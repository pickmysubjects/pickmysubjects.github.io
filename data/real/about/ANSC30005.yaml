code: ANSC30005
year: 2026
learn:
  en: "How animals cope with stress and change, how to measure their welfare, and the ethics of using animals."
  zh: "动物如何应对压力与变化、如何评估福利，以及利用动物的伦理。"
  zh-TW: "動物如何因應壓力與變化、如何評估福利，以及利用動物的倫理。"
  ja: "動物のストレスへの対処、福祉の測り方、動物利用の倫理。"
  ko: "동물의 스트레스 대처, 복지 평가 방법, 동물 이용의 윤리."
  vi: "Động vật đối phó căng thẳng ra sao, cách đo phúc lợi và đạo đức khi sử dụng động vật."
  ms: "Cara haiwan menangani tekanan, cara menilai kebajikan dan etika penggunaan haiwan."
  id: "Cara hewan menghadapi stres, cara menilai kesejahteraan, dan etika pemanfaatan hewan."
  hi: "जानवर तनाव से कैसे निपटते हैं, उनके कल्याण का आकलन और पशु उपयोग की नैतिकता।"
outcomes:
  - en: "Assess animal welfare with scientific methods"
    zh: "用科学方法评估动物福利"
    zh-TW: "用科學方法評估動物福利"
    ja: "科学的手法で動物福祉を評価する"
    ko: "과학적 방법으로 동물 복지 평가하기"
    vi: "Đánh giá phúc lợi động vật bằng khoa học"
    ms: "Nilai kebajikan haiwan secara saintifik"
    id: "Menilai kesejahteraan hewan secara ilmiah"
    hi: "वैज्ञानिक तरीक़ों से पशु कल्याण आँकना"
  - en: "Discuss ethical issues in animal use"
    zh: "讨论动物利用中的伦理问题"
    zh-TW: "討論動物利用中的倫理問題"
    ja: "動物利用の倫理的問題を論じる"
    ko: "동물 이용의 윤리 문제 논의하기"
    vi: "Thảo luận vấn đề đạo đức khi dùng động vật"
    ms: "Bincang isu etika penggunaan haiwan"
    id: "Membahas masalah etika pemanfaatan hewan"
    hi: "पशु उपयोग के नैतिक मुद्दों पर चर्चा करना"
