code: MUSI20235
year: 2026
learn:
  en: "Builds on Introduction to Improvisation with jazz: soloing over chord changes, writing and playing a solo on a jazz standard."
  zh: "接续即兴入门，进入爵士：在和弦进行上独奏，为爵士标准曲写并演奏独奏。"
  zh-TW: "接續即興入門，進入爵士：在和弦進行上獨奏，為爵士標準曲寫並演奏獨奏。"
  ja: "即興入門の続き。ジャズのコード進行でソロをとり、スタンダードのソロを書いて演奏。"
  ko: "즉흥 입문의 후속. 재즈 코드 진행 위 솔로, 스탠더드곡 솔로 작곡·연주."
  vi: "Tiếp nối nhập môn ngẫu hứng với jazz: solo trên vòng hợp âm, viết và chơi solo cho bản standard."
  ms: "Lanjutan improvisasi dengan jaz: solo atas progresi kord, tulis dan main solo lagu standard."
  id: "Lanjutan improvisasi lewat jazz: solo di atas progresi akor, menulis dan memainkan solo standar."
  hi: "इम्प्रोवाइज़ेशन से आगे जैज़: कॉर्ड बदलावों पर सोलो, जैज़ स्टैंडर्ड पर सोलो लिखना-बजाना।"
outcomes:
  - en: "Solo over chord progressions with accompaniment"
    zh: "在伴奏和弦进行上独奏"
    zh-TW: "在伴奏和弦進行上獨奏"
    ja: "伴奏のコード進行上でソロをとる"
    ko: "반주 코드 진행 위에서 솔로하기"
    vi: "Solo trên vòng hợp âm có đệm"
    ms: "Solo atas progresi kord dengan iringan"
    id: "Bersolo di atas progresi akor dengan iringan"
    hi: "संगत के साथ कॉर्ड प्रोग्रेशन पर सोलो"
  - en: "Compose and notate a solo on a jazz standard"
    zh: "为爵士标准曲创作并记谱独奏"
    zh-TW: "為爵士標準曲創作並記譜獨奏"
    ja: "スタンダード曲のソロを作曲し記譜する"
    ko: "재즈 스탠더드 솔로 작곡·기보하기"
    vi: "Sáng tác và ký âm solo cho bản jazz standard"
    ms: "Gubah dan catat solo lagu jaz standard"
    id: "Menggubah dan menotasikan solo standar jazz"
    hi: "जैज़ स्टैंडर्ड पर सोलो रचकर लिखना"
  - en: "Show jazz theory knowledge in a quiz"
    zh: "在测验中展示爵士乐理知识"
    zh-TW: "在測驗中展示爵士樂理知識"
    ja: "小テストでジャズ理論を示す"
    ko: "퀴즈로 재즈 이론 보여주기"
    vi: "Thể hiện lý thuyết jazz trong bài quiz"
    ms: "Tunjukkan pengetahuan teori jaz dalam kuiz"
    id: "Menunjukkan teori jazz dalam kuis"
    hi: "क्विज़ में जैज़ सिद्धांत दिखाना"
