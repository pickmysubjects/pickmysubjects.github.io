code: RUSS30005
year: 2026
learn:
  en: "Russian and Soviet cinema from the 1920s to today and what it shows about social change, taught and assessed in Russian."
  zh: "从 1920 年代至今的俄罗斯与苏联电影，以及其中反映的社会变迁，用俄语授课和考核。"
  zh-TW: "從 1920 年代至今的俄羅斯與蘇聯電影，以及其中反映的社會變遷，用俄語授課和考核。"
  ja: "1920年代から現在までのロシア・ソ連映画と、そこに映る社会の変化。授業も評価もロシア語。"
  ko: "1920년대부터 오늘까지의 러시아·소련 영화와 그 속의 사회 변화. 러시아어로 수업하고 평가한다."
  vi: "Điện ảnh Nga và Xô Viết từ thập niên 1920 đến nay và những thay đổi xã hội nó phản ánh, dạy và đánh giá bằng tiếng Nga."
  ms: "Filem Rusia dan Soviet dari 1920-an hingga kini serta perubahan sosial yang ditunjukkannya, diajar dan dinilai dalam bahasa Rusia."
  id: "Film Rusia dan Soviet dari 1920-an hingga kini serta perubahan sosial yang ditampilkannya, diajar dan dinilai dalam bahasa Rusia."
  hi: "1920 के दशक से आज तक का रूसी और सोवियत सिनेमा और उसमें दिखता सामाजिक बदलाव, रूसी में पढ़ाया और आँका जाता है।"
outcomes:
  - en: "Analyse Russian films in their historical setting"
    zh: "结合历史背景分析俄罗斯电影"
    zh-TW: "結合歷史背景分析俄羅斯電影"
    ja: "歴史的背景の中でロシア映画を分析する"
    ko: "역사적 맥락 속에서 러시아 영화 분석하기"
    vi: "Phân tích phim Nga trong bối cảnh lịch sử"
    ms: "Analisis filem Rusia dalam konteks sejarahnya"
    id: "Menganalisis film Rusia dalam konteks sejarahnya"
    hi: "रूसी फ़िल्मों का उनके ऐतिहासिक संदर्भ में विश्लेषण करना"
  - en: "Use critical approaches to film"
    zh: "运用电影批评的方法"
    zh-TW: "運用電影批評的方法"
    ja: "映画批評の方法を使う"
    ko: "영화 비평 방법 활용하기"
    vi: "Vận dụng các cách tiếp cận phê bình điện ảnh"
    ms: "Guna pendekatan kritis terhadap filem"
    id: "Memakai pendekatan kritis terhadap film"
    hi: "फ़िल्म आलोचना के तरीक़े अपनाना"
  - en: "Present film analysis in spoken and written Russian"
    zh: "用俄语口头和书面呈现电影分析"
    zh-TW: "用俄語口頭和書面呈現電影分析"
    ja: "映画分析をロシア語で口頭と文章で発表する"
    ko: "영화 분석을 러시아어로 말하고 쓰기"
    vi: "Trình bày phân tích phim bằng tiếng Nga nói và viết"
    ms: "Bentangkan analisis filem dalam bahasa Rusia lisan dan bertulis"
    id: "Menyampaikan analisis film dalam bahasa Rusia lisan dan tulisan"
    hi: "रूसी में बोलकर और लिखकर फ़िल्म विश्लेषण प्रस्तुत करना"
