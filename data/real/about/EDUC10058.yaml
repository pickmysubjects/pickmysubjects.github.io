code: EDUC10058
year: 2026
learn:
  en: "Form a small band on guitar, keys, drums or ukulele and perform pop songs, while looking at music in young people's lives."
  zh: "组小乐队用吉他、键盘、鼓或尤克里里演奏流行歌，并探讨音乐对年轻人的意义。"
  zh-TW: "組小樂團用吉他、鍵盤、鼓或烏克麗麗演奏流行歌，並探討音樂對年輕人的意義。"
  ja: "ギター・鍵盤・ドラム・ウクレレで小さなバンドを組み、若者と音楽の関係も考える。"
  ko: "기타·건반·드럼·우쿨렐레로 밴드를 꾸려 팝을 연주하고 청년과 음악의 관계 탐구."
  vi: "Lập ban nhạc nhỏ chơi guitar, phím, trống hay ukulele, biểu diễn nhạc pop và tìm hiểu âm nhạc với giới trẻ."
  ms: "Bentuk band kecil dengan gitar, papan kekunci, dram atau ukulele, dan kaji muzik dalam hidup anak muda."
  id: "Membentuk band kecil dengan gitar, keyboard, drum, atau ukulele, sambil mengkaji musik bagi anak muda."
  hi: "गिटार, कीबोर्ड, ड्रम या यूकुलेले से छोटा बैंड बनाकर पॉप गाने बजाना, और युवाओं के जीवन में संगीत समझना।"
outcomes:
  - en: "Work together in an informal music group"
    zh: "在非正式乐队中合作"
    zh-TW: "在非正式樂團中合作"
    ja: "気軽な音楽グループで協働する"
    ko: "비공식 음악 그룹에서 협업하기"
    vi: "Phối hợp trong một nhóm nhạc không chính thức"
    ms: "Bekerjasama dalam kumpulan muzik tidak formal"
    id: "Bekerja sama dalam grup musik informal"
    hi: "अनौपचारिक संगीत समूह में मिलकर काम करना"
  - en: "Link listening, arranging and performing music"
    zh: "把聆听、编曲和演奏结合起来"
    zh-TW: "把聆聽、編曲和演奏結合起來"
    ja: "聴く・編曲する・演奏するをつなげる"
    ko: "감상·편곡·연주를 연결하기"
    vi: "Kết nối nghe, phối khí và biểu diễn"
    ms: "Kaitkan mendengar, menggubah dan membuat persembahan"
    id: "Menghubungkan mendengar, mengaransemen, dan tampil"
    hi: "सुनना, अरेंज करना और प्रस्तुति को जोड़ना"
  - en: "Use basic recording and music software"
    zh: "使用基础录音和音乐软件"
    zh-TW: "使用基礎錄音與音樂軟體"
    ja: "基本的な録音・音楽ソフトを使う"
    ko: "기본 녹음·음악 소프트웨어 사용하기"
    vi: "Dùng phần mềm thu âm và âm nhạc cơ bản"
    ms: "Guna perisian rakaman dan muzik asas"
    id: "Memakai perangkat lunak rekaman dan musik dasar"
    hi: "बुनियादी रिकॉर्डिंग और संगीत सॉफ़्टवेयर इस्तेमाल करना"
