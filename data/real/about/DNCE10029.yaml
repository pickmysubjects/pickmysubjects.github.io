code: DNCE10029
year: 2026
learn:
  en: "Dance science meets somatic practice: anatomy, movement analysis and safe training so dancers move well and avoid injury."
  zh: "舞蹈科学结合身心练习：解剖、动作分析与安全训练，帮舞者避免受伤。"
  zh-TW: "舞蹈科學結合身心練習：解剖、動作分析與安全訓練，幫舞者避免受傷。"
  ja: "ダンス科学とソマティクスを組み合わせ、解剖学・動作分析・安全な訓練で怪我を防ぐ。"
  ko: "무용 과학과 소매틱 수련: 해부학, 동작 분석, 안전한 훈련으로 부상을 막는다."
  vi: "Kết hợp khoa học múa và thực hành thân-tâm: giải phẫu, phân tích chuyển động, tập luyện an toàn."
  ms: "Sains tarian bertemu amalan somatik: anatomi, analisis gerak dan latihan selamat untuk elak kecederaan."
  id: "Sains tari bertemu praktik somatik: anatomi, analisis gerak dan latihan aman agar tidak cedera."
  hi: "डांस साइंस और सोमैटिक अभ्यास: शरीर-रचना, गति विश्लेषण और सुरक्षित ट्रेनिंग ताकि चोट न लगे।"
outcomes:
  - en: "Use anatomy to explain how a dancer moves"
    zh: "用解剖知识解释舞者的动作"
    zh-TW: "用解剖知識解釋舞者的動作"
    ja: "解剖学で踊り手の動きを説明する"
    ko: "해부학으로 무용수의 움직임 설명하기"
    vi: "Dùng giải phẫu để giải thích chuyển động của vũ công"
    ms: "Guna anatomi untuk jelaskan gerak penari"
    id: "Memakai anatomi untuk menjelaskan gerak penari"
    hi: "शरीर-रचना से डांसर की गति समझाना"
  - en: "Set personal goals for stronger, freer movement"
    zh: "为更好的动作设定个人目标"
    zh-TW: "為更好的動作設定個人目標"
    ja: "より良い動きのために個人目標を立てる"
    ko: "더 나은 움직임을 위한 개인 목표 세우기"
    vi: "Đặt mục tiêu cá nhân để chuyển động tốt hơn"
    ms: "Tetapkan matlamat peribadi untuk gerak lebih baik"
    id: "Menetapkan target pribadi untuk gerak lebih baik"
    hi: "बेहतर गति के लिए निजी लक्ष्य तय करना"
  - en: "Train safely: warm-up, recovery and conditioning"
    zh: "安全训练：热身、恢复与体能"
    zh-TW: "安全訓練：熱身、恢復與體能"
    ja: "安全な訓練：ウォームアップ・回復・コンディショニング"
    ko: "안전한 훈련: 워밍업, 회복, 컨디셔닝"
    vi: "Tập an toàn: khởi động, hồi phục, thể lực"
    ms: "Latihan selamat: memanaskan badan, pemulihan, kecergasan"
    id: "Latihan aman: pemanasan, pemulihan, kebugaran"
    hi: "सुरक्षित ट्रेनिंग: वॉर्म-अप, रिकवरी और कंडीशनिंग"
