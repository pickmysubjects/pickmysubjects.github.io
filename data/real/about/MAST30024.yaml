code: MAST30024
year: 2026
learn:
  en: "Three kinds of geometry: curvature of surfaces, topology of surfaces, and complex algebraic curves."
  zh: "三种几何：曲面曲率、曲面拓扑和复代数曲线"
  zh-TW: "三種幾何：曲面曲率、曲面拓樸和複代數曲線"
  ja: "3つの幾何学：曲面の曲率、曲面のトポロジー、複素代数曲線。"
  ko: "세 가지 기하학: 곡면의 곡률, 곡면의 위상, 복소 대수곡선."
  vi: "Ba loại hình học: độ cong mặt, tô pô mặt và đường cong đại số phức."
  ms: "Tiga jenis geometri: kelengkungan permukaan, topologi permukaan dan lengkung algebra kompleks."
  id: "Tiga jenis geometri: kelengkungan permukaan, topologi permukaan, dan kurva aljabar kompleks."
  hi: "तीन तरह की ज्यामिति: सतहों की वक्रता, सतहों की टोपोलॉजी और सम्मिश्र बीजीय वक्र।"
outcomes:
  - en: "Classify surfaces by Euler characteristic"
    zh: "用欧拉示性数对曲面分类"
    zh-TW: "用歐拉示性數對曲面分類"
    ja: "オイラー標数で曲面を分類する"
    ko: "오일러 지표로 곡면 분류하기"
    vi: "Phân loại mặt theo đặc trưng Euler"
    ms: "Mengelaskan permukaan dengan ciri Euler"
    id: "Mengklasifikasi permukaan dengan karakteristik Euler"
    hi: "यूलर अभिलक्षण से सतहों का वर्गीकरण"
  - en: "Compute Gaussian and mean curvature"
    zh: "计算高斯曲率和平均曲率"
    zh-TW: "計算高斯曲率和平均曲率"
    ja: "ガウス曲率と平均曲率を計算する"
    ko: "가우스 곡률과 평균 곡률 계산하기"
    vi: "Tính độ cong Gauss và độ cong trung bình"
    ms: "Mengira kelengkungan Gauss dan min"
    id: "Menghitung kelengkungan Gauss dan rata-rata"
    hi: "गॉसियन और माध्य वक्रता निकालना"
  - en: "Find the genus of conics and cubics"
    zh: "求圆锥曲线和三次曲线的亏格"
    zh-TW: "求圓錐曲線和三次曲線的虧格"
    ja: "二次・三次曲線の種数を求める"
    ko: "원뿔곡선과 3차곡선의 종수 구하기"
    vi: "Tìm giống của conic và cubic"
    ms: "Mencari genus konik dan kubik"
    id: "Menentukan genus konik dan kubik"
    hi: "शंकु और घन वक्रों का जीनस ज्ञात करना"
