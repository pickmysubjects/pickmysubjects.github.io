code: GEOM90006
year: 2027
learn:
  en: "Statistical and computing techniques for data tied to locations: point patterns, spatial autocorrelation and geostatistics."
  zh: "位置相关数据的统计与计算方法：点模式、空间自相关与地统计。"
  zh-TW: "位置相關資料的統計與計算方法：點型態、空間自相關與地理統計。"
  ja: "位置データの統計・計算手法：点パターン、空間自己相関、地球統計。"
  ko: "위치 데이터의 통계·계산 기법: 점 패턴, 공간 자기상관, 지구통계."
  vi: "Kỹ thuật thống kê, tính toán cho dữ liệu gắn vị trí: mẫu điểm, tự tương quan không gian, địa thống kê."
  ms: "Teknik statistik dan pengkomputeran untuk data berlokasi: corak titik, autokorelasi ruang, geostatistik."
  id: "Teknik statistik dan komputasi untuk data berlokasi: pola titik, autokorelasi spasial, geostatistik."
  hi: "स्थान से जुड़े डेटा की सांख्यिकीय और कंप्यूटिंग तकनीकें: पॉइंट पैटर्न, स्पेशियल ऑटोकोरिलेशन, जियोस्टैटिस्टिक्स।"
outcomes:
  - en: "Analyse point, area and field data"
    zh: "分析点、面和场数据"
    zh-TW: "分析點、面與場資料"
    ja: "点・面・場のデータを分析する"
    ko: "점·면·장 데이터 분석하기"
    vi: "Phân tích dữ liệu điểm, vùng và trường"
    ms: "Analisis data titik, kawasan dan medan"
    id: "Menganalisis data titik, area, dan medan"
    hi: "पॉइंट, एरिया और फ़ील्ड डेटा का विश्लेषण"
  - en: "Find patterns in space and time"
    zh: "发现时空中的规律"
    zh-TW: "發現時空中的規律"
    ja: "時空間のパターンを見つける"
    ko: "시공간 패턴 찾기"
    vi: "Tìm quy luật theo không gian và thời gian"
    ms: "Cari corak dalam ruang dan masa"
    id: "Menemukan pola dalam ruang dan waktu"
    hi: "स्थान और समय में पैटर्न खोजना"
