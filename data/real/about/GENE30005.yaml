code: GENE30005
year: 2026
learn:
  en: "Human genetics and health: genetic disease, cancer, ageing, genetic counselling and the ethics involved."
  zh: "人类遗传与健康：遗传病、癌症、衰老、遗传咨询和伦理问题。"
  zh-TW: "人類遺傳與健康：遺傳疾病、癌症、老化、遺傳諮詢和倫理議題。"
  ja: "ヒトの遺伝と健康：遺伝病、がん、老化、遺伝カウンセリングと倫理。"
  ko: "인간 유전과 건강: 유전 질환, 암, 노화, 유전 상담과 관련 윤리."
  vi: "Di truyền người và sức khỏe: bệnh di truyền, ung thư, lão hóa, tư vấn di truyền và đạo đức."
  ms: "Genetik manusia dan kesihatan: penyakit genetik, kanser, penuaan, kaunseling genetik dan etika."
  id: "Genetika manusia dan kesehatan: penyakit genetik, kanker, penuaan, konseling genetik, dan etikanya."
  hi: "मानव जेनेटिक्स और स्वास्थ्य: आनुवंशिक रोग, कैंसर, बुढ़ापा, जेनेटिक काउंसलिंग और इससे जुड़ी नैतिकता।"
outcomes:
  - en: "Explain how genes and environment shape traits"
    zh: "解释基因和环境如何影响性状"
    zh-TW: "解釋基因和環境如何影響性狀"
    ja: "遺伝子と環境が形質に与える影響を説明する"
    ko: "유전자와 환경이 형질을 만드는 방식 설명"
    vi: "Giải thích gen và môi trường định hình tính trạng"
    ms: "Terangkan cara gen dan persekitaran membentuk ciri"
    id: "Menjelaskan pengaruh gen dan lingkungan pada sifat"
    hi: "जीन और पर्यावरण लक्षणों को कैसे आकार देते हैं"
  - en: "Compare ways to find genetic causes of disease"
    zh: "比较寻找致病基因的方法"
    zh-TW: "比較尋找致病基因的方法"
    ja: "病気の遺伝的原因を探す方法を比較する"
    ko: "질병의 유전적 원인을 찾는 방법 비교"
    vi: "So sánh cách tìm nguyên nhân di truyền của bệnh"
    ms: "Banding cara mencari punca genetik penyakit"
    id: "Membandingkan cara mencari penyebab genetik penyakit"
    hi: "बीमारी के आनुवंशिक कारण खोजने के तरीकों की तुलना"
  - en: "Discuss ethical issues in human genetics"
    zh: "讨论人类遗传学的伦理问题"
    zh-TW: "討論人類遺傳學的倫理議題"
    ja: "ヒト遺伝学の倫理的問題を議論する"
    ko: "인간 유전학의 윤리 문제 토론"
    vi: "Thảo luận vấn đề đạo đức trong di truyền người"
    ms: "Bincang isu etika dalam genetik manusia"
    id: "Mendiskusikan isu etika genetika manusia"
    hi: "मानव जेनेटिक्स के नैतिक मुद्दों पर चर्चा"
