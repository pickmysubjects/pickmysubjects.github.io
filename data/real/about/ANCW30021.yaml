code: ANCW30021
year: 2026
learn:
  en: "The social, political, cultural and religious history of imperial Rome, from Augustus onwards."
  zh: "从奥古斯都开始的罗马帝国社会、政治、文化和宗教史。"
  zh-TW: "從奧古斯都開始的羅馬帝國社會、政治、文化和宗教史。"
  ja: "アウグストゥス以降の帝政ローマの社会・政治・文化・宗教の歴史を学ぶ。"
  ko: "아우구스투스 이후 제정 로마의 사회, 정치, 문화, 종교사를 배운다."
  vi: "Lịch sử xã hội, chính trị, văn hóa và tôn giáo của đế chế La Mã từ thời Augustus."
  ms: "Sejarah sosial, politik, budaya dan agama Rom zaman empayar, bermula dengan Augustus."
  id: "Sejarah sosial, politik, budaya, dan agama Romawi era kekaisaran, sejak Augustus."
  hi: "ऑगस्टस से आगे शाही रोम का सामाजिक, राजनीतिक, सांस्कृतिक और धार्मिक इतिहास।"
outcomes:
  - en: "Outline the main phases of imperial Rome"
    zh: "概述罗马帝国的主要阶段"
    zh-TW: "概述羅馬帝國的主要階段"
    ja: "帝政ローマの主な段階をまとめる"
    ko: "제정 로마의 주요 단계 정리하기"
    vi: "Tóm tắt các giai đoạn chính của đế chế La Mã"
    ms: "Ringkaskan fasa utama empayar Rom"
    id: "Merangkum fase utama Romawi kekaisaran"
    hi: "शाही रोम के मुख्य चरणों की रूपरेखा देना"
  - en: "Explain how emperors held power"
    zh: "解释皇帝如何掌握权力"
    zh-TW: "解釋皇帝如何掌握權力"
    ja: "皇帝がどう権力を保ったか説明する"
    ko: "황제들이 권력을 유지한 방식 설명하기"
    vi: "Giải thích các hoàng đế nắm giữ quyền lực ra sao"
    ms: "Terangkan cara maharaja memegang kuasa"
    id: "Menjelaskan cara kaisar memegang kekuasaan"
    hi: "सम्राट सत्ता कैसे बनाए रखते थे, समझाना"
  - en: "Analyse the many peoples of the empire"
    zh: "分析帝国内的多元民族"
    zh-TW: "分析帝國內的多元民族"
    ja: "帝国の多様な民族を分析する"
    ko: "제국의 다양한 민족 분석하기"
    vi: "Phân tích các dân tộc đa dạng trong đế chế"
    ms: "Analisis pelbagai bangsa dalam empayar"
    id: "Menganalisis beragam bangsa dalam kekaisaran"
    hi: "साम्राज्य के विविध लोगों का विश्लेषण करना"
