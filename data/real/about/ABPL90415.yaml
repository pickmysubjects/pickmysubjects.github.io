code: ABPL90415
year: 2027
learn:
  en: "Advanced development feasibility, valuation and asset repositioning, using industry modelling software on a real case."
  zh: "在真实案例中，用行业建模软件做高级开发可行性、估值和资产重新定位。"
  zh-TW: "在真實案例中，用產業建模軟體做進階開發可行性、估價和資產重新定位。"
  ja: "実案件で業界のモデリングソフトを使い、開発採算・評価・資産再配置を高度に学ぶ。"
  ko: "실제 사례에서 업계 모델링 소프트웨어로 개발 타당성, 감정, 자산 재배치를 다룹니다."
  vi: "Khả thi phát triển, định giá và tái định vị tài sản nâng cao, dùng phần mềm mô hình hóa trên tình huống thật."
  ms: "Kebolehlaksanaan pembangunan, penilaian dan penempatan semula aset lanjutan dengan perisian industri."
  id: "Kelayakan pengembangan, valuasi, dan reposisi aset lanjutan dengan perangkat lunak industri."
  hi: "असली केस पर इंडस्ट्री मॉडलिंग सॉफ़्टवेयर से उन्नत फ़िज़िबिलिटी, मूल्यांकन और एसेट रीपोज़िशनिंग।"
outcomes:
  - en: "Model property feasibility and value"
    zh: "为房地产可行性和价值建模"
    zh-TW: "為房地產可行性和價值建模"
    ja: "不動産の採算と価値をモデル化する"
    ko: "부동산 타당성과 가치 모델링하기"
    vi: "Mô hình hóa khả thi và giá trị bất động sản"
    ms: "Memodelkan kebolehlaksanaan dan nilai hartanah"
    id: "Memodelkan kelayakan dan nilai properti"
    hi: "संपत्ति फ़िज़िबिलिटी और मूल्य का मॉडल"
  - en: "Create strategies for property assets"
    zh: "为房地产资产制定策略"
    zh-TW: "為房地產資產制定策略"
    ja: "不動産資産の戦略を立てる"
    ko: "부동산 자산 전략 세우기"
    vi: "Xây dựng chiến lược cho tài sản bất động sản"
    ms: "Merangka strategi aset hartanah"
    id: "Menyusun strategi aset properti"
    hi: "संपत्ति परिसंपत्तियों की रणनीति बनाना"
