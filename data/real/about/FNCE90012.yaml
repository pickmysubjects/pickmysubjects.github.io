code: FNCE90012
year: 2027
learn:
  en: "Mergers, acquisitions, spin-offs and buy-outs, and how to value companies with cash flows and multiples."
  zh: "并购、分拆和杠杆收购，以及用现金流和乘数法给公司估值。"
  zh-TW: "併購、分拆與槓桿收購，以及用現金流量與乘數法評估公司價值。"
  ja: "M&A、スピンオフ、バイアウトと、キャッシュフロー法・マルチプル法による企業価値評価。"
  ko: "인수합병, 분할, 바이아웃과 현금흐름·배수법을 이용한 기업가치 평가."
  vi: "Sáp nhập, mua lại, tách công ty, mua lại bằng nợ và định giá bằng dòng tiền, bội số."
  ms: "Penggabungan, pengambilalihan, pemisahan, belian keluar dan penilaian syarikat dengan aliran tunai dan gandaan."
  id: "Merger, akuisisi, spin-off, buy-out, dan valuasi perusahaan dengan arus kas dan kelipatan."
  hi: "विलय, अधिग्रहण, स्पिन-ऑफ, बायआउट, और कैश फ्लो व मल्टीपल से कंपनी मूल्यांकन।"
outcomes:
  - en: "Analyse the issues in a restructuring deal"
    zh: "分析重组交易中的经济、战略和法律问题"
    zh-TW: "分析重組交易中的經濟、策略與法律問題"
    ja: "再編取引の経済・戦略・法的論点を分析する"
    ko: "구조조정 거래의 쟁점 분석하기"
    vi: "Phân tích các vấn đề trong giao dịch tái cấu trúc"
    ms: "Menganalisis isu dalam urus niaga penstrukturan"
    id: "Menganalisis isu dalam transaksi restrukturisasi"
    hi: "पुनर्गठन सौदे के मुद्दों का विश्लेषण"
  - en: "Value a firm with cash flow and multiples methods"
    zh: "用现金流法和乘数法给公司估值"
    zh-TW: "用現金流量法與乘數法評估公司"
    ja: "キャッシュフロー法とマルチプル法で企業を評価する"
    ko: "현금흐름법과 배수법으로 기업 가치평가하기"
    vi: "Định giá doanh nghiệp bằng dòng tiền và bội số"
    ms: "Menilai firma dengan kaedah aliran tunai dan gandaan"
    id: "Menilai perusahaan dengan metode arus kas dan kelipatan"
    hi: "कैश फ्लो और मल्टीपल विधि से फर्म का मूल्यांकन"
