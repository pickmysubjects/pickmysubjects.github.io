code: DNCE20037
year: 2026
learn:
  en: "Dance meets digital tools: experiment with software and equipment to make mixed-reality group performances and digital artefacts."
  zh: "舞蹈结合数字工具：试用软件与设备，小组制作混合现实演出与数字作品。"
  zh-TW: "舞蹈結合數位工具：試用軟體與設備，小組製作混合實境演出與數位作品。"
  ja: "ダンスとデジタル：ソフトや機材を試し、グループで複合現実の作品とデジタル作品を作る。"
  ko: "무용과 디지털: 소프트웨어와 장비로 실험해 그룹 혼합현실 공연과 디지털 작품을 만든다."
  vi: "Múa và công cụ số: thử phần mềm, thiết bị để làm màn diễn thực tế hỗn hợp theo nhóm và sản phẩm số."
  ms: "Tarian bertemu alat digital: uji perisian dan peralatan untuk persembahan realiti campuran berkumpulan."
  id: "Tari bertemu alat digital: mencoba perangkat lunak dan peralatan untuk pertunjukan realitas campuran berkelompok."
  hi: "डांस और डिजिटल टूल: सॉफ़्टवेयर व उपकरणों से प्रयोग कर समूह में मिक्स्ड-रियलिटी प्रस्तुति और डिजिटल कृतियाँ बनाना।"
outcomes:
  - en: "Use digital tools to make dance"
    zh: "用数字工具创作舞蹈"
    zh-TW: "用數位工具創作舞蹈"
    ja: "デジタルツールでダンスを作る"
    ko: "디지털 도구로 춤 만들기"
    vi: "Dùng công cụ số để sáng tác múa"
    ms: "Guna alat digital untuk mencipta tarian"
    id: "Memakai alat digital untuk membuat tari"
    hi: "डिजिटल टूल से डांस बनाना"
  - en: "Perform a mixed-reality piece as a group"
    zh: "小组演出混合现实作品"
    zh-TW: "小組演出混合實境作品"
    ja: "グループで複合現実作品を上演する"
    ko: "그룹으로 혼합현실 작품 공연하기"
    vi: "Cùng nhóm diễn tác phẩm thực tế hỗn hợp"
    ms: "Persembahkan karya realiti campuran berkumpulan"
    id: "Mementaskan karya realitas campuran berkelompok"
    hi: "समूह में मिक्स्ड-रियलिटी पीस प्रस्तुत करना"
  - en: "Defend your work in an oral assessment"
    zh: "在口头答辩中阐述作品"
    zh-TW: "在口頭答辯中闡述作品"
    ja: "口頭試問で作品を説明する"
    ko: "구술 평가에서 작품 설명하기"
    vi: "Bảo vệ tác phẩm qua vấn đáp"
    ms: "Pertahankan karya dalam penilaian lisan"
    id: "Mempertahankan karya dalam ujian lisan"
    hi: "मौखिक मूल्यांकन में अपने काम का बचाव"
