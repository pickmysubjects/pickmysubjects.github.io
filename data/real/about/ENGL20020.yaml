code: ENGL20020
year: 2026
learn:
  en: "British Romantic writing and early feminism after the American and French Revolutions, and the ideas they shared or fought over."
  zh: "美法革命后英国的浪漫主义文学与早期女性主义，以及两者共通或冲突的观念。"
  zh-TW: "美法革命後英國的浪漫主義文學與早期女性主義，以及兩者共通或衝突的觀念。"
  ja: "米仏革命後の英国ロマン主義文学と初期フェミニズム、その共通点と対立を学ぶ。"
  ko: "미국·프랑스 혁명 이후 영국 낭만주의 문학과 초기 페미니즘, 그 공통점과 갈등을 배운다."
  vi: "Văn học Lãng mạn Anh và nữ quyền sơ khai sau Cách mạng Mỹ và Pháp, cùng những ý tưởng họ chia sẻ hoặc tranh cãi."
  ms: "Penulisan Romantik British dan feminisme awal selepas Revolusi Amerika dan Perancis, serta idea yang dikongsi atau dipertikai."
  id: "Karya Romantik Inggris dan feminisme awal setelah Revolusi Amerika dan Prancis, serta gagasan yang mereka bagi atau perdebatkan."
  hi: "अमेरिकी और फ्रांसीसी क्रांतियों के बाद का ब्रिटिश रोमांटिक लेखन और शुरुआती नारीवाद, और उनके साझा या टकराते विचार।"
outcomes:
  - en: "Explain key ideas of Romanticism and early feminism"
    zh: "说明浪漫主义和早期女性主义的核心观念"
    zh-TW: "說明浪漫主義和早期女性主義的核心觀念"
    ja: "ロマン主義と初期フェミニズムの主な考えを説明する"
    ko: "낭만주의와 초기 페미니즘의 핵심 사상 설명하기"
    vi: "Giải thích ý tưởng chính của chủ nghĩa Lãng mạn và nữ quyền sơ khai"
    ms: "Terangkan idea utama Romantisisme dan feminisme awal"
    id: "Menjelaskan gagasan utama Romantisisme dan feminisme awal"
    hi: "रोमांटिसिज़्म और शुरुआती नारीवाद के मुख्य विचार समझाना"
  - en: "Read texts in their revolutionary context"
    zh: "结合革命背景阅读作品"
    zh-TW: "結合革命背景閱讀作品"
    ja: "作品を革命の時代背景の中で読む"
    ko: "혁명의 맥락에서 작품 읽기"
    vi: "Đọc tác phẩm trong bối cảnh cách mạng"
    ms: "Baca teks dalam konteks revolusi"
    id: "Membaca teks dalam konteks revolusi"
    hi: "पाठों को क्रांतिकारी संदर्भ में पढ़ना"
  - en: "Write essays comparing poetry, prose and drama"
    zh: "撰写比较诗歌、散文和戏剧的论文"
    zh-TW: "撰寫比較詩歌、散文和戲劇的論文"
    ja: "詩・散文・戯曲を比べるエッセイを書く"
    ko: "시·산문·희곡을 비교하는 에세이 쓰기"
    vi: "Viết bài luận so sánh thơ, văn xuôi và kịch"
    ms: "Tulis esei membandingkan puisi, prosa dan drama"
    id: "Menulis esai yang membandingkan puisi, prosa dan drama"
    hi: "कविता, गद्य और नाटक की तुलना करते निबंध लिखना"
