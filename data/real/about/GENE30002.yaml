code: GENE30002
year: 2026
learn:
  en: "How genes are built, organised and switched on or off, and how this is used in medicine and farming."
  zh: "基因的结构、组织和开关调控，以及在医学和农业上的应用。"
  zh-TW: "基因的結構、組織和開關調控，以及在醫學和農業上的應用。"
  ja: "遺伝子の構造・配置・オンオフの仕組みと、医療や農業での活用。"
  ko: "유전자의 구조, 배열, 켜고 꺼지는 원리와 의학·농업에서의 활용."
  vi: "Gen được cấu tạo, sắp xếp, bật tắt ra sao và ứng dụng trong y học, nông nghiệp."
  ms: "Cara gen dibina, disusun dan dihidup atau dimatikan, serta kegunaannya dalam perubatan dan pertanian."
  id: "Cara gen tersusun, diatur, dan dinyalakan atau dimatikan, serta pemakaiannya di kedokteran dan pertanian."
  hi: "जीन कैसे बने, व्यवस्थित और चालू-बंद होते हैं, और दवा व खेती में इसका उपयोग।"
outcomes:
  - en: "Explain how gene expression is controlled"
    zh: "解释基因表达怎么被调控"
    zh-TW: "解釋基因表現如何被調控"
    ja: "遺伝子発現の制御の仕組みを説明する"
    ko: "유전자 발현 조절 방식 설명"
    vi: "Giải thích biểu hiện gen được điều hòa ra sao"
    ms: "Terangkan cara ekspresi gen dikawal"
    id: "Menjelaskan cara ekspresi gen dikendalikan"
    hi: "जीन अभिव्यक्ति कैसे नियंत्रित होती है, समझाना"
  - en: "Read and assess current genetics research papers"
    zh: "阅读并评估遗传学论文"
    zh-TW: "閱讀並評估最新遺傳學論文"
    ja: "最新の遺伝学論文を読み評価する"
    ko: "최신 유전학 논문을 읽고 평가"
    vi: "Đọc và đánh giá bài báo nghiên cứu di truyền mới"
    ms: "Baca dan nilai kertas penyelidikan genetik terkini"
    id: "Membaca dan menilai paper riset genetika terbaru"
    hi: "मौजूदा जेनेटिक्स रिसर्च पेपर पढ़ना और परखना"
  - en: "Explain how molecular techniques are applied"
    zh: "解释分子技术怎么应用"
    zh-TW: "解釋分子技術如何應用"
    ja: "分子生物学的手法の応用を説明する"
    ko: "분자 기법의 적용 방식 설명"
    vi: "Giải thích cách ứng dụng kỹ thuật phân tử"
    ms: "Terangkan cara teknik molekul digunakan"
    id: "Menjelaskan penerapan teknik molekuler"
    hi: "मॉलिक्यूलर तकनीकें कैसे लागू होती हैं, समझाना"
