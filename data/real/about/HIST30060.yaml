code: HIST30060
year: 2026
learn:
  en: "The history major capstone: design and research your own project, then present it as an essay, website, podcast or film."
  zh: "历史专业毕业课：设计并研究自己的项目，以论文、网站、播客或影片呈现。"
  zh-TW: "歷史主修總整課：設計並研究自己的專題，以論文、網站、Podcast或影片呈現。"
  ja: "歴史専攻の総まとめ科目。自分のプロジェクトを設計・調査し、論文・ウェブサイト・ポッドキャスト・映像で発表する。"
  ko: "역사 전공 캡스톤으로, 직접 프로젝트를 설계·연구해 에세이, 웹사이트, 팟캐스트, 영상으로 발표한다."
  vi: "Môn tổng kết chuyên ngành lịch sử: tự thiết kế, nghiên cứu dự án rồi trình bày dưới dạng bài luận, website, podcast hay phim."
  ms: "Subjek kemuncak major sejarah: reka dan kaji projek sendiri, kemudian bentangkan sebagai esei, laman web, podcast atau filem."
  id: "Mata kuliah puncak jurusan sejarah: merancang dan meneliti proyek sendiri, lalu menyajikannya sebagai esai, situs, podcast, atau film."
  hi: "इतिहास मेजर का कैपस्टोन: अपना प्रोजेक्ट बनाकर उस पर शोध करना, फिर निबंध, वेबसाइट, पॉडकास्ट या फ़िल्म के रूप में पेश करना।"
outcomes:
  - en: "Formulate a historical research question"
    zh: "提出一个历史研究问题"
    zh-TW: "提出一個歷史研究問題"
    ja: "歴史研究の問いを立てる"
    ko: "역사 연구 질문 세우기"
    vi: "Đặt ra một câu hỏi nghiên cứu lịch sử"
    ms: "Rangka soalan kajian sejarah"
    id: "Merumuskan pertanyaan riset sejarah"
    hi: "एक ऐतिहासिक शोध प्रश्न तैयार करना"
  - en: "Present history creatively for a target audience"
    zh: "面向特定受众创造性地呈现历史"
    zh-TW: "面向特定受眾創造性地呈現歷史"
    ja: "対象者に向けて歴史を工夫して伝える"
    ko: "대상 청중에게 역사를 창의적으로 전달하기"
    vi: "Trình bày lịch sử một cách sáng tạo cho đối tượng cụ thể"
    ms: "Bentangkan sejarah secara kreatif untuk khalayak sasaran"
    id: "Menyajikan sejarah secara kreatif bagi audiens sasaran"
    hi: "किसी तय श्रोता के लिए इतिहास को रचनात्मक ढंग से पेश करना"
  - en: "Defend an argument using existing scholarship"
    zh: "借助已有研究为论点辩护"
    zh-TW: "借助既有研究為論點辯護"
    ja: "既存の研究を使って主張を擁護する"
    ko: "기존 연구를 활용해 주장 옹호하기"
    vi: "Bảo vệ lập luận dựa trên các nghiên cứu sẵn có"
    ms: "Pertahankan hujah dengan kajian sedia ada"
    id: "Mempertahankan argumen dengan kajian yang ada"
    hi: "मौजूदा शोध के सहारे अपने तर्क का बचाव करना"
