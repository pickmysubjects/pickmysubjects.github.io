code: CHIN30025
year: 2026
learn:
  en: "Chinese for students who speak some Chinese but read and write very little: building literacy."
  zh: "适合会说一些中文但几乎不会读写的学生：提升读写能力。"
  zh-TW: "適合會說一些中文但幾乎不會讀寫的學生：提升讀寫能力。"
  ja: "中国語を少し話せるが読み書きがほとんどできない学生向け。読み書きの力をつける。"
  ko: "중국어를 조금 말하지만 읽고 쓰기는 거의 못하는 학생 대상. 읽기·쓰기 능력을 기른다."
  vi: "Tiếng Trung cho sinh viên nói được chút ít nhưng hầu như không biết đọc viết: xây dựng khả năng đọc viết."
  ms: "Bahasa Cina untuk pelajar yang boleh bertutur sedikit tetapi hampir tidak boleh membaca dan menulis."
  id: "Bahasa Mandarin untuk mahasiswa yang bisa sedikit berbicara tetapi hampir tidak bisa membaca dan menulis."
  hi: "थोड़ी चीनी बोलने वाले पर लगभग न पढ़-लिख पाने वाले छात्रों के लिए चीनी: पढ़ना-लिखना बढ़ाना।"
outcomes:
  - en: "Talk about familiar topics in Chinese with more confidence"
    zh: "更自信地用中文谈论熟悉的话题"
    zh-TW: "更自信地用中文談論熟悉的話題"
    ja: "身近な話題を中国語でより自信を持って話す"
    ko: "익숙한 주제를 중국어로 더 자신 있게 말하기"
    vi: "Nói về chủ đề quen thuộc bằng tiếng Trung tự tin hơn"
    ms: "Bercakap tentang topik biasa dalam bahasa Cina dengan lebih yakin"
    id: "Membicarakan topik akrab dalam bahasa Mandarin dengan lebih percaya diri"
    hi: "परिचित विषयों पर चीनी में ज़्यादा आत्मविश्वास से बात करना"
  - en: "Read and write short Chinese texts"
    zh: "读写简短的中文文章"
    zh-TW: "讀寫簡短的中文文章"
    ja: "短い中国語の文章を読み書きする"
    ko: "짧은 중국어 글 읽고 쓰기"
    vi: "Đọc và viết đoạn văn tiếng Trung ngắn"
    ms: "Baca dan tulis teks pendek bahasa Cina"
    id: "Membaca dan menulis teks pendek bahasa Mandarin"
    hi: "छोटे चीनी पाठ पढ़ना-लिखना"
  - en: "Use new grammar and vocabulary correctly"
    zh: "正确运用新语法和词汇"
    zh-TW: "正確運用新文法和詞彙"
    ja: "新しい文法と語彙を正しく使う"
    ko: "새 문법과 어휘를 정확히 쓰기"
    vi: "Dùng đúng ngữ pháp và từ vựng mới"
    ms: "Guna tatabahasa dan kosa kata baharu dengan betul"
    id: "Memakai tata bahasa dan kosakata baru dengan benar"
    hi: "नया व्याकरण और शब्दावली सही इस्तेमाल करना"
