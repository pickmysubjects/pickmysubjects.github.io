code: POPH90014
year: 2027
learn:
  en: "Core epidemiology: measuring disease in populations, causal inference and using evidence for public health practice."
  zh: "流行病学核心：测量人群疾病、因果推断，以及用证据指导公共卫生实践。"
  zh-TW: "流行病學核心：測量族群疾病、因果推論，並以證據指導公共衛生實務。"
  ja: "疫学の基礎。集団の疾病の測定、因果推論、公衆衛生へのエビデンス活用。"
  ko: "역학의 핵심: 인구 집단의 질병 측정, 인과 추론, 공중보건에 근거 활용."
  vi: "Dịch tễ học cốt lõi: đo bệnh tật trong dân số, suy luận nhân quả và dùng bằng chứng cho y tế công cộng."
  ms: "Epidemiologi teras: mengukur penyakit dalam populasi, inferens sebab akibat dan bukti untuk kesihatan awam."
  id: "Epidemiologi inti: mengukur penyakit di populasi, inferensi kausal, dan bukti untuk kesehatan masyarakat."
  hi: "मूल महामारी विज्ञान: आबादी में रोग मापना, कारण अनुमान और सार्वजनिक स्वास्थ्य में साक्ष्य का उपयोग।"
outcomes:
  - en: "Calculate measures of disease frequency and association"
    zh: "计算疾病频率和关联的指标"
    zh-TW: "計算疾病頻率與關聯的指標"
    ja: "疾病頻度と関連の指標を計算する"
    ko: "질병 빈도와 연관성 지표 계산하기"
    vi: "Tính các chỉ số tần suất bệnh và mối liên quan"
    ms: "Mengira ukuran kekerapan penyakit dan perkaitan"
    id: "Menghitung ukuran frekuensi penyakit dan asosiasi"
    hi: "रोग आवृत्ति और संबंध के माप निकालना"
  - en: "Judge causes using the counterfactual framework"
    zh: "用反事实框架判断因果"
    zh-TW: "用反事實框架判斷因果"
    ja: "反実仮想の枠組みで因果を判断する"
    ko: "반사실 틀로 인과 판단하기"
    vi: "Đánh giá nhân quả theo khung phản thực tế"
    ms: "Menilai sebab dengan rangka kerja kontrafaktual"
    id: "Menilai sebab dengan kerangka kontrafaktual"
    hi: "प्रतितथ्यात्मक ढाँचे से कारण आँकना"
  - en: "Evaluate screening tests"
    zh: "评估筛查检测"
    zh-TW: "評估篩檢檢測"
    ja: "スクリーニング検査を評価する"
    ko: "선별 검사 평가하기"
    vi: "Đánh giá xét nghiệm sàng lọc"
    ms: "Menilai ujian saringan"
    id: "Mengevaluasi uji skrining"
    hi: "स्क्रीनिंग परीक्षणों का मूल्यांकन"
