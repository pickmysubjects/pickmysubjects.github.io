code: EVSC30007
year: 2026
learn:
  en: "A team capstone project with industry on a real urban or forest ecosystem problem you choose."
  zh: "与业界合作的团队毕业项目，研究自选的城市或森林生态问题。"
  zh-TW: "與業界合作的團隊總結專案，研究自選的城市或森林生態問題。"
  ja: "業界と連携し、自分で選んだ都市・森林生態系の実課題に取り組むチームの集大成プロジェクト。"
  ko: "업계와 함께 직접 고른 도시·산림 생태계 문제를 다루는 팀 캡스톤 프로젝트."
  vi: "Dự án tốt nghiệp nhóm cùng doanh nghiệp về một vấn đề hệ sinh thái đô thị hoặc rừng do bạn chọn."
  ms: "Projek akhir berkumpulan bersama industri tentang masalah ekosistem bandar atau hutan pilihan anda."
  id: "Proyek capstone tim bersama industri tentang masalah ekosistem kota atau hutan pilihanmu."
  hi: "इंडस्ट्री के साथ टीम कैपस्टोन प्रोजेक्ट, आपकी चुनी शहरी या वन पारिस्थितिकी समस्या पर।"
outcomes:
  - en: "Analyse an ecosystem management problem"
    zh: "分析生态系统管理问题"
    zh-TW: "分析生態系管理問題"
    ja: "生態系管理の課題を分析する"
    ko: "생태계 관리 문제를 분석한다"
    vi: "Phân tích vấn đề quản lý hệ sinh thái"
    ms: "Analisis masalah pengurusan ekosistem"
    id: "Menganalisis masalah pengelolaan ekosistem"
    hi: "इकोसिस्टम प्रबंधन समस्या का विश्लेषण"
  - en: "Present findings to external stakeholders"
    zh: "向外部利益相关者汇报成果"
    zh-TW: "向外部利害關係人報告成果"
    ja: "外部関係者に成果を発表する"
    ko: "외부 이해관계자에게 결과를 발표한다"
    vi: "Trình bày kết quả cho bên liên quan"
    ms: "Bentang dapatan kepada pihak luar"
    id: "Mempresentasikan temuan ke pihak luar"
    hi: "बाहरी हितधारकों को नतीजे प्रस्तुत करना"
