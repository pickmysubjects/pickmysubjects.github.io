code: FLTV20005
year: 2026
learn:
  en: "Follows Making Movies 1 online: pre-visualising scenes, adaptation, documentary, animation, experimental film and directing actors."
  zh: "接续拍电影1的在线课：分镜预演、改编、纪录片、动画、实验电影和指导演员"
  zh-TW: "接續拍電影1的線上課：分鏡預演、改編、紀錄片、動畫、實驗電影和指導演員"
  ja: "「映画制作1」に続くオンライン講座。プリビズ、脚色、ドキュメンタリー、アニメ、実験映画、演技指導。"
  ko: "영화 만들기 1의 후속 온라인 과정: 사전 시각화, 각색, 다큐, 애니메이션, 실험 영화, 배우 연출."
  vi: "Tiếp nối Làm phim 1 trực tuyến: dựng trước cảnh, chuyển thể, tài liệu, hoạt hình, phim thể nghiệm, chỉ đạo diễn viên."
  ms: "Sambungan Making Movies 1 dalam talian: pravisualisasi, adaptasi, dokumentari, animasi, filem eksperimen, pelakon."
  id: "Lanjutan Making Movies 1 secara daring: pravisualisasi, adaptasi, dokumenter, animasi, film eksperimental, aktor."
  hi: "मेकिंग मूवीज़ 1 के बाद ऑनलाइन: प्री-विज़ुअलाइज़ेशन, रूपांतरण, डॉक्यूमेंट्री, एनिमेशन, प्रयोगात्मक फ़िल्म, अभिनेता।"
outcomes:
  - en: "Plan a scene visually as a director"
    zh: "像导演一样用画面规划一场戏"
    zh-TW: "像導演一樣用畫面規劃一場戲"
    ja: "監督としてシーンを視覚的に設計する"
    ko: "감독처럼 장면을 시각적으로 계획하기"
    vi: "Lên kế hoạch hình ảnh cho cảnh quay như đạo diễn"
    ms: "Merancang babak secara visual sebagai pengarah"
    id: "Merancang adegan secara visual sebagai sutradara"
    hi: "निर्देशक की तरह दृश्य की विज़ुअल योजना बनाना"
  - en: "Compare what different film genres do well"
    zh: "比较不同电影类型的特点"
    zh-TW: "比較不同電影類型的特點"
    ja: "映画ジャンルごとの特徴を比べる"
    ko: "여러 영화 장르의 특징 비교하기"
    vi: "So sánh đặc điểm của các thể loại phim"
    ms: "Membandingkan keistimewaan pelbagai genre filem"
    id: "Membandingkan kekuatan berbagai genre film"
    hi: "अलग-अलग फ़िल्म विधाओं की खूबियों की तुलना करना"
  - en: "Make a short film, script or treatment of your choice"
    zh: "自选完成一部短片、剧本或纪录片方案"
    zh-TW: "自選完成一部短片、劇本或紀錄片企劃"
    ja: "短編、脚本、企画書から選んで作る"
    ko: "단편, 각본, 기획안 중 하나를 골라 완성하기"
    vi: "Làm một phim ngắn, kịch bản hoặc đề cương tự chọn"
    ms: "Menghasilkan filem pendek, skrip atau rawatan pilihan"
    id: "Membuat film pendek, naskah, atau treatment pilihan"
    hi: "अपनी पसंद की छोटी फ़िल्म, स्क्रिप्ट या ट्रीटमेंट बनाना"
