code: MULT10011
year: 2026
learn:
  en: "How the universe and Earth formed, how life began and evolved, and whether life exists elsewhere."
  zh: "宇宙和地球如何形成、生命如何起源演化，外星是否有生命"
  zh-TW: "宇宙和地球如何形成、生命如何起源演化，外星是否有生命"
  ja: "宇宙と地球の成り立ち、生命の起源と進化、地球外に生命はあるか。"
  ko: "우주와 지구의 형성, 생명의 기원과 진화, 외계 생명의 가능성."
  vi: "Vũ trụ và Trái Đất hình thành ra sao, sự sống bắt đầu và tiến hóa thế nào, có sự sống nơi khác không."
  ms: "Bagaimana alam semesta dan Bumi terbentuk, bagaimana hidupan bermula dan berevolusi, dan adakah hidupan di tempat lain."
  id: "Bagaimana alam semesta dan Bumi terbentuk, kehidupan bermula dan berevolusi, dan adakah kehidupan di tempat lain."
  hi: "ब्रह्मांड और पृथ्वी कैसे बने, जीवन कैसे शुरू हुआ और विकसित हुआ, और क्या कहीं और जीवन है।"
outcomes:
  - en: "Explain core ideas of astrophysics, biology, geology"
    zh: "解释天体物理、生物和地质的核心概念"
    zh-TW: "解釋天文物理、生物和地質的核心概念"
    ja: "天体物理・生物・地質の基本概念を説明する"
    ko: "천체물리·생물·지질의 핵심 개념 설명하기"
    vi: "Giải thích khái niệm cốt lõi thiên văn, sinh, địa chất"
    ms: "Menerangkan idea teras astrofizik, biologi, geologi"
    id: "Menjelaskan konsep inti astrofisika, biologi, geologi"
    hi: "खगोल भौतिकी, जीवविज्ञान, भूविज्ञान के मूल विचार समझाना"
  - en: "Use the scientific method on questions about life"
    zh: "用科学方法思考生命起源和演化"
    zh-TW: "用科學方法思考生命起源和演化"
    ja: "生命の問いに科学的方法で取り組む"
    ko: "생명에 관한 질문에 과학적 방법 적용하기"
    vi: "Dùng phương pháp khoa học cho câu hỏi về sự sống"
    ms: "Menggunakan kaedah saintifik untuk soalan tentang hidupan"
    id: "Memakai metode ilmiah untuk pertanyaan tentang kehidupan"
    hi: "जीवन के प्रश्नों पर वैज्ञानिक पद्धति लगाना"
