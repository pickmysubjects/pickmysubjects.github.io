code: ABPL90413
year: 2027
learn:
  en: "Setting and controlling a building budget as the design develops, including element cost plans, cash flow and CostX estimating."
  zh: "在设计推进中制定和控制建筑预算，包括分部成本计划、现金流和 CostX 估算。"
  zh-TW: "在設計推進中制定與控制建築預算，包括分項成本計畫、現金流與 CostX 估算。"
  ja: "設計の進行に合わせた予算設定と管理。部位別コスト計画、キャッシュフロー、CostX。"
  ko: "설계 진행에 따른 예산 수립·관리. 부위별 원가계획, 현금흐름, CostX."
  vi: "Lập và kiểm soát ngân sách khi thiết kế phát triển: kế hoạch chi phí, dòng tiền, dự toán CostX."
  ms: "Menetapkan dan mengawal bajet bangunan semasa reka bentuk, termasuk aliran tunai dan CostX."
  id: "Menyusun dan mengendalikan anggaran bangunan selama desain, termasuk arus kas dan CostX."
  hi: "डिज़ाइन के साथ भवन बजट तय करना और नियंत्रित करना, कैश फ़्लो और CostX सहित।"
outcomes:
  - en: "Prepare a detailed priced cost plan"
    zh: "编制详细的计价成本计划"
    zh-TW: "編製詳細的計價成本計畫"
    ja: "詳細な概算コスト計画を作る"
    ko: "상세 원가계획서 작성하기"
    vi: "Lập kế hoạch chi phí chi tiết có giá"
    ms: "Menyediakan pelan kos terperinci berharga"
    id: "Menyusun rencana biaya terperinci"
    hi: "विस्तृत मूल्यांकित लागत योजना बनाना"
  - en: "Track a project budget as the design changes"
    zh: "在设计变化时跟踪项目预算"
    zh-TW: "在設計變化時追蹤專案預算"
    ja: "設計変更に合わせ予算を管理する"
    ko: "설계 변경에 따라 예산 관리하기"
    vi: "Theo dõi ngân sách khi thiết kế thay đổi"
    ms: "Memantau bajet apabila reka bentuk berubah"
    id: "Memantau anggaran saat desain berubah"
    hi: "डिज़ाइन बदलने पर बजट पर नज़र रखना"
