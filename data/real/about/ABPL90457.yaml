code: ABPL90457
year: 2027
learn:
  en: "A travelling studio in Hong Kong studying dense urbanism through site visits and mapping, to build an urban strategy."
  zh: "赴香港的游学工作室，通过实地参观和制图研究高密度城市，并提出城市策略。"
  zh-TW: "赴香港的遊學工作室，透過實地參觀和製圖研究高密度城市，並提出城市策略。"
  ja: "香港を訪れ、現地見学とマッピングで高密度都市を学び、都市戦略を立てるスタジオ。"
  ko: "홍콩 답사 스튜디오로, 현장 견학과 매핑으로 고밀도 도시를 연구하고 도시 전략을 세웁니다."
  vi: "Studio thực địa Hồng Kông: nghiên cứu đô thị mật độ cao qua tham quan, lập bản đồ và đề ra chiến lược."
  ms: "Studio kembara Hong Kong mengkaji bandar padat melalui lawatan dan pemetaan untuk strategi bandar."
  id: "Studio perjalanan Hong Kong meneliti kota padat lewat kunjungan dan pemetaan untuk strategi kota."
  hi: "हांगकांग यात्रा स्टूडियो: साइट विज़िट और मैपिंग से घने शहर का अध्ययन और शहरी रणनीति।"
outcomes:
  - en: "Map a dense city from street to territory"
    zh: "从街道到区域尺度绘制高密度城市"
    zh-TW: "從街道到區域尺度繪製高密度城市"
    ja: "街路から広域まで高密度都市を図示する"
    ko: "가로부터 광역까지 고밀도 도시 도면화하기"
    vi: "Lập bản đồ đô thị dày đặc từ phố đến vùng"
    ms: "Memetakan bandar padat dari jalan ke wilayah"
    id: "Memetakan kota padat dari jalan hingga wilayah"
    hi: "गली से क्षेत्र तक घने शहर का मानचित्र"
  - en: "Present a group urban strategy"
    zh: "以小组形式展示城市策略"
    zh-TW: "以小組形式展示城市策略"
    ja: "グループで都市戦略を発表する"
    ko: "팀으로 도시 전략 발표하기"
    vi: "Cùng nhóm trình bày chiến lược đô thị"
    ms: "Membentang strategi bandar berkumpulan"
    id: "Mempresentasikan strategi kota secara kelompok"
    hi: "समूह में शहरी रणनीति प्रस्तुत करना"
