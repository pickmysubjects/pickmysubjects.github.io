code: GERM30001
year: 2026
learn:
  en: "Advanced German seminar on one area of German-speaking culture, such as literature, media or history, read in German and English."
  zh: "德语高级研讨课：深入一个德语文化主题，如文学、媒体或历史，读德英两种文献"
  zh-TW: "德語高級研討課：深入一個德語文化主題，如文學、媒體或歷史，讀德英兩種文獻"
  ja: "上級ドイツ語ゼミ。文学、メディア、歴史などドイツ語圏文化の一テーマを独英の文献で深める。"
  ko: "고급 독일어 세미나: 문학, 미디어, 역사 등 독일어권 문화의 한 주제를 독·영 문헌으로 탐구."
  vi: "Hội thảo tiếng Đức nâng cao về một chủ đề văn hóa Đức như văn học, truyền thông, lịch sử, đọc tài liệu Đức và Anh."
  ms: "Seminar Jerman lanjutan tentang satu topik budaya Jerman seperti sastera, media atau sejarah, dalam Jerman dan Inggeris."
  id: "Seminar Jerman lanjutan tentang satu topik budaya berbahasa Jerman seperti sastra, media, atau sejarah."
  hi: "उन्नत जर्मन सेमिनार: जर्मन-भाषी संस्कृति का एक विषय जैसे साहित्य, मीडिया या इतिहास, जर्मन व अंग्रेज़ी पाठों से।"
outcomes:
  - en: "Study one German Studies topic in depth"
    zh: "深入研究一个德国研究主题"
    zh-TW: "深入研究一個德國研究主題"
    ja: "ドイツ研究の一テーマを深く学ぶ"
    ko: "독일학 주제 하나를 깊이 연구하기"
    vi: "Nghiên cứu sâu một chủ đề Đức học"
    ms: "Mengkaji satu topik Pengajian Jerman secara mendalam"
    id: "Mempelajari satu topik Studi Jerman secara mendalam"
    hi: "जर्मन अध्ययन के एक विषय का गहराई से अध्ययन करना"
  - en: "Read primary and secondary texts in German and English"
    zh: "阅读德语和英语的原始与二手文献"
    zh-TW: "閱讀德語和英語的原始與二手文獻"
    ja: "独英の一次・二次文献を読む"
    ko: "독일어·영어 1차·2차 문헌 읽기"
    vi: "Đọc tài liệu gốc và thứ cấp bằng tiếng Đức và Anh"
    ms: "Membaca teks primer dan sekunder dalam Jerman dan Inggeris"
    id: "Membaca teks primer dan sekunder berbahasa Jerman dan Inggris"
    hi: "जर्मन और अंग्रेज़ी में मूल व द्वितीयक पाठ पढ़ना"
  - en: "Discuss and present on the topic in German"
    zh: "用德语讨论并做主题报告"
    zh-TW: "用德語討論並做主題報告"
    ja: "テーマについてドイツ語で議論・発表する"
    ko: "주제에 대해 독일어로 토론·발표하기"
    vi: "Thảo luận và thuyết trình chủ đề bằng tiếng Đức"
    ms: "Berbincang dan membentang topik dalam bahasa Jerman"
    id: "Berdiskusi dan presentasi tentang topik dalam bahasa Jerman"
    hi: "विषय पर जर्मन में चर्चा और प्रस्तुति करना"
