code: CHIN20007
year: 2026
learn:
  en: "Chinese society and culture through its link to imperial power, taught in English with practice in essay writing."
  zh: "通过与帝国权力的关系认识中国社会与文化，英语授课并练习写论文。"
  zh-TW: "透過與帝國權力的關係認識中國社會與文化，英語授課並練習寫論文。"
  ja: "帝国の権力との関係から中国の社会と文化を学ぶ。英語で教え、論文の書き方も練習する。"
  ko: "제국 권력과의 관계로 중국 사회와 문화를 배운다. 영어로 진행하며 에세이 쓰기를 연습한다."
  vi: "Xã hội và văn hóa Trung Quốc qua mối liên hệ với quyền lực đế chế, dạy bằng tiếng Anh, có luyện viết tiểu luận."
  ms: "Masyarakat dan budaya China melalui kaitannya dengan kuasa empayar, diajar dalam bahasa Inggeris dengan latihan menulis esei."
  id: "Masyarakat dan budaya Tiongkok lewat kaitannya dengan kekuasaan kekaisaran, diajarkan dalam bahasa Inggris dengan latihan menulis esai."
  hi: "शाही सत्ता से संबंध के ज़रिए चीनी समाज और संस्कृति, अंग्रेज़ी में पढ़ाया जाता है, निबंध लेखन के अभ्यास के साथ।"
outcomes:
  - en: "Describe how empire shaped Chinese culture"
    zh: "描述帝国如何塑造中国文化"
    zh-TW: "描述帝國如何塑造中國文化"
    ja: "帝国が中国文化をどう形づくったか説明する"
    ko: "제국이 중국 문화를 만든 방식 설명하기"
    vi: "Mô tả đế chế đã định hình văn hóa Trung Quốc ra sao"
    ms: "Huraikan cara empayar membentuk budaya China"
    id: "Mendeskripsikan cara kekaisaran membentuk budaya Tiongkok"
    hi: "साम्राज्य ने चीनी संस्कृति को कैसे गढ़ा, वर्णन करना"
  - en: "Explain long-term social and intellectual change"
    zh: "解释长期的社会与思想变迁"
    zh-TW: "解釋長期的社會與思想變遷"
    ja: "長期的な社会と思想の変化を説明する"
    ko: "장기적 사회·사상 변화 설명하기"
    vi: "Giải thích biến đổi xã hội và tư tưởng lâu dài"
    ms: "Terangkan perubahan sosial dan intelek jangka panjang"
    id: "Menjelaskan perubahan sosial dan intelektual jangka panjang"
    hi: "लंबी अवधि के सामाजिक और बौद्धिक बदलाव समझाना"
  - en: "Write well-argued essays on Chinese history"
    zh: "就中国历史写出论证充分的论文"
    zh-TW: "就中國歷史寫出論證充分的論文"
    ja: "中国史について筋の通った論文を書く"
    ko: "중국사에 대해 논리적인 에세이 쓰기"
    vi: "Viết tiểu luận lập luận tốt về lịch sử Trung Quốc"
    ms: "Tulis esei berhujah baik tentang sejarah China"
    id: "Menulis esai berargumen kuat tentang sejarah Tiongkok"
    hi: "चीनी इतिहास पर तर्कपूर्ण निबंध लिखना"
