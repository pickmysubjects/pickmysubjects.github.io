code: ACCT90016
year: 2027
learn:
  en: "Australian income tax, capital gains tax, fringe benefits tax and GST, and how they shape business decisions."
  zh: "澳大利亚所得税、资本利得税、附加福利税和GST，以及它们如何影响商业决策。"
  zh-TW: "澳洲所得稅、資本利得稅、附加福利稅與GST，以及它們如何影響商業決策。"
  ja: "豪州の所得税・キャピタルゲイン税・フリンジベネフィット税・GSTと事業判断への影響。"
  ko: "호주 소득세, 양도소득세, 부가급여세, GST와 이들이 경영 결정에 미치는 영향."
  vi: "Thuế thu nhập, thuế lãi vốn, thuế phúc lợi bổ sung và GST của Úc, cùng ảnh hưởng đến quyết định kinh doanh."
  ms: "Cukai pendapatan, cukai keuntungan modal, cukai faedah sampingan dan GST Australia serta kesannya pada keputusan perniagaan."
  id: "Pajak penghasilan, capital gains, fringe benefits, dan GST Australia serta pengaruhnya pada keputusan bisnis."
  hi: "ऑस्ट्रेलियाई आयकर, कैपिटल गेन्स टैक्स, फ्रिंज बेनिफिट्स टैक्स और GST, और व्यावसायिक निर्णयों पर उनका असर।"
outcomes:
  - en: "Identify common tax issues"
    zh: "识别常见的税务问题"
    zh-TW: "辨識常見的稅務問題"
    ja: "よくある税務問題を見つける"
    ko: "흔한 세무 쟁점 파악하기"
    vi: "Nhận diện các vấn đề thuế thường gặp"
    ms: "Mengenal pasti isu cukai biasa"
    id: "Mengenali masalah pajak umum"
    hi: "आम कर मुद्दों की पहचान"
  - en: "Apply income tax, CGT, GST and FBT law to cases"
    zh: "将所得税、资本利得税、GST和FBT法规应用于案例"
    zh-TW: "將所得稅、資本利得稅、GST與FBT法規應用於案例"
    ja: "所得税・CGT・GST・FBTを事例に適用する"
    ko: "소득세, CGT, GST, FBT 법을 사례에 적용하기"
    vi: "Áp dụng luật thuế thu nhập, CGT, GST, FBT vào tình huống"
    ms: "Menggunakan undang-undang cukai pendapatan, CGT, GST dan FBT"
    id: "Menerapkan hukum PPh, CGT, GST, dan FBT pada kasus"
    hi: "मामलों पर आयकर, CGT, GST और FBT कानून लागू करना"
