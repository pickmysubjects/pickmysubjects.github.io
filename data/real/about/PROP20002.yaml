code: PROP20002
year: 2026
learn:
  en: "What drives property development and investment: site analysis, planning permits and how Australian property markets work."
  zh: "物业开发与投资的驱动因素：场地分析、规划许可与澳洲物业市场运作。"
  zh-TW: "不動產開發與投資的驅動因素：基地分析、規劃許可與澳洲不動產市場運作。"
  ja: "不動産開発と投資の原動力：敷地分析、計画許可、豪州の不動産市場の仕組み。"
  ko: "부동산 개발·투자의 동인: 부지 분석, 계획 허가, 호주 부동산 시장의 작동."
  vi: "Động lực của phát triển và đầu tư BĐS: phân tích khu đất, giấy phép quy hoạch và thị trường Úc."
  ms: "Pemacu pembangunan dan pelaburan hartanah: analisis tapak, permit perancangan dan pasaran hartanah Australia."
  id: "Pendorong pengembangan dan investasi properti: analisis tapak, izin perencanaan, dan pasar properti Australia."
  hi: "प्रॉपर्टी विकास और निवेश के कारक: साइट विश्लेषण, प्लानिंग परमिट और ऑस्ट्रेलियाई बाज़ार।"
outcomes:
  - en: "Analyse a property site's potential"
    zh: "分析一块物业场地的潜力"
    zh-TW: "分析一塊不動產基地的潛力"
    ja: "物件・敷地の可能性を分析する"
    ko: "부동산 부지의 잠재력 분석하기"
    vi: "Phân tích tiềm năng của một khu đất"
    ms: "Analisis potensi tapak hartanah"
    id: "Menganalisis potensi suatu tapak properti"
    hi: "किसी प्रॉपर्टी साइट की संभावना का विश्लेषण"
  - en: "Outline the planning permit process"
    zh: "概述规划许可流程"
    zh-TW: "概述規劃許可流程"
    ja: "計画許可の流れを説明する"
    ko: "계획 허가 절차 개요 설명하기"
    vi: "Trình bày quy trình xin giấy phép quy hoạch"
    ms: "Gariskan proses permit perancangan"
    id: "Menguraikan proses izin perencanaan"
    hi: "प्लानिंग परमिट की प्रक्रिया बताना"
  - en: "Explain what moves property markets"
    zh: "说明影响物业市场的因素"
    zh-TW: "說明影響不動產市場的因素"
    ja: "不動産市場を動かす要因を説明する"
    ko: "부동산 시장을 움직이는 요인 설명하기"
    vi: "Giải thích điều gì tác động thị trường BĐS"
    ms: "Jelaskan apa yang menggerakkan pasaran hartanah"
    id: "Menjelaskan penggerak pasar properti"
    hi: "प्रॉपर्टी बाज़ार को क्या चलाता है, समझाना"
