code: PHIL20044
year: 2026
learn:
  en: "What capitalism is and whether it is just, from Adam Smith and Mill to its modern critics."
  zh: "资本主义是什么、是否公正，从亚当·斯密、密尔到现代批评者。"
  zh-TW: "資本主義是什麼、是否公正，從亞當·斯密、彌爾到現代批評者。"
  ja: "資本主義とは何か、それは公正か。アダム・スミスやミルから現代の批判者までを読む。"
  ko: "자본주의란 무엇이고 정의로운가. 애덤 스미스와 밀부터 현대 비판자까지 다룬다."
  vi: "Chủ nghĩa tư bản là gì và có công bằng không, từ Adam Smith, Mill đến các nhà phê bình hiện đại."
  ms: "Apa itu kapitalisme dan adakah ia adil, dari Adam Smith dan Mill hingga pengkritik moden."
  id: "Apa itu kapitalisme dan apakah ia adil, dari Adam Smith dan Mill sampai para pengkritik modern."
  hi: "पूंजीवाद क्या है और क्या यह न्यायपूर्ण है, एडम स्मिथ और मिल से आधुनिक आलोचकों तक।"
outcomes:
  - en: "Explain classic defences of capitalism"
    zh: "说明为资本主义辩护的经典论点"
    zh-TW: "說明為資本主義辯護的經典論點"
    ja: "資本主義を擁護する古典的な議論を説明する"
    ko: "자본주의에 대한 고전적 옹호 설명하기"
    vi: "Giải thích các lập luận kinh điển bảo vệ chủ nghĩa tư bản"
    ms: "Terangkan pembelaan klasik kapitalisme"
    id: "Menjelaskan pembelaan klasik terhadap kapitalisme"
    hi: "पूंजीवाद के क्लासिक बचावों को समझाना"
  - en: "Assess moral criticisms of markets"
    zh: "评估对市场的道德批评"
    zh-TW: "評估對市場的道德批評"
    ja: "市場への道徳的批判を評価する"
    ko: "시장에 대한 도덕적 비판 평가하기"
    vi: "Đánh giá các phê phán đạo đức về thị trường"
    ms: "Nilai kritikan moral terhadap pasaran"
    id: "Menilai kritik moral terhadap pasar"
    hi: "बाज़ारों की नैतिक आलोचनाओं को परखना"
  - en: "Argue a view on capitalism and justice"
    zh: "就资本主义与正义提出自己的论点"
    zh-TW: "就資本主義與正義提出自己的論點"
    ja: "資本主義と正義について自分の見解を論じる"
    ko: "자본주의와 정의에 관한 입장 논증하기"
    vi: "Lập luận một quan điểm về chủ nghĩa tư bản và công lý"
    ms: "Berhujah tentang kapitalisme dan keadilan"
    id: "Berargumen tentang kapitalisme dan keadilan"
    hi: "पूंजीवाद और न्याय पर अपना मत तर्क से रखना"
