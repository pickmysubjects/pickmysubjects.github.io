code: ENGR90042
year: 2027
learn:
  en: "An individual research project on an advanced engineering topic, supervised by academic staff."
  zh: "个人研究项目，在教师指导下研究一个高级工程课题。"
  zh-TW: "個人研究專題，在教師指導下研究一個進階工程題目。"
  ja: "教員の指導のもと、高度な工学テーマで個人研究を行う。"
  ko: "교수의 지도 아래 고급 공학 주제로 개인 연구를 수행합니다."
  vi: "Dự án nghiên cứu cá nhân về một chủ đề kỹ thuật nâng cao, có giảng viên hướng dẫn."
  ms: "Projek penyelidikan individu tentang topik kejuruteraan lanjutan, diselia staf akademik."
  id: "Proyek riset individu tentang topik teknik lanjut, dibimbing dosen."
  hi: "शैक्षणिक स्टाफ़ की देखरेख में, किसी उन्नत इंजीनियरिंग विषय पर व्यक्तिगत शोध प्रोजेक्ट।"
outcomes:
  - en: "Carry out independent research with suitable research tools"
    zh: "使用合适的研究工具独立开展研究"
    zh-TW: "使用合適的研究工具獨立進行研究"
    ja: "適切な研究ツールで自主的に研究を進める"
    ko: "적절한 연구 도구로 독립적인 연구 수행하기"
    vi: "Tự thực hiện nghiên cứu với công cụ phù hợp"
    ms: "Menjalankan penyelidikan sendiri dengan alat penyelidikan yang sesuai"
    id: "Melakukan riset mandiri dengan alat riset yang sesuai"
    hi: "उपयुक्त शोध उपकरणों से स्वतंत्र शोध करना"
  - en: "Critically review published research, patents and standards"
    zh: "批判性评估已发表研究、专利和标准"
    zh-TW: "批判性評估已發表研究、專利與標準"
    ja: "既存の研究・特許・規格を批判的に検討する"
    ko: "발표된 연구, 특허, 표준을 비판적으로 검토하기"
    vi: "Đánh giá có phê phán nghiên cứu, bằng sáng chế và tiêu chuẩn"
    ms: "Menilai secara kritis penyelidikan terbitan, paten dan piawaian"
    id: "Menilai secara kritis riset terbitan, paten, dan standar"
    hi: "प्रकाशित शोध, पेटेंट और मानकों की आलोचनात्मक समीक्षा"
  - en: "Communicate the research at each stage"
    zh: "在各阶段汇报研究成果"
    zh-TW: "在各階段報告研究成果"
    ja: "各段階で研究成果を伝える"
    ko: "단계마다 연구 결과 전달하기"
    vi: "Trình bày nghiên cứu ở từng giai đoạn"
    ms: "Menyampaikan penyelidikan pada setiap peringkat"
    id: "Mengomunikasikan riset di setiap tahap"
    hi: "हर चरण में शोध प्रस्तुत करना"
