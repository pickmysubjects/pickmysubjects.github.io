code: ATOC30006
year: 2026
learn:
  en: "What keeps today's climate stable, how it may change, and how climate predictions and scenarios work."
  zh: "当今气候如何维持平衡、未来如何变化，以及气候预测如何进行。"
  zh-TW: "當今氣候如何維持平衡、未來如何變化，以及氣候預測如何進行。"
  ja: "今の気候を保つ仕組み、将来の変化、気候予測とシナリオの使い方。"
  ko: "현재 기후의 유지 원리, 미래 변화, 기후 예측과 시나리오."
  vi: "Điều gì giữ khí hậu hiện nay ổn định, nó có thể thay đổi ra sao và dự báo khí hậu hoạt động thế nào."
  ms: "Apa yang mengekalkan iklim kini, bagaimana ia mungkin berubah, dan cara ramalan iklim berfungsi."
  id: "Apa yang menjaga iklim saat ini, bagaimana bisa berubah, dan cara kerja proyeksi iklim."
  hi: "आज की जलवायु कैसे संतुलित है, आगे कैसे बदलेगी, और जलवायु पूर्वानुमान कैसे होते हैं।"
outcomes:
  - en: "Build simple models of radiation and climate"
    zh: "构建辐射与气候的简单模型"
    zh-TW: "建構輻射與氣候的簡單模型"
    ja: "放射と気候の簡単なモデルを作る"
    ko: "복사·기후 간단 모델 만들기"
    vi: "Xây mô hình đơn giản về bức xạ và khí hậu"
    ms: "Bina model mudah sinaran dan iklim"
    id: "Membuat model sederhana radiasi dan iklim"
    hi: "विकिरण और जलवायु के सरल मॉडल बनाएँ"
  - en: "Analyse climate sensitivity to forcing"
    zh: "分析气候对强迫的敏感度"
    zh-TW: "分析氣候對強迫的敏感度"
    ja: "強制力への気候感度を分析する"
    ko: "강제력에 대한 기후 민감도 분석하기"
    vi: "Phân tích độ nhạy khí hậu với tác động"
    ms: "Analisis kepekaan iklim terhadap daya paksa"
    id: "Menganalisis sensitivitas iklim terhadap gaya paksa"
    hi: "फ़ोर्सिंग पर जलवायु संवेदनशीलता का विश्लेषण करें"
  - en: "Interpret uncertainty in climate projections"
    zh: "解读气候预测中的不确定性"
    zh-TW: "解讀氣候預測中的不確定性"
    ja: "気候予測の不確実性を読み解く"
    ko: "기후 전망의 불확실성 해석하기"
    vi: "Diễn giải độ bất định trong dự báo khí hậu"
    ms: "Tafsir ketidakpastian unjuran iklim"
    id: "Menafsirkan ketidakpastian proyeksi iklim"
    hi: "जलवायु अनुमानों की अनिश्चितता समझें"
