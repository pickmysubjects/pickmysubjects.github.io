code: ECON20001
year: 2026
learn:
  en: "Models of growth, short-term ups and downs, exchange rates and how policy affects the economy."
  zh: "经济增长、短期波动、汇率的模型，以及政策的影响。"
  zh-TW: "經濟成長、短期波動、匯率的模型，以及政策的影響。"
  ja: "経済成長、短期の景気変動、為替のモデルと、政策が経済に与える影響。"
  ko: "성장, 단기 경기 변동, 환율 모형과 정책이 경제에 미치는 영향."
  vi: "Mô hình tăng trưởng, biến động ngắn hạn, tỷ giá và tác động của chính sách lên kinh tế."
  ms: "Model pertumbuhan, turun naik jangka pendek, kadar tukaran dan kesan dasar terhadap ekonomi."
  id: "Model pertumbuhan, naik-turun jangka pendek, kurs, dan dampak kebijakan pada ekonomi."
  hi: "ग्रोथ, अल्पकालिक उतार-चढ़ाव, विनिमय दर के मॉडल और नीति का अर्थव्यवस्था पर असर।"
outcomes:
  - en: "Use IS-LM to analyse monetary and fiscal policy"
    zh: "用IS-LM分析货币和财政政策"
    zh-TW: "用IS-LM分析貨幣和財政政策"
    ja: "IS-LMで金融・財政政策を分析する"
    ko: "IS-LM으로 통화·재정 정책 분석"
    vi: "Dùng IS-LM phân tích chính sách tiền tệ và tài khóa"
    ms: "Guna IS-LM untuk analisis dasar monetari dan fiskal"
    id: "Memakai IS-LM untuk analisis kebijakan moneter dan fiskal"
    hi: "IS-LM से मौद्रिक और राजकोषीय नीति का विश्लेषण"
  - en: "Trace how an economy responds to shocks"
    zh: "分析经济受冲击后的变化"
    zh-TW: "分析經濟受衝擊後的變化"
    ja: "ショックに対する経済の反応をたどる"
    ko: "충격에 대한 경제의 반응 추적"
    vi: "Theo dõi nền kinh tế phản ứng với cú sốc"
    ms: "Jejak tindak balas ekonomi terhadap kejutan"
    id: "Menelusuri respons ekonomi terhadap guncangan"
    hi: "झटकों पर अर्थव्यवस्था की प्रतिक्रिया समझना"
  - en: "Explain growth with the Solow model"
    zh: "用索洛模型解释经济增长"
    zh-TW: "用梭羅模型解釋經濟成長"
    ja: "ソローモデルで経済成長を説明する"
    ko: "솔로 모형으로 성장 설명"
    vi: "Giải thích tăng trưởng bằng mô hình Solow"
    ms: "Terangkan pertumbuhan dengan model Solow"
    id: "Menjelaskan pertumbuhan dengan model Solow"
    hi: "सोलो मॉडल से ग्रोथ समझाना"
