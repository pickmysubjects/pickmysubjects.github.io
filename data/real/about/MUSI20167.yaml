code: MUSI20167
year: 2026
learn:
  en: "Write music for ads: jingles, sound as persuasion, working to a client brief and making tracks for mass media. Not offered in 2026."
  zh: "为广告写音乐：广告歌、声音说服、按客户需求创作。2026年不开。"
  zh-TW: "為廣告寫音樂：廣告歌、聲音說服、依客戶需求創作。2026年不開。"
  ja: "広告音楽をつくる：ジングル、説得する音、依頼書に沿う制作。2026年休講。"
  ko: "광고 음악 만들기: 징글, 설득하는 소리, 브리프에 맞춘 작업. 2026년 미개설."
  vi: "Viết nhạc quảng cáo: jingle, âm thanh thuyết phục, làm theo brief. Không mở năm 2026."
  ms: "Cipta muzik iklan: jingle, bunyi memujuk, ikut taklimat pelanggan. Tiada pada 2026."
  id: "Membuat musik iklan: jingle, suara yang membujuk, sesuai brief klien. Tidak dibuka 2026."
  hi: "विज्ञापन संगीत: जिंगल, असर डालने वाली ध्वनि, क्लाइंट ब्रीफ़ पर काम। 2026 में नहीं।"
outcomes:
  - en: "Write a jingle or track to a client brief"
    zh: "按客户需求写广告歌或配乐"
    zh-TW: "依客戶需求寫廣告歌或配樂"
    ja: "依頼に沿ってジングルや曲を作る"
    ko: "브리프에 맞춰 징글이나 트랙 만들기"
    vi: "Viết jingle hoặc bản nhạc theo brief"
    ms: "Tulis jingle atau trek ikut taklimat"
    id: "Membuat jingle atau lagu sesuai brief"
    hi: "क्लाइंट ब्रीफ़ पर जिंगल या ट्रैक बनाना"
  - en: "Record, edit and mix audio in a DAW"
    zh: "在数字音频工作站中录音、剪辑与混音"
    zh-TW: "在數位音訊工作站中錄音、剪輯與混音"
    ja: "DAWで録音・編集・ミックスする"
    ko: "DAW에서 녹음·편집·믹싱하기"
    vi: "Thu, chỉnh sửa và mix âm thanh trên DAW"
    ms: "Rakam, sunting dan campur audio dalam DAW"
    id: "Merekam, mengedit, dan mixing audio di DAW"
    hi: "DAW में ऑडियो रिकॉर्ड, एडिट और मिक्स करना"
  - en: "Explain the choices behind your finished tracks"
    zh: "说明作品背后的制作思路"
    zh-TW: "說明作品背後的製作思路"
    ja: "完成した曲の制作意図を説明する"
    ko: "완성곡의 제작 의도 설명하기"
    vi: "Giải thích lựa chọn trong bản nhạc đã hoàn thành"
    ms: "Terangkan pilihan di sebalik trek siap anda"
    id: "Menjelaskan alasan di balik lagu yang selesai"
    hi: "तैयार ट्रैक के पीछे के फ़ैसले समझाना"
