code: GEOG30007
year: 2026
learn:
  en: "A two-week field trip to China looking at how its society, economy and environment are changing."
  zh: "两周中国实地考察，观察其社会、经济和环境的变化。"
  zh-TW: "兩週中國實地考察，觀察其社會、經濟與環境的變化。"
  ja: "2週間の中国現地調査で、社会・経済・環境の変化を見る。"
  ko: "2주간 중국 현장답사로 사회·경제·환경의 변화를 살펴봄."
  vi: "Chuyến thực địa 2 tuần ở Trung Quốc tìm hiểu xã hội, kinh tế và môi trường đang đổi thay."
  ms: "Lawatan lapangan 2 minggu ke China melihat perubahan masyarakat, ekonomi dan alam sekitar."
  id: "Kunjungan lapangan 2 minggu ke Tiongkok melihat perubahan masyarakat, ekonomi, dan lingkungan."
  hi: "चीन की 2 हफ़्ते की फ़ील्ड ट्रिप, जिसमें समाज, अर्थव्यवस्था और पर्यावरण के बदलाव देखे जाते हैं।"
outcomes:
  - en: "Run a group research project and poster"
    zh: "完成小组研究项目和海报"
    zh-TW: "完成小組研究專題與海報"
    ja: "グループ研究とポスターを仕上げる"
    ko: "그룹 연구 프로젝트와 포스터 수행하기"
    vi: "Thực hiện dự án nghiên cứu nhóm và poster"
    ms: "Jalankan projek penyelidikan kumpulan dan poster"
    id: "Menjalankan proyek riset kelompok dan poster"
    hi: "समूह शोध परियोजना और पोस्टर बनाना"
  - en: "Do fieldwork in a non-Western society"
    zh: "在非西方社会开展实地调研"
    zh-TW: "在非西方社會進行實地調查"
    ja: "非西洋社会でフィールドワークを行う"
    ko: "비서구 사회에서 현장조사 하기"
    vi: "Làm nghiên cứu thực địa ở xã hội phi phương Tây"
    ms: "Buat kerja lapangan dalam masyarakat bukan Barat"
    id: "Melakukan riset lapangan di masyarakat non-Barat"
    hi: "गैर-पश्चिमी समाज में फ़ील्डवर्क करना"
