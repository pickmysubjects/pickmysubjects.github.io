code: PERF20001
year: 2026
learn:
  en: "Write and perform stand-up comedy, turning everyday life into routines with help from working comedians."
  zh: "在职业喜剧人指导下，把日常生活写成段子并上台表演单口喜剧。"
  zh-TW: "在職業喜劇人指導下，把日常生活寫成段子並上台表演單口喜劇。"
  ja: "現役コメディアンの指導で日常をネタにし、スタンダップを書いて演じる。"
  ko: "현역 코미디언의 도움으로 일상을 소재 삼아 스탠드업 코미디를 쓰고 공연하기."
  vi: "Viết và diễn hài độc thoại, biến đời thường thành tiết mục với sự hướng dẫn của danh hài."
  ms: "Tulis dan persembahkan komedi berdiri, jadikan kehidupan harian rutin lucu dengan bantuan pelawak."
  id: "Menulis dan membawakan stand-up comedy, mengubah keseharian jadi materi dibantu komika profesional."
  hi: "पेशेवर कॉमेडियनों की मदद से रोज़मर्रा की ज़िंदगी पर स्टैंड-अप लिखना और प्रस्तुत करना।"
outcomes:
  - en: "Turn observations into funny material"
    zh: "把观察到的生活变成笑料"
    zh-TW: "把觀察到的生活變成笑料"
    ja: "観察したことを笑えるネタにする"
    ko: "관찰한 것을 웃긴 소재로 만들기"
    vi: "Biến quan sát thành chất liệu hài"
    ms: "Jadikan pemerhatian sebagai bahan lucu"
    id: "Mengubah pengamatan jadi materi lucu"
    hi: "अपने अवलोकनों को मज़ेदार सामग्री बनाना"
  - en: "Structure and perform a 5-minute routine"
    zh: "编排并表演5分钟的段子"
    zh-TW: "編排並表演5分鐘的段子"
    ja: "5分のネタを組み立てて演じる"
    ko: "5분짜리 루틴을 구성해 공연하기"
    vi: "Dựng và diễn một tiết mục 5 phút"
    ms: "Susun dan persembahkan rutin 5 minit"
    id: "Menyusun dan membawakan materi 5 menit"
    hi: "5 मिनट का रूटीन बनाकर प्रस्तुत करना"
  - en: "Handle sensitive topics with care"
    zh: "谨慎处理敏感话题"
    zh-TW: "謹慎處理敏感話題"
    ja: "デリケートな話題を配慮して扱う"
    ko: "민감한 주제를 신중히 다루기"
    vi: "Xử lý chủ đề nhạy cảm một cách tinh tế"
    ms: "Kendalikan topik sensitif dengan berhati-hati"
    id: "Menangani topik sensitif dengan hati-hati"
    hi: "संवेदनशील विषयों को सावधानी से संभालना"
