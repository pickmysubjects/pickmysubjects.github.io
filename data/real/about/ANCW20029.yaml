code: ANCW20029
year: 2027
learn:
  en: "How ancient Rome, Persia, India, the steppes and Han China were linked along the silk routes and shaped each other."
  zh: "古罗马、波斯、印度、草原民族和汉代中国如何通过丝绸之路相连并相互影响。"
  zh-TW: "古羅馬、波斯、印度、草原民族和漢代中國如何透過絲路相連並相互影響。"
  ja: "古代ローマ、ペルシア、インド、草原の民、漢がシルクロードでどうつながり影響し合ったか。"
  ko: "고대 로마, 페르시아, 인도, 초원 민족, 한나라가 실크로드로 어떻게 연결되고 서로 영향을 주었는지."
  vi: "La Mã, Ba Tư, Ấn Độ, thảo nguyên và nhà Hán thời cổ đã kết nối qua các con đường tơ lụa và ảnh hưởng lẫn nhau ra sao."
  ms: "Bagaimana Rom, Parsi, India, padang rumput dan China Han purba berhubung melalui laluan sutera dan saling mempengaruhi."
  id: "Bagaimana Roma, Persia, India, stepa, dan Tiongkok Han kuno terhubung lewat jalur sutra dan saling memengaruhi."
  hi: "प्राचीन रोम, फ़ारस, भारत, स्टेपी और हान चीन रेशम मार्गों से कैसे जुड़े और एक-दूसरे को कैसे बदला।"
outcomes:
  - en: "Compare ancient societies using varied evidence"
    zh: "用多种证据比较古代社会"
    zh-TW: "用多種證據比較古代社會"
    ja: "さまざまな証拠で古代社会を比較する"
    ko: "다양한 증거로 고대 사회 비교하기"
    vi: "So sánh các xã hội cổ đại bằng nhiều loại bằng chứng"
    ms: "Bandingkan masyarakat purba dengan pelbagai bukti"
    id: "Membandingkan masyarakat kuno dengan beragam bukti"
    hi: "अलग-अलग साक्ष्यों से प्राचीन समाजों की तुलना"
  - en: "Question ideas like East, West and civilisation"
    zh: "反思“东方”“西方”“文明”等概念"
    zh-TW: "反思「東方」「西方」「文明」等概念"
    ja: "「東」「西」「文明」といった概念を問い直す"
    ko: "동양·서양·문명 같은 개념 되짚어 보기"
    vi: "Đặt câu hỏi về các khái niệm Đông, Tây và văn minh"
    ms: "Persoalkan idea seperti Timur, Barat dan tamadun"
    id: "Mempertanyakan gagasan seperti Timur, Barat, dan peradaban"
    hi: "पूरब, पश्चिम और सभ्यता जैसी धारणाओं पर सवाल उठाना"
  - en: "Read primary sources from several ancient traditions"
    zh: "阅读多个古代传统的一手史料"
    zh-TW: "閱讀多個古代傳統的一手史料"
    ja: "複数の古代伝統の一次史料を読む"
    ko: "여러 고대 전통의 1차 사료 읽기"
    vi: "Đọc nguồn sử liệu gốc từ nhiều truyền thống cổ đại"
    ms: "Baca sumber primer daripada beberapa tradisi purba"
    id: "Membaca sumber primer dari beberapa tradisi kuno"
    hi: "कई प्राचीन परंपराओं के मूल स्रोत पढ़ना"
