code: ARTS20004
year: 2026
learn:
  en: "What it means to be well, looking at wellness through Buddhist, religious, medical and philosophical ideas and the wellness industry."
  zh: "“好好活着”意味着什么，从佛教、宗教、医学、哲学和健康产业来看。"
  zh-TW: "「好好活著」意味著什麼，從佛教、宗教、醫學、哲學和健康產業來看。"
  ja: "「健やかである」とは何かを、仏教・宗教・医学・哲学とウェルネス産業から考える。"
  ko: "‘잘 산다’는 것이 무엇인지 불교, 종교, 의학, 철학과 웰니스 산업으로 살펴본다."
  vi: "Sống khỏe nghĩa là gì, nhìn qua Phật giáo, tôn giáo, y học, triết học và ngành công nghiệp sức khỏe."
  ms: "Apa maksud sejahtera, dilihat melalui idea Buddha, agama, perubatan, falsafah dan industri kesejahteraan."
  id: "Apa arti sejahtera, dilihat lewat gagasan Buddha, agama, kedokteran, filsafat, dan industri wellness."
  hi: "स्वस्थ और भला होने का क्या अर्थ है, बौद्ध, धार्मिक, चिकित्सा, दार्शनिक विचारों और वेलनेस उद्योग के ज़रिए।"
outcomes:
  - en: "Compare ideas of the good life across traditions"
    zh: "比较不同传统中“美好生活”的观念"
    zh-TW: "比較不同傳統中「美好生活」的觀念"
    ja: "伝統ごとの「善い生」の考えを比べる"
    ko: "전통별 ‘좋은 삶’ 개념 비교하기"
    vi: "So sánh quan niệm về cuộc sống tốt đẹp giữa các truyền thống"
    ms: "Bandingkan idea kehidupan baik merentas tradisi"
    id: "Membandingkan gagasan hidup yang baik lintas tradisi"
    hi: "परंपराओं में ‘अच्छे जीवन’ की धारणाओं की तुलना करना"
  - en: "Analyse the modern wellness industry"
    zh: "分析现代健康产业"
    zh-TW: "分析現代健康產業"
    ja: "現代のウェルネス産業を分析する"
    ko: "현대 웰니스 산업 분석하기"
    vi: "Phân tích ngành công nghiệp sức khỏe hiện đại"
    ms: "Analisis industri kesejahteraan moden"
    id: "Menganalisis industri wellness modern"
    hi: "आधुनिक वेलनेस उद्योग का विश्लेषण करना"
  - en: "Reflect on how illness challenges ideas of wellness"
    zh: "反思疾病如何挑战健康观念"
    zh-TW: "反思疾病如何挑戰健康觀念"
    ja: "病が健やかさの考えにどう挑むか考える"
    ko: "질병이 건강 개념에 던지는 질문 성찰하기"
    vi: "Suy ngẫm bệnh tật thách thức quan niệm sống khỏe ra sao"
    ms: "Renungkan cara penyakit mencabar idea kesejahteraan"
    id: "Merefleksikan cara penyakit menantang gagasan sejahtera"
    hi: "बीमारी स्वास्थ्य की धारणाओं को कैसे चुनौती देती है, विचार करना"
