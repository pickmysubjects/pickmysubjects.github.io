    ko: "주요 논쟁이 전개된 과정 설명하기"
    vi: "Giải thích các tranh cãi lớn đã diễn ra thế nào"
    ms: "Terangkan bagaimana kontroversi besar berlaku"
    id: "Menjelaskan bagaimana kontroversi besar berlangsung"
    hi: "बड़े विवाद कैसे सामने आए, समझाना"
  - en: "Weigh competing views of the same event"
