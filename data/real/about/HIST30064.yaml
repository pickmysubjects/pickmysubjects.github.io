code: HIST30064
year: 2026
learn:
  en: "Heated moments in Australian history, from Myall Creek and Eureka to the Dismissal and Bringing Them Home, and why they still matter."
  zh: "澳洲历史上的激烈争议，从迈尔溪屠杀、尤里卡起义到惠特兰被解职和《带他们回家》报告，及其至今的影响。"
  zh-TW: "澳洲歷史上的激烈爭議，從邁爾溪屠殺、尤里卡起義到惠特蘭被解職和《帶他們回家》報告，及其至今的影響。"
  ja: "マイオール・クリーク虐殺、ユーリカの反乱から首相解任、「帰郷」報告まで、オーストラリア史の論争とその今日的意味。"
  ko: "마이얼 크리크 학살, 유레카 봉기부터 총리 해임, '그들을 집으로' 보고서까지 호주사의 논쟁과 그 현재적 의미."
  vi: "Những khoảnh khắc gây tranh cãi trong lịch sử Úc, từ Myall Creek, Eureka đến vụ bãi nhiệm Whitlam, và vì sao chúng vẫn quan trọng."
  ms: "Detik hangat sejarah Australia, dari Myall Creek dan Eureka hingga Pemecatan 1975 dan laporan Bringing Them Home, serta kesannya kini."
  id: "Momen panas sejarah Australia, dari Myall Creek dan Eureka hingga Pemecatan 1975 dan laporan Bringing Them Home, serta dampaknya kini."
  hi: "ऑस्ट्रेलियाई इतिहास के गरम पल, मायल क्रीक और यूरेका से 1975 की बर्ख़ास्तगी और 'ब्रिंगिंग देम होम' तक, और वे आज क्यों मायने रखते हैं।"
outcomes:
