code: ABPL90275
year: 2027
learn:
  en: "Property valuation and management as a business: property classes, leases, risk, discounted cash flow, finance and tax."
  zh: "作为一门生意的物业估价与管理：物业类别、租约、风险、现金流折现、融资和税务。"
  zh-TW: "作為一門生意的不動產估價與管理：不動產類別、租約、風險、現金流折現、融資與稅務。"
  ja: "事業としての不動産評価と管理：物件区分、賃貸借、リスク、DCF、財務、税。"
  ko: "사업으로서의 부동산 평가·관리: 유형, 임대, 위험, DCF, 금융, 세금."
  vi: "Định giá và quản lý bất động sản như kinh doanh: loại tài sản, thuê, rủi ro, chiết khấu dòng tiền."
  ms: "Penilaian dan pengurusan hartanah sebagai perniagaan: pajakan, risiko, DCF, kewangan dan cukai."
  id: "Penilaian dan manajemen properti sebagai bisnis: sewa, risiko, DCF, pembiayaan dan pajak."
  hi: "व्यवसाय के रूप में संपत्ति मूल्यांकन व प्रबंधन: लीज़, जोखिम, DCF, वित्त और कर।"
outcomes:
  - en: "Model valuation and investment cash flows"
    zh: "建立估价和投资现金流模型"
    zh-TW: "建立估價與投資現金流模型"
    ja: "評価と投資のキャッシュフローをモデル化する"
    ko: "평가·투자 현금흐름 모델링하기"
    vi: "Lập mô hình dòng tiền định giá và đầu tư"
    ms: "Memodelkan aliran tunai penilaian dan pelaburan"
    id: "Memodelkan arus kas penilaian dan investasi"
    hi: "मूल्यांकन और निवेश कैश फ़्लो मॉडल बनाना"
  - en: "Explain how property is managed for different owners"
    zh: "说明不同业主如何管理物业"
    zh-TW: "說明不同業主如何管理不動產"
    ja: "所有者ごとの不動産管理を説明する"
    ko: "소유자별 부동산 관리 설명하기"
    vi: "Giải thích quản lý bất động sản cho chủ khác nhau"
    ms: "Menerangkan pengurusan hartanah untuk pemilik berbeza"
    id: "Menjelaskan pengelolaan properti bagi pemilik berbeda"
    hi: "अलग मालिकों के लिए संपत्ति प्रबंधन समझाना"
