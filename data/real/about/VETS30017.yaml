code: VETS30017
year: 2026
learn:
  en: "Liver, kidney/urinary and hormone systems of domestic animals, their diseases, tests and how drugs act."
  zh: "家畜的肝胆、泌尿和内分泌系统，相关疾病、检测与药物作用。"
  zh-TW: "家畜的肝膽、泌尿與內分泌系統，相關疾病、檢測與藥物作用。"
  ja: "家畜の肝胆道・泌尿器・内分泌系、その疾患、検査、薬の作用。"
  ko: "가축의 간담도·비뇨기·내분비계, 관련 질병, 검사, 약물 작용."
  vi: "Hệ gan mật, tiết niệu và nội tiết của vật nuôi, bệnh lý, xét nghiệm và tác dụng thuốc."
  ms: "Sistem hati, kencing dan endokrin haiwan peliharaan, penyakit, ujian dan tindakan ubat."
  id: "Sistem hati, kemih dan endokrin hewan domestik, penyakit, tes dan kerja obat."
  hi: "पालतू पशुओं के लीवर, मूत्र और हार्मोन तंत्र, उनके रोग, जांच और दवाओं का असर।"
outcomes:
  - en: "Pick and read liver, kidney and hormone tests"
    zh: "选择并解读肝、肾和内分泌检测"
    zh-TW: "選擇並判讀肝、腎與內分泌檢測"
    ja: "肝・腎・内分泌検査を選び解釈する"
    ko: "간·신장·내분비 검사 선택 및 해석"
    vi: "Chọn và đọc xét nghiệm gan, thận, nội tiết"
    ms: "Pilih dan tafsir ujian hati, buah pinggang, hormon"
    id: "Memilih dan membaca tes hati, ginjal, hormon"
    hi: "लीवर, किडनी व हार्मोन जांच चुनना और पढ़ना"
  - en: "Use pharmacokinetics to predict drug effects"
    zh: "用药代动力学预测药物效果"
    zh-TW: "用藥物動力學預測藥效"
    ja: "薬物動態で薬の効果を予測する"
    ko: "약동학으로 약물 효과 예측"
    vi: "Dùng dược động học dự đoán tác dụng thuốc"
    ms: "Guna farmakokinetik untuk ramal kesan ubat"
    id: "Memakai farmakokinetik untuk prediksi efek obat"
    hi: "फार्माकोकाइनेटिक्स से दवा का असर अनुमानित करना"
