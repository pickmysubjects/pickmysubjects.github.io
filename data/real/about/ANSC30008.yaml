code: ANSC30008
year: 2026
learn:
  en: "Animal physiology behind food and fibre: growth, lactation, fertility, heat stress, feed intake and meat quality."
  zh: "食品与纤维生产背后的动物生理：生长、泌乳、繁殖、热应激、采食与肉质。"
  zh-TW: "食品與纖維生產背後的動物生理：生長、泌乳、繁殖、熱緊迫、採食與肉質。"
  ja: "食料・繊維生産の動物生理：成長、泌乳、繁殖、暑熱ストレス、採食、肉質。"
  ko: "식품·섬유 생산의 동물 생리: 성장, 비유, 번식, 열 스트레스, 사료 섭취, 육질."
  vi: "Sinh lý vật nuôi trong sản xuất thực phẩm, sợi: tăng trưởng, tiết sữa, sinh sản, stress nhiệt, chất lượng thịt."
  ms: "Fisiologi haiwan untuk makanan dan gentian: tumbesaran, laktasi, kesuburan, tekanan haba, kualiti daging."
  id: "Fisiologi hewan untuk pangan dan serat: pertumbuhan, laktasi, kesuburan, stres panas, kualitas daging."
  hi: "भोजन और रेशे के पीछे पशु शरीरक्रिया: विकास, दुग्धस्राव, प्रजनन, गर्मी तनाव, मांस गुणवत्ता।"
outcomes:
  - en: "Explain how muscle becomes meat"
    zh: "解释肌肉如何变成肉"
    zh-TW: "解釋肌肉如何變成肉"
    ja: "筋肉が食肉になる過程を説明する"
    ko: "근육이 고기가 되는 과정 설명하기"
    vi: "Giải thích cơ chuyển thành thịt ra sao"
    ms: "Terangkan bagaimana otot menjadi daging"
    id: "Menjelaskan proses otot menjadi daging"
    hi: "मांसपेशी के मांस बनने की प्रक्रिया समझाना"
  - en: "Explain how heat stress affects production"
    zh: "解释环境应激对生产的影响"
    zh-TW: "解釋環境緊迫對生產的影響"
    ja: "環境ストレスが生産に与える影響を説明する"
    ko: "환경 스트레스가 생산에 주는 영향 설명하기"
    vi: "Giải thích stress môi trường ảnh hưởng sản xuất"
    ms: "Terangkan kesan tekanan persekitaran pada pengeluaran"
    id: "Menjelaskan dampak stres lingkungan pada produksi"
    hi: "पर्यावरणीय तनाव का उत्पादन पर असर समझाना"
