code: FLTV10006
year: 2026
learn:
  en: "Hands-on filmmaking basics: camera, lighting and production skills, short practical films, and crew roles on classmates' shoots."
  zh: "动手学电影制作基础：摄影、灯光与制片，拍短片，并在同学的片场担任剧组职位。"
  zh-TW: "動手學電影製作基礎：攝影、燈光與製片，拍短片，並在同學的片場擔任劇組職位。"
  ja: "映画制作の基礎を実践：撮影・照明・制作、短い実習作品、仲間の撮影でスタッフを担当。"
  ko: "영화 제작 기초 실습: 촬영, 조명, 제작, 짧은 실습 영화, 동료 촬영장에서 스태프 역할."
  vi: "Cơ bản làm phim thực hành: máy quay, ánh sáng, sản xuất, phim ngắn bài tập và làm ê-kíp cho bạn học."
  ms: "Asas pembikinan filem secara amali: kamera, pencahayaan, produksi, filem pendek dan peranan kru."
  id: "Dasar pembuatan film praktis: kamera, tata cahaya, produksi, film pendek dan peran kru teman."
  hi: "फ़िल्म निर्माण की बुनियाद: कैमरा, लाइटिंग, प्रोडक्शन, छोटी प्रैक्टिकल फ़िल्में और साथियों की शूटिंग में क्रू भूमिका।"
outcomes:
  - en: "Shoot short film exercises using screen language"
    zh: "运用镜头语言拍摄短片练习"
    zh-TW: "運用鏡頭語言拍攝短片練習"
    ja: "映像言語を使って短い作品を撮る"
    ko: "영상 언어로 짧은 실습 영화 찍기"
    vi: "Quay bài tập phim ngắn bằng ngôn ngữ điện ảnh"
    ms: "Rakam latihan filem pendek guna bahasa skrin"
    id: "Merekam latihan film pendek dengan bahasa layar"
    hi: "स्क्रीन भाषा से छोटी फ़िल्म अभ्यास शूट करना"
  - en: "Prepare pre-production and safety paperwork"
    zh: "准备前期制作与安全文件"
    zh-TW: "準備前期製作與安全文件"
    ja: "撮影前の書類と安全書類を整える"
    ko: "프리프로덕션·안전 서류 준비하기"
    vi: "Chuẩn bị giấy tờ tiền kỳ và an toàn"
    ms: "Sediakan dokumen praproduksi dan keselamatan"
    id: "Menyiapkan dokumen praproduksi dan keselamatan"
    hi: "प्री-प्रोडक्शन और सुरक्षा कागज़ तैयार करना"
  - en: "Work on a film crew in camera and lighting roles"
    zh: "在剧组中担任摄影与灯光工作"
    zh-TW: "在劇組中擔任攝影與燈光工作"
    ja: "撮影・照明スタッフとして働く"
    ko: "촬영·조명 스태프로 일하기"
    vi: "Làm ê-kíp ở vị trí quay phim, ánh sáng"
    ms: "Bekerja sebagai kru kamera dan pencahayaan"
    id: "Bekerja sebagai kru kamera dan tata cahaya"
    hi: "कैमरा और लाइटिंग क्रू में काम करना"
