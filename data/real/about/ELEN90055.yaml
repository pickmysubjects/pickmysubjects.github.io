code: ELEN90055
year: 2027
learn:
  en: "Feedback control with classical frequency-domain methods, using MATLAB/Simulink and lab hardware."
  zh: "用经典频域方法学习反馈控制，使用 MATLAB/Simulink 和实验硬件。"
  zh-TW: "以古典頻域方法學習回授控制，使用 MATLAB/Simulink 與實驗硬體。"
  ja: "古典的な周波数領域の手法によるフィードバック制御。MATLAB/Simulinkと実験装置を使う。"
  ko: "고전 주파수 영역 기법으로 배우는 피드백 제어. MATLAB/Simulink와 실험 장비 사용."
  vi: "Điều khiển phản hồi bằng phương pháp miền tần số cổ điển, dùng MATLAB/Simulink và phần cứng thí nghiệm."
  ms: "Kawalan suap balik dengan kaedah domain frekuensi klasik, menggunakan MATLAB/Simulink dan perkakasan makmal."
  id: "Kendali umpan balik dengan metode domain frekuensi klasik, memakai MATLAB/Simulink dan perangkat keras laboratorium."
  hi: "क्लासिकल फ़्रीक्वेंसी-डोमेन विधियों से फ़ीडबैक नियंत्रण, MATLAB/Simulink और लैब हार्डवेयर के साथ।"
outcomes:
  - en: "Explain the role of feedback in engineering systems"
    zh: "说明反馈在工程系统中的作用"
    zh-TW: "說明回授在工程系統中的作用"
    ja: "工学システムにおけるフィードバックの役割を説明する"
    ko: "공학 시스템에서 피드백의 역할 설명하기"
    vi: "Giải thích vai trò của phản hồi trong hệ thống kỹ thuật"
    ms: "Menerangkan peranan suap balik dalam sistem kejuruteraan"
    id: "Menjelaskan peran umpan balik dalam sistem teknik"
    hi: "इंजीनियरिंग प्रणालियों में फ़ीडबैक की भूमिका समझाना"
  - en: "Design controllers with Bode and Nyquist methods"
    zh: "用 Bode 图和 Nyquist 方法设计控制器"
    zh-TW: "以 Bode 圖與 Nyquist 方法設計控制器"
    ja: "ボード線図とナイキスト法で制御器を設計する"
    ko: "보드 선도와 나이퀴스트 방법으로 제어기 설계하기"
    vi: "Thiết kế bộ điều khiển bằng phương pháp Bode và Nyquist"
    ms: "Mereka bentuk pengawal dengan kaedah Bode dan Nyquist"
    id: "Merancang pengendali dengan metode Bode dan Nyquist"
    hi: "बोड और नाइक्विस्ट विधियों से कंट्रोलर डिज़ाइन करना"
  - en: "Simulate control systems with software"
    zh: "用软件仿真控制系统"
    zh-TW: "以軟體模擬控制系統"
    ja: "ソフトで制御系をシミュレーションする"
    ko: "소프트웨어로 제어 시스템 시뮬레이션하기"
    vi: "Mô phỏng hệ thống điều khiển bằng phần mềm"
    ms: "Mensimulasikan sistem kawalan dengan perisian"
    id: "Mensimulasikan sistem kendali dengan perangkat lunak"
    hi: "सॉफ़्टवेयर से नियंत्रण प्रणालियों का सिमुलेशन"
