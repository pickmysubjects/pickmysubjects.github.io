code: GDES30006
year: 2026
learn:
  en: "Design your own letterforms and play with layout: lettering for logos, brands and experimental graphic design."
  zh: "设计自己的字形并尝试版式：用于标志、品牌和实验性平面设计的字体创作。"
  zh-TW: "設計自己的字形並嘗試版面：用於標誌、品牌和實驗性平面設計的字體創作。"
  ja: "独自の文字をデザインしレイアウトを試す。ロゴ、ブランド、実験的グラフィックのための文字。"
  ko: "자신만의 글자꼴을 디자인하고 레이아웃을 실험한다. 로고·브랜드·실험적 그래픽용 레터링."
  vi: "Tự thiết kế chữ và thử bố cục: chữ cho logo, thương hiệu và đồ họa thử nghiệm."
  ms: "Reka bentuk huruf sendiri dan main susun atur: huruf untuk logo, jenama dan grafik eksperimen."
  id: "Mendesain huruf sendiri dan bereksperimen tata letak: huruf untuk logo, merek, grafis eksperimental."
  hi: "अपने अक्षर-रूप डिज़ाइन करना और लेआउट आज़माना: लोगो, ब्रांड और प्रयोगात्मक ग्राफ़िक के लिए।"
outcomes:
  - en: "Draw and refine custom letterforms"
    zh: "绘制并完善定制字形"
    zh-TW: "繪製並完善客製字形"
    ja: "オリジナルの字形を描き整える"
    ko: "맞춤 글자꼴 그리고 다듬기"
    vi: "Vẽ và hoàn thiện chữ riêng"
    ms: "Lukis dan perhalusi bentuk huruf tersendiri"
    id: "Menggambar dan menyempurnakan huruf khusus"
    hi: "कस्टम अक्षर-रूप बनाना और निखारना"
  - en: "Trace how lettering has shaped communication"
    zh: "了解字体如何塑造了传播方式"
    zh-TW: "了解字體如何形塑了傳播方式"
    ja: "文字が伝達をどう形作ってきたかたどる"
    ko: "레터링이 소통을 어떻게 바꿨는지 살피기"
    vi: "Tìm hiểu chữ đã định hình giao tiếp ra sao"
    ms: "Jejak cara huruf membentuk komunikasi"
    id: "Menelusuri peran huruf dalam komunikasi"
    hi: "अक्षर-लेखन ने संचार को कैसे आकार दिया, समझना"
  - en: "Build a folio of logo and brand lettering"
    zh: "完成标志与品牌字体作品集"
    zh-TW: "完成標誌與品牌字體作品集"
    ja: "ロゴやブランドの文字作品集をつくる"
    ko: "로고·브랜드 레터링 포트폴리오 만들기"
    vi: "Làm hồ sơ chữ logo và thương hiệu"
    ms: "Bina folio huruf logo dan jenama"
    id: "Menyusun portofolio huruf logo dan merek"
    hi: "लोगो व ब्रांड लेटरिंग का फ़ोलियो बनाना"
