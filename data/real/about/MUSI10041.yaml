code: MUSI10041
year: 2026
learn:
  en: "Play Baroque music on period instruments at A415 pitch in a weekly ensemble, ending in a concert."
  zh: "在每周合奏中用古乐器以A415音高演奏巴洛克音乐，期末举行音乐会。"
  zh-TW: "在每週合奏中以古樂器用A415音高演奏巴洛克音樂，期末舉行音樂會。"
  ja: "毎週のアンサンブルで古楽器を使いA415でバロック音楽を演奏し、学期末に演奏会。"
  ko: "매주 앙상블에서 시대 악기로 A415 음높이의 바로크 음악을 연주하고 학기 말 공연."
  vi: "Chơi nhạc Baroque bằng nhạc cụ cổ ở cao độ A415 trong dàn nhạc hằng tuần, kết thúc bằng buổi diễn."
  ms: "Main muzik Barok dengan alat zaman itu pada pic A415 dalam ensembel mingguan, diakhiri konsert."
  id: "Memainkan musik Barok dengan alat musik zaman itu pada nada A415 tiap minggu, diakhiri konser."
  hi: "साप्ताहिक समूह में पुराने वाद्यों पर A415 पिच में बारोक संगीत बजाना, अंत में कॉन्सर्ट।"
outcomes:
  - en: "Use historical performance styles"
    zh: "运用历史演奏风格"
    zh-TW: "運用歷史演奏風格"
    ja: "歴史的な演奏様式を使う"
    ko: "역사적 연주 양식 활용하기"
    vi: "Dùng phong cách biểu diễn lịch sử"
    ms: "Guna gaya persembahan sejarah"
    id: "Memakai gaya pertunjukan historis"
    hi: "ऐतिहासिक वादन शैली अपनाना"
  - en: "Play confidently on a period instrument"
    zh: "自信地演奏古乐器"
    zh-TW: "自信地演奏古樂器"
    ja: "古楽器を自信を持って弾く"
    ko: "시대 악기를 자신 있게 연주하기"
    vi: "Tự tin chơi nhạc cụ cổ"
    ms: "Main alat muzik lama dengan yakin"
    id: "Percaya diri memainkan alat musik kuno"
    hi: "पुराने वाद्य को आत्मविश्वास से बजाना"
  - en: "Prepare and perform your part in an ensemble"
    zh: "准备并在合奏中演奏自己的声部"
    zh-TW: "準備並在合奏中演奏自己的聲部"
    ja: "合奏で自分のパートを準備し演奏する"
    ko: "앙상블에서 자기 파트 준비·연주하기"
    vi: "Chuẩn bị và chơi bè của mình"
    ms: "Sedia dan main bahagian sendiri"
    id: "Menyiapkan dan memainkan bagian sendiri"
    hi: "समूह में अपना भाग तैयार कर बजाना"
