code: MUSI30249
year: 2026
learn:
  en: "Western art music since 1900 in its social and political setting, ending in a research essay on Australian music."
  zh: "1900年以来的西方艺术音乐及其社会政治背景，最后写一篇澳洲音乐研究论文。"
  zh-TW: "1900年以來的西方藝術音樂及其社會政治背景，最後寫一篇澳洲音樂研究論文。"
  ja: "1900年以降の西洋芸術音楽を社会・政治的背景とともに学び、豪州音楽の研究論文を書く。"
  ko: "1900년 이후 서양 예술음악을 사회·정치적 맥락에서 배우고 호주 음악 연구 에세이 작성."
  vi: "Âm nhạc nghệ thuật phương Tây từ 1900 trong bối cảnh xã hội, chính trị; viết tiểu luận về nhạc Úc."
  ms: "Muzik seni Barat sejak 1900 dalam konteks sosial dan politik; esei kajian tentang muzik Australia."
  id: "Musik seni Barat sejak 1900 dalam konteks sosial-politik; esai riset tentang musik Australia."
  hi: "1900 के बाद का पश्चिमी कला संगीत, सामाजिक-राजनीतिक संदर्भ में; ऑस्ट्रेलियाई संगीत पर शोध निबंध।"
outcomes:
  - en: "Place 20th-century music in context"
    zh: "把20世纪音乐放回其时代背景"
    zh-TW: "把20世紀音樂放回其時代背景"
    ja: "20世紀の音楽を文脈の中で捉える"
    ko: "20세기 음악을 맥락 속에서 이해하기"
    vi: "Đặt nhạc thế kỷ 20 vào bối cảnh"
    ms: "Letak muzik abad ke-20 dalam konteks"
    id: "Menempatkan musik abad ke-20 dalam konteks"
    hi: "20वीं सदी के संगीत को संदर्भ में समझना"
  - en: "Tell modern styles apart by ear"
    zh: "凭听觉辨别现代音乐风格"
    zh-TW: "憑聽覺辨別現代音樂風格"
    ja: "現代の様式を耳で聴き分ける"
    ko: "현대 양식을 귀로 구별하기"
    vi: "Nhận ra phong cách hiện đại bằng tai"
    ms: "Bezakan gaya moden melalui pendengaran"
    id: "Membedakan gaya modern lewat pendengaran"
    hi: "आधुनिक शैलियाँ सुनकर पहचानना"
  - en: "Research and write about music"
    zh: "进行音乐研究并撰写论文"
    zh-TW: "進行音樂研究並撰寫論文"
    ja: "音楽について調べて論文を書く"
    ko: "음악을 연구하고 글쓰기"
    vi: "Nghiên cứu và viết về âm nhạc"
    ms: "Kaji dan tulis tentang muzik"
    id: "Meneliti dan menulis tentang musik"
    hi: "संगीत पर शोध और लेखन"
