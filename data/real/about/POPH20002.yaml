code: POPH20002
year: 2026
learn:
  en: "Learn epidemiology as public health staff on a fictional island, tackling outbreaks, chronic disease and health data."
  zh: "以虚构岛国卫生部门工作人员的身份学流行病学，应对疫情、慢性病和健康数据。"
  zh-TW: "以虛構島國衛生部門人員的身分學流行病學，應對疫情、慢性病和健康數據。"
  ja: "架空の島国の保健担当者として、感染症や慢性疾患、健康データに取り組み疫学を学ぶ。"
  ko: "가상 섬나라 보건 담당자가 되어 감염병·만성질환·보건 데이터를 다루며 역학 배우기."
  vi: "Học dịch tễ học trong vai cán bộ y tế một đảo quốc giả tưởng, xử lý dịch bệnh và dữ liệu sức khỏe."
  ms: "Belajar epidemiologi sebagai pegawai kesihatan awam di pulau rekaan, menangani wabak dan data kesihatan."
  id: "Belajar epidemiologi sebagai petugas kesehatan di negara pulau fiktif, menangani wabah dan data kesehatan."
  hi: "एक काल्पनिक द्वीप के जन स्वास्थ्य अधिकारी बनकर महामारी, पुरानी बीमारियाँ और स्वास्थ्य डेटा पर काम करते हुए एपिडेमियोलॉजी सीखना।"
outcomes:
  - en: "Measure disease in a population"
    zh: "衡量人群中的疾病情况"
    zh-TW: "衡量人群中的疾病狀況"
    ja: "集団の中の疾病を測る"
    ko: "인구 집단의 질병 측정하기"
    vi: "Đo lường bệnh tật trong cộng đồng"
    ms: "Ukur penyakit dalam populasi"
    id: "Mengukur penyakit dalam populasi"
    hi: "आबादी में बीमारी को मापना"
  - en: "Explain social and environmental causes of ill health"
    zh: "解释健康问题的社会和环境成因"
    zh-TW: "解釋健康問題的社會和環境成因"
    ja: "健康を損なう社会・環境要因を説明する"
    ko: "건강 악화의 사회·환경적 원인 설명하기"
    vi: "Giải thích nguyên nhân xã hội và môi trường gây bệnh"
    ms: "Terangkan punca sosial dan alam sekitar kesihatan buruk"
    id: "Menjelaskan penyebab sosial dan lingkungan masalah kesehatan"
    hi: "ख़राब स्वास्थ्य के सामाजिक और पर्यावरणीय कारण समझाना"
  - en: "Present health data clearly to others"
    zh: "向他人清楚地呈现健康数据"
    zh-TW: "向他人清楚地呈現健康數據"
    ja: "健康データをわかりやすく伝える"
    ko: "보건 데이터를 명확히 전달하기"
    vi: "Trình bày dữ liệu sức khỏe rõ ràng"
    ms: "Bentang data kesihatan dengan jelas"
    id: "Menyajikan data kesehatan dengan jelas"
    hi: "स्वास्थ्य डेटा दूसरों को साफ़ तरह से दिखाना"
