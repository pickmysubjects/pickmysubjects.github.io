code: ECOM90020
year: 2027
learn:
  en: "Computer techniques for economics and business: data visualisation, simulation, linear programming and efficiency analysis."
  zh: "经管中的计算机方法：数据可视化、模拟、线性规划与效率分析。"
  zh-TW: "經管中的電腦方法：資料視覺化、模擬、線性規劃與效率分析。"
  ja: "経済・ビジネスのコンピュータ技法：可視化、シミュレーション、線形計画、効率性分析。"
  ko: "경제·경영 컴퓨터 기법: 데이터 시각화, 시뮬레이션, 선형계획, 효율성 분석."
  vi: "Kỹ thuật máy tính cho kinh tế, kinh doanh: trực quan hóa, mô phỏng, quy hoạch tuyến tính, phân tích hiệu quả."
  ms: "Teknik komputer untuk ekonomi dan perniagaan: visualisasi data, simulasi, pengaturcaraan linear dan analisis kecekapan."
  id: "Teknik komputer untuk ekonomi dan bisnis: visualisasi data, simulasi, pemrograman linear, dan analisis efisiensi."
  hi: "अर्थशास्त्र व व्यवसाय की कंप्यूटर तकनीकें: डेटा विज़ुअलाइज़ेशन, सिमुलेशन, लीनियर प्रोग्रामिंग, दक्षता विश्लेषण।"
outcomes:
  - en: "Summarise and visualise survey and scanner data"
    zh: "汇总并可视化调查与扫码数据"
    zh-TW: "彙整並視覺化調查與掃描資料"
    ja: "調査・POSデータを要約し可視化する"
    ko: "설문·스캐너 데이터 요약과 시각화"
    vi: "Tóm tắt và trực quan hóa dữ liệu khảo sát"
    ms: "Meringkas dan memvisualkan data tinjauan"
    id: "Merangkum dan memvisualkan data survei"
    hi: "सर्वे व स्कैनर डेटा का सार व विज़ुअल"
  - en: "Measure firm efficiency with DEA"
    zh: "用 DEA 衡量企业效率"
    zh-TW: "用 DEA 衡量企業效率"
    ja: "DEAで企業の効率を測る"
    ko: "DEA로 기업 효율성 측정하기"
    vi: "Đo hiệu quả doanh nghiệp bằng DEA"
    ms: "Mengukur kecekapan firma dengan DEA"
    id: "Mengukur efisiensi perusahaan dengan DEA"
    hi: "DEA से फ़र्म की दक्षता मापना"
