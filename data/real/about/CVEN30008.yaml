code: CVEN30008
year: 2026
learn:
  en: "How to find, analyse and manage risk in engineering projects using the ISO 31000 standard and simulation."
  zh: "如何用ISO 31000标准和模拟方法识别、分析和管理工程风险。"
  zh-TW: "如何用ISO 31000標準與模擬方法辨識、分析與管理工程風險。"
  ja: "ISO 31000とシミュレーションで工学プロジェクトのリスクを特定・分析・管理する。"
  ko: "ISO 31000 표준과 시뮬레이션으로 공학 프로젝트 위험을 찾고 분석·관리하는 법."
  vi: "Cách nhận diện, phân tích, quản lý rủi ro dự án kỹ thuật theo ISO 31000 và mô phỏng."
  ms: "Cara mengenal pasti, menganalisis dan mengurus risiko projek kejuruteraan dengan ISO 31000 dan simulasi."
  id: "Cara mengenali, menganalisis, dan mengelola risiko proyek teknik dengan ISO 31000 dan simulasi."
  hi: "ISO 31000 और सिमुलेशन से इंजीनियरिंग प्रोजेक्ट के जोखिम पहचानना, विश्लेषण व प्रबंधन करना।"
outcomes:
  - en: "Rate risks by severity and likelihood"
    zh: "按严重性和可能性评级风险"
    zh-TW: "依嚴重性與可能性評級風險"
    ja: "重大度と発生確率でリスクを評価する"
    ko: "심각도와 가능성으로 위험 평가하기"
    vi: "Xếp hạng rủi ro theo mức độ và khả năng"
    ms: "Menilai risiko ikut keterukan dan kebarangkalian"
    id: "Menilai risiko menurut dampak dan peluang"
    hi: "गंभीरता और संभावना से जोखिम आँकना"
  - en: "Build a risk plan using AS ISO 31000"
    zh: "按AS ISO 31000制定风险计划"
    zh-TW: "依AS ISO 31000擬定風險計畫"
    ja: "AS ISO 31000でリスク計画を作る"
    ko: "AS ISO 31000으로 위험 계획 수립하기"
    vi: "Lập kế hoạch rủi ro theo AS ISO 31000"
    ms: "Membina pelan risiko dengan AS ISO 31000"
    id: "Menyusun rencana risiko dengan AS ISO 31000"
    hi: "AS ISO 31000 से जोखिम योजना बनाना"
  - en: "Predict failures with Monte Carlo simulation"
    zh: "用蒙特卡洛模拟预测失效"
    zh-TW: "用蒙地卡羅模擬預測失效"
    ja: "モンテカルロ法で故障を予測する"
    ko: "몬테카를로 시뮬레이션으로 고장 예측하기"
    vi: "Dự đoán hỏng hóc bằng mô phỏng Monte Carlo"
    ms: "Meramal kegagalan dengan simulasi Monte Carlo"
    id: "Memprediksi kegagalan dengan simulasi Monte Carlo"
    hi: "मोंटे कार्लो सिमुलेशन से विफलताएँ अनुमानित करना"
