code: PSYC10007
year: 2026
learn:
  en: "A short online intro to psychology: development, personality, social and clinical psychology, and research methods."
  zh: "线上短期的心理学入门：发展、人格、社会和临床心理学，以及研究方法。"
  zh-TW: "線上短期的心理學入門：發展、人格、社會和臨床心理學，以及研究方法。"
  ja: "オンラインで短期間に学ぶ心理学入門：発達、性格、社会・臨床心理学、研究方法。"
  ko: "온라인 단기 심리학 입문: 발달, 성격, 사회·임상 심리학과 연구 방법."
  vi: "Nhập môn tâm lý học trực tuyến, ngắn hạn: phát triển, nhân cách, tâm lý xã hội, lâm sàng và phương pháp nghiên cứu."
  ms: "Pengenalan psikologi dalam talian yang ringkas: perkembangan, personaliti, psikologi sosial dan klinikal, serta kaedah kajian."
  id: "Pengantar psikologi daring yang singkat: perkembangan, kepribadian, psikologi sosial dan klinis, serta metode penelitian."
  hi: "ऑनलाइन, छोटा मनोविज्ञान परिचय: विकास, व्यक्तित्व, सामाजिक व क्लिनिकल मनोविज्ञान और रिसर्च मेथड।"
outcomes:
  - en: "Explain key ideas about development, personality and social behaviour"
    zh: "解释发展、人格和社会行为的核心观点"
    zh-TW: "解釋發展、人格和社會行為的核心觀點"
    ja: "発達・性格・社会的行動の基本的な考え方を説明する"
    ko: "발달, 성격, 사회적 행동의 핵심 개념 설명하기"
    vi: "Giải thích ý chính về phát triển, nhân cách và hành vi xã hội"
    ms: "Terangkan idea utama tentang perkembangan, personaliti dan tingkah laku sosial"
    id: "Menjelaskan gagasan utama tentang perkembangan, kepribadian, dan perilaku sosial"
    hi: "विकास, व्यक्तित्व और सामाजिक व्यवहार के मुख्य विचार समझाना"
  - en: "Read psychology research with a critical eye"
    zh: "带着批判眼光阅读心理学研究"
    zh-TW: "帶著批判眼光閱讀心理學研究"
    ja: "心理学の研究を批判的に読む"
    ko: "심리학 연구를 비판적으로 읽기"
    vi: "Đọc nghiên cứu tâm lý học với con mắt phản biện"
    ms: "Baca kajian psikologi secara kritis"
    id: "Membaca penelitian psikologi secara kritis"
    hi: "मनोविज्ञान की रिसर्च को आलोचनात्मक नज़र से पढ़ना"
  - en: "Analyse simple data and write a psychology report"
    zh: "分析简单数据并写心理学报告"
    zh-TW: "分析簡單資料並寫心理學報告"
    ja: "簡単なデータを分析して心理学のレポートを書く"
    ko: "간단한 데이터를 분석하고 심리학 보고서 쓰기"
    vi: "Phân tích dữ liệu đơn giản và viết báo cáo tâm lý học"
    ms: "Analisis data mudah dan tulis laporan psikologi"
    id: "Menganalisis data sederhana dan menulis laporan psikologi"
    hi: "सरल डेटा का विश्लेषण करके साइकोलॉजी रिपोर्ट लिखना"
