code: AGRI30005
year: 2027
learn:
  en: "A year-long project on a real industry issue, planned with a supervisor and industry partners, ending in a report and talk."
  zh: "为期一年的行业项目：与导师和行业伙伴一起研究实际问题，最后提交报告并做展示。"
  zh-TW: "為期一年的產業專題：與指導老師和產業夥伴一起研究實際問題，最後提交報告並發表。"
  ja: "実際の業界課題に取り組む通年プロジェクト。指導教員や業界と計画し、報告書と発表で締めくくる。"
  ko: "실제 산업 문제를 다루는 1년 프로젝트: 지도교수·산업 파트너와 함께 계획하고 보고서와 발표로 마무리."
  vi: "Dự án cả năm về một vấn đề thực tế của ngành, lên kế hoạch cùng giảng viên hướng dẫn và đối tác, kết thúc bằng báo cáo và thuyết trình."
  ms: "Projek setahun tentang isu industri sebenar, dirancang bersama penyelia dan rakan industri, diakhiri laporan dan pembentangan."
  id: "Proyek setahun tentang isu industri nyata, direncanakan bersama pembimbing dan mitra industri, diakhiri laporan dan presentasi."
  hi: "किसी असली उद्योग समस्या पर साल भर का प्रोजेक्ट, सुपरवाइज़र और उद्योग साझेदारों के साथ, अंत में रिपोर्ट और प्रेज़ेंटेशन।"
outcomes:
  - en: "Review literature and industry evidence on a topic"
    zh: "梳理某一课题的文献和行业资料"
    zh-TW: "梳理某一主題的文獻和產業資料"
    ja: "テーマに関する文献と業界情報をまとめる"
    ko: "주제에 관한 문헌과 산업 자료 검토하기"
    vi: "Tổng hợp tài liệu và bằng chứng ngành về một chủ đề"
    ms: "Kaji literatur dan bukti industri tentang sesuatu topik"
    id: "Mengkaji literatur dan bukti industri tentang suatu topik"
    hi: "किसी विषय पर साहित्य और उद्योग के प्रमाणों की समीक्षा"
  - en: "Plan a project and its research method"
    zh: "规划项目及研究方法"
    zh-TW: "規劃專題及研究方法"
    ja: "プロジェクトと調査方法を計画する"
    ko: "프로젝트와 연구 방법 계획하기"
    vi: "Lập kế hoạch dự án và phương pháp nghiên cứu"
    ms: "Rancang projek dan kaedah penyelidikannya"
    id: "Merencanakan proyek dan metode penelitiannya"
    hi: "प्रोजेक्ट और उसकी शोध पद्धति की योजना बनाना"
  - en: "Report and present results to industry and others"
    zh: "向行业及其他受众报告和展示成果"
    zh-TW: "向產業及其他受眾報告和發表成果"
    ja: "業界などに向けて結果を報告・発表する"
    ko: "산업계 등 청중에게 결과 보고·발표하기"
    vi: "Báo cáo và trình bày kết quả cho doanh nghiệp và người khác"
    ms: "Laporkan dan bentangkan hasil kepada industri dan lain-lain"
    id: "Melaporkan dan mempresentasikan hasil ke industri dan lainnya"
    hi: "उद्योग और अन्य लोगों के सामने नतीजे रिपोर्ट व प्रस्तुत करना"
