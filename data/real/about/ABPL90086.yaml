code: ABPL90086
year: 2027
learn:
  en: "Human, mechanical and natural systems in building design: comfort, HVAC, energy, passive design, water and green roofs."
  zh: "建筑设计中的人体、机械和自然系统：舒适度、暖通空调、能源、被动设计、水和绿色屋顶。"
  zh-TW: "建築設計中的人體、機械與自然系統：舒適度、空調、能源、被動設計、水與綠屋頂。"
  ja: "建築設計の人・機械・自然システム：快適性、空調、エネルギー、パッシブ設計、水、屋上緑化。"
  ko: "건축 설계의 인간·기계·자연 시스템: 쾌적성, 공조, 에너지, 패시브 설계, 물, 옥상녹화."
  vi: "Hệ thống con người, cơ khí, tự nhiên trong thiết kế: tiện nghi, điều hòa, năng lượng, mái xanh."
  ms: "Sistem manusia, mekanikal dan semula jadi dalam reka bentuk: keselesaan, HVAC, tenaga dan bumbung hijau."
  id: "Sistem manusia, mekanikal dan alami dalam desain: kenyamanan, HVAC, energi dan atap hijau."
  hi: "भवन डिज़ाइन में मानव, यांत्रिक व प्राकृतिक प्रणालियाँ: आराम, HVAC, ऊर्जा, पैसिव डिज़ाइन।"
outcomes:
  - en: "Explain passive design and HVAC systems"
    zh: "解释被动设计和暖通空调系统"
    zh-TW: "解釋被動設計與空調系統"
    ja: "パッシブ設計と空調設備を説明する"
    ko: "패시브 설계와 공조 시스템 설명하기"
    vi: "Giải thích thiết kế thụ động và điều hòa"
    ms: "Menerangkan reka bentuk pasif dan HVAC"
    id: "Menjelaskan desain pasif dan sistem HVAC"
    hi: "पैसिव डिज़ाइन और HVAC प्रणालियाँ समझाना"
  - en: "Prepare a sustainable design report for a building"
    zh: "为建筑编写可持续设计报告"
    zh-TW: "為建築撰寫永續設計報告"
    ja: "建物の環境配慮設計報告を作る"
    ko: "건물의 지속가능 설계 보고서 작성하기"
    vi: "Lập báo cáo thiết kế bền vững cho tòa nhà"
    ms: "Menyediakan laporan reka bentuk mampan"
    id: "Menyusun laporan desain berkelanjutan"
    hi: "इमारत के लिए टिकाऊ डिज़ाइन रिपोर्ट बनाना"
