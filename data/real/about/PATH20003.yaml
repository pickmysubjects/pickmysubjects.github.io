code: PATH20003
year: 2026
learn:
  en: "Lab and workshop work using the practical methods scientists use to study disease."
  zh: "在实验室和研讨课里用实际方法研究疾病。"
  zh-TW: "在實驗室和工作坊裡用實際方法研究疾病。"
  ja: "実験とワークショップで、科学者が病気の研究に使う実践的な手法を学ぶ。"
  ko: "과학자들이 질병 연구에 쓰는 실용적 방법을 활용한 실험 및 워크숍."
  vi: "Thí nghiệm và workshop dùng phương pháp thực hành mà nhà khoa học dùng để nghiên cứu bệnh."
  ms: "Kerja makmal dan bengkel menggunakan kaedah praktikal yang saintis guna untuk mengkaji penyakit."
  id: "Kerja lab dan workshop dengan metode praktis yang dipakai ilmuwan untuk meneliti penyakit."
  hi: "लैब और वर्कशॉप का काम, वैज्ञानिकों के बीमारी अध्ययन वाले व्यावहारिक तरीकों से।"
outcomes:
  - en: "Run basic pathology lab techniques"
    zh: "做基础的病理学实验"
    zh-TW: "做基礎的病理學實驗"
    ja: "基本的な病理学の実験手技を行う"
    ko: "기초 병리학 실험 기법 수행하기"
    vi: "Thực hiện kỹ thuật xét nghiệm bệnh học cơ bản"
    ms: "Menjalankan teknik makmal patologi asas"
    id: "Menjalankan teknik lab patologi dasar"
    hi: "बुनियादी पैथोलॉजी लैब तकनीकें करना"
  - en: "Record lab results and draw conclusions from data"
    zh: "记录实验结果并从数据下结论"
    zh-TW: "記錄實驗結果並從資料下結論"
    ja: "実験結果を記録しデータから結論を出す"
    ko: "실험 결과를 기록하고 데이터로 결론 내리기"
    vi: "Ghi kết quả thí nghiệm và rút kết luận từ dữ liệu"
    ms: "Merekod keputusan makmal dan membuat kesimpulan daripada data"
    id: "Mencatat hasil lab dan menarik kesimpulan dari data"
    hi: "लैब नतीजे दर्ज करना और डेटा से निष्कर्ष निकालना"
  - en: "Describe the main areas of pathology"
    zh: "说出病理学的主要分支"
    zh-TW: "說出病理學的主要分支"
    ja: "病理学の主な分野を説明する"
    ko: "병리학의 주요 분야 설명하기"
    vi: "Mô tả các lĩnh vực chính của bệnh học"
    ms: "Menghuraikan bidang utama patologi"
    id: "Menjelaskan bidang utama patologi"
    hi: "पैथोलॉजी के मुख्य क्षेत्र बताना"
