code: CREA10002
year: 2026
learn:
  en: "First-semester Fine Arts subject on the Country the campus stands on, led by First Nations staff, plus the Joining Melbourne modules."
  zh: "美术学士首学期必修：由原住民教师带领认识校园所在土地，并完成入学模块。"
  zh-TW: "美術學士首學期必修：由原住民教師帶領認識校園所在土地，並完成入學模組。"
  ja: "美術学士1学期目の必修。先住民の教員と共にキャンパスの土地を学び、入学モジュールも修了する。"
  ko: "미술 학사 첫 학기 필수. 원주민 교원과 함께 캠퍼스가 자리한 땅을 배우고 입학 모듈을 마친다."
  vi: "Môn học kỳ đầu của Cử nhân Mỹ thuật về vùng đất nơi trường tọa lạc, do giảng viên bản địa dẫn dắt, kèm các mô-đun nhập học."
  ms: "Subjek semester pertama Seni Halus tentang tanah tempat kampus berdiri, dipimpin staf Orang Asli, serta modul orientasi."
  id: "Mata kuliah semester pertama Seni Rupa tentang tanah tempat kampus berdiri, dipimpin staf Pribumi, plus modul orientasi."
  hi: "फ़ाइन आर्ट्स का पहला-सेमेस्टर विषय: कैंपस की ज़मीन को आदिवासी शिक्षकों के साथ समझना, साथ में जॉइनिंग मॉड्यूल।"
outcomes:
  - en: "Reflect on your role and duties as an artist"
    zh: "反思艺术家的角色与责任"
    zh-TW: "反思藝術家的角色與責任"
    ja: "アーティストとしての役割と責任を考える"
    ko: "예술가로서의 역할과 책임 성찰하기"
    vi: "Suy ngẫm về vai trò và trách nhiệm của nghệ sĩ"
    ms: "Renungkan peranan dan tanggungjawab seorang artis"
    id: "Merenungkan peran dan tanggung jawab seniman"
    hi: "कलाकार की भूमिका और ज़िम्मेदारियों पर विचार करना"
  - en: "Respond creatively to Indigenous knowledge of place"
    zh: "以创作回应原住民的地方知识"
    zh-TW: "以創作回應原住民的地方知識"
    ja: "先住民の土地の知に創作で応える"
    ko: "원주민의 장소 지식에 창작으로 응답하기"
    vi: "Đáp lại tri thức bản địa về nơi chốn bằng sáng tác"
    ms: "Respons secara kreatif kepada ilmu Orang Asli tentang tempat"
    id: "Merespons pengetahuan Pribumi tentang tempat secara kreatif"
    hi: "जगह के बारे में आदिवासी ज्ञान पर रचनात्मक प्रतिक्रिया देना"
  - en: "Know what the university expects of you as a student"
    zh: "了解大学对学生的要求"
    zh-TW: "了解大學對學生的要求"
    ja: "大学が学生に求めることを理解する"
    ko: "대학이 학생에게 기대하는 바 이해하기"
    vi: "Hiểu trường đại học kỳ vọng gì ở sinh viên"
    ms: "Fahami apa yang universiti harapkan daripada pelajar"
    id: "Memahami harapan universitas terhadap mahasiswa"
    hi: "विश्वविद्यालय छात्रों से क्या अपेक्षा रखता है, समझना"
