code: EVSC90015
year: 2027
learn:
  en: "How to predict, monitor and assess human impacts on the environment within legal and social contexts."
  zh: "在法律和社会背景下，如何预测、监测和评估人类活动对环境的影响。"
  zh-TW: "在法律和社會背景下，如何預測、監測和評估人類活動對環境的影響。"
  ja: "法的・社会的背景の中で、人間活動の環境影響を予測・監視・評価する。"
  ko: "법적·사회적 맥락에서 인간 활동의 환경 영향을 예측·모니터링·평가합니다."
  vi: "Dự báo, giám sát và đánh giá tác động của con người lên môi trường trong bối cảnh pháp lý, xã hội."
  ms: "Meramal, memantau dan menilai kesan manusia pada alam sekitar dalam konteks undang-undang."
  id: "Memprediksi, memantau, dan menilai dampak manusia pada lingkungan dalam konteks hukum dan sosial."
  hi: "क़ानूनी व सामाजिक संदर्भ में पर्यावरण पर मानव प्रभाव का अनुमान, निगरानी और आकलन।"
outcomes:
  - en: "Explain the EIA process"
    zh: "解释环境影响评估流程"
    zh-TW: "解釋環境影響評估流程"
    ja: "環境アセスメントの流れを説明する"
    ko: "환경영향평가 절차 설명하기"
    vi: "Giải thích quy trình đánh giá tác động môi trường"
    ms: "Menerangkan proses EIA"
    id: "Menjelaskan proses AMDAL"
    hi: "EIA प्रक्रिया समझाना"
  - en: "Critique an Environmental Effects Statement"
    zh: "评析环境影响报告书"
    zh-TW: "評析環境影響報告書"
    ja: "環境影響報告書を批評する"
    ko: "환경영향평가서 비평하기"
    vi: "Phê bình báo cáo tác động môi trường"
    ms: "Mengkritik Penyata Kesan Alam Sekitar"
    id: "Mengkritisi dokumen dampak lingkungan"
    hi: "पर्यावरण प्रभाव विवरण की समीक्षा"
