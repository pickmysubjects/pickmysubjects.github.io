code: FINA20035
year: 2026
learn:
  en: "Figure drawing for beginners, working from life models and anatomy specimens to understand the human body."
  zh: "面向初学者的人体素描，通过真人模特和解剖标本理解人体。"
  zh-TW: "面向初學者的人體素描，透過真人模特兒和解剖標本理解人體。"
  ja: "初心者向けの人体デッサン。ヌードモデルと解剖標本から人体を理解する。"
  ko: "초보자를 위한 인체 드로잉. 누드모델과 해부 표본으로 인체를 이해한다."
  vi: "Vẽ hình người cho người mới, vẽ từ mẫu thật và tiêu bản giải phẫu để hiểu cơ thể."
  ms: "Lukisan figura untuk pemula, daripada model hidup dan spesimen anatomi untuk memahami tubuh."
  id: "Menggambar figur untuk pemula, dari model hidup dan spesimen anatomi untuk memahami tubuh."
  hi: "शुरुआती लोगों के लिए फ़िगर ड्रॉइंग, लाइव मॉडल और एनाटॉमी नमूनों से शरीर को समझना।"
outcomes:
  - en: "Draw the human figure from observation"
    zh: "通过观察画人体"
    zh-TW: "透過觀察畫人體"
    ja: "観察して人体を描く"
    ko: "관찰로 인체 그리기"
    vi: "Vẽ cơ thể người qua quan sát"
    ms: "Lukis figura manusia melalui pemerhatian"
    id: "Menggambar tubuh manusia dari pengamatan"
    hi: "देखकर मानव आकृति बनाना"
  - en: "Use anatomy to improve your drawing"
    zh: "用解剖知识改进素描"
    zh-TW: "用解剖知識改進素描"
    ja: "解剖の知識で描写を良くする"
    ko: "해부학으로 드로잉 개선하기"
    vi: "Dùng giải phẫu để vẽ tốt hơn"
    ms: "Guna anatomi untuk perbaiki lukisan"
    id: "Memakai anatomi untuk memperbaiki gambar"
    hi: "एनाटॉमी से ड्रॉइंग बेहतर करना"
  - en: "Show your progress in a drawing folio"
    zh: "在素描作品集中展示进步"
    zh-TW: "在素描作品集中展示進步"
    ja: "デッサン集で上達を示す"
    ko: "드로잉 포트폴리오로 발전 보여주기"
    vi: "Thể hiện tiến bộ trong tập tranh"
    ms: "Tunjuk kemajuan dalam folio lukisan"
    id: "Menunjukkan kemajuan di portofolio gambar"
    hi: "ड्रॉइंग फ़ोलियो में प्रगति दिखाना"
