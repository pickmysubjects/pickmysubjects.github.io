code: HEBR20005
year: 2026
learn:
  en: "Hebrew grammar and vocabulary built up through newspapers, magazines, short stories, poems and creative writing."
  zh: "通过报纸、杂志、短篇小说、诗歌和创意写作扩充希伯来语语法和词汇。"
  zh-TW: "透過報紙、雜誌、短篇小說、詩歌和創意寫作擴充希伯來語文法和詞彙。"
  ja: "新聞、雑誌、短編、詩、創作を通じてヘブライ語の文法と語彙を伸ばす。"
  ko: "신문·잡지·단편·시·창작 글쓰기로 히브리어 문법과 어휘를 넓힌다."
  vi: "Mở rộng ngữ pháp và từ vựng tiếng Do Thái qua báo, tạp chí, truyện ngắn, thơ và viết sáng tác."
  ms: "Membina tatabahasa dan kosa kata Ibrani melalui akhbar, majalah, cerpen, puisi dan penulisan kreatif."
  id: "Membangun tata bahasa dan kosakata Ibrani lewat koran, majalah, cerpen, puisi dan menulis kreatif."
  hi: "अख़बारों, पत्रिकाओं, कहानियों, कविताओं और रचनात्मक लेखन से हिब्रू व्याकरण और शब्दावली बढ़ाना।"
outcomes:
  - en: "Talk about familiar topics in Hebrew with more confidence"
    zh: "更自信地用希伯来语谈论熟悉的话题"
    zh-TW: "更自信地用希伯來語談論熟悉的話題"
    ja: "身近な話題をヘブライ語でより自信を持って話す"
    ko: "익숙한 주제를 히브리어로 더 자신 있게 말하기"
    vi: "Nói về chủ đề quen thuộc bằng tiếng Do Thái tự tin hơn"
    ms: "Bercakap tentang topik biasa dalam bahasa Ibrani dengan lebih yakin"
    id: "Membicarakan topik akrab dalam bahasa Ibrani dengan lebih percaya diri"
    hi: "परिचित विषयों पर हिब्रू में ज़्यादा आत्मविश्वास से बात करना"
  - en: "Read and write short Hebrew texts"
    zh: "读写简短的希伯来语文章"
    zh-TW: "讀寫簡短的希伯來語文章"
    ja: "短いヘブライ語の文章を読み書きする"
    ko: "짧은 히브리어 글 읽고 쓰기"
    vi: "Đọc và viết đoạn văn tiếng Do Thái ngắn"
    ms: "Baca dan tulis teks pendek bahasa Ibrani"
    id: "Membaca dan menulis teks pendek bahasa Ibrani"
    hi: "छोटे हिब्रू पाठ पढ़ना-लिखना"
  - en: "Use new grammar and vocabulary correctly"
    zh: "正确运用新语法和词汇"
    zh-TW: "正確運用新文法和詞彙"
    ja: "新しい文法と語彙を正しく使う"
    ko: "새 문법과 어휘를 정확히 쓰기"
    vi: "Dùng đúng ngữ pháp và từ vựng mới"
    ms: "Guna tatabahasa dan kosa kata baharu dengan betul"
    id: "Memakai tata bahasa dan kosakata baru dengan benar"
    hi: "नया व्याकरण और शब्दावली सही इस्तेमाल करना"
