code: COMP90043
year: 2027
learn:
  en: "Core cryptography, encryption, signatures and hash functions, and how it secures computers and networks."
  zh: "密码学基础：加密、签名、哈希函数，以及如何保护计算机和网络。"
  zh-TW: "密碼學基礎：加密、簽章、雜湊函數，以及如何保護電腦與網路。"
  ja: "暗号の基礎（暗号化、署名、ハッシュ）とコンピュータ・ネットワークの保護。"
  ko: "암호학 기초: 암호화, 서명, 해시 함수와 컴퓨터·네트워크 보안."
  vi: "Mật mã cơ bản: mã hóa, chữ ký, hàm băm, và cách bảo vệ máy tính, mạng."
  ms: "Asas kriptografi: penyulitan, tandatangan, fungsi cincang dan keselamatan komputer serta rangkaian."
  id: "Dasar kriptografi: enkripsi, tanda tangan, fungsi hash, dan pengamanan komputer serta jaringan."
  hi: "क्रिप्टोग्राफ़ी की बुनियाद: एन्क्रिप्शन, सिग्नेचर, हैश फ़ंक्शन, और कंप्यूटर व नेटवर्क की सुरक्षा।"
outcomes:
  - en: "Explain how encryption and digital signatures work"
    zh: "解释加密和数字签名的原理"
    zh-TW: "解釋加密與數位簽章的原理"
    ja: "暗号化とデジタル署名の仕組みを説明する"
    ko: "암호화와 디지털 서명 원리 설명하기"
    vi: "Giải thích cách mã hóa và chữ ký số hoạt động"
    ms: "Terangkan cara penyulitan dan tandatangan digital berfungsi"
    id: "Menjelaskan cara kerja enkripsi dan tanda tangan digital"
    hi: "एन्क्रिप्शन और डिजिटल सिग्नेचर कैसे काम करते हैं, समझाना"
  - en: "Analyse the security of a system or protocol"
    zh: "分析系统或协议的安全性"
    zh-TW: "分析系統或協定的安全性"
    ja: "システムやプロトコルの安全性を分析する"
    ko: "시스템·프로토콜 보안성 분석하기"
    vi: "Phân tích độ an toàn của hệ thống hoặc giao thức"
    ms: "Analisis keselamatan sistem atau protokol"
    id: "Menganalisis keamanan sistem atau protokol"
    hi: "किसी सिस्टम या प्रोटोकॉल की सुरक्षा का विश्लेषण"
