code: MAST30036
year: 2027
learn:
  en: "Enumerative, algebraic and extremal combinatorics: generating functions, partitions, symmetric functions, graphs and Ramsey theory."
  zh: "计数、代数和极值组合学：生成函数、整数分拆、对称函数、图和拉姆齐理论。"
  zh-TW: "計數、代數和極值組合學：生成函數、整數分割、對稱函數、圖和拉姆齊理論。"
  ja: "数え上げ・代数・極値組合せ論：母関数、分割、対称関数、グラフ、ラムゼー理論。"
  ko: "열거·대수·극값 조합론: 생성함수, 분할, 대칭함수, 그래프, 램지 이론."
  vi: "Tổ hợp liệt kê, đại số và cực trị: hàm sinh, phân hoạch, hàm đối xứng, đồ thị và lý thuyết Ramsey."
  ms: "Kombinatorik enumeratif, algebra dan ekstremal: fungsi penjana, partisi, fungsi simetri, graf dan teori Ramsey."
  id: "Kombinatorika enumeratif, aljabar, dan ekstremal: fungsi pembangkit, partisi, fungsi simetris, graf, dan teori Ramsey."
  hi: "गणनात्मक, बीजगणितीय और चरम संयोजिकी: जनक फलन, विभाजन, सममित फलन, ग्राफ़ और रैमसी सिद्धांत।"
outcomes:
  - en: "Use generating functions to count and estimate growth"
    zh: "用生成函数解决计数和渐近问题"
    zh-TW: "用生成函數解決計數和漸近問題"
    ja: "母関数で数え上げと漸近解析を行う"
    ko: "생성함수로 경우의 수와 점근 분석 풀기"
    vi: "Dùng hàm sinh để đếm và phân tích tiệm cận"
    ms: "Guna fungsi penjana untuk membilang dan analisis asimptot"
    id: "Memakai fungsi pembangkit untuk mencacah dan analisis asimtotik"
    hi: "जनक फलनों से गिनती और वृद्धि का अनुमान लगाना"
  - en: "Apply Sperner's and Ramsey's theorems to problems"
    zh: "运用Sperner定理和Ramsey定理解题"
    zh-TW: "運用Sperner定理和Ramsey定理解題"
    ja: "スペルナーの定理やラムゼーの定理を問題に使う"
    ko: "슈페르너 정리와 램지 정리를 문제에 적용하기"
    vi: "Áp dụng định lý Sperner và Ramsey để giải bài toán"
    ms: "Gunakan teorem Sperner dan Ramsey untuk menyelesaikan masalah"
    id: "Menerapkan teorema Sperner dan Ramsey pada soal"
    hi: "स्पर्नर और रैमसी प्रमेयों से सवाल हल करना"
  - en: "Write rigorous combinatorial proofs"
    zh: "写出严谨的组合证明"
    zh-TW: "寫出嚴謹的組合證明"
    ja: "厳密な組合せ論の証明を書く"
    ko: "엄밀한 조합론적 증명 쓰기"
    vi: "Viết chứng minh tổ hợp chặt chẽ"
    ms: "Tulis bukti kombinatorik yang rapi"
    id: "Menulis bukti kombinatorika yang ketat"
    hi: "सख़्त संयोजिकी प्रमाण लिखना"
