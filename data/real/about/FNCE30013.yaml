code: FNCE30013
year: 2026
learn:
  en: "How investors bring ESG and social impact into investment decisions, voting and engagement with companies."
  zh: "投资者如何把ESG和社会影响纳入投资、投票和企业沟通。"
  zh-TW: "投資人如何把ESG和社會影響納入投資、投票和企業議合。"
  ja: "投資家がESGや社会的インパクトを投資判断・議決権行使・対話に取り入れる方法。"
  ko: "투자자가 ESG와 사회적 영향을 투자 결정, 의결권, 기업 관여에 반영하는 방법."
  vi: "Nhà đầu tư đưa ESG và tác động xã hội vào quyết định đầu tư, bỏ phiếu và đối thoại với doanh nghiệp ra sao."
  ms: "Cara pelabur memasukkan ESG dan impak sosial ke dalam keputusan pelaburan, pengundian dan libat urus dengan syarikat."
  id: "Cara investor memasukkan ESG dan dampak sosial ke keputusan investasi, voting, dan keterlibatan dengan perusahaan."
  hi: "निवेशक ESG और सामाजिक प्रभाव को निवेश फ़ैसलों, वोटिंग और कंपनियों से जुड़ाव में कैसे शामिल करते हैं।"
outcomes:
  - en: "Use tools to factor ESG risk into investments"
    zh: "用工具把ESG风险纳入投资决策"
    zh-TW: "用工具把ESG風險納入投資決策"
    ja: "ESGリスクを投資判断に組み込む手法を使う"
    ko: "도구로 ESG 위험을 투자에 반영하기"
    vi: "Dùng công cụ đưa rủi ro ESG vào đầu tư"
    ms: "Guna alat untuk ambil kira risiko ESG dalam pelaburan"
    id: "Memakai alat untuk memasukkan risiko ESG ke investasi"
    hi: "निवेश में ESG जोखिम शामिल करने के टूल इस्तेमाल करना"
  - en: "Build portfolios that include ESG factors"
    zh: "构建纳入ESG因素的投资组合"
    zh-TW: "建構納入ESG因素的投資組合"
    ja: "ESG要因を含むポートフォリオを組む"
    ko: "ESG 요인을 넣은 포트폴리오 구성하기"
    vi: "Xây danh mục có tính đến yếu tố ESG"
    ms: "Bina portfolio yang ambil kira faktor ESG"
    id: "Menyusun portofolio yang memuat faktor ESG"
    hi: "ESG कारकों वाले पोर्टफ़ोलियो बनाना"
  - en: "Evaluate impact investing products and strategies"
    zh: "评估影响力投资的产品和策略"
    zh-TW: "評估影響力投資的產品和策略"
    ja: "インパクト投資の商品と戦略を評価する"
    ko: "임팩트 투자 상품과 전략 평가하기"
    vi: "Đánh giá sản phẩm và chiến lược đầu tư tác động"
    ms: "Nilai produk dan strategi pelaburan impak"
    id: "Menilai produk dan strategi investasi berdampak"
    hi: "इम्पैक्ट इन्वेस्टिंग के प्रोडक्ट और रणनीतियों का आकलन करना"
