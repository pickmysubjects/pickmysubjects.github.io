code: FLTV20006
year: 2026
learn:
  en: "Direct and edit your own short film to industry standard, and crew on others' shoots in camera, lighting, sound and AD roles."
  zh: "按行业标准导演并剪辑自己的短片，并在他人作品中担任摄影、灯光、录音或副导演。"
  zh-TW: "按業界標準導演並剪輯自己的短片，並在他人作品中擔任攝影、燈光、收音或副導演。"
  ja: "業界水準で自作の短編を監督・編集し、他の撮影で撮影・照明・録音・助監督を務める。"
  ko: "업계 수준으로 단편을 연출·편집하고 다른 촬영에서 촬영, 조명, 사운드, 조감독을 맡는다."
  vi: "Đạo diễn và dựng phim ngắn của bạn theo chuẩn nghề, làm ê-kíp quay, sáng, âm thanh, trợ lý đạo diễn."
  ms: "Arah dan sunting filem pendek sendiri ikut standard industri, serta jadi kru kamera, cahaya, bunyi."
  id: "Menyutradarai dan menyunting film pendek sendiri sesuai standar, serta jadi kru kamera, cahaya, suara."
  hi: "अपनी शॉर्ट फ़िल्म इंडस्ट्री स्तर पर निर्देशित व एडिट करना और दूसरों के शूट में कैमरा, लाइट, साउंड, AD भूमिका।"
outcomes:
  - en: "Direct actors in a short film"
    zh: "在短片中指导演员"
    zh-TW: "在短片中指導演員"
    ja: "短編で俳優を演出する"
    ko: "단편에서 배우 연출하기"
    vi: "Chỉ đạo diễn viên trong phim ngắn"
    ms: "Arahkan pelakon dalam filem pendek"
    id: "Mengarahkan aktor dalam film pendek"
    hi: "शॉर्ट फ़िल्म में अभिनेताओं का निर्देशन"
  - en: "Edit a scene in post-production"
    zh: "在后期剪辑一场戏"
    zh-TW: "在後期剪輯一場戲"
    ja: "ポスプロで場面を編集する"
    ko: "후반 작업에서 장면 편집하기"
    vi: "Dựng một cảnh ở hậu kỳ"
    ms: "Sunting babak dalam pascaproduksi"
    id: "Menyunting adegan di pascaproduksi"
    hi: "पोस्ट-प्रोडक्शन में दृश्य एडिट करना"
  - en: "Reflect on your directing and crew work"
    zh: "反思自己的导演与剧组工作"
    zh-TW: "反思自己的導演與劇組工作"
    ja: "監督とスタッフの仕事を振り返る"
    ko: "연출과 스태프 작업 성찰하기"
    vi: "Suy ngẫm việc đạo diễn và làm ê-kíp"
    ms: "Renung kerja pengarahan dan kru"
    id: "Merefleksikan kerja sutradara dan kru"
    hi: "अपने निर्देशन और क्रू काम पर विचार"
