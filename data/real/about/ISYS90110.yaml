code: ISYS90110
year: 2027
learn:
  en: "The second half of the Information Systems research project: finish the analysis, write it up and present it."
  zh: "信息系统研究项目的后半部分：完成分析、撰写报告并公开展示。"
  zh-TW: "資訊系統研究專題的後半部分：完成分析、撰寫報告並公開發表。"
  ja: "情報システム研究プロジェクトの後半：分析を仕上げ、論文にまとめて発表する。"
  ko: "정보시스템 연구 프로젝트 후반부: 분석을 마치고 보고서를 쓰고 발표하기."
  vi: "Nửa sau của dự án nghiên cứu Hệ thống Thông tin: hoàn tất phân tích, viết báo cáo và trình bày."
  ms: "Separuh kedua projek penyelidikan Sistem Maklumat: siapkan analisis, tulis laporan dan bentangkan."
  id: "Paruh kedua proyek riset Sistem Informasi: selesaikan analisis, tulis laporan, dan presentasikan."
  hi: "सूचना प्रणाली शोध प्रोजेक्ट का दूसरा भाग: विश्लेषण पूरा करना, रिपोर्ट लिखना और प्रस्तुत करना।"
outcomes:
  - en: "Build expertise in your research area"
    zh: "在自己的研究领域积累专长"
    zh-TW: "在自己的研究領域累積專長"
    ja: "自分の研究分野の専門性を高める"
    ko: "자신의 연구 분야 전문성 쌓기"
    vi: "Trở nên thành thạo trong lĩnh vực nghiên cứu"
    ms: "Membina kepakaran dalam bidang kajian anda"
    id: "Membangun keahlian di bidang riset Anda"
    hi: "अपने शोध क्षेत्र में विशेषज्ञता बनाना"
  - en: "Explain your results to a wider audience"
    zh: "向更广泛的受众说明研究成果"
    zh-TW: "向更廣泛的受眾說明研究成果"
    ja: "研究成果を幅広い人に説明する"
    ko: "연구 결과를 더 넓은 청중에게 설명하기"
    vi: "Trình bày kết quả cho nhiều đối tượng hơn"
    ms: "Menerangkan dapatan kepada khalayak lebih luas"
    id: "Menjelaskan hasil riset ke khalayak luas"
    hi: "अपने नतीजे बड़े दर्शकों को समझाना"
