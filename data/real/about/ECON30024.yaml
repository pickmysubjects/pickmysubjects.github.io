code: ECON30024
year: 2026
learn:
  en: "The economic theory behind financial markets, what the data say, and how Australian markets work in practice."
  zh: "金融市场背后的经济理论、实证结果和澳洲市场实务。"
  zh-TW: "金融市場背後的經濟理論、實證結果和澳洲市場實務。"
  ja: "金融市場の経済理論、データが示すこと、豪州市場の実際。"
  ko: "금융시장 뒤의 경제 이론, 실증 결과, 호주 시장의 실제 작동."
  vi: "Lý thuyết kinh tế đằng sau thị trường tài chính, bằng chứng dữ liệu và cách thị trường Úc vận hành."
  ms: "Teori ekonomi di sebalik pasaran kewangan, apa kata data, dan cara pasaran Australia berfungsi."
  id: "Teori ekonomi di balik pasar keuangan, apa kata data, dan cara pasar Australia bekerja."
  hi: "वित्तीय बाज़ारों के पीछे का आर्थिक सिद्धांत, डेटा क्या कहता है, और ऑस्ट्रेलियाई बाज़ार असल में कैसे चलते हैं।"
outcomes:
  - en: "Explain saving and investing choices under uncertainty"
    zh: "解释不确定性下的储蓄和投资决策"
    zh-TW: "解釋不確定性下的儲蓄和投資決策"
    ja: "不確実性の下での貯蓄・投資の判断を説明する"
    ko: "불확실성 속 저축·투자 결정 설명하기"
    vi: "Giải thích quyết định tiết kiệm và đầu tư khi bất định"
    ms: "Terangkan pilihan simpanan dan pelaburan dalam ketidakpastian"
    id: "Menjelaskan keputusan menabung dan berinvestasi saat tidak pasti"
    hi: "अनिश्चितता में बचत और निवेश के फ़ैसले समझाना"
  - en: "Compare asset pricing models against real data"
    zh: "用真实数据比较资产定价模型"
    zh-TW: "用真實資料比較資產定價模型"
    ja: "資産価格モデルを実データと照らし合わせる"
    ko: "자산가격 모형을 실제 데이터와 비교하기"
    vi: "So sánh các mô hình định giá tài sản với dữ liệu thực"
    ms: "Banding model penentuan harga aset dengan data sebenar"
    id: "Membandingkan model harga aset dengan data nyata"
    hi: "एसेट प्राइसिंग मॉडलों को असली डेटा से परखना"
  - en: "Read yield curves to forecast inflation"
    zh: "通过收益率曲线预测通胀"
    zh-TW: "透過殖利率曲線預測通膨"
    ja: "利回り曲線からインフレを予測する"
    ko: "수익률 곡선으로 인플레이션 예측하기"
    vi: "Đọc đường cong lợi suất để dự báo lạm phát"
    ms: "Baca keluk hasil untuk ramal inflasi"
    id: "Membaca kurva imbal hasil untuk memprediksi inflasi"
    hi: "यील्ड कर्व से महँगाई का अनुमान लगाना"
