code: GEOL30007
year: 2026
learn:
  en: "How life evolved over 4.5 billion years and shaped Earth's environments, using fossils and biogeochemistry."
  zh: "生命如何在45亿年中演化并塑造地球环境，借助化石和生物地球化学。"
  zh-TW: "生命如何在45億年中演化並塑造地球環境，藉助化石與生物地球化學。"
  ja: "45億年の生命の進化と地球環境への影響を、化石と生物地球化学から学ぶ。"
  ko: "45억 년간 생명의 진화와 지구 환경 형성을 화석과 생지화학으로 배움."
  vi: "Sự sống tiến hóa 4,5 tỷ năm và định hình môi trường Trái Đất ra sao, qua hóa thạch và sinh địa hóa."
  ms: "Cara hidupan berevolusi 4.5 bilion tahun dan membentuk alam Bumi, melalui fosil dan biogeokimia."
  id: "Cara kehidupan berevolusi 4,5 miliar tahun dan membentuk lingkungan Bumi, lewat fosil dan biogeokimia."
  hi: "4.5 अरब वर्षों में जीवन कैसे विकसित हुआ और पृथ्वी के पर्यावरण को गढ़ा, जीवाश्म और जैव-भूरसायन से।"
outcomes:
  - en: "Identify and describe fossils in field or lab"
    zh: "在野外或实验室鉴定描述化石"
    zh-TW: "在野外或實驗室鑑定描述化石"
    ja: "野外や実験室で化石を同定・記載する"
    ko: "현장이나 실험실에서 화석 식별·기술하기"
    vi: "Nhận diện và mô tả hóa thạch ở thực địa hoặc lab"
    ms: "Kenal pasti dan huraikan fosil di lapangan atau makmal"
    id: "Mengidentifikasi dan mendeskripsikan fosil"
    hi: "फ़ील्ड या लैब में जीवाश्म पहचानना और वर्णन करना"
  - en: "Explain how biogeochemical cycles shape climate"
    zh: "解释生物地球化学循环如何影响气候"
    zh-TW: "解釋生物地球化學循環如何影響氣候"
    ja: "生物地球化学循環が気候に与える影響を説明する"
    ko: "생지화학 순환이 기후에 주는 영향 설명하기"
    vi: "Giải thích chu trình sinh địa hóa tác động khí hậu"
    ms: "Terangkan kitaran biogeokimia membentuk iklim"
    id: "Menjelaskan siklus biogeokimia membentuk iklim"
    hi: "जैव-भूरासायनिक चक्र जलवायु को कैसे बदलते हैं बताना"
