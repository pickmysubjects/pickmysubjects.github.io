code: COMP90020
year: 2027
learn:
  en: "Core algorithms that keep distributed systems running: clock sync, leader election, mutual exclusion, replication."
  zh: "分布式系统的核心算法：时钟同步、领导者选举、互斥与复制。"
  zh-TW: "分散式系統的核心演算法：時鐘同步、領導者選舉、互斥與複製。"
  ja: "分散システムの中核アルゴリズム：時刻同期、リーダー選出、相互排除、複製。"
  ko: "분산 시스템 핵심 알고리즘: 시계 동기화, 리더 선출, 상호 배제, 복제."
  vi: "Thuật toán cốt lõi của hệ phân tán: đồng bộ đồng hồ, bầu leader, loại trừ tương hỗ, sao chép."
  ms: "Algoritma teras sistem teragih: penyegerakan jam, pemilihan ketua, saling eksklusif, replikasi."
  id: "Algoritma inti sistem terdistribusi: sinkronisasi jam, pemilihan pemimpin, mutual exclusion, replikasi."
  hi: "डिस्ट्रिब्यूटेड सिस्टम के मूल एल्गोरिद्म: क्लॉक सिंक, लीडर चुनाव, म्यूचुअल एक्सक्लूज़न, रेप्लिकेशन।"
outcomes:
  - en: "Explain how well-known distributed algorithms work"
    zh: "解释经典分布式算法的原理"
    zh-TW: "解釋經典分散式演算法的原理"
    ja: "代表的な分散アルゴリズムを説明する"
    ko: "대표적 분산 알고리즘 설명하기"
    vi: "Giải thích các thuật toán phân tán nổi tiếng"
    ms: "Terangkan cara algoritma teragih terkenal berfungsi"
    id: "Menjelaskan cara kerja algoritma terdistribusi terkenal"
    hi: "प्रसिद्ध डिस्ट्रिब्यूटेड एल्गोरिद्म कैसे काम करते हैं, समझाना"
  - en: "Pick a suitable algorithm for a distributed problem"
    zh: "为分布式问题选择合适算法"
    zh-TW: "為分散式問題選擇合適演算法"
    ja: "分散問題に合うアルゴリズムを選ぶ"
    ko: "분산 문제에 맞는 알고리즘 고르기"
    vi: "Chọn thuật toán phù hợp cho bài toán phân tán"
    ms: "Pilih algoritma sesuai untuk masalah teragih"
    id: "Memilih algoritma tepat untuk masalah terdistribusi"
    hi: "डिस्ट्रिब्यूटेड समस्या के लिए सही एल्गोरिद्म चुनना"
