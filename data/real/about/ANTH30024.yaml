code: ANTH30024
year: 2026
learn:
  en: "Why we work and how effort becomes money and value, from the working class and debt to barter and crypto."
  zh: "我们为何工作，劳动如何变成金钱和价值，从工人阶级、债务到以物易物和加密货币。"
  zh-TW: "我們為何工作，勞動如何變成金錢和價值，從勞工階級、債務到以物易物和加密貨幣。"
  ja: "なぜ働くのか、労働がどうお金と価値になるのかを、労働者階級や借金から物々交換や暗号資産まで学ぶ。"
  ko: "우리는 왜 일하고 노동이 어떻게 돈과 가치가 되는지, 노동계급과 부채부터 물물교환과 암호화폐까지 배운다."
  vi: "Vì sao ta làm việc và công sức biến thành tiền, giá trị ra sao, từ giai cấp công nhân, nợ đến hàng đổi hàng và tiền mã hóa."
  ms: "Mengapa kita bekerja dan bagaimana usaha menjadi wang dan nilai, daripada kelas pekerja dan hutang hingga barter dan kripto."
  id: "Mengapa kita bekerja dan bagaimana usaha menjadi uang dan nilai, dari kelas pekerja dan utang hingga barter dan kripto."
  hi: "हम क्यों काम करते हैं और मेहनत पैसे व मूल्य में कैसे बदलती है, मज़दूर वर्ग और कर्ज़ से लेकर वस्तु-विनिमय और क्रिप्टो तक।"
outcomes:
  - en: "Explain how labour is turned into value"
    zh: "解释劳动如何转化为价值"
    zh-TW: "解釋勞動如何轉化為價值"
    ja: "労働が価値に変わる仕組みを説明する"
    ko: "노동이 가치로 바뀌는 과정 설명하기"
    vi: "Giải thích lao động được chuyển thành giá trị ra sao"
    ms: "Terangkan bagaimana buruh menjadi nilai"
    id: "Menjelaskan bagaimana kerja diubah menjadi nilai"
    hi: "श्रम मूल्य में कैसे बदलता है, समझाना"
  - en: "Compare forms of money, debt and exchange"
    zh: "比较不同形式的货币、债务与交换"
    zh-TW: "比較不同形式的貨幣、債務與交換"
    ja: "お金・借金・交換の形を比べる"
    ko: "돈, 부채, 교환의 형태 비교하기"
    vi: "So sánh các dạng tiền, nợ và trao đổi"
    ms: "Bandingkan bentuk wang, hutang dan pertukaran"
    id: "Membandingkan bentuk uang, utang, dan pertukaran"
    hi: "पैसे, कर्ज़ और लेन-देन के रूपों की तुलना करना"
  - en: "Use ethnography to study economic life"
    zh: "用民族志方法研究经济生活"
    zh-TW: "用民族誌方法研究經濟生活"
    ja: "民族誌の方法で経済生活を研究する"
    ko: "민족지로 경제생활 연구하기"
    vi: "Dùng dân tộc chí để nghiên cứu đời sống kinh tế"
    ms: "Gunakan etnografi untuk mengkaji kehidupan ekonomi"
    id: "Memakai etnografi untuk meneliti kehidupan ekonomi"
    hi: "आर्थिक जीवन के अध्ययन में एथ्नोग्राफी का उपयोग करना"
