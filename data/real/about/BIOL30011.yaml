code: BIOL30011
year: 2026
learn:
  en: "How fishing, pollution, climate change and coastal development affect marine life, and how science guides its management."
  zh: "捕鱼、污染、气候变化等怎样影响海洋生物，以及怎样用科学来管理和保护。"
  zh-TW: "捕魚、汙染、氣候變遷等如何影響海洋生物，以及如何用科學來管理和保護。"
  ja: "漁業・汚染・気候変動・沿岸開発が海の生き物に与える影響と、科学による管理。"
  ko: "어업, 오염, 기후변화, 연안 개발이 해양 생물에 주는 영향과 과학 기반 관리."
  vi: "Đánh bắt, ô nhiễm, biến đổi khí hậu và phát triển ven biển ảnh hưởng sinh vật biển ra sao, và khoa học hỗ trợ quản lý thế nào."
  ms: "Kesan penangkapan ikan, pencemaran, perubahan iklim dan pembangunan pantai pada hidupan laut, dan peranan sains dalam pengurusannya."
  id: "Dampak penangkapan ikan, polusi, perubahan iklim, dan pembangunan pesisir pada biota laut, dan peran sains dalam pengelolaannya."
  hi: "मछली पकड़ना, प्रदूषण, जलवायु परिवर्तन व तटीय विकास समुद्री जीवन पर कैसे असर डालते हैं, और विज्ञान इसके प्रबंधन में कैसे मदद करता है।"
outcomes:
  - en: "Assess the impact of human pressures on marine ecosystems"
    zh: "评估人类活动对海洋生态的影响"
    zh-TW: "評估人類活動對海洋生態的影響"
    ja: "人間活動が海洋生態系に与える影響を評価する"
    ko: "인간 활동이 해양 생태계에 주는 영향 평가하기"
    vi: "Đánh giá tác động của con người lên hệ sinh thái biển"
    ms: "Nilai kesan tekanan manusia pada ekosistem laut"
    id: "Menilai dampak tekanan manusia pada ekosistem laut"
    hi: "समुद्री इकोसिस्टम पर इंसानी दबाव का असर आँकना"
  - en: "Read and critique marine science papers"
    zh: "读懂并评价海洋科学论文"
    zh-TW: "讀懂並評價海洋科學論文"
    ja: "海洋科学の論文を読んで批評する"
    ko: "해양과학 논문 읽고 비평하기"
    vi: "Đọc và phản biện bài báo khoa học biển"
    ms: "Baca dan kritik kertas sains marin"
    id: "Membaca dan mengkritisi makalah ilmu kelautan"
    hi: "मरीन साइंस पेपर पढ़ना और परखना"
  - en: "Design experiments and analyse data for management"
    zh: "为管理决策设计实验、分析数据"
    zh-TW: "為管理決策設計實驗、分析資料"
    ja: "管理のために実験を計画しデータを分析する"
    ko: "관리를 위한 실험 설계와 데이터 분석하기"
    vi: "Thiết kế thí nghiệm, phân tích dữ liệu phục vụ quản lý"
    ms: "Reka eksperimen dan analisis data untuk pengurusan"
    id: "Merancang eksperimen dan analisis data untuk pengelolaan"
    hi: "प्रबंधन के लिए प्रयोग डिज़ाइन और डेटा विश्लेषण"
