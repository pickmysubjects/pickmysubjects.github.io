code: MULT20013
year: 2026
learn:
  en: "The social, political and environmental issues shaping Australia today, a good fit for international students."
  zh: "影响当今澳大利亚的社会、政治和环境问题，很适合国际学生。"
  zh-TW: "影響當今澳洲的社會、政治和環境問題，很適合國際學生。"
  ja: "今のオーストラリアを動かす社会・政治・環境の問題。留学生にも向いている。"
  ko: "오늘날 호주를 만드는 사회, 정치, 환경 문제. 유학생에게 잘 맞는 과목."
  vi: "Các vấn đề xã hội, chính trị và môi trường đang định hình nước Úc ngày nay, rất hợp với sinh viên quốc tế."
  ms: "Isu sosial, politik dan alam sekitar yang membentuk Australia hari ini, sesuai untuk pelajar antarabangsa."
  id: "Isu sosial, politik, dan lingkungan yang membentuk Australia saat ini, cocok untuk mahasiswa internasional."
  hi: "आज के ऑस्ट्रेलिया को आकार देने वाले सामाजिक, राजनीतिक और पर्यावरण मुद्दे, अंतरराष्ट्रीय छात्रों के लिए अच्छा विकल्प।"
outcomes:
  - en: "Explain the forces shaping Australian society"
    zh: "说明塑造澳大利亚社会的力量"
    zh-TW: "說明形塑澳洲社會的力量"
    ja: "オーストラリア社会を形づくる要因を説明する"
    ko: "호주 사회를 만드는 요인 설명하기"
    vi: "Giải thích các yếu tố định hình xã hội Úc"
    ms: "Terangkan faktor yang membentuk masyarakat Australia"
    id: "Menjelaskan faktor yang membentuk masyarakat Australia"
    hi: "ऑस्ट्रेलियाई समाज को गढ़ने वाली ताकतें समझाना"
  - en: "Discuss current debates in Australian public life"
    zh: "讨论澳大利亚当下的公共议题"
    zh-TW: "討論澳洲當下的公共議題"
    ja: "オーストラリアで今議論されている公共の問題を論じる"
    ko: "호주의 현재 공공 쟁점 토론하기"
    vi: "Bàn về các tranh luận đang diễn ra trong đời sống công cộng Úc"
    ms: "Bincangkan perdebatan semasa dalam kehidupan awam Australia"
    id: "Membahas perdebatan terkini di ruang publik Australia"
    hi: "ऑस्ट्रेलिया के सार्वजनिक जीवन की मौजूदा बहसों पर चर्चा करना"
  - en: "Link Australia's past to its present"
    zh: "把澳大利亚的过去和现在联系起来"
    zh-TW: "把澳洲的過去和現在連結起來"
    ja: "オーストラリアの過去と現在を結びつけて考える"
    ko: "호주의 과거와 현재 연결하기"
    vi: "Liên hệ quá khứ với hiện tại của nước Úc"
    ms: "Kaitkan masa lalu Australia dengan masa kini"
    id: "Mengaitkan masa lalu Australia dengan masa kini"
    hi: "ऑस्ट्रेलिया के अतीत को उसके वर्तमान से जोड़ना"
