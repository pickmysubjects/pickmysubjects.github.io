code: AHIS30026
year: 2026
learn:
  en: "How artists, curators and historians deal with colonial legacies, from archives and repatriation to First Nations voices."
  zh: "艺术家、策展人和史学家如何面对殖民遗产，从档案、文物归还到原住民的声音。"
  zh-TW: "藝術家、策展人和史學家如何面對殖民遺產，從檔案、文物歸還到原住民的聲音。"
  ja: "芸術家・キュレーター・歴史家が植民地の遺産にどう向き合うか。アーカイブ、返還、先住民の声まで。"
  ko: "예술가·큐레이터·역사가가 식민 유산을 어떻게 다루는지, 기록물과 반환부터 원주민의 목소리까지 배운다."
  vi: "Nghệ sĩ, giám tuyển và sử gia xử lý di sản thuộc địa ra sao, từ lưu trữ, hồi hương hiện vật đến tiếng nói người bản địa."
  ms: "Cara artis, kurator dan ahli sejarah menangani warisan kolonial, dari arkib dan pemulangan hingga suara Orang Asli."
  id: "Cara seniman, kurator dan sejarawan menghadapi warisan kolonial, dari arsip dan repatriasi sampai suara Pribumi."
  hi: "कलाकार, क्यूरेटर और इतिहासकार औपनिवेशिक विरासत से कैसे निपटते हैं, अभिलेखागार और वापसी से मूलनिवासी आवाज़ों तक।"
outcomes:
  - en: "Explain current ideas of decolonisation in art"
    zh: "说明当前艺术领域的去殖民化观念"
    zh-TW: "說明當前藝術領域的去殖民化觀念"
    ja: "美術における脱植民地化の考えを説明する"
    ko: "미술의 탈식민화 개념 설명하기"
    vi: "Giải thích quan niệm giải thực dân trong nghệ thuật hiện nay"
    ms: "Terangkan idea dekolonisasi dalam seni kini"
    id: "Menjelaskan gagasan dekolonisasi dalam seni kini"
    hi: "कला में विउपनिवेशीकरण के मौजूदा विचार समझाना"
  - en: "Analyse how artists respond to colonial legacies"
    zh: "分析艺术家如何回应殖民遗产"
    zh-TW: "分析藝術家如何回應殖民遺產"
    ja: "芸術家が植民地の遺産にどう応えるか分析する"
    ko: "예술가가 식민 유산에 응답하는 방식 분석하기"
    vi: "Phân tích nghệ sĩ đáp lại di sản thuộc địa ra sao"
    ms: "Analisis cara artis menjawab warisan kolonial"
    id: "Menganalisis cara seniman menanggapi warisan kolonial"
    hi: "कलाकार औपनिवेशिक विरासत का जवाब कैसे देते हैं, विश्लेषण करना"
  - en: "Discuss repatriation and First Nations knowledge"
    zh: "讨论文物归还与原住民知识"
    zh-TW: "討論文物歸還與原住民知識"
    ja: "文化財の返還と先住民の知を論じる"
    ko: "문화재 반환과 원주민 지식 논의하기"
    vi: "Thảo luận việc hồi hương hiện vật và tri thức bản địa"
    ms: "Bincangkan pemulangan artifak dan ilmu Orang Asli"
    id: "Membahas repatriasi dan pengetahuan Pribumi"
    hi: "सांस्कृतिक वस्तुओं की वापसी और मूलनिवासी ज्ञान पर चर्चा करना"
