code: PSYC30023
year: 2026
learn:
  en: "Using computer models to explain how people perceive, remember, use language, reason and influence each other."
  zh: "用电脑模型解释人怎么感知、记忆、用语言、推理和互相影响。"
  zh-TW: "用電腦模型解釋人怎麼感知、記憶、使用語言、推理和互相影響。"
  ja: "コンピュータモデルで、人の知覚、記憶、言語使用、推論、相互の影響を説明する。"
  ko: "컴퓨터 모델로 사람의 지각, 기억, 언어 사용, 추론, 상호 영향을 설명."
  vi: "Dùng mô hình máy tính để giải thích cách con người tri giác, ghi nhớ, dùng ngôn ngữ, suy luận và ảnh hưởng nhau."
  ms: "Guna model komputer untuk terangkan cara manusia mempersepsi, mengingat, berbahasa, menaakul dan saling mempengaruhi."
  id: "Memakai model komputer untuk menjelaskan cara orang mempersepsi, mengingat, berbahasa, bernalar, dan saling memengaruhi."
  hi: "कंप्यूटर मॉडल से समझाना कि लोग कैसे अनुभव, याद, भाषा का उपयोग, तर्क करते और एक-दूसरे पर असर डालते हैं।"
outcomes:
  - en: "Build computer models of thinking and social behaviour"
    zh: "建立思维和社会行为的计算模型"
    zh-TW: "建立思維和社會行為的電腦模型"
    ja: "思考と社会的行動のコンピュータモデルを作る"
    ko: "사고와 사회적 행동의 컴퓨터 모델 구축"
    vi: "Xây mô hình máy tính về tư duy và hành vi xã hội"
    ms: "Bina model komputer pemikiran dan tingkah laku sosial"
    id: "Membangun model komputer tentang berpikir dan perilaku sosial"
    hi: "सोच और सामाजिक व्यवहार के कंप्यूटर मॉडल बनाना"
  - en: "Analyse and critique model results"
    zh: "分析和评价模型结果"
    zh-TW: "分析和評價模型結果"
    ja: "モデルの結果を分析し批評する"
    ko: "모델 결과 분석·비평"
    vi: "Phân tích và đánh giá kết quả mô hình"
    ms: "Analisis dan kritik hasil model"
    id: "Menganalisis dan mengkritisi hasil model"
    hi: "मॉडल के नतीजों का विश्लेषण और समीक्षा"
  - en: "Write up a modelling exercise clearly"
    zh: "把建模过程写清楚"
    zh-TW: "把建模過程寫清楚"
    ja: "モデリング課題をわかりやすくまとめる"
    ko: "모델링 과제를 명확히 작성"
    vi: "Viết rõ ràng về một bài tập mô hình hóa"
    ms: "Tulis latihan pemodelan dengan jelas"
    id: "Menulis latihan pemodelan dengan jelas"
    hi: "मॉडलिंग अभ्यास को साफ़ लिखना"
