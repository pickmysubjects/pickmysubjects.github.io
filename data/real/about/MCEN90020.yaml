code: MCEN90020
year: 2027
learn:
  en: "Microstructure and properties of engineering alloys and polymers, and how plastics and composites are made."
  zh: "工程合金和聚合物的显微组织与性能，以及塑料和复合材料的制造。"
  zh-TW: "工程合金與高分子的顯微組織與性質，以及塑膠與複合材料的製造。"
  ja: "工学用合金と高分子の組織・特性、そしてプラスチックや複合材料の製造。"
  ko: "공학용 합금과 고분자의 미세조직·성질, 플라스틱과 복합재 제조."
  vi: "Vi cấu trúc và tính chất của hợp kim, polyme, cùng cách chế tạo nhựa và composite."
  ms: "Mikrostruktur dan sifat aloi serta polimer, dan cara plastik serta komposit dibuat."
  id: "Mikrostruktur dan sifat paduan serta polimer, dan cara plastik serta komposit dibuat."
  hi: "मिश्रधातुओं व पॉलिमर की सूक्ष्म संरचना व गुण, और प्लास्टिक व कंपोज़िट का निर्माण।"
outcomes:
  - en: "Link alloy microstructure to mechanical properties"
    zh: "把合金显微组织与力学性能联系起来"
    zh-TW: "把合金顯微組織與力學性質連結起來"
    ja: "合金の組織と機械的性質を結びつける"
    ko: "합금 미세조직과 기계적 성질 연결하기"
    vi: "Liên hệ vi cấu trúc hợp kim với cơ tính"
    ms: "Mengaitkan mikrostruktur aloi dengan sifat mekanik"
    id: "Menghubungkan mikrostruktur paduan dengan sifat mekanik"
    hi: "मिश्रधातु संरचना को यांत्रिक गुणों से जोड़ना"
  - en: "Analyse a research paper and write a professional report"
    zh: "分析一篇研究论文并写成专业报告"
    zh-TW: "分析一篇研究論文並寫成專業報告"
    ja: "研究論文を分析し、報告書にまとめる"
    ko: "연구 논문을 분석해 전문 보고서 쓰기"
    vi: "Phân tích bài báo nghiên cứu và viết báo cáo chuyên nghiệp"
    ms: "Menganalisis kertas penyelidikan dan menulis laporan profesional"
    id: "Menganalisis makalah riset dan menulis laporan profesional"
    hi: "शोध पत्र का विश्लेषण कर पेशेवर रिपोर्ट लिखना"
  - en: "Compare manufacturing processes for plastics and composites"
    zh: "比较塑料和复合材料的制造工艺"
    zh-TW: "比較塑膠與複合材料的製造製程"
    ja: "プラスチックと複合材料の製造法を比べる"
    ko: "플라스틱·복합재 제조 공정 비교하기"
    vi: "So sánh quy trình chế tạo nhựa và composite"
    ms: "Membandingkan proses pembuatan plastik dan komposit"
    id: "Membandingkan proses manufaktur plastik dan komposit"
    hi: "प्लास्टिक व कंपोज़िट निर्माण प्रक्रियाओं की तुलना"
