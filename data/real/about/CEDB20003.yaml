code: CEDB20003
year: 2026
learn:
  en: "How human, animal and plant cells are built and work, and the signals that change what cells do."
  zh: "人类、动物和植物细胞的结构与功能，以及改变细胞行为的信号。"
  zh-TW: "人類、動物與植物細胞的結構與功能，以及改變細胞行為的訊號。"
  ja: "ヒト・動物・植物の細胞の構造と働き、細胞の振る舞いを変えるシグナル。"
  ko: "사람·동물·식물 세포의 구조와 기능, 그리고 세포 행동을 바꾸는 신호."
  vi: "Cấu trúc và chức năng của tế bào người, động vật, thực vật, và các tín hiệu làm thay đổi tế bào."
  ms: "Struktur dan fungsi sel manusia, haiwan dan tumbuhan, serta isyarat yang mengubah tingkah laku sel."
  id: "Struktur dan fungsi sel manusia, hewan, dan tumbuhan, serta sinyal yang mengubah perilaku sel."
  hi: "मानव, जानवर और पौधों की कोशिकाओं की बनावट व काम, और कोशिका व्यवहार बदलने वाले संकेत।"
outcomes:
  - en: "Explain eukaryotic cell structure and function"
    zh: "解释真核细胞的结构与功能"
    zh-TW: "解釋真核細胞的結構與功能"
    ja: "真核細胞の構造と機能を説明する"
    ko: "진핵세포의 구조와 기능 설명하기"
    vi: "Giải thích cấu trúc, chức năng tế bào nhân thực"
    ms: "Menerangkan struktur dan fungsi sel eukariot"
    id: "Menjelaskan struktur dan fungsi sel eukariota"
    hi: "यूकेरियोटिक कोशिका की संरचना व कार्य समझाना"
  - en: "Analyse cell biology data"
    zh: "分析细胞生物学数据"
    zh-TW: "分析細胞生物學數據"
    ja: "細胞生物学のデータを分析する"
    ko: "세포생물학 데이터 분석하기"
    vi: "Phân tích dữ liệu sinh học tế bào"
    ms: "Menganalisis data biologi sel"
    id: "Menganalisis data biologi sel"
    hi: "कोशिका जीवविज्ञान डेटा का विश्लेषण करना"
  - en: "Explain cell biology to different audiences"
    zh: "向不同受众讲解细胞生物学"
    zh-TW: "向不同受眾講解細胞生物學"
    ja: "細胞生物学を様々な相手に伝える"
    ko: "다양한 청중에게 세포생물학 설명하기"
    vi: "Trình bày sinh học tế bào cho nhiều đối tượng"
    ms: "Menyampaikan biologi sel kepada pelbagai audiens"
    id: "Menyampaikan biologi sel ke berbagai audiens"
    hi: "अलग-अलग श्रोताओं को कोशिका जीवविज्ञान समझाना"
