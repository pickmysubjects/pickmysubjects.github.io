code: MGMT30008
year: 2026
learn:
  en: "How organisations balance profit with social and environmental goals, and the role of purpose-driven organisations."
  zh: "组织如何平衡利润与社会、环境目标，以及社会目的型组织的作用。"
  zh-TW: "組織如何兼顧獲利與社會、環境目標，以及社會使命型組織的角色。"
  ja: "組織が利益と社会・環境の目標をどう両立させるか、社会的目的を持つ組織の役割。"
  ko: "조직이 이익과 사회·환경 목표의 균형을 잡는 방법과 사회적 목적 조직의 역할."
  vi: "Tổ chức cân bằng lợi nhuận với mục tiêu xã hội, môi trường ra sao và vai trò của tổ chức vì mục đích xã hội."
  ms: "Cara organisasi mengimbangi untung dengan matlamat sosial dan alam sekitar, serta peranan organisasi bertujuan sosial."
  id: "Cara organisasi menyeimbangkan laba dengan tujuan sosial dan lingkungan, serta peran organisasi bertujuan sosial."
  hi: "संगठन मुनाफ़े को सामाजिक और पर्यावरण लक्ष्यों के साथ कैसे संतुलित करते हैं, और सामाजिक उद्देश्य वाले संगठनों की भूमिका।"
outcomes:
  - en: "Explain CSR, shared value and stakeholder management"
    zh: "解释企业社会责任、共享价值和利益相关者管理"
    zh-TW: "解釋企業社會責任、共享價值和利害關係人管理"
    ja: "CSR、共通価値、ステークホルダー管理を説明する"
    ko: "CSR, 공유가치, 이해관계자 관리 설명하기"
    vi: "Giải thích CSR, giá trị chung và quản lý các bên liên quan"
    ms: "Terangkan CSR, nilai bersama dan pengurusan pihak berkepentingan"
    id: "Menjelaskan CSR, nilai bersama, dan manajemen pemangku kepentingan"
    hi: "CSR, शेयर्ड वैल्यू और स्टेकहोल्डर मैनेजमेंट समझाना"
  - en: "Analyse issues like climate change and modern slavery"
    zh: "分析气候变化、现代奴役等议题"
    zh-TW: "分析氣候變遷、現代奴役等議題"
    ja: "気候変動や現代奴隷などの問題を分析する"
    ko: "기후변화, 현대 노예제 같은 문제 분석하기"
    vi: "Phân tích vấn đề như biến đổi khí hậu, nô lệ hiện đại"
    ms: "Analisis isu seperti perubahan iklim dan perhambaan moden"
    id: "Menganalisis isu seperti perubahan iklim dan perbudakan modern"
    hi: "जलवायु परिवर्तन और आधुनिक गुलामी जैसे मुद्दों का विश्लेषण"
  - en: "Apply sustainability ideas to real cases"
    zh: "把可持续发展理念用到真实案例"
    zh-TW: "把永續發展概念用在真實案例"
    ja: "持続可能性の考えを実例に当てはめる"
    ko: "지속가능성 개념을 실제 사례에 적용하기"
    vi: "Áp dụng ý tưởng bền vững vào tình huống thực tế"
    ms: "Guna idea kelestarian pada kes sebenar"
    id: "Menerapkan ide keberlanjutan pada kasus nyata"
    hi: "सस्टेनेबिलिटी के विचार असली मामलों पर लागू करना"
