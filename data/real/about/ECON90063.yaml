code: ECON90063
year: 2027
learn:
  en: "Graduate micro theory: uncertainty, duality, general equilibrium, market failure and game theory, built on proofs."
  zh: "研究生微观理论：不确定性、对偶、一般均衡、市场失灵和博弈论，以数学证明为基础。"
  zh-TW: "研究所個體理論：不確定性、對偶、一般均衡、市場失靈與賽局理論，以數學證明為基礎。"
  ja: "大学院ミクロ理論：不確実性、双対性、一般均衡、市場の失敗、ゲーム理論を数学で扱う。"
  ko: "대학원 미시이론: 불확실성, 쌍대성, 일반균형, 시장실패, 게임이론을 수학적으로 다룬다."
  vi: "Lý thuyết vi mô sau đại học: bất định, đối ngẫu, cân bằng tổng quát, thất bại thị trường, lý thuyết trò chơi."
  ms: "Teori mikro pascasiswazah: ketidakpastian, dualiti, keseimbangan am, kegagalan pasaran dan teori permainan."
  id: "Teori mikro pascasarjana: ketidakpastian, dualitas, keseimbangan umum, kegagalan pasar, teori permainan."
  hi: "स्नातकोत्तर माइक्रो सिद्धांत: अनिश्चितता, द्वैतता, सामान्य संतुलन, बाज़ार विफलता और गेम थ्योरी।"
outcomes:
  - en: "Use envelope and duality methods for comparative statics"
    zh: "用包络定理和对偶方法做比较静态分析"
    zh-TW: "用包絡定理與對偶方法做比較靜態分析"
    ja: "包絡線定理と双対性で比較静学を行う"
    ko: "포락선 정리와 쌍대성으로 비교정학 분석하기"
    vi: "Dùng định lý bao và đối ngẫu cho tĩnh học so sánh"
    ms: "Menggunakan kaedah sampul dan dualiti untuk statik perbandingan"
    id: "Memakai metode envelope dan dualitas untuk statika komparatif"
    hi: "तुलनात्मक स्थैतिकी के लिए एनवेलप और द्वैतता विधियां"
  - en: "Apply fixed point theorems to prove equilibria exist"
    zh: "用不动点定理证明均衡存在"
    zh-TW: "用不動點定理證明均衡存在"
    ja: "不動点定理で均衡の存在を示す"
    ko: "고정점 정리로 균형의 존재 증명하기"
    vi: "Dùng định lý điểm bất động chứng minh cân bằng tồn tại"
    ms: "Menggunakan teorem titik tetap untuk membuktikan keseimbangan"
    id: "Memakai teorema titik tetap untuk membuktikan keseimbangan ada"
    hi: "संतुलन का अस्तित्व सिद्ध करने में स्थिर बिंदु प्रमेय"
