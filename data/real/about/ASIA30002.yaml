code: ASIA30002
year: 2026
learn:
  en: "How ideologies shape the way people in Asia define themselves, from nation to ethnicity, religion, class and gender."
  zh: "意识形态如何影响亚洲人的自我认同，从国家到族群、宗教、阶级和性别。"
  zh-TW: "意識形態如何影響亞洲人的自我認同，從國家到族群、宗教、階級和性別。"
  ja: "イデオロギーがアジアの人々の自己認識をどう形づくるかを、国家から民族・宗教・階級・ジェンダーまで学ぶ。"
  ko: "이데올로기가 아시아 사람들의 자기 정의를 어떻게 만드는지 국가부터 민족, 종교, 계급, 젠더까지 배운다."
  vi: "Ý thức hệ định hình cách người châu Á nhận diện bản thân ra sao, từ quốc gia đến sắc tộc, tôn giáo, giai cấp và giới."
  ms: "Cara ideologi membentuk cara orang Asia mentakrif diri, daripada negara hingga etnik, agama, kelas dan gender."
  id: "Cara ideologi membentuk cara orang Asia mendefinisikan diri, dari bangsa hingga etnis, agama, kelas, dan gender."
  hi: "विचारधाराएँ एशिया में लोगों की आत्म-पहचान को कैसे गढ़ती हैं, राष्ट्र से जातीयता, धर्म, वर्ग और जेंडर तक।"
outcomes:
  - en: "Explain links between identity and ideology"
    zh: "解释身份与意识形态的关系"
    zh-TW: "解釋身分與意識形態的關係"
    ja: "アイデンティティとイデオロギーの関係を説明する"
    ko: "정체성과 이데올로기의 관계 설명하기"
    vi: "Giải thích mối liên hệ giữa bản sắc và ý thức hệ"
    ms: "Terangkan kaitan antara identiti dan ideologi"
    id: "Menjelaskan kaitan identitas dan ideologi"
    hi: "पहचान और विचारधारा के संबंध समझाना"
  - en: "Compare national ideologies across Asia"
    zh: "比较亚洲各国的国家意识形态"
    zh-TW: "比較亞洲各國的國家意識形態"
    ja: "アジア各国の国家イデオロギーを比べる"
    ko: "아시아 각국의 국가 이데올로기 비교하기"
    vi: "So sánh ý thức hệ quốc gia giữa các nước châu Á"
    ms: "Bandingkan ideologi kebangsaan di Asia"
    id: "Membandingkan ideologi nasional di Asia"
    hi: "एशिया की राष्ट्रीय विचारधाराओं की तुलना करना"
  - en: "Analyse ethnic, religious and class identities"
    zh: "分析族群、宗教和阶级身份"
    zh-TW: "分析族群、宗教和階級身分"
    ja: "民族・宗教・階級のアイデンティティを分析する"
    ko: "민족·종교·계급 정체성 분석하기"
    vi: "Phân tích bản sắc sắc tộc, tôn giáo và giai cấp"
    ms: "Analisis identiti etnik, agama dan kelas"
    id: "Menganalisis identitas etnis, agama, dan kelas"
    hi: "जातीय, धार्मिक और वर्गीय पहचानों का विश्लेषण करना"
