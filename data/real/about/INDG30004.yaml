code: INDG30004
year: 2026
learn:
  en: "Aboriginal fiction, poetry, drama and life stories: their variety of voice and place, and how non-Aboriginal readers approach them."
  zh: "原住民的小说、诗歌、戏剧和生命故事：声音与地域的多样性，以及非原住民读者如何阅读它们。"
  zh-TW: "原住民的小說、詩歌、戲劇和生命故事：聲音與地域的多樣性，以及非原住民讀者如何閱讀它們。"
  ja: "アボリジナルの小説、詩、戯曲、ライフストーリー。声と土地の多様性、そして非先住民の読者はどう向き合うか。"
  ko: "애버리지니의 소설, 시, 희곡, 생애 이야기. 목소리와 장소의 다양성, 비원주민 독자는 어떻게 읽을까."
  vi: "Tiểu thuyết, thơ, kịch và hồi ký của thổ dân: sự đa dạng giọng điệu, vùng đất, và cách người đọc không phải thổ dân tiếp cận."
  ms: "Fiksyen, puisi, drama dan kisah hidup Orang Asli: kepelbagaian suara dan tempat, serta cara pembaca bukan Orang Asli mendekatinya."
  id: "Fiksi, puisi, drama dan kisah hidup Aborigin: ragam suara dan tempat, serta cara pembaca non-Aborigin mendekatinya."
  hi: "आदिवासी कथा, कविता, नाटक और जीवन-कथाएँ: आवाज़ और जगह की विविधता, और गैर-आदिवासी पाठक उन्हें कैसे पढ़ें।"
outcomes:
  - en: "Read a range of Aboriginal writing closely"
    zh: "细读多种原住民作品"
    zh-TW: "細讀多種原住民作品"
    ja: "さまざまなアボリジナル文学を精読する"
    ko: "다양한 애버리지니 작품 꼼꼼히 읽기"
    vi: "Đọc kỹ nhiều tác phẩm của thổ dân"
    ms: "Baca pelbagai tulisan Orang Asli dengan teliti"
    id: "Membaca cermat berbagai tulisan Aborigin"
    hi: "कई तरह के आदिवासी लेखन को ध्यान से पढ़ना"
  - en: "Reflect on your own reading position"
    zh: "反思自己的阅读立场"
    zh-TW: "反思自己的閱讀立場"
    ja: "自分の読み手としての立場を振り返る"
    ko: "독자로서 자신의 위치 성찰하기"
    vi: "Suy ngẫm vị trí đọc của bản thân"
    ms: "Renungkan kedudukan diri sebagai pembaca"
    id: "Merefleksikan posisi diri sebagai pembaca"
    hi: "पाठक के रूप में अपनी स्थिति पर विचार करना"
  - en: "Explain how politics shapes a text's reception"
    zh: "说明政治如何影响作品的接受"
    zh-TW: "說明政治如何影響作品的接受"
    ja: "政治が作品の受容をどう左右するか説明する"
    ko: "정치가 작품의 수용을 어떻게 좌우하는지 설명하기"
    vi: "Giải thích chính trị ảnh hưởng việc đón nhận tác phẩm"
    ms: "Terangkan cara politik mempengaruhi penerimaan teks"
    id: "Menjelaskan cara politik memengaruhi penerimaan teks"
    hi: "राजनीति किसी रचना की स्वीकार्यता को कैसे प्रभावित करती है, समझाना"
