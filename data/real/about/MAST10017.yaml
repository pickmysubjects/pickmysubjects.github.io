code: MAST10017
year: 2026
learn:
  en: "Foundation maths for later study in science, statistics and business: algebra, functions, statistics and basic calculus."
  zh: "为理科、统计和商科打基础的数学：代数、函数、统计和基础微积分。"
  zh-TW: "為理科、統計和商科打基礎的數學：代數、函數、統計和基礎微積分。"
  ja: "理系・統計・ビジネスの学習に向けた基礎数学：代数、関数、統計、基礎微積分。"
  ko: "이후 과학, 통계, 경영 공부를 위한 기초 수학: 대수, 함수, 통계, 기초 미적분."
  vi: "Toán nền tảng cho việc học khoa học, thống kê và kinh doanh sau này: đại số, hàm số, thống kê và giải tích cơ bản."
  ms: "Matematik asas untuk pengajian sains, statistik dan perniagaan kelak: aljabar, fungsi, statistik dan kalkulus asas."
  id: "Matematika dasar untuk studi sains, statistika, dan bisnis nanti: aljabar, fungsi, statistika, dan kalkulus dasar."
  hi: "आगे साइंस, स्टैटिस्टिक्स और बिज़नेस पढ़ने के लिए बुनियादी गणित: अलजेब्रा, फ़ंक्शन, स्टैटिस्टिक्स और बेसिक कैलकुलस।"
outcomes:
  - en: "Solve equations and graph common functions"
    zh: "解方程、画常见函数图像"
    zh-TW: "解方程、畫常見函數圖形"
    ja: "方程式を解き、よく使う関数のグラフを描く"
    ko: "방정식 풀기와 주요 함수 그래프 그리기"
    vi: "Giải phương trình và vẽ đồ thị hàm thường gặp"
    ms: "Selesaikan persamaan dan graf fungsi biasa"
    id: "Menyelesaikan persamaan dan menggambar grafik fungsi umum"
    hi: "समीकरण हल करना और आम फ़ंक्शन के ग्राफ़ बनाना"
  - en: "Work out basic probabilities and analyse simple data"
    zh: "算基础概率、分析简单数据"
    zh-TW: "算基礎機率、分析簡單資料"
    ja: "基本的な確率を求め、簡単なデータを分析する"
    ko: "기초 확률 계산과 간단한 데이터 분석"
    vi: "Tính xác suất cơ bản và phân tích dữ liệu đơn giản"
    ms: "Kira kebarangkalian asas dan analisis data ringkas"
    id: "Menghitung peluang dasar dan menganalisis data sederhana"
    hi: "बेसिक प्रायिकता निकालना और सरल डेटा का विश्लेषण"
  - en: "Differentiate and integrate simple functions"
    zh: "对简单函数求导和积分"
    zh-TW: "對簡單函數求導和積分"
    ja: "簡単な関数を微分・積分する"
    ko: "간단한 함수의 미분과 적분"
    vi: "Đạo hàm và tích phân hàm đơn giản"
    ms: "Bezakan dan kamirkan fungsi mudah"
    id: "Menurunkan dan mengintegralkan fungsi sederhana"
    hi: "सरल फ़ंक्शन का अवकलन और समाकलन"
