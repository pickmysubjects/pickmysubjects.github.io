code: MAST90112
year: 2027
learn:
  en: "Advanced methods in stochastic processes as preparation for probability research; exact topics vary by lecturer."
  zh: "随机过程的高级方法，为概率研究做准备；具体内容视讲师而定。"
  zh-TW: "隨機過程的進階方法，為機率研究做準備；具體內容依授課教師而定。"
  ja: "確率過程の高度な手法。確率論研究への準備で、内容は担当者により変わる。"
  ko: "확률과정의 고급 방법, 확률론 연구 준비용이며 내용은 담당 교수에 따라 다름."
  vi: "Phương pháp nâng cao về quá trình ngẫu nhiên, chuẩn bị nghiên cứu xác suất; nội dung tùy giảng viên."
  ms: "Kaedah lanjutan proses stokastik sebagai persediaan penyelidikan; topik bergantung pada pensyarah."
  id: "Metode lanjut proses stokastik untuk persiapan riset probabilitas; topik tergantung dosen."
  hi: "स्टोकेस्टिक प्रक्रियाओं की उन्नत विधियाँ, प्रायिकता रिसर्च की तैयारी; विषय शिक्षक पर निर्भर।"
outcomes:
  - en: "Analyse stochastic models with modern techniques"
    zh: "用现代方法分析随机模型"
    zh-TW: "用現代方法分析隨機模型"
    ja: "現代的手法で確率モデルを分析する"
    ko: "현대적 기법으로 확률 모델 분석하기"
    vi: "Phân tích mô hình ngẫu nhiên bằng kỹ thuật hiện đại"
    ms: "Menganalisis model stokastik dengan teknik moden"
    id: "Menganalisis model stokastik dengan teknik modern"
    hi: "आधुनिक तकनीकों से स्टोकेस्टिक मॉडल का विश्लेषण करना"
  - en: "Model real situations involving uncertainty"
    zh: "为含不确定性的实际情境建模"
    zh-TW: "為含不確定性的實際情境建模"
    ja: "不確実性を含む現実の状況をモデル化する"
    ko: "불확실성이 있는 실제 상황 모델링하기"
    vi: "Mô hình hóa tình huống thực có yếu tố bất định"
    ms: "Memodelkan situasi sebenar yang melibatkan ketidakpastian"
    id: "Memodelkan situasi nyata yang penuh ketidakpastian"
    hi: "अनिश्चितता वाली असली स्थितियों का मॉडल बनाना"
