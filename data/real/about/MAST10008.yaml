code: MAST10008
year: 2026
learn:
  en: "Fast-paced maths covering linear algebra and calculus of two variables, with an introduction to proofs."
  zh: "快节奏数学：线性代数和二元微积分，并学写证明。"
  zh-TW: "快節奏數學：線性代數和雙變數微積分，並學寫證明。"
  ja: "速いペースで線形代数と2変数の微積分を学び、証明の入門も行う。"
  ko: "빠른 진도의 수학: 선형대수와 이변수 미적분, 증명 입문 포함."
  vi: "Toán tốc độ nhanh gồm đại số tuyến tính và giải tích hai biến, kèm nhập môn chứng minh."
  ms: "Matematik pantas merangkumi aljabar linear dan kalkulus dua pemboleh ubah, dengan pengenalan pembuktian."
  id: "Matematika cepat mencakup aljabar linear dan kalkulus dua variabel, dengan pengantar pembuktian."
  hi: "तेज़ रफ़्तार गणित: लीनियर अलजेब्रा और दो चर का कैलकुलस, प्रमाण के परिचय के साथ।"
outcomes:
  - en: "Solve linear equation systems with matrices"
    zh: "用矩阵解线性方程组"
    zh-TW: "用矩陣解線性方程組"
    ja: "行列で連立一次方程式を解く"
    ko: "행렬로 연립일차방정식 풀기"
    vi: "Giải hệ phương trình tuyến tính bằng ma trận"
    ms: "Selesaikan sistem persamaan linear dengan matriks"
    id: "Menyelesaikan sistem persamaan linear dengan matriks"
    hi: "मैट्रिक्स से रैखिक समीकरण निकाय हल करना"
  - en: "Differentiate and integrate two-variable functions"
    zh: "对二元函数求导和积分"
    zh-TW: "對雙變數函數求導和積分"
    ja: "2変数関数を微分・積分する"
    ko: "이변수 함수의 미분과 적분"
    vi: "Đạo hàm và tích phân hàm hai biến"
    ms: "Bezakan dan kamirkan fungsi dua pemboleh ubah"
    id: "Menurunkan dan mengintegralkan fungsi dua variabel"
    hi: "दो चर वाले फ़ंक्शन का अवकलन और समाकलन"
  - en: "Write a simple mathematical proof"
    zh: "写简单的数学证明"
    zh-TW: "寫簡單的數學證明"
    ja: "簡単な数学的証明を書く"
    ko: "간단한 수학 증명 작성"
    vi: "Viết chứng minh toán học đơn giản"
    ms: "Tulis bukti matematik ringkas"
    id: "Menulis pembuktian matematika sederhana"
    hi: "सरल गणितीय प्रमाण लिखना"
