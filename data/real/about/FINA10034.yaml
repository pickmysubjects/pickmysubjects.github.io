code: FINA10034
year: 2026
learn:
  en: "Build a more self-directed, experimental studio practice and meet local galleries and working artists."
  zh: "建立更自主、更具实验性的创作实践，并接触本地画廊和职业艺术家。"
  zh-TW: "建立更自主、更具實驗性的創作實踐，並接觸在地藝廊和職業藝術家。"
  ja: "より自主的で実験的な制作を確立し、地元のギャラリーや現役アーティストに触れる。"
  ko: "더 자기주도적이고 실험적인 작업을 구축하고 지역 갤러리와 현역 작가를 만난다."
  vi: "Xây dựng lối sáng tác tự chủ, thử nghiệm hơn và làm quen với phòng tranh, nghệ sĩ địa phương."
  ms: "Membina amalan studio yang lebih berdikari dan eksperimental serta mengenali galeri dan artis tempatan."
  id: "Membangun praktik studio yang lebih mandiri dan eksperimental serta mengenal galeri dan seniman lokal."
  hi: "ज़्यादा स्वतंत्र और प्रयोगधर्मी स्टूडियो अभ्यास बनाना, और स्थानीय गैलरियों व कलाकारों से मिलना।"
outcomes:
  - en: "Extend your skills with more methods and materials"
    zh: "用更多方法和材料拓展技能"
    zh-TW: "用更多方法和材料拓展技能"
    ja: "より多くの技法と素材で技能を広げる"
    ko: "더 많은 기법과 재료로 기술 넓히기"
    vi: "Mở rộng kỹ năng với nhiều cách làm và chất liệu"
    ms: "Meluaskan kemahiran dengan lebih banyak kaedah dan bahan"
    id: "Memperluas keterampilan dengan lebih banyak cara dan bahan"
    hi: "ज़्यादा तरीक़ों और सामग्री से कौशल बढ़ाना"
  - en: "Set up ongoing experiment and research habits"
    zh: "养成持续实验与研究的习惯"
    zh-TW: "養成持續實驗與研究的習慣"
    ja: "継続的な実験と調査の習慣をつける"
    ko: "꾸준한 실험·조사 습관 만들기"
    vi: "Hình thành thói quen thử nghiệm và nghiên cứu"
    ms: "Membina tabiat eksperimen dan penyelidikan berterusan"
    id: "Membangun kebiasaan eksperimen dan riset berkelanjutan"
    hi: "लगातार प्रयोग और शोध की आदत बनाना"
  - en: "Place artists and galleries within the art world"
    zh: "了解艺术家和画廊在艺术界中的位置"
    zh-TW: "了解藝術家和藝廊在藝術界中的位置"
    ja: "作家やギャラリーの美術界での位置を理解する"
    ko: "작가와 갤러리의 미술계 내 위치 파악하기"
    vi: "Xác định vị trí nghệ sĩ và phòng tranh trong giới nghệ thuật"
    ms: "Memahami kedudukan artis dan galeri dalam dunia seni"
    id: "Memahami posisi seniman dan galeri di dunia seni"
    hi: "कला जगत में कलाकारों और गैलरियों की जगह समझना"
