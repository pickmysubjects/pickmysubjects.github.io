code: PROP30001
year: 2026
learn:
  en: "How market value is worked out for houses and commercial property in Victoria, using the main valuation methods."
  zh: "如何用主要估价方法评估维州住宅和商业物业的市场价值。"
  zh-TW: "如何用主要估價方法評估維州住宅與商業不動產的市場價值。"
  ja: "主な評価手法で、ビクトリア州の住宅・商業不動産の市場価値を求める方法。"
  ko: "주요 감정평가 방법으로 빅토리아주 주택·상업용 부동산의 시장가치를 산정하는 법."
  vi: "Cách xác định giá thị trường của nhà ở và bất động sản thương mại ở Victoria bằng các phương pháp định giá chính."
  ms: "Cara menentukan nilai pasaran rumah dan hartanah komersial di Victoria dengan kaedah penilaian utama."
  id: "Cara menentukan nilai pasar rumah dan properti komersial di Victoria dengan metode penilaian utama."
  hi: "मुख्य मूल्यांकन विधियों से विक्टोरिया में घरों और व्यावसायिक संपत्ति का बाज़ार मूल्य निकालना।"
outcomes:
  - en: "Value a property by direct comparison"
    zh: "用直接比较法给物业估价"
    zh-TW: "用直接比較法為不動產估價"
    ja: "取引事例比較法で不動産を評価する"
    ko: "거래사례비교법으로 부동산 평가하기"
    vi: "Định giá bất động sản bằng phương pháp so sánh"
    ms: "Nilai hartanah dengan perbandingan langsung"
    id: "Menilai properti dengan perbandingan langsung"
    hi: "सीधी तुलना से संपत्ति का मूल्य आँकना"
  - en: "Collect and analyse market data on sales and rents"
    zh: "收集并分析销售和租金市场数据"
    zh-TW: "蒐集並分析買賣與租金市場資料"
    ja: "売買・賃料の市場データを集めて分析する"
    ko: "매매·임대 시장 데이터 수집·분석하기"
    vi: "Thu thập, phân tích dữ liệu mua bán và thuê"
    ms: "Kumpul dan analisis data jualan dan sewa"
    id: "Mengumpulkan dan menganalisis data jual dan sewa"
    hi: "बिक्री और किराए के बाज़ार डेटा जुटाना और परखना"
  - en: "Write up and report a valuation"
    zh: "撰写估价报告"
    zh-TW: "撰寫估價報告"
    ja: "評価結果を報告書にまとめる"
    ko: "감정평가 보고서 작성하기"
    vi: "Viết báo cáo định giá"
    ms: "Tulis laporan penilaian"
    id: "Menulis laporan penilaian"
    hi: "मूल्यांकन रिपोर्ट लिखना"
