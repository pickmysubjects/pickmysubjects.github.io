code: LANG10001
year: 2026
learn:
  en: "A tour of how language works, how we learn it, and the part it plays in real issues like law, identity and migration."
  zh: "带你了解语言如何运作、我们怎样学会语言，以及语言在法律、身份和移民等现实问题中的作用。"
  zh-TW: "帶你了解語言如何運作、我們怎樣學會語言，以及語言在法律、身分和移民等現實問題中的作用。"
  ja: "言語の仕組み、言語の習得、そして法律・アイデンティティ・移民など現実の問題で言語が果たす役割をひと通り学ぶ。"
  ko: "언어가 작동하는 방식, 언어를 배우는 과정, 그리고 법·정체성·이민 같은 현실 문제에서 언어의 역할을 두루 살핀다."
  vi: "Tìm hiểu ngôn ngữ vận hành thế nào, con người học nó ra sao và vai trò của nó trong pháp luật, bản sắc, di cư."
  ms: "Mengenali cara bahasa berfungsi, cara kita mempelajarinya, dan peranannya dalam isu sebenar seperti undang-undang, identiti dan migrasi."
  id: "Mengenal cara kerja bahasa, cara kita mempelajarinya, dan perannya dalam isu nyata seperti hukum, identitas, dan migrasi."
  hi: "भाषा कैसे काम करती है, हम उसे कैसे सीखते हैं और कानून, पहचान व प्रवास जैसे असली मुद्दों में उसकी भूमिका।"
outcomes:
  - en: "Describe language as a system that can be analysed"
    zh: "把语言当作可分析的系统来描述"
    zh-TW: "把語言當作可分析的系統來描述"
    ja: "言語を分析できる体系として説明する"
    ko: "언어를 분석 가능한 체계로 설명하기"
    vi: "Mô tả ngôn ngữ như một hệ thống có thể phân tích"
    ms: "Huraikan bahasa sebagai sistem yang boleh dianalisis"
    id: "Menjelaskan bahasa sebagai sistem yang bisa dianalisis"
    hi: "भाषा को ऐसे सिस्टम के रूप में समझाना जिसका विश्लेषण हो सके"
  - en: "Weigh up research and arguments about language"
    zh: "评估有关语言的研究和观点"
    zh-TW: "評估有關語言的研究和觀點"
    ja: "言語に関する研究や主張を評価する"
    ko: "언어에 관한 연구와 주장 평가하기"
    vi: "Đánh giá các nghiên cứu và lập luận về ngôn ngữ"
    ms: "Nilai kajian dan hujah tentang bahasa"
    id: "Menilai penelitian dan argumen tentang bahasa"
    hi: "भाषा पर शोध और तर्कों को परखना"
  - en: "Link language to real-world issues"
    zh: "把语言和现实问题联系起来"
    zh-TW: "把語言和現實問題連結起來"
    ja: "言語と現実の問題を結びつけて考える"
    ko: "언어를 현실 문제와 연결하기"
    vi: "Liên hệ ngôn ngữ với các vấn đề thực tế"
    ms: "Kaitkan bahasa dengan isu dunia sebenar"
    id: "Mengaitkan bahasa dengan masalah nyata"
    hi: "भाषा को असली दुनिया के मुद्दों से जोड़ना"
