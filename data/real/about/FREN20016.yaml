code: FREN20016
year: 2026
learn:
  en: "Strengthen all four French skills while exploring French-speaking communities worldwide through songs, films, comics and news."
  zh: "全面提升法语四项技能，同时通过歌曲、电影、漫画和新闻认识世界各地的法语社群。"
  zh-TW: "全面提升法語四項技能，同時透過歌曲、電影、漫畫和新聞認識世界各地的法語社群。"
  ja: "歌、映画、漫画、ニュースを通じて世界のフランス語圏を知りながら、4技能を総合的に伸ばす。"
  ko: "노래, 영화, 만화, 뉴스로 세계의 프랑스어권 공동체를 탐구하며 네 가지 언어 기능을 고루 키운다."
  vi: "Nâng cả bốn kỹ năng tiếng Pháp khi tìm hiểu cộng đồng nói tiếng Pháp toàn cầu qua bài hát, phim, truyện tranh và tin tức."
  ms: "Kukuhkan keempat-empat kemahiran Perancis sambil meneroka komuniti berbahasa Perancis di dunia melalui lagu, filem, komik dan berita."
  id: "Memperkuat empat keterampilan bahasa Prancis sambil menjelajahi komunitas berbahasa Prancis dunia lewat lagu, film, komik dan berita."
  hi: "गानों, फ़िल्मों, कॉमिक्स और खबरों से दुनिया भर के फ़्रेंच-भाषी समुदायों को जानते हुए फ़्रेंच के चारों कौशल मज़बूत करना।"
outcomes:
  - en: "Use French more independently and accurately"
    zh: "更独立、更准确地使用法语"
    zh-TW: "更獨立、更準確地使用法語"
    ja: "フランス語をより自立して正確に使う"
    ko: "프랑스어를 더 독립적이고 정확하게 쓰기"
    vi: "Dùng tiếng Pháp độc lập và chính xác hơn"
    ms: "Guna bahasa Perancis dengan lebih bebas dan tepat"
    id: "Memakai bahasa Prancis lebih mandiri dan akurat"
    hi: "फ़्रेंच का ज़्यादा स्वतंत्र और सही इस्तेमाल करना"
  - en: "Describe the diversity of the French-speaking world"
    zh: "描述法语世界的多样性"
    zh-TW: "描述法語世界的多樣性"
    ja: "フランス語圏の多様性を説明する"
    ko: "프랑스어권 세계의 다양성 설명하기"
    vi: "Mô tả sự đa dạng của thế giới nói tiếng Pháp"
    ms: "Huraikan kepelbagaian dunia berbahasa Perancis"
    id: "Menggambarkan keragaman dunia berbahasa Prancis"
    hi: "फ़्रेंच-भाषी दुनिया की विविधता बताना"
  - en: "Carry out a research project in French"
    zh: "用法语完成一个研究项目"
    zh-TW: "用法語完成一個研究專案"
    ja: "フランス語で調査課題に取り組む"
    ko: "프랑스어로 연구 과제 수행하기"
    vi: "Thực hiện một dự án nghiên cứu bằng tiếng Pháp"
    ms: "Jalankan projek penyelidikan dalam bahasa Perancis"
    id: "Mengerjakan proyek riset dalam bahasa Prancis"
    hi: "फ़्रेंच में एक शोध प्रोजेक्ट करना"
