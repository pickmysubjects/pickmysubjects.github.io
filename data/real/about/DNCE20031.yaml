code: DNCE20031
year: 2026
learn:
  en: "Next-step dance: technique, choreography and rehearsal, ending in a group show with lighting and sound design."
  zh: "进阶舞蹈：技巧、编舞与排练，最后完成一场有灯光音响的小组演出。"
  zh-TW: "進階舞蹈：技巧、編舞與排練，最後完成一場有燈光音響的小組演出。"
  ja: "ダンスの次の段階：技術・振付・リハーサルを学び、照明と音響付きのグループ公演で締めくくる。"
  ko: "한 단계 위 댄스: 기술·안무·리허설을 익히고 조명·음향을 갖춘 그룹 공연으로 마무리."
  vi: "Múa nâng cao: kỹ thuật, biên đạo, tập luyện, kết thúc bằng buổi diễn nhóm có ánh sáng và âm thanh."
  ms: "Tarian peringkat seterusnya: teknik, koreografi dan latihan, diakhiri persembahan kumpulan dengan lampu dan bunyi."
  id: "Tari lanjutan: teknik, koreografi dan latihan, diakhiri pertunjukan kelompok dengan tata cahaya dan suara."
  hi: "अगले स्तर का नृत्य: तकनीक, कोरियोग्राफी और रिहर्सल, अंत में लाइट और साउंड के साथ ग्रुप शो।"
outcomes:
  - en: "Apply dance techniques and choreography principles"
    zh: "运用舞蹈技巧和编舞原则"
    zh-TW: "運用舞蹈技巧和編舞原則"
    ja: "ダンス技術と振付の原則を使う"
    ko: "춤 기술과 안무 원칙 적용하기"
    vi: "Áp dụng kỹ thuật múa và nguyên tắc biên đạo"
    ms: "Guna teknik tarian dan prinsip koreografi"
    id: "Menerapkan teknik tari dan prinsip koreografi"
    hi: "नृत्य तकनीक और कोरियोग्राफी के सिद्धांत लागू करना"
  - en: "Use lighting and sound to shape a dance show"
    zh: "用灯光和音响塑造舞蹈演出"
    zh-TW: "用燈光和音響塑造舞蹈演出"
    ja: "照明と音響でダンス公演を作る"
    ko: "조명과 음향으로 공연 연출하기"
    vi: "Dùng ánh sáng và âm thanh cho buổi diễn múa"
    ms: "Guna lampu dan bunyi untuk membentuk persembahan"
    id: "Memakai tata cahaya dan suara untuk pertunjukan tari"
    hi: "नृत्य शो में लाइट और साउंड का उपयोग करना"
  - en: "Document and reflect on your creative process"
    zh: "记录并反思自己的创作过程"
    zh-TW: "記錄並反思自己的創作過程"
    ja: "自分の創作過程を記録し振り返る"
    ko: "창작 과정을 기록하고 성찰하기"
    vi: "Ghi lại và suy ngẫm về quá trình sáng tác"
    ms: "Dokumentasi dan renungkan proses kreatif anda"
    id: "Mendokumentasikan dan merefleksikan proses kreatif"
    hi: "अपनी रचनात्मक प्रक्रिया दर्ज करना और उस पर विचार करना"
