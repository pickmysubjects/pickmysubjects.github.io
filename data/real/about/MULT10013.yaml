code: MULT10013
year: 2027
learn:
  en: "Teams design sustainable solutions for real community projects in the Engineers Without Borders challenge."
  zh: "以团队参加无国界工程师挑战，为真实社区项目设计可持续方案。"
  zh-TW: "以團隊參加無國界工程師挑戰，為真實社區專案設計永續方案。"
  ja: "国境なき技師団のチャレンジで、実在の地域プロジェクトに持続可能な解決策をチームで考える。"
  ko: "국경없는 엔지니어회(EWB) 챌린지에서 팀으로 실제 지역사회 프로젝트의 지속가능한 해법 설계."
  vi: "Làm việc nhóm trong thử thách Engineers Without Borders, thiết kế giải pháp bền vững cho dự án cộng đồng thực tế."
  ms: "Pasukan mereka bentuk penyelesaian mampan untuk projek komuniti sebenar dalam cabaran Engineers Without Borders."
  id: "Tim merancang solusi berkelanjutan untuk proyek komunitas nyata dalam tantangan Engineers Without Borders."
  hi: "Engineers Without Borders चैलेंज में टीमें असल सामुदायिक परियोजनाओं के लिए टिकाऊ समाधान बनाती हैं।"
outcomes:
  - en: "Solve problems with a whole-system view of the context"
    zh: "从系统角度结合实际情境解决问题"
    zh-TW: "從系統角度結合實際情境解決問題"
    ja: "状況全体を見るシステム思考で問題を解く"
    ko: "상황 전체를 보는 시스템 관점으로 문제 해결하기"
    vi: "Giải quyết vấn đề bằng góc nhìn hệ thống theo bối cảnh"
    ms: "Selesaikan masalah dengan pendekatan sistem mengikut konteks"
    id: "Memecahkan masalah dengan pendekatan sistem sesuai konteks"
    hi: "संदर्भ को समग्र रूप से देखकर समस्या हल करना"
  - en: "Weigh environmental, ethical and community factors"
    zh: "综合考虑环境、伦理和社区因素"
    zh-TW: "綜合考量環境、倫理和社區因素"
    ja: "環境・倫理・地域社会の要素を比較検討する"
    ko: "환경·윤리·지역사회 요소를 함께 따지기"
    vi: "Cân nhắc yếu tố môi trường, đạo đức và cộng đồng"
    ms: "Timbang faktor alam sekitar, etika dan komuniti"
    id: "Menimbang faktor lingkungan, etika, dan komunitas"
    hi: "पर्यावरण, नैतिक और सामुदायिक पहलुओं को तौलना"
  - en: "Communicate with professionals and the community"
    zh: "与专业人士和社区有效沟通"
    zh-TW: "與專業人士和社區有效溝通"
    ja: "専門家や地域の人々と効果的に伝え合う"
    ko: "전문가와 지역사회와 효과적으로 소통하기"
    vi: "Giao tiếp hiệu quả với chuyên gia và cộng đồng"
    ms: "Berkomunikasi dengan profesional dan komuniti"
    id: "Berkomunikasi dengan profesional dan masyarakat"
    hi: "पेशेवरों और समुदाय से असरदार संवाद"
