code: ABPL90123
year: 2027
learn:
  en: "Parametric modelling and optimisation algorithms for generating and refining architectural designs in Rhino and Grasshopper."
  zh: "用 Rhino 和 Grasshopper 做参数化建模与优化算法，生成和改进建筑设计。"
  zh-TW: "用 Rhino 與 Grasshopper 做參數化建模與最佳化演算法，生成與改進建築設計。"
  ja: "Rhino と Grasshopper でのパラメトリック設計と最適化アルゴリズム。"
  ko: "Rhino·Grasshopper로 파라메트릭 모델링과 최적화 알고리즘을 써 건축 설계."
  vi: "Mô hình tham số và thuật toán tối ưu để tạo và cải thiện thiết kế kiến trúc bằng Rhino, Grasshopper."
  ms: "Pemodelan parametrik dan algoritma pengoptimuman untuk reka bentuk seni bina dengan Rhino dan Grasshopper."
  id: "Pemodelan parametrik dan algoritma optimasi untuk desain arsitektur dengan Rhino dan Grasshopper."
  hi: "Rhino और Grasshopper में पैरामीट्रिक मॉडलिंग और ऑप्टिमाइज़ेशन से वास्तु डिज़ाइन।"
outcomes:
  - en: "Frame a design problem computationally"
    zh: "用计算方式表述设计问题"
    zh-TW: "用計算方式表述設計問題"
    ja: "設計課題を計算的に定式化する"
    ko: "설계 문제를 계산적으로 정의하기"
    vi: "Diễn đạt bài toán thiết kế bằng tính toán"
    ms: "Merangka masalah reka bentuk secara pengkomputeran"
    id: "Merumuskan masalah desain secara komputasional"
    hi: "डिज़ाइन समस्या को कम्प्यूटेशनल रूप देना"
  - en: "Use optimisation to explore design options"
    zh: "用优化方法探索设计方案"
    zh-TW: "用最佳化方法探索設計方案"
    ja: "最適化で設計案を探る"
    ko: "최적화로 설계안 탐색하기"
    vi: "Dùng tối ưu hóa để khám phá phương án"
    ms: "Menggunakan pengoptimuman untuk meneroka pilihan"
    id: "Memakai optimasi untuk menjelajah opsi desain"
    hi: "ऑप्टिमाइज़ेशन से डिज़ाइन विकल्प खोजना"
