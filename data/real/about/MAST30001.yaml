code: MAST30001
year: 2026
learn:
  en: "Models for random things that change over time, like queues, networks, finance and genetics."
  zh: "随时间变化的随机过程模型，用在排队、网络、金融和遗传等领域。"
  zh-TW: "隨時間變化的隨機過程模型，用在排隊、網路、金融和遺傳等領域。"
  ja: "時間とともに変わるランダムな現象のモデル。待ち行列・ネットワーク・金融・遺伝など。"
  ko: "시간에 따라 변하는 무작위 현상의 모델. 대기열, 네트워크, 금융, 유전학 등."
  vi: "Mô hình cho hiện tượng ngẫu nhiên thay đổi theo thời gian như hàng đợi, mạng, tài chính, di truyền."
  ms: "Model untuk perkara rawak yang berubah mengikut masa, seperti giliran, rangkaian, kewangan dan genetik."
  id: "Model untuk hal acak yang berubah seiring waktu, seperti antrean, jaringan, keuangan, dan genetika."
  hi: "समय के साथ बदलने वाली यादृच्छिक चीज़ों के मॉडल, जैसे कतार, नेटवर्क, वित्त और आनुवंशिकी।"
outcomes:
  - en: "Use Poisson processes and Markov chains"
    zh: "会用泊松过程和马尔可夫链"
    zh-TW: "會用卜瓦松過程和馬可夫鏈"
    ja: "ポアソン過程とマルコフ連鎖を使う"
    ko: "포아송 과정과 마르코프 연쇄 사용하기"
    vi: "Dùng quá trình Poisson và xích Markov"
    ms: "Menggunakan proses Poisson dan rantai Markov"
    id: "Memakai proses Poisson dan rantai Markov"
    hi: "पॉइसन प्रोसेस और मार्कोव चेन का उपयोग"
  - en: "Build and simulate simple random models"
    zh: "建立并模拟简单的随机模型"
    zh-TW: "建立並模擬簡單的隨機模型"
    ja: "簡単な確率モデルを作りシミュレーションする"
    ko: "간단한 확률 모델 만들고 시뮬레이션하기"
    vi: "Xây dựng và mô phỏng mô hình ngẫu nhiên đơn giản"
    ms: "Membina dan mensimulasi model rawak mudah"
    id: "Membuat dan menyimulasikan model acak sederhana"
    hi: "सरल यादृच्छिक मॉडल बनाना और सिमुलेट करना"
  - en: "Analyse random processes in real-life examples"
    zh: "分析现实中的随机过程"
    zh-TW: "分析現實中的隨機過程"
    ja: "身近な例でランダム過程を分析する"
    ko: "실생활 사례에서 확률 과정 분석하기"
    vi: "Phân tích quá trình ngẫu nhiên trong ví dụ thực tế"
    ms: "Menganalisis proses rawak dalam contoh sebenar"
    id: "Menganalisis proses acak dalam contoh nyata"
    hi: "असल उदाहरणों में यादृच्छिक प्रक्रियाओं का विश्लेषण"
