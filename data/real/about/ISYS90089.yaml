code: ISYS90089
year: 2027
learn:
  en: "How organisations respond to digital disruption: change management models, with IS as both driver and tool of change."
  zh: "组织如何应对数字化颠覆：变革管理模型，以及信息系统作为变革推动力和工具的角色。"
  zh-TW: "組織如何因應數位衝擊：變革管理模型，以及資訊系統作為變革驅力與工具的角色。"
  ja: "組織がデジタルによる変化にどう対応するか：変革管理モデルと、変化の原因かつ手段としてのIS。"
  ko: "조직이 디지털 격변에 대응하는 방법: 변화 관리 모델, 변화의 동인이자 도구인 IS."
  vi: "Tổ chức ứng phó với biến động số ra sao: mô hình quản lý thay đổi, IS vừa là động lực vừa là công cụ."
  ms: "Cara organisasi menangani gangguan digital: model pengurusan perubahan, dengan IS sebagai pemacu dan alat."
  id: "Cara organisasi menghadapi disrupsi digital: model manajemen perubahan, dengan SI sebagai pendorong dan alat."
  hi: "संगठन डिजिटल उथल-पुथल से कैसे निपटते हैं: बदलाव प्रबंधन मॉडल, IS बदलाव का कारण भी और साधन भी।"
outcomes:
  - en: "Compare change management models and their risks"
    zh: "比较各种变革管理模型及其风险"
    zh-TW: "比較各種變革管理模型及其風險"
    ja: "変革管理モデルとそのリスクを比較する"
    ko: "변화 관리 모델과 그 위험 비교하기"
    vi: "So sánh các mô hình quản lý thay đổi và rủi ro"
    ms: "Membandingkan model pengurusan perubahan dan risikonya"
    id: "Membandingkan model manajemen perubahan dan risikonya"
    hi: "बदलाव प्रबंधन मॉडलों और उनके जोखिमों की तुलना करना"
  - en: "Apply change theory to a real organisation case"
    zh: "将变革理论应用于真实组织案例"
    zh-TW: "將變革理論應用於真實組織案例"
    ja: "変革理論を実在組織の事例に当てはめる"
    ko: "변화 이론을 실제 조직 사례에 적용하기"
    vi: "Áp dụng lý thuyết thay đổi vào một tình huống thật"
    ms: "Menggunakan teori perubahan pada kes organisasi sebenar"
    id: "Menerapkan teori perubahan pada kasus organisasi nyata"
    hi: "असली संगठन के केस पर बदलाव सिद्धांत लागू करना"
