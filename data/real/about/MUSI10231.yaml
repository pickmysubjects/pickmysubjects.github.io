code: MUSI10231
year: 2026
learn:
  en: "Write your own chamber music for instruments in the class: three short projects, each sketched, scored and played in class."
  zh: "为班上现有乐器创作室内乐：三个短项目，每个都先草拟、写谱，再在课上演奏。"
  zh-TW: "為班上現有樂器創作室內樂：三個短項目，每個都先草擬、寫譜，再在課堂上演奏。"
  ja: "クラスの楽器のために室内楽を作曲。3つの短い課題をスケッチ・作譜し授業で演奏。"
  ko: "반 친구들의 악기를 위한 실내악 작곡. 세 개의 짧은 과제를 스케치·악보화해 수업에서 연주."
  vi: "Sáng tác nhạc thính phòng cho nhạc cụ trong lớp: ba dự án ngắn, phác thảo, viết tổng phổ và diễn tại lớp."
  ms: "Gubah muzik kamar untuk alat dalam kelas: tiga projek pendek, dilakar, ditulis skor dan dimainkan di kelas."
  id: "Menggubah musik kamar untuk alat musik di kelas: tiga proyek pendek, dibuat sketsa, partitur, lalu dimainkan."
  hi: "कक्षा के वाद्यों के लिए चैम्बर संगीत रचना: तीन छोटे प्रोजेक्ट, स्केच, स्कोर और कक्षा में वादन।"
outcomes:
  - en: "Develop musical ideas from sketches"
    zh: "从草稿发展音乐构思"
    zh-TW: "從草稿發展音樂構思"
    ja: "スケッチから楽想を発展させる"
    ko: "스케치에서 악상 발전시키기"
    vi: "Phát triển ý nhạc từ bản phác thảo"
    ms: "Kembangkan idea muzik daripada lakaran"
    id: "Mengembangkan ide musik dari sketsa"
    hi: "स्केच से संगीत विचार विकसित करना"
  - en: "Write clear scores for solo to quartet"
    zh: "为独奏到四重奏写清晰的乐谱"
    zh-TW: "為獨奏到四重奏寫清楚的樂譜"
    ja: "独奏から四重奏まで明確な楽譜を書く"
    ko: "독주부터 사중주까지 명확한 악보 쓰기"
    vi: "Viết tổng phổ rõ ràng từ độc tấu đến tứ tấu"
    ms: "Tulis skor jelas dari solo hingga kuartet"
    id: "Menulis partitur jelas dari solo hingga kuartet"
    hi: "सोलो से क्वार्टेट तक साफ़ स्कोर लिखना"
  - en: "Hear your work played and refine it"
    zh: "聆听作品演奏并加以改进"
    zh-TW: "聆聽作品演奏並加以改進"
    ja: "演奏を聴いて作品を磨く"
    ko: "연주를 듣고 작품 다듬기"
    vi: "Nghe tác phẩm được diễn và chỉnh sửa"
    ms: "Dengar karya dimainkan dan perbaiki"
    id: "Mendengar karya dimainkan lalu memperbaikinya"
    hi: "अपनी रचना सुनकर सुधारना"
