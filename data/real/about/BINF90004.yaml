code: BINF90004
year: 2027
learn:
  en: "Case studies from current research showing bioinformatics applied to biology, farming and medicine."
  zh: "通过当前研究的案例，了解生物信息学在生物、农业和医学中的应用。"
  zh-TW: "透過當前研究的案例，了解生物資訊學在生物、農業與醫學的應用。"
  ja: "最新研究の事例から、生物・農業・医療へのバイオインフォ応用を学ぶ。"
  ko: "최신 연구 사례로 생물·농업·의학에서의 생물정보학 응용을 배운다."
  vi: "Các ca nghiên cứu hiện nay cho thấy tin sinh học trong sinh học, nông nghiệp, y học."
  ms: "Kajian kes penyelidikan semasa tentang bioinformatik dalam biologi, pertanian dan perubatan."
  id: "Studi kasus riset terkini tentang bioinformatika di biologi, pertanian, dan kedokteran."
  hi: "वर्तमान शोध के केस स्टडी से जीवविज्ञान, कृषि और चिकित्सा में बायोइन्फ़ॉर्मेटिक्स।"
outcomes:
  - en: "Apply bioinformatics tools to research problems"
    zh: "运用生物信息学工具解决研究问题"
    zh-TW: "運用生物資訊學工具解決研究問題"
    ja: "研究課題にツールを使う"
    ko: "연구 문제에 도구 적용하기"
    vi: "Áp dụng công cụ tin sinh học vào bài toán nghiên cứu"
    ms: "Menggunakan alat bioinformatik untuk masalah kajian"
    id: "Menerapkan alat bioinformatika pada masalah riset"
    hi: "शोध समस्याओं पर टूल लागू करना"
  - en: "Present and defend analysis strategies orally"
    zh: "口头展示并答辩分析思路"
    zh-TW: "口頭展示並答辯分析思路"
    ja: "解析方針を口頭で発表・説明する"
    ko: "분석 전략을 발표하고 방어하기"
    vi: "Thuyết trình và bảo vệ chiến lược phân tích"
    ms: "Membentang dan mempertahankan strategi analisis"
    id: "Mempresentasikan dan membela strategi analisis"
    hi: "विश्लेषण रणनीति प्रस्तुत करना और बचाव करना"
  - en: "Write clear science for a broad audience"
    zh: "为广泛读者撰写清晰的科学文字"
    zh-TW: "為廣泛讀者撰寫清晰的科學文字"
    ja: "幅広い読者に向けて分かりやすく書く"
    ko: "폭넓은 독자를 위해 쉽게 쓰기"
    vi: "Viết khoa học rõ ràng cho nhiều đối tượng"
    ms: "Menulis sains dengan jelas untuk umum"
    id: "Menulis sains dengan jelas untuk khalayak luas"
    hi: "व्यापक पाठकों के लिए स्पष्ट वैज्ञानिक लेखन"
