code: SCIE90038
year: 2027
learn:
  en: "How intelligence analysis supports security decisions: risk assessment, forecasting, cognitive biases and probabilistic reasoning."
  zh: "情报分析如何支持安全决策：风险评估、预测、认知偏差和概率推理。"
  zh-TW: "情報分析如何支持安全決策：風險評估、預測、認知偏誤與機率推理。"
  ja: "インテリジェンス分析が安全保障の判断を支える方法。リスク評価、予測、認知バイアス、確率的推論。"
  ko: "정보 분석이 안보 결정을 돕는 방식: 위험 평가, 예측, 인지 편향, 확률적 추론."
  vi: "Phân tích tình báo hỗ trợ quyết định an ninh ra sao: đánh giá rủi ro, dự báo, thiên kiến nhận thức và suy luận xác suất."
  ms: "Cara analisis perisikan menyokong keputusan keselamatan: penilaian risiko, ramalan, bias kognitif dan penaakulan kebarangkalian."
  id: "Cara analisis intelijen mendukung keputusan keamanan: penilaian risiko, peramalan, bias kognitif, dan penalaran probabilistik."
  hi: "खुफ़िया विश्लेषण सुरक्षा निर्णयों में कैसे मदद करता है: जोखिम आकलन, पूर्वानुमान, संज्ञानात्मक पूर्वाग्रह और संभाव्य तर्क।"
outcomes:
  - en: "Generate and test competing hypotheses"
    zh: "提出并检验相互竞争的假设"
    zh-TW: "提出並檢驗相互競爭的假設"
    ja: "対立する仮説を立てて検証する"
    ko: "경쟁 가설을 세우고 검증하기"
    vi: "Đưa ra và kiểm tra các giả thuyết cạnh tranh"
    ms: "Menjana dan menguji hipotesis bersaing"
    id: "Menyusun dan menguji hipotesis yang bersaing"
    hi: "प्रतिस्पर्धी परिकल्पनाएँ बनाना और जाँचना"
  - en: "Use probability and forecasting to inform decisions"
    zh: "用概率和预测支持决策"
    zh-TW: "用機率與預測支持決策"
    ja: "確率と予測で判断を支える"
    ko: "확률과 예측으로 의사결정 돕기"
    vi: "Dùng xác suất và dự báo để hỗ trợ quyết định"
    ms: "Mengguna kebarangkalian dan ramalan untuk keputusan"
    id: "Memakai probabilitas dan peramalan untuk keputusan"
    hi: "निर्णय के लिए संभावना और पूर्वानुमान का उपयोग"
  - en: "Give clear, actionable recommendations"
    zh: "提出清晰可行的建议"
    zh-TW: "提出清楚可行的建議"
    ja: "明確で実行可能な提言をする"
    ko: "명확하고 실행 가능한 권고하기"
    vi: "Đưa ra khuyến nghị rõ ràng, khả thi"
    ms: "Memberi cadangan yang jelas dan boleh dilaksana"
    id: "Memberi rekomendasi yang jelas dan dapat dijalankan"
    hi: "स्पष्ट और व्यावहारिक सिफ़ारिशें देना"
