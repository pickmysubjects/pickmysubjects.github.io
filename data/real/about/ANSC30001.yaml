code: ANSC30001
year: 2026
learn:
  en: "How animal diseases are caused, spread and diagnosed, with hands-on lab tests like ELISA, PCR and microbiology."
  zh: "动物疾病的成因、传播与诊断，动手做ELISA、PCR和微生物实验。"
  zh-TW: "動物疾病的成因、傳播與診斷，動手做ELISA、PCR和微生物實驗。"
  ja: "動物の病気の原因・伝播・診断を学び、ELISA、PCR、微生物検査を実習する。"
  ko: "동물 질병의 원인·전파·진단, ELISA·PCR·미생물 실험 실습."
  vi: "Nguyên nhân, lây lan và chẩn đoán bệnh động vật, thực hành ELISA, PCR, vi sinh."
  ms: "Punca, penyebaran dan diagnosis penyakit haiwan, dengan ujian makmal ELISA, PCR dan mikrobiologi."
  id: "Penyebab, penularan, dan diagnosis penyakit hewan, dengan praktik ELISA, PCR, dan mikrobiologi."
  hi: "पशु रोगों के कारण, फैलाव और निदान, ELISA, PCR और माइक्रोबायोलॉजी लैब के साथ।"
outcomes:
  - en: "Run lab tests to monitor herd health"
    zh: "做实验室检测监测畜群健康"
    zh-TW: "做實驗室檢測監測畜群健康"
    ja: "検査で家畜群の健康を監視する"
    ko: "실험실 검사로 가축 건강 모니터링하기"
    vi: "Làm xét nghiệm để theo dõi sức khỏe đàn"
    ms: "Jalankan ujian makmal untuk pantau kesihatan kawanan"
    id: "Melakukan uji lab untuk memantau kesehatan ternak"
    hi: "झुंड का स्वास्थ्य जाँचने के लिए लैब टेस्ट करना"
  - en: "Assess diagnostic test results"
    zh: "评估诊断检测结果"
    zh-TW: "評估診斷檢測結果"
    ja: "診断検査の結果を評価する"
    ko: "진단 검사 결과 평가하기"
    vi: "Đánh giá kết quả xét nghiệm chẩn đoán"
    ms: "Nilai keputusan ujian diagnostik"
    id: "Menilai hasil uji diagnostik"
    hi: "नैदानिक जाँच के नतीजे परखना"
  - en: "Apply formulas to evaluate diagnostic tests"
    zh: "用公式评估诊断检测"
    zh-TW: "用公式評估診斷檢測"
    ja: "公式を使って診断検査を評価する"
    ko: "공식으로 진단 검사 평가하기"
    vi: "Dùng công thức đánh giá xét nghiệm"
    ms: "Guna formula untuk menilai ujian diagnostik"
    id: "Memakai rumus untuk menilai uji diagnostik"
    hi: "सूत्रों से नैदानिक जाँच का मूल्यांकन करना"
