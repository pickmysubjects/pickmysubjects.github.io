code: COMP90090
year: 2027
learn:
  en: "Applied text analytics (NLP) for clinical and public health, using sources like health records and online communities."
  zh: "面向临床与公共卫生的文本分析（NLP），数据来自病历和网络社区等。"
  zh-TW: "面向臨床與公共衛生的文本分析（NLP），資料來自病歷與網路社群等。"
  ja: "臨床・公衆衛生向けのテキスト分析（NLP）。カルテやオンライン上の声などを使う。"
  ko: "임상·공중보건을 위한 텍스트 분석(NLP), 의무기록·온라인 커뮤니티 등 활용."
  vi: "Phân tích văn bản (NLP) cho lâm sàng và y tế công cộng, dùng hồ sơ bệnh án và cộng đồng mạng."
  ms: "Analitik teks (NLP) untuk klinikal dan kesihatan awam, guna rekod kesihatan dan komuniti dalam talian."
  id: "Analitik teks (NLP) untuk klinis dan kesehatan masyarakat, memakai rekam medis dan komunitas daring."
  hi: "क्लिनिकल और जन स्वास्थ्य के लिए टेक्स्ट एनालिटिक्स (NLP), हेल्थ रिकॉर्ड और ऑनलाइन समुदायों से।"
outcomes:
  - en: "Apply text analytics methods to health data"
    zh: "将文本分析方法用于健康数据"
    zh-TW: "將文本分析方法用於健康資料"
    ja: "健康データにテキスト分析を使う"
    ko: "건강 데이터에 텍스트 분석 적용하기"
    vi: "Áp dụng phân tích văn bản cho dữ liệu y tế"
    ms: "Guna kaedah analitik teks pada data kesihatan"
    id: "Menerapkan analitik teks pada data kesehatan"
    hi: "हेल्थ डेटा पर टेक्स्ट एनालिटिक्स लागू करना"
  - en: "Pick suitable text sources for a health question"
    zh: "为健康问题选择合适的文本来源"
    zh-TW: "為健康問題選擇合適的文本來源"
    ja: "健康の問いに合うテキスト源を選ぶ"
    ko: "건강 질문에 맞는 텍스트 출처 고르기"
    vi: "Chọn nguồn văn bản phù hợp cho câu hỏi y tế"
    ms: "Pilih sumber teks sesuai untuk soalan kesihatan"
    id: "Memilih sumber teks yang cocok untuk pertanyaan kesehatan"
    hi: "हेल्थ सवाल के लिए सही टेक्स्ट स्रोत चुनना"
