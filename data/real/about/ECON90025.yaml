code: ECON90025
year: 2027
learn:
  en: "How governments, the WTO, OECD and regional blocs like ASEAN and the EU shape trade and investment, focused on Asia."
  zh: "政府、WTO、OECD及东盟、欧盟等区域组织如何影响贸易与投资，侧重亚洲。"
  zh-TW: "政府、WTO、OECD及東協、歐盟等區域組織如何影響貿易與投資，著重亞洲。"
  ja: "政府、WTO、OECD、ASEANやEUなどの地域機構が貿易と投資に与える影響（アジア中心）。"
  ko: "정부, WTO, OECD, 아세안·EU 등 지역기구가 무역과 투자에 미치는 영향(아시아 중심)."
  vi: "Chính phủ, WTO, OECD và khối khu vực như ASEAN, EU định hình thương mại và đầu tư ra sao, tập trung châu Á."
  ms: "Cara kerajaan, WTO, OECD dan blok serantau seperti ASEAN dan EU membentuk perdagangan dan pelaburan, fokus Asia."
  id: "Cara pemerintah, WTO, OECD, dan blok kawasan seperti ASEAN dan UE membentuk perdagangan dan investasi, fokus Asia."
  hi: "सरकारें, WTO, OECD और ASEAN, EU जैसे क्षेत्रीय समूह व्यापार व निवेश को कैसे आकार देते हैं, एशिया पर ध्यान।"
outcomes:
  - en: "Explain the rules of world trade bodies"
    zh: "解释世界贸易组织机构的规则"
    zh-TW: "解釋世界貿易組織機構的規則"
    ja: "世界貿易機関のルールを説明する"
    ko: "세계무역기구의 규칙 설명하기"
    vi: "Giải thích quy tắc của các tổ chức thương mại"
    ms: "Menerangkan peraturan badan perdagangan dunia"
    id: "Menjelaskan aturan lembaga perdagangan dunia"
    hi: "विश्व व्यापार संस्थाओं के नियम समझाना"
  - en: "Analyse how trade policy affects multinationals"
    zh: "分析贸易政策对跨国企业的影响"
    zh-TW: "分析貿易政策對跨國企業的影響"
    ja: "貿易政策が多国籍企業に与える影響を分析する"
    ko: "무역정책이 다국적기업에 미치는 영향 분석하기"
    vi: "Phân tích tác động của chính sách thương mại lên công ty đa quốc gia"
    ms: "Menganalisis kesan dasar perdagangan pada syarikat multinasional"
    id: "Menganalisis dampak kebijakan dagang pada perusahaan multinasional"
    hi: "व्यापार नीति का बहुराष्ट्रीय कंपनियों पर असर विश्लेषित करना"
