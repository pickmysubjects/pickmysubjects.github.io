code: ABPL90029
year: 2027
learn:
  en: "An intro to Australian construction for property students: materials, structures, services, rules and inspections, with site visits."
  zh: "面向房地产学生的澳大利亚建筑业入门：材料、结构、设备、法规和验房，含工地参观。"
  zh-TW: "面向不動產學生的澳洲營建業入門：材料、結構、設備、法規與驗屋，含工地參訪。"
  ja: "不動産の学生向け豪州建設入門：材料、構造、設備、規制、建物検査。現場見学あり。"
  ko: "부동산 학생을 위한 호주 건설 입문: 재료, 구조, 설비, 규제, 건물 점검. 현장 견학."
  vi: "Nhập môn xây dựng Úc cho sinh viên bất động sản: vật liệu, kết cấu, hệ thống, quy định, có tham quan."
  ms: "Pengenalan pembinaan Australia untuk pelajar hartanah: bahan, struktur, servis dan peraturan."
  id: "Pengantar konstruksi Australia untuk mahasiswa properti: material, struktur, utilitas dan regulasi."
  hi: "संपत्ति छात्रों के लिए ऑस्ट्रेलियाई निर्माण परिचय: सामग्री, संरचना, सेवाएँ, नियम, साइट विज़िट सहित।"
outcomes:
  - en: "Describe how buildings are constructed and serviced"
    zh: "描述建筑如何建造以及设备系统"
    zh-TW: "描述建築如何興建與設備系統"
    ja: "建物の造り方と設備を説明する"
    ko: "건물의 시공과 설비 설명하기"
    vi: "Mô tả cách xây và trang bị tòa nhà"
    ms: "Menghuraikan cara bangunan dibina dan diservis"
    id: "Menjelaskan cara bangunan dibangun dan utilitasnya"
    hi: "इमारतें कैसे बनती हैं और सेवाएँ समझाना"
  - en: "Write a property inspection report"
    zh: "撰写物业检查报告"
    zh-TW: "撰寫不動產檢查報告"
    ja: "建物検査レポートを書く"
    ko: "부동산 점검 보고서 쓰기"
    vi: "Viết báo cáo kiểm tra bất động sản"
    ms: "Menulis laporan pemeriksaan hartanah"
    id: "Menulis laporan inspeksi properti"
    hi: "संपत्ति निरीक्षण रिपोर्ट लिखना"
