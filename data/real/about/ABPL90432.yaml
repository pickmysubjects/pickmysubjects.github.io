code: ABPL90432
year: 2027
learn:
  en: "Building Information Modelling: create and coordinate building models in Revit and Navisworks across design and construction."
  zh: "建筑信息模型：用Revit和Navisworks在设计与施工阶段创建并协调建筑模型。"
  zh-TW: "建築資訊模型：用Revit和Navisworks在設計與施工階段建立並協調建築模型。"
  ja: "BIM：RevitとNavisworksで設計・施工の建物モデルを作成・調整する。"
  ko: "BIM: Revit과 Navisworks로 설계·시공 단계의 건물 모델을 만들고 조율합니다."
  vi: "BIM: tạo và phối hợp mô hình công trình bằng Revit và Navisworks qua thiết kế và thi công."
  ms: "BIM: mencipta dan menyelaras model bangunan dengan Revit dan Navisworks."
  id: "BIM: membuat dan mengoordinasikan model bangunan dengan Revit dan Navisworks."
  hi: "BIM: Revit और Navisworks से डिज़ाइन व निर्माण में बिल्डिंग मॉडल बनाना और समन्वय।"
outcomes:
  - en: "Build a BIM model and drawing set"
    zh: "建立BIM模型和图纸"
    zh-TW: "建立BIM模型和圖紙"
    ja: "BIMモデルと図面一式をつくる"
    ko: "BIM 모델과 도면 세트 만들기"
    vi: "Tạo mô hình BIM và bộ bản vẽ"
    ms: "Membina model BIM dan set lukisan"
    id: "Membuat model BIM dan set gambar"
    hi: "BIM मॉडल और ड्रॉइंग सेट बनाना"
  - en: "Coordinate models and detect clashes"
    zh: "协调模型并检测碰撞"
    zh-TW: "協調模型並檢測碰撞"
    ja: "モデルを調整し干渉を検出する"
    ko: "모델 조율과 간섭 검토하기"
    vi: "Phối hợp mô hình và phát hiện xung đột"
    ms: "Menyelaras model dan mengesan pertembungan"
    id: "Mengoordinasi model dan mendeteksi benturan"
    hi: "मॉडल समन्वय और क्लैश पहचानना"
