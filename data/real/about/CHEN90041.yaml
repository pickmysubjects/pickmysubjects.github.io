code: CHEN90041
year: 2027
learn:
  en: "How air pollutants form in energy production and industry, their effects, and how to design controls for them."
  zh: "能源生产与工业中空气污染物如何形成、有何影响，以及如何设计控制方案。"
  zh-TW: "能源生產與工業中空氣污染物如何形成、有何影響，以及如何設計控制方案。"
  ja: "エネルギー生産や産業で大気汚染物質がどう生じ、何に影響し、どう制御するか。"
  ko: "에너지 생산과 산업에서 대기오염물질이 생기는 과정, 영향, 제어 설계."
  vi: "Chất ô nhiễm không khí hình thành ra sao trong năng lượng và công nghiệp, tác động và cách thiết kế kiểm soát."
  ms: "Bagaimana bahan cemar udara terbentuk dalam tenaga dan industri, kesannya, dan reka bentuk kawalannya."
  id: "Bagaimana polutan udara terbentuk di energi dan industri, dampaknya, dan cara merancang pengendaliannya."
  hi: "ऊर्जा उत्पादन और उद्योग में वायु प्रदूषक कैसे बनते हैं, उनके प्रभाव और नियंत्रण का डिज़ाइन।"
outcomes:
  - en: "Explain how combustion creates pollutants"
    zh: "解释燃烧过程如何产生污染物"
    zh-TW: "解釋燃燒過程如何產生污染物"
    ja: "燃焼で汚染物質が生じる仕組みを説明する"
    ko: "연소로 오염물질이 생기는 과정 설명하기"
    vi: "Giải thích quá trình đốt tạo ra chất ô nhiễm"
    ms: "Menerangkan cara pembakaran menghasilkan bahan cemar"
    id: "Menjelaskan cara pembakaran menghasilkan polutan"
    hi: "दहन से प्रदूषक कैसे बनते हैं, समझाना"
  - en: "Design pollution control equipment and strategies"
    zh: "设计污染控制设备和策略"
    zh-TW: "設計污染控制設備和策略"
    ja: "汚染制御装置と対策を設計する"
    ko: "오염 제어 장비와 전략 설계하기"
    vi: "Thiết kế thiết bị và chiến lược kiểm soát ô nhiễm"
    ms: "Mereka bentuk peralatan dan strategi kawalan pencemaran"
    id: "Merancang peralatan dan strategi pengendalian polusi"
    hi: "प्रदूषण नियंत्रण उपकरण और रणनीति डिज़ाइन करना"
