code: CICU30012
year: 2026
learn:
  en: "The Screen and Cultural Studies capstone: workshops, then a research or industry-linked project in a creative format."
  zh: "银幕与文化研究专业的毕业课：先参加工作坊，再以创意形式完成研究或业界相关项目。"
  zh-TW: "銀幕與文化研究主修的畢業課：先參加工作坊，再以創意形式完成研究或業界相關專題。"
  ja: "スクリーン・文化研究専攻の総まとめ。ワークショップの後、研究か業界と関わる課題を創造的な形で仕上げる。"
  ko: "스크린·문화연구 전공 캡스톤. 워크숍 후 연구나 업계 연계 프로젝트를 창의적 형식으로 완성한다."
  vi: "Môn tổng kết ngành Màn ảnh và Nghiên cứu văn hóa: hội thảo, rồi một dự án nghiên cứu hoặc gắn với ngành dưới dạng sáng tạo."
  ms: "Kursus kemuncak Kajian Skrin dan Budaya: bengkel, kemudian projek penyelidikan atau industri dalam format kreatif."
  id: "Mata kuliah puncak Kajian Layar dan Budaya: lokakarya, lalu proyek riset atau industri dalam format kreatif."
  hi: "स्क्रीन और कल्चरल स्टडीज़ का अंतिम कोर्स: वर्कशॉप, फिर रचनात्मक रूप में शोध या उद्योग से जुड़ा प्रोजेक्ट।"
outcomes:
  - en: "Place screen and cultural studies in today's world"
    zh: "把银幕与文化研究放在当今语境中理解"
    zh-TW: "把銀幕與文化研究放在當今語境中理解"
    ja: "スクリーン・文化研究を今日の文脈に位置づける"
    ko: "스크린·문화연구를 오늘의 맥락에 놓기"
    vi: "Đặt nghiên cứu màn ảnh và văn hóa vào bối cảnh hôm nay"
    ms: "Letakkan kajian skrin dan budaya dalam dunia kini"
    id: "Menempatkan kajian layar dan budaya dalam dunia kini"
    hi: "स्क्रीन और कल्चरल स्टडीज़ को आज की दुनिया में रखना"
  - en: "Plan and deliver a research or industry project"
    zh: "规划并完成一项研究或业界项目"
    zh-TW: "規劃並完成一項研究或業界專題"
    ja: "研究または業界の課題を計画し仕上げる"
    ko: "연구 또는 업계 프로젝트 계획하고 완수하기"
    vi: "Lên kế hoạch và hoàn thành dự án nghiên cứu hoặc thực tế"
    ms: "Rancang dan laksanakan projek penyelidikan atau industri"
    id: "Merencanakan dan menuntaskan proyek riset atau industri"
    hi: "शोध या उद्योग प्रोजेक्ट की योजना बनाकर पूरा करना"
  - en: "Present work in a creative format"
    zh: "以创意形式展示成果"
    zh-TW: "以創意形式展示成果"
    ja: "成果を創造的な形で発表する"
    ko: "창의적 형식으로 결과물 발표하기"
    vi: "Trình bày sản phẩm dưới hình thức sáng tạo"
    ms: "Persembahkan hasil dalam format kreatif"
    id: "Menyajikan karya dalam format kreatif"
    hi: "काम को रचनात्मक रूप में प्रस्तुत करना"
