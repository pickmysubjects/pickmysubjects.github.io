code: MEDS40007
year: 2027
learn:
  en: "Introduction to medical research: clinical research methods, research integrity, reading papers critically and evidence-based medicine."
  zh: "医学研究入门：临床研究方法、科研诚信、批判性阅读文献与循证医学。"
  zh-TW: "醫學研究入門：臨床研究方法、研究倫理、批判性閱讀文獻與實證醫學。"
  ja: "医学研究入門：臨床研究の方法、研究公正、論文の批判的読解、EBM。"
  ko: "의학 연구 입문: 임상 연구 방법, 연구 윤리, 논문 비판적 읽기, 근거 중심 의학."
  vi: "Nhập môn nghiên cứu y học: phương pháp nghiên cứu lâm sàng, liêm chính, đọc phản biện bài báo, y học thực chứng."
  ms: "Pengenalan penyelidikan perubatan: kaedah penyelidikan klinikal, integriti, membaca kertas secara kritis dan perubatan berasaskan bukti."
  id: "Pengantar riset medis: metode riset klinis, integritas riset, membaca makalah secara kritis, kedokteran berbasis bukti."
  hi: "चिकित्सा शोध का परिचय: क्लिनिकल शोध विधियाँ, शोध ईमानदारी, शोधपत्रों को आलोचनात्मक पढ़ना, साक्ष्य-आधारित चिकित्सा।"
outcomes:
  - en: "Find and critically appraise published clinical evidence"
    zh: "查找并批判性评价已发表的临床证据"
    zh-TW: "查找並批判性評估已發表的臨床證據"
    ja: "発表された臨床エビデンスを探し批判的に評価する"
    ko: "출판된 임상 근거를 찾고 비판적으로 평가하기"
    vi: "Tìm và đánh giá phản biện bằng chứng lâm sàng đã công bố"
    ms: "Mencari dan menilai secara kritis bukti klinikal yang diterbitkan"
    id: "Menemukan dan menilai kritis bukti klinis yang terbit"
    hi: "प्रकाशित क्लिनिकल साक्ष्य खोजना और उसका आलोचनात्मक मूल्यांकन करना"
  - en: "Communicate research findings in writing and in talks"
    zh: "用书面和口头方式交流研究结果"
    zh-TW: "以書面與口頭方式交流研究結果"
    ja: "研究結果を文章と口頭で伝える"
    ko: "연구 결과를 글과 발표로 전달하기"
    vi: "Truyền đạt kết quả nghiên cứu bằng văn bản và thuyết trình"
    ms: "Menyampaikan dapatan kajian secara bertulis dan lisan"
    id: "Menyampaikan hasil riset secara tertulis dan lisan"
    hi: "शोध के नतीजे लिखकर और बोलकर बताना"
