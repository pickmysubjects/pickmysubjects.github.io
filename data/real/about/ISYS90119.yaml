code: ISYS90119
year: 2027
learn:
  en: "A final-semester industry project: a team of four tackles a real client's problem and proposes an IS solution."
  zh: "最后一学期的行业项目：四人小组解决真实客户的问题，并提出信息系统方案。"
  zh-TW: "最後一學期的產業專題：四人小組解決真實客戶的問題，並提出資訊系統方案。"
  ja: "最終学期の産業プロジェクト：4人チームで実際の顧客の課題に取り組み、ISの解決策を提案する。"
  ko: "마지막 학기 산업 프로젝트: 4인 팀이 실제 고객의 문제를 다루고 IS 해결책 제안하기."
  vi: "Dự án doanh nghiệp kỳ cuối: nhóm bốn người giải quyết vấn đề của khách hàng thật và đề xuất giải pháp IS."
  ms: "Projek industri semester akhir: pasukan empat orang menangani masalah klien sebenar dan mencadangkan IS."
  id: "Proyek industri semester akhir: tim berempat menangani masalah klien nyata dan mengusulkan solusi SI."
  hi: "आख़िरी सेमेस्टर का इंडस्ट्री प्रोजेक्ट: चार लोगों की टीम असली क्लाइंट की समस्या पर IS समाधान सुझाती है।"
outcomes:
  - en: "Define requirements and design a solution for a client"
    zh: "为客户明确需求并设计方案"
    zh-TW: "為客戶釐清需求並設計方案"
    ja: "顧客の要件を定め解決策を設計する"
    ko: "고객의 요구사항을 정하고 해결책 설계하기"
    vi: "Xác định yêu cầu và thiết kế giải pháp cho khách hàng"
    ms: "Menentukan keperluan dan mereka penyelesaian untuk klien"
    id: "Menentukan kebutuhan dan merancang solusi untuk klien"
    hi: "क्लाइंट के लिए ज़रूरतें तय करना और समाधान डिज़ाइन करना"
  - en: "Present project outcomes to the client"
    zh: "向客户汇报项目成果"
    zh-TW: "向客戶報告專題成果"
    ja: "プロジェクトの成果を顧客に発表する"
    ko: "고객에게 프로젝트 결과 발표하기"
    vi: "Trình bày kết quả dự án cho khách hàng"
    ms: "Membentangkan hasil projek kepada klien"
    id: "Mempresentasikan hasil proyek kepada klien"
    hi: "क्लाइंट के सामने प्रोजेक्ट के नतीजे रखना"
