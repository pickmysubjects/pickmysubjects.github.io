code: MGMT90030
year: 2027
learn:
  en: "How large and small organisations build the capability to bring new products, services and processes to market."
  zh: "大小组织如何建立将新产品、服务和流程推向市场的能力。"
  zh-TW: "大小組織如何建立將新產品、服務與流程推向市場的能力。"
  ja: "大小の組織が新しい製品・サービス・プロセスを市場に出す力をどう築くかを学ぶ。"
  ko: "크고 작은 조직이 새 제품·서비스·프로세스를 시장에 내놓는 역량을 어떻게 키우는지 배운다."
  vi: "Tổ chức lớn nhỏ xây dựng năng lực đưa sản phẩm, dịch vụ, quy trình mới ra thị trường thế nào."
  ms: "Cara organisasi besar dan kecil membina keupayaan membawa produk, perkhidmatan dan proses baharu ke pasaran."
  id: "Cara organisasi besar dan kecil membangun kemampuan membawa produk, layanan dan proses baru ke pasar."
  hi: "बड़े-छोटे संगठन नए उत्पाद, सेवाएँ और प्रक्रियाएँ बाज़ार तक लाने की क्षमता कैसे बनाते हैं।"
outcomes:
  - en: "Audit a firm's innovation capability"
    zh: "评估企业的创新能力"
    zh-TW: "評估企業的創新能力"
    ja: "企業の革新力を評価する"
    ko: "기업의 혁신 역량 진단하기"
    vi: "Đánh giá năng lực đổi mới của doanh nghiệp"
    ms: "Mengaudit keupayaan inovasi firma"
    id: "Mengaudit kemampuan inovasi perusahaan"
    hi: "किसी फर्म की नवाचार क्षमता आँकना"
  - en: "Apply innovation models to case studies"
    zh: "将创新模型用于案例分析"
    zh-TW: "將創新模型應用於個案分析"
    ja: "イノベーション理論をケースに応用する"
    ko: "혁신 모델을 사례에 적용하기"
    vi: "Áp dụng mô hình đổi mới vào tình huống"
    ms: "Menggunakan model inovasi pada kajian kes"
    id: "Menerapkan model inovasi pada studi kasus"
    hi: "नवाचार मॉडल केस स्टडी पर लागू करना"
