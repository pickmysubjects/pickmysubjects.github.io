code: CWRI10001
year: 2026
learn:
  en: "Writing your own poetry and fiction, from first idea to edited draft, with class workshops and lots of contemporary reading."
  zh: "创作自己的诗歌和小说，从最初构思到修改定稿，配合课堂工作坊和大量当代阅读。"
  zh-TW: "創作自己的詩歌和小說，從最初構思到修改定稿，配合課堂工作坊和大量當代閱讀。"
  ja: "最初の着想から推敲まで、自分の詩と小説を書く。授業のワークショップと現代作品の多読も。"
  ko: "첫 아이디어부터 퇴고까지 직접 시와 소설을 쓰며, 수업 워크숍과 현대 작품 읽기를 병행한다."
  vi: "Tự viết thơ và truyện, từ ý tưởng đầu tiên đến bản đã chỉnh sửa, với các buổi workshop và đọc nhiều tác phẩm đương đại."
  ms: "Menulis puisi dan fiksyen sendiri, daripada idea awal hingga draf disunting, dengan bengkel kelas dan banyak bacaan kontemporari."
  id: "Menulis puisi dan fiksi sendiri, dari ide awal sampai draf yang disunting, dengan lokakarya kelas dan banyak bacaan kontemporer."
  hi: "अपनी कविता और कहानियां लिखना, पहले विचार से संपादित ड्राफ़्ट तक, क्लास वर्कशॉप और ढेर सारे समकालीन पठन के साथ।"
outcomes:
  - en: "Write poems and short fiction in varied forms"
    zh: "以多种形式写诗和短篇小说"
    zh-TW: "以多種形式寫詩和短篇小說"
    ja: "様々な形式で詩や短い小説を書く"
    ko: "다양한 형식으로 시와 짧은 소설 쓰기"
    vi: "Viết thơ và truyện ngắn với nhiều hình thức"
    ms: "Tulis puisi dan cerpen dalam pelbagai bentuk"
    id: "Menulis puisi dan cerpen dalam berbagai bentuk"
    hi: "अलग-अलग रूपों में कविताएं और छोटी कहानियां लिखना"
  - en: "Give and use feedback in writing workshops"
    zh: "在写作工作坊中给出并采纳反馈"
    zh-TW: "在寫作工作坊中給出並採納回饋"
    ja: "ワークショップで意見を出し合い活かす"
    ko: "글쓰기 워크숍에서 피드백 주고받아 활용하기"
    vi: "Góp ý và tiếp thu góp ý trong workshop viết"
    ms: "Beri dan guna maklum balas dalam bengkel penulisan"
    id: "Memberi dan memakai masukan dalam lokakarya menulis"
    hi: "लेखन वर्कशॉप में फ़ीडबैक देना और इस्तेमाल करना"
  - en: "Edit drafts into finished pieces"
    zh: "把草稿修改成完整作品"
    zh-TW: "把草稿修改成完整作品"
    ja: "下書きを推敲して作品に仕上げる"
    ko: "초고를 다듬어 완성작 만들기"
    vi: "Chỉnh sửa bản nháp thành tác phẩm hoàn chỉnh"
    ms: "Sunting draf menjadi karya siap"
    id: "Menyunting draf menjadi karya jadi"
    hi: "ड्राफ़्ट को संपादित कर पूरी रचना बनाना"
