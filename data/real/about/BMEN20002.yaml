code: BMEN20002
year: 2026
learn:
  en: "Human anatomy and physiology for bioengineers, linked to medical devices and assistive technology."
  zh: "面向生物工程的人体解剖与生理，联系医疗器械与辅助技术。"
  zh-TW: "面向生醫工程的人體解剖與生理，連結醫療器材與輔助科技。"
  ja: "生体工学のための人体解剖・生理学と医療機器・支援技術。"
  ko: "생명공학을 위한 인체 해부·생리학과 의료기기·보조기술."
  vi: "Giải phẫu và sinh lý người cho kỹ sư y sinh, gắn với thiết bị y tế và công nghệ hỗ trợ."
  ms: "Anatomi dan fisiologi manusia untuk jurutera bio, berkait peranti perubatan dan teknologi bantuan."
  id: "Anatomi dan fisiologi manusia untuk bioengineering, terkait alat medis dan teknologi bantu."
  hi: "बायोइंजीनियरिंग के लिए मानव शरीर रचना और शरीर क्रिया, मेडिकल डिवाइस से जुड़ी।"
outcomes:
  - en: "Use correct anatomical terms"
    zh: "正确使用解剖学术语"
    zh-TW: "正確使用解剖學術語"
    ja: "解剖学用語を正しく使う"
    ko: "해부학 용어 정확히 쓰기"
    vi: "Dùng đúng thuật ngữ giải phẫu"
    ms: "Guna istilah anatomi dengan betul"
    id: "Memakai istilah anatomi dengan benar"
    hi: "सही शारीरिक शब्दावली का प्रयोग करें"
  - en: "Describe how cells, tissues and organs work"
    zh: "描述细胞、组织和器官如何运作"
    zh-TW: "描述細胞、組織與器官如何運作"
    ja: "細胞・組織・器官の働きを説明する"
    ko: "세포·조직·기관의 작동 설명하기"
    vi: "Mô tả hoạt động của tế bào, mô và cơ quan"
    ms: "Huraikan cara sel, tisu dan organ berfungsi"
    id: "Mendeskripsikan kerja sel, jaringan, dan organ"
    hi: "कोशिकाएँ, ऊतक और अंग कैसे काम करते हैं, बताएँ"
  - en: "Model body systems quantitatively"
    zh: "定量描述人体生理系统"
    zh-TW: "定量描述人體生理系統"
    ja: "生理系を定量的に記述する"
    ko: "생리 시스템 정량적으로 기술하기"
    vi: "Mô tả định lượng các hệ cơ quan"
    ms: "Huraikan sistem badan secara kuantitatif"
    id: "Mendeskripsikan sistem tubuh secara kuantitatif"
    hi: "शरीर प्रणालियों का मात्रात्मक वर्णन करें"
