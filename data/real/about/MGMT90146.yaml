code: MGMT90146
year: 2027
learn:
  en: "An integrative subject where teams run a firm in a business strategy simulation and compete for markets."
  zh: "综合性课程：团队在商业战略模拟中经营公司，争夺市场。"
  zh-TW: "綜合性課程：團隊在商業策略模擬中經營公司，爭奪市場。"
  ja: "総合科目：チームで経営戦略シミュレーションの企業を運営し、市場を競う。"
  ko: "통합 과목: 팀이 경영전략 시뮬레이션에서 회사를 운영하며 시장을 놓고 경쟁한다."
  vi: "Môn tích hợp: các nhóm điều hành công ty trong mô phỏng chiến lược kinh doanh, cạnh tranh thị trường."
  ms: "Subjek bersepadu: pasukan mengendalikan firma dalam simulasi strategi perniagaan dan bersaing untuk pasaran."
  id: "Mata kuliah terpadu: tim menjalankan perusahaan dalam simulasi strategi bisnis dan bersaing merebut pasar."
  hi: "एकीकृत विषय: टीमें बिज़नेस स्ट्रैटेजी सिमुलेशन में कंपनी चलाती हैं और बाज़ार के लिए होड़ करती हैं।"
outcomes:
  - en: "Develop and apply a strategy for a firm"
    zh: "为公司制定并执行战略"
    zh-TW: "為公司制定並執行策略"
    ja: "企業の戦略を立てて実行する"
    ko: "회사 전략 수립·실행하기"
    vi: "Xây dựng và áp dụng chiến lược cho công ty"
    ms: "Membangun dan melaksana strategi untuk firma"
    id: "Menyusun dan menerapkan strategi perusahaan"
    hi: "किसी फर्म की रणनीति बनाना और लागू करना"
  - en: "See how functions like marketing and finance interact"
    zh: "理解营销、财务等职能如何相互影响"
    zh-TW: "理解行銷、財務等職能如何相互影響"
    ja: "マーケティングや財務などの機能の相互作用を理解する"
    ko: "마케팅·재무 등 기능 간 상호작용 이해하기"
    vi: "Thấy các chức năng như marketing, tài chính tác động nhau"
    ms: "Melihat interaksi fungsi seperti pemasaran dan kewangan"
    id: "Melihat interaksi fungsi seperti pemasaran dan keuangan"
    hi: "मार्केटिंग और वित्त जैसे कार्य आपस में कैसे जुड़ते हैं, समझना"
