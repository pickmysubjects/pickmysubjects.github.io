code: GERM10004
year: 2026
learn:
  en: "German from scratch: basic grammar, everyday conversation, simple texts, and life in Germany, Austria and Switzerland."
  zh: "零基础德语：基础语法、日常对话、简单文本，以及德奥瑞三国的生活。"
  zh-TW: "零基礎德語：基礎文法、日常對話、簡單文本，以及德奧瑞三國的生活。"
  ja: "ゼロから学ぶドイツ語。基礎文法、日常会話、やさしい文章、ドイツ・オーストリア・スイスの暮らし。"
  ko: "처음 배우는 독일어. 기초 문법, 일상 회화, 쉬운 글, 독일·오스트리아·스위스의 생활."
  vi: "Tiếng Đức từ đầu: ngữ pháp cơ bản, hội thoại hằng ngày, văn bản đơn giản và đời sống ở Đức, Áo, Thụy Sĩ."
  ms: "Bahasa Jerman dari asas: tatabahasa asas, perbualan harian, teks mudah dan kehidupan di Jerman, Austria dan Switzerland."
  id: "Bahasa Jerman dari nol: tata bahasa dasar, percakapan sehari-hari, teks sederhana dan kehidupan di Jerman, Austria dan Swiss."
  hi: "शून्य से जर्मन: बुनियादी व्याकरण, रोज़ की बातचीत, आसान पाठ, और जर्मनी, ऑस्ट्रिया व स्विट्ज़रलैंड का जीवन।"
outcomes:
  - en: "Hold simple everyday conversations in German"
    zh: "用德语进行简单的日常对话"
    zh-TW: "用德語進行簡單的日常對話"
    ja: "ドイツ語で簡単な日常会話をする"
    ko: "독일어로 간단한 일상 대화하기"
    vi: "Trò chuyện đơn giản hằng ngày bằng tiếng Đức"
    ms: "Berbual ringkas harian dalam bahasa Jerman"
    id: "Bercakap sederhana sehari-hari dalam bahasa Jerman"
    hi: "जर्मन में सरल रोज़मर्रा की बातचीत करना"
  - en: "Read and write basic German words and sentences"
    zh: "读写基础德语词句"
    zh-TW: "讀寫基礎德語詞句"
    ja: "ドイツ語の基本的な語や文を読み書きする"
    ko: "기초 독일어 단어와 문장 읽고 쓰기"
    vi: "Đọc và viết từ, câu tiếng Đức cơ bản"
    ms: "Baca dan tulis perkataan serta ayat asas bahasa Jerman"
    id: "Membaca dan menulis kata serta kalimat dasar bahasa Jerman"
    hi: "जर्मन के बुनियादी शब्द और वाक्य पढ़ना-लिखना"
  - en: "Understand everyday customs where German is spoken"
    zh: "了解使用德语地区的日常习俗"
    zh-TW: "了解使用德語地區的日常習俗"
    ja: "ドイツ語が話される地域の日常の習慣を知る"
    ko: "독일어 사용 지역의 일상 관습 이해하기"
    vi: "Hiểu phong tục hằng ngày nơi nói tiếng Đức"
    ms: "Fahami adat harian di tempat bahasa Jerman dituturkan"
    id: "Memahami kebiasaan sehari-hari di tempat bahasa Jerman dipakai"
    hi: "जर्मन बोलने वाली जगहों के रोज़मर्रा के रीति-रिवाज समझना"
