code: HEBR20017
year: 2026
learn:
  en: "Advanced Hebrew through close reading of stories, poems and film, scholarly essay writing and presentations."
  zh: "精读希伯来语小说、诗歌和电影，练习学术论文写作和口头报告。"
  zh-TW: "精讀希伯來語小說、詩歌和電影，練習學術論文寫作和口頭報告。"
  ja: "物語、詩、映画の精読、学術論文の執筆、発表で上級ヘブライ語を磨く。"
  ko: "소설·시·영화 정독, 학술 에세이 쓰기, 발표로 고급 히브리어를 다진다."
  vi: "Tiếng Do Thái nâng cao qua đọc kỹ truyện, thơ, phim, viết luận học thuật và thuyết trình."
  ms: "Bahasa Ibrani lanjutan melalui bacaan teliti cerita, puisi dan filem, penulisan esei ilmiah dan pembentangan."
  id: "Bahasa Ibrani lanjutan lewat membaca cermat cerita, puisi dan film, menulis esai ilmiah dan presentasi."
  hi: "कहानियों, कविताओं और फ़िल्मों के गहन अध्ययन, अकादमिक निबंध और प्रस्तुतियों से उन्नत हिब्रू।"
outcomes:
  - en: "Discuss social and cultural topics in Hebrew"
    zh: "用希伯来语讨论社会和文化话题"
    zh-TW: "用希伯來語討論社會和文化話題"
    ja: "社会や文化の話題をヘブライ語で話し合う"
    ko: "사회·문화 주제를 히브리어로 토론하기"
    vi: "Thảo luận chủ đề xã hội, văn hóa bằng tiếng Do Thái"
    ms: "Bincangkan topik sosial dan budaya dalam bahasa Ibrani"
    id: "Membahas topik sosial dan budaya dalam bahasa Ibrani"
    hi: "सामाजिक और सांस्कृतिक विषयों पर हिब्रू में चर्चा करना"
  - en: "Read and write longer Hebrew texts"
    zh: "读写较长的希伯来语文章"
    zh-TW: "讀寫較長的希伯來語文章"
    ja: "長めのヘブライ語の文章を読み書きする"
    ko: "긴 히브리어 글 읽고 쓰기"
    vi: "Đọc và viết văn bản tiếng Do Thái dài hơn"
    ms: "Baca dan tulis teks bahasa Ibrani yang lebih panjang"
    id: "Membaca dan menulis teks bahasa Ibrani yang lebih panjang"
    hi: "लंबे हिब्रू पाठ पढ़ना-लिखना"
  - en: "Give a clear presentation in Hebrew"
    zh: "用希伯来语做清楚的口头报告"
    zh-TW: "用希伯來語做清楚的口頭報告"
    ja: "ヘブライ語で分かりやすく発表する"
    ko: "히브리어로 명확하게 발표하기"
    vi: "Thuyết trình rõ ràng bằng tiếng Do Thái"
    ms: "Buat pembentangan yang jelas dalam bahasa Ibrani"
    id: "Melakukan presentasi yang jelas dalam bahasa Ibrani"
    hi: "हिब्रू में स्पष्ट प्रस्तुति देना"
