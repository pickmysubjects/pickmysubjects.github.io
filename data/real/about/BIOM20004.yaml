code: BIOM20004
year: 2027
learn:
  en: "How the immune system, metabolism, microbes and environment interact in health and disease, and how we treat it."
  zh: "免疫、代谢、微生物和环境如何在健康与疾病中相互作用，以及如何治疗。"
  zh-TW: "免疫、代謝、微生物和環境如何在健康與疾病中交互作用，以及如何治療。"
  ja: "免疫・代謝・微生物・環境が健康と病気でどう関わり合い、どう治療するか。"
  ko: "면역·대사·미생물·환경이 건강과 질병에서 어떻게 상호작용하고, 어떻게 치료하는지."
  vi: "Miễn dịch, chuyển hóa, vi sinh vật và môi trường tương tác thế nào trong sức khỏe và bệnh tật, và cách điều trị."
  ms: "Bagaimana sistem imun, metabolisme, mikrob dan persekitaran berinteraksi dalam kesihatan dan penyakit, serta rawatannya."
  id: "Bagaimana sistem imun, metabolisme, mikroba, dan lingkungan berinteraksi dalam sehat dan sakit, serta cara mengobatinya."
  hi: "प्रतिरक्षा, मेटाबॉलिज़्म, सूक्ष्मजीव और पर्यावरण सेहत व बीमारी में कैसे परस्पर काम करते हैं, और इलाज कैसे होता है।"
outcomes:
  - en: "Explain how body systems interact in disease"
    zh: "解释身体各系统在疾病中如何相互作用"
    zh-TW: "解釋身體各系統在疾病中如何交互作用"
    ja: "病気で体のシステムがどう関わるかを説明する"
    ko: "질병에서 신체 시스템의 상호작용 설명하기"
    vi: "Giải thích các hệ cơ thể tương tác thế nào khi mắc bệnh"
    ms: "Terangkan interaksi sistem badan dalam penyakit"
    id: "Menjelaskan interaksi sistem tubuh dalam penyakit"
    hi: "बीमारी में शरीर की प्रणालियाँ कैसे परस्पर काम करती हैं, समझाना"
  - en: "Analyse inflammation and how disease progresses"
    zh: "分析炎症及疾病如何发展"
    zh-TW: "分析發炎及疾病如何進展"
    ja: "炎症と病気の進行を分析する"
    ko: "염증과 질병 진행 분석하기"
    vi: "Phân tích viêm và cách bệnh tiến triển"
    ms: "Analisis keradangan dan perkembangan penyakit"
    id: "Menganalisis peradangan dan perkembangan penyakit"
    hi: "सूजन और बीमारी के बढ़ने का विश्लेषण"
  - en: "Evaluate antimicrobial and other therapies"
    zh: "评估抗菌等治疗策略"
    zh-TW: "評估抗菌等治療策略"
    ja: "抗菌薬などの治療法を評価する"
    ko: "항균제 등 치료 전략 평가하기"
    vi: "Đánh giá liệu pháp kháng khuẩn và các liệu pháp khác"
    ms: "Nilai rawatan antimikrob dan lain-lain"
    id: "Menilai terapi antimikroba dan lainnya"
    hi: "एंटीमाइक्रोबियल और अन्य उपचारों का मूल्यांकन"
