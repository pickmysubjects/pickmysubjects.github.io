code: GEOM30012
year: 2026
learn:
  en: "A capstone project using sensing, imaging and spatial data to solve a real infrastructure problem."
  zh: "综合项目：用传感、影像和空间数据解决真实基建问题。"
  zh-TW: "總結專題：用感測、影像和空間資料解決真實基建問題。"
  ja: "センシング・画像・空間データで実際のインフラ課題を解くキャップストーン。"
  ko: "센싱, 영상, 공간 데이터로 실제 인프라 문제를 푸는 캡스톤 프로젝트."
  vi: "Dự án tốt nghiệp dùng cảm biến, ảnh và dữ liệu không gian giải bài toán hạ tầng thật."
  ms: "Projek akhir guna penderiaan, imej dan data ruang untuk masalah infrastruktur sebenar."
  id: "Proyek capstone memakai sensor, citra, dan data spasial untuk masalah infrastruktur nyata."
  hi: "सेंसिंग, इमेजिंग और स्पेशियल डेटा से असली इंफ्रास्ट्रक्चर समस्या हल करने वाला कैपस्टोन प्रोजेक्ट।"
outcomes:
  - en: "Plan a digital project for infrastructure"
    zh: "策划基础设施数字化项目"
    zh-TW: "規劃基礎設施數位化專案"
    ja: "インフラ向けデジタル事業を企画する"
    ko: "인프라 디지털 프로젝트 기획하기"
    vi: "Lập dự án số cho hạ tầng"
    ms: "Merancang projek digital untuk infrastruktur"
    id: "Merancang proyek digital untuk infrastruktur"
    hi: "इंफ्रास्ट्रक्चर के लिए डिजिटल प्रोजेक्ट बनाना"
  - en: "Present results in reports and talks"
    zh: "通过报告和演讲展示成果"
    zh-TW: "透過報告和簡報呈現成果"
    ja: "レポートと発表で成果を伝える"
    ko: "보고서와 발표로 결과 전달하기"
    vi: "Trình bày kết quả qua báo cáo và thuyết trình"
    ms: "Membentang hasil melalui laporan dan pembentangan"
    id: "Menyampaikan hasil lewat laporan dan presentasi"
    hi: "रिपोर्ट और प्रेज़ेंटेशन में नतीजे पेश करना"
