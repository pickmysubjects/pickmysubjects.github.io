code: ABPL90045
year: 2027
learn:
  en: "Valuing property for rates and taxes, land tax, and compensation for compulsory acquisition, including a mock court."
  zh: "为税费和土地税估价，以及强制征收补偿，包括模拟法庭。"
  zh-TW: "為稅費與土地稅估價，以及強制徵收補償，包括模擬法庭。"
  ja: "課税のための評価、土地税、収用補償。模擬法廷あり。"
  ko: "과세용 평가, 토지세, 강제 수용 보상. 모의 법정 포함."
  vi: "Định giá cho mục đích thuế, thuế đất, bồi thường thu hồi đất, có phiên tòa giả định."
  ms: "Penilaian untuk cukai, cukai tanah dan pampasan pengambilan tanah, termasuk mahkamah olok-olok."
  id: "Penilaian untuk pajak, pajak tanah dan ganti rugi pembebasan lahan, termasuk peradilan semu."
  hi: "कर व भूमि कर के लिए मूल्यांकन, अनिवार्य अधिग्रहण का मुआवज़ा, मॉक कोर्ट सहित।"
outcomes:
  - en: "Prepare a compensation valuation report"
    zh: "编写补偿估价报告"
    zh-TW: "撰寫補償估價報告"
    ja: "補償評価報告書を作る"
    ko: "보상 평가 보고서 작성하기"
    vi: "Lập báo cáo định giá bồi thường"
    ms: "Menyediakan laporan penilaian pampasan"
    id: "Menyusun laporan penilaian ganti rugi"
    hi: "मुआवज़ा मूल्यांकन रिपोर्ट तैयार करना"
  - en: "Explain taxes that affect property"
    zh: "解释影响房地产的税种"
    zh-TW: "解釋影響不動產的稅種"
    ja: "不動産に関わる税を説明する"
    ko: "부동산 관련 세금 설명하기"
    vi: "Giải thích các loại thuế ảnh hưởng bất động sản"
    ms: "Menerangkan cukai yang menjejaskan hartanah"
    id: "Menjelaskan pajak yang memengaruhi properti"
    hi: "संपत्ति पर लगने वाले करों को समझाना"
