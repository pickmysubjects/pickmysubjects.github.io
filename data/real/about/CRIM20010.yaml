code: CRIM20010
year: 2026
learn:
  en: "When law helps bring about social change and when it holds it back, using real law reform campaigns."
  zh: "法律何时推动社会变革、何时阻碍变革，结合真实的法律改革行动来看。"
  zh-TW: "法律何時推動社會變革、何時阻礙變革，結合真實的法律改革行動來看。"
  ja: "法律が社会の変化を後押しする時と妨げる時を、実際の法改正運動を通して考える。"
  ko: "법이 사회 변화를 이끌 때와 가로막을 때를 실제 법 개혁 운동을 통해 살펴본다."
  vi: "Khi nào luật thúc đẩy thay đổi xã hội và khi nào kìm hãm nó, qua các chiến dịch cải cách luật thực tế."
  ms: "Bila undang-undang membantu perubahan sosial dan bila ia menghalangnya, melalui kempen pembaharuan undang-undang sebenar."
  id: "Kapan hukum mendorong perubahan sosial dan kapan menghambatnya, lewat kampanye reformasi hukum nyata."
  hi: "कानून कब सामाजिक बदलाव लाने में मदद करता है और कब उसे रोकता है, असली कानून सुधार अभियानों के ज़रिए।"
outcomes:
  - en: "Explain how law can both drive and resist social change"
    zh: "说明法律如何既推动又抵制社会变革"
    zh-TW: "說明法律如何既推動又抵制社會變革"
    ja: "法が社会変化を促しも妨げもする仕組みを説明する"
    ko: "법이 사회 변화를 이끌기도 막기도 하는 방식 설명하기"
    vi: "Giải thích cách luật vừa thúc đẩy vừa cản trở thay đổi xã hội"
    ms: "Terangkan bagaimana undang-undang memacu dan menghalang perubahan sosial"
    id: "Menjelaskan cara hukum mendorong sekaligus menahan perubahan sosial"
    hi: "समझाना कि कानून सामाजिक बदलाव को कैसे बढ़ाता और रोकता भी है"
  - en: "Analyse case studies on access to justice and equality"
    zh: "分析有关司法可及性与平等的案例"
    zh-TW: "分析有關司法近用與平等的案例"
    ja: "司法へのアクセスと平等に関する事例を分析する"
    ko: "사법 접근성과 평등에 관한 사례 분석하기"
    vi: "Phân tích các tình huống về tiếp cận công lý và bình đẳng"
    ms: "Analisis kajian kes tentang akses keadilan dan kesaksamaan"
    id: "Menganalisis studi kasus soal akses keadilan dan kesetaraan"
    hi: "न्याय तक पहुँच और समानता से जुड़े केस स्टडी का विश्लेषण करना"
  - en: "Link theory to a real law reform issue"
    zh: "把理论联系到一个真实的法律改革议题"
    zh-TW: "把理論連結到一個真實的法律改革議題"
    ja: "理論を実際の法改正の課題に結びつける"
    ko: "이론을 실제 법 개혁 사안과 연결하기"
    vi: "Liên hệ lý thuyết với một vấn đề cải cách luật thực tế"
    ms: "Kaitkan teori dengan isu pembaharuan undang-undang sebenar"
    id: "Mengaitkan teori dengan isu reformasi hukum nyata"
    hi: "सिद्धांत को किसी असली कानून सुधार मुद्दे से जोड़ना"
