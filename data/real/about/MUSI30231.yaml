code: MUSI30231
year: 2026
learn:
  en: "Hands-on lab sessions mixing music with other art forms, keeping a logbook and making a large group cross-media work."
  zh: "实践实验课，把音乐与其他艺术结合，写实验日志并完成大型跨媒体集体作品。"
  zh-TW: "實作實驗課，把音樂與其他藝術結合，寫實驗日誌並完成大型跨媒體集體作品。"
  ja: "音楽と他の芸術を組み合わせる実習。記録帳をつけ、大人数の領域横断作品を作る。"
  ko: "음악과 다른 예술을 섞는 실습 랩. 기록장을 쓰고 대규모 크로스미디어 공동 작품 제작."
  vi: "Buổi thực hành kết hợp âm nhạc với nghệ thuật khác, ghi nhật ký và làm tác phẩm nhóm lớn."
  ms: "Sesi makmal amali gabung muzik dengan seni lain, simpan log dan hasilkan karya kumpulan besar."
  id: "Sesi lab praktik memadukan musik dan seni lain, mengisi logbook dan membuat karya grup besar."
  hi: "संगीत को अन्य कलाओं से जोड़ने वाले लैब सत्र, लॉगबुक और बड़ा समूह क्रॉस-मीडिया कार्य।"
outcomes:
  - en: "Experiment and record what you try"
    zh: "实验并记录尝试过程"
    zh-TW: "實驗並記錄嘗試過程"
    ja: "試したことを記録しながら実験する"
    ko: "실험하고 시도한 것 기록하기"
    vi: "Thử nghiệm và ghi lại quá trình"
    ms: "Bereksperimen dan catat percubaan"
    id: "Bereksperimen dan mencatat percobaan"
    hi: "प्रयोग करना और उन्हें दर्ज करना"
  - en: "Combine music with other art forms"
    zh: "将音乐与其他艺术结合"
    zh-TW: "將音樂與其他藝術結合"
    ja: "音楽を他の芸術と組み合わせる"
    ko: "음악과 다른 예술 결합하기"
    vi: "Kết hợp âm nhạc với nghệ thuật khác"
    ms: "Gabungkan muzik dengan seni lain"
    id: "Memadukan musik dengan seni lain"
    hi: "संगीत को अन्य कलाओं से जोड़ना"
  - en: "Lead a cross-media group piece"
    zh: "领导跨媒体集体作品"
    zh-TW: "領導跨媒體集體作品"
    ja: "領域横断のグループ作品を率いる"
    ko: "크로스미디어 공동 작품 이끌기"
    vi: "Dẫn dắt tác phẩm nhóm đa phương tiện"
    ms: "Memimpin karya kumpulan rentas media"
    id: "Memimpin karya grup lintas media"
    hi: "क्रॉस-मीडिया समूह कार्य का नेतृत्व"
