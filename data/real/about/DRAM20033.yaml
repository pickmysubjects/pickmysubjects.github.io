code: DRAM20033
year: 2026
learn:
  en: "Voice, movement, devising and text classes that widen your range as a theatre-maker, with journaling."
  zh: "声音、形体、编创与文本课，拓宽戏剧创作者的能力，并写反思日志。"
  zh-TW: "聲音、形體、編創與文本課，拓寬戲劇創作者的能力，並寫反思日誌。"
  ja: "声・身体・創作・テキストの授業で表現の幅を広げ、日誌もつける。"
  ko: "목소리·움직임·창작·텍스트 수업으로 역량을 넓히고 일지를 쓴다."
  vi: "Lớp giọng, hình thể, dựng vở và văn bản giúp mở rộng khả năng, kèm nhật ký."
  ms: "Kelas suara, gerak, cipta dan teks untuk meluaskan kebolehan, dengan jurnal."
  id: "Kelas suara, gerak, kreasi dan teks untuk memperluas kemampuan, plus jurnal."
  hi: "आवाज़, गति, रचना और टेक्स्ट की कक्षाएँ, साथ में रिफ़्लेक्टिव जर्नल।"
outcomes:
  - en: "Perform a short solo and a group task"
    zh: "完成个人与小组短演出"
    zh-TW: "完成個人與小組短演出"
    ja: "ソロとグループの短い課題を演じる"
    ko: "솔로와 그룹 과제 공연하기"
    vi: "Diễn một bài đơn và một bài nhóm"
    ms: "Persembah tugasan solo dan kumpulan"
    id: "Membawakan tugas solo dan kelompok"
    hi: "सोलो और समूह प्रस्तुति करना"
  - en: "Try basic directing and dramaturgy"
    zh: "尝试基础导演与戏剧构作"
    zh-TW: "嘗試基礎導演與戲劇構作"
    ja: "演出とドラマトゥルギーの基礎を試す"
    ko: "기초 연출과 드라마투르기 시도하기"
    vi: "Thử đạo diễn và biên kịch cơ bản"
    ms: "Cuba asas pengarahan dan dramaturgi"
    id: "Mencoba dasar penyutradaraan dan dramaturgi"
    hi: "बुनियादी निर्देशन और ड्रामाटर्जी आज़माना"
  - en: "Keep short reflective writing going"
    zh: "坚持写简短的反思"
    zh-TW: "持續寫簡短的反思"
    ja: "短い振り返りを書き続ける"
    ko: "짧은 성찰 글 꾸준히 쓰기"
    vi: "Viết suy ngẫm ngắn đều đặn"
    ms: "Tulis refleksi pendek secara berterusan"
    id: "Rutin menulis refleksi singkat"
    hi: "नियमित छोटे चिंतन लेखन करना"
