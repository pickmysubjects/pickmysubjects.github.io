code: FLTV10008
year: 2026
learn:
  en: "Make a 3-minute short film from idea to finished cut, and take key crew roles on other students' productions."
  zh: "从构思到成片完成一部 3 分钟短片，并在其他同学作品中担任主要剧组职位。"
  zh-TW: "從構思到成片完成一部 3 分鐘短片，並在其他同學作品中擔任主要劇組職位。"
  ja: "構想から完成まで3分の短編を作り、他の学生の作品で主要スタッフを務める。"
  ko: "구상부터 완성까지 3분 단편을 만들고 다른 학생 작품에서 주요 스태프를 맡는다."
  vi: "Làm phim ngắn 3 phút từ ý tưởng đến bản dựng cuối, giữ vị trí chính trong ê-kíp của bạn khác."
  ms: "Hasilkan filem pendek 3 minit dari idea hingga siap, dan pegang peranan kru utama untuk pelajar lain."
  id: "Membuat film pendek 3 menit dari ide sampai jadi, dan memegang peran kru utama di produksi teman."
  hi: "आइडिया से फ़ाइनल कट तक 3 मिनट की शॉर्ट फ़िल्म बनाना और दूसरों की प्रोडक्शन में मुख्य क्रू भूमिका।"
outcomes:
  - en: "Plan and shoot a short film in one day"
    zh: "规划并在一天内拍完短片"
    zh-TW: "規劃並在一天內拍完短片"
    ja: "短編を計画し1日で撮影する"
    ko: "단편을 계획하고 하루 만에 촬영하기"
    vi: "Lên kế hoạch và quay phim ngắn trong một ngày"
    ms: "Rancang dan rakam filem pendek dalam sehari"
    id: "Merencanakan dan merekam film pendek sehari"
    hi: "शॉर्ट फ़िल्म की योजना बनाकर एक दिन में शूट करना"
  - en: "Lead a crew department on set"
    zh: "在片场负责一个剧组部门"
    zh-TW: "在片場負責一個劇組部門"
    ja: "現場でスタッフ部門を率いる"
    ko: "촬영장에서 한 부서 이끌기"
    vi: "Phụ trách một bộ phận ê-kíp tại phim trường"
    ms: "Ketuai satu jabatan kru di set"
    id: "Memimpin satu departemen kru di lokasi"
    hi: "सेट पर किसी क्रू विभाग का नेतृत्व"
  - en: "Reflect on the production in a written report"
    zh: "以书面报告反思制作过程"
    zh-TW: "以書面報告反思製作過程"
    ja: "制作を振り返るレポートを書く"
    ko: "제작 과정을 보고서로 성찰하기"
    vi: "Viết báo cáo nhìn lại quá trình sản xuất"
    ms: "Renung produksi dalam laporan bertulis"
    id: "Merefleksikan produksi dalam laporan"
    hi: "लिखित रिपोर्ट में प्रोडक्शन पर विचार"
