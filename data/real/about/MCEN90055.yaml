code: MCEN90055
year: 2027
learn:
  en: "Conventional and advanced manufacturing processes, from machining and casting to additive manufacturing, with hands-on labs."
  zh: "传统与先进制造工艺，从切削、铸造到增材制造，并有动手实验。"
  zh-TW: "傳統與先進製造製程，從切削、鑄造到積層製造，並有動手實驗。"
  ja: "切削・鋳造から積層造形まで、従来と先端の製造プロセスを実習とともに。"
  ko: "절삭·주조부터 적층 제조까지 기존·첨단 제조 공정과 실습."
  vi: "Quy trình chế tạo truyền thống và tiên tiến, từ gia công cắt, đúc đến in 3D, có thực hành."
  ms: "Proses pembuatan konvensional dan termaju, daripada pemesinan dan tuangan hingga pembuatan bahan tambah, dengan makmal."
  id: "Proses manufaktur konvensional dan maju, dari pemesinan dan pengecoran hingga manufaktur aditif, dengan praktikum."
  hi: "पारंपरिक और उन्नत निर्माण प्रक्रियाएँ, मशीनिंग व कास्टिंग से एडिटिव मैन्युफ़ैक्चरिंग तक, प्रयोगशाला सहित।"
outcomes:
  - en: "Explain how manufacturing processes work"
    zh: "解释各类制造工艺的原理"
    zh-TW: "解釋各類製造製程的原理"
    ja: "製造プロセスの原理を説明する"
    ko: "제조 공정 원리 설명하기"
    vi: "Giải thích nguyên lý các quy trình chế tạo"
    ms: "Menerangkan cara proses pembuatan berfungsi"
    id: "Menjelaskan cara kerja proses manufaktur"
    hi: "निर्माण प्रक्रियाओं का सिद्धांत समझाना"
  - en: "Use metrology to check product quality"
    zh: "用计量检测保证产品质量"
    zh-TW: "用量測檢驗確保產品品質"
    ja: "計測で製品品質を確かめる"
    ko: "계측으로 제품 품질 확인하기"
    vi: "Dùng đo lường để kiểm tra chất lượng sản phẩm"
    ms: "Menggunakan metrologi untuk menyemak kualiti produk"
    id: "Memakai metrologi untuk memeriksa mutu produk"
    hi: "मेट्रोलॉजी से उत्पाद गुणवत्ता जाँचना"
  - en: "Pick a process pathway for a given product"
    zh: "为特定产品确定工艺路线"
    zh-TW: "為特定產品決定製程路線"
    ja: "製品に合った工程ルートを決める"
    ko: "특정 제품의 공정 경로 정하기"
    vi: "Chọn quy trình phù hợp cho một sản phẩm"
    ms: "Memilih laluan proses untuk sesuatu produk"
    id: "Menentukan alur proses untuk suatu produk"
    hi: "किसी उत्पाद के लिए प्रक्रिया मार्ग चुनना"
