code: MUSI10239
year: 2026
learn:
  en: "Rehearse and perform landmark and new works with the full percussion section, presented in concerts each semester."
  zh: "与打击乐团一起排练和演出经典及新作品，每学期举办音乐会。"
  zh-TW: "與打擊樂團一起排練和演出經典及新作品，每學期舉辦音樂會。"
  ja: "打楽器アンサンブルで名曲や新作をリハーサルし、毎学期コンサートで演奏。"
  ko: "타악기 앙상블로 명작과 신작을 연습하고 매 학기 공연에서 연주."
  vi: "Tập và biểu diễn tác phẩm kinh điển lẫn mới cùng dàn bộ gõ, có hòa nhạc mỗi kỳ."
  ms: "Berlatih dan mempersembahkan karya agung dan baharu dengan ensembel perkusi setiap semester."
  id: "Berlatih dan tampil membawakan karya penting dan baru bersama ansambel perkusi tiap semester."
  hi: "पर्कशन समूह के साथ प्रसिद्ध और नई रचनाओं का अभ्यास व हर सेमेस्टर कॉन्सर्ट।"
outcomes:
  - en: "Play confidently in a percussion ensemble"
    zh: "在打击乐团中自信演奏"
    zh-TW: "在打擊樂團中自信演奏"
    ja: "打楽器アンサンブルで自信を持って演奏する"
    ko: "타악기 앙상블에서 자신 있게 연주하기"
    vi: "Chơi tự tin trong dàn bộ gõ"
    ms: "Bermain yakin dalam ensembel perkusi"
    id: "Bermain percaya diri di ansambel perkusi"
    hi: "पर्कशन समूह में आत्मविश्वास से बजाना"
  - en: "Prepare repertoire to concert standard"
    zh: "把曲目准备到音乐会水准"
    zh-TW: "把曲目準備到音樂會水準"
    ja: "曲をコンサート水準まで仕上げる"
    ko: "곡을 공연 수준으로 준비하기"
    vi: "Chuẩn bị tác phẩm đạt chuẩn hòa nhạc"
    ms: "Sediakan repertoir ke tahap konsert"
    id: "Menyiapkan repertoar setara konser"
    hi: "रचनाओं को कॉन्सर्ट स्तर तक तैयार करना"
  - en: "Plan rehearsals as part of a team"
    zh: "作为团队一员规划排练"
    zh-TW: "作為團隊一員規劃排練"
    ja: "チームの一員として練習を計画する"
    ko: "팀의 일원으로 리허설 계획하기"
    vi: "Lên kế hoạch tập luyện theo nhóm"
    ms: "Rancang latihan sebagai satu pasukan"
    id: "Merencanakan latihan sebagai tim"
    hi: "टीम के रूप में रिहर्सल की योजना"
