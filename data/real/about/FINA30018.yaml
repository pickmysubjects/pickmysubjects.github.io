code: FINA30018
year: 2026
learn:
  en: "A second round of staff-led seminars on art theory, criticism and history, each on a different research theme."
  zh: "第二轮教师研讨课，探讨艺术理论、批评与艺术史的另一研究主题。"
  zh-TW: "第二輪教師研討課，探討藝術理論、批評與藝術史的另一研究主題。"
  ja: "教員セミナーの第2弾で、美術理論・批評・歴史の別テーマを扱う。"
  ko: "교수진 세미나 2탄으로 미술 이론·비평·역사의 다른 연구 주제를 다룬다."
  vi: "Đợt seminar thứ hai về lý thuyết, phê bình, lịch sử nghệ thuật, mỗi lớp một chủ đề."
  ms: "Pusingan kedua seminar staf tentang teori, kritikan dan sejarah seni, tema berbeza."
  id: "Seminar dosen putaran kedua soal teori, kritik dan sejarah seni, tema berbeda."
  hi: "स्टाफ़ सेमिनार का दूसरा दौर: कला-सिद्धांत, आलोचना और इतिहास का अलग शोध विषय।"
outcomes:
  - en: "Explore one research theme in depth"
    zh: "深入探讨一个研究主题"
    zh-TW: "深入探討一個研究主題"
    ja: "一つの研究テーマを掘り下げる"
    ko: "한 연구 주제 깊이 파고들기"
    vi: "Đào sâu một chủ đề nghiên cứu"
    ms: "Dalami satu tema kajian"
    id: "Mendalami satu tema riset"
    hi: "एक शोध विषय की गहराई से पड़ताल"
  - en: "Write an essay that builds on your talk"
    zh: "写一篇延伸课堂展示的论文"
    zh-TW: "寫一篇延伸課堂報告的論文"
    ja: "発表を発展させたエッセイを書く"
    ko: "발표를 확장한 에세이 쓰기"
    vi: "Viết bài luận phát triển từ bài thuyết trình"
    ms: "Tulis esei yang lanjutkan pembentangan"
    id: "Menulis esai lanjutan dari presentasi"
    hi: "अपनी प्रस्तुति को आगे बढ़ाता निबंध लिखना"
  - en: "Discuss ideas well in an oral assessment"
    zh: "在口头考核中清楚讨论想法"
    zh-TW: "在口頭評量中清楚討論想法"
    ja: "口頭評価で考えを的確に話す"
    ko: "구술 평가에서 생각 잘 펼치기"
    vi: "Trao đổi ý tưởng tốt khi vấn đáp"
    ms: "Bincang idea dengan baik secara lisan"
    id: "Membahas gagasan dengan baik secara lisan"
    hi: "मौखिक मूल्यांकन में विचारों पर अच्छी चर्चा"
