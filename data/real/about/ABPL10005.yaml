code: ABPL10005
year: 2026
learn:
  en: "How buildings get made and managed: the construction industry, its roles, materials, rules, contracts and safety."
  zh: "建筑如何建成与管理：建筑业、各方角色、材料、法规、合同与安全。"
  zh-TW: "建築如何蓋成與管理：營建業、各方角色、材料、法規、合約與安全。"
  ja: "建物がどう建てられ管理されるか：建設業界、役割、材料、規制、契約、安全。"
  ko: "건물이 어떻게 지어지고 관리되는지: 건설 산업, 역할, 자재, 규정, 계약, 안전."
  vi: "Công trình được xây và quản lý thế nào: ngành xây dựng, vai trò, vật liệu, quy định, hợp đồng, an toàn."
  ms: "Cara bangunan dibina dan diurus: industri pembinaan, peranan, bahan, peraturan, kontrak dan keselamatan."
  id: "Cara bangunan dibangun dan dikelola: industri konstruksi, peran, material, aturan, kontrak, keselamatan."
  hi: "इमारतें कैसे बनती और मैनेज होती हैं: निर्माण उद्योग, भूमिकाएँ, सामग्री, नियम, अनुबंध और सुरक्षा।"
outcomes:
  - en: "Describe how the construction industry works"
    zh: "描述建筑业如何运作"
    zh-TW: "描述營建業如何運作"
    ja: "建設業界の仕組みを説明する"
    ko: "건설 산업의 작동 방식 설명하기"
    vi: "Mô tả cách ngành xây dựng vận hành"
    ms: "Huraikan cara industri pembinaan berfungsi"
    id: "Menjelaskan cara kerja industri konstruksi"
    hi: "निर्माण उद्योग कैसे काम करता है, बताना"
  - en: "Explain who does what in a building project"
    zh: "说明建筑项目中各方的分工"
    zh-TW: "說明建築專案中各方的分工"
    ja: "建築プロジェクトの役割分担を説明する"
    ko: "건축 프로젝트의 역할 분담 설명하기"
    vi: "Giải thích ai làm gì trong một dự án xây dựng"
    ms: "Jelaskan peranan setiap pihak dalam projek bangunan"
    id: "Menjelaskan siapa mengerjakan apa dalam proyek"
    hi: "बिल्डिंग प्रोजेक्ट में कौन क्या करता है, समझाना"
  - en: "Recognise common materials, contracts and safety rules"
    zh: "认识常见材料、合同与安全规定"
    zh-TW: "認識常見材料、合約與安全規定"
    ja: "主な材料・契約・安全規則を理解する"
    ko: "주요 자재·계약·안전 규정 알기"
    vi: "Nhận biết vật liệu, hợp đồng và quy tắc an toàn phổ biến"
    ms: "Kenal bahan, kontrak dan peraturan keselamatan biasa"
    id: "Mengenali material, kontrak, dan aturan keselamatan umum"
    hi: "आम सामग्री, अनुबंध और सुरक्षा नियम पहचानना"
