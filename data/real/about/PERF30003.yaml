code: PERF30003
year: 2027
learn:
  en: "Lighting design for buildings, inside and out: how light supports people and space, from concept to documentation."
  zh: "建筑室内外的照明设计：光如何服务于人和空间，从概念到设计文档。"
  zh-TW: "建築室內外的照明設計：光如何服務於人和空間，從概念到設計文件。"
  ja: "建物の内外の照明デザイン：光が人と空間をどう支えるか、コンセプトから図書作成まで。"
  ko: "건물 실내외 조명 디자인: 빛이 사람과 공간을 돕는 방식, 콘셉트부터 문서화까지."
  vi: "Thiết kế chiếu sáng cho công trình trong và ngoài nhà: ánh sáng hỗ trợ con người và không gian, từ ý tưởng đến hồ sơ."
  ms: "Reka bentuk pencahayaan bangunan, dalam dan luar: cara cahaya menyokong manusia dan ruang, dari konsep hingga dokumentasi."
  id: "Desain pencahayaan bangunan, interior dan eksterior: bagaimana cahaya mendukung orang dan ruang, dari konsep hingga dokumentasi."
  hi: "इमारतों के अंदर-बाहर की लाइटिंग डिज़ाइन: रोशनी लोगों व स्थान की कैसे मदद करती है, कॉन्सेप्ट से दस्तावेज़ तक।"
outcomes:
  - en: "Apply core principles of architectural lighting"
    zh: "运用建筑照明的核心原则"
    zh-TW: "運用建築照明的核心原則"
    ja: "建築照明の基本原則を使う"
    ko: "건축 조명의 핵심 원칙 적용하기"
    vi: "Áp dụng nguyên tắc cốt lõi của chiếu sáng kiến trúc"
    ms: "Gunakan prinsip teras pencahayaan seni bina"
    id: "Menerapkan prinsip inti pencahayaan arsitektur"
    hi: "वास्तु लाइटिंग के मूल सिद्धांत लागू करना"
  - en: "Create and document lighting design proposals"
    zh: "提出并记录照明设计方案"
    zh-TW: "提出並記錄照明設計方案"
    ja: "照明デザイン案を作り、図書にまとめる"
    ko: "조명 디자인 제안서 만들고 문서화하기"
    vi: "Lên và lập hồ sơ phương án thiết kế chiếu sáng"
    ms: "Hasilkan dan dokumentasikan cadangan reka bentuk pencahayaan"
    id: "Membuat dan mendokumentasikan usulan desain pencahayaan"
    hi: "लाइटिंग डिज़ाइन प्रस्ताव बनाना और दर्ज करना"
  - en: "Factor sustainability into lighting design"
    zh: "在照明设计中考虑可持续性"
    zh-TW: "在照明設計中考量永續性"
    ja: "照明デザインで持続可能性を考える"
    ko: "조명 디자인에 지속 가능성 반영하기"
    vi: "Đưa yếu tố bền vững vào thiết kế chiếu sáng"
    ms: "Ambil kira kelestarian dalam reka bentuk pencahayaan"
    id: "Memperhitungkan keberlanjutan dalam desain pencahayaan"
    hi: "लाइटिंग डिज़ाइन में स्थिरता का ध्यान रखना"
