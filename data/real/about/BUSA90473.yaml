code: BUSA90473
year: 2027
learn:
  en: "A team project solving a real business planning problem in an Australian setting, written up as a report."
  zh: "小组完成澳大利亚真实商业规划课题并撰写报告。"
  zh-TW: "小組完成澳洲真實商業規劃課題並撰寫報告。"
  ja: "オーストラリアの実際の事業計画課題にチームで取り組み、報告書にまとめる。"
  ko: "호주의 실제 사업 계획 과제를 팀으로 해결하고 보고서로 정리."
  vi: "Dự án nhóm giải một bài toán kế hoạch kinh doanh thật ở Úc, viết thành báo cáo."
  ms: "Projek berkumpulan menyelesaikan masalah perancangan perniagaan sebenar di Australia, ditulis sebagai laporan."
  id: "Proyek tim memecahkan masalah perencanaan bisnis nyata di Australia, ditulis sebagai laporan."
  hi: "ऑस्ट्रेलिया की असली बिज़नेस प्लानिंग समस्या पर टीम प्रोजेक्ट और रिपोर्ट।"
outcomes:
  - en: "Research a business problem with messy, incomplete information"
    zh: "在信息不完整时调研商业问题"
    zh-TW: "在資訊不完整時研究商業問題"
    ja: "不完全な情報からビジネス課題を調べる"
    ko: "불완전한 정보로 비즈니스 문제 조사하기"
    vi: "Nghiên cứu vấn đề kinh doanh với thông tin chưa đầy đủ"
    ms: "Kaji masalah perniagaan dengan maklumat tidak lengkap"
    id: "Meneliti masalah bisnis dengan informasi tidak lengkap"
    hi: "अधूरी जानकारी के साथ बिज़नेस समस्या पर रिसर्च करना"
  - en: "Propose practical recommendations in a business report"
    zh: "在商业报告中提出可行建议"
    zh-TW: "在商業報告中提出可行建議"
    ja: "ビジネス報告書で実践的な提案をする"
    ko: "비즈니스 보고서로 실용적 제안하기"
    vi: "Đưa ra đề xuất thực tế trong báo cáo kinh doanh"
    ms: "Kemukakan cadangan praktikal dalam laporan perniagaan"
    id: "Mengajukan rekomendasi praktis dalam laporan bisnis"
    hi: "बिज़नेस रिपोर्ट में व्यावहारिक सुझाव देना"
