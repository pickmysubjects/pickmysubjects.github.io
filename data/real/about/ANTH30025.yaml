code: ANTH30025
year: 2026
learn:
  en: "Taught in Chile's Atacama Desert: mining, water conflicts and Indigenous land, with field trips and comparisons to Australia."
  zh: "在智利阿塔卡马沙漠授课：采矿、水资源冲突与原住民土地，含实地考察并与澳洲比较。"
  zh-TW: "在智利阿塔卡馬沙漠授課：採礦、水資源衝突與原住民土地，含實地考察並與澳洲比較。"
  ja: "チリのアタカマ砂漠で現地授業。鉱山開発、水をめぐる対立、先住民の土地を学び、見学やオーストラリアとの比較も。"
  ko: "칠레 아타카마 사막 현지 수업. 광산 개발, 물 분쟁, 원주민 땅을 다루며 현장 답사와 호주와의 비교도 한다."
  vi: "Học tại sa mạc Atacama, Chile: khai mỏ, xung đột nguồn nước và đất bản địa, có chuyến thực địa và so sánh với Úc."
  ms: "Diajar di Gurun Atacama, Chile: perlombongan, konflik air dan tanah Orang Asli, dengan lawatan lapangan dan perbandingan dengan Australia."
  id: "Diajarkan di Gurun Atacama, Chile: pertambangan, konflik air dan tanah Pribumi, dengan kunjungan lapangan dan perbandingan dengan Australia."
  hi: "चिली के अटाकामा रेगिस्तान में पढ़ाई: खनन, पानी के विवाद और आदिवासी ज़मीन, फ़ील्ड ट्रिप और ऑस्ट्रेलिया से तुलना के साथ।"
outcomes:
  - en: "Explain conflicts over mining and water"
    zh: "说明围绕采矿和水资源的冲突"
    zh-TW: "說明圍繞採礦和水資源的衝突"
    ja: "鉱山と水をめぐる対立を説明する"
    ko: "광산과 물을 둘러싼 갈등 설명하기"
    vi: "Giải thích xung đột quanh khai mỏ và nguồn nước"
    ms: "Terangkan konflik berkaitan perlombongan dan air"
    id: "Menjelaskan konflik seputar tambang dan air"
    hi: "खनन और पानी पर विवादों को समझाना"
  - en: "Consider Indigenous views of land and wellbeing"
    zh: "思考原住民对土地和福祉的看法"
    zh-TW: "思考原住民對土地和福祉的看法"
    ja: "土地と幸福に関する先住民の考え方を学ぶ"
    ko: "땅과 안녕에 대한 원주민의 관점 생각하기"
    vi: "Xem xét quan niệm bản địa về đất đai và an sinh"
    ms: "Fikirkan pandangan Orang Asli tentang tanah dan kesejahteraan"
    id: "Memahami pandangan Pribumi tentang tanah dan kesejahteraan"
    hi: "ज़मीन और कल्याण पर आदिवासी दृष्टिकोण समझना"
  - en: "Compare Chilean and Australian mining struggles"
    zh: "比较智利和澳洲的采矿抗争"
    zh-TW: "比較智利和澳洲的採礦抗爭"
    ja: "チリとオーストラリアの鉱山をめぐる闘争を比べる"
    ko: "칠레와 호주의 광산 투쟁 비교하기"
    vi: "So sánh đấu tranh khai mỏ ở Chile và Úc"
    ms: "Bandingkan perjuangan perlombongan Chile dan Australia"
    id: "Membandingkan perjuangan tambang di Chile dan Australia"
    hi: "चिली और ऑस्ट्रेलिया के खनन संघर्षों की तुलना करना"
