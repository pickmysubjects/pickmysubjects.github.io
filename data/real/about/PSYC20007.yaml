code: PSYC20007
year: 2026
learn:
  en: "How the mind handles attention, memory, language and decisions, and how experiments test this."
  zh: "大脑怎么处理注意、记忆、语言和决策，以及怎么做实验验证。"
  zh-TW: "大腦怎麼處理注意、記憶、語言和決策，以及怎麼用實驗驗證。"
  ja: "心が注意、記憶、言語、意思決定をどう扱うか、そして実験でどう検証するか。"
  ko: "마음이 주의, 기억, 언어, 결정을 처리하는 방식과 이를 실험으로 검증하는 법."
  vi: "Tâm trí xử lý chú ý, trí nhớ, ngôn ngữ, quyết định ra sao và thí nghiệm kiểm chứng thế nào."
  ms: "Cara minda mengendalikan perhatian, ingatan, bahasa dan keputusan, serta cara eksperimen mengujinya."
  id: "Cara pikiran mengolah perhatian, memori, bahasa, dan keputusan, serta cara eksperimen mengujinya."
  hi: "दिमाग ध्यान, याददाश्त, भाषा और फ़ैसलों को कैसे संभालता है, और प्रयोग इसे कैसे परखते हैं।"
outcomes:
  - en: "Test a theory's predictions against experiment results"
    zh: "用实验结果检验理论预测"
    zh-TW: "用實驗結果檢驗理論預測"
    ja: "理論の予測を実験結果で検証する"
    ko: "이론의 예측을 실험 결과로 검증"
    vi: "Kiểm tra dự đoán của lý thuyết bằng kết quả thí nghiệm"
    ms: "Uji ramalan teori dengan hasil eksperimen"
    id: "Menguji prediksi teori dengan hasil eksperimen"
    hi: "सिद्धांत की भविष्यवाणी को प्रयोग के नतीजों से परखना"
  - en: "Analyse data from cognitive experiments"
    zh: "分析认知实验的数据"
    zh-TW: "分析認知實驗的數據"
    ja: "認知実験のデータを分析する"
    ko: "인지 실험 데이터 분석"
    vi: "Phân tích dữ liệu từ thí nghiệm nhận thức"
    ms: "Analisis data daripada eksperimen kognitif"
    id: "Menganalisis data eksperimen kognitif"
    hi: "कॉग्निटिव प्रयोगों के डेटा का विश्लेषण"
  - en: "Explain everyday memory slips and decision biases"
    zh: "解释日常的记忆失误和决策偏差"
    zh-TW: "解釋日常的記憶失誤和決策偏差"
    ja: "日常の物忘れや意思決定の偏りを説明する"
    ko: "일상적인 기억 실수와 결정 편향 설명"
    vi: "Giải thích lỗi trí nhớ hằng ngày và thiên kiến khi quyết định"
    ms: "Terangkan kesilapan ingatan harian dan bias keputusan"
    id: "Menjelaskan lupa sehari-hari dan bias keputusan"
    hi: "रोज़ की भूल-चूक और फ़ैसलों के पूर्वाग्रह समझाना"
