code: MUSI30047
year: 2026
learn:
  en: "Analysing music with Schenkerian analysis, neo-Riemannian theory and set theory, through hands-on written tasks."
  zh: "通过书面练习学习申克分析、新黎曼理论和音级集合理论等音乐分析方法。"
  zh-TW: "透過書面練習學習申克分析、新黎曼理論和音級集合理論等音樂分析方法。"
  ja: "シェンカー分析・新リーマン理論・セット理論などで楽曲を分析する。"
  ko: "쉥커 분석·신리만 이론·집합론 등으로 음악을 분석한다."
  vi: "Phân tích âm nhạc bằng Schenker, neo-Riemann và lý thuyết tập hợp."
  ms: "Analisis muzik dengan kaedah Schenker, neo-Riemann dan teori set."
  id: "Menganalisis musik dengan Schenker, neo-Riemann, dan teori set."
  hi: "शेंकर, नियो-रीमानियन और सेट सिद्धांत से संगीत विश्लेषण।"
outcomes:
  - en: "Apply major analytical methods to real pieces"
    zh: "将主要分析方法应用于实际作品"
    zh-TW: "將主要分析方法應用於實際作品"
    ja: "主要な分析法を実際の曲に使う"
    ko: "주요 분석 방법을 실제 곡에 적용하기"
    vi: "Áp dụng phương pháp phân tích vào tác phẩm thật"
    ms: "Guna kaedah analisis utama pada karya sebenar"
    id: "Menerapkan metode analisis pada karya nyata"
    hi: "प्रमुख विश्लेषण विधियाँ असली रचनाओं पर लगाना"
  - en: "Explain tonal and atonal structures"
    zh: "解释调性与无调性结构"
    zh-TW: "解釋調性與無調性結構"
    ja: "調性・無調の構造を説明する"
    ko: "조성·무조 구조 설명하기"
    vi: "Giải thích cấu trúc có điệu và phi điệu tính"
    ms: "Terangkan struktur tonal dan atonal"
    id: "Menjelaskan struktur tonal dan atonal"
    hi: "तानवाली और अतानवाली संरचनाएँ समझाना"
  - en: "Choose a method to analyse a piece you like"
    zh: "选择合适方法分析自己喜欢的作品"
    zh-TW: "選擇合適方法分析自己喜歡的作品"
    ja: "好きな曲に合う分析法を選び分析する"
    ko: "좋아하는 곡에 맞는 분석법 골라 분석하기"
    vi: "Chọn phương pháp phân tích một bản nhạc bạn thích"
    ms: "Pilih kaedah untuk analisis karya kegemaran"
    id: "Memilih metode untuk menganalisis karya favorit"
    hi: "पसंदीदा रचना के लिए विश्लेषण विधि चुनना"
