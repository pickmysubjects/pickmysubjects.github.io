code: AHIS20016
year: 2026
learn:
  en: "How 19th-century European art responded to revolution, industry, science and empire, and broke from academic tradition."
  zh: "19世纪欧洲艺术如何回应革命、工业化、科学和帝国扩张，并突破学院传统。"
  zh-TW: "19世紀歐洲藝術如何回應革命、工業化、科學和帝國擴張，並突破學院傳統。"
  ja: "19世紀ヨーロッパ美術が革命・産業・科学・帝国にどう応え、アカデミーの伝統から離れたかを学ぶ。"
  ko: "19세기 유럽 미술이 혁명·산업·과학·제국에 어떻게 응답하고 아카데미 전통에서 벗어났는지 배운다."
  vi: "Nghệ thuật châu Âu thế kỷ 19 đáp lại cách mạng, công nghiệp, khoa học và đế quốc ra sao, và thoát khỏi truyền thống học viện."
  ms: "Cara seni Eropah abad ke-19 menjawab revolusi, industri, sains dan empayar, serta keluar daripada tradisi akademi."
  id: "Cara seni Eropa abad ke-19 menanggapi revolusi, industri, sains dan imperium, serta lepas dari tradisi akademi."
  hi: "19वीं सदी की यूरोपीय कला ने क्रांति, उद्योग, विज्ञान और साम्राज्य का जवाब कैसे दिया और अकादमिक परंपरा से कैसे अलग हुई।"
outcomes:
  - en: "Describe major 19th-century art movements"
    zh: "描述19世纪的主要艺术运动"
    zh-TW: "描述19世紀的主要藝術運動"
    ja: "19世紀の主な美術運動を説明する"
    ko: "19세기 주요 미술 운동 설명하기"
    vi: "Mô tả các trào lưu nghệ thuật chính thế kỷ 19"
    ms: "Huraikan gerakan seni utama abad ke-19"
    id: "Menguraikan gerakan seni utama abad ke-19"
    hi: "19वीं सदी के मुख्य कला आंदोलनों का वर्णन करना"
  - en: "Link art to social and political change"
    zh: "把艺术与社会政治变化联系起来"
    zh-TW: "把藝術與社會政治變化聯繫起來"
    ja: "美術を社会・政治の変化と結びつける"
    ko: "미술을 사회·정치 변화와 연결하기"
    vi: "Liên hệ nghệ thuật với biến đổi xã hội, chính trị"
    ms: "Kaitkan seni dengan perubahan sosial dan politik"
    id: "Mengaitkan seni dengan perubahan sosial dan politik"
    hi: "कला को सामाजिक-राजनीतिक बदलाव से जोड़ना"
  - en: "Discuss class, race and gender in the art"
    zh: "讨论艺术中的阶级、种族与性别"
    zh-TW: "討論藝術中的階級、種族與性別"
    ja: "美術における階級・人種・ジェンダーを論じる"
    ko: "미술 속 계급·인종·젠더 논의하기"
    vi: "Thảo luận giai cấp, chủng tộc và giới trong nghệ thuật"
    ms: "Bincangkan kelas, kaum dan gender dalam seni"
    id: "Membahas kelas, ras dan gender dalam seni"
    hi: "कला में वर्ग, नस्ल और जेंडर पर चर्चा करना"
