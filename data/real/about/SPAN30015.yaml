code: SPAN30015
year: 2026
learn:
  en: "Spanish for students who finished Spanish 5: reading Hispanic short stories and films, and writing your own fiction."
  zh: "适合学完西班牙语 5 的学生：读西语短篇小说、看短片，并自己创作。"
  zh-TW: "適合學完西班牙語 5 的學生：讀西語短篇小說、看短片，並自己創作。"
  ja: "スペイン語5を終えた学生向け。スペイン語圏の短編小説や短編映画を読み、自分でも物語を作る。"
  ko: "스페인어 5를 마친 학생 대상. 스페인어권 단편 소설과 영화를 보고 직접 이야기를 쓴다."
  vi: "Tiếng Tây Ban Nha cho ai đã học xong Spanish 5: đọc truyện ngắn, xem phim ngắn và tự viết truyện."
  ms: "Bahasa Sepanyol untuk yang tamat Spanish 5: cerpen dan filem pendek Hispanik, serta menulis fiksyen sendiri."
  id: "Bahasa Spanyol untuk yang lulus Spanish 5: cerpen dan film pendek Hispanik, serta menulis fiksi sendiri."
  hi: "स्पेनिश 5 पूरा कर चुके छात्रों के लिए: हिस्पैनिक कहानियाँ और लघु फ़िल्में, और अपनी कथा लिखना।"
outcomes:
  - en: "Discuss social and cultural topics in Spanish"
    zh: "用西班牙语讨论社会和文化话题"
    zh-TW: "用西班牙語討論社會和文化話題"
    ja: "社会や文化の話題をスペイン語で話し合う"
    ko: "사회·문화 주제를 스페인어로 토론하기"
    vi: "Thảo luận chủ đề xã hội, văn hóa bằng tiếng Tây Ban Nha"
    ms: "Bincangkan topik sosial dan budaya dalam bahasa Sepanyol"
    id: "Membahas topik sosial dan budaya dalam bahasa Spanyol"
    hi: "सामाजिक और सांस्कृतिक विषयों पर स्पेनिश में चर्चा करना"
  - en: "Read and write longer Spanish texts"
    zh: "读写较长的西班牙语文章"
    zh-TW: "讀寫較長的西班牙語文章"
    ja: "長めのスペイン語の文章を読み書きする"
    ko: "긴 스페인어 글 읽고 쓰기"
    vi: "Đọc và viết văn bản tiếng Tây Ban Nha dài hơn"
    ms: "Baca dan tulis teks bahasa Sepanyol yang lebih panjang"
    id: "Membaca dan menulis teks bahasa Spanyol yang lebih panjang"
    hi: "लंबे स्पेनिश पाठ पढ़ना-लिखना"
  - en: "Give a clear presentation in Spanish"
    zh: "用西班牙语做清楚的口头报告"
    zh-TW: "用西班牙語做清楚的口頭報告"
    ja: "スペイン語で分かりやすく発表する"
    ko: "스페인어로 명확하게 발표하기"
    vi: "Thuyết trình rõ ràng bằng tiếng Tây Ban Nha"
    ms: "Buat pembentangan yang jelas dalam bahasa Sepanyol"
    id: "Melakukan presentasi yang jelas dalam bahasa Spanyol"
    hi: "स्पेनिश में स्पष्ट प्रस्तुति देना"
