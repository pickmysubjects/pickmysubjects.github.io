code: ACCT20002
year: 2026
learn:
  en: "Harder financial reporting under Australian Accounting Standards, and why managers make the accounting choices they do."
  zh: "按澳洲会计准则做更深入的财务报告，以及管理者为何这样选择。"
  zh-TW: "依澳洲會計準則做更深入的財務報導，以及管理者為何這樣選擇。"
  ja: "豪州会計基準に沿った発展的な財務報告と、経営者の会計選択の理由。"
  ko: "호주 회계기준에 따른 심화 재무보고와 경영자가 회계 선택을 하는 이유."
  vi: "Báo cáo tài chính nâng cao theo chuẩn mực kế toán Úc, và vì sao nhà quản lý chọn cách hạch toán như vậy."
  ms: "Pelaporan kewangan lanjutan di bawah Piawaian Perakaunan Australia, dan sebab pengurus buat pilihan perakaunan."
  id: "Pelaporan keuangan lanjutan menurut Standar Akuntansi Australia, dan alasan manajer memilih cara akuntansinya."
  hi: "ऑस्ट्रेलियाई अकाउंटिंग स्टैंडर्ड के तहत उन्नत वित्तीय रिपोर्टिंग, और मैनेजर अपने अकाउंटिंग विकल्प क्यों चुनते हैं।"
outcomes:
  - en: "Record and disclose transactions under key Accounting Standards"
    zh: "按主要会计准则记录和披露交易"
    zh-TW: "依主要會計準則記錄和揭露交易"
    ja: "主要な会計基準に従って取引を記録・開示する"
    ko: "주요 회계기준에 따라 거래 기록·공시"
    vi: "Ghi nhận và công bố giao dịch theo chuẩn mực kế toán chính"
    ms: "Rekod dan dedah urus niaga mengikut piawaian perakaunan utama"
    id: "Mencatat dan mengungkap transaksi sesuai standar akuntansi utama"
    hi: "मुख्य अकाउंटिंग स्टैंडर्ड के तहत लेन-देन दर्ज और प्रकट करना"
  - en: "Explain theories of why financial accounting exists"
    zh: "解释财务会计存在的理论原因"
    zh-TW: "說明財務會計存在的理論原因"
    ja: "財務会計が存在する理由の理論を説明する"
    ko: "재무회계가 존재하는 이유에 관한 이론 설명"
    vi: "Giải thích lý thuyết vì sao kế toán tài chính tồn tại"
    ms: "Terangkan teori mengapa perakaunan kewangan wujud"
    id: "Menjelaskan teori mengapa akuntansi keuangan ada"
    hi: "वित्तीय लेखांकन क्यों मौजूद है, इसके सिद्धांत समझाना"
  - en: "Judge how well the standards fit the Conceptual Framework"
    zh: "评估准则与概念框架的契合程度"
    zh-TW: "評估準則與觀念架構的契合程度"
    ja: "基準が概念フレームワークにどれだけ合うか評価する"
    ko: "기준이 개념체계에 얼마나 부합하는지 평가"
    vi: "Đánh giá chuẩn mực phù hợp Khuôn khổ khái niệm đến đâu"
    ms: "Nilai sejauh mana piawaian sepadan dengan Rangka Kerja Konseptual"
    id: "Menilai kesesuaian standar dengan Kerangka Konseptual"
    hi: "मानक कॉन्सेप्चुअल फ़्रेमवर्क से कितने मेल खाते हैं, आँकना"
