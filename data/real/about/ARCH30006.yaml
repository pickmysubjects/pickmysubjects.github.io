code: ARCH30006
year: 2026
learn:
  en: "Learn to design with Country and work respectfully with First Peoples communities, starting from Naarm (Melbourne)."
  zh: "从Naarm（墨尔本）出发，学习“与土地共同设计”，并尊重地与原住民社区合作。"
  zh-TW: "從Naarm（墨爾本）出發，學習「與土地共同設計」，並尊重地與原住民社群合作。"
  ja: "Naarm（メルボルン）を起点に、土地とともに設計し先住民コミュニティと敬意をもって協働する。"
  ko: "Naarm(멜버른)에서 시작해 땅과 함께 설계하고 원주민 공동체와 존중하며 협업한다."
  vi: "Từ Naarm (Melbourne), học thiết kế cùng Đất và hợp tác tôn trọng với cộng đồng bản địa."
  ms: "Bermula di Naarm (Melbourne), belajar mereka bentuk bersama Tanah dan bekerjasama dengan Orang Asal."
  id: "Berawal dari Naarm (Melbourne), belajar mendesain bersama Tanah dan bekerja sama dengan Pribumi."
  hi: "नार्म (मेलबर्न) से शुरू कर, ज़मीन के साथ डिज़ाइन करना और आदिवासी समुदायों से सम्मान से जुड़ना।"
outcomes:
  - en: "Apply cultural protocols when designing"
    zh: "在设计中遵循文化规范"
    zh-TW: "在設計中遵循文化規範"
    ja: "設計で文化的な手順を守る"
    ko: "설계에 문화 규약 적용하기"
    vi: "Áp dụng quy tắc văn hóa khi thiết kế"
    ms: "Guna protokol budaya ketika mereka bentuk"
    id: "Menerapkan protokol budaya saat mendesain"
    hi: "डिज़ाइन में सांस्कृतिक प्रोटोकॉल अपनाना"
  - en: "Study First Peoples-led design projects"
    zh: "研究原住民主导的设计项目"
    zh-TW: "研究原住民主導的設計專案"
    ja: "先住民主導の設計事例を学ぶ"
    ko: "원주민 주도 설계 사례 연구하기"
    vi: "Nghiên cứu dự án do người bản địa dẫn dắt"
    ms: "Kaji projek reka bentuk diterajui Orang Asal"
    id: "Mengkaji proyek desain dipimpin Pribumi"
    hi: "आदिवासी-नेतृत्व वाले डिज़ाइन प्रोजेक्ट पढ़ना"
  - en: "Develop site-based design ideas in a group"
    zh: "小组合作提出基于场地的设计构想"
    zh-TW: "小組合作提出基於場地的設計構想"
    ja: "グループで敷地に根ざした設計案をつくる"
    ko: "그룹으로 장소 기반 설계안 만들기"
    vi: "Cùng nhóm phát triển ý tưởng theo địa điểm"
    ms: "Bangunkan idea reka bentuk tapak secara berkumpulan"
    id: "Mengembangkan ide desain berbasis tapak bersama"
    hi: "समूह में जगह-आधारित डिज़ाइन विचार बनाना"
