code: HIST20090
year: 2026
learn:
  en: "How gender shaped world events since 1800, from empire and the world wars to decolonisation, and how ordinary people lived them."
  zh: "性别如何塑造 1800 年以来的世界大事，从帝国、两次世界大战到去殖民化，以及普通人的亲身经历。"
  zh-TW: "性別如何塑造 1800 年以來的世界大事，從帝國、兩次世界大戰到去殖民化，以及普通人的親身經歷。"
  ja: "1800年以降、帝国、二つの世界大戦、脱植民地化といった世界の出来事をジェンダーがどう形作り、普通の人々がどう生きたか。"
  ko: "1800년 이후 제국, 두 차례 세계대전, 탈식민화 같은 세계사적 사건을 젠더가 어떻게 만들었고 보통 사람들은 어떻게 겪었나."
  vi: "Giới đã định hình các sự kiện thế giới từ 1800 ra sao, từ đế quốc, hai cuộc thế chiến đến giải thực dân, và người thường đã sống qua thế nào."
  ms: "Cara gender membentuk peristiwa dunia sejak 1800, dari empayar dan perang dunia hingga dekolonisasi, serta pengalaman orang biasa."
  id: "Cara gender membentuk peristiwa dunia sejak 1800, dari imperium dan perang dunia hingga dekolonisasi, serta pengalaman orang biasa."
  hi: "1800 से जेंडर ने विश्व घटनाओं को कैसे गढ़ा, साम्राज्य और विश्व युद्धों से विउपनिवेशीकरण तक, और आम लोगों ने उन्हें कैसे जिया।"
outcomes:
  - en: "Explain how gender shaped major world events"
    zh: "说明性别如何影响重大世界事件"
    zh-TW: "說明性別如何影響重大世界事件"
    ja: "ジェンダーが世界の大事件をどう形作ったか説明する"
    ko: "젠더가 주요 세계 사건을 만든 방식 설명하기"
    vi: "Giải thích giới định hình các sự kiện thế giới lớn ra sao"
    ms: "Terangkan cara gender membentuk peristiwa besar dunia"
    id: "Menjelaskan cara gender membentuk peristiwa besar dunia"
    hi: "जेंडर ने बड़ी विश्व घटनाओं को कैसे गढ़ा, समझाना"
  - en: "Read letters, photos and documents as sources"
    zh: "把书信、照片和文件当作史料来读"
    zh-TW: "把書信、照片和文件當作史料來讀"
    ja: "手紙、写真、公文書を史料として読む"
    ko: "편지, 사진, 문서를 사료로 읽기"
    vi: "Đọc thư từ, ảnh và văn bản như nguồn sử liệu"
    ms: "Baca surat, foto dan dokumen sebagai sumber"
    id: "Membaca surat, foto dan dokumen sebagai sumber"
    hi: "पत्रों, तस्वीरों और दस्तावेज़ों को स्रोत की तरह पढ़ना"
  - en: "Discuss key debates in gender history"
    zh: "讨论性别史中的主要争论"
    zh-TW: "討論性別史中的主要爭論"
    ja: "ジェンダー史の主な論点を議論する"
    ko: "젠더사의 주요 논쟁 토론하기"
    vi: "Thảo luận các tranh luận chính trong lịch sử giới"
    ms: "Bincangkan perdebatan utama sejarah gender"
    id: "Membahas perdebatan utama sejarah gender"
    hi: "जेंडर इतिहास की मुख्य बहसों पर चर्चा करना"
