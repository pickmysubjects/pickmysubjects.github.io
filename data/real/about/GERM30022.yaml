code: GERM30022
year: 2026
learn:
  en: "Advanced German through the theme of war: how wars shaped German-speaking societies and the writers and artists who responded."
  zh: "以战争为主题学习高级德语：战争如何塑造德语社会，以及作家和艺术家的回应。"
  zh-TW: "以戰爭為主題學習進階德語：戰爭如何塑造德語社會，以及作家和藝術家的回應。"
  ja: "戦争をテーマに上級ドイツ語を学ぶ。戦争がドイツ語圏社会をどう形作り、作家や芸術家がどう応えたか。"
  ko: "전쟁을 주제로 고급 독일어를 배운다. 전쟁이 독일어권 사회를 어떻게 바꿨고 작가·예술가가 어떻게 응답했는지."
  vi: "Tiếng Đức nâng cao qua chủ đề chiến tranh: chiến tranh định hình xã hội nói tiếng Đức ra sao và giới văn nghệ đáp lại thế nào."
  ms: "Bahasa Jerman lanjutan bertema perang: cara perang membentuk masyarakat berbahasa Jerman dan respons penulis serta seniman."
  id: "Bahasa Jerman lanjut bertema perang: bagaimana perang membentuk masyarakat berbahasa Jerman dan tanggapan penulis serta seniman."
  hi: "युद्ध विषय से उन्नत जर्मन: युद्धों ने जर्मन-भाषी समाजों को कैसे गढ़ा और लेखकों-कलाकारों ने क्या जवाब दिया।"
outcomes:
  - en: "Discuss social and cultural topics in German"
    zh: "用德语讨论社会和文化话题"
    zh-TW: "用德語討論社會和文化話題"
    ja: "社会や文化の話題をドイツ語で話し合う"
    ko: "사회·문화 주제를 독일어로 토론하기"
    vi: "Thảo luận chủ đề xã hội, văn hóa bằng tiếng Đức"
    ms: "Bincangkan topik sosial dan budaya dalam bahasa Jerman"
    id: "Membahas topik sosial dan budaya dalam bahasa Jerman"
    hi: "सामाजिक और सांस्कृतिक विषयों पर जर्मन में चर्चा करना"
  - en: "Read and write longer German texts"
    zh: "读写较长的德语文章"
    zh-TW: "讀寫較長的德語文章"
    ja: "長めのドイツ語の文章を読み書きする"
    ko: "긴 독일어 글 읽고 쓰기"
    vi: "Đọc và viết văn bản tiếng Đức dài hơn"
    ms: "Baca dan tulis teks bahasa Jerman yang lebih panjang"
    id: "Membaca dan menulis teks bahasa Jerman yang lebih panjang"
    hi: "लंबे जर्मन पाठ पढ़ना-लिखना"
  - en: "Give a clear presentation in German"
    zh: "用德语做清楚的口头报告"
    zh-TW: "用德語做清楚的口頭報告"
    ja: "ドイツ語で分かりやすく発表する"
    ko: "독일어로 명확하게 발표하기"
    vi: "Thuyết trình rõ ràng bằng tiếng Đức"
    ms: "Buat pembentangan yang jelas dalam bahasa Jerman"
    id: "Melakukan presentasi yang jelas dalam bahasa Jerman"
    hi: "जर्मन में स्पष्ट प्रस्तुति देना"
