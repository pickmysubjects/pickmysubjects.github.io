code: BMEN20003
year: 2026
learn:
  en: "Programming and numerical methods for solving bioengineering problems."
  zh: "用编程和数值方法解决生物工程问题。"
  zh-TW: "用程式設計與數值方法解決生醫工程問題。"
  ja: "プログラミングと数値計算で生体工学の問題を解く。"
  ko: "프로그래밍과 수치해석으로 생명공학 문제 풀기."
  vi: "Lập trình và phương pháp số để giải bài toán kỹ thuật y sinh."
  ms: "Pengaturcaraan dan kaedah berangka untuk menyelesaikan masalah kejuruteraan bio."
  id: "Pemrograman dan metode numerik untuk memecahkan masalah bioengineering."
  hi: "बायोइंजीनियरिंग समस्याएँ हल करने के लिए प्रोग्रामिंग और न्यूमेरिकल तरीके।"
outcomes:
  - en: "Write and debug small numerical programs"
    zh: "编写和调试小型数值程序"
    zh-TW: "撰寫並除錯小型數值程式"
    ja: "小さな数値プログラムを書きデバッグする"
    ko: "작은 수치 프로그램 작성·디버깅하기"
    vi: "Viết và gỡ lỗi chương trình số nhỏ"
    ms: "Tulis dan nyahpepijat program berangka kecil"
    id: "Menulis dan men-debug program numerik kecil"
    hi: "छोटे न्यूमेरिकल प्रोग्राम लिखें और डिबग करें"
  - en: "Turn bio problems into maths models"
    zh: "把生物问题转成数学模型"
    zh-TW: "把生物問題轉成數學模型"
    ja: "生体の問題を数理モデルにする"
    ko: "생명 문제를 수학 모델로 바꾸기"
    vi: "Chuyển bài toán sinh học thành mô hình toán"
    ms: "Tukar masalah bio kepada model matematik"
    id: "Mengubah masalah bio menjadi model matematika"
    hi: "जैविक समस्याओं को गणितीय मॉडल में बदलें"
  - en: "Pick up new programming languages on your own"
    zh: "自学新的编程语言"
    zh-TW: "自學新的程式語言"
    ja: "新しい言語を独学で習得する"
    ko: "새 프로그래밍 언어 독학하기"
    vi: "Tự học ngôn ngữ lập trình mới"
    ms: "Belajar bahasa pengaturcaraan baharu sendiri"
    id: "Belajar bahasa pemrograman baru sendiri"
    hi: "नई प्रोग्रामिंग भाषाएँ खुद सीखें"
