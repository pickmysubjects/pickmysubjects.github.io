code: ANTH20012
year: 2026
learn:
  en: "How culture and society shape our sense of self, compared across cultures and applied to migration, childhood and new technology."
  zh: "文化和社会如何塑造自我认知，跨文化比较，并联系移民、童年和新技术。"
  zh-TW: "文化和社會如何塑造自我認知，跨文化比較，並聯繫移民、童年和新技術。"
  ja: "文化と社会が自己意識をどう形づくるかを比較し、移住や子ども時代、新技術に当てはめる。"
  ko: "문화와 사회가 자아 인식을 어떻게 만드는지 비교하고 이주, 어린 시절, 신기술에 적용한다."
  vi: "Văn hóa và xã hội định hình ý thức về bản thân ra sao, so sánh giữa các nền văn hóa, áp dụng vào di cư, tuổi thơ và công nghệ mới."
  ms: "Cara budaya dan masyarakat membentuk diri, dibandingkan antara budaya dan dikaitkan dengan migrasi, zaman kanak-kanak dan teknologi baharu."
  id: "Cara budaya dan masyarakat membentuk rasa diri, dibandingkan antarbudaya dan diterapkan pada migrasi, masa kecil, dan teknologi baru."
  hi: "संस्कृति और समाज हमारी आत्म-पहचान को कैसे गढ़ते हैं, संस्कृतियों में तुलना और प्रवास, बचपन व नई तकनीक पर लागू करना।"
outcomes:
  - en: "Explain key theories of personhood and identity"
    zh: "解释关于人格与身份的主要理论"
    zh-TW: "解釋關於人格與身分的主要理論"
    ja: "人格とアイデンティティの主な理論を説明する"
    ko: "인격과 정체성의 주요 이론 설명하기"
    vi: "Giải thích các lý thuyết chính về nhân vị và bản sắc"
    ms: "Terangkan teori utama tentang keperibadian dan identiti"
    id: "Menjelaskan teori utama tentang kedirian dan identitas"
    hi: "व्यक्तित्व और पहचान के मुख्य सिद्धांत समझाना"
  - en: "Compare ideas of the person across cultures"
    zh: "比较不同文化中对“人”的理解"
    zh-TW: "比較不同文化中對「人」的理解"
    ja: "文化ごとの「人」の考え方を比べる"
    ko: "문화별 ‘사람’ 개념 비교하기"
    vi: "So sánh quan niệm về con người giữa các nền văn hóa"
    ms: "Bandingkan konsep insan merentas budaya"
    id: "Membandingkan gagasan tentang manusia lintas budaya"
    hi: "संस्कृतियों में ‘व्यक्ति’ की धारणाओं की तुलना करना"
  - en: "Apply these ideas to current social issues"
    zh: "把这些观点用于当下的社会议题"
    zh-TW: "把這些觀點用於當下的社會議題"
    ja: "これらの考えを今の社会問題に当てはめる"
    ko: "이 개념을 현재 사회 문제에 적용하기"
    vi: "Áp dụng các ý tưởng này vào vấn đề xã hội hiện nay"
    ms: "Gunakan idea ini pada isu sosial semasa"
    id: "Menerapkan gagasan ini pada isu sosial terkini"
    hi: "इन विचारों को आज के सामाजिक मुद्दों पर लागू करना"
