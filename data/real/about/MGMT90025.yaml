code: MGMT90025
year: 2027
learn:
  en: "How organisational change affects people, and how planned and emergent change is led and carried out."
  zh: "组织变革如何影响员工，以及如何推动计划式和渐进式变革。"
  zh-TW: "組織變革如何影響員工，以及如何推動計畫式與漸進式變革。"
  ja: "組織変革が人に与える影響と、計画的・創発的な変革の進め方を学ぶ。"
  ko: "조직 변화가 사람에게 미치는 영향과 계획적·창발적 변화를 이끄는 방법을 배운다."
  vi: "Thay đổi tổ chức ảnh hưởng con người ra sao, và cách dẫn dắt thay đổi có kế hoạch lẫn tự phát."
  ms: "Bagaimana perubahan organisasi memberi kesan kepada manusia, dan cara perubahan terancang dan spontan dipimpin."
  id: "Bagaimana perubahan organisasi memengaruhi orang, dan cara perubahan terencana maupun spontan dipimpin."
  hi: "संगठनात्मक बदलाव लोगों पर कैसे असर डालता है, और योजनाबद्ध व स्वाभाविक बदलाव कैसे चलाया जाता है।"
outcomes:
  - en: "Apply change theories to people problems"
    zh: "将变革理论用于人员问题"
    zh-TW: "將變革理論應用於人員問題"
    ja: "変革理論を人の問題に応用する"
    ko: "변화 이론을 사람 문제에 적용하기"
    vi: "Áp dụng lý thuyết thay đổi vào vấn đề con người"
    ms: "Menggunakan teori perubahan pada masalah manusia"
    id: "Menerapkan teori perubahan pada masalah orang"
    hi: "बदलाव के सिद्धांत लोगों की समस्याओं पर लगाना"
  - en: "Plan tools for managing change"
    zh: "规划管理变革的工具"
    zh-TW: "規劃管理變革的工具"
    ja: "変革を管理する手段を計画する"
    ko: "변화 관리 도구 계획하기"
    vi: "Lên công cụ quản lý thay đổi"
    ms: "Merancang alat untuk mengurus perubahan"
    id: "Merencanakan alat untuk mengelola perubahan"
    hi: "बदलाव संभालने के साधन तय करना"
