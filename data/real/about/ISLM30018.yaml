code: ISLM30018
year: 2026
learn:
  en: "Diplomacy and politics in the modern Muslim world, from Iran and Egypt to Kashmir and Afghanistan, and how outside powers deal with them."
  zh: "现代穆斯林世界的外交与政治，从伊朗、埃及到克什米尔和阿富汗，以及外部大国如何与之打交道。"
  zh-TW: "現代穆斯林世界的外交與政治，從伊朗、埃及到喀什米爾和阿富汗，以及外部強權如何與之打交道。"
  ja: "イラン、エジプトからカシミール、アフガニスタンまで、現代イスラム世界の外交と政治、そして外部の大国の関わり方を学ぶ。"
  ko: "이란, 이집트부터 카슈미르, 아프가니스탄까지 현대 이슬람 세계의 외교와 정치, 외부 강대국의 대응을 배운다."
  vi: "Ngoại giao và chính trị trong thế giới Hồi giáo hiện đại, từ Iran, Ai Cập đến Kashmir, Afghanistan, và cách các cường quốc bên ngoài ứng xử."
  ms: "Diplomasi dan politik dalam dunia Islam moden, dari Iran dan Mesir hingga Kashmir dan Afghanistan, serta cara kuasa luar berurusan dengannya."
  id: "Diplomasi dan politik di dunia Muslim modern, dari Iran dan Mesir hingga Kashmir dan Afganistan, serta cara kekuatan luar menghadapinya."
  hi: "आधुनिक मुस्लिम दुनिया में कूटनीति और राजनीति, ईरान और मिस्र से कश्मीर और अफ़ग़ानिस्तान तक, और बाहरी ताकतें इनसे कैसे निपटती हैं।"
outcomes:
  - en: "Explain how religion shapes politics in the region"
    zh: "说明宗教如何影响该地区的政治"
    zh-TW: "說明宗教如何影響該地區的政治"
    ja: "宗教がこの地域の政治をどう形づくるか説明する"
    ko: "종교가 이 지역 정치에 미치는 영향 설명하기"
    vi: "Giải thích tôn giáo định hình chính trị khu vực ra sao"
    ms: "Terangkan cara agama membentuk politik di rantau ini"
    id: "Menjelaskan cara agama membentuk politik di kawasan ini"
    hi: "समझाना कि धर्म इस क्षेत्र की राजनीति को कैसे प्रभावित करता है"
  - en: "Analyse diplomatic crises through case studies"
    zh: "通过案例分析外交危机"
    zh-TW: "透過案例分析外交危機"
    ja: "事例を通して外交危機を分析する"
    ko: "사례로 외교 위기 분석하기"
    vi: "Phân tích khủng hoảng ngoại giao qua các trường hợp cụ thể"
    ms: "Analisis krisis diplomatik melalui kajian kes"
    id: "Menganalisis krisis diplomatik lewat studi kasus"
    hi: "केस स्टडी से कूटनीतिक संकटों का विश्लेषण करना"
  - en: "Suggest how outside powers could engage"
    zh: "就外部国家如何介入提出建议"
    zh-TW: "就外部國家如何介入提出建議"
    ja: "外部の国がどう関わるべきか提案する"
    ko: "외부 국가의 관여 방식 제안하기"
    vi: "Đề xuất cách các nước bên ngoài nên can dự"
    ms: "Cadangkan cara kuasa luar boleh terlibat"
    id: "Mengusulkan cara negara luar bisa terlibat"
    hi: "सुझाव देना कि बाहरी देश कैसे जुड़ सकते हैं"
