code: ARCH30002
year: 2026
learn:
  en: "The Architecture major's capstone studio: design a large urban-scale project and present it in drawings, models and talks."
  zh: "建筑专业毕业设计课：做一个城市尺度的大型项目，并用图纸、模型和汇报呈现。"
  zh-TW: "建築主修的畢業設計課：做一個城市尺度的大型專案，並用圖面、模型和簡報呈現。"
  ja: "建築専攻の総仕上げスタジオ。都市規模の大型プロジェクトを設計し、図面・模型・発表で示す。"
  ko: "건축 전공 캡스톤 스튜디오. 도시 규모의 대형 프로젝트를 설계하고 도면·모형·발표로 보여 준다."
  vi: "Studio tốt nghiệp ngành Kiến trúc: thiết kế dự án quy mô đô thị và trình bày bằng bản vẽ, mô hình, thuyết trình."
  ms: "Studio kemuncak jurusan Seni Bina: reka projek berskala bandar dan bentangkan melalui lukisan, model dan pembentangan."
  id: "Studio puncak jurusan Arsitektur: merancang proyek skala kota dan menyajikannya lewat gambar, maket, dan presentasi."
  hi: "आर्किटेक्चर मेजर का कैपस्टोन स्टूडियो: शहरी पैमाने का बड़ा प्रोजेक्ट डिज़ाइन कर ड्रॉइंग, मॉडल और प्रस्तुति से दिखाना।"
outcomes:
  - en: "Design a building complex that works at the urban scale"
    zh: "设计适应城市尺度的建筑群"
    zh-TW: "設計適應城市尺度的建築群"
    ja: "都市スケールで機能する建築群を設計する"
    ko: "도시 규모에서 작동하는 건축군 설계하기"
    vi: "Thiết kế cụm công trình phù hợp quy mô đô thị"
    ms: "Reka kompleks bangunan yang sesuai skala bandar"
    id: "Merancang kompleks bangunan yang cocok skala kota"
    hi: "शहरी पैमाने पर काम करने वाला भवन-समूह डिज़ाइन करना"
  - en: "Balance space, site context and structure in one scheme"
    zh: "在一个方案中兼顾空间、场地环境和结构"
    zh-TW: "在一個方案中兼顧空間、基地環境和結構"
    ja: "空間・敷地環境・構造を一つの案で両立させる"
    ko: "공간·대지 맥락·구조를 한 안에서 조율하기"
    vi: "Cân bằng không gian, bối cảnh khu đất và kết cấu"
    ms: "Seimbangkan ruang, konteks tapak dan struktur"
    id: "Menyeimbangkan ruang, konteks tapak, dan struktur"
    hi: "एक योजना में स्पेस, साइट संदर्भ और संरचना का संतुलन"
  - en: "Present a full proposal with 2D/3D models and talks"
    zh: "用二维/三维模型和汇报展示完整方案"
    zh-TW: "用 2D/3D 模型和簡報展示完整方案"
    ja: "2D/3Dモデルと発表で案全体を伝える"
    ko: "2D/3D 모델과 발표로 전체 안 제시하기"
    vi: "Trình bày phương án đầy đủ bằng mô hình 2D/3D"
    ms: "Bentang cadangan penuh dengan model 2D/3D"
    id: "Menyajikan usulan lengkap dengan model 2D/3D"
    hi: "2D/3D मॉडल और प्रस्तुति से पूरा प्रस्ताव दिखाना"
