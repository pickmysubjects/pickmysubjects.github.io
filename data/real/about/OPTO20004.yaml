code: OPTO20004
year: 2026
learn:
  en: "The science of how we see colour, motion, size and faces, using illusions and examples from art."
  zh: "我们怎么看到颜色、运动、大小和人脸，用错觉和艺术作例子。"
outcomes:
  - en: "Explain why visual illusions happen"
    zh: "解释视错觉为什么会出现"
  - en: "Explain the science behind how we see"
    zh: "解释视觉背后的科学原理"
  - en: "Describe how artists use perception for effect"
    zh: "描述艺术家怎么利用视觉制造效果"
