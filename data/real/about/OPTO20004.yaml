code: OPTO20004
year: 2026
learn:
  en: "The science of how we see colour, motion, size and faces, using illusions and examples from art."
  zh: "我们怎么看到颜色、运动、大小和人脸，用错觉和艺术作例子。"
  zh-TW: "我們怎麼看到顏色、運動、大小和人臉，用錯覺和藝術作例子。"
  ja: "色・動き・大きさ・顔の見え方の科学。錯視や芸術作品を例に使う。"
  ko: "색, 움직임, 크기, 얼굴을 보는 원리. 착시와 예술 작품을 예로 듦."
  vi: "Khoa học về cách ta thấy màu, chuyển động, kích thước và khuôn mặt, qua ảo giác và nghệ thuật."
  ms: "Sains cara kita melihat warna, gerakan, saiz dan wajah, melalui ilusi dan contoh daripada seni."
  id: "Ilmu tentang cara kita melihat warna, gerak, ukuran, dan wajah, lewat ilusi dan contoh seni."
  hi: "हम रंग, गति, आकार और चेहरे कैसे देखते हैं, इसका विज्ञान, भ्रम और कला के उदाहरणों से।"
outcomes:
  - en: "Explain why visual illusions happen"
    zh: "解释视错觉为什么会出现"
    zh-TW: "解釋視錯覺為什麼會出現"
    ja: "錯視が起こる理由を説明する"
    ko: "착시가 일어나는 이유 설명하기"
    vi: "Giải thích vì sao có ảo giác thị giác"
    ms: "Menerangkan mengapa ilusi visual berlaku"
    id: "Menjelaskan kenapa ilusi visual terjadi"
    hi: "दृष्टि भ्रम क्यों होते हैं, समझाना"
  - en: "Explain the science behind how we see"
    zh: "解释视觉背后的科学原理"
    zh-TW: "解釋視覺背後的科學原理"
    ja: "ものが見える仕組みの科学を説明する"
    ko: "우리가 보는 원리의 과학 설명하기"
    vi: "Giải thích khoa học đằng sau việc nhìn"
    ms: "Menerangkan sains di sebalik penglihatan"
    id: "Menjelaskan sains di balik cara kita melihat"
    hi: "हम कैसे देखते हैं, इसका विज्ञान समझाना"
  - en: "Describe how artists use perception for effect"
    zh: "描述艺术家怎么利用视觉制造效果"
    zh-TW: "描述藝術家怎麼利用視覺製造效果"
    ja: "芸術家が知覚を利用して効果を出す方法を説明する"
    ko: "예술가가 지각을 활용해 효과를 내는 방식 설명하기"
    vi: "Mô tả nghệ sĩ dùng tri giác để tạo hiệu ứng ra sao"
    ms: "Menghuraikan cara artis menggunakan persepsi untuk kesan"
    id: "Menjelaskan cara seniman memakai persepsi untuk efek"
    hi: "कलाकार असर के लिए धारणा का कैसे उपयोग करते हैं"
