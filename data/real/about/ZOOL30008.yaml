code: ZOOL30008
year: 2026
learn:
  en: "Doing marine biology research: designing studies, sampling in the field and lab, and writing it up."
  zh: "做海洋生物研究：设计实验、野外和实验室采样并写论文。"
  zh-TW: "做海洋生物研究：設計實驗、野外和實驗室採樣並寫論文。"
  ja: "海洋生物の研究：調査設計、野外・実験室での採集、論文執筆。"
  ko: "해양생물 연구: 연구 설계, 현장·실험실 채집, 논문 작성."
  vi: "Nghiên cứu sinh vật biển: thiết kế, lấy mẫu ngoài thực địa và phòng thí nghiệm, viết bài."
  ms: "Kajian biologi marin: reka kajian, persampelan di lapangan dan makmal, serta penulisan."
  id: "Riset biologi laut: merancang studi, sampling di lapangan dan lab, lalu menulis."
  hi: "समुद्री जीवविज्ञान रिसर्च: स्टडी डिज़ाइन, फ़ील्ड और लैब में सैंपलिंग, और लेखन।"
outcomes:
  - en: "Turn a question into a testable hypothesis"
    zh: "把问题转化为可检验的假设"
    zh-TW: "把問題轉成可檢驗的假設"
    ja: "問いを検証可能な仮説にする"
    ko: "질문을 검증 가능한 가설로 바꾸기"
    vi: "Biến câu hỏi thành giả thuyết kiểm chứng được"
    ms: "Menukar soalan kepada hipotesis boleh diuji"
    id: "Mengubah pertanyaan jadi hipotesis teruji"
    hi: "सवाल को जाँचने योग्य परिकल्पना बनाना"
  - en: "Write and revise a scientific paper"
    zh: "撰写并修改科学论文"
    zh-TW: "撰寫並修改科學論文"
    ja: "科学論文を書き推敲する"
    ko: "과학 논문 쓰고 고치기"
    vi: "Viết và sửa bài báo khoa học"
    ms: "Menulis dan menyemak kertas saintifik"
    id: "Menulis dan merevisi makalah ilmiah"
    hi: "वैज्ञानिक पेपर लिखना और सुधारना"
  - en: "Design a sampling plan and analyse the data"
    zh: "设计抽样方案并分析数据"
    zh-TW: "設計抽樣方案並分析資料"
    ja: "サンプリング計画を立てデータを分析する"
    ko: "표본 설계를 하고 데이터 분석하기"
    vi: "Thiết kế kế hoạch lấy mẫu và phân tích dữ liệu"
    ms: "Reka pelan persampelan dan analisis data"
    id: "Merancang rencana sampling dan menganalisis data"
    hi: "सैंपलिंग प्लान बनाना और डेटा का विश्लेषण करना"
