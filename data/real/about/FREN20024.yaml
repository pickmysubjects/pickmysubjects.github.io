code: FREN20024
year: 2026
learn:
  en: "The French news media from print to digital, and the state's role in shaping it."
  zh: "法国新闻媒体从纸媒到数字媒体的发展，以及国家在其中的角色。"
  zh-TW: "法國新聞媒體從紙媒到數位媒體的發展，以及國家在其中的角色。"
  ja: "紙からデジタルへ移るフランスの報道メディアと、そこでの国家の役割。"
  ko: "인쇄에서 디지털로 바뀐 프랑스 언론과 그 안에서 국가의 역할."
  vi: "Truyền thông tin tức Pháp từ báo in đến số, và vai trò của nhà nước."
  ms: "Media berita Perancis dari cetak ke digital, dan peranan negara dalam membentuknya."
  id: "Media berita Prancis dari cetak ke digital, dan peran negara dalam membentuknya."
  hi: "छपाई से डिजिटल तक फ़्रांसीसी समाचार मीडिया, और उसे गढ़ने में सरकार की भूमिका।"
outcomes:
  - en: "Describe how French news media developed"
    zh: "描述法国新闻媒体的发展历程"
    zh-TW: "描述法國新聞媒體的發展歷程"
    ja: "フランスの報道メディアの発展を説明する"
    ko: "프랑스 언론의 발전 과정 설명하기"
    vi: "Mô tả sự phát triển của truyền thông Pháp"
    ms: "Huraikan perkembangan media berita Perancis"
    id: "Menjelaskan perkembangan media berita Prancis"
    hi: "फ़्रांसीसी समाचार मीडिया के विकास का वर्णन करना"
  - en: "Analyse French news stories critically"
    zh: "批判性地分析法语新闻"
    zh-TW: "批判性地分析法語新聞"
    ja: "フランス語のニュースを批判的に分析する"
    ko: "프랑스어 뉴스 비판적으로 분석하기"
    vi: "Phân tích có phê phán tin tức tiếng Pháp"
    ms: "Analisis berita Perancis secara kritis"
    id: "Menganalisis berita Prancis secara kritis"
    hi: "फ़्रेंच समाचारों का आलोचनात्मक विश्लेषण करना"
  - en: "Present on a media topic in French"
    zh: "用法语就媒体话题做报告"
    zh-TW: "用法語就媒體話題做報告"
    ja: "メディアの話題をフランス語で発表する"
    ko: "미디어 주제를 프랑스어로 발표하기"
    vi: "Thuyết trình về chủ đề truyền thông bằng tiếng Pháp"
    ms: "Bentangkan topik media dalam bahasa Perancis"
    id: "Mempresentasikan topik media dalam bahasa Prancis"
    hi: "किसी मीडिया विषय पर फ़्रेंच में प्रस्तुति देना"
