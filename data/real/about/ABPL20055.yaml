code: ABPL20055
year: 2026
learn:
  en: "World history of architecture and towns from the first shelters to the mid-1800s, across many regions."
  zh: "从最早的居所到19世纪中叶，跨越多个地区的世界建筑与城镇史。"
  zh-TW: "從最早的居所到19世紀中葉，跨越多個地區的世界建築與城鎮史。"
  ja: "最初の住まいから19世紀半ばまで、各地域にわたる建築と都市の世界史。"
  ko: "최초의 거처부터 19세기 중반까지 여러 지역을 아우르는 건축·도시의 세계사."
  vi: "Lịch sử kiến trúc và đô thị thế giới từ nơi trú ẩn đầu tiên đến giữa thế kỷ 19, qua nhiều vùng."
  ms: "Sejarah seni bina dan bandar dunia dari tempat berlindung terawal hingga pertengahan 1800-an, merentas wilayah."
  id: "Sejarah arsitektur dan kota dunia dari hunian pertama hingga pertengahan 1800-an, lintas wilayah."
  hi: "पहले आश्रयों से 1800 के मध्य तक, कई क्षेत्रों में वास्तुकला और शहरों का विश्व इतिहास।"
outcomes:
  - en: "Identify key buildings and design traditions"
    zh: "识别重要建筑与设计传统"
    zh-TW: "辨識重要建築與設計傳統"
    ja: "主要な建築と設計の伝統を見分ける"
    ko: "주요 건축물과 설계 전통 식별하기"
    vi: "Nhận diện công trình và truyền thống thiết kế chính"
    ms: "Kenal pasti bangunan dan tradisi reka bentuk utama"
    id: "Mengenali bangunan dan tradisi desain penting"
    hi: "मुख्य इमारतें और डिज़ाइन परंपराएँ पहचानना"
  - en: "Relate buildings to their society and setting"
    zh: "把建筑与其社会和环境联系起来"
    zh-TW: "把建築與其社會和環境連結起來"
    ja: "建築を社会と環境に関連づける"
    ko: "건축을 사회·환경과 연결하기"
    vi: "Liên hệ công trình với xã hội và bối cảnh"
    ms: "Kaitkan bangunan dengan masyarakat dan persekitarannya"
    id: "Mengaitkan bangunan dengan masyarakat dan lingkungannya"
    hi: "इमारतों को उनके समाज और परिवेश से जोड़ना"
  - en: "Compare architecture across cultures"
    zh: "比较不同文化的建筑"
    zh-TW: "比較不同文化的建築"
    ja: "文化をまたいで建築を比較する"
    ko: "문화별 건축 비교하기"
    vi: "So sánh kiến trúc giữa các nền văn hóa"
    ms: "Banding seni bina merentas budaya"
    id: "Membandingkan arsitektur antarbudaya"
    hi: "अलग-अलग संस्कृतियों की वास्तुकला की तुलना"
