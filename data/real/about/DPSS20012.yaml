code: DPSS20012
year: 2026
learn:
  en: "Take on a real role on a VCA production, from proposal through rehearsals to bump-out, then reflect on it."
  zh: "在VCA的演出中担任真实岗位，从提案、排练到撤台，然后写反思。"
  zh-TW: "在VCA的演出中擔任真實職位，從提案、排練到撤台，然後寫反思。"
  ja: "VCAの公演で実際の役割を担い、提案から稽古、撤収まで経験して振り返る。"
  ko: "VCA 공연에서 실제 역할을 맡아 제안부터 리허설, 철수까지 경험하고 성찰."
  vi: "Đảm nhận vai trò thật trong vở của VCA, từ đề xuất, tập đến tháo dỡ, rồi suy ngẫm."
  ms: "Pegang peranan sebenar dalam produksi VCA, dari cadangan hingga bongkar, kemudian renung."
  id: "Memegang peran nyata di produksi VCA, dari usulan hingga bongkar panggung, lalu refleksi."
  hi: "VCA प्रोडक्शन में असली भूमिका: प्रस्ताव से रिहर्सल और बंप-आउट तक, फिर चिंतन।"
outcomes:
  - en: "Propose and plan a production role"
    zh: "提出并规划制作岗位"
    zh-TW: "提出並規劃製作職位"
    ja: "制作上の役割を提案し計画する"
    ko: "제작 역할 제안·계획하기"
    vi: "Đề xuất và lên kế hoạch vai trò"
    ms: "Cadang dan rancang peranan produksi"
    id: "Mengusulkan dan merencanakan peran"
    hi: "प्रोडक्शन भूमिका का प्रस्ताव और योजना"
  - en: "Deliver that role on a live show"
    zh: "在现场演出中完成岗位工作"
    zh-TW: "在現場演出中完成職位工作"
    ja: "本番の公演でその役割を果たす"
    ko: "실제 공연에서 그 역할 해내기"
    vi: "Thực hiện vai trò trong buổi diễn"
    ms: "Laksana peranan dalam persembahan langsung"
    id: "Menjalankan peran di pertunjukan langsung"
    hi: "लाइव शो में वह भूमिका निभाना"
  - en: "Reflect on teamwork in production"
    zh: "反思制作中的团队合作"
    zh-TW: "反思製作中的團隊合作"
    ja: "制作でのチームワークを振り返る"
    ko: "제작 팀워크 성찰하기"
    vi: "Suy ngẫm về làm việc nhóm"
    ms: "Renung kerja berpasukan dalam produksi"
    id: "Merefleksikan kerja tim produksi"
    hi: "प्रोडक्शन में टीमवर्क पर चिंतन"
