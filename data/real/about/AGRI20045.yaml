code: AGRI20045
year: 2026
learn:
  en: "A one-week Dookie intensive on sparkling and fortified wines and spirits, with daily tastings and a winery visit."
  zh: "Dookie一周密集课，学起泡酒、加强酒和烈酒，每天品鉴，还参观酒庄。"
  zh-TW: "Dookie一週密集課，學氣泡酒、加烈酒和烈酒，每天品飲，還參訪酒莊。"
  ja: "Dookieでの1週間集中講義。スパークリング、酒精強化ワイン、蒸留酒を毎日試飲しワイナリーも訪問。"
  ko: "Dookie 1주 집중 과정. 스파클링·주정강화 와인과 증류주를 매일 시음하고 와이너리 방문."
  vi: "Khóa tuần ở Dookie về vang sủi, vang cường hóa và rượu mạnh, nếm hằng ngày, thăm xưởng."
  ms: "Intensif seminggu di Dookie tentang wain berbuih, wain diperkuat dan spirit, dengan rasa harian."
  id: "Intensif seminggu di Dookie tentang anggur bersoda, fortified dan spirit, cicip tiap hari."
  hi: "Dookie में एक हफ़्ता: स्पार्कलिंग, फ़ोर्टिफ़ाइड वाइन और स्पिरिट्स, रोज़ टेस्टिंग और वाइनरी विज़िट।"
outcomes:
  - en: "Tell spirit and wine styles apart by tasting"
    zh: "通过品尝分辨烈酒和葡萄酒风格"
    zh-TW: "透過品飲分辨烈酒與葡萄酒風格"
    ja: "試飲で蒸留酒とワインの種類を見分ける"
    ko: "시음으로 증류주·와인 스타일 구별하기"
    vi: "Phân biệt kiểu rượu bằng cách nếm"
    ms: "Bezakan gaya spirit dan wain dengan rasa"
    id: "Membedakan gaya spirit dan anggur lewat cicip"
    hi: "चखकर स्पिरिट और वाइन की शैली पहचानना"
  - en: "Explain how each style is produced"
    zh: "说明每种酒的生产方式"
    zh-TW: "說明每種酒的生產方式"
    ja: "各スタイルの製法を説明する"
    ko: "각 스타일의 제조법 설명하기"
    vi: "Giải thích cách làm từng loại"
    ms: "Jelaskan cara setiap gaya dihasilkan"
    id: "Menjelaskan cara tiap gaya dibuat"
    hi: "हर शैली कैसे बनती है, समझाना"
  - en: "Discuss Australia's place in the drinks industry"
    zh: "讨论澳洲在酒类行业中的地位"
    zh-TW: "討論澳洲在酒類產業中的地位"
    ja: "酒類産業でのオーストラリアの位置を論じる"
    ko: "주류 산업 속 호주의 위치 논하기"
    vi: "Bàn về vị trí của Úc trong ngành đồ uống"
    ms: "Bincang kedudukan Australia dalam industri"
    id: "Membahas posisi Australia di industri minuman"
    hi: "पेय उद्योग में ऑस्ट्रेलिया की जगह पर चर्चा"
