code: FNCE90060
year: 2027
learn:
  en: "Core finance tools: discounted cash flows, financial maths, risk and return, and investment and financing decisions."
  zh: "核心金融工具：现金流折现、金融数学、风险与收益，以及投资和融资决策。"
  zh-TW: "核心財務工具：現金流量折現、財務數學、風險與報酬，以及投資與融資決策。"
  ja: "ファイナンスの基本ツール：DCF、金融数学、リスクとリターン、投資と資金調達の判断。"
  ko: "핵심 재무 도구: 현금흐름할인, 재무수학, 위험과 수익, 투자·자금조달 결정."
  vi: "Công cụ tài chính cốt lõi: chiết khấu dòng tiền, toán tài chính, rủi ro và lợi nhuận, quyết định đầu tư và huy động vốn."
  ms: "Alat kewangan teras: aliran tunai terdiskaun, matematik kewangan, risiko dan pulangan, keputusan pelaburan dan pembiayaan."
  id: "Alat keuangan inti: arus kas terdiskonto, matematika keuangan, risiko dan imbal hasil, keputusan investasi dan pendanaan."
  hi: "मुख्य वित्तीय उपकरण: डिस्काउंटेड कैश फ्लो, वित्तीय गणित, जोखिम-प्रतिफल, निवेश और वित्तपोषण निर्णय।"
outcomes:
  - en: "Value projects with discounted cash flows"
    zh: "用现金流折现评估项目"
    zh-TW: "用現金流量折現評估專案"
    ja: "DCFでプロジェクトを評価する"
    ko: "현금흐름할인으로 프로젝트 평가하기"
    vi: "Định giá dự án bằng chiết khấu dòng tiền"
    ms: "Menilai projek dengan aliran tunai terdiskaun"
    id: "Menilai proyek dengan arus kas terdiskonto"
    hi: "डिस्काउंटेड कैश फ्लो से परियोजनाओं का मूल्यांकन"
  - en: "Explain the link between risk and return"
    zh: "解释风险与收益的关系"
    zh-TW: "解釋風險與報酬的關係"
    ja: "リスクとリターンの関係を説明する"
    ko: "위험과 수익의 관계 설명하기"
    vi: "Giải thích mối quan hệ giữa rủi ro và lợi nhuận"
    ms: "Menerangkan hubungan risiko dan pulangan"
    id: "Menjelaskan hubungan risiko dan imbal hasil"
    hi: "जोखिम और प्रतिफल का संबंध समझाना"
