code: ITAL30007
year: 2026
learn:
  en: "Dante's Inferno read in Italian: its poetry, medieval ideas and lasting influence, ending in a group research project."
  zh: "用意大利语读但丁《地狱篇》：诗歌、中世纪思想和深远影响，最后做小组研究。"
  zh-TW: "用義大利語讀但丁《地獄篇》：詩歌、中世紀思想和深遠影響，最後做小組研究。"
  ja: "ダンテ『地獄篇』をイタリア語で読む。詩、中世の思想、後世への影響。最後にグループ研究。"
  ko: "단테의 「지옥편」을 이탈리아어로 읽는다. 시, 중세 사상, 오랜 영향. 마지막에 그룹 연구."
  vi: "Đọc Hỏa ngục của Dante bằng tiếng Ý: thơ, tư tưởng Trung cổ và ảnh hưởng lâu dài, kết thúc bằng dự án nhóm."
  ms: "Inferno karya Dante dibaca dalam bahasa Itali: puisi, idea zaman pertengahan dan pengaruhnya, diakhiri projek berkumpulan."
  id: "Inferno karya Dante dibaca dalam bahasa Italia: puisi, gagasan abad pertengahan dan pengaruhnya, diakhiri proyek kelompok."
  hi: "दांते का इन्फ़र्नो इतालवी में: उसकी कविता, मध्ययुगीन विचार और स्थायी असर, अंत में समूह शोध परियोजना।"
outcomes:
  - en: "Analyse the poetic language of the Inferno"
    zh: "分析《地狱篇》的诗歌语言"
    zh-TW: "分析《地獄篇》的詩歌語言"
    ja: "『地獄篇』の詩の言葉を分析する"
    ko: "「지옥편」의 시적 언어 분석하기"
    vi: "Phân tích ngôn ngữ thơ của Hỏa ngục"
    ms: "Analisis bahasa puisi dalam Inferno"
    id: "Menganalisis bahasa puitis Inferno"
    hi: "इन्फ़र्नो की काव्य-भाषा का विश्लेषण करना"
  - en: "Explain key medieval ideas behind the poem"
    zh: "解释诗中的中世纪核心观念"
    zh-TW: "解釋詩中的中世紀核心觀念"
    ja: "作品の背後にある中世の考え方を説明する"
    ko: "작품 속 중세 핵심 사상 설명하기"
    vi: "Giải thích các ý niệm Trung cổ chính trong tác phẩm"
    ms: "Terangkan idea utama zaman pertengahan di sebalik puisi"
    id: "Menjelaskan gagasan utama abad pertengahan di balik puisi"
    hi: "कविता के पीछे के मुख्य मध्ययुगीन विचार समझाना"
  - en: "Present a group research project in Italian"
    zh: "用意大利语展示小组研究项目"
    zh-TW: "用義大利語展示小組研究專題"
    ja: "グループ研究をイタリア語で発表する"
    ko: "그룹 연구를 이탈리아어로 발표하기"
    vi: "Trình bày dự án nghiên cứu nhóm bằng tiếng Ý"
    ms: "Bentangkan projek penyelidikan berkumpulan dalam bahasa Itali"
    id: "Mempresentasikan proyek riset kelompok dalam bahasa Italia"
    hi: "इतालवी में समूह शोध परियोजना प्रस्तुत करना"
