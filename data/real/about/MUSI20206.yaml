code: MUSI20206
year: 2026
learn:
  en: "How the music business works: copyright, contracts, marketing, touring, streaming and music in film, TV, games and ads."
  zh: 了解音乐产业如何运作：版权、合同、营销、巡演、流媒体及影视游戏广告配乐。
  zh-TW: 了解音樂產業如何運作：版權、合約、行銷、巡演、串流及影視遊戲廣告配樂。
  ja: 音楽ビジネスの仕組み：著作権、契約、マーケティング、ツアー、配信、映像・ゲーム・広告での音楽。
  ko: "음악 산업의 작동 방식: 저작권, 계약, 마케팅, 투어, 스트리밍, 영상·게임·광고 음악."
  vi: "Ngành kinh doanh âm nhạc: bản quyền, hợp đồng, marketing, lưu diễn, streaming, nhạc phim, game, quảng cáo."
  ms: "Cara industri muzik berfungsi: hak cipta, kontrak, pemasaran, jelajah, penstriman, muzik filem, TV dan iklan."
  id: "Cara bisnis musik bekerja: hak cipta, kontrak, pemasaran, tur, streaming, musik di film, TV, gim, iklan."
  hi: "संगीत उद्योग कैसे चलता है: कॉपीराइट, अनुबंध, मार्केटिंग, टूर, स्ट्रीमिंग, फ़िल्म-गेम-विज्ञापन में संगीत।"
outcomes:
  - en: Explain copyright and music rights
    zh: 解释版权和音乐权利
    zh-TW: 解釋版權與音樂權利
    ja: 著作権と音楽の権利を説明する
    ko: 저작권과 음악 권리 설명하기
    vi: Giải thích bản quyền âm nhạc
    ms: Terangkan hak cipta dan hak muzik
    id: Menjelaskan hak cipta dan hak musik
    hi: कॉपीराइट और संगीत अधिकार समझाना
  - en: Understand music industry deals
    zh: 理解音乐产业的合约交易
    zh-TW: 理解音樂產業的合約交易
    ja: 音楽業界の契約を理解する
    ko: 음악 업계 계약 이해하기
    vi: Hiểu các thỏa thuận trong ngành nhạc
    ms: Fahami perjanjian industri muzik
    id: Memahami kesepakatan industri musik
    hi: संगीत उद्योग के सौदे समझना
  - en: Write about a music business issue
    zh: 撰写音乐商业议题文章
    zh-TW: 撰寫音樂商業議題文章
    ja: 音楽ビジネスの課題について書く
    ko: 음악 비즈니스 이슈에 대해 글쓰기
    vi: Viết về một vấn đề kinh doanh âm nhạc
    ms: Tulis tentang isu perniagaan muzik
    id: Menulis tentang isu bisnis musik
    hi: संगीत व्यवसाय के मुद्दे पर लिखना
