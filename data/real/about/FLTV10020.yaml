code: FLTV10020
year: 2026
learn:
  en: "Animation meets science and art: data visualisation, motion graphics and animation for galleries and museums."
  zh: "动画结合科学与艺术：数据可视化、动态图形，以及为美术馆与博物馆做动画。"
  zh-TW: "動畫結合科學與藝術：資料視覺化、動態圖像，以及為美術館與博物館做動畫。"
  ja: "アニメと科学・芸術：データ可視化、モーショングラフィックス、美術館・博物館向けのアニメ。"
  ko: "애니메이션과 과학·예술: 데이터 시각화, 모션 그래픽, 갤러리·박물관용 애니메이션."
  vi: "Hoạt hình gặp khoa học và nghệ thuật: trực quan hóa dữ liệu, đồ họa chuyển động, hoạt hình cho bảo tàng."
  ms: "Animasi bertemu sains dan seni: visualisasi data, grafik gerak dan animasi untuk galeri serta muzium."
  id: "Animasi bertemu sains dan seni: visualisasi data, grafis gerak dan animasi untuk galeri dan museum."
  hi: "एनिमेशन, विज्ञान और कला: डेटा विज़ुअलाइज़ेशन, मोशन ग्राफ़िक्स और गैलरी-म्यूज़ियम के लिए एनिमेशन।"
outcomes:
  - en: "Turn information into motion graphics"
    zh: "把信息做成动态图形"
    zh-TW: "把資訊做成動態圖像"
    ja: "情報をモーショングラフィックスにする"
    ko: "정보를 모션 그래픽으로 만들기"
    vi: "Biến thông tin thành đồ họa chuyển động"
    ms: "Jadikan maklumat grafik gerak"
    id: "Mengubah informasi menjadi grafis gerak"
    hi: "जानकारी को मोशन ग्राफ़िक्स में बदलना"
  - en: "Try experimental animation methods"
    zh: "尝试实验性动画方法"
    zh-TW: "嘗試實驗性動畫方法"
    ja: "実験的なアニメ手法を試す"
    ko: "실험적 애니메이션 기법 시도하기"
    vi: "Thử phương pháp hoạt hình thể nghiệm"
    ms: "Cuba kaedah animasi eksperimental"
    id: "Mencoba metode animasi eksperimental"
    hi: "प्रायोगिक एनिमेशन तरीक़े आज़माना"
  - en: "Design an animation for an exhibition"
    zh: "为展览设计动画"
    zh-TW: "為展覽設計動畫"
    ja: "展示用のアニメをデザインする"
    ko: "전시용 애니메이션 디자인하기"
    vi: "Thiết kế hoạt hình cho triển lãm"
    ms: "Reka animasi untuk pameran"
    id: "Merancang animasi untuk pameran"
    hi: "प्रदर्शनी के लिए एनिमेशन डिज़ाइन करना"
