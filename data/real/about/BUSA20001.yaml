code: BUSA20001
year: 2026
learn:
  en: "Cleaning, combining and presenting business data so it can support decisions."
  zh: "清理、整合和展示商业数据，让数据能支持决策。"
  zh-TW: "清理、整合和呈現商業資料，讓資料能支援決策。"
  ja: "ビジネスデータを整え、結合し、見せ方を工夫して意思決定に役立てる。"
  ko: "비즈니스 데이터를 정리·결합·시각화해 의사결정에 활용하는 법."
  vi: "Làm sạch, kết hợp và trình bày dữ liệu kinh doanh để hỗ trợ ra quyết định."
  ms: "Membersih, menggabung dan membentangkan data perniagaan supaya membantu keputusan."
  id: "Membersihkan, menggabungkan, dan menyajikan data bisnis agar bisa mendukung keputusan."
  hi: "बिज़नेस डेटा को साफ़ करना, जोड़ना और ऐसे दिखाना कि वह फ़ैसलों में मदद करे।"
outcomes:
  - en: "Handle messy data such as dates and text"
    zh: "处理日期、文本等杂乱数据"
    zh-TW: "處理日期、文字等雜亂資料"
    ja: "日付やテキストなど扱いにくいデータを処理する"
    ko: "날짜·텍스트 같은 지저분한 데이터 다루기"
    vi: "Xử lý dữ liệu lộn xộn như ngày tháng và văn bản"
    ms: "Urus data bersepah seperti tarikh dan teks"
    id: "Mengolah data berantakan seperti tanggal dan teks"
    hi: "तारीख़ और टेक्स्ट जैसे बिखरे डेटा को संभालना"
  - en: "Combine data from several sources"
    zh: "整合来自多个来源的数据"
    zh-TW: "整合來自多個來源的資料"
    ja: "複数のソースからデータをまとめる"
    ko: "여러 출처의 데이터 결합하기"
    vi: "Kết hợp dữ liệu từ nhiều nguồn"
    ms: "Gabung data daripada beberapa sumber"
    id: "Menggabungkan data dari beberapa sumber"
    hi: "कई स्रोतों से डेटा जोड़ना"
  - en: "Choose useful metrics and present them clearly"
    zh: "选择有用的指标并清晰展示"
    zh-TW: "選擇有用的指標並清楚呈現"
    ja: "役立つ指標を選び、分かりやすく示す"
    ko: "유용한 지표를 골라 명확히 보여주기"
    vi: "Chọn chỉ số hữu ích và trình bày rõ ràng"
    ms: "Pilih metrik berguna dan bentangkan dengan jelas"
    id: "Memilih metrik yang berguna dan menyajikannya dengan jelas"
    hi: "उपयोगी मेट्रिक चुनना और उन्हें साफ़ दिखाना"
