code: PHRM30008
year: 2026
learn:
  en: "How a new drug goes from finding a target, through testing and clinical trials, to reaching the market."
  zh: "新药从找靶点、测试、临床试验到上市的全过程。"
outcomes:
  - en: "Describe the main steps of drug discovery and development"
    zh: "说清新药研发的主要步骤"
  - en: "Explain the science behind choosing and testing a drug"
    zh: "解释选药和测药背后的药理"
  - en: "Combine and judge information from many sources"
    zh: "整合并评判多种来源的信息"
