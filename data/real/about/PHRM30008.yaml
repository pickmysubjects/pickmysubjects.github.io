code: PHRM30008
year: 2026
learn:
  en: "How a new drug goes from finding a target, through testing and clinical trials, to reaching the market."
  zh: "新药从找靶点、测试、临床试验到上市的全过程。"
  zh-TW: "新藥從找標靶、測試、臨床試驗到上市的全過程。"
  ja: "新薬が標的の発見から試験、臨床試験を経て市場に出るまで。"
  ko: "신약이 표적 발굴부터 시험, 임상시험을 거쳐 출시되기까지."
  vi: "Hành trình thuốc mới từ tìm đích, thử nghiệm, thử lâm sàng đến ra thị trường."
  ms: "Perjalanan ubat baharu daripada mencari sasaran, ujian dan ujian klinikal hingga ke pasaran."
  id: "Perjalanan obat baru dari mencari target, pengujian, uji klinis, hingga ke pasar."
  hi: "नई दवा का सफ़र: टारगेट ढूँढने, टेस्टिंग और क्लिनिकल ट्रायल से बाज़ार तक।"
outcomes:
  - en: "Describe the main steps of drug discovery and development"
    zh: "说清新药研发的主要步骤"
    zh-TW: "說清新藥研發的主要步驟"
    ja: "創薬と開発の主な段階を説明する"
    ko: "신약 발굴과 개발의 주요 단계 설명"
    vi: "Mô tả các bước chính của nghiên cứu và phát triển thuốc"
    ms: "Huraikan langkah utama penemuan dan pembangunan ubat"
    id: "Menjelaskan tahap utama penemuan dan pengembangan obat"
    hi: "दवा की खोज और विकास के मुख्य चरण बताना"
  - en: "Explain the science behind choosing and testing a drug"
    zh: "解释选药和测药背后的药理"
    zh-TW: "解釋選藥和測藥背後的科學"
    ja: "薬を選び試験する背景にある科学を説明する"
    ko: "약물 선택과 시험의 과학적 근거 설명"
    vi: "Giải thích khoa học đằng sau việc chọn và thử thuốc"
    ms: "Terangkan sains di sebalik memilih dan menguji ubat"
    id: "Menjelaskan sains di balik memilih dan menguji obat"
    hi: "दवा चुनने और टेस्ट करने के पीछे का विज्ञान समझाना"
  - en: "Combine and judge information from many sources"
    zh: "整合并评判多种来源的信息"
    zh-TW: "整合並評判多種來源的資訊"
    ja: "多くの情報源をまとめて評価する"
    ko: "여러 출처의 정보를 종합하고 판단"
    vi: "Tổng hợp và đánh giá thông tin từ nhiều nguồn"
    ms: "Gabung dan nilai maklumat daripada banyak sumber"
    id: "Menggabungkan dan menilai informasi dari banyak sumber"
    hi: "कई स्रोतों की जानकारी जोड़ना और परखना"
