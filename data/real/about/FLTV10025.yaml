code: FLTV10025
year: 2026
learn:
  en: "Screenwriting basics: story ideas, structure and character; analyse other writers' work and write your own short script."
  zh: "编剧入门：故事构思、结构与角色；分析他人作品并写自己的短剧本。"
  zh-TW: "編劇入門：故事構思、結構與角色；分析他人作品並寫自己的短劇本。"
  ja: "脚本の基礎：着想・構成・人物。他の作品を分析し、自分の短編脚本を書く。"
  ko: "시나리오 기초: 이야기 구상, 구조, 인물. 다른 작가의 작품을 분석하고 단편 각본을 쓴다."
  vi: "Cơ bản biên kịch: ý tưởng, cấu trúc, nhân vật; phân tích tác phẩm khác và viết kịch bản ngắn."
  ms: "Asas penulisan skrip: idea cerita, struktur dan watak; analisis karya lain dan tulis skrip pendek."
  id: "Dasar penulisan skenario: ide cerita, struktur, tokoh; analisis karya lain dan tulis naskah pendek."
  hi: "पटकथा की बुनियाद: कहानी, संरचना और किरदार; दूसरों के काम का विश्लेषण और अपनी छोटी स्क्रिप्ट।"
outcomes:
  - en: "Shape a story with screenplay structure"
    zh: "用剧本结构组织故事"
    zh-TW: "用劇本結構組織故事"
    ja: "脚本の構成で物語を組み立てる"
    ko: "시나리오 구조로 이야기 짜기"
    vi: "Dựng câu chuyện theo cấu trúc kịch bản"
    ms: "Bentuk cerita dengan struktur lakon layar"
    id: "Membentuk cerita dengan struktur skenario"
    hi: "पटकथा संरचना से कहानी गढ़ना"
  - en: "Pitch and develop a script with feedback"
    zh: "展示剧本并根据反馈修改"
    zh-TW: "展示劇本並根據回饋修改"
    ja: "脚本を発表し意見で練る"
    ko: "각본을 발표하고 피드백으로 다듬기"
    vi: "Trình bày và phát triển kịch bản theo góp ý"
    ms: "Bentang dan kembangkan skrip dengan maklum balas"
    id: "Mempresentasikan dan mengembangkan naskah"
    hi: "फ़ीडबैक के साथ स्क्रिप्ट पेश करना और सुधारना"
  - en: "Write a 10-to-12-page short screenplay"
    zh: "写一部 10-12 页的短剧本"
    zh-TW: "寫一部 10-12 頁的短劇本"
    ja: "10〜12ページの短編脚本を書く"
    ko: "10~12쪽 단편 각본 쓰기"
    vi: "Viết kịch bản ngắn 10-12 trang"
    ms: "Tulis lakon layar pendek 10-12 halaman"
    id: "Menulis skenario pendek 10-12 halaman"
    hi: "10-12 पेज की छोटी पटकथा लिखना"
