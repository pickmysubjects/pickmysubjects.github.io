code: SWEN30007
year: 2026
learn:
  en: "Building a real software system in a team for a client: requirements, design, coding, testing and managing it."
  zh: "团队为客户开发真实软件：需求、设计、编码、测试和管理"
  zh-TW: "團隊為客戶開發真實軟體：需求、設計、寫程式、測試與管理"
  ja: "チームで顧客向けの実際のソフトを作る：要件、設計、実装、テスト、管理。"
  ko: "팀으로 고객용 실제 소프트웨어 개발: 요구사항, 설계, 구현, 테스트, 관리."
  vi: "Làm phần mềm thật theo nhóm cho khách hàng: yêu cầu, thiết kế, lập trình, kiểm thử và quản lý."
  ms: "Membina sistem perisian sebenar secara berpasukan untuk klien: keperluan, reka bentuk, kod, ujian dan pengurusan."
  id: "Membangun sistem perangkat lunak nyata dalam tim untuk klien: kebutuhan, desain, kode, uji, dan manajemen."
  hi: "टीम में क्लाइंट के लिए असली सॉफ़्टवेयर बनाना: आवश्यकताएँ, डिज़ाइन, कोडिंग, टेस्टिंग और प्रबंधन।"
outcomes:
  - en: "Analyse, design, build and test a software system"
    zh: "分析、设计、实现并测试软件系统"
    zh-TW: "分析、設計、實作並測試軟體系統"
    ja: "ソフトを分析・設計・実装・テストする"
    ko: "소프트웨어 분석·설계·구현·테스트하기"
    vi: "Phân tích, thiết kế, xây dựng, kiểm thử phần mềm"
    ms: "Menganalisis, mereka, membina dan menguji perisian"
    id: "Menganalisis, merancang, membangun, menguji perangkat lunak"
    hi: "सॉफ़्टवेयर का विश्लेषण, डिज़ाइन, निर्माण और टेस्ट"
  - en: "Run a repeatable team development process"
    zh: "执行可重复的团队开发流程"
    zh-TW: "執行可重複的團隊開發流程"
    ja: "再現可能なチーム開発プロセスを回す"
    ko: "반복 가능한 팀 개발 프로세스 운영하기"
    vi: "Vận hành quy trình phát triển nhóm lặp lại được"
    ms: "Menjalankan proses pembangunan pasukan yang berulang"
    id: "Menjalankan proses pengembangan tim yang berulang"
    hi: "दोहराने योग्य टीम विकास प्रक्रिया चलाना"
  - en: "Communicate with clients and engineers"
    zh: "与客户和工程师有效沟通"
    zh-TW: "與客戶和工程師有效溝通"
    ja: "顧客やエンジニアと意思疎通する"
    ko: "고객·엔지니어와 소통하기"
    vi: "Giao tiếp với khách hàng và kỹ sư"
    ms: "Berkomunikasi dengan klien dan jurutera"
    id: "Berkomunikasi dengan klien dan insinyur"
    hi: "क्लाइंट और इंजीनियरों से संवाद करना"
