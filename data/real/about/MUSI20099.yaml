code: MUSI20099
year: 2026
learn:
  en: "Piano duo and four-hands duet technique and repertoire, from the 1700s to today. Audition needed; graded pass/fail."
  zh: "钢琴双钢琴与四手联弹技巧及曲目，18世纪至今；需试音，通过/不通过。"
  zh-TW: "鋼琴雙鋼琴與四手聯彈技巧及曲目，18世紀至今；需試音，通過/不通過。"
  ja: "ピアノ・デュオと連弾の技術とレパートリー（18世紀〜現代）。要オーディション、合否評価。"
  ko: "피아노 듀오·연탄 기법과 레퍼토리(18세기~현대). 오디션, 통과/불통과."
  vi: "Kỹ thuật và tác phẩm song tấu, bốn tay piano từ thế kỷ 18. Cần thử giọng; đạt/không."
  ms: "Teknik dan repertoir duo piano dan empat tangan, abad ke-18 hingga kini. Uji bakat; lulus/gagal."
  id: "Teknik dan repertoar duo piano dan empat tangan, abad ke-18 hingga kini. Audisi; lulus/tidak."
  hi: "पियानो ड्युओ और चार-हाथ डुएट की तकनीक और रचनाएँ, 1700 से आज तक। ऑडिशन; पास/फ़ेल।"
outcomes:
  - en: "Share a keyboard: pedalling, balance and coordination"
    zh: "共用琴键：踏板、平衡与配合"
    zh-TW: "共用琴鍵：踏板、平衡與配合"
    ja: "連弾でのペダル・バランス・連携"
    ko: "한 건반 공유: 페달, 균형, 호흡"
    vi: "Chia phím: pedal, cân bằng và phối hợp"
    ms: "Kongsi papan kekunci: pedal, imbangan, koordinasi"
    id: "Berbagi keyboard: pedal, keseimbangan, koordinasi"
    hi: "एक कीबोर्ड साझा करना: पैडल, संतुलन, तालमेल"
  - en: "Learn duo and duet works from several eras"
    zh: "学习多个时期的双钢琴与联弹作品"
    zh-TW: "學習多個時期的雙鋼琴與聯彈作品"
    ja: "様々な時代のデュオ・連弾曲を学ぶ"
    ko: "여러 시대의 듀오·연탄곡 익히기"
    vi: "Học tác phẩm song tấu từ nhiều thời kỳ"
    ms: "Pelajari karya duo dari pelbagai era"
    id: "Mempelajari karya duo dari berbagai era"
    hi: "कई दौर की ड्युओ रचनाएँ सीखना"
  - en: "Perform in public concerts as part of the ensemble"
    zh: "随乐团参加公开演出"
    zh-TW: "隨樂團參加公開演出"
    ja: "アンサンブルの一員として公演に出る"
    ko: "앙상블 일원으로 공개 공연하기"
    vi: "Biểu diễn trước khán giả cùng dàn nhạc"
    ms: "Membuat persembahan awam bersama ensembel"
    id: "Tampil di konser publik bersama ansambel"
    hi: "समूह के साथ सार्वजनिक कॉन्सर्ट में प्रस्तुति देना"
