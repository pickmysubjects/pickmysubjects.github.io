code: SWEN90009
year: 2027
learn:
  en: "Software requirements: domain and business analysis, eliciting, modelling and specifying requirements."
  zh: "软件需求：领域与业务分析、需求获取、建模与需求规格说明。"
  zh-TW: "軟體需求：領域與業務分析、需求擷取、建模與需求規格。"
  ja: "ソフトウェア要求：ドメイン・業務分析、要求の引き出し、モデリング、仕様化。"
  ko: "소프트웨어 요구사항: 도메인·비즈니스 분석, 요구 도출, 모델링, 명세."
  vi: "Yêu cầu phần mềm: phân tích nghiệp vụ và miền, thu thập, mô hình hóa, đặc tả yêu cầu."
  ms: "Keperluan perisian: analisis domain dan perniagaan, mendapatkan, memodel dan menspesifikasi keperluan."
  id: "Kebutuhan perangkat lunak: analisis domain dan bisnis, penggalian, pemodelan, spesifikasi kebutuhan."
  hi: "सॉफ़्टवेयर आवश्यकताएँ: डोमेन और व्यावसायिक विश्लेषण, आवश्यकताएँ जुटाना, मॉडलिंग, विनिर्देश।"
outcomes:
  - en: "Gather requirements from stakeholders on a real project"
    zh: "在真实项目中向相关方收集需求"
    zh-TW: "在真實專案中向利害關係人蒐集需求"
    ja: "実際のプロジェクトで関係者から要求を集める"
    ko: "실제 프로젝트에서 이해관계자 요구 수집하기"
    vi: "Thu thập yêu cầu từ các bên trong dự án thật"
    ms: "Mengumpul keperluan daripada pihak berkepentingan dalam projek sebenar"
    id: "Mengumpulkan kebutuhan dari pemangku kepentingan di proyek nyata"
    hi: "असली प्रोजेक्ट में हितधारकों से आवश्यकताएँ जुटाना"
  - en: "Write a clear, checkable requirements specification"
    zh: "写出清楚、可检验的需求规格"
    zh-TW: "寫出清楚、可檢驗的需求規格"
    ja: "明確で検証できる要求仕様を書く"
    ko: "명확하고 검증 가능한 요구 명세 작성하기"
    vi: "Viết bản đặc tả yêu cầu rõ ràng, kiểm tra được"
    ms: "Menulis spesifikasi keperluan yang jelas dan boleh disemak"
    id: "Menulis spesifikasi kebutuhan yang jelas dan dapat diperiksa"
    hi: "साफ़ और जाँचने योग्य आवश्यकता विनिर्देश लिखना"
