code: MECM20015
year: 2026
learn:
  en: "How advertising works in today's media and what it does to society, from consumerism and data-driven ads to rules protecting children."
  zh: "广告在当今媒体中如何运作、对社会有什么影响，从消费主义、数据驱动广告到保护儿童的规定。"
  zh-TW: "廣告在當今媒體中如何運作、對社會有什麼影響，從消費主義、數據驅動廣告到保護兒童的規定。"
  ja: "今のメディアで広告がどう働き、社会に何をもたらすのかを、消費主義やデータ広告から子どもを守るルールまで学ぶ。"
  ko: "오늘날 미디어에서 광고가 어떻게 작동하고 사회에 어떤 영향을 주는지 소비주의, 데이터 기반 광고, 아동 보호 규제까지 다룬다."
  vi: "Quảng cáo vận hành thế nào trong truyền thông hiện nay và tác động gì đến xã hội, từ chủ nghĩa tiêu dùng, quảng cáo dựa trên dữ liệu đến quy định bảo vệ trẻ em."
  ms: "Cara pengiklanan berfungsi dalam media hari ini dan kesannya kepada masyarakat, dari kepenggunaan dan iklan berasaskan data hingga peraturan melindungi kanak-kanak."
  id: "Cara iklan bekerja di media masa kini dan dampaknya bagi masyarakat, dari konsumerisme dan iklan berbasis data hingga aturan perlindungan anak."
  hi: "आज के मीडिया में विज्ञापन कैसे काम करता है और समाज पर क्या असर डालता है, उपभोक्तावाद और डेटा-आधारित विज्ञापन से बच्चों की सुरक्षा के नियमों तक।"
outcomes:
  - en: "Lay out the main debates about advertising"
    zh: "梳理关于广告的主要争论"
    zh-TW: "梳理關於廣告的主要爭論"
    ja: "広告をめぐる主な論争を整理する"
    ko: "광고를 둘러싼 주요 논쟁 정리하기"
    vi: "Trình bày các tranh luận chính về quảng cáo"
    ms: "Huraikan perdebatan utama tentang pengiklanan"
    id: "Memetakan perdebatan utama soal iklan"
    hi: "विज्ञापन से जुड़ी मुख्य बहसें सामने रखना"
  - en: "Analyse the economic and tech forces changing advertising"
    zh: "分析改变广告业的经济和技术力量"
    zh-TW: "分析改變廣告業的經濟和技術力量"
    ja: "広告を変える経済と技術の力を分析する"
    ko: "광고를 바꾸는 경제적·기술적 요인 분석하기"
    vi: "Phân tích các lực kinh tế và công nghệ đang thay đổi quảng cáo"
    ms: "Analisis kuasa ekonomi dan teknologi yang mengubah pengiklanan"
    id: "Menganalisis faktor ekonomi dan teknologi yang mengubah iklan"
    hi: "विज्ञापन को बदलने वाली आर्थिक और तकनीकी ताकतों का विश्लेषण करना"
  - en: "Judge ad practices and suggest better ones"
    zh: "评判广告做法并提出改进建议"
    zh-TW: "評判廣告做法並提出改進建議"
    ja: "広告の手法を評価し改善案を出す"
    ko: "광고 관행을 평가하고 개선안 제시하기"
    vi: "Đánh giá cách làm quảng cáo và đề xuất cải thiện"
    ms: "Nilai amalan iklan dan cadangkan penambahbaikan"
    id: "Menilai praktik iklan dan mengusulkan perbaikan"
    hi: "विज्ञापन के तरीकों को परखना और बेहतर सुझाव देना"
