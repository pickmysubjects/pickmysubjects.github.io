code: MKTG90049
year: 2027
learn:
  en: "Marketing's role in issues like climate change, privacy and obesity, and whether ethical consumption can help."
  zh: "营销在气候变化、隐私和肥胖等问题中的角色，以及道德消费能否带来改变。"
  zh-TW: "行銷在氣候變遷、隱私與肥胖等問題中的角色，以及道德消費能否帶來改變。"
  ja: "気候変動・プライバシー・肥満などでのマーケティングの役割と、倫理的消費に意味があるか。"
  ko: "기후변화, 개인정보, 비만 같은 문제에서 마케팅의 역할과 윤리적 소비의 효과."
  vi: "Vai trò của marketing trong biến đổi khí hậu, quyền riêng tư, béo phì, và tiêu dùng có đạo đức có giúp được không."
  ms: "Peranan pemasaran dalam isu seperti perubahan iklim, privasi dan obesiti, serta sama ada penggunaan beretika membantu."
  id: "Peran pemasaran dalam isu seperti perubahan iklim, privasi dan obesitas, serta apakah konsumsi etis membantu."
  hi: "जलवायु परिवर्तन, निजता और मोटापे जैसे मुद्दों में मार्केटिंग की भूमिका, और क्या नैतिक उपभोग मदद करता है।"
outcomes:
  - en: "Evaluate marketers' social responsibilities"
    zh: "评价营销人员的社会责任"
    zh-TW: "評價行銷人員的社會責任"
    ja: "マーケターの社会的責任を評価する"
    ko: "마케터의 사회적 책임 평가하기"
    vi: "Đánh giá trách nhiệm xã hội của người làm marketing"
    ms: "Menilai tanggungjawab sosial pemasar"
    id: "Menilai tanggung jawab sosial pemasar"
    hi: "मार्केटर्स की सामाजिक ज़िम्मेदारियों का मूल्यांकन करना"
  - en: "Apply sustainability frameworks to cases"
    zh: "将可持续框架用于案例"
    zh-TW: "將永續架構應用於個案"
    ja: "持続可能性の枠組みを事例に当てはめる"
    ko: "지속가능성 프레임워크를 사례에 적용하기"
    vi: "Áp dụng khung bền vững vào tình huống"
    ms: "Menggunakan rangka kelestarian pada kes"
    id: "Menerapkan kerangka keberlanjutan pada kasus"
    hi: "स्थिरता के ढाँचे केस पर लागू करना"
