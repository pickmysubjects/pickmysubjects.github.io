code: SPAN30014
year: 2026
learn:
  en: "Spanish for students who finished Spanish 4: reading real texts and discussing social and cultural topics."
  zh: "适合学完西班牙语 4的学生：阅读真实材料，讨论社会和文化话题。"
  zh-TW: "適合學完西班牙語 4的學生：閱讀真實材料，討論社會和文化話題。"
  ja: "スペイン語4を終えた学生向け。生の文章を読み、社会や文化の話題を話し合う。"
  ko: "스페인어 4을(를) 마친 학생 대상. 실제 자료를 읽고 사회·문화 주제를 토론한다."
  vi: "tiếng Tây Ban Nha cho sinh viên đã học xong tiếng Tây Ban Nha 4: đọc tài liệu thật và thảo luận chủ đề xã hội, văn hóa."
  ms: "bahasa Sepanyol untuk pelajar yang sudah tamat bahasa Sepanyol 4: membaca teks sebenar dan membincangkan topik sosial dan budaya."
  id: "bahasa Spanyol untuk mahasiswa yang sudah lulus bahasa Spanyol 4: membaca teks asli dan membahas topik sosial dan budaya."
  hi: "स्पेनिश 4 पूरा कर चुके छात्रों के लिए स्पेनिश: असली पाठ पढ़ना और सामाजिक व सांस्कृतिक विषयों पर चर्चा।"
outcomes:
  - en: "Discuss social and cultural topics in Spanish"
    zh: "用西班牙语讨论社会和文化话题"
    zh-TW: "用西班牙語討論社會和文化話題"
    ja: "社会や文化の話題をスペイン語で話し合う"
    ko: "사회·문화 주제를 스페인어로 토론하기"
    vi: "Thảo luận chủ đề xã hội, văn hóa bằng tiếng Tây Ban Nha"
    ms: "Bincangkan topik sosial dan budaya dalam bahasa Sepanyol"
    id: "Membahas topik sosial dan budaya dalam bahasa Spanyol"
    hi: "सामाजिक और सांस्कृतिक विषयों पर स्पेनिश में चर्चा करना"
  - en: "Read and write longer Spanish texts"
    zh: "读写较长的西班牙语文章"
    zh-TW: "讀寫較長的西班牙語文章"
    ja: "長めのスペイン語の文章を読み書きする"
    ko: "긴 스페인어 글 읽고 쓰기"
    vi: "Đọc và viết văn bản tiếng Tây Ban Nha dài hơn"
    ms: "Baca dan tulis teks bahasa Sepanyol yang lebih panjang"
    id: "Membaca dan menulis teks bahasa Spanyol yang lebih panjang"
    hi: "लंबे स्पेनिश पाठ पढ़ना-लिखना"
  - en: "Give a clear presentation in Spanish"
    zh: "用西班牙语做清楚的口头报告"
    zh-TW: "用西班牙語做清楚的口頭報告"
    ja: "スペイン語で分かりやすく発表する"
    ko: "스페인어로 명확하게 발표하기"
    vi: "Thuyết trình rõ ràng bằng tiếng Tây Ban Nha"
    ms: "Buat pembentangan yang jelas dalam bahasa Sepanyol"
    id: "Melakukan presentasi yang jelas dalam bahasa Spanyol"
    hi: "स्पेनिश में स्पष्ट प्रस्तुति देना"
