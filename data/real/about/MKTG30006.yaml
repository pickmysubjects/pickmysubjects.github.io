code: MKTG30006
year: 2026
learn:
  en: "How retailers plan strategy across stores and online channels, from location and pricing to the store itself."
  zh: "零售商如何在门店和线上渠道制定策略，从选址、定价到门店本身。"
  zh-TW: "零售商如何在門市和線上通路擬定策略，從選址、定價到門市本身。"
  ja: "小売業が店舗とオンラインをまたいで戦略を立てる方法。立地や価格から店づくりまで。"
  ko: "소매업체가 매장과 온라인을 아우르는 전략을 세우는 법: 입지, 가격, 매장까지."
  vi: "Nhà bán lẻ lập chiến lược trên cửa hàng và kênh online ra sao, từ vị trí, giá đến chính cửa hàng."
  ms: "Cara peruncit merancang strategi di kedai dan saluran dalam talian, dari lokasi dan harga hingga kedai itu sendiri."
  id: "Cara peritel menyusun strategi di toko dan kanal online, dari lokasi dan harga hingga tokonya sendiri."
  hi: "रिटेलर दुकान और ऑनलाइन चैनलों में रणनीति कैसे बनाते हैं, लोकेशन और कीमत से लेकर दुकान तक।"
outcomes:
  - en: "Design an omnichannel retail experience"
    zh: "设计全渠道零售体验"
    zh-TW: "設計全通路零售體驗"
    ja: "オムニチャネルの小売体験を設計する"
    ko: "옴니채널 소매 경험 설계하기"
    vi: "Thiết kế trải nghiệm bán lẻ đa kênh"
    ms: "Reka pengalaman runcit omnisaluran"
    id: "Merancang pengalaman ritel omnichannel"
    hi: "ओमनीचैनल रिटेल अनुभव डिज़ाइन करना"
  - en: "Use the retail mix to improve competitiveness"
    zh: "用零售组合提升竞争力"
    zh-TW: "用零售組合提升競爭力"
    ja: "小売ミックスを使って競争力を高める"
    ko: "리테일 믹스로 경쟁력 높이기"
    vi: "Dùng retail mix để tăng sức cạnh tranh"
    ms: "Guna campuran runcit untuk tingkatkan daya saing"
    id: "Memakai bauran ritel untuk meningkatkan daya saing"
    hi: "रिटेल मिक्स से प्रतिस्पर्धा बढ़ाना"
  - en: "Factor sustainability into retail decisions"
    zh: "在零售决策中考虑可持续性"
    zh-TW: "在零售決策中考量永續性"
    ja: "小売の判断に持続可能性を組み込む"
    ko: "소매 의사결정에 지속가능성 반영하기"
    vi: "Tính đến tính bền vững trong quyết định bán lẻ"
    ms: "Ambil kira kelestarian dalam keputusan runcit"
    id: "Memperhitungkan keberlanjutan dalam keputusan ritel"
    hi: "रिटेल फ़ैसलों में सस्टेनेबिलिटी का ध्यान रखना"
