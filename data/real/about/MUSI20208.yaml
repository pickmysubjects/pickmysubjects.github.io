code: MUSI20208
year: 2026
learn:
  en: "Online: make electronic dance music, from remixing a track to building a folio of your own EDM productions."
  zh: "线上课：制作电子舞曲，从混音改编到完成自己的作品集。"
  zh-TW: "線上課：製作電子舞曲，從混音改編到完成自己的作品集。"
  ja: "オンライン：EDM制作。リミックスから自作曲のフォリオまで。"
  ko: "온라인: EDM 제작. 리믹스부터 자작곡 포트폴리오까지."
  vi: "Trực tuyến: làm nhạc EDM, từ remix đến bộ sưu tập sản phẩm của riêng bạn."
  ms: "Dalam talian: hasilkan muzik tarian elektronik, dari remiks hingga folio karya sendiri."
  id: "Daring: membuat musik EDM, dari remix hingga folio karya sendiri."
  hi: "ऑनलाइन: इलेक्ट्रॉनिक डांस म्यूज़िक बनाना, रीमिक्स से अपने प्रोडक्शन फ़ोलियो तक।"
outcomes:
  - en: "Remix a track into something clearly new"
    zh: "把一首歌重新混音成新作品"
    zh-TW: "把一首歌重新混音成新作品"
    ja: "曲を大きく変えてリミックスする"
    ko: "곡을 새롭게 리믹스하기"
    vi: "Remix một bài thành bản mới hẳn"
    ms: "Remiks trek menjadi sesuatu yang baharu"
    id: "Me-remix lagu menjadi karya yang baru"
    hi: "किसी ट्रैक को नए रूप में रीमिक्स करना"
  - en: "Record, edit and mix audio in a DAW"
    zh: "在数字音频工作站中录音、剪辑与混音"
    zh-TW: "在數位音訊工作站中錄音、剪輯與混音"
    ja: "DAWで録音・編集・ミックスする"
    ko: "DAW에서 녹음·편집·믹싱하기"
    vi: "Thu, chỉnh sửa và mix âm thanh trên DAW"
    ms: "Rakam, sunting dan campur audio dalam DAW"
    id: "Merekam, mengedit, dan mixing audio di DAW"
    hi: "DAW में ऑडियो रिकॉर्ड, एडिट और मिक्स करना"
  - en: "Explain the choices behind your finished tracks"
    zh: "说明作品背后的制作思路"
    zh-TW: "說明作品背後的製作思路"
    ja: "完成した曲の制作意図を説明する"
    ko: "완성곡의 제작 의도 설명하기"
    vi: "Giải thích lựa chọn trong bản nhạc đã hoàn thành"
    ms: "Terangkan pilihan di sebalik trek siap anda"
    id: "Menjelaskan alasan di balik lagu yang selesai"
    hi: "तैयार ट्रैक के पीछे के फ़ैसले समझाना"
