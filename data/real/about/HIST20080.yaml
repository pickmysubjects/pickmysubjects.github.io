code: HIST20080
year: 2026
learn:
  en: "Why tens of thousands were executed for witchcraft in Europe from about 1350 to 1700, and why the trials stopped."
  zh: "约1350至1700年间，欧洲为何有数万人因巫术被处决，审判又为何停止。"
  zh-TW: "約1350至1700年間，歐洲為何有數萬人因巫術被處決，審判又為何停止。"
  ja: "1350年頃から1700年頃のヨーロッパで、なぜ数万人が魔女として処刑され、なぜ裁判は止んだのかを学ぶ。"
  ko: "약 1350년부터 1700년 사이 유럽에서 왜 수만 명이 마녀로 처형됐고, 왜 재판이 멈췄는지 배운다."
  vi: "Vì sao hàng chục nghìn người bị xử tử vì tội phù thủy ở châu Âu khoảng 1350–1700, và vì sao các phiên xử chấm dứt."
  ms: "Mengapa puluhan ribu orang dihukum mati kerana sihir di Eropah sekitar 1350–1700, dan mengapa perbicaraan berhenti."
  id: "Mengapa puluhan ribu orang dihukum mati karena sihir di Eropa sekitar 1350–1700, dan mengapa pengadilan itu berhenti."
  hi: "लगभग 1350 से 1700 तक यूरोप में दसियों हज़ार लोगों को जादू-टोने के लिए मौत क्यों दी गई, और ये मुकदमे क्यों रुके।"
outcomes:
  - en: "Evaluate key witch-hunt cases and their context"
    zh: "评估重要的猎巫案例及其背景"
    zh-TW: "評估重要的獵巫案例及其背景"
    ja: "主な魔女狩りの事例とその背景を評価する"
    ko: "주요 마녀사냥 사례와 그 배경 평가하기"
    vi: "Đánh giá các vụ săn phù thủy tiêu biểu và bối cảnh"
    ms: "Nilai kes pemburuan ahli sihir utama dan konteksnya"
    id: "Menilai kasus perburuan penyihir utama dan konteksnya"
    hi: "डायन-शिकार के मुख्य मामलों और उनके संदर्भ को परखना"
  - en: "Weigh historians' explanations for its rise and fall"
    zh: "权衡历史学家对其兴衰的解释"
    zh-TW: "權衡歷史學家對其興衰的解釋"
    ja: "その盛衰についての歴史家の説明を比べる"
    ko: "그 흥망에 대한 역사가들의 설명 따져 보기"
    vi: "Cân nhắc cách các sử gia giải thích sự nổi lên và lụi tàn"
    ms: "Timbang penjelasan ahli sejarah tentang kebangkitan dan kejatuhannya"
    id: "Menimbang penjelasan sejarawan soal naik dan turunnya"
    hi: "इसके उभार और पतन पर इतिहासकारों की व्याख्याओं को तौलना"
  - en: "Analyse primary sources such as trial records"
    zh: "分析审判记录等一手史料"
    zh-TW: "分析審判紀錄等一手史料"
    ja: "裁判記録などの一次史料を分析する"
    ko: "재판 기록 같은 1차 사료 분석하기"
    vi: "Phân tích nguồn sơ cấp như hồ sơ xét xử"
    ms: "Analisis sumber primer seperti rekod perbicaraan"
    id: "Menganalisis sumber primer seperti catatan pengadilan"
    hi: "मुकदमों के रिकॉर्ड जैसे प्राथमिक स्रोतों का विश्लेषण करना"
