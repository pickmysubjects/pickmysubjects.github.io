code: DRAM30032
year: 2026
learn:
  en: "Get ready for the industry: film your show reel and perform stage and screen material in a Showcase for agents and casting."
  zh: "为进入行业做准备：拍摄作品片段，并在面向经纪和选角的展演中表演。"
  zh-TW: "為進入業界做準備：拍攝作品片段，並在面向經紀與選角的展演中表演。"
  ja: "業界への準備：リールを撮影し、エージェントやキャスティング向けのショーケースで演じる。"
  ko: "업계 진출 준비: 쇼릴을 촬영하고 에이전트·캐스팅을 위한 쇼케이스에서 공연한다."
  vi: "Sẵn sàng vào nghề: quay showreel và diễn phần sân khấu, màn ảnh trong buổi Showcase cho người tuyển vai."
  ms: "Bersedia untuk industri: rakam showreel dan beraksi dalam Showcase untuk ejen dan pemilih pelakon."
  id: "Bersiap ke industri: merekam showreel dan tampil dalam Showcase untuk agen dan casting."
  hi: "इंडस्ट्री की तैयारी: शो रील फ़िल्माना और एजेंटों व कास्टिंग के लिए शोकेस में मंच-स्क्रीन प्रस्तुति।"
outcomes:
  - en: "Film a show reel"
    zh: "拍摄个人作品片段"
    zh-TW: "拍攝個人作品片段"
    ja: "リールを撮影する"
    ko: "쇼릴 촬영하기"
    vi: "Quay showreel"
    ms: "Rakam showreel"
    id: "Merekam showreel"
    hi: "शो रील फ़िल्माना"
  - en: "Perform for an industry audience"
    zh: "为业界观众表演"
    zh-TW: "為業界觀眾表演"
    ja: "業界の観客の前で演じる"
    ko: "업계 관객 앞에서 공연하기"
    vi: "Diễn cho khán giả trong nghề"
    ms: "Beraksi untuk penonton industri"
    id: "Tampil di depan penonton industri"
    hi: "इंडस्ट्री दर्शकों के लिए प्रस्तुति"
  - en: "Reflect on your professional artistic identity"
    zh: "反思自己的职业艺术身份"
    zh-TW: "反思自己的職業藝術身分"
    ja: "プロとしての芸術的アイデンティティを考える"
    ko: "직업 예술가로서의 정체성 성찰하기"
    vi: "Suy ngẫm bản sắc nghệ thuật nghề nghiệp"
    ms: "Renung identiti seni profesional diri"
    id: "Merefleksikan identitas seni profesional"
    hi: "अपनी पेशेवर कलात्मक पहचान पर विचार"
