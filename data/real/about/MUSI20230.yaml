code: MUSI20230
year: 2026
learn:
  en: "For ANAM students, after Ensembles 3: more orchestra and chamber music projects at the Conservatorium and ANAM."
  zh: 面向ANAM学生，合奏3之后：在音乐学院和ANAM继续参加管弦乐与室内乐项目。
  zh-TW: 面向ANAM學生，合奏3之後：在音樂學院和ANAM繼續參加管弦樂與室內樂計畫。
  ja: ANAM在籍者向け、アンサンブル3の続き。音楽院とANAMでのオーケストラ・室内楽プロジェクト。
  ko: ANAM 학생 대상, 앙상블 3 다음 과목. 음악원과 ANAM의 오케스트라·실내악 프로젝트.
  vi: "Dành cho sinh viên ANAM, sau Ensembles 3: thêm dự án dàn nhạc và thính phòng ở Nhạc viện và ANAM."
  ms: "Untuk pelajar ANAM selepas Ensembel 3: lagi projek orkestra dan muzik kamar di Konservatorium dan ANAM."
  id: "Untuk mahasiswa ANAM setelah Ansambel 3: proyek orkestra dan musik kamar lanjutan di Konservatorium dan ANAM."
  hi: "ANAM छात्रों के लिए, एन्सेम्बल 3 के बाद: और ऑर्केस्ट्रा व चैंबर संगीत परियोजनाएँ।"
outcomes:
  - en: Lead and follow in rehearsals
    zh: 在排练中带领与配合
    zh-TW: 在排練中帶領與配合
    ja: リハーサルでリードし、合わせる
    ko: 리허설에서 이끌고 따르기
    vi: Dẫn dắt và phối hợp khi tập
    ms: Memimpin dan mengikut dalam latihan
    id: Memimpin dan mengikuti saat latihan
    hi: रिहर्सल में नेतृत्व और तालमेल
  - en: Perform in orchestra and chamber groups
    zh: 参与管弦乐和室内乐演出
    zh-TW: 參與管弦樂與室內樂演出
    ja: オーケストラと室内楽で演奏する
    ko: 오케스트라·실내악 연주하기
    vi: Biểu diễn trong dàn nhạc và nhóm thính phòng
    ms: Bermain dalam orkestra dan kumpulan kamar
    id: Tampil dalam orkestra dan grup kamar
    hi: ऑर्केस्ट्रा और चैंबर समूह में प्रस्तुति
  - en: Work as a professional ensemble player
    zh: 以专业合奏乐手标准工作
    zh-TW: 以專業合奏樂手標準工作
    ja: プロの合奏者として取り組む
    ko: 전문 앙상블 연주자로 활동하기
    vi: Làm việc như nhạc công chuyên nghiệp
    ms: Bekerja sebagai pemain ensembel profesional
    id: Bekerja sebagai pemain ansambel profesional
    hi: पेशेवर समूह वादक की तरह काम
