code: PSYC20009
year: 2026
learn:
  en: "What makes each person unique, and how we see ourselves, judge others and are shaped by groups and culture."
  zh: "每个人为什么不同，以及我们怎么看自己、看别人、受群体影响。"
  zh-TW: "每個人為什麼不同，以及我們怎麼看自己、評價別人、受群體和文化影響。"
  ja: "人それぞれの違いは何から生まれるか、自分の見方、他者の判断、集団や文化の影響。"
  ko: "각자를 독특하게 만드는 것, 자신을 보는 방식, 타인 판단, 집단과 문화의 영향."
  vi: "Điều gì làm mỗi người khác biệt, cách ta nhìn bản thân, đánh giá người khác và chịu ảnh hưởng nhóm, văn hóa."
  ms: "Apa yang menjadikan setiap orang unik, cara kita melihat diri, menilai orang lain dan dibentuk kumpulan serta budaya."
  id: "Apa yang membuat tiap orang unik, cara kita melihat diri, menilai orang lain, dan dibentuk kelompok serta budaya."
  hi: "हर इंसान अलग क्यों है, हम खुद को कैसे देखते, दूसरों को कैसे आँकते हैं और समूह व संस्कृति का असर।"
outcomes:
  - en: "Run correlation and simple regression tests"
    zh: "做相关和简单回归分析"
    zh-TW: "做相關和簡單迴歸分析"
    ja: "相関と単回帰の分析を行う"
    ko: "상관분석과 단순회귀 분석 수행"
    vi: "Chạy phân tích tương quan và hồi quy đơn"
    ms: "Jalankan ujian korelasi dan regresi mudah"
    id: "Menjalankan uji korelasi dan regresi sederhana"
    hi: "कोरिलेशन और सिंपल रिग्रेशन टेस्ट चलाना"
  - en: "Write a psychology lab report"
    zh: "写心理学实验报告"
    zh-TW: "寫心理學實驗報告"
    ja: "心理学の実験レポートを書く"
    ko: "심리학 실험 보고서 작성"
    vi: "Viết báo cáo thí nghiệm tâm lý học"
    ms: "Tulis laporan makmal psikologi"
    id: "Menulis laporan praktikum psikologi"
    hi: "साइकोलॉजी लैब रिपोर्ट लिखना"
  - en: "Present research findings in a group"
    zh: "和小组一起展示研究结果"
    zh-TW: "和小組一起展示研究結果"
    ja: "グループで研究結果を発表する"
    ko: "그룹으로 연구 결과 발표"
    vi: "Trình bày kết quả nghiên cứu theo nhóm"
    ms: "Bentang dapatan kajian dalam kumpulan"
    id: "Mempresentasikan temuan riset dalam kelompok"
    hi: "ग्रुप में रिसर्च के नतीजे पेश करना"
