code: LAWS90203
year: 2027
learn:
  en: "Legal and ethical issues of AI in science, such as trust, liability, privacy and fairness, explored through real use-cases."
  zh: "通过真实案例探讨科学中人工智能的法律与伦理问题，如信任、责任、隐私和公平。"
  zh-TW: "透過真實案例探討科學中人工智慧的法律與倫理問題，如信任、責任、隱私與公平。"
  ja: "実例を通して、科学におけるAIの法的・倫理的課題（信頼、責任、プライバシー、公平）を考える。"
  ko: "실제 사례로 과학 분야 AI의 법적·윤리적 문제(신뢰, 책임, 개인정보, 공정성)를 탐구합니다."
  vi: "Vấn đề pháp lý và đạo đức của AI trong khoa học như tin cậy, trách nhiệm, quyền riêng tư, công bằng."
  ms: "Isu undang-undang dan etika AI dalam sains seperti kepercayaan, liabiliti, privasi dan keadilan."
  id: "Isu hukum dan etika AI dalam sains seperti kepercayaan, tanggung jawab, privasi, dan keadilan."
  hi: "असली उदाहरणों से विज्ञान में AI के क़ानूनी-नैतिक मुद्दे: भरोसा, दायित्व, निजता और निष्पक्षता।"
outcomes:
  - en: "Identify legal and ethical issues in AI use-cases"
    zh: "识别AI应用中的法律与伦理问题"
    zh-TW: "辨識AI應用中的法律與倫理問題"
    ja: "AI活用例の法的・倫理的課題を見つける"
    ko: "AI 활용 사례의 법적·윤리적 문제 찾기"
    vi: "Nhận diện vấn đề pháp lý, đạo đức của AI"
    ms: "Mengenal pasti isu undang-undang dan etika AI"
    id: "Mengidentifikasi isu hukum dan etika AI"
    hi: "AI उपयोग में क़ानूनी-नैतिक मुद्दे पहचानना"
  - en: "Discuss AI regulation across science and law"
    zh: "跨科学与法律讨论AI监管"
    zh-TW: "跨科學與法律討論AI監管"
    ja: "科学と法の両面からAI規制を論じる"
    ko: "과학과 법을 아울러 AI 규제 논의하기"
    vi: "Thảo luận quản lý AI giữa khoa học và luật"
    ms: "Membincangkan peraturan AI dalam sains dan undang-undang"
    id: "Membahas regulasi AI lintas sains dan hukum"
    hi: "विज्ञान व क़ानून में AI नियमन पर चर्चा"
