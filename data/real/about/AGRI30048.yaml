code: AGRI30048
year: 2026
learn:
  en: "How new crop varieties are bred, from classic breeding methods to gene technologies and molecular tools."
  zh: "新作物品种如何培育：从传统育种到基因技术和分子工具。"
  zh-TW: "新作物品種如何培育：從傳統育種到基因技術與分子工具。"
  ja: "新品種の作り方：従来育種から遺伝子技術・分子手法まで。"
  ko: "새 작물 품종 육성: 전통 육종부터 유전자 기술·분자 도구까지."
  vi: "Cách lai tạo giống cây mới: từ phương pháp truyền thống đến công nghệ gen và công cụ phân tử."
  ms: "Cara baka tanaman baharu dihasilkan: daripada kaedah klasik hingga teknologi gen dan alat molekul."
  id: "Cara pemuliaan varietas baru: dari metode klasik hingga teknologi gen dan alat molekuler."
  hi: "नई फसल किस्में कैसे बनती हैं: पारंपरिक प्रजनन से जीन तकनीक और आणविक तरीकों तक।"
outcomes:
  - en: "Compare breeding methods for crop types"
    zh: "比较不同作物的育种方法"
    zh-TW: "比較不同作物的育種方法"
    ja: "作物ごとの育種法を比較する"
    ko: "작물별 육종 방법 비교하기"
    vi: "So sánh phương pháp lai tạo cho từng loại cây"
    ms: "Bandingkan kaedah pembiakbakaan tanaman"
    id: "Membandingkan metode pemuliaan tanaman"
    hi: "फसलों के लिए प्रजनन विधियों की तुलना करें"
  - en: "Explain how genetic variation is used in breeding"
    zh: "解释育种如何利用遗传变异"
    zh-TW: "解釋育種如何利用遺傳變異"
    ja: "育種での遺伝的変異の使い方を説明する"
    ko: "육종에서 유전 변이 활용 설명하기"
    vi: "Giải thích cách dùng biến dị di truyền khi lai tạo"
    ms: "Terangkan penggunaan variasi genetik"
    id: "Menjelaskan pemanfaatan variasi genetik"
    hi: "प्रजनन में आनुवंशिक विविधता का उपयोग समझाएँ"
  - en: "Assess molecular tools in plant breeding"
    zh: "评估分子技术在育种中的作用"
    zh-TW: "評估分子技術在育種中的作用"
    ja: "育種での分子手法を評価する"
    ko: "육종의 분자 도구 평가하기"
    vi: "Đánh giá công cụ phân tử trong chọn giống"
    ms: "Nilai alat molekul dalam pembiakbakaan"
    id: "Menilai alat molekuler dalam pemuliaan"
    hi: "पौध प्रजनन में आणविक तरीकों का आकलन करें"
