code: HPSC30040
year: 2027
learn:
  en: "Debates on sex and gender in science, like 'male and female brains', seen through history and philosophy of science."
  zh: "从科学史和科学哲学看科学中的性与性别争论，例如“男脑女脑”。"
  zh-TW: "從科學史和科學哲學看科學中的性與性別爭論，例如「男腦女腦」。"
  ja: "「男性脳・女性脳」など、科学における性とジェンダーの論争を科学史・科学哲学から考える。"
  ko: "'남성 뇌·여성 뇌' 같은 과학 속 성과 젠더 논쟁을 과학사·과학철학의 관점에서 살펴본다."
  vi: "Các tranh luận về giới tính và giới trong khoa học, như 'não nam, não nữ', nhìn qua lịch sử và triết học khoa học."
  ms: "Perdebatan tentang seks dan gender dalam sains, seperti 'otak lelaki dan perempuan', dilihat melalui sejarah dan falsafah sains."
  id: "Perdebatan soal seks dan gender dalam sains, seperti 'otak laki-laki dan perempuan', dilihat lewat sejarah dan filsafat sains."
  hi: "विज्ञान में सेक्स और जेंडर पर बहसें, जैसे 'पुरुष और महिला दिमाग', विज्ञान के इतिहास और दर्शन के नज़रिये से।"
outcomes:
  - en: "Explain the roots of scientific controversies"
    zh: "解释科学争议的根源"
    zh-TW: "解釋科學爭議的根源"
    ja: "科学論争の根っこを説明する"
    ko: "과학 논쟁의 뿌리 설명하기"
    vi: "Giải thích nguồn gốc các tranh cãi khoa học"
    ms: "Terangkan punca kontroversi saintifik"
    id: "Menjelaskan akar kontroversi ilmiah"
    hi: "वैज्ञानिक विवादों की जड़ें समझाना"
  - en: "Analyse the role of political values in science"
    zh: "分析政治价值观在科学中的作用"
    zh-TW: "分析政治價值觀在科學中的作用"
    ja: "科学における政治的価値観の役割を分析する"
    ko: "과학에서 정치적 가치의 역할 분석하기"
    vi: "Phân tích vai trò của giá trị chính trị trong khoa học"
    ms: "Analisis peranan nilai politik dalam sains"
    id: "Menganalisis peran nilai politik dalam sains"
    hi: "विज्ञान में राजनीतिक मूल्यों की भूमिका का विश्लेषण करना"
