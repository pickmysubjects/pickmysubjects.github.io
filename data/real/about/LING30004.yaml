code: LING30004
year: 2026
learn:
  en: "How people really use language: recording and transcribing talk, speech acts, implied meaning, conversation analysis and identity."
  zh: "人们如何真实地使用语言：录音与转写对话、言语行为、隐含意义、会话分析与身份。"
  zh-TW: "人們如何真實地使用語言：錄音與轉寫對話、言語行為、隱含意義、會話分析與身分。"
  ja: "人は言葉を実際にどう使うか。会話の録音と書き起こし、発話行為、含意、会話分析、アイデンティティ。"
  ko: "사람들이 실제로 언어를 쓰는 방식. 대화 녹음과 전사, 화행, 함축, 대화 분석, 정체성."
  vi: "Con người thật sự dùng ngôn ngữ ra sao: ghi âm, phiên âm hội thoại, hành vi ngôn ngữ, hàm ý, phân tích hội thoại và bản sắc."
  ms: "Cara orang sebenarnya menggunakan bahasa: rakam dan transkripsi perbualan, lakuan tutur, makna tersirat, analisis perbualan dan identiti."
  id: "Cara orang sungguh memakai bahasa: merekam dan mentranskripsi percakapan, tindak tutur, makna tersirat, analisis percakapan dan identitas."
  hi: "लोग असल में भाषा कैसे इस्तेमाल करते हैं: बातचीत रिकॉर्ड और लिप्यंतरण, वाक्-कर्म, निहित अर्थ, वार्तालाप विश्लेषण और पहचान।"
outcomes:
  - en: "Record and transcribe real conversation"
    zh: "录制并转写真实对话"
    zh-TW: "錄製並轉寫真實對話"
    ja: "実際の会話を録音し書き起こす"
    ko: "실제 대화 녹음하고 전사하기"
    vi: "Ghi âm và phiên âm hội thoại thật"
    ms: "Rakam dan transkripsi perbualan sebenar"
    id: "Merekam dan mentranskripsi percakapan nyata"
    hi: "असली बातचीत रिकॉर्ड और लिप्यंतरित करना"
  - en: "Explain how meaning goes beyond the words"
    zh: "说明意义如何超越字面"
    zh-TW: "說明意義如何超越字面"
    ja: "意味が言葉の字面を超える仕組みを説明する"
    ko: "의미가 말 그 너머로 전달되는 방식 설명하기"
    vi: "Giải thích nghĩa vượt ra ngoài câu chữ ra sao"
    ms: "Terangkan cara makna melangkaui perkataan"
    id: "Menjelaskan cara makna melampaui kata-kata"
    hi: "अर्थ शब्दों से आगे कैसे जाता है, समझाना"
  - en: "Design a small discourse research project"
    zh: "设计一个小型话语分析研究"
    zh-TW: "設計一個小型話語分析研究"
    ja: "小規模な談話分析の研究を設計する"
    ko: "소규모 담화 분석 연구 설계하기"
    vi: "Thiết kế một dự án nghiên cứu diễn ngôn nhỏ"
    ms: "Reka projek kecil penyelidikan wacana"
    id: "Merancang proyek kecil riset wacana"
    hi: "एक छोटा विमर्श शोध प्रोजेक्ट तैयार करना"
