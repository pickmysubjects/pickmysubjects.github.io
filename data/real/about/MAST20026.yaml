code: MAST20026
year: 2026
learn:
  en: "Why calculus works: rigorous proofs about real numbers, limits, series, derivatives and integrals."
  zh: "讲清楚微积分为什么成立：用严格证明讲实数、极限、级数和积分。"
  zh-TW: "講清楚微積分為什麼成立：用嚴格證明講實數、極限、級數、導數和積分。"
  ja: "微積分が成り立つ理由：実数・極限・級数・微分・積分の厳密な証明。"
  ko: "미적분이 성립하는 이유: 실수, 극한, 급수, 미분, 적분에 대한 엄밀한 증명."
  vi: "Vì sao giải tích đúng: chứng minh chặt chẽ về số thực, giới hạn, chuỗi, đạo hàm và tích phân."
  ms: "Mengapa kalkulus berfungsi: bukti rapi tentang nombor nyata, had, siri, terbitan dan kamiran."
  id: "Kenapa kalkulus berlaku: bukti ketat tentang bilangan real, limit, deret, turunan, dan integral."
  hi: "कैलकुलस क्यों काम करता है: वास्तविक संख्या, सीमा, श्रेणी, अवकलज और इंटीग्रल के सख्त प्रमाण।"
outcomes:
  - en: "Write proofs by induction and contradiction"
    zh: "会用归纳法和反证法写证明"
    zh-TW: "會用歸納法和反證法寫證明"
    ja: "帰納法と背理法で証明を書く"
    ko: "귀납법과 귀류법으로 증명 쓰기"
    vi: "Chứng minh bằng quy nạp và phản chứng"
    ms: "Menulis bukti secara aruhan dan percanggahan"
    id: "Menulis bukti dengan induksi dan kontradiksi"
    hi: "आगमन और विरोधाभास से प्रमाण लिखना"
  - en: "Decide whether sequences and series converge"
    zh: "判断数列和级数是否收敛"
    zh-TW: "判斷數列和級數是否收斂"
    ja: "数列と級数の収束を判定する"
    ko: "수열과 급수의 수렴 여부 판단하기"
    vi: "Xét dãy và chuỗi có hội tụ không"
    ms: "Menentukan sama ada jujukan dan siri menumpu"
    id: "Menentukan apakah barisan dan deret konvergen"
    hi: "तय करना कि अनुक्रम और श्रेणी अभिसारी हैं या नहीं"
  - en: "Use Taylor and Fourier series"
    zh: "会用泰勒级数和傅里叶级数"
    zh-TW: "會用泰勒級數和傅立葉級數"
    ja: "テイラー級数とフーリエ級数を使う"
    ko: "테일러 급수와 푸리에 급수 사용하기"
    vi: "Dùng chuỗi Taylor và Fourier"
    ms: "Menggunakan siri Taylor dan Fourier"
    id: "Memakai deret Taylor dan Fourier"
    hi: "टेलर और फ़ूरिये श्रेणी का उपयोग"
