code: INFO30009
year: 2026
learn:
  en: "Principles of game design: what makes games engaging, play-centred design, rapid prototyping and critiquing games."
  zh: "游戏设计原理：游戏为何吸引人、以玩法为中心的设计、快速原型和游戏评析。"
  zh-TW: "遊戲設計原理：遊戲為何吸引人、以玩法為中心的設計、快速原型與遊戲評析。"
  ja: "ゲームデザインの原理。面白さの理由、プレイ中心の設計、高速プロトタイピング、ゲーム批評。"
  ko: "게임 디자인 원리: 게임이 몰입되는 이유, 플레이 중심 설계, 빠른 프로토타이핑, 게임 비평."
  vi: "Nguyên lý thiết kế game: điều gì khiến game hấp dẫn, thiết kế lấy lối chơi làm trung tâm, làm mẫu nhanh, phê bình game."
  ms: "Prinsip reka bentuk permainan: apa yang menarik pemain, reka bentuk berpusat permainan, prototaip pantas dan kritikan."
  id: "Prinsip desain gim: apa yang membuat gim menarik, desain berpusat permainan, prototipe cepat, dan kritik gim."
  hi: "गेम डिज़ाइन के सिद्धांत: गेम क्यों बाँधते हैं, खेल-केंद्रित डिज़ाइन, तेज़ प्रोटोटाइप और गेम समीक्षा।"
outcomes:
  - en: "Explain how games engage their players"
    zh: "解释游戏如何吸引玩家"
    zh-TW: "解釋遊戲如何吸引玩家"
    ja: "ゲームが遊び手を引き込む仕組みを説明する"
    ko: "게임이 플레이어를 끌어들이는 방식 설명하기"
    vi: "Giải thích cách game thu hút người chơi"
    ms: "Jelaskan cara permainan menarik pemain"
    id: "Menjelaskan cara gim memikat pemain"
    hi: "गेम खिलाड़ियों को कैसे बाँधते हैं, समझाना"
  - en: "Prototype and playtest a game quickly"
    zh: "快速制作游戏原型并试玩"
    zh-TW: "快速製作遊戲原型並試玩"
    ja: "ゲームを素早く試作しテストプレイする"
    ko: "게임을 빠르게 프로토타입하고 플레이테스트하기"
    vi: "Làm mẫu và chơi thử game nhanh"
    ms: "Bina prototaip dan uji main permainan dengan pantas"
    id: "Membuat prototipe dan menguji gim dengan cepat"
    hi: "गेम का तेज़ प्रोटोटाइप बनाकर प्लेटेस्ट करना"
  - en: "Critically analyse games and play"
    zh: "批判性分析游戏和游玩体验"
    zh-TW: "批判性分析遊戲與遊玩體驗"
    ja: "ゲームと遊びを批評的に分析する"
    ko: "게임과 플레이를 비판적으로 분석하기"
    vi: "Phân tích phê bình game và trải nghiệm chơi"
    ms: "Analisis kritis permainan dan pengalaman bermain"
    id: "Menganalisis gim dan pengalaman bermain secara kritis"
    hi: "गेम और खेलने के अनुभव का आलोचनात्मक विश्लेषण"
