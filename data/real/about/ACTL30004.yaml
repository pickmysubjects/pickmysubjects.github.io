code: ACTL30004
year: 2026
learn:
  en: "Statistics for actuarial work: regression, generalised linear models, Bayesian methods and credibility theory."
  zh: "精算用的统计：回归、广义线性模型、贝叶斯方法和信度理论。"
  zh-TW: "精算用的統計：迴歸、廣義線性模型、貝氏方法和信賴度理論。"
  ja: "アクチュアリー業務の統計：回帰、一般化線形モデル、ベイズ法、信頼性理論。"
  ko: "보험계리를 위한 통계: 회귀, 일반화 선형 모형, 베이즈 방법, 신뢰도 이론."
  vi: "Thống kê cho định phí bảo hiểm: hồi quy, mô hình tuyến tính tổng quát, Bayes và lý thuyết tin cậy."
  ms: "Statistik untuk kerja aktuari: regresi, model linear teritlak, kaedah Bayes dan teori kredibiliti."
  id: "Statistika untuk aktuaria: regresi, model linear tergeneralisasi, metode Bayes, dan teori kredibilitas."
  hi: "एक्चुअरियल काम के लिए स्टैटिस्टिक्स: रिग्रेशन, GLM, बेज़ियन तरीके और क्रेडिबिलिटी थ्योरी।"
outcomes:
  - en: "Fit regression models in software and read the results"
    zh: "用软件拟合回归模型并解读结果"
    zh-TW: "用軟體擬合迴歸模型並解讀結果"
    ja: "ソフトで回帰モデルを当てはめ結果を読む"
    ko: "소프트웨어로 회귀 모델을 적합하고 결과 해석하기"
    vi: "Chạy mô hình hồi quy bằng phần mềm và đọc kết quả"
    ms: "Padankan model regresi dalam perisian dan baca hasilnya"
    id: "Menjalankan model regresi di software dan membaca hasilnya"
    hi: "सॉफ़्टवेयर में रिग्रेशन मॉडल फ़िट करना और नतीजे पढ़ना"
  - en: "Use the bootstrap to check how good an estimate is"
    zh: "用自助法检验估计量的好坏"
    zh-TW: "用自助法檢驗估計量的好壞"
    ja: "ブートストラップで推定値の良さを確かめる"
    ko: "부트스트랩으로 추정치가 얼마나 좋은지 확인하기"
    vi: "Dùng bootstrap để kiểm tra độ tốt của ước lượng"
    ms: "Guna bootstrap untuk semak kualiti anggaran"
    id: "Memakai bootstrap untuk mengecek kualitas estimasi"
    hi: "बूटस्ट्रैप से अनुमान की गुणवत्ता जाँचना"
  - en: "Derive Bayesian estimators"
    zh: "推导贝叶斯估计量"
    zh-TW: "推導貝氏估計量"
    ja: "ベイズ推定量を導出する"
    ko: "베이즈 추정량 유도하기"
    vi: "Suy ra các ước lượng Bayes"
    ms: "Terbitkan penganggar Bayes"
    id: "Menurunkan estimator Bayes"
    hi: "बेज़ियन एस्टिमेटर निकालना"
