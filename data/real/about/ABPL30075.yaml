code: ABPL30075
year: 2026
learn:
  en: "A game design studio themed on frostpunk, centred on level design fundamentals, mechanics and interface."
  zh: "以冰霜朋克为主题的游戏设计课，重点是关卡设计基础、机制和界面。"
  zh-TW: "以冰霜龐克為主題的遊戲設計課，重點是關卡設計基礎、機制與介面。"
  ja: "フロストパンクがテーマのゲームデザインスタジオ。レベルデザインの基礎、仕組み、UIが中心。"
  ko: "프로스트펑크 주제의 게임 디자인 스튜디오. 레벨 디자인 기초, 메커닉, 인터페이스 중심."
  vi: "Studio thiết kế game chủ đề frostpunk, tập trung nền tảng thiết kế màn chơi, cơ chế và giao diện."
  ms: "Studio reka bentuk permainan bertema frostpunk, berfokus pada asas reka aras, mekanik dan antara muka."
  id: "Studio desain gim bertema frostpunk, berfokus pada dasar desain level, mekanik, dan antarmuka."
  hi: "फ़्रॉस्टपंक थीम पर गेम डिज़ाइन स्टूडियो, लेवल डिज़ाइन की बुनियाद, मैकेनिक्स और इंटरफ़ेस पर केंद्रित।"
outcomes:
  - en: "Learn the basics of level design"
    zh: "掌握关卡设计基础"
    zh-TW: "掌握關卡設計基礎"
    ja: "レベルデザインの基礎を身につける"
    ko: "레벨 디자인 기초 익히기"
    vi: "Nắm nền tảng thiết kế màn chơi"
    ms: "Kuasai asas reka bentuk aras"
    id: "Menguasai dasar desain level"
    hi: "लेवल डिज़ाइन की बुनियादी बातें सीखना"
  - en: "Use space and scarcity to shape play"
    zh: "用空间和资源稀缺塑造玩法"
    zh-TW: "用空間與資源稀缺形塑玩法"
    ja: "空間と資源の乏しさで遊びをつくる"
    ko: "공간과 자원 부족으로 플레이 만들기"
    vi: "Dùng không gian và sự khan hiếm tạo lối chơi"
    ms: "Guna ruang dan kekurangan untuk membentuk permainan"
    id: "Memakai ruang dan kelangkaan untuk membentuk permainan"
    hi: "स्पेस और कमी से गेमप्ले गढ़ना"
  - en: "Produce design docs, a game build and a pitch"
    zh: "完成设计文档、可玩版本和提案"
    zh-TW: "完成設計文件、可玩版本與提案"
    ja: "設計書、ゲームビルド、ピッチ資料を作る"
    ko: "기획서·게임 빌드·피치 자료 만들기"
    vi: "Làm tài liệu thiết kế, bản build và bài pitch"
    ms: "Hasilkan dokumen reka bentuk, binaan dan pitch"
    id: "Membuat dokumen desain, build gim, dan pitch"
    hi: "डिज़ाइन दस्तावेज़, गेम बिल्ड और पिच तैयार करना"
