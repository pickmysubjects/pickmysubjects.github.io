code: FREN20011
year: 2026
learn:
  en: "French cinema from the New Wave to now: auteur theory, film language and social change on screen. Taught in French."
  zh: "从新浪潮至今的法国电影：作者论、电影语言和银幕上的社会变迁，用法语授课。"
  zh-TW: "從新浪潮至今的法國電影：作者論、電影語言和銀幕上的社會變遷，用法語授課。"
  ja: "ヌーヴェル・ヴァーグから現在までのフランス映画。作家主義、映画の言語、スクリーン上の社会変化。フランス語で授業。"
  ko: "누벨바그부터 현재까지의 프랑스 영화. 작가주의, 영화 언어, 스크린 속 사회 변화. 프랑스어 수업."
  vi: "Điện ảnh Pháp từ Làn sóng mới đến nay: thuyết tác giả, ngôn ngữ điện ảnh và biến đổi xã hội trên màn ảnh. Dạy bằng tiếng Pháp."
  ms: "Sinema Perancis dari New Wave hingga kini: teori auteur, bahasa filem dan perubahan sosial di skrin. Diajar dalam bahasa Perancis."
  id: "Sinema Prancis dari New Wave hingga kini: teori auteur, bahasa film dan perubahan sosial di layar. Diajarkan dalam bahasa Prancis."
  hi: "न्यू वेव से आज तक फ़्रेंच सिनेमा: ऑत्योर सिद्धांत, फ़िल्म की भाषा और परदे पर सामाजिक बदलाव। फ़्रेंच में पढ़ाया जाता है।"
outcomes:
  - en: "Analyse films using basic film language"
    zh: "运用基本电影语言分析影片"
    zh-TW: "運用基本電影語言分析影片"
    ja: "映画の基本的な文法で作品を分析する"
    ko: "기본 영화 언어로 작품 분석하기"
    vi: "Phân tích phim bằng ngôn ngữ điện ảnh cơ bản"
    ms: "Analisis filem menggunakan bahasa filem asas"
    id: "Menganalisis film dengan bahasa film dasar"
    hi: "बुनियादी फ़िल्म भाषा से फ़िल्मों का विश्लेषण करना"
  - en: "Explain what made the New Wave new"
    zh: "解释新浪潮新在何处"
    zh-TW: "解釋新浪潮新在何處"
    ja: "ヌーヴェル・ヴァーグの新しさを説明する"
    ko: "누벨바그가 새로웠던 이유 설명하기"
    vi: "Giải thích điều gì làm Làn sóng mới trở nên mới"
    ms: "Terangkan apa yang menjadikan New Wave baharu"
    id: "Menjelaskan apa yang membuat New Wave baru"
    hi: "समझाना कि न्यू वेव में नया क्या था"
  - en: "Present your film analysis in French"
    zh: "用法语展示你的影片分析"
    zh-TW: "用法語展示你的影片分析"
    ja: "映画分析をフランス語で発表する"
    ko: "영화 분석을 프랑스어로 발표하기"
    vi: "Trình bày phân tích phim bằng tiếng Pháp"
    ms: "Bentangkan analisis filem dalam bahasa Perancis"
    id: "Mempresentasikan analisis film dalam bahasa Prancis"
    hi: "अपना फ़िल्म विश्लेषण फ़्रेंच में प्रस्तुत करना"
