code: MUSI20250
year: 2027
learn:
  en: "Play in a Parkville concert band of brass, woodwind and percussion, rehearsing weekly and giving a public concert each semester."
  zh: "加入 Parkville 管乐团（铜管、木管、打击乐），每周排练，每学期一场公开演出。"
  zh-TW: "加入 Parkville 管樂團（銅管、木管、打擊樂），每週排練，每學期一場公開演出。"
  ja: "金管・木管・打楽器のパークビル吹奏楽団で毎週練習し、各学期に公開演奏会を行う。"
  ko: "금관·목관·타악기로 이뤄진 파크빌 콘서트 밴드에서 매주 연습하고 학기마다 공개 공연."
  vi: "Chơi trong ban nhạc kèn Parkville (kèn đồng, kèn gỗ, bộ gõ), tập hằng tuần và diễn công khai mỗi học kỳ."
  ms: "Bermain dalam band konsert Parkville (tembaga, tiupan kayu, perkusi), latihan mingguan dan konsert awam setiap semester."
  id: "Bermain di concert band Parkville (brass, woodwind, perkusi), latihan mingguan dan konser publik tiap semester."
  hi: "पार्कविल कॉन्सर्ट बैंड (ब्रास, वुडविंड, पर्कशन) में बजाना, साप्ताहिक रिहर्सल और हर सेमेस्टर सार्वजनिक प्रस्तुति।"
outcomes:
  - en: "Grow your technique as an ensemble musician"
    zh: "提升作为合奏乐手的技术"
    zh-TW: "提升作為合奏樂手的技術"
    ja: "アンサンブル奏者として技術を伸ばす"
    ko: "앙상블 연주자로서 기술 키우기"
    vi: "Phát triển kỹ thuật của người chơi hòa tấu"
    ms: "Tingkatkan teknik sebagai pemuzik ensembel"
    id: "Mengembangkan teknik sebagai musisi ansambel"
    hi: "एंसेम्बल संगीतकार के रूप में तकनीक निखारना"
  - en: "Rehearse and perform band repertoire as a team"
    zh: "与团队一起排练和演出乐团曲目"
    zh-TW: "與團隊一起排練和演出樂團曲目"
    ja: "チームとして吹奏楽曲を練習・演奏する"
    ko: "팀으로서 밴드 레퍼토리 연습·공연하기"
    vi: "Cùng nhóm tập và biểu diễn tiết mục ban nhạc"
    ms: "Berlatih dan persembahkan repertoir band sebagai pasukan"
    id: "Berlatih dan tampil membawakan repertoar band bersama tim"
    hi: "टीम के साथ बैंड रिपर्टॉयर का अभ्यास व प्रदर्शन"
