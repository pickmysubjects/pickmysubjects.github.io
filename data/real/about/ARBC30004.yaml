code: ARBC30004
year: 2026
learn:
  en: "Advanced Arabic grammar and word forms, with texts on Middle East history and Islam, and your own creative writing."
  zh: "进阶阿拉伯语语法与构词，阅读中东历史和伊斯兰相关文本，并练习创意写作。"
  zh-TW: "進階阿拉伯語文法與構詞，閱讀中東歷史和伊斯蘭相關文本，並練習創意寫作。"
  ja: "上級のアラビア語文法と語形。中東の歴史やイスラムの文章を読み、創作文も書く。"
  ko: "고급 아랍어 문법과 어형. 중동 역사와 이슬람 관련 글을 읽고 창작 글쓰기도 한다."
  vi: "Ngữ pháp và cấu tạo từ tiếng Ả Rập nâng cao, văn bản về lịch sử Trung Đông và Hồi giáo, cùng viết sáng tác."
  ms: "Tatabahasa dan bentuk kata Arab lanjutan, teks tentang sejarah Timur Tengah dan Islam, serta penulisan kreatif sendiri."
  id: "Tata bahasa dan bentuk kata Arab lanjutan, teks tentang sejarah Timur Tengah dan Islam, serta menulis kreatif sendiri."
  hi: "उन्नत अरबी व्याकरण और शब्द-रूप, मध्य-पूर्व के इतिहास और इस्लाम पर पाठ, और अपना रचनात्मक लेखन।"
outcomes:
  - en: "Discuss social and cultural topics in Arabic"
    zh: "用阿拉伯语讨论社会和文化话题"
    zh-TW: "用阿拉伯語討論社會和文化話題"
    ja: "社会や文化の話題をアラビア語で話し合う"
    ko: "사회·문화 주제를 아랍어로 토론하기"
    vi: "Thảo luận chủ đề xã hội, văn hóa bằng tiếng Ả Rập"
    ms: "Bincangkan topik sosial dan budaya dalam bahasa Arab"
    id: "Membahas topik sosial dan budaya dalam bahasa Arab"
    hi: "सामाजिक और सांस्कृतिक विषयों पर अरबी में चर्चा करना"
  - en: "Read and write longer Arabic texts"
    zh: "读写较长的阿拉伯语文章"
    zh-TW: "讀寫較長的阿拉伯語文章"
    ja: "長めのアラビア語の文章を読み書きする"
    ko: "긴 아랍어 글 읽고 쓰기"
    vi: "Đọc và viết văn bản tiếng Ả Rập dài hơn"
    ms: "Baca dan tulis teks bahasa Arab yang lebih panjang"
    id: "Membaca dan menulis teks bahasa Arab yang lebih panjang"
    hi: "लंबे अरबी पाठ पढ़ना-लिखना"
  - en: "Give a clear presentation in Arabic"
    zh: "用阿拉伯语做清楚的口头报告"
    zh-TW: "用阿拉伯語做清楚的口頭報告"
    ja: "アラビア語で分かりやすく発表する"
    ko: "아랍어로 명확하게 발표하기"
    vi: "Thuyết trình rõ ràng bằng tiếng Ả Rập"
    ms: "Buat pembentangan yang jelas dalam bahasa Arab"
    id: "Melakukan presentasi yang jelas dalam bahasa Arab"
    hi: "अरबी में स्पष्ट प्रस्तुति देना"
