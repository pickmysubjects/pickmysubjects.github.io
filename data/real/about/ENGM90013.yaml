code: ENGM90013
year: 2027
learn:
  en: "Operations management for engineers: process design, quality, capacity, supply chains and competitive strategy."
  zh: "面向工程师的运营管理：流程设计、质量、产能、供应链与竞争战略。"
  zh-TW: "給工程師的營運管理：流程設計、品質、產能、供應鏈與競爭策略。"
  ja: "エンジニアのためのオペレーション管理：工程設計、品質、能力、サプライチェーン、競争戦略。"
  ko: "엔지니어를 위한 운영 관리: 프로세스 설계, 품질, 생산 능력, 공급망, 경쟁 전략."
  vi: "Quản trị vận hành cho kỹ sư: thiết kế quy trình, chất lượng, công suất, chuỗi cung ứng, chiến lược cạnh tranh."
  ms: "Pengurusan operasi untuk jurutera: reka bentuk proses, kualiti, kapasiti, rantaian bekalan dan strategi."
  id: "Manajemen operasi untuk insinyur: desain proses, kualitas, kapasitas, rantai pasok, strategi bersaing."
  hi: "इंजीनियरों के लिए ऑपरेशंस प्रबंधन: प्रक्रिया डिज़ाइन, गुणवत्ता, क्षमता, सप्लाई चेन, प्रतिस्पर्धी रणनीति।"
outcomes:
  - en: "Link a firm's operations to its business strategy"
    zh: "把企业的运营和经营战略联系起来"
    zh-TW: "把企業的營運與經營策略連結起來"
    ja: "企業の業務を経営戦略と結びつける"
    ko: "기업 운영을 사업 전략과 연결하기"
    vi: "Gắn hoạt động vận hành với chiến lược kinh doanh"
    ms: "Mengaitkan operasi syarikat dengan strateginya"
    id: "Mengaitkan operasi perusahaan dengan strateginya"
    hi: "कंपनी के संचालन को उसकी रणनीति से जोड़ना"
  - en: "Find ways to improve a business process"
    zh: "找出改进业务流程的办法"
    zh-TW: "找出改進業務流程的方法"
    ja: "業務プロセスの改善策を見つける"
    ko: "업무 프로세스 개선 방안 찾기"
    vi: "Tìm cách cải tiến một quy trình kinh doanh"
    ms: "Mencari cara memperbaiki proses perniagaan"
    id: "Mencari cara memperbaiki proses bisnis"
    hi: "किसी व्यावसायिक प्रक्रिया को सुधारने के तरीके खोजना"
