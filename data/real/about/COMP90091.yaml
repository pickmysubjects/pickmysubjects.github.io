code: COMP90091
year: 2027
learn:
  en: "Learn cyber security basics, then work with not-for-profit and community groups to improve their security."
  zh: "先学网络安全基础，再与非营利和社区组织合作改善其安全。"
  zh-TW: "先學資安基礎，再與非營利及社區組織合作改善其安全。"
  ja: "サイバーセキュリティの基礎を学び、非営利・地域団体と協力して安全性を高める。"
  ko: "사이버 보안 기초를 배우고 비영리·지역 단체와 함께 보안 개선."
  vi: "Học căn bản an ninh mạng, rồi làm cùng tổ chức phi lợi nhuận, cộng đồng để cải thiện bảo mật."
  ms: "Belajar asas keselamatan siber, kemudian bantu badan bukan untung dan komuniti meningkatkan keselamatan."
  id: "Belajar dasar keamanan siber, lalu bekerja dengan lembaga nirlaba dan komunitas memperbaiki keamanan."
  hi: "साइबर सुरक्षा की बुनियाद सीखकर गैर-लाभकारी और सामुदायिक संगठनों की सुरक्षा सुधारना।"
outcomes:
  - en: "Assess an organisation's security practices"
    zh: "评估一个组织的安全实践"
    zh-TW: "評估一個組織的資安實務"
    ja: "組織のセキュリティ対策を評価する"
    ko: "조직의 보안 관행 평가하기"
    vi: "Đánh giá thực hành bảo mật của một tổ chức"
    ms: "Nilai amalan keselamatan sesebuah organisasi"
    id: "Menilai praktik keamanan suatu organisasi"
    hi: "किसी संगठन की सुरक्षा प्रथाओं का आकलन"
  - en: "Give practical security advice to a real client"
    zh: "为真实客户提供实用安全建议"
    zh-TW: "為真實客戶提供實用資安建議"
    ja: "実際の依頼者に実践的な助言をする"
    ko: "실제 고객에게 실용적 보안 조언하기"
    vi: "Tư vấn bảo mật thực tế cho khách hàng thật"
    ms: "Beri nasihat keselamatan praktikal kepada klien sebenar"
    id: "Memberi saran keamanan praktis ke klien nyata"
    hi: "असली क्लाइंट को व्यावहारिक सुरक्षा सलाह देना"
