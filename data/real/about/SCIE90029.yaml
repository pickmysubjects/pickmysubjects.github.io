code: SCIE90029
year: 2027
learn:
  en: "Designing and running your own supervised biotechnology research project, then writing it up as a thesis."
  zh: "在导师指导下设计并开展自己的生物技术研究项目，并写成论文。"
  zh-TW: "在導師指導下設計並進行自己的生物科技研究專題，並寫成論文。"
  ja: "指導のもとで自分のバイオテクノロジー研究を設計・実施し、論文にまとめる。"
  ko: "지도 아래 자신의 생명공학 연구를 설계·수행하고 논문으로 정리한다."
  vi: "Tự thiết kế và thực hiện dự án nghiên cứu công nghệ sinh học có hướng dẫn, rồi viết thành luận văn."
  ms: "Mereka bentuk dan menjalankan projek penyelidikan bioteknologi sendiri di bawah seliaan, lalu menulis tesis."
  id: "Merancang dan menjalankan proyek riset bioteknologi sendiri dengan bimbingan, lalu menulis tesis."
  hi: "पर्यवेक्षण में अपनी जैव-प्रौद्योगिकी शोध परियोजना बनाना, चलाना और थीसिस लिखना।"
outcomes:
  - en: "Review the literature for a research project"
    zh: "为研究项目做文献综述"
    zh-TW: "為研究專題做文獻回顧"
    ja: "研究プロジェクトの文献をレビューする"
    ko: "연구 프로젝트를 위한 문헌 검토하기"
    vi: "Tổng quan tài liệu cho dự án nghiên cứu"
    ms: "Mengulas literatur untuk projek penyelidikan"
    id: "Meninjau literatur untuk proyek riset"
    hi: "शोध परियोजना के लिए साहित्य समीक्षा"
  - en: "Design experiments that generate data"
    zh: "设计能产生数据的实验"
    zh-TW: "設計能產生資料的實驗"
    ja: "データを得る実験を設計する"
    ko: "데이터를 얻는 실험 설계하기"
    vi: "Thiết kế thí nghiệm để thu dữ liệu"
    ms: "Mereka bentuk eksperimen untuk menjana data"
    id: "Merancang eksperimen untuk menghasilkan data"
    hi: "डेटा देने वाले प्रयोग डिज़ाइन करना"
  - en: "Present research in writing and orally"
    zh: "以书面和口头形式展示研究"
    zh-TW: "以書面和口頭形式呈現研究"
    ja: "研究を文章と口頭で発表する"
    ko: "연구를 글과 말로 발표하기"
    vi: "Trình bày nghiên cứu bằng văn bản và lời nói"
    ms: "Membentangkan penyelidikan secara bertulis dan lisan"
    id: "Menyajikan riset secara tertulis dan lisan"
    hi: "शोध को लिखित और मौखिक रूप से प्रस्तुत करना"
