code: MUSI30286
year: 2026
learn:
  en: "Teach beginners on an instrument or voice: plan six lessons for a classmate and give a demo lesson."
  zh: "器乐声乐入门教学：为同学设计六节课并做示范课。"
  zh-TW: "器樂聲樂入門教學：為同學設計六堂課並做示範課。"
  ja: "初心者への楽器・声楽指導：級友に6回レッスンし、模範授業をする。"
  ko: "초보자 악기·성악 지도: 동료에게 6회 레슨, 시범 수업."
  vi: "Dạy người mới học nhạc cụ: soạn sáu buổi cho bạn cùng lớp và dạy mẫu."
  ms: "Ajar pemula alat muzik atau vokal: enam pelajaran untuk rakan dan kelas demo."
  id: "Mengajar pemula instrumen atau vokal: enam les untuk teman dan les demo."
  hi: "शुरुआती छात्रों को वाद्य या गायन सिखाना: सहपाठी को छह पाठ और एक डेमो पाठ।"
outcomes:
  - en: "Plan and deliver beginner lessons"
    zh: "设计并讲授入门课"
    zh-TW: "設計並講授入門課"
    ja: "初心者向けレッスンを計画し教える"
    ko: "초보자 레슨 계획하고 진행하기"
    vi: "Soạn và dạy bài cho người mới"
    ms: "Rancang dan sampaikan pelajaran pemula"
    id: "Merancang dan mengajar les pemula"
    hi: "शुरुआती पाठ बनाना और पढ़ाना"
  - en: "Pick suitable materials for new learners"
    zh: "为初学者挑选合适教材"
    zh-TW: "為初學者挑選合適教材"
    ja: "初心者に合う教材を選ぶ"
    ko: "초보자에게 맞는 교재 고르기"
    vi: "Chọn tài liệu phù hợp người mới"
    ms: "Pilih bahan sesuai untuk pelajar baru"
    id: "Memilih materi cocok untuk pemula"
    hi: "नए सीखने वालों के लिए सामग्री चुनना"
  - en: "Reflect on and improve your teaching"
    zh: "反思并改进教学"
    zh-TW: "反思並改進教學"
    ja: "自分の指導を振り返り改善する"
    ko: "자신의 수업 돌아보고 개선하기"
    vi: "Tự nhìn lại và cải thiện cách dạy"
    ms: "Renung dan perbaiki pengajaran"
    id: "Merefleksikan dan memperbaiki cara mengajar"
    hi: "अपने शिक्षण पर विचार कर सुधारना"
