code: FLTV30028
year: 2026
learn:
  en: "The business of a screenwriting career: networking, a strategic plan, a graduate showcase, and a placement or research paper."
  zh: "编剧职业的商业面：人脉、战略规划、毕业展示，以及实习或研究论文。"
  zh-TW: "編劇職涯的商業面：人脈、策略規劃、畢業展示，以及實習或研究論文。"
  ja: "脚本家としてのビジネス：人脈、戦略計画、卒業ショーケース、実習または研究。"
  ko: "각본가 커리어의 비즈니스: 네트워킹, 전략 계획, 졸업 쇼케이스, 실습 또는 연구."
  vi: "Mặt kinh doanh của nghề biên kịch: kết nối, kế hoạch, showcase, thực tập hoặc nghiên cứu."
  ms: "Sisi perniagaan kerjaya penulis skrip: rangkaian, pelan strategik, penempatan atau kajian."
  id: "Sisi bisnis karier penulis naskah: jejaring, rencana strategis, magang atau riset."
  hi: "पटकथा-लेखन करियर का व्यवसाय: नेटवर्किंग, रणनीतिक योजना, शोकेस, प्लेसमेंट या शोध।"
outcomes:
  - en: "Do a 60-hour placement or a research paper"
    zh: "完成60小时实习或一篇研究论文"
    zh-TW: "完成 60 小時實習或一篇研究論文"
    ja: "60時間の実習か研究論文に取り組む"
    ko: "60시간 실습 또는 연구 논문 하기"
    vi: "Thực tập 60 giờ hoặc viết bài nghiên cứu"
    ms: "Buat penempatan 60 jam atau kertas kajian"
    id: "Magang 60 jam atau menulis makalah riset"
    hi: "60 घंटे का प्लेसमेंट या शोध-पत्र करना"
  - en: "Build your profile and network in the industry"
    zh: "建立个人形象与行业人脉"
    zh-TW: "建立個人形象與業界人脈"
    ja: "業界でのプロフィールと人脈を作る"
    ko: "업계 프로필과 인맥 만들기"
    vi: "Xây dựng hình ảnh và mạng lưới trong ngành"
    ms: "Bina profil dan rangkaian industri"
    id: "Membangun profil dan jejaring industri"
    hi: "इंडस्ट्री में प्रोफ़ाइल और नेटवर्क बनाना"
  - en: "Write a strategic plan for your career"
    zh: "为职业写一份战略规划"
    zh-TW: "為職涯寫一份策略規劃"
    ja: "キャリアの戦略計画を書く"
    ko: "커리어 전략 계획 쓰기"
    vi: "Viết kế hoạch chiến lược cho sự nghiệp"
    ms: "Tulis pelan strategik kerjaya"
    id: "Menulis rencana strategis karier"
    hi: "अपने करियर की रणनीतिक योजना लिखना"
