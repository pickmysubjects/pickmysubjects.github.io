code: UNIB10009
year: 2026
learn:
  en: "How to feed 9 billion people healthily and sustainably under climate change, hunger and conflict."
  zh: "在气候变化、饥饿与冲突下，如何健康、可持续地养活90亿人。"
  zh-TW: "在氣候變遷、飢餓與衝突下，如何健康、永續地養活90億人。"
  ja: "気候変動、飢餓、紛争のもとで90億人を健康かつ持続的に養う方法。"
  ko: "기후변화, 기아, 분쟁 속에서 90억 명을 건강하고 지속가능하게 먹이는 방법."
  vi: "Làm sao nuôi 9 tỷ người lành mạnh và bền vững trước biến đổi khí hậu, nạn đói và xung đột."
  ms: "Cara memberi makan 9 bilion orang secara sihat dan lestari di tengah perubahan iklim dan konflik."
  id: "Cara memberi makan 9 miliar orang secara sehat dan berkelanjutan di tengah krisis iklim dan konflik."
  hi: "जलवायु परिवर्तन, भूख और संघर्ष के बीच 9 अरब लोगों को स्वस्थ और टिकाऊ भोजन कैसे मिले।"
outcomes:
  - en: "Analyse causes of global food insecurity"
    zh: "分析全球粮食不安全的成因"
    zh-TW: "分析全球糧食不安全的成因"
    ja: "世界の食料不安の原因を分析する"
    ko: "세계 식량 불안의 원인을 분석한다"
    vi: "Phân tích nguyên nhân mất an ninh lương thực"
    ms: "Analisis punca ketidakjaminan makanan global"
    id: "Menganalisis penyebab kerawanan pangan global"
    hi: "वैश्विक खाद्य असुरक्षा के कारणों का विश्लेषण करें"
  - en: "Weigh impacts of food system solutions"
    zh: "权衡食物系统方案的影响"
    zh-TW: "權衡食物系統方案的影響"
    ja: "食料システムの解決策の影響を比較する"
    ko: "식량 체계 해법의 영향을 평가한다"
    vi: "Cân nhắc tác động của các giải pháp hệ thống lương thực"
    ms: "Nilai kesan penyelesaian sistem makanan"
    id: "Menimbang dampak solusi sistem pangan"
    hi: "खाद्य प्रणाली समाधानों के प्रभाव तौलें"
  - en: "Explain how climate change threatens food supply"
    zh: "解释气候变化如何威胁粮食供应"
    zh-TW: "解釋氣候變遷如何威脅糧食供應"
    ja: "気候変動が食料供給をどう脅かすか説明する"
    ko: "기후변화가 식량 공급을 위협하는 방식 설명하기"
    vi: "Giải thích biến đổi khí hậu đe dọa nguồn cung lương thực ra sao"
    ms: "Terangkan cara perubahan iklim mengancam bekalan makanan"
    id: "Menjelaskan cara perubahan iklim mengancam pasokan pangan"
    hi: "समझाना कि जलवायु परिवर्तन खाने की आपूर्ति के लिए कैसे ख़तरा है"
