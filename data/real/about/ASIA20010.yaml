code: ASIA20010
year: 2027
learn:
  en: "How trade, investment, sanctions and tech like chips and EVs shape power in Korea, Japan, China and Taiwan."
  zh: "贸易、投资、制裁以及芯片、电动车等技术如何影响韩国、朝鲜、日本、中国和台湾的权力格局。"
  zh-TW: "貿易、投資、制裁以及晶片、電動車等技術如何影響南韓、北韓、日本、中國和台灣的權力格局。"
  ja: "貿易・投資・制裁、半導体やEVなどの技術が、韓国・北朝鮮・日本・中国・台湾の力関係をどう形づくるか。"
  ko: "무역·투자·제재와 반도체·전기차 같은 기술이 한국·북한·일본·중국·대만의 권력을 어떻게 좌우하는지."
  vi: "Thương mại, đầu tư, cấm vận và công nghệ như chip, xe điện định hình quyền lực ở Hàn Quốc, Triều Tiên, Nhật Bản, Trung Quốc và Đài Loan ra sao."
  ms: "Bagaimana perdagangan, pelaburan, sekatan dan teknologi seperti cip dan EV membentuk kuasa di Korea, Jepun, China dan Taiwan."
  id: "Bagaimana perdagangan, investasi, sanksi, dan teknologi seperti cip dan mobil listrik membentuk kekuasaan di Korea, Jepang, Tiongkok, dan Taiwan."
  hi: "व्यापार, निवेश, प्रतिबंध और चिप्स व EV जैसी तकनीक कोरिया, जापान, चीन और ताइवान में सत्ता को कैसे आकार देते हैं।"
