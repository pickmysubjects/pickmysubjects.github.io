code: NEUR20001
year: 2026
learn:
  en: "An intro to the nervous system: brain structure, nerve cells and how they pass on information."
  zh: "神经系统入门：大脑结构、神经细胞，以及它们怎么传递信息。"
  zh-TW: "神經系統入門：大腦結構、神經細胞，以及它們怎麼傳遞訊息。"
  ja: "神経系の入門：脳の構造、神経細胞、そして情報の伝え方。"
  ko: "신경계 입문: 뇌 구조, 신경세포, 그리고 정보 전달 방식."
  vi: "Nhập môn hệ thần kinh: cấu trúc não, tế bào thần kinh và cách chúng truyền thông tin."
  ms: "Pengenalan sistem saraf: struktur otak, sel saraf dan cara ia menyampaikan maklumat."
  id: "Pengantar sistem saraf: struktur otak, sel saraf, dan cara mereka meneruskan informasi."
  hi: "तंत्रिका तंत्र का परिचय: दिमाग की बनावट, तंत्रिका कोशिकाएँ और वे जानकारी कैसे आगे भेजती हैं।"
outcomes:
  - en: "Explain basic principles of neuroscience"
    zh: "解释神经科学的基本原理"
    zh-TW: "解釋神經科學的基本原理"
    ja: "神経科学の基本原理を説明する"
    ko: "신경과학의 기본 원리 설명하기"
    vi: "Giải thích nguyên lý cơ bản của khoa học thần kinh"
    ms: "Menerangkan prinsip asas neurosains"
    id: "Menjelaskan prinsip dasar neurosains"
    hi: "न्यूरोसाइंस के बुनियादी सिद्धांत समझाना"
  - en: "Explain a neuroscience idea to a general audience"
    zh: "向普通人讲清一个神经科学概念"
    zh-TW: "向一般人講清楚一個神經科學概念"
    ja: "神経科学の考えを一般の人に説明する"
    ko: "신경과학 개념을 일반인에게 설명하기"
    vi: "Giải thích một ý tưởng thần kinh học cho người bình thường"
    ms: "Menerangkan idea neurosains kepada orang awam"
    id: "Menjelaskan konsep neurosains ke orang awam"
    hi: "न्यूरोसाइंस का कोई विचार आम लोगों को समझाना"
  - en: "Combine information from several sources"
    zh: "整合多种来源的信息"
    zh-TW: "整合多種來源的資訊"
    ja: "複数の情報源をまとめる"
    ko: "여러 출처의 정보 종합하기"
    vi: "Kết hợp thông tin từ nhiều nguồn"
    ms: "Menggabungkan maklumat daripada beberapa sumber"
    id: "Menggabungkan informasi dari beberapa sumber"
    hi: "कई स्रोतों की जानकारी जोड़ना"
