code: ABPL90273
year: 2027
learn:
  en: "An advanced urban design studio: in-depth design exercises leading to a major exploratory proposal, including urban analytics."
  zh: "进阶城市设计工作室：深入的设计练习，最终形成一个大型探索性方案，包括城市分析。"
  zh-TW: "進階都市設計工作室：深入的設計練習，最終形成大型探索性方案，包括都市分析。"
  ja: "上級都市デザインスタジオ：深い設計課題から大きな探索的提案へ。都市分析も使う。"
  ko: "심화 도시설계 스튜디오: 심층 과제를 거쳐 탐구적 대형 제안까지, 도시 분석 포함."
  vi: "Studio thiết kế đô thị nâng cao: bài tập chuyên sâu dẫn tới đề xuất lớn, có phân tích đô thị."
  ms: "Studio reka bentuk bandar lanjutan: latihan mendalam membawa kepada cadangan besar."
  id: "Studio desain kota lanjutan: latihan mendalam menuju usulan besar, dengan analitik kota."
  hi: "उन्नत शहरी डिज़ाइन स्टूडियो: गहन अभ्यासों से बड़े खोजपूर्ण प्रस्ताव तक, शहरी विश्लेषण सहित।"
outcomes:
  - en: "Develop an exploratory urban design proposal"
    zh: "提出探索性的城市设计方案"
    zh-TW: "提出探索性的都市設計方案"
    ja: "探索的な都市デザイン案を作る"
    ko: "탐구적 도시설계안 개발하기"
    vi: "Phát triển đề xuất thiết kế đô thị"
    ms: "Membangun cadangan reka bentuk bandar"
    id: "Mengembangkan usulan desain kota eksploratif"
    hi: "खोजपूर्ण शहरी डिज़ाइन प्रस्ताव बनाना"
  - en: "Present and defend design work at a jury review"
    zh: "在评审中展示并为设计辩护"
    zh-TW: "在評圖中展示並為設計辯護"
    ja: "講評会で設計を発表し説明する"
    ko: "심사에서 설계를 발표·방어하기"
    vi: "Trình bày và bảo vệ thiết kế trước hội đồng"
    ms: "Membentang dan mempertahankan reka bentuk"
    id: "Mempresentasikan dan mempertahankan desain"
    hi: "जूरी के सामने डिज़ाइन प्रस्तुत करना"
