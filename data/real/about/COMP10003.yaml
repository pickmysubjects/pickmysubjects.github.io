code: COMP10003
year: 2026
learn:
  en: "Beginner programming focused on media: editing images, showing data and building simple web content."
  zh: "零基础编程，侧重图片处理、数据展示和简单网页。"
  zh-TW: "零基礎程式設計，著重圖片處理、資料呈現和簡單網頁。"
  ja: "メディア向けの初心者プログラミング：画像編集、データ表示、簡単なWebコンテンツ作成。"
  ko: "미디어 중심의 입문 프로그래밍: 이미지 편집, 데이터 표현, 간단한 웹 콘텐츠 제작."
  vi: "Lập trình cơ bản tập trung vào media: chỉnh ảnh, trình bày dữ liệu và làm nội dung web đơn giản."
  ms: "Pengaturcaraan asas berfokus media: sunting imej, paparkan data dan bina kandungan web ringkas."
  id: "Pemrograman dasar berfokus media: mengedit gambar, menampilkan data, dan membuat konten web sederhana."
  hi: "मीडिया पर केंद्रित शुरुआती प्रोग्रामिंग: इमेज एडिट करना, डेटा दिखाना और सरल वेब कंटेंट बनाना।"
outcomes:
  - en: "Write Python programs that work with data"
    zh: "写Python程序处理数据"
    zh-TW: "寫Python程式處理資料"
    ja: "データを扱うPythonプログラムを書く"
    ko: "데이터를 다루는 Python 프로그램 작성"
    vi: "Viết chương trình Python xử lý dữ liệu"
    ms: "Tulis program Python untuk mengolah data"
    id: "Menulis program Python untuk mengolah data"
    hi: "डेटा पर काम करने वाले Python प्रोग्राम लिखना"
  - en: "Test ideas with paper and digital prototypes"
    zh: "用纸面和数字原型检验想法"
    zh-TW: "用紙本和數位原型驗證想法"
    ja: "紙とデジタルのプロトタイプでアイデアを検証する"
    ko: "종이·디지털 프로토타입으로 아이디어 검증"
    vi: "Kiểm tra ý tưởng bằng prototype giấy và số"
    ms: "Uji idea dengan prototaip kertas dan digital"
    id: "Menguji ide dengan prototipe kertas dan digital"
    hi: "पेपर और डिजिटल प्रोटोटाइप से आइडिया टेस्ट करना"
  - en: "Show data clearly to non-technical people"
    zh: "把数据讲清楚给非技术人员"
    zh-TW: "把資料清楚呈現給非技術人員"
    ja: "技術者でない人にデータをわかりやすく示す"
    ko: "비전문가에게 데이터를 명확히 보여주기"
    vi: "Trình bày dữ liệu rõ ràng cho người không chuyên"
    ms: "Paparkan data dengan jelas kepada orang bukan teknikal"
    id: "Menyajikan data dengan jelas ke orang awam"
    hi: "गैर-तकनीकी लोगों को डेटा साफ़ दिखाना"
