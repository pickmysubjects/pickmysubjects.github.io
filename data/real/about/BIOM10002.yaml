code: BIOM10002
year: 2026
learn:
  en: "Big ideas in biology, like evolution and how body systems are controlled, applied to human health and disease."
  zh: "生物学的几个核心概念，比如进化和身体系统的调控，以及它们在人类健康和疾病中的应用。"
  zh-TW: "生物學的幾個核心概念，例如演化和身體系統的調控，以及它們在人類健康和疾病中的應用。"
  ja: "進化や体の仕組みの調節など生物学の大きな考え方を、人の健康と病気に当てはめて学ぶ。"
  ko: "진화, 신체 조절 같은 생물학의 핵심 개념을 사람의 건강과 질병에 적용해 배운다."
  vi: "Các ý tưởng lớn của sinh học như tiến hóa và cách cơ thể tự điều hòa, áp dụng vào sức khỏe và bệnh tật ở người."
  ms: "Idea utama biologi seperti evolusi dan kawalan sistem badan, digunakan untuk memahami kesihatan dan penyakit manusia."
  id: "Konsep besar biologi seperti evolusi dan pengaturan sistem tubuh, diterapkan pada kesehatan dan penyakit manusia."
  hi: "जीवविज्ञान के बड़े विचार, जैसे विकास और शरीर के सिस्टम का नियंत्रण, इंसानी स्वास्थ्य और बीमारी पर लागू करना।"
outcomes:
  - en: "Explain how cells build up into organs and body systems"
    zh: "解释细胞如何组成器官和身体系统"
    zh-TW: "解釋細胞如何組成器官和身體系統"
    ja: "細胞が器官や器官系になる仕組みを説明する"
    ko: "세포가 기관과 신체 계통을 이루는 방식 설명하기"
    vi: "Giải thích tế bào hợp thành cơ quan và hệ cơ quan thế nào"
    ms: "Terangkan bagaimana sel membentuk organ dan sistem badan"
    id: "Menjelaskan bagaimana sel membentuk organ dan sistem tubuh"
    hi: "समझाना कि कोशिकाएँ कैसे अंग और शरीर के सिस्टम बनाती हैं"
  - en: "Link core biology ideas to real diseases"
    zh: "把生物学核心概念和真实疾病联系起来"
    zh-TW: "把生物學核心概念和真實疾病連結起來"
    ja: "生物学の基本概念を実際の病気と結びつける"
    ko: "생물학 핵심 개념을 실제 질병과 연결하기"
    vi: "Liên hệ các ý tưởng sinh học cốt lõi với bệnh thực tế"
    ms: "Kaitkan idea asas biologi dengan penyakit sebenar"
    id: "Menghubungkan konsep inti biologi dengan penyakit nyata"
    hi: "बायोलॉजी के मुख्य विचारों को असली बीमारियों से जोड़ना"
  - en: "Find research papers and present science clearly"
    zh: "查找文献并清楚地讲解科学内容"
    zh-TW: "查找文獻並清楚地講解科學內容"
    ja: "論文を探し、科学の内容をわかりやすく伝える"
    ko: "논문을 찾고 과학 내용을 명확히 전달하기"
    vi: "Tìm tài liệu nghiên cứu và trình bày khoa học rõ ràng"
    ms: "Cari kertas penyelidikan dan sampaikan sains dengan jelas"
    id: "Mencari artikel ilmiah dan menyampaikan sains dengan jelas"
    hi: "रिसर्च पेपर ढूँढना और विज्ञान को साफ़ तरीके से पेश करना"
