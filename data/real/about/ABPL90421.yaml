code: ABPL90421
year: 2027
learn:
  en: "Philosophical ideas from 20th and 21st century thinkers applied to design, architecture, gender and society."
  zh: "把20和21世纪思想家的哲学观点应用到设计、建筑、性别和社会问题上。"
  zh-TW: "把20和21世紀思想家的哲學觀點應用到設計、建築、性別和社會問題上。"
  ja: "20〜21世紀の哲学者の考えをデザイン・建築・ジェンダー・社会に当てはめる。"
  ko: "20~21세기 사상가의 철학을 디자인, 건축, 젠더, 사회에 적용합니다."
  vi: "Áp dụng tư tưởng triết học thế kỷ 20–21 vào thiết kế, kiến trúc, giới và xã hội."
  ms: "Idea falsafah abad ke-20 dan 21 diterapkan pada reka bentuk, seni bina, gender dan masyarakat."
  id: "Gagasan filsafat abad ke-20 dan 21 diterapkan pada desain, arsitektur, gender, dan masyarakat."
  hi: "20वीं-21वीं सदी के दार्शनिक विचारों को डिज़ाइन, वास्तुकला, जेंडर और समाज पर लागू करना।"
outcomes:
  - en: "Analyse design with philosophical concepts"
    zh: "用哲学概念分析设计"
    zh-TW: "用哲學概念分析設計"
    ja: "哲学の概念で設計を分析する"
    ko: "철학 개념으로 디자인 분석하기"
    vi: "Phân tích thiết kế bằng khái niệm triết học"
    ms: "Menganalisis reka bentuk dengan konsep falsafah"
    id: "Menganalisis desain dengan konsep filsafat"
    hi: "दार्शनिक अवधारणाओं से डिज़ाइन का विश्लेषण"
  - en: "Write an illustrated essay"
    zh: "撰写图文论文"
    zh-TW: "撰寫圖文論文"
    ja: "図版入りエッセイを書く"
    ko: "도판이 있는 에세이 쓰기"
    vi: "Viết bài luận có minh họa"
    ms: "Menulis esei berilustrasi"
    id: "Menulis esai bergambar"
    hi: "सचित्र निबंध लिखना"
