code: BMEN90011
year: 2027
learn:
  en: "Using stem cells, biomaterials and scaffolds to grow replacement tissue."
  zh: "利用干细胞、生物材料和支架培育替代组织。"
  zh-TW: "利用幹細胞、生醫材料與支架培育替代組織。"
  ja: "幹細胞、生体材料、足場を使って代替組織をつくる。"
  ko: "줄기세포, 생체재료, 지지체로 대체 조직 만들기."
  vi: "Dùng tế bào gốc, vật liệu sinh học và giàn đỡ để tạo mô thay thế."
  ms: "Menggunakan sel stem, biobahan dan perancah untuk menghasilkan tisu ganti."
  id: "Memakai sel punca, biomaterial, dan scaffold untuk menumbuhkan jaringan pengganti."
  hi: "स्टेम सेल, बायोमटेरियल और स्कैफ़ोल्ड से प्रतिस्थापन ऊतक बनाना।"
outcomes:
  - en: "Describe how scaffolds are designed, made and chosen"
    zh: "描述支架的设计、制造和选材"
    zh-TW: "描述支架的設計、製造與選材"
    ja: "足場の設計・製作・材料選びを説明する"
    ko: "지지체의 설계, 제작, 재료 선택 설명하기"
    vi: "Mô tả cách thiết kế, chế tạo và chọn vật liệu giàn đỡ"
    ms: "Menerangkan reka bentuk, pembuatan dan pemilihan perancah"
    id: "Menjelaskan desain, pembuatan, dan pemilihan scaffold"
    hi: "स्कैफ़ोल्ड के डिज़ाइन, निर्माण और चयन का वर्णन"
  - en: "Discuss stem cell sources and their challenges"
    zh: "讨论干细胞的来源及其难点"
    zh-TW: "討論幹細胞的來源與挑戰"
    ja: "幹細胞の入手源と課題を論じる"
    ko: "줄기세포의 출처와 과제 논의하기"
    vi: "Thảo luận nguồn tế bào gốc và các thách thức"
    ms: "Membincangkan sumber sel stem dan cabarannya"
    id: "Membahas sumber sel punca dan tantangannya"
    hi: "स्टेम सेल के स्रोत और चुनौतियों पर चर्चा"
  - en: "Explain the ethics and regulation of tissue engineering"
    zh: "解释组织工程的伦理和监管问题"
    zh-TW: "解釋組織工程的倫理與法規問題"
    ja: "組織工学の倫理と規制を説明する"
    ko: "조직공학의 윤리와 규제 설명하기"
    vi: "Giải thích đạo đức và quy định trong kỹ thuật mô"
    ms: "Menerangkan etika dan peraturan kejuruteraan tisu"
    id: "Menjelaskan etika dan regulasi rekayasa jaringan"
    hi: "टिशू इंजीनियरिंग की नैतिकता और नियमन समझाना"
