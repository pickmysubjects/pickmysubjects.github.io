code: MAST30037
year: 2027
learn:
  en: "A mathematician's take on fluid dynamics: deriving the conservation equations and solving classic flow problems."
  zh: "从数学角度学流体力学：推导守恒方程，求解经典流动问题。"
  zh-TW: "從數學角度學流體力學：推導守恆方程，求解經典流動問題。"
  ja: "数学者の視点で学ぶ流体力学：保存方程式を導き、古典的な流れの問題を解く。"
  ko: "수학자의 시각으로 보는 유체역학: 보존 방정식을 유도하고 대표적인 유동 문제 풀기."
  vi: "Động lực học chất lưu theo cách của nhà toán học: suy ra phương trình bảo toàn và giải các bài toán dòng chảy kinh điển."
  ms: "Dinamik bendalir dari sudut ahli matematik: terbitkan persamaan keabadian dan selesaikan masalah aliran klasik."
  id: "Dinamika fluida dari sudut pandang matematikawan: menurunkan persamaan kekekalan dan menyelesaikan soal aliran klasik."
  hi: "गणितज्ञ की नज़र से द्रव गतिकी: संरक्षण समीकरण निकालना और क्लासिक प्रवाह समस्याएँ हल करना।"
outcomes:
  - en: "Explain mass and momentum conservation in fluids"
    zh: "解释流体中的质量和动量守恒"
    zh-TW: "解釋流體中的質量和動量守恆"
    ja: "流体の質量・運動量保存を説明する"
    ko: "유체의 질량·운동량 보존 설명하기"
    vi: "Giải thích bảo toàn khối lượng và động lượng trong chất lưu"
    ms: "Terangkan keabadian jisim dan momentum dalam bendalir"
    id: "Menjelaskan kekekalan massa dan momentum dalam fluida"
    hi: "द्रवों में द्रव्यमान और संवेग संरक्षण समझाना"
  - en: "Derive the Navier-Stokes equations from first principles"
    zh: "从基本原理推导纳维-斯托克斯方程"
    zh-TW: "從基本原理推導納維-斯托克斯方程"
    ja: "ナビエ–ストークス方程式を基本原理から導く"
    ko: "나비에-스토크스 방정식을 기본 원리로 유도하기"
    vi: "Suy ra phương trình Navier-Stokes từ nguyên lý cơ bản"
    ms: "Terbitkan persamaan Navier-Stokes daripada prinsip asas"
    id: "Menurunkan persamaan Navier-Stokes dari prinsip dasar"
    hi: "मूल सिद्धांतों से नेवियर-स्टोक्स समीकरण निकालना"
  - en: "Solve classic flow problems with scaling methods"
    zh: "用尺度分析等方法求解经典流体问题"
    zh-TW: "用尺度分析等方法求解經典流體問題"
    ja: "スケーリングなどで古典的な流体問題を解く"
    ko: "스케일링 방법으로 대표적인 유체 문제 풀기"
    vi: "Giải bài toán chất lưu kinh điển bằng phương pháp tỷ lệ"
    ms: "Selesaikan masalah bendalir klasik dengan kaedah penskalaan"
    id: "Menyelesaikan soal fluida klasik dengan metode penskalaan"
    hi: "स्केलिंग विधियों से क्लासिक द्रव समस्याएँ हल करना"
