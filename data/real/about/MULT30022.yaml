code: MULT30022
year: 2026
learn:
  en: "An on-Country exchange at Budj Bim with the Gunditjmara community, studying Indigenous engineering such as eel aquaculture."
  zh: "在Budj Bim与Gunditjmara社群进行实地交流，学习鳗鱼养殖等原住民工程。"
  zh-TW: "在Budj Bim與Gunditjmara社群進行實地交流，學習鰻魚養殖等原住民工程。"
  ja: "バジ・ビムでグンディッジマラの人々と現地で学び合い、ウナギの養殖などの先住民の工学を学ぶ。"
  ko: "버지 빔에서 군디츠마라 공동체와 현장 교류하며 장어 양식 같은 원주민 공학을 배운다."
  vi: "Giao lưu thực địa tại Budj Bim với cộng đồng Gunditjmara, tìm hiểu kỹ thuật bản địa như hệ thống nuôi lươn."
  ms: "Pertukaran di tanah Budj Bim bersama komuniti Gunditjmara, mengkaji kejuruteraan Orang Asal seperti akuakultur belut."
  id: "Pertukaran langsung di Budj Bim bersama komunitas Gunditjmara, mempelajari rekayasa adat seperti budidaya belut."
  hi: "बुज बिम में गुंडिजमारा समुदाय के साथ स्थल पर आदान-प्रदान, ईल पालन जैसी मूलनिवासी इंजीनियरिंग का अध्ययन।"
outcomes:
  - en: "Describe examples of Indigenous engineering"
    zh: "描述原住民工程的实例"
    zh-TW: "描述原住民工程的實例"
    ja: "先住民の工学の例を説明する"
    ko: "원주민 공학 사례 설명하기"
    vi: "Mô tả các ví dụ về kỹ thuật bản địa"
    ms: "Huraikan contoh kejuruteraan Orang Asal"
    id: "Mendeskripsikan contoh rekayasa adat"
    hi: "मूलनिवासी इंजीनियरिंग के उदाहरणों का वर्णन करना"
  - en: "Learn through two-way exchange on Country"
    zh: "通过在土地上的双向交流来学习"
    zh-TW: "透過在土地上的雙向交流來學習"
    ja: "現地での双方向の交流を通して学ぶ"
    ko: "현장에서 쌍방향 교류로 배우기"
    vi: "Học qua trao đổi hai chiều tại vùng đất"
    ms: "Belajar melalui pertukaran dua hala di tanah"
    id: "Belajar lewat pertukaran dua arah di Country"
    hi: "भूमि पर दोतरफ़ा आदान-प्रदान से सीखना"
  - en: "Apply these ideas to design projects"
    zh: "把这些理念用于设计项目"
    zh-TW: "把這些理念用於設計專案"
    ja: "これらの考えを設計プロジェクトに生かす"
    ko: "이 생각을 설계 프로젝트에 적용하기"
    vi: "Áp dụng các ý tưởng này vào dự án thiết kế"
    ms: "Gunakan idea ini dalam projek reka bentuk"
    id: "Menerapkan gagasan ini pada proyek desain"
    hi: "इन विचारों को डिज़ाइन प्रोजेक्ट में लागू करना"
