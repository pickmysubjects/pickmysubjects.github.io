code: GEND20008
year: 2026
learn:
  en: "Feminist theory and activism today, from reform to revolution, across family, work, religion and rights."
  zh: "当今的女性主义理论与行动，从改良到革命，涉及家庭、工作、宗教和权利。"
  zh-TW: "當今的女性主義理論與行動，從改良到革命，涉及家庭、工作、宗教和權利。"
  ja: "改良から革命まで、家族・仕事・宗教・権利をめぐる今日のフェミニズム理論と運動を学ぶ。"
  ko: "개혁에서 혁명까지, 가족·일·종교·권리를 둘러싼 오늘날의 페미니즘 이론과 운동을 배운다."
  vi: "Lý thuyết và hoạt động nữ quyền ngày nay, từ cải cách đến cách mạng, trong gia đình, công việc, tôn giáo và quyền."
  ms: "Teori dan aktivisme feminis hari ini, daripada reformasi hingga revolusi, merentas keluarga, kerja, agama dan hak."
  id: "Teori dan aktivisme feminis masa kini, dari reformasi hingga revolusi, di bidang keluarga, kerja, agama, dan hak."
  hi: "आज का नारीवादी सिद्धांत और सक्रियता, सुधार से क्रांति तक, परिवार, काम, धर्म और अधिकारों में।"
outcomes:
  - en: "Compare reform and radical feminist traditions"
    zh: "比较改良派与激进派女性主义传统"
    zh-TW: "比較改良派與激進派女性主義傳統"
    ja: "改良派と急進派のフェミニズムを比べる"
    ko: "개혁적·급진적 페미니즘 전통 비교하기"
    vi: "So sánh truyền thống nữ quyền cải cách và cấp tiến"
    ms: "Bandingkan tradisi feminis reformis dan radikal"
    id: "Membandingkan tradisi feminis reformis dan radikal"
    hi: "सुधारवादी और क्रांतिकारी नारीवादी परंपराओं की तुलना करना"
  - en: "Analyse gender inequality in key areas of life"
    zh: "分析生活重要领域中的性别不平等"
    zh-TW: "分析生活重要領域中的性別不平等"
    ja: "生活の主要な場面での男女格差を分析する"
    ko: "삶의 주요 영역에서 성별 불평등 분석하기"
    vi: "Phân tích bất bình đẳng giới trong các lĩnh vực đời sống"
    ms: "Analisis ketaksamaan gender dalam bidang utama hidup"
    id: "Menganalisis ketimpangan gender di bidang utama kehidupan"
    hi: "जीवन के मुख्य क्षेत्रों में लैंगिक असमानता का विश्लेषण करना"
  - en: "Assess feminist tactics and their tensions"
    zh: "评估女性主义策略及其内部张力"
    zh-TW: "評估女性主義策略及其內部張力"
    ja: "フェミニズムの戦術とその対立を評価する"
    ko: "페미니즘 전략과 그 긴장 평가하기"
    vi: "Đánh giá các chiến thuật nữ quyền và mâu thuẫn của chúng"
    ms: "Nilai taktik feminis dan ketegangannya"
    id: "Menilai taktik feminis dan ketegangannya"
    hi: "नारीवादी रणनीतियों और उनके तनावों का आकलन करना"
