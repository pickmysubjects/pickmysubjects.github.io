code: FOOD10001
year: 2026
learn:
  en: "Learn how beer is brewed and how to judge its styles by taste and smell, with weekly tastings and a brewery visit."
  zh: "学习啤酒的酿造方式，并通过品尝和闻香判断风格，每周品鉴，还参观酒厂。"
  zh-TW: "學習啤酒的釀造方式，並透過品嚐與聞香判斷風格，每週品飲，還參訪酒廠。"
  ja: "ビールの醸造法と、味と香りでスタイルを見分ける方法。毎週の試飲と醸造所見学あり。"
  ko: "맥주 양조법과 맛·향으로 스타일을 판단하는 법. 매주 시음과 양조장 방문."
  vi: "Học cách nấu bia và phân biệt kiểu bia qua vị, mùi; nếm hằng tuần, thăm xưởng."
  ms: "Belajar cara bir dibancuh dan menilai gayanya melalui rasa dan bau, dengan lawatan kilang."
  id: "Belajar cara bir diseduh dan menilai gayanya lewat rasa dan aroma, plus kunjungan pabrik."
  hi: "बीयर कैसे बनती है और स्वाद-गंध से शैली कैसे पहचानें, साप्ताहिक टेस्टिंग और ब्रुअरी विज़िट।"
outcomes:
  - en: "Explain the main brewing steps and ingredients"
    zh: "说明酿造的主要步骤和原料"
    zh-TW: "說明釀造的主要步驟與原料"
    ja: "醸造の主な工程と原料を説明する"
    ko: "주요 양조 단계와 재료 설명하기"
    vi: "Giải thích bước nấu và nguyên liệu chính"
    ms: "Jelaskan langkah dan bahan utama"
    id: "Menjelaskan tahap dan bahan utama"
    hi: "बीयर बनाने के चरण और सामग्री समझाना"
  - en: "Identify beer styles by sensory analysis"
    zh: "用感官分析识别啤酒风格"
    zh-TW: "用感官分析辨識啤酒風格"
    ja: "官能評価でビールの種類を見分ける"
    ko: "관능 평가로 맥주 스타일 구별하기"
    vi: "Nhận diện kiểu bia bằng cảm quan"
    ms: "Kenal pasti gaya bir melalui deria"
    id: "Mengenali gaya bir lewat uji indra"
    hi: "संवेदी विश्लेषण से बीयर शैली पहचानना"
  - en: "Spot common faults in beer"
    zh: "识别啤酒的常见缺陷"
    zh-TW: "辨識啤酒的常見缺陷"
    ja: "ビールのよくある欠陥を見つける"
    ko: "맥주의 흔한 결함 찾기"
    vi: "Phát hiện lỗi thường gặp trong bia"
    ms: "Kesan kecacatan biasa dalam bir"
    id: "Mengenali cacat umum pada bir"
    hi: "बीयर की आम ख़ामियाँ पहचानना"
