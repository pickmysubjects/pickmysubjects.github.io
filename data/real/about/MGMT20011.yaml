code: MGMT20011
year: 2026
learn:
  en: "How to negotiate in business, from contracts and debts to workplace deals, practised through bargaining simulations."
  zh: "商务谈判：从合同、债务到职场协商，通过模拟谈判练习。"
  zh-TW: "商務談判：從契約、債務到職場協商，透過模擬談判練習。"
  ja: "ビジネス交渉：契約や債務から職場の交渉まで、模擬交渉で練習する。"
  ko: "비즈니스 협상: 계약·채무부터 직장 협상까지, 모의 협상으로 연습."
  vi: "Đàm phán trong kinh doanh, từ hợp đồng, nợ đến thỏa thuận nơi làm việc, luyện qua các bài mô phỏng."
  ms: "Cara berunding dalam perniagaan, dari kontrak dan hutang hingga tempat kerja, dilatih melalui simulasi."
  id: "Cara bernegosiasi dalam bisnis, dari kontrak dan utang sampai urusan kerja, dilatih lewat simulasi."
  hi: "बिज़नेस में मोलभाव कैसे करें, अनुबंध और कर्ज़ से कार्यस्थल तक, सिमुलेशन से अभ्यास के साथ।"
outcomes:
  - en: "Understand the main theories of negotiation"
    zh: "理解主要的谈判理论"
    zh-TW: "理解主要的談判理論"
    ja: "交渉の主な理論を理解する"
    ko: "주요 협상 이론 이해"
    vi: "Hiểu các lý thuyết đàm phán chính"
    ms: "Fahami teori utama rundingan"
    id: "Memahami teori-teori utama negosiasi"
    hi: "मोलभाव के मुख्य सिद्धांत समझना"
  - en: "Plan and run a negotiation strategically"
    zh: "有策略地规划和进行谈判"
    zh-TW: "有策略地規劃和進行談判"
    ja: "戦略的に交渉を計画し進める"
    ko: "전략적으로 협상 계획·진행"
    vi: "Lập kế hoạch và tiến hành đàm phán có chiến lược"
    ms: "Rancang dan jalankan rundingan secara strategik"
    id: "Merencanakan dan menjalankan negosiasi secara strategis"
    hi: "रणनीति के साथ बातचीत की योजना बनाना और चलाना"
  - en: "Use evidence to make decisions while bargaining"
    zh: "在谈判中用证据做决定"
    zh-TW: "在談判中用證據做決定"
    ja: "交渉中に根拠を使って判断する"
    ko: "협상 중 근거로 결정 내리기"
    vi: "Dùng bằng chứng để quyết định khi thương lượng"
    ms: "Guna bukti untuk buat keputusan semasa berunding"
    id: "Memakai bukti untuk mengambil keputusan saat tawar-menawar"
    hi: "मोलभाव के दौरान सबूत से फ़ैसले लेना"
