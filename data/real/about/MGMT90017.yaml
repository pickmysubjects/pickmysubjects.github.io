code: MGMT90017
year: 2027
learn:
  en: "Practical skills for HR consulting projects: methods, client relationships, report writing and judging outcomes."
  zh: "人力资源咨询项目的实用技能：方法、客户关系、报告写作和成效评估。"
  zh-TW: "人資顧問專案的實用技能：方法、客戶關係、報告撰寫與成效評估。"
  ja: "人事コンサルティングの実践スキル：手法、顧客との関係、報告書作成、成果の評価。"
  ko: "인사 컨설팅 프로젝트 실무: 방법론, 고객 관계, 보고서 작성, 성과 평가."
  vi: "Kỹ năng thực tế cho dự án tư vấn nhân sự: phương pháp, quan hệ khách hàng, viết báo cáo, đánh giá kết quả."
  ms: "Kemahiran praktikal untuk projek perundingan HR: kaedah, hubungan pelanggan, penulisan laporan dan menilai hasil."
  id: "Keterampilan praktis proyek konsultasi SDM: metode, hubungan klien, penulisan laporan dan menilai hasil."
  hi: "HR कंसल्टिंग प्रोजेक्ट के व्यावहारिक कौशल: तरीके, क्लाइंट संबंध, रिपोर्ट लेखन और नतीजों का आकलन।"
outcomes:
  - en: "Design, run and evaluate a consulting project"
    zh: "设计、开展并评估咨询项目"
    zh-TW: "設計、執行並評估顧問專案"
    ja: "コンサル案件を設計・実施・評価する"
    ko: "컨설팅 프로젝트 설계·수행·평가하기"
    vi: "Thiết kế, thực hiện và đánh giá dự án tư vấn"
    ms: "Mereka, menjalankan dan menilai projek perundingan"
    id: "Merancang, menjalankan dan menilai proyek konsultasi"
    hi: "कंसल्टिंग प्रोजेक्ट बनाना, चलाना और आँकना"
  - en: "Build and keep client relationships"
    zh: "建立并维护客户关系"
    zh-TW: "建立並維繫客戶關係"
    ja: "顧客との関係を築き維持する"
    ko: "고객 관계 구축·유지하기"
    vi: "Xây dựng và duy trì quan hệ khách hàng"
    ms: "Membina dan mengekalkan hubungan pelanggan"
    id: "Membangun dan menjaga hubungan klien"
    hi: "क्लाइंट संबंध बनाना और बनाए रखना"
