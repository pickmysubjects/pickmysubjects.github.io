code: ATOC20001
year: 2026
learn:
  en: "Why climate change shows up as more extreme weather, from thunderstorms and El Niño to climate models."
  zh: "气候变化为何带来更多极端天气：从雷暴、厄尔尼诺到气候模型。"
  zh-TW: "氣候變遷為何帶來更多極端天氣：從雷暴、聖嬰現象到氣候模型。"
  ja: "気候変動が極端気象として現れる理由：雷雨、エルニーニョ、気候モデル。"
  ko: "기후변화가 극한 기상으로 나타나는 이유: 뇌우, 엘니뇨, 기후 모델."
  vi: "Vì sao biến đổi khí hậu gây thời tiết cực đoan: từ dông bão, El Niño đến mô hình khí hậu."
  ms: "Mengapa perubahan iklim membawa cuaca ekstrem: ribut petir, El Niño hingga model iklim."
  id: "Mengapa perubahan iklim memicu cuaca ekstrem: badai petir, El Niño, hingga model iklim."
  hi: "जलवायु परिवर्तन चरम मौसम क्यों लाता है: तूफ़ान, अल नीनो से जलवायु मॉडल तक।"
outcomes:
  - en: "Describe large-scale air circulation patterns"
    zh: "描述大尺度大气环流"
    zh-TW: "描述大尺度大氣環流"
    ja: "大規模な大気循環を説明する"
    ko: "대규모 대기 순환 설명하기"
    vi: "Mô tả hoàn lưu khí quyển quy mô lớn"
    ms: "Huraikan corak edaran udara berskala besar"
    id: "Mendeskripsikan sirkulasi atmosfer skala besar"
    hi: "बड़े पैमाने के वायु परिसंचरण का वर्णन करें"
  - en: "Analyse what drives extreme weather events"
    zh: "分析极端天气的成因"
    zh-TW: "分析極端天氣的成因"
    ja: "極端気象の要因を分析する"
    ko: "극한 기상 원인 분석하기"
    vi: "Phân tích nguyên nhân thời tiết cực đoan"
    ms: "Analisis punca cuaca ekstrem"
    id: "Menganalisis pemicu cuaca ekstrem"
    hi: "चरम मौसम के कारणों का विश्लेषण करें"
  - en: "Use field methods to monitor climate"
    zh: "用实地方法监测气候"
    zh-TW: "用實地方法監測氣候"
    ja: "野外手法で気候を観測する"
    ko: "현장 기법으로 기후 관측하기"
    vi: "Dùng phương pháp thực địa theo dõi khí hậu"
    ms: "Guna kaedah lapangan memantau iklim"
    id: "Memakai metode lapangan memantau iklim"
    hi: "फ़ील्ड तरीकों से जलवायु की निगरानी करें"
