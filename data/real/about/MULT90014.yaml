code: MULT90014
year: 2027
learn:
  en: "Business risks from operational to strategic, and enterprise risk management tools such as risk scenario planning."
  zh: "从运营到战略层面的商业风险，以及情景规划等企业风险管理工具。"
  zh-TW: "從營運到策略層面的商業風險，以及情境規劃等企業風險管理工具。"
  ja: "業務から戦略までのビジネスリスクと、シナリオ計画などの全社的リスク管理の手法。"
  ko: "운영부터 전략까지의 비즈니스 위험과 시나리오 계획 같은 전사적 위험관리 도구."
  vi: "Rủi ro kinh doanh từ vận hành đến chiến lược, và công cụ quản trị rủi ro doanh nghiệp như lập kịch bản rủi ro."
  ms: "Risiko perniagaan dari operasi hingga strategik, dan alat pengurusan risiko perusahaan seperti perancangan senario."
  id: "Risiko bisnis dari operasional hingga strategis, dan alat manajemen risiko perusahaan seperti perencanaan skenario."
  hi: "संचालन से रणनीति तक के व्यावसायिक जोखिम, और जोखिम परिदृश्य योजना जैसे एंटरप्राइज़ रिस्क मैनेजमेंट साधन।"
outcomes:
  - en: "Assess risks with a risk framework"
    zh: "用风险管理框架评估风险"
    zh-TW: "以風險管理架構評估風險"
    ja: "リスク管理の枠組みでリスクを評価する"
    ko: "위험관리 프레임워크로 위험 평가하기"
    vi: "Đánh giá rủi ro bằng khung quản trị rủi ro"
    ms: "Menilai risiko dengan rangka pengurusan risiko"
    id: "Menilai risiko dengan kerangka manajemen risiko"
    hi: "रिस्क फ़्रेमवर्क से जोखिमों का आकलन करना"
  - en: "Prepare risk management documentation"
    zh: "编写风险管理文件"
    zh-TW: "撰寫風險管理文件"
    ja: "リスク管理の文書を作成する"
    ko: "위험관리 문서 작성하기"
    vi: "Soạn tài liệu quản trị rủi ro"
    ms: "Menyediakan dokumen pengurusan risiko"
    id: "Menyusun dokumen manajemen risiko"
    hi: "जोखिम प्रबंधन के दस्तावेज़ तैयार करना"
