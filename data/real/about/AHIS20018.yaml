code: AHIS20018
year: 2026
learn:
  en: "How art is made and sold, from the Renaissance to now, and how materials, markets and collectors shape an artwork's value."
  zh: "从文艺复兴到当下，艺术如何被创作和买卖，材料、市场和藏家如何影响作品价值。"
  zh-TW: "從文藝復興到當下，藝術如何被創作和買賣，材料、市場和藏家如何影響作品價值。"
  ja: "ルネサンスから現在まで、美術がどう作られ売られ、素材・市場・収集家が作品の価値をどう決めるかを学ぶ。"
  ko: "르네상스부터 지금까지 미술이 어떻게 만들어지고 팔리는지, 재료·시장·수집가가 가치를 어떻게 만드는지 배운다."
  vi: "Nghệ thuật được tạo ra và mua bán thế nào từ thời Phục hưng đến nay, và chất liệu, thị trường, nhà sưu tầm định giá tác phẩm ra sao."
  ms: "Cara seni dihasilkan dan dijual dari Renaissance hingga kini, dan cara bahan, pasaran serta pengumpul membentuk nilai karya."
  id: "Cara seni dibuat dan dijual dari Renaisans hingga kini, dan cara bahan, pasar serta kolektor membentuk nilai karya."
  hi: "पुनर्जागरण से अब तक कला कैसे बनती और बिकती है, और सामग्री, बाज़ार व संग्राहक किसी कृति का मूल्य कैसे तय करते हैं।"
outcomes:
  - en: "Explain how artworks are made and materials used"
    zh: "说明艺术品的制作方法和材料"
    zh-TW: "說明藝術品的製作方法和材料"
    ja: "作品の制作方法と素材を説明する"
    ko: "작품 제작 방식과 재료 설명하기"
    vi: "Giải thích cách làm và chất liệu của tác phẩm"
    ms: "Terangkan cara karya seni dibuat dan bahan digunakan"
    id: "Menjelaskan cara karya seni dibuat dan bahan yang dipakai"
    hi: "कलाकृतियां कैसे बनती हैं और कौन-सी सामग्री लगती है, समझाना"
  - en: "Describe how primary and secondary art markets work"
    zh: "描述一级和二级艺术市场如何运作"
    zh-TW: "描述一級和二級藝術市場如何運作"
    ja: "美術の一次・二次市場の仕組みを説明する"
    ko: "미술 1차·2차 시장의 작동 방식 설명하기"
    vi: "Mô tả thị trường nghệ thuật sơ cấp và thứ cấp vận hành ra sao"
    ms: "Huraikan cara pasaran seni primer dan sekunder berfungsi"
    id: "Menguraikan cara kerja pasar seni primer dan sekunder"
    hi: "प्राथमिक और द्वितीयक कला बाज़ार कैसे चलते हैं, बताना"
  - en: "Analyse economic and cultural value in art"
    zh: "分析艺术的经济价值与文化价值"
    zh-TW: "分析藝術的經濟價值與文化價值"
    ja: "美術の経済的価値と文化的価値を分析する"
    ko: "미술의 경제적·문화적 가치 분석하기"
    vi: "Phân tích giá trị kinh tế và văn hóa của nghệ thuật"
    ms: "Analisis nilai ekonomi dan budaya dalam seni"
    id: "Menganalisis nilai ekonomi dan budaya dalam seni"
    hi: "कला के आर्थिक और सांस्कृतिक मूल्य का विश्लेषण करना"
