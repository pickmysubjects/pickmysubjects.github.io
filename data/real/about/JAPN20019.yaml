code: JAPN20019
year: 2026
learn:
  en: "Using Japanese on digital platforms: reading, writing and communicating well online."
  zh: "在数字平台上使用日语：网上的阅读、写作和交流。"
  zh-TW: "在數位平台上使用日語：網路上的閱讀、寫作和交流。"
  ja: "デジタル環境で日本語を使う。オンラインでの読み書きとやりとり。"
  ko: "디지털 플랫폼에서 일본어 쓰기. 온라인에서의 읽기·쓰기·소통."
  vi: "Dùng tiếng Nhật trên nền tảng số: đọc, viết và giao tiếp tốt trên mạng."
  ms: "Menggunakan bahasa Jepun di platform digital: membaca, menulis dan berkomunikasi dalam talian."
  id: "Memakai bahasa Jepang di platform digital: membaca, menulis dan berkomunikasi daring."
  hi: "डिजिटल प्लेटफ़ॉर्म पर जापानी: ऑनलाइन पढ़ना, लिखना और अच्छे से बात करना।"
outcomes:
  - en: "Read and judge Japanese online content"
    zh: "阅读并评估日语网络内容"
    zh-TW: "閱讀並評估日語網路內容"
    ja: "日本語のネット上の情報を読み判断する"
    ko: "일본어 온라인 콘텐츠 읽고 판단하기"
    vi: "Đọc và đánh giá nội dung tiếng Nhật trên mạng"
    ms: "Baca dan nilai kandungan dalam talian Jepun"
    id: "Membaca dan menilai konten daring berbahasa Jepang"
    hi: "जापानी ऑनलाइन सामग्री पढ़ना और परखना"
  - en: "Use digital tools to support your Japanese"
    zh: "利用数字工具辅助日语学习"
    zh-TW: "利用數位工具輔助日語學習"
    ja: "デジタルツールで日本語の力を補う"
    ko: "디지털 도구로 일본어 실력 보완하기"
    vi: "Dùng công cụ số để hỗ trợ tiếng Nhật"
    ms: "Guna alat digital untuk menyokong bahasa Jepun"
    id: "Memakai alat digital untuk mendukung bahasa Jepang"
    hi: "अपनी जापानी के लिए डिजिटल औज़ार इस्तेमाल करना"
  - en: "Create digital content in Japanese"
    zh: "用日语制作数字内容"
    zh-TW: "用日語製作數位內容"
    ja: "日本語でデジタルコンテンツを作る"
    ko: "일본어로 디지털 콘텐츠 만들기"
    vi: "Tạo nội dung số bằng tiếng Nhật"
    ms: "Hasilkan kandungan digital dalam bahasa Jepun"
    id: "Membuat konten digital dalam bahasa Jepang"
    hi: "जापानी में डिजिटल सामग्री बनाना"
