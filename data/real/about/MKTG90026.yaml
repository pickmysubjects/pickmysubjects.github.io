code: MKTG90026
year: 2027
learn:
  en: "Measuring marketing performance: forecasting, satisfaction, brand equity, customer lifetime value and marketing ROI."
  zh: "衡量营销绩效：预测、满意度、品牌资产、客户终身价值和营销投资回报率。"
  zh-TW: "衡量行銷績效：預測、滿意度、品牌權益、顧客終身價值與行銷投資報酬率。"
  ja: "マーケティング成果の測定：需要予測、満足度、ブランド・エクイティ、顧客生涯価値、マーケティングROI。"
  ko: "마케팅 성과 측정: 예측, 만족도, 브랜드 자산, 고객 생애가치, 마케팅 ROI."
  vi: "Đo lường hiệu quả marketing: dự báo, mức hài lòng, tài sản thương hiệu, giá trị vòng đời khách hàng, ROI."
  ms: "Mengukur prestasi pemasaran: ramalan, kepuasan, ekuiti jenama, nilai sepanjang hayat pelanggan dan ROI pemasaran."
  id: "Mengukur kinerja pemasaran: peramalan, kepuasan, ekuitas merek, nilai seumur hidup pelanggan dan ROI pemasaran."
  hi: "मार्केटिंग प्रदर्शन मापना: पूर्वानुमान, संतुष्टि, ब्रांड इक्विटी, ग्राहक का जीवनकाल मूल्य और मार्केटिंग ROI।"
outcomes:
  - en: "Use metrics to evaluate marketing initiatives"
    zh: "用指标评估营销举措"
    zh-TW: "以指標評估行銷措施"
    ja: "指標でマーケティング施策を評価する"
    ko: "지표로 마케팅 활동 평가하기"
    vi: "Dùng chỉ số đánh giá hoạt động marketing"
    ms: "Guna metrik untuk menilai inisiatif pemasaran"
    id: "Memakai metrik untuk menilai inisiatif pemasaran"
    hi: "मेट्रिक्स से मार्केटिंग पहलों का आकलन करना"
  - en: "Link marketing to financial results"
    zh: "把营销与财务业绩联系起来"
    zh-TW: "將行銷與財務績效連結起來"
    ja: "マーケティングを財務成果に結びつける"
    ko: "마케팅을 재무 성과와 연결하기"
    vi: "Gắn marketing với kết quả tài chính"
    ms: "Mengaitkan pemasaran dengan hasil kewangan"
    id: "Mengaitkan pemasaran dengan hasil keuangan"
    hi: "मार्केटिंग को वित्तीय नतीजों से जोड़ना"
