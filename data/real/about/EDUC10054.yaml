code: EDUC10054
year: 2026
learn:
  en: "Studio drawing and painting as a way of learning, with sessions in galleries and museums and a self-directed project."
  zh: "以素描和绘画作为学习方式，在美术馆授课并完成自主项目。"
  zh-TW: "以素描和繪畫作為學習方式，在美術館上課並完成自主專題。"
  ja: "素描と絵画を学びの方法として、美術館での実習や自主プロジェクトに取り組む。"
  ko: "드로잉과 회화를 배움의 방식으로, 미술관 수업과 자기주도 프로젝트 진행."
  vi: "Vẽ và hội họa như một cách học, có buổi học ở bảo tàng, phòng tranh và một dự án tự chọn."
  ms: "Lukisan dan catan studio sebagai cara belajar, dengan sesi di galeri dan muzium serta projek kendiri."
  id: "Menggambar dan melukis di studio sebagai cara belajar, dengan sesi di galeri, museum, dan proyek mandiri."
  hi: "ड्रॉइंग और पेंटिंग को सीखने का तरीक़ा बनाना, गैलरी-संग्रहालय सत्र और स्व-निर्देशित प्रोजेक्ट के साथ।"
outcomes:
  - en: "Use drawing and painting to explore ideas"
    zh: "用素描和绘画探索想法"
    zh-TW: "用素描和繪畫探索想法"
    ja: "素描と絵画で考えを探る"
    ko: "드로잉과 회화로 아이디어 탐구하기"
    vi: "Dùng vẽ và hội họa để khám phá ý tưởng"
    ms: "Guna lukisan dan catan untuk meneroka idea"
    id: "Memakai gambar dan lukisan untuk menjelajahi ide"
    hi: "ड्रॉइंग और पेंटिंग से विचारों की खोज करना"
  - en: "Run your own self-directed art inquiry"
    zh: "开展自主的艺术探究"
    zh-TW: "進行自主的藝術探究"
    ja: "自主的なアート探究を行う"
    ko: "자기주도 예술 탐구 수행하기"
    vi: "Tự thực hiện một tìm tòi nghệ thuật"
    ms: "Jalankan inkuiri seni kendiri"
    id: "Menjalankan penelusuran seni mandiri"
    hi: "अपनी स्व-निर्देशित कला खोज करना"
  - en: "Curate an ePortfolio of your work"
    zh: "整理自己的电子作品集"
    zh-TW: "整理自己的電子作品集"
    ja: "作品のeポートフォリオをまとめる"
    ko: "작품 e포트폴리오 구성하기"
    vi: "Tuyển chọn hồ sơ tác phẩm điện tử"
    ms: "Susun ePortfolio karya sendiri"
    id: "Menyusun ePortofolio karya"
    hi: "अपने काम का ई-पोर्टफोलियो तैयार करना"
