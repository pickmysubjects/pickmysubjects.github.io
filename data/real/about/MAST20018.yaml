code: MAST20018
year: 2025
learn:
  en: "Applied maths for real decisions: linear programming, the simplex method, duality, graphs, scheduling, matchings and fair division."
  zh: "解决实际决策的应用数学：线性规划、单纯形法、对偶、图论、排程、匹配与公平分配"
  zh-TW: "解決實際決策的應用數學：線性規劃、單純形法、對偶、圖論、排程、匹配與公平分配"
  ja: "現実の意思決定のための応用数学：線形計画法、単体法、双対性、グラフ、スケジューリング、マッチング、公平分割。"
  ko: "실제 의사결정을 위한 응용수학: 선형계획법, 단체법, 쌍대성, 그래프, 스케줄링, 매칭, 공정 분배."
  vi: "Toán ứng dụng cho quyết định thực tế: quy hoạch tuyến tính, phương pháp đơn hình, đối ngẫu, đồ thị, lập lịch, ghép cặp và chia công bằng."
  ms: "Matematik gunaan untuk keputusan sebenar: pengaturcaraan linear, kaedah simpleks, dualiti, graf, penjadualan, padanan dan pembahagian adil."
  id: "Matematika terapan untuk keputusan nyata: pemrograman linear, metode simpleks, dualitas, graf, penjadwalan, pencocokan, dan pembagian adil."
  hi: "असली फ़ैसलों के लिए अनुप्रयुक्त गणित: रैखिक प्रोग्रामिंग, सिंप्लेक्स विधि, द्वैतता, ग्राफ़, शेड्यूलिंग, मिलान और न्यायसंगत बँटवारा।"
outcomes:
  - en: "Turn a practical problem into an optimisation model"
    zh: "把实际问题写成优化模型"
    zh-TW: "把實際問題寫成最佳化模型"
    ja: "実際の問題を最適化モデルに定式化する"
    ko: "실제 문제를 최적화 모델로 세우기"
    vi: "Mô hình hóa bài toán thực tế thành bài toán tối ưu"
    ms: "Menukar masalah praktikal kepada model pengoptimuman"
    id: "Mengubah masalah nyata menjadi model optimasi"
    hi: "व्यावहारिक समस्या को इष्टतमीकरण मॉडल में बदलना"
  - en: "Solve linear programs with the simplex method and duality"
    zh: "用单纯形法和对偶求解线性规划"
    zh-TW: "用單純形法和對偶求解線性規劃"
    ja: "単体法と双対性で線形計画問題を解く"
    ko: "단체법과 쌍대성으로 선형계획 문제 풀기"
    vi: "Giải quy hoạch tuyến tính bằng đơn hình và đối ngẫu"
    ms: "Menyelesaikan program linear dengan simpleks dan dualiti"
    id: "Menyelesaikan program linear dengan simpleks dan dualitas"
    hi: "सिंप्लेक्स और द्वैतता से रैखिक प्रोग्राम हल करना"
  - en: "Use graphs for scheduling, matching and fair division"
    zh: "用图论处理排程、匹配和公平分配"
    zh-TW: "用圖論處理排程、匹配和公平分配"
    ja: "グラフでスケジューリング・マッチング・公平分割を扱う"
    ko: "그래프로 스케줄링·매칭·공정 분배 다루기"
    vi: "Dùng đồ thị cho lập lịch, ghép cặp và chia công bằng"
    ms: "Menggunakan graf untuk penjadualan, padanan dan pembahagian adil"
    id: "Memakai graf untuk penjadwalan, pencocokan, dan pembagian adil"
    hi: "शेड्यूलिंग, मिलान और बँटवारे के लिए ग्राफ़ का उपयोग"
