code: ENGL30052
year: 2026
learn:
  en: "A capstone for English and Theatre Studies majors on what these fields are for, plus an independent project of your own."
  zh: "英语与戏剧研究专业的毕业课，探讨这些学科的意义，并完成一个自主项目。"
  zh-TW: "英語與戲劇研究主修的畢業課，探討這些學科的意義，並完成一個自主專題。"
  ja: "英語・演劇学専攻の総まとめ科目。学問の意義を考え、自分で決めたプロジェクトに取り組む。"
  ko: "영문학·연극학 전공 캡스톤. 이 학문의 의미를 살피고 자기만의 프로젝트를 수행한다."
  vi: "Môn tổng kết cho chuyên ngành Anh văn và Sân khấu về ý nghĩa của các ngành này, kèm một dự án độc lập của riêng bạn."
  ms: "Kursus kemuncak untuk major Inggeris dan Kajian Teater tentang nilai bidang ini, serta projek bebas anda sendiri."
  id: "Mata kuliah puncak untuk jurusan Inggris dan Kajian Teater tentang nilai bidang ini, ditambah proyek mandiri sendiri."
  hi: "अंग्रेज़ी और थिएटर स्टडीज़ मेजर के लिए अंतिम कोर्स, इन विषयों के मायने पर, साथ में आपका अपना स्वतंत्र प्रोजेक्ट।"
outcomes:
  - en: "Explain the value of literary and theatre study"
    zh: "说明文学和戏剧研究的价值"
    zh-TW: "說明文學和戲劇研究的價值"
    ja: "文学・演劇研究の価値を説明する"
    ko: "문학·연극 연구의 가치 설명하기"
    vi: "Giải thích giá trị của nghiên cứu văn học và sân khấu"
    ms: "Terangkan nilai kajian sastera dan teater"
    id: "Menjelaskan nilai kajian sastra dan teater"
    hi: "साहित्य और रंगमंच अध्ययन का महत्व समझाना"
  - en: "Use methods like close reading and historicism"
    zh: "运用细读和历史主义等方法"
    zh-TW: "運用細讀和歷史主義等方法"
    ja: "精読や歴史主義などの方法を使う"
    ko: "꼼꼼한 읽기와 역사주의 같은 방법 쓰기"
    vi: "Dùng các phương pháp như đọc kỹ và chủ nghĩa lịch sử"
    ms: "Guna kaedah seperti bacaan rapi dan historisisme"
    id: "Memakai metode seperti pembacaan cermat dan historisisme"
    hi: "बारीक पढ़त और ऐतिहासिकता जैसे तरीके इस्तेमाल करना"
  - en: "Plan and complete your own research project"
    zh: "规划并完成自己的研究项目"
    zh-TW: "規劃並完成自己的研究專題"
    ja: "自分の研究プロジェクトを計画し仕上げる"
    ko: "자신의 연구 프로젝트 계획하고 완수하기"
    vi: "Lên kế hoạch và hoàn thành dự án nghiên cứu riêng"
    ms: "Rancang dan siapkan projek penyelidikan sendiri"
    id: "Merencanakan dan menyelesaikan proyek riset sendiri"
    hi: "अपना शोध प्रोजेक्ट योजना बनाकर पूरा करना"
