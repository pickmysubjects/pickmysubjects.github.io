code: AGRI30033
year: 2026
learn:
  en: "Apply economics to whole-farm decisions: investment, risk, cash flow and growth, tested on real farms during field trips."
  zh: "把经济学用于整个农场的决策：投资、风险、现金流和扩张，并通过实地考察检验。"
  zh-TW: "把經濟學用於整個農場的決策：投資、風險、現金流與擴張，並透過實地考察驗證。"
  ja: "投資・リスク・資金繰り・成長など農場全体の意思決定に経済学を使い、現地で検証する。"
  ko: "투자·위험·현금흐름·성장 등 농장 전체 결정에 경제학을 적용하고 현장에서 확인."
  vi: "Áp dụng kinh tế học vào quyết định toàn trại: đầu tư, rủi ro, dòng tiền, mở rộng."
  ms: "Guna ekonomi untuk keputusan ladang: pelaburan, risiko, aliran tunai, pertumbuhan."
  id: "Menerapkan ekonomi pada keputusan usaha tani: investasi, risiko, arus kas, pertumbuhan."
  hi: "पूरे फ़ार्म के फ़ैसलों पर अर्थशास्त्र: निवेश, जोखिम, नकदी और विस्तार, फ़ील्ड ट्रिप पर परखा।"
outcomes:
  - en: "Analyse a farm's financial performance"
    zh: "分析农场的财务表现"
    zh-TW: "分析農場的財務表現"
    ja: "農場の財務成績を分析する"
    ko: "농장 재무 성과 분석하기"
    vi: "Phân tích tài chính nông trại"
    ms: "Analisis prestasi kewangan ladang"
    id: "Menganalisis kinerja keuangan lahan"
    hi: "फ़ार्म के वित्तीय प्रदर्शन का विश्लेषण"
  - en: "Evaluate investment and risk choices"
    zh: "评估投资和风险决策"
    zh-TW: "評估投資與風險決策"
    ja: "投資とリスクの選択を評価する"
    ko: "투자·위험 선택 평가하기"
    vi: "Đánh giá lựa chọn đầu tư và rủi ro"
    ms: "Nilai pilihan pelaburan dan risiko"
    id: "Menilai pilihan investasi dan risiko"
    hi: "निवेश और जोखिम के विकल्प परखना"
  - en: "Advise on a real farm case"
    zh: "针对真实农场案例提出建议"
    zh-TW: "針對真實農場案例提出建議"
    ja: "実際の農場事例に助言する"
    ko: "실제 농장 사례에 조언하기"
    vi: "Tư vấn cho một trại thực tế"
    ms: "Beri nasihat untuk kes ladang sebenar"
    id: "Memberi saran untuk kasus nyata"
    hi: "असली फ़ार्म केस पर सलाह देना"
