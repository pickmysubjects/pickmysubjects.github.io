code: SCRN20014
year: 2026
learn:
  en: "Rethinking film authorship: how producers, writers, crews, actors and studios, not just directors, shape what we see."
  zh: "重新思考电影作者论：不只导演，制片、编剧、剧组、演员和片厂也在塑造影片。"
  zh-TW: "重新思考電影作者論：不只導演，製片、編劇、劇組、演員和片廠也在塑造影片。"
  ja: "映画の作者性を見直す。監督だけでなく、製作・脚本・スタッフ・俳優・スタジオが作品をどう形づくるか。"
  ko: "영화 작가론 다시 보기. 감독만이 아니라 제작자·작가·스태프·배우·스튜디오가 작품을 어떻게 만드는지 배운다."
  vi: "Nghĩ lại quyền tác giả phim: không chỉ đạo diễn mà nhà sản xuất, biên kịch, đoàn phim, diễn viên và hãng phim đều định hình tác phẩm."
  ms: "Memikir semula kepengarangan filem: penerbit, penulis, kru, pelakon dan studio, bukan hanya pengarah, membentuk apa yang kita tonton."
  id: "Memikirkan ulang kepengarangan film: produser, penulis, kru, aktor dan studio, bukan hanya sutradara, membentuk apa yang kita tonton."
  hi: "फ़िल्म के रचयिता की धारणा पर पुनर्विचार: सिर्फ़ निर्देशक नहीं, निर्माता, लेखक, क्रू, अभिनेता और स्टूडियो भी फ़िल्म गढ़ते हैं।"
outcomes:
  - en: "Explain debates about film authorship"
    zh: "说明关于电影作者身份的争论"
    zh-TW: "說明關於電影作者身分的爭論"
    ja: "映画の作者性をめぐる議論を説明する"
    ko: "영화 작가성에 관한 논쟁 설명하기"
    vi: "Giải thích các tranh luận về quyền tác giả phim"
    ms: "Terangkan perdebatan tentang kepengarangan filem"
    id: "Menjelaskan perdebatan tentang kepengarangan film"
    hi: "फ़िल्म के रचयिता पर बहसें समझाना"
  - en: "Analyse the roles of collaborators in a film"
    zh: "分析各合作者在影片中的作用"
    zh-TW: "分析各合作者在影片中的作用"
    ja: "一本の映画における協力者の役割を分析する"
    ko: "영화 속 협업자들의 역할 분석하기"
    vi: "Phân tích vai trò của những người cộng tác trong một bộ phim"
    ms: "Analisis peranan kolaborator dalam sesebuah filem"
    id: "Menganalisis peran para kolaborator dalam film"
    hi: "किसी फ़िल्म में सहयोगियों की भूमिकाओं का विश्लेषण करना"
  - en: "Compare art cinema and Hollywood production"
    zh: "比较艺术电影与好莱坞的制作方式"
    zh-TW: "比較藝術電影與好萊塢的製作方式"
    ja: "アート映画とハリウッドの製作を比べる"
    ko: "예술 영화와 할리우드 제작 비교하기"
    vi: "So sánh điện ảnh nghệ thuật và sản xuất Hollywood"
    ms: "Bandingkan filem seni dan penerbitan Hollywood"
    id: "Membandingkan film seni dan produksi Hollywood"
    hi: "आर्ट सिनेमा और हॉलीवुड निर्माण की तुलना करना"
