code: SCIE10006
year: 2026
learn:
  en: "Core biology for the Extended science degree: cells, genes, body systems and life, taught in small seminars."
  zh: "扩展理学学位的生物基础：细胞、基因、人体系统与生命，小班研讨授课。"
  zh-TW: "延長理學學位的生物基礎：細胞、基因、人體系統與生命，小班研討授課。"
  ja: "理学延長課程の生物基礎：細胞、遺伝子、体の仕組み、生命を少人数で学ぶ。"
  ko: "확장 이학 학위의 생물 기초: 세포, 유전자, 신체 계통, 생명을 소규모 세미나로."
  vi: "Sinh học nền tảng cho cử nhân Khoa học mở rộng: tế bào, gen, hệ cơ quan, sự sống."
  ms: "Asas biologi untuk ijazah Sains Lanjutan: sel, gen, sistem badan dan kehidupan."
  id: "Biologi dasar untuk gelar Sains Diperluas: sel, gen, sistem tubuh dan kehidupan."
  hi: "एक्सटेंडेड साइंस डिग्री की बुनियादी बायोलॉजी: कोशिका, जीन, शरीर तंत्र और जीवन।"
outcomes:
  - en: "Explain key ideas about cells and genes"
    zh: "说明细胞和基因的核心概念"
    zh-TW: "說明細胞與基因的核心概念"
    ja: "細胞と遺伝子の基本を説明する"
    ko: "세포와 유전자의 핵심 개념 설명하기"
    vi: "Giải thích ý chính về tế bào và gen"
    ms: "Jelaskan idea utama tentang sel dan gen"
    id: "Menjelaskan konsep utama sel dan gen"
    hi: "कोशिका और जीन के मुख्य विचार समझाना"
  - en: "Describe how body systems work together"
    zh: "描述人体各系统如何协同工作"
    zh-TW: "描述人體各系統如何協同運作"
    ja: "体の各器官系の連携を説明する"
    ko: "신체 계통이 함께 작동하는 방식 설명하기"
    vi: "Mô tả các hệ cơ quan phối hợp ra sao"
    ms: "Huraikan cara sistem badan bekerjasama"
    id: "Menjelaskan kerja sama sistem tubuh"
    hi: "शरीर के तंत्र मिलकर कैसे काम करते हैं, बताना"
  - en: "Build a base for first-year biology"
    zh: "为一年级生物打好基础"
    zh-TW: "為一年級生物打好基礎"
    ja: "1年次の生物学への土台を作る"
    ko: "1학년 생물학의 기초 다지기"
    vi: "Xây nền cho sinh học năm nhất"
    ms: "Bina asas untuk biologi tahun pertama"
    id: "Membangun dasar biologi tahun pertama"
    hi: "पहले साल की बायोलॉजी की नींव बनाना"
