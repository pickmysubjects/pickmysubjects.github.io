code: FOOD30009
year: 2026
learn:
  en: "Capstone food project: plan and run your own research to develop a new food product or solve an industry problem."
  zh: "食品专业毕业项目：自己做研究，开发新食品或解决行业问题。"
  zh-TW: "食品主修總結專題：自己做研究，開發新食品或解決產業問題。"
  ja: "食品科学の総仕上げ：自分で研究し、新製品開発や業界課題に取り組む。"
  ko: "식품과학 캡스톤: 직접 연구해 신제품을 개발하거나 업계 문제 해결하기."
  vi: "Dự án tốt nghiệp ngành thực phẩm: tự nghiên cứu để phát triển sản phẩm mới hoặc giải vấn đề ngành."
  ms: "Projek akhir sains makanan: rancang penyelidikan sendiri untuk produk baharu atau masalah industri."
  id: "Proyek akhir ilmu pangan: riset sendiri untuk mengembangkan produk baru atau memecahkan masalah industri."
  hi: "फ़ूड साइंस का अंतिम प्रोजेक्ट: खुद शोध करके नया खाद्य उत्पाद बनाना या उद्योग की समस्या सुलझाना।"
outcomes:
  - en: "Run product development trials"
    zh: "设计并执行产品开发试验"
    zh-TW: "設計並執行產品開發試驗"
    ja: "製品開発の試験を設計し実施する"
    ko: "제품 개발 실험 설계하고 수행하기"
    vi: "Thiết kế và chạy thử nghiệm phát triển sản phẩm"
    ms: "Rancang dan jalankan ujian pembangunan produk"
    id: "Merancang dan menjalankan uji pengembangan produk"
    hi: "उत्पाद विकास ट्रायल डिज़ाइन और चलाना"
  - en: "Explain the stage-gate product process"
    zh: "讲清楚阶段门产品开发流程"
    zh-TW: "說明階段關卡產品開發流程"
    ja: "ステージゲート型の開発手順を説明する"
    ko: "스테이지 게이트 개발 절차 설명하기"
    vi: "Trình bày quy trình stage-gate"
    ms: "Terangkan proses produk stage-gate"
    id: "Menjelaskan proses produk stage-gate"
    hi: "स्टेज-गेट उत्पाद प्रक्रिया समझाना"
  - en: "Present research results clearly"
    zh: "清晰地汇报研究结果"
    zh-TW: "清楚地報告研究成果"
    ja: "研究結果をわかりやすく伝える"
    ko: "연구 결과 명확히 발표하기"
    vi: "Trình bày kết quả nghiên cứu rõ ràng"
    ms: "Bentang hasil penyelidikan dengan jelas"
    id: "Menyajikan hasil riset dengan jelas"
    hi: "शोध नतीजे साफ़ तरीक़े से पेश करना"
