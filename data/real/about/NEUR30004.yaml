code: NEUR30004
year: 2026
learn:
  en: "How the brain handles senses, language and numbers, and what goes wrong in neurological disorders."
  zh: "大脑怎么处理感觉、语言和数字，以及神经疾病里出了什么问题。"
  zh-TW: "大腦怎麼處理感覺、語言和數字，以及神經疾病裡出了什麼問題。"
  ja: "脳が感覚・言語・数をどう扱うか、そして神経疾患で何がうまくいかないか。"
  ko: "뇌가 감각, 언어, 숫자를 처리하는 방식과 신경 질환에서 생기는 문제."
  vi: "Não xử lý giác quan, ngôn ngữ và con số ra sao, và điều gì trục trặc trong bệnh thần kinh."
  ms: "Cara otak mengendalikan deria, bahasa dan nombor, dan apa yang silap dalam gangguan neurologi."
  id: "Cara otak menangani indra, bahasa, dan angka, serta apa yang salah pada gangguan neurologis."
  hi: "दिमाग इंद्रियों, भाषा और संख्याओं को कैसे संभालता है, और तंत्रिका रोगों में क्या गड़बड़ होता है।"
outcomes:
  - en: "Explain how brain regions work together"
    zh: "解释不同脑区怎么协同工作"
    zh-TW: "解釋不同腦區怎麼協同運作"
    ja: "脳の各領域の連携を説明する"
    ko: "뇌 영역들이 함께 작동하는 방식 설명하기"
    vi: "Giải thích các vùng não phối hợp ra sao"
    ms: "Menerangkan cara bahagian otak bekerjasama"
    id: "Menjelaskan cara area otak bekerja sama"
    hi: "दिमाग के हिस्से मिलकर कैसे काम करते हैं"
  - en: "Describe tools used to study the brain"
    zh: "描述研究大脑用的技术"
    zh-TW: "描述研究大腦用的技術"
    ja: "脳研究に使う手法を説明する"
    ko: "뇌 연구에 쓰이는 도구 설명하기"
    vi: "Mô tả công cụ dùng để nghiên cứu não"
    ms: "Menghuraikan alat untuk mengkaji otak"
    id: "Menjelaskan alat untuk meneliti otak"
    hi: "दिमाग के अध्ययन के साधन बताना"
  - en: "Identify open questions in brain research"
    zh: "说出脑科学还没解决的问题"
    zh-TW: "說出腦科學還沒解決的問題"
    ja: "脳研究の未解決問題を挙げる"
    ko: "뇌 연구의 미해결 문제 찾기"
    vi: "Nêu các câu hỏi còn bỏ ngỏ trong nghiên cứu não"
    ms: "Mengenal pasti persoalan terbuka dalam kajian otak"
    id: "Mengenali pertanyaan terbuka dalam riset otak"
    hi: "दिमाग की रिसर्च के अनसुलझे सवाल पहचानना"
