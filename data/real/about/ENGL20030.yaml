code: ENGL20030
year: 2026
learn:
  en: "Major theatre movements of the last 150 years and how theatre has answered social and political change."
  zh: "近150年的主要戏剧流派，以及戏剧如何回应社会和政治变化。"
  zh-TW: "近150年的主要戲劇流派，以及戲劇如何回應社會和政治變化。"
  ja: "この150年の主な演劇運動と、演劇が社会・政治の変化にどう応えてきたかを学ぶ。"
  ko: "지난 150년의 주요 연극 운동과 연극이 사회·정치 변화에 어떻게 응답했는지 배운다."
  vi: "Các trào lưu sân khấu chính trong 150 năm qua và cách sân khấu đáp lại biến đổi xã hội, chính trị."
  ms: "Gerakan teater utama 150 tahun lalu dan cara teater menjawab perubahan sosial dan politik."
  id: "Gerakan teater utama 150 tahun terakhir dan cara teater menanggapi perubahan sosial dan politik."
  hi: "पिछले 150 वर्षों के मुख्य रंगमंच आंदोलन और रंगमंच ने सामाजिक-राजनीतिक बदलाव का जवाब कैसे दिया।"
outcomes:
  - en: "Describe key movements in modern theatre"
    zh: "描述现代戏剧的主要流派"
    zh-TW: "描述現代戲劇的主要流派"
    ja: "近代演劇の主な運動を説明する"
    ko: "현대 연극의 주요 운동 설명하기"
    vi: "Mô tả các trào lưu chính của sân khấu hiện đại"
    ms: "Huraikan gerakan utama teater moden"
    id: "Menguraikan gerakan utama teater modern"
    hi: "आधुनिक रंगमंच के मुख्य आंदोलनों का वर्णन करना"
  - en: "Analyse plays as both text and performance"
    zh: "把剧作当作文本和演出来分析"
    zh-TW: "把劇作當作文本和演出來分析"
    ja: "戯曲をテキストと上演の両面から分析する"
    ko: "희곡을 텍스트이자 공연으로 분석하기"
    vi: "Phân tích vở kịch như văn bản và trình diễn"
    ms: "Analisis drama sebagai teks dan persembahan"
    id: "Menganalisis lakon sebagai teks dan pertunjukan"
    hi: "नाटकों का पाठ और प्रस्तुति दोनों रूपों में विश्लेषण करना"
  - en: "Link theatre to its social and political context"
    zh: "把戏剧与社会政治背景联系起来"
    zh-TW: "把戲劇與社會政治背景聯繫起來"
    ja: "演劇を社会・政治の文脈と結びつける"
    ko: "연극을 사회·정치적 맥락과 연결하기"
    vi: "Liên hệ sân khấu với bối cảnh xã hội, chính trị"
    ms: "Kaitkan teater dengan konteks sosial dan politik"
    id: "Mengaitkan teater dengan konteks sosial dan politik"
    hi: "रंगमंच को उसके सामाजिक-राजनीतिक संदर्भ से जोड़ना"
