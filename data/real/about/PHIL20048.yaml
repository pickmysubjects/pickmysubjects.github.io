code: PHIL20048
year: 2026
learn:
  en: "Why art matters: philosophical theories on whether art brings understanding, expresses feeling and should be open to all."
  zh: "艺术为何重要：关于艺术能否带来理解、表达情感以及是否应人人可及的哲学理论。"
  zh-TW: "藝術為何重要：關於藝術能否帶來理解、表達情感以及是否應人人可及的哲學理論。"
  ja: "芸術はなぜ大切か。理解をもたらすか、感情を表すか、誰にでも開かれるべきかを哲学的に考える。"
  ko: "예술은 왜 중요한가. 이해를 주는지, 감정을 표현하는지, 모두에게 열려야 하는지 철학적으로 다룬다."
  vi: "Vì sao nghệ thuật quan trọng: các lý thuyết triết học về việc nghệ thuật có mang lại hiểu biết, biểu đạt cảm xúc và nên mở cho mọi người không."
  ms: "Mengapa seni penting: teori falsafah sama ada seni membawa kefahaman, meluahkan perasaan dan patut terbuka kepada semua."
  id: "Mengapa seni penting: teori filsafat soal apakah seni memberi pemahaman, mengungkapkan perasaan dan harus terbuka bagi semua."
  hi: "कला क्यों मायने रखती है: क्या कला समझ देती है, भावना व्यक्त करती है और सबके लिए सुलभ होनी चाहिए, इस पर दार्शनिक सिद्धांत।"
outcomes:
  - en: "Explain theories about the value of art"
    zh: "说明关于艺术价值的理论"
    zh-TW: "說明關於藝術價值的理論"
    ja: "芸術の価値についての理論を説明する"
    ko: "예술의 가치에 관한 이론 설명하기"
    vi: "Giải thích các lý thuyết về giá trị của nghệ thuật"
    ms: "Terangkan teori tentang nilai seni"
    id: "Menjelaskan teori tentang nilai seni"
    hi: "कला के मूल्य के सिद्धांत समझाना"
  - en: "Assess claims that art gives understanding"
    zh: "评估艺术能带来理解的主张"
    zh-TW: "評估藝術能帶來理解的主張"
    ja: "芸術が理解をもたらすという主張を評価する"
    ko: "예술이 이해를 준다는 주장 평가하기"
    vi: "Đánh giá nhận định rằng nghệ thuật mang lại hiểu biết"
    ms: "Nilai dakwaan bahawa seni memberi kefahaman"
    id: "Menilai klaim bahwa seni memberi pemahaman"
    hi: "कला समझ देती है, इस दावे को परखना"
  - en: "Argue a view on access to art"
    zh: "就艺术的普及提出自己的论点"
    zh-TW: "就藝術的普及提出自己的論點"
    ja: "芸術へのアクセスについて自分の見解を論じる"
    ko: "예술 접근성에 관한 입장 논증하기"
    vi: "Lập luận một quan điểm về quyền tiếp cận nghệ thuật"
    ms: "Berhujah tentang akses kepada seni"
    id: "Berargumen tentang akses terhadap seni"
    hi: "कला तक पहुंच पर अपना मत तर्क से रखना"
