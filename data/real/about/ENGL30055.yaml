code: ENGL30055
year: 2027
learn:
  en: "How changing ideas about sex in Restoration and early-1700s Britain shaped its literature, politics and free speech."
  zh: "英国复辟时期至18世纪初性观念的变化，如何影响文学、政治和言论自由。"
  zh-TW: "英國復辟時期至18世紀初性觀念的變化，如何影響文學、政治和言論自由。"
  ja: "王政復古期から18世紀初頭の英国で、性の考え方の変化が文学・政治・言論の自由に与えた影響。"
  ko: "왕정복고기에서 18세기 초 영국의 성 관념 변화가 문학·정치·표현의 자유에 미친 영향."
  vi: "Sự thay đổi quan niệm về tình dục ở Anh thời Phục hưng vương triều và đầu thế kỷ 18 đã định hình văn học, chính trị và tự do ngôn luận ra sao."
  ms: "Cara perubahan pandangan tentang seks di Britain era Restorasi dan awal 1700-an membentuk kesusasteraan, politik dan kebebasan bersuara."
  id: "Bagaimana perubahan pandangan tentang seks di Inggris era Restorasi dan awal 1700-an membentuk sastra, politik, dan kebebasan berbicara."
  hi: "रेस्टोरेशन और 1700 के शुरुआती ब्रिटेन में सेक्स को लेकर बदलती सोच ने साहित्य, राजनीति और अभिव्यक्ति की आज़ादी को कैसे आकार दिया।"
outcomes:
  - en: "Link 17th–18th-century literature to its political context"
    zh: "把17-18世纪文学与其政治背景联系起来"
    zh-TW: "把17-18世紀文學與其政治背景聯繫起來"
    ja: "17〜18世紀の文学を政治的背景と結びつける"
    ko: "17~18세기 문학을 정치적 맥락과 연결하기"
    vi: "Liên hệ văn học thế kỷ 17–18 với bối cảnh chính trị"
    ms: "Kaitkan kesusasteraan abad ke-17–18 dengan konteks politiknya"
    id: "Mengaitkan sastra abad ke-17–18 dengan konteks politiknya"
    hi: "17वीं–18वीं सदी के साहित्य को उसके राजनीतिक संदर्भ से जोड़ना"
  - en: "Edit and annotate texts as modern editions"
    zh: "编辑和注释文本，做成现代版本"
    zh-TW: "編輯和註釋文本，做成現代版本"
    ja: "テキストを編集・注釈し現代版にする"
    ko: "텍스트를 편집·주석해 현대판 만들기"
    vi: "Biên tập và chú thích văn bản thành ấn bản hiện đại"
    ms: "Sunting dan anotasi teks sebagai edisi moden"
    id: "Menyunting dan memberi anotasi teks sebagai edisi modern"
    hi: "पाठों को संपादित व टिप्पणी कर आधुनिक संस्करण बनाना"
  - en: "Close-read satire, early novels and Restoration plays"
    zh: "细读讽刺诗、早期小说和复辟时期戏剧"
    zh-TW: "細讀諷刺詩、早期小說和復辟時期戲劇"
    ja: "風刺詩・初期小説・王政復古期の劇を精読する"
    ko: "풍자시, 초기 소설, 왕정복고기 희곡 정독하기"
    vi: "Đọc kỹ văn trào phúng, tiểu thuyết sơ kỳ và kịch thời Phục hưng"
    ms: "Baca teliti satira, novel awal dan drama Restorasi"
    id: "Membaca cermat satire, novel awal, dan drama Restorasi"
    hi: "व्यंग्य, शुरुआती उपन्यास और रेस्टोरेशन नाटकों को ध्यान से पढ़ना"
