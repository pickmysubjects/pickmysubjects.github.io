code: MGMT90206
year: 2027
learn:
  en: "For graduate research students: weekly seminars or an approved reading course on a special topic in management or marketing."
  zh: "面向研究生科研学生：管理或营销专题的每周研讨或经批准的阅读课程。"
  zh-TW: "面向研究生研究學生：管理或行銷專題的每週研討或經核准的閱讀課程。"
  ja: "大学院研究生向け：経営・マーケティングの特別テーマの週次セミナーまたは承認された講読。"
  ko: "대학원 연구생 대상: 경영·마케팅 특별 주제의 주간 세미나 또는 승인된 독서 과정."
  vi: "Dành cho nghiên cứu sinh: seminar hằng tuần hoặc khóa đọc được duyệt về chủ đề quản trị hay marketing."
  ms: "Untuk pelajar penyelidikan: seminar mingguan atau kursus bacaan diluluskan tentang topik pengurusan atau pemasaran."
  id: "Untuk mahasiswa riset: seminar mingguan atau kursus bacaan yang disetujui tentang topik manajemen atau pemasaran."
  hi: "शोध छात्रों के लिए: प्रबंधन या मार्केटिंग के विशेष विषय पर साप्ताहिक सेमिनार या स्वीकृत पठन कोर्स।"
outcomes:
  - en: "Explain the key issues of the special topic"
    zh: "解释专题的关键问题"
    zh-TW: "解釋專題的關鍵問題"
    ja: "特別テーマの主要な論点を説明する"
    ko: "특별 주제의 핵심 쟁점 설명하기"
    vi: "Giải thích các vấn đề chính của chủ đề"
    ms: "Menerangkan isu utama topik khas"
    id: "Menjelaskan isu utama topik khusus"
    hi: "विशेष विषय के मुख्य मुद्दे समझाना"
  - en: "Relate the topic to broader management or marketing ideas"
    zh: "把专题与更广的管理或营销原理联系起来"
    zh-TW: "把專題與更廣的管理或行銷原理連結起來"
    ja: "テーマを経営・マーケティング全体の原理と結びつける"
    ko: "주제를 더 넓은 경영·마케팅 원리와 연결하기"
    vi: "Liên hệ chủ đề với nguyên lý quản trị hoặc marketing"
    ms: "Mengaitkan topik dengan prinsip pengurusan atau pemasaran"
    id: "Mengaitkan topik dengan prinsip manajemen atau pemasaran"
    hi: "विषय को व्यापक प्रबंधन या मार्केटिंग सिद्धांतों से जोड़ना"
