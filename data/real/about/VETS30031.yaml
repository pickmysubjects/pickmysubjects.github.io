code: VETS30031
year: 2026
learn:
  en: "Australian and global beef, dairy, sheep, goat and camelid farming: breeding, nutrition, welfare, disease and profit."
  zh: "澳洲及全球肉牛、奶牛、羊、驼类养殖：育种、营养、福利、疾病和盈利。"
  zh-TW: "澳洲及全球肉牛、乳牛、羊、駝類畜牧：育種、營養、福利、疾病與獲利。"
  ja: "豪州と世界の肉牛・乳牛・羊・山羊・ラクダ科の生産：育種、栄養、福祉、疾病、収益。"
  ko: "호주와 세계의 육우·젖소·양·염소·낙타과 사육: 육종, 영양, 복지, 질병, 수익."
  vi: "Chăn nuôi bò thịt, bò sữa, cừu, dê, lạc đà ở Úc và thế giới: giống, dinh dưỡng, phúc lợi, bệnh, lợi nhuận."
  ms: "Penternakan lembu, tenusu, biri-biri, kambing dan kamelid: pembiakan, nutrisi, kebajikan, penyakit, keuntungan."
  id: "Peternakan sapi potong, sapi perah, domba, kambing, unta: pemuliaan, pakan, kesejahteraan, penyakit, laba."
  hi: "ऑस्ट्रेलिया व दुनिया में गोमांस, डेयरी, भेड़, बकरी और ऊंट पालन: प्रजनन, पोषण, कल्याण, रोग और मुनाफ़ा।"
outcomes:
  - en: "Analyse what drives farm profit and sustainability"
    zh: "分析影响养殖盈利与可持续的因素"
    zh-TW: "分析影響畜牧獲利與永續的因素"
    ja: "生産の収益性と持続性の要因を分析"
    ko: "사육 수익성과 지속가능성 요인 분석"
    vi: "Phân tích yếu tố lợi nhuận và bền vững"
    ms: "Analisis faktor keuntungan dan kelestarian ladang"
    id: "Menganalisis faktor laba dan keberlanjutan"
    hi: "खेत के मुनाफ़े और स्थिरता के कारक परखना"
  - en: "Apply livestock ethics and legal rules"
    zh: "运用畜牧业的伦理与法律框架"
    zh-TW: "運用畜牧業的倫理與法律框架"
    ja: "畜産の倫理・法的枠組みを適用する"
    ko: "축산 윤리 및 법적 틀 적용"
    vi: "Áp dụng khung đạo đức và pháp lý chăn nuôi"
    ms: "Guna kerangka etika dan undang-undang ternakan"
    id: "Menerapkan kerangka etika dan hukum peternakan"
    hi: "पशुधन नैतिकता और कानूनी नियम लागू करना"
