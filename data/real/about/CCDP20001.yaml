code: CCDP20001
year: 2026
learn:
  en: "How street art and graffiti grew from illegal subculture to mainstream, with Melbourne laneway fieldwork."
  zh: "街头艺术和涂鸦如何从地下走向主流，含墨尔本小巷实地考察。"
  zh-TW: "街頭藝術和塗鴉如何從地下走向主流，含墨爾本巷弄實地考察。"
  ja: "ストリートアートとグラフィティの主流化を、メルボルンの路地で学ぶ。"
  ko: "스트리트 아트와 그래피티의 주류화, 멜버른 골목 현장 답사 포함."
  vi: "Nghệ thuật đường phố và graffiti từ ngầm đến chính thống, có khảo sát hẻm Melbourne."
  ms: "Seni jalanan dan grafiti dari subbudaya haram ke arus perdana, dengan kerja lapangan di lorong Melbourne."
  id: "Seni jalanan dan grafiti dari subkultur ilegal ke arus utama, dengan kunjungan gang Melbourne."
  hi: "स्ट्रीट आर्ट और ग्रैफ़िटी का छिपी उपसंस्कृति से मुख्यधारा तक सफ़र, मेलबर्न की गलियों में फ़ील्डवर्क।"
outcomes:
  - en: "Spot and identify street art in different settings"
    zh: "在不同环境中识别街头艺术"
    zh-TW: "在不同環境中辨識街頭藝術"
    ja: "様々な場所のストリートアートを見分ける"
    ko: "다양한 장소에서 스트리트 아트 식별하기"
    vi: "Nhận diện nghệ thuật đường phố ở nhiều bối cảnh"
    ms: "Kenal pasti seni jalanan dalam pelbagai suasana"
    id: "Mengenali seni jalanan di berbagai tempat"
    hi: "अलग-अलग जगहों पर स्ट्रीट आर्ट पहचानना"
  - en: "Explain how place and society shape its meaning"
    zh: "说明空间和社会如何塑造其意义"
    zh-TW: "說明空間和社會如何形塑其意義"
    ja: "場所と社会が意味をどう形作るか説明する"
    ko: "장소와 사회가 의미를 어떻게 만드는지 설명하기"
    vi: "Giải thích nơi chốn và xã hội định hình ý nghĩa ra sao"
    ms: "Terangkan cara tempat dan masyarakat membentuk maknanya"
    id: "Menjelaskan bagaimana tempat dan masyarakat membentuk maknanya"
    hi: "समझाना कि स्थान और समाज उसका अर्थ कैसे गढ़ते हैं"
  - en: "Map and design street art proposals"
    zh: "绘制街头艺术地图并设计方案"
    zh-TW: "繪製街頭藝術地圖並設計方案"
    ja: "ストリートアートを地図化し提案を作る"
    ko: "스트리트 아트 지도 만들고 제안 디자인하기"
    vi: "Lập bản đồ và thiết kế đề xuất nghệ thuật đường phố"
    ms: "Petakan dan reka cadangan seni jalanan"
    id: "Memetakan dan merancang usulan seni jalanan"
    hi: "स्ट्रीट आर्ट का नक्शा बनाना और प्रस्ताव डिज़ाइन करना"
