code: MAST20009
year: 2026
learn:
  en: "Calculus with several variables and vectors, including integrals over curves, surfaces and volumes."
  zh: "多元函数和向量的微积分，包括曲线、曲面和体积上的积分。"
  zh-TW: "多變數函數和向量的微積分，包括曲線、曲面和體積上的積分。"
  ja: "多変数とベクトルの微積分。曲線・曲面・体積上の積分を含む。"
  ko: "다변수와 벡터의 미적분. 곡선, 곡면, 부피 위의 적분 포함."
  vi: "Giải tích nhiều biến và vectơ, gồm tích phân trên đường cong, mặt và thể tích."
  ms: "Kalkulus berbilang pemboleh ubah dan vektor, termasuk kamiran atas lengkung, permukaan dan isi padu."
  id: "Kalkulus multivariabel dan vektor, termasuk integral pada kurva, permukaan, dan volume."
  hi: "कई चरों और वेक्टर वाला कैलकुलस, जिसमें वक्र, सतह और आयतन पर इंटीग्रल शामिल हैं।"
outcomes:
  - en: "Find maximums and minimums of multi-variable functions"
    zh: "求多元函数的极值"
    zh-TW: "求多變數函數的極值"
    ja: "多変数関数の最大・最小を求める"
    ko: "다변수 함수의 최댓값과 최솟값 구하기"
    vi: "Tìm cực đại, cực tiểu của hàm nhiều biến"
    ms: "Mencari maksimum dan minimum fungsi berbilang pemboleh ubah"
    id: "Mencari maksimum dan minimum fungsi multivariabel"
    hi: "कई चरों वाले फ़ंक्शन का अधिकतम और न्यूनतम निकालना"
  - en: "Calculate line, surface and volume integrals"
    zh: "算线积分、面积分和体积分"
    zh-TW: "算線積分、面積分和體積分"
    ja: "線積分・面積分・体積積分を計算する"
    ko: "선적분, 면적분, 부피 적분 계산하기"
    vi: "Tính tích phân đường, mặt và khối"
    ms: "Mengira kamiran garis, permukaan dan isi padu"
    id: "Menghitung integral garis, permukaan, dan volume"
    hi: "रेखा, सतह और आयतन इंटीग्रल निकालना"
  - en: "Apply Green's, Gauss' and Stokes' theorems"
    zh: "会用格林、高斯和斯托克斯定理"
    zh-TW: "會用格林、高斯和斯托克斯定理"
    ja: "グリーン・ガウス・ストークスの定理を使う"
    ko: "그린, 가우스, 스토크스 정리 적용하기"
    vi: "Áp dụng định lý Green, Gauss và Stokes"
    ms: "Menggunakan teorem Green, Gauss dan Stokes"
    id: "Menerapkan teorema Green, Gauss, dan Stokes"
    hi: "ग्रीन, गॉस और स्टोक्स प्रमेय लागू करना"
