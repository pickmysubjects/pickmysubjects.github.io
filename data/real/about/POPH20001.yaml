code: POPH20001
year: 2026
learn:
  en: "The ethics, law and social side of genetics: testing, privacy, identity, and genes in art and media."
  zh: "遗传学的伦理、法律和社会层面：基因检测、隐私、身份认同及艺术与媒体中的基因。"
  zh-TW: "遺傳學的倫理、法律和社會層面：基因檢測、隱私、身分認同及藝術與媒體中的基因。"
  ja: "遺伝学の倫理・法・社会面：遺伝子検査、プライバシー、アイデンティティ、芸術やメディアの中の遺伝子。"
  ko: "유전학의 윤리·법·사회적 측면: 유전자 검사, 프라이버시, 정체성, 예술과 미디어 속 유전자."
  vi: "Khía cạnh đạo đức, pháp lý và xã hội của di truyền: xét nghiệm, quyền riêng tư, bản sắc, gen trong nghệ thuật."
  ms: "Sisi etika, undang-undang dan sosial genetik: ujian, privasi, identiti, serta gen dalam seni dan media."
  id: "Sisi etika, hukum, dan sosial genetika: tes, privasi, identitas, serta gen dalam seni dan media."
  hi: "जेनेटिक्स के नैतिक, कानूनी और सामाजिक पहलू: जाँच, निजता, पहचान, और कला-मीडिया में जीन।"
outcomes:
  - en: "Apply core ethical principles to genetic cases"
    zh: "用核心伦理原则分析遗传案例"
    zh-TW: "用核心倫理原則分析遺傳案例"
    ja: "基本的な倫理原則を遺伝の事例に当てはめる"
    ko: "핵심 윤리 원칙을 유전 사례에 적용하기"
    vi: "Áp dụng nguyên tắc đạo đức cốt lõi vào ca di truyền"
    ms: "Gunakan prinsip etika teras pada kes genetik"
    id: "Menerapkan prinsip etika inti pada kasus genetik"
    hi: "मूल नैतिक सिद्धांत आनुवंशिक मामलों पर लागू करना"
  - en: "Explain the basics of heredity and genetic tests"
    zh: "解释遗传和基因检测的基础知识"
    zh-TW: "解釋遺傳和基因檢測的基礎知識"
    ja: "遺伝と遺伝子検査の基本を説明する"
    ko: "유전과 유전자 검사의 기초 설명하기"
    vi: "Giải thích cơ bản về di truyền và xét nghiệm gen"
    ms: "Terangkan asas pewarisan dan ujian genetik"
    id: "Menjelaskan dasar pewarisan dan tes genetik"
    hi: "आनुवंशिकता और जेनेटिक जाँच की बुनियादी बातें समझाना"
  - en: "Discuss genetics in law and society"
    zh: "讨论遗传学在法律和社会中的问题"
    zh-TW: "討論遺傳學在法律和社會中的問題"
    ja: "法と社会における遺伝学を論じる"
    ko: "법과 사회 속 유전학 논의하기"
    vi: "Thảo luận di truyền trong luật pháp và xã hội"
    ms: "Bincangkan genetik dalam undang-undang dan masyarakat"
    id: "Membahas genetika dalam hukum dan masyarakat"
    hi: "कानून और समाज में जेनेटिक्स पर चर्चा करना"
