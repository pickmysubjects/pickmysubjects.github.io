code: ABPL90295
year: 2027
learn:
  en: "Building laws and the Building Code of Australia, with a strong focus on fire safety, egress and fire engineering."
  zh: "建筑法律和《澳大利亚建筑规范》，重点是消防安全、疏散和消防工程。"
  zh-TW: "建築法律與《澳洲建築規範》，重點在消防安全、逃生與防火工程。"
  ja: "建築関連法と豪州建築基準（BCA）。特に防火・避難・火災安全工学。"
  ko: "건축 법규와 호주 건축기준(BCA), 특히 화재 안전·피난·화재공학."
  vi: "Luật xây dựng và Quy chuẩn Xây dựng Úc, tập trung vào an toàn cháy, thoát nạn."
  ms: "Undang-undang bangunan dan Kod Bangunan Australia, fokus pada keselamatan kebakaran."
  id: "Hukum bangunan dan Building Code of Australia, fokus pada keselamatan kebakaran."
  hi: "भवन कानून और ऑस्ट्रेलियाई बिल्डिंग कोड, ख़ासकर अग्नि सुरक्षा और निकास।"
outcomes:
  - en: "Interpret Building Code requirements for a project"
    zh: "为项目解读建筑规范要求"
    zh-TW: "為專案解讀建築規範要求"
    ja: "プロジェクトに建築基準を当てはめる"
    ko: "프로젝트에 건축기준 요건 해석하기"
    vi: "Diễn giải yêu cầu quy chuẩn cho một dự án"
    ms: "Mentafsir keperluan Kod Bangunan untuk projek"
    id: "Menafsirkan ketentuan Building Code untuk proyek"
    hi: "परियोजना के लिए बिल्डिंग कोड की शर्तें समझना"
  - en: "Explain fire safety design, egress and fire spread control"
    zh: "说明防火设计、疏散和火势控制"
    zh-TW: "說明防火設計、逃生與火勢控制"
    ja: "防火設計・避難・延焼防止を説明する"
    ko: "방화 설계·피난·연소 확대 방지 설명하기"
    vi: "Giải thích thiết kế an toàn cháy và thoát nạn"
    ms: "Menerangkan reka bentuk keselamatan kebakaran dan laluan keluar"
    id: "Menjelaskan desain keselamatan kebakaran dan jalur evakuasi"
    hi: "अग्नि सुरक्षा डिज़ाइन और निकास समझाना"
