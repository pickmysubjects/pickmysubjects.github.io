code: MUST30015
year: 2026
learn:
  en: "A capstone of three shows with industry professionals: a new work, a student-devised piece and a mainstage musical."
  zh: "与业内人士合作的毕业演出：新作、学生自编作品和一部大型音乐剧。"
  zh-TW: "與業界人士合作的畢業演出：新作、學生自編作品和一部大型音樂劇。"
  ja: "業界人と作る3本の卒業公演：新作、学生創作、本公演ミュージカル。"
  ko: "업계 전문가와 함께하는 캡스톤 3편: 신작, 학생 창작, 메인 무대 뮤지컬."
  vi: "Đồ án cuối với 3 vở cùng người trong ngành: tác phẩm mới, tự dựng và nhạc kịch lớn."
  ms: "Projek akhir tiga persembahan: karya baharu, ciptaan pelajar dan muzikal pentas utama."
  id: "Proyek akhir tiga pentas: karya baru, karya ciptaan mahasiswa dan musikal panggung utama."
  hi: "इंडस्ट्री पेशेवरों के साथ तीन शो: नया काम, छात्र-रचित पीस और मेनस्टेज म्यूज़िकल।"
outcomes:
  - en: "Perform in a new music theatre work"
    zh: "参演一部原创音乐剧新作"
    zh-TW: "參演一部原創音樂劇新作"
    ja: "新作ミュージカルに出演する"
    ko: "신작 뮤지컬에 출연하기"
    vi: "Diễn trong một vở nhạc kịch mới"
    ms: "Beraksi dalam karya teater muzikal baharu"
    id: "Tampil di karya teater musikal baru"
    hi: "नए म्यूज़िकल थिएटर काम में प्रदर्शन"
  - en: "Devise a music theatre piece with peers"
    zh: "与同学共同编创音乐剧"
    zh-TW: "與同學共同編創音樂劇"
    ja: "仲間とミュージカル作品を創作する"
    ko: "동료와 뮤지컬 작품 창작하기"
    vi: "Cùng bạn dựng một tiết mục nhạc kịch"
    ms: "Cipta karya muzikal bersama rakan"
    id: "Membuat karya musikal bersama rekan"
    hi: "साथियों के साथ म्यूज़िकल पीस रचना"
  - en: "Work to professional production standards"
    zh: "按专业制作标准工作"
    zh-TW: "按專業製作標準工作"
    ja: "プロの制作水準で取り組む"
    ko: "전문 제작 기준에 맞춰 일하기"
    vi: "Làm việc theo chuẩn sản xuất chuyên nghiệp"
    ms: "Bekerja ikut standard produksi profesional"
    id: "Bekerja sesuai standar produksi profesional"
    hi: "पेशेवर प्रोडक्शन मानकों पर काम करना"
