code: FNCE90085
year: 2027
learn:
  en: "Capstone: research a current finance issue with practitioners and explain it to non-specialists in writing or video."
  zh: "毕业综合课：与业界人士一起研究当前金融议题，并用文字或视频向非专业读者讲清楚。"
  zh-TW: "畢業總整課：與業界人士一起研究當前金融議題，並用文字或影片向非專業讀者說清楚。"
  ja: "総仕上げ科目：実務家と時事的な金融問題を調べ、文章や動画で一般向けに説明する。"
  ko: "캡스톤: 실무자와 금융 현안을 조사하고 글이나 영상으로 일반인에게 설명한다."
  vi: "Môn tổng kết: nghiên cứu vấn đề tài chính thời sự với người trong ngành, giải thích cho người ngoài ngành."
  ms: "Subjek puncak: kaji isu kewangan semasa bersama pengamal dan terangkan kepada orang awam melalui tulisan atau video."
  id: "Capstone: meneliti isu keuangan terkini bersama praktisi dan menjelaskannya ke orang awam lewat tulisan atau video."
  hi: "कैपस्टोन: पेशेवरों के साथ मौजूदा वित्त मुद्दे पर शोध, और आम लोगों को लेख या वीडियो में समझाना।"
outcomes:
  - en: "Research a current issue in finance"
    zh: "研究一个当前金融议题"
    zh-TW: "研究一個當前金融議題"
    ja: "時事的な金融問題を調べる"
    ko: "금융 현안 조사하기"
    vi: "Nghiên cứu một vấn đề tài chính thời sự"
    ms: "Mengkaji isu kewangan semasa"
    id: "Meneliti isu keuangan terkini"
    hi: "वित्त के किसी मौजूदा मुद्दे पर शोध"
  - en: "Explain finance clearly to a general audience"
    zh: "向大众清楚讲解金融问题"
    zh-TW: "向大眾清楚講解金融問題"
    ja: "一般の人に金融をわかりやすく説明する"
    ko: "일반인에게 금융을 쉽게 설명하기"
    vi: "Giải thích tài chính rõ ràng cho công chúng"
    ms: "Menerangkan kewangan dengan jelas kepada orang awam"
    id: "Menjelaskan keuangan dengan jelas ke publik"
    hi: "आम लोगों को वित्त साफ़ तरीके से समझाना"
