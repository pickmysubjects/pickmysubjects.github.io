code: MGMT90261
year: 2027
learn:
  en: "Using people data for HR decisions: designing HR metrics, collecting data, choosing statistical tests and visualising results."
  zh: "用人员数据支持人力资源决策：设计 HR 指标、收集数据、选择统计检验并可视化结果。"
  zh-TW: "用人員資料支援人資決策：設計人資指標、蒐集資料、選擇統計檢定並視覺化結果。"
  ja: "人材データを人事判断に活かす：HR指標の設計、データ収集、統計検定の選択、結果の可視化。"
  ko: "인사 데이터를 HR 의사결정에 활용: HR 지표 설계, 데이터 수집, 통계 검정 선택, 결과 시각화."
  vi: "Dùng dữ liệu con người cho quyết định nhân sự: thiết kế chỉ số, thu thập dữ liệu, chọn kiểm định thống kê, trực quan hóa."
  ms: "Guna data manusia untuk keputusan HR: mereka metrik HR, mengumpul data, memilih ujian statistik dan visualisasi."
  id: "Memakai data orang untuk keputusan SDM: merancang metrik, mengumpulkan data, memilih uji statistik dan visualisasi."
  hi: "HR फ़ैसलों के लिए कर्मचारी डेटा: HR मेट्रिक्स बनाना, डेटा जुटाना, सांख्यिकीय परीक्षण चुनना और नतीजे दिखाना।"
outcomes:
  - en: "Analyse and present HR data with statistics"
    zh: "用统计方法分析并呈现 HR 数据"
    zh-TW: "以統計方法分析並呈現人資資料"
    ja: "統計でHRデータを分析し示す"
    ko: "통계로 HR 데이터 분석·제시하기"
    vi: "Phân tích, trình bày dữ liệu nhân sự bằng thống kê"
    ms: "Menganalisis dan membentang data HR dengan statistik"
    id: "Menganalisis dan menyajikan data SDM dengan statistik"
    hi: "सांख्यिकी से HR डेटा का विश्लेषण और प्रस्तुति करना"
  - en: "Link HR metrics to business strategy"
    zh: "把 HR 指标与经营战略联系起来"
    zh-TW: "將人資指標與經營策略連結起來"
    ja: "HR指標を経営戦略に結びつける"
    ko: "HR 지표를 경영 전략과 연결하기"
    vi: "Gắn chỉ số nhân sự với chiến lược kinh doanh"
    ms: "Mengaitkan metrik HR dengan strategi perniagaan"
    id: "Mengaitkan metrik SDM dengan strategi bisnis"
    hi: "HR मेट्रिक्स को व्यापार रणनीति से जोड़ना"
