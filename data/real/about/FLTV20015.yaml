code: FLTV20015
year: 2026
learn:
  en: "Create and animate characters and worlds in 2D and 3D: acting, timing, colour, lighting, model sheets and storyboards."
  zh: "在 2D 与 3D 中创作并驱动角色与场景：表演、节奏、色彩、灯光、设定图与分镜。"
  zh-TW: "在 2D 與 3D 中創作並驅動角色與場景：表演、節奏、色彩、燈光、設定圖與分鏡。"
  ja: "2Dと3Dでキャラクターと世界を作り動かす：演技、タイミング、色、照明、設定画、絵コンテ。"
  ko: "2D와 3D로 캐릭터와 세계를 만들고 움직인다: 연기, 타이밍, 색, 조명, 모델 시트, 스토리보드."
  vi: "Tạo và làm chuyển động nhân vật, thế giới 2D và 3D: diễn xuất, nhịp, màu, ánh sáng, bảng mẫu, phân cảnh."
  ms: "Cipta dan animasikan watak serta dunia 2D dan 3D: lakonan, masa, warna, cahaya dan papan cerita."
  id: "Membuat dan menganimasikan tokoh serta dunia 2D dan 3D: akting, timing, warna, cahaya, storyboard."
  hi: "2D और 3D में किरदार व दुनिया बनाना और एनिमेट करना: अभिनय, टाइमिंग, रंग, लाइटिंग, मॉडल शीट, स्टोरीबोर्ड।"
outcomes:
  - en: "Design original characters and settings"
    zh: "设计原创角色与场景"
    zh-TW: "設計原創角色與場景"
    ja: "オリジナルのキャラと舞台を作る"
    ko: "오리지널 캐릭터와 배경 디자인하기"
    vi: "Thiết kế nhân vật và bối cảnh gốc"
    ms: "Reka watak dan latar asli"
    id: "Merancang tokoh dan latar orisinal"
    hi: "मौलिक किरदार और परिवेश डिज़ाइन करना"
  - en: "Animate with good timing and acting"
    zh: "用恰当的节奏与表演制作动画"
    zh-TW: "用恰當的節奏與表演製作動畫"
    ja: "適切なタイミングと演技で動かす"
    ko: "좋은 타이밍과 연기로 애니메이션 만들기"
    vi: "Làm hoạt hình với nhịp và diễn xuất tốt"
    ms: "Animasikan dengan masa dan lakonan baik"
    id: "Menganimasikan dengan timing dan akting baik"
    hi: "अच्छी टाइमिंग और अभिनय से एनिमेट करना"
  - en: "Produce a short test animation"
    zh: "制作一段短的测试动画"
    zh-TW: "製作一段短的測試動畫"
    ja: "短いテストアニメを作る"
    ko: "짧은 테스트 애니메이션 만들기"
    vi: "Làm một đoạn hoạt hình thử ngắn"
    ms: "Hasilkan animasi ujian pendek"
    id: "Membuat animasi uji pendek"
    hi: "छोटी टेस्ट एनिमेशन बनाना"
