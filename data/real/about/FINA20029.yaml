code: FINA20029
year: 2026
learn:
  en: "Art from the 1960s to 2000: high modernism, its challengers and postmodern art, and how to interpret them."
  zh: "1960年代至2000年的艺术：盛期现代主义、对它的挑战与后现代艺术及其解读。"
  zh-TW: "1960年代至2000年的藝術：盛期現代主義、對它的挑戰與後現代藝術及其解讀。"
  ja: "1960年代から2000年までの美術：盛期モダニズム、その批判、ポストモダン美術の読み方。"
  ko: "1960년대~2000년 미술: 전성기 모더니즘, 그에 대한 도전, 포스트모던 미술과 해석."
  vi: "Nghệ thuật từ thập niên 1960 đến 2000: hiện đại đỉnh cao, những thách thức và nghệ thuật hậu hiện đại."
  ms: "Seni dari 1960-an hingga 2000: modenisme tinggi, cabarannya, seni pascamoden dan cara mentafsirnya."
  id: "Seni 1960-an hingga 2000: modernisme tinggi, tantangannya, seni pascamodern, dan cara menafsirkannya."
  hi: "1960 से 2000 तक की कला: हाई मॉडर्निज़्म, उसकी चुनौतियाँ, पोस्टमॉडर्न कला और उनकी व्याख्या।"
outcomes:
  - en: "Explain the shift from modern to postmodern art"
    zh: "说明从现代到后现代艺术的转变"
    zh-TW: "說明從現代到後現代藝術的轉變"
    ja: "近代から現代への美術の転換を説明する"
    ko: "모던에서 포스트모던 미술로의 전환 설명하기"
    vi: "Giải thích bước chuyển từ hiện đại sang hậu hiện đại"
    ms: "Jelaskan peralihan seni moden ke pascamoden"
    id: "Menjelaskan pergeseran seni modern ke pascamodern"
    hi: "आधुनिक से पोस्टमॉडर्न कला की ओर बदलाव समझाना"
  - en: "Interpret recent artworks in context"
    zh: "结合背景解读近期艺术作品"
    zh-TW: "結合背景解讀近期藝術作品"
    ja: "近年の作品を文脈の中で解釈する"
    ko: "최근 작품을 맥락 속에서 해석하기"
    vi: "Diễn giải tác phẩm gần đây trong bối cảnh"
    ms: "Tafsir karya terkini dalam konteks"
    id: "Menafsirkan karya mutakhir sesuai konteks"
    hi: "हाल की कलाकृतियों की संदर्भ में व्याख्या"
  - en: "Write a researched essay on art theory"
    zh: "撰写艺术理论研究论文"
    zh-TW: "撰寫藝術理論研究論文"
    ja: "美術理論について調べて論文を書く"
    ko: "미술 이론 연구 에세이 쓰기"
    vi: "Viết tiểu luận nghiên cứu về lý luận nghệ thuật"
    ms: "Tulis esei kajian tentang teori seni"
    id: "Menulis esai riset tentang teori seni"
    hi: "कला सिद्धांत पर रिसर्च निबंध लिखना"
