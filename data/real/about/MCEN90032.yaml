code: MCEN90032
year: 2027
learn:
  en: "How sensors work, filtering their noisy data, and networking many sensors together."
  zh: "传感器原理、带噪数据的滤波，以及多传感器联网。"
  zh-TW: "感測器原理、含雜訊資料的濾波，以及多感測器聯網。"
  ja: "センサーの仕組み、ノイズを含むデータのフィルタリング、多数のセンサーのネットワーク化。"
  ko: "센서 원리, 잡음 데이터 필터링, 다수 센서 네트워킹."
  vi: "Nguyên lý cảm biến, lọc dữ liệu nhiễu và kết nối mạng nhiều cảm biến."
  ms: "Cara penderia berfungsi, menapis data bising dan merangkaikan banyak penderia."
  id: "Cara kerja sensor, menyaring data berderau, dan menjaringkan banyak sensor."
  hi: "सेंसर कैसे काम करते हैं, शोर वाले डेटा की फ़िल्टरिंग और कई सेंसरों की नेटवर्किंग।"
outcomes:
  - en: "Explain how sensor systems in mechatronics work"
    zh: "解释机电系统中传感器的工作原理"
    zh-TW: "解釋機電系統中感測器的運作原理"
    ja: "メカトロニクスのセンサーシステムの仕組みを説明する"
    ko: "메카트로닉스 센서 시스템 원리 설명하기"
    vi: "Giải thích hoạt động của hệ cảm biến cơ điện tử"
    ms: "Menerangkan cara sistem penderia mekatronik berfungsi"
    id: "Menjelaskan cara kerja sistem sensor mekatronika"
    hi: "मेकाट्रॉनिक्स में सेंसर सिस्टम कैसे काम करते हैं"
  - en: "Build a sensing system that copes with real noise"
    zh: "搭建能应对实际噪声的传感系统"
    zh-TW: "建構能應對實際雜訊的感測系統"
    ja: "実際のノイズに対応するセンシングシステムを作る"
    ko: "실제 잡음에 대응하는 센싱 시스템 구현하기"
    vi: "Xây hệ cảm biến xử lý được nhiễu thực tế"
    ms: "Membina sistem penderiaan yang mampu menangani hingar sebenar"
    id: "Membangun sistem penginderaan yang tahan derau nyata"
    hi: "असली शोर झेलने वाला सेंसिंग सिस्टम बनाना"
  - en: "Present sensor design work in technical reports"
    zh: "用技术报告呈现传感器设计"
    zh-TW: "用技術報告呈現感測器設計"
    ja: "センサー設計を技術報告にまとめる"
    ko: "센서 설계를 기술 보고서로 발표하기"
    vi: "Trình bày thiết kế cảm biến bằng báo cáo kỹ thuật"
    ms: "Membentangkan reka bentuk penderia dalam laporan teknikal"
    id: "Menyajikan desain sensor dalam laporan teknis"
    hi: "सेंसर डिज़ाइन को तकनीकी रिपोर्ट में प्रस्तुत करना"
