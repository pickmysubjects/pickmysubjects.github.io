code: DNCE30026
year: 2026
learn:
  en: "Intensive studio training with daily class and conditioning, dancing in group tasks to live and recorded music and sound."
  zh: "密集的排练室训练：每日课程与体能，并随现场或录制音乐完成小组任务。"
  zh-TW: "密集的排練室訓練：每日課程與體能，並隨現場或錄製音樂完成小組任務。"
  ja: "毎日のクラスとコンディショニングの集中訓練。生演奏や録音の音楽に合わせたグループ課題。"
  ko: "매일 수업과 컨디셔닝의 집중 훈련, 라이브·녹음 음악과 함께하는 그룹 과제."
  vi: "Tập luyện chuyên sâu: lớp hằng ngày, thể lực, bài nhóm với nhạc sống và nhạc thu sẵn."
  ms: "Latihan studio intensif: kelas harian, kecergasan dan tugasan kumpulan dengan muzik langsung dan rakaman."
  id: "Latihan studio intensif: kelas harian, kebugaran dan tugas kelompok dengan musik langsung dan rekaman."
  hi: "गहन स्टूडियो ट्रेनिंग: रोज़ क्लास, कंडीशनिंग और लाइव व रिकॉर्डेड संगीत के साथ समूह कार्य।"
outcomes:
  - en: "Dance with rhythm and musical awareness"
    zh: "带着节奏感与音乐感起舞"
    zh-TW: "帶著節奏感與音樂感起舞"
    ja: "リズムと音楽性を持って踊る"
    ko: "리듬감과 음악성을 갖고 춤추기"
    vi: "Múa với cảm nhận nhịp điệu và âm nhạc"
    ms: "Menari dengan rentak dan kepekaan muzik"
    id: "Menari dengan ritme dan kepekaan musik"
    hi: "लय और संगीत की समझ के साथ नाचना"
  - en: "Plan your own independent practice"
    zh: "规划自己的自主练习"
    zh-TW: "規劃自己的自主練習"
    ja: "自主練習を計画する"
    ko: "자기 주도 연습 계획하기"
    vi: "Lên kế hoạch tự luyện tập"
    ms: "Rancang amalan kendiri sendiri"
    id: "Merencanakan latihan mandiri"
    hi: "अपना स्वतंत्र अभ्यास योजना बनाना"
  - en: "Work sensitively with other dancers and musicians"
    zh: "与其他舞者和乐手默契合作"
    zh-TW: "與其他舞者和樂手默契合作"
    ja: "他のダンサーや音楽家と息を合わせる"
    ko: "다른 무용수·연주자와 섬세하게 협업하기"
    vi: "Phối hợp tinh tế với vũ công và nhạc công"
    ms: "Bekerja peka bersama penari dan pemuzik lain"
    id: "Bekerja peka dengan penari dan musisi lain"
    hi: "दूसरे डांसरों और संगीतकारों के साथ तालमेल से काम करना"
