code: ABPL90030
year: 2027
learn:
  en: "Judging whether projects are worth doing: feasibility, financing, cost-benefit analysis and procurement strategy."
  zh: "判断项目是否值得做：可行性、融资、成本效益分析和采购策略。"
  zh-TW: "判斷專案是否值得做：可行性、融資、成本效益分析與採購策略。"
  ja: "プロジェクトの妥当性評価：実現可能性、資金調達、費用便益分析、調達戦略。"
  ko: "프로젝트 타당성 평가: 사업성, 자금 조달, 비용편익 분석, 조달 전략."
  vi: "Đánh giá dự án có đáng làm: khả thi, tài trợ, phân tích chi phí–lợi ích, chiến lược mua sắm."
  ms: "Menilai kebolehlaksanaan projek: pembiayaan, analisis kos-faedah dan strategi perolehan."
  id: "Menilai kelayakan proyek: pembiayaan, analisis biaya-manfaat dan strategi pengadaan."
  hi: "परियोजना कितनी उचित है: व्यवहार्यता, वित्तपोषण, लागत-लाभ विश्लेषण और खरीद रणनीति।"
outcomes:
  - en: "Build models to test a project's financial feasibility"
    zh: "建立模型检验项目的财务可行性"
    zh-TW: "建立模型檢驗專案的財務可行性"
    ja: "モデルで事業の採算性を検証する"
    ko: "모델로 프로젝트 재무 타당성 검토하기"
    vi: "Lập mô hình kiểm tra khả thi tài chính"
    ms: "Membina model untuk menguji kebolehlaksanaan kewangan"
    id: "Membuat model untuk menguji kelayakan finansial"
    hi: "परियोजना की वित्तीय व्यवहार्यता के लिए मॉडल बनाना"
  - en: "Weigh a project's costs, benefits and social impact"
    zh: "权衡项目的成本、收益和社会影响"
    zh-TW: "權衡專案的成本、效益與社會影響"
    ja: "費用・便益・社会的影響を比べる"
    ko: "비용·편익·사회적 영향 따져 보기"
    vi: "Cân nhắc chi phí, lợi ích và tác động xã hội"
    ms: "Menimbang kos, faedah dan kesan sosial projek"
    id: "Menimbang biaya, manfaat dan dampak sosial proyek"
    hi: "लागत, लाभ और सामाजिक प्रभाव तौलना"
