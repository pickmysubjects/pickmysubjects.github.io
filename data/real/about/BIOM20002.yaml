code: BIOM20002
year: 2026
learn:
  en: "How the human body is built and how it works: anatomy, physiology, keeping the body in balance, and how drugs act."
  zh: "人体的构造和运作：解剖、生理、身体如何维持平衡，以及药物如何起作用。"
  zh-TW: "人體的構造和運作：解剖、生理、身體如何維持平衡，以及藥物如何起作用。"
  ja: "人体のつくりと働き：解剖学、生理学、体のバランスを保つ仕組み、薬の働き方。"
  ko: "인체의 구조와 기능: 해부학, 생리학, 몸의 균형 유지, 약이 작용하는 방식."
  vi: "Cơ thể người được cấu tạo và hoạt động thế nào: giải phẫu, sinh lý, cân bằng nội môi và cách thuốc tác dụng."
  ms: "Struktur dan fungsi tubuh manusia: anatomi, fisiologi, cara badan kekal seimbang, dan cara ubat bertindak."
  id: "Struktur dan fungsi tubuh manusia: anatomi, fisiologi, cara tubuh menjaga keseimbangan, dan cara kerja obat."
  hi: "इंसानी शरीर की बनावट और काम: एनाटॉमी, फ़िज़ियोलॉजी, शरीर का संतुलन और दवाएँ कैसे असर करती हैं।"
outcomes:
  - en: "Describe the normal structure of the human body"
    zh: "描述人体的正常结构"
    zh-TW: "描述人體的正常結構"
    ja: "人体の正常な構造を説明する"
    ko: "인체의 정상 구조 설명하기"
    vi: "Mô tả cấu trúc bình thường của cơ thể người"
    ms: "Huraikan struktur normal tubuh manusia"
    id: "Menjelaskan struktur normal tubuh manusia"
    hi: "इंसानी शरीर की सामान्य संरचना बताना"
  - en: "Explain how organ systems keep the body in balance"
    zh: "解释各器官系统如何维持身体平衡"
    zh-TW: "解釋各器官系統如何維持身體平衡"
    ja: "器官系が体のバランスを保つ仕組みを説明する"
    ko: "기관계가 몸의 균형을 유지하는 방식 설명하기"
    vi: "Giải thích các hệ cơ quan giữ cân bằng cơ thể thế nào"
    ms: "Terangkan bagaimana sistem organ mengekalkan keseimbangan badan"
    id: "Menjelaskan bagaimana sistem organ menjaga keseimbangan tubuh"
    hi: "समझाना कि अंग-तंत्र शरीर का संतुलन कैसे बनाए रखते हैं"
  - en: "Explain the basics of how drugs work"
    zh: "讲清药物作用的基本原理"
    zh-TW: "講清藥物作用的基本原理"
    ja: "薬が効く基本的な仕組みを説明する"
    ko: "약이 작용하는 기본 원리 설명하기"
    vi: "Giải thích nguyên lý cơ bản của cách thuốc tác dụng"
    ms: "Terangkan asas cara ubat berfungsi"
    id: "Menjelaskan dasar cara kerja obat"
    hi: "दवाएँ कैसे काम करती हैं, इसकी बुनियादी बातें समझाना"
