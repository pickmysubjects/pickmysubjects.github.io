code: EDUC20077
year: 2026
learn:
  en: "Make collage with paper and mixed media, and explore how art-making can connect people and spark ideas."
  zh: "用纸与综合材料做拼贴，探索艺术创作如何连接人与激发想法。"
  zh-TW: "用紙與綜合媒材做拼貼，探索藝術創作如何連結人與激發想法。"
  ja: "紙と複合素材でコラージュを作り、制作が人をつなぎ発想を生む力を探る。"
  ko: "종이와 혼합 매체로 콜라주를 만들고, 예술 활동이 사람을 잇고 생각을 일으키는 방식을 탐구."
  vi: "Làm collage bằng giấy và chất liệu hỗn hợp, tìm hiểu nghệ thuật kết nối con người và khơi ý tưởng."
  ms: "Hasilkan kolaj dengan kertas dan media campuran, dan teroka cara seni menghubungkan orang dan mencetus idea."
  id: "Membuat kolase dari kertas dan media campuran, dan menjelajah cara seni menghubungkan orang dan memicu ide."
  hi: "कागज़ और मिश्रित सामग्री से कोलाज बनाना, और कला लोगों को कैसे जोड़ती है, यह खोजना।"
outcomes:
  - en: "Use a range of collage techniques"
    zh: "运用多种拼贴技法"
    zh-TW: "運用多種拼貼技法"
    ja: "さまざまなコラージュ技法を使う"
    ko: "다양한 콜라주 기법 쓰기"
    vi: "Dùng nhiều kỹ thuật collage"
    ms: "Guna pelbagai teknik kolaj"
    id: "Memakai beragam teknik kolase"
    hi: "कई कोलाज तकनीकें इस्तेमाल करना"
  - en: "Reflect on art as social connection"
    zh: "反思艺术作为社会联结"
    zh-TW: "反思藝術作為社會連結"
    ja: "社会的つながりとしての芸術を考える"
    ko: "사회적 연결로서의 예술 성찰하기"
    vi: "Suy ngẫm về nghệ thuật như sự kết nối xã hội"
    ms: "Renung seni sebagai hubungan sosial"
    id: "Merefleksikan seni sebagai koneksi sosial"
    hi: "कला को सामाजिक जुड़ाव के रूप में सोचना"
  - en: "Plan a collage activity for others"
    zh: "为他人策划拼贴活动"
    zh-TW: "為他人策劃拼貼活動"
    ja: "他者向けのコラージュ活動を計画する"
    ko: "다른 사람을 위한 콜라주 활동 기획하기"
    vi: "Lên kế hoạch hoạt động collage cho người khác"
    ms: "Rancang aktiviti kolaj untuk orang lain"
    id: "Merencanakan kegiatan kolase untuk orang lain"
    hi: "दूसरों के लिए कोलाज गतिविधि योजना बनाना"
