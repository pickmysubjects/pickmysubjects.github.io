code: MUSI20143
year: 2026
learn:
  en: "Sing unaccompanied songs from Africa, Asia, Oceania, Europe and the Americas in a big mixed choir, with online modules on their culture."
  zh: "在大型混声合唱团里演唱非洲、亚洲、大洋洲、欧洲和美洲的无伴奏歌曲，配合文化在线模块"
  zh-TW: "在大型混聲合唱團裡演唱非洲、亞洲、大洋洲、歐洲和美洲的無伴奏歌曲，配合文化線上單元"
  ja: "大きな混声合唱団でアフリカ、アジア、オセアニア、欧州、米州の無伴奏曲を歌い、文化をオンラインで学ぶ。"
  ko: "대규모 혼성 합창단에서 아프리카·아시아·오세아니아·유럽·미주의 무반주 노래를 부르고 문화를 온라인으로 학습."
  vi: "Hát không nhạc đệm các bài từ châu Phi, Á, Đại Dương, Âu, Mỹ trong dàn hợp xướng lớn, kèm học phần văn hóa."
  ms: "Nyanyi lagu tanpa iringan dari Afrika, Asia, Oceania, Eropah dan Amerika dalam koir besar, dengan modul budaya."
  id: "Menyanyikan lagu tanpa iringan dari Afrika, Asia, Oseania, Eropa, dan Amerika dalam paduan suara besar."
  hi: "बड़े मिश्रित गायक दल में अफ़्रीका, एशिया, ओशिनिया, यूरोप और अमेरिका के बिना संगत वाले गीत, संस्कृति पर ऑनलाइन मॉड्यूल।"
outcomes:
  - en: "Sing in harmony as part of a large choir"
    zh: "在大型合唱团中唱好和声"
    zh-TW: "在大型合唱團中唱好和聲"
    ja: "大合唱団の一員としてハーモニーを歌う"
    ko: "대규모 합창단에서 화음 맞춰 노래하기"
    vi: "Hát bè hài hòa trong dàn hợp xướng lớn"
    ms: "Menyanyi harmoni dalam koir besar"
    id: "Bernyanyi harmoni dalam paduan suara besar"
    hi: "बड़े गायक दल में सुर मिलाकर गाना"
  - en: "Describe vocal traditions from around the world"
    zh: "描述世界各地的声乐传统"
    zh-TW: "描述世界各地的聲樂傳統"
    ja: "世界各地の声楽の伝統を説明する"
    ko: "세계 각지의 성악 전통 설명하기"
    vi: "Mô tả các truyền thống thanh nhạc trên thế giới"
    ms: "Menerangkan tradisi vokal dari seluruh dunia"
    id: "Menjelaskan tradisi vokal dari seluruh dunia"
    hi: "दुनिया भर की गायन परंपराओं का वर्णन करना"
  - en: "Use musical terms to talk about what you hear"
    zh: "用音乐术语描述听到的音乐"
    zh-TW: "用音樂術語描述聽到的音樂"
    ja: "音楽用語で聴いたものを説明する"
    ko: "음악 용어로 들은 음악 설명하기"
    vi: "Dùng thuật ngữ âm nhạc để nói về điều nghe được"
    ms: "Menggunakan istilah muzik untuk menerangkan bunyi"
    id: "Memakai istilah musik untuk membahas yang didengar"
    hi: "सुनी हुई चीज़ को संगीत शब्दों में बताना"
