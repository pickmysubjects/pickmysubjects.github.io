code: CMCE10001
year: 2026
learn:
  en: "A first-semester BCom subject on how every commerce discipline can help tackle big challenges like sustainability."
  zh: "商科第一学期课：各商科领域如何一起应对可持续发展等难题。"
  zh-TW: "商科第一學期課：各商科領域如何一起因應永續發展等難題。"
  ja: "商学部1学期目の科目：各分野が持続可能性などの課題にどう取り組むか。"
  ko: "상경 첫 학기 과목: 여러 상경 분야가 지속가능성 같은 과제를 어떻게 다루는지."
  vi: "Môn học kỳ đầu của BCom: các ngành thương mại cùng giải quyết thách thức lớn như phát triển bền vững."
  ms: "Subjek semester pertama BCom: cara setiap bidang perdagangan bantu tangani cabaran seperti kelestarian."
  id: "Mata kuliah semester pertama BCom: cara tiap bidang bisnis membantu menjawab tantangan seperti keberlanjutan."
  hi: "BCom के पहले सेमेस्टर का सब्जेक्ट: कॉमर्स के सभी विषय सस्टेनेबिलिटी जैसी चुनौतियों में कैसे मदद करते हैं।"
outcomes:
  - en: "Explain how commerce thinking helps with social challenges"
    zh: "解释商科思维如何帮助应对社会难题"
    zh-TW: "說明商科思維如何幫助因應社會難題"
    ja: "商学の考え方が社会課題にどう役立つか説明する"
    ko: "상경적 사고가 사회 문제에 어떻게 도움 되는지 설명"
    vi: "Giải thích tư duy thương mại giúp giải quyết vấn đề xã hội"
    ms: "Terangkan cara pemikiran perdagangan bantu cabaran sosial"
    id: "Menjelaskan cara pikir bisnis membantu tantangan sosial"
    hi: "कॉमर्स की सोच सामाजिक चुनौतियों में कैसे मदद करती है, समझाना"
  - en: "Use tools from several disciplines to analyse sustainability"
    zh: "用多学科工具分析可持续发展问题"
    zh-TW: "用多學科工具分析永續發展問題"
    ja: "複数分野の手法で持続可能性を分析する"
    ko: "여러 분야의 도구로 지속가능성 분석"
    vi: "Dùng công cụ nhiều ngành để phân tích tính bền vững"
    ms: "Guna alat pelbagai bidang untuk analisis kelestarian"
    id: "Memakai alat dari berbagai bidang untuk analisis keberlanjutan"
    hi: "कई विषयों के तरीक़ों से सस्टेनेबिलिटी का विश्लेषण"
  - en: "Weigh competing arguments and evidence"
    zh: "权衡相互对立的论点和证据"
    zh-TW: "權衡相互對立的論點和證據"
    ja: "対立する主張と根拠を比較検討する"
    ko: "상충하는 주장과 근거 따져보기"
    vi: "Cân nhắc các lập luận và bằng chứng trái chiều"
    ms: "Timbang hujah dan bukti yang bercanggah"
    id: "Menimbang argumen dan bukti yang bertentangan"
    hi: "टकराते तर्कों और सबूतों को तौलना"
