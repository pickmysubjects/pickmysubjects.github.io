code: DRAM10036
year: 2026
learn:
  en: "Voice, movement and story basics for making your own theatre, through tasks, group devising and reflection."
  zh: "声音、形体与故事基础，用来创作原创戏剧。"
  zh-TW: "聲音、形體與故事基礎，用來創作原創戲劇。"
  ja: "声・身体・物語の基礎を学び、オリジナルの舞台を作る。"
  ko: "목소리·움직임·이야기의 기초로 창작 연극을 만든다."
  vi: "Nền tảng giọng, hình thể và câu chuyện để tự làm kịch."
  ms: "Asas suara, gerak dan cerita untuk mencipta teater sendiri."
  id: "Dasar suara, gerak dan cerita untuk membuat teater sendiri."
  hi: "अपना थिएटर बनाने के लिए आवाज़, गति और कहानी की बुनियाद।"
outcomes:
  - en: "Use voice and body with control on stage"
    zh: "在舞台上自如运用声音与身体"
    zh-TW: "在舞台上自如運用聲音與身體"
    ja: "舞台で声と身体を使いこなす"
    ko: "무대에서 목소리와 몸 조절하기"
    vi: "Điều khiển giọng và cơ thể trên sân khấu"
    ms: "Kawal suara dan tubuh di pentas"
    id: "Mengendalikan suara dan tubuh di panggung"
    hi: "मंच पर आवाज़ और शरीर पर नियंत्रण"
  - en: "Devise a short piece with a group"
    zh: "和小组一起编创短剧"
    zh-TW: "和小組一起編創短劇"
    ja: "グループで短い作品を創作する"
    ko: "그룹으로 짧은 작품 만들기"
    vi: "Cùng nhóm dựng một tiết mục ngắn"
    ms: "Cipta karya pendek bersama kumpulan"
    id: "Membuat karya pendek bersama kelompok"
    hi: "समूह के साथ छोटा नाटक रचना"
  - en: "Reflect on how your skills grow"
    zh: "反思自己技能的成长"
    zh-TW: "反思自己技能的成長"
    ja: "自分の技能の伸びを振り返る"
    ko: "자신의 기량 성장 돌아보기"
    vi: "Suy ngẫm về sự tiến bộ của mình"
    ms: "Renung perkembangan kemahiran sendiri"
    id: "Merefleksikan perkembangan keterampilan"
    hi: "अपने कौशल के विकास पर विचार करना"
