code: ABPL30046
year: 2026
learn:
  en: "How commercial buildings are framed and built in steel and concrete, from footings and basements to wide-span sheds."
  zh: "商业建筑如何用钢和混凝土搭建：从基础、地下室到大跨度厂房。"
  zh-TW: "商業建築如何以鋼與混凝土構築：從基礎、地下室到大跨度廠房。"
  ja: "商業建築を鉄骨とコンクリートでどう組み建てるか。基礎・地下から大スパン倉庫まで。"
  ko: "상업 건물을 철골과 콘크리트로 짓는 방법. 기초·지하부터 대경간 창고까지."
  vi: "Cách dựng nhà thương mại bằng thép và bê tông, từ móng, tầng hầm đến nhà xưởng nhịp lớn."
  ms: "Cara bangunan komersial dibina dengan keluli dan konkrit, dari asas dan ruang bawah tanah hingga gudang rentang lebar."
  id: "Cara gedung komersial dibangun dengan baja dan beton, dari fondasi dan basemen hingga gudang bentang lebar."
  hi: "व्यावसायिक इमारतें स्टील और कंक्रीट से कैसे बनती हैं, नींव और बेसमेंट से चौड़े शेड तक।"
outcomes:
  - en: "Read steelwork drawings and specifications"
    zh: "读懂钢结构图纸和规范"
    zh-TW: "看懂鋼構圖面與規範"
    ja: "鉄骨図面と仕様書を読む"
    ko: "철골 도면과 시방서 읽기"
    vi: "Đọc bản vẽ và chỉ dẫn kỹ thuật kết cấu thép"
    ms: "Baca lukisan dan spesifikasi keluli"
    id: "Membaca gambar dan spesifikasi baja"
    hi: "स्टीलवर्क ड्रॉइंग और विनिर्देश पढ़ना"
  - en: "Compare structural systems for different building types"
    zh: "比较不同建筑类型的结构体系"
    zh-TW: "比較不同建築類型的結構系統"
    ja: "建物種別ごとの構造形式を比較する"
    ko: "건물 유형별 구조 시스템 비교하기"
    vi: "So sánh hệ kết cấu cho các loại công trình"
    ms: "Banding sistem struktur untuk jenis bangunan berbeza"
    id: "Membandingkan sistem struktur tiap jenis gedung"
    hi: "अलग इमारतों के लिए संरचना प्रणालियों की तुलना"
  - en: "Choose piling and basement methods to suit the ground"
    zh: "根据地质条件选择桩基和地下室施工方法"
    zh-TW: "依地質條件選擇樁基與地下室工法"
    ja: "地盤に合う杭・地下工法を選ぶ"
    ko: "지반에 맞는 말뚝·지하 공법 고르기"
    vi: "Chọn phương pháp cọc và tầng hầm phù hợp nền đất"
    ms: "Pilih kaedah cerucuk dan ruang bawah tanah ikut tanah"
    id: "Memilih metode tiang pancang dan basemen sesuai tanah"
    hi: "ज़मीन के हिसाब से पाइलिंग और बेसमेंट विधि चुनना"
