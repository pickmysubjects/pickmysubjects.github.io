code: AGRI20026
year: 2026
learn:
  en: "How crops and pastures grow: roots, water, nutrients, photosynthesis and flowering under different climates."
  zh: "作物和牧草怎么生长：根系、水分、养分、光合作用与开花。"
  zh-TW: "作物和牧草如何生長：根系、水分、養分、光合作用與開花。"
  ja: "作物や牧草の育ち方：根、水、養分、光合成、開花のしくみ。"
  ko: "작물과 목초의 생장: 뿌리, 물, 양분, 광합성, 개화."
  vi: "Cây trồng và đồng cỏ lớn lên thế nào: rễ, nước, dinh dưỡng, quang hợp và ra hoa."
  ms: "Cara tanaman dan padang ragut membesar: akar, air, nutrien, fotosintesis dan pembungaan."
  id: "Cara tanaman dan padang rumput tumbuh: akar, air, hara, fotosintesis, dan pembungaan."
  hi: "फसलें और चरागाह कैसे बढ़ते हैं: जड़ें, पानी, पोषक तत्व, प्रकाश संश्लेषण और फूल आना।"
outcomes:
  - en: "Explain how crops take up water and nutrients"
    zh: "解释作物如何吸收水分和养分"
    zh-TW: "解釋作物如何吸收水分和養分"
    ja: "作物の水・養分吸収を説明する"
    ko: "작물의 물·양분 흡수 설명하기"
    vi: "Giải thích cách cây hút nước và dinh dưỡng"
    ms: "Terangkan cara tanaman menyerap air dan nutrien"
    id: "Menjelaskan cara tanaman menyerap air dan hara"
    hi: "समझाएँ कि फसलें पानी और पोषक तत्व कैसे लेती हैं"
  - en: "Analyse crop growth from photosynthesis and light"
    zh: "从光合作用和光照分析作物生长"
    zh-TW: "從光合作用和光照分析作物生長"
    ja: "光合成と受光から生育を分析する"
    ko: "광합성과 광 차단으로 생장 분석하기"
    vi: "Phân tích sinh trưởng từ quang hợp và ánh sáng"
    ms: "Analisis pertumbuhan dari fotosintesis dan cahaya"
    id: "Menganalisis pertumbuhan dari fotosintesis dan cahaya"
    hi: "प्रकाश संश्लेषण से फसल वृद्धि का विश्लेषण करें"
  - en: "Explain how flowering time helps crops cope with stress"
    zh: "解释开花时间如何帮助作物抗逆"
    zh-TW: "解釋開花時間如何幫助作物抗逆"
    ja: "開花時期とストレス適応を説明する"
    ko: "개화 시기와 스트레스 적응 설명하기"
    vi: "Giải thích vai trò thời điểm ra hoa khi gặp stress"
    ms: "Terangkan peranan masa berbunga dalam tekanan"
    id: "Menjelaskan peran waktu berbunga saat cekaman"
    hi: "तनाव में फूल आने के समय की भूमिका समझाएँ"
