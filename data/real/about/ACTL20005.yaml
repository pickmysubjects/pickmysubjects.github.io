code: ACTL20005
year: 2026
learn:
  en: "How investors choose portfolios and how asset prices are modelled, plus an intro to ruin theory and claims triangles."
  zh: "投资者如何构建投资组合、资产定价模型，以及破产理论和赔款三角入门。"
  zh-TW: "投資人如何建構投資組合、資產定價模型，以及破產理論和理賠三角形入門。"
  ja: "投資家のポートフォリオ選択と資産価格モデル、破産理論と支払三角形の入門。"
  ko: "투자자의 포트폴리오 선택과 자산가격 모형, 그리고 파산이론과 지급삼각형 입문."
  vi: "Nhà đầu tư chọn danh mục ra sao, mô hình hoá giá tài sản, cùng nhập môn lý thuyết phá sản và tam giác bồi thường."
  ms: "Cara pelabur memilih portfolio dan model harga aset, serta pengenalan teori kebankrapan dan segi tiga tuntutan."
  id: "Cara investor memilih portofolio dan model harga aset, plus pengantar teori kebangkrutan dan segitiga klaim."
  hi: "निवेशक पोर्टफ़ोलियो कैसे चुनते हैं और एसेट कीमतों के मॉडल, साथ में रुइन थ्योरी और क्लेम ट्रायंगल का परिचय।"
outcomes:
  - en: "Find efficient portfolios using mean–variance analysis"
    zh: "用均值-方差分析找出有效组合"
    zh-TW: "用平均數-變異數分析找出效率投資組合"
    ja: "平均・分散分析で効率的なポートフォリオを求める"
    ko: "평균-분산 분석으로 효율적 포트폴리오 찾기"
    vi: "Tìm danh mục hiệu quả bằng phân tích trung bình–phương sai"
    ms: "Cari portfolio cekap dengan analisis min–varians"
    id: "Mencari portofolio efisien dengan analisis mean–varians"
    hi: "मीन-वैरिएंस विश्लेषण से कुशल पोर्टफ़ोलियो खोजना"
  - en: "Apply and critique CAPM and factor models"
    zh: "应用并评价CAPM和因子模型"
    zh-TW: "應用並評析CAPM和因子模型"
    ja: "CAPMとファクターモデルを使い、その限界を論じる"
    ko: "CAPM과 요인 모형 적용·비판"
    vi: "Áp dụng và phản biện CAPM và mô hình nhân tố"
    ms: "Guna dan kritik CAPM serta model faktor"
    id: "Menerapkan dan mengkritisi CAPM dan model faktor"
    hi: "CAPM और फ़ैक्टर मॉडल लागू करना और उनकी आलोचना"
  - en: "Project claims from a run-off triangle"
    zh: "用赔款进展三角预测最终赔款"
    zh-TW: "用理賠發展三角形預測最終賠款"
    ja: "支払三角形から最終的な支払額を予測する"
    ko: "지급삼각형으로 최종 보험금 예측"
    vi: "Dự báo bồi thường từ tam giác phát triển"
    ms: "Unjur tuntutan daripada segi tiga larian"
    id: "Memproyeksikan klaim dari segitiga run-off"
    hi: "रन-ऑफ़ ट्रायंगल से क्लेम का अनुमान लगाना"
