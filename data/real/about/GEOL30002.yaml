code: GEOL30002
year: 2026
learn:
  en: "Structural geology and tectonics in the field, plus how geophysical data reveals what's underground."
  zh: "野外构造地质与板块构造，以及地球物理数据如何揭示地下情况。"
  zh-TW: "野外構造地質與板塊構造，以及地球物理資料如何揭示地下狀況。"
  ja: "野外での構造地質とテクトニクス、地球物理データで地下を知る方法。"
  ko: "현장 구조지질·지구조학과 지구물리 데이터로 지하를 파악하는 법."
  vi: "Địa chất cấu trúc và kiến tạo ngoài thực địa, cùng cách dữ liệu địa vật lý cho thấy lòng đất."
  ms: "Geologi struktur dan tektonik di lapangan, serta cara data geofizik mendedahkan bawah tanah."
  id: "Geologi struktur dan tektonik di lapangan, serta cara data geofisika mengungkap bawah tanah."
  hi: "फ़ील्ड में संरचनात्मक भूविज्ञान और टेक्टोनिक्स, और भूभौतिकीय डेटा ज़मीन के नीचे क्या दिखाता है।"
outcomes:
  - en: "Interpret geophysical data in a tectonic context"
    zh: "在构造背景下解读地球物理数据"
    zh-TW: "在構造背景下解讀地球物理資料"
    ja: "地球物理データを構造的文脈で解釈する"
    ko: "지구조 맥락에서 지구물리 데이터 해석하기"
    vi: "Diễn giải dữ liệu địa vật lý theo bối cảnh kiến tạo"
    ms: "Tafsir data geofizik dalam konteks tektonik"
    id: "Menafsirkan data geofisika dalam konteks tektonik"
    hi: "टेक्टोनिक संदर्भ में भूभौतिकीय डेटा समझना"
  - en: "Map and interpret complex 3D geology in the field"
    zh: "在野外记录并解读复杂三维地质"
    zh-TW: "在野外記錄並解讀複雜三維地質"
    ja: "野外で複雑な3D地質を記録・解釈する"
    ko: "현장에서 복잡한 3D 지질 기록·해석하기"
    vi: "Ghi nhận và diễn giải địa chất 3D phức tạp"
    ms: "Rekod dan tafsir geologi 3D kompleks di lapangan"
    id: "Mencatat dan menafsirkan geologi 3D di lapangan"
    hi: "फ़ील्ड में जटिल 3D भूविज्ञान दर्ज और व्याख्या करना"
