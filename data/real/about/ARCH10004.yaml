code: ARCH10004
year: 2026
learn:
  en: "An intro to architecture and landscape history and theory, using a real city to read how places are made."
  zh: "建筑与景观的历史与理论入门，以一座真实城市解读场所如何形成。"
  zh-TW: "建築與地景的歷史與理論入門，以一座真實城市解讀場所如何形成。"
  ja: "建築とランドスケープの歴史・理論入門。実際の都市から場所の成り立ちを読む。"
  ko: "건축·조경의 역사와 이론 입문. 실제 도시로 장소가 만들어지는 방식을 읽는다."
  vi: "Nhập môn lịch sử và lý thuyết kiến trúc, cảnh quan, đọc một thành phố thật để hiểu nơi chốn hình thành."
  ms: "Pengenalan sejarah dan teori seni bina serta landskap, membaca bandar sebenar untuk faham pembentukan tempat."
  id: "Pengantar sejarah dan teori arsitektur serta lanskap, membaca kota nyata untuk memahami terbentuknya tempat."
  hi: "आर्किटेक्चर और लैंडस्केप के इतिहास-सिद्धांत का परिचय, असली शहर से जगहों का बनना समझना।"
outcomes:
  - en: "Analyse how built places form and change"
    zh: "分析建成场所如何形成与变化"
    zh-TW: "分析建成場所如何形成與變化"
    ja: "場所の形成と変化を分析する"
    ko: "건조 환경의 형성과 변화 분석하기"
    vi: "Phân tích nơi chốn hình thành và thay đổi ra sao"
    ms: "Analisis cara tempat terbina terbentuk dan berubah"
    id: "Menganalisis cara tempat terbentuk dan berubah"
    hi: "बनी जगहें कैसे बनती-बदलती हैं, विश्लेषण करना"
  - en: "Use history and theory to read a design"
    zh: "用历史与理论解读设计"
    zh-TW: "用歷史與理論解讀設計"
    ja: "歴史と理論で設計を読み解く"
    ko: "역사와 이론으로 설계 읽기"
    vi: "Dùng lịch sử và lý thuyết để đọc thiết kế"
    ms: "Guna sejarah dan teori untuk membaca reka bentuk"
    id: "Memakai sejarah dan teori untuk membaca desain"
    hi: "इतिहास और सिद्धांत से डिज़ाइन को पढ़ना"
  - en: "Write clearly about places and design"
    zh: "清楚地撰写关于场所与设计的文字"
    zh-TW: "清楚地撰寫關於場所與設計的文字"
    ja: "場所と設計について明快に書く"
    ko: "장소와 설계에 대해 명확히 쓰기"
    vi: "Viết rõ ràng về nơi chốn và thiết kế"
    ms: "Menulis dengan jelas tentang tempat dan reka bentuk"
    id: "Menulis dengan jelas tentang tempat dan desain"
    hi: "जगहों और डिज़ाइन पर साफ़ लिखना"
