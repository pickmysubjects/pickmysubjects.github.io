code: MGMT90027
year: 2027
learn:
  en: "Managing a global workforce: cultural diversity, recruiting, performance, training and pay across countries."
  zh: "管理全球员工队伍：文化多样性，以及跨国的招聘、绩效、培训和薪酬。"
  zh-TW: "管理全球員工團隊：文化多元，以及跨國的招募、績效、訓練與薪酬。"
  ja: "グローバルな人材の管理：文化の多様性、各国での採用・業績・研修・報酬。"
  ko: "글로벌 인력 관리: 문화 다양성, 국가별 채용·성과·교육·보상."
  vi: "Quản lý lực lượng lao động toàn cầu: đa dạng văn hóa, tuyển dụng, hiệu suất, đào tạo, lương qua các nước."
  ms: "Mengurus tenaga kerja global: kepelbagaian budaya, pengambilan, prestasi, latihan dan gaji merentas negara."
  id: "Mengelola tenaga kerja global: keragaman budaya, rekrutmen, kinerja, pelatihan dan gaji lintas negara."
  hi: "वैश्विक कार्यबल का प्रबंधन: सांस्कृतिक विविधता, देशों में भर्ती, प्रदर्शन, प्रशिक्षण और वेतन।"
