code: DPSS20009
year: 2026
learn:
  en: "Travel to see theatre and design work in another city, with workshops and site visits, then reflect in a journal and paper."
  zh: "到另一座城市观摩剧场和设计作品，参加工作坊和参访，再写日志和反思文章。"
  zh-TW: "到另一座城市觀摩劇場與設計作品，參加工作坊與參訪，再寫日誌與反思文章。"
  ja: "別の都市で舞台やデザインを見学し、ワークショップと訪問の後、日誌と論考にまとめる。"
  ko: "다른 도시에서 공연과 디자인을 보고 워크숍·답사 후 일지와 글로 성찰."
  vi: "Đến thành phố khác xem sân khấu, thiết kế, dự hội thảo rồi viết nhật ký và bài suy ngẫm."
  ms: "Melawat bandar lain untuk teater dan reka bentuk, bengkel, kemudian jurnal dan esei."
  id: "Mengunjungi kota lain untuk teater dan desain, lokakarya, lalu jurnal dan esai."
  hi: "दूसरे शहर में थिएटर और डिज़ाइन देखना, वर्कशॉप, फिर जर्नल और लेख।"
outcomes:
  - en: "Observe design and production practice abroad"
    zh: "观察其他地方的设计与制作实践"
    zh-TW: "觀察其他地方的設計與製作實務"
    ja: "他地域のデザインと制作の実践を見る"
    ko: "다른 곳의 디자인·제작 관행 관찰하기"
    vi: "Quan sát thực hành thiết kế, sản xuất"
    ms: "Perhati amalan reka dan produksi"
    id: "Mengamati praktik desain dan produksi"
    hi: "दूसरी जगह डिज़ाइन और प्रोडक्शन देखना"
  - en: "Keep an annotated process journal"
    zh: "写附注释的过程日志"
    zh-TW: "寫附註解的過程日誌"
    ja: "注釈付きのプロセス日誌をつける"
    ko: "주석 달린 과정 일지 쓰기"
    vi: "Viết nhật ký quá trình có chú thích"
    ms: "Simpan jurnal proses beranotasi"
    id: "Membuat jurnal proses beranotasi"
    hi: "एनोटेटेड प्रक्रिया जर्नल रखना"
  - en: "Present findings with your group"
    zh: "与小组一起展示所见"
    zh-TW: "與小組一起發表所見"
    ja: "グループで成果を発表する"
    ko: "그룹으로 결과 발표하기"
    vi: "Trình bày kết quả cùng nhóm"
    ms: "Bentang dapatan bersama kumpulan"
    id: "Mempresentasikan temuan bersama kelompok"
    hi: "समूह के साथ निष्कर्ष प्रस्तुत करना"
