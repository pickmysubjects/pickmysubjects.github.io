code: ABPL30061
year: 2026
learn:
  en: "Landscape capstone: develop your own design project for a set site, drawing on design theory and ecology."
  zh: "景观方向毕业设计课：针对指定场地独立完成设计项目，结合设计理论与生态学。"
  zh-TW: "景觀方向畢業設計課：針對指定基地獨立完成設計專案，結合設計理論與生態學。"
  ja: "ランドスケープの総仕上げ。指定敷地で、設計理論と生態学を踏まえた自分の案を練る。"
  ko: "조경 캡스톤. 정해진 대지에 설계 이론과 생태학을 바탕으로 자신의 설계 프로젝트를 진행."
  vi: "Môn tốt nghiệp cảnh quan: tự làm dự án thiết kế cho khu đất cho trước, dựa trên lý thuyết và sinh thái học."
  ms: "Kemuncak landskap: bangunkan projek reka bentuk sendiri untuk tapak ditetapkan, berasaskan teori reka bentuk dan ekologi."
  id: "Capstone lanskap: mengembangkan proyek desain sendiri untuk tapak tertentu, berbekal teori desain dan ekologi."
  hi: "लैंडस्केप कैपस्टोन: तय साइट के लिए डिज़ाइन सिद्धांत और पारिस्थितिकी के सहारे अपना प्रोजेक्ट बनाना।"
outcomes:
  - en: "Run an independent landscape design project"
    zh: "独立完成一个景观设计项目"
    zh-TW: "獨立完成一個景觀設計專案"
    ja: "ランドスケープ設計を自力で進める"
    ko: "독립적으로 조경 설계 프로젝트 진행하기"
    vi: "Tự thực hiện một dự án thiết kế cảnh quan"
    ms: "Jalankan projek reka bentuk landskap sendiri"
    id: "Menjalankan proyek desain lanskap mandiri"
    hi: "स्वतंत्र लैंडस्केप डिज़ाइन प्रोजेक्ट चलाना"
  - en: "Use ecology and theory to read a site"
    zh: "用生态学和理论解读场地"
    zh-TW: "用生態學與理論解讀基地"
    ja: "生態学と理論で敷地を読み解く"
    ko: "생태학과 이론으로 대지 읽기"
    vi: "Dùng sinh thái học và lý thuyết để đọc khu đất"
    ms: "Guna ekologi dan teori untuk memahami tapak"
    id: "Membaca tapak dengan ekologi dan teori"
    hi: "पारिस्थितिकी और सिद्धांत से साइट को समझना"
  - en: "Produce a portfolio-ready project for postgraduate study"
    zh: "完成可放入作品集、衔接研究生学习的项目"
    zh-TW: "完成可放入作品集、銜接研究所的專案"
    ja: "大学院進学に使える作品を仕上げる"
    ko: "대학원 진학용 포트폴리오 작품 완성하기"
    vi: "Hoàn thành dự án cho hồ sơ học sau đại học"
    ms: "Hasilkan projek portfolio untuk pengajian pascasiswazah"
    id: "Menghasilkan karya portofolio untuk S2"
    hi: "स्नातकोत्तर के लिए पोर्टफ़ोलियो लायक प्रोजेक्ट बनाना"
