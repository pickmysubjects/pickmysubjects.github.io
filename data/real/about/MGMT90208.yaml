code: MGMT90208
year: 2027
learn:
  en: "How businesses balance economic, social and environmental goals: CSR, triple bottom line and stakeholder issues."
  zh: "企业如何平衡经济、社会和环境目标：企业社会责任、三重底线和利益相关者议题。"
  zh-TW: "企業如何平衡經濟、社會與環境目標：企業社會責任、三重底線與利害關係人議題。"
  ja: "企業が経済・社会・環境の目標をどう両立させるか：CSR、トリプルボトムライン、ステークホルダー。"
  ko: "기업이 경제·사회·환경 목표를 어떻게 균형 잡는지: CSR, 트리플 바텀라인, 이해관계자 문제."
  vi: "Doanh nghiệp cân bằng mục tiêu kinh tế, xã hội, môi trường ra sao: CSR, ba điểm mấu chốt, các bên liên quan."
  ms: "Cara perniagaan mengimbangi matlamat ekonomi, sosial dan alam sekitar: CSR, garis dasar tiga dan isu pihak berkepentingan."
  id: "Cara bisnis menyeimbangkan tujuan ekonomi, sosial dan lingkungan: CSR, triple bottom line dan isu pemangku kepentingan."
  hi: "कारोबार आर्थिक, सामाजिक और पर्यावरणीय लक्ष्यों में संतुलन कैसे बनाते हैं: CSR, ट्रिपल बॉटम लाइन और हितधारक मुद्दे।"
outcomes:
  - en: "Evaluate debates on business ethics"
    zh: "评价有关商业伦理的争论"
    zh-TW: "評價有關商業倫理的爭論"
    ja: "企業倫理の議論を評価する"
    ko: "기업 윤리 논쟁 평가하기"
    vi: "Đánh giá các tranh luận về đạo đức kinh doanh"
    ms: "Menilai perdebatan etika perniagaan"
    id: "Menilai perdebatan etika bisnis"
    hi: "व्यावसायिक नैतिकता की बहसों का मूल्यांकन करना"
  - en: "Apply sustainability ideas to real cases"
    zh: "将可持续理念用于真实案例"
    zh-TW: "將永續理念應用於真實個案"
    ja: "持続可能性の考え方を実例に当てはめる"
    ko: "지속가능성 개념을 실제 사례에 적용하기"
    vi: "Áp dụng ý tưởng bền vững vào tình huống thực"
    ms: "Menggunakan idea kelestarian pada kes sebenar"
    id: "Menerapkan ide keberlanjutan pada kasus nyata"
    hi: "स्थिरता के विचार असली मामलों पर लागू करना"
