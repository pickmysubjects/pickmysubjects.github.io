code: MUSI30182
year: 2026
learn:
  en: "A second semester of guitar ensemble with new pieces in a range of styles and group sizes."
  zh: "吉他合奏第二学期，以多种风格和编制演奏新作品。"
  zh-TW: "吉他合奏第二學期，以多種風格和編制演奏新作品。"
  ja: "ギター合奏の後期。様々な様式と編成で新曲に取り組む。"
  ko: "기타 합주 2학기. 여러 양식과 편성으로 새 곡 연주."
  vi: "Học kỳ hai hòa tấu guitar với bản nhạc mới, nhiều phong cách và quy mô."
  ms: "Semester kedua ensembel gitar dengan karya baharu pelbagai gaya."
  id: "Semester kedua ansambel gitar dengan karya baru beragam gaya."
  hi: "गिटार समूह का दूसरा सत्र, कई शैलियों और आकारों में नई रचनाएँ।"
outcomes:
  - en: "Learn new guitar ensemble repertoire"
    zh: "学习新的吉他合奏曲目"
    zh-TW: "學習新的吉他合奏曲目"
    ja: "新しいギター合奏曲を学ぶ"
    ko: "새 기타 합주 레퍼토리 익히기"
    vi: "Học tiết mục hòa tấu guitar mới"
    ms: "Pelajari repertoir ensembel gitar baharu"
    id: "Mempelajari repertoar ansambel gitar baru"
    hi: "नई गिटार समूह रचनाएँ सीखना"
  - en: "Keep time and balance with other guitarists"
    zh: "与其他吉他手保持节奏与平衡"
    zh-TW: "與其他吉他手保持節奏與平衡"
    ja: "他のギタリストとテンポとバランスを合わせる"
    ko: "다른 기타리스트와 박자·균형 맞추기"
    vi: "Giữ nhịp và cân bằng với người chơi khác"
    ms: "Jaga tempo dan imbangan bersama pemain lain"
    id: "Menjaga tempo dan keseimbangan bersama"
    hi: "दूसरे गिटारवादकों के साथ ताल और संतुलन रखना"
  - en: "Pass individual part tests"
    zh: "通过个人声部测试"
    zh-TW: "通過個人聲部測試"
    ja: "個人パートテストに合格する"
    ko: "개인 파트 테스트 통과하기"
    vi: "Vượt qua các bài kiểm tra bè cá nhân"
    ms: "Lulus ujian bahagian individu"
    id: "Lulus tes partisi individu"
    hi: "व्यक्तिगत भाग परीक्षाएँ पास करना"
