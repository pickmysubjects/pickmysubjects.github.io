code: CVEN30012
year: 2027
learn:
  en: "Project-based capstone: designing water-retaining structures and checking slope stability using realistic industry cases."
  zh: "项目式毕业设计：用真实行业案例设计挡水结构并分析边坡稳定。"
  zh-TW: "專題式畢業設計：用真實產業案例設計擋水結構並分析邊坡穩定。"
  ja: "プロジェクト型の総仕上げ：実際の業界事例で貯水構造物を設計し、斜面安定を解析する。"
  ko: "프로젝트 기반 캡스톤: 실제 업계 사례로 물막이 구조물을 설계하고 사면 안정성을 분석한다."
  vi: "Môn tổng kết theo dự án: thiết kế công trình giữ nước và phân tích ổn định mái dốc với tình huống thực tế trong ngành."
  ms: "Projek batu penamat: reka struktur penahan air dan semak kestabilan cerun menggunakan kes industri sebenar."
  id: "Capstone berbasis proyek: merancang struktur penahan air dan menganalisis stabilitas lereng dengan kasus industri nyata."
  hi: "प्रोजेक्ट-आधारित कैपस्टोन: असली उद्योग मामलों से पानी रोकने वाली संरचनाएँ डिज़ाइन करना और ढलान की स्थिरता जाँचना।"
outcomes:
  - en: "Solve design problems with geotechnical principles"
    zh: "用岩土原理解决设计问题"
    zh-TW: "用大地工程原理解決設計問題"
    ja: "地盤工学の原理で設計課題を解く"
    ko: "지반공학 원리로 설계 문제 해결하기"
    vi: "Giải bài toán thiết kế bằng nguyên lý địa kỹ thuật"
    ms: "Selesaikan masalah reka bentuk dengan prinsip geoteknik"
    id: "Menyelesaikan masalah desain dengan prinsip geoteknik"
    hi: "जियोटेक्निकल सिद्धांतों से डिज़ाइन समस्याएँ हल करना"
  - en: "Model designs in software and check the results"
    zh: "用软件建模并检验结果"
    zh-TW: "用軟體建模並檢驗結果"
    ja: "ソフトで設計をモデル化し結果を検証する"
    ko: "소프트웨어로 설계를 모델링하고 결과 검토하기"
    vi: "Mô hình hóa thiết kế bằng phần mềm và kiểm tra kết quả"
    ms: "Model reka bentuk dengan perisian dan semak hasilnya"
    id: "Memodelkan desain dengan perangkat lunak dan memeriksa hasilnya"
    hi: "सॉफ़्टवेयर में डिज़ाइन मॉडल करना और नतीजे जाँचना"
  - en: "Write professional technical reports"
    zh: "撰写专业技术报告"
    zh-TW: "撰寫專業技術報告"
    ja: "専門的な技術レポートを書く"
    ko: "전문 기술 보고서 작성하기"
    vi: "Viết báo cáo kỹ thuật chuyên nghiệp"
    ms: "Tulis laporan teknikal profesional"
    id: "Menulis laporan teknis profesional"
    hi: "पेशेवर तकनीकी रिपोर्ट लिखना"
