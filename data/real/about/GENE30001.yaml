code: GENE30001
year: 2026
learn:
  en: "How evolution shapes genes and genomes, and the genetic tools used to map and compare them."
  zh: "进化怎样改变基因和基因组，以及用来绘制和比较它们的遗传工具。"
  zh-TW: "演化怎樣改變基因和基因體，以及用來繪製和比較它們的遺傳工具。"
  ja: "進化が遺伝子やゲノムをどう形作るか、それらをマッピング・比較する遺伝学的ツール。"
  ko: "진화가 유전자와 유전체를 어떻게 형성하는지, 이를 매핑·비교하는 유전학 도구."
  vi: "Tiến hóa định hình gen và bộ gen ra sao, cùng công cụ di truyền để lập bản đồ và so sánh chúng."
  ms: "Cara evolusi membentuk gen dan genom, serta alat genetik untuk memeta dan membandingkannya."
  id: "Bagaimana evolusi membentuk gen dan genom, serta alat genetik untuk memetakan dan membandingkannya."
  hi: "विकास जीन और जीनोम को कैसे आकार देता है, और उन्हें मैप व तुलना करने के जेनेटिक टूल।"
outcomes:
  - en: "Explain how gene pools change over time"
    zh: "解释基因库怎样随时间变化"
    zh-TW: "解釋基因庫怎樣隨時間變化"
    ja: "遺伝子プールの時間的変化を説明する"
    ko: "유전자 풀이 시간에 따라 변하는 방식 설명"
    vi: "Giải thích vốn gen thay đổi theo thời gian"
    ms: "Terangkan cara kolam gen berubah dari masa ke masa"
    id: "Menjelaskan perubahan lungkang gen dari waktu ke waktu"
    hi: "जीन पूल समय के साथ कैसे बदलता है, समझाना"
  - en: "Measure evolutionary forces in real genomic data"
    zh: "在真实基因组数据中找出进化的作用"
    zh-TW: "在真實基因體資料中測量演化作用"
    ja: "実際のゲノムデータで進化の力を測る"
    ko: "실제 유전체 데이터에서 진화의 힘 측정"
    vi: "Đo các lực tiến hóa trong dữ liệu bộ gen thật"
    ms: "Ukur daya evolusi dalam data genom sebenar"
    id: "Mengukur gaya evolusi pada data genom nyata"
    hi: "असली जीनोम डेटा में विकासवादी ताकतें मापना"
  - en: "Link genetics to conservation and phylogenetics"
    zh: "把遗传学用到保育和系统发育上"
    zh-TW: "把遺傳學應用到保育和親緣關係研究"
    ja: "遺伝学を保全や系統学に結びつける"
    ko: "유전학을 보전·계통학과 연결"
    vi: "Liên hệ di truyền với bảo tồn và phát sinh loài"
    ms: "Kaitkan genetik dengan pemuliharaan dan filogenetik"
    id: "Mengaitkan genetika dengan konservasi dan filogenetik"
    hi: "जेनेटिक्स को संरक्षण और फ़ाइलोजेनेटिक्स से जोड़ना"
