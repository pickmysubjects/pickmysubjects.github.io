code: FLTV30021
year: 2026
learn:
  en: "Animation in interdisciplinary teams: plan, budget and manage shared projects, and learn the business side of animation."
  zh: "在跨学科团队中做动画：规划、预算与管理合作项目，了解动画行业的商业面。"
  zh-TW: "在跨領域團隊中做動畫：規劃、預算與管理合作專案，了解動畫產業的商業面。"
  ja: "分野横断チームでのアニメ制作：共同企画の計画・予算・管理と、アニメのビジネス面。"
  ko: "융합 팀 애니메이션: 공동 프로젝트를 기획·예산·관리하고 애니메이션 비즈니스를 배운다."
  vi: "Hoạt hình trong nhóm liên ngành: lập kế hoạch, ngân sách, quản lý dự án chung và mặt kinh doanh."
  ms: "Animasi dalam pasukan antara disiplin: rancang, bajet dan urus projek bersama, serta sisi perniagaan."
  id: "Animasi dalam tim interdisipliner: merencanakan, menganggarkan, mengelola proyek dan sisi bisnis."
  hi: "अंतर-विषयी टीमों में एनिमेशन: साझा प्रोजेक्ट की योजना, बजट, प्रबंधन और एनिमेशन का व्यावसायिक पक्ष।"
outcomes:
  - en: "Write proposals with a team"
    zh: "与团队一起撰写提案"
    zh-TW: "與團隊一起撰寫提案"
    ja: "チームで企画書を書く"
    ko: "팀과 함께 제안서 쓰기"
    vi: "Cùng nhóm viết đề xuất"
    ms: "Tulis cadangan bersama pasukan"
    id: "Menulis proposal bersama tim"
    hi: "टीम के साथ प्रस्ताव लिखना"
  - en: "Make a short animation together"
    zh: "合作完成一部短动画"
    zh-TW: "合作完成一部短動畫"
    ja: "共同で短いアニメを作る"
    ko: "함께 짧은 애니메이션 만들기"
    vi: "Cùng làm một phim hoạt hình ngắn"
    ms: "Hasilkan animasi pendek bersama"
    id: "Membuat animasi pendek bersama"
    hi: "मिलकर छोटी एनिमेशन बनाना"
  - en: "Understand the business of animation"
    zh: "了解动画行业的商业运作"
    zh-TW: "了解動畫產業的商業運作"
    ja: "アニメのビジネスを理解する"
    ko: "애니메이션 비즈니스 이해하기"
    vi: "Hiểu mặt kinh doanh của ngành hoạt hình"
    ms: "Fahami perniagaan animasi"
    id: "Memahami bisnis animasi"
    hi: "एनिमेशन के व्यवसाय को समझना"
