code: MUSI20232
year: 2026
learn:
  en: "From the Wilin Centre: Indigenous instruments in Australia, how they are made and their cultural and spiritual meaning."
  zh: "威林中心开设：澳大利亚原住民乐器的制作方式及其文化与精神意义。"
  zh-TW: "威林中心開設：澳洲原住民樂器的製作方式及其文化與精神意義。"
  ja: "ウィリン・センター開講：先住民の楽器の作り方と文化的・精神的な意味。"
  ko: "윌린 센터 개설: 원주민 악기의 제작 방식과 문화적·영적 의미."
  vi: "Từ Trung tâm Wilin: nhạc cụ bản địa Úc, cách làm và ý nghĩa văn hóa, tâm linh."
  ms: "Dari Pusat Wilin: alat muzik Orang Asli, cara dibuat serta makna budaya dan rohani."
  id: "Dari Wilin Centre: alat musik Pribumi, cara pembuatan serta makna budaya dan spiritual."
  hi: "विलिन सेंटर से: आदिवासी वाद्य, कैसे बनते हैं और उनका सांस्कृतिक-आध्यात्मिक अर्थ।"
outcomes:
  - en: "Explain how Indigenous instruments are made and used"
    zh: "说明原住民乐器的制作与使用"
    zh-TW: "說明原住民樂器的製作與使用"
    ja: "先住民の楽器の作り方と使い方を説明する"
    ko: "원주민 악기의 제작과 쓰임 설명하기"
    vi: "Giải thích cách làm và dùng nhạc cụ bản địa"
    ms: "Terangkan cara alat muzik Orang Asli dibuat"
    id: "Menjelaskan cara alat musik Pribumi dibuat"
    hi: "आदिवासी वाद्य कैसे बनते-बजते हैं, बताना"
  - en: "Write a listening guide to a piece of music"
    zh: "为一首作品写聆听导读"
    zh-TW: "為一首作品寫聆聽導讀"
    ja: "楽曲のリスニングガイドを書く"
    ko: "곡의 감상 가이드 작성하기"
    vi: "Viết hướng dẫn nghe cho một tác phẩm"
    ms: "Tulis panduan mendengar untuk satu karya"
    id: "Menulis panduan mendengar untuk satu karya"
    hi: "किसी रचना के लिए लिसनिंग गाइड लिखना"
  - en: "Reflect on cultural respect when studying music"
    zh: "反思研究音乐时的文化尊重"
    zh-TW: "反思研究音樂時的文化尊重"
    ja: "音楽を学ぶ際の文化的敬意を考える"
    ko: "음악 공부에서 문화 존중 성찰하기"
    vi: "Suy ngẫm về tôn trọng văn hóa khi học nhạc"
    ms: "Renungkan hormat budaya ketika mengkaji muzik"
    id: "Merefleksikan sikap hormat budaya saat belajar musik"
    hi: "संगीत पढ़ते समय सांस्कृतिक सम्मान पर विचार"
