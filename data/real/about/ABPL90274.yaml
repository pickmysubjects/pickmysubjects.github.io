code: ABPL90274
year: 2027
learn:
  en: "A foundation in how property markets work and the basic techniques for valuing commercial property in Australia."
  zh: "房地产市场如何运作，以及澳大利亚商业物业估价的基本方法。"
  zh-TW: "不動產市場如何運作，以及澳洲商業不動產估價的基本方法。"
  ja: "不動産市場の仕組みと、豪州の商業不動産評価の基本。"
  ko: "부동산 시장의 작동 원리와 호주 상업용 부동산 평가 기초."
  vi: "Nền tảng về thị trường bất động sản và kỹ thuật định giá bất động sản thương mại ở Úc."
  ms: "Asas pasaran hartanah dan teknik asas menilai hartanah komersial di Australia."
  id: "Dasar pasar properti dan teknik dasar menilai properti komersial di Australia."
  hi: "संपत्ति बाज़ार कैसे चलते हैं और ऑस्ट्रेलिया में वाणिज्यिक संपत्ति मूल्यांकन की बुनियाद।"
outcomes:
  - en: "Explain how property markets function"
    zh: "解释房地产市场如何运作"
    zh-TW: "解釋不動產市場如何運作"
    ja: "不動産市場の仕組みを説明する"
    ko: "부동산 시장의 작동 설명하기"
    vi: "Giải thích thị trường bất động sản vận hành"
    ms: "Menerangkan fungsi pasaran hartanah"
    id: "Menjelaskan cara pasar properti bekerja"
    hi: "संपत्ति बाज़ार की कार्यप्रणाली समझाना"
  - en: "Value commercial property with standard methods"
    zh: "用常用方法评估商业物业"
    zh-TW: "用常用方法評估商業不動產"
    ja: "標準的な手法で商業不動産を評価する"
    ko: "표준 방법으로 상업용 부동산 평가하기"
    vi: "Định giá bất động sản thương mại"
    ms: "Menilai hartanah komersial dengan kaedah biasa"
    id: "Menilai properti komersial dengan metode standar"
    hi: "मानक तरीक़ों से वाणिज्यिक संपत्ति मूल्यांकन"
