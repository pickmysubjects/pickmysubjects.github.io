code: GDES20001
year: 2026
learn:
  en: "Second graphic design studio: communicate with image, text, motion and sound across a range of media."
  zh: "第二门平面设计工作室：用图像、文字、动态与声音在多种媒介中传达。"
  zh-TW: "第二門平面設計工作室：用圖像、文字、動態與聲音在多種媒介中傳達。"
  ja: "2つ目のグラフィックデザインスタジオ：画像・文字・動き・音でさまざまな媒体に伝える。"
  ko: "두 번째 그래픽 디자인 스튜디오: 이미지·글·모션·사운드로 여러 매체에서 소통."
  vi: "Studio thiết kế đồ họa thứ hai: truyền đạt bằng hình, chữ, chuyển động và âm thanh trên nhiều phương tiện."
  ms: "Studio reka grafik kedua: berkomunikasi dengan imej, teks, gerakan dan bunyi merentas media."
  id: "Studio desain grafis kedua: berkomunikasi dengan gambar, teks, gerak, dan suara di berbagai media."
  hi: "दूसरा ग्राफ़िक डिज़ाइन स्टूडियो: इमेज, टेक्स्ट, मोशन और साउंड से कई माध्यमों में संवाद।"
outcomes:
  - en: "Combine image, text and motion"
    zh: "结合图像、文字与动态"
    zh-TW: "結合圖像、文字與動態"
    ja: "画像・文字・動きを組み合わせる"
    ko: "이미지·글·모션 결합하기"
    vi: "Kết hợp hình, chữ và chuyển động"
    ms: "Gabung imej, teks dan gerakan"
    id: "Memadukan gambar, teks, dan gerak"
    hi: "इमेज, टेक्स्ट और मोशन को जोड़ना"
  - en: "Pick a communication strategy for an audience"
    zh: "为受众选择传达策略"
    zh-TW: "為受眾選擇傳達策略"
    ja: "受け手に合った伝え方を選ぶ"
    ko: "대상에 맞는 소통 전략 고르기"
    vi: "Chọn chiến lược truyền thông cho đối tượng"
    ms: "Pilih strategi komunikasi untuk khalayak"
    id: "Memilih strategi komunikasi untuk audiens"
    hi: "दर्शकों के लिए संवाद रणनीति चुनना"
  - en: "Present finished design pieces"
    zh: "展示完成的设计作品"
    zh-TW: "展示完成的設計作品"
    ja: "完成したデザインを発表する"
    ko: "완성된 디자인 작품 발표하기"
    vi: "Trình bày sản phẩm thiết kế hoàn chỉnh"
    ms: "Bentang hasil reka bentuk siap"
    id: "Menyajikan karya desain jadi"
    hi: "तैयार डिज़ाइन काम पेश करना"
