code: MUSI30291
year: 2026
learn:
  en: "Italian and French diction for singers: IPA transcription and clear, natural sung pronunciation."
  zh: "意大利语和法语歌唱语音：国际音标转写和自然清晰的演唱发音。"
  zh-TW: "義大利語和法語歌唱語音：國際音標轉寫與自然清晰的演唱發音。"
  ja: "歌手のためのイタリア語・フランス語ディクション：IPA表記と自然な発音。"
  ko: "가수를 위한 이탈리아어·프랑스어 딕션: IPA 표기와 자연스러운 발음."
  vi: "Phát âm tiếng Ý và Pháp khi hát: phiên âm IPA và phát âm rõ, tự nhiên."
  ms: "Diksi Itali dan Perancis untuk penyanyi: transkripsi IPA dan sebutan jelas."
  id: "Diksi Italia dan Prancis untuk penyanyi: transkripsi IPA dan lafal jelas."
  hi: "गायकों के लिए इतालवी और फ़्रेंच उच्चारण: IPA लिप्यंतरण और साफ़ गायन।"
outcomes:
  - en: "Transcribe song texts into IPA"
    zh: "把歌词转写为国际音标"
    zh-TW: "把歌詞轉寫為國際音標"
    ja: "歌詞をIPAで書き表す"
    ko: "가사를 IPA로 옮겨 적기"
    vi: "Phiên âm lời bài hát sang IPA"
    ms: "Transkripsi lirik ke IPA"
    id: "Mentranskripsi lirik ke IPA"
    hi: "गीत के बोल IPA में लिखना"
  - en: "Sing Italian and French with clear diction"
    zh: "用清晰发音演唱意大利语和法语"
    zh-TW: "用清晰發音演唱義大利語和法語"
    ja: "イタリア語とフランス語を明瞭に歌う"
    ko: "이탈리아어·프랑스어를 또렷하게 노래하기"
    vi: "Hát tiếng Ý và Pháp phát âm rõ"
    ms: "Nyanyi Itali dan Perancis dengan jelas"
    id: "Bernyanyi Italia dan Prancis dengan jelas"
    hi: "इतालवी और फ़्रेंच साफ़ उच्चारण से गाना"
  - en: "Hear the gap between spoken and sung words"
    zh: "辨别说话与歌唱发音的差异"
    zh-TW: "辨別說話與歌唱發音的差異"
    ja: "話す発音と歌う発音の違いを聞き分ける"
    ko: "말소리와 노래 발음 차이 구별하기"
    vi: "Phân biệt phát âm nói và hát"
    ms: "Kenal beza sebutan cakap dan nyanyi"
    id: "Membedakan lafal bicara dan nyanyi"
    hi: "बोलने और गाने के उच्चारण का अंतर पहचानना"
