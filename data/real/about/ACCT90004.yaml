code: ACCT90004
year: 2027
learn:
  en: "Recording business transactions, reading financial statements and using accounting software to support decisions."
  zh: "记录经济交易、解读财务报表，并用会计软件辅助决策。"
  zh-TW: "記錄經濟交易、解讀財務報表，並用會計軟體輔助決策。"
  ja: "取引の記録、財務諸表の読み方、会計ソフトを使った意思決定の支援。"
  ko: "거래 기록, 재무제표 해석, 회계 소프트웨어를 활용한 의사결정 지원."
  vi: "Ghi nhận giao dịch, đọc báo cáo tài chính và dùng phần mềm kế toán để ra quyết định."
  ms: "Merekod transaksi, membaca penyata kewangan dan menggunakan perisian perakaunan untuk membuat keputusan."
  id: "Mencatat transaksi, membaca laporan keuangan, dan memakai perangkat lunak akuntansi untuk keputusan."
  hi: "लेन-देन दर्ज करना, वित्तीय विवरण पढ़ना और निर्णय के लिए अकाउंटिंग सॉफ़्टवेयर का उपयोग।"
outcomes:
  - en: "Explain assets, liabilities, equity, revenue and expenses"
    zh: "解释资产、负债、权益、收入和费用"
    zh-TW: "解釋資產、負債、權益、收入與費用"
    ja: "資産・負債・資本・収益・費用を説明する"
    ko: "자산, 부채, 자본, 수익, 비용 설명하기"
    vi: "Giải thích tài sản, nợ, vốn, doanh thu và chi phí"
    ms: "Menerangkan aset, liabiliti, ekuiti, hasil dan belanja"
    id: "Menjelaskan aset, liabilitas, ekuitas, pendapatan, dan beban"
    hi: "परिसंपत्ति, देनदारी, इक्विटी, आय और व्यय समझाना"
  - en: "Use financial statements to assess a business"
    zh: "用财务报表评估一家企业"
    zh-TW: "用財務報表評估一家企業"
    ja: "財務諸表で企業を評価する"
    ko: "재무제표로 기업 평가하기"
    vi: "Dùng báo cáo tài chính để đánh giá doanh nghiệp"
    ms: "Menilai perniagaan menggunakan penyata kewangan"
    id: "Menilai bisnis dengan laporan keuangan"
    hi: "वित्तीय विवरणों से व्यवसाय का आकलन"
