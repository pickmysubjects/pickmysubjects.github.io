code: MUSI10226
year: 2026
learn:
  en: "Sing in an auditioned chamber choir, building intonation, breath and blend across choral music from the 13th to 21st century."
  zh: "在经试音选拔的室内合唱团演唱，磨练音准、气息与融合，曲目横跨13至21世纪。"
  zh-TW: "在經試音甄選的室內合唱團演唱，磨練音準、氣息與融合，曲目橫跨13至21世紀。"
  ja: "オーディション制の室内合唱団で歌い、13〜21世紀の合唱曲で音程・呼吸・響きを磨く。"
  ko: "오디션으로 뽑힌 실내 합창단에서 노래하며 13~21세기 합창곡으로 음정·호흡·조화를 다진다."
  vi: "Hát trong dàn hợp xướng thính phòng qua tuyển chọn, rèn cao độ, hơi thở và độ hòa quyện với nhạc từ thế kỷ 13–21."
  ms: "Menyanyi dalam koir kamar beruji bakat, mengasah intonasi, pernafasan dan adunan suara dari abad ke-13 hingga 21."
  id: "Bernyanyi dalam paduan suara kamar lewat audisi, melatih intonasi, napas, dan keselarasan dari abad ke-13 hingga 21."
  hi: "ऑडिशन वाले चैम्बर कॉयर में गाना, 13वीं से 21वीं सदी के संगीत से सुर, साँस और मेल निखारना।"
outcomes:
  - en: "Sing in tune and blend within a choir"
    zh: "在合唱中唱准音并融入整体"
    zh-TW: "在合唱中唱準音並融入整體"
    ja: "合唱で正しい音程で響きを合わせる"
    ko: "합창에서 정확한 음정으로 어울리기"
    vi: "Hát đúng cao độ và hòa giọng trong dàn hợp xướng"
    ms: "Menyanyi tepat nada dan sebati dalam koir"
    id: "Bernyanyi tepat nada dan menyatu dalam paduan suara"
    hi: "कॉयर में सुर में और मिलकर गाना"
  - en: "Follow a conductor in rehearsal and concert"
    zh: "在排练和演出中跟随指挥"
    zh-TW: "在排練與演出中跟隨指揮"
    ja: "練習と本番で指揮者に従う"
    ko: "리허설과 공연에서 지휘자 따르기"
    vi: "Theo nhạc trưởng khi tập và biểu diễn"
    ms: "Ikut konduktor semasa latihan dan konsert"
    id: "Mengikuti dirigen saat latihan dan konser"
    hi: "रिहर्सल और कॉन्सर्ट में कंडक्टर का अनुसरण"
  - en: "Sing choral styles from many eras"
    zh: "演唱不同时代的合唱风格"
    zh-TW: "演唱不同時代的合唱風格"
    ja: "さまざまな時代の合唱様式を歌う"
    ko: "여러 시대의 합창 양식 부르기"
    vi: "Hát nhiều phong cách hợp xướng qua các thời kỳ"
    ms: "Nyanyikan gaya koral pelbagai zaman"
    id: "Menyanyikan gaya paduan suara berbagai zaman"
    hi: "कई युगों की कोरल शैलियाँ गाना"
