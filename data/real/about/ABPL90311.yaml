code: ABPL90311
year: 2027
learn:
  en: "How construction works in places outside Melbourne, shaped by local culture, economy and tradition, studied on a field trip."
  zh: "通过实地考察，了解墨尔本以外地区的建造方式如何受当地文化、经济和传统影响。"
  zh-TW: "透過實地考察，了解墨爾本以外地區的建造方式如何受當地文化、經濟和傳統影響。"
  ja: "現地調査で、メルボルン以外の地域の建設が文化・経済・伝統にどう左右されるかを学ぶ。"
  ko: "현장 답사를 통해 멜버른 밖 지역의 건설이 문화·경제·전통에 어떻게 영향받는지 배웁니다."
  vi: "Qua chuyến thực địa, tìm hiểu cách xây dựng ngoài Melbourne chịu ảnh hưởng của văn hóa, kinh tế và truyền thống."
  ms: "Melalui lawatan lapangan, kaji cara pembinaan di luar Melbourne dipengaruhi budaya, ekonomi dan tradisi."
  id: "Lewat kunjungan lapangan, pelajari cara konstruksi di luar Melbourne dipengaruhi budaya, ekonomi, dan tradisi."
  hi: "फ़ील्ड ट्रिप से जानना कि मेलबर्न के बाहर निर्माण पर स्थानीय संस्कृति, अर्थव्यवस्था और परंपरा का कैसा असर है।"
outcomes:
  - en: "Compare construction markets across countries"
    zh: "比较不同国家的建筑市场"
    zh-TW: "比較不同國家的建築市場"
    ja: "国ごとの建設市場を比較する"
    ko: "나라별 건설 시장 비교하기"
    vi: "So sánh thị trường xây dựng giữa các nước"
    ms: "Membandingkan pasaran pembinaan antara negara"
    id: "Membandingkan pasar konstruksi antarnegara"
    hi: "देशों के निर्माण बाज़ारों की तुलना"
  - en: "Relate building methods to national culture"
    zh: "把建造技术与国家文化联系起来"
    zh-TW: "把建造技術與國家文化連結起來"
    ja: "建設技術と国の文化を結びつける"
    ko: "건설 기술과 국가 문화 연결하기"
    vi: "Liên hệ kỹ thuật xây dựng với văn hóa quốc gia"
    ms: "Mengaitkan kaedah binaan dengan budaya negara"
    id: "Mengaitkan metode bangunan dengan budaya nasional"
    hi: "निर्माण तकनीक को राष्ट्रीय संस्कृति से जोड़ना"
