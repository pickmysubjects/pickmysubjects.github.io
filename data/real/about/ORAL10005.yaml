code: ORAL10005
year: 2026
learn:
  en: "First clinical skills in oral health, practised in simulation labs before you treat patients. Attendance at every session is required."
  zh: "口腔健康的第一批临床技能，先在模拟实验室练习，再面对病人。每次课都必须出席。"
  zh-TW: "口腔健康的第一批臨床技能，先在模擬實驗室練習，再面對病人。每堂課都必須出席。"
  ja: "口腔保健の最初の臨床技能を、患者を診る前にシミュレーション実習で練習する。全回出席必須。"
  ko: "구강 보건의 첫 임상 기술을 환자 진료 전 시뮬레이션 실습실에서 익힌다. 전 회차 출석 필수."
  vi: "Kỹ năng lâm sàng đầu tiên, tập trong phòng mô phỏng trước khi khám thật. Phải dự mọi buổi."
  ms: "Kemahiran klinikal awal, dilatih di makmal simulasi sebelum merawat pesakit. Wajib hadir."
  id: "Keterampilan klinis awal, dilatih di lab simulasi sebelum merawat pasien. Wajib hadir semua."
  hi: "मुख-स्वास्थ्य के पहले क्लिनिकल कौशल, मरीज़ से पहले सिमुलेशन लैब में। हर सत्र ज़रूरी।"
outcomes:
  - en: "Perform basic preventive procedures"
    zh: "完成基本的预防性操作"
    zh-TW: "完成基本的預防性操作"
    ja: "基本的な予防処置を行う"
    ko: "기본 예방 시술 수행하기"
    vi: "Thực hiện thủ thuật phòng ngừa cơ bản"
    ms: "Laksana prosedur pencegahan asas"
    id: "Melakukan prosedur pencegahan dasar"
    hi: "बुनियादी रोकथाम प्रक्रियाएँ करना"
  - en: "Pass a structured clinical exam"
    zh: "通过结构化临床考试"
    zh-TW: "通過結構化臨床考試"
    ja: "客観的臨床試験に合格する"
    ko: "객관적 임상시험 통과하기"
    vi: "Vượt qua kỳ thi lâm sàng cấu trúc"
    ms: "Lulus peperiksaan klinikal berstruktur"
    id: "Lulus ujian klinis terstruktur"
    hi: "संरचित क्लिनिकल परीक्षा पास करना"
  - en: "Act safely and professionally in clinic"
    zh: "在诊所中安全、专业地行事"
    zh-TW: "在診所中安全、專業地行事"
    ja: "臨床で安全かつ専門的に振る舞う"
    ko: "임상에서 안전하고 전문적으로 행동하기"
    vi: "Hành xử an toàn, chuyên nghiệp ở phòng khám"
    ms: "Bertindak selamat dan profesional"
    id: "Bertindak aman dan profesional di klinik"
    hi: "क्लिनिक में सुरक्षित और पेशेवर व्यवहार"
