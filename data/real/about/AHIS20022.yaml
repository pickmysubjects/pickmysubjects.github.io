code: AHIS20022
year: 2026
learn:
  en: "Chinese art from the 19th to the late 20th century, from the late Qing to the People's Republic, across ink, oil and print."
  zh: "19世纪到20世纪末的中国艺术，从晚清到中华人民共和国，涵盖水墨、油画和版画等。"
  zh-TW: "19世紀到20世紀末的中國藝術，從晚清到中華人民共和國，涵蓋水墨、油畫和版畫等。"
  ja: "19世紀から20世紀末までの中国美術。清末から中華人民共和国まで、水墨・油彩・版画などを扱う。"
  ko: "19세기부터 20세기 말까지 중국 미술. 청 말기부터 중화인민공화국까지 수묵·유화·판화를 다룬다."
  vi: "Nghệ thuật Trung Quốc từ thế kỷ 19 đến cuối thế kỷ 20, từ cuối nhà Thanh đến nước Cộng hòa Nhân dân, qua thủy mặc, sơn dầu và tranh in."
  ms: "Seni China dari abad ke-19 hingga akhir abad ke-20, dari akhir Qing hingga Republik Rakyat, merangkumi dakwat, minyak dan cetakan."
  id: "Seni Tiongkok dari abad ke-19 sampai akhir abad ke-20, dari akhir Qing hingga Republik Rakyat, mencakup tinta, cat minyak dan cetak."
  hi: "19वीं से 20वीं सदी के अंत तक की चीनी कला, उत्तर किंग काल से जनवादी गणराज्य तक, स्याही, तैल और प्रिंट में।"
outcomes:
  - en: "Describe key Chinese artists and works"
    zh: "介绍重要的中国艺术家和作品"
    zh-TW: "介紹重要的中國藝術家和作品"
    ja: "中国の主な画家と作品を説明する"
    ko: "중국의 주요 작가와 작품 설명하기"
    vi: "Mô tả các nghệ sĩ và tác phẩm Trung Quốc chính"
    ms: "Huraikan artis dan karya China utama"
    id: "Menguraikan seniman dan karya Tiongkok utama"
    hi: "मुख्य चीनी कलाकारों और कृतियों का वर्णन करना"
  - en: "Link Chinese art to political change"
    zh: "把中国艺术与政治变化联系起来"
    zh-TW: "把中國藝術與政治變化聯繫起來"
    ja: "中国美術を政治の変化と結びつける"
    ko: "중국 미술을 정치 변화와 연결하기"
    vi: "Liên hệ nghệ thuật Trung Quốc với biến đổi chính trị"
    ms: "Kaitkan seni China dengan perubahan politik"
    id: "Mengaitkan seni Tiongkok dengan perubahan politik"
    hi: "चीनी कला को राजनीतिक बदलाव से जोड़ना"
  - en: "Analyse how art was shown and circulated"
    zh: "分析艺术如何展出和传播"
    zh-TW: "分析藝術如何展出和傳播"
    ja: "美術がどう展示され流通したか分析する"
    ko: "미술이 전시되고 유통된 방식 분석하기"
    vi: "Phân tích nghệ thuật được trưng bày và lưu hành ra sao"
    ms: "Analisis cara seni dipamer dan diedarkan"
    id: "Menganalisis cara seni dipamerkan dan diedarkan"
    hi: "कला कैसे प्रदर्शित और प्रसारित हुई, विश्लेषण करना"
