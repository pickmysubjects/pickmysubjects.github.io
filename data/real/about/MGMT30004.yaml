code: MGMT30004
year: 2026
learn:
  en: "Running a business across borders: working across cultures, managing people abroad and choosing a global strategy."
  zh: "跨国经营：跨文化合作、海外人员管理和全球战略选择。"
  zh-TW: "跨國經營：跨文化合作、海外人員管理和全球策略選擇。"
  ja: "国境を越えた経営：異文化での協働、海外の人材管理、グローバル戦略の選択。"
  ko: "국경을 넘는 경영: 문화 간 협업, 해외 인력 관리, 글로벌 전략 선택."
  vi: "Kinh doanh xuyên biên giới: làm việc đa văn hóa, quản lý nhân sự ở nước ngoài và chọn chiến lược toàn cầu."
  ms: "Menjalankan perniagaan merentas sempadan: kerja silang budaya, urus pekerja di luar negara dan pilih strategi global."
  id: "Menjalankan bisnis lintas negara: kerja lintas budaya, mengelola orang di luar negeri, dan memilih strategi global."
  hi: "सीमाओं के पार बिज़नेस: अलग संस्कृतियों में काम, विदेश में लोगों का प्रबंधन और ग्लोबल रणनीति चुनना।"
outcomes:
  - en: "Analyse the upsides and risks of operating abroad"
    zh: "分析海外经营的机会与风险"
    zh-TW: "分析海外經營的機會與風險"
    ja: "海外で事業を行う利点とリスクを分析する"
    ko: "해외 운영의 기회와 위험 분석하기"
    vi: "Phân tích cơ hội và rủi ro khi hoạt động ở nước ngoài"
    ms: "Analisis kebaikan dan risiko beroperasi di luar negara"
    id: "Menganalisis peluang dan risiko beroperasi di luar negeri"
    hi: "विदेश में काम करने के फ़ायदे और जोखिम आँकना"
  - en: "Compare global strategy and market-entry choices"
    zh: "比较全球战略和进入市场的方式"
    zh-TW: "比較全球策略和進入市場的方式"
    ja: "グローバル戦略と市場参入の選択肢を比べる"
    ko: "글로벌 전략과 시장 진입 방식 비교하기"
    vi: "So sánh chiến lược toàn cầu và cách thâm nhập thị trường"
    ms: "Banding pilihan strategi global dan cara memasuki pasaran"
    id: "Membandingkan strategi global dan cara masuk pasar"
    hi: "ग्लोबल रणनीति और बाज़ार में उतरने के विकल्प तुलना करना"
  - en: "Apply these ideas to real cases, especially in Asia"
    zh: "把这些知识用到真实案例，尤其是亚洲"
    zh-TW: "把這些知識用在真實案例，尤其是亞洲"
    ja: "特にアジアの実例にこれらの考えを当てはめる"
    ko: "특히 아시아의 실제 사례에 적용하기"
    vi: "Áp dụng vào tình huống thực tế, nhất là ở châu Á"
    ms: "Guna idea ini pada kes sebenar, terutama di Asia"
    id: "Menerapkan ide ini pada kasus nyata, terutama di Asia"
    hi: "इन बातों को असली मामलों पर लागू करना, ख़ासकर एशिया में"
