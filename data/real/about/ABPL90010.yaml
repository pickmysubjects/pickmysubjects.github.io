code: ABPL90010
year: 2027
learn:
  en: "New building materials, systems and fabrication methods, and how to plan and manage innovative construction."
  zh: "新型建筑材料、体系和制造方法，以及如何规划和管理创新施工。"
  zh-TW: "新型建築材料、系統與製造方法，以及如何規劃和管理創新施工。"
  ja: "新しい建築材料・工法・製造技術と、革新的な施工の計画と管理。"
  ko: "새로운 건축 자재·시스템·제작 방법과 혁신적 시공의 계획 및 관리."
  vi: "Vật liệu, hệ thống và phương pháp chế tạo mới trong xây dựng, cách lập kế hoạch và quản lý thi công đổi mới."
  ms: "Bahan, sistem dan kaedah fabrikasi binaan baharu, serta cara merancang dan mengurus pembinaan inovatif."
  id: "Material, sistem dan metode fabrikasi bangunan baru, serta cara merencanakan dan mengelola konstruksi inovatif."
  hi: "नई निर्माण सामग्री, प्रणालियाँ और फ़ैब्रिकेशन तरीके, और नवीन निर्माण की योजना व प्रबंधन।"
outcomes:
  - en: "Propose and compare construction systems for given performance needs"
    zh: "针对性能要求提出并比较施工体系"
    zh-TW: "針對性能要求提出並比較施工系統"
    ja: "性能要件に合う工法を提案し比較する"
    ko: "성능 요구에 맞는 시공 시스템 제안·비교하기"
    vi: "Đề xuất và so sánh hệ thống thi công theo yêu cầu"
    ms: "Mencadang dan membanding sistem binaan mengikut keperluan"
    id: "Mengusulkan dan membandingkan sistem konstruksi sesuai kebutuhan"
    hi: "प्रदर्शन ज़रूरतों के लिए निर्माण प्रणालियाँ सुझाना व तुलना करना"
  - en: "Explain construction solutions in reports, sketches and drawings"
    zh: "用报告、草图和图纸说明施工方案"
    zh-TW: "用報告、草圖和圖紙說明施工方案"
    ja: "報告書・スケッチ・図面で施工方法を伝える"
    ko: "보고서·스케치·도면으로 시공 방안 설명하기"
    vi: "Trình bày giải pháp thi công bằng báo cáo, phác thảo, bản vẽ"
    ms: "Menerangkan penyelesaian binaan melalui laporan dan lukisan"
    id: "Menjelaskan solusi konstruksi lewat laporan, sketsa dan gambar"
    hi: "रिपोर्ट, स्केच और ड्रॉइंग से निर्माण समाधान समझाना"
