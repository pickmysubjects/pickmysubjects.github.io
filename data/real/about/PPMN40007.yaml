code: PPMN40007
year: 2026
learn:
  en: "Finish and submit your public policy thesis, from full draft to final 12,000-word version."
  zh: "完成并提交公共政策论文，从完整初稿到1.2万字终稿。"
  zh-TW: "完成並提交公共政策論文，從完整初稿到1.2萬字終稿。"
  ja: "公共政策の論文を全体草稿から1万2千語の最終版まで仕上げて提出する。"
  ko: "공공정책 논문을 전체 초안부터 1만 2천 단어 최종본까지 완성해 제출하기."
  vi: "Hoàn thành và nộp luận văn chính sách công, từ bản nháp đầy đủ đến bản cuối 12.000 từ."
  ms: "Siapkan dan hantar tesis dasar awam, dari draf penuh hingga versi akhir 12,000 patah perkataan."
  id: "Menuntaskan dan menyerahkan tesis kebijakan publik, dari draf lengkap hingga versi akhir 12.000 kata."
  hi: "सार्वजनिक नीति थीसिस पूरी कर जमा करना, पूरे ड्राफ़्ट से 12,000 शब्दों के अंतिम संस्करण तक।"
outcomes:
  - en: "Analyse your evidence and draw conclusions"
    zh: "分析证据并得出结论"
    zh-TW: "分析證據並得出結論"
    ja: "根拠を分析し結論を導く"
    ko: "근거를 분석해 결론 내리기"
    vi: "Phân tích bằng chứng và rút ra kết luận"
    ms: "Analisis bukti dan buat kesimpulan"
    id: "Menganalisis bukti dan menarik kesimpulan"
    hi: "सबूतों का विश्लेषण कर निष्कर्ष निकालना"
  - en: "Write a complete, well-argued thesis"
    zh: "写出完整且论证充分的论文"
    zh-TW: "寫出完整且論證充分的論文"
    ja: "論旨の通った論文を完成させる"
    ko: "논증이 탄탄한 완성 논문 쓰기"
    vi: "Viết luận văn hoàn chỉnh, lập luận chặt chẽ"
    ms: "Tulis tesis lengkap yang berhujah kukuh"
    id: "Menulis tesis lengkap dengan argumen kuat"
    hi: "पूरी और तर्कपूर्ण थीसिस लिखना"
  - en: "Revise your work from supervisor feedback"
    zh: "根据导师反馈修改论文"
    zh-TW: "根據導師回饋修改論文"
    ja: "指導教員の意見をもとに推敲する"
    ko: "지도교수 피드백으로 수정하기"
    vi: "Chỉnh sửa theo góp ý của người hướng dẫn"
    ms: "Semak semula kerja berdasarkan maklum balas penyelia"
    id: "Merevisi karya dari masukan pembimbing"
    hi: "पर्यवेक्षक की प्रतिक्रिया से काम सुधारना"
