code: PHYC20014
year: 2026
learn:
  en: "Fourier methods and Lagrangian and Hamiltonian mechanics, applied to optics, waves and quantum physics."
  zh: "傅里叶方法和拉格朗日、哈密顿力学，用于光学和量子。"
  zh-TW: "傅立葉方法和拉格朗日、哈密頓力學，用於光學和量子。"
  ja: "フーリエ解析とラグランジュ・ハミルトン力学を光学や量子に応用する。"
  ko: "푸리에 방법과 라그랑주·해밀턴 역학을 광학, 파동, 양자에 적용하기."
  vi: "Phương pháp Fourier và cơ học Lagrange, Hamilton áp dụng cho quang học, sóng, lượng tử."
  ms: "Kaedah Fourier serta mekanik Lagrange dan Hamilton untuk optik, gelombang dan kuantum."
  id: "Metode Fourier serta mekanika Lagrange dan Hamilton untuk optik, gelombang, dan kuantum."
  hi: "फ़ूरियर मेथड और लैग्रांजियन-हैमिल्टनियन मैकेनिक्स, ऑप्टिक्स और क्वांटम पर लागू।"
outcomes:
  - en: "Solve diffraction problems with Fourier transforms"
    zh: "用傅里叶变换解衍射问题"
    zh-TW: "用傅立葉轉換解繞射問題"
    ja: "フーリエ変換で回折問題を解く"
    ko: "푸리에 변환으로 회절 문제 풀기"
    vi: "Giải bài nhiễu xạ bằng biến đổi Fourier"
    ms: "Menyelesaikan difraksi dengan jelmaan Fourier"
    id: "Memecahkan difraksi dengan transformasi Fourier"
    hi: "फ़ूरियर ट्रांसफ़ॉर्म से डिफ़्रैक्शन सवाल हल करना"
  - en: "Use Lagrangian and Hamiltonian mechanics"
    zh: "运用拉格朗日和哈密顿力学"
    zh-TW: "運用拉格朗日和哈密頓力學"
    ja: "ラグランジュ・ハミルトン力学を使う"
    ko: "라그랑주·해밀턴 역학 활용하기"
    vi: "Dùng cơ học Lagrange và Hamilton"
    ms: "Mengguna mekanik Lagrange dan Hamilton"
    id: "Memakai mekanika Lagrange dan Hamilton"
    hi: "लैग्रांजियन और हैमिल्टनियन मैकेनिक्स इस्तेमाल करना"
