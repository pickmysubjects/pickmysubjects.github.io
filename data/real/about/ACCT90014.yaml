code: ACCT90014
year: 2027
learn:
  en: "How external audits of financial reports are done under Auditing Standards, and why auditor independence matters."
  zh: "如何按照审计准则对财务报告进行外部审计，以及审计师独立性为何重要。"
  zh-TW: "如何依照審計準則對財務報告進行外部審計，以及會計師獨立性為何重要。"
  ja: "監査基準に基づく財務報告の外部監査の進め方と、監査人の独立性の重要性。"
  ko: "감사기준에 따른 재무보고서 외부감사 방법과 감사인 독립성의 중요성."
  vi: "Cách kiểm toán độc lập báo cáo tài chính theo Chuẩn mực kiểm toán và vì sao tính độc lập quan trọng."
  ms: "Cara audit luaran laporan kewangan mengikut Piawaian Pengauditan dan kepentingan kebebasan juruaudit."
  id: "Cara audit eksternal laporan keuangan sesuai Standar Audit dan pentingnya independensi auditor."
  hi: "ऑडिटिंग मानकों के तहत वित्तीय रिपोर्ट का बाहरी ऑडिट कैसे होता है और ऑडिटर की स्वतंत्रता क्यों ज़रूरी है।"
outcomes:
  - en: "Conduct client risk assessments"
    zh: "进行客户风险评估"
    zh-TW: "進行客戶風險評估"
    ja: "クライアントのリスク評価を行う"
    ko: "고객 위험평가 수행하기"
    vi: "Đánh giá rủi ro khách hàng"
    ms: "Menjalankan penilaian risiko pelanggan"
    id: "Melakukan penilaian risiko klien"
    hi: "क्लाइंट जोखिम आकलन करना"
  - en: "Apply audit processes to gather evidence"
    zh: "运用审计程序收集证据"
    zh-TW: "運用查核程序蒐集證據"
    ja: "監査手続を適用して証拠を集める"
    ko: "감사 절차를 적용해 증거 수집하기"
    vi: "Áp dụng quy trình kiểm toán để thu thập bằng chứng"
    ms: "Menggunakan proses audit untuk mengumpul bukti"
    id: "Menerapkan prosedur audit untuk mengumpulkan bukti"
    hi: "साक्ष्य जुटाने के लिए ऑडिट प्रक्रियाएँ लागू करना"
