code: HIST30068
year: 2026
learn:
  en: "How individuals, communities and states have used violence from the 1500s to now, and how it has been seen and remembered."
  zh: "16世纪至今，个人、社群和国家如何使用暴力，以及暴力如何被看待和记忆。"
  zh-TW: "16世紀至今，個人、社群和國家如何使用暴力，以及暴力如何被看待和記憶。"
  ja: "16世紀から現在まで、個人・共同体・国家が暴力をどう使い、それがどう見られ記憶されてきたかを学ぶ。"
  ko: "16세기부터 지금까지 개인, 공동체, 국가가 폭력을 어떻게 사용했고 그것이 어떻게 인식되고 기억됐는지 배운다."
  vi: "Cá nhân, cộng đồng và nhà nước đã dùng bạo lực ra sao từ thế kỷ 16 đến nay, và bạo lực được nhìn nhận, ghi nhớ thế nào."
  ms: "Cara individu, komuniti dan negara menggunakan keganasan dari abad ke-16 hingga kini, dan cara ia dilihat serta diingati."
  id: "Cara individu, komunitas, dan negara memakai kekerasan sejak abad ke-16, serta cara kekerasan dipandang dan diingat."
  hi: "1500 के दशक से अब तक लोगों, समुदायों और राज्यों ने हिंसा का कैसे इस्तेमाल किया, और इसे कैसे देखा और याद रखा गया।"
outcomes:
  - en: "Compare types of past violence and how they are remembered"
    zh: "比较过去暴力的类型及其被记忆的方式"
    zh-TW: "比較過去暴力的類型及其被記憶的方式"
    ja: "過去の暴力の種類と記憶のされ方を比べる"
    ko: "과거 폭력의 유형과 기억되는 방식 비교하기"
    vi: "So sánh các loại bạo lực trong quá khứ và cách chúng được ghi nhớ"
    ms: "Bandingkan jenis keganasan lampau dan cara ia diingati"
    id: "Membandingkan jenis kekerasan masa lalu dan cara diingat"
    hi: "अतीत की हिंसा के प्रकारों और उन्हें याद रखने के तरीकों की तुलना करना"
  - en: "Explain how scholars have theorised violence"
    zh: "说明学者如何对暴力进行理论化"
    zh-TW: "說明學者如何對暴力進行理論化"
    ja: "研究者が暴力をどう理論化してきたか説明する"
    ko: "학자들이 폭력을 어떻게 이론화했는지 설명하기"
    vi: "Giải thích cách các học giả lý thuyết hóa bạo lực"
    ms: "Terangkan cara sarjana berteori tentang keganasan"
    id: "Menjelaskan cara para ahli berteori tentang kekerasan"
    hi: "विद्वानों ने हिंसा को सैद्धांतिक रूप से कैसे समझा, समझाना"
  - en: "Develop a research project on violence"
    zh: "完成一个关于暴力的研究项目"
    zh-TW: "完成一個關於暴力的研究專題"
    ja: "暴力についての研究プロジェクトを進める"
    ko: "폭력에 관한 연구 프로젝트 진행하기"
    vi: "Xây dựng một dự án nghiên cứu về bạo lực"
    ms: "Bangunkan projek kajian tentang keganasan"
    id: "Menyusun proyek riset tentang kekerasan"
    hi: "हिंसा पर एक शोध प्रोजेक्ट तैयार करना"
