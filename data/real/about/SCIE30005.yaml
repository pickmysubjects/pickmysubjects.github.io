code: SCIE30005
year: 2027
learn:
  en: "An 80–100 hour science placement with an employer, where you work on a project and reflect on your career plans."
  zh: "在单位完成80–100小时的理科实习，做一个项目并反思职业方向。"
  zh-TW: "在機構完成80–100小時的理科實習，做一個專案並反思職涯方向。"
  ja: "受け入れ先で80〜100時間の理系インターンを行い、プロジェクトに取り組みながらキャリアを振り返る。"
  ko: "기관에서 80~100시간 과학 인턴십을 하며 프로젝트를 수행하고 진로를 돌아본다."
  vi: "Thực tập khoa học 80–100 giờ tại một tổ chức, làm một dự án và suy ngẫm về định hướng nghề nghiệp."
  ms: "Penempatan sains selama 80–100 jam di organisasi, menjalankan projek dan merenung hala tuju kerjaya."
  id: "Magang sains 80–100 jam di sebuah organisasi, mengerjakan proyek dan merefleksikan rencana karier."
  hi: "किसी संस्था में 80–100 घंटे की साइंस इंटर्नशिप, जिसमें एक प्रोजेक्ट करना और करियर पर सोचना शामिल है।"
outcomes:
  - en: "Use what you studied to handle real workplace problems"
    zh: "用所学知识解决职场中的实际问题"
    zh-TW: "用所學知識解決職場上的實際問題"
    ja: "学んだ知識を職場の実際の課題に活かす"
    ko: "배운 지식으로 실제 직장 문제 해결하기"
    vi: "Áp dụng kiến thức đã học vào vấn đề thực tế nơi làm việc"
    ms: "Guna ilmu yang dipelajari untuk masalah sebenar di tempat kerja"
    id: "Menerapkan ilmu yang dipelajari pada masalah nyata di tempat kerja"
    hi: "पढ़ी हुई चीज़ों से कार्यस्थल की असली समस्याएँ सुलझाना"
  - en: "Plan and run a workplace project, managing time and risk"
    zh: "规划并完成职场项目，管理时间与风险"
    zh-TW: "規劃並完成職場專案，管理時間與風險"
    ja: "時間とリスクを管理しつつ職場のプロジェクトを進める"
    ko: "시간과 위험을 관리하며 직장 프로젝트 진행하기"
    vi: "Lập kế hoạch và thực hiện dự án, quản lý thời gian và rủi ro"
    ms: "Rancang dan jalankan projek kerja, urus masa dan risiko"
    id: "Merencanakan dan menjalankan proyek kerja, mengelola waktu dan risiko"
    hi: "समय और जोखिम संभालते हुए कार्यस्थल का प्रोजेक्ट पूरा करना"
  - en: "Reflect on your growth and plan your next career steps"
    zh: "反思自身成长并规划职业下一步"
    zh-TW: "反思自身成長並規劃職涯下一步"
    ja: "自分の成長を振り返り次のキャリアを計画する"
    ko: "자신의 성장을 돌아보고 다음 진로 계획하기"
    vi: "Nhìn lại sự tiến bộ và lên kế hoạch nghề nghiệp tiếp theo"
    ms: "Renung perkembangan diri dan rancang langkah kerjaya seterusnya"
    id: "Merefleksikan perkembangan diri dan merencanakan langkah karier berikutnya"
    hi: "अपनी प्रगति पर सोचना और करियर के अगले कदम तय करना"
