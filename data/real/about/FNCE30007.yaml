code: FNCE30007
year: 2026
learn:
  en: "Forwards, futures, swaps and options: how they trade, how to price them by arbitrage, and how to hedge."
  zh: "远期、期货、互换和期权：交易方式、无套利定价和对冲。"
  zh-TW: "遠期、期貨、交換和選擇權：交易方式、無套利定價和避險。"
  ja: "先渡・先物・スワップ・オプション：取引の仕組み、裁定による価格付け、ヘッジ。"
  ko: "선도·선물·스왑·옵션: 거래 방식, 차익거래 기반 가격 결정, 헤지."
  vi: "Hợp đồng kỳ hạn, tương lai, hoán đổi và quyền chọn: cách giao dịch, định giá bằng chênh lệch giá và phòng ngừa rủi ro."
  ms: "Hadapan, niaga hadapan, swap dan opsyen: cara didagangkan, harga melalui arbitraj, dan lindung nilai."
  id: "Forward, futures, swap, dan opsi: cara diperdagangkan, penetapan harga lewat arbitrase, dan lindung nilai."
  hi: "फ़ॉरवर्ड, फ़्यूचर्स, स्वैप और ऑप्शन: ट्रेडिंग कैसे होती है, आर्बिट्राज से कीमत तय करना, और हेजिंग।"
outcomes:
  - en: "Draw and read payoff diagrams"
    zh: "绘制并解读收益图"
    zh-TW: "繪製並解讀損益圖"
    ja: "ペイオフ図を描いて読む"
    ko: "손익 구조도 그리고 읽기"
    vi: "Vẽ và đọc biểu đồ lợi nhuận"
    ms: "Lukis dan baca rajah pulangan"
    id: "Menggambar dan membaca diagram payoff"
    hi: "पेऑफ़ डायग्राम बनाना और पढ़ना"
  - en: "Price options with Black-Scholes and binomial models"
    zh: "用布莱克-斯科尔斯和二叉树为期权定价"
    zh-TW: "用Black-Scholes和二項式模型為選擇權定價"
    ja: "ブラック・ショールズと二項モデルでオプション価格を出す"
    ko: "블랙-숄즈와 이항 모형으로 옵션 가격 계산하기"
    vi: "Định giá quyền chọn bằng Black-Scholes và mô hình nhị thức"
    ms: "Tentukan harga opsyen dengan Black-Scholes dan model binomial"
    id: "Menghitung harga opsi dengan Black-Scholes dan model binomial"
    hi: "ब्लैक-शोल्स और बाइनोमियल मॉडल से ऑप्शन की कीमत निकालना"
  - en: "Use derivatives to hedge risk"
    zh: "用衍生品对冲风险"
    zh-TW: "用衍生性商品避險"
    ja: "デリバティブでリスクをヘッジする"
    ko: "파생상품으로 위험 헤지하기"
    vi: "Dùng phái sinh để phòng ngừa rủi ro"
    ms: "Guna derivatif untuk lindung nilai risiko"
    id: "Memakai derivatif untuk lindung nilai risiko"
    hi: "डेरिवेटिव से जोखिम हेज करना"
