code: MKTG90017
year: 2027
learn:
  en: "Marketing online: internet business models, online consumer behaviour, social media, web design, analytics and search marketing."
  zh: "网络营销：互联网商业模式、线上消费者行为、社交媒体、网页设计、数据分析和搜索引擎营销。"
  zh-TW: "網路行銷：網路商業模式、線上消費者行為、社群媒體、網頁設計、數據分析與搜尋引擎行銷。"
  ja: "オンラインのマーケティング：ネットのビジネスモデル、消費者行動、SNS、Webデザイン、分析、検索マーケティング。"
  ko: "온라인 마케팅: 인터넷 비즈니스 모델, 온라인 소비자 행동, 소셜 미디어, 웹 디자인, 분석, 검색 마케팅."
  vi: "Marketing trực tuyến: mô hình kinh doanh internet, hành vi khách hàng, mạng xã hội, thiết kế web, phân tích, SEM."
  ms: "Pemasaran dalam talian: model perniagaan internet, tingkah laku pengguna, media sosial, reka web, analitik, SEM."
  id: "Pemasaran online: model bisnis internet, perilaku konsumen, media sosial, desain web, analitik, dan SEM."
  hi: "ऑनलाइन मार्केटिंग: इंटरनेट बिज़नेस मॉडल, ऑनलाइन ग्राहक व्यवहार, सोशल मीडिया, वेब डिज़ाइन, एनालिटिक्स, सर्च मार्केटिंग।"
outcomes:
