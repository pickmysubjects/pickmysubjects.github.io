code: ACCT30011
year: 2026
learn:
  en: "A study tour to firms and regulators in the US or Europe to see how a current accounting issue plays out in practice."
  zh: "赴美国或欧洲访问企业和监管机构，看会计热点在实务中如何处理。"
  zh-TW: "赴美國或歐洲參訪企業與主管機關，看會計議題在實務上如何處理。"
  ja: "米国か欧州の企業や規制機関を訪れ、会計の今の課題が実務でどう扱われるか見る。"
  ko: "미국이나 유럽의 기업·규제기관을 방문해 회계 현안이 실무에서 어떻게 다뤄지는지 보는 연수."
  vi: "Chuyến học tập tới doanh nghiệp và cơ quan quản lý ở Mỹ hoặc châu Âu để xem vấn đề kế toán diễn ra thực tế thế nào."
  ms: "Lawatan sambil belajar ke firma dan pengawal selia di AS atau Eropah untuk lihat isu perakaunan semasa dalam amalan."
  id: "Kunjungan studi ke perusahaan dan regulator di AS atau Eropa untuk melihat isu akuntansi terkini dalam praktik."
  hi: "अमेरिका या यूरोप में कंपनियों और नियामकों का अध्ययन दौरा, यह देखने के लिए कि कोई अकाउंटिंग मुद्दा व्यवहार में कैसा दिखता है।"
outcomes:
  - en: "Link accounting research to what firms actually do"
    zh: "把会计研究和企业实务联系起来"
    zh-TW: "把會計研究和企業實務連結起來"
    ja: "会計研究と企業の実務を結びつける"
    ko: "회계 연구를 기업 실무와 연결하기"
    vi: "Liên hệ nghiên cứu kế toán với thực tế doanh nghiệp"
    ms: "Kaitkan penyelidikan perakaunan dengan amalan firma"
    id: "Mengaitkan riset akuntansi dengan praktik perusahaan"
    hi: "अकाउंटिंग रिसर्च को कंपनियों के असली काम से जोड़ना"
  - en: "Describe how accounting standards are set"
    zh: "描述会计准则的制定过程"
    zh-TW: "描述會計準則的制定過程"
    ja: "会計基準がどう作られるか説明する"
    ko: "회계기준이 정해지는 과정 설명"
    vi: "Mô tả cách các chuẩn mực kế toán được xây dựng"
    ms: "Huraikan cara piawaian perakaunan ditetapkan"
    id: "Menjelaskan cara standar akuntansi disusun"
    hi: "अकाउंटिंग स्टैंडर्ड कैसे बनते हैं, यह बताना"
  - en: "Weigh the global effects of a current accounting issue"
    zh: "评估会计热点问题的全球影响"
    zh-TW: "評估會計議題的全球影響"
    ja: "会計の課題が世界に与える影響を評価する"
    ko: "회계 현안의 세계적 영향 평가"
    vi: "Đánh giá tác động toàn cầu của một vấn đề kế toán"
    ms: "Nilai kesan global sesuatu isu perakaunan semasa"
    id: "Menilai dampak global dari isu akuntansi terkini"
    hi: "किसी अकाउंटिंग मुद्दे के वैश्विक असर को परखना"
