code: ABPL30077
year: 2027
learn:
  en: "A critical intro to today's urban design tools and models, linking the city as it is to what it could be."
  zh: "批判性地认识当代城市设计的工具和模式，把城市现状与未来可能联系起来。"
  zh-TW: "批判性地認識當代都市設計的工具和模式，把城市現狀與未來可能連結起來。"
  ja: "現代の都市デザインの手法とモデルを批判的に学び、今の都市とあり得る都市をつなぐ。"
  ko: "현대 도시설계 도구와 모델을 비판적으로 배우고, 지금의 도시와 가능한 도시를 잇기."
  vi: "Nhập môn có phản biện về công cụ và mô hình thiết kế đô thị hiện nay, nối thành phố hiện tại với điều nó có thể trở thành."
  ms: "Pengenalan kritis kepada alat dan model reka bentuk bandar masa kini, menghubungkan bandar sedia ada dengan potensinya."
  id: "Pengantar kritis ke alat dan model desain kota masa kini, menghubungkan kota apa adanya dengan kemungkinannya."
  hi: "आज के अर्बन डिज़ाइन टूल्स और मॉडलों का आलोचनात्मक परिचय, शहर जैसा है और जैसा हो सकता है उसे जोड़ना।"
outcomes:
  - en: "Analyse urban systems and patterns for design"
    zh: "为设计分析城市系统和格局"
    zh-TW: "為設計分析都市系統和紋理"
    ja: "デザインのために都市のシステムやパターンを分析する"
    ko: "설계를 위해 도시 시스템과 패턴 분석하기"
    vi: "Phân tích hệ thống và mô thức đô thị cho thiết kế"
    ms: "Analisis sistem dan corak bandar untuk reka bentuk"
    id: "Menganalisis sistem dan pola kota untuk desain"
    hi: "डिज़ाइन के लिए शहरी प्रणालियों और पैटर्न का विश्लेषण"
  - en: "Apply urban design theory to develop proposals"
    zh: "运用城市设计理论提出设计方案"
    zh-TW: "運用都市設計理論提出設計方案"
    ja: "都市デザイン理論を使って提案をつくる"
    ko: "도시설계 이론으로 제안 만들기"
    vi: "Áp dụng lý thuyết thiết kế đô thị để xây dựng đề xuất"
    ms: "Guna teori reka bentuk bandar untuk membina cadangan"
    id: "Menerapkan teori desain kota untuk menyusun usulan"
    hi: "अर्बन डिज़ाइन सिद्धांतों से प्रस्ताव तैयार करना"
  - en: "Work well in a group design project"
    zh: "在小组设计项目中良好协作"
    zh-TW: "在小組設計專案中良好協作"
    ja: "グループの設計プロジェクトでうまく協力する"
    ko: "그룹 설계 프로젝트에서 잘 협업하기"
    vi: "Hợp tác tốt trong dự án thiết kế nhóm"
    ms: "Bekerja dengan baik dalam projek reka bentuk berkumpulan"
    id: "Bekerja sama dengan baik dalam proyek desain kelompok"
    hi: "समूह डिज़ाइन प्रोजेक्ट में अच्छा सहयोग करना"
