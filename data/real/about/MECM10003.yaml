code: MECM10003
year: 2026
learn:
  en: "How media is made, shared and used, past and present, and what media theory says about its place in social and political life."
  zh: "媒体怎么被制作、传播和使用，从过去到现在，以及媒体理论如何看待它在社会和政治生活中的角色。"
  zh-TW: "媒體怎麼被製作、傳播和使用，從過去到現在，以及媒體理論如何看待它在社會和政治生活中的角色。"
  ja: "メディアがどう作られ、広まり、使われてきたかを過去と現在で比べ、社会や政治の中での役割をメディア理論から考える。"
  ko: "미디어가 어떻게 만들어지고 퍼지고 쓰이는지 과거와 현재를 비교하고, 사회와 정치에서의 역할을 미디어 이론으로 살펴본다."
  vi: "Truyền thông được làm ra, lan truyền và sử dụng thế nào, xưa và nay, và lý thuyết truyền thông nói gì về vai trò của nó trong xã hội và chính trị."
  ms: "Bagaimana media dihasilkan, disebarkan dan digunakan, dahulu dan kini, serta apa kata teori media tentang peranannya dalam masyarakat dan politik."
  id: "Bagaimana media dibuat, disebarkan, dan dipakai, dulu dan sekarang, serta apa kata teori media tentang perannya dalam kehidupan sosial dan politik."
  hi: "मीडिया कैसे बनता, फैलता और इस्तेमाल होता है, पहले और आज, और मीडिया सिद्धांत समाज व राजनीति में इसकी भूमिका के बारे में क्या कहते हैं।"
outcomes:
  - en: "Use the main theories of media and society"
    zh: "运用媒体与社会的主要理论"
    zh-TW: "運用媒體與社會的主要理論"
    ja: "メディアと社会に関する主要な理論を使う"
    ko: "미디어와 사회에 관한 주요 이론 활용하기"
    vi: "Dùng các lý thuyết chính về truyền thông và xã hội"
    ms: "Guna teori utama tentang media dan masyarakat"
    id: "Memakai teori utama tentang media dan masyarakat"
    hi: "मीडिया और समाज के मुख्य सिद्धांत इस्तेमाल करना"
  - en: "Read media texts critically"
    zh: "批判性地解读媒体文本"
    zh-TW: "批判性地解讀媒體文本"
    ja: "メディアのテキストを批判的に読む"
    ko: "미디어 텍스트를 비판적으로 읽기"
    vi: "Đọc các văn bản truyền thông một cách phản biện"
    ms: "Membaca teks media secara kritis"
    id: "Membaca teks media secara kritis"
    hi: "मीडिया सामग्री को आलोचनात्मक नज़र से पढ़ना"
  - en: "Explain the role of media institutions as society changes"
    zh: "说明媒体机构在社会变化中的作用"
    zh-TW: "說明媒體機構在社會變化中的作用"
    ja: "社会の変化の中でメディア機関が果たす役割を説明する"
    ko: "사회가 변하는 가운데 미디어 기관의 역할 설명하기"
    vi: "Giải thích vai trò của các tổ chức truyền thông khi xã hội thay đổi"
    ms: "Terangkan peranan institusi media ketika masyarakat berubah"
    id: "Menjelaskan peran lembaga media saat masyarakat berubah"
    hi: "समझाना कि बदलते समाज में मीडिया संस्थाओं की क्या भूमिका है"
