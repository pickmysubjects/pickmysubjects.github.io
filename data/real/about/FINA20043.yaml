code: FINA20043
year: 2026
learn:
  en: "Lighting for performance: how colour, texture, rhythm and intensity of light help tell a story on stage."
  zh: "演出灯光设计：光的颜色、质感、节奏与强度如何帮助舞台叙事。"
  zh-TW: "演出燈光設計：光的顏色、質感、節奏與強度如何幫助舞台敘事。"
  ja: "舞台照明：光の色・質感・リズム・強さが舞台の物語をどう助けるか。"
  ko: "공연 조명: 빛의 색·질감·리듬·강도가 무대 이야기를 돕는 방식."
  vi: "Ánh sáng biểu diễn: màu, chất cảm, nhịp điệu và cường độ ánh sáng giúp kể chuyện trên sân khấu."
  ms: "Pencahayaan persembahan: cara warna, tekstur, rentak dan keamatan cahaya membantu bercerita di pentas."
  id: "Tata cahaya pertunjukan: cara warna, tekstur, ritme, dan intensitas cahaya membantu bercerita."
  hi: "प्रस्तुति के लिए लाइटिंग: रोशनी का रंग, बनावट, लय और तीव्रता मंच पर कहानी कैसे कहते हैं।"
outcomes:
  - en: "Explain how light shapes a scene"
    zh: "说明灯光如何塑造场景"
    zh-TW: "說明燈光如何塑造場景"
    ja: "光が場面をどうつくるか説明する"
    ko: "빛이 장면을 만드는 방식 설명하기"
    vi: "Giải thích ánh sáng định hình cảnh diễn"
    ms: "Jelaskan cara cahaya membentuk babak"
    id: "Menjelaskan cara cahaya membentuk adegan"
    hi: "रोशनी दृश्य को कैसे गढ़ती है, समझाना"
  - en: "Link lighting to set, costume and sound"
    zh: "把灯光与布景、服装和声音联系起来"
    zh-TW: "把燈光與布景、服裝和聲音連結起來"
    ja: "照明を装置・衣装・音と結びつける"
    ko: "조명을 무대·의상·소리와 연결하기"
    vi: "Gắn ánh sáng với bối cảnh, trang phục, âm thanh"
    ms: "Kaitkan cahaya dengan set, kostum dan bunyi"
    id: "Mengaitkan cahaya dengan set, kostum, suara"
    hi: "लाइटिंग को सेट, कॉस्ट्यूम और ध्वनि से जोड़ना"
  - en: "Propose a lighting idea for a performance"
    zh: "为演出提出灯光构想"
    zh-TW: "為演出提出燈光構想"
    ja: "上演のための照明案を出す"
    ko: "공연을 위한 조명 아이디어 제안하기"
    vi: "Đề xuất ý tưởng ánh sáng cho buổi diễn"
    ms: "Cadang idea pencahayaan untuk persembahan"
    id: "Mengusulkan ide tata cahaya pertunjukan"
    hi: "किसी प्रस्तुति के लिए लाइटिंग का विचार देना"
