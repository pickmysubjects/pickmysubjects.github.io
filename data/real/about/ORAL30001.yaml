code: ORAL30001
year: 2026
learn:
  en: "Learn research skills for oral health: analyse a health policy, review the literature and write a full research proposal."
  zh: "学习口腔健康研究技能：分析卫生政策、做文献综述，并写完整的研究计划书。"
  zh-TW: "學習口腔健康研究技能：分析衛生政策、做文獻回顧，並寫完整的研究計畫書。"
  ja: "口腔保健の研究技能。保健政策の分析、文献レビュー、研究計画書の作成。"
  ko: "구강 보건 연구 역량: 보건 정책 분석, 문헌 고찰, 연구계획서 작성."
  vi: "Kỹ năng nghiên cứu: phân tích chính sách y tế, tổng quan tài liệu, viết đề cương."
  ms: "Kemahiran penyelidikan: analisis dasar kesihatan, kajian literatur dan cadangan penuh."
  id: "Keterampilan riset: analisis kebijakan kesehatan, tinjauan pustaka, dan proposal lengkap."
  hi: "शोध कौशल: स्वास्थ्य नीति विश्लेषण, साहित्य समीक्षा और पूरा शोध प्रस्ताव।"
outcomes:
  - en: "Analyse a health policy"
    zh: "分析一项卫生政策"
    zh-TW: "分析一項衛生政策"
    ja: "保健政策を分析する"
    ko: "보건 정책 분석하기"
    vi: "Phân tích một chính sách y tế"
    ms: "Analisis dasar kesihatan"
    id: "Menganalisis kebijakan kesehatan"
    hi: "स्वास्थ्य नीति का विश्लेषण"
  - en: "Review research literature"
    zh: "综述研究文献"
    zh-TW: "回顧研究文獻"
    ja: "研究文献をレビューする"
    ko: "연구 문헌 고찰하기"
    vi: "Tổng quan tài liệu nghiên cứu"
    ms: "Kaji literatur penyelidikan"
    id: "Meninjau literatur riset"
    hi: "शोध साहित्य की समीक्षा"
  - en: "Write a research proposal"
    zh: "撰写研究计划书"
    zh-TW: "撰寫研究計畫書"
    ja: "研究計画書を書く"
    ko: "연구계획서 쓰기"
    vi: "Viết đề cương nghiên cứu"
    ms: "Tulis cadangan penyelidikan"
    id: "Menulis proposal riset"
    hi: "शोध प्रस्ताव लिखना"
