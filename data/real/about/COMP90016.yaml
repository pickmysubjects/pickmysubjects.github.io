code: COMP90016
year: 2027
learn:
  en: "Computational methods and tools for analysing genomic data, with hands-on workshops and assignments."
  zh: "分析基因组数据的计算方法与工具，含上机练习和作业。"
  zh-TW: "分析基因體資料的計算方法與工具，含上機練習與作業。"
  ja: "ゲノムデータを解析する計算手法とツールを、演習と課題で学ぶ。"
  ko: "유전체 데이터를 분석하는 계산 방법과 도구, 실습과 과제 포함."
  vi: "Phương pháp và công cụ tính toán phân tích dữ liệu hệ gen, có thực hành và bài tập."
  ms: "Kaedah dan alat pengiraan untuk analisis data genom, dengan bengkel dan tugasan."
  id: "Metode dan alat komputasi untuk analisis data genom, dengan praktik dan tugas."
  hi: "जीनोमिक डेटा विश्लेषण की कंप्यूटेशनल विधियाँ और टूल, प्रैक्टिकल और असाइनमेंट के साथ।"
outcomes:
  - en: "Explain the theory behind genomic analysis methods"
    zh: "解释基因组分析方法背后的原理"
    zh-TW: "解釋基因體分析方法背後的原理"
    ja: "ゲノム解析手法の理論を説明する"
    ko: "유전체 분석 방법의 이론 설명하기"
    vi: "Giải thích lý thuyết sau các phương pháp phân tích hệ gen"
    ms: "Terangkan teori kaedah analisis genom"
    id: "Menjelaskan teori metode analisis genom"
    hi: "जीनोमिक विश्लेषण विधियों का सिद्धांत समझाना"
  - en: "Apply existing tools to real genomic data"
    zh: "用现有工具分析真实基因组数据"
    zh-TW: "用現有工具分析真實基因體資料"
    ja: "既存ツールで実際のゲノムデータを解析する"
    ko: "기존 도구로 실제 유전체 데이터 분석하기"
    vi: "Dùng công cụ có sẵn cho dữ liệu hệ gen thật"
    ms: "Guna alat sedia ada pada data genom sebenar"
    id: "Memakai alat yang ada pada data genom nyata"
    hi: "मौजूदा टूल से असली जीनोमिक डेटा का विश्लेषण करना"
