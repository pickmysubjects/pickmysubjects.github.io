code: HPSC30038
year: 2026
learn:
  en: "How digital life shapes reality: internet history, going viral, deepfakes, chatbots, smart devices and the inequalities tech can deepen."
  zh: "数字生活如何塑造现实：互联网历史、爆红、深度伪造、聊天机器人、智能设备，以及科技加剧的不平等。"
  zh-TW: "數位生活如何塑造現實：網際網路歷史、病毒式傳播、深度偽造、聊天機器人、智慧裝置，以及科技可能加劇的不平等。"
  ja: "デジタルな暮らしが現実をどう作るか。ネットの歴史、バズ、ディープフェイク、チャットボット、スマート機器、技術が深める格差。"
  ko: "디지털 생활이 현실을 어떻게 만드는가. 인터넷 역사, 바이럴, 딥페이크, 챗봇, 스마트 기기, 기술이 키우는 불평등."
  vi: "Đời sống số định hình thực tại ra sao: lịch sử Internet, lan truyền, deepfake, chatbot, thiết bị thông minh và bất bình đẳng do công nghệ."
  ms: "Cara kehidupan digital membentuk realiti: sejarah internet, tular, deepfake, chatbot, peranti pintar dan ketaksamaan akibat teknologi."
  id: "Cara hidup digital membentuk realitas: sejarah internet, viral, deepfake, chatbot, perangkat pintar dan ketimpangan akibat teknologi."
  hi: "डिजिटल जीवन हक़ीक़त को कैसे गढ़ता है: इंटरनेट का इतिहास, वायरल होना, डीपफ़ेक, चैटबॉट, स्मार्ट डिवाइस और तकनीक से बढ़ती असमानता।"
outcomes:
  - en: "Place today's internet in historical context"
    zh: "把今天的互联网放在历史脉络中理解"
    zh-TW: "把今天的網際網路放在歷史脈絡中理解"
    ja: "現在のネットを歴史の流れの中で捉える"
    ko: "오늘의 인터넷을 역사적 맥락에서 보기"
    vi: "Đặt Internet ngày nay vào bối cảnh lịch sử"
    ms: "Letakkan internet hari ini dalam konteks sejarah"
    id: "Menempatkan internet kini dalam konteks sejarah"
    hi: "आज के इंटरनेट को ऐतिहासिक संदर्भ में देखना"
  - en: "Analyse case studies of digital culture"
    zh: "分析数字文化的案例"
    zh-TW: "分析數位文化的案例"
    ja: "デジタル文化の事例を分析する"
    ko: "디지털 문화 사례 분석하기"
    vi: "Phân tích các trường hợp văn hóa số"
    ms: "Analisis kajian kes budaya digital"
    id: "Menganalisis studi kasus budaya digital"
    hi: "डिजिटल संस्कृति के केस स्टडी का विश्लेषण करना"
  - en: "Question who benefits from new technology"
    zh: "追问新技术让谁受益"
    zh-TW: "追問新技術讓誰受益"
    ja: "新技術で誰が得をするのか問う"
    ko: "신기술로 누가 이득을 보는지 질문하기"
    vi: "Đặt câu hỏi ai được lợi từ công nghệ mới"
    ms: "Persoalkan siapa untung daripada teknologi baharu"
    id: "Mempertanyakan siapa yang diuntungkan teknologi baru"
    hi: "सवाल करना कि नई तकनीक से किसे फ़ायदा होता है"
