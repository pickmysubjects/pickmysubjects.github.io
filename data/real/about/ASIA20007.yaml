code: ASIA20007
year: 2026
learn:
  en: "Human rights in Asia and the Middle East: how religion, law and politics shape them, through cases of activism and repression."
  zh: "亚洲与中东的人权：宗教、法律和政治如何影响人权，通过维权与压迫案例来看。"
  zh-TW: "亞洲與中東的人權：宗教、法律和政治如何影響人權，透過倡議與壓迫案例來看。"
  ja: "アジアと中東の人権。宗教・法・政治がどう影響するかを、運動と弾圧の事例から学ぶ。"
  ko: "아시아와 중동의 인권: 종교, 법, 정치가 인권에 어떤 영향을 주는지 운동과 탄압 사례로 배운다."
  vi: "Nhân quyền ở châu Á và Trung Đông: tôn giáo, luật pháp và chính trị định hình ra sao, qua các ca đấu tranh và đàn áp."
  ms: "Hak asasi manusia di Asia dan Timur Tengah: pengaruh agama, undang-undang dan politik, melalui kes aktivisme dan penindasan."
  id: "Hak asasi manusia di Asia dan Timur Tengah: pengaruh agama, hukum, dan politik, lewat kasus aktivisme dan represi."
  hi: "एशिया और मध्य पूर्व में मानवाधिकार: धर्म, कानून और राजनीति का असर, सक्रियता और दमन के उदाहरणों से।"
outcomes:
  - en: "Explain how traditions shape rights debates"
    zh: "解释传统如何影响人权讨论"
    zh-TW: "解釋傳統如何影響人權討論"
    ja: "伝統が人権論議をどう形づくるか説明する"
    ko: "전통이 인권 논쟁을 만드는 방식 설명하기"
    vi: "Giải thích truyền thống định hình tranh luận về quyền ra sao"
    ms: "Terangkan cara tradisi membentuk perdebatan hak"
    id: "Menjelaskan cara tradisi membentuk perdebatan hak"
    hi: "परंपराएँ अधिकारों की बहस को कैसे गढ़ती हैं, समझाना"
  - en: "Analyse country case studies of rights issues"
    zh: "分析各国人权问题的案例"
    zh-TW: "分析各國人權問題的案例"
    ja: "各国の人権問題の事例を分析する"
    ko: "국가별 인권 문제 사례 분석하기"
    vi: "Phân tích các ca nhân quyền ở từng quốc gia"
    ms: "Analisis kajian kes isu hak di pelbagai negara"
    id: "Menganalisis studi kasus isu hak di berbagai negara"
    hi: "देशों के मानवाधिकार मामलों का विश्लेषण करना"
  - en: "Evaluate ideas of Asian and Middle Eastern thinkers"
    zh: "评价亚洲与中东思想家的观点"
    zh-TW: "評價亞洲與中東思想家的觀點"
    ja: "アジアと中東の思想家の考えを評価する"
    ko: "아시아·중동 사상가들의 생각 평가하기"
    vi: "Đánh giá ý tưởng của các nhà tư tưởng châu Á và Trung Đông"
    ms: "Nilai idea pemikir Asia dan Timur Tengah"
    id: "Menilai gagasan pemikir Asia dan Timur Tengah"
    hi: "एशियाई और मध्य-पूर्वी विचारकों के विचारों का मूल्यांकन करना"
