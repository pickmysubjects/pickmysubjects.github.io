code: CHIN30028
year: 2026
learn:
  en: "Chinese for students who finished Chinese 9: background speakers keep building formal reading and writing."
  zh: "适合学完中文 9 的学生：有中文背景者继续提升正式读写。"
  zh-TW: "適合學完中文 9 的學生：有中文背景者繼續提升正式讀寫。"
  ja: "中国語9を終えた学生向け。背景のある学生が改まった読み書きをさらに伸ばす。"
  ko: "중국어 9를 마친 학생 대상. 배경 화자가 격식 있는 읽기·쓰기를 더 키운다."
  vi: "Tiếng Trung cho sinh viên đã học xong Chinese 9: tiếp tục đọc viết trang trọng."
  ms: "Bahasa Cina untuk pelajar yang sudah tamat Chinese 9: terus membina bacaan dan penulisan formal."
  id: "Bahasa Mandarin untuk mahasiswa yang sudah lulus Chinese 9: terus membangun membaca dan menulis formal."
  hi: "चीनी 9 पूरा कर चुके छात्रों के लिए: औपचारिक पढ़ना-लिखना आगे बढ़ाना।"
outcomes:
  - en: "Discuss social and cultural topics in Chinese"
    zh: "用中文讨论社会和文化话题"
    zh-TW: "用中文討論社會和文化話題"
    ja: "社会や文化の話題を中国語で話し合う"
    ko: "사회·문화 주제를 중국어로 토론하기"
    vi: "Thảo luận chủ đề xã hội, văn hóa bằng tiếng Trung"
    ms: "Bincangkan topik sosial dan budaya dalam bahasa Cina"
    id: "Membahas topik sosial dan budaya dalam bahasa Mandarin"
    hi: "सामाजिक और सांस्कृतिक विषयों पर चीनी में चर्चा करना"
  - en: "Read and write longer Chinese texts"
    zh: "读写较长的中文文章"
    zh-TW: "讀寫較長的中文文章"
    ja: "長めの中国語の文章を読み書きする"
    ko: "긴 중국어 글 읽고 쓰기"
    vi: "Đọc và viết văn bản tiếng Trung dài hơn"
    ms: "Baca dan tulis teks bahasa Cina yang lebih panjang"
    id: "Membaca dan menulis teks bahasa Mandarin yang lebih panjang"
    hi: "लंबे चीनी पाठ पढ़ना-लिखना"
  - en: "Give a clear presentation in Chinese"
    zh: "用中文做清楚的口头报告"
    zh-TW: "用中文做清楚的口頭報告"
    ja: "中国語で分かりやすく発表する"
    ko: "중국어로 명확하게 발표하기"
    vi: "Thuyết trình rõ ràng bằng tiếng Trung"
    ms: "Buat pembentangan yang jelas dalam bahasa Cina"
    id: "Melakukan presentasi yang jelas dalam bahasa Mandarin"
    hi: "चीनी में स्पष्ट प्रस्तुति देना"
