code: HPSC30035
year: 2026
learn:
  en: "How scientific theories and practices change over time, starting from Kuhn's paradigm shifts and later views."
  zh: "科学理论与实践如何随时间变化，从库恩的范式转移及其后的观点谈起。"
  zh-TW: "科學理論與實踐如何隨時間變化，從孔恩的典範轉移及其後的觀點談起。"
  ja: "クーンのパラダイム転換とその後の見方から、科学の理論と実践が時とともにどう変わるかを学ぶ。"
  ko: "쿤의 패러다임 전환과 그 이후 관점으로 과학 이론과 실천이 어떻게 변하는지 배운다."
  vi: "Lý thuyết và thực hành khoa học thay đổi theo thời gian ra sao, bắt đầu từ sự chuyển đổi mô thức của Kuhn."
  ms: "Cara teori dan amalan sains berubah dari masa ke masa, bermula dengan anjakan paradigma Kuhn dan pandangan kemudian."
  id: "Cara teori dan praktik sains berubah seiring waktu, mulai dari pergeseran paradigma Kuhn dan pandangan sesudahnya."
  hi: "वैज्ञानिक सिद्धांत और व्यवहार समय के साथ कैसे बदलते हैं, कून के पैराडाइम बदलाव और बाद के विचारों से।"
outcomes:
  - en: "Explain Kuhn's idea of paradigm shifts"
    zh: "解释库恩的范式转移概念"
    zh-TW: "解釋孔恩的典範轉移概念"
    ja: "クーンのパラダイム転換を説明する"
    ko: "쿤의 패러다임 전환 개념 설명하기"
    vi: "Giải thích ý tưởng chuyển đổi mô thức của Kuhn"
    ms: "Terangkan idea anjakan paradigma Kuhn"
    id: "Menjelaskan gagasan pergeseran paradigma Kuhn"
    hi: "कून के पैराडाइम बदलाव का विचार समझाना"
  - en: "Compare historical and philosophical approaches"
    zh: "比较历史学与哲学的研究路径"
    zh-TW: "比較歷史學與哲學的研究路徑"
    ja: "歴史学と哲学のアプローチを比べる"
    ko: "역사학적·철학적 접근 비교하기"
    vi: "So sánh cách tiếp cận lịch sử và triết học"
    ms: "Bandingkan pendekatan sejarah dan falsafah"
    id: "Membandingkan pendekatan sejarah dan filsafat"
    hi: "ऐतिहासिक और दार्शनिक दृष्टिकोणों की तुलना करना"
  - en: "Analyse a case of scientific change"
    zh: "分析一个科学变革的案例"
    zh-TW: "分析一個科學變革的案例"
    ja: "科学の変化の事例を分析する"
    ko: "과학 변화 사례 분석하기"
    vi: "Phân tích một trường hợp thay đổi khoa học"
    ms: "Analisis satu kes perubahan sains"
    id: "Menganalisis satu kasus perubahan ilmiah"
    hi: "वैज्ञानिक बदलाव के एक मामले का विश्लेषण करना"
