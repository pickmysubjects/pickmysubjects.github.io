code: DNCE20036
year: 2026
learn:
  en: "Choreographic thinking while you train: daily class, partnering, tumbling and floor work, and writing your own dance score."
  zh: "边训练边编舞：每日课程、双人、翻滚与地面动作，并写自己的舞谱。"
  zh-TW: "邊訓練邊編舞：每日課程、雙人、翻滾與地面動作，並寫自己的舞譜。"
  ja: "訓練しながら振付を考える：毎日のクラス、パートナリング、タンブリング、床の動き、舞踊譜の作成。"
  ko: "훈련하며 안무하기: 매일 수업, 파트너링, 텀블링, 바닥 움직임, 자신만의 무보 쓰기."
  vi: "Vừa tập vừa biên đạo: lớp hằng ngày, múa đôi, nhào lộn, động tác sàn và tự viết vũ phổ."
  ms: "Berfikir koreografi sambil berlatih: kelas harian, berpasangan, guling dan gerak lantai, serta menulis skor sendiri."
  id: "Berpikir koreografis sambil berlatih: kelas harian, berpasangan, guling, gerak lantai dan menulis skor sendiri."
  hi: "ट्रेनिंग के साथ कोरियोग्राफ़िक सोच: रोज़ क्लास, पार्टनरिंग, टम्बलिंग, फ़्लोर वर्क और अपना डांस स्कोर लिखना।"
outcomes:
  - en: "Write a choreographic score"
    zh: "编写一份舞谱"
    zh-TW: "編寫一份舞譜"
    ja: "振付のスコアを書く"
    ko: "안무 스코어 쓰기"
    vi: "Viết một vũ phổ"
    ms: "Tulis skor koreografi"
    id: "Menulis skor koreografi"
    hi: "कोरियोग्राफ़िक स्कोर लिखना"
  - en: "Partner and move safely in and out of the floor"
    zh: "安全地完成双人与地面动作"
    zh-TW: "安全地完成雙人與地面動作"
    ja: "パートナリングと床への出入りを安全に行う"
    ko: "파트너링과 바닥 동작을 안전하게 하기"
    vi: "Múa đôi và xuống-lên sàn an toàn"
    ms: "Berpasangan dan bergerak ke lantai dengan selamat"
    id: "Berpasangan dan bergerak ke lantai dengan aman"
    hi: "पार्टनरिंग और फ़्लोर पर सुरक्षित आना-जाना"
  - en: "Widen your range for different performance settings"
    zh: "扩展适应不同演出场合的能力"
    zh-TW: "擴展適應不同演出場合的能力"
    ja: "多様な上演の場に対応できる幅を広げる"
    ko: "다양한 공연 환경에 맞게 범위 넓히기"
    vi: "Mở rộng khả năng cho nhiều bối cảnh biểu diễn"
    ms: "Luaskan julat untuk pelbagai persembahan"
    id: "Memperluas jangkauan untuk berbagai pertunjukan"
    hi: "अलग-अलग प्रस्तुति स्थितियों के लिए दायरा बढ़ाना"
