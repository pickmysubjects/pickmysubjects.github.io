code: HPSC30041
year: 2027
learn:
  en: "Bioethics through real dilemmas like assisted dying, eating meat and AI in medicine, and why people disagree."
  zh: "通过安乐死、吃肉、医疗AI等真实难题学习生命伦理，以及人们为何意见不同。"
  zh-TW: "透過安樂死、吃肉、醫療AI等真實難題學習生命倫理，以及人們為何意見不同。"
  ja: "安楽死、肉食、医療AIなど実際のジレンマを通して生命倫理と意見が分かれる理由を学ぶ。"
  ko: "조력사, 육식, 의료 AI 같은 실제 딜레마로 생명윤리와 사람들이 의견을 달리하는 이유를 배운다."
  vi: "Đạo đức sinh học qua các tình huống thực như trợ tử, ăn thịt và AI trong y tế, và vì sao mọi người bất đồng."
  ms: "Bioetika melalui dilema sebenar seperti kematian dibantu, makan daging dan AI dalam perubatan, serta mengapa orang tidak bersetuju."
  id: "Bioetika lewat dilema nyata seperti kematian berbantuan, makan daging, dan AI dalam kedokteran, serta mengapa orang berbeda pendapat."
  hi: "सहायता प्राप्त मृत्यु, मांस खाना और चिकित्सा में AI जैसी असली दुविधाओं से बायोएथिक्स, और लोग असहमत क्यों होते हैं।"
outcomes:
  - en: "Define and apply core bioethics concepts"
    zh: "掌握并运用生命伦理核心概念"
    zh-TW: "掌握並運用生命倫理核心概念"
    ja: "生命倫理の基本概念を理解し使う"
    ko: "생명윤리 핵심 개념 정의하고 적용하기"
    vi: "Hiểu và áp dụng khái niệm cốt lõi của đạo đức sinh học"
    ms: "Takrif dan guna konsep teras bioetika"
    id: "Memahami dan menerapkan konsep inti bioetika"
    hi: "बायोएथिक्स की मूल अवधारणाएँ समझना और लागू करना"
  - en: "Analyse bioethical issues in everyday contexts"
    zh: "分析日常生活中的生命伦理问题"
    zh-TW: "分析日常生活中的生命倫理問題"
    ja: "日常の場面での生命倫理の問題を分析する"
    ko: "일상 속 생명윤리 문제 분석하기"
    vi: "Phân tích vấn đề đạo đức sinh học trong đời sống"
    ms: "Analisis isu bioetika dalam konteks harian"
    id: "Menganalisis isu bioetika dalam keseharian"
    hi: "रोज़मर्रा के संदर्भ में बायोएथिकल मुद्दों का विश्लेषण करना"
