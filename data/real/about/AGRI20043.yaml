code: AGRI20043
year: 2026
learn:
  en: "The chemistry of living things: cell molecules and metabolism in plants, animals and microbes on farms."
  zh: "生命的化学：农业中动植物和微生物的细胞分子与代谢。"
  zh-TW: "生命的化學：農業中動植物與微生物的細胞分子與代謝。"
  ja: "生命の化学：農業での動植物・微生物の細胞分子と代謝。"
  ko: "생명의 화학: 농업 속 동식물·미생물의 세포 분자와 대사."
  vi: "Hóa học của sự sống: phân tử tế bào và trao đổi chất ở cây, vật nuôi và vi sinh vật."
  ms: "Kimia hidupan: molekul sel dan metabolisme tumbuhan, haiwan dan mikrob di ladang."
  id: "Kimia makhluk hidup: molekul sel dan metabolisme tanaman, hewan, dan mikroba pertanian."
  hi: "जीवों का रसायन: खेती में पौधों, पशुओं और सूक्ष्मजीवों के कोशिका अणु और चयापचय।"
outcomes:
  - en: "Link molecule structure to its function"
    zh: "将分子结构与功能联系起来"
    zh-TW: "將分子結構與功能連結"
    ja: "分子の構造と機能を結びつける"
    ko: "분자 구조와 기능 연결하기"
    vi: "Liên hệ cấu trúc phân tử với chức năng"
    ms: "Kaitkan struktur molekul dengan fungsinya"
    id: "Mengaitkan struktur molekul dengan fungsinya"
    hi: "अणु की संरचना को उसके कार्य से जोड़ें"
  - en: "Explain how metabolic pathways connect"
    zh: "解释代谢途径之间的联系"
    zh-TW: "解釋代謝途徑之間的關聯"
    ja: "代謝経路のつながりを説明する"
    ko: "대사 경로 간 연결 설명하기"
    vi: "Giải thích các con đường trao đổi chất liên kết"
    ms: "Terangkan hubungan laluan metabolik"
    id: "Menjelaskan keterkaitan jalur metabolisme"
    hi: "चयापचय मार्गों का आपसी संबंध समझाएँ"
  - en: "Analyse and interpret biochemical data"
    zh: "分析和解读生化数据"
    zh-TW: "分析和解讀生化數據"
    ja: "生化学データを分析・解釈する"
    ko: "생화학 데이터 분석·해석하기"
    vi: "Phân tích và diễn giải dữ liệu hóa sinh"
    ms: "Analisis dan tafsir data biokimia"
    id: "Menganalisis dan menafsirkan data biokimia"
    hi: "जैव-रासायनिक डेटा का विश्लेषण करें"
