code: MUSI30270
year: 2026
learn:
  en: "One big research topic in historical musicology each year, looked at through many case studies."
  zh: "每年一个历史音乐学重大专题，通过多个案例深入研究。"
  zh-TW: "每年一個歷史音樂學重大專題，透過多個案例深入研究。"
  ja: "毎年ひとつの歴史音楽学の大きなテーマを、多くの事例から学ぶ。"
  ko: "매년 역사 음악학의 큰 주제 하나를 여러 사례로 공부."
  vi: "Mỗi năm một chủ đề lớn của âm nhạc học lịch sử, qua nhiều ca nghiên cứu."
  ms: "Satu topik besar muzikologi sejarah setiap tahun, melalui banyak kajian kes."
  id: "Satu topik besar musikologi historis tiap tahun, lewat banyak studi kasus."
  hi: "हर साल ऐतिहासिक संगीतशास्त्र का एक बड़ा विषय, कई केस स्टडी के ज़रिए।"
outcomes:
  - en: "Compare how scholars approach a topic"
    zh: "比较学者研究专题的方法"
    zh-TW: "比較學者研究專題的方法"
    ja: "研究者のアプローチを比べる"
    ko: "학자들의 접근 방식 비교하기"
    vi: "So sánh cách học giả tiếp cận chủ đề"
    ms: "Banding cara sarjana mendekati topik"
    id: "Membandingkan pendekatan para peneliti"
    hi: "विद्वानों के तरीक़ों की तुलना"
  - en: "Find and judge the research literature"
    zh: "查找并评估研究文献"
    zh-TW: "查找並評估研究文獻"
    ja: "研究文献を探して評価する"
    ko: "연구 문헌 찾고 평가하기"
    vi: "Tìm và đánh giá tài liệu nghiên cứu"
    ms: "Cari dan nilai literatur kajian"
    id: "Mencari dan menilai literatur riset"
    hi: "शोध साहित्य खोजना और परखना"
  - en: "Carry out a small research project"
    zh: "完成一个小型研究项目"
    zh-TW: "完成一個小型研究專案"
    ja: "小さな研究プロジェクトを行う"
    ko: "작은 연구 프로젝트 수행하기"
    vi: "Thực hiện một dự án nghiên cứu nhỏ"
    ms: "Jalankan projek kajian kecil"
    id: "Melakukan proyek riset kecil"
    hi: "एक छोटा शोध प्रोजेक्ट करना"
