code: INDG30005
year: 2026
learn:
  en: "How states in Australia and elsewhere have denied or recognised Indigenous land title, including Victoria's treaty process."
  zh: "澳大利亚及其他国家如何否认或承认原住民土地权，包括维多利亚州的条约进程。"
  zh-TW: "澳洲及其他國家如何否認或承認原住民土地權，包括維多利亞州的條約進程。"
  ja: "オーストラリアなどの国家が先住民の土地権をどう否定・承認してきたかを、ビクトリア州の条約交渉も含めて学ぶ。"
  ko: "호주와 다른 나라가 원주민 토지권을 어떻게 부정하거나 인정했는지 빅토리아주 조약 과정을 포함해 배운다."
  vi: "Các nhà nước ở Úc và nơi khác đã phủ nhận hay công nhận quyền đất đai bản địa ra sao, gồm tiến trình hiệp ước ở Victoria."
  ms: "Cara negara di Australia dan tempat lain menafikan atau mengiktiraf hak tanah Orang Asal, termasuk proses perjanjian Victoria."
  id: "Cara negara di Australia dan tempat lain menolak atau mengakui hak tanah adat, termasuk proses traktat di Victoria."
  hi: "ऑस्ट्रेलिया और अन्य जगहों पर राज्यों ने मूलनिवासी भूमि अधिकार को कैसे नकारा या माना, विक्टोरिया की संधि प्रक्रिया समेत।"
outcomes:
  - en: "Explain how land title has been denied and won"
    zh: "解释土地权如何被否认又如何争取到"
    zh-TW: "解釋土地權如何被否認又如何爭取到"
    ja: "土地権がどう否定され、勝ち取られたか説明する"
    ko: "토지권이 부정되고 쟁취된 과정 설명하기"
    vi: "Giải thích quyền đất đai bị phủ nhận và giành lại ra sao"
    ms: "Terangkan cara hak tanah dinafikan dan dimenangi"
    id: "Menjelaskan cara hak tanah ditolak dan diperjuangkan"
    hi: "भूमि अधिकार कैसे नकारा और हासिल किया गया, समझाना"
  - en: "Analyse treaty processes in Victoria"
    zh: "分析维多利亚州的条约进程"
    zh-TW: "分析維多利亞州的條約進程"
    ja: "ビクトリア州の条約交渉を分析する"
    ko: "빅토리아주 조약 과정 분석하기"
    vi: "Phân tích tiến trình hiệp ước ở Victoria"
    ms: "Analisis proses perjanjian di Victoria"
    id: "Menganalisis proses traktat di Victoria"
    hi: "विक्टोरिया की संधि प्रक्रिया का विश्लेषण करना"
  - en: "Compare approaches in different countries"
    zh: "比较不同国家的做法"
    zh-TW: "比較不同國家的做法"
    ja: "国ごとの取り組みを比べる"
    ko: "여러 나라의 접근 방식 비교하기"
    vi: "So sánh cách tiếp cận ở các quốc gia khác nhau"
    ms: "Bandingkan pendekatan di negara berbeza"
    id: "Membandingkan pendekatan di berbagai negara"
    hi: "अलग-अलग देशों के तरीकों की तुलना करना"
