code: ECOL30005
year: 2026
learn:
  en: "Using ecology to manage and conserve ecosystems, especially in Australia, under local and global change."
  zh: "运用生态学管理和保护生态系统，尤其是在变化中的澳洲环境。"
  zh-TW: "運用生態學管理與保育生態系，尤其是在變化中的澳洲環境。"
  ja: "変化する環境下で、特に豪州の生態系を生態学で管理・保全する。"
  ko: "변화하는 환경에서 특히 호주 생태계를 생태학으로 관리·보전하기."
  vi: "Dùng sinh thái học để quản lý, bảo tồn hệ sinh thái, nhất là ở Úc, trước thay đổi toàn cầu và địa phương."
  ms: "Menggunakan ekologi untuk mengurus dan memulihara ekosistem, terutamanya di Australia, ketika berlaku perubahan."
  id: "Memakai ekologi untuk mengelola dan melestarikan ekosistem, terutama di Australia, di tengah perubahan."
  hi: "बदलते हालात में, ख़ासकर ऑस्ट्रेलिया में, इकोलॉजी से इकोसिस्टम का प्रबंधन और संरक्षण।"
outcomes:
  - en: "Analyse data for conservation decisions"
    zh: "为保护决策分析数据"
    zh-TW: "為保育決策分析數據"
    ja: "保全の判断のためにデータを分析する"
    ko: "보전 결정을 위한 데이터 분석하기"
    vi: "Phân tích dữ liệu cho quyết định bảo tồn"
    ms: "Menganalisis data untuk keputusan pemuliharaan"
    id: "Menganalisis data untuk keputusan konservasi"
    hi: "संरक्षण निर्णयों के लिए डेटा विश्लेषण करना"
  - en: "Compare ways of managing ecosystems"
    zh: "比较不同的生态系统管理方式"
    zh-TW: "比較不同的生態系管理方式"
    ja: "生態系管理の手法を比較する"
    ko: "생태계 관리 방식 비교하기"
    vi: "So sánh các cách quản lý hệ sinh thái"
    ms: "Membandingkan cara mengurus ekosistem"
    id: "Membandingkan cara mengelola ekosistem"
    hi: "इकोसिस्टम प्रबंधन के तरीकों की तुलना करना"
  - en: "Explain ecology to public audiences"
    zh: "向公众讲解生态管理"
    zh-TW: "向大眾講解生態管理"
    ja: "一般向けに生態管理を伝える"
    ko: "대중에게 생태 관리 설명하기"
    vi: "Trình bày sinh thái học cho công chúng"
    ms: "Menerangkan ekologi kepada orang awam"
    id: "Menjelaskan ekologi kepada publik"
    hi: "आम लोगों को इकोलॉजी समझाना"
