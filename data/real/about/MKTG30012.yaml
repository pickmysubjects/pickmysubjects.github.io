code: MKTG30012
year: 2026
learn:
  en: "Ethical problems businesses and marketers face, and how they can show responsible, sustainable leadership."
  zh: "企业和营销人员面临的伦理问题，以及如何展现负责任、可持续的领导力。"
  zh-TW: "企業和行銷人員面臨的倫理問題，以及如何展現負責任、永續的領導力。"
  ja: "企業とマーケターが直面する倫理問題と、責任ある持続可能なリーダーシップ。"
  ko: "기업과 마케터가 마주하는 윤리 문제와 책임 있고 지속가능한 리더십."
  vi: "Các vấn đề đạo đức doanh nghiệp và marketer gặp phải, và cách thể hiện lãnh đạo có trách nhiệm, bền vững."
  ms: "Masalah etika yang dihadapi perniagaan dan pemasar, dan cara menunjukkan kepimpinan bertanggungjawab dan lestari."
  id: "Masalah etika yang dihadapi bisnis dan pemasar, serta cara menunjukkan kepemimpinan yang bertanggung jawab dan berkelanjutan."
  hi: "बिज़नेस और मार्केटर के सामने आने वाली नैतिक समस्याएँ, और ज़िम्मेदार व टिकाऊ नेतृत्व कैसे दिखाएँ।"
outcomes:
  - en: "Analyse issues like social justice and regulation"
    zh: "分析社会公正、政府监管等议题"
    zh-TW: "分析社會正義、政府監管等議題"
    ja: "社会正義や規制などの問題を分析する"
    ko: "사회 정의, 규제 같은 문제 분석하기"
    vi: "Phân tích vấn đề như công bằng xã hội, quy định"
    ms: "Analisis isu seperti keadilan sosial dan peraturan"
    id: "Menganalisis isu seperti keadilan sosial dan regulasi"
    hi: "सामाजिक न्याय और रेगुलेशन जैसे मुद्दों का विश्लेषण"
  - en: "Use ethical frameworks to judge business debates"
    zh: "用伦理框架评判商业争议"
    zh-TW: "用倫理架構評斷商業爭議"
    ja: "倫理の枠組みでビジネスの論争を評価する"
    ko: "윤리 프레임워크로 비즈니스 논쟁 판단하기"
    vi: "Dùng khung đạo đức để đánh giá tranh luận kinh doanh"
    ms: "Guna rangka etika untuk menilai perdebatan perniagaan"
    id: "Memakai kerangka etika untuk menilai debat bisnis"
    hi: "नैतिक फ़्रेमवर्क से बिज़नेस की बहसें परखना"
  - en: "Apply these ideas to real cases"
    zh: "把这些知识用到真实案例"
    zh-TW: "把這些知識用在真實案例"
    ja: "これらの考えを実例に当てはめる"
    ko: "이 개념을 실제 사례에 적용하기"
    vi: "Áp dụng vào tình huống thực tế"
    ms: "Guna idea ini pada kes sebenar"
    id: "Menerapkan ide ini pada kasus nyata"
    hi: "इन बातों को असली मामलों पर लागू करना"
