code: ENGR90034
year: 2027
learn:
  en: "Finding the real problem behind messy situations and solving it in diverse teams, through two projects."
  zh: "通过两个项目，学会找出复杂情境背后的真正问题，并在多元团队中解决。"
  zh-TW: "透過兩個專題，學會找出複雜情境背後的真正問題，並在多元團隊中解決。"
  ja: "2つのプロジェクトで、複雑な状況の本当の問題を見つけ多様なチームで解く。"
  ko: "두 프로젝트로 복잡한 상황의 진짜 문제를 찾고 다양한 팀으로 해결."
  vi: "Qua hai dự án, tìm vấn đề thật sau tình huống rối và giải nó cùng nhóm đa dạng."
  ms: "Melalui dua projek, cari masalah sebenar di sebalik situasi kusut dan selesaikan dalam pasukan pelbagai."
  id: "Lewat dua proyek, menemukan masalah sebenarnya di balik situasi rumit dan menyelesaikannya dalam tim beragam."
  hi: "दो प्रोजेक्ट से उलझी स्थितियों के पीछे असली समस्या ढूँढना और विविध टीमों में हल करना।"
outcomes:
  - en: "Frame the real problem before solving it"
    zh: "先界定真正问题再求解"
    zh-TW: "先界定真正問題再求解"
    ja: "解く前に本当の問題を定める"
    ko: "풀기 전에 진짜 문제 정의하기"
    vi: "Xác định đúng vấn đề trước khi giải"
    ms: "Rumuskan masalah sebenar sebelum menyelesaikannya"
    id: "Merumuskan masalah sebenarnya sebelum menyelesaikannya"
    hi: "हल करने से पहले असली समस्या तय करना"
  - en: "Work well in a diverse project team"
    zh: "在多元项目团队中有效合作"
    zh-TW: "在多元專案團隊中有效合作"
    ja: "多様なチームでうまく働く"
    ko: "다양한 팀에서 잘 협업하기"
    vi: "Làm việc hiệu quả trong nhóm đa dạng"
    ms: "Bekerja dengan baik dalam pasukan pelbagai"
    id: "Bekerja baik dalam tim proyek beragam"
    hi: "विविध टीम में अच्छे से काम करना"
