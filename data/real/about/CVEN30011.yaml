code: CVEN30011
year: 2026
learn:
  en: "Planning city transport with real data, GIS and spreadsheets, with a focus on access, equity and sustainability."
  zh: "用真实数据、GIS和表格规划城市交通，关注可达性、公平与可持续。"
  zh-TW: "用真實數據、GIS與試算表規劃城市交通，關注可及性、公平與永續。"
  ja: "実データ・GIS・表計算で都市交通を計画し、アクセス・公平・持続性を考える。"
  ko: "실제 데이터·GIS·스프레드시트로 도시 교통 계획, 접근성·형평성·지속가능성 중심."
  vi: "Quy hoạch giao thông đô thị bằng dữ liệu thật, GIS và bảng tính, chú trọng tiếp cận, công bằng, bền vững."
  ms: "Merancang pengangkutan bandar dengan data sebenar, GIS dan hamparan, fokus akses, ekuiti dan kelestarian."
  id: "Merencanakan transportasi kota dengan data nyata, GIS, dan spreadsheet, fokus akses, keadilan, keberlanjutan."
  hi: "असली डेटा, GIS और स्प्रेडशीट से शहरी परिवहन की योजना, पहुँच, समानता और स्थिरता पर ज़ोर।"
outcomes:
  - en: "Analyse transport data with GIS"
    zh: "用GIS分析交通数据"
    zh-TW: "用GIS分析交通數據"
    ja: "GISで交通データを分析する"
    ko: "GIS로 교통 데이터 분석하기"
    vi: "Phân tích dữ liệu giao thông bằng GIS"
    ms: "Menganalisis data pengangkutan dengan GIS"
    id: "Menganalisis data transportasi dengan GIS"
    hi: "GIS से परिवहन डेटा का विश्लेषण करना"
  - en: "Evaluate transport options for equity"
    zh: "从公平角度评估交通方案"
    zh-TW: "從公平角度評估交通方案"
    ja: "交通案を公平性の観点で評価する"
    ko: "형평성 관점에서 교통 대안 평가하기"
    vi: "Đánh giá phương án giao thông về công bằng"
    ms: "Menilai pilihan pengangkutan dari segi ekuiti"
    id: "Menilai opsi transportasi dari sisi keadilan"
    hi: "समानता के लिहाज़ से परिवहन विकल्प परखना"
  - en: "Write an industry-style team report"
    zh: "以团队撰写行业标准报告"
    zh-TW: "以團隊撰寫業界標準報告"
    ja: "チームで業界水準の報告書を書く"
    ko: "팀으로 업계 수준 보고서 작성하기"
    vi: "Viết báo cáo nhóm theo chuẩn ngành"
    ms: "Menulis laporan berkumpulan gaya industri"
    id: "Menulis laporan tim standar industri"
    hi: "टीम में इंडस्ट्री-स्तर की रिपोर्ट लिखना"
