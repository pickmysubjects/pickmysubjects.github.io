code: PHYC20012
year: 2026
learn:
  en: "Heat, energy and classical mechanics, and how they lead to the basic ideas of quantum mechanics."
  zh: "热学和经典力学，以及它们如何引出量子力学。"
  zh-TW: "熱學和古典力學，以及它們如何引出量子力學。"
  ja: "熱物理と古典力学、そこから量子力学の基本へ。"
  ko: "열물리와 고전역학, 그리고 그것이 양자역학으로 이어지는 과정."
  vi: "Nhiệt học và cơ học cổ điển, và cách chúng dẫn tới cơ học lượng tử."
  ms: "Fizik terma dan mekanik klasik, serta cara ia membawa kepada mekanik kuantum."
  id: "Fisika termal dan mekanika klasik, serta jalannya menuju mekanika kuantum."
  hi: "थर्मल फ़िज़िक्स और क्लासिकल मैकेनिक्स, और कैसे ये क्वांटम मैकेनिक्स तक ले जाते हैं।"
outcomes:
  - en: "Explain how quantum differs from classical"
    zh: "解释量子与经典理论的区别"
    zh-TW: "解釋量子與古典理論的差異"
    ja: "量子と古典の違いを説明する"
    ko: "양자와 고전 이론의 차이 설명하기"
    vi: "Giải thích khác biệt lượng tử và cổ điển"
    ms: "Menerangkan beza kuantum dan klasik"
    id: "Menjelaskan beda kuantum dan klasik"
    hi: "क्वांटम और क्लासिकल का फ़र्क समझाना"
  - en: "Solve simple thermal and quantum problems"
    zh: "解决简单的热学和量子问题"
    zh-TW: "解決簡單的熱學和量子問題"
    ja: "簡単な熱・量子の問題を解く"
    ko: "간단한 열·양자 문제 풀기"
    vi: "Giải bài toán nhiệt và lượng tử đơn giản"
    ms: "Menyelesaikan masalah terma dan kuantum mudah"
    id: "Memecahkan soal termal dan kuantum sederhana"
    hi: "सरल थर्मल और क्वांटम सवाल हल करना"
