code: VETS30030
year: 2026
learn:
  en: "Veterinary professional practice, non-production animal industries, animal law and ethics, and safe animal handling."
  zh: "兽医职业实践、非生产性动物行业、动物法规与伦理及安全操作动物。"
  zh-TW: "獸醫專業實務、非經濟動物產業、動物法規與倫理及安全操作動物。"
  ja: "獣医の職業実務、非生産動物産業、動物の法と倫理、安全な動物の取り扱い。"
  ko: "수의 전문 실무, 비생산 동물 산업, 동물 법·윤리, 안전한 동물 다루기."
  vi: "Thực hành nghề thú y, ngành động vật phi sản xuất, luật và đạo đức, xử lý động vật an toàn."
  ms: "Amalan profesional veterinar, industri haiwan bukan pengeluaran, undang-undang dan etika, pengendalian haiwan selamat."
  id: "Praktik profesional dokter hewan, industri hewan nonproduksi, hukum dan etika, penanganan hewan yang aman."
  hi: "पशु-चिकित्सा पेशेवर अभ्यास, गैर-उत्पादन पशु उद्योग, कानून व नैतिकता और पशुओं को सुरक्षित संभालना।"
outcomes:
  - en: "Safely handle and restrain common animal species"
    zh: "安全地操作和保定常见动物"
    zh-TW: "安全地操作與保定常見動物"
    ja: "一般的な動物を安全に扱い保定する"
    ko: "흔한 동물을 안전하게 다루고 보정한다"
    vi: "Xử lý và cố định an toàn các loài vật phổ biến"
    ms: "Mengendali dan menahan haiwan biasa dengan selamat"
    id: "Menangani dan merestrain hewan umum dengan aman"
    hi: "सामान्य पशुओं को सुरक्षित रूप से संभालना और रोकना"
  - en: "Describe animal industry laws and ethics"
    zh: "阐述动物行业的法律与伦理"
    zh-TW: "闡述動物產業的法律與倫理"
    ja: "動物産業の法と倫理を説明する"
    ko: "동물 산업의 법과 윤리를 기술한다"
    vi: "Mô tả luật và đạo đức ngành động vật"
    ms: "Menghuraikan undang-undang dan etika industri haiwan"
    id: "Mendeskripsikan hukum dan etika industri hewan"
    hi: "पशु उद्योग के कानून और नैतिकता का वर्णन करना"
  - en: "Work well in a team and look after well-being"
    zh: "有效团队合作并关注身心健康"
    zh-TW: "有效團隊合作並照顧身心健康"
    ja: "チームで働き、心身の健康を保つ"
    ko: "팀으로 일하고 웰빙을 관리한다"
    vi: "Làm việc nhóm tốt và chăm lo sức khỏe tinh thần"
    ms: "Bekerja dalam pasukan dan menjaga kesejahteraan"
    id: "Bekerja dalam tim dan menjaga kesejahteraan"
    hi: "टीम में अच्छा काम करना और सेहत का ध्यान रखना"
