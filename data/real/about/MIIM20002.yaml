code: MIIM20002
year: 2026
learn:
  en: "How microbes cause human infections, how the body responds, and how vaccines and drugs control them."
  zh: "微生物怎么让人感染、身体怎么反应，以及疫苗和药物怎么控制。"
  zh-TW: "微生物怎麼讓人感染、身體怎麼反應，以及疫苗和藥物怎麼控制。"
  ja: "微生物がヒトに感染する仕組み、体の反応、ワクチンや薬による制御。"
  ko: "미생물이 사람을 감염시키는 방식, 몸의 반응, 백신과 약으로 통제하는 법."
  vi: "Vi sinh vật gây nhiễm trùng ở người ra sao, cơ thể phản ứng thế nào, và vắc-xin, thuốc kiểm soát chúng."
  ms: "Cara mikrob menjangkiti manusia, tindak balas badan, dan cara vaksin serta ubat mengawalnya."
  id: "Cara mikroba menginfeksi manusia, respons tubuh, dan cara vaksin serta obat mengendalikannya."
  hi: "सूक्ष्मजीव इंसानों में संक्रमण कैसे करते हैं, शरीर कैसे जवाब देता है, और टीके व दवाएँ उन्हें कैसे रोकते हैं।"
outcomes:
  - en: "Describe common disease-causing microbes"
    zh: "描述常见的致病微生物"
    zh-TW: "描述常見的致病微生物"
    ja: "よくある病原微生物を説明する"
    ko: "흔한 병원성 미생물 설명하기"
    vi: "Mô tả các vi sinh vật gây bệnh phổ biến"
    ms: "Menghuraikan mikrob penyebab penyakit yang biasa"
    id: "Menjelaskan mikroba penyebab penyakit yang umum"
    hi: "आम रोग पैदा करने वाले सूक्ष्मजीवों का वर्णन"
  - en: "Explain how infections are controlled in communities"
    zh: "解释社区中怎么控制传染病"
    zh-TW: "解釋社區中怎麼控制傳染病"
    ja: "地域社会で感染症を抑える方法を説明する"
    ko: "지역사회에서 감염을 통제하는 방법 설명하기"
    vi: "Giải thích cách kiểm soát nhiễm trùng trong cộng đồng"
    ms: "Menerangkan cara jangkitan dikawal dalam komuniti"
    id: "Menjelaskan cara infeksi dikendalikan di masyarakat"
    hi: "समुदाय में संक्रमण कैसे नियंत्रित होते हैं, समझाना"
  - en: "Do basic microbiology lab techniques safely"
    zh: "安全地做基础微生物实验"
    zh-TW: "安全地做基礎微生物實驗"
    ja: "基本的な微生物実験を安全に行う"
    ko: "기초 미생물 실험을 안전하게 하기"
    vi: "Làm an toàn các kỹ thuật thí nghiệm vi sinh cơ bản"
    ms: "Melakukan teknik makmal mikrobiologi asas dengan selamat"
    id: "Melakukan teknik lab mikrobiologi dasar dengan aman"
    hi: "बुनियादी माइक्रोबायोलॉजी लैब तकनीकें सुरक्षित करना"
