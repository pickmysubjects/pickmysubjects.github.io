code: CVEN90063
year: 2027
learn:
  en: "The four-step transport model and newer methods like choice and activity-based modelling for transport planning."
  zh: "交通规划中的四阶段模型，以及选择模型和基于活动的模型等新方法。"
  zh-TW: "交通規劃中的四階段模型，以及選擇模型與活動導向模型等新方法。"
  ja: "交通計画の四段階推定法と、選択モデル・アクティビティベースモデルなどの新しい手法。"
  ko: "교통 계획의 4단계 모형과 선택 모형, 활동 기반 모형 같은 새로운 방법."
  vi: "Mô hình bốn bước và các phương pháp mới như mô hình lựa chọn, mô hình dựa trên hoạt động trong quy hoạch giao thông."
  ms: "Model empat langkah dan kaedah baharu seperti model pilihan dan model berasaskan aktiviti untuk perancangan pengangkutan."
  id: "Model empat tahap dan metode baru seperti model pilihan dan model berbasis aktivitas untuk perencanaan transportasi."
  hi: "परिवहन योजना के लिए फ़ोर-स्टेप मॉडल और चॉइस व एक्टिविटी-आधारित मॉडलिंग जैसी नई विधियाँ।"
outcomes:
  - en: "Run trip generation, distribution, mode split and assignment"
    zh: "完成出行生成、分布、方式划分和交通分配"
    zh-TW: "完成旅次產生、分布、運具分配與交通量指派"
    ja: "発生・分布・分担・配分の各段階を実行する"
    ko: "통행 발생·분포·수단 분담·배정 수행하기"
    vi: "Thực hiện phát sinh, phân bố, phân chia phương thức và phân bổ chuyến đi"
    ms: "Menjalankan penjanaan, taburan, pembahagian mod dan agihan perjalanan"
    id: "Menjalankan bangkitan, distribusi, pemilihan moda dan pembebanan perjalanan"
    hi: "यात्रा उत्पत्ति, वितरण, साधन विभाजन और असाइनमेंट करना"
  - en: "Compare the strengths and limits of transport models"
    zh: "比较各类交通模型的优缺点"
    zh-TW: "比較各類交通模型的優缺點"
    ja: "交通モデルの長所と限界を比べる"
    ko: "교통 모형의 장단점 비교하기"
    vi: "So sánh ưu nhược điểm của các mô hình giao thông"
    ms: "Membandingkan kekuatan dan had model pengangkutan"
    id: "Membandingkan kelebihan dan keterbatasan model transportasi"
    hi: "परिवहन मॉडलों की ताक़त और सीमाओं की तुलना"
  - en: "Carry out a traffic impact study"
    zh: "开展交通影响评估"
    zh-TW: "進行交通影響評估"
    ja: "交通影響評価を行う"
    ko: "교통 영향 평가 수행하기"
    vi: "Thực hiện đánh giá tác động giao thông"
    ms: "Menjalankan kajian impak trafik"
    id: "Melakukan kajian dampak lalu lintas"
    hi: "यातायात प्रभाव अध्ययन करना"
