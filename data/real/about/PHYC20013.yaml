code: PHYC20013
year: 2026
learn:
  en: "Hands-on physics experiments plus programming numerical methods to solve physics problems."
  zh: "动手做物理实验，并编程用数值方法解物理题。"
  zh-TW: "動手做物理實驗，並寫程式用數值方法解物理題。"
  ja: "物理実験と、数値計算プログラムで物理の問題を解くこと。"
  ko: "물리 실험과 수치해석 프로그래밍으로 물리 문제 풀기."
  vi: "Thí nghiệm vật lý thực hành và lập trình phương pháp số để giải bài toán vật lý."
  ms: "Eksperimen fizik secara praktikal dan pengaturcaraan kaedah berangka untuk masalah fizik."
  id: "Eksperimen fisika langsung dan pemrograman metode numerik untuk soal fisika."
  hi: "हैंड्स-ऑन फ़िज़िक्स प्रयोग और न्यूमेरिकल मेथड की प्रोग्रामिंग से फ़िज़िक्स सवाल हल करना।"
outcomes:
  - en: "Evaluate experimental data and uncertainty"
    zh: "评估实验数据和误差"
    zh-TW: "評估實驗數據和誤差"
    ja: "実験データと不確かさを評価する"
    ko: "실험 데이터와 불확도 평가하기"
    vi: "Đánh giá dữ liệu thí nghiệm và sai số"
    ms: "Menilai data eksperimen dan ketidakpastian"
    id: "Menilai data eksperimen dan ketidakpastian"
    hi: "प्रयोग के डेटा और अनिश्चितता को आँकना"
  - en: "Write programs to solve physics problems"
    zh: "编程解决物理问题"
    zh-TW: "寫程式解決物理問題"
    ja: "物理の問題を解くプログラムを書く"
    ko: "물리 문제를 푸는 프로그램 작성하기"
    vi: "Viết chương trình giải bài toán vật lý"
    ms: "Menulis program untuk masalah fizik"
    id: "Menulis program untuk soal fisika"
    hi: "फ़िज़िक्स सवालों के लिए प्रोग्राम लिखना"
