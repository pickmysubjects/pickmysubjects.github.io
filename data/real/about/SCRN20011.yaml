code: SCRN20011
year: 2026
learn:
  en: "The history of the American film and TV industry, from early Hollywood to streaming, and the pull between art and business."
  zh: "美国电影电视产业的历史，从早期好莱坞到流媒体，以及艺术与商业之间的拉扯。"
  zh-TW: "美國電影電視產業的歷史，從早期好萊塢到串流平台，以及藝術與商業之間的拉扯。"
  ja: "初期ハリウッドから配信まで、米国の映画・テレビ産業の歴史と、芸術と商売のせめぎ合いを学ぶ。"
  ko: "초기 할리우드부터 스트리밍까지 미국 영화·TV 산업의 역사와 예술과 비즈니스 사이의 긴장을 배운다."
  vi: "Lịch sử ngành điện ảnh và truyền hình Mỹ, từ Hollywood thời đầu đến phát trực tuyến, và sự giằng co giữa nghệ thuật và kinh doanh."
  ms: "Sejarah industri filem dan TV Amerika, dari Hollywood awal hingga penstriman, serta tarikan antara seni dan perniagaan."
  id: "Sejarah industri film dan TV Amerika, dari Hollywood awal sampai streaming, serta tarik-menarik antara seni dan bisnis."
  hi: "अमेरिकी फ़िल्म और टीवी उद्योग का इतिहास, शुरुआती हॉलीवुड से स्ट्रीमिंग तक, और कला व कारोबार की खींचतान।"
outcomes:
  - en: "Describe key periods in Hollywood history"
    zh: "描述好莱坞历史的主要时期"
    zh-TW: "描述好萊塢歷史的主要時期"
    ja: "ハリウッド史の主な時代を説明する"
    ko: "할리우드 역사의 주요 시기 설명하기"
    vi: "Mô tả các giai đoạn chính của lịch sử Hollywood"
    ms: "Huraikan zaman utama sejarah Hollywood"
    id: "Menguraikan periode utama sejarah Hollywood"
    hi: "हॉलीवुड इतिहास के मुख्य दौर बताना"
  - en: "Analyse films and shows in their industry context"
    zh: "结合产业背景分析电影和剧集"
    zh-TW: "結合產業背景分析電影和劇集"
    ja: "映画や番組を産業の文脈で分析する"
    ko: "영화와 드라마를 산업 맥락에서 분석하기"
    vi: "Phân tích phim và chương trình trong bối cảnh ngành"
    ms: "Analisis filem dan rancangan dalam konteks industri"
    id: "Menganalisis film dan acara dalam konteks industri"
    hi: "फ़िल्मों और शो का उद्योग के संदर्भ में विश्लेषण करना"
  - en: "Discuss race, gender and marketing in show business"
    zh: "讨论娱乐业中的种族、性别与营销"
    zh-TW: "討論娛樂業中的種族、性別與行銷"
    ja: "ショービジネスにおける人種・ジェンダー・宣伝を論じる"
    ko: "쇼 비즈니스의 인종·젠더·마케팅 논의하기"
    vi: "Thảo luận chủng tộc, giới và tiếp thị trong ngành giải trí"
    ms: "Bincangkan kaum, gender dan pemasaran dalam dunia hiburan"
    id: "Membahas ras, gender dan pemasaran di dunia hiburan"
    hi: "शो बिज़नेस में नस्ल, जेंडर और मार्केटिंग पर चर्चा करना"
