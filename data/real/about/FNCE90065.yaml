code: FNCE90065
year: 2027
learn:
  en: "Basics of finance: time value of money, risk and return, and how stocks, bonds, loans and their markets work."
  zh: "金融入门：货币时间价值、风险与收益，以及股票、债券、贷款和相关市场如何运作。"
  zh-TW: "金融入門：貨幣時間價值、風險與報酬，以及股票、債券、貸款和相關市場如何運作。"
  ja: "金融の基礎：貨幣の時間価値、リスクとリターン、株式・債券・ローンと市場の仕組み。"
  ko: "금융 기초: 화폐의 시간가치, 위험과 수익, 주식·채권·대출과 시장의 작동 방식."
  vi: "Nền tảng tài chính: giá trị thời gian của tiền, rủi ro và lợi nhuận, cổ phiếu, trái phiếu, khoản vay và thị trường."
  ms: "Asas kewangan: nilai masa wang, risiko dan pulangan, serta cara saham, bon, pinjaman dan pasarannya berfungsi."
  id: "Dasar keuangan: nilai waktu uang, risiko dan imbal hasil, serta cara kerja saham, obligasi, pinjaman dan pasarnya."
  hi: "वित्त की बुनियाद: पैसे का समय मूल्य, जोखिम और रिटर्न, शेयर, बॉन्ड, ऋण और उनके बाज़ार।"
outcomes:
  - en: "Explain the role of different financial markets"
    zh: "解释各类金融市场的作用"
    zh-TW: "解釋各類金融市場的作用"
    ja: "さまざまな金融市場の役割を説明する"
    ko: "여러 금융시장의 역할 설명하기"
    vi: "Giải thích vai trò của các thị trường tài chính"
    ms: "Menerangkan peranan pelbagai pasaran kewangan"
    id: "Menjelaskan peran berbagai pasar keuangan"
    hi: "विभिन्न वित्तीय बाज़ारों की भूमिका समझाना"
  - en: "Value financial securities using key finance concepts"
    zh: "用核心金融概念为证券估值"
    zh-TW: "用核心金融概念為證券估值"
    ja: "基本概念を使って証券を評価する"
    ko: "핵심 개념으로 금융 증권 가치 평가하기"
    vi: "Định giá chứng khoán bằng các khái niệm tài chính cốt lõi"
    ms: "Menilai sekuriti kewangan dengan konsep utama"
    id: "Menilai sekuritas dengan konsep keuangan utama"
    hi: "मुख्य अवधारणाओं से प्रतिभूतियों का मूल्यांकन"
  - en: "Explain how risk and return shape financial decisions"
    zh: "解释风险与收益如何影响金融决策"
    zh-TW: "解釋風險與報酬如何影響金融決策"
    ja: "リスクとリターンが意思決定に与える影響を説明する"
    ko: "위험과 수익이 금융 결정에 미치는 영향 설명하기"
    vi: "Giải thích rủi ro và lợi nhuận ảnh hưởng quyết định ra sao"
    ms: "Menerangkan kesan risiko dan pulangan pada keputusan"
    id: "Menjelaskan pengaruh risiko dan imbal hasil pada keputusan"
    hi: "जोखिम और रिटर्न का वित्तीय निर्णयों पर असर समझाना"
