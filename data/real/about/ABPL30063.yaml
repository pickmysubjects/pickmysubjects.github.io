code: ABPL30063
year: 2026
learn:
  en: "A two-week winter studio run with London's Architectural Association: digital design tools, from urban ideas to full-size prototypes."
  zh: "与伦敦建筑联盟学院合办的两周冬季工作室，用数字设计工具做从城市到实物的项目。"
  zh-TW: "與倫敦建築聯盟學院合辦的兩週冬季工作室，用數位設計工具做從城市到實物的專案。"
  ja: "ロンドンのAAスクールと行う2週間の冬季スタジオ。デジタル設計で都市から実物大まで扱う。"
  ko: "런던 AA스쿨과 함께하는 2주 겨울 스튜디오. 디지털 설계로 도시부터 실물 크기까지 다룬다."
  vi: "Studio mùa đông 2 tuần với trường AA London: công cụ thiết kế số, từ đô thị đến mô hình thật."
  ms: "Studio musim sejuk 2 minggu bersama AA London: alat reka bentuk digital, dari bandar ke prototaip."
  id: "Studio musim dingin 2 minggu bersama AA London: alat desain digital, dari kota hingga prototipe."
  hi: "लंदन के AA स्कूल के साथ दो हफ़्ते का विंटर स्टूडियो: डिजिटल डिज़ाइन टूल से शहर से असली मॉडल तक।"
outcomes:
  - en: "Use current digital design tools and workflows"
    zh: "使用当代数字设计工具与流程"
    zh-TW: "使用當代數位設計工具與流程"
    ja: "最新のデジタル設計ツールと手順を使う"
    ko: "최신 디지털 설계 도구와 작업 흐름 활용하기"
    vi: "Dùng công cụ và quy trình thiết kế số hiện đại"
    ms: "Guna alat dan aliran kerja reka bentuk digital"
    id: "Memakai alat dan alur kerja desain digital"
    hi: "आधुनिक डिजिटल डिज़ाइन टूल और वर्कफ़्लो इस्तेमाल करना"
  - en: "Build and test a design in an intensive team studio"
    zh: "在密集团队工作室中制作并测试设计"
    zh-TW: "在密集團隊工作室中製作並測試設計"
    ja: "集中型チームスタジオで設計をつくり検証する"
    ko: "집중 팀 스튜디오에서 설계 만들고 시험하기"
    vi: "Làm và thử nghiệm thiết kế trong studio nhóm"
    ms: "Bina dan uji reka bentuk dalam studio pasukan"
    id: "Membuat dan menguji desain dalam studio tim"
    hi: "गहन टीम स्टूडियो में डिज़ाइन बनाना और परखना"
  - en: "Present and exhibit the finished work"
    zh: "展示并布展完成的作品"
    zh-TW: "展示並布展完成的作品"
    ja: "完成作品を発表・展示する"
    ko: "완성 작품 발표·전시하기"
    vi: "Trình bày và triển lãm sản phẩm hoàn thành"
    ms: "Bentang dan pamer hasil kerja"
    id: "Mempresentasikan dan memamerkan karya"
    hi: "तैयार काम को प्रस्तुत और प्रदर्शित करना"
