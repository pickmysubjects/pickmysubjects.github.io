code: PROP30003
year: 2026
learn:
  en: "Property capstone: a small group finds a real development site, tests feasibility and risk, and makes the business case."
  zh: "房地产方向毕业设计课：小组寻找真实开发地块，做可行性和风险分析，提出商业方案。"
  zh-TW: "不動產方向畢業專題：小組尋找真實開發基地，做可行性與風險分析，提出商業方案。"
  ja: "不動産の総仕上げ。少人数で実際の開発用地を探し、採算とリスクを検証し事業案を示す。"
  ko: "부동산 캡스톤. 소그룹이 실제 개발 부지를 찾고 사업성과 위험을 따져 사업안을 만든다."
  vi: "Môn tốt nghiệp bất động sản: nhóm nhỏ tìm khu đất thật, đánh giá khả thi, rủi ro và lập phương án kinh doanh."
  ms: "Kemuncak hartanah: kumpulan kecil cari tapak pembangunan sebenar, uji daya maju dan risiko, dan bina kes perniagaan."
  id: "Capstone properti: kelompok kecil mencari lahan nyata, menguji kelayakan dan risiko, lalu menyusun kasus bisnis."
  hi: "प्रॉपर्टी कैपस्टोन: छोटा समूह असली साइट ढूँढ़ता है, व्यवहार्यता और जोखिम परखता है, बिज़नेस केस बनाता है।"
outcomes:
  - en: "Run a financial feasibility for a development site"
    zh: "为开发地块做财务可行性分析"
    zh-TW: "為開發基地做財務可行性分析"
    ja: "開発用地の事業採算を検討する"
    ko: "개발 부지의 사업 타당성 분석하기"
    vi: "Phân tích khả thi tài chính cho khu đất"
    ms: "Buat kebolehlaksanaan kewangan untuk tapak"
    id: "Menyusun studi kelayakan finansial lahan"
    hi: "विकास साइट की वित्तीय व्यवहार्यता जाँचना"
  - en: "Analyse site, market and planning rules"
    zh: "分析场地、市场和规划规定"
    zh-TW: "分析基地、市場與都市計畫規定"
    ja: "敷地・市場・計画規制を分析する"
    ko: "대지·시장·계획 규정 분석하기"
    vi: "Phân tích khu đất, thị trường, quy định quy hoạch"
    ms: "Analisis tapak, pasaran dan peraturan perancangan"
    id: "Menganalisis tapak, pasar, dan aturan tata ruang"
    hi: "साइट, बाज़ार और योजना नियमों का विश्लेषण"
  - en: "Compare design options and pick a business case"
    zh: "比较设计方案并选出最佳商业方案"
    zh-TW: "比較設計方案並選出最佳商業方案"
    ja: "複数の設計案を比べ事業案を選ぶ"
    ko: "설계안을 비교해 사업안 고르기"
    vi: "So sánh phương án và chọn phương án kinh doanh"
    ms: "Banding pilihan reka bentuk dan pilih kes perniagaan"
    id: "Membandingkan opsi desain dan memilih kasus bisnis"
    hi: "डिज़ाइन विकल्पों की तुलना कर बिज़नेस केस चुनना"
