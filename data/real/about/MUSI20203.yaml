code: MUSI20203
year: 2026
learn:
  en: "Mental skills for performing at your best under pressure, in music, sport, public speaking and work."
  zh: "在音乐、运动、演讲和工作中，如何在压力下发挥最佳水平的心理技能。"
  zh-TW: "在音樂、運動、演講和工作中，如何在壓力下發揮最佳水準的心理技能。"
  ja: "音楽・スポーツ・スピーチ・仕事で、重圧下でも力を出すための心理スキル。"
  ko: "음악·스포츠·발표·업무에서 압박 속에 최고 성과를 내는 심리 기술."
  vi: "Kỹ năng tâm lý để thể hiện tốt nhất dưới áp lực: âm nhạc, thể thao, thuyết trình."
  ms: "Kemahiran mental untuk beraksi terbaik di bawah tekanan: muzik, sukan, ucapan."
  id: "Keterampilan mental untuk tampil terbaik di bawah tekanan: musik, olahraga, pidato."
  hi: "दबाव में सर्वश्रेष्ठ प्रदर्शन के मानसिक कौशल: संगीत, खेल, भाषण और काम।"
outcomes:
  - en: "Explain the main theories of performance psychology"
    zh: "解释表演心理学的主要理论"
    zh-TW: "解釋表演心理學的主要理論"
    ja: "パフォーマンス心理学の主要理論を説明する"
    ko: "수행 심리학의 주요 이론 설명하기"
    vi: "Giải thích các lý thuyết chính của tâm lý biểu diễn"
    ms: "Terangkan teori utama psikologi persembahan"
    id: "Menjelaskan teori utama psikologi performa"
    hi: "प्रदर्शन मनोविज्ञान के मुख्य सिद्धांत समझाना"
  - en: "Spot and manage anxiety and other blockers"
    zh: "识别并应对焦虑等障碍"
    zh-TW: "辨識並應對焦慮等障礙"
    ja: "不安などの妨げに気づき対処する"
    ko: "불안 등 방해 요인을 알아채고 다루기"
    vi: "Nhận ra và xử lý lo âu cùng các trở ngại"
    ms: "Kenal pasti dan urus kebimbangan"
    id: "Mengenali dan mengelola kecemasan"
    hi: "घबराहट और अन्य बाधाएँ पहचानना और संभालना"
  - en: "Use proven strategies in high-pressure moments"
    zh: "在高压时刻运用有效策略"
    zh-TW: "在高壓時刻運用有效策略"
    ja: "重圧の場面で実証済みの方法を使う"
    ko: "압박 상황에서 검증된 전략 쓰기"
    vi: "Dùng chiến lược hiệu quả lúc áp lực cao"
    ms: "Guna strategi terbukti ketika tekanan tinggi"
    id: "Memakai strategi teruji saat tekanan tinggi"
    hi: "ऊँचे दबाव में आज़माई हुई रणनीतियाँ अपनाना"
