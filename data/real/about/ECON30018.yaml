code: ECON30018
year: 2026
learn:
  en: "The economics behind the law: competition and consumer law, property and IP rights, and damages."
  zh: "法律背后的经济学：竞争与消费者法、产权与知识产权、损害赔偿。"
  zh-TW: "法律背後的經濟學：競爭與消費者保護法、財產權與智慧財產權、損害賠償。"
  ja: "法律の背後にある経済学：競争法と消費者保護、財産権と知的財産、損害賠償。"
  ko: "법 뒤의 경제학: 경쟁·소비자법, 재산권과 지식재산권, 손해배상."
  vi: "Kinh tế học đằng sau pháp luật: luật cạnh tranh và bảo vệ người tiêu dùng, quyền tài sản, sở hữu trí tuệ và bồi thường."
  ms: "Ekonomi di sebalik undang-undang: undang-undang persaingan dan pengguna, hak harta dan IP, serta ganti rugi."
  id: "Ekonomi di balik hukum: hukum persaingan dan konsumen, hak milik dan HKI, serta ganti rugi."
  hi: "कानून के पीछे का अर्थशास्त्र: प्रतिस्पर्धा व उपभोक्ता कानून, संपत्ति व बौद्धिक संपदा अधिकार, और हर्जाना।"
outcomes:
  - en: "Pick suitable economic theory for a legal policy issue"
    zh: "为法律政策问题选对经济理论"
    zh-TW: "為法律政策問題選對經濟理論"
    ja: "法的な政策課題に合う経済理論を選ぶ"
    ko: "법·정책 문제에 맞는 경제 이론 고르기"
    vi: "Chọn lý thuyết kinh tế phù hợp cho vấn đề chính sách pháp lý"
    ms: "Pilih teori ekonomi sesuai untuk isu dasar undang-undang"
    id: "Memilih teori ekonomi yang cocok untuk isu kebijakan hukum"
    hi: "किसी कानूनी नीति मुद्दे के लिए सही आर्थिक सिद्धांत चुनना"
  - en: "Set out the costs and benefits of an intervention"
    zh: "列出政策干预的成本和收益"
    zh-TW: "列出政策介入的成本和效益"
    ja: "介入の費用と便益を整理する"
    ko: "개입의 비용과 편익 정리하기"
    vi: "Nêu ra chi phí và lợi ích của một can thiệp"
    ms: "Huraikan kos dan faedah sesuatu campur tangan"
    id: "Memaparkan biaya dan manfaat suatu intervensi"
    hi: "किसी हस्तक्षेप की लागत और फ़ायदे बताना"
  - en: "Suggest other policies that could reach the same goal"
    zh: "提出能达到同一目标的替代政策"
    zh-TW: "提出能達到同一目標的替代政策"
    ja: "同じ目的を達成できる別の政策を示す"
    ko: "같은 목표를 이룰 대안 정책 제시하기"
    vi: "Đề xuất chính sách khác có thể đạt cùng mục tiêu"
    ms: "Cadangkan dasar lain untuk capai matlamat sama"
    id: "Mengusulkan kebijakan lain untuk tujuan yang sama"
    hi: "उसी लक्ष्य के लिए दूसरी नीतियाँ सुझाना"
