code: ECOM20001
year: 2026
learn:
  en: "Regression and other data methods to estimate economic relationships, test theory and forecast."
  zh: "用回归等数据方法估计经济关系、检验理论并进行预测。"
  zh-TW: "用迴歸等資料方法估計經濟關係、檢驗理論並進行預測。"
  ja: "回帰などのデータ手法で経済関係を推定し、理論を検定し、予測する。"
  ko: "회귀 등 데이터 기법으로 경제 관계를 추정하고 이론을 검정하며 예측한다."
  vi: "Hồi quy và các phương pháp dữ liệu để ước lượng quan hệ kinh tế, kiểm định lý thuyết, dự báo."
  ms: "Regresi dan kaedah data untuk menganggar hubungan ekonomi, menguji teori dan meramal."
  id: "Regresi dan metode data untuk mengestimasi hubungan ekonomi, menguji teori dan meramal."
  hi: "आर्थिक संबंधों का अनुमान, सिद्धांत परीक्षण और पूर्वानुमान के लिए रिग्रेशन व अन्य डेटा विधियाँ।"
outcomes:
  - en: "Apply least squares to linear regression"
    zh: "将最小二乘法用于线性回归"
    zh-TW: "將最小平方法用於線性迴歸"
    ja: "線形回帰に最小二乗法を使う"
    ko: "선형회귀에 최소제곱법을 적용한다"
    vi: "Áp dụng bình phương tối thiểu cho hồi quy tuyến tính"
    ms: "Gunakan kuasa dua terkecil pada regresi linear"
    id: "Menerapkan kuadrat terkecil pada regresi linear"
    hi: "रैखिक रिग्रेशन में न्यूनतम वर्ग विधि लागू करें"
  - en: "Estimate models and test hypotheses in software"
    zh: "用软件估计模型并检验假设"
    zh-TW: "用軟體估計模型並檢定假設"
    ja: "ソフトでモデルを推定し仮説を検定する"
    ko: "소프트웨어로 모형을 추정하고 가설을 검정한다"
    vi: "Ước lượng mô hình, kiểm định giả thuyết bằng phần mềm"
    ms: "Anggar model dan uji hipotesis dengan perisian"
    id: "Mengestimasi model dan menguji hipotesis dengan perangkat lunak"
    hi: "सॉफ़्टवेयर से मॉडल का अनुमान और परिकल्पना परीक्षण करें"
  - en: "Diagnose problems like heteroskedasticity"
    zh: "诊断异方差等模型问题"
    zh-TW: "診斷異質變異等模型問題"
    ja: "不均一分散などの問題を診断する"
    ko: "이분산성 등 모형 문제를 진단한다"
    vi: "Chẩn đoán vấn đề như phương sai thay đổi"
    ms: "Kenal pasti masalah seperti heteroskedastisiti"
    id: "Mendiagnosis masalah seperti heteroskedastisitas"
    hi: "विषमविचलनता जैसी समस्याओं की पहचान करें"
