code: CHEN90035
year: 2027
learn:
  en: "Separating, purifying and formulating biological products such as biopharmaceuticals."
  zh: "对生物药等生物产品进行分离、纯化和制剂。"
  zh-TW: "對生物藥等生物產品進行分離、純化與製劑。"
  ja: "バイオ医薬品などの生物製品の分離・精製・製剤化。"
  ko: "바이오의약품 등 생물 제품의 분리, 정제, 제형화."
  vi: "Tách, tinh chế và bào chế sản phẩm sinh học như thuốc sinh học."
  ms: "Memisah, menulen dan memformulasi produk biologi seperti biofarmaseutikal."
  id: "Memisahkan, memurnikan, dan memformulasi produk biologis seperti biofarmasi."
  hi: "बायोफ़ार्मास्युटिकल जैसे जैविक उत्पादों का पृथक्करण, शुद्धिकरण और फ़ॉर्मूलेशन।"
outcomes:
  - en: "Choose separation and purification steps for a product"
    zh: "为产品选择分离和纯化步骤"
    zh-TW: "為產品選擇分離與純化步驟"
    ja: "製品に合った分離・精製の工程を選ぶ"
    ko: "제품에 맞는 분리·정제 단계 고르기"
    vi: "Chọn các bước tách và tinh chế cho sản phẩm"
    ms: "Memilih langkah pemisahan dan penulenan untuk produk"
    id: "Memilih langkah pemisahan dan pemurnian untuk produk"
    hi: "किसी उत्पाद के लिए पृथक्करण और शुद्धिकरण चरण चुनना"
  - en: "Use computer models to design downstream unit operations"
    zh: "用计算模型设计下游单元操作"
    zh-TW: "用計算模型設計下游單元操作"
    ja: "計算モデルで下流工程の単位操作を設計する"
    ko: "계산 모델로 다운스트림 단위 조작 설계하기"
    vi: "Dùng mô hình máy tính để thiết kế quá trình hạ nguồn"
    ms: "Menggunakan model komputer untuk mereka operasi unit hiliran"
    id: "Memakai model komputer untuk merancang operasi hilir"
    hi: "कंप्यूटर मॉडल से डाउनस्ट्रीम यूनिट ऑपरेशन डिज़ाइन करना"
