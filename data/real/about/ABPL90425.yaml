code: ABPL90425
year: 2027
learn:
  en: "Informal settlement in cities of the global South: theory, practice and ways professionals help upgrade them."
  zh: "全球南方城市中的非正规聚落：理论、实践以及专业人士如何参与改善。"
  zh-TW: "全球南方城市中的非正規聚落：理論、實務以及專業人士如何參與改善。"
  ja: "グローバルサウスの都市のインフォーマル居住地：理論、実践、専門家による改善。"
  ko: "글로벌 남반구 도시의 비공식 정착지: 이론, 실천, 전문가의 개선 참여."
  vi: "Khu định cư phi chính thức ở các đô thị phương Nam: lý thuyết, thực tiễn và cách cải tạo."
  ms: "Penempatan tidak formal di bandar Selatan global: teori, amalan dan cara menaik tarafnya."
  id: "Permukiman informal di kota-kota Selatan global: teori, praktik, dan cara memperbaikinya."
  hi: "ग्लोबल साउथ के शहरों में अनौपचारिक बस्तियाँ: सिद्धांत, व्यवहार और उन्हें सुधारने में पेशेवरों की भूमिका।"
outcomes:
  - en: "Think critically about informal settlement"
    zh: "批判性地思考非正规聚落"
    zh-TW: "批判性地思考非正規聚落"
    ja: "インフォーマル居住地を批判的に考える"
    ko: "비공식 정착지를 비판적으로 사고하기"
    vi: "Suy nghĩ phản biện về định cư phi chính thức"
    ms: "Berfikir kritis tentang penempatan tidak formal"
    id: "Berpikir kritis tentang permukiman informal"
    hi: "अनौपचारिक बस्तियों पर आलोचनात्मक सोच"
  - en: "Write case studies on real settlements"
    zh: "撰写真实聚落的案例研究"
    zh-TW: "撰寫真實聚落的案例研究"
    ja: "実在の居住地の事例研究を書く"
    ko: "실제 정착지 사례 연구 쓰기"
    vi: "Viết nghiên cứu tình huống về khu định cư thật"
    ms: "Menulis kajian kes penempatan sebenar"
    id: "Menulis studi kasus permukiman nyata"
    hi: "असली बस्तियों पर केस स्टडी लिखना"
