code: MGMT20004
year: 2026
learn:
  en: "How organisations hire, reward and manage people, and how to manage work relationships with others."
  zh: "组织如何招聘、激励和管理员工，以及如何经营工作中的人际关系。"
  zh-TW: "組織如何招募、獎酬和管理員工，以及如何經營工作上的人際關係。"
  ja: "組織の採用・報酬・人材管理と、仕事上の人間関係の築き方。"
  ko: "조직의 채용, 보상, 인사 관리와 업무상 관계 관리 방법."
  vi: "Tổ chức tuyển dụng, đãi ngộ và quản lý con người ra sao, và cách quản lý quan hệ công việc."
  ms: "Cara organisasi ambil pekerja, beri ganjaran dan urus orang, serta cara urus hubungan kerja."
  id: "Cara organisasi merekrut, memberi imbalan, dan mengelola orang, serta cara mengelola hubungan kerja."
  hi: "संगठन लोगों को कैसे भर्ती करते, इनाम देते और संभालते हैं, और काम के रिश्ते कैसे सँभालें।"
outcomes:
  - en: "Explain how firms recruit, develop and reward staff"
    zh: "解释企业如何招聘、培养和奖励员工"
    zh-TW: "解釋企業如何招募、培育和獎勵員工"
    ja: "企業の採用・育成・報酬の仕組みを説明する"
    ko: "기업의 채용·육성·보상 방식 설명"
    vi: "Giải thích cách công ty tuyển, phát triển và thưởng nhân viên"
    ms: "Terangkan cara firma ambil, bangunkan dan beri ganjaran pekerja"
    id: "Menjelaskan cara perusahaan merekrut, mengembangkan, dan memberi imbalan"
    hi: "कंपनियाँ कर्मचारियों को कैसे भर्ती, विकसित और पुरस्कृत करती हैं"
  - en: "Analyse relationships with clients, suppliers and partners"
    zh: "分析与客户、供应商和伙伴的关系"
    zh-TW: "分析與客戶、供應商和夥伴的關係"
    ja: "顧客・取引先・パートナーとの関係を分析する"
    ko: "고객, 공급업체, 파트너와의 관계 분석"
    vi: "Phân tích quan hệ với khách hàng, nhà cung cấp và đối tác"
    ms: "Analisis hubungan dengan pelanggan, pembekal dan rakan"
    id: "Menganalisis hubungan dengan klien, pemasok, dan mitra"
    hi: "ग्राहकों, सप्लायरों और पार्टनरों से रिश्तों का विश्लेषण"
  - en: "Apply research to people management cases"
    zh: "把研究用于人员管理案例"
    zh-TW: "把研究用於人員管理個案"
    ja: "研究を人材管理のケースに当てはめる"
    ko: "연구를 인사 관리 사례에 적용"
    vi: "Áp dụng nghiên cứu vào tình huống quản lý con người"
    ms: "Guna kajian pada kes pengurusan manusia"
    id: "Menerapkan riset pada kasus manajemen orang"
    hi: "रिसर्च को लोगों के प्रबंधन वाले केस पर लगाना"
