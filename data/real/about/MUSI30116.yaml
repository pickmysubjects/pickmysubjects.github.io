code: MUSI30116
year: 2026
learn:
  en: "How 18th- and 19th-century music was played, using old sources, and putting it into your own playing."
  zh: "依据史料研究18、19世纪音乐的演奏方式并用于演奏。"
  zh-TW: "依據史料研究18、19世紀音樂的演奏方式並用於演奏。"
  ja: "18〜19世紀の演奏法を史料から学び、自分の演奏に生かす。"
  ko: "18~19세기 음악 연주법을 사료로 배우고 자기 연주에 적용."
  vi: "Tìm hiểu cách chơi nhạc thế kỷ 18–19 từ tư liệu cổ và áp dụng vào biểu diễn."
  ms: "Cara muzik abad ke-18 dan 19 dimainkan, dari sumber lama, dan guna dalam persembahan."
  id: "Cara musik abad 18–19 dimainkan dari sumber lama, lalu diterapkan saat tampil."
  hi: "पुराने स्रोतों से 18वीं-19वीं सदी के संगीत की वादन शैली सीखकर अपने वादन में लाना।"
outcomes:
  - en: "Weigh debates on historically informed playing"
    zh: "评析历史演奏法的争论"
    zh-TW: "評析歷史演奏法的爭論"
    ja: "歴史的演奏をめぐる議論を評価する"
    ko: "역사적 연주에 대한 논쟁 평가하기"
    vi: "Đánh giá tranh luận về lối chơi lịch sử"
    ms: "Nilai perdebatan tentang persembahan sejarah"
    id: "Menilai perdebatan pertunjukan historis"
    hi: "ऐतिहासिक वादन पर बहस का आकलन"
  - en: "Use primary sources as evidence of style"
    zh: "以一手史料作为风格依据"
    zh-TW: "以一手史料作為風格依據"
    ja: "一次史料を様式の根拠に使う"
    ko: "1차 사료를 양식의 근거로 쓰기"
    vi: "Dùng tư liệu gốc làm bằng chứng phong cách"
    ms: "Guna sumber primer sebagai bukti gaya"
    id: "Memakai sumber primer sebagai bukti gaya"
    hi: "प्राथमिक स्रोतों को शैली के प्रमाण बनाना"
  - en: "Bring research into your own performance"
    zh: "把研究成果用于自己的演奏"
    zh-TW: "把研究成果用於自己的演奏"
    ja: "研究を自分の演奏に生かす"
    ko: "연구를 자신의 연주에 반영하기"
    vi: "Đưa nghiên cứu vào phần biểu diễn"
    ms: "Bawa hasil kajian ke dalam persembahan"
    id: "Membawa riset ke dalam penampilan"
    hi: "शोध को अपने प्रदर्शन में उतारना"
