code: CHIN30030
year: 2026
learn:
  en: "How civil society and NGOs in China deal with issues like gender, labour, LGBT rights and the environment."
  zh: "中国的公民社会和非政府组织如何应对性别、劳工、LGBT和环境等问题。"
  zh-TW: "中國的公民社會和非政府組織如何應對性別、勞工、LGBT和環境等問題。"
  ja: "中国の市民社会とNGOが、ジェンダー・労働・LGBT・環境などの問題にどう取り組むかを学ぶ。"
  ko: "중국의 시민사회와 NGO가 젠더, 노동, LGBT, 환경 같은 문제에 어떻게 대응하는지 배운다."
  vi: "Xã hội dân sự và các tổ chức phi chính phủ ở Trung Quốc xử lý vấn đề giới, lao động, LGBT và môi trường ra sao."
  ms: "Cara masyarakat sivil dan NGO di China menangani isu seperti gender, buruh, hak LGBT dan alam sekitar."
  id: "Cara masyarakat sipil dan LSM di Tiongkok menangani isu seperti gender, buruh, hak LGBT, dan lingkungan."
  hi: "चीन में नागरिक समाज और NGO जेंडर, श्रम, LGBT अधिकार और पर्यावरण जैसे मुद्दों से कैसे निपटते हैं।"
outcomes:
  - en: "Explain how civil society works in China"
    zh: "解释公民社会在中国如何运作"
    zh-TW: "解釋公民社會在中國如何運作"
    ja: "中国で市民社会がどう機能するか説明する"
    ko: "중국에서 시민사회가 작동하는 방식 설명하기"
    vi: "Giải thích xã hội dân sự vận hành ở Trung Quốc ra sao"
    ms: "Terangkan cara masyarakat sivil berfungsi di China"
    id: "Menjelaskan cara masyarakat sipil bekerja di Tiongkok"
    hi: "चीन में नागरिक समाज कैसे काम करता है, समझाना"
  - en: "Analyse social problems activists take on"
    zh: "分析社会运动者应对的社会问题"
    zh-TW: "分析社會運動者應對的社會問題"
    ja: "活動家が取り組む社会問題を分析する"
    ko: "활동가들이 다루는 사회 문제 분석하기"
    vi: "Phân tích các vấn đề xã hội mà nhà hoạt động theo đuổi"
    ms: "Analisis masalah sosial yang ditangani aktivis"
    id: "Menganalisis masalah sosial yang digarap aktivis"
    hi: "कार्यकर्ता जिन सामाजिक समस्याओं को उठाते हैं, उनका विश्लेषण करना"
  - en: "Assess how the state responds to activism"
    zh: "评估国家如何回应社会运动"
    zh-TW: "評估國家如何回應社會運動"
    ja: "国家が活動にどう対応するか評価する"
    ko: "국가가 시민 활동에 대응하는 방식 평가하기"
    vi: "Đánh giá cách nhà nước phản ứng với hoạt động xã hội"
    ms: "Nilai cara negara bertindak balas terhadap aktivisme"
    id: "Menilai cara negara menanggapi aktivisme"
    hi: "राज्य सक्रियता पर कैसे प्रतिक्रिया देता है, आकलन करना"
