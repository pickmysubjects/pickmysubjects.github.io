code: ANCW20028
year: 2026
learn:
  en: "A practical summer intensive on interpreting ancient artefacts like pottery, metal, glass and coins from the Mediterranean."
  zh: "实践型夏季密集课：解读地中海出土的陶器、金属、玻璃和钱币等古代文物。"
  zh-TW: "實作型夏季密集課：解讀地中海出土的陶器、金屬、玻璃和錢幣等古代文物。"
  ja: "地中海の土器・金属・ガラス・貨幣などの古代遺物を読み解く、実践的な夏の集中科目。"
  ko: "지중해의 도기, 금속, 유리, 주화 같은 고대 유물을 해석하는 실습형 여름 집중 과목."
  vi: "Môn học tập trung mùa hè thực hành giải mã hiện vật cổ Địa Trung Hải như gốm, kim loại, thủy tinh và tiền xu."
  ms: "Kursus intensif musim panas yang praktikal tentang mentafsir artifak kuno Mediterranean seperti tembikar, logam, kaca dan syiling."
  id: "Kuliah intensif musim panas yang praktis tentang menafsirkan artefak kuno Mediterania seperti tembikar, logam, kaca, dan koin."
  hi: "भूमध्यसागर की प्राचीन वस्तुओं जैसे मिट्टी के बर्तन, धातु, काँच और सिक्कों की व्याख्या पर व्यावहारिक समर इंटेंसिव।"
outcomes:
  - en: "Identify common types of ancient artefacts"
    zh: "辨认常见的古代文物类型"
    zh-TW: "辨認常見的古代文物類型"
    ja: "よくある古代遺物の種類を見分ける"
    ko: "흔한 고대 유물 유형 식별하기"
    vi: "Nhận diện các loại hiện vật cổ thường gặp"
    ms: "Kenal pasti jenis artifak kuno yang biasa"
    id: "Mengenali jenis artefak kuno yang umum"
    hi: "आम प्राचीन वस्तुओं के प्रकार पहचानना"
  - en: "Use artefacts to date and interpret sites"
    zh: "利用文物为遗址断代和解读"
    zh-TW: "利用文物為遺址斷代和解讀"
    ja: "遺物から遺跡の年代と性格を読み解く"
    ko: "유물로 유적의 연대와 성격 해석하기"
    vi: "Dùng hiện vật để xác định niên đại và giải thích di chỉ"
    ms: "Gunakan artifak untuk mentarikh dan mentafsir tapak"
    id: "Memakai artefak untuk menanggali dan menafsirkan situs"
    hi: "वस्तुओं से स्थलों का काल निर्धारण और व्याख्या करना"
  - en: "Explain what objects reveal about trade and food"
    zh: "解释文物揭示的贸易与饮食信息"
    zh-TW: "解釋文物揭示的貿易與飲食資訊"
    ja: "遺物から交易と食生活について説明する"
    ko: "유물이 보여주는 교역과 음식 문화 설명하기"
    vi: "Giải thích hiện vật cho biết gì về thương mại và ăn uống"
    ms: "Terangkan apa yang artifak dedahkan tentang dagang dan makanan"
    id: "Menjelaskan apa yang diungkap benda soal dagang dan makanan"
    hi: "वस्तुएँ व्यापार और भोजन के बारे में क्या बताती हैं, समझाना"
