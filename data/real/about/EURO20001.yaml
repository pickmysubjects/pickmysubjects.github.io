code: EURO20001
year: 2026
learn:
  en: "Language and society in Europe: minority languages, dialects, multilingualism, language policy, politeness and the rise of English."
  zh: "欧洲的语言与社会：少数语言、方言、多语现象、语言政策、礼貌用语，以及英语地位的上升。"
  zh-TW: "歐洲的語言與社會：少數語言、方言、多語現象、語言政策、禮貌用語，以及英語地位的上升。"
  ja: "ヨーロッパの言語と社会。少数言語、方言、多言語使用、言語政策、敬語表現、そして英語の台頭。"
  ko: "유럽의 언어와 사회. 소수 언어, 방언, 다언어 사용, 언어 정책, 공손 표현, 영어의 부상."
  vi: "Ngôn ngữ và xã hội ở châu Âu: ngôn ngữ thiểu số, phương ngữ, đa ngữ, chính sách ngôn ngữ, phép lịch sự và vai trò tiếng Anh."
  ms: "Bahasa dan masyarakat di Eropah: bahasa minoriti, dialek, multilingualisme, dasar bahasa, kesantunan dan kebangkitan bahasa Inggeris."
  id: "Bahasa dan masyarakat di Eropa: bahasa minoritas, dialek, multibahasa, kebijakan bahasa, kesantunan dan naiknya bahasa Inggris."
  hi: "यूरोप में भाषा और समाज: अल्पसंख्यक भाषाएँ, बोलियाँ, बहुभाषिकता, भाषा नीति, शिष्टता और अंग्रेज़ी का उदय।"
outcomes:
  - en: "Explain how languages in contact affect each other"
    zh: "说明语言接触如何相互影响"
    zh-TW: "說明語言接觸如何相互影響"
    ja: "言語同士の接触が互いに与える影響を説明する"
    ko: "언어 접촉이 서로에게 주는 영향 설명하기"
    vi: "Giải thích các ngôn ngữ tiếp xúc ảnh hưởng nhau ra sao"
    ms: "Terangkan cara bahasa yang bertembung saling mempengaruhi"
    id: "Menjelaskan cara bahasa yang bersentuhan saling memengaruhi"
    hi: "संपर्क में आई भाषाएँ एक-दूसरे पर कैसे असर डालती हैं, समझाना"
  - en: "Compare language policies across Europe"
    zh: "比较欧洲各地的语言政策"
    zh-TW: "比較歐洲各地的語言政策"
    ja: "ヨーロッパ各地の言語政策を比べる"
    ko: "유럽 각지의 언어 정책 비교하기"
    vi: "So sánh chính sách ngôn ngữ khắp châu Âu"
    ms: "Bandingkan dasar bahasa di seluruh Eropah"
    id: "Membandingkan kebijakan bahasa di Eropa"
    hi: "यूरोप भर की भाषा नीतियों की तुलना करना"
  - en: "Assess the role of English as a shared language"
    zh: "评估英语作为通用语的作用"
    zh-TW: "評估英語作為通用語的作用"
    ja: "共通語としての英語の役割を評価する"
    ko: "공용어로서 영어의 역할 평가하기"
    vi: "Đánh giá vai trò tiếng Anh như ngôn ngữ chung"
    ms: "Nilai peranan bahasa Inggeris sebagai bahasa perantara"
    id: "Menilai peran bahasa Inggris sebagai bahasa bersama"
    hi: "साझा भाषा के रूप में अंग्रेज़ी की भूमिका आँकना"
