code: COMP90056
year: 2027
learn:
  en: "Processing huge, fast-moving data streams in real time without storing everything first."
  zh: "实时处理海量高速数据流，无需先全部存储。"
  zh-TW: "即時處理海量高速資料串流，無須先全部儲存。"
  ja: "大量で高速なデータストリームを、全部保存せずリアルタイム処理する。"
  ko: "대량·고속 데이터 스트림을 다 저장하지 않고 실시간 처리."
  vi: "Xử lý luồng dữ liệu lớn, nhanh theo thời gian thực mà không cần lưu hết."
  ms: "Memproses aliran data besar dan pantas secara masa nyata tanpa simpan semuanya."
  id: "Memproses aliran data besar dan cepat secara real time tanpa menyimpan semuanya."
  hi: "बड़ी, तेज़ डेटा स्ट्रीम को सब स्टोर किए बिना रियल टाइम में प्रोसेस करना।"
outcomes:
  - en: "Explain algorithms that summarise data streams"
    zh: "解释概括数据流的算法"
    zh-TW: "解釋摘要資料串流的演算法"
    ja: "データストリームを要約するアルゴリズムを説明する"
    ko: "데이터 스트림 요약 알고리즘 설명하기"
    vi: "Giải thích thuật toán tóm tắt luồng dữ liệu"
    ms: "Terangkan algoritma meringkaskan aliran data"
    id: "Menjelaskan algoritma peringkas aliran data"
    hi: "डेटा स्ट्रीम सारांशित करने वाले एल्गोरिद्म समझाना"
  - en: "Build a real-time stream processing application"
    zh: "开发实时流处理应用"
    zh-TW: "開發即時串流處理應用"
    ja: "リアルタイム処理アプリを作る"
    ko: "실시간 스트림 처리 앱 만들기"
    vi: "Xây ứng dụng xử lý luồng thời gian thực"
    ms: "Bina aplikasi pemprosesan aliran masa nyata"
    id: "Membuat aplikasi pemrosesan aliran real time"
    hi: "रियल-टाइम स्ट्रीम प्रोसेसिंग ऐप बनाना"
