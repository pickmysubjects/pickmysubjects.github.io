code: MUSI10069
year: 2026
learn:
  en: "Build ensemble skills in an auditioned string group by learning and performing key works of the string repertoire."
  zh: "通过试音加入弦乐合奏，学习并演出弦乐重要曲目，培养合奏能力。"
  zh-TW: "通過試音加入弦樂合奏，學習並演出弦樂重要曲目，培養合奏能力。"
  ja: "オーディション制の弦楽アンサンブルで主要な弦楽曲を学び演奏し、合奏力を磨く。"
  ko: "오디션을 거친 현악 앙상블에서 주요 현악곡을 배우고 연주하며 합주 능력을 기름."
  vi: "Rèn kỹ năng hòa tấu trong nhóm đàn dây qua thử giọng, học và biểu diễn tác phẩm dây quan trọng."
  ms: "Bina kemahiran ensembel dalam kumpulan tali melalui uji bakat dengan karya repertoir tali utama."
  id: "Membangun keterampilan ensambel dalam grup gesek lewat audisi dengan karya penting repertoar gesek."
  hi: "ऑडिशन वाले स्ट्रिंग समूह में प्रमुख रचनाएँ सीखकर और बजाकर समूह कौशल बढ़ाना।"
outcomes:
  - en: "Prepare your part for group rehearsals"
    zh: "为合排准备好自己的声部"
    zh-TW: "為合排準備好自己的聲部"
    ja: "合同練習に向けて自分のパートを準備する"
    ko: "합주를 위해 자기 파트 준비하기"
    vi: "Chuẩn bị phần của mình cho buổi tập"
    ms: "Sediakan bahagian sendiri untuk latihan"
    id: "Menyiapkan bagian sendiri untuk latihan"
    hi: "समूह रिहर्सल के लिए अपना भाग तैयार करना"
  - en: "Perform repertoire to concert standard"
    zh: "以音乐会水准演出曲目"
    zh-TW: "以音樂會水準演出曲目"
    ja: "演奏会レベルで曲を演奏する"
    ko: "연주회 수준으로 곡 연주하기"
    vi: "Biểu diễn tác phẩm ở chuẩn hòa nhạc"
    ms: "Persembahkan karya pada tahap konsert"
    id: "Membawakan repertoar setara konser"
    hi: "कॉन्सर्ट स्तर पर रचनाएँ प्रस्तुत करना"
  - en: "Know a range of ensemble repertoire"
    zh: "熟悉多种合奏曲目"
    zh-TW: "熟悉多種合奏曲目"
    ja: "さまざまなアンサンブル曲を知る"
    ko: "다양한 앙상블 레퍼토리 알기"
    vi: "Hiểu nhiều tác phẩm hòa tấu"
    ms: "Kenali pelbagai repertoir ensembel"
    id: "Mengenal beragam repertoar ensambel"
    hi: "विभिन्न समूह रचनाओं की जानकारी"
