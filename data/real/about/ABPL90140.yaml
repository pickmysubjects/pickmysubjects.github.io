code: ABPL90140
year: 2027
learn:
  en: "How architects run projects: client agreements, procurement, contracts, risk, business and professional ethics."
  zh: "建筑师如何执行项目：客户协议、采购、合同、风险、经营和职业道德。"
  zh-TW: "建築師如何執行專案：客戶協議、採購、合約、風險、經營和職業倫理。"
  ja: "建築家の実務：契約締結、調達、契約管理、リスク、経営、職業倫理。"
  ko: "건축가의 프로젝트 수행: 고객 계약, 조달, 계약 관리, 리스크, 경영, 직업윤리."
  vi: "Cách kiến trúc sư điều hành dự án: hợp đồng khách hàng, mua sắm, hợp đồng, rủi ro, kinh doanh và đạo đức nghề."
  ms: "Cara arkitek mengurus projek: perjanjian pelanggan, perolehan, kontrak, risiko, perniagaan dan etika profesional."
  id: "Cara arsitek menjalankan proyek: perjanjian klien, pengadaan, kontrak, risiko, bisnis, dan etika profesi."
  hi: "आर्किटेक्ट परियोजनाएँ कैसे चलाते हैं: क्लाइंट समझौते, खरीद, अनुबंध, जोखिम, व्यवसाय और पेशेवर नैतिकता।"
outcomes:
  - en: "Compare procurement methods and contracts"
    zh: "比较不同采购方式和合同关系"
    zh-TW: "比較不同採購方式和合約關係"
    ja: "調達方式と契約関係を比較する"
    ko: "조달 방식과 계약 관계 비교하기"
    vi: "So sánh phương thức mua sắm và hợp đồng"
    ms: "Membandingkan kaedah perolehan dan kontrak"
    id: "Membandingkan metode pengadaan dan kontrak"
    hi: "खरीद विधियों और अनुबंधों की तुलना"
  - en: "Apply an architect's legal and ethical duties"
    zh: "运用建筑师的法律与职业责任"
    zh-TW: "運用建築師的法律與職業責任"
    ja: "建築家の法的・倫理的責任を適用する"
    ko: "건축가의 법적·윤리적 책임 적용하기"
    vi: "Áp dụng trách nhiệm pháp lý và đạo đức của kiến trúc sư"
    ms: "Menggunakan tanggungjawab undang-undang dan etika arkitek"
    id: "Menerapkan kewajiban hukum dan etika arsitek"
    hi: "आर्किटेक्ट के कानूनी और नैतिक दायित्व लागू करना"
