code: BMEN30011
year: 2026
learn:
  en: "How a medical device idea gets to the clinic: market needs, regulation and commercialisation, with an industry mentor."
  zh: "医疗器械如何从创意走向临床：市场需求、监管与商业化，有业界导师指导。"
  zh-TW: "醫療器材如何從構想走向臨床：市場需求、法規與商業化，有業界導師指導。"
  ja: "医療機器のアイデアを臨床へ：市場ニーズ、規制、事業化を業界メンターと学ぶ。"
  ko: "의료기기 아이디어가 임상에 이르는 길: 시장 수요, 규제, 상업화, 업계 멘토."
  vi: "Ý tưởng thiết bị y tế đến bệnh viện thế nào: nhu cầu thị trường, quy định, thương mại hóa, có mentor ngành."
  ms: "Cara idea peranti perubatan sampai ke klinik: keperluan pasaran, peraturan, pengkomersialan, dengan mentor industri."
  id: "Jalan ide alat medis ke klinik: kebutuhan pasar, regulasi, komersialisasi, dengan mentor industri."
  hi: "मेडिकल डिवाइस आइडिया क्लिनिक तक कैसे पहुँचता है: बाज़ार ज़रूरत, नियम, व्यावसायीकरण, इंडस्ट्री मेंटर के साथ।"
outcomes:
  - en: "Find clinical needs through interviews"
    zh: "通过访谈找出临床需求"
    zh-TW: "透過訪談找出臨床需求"
    ja: "インタビューで臨床ニーズを探る"
    ko: "인터뷰로 임상 수요 찾기"
    vi: "Tìm nhu cầu lâm sàng qua phỏng vấn"
    ms: "Cari keperluan klinikal melalui temu bual"
    id: "Menggali kebutuhan klinis lewat wawancara"
    hi: "इंटरव्यू से क्लिनिकल ज़रूरतें पहचानें"
  - en: "Explain the MedTech commercialisation path"
    zh: "解释医疗科技的商业化路径"
    zh-TW: "解釋醫療科技的商業化路徑"
    ja: "MedTechの事業化の流れを説明する"
    ko: "MedTech 상업화 경로 설명하기"
    vi: "Giải thích lộ trình thương mại hóa MedTech"
    ms: "Terangkan laluan pengkomersialan MedTech"
    id: "Menjelaskan jalur komersialisasi MedTech"
    hi: "MedTech व्यावसायीकरण का रास्ता समझाएँ"
  - en: "Create a translation strategy for a device"
    zh: "为医疗器械制定转化策略"
    zh-TW: "為醫療器材制定轉化策略"
    ja: "機器の実用化戦略を作る"
    ko: "기기의 실용화 전략 수립하기"
    vi: "Xây chiến lược chuyển giao cho thiết bị"
    ms: "Bina strategi terjemahan untuk peranti"
    id: "Menyusun strategi translasi alat medis"
    hi: "डिवाइस के लिए ट्रांसलेशन रणनीति बनाएँ"
