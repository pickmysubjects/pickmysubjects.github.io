code: MAST10022
year: 2026
learn:
  en: "Same topics as Linear Algebra, but deeper, with more focus on proofs."
  zh: "内容同线性代数，但更深入，更重证明。"
  zh-TW: "內容同線性代數，但更深入，更重證明。"
  ja: "線形代数と同じ内容をより深く、証明を重視して学ぶ。"
  ko: "선형대수와 같은 주제를 더 깊이, 증명에 더 집중한다."
  vi: "Cùng chủ đề với Đại số tuyến tính nhưng sâu hơn, chú trọng chứng minh."
  ms: "Topik sama seperti Aljabar Linear, tetapi lebih mendalam, lebih fokus pada pembuktian."
  id: "Topik sama dengan Aljabar Linear, tapi lebih dalam, lebih fokus pada pembuktian."
  hi: "लीनियर अलजेब्रा जैसे ही विषय, पर ज़्यादा गहराई से, प्रमाणों पर ज़्यादा ध्यान।"
outcomes:
  - en: "Solve linear equation systems with matrices"
    zh: "用矩阵解线性方程组"
    zh-TW: "用矩陣解線性方程組"
    ja: "行列で連立一次方程式を解く"
    ko: "행렬로 연립일차방정식 풀기"
    vi: "Giải hệ phương trình tuyến tính bằng ma trận"
    ms: "Selesaikan sistem persamaan linear dengan matriks"
    id: "Menyelesaikan sistem persamaan linear dengan matriks"
    hi: "मैट्रिक्स से रैखिक समीकरण निकाय हल करना"
  - en: "Prove results about vector spaces"
    zh: "证明向量空间的相关结论"
    zh-TW: "證明向量空間的相關結論"
    ja: "ベクトル空間に関する結果を証明する"
    ko: "벡터 공간에 관한 결과 증명"
    vi: "Chứng minh các kết quả về không gian vectơ"
    ms: "Buktikan hasil tentang ruang vektor"
    id: "Membuktikan hasil tentang ruang vektor"
    hi: "वेक्टर स्पेस से जुड़े परिणाम सिद्ध करना"
  - en: "Use software for maths calculations"
    zh: "用软件做数学计算"
    zh-TW: "用軟體做數學計算"
    ja: "ソフトウェアで数学の計算をする"
    ko: "소프트웨어로 수학 계산"
    vi: "Dùng phần mềm để tính toán"
    ms: "Guna perisian untuk pengiraan matematik"
    id: "Memakai software untuk perhitungan matematika"
    hi: "गणित की गणना के लिए सॉफ़्टवेयर इस्तेमाल करना"
