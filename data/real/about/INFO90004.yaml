code: INFO90004
year: 2026
learn:
  en: "How to measure and evaluate user experience with technology, using lab testing, interviews, logs and other methods."
  zh: "如何衡量和评估人们使用技术的体验：实验室测试、访谈、日志等方法。"
  zh-TW: "如何衡量和評估人們使用科技的體驗：實驗室測試、訪談、日誌等方法。"
  ja: "テクノロジーのユーザー体験を測り評価する方法：ラボテスト、インタビュー、ログなど。"
  ko: "기술 사용자 경험을 측정·평가하는 방법: 실험실 테스트, 인터뷰, 로그 등."
  vi: "Cách đo và đánh giá trải nghiệm người dùng với công nghệ: thử nghiệm phòng lab, phỏng vấn, nhật ký sử dụng và nhiều cách khác."
  ms: "Cara mengukur dan menilai pengalaman pengguna teknologi: ujian makmal, temu bual, log dan kaedah lain."
  id: "Cara mengukur dan menilai pengalaman pengguna teknologi: uji lab, wawancara, log, dan metode lain."
  hi: "टेक्नोलॉजी के यूज़र एक्सपीरियंस को मापना और परखना: लैब टेस्टिंग, इंटरव्यू, लॉग और दूसरे तरीके।"
outcomes:
  - en: "Choose a fitting evaluation method and justify it"
    zh: "选择合适的评估方法并说明理由"
    zh-TW: "選擇合適的評估方法並說明理由"
    ja: "適した評価手法を選び、その理由を示す"
    ko: "적절한 평가 방법을 고르고 근거 제시하기"
    vi: "Chọn phương pháp đánh giá phù hợp và lý giải"
    ms: "Pilih kaedah penilaian yang sesuai dan wajarkannya"
    id: "Memilih metode evaluasi yang tepat dan alasannya"
    hi: "सही मूल्यांकन तरीका चुनना और उसका कारण बताना"
  - en: "Run usability tests with real users"
    zh: "和真实用户一起做可用性测试"
    zh-TW: "和真實使用者一起做易用性測試"
    ja: "実際のユーザーとユーザビリティテストを行う"
    ko: "실제 사용자와 사용성 테스트 진행하기"
    vi: "Thực hiện kiểm thử khả dụng với người dùng thật"
    ms: "Jalankan ujian kebolehgunaan dengan pengguna sebenar"
    id: "Menjalankan uji usability dengan pengguna nyata"
    hi: "असली यूज़र्स के साथ यूज़ेबिलिटी टेस्ट करना"
  - en: "Turn evaluation data into design advice"
    zh: "把评估数据转化为设计建议"
    zh-TW: "把評估資料轉化為設計建議"
    ja: "評価データを設計上の提案にまとめる"
    ko: "평가 데이터를 디자인 제안으로 바꾸기"
    vi: "Biến dữ liệu đánh giá thành gợi ý thiết kế"
    ms: "Jadikan data penilaian cadangan reka bentuk"
    id: "Mengubah data evaluasi jadi saran desain"
    hi: "मूल्यांकन डेटा को डिज़ाइन सुझावों में बदलना"
