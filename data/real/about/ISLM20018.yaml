code: ISLM20018
year: 2027
learn:
  en: "How Muslims today live, debate and reshape Islam under modern conditions, from politics and law to gender, climate and AI."
  zh: "当代穆斯林如何在现代条件下实践、争论和重塑伊斯兰，涵盖政治、法律、性别、气候和AI。"
  zh-TW: "當代穆斯林如何在現代條件下實踐、爭論和重塑伊斯蘭，涵蓋政治、法律、性別、氣候和AI。"
  ja: "現代のムスリムがイスラームをどう生き、議論し、捉え直しているか。政治・法・ジェンダー・気候・AIまで。"
  ko: "오늘날 무슬림이 현대 조건 속에서 이슬람을 어떻게 살고 논쟁하고 재해석하는지: 정치, 법, 젠더, 기후, AI까지."
  vi: "Người Hồi giáo ngày nay sống, tranh luận và định hình lại Hồi giáo thế nào trong bối cảnh hiện đại, từ chính trị, luật đến giới, khí hậu và AI."
  ms: "Bagaimana umat Islam hari ini menghayati, membahaskan dan membentuk semula Islam dalam keadaan moden, dari politik dan undang-undang hingga gender, iklim dan AI."
  id: "Bagaimana Muslim masa kini menjalani, memperdebatkan, dan membentuk ulang Islam dalam kondisi modern, dari politik dan hukum hingga gender, iklim, dan AI."
  hi: "आज के मुसलमान आधुनिक परिस्थितियों में इस्लाम को कैसे जीते, उस पर बहस करते और उसे नए रूप देते हैं: राजनीति, कानून, जेंडर, जलवायु और AI तक।"
outcomes:
  - en: "Explain how modern life shapes Islamic authority and practice"
    zh: "说明现代条件如何影响伊斯兰的权威与实践"
    zh-TW: "說明現代條件如何影響伊斯蘭的權威與實踐"
    ja: "現代の状況がイスラームの権威や実践に与える影響を説明する"
    ko: "현대 조건이 이슬람의 권위와 실천에 주는 영향 설명하기"
    vi: "Giải thích đời sống hiện đại định hình thẩm quyền và thực hành Hồi giáo ra sao"
    ms: "Terangkan cara kehidupan moden membentuk autoriti dan amalan Islam"
    id: "Menjelaskan cara kehidupan modern membentuk otoritas dan praktik Islam"
    hi: "समझाना कि आधुनिक जीवन इस्लामी अधिकार और आचरण को कैसे आकार देता है"
  - en: "Build arguments on how Muslims engage with modern issues"
    zh: "就穆斯林如何面对现代议题展开论证"
    zh-TW: "就穆斯林如何面對現代議題展開論證"
    ja: "ムスリムと現代的課題の関わりについて論を組み立てる"
    ko: "무슬림이 현대 쟁점과 어떻게 마주하는지 논증하기"
    vi: "Lập luận về cách người Hồi giáo đối diện các vấn đề hiện đại"
    ms: "Bina hujah tentang cara umat Islam menangani isu moden"
    id: "Menyusun argumen tentang cara Muslim menghadapi isu modern"
    hi: "मुसलमान आधुनिक मुद्दों से कैसे जुड़ते हैं, इस पर तर्क गढ़ना"
