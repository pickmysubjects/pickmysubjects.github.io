code: CVEN90048
year: 2027
learn:
  en: "Traffic flow theory, signal timing and travel demand models for more efficient, sustainable city transport."
  zh: "交通流理论、信号配时和出行需求模型，让城市交通更高效、更可持续。"
  zh-TW: "交通流理論、號誌時制與旅運需求模型，讓都市交通更有效率、更永續。"
  ja: "交通流理論・信号制御・交通需要モデルで都市交通をより効率的・持続的に。"
  ko: "교통류 이론, 신호 시간 설계, 통행 수요 모델로 도시 교통을 더 효율적이고 지속가능하게."
  vi: "Lý thuyết dòng giao thông, điều khiển đèn tín hiệu và mô hình nhu cầu đi lại cho giao thông đô thị hiệu quả, bền vững."
  ms: "Teori aliran trafik, pemasaan isyarat dan model permintaan perjalanan untuk pengangkutan bandar yang lebih cekap dan lestari."
  id: "Teori arus lalu lintas, pengaturan sinyal dan model permintaan perjalanan untuk transportasi kota yang efisien dan berkelanjutan."
  hi: "ट्रैफ़िक प्रवाह सिद्धांत, सिग्नल टाइमिंग और यात्रा मांग मॉडल, ताकि शहरी परिवहन अधिक कुशल और टिकाऊ बने।"
outcomes:
  - en: "Simulate road traffic and optimise signal timing with software"
    zh: "用软件模拟道路交通并优化信号配时"
    zh-TW: "以軟體模擬道路交通並最佳化號誌時制"
    ja: "ソフトで道路交通を模擬し信号時間を最適化する"
    ko: "소프트웨어로 도로 교통을 모의하고 신호 시간 최적화하기"
    vi: "Mô phỏng giao thông và tối ưu đèn tín hiệu bằng phần mềm"
    ms: "Mensimulasikan trafik jalan dan mengoptimumkan pemasaan isyarat dengan perisian"
    id: "Mensimulasikan lalu lintas dan mengoptimalkan waktu sinyal dengan perangkat lunak"
    hi: "सॉफ़्टवेयर से सड़क यातायात का सिमुलेशन और सिग्नल टाइमिंग का अनुकूलन"
  - en: "Build travel demand and mode choice models with real data"
    zh: "用真实数据建立出行需求和方式选择模型"
    zh-TW: "以真實資料建立旅運需求與運具選擇模型"
    ja: "実データで交通需要・手段選択モデルを作る"
    ko: "실제 데이터로 통행 수요와 수단 선택 모델 만들기"
    vi: "Xây dựng mô hình nhu cầu đi lại và lựa chọn phương tiện bằng dữ liệu thực"
    ms: "Membina model permintaan perjalanan dan pilihan mod dengan data sebenar"
    id: "Membangun model permintaan perjalanan dan pilihan moda dengan data nyata"
    hi: "असली डेटा से यात्रा मांग और साधन-चयन मॉडल बनाना"
  - en: "Evaluate transport projects on sustainability, access and safety"
    zh: "从可持续性、可达性和安全性评估交通项目"
    zh-TW: "從永續性、可及性與安全性評估交通計畫"
    ja: "交通事業を持続可能性・アクセス・安全性で評価する"
    ko: "교통 사업을 지속가능성·접근성·안전성으로 평가하기"
    vi: "Đánh giá dự án giao thông về bền vững, khả năng tiếp cận và an toàn"
    ms: "Menilai projek pengangkutan dari segi kelestarian, akses dan keselamatan"
    id: "Menilai proyek transportasi dari sisi keberlanjutan, aksesibilitas dan keselamatan"
    hi: "परिवहन परियोजनाओं का स्थिरता, पहुँच और सुरक्षा के आधार पर मूल्यांकन"
