code: MUST30019
year: 2026
learn:
  en: "Music theatre training in an international setting: group dance, a solo masterclass and a concert performance, then a reflection."
  zh: "在国际环境中进行音乐剧训练：群舞、独演大师班和音乐会演出，最后写反思。"
  zh-TW: "在國際環境中進行音樂劇訓練：群舞、獨演大師班與音樂會演出，最後寫反思。"
  ja: "国際的な環境でのミュージカル訓練。群舞、ソロのマスタークラス、コンサート、振り返り。"
  ko: "국제 환경의 뮤지컬 훈련. 군무, 솔로 마스터클래스, 콘서트 공연, 성찰."
  vi: "Đào tạo nhạc kịch ở môi trường quốc tế: múa nhóm, lớp solo, hòa nhạc và suy ngẫm."
  ms: "Latihan teater muzikal antarabangsa: tarian kumpulan, kelas solo, konsert dan refleksi."
  id: "Pelatihan teater musikal internasional: tari kelompok, kelas solo, konser, refleksi."
  hi: "अंतरराष्ट्रीय माहौल में म्यूज़िक थिएटर: समूह नृत्य, सोलो मास्टरक्लास, कॉन्सर्ट और चिंतन।"
outcomes:
  - en: "Adapt to international performance styles"
    zh: "适应国际表演风格"
    zh-TW: "適應國際表演風格"
    ja: "海外の表現スタイルに適応する"
    ko: "국제 공연 스타일에 적응하기"
    vi: "Thích nghi phong cách diễn quốc tế"
    ms: "Sesuaikan diri dengan gaya antarabangsa"
    id: "Beradaptasi dengan gaya internasional"
    hi: "अंतरराष्ट्रीय प्रदर्शन शैलियों के अनुसार ढलना"
  - en: "Perform in group and solo work"
    zh: "参与群体和独演表演"
    zh-TW: "參與群體與獨演表演"
    ja: "群舞とソロで演じる"
    ko: "그룹·솔로로 공연하기"
    vi: "Biểu diễn nhóm và đơn"
    ms: "Persembahan kumpulan dan solo"
    id: "Tampil dalam kelompok dan solo"
    hi: "समूह और सोलो प्रस्तुति"
  - en: "Write a reflective report"
    zh: "写一份反思报告"
    zh-TW: "寫一份反思報告"
    ja: "振り返りのレポートを書く"
    ko: "성찰 보고서 쓰기"
    vi: "Viết báo cáo suy ngẫm"
    ms: "Tulis laporan refleksi"
    id: "Menulis laporan refleksi"
    hi: "चिंतनशील रिपोर्ट लिखना"
