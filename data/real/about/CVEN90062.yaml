code: CVEN90062
year: 2027
learn:
  en: "Using BIM to model buildings in 3D and add time and cost for design, construction and maintenance."
  zh: "用 BIM 建立建筑三维模型，并加入时间和成本信息用于设计、施工和运维。"
  zh-TW: "用 BIM 建立建築 3D 模型，並加入時間與成本資訊用於設計、施工與維護。"
  ja: "BIMで建物を3Dモデル化し、時間とコストの情報を加えて設計・施工・維持管理に使う。"
  ko: "BIM으로 건물을 3D 모델링하고 시간·비용 정보를 더해 설계·시공·유지관리에 활용."
  vi: "Dùng BIM để dựng mô hình 3D công trình và thêm thời gian, chi phí cho thiết kế, thi công và bảo trì."
  ms: "Menggunakan BIM untuk memodelkan bangunan dalam 3D serta menambah masa dan kos untuk reka bentuk, pembinaan dan penyelenggaraan."
  id: "Memakai BIM untuk memodelkan bangunan secara 3D serta menambahkan waktu dan biaya untuk desain, konstruksi dan pemeliharaan."
  hi: "BIM से इमारतों का 3D मॉडल बनाना और डिज़ाइन, निर्माण व रखरखाव के लिए समय और लागत जोड़ना।"
outcomes:
  - en: "Explain what BIM does in architecture, engineering and construction"
    zh: "说明 BIM 在建筑、工程和施工行业中的作用"
    zh-TW: "說明 BIM 在建築、工程與營建產業中的作用"
    ja: "建築・エンジニアリング・建設業でのBIMの役割を説明する"
    ko: "건축·엔지니어링·건설 분야에서 BIM의 역할 설명하기"
    vi: "Giải thích vai trò của BIM trong kiến trúc, kỹ thuật và xây dựng"
    ms: "Menerangkan fungsi BIM dalam seni bina, kejuruteraan dan pembinaan"
    id: "Menjelaskan fungsi BIM di arsitektur, teknik dan konstruksi"
    hi: "वास्तुकला, इंजीनियरिंग और निर्माण में BIM की भूमिका समझाना"
  - en: "Design infrastructure and plan its construction with BIM"
    zh: "用 BIM 设计基础设施并规划施工与维护"
    zh-TW: "以 BIM 設計基礎設施並規劃施工與維護"
    ja: "BIMでインフラを設計し施工と維持管理を計画する"
    ko: "BIM으로 인프라를 설계하고 시공·유지관리 계획하기"
    vi: "Thiết kế hạ tầng và lập kế hoạch thi công, bảo trì bằng BIM"
    ms: "Mereka bentuk infrastruktur dan merancang pembinaannya dengan BIM"
    id: "Merancang infrastruktur dan merencanakan konstruksinya dengan BIM"
    hi: "BIM से अवसंरचना डिज़ाइन करना और उसके निर्माण की योजना बनाना"
