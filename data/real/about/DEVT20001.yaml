code: DEVT20001
year: 2026
learn:
  en: "The main theories of development, how countries have pursued it in practice, and the key development issues of this century."
  zh: "主要的发展理论、各国的实践方式，以及本世纪的关键发展议题。"
  zh-TW: "主要的發展理論、各國的實踐方式，以及本世紀的關鍵發展議題。"
  ja: "開発の主な理論、各国の実践、そして今世紀の主要な開発課題を学ぶ。"
  ko: "주요 개발 이론, 각국의 실천 방식, 이번 세기의 핵심 개발 쟁점을 배운다."
  vi: "Các lý thuyết phát triển chính, cách các nước thực hiện và các vấn đề phát triển then chốt của thế kỷ này."
  ms: "Teori pembangunan utama, cara negara melaksanakannya, dan isu pembangunan utama abad ini."
  id: "Teori pembangunan utama, cara negara-negara menjalankannya, dan isu pembangunan kunci abad ini."
  hi: "विकास के मुख्य सिद्धांत, देशों ने इसे व्यवहार में कैसे अपनाया, और इस सदी के मुख्य विकास मुद्दे।"
outcomes:
  - en: "Compare major theories of development"
    zh: "比较主要的发展理论"
    zh-TW: "比較主要的發展理論"
    ja: "主な開発理論を比べる"
    ko: "주요 개발 이론 비교하기"
    vi: "So sánh các lý thuyết phát triển lớn"
    ms: "Bandingkan teori pembangunan utama"
    id: "Membandingkan teori pembangunan utama"
    hi: "विकास के प्रमुख सिद्धांतों की तुलना करना"
  - en: "Analyse development paths in Asia and the Pacific"
    zh: "分析亚太地区的发展道路"
    zh-TW: "分析亞太地區的發展道路"
    ja: "アジア太平洋の開発の道筋を分析する"
    ko: "아시아·태평양의 발전 경로 분석하기"
    vi: "Phân tích con đường phát triển ở châu Á - Thái Bình Dương"
    ms: "Analisis laluan pembangunan di Asia dan Pasifik"
    id: "Menganalisis jalur pembangunan di Asia dan Pasifik"
    hi: "एशिया और प्रशांत में विकास के रास्तों का विश्लेषण करना"
  - en: "Discuss key development issues today"
    zh: "讨论当今关键的发展议题"
    zh-TW: "討論當今關鍵的發展議題"
    ja: "今日の主要な開発課題を論じる"
    ko: "오늘날 핵심 개발 쟁점 논의하기"
    vi: "Thảo luận các vấn đề phát triển then chốt hiện nay"
    ms: "Bincangkan isu pembangunan utama hari ini"
    id: "Membahas isu pembangunan utama saat ini"
    hi: "आज के मुख्य विकास मुद्दों पर चर्चा करना"
