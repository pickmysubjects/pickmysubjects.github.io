code: MUSI30030
year: 2026
learn:
  en: "Spanish music from medieval times to flamenco, film and pop, and what it says about identity and exoticism. Online."
  zh: "从中世纪到弗拉门戈、电影和流行的西班牙音乐，及其身份与异国情调问题。网课。"
  zh-TW: "從中世紀到佛朗明哥、電影和流行的西班牙音樂，及其身分與異國情調問題。線上。"
  ja: "中世からフラメンコ・映画・ポップまでのスペイン音楽と、アイデンティティや異国趣味。オンライン。"
  ko: "중세부터 플라멩코·영화·팝까지 스페인 음악과 정체성·이국성 문제. 온라인."
  vi: "Âm nhạc Tây Ban Nha từ trung cổ tới flamenco, phim, pop và vấn đề bản sắc. Online."
  ms: "Muzik Sepanyol dari zaman pertengahan hingga flamenco dan pop, serta isu identiti. Dalam talian."
  id: "Musik Spanyol dari abad pertengahan hingga flamenco dan pop, serta soal identitas. Daring."
  hi: "मध्ययुग से फ़्लैमेंको, फ़िल्म और पॉप तक स्पेनी संगीत, पहचान और विदेशीपन के सवाल। ऑनलाइन।"
outcomes:
  - en: "Recognise major Spanish musical styles by ear"
    zh: "凭听觉辨认主要的西班牙音乐风格"
    zh-TW: "憑聽覺辨認主要的西班牙音樂風格"
    ja: "主なスペイン音楽の様式を聴き分ける"
    ko: "주요 스페인 음악 양식을 귀로 알아보기"
    vi: "Nhận ra các phong cách nhạc Tây Ban Nha qua tai"
    ms: "Kenal gaya muzik Sepanyol utama melalui dengaran"
    id: "Mengenali gaya musik Spanyol utama lewat pendengaran"
    hi: "प्रमुख स्पेनी संगीत शैलियाँ सुनकर पहचानना"
  - en: "Link the music to identity and nationalism"
    zh: "把音乐与身份认同、民族主义联系起来"
    zh-TW: "把音樂與身分認同、民族主義聯繫起來"
    ja: "音楽をアイデンティティや民族主義と結びつける"
    ko: "음악을 정체성·민족주의와 연결하기"
    vi: "Liên hệ âm nhạc với bản sắc và chủ nghĩa dân tộc"
    ms: "Kaitkan muzik dengan identiti dan nasionalisme"
    id: "Mengaitkan musik dengan identitas dan nasionalisme"
    hi: "संगीत को पहचान और राष्ट्रवाद से जोड़ना"
  - en: "Research and write an essay on a chosen topic"
    zh: "就选定主题研究并写论文"
    zh-TW: "就選定主題研究並寫論文"
    ja: "選んだテーマを調べて論文を書く"
    ko: "선택한 주제로 조사하고 에세이 쓰기"
    vi: "Nghiên cứu và viết tiểu luận theo chủ đề chọn"
    ms: "Kaji dan tulis esei tentang topik pilihan"
    id: "Meriset dan menulis esai topik pilihan"
    hi: "चुने विषय पर शोध कर निबंध लिखना"
