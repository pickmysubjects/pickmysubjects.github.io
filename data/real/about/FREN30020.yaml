code: FREN30020
year: 2026
learn:
  en: "French and Francophone theatre from Molière to today: reading and performing scenes, and writing your own short scenes in French."
  zh: "从莫里哀到当代的法语戏剧：阅读和表演选段，并用法语创作自己的短剧场景。"
  zh-TW: "從莫里哀到當代的法語戲劇：閱讀和表演選段，並用法語創作自己的短劇場景。"
  ja: "モリエールから現代までのフランス語圏の演劇。場面を読み演じ、フランス語で短い場面を自作する。"
  ko: "몰리에르부터 오늘날까지 프랑스어권 연극. 장면을 읽고 연기하며 프랑스어로 짧은 장면을 직접 쓴다."
  vi: "Kịch Pháp và Pháp ngữ từ Molière đến nay: đọc, diễn các cảnh và tự viết cảnh ngắn bằng tiếng Pháp."
  ms: "Teater Perancis dan Francophone dari Molière hingga kini: membaca dan melakonkan babak, serta menulis babak pendek dalam bahasa Perancis."
  id: "Teater Prancis dan Frankofon dari Molière hingga kini: membaca dan memerankan adegan, serta menulis adegan pendek dalam bahasa Prancis."
  hi: "मोलियर से आज तक फ़्रेंच और फ़्रैंकोफ़ोन रंगमंच: दृश्य पढ़ना-खेलना, और फ़्रेंच में अपने छोटे दृश्य लिखना।"
outcomes:
  - en: "Analyse French plays from different centuries"
    zh: "分析不同世纪的法语剧作"
    zh-TW: "分析不同世紀的法語劇作"
    ja: "さまざまな時代のフランス語戯曲を分析する"
    ko: "여러 시대의 프랑스어 희곡 분석하기"
    vi: "Phân tích kịch Pháp qua các thế kỷ"
    ms: "Analisis drama Perancis dari pelbagai abad"
    id: "Menganalisis lakon Prancis dari berbagai abad"
    hi: "अलग-अलग सदियों के फ़्रेंच नाटकों का विश्लेषण करना"
  - en: "Perform passages from plays in French"
    zh: "用法语表演剧本选段"
    zh-TW: "用法語表演劇本選段"
    ja: "戯曲の一節をフランス語で演じる"
    ko: "희곡 일부를 프랑스어로 연기하기"
    vi: "Diễn các đoạn kịch bằng tiếng Pháp"
    ms: "Lakonkan petikan drama dalam bahasa Perancis"
    id: "Memerankan cuplikan lakon dalam bahasa Prancis"
    hi: "नाटकों के अंश फ़्रेंच में प्रस्तुत करना"
  - en: "Write a short theatre scene in French"
    zh: "用法语写一段短剧场景"
    zh-TW: "用法語寫一段短劇場景"
    ja: "フランス語で短い場面を書く"
    ko: "프랑스어로 짧은 연극 장면 쓰기"
    vi: "Viết một cảnh kịch ngắn bằng tiếng Pháp"
    ms: "Tulis babak teater pendek dalam bahasa Perancis"
    id: "Menulis adegan teater pendek dalam bahasa Prancis"
    hi: "फ़्रेंच में एक छोटा नाटकीय दृश्य लिखना"
