code: CREA10001
year: 2026
learn:
  en: "How artists and scientists look at big medical issues like cancer, death and the brain, ending with your own artwork."
  zh: "艺术家和科学家如何看待癌症、死亡、大脑等医学议题，最后创作自己的作品。"
  zh-TW: "藝術家與科學家如何看待癌症、死亡、大腦等醫學議題，最後創作自己的作品。"
  ja: "がん・死・脳などの医学的テーマを芸術家と科学者がどう見るかを学び、最後に自作の作品を作る。"
  ko: "예술가와 과학자가 암, 죽음, 뇌 같은 의학 문제를 어떻게 보는지 배우고 직접 작품을 만듦."
  vi: "Nghệ sĩ và nhà khoa học nhìn các vấn đề y sinh như ung thư, cái chết, não bộ ra sao; cuối kỳ tự làm tác phẩm."
  ms: "Cara artis dan saintis melihat isu perubatan seperti kanser, kematian dan otak, diakhiri karya seni sendiri."
  id: "Cara seniman dan ilmuwan memandang isu medis seperti kanker, kematian dan otak, diakhiri karya seni sendiri."
  hi: "कलाकार और वैज्ञानिक कैंसर, मृत्यु और मस्तिष्क जैसे चिकित्सा मुद्दों को कैसे देखते हैं, अंत में अपनी कलाकृति।"
outcomes:
  - en: "Link creative expression with scientific inquiry"
    zh: "把创意表达和科学探究联系起来"
    zh-TW: "把創意表達和科學探究連結起來"
    ja: "創造的表現と科学的探究を結びつける"
    ko: "창의적 표현과 과학 탐구를 연결하기"
    vi: "Kết nối sáng tạo nghệ thuật với nghiên cứu khoa học"
    ms: "Kaitkan ekspresi kreatif dengan inkuiri sains"
    id: "Menghubungkan ekspresi kreatif dengan penelitian ilmiah"
    hi: "रचनात्मक अभिव्यक्ति को वैज्ञानिक खोज से जोड़ना"
  - en: "Explain how artworks speak about medical issues"
    zh: "解释艺术作品如何表达医学议题"
    zh-TW: "解釋藝術作品如何表達醫學議題"
    ja: "作品が医学的テーマをどう伝えるか説明する"
    ko: "예술 작품이 의학 문제를 어떻게 전하는지 설명하기"
    vi: "Giải thích tác phẩm nghệ thuật nói về vấn đề y học ra sao"
    ms: "Terangkan cara karya seni menyampaikan isu perubatan"
    id: "Menjelaskan cara karya seni menyampaikan isu medis"
    hi: "समझाना कि कलाकृतियाँ चिकित्सा मुद्दों को कैसे दिखाती हैं"
  - en: "Make an original artwork about a biomedical issue"
    zh: "围绕一个生物医学议题创作原创作品"
    zh-TW: "圍繞一個生物醫學議題創作原創作品"
    ja: "生物医学のテーマで自分の作品を作る"
    ko: "생명의학 주제로 독창적인 작품 만들기"
    vi: "Sáng tác một tác phẩm về một vấn đề y sinh"
    ms: "Hasilkan karya seni asli tentang isu bioperubatan"
    id: "Membuat karya seni orisinal tentang isu biomedis"
    hi: "किसी जैव-चिकित्सा मुद्दे पर मौलिक कलाकृति बनाना"
