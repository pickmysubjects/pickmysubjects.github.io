code: ABPL30064
year: 2026
learn:
  en: "A study tour in India on Laurie Baker's low-cost, climate-responsive and inclusive ways to design and build."
  zh: "赴印度的游学实习，学习Laurie Baker低成本、顺应气候、包容的设计与建造方法。"
  zh-TW: "赴印度的遊學實習，學習Laurie Baker低成本、順應氣候、包容的設計與營造方法。"
  ja: "インドでの研修旅行。Laurie Bakerの低コストで気候に合った包摂的な設計・施工を学ぶ。"
  ko: "인도 연수 여행. Laurie Baker의 저비용·기후 대응·포용적 설계와 시공을 배운다."
  vi: "Chuyến học tập ở Ấn Độ về cách thiết kế, xây dựng giá rẻ, hợp khí hậu của Laurie Baker."
  ms: "Lawatan sambil belajar di India tentang cara reka dan bina kos rendah ala Laurie Baker."
  id: "Studi tur di India tentang cara desain dan bangun murah, tanggap iklim ala Laurie Baker."
  hi: "भारत में स्टडी टूर: लॉरी बेकर के कम लागत, जलवायु के अनुकूल और समावेशी निर्माण तरीक़े।"
outcomes:
  - en: "Explain low-cost, climate-responsive building methods"
    zh: "说明低成本、顺应气候的建造方法"
    zh-TW: "說明低成本、順應氣候的營造方法"
    ja: "低コストで気候に合った工法を説明する"
    ko: "저비용·기후 대응 건축 방식 설명하기"
    vi: "Giải thích cách xây giá rẻ, hợp khí hậu"
    ms: "Jelaskan kaedah binaan kos rendah dan mesra iklim"
    id: "Menjelaskan metode bangun murah dan tanggap iklim"
    hi: "कम लागत, जलवायु-अनुकूल निर्माण तरीक़े समझाना"
  - en: "Learn hands-on from local communities and builders"
    zh: "向当地社区和工匠实地学习"
    zh-TW: "向當地社區和工匠實地學習"
    ja: "地域の人々や職人から実地で学ぶ"
    ko: "현지 주민과 시공자에게 직접 배우기"
    vi: "Học thực tế từ cộng đồng và thợ địa phương"
    ms: "Belajar secara langsung daripada komuniti setempat"
    id: "Belajar langsung dari komunitas dan tukang lokal"
    hi: "स्थानीय समुदाय व कारीगरों से सीधे सीखना"
  - en: "Reflect on design's role in social change"
    zh: "反思设计在社会变革中的作用"
    zh-TW: "反思設計在社會變革中的角色"
    ja: "社会の変化における設計の役割を考える"
    ko: "사회 변화에서 디자인의 역할 성찰하기"
    vi: "Suy ngẫm vai trò của thiết kế với thay đổi xã hội"
    ms: "Renungkan peranan reka bentuk dalam perubahan sosial"
    id: "Merenungkan peran desain dalam perubahan sosial"
    hi: "सामाजिक बदलाव में डिज़ाइन की भूमिका पर सोचना"
