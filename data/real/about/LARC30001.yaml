code: LARC30001
year: 2026
learn:
  en: "Landscape in three dimensions: shaping landform through grading and earthworks, and how to build and draw it."
  zh: "三维视角看景观：通过场地竖向和土方塑造地形，以及如何施工和表达。"
  zh-TW: "以三維看景觀：透過整地與土方塑造地形，以及如何施工和表現。"
  ja: "立体としてのランドスケープ。造成と土工で地形をつくり、その施工と表現を学ぶ。"
  ko: "입체로서의 조경. 정지와 토공으로 지형을 만들고 시공·표현 방법을 배운다."
  vi: "Cảnh quan ba chiều: tạo địa hình bằng san nền, đào đắp, cùng cách thi công và thể hiện."
  ms: "Landskap tiga dimensi: membentuk muka bumi melalui perataan dan kerja tanah, serta cara membina dan melukisnya."
  id: "Lanskap tiga dimensi: membentuk muka tanah lewat grading dan galian-timbunan, serta cara membangun dan menggambarnya."
  hi: "त्रि-आयामी लैंडस्केप: ग्रेडिंग और मिट्टी के काम से भू-आकृति गढ़ना, और उसे बनाना व दिखाना।"
outcomes:
  - en: "Design site grading and landform"
    zh: "设计场地竖向和地形"
    zh-TW: "設計基地整地與地形"
    ja: "敷地の造成と地形を設計する"
    ko: "대지 정지와 지형 설계하기"
    vi: "Thiết kế san nền và địa hình"
    ms: "Reka perataan tapak dan bentuk muka bumi"
    id: "Merancang grading dan bentuk muka tanah"
    hi: "साइट ग्रेडिंग और भू-आकृति डिज़ाइन करना"
  - en: "Weigh how landform affects use and experience"
    zh: "分析地形对使用和体验的影响"
    zh-TW: "分析地形對使用與體驗的影響"
    ja: "地形が使い方と体験に与える影響を考える"
    ko: "지형이 이용과 경험에 주는 영향 따져 보기"
    vi: "Cân nhắc địa hình ảnh hưởng công năng và trải nghiệm"
    ms: "Nilai kesan muka bumi pada guna dan pengalaman"
    id: "Menimbang pengaruh bentuk tanah pada pengalaman"
    hi: "भू-आकृति का उपयोग और अनुभव पर असर समझना"
  - en: "Model and show terrain with digital tools"
    zh: "用数字工具建模并表现地形"
    zh-TW: "用數位工具建模並表現地形"
    ja: "デジタルツールで地形をモデル化し表現する"
    ko: "디지털 도구로 지형 모델링·표현하기"
    vi: "Dựng và thể hiện địa hình bằng công cụ số"
    ms: "Model dan papar rupa bumi dengan alat digital"
    id: "Memodelkan dan menampilkan terrain secara digital"
    hi: "डिजिटल टूल से भू-भाग का मॉडल बनाना"
