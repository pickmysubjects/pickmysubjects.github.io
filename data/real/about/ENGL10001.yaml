code: ENGL10001
year: 2026
learn:
  en: "Modern and contemporary writing from Britain, Ireland, North America and Australia, and how newer texts echo older ones."
  zh: "英国、爱尔兰、北美和澳大利亚的现当代文学，以及新作如何呼应前人作品。"
  zh-TW: "英國、愛爾蘭、北美和澳洲的現當代文學，以及新作如何呼應前人作品。"
  ja: "英国・アイルランド・北米・豪州の近現代文学と、新しい作品が古い作品をどう受け継ぐかを学ぶ。"
  ko: "영국·아일랜드·북미·호주의 현대 문학과, 새 작품이 앞선 작품을 어떻게 잇는지 배운다."
  vi: "Văn học hiện đại và đương đại từ Anh, Ireland, Bắc Mỹ và Úc, và cách tác phẩm mới vọng lại tác phẩm cũ."
  ms: "Penulisan moden dan kontemporari dari Britain, Ireland, Amerika Utara dan Australia, serta cara teks baharu menggemakan teks lama."
  id: "Karya modern dan kontemporer dari Inggris, Irlandia, Amerika Utara dan Australia, serta cara teks baru menggemakan teks lama."
  hi: "ब्रिटेन, आयरलैंड, उत्तरी अमेरिका और ऑस्ट्रेलिया का आधुनिक और समकालीन लेखन, और नए पाठ पुराने पाठों को कैसे दोहराते हैं।"
outcomes:
  - en: "Explain what literary modernism is"
    zh: "说明什么是文学现代主义"
    zh-TW: "說明什麼是文學現代主義"
    ja: "文学のモダニズムとは何かを説明する"
    ko: "문학적 모더니즘이 무엇인지 설명하기"
    vi: "Giải thích chủ nghĩa hiện đại trong văn học là gì"
    ms: "Terangkan apa itu modenisme sastera"
    id: "Menjelaskan apa itu modernisme sastra"
    hi: "साहित्यिक आधुनिकतावाद क्या है, समझाना"
  - en: "Trace links between older and newer texts"
    zh: "梳理新旧作品之间的联系"
    zh-TW: "梳理新舊作品之間的聯繫"
    ja: "新旧の作品のつながりをたどる"
    ko: "옛 작품과 새 작품의 연결 짚어 보기"
    vi: "Lần theo mối liên hệ giữa văn bản cũ và mới"
    ms: "Jejaki kaitan antara teks lama dan baharu"
    id: "Menelusuri kaitan antara teks lama dan baru"
    hi: "पुराने और नए पाठों के बीच संबंध खोजना"
  - en: "Write close readings of fiction, poetry and drama"
    zh: "对小说、诗歌和戏剧进行细读写作"
    zh-TW: "對小說、詩歌和戲劇進行細讀寫作"
    ja: "小説・詩・戯曲の精読を書く"
    ko: "소설·시·희곡을 꼼꼼히 읽고 글쓰기"
    vi: "Viết bài đọc kỹ về tiểu thuyết, thơ và kịch"
    ms: "Tulis bacaan rapi tentang fiksyen, puisi dan drama"
    id: "Menulis pembacaan cermat atas fiksi, puisi dan drama"
    hi: "कथा, कविता और नाटक की बारीक पढ़त लिखना"
