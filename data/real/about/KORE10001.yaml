code: KORE10001
year: 2026
learn:
  en: "Korean for complete beginners: basic speaking, listening, reading and writing for everyday situations."
  zh: "零基础韩语：日常场景下的基本听说读写。"
  zh-TW: "零基礎韓語：日常場景下的基本聽說讀寫。"
  ja: "まったくの初心者向けの韓国語。日常場面での基本的な聞く・話す・読む・書く。"
  ko: "완전 초보자를 위한 한국어. 일상 상황에서의 기본 듣기·말하기·읽기·쓰기."
  vi: "tiếng Hàn cho người mới hoàn toàn: nghe, nói, đọc, viết cơ bản trong tình huống hằng ngày."
  ms: "bahasa Korea untuk pemula sepenuhnya: asas bertutur, mendengar, membaca dan menulis untuk situasi harian."
  id: "bahasa Korea untuk pemula total: dasar berbicara, mendengar, membaca dan menulis untuk situasi sehari-hari."
  hi: "बिल्कुल शुरुआती छात्रों के लिए कोरियाई: रोज़मर्रा की स्थितियों में बोलना, सुनना, पढ़ना और लिखना।"
outcomes:
  - en: "Hold simple everyday conversations in Korean"
    zh: "用韩语进行简单的日常对话"
    zh-TW: "用韓語進行簡單的日常對話"
    ja: "韓国語で簡単な日常会話をする"
    ko: "한국어로 간단한 일상 대화하기"
    vi: "Trò chuyện đơn giản hằng ngày bằng tiếng Hàn"
    ms: "Berbual ringkas harian dalam bahasa Korea"
    id: "Bercakap sederhana sehari-hari dalam bahasa Korea"
    hi: "कोरियाई में सरल रोज़मर्रा की बातचीत करना"
  - en: "Read and write basic Korean words and sentences"
    zh: "读写基础韩语词句"
    zh-TW: "讀寫基礎韓語詞句"
    ja: "韓国語の基本的な語や文を読み書きする"
    ko: "기초 한국어 단어와 문장 읽고 쓰기"
    vi: "Đọc và viết từ, câu tiếng Hàn cơ bản"
    ms: "Baca dan tulis perkataan serta ayat asas bahasa Korea"
    id: "Membaca dan menulis kata serta kalimat dasar bahasa Korea"
    hi: "कोरियाई के बुनियादी शब्द और वाक्य पढ़ना-लिखना"
  - en: "Understand everyday customs where Korean is spoken"
    zh: "了解使用韩语地区的日常习俗"
    zh-TW: "了解使用韓語地區的日常習俗"
    ja: "韓国語が話される地域の日常の習慣を知る"
    ko: "한국어 사용 지역의 일상 관습 이해하기"
    vi: "Hiểu phong tục hằng ngày nơi nói tiếng Hàn"
    ms: "Fahami adat harian di tempat bahasa Korea dituturkan"
    id: "Memahami kebiasaan sehari-hari di tempat bahasa Korea dipakai"
    hi: "कोरियाई बोलने वाली जगहों के रोज़मर्रा के रीति-रिवाज समझना"
