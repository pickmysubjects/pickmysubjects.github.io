code: BMEN90036
year: 2027
learn:
  en: "Fluid mechanics for body fluids and medical devices, from pipe flow to microfluidics."
  zh: "面向体液和医疗器械的流体力学，从管流到微流控。"
  zh-TW: "針對體液與醫療器材的流體力學，從管流到微流體。"
  ja: "体液と医療機器のための流体力学。管内流からマイクロ流体まで。"
  ko: "체액과 의료기기를 위한 유체역학, 관 유동부터 미세유체까지."
  vi: "Cơ học chất lưu cho dịch cơ thể và thiết bị y tế, từ dòng chảy trong ống đến vi lưu."
  ms: "Mekanik bendalir untuk cecair badan dan peranti perubatan, daripada aliran paip hingga mikrobendalir."
  id: "Mekanika fluida untuk cairan tubuh dan alat medis, dari aliran pipa hingga mikrofluida."
  hi: "शरीर के द्रवों और मेडिकल उपकरणों के लिए द्रव यांत्रिकी, पाइप फ़्लो से माइक्रोफ़्लुइडिक्स तक।"
outcomes:
  - en: "Use Navier-Stokes equations to find velocity profiles"
    zh: "用纳维-斯托克斯方程求速度分布"
    zh-TW: "用納維-斯托克斯方程求速度分布"
    ja: "ナビエ-ストークス方程式で速度分布を求める"
    ko: "나비에-스토크스 방정식으로 속도 분포 구하기"
    vi: "Dùng phương trình Navier-Stokes để tìm phân bố vận tốc"
    ms: "Menggunakan persamaan Navier-Stokes untuk profil halaju"
    id: "Memakai persamaan Navier-Stokes untuk profil kecepatan"
    hi: "नेवियर-स्टोक्स समीकरणों से वेग प्रोफ़ाइल निकालना"
  - en: "Solve energy balances for pipe flow, pumps and mixers"
    zh: "求解管流、泵和搅拌器的能量平衡"
    zh-TW: "求解管流、泵與攪拌器的能量平衡"
    ja: "管内流・ポンプ・ミキサーのエネルギー収支を解く"
    ko: "관 유동, 펌프, 혼합기의 에너지 수지 풀기"
    vi: "Giải cân bằng năng lượng cho ống, bơm và máy trộn"
    ms: "Menyelesaikan imbangan tenaga untuk paip, pam dan pengadun"
    id: "Menyelesaikan neraca energi untuk pipa, pompa, dan mixer"
    hi: "पाइप फ़्लो, पंप और मिक्सर के ऊर्जा संतुलन हल करना"
  - en: "Use basic programming to solve fluid problems"
    zh: "用基础编程求解流体问题"
    zh-TW: "用基礎程式設計求解流體問題"
    ja: "簡単なプログラミングで流体の問題を解く"
    ko: "기초 프로그래밍으로 유체 문제 풀기"
    vi: "Dùng lập trình cơ bản để giải bài toán chất lưu"
    ms: "Menggunakan pengaturcaraan asas untuk masalah bendalir"
    id: "Memakai pemrograman dasar untuk soal fluida"
    hi: "बुनियादी प्रोग्रामिंग से द्रव समस्याएँ हल करना"
