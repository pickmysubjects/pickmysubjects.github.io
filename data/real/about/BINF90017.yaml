code: BINF90017
year: 2027
learn:
  en: "Statistical analysis of gene expression and other omics data in R: normalising, differential expression, gene sets."
  zh: "用R分析基因表达等组学数据：标准化、差异表达和基因集检验。"
  zh-TW: "用R分析基因表現等體學資料：標準化、差異表現與基因集檢定。"
  ja: "Rで遺伝子発現などのオミクスデータを解析：正規化、発現差、遺伝子セット検定。"
  ko: "R로 유전자 발현 등 오믹스 데이터 분석: 정규화, 차등 발현, 유전자 세트 검정."
  vi: "Phân tích thống kê dữ liệu biểu hiện gen và omics bằng R: chuẩn hóa, biểu hiện khác biệt."
  ms: "Analisis statistik data ekspresi gen dan omik dalam R: normalisasi, ekspresi berbeza."
  id: "Analisis statistik data ekspresi gen dan omik dengan R: normalisasi, ekspresi diferensial."
  hi: "R में जीन अभिव्यक्ति व ओमिक्स डेटा का सांख्यिकीय विश्लेषण: नॉर्मलाइज़ेशन, डिफरेंशियल एक्सप्रेशन।"
outcomes:
  - en: "Analyse transcriptomic data in R and read the results"
    zh: "用R分析转录组数据并解读结果"
    zh-TW: "用R分析轉錄體資料並解讀結果"
    ja: "Rで転写産物データを解析し解釈する"
    ko: "R로 전사체 데이터 분석·해석하기"
    vi: "Phân tích dữ liệu phiên mã bằng R và đọc kết quả"
    ms: "Menganalisis data transkriptomik dalam R"
    id: "Menganalisis data transkriptomik dengan R"
    hi: "R में ट्रांसक्रिप्टोमिक डेटा का विश्लेषण"
  - en: "Critically check gene expression results"
    zh: "批判性评估基因表达分析结果"
    zh-TW: "批判性評估基因表現分析結果"
    ja: "発現解析の結果を批判的に評価する"
    ko: "유전자 발현 결과 비판적으로 평가하기"
    vi: "Đánh giá phản biện kết quả biểu hiện gen"
    ms: "Menilai hasil ekspresi gen secara kritis"
    id: "Mengevaluasi hasil ekspresi gen secara kritis"
    hi: "जीन अभिव्यक्ति परिणामों का आलोचनात्मक आकलन"
  - en: "Extend the methods to other omics data"
    zh: "将方法推广到其他组学数据"
    zh-TW: "將方法推廣到其他體學資料"
    ja: "手法を他のオミクスに広げる"
    ko: "다른 오믹스 데이터로 방법 확장하기"
    vi: "Mở rộng phương pháp sang dữ liệu omics khác"
    ms: "Meluaskan kaedah kepada data omik lain"
    id: "Memperluas metode ke data omik lain"
    hi: "विधियों को अन्य ओमिक्स डेटा पर लागू करना"
