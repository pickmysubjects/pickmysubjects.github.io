code: UNIB10018
year: 2026
learn:
  en: "How insects shape human life, from food, medicine and design to art and myth, and why their decline matters."
  zh: "昆虫如何影响人类生活，从食物、医药、设计到艺术和神话，以及昆虫减少为何重要。"
  zh-TW: "昆蟲如何影響人類生活，從食物、醫藥、設計到藝術和神話，以及昆蟲減少為何重要。"
  ja: "食・薬・デザインから芸術・神話まで、昆虫が人の暮らしに与える影響と、その減少の意味。"
  ko: "음식·의약·디자인부터 예술·신화까지 곤충이 인간 삶에 미치는 영향과 곤충 감소의 의미."
  vi: "Côn trùng ảnh hưởng đời sống con người ra sao, từ thực phẩm, y học, thiết kế đến nghệ thuật, thần thoại."
  ms: "Cara serangga membentuk kehidupan manusia, dari makanan, ubat dan reka bentuk hingga seni dan mitos."
  id: "Cara serangga membentuk hidup manusia, dari pangan, obat, dan desain hingga seni dan mitos."
  hi: "कीड़े इंसानी जीवन को कैसे आकार देते हैं, भोजन, दवा, डिज़ाइन से कला और मिथक तक, और उनकी गिरावट क्यों मायने रखती है।"
outcomes:
  - en: "Explain how insects and people interact"
    zh: "解释昆虫与人类的互动"
    zh-TW: "解釋昆蟲與人類的互動"
    ja: "昆虫と人の関わりを説明する"
    ko: "곤충과 사람의 상호작용 설명하기"
    vi: "Giải thích côn trùng và con người tương tác ra sao"
    ms: "Terangkan interaksi serangga dan manusia"
    id: "Menjelaskan interaksi serangga dan manusia"
    hi: "कीड़ों और इंसानों के संबंध समझाना"
  - en: "Look at one issue from several disciplines"
    zh: "从多个学科角度看同一问题"
    zh-TW: "從多個學科角度看同一問題"
    ja: "一つの問題を複数の分野から見る"
    ko: "한 문제를 여러 학문으로 바라보기"
    vi: "Nhìn một vấn đề từ nhiều ngành"
    ms: "Lihat satu isu dari pelbagai bidang"
    id: "Melihat satu isu dari beberapa disiplin"
    hi: "एक मुद्दे को कई विषयों से देखना"
  - en: "Discuss threats to insects and why they matter"
    zh: "讨论昆虫面临的威胁及其意义"
    zh-TW: "討論昆蟲面臨的威脅及其意義"
    ja: "昆虫への脅威とその重要性を論じる"
    ko: "곤충이 받는 위협과 그 중요성 논의하기"
    vi: "Thảo luận mối đe dọa với côn trùng và tầm quan trọng"
    ms: "Bincang ancaman kepada serangga dan kepentingannya"
    id: "Membahas ancaman bagi serangga dan pentingnya"
    hi: "कीड़ों पर खतरों और उनके महत्व पर चर्चा करना"
