code: COMP90049
year: 2026
learn:
  en: "Machine learning basics: cleaning data, classification, regression, clustering and the maths behind them."
  zh: "机器学习基础：数据清洗、分类、回归、聚类及其背后的数学。"
  zh-TW: "機器學習基礎：資料清理、分類、迴歸、分群及其背後的數學。"
  ja: "機械学習の基礎：データ整形、分類、回帰、クラスタリングとその数学。"
  ko: "머신러닝 기초: 데이터 정제, 분류, 회귀, 군집화와 그 수학."
  vi: "Cơ bản học máy: làm sạch dữ liệu, phân loại, hồi quy, phân cụm và toán nền tảng."
  ms: "Asas pembelajaran mesin: membersih data, klasifikasi, regresi, pengelompokan dan matematiknya."
  id: "Dasar machine learning: membersihkan data, klasifikasi, regresi, klastering dan matematikanya."
  hi: "मशीन लर्निंग की बुनियाद: डेटा सफ़ाई, क्लासिफ़िकेशन, रिग्रेशन, क्लस्टरिंग और उनके पीछे का गणित।"
outcomes:
  - en: "Derive ML models from first principles"
    zh: "从基本原理推导机器学习模型"
    zh-TW: "從基本原理推導機器學習模型"
    ja: "機械学習モデルを第一原理から導く"
    ko: "기본 원리로 ML 모델 유도"
    vi: "Suy ra mô hình học máy từ nguyên lý"
    ms: "Terbitkan model ML daripada prinsip asas"
    id: "Menurunkan model ML dari prinsip dasar"
    hi: "मूल सिद्धांतों से ML मॉडल निकालना"
  - en: "Build and evaluate ML systems for real problems"
    zh: "为实际问题构建并评估机器学习系统"
    zh-TW: "為實際問題建立並評估機器學習系統"
    ja: "実問題向けに機械学習を構築・評価する"
    ko: "실제 문제용 ML 시스템 구축·평가"
    vi: "Xây dựng và đánh giá hệ thống học máy"
    ms: "Bina dan nilai sistem ML untuk masalah sebenar"
    id: "Membangun dan menilai sistem ML nyata"
    hi: "असली समस्याओं के लिए ML सिस्टम बनाना-परखना"
  - en: "Choose the right model for a problem"
    zh: "为问题选择合适的模型"
    zh-TW: "為問題選擇合適的模型"
    ja: "問題に合うモデルを選ぶ"
    ko: "문제에 맞는 모델 선택"
    vi: "Chọn mô hình phù hợp cho bài toán"
    ms: "Pilih model yang sesuai untuk masalah"
    id: "Memilih model yang tepat untuk masalah"
    hi: "समस्या के लिए सही मॉडल चुनना"
