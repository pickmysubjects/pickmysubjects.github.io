code: MUSI20164
year: 2026
learn:
  en: "Free improvisation for any instrument or voice: make music in real time as a group, no improvising experience needed."
  zh: "任何乐器或人声都可参加的自由即兴：和小组一起实时创作音乐，不需要即兴经验"
  zh-TW: "任何樂器或人聲都可參加的自由即興：和小組一起即時創作音樂，不需要即興經驗"
  ja: "楽器でも声でも参加できる自由即興。グループでその場で音楽を作る。即興経験は不要。"
  ko: "어떤 악기나 목소리로도 참여하는 자유 즉흥: 그룹으로 실시간 음악 만들기, 즉흥 경험 불필요."
  vi: "Ứng tác tự do cho mọi nhạc cụ hay giọng hát: cùng nhóm sáng tác nhạc tức thì, không cần kinh nghiệm ứng tác."
  ms: "Improvisasi bebas untuk sebarang alat muzik atau suara: cipta muzik secara langsung bersama kumpulan."
  id: "Improvisasi bebas untuk instrumen atau suara apa pun: membuat musik secara langsung bersama kelompok."
  hi: "किसी भी वाद्य या आवाज़ के लिए फ़्री इम्प्रोवाइज़ेशन: समूह में तुरंत संगीत रचना, पहले अनुभव ज़रूरी नहीं।"
outcomes:
  - en: "Treat improvising as composing in real time"
    zh: "把即兴当作实时作曲来理解"
    zh-TW: "把即興當作即時作曲來理解"
    ja: "即興をその場での作曲として捉える"
    ko: "즉흥을 실시간 작곡으로 이해하기"
    vi: "Hiểu ứng tác như sáng tác tức thời"
    ms: "Memahami improvisasi sebagai gubahan masa nyata"
    id: "Memahami improvisasi sebagai komposisi waktu nyata"
    hi: "इम्प्रोवाइज़ेशन को तुरंत की गई रचना की तरह समझना"
  - en: "Develop your own approach to improvised performance"
    zh: "形成自己的即兴演奏方式"
    zh-TW: "形成自己的即興演奏方式"
    ja: "自分なりの即興演奏のスタイルを育てる"
    ko: "나만의 즉흥 연주 방식 만들기"
    vi: "Phát triển cách ứng tác biểu diễn của riêng mình"
    ms: "Membina pendekatan improvisasi sendiri"
    id: "Mengembangkan pendekatan improvisasi sendiri"
    hi: "इम्प्रोवाइज़्ड प्रस्तुति का अपना तरीका विकसित करना"
  - en: "Listen and respond to others in a group"
    zh: "在合奏中倾听并回应他人"
    zh-TW: "在合奏中傾聽並回應他人"
    ja: "グループで他者を聴き応答する"
    ko: "그룹에서 다른 사람을 듣고 반응하기"
    vi: "Lắng nghe và đáp lại người khác trong nhóm"
    ms: "Mendengar dan membalas rakan dalam kumpulan"
    id: "Mendengarkan dan merespons orang lain dalam kelompok"
    hi: "समूह में दूसरों को सुनकर जवाब देना"
