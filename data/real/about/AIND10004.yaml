code: AIND10004
year: 2026
learn:
  en: "An online intro to Aboriginal and Torres Strait Islander art and culture, with elders, artists and activists as guest speakers."
  zh: "线上入门课：认识原住民和托雷斯海峡岛民的艺术与文化，由长老、艺术家和社运人士授课。"
  zh-TW: "線上入門課：認識原住民和托雷斯海峽島民的藝術與文化，由長老、藝術家和社運人士授課。"
  ja: "アボリジナルとトレス海峡諸島民の芸術と文化を学ぶオンライン入門。長老、芸術家、活動家がゲスト講師。"
  ko: "애버리지니와 토레스 해협 섬 주민의 예술과 문화를 배우는 온라인 입문. 원로, 예술가, 활동가가 강연한다."
  vi: "Nhập môn trực tuyến về nghệ thuật, văn hóa thổ dân và người đảo Torres Strait, với khách mời là trưởng lão, nghệ sĩ, nhà hoạt động."
  ms: "Pengenalan dalam talian kepada seni dan budaya Aborigin serta Torres Strait, dengan penceramah tua adat, artis dan aktivis."
  id: "Pengantar daring seni dan budaya Aborigin serta Torres Strait, dengan pembicara tetua adat, seniman dan aktivis."
  hi: "आदिवासी व टॉरेस स्ट्रेट द्वीपवासी कला-संस्कृति का ऑनलाइन परिचय, बुज़ुर्गों, कलाकारों और कार्यकर्ताओं के साथ।"
outcomes:
  - en: "Describe how Indigenous art connects to Country"
    zh: "说明原住民艺术与土地的联系"
    zh-TW: "說明原住民藝術與土地的聯繫"
    ja: "先住民の芸術と土地とのつながりを説明する"
    ko: "원주민 예술과 땅의 연결 설명하기"
    vi: "Mô tả mối liên hệ giữa nghệ thuật bản địa và đất đai"
    ms: "Terangkan kaitan seni Orang Asli dengan tanah adat"
    id: "Menjelaskan kaitan seni Pribumi dengan tanah adat"
    hi: "आदिवासी कला का धरती से जुड़ाव समझाना"
  - en: "Reflect on colonisation's impact in south-east Australia"
    zh: "反思殖民在澳洲东南部的影响"
    zh-TW: "反思殖民在澳洲東南部的影響"
    ja: "オーストラリア南東部での植民地化の影響を考える"
    ko: "호주 남동부에서 식민화의 영향 성찰하기"
    vi: "Suy ngẫm về tác động của thực dân ở đông nam Úc"
    ms: "Renungkan kesan penjajahan di tenggara Australia"
    id: "Merefleksikan dampak kolonisasi di tenggara Australia"
    hi: "दक्षिण-पूर्वी ऑस्ट्रेलिया में उपनिवेशवाद के असर पर विचार करना"
  - en: "Discuss First Nations perspectives in writing"
    zh: "用书面形式讨论原住民视角"
    zh-TW: "用書面形式討論原住民視角"
    ja: "先住民の視点について文章で議論する"
    ko: "원주민의 관점을 글로 토론하기"
    vi: "Thảo luận quan điểm bản địa qua bài viết"
    ms: "Bincangkan perspektif Orang Asli secara bertulis"
    id: "Membahas perspektif Pribumi secara tertulis"
    hi: "फ़र्स्ट नेशंस के नज़रिए पर लिखकर चर्चा करना"
