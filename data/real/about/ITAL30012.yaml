code: ITAL30012
year: 2026
learn:
  en: "Three weeks in Venice studying how its public and private spaces were used and pictured in the early modern era, with site visits."
  zh: "在威尼斯学习三周，研究近代早期该城公共与私人空间如何被使用和描绘，并实地参观。"
  zh-TW: "在威尼斯學習三週，研究近代早期該城公共與私人空間如何被使用和描繪，並實地參觀。"
  ja: "ヴェネツィアで3週間、近世の公的・私的空間がどう使われ描かれたかを、現地見学を交えて学ぶ。"
  ko: "베네치아에서 3주간 근세 도시의 공적·사적 공간이 어떻게 쓰이고 그려졌는지 현장 답사와 함께 배운다."
  vi: "Ba tuần ở Venice tìm hiểu không gian công cộng và riêng tư được sử dụng, khắc họa ra sao thời cận đại, có tham quan thực địa."
  ms: "Tiga minggu di Venice mengkaji cara ruang awam dan peribadi digunakan serta digambarkan pada zaman moden awal, dengan lawatan tapak."
  id: "Tiga minggu di Venesia mempelajari cara ruang publik dan pribadi dipakai dan digambarkan pada masa modern awal, dengan kunjungan situs."
  hi: "वेनिस में तीन हफ़्ते: आरंभिक आधुनिक काल में सार्वजनिक और निजी जगहें कैसे इस्तेमाल और चित्रित हुईं, स्थल भ्रमण के साथ।"
outcomes:
  - en: "Explain how Venetian spaces shaped communication"
    zh: "说明威尼斯的空间如何影响信息传播"
    zh-TW: "說明威尼斯的空間如何影響資訊傳播"
    ja: "ヴェネツィアの空間が伝達をどう形作ったか説明する"
    ko: "베네치아의 공간이 소통을 만든 방식 설명하기"
    vi: "Giải thích không gian Venice định hình giao tiếp ra sao"
    ms: "Terangkan cara ruang Venice membentuk komunikasi"
    id: "Menjelaskan cara ruang Venesia membentuk komunikasi"
    hi: "वेनिस की जगहों ने संचार को कैसे गढ़ा, समझाना"
  - en: "Work with 15th-century primary sources"
    zh: "研读 15 世纪的一手史料"
    zh-TW: "研讀 15 世紀的一手史料"
    ja: "15世紀の一次史料を扱う"
    ko: "15세기 1차 사료 다루기"
    vi: "Làm việc với nguồn sử liệu gốc thế kỷ 15"
    ms: "Bekerja dengan sumber primer abad ke-15"
    id: "Bekerja dengan sumber primer abad ke-15"
    hi: "15वीं सदी के प्राथमिक स्रोतों के साथ काम करना"
  - en: "Learn from sites and museums on location"
    zh: "在现场从遗址和博物馆中学习"
    zh-TW: "在現場從遺址和博物館中學習"
    ja: "現地の史跡や博物館から学ぶ"
    ko: "현장의 유적과 박물관에서 배우기"
    vi: "Học từ di tích và bảo tàng tại chỗ"
    ms: "Belajar dari tapak dan muzium di lokasi"
    id: "Belajar dari situs dan museum di lokasi"
    hi: "मौके पर स्थलों और संग्रहालयों से सीखना"
