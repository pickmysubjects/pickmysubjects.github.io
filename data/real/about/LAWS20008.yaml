code: LAWS20008
year: 2026
learn:
  en: "How law shows up in culture, from judgments and courtrooms to novels, images, podcasts and Indigenous storytelling."
  zh: "法律如何体现在文化里：从判决、法庭到小说、图像、播客和原住民叙事。"
  zh-TW: "法律如何展現在文化裡：從判決、法庭到小說、圖像、Podcast 和原住民敘事。"
  ja: "判決や法廷から小説、映像、ポッドキャスト、先住民の語りまで、法が文化の中でどう表れるかを学ぶ。"
  ko: "판결과 법정부터 소설, 이미지, 팟캐스트, 원주민 이야기까지 법이 문화 속에서 어떻게 드러나는지 배운다."
  vi: "Luật hiện diện trong văn hóa ra sao, từ bản án, phòng xử đến tiểu thuyết, hình ảnh, podcast và chuyện kể bản địa."
  ms: "Bagaimana undang-undang muncul dalam budaya, dari penghakiman dan mahkamah hingga novel, imej, podcast dan cerita Orang Asli."
  id: "Bagaimana hukum tampil dalam budaya, dari putusan dan ruang sidang hingga novel, gambar, podcast dan kisah masyarakat adat."
  hi: "क़ानून संस्कृति में कैसे दिखता है, फ़ैसलों और अदालतों से लेकर उपन्यास, तस्वीरें, पॉडकास्ट और मूलनिवासी कहानियों तक।"
outcomes:
  - en: "Explain how law is expressed through art, media and institutions"
    zh: "说明法律如何通过艺术、媒体和机构表达出来"
    zh-TW: "說明法律如何透過藝術、媒體和機構表達出來"
    ja: "法が芸術・メディア・制度を通じてどう表現されるか説明する"
    ko: "법이 예술, 미디어, 제도를 통해 어떻게 표현되는지 설명하기"
    vi: "Giải thích luật được thể hiện qua nghệ thuật, truyền thông và thể chế ra sao"
    ms: "Terangkan cara undang-undang dizahirkan melalui seni, media dan institusi"
    id: "Menjelaskan cara hukum diungkapkan lewat seni, media dan lembaga"
    hi: "समझाना कि क़ानून कला, मीडिया और संस्थाओं से कैसे व्यक्त होता है"
  - en: "Read judgments and laws for how they build authority"
    zh: "解读判决和法条如何建立权威"
    zh-TW: "解讀判決和法條如何建立權威"
    ja: "判決や法令が権威をどう築くか読み解く"
    ko: "판결과 법령이 권위를 세우는 방식 읽어 내기"
    vi: "Đọc bản án và luật để thấy cách chúng tạo dựng thẩm quyền"
    ms: "Baca penghakiman dan undang-undang untuk melihat cara ia membina autoriti"
    id: "Membaca putusan dan undang-undang untuk melihat cara membangun otoritas"
    hi: "फ़ैसलों और क़ानूनों को पढ़कर समझना कि वे अधिकार कैसे बनाते हैं"
  - en: "Argue about law's cultural meaning in talks and essays"
    zh: "在讨论和论文中论证法律的文化意义"
    zh-TW: "在討論和論文中論證法律的文化意義"
    ja: "議論や論文で法の文化的な意味について論じる"
    ko: "토론과 에세이에서 법의 문화적 의미 논증하기"
    vi: "Lập luận về ý nghĩa văn hóa của luật khi thảo luận và viết luận"
    ms: "Berhujah tentang makna budaya undang-undang dalam perbincangan dan esei"
    id: "Berargumen tentang makna budaya hukum dalam diskusi dan esai"
    hi: "चर्चा और निबंधों में क़ानून के सांस्कृतिक अर्थ पर तर्क देना"
