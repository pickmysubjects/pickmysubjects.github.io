code: ITAL10010
year: 2026
learn:
  en: "Italian for students who finished Italian 7: conversation practice and today's Italy through films, music and media."
  zh: "适合学完意大利语 7 的学生：会话练习，通过影音媒体了解当今意大利。"
  zh-TW: "適合學完義大利語 7 的學生：會話練習，透過影音媒體了解當今義大利。"
  ja: "イタリア語7を終えた学生向け。会話練習と、映画・音楽・メディアで見る今のイタリア。"
  ko: "이탈리아어 7를 마친 학생 대상. 회화 연습과 영화·음악·미디어로 보는 오늘의 이탈리아."
  vi: "Tiếng Ý cho ai đã học xong Italian 7: luyện hội thoại và nước Ý ngày nay qua phim, nhạc, truyền thông."
  ms: "Bahasa Itali untuk yang tamat Italian 7: latihan perbualan dan Itali kini melalui filem, muzik dan media."
  id: "Bahasa Italia untuk yang lulus Italian 7: latihan percakapan dan Italia kini lewat film, musik dan media."
  hi: "इतालवी 7 पूरा कर चुके छात्रों के लिए: बातचीत का अभ्यास और फ़िल्म, संगीत व मीडिया से आज का इटली।"
outcomes:
  - en: "Discuss social and cultural topics in Italian"
    zh: "用意大利语讨论社会和文化话题"
    zh-TW: "用義大利語討論社會和文化話題"
    ja: "社会や文化の話題をイタリア語で話し合う"
    ko: "사회·문화 주제를 이탈리아어로 토론하기"
    vi: "Thảo luận chủ đề xã hội, văn hóa bằng tiếng Ý"
    ms: "Bincangkan topik sosial dan budaya dalam bahasa Itali"
    id: "Membahas topik sosial dan budaya dalam bahasa Italia"
    hi: "सामाजिक और सांस्कृतिक विषयों पर इतालवी में चर्चा करना"
  - en: "Read and write longer Italian texts"
    zh: "读写较长的意大利语文章"
    zh-TW: "讀寫較長的義大利語文章"
    ja: "長めのイタリア語の文章を読み書きする"
    ko: "긴 이탈리아어 글 읽고 쓰기"
    vi: "Đọc và viết văn bản tiếng Ý dài hơn"
    ms: "Baca dan tulis teks bahasa Itali yang lebih panjang"
    id: "Membaca dan menulis teks bahasa Italia yang lebih panjang"
    hi: "लंबे इतालवी पाठ पढ़ना-लिखना"
  - en: "Give a clear presentation in Italian"
    zh: "用意大利语做清楚的口头报告"
    zh-TW: "用義大利語做清楚的口頭報告"
    ja: "イタリア語で分かりやすく発表する"
    ko: "이탈리아어로 명확하게 발표하기"
    vi: "Thuyết trình rõ ràng bằng tiếng Ý"
    ms: "Buat pembentangan yang jelas dalam bahasa Itali"
    id: "Melakukan presentasi yang jelas dalam bahasa Italia"
    hi: "इतालवी में स्पष्ट प्रस्तुति देना"
