code: ACCT20007
year: 2026
learn:
  en: "How business processes create accounting data, and the systems, risks and internal controls that keep it reliable."
  zh: "业务流程如何产生会计数据，以及保障其可靠的信息系统、风险与内部控制。"
  zh-TW: "業務流程如何產生會計資料，以及確保其可靠的資訊系統、風險與內部控制。"
  ja: "業務プロセスが会計データを生む仕組みと、その信頼性を守るシステム・リスク・内部統制。"
  ko: "업무 프로세스가 회계 데이터를 만드는 방식과, 그 신뢰성을 지키는 시스템·위험·내부통제."
  vi: "Quy trình kinh doanh tạo ra dữ liệu kế toán thế nào, cùng hệ thống, rủi ro và kiểm soát nội bộ giữ cho nó đáng tin."
  ms: "Cara proses perniagaan menghasilkan data perakaunan, serta sistem, risiko dan kawalan dalaman yang menjaganya."
  id: "Bagaimana proses bisnis menghasilkan data akuntansi, serta sistem, risiko, dan pengendalian internal yang menjaganya."
  hi: "बिज़नेस प्रोसेस अकाउंटिंग डेटा कैसे बनाते हैं, और उसे भरोसेमंद रखने वाले सिस्टम, जोखिम व इंटरनल कंट्रोल।"
outcomes:
  - en: "Read and analyse business process diagrams"
    zh: "读懂并分析业务流程图"
    zh-TW: "讀懂並分析業務流程圖"
    ja: "業務プロセス図を読み、分析する"
    ko: "업무 프로세스 다이어그램 읽고 분석하기"
    vi: "Đọc và phân tích sơ đồ quy trình kinh doanh"
    ms: "Baca dan analisis rajah proses perniagaan"
    id: "Membaca dan menganalisis diagram proses bisnis"
    hi: "बिज़नेस प्रोसेस डायग्राम पढ़ना और उनका विश्लेषण करना"
  - en: "Explain how information systems keep accounting data reliable"
    zh: "解释信息系统如何保障会计数据可靠"
    zh-TW: "解釋資訊系統如何確保會計資料可靠"
    ja: "情報システムが会計データの信頼性をどう保つか説明する"
    ko: "정보시스템이 회계 데이터 신뢰성을 지키는 방식 설명하기"
    vi: "Giải thích hệ thống thông tin giữ dữ liệu kế toán đáng tin ra sao"
    ms: "Terangkan cara sistem maklumat menjaga kebolehpercayaan data perakaunan"
    id: "Menjelaskan cara sistem informasi menjaga keandalan data akuntansi"
    hi: "समझाना कि इन्फ़ॉर्मेशन सिस्टम अकाउंटिंग डेटा को भरोसेमंद कैसे रखते हैं"
  - en: "Match internal controls to the risks they manage"
    zh: "把内部控制与其应对的风险对应起来"
    zh-TW: "把內部控制與其因應的風險對應起來"
    ja: "内部統制とそれが対処するリスクを対応づける"
    ko: "내부통제를 그것이 관리하는 위험과 연결하기"
    vi: "Ghép kiểm soát nội bộ với rủi ro mà nó quản lý"
    ms: "Padankan kawalan dalaman dengan risiko yang diuruskannya"
    id: "Mencocokkan pengendalian internal dengan risiko yang dikelolanya"
    hi: "इंटरनल कंट्रोल को उनके संभाले जोखिमों से मिलाना"
