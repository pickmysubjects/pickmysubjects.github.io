code: BCMB30004
year: 2026
learn:
  en: "How cells send and receive signals via hormones and neurotransmitters, and how this goes wrong in disease."
  zh: "细胞怎样通过激素和神经递质传递信号，出错时又怎样致病。"
  zh-TW: "細胞如何透過激素和神經傳導物質傳遞訊號，出錯時又如何致病。"
  ja: "細胞がホルモンや神経伝達物質で信号をやり取りする仕組みと、病気での異常。"
  ko: "세포가 호르몬과 신경전달물질로 신호를 주고받는 방식, 질병에서 생기는 이상."
  vi: "Tế bào gửi và nhận tín hiệu qua hormone, chất dẫn truyền thần kinh ra sao, và sai hỏng gây bệnh thế nào."
  ms: "Cara sel menghantar dan menerima isyarat melalui hormon dan neurotransmiter, dan gangguannya dalam penyakit."
  id: "Cara sel mengirim dan menerima sinyal lewat hormon dan neurotransmiter, dan gangguannya pada penyakit."
  hi: "सेल हार्मोन और न्यूरोट्रांसमीटर से सिग्नल कैसे भेजते-पाते हैं, और बीमारी में यह कैसे बिगड़ता है।"
outcomes:
  - en: "Explain how receptors pass signals into the cell"
    zh: "解释受体怎样把信号传进细胞"
    zh-TW: "解釋受體如何把訊號傳進細胞"
    ja: "受容体が細胞内へ信号を伝える仕組みを説明する"
    ko: "수용체가 세포 안으로 신호를 전달하는 방식 설명하기"
    vi: "Giải thích thụ thể truyền tín hiệu vào tế bào ra sao"
    ms: "Terangkan cara reseptor hantar isyarat ke dalam sel"
    id: "Menjelaskan cara reseptor meneruskan sinyal ke sel"
    hi: "समझाना कि रिसेप्टर सेल में सिग्नल कैसे पहुँचाते हैं"
  - en: "Plan experiments on faulty signalling in disease"
    zh: "设计实验研究信号异常致病"
    zh-TW: "設計實驗研究訊號異常致病"
    ja: "病気での信号伝達の異常を調べる実験を計画する"
    ko: "질병 속 신호 이상에 대한 실험 설계하기"
    vi: "Lên kế hoạch thí nghiệm về tín hiệu lỗi gây bệnh"
    ms: "Rancang eksperimen isyarat rosak dalam penyakit"
    id: "Merancang eksperimen sinyal rusak pada penyakit"
    hi: "बीमारी में गलत सिग्नलिंग पर प्रयोग प्लान करना"
  - en: "Analyse signalling proteins on computer"
    zh: "用电脑分析信号蛋白"
    zh-TW: "用電腦分析訊號蛋白"
    ja: "コンピュータでシグナルタンパク質を解析する"
    ko: "컴퓨터로 신호 단백질 분석하기"
    vi: "Phân tích protein tín hiệu trên máy tính"
    ms: "Analisis protein isyarat di komputer"
    id: "Menganalisis protein sinyal di komputer"
    hi: "कंप्यूटर पर सिग्नलिंग प्रोटीन का विश्लेषण"
