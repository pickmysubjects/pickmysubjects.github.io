code: ERTH90063
year: 2027
learn:
  en: "Student-led discussions of current archaeological science research, plus an oral presentation on a current topic."
  zh: "由学生主导讨论考古科学的最新研究，并就当前议题做口头报告。"
  zh-TW: "由學生主導討論考古科學的最新研究，並就當前議題做口頭報告。"
  ja: "学生主導で考古科学の最新研究を議論し、最新テーマで口頭発表を行う。"
  ko: "학생 주도로 고고과학 최신 연구를 토론하고 최신 주제로 구두 발표를 합니다."
  vi: "Sinh viên dẫn dắt thảo luận nghiên cứu khảo cổ mới và thuyết trình một chủ đề hiện nay."
  ms: "Perbincangan dipimpin pelajar tentang kajian sains arkeologi terkini dan pembentangan lisan."
  id: "Diskusi yang dipimpin mahasiswa tentang riset sains arkeologi terkini dan presentasi lisan."
  hi: "छात्रों के नेतृत्व में नए पुरातत्व विज्ञान शोध पर चर्चा और एक मौखिक प्रस्तुति।"
outcomes:
  - en: "Critique key concepts in archaeological science"
    zh: "评析考古科学中的关键概念"
    zh-TW: "評析考古科學中的關鍵概念"
    ja: "考古科学の主要概念を批評する"
    ko: "고고과학 핵심 개념 비평하기"
    vi: "Phê bình khái niệm chính trong khảo cổ học"
    ms: "Mengkritik konsep utama sains arkeologi"
    id: "Mengkritisi konsep kunci sains arkeologi"
    hi: "पुरातत्व विज्ञान की मुख्य अवधारणाओं की समीक्षा"
  - en: "Work ethically with heritage and communities"
    zh: "以合乎伦理的方式对待遗产和社区"
    zh-TW: "以合乎倫理的方式對待遺產與社區"
    ja: "遺産と地域社会に倫理的に関わる"
    ko: "유산과 공동체를 윤리적으로 대하기"
    vi: "Làm việc có đạo đức với di sản và cộng đồng"
    ms: "Bekerja secara beretika dengan warisan dan komuniti"
    id: "Bekerja etis dengan warisan dan komunitas"
    hi: "धरोहर व समुदायों के साथ नैतिक कार्य"
