code: HIST30010
year: 2026
learn:
  en: "Fascism in Europe from 1919 to 1945, focused on Nazi Germany: how it rose, how it ruled and the society it built."
  zh: "1919至1945年的欧洲法西斯主义，重点是纳粹德国：如何崛起、如何统治、建立了怎样的社会。"
  zh-TW: "1919至1945年的歐洲法西斯主義，重點是納粹德國：如何崛起、如何統治、建立了怎樣的社會。"
  ja: "ナチス・ドイツを中心に、1919〜1945年のヨーロッパのファシズムが、どう台頭し、どう支配し、どんな社会を作ったかを学ぶ。"
  ko: "나치 독일을 중심으로 1919~1945년 유럽 파시즘이 어떻게 부상하고 통치했으며 어떤 사회를 만들었는지 배운다."
  vi: "Chủ nghĩa phát xít ở châu Âu 1919–1945, trọng tâm là Đức Quốc xã: trỗi dậy, cai trị và xã hội nó tạo ra."
  ms: "Fasisme di Eropah 1919–1945, berfokus pada Jerman Nazi: cara ia bangkit, memerintah dan masyarakat yang dibinanya."
  id: "Fasisme di Eropa 1919–1945, berfokus pada Jerman Nazi: cara bangkit, berkuasa, dan masyarakat yang dibangunnya."
  hi: "1919 से 1945 तक यूरोप में फ़ासीवाद, नाज़ी जर्मनी पर ध्यान: यह कैसे उभरा, कैसे शासन किया और कैसा समाज बनाया।"
outcomes:
  - en: "Compare key figures and events of fascism and Nazism"
    zh: "比较法西斯主义和纳粹主义的关键人物与事件"
    zh-TW: "比較法西斯主義和納粹主義的關鍵人物與事件"
    ja: "ファシズムとナチズムの主要人物と出来事を比べる"
    ko: "파시즘과 나치즘의 주요 인물과 사건 비교하기"
    vi: "So sánh nhân vật và sự kiện chính của phát xít và Quốc xã"
    ms: "Bandingkan tokoh dan peristiwa utama fasisme dan Nazisme"
    id: "Membandingkan tokoh dan peristiwa utama fasisme dan Nazisme"
    hi: "फ़ासीवाद और नाज़ीवाद के मुख्य लोगों और घटनाओं की तुलना करना"
  - en: "Analyse why fascists rose to power"
    zh: "分析法西斯分子为何能掌权"
    zh-TW: "分析法西斯分子為何能掌權"
    ja: "ファシストが権力を握った理由を分析する"
    ko: "파시스트가 권력을 잡은 이유 분석하기"
    vi: "Phân tích vì sao phe phát xít lên nắm quyền"
    ms: "Analisis sebab golongan fasis berkuasa"
    id: "Menganalisis mengapa kaum fasis meraih kekuasaan"
    hi: "फ़ासीवादी सत्ता में क्यों आए, विश्लेषण करना"
  - en: "Explain the racist nature of Nazi society"
    zh: "说明纳粹社会的种族主义本质"
    zh-TW: "說明納粹社會的種族主義本質"
    ja: "ナチ社会の人種主義的な性格を説明する"
    ko: "나치 사회의 인종주의적 성격 설명하기"
    vi: "Giải thích bản chất phân biệt chủng tộc của xã hội Quốc xã"
    ms: "Terangkan sifat perkauman masyarakat Nazi"
    id: "Menjelaskan sifat rasis masyarakat Nazi"
    hi: "नाज़ी समाज के नस्लवादी स्वरूप को समझाना"
