code: BLAW20002
year: 2026
learn:
  en: "How law helped big digital platforms grow, and how it shapes their data, algorithm and attention-based businesses."
  zh: "法律如何助推大型数字平台崛起，并影响其数据和算法生意。"
  zh-TW: "法律如何助長大型數位平台崛起，並影響其資料和演算法生意。"
  ja: "巨大デジタル企業の成長を法がどう支え、データやアルゴリズムの事業をどう形づくるか。"
  ko: "법이 거대 디지털 플랫폼의 성장을 어떻게 도왔고 데이터·알고리즘 사업을 어떻게 형성하는지."
  vi: "Luật pháp đã giúp các nền tảng số lớn phát triển ra sao, và định hình mô hình kinh doanh dữ liệu của họ thế nào."
  ms: "Cara undang-undang membantu platform digital besar berkembang dan membentuk perniagaan data mereka."
  id: "Cara hukum membantu platform digital besar tumbuh dan membentuk bisnis data serta algoritma mereka."
  hi: "क़ानून ने बड़े डिजिटल प्लेटफ़ॉर्म को बढ़ने में कैसे मदद की और उनके डेटा-आधारित कारोबार को कैसे आकार दिया।"
outcomes:
  - en: "Understand how online platforms make money in the information economy"
    zh: "理解网络平台在信息经济中如何赚钱"
    zh-TW: "理解網路平台在資訊經濟中如何賺錢"
    ja: "情報経済でネット企業がどう稼ぐかを理解する"
    ko: "정보경제에서 온라인 플랫폼의 수익 방식 이해"
    vi: "Hiểu nền tảng trực tuyến kiếm tiền ra sao"
    ms: "Fahami cara platform dalam talian menjana wang"
    id: "Memahami cara platform daring menghasilkan uang"
    hi: "सूचना अर्थव्यवस्था में ऑनलाइन प्लेटफ़ॉर्म कैसे कमाते हैं, समझना"
  - en: "See how legal ideas and enforcement shape platform practices"
    zh: "了解法律观念和执法如何影响平台做法"
    zh-TW: "了解法律觀念和執法如何影響平台做法"
    ja: "法の考え方と執行が企業の慣行をどう形づくるか知る"
    ko: "법 개념과 집행이 플랫폼 관행에 미치는 영향 이해"
    vi: "Thấy luật và thực thi định hình hoạt động nền tảng"
    ms: "Lihat cara idea undang-undang membentuk amalan platform"
    id: "Melihat cara hukum dan penegakannya membentuk praktik platform"
    hi: "क़ानूनी विचार और उनका पालन प्लेटफ़ॉर्म के तरीक़ों को कैसे बदलते हैं"
  - en: "Trace how regulation helped platforms profit from dominance"
    zh: "追溯监管如何帮助平台利用主导地位获利"
    zh-TW: "追溯監管如何幫助平台利用主導地位獲利"
    ja: "規制が企業の支配的地位からの利益をどう助けたか追う"
    ko: "규제가 플랫폼의 지배력 수익화를 도운 과정 추적"
    vi: "Lần theo cách quy định giúp nền tảng hưởng lợi từ vị thế"
    ms: "Jejaki cara peraturan bantu platform untung daripada dominasi"
    id: "Menelusuri cara regulasi membantu platform meraup untung"
    hi: "नियमों ने प्लेटफ़ॉर्म को दबदबे से मुनाफ़ा कमाने में कैसे मदद की"
