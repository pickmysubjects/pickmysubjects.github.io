code: MUSI10204
year: 2026
learn:
  en: "Ear training basics: hear and sing tonal harmony and rhythm, transcribe short melodies, with online tests and keyboard labs."
  zh: "听觉训练基础：听唱调性和声与节奏、记写短旋律，配合在线测验和键盘实验课。"
  zh-TW: "聽覺訓練基礎：聽唱調性和聲與節奏、記寫短旋律，配合線上測驗與鍵盤實驗課。"
  ja: "聴音の基礎。調性和声とリズムを聴いて歌い、短い旋律を書き取る。オンラインテストあり。"
  ko: "청음 기초: 조성 화성과 리듬을 듣고 부르며 짧은 선율을 받아 적는다. 온라인 테스트 포함."
  vi: "Cơ bản luyện tai: nghe, hát hòa âm và nhịp, chép giai điệu ngắn, có bài kiểm tra trực tuyến."
  ms: "Asas latihan pendengaran: dengar dan nyanyi harmoni serta ritma, transkripsi melodi pendek."
  id: "Dasar latihan pendengaran: dengar dan nyanyikan harmoni dan ritme, transkripsi melodi pendek."
  hi: "कान की ट्रेनिंग की शुरुआत: हार्मनी व रिदम सुनना-गाना, छोटी धुनें लिखना, ऑनलाइन टेस्ट।"
outcomes:
  - en: "Sing tonal passages using solfège"
    zh: "用视唱音名唱调性片段"
    zh-TW: "用視唱音名唱調性片段"
    ja: "ソルフェージュで調性旋律を歌う"
    ko: "솔페지로 조성 악구 부르기"
    vi: "Hát đoạn nhạc bằng xướng âm"
    ms: "Nyanyi petikan tonal dengan solfa"
    id: "Menyanyikan bagian tonal dengan solmisasi"
    hi: "सोल्फ़ेज से टोनल अंश गाना"
  - en: "Read and perform simple rhythms"
    zh: "读奏简单节奏"
    zh-TW: "讀奏簡單節奏"
    ja: "簡単なリズムを読んで演奏する"
    ko: "간단한 리듬 읽고 연주하기"
    vi: "Đọc và thể hiện nhịp đơn giản"
    ms: "Baca dan mainkan ritma mudah"
    id: "Membaca dan memainkan ritme sederhana"
    hi: "सरल रिदम पढ़ना और बजाना"
  - en: "Transcribe short melodies and chords by ear"
    zh: "凭听觉记写短旋律与和弦"
    zh-TW: "憑聽覺記寫短旋律與和弦"
    ja: "短い旋律と和音を耳で書き取る"
    ko: "짧은 선율과 화음 받아 적기"
    vi: "Chép giai điệu và hợp âm bằng tai"
    ms: "Transkripsi melodi dan kord dengan telinga"
    id: "Mentranskripsi melodi dan akor lewat telinga"
    hi: "कान से धुन और कॉर्ड लिखना"
