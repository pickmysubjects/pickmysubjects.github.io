code: MGMT90013
year: 2027
learn:
  en: "Leading teams at work: team structure, differences between members, interpersonal dynamics and leadership theories."
  zh: "职场团队领导：团队结构、成员差异、人际动态和领导理论。"
  zh-TW: "職場團隊領導：團隊結構、成員差異、人際動態與領導理論。"
  ja: "職場でのチームリーダーシップ：チーム構造、メンバーの違い、対人関係、リーダーシップ理論。"
  ko: "직장 내 팀 리더십: 팀 구조, 구성원 차이, 대인관계 역학, 리더십 이론."
  vi: "Lãnh đạo nhóm nơi làm việc: cấu trúc nhóm, khác biệt thành viên, động lực quan hệ và lý thuyết lãnh đạo."
  ms: "Memimpin pasukan di tempat kerja: struktur pasukan, perbezaan ahli, dinamik interpersonal dan teori kepimpinan."
  id: "Memimpin tim di tempat kerja: struktur tim, perbedaan anggota, dinamika antarpribadi, dan teori kepemimpinan."
  hi: "कार्यस्थल पर टीम नेतृत्व: टीम संरचना, सदस्यों के अंतर, पारस्परिक गतिशीलता और नेतृत्व सिद्धांत।"
outcomes:
  - en: "Explain theories of leadership"
    zh: "解释各种领导理论"
    zh-TW: "解釋各種領導理論"
    ja: "リーダーシップ理論を説明する"
    ko: "리더십 이론 설명하기"
    vi: "Giải thích các lý thuyết lãnh đạo"
    ms: "Menerangkan teori kepimpinan"
    id: "Menjelaskan teori kepemimpinan"
    hi: "नेतृत्व के सिद्धांत समझाना"
  - en: "Manage interpersonal dynamics in teams"
    zh: "管理团队中的人际动态"
    zh-TW: "管理團隊中的人際動態"
    ja: "チーム内の対人関係を管理する"
    ko: "팀 내 대인관계 역학 관리하기"
    vi: "Quản lý động lực quan hệ trong nhóm"
    ms: "Mengurus dinamik interpersonal dalam pasukan"
    id: "Mengelola dinamika antarpribadi dalam tim"
    hi: "टीमों में पारस्परिक गतिशीलता संभालना"
