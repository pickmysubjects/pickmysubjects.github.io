code: ABPL10008
year: 2027
learn:
  en: "The basics of how buildings perform environmentally: sun, ventilation, building envelope, services, heating, cooling and air quality."
  zh: "建筑环境性能入门：日照、通风、围护结构、设备、供暖制冷和空气质量。"
  zh-TW: "建築環境性能入門：日照、通風、外殼、設備、冷暖空調和空氣品質。"
  ja: "建物の環境性能の基礎：日射、換気、外皮、設備、冷暖房、空気質。"
  ko: "건물 환경 성능의 기초: 일조, 환기, 외피, 설비, 냉난방, 공기질."
  vi: "Kiến thức nền về hiệu suất môi trường của tòa nhà: nắng, thông gió, vỏ công trình, hệ thống kỹ thuật, sưởi, làm mát và chất lượng không khí."
  ms: "Asas prestasi alam sekitar bangunan: cahaya matahari, pengudaraan, sampul bangunan, servis, pemanasan, penyejukan dan kualiti udara."
  id: "Dasar kinerja lingkungan bangunan: sinar matahari, ventilasi, selubung bangunan, utilitas, pemanasan, pendinginan, dan kualitas udara."
  hi: "इमारतों के पर्यावरणीय प्रदर्शन की बुनियादी बातें: धूप, वेंटिलेशन, बाहरी ढांचा, सेवाएँ, हीटिंग-कूलिंग और हवा की गुणवत्ता।"
outcomes:
  - en: "Explain the physics behind building performance"
    zh: "解释建筑性能背后的物理原理"
    zh-TW: "解釋建築性能背後的物理原理"
    ja: "建物性能の背後にある物理を説明する"
    ko: "건물 성능의 물리적 원리 설명하기"
    vi: "Giải thích nguyên lý vật lý đằng sau hiệu suất tòa nhà"
    ms: "Terangkan fizik di sebalik prestasi bangunan"
    id: "Menjelaskan fisika di balik kinerja bangunan"
    hi: "इमारत के प्रदर्शन के पीछे की भौतिकी समझाना"
  - en: "Design for good performance and indoor quality"
    zh: "为良好性能和室内环境质量做设计"
    zh-TW: "為良好性能和室內環境品質做設計"
    ja: "高い性能と室内環境の質を目指して設計する"
    ko: "좋은 성능과 실내 환경 품질을 위한 설계"
    vi: "Thiết kế để đạt hiệu suất tốt và chất lượng trong nhà"
    ms: "Reka bentuk untuk prestasi baik dan kualiti dalaman"
    id: "Merancang untuk kinerja baik dan kualitas dalam ruang"
    hi: "अच्छे प्रदर्शन और अंदरूनी गुणवत्ता के लिए डिज़ाइन करना"
  - en: "Show building performance in sketches and visuals"
    zh: "用草图和图像表现建筑性能"
    zh-TW: "用草圖和圖像呈現建築性能"
    ja: "スケッチや図で建物性能を表現する"
    ko: "스케치와 시각 자료로 건물 성능 표현하기"
    vi: "Thể hiện hiệu suất tòa nhà bằng phác thảo và hình ảnh"
    ms: "Tunjukkan prestasi bangunan melalui lakaran dan visual"
    id: "Menampilkan kinerja bangunan lewat sketsa dan visual"
    hi: "स्केच और विज़ुअल से इमारत का प्रदर्शन दिखाना"
