code: ELEN90088
year: 2027
learn:
  en: "Continuous optimisation and machine learning basics, applied to IoT, power grids, security and networks."
  zh: "连续优化与机器学习基础，应用于物联网、电网、网络安全和通信网络。"
  zh-TW: "連續最佳化與機器學習基礎，應用於物聯網、電網、資訊安全與通訊網路。"
  ja: "連続最適化と機械学習の基礎を、IoT・電力網・セキュリティ・ネットワークに応用する。"
  ko: "연속 최적화와 머신러닝 기초를 IoT, 전력망, 보안, 네트워크에 적용합니다."
  vi: "Cơ bản về tối ưu liên tục và học máy, áp dụng cho IoT, lưới điện, an ninh mạng và mạng."
  ms: "Asas pengoptimuman selanjar dan pembelajaran mesin, digunakan untuk IoT, grid kuasa, keselamatan dan rangkaian."
  id: "Dasar optimisasi kontinu dan machine learning, diterapkan pada IoT, jaringan listrik, keamanan, dan jaringan."
  hi: "कंटीन्यूअस ऑप्टिमाइज़ेशन और मशीन लर्निंग की बुनियाद, IoT, पावर ग्रिड, सुरक्षा और नेटवर्क पर लागू।"
outcomes:
  - en: "Set up and solve constrained optimisation problems"
    zh: "建立并求解约束优化问题"
    zh-TW: "建立並求解約束最佳化問題"
    ja: "制約付き最適化問題を立てて解く"
    ko: "제약 최적화 문제 세우고 풀기"
    vi: "Lập và giải bài toán tối ưu có ràng buộc"
    ms: "Membina dan menyelesaikan masalah pengoptimuman berkekangan"
    id: "Menyusun dan menyelesaikan masalah optimisasi berkendala"
    hi: "बाधित ऑप्टिमाइज़ेशन समस्याएँ बनाना और हल करना"
  - en: "Use SVMs, neural networks and clustering on engineering data"
    zh: "在工程数据上使用 SVM、神经网络和聚类"
    zh-TW: "在工程資料上使用 SVM、神經網路與分群"
    ja: "工学データに SVM・ニューラルネット・クラスタリングを使う"
    ko: "공학 데이터에 SVM, 신경망, 군집화 적용하기"
    vi: "Dùng SVM, mạng nơ-ron và phân cụm trên dữ liệu kỹ thuật"
    ms: "Menggunakan SVM, rangkaian neural dan pengelompokan pada data kejuruteraan"
    id: "Memakai SVM, jaringan saraf, dan klasterisasi pada data teknik"
    hi: "इंजीनियरिंग डेटा पर SVM, न्यूरल नेटवर्क और क्लस्टरिंग का उपयोग"
  - en: "Present results in reports and videos"
    zh: "通过报告和视频展示结果"
    zh-TW: "透過報告與影片呈現結果"
    ja: "レポートや動画で結果を伝える"
    ko: "보고서와 영상으로 결과 발표하기"
    vi: "Trình bày kết quả qua báo cáo và video"
    ms: "Membentangkan hasil melalui laporan dan video"
    id: "Menyajikan hasil lewat laporan dan video"
    hi: "रिपोर्ट और वीडियो से नतीजे प्रस्तुत करना"
