code: MUSI30255
year: 2026
learn:
  en: "Advanced ear training for atonal and non-triadic sounds, including synthetic sound, on a path you shape yourself."
  zh: "针对无调性、非三和弦及合成声音的进阶练耳，学习路径自定。"
  zh-TW: "針對無調性、非三和弦及合成聲音的進階練耳，學習路徑自訂。"
  ja: "無調・非三和音や合成音の上級聴音。学ぶ道筋は自分で決める。"
  ko: "무조·비삼화음·합성음을 다루는 고급 청음. 학습 경로는 스스로 설계."
  vi: "Luyện tai nâng cao cho âm phi điệu tính và âm tổng hợp, lộ trình tự chọn."
  ms: "Latihan telinga lanjutan untuk bunyi atonal dan sintetik, laluan pilihan sendiri."
  id: "Latihan pendengaran lanjut untuk bunyi atonal dan sintetis, jalur pilihan sendiri."
  hi: "अतानवाली और सिंथेटिक ध्वनियों के लिए उन्नत कान प्रशिक्षण, अपना रास्ता खुद चुनें।"
outcomes:
  - en: "Hear and identify atonal and non-triadic material"
    zh: "听辨无调性与非三和弦材料"
    zh-TW: "聽辨無調性與非三和弦材料"
    ja: "無調・非三和音の素材を聴き分ける"
    ko: "무조·비삼화음 재료 듣고 구별하기"
    vi: "Nghe và nhận ra chất liệu phi điệu tính"
    ms: "Dengar dan kenal pasti bahan atonal"
    id: "Mendengar dan mengenali materi atonal"
    hi: "अतानवाली सामग्री सुनकर पहचानना"
  - en: "Tell acoustic and synthetic sounds apart"
    zh: "分辨原声与合成声音"
    zh-TW: "分辨原聲與合成聲音"
    ja: "アコースティック音と合成音を区別する"
    ko: "어쿠스틱과 합성음 구별하기"
    vi: "Phân biệt âm mộc và âm tổng hợp"
    ms: "Bezakan bunyi akustik dan sintetik"
    id: "Membedakan bunyi akustik dan sintetis"
    hi: "प्राकृतिक और सिंथेटिक ध्वनि में अंतर करना"
  - en: "Apply aural skills to your own musical needs"
    zh: "把听觉技能用于自己的音乐需要"
    zh-TW: "把聽覺技能用於自己的音樂需要"
    ja: "聴音力を自分の音楽活動に生かす"
    ko: "청음 기술을 내 음악에 적용하기"
    vi: "Áp dụng kỹ năng nghe vào nhu cầu riêng"
    ms: "Guna kemahiran dengar untuk keperluan sendiri"
    id: "Menerapkan kemampuan dengar untuk kebutuhan sendiri"
    hi: "कान के कौशल अपनी संगीत ज़रूरतों में लगाना"
