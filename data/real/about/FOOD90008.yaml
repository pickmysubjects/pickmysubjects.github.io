code: FOOD90008
year: 2027
learn:
  en: "Science behind food safety and quality, food chain regulation, risk analysis and HACCP food safety plans."
  zh: "食品安全与质量背后的科学、食品链法规、风险分析和HACCP食品安全计划。"
  zh-TW: "食品安全與品質背後的科學、食品鏈法規、風險分析與HACCP食品安全計畫。"
  ja: "食品の安全と品質の科学、フードチェーンの規制、リスク分析、HACCP計画。"
  ko: "식품 안전·품질의 과학, 식품 사슬 규제, 위험 분석과 HACCP 계획."
  vi: "Khoa học về an toàn và chất lượng thực phẩm, quy định chuỗi thực phẩm, phân tích rủi ro và kế hoạch HACCP."
  ms: "Sains keselamatan dan kualiti makanan, peraturan rantaian makanan, analisis risiko dan pelan HACCP."
  id: "Ilmu keamanan dan mutu pangan, regulasi rantai pangan, analisis risiko, dan rencana HACCP."
  hi: "खाद्य सुरक्षा और गुणवत्ता का विज्ञान, खाद्य शृंखला नियम, जोखिम विश्लेषण और HACCP योजनाएँ।"
outcomes:
  - en: "Analyse data with quality management tools"
    zh: "用质量管理工具分析数据"
    zh-TW: "用品質管理工具分析資料"
    ja: "品質管理ツールでデータを分析する"
    ko: "품질 관리 도구로 데이터 분석하기"
    vi: "Phân tích dữ liệu bằng công cụ quản lý chất lượng"
    ms: "Menganalisis data dengan alat pengurusan kualiti"
    id: "Menganalisis data dengan alat manajemen mutu"
    hi: "गुणवत्ता प्रबंधन उपकरणों से डेटा विश्लेषण"
  - en: "Identify risks in the food chain"
    zh: "识别食品链中的风险"
    zh-TW: "辨識食品鏈中的風險"
    ja: "フードチェーンのリスクを見つける"
    ko: "식품 사슬의 위험 찾기"
    vi: "Xác định rủi ro trong chuỗi thực phẩm"
    ms: "Mengenal pasti risiko dalam rantaian makanan"
    id: "Mengidentifikasi risiko dalam rantai pangan"
    hi: "खाद्य शृंखला में जोखिम पहचानना"
  - en: "Apply HACCP in a food safety plan"
    zh: "在食品安全计划中应用HACCP"
    zh-TW: "在食品安全計畫中應用HACCP"
    ja: "食品安全計画にHACCPを適用する"
    ko: "식품 안전 계획에 HACCP 적용하기"
    vi: "Áp dụng HACCP trong kế hoạch an toàn thực phẩm"
    ms: "Mengguna HACCP dalam pelan keselamatan makanan"
    id: "Menerapkan HACCP dalam rencana keamanan pangan"
    hi: "खाद्य सुरक्षा योजना में HACCP लागू करना"
