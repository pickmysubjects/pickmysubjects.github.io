code: MUSI10227
year: 2026
learn:
  en: "How music and society shape each other, through case studies from Indigenous Australia, Africa, Asia, Europe, the Americas and more."
  zh: "通过澳洲原住民、非洲、亚洲、欧洲、美洲等案例，了解音乐与社会如何相互塑造。"
  zh-TW: "透過澳洲原住民、非洲、亞洲、歐洲、美洲等案例，了解音樂與社會如何相互塑造。"
  ja: "オーストラリア先住民、アフリカ、アジア、欧州、米州などの事例から音楽と社会の関係を学ぶ。"
  ko: "호주 원주민, 아프리카, 아시아, 유럽, 아메리카 사례로 음악과 사회의 관계를 배운다."
  vi: "Âm nhạc và xã hội tác động lẫn nhau ra sao, qua các ví dụ từ thổ dân Úc, châu Phi, châu Á, châu Âu, châu Mỹ."
  ms: "Bagaimana muzik dan masyarakat saling membentuk, melalui kajian kes dari Orang Asli Australia, Afrika, Asia, Eropah dan Amerika."
  id: "Bagaimana musik dan masyarakat saling membentuk, lewat studi kasus dari Pribumi Australia, Afrika, Asia, Eropa, dan Amerika."
  hi: "ऑस्ट्रेलियाई मूलनिवासी, अफ्रीका, एशिया, यूरोप, अमेरिका के उदाहरणों से संगीत और समाज का रिश्ता समझना।"
outcomes:
  - en: "Recognise music traditions by ear"
    zh: "凭听觉辨认不同音乐传统"
    zh-TW: "憑聽覺辨認不同音樂傳統"
    ja: "耳で音楽の伝統を聞き分ける"
    ko: "귀로 음악 전통 구별하기"
    vi: "Nhận biết truyền thống âm nhạc qua tai nghe"
    ms: "Kenal tradisi muzik melalui pendengaran"
    id: "Mengenali tradisi musik lewat pendengaran"
    hi: "सुनकर संगीत परंपराएँ पहचानना"
  - en: "Link music-making to social life"
    zh: "把音乐创作与社会生活联系起来"
    zh-TW: "把音樂創作與社會生活連結起來"
    ja: "音楽活動と社会生活を結びつける"
    ko: "음악 활동을 사회생활과 연결하기"
    vi: "Liên hệ hoạt động âm nhạc với đời sống xã hội"
    ms: "Kaitkan aktiviti muzik dengan kehidupan sosial"
    id: "Mengaitkan bermusik dengan kehidupan sosial"
    hi: "संगीत को सामाजिक जीवन से जोड़ना"
  - en: "Write a researched essay on a music culture"
    zh: "撰写一篇关于某种音乐文化的研究论文"
    zh-TW: "撰寫一篇關於某種音樂文化的研究論文"
    ja: "ある音楽文化について調べて論文を書く"
    ko: "한 음악 문화에 대한 연구 에세이 쓰기"
    vi: "Viết tiểu luận nghiên cứu về một nền văn hóa âm nhạc"
    ms: "Tulis esei berkajian tentang budaya muzik"
    id: "Menulis esai riset tentang budaya musik"
    hi: "किसी संगीत संस्कृति पर शोध निबंध लिखना"
