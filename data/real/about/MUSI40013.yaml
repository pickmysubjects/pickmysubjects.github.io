code: MUSI40013
year: 2026
learn:
  en: "Keep composing with individual lessons, finish a 15-minute folio and present a short concert of your own works."
  zh: "继续在个别课中创作，完成15分钟作品集并举办一场自己作品的小型音乐会。"
  zh-TW: "繼續在個別課中創作，完成15分鐘作品集並舉辦一場自己作品的小型音樂會。"
  ja: "個人レッスンで作曲を続け、15分の作品集を仕上げ、自作の小さな演奏会を開く。"
  ko: "개인 레슨으로 작곡을 이어가며 15분 작품집을 완성하고 자작곡 소공연 열기."
  vi: "Tiếp tục sáng tác qua học riêng, hoàn thành tuyển tập 15 phút và tổ chức buổi hòa nhạc ngắn tác phẩm của mình."
  ms: "Teruskan menggubah dengan kelas individu, siapkan folio 15 minit dan persembahkan konsert pendek karya sendiri."
  id: "Terus menggubah lewat les privat, menyelesaikan folio 15 menit, dan mementaskan konser singkat karya sendiri."
  hi: "व्यक्तिगत पाठों में रचना जारी रखना, 15 मिनट का संग्रह पूरा करना और अपनी रचनाओं का छोटा कॉन्सर्ट देना।"
outcomes:
  - en: "Complete a polished folio of compositions"
    zh: "完成一部成熟的作品集"
    zh-TW: "完成一部成熟的作品集"
    ja: "完成度の高い作品集を仕上げる"
    ko: "완성도 높은 작품집 마무리하기"
    vi: "Hoàn thiện một tuyển tập sáng tác chỉn chu"
    ms: "Siapkan folio gubahan yang kemas"
    id: "Menyelesaikan folio komposisi yang matang"
    hi: "रचनाओं का परिष्कृत संग्रह पूरा करना"
  - en: "Present your own music to an audience"
    zh: "向听众呈现自己的音乐"
    zh-TW: "向聽眾呈現自己的音樂"
    ja: "自分の音楽を聴衆に届ける"
    ko: "자신의 음악을 청중에게 선보이기"
    vi: "Giới thiệu âm nhạc của mình trước khán giả"
    ms: "Persembahkan muzik sendiri kepada penonton"
    id: "Menampilkan musik sendiri di depan penonton"
    hi: "अपना संगीत श्रोताओं के सामने प्रस्तुत करना"
  - en: "Track and reflect on your composing process"
    zh: "记录并反思自己的创作过程"
    zh-TW: "記錄並反思自己的創作過程"
    ja: "作曲の過程を記録し振り返る"
    ko: "작곡 과정을 기록하고 성찰하기"
    vi: "Ghi lại và suy ngẫm quá trình sáng tác"
    ms: "Rekod dan renungkan proses menggubah"
    id: "Mencatat dan merefleksikan proses menggubah"
    hi: "अपनी रचना-प्रक्रिया दर्ज करना और उस पर सोचना"
