code: MAST90109
year: 2027
learn:
  en: "Part 2 of a supervised research project in data science, reported as a thesis and a talk."
  zh: "数据科学导师制研究项目第二部分，以论文和口头报告呈现。"
  zh-TW: "資料科學指導式研究專題第二部分，以論文與口頭報告呈現。"
  ja: "指導付きデータサイエンス研究の第2部。論文と口頭発表で報告。"
  ko: "지도 연구 프로젝트 2부(데이터 과학), 논문과 발표로 보고."
  vi: "Phần 2 dự án nghiên cứu có hướng dẫn về khoa học dữ liệu, báo cáo bằng luận văn và thuyết trình."
  ms: "Bahagian 2 projek penyelidikan berpenyelia dalam sains data, dilapor melalui tesis dan pembentangan."
  id: "Bagian 2 proyek riset terbimbing sains data, dilaporkan dalam tesis dan presentasi."
  hi: "डेटा साइंस में मार्गदर्शित रिसर्च प्रोजेक्ट का भाग 2, थीसिस और प्रस्तुति के साथ।"
outcomes:
  - en: "Complete a substantial piece of data science research"
    zh: "完成一项有分量的数据科学研究"
    zh-TW: "完成一項具份量的資料科學研究"
    ja: "まとまったデータサイエンス研究を仕上げる"
    ko: "상당한 규모의 데이터 과학 연구 완성하기"
    vi: "Hoàn thành một nghiên cứu khoa học dữ liệu đáng kể"
    ms: "Menyiapkan penyelidikan sains data yang besar"
    id: "Menyelesaikan riset sains data yang substansial"
    hi: "डेटा साइंस में ठोस रिसर्च पूरी करना"
  - en: "Report research in a thesis and an oral talk"
    zh: "以论文和口头报告汇报研究"
    zh-TW: "以論文與口頭報告呈現研究"
    ja: "研究を論文と口頭で報告する"
    ko: "논문과 구두 발표로 연구 보고하기"
    vi: "Báo cáo nghiên cứu bằng luận văn và thuyết trình"
    ms: "Melaporkan penyelidikan dalam tesis dan lisan"
    id: "Melaporkan riset lewat tesis dan presentasi lisan"
    hi: "रिसर्च को थीसिस और मौखिक प्रस्तुति में रखना"
