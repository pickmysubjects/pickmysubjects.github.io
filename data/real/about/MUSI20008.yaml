code: MUSI20008
year: 2026
learn:
  en: "Make music with MIDI, sampling and software synths, and trace a century of electronic music history."
  zh: "用MIDI、采样和软件合成器做音乐，并了解百年电子音乐史。"
  zh-TW: "用MIDI、取樣和軟體合成器做音樂，並了解百年電子音樂史。"
  ja: "MIDI・サンプリング・ソフトシンセで音楽を作り、電子音楽の100年史を学ぶ。"
  ko: "MIDI, 샘플링, 소프트웨어 신스로 음악을 만들고 전자음악 100년사를 배움."
  vi: "Làm nhạc bằng MIDI, sampling và synth phần mềm, tìm hiểu trăm năm nhạc điện tử."
  ms: "Hasilkan muzik dengan MIDI, pensampelan dan synth perisian, serta sejarah muzik elektronik."
  id: "Membuat musik dengan MIDI, sampling dan synth perangkat lunak, serta sejarah musik elektronik."
  hi: "MIDI, सैंपलिंग और सॉफ़्टवेयर सिंथ से संगीत बनाना और इलेक्ट्रॉनिक संगीत का इतिहास।"
outcomes:
  - en: "Explain MIDI, audio, sampling and synthesis"
    zh: "解释MIDI、音频、采样和合成"
    zh-TW: "解釋MIDI、音訊、取樣和合成"
    ja: "MIDI・音声・サンプリング・合成を説明する"
    ko: "MIDI, 오디오, 샘플링, 합성 설명하기"
    vi: "Giải thích MIDI, âm thanh, sampling, tổng hợp"
    ms: "Terangkan MIDI, audio, pensampelan dan sintesis"
    id: "Menjelaskan MIDI, audio, sampling dan sintesis"
    hi: "MIDI, ऑडियो, सैंपलिंग और सिंथेसिस समझाना"
  - en: "Produce a creative music project"
    zh: "完成一个原创音乐制作项目"
    zh-TW: "完成一個原創音樂製作專案"
    ja: "創作音楽プロジェクトを制作する"
    ko: "창작 음악 프로젝트 제작하기"
    vi: "Thực hiện một dự án âm nhạc sáng tạo"
    ms: "Hasilkan projek muzik kreatif"
    id: "Membuat proyek musik kreatif"
    hi: "एक रचनात्मक संगीत प्रोजेक्ट बनाना"
  - en: "Know key figures in electronic music"
    zh: "了解电子音乐的重要人物"
    zh-TW: "了解電子音樂的重要人物"
    ja: "電子音楽の重要人物を知る"
    ko: "전자음악의 주요 인물 알기"
    vi: "Biết các nhân vật chính của nhạc điện tử"
    ms: "Kenali tokoh utama muzik elektronik"
    id: "Mengenal tokoh penting musik elektronik"
    hi: "इलेक्ट्रॉनिक संगीत की प्रमुख हस्तियाँ जानना"
