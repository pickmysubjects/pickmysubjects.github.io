code: ACTL30012
year: 2027
learn:
  en: "More actuarial practice: solvency, experience and surplus analysis, wider uses of actuarial techniques and professionalism."
  zh: "精算实务进阶：偿付能力、经验分析、盈余分析、精算技术的更广应用和职业操守。"
  zh-TW: "精算實務進階：清償能力、經驗分析、盈餘分析、精算技術的更廣應用和專業操守。"
  ja: "アクチュアリー実務の続き：ソルベンシー、経験分析、剰余分析、技法の幅広い応用、職業倫理。"
  ko: "보험계리 실무 심화: 지급여력, 경험 분석, 잉여 분석, 계리 기법의 폭넓은 활용, 전문가 윤리."
  vi: "Thực hành định phí nâng cao: khả năng thanh toán, phân tích kinh nghiệm và thặng dư, ứng dụng rộng hơn và đạo đức nghề nghiệp."
  ms: "Amalan aktuari lanjutan: kesolvenan, analisis pengalaman dan lebihan, kegunaan lebih luas teknik aktuari serta profesionalisme."
  id: "Praktik aktuaria lanjutan: solvabilitas, analisis pengalaman dan surplus, penerapan teknik yang lebih luas, dan profesionalisme."
  hi: "एक्चुअरियल प्रैक्टिस आगे: सॉल्वेंसी, अनुभव व सरप्लस विश्लेषण, तकनीकों के व्यापक उपयोग और व्यावसायिकता।"
outcomes:
  - en: "Explain capital and apply basic solvency measures"
    zh: "解释资本的作用并运用基本偿付能力指标"
    zh-TW: "解釋資本的作用並運用基本清償能力指標"
    ja: "資本の重要性を説明し、基本的なソルベンシー指標を使う"
    ko: "자본의 중요성을 설명하고 기본 지급여력 지표 쓰기"
    vi: "Giải thích vai trò vốn và dùng thước đo khả năng thanh toán cơ bản"
    ms: "Terangkan modal dan guna ukuran kesolvenan asas"
    id: "Menjelaskan modal dan memakai ukuran solvabilitas dasar"
    hi: "पूँजी का महत्व समझाना और बुनियादी सॉल्वेंसी माप लगाना"
  - en: "Value and price liabilities, products and contracts"
    zh: "为负债、产品和合同估值定价"
    zh-TW: "為負債、產品和合約估值定價"
    ja: "負債・商品・契約を評価し価格を付ける"
    ko: "부채·상품·계약의 가치평가와 가격 책정"
    vi: "Định giá nợ phải trả, sản phẩm và hợp đồng"
    ms: "Nilai dan tetapkan harga liabiliti, produk dan kontrak"
    id: "Menilai dan menetapkan harga liabilitas, produk, dan kontrak"
    hi: "देनदारियों, उत्पादों और अनुबंधों का मूल्यांकन व मूल्य तय करना"
  - en: "Monitor experience and what it means for profits"
    zh: "跟踪经验数据并判断其对利润的影响"
    zh-TW: "追蹤經驗資料並判斷其對利潤的影響"
    ja: "実績を監視し、利益への影響を判断する"
    ko: "경험 실적을 점검하고 이익에 미치는 영향 판단하기"
    vi: "Theo dõi số liệu kinh nghiệm và tác động đến lợi nhuận"
    ms: "Pantau pengalaman dan kesannya pada keuntungan"
    id: "Memantau pengalaman dan dampaknya pada laba"
    hi: "अनुभव पर नज़र रखना और मुनाफ़े पर उसका असर समझना"
