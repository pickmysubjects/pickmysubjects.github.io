code: LING20010
year: 2026
learn:
  en: "How society and language shape each other: class, gender and ethnic varieties, multilingualism and language contact."
  zh: "社会和语言如何相互塑造：阶层、性别和族群变体，多语现象和语言接触。"
  zh-TW: "社會和語言如何相互形塑：階級、性別和族群變體，多語現象和語言接觸。"
  ja: "社会と言語が互いにどう形づくり合うか。階級・ジェンダー・民族による変種、多言語使用、言語接触。"
  ko: "사회와 언어가 서로를 어떻게 만드는지, 계층·젠더·민족에 따른 변이, 다중 언어 사용, 언어 접촉을 다룬다."
  vi: "Xã hội và ngôn ngữ định hình lẫn nhau ra sao: biến thể theo giai cấp, giới, dân tộc, đa ngữ và tiếp xúc ngôn ngữ."
  ms: "Cara masyarakat dan bahasa saling membentuk: variasi kelas, gender dan etnik, kepelbagaian bahasa dan pertembungan bahasa."
  id: "Cara masyarakat dan bahasa saling membentuk: ragam kelas, gender, dan etnis, multibahasa, dan kontak bahasa."
  hi: "समाज और भाषा एक-दूसरे को कैसे गढ़ते हैं: वर्ग, जेंडर व जातीय रूप, बहुभाषिकता और भाषा संपर्क।"
outcomes:
  - en: "Explain how social factors influence language"
    zh: "说明社会因素如何影响语言"
    zh-TW: "說明社會因素如何影響語言"
    ja: "社会的要因が言語にどう影響するか説明する"
    ko: "사회적 요인이 언어에 미치는 영향 설명하기"
    vi: "Giải thích yếu tố xã hội ảnh hưởng đến ngôn ngữ ra sao"
    ms: "Terangkan cara faktor sosial mempengaruhi bahasa"
    id: "Menjelaskan pengaruh faktor sosial pada bahasa"
    hi: "सामाजिक कारक भाषा पर कैसे असर डालते हैं, समझाना"
  - en: "Discuss methods in sociolinguistic research"
    zh: "讨论社会语言学的研究方法"
    zh-TW: "討論社會語言學的研究方法"
    ja: "社会言語学の研究方法を論じる"
    ko: "사회언어학 연구 방법 토론하기"
    vi: "Thảo luận phương pháp nghiên cứu ngôn ngữ học xã hội"
    ms: "Bincangkan kaedah kajian sosiolinguistik"
    id: "Membahas metode riset sosiolinguistik"
    hi: "समाजभाषाविज्ञान की शोध विधियों पर चर्चा करना"
  - en: "Analyse real language use across cultures"
    zh: "分析不同文化中真实的语言使用"
    zh-TW: "分析不同文化中真實的語言使用"
    ja: "文化を越えた実際の言語使用を分析する"
    ko: "여러 문화의 실제 언어 사용 분석하기"
    vi: "Phân tích cách dùng ngôn ngữ thực tế qua các nền văn hóa"
    ms: "Analisis penggunaan bahasa sebenar merentas budaya"
    id: "Menganalisis pemakaian bahasa nyata lintas budaya"
    hi: "अलग-अलग संस्कृतियों में असली भाषा प्रयोग का विश्लेषण करना"
