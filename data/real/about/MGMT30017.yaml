code: MGMT30017
year: 2026
learn:
  en: "A team consulting project with a host organisation overseas, working on a real issue it faces."
  zh: "在海外机构做团队咨询项目，解决对方面临的真实问题。"
  zh-TW: "在海外機構做團隊顧問專案，解決對方面臨的真實問題。"
  ja: "海外の受け入れ組織とチームでコンサル案件を行い、実際の課題に取り組む。"
  ko: "해외 기관과 함께 실제 문제를 다루는 팀 컨설팅 프로젝트."
  vi: "Dự án tư vấn theo nhóm với một tổ chức ở nước ngoài, giải quyết vấn đề thực tế của họ."
  ms: "Projek perundingan berkumpulan dengan organisasi tuan rumah di luar negara, menangani isu sebenar."
  id: "Proyek konsultasi tim bersama organisasi di luar negeri, menangani masalah nyata yang mereka hadapi."
  hi: "विदेश में किसी मेज़बान संगठन के साथ टीम कंसल्टिंग प्रोजेक्ट, उसकी असली समस्या पर काम।"
outcomes:
  - en: "Propose business solutions that are viable and sustainable"
    zh: "提出既可行又可持续的商业方案"
    zh-TW: "提出既可行又永續的商業方案"
    ja: "実行可能で持続可能なビジネス案を出す"
    ko: "실현 가능하고 지속가능한 사업 해법 제시하기"
    vi: "Đề xuất giải pháp kinh doanh khả thi và bền vững"
    ms: "Cadangkan penyelesaian perniagaan yang berdaya maju dan lestari"
    id: "Mengusulkan solusi bisnis yang layak dan berkelanjutan"
    hi: "व्यावहारिक और टिकाऊ बिज़नेस समाधान सुझाना"
  - en: "Work with stakeholders across cultures"
    zh: "与不同文化的利益相关者合作"
    zh-TW: "與不同文化的利害關係人合作"
    ja: "異文化の関係者と協力する"
    ko: "다양한 문화의 이해관계자와 협력하기"
    vi: "Làm việc với các bên liên quan đa văn hóa"
    ms: "Bekerja dengan pihak berkepentingan merentas budaya"
    id: "Bekerja dengan pemangku kepentingan lintas budaya"
    hi: "अलग-अलग संस्कृतियों के स्टेकहोल्डर के साथ काम करना"
  - en: "Build teamwork and time-management skills"
    zh: "培养团队合作和时间管理能力"
    zh-TW: "培養團隊合作和時間管理能力"
    ja: "チームワークと時間管理の力をつける"
    ko: "팀워크와 시간 관리 능력 기르기"
    vi: "Rèn kỹ năng làm việc nhóm và quản lý thời gian"
    ms: "Bina kemahiran kerja berpasukan dan urus masa"
    id: "Membangun kerja tim dan manajemen waktu"
    hi: "टीमवर्क और टाइम मैनेजमेंट की स्किल बनाना"
