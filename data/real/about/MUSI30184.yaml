code: MUSI30184
year: 2026
learn:
  en: "A second semester of the specialist string ensemble, with new string repertoire and performances. Audition entry."
  zh: "专业弦乐合奏第二学期，新曲目与新演出。需试音。"
  zh-TW: "專業弦樂合奏第二學期，新曲目與新演出。需試音。"
  ja: "弦楽アンサンブルの後期。新曲目と公演。オーディション制。"
  ko: "전문 현악 앙상블 2학기. 새 레퍼토리와 공연. 오디션."
  vi: "Học kỳ hai dàn dây chuyên sâu, tiết mục và buổi diễn mới. Thử giọng."
  ms: "Semester kedua ensembel bertali, repertoir dan persembahan baharu. Uji bakat."
  id: "Semester kedua ansambel gesek, repertoar dan pentas baru. Audisi."
  hi: "स्ट्रिंग समूह का दूसरा सत्र, नई रचनाएँ और प्रस्तुतियाँ। ऑडिशन।"
outcomes:
  - en: "Refine intonation and ensemble sound"
    zh: "打磨音准与整体音色"
    zh-TW: "打磨音準與整體音色"
    ja: "音程と合奏の響きを磨く"
    ko: "음정과 앙상블 음색 다듬기"
    vi: "Trau chuốt cao độ và âm sắc dàn"
    ms: "Halusi intonasi dan bunyi ensembel"
    id: "Menyempurnakan intonasi dan bunyi ansambel"
    hi: "सुर-शुद्धता और समूह ध्वनि निखारना"
  - en: "Learn new string ensemble works"
    zh: "学习新的弦乐合奏作品"
    zh-TW: "學習新的弦樂合奏作品"
    ja: "新しい弦楽合奏曲を学ぶ"
    ko: "새 현악 합주곡 익히기"
    vi: "Học tác phẩm hòa tấu dây mới"
    ms: "Pelajari karya ensembel tali baharu"
    id: "Mempelajari karya ansambel gesek baru"
    hi: "नई स्ट्रिंग समूह रचनाएँ सीखना"
  - en: "Pass an individual part test"
    zh: "通过个人声部测试"
    zh-TW: "通過個人聲部測試"
    ja: "個人パートテストに合格する"
    ko: "개인 파트 테스트 통과하기"
    vi: "Vượt qua bài kiểm tra bè cá nhân"
    ms: "Lulus ujian bahagian individu"
    id: "Lulus tes partisi individu"
    hi: "व्यक्तिगत भाग परीक्षा पास करना"
