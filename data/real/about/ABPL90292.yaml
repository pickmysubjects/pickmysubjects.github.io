code: ABPL90292
year: 2027
learn:
  en: "How low-rise homes are built in Australia: materials, structure, methods, standards, services and maintenance."
  zh: "澳大利亚低层住宅如何建造：材料、结构、施工方法、标准、设备和维护。"
  zh-TW: "澳洲低層住宅如何建造：材料、結構、施工方法、標準、設備與維護。"
  ja: "オーストラリアの低層住宅の建て方：材料、構造、工法、基準、設備、維持管理。"
  ko: "호주 저층 주택의 시공: 자재, 구조, 공법, 기준, 설비, 유지관리."
  vi: "Cách xây nhà thấp tầng ở Úc: vật liệu, kết cấu, phương pháp, tiêu chuẩn, bảo trì."
  ms: "Cara rumah bertingkat rendah dibina di Australia: bahan, struktur, kaedah, piawaian dan penyelenggaraan."
  id: "Cara rumah bertingkat rendah dibangun di Australia: material, struktur, metode, standar, perawatan."
  hi: "ऑस्ट्रेलिया में कम ऊंचाई वाले घर कैसे बनते हैं: सामग्री, संरचना, विधियां, मानक और रखरखाव।"
outcomes:
  - en: "Explain Australian residential building methods"
    zh: "解释澳大利亚住宅建造方法"
    zh-TW: "解釋澳洲住宅建造方法"
    ja: "オーストラリアの住宅工法を説明する"
    ko: "호주 주택 시공 방법 설명하기"
    vi: "Giải thích phương pháp xây nhà ở Úc"
    ms: "Menerangkan kaedah pembinaan kediaman Australia"
    id: "Menjelaskan metode konstruksi rumah di Australia"
    hi: "ऑस्ट्रेलियाई आवासीय निर्माण विधियां समझाना"
  - en: "Relate material choice to building performance"
    zh: "将材料选择与建筑性能联系起来"
    zh-TW: "將材料選擇與建築性能連結"
    ja: "材料選択と建物性能を結びつける"
    ko: "자재 선택과 건물 성능 연결하기"
    vi: "Liên hệ chọn vật liệu với hiệu năng công trình"
    ms: "Mengaitkan pilihan bahan dengan prestasi bangunan"
    id: "Mengaitkan pilihan material dengan kinerja bangunan"
    hi: "सामग्री चयन को भवन प्रदर्शन से जोड़ना"
