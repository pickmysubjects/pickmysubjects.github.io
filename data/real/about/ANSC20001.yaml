code: ANSC20001
year: 2026
learn:
  en: "How farm and domestic animal bodies work: nerves, digestion, circulation, breathing, growth and development."
  zh: "家畜身体如何运作：神经、消化、循环、呼吸和生长发育。"
  zh-TW: "家畜身體如何運作：神經、消化、循環、呼吸與生長發育。"
  ja: "家畜の体のしくみ：神経、消化、循環、呼吸、成長と発育。"
  ko: "가축의 몸이 작동하는 방식: 신경, 소화, 순환, 호흡, 성장과 발달."
  vi: "Cơ thể vật nuôi hoạt động ra sao: thần kinh, tiêu hóa, tuần hoàn, hô hấp, tăng trưởng."
  ms: "Cara badan haiwan ternakan berfungsi: saraf, pencernaan, peredaran, pernafasan dan tumbesaran."
  id: "Cara tubuh hewan ternak bekerja: saraf, pencernaan, sirkulasi, pernapasan, dan pertumbuhan."
  hi: "पालतू व फ़ार्म जानवरों का शरीर कैसे काम करता है: नसें, पाचन, रक्तसंचार, श्वसन और विकास।"
outcomes:
  - en: "Describe the main body systems of domestic animals"
    zh: "描述家畜的主要身体系统"
    zh-TW: "描述家畜的主要身體系統"
    ja: "家畜の主な器官系を説明する"
    ko: "가축의 주요 신체 계통 설명하기"
    vi: "Mô tả các hệ cơ quan chính của vật nuôi"
    ms: "Huraikan sistem badan utama haiwan ternakan"
    id: "Menjelaskan sistem tubuh utama hewan ternak"
    hi: "पालतू जानवरों के मुख्य शरीर तंत्र समझाना"
  - en: "Run physiology experiments and interpret the data"
    zh: "做生理实验并解读数据"
    zh-TW: "做生理實驗並解讀數據"
    ja: "生理学の実験を行いデータを解釈する"
    ko: "생리학 실험을 하고 데이터 해석하기"
    vi: "Làm thí nghiệm sinh lý và diễn giải dữ liệu"
    ms: "Jalankan eksperimen fisiologi dan tafsir data"
    id: "Melakukan eksperimen fisiologi dan menafsirkan data"
    hi: "शरीरक्रिया प्रयोग करना और डेटा समझना"
