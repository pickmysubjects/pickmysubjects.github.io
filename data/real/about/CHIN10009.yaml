code: CHIN10009
year: 2026
learn:
  en: "Chinese film and fiction since 1978, used to sharpen your reading and listening, including everyday and regional speech."
  zh: "通过 1978 年以来的中国电影和小说，提高阅读和听力，包括口语和方言用法。"
  zh-TW: "透過 1978 年以來的中國電影和小說，提高閱讀和聽力，包括口語和方言用法。"
  ja: "1978年以降の中国映画と小説を通して、口語や地方の言葉も含めた読解力と聴解力を伸ばす。"
  ko: "1978년 이후 중국 영화와 소설로 구어와 지역 말을 포함한 읽기·듣기 실력을 높인다."
  vi: "Phim và tiểu thuyết Trung Quốc từ 1978 để rèn đọc và nghe, kể cả khẩu ngữ và tiếng địa phương."
  ms: "Filem dan fiksyen China sejak 1978 untuk mengasah bacaan dan pendengaran, termasuk bahasa harian dan dialek."
  id: "Film dan fiksi Tiongkok sejak 1978 untuk mengasah membaca dan menyimak, termasuk bahasa sehari-hari dan dialek."
  hi: "1978 के बाद की चीनी फ़िल्में और कथा-साहित्य, पढ़ने-सुनने की क्षमता बढ़ाने के लिए, बोलचाल व क्षेत्रीय भाषा समेत।"
outcomes:
  - en: "Understand Chinese films and texts in the original"
    zh: "看懂中文电影和文本原作"
    zh-TW: "看懂中文電影和文本原作"
    ja: "中国語の映画や文章を原語で理解する"
    ko: "중국어 영화와 글을 원어로 이해하기"
    vi: "Hiểu phim và văn bản tiếng Trung nguyên bản"
    ms: "Fahami filem dan teks Cina dalam bahasa asal"
    id: "Memahami film dan teks Mandarin dalam bahasa aslinya"
    hi: "चीनी फ़िल्में और पाठ मूल भाषा में समझना"
  - en: "Read film and literary criticism in Chinese"
    zh: "阅读中文影评和文学评论"
    zh-TW: "閱讀中文影評和文學評論"
    ja: "中国語の映画評や文学批評を読む"
    ko: "중국어 영화·문학 비평 읽기"
    vi: "Đọc phê bình phim và văn học bằng tiếng Trung"
    ms: "Baca kritikan filem dan sastera dalam bahasa Cina"
    id: "Membaca kritik film dan sastra dalam bahasa Mandarin"
    hi: "चीनी में फ़िल्म और साहित्य आलोचना पढ़ना"
  - en: "Present your analysis of a work in Chinese"
    zh: "用中文报告你对作品的分析"
    zh-TW: "用中文報告你對作品的分析"
    ja: "作品の分析を中国語で発表する"
    ko: "작품 분석을 중국어로 발표하기"
    vi: "Trình bày phân tích tác phẩm bằng tiếng Trung"
    ms: "Bentangkan analisis karya dalam bahasa Cina"
    id: "Mempresentasikan analisis karya dalam bahasa Mandarin"
    hi: "किसी रचना का विश्लेषण चीनी में प्रस्तुत करना"
