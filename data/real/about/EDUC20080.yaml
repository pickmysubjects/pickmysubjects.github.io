code: EDUC20080
year: 2026
learn:
  en: "Work as a classroom assistant in a Victorian school for 20 hours, with workshops on schools and current issues in education."
  zh: "在维州学校当20小时课堂助理，并参加教育议题研讨。"
  zh-TW: "在維州學校當20小時課堂助理，並參加教育議題研討。"
  ja: "ビクトリア州の学校で20時間の授業補助をし、教育の課題をワークショップで学ぶ。"
  ko: "빅토리아주 학교에서 20시간 수업 보조를 하고 교육 현안을 워크숍에서 다루기."
  vi: "Làm trợ giảng 20 giờ ở một trường tại Victoria, kèm hội thảo về giáo dục hiện nay."
  ms: "Bertugas sebagai pembantu kelas 20 jam di sekolah Victoria, dengan bengkel isu pendidikan semasa."
  id: "Menjadi asisten kelas 20 jam di sekolah Victoria, plus lokakarya soal isu pendidikan terkini."
  hi: "विक्टोरिया के एक स्कूल में 20 घंटे क्लासरूम सहायक बनना, साथ में शिक्षा मुद्दों पर वर्कशॉप।"
outcomes:
  - en: "Understand how student diversity affects learning"
    zh: "理解学生多样性如何影响学习"
    zh-TW: "理解學生多樣性如何影響學習"
    ja: "生徒の多様性が学びに与える影響を理解する"
    ko: "학생 다양성이 학습에 미치는 영향 이해하기"
    vi: "Hiểu sự đa dạng học sinh ảnh hưởng việc học ra sao"
    ms: "Fahami kesan kepelbagaian murid pada pembelajaran"
    id: "Memahami pengaruh keragaman siswa pada belajar"
    hi: "छात्रों की विविधता सीखने को कैसे प्रभावित करती है, समझना"
  - en: "Discuss current issues facing schools"
    zh: "讨论学校面临的当前问题"
    zh-TW: "討論學校面臨的當前問題"
    ja: "学校が直面する課題について議論する"
    ko: "학교가 마주한 현안 논의하기"
    vi: "Thảo luận các vấn đề trường học đang gặp"
    ms: "Bincangkan isu semasa yang dihadapi sekolah"
    id: "Membahas isu terkini yang dihadapi sekolah"
    hi: "स्कूलों के सामने मौजूदा मुद्दों पर चर्चा करना"
  - en: "Reflect on your own classroom experience"
    zh: "反思自己的课堂实践经历"
    zh-TW: "反思自己的課堂實習經歷"
    ja: "自分の教室での経験を振り返る"
    ko: "내 교실 경험 성찰하기"
    vi: "Suy ngẫm trải nghiệm trên lớp của bản thân"
    ms: "Renungkan pengalaman sendiri di bilik darjah"
    id: "Merefleksikan pengalaman sendiri di kelas"
    hi: "अपने क्लासरूम अनुभव पर विचार करना"
