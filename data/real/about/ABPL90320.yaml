code: ABPL90320
year: 2027
learn:
  en: "How to plan, design and manage settlements that can cope with climate change and disasters."
  zh: "如何规划、设计和管理能应对气候变化与灾害的人类聚落。"
  zh-TW: "如何規劃、設計和管理能應對氣候變遷與災害的人類聚落。"
  ja: "気候変動や災害に耐えられる居住地の計画・設計・管理。"
  ko: "기후변화와 재난에 견디는 정주지를 계획·설계·관리하는 법."
  vi: "Cách quy hoạch, thiết kế và quản lý khu dân cư chống chịu biến đổi khí hậu và thiên tai."
  ms: "Cara merancang, mereka dan mengurus penempatan yang tahan perubahan iklim dan bencana."
  id: "Cara merencanakan, mendesain, dan mengelola permukiman yang tahan perubahan iklim dan bencana."
  hi: "जलवायु परिवर्तन और आपदाओं को झेल सकने वाली बस्तियों की योजना, डिज़ाइन और प्रबंधन।"
outcomes:
  - en: "Discuss what makes a settlement resilient"
    zh: "探讨聚落韧性的关键问题"
    zh-TW: "探討聚落韌性的關鍵問題"
    ja: "居住地のレジリエンスを論じる"
    ko: "정주지 회복력 논의하기"
    vi: "Thảo luận yếu tố giúp khu dân cư bền vững"
    ms: "Membincangkan ketahanan sesebuah penempatan"
    id: "Membahas apa yang membuat permukiman tangguh"
    hi: "बस्ती को लचीला बनाने वाले मुद्दों पर चर्चा"
  - en: "Propose plans that protect communities"
    zh: "提出保护社区的规划方案"
    zh-TW: "提出保護社區的規劃方案"
    ja: "地域を守る計画を提案する"
    ko: "공동체를 보호하는 계획 제안하기"
    vi: "Đề xuất phương án bảo vệ cộng đồng"
    ms: "Mencadangkan pelan yang melindungi komuniti"
    id: "Mengusulkan rencana yang melindungi masyarakat"
    hi: "समुदायों की रक्षा करने वाली योजना प्रस्तावित करना"
