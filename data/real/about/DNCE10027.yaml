code: DNCE10027
year: 2026
learn:
  en: "Beginner dance workshops in styles like contemporary and street, and using them to make your own choreography."
  zh: "现代舞、街舞等风格的入门舞蹈工作坊，并用来编排自己的舞蹈。"
  zh-TW: "現代舞、街舞等風格的入門舞蹈工作坊，並用來編排自己的舞蹈。"
  ja: "コンテンポラリーやストリートなどの入門ダンスワークショップと、それを使った振付づくり。"
  ko: "컨템퍼러리·스트리트 등 입문 댄스 워크숍과 이를 활용한 안무 만들기."
  vi: "Workshop múa nhập môn (đương đại, đường phố...) và dùng chúng để tự biên đạo."
  ms: "Bengkel tarian asas gaya kontemporari dan jalanan, serta menggunakannya untuk mencipta koreografi sendiri."
  id: "Lokakarya tari dasar gaya kontemporer dan jalanan, lalu memakainya untuk membuat koreografi sendiri."
  hi: "कंटेम्पररी, स्ट्रीट जैसी शैलियों की शुरुआती डांस वर्कशॉप और उनसे अपनी कोरियोग्राफी बनाना।"
outcomes:
  - en: "Use basic dance techniques to express ideas"
    zh: "用基础舞蹈技巧表达想法"
    zh-TW: "用基礎舞蹈技巧表達想法"
    ja: "基本的なダンス技術で考えを表現する"
    ko: "기본 춤 기술로 생각 표현하기"
    vi: "Dùng kỹ thuật múa cơ bản để thể hiện ý tưởng"
    ms: "Guna teknik tarian asas untuk meluahkan idea"
    id: "Memakai teknik tari dasar untuk mengekspresikan ide"
    hi: "बुनियादी नृत्य तकनीकों से विचार व्यक्त करना"
  - en: "Create short choreography and work with a group"
    zh: "编排短舞并与小组合作"
    zh-TW: "編排短舞並與小組合作"
    ja: "短い振付を作り、グループで協力する"
    ko: "짧은 안무를 만들고 그룹과 협업하기"
    vi: "Biên đạo bài ngắn và làm việc nhóm"
    ms: "Cipta koreografi pendek dan bekerja dalam kumpulan"
    id: "Membuat koreografi pendek dan bekerja dalam kelompok"
    hi: "छोटी कोरियोग्राफी बनाना और समूह में काम करना"
  - en: "Build strength, coordination and flexibility"
    zh: "提升力量、协调性和柔韧性"
    zh-TW: "提升力量、協調性和柔軟度"
    ja: "筋力・協調性・柔軟性を高める"
    ko: "근력·협응력·유연성 키우기"
    vi: "Tăng sức mạnh, sự phối hợp và độ dẻo"
    ms: "Bina kekuatan, koordinasi dan kelenturan"
    id: "Meningkatkan kekuatan, koordinasi dan kelenturan"
    hi: "ताकत, तालमेल और लचीलापन बढ़ाना"
