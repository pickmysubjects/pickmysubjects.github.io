code: ENEN90028
year: 2027
learn:
  en: "Planning and running environmental monitoring, with a four-day field camp and data analysis."
  zh: "规划并开展环境监测，包括四天野外营地和数据分析。"
  zh-TW: "規劃並進行環境監測，包括四天野外營隊與資料分析。"
  ja: "4 日間のフィールドキャンプを含む、環境モニタリングの計画・実施とデータ分析。"
  ko: "4일간의 현장 캠프를 포함한 환경 모니터링 계획·실시와 데이터 분석."
  vi: "Lập kế hoạch và thực hiện quan trắc môi trường, có trại thực địa bốn ngày và phân tích dữ liệu."
  ms: "Merancang dan menjalankan pemantauan alam sekitar, dengan kem lapangan empat hari dan analisis data."
  id: "Merencanakan dan menjalankan pemantauan lingkungan, dengan kemah lapangan empat hari dan analisis data."
  hi: "चार दिन के फ़ील्ड कैंप और डेटा विश्लेषण के साथ पर्यावरण निगरानी की योजना बनाना और चलाना।"
outcomes:
  - en: "Design a monitoring program for a client"
    zh: "为客户设计监测方案"
    zh-TW: "為客戶設計監測方案"
    ja: "クライアント向けにモニタリング計画を立てる"
    ko: "고객을 위한 모니터링 프로그램 설계하기"
    vi: "Thiết kế chương trình quan trắc cho khách hàng"
    ms: "Mereka bentuk program pemantauan untuk pelanggan"
    id: "Merancang program pemantauan untuk klien"
    hi: "ग्राहक के लिए निगरानी कार्यक्रम डिज़ाइन करना"
  - en: "Choose sensors and sampling methods and use them in the field"
    zh: "选择传感器和采样方法并在野外使用"
    zh-TW: "選擇感測器與採樣方法並在野外使用"
    ja: "センサーと採取方法を選び現場で使う"
    ko: "센서와 샘플링 방법을 골라 현장에서 쓰기"
    vi: "Chọn cảm biến, phương pháp lấy mẫu và dùng ngoài thực địa"
    ms: "Memilih penderia dan kaedah persampelan serta menggunakannya di lapangan"
    id: "Memilih sensor dan metode sampling lalu memakainya di lapangan"
    hi: "सेंसर और सैंपलिंग विधियाँ चुनकर फ़ील्ड में इस्तेमाल करना"
  - en: "Analyse and interpret monitoring data"
    zh: "分析并解读监测数据"
    zh-TW: "分析並解讀監測資料"
    ja: "モニタリングデータを分析・解釈する"
    ko: "모니터링 데이터 분석 및 해석하기"
    vi: "Phân tích và diễn giải dữ liệu quan trắc"
    ms: "Menganalisis dan mentafsir data pemantauan"
    id: "Menganalisis dan menafsirkan data pemantauan"
    hi: "निगरानी डेटा का विश्लेषण और व्याख्या"
