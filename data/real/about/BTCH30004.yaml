code: BTCH30004
year: 2027
learn:
  en: "Hands-on biomanufacturing: running bioreactors, growing and purifying products, and working to GMP quality rules."
  zh: "动手学生物制造：操作生物反应器、培养和纯化产品，并遵守GMP质量规范。"
  zh-TW: "動手學生物製造：操作生物反應器、培養和純化產品，並遵守GMP品質規範。"
  ja: "実践的なバイオ製造：バイオリアクターを動かし、生産物を培養・精製し、GMPの品質基準に沿って作業する。"
  ko: "실습 중심 바이오 제조: 생물반응기 운영, 생산물 배양·정제, GMP 품질 기준 준수."
  vi: "Thực hành sản xuất sinh học: vận hành bể phản ứng sinh học, nuôi cấy và tinh chế sản phẩm, làm việc theo chuẩn GMP."
  ms: "Biopembuatan secara praktikal: kendali bioreaktor, kultur dan tulenkan produk, serta bekerja mengikut peraturan kualiti GMP."
  id: "Praktik biomanufaktur: mengoperasikan bioreaktor, membiakkan dan memurnikan produk, serta bekerja sesuai standar mutu GMP."
  hi: "प्रैक्टिकल बायोमैन्युफैक्चरिंग: बायोरिएक्टर चलाना, उत्पाद उगाना व शुद्ध करना, और GMP गुणवत्ता नियमों के अनुसार काम करना।"
outcomes:
  - en: "Plan the growing, harvesting and purifying of a bio-product"
    zh: "规划生物产品的培养、收获和纯化"
    zh-TW: "規劃生物產品的培養、收穫和純化"
    ja: "生物製品の培養・回収・精製を計画する"
    ko: "생물 제품의 배양·수확·정제 계획하기"
    vi: "Lập kế hoạch nuôi cấy, thu hoạch và tinh chế sản phẩm sinh học"
    ms: "Rancang kultur, penuaian dan penulenan produk bio"
    id: "Merencanakan pembiakan, panen, dan pemurnian produk hayati"
    hi: "जैविक उत्पाद को उगाने, निकालने और शुद्ध करने की योजना बनाना"
  - en: "Apply GMP, quality and SOP rules"
    zh: "应用GMP、质量保证和SOP规范"
    zh-TW: "應用GMP、品質保證和SOP規範"
    ja: "GMP・品質保証・SOPのルールを適用する"
    ko: "GMP, 품질보증, SOP 규칙 적용하기"
    vi: "Áp dụng quy tắc GMP, đảm bảo chất lượng và SOP"
    ms: "Guna peraturan GMP, jaminan kualiti dan SOP"
    id: "Menerapkan aturan GMP, jaminan mutu, dan SOP"
    hi: "GMP, गुणवत्ता और SOP नियम लागू करना"
  - en: "Analyse process data for quality and yield"
    zh: "分析工艺数据，评估质量和产量"
    zh-TW: "分析製程資料，評估品質和產量"
    ja: "工程データを分析し品質と収率を評価する"
    ko: "공정 데이터 분석으로 품질과 수율 평가하기"
    vi: "Phân tích dữ liệu quy trình về chất lượng và năng suất"
    ms: "Analisis data proses untuk kualiti dan hasil"
    id: "Menganalisis data proses untuk mutu dan hasil"
    hi: "गुणवत्ता और उपज के लिए प्रोसेस डेटा का विश्लेषण करना"
