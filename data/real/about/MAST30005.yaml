code: MAST30005
year: 2026
learn:
  en: "The rules shared by integers, polynomials and matrices: rings, modules, fields and Galois theory."
  zh: "整数、多项式和矩阵共有的代数规律：环、模、域和伽罗瓦理论。"
  zh-TW: "整數、多項式和矩陣共有的代數規律：環、模、體和伽羅瓦理論。"
  ja: "整数・多項式・行列に共通する規則：環・加群・体・ガロア理論。"
  ko: "정수, 다항식, 행렬이 공유하는 규칙: 환, 가군, 체, 갈루아 이론."
  vi: "Quy luật chung của số nguyên, đa thức và ma trận: vành, môđun, trường và lý thuyết Galois."
  ms: "Peraturan yang dikongsi integer, polinomial dan matriks: gelang, modul, medan dan teori Galois."
  id: "Aturan bersama bilangan bulat, polinomial, dan matriks: ring, modul, lapangan, dan teori Galois."
  hi: "पूर्णांक, बहुपद और मैट्रिक्स के साझा नियम: रिंग, मॉड्यूल, फ़ील्ड और गैलोआ सिद्धांत।"
outcomes:
  - en: "Apply the Euclidean algorithm, including to polynomials"
    zh: "用欧几里得算法，包括多项式"
    zh-TW: "會用歐幾里得演算法，包括多項式"
    ja: "多項式も含めユークリッドの互除法を使う"
    ko: "다항식을 포함해 유클리드 알고리즘 적용하기"
    vi: "Áp dụng thuật toán Euclid, kể cả cho đa thức"
    ms: "Menggunakan algoritma Euclid, termasuk untuk polinomial"
    id: "Menerapkan algoritma Euklides, termasuk pada polinomial"
    hi: "यूक्लिड एल्गोरिद्म लागू करना, बहुपदों पर भी"
  - en: "Prove results about rings, modules and fields"
    zh: "证明关于环、模、域的结论"
    zh-TW: "證明關於環、模、體的結論"
    ja: "環・加群・体についての結果を証明する"
    ko: "환, 가군, 체에 관한 결과 증명하기"
    vi: "Chứng minh kết quả về vành, môđun và trường"
    ms: "Membuktikan hasil tentang gelang, modul dan medan"
    id: "Membuktikan hasil tentang ring, modul, dan lapangan"
    hi: "रिंग, मॉड्यूल और फ़ील्ड के परिणाम सिद्ध करना"
  - en: "Calculate the Jordan normal form of a matrix"
    zh: "算矩阵的若尔当标准形"
    zh-TW: "算矩陣的約當標準形"
    ja: "行列のジョルダン標準形を計算する"
    ko: "행렬의 조르당 표준형 계산하기"
    vi: "Tính dạng chuẩn Jordan của ma trận"
    ms: "Mengira bentuk normal Jordan bagi matriks"
    id: "Menghitung bentuk normal Jordan suatu matriks"
    hi: "मैट्रिक्स का जॉर्डन नॉर्मल फ़ॉर्म निकालना"
