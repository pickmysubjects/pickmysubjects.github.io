code: ITAL30014
year: 2026
learn:
  en: "Advanced Italian through short stories, a theatre project, a virtual exchange with students in Italy, and pronunciation."
  zh: "通过短篇小说、戏剧项目、与意大利学生的线上交流和语音学习高级意大利语。"
  zh-TW: "透過短篇小說、戲劇專案、與義大利學生的線上交流和語音學習高級義大利語。"
  ja: "短編小説、演劇プロジェクト、イタリアの学生とのオンライン交流、発音を通して上級イタリア語を学ぶ。"
  ko: "단편소설, 연극 프로젝트, 이탈리아 학생과의 온라인 교류, 발음 공부로 고급 이탈리아어를 배운다."
  vi: "Tiếng Ý nâng cao qua truyện ngắn, dự án sân khấu, giao lưu trực tuyến với sinh viên Ý và luyện phát âm."
  ms: "Bahasa Itali lanjutan melalui cerpen, projek teater, pertukaran maya dengan pelajar di Itali, dan sebutan."
  id: "Bahasa Italia lanjut lewat cerpen, proyek teater, pertukaran virtual dengan mahasiswa di Italia, dan pelafalan."
  hi: "छोटी कहानियों, थिएटर प्रोजेक्ट, इटली के छात्रों से ऑनलाइन आदान-प्रदान और उच्चारण के ज़रिए उन्नत इतालवी।"
outcomes:
  - en: "Discuss social and cultural topics in Italian"
    zh: "用意大利语讨论社会和文化话题"
    zh-TW: "用義大利語討論社會和文化話題"
    ja: "社会や文化の話題をイタリア語で話し合う"
    ko: "사회·문화 주제를 이탈리아어로 토론하기"
    vi: "Thảo luận chủ đề xã hội, văn hóa bằng tiếng Ý"
    ms: "Bincangkan topik sosial dan budaya dalam bahasa Itali"
    id: "Membahas topik sosial dan budaya dalam bahasa Italia"
    hi: "सामाजिक और सांस्कृतिक विषयों पर इतालवी में चर्चा करना"
  - en: "Read and write longer Italian texts"
    zh: "读写较长的意大利语文章"
    zh-TW: "讀寫較長的義大利語文章"
    ja: "長めのイタリア語の文章を読み書きする"
    ko: "긴 이탈리아어 글 읽고 쓰기"
    vi: "Đọc và viết văn bản tiếng Ý dài hơn"
    ms: "Baca dan tulis teks bahasa Itali yang lebih panjang"
    id: "Membaca dan menulis teks bahasa Italia yang lebih panjang"
    hi: "लंबे इतालवी पाठ पढ़ना-लिखना"
  - en: "Give a clear presentation in Italian"
    zh: "用意大利语做清楚的口头报告"
    zh-TW: "用義大利語做清楚的口頭報告"
    ja: "イタリア語で分かりやすく発表する"
    ko: "이탈리아어로 명확하게 발표하기"
    vi: "Thuyết trình rõ ràng bằng tiếng Ý"
    ms: "Buat pembentangan yang jelas dalam bahasa Itali"
    id: "Melakukan presentasi yang jelas dalam bahasa Italia"
    hi: "इतालवी में स्पष्ट प्रस्तुति देना"
