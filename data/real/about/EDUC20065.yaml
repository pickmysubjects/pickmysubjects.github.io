code: EDUC20065
year: 2026
learn:
  en: "Learning from the University's museums, rare books and archives, and how these collections shape knowledge and power."
  zh: "通过大学的博物馆、珍本和档案学习，思考藏品如何塑造知识与权力。"
  zh-TW: "透過大學的博物館、珍本和檔案學習，思考館藏如何形塑知識與權力。"
  ja: "大学の博物館・貴重書・アーカイブから学び、収蔵品が知と権力をどう形づくるか考える。"
  ko: "대학의 박물관·희귀 도서·기록물로 배우고, 소장품이 지식과 권력을 어떻게 만드는지 탐구."
  vi: "Học từ bảo tàng, sách quý và kho lưu trữ của trường, và cách các bộ sưu tập định hình tri thức, quyền lực."
  ms: "Belajar daripada muzium, buku nadir dan arkib universiti, serta cara koleksi membentuk ilmu dan kuasa."
  id: "Belajar dari museum, buku langka dan arsip kampus, serta cara koleksi membentuk pengetahuan dan kekuasaan."
  hi: "विश्वविद्यालय के संग्रहालयों, दुर्लभ पुस्तकों और अभिलेखों से सीखना, और संग्रह ज्ञान व सत्ता को कैसे गढ़ते हैं।"
outcomes:
  - en: "Learn from real objects in cultural collections"
    zh: "通过文化藏品中的实物学习"
    zh-TW: "透過文化館藏中的實物學習"
    ja: "文化コレクションの実物から学ぶ"
    ko: "문화 소장품의 실물로 배우기"
    vi: "Học từ hiện vật thật trong bộ sưu tập văn hóa"
    ms: "Belajar daripada objek sebenar dalam koleksi budaya"
    id: "Belajar dari benda nyata dalam koleksi budaya"
    hi: "सांस्कृतिक संग्रहों की असली वस्तुओं से सीखना"
  - en: "Reflect on contested readings of collections"
    zh: "反思对藏品的不同甚至争议性解读"
    zh-TW: "反思對館藏的不同甚至具爭議的解讀"
    ja: "収蔵品をめぐる対立する解釈を考察する"
    ko: "소장품에 대한 엇갈린 해석 성찰하기"
    vi: "Suy ngẫm về những cách hiểu gây tranh cãi về bộ sưu tập"
    ms: "Merenung tafsiran koleksi yang dipertikaikan"
    id: "Merefleksikan tafsiran koleksi yang diperdebatkan"
    hi: "संग्रहों की विवादित व्याख्याओं पर विचार करना"
  - en: "Link collections to knowledge and learning"
    zh: "把藏品与知识和学习联系起来"
    zh-TW: "把館藏與知識和學習連結起來"
    ja: "収蔵品を知識と学びに結びつける"
    ko: "소장품을 지식·학습과 연결하기"
    vi: "Liên hệ bộ sưu tập với tri thức và việc học"
    ms: "Mengaitkan koleksi dengan ilmu dan pembelajaran"
    id: "Menghubungkan koleksi dengan pengetahuan dan belajar"
    hi: "संग्रहों को ज्ञान और सीखने से जोड़ना"
