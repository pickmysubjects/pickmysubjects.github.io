code: AHIS30024
year: 2026
learn:
  en: "Japanese art from the 6th to the 20th century, from temples and gardens to prints and castles, and its links to power."
  zh: "6至20世纪的日本艺术，从寺庙和园林到浮世绘与城郭，以及它与权力的关联。"
  zh-TW: "6至20世紀的日本藝術，從寺廟和庭園到浮世繪與城郭，以及它與權力的關聯。"
  ja: "6世紀から20世紀までの日本美術。寺社や庭園から版画や城まで、権力とのつながりも学ぶ。"
  ko: "6세기부터 20세기까지 일본 미술. 사찰과 정원부터 판화와 성까지, 권력과의 관계도 배운다."
  vi: "Nghệ thuật Nhật Bản từ thế kỷ 6 đến 20, từ chùa, vườn đến tranh khắc gỗ, lâu đài, và mối liên hệ với quyền lực."
  ms: "Seni Jepun dari abad ke-6 hingga ke-20, dari kuil dan taman hingga cetakan dan istana, serta kaitannya dengan kuasa."
  id: "Seni Jepang dari abad ke-6 hingga ke-20, dari kuil dan taman sampai cetakan dan kastel, serta kaitannya dengan kekuasaan."
  hi: "छठी से 20वीं सदी तक जापानी कला, मंदिरों और बाग़ों से प्रिंट और किलों तक, और सत्ता से उसका संबंध।"
outcomes:
  - en: "Describe landmark Japanese artworks and sites"
    zh: "介绍日本艺术的标志性作品和场所"
    zh-TW: "介紹日本藝術的代表性作品和場所"
    ja: "日本美術の代表的な作品と場所を説明する"
    ko: "일본 미술의 대표 작품과 장소 설명하기"
    vi: "Mô tả các tác phẩm và địa điểm tiêu biểu của nghệ thuật Nhật"
    ms: "Huraikan karya dan tapak penting seni Jepun"
    id: "Menguraikan karya dan situs penting seni Jepang"
    hi: "जापानी कला की प्रमुख कृतियों और स्थलों का वर्णन करना"
  - en: "Explain techniques used in Japanese art"
    zh: "说明日本艺术使用的技法"
    zh-TW: "說明日本藝術使用的技法"
    ja: "日本美術の技法を説明する"
    ko: "일본 미술의 기법 설명하기"
    vi: "Giải thích các kỹ thuật dùng trong nghệ thuật Nhật"
    ms: "Terangkan teknik yang digunakan dalam seni Jepun"
    id: "Menjelaskan teknik yang dipakai dalam seni Jepang"
    hi: "जापानी कला में इस्तेमाल तकनीकें समझाना"
  - en: "Link art to Japan's social and political history"
    zh: "把艺术与日本社会政治史联系起来"
    zh-TW: "把藝術與日本社會政治史聯繫起來"
    ja: "美術を日本の社会・政治史と結びつける"
    ko: "미술을 일본의 사회·정치사와 연결하기"
    vi: "Liên hệ nghệ thuật với lịch sử xã hội, chính trị Nhật Bản"
    ms: "Kaitkan seni dengan sejarah sosial dan politik Jepun"
    id: "Mengaitkan seni dengan sejarah sosial dan politik Jepang"
    hi: "कला को जापान के सामाजिक-राजनीतिक इतिहास से जोड़ना"
