code: FINA20041
year: 2026
learn:
  en: "Design for performance through the human figure: costume, puppets, scale and how bodies read on stage."
  zh: "从人体出发的演出设计：服装、偶、尺度，以及身体在舞台上如何被解读。"
  zh-TW: "從人體出發的演出設計：服裝、偶、尺度，以及身體在舞台上如何被解讀。"
  ja: "人の身体から考える舞台デザイン：衣装、人形、スケール、舞台上の身体の見え方。"
  ko: "인체에서 출발한 공연 디자인: 의상, 인형, 스케일, 무대 위 몸이 읽히는 방식."
  vi: "Thiết kế biểu diễn qua hình thể người: trang phục, rối, tỉ lệ và cách cơ thể được đọc trên sân khấu."
  ms: "Reka bentuk persembahan melalui figura manusia: kostum, boneka, skala dan cara tubuh dibaca di pentas."
  id: "Desain pertunjukan lewat figur manusia: kostum, boneka, skala, dan cara tubuh terbaca di panggung."
  hi: "मानव आकृति से प्रस्तुति डिज़ाइन: कॉस्ट्यूम, कठपुतली, पैमाना और मंच पर शरीर का असर।"
outcomes:
  - en: "Explain how costume changes a figure"
    zh: "说明服装如何改变人物形象"
    zh-TW: "說明服裝如何改變人物形象"
    ja: "衣装が人物像をどう変えるか説明する"
    ko: "의상이 인물을 바꾸는 방식 설명하기"
    vi: "Giải thích trang phục thay đổi nhân vật ra sao"
    ms: "Jelaskan cara kostum mengubah figura"
    id: "Menjelaskan cara kostum mengubah figur"
    hi: "कॉस्ट्यूम किसी आकृति को कैसे बदलता है, समझाना"
  - en: "Relate the figure to space and light"
    zh: "把人物与空间和灯光联系起来"
    zh-TW: "把人物與空間和燈光連結起來"
    ja: "人物を空間と照明に関連づける"
    ko: "인물을 공간·조명과 연결하기"
    vi: "Liên hệ nhân vật với không gian và ánh sáng"
    ms: "Kaitkan figura dengan ruang dan cahaya"
    id: "Mengaitkan figur dengan ruang dan cahaya"
    hi: "आकृति को स्पेस और रोशनी से जोड़ना"
  - en: "Develop a costume or puppet design"
    zh: "发展服装或偶的设计"
    zh-TW: "發展服裝或偶的設計"
    ja: "衣装や人形のデザインを練る"
    ko: "의상이나 인형 디자인 발전시키기"
    vi: "Phát triển thiết kế trang phục hoặc rối"
    ms: "Kembangkan reka bentuk kostum atau boneka"
    id: "Mengembangkan desain kostum atau boneka"
    hi: "कॉस्ट्यूम या कठपुतली डिज़ाइन विकसित करना"
