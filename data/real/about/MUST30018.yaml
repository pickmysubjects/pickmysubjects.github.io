code: MUST30018
year: 2026
learn:
  en: "The final capstone: a mainstage musical and an industry Showcase, polishing your skills to pre-professional level."
  zh: "最后的毕业项目：一部大型音乐剧和行业展演，把技能打磨到准职业水平。"
  zh-TW: "最後的畢業專案：一部大型音樂劇和業界展演，把技能打磨到準職業水準。"
  ja: "最後の卒業制作：本公演ミュージカルと業界ショーケースで、技能をプロ直前まで磨く。"
  ko: "마지막 캡스톤: 메인 무대 뮤지컬과 업계 쇼케이스로 기량을 프로 직전까지 다듬는다."
  vi: "Đồ án cuối: một vở nhạc kịch lớn và buổi Showcase cho ngành, mài giũa kỹ năng."
  ms: "Projek akhir: muzikal pentas utama dan Showcase industri, mengasah kemahiran."
  id: "Proyek akhir: musikal panggung utama dan Showcase industri, mengasah keterampilan."
  hi: "अंतिम कैपस्टोन: मेनस्टेज म्यूज़िकल और इंडस्ट्री शोकेस, कौशल को प्री-प्रोफ़ेशनल स्तर तक।"
outcomes:
  - en: "Perform in a mainstage musical"
    zh: "参演大型音乐剧"
    zh-TW: "參演大型音樂劇"
    ja: "本公演ミュージカルに出演する"
    ko: "메인 무대 뮤지컬 출연하기"
    vi: "Diễn trong vở nhạc kịch lớn"
    ms: "Beraksi dalam muzikal pentas utama"
    id: "Tampil di musikal panggung utama"
    hi: "मेनस्टेज म्यूज़िकल में प्रदर्शन"
  - en: "Present yourself in an industry Showcase"
    zh: "在行业展演中展示自己"
    zh-TW: "在業界展演中展示自己"
    ja: "業界ショーケースで自分を見せる"
    ko: "업계 쇼케이스에서 자신 보여 주기"
    vi: "Giới thiệu bản thân ở Showcase ngành"
    ms: "Tampilkan diri dalam Showcase industri"
    id: "Menampilkan diri di Showcase industri"
    hi: "इंडस्ट्री शोकेस में ख़ुद को पेश करना"
  - en: "Reflect on your readiness for the industry"
    zh: "反思自己是否准备好入行"
    zh-TW: "反思自己是否準備好入行"
    ja: "業界への準備度を振り返る"
    ko: "업계 진입 준비도 돌아보기"
    vi: "Suy ngẫm mức sẵn sàng vào nghề"
    ms: "Renung kesediaan memasuki industri"
    id: "Merefleksikan kesiapan masuk industri"
    hi: "इंडस्ट्री के लिए अपनी तैयारी पर विचार"
