code: CHIN20026
year: 2026
learn:
  en: "Translating between Chinese and English, using modern literature and everyday documents."
  zh: "中英互译练习，材料是现代文学和日常文件。"
  zh-TW: "中英互譯練習，材料是現代文學和日常文件。"
  ja: "現代文学や日常の文書を使い、中国語と英語の間で翻訳する。"
  ko: "현대 문학과 일상 문서를 이용해 중국어와 영어 사이를 번역한다."
  vi: "Dịch giữa tiếng Trung và tiếng Anh, dùng văn học hiện đại và tài liệu thường ngày."
  ms: "Menterjemah antara bahasa Cina dan Inggeris, menggunakan sastera moden dan dokumen harian."
  id: "Menerjemahkan antara bahasa Mandarin dan Inggris, memakai sastra modern dan dokumen sehari-hari."
  hi: "आधुनिक साहित्य और रोज़मर्रा के दस्तावेज़ों से चीनी और अंग्रेज़ी के बीच अनुवाद।"
outcomes:
  - en: "Translate Chinese texts into natural English"
    zh: "把中文译成自然的英文"
    zh-TW: "把中文譯成自然的英文"
    ja: "中国語を自然な英語に訳す"
    ko: "중국어를 자연스러운 영어로 번역하기"
    vi: "Dịch văn bản tiếng Trung sang tiếng Anh tự nhiên"
    ms: "Terjemah teks Cina ke bahasa Inggeris yang asli"
    id: "Menerjemahkan teks Mandarin ke bahasa Inggris yang alami"
    hi: "चीनी पाठ को सहज अंग्रेज़ी में अनुवाद करना"
  - en: "Translate English texts into accurate Chinese"
    zh: "把英文准确译成中文"
    zh-TW: "把英文準確譯成中文"
    ja: "英語を正確な中国語に訳す"
    ko: "영어를 정확한 중국어로 번역하기"
    vi: "Dịch văn bản tiếng Anh sang tiếng Trung chính xác"
    ms: "Terjemah teks Inggeris ke bahasa Cina dengan tepat"
    id: "Menerjemahkan teks Inggris ke bahasa Mandarin dengan tepat"
    hi: "अंग्रेज़ी पाठ को सटीक चीनी में अनुवाद करना"
  - en: "Explain and defend your translation choices"
    zh: "解释并论证自己的翻译选择"
    zh-TW: "解釋並論證自己的翻譯選擇"
    ja: "自分の訳し方を説明し根拠を示す"
    ko: "자신의 번역 선택 설명하고 근거 대기"
    vi: "Giải thích và bảo vệ lựa chọn dịch của mình"
    ms: "Terangkan dan pertahankan pilihan terjemahan anda"
    id: "Menjelaskan dan mempertahankan pilihan terjemahan"
    hi: "अपने अनुवाद के फ़ैसले समझाना और उनका बचाव करना"
