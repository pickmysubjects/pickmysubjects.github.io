code: FINA30028
year: 2026
learn:
  en: "Advanced studio work toward a focused line of enquiry, plus writing, exhibition proposals and grant applications."
  zh: "高阶工作室创作，聚焦创作方向，并练习写作、展览提案与资助申请。"
  zh-TW: "高階工作室創作，聚焦創作方向，並練習寫作、展覽提案與補助申請。"
  ja: "上級の制作で探究テーマを絞り、文章、展覧会企画、助成金申請も学ぶ。"
  ko: "고급 작업실 작업에 글쓰기, 전시 제안서, 지원금 신청까지."
  vi: "Sáng tác nâng cao theo hướng riêng, kèm viết, đề xuất triển lãm, xin tài trợ."
  ms: "Kerja studio lanjutan ke arah tumpuan sendiri, serta penulisan dan permohonan geran."
  id: "Kerja studio lanjut ke fokus sendiri, plus menulis, proposal pameran dan hibah."
  hi: "उन्नत स्टूडियो कार्य, साथ में लेखन, प्रदर्शनी प्रस्ताव और ग्रांट आवेदन।"
outcomes:
  - en: "Keep a research journal for your practice"
    zh: "为创作保持研究日志"
    zh-TW: "為創作保持研究日誌"
    ja: "制作のための研究日誌をつける"
    ko: "작업을 위한 리서치 일지 쓰기"
    vi: "Ghi nhật ký nghiên cứu cho sáng tác"
    ms: "Simpan jurnal kajian untuk amalan"
    id: "Membuat jurnal riset untuk praktik"
    hi: "अपने अभ्यास के लिए शोध डायरी रखना"
  - en: "Write exhibition and grant applications"
    zh: "撰写展览与资助申请"
    zh-TW: "撰寫展覽與補助申請"
    ja: "展覧会・助成金の申請書を書く"
    ko: "전시·지원금 신청서 쓰기"
    vi: "Viết hồ sơ triển lãm và xin tài trợ"
    ms: "Tulis permohonan pameran dan geran"
    id: "Menulis proposal pameran dan hibah"
    hi: "प्रदर्शनी और ग्रांट आवेदन लिखना"
  - en: "Present a folio of finished work"
    zh: "提交完成的作品集"
    zh-TW: "提交完成的作品集"
    ja: "完成作品のポートフォリオを提出する"
    ko: "완성작 포트폴리오 제출하기"
    vi: "Nộp hồ sơ tác phẩm hoàn chỉnh"
    ms: "Serah folio karya siap"
    id: "Menyerahkan portofolio karya jadi"
    hi: "पूरे हुए काम का फ़ोलियो प्रस्तुत करना"
