code: CHIN10003
year: 2026
learn:
  en: "For intermediate speakers with limited literacy, moving from textbook Chinese to real materials written for native speakers."
  zh: "面向读写有限的中级学习者，从教科书中文过渡到为母语者写的真实材料。"
  zh-TW: "面向讀寫有限的中級學習者，從教科書中文過渡到為母語者寫的真實材料。"
  ja: "読み書きが限られた中級者向けに、教科書の中国語からネイティブ向けの本物の素材へ移行する。"
  ko: "읽기·쓰기가 제한된 중급 학습자를 위해 교과서 중국어에서 원어민용 실제 자료로 넘어간다."
  vi: "Dành cho người trình độ trung cấp còn hạn chế đọc viết, chuyển từ tiếng Trung giáo trình sang tài liệu thật cho người bản ngữ."
  ms: "Untuk penutur pertengahan yang terhad literasinya, beralih daripada bahasa Cina buku teks kepada bahan sebenar untuk penutur asli."
  id: "Bagi penutur tingkat menengah dengan literasi terbatas, beralih dari Mandarin buku teks ke bahan asli untuk penutur jati."
  hi: "सीमित पढ़ने-लिखने वाले मध्यम स्तर के छात्रों के लिए, पाठ्यपुस्तक चीनी से मूल भाषियों के लिए लिखी असली सामग्री तक।"
outcomes:
  - en: "Read authentic Chinese materials"
    zh: "阅读真实的中文材料"
    zh-TW: "閱讀真實的中文材料"
    ja: "本物の中国語の素材を読む"
    ko: "실제 중국어 자료 읽기"
    vi: "Đọc tài liệu tiếng Trung thực tế"
    ms: "Baca bahan Cina yang asli"
    id: "Membaca bahan Mandarin asli"
    hi: "असली चीनी सामग्री पढ़ना"
  - en: "Build vocabulary for social and cultural topics"
    zh: "积累社会文化话题的词汇"
    zh-TW: "累積社會文化話題的詞彙"
    ja: "社会・文化のテーマの語彙を増やす"
    ko: "사회·문화 주제 어휘 늘리기"
    vi: "Mở rộng từ vựng về chủ đề xã hội và văn hóa"
    ms: "Bina kosa kata untuk topik sosial dan budaya"
    id: "Membangun kosakata untuk topik sosial dan budaya"
    hi: "सामाजिक-सांस्कृतिक विषयों की शब्दावली बढ़ाना"
  - en: "Discuss life in China today in Chinese"
    zh: "用中文讨论当今中国的生活"
    zh-TW: "用中文討論當今中國的生活"
    ja: "今の中国の暮らしを中国語で話し合う"
    ko: "오늘날 중국의 삶을 중국어로 토론하기"
    vi: "Thảo luận về cuộc sống ở Trung Quốc ngày nay bằng tiếng Trung"
    ms: "Bincangkan kehidupan di China kini dalam bahasa Cina"
    id: "Membahas kehidupan di Tiongkok kini dalam bahasa Mandarin"
    hi: "आज चीन के जीवन पर चीनी में चर्चा करना"
