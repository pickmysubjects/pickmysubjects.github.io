code: AGRI20040
year: 2026
learn:
  en: "Run the numbers on farm enterprises at Dookie: budgets, gross margins and how to choose what a farm should produce."
  zh: "在Dookie学农场经营的账：预算、毛利，以及如何决定农场该生产什么。"
  zh-TW: "在Dookie學農場經營的帳：預算、毛利，以及如何決定農場該生產什麼。"
  ja: "Dookieで農業経営の数字を学ぶ。予算、粗利、何を生産すべきかの判断。"
  ko: "Dookie에서 농장 경영 수치를 다룬다. 예산·총이익, 무엇을 생산할지 결정."
  vi: "Tính toán kinh doanh nông trại ở Dookie: ngân sách, lãi gộp, chọn sản phẩm."
  ms: "Kira perniagaan ladang di Dookie: belanjawan, margin kasar, pilihan pengeluaran."
  id: "Menghitung usaha tani di Dookie: anggaran, margin kotor, memilih produksi."
  hi: "Dookie में फ़ार्म का हिसाब: बजट, ग्रॉस मार्जिन और क्या उगाना है, यह तय करना।"
outcomes:
  - en: "Build budgets for farm enterprises"
    zh: "为农场项目编制预算"
    zh-TW: "為農場項目編製預算"
    ja: "農業部門ごとの予算を組む"
    ko: "농장 사업별 예산 짜기"
    vi: "Lập ngân sách cho hoạt động nông trại"
    ms: "Sediakan belanjawan perusahaan ladang"
    id: "Menyusun anggaran usaha tani"
    hi: "फ़ार्म के कामों का बजट बनाना"
  - en: "Compare enterprises using gross margins"
    zh: "用毛利比较不同经营项目"
    zh-TW: "用毛利比較不同經營項目"
    ja: "粗利で部門を比較する"
    ko: "총이익으로 사업 비교하기"
    vi: "So sánh hoạt động bằng lãi gộp"
    ms: "Banding perusahaan guna margin kasar"
    id: "Membandingkan usaha lewat margin kotor"
    hi: "ग्रॉस मार्जिन से विकल्पों की तुलना"
  - en: "Recommend a farm plan from field visits"
    zh: "结合实地考察提出农场方案"
    zh-TW: "結合實地考察提出農場方案"
    ja: "現地視察をもとに農場計画を提案する"
    ko: "현장 방문을 바탕으로 농장 계획 제안하기"
    vi: "Đề xuất kế hoạch từ chuyến thực địa"
    ms: "Cadang pelan ladang daripada lawatan"
    id: "Merekomendasikan rencana dari kunjungan"
    hi: "फ़ील्ड विज़िट से फ़ार्म योजना सुझाना"
