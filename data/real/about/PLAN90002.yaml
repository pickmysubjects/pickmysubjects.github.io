code: PLAN90002
year: 2027
learn:
  en: "How planning systems and cultures differ between countries, seen through politics, geography, history and business."
  zh: "从政治、地理、历史和商业角度，比较各国规划体系与规划文化的差异。"
  zh-TW: "從政治、地理、歷史和商業角度，比較各國規劃體系與規劃文化的差異。"
  ja: "政治・地理・歴史・ビジネスの視点で、各国の計画制度と文化を比べる。"
  ko: "정치, 지리, 역사, 경영 관점에서 국가별 계획 제도와 문화를 비교합니다."
  vi: "So sánh hệ thống và văn hóa quy hoạch các nước qua chính trị, địa lý, lịch sử và kinh doanh."
  ms: "Perbezaan sistem dan budaya perancangan antara negara dari sudut politik, geografi dan sejarah."
  id: "Perbedaan sistem dan budaya perencanaan antarnegara dari sisi politik, geografi, dan sejarah."
  hi: "राजनीति, भूगोल, इतिहास और व्यापार के नज़रिए से देशों की योजना प्रणालियों की तुलना।"
outcomes:
  - en: "Compare planning systems across countries"
    zh: "比较各国规划体系"
    zh-TW: "比較各國規劃體系"
    ja: "各国の計画制度を比べる"
    ko: "국가별 계획 제도 비교하기"
    vi: "So sánh hệ thống quy hoạch các nước"
    ms: "Membandingkan sistem perancangan antara negara"
    id: "Membandingkan sistem perencanaan antarnegara"
    hi: "देशों की योजना प्रणालियों की तुलना"
  - en: "Explain how history shapes planning"
    zh: "说明历史如何塑造规划"
    zh-TW: "說明歷史如何塑造規劃"
    ja: "歴史が計画に与える影響を説明する"
    ko: "역사가 계획에 미친 영향 설명하기"
    vi: "Giải thích lịch sử định hình quy hoạch"
    ms: "Menerangkan pengaruh sejarah pada perancangan"
    id: "Menjelaskan pengaruh sejarah pada perencanaan"
    hi: "इतिहास योजना को कैसे आकार देता है"
