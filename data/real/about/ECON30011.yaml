code: ECON30011
year: 2026
learn:
  en: "The economics of energy and transport networks, their pricing and regulation, in the shift to clean energy."
  zh: "能源与交通网络的经济学：定价、监管与清洁能源转型。"
  zh-TW: "能源與交通網路的經濟學：定價、監管與淨零能源轉型。"
  ja: "クリーンエネルギー移行の中で、エネルギーと交通網の価格設定と規制を学ぶ経済学。"
  ko: "청정에너지 전환 속 에너지·교통 네트워크의 가격 책정과 규제를 다루는 경제학."
  vi: "Kinh tế học về mạng lưới năng lượng và giao thông, định giá và quản lý trong quá trình chuyển sang năng lượng sạch."
  ms: "Ekonomi rangkaian tenaga dan pengangkutan, harga dan peraturannya, dalam peralihan kepada tenaga bersih."
  id: "Ekonomi jaringan energi dan transportasi, penetapan harga dan regulasinya, dalam transisi ke energi bersih."
  hi: "स्वच्छ ऊर्जा की ओर बदलाव में ऊर्जा और परिवहन नेटवर्क का अर्थशास्त्र, उनकी कीमतें और नियमन।"
outcomes:
  - en: "Analyse how energy and transport prices affect people and firms"
    zh: "分析能源和交通价格对个人和企业的影响"
    zh-TW: "分析能源和交通價格對個人和企業的影響"
    ja: "エネルギーと交通の価格が人や企業に与える影響を分析する"
    ko: "에너지·교통 가격이 개인과 기업에 미치는 영향 분석하기"
    vi: "Phân tích giá năng lượng và giao thông ảnh hưởng đến người dân và doanh nghiệp"
    ms: "Analisis kesan harga tenaga dan pengangkutan kepada orang ramai dan firma"
    id: "Menganalisis dampak harga energi dan transportasi bagi warga dan perusahaan"
    hi: "ऊर्जा और परिवहन की कीमतों का लोगों और कंपनियों पर असर समझना"
  - en: "Weigh up subsidies, regulation and pricing of pollution"
    zh: "评估补贴、监管和污染定价"
    zh-TW: "評估補貼、監管和污染定價"
    ja: "補助金、規制、汚染への価格付けを評価する"
    ko: "보조금, 규제, 오염 가격 책정 평가하기"
    vi: "Đánh giá trợ cấp, quy định và việc định giá ô nhiễm"
    ms: "Nilai subsidi, peraturan dan penetapan harga pencemaran"
    id: "Menilai subsidi, regulasi, dan penetapan harga polusi"
    hi: "सब्सिडी, नियमन और प्रदूषण की कीमत तय करने का आकलन करना"
  - en: "Assess the impact of EVs, smart meters and similar tech"
    zh: "评估电动车、智能电表等新技术的影响"
    zh-TW: "評估電動車、智慧電表等新技術的影響"
    ja: "EVやスマートメーターなど新技術の影響を評価する"
    ko: "전기차, 스마트 미터 등 신기술의 영향 평가하기"
    vi: "Đánh giá tác động của xe điện, đồng hồ thông minh và công nghệ tương tự"
    ms: "Nilai kesan kenderaan elektrik, meter pintar dan teknologi seumpamanya"
    id: "Menilai dampak mobil listrik, meteran pintar, dan teknologi sejenis"
    hi: "इलेक्ट्रिक वाहन, स्मार्ट मीटर जैसी तकनीकों का असर आँकना"
