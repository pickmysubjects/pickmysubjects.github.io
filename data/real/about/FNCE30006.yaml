code: FNCE30006
year: 2026
learn:
  en: "How new ventures are valued and funded, from venture capital deals to the eventual exit."
  zh: "新创企业如何估值和融资，从风投交易到最终退出。"
  zh-TW: "新創公司如何估值和募資，從創投交易到最終出場。"
  ja: "新規事業の評価と資金調達：ベンチャーキャピタルの取引から出口まで。"
  ko: "신생 기업의 가치평가와 자금 조달: 벤처캐피털 거래부터 엑시트까지."
  vi: "Cách định giá và gọi vốn cho doanh nghiệp mới, từ thương vụ đầu tư mạo hiểm đến lúc thoái vốn."
  ms: "Cara usaha baharu dinilai dan dibiayai, dari perjanjian modal teroka hingga keluar pelaburan."
  id: "Cara usaha rintisan dinilai dan didanai, dari kesepakatan modal ventura hingga exit."
  hi: "नए वेंचर का मूल्यांकन और फ़ंडिंग कैसे होती है, वेंचर कैपिटल डील से लेकर एग्ज़िट तक।"
outcomes:
  - en: "Build a financial model for a new venture"
    zh: "为新创企业搭建财务模型"
    zh-TW: "為新創公司建立財務模型"
    ja: "新規事業の財務モデルを作る"
    ko: "신생 기업 재무 모형 만들기"
    vi: "Xây mô hình tài chính cho doanh nghiệp mới"
    ms: "Bina model kewangan untuk usaha baharu"
    id: "Membuat model keuangan untuk usaha rintisan"
    hi: "नए वेंचर का फ़ाइनेंशियल मॉडल बनाना"
  - en: "Value risky claims and design funding deals"
    zh: "为高风险权益估值并设计融资交易"
    zh-TW: "為高風險權益估值並設計募資交易"
    ja: "リスクの高い請求権を評価し資金調達を設計する"
    ko: "위험한 청구권 가치평가와 투자 계약 설계하기"
    vi: "Định giá quyền lợi rủi ro và thiết kế thương vụ gọi vốn"
    ms: "Nilai tuntutan berisiko dan reka perjanjian pembiayaan"
    id: "Menilai klaim berisiko dan merancang kesepakatan pendanaan"
    hi: "जोखिम वाले दावों का मूल्यांकन और फ़ंडिंग डील तैयार करना"
  - en: "Write a business plan to attract investors"
    zh: "撰写吸引投资者的商业计划"
    zh-TW: "撰寫吸引投資人的營運計畫書"
    ja: "投資家を引きつける事業計画を書く"
    ko: "투자자를 끌 사업계획서 쓰기"
    vi: "Viết kế hoạch kinh doanh để thu hút nhà đầu tư"
    ms: "Tulis rancangan perniagaan untuk tarik pelabur"
    id: "Menulis rencana bisnis untuk menarik investor"
    hi: "निवेशकों को आकर्षित करने वाला बिज़नेस प्लान लिखना"
