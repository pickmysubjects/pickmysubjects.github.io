code: INFO20002
year: 2026
learn:
  en: "Working with data using spreadsheets, building basic web pages with HTML/CSS, and scripting web data."
  zh: "用电子表格处理数据，用HTML/CSS做简单网页，并用脚本处理网络数据。"
  zh-TW: "用試算表處理資料，用HTML/CSS做簡單網頁，並用腳本處理網路資料。"
  ja: "表計算でのデータ処理、HTML/CSSでの簡単なWebページ作成、Webデータのスクリプト処理。"
  ko: "스프레드시트로 데이터 다루기, HTML/CSS로 기본 웹페이지 만들기, 웹 데이터 스크립팅."
  vi: "Xử lý dữ liệu bằng bảng tính, làm trang web cơ bản bằng HTML/CSS và viết script cho dữ liệu web."
  ms: "Mengurus data dengan hamparan, membina laman web asas dengan HTML/CSS, dan skrip data web."
  id: "Mengolah data dengan spreadsheet, membuat halaman web dasar dengan HTML/CSS, dan skrip data web."
  hi: "स्प्रेडशीट से डेटा संभालना, HTML/CSS से साधारण वेब पेज बनाना और वेब डेटा की स्क्रिप्टिंग।"
outcomes:
  - en: "Manipulate large data sets with ICT tools"
    zh: "用信息工具处理大型数据集"
    zh-TW: "用資訊工具處理大型資料集"
    ja: "ICTツールで大規模データを扱う"
    ko: "ICT 도구로 대용량 데이터 처리"
    vi: "Xử lý tập dữ liệu lớn bằng công cụ CNTT"
    ms: "Olah set data besar dengan alat ICT"
    id: "Mengolah data besar dengan alat TIK"
    hi: "ICT टूल से बड़े डेटा सेट संभालना"
  - en: "Work with live web-based data"
    zh: "处理实时网络数据"
    zh-TW: "處理即時網路資料"
    ja: "ライブのWebデータを扱う"
    ko: "실시간 웹 데이터 다루기"
    vi: "Làm việc với dữ liệu web trực tuyến"
    ms: "Urus data web secara langsung"
    id: "Mengolah data web secara langsung"
    hi: "लाइव वेब डेटा के साथ काम करना"
