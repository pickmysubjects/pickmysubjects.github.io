code: PSYC40013
year: 2026
learn:
  en: "Capstone linking psychological science and practice: ethics, applied topics, and a small-group research project."
  zh: "连接心理学科学与实践的顶点课：伦理、应用议题和小组研究项目。"
  zh-TW: "連結心理學科學與實務的總結課：倫理、應用議題和小組研究專案。"
  ja: "心理学の科学と実践をつなぐ総仕上げ：倫理、応用テーマ、少人数の研究プロジェクト。"
  ko: "심리학 과학과 실무를 잇는 캡스톤: 윤리, 응용 주제, 소그룹 연구 프로젝트."
  vi: "Môn tổng kết nối khoa học và thực hành tâm lý: đạo đức, chủ đề ứng dụng và dự án nghiên cứu nhóm."
  ms: "Subjek kemuncak menghubungkan sains dan amalan psikologi: etika, topik gunaan dan projek kajian kumpulan."
  id: "Mata kuliah puncak yang menghubungkan sains dan praktik psikologi: etika, topik terapan, dan riset kelompok."
  hi: "मनोविज्ञान के विज्ञान और व्यवहार को जोड़ने वाला कैपस्टोन: नैतिकता, व्यावहारिक विषय और समूह शोध परियोजना।"
outcomes:
  - en: "Design and run a small research study"
    zh: "设计并开展一项小型研究"
    zh-TW: "設計並開展一項小型研究"
    ja: "小規模な研究を計画し実施する"
    ko: "소규모 연구를 설계하고 수행하기"
    vi: "Thiết kế và thực hiện một nghiên cứu nhỏ"
    ms: "Reka dan jalankan kajian kecil"
    id: "Merancang dan menjalankan studi kecil"
    hi: "एक छोटा शोध अध्ययन बनाना और चलाना"
  - en: "Apply ethics to psychological practice"
    zh: "将伦理应用于心理学实践"
    zh-TW: "將倫理應用於心理學實務"
    ja: "心理学の実践に倫理を当てはめる"
    ko: "심리학 실무에 윤리 적용하기"
    vi: "Áp dụng đạo đức vào thực hành tâm lý"
    ms: "Gunakan etika dalam amalan psikologi"
    id: "Menerapkan etika pada praktik psikologi"
    hi: "मनोवैज्ञानिक अभ्यास में नैतिकता लागू करना"
  - en: "Present findings and reflect on your skills"
    zh: "展示研究发现并反思自身能力"
    zh-TW: "展示研究發現並反思自身能力"
    ja: "成果を発表し自分の力を振り返る"
    ko: "결과 발표하고 자기 역량 성찰하기"
    vi: "Trình bày kết quả và tự đánh giá kỹ năng"
    ms: "Bentang dapatan dan renungkan kemahiran sendiri"
    id: "Mempresentasikan temuan dan merefleksikan keterampilan"
    hi: "निष्कर्ष प्रस्तुत करना और अपने कौशल पर विचार करना"
