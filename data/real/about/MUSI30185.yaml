code: MUSI30185
year: 2026
learn:
  en: "Rehearse and perform symphonic works in the Conservatorium orchestras and wind bands after a February audition. Pass/fail."
  zh: "二月试音后进入音乐学院管弦乐团或管乐团，排练并演出交响作品。及格制。"
  zh-TW: "二月試音後進入音樂學院管弦樂團或管樂團，排練並演出交響作品。及格制。"
  ja: "2月のオーディション後、オーケストラや吹奏楽団で交響作品を演奏。合否判定。"
  ko: "2월 오디션 후 오케스트라·관악단에서 교향 작품 연주. 합격/불합격."
  vi: "Thử giọng tháng 2, rồi tập và diễn giao hưởng trong dàn nhạc hoặc dàn kèn. Đạt/không đạt."
  ms: "Uji bakat Februari, kemudian berlatih dan beraksi dalam orkestra. Lulus/gagal."
  id: "Audisi Februari, lalu berlatih dan tampil di orkestra atau band tiup. Lulus/gagal."
  hi: "फ़रवरी ऑडिशन के बाद ऑर्केस्ट्रा या विंड बैंड में सिम्फ़नी रचनाएँ। पास/फ़ेल।"
outcomes:
  - en: "Play your part in a full orchestra or wind band"
    zh: "在完整乐团或管乐团中演奏自己的声部"
    zh-TW: "在完整樂團或管樂團中演奏自己的聲部"
    ja: "オーケストラや吹奏楽団で自分のパートを弾く"
    ko: "오케스트라나 관악단에서 파트 연주하기"
    vi: "Chơi bè của mình trong dàn nhạc đầy đủ"
    ms: "Mainkan bahagian dalam orkestra penuh"
    id: "Memainkan partisi di orkestra penuh"
    hi: "पूरे ऑर्केस्ट्रा या विंड बैंड में अपना भाग बजाना"
  - en: "Learn works from the symphonic canon"
    zh: "学习交响乐经典作品"
    zh-TW: "學習交響樂經典作品"
    ja: "交響曲の名作を学ぶ"
    ko: "교향악 명작 익히기"
    vi: "Học các tác phẩm giao hưởng kinh điển"
    ms: "Pelajari karya simfoni klasik"
    id: "Mempelajari karya simfoni klasik"
    hi: "सिम्फ़नी की प्रसिद्ध रचनाएँ सीखना"
  - en: "Perform in public symphonic concerts"
    zh: "参加公开交响音乐会"
    zh-TW: "參加公開交響音樂會"
    ja: "公開の交響演奏会に出る"
    ko: "공개 교향 공연에 서기"
    vi: "Biểu diễn trong hòa nhạc giao hưởng"
    ms: "Membuat persembahan konsert simfoni"
    id: "Tampil dalam konser simfoni publik"
    hi: "सार्वजनिक सिम्फ़नी कॉन्सर्ट में बजाना"
