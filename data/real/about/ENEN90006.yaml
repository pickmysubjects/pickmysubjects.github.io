code: ENEN90006
year: 2027
learn:
  en: "How solid waste is produced, treated and turned back into resources, with a life-cycle view."
  zh: "从生命周期角度看固体废物如何产生、处理并重新变成资源。"
  zh-TW: "從生命週期角度看固體廢棄物如何產生、處理並重新變成資源。"
  ja: "ライフサイクルの視点で、固形廃棄物の発生・処理・資源化を学ぶ。"
  ko: "생애주기 관점에서 고형 폐기물의 발생, 처리, 자원화를 배웁니다."
  vi: "Chất thải rắn sinh ra, xử lý và trở lại thành tài nguyên thế nào, theo góc nhìn vòng đời."
  ms: "Bagaimana sisa pepejal dihasilkan, dirawat dan dijadikan sumber semula, dari sudut kitaran hayat."
  id: "Bagaimana limbah padat dihasilkan, diolah, dan dijadikan sumber daya lagi, dari sudut siklus hidup."
  hi: "ठोस कचरा कैसे बनता है, उसका उपचार कैसे होता है और वह फिर से संसाधन कैसे बनता है, जीवन-चक्र की नज़र से।"
outcomes:
  - en: "Classify and model sources of solid waste"
    zh: "对固体废物来源进行分类和建模"
    zh-TW: "對固體廢棄物來源分類與建模"
    ja: "固形廃棄物の発生源を分類・モデル化する"
    ko: "고형 폐기물 발생원 분류 및 모델링하기"
    vi: "Phân loại và mô hình hóa nguồn chất thải rắn"
    ms: "Mengelaskan dan memodelkan sumber sisa pepejal"
    id: "Mengklasifikasi dan memodelkan sumber limbah padat"
    hi: "ठोस कचरे के स्रोतों का वर्गीकरण और मॉडल"
  - en: "Do life cycle and cleaner production assessments"
    zh: "开展生命周期和清洁生产评估"
    zh-TW: "進行生命週期與清潔生產評估"
    ja: "ライフサイクル評価とクリーナープロダクション評価を行う"
    ko: "전과정 평가와 청정생산 평가 수행하기"
    vi: "Thực hiện đánh giá vòng đời và sản xuất sạch hơn"
    ms: "Menjalankan penilaian kitaran hayat dan pengeluaran lebih bersih"
    id: "Melakukan penilaian siklus hidup dan produksi bersih"
    hi: "जीवन-चक्र और स्वच्छ उत्पादन आकलन करना"
  - en: "Explain how regulation shapes waste management"
    zh: "解释法规对废物管理的作用"
    zh-TW: "解釋法規對廢棄物管理的作用"
    ja: "規制が廃棄物管理に果たす役割を説明する"
    ko: "규제가 폐기물 관리에 미치는 역할 설명하기"
    vi: "Giải thích vai trò của quy định trong quản lý chất thải"
    ms: "Menerangkan peranan peraturan dalam pengurusan sisa"
    id: "Menjelaskan peran regulasi dalam pengelolaan limbah"
    hi: "कचरा प्रबंधन में नियमों की भूमिका समझाना"
