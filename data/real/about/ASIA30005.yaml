code: ASIA30005
year: 2026
learn:
  en: "Japan and Korea as a shared space of history and culture, studied through literature, film and TV drama."
  zh: "把日本和朝鲜半岛看作历史与文化交织的空间，通过文学、电影和电视剧来学习。"
  zh-TW: "把日本和朝鮮半島看作歷史與文化交織的空間，透過文學、電影和電視劇來學習。"
  ja: "日本と朝鮮半島を歴史と文化が重なる空間として、文学・映画・テレビドラマを通して学ぶ。"
  ko: "일본과 한반도를 역사와 문화가 겹치는 공간으로 보고 문학, 영화, TV 드라마로 배운다."
  vi: "Nhật Bản và bán đảo Triều Tiên như một không gian lịch sử, văn hóa chung, học qua văn học, phim ảnh và phim truyền hình."
  ms: "Jepun dan Korea sebagai ruang sejarah dan budaya bersama, dikaji melalui sastera, filem dan drama TV."
  id: "Jepang dan Korea sebagai ruang sejarah dan budaya bersama, dipelajari lewat sastra, film, dan drama TV."
  hi: "जापान और कोरिया को इतिहास और संस्कृति के साझा क्षेत्र के रूप में, साहित्य, फ़िल्म और टीवी ड्रामा के ज़रिए।"
outcomes:
  - en: "Analyse literature, film and TV as cultural texts"
    zh: "把文学、电影和电视剧作为文化文本来分析"
    zh-TW: "把文學、電影和電視劇作為文化文本來分析"
    ja: "文学・映画・ドラマを文化テクストとして分析する"
    ko: "문학·영화·드라마를 문화 텍스트로 분석하기"
    vi: "Phân tích văn học, phim và truyền hình như văn bản văn hóa"
    ms: "Analisis sastera, filem dan TV sebagai teks budaya"
    id: "Menganalisis sastra, film, dan TV sebagai teks budaya"
    hi: "साहित्य, फ़िल्म और टीवी को सांस्कृतिक पाठ के रूप में विश्लेषित करना"
  - en: "Explain how 'national' culture is built"
    zh: "解释“国家”文化是如何建构的"
    zh-TW: "解釋「國家」文化是如何建構的"
    ja: "「国民」文化がどう作られるか説明する"
    ko: "‘국가’ 문화가 만들어지는 방식 설명하기"
    vi: "Giải thích văn hóa “quốc gia” được xây dựng ra sao"
    ms: "Terangkan cara budaya 'kebangsaan' dibina"
    id: "Menjelaskan cara budaya 'nasional' dibangun"
    hi: "‘राष्ट्रीय’ संस्कृति कैसे बनती है, समझाना"
  - en: "Compare shared histories of Japan and Korea"
    zh: "比较日韩之间交织的历史"
    zh-TW: "比較日韓之間交織的歷史"
    ja: "日本と朝鮮半島の重なる歴史を比べる"
    ko: "일본과 한국의 얽힌 역사 비교하기"
    vi: "So sánh lịch sử đan xen của Nhật Bản và Hàn Quốc"
    ms: "Bandingkan sejarah bersama Jepun dan Korea"
    id: "Membandingkan sejarah bersama Jepang dan Korea"
    hi: "जापान और कोरिया के साझा इतिहास की तुलना करना"
