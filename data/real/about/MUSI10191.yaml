code: MUSI10191
year: 2026
learn:
  en: "Compose music and sound for other media, with one-to-one mentoring, group workshops and two folios of new work."
  zh: "为其他媒介创作音乐和声音，有一对一指导和小组工作坊，提交两份新作品集。"
  zh-TW: "為其他媒介創作音樂與聲音，有一對一指導與小組工作坊，提交兩份新作品集。"
  ja: "他のメディアのための音楽と音を作る。個別指導とグループワークショップ、新作の作品集を2回提出。"
  ko: "다른 매체를 위한 음악과 사운드 창작. 개인 멘토링, 그룹 워크숍, 신작 포트폴리오 2회."
  vi: "Sáng tác nhạc và âm thanh cho phương tiện khác, có kèm riêng, workshop nhóm và hai tập tác phẩm."
  ms: "Gubah muzik dan bunyi untuk media lain, dengan bimbingan individu, bengkel dan dua folio karya."
  id: "Menggubah musik dan suara untuk media lain, dengan mentor pribadi, lokakarya, dan dua portofolio."
  hi: "अन्य माध्यमों के लिए संगीत और ध्वनि रचना; व्यक्तिगत मार्गदर्शन, समूह वर्कशॉप और दो पोर्टफ़ोलियो।"
outcomes:
  - en: "Combine music and sound with other media"
    zh: "把音乐、声音与其他媒介结合"
    zh-TW: "把音樂、聲音與其他媒介結合"
    ja: "音楽と音を他のメディアと組み合わせる"
    ko: "음악·사운드를 다른 매체와 결합하기"
    vi: "Kết hợp nhạc, âm thanh với media khác"
    ms: "Gabung muzik dan bunyi dengan media lain"
    id: "Memadukan musik dan suara dengan media lain"
    hi: "संगीत-ध्वनि को अन्य माध्यमों से जोड़ना"
  - en: "Turn a concept into a finished piece"
    zh: "把创意落实为完整作品"
    zh-TW: "把創意落實為完整作品"
    ja: "アイデアを完成作品にする"
    ko: "아이디어를 완성작으로 만들기"
    vi: "Biến ý tưởng thành tác phẩm"
    ms: "Jadikan konsep karya lengkap"
    id: "Mengubah konsep jadi karya utuh"
    hi: "विचार को पूरी रचना में बदलना"
  - en: "Present and critique creative work"
    zh: "展示并评析创作作品"
    zh-TW: "展示並評析創作作品"
    ja: "創作物を発表し批評する"
    ko: "창작물 발표하고 비평하기"
    vi: "Trình bày và phê bình tác phẩm"
    ms: "Bentang dan kritik karya kreatif"
    id: "Mempresentasikan dan mengkritik karya"
    hi: "रचनात्मक काम प्रस्तुत करना और परखना"
