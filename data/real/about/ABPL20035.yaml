code: ABPL20035
year: 2026
learn:
  en: "Why cities matter, from local councils to global cities: growth, inequality and how urban places are run."
  zh: "城市为何重要：从地方政府到全球城市，谈增长、不平等与城市治理。"
  zh-TW: "城市為何重要：從地方政府到全球城市，談成長、不平等與城市治理。"
  ja: "都市はなぜ重要か：地方自治体からグローバル都市まで、成長・格差・統治を考える。"
  ko: "도시가 왜 중요한가: 지방정부부터 글로벌 도시까지 성장, 불평등, 도시 운영."
  vi: "Vì sao thành phố quan trọng, từ chính quyền địa phương đến đô thị toàn cầu: tăng trưởng, bất bình đẳng, quản trị."
  ms: "Mengapa bandar penting, dari majlis tempatan ke bandar global: pertumbuhan, ketaksamaan dan tadbir urus."
  id: "Mengapa kota penting, dari pemerintah lokal hingga kota global: pertumbuhan, ketimpangan, dan tata kelola."
  hi: "शहर क्यों अहम हैं, स्थानीय परिषद से वैश्विक शहर तक: विकास, असमानता और शासन।"
outcomes:
  - en: "Explain how global forces shape local places"
    zh: "说明全球力量如何塑造本地场所"
    zh-TW: "說明全球力量如何塑造在地場所"
    ja: "世界的な力が地域をどう形づくるか説明する"
    ko: "세계적 힘이 지역을 만드는 방식 설명하기"
    vi: "Giải thích lực toàn cầu định hình nơi chốn địa phương"
    ms: "Jelaskan cara daya global membentuk tempat tempatan"
    id: "Menjelaskan pengaruh global pada tempat lokal"
    hi: "वैश्विक ताक़तें स्थानीय जगहों को कैसे गढ़ती हैं, समझाना"
  - en: "Collect and use field data about a suburb"
    zh: "收集并运用某个社区的实地资料"
    zh-TW: "收集並運用某個社區的實地資料"
    ja: "地区の現地データを集めて使う"
    ko: "한 지역의 현장 자료 수집·활용하기"
    vi: "Thu thập và dùng dữ liệu thực địa về một khu"
    ms: "Kumpul dan guna data lapangan tentang satu kawasan"
    id: "Mengumpulkan dan memakai data lapangan suatu kawasan"
    hi: "किसी इलाक़े का फ़ील्ड डेटा जुटाना और इस्तेमाल करना"
  - en: "Discuss equity issues in city planning"
    zh: "讨论城市规划中的公平问题"
    zh-TW: "討論都市計畫中的公平問題"
    ja: "都市計画の公平性を論じる"
    ko: "도시계획의 형평성 문제 논의하기"
    vi: "Thảo luận vấn đề công bằng trong quy hoạch"
    ms: "Bincang isu keadilan dalam perancangan bandar"
    id: "Membahas isu keadilan dalam perencanaan kota"
    hi: "शहरी योजना में बराबरी के मुद्दों पर चर्चा"
