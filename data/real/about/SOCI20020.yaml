code: SOCI20020
year: 2026
learn:
  en: "How societies relate to nature, why environmental problems are social problems, and how movements push for sustainability."
  zh: "社会如何看待自然、环境问题为何是社会问题，以及社会运动如何推动可持续。"
  zh-TW: "社會如何看待自然、環境問題為何是社會問題，以及社會運動如何推動永續。"
  ja: "社会と自然の関係、環境問題が社会問題である理由、運動が持続可能性をどう求めるかを学ぶ。"
  ko: "사회와 자연의 관계, 환경 문제가 왜 사회 문제인지, 운동이 지속가능성을 어떻게 이끄는지 배운다."
  vi: "Xã hội nhìn nhận thiên nhiên ra sao, vì sao vấn đề môi trường là vấn đề xã hội, và các phong trào thúc đẩy bền vững thế nào."
  ms: "Hubungan masyarakat dengan alam, mengapa isu alam sekitar ialah isu sosial, dan cara gerakan mendesak kelestarian."
  id: "Hubungan masyarakat dengan alam, mengapa masalah lingkungan adalah masalah sosial, dan cara gerakan mendorong keberlanjutan."
  hi: "समाज प्रकृति से कैसे जुड़ते हैं, पर्यावरण की समस्याएं सामाजिक क्यों हैं, और आंदोलन टिकाऊपन के लिए कैसे दबाव डालते हैं।"
outcomes:
  - en: "Explain core ideas in environmental sociology"
    zh: "说明环境社会学的核心概念"
    zh-TW: "說明環境社會學的核心概念"
    ja: "環境社会学の主要な考え方を説明する"
    ko: "환경사회학의 핵심 개념 설명하기"
    vi: "Giải thích các ý tưởng chính của xã hội học môi trường"
    ms: "Terangkan idea utama sosiologi alam sekitar"
    id: "Menjelaskan gagasan utama sosiologi lingkungan"
    hi: "पर्यावरण समाजशास्त्र के मुख्य विचार समझाना"
  - en: "Analyse environmental movements and conflicts"
    zh: "分析环境运动与冲突"
    zh-TW: "分析環境運動與衝突"
    ja: "環境運動と対立を分析する"
    ko: "환경 운동과 갈등 분석하기"
    vi: "Phân tích các phong trào và xung đột môi trường"
    ms: "Analisis gerakan dan konflik alam sekitar"
    id: "Menganalisis gerakan dan konflik lingkungan"
    hi: "पर्यावरण आंदोलनों और टकरावों का विश्लेषण करना"
  - en: "Link climate change to social inequality"
    zh: "把气候变化与社会不平等联系起来"
    zh-TW: "把氣候變遷與社會不平等聯繫起來"
    ja: "気候変動と社会的不平等を結びつける"
    ko: "기후 변화를 사회 불평등과 연결하기"
    vi: "Liên hệ biến đổi khí hậu với bất bình đẳng xã hội"
    ms: "Kaitkan perubahan iklim dengan ketaksamaan sosial"
    id: "Mengaitkan perubahan iklim dengan ketimpangan sosial"
    hi: "जलवायु परिवर्तन को सामाजिक असमानता से जोड़ना"
