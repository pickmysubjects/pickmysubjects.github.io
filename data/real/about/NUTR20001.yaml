code: NUTR20001
year: 2026
learn:
  en: "How modern diets differ from what humans evolved on, and links to obesity, diabetes, heart disease and cancer."
  zh: "现代饮食与人类进化时的饮食有何不同，及其与肥胖、糖尿病、心脏病、癌症的关系。"
  zh-TW: "現代飲食與人類演化時的飲食有何不同，及其與肥胖、糖尿病、心臟病、癌症的關聯。"
  ja: "現代の食事と進化時の食事の違い、肥満・糖尿病・心臓病・がんとの関係。"
  ko: "현대 식단이 진화 과정의 식단과 어떻게 다른지, 비만·당뇨·심장병·암과의 관계."
  vi: "Chế độ ăn hiện đại khác thời tiến hóa ra sao và liên quan béo phì, tiểu đường, tim mạch, ung thư."
  ms: "Beza diet moden dengan diet evolusi manusia, dan kaitannya dengan obesiti, diabetes, sakit jantung, kanser."
  id: "Beda pola makan modern dengan masa evolusi manusia, serta kaitannya dengan obesitas, diabetes, jantung, kanker."
  hi: "आधुनिक आहार विकासकालीन आहार से कैसे अलग है और मोटापा, डायबिटीज़, हृदय रोग व कैंसर से इसका संबंध।"
outcomes:
  - en: "Judge the strengths of cohort studies and trials"
    zh: "评判队列研究和临床试验的优劣"
    zh-TW: "評判世代研究與臨床試驗的優劣"
    ja: "コホート研究と臨床試験の強弱を判断する"
    ko: "코호트 연구와 임상시험의 장단점 판단"
    vi: "Đánh giá ưu nhược nghiên cứu đoàn hệ và thử nghiệm"
    ms: "Nilai kekuatan kajian kohort dan ujian klinikal"
    id: "Menilai kekuatan studi kohort dan uji klinis"
    hi: "कोहोर्ट अध्ययन और ट्रायल की खूबियां परखना"
  - en: "Outline nutrition needs from pregnancy to old age"
    zh: "概述从孕期到老年的营养需求"
    zh-TW: "概述從孕期到老年的營養需求"
    ja: "妊娠から老年期までの栄養要件を概説する"
    ko: "임신부터 노년까지 영양 요구 개요"
    vi: "Nêu nhu cầu dinh dưỡng từ thai kỳ đến tuổi già"
    ms: "Gariskan keperluan nutrisi dari janin hingga tua"
    id: "Menguraikan kebutuhan gizi dari janin hingga lansia"
    hi: "गर्भ से बुढ़ापे तक पोषण ज़रूरतें बताना"
