code: ABPL90017
year: 2027
learn:
  en: "Contemporary urban design theories and how city form responds to economic, social, political and natural forces."
  zh: "当代城市设计理论，以及城市形态如何回应经济、社会、政治和自然力量。"
  zh-TW: "當代都市設計理論，以及都市形態如何回應經濟、社會、政治與自然力量。"
  ja: "現代の都市デザイン理論と、都市の形が経済・社会・政治・自然にどう応えるか。"
  ko: "현대 도시설계 이론과 도시 형태가 경제·사회·정치·자연에 반응하는 방식."
  vi: "Lý thuyết thiết kế đô thị đương đại và cách hình thái đô thị phản ứng với các lực xã hội, tự nhiên."
  ms: "Teori reka bentuk bandar semasa dan cara bentuk bandar bertindak balas kepada kuasa sosial dan alam."
  id: "Teori desain kota kontemporer dan cara bentuk kota merespons kekuatan sosial dan alam."
  hi: "समकालीन शहरी डिज़ाइन सिद्धांत और शहर का रूप आर्थिक, सामाजिक व प्राकृतिक शक्तियों पर कैसे प्रतिक्रिया देता है।"
outcomes:
  - en: "Critique a range of urban design theories"
    zh: "批判性地评析多种城市设计理论"
    zh-TW: "批判性地評析多種都市設計理論"
    ja: "さまざまな都市デザイン理論を批評する"
    ko: "여러 도시설계 이론 비평하기"
    vi: "Phê bình nhiều lý thuyết thiết kế đô thị"
    ms: "Mengkritik pelbagai teori reka bentuk bandar"
    id: "Mengkritisi berbagai teori desain kota"
    hi: "विभिन्न शहरी डिज़ाइन सिद्धांतों की आलोचना"
  - en: "Analyse a place at multiple scales in words and drawings"
    zh: "用文字和图纸做多尺度场地分析"
    zh-TW: "用文字與圖面做多尺度場域分析"
    ja: "文章と図で多スケールの都市分析をする"
    ko: "글과 도면으로 다중 스케일 분석하기"
    vi: "Phân tích đa tỉ lệ bằng chữ và hình vẽ"
    ms: "Menganalisis tempat pada pelbagai skala"
    id: "Menganalisis tempat di berbagai skala"
    hi: "शब्दों और चित्रों से बहु-स्तरीय विश्लेषण"
