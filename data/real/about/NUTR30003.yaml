code: NUTR30003
year: 2026
learn:
  en: "Nutrition needs across life stages: pregnancy, infancy, childhood, teens and older age."
  zh: "人生各阶段的营养需求：孕期、婴儿、儿童、青少年和老年。"
  zh-TW: "人生各階段的營養需求：孕期、嬰兒、兒童、青少年與老年。"
  ja: "ライフステージ別の栄養：妊娠、乳児、小児、思春期、高齢期。"
  ko: "생애 단계별 영양: 임신, 영아, 아동, 청소년, 노년."
  vi: "Nhu cầu dinh dưỡng theo giai đoạn đời: thai kỳ, sơ sinh, trẻ em, thiếu niên, tuổi già."
  ms: "Keperluan nutrisi mengikut peringkat hidup: hamil, bayi, kanak-kanak, remaja dan warga tua."
  id: "Kebutuhan gizi tiap tahap hidup: hamil, bayi, anak, remaja dan lansia."
  hi: "जीवन के हर चरण में पोषण: गर्भावस्था, शैशव, बचपन, किशोरावस्था और बुढ़ापा।"
outcomes:
  - en: "Assess child growth and spot poor growth"
    zh: "评估儿童生长，识别发育异常"
    zh-TW: "評估兒童生長，辨識發育異常"
    ja: "子どもの成長を評価し異常を見つける"
    ko: "아동 성장 평가 및 이상 식별"
    vi: "Đánh giá tăng trưởng trẻ và phát hiện bất thường"
    ms: "Nilai tumbesaran kanak-kanak dan kesan masalah"
    id: "Menilai pertumbuhan anak dan mengenali masalah"
    hi: "बच्चों की वृद्धि आंकना और कमी पहचानना"
  - en: "Apply nutrient reference values in diet checks"
    zh: "在膳食评估中运用营养素参考值"
    zh-TW: "在膳食評估中運用營養素參考值"
    ja: "食事評価で栄養素基準値を使う"
    ko: "식이 평가에 영양소 기준치 적용"
    vi: "Áp dụng giá trị tham chiếu dinh dưỡng"
    ms: "Guna nilai rujukan nutrien dalam penilaian"
    id: "Menerapkan nilai acuan gizi dalam penilaian"
    hi: "आहार जांच में पोषक संदर्भ मान लागू करना"
  - en: "Plan ways to manage childhood obesity"
    zh: "制定儿童肥胖的管理策略"
    zh-TW: "擬定兒童肥胖的管理策略"
    ja: "小児肥満の管理策を立てる"
    ko: "소아 비만 관리 전략 수립"
    vi: "Lập chiến lược quản lý béo phì trẻ em"
    ms: "Rancang strategi urus obesiti kanak-kanak"
    id: "Menyusun strategi atasi obesitas anak"
    hi: "बचपन के मोटापे से निपटने की योजना बनाना"
