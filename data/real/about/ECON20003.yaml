code: ECON20003
year: 2026
learn:
  en: "Statistics and analytics tools for business problems, done in software with reproducible analysis."
  zh: "用软件做商业统计分析，强调结果可以复现。"
  zh-TW: "用軟體做商業統計分析，強調結果可以重現。"
  ja: "ビジネス課題のための統計・分析ツールを、再現可能な形でソフトウェアで使う。"
  ko: "비즈니스 문제를 위한 통계·분석 도구를 소프트웨어로, 재현 가능하게 다룬다."
  vi: "Công cụ thống kê và phân tích cho bài toán kinh doanh, làm trên phần mềm, có thể tái lập."
  ms: "Alat statistik dan analitik untuk masalah perniagaan, guna perisian dengan analisis boleh ulang."
  id: "Alat statistik dan analitik untuk masalah bisnis, dikerjakan di software dengan analisis yang bisa diulang."
  hi: "बिज़नेस समस्याओं के लिए स्टैटिस्टिक्स और एनालिटिक्स टूल, सॉफ़्टवेयर में दोहराए जा सकने वाले विश्लेषण के साथ।"
outcomes:
  - en: "Model relationships between business variables"
    zh: "为商业变量之间的关系建模"
    zh-TW: "為商業變數之間的關係建模"
    ja: "ビジネス変数間の関係をモデル化する"
    ko: "비즈니스 변수 간 관계 모델링"
    vi: "Mô hình hóa quan hệ giữa các biến kinh doanh"
    ms: "Modelkan hubungan antara pemboleh ubah perniagaan"
    id: "Memodelkan hubungan antar variabel bisnis"
    hi: "बिज़नेस वेरिएबल्स के बीच संबंध मॉडल करना"
  - en: "Check a model's assumptions and limits"
    zh: "检查模型的假设和局限"
    zh-TW: "檢查模型的假設和侷限"
    ja: "モデルの前提と限界を確認する"
    ko: "모형의 가정과 한계 점검"
    vi: "Kiểm tra giả định và giới hạn của mô hình"
    ms: "Semak andaian dan had model"
    id: "Memeriksa asumsi dan batasan model"
    hi: "मॉडल की मान्यताएँ और सीमाएँ जाँचना"
  - en: "Explain statistical findings to others"
    zh: "向别人讲清统计结论"
    zh-TW: "向別人講清楚統計結論"
    ja: "統計的な結果を他の人に説明する"
    ko: "통계 결과를 남에게 설명"
    vi: "Giải thích kết quả thống kê cho người khác"
    ms: "Terangkan dapatan statistik kepada orang lain"
    id: "Menjelaskan temuan statistik ke orang lain"
    hi: "दूसरों को स्टैटिस्टिकल नतीजे समझाना"
