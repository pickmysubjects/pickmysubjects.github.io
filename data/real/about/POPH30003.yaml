code: POPH30003
year: 2026
learn:
  en: "Using epidemiology on real health cases, from reading study evidence to modelling how an infection spreads."
  zh: "把流行病学用在真实的健康案例上，从解读研究证据到建模预测传染病如何传播。"
  zh-TW: "把流行病學用在真實的健康案例上，從解讀研究證據到建模預測傳染病如何傳播。"
  ja: "実際の健康事例に疫学を使い、研究の根拠を読むことから感染の広がりのモデル化までを学ぶ。"
  ko: "실제 건강 사례에 역학을 적용해, 연구 근거를 읽는 것부터 감염 확산 모델링까지 다룬다."
  vi: "Áp dụng dịch tễ học vào các tình huống sức khỏe thật, từ đọc bằng chứng nghiên cứu đến mô hình hóa sự lây lan của bệnh."
  ms: "Menggunakan epidemiologi pada kes kesihatan sebenar, daripada membaca bukti kajian hingga memodelkan penularan jangkitan."
  id: "Menerapkan epidemiologi pada kasus kesehatan nyata, dari membaca bukti studi hingga memodelkan penyebaran infeksi."
  hi: "असली स्वास्थ्य मामलों पर एपिडेमियोलॉजी लगाना, स्टडी के सबूत पढ़ने से लेकर संक्रमण फैलने का मॉडल बनाने तक।"
outcomes:
  - en: "Judge how strong health study evidence is, including bias and confounding"
    zh: "判断一项健康研究的证据有多可靠，包括偏倚和混杂"
    zh-TW: "判斷一項健康研究的證據有多可靠，包括偏誤和干擾"
    ja: "バイアスや交絡も含めて、健康研究の根拠の強さを判断する"
    ko: "편향과 교란을 포함해 건강 연구 근거가 얼마나 믿을 만한지 판단하기"
    vi: "Đánh giá độ tin cậy của bằng chứng từ một nghiên cứu sức khỏe, kể cả sai lệch và nhiễu"
    ms: "Menilai kekuatan bukti kajian kesihatan, termasuk bias dan pengeliruan"
    id: "Menilai seberapa kuat bukti dari studi kesehatan, termasuk bias dan perancu"
    hi: "किसी हेल्थ स्टडी के सबूत कितने मज़बूत हैं, बायस और कन्फ़ाउंडिंग समेत, यह परखना"
  - en: "Analyse health data and use the results to make public health decisions"
    zh: "分析健康数据，并用结果做公共卫生决策"
    zh-TW: "分析健康資料，並用結果做公共衛生決策"
    ja: "健康データを分析し、その結果を公衆衛生の判断に使う"
    ko: "건강 데이터를 분석하고 그 결과로 공중보건 결정을 내리기"
    vi: "Phân tích dữ liệu sức khỏe và dùng kết quả để ra quyết định y tế công cộng"
    ms: "Menganalisis data kesihatan dan menggunakan hasilnya untuk keputusan kesihatan awam"
    id: "Menganalisis data kesehatan dan memakai hasilnya untuk keputusan kesehatan masyarakat"
    hi: "हेल्थ डेटा का विश्लेषण करना और नतीजों से पब्लिक हेल्थ के फ़ैसले लेना"
  - en: "Build a simple model of how an infectious disease spreads"
    zh: "搭建一个传染病传播的简单模型"
    zh-TW: "建立一個傳染病傳播的簡單模型"
    ja: "感染症の広がり方の簡単なモデルを作る"
    ko: "감염병 확산의 간단한 모델 만들기"
    vi: "Xây dựng mô hình đơn giản về cách bệnh truyền nhiễm lây lan"
    ms: "Membina model ringkas penularan penyakit berjangkit"
    id: "Membuat model sederhana penyebaran penyakit menular"
    hi: "संक्रामक बीमारी कैसे फैलती है, इसका एक सरल मॉडल बनाना"
