code: JEWI20007
year: 2026
learn:
  en: "Modern Israeli history from statehood: building the nation and its democracy, its internal divisions, and the critiques of it."
  zh: "建国以来的以色列现代史：国家与民主的建设、内部分歧，以及对它的批评。"
  zh-TW: "建國以來的以色列現代史：國家與民主的建設、內部分歧，以及對它的批評。"
  ja: "建国以降のイスラエル現代史。国家と民主制の形成、内部の分断、それへの批判を学ぶ。"
  ko: "건국 이후 이스라엘 현대사: 국가와 민주주의 건설, 내부 분열, 그에 대한 비판을 배운다."
  vi: "Lịch sử Israel hiện đại từ khi lập quốc: xây dựng quốc gia, nền dân chủ, các chia rẽ nội bộ và những phê phán."
  ms: "Sejarah moden Israel sejak penubuhan negara: pembinaan negara dan demokrasi, perpecahan dalaman dan kritikan terhadapnya."
  id: "Sejarah modern Israel sejak berdiri: pembangunan negara dan demokrasi, perpecahan internal, dan kritik terhadapnya."
  hi: "राज्य बनने के बाद आधुनिक इज़राइल का इतिहास: राष्ट्र और लोकतंत्र का निर्माण, आंतरिक विभाजन और उसकी आलोचनाएँ।"
outcomes:
  - en: "Outline how Israel's state institutions formed"
    zh: "概述以色列国家制度的形成"
    zh-TW: "概述以色列國家制度的形成"
    ja: "イスラエルの国家制度の成り立ちをまとめる"
    ko: "이스라엘 국가 제도의 형성 정리하기"
    vi: "Tóm tắt sự hình thành thể chế nhà nước Israel"
    ms: "Ringkaskan pembentukan institusi negara Israel"
    id: "Merangkum pembentukan lembaga negara Israel"
    hi: "इज़राइल की राज्य संस्थाओं के बनने की रूपरेखा देना"
  - en: "Analyse divisions within Israeli society"
    zh: "分析以色列社会内部的分歧"
    zh-TW: "分析以色列社會內部的分歧"
    ja: "イスラエル社会内の分断を分析する"
    ko: "이스라엘 사회 내부 분열 분석하기"
    vi: "Phân tích các chia rẽ trong xã hội Israel"
    ms: "Analisis perpecahan dalam masyarakat Israel"
    id: "Menganalisis perpecahan dalam masyarakat Israel"
    hi: "इज़राइली समाज के भीतर विभाजनों का विश्लेषण करना"
  - en: "Assess critiques of Zionism and Israeli history"
    zh: "评估对锡安主义和以色列历史的批评"
    zh-TW: "評估對錫安主義和以色列歷史的批評"
    ja: "シオニズムとイスラエル史への批判を評価する"
    ko: "시오니즘과 이스라엘 역사에 대한 비판 평가하기"
    vi: "Đánh giá các phê phán về chủ nghĩa Zion và lịch sử Israel"
    ms: "Nilai kritikan terhadap Zionisme dan sejarah Israel"
    id: "Menilai kritik atas Zionisme dan sejarah Israel"
    hi: "ज़ायनवाद और इज़राइली इतिहास की आलोचनाओं का आकलन करना"
