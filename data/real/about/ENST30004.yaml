code: ENST30004
year: 2026
learn:
  en: "How human values, psychology and culture shape which species and places we choose to protect."
  zh: "人的价值观、心理和文化如何影响我们选择保护哪些物种和地方。"
  zh-TW: "人的價值觀、心理和文化如何影響我們選擇保護哪些物種和地方。"
  ja: "人の価値観・心理・文化が、どの種や場所を守るかの選択をどう左右するか。"
  ko: "인간의 가치관·심리·문화가 어떤 종과 장소를 보호할지에 어떻게 영향을 주는지."
  vi: "Giá trị, tâm lý và văn hóa con người quyết định ta bảo vệ loài và nơi nào ra sao."
  ms: "Bagaimana nilai, psikologi dan budaya manusia menentukan spesies dan tempat yang kita lindungi."
  id: "Bagaimana nilai, psikologi, dan budaya manusia menentukan spesies dan tempat yang kita lindungi."
  hi: "इंसानी मूल्य, मनोविज्ञान और संस्कृति तय करते हैं कि हम किन प्रजातियों और जगहों को बचाएँ।"
outcomes:
  - en: "Analyse social factors in conservation decisions"
    zh: "分析保护决策中的社会因素"
    zh-TW: "分析保育決策中的社會因素"
    ja: "保全の意思決定における社会的要因を分析する"
    ko: "보전 결정의 사회적 요인을 분석한다"
    vi: "Phân tích yếu tố xã hội trong bảo tồn"
    ms: "Analisis faktor sosial dalam keputusan pemuliharaan"
    id: "Menganalisis faktor sosial dalam keputusan konservasi"
    hi: "संरक्षण निर्णयों में सामाजिक कारकों का विश्लेषण"
  - en: "Design practical conservation strategies"
    zh: "设计实用的保护策略"
    zh-TW: "設計實用的保育策略"
    ja: "実践的な保全戦略を立てる"
    ko: "실용적인 보전 전략을 설계한다"
    vi: "Thiết kế chiến lược bảo tồn thực tế"
    ms: "Reka strategi pemuliharaan praktikal"
    id: "Merancang strategi konservasi praktis"
    hi: "व्यावहारिक संरक्षण रणनीतियाँ बनाना"
