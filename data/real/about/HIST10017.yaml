code: HIST10017
year: 2026
learn:
  en: "How ideas about gender, race and sexuality have changed across time and cultures, and who held power."
  zh: "关于性别、种族和性的观念在不同时代和文化中如何变化，以及谁掌握权力。"
  zh-TW: "關於性別、種族和性的觀念在不同時代和文化中如何變化，以及誰掌握權力。"
  ja: "ジェンダー・人種・セクシュアリティの考え方が時代や文化でどう変わり、誰が力を持っていたかを学ぶ。"
  ko: "젠더, 인종, 섹슈얼리티에 대한 생각이 시대와 문화에 따라 어떻게 변했고 누가 권력을 쥐었는지 배운다."
  vi: "Quan niệm về giới, chủng tộc và tính dục đã thay đổi qua các thời kỳ và nền văn hóa ra sao, và ai nắm quyền lực."
  ms: "Cara idea tentang gender, kaum dan seksualiti berubah merentas zaman dan budaya, dan siapa yang berkuasa."
  id: "Cara gagasan tentang gender, ras, dan seksualitas berubah lintas zaman dan budaya, serta siapa yang berkuasa."
  hi: "जेंडर, नस्ल और यौनिकता के बारे में विचार समय और संस्कृतियों के साथ कैसे बदले, और सत्ता किसके पास रही।"
outcomes:
  - en: "Describe how women shaped major world events"
    zh: "描述女性如何影响重大世界事件"
    zh-TW: "描述女性如何影響重大世界事件"
    ja: "女性が世界の大きな出来事にどう関わったかを説明する"
    ko: "여성이 세계 주요 사건에 어떻게 영향을 줬는지 설명하기"
    vi: "Mô tả phụ nữ đã góp phần định hình các sự kiện lớn ra sao"
    ms: "Huraikan cara wanita membentuk peristiwa besar dunia"
    id: "Menguraikan peran perempuan dalam peristiwa besar dunia"
    hi: "महिलाओं ने दुनिया की बड़ी घटनाओं को कैसे आकार दिया, बताना"
  - en: "Compare gender norms across regions and periods"
    zh: "比较不同地区和时期的性别规范"
    zh-TW: "比較不同地區和時期的性別規範"
    ja: "地域や時代ごとのジェンダー規範を比べる"
    ko: "지역과 시대별 젠더 규범 비교하기"
    vi: "So sánh chuẩn mực giới giữa các vùng và thời kỳ"
    ms: "Bandingkan norma gender merentas wilayah dan zaman"
    id: "Membandingkan norma gender antarwilayah dan zaman"
    hi: "अलग-अलग क्षेत्रों और दौर के जेंडर मानदंडों की तुलना करना"
  - en: "Build an argument from textual and visual sources"
    zh: "根据文字和图像史料构建论点"
    zh-TW: "根據文字和圖像史料建構論點"
    ja: "文字と図像の史料から議論を組み立てる"
    ko: "문헌과 시각 자료로 논증 세우기"
    vi: "Xây dựng lập luận từ nguồn văn bản và hình ảnh"
    ms: "Bina hujah daripada sumber teks dan visual"
    id: "Menyusun argumen dari sumber teks dan visual"
    hi: "लिखित और दृश्य स्रोतों से तर्क तैयार करना"
