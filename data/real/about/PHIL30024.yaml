code: PHIL30024
year: 2026
learn:
  en: "What it means to understand a text, from author's intention to reader response and deconstruction."
  zh: "理解一个文本意味着什么，从作者意图到读者反应和解构。"
  zh-TW: "理解一個文本意味著什麼，從作者意圖到讀者反應和解構。"
  ja: "テキストを理解するとはどういうことか。作者の意図から読者反応、脱構築までを考える。"
  ko: "텍스트를 이해한다는 것은 무엇인가. 작가 의도부터 독자 반응, 해체까지 다룬다."
  vi: "Hiểu một văn bản nghĩa là gì, từ ý định tác giả đến phản hồi người đọc và giải cấu trúc."
  ms: "Apa maksud memahami teks, daripada niat pengarang hingga respons pembaca dan dekonstruksi."
  id: "Apa artinya memahami teks, dari niat pengarang sampai respons pembaca dan dekonstruksi."
  hi: "किसी पाठ को समझने का क्या मतलब है, लेखक के इरादे से पाठक की प्रतिक्रिया और विखंडन तक।"
outcomes:
  - en: "Explain major theories of interpretation"
    zh: "说明主要的诠释理论"
    zh-TW: "說明主要的詮釋理論"
    ja: "主な解釈理論を説明する"
    ko: "주요 해석 이론 설명하기"
    vi: "Giải thích các lý thuyết diễn giải chính"
    ms: "Terangkan teori tafsiran utama"
    id: "Menjelaskan teori interpretasi utama"
    hi: "व्याख्या के मुख्य सिद्धांत समझाना"
  - en: "Assess the role of author and reader in meaning"
    zh: "评估作者与读者在意义中的角色"
    zh-TW: "評估作者與讀者在意義中的角色"
    ja: "意味における作者と読者の役割を評価する"
    ko: "의미에서 작가와 독자의 역할 평가하기"
    vi: "Đánh giá vai trò của tác giả và người đọc trong ý nghĩa"
    ms: "Nilai peranan pengarang dan pembaca dalam makna"
    id: "Menilai peran pengarang dan pembaca dalam makna"
    hi: "अर्थ में लेखक और पाठक की भूमिका परखना"
  - en: "Apply theories to interpret real texts"
    zh: "运用理论解读真实文本"
    zh-TW: "運用理論解讀真實文本"
    ja: "理論を使って実際のテキストを解釈する"
    ko: "이론으로 실제 텍스트 해석하기"
    vi: "Áp dụng lý thuyết để diễn giải văn bản thực"
    ms: "Gunakan teori untuk mentafsir teks sebenar"
    id: "Menerapkan teori untuk menafsirkan teks nyata"
    hi: "असली पाठों की व्याख्या में सिद्धांत लागू करना"
