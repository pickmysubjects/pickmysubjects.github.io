code: MUST10016
year: 2026
learn:
  en: "Deeper work in acting, singing and dance, including acting through song, choreography and production classes."
  zh: "深化表演、演唱与舞蹈，包括以歌演戏、编舞和制作课。"
  zh-TW: "深化表演、演唱與舞蹈，包括以歌演戲、編舞和製作課。"
  ja: "演技・歌・ダンスを深め、歌で演じる授業や振付・プロダクション授業も。"
  ko: "연기·노래·춤을 심화하며 노래로 연기하기, 안무, 프로덕션 수업도."
  vi: "Đào sâu diễn, hát, múa, gồm diễn qua bài hát, biên đạo và lớp dàn dựng."
  ms: "Mendalami lakonan, nyanyian dan tarian, termasuk lakonan melalui lagu dan koreografi."
  id: "Mendalami akting, menyanyi dan menari, termasuk akting lewat lagu dan koreografi."
  hi: "अभिनय, गायन और नृत्य में गहराई, गीत के ज़रिए अभिनय, कोरियोग्राफ़ी सहित।"
outcomes:
  - en: "Act through song"
    zh: "用歌声表演角色"
    zh-TW: "用歌聲表演角色"
    ja: "歌を通して演じる"
    ko: "노래로 연기하기"
    vi: "Diễn xuất qua bài hát"
    ms: "Berlakon melalui lagu"
    id: "Berakting lewat lagu"
    hi: "गीत के ज़रिए अभिनय करना"
  - en: "Perform choreography in a group"
    zh: "在群舞中完成编舞"
    zh-TW: "在群舞中完成編舞"
    ja: "グループで振付を踊る"
    ko: "그룹으로 안무 공연하기"
    vi: "Trình diễn vũ đạo theo nhóm"
    ms: "Persembah koreografi berkumpulan"
    id: "Membawakan koreografi berkelompok"
    hi: "समूह में कोरियोग्राफ़ी प्रस्तुत करना"
  - en: "Write a reflection on your training"
    zh: "写训练反思报告"
    zh-TW: "寫訓練反思報告"
    ja: "訓練の振り返りレポートを書く"
    ko: "훈련 성찰 보고서 쓰기"
    vi: "Viết báo cáo suy ngẫm về quá trình luyện tập"
    ms: "Tulis refleksi tentang latihan"
    id: "Menulis refleksi latihan"
    hi: "अपने प्रशिक्षण पर चिंतन लिखना"
