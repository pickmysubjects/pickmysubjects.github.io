code: PSYC10006
year: 2026
learn:
  en: "An online, six-week version of first-year psychology: learning, memory, perception, the brain and research methods."
  zh: "在线六周版的一年级心理学：学习、记忆、知觉、大脑和研究方法。"
  zh-TW: "線上六週版的一年級心理學：學習、記憶、知覺、大腦和研究方法。"
  ja: "1年次心理学のオンライン6週間版。学習、記憶、知覚、脳、研究方法を学ぶ。"
  ko: "1학년 심리학의 6주 온라인 과정: 학습, 기억, 지각, 뇌, 연구 방법을 배운다."
  vi: "Phiên bản trực tuyến 6 tuần của tâm lý học năm nhất: học tập, trí nhớ, tri giác, não bộ và phương pháp nghiên cứu."
  ms: "Versi dalam talian enam minggu psikologi tahun pertama: pembelajaran, ingatan, persepsi, otak dan kaedah kajian."
  id: "Versi daring enam minggu psikologi tahun pertama: belajar, memori, persepsi, otak, dan metode riset."
  hi: "पहले साल के मनोविज्ञान का छह हफ़्ते का ऑनलाइन रूप: सीखना, स्मृति, बोध, मस्तिष्क और शोध विधियाँ।"
outcomes:
  - en: "Describe how learning and memory work"
    zh: "描述学习与记忆如何运作"
    zh-TW: "描述學習與記憶如何運作"
    ja: "学習と記憶の仕組みを説明する"
    ko: "학습과 기억의 작동 방식 설명하기"
    vi: "Mô tả cách học tập và trí nhớ hoạt động"
    ms: "Huraikan cara pembelajaran dan ingatan berfungsi"
    id: "Mendeskripsikan cara kerja belajar dan memori"
    hi: "सीखना और स्मृति कैसे काम करते हैं, वर्णन करना"
  - en: "Explain the basics of the brain and nervous system"
    zh: "解释大脑与神经系统的基础知识"
    zh-TW: "解釋大腦與神經系統的基礎知識"
    ja: "脳と神経系の基本を説明する"
    ko: "뇌와 신경계의 기초 설명하기"
    vi: "Giải thích kiến thức cơ bản về não và hệ thần kinh"
    ms: "Terangkan asas otak dan sistem saraf"
    id: "Menjelaskan dasar otak dan sistem saraf"
    hi: "मस्तिष्क और तंत्रिका तंत्र की मूल बातें समझाना"
  - en: "Discuss psychology research methods and ethics"
    zh: "讨论心理学研究方法与伦理"
    zh-TW: "討論心理學研究方法與倫理"
    ja: "心理学の研究方法と倫理を論じる"
    ko: "심리학 연구 방법과 윤리 논의하기"
    vi: "Thảo luận phương pháp và đạo đức nghiên cứu tâm lý"
    ms: "Bincangkan kaedah dan etika kajian psikologi"
    id: "Membahas metode dan etika riset psikologi"
    hi: "मनोविज्ञान की शोध विधियों और नैतिकता पर चर्चा करना"
