code: ITAL20009
year: 2026
learn:
  en: "Key parts of Italian culture through literary texts, and how Italian society has developed. Winter in Italy or on campus."
  zh: "通过文学作品了解意大利文化与社会发展，可冬季赴意或在校修读。"
  zh-TW: "透過文學作品了解義大利文化與社會發展，可冬季赴義或在校修讀。"
  ja: "文学作品などを通してイタリア文化と社会の発展を学ぶ。冬のイタリア集中か学内で受講。"
  ko: "문학 작품 등으로 이탈리아 문화와 사회 발전을 배운다. 겨울 이탈리아 집중 또는 교내 수강."
  vi: "Văn hóa Ý qua văn học và sự phát triển xã hội Ý. Học mùa đông tại Ý hoặc tại trường."
  ms: "Budaya Itali melalui teks sastera dan perkembangan masyarakatnya. Musim sejuk di Itali atau di kampus."
  id: "Budaya Italia melalui teks sastra dan perkembangan masyarakatnya. Musim dingin di Italia atau di kampus."
  hi: "साहित्यिक पाठों से इतालवी संस्कृति और समाज का विकास। सर्दियों में इटली में या कैंपस पर।"
outcomes:
  - en: "Analyse Italian novels, stories and films"
    zh: "分析意大利小说、故事和电影"
    zh-TW: "分析義大利小說、故事和電影"
    ja: "イタリアの小説・物語・映画を分析する"
    ko: "이탈리아 소설·이야기·영화 분석하기"
    vi: "Phân tích tiểu thuyết, truyện và phim Ý"
    ms: "Analisis novel, cerita dan filem Itali"
    id: "Menganalisis novel, cerita dan film Italia"
    hi: "इतालवी उपन्यासों, कहानियों और फ़िल्मों का विश्लेषण करना"
  - en: "Trace how Italian society has changed"
    zh: "梳理意大利社会的变化"
    zh-TW: "梳理義大利社會的變化"
    ja: "イタリア社会の変化をたどる"
    ko: "이탈리아 사회의 변화 짚어 보기"
    vi: "Theo dõi xã hội Ý đã thay đổi ra sao"
    ms: "Jejaki perubahan masyarakat Itali"
    id: "Menelusuri perubahan masyarakat Italia"
    hi: "इतालवी समाज के बदलाव को समझना"
  - en: "Write critically about Italian history and culture"
    zh: "批判性地写作意大利历史与文化"
    zh-TW: "批判性地寫作義大利歷史與文化"
    ja: "イタリアの歴史と文化について批判的に書く"
    ko: "이탈리아 역사와 문화에 대해 비판적으로 쓰기"
    vi: "Viết có phê phán về lịch sử, văn hóa Ý"
    ms: "Tulis secara kritis tentang sejarah dan budaya Itali"
    id: "Menulis kritis tentang sejarah dan budaya Italia"
    hi: "इतालवी इतिहास और संस्कृति पर आलोचनात्मक लिखना"
