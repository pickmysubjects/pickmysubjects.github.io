code: ITAL20009
year: 2026
learn:
  en: "Italian culture and society through texts, films and art, studied with the Italian you already have."
  zh: "通过文本、电影和艺术了解意大利文化与社会，并运用已学的意大利语。"
  zh-TW: "透過文本、電影和藝術了解義大利文化與社會，並運用已學的義大利語。"
  ja: "文章・映画・芸術を通してイタリアの文化と社会を学び、身につけたイタリア語を使う。"
  ko: "글·영화·예술로 이탈리아 문화와 사회를 배우며 익힌 이탈리아어를 쓴다."
  vi: "Văn hóa và xã hội Ý qua văn bản, phim và nghệ thuật, học bằng vốn tiếng Ý đã có."
  ms: "Budaya dan masyarakat Itali melalui teks, filem dan seni, dikaji dengan bahasa Itali yang sudah ada."
  id: "Budaya dan masyarakat Italia melalui teks, film dan seni, dipelajari dengan bahasa Italia yang sudah dikuasai."
  hi: "पाठों, फ़िल्मों और कला से इतालवी संस्कृति और समाज, अपनी मौजूदा इतालवी के साथ।"
outcomes:
  - en: "Discuss Italian culture and society"
    zh: "讨论意大利文化与社会"
    zh-TW: "討論義大利文化與社會"
    ja: "イタリアの文化と社会について話し合う"
    ko: "이탈리아 문화와 사회 토론하기"
    vi: "Thảo luận văn hóa và xã hội Ý"
    ms: "Bincangkan budaya dan masyarakat Itali"
    id: "Membahas budaya dan masyarakat Italia"
    hi: "इतालवी संस्कृति और समाज पर चर्चा करना"
  - en: "Analyse Italian texts and films"
    zh: "分析意大利文本和电影"
    zh-TW: "分析義大利文本和電影"
    ja: "イタリアの文章や映画を分析する"
    ko: "이탈리아 글과 영화 분석하기"
    vi: "Phân tích văn bản và phim Ý"
    ms: "Analisis teks dan filem Itali"
    id: "Menganalisis teks dan film Italia"
    hi: "इतालवी पाठों और फ़िल्मों का विश्लेषण करना"
  - en: "Present and write about cultural topics"
    zh: "就文化话题做报告和写作"
    zh-TW: "就文化話題做報告和寫作"
    ja: "文化の話題について発表し書く"
    ko: "문화 주제로 발표하고 글쓰기"
    vi: "Thuyết trình và viết về chủ đề văn hóa"
    ms: "Bentang dan tulis tentang topik budaya"
    id: "Presentasi dan menulis tentang topik budaya"
    hi: "सांस्कृतिक विषयों पर प्रस्तुति देना और लिखना"
