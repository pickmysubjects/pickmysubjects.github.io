code: EVSC30003
year: 2026
learn:
  en: "Tools for assessing environmental risk, from exposure pathways and toxicology to decisions under uncertainty."
  zh: "评估环境风险的工具：从暴露途径、毒理学到不确定性下的决策。"
  zh-TW: "評估環境風險的工具：從暴露途徑、毒理學到不確定性下的決策。"
  ja: "環境リスク評価の手法：曝露経路や毒性学から不確実性下の意思決定まで。"
  ko: "환경 위험 평가 도구: 노출 경로와 독성학부터 불확실성 속 의사결정까지."
  vi: "Công cụ đánh giá rủi ro môi trường, từ con đường phơi nhiễm, độc chất học đến quyết định khi bất định."
  ms: "Alat menilai risiko alam sekitar, dari laluan pendedahan dan toksikologi hingga keputusan dalam ketidakpastian."
  id: "Alat menilai risiko lingkungan, dari jalur paparan dan toksikologi hingga keputusan dalam ketidakpastian."
  hi: "पर्यावरणीय जोखिम आँकने के टूल: एक्सपोज़र पाथवे और टॉक्सिकोलॉजी से अनिश्चितता में निर्णय तक।"
outcomes:
  - en: "Frame decisions with risk-assessment frameworks"
    zh: "用风险评估框架构建决策问题"
    zh-TW: "用風險評估框架建構決策問題"
    ja: "リスク評価の枠組みで意思決定を整理する"
    ko: "위험 평가 틀로 의사결정을 구성한다"
    vi: "Dùng khung đánh giá rủi ro để ra quyết định"
    ms: "Rangka keputusan dengan kerangka penilaian risiko"
    id: "Menyusun keputusan dengan kerangka penilaian risiko"
    hi: "रिस्क असेसमेंट फ़्रेमवर्क से निर्णय तय करना"
  - en: "Apply quantitative risk-assessment tools"
    zh: "运用定量风险评估工具"
    zh-TW: "運用定量風險評估工具"
    ja: "定量的なリスク評価手法を使う"
    ko: "정량적 위험 평가 도구를 쓴다"
    vi: "Áp dụng công cụ đánh giá rủi ro định lượng"
    ms: "Guna alat penilaian risiko kuantitatif"
    id: "Menerapkan alat penilaian risiko kuantitatif"
    hi: "मात्रात्मक जोखिम आकलन टूल लगाना"
