code: MUSI10245
year: 2027
learn:
  en: "Rehearse and perform wind band music in a concert band, from score study to a public concert each semester."
  zh: "在管乐团中排练和演出，从读总谱到每学期一场公开演出。"
  zh-TW: "在管樂團中排練和演出，從讀總譜到每學期一場公開演出。"
  ja: "コンサートバンドで吹奏楽曲を練習・演奏。スコア研究から毎学期の公開演奏まで。"
  ko: "콘서트 밴드에서 관악 합주곡 연습과 공연: 악보 공부부터 학기마다 공개 공연까지."
  vi: "Tập và biểu diễn nhạc kèn hơi trong ban nhạc hòa tấu, từ đọc tổng phổ đến buổi diễn công khai mỗi học kỳ."
  ms: "Berlatih dan mempersembahkan muzik band tiupan dalam kumpulan konsert, dari kajian skor hingga persembahan awam setiap semester."
  id: "Berlatih dan membawakan musik band tiup dalam concert band, dari mempelajari partitur hingga konser publik tiap semester."
  hi: "कॉन्सर्ट बैंड में विंड बैंड संगीत का अभ्यास और प्रदर्शन, स्कोर पढ़ने से हर सेमेस्टर के सार्वजनिक कॉन्सर्ट तक।"
outcomes:
  - en: "Build your technique as an ensemble musician"
    zh: "提升合奏乐手的技术"
    zh-TW: "提升合奏樂手的技術"
    ja: "アンサンブル奏者として技術を伸ばす"
    ko: "앙상블 연주자로서 기량 키우기"
    vi: "Nâng cao kỹ thuật khi chơi hòa tấu"
    ms: "Tingkatkan teknik sebagai pemuzik ensembel"
    id: "Meningkatkan teknik sebagai musisi ensambel"
    hi: "समूह संगीतकार के रूप में तकनीक निखारना"
  - en: "Rehearse and perform selected pieces"
    zh: "排练并演出选定曲目"
    zh-TW: "排練並演出選定曲目"
    ja: "選んだ曲を練習し演奏する"
    ko: "선정곡 연습하고 공연하기"
    vi: "Tập luyện và biểu diễn tác phẩm chọn lọc"
    ms: "Berlatih dan persembahkan karya pilihan"
    id: "Berlatih dan membawakan karya pilihan"
    hi: "चुनी हुई रचनाओं का अभ्यास और प्रदर्शन"
  - en: "Work confidently as part of a performing group"
    zh: "自信地作为乐团一员参与演出"
    zh-TW: "自信地作為樂團一員參與演出"
    ja: "演奏グループの一員として自信を持って参加する"
    ko: "연주 그룹의 일원으로 자신 있게 참여하기"
    vi: "Tự tin tham gia như thành viên nhóm biểu diễn"
    ms: "Bermain dengan yakin sebagai ahli kumpulan"
    id: "Tampil percaya diri sebagai anggota grup"
    hi: "प्रदर्शन समूह के सदस्य के रूप में आत्मविश्वास से भाग लेना"
