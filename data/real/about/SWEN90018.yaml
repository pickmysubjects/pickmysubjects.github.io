code: SWEN90018
year: 2027
learn:
  en: "Second half of a large-team agile project for a real client: building, testing, quality and delivery."
  zh: "大型团队为真实客户做的敏捷项目下半部分：开发、测试、质量与交付。"
  zh-TW: "大型團隊為真實客戶做的敏捷專案下半部：開發、測試、品質與交付。"
  ja: "実際の顧客向け大規模チームのアジャイル開発・後半：実装、テスト、品質、納品。"
  ko: "실제 고객을 위한 대규모 팀 애자일 프로젝트 후반부: 구현, 테스트, 품질, 납품."
  vi: "Nửa sau dự án agile nhóm lớn cho khách hàng thật: xây dựng, kiểm thử, chất lượng, bàn giao."
  ms: "Separuh kedua projek agile pasukan besar untuk pelanggan sebenar: pembinaan, ujian, kualiti dan penyerahan."
  id: "Paruh kedua proyek agile tim besar untuk klien nyata: pembangunan, pengujian, kualitas, penyerahan."
  hi: "असली क्लाइंट के लिए बड़ी टीम का एजाइल प्रोजेक्ट, दूसरा भाग: निर्माण, परीक्षण, गुणवत्ता, डिलीवरी।"
outcomes:
  - en: "Finish, test and hand over a software product"
    zh: "完成、测试并交付一个软件产品"
    zh-TW: "完成、測試並交付一個軟體產品"
    ja: "ソフト製品を仕上げ、テストし、引き渡す"
    ko: "소프트웨어 제품을 완성·테스트·인도하기"
    vi: "Hoàn thiện, kiểm thử và bàn giao sản phẩm phần mềm"
    ms: "Menyiapkan, menguji dan menyerahkan produk perisian"
    id: "Menyelesaikan, menguji, dan menyerahkan produk perangkat lunak"
    hi: "सॉफ़्टवेयर प्रोडक्ट पूरा करना, परखना और सौंपना"
  - en: "Keep quality and progress on track over a long project"
    zh: "在长期项目中把控质量和进度"
    zh-TW: "在長期專案中掌控品質與進度"
    ja: "長期プロジェクトで品質と進捗を保つ"
    ko: "긴 프로젝트에서 품질과 진도 관리하기"
    vi: "Giữ chất lượng và tiến độ trong dự án dài"
    ms: "Mengawal kualiti dan kemajuan dalam projek panjang"
    id: "Menjaga kualitas dan kemajuan dalam proyek panjang"
    hi: "लंबे प्रोजेक्ट में गुणवत्ता और प्रगति बनाए रखना"
