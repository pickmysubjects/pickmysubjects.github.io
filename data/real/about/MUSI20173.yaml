code: MUSI20173
year: 2026
learn:
  en: "An online intro to writing music for video games: interactivity, music that changes with play, and game storytelling."
  zh: "网课：为电子游戏创作音乐入门，涵盖互动性、随游戏变化的音乐与游戏叙事。"
  zh-TW: "線上課：為電子遊戲創作音樂入門，涵蓋互動性、隨遊戲變化的音樂與遊戲敘事。"
  ja: "オンラインで学ぶゲーム音楽入門：インタラクティブ性、展開に応じて変わる音楽、物語。"
  ko: "온라인 게임 음악 입문: 상호작용성, 플레이에 따라 바뀌는 음악, 게임 스토리텔링."
  vi: "Nhập môn trực tuyến viết nhạc game: tính tương tác, nhạc thay đổi theo lối chơi và kể chuyện trong game."
  ms: "Pengenalan dalam talian menggubah muzik permainan video: interaktiviti, muzik berubah ikut permainan dan naratif."
  id: "Pengantar daring menulis musik game: interaktivitas, musik yang berubah sesuai permainan, dan narasi game."
  hi: "वीडियो गेम के लिए संगीत लिखने का ऑनलाइन परिचय: इंटरैक्टिविटी, बदलता संगीत और गेम की कहानी।"
outcomes:
  - en: "Explain what music does in a game"
    zh: "说明音乐在游戏中的作用"
    zh-TW: "說明音樂在遊戲中的作用"
    ja: "ゲームで音楽が果たす役割を説明する"
    ko: "게임 속 음악의 역할 설명하기"
    vi: "Giải thích vai trò của nhạc trong game"
    ms: "Jelaskan fungsi muzik dalam permainan"
    id: "Menjelaskan peran musik dalam game"
    hi: "गेम में संगीत क्या करता है, समझाना"
  - en: "Write short cues that react to play"
    zh: "创作随玩法变化的短乐段"
    zh-TW: "創作隨玩法變化的短樂段"
    ja: "プレイに反応する短い曲を作る"
    ko: "플레이에 반응하는 짧은 큐 작곡하기"
    vi: "Viết đoạn nhạc ngắn phản ứng theo lối chơi"
    ms: "Gubah petikan pendek yang bertindak balas pada permainan"
    id: "Menulis potongan musik yang merespons permainan"
    hi: "खेल के साथ बदलने वाले छोटे म्यूज़िक क्यू लिखना"
  - en: "Share work and give feedback online"
    zh: "在线分享作品并给出反馈"
    zh-TW: "線上分享作品並給予回饋"
    ja: "オンラインで作品を共有し講評する"
    ko: "온라인으로 작품 공유·피드백하기"
    vi: "Chia sẻ bài và góp ý trực tuyến"
    ms: "Kongsi karya dan beri maklum balas dalam talian"
    id: "Berbagi karya dan memberi masukan daring"
    hi: "ऑनलाइन काम साझा करना और फ़ीडबैक देना"
