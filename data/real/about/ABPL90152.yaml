code: ABPL90152
year: 2027
learn:
  en: "Designing and building community infrastructure, first in theory and case studies, then in the field in Southeast Asia, PNG or Australia."
  zh: "设计和建造社区基础设施，先学理论和案例，再到东南亚、巴布亚新几内亚或澳大利亚实地做。"
  zh-TW: "設計與興建社區基礎設施，先學理論與個案，再到東南亞、巴布亞紐幾內亞或澳洲實地執行。"
  ja: "地域インフラの設計と建設。理論と事例の後、東南アジア・PNG・豪州で現地作業。"
  ko: "지역사회 인프라 설계·시공. 이론과 사례 후 동남아·PNG·호주 현장 작업."
  vi: "Thiết kế và xây hạ tầng cộng đồng, học lý thuyết rồi thực địa ở Đông Nam Á, PNG hoặc Úc."
  ms: "Mereka bentuk dan membina infrastruktur komuniti, kemudian kerja lapangan di Asia Tenggara, PNG atau Australia."
  id: "Merancang dan membangun infrastruktur komunitas, lalu kerja lapangan di Asia Tenggara, PNG atau Australia."
  hi: "सामुदायिक ढाँचे का डिज़ाइन व निर्माण, फिर दक्षिण-पूर्व एशिया, PNG या ऑस्ट्रेलिया में फ़ील्डवर्क।"
outcomes:
  - en: "Design with a host community for real needs"
    zh: "与当地社区一起针对实际需求做设计"
    zh-TW: "與在地社區一起針對實際需求做設計"
    ja: "受け入れ地域と実際のニーズに沿って設計する"
    ko: "현지 공동체와 실제 필요에 맞춰 설계하기"
    vi: "Thiết kế cùng cộng đồng cho nhu cầu thực"
    ms: "Mereka bentuk bersama komuniti untuk keperluan sebenar"
    id: "Mendesain bersama komunitas untuk kebutuhan nyata"
    hi: "मेज़बान समुदाय के साथ असली ज़रूरतों के लिए डिज़ाइन"
  - en: "Weigh affordability, liveability and environmental impact"
    zh: "权衡可负担性、宜居性和环境影响"
    zh-TW: "權衡可負擔性、宜居性與環境影響"
    ja: "費用・住みやすさ・環境影響を比べる"
    ko: "경제성·거주성·환경 영향 따지기"
    vi: "Cân nhắc chi phí, sự đáng sống và môi trường"
    ms: "Menimbang kemampuan, kebolehdiaman dan alam sekitar"
    id: "Menimbang keterjangkauan, kelayakan huni dan lingkungan"
    hi: "किफ़ायत, रहने योग्यता और पर्यावरणीय असर तौलना"
