code: ABPL90075
year: 2027
learn:
  en: "Assessing heritage landscapes, working with heritage law, and guiding design changes through site visits and analysis."
  zh: "评估遗产景观、运用遗产法规，并通过实地考察和分析指导设计改动。"
  zh-TW: "評估遺產景觀、運用遺產法規，並透過實地考察與分析引導設計變更。"
  ja: "遺産景観の評価、遺産法の扱い、現地調査と分析による設計変更の指針。"
  ko: "유산 경관 평가, 유산 법규 활용, 현장 답사와 분석을 통한 설계 변경 안내."
  vi: "Đánh giá cảnh quan di sản, áp dụng luật di sản và định hướng thiết kế qua khảo sát thực địa."
  ms: "Menilai landskap warisan, menggunakan undang-undang warisan dan membimbing reka bentuk melalui lawatan tapak."
  id: "Menilai lanskap warisan, memakai hukum warisan, dan mengarahkan desain lewat kunjungan lapangan."
  hi: "धरोहर परिदृश्यों का आकलन, धरोहर क़ानून का उपयोग और स्थल दौरों से डिज़ाइन बदलाव का मार्गदर्शन।"
outcomes:
  - en: "Analyse landscape heritage value over time"
    zh: "分析景观遗产价值的历史形成"
    zh-TW: "分析景觀遺產價值的歷史形成"
    ja: "景観遺産の価値を時間軸で分析する"
    ko: "경관 유산 가치를 시간에 따라 분석하기"
    vi: "Phân tích giá trị di sản cảnh quan theo thời gian"
    ms: "Menganalisis nilai warisan landskap"
    id: "Menganalisis nilai warisan lanskap"
    hi: "परिदृश्य धरोहर मूल्य का विश्लेषण"
  - en: "Identify heritage precedents and relevant legislation"
    zh: "找出遗产先例和相关法规"
    zh-TW: "找出遺產先例與相關法規"
    ja: "遺産の先例と関連法を特定する"
    ko: "유산 선례와 관련 법규 찾기"
    vi: "Xác định tiền lệ di sản và luật liên quan"
    ms: "Mengenal pasti preseden warisan dan perundangan"
    id: "Mengidentifikasi preseden warisan dan aturannya"
    hi: "धरोहर उदाहरण और संबंधित क़ानून पहचानना"
