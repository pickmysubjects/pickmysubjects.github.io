code: PHIL30007
year: 2026
learn:
  en: "What philosophy itself is: its methods, aims and ambitions, as seen by great philosophers. Best taken near the end of a major."
  zh: "哲学本身是什么：伟大哲学家眼中的方法、目标和抱负。适合在专业学习后期修读。"
  zh-TW: "哲學本身是什麼：偉大哲學家眼中的方法、目標和抱負。適合在主修後期修讀。"
  ja: "哲学そのものとは何か。偉大な哲学者が考えた方法・目的・野心を学ぶ。専攻の終盤向け。"
  ko: "철학 자체란 무엇인가. 위대한 철학자들이 본 방법·목표·포부를 배운다. 전공 후반에 적합하다."
  vi: "Bản thân triết học là gì: phương pháp, mục tiêu và tham vọng của nó theo các triết gia lớn. Nên học gần cuối chuyên ngành."
  ms: "Apa itu falsafah sendiri: kaedah, matlamat dan cita-citanya menurut ahli falsafah agung. Sesuai diambil hujung major."
  id: "Apa itu filsafat sendiri: metode, tujuan dan ambisinya menurut para filsuf besar. Cocok diambil di akhir jurusan."
  hi: "दर्शन खुद क्या है: महान दार्शनिकों की नज़र में उसके तरीके, लक्ष्य और महत्वाकांक्षाएं। मेजर के आख़िर में लेना बेहतर।"
outcomes:
  - en: "Explain different views of philosophy's methods"
    zh: "说明对哲学方法的不同看法"
    zh-TW: "說明對哲學方法的不同看法"
    ja: "哲学の方法についての様々な見方を説明する"
    ko: "철학 방법에 관한 여러 관점 설명하기"
    vi: "Giải thích các quan điểm khác nhau về phương pháp triết học"
    ms: "Terangkan pandangan berbeza tentang kaedah falsafah"
    id: "Menjelaskan berbagai pandangan tentang metode filsafat"
    hi: "दर्शन के तरीकों पर अलग-अलग मत समझाना"
  - en: "Compare competing traditions in philosophy"
    zh: "比较哲学中相互竞争的传统"
    zh-TW: "比較哲學中相互競爭的傳統"
    ja: "哲学の対立する伝統を比べる"
    ko: "철학의 경쟁하는 전통 비교하기"
    vi: "So sánh các truyền thống triết học đối lập"
    ms: "Bandingkan tradisi falsafah yang bersaing"
    id: "Membandingkan tradisi filsafat yang bersaing"
    hi: "दर्शन की प्रतिस्पर्धी परंपराओं की तुलना करना"
  - en: "Reflect on the philosophy you have studied"
    zh: "反思自己学过的哲学"
    zh-TW: "反思自己學過的哲學"
    ja: "これまで学んだ哲学を振り返る"
    ko: "지금까지 배운 철학 돌아보기"
    vi: "Suy ngẫm về triết học bạn đã học"
    ms: "Renungkan falsafah yang telah anda pelajari"
    id: "Merefleksikan filsafat yang telah dipelajari"
    hi: "अब तक पढ़े दर्शन पर विचार करना"
