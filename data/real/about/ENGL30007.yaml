code: ENGL30007
year: 2026
learn:
  en: "Popular fiction, written by authors, fans and even AI, and the long debates about its value and effects."
  zh: "作家、粉丝乃至人工智能创作的通俗小说，以及关于其价值和影响的长期争论。"
  zh-TW: "作家、粉絲乃至人工智慧創作的通俗小說，以及關於其價值和影響的長期爭論。"
  ja: "作家やファン、AIも書く大衆小説と、その価値や影響をめぐる長年の議論を学ぶ。"
  ko: "작가, 팬, 심지어 AI가 쓴 대중 소설과 그 가치·영향을 둘러싼 오랜 논쟁을 배운다."
  vi: "Tiểu thuyết đại chúng do tác giả, người hâm mộ và cả AI viết, cùng những tranh luận lâu nay về giá trị và tác động của nó."
  ms: "Fiksyen popular yang ditulis pengarang, peminat malah AI, serta perdebatan panjang tentang nilai dan kesannya."
  id: "Fiksi populer yang ditulis pengarang, penggemar bahkan AI, serta perdebatan panjang soal nilai dan dampaknya."
  hi: "लेखकों, प्रशंसकों और AI तक के लिखे लोकप्रिय कथा-साहित्य, और उसके मूल्य व असर पर लंबी बहसें।"
outcomes:
  - en: "Explain the history of popular fiction genres"
    zh: "说明通俗小说类型的历史"
    zh-TW: "說明通俗小說類型的歷史"
    ja: "大衆小説ジャンルの歴史を説明する"
    ko: "대중 소설 장르의 역사 설명하기"
    vi: "Giải thích lịch sử các thể loại tiểu thuyết đại chúng"
    ms: "Terangkan sejarah genre fiksyen popular"
    id: "Menjelaskan sejarah genre fiksi populer"
    hi: "लोकप्रिय कथा विधाओं का इतिहास समझाना"
  - en: "Apply different critical approaches to popular texts"
    zh: "用不同批评方法分析通俗作品"
    zh-TW: "用不同批評方法分析通俗作品"
    ja: "大衆作品に様々な批評方法を当てはめる"
    ko: "대중 작품에 여러 비평 방법 적용하기"
    vi: "Áp dụng các cách tiếp cận phê bình khác nhau"
    ms: "Gunakan pelbagai pendekatan kritikan pada teks popular"
    id: "Menerapkan berbagai pendekatan kritis pada teks populer"
    hi: "लोकप्रिय पाठों पर अलग-अलग आलोचनात्मक दृष्टियां लागू करना"
  - en: "Discuss gender and value in popular fiction"
    zh: "讨论通俗小说中的性别与价值问题"
    zh-TW: "討論通俗小說中的性別與價值問題"
    ja: "大衆小説におけるジェンダーと価値を論じる"
    ko: "대중 소설의 젠더와 가치 논의하기"
    vi: "Thảo luận giới và giá trị trong tiểu thuyết đại chúng"
    ms: "Bincangkan gender dan nilai dalam fiksyen popular"
    id: "Membahas gender dan nilai dalam fiksi populer"
    hi: "लोकप्रिय कथा में जेंडर और मूल्य पर चर्चा करना"
