code: JAPN30002
year: 2026
learn:
  en: "Inequality between social groups in Japan, including ethnicity, caste and disability, and the institutions that help or hinder."
  zh: "日本各社会群体间的不平等，包括族群、身份等级和残障，以及相关制度的作用。"
  zh-TW: "日本各社會群體間的不平等，包括族群、身分階層和身心障礙，以及相關制度的作用。"
  ja: "民族、身分、障害など日本の社会集団間の不平等と、それを助長し、または防ぐ制度を学ぶ。"
  ko: "민족, 신분, 장애 등 일본 사회 집단 간 불평등과 이를 돕거나 막는 제도를 배운다."
  vi: "Bất bình đẳng giữa các nhóm xã hội ở Nhật như sắc tộc, đẳng cấp, khuyết tật và các thể chế hỗ trợ hay cản trở."
  ms: "Ketaksamaan antara kumpulan sosial di Jepun termasuk etnik, kasta dan kecacatan, serta institusi yang membantu atau menghalang."
  id: "Ketimpangan antarkelompok sosial di Jepang, termasuk etnis, kasta, dan disabilitas, serta lembaga yang membantu atau menghambat."
  hi: "जापान में सामाजिक समूहों के बीच असमानता, जैसे जातीयता, जाति और विकलांगता, और मदद या रुकावट डालने वाली संस्थाएँ।"
outcomes:
  - en: "Explain sources of inequality in Japan"
    zh: "解释日本不平等的根源"
    zh-TW: "解釋日本不平等的根源"
    ja: "日本の不平等の原因を説明する"
    ko: "일본 불평등의 원인 설명하기"
    vi: "Giải thích nguồn gốc bất bình đẳng ở Nhật Bản"
    ms: "Terangkan punca ketaksamaan di Jepun"
    id: "Menjelaskan sumber ketimpangan di Jepang"
    hi: "जापान में असमानता के स्रोत समझाना"
  - en: "Analyse institutions such as family registry"
    zh: "分析户籍制度等相关制度"
    zh-TW: "分析戶籍制度等相關制度"
    ja: "戸籍制度などの制度を分析する"
    ko: "호적 제도 같은 제도 분석하기"
    vi: "Phân tích các thể chế như chế độ hộ tịch"
    ms: "Analisis institusi seperti daftar keluarga"
    id: "Menganalisis lembaga seperti registrasi keluarga"
    hi: "पारिवारिक रजिस्टर जैसी संस्थाओं का विश्लेषण करना"
  - en: "Discuss Japan's diverse social groups"
    zh: "讨论日本多元的社会群体"
    zh-TW: "討論日本多元的社會群體"
    ja: "日本の多様な社会集団を論じる"
    ko: "일본의 다양한 사회 집단 논의하기"
    vi: "Thảo luận các nhóm xã hội đa dạng ở Nhật"
    ms: "Bincangkan kepelbagaian kumpulan sosial Jepun"
    id: "Membahas keragaman kelompok sosial Jepang"
    hi: "जापान के विविध सामाजिक समूहों पर चर्चा करना"
