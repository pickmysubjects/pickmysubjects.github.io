code: SCIE90015
year: 2027
learn:
  en: "Working with an industry partner on a real biotechnology problem, using science and business tools."
  zh: "与产业伙伴合作解决真实的生物技术问题，运用科学和商业工具。"
  zh-TW: "與產業夥伴合作解決真實的生物科技問題，運用科學與商業工具。"
  ja: "企業パートナーと実際のバイオ課題に取り組み、科学とビジネスの手法を使う。"
  ko: "산업 파트너와 실제 생명공학 문제를 과학·비즈니스 도구로 해결한다."
  vi: "Hợp tác với doanh nghiệp giải quyết vấn đề công nghệ sinh học thực tế bằng công cụ khoa học và kinh doanh."
  ms: "Bekerja dengan rakan industri pada masalah bioteknologi sebenar menggunakan alat sains dan perniagaan."
  id: "Bekerja dengan mitra industri pada masalah bioteknologi nyata memakai alat sains dan bisnis."
  hi: "उद्योग साझेदार के साथ असली बायोटेक समस्या पर विज्ञान और व्यावसायिक उपकरणों से काम करना।"
outcomes:
  - en: "Solve industry problems with scientific evidence"
    zh: "用科学证据解决产业问题"
    zh-TW: "用科學證據解決產業問題"
    ja: "科学的根拠で産業の課題を解く"
    ko: "과학적 근거로 산업 문제 해결하기"
    vi: "Giải quyết vấn đề ngành bằng bằng chứng khoa học"
    ms: "Menyelesaikan masalah industri dengan bukti saintifik"
    id: "Memecahkan masalah industri dengan bukti ilmiah"
    hi: "वैज्ञानिक साक्ष्य से उद्योग की समस्याएँ हल करना"
  - en: "Deliver agreed outcomes with an industry partner"
    zh: "与产业伙伴交付约定成果"
    zh-TW: "與產業夥伴交付約定成果"
    ja: "企業と合意した成果を出す"
    ko: "산업 파트너와 합의한 결과 내기"
    vi: "Hoàn thành kết quả đã thống nhất với đối tác"
    ms: "Menghasilkan hasil dipersetujui bersama rakan industri"
    id: "Menghasilkan luaran yang disepakati dengan mitra industri"
    hi: "उद्योग साझेदार के साथ तय परिणाम देना"
  - en: "Lead and work well in teams"
    zh: "领导团队并高效协作"
    zh-TW: "領導團隊並有效協作"
    ja: "チームを率い、うまく協働する"
    ko: "팀을 이끌고 잘 협업하기"
    vi: "Dẫn dắt và làm việc nhóm tốt"
    ms: "Memimpin dan bekerja dengan baik dalam pasukan"
    id: "Memimpin dan bekerja baik dalam tim"
    hi: "टीम का नेतृत्व और अच्छा सहयोग"
