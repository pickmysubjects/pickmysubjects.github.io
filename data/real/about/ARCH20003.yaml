code: ARCH20003
year: 2026
learn:
  en: "Modern architecture and cities in the 1800s and 1900s, from the modern movement to postmodernism and beyond."
  zh: "19至20世纪的现代建筑与城市，从现代主义运动到后现代主义及之后。"
  zh-TW: "19至20世紀的現代建築與城市，從現代主義運動到後現代主義及之後。"
  ja: "19〜20世紀の近代建築と都市：モダニズム運動からポストモダン以降まで。"
  ko: "19~20세기 근대 건축과 도시: 모더니즘 운동부터 포스트모더니즘 이후까지."
  vi: "Kiến trúc và đô thị hiện đại thế kỷ 19–20, từ phong trào hiện đại đến hậu hiện đại và sau đó."
  ms: "Seni bina dan bandar moden abad ke-19 dan 20, dari gerakan moden hingga pascamoden dan seterusnya."
  id: "Arsitektur dan kota modern abad 19–20, dari gerakan modern hingga pascamodern dan sesudahnya."
  hi: "1800 और 1900 के दशक की आधुनिक वास्तुकला और शहर, मॉडर्न मूवमेंट से पोस्टमॉडर्न तक।"
outcomes:
  - en: "Trace the main movements of modern architecture"
    zh: "梳理现代建筑的主要流派"
    zh-TW: "梳理現代建築的主要流派"
    ja: "近代建築の主な運動をたどる"
    ko: "근대 건축의 주요 흐름 짚기"
    vi: "Theo dấu các trào lưu chính của kiến trúc hiện đại"
    ms: "Jejak gerakan utama seni bina moden"
    id: "Menelusuri gerakan utama arsitektur modern"
    hi: "आधुनिक वास्तुकला के मुख्य आंदोलनों को समझना"
  - en: "Link buildings to politics, society and technology"
    zh: "把建筑与政治、社会和技术联系起来"
    zh-TW: "把建築與政治、社會和技術連結起來"
    ja: "建築を政治・社会・技術と結びつける"
    ko: "건축을 정치·사회·기술과 연결하기"
    vi: "Gắn công trình với chính trị, xã hội, công nghệ"
    ms: "Kaitkan bangunan dengan politik, masyarakat dan teknologi"
    id: "Mengaitkan bangunan dengan politik, masyarakat, teknologi"
    hi: "इमारतों को राजनीति, समाज और तकनीक से जोड़ना"
  - en: "Write critical essays on architecture"
    zh: "撰写建筑评论文章"
    zh-TW: "撰寫建築評論文章"
    ja: "建築について批評的に書く"
    ko: "건축 비평 에세이 쓰기"
    vi: "Viết tiểu luận phê bình kiến trúc"
    ms: "Tulis esei kritis tentang seni bina"
    id: "Menulis esai kritis tentang arsitektur"
    hi: "वास्तुकला पर आलोचनात्मक निबंध लिखना"
