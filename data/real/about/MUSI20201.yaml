code: MUSI20201
year: 2026
learn:
  en: "Second-year performance study: individual lessons, instrument or voice class and ensemble work, ending in a 15-minute performance exam."
  zh: 二年级演奏课：个别课、器乐或声乐班和合奏，最后进行15分钟演奏考试。
  zh-TW: 二年級演奏課：個別課、器樂或聲樂班與合奏，最後進行15分鐘演奏考試。
  ja: 2年次の演奏科目。個人レッスン、楽器・声楽クラス、アンサンブルを経て15分の実技試験。
  ko: 2학년 연주 과목. 개인 레슨, 악기·성악 수업, 앙상블을 거쳐 15분 실기 시험.
  vi: "Học biểu diễn năm hai: học riêng, lớp nhạc cụ/thanh nhạc và hòa tấu, kết thúc bằng thi biểu diễn 15 phút."
  ms: "Pengajian persembahan tahun dua: kelas individu, kelas alat atau vokal dan ensembel, diakhiri ujian 15 minit."
  id: "Studi pertunjukan tahun kedua: les privat, kelas instrumen/vokal dan ansambel, diakhiri ujian 15 menit."
  hi: "दूसरे वर्ष का परफ़ॉर्मेंस: निजी पाठ, वाद्य/गायन कक्षा और समूह-वादन, अंत में 15 मिनट की परीक्षा।"
outcomes:
  - en: Build solid technical control
    zh: 建立扎实的技术控制
    zh-TW: 建立紮實的技術控制
    ja: 確かな技術的コントロールを築く
    ko: 탄탄한 기술 제어력 기르기
    vi: Xây dựng kỹ thuật vững chắc
    ms: Bina kawalan teknik yang mantap
    id: Membangun kontrol teknik yang kuat
    hi: मज़बूत तकनीकी नियंत्रण बनाना
  - en: Play repertoire fluently and accurately
    zh: 流畅准确地演奏曲目
    zh-TW: 流暢準確地演奏曲目
    ja: レパートリーを流暢かつ正確に演奏する
    ko: 레퍼토리를 유창하고 정확하게 연주하기
    vi: Chơi tác phẩm trôi chảy, chính xác
    ms: Mainkan repertoir dengan lancar dan tepat
    id: Memainkan repertoar dengan lancar dan tepat
    hi: रचनाएँ धाराप्रवाह और सटीक बजाना
  - en: Perform with confidence and style
    zh: 自信且有风格地表演
    zh-TW: 自信且有風格地表演
    ja: 自信とスタイルを持って演奏する
    ko: 자신감 있고 개성 있게 연주하기
    vi: Biểu diễn tự tin, có phong cách
    ms: Membuat persembahan dengan yakin dan bergaya
    id: Tampil percaya diri dan bergaya
    hi: आत्मविश्वास और शैली के साथ प्रस्तुति
