code: DNCE10032
year: 2026
learn:
  en: "Key theory on the body and the dancer as public artist, read in groups and then tested in the studio."
  zh: "研读关于身体与舞者作为公共艺术家的理论，并在排练室里实践检验。"
  zh-TW: "研讀關於身體與舞者作為公共藝術家的理論，並在排練室裡實踐檢驗。"
  ja: "身体と公共の芸術家としてのダンサーに関する理論を読み、スタジオで試す。"
  ko: "몸과 공공 예술가로서의 무용수에 관한 이론을 읽고 스튜디오에서 실험한다."
  vi: "Đọc lý thuyết về cơ thể và vũ công như nghệ sĩ công chúng, rồi thử nghiệm trong phòng tập."
  ms: "Teori utama tentang tubuh dan penari sebagai artis awam, dibaca berkumpulan lalu diuji di studio."
  id: "Teori kunci tentang tubuh dan penari sebagai seniman publik, dibaca berkelompok lalu diuji di studio."
  hi: "शरीर और सार्वजनिक कलाकार के रूप में डांसर पर मुख्य सिद्धांत, समूह में पढ़कर स्टूडियो में परखना।"
outcomes:
  - en: "Discuss key texts on dance and the body"
    zh: "讨论舞蹈与身体的重要文本"
    zh-TW: "討論舞蹈與身體的重要文本"
    ja: "ダンスと身体の重要文献を議論する"
    ko: "무용과 몸에 관한 핵심 텍스트 토론하기"
    vi: "Thảo luận các văn bản quan trọng về múa và cơ thể"
    ms: "Bincang teks utama tentang tarian dan tubuh"
    id: "Mendiskusikan teks penting tentang tari dan tubuh"
    hi: "डांस और शरीर पर मुख्य ग्रंथों की चर्चा"
  - en: "Turn theory into a lecture-performance"
    zh: "把理论变成讲演式表演"
    zh-TW: "把理論變成講演式表演"
    ja: "理論をレクチャー・パフォーマンスにする"
    ko: "이론을 렉처 퍼포먼스로 만들기"
    vi: "Biến lý thuyết thành buổi diễn-thuyết trình"
    ms: "Jadikan teori satu persembahan-syarahan"
    id: "Mengubah teori menjadi pertunjukan-kuliah"
    hi: "सिद्धांत को लेक्चर-परफ़ॉर्मेंस में बदलना"
  - en: "Explain your ideas in writing and in an oral exam"
    zh: "以写作和口试阐述观点"
    zh-TW: "以寫作和口試闡述觀點"
    ja: "考えを文章と口頭試問で説明する"
    ko: "글과 구술로 생각 설명하기"
    vi: "Trình bày ý tưởng bằng bài viết và vấn đáp"
    ms: "Terangkan idea secara bertulis dan lisan"
    id: "Menjelaskan gagasan secara tertulis dan lisan"
    hi: "लेखन और मौखिक परीक्षा में विचार समझाना"
