code: UNIB20027
year: 2026
learn:
  en: "Designing spaces, technology, education and work that include neurodivergent people, beyond the medical model."
  zh: "超越医学模式，设计能包容神经多样性人群的空间、技术、教育和工作方式。"
  zh-TW: "超越醫學模式，設計能包容神經多樣性族群的空間、技術、教育和工作方式。"
  ja: "医学モデルを超え、ニューロダイバージェントな人を含む空間・技術・教育・仕事を設計する。"
  ko: "의학 모델을 넘어 신경다양인을 포용하는 공간·기술·교육·일 설계하기."
  vi: "Thiết kế không gian, công nghệ, giáo dục, công việc bao gồm người đa dạng thần kinh, vượt mô hình y khoa."
  ms: "Mereka ruang, teknologi, pendidikan dan kerja yang merangkumi orang neurodivergen, melangkaui model perubatan."
  id: "Merancang ruang, teknologi, pendidikan, dan kerja yang inklusif bagi orang neurodivergen, melampaui model medis."
  hi: "मेडिकल मॉडल से आगे, न्यूरोडाइवर्जेंट लोगों को शामिल करने वाली जगहें, तकनीक, शिक्षा और काम डिज़ाइन करना।"
outcomes:
  - en: "Explain neurodiversity and its models"
    zh: "解释神经多样性及其不同模式"
    zh-TW: "解釋神經多樣性及其不同模式"
    ja: "ニューロダイバーシティとそのモデルを説明する"
    ko: "신경다양성과 그 모델 설명하기"
    vi: "Giải thích đa dạng thần kinh và các mô hình"
    ms: "Terangkan neurokepelbagaian dan modelnya"
    id: "Menjelaskan neurodiversitas dan modelnya"
    hi: "न्यूरोडाइवर्सिटी और उसके मॉडल समझाना"
  - en: "Pitch a more inclusive design idea"
    zh: "提出更具包容性的设计方案"
    zh-TW: "提出更具包容性的設計方案"
    ja: "よりインクルーシブな設計案を提案する"
    ko: "더 포용적인 디자인 아이디어 제안하기"
    vi: "Đề xuất ý tưởng thiết kế bao trùm hơn"
    ms: "Cadangkan idea reka bentuk lebih inklusif"
    id: "Mengusulkan ide desain yang lebih inklusif"
    hi: "ज़्यादा समावेशी डिज़ाइन विचार प्रस्तुत करना"
  - en: "Communicate in the format that suits you"
    zh: "用适合自己的形式表达"
    zh-TW: "用適合自己的形式表達"
    ja: "自分に合った形式で伝える"
    ko: "자신에게 맞는 형식으로 소통하기"
    vi: "Giao tiếp theo hình thức hợp với mình"
    ms: "Berkomunikasi dalam format yang sesuai"
    id: "Berkomunikasi dalam format yang cocok untukmu"
    hi: "अपने अनुकूल प्रारूप में बात रखना"
