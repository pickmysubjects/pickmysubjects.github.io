code: PROP10001
year: 2026
learn:
  en: "Economics of cities: land use, land values, property rights and how markets and rules shape where things go."
  zh: "城市经济学：土地利用、地价、产权，以及市场与法规如何决定布局。"
  zh-TW: "城市經濟學：土地使用、地價、產權，以及市場與法規如何決定配置。"
  ja: "都市の経済学：土地利用、地価、財産権、市場と規制が立地をどう決めるか。"
  ko: "도시 경제학: 토지 이용, 지가, 재산권, 시장과 규제가 입지를 정하는 방식."
  vi: "Kinh tế đô thị: sử dụng đất, giá đất, quyền sở hữu, thị trường và luật lệ định hình vị trí ra sao."
  ms: "Ekonomi bandar: guna tanah, nilai tanah, hak harta, dan cara pasaran serta peraturan menentukan lokasi."
  id: "Ekonomi kota: tata guna lahan, nilai tanah, hak milik, dan cara pasar serta aturan menentukan lokasi."
  hi: "शहरों का अर्थशास्त्र: भूमि उपयोग, ज़मीन की क़ीमत, संपत्ति अधिकार, बाज़ार और नियम।"
outcomes:
  - en: "Apply basic economics to land markets"
    zh: "把基础经济学用于土地市场"
    zh-TW: "把基礎經濟學用於土地市場"
    ja: "基礎経済学を土地市場に当てはめる"
    ko: "기초 경제학을 토지 시장에 적용하기"
    vi: "Áp dụng kinh tế học cơ bản cho thị trường đất"
    ms: "Guna ekonomi asas pada pasaran tanah"
    id: "Menerapkan ekonomi dasar pada pasar tanah"
    hi: "ज़मीन के बाज़ार पर बुनियादी अर्थशास्त्र लागू करना"
  - en: "Explain how land values vary across a city"
    zh: "说明地价在城市中如何变化"
    zh-TW: "說明地價在城市中如何變化"
    ja: "都市内の地価の差を説明する"
    ko: "도시 안 지가 차이 설명하기"
    vi: "Giải thích giá đất thay đổi trong thành phố"
    ms: "Jelaskan perbezaan nilai tanah dalam bandar"
    id: "Menjelaskan variasi nilai tanah di kota"
    hi: "शहर में ज़मीन की क़ीमतें कैसे बदलती हैं, समझाना"
  - en: "Critique laws affecting land and property"
    zh: "评析影响土地和物业的法规"
    zh-TW: "評析影響土地和不動產的法規"
    ja: "土地・不動産に関わる法を批評する"
    ko: "토지·부동산 관련 법 비평하기"
    vi: "Phê bình luật ảnh hưởng đến đất và bất động sản"
    ms: "Kritik undang-undang berkaitan tanah dan hartanah"
    id: "Mengkritik hukum terkait tanah dan properti"
    hi: "ज़मीन और संपत्ति से जुड़े क़ानूनों की समीक्षा"
