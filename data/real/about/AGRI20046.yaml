code: AGRI20046
year: 2026
learn:
  en: "A ten-day field trip in Fiji looking at farming, food and livelihoods in Pacific communities."
  zh: "在斐济进行十天野外考察，了解太平洋社区的农业、食物和生计。"
  zh-TW: "在斐濟進行十天野外考察，了解太平洋社區的農業、糧食與生計。"
  ja: "フィジーで10日間の現地実習。太平洋の地域社会の農業・食・暮らしを見る。"
  ko: "피지에서 10일 현장 학습. 태평양 지역사회의 농업·식량·생계를 살핀다."
  vi: "Chuyến thực địa 10 ngày ở Fiji về nông nghiệp, lương thực và sinh kế cộng đồng."
  ms: "Lawatan lapangan 10 hari di Fiji tentang pertanian, makanan dan mata pencarian."
  id: "Kunjungan lapangan 10 hari di Fiji tentang pertanian, pangan, dan penghidupan."
  hi: "फ़िजी में दस दिन की फ़ील्ड ट्रिप: प्रशांत समुदायों में खेती, भोजन और आजीविका।"
outcomes:
  - en: "Observe farming systems in a Pacific setting"
    zh: "观察太平洋地区的农业体系"
    zh-TW: "觀察太平洋地區的農業體系"
    ja: "太平洋地域の農業システムを観察する"
    ko: "태평양 지역 농업 체계 관찰하기"
    vi: "Quan sát hệ thống canh tác ở Thái Bình Dương"
    ms: "Perhati sistem pertanian di Pasifik"
    id: "Mengamati sistem pertanian di Pasifik"
    hi: "प्रशांत क्षेत्र की कृषि प्रणालियाँ देखना"
  - en: "Reflect on culture and development in the field"
    zh: "反思当地的文化与发展问题"
    zh-TW: "反思當地的文化與發展問題"
    ja: "文化と開発について現地で考える"
    ko: "현지 문화와 개발을 성찰하기"
    vi: "Suy ngẫm về văn hóa và phát triển"
    ms: "Renungkan budaya dan pembangunan"
    id: "Merefleksikan budaya dan pembangunan"
    hi: "संस्कृति और विकास पर विचार करना"
  - en: "Write a report on a local agricultural issue"
    zh: "就当地农业问题撰写报告"
    zh-TW: "就當地農業問題撰寫報告"
    ja: "現地の農業課題についてレポートを書く"
    ko: "현지 농업 문제 보고서 쓰기"
    vi: "Viết báo cáo về vấn đề nông nghiệp địa phương"
    ms: "Tulis laporan isu pertanian tempatan"
    id: "Menulis laporan isu pertanian lokal"
    hi: "स्थानीय कृषि मुद्दे पर रिपोर्ट लिखना"
