code: PATH30001
year: 2026
learn:
  en: "The cell and molecular causes of disease in specific organs, building on second-year Pathology."
  zh: "在二年级病理学基础上，学各器官疾病在细胞和分子层面的成因。"
  zh-TW: "在二年級病理學的基礎上，學各器官疾病在細胞和分子層面的成因。"
  ja: "2年次の病理学を土台に、各臓器の病気の細胞・分子レベルの原因を学ぶ。"
  ko: "2학년 병리학을 바탕으로 특정 장기 질환의 세포·분자적 원인."
  vi: "Nguyên nhân tế bào và phân tử của bệnh ở từng cơ quan, nối tiếp môn Bệnh học năm hai."
  ms: "Punca sel dan molekul penyakit dalam organ tertentu, lanjutan daripada Patologi tahun kedua."
  id: "Penyebab sel dan molekuler penyakit di organ tertentu, lanjutan dari Patologi tahun kedua."
  hi: "खास अंगों में बीमारी के कोशिकीय और आणविक कारण, दूसरे साल की पैथोलॉजी के आगे।"
outcomes:
  - en: "Explain how diseases damage cells, tissues and organs"
    zh: "解释疾病怎样损伤细胞和器官"
    zh-TW: "解釋疾病怎樣損傷細胞、組織和器官"
    ja: "病気が細胞・組織・臓器を傷つける仕組みを説明する"
    ko: "질병이 세포, 조직, 장기를 손상시키는 방식 설명하기"
    vi: "Giải thích bệnh làm tổn thương tế bào, mô và cơ quan ra sao"
    ms: "Menerangkan cara penyakit merosakkan sel, tisu dan organ"
    id: "Menjelaskan cara penyakit merusak sel, jaringan, dan organ"
    hi: "बीमारियाँ कोशिकाओं, ऊतकों और अंगों को कैसे नुकसान पहुँचाती हैं"
  - en: "Link disease mechanisms to diagnosis and treatment"
    zh: "把发病机制和诊断治疗联系起来"
    zh-TW: "把發病機制和診斷治療連結起來"
    ja: "病気の仕組みを診断と治療に結びつける"
    ko: "질병 기전을 진단 및 치료와 연결하기"
    vi: "Liên hệ cơ chế bệnh với chẩn đoán và điều trị"
    ms: "Mengaitkan mekanisme penyakit dengan diagnosis dan rawatan"
    id: "Menghubungkan mekanisme penyakit dengan diagnosis dan pengobatan"
    hi: "बीमारी के तंत्र को निदान और इलाज से जोड़ना"
  - en: "Compare mechanisms across different diseases"
    zh: "比较不同疾病的发病机制"
    zh-TW: "比較不同疾病的發病機制"
    ja: "異なる病気の仕組みを比べる"
    ko: "여러 질병의 기전 비교하기"
    vi: "So sánh cơ chế giữa các bệnh khác nhau"
    ms: "Membandingkan mekanisme antara penyakit berbeza"
    id: "Membandingkan mekanisme berbagai penyakit"
    hi: "अलग-अलग बीमारियों के तंत्र की तुलना"
