code: CLAS20030
year: 2026
learn:
  en: "Roman philosophy in Latin prose: its forms, its Greek roots, its links to politics, and how later Latin writers reused it."
  zh: "阅读拉丁散文中的罗马哲学：文体、希腊渊源、与政治的关系，以及后期拉丁作者如何改写。"
  zh-TW: "閱讀拉丁散文中的羅馬哲學：文體、希臘淵源、與政治的關係，以及後期拉丁作者如何改寫。"
  ja: "ラテン語散文で読むローマ哲学。形式、ギリシャ的源流、政治との関わり、後期ラテン作家による受容。"
  ko: "라틴어 산문으로 읽는 로마 철학. 형식, 그리스적 뿌리, 정치와의 관계, 후기 라틴 작가들의 수용."
  vi: "Triết học La Mã qua văn xuôi Latinh: thể loại, gốc Hy Lạp, quan hệ với chính trị và cách tác giả Latinh muộn tiếp nhận."
  ms: "Falsafah Rom dalam prosa Latin: bentuknya, akar Yunani, kaitan dengan politik, dan cara penulis Latin kemudian menggunakannya."
  id: "Filsafat Romawi dalam prosa Latin: bentuknya, akar Yunani, kaitan dengan politik, dan cara penulis Latin akhir memakainya."
  hi: "लैटिन गद्य में रोमन दर्शन: इसके रूप, यूनानी जड़ें, राजनीति से संबंध, और बाद के लैटिन लेखकों ने इसे कैसे अपनाया।"
outcomes:
  - en: "Read original Latin texts with some dictionary help"
    zh: "借助词典阅读拉丁语原文"
    zh-TW: "藉助詞典閱讀拉丁語原文"
    ja: "辞書を使ってラテン語の原典を読む"
    ko: "사전을 활용해 라틴어 원문 읽기"
    vi: "Đọc nguyên bản tiếng Latinh với sự hỗ trợ của từ điển"
    ms: "Baca teks asal bahasa Latin dengan bantuan kamus"
    id: "Membaca teks asli bahasa Latin dengan bantuan kamus"
    hi: "शब्दकोश की मदद से मूल लैटिन पाठ पढ़ना"
  - en: "Analyse complex Latin grammar and sentence structure"
    zh: "分析复杂的拉丁语语法和句子结构"
    zh-TW: "分析複雜的拉丁語文法和句子結構"
    ja: "ラテン語の複雑な文法と構文を分析する"
    ko: "복잡한 라틴어 문법과 문장 구조 분석하기"
    vi: "Phân tích ngữ pháp và cấu trúc câu tiếng Latinh phức tạp"
    ms: "Analisis tatabahasa dan struktur ayat bahasa Latin yang kompleks"
    id: "Menganalisis tata bahasa dan struktur kalimat bahasa Latin yang rumit"
    hi: "जटिल लैटिन व्याकरण और वाक्य-रचना का विश्लेषण करना"
  - en: "Translate and interpret ancient literature"
    zh: "翻译并解读古代文学作品"
    zh-TW: "翻譯並解讀古代文學作品"
    ja: "古代の文学作品を訳し解釈する"
    ko: "고대 문학 작품 번역하고 해석하기"
    vi: "Dịch và diễn giải văn học cổ đại"
    ms: "Terjemah dan tafsir karya sastera kuno"
    id: "Menerjemahkan dan menafsirkan karya sastra kuno"
    hi: "प्राचीन साहित्य का अनुवाद और व्याख्या करना"
