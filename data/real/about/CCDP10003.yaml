code: CCDP10003
year: 2026
learn:
  en: "A broad tour of video games: their history, art, industry and culture, ending with your own game ideas and projects."
  zh: "全面了解电子游戏的历史、艺术、产业与文化，并动手提出自己的游戏构想。"
  zh-TW: "全面認識電子遊戲的歷史、藝術、產業與文化，並動手提出自己的遊戲構想。"
  ja: "ビデオゲームの歴史・芸術・産業・文化を広く学び、自分のゲーム企画も作る。"
  ko: "비디오 게임의 역사, 예술, 산업, 문화를 폭넓게 살펴보고 직접 게임 기획도 해 본다."
  vi: "Tìm hiểu rộng về trò chơi điện tử: lịch sử, nghệ thuật, ngành và văn hóa, rồi tự lên ý tưởng game."
  ms: "Tinjauan luas permainan video: sejarah, seni, industri dan budaya, serta idea permainan anda sendiri."
  id: "Menjelajah video game dari sejarah, seni, industri, dan budaya, lalu membuat ide game sendiri."
  hi: "वीडियो गेम्स का इतिहास, कला, उद्योग और संस्कृति समझना, और अपना गेम आइडिया बनाना।"
outcomes:
  - en: "Discuss the history and future of video games"
    zh: "讨论电子游戏的历史与未来"
    zh-TW: "討論電子遊戲的歷史與未來"
    ja: "ビデオゲームの歴史と未来を論じる"
    ko: "비디오 게임의 역사와 미래 논의하기"
    vi: "Bàn về lịch sử và tương lai của game"
    ms: "Membincangkan sejarah dan masa depan permainan video"
    id: "Membahas sejarah dan masa depan video game"
    hi: "वीडियो गेम्स के इतिहास और भविष्य पर चर्चा करना"
  - en: "Explain how art and technology mix in games"
    zh: "说明游戏中艺术与技术的结合"
    zh-TW: "說明遊戲中藝術與技術的結合"
    ja: "ゲームで芸術と技術がどう交わるか説明する"
    ko: "게임 속 예술과 기술의 결합 설명하기"
    vi: "Giải thích nghệ thuật và công nghệ hòa quyện trong game"
    ms: "Menjelaskan gabungan seni dan teknologi dalam permainan"
    id: "Menjelaskan perpaduan seni dan teknologi dalam game"
    hi: "गेम्स में कला और तकनीक का मेल समझाना"
  - en: "Pitch a game idea as part of a team"
    zh: "与团队一起提出游戏方案"
    zh-TW: "與團隊一起提出遊戲提案"
    ja: "チームでゲーム企画を提案する"
    ko: "팀으로 게임 기획안 발표하기"
    vi: "Cùng nhóm đề xuất ý tưởng game"
    ms: "Membentangkan idea permainan secara berkumpulan"
    id: "Mempresentasikan ide game bersama tim"
    hi: "टीम के साथ गेम आइडिया पेश करना"
