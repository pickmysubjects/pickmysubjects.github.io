code: MUST10014
year: 2026
learn:
  en: "Foundations in acting, singing and dance for music theatre, with daily classes and studio showings."
  zh: "音乐剧表演、演唱与舞蹈的基础，每天上课并做工作室呈现。"
  zh-TW: "音樂劇表演、演唱與舞蹈的基礎，每天上課並做工作室呈現。"
  ja: "ミュージカルの演技・歌・ダンスの基礎を、毎日の授業とスタジオ発表で学ぶ。"
  ko: "뮤지컬 연기·노래·춤의 기초를 매일 수업과 스튜디오 발표로 익힌다."
  vi: "Nền tảng diễn xuất, hát và múa cho nhạc kịch, học hằng ngày và trình diễn ở studio."
  ms: "Asas lakonan, nyanyian dan tarian teater muzikal, dengan kelas harian dan persembahan studio."
  id: "Dasar akting, menyanyi dan menari teater musikal, kelas harian dan presentasi studio."
  hi: "म्यूज़िकल थिएटर के अभिनय, गायन और नृत्य की बुनियाद, रोज़ कक्षाएँ और स्टूडियो प्रस्तुतियाँ।"
outcomes:
  - en: "Perform set work in acting, singing and dance"
    zh: "表演规定的表演、演唱与舞蹈作品"
    zh-TW: "表演規定的表演、演唱與舞蹈作品"
    ja: "演技・歌・ダンスの課題曲を上演する"
    ko: "연기·노래·춤 과제 공연하기"
    vi: "Trình diễn bài diễn, hát và múa được giao"
    ms: "Persembah kerja tetap lakonan, nyanyian, tarian"
    id: "Membawakan materi akting, nyanyi dan tari"
    hi: "अभिनय, गायन और नृत्य का तय काम प्रस्तुत करना"
  - en: "Build body and voice conditioning"
    zh: "锻炼身体与嗓音"
    zh-TW: "鍛鍊身體與嗓音"
    ja: "身体と声を鍛える"
    ko: "몸과 목소리 컨디셔닝하기"
    vi: "Rèn luyện cơ thể và giọng hát"
    ms: "Bina kecergasan tubuh dan suara"
    id: "Melatih kondisi tubuh dan suara"
    hi: "शरीर और आवाज़ की कंडीशनिंग करना"
  - en: "Reflect on your progress in class"
    zh: "反思自己在课堂上的进步"
    zh-TW: "反思自己在課堂上的進步"
    ja: "授業での進歩を振り返る"
    ko: "수업에서의 성장 돌아보기"
    vi: "Suy ngẫm về tiến bộ trong lớp"
    ms: "Renung kemajuan dalam kelas"
    id: "Merefleksikan kemajuan di kelas"
    hi: "कक्षा में अपनी प्रगति पर विचार करना"
