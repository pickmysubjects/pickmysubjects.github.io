code: ELEN90083
year: 2027
learn:
  en: "A substantial individual research project with a supervisor from a university or an industry partner, ending in a report and talk."
  zh: "跟随大学或业界导师独立完成一个较大的研究项目，最后写报告并做展示。"
  zh-TW: "跟隨大學或業界導師獨立完成一個較大的研究專題，最後寫報告並做簡報。"
  ja: "大学または企業の指導者のもとで行う本格的な個人研究プロジェクト。最後にレポートと発表がある。"
  ko: "대학이나 산업체 지도교수와 함께하는 개인 연구 프로젝트. 마지막에 보고서와 발표가 있음."
  vi: "Một dự án nghiên cứu cá nhân lớn với người hướng dẫn từ trường đại học hoặc doanh nghiệp, kết thúc bằng báo cáo và thuyết trình."
  ms: "Projek penyelidikan individu yang besar bersama penyelia dari universiti atau rakan industri, diakhiri laporan dan pembentangan."
  id: "Proyek riset individu yang besar dengan pembimbing dari universitas atau mitra industri, diakhiri laporan dan presentasi."
  hi: "यूनिवर्सिटी या इंडस्ट्री के सुपरवाइज़र के साथ एक बड़ा व्यक्तिगत शोध प्रोजेक्ट, अंत में रिपोर्ट और प्रेज़ेंटेशन।"
outcomes:
  - en: "Review literature to find where more research is needed"
    zh: "查阅文献，找出需要进一步研究的方向"
    zh-TW: "查閱文獻，找出需要進一步研究的方向"
    ja: "文献を調べ、さらに研究が必要な点を見つける"
    ko: "문헌을 검토해 추가 연구가 필요한 부분 찾기"
    vi: "Đọc tài liệu để tìm chỗ cần nghiên cứu thêm"
    ms: "Menyemak literatur untuk mencari ruang kajian lanjut"
    id: "Menelaah literatur untuk menemukan celah riset"
    hi: "साहित्य पढ़कर आगे शोध की ज़रूरत पहचानना"
  - en: "Plan a method and collect and analyse data"
    zh: "设计研究方法，收集并分析数据"
    zh-TW: "設計研究方法，蒐集並分析數據"
    ja: "調査方法を立て、データを集めて分析する"
    ko: "연구 방법을 세우고 데이터 수집·분석하기"
    vi: "Lập phương pháp, thu thập và phân tích dữ liệu"
    ms: "Merancang kaedah serta mengumpul dan menganalisis data"
    id: "Merancang metode serta mengumpulkan dan menganalisis data"
    hi: "तरीका तय करना और डेटा जुटाकर विश्लेषण करना"
  - en: "Write a project report and present the findings"
    zh: "撰写项目报告并展示研究结果"
    zh-TW: "撰寫專題報告並發表研究結果"
    ja: "プロジェクトレポートを書き、結果を発表する"
    ko: "프로젝트 보고서 작성 및 결과 발표하기"
    vi: "Viết báo cáo dự án và trình bày kết quả"
    ms: "Menulis laporan projek dan membentangkan dapatan"
    id: "Menulis laporan proyek dan mempresentasikan hasil"
    hi: "प्रोजेक्ट रिपोर्ट लिखना और नतीजे प्रस्तुत करना"
