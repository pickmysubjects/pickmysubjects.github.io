code: MCEN90062
year: 2027
learn:
  en: "Phase diagrams, crystallography, microscopy and XRD, corrosion, processing and computational materials modelling."
  zh: "相图、晶体学、电镜和 XRD、腐蚀、加工以及计算材料建模。"
  zh-TW: "相圖、晶體學、電子顯微鏡與 XRD、腐蝕、加工以及計算材料建模。"
  ja: "状態図、結晶学、電子顕微鏡とXRD、腐食、加工、計算材料モデリング。"
  ko: "상태도, 결정학, 전자현미경·XRD, 부식, 가공, 계산 재료 모델링."
  vi: "Giản đồ pha, tinh thể học, kính hiển vi, XRD, ăn mòn, gia công và mô hình vật liệu tính toán."
  ms: "Gambar rajah fasa, kristalografi, mikroskopi dan XRD, kakisan, pemprosesan dan pemodelan bahan berkomputer."
  id: "Diagram fase, kristalografi, mikroskopi dan XRD, korosi, pemrosesan, dan pemodelan material komputasi."
  hi: "फ़ेज़ डायग्राम, क्रिस्टलोग्राफ़ी, माइक्रोस्कोपी व XRD, संक्षारण, प्रोसेसिंग और कम्प्यूटेशनल मटीरियल मॉडलिंग।"
outcomes:
  - en: "Link phase equilibria to microstructure"
    zh: "把相平衡与显微组织联系起来"
    zh-TW: "把相平衡與顯微組織連結起來"
    ja: "相平衡と微細組織を結びつける"
    ko: "상평형과 미세조직 연결하기"
    vi: "Liên hệ cân bằng pha với vi cấu trúc"
    ms: "Mengaitkan keseimbangan fasa dengan mikrostruktur"
    id: "Menghubungkan kesetimbangan fase dengan mikrostruktur"
    hi: "फ़ेज़ संतुलन को सूक्ष्म संरचना से जोड़ना"
  - en: "Choose and use characterisation techniques"
    zh: "选择并使用材料表征方法"
    zh-TW: "選擇並使用材料表徵方法"
    ja: "評価・分析手法を選んで使う"
    ko: "재료 분석 기법 선택·활용하기"
    vi: "Chọn và dùng kỹ thuật đặc trưng vật liệu"
    ms: "Memilih dan menggunakan teknik pencirian"
    id: "Memilih dan memakai teknik karakterisasi"
    hi: "लक्षण-निर्धारण तकनीकें चुनना और उपयोग करना"
