code: UNIB10022
year: 2027
learn:
  en: "What entrepreneurs do and the key tools they use, useful whether you start a business or work in any organisation."
  zh: "创业者做什么、用哪些核心工具，无论创业还是在任何机构工作都用得上。"
  zh-TW: "創業者做什麼、用哪些核心工具，無論創業還是在任何組織工作都用得上。"
  ja: "起業家が何をし、どんな主要ツールを使うのか。起業する人にも、どんな組織で働く人にも役立つ内容。"
  ko: "창업가가 하는 일과 핵심 도구를 배우며, 창업하든 어떤 조직에서 일하든 쓸모 있다."
  vi: "Doanh nhân khởi nghiệp làm gì và dùng những công cụ chính nào, hữu ích dù bạn tự kinh doanh hay làm ở bất kỳ tổ chức nào."
  ms: "Apa yang dilakukan usahawan dan alat utama yang mereka guna, berguna sama ada anda memulakan perniagaan atau bekerja di mana-mana organisasi."
  id: "Apa yang dilakukan wirausaha dan alat utama yang mereka pakai, berguna baik untuk memulai usaha maupun bekerja di organisasi mana pun."
  hi: "उद्यमी क्या करते हैं और कौन-से मुख्य टूल इस्तेमाल करते हैं, जो खुद बिज़नेस शुरू करने या किसी भी संस्था में काम करने में काम आते हैं।"
outcomes:
  - en: "Explain the core skills entrepreneurs need and use them"
    zh: "说明并运用创业者所需的核心技能"
    zh-TW: "說明並運用創業者所需的核心技能"
    ja: "起業家に必要な基本スキルを説明し使ってみる"
    ko: "창업가에게 필요한 핵심 역량 설명하고 활용하기"
    vi: "Giải thích và vận dụng kỹ năng cốt lõi của doanh nhân"
    ms: "Terangkan dan guna kemahiran teras yang diperlukan usahawan"
    id: "Menjelaskan dan menerapkan keterampilan inti seorang wirausaha"
    hi: "उद्यमियों के ज़रूरी मुख्य कौशल समझाना और अपनाना"
  - en: "Spot chances to innovate and plan a response"
    zh: "发现创新机会并设计应对方案"
    zh-TW: "發現創新機會並設計因應方案"
    ja: "イノベーションの機会を見つけ対応策を考える"
    ko: "혁신 기회를 찾고 대응 방안 설계하기"
    vi: "Nhận ra cơ hội đổi mới và lên phương án đáp ứng"
    ms: "Kenal pasti peluang inovasi dan rancang tindak balas"
    id: "Menemukan peluang inovasi dan merancang responsnya"
    hi: "नवाचार के मौके पहचानना और उन पर योजना बनाना"
  - en: "Use skills from several fields to reduce risk"
    zh: "运用多学科技能降低不确定风险"
    zh-TW: "運用多學科技能降低不確定風險"
    ja: "複数分野のスキルで不確かな将来のリスクを下げる"
    ko: "여러 분야의 기술로 위험 줄이기"
    vi: "Dùng kỹ năng từ nhiều ngành để giảm rủi ro"
    ms: "Guna kemahiran pelbagai bidang untuk mengurangkan risiko"
    id: "Memakai keterampilan lintas bidang untuk mengurangi risiko"
    hi: "कई विषयों के कौशल से जोखिम कम करना"
