code: GERM10005
year: 2026
learn:
  en: "Follows German 1: more grammar and tenses, longer conversations and short writing, built around Berlin then and now."
  zh: "接续德语 1：更多语法和时态、更长的对话和短篇写作，以柏林的过去与现在为主题。"
  zh-TW: "接續德語 1：更多文法和時態、更長的對話和短篇寫作，以柏林的過去與現在為主題。"
  ja: "ドイツ語1の続き。文法と時制を広げ、会話と短い作文を増やす。テーマはベルリンの昔と今。"
  ko: "독일어 1에 이어 문법과 시제를 넓히고 더 긴 대화와 짧은 글쓰기를 한다. 주제는 베를린의 과거와 현재."
  vi: "Tiếp nối German 1: thêm ngữ pháp và thì, hội thoại dài hơn, viết ngắn, xoay quanh Berlin xưa và nay."
  ms: "Sambungan German 1: lebih banyak tatabahasa dan kala, perbualan lebih panjang dan penulisan pendek, bertema Berlin dulu dan kini."
  id: "Lanjutan German 1: lebih banyak tata bahasa dan kala, percakapan lebih panjang dan tulisan pendek, bertema Berlin dulu dan kini."
  hi: "जर्मन 1 के आगे: ज़्यादा व्याकरण और काल, लंबी बातचीत और छोटा लेखन, बर्लिन के अतीत और वर्तमान के इर्द-गिर्द।"
outcomes:
  - en: "Talk about familiar topics in German with more confidence"
    zh: "更自信地用德语谈论熟悉的话题"
    zh-TW: "更自信地用德語談論熟悉的話題"
    ja: "身近な話題をドイツ語でより自信を持って話す"
    ko: "익숙한 주제를 독일어로 더 자신 있게 말하기"
    vi: "Nói về chủ đề quen thuộc bằng tiếng Đức tự tin hơn"
    ms: "Bercakap tentang topik biasa dalam bahasa Jerman dengan lebih yakin"
    id: "Membicarakan topik akrab dalam bahasa Jerman dengan lebih percaya diri"
    hi: "परिचित विषयों पर जर्मन में ज़्यादा आत्मविश्वास से बात करना"
  - en: "Read and write short German texts"
    zh: "读写简短的德语文章"
    zh-TW: "讀寫簡短的德語文章"
    ja: "短いドイツ語の文章を読み書きする"
    ko: "짧은 독일어 글 읽고 쓰기"
    vi: "Đọc và viết đoạn văn tiếng Đức ngắn"
    ms: "Baca dan tulis teks pendek bahasa Jerman"
    id: "Membaca dan menulis teks pendek bahasa Jerman"
    hi: "छोटे जर्मन पाठ पढ़ना-लिखना"
  - en: "Use new grammar and vocabulary correctly"
    zh: "正确运用新语法和词汇"
    zh-TW: "正確運用新文法和詞彙"
    ja: "新しい文法と語彙を正しく使う"
    ko: "새 문법과 어휘를 정확히 쓰기"
    vi: "Dùng đúng ngữ pháp và từ vựng mới"
    ms: "Guna tatabahasa dan kosa kata baharu dengan betul"
    id: "Memakai tata bahasa dan kosakata baru dengan benar"
    hi: "नया व्याकरण और शब्दावली सही इस्तेमाल करना"
