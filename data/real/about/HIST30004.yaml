code: HIST30004
year: 2026
learn:
  en: "How sexual practices and identities have changed through history, and where modern ideas about sex and gender come from."
  zh: "性行为与性身份在历史中如何变化，以及现代关于性与性别的观念从何而来。"
  zh-TW: "性行為與性身分在歷史中如何變化，以及現代關於性與性別的觀念從何而來。"
  ja: "性のあり方やアイデンティティが歴史の中でどう変わり、性とジェンダーについての現代の考えがどこから来たかを学ぶ。"
  ko: "성적 실천과 정체성이 역사 속에서 어떻게 변했는지, 성과 젠더에 대한 현대의 생각이 어디서 왔는지 배운다."
  vi: "Thực hành và bản sắc tính dục đã thay đổi qua lịch sử ra sao, và quan niệm hiện đại về tính dục, giới đến từ đâu."
  ms: "Cara amalan dan identiti seksual berubah sepanjang sejarah, dan asal idea moden tentang seks dan gender."
  id: "Cara praktik dan identitas seksual berubah sepanjang sejarah, dan asal gagasan modern soal seks dan gender."
  hi: "इतिहास में यौन व्यवहार और पहचानें कैसे बदलीं, और सेक्स व जेंडर के आधुनिक विचार कहाँ से आए।"
outcomes:
  - en: "Explain how sexual identities are historically made"
    zh: "说明性身份如何在历史中形成"
    zh-TW: "說明性身分如何在歷史中形成"
    ja: "性的アイデンティティが歴史的に作られることを説明する"
    ko: "성 정체성이 역사적으로 만들어지는 방식 설명하기"
    vi: "Giải thích bản sắc tính dục được hình thành trong lịch sử ra sao"
    ms: "Terangkan cara identiti seksual terbentuk dalam sejarah"
    id: "Menjelaskan cara identitas seksual terbentuk secara historis"
    hi: "समझाना कि यौन पहचानें इतिहास में कैसे बनती हैं"
  - en: "Discuss how sexuality links to race, class and gender"
    zh: "讨论性与种族、阶层和性别的交织"
    zh-TW: "討論性與種族、階級和性別的交織"
    ja: "セクシュアリティと人種・階級・ジェンダーの関係を論じる"
    ko: "섹슈얼리티와 인종·계층·젠더의 관계 토론하기"
    vi: "Thảo luận mối liên hệ giữa tính dục với chủng tộc, giai cấp và giới"
    ms: "Bincangkan kaitan seksualiti dengan kaum, kelas dan gender"
    id: "Membahas kaitan seksualitas dengan ras, kelas, dan gender"
    hi: "यौनिकता का नस्ल, वर्ग और जेंडर से संबंध चर्चा करना"
  - en: "Find and use sources for a research essay"
    zh: "查找并运用资料完成研究论文"
    zh-TW: "查找並運用資料完成研究論文"
    ja: "研究エッセイのために資料を探して使う"
    ko: "연구 에세이를 위해 자료 찾아 활용하기"
    vi: "Tìm và dùng tư liệu cho bài luận nghiên cứu"
    ms: "Cari dan guna sumber untuk esei kajian"
    id: "Mencari dan memakai sumber untuk esai riset"
    hi: "शोध निबंध के लिए स्रोत खोजना और इस्तेमाल करना"
