code: PSYC40014
year: 2026
learn:
  en: "Advanced research methods and statistics for psychology, plus how to judge whether a psychological test is reliable and valid."
  zh: "心理学高级研究方法与统计，以及如何判断心理测验的信度和效度。"
  zh-TW: "心理學進階研究方法與統計，以及如何判斷心理測驗的信度和效度。"
  ja: "心理学の高度な研究法と統計、心理検査の信頼性と妥当性の見きわめ方。"
  ko: "심리학 고급 연구방법과 통계, 심리검사의 신뢰도·타당도 판단법."
  vi: "Phương pháp nghiên cứu và thống kê nâng cao trong tâm lý, cách đánh giá độ tin cậy, hiệu lực của trắc nghiệm."
  ms: "Kaedah penyelidikan dan statistik lanjutan psikologi, serta menilai kebolehpercayaan dan kesahan ujian."
  id: "Metode riset dan statistik lanjutan psikologi, serta menilai reliabilitas dan validitas tes psikologi."
  hi: "मनोविज्ञान की उन्नत शोध विधियाँ और सांख्यिकी, और मनोवैज्ञानिक परीक्षण की विश्वसनीयता-वैधता परखना।"
outcomes:
  - en: "Choose and run suitable statistical analyses"
    zh: "选择并进行合适的统计分析"
    zh-TW: "選擇並進行合適的統計分析"
    ja: "適切な統計分析を選んで行う"
    ko: "알맞은 통계 분석 골라 수행하기"
    vi: "Chọn và thực hiện phân tích thống kê phù hợp"
    ms: "Pilih dan jalankan analisis statistik sesuai"
    id: "Memilih dan menjalankan analisis statistik yang tepat"
    hi: "उपयुक्त सांख्यिकीय विश्लेषण चुनना और करना"
  - en: "Judge the reliability and validity of tests"
    zh: "判断测验的信度与效度"
    zh-TW: "判斷測驗的信度與效度"
    ja: "検査の信頼性と妥当性を判断する"
    ko: "검사의 신뢰도와 타당도 판단하기"
    vi: "Đánh giá độ tin cậy và hiệu lực của trắc nghiệm"
    ms: "Nilai kebolehpercayaan dan kesahan ujian"
    id: "Menilai reliabilitas dan validitas tes"
    hi: "परीक्षणों की विश्वसनीयता और वैधता परखना"
  - en: "Critique research on human behaviour"
    zh: "批判性评价关于人类行为的研究"
    zh-TW: "批判性評價關於人類行為的研究"
    ja: "人間の行動に関する研究を批評する"
    ko: "인간 행동 연구를 비판적으로 평가하기"
    vi: "Phản biện nghiên cứu về hành vi con người"
    ms: "Kritik kajian tentang tingkah laku manusia"
    id: "Mengkritisi riset tentang perilaku manusia"
    hi: "मानव व्यवहार पर शोध की समीक्षा करना"
