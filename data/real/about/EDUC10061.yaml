code: EDUC10061
year: 2026
learn:
  en: "How to read data, statistics and science claims, spot misinformation and AI bias, and plan a data-informed community project."
  zh: "读懂数据、统计和科学说法，识别错误信息与AI偏见，并策划社区项目。"
  zh-TW: "讀懂數據、統計和科學說法，辨識錯誤資訊與AI偏誤，並規劃社區專案。"
  ja: "データや統計、科学的主張を読み解き、誤情報やAIの偏りを見抜き、地域プロジェクトを計画する。"
  ko: "데이터·통계·과학 주장을 읽고, 허위 정보와 AI 편향을 가려내며, 지역 프로젝트를 기획하기."
  vi: "Đọc hiểu dữ liệu, thống kê và tuyên bố khoa học, nhận ra tin sai và thiên lệch AI, lên kế hoạch dự án cộng đồng."
  ms: "Membaca data, statistik dan dakwaan sains, mengesan maklumat palsu dan bias AI, serta merancang projek komuniti."
  id: "Membaca data, statistik dan klaim ilmiah, mengenali misinformasi dan bias AI, serta merancang proyek komunitas."
  hi: "डेटा, आँकड़े और वैज्ञानिक दावे समझना, गलत सूचना व AI पक्षपात पहचानना, और सामुदायिक प्रोजेक्ट बनाना।"
outcomes:
  - en: "Interpret statistics, graphs and scientific claims"
    zh: "解读统计数据、图表和科学说法"
    zh-TW: "解讀統計數據、圖表和科學說法"
    ja: "統計・グラフ・科学的主張を解釈する"
    ko: "통계·그래프·과학 주장 해석하기"
    vi: "Diễn giải số liệu, biểu đồ và tuyên bố khoa học"
    ms: "Mentafsir statistik, graf dan dakwaan sains"
    id: "Menafsirkan statistik, grafik dan klaim ilmiah"
    hi: "आँकड़ों, ग्राफ़ और वैज्ञानिक दावों की व्याख्या करना"
  - en: "Judge how credible a source of information is"
    zh: "判断信息来源是否可信"
    zh-TW: "判斷資訊來源是否可信"
    ja: "情報源の信頼性を判断する"
    ko: "정보 출처의 신뢰성 판단하기"
    vi: "Đánh giá độ tin cậy của nguồn thông tin"
    ms: "Menilai kebolehpercayaan sumber maklumat"
    id: "Menilai kredibilitas sumber informasi"
    hi: "सूचना स्रोत की विश्वसनीयता परखना"
  - en: "Critique how AI is used to read data and make decisions"
    zh: "批判性看待用AI解读数据和做决策"
    zh-TW: "批判性看待用AI解讀數據和做決策"
    ja: "データ解釈や意思決定でのAI利用を批評する"
    ko: "데이터 해석과 의사결정에서 AI 활용 비평하기"
    vi: "Phản biện việc dùng AI để đọc dữ liệu và ra quyết định"
    ms: "Mengkritik penggunaan AI dalam tafsiran data dan keputusan"
    id: "Mengkritisi penggunaan AI untuk membaca data dan mengambil keputusan"
    hi: "डेटा और निर्णयों में AI के उपयोग की समीक्षा करना"
