code: MUSI30045
year: 2026
learn:
  en: "A close look at opera: its history, works and staging, written up in journal entries and a long essay."
  zh: "深入研究歌剧的历史、作品与演出，以日志和长篇论文呈现。"
  zh-TW: "深入研究歌劇的歷史、作品與演出，以日誌和長篇論文呈現。"
  ja: "オペラの歴史・作品・上演を掘り下げ、日誌と長い論文にまとめる。"
  ko: "오페라의 역사·작품·연출을 깊이 보고 저널과 긴 에세이로 정리한다."
  vi: "Tìm hiểu sâu opera: lịch sử, tác phẩm, dàn dựng; viết nhật ký và tiểu luận dài."
  ms: "Kajian rapi opera: sejarah, karya dan pementasan, ditulis dalam jurnal dan esei."
  id: "Kajian mendalam opera: sejarah, karya, pementasan, lewat jurnal dan esai panjang."
  hi: "ओपेरा का गहन अध्ययन: इतिहास, कृतियाँ, मंचन; जर्नल और लंबे निबंध में।"
outcomes:
  - en: "Discuss key operas and their historical setting"
    zh: "讨论重要歌剧及其历史背景"
    zh-TW: "討論重要歌劇及其歷史背景"
    ja: "主要なオペラと時代背景を論じる"
    ko: "주요 오페라와 역사적 배경 논하기"
    vi: "Bàn về các vở opera quan trọng và bối cảnh"
    ms: "Bincang opera penting dan latar sejarahnya"
    id: "Membahas opera penting dan latar sejarahnya"
    hi: "प्रमुख ओपेरा और उनका ऐतिहासिक संदर्भ चर्चा करना"
  - en: "Analyse how music and drama work together"
    zh: "分析音乐与戏剧如何配合"
    zh-TW: "分析音樂與戲劇如何配合"
    ja: "音楽と演劇の結びつきを分析する"
    ko: "음악과 극이 어우러지는 방식 분석하기"
    vi: "Phân tích âm nhạc và kịch phối hợp ra sao"
    ms: "Analisis cara muzik dan drama bergabung"
    id: "Menganalisis paduan musik dan drama"
    hi: "संगीत और नाटक कैसे साथ काम करते हैं, विश्लेषण"
  - en: "Write a sustained, well-researched essay"
    zh: "写一篇论证充分的长篇论文"
    zh-TW: "寫一篇論證充分的長篇論文"
    ja: "十分に調べた長い論文を書く"
    ko: "충분히 조사한 긴 에세이 쓰기"
    vi: "Viết tiểu luận dài, nghiên cứu kỹ"
    ms: "Tulis esei panjang yang dikaji rapi"
    id: "Menulis esai panjang yang diriset baik"
    hi: "अच्छी तरह शोधित लंबा निबंध लिखना"
