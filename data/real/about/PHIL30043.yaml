code: PHIL30043
year: 2026
learn:
  en: "Landmark 20th-century results in logic, such as completeness and incompleteness, and what they show about logic's limits."
  zh: "20世纪逻辑学的里程碑成果，如完备性和不完备性定理，以及它们揭示的逻辑极限。"
  zh-TW: "20世紀邏輯學的里程碑成果，如完備性和不完備性定理，以及它們揭示的邏輯極限。"
  ja: "完全性・不完全性など20世紀論理学の画期的な成果と、それが示す論理の限界を学ぶ。"
  ko: "완전성·불완전성 같은 20세기 논리학의 획기적 결과와 그것이 보여 주는 논리의 한계를 배운다."
  vi: "Những kết quả mang tính bước ngoặt của logic thế kỷ 20, như tính đầy đủ và bất toàn, và chúng cho thấy giới hạn của logic ra sao."
  ms: "Hasil penting logik abad ke-20, seperti kelengkapan dan ketaklengkapan, dan apa yang ditunjukkan tentang had logik."
  id: "Hasil penting logika abad ke-20, seperti kelengkapan dan ketaklengkapan, serta apa yang ditunjukkannya soal batas logika."
  hi: "20वीं सदी के तर्कशास्त्र के ऐतिहासिक नतीजे, जैसे पूर्णता और अपूर्णता, और वे तर्क की सीमाओं के बारे में क्या दिखाते हैं।"
outcomes:
  - en: "Prove soundness and completeness results"
    zh: "证明可靠性和完备性结果"
    zh-TW: "證明可靠性和完備性結果"
    ja: "健全性と完全性の結果を証明する"
    ko: "건전성과 완전성 결과 증명하기"
    vi: "Chứng minh các kết quả về tính đúng đắn và đầy đủ"
    ms: "Buktikan keputusan kesahihan dan kelengkapan"
    id: "Membuktikan hasil kesahihan dan kelengkapan"
    hi: "साउंडनेस और कम्प्लीटनेस के नतीजे सिद्ध करना"
  - en: "Explain the limits shown by incompleteness"
    zh: "说明不完备性揭示的极限"
    zh-TW: "說明不完備性揭示的極限"
    ja: "不完全性が示す限界を説明する"
    ko: "불완전성이 보여 주는 한계 설명하기"
    vi: "Giải thích giới hạn mà tính bất toàn cho thấy"
    ms: "Terangkan had yang ditunjukkan oleh ketaklengkapan"
    id: "Menjelaskan batas yang ditunjukkan ketaklengkapan"
    hi: "अपूर्णता से दिखने वाली सीमाएं समझाना"
  - en: "Discuss what logic tells us about computation"
    zh: "讨论逻辑对计算的启示"
    zh-TW: "討論邏輯對計算的啟示"
    ja: "論理が計算について示すことを論じる"
    ko: "논리가 계산에 대해 알려 주는 것 논의하기"
    vi: "Thảo luận logic cho ta biết gì về tính toán"
    ms: "Bincangkan apa yang logik beritahu tentang pengiraan"
    id: "Membahas apa yang logika katakan soal komputasi"
    hi: "तर्क गणना के बारे में क्या बताता है, चर्चा करना"
