code: MGMT90014
year: 2027
learn:
  en: "How work is changing through technology, new jobs and online labour markets, and how firms and governments respond."
  zh: "技术、新职业和在线劳动力市场如何改变工作，以及企业和政府如何应对。"
  zh-TW: "科技、新職業和線上勞動市場如何改變工作，以及企業和政府如何因應。"
  ja: "技術や新しい職業、オンライン労働市場で仕事がどう変わり、企業と政府がどう対応するかを学ぶ。"
  ko: "기술, 새로운 직업, 온라인 노동시장으로 일이 어떻게 바뀌고 기업과 정부가 어떻게 대응하는지 배운다."
  vi: "Công việc thay đổi ra sao qua công nghệ, nghề mới, thị trường lao động trực tuyến, và doanh nghiệp, chính phủ ứng phó thế nào."
  ms: "Bagaimana kerja berubah melalui teknologi, pekerjaan baharu dan pasaran buruh dalam talian, serta respons firma dan kerajaan."
  id: "Bagaimana kerja berubah lewat teknologi, pekerjaan baru dan pasar kerja daring, serta respons perusahaan dan pemerintah."
  hi: "तकनीक, नए काम और ऑनलाइन श्रम बाज़ार से काम कैसे बदल रहा है, और कंपनियाँ व सरकारें कैसे जवाब देती हैं।"
outcomes:
  - en: "Evaluate issues in the changing world of work"
    zh: "评估工作方式变化带来的问题"
    zh-TW: "評估工作方式變化帶來的問題"
    ja: "変わりゆく働き方の課題を評価する"
    ko: "변화하는 일의 세계의 문제 평가하기"
    vi: "Đánh giá các vấn đề của thế giới việc làm đang đổi thay"
    ms: "Menilai isu dalam dunia kerja yang berubah"
    id: "Menilai isu dalam dunia kerja yang berubah"
    hi: "बदलती कामकाजी दुनिया के मुद्दों का मूल्यांकन करना"
  - en: "Compare employer and public policy responses"
    zh: "比较雇主与公共政策的应对方式"
    zh-TW: "比較雇主與公共政策的因應方式"
    ja: "雇用者と公共政策の対応を比較する"
    ko: "고용주와 공공정책의 대응 비교하기"
    vi: "So sánh cách ứng phó của chủ lao động và chính sách công"
    ms: "Membandingkan respons majikan dan dasar awam"
    id: "Membandingkan respons pemberi kerja dan kebijakan publik"
    hi: "नियोक्ताओं और सार्वजनिक नीति के जवाबों की तुलना करना"
