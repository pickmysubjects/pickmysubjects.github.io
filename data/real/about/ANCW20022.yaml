code: ANCW20022
year: 2026
learn:
  en: "Ancient Greek history from Homer's age to Alexander's, covering the city-state, democracy, war, religion and literature."
  zh: "从荷马时代到亚历山大时代的古希腊史，涵盖城邦、民主、战争、宗教和文学。"
  zh-TW: "從荷馬時代到亞歷山大時代的古希臘史，涵蓋城邦、民主、戰爭、宗教和文學。"
  ja: "ホメロスの時代からアレクサンドロスの時代までの古代ギリシャ史。ポリス・民主政・戦争・宗教・文学を扱う。"
  ko: "호메로스 시대부터 알렉산드로스 시대까지 고대 그리스사: 폴리스, 민주정, 전쟁, 종교, 문학을 다룬다."
  vi: "Lịch sử Hy Lạp cổ từ thời Homer đến thời Alexander: thành bang, dân chủ, chiến tranh, tôn giáo và văn học."
  ms: "Sejarah Yunani kuno dari zaman Homer hingga Alexander, meliputi negara kota, demokrasi, perang, agama dan sastera."
  id: "Sejarah Yunani kuno dari zaman Homer hingga Alexander, mencakup negara-kota, demokrasi, perang, agama, dan sastra."
  hi: "होमर के युग से सिकंदर के युग तक प्राचीन यूनान का इतिहास: नगर-राज्य, लोकतंत्र, युद्ध, धर्म और साहित्य।"
outcomes:
  - en: "Outline the main periods of Greek history"
    zh: "概述希腊历史的主要时期"
    zh-TW: "概述希臘歷史的主要時期"
    ja: "ギリシャ史の主な時代をまとめる"
    ko: "그리스 역사의 주요 시기 정리하기"
    vi: "Tóm tắt các thời kỳ chính của lịch sử Hy Lạp"
    ms: "Ringkaskan zaman utama sejarah Yunani"
    id: "Merangkum periode utama sejarah Yunani"
    hi: "यूनानी इतिहास के मुख्य कालों की रूपरेखा देना"
  - en: "Compare Greek political systems"
    zh: "比较希腊的各种政治制度"
    zh-TW: "比較希臘的各種政治制度"
    ja: "ギリシャの政治体制を比べる"
    ko: "그리스의 정치 체제 비교하기"
    vi: "So sánh các chế độ chính trị Hy Lạp"
    ms: "Bandingkan sistem politik Yunani"
    id: "Membandingkan sistem politik Yunani"
    hi: "यूनानी राजनीतिक व्यवस्थाओं की तुलना करना"
  - en: "Use texts and archaeology as evidence"
    zh: "运用文本和考古资料作为证据"
    zh-TW: "運用文本和考古資料作為證據"
    ja: "文献と考古資料を証拠として使う"
    ko: "문헌과 고고학을 증거로 활용하기"
    vi: "Sử dụng văn bản và khảo cổ làm bằng chứng"
    ms: "Gunakan teks dan arkeologi sebagai bukti"
    id: "Memakai teks dan arkeologi sebagai bukti"
    hi: "ग्रंथों और पुरातत्व को साक्ष्य के रूप में उपयोग करना"
