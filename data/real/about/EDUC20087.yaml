code: EDUC20087
year: 2027
learn:
  en: "Learning about sustainability by walking and exploring places around Naarm/Melbourne: their past, present and possible futures."
  zh: "走进墨尔本（Naarm）各地，从当地的过去、现在和未来学习可持续发展。"
  zh-TW: "走進墨爾本（Naarm）各地，從當地的過去、現在和未來學習永續發展。"
  ja: "ナーム／メルボルンの各地を歩いて巡り、その過去・現在・未来から持続可能性を学ぶ。"
  ko: "나암/멜버른 곳곳을 걸으며 그 장소의 과거, 현재, 미래를 통해 지속가능성을 배운다."
  vi: "Học về phát triển bền vững bằng cách đi bộ khám phá các địa điểm ở Naarm/Melbourne: quá khứ, hiện tại và tương lai."
  ms: "Belajar tentang kelestarian dengan berjalan dan meneroka tempat di Naarm/Melbourne: masa lalu, kini dan masa depan."
  id: "Belajar keberlanjutan dengan berjalan dan menjelajahi tempat-tempat di Naarm/Melbourne: masa lalu, kini, dan masa depan."
  hi: "नार्म/मेलबर्न की जगहों पर घूमकर उनके अतीत, वर्तमान और संभावित भविष्य से सस्टेनेबिलिटी सीखना।"
outcomes:
  - en: "Identify Melbourne's current sustainability issues"
    zh: "找出墨尔本当前的可持续问题"
    zh-TW: "找出墨爾本當前的永續問題"
    ja: "メルボルンの今の持続可能性の課題を挙げる"
    ko: "멜버른의 현재 지속가능성 문제 파악하기"
    vi: "Nhận diện vấn đề bền vững hiện nay của Melbourne"
    ms: "Kenal pasti isu kelestarian semasa di Melbourne"
    id: "Mengenali isu keberlanjutan Melbourne saat ini"
    hi: "मेलबर्न के मौजूदा सस्टेनेबिलिटी मुद्दे पहचानना"
  - en: "Engage with First Nations and settler views of the city"
    zh: "了解原住民与定居者对这座城市的不同理解"
    zh-TW: "了解原住民與移居者對這座城市的不同理解"
    ja: "先住民と入植者それぞれの都市観に向き合う"
    ko: "원주민과 정착민의 도시 인식 살펴보기"
    vi: "Tìm hiểu cách nhìn của người bản địa và người định cư về thành phố"
    ms: "Teliti pandangan Orang Asli dan peneroka tentang bandar ini"
    id: "Menelaah pandangan Pribumi dan pendatang tentang kota ini"
    hi: "शहर पर फ़र्स्ट नेशंस और बसने वालों के नज़रिये समझना"
  - en: "Make an original artwork or essay from what you learn"
    zh: "把所学转化为原创作品或论文"
    zh-TW: "把所學轉化為原創作品或論文"
    ja: "学んだことから作品やエッセイを作る"
    ko: "배운 것으로 창작물이나 에세이 만들기"
    vi: "Tạo tác phẩm hoặc bài luận gốc từ điều đã học"
    ms: "Hasilkan karya seni atau esei asli daripada pembelajaran"
    id: "Membuat karya seni atau esai orisinal dari yang dipelajari"
    hi: "सीखी बातों से मौलिक कला या निबंध बनाना"
