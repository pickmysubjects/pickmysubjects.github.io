code: MAST90139
year: 2027
learn:
  en: "Statistical models for data science: linear, generalised and mixed models, causal inference and missing data."
  zh: "数据科学中的统计模型：线性、广义线性与混合模型、因果推断和缺失数据。"
  zh-TW: "資料科學中的統計模型：線性、廣義線性與混合模型、因果推論與缺失資料。"
  ja: "データ科学の統計モデル：線形・一般化線形・混合モデル、因果推論、欠測データ。"
  ko: "데이터 과학의 통계모형: 선형·일반화선형·혼합모형, 인과추론, 결측 자료."
  vi: "Mô hình thống kê cho khoa học dữ liệu: tuyến tính, tuyến tính tổng quát, hỗn hợp, nhân quả, dữ liệu thiếu."
  ms: "Model statistik untuk sains data: linear, linear teritlak, campuran, inferens sebab-akibat, data hilang."
  id: "Model statistik sains data: linear, linear tergeneralisasi, campuran, inferensi kausal, data hilang."
  hi: "डेटा साइंस के सांख्यिकीय मॉडल: लीनियर, जनरलाइज़्ड, मिक्स्ड, कारण अनुमान, मिसिंग डेटा।"
outcomes:
  - en: "Build statistical models for data from many settings"
    zh: "为不同场景的数据构建统计模型"
    zh-TW: "為不同情境的資料建立統計模型"
    ja: "様々な場面のデータに統計モデルを作る"
    ko: "다양한 상황의 자료로 통계모형 만들기"
    vi: "Xây mô hình thống kê cho dữ liệu nhiều bối cảnh"
    ms: "Membina model statistik untuk data pelbagai konteks"
    id: "Membangun model statistik untuk data beragam"
    hi: "अलग-अलग स्थितियों के डेटा के लिए मॉडल बनाना"
  - en: "Deal properly with missing or incomplete data"
    zh: "正确处理缺失或不完整数据"
    zh-TW: "正確處理缺失或不完整資料"
    ja: "欠測や不完全なデータを適切に扱う"
    ko: "결측·불완전 자료 제대로 다루기"
    vi: "Xử lý đúng dữ liệu thiếu hoặc không đầy đủ"
    ms: "Mengendali data hilang atau tidak lengkap dengan betul"
    id: "Menangani data hilang atau tidak lengkap dengan benar"
    hi: "मिसिंग या अधूरे डेटा को सही तरीके से संभालना"
