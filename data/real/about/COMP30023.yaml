code: COMP30023
year: 2026
learn:
  en: "How computers work under the hood: operating systems, networks and basic security."
  zh: "电脑底层怎么运作：操作系统、网络和基础安全。"
  zh-TW: "電腦底層怎麼運作：作業系統、網路和基礎資安。"
  ja: "コンピュータの内部の仕組み：OS、ネットワーク、基本的なセキュリティ。"
  ko: "컴퓨터 내부 작동 원리: 운영체제, 네트워크, 기초 보안."
  vi: "Máy tính hoạt động bên trong ra sao: hệ điều hành, mạng và bảo mật cơ bản."
  ms: "Cara komputer berfungsi di sebalik tabir: sistem pengendalian, rangkaian dan keselamatan asas."
  id: "Cara kerja komputer di balik layar: sistem operasi, jaringan, dan keamanan dasar."
  hi: "कंप्यूटर अंदर से कैसे काम करता है: ऑपरेटिंग सिस्टम, नेटवर्क और बेसिक सिक्योरिटी।"
outcomes:
  - en: "Explain how an operating system runs programs"
    zh: "解释操作系统如何运行程序"
    zh-TW: "解釋作業系統如何執行程式"
    ja: "OSがプログラムを動かす仕組みを説明する"
    ko: "운영체제가 프로그램을 실행하는 방식 설명"
    vi: "Giải thích hệ điều hành chạy chương trình thế nào"
    ms: "Terangkan cara sistem pengendalian jalankan program"
    id: "Menjelaskan cara sistem operasi menjalankan program"
    hi: "ऑपरेटिंग सिस्टम प्रोग्राम कैसे चलाता है, समझाना"
  - en: "Build simple server applications"
    zh: "写简单的服务器程序"
    zh-TW: "寫簡單的伺服器程式"
    ja: "簡単なサーバーアプリを作る"
    ko: "간단한 서버 애플리케이션 작성"
    vi: "Viết ứng dụng server đơn giản"
    ms: "Bina aplikasi pelayan ringkas"
    id: "Membuat aplikasi server sederhana"
    hi: "सरल सर्वर ऐप्लिकेशन बनाना"
  - en: "Spot common security weaknesses"
    zh: "发现常见的安全漏洞"
    zh-TW: "找出常見的資安漏洞"
    ja: "よくあるセキュリティの弱点を見つける"
    ko: "흔한 보안 취약점 찾기"
    vi: "Phát hiện lỗ hổng bảo mật thường gặp"
    ms: "Kenal pasti kelemahan keselamatan biasa"
    id: "Menemukan celah keamanan umum"
    hi: "आम सिक्योरिटी कमज़ोरियाँ पहचानना"
