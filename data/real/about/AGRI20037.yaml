code: AGRI20037
year: 2026
learn:
  en: "How field crops are grown in southern Australia, from yield and climate limits to water, soil and costs."
  zh: "南澳大利亚大田作物的种植：产量、气候限制、水土与成本。"
  zh-TW: "南澳大田作物的種植：產量、氣候限制、水土與成本。"
  ja: "南オーストラリアの畑作：収量、気候制約、水・土壌管理とコスト。"
  ko: "남부 호주의 밭작물 재배: 수량, 기후 제약, 물·토양 관리와 비용."
  vi: "Trồng cây lương thực ở miền nam nước Úc: năng suất, giới hạn khí hậu, nước, đất và chi phí."
  ms: "Penanaman tanaman ladang di selatan Australia: hasil, had iklim, air, tanah dan kos."
  id: "Budidaya tanaman pangan di Australia selatan: hasil, batas iklim, air, tanah, dan biaya."
  hi: "दक्षिणी ऑस्ट्रेलिया में खेत की फसलें: उपज, जलवायु सीमाएँ, पानी, मिट्टी और लागत।"
outcomes:
  - en: "Measure crop yield and its components"
    zh: "测量作物产量及其构成"
    zh-TW: "測量作物產量及其構成"
    ja: "収量と収量構成要素を測る"
    ko: "수량과 수량 구성요소 측정하기"
    vi: "Đo năng suất và các thành phần năng suất"
    ms: "Ukur hasil tanaman dan komponennya"
    id: "Mengukur hasil panen dan komponennya"
    hi: "फसल उपज और उसके घटक मापें"
  - en: "Plan water, nutrient and rotation management"
    zh: "规划水肥管理与轮作"
    zh-TW: "規劃水肥管理與輪作"
    ja: "水・養分管理と輪作を計画する"
    ko: "물·양분 관리와 윤작 계획하기"
    vi: "Lập kế hoạch quản lý nước, phân bón và luân canh"
    ms: "Rancang pengurusan air, nutrien dan giliran tanaman"
    id: "Merencanakan pengelolaan air, hara, dan rotasi"
    hi: "पानी, पोषक तत्व और फसल चक्र की योजना बनाएँ"
  - en: "Compare costs and returns of cropping systems"
    zh: "比较不同种植系统的成本与收益"
    zh-TW: "比較不同種植系統的成本與收益"
    ja: "作付体系のコストと収益を比べる"
    ko: "작부 체계의 비용과 수익 비교하기"
    vi: "So sánh chi phí và lợi nhuận các hệ thống trồng"
    ms: "Bandingkan kos dan pulangan sistem tanaman"
    id: "Membandingkan biaya dan hasil sistem tanam"
    hi: "खेती प्रणालियों की लागत और लाभ की तुलना करें"
