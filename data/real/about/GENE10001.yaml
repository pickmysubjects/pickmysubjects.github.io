code: GENE10001
year: 2026
learn:
  en: "Basic genetics and how news and social media report on it. No genetics background needed."
  zh: "基础遗传学，以及新闻和社交媒体怎么报道它。不需要基础。"
  zh-TW: "基礎遺傳學，以及新聞和社群媒體怎麼報導它。不需要先備知識。"
  ja: "遺伝学の基礎と、ニュースやSNSでの報じられ方。予備知識は不要。"
  ko: "기초 유전학과 뉴스·SNS가 이를 보도하는 방식. 유전학 배경 지식 불필요."
  vi: "Di truyền học cơ bản và cách báo chí, mạng xã hội đưa tin về nó. Không cần nền tảng."
  ms: "Genetik asas dan cara berita serta media sosial melaporkannya. Tiada latar genetik diperlukan."
  id: "Genetika dasar dan cara berita serta media sosial memberitakannya. Tidak perlu latar genetika."
  hi: "बेसिक जेनेटिक्स और न्यूज़ व सोशल मीडिया इसे कैसे रिपोर्ट करते हैं। पहले से जेनेटिक्स ज़रूरी नहीं।"
outcomes:
  - en: "Use basic genetics terms correctly"
    zh: "正确使用遗传学基本术语"
    zh-TW: "正確使用遺傳學基本術語"
    ja: "遺伝学の基本用語を正しく使う"
    ko: "유전학 기본 용어를 정확히 사용"
    vi: "Dùng đúng thuật ngữ di truyền cơ bản"
    ms: "Guna istilah asas genetik dengan betul"
    id: "Memakai istilah dasar genetika dengan benar"
    hi: "जेनेटिक्स के बेसिक शब्द सही इस्तेमाल करना"
  - en: "Check how accurate a genetics news story is"
    zh: "判断遗传学新闻准不准"
    zh-TW: "判斷遺傳學新聞準不準確"
    ja: "遺伝学ニュースの正確さを確かめる"
    ko: "유전학 뉴스의 정확성 확인"
    vi: "Kiểm tra độ chính xác của tin về di truyền"
    ms: "Semak ketepatan berita genetik"
    id: "Mengecek akurasi berita genetika"
    hi: "जेनेटिक्स की खबर कितनी सही है, जाँचना"
  - en: "Tell reliable sources from unreliable ones"
    zh: "分辨可靠和不可靠的信息源"
    zh-TW: "分辨可靠和不可靠的資訊來源"
    ja: "信頼できる情報源とそうでないものを見分ける"
    ko: "믿을 만한 출처와 아닌 출처 구별"
    vi: "Phân biệt nguồn tin đáng tin và không"
    ms: "Bezakan sumber boleh dipercayai dan tidak"
    id: "Membedakan sumber terpercaya dan tidak"
    hi: "भरोसेमंद और गैर-भरोसेमंद स्रोत पहचानना"
