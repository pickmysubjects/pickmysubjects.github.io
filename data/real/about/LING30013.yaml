code: LING30013
year: 2026
learn:
  en: "How words are built and formed across the world's languages, and how word structure links to syntax and sounds."
  zh: "世界语言中词如何构成和产生，以及词的结构如何与句法和语音相关。"
  zh-TW: "世界語言中詞如何構成和產生，以及詞的結構如何與句法和語音相關。"
  ja: "世界の言語で語がどう組み立てられ作られるか、語の構造が統語や音とどうつながるかを学ぶ。"
  ko: "세계 언어에서 단어가 어떻게 만들어지는지, 단어 구조가 통사·소리와 어떻게 연결되는지 배운다."
  vi: "Từ được cấu tạo và hình thành ra sao trong các ngôn ngữ thế giới, và cấu trúc từ liên quan đến cú pháp, âm thế nào."
  ms: "Cara perkataan dibina dan dibentuk dalam bahasa dunia, serta kaitan struktur kata dengan sintaksis dan bunyi."
  id: "Cara kata dibangun dan dibentuk di bahasa-bahasa dunia, serta kaitan struktur kata dengan sintaksis dan bunyi."
  hi: "दुनिया की भाषाओं में शब्द कैसे बनते और गढ़े जाते हैं, और शब्द संरचना वाक्यविन्यास व ध्वनि से कैसे जुड़ती है।"
outcomes:
  - en: "Analyse word structure using real language data"
    zh: "用真实语言数据分析词的结构"
    zh-TW: "用真實語言資料分析詞的結構"
    ja: "実際の言語データで語の構造を分析する"
    ko: "실제 언어 자료로 단어 구조 분석하기"
    vi: "Phân tích cấu trúc từ bằng dữ liệu ngôn ngữ thực"
    ms: "Analisis struktur kata dengan data bahasa sebenar"
    id: "Menganalisis struktur kata dengan data bahasa nyata"
    hi: "असली भाषा डेटा से शब्द संरचना का विश्लेषण करना"
  - en: "Compare theories of morphology"
    zh: "比较形态学的不同理论"
    zh-TW: "比較構詞學的不同理論"
    ja: "形態論の理論を比べる"
    ko: "형태론 이론 비교하기"
    vi: "So sánh các lý thuyết hình thái học"
    ms: "Bandingkan teori morfologi"
    id: "Membandingkan teori morfologi"
    hi: "रूपविज्ञान के सिद्धांतों की तुलना करना"
  - en: "Explain links between morphology, syntax and phonology"
    zh: "说明形态、句法和音系之间的联系"
    zh-TW: "說明構詞、句法和音韻之間的關聯"
    ja: "形態論・統語論・音韻論のつながりを説明する"
    ko: "형태론, 통사론, 음운론의 연결 설명하기"
    vi: "Giải thích mối liên hệ giữa hình thái, cú pháp và âm vị học"
    ms: "Terangkan kaitan morfologi, sintaksis dan fonologi"
    id: "Menjelaskan kaitan morfologi, sintaksis, dan fonologi"
    hi: "रूपविज्ञान, वाक्यविन्यास और स्वनिमविज्ञान के संबंध समझाना"
