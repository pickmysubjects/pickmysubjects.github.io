code: PHYC20015
year: 2026
learn:
  en: "Einstein's special relativity and electromagnetism with Maxwell's equations, and how they connect."
  zh: "狭义相对论和麦克斯韦方程组下的电磁学及其联系。"
  zh-TW: "狹義相對論和馬克士威方程組下的電磁學及其關聯。"
  ja: "特殊相対性理論とマクスウェル方程式の電磁気学、その結びつき。"
  ko: "특수상대성이론과 맥스웰 방정식의 전자기학, 그리고 둘의 연결."
  vi: "Thuyết tương đối hẹp và điện từ học với phương trình Maxwell, cùng mối liên hệ."
  ms: "Relativiti khas Einstein dan elektromagnet dengan persamaan Maxwell, serta kaitannya."
  id: "Relativitas khusus Einstein dan elektromagnetisme dengan persamaan Maxwell, serta kaitannya."
  hi: "आइंस्टीन की स्पेशल रिलेटिविटी और मैक्सवेल समीकरणों वाला इलेक्ट्रोमैग्नेटिज़्म, और उनका जुड़ाव।"
outcomes:
  - en: "Explain special relativity and its key ideas"
    zh: "解释狭义相对论的核心概念"
    zh-TW: "解釋狹義相對論的核心概念"
    ja: "特殊相対論の要点を説明する"
    ko: "특수상대성이론의 핵심 설명하기"
    vi: "Giải thích ý chính thuyết tương đối hẹp"
    ms: "Menerangkan idea utama relativiti khas"
    id: "Menjelaskan ide utama relativitas khusus"
    hi: "स्पेशल रिलेटिविटी के मुख्य विचार समझाना"
  - en: "Solve simple electromagnetism problems"
    zh: "解决简单的电磁学问题"
    zh-TW: "解決簡單的電磁學問題"
    ja: "簡単な電磁気の問題を解く"
    ko: "간단한 전자기 문제 풀기"
    vi: "Giải bài toán điện từ đơn giản"
    ms: "Menyelesaikan masalah elektromagnet mudah"
    id: "Memecahkan soal elektromagnetisme sederhana"
    hi: "सरल इलेक्ट्रोमैग्नेटिज़्म सवाल हल करना"
