code: FNCE90056
year: 2027
learn:
  en: "Analysing shares and bonds: asset pricing, portfolio theory, equilibrium models and measuring fund performance."
  zh: "股票与债券分析：资产定价、投资组合理论、均衡模型和基金绩效评估。"
  zh-TW: "股票與債券分析：資產定價、投資組合理論、均衡模型與基金績效評估。"
  ja: "株式と債券の分析：資産価格、ポートフォリオ理論、均衡モデル、運用成績の評価。"
  ko: "주식과 채권 분석: 자산가격결정, 포트폴리오 이론, 균형모형, 펀드 성과평가."
  vi: "Phân tích cổ phiếu và trái phiếu: định giá tài sản, lý thuyết danh mục, mô hình cân bằng, đánh giá hiệu quả quỹ."
  ms: "Menganalisis saham dan bon: penentuan harga aset, teori portfolio, model keseimbangan dan prestasi dana."
  id: "Analisis saham dan obligasi: penetapan harga aset, teori portofolio, model keseimbangan, dan kinerja dana."
  hi: "शेयर और बॉन्ड विश्लेषण: एसेट प्राइसिंग, पोर्टफ़ोलियो सिद्धांत, संतुलन मॉडल और फ़ंड प्रदर्शन मापना।"
outcomes:
  - en: "Apply portfolio theory to investment decisions"
    zh: "将投资组合理论用于投资决策"
    zh-TW: "將投資組合理論用於投資決策"
    ja: "ポートフォリオ理論を投資判断に使う"
    ko: "포트폴리오 이론을 투자 결정에 적용하기"
    vi: "Áp dụng lý thuyết danh mục cho quyết định đầu tư"
    ms: "Menggunakan teori portfolio dalam keputusan pelaburan"
    id: "Menerapkan teori portofolio pada keputusan investasi"
    hi: "निवेश निर्णयों में पोर्टफ़ोलियो सिद्धांत लागू करना"
  - en: "Price and analyse bonds and shares"
    zh: "为债券和股票定价并分析"
    zh-TW: "為債券與股票定價並分析"
    ja: "債券と株式の価格を求め分析する"
    ko: "채권과 주식 가격 산정 및 분석하기"
    vi: "Định giá và phân tích trái phiếu, cổ phiếu"
    ms: "Menentukan harga dan menganalisis bon serta saham"
    id: "Menghitung harga dan menganalisis obligasi serta saham"
    hi: "बॉन्ड और शेयरों का मूल्य निकालना व विश्लेषण"
