code: PHIL20041
year: 2026
learn:
  en: "Classic texts of phenomenology and existentialism by Husserl, Heidegger, Sartre and Merleau-Ponty on freedom, others and the body."
  zh: "胡塞尔、海德格尔、萨特和梅洛-庞蒂关于自由、他人和身体的现象学与存在主义经典。"
  zh-TW: "胡塞爾、海德格、沙特和梅洛-龐蒂關於自由、他人和身體的現象學與存在主義經典。"
  ja: "フッサール、ハイデガー、サルトル、メルロ＝ポンティの現象学・実存主義の古典で自由・他者・身体を考える。"
  ko: "후설, 하이데거, 사르트르, 메를로퐁티의 현상학·실존주의 고전으로 자유·타자·몸을 다룬다."
  vi: "Các văn bản kinh điển của hiện tượng học và chủ nghĩa hiện sinh của Husserl, Heidegger, Sartre, Merleau-Ponty về tự do, tha nhân và thân thể."
  ms: "Teks klasik fenomenologi dan eksistensialisme oleh Husserl, Heidegger, Sartre dan Merleau-Ponty tentang kebebasan, orang lain dan tubuh."
  id: "Teks klasik fenomenologi dan eksistensialisme karya Husserl, Heidegger, Sartre dan Merleau-Ponty tentang kebebasan, sesama dan tubuh."
  hi: "हुसर्ल, हाइडेगर, सार्त्र और मर्लो-पोंटी के फ़िनॉमिनोलॉजी और अस्तित्ववाद के क्लासिक पाठ, आज़ादी, दूसरों और शरीर पर।"
outcomes:
  - en: "Explain core ideas of phenomenology"
    zh: "说明现象学的核心观念"
    zh-TW: "說明現象學的核心觀念"
    ja: "現象学の中心的な考えを説明する"
    ko: "현상학의 핵심 개념 설명하기"
    vi: "Giải thích ý tưởng cốt lõi của hiện tượng học"
    ms: "Terangkan idea teras fenomenologi"
    id: "Menjelaskan gagasan inti fenomenologi"
    hi: "फ़िनॉमिनोलॉजी के मूल विचार समझाना"
  - en: "Interpret difficult philosophical texts closely"
    zh: "细致解读艰深的哲学文本"
    zh-TW: "細緻解讀艱深的哲學文本"
    ja: "難解な哲学書を丁寧に読み解く"
    ko: "어려운 철학 텍스트 꼼꼼히 해석하기"
    vi: "Diễn giải kỹ những văn bản triết học khó"
    ms: "Tafsir teks falsafah sukar dengan teliti"
    id: "Menafsirkan teks filsafat yang sulit dengan cermat"
    hi: "कठिन दार्शनिक पाठों की बारीकी से व्याख्या करना"
  - en: "Assess views on freedom and authenticity"
    zh: "评估关于自由与本真性的观点"
    zh-TW: "評估關於自由與本真性的觀點"
    ja: "自由と本来性についての見方を評価する"
    ko: "자유와 진정성에 관한 견해 평가하기"
    vi: "Đánh giá quan điểm về tự do và tính chân thực"
    ms: "Nilai pandangan tentang kebebasan dan keaslian"
    id: "Menilai pandangan tentang kebebasan dan autentisitas"
    hi: "आज़ादी और प्रामाणिकता पर विचारों को परखना"
