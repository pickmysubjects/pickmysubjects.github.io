code: AGRI30011
year: 2026
learn:
  en: "How new ideas spread through farming communities, and how to design extension that helps them take hold. A July intensive."
  zh: "新想法如何在农业社区传播，以及怎样设计推广工作让它落地。七月密集课。"
  zh-TW: "新想法如何在農業社群傳播，以及怎樣設計推廣工作讓它落地。七月密集課。"
  ja: "新しい考えが農業コミュニティにどう広まるか、普及活動をどう設計するか。7月集中講義。"
  ko: "새 아이디어가 농업 공동체에 퍼지는 방식과 보급 활동 설계. 7월 집중 과정."
  vi: "Ý tưởng mới lan trong cộng đồng nông nghiệp ra sao và cách thiết kế khuyến nông. Học tháng 7."
  ms: "Cara idea baharu tersebar dalam komuniti pertanian dan reka pengembangan. Intensif Julai."
  id: "Cara ide baru menyebar di komunitas tani dan merancang penyuluhan. Intensif Juli."
  hi: "नए विचार कृषि समुदायों में कैसे फैलते हैं और विस्तार कार्य कैसे बनाएँ। जुलाई इंटेंसिव।"
outcomes:
  - en: "Explain theories of innovation adoption"
    zh: "说明创新采纳的理论"
    zh-TW: "說明創新採用的理論"
    ja: "イノベーション普及の理論を説明する"
    ko: "혁신 채택 이론 설명하기"
    vi: "Giải thích lý thuyết áp dụng đổi mới"
    ms: "Jelaskan teori penerimaan inovasi"
    id: "Menjelaskan teori adopsi inovasi"
    hi: "नवाचार अपनाने के सिद्धांत समझाना"
  - en: "Design an extension program for a farm issue"
    zh: "为农业问题设计推广方案"
    zh-TW: "為農業問題設計推廣方案"
    ja: "農業課題の普及プログラムを設計する"
    ko: "농업 문제의 보급 프로그램 설계하기"
    vi: "Thiết kế chương trình khuyến nông"
    ms: "Reka program pengembangan pertanian"
    id: "Merancang program penyuluhan"
    hi: "कृषि समस्या के लिए विस्तार कार्यक्रम बनाना"
  - en: "Present ideas as a team"
    zh: "以小组形式展示方案"
    zh-TW: "以小組形式發表方案"
    ja: "チームで案を発表する"
    ko: "팀으로 아이디어 발표하기"
    vi: "Trình bày ý tưởng theo nhóm"
    ms: "Bentang idea secara berkumpulan"
    id: "Mempresentasikan ide dalam tim"
    hi: "टीम में विचार प्रस्तुत करना"
