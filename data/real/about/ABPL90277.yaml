code: ABPL90277
year: 2027
learn:
  en: "How built environment professionals deliver schools, shelter, water and infrastructure after disasters and conflict."
  zh: "建成环境专业人员如何在灾后和冲突后提供学校、住所、供水和基础设施。"
  zh-TW: "建成環境專業人員如何在災後與衝突後提供學校、住所、供水與基礎設施。"
  ja: "災害・紛争後に学校・住まい・水・インフラを届ける建築専門職の役割。"
  ko: "재난·분쟁 후 학교·주거·물·기반시설을 제공하는 건축 전문가의 역할."
  vi: "Vai trò người làm xây dựng trong cung cấp trường học, nơi ở, nước sau thiên tai và xung đột."
  ms: "Peranan profesional alam bina menyediakan sekolah, tempat tinggal dan air selepas bencana dan konflik."
  id: "Peran profesional lingkungan binaan menyediakan sekolah, hunian dan air setelah bencana dan konflik."
  hi: "आपदा और संघर्ष के बाद स्कूल, आश्रय, पानी और ढाँचा बनाने में निर्माण पेशेवरों की भूमिका।"
outcomes:
  - en: "Explain how the humanitarian sector delivers built facilities"
    zh: "说明人道主义领域如何交付建筑设施"
    zh-TW: "說明人道領域如何交付建築設施"
    ja: "人道支援での施設整備の仕組みを説明する"
    ko: "인도주의 분야의 시설 공급 방식 설명하기"
    vi: "Giải thích cách ngành nhân đạo xây dựng cơ sở"
    ms: "Menerangkan cara sektor kemanusiaan membina kemudahan"
    id: "Menjelaskan cara sektor kemanusiaan membangun fasilitas"
    hi: "मानवीय क्षेत्र में सुविधाएँ कैसे बनती हैं, समझाना"
  - en: "Plan for community participation and resilience"
    zh: "为社区参与和韧性做规划"
    zh-TW: "為社區參與和韌性做規劃"
    ja: "住民参加とレジリエンスを計画する"
    ko: "지역사회 참여와 회복력 계획하기"
    vi: "Lập kế hoạch cho sự tham gia và phục hồi cộng đồng"
    ms: "Merancang penyertaan dan daya tahan komuniti"
    id: "Merencanakan partisipasi dan ketahanan komunitas"
    hi: "सामुदायिक भागीदारी और लचीलापन की योजना"
