code: ABPL90147
year: 2027
learn:
  en: "A seminar on emerging trends in design and architecture, including design with plants, animals, algorithms and living labs."
  zh: "关于设计和建筑新趋势的研讨课，包括与植物、动物、算法共同设计和生活实验室。"
  zh-TW: "關於設計與建築新趨勢的研討課，包括與植物、動物、演算法共同設計與生活實驗室。"
  ja: "デザインと建築の新潮流を扱うゼミ。植物・動物・アルゴリズムとの協働やリビングラボ。"
  ko: "디자인·건축 신흐름 세미나. 식물·동물·알고리즘과 함께하는 설계, 리빙랩."
  vi: "Hội thảo về xu hướng mới trong thiết kế, kiến trúc: thiết kế cùng cây, động vật, thuật toán."
  ms: "Seminar tentang trend baharu reka bentuk dan seni bina, termasuk reka bentuk bersama algoritma."
  id: "Seminar tentang tren baru desain dan arsitektur, termasuk desain bersama algoritma."
  hi: "डिज़ाइन और वास्तुकला के नए रुझानों पर सेमिनार, पौधों, जीवों व एल्गोरिदम के साथ डिज़ाइन।"
outcomes:
  - en: "Identify emerging trends that will shape design"
    zh: "找出将影响设计的新趋势"
    zh-TW: "找出將影響設計的新趨勢"
    ja: "デザインを変える新潮流を見つける"
    ko: "디자인을 바꿀 새 흐름 찾기"
    vi: "Nhận diện xu hướng sẽ định hình thiết kế"
    ms: "Mengenal pasti trend yang akan membentuk reka bentuk"
    id: "Mengenali tren yang akan membentuk desain"
    hi: "डिज़ाइन को आकार देने वाले नए रुझान पहचानना"
  - en: "Develop a research essay from proposal to final"
    zh: "从选题到终稿完成一篇研究论文"
    zh-TW: "從選題到定稿完成一篇研究論文"
    ja: "提案から最終稿まで論文を仕上げる"
    ko: "제안부터 최종본까지 에세이 완성하기"
    vi: "Phát triển tiểu luận từ đề xuất đến bản cuối"
    ms: "Membangun esei dari cadangan hingga akhir"
    id: "Mengembangkan esai dari usulan hingga final"
    hi: "प्रस्ताव से अंतिम रूप तक शोध निबंध लिखना"
