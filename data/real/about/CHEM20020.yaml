code: CHEM20020
year: 2026
learn:
  en: "How a molecule's shape, symmetry and electrons explain its properties, and how spectroscopy measures them."
  zh: "分子的形状、对称性和电子怎样决定性质，以及怎样用光谱测量。"
  zh-TW: "分子的形狀、對稱性和電子如何決定性質，以及如何用光譜測量。"
  ja: "分子の形・対称性・電子が性質をどう説明するか、分光法でどう測るか。"
  ko: "분자의 모양, 대칭, 전자가 성질을 어떻게 설명하는지, 분광학으로 어떻게 측정하는지."
  vi: "Hình dạng, tính đối xứng và electron của phân tử giải thích tính chất ra sao, và quang phổ đo chúng thế nào."
  ms: "Cara bentuk, simetri dan elektron molekul menerangkan sifatnya, dan cara spektroskopi mengukurnya."
  id: "Cara bentuk, simetri, dan elektron molekul menjelaskan sifatnya, dan cara spektroskopi mengukurnya."
  hi: "अणु का आकार, समरूपता और इलेक्ट्रॉन उसके गुण कैसे समझाते हैं, और स्पेक्ट्रोस्कोपी इन्हें कैसे मापती है।"
outcomes:
  - en: "Classify molecules by their symmetry"
    zh: "按对称性给分子分类"
    zh-TW: "按對稱性為分子分類"
    ja: "対称性で分子を分類する"
    ko: "대칭성으로 분자 분류하기"
    vi: "Phân loại phân tử theo tính đối xứng"
    ms: "Kelaskan molekul mengikut simetri"
    id: "Mengklasifikasi molekul menurut simetrinya"
    hi: "समरूपता के आधार पर अणुओं का वर्गीकरण"
  - en: "Apply molecular orbital theory to simple molecules"
    zh: "用分子轨道理论分析简单分子"
    zh-TW: "用分子軌域理論分析簡單分子"
    ja: "分子軌道理論を簡単な分子に応用する"
    ko: "분자 오비탈 이론을 간단한 분자에 적용하기"
    vi: "Áp dụng thuyết orbital phân tử cho phân tử đơn giản"
    ms: "Guna teori orbital molekul pada molekul ringkas"
    id: "Menerapkan teori orbital molekul pada molekul sederhana"
    hi: "सरल अणुओं पर मॉलिक्यूलर ऑर्बिटल थ्योरी लागू करना"
  - en: "Explain how common spectroscopy methods work"
    zh: "解释常用光谱方法的原理"
    zh-TW: "解釋常用光譜方法的原理"
    ja: "一般的な分光法の仕組みを説明する"
    ko: "일반적인 분광법의 원리 설명하기"
    vi: "Giải thích các phương pháp quang phổ thông dụng"
    ms: "Terangkan cara kaedah spektroskopi biasa berfungsi"
    id: "Menjelaskan cara kerja metode spektroskopi umum"
    hi: "आम स्पेक्ट्रोस्कोपी तरीके कैसे काम करते हैं, समझाना"
