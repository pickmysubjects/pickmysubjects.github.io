code: GEND30003
year: 2026
learn:
  en: "How feminist and queer theory is put into practice in movements, culture and politics, drawing together skills from the major."
  zh: "女性主义和酷儿理论如何在运动、文化和政治中付诸实践，整合专业所学技能。"
  zh-TW: "女性主義和酷兒理論如何在運動、文化和政治中付諸實踐，整合主修所學技能。"
  ja: "フェミニズムとクィア理論が運動・文化・政治でどう実践されるかを学び、専攻で身につけた力をまとめる。"
  ko: "페미니즘·퀴어 이론이 운동, 문화, 정치에서 어떻게 실천되는지 배우며 전공에서 익힌 역량을 종합한다."
  vi: "Lý thuyết nữ quyền và queer được thực hành ra sao trong phong trào, văn hóa và chính trị, tổng hợp kỹ năng của chuyên ngành."
  ms: "Cara teori feminis dan queer diamalkan dalam gerakan, budaya dan politik, menggabungkan kemahiran daripada major."
  id: "Cara teori feminis dan queer dipraktikkan dalam gerakan, budaya, dan politik, menyatukan keterampilan dari jurusan."
  hi: "नारीवादी और क्वीयर सिद्धांत आंदोलनों, संस्कृति और राजनीति में कैसे अमल में आता है, मेजर के कौशलों को जोड़ते हुए।"
outcomes:
  - en: "Link key concepts to lived experience"
    zh: "把核心概念与生活经验相联系"
    zh-TW: "把核心概念與生活經驗相聯繫"
    ja: "主要な概念を生活経験と結びつける"
    ko: "핵심 개념을 삶의 경험에 연결하기"
    vi: "Liên hệ khái niệm chính với trải nghiệm sống"
    ms: "Kaitkan konsep utama dengan pengalaman hidup"
    id: "Mengaitkan konsep utama dengan pengalaman hidup"
    hi: "मुख्य अवधारणाओं को जीवन के अनुभव से जोड़ना"
  - en: "Analyse how movements challenge power"
    zh: "分析社会运动如何挑战权力"
    zh-TW: "分析社會運動如何挑戰權力"
    ja: "運動が権力にどう挑むかを分析する"
    ko: "운동이 권력에 도전하는 방식 분석하기"
    vi: "Phân tích cách các phong trào thách thức quyền lực"
    ms: "Analisis cara gerakan mencabar kuasa"
    id: "Menganalisis cara gerakan menantang kekuasaan"
    hi: "आंदोलन सत्ता को कैसे चुनौती देते हैं, विश्लेषण करना"
  - en: "Complete a project that applies theory"
    zh: "完成一个应用理论的项目"
    zh-TW: "完成一個應用理論的專案"
    ja: "理論を応用したプロジェクトを仕上げる"
    ko: "이론을 적용한 프로젝트 완성하기"
    vi: "Hoàn thành một dự án áp dụng lý thuyết"
    ms: "Siapkan projek yang menggunakan teori"
    id: "Menyelesaikan proyek yang menerapkan teori"
    hi: "सिद्धांत लागू करने वाला एक प्रोजेक्ट पूरा करना"
