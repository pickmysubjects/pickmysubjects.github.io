code: SWEN90007
year: 2027
learn:
  en: "Software architecture for enterprise systems: architectural patterns, design strategies, evaluation and modelling."
  zh: "企业级系统的软件架构：架构模式、设计策略、评估与建模。"
  zh-TW: "企業級系統的軟體架構：架構模式、設計策略、評估與建模。"
  ja: "企業システムのソフトウェアアーキテクチャ：パターン、設計戦略、評価、モデリング。"
  ko: "엔터프라이즈 시스템의 소프트웨어 아키텍처: 아키텍처 패턴, 설계 전략, 평가, 모델링."
  vi: "Kiến trúc phần mềm cho hệ thống doanh nghiệp: mẫu kiến trúc, chiến lược thiết kế, đánh giá, mô hình hóa."
  ms: "Seni bina perisian untuk sistem perusahaan: corak seni bina, strategi reka bentuk, penilaian dan pemodelan."
  id: "Arsitektur perangkat lunak sistem perusahaan: pola arsitektur, strategi desain, evaluasi, pemodelan."
  hi: "एंटरप्राइज़ सिस्टम के लिए सॉफ़्टवेयर आर्किटेक्चर: पैटर्न, डिज़ाइन रणनीति, मूल्यांकन, मॉडलिंग।"
outcomes:
  - en: "Choose and apply architectural patterns for a system"
    zh: "为系统选择并应用架构模式"
    zh-TW: "為系統選擇並套用架構模式"
    ja: "システムに合うアーキテクチャパターンを選び使う"
    ko: "시스템에 맞는 아키텍처 패턴 선택·적용하기"
    vi: "Chọn và áp dụng mẫu kiến trúc cho hệ thống"
    ms: "Memilih dan menggunakan corak seni bina untuk sistem"
    id: "Memilih dan menerapkan pola arsitektur untuk sistem"
    hi: "किसी सिस्टम के लिए आर्किटेक्चर पैटर्न चुनना और लागू करना"
  - en: "Evaluate a design against performance and other quality needs"
    zh: "按性能等质量要求评估一个设计"
    zh-TW: "依效能等品質需求評估一個設計"
    ja: "性能などの品質要件で設計を評価する"
    ko: "성능 등 품질 요구로 설계 평가하기"
    vi: "Đánh giá thiết kế theo hiệu năng và yêu cầu chất lượng"
    ms: "Menilai reka bentuk dari segi prestasi dan kualiti lain"
    id: "Mengevaluasi desain terhadap kinerja dan kebutuhan kualitas"
    hi: "प्रदर्शन और अन्य गुणवत्ता ज़रूरतों पर डिज़ाइन परखना"
