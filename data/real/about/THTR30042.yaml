code: THTR30042
year: 2026
learn:
  en: "Design, build and launch your own portfolio website, with branding, web design and some digital marketing."
  zh: "设计、搭建并上线个人作品集网站，涉及品牌、网页设计和数字营销。"
  zh-TW: "設計、架設並上線個人作品集網站，涵蓋品牌、網頁設計與數位行銷。"
  ja: "自分のポートフォリオサイトを設計・制作・公開する。ブランディング、ウェブデザイン、デジタルマーケティング。"
  ko: "개인 포트폴리오 웹사이트를 설계·제작·공개한다. 브랜딩, 웹디자인, 디지털 마케팅 포함."
  vi: "Thiết kế, xây dựng và ra mắt website portfolio của bạn, kèm thương hiệu, thiết kế web và marketing số."
  ms: "Reka, bina dan lancar laman web portfolio sendiri, dengan penjenamaan, reka bentuk web dan pemasaran digital."
  id: "Mendesain, membangun, dan meluncurkan situs portofolio sendiri, dengan branding, desain web, dan pemasaran digital."
  hi: "अपनी पोर्टफ़ोलियो वेबसाइट डिज़ाइन करना, बनाना और लॉन्च करना, ब्रांडिंग, वेब डिज़ाइन और डिजिटल मार्केटिंग सहित।"
outcomes:
  - en: "Plan the structure and content of a portfolio site"
    zh: "规划作品集网站的结构和内容"
    zh-TW: "規劃作品集網站的架構與內容"
    ja: "ポートフォリオサイトの構成と内容を計画する"
    ko: "포트폴리오 사이트의 구조와 내용 기획하기"
    vi: "Lên cấu trúc và nội dung website portfolio"
    ms: "Rancang struktur dan kandungan laman portfolio"
    id: "Merancang struktur dan isi situs portofolio"
    hi: "पोर्टफ़ोलियो साइट की संरचना और सामग्री तय करना"
  - en: "Build a consistent visual identity online"
    zh: "在网上打造统一的视觉形象"
    zh-TW: "在網路上打造一致的視覺形象"
    ja: "オンラインで一貫したビジュアルを作る"
    ko: "온라인에서 일관된 비주얼 아이덴티티 만들기"
    vi: "Tạo nhận diện thị giác nhất quán trên mạng"
    ms: "Bina identiti visual yang konsisten dalam talian"
    id: "Membangun identitas visual yang konsisten daring"
    hi: "ऑनलाइन एक जैसी विज़ुअल पहचान बनाना"
  - en: "Launch a live site and promote your work"
    zh: "上线网站并推广自己的作品"
    zh-TW: "讓網站上線並推廣自己的作品"
    ja: "サイトを公開し作品を発信する"
    ko: "사이트를 공개하고 작품 홍보하기"
    vi: "Đưa website lên mạng và quảng bá tác phẩm"
    ms: "Lancar laman dan promosikan karya anda"
    id: "Meluncurkan situs dan mempromosikan karya"
    hi: "लाइव साइट लॉन्च कर अपना काम प्रचारित करना"
