code: GEOG30025
year: 2026
learn:
  en: "How fire controls vegetation patterns worldwide, with field experiments on a 7-day trip to Tasmania."
  zh: "火如何控制全球植被格局，含7天塔斯马尼亚野外实验。"
  zh-TW: "火如何控制全球植被格局，含7天塔斯馬尼亞野外實驗。"
  ja: "火が世界の植生分布をどう左右するか。タスマニア7日間の野外実験あり。"
  ko: "불이 전 세계 식생 분포를 좌우하는 방식, 태즈메이니아 7일 현장실험 포함."
  vi: "Lửa chi phối phân bố thảm thực vật toàn cầu ra sao, có thí nghiệm thực địa 7 ngày ở Tasmania."
  ms: "Cara api mengawal taburan tumbuhan dunia, dengan eksperimen lapangan 7 hari di Tasmania."
  id: "Cara api mengendalikan sebaran vegetasi dunia, dengan eksperimen lapangan 7 hari di Tasmania."
  hi: "आग दुनिया भर में वनस्पति वितरण को कैसे नियंत्रित करती है, तस्मानिया में 7 दिन के फ़ील्ड प्रयोगों के साथ।"
outcomes:
  - en: "Test ecological hypotheses with field experiments"
    zh: "用野外实验检验生态假设"
    zh-TW: "用野外實驗檢驗生態假設"
    ja: "野外実験で生態学の仮説を検証する"
    ko: "현장 실험으로 생태 가설 검증하기"
    vi: "Kiểm định giả thuyết sinh thái bằng thí nghiệm thực địa"
    ms: "Uji hipotesis ekologi dengan eksperimen lapangan"
    id: "Menguji hipotesis ekologi lewat eksperimen lapangan"
    hi: "फ़ील्ड प्रयोगों से पारिस्थितिक परिकल्पनाएँ जाँचना"
  - en: "Identify fire-adapted traits in plants and animals"
    zh: "识别动植物的适火特征"
    zh-TW: "辨識動植物的適火特徵"
    ja: "動植物の火への適応形質を見分ける"
    ko: "동식물의 불 적응 형질 파악하기"
    vi: "Nhận diện đặc điểm thích nghi lửa ở sinh vật"
    ms: "Kenal pasti ciri adaptasi api pada flora dan fauna"
    id: "Mengenali sifat adaptasi api pada flora dan fauna"
    hi: "पौधों-जानवरों में आग-अनुकूल गुण पहचानना"
