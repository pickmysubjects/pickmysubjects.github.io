code: FRST20015
year: 2026
learn:
  en: "How fire shaped Australian life, how people use it, and what climate change means for future fires."
  zh: "火如何塑造澳洲生物、人类如何用火，以及气候变化下的未来火情。"
  zh-TW: "火如何塑造澳洲生物、人類如何用火，以及氣候變遷下的未來火情。"
  ja: "火がオーストラリアの生き物をどう形作り、人がどう火を使い、気候変動で今後どうなるか。"
  ko: "불이 호주 생물을 어떻게 만들었는지, 사람이 불을 어떻게 쓰는지, 기후변화 속 미래 산불."
  vi: "Lửa đã định hình sự sống ở Úc ra sao, con người dùng lửa thế nào và cháy rừng tương lai khi khí hậu đổi."
  ms: "Cara api membentuk hidupan Australia, cara manusia guna api, dan kebakaran masa depan akibat iklim berubah."
  id: "Cara api membentuk kehidupan Australia, cara manusia memakai api, dan kebakaran masa depan akibat iklim."
  hi: "आग ने ऑस्ट्रेलिया के जीवन को कैसे बनाया, लोग आग का उपयोग कैसे करते हैं, और जलवायु परिवर्तन में भविष्य की आग।"
outcomes:
  - en: "Explain combustion and what drives fire behaviour"
    zh: "解释燃烧过程和火行为成因"
    zh-TW: "解釋燃燒過程與火行為成因"
    ja: "燃焼と火の挙動の要因を説明する"
    ko: "연소와 불의 거동 요인을 설명하기"
    vi: "Giải thích sự cháy và yếu tố quyết định đám cháy"
    ms: "Terangkan pembakaran dan faktor tingkah laku api"
    id: "Menjelaskan pembakaran dan perilaku api"
    hi: "दहन और आग के व्यवहार के कारण समझाना"
  - en: "Analyse how fire shapes plant and animal ecology"
    zh: "分析火对动植物生态的影响"
    zh-TW: "分析火對動植物生態的影響"
    ja: "火が動植物の生態に与える影響を分析する"
    ko: "불이 동식물 생태에 주는 영향 분석하기"
    vi: "Phân tích tác động của lửa lên sinh thái động thực vật"
    ms: "Analisis kesan api terhadap ekologi flora dan fauna"
    id: "Menganalisis pengaruh api pada ekologi flora dan fauna"
    hi: "आग का पौधों और जानवरों की पारिस्थितिकी पर असर विश्लेषित करना"
  - en: "Evaluate ways to live safely and sustainably with fire"
    zh: "评估与火安全、可持续共处的方法"
    zh-TW: "評估與火安全、永續共處的方法"
    ja: "火と安全・持続的に共存する方法を評価する"
    ko: "불과 안전하고 지속가능하게 사는 방법 평가하기"
    vi: "Đánh giá cách sống an toàn, bền vững với lửa"
    ms: "Nilai cara hidup selamat dan lestari dengan api"
    id: "Menilai cara hidup aman dan berkelanjutan dengan api"
    hi: "आग के साथ सुरक्षित और टिकाऊ जीवन के उपाय आंकना"
