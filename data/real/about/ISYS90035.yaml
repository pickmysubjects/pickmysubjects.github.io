code: ISYS90035
year: 2027
learn:
  en: "How organisations use IT, from collaboration tools to data warehouses and BI, to manage and share knowledge."
  zh: "组织如何利用信息技术（协作工具、数据仓库、商业智能等）管理和共享知识。"
  zh-TW: "組織如何運用資訊科技（協作工具、資料倉儲、商業智慧等）管理與分享知識。"
  ja: "組織が協働ツールやDWH、BIなどのITで知識を管理・共有する方法。"
  ko: "조직이 협업 도구·데이터 웨어하우스·BI 등 IT로 지식을 관리·공유하는 방법."
  vi: "Tổ chức dùng CNTT như công cụ cộng tác, kho dữ liệu, BI để quản lý và chia sẻ tri thức."
  ms: "Cara organisasi guna IT seperti alat kolaborasi, gudang data dan BI untuk urus dan kongsi pengetahuan."
  id: "Cara organisasi memakai TI seperti alat kolaborasi, gudang data, BI untuk mengelola pengetahuan."
  hi: "संगठन कोलैबोरेशन टूल, डेटा वेयरहाउस, BI जैसी IT से ज्ञान कैसे संभालते और बाँटते हैं।"
outcomes:
  - en: "Judge which technologies suit a knowledge management goal"
    zh: "判断哪些技术适合知识管理目标"
    zh-TW: "判斷哪些技術適合知識管理目標"
    ja: "知識管理の目的に合う技術を選ぶ"
    ko: "지식 관리 목표에 맞는 기술 판단하기"
    vi: "Đánh giá công nghệ nào hợp với mục tiêu quản lý tri thức"
    ms: "Menilai teknologi yang sesuai untuk matlamat pengurusan pengetahuan"
    id: "Menilai teknologi yang cocok untuk tujuan manajemen pengetahuan"
    hi: "ज्ञान प्रबंधन के लक्ष्य के लिए सही तकनीक चुनना"
  - en: "Explain how IT projects affect organisational knowledge"
    zh: "说明IT项目如何影响组织知识"
    zh-TW: "說明IT專案如何影響組織知識"
    ja: "IT施策が組織の知識に与える影響を説明する"
    ko: "IT 사업이 조직 지식에 주는 영향 설명하기"
    vi: "Giải thích dự án CNTT ảnh hưởng tri thức tổ chức ra sao"
    ms: "Menerangkan kesan projek IT terhadap pengetahuan organisasi"
    id: "Menjelaskan dampak proyek TI pada pengetahuan organisasi"
    hi: "IT प्रोजेक्ट संगठन के ज्ञान पर कैसे असर डालते हैं, समझाना"
