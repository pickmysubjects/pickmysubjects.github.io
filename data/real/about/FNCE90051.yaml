  vi: "Quy trình đầu tư, lý thuyết danh mục hiện đại, CAPM, định giá cổ phiếu, lãi suất, dùng phần mềm đầu tư."
  ms: "Proses pelaburan, teori portfolio moden, CAPM, penilaian ekuiti dan kadar faedah, dengan perisian pelaburan."
