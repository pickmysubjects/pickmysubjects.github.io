code: MCEN30020
year: 2026
learn:
  en: "Modelling electrical, mechanical and thermal systems as differential equations and analysing them with transforms."
  zh: "用微分方程建模电、机械、热系统，并用变换分析。"
  zh-TW: "用微分方程建模電、機械、熱系統，並以轉換分析。"
  ja: "電気・機械・熱システムを微分方程式でモデル化し、変換で解析する。"
  ko: "전기·기계·열 시스템을 미분방정식으로 모델링하고 변환으로 분석하기."
  vi: "Mô hình hóa hệ điện, cơ, nhiệt bằng phương trình vi phân và phân tích bằng phép biến đổi."
  ms: "Memodelkan sistem elektrik, mekanikal dan haba dengan persamaan pembezaan dan jelmaan."
  id: "Memodelkan sistem listrik, mekanik, dan termal dengan persamaan diferensial dan transformasi."
  hi: "इलेक्ट्रिकल, मैकेनिकल और थर्मल सिस्टम को डिफ़रेंशियल इक्वेशन से मॉडल कर ट्रांसफ़ॉर्म से जाँचना।"
outcomes:
  - en: "Model and analyse systems in time and frequency"
    zh: "在时域和频域建模分析系统"
    zh-TW: "在時域和頻域建模分析系統"
    ja: "時間・周波数領域でシステムを解析する"
    ko: "시간·주파수 영역에서 시스템 분석하기"
    vi: "Mô hình hóa hệ thống theo thời gian và tần số"
    ms: "Memodel sistem dalam domain masa dan frekuensi"
    id: "Memodelkan sistem di domain waktu dan frekuensi"
    hi: "टाइम और फ़्रीक्वेंसी में सिस्टम मॉडल करना"
  - en: "Use MATLAB to study signals and systems"
    zh: "用MATLAB研究信号与系统"
    zh-TW: "用MATLAB研究訊號與系統"
    ja: "MATLABで信号とシステムを調べる"
    ko: "MATLAB으로 신호와 시스템 다루기"
    vi: "Dùng MATLAB nghiên cứu tín hiệu và hệ thống"
    ms: "Guna MATLAB untuk mengkaji isyarat dan sistem"
    id: "Memakai MATLAB untuk sinyal dan sistem"
    hi: "MATLAB से सिग्नल और सिस्टम समझना"
