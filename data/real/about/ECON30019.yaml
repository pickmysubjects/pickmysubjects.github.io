code: ECON30019
year: 2026
learn:
  en: "Where real behaviour breaks standard rationality, such as present bias, and the models built to capture it."
  zh: "真实行为如何偏离理性假设（如现时偏好），以及相应模型。"
  zh-TW: "真實行為如何偏離理性假設（如現時偏誤），以及相應模型。"
  ja: "現在バイアスなど、合理性の仮定から外れる行動と、それを捉えるモデル。"
  ko: "현재 편향처럼 합리성 가정에서 벗어나는 행동과 이를 담는 모형."
  vi: "Những hành vi thực tế đi ngược giả định lý trí, như thiên lệch hiện tại, và các mô hình mô tả chúng."
  ms: "Tingkah laku sebenar yang melanggar andaian rasional, seperti bias masa kini, dan model untuknya."
  id: "Perilaku nyata yang menyimpang dari asumsi rasional, seperti bias masa kini, dan model untuk menangkapnya."
  hi: "असली व्यवहार जो तर्कसंगतता की धारणा तोड़ता है, जैसे प्रेज़ेंट बायस, और उसे पकड़ने वाले मॉडल।"
outcomes:
  - en: "Explain key behavioural findings vs standard assumptions"
    zh: "解释行为发现与标准假设的差别"
    zh-TW: "解釋行為發現與標準假設的差別"
    ja: "行動経済学の知見と標準的な仮定の違いを説明する"
    ko: "행동경제학 발견과 표준 가정의 차이 설명하기"
    vi: "Giải thích các phát hiện hành vi so với giả định chuẩn"
    ms: "Terangkan dapatan tingkah laku berbanding andaian standard"
    id: "Menjelaskan temuan perilaku dibanding asumsi standar"
    hi: "व्यवहार संबंधी नतीजों को मानक धारणाओं से तुलना कर समझाना"
  - en: "Work with formal behavioural models"
    zh: "运用正式的行为经济模型"
    zh-TW: "運用正式的行為經濟模型"
    ja: "行動経済学の数理モデルを扱う"
    ko: "행동경제학의 공식 모형 다루기"
    vi: "Làm việc với các mô hình hành vi chính thức"
    ms: "Guna model tingkah laku formal"
    id: "Bekerja dengan model perilaku formal"
    hi: "औपचारिक व्यवहार मॉडल के साथ काम करना"
  - en: "Judge what behavioural economics adds"
    zh: "评估行为经济学的贡献"
    zh-TW: "評估行為經濟學的貢獻"
    ja: "行動経済学の貢献を評価する"
    ko: "행동경제학의 기여 평가하기"
    vi: "Đánh giá đóng góp của kinh tế học hành vi"
    ms: "Nilai sumbangan ekonomi tingkah laku"
    id: "Menilai kontribusi ekonomi perilaku"
    hi: "बिहेवियरल इकोनॉमिक्स के योगदान का आकलन करना"
