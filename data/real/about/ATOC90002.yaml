code: ATOC90002
year: 2027
learn:
  en: "Climate science basics and IPCC reports, and how to explain them clearly, ending in a mock UN climate negotiation."
  zh: "气候科学基础和IPCC报告，以及如何清楚地解释它们，最后进行一场模拟联合国气候谈判。"
  zh-TW: "氣候科學基礎與IPCC報告，以及如何清楚解釋它們，最後進行一場模擬聯合國氣候談判。"
  ja: "気候科学の基礎とIPCC報告書、その分かりやすい伝え方。最後に国連気候交渉の模擬を行う。"
  ko: "기후과학 기초와 IPCC 보고서, 이를 쉽게 전달하는 법. 마지막에 모의 유엔 기후 협상."
  vi: "Cơ bản khoa học khí hậu, báo cáo IPCC và cách truyền đạt rõ ràng, kết thúc bằng đàm phán khí hậu mô phỏng."
  ms: "Asas sains iklim dan laporan IPCC serta cara menerangkannya, diakhiri rundingan iklim PBB olok-olok."
  id: "Dasar sains iklim dan laporan IPCC serta cara menjelaskannya, diakhiri simulasi negosiasi iklim PBB."
  hi: "जलवायु विज्ञान की मूल बातें, IPCC रिपोर्ट और उन्हें साफ़ समझाना, अंत में नकली UN जलवायु वार्ता।"
outcomes:
  - en: "Identify key parts and feedbacks of the climate system"
    zh: "识别气候系统的关键组成和反馈"
    zh-TW: "辨識氣候系統的關鍵組成與回饋"
    ja: "気候システムの主要要素とフィードバックを知る"
    ko: "기후 시스템의 핵심 요소와 되먹임 파악하기"
    vi: "Nhận diện thành phần và phản hồi của hệ khí hậu"
    ms: "Mengenal pasti komponen dan maklum balas sistem iklim"
    id: "Mengenali komponen dan umpan balik sistem iklim"
    hi: "जलवायु प्रणाली के घटक व फ़ीडबैक पहचानना"
  - en: "Communicate climate science to a broad audience"
    zh: "向大众清楚传达气候科学"
    zh-TW: "向大眾清楚傳達氣候科學"
    ja: "気候科学を幅広い人に伝える"
    ko: "기후과학을 대중에게 전달하기"
    vi: "Truyền đạt khoa học khí hậu cho công chúng"
    ms: "Menyampaikan sains iklim kepada umum"
    id: "Mengomunikasikan sains iklim ke publik"
    hi: "जलवायु विज्ञान को आम लोगों तक पहुंचाना"
