code: INDO10014
year: 2026
learn:
  en: "How Indonesia engages with the world through politics, culture, education and trade, from colonial times on. Taught in Indonesian."
  zh: "从殖民时期至今，印尼如何通过政治、文化、教育和贸易与世界互动。用印尼语授课。"
  zh-TW: "從殖民時期至今，印尼如何透過政治、文化、教育和貿易與世界互動。用印尼語授課。"
  ja: "植民地時代から現在まで、インドネシアが政治、文化、教育、貿易で世界とどう関わってきたか。授業はインドネシア語。"
  ko: "식민 시대부터 지금까지 인도네시아가 정치, 문화, 교육, 무역으로 세계와 어떻게 관계해 왔나. 인도네시아어 수업."
  vi: "Indonesia giao lưu với thế giới qua chính trị, văn hóa, giáo dục, thương mại ra sao, từ thời thuộc địa. Dạy bằng tiếng Indonesia."
  ms: "Cara Indonesia berhubung dengan dunia melalui politik, budaya, pendidikan dan perdagangan sejak era penjajahan. Diajar dalam bahasa Indonesia."
  id: "Cara Indonesia berinteraksi dengan dunia lewat politik, budaya, pendidikan dan perdagangan sejak masa kolonial. Diajarkan dalam bahasa Indonesia."
  hi: "औपनिवेशिक दौर से अब तक इंडोनेशिया राजनीति, संस्कृति, शिक्षा और व्यापार से दुनिया से कैसे जुड़ा। इंडोनेशियाई में पढ़ाया जाता है।"
outcomes:
  - en: "Explain the pull between nationalism and internationalism"
    zh: "解释民族主义与国际主义之间的张力"
    zh-TW: "解釋民族主義與國際主義之間的張力"
    ja: "民族主義と国際主義のせめぎ合いを説明する"
    ko: "민족주의와 국제주의 사이의 긴장 설명하기"
    vi: "Giải thích giằng co giữa chủ nghĩa dân tộc và quốc tế"
    ms: "Terangkan tarikan antara nasionalisme dan internasionalisme"
    id: "Menjelaskan tarik-menarik nasionalisme dan internasionalisme"
    hi: "राष्ट्रवाद और अंतरराष्ट्रीयतावाद के बीच खिंचाव समझाना"
  - en: "Analyse Indonesia's role on the world stage"
    zh: "分析印尼在国际舞台上的角色"
    zh-TW: "分析印尼在國際舞台上的角色"
    ja: "国際舞台でのインドネシアの役割を分析する"
    ko: "국제 무대에서 인도네시아의 역할 분석하기"
    vi: "Phân tích vai trò của Indonesia trên trường quốc tế"
    ms: "Analisis peranan Indonesia di pentas dunia"
    id: "Menganalisis peran Indonesia di panggung dunia"
    hi: "विश्व मंच पर इंडोनेशिया की भूमिका का विश्लेषण करना"
  - en: "Discuss global issues in Indonesian"
    zh: "用印尼语讨论全球议题"
    zh-TW: "用印尼語討論全球議題"
    ja: "世界の課題をインドネシア語で論じる"
    ko: "세계적 이슈를 인도네시아어로 토론하기"
    vi: "Thảo luận vấn đề toàn cầu bằng tiếng Indonesia"
    ms: "Bincangkan isu global dalam bahasa Indonesia"
    id: "Membahas isu global dalam bahasa Indonesia"
    hi: "इंडोनेशियाई में वैश्विक मुद्दों पर चर्चा करना"
