code: EURO10002
year: 2026
learn:
  en: "Europe seen through the Eurovision Song Contest: EU expansion, national branding, identity, language, gender and sexuality."
  zh: "借欧洲歌唱大赛认识欧洲：欧盟扩张、国家形象塑造、身份认同、语言、性别与性向。"
  zh-TW: "借歐洲歌唱大賽認識歐洲：歐盟擴張、國家形象塑造、身分認同、語言、性別與性向。"
  ja: "ユーロビジョン・ソング・コンテストから見るヨーロッパ。EU拡大、国家ブランド、アイデンティティ、言語、ジェンダー。"
  ko: "유로비전 송 콘테스트로 보는 유럽. EU 확대, 국가 브랜딩, 정체성, 언어, 젠더와 섹슈얼리티."
  vi: "Châu Âu qua cuộc thi Eurovision: mở rộng EU, xây dựng hình ảnh quốc gia, bản sắc, ngôn ngữ, giới và tính dục."
  ms: "Eropah melalui Eurovision Song Contest: perluasan EU, penjenamaan negara, identiti, bahasa, gender dan seksualiti."
  id: "Eropa lewat Eurovision Song Contest: perluasan UE, citra bangsa, identitas, bahasa, gender dan seksualitas."
  hi: "यूरोविज़न सॉन्ग कॉन्टेस्ट के ज़रिए यूरोप: EU का विस्तार, राष्ट्र की ब्रांडिंग, पहचान, भाषा, जेंडर और यौनिकता।"
outcomes:
  - en: "Use Eurovision to explain debates in Europe today"
    zh: "借欧洲歌唱大赛解释当今欧洲的争论"
    zh-TW: "借歐洲歌唱大賽解釋當今歐洲的爭論"
    ja: "ユーロビジョンを手がかりに今のヨーロッパの議論を説明する"
    ko: "유로비전으로 오늘날 유럽의 논쟁 설명하기"
    vi: "Dùng Eurovision giải thích tranh luận ở châu Âu hiện nay"
    ms: "Gunakan Eurovision untuk menerangkan perdebatan Eropah kini"
    id: "Memakai Eurovision untuk menjelaskan perdebatan Eropa kini"
    hi: "यूरोविज़न से आज के यूरोप की बहसें समझाना"
  - en: "Analyse how countries brand themselves on stage"
    zh: "分析各国如何在舞台上塑造形象"
    zh-TW: "分析各國如何在舞台上塑造形象"
    ja: "各国が舞台でどう自国を演出するか分析する"
    ko: "각국이 무대에서 자국을 어떻게 알리는지 분석하기"
    vi: "Phân tích cách các nước tạo hình ảnh trên sân khấu"
    ms: "Analisis cara negara menjenamakan diri di pentas"
    id: "Menganalisis cara negara membangun citra di panggung"
    hi: "देश मंच पर अपनी छवि कैसे बनाते हैं, इसका विश्लेषण करना"
  - en: "Discuss identity, gender and sexuality in pop media"
    zh: "讨论流行媒体中的身份、性别与性向"
    zh-TW: "討論流行媒體中的身分、性別與性向"
    ja: "大衆メディアにおけるアイデンティティとジェンダーを論じる"
    ko: "대중 매체 속 정체성, 젠더, 섹슈얼리티 토론하기"
    vi: "Thảo luận bản sắc, giới và tính dục trong truyền thông"
    ms: "Bincangkan identiti, gender dan seksualiti dalam media popular"
    id: "Membahas identitas, gender dan seksualitas di media pop"
    hi: "लोकप्रिय मीडिया में पहचान, जेंडर और यौनिकता पर चर्चा करना"
