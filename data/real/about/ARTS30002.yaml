code: ARTS30002
year: 2026
learn:
  en: "How translation works: translators' main strategies, the translating brain, technology, and hands-on subtitling."
  zh: "翻译如何运作：主要翻译策略、译者大脑、翻译技术，以及字幕实操。"
  zh-TW: "翻譯如何運作：主要翻譯策略、譯者大腦、翻譯技術，以及字幕實作。"
  ja: "翻訳の仕組み。主な訳し方、翻訳する脳、技術の活用、字幕などの実習。"
  ko: "번역의 원리. 주요 번역 전략, 번역하는 뇌, 기술 활용, 자막 실습."
  vi: "Dịch thuật vận hành ra sao: chiến lược chính, bộ não khi dịch, công nghệ, và thực hành phụ đề."
  ms: "Cara terjemahan berfungsi: strategi utama, otak penterjemah, teknologi, dan latihan sari kata."
  id: "Cara kerja penerjemahan: strategi utama, otak penerjemah, teknologi, dan praktik subtitel."
  hi: "अनुवाद कैसे काम करता है: मुख्य रणनीतियाँ, अनुवाद करता दिमाग़, तकनीक, और सबटाइटलिंग का अभ्यास।"
outcomes:
  - en: "Choose suitable strategies for different texts"
    zh: "针对不同文本选择合适的翻译策略"
    zh-TW: "針對不同文本選擇合適的翻譯策略"
    ja: "文章の種類に合った訳し方を選ぶ"
    ko: "텍스트에 맞는 번역 전략 고르기"
    vi: "Chọn chiến lược dịch hợp với từng loại văn bản"
    ms: "Pilih strategi sesuai untuk teks berbeza"
    id: "Memilih strategi yang cocok untuk tiap jenis teks"
    hi: "अलग-अलग पाठों के लिए सही रणनीति चुनना"
  - en: "Use post-editing and translation memory tools"
    zh: "使用译后编辑和翻译记忆工具"
    zh-TW: "使用譯後編輯和翻譯記憶工具"
    ja: "ポストエディットと翻訳メモリを使う"
    ko: "포스트에디팅과 번역 메모리 도구 쓰기"
    vi: "Dùng công cụ hậu biên tập và bộ nhớ dịch"
    ms: "Guna alat suntingan pasca dan memori terjemahan"
    id: "Memakai alat post-editing dan memori terjemahan"
    hi: "पोस्ट-एडिटिंग और ट्रांसलेशन मेमोरी टूल इस्तेमाल करना"
  - en: "Make subtitles for a short video"
    zh: "为短视频制作字幕"
    zh-TW: "為短影片製作字幕"
    ja: "短い動画に字幕を付ける"
    ko: "짧은 영상에 자막 달기"
    vi: "Làm phụ đề cho một video ngắn"
    ms: "Hasilkan sari kata untuk video pendek"
    id: "Membuat subtitel untuk video pendek"
    hi: "छोटे वीडियो के लिए सबटाइटल बनाना"
