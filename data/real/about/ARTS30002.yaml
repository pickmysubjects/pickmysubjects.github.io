code: ARTS30002
year: 2026
learn:
  en: "A first look at translating between English and another language: methods, problems and practice."
  zh: "翻译入门：英语与另一种语言之间的翻译方法、难点和练习。"
  zh-TW: "翻譯入門：英語與另一種語言之間的翻譯方法、難點和練習。"
  ja: "英語と他言語の間の翻訳入門。方法、難しい点、実践。"
  ko: "영어와 다른 언어 사이 번역 입문. 방법, 어려운 점, 실습."
  vi: "Nhập môn dịch giữa tiếng Anh và một ngôn ngữ khác: phương pháp, khó khăn và thực hành."
  ms: "Pengenalan menterjemah antara bahasa Inggeris dan bahasa lain: kaedah, masalah dan latihan."
  id: "Pengantar menerjemahkan antara bahasa Inggris dan bahasa lain: metode, masalah dan latihan."
  hi: "अंग्रेज़ी और किसी दूसरी भाषा के बीच अनुवाद का परिचय: तरीके, मुश्किलें और अभ्यास।"
outcomes:
  - en: "Translate short texts accurately and naturally"
    zh: "准确自然地翻译短文"
    zh-TW: "準確自然地翻譯短文"
    ja: "短い文章を正確で自然に訳す"
    ko: "짧은 글을 정확하고 자연스럽게 번역하기"
    vi: "Dịch đoạn văn ngắn chính xác và tự nhiên"
    ms: "Terjemah teks pendek dengan tepat dan semula jadi"
    id: "Menerjemahkan teks pendek dengan tepat dan alami"
    hi: "छोटे पाठों का सटीक और सहज अनुवाद करना"
  - en: "Explain the choices you make as a translator"
    zh: "说明自己作为译者的取舍"
    zh-TW: "說明自己作為譯者的取捨"
    ja: "訳者としての判断を説明する"
    ko: "번역자로서 내린 선택 설명하기"
    vi: "Giải thích lựa chọn của mình khi dịch"
    ms: "Terangkan pilihan anda sebagai penterjemah"
    id: "Menjelaskan pilihan Anda sebagai penerjemah"
    hi: "अनुवादक के रूप में अपने फ़ैसले समझाना"
  - en: "Know the main ideas in translation studies"
    zh: "了解翻译研究的主要观点"
    zh-TW: "了解翻譯研究的主要觀點"
    ja: "翻訳研究の主な考え方を知る"
    ko: "번역학의 주요 개념 알기"
    vi: "Nắm các ý chính của ngành dịch thuật"
    ms: "Kenali idea utama dalam kajian terjemahan"
    id: "Mengenal gagasan utama kajian penerjemahan"
    hi: "अनुवाद अध्ययन के मुख्य विचार जानना"
