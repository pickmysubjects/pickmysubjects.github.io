code: MGMT30019
year: 2026
learn:
  en: "How work is changing with technology and globalisation, and how to prepare for and shape the future of work."
  zh: "工作如何随科技和全球化改变，以及如何为未来的工作做准备。"
  zh-TW: "工作如何隨科技和全球化改變，以及如何為未來的工作做好準備。"
  ja: "技術とグローバル化で働き方がどう変わるか、未来の仕事にどう備えるか。"
  ko: "기술과 세계화로 일이 어떻게 바뀌는지, 미래의 일에 어떻게 대비할지."
  vi: "Công việc thay đổi ra sao do công nghệ và toàn cầu hóa, và cách chuẩn bị cho tương lai việc làm."
  ms: "Cara kerja berubah akibat teknologi dan globalisasi, dan cara bersedia untuk masa depan kerja."
  id: "Bagaimana pekerjaan berubah karena teknologi dan globalisasi, dan cara bersiap untuk masa depan kerja."
  hi: "टेक्नोलॉजी और वैश्वीकरण से काम कैसे बदल रहा है, और भविष्य के काम के लिए कैसे तैयार हों।"
outcomes:
  - en: "Explain research on the changing nature of work"
    zh: "解释关于工作变化的研究"
    zh-TW: "解釋關於工作變化的研究"
    ja: "働き方の変化に関する研究を説明する"
    ko: "일의 변화에 관한 연구 설명하기"
    vi: "Giải thích nghiên cứu về sự thay đổi của công việc"
    ms: "Terangkan kajian tentang perubahan sifat kerja"
    id: "Menjelaskan riset tentang perubahan dunia kerja"
    hi: "काम के बदलते स्वरूप पर रिसर्च समझाना"
  - en: "Use models to solve workplace problems"
    zh: "用模型解决职场问题"
    zh-TW: "用模型解決職場問題"
    ja: "モデルを使って職場の問題を解決する"
    ko: "모델로 직장 문제 해결하기"
    vi: "Dùng mô hình giải quyết vấn đề nơi làm việc"
    ms: "Guna model untuk selesaikan masalah tempat kerja"
    id: "Memakai model untuk memecahkan masalah di tempat kerja"
    hi: "मॉडल से कार्यस्थल की समस्याएँ सुलझाना"
  - en: "Assess the skills needed to lead future work"
    zh: "评估引领未来工作所需的能力"
    zh-TW: "評估引領未來工作所需的能力"
    ja: "未来の仕事を率いるのに必要な力を見極める"
    ko: "미래의 일을 이끌 역량 평가하기"
    vi: "Đánh giá kỹ năng cần để dẫn dắt công việc tương lai"
    ms: "Nilai kemahiran untuk memimpin kerja masa depan"
    id: "Menilai keterampilan untuk memimpin kerja masa depan"
    hi: "भविष्य के काम का नेतृत्व करने की स्किल परखना"
