code: EURO30004
year: 2026
learn:
  en: "European cinema from a time of big political and social change, and how films shaped identity."
  zh: "政治和社会剧变时期的欧洲电影，以及电影如何塑造身份认同。"
  zh-TW: "政治和社會劇變時期的歐洲電影，以及電影如何塑造身分認同。"
  ja: "政治・社会の大きな変化の時代のヨーロッパ映画と、映画が形づくったアイデンティティ。"
  ko: "정치·사회 격변기의 유럽 영화와 영화가 만든 정체성."
  vi: "Điện ảnh châu Âu trong thời kỳ biến đổi chính trị, xã hội lớn, và cách phim định hình bản sắc."
  ms: "Sinema Eropah ketika perubahan politik dan sosial besar, dan cara filem membentuk identiti."
  id: "Sinema Eropa di masa perubahan politik dan sosial besar, dan cara film membentuk identitas."
  hi: "बड़े राजनीतिक-सामाजिक बदलाव के दौर का यूरोपीय सिनेमा, और फ़िल्मों ने पहचान को कैसे गढ़ा।"
outcomes:
  - en: "Analyse key European films"
    zh: "分析重要的欧洲电影"
    zh-TW: "分析重要的歐洲電影"
    ja: "主要なヨーロッパ映画を分析する"
    ko: "주요 유럽 영화 분석하기"
    vi: "Phân tích các phim châu Âu tiêu biểu"
    ms: "Analisis filem Eropah yang penting"
    id: "Menganalisis film-film penting Eropa"
    hi: "प्रमुख यूरोपीय फ़िल्मों का विश्लेषण करना"
  - en: "Link films to their historical context"
    zh: "把电影与历史背景联系起来"
    zh-TW: "把電影與歷史背景聯繫起來"
    ja: "映画を歴史的背景と結びつける"
    ko: "영화를 역사적 맥락과 연결하기"
    vi: "Liên hệ phim với bối cảnh lịch sử"
    ms: "Kaitkan filem dengan konteks sejarahnya"
    id: "Mengaitkan film dengan konteks sejarahnya"
    hi: "फ़िल्मों को उनके ऐतिहासिक संदर्भ से जोड़ना"
  - en: "Write and talk clearly about film"
    zh: "清楚地写作和讨论电影"
    zh-TW: "清楚地寫作和討論電影"
    ja: "映画について明快に書き、話す"
    ko: "영화에 대해 명확하게 쓰고 말하기"
    vi: "Viết và nói rõ ràng về phim"
    ms: "Tulis dan bincang dengan jelas tentang filem"
    id: "Menulis dan berbicara dengan jelas tentang film"
    hi: "फ़िल्म पर स्पष्ट रूप से लिखना और बोलना"
