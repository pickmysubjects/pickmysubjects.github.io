code: ARCH30005
year: 2026
learn:
  en: "Render and animate spaces with industry software: materials, lighting, cameras, composition and post-production."
  zh: "用行业软件渲染和制作空间动画：材质、灯光、镜头、构图与后期。"
  zh-TW: "用產業軟體算圖與製作空間動畫：材質、燈光、鏡頭、構圖與後製。"
  ja: "業界ソフトで空間をレンダリング・アニメ化：素材、照明、カメラ、構図、ポスプロ。"
  ko: "업계 소프트웨어로 공간 렌더링·애니메이션: 재질, 조명, 카메라, 구도, 후반 작업."
  vi: "Dựng hình và hoạt hình không gian bằng phần mềm ngành: vật liệu, ánh sáng, máy quay, hậu kỳ."
  ms: "Render dan animasi ruang dengan perisian industri: bahan, pencahayaan, kamera, pascaproduksi."
  id: "Render dan animasi ruang dengan software industri: material, pencahayaan, kamera, pascaproduksi."
  hi: "इंडस्ट्री सॉफ़्टवेयर से स्पेस का रेंडर और एनिमेशन: मटीरियल, लाइट, कैमरा, पोस्ट-प्रोडक्शन।"
outcomes:
  - en: "Build and light detailed 3D scenes"
    zh: "搭建并布光精细的三维场景"
    zh-TW: "搭建並打光精細的3D場景"
    ja: "詳細な3Dシーンを作り照明を設定する"
    ko: "정교한 3D 장면 만들고 조명 설정하기"
    vi: "Dựng và chiếu sáng cảnh 3D chi tiết"
    ms: "Bina dan sinari adegan 3D terperinci"
    id: "Membangun dan menyinari adegan 3D detail"
    hi: "विस्तृत 3D सीन बनाना और रोशनी देना"
  - en: "Produce still renders and short animations"
    zh: "制作静态渲染图和短动画"
    zh-TW: "製作靜態算圖和短動畫"
    ja: "静止画レンダーと短いアニメを作る"
    ko: "정지 렌더와 짧은 애니메이션 제작하기"
    vi: "Làm ảnh render và hoạt hình ngắn"
    ms: "Hasilkan render pegun dan animasi pendek"
    id: "Membuat render diam dan animasi pendek"
    hi: "स्टिल रेंडर और छोटे एनिमेशन बनाना"
  - en: "Judge what makes a visual tell a design story"
    zh: "判断怎样的图像能讲好设计故事"
    zh-TW: "判斷怎樣的圖像能說好設計故事"
    ja: "設計を伝える画像の良し悪しを見極める"
    ko: "디자인을 잘 전달하는 이미지 판단하기"
    vi: "Đánh giá hình ảnh kể câu chuyện thiết kế"
    ms: "Nilai visual yang menyampaikan kisah reka bentuk"
    id: "Menilai visual yang menyampaikan cerita desain"
    hi: "कौन-सा विज़ुअल डिज़ाइन की कहानी कहता है, परखना"
