code: ORAL20005
year: 2026
learn:
  en: "The year when simulation turns into treating real patients in clinic, assessed by clinical exams, a viva and ongoing practice."
  zh: "这一年从模拟转向在诊所治疗真实病人，以临床考试、口试和持续实践评估。"
  zh-TW: "這一年從模擬轉向在診所治療真實病人，以臨床考試、口試與持續實務評估。"
  ja: "シミュレーションから実際の患者の治療へ移る年。臨床試験、口頭試問、継続評価で評価。"
  ko: "시뮬레이션에서 실제 환자 진료로 넘어가는 해. 임상시험·구술시험·지속 평가."
  vi: "Năm chuyển từ mô phỏng sang chữa bệnh nhân thật, chấm bằng thi lâm sàng, vấn đáp."
  ms: "Tahun beralih dari simulasi ke merawat pesakit sebenar, dinilai melalui peperiksaan klinikal."
  id: "Tahun beralih dari simulasi ke merawat pasien nyata, dinilai lewat ujian klinis dan lisan."
  hi: "सिमुलेशन से असली मरीज़ों के इलाज तक का साल, क्लिनिकल परीक्षा और वाइवा से मूल्यांकन।"
outcomes:
  - en: "Treat patients under supervision"
    zh: "在督导下治疗病人"
    zh-TW: "在督導下治療病人"
    ja: "指導の下で患者を治療する"
    ko: "지도 아래 환자 진료하기"
    vi: "Chữa bệnh nhân dưới giám sát"
    ms: "Rawat pesakit di bawah seliaan"
    id: "Merawat pasien di bawah supervisi"
    hi: "निगरानी में मरीज़ों का इलाज"
  - en: "Plan care for common oral conditions"
    zh: "为常见口腔问题制定护理计划"
    zh-TW: "為常見口腔問題訂定照護計畫"
    ja: "よくある口腔疾患のケアを計画する"
    ko: "흔한 구강 질환 진료 계획하기"
    vi: "Lập kế hoạch chăm sóc bệnh thường gặp"
    ms: "Rancang rawatan keadaan mulut biasa"
    id: "Merencanakan perawatan kondisi umum"
    hi: "आम मुख रोगों की देखभाल की योजना"
  - en: "Explain your clinical decisions in a viva"
    zh: "在口试中解释临床决定"
    zh-TW: "在口試中解釋臨床決定"
    ja: "口頭試問で臨床判断を説明する"
    ko: "구술시험에서 임상 판단 설명하기"
    vi: "Giải thích quyết định lâm sàng khi vấn đáp"
    ms: "Terang keputusan klinikal dalam viva"
    id: "Menjelaskan keputusan klinis saat ujian lisan"
    hi: "वाइवा में क्लिनिकल फ़ैसले समझाना"
