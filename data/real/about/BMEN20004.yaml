code: BMEN20004
year: 2027
learn:
  en: "How molecules and cells work, from biochemistry and genes to immunity, and how bioengineering uses this for health and disease."
  zh: "从生化、基因到免疫，学细胞和分子如何运作，以及生物工程如何用于健康与疾病。"
  zh-TW: "從生化、基因到免疫，學細胞和分子如何運作，以及生物工程如何應用於健康與疾病。"
  ja: "生化学や遺伝子から免疫まで、分子と細胞の仕組みと、それを健康や病気に生かす生体工学を学ぶ。"
  ko: "생화학, 유전자부터 면역까지 분자와 세포의 작동 원리와 이를 건강·질병에 활용하는 생체공학을 배운다."
  vi: "Cách phân tử và tế bào hoạt động, từ hóa sinh, gen đến miễn dịch, và cách kỹ thuật sinh học ứng dụng vào sức khỏe và bệnh tật."
  ms: "Cara molekul dan sel berfungsi, daripada biokimia dan gen hingga imuniti, serta cara biokejuruteraan menggunakannya untuk kesihatan dan penyakit."
  id: "Cara kerja molekul dan sel, dari biokimia dan gen hingga imunitas, serta penerapan bioteknik untuk kesehatan dan penyakit."
  hi: "बायोकेमिस्ट्री और जीन से लेकर इम्यूनिटी तक अणु और कोशिकाएँ कैसे काम करती हैं, और बायोइंजीनियरिंग इन्हें स्वास्थ्य व बीमारी में कैसे इस्तेमाल करती है।"
outcomes:
  - en: "Explain infection and disease at the cell level"
    zh: "从细胞层面解释感染和疾病"
    zh-TW: "從細胞層面解釋感染和疾病"
    ja: "感染と病気を細胞レベルで説明する"
    ko: "감염과 질병을 세포 수준에서 설명하기"
    vi: "Giải thích nhiễm trùng và bệnh ở cấp độ tế bào"
    ms: "Terangkan jangkitan dan penyakit pada tahap sel"
    id: "Menjelaskan infeksi dan penyakit di tingkat sel"
    hi: "कोशिका स्तर पर संक्रमण और बीमारी समझाना"
  - en: "Propose bioengineering fixes for disease"
    zh: "提出针对疾病的生物工程方案"
    zh-TW: "提出針對疾病的生物工程方案"
    ja: "病気に対する生体工学的な解決策を提案する"
    ko: "질병에 대한 생체공학적 해결책 제안하기"
    vi: "Đề xuất giải pháp kỹ thuật sinh học cho bệnh"
    ms: "Cadangkan penyelesaian biokejuruteraan untuk penyakit"
    id: "Mengusulkan solusi bioteknik untuk penyakit"
    hi: "बीमारियों के लिए बायोइंजीनियरिंग समाधान सुझाना"
  - en: "Use basic biochemistry and molecular biology lab skills"
    zh: "掌握生化和分子生物学的实验技能"
    zh-TW: "掌握生化和分子生物學的實驗技能"
    ja: "生化学・分子生物学の実験技術を使う"
    ko: "생화학·분자생물학 실험 기술 활용하기"
    vi: "Sử dụng kỹ năng thí nghiệm hóa sinh và sinh học phân tử"
    ms: "Guna kemahiran makmal biokimia dan biologi molekul"
    id: "Menggunakan keterampilan lab biokimia dan biologi molekuler"
    hi: "बायोकेमिस्ट्री व मॉलिक्यूलर बायोलॉजी की लैब तकनीकें इस्तेमाल करना"
