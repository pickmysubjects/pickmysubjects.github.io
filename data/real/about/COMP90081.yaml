code: COMP90081
year: 2027
learn:
  en: "Part 4 of a year-long supervised research project in computer science, after the proposal is passed."
  zh: "为期一年的计算机科学指导研究项目第4部分（研究计划书通过后进行）。"
  zh-TW: "為期一年的電腦科學指導研究專案第4部分（研究計畫書通過後進行）。"
  ja: "1年間の指導付きコンピュータ科学研究プロジェクトのパート4（研究計画書の合格後）。"
  ko: "1년간 지도받는 컴퓨터 과학 연구 프로젝트의 4부(연구 계획서 통과 후)."
  vi: "Phần 4 của dự án nghiên cứu khoa học máy tính kéo dài một năm có hướng dẫn, sau khi đề cương được duyệt."
  ms: "Bahagian 4 projek penyelidikan sains komputer setahun dengan penyeliaan, selepas cadangan diluluskan."
  id: "Bagian 4 dari proyek riset ilmu komputer setahun dengan pembimbing, setelah proposal disetujui."
  hi: "एक साल के निर्देशित कंप्यूटर साइंस रिसर्च प्रोजेक्ट का भाग 4 (प्रस्ताव पास होने के बाद)।"
outcomes:
  - en: "Plan and carry out an independent research project in computer science"
    zh: "独立规划并完成一个计算机科学研究项目"
    zh-TW: "獨立規劃並完成一個電腦科學研究專案"
    ja: "コンピュータ科学の研究を自分で計画し進める"
    ko: "컴퓨터 과학 연구 프로젝트를 스스로 계획하고 수행하기"
    vi: "Tự lập kế hoạch và thực hiện một dự án nghiên cứu khoa học máy tính"
    ms: "Merancang dan menjalankan projek penyelidikan sains komputer secara berdikari"
    id: "Merencanakan dan menjalankan proyek riset ilmu komputer secara mandiri"
    hi: "कंप्यूटर साइंस का एक रिसर्च प्रोजेक्ट खुद योजना बनाकर पूरा करना"
  - en: "Review past research and report findings in writing and talks, ethically"
    zh: "评析已有研究，并以书面和口头形式负责任地汇报成果"
    zh-TW: "評析既有研究，並以書面與口頭形式負責任地報告成果"
    ja: "先行研究を検討し、倫理を守って成果を文書と発表で伝える"
    ko: "기존 연구를 검토하고 윤리를 지키며 글과 발표로 결과 보고하기"
    vi: "Đánh giá nghiên cứu trước đó và trình bày kết quả bằng văn bản, thuyết trình, có đạo đức"
    ms: "Menilai kajian lepas dan melaporkan dapatan secara bertulis dan lisan dengan beretika"
    id: "Menelaah riset terdahulu dan melaporkan hasil secara tertulis dan lisan dengan etis"
    hi: "पुराने शोध को परखना और नैतिक ढंग से लिखकर व बोलकर नतीजे बताना"
