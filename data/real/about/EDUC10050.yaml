code: EDUC10050
year: 2026
learn:
  en: "Big theories of how people learn and know, tried out in practice through volunteer tutoring in community programs."
  zh: "人们如何学习与认知的主要理论，并通过社区志愿辅导实践。"
  zh-TW: "人們如何學習與認知的主要理論，並透過社區志工輔導實踐。"
  ja: "人がどう学び知るかの主要理論を、地域の学習支援ボランティアで実践する。"
  ko: "사람이 배우고 아는 방식에 관한 주요 이론을 지역 봉사 튜터링으로 실천."
  vi: "Các lý thuyết lớn về cách con người học và hiểu biết, thực hành qua dạy kèm tình nguyện ở cộng đồng."
  ms: "Teori utama tentang cara manusia belajar dan mengetahui, dipraktikkan melalui tunjuk ajar sukarela di komuniti."
  id: "Teori utama tentang cara orang belajar dan mengetahui, dipraktikkan lewat les relawan di komunitas."
  hi: "लोग कैसे सीखते और जानते हैं, इसके मुख्य सिद्धांत, सामुदायिक स्वयंसेवी ट्यूशन के ज़रिए अभ्यास।"
outcomes:
  - en: "Use research and theory to ask what learning and knowledge are"
    zh: "用研究和理论探讨什么是学习与知识"
    zh-TW: "用研究和理論探討什麼是學習與知識"
    ja: "研究と理論から学びと知識とは何かを考える"
    ko: "연구와 이론으로 배움과 지식이 무엇인지 탐구하기"
    vi: "Dùng nghiên cứu và lý thuyết để hỏi học tập và tri thức là gì"
    ms: "Guna kajian dan teori untuk menyoal apa itu pembelajaran dan ilmu"
    id: "Memakai riset dan teori untuk menelaah apa itu belajar dan pengetahuan"
    hi: "शोध और सिद्धांत से समझना कि सीखना और ज्ञान क्या है"
  - en: "Use research-based strategies to support someone's learning"
    zh: "运用有研究依据的方法帮助他人学习"
    zh-TW: "運用有研究依據的方法協助他人學習"
    ja: "研究に基づく方法で他者の学びを支える"
    ko: "연구에 기반한 전략으로 다른 사람의 학습 돕기"
    vi: "Áp dụng chiến lược dựa trên nghiên cứu để hỗ trợ người khác học"
    ms: "Guna strategi berasaskan kajian untuk membantu orang lain belajar"
    id: "Menerapkan strategi berbasis riset untuk mendukung belajar orang lain"
    hi: "शोध-आधारित तरीक़ों से किसी के सीखने में मदद करना"
  - en: "Build your own philosophy of learning"
    zh: "形成自己的学习理念"
    zh-TW: "形成自己的學習理念"
    ja: "自分なりの学習観をつくる"
    ko: "자신만의 학습 철학 세우기"
    vi: "Xây dựng triết lý học tập của riêng mình"
    ms: "Bina falsafah pembelajaran sendiri"
    id: "Menyusun filosofi belajar sendiri"
    hi: "सीखने का अपना दर्शन बनाना"
