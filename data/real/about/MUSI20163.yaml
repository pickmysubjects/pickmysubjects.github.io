code: MUSI20163
year: 2026
learn:
  en: "Hands-on Afro-Brazilian percussion: samba batucada and samba reggae rhythms, played together as a band."
  zh: "动手学非洲-巴西打击乐：一起以乐队形式演奏桑巴 batucada 和桑巴雷鬼节奏"
  zh-TW: "動手學非洲-巴西打擊樂：一起以樂隊形式演奏森巴 batucada 和森巴雷鬼節奏"
  ja: "アフロ・ブラジルの打楽器を実践：サンバ・バトゥカーダやサンバ・レゲエのリズムをバンドで演奏。"
  ko: "아프로-브라질 타악기 실습: 삼바 바투카다와 삼바 레게 리듬을 밴드로 함께 연주."
  vi: "Thực hành bộ gõ Afro-Brazil: chơi nhịp samba batucada và samba reggae cùng cả ban nhạc."
  ms: "Perkusi Afro-Brazil secara praktikal: rentak samba batucada dan samba reggae dimainkan bersama sebagai band."
  id: "Praktik perkusi Afro-Brasil: ritme samba batucada dan samba reggae dimainkan bersama sebagai band."
  hi: "अफ़्रो-ब्राज़ीलियाई ताल वाद्यों का अभ्यास: सांबा बातुकादा और सांबा रेगे की लय, पूरे बैंड के साथ।"
outcomes:
  - en: "Recognise Latin American rhythms and styles"
    zh: "认出拉丁美洲的各种节奏和风格"
    zh-TW: "認出拉丁美洲的各種節奏和風格"
    ja: "ラテンアメリカのリズムとスタイルを聞き分ける"
    ko: "라틴아메리카의 리듬과 스타일 알아보기"
    vi: "Nhận ra các nhịp điệu và phong cách Mỹ Latinh"
    ms: "Mengenal pasti rentak dan gaya Amerika Latin"
    id: "Mengenali ritme dan gaya Amerika Latin"
    hi: "लैटिन अमेरिकी लय और शैलियाँ पहचानना"
  - en: "Play set rhythm patterns on several percussion instruments"
    zh: "在几种打击乐器上演奏指定节奏型"
    zh-TW: "在幾種打擊樂器上演奏指定節奏型"
    ja: "複数の打楽器で決まったリズムパターンを演奏する"
    ko: "여러 타악기로 정해진 리듬 패턴 연주하기"
    vi: "Chơi các mẫu nhịp trên nhiều nhạc cụ gõ"
    ms: "Memainkan corak rentak pada beberapa alat perkusi"
    id: "Memainkan pola ritme pada beberapa alat perkusi"
    hi: "कई ताल वाद्यों पर तय लय-पैटर्न बजाना"
  - en: "Hear and keep your place in layered rhythms with a steady inner pulse"
    zh: "在多层节奏里听清并跟住，保持稳定的内在律动"
    zh-TW: "在多層節奏裡聽清並跟住，保持穩定的內在律動"
    ja: "重なるリズムの中で内なる拍を保って演奏する"
    ko: "겹치는 리듬 속에서 내면의 박을 유지하며 연주하기"
    vi: "Nghe và giữ nhịp trong các lớp nhịp chồng nhau"
    ms: "Mendengar dan kekal tepat dalam rentak berlapis"
    id: "Mendengar dan tetap pada tempo dalam ritme berlapis"
    hi: "परतदार लय में अंदरूनी ताल बनाए रखते हुए बजाना"
