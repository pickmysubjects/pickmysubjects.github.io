code: ISYS90117
year: 2027
learn:
  en: "Running business analytics programs as a manager: data warehouses, ETL, data quality, OLAP and decision tools."
  zh: "以管理者身份推动商业分析项目：数据仓库、ETL、数据质量、OLAP 和决策工具。"
  zh-TW: "以管理者身分推動商業分析計畫：資料倉儲、ETL、資料品質、OLAP 與決策工具。"
  ja: "マネージャーとして分析施策を進める：データウェアハウス、ETL、データ品質、OLAP、意思決定ツール。"
  ko: "관리자로서 비즈니스 분석 프로그램 운영: 데이터 웨어하우스, ETL, 데이터 품질, OLAP, 의사결정 도구."
  vi: "Điều hành chương trình phân tích kinh doanh: kho dữ liệu, ETL, chất lượng dữ liệu, OLAP, công cụ ra quyết định."
  ms: "Mengurus program analitik perniagaan: gudang data, ETL, kualiti data, OLAP dan alat membuat keputusan."
  id: "Mengelola program analitik bisnis: gudang data, ETL, kualitas data, OLAP, dan alat pengambilan keputusan."
  hi: "मैनेजर के रूप में बिज़नेस एनालिटिक्स चलाना: डेटा वेयरहाउस, ETL, डेटा गुणवत्ता, OLAP और निर्णय उपकरण।"
outcomes:
  - en: "Design a data warehouse for business analytics"
    zh: "为商业分析设计数据仓库"
    zh-TW: "為商業分析設計資料倉儲"
    ja: "分析用のデータウェアハウスを設計する"
    ko: "비즈니스 분석용 데이터 웨어하우스 설계하기"
    vi: "Thiết kế kho dữ liệu cho phân tích kinh doanh"
    ms: "Mereka gudang data untuk analitik perniagaan"
    id: "Merancang gudang data untuk analitik bisnis"
    hi: "बिज़नेस एनालिटिक्स के लिए डेटा वेयरहाउस डिज़ाइन करना"
  - en: "Plan and oversee an analytics program"
    zh: "规划并监督一个分析项目"
    zh-TW: "規劃並督導一項分析計畫"
    ja: "分析プログラムを計画し監督する"
    ko: "분석 프로그램 계획하고 관리하기"
    vi: "Lập kế hoạch và giám sát chương trình phân tích"
    ms: "Merancang dan menyelia program analitik"
    id: "Merencanakan dan mengawasi program analitik"
    hi: "एनालिटिक्स प्रोग्राम की योजना और निगरानी करना"
