code: FINA10035
year: 2026
learn:
  en: "Draw and paint still life online, from close observation of everyday objects to finished works, with the genre's history alongside."
  zh: "在线学画静物：从细看日常物件开始，画到完成作品，同时了解静物画的历史"
  zh-TW: "線上學畫靜物：從細看日常物件開始，畫到完成作品，同時了解靜物畫的歷史"
  ja: "オンラインで静物の素描と絵画を学ぶ。身近な物の観察から作品完成まで、ジャンルの歴史も扱う。"
  ko: "온라인으로 정물 드로잉과 회화를 배움: 일상 사물 관찰에서 완성작까지, 장르의 역사도 함께."
  vi: "Học vẽ tĩnh vật trực tuyến, từ quan sát đồ vật hằng ngày đến tác phẩm hoàn chỉnh, kèm lịch sử thể loại."
  ms: "Melukis dan melakar alam benda secara dalam talian, dari pemerhatian objek harian hingga karya siap, berserta sejarahnya."
  id: "Menggambar dan melukis alam benda secara daring, dari mengamati benda sehari-hari hingga karya jadi, beserta sejarahnya."
  hi: "ऑनलाइन स्टिल लाइफ़ ड्रॉइंग और पेंटिंग: रोज़मर्रा की चीज़ों को ध्यान से देखने से तैयार कृति तक, विधा के इतिहास के साथ।"
outcomes:
  - en: "Draw and paint objects accurately from observation"
    zh: "通过观察准确地画出和画好物件"
    zh-TW: "透過觀察準確地畫出和畫好物件"
    ja: "観察から物を正確に素描・彩色する"
    ko: "관찰을 통해 사물을 정확하게 그리고 칠하기"
    vi: "Vẽ và tô màu đồ vật chính xác từ quan sát"
    ms: "Melukis objek dengan tepat melalui pemerhatian"
    id: "Menggambar dan melukis benda dengan tepat dari pengamatan"
    hi: "देखकर वस्तुओं को सटीक रूप से बनाना और रंगना"
  - en: "Discuss historical and contemporary still life art"
    zh: "讨论历史上和当代的静物艺术"
    zh-TW: "討論歷史上和當代的靜物藝術"
    ja: "歴史的・現代的な静物画について論じる"
    ko: "역사적·현대적 정물 미술에 대해 논의하기"
    vi: "Thảo luận về nghệ thuật tĩnh vật xưa và nay"
    ms: "Membincangkan seni alam benda dahulu dan kini"
    id: "Membahas seni alam benda masa lalu dan kini"
    hi: "ऐतिहासिक और समकालीन स्टिल लाइफ़ कला पर चर्चा करना"
  - en: "Build a folio and reflect on your own progress"
    zh: "完成作品集并反思自己的进步"
    zh-TW: "完成作品集並反思自己的進步"
    ja: "作品集をまとめ、自分の上達を振り返る"
    ko: "포트폴리오를 만들고 자신의 발전을 돌아보기"
    vi: "Làm hồ sơ tác phẩm và tự đánh giá tiến bộ"
    ms: "Menyusun folio dan menilai kemajuan sendiri"
    id: "Menyusun portofolio dan merefleksikan kemajuan sendiri"
    hi: "फ़ोलियो बनाना और अपनी प्रगति पर विचार करना"
