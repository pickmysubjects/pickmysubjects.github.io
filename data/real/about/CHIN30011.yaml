code: CHIN30011
year: 2026
learn:
  en: "An intro to literary Chinese (wenyan): classic philosophy and literature up to the Tang, in traditional characters, plus proverbs."
  zh: "文言文入门：阅读至唐代的经典哲学与文学，使用繁体字，并了解成语来源。"
  zh-TW: "文言文入門：閱讀至唐代的經典哲學與文學，使用繁體字，並了解成語來源。"
  ja: "漢文（文言）入門。唐代までの哲学・文学の名作を繁体字で読み、成語の由来も学ぶ。"
  ko: "문언문(한문) 입문. 당대까지의 철학·문학 고전을 번체자로 읽고 성어의 유래도 배운다."
  vi: "Nhập môn Hán văn cổ (văn ngôn): triết học và văn học kinh điển đến đời Đường, chữ phồn thể, kèm thành ngữ."
  ms: "Pengenalan bahasa Cina klasik (wenyan): falsafah dan sastera klasik hingga Tang, dalam aksara tradisional, serta peribahasa."
  id: "Pengantar Mandarin klasik (wenyan): filsafat dan sastra klasik hingga Dinasti Tang, dalam aksara tradisional, plus peribahasa."
  hi: "साहित्यिक चीनी (वेनयान) का परिचय: तांग काल तक का शास्त्रीय दर्शन व साहित्य, पारंपरिक अक्षरों में, और कहावतें।"
outcomes:
  - en: "Read classical texts in traditional characters"
    zh: "阅读繁体字的古典文本"
    zh-TW: "閱讀繁體字的古典文本"
    ja: "繁体字の古典を読む"
    ko: "번체자로 된 고전 읽기"
    vi: "Đọc văn bản cổ điển bằng chữ phồn thể"
    ms: "Baca teks klasik dalam aksara tradisional"
    id: "Membaca teks klasik dalam aksara tradisional"
    hi: "पारंपरिक अक्षरों में शास्त्रीय पाठ पढ़ना"
  - en: "Learn the core particles and grammar of wenyan"
    zh: "掌握文言文的基本虚词和语法"
    zh-TW: "掌握文言文的基本虛詞和文法"
    ja: "文言の基本的な虚詞と文法を身につける"
    ko: "문언문의 기본 허사와 문법 익히기"
    vi: "Nắm hư từ và ngữ pháp cốt lõi của văn ngôn"
    ms: "Kuasai partikel dan tatabahasa asas wenyan"
    id: "Menguasai partikel dan tata bahasa dasar wenyan"
    hi: "वेनयान के मूल निपात और व्याकरण सीखना"
  - en: "Trace where common Chinese proverbs come from"
    zh: "追溯常用成语的出处"
    zh-TW: "追溯常用成語的出處"
    ja: "よく使う成語の由来をたどる"
    ko: "자주 쓰는 성어의 출처 찾기"
    vi: "Tìm nguồn gốc các thành ngữ Trung Quốc thông dụng"
    ms: "Jejaki asal-usul peribahasa Cina yang lazim"
    id: "Menelusuri asal peribahasa Mandarin yang umum"
    hi: "आम चीनी कहावतों का स्रोत खोजना"
