code: MUST10015
year: 2026
learn:
  en: "Music theatre from the 1950s to today, with more music theory and aural skills, through research and debate."
  zh: "1950年代至今的音乐剧，进一步学习乐理与听力，并做研究与辩论。"
  zh-TW: "1950 年代至今的音樂劇，進一步學習樂理與聽力，並做研究與辯論。"
  ja: "1950年代から現在のミュージカルと、さらに進んだ音楽理論・聴音。"
  ko: "1950년대부터 지금까지의 뮤지컬과 심화 음악 이론·청음."
  vi: "Nhạc kịch từ thập niên 1950 đến nay, thêm nhạc lý và kỹ năng nghe."
  ms: "Teater muzikal dari 1950-an hingga kini, dengan lebih teori muzik dan pendengaran."
  id: "Teater musikal 1950-an hingga kini, dengan teori musik dan pendengaran lanjutan."
  hi: "1950 के दशक से आज तक म्यूज़िकल थिएटर, और आगे का संगीत-सिद्धांत व श्रवण कौशल।"
outcomes:
  - en: "Analyse how modern musicals are built"
    zh: "分析现代音乐剧的结构"
    zh-TW: "分析現代音樂劇的結構"
    ja: "現代ミュージカルの構造を分析する"
    ko: "현대 뮤지컬의 구조 분석하기"
    vi: "Phân tích cấu trúc nhạc kịch hiện đại"
    ms: "Analisis struktur muzikal moden"
    id: "Menganalisis struktur musikal modern"
    hi: "आधुनिक म्यूज़िकल की संरचना का विश्लेषण"
  - en: "Show theory skills in a viva"
    zh: "在口试中展示乐理能力"
    zh-TW: "在口試中展示樂理能力"
    ja: "口頭試問で理論力を示す"
    ko: "구술시험에서 이론 실력 보여 주기"
    vi: "Thể hiện nhạc lý trong bài vấn đáp"
    ms: "Tunjuk kemahiran teori dalam viva"
    id: "Menunjukkan kemampuan teori dalam viva"
    hi: "वाइवा में सिद्धांत कौशल दिखाना"
  - en: "Make a creative response to a musical style"
    zh: "针对一种音乐剧风格做创意回应"
    zh-TW: "針對一種音樂劇風格做創意回應"
    ja: "ミュージカルの様式に創作で応える"
    ko: "뮤지컬 양식에 대한 창작 응답 만들기"
    vi: "Sáng tác phản hồi một phong cách nhạc kịch"
    ms: "Hasilkan respons kreatif pada gaya muzikal"
    id: "Membuat respons kreatif atas gaya musikal"
    hi: "किसी म्यूज़िकल शैली पर रचनात्मक प्रतिक्रिया बनाना"
