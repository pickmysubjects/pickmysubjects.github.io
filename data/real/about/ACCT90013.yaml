code: ACCT90013
year: 2027
learn:
  en: "Theories behind financial accounting, such as agency and capital markets theory, used to judge current issues."
  zh: "代理理论、资本市场理论等财务会计理论，以及用它们分析当前问题。"
  zh-TW: "代理理論、資本市場理論等財務會計理論，以及用它們分析當前問題。"
  ja: "エージェンシー理論や資本市場理論など財務会計の理論と、それによる現代的課題の分析。"
  ko: "대리인 이론, 자본시장 이론 등 재무회계 이론과 이를 통한 현안 분석."
  vi: "Các lý thuyết kế toán tài chính như lý thuyết đại diện, thị trường vốn, dùng để phân tích vấn đề hiện nay."
  ms: "Teori di sebalik perakaunan kewangan seperti teori agensi dan pasaran modal, untuk menilai isu semasa."
  id: "Teori akuntansi keuangan seperti teori keagenan dan pasar modal untuk menilai isu terkini."
  hi: "एजेंसी और पूंजी बाज़ार सिद्धांत जैसे वित्तीय लेखा सिद्धांत, और उनसे वर्तमान मुद्दों का आकलन।"
outcomes:
  - en: "Evaluate the main theories of financial reporting"
    zh: "评价财务报告的主要理论"
    zh-TW: "評價財務報導的主要理論"
    ja: "財務報告の主要理論を評価する"
    ko: "재무보고의 주요 이론 평가하기"
    vi: "Đánh giá các lý thuyết chính về báo cáo tài chính"
    ms: "Menilai teori utama pelaporan kewangan"
    id: "Mengevaluasi teori utama pelaporan keuangan"
    hi: "वित्तीय रिपोर्टिंग के मुख्य सिद्धांतों का मूल्यांकन"
  - en: "Explain how standards and disclosure practice develop"
    zh: "解释会计准则和披露实践如何形成"
    zh-TW: "解釋會計準則與揭露實務如何形成"
    ja: "会計基準と開示実務の形成を説明する"
    ko: "회계기준과 공시 관행의 형성 설명하기"
    vi: "Giải thích cách chuẩn mực và công bố thông tin hình thành"
    ms: "Menerangkan perkembangan piawaian dan amalan pendedahan"
    id: "Menjelaskan perkembangan standar dan praktik pengungkapan"
    hi: "मानक और प्रकटीकरण प्रथाएँ कैसे बनती हैं, समझाना"
