code: CHEN90026
year: 2027
learn:
  en: "An investigative research project in chemical engineering, such as lab work, modelling or an industry problem."
  zh: "化学工程的研究项目，可包括实验、建模或解决工业问题。"
  zh-TW: "化學工程的研究專案，可包含實驗、建模或解決產業問題。"
  ja: "実験、モデル化、産業の課題など、化学工学の研究プロジェクト。"
  ko: "실험, 모델링, 산업 문제 등 화학공학 연구 프로젝트."
  vi: "Dự án nghiên cứu kỹ thuật hóa học, như thí nghiệm, mô hình hóa hoặc bài toán công nghiệp."
  ms: "Projek penyelidikan kejuruteraan kimia, seperti kerja makmal, pemodelan atau masalah industri."
  id: "Proyek riset teknik kimia, seperti kerja lab, pemodelan, atau masalah industri."
  hi: "केमिकल इंजीनियरिंग की शोध परियोजना, जैसे लैब काम, मॉडलिंग या उद्योग की समस्या।"
outcomes:
  - en: "Plan and carry out a chemical engineering research project"
    zh: "规划并开展化学工程研究项目"
    zh-TW: "規劃並進行化學工程研究專案"
    ja: "化学工学の研究プロジェクトを計画し実行する"
    ko: "화학공학 연구 프로젝트 계획과 수행하기"
    vi: "Lập kế hoạch và thực hiện dự án nghiên cứu kỹ thuật hóa học"
    ms: "Merancang dan menjalankan projek penyelidikan kejuruteraan kimia"
    id: "Merencanakan dan menjalankan proyek riset teknik kimia"
    hi: "केमिकल इंजीनियरिंग शोध परियोजना की योजना बनाना और करना"
  - en: "Analyse experimental data with statistics"
    zh: "用统计方法分析实验数据"
    zh-TW: "用統計方法分析實驗數據"
    ja: "実験データを統計で分析する"
    ko: "통계로 실험 데이터 분석하기"
    vi: "Phân tích dữ liệu thí nghiệm bằng thống kê"
    ms: "Menganalisis data eksperimen dengan statistik"
    id: "Menganalisis data eksperimen dengan statistik"
    hi: "सांख्यिकी से प्रयोगात्मक डेटा का विश्लेषण"
  - en: "Report results in writing and in a talk"
    zh: "以书面报告和口头汇报展示结果"
    zh-TW: "以書面報告與口頭發表呈現結果"
    ja: "結果をレポートと発表で伝える"
    ko: "결과를 보고서와 발표로 전달하기"
    vi: "Trình bày kết quả bằng báo cáo và thuyết trình"
    ms: "Melaporkan hasil secara bertulis dan pembentangan"
    id: "Melaporkan hasil secara tertulis dan presentasi"
    hi: "परिणाम लिखित रिपोर्ट और प्रस्तुति में बताना"
