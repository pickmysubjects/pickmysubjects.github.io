code: ENGM90012
year: 2027
learn:
  en: "Marketing for engineers: technical products and services, sales, business-to-business markets and pricing."
  zh: "面向工程师的市场营销：技术产品与服务、销售、企业对企业市场与定价。"
  zh-TW: "給工程師的行銷：技術產品與服務、銷售、企業對企業市場與定價。"
  ja: "エンジニアのためのマーケティング：技術製品とサービス、営業、B2B市場、価格設定。"
  ko: "엔지니어를 위한 마케팅: 기술 제품·서비스, 영업, 기업 간 시장, 가격 책정."
  vi: "Marketing cho kỹ sư: sản phẩm và dịch vụ kỹ thuật, bán hàng, thị trường B2B, định giá."
  ms: "Pemasaran untuk jurutera: produk dan perkhidmatan teknikal, jualan, pasaran B2B dan harga."
  id: "Pemasaran untuk insinyur: produk dan layanan teknik, penjualan, pasar B2B, penetapan harga."
  hi: "इंजीनियरों के लिए मार्केटिंग: तकनीकी उत्पाद और सेवाएँ, बिक्री, B2B बाज़ार, मूल्य निर्धारण।"
outcomes:
  - en: "Apply marketing ideas to an engineering product or service"
    zh: "把营销思路用于工程产品或服务"
    zh-TW: "把行銷思路用於工程產品或服務"
    ja: "マーケティングの考え方を技術製品に当てはめる"
    ko: "마케팅 개념을 엔지니어링 제품에 적용하기"
    vi: "Áp dụng marketing cho sản phẩm hoặc dịch vụ kỹ thuật"
    ms: "Menggunakan idea pemasaran pada produk kejuruteraan"
    id: "Menerapkan pemasaran pada produk atau layanan teknik"
    hi: "मार्केटिंग के विचार किसी इंजीनियरिंग उत्पाद पर लागू करना"
  - en: "Write a marketing plan for a technical market"
    zh: "为技术类市场写营销计划"
    zh-TW: "為技術類市場撰寫行銷計畫"
    ja: "技術系市場向けのマーケティング計画を書く"
    ko: "기술 시장을 위한 마케팅 계획 작성하기"
    vi: "Viết kế hoạch marketing cho thị trường kỹ thuật"
    ms: "Menulis pelan pemasaran untuk pasaran teknikal"
    id: "Menyusun rencana pemasaran untuk pasar teknis"
    hi: "किसी तकनीकी बाज़ार के लिए मार्केटिंग योजना लिखना"
