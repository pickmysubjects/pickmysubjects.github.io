code: MCEN90061
year: 2027
learn:
  en: "Project-based design of mechatronic systems, including choosing and sizing sensors and actuators."
  zh: "以项目方式设计机电系统，包括传感器和执行器的选型与尺寸确定。"
  zh-TW: "以專案方式設計機電系統，包括感測器與致動器的選型與尺寸決定。"
  ja: "プロジェクト形式でメカトロニクスシステムを設計し、センサーやアクチュエータを選定する。"
  ko: "프로젝트 기반 메카트로닉스 설계, 센서·액추에이터 선정과 사이징 포함."
  vi: "Thiết kế hệ cơ điện tử theo dự án, gồm chọn và tính cỡ cảm biến, cơ cấu chấp hành."
  ms: "Reka bentuk sistem mekatronik berasaskan projek, termasuk memilih dan menentukan saiz penderia dan penggerak."
  id: "Desain sistem mekatronika berbasis proyek, termasuk memilih dan menentukan ukuran sensor dan aktuator."
  hi: "प्रोजेक्ट-आधारित मेकाट्रॉनिक्स डिज़ाइन, सेंसर व एक्चुएटर चुनना और साइज़ करना।"
outcomes:
  - en: "Write clear engineering requirements for a need"
    zh: "针对需求写出清晰的工程要求"
    zh-TW: "針對需求寫出清晰的工程需求"
    ja: "ニーズに対して明確な技術要件を書く"
    ko: "요구에 맞는 명확한 공학 요구사항 작성하기"
    vi: "Viết yêu cầu kỹ thuật rõ ràng cho một nhu cầu"
    ms: "Menulis keperluan kejuruteraan yang jelas"
    id: "Menulis kebutuhan teknik yang jelas"
    hi: "किसी ज़रूरत के लिए स्पष्ट इंजीनियरिंग आवश्यकताएँ लिखना"
  - en: "Select and size sensors and actuators"
    zh: "选择传感器和执行器并确定规格"
    zh-TW: "選擇感測器與致動器並決定規格"
    ja: "センサーとアクチュエータを選定・サイジングする"
    ko: "센서와 액추에이터 선정·사이징하기"
    vi: "Chọn và tính cỡ cảm biến, cơ cấu chấp hành"
    ms: "Memilih dan menentukan saiz penderia serta penggerak"
    id: "Memilih dan menentukan ukuran sensor serta aktuator"
    hi: "सेंसर व एक्चुएटर चुनना और साइज़ करना"
