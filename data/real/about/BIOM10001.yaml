code: BIOM10001
year: 2026
learn:
  en: "A first-semester welcome subject for Biomedicine students: how health science fits into society, communities and the planet."
  zh: "生物医学新生第一学期的入门课：了解健康科学和社会、社区、环境之间的关系。"
  zh-TW: "生物醫學新生第一學期的入門課：了解健康科學和社會、社區、環境之間的關係。"
  ja: "生物医学の1年生が最初の学期に取る入門科目：健康科学と社会・地域・環境とのつながりを学ぶ。"
  ko: "생물의학 신입생이 첫 학기에 듣는 입문 과목: 건강 과학이 사회, 지역사회, 환경과 어떻게 연결되는지 배운다."
  vi: "Môn nhập môn cho sinh viên Y sinh học kỳ đầu: tìm hiểu khoa học sức khỏe gắn với xã hội, cộng đồng và môi trường ra sao."
  ms: "Subjek pengenalan semester pertama untuk pelajar Bioperubatan: bagaimana sains kesihatan berkait dengan masyarakat, komuniti dan alam sekitar."
  id: "Mata kuliah pengenalan semester pertama untuk mahasiswa Biomedis: bagaimana ilmu kesehatan terkait dengan masyarakat, komunitas, dan lingkungan."
  hi: "बायोमेडिसिन छात्रों का पहले सेमेस्टर का परिचय सब्जेक्ट: स्वास्थ्य विज्ञान समाज, समुदाय और पर्यावरण से कैसे जुड़ा है।"
outcomes:
  - en: "Follow academic integrity and research ethics rules"
    zh: "遵守学术诚信和研究伦理"
    zh-TW: "遵守學術誠信和研究倫理"
    ja: "学術的誠実さと研究倫理のルールを守る"
    ko: "학문적 정직성과 연구 윤리 지키기"
    vi: "Tuân thủ liêm chính học thuật và đạo đức nghiên cứu"
    ms: "Patuhi integriti akademik dan etika penyelidikan"
    id: "Mematuhi integritas akademik dan etika penelitian"
    hi: "अकादमिक ईमानदारी और रिसर्च एथिक्स के नियम मानना"
  - en: "Research a current health topic and explain it clearly"
    zh: "研究一个当前的健康话题并讲清楚"
    zh-TW: "研究一個當前的健康議題並講清楚"
    ja: "最近の健康トピックを調べ、わかりやすく説明する"
    ko: "최근 건강 이슈를 조사하고 알기 쉽게 설명하기"
    vi: "Tìm hiểu một vấn đề sức khỏe hiện nay và trình bày rõ ràng"
    ms: "Kaji satu isu kesihatan semasa dan terangkan dengan jelas"
    id: "Meneliti satu isu kesehatan terkini dan menjelaskannya dengan jelas"
    hi: "किसी मौजूदा हेल्थ टॉपिक पर रिसर्च करके उसे साफ़ समझाना"
  - en: "Work on a group project and reflect on what you learn"
    zh: "完成小组项目并反思自己的学习"
    zh-TW: "完成小組專案並反思自己的學習"
    ja: "グループ課題に取り組み、学びを振り返る"
    ko: "조별 프로젝트를 하고 배운 점 돌아보기"
    vi: "Làm dự án nhóm và tự nhìn lại những gì đã học"
    ms: "Siapkan projek berkumpulan dan renung semula apa yang dipelajari"
    id: "Mengerjakan proyek kelompok dan merefleksikan apa yang dipelajari"
    hi: "ग्रुप प्रोजेक्ट करना और अपनी सीख पर विचार करना"
