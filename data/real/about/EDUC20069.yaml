code: EDUC20069
year: 2026
learn:
  en: "Deafness from medical, social and cultural views: hearing loss, Auslan basics, deaf culture, cochlear implants and inclusion."
  zh: "从医学、社会和文化角度看耳聋：听力损失、澳洲手语、聋人文化和人工耳蜗。"
  zh-TW: "從醫學、社會和文化角度看聽障：聽力損失、澳洲手語、聾人文化和人工電子耳。"
  ja: "医学・社会・文化から見るろう：難聴、オーストラリア手話、ろう文化、人工内耳。"
  ko: "의학·사회·문화로 보는 청각장애: 난청, 호주 수어, 농문화, 인공와우와 포용."
  vi: "Khiếm thính dưới góc nhìn y học, xã hội, văn hóa: mất thính lực, Auslan, văn hóa người Điếc, ốc tai điện tử."
  ms: "Pekak dari sudut perubatan, sosial dan budaya: hilang pendengaran, asas Auslan, budaya pekak dan implan koklea."
  id: "Tuli dari sudut medis, sosial dan budaya: gangguan pendengaran, dasar Auslan, budaya Tuli dan implan koklea."
  hi: "चिकित्सा, सामाजिक और सांस्कृतिक नज़र से बधिरता: श्रवण हानि, Auslan, बधिर संस्कृति और कॉक्लियर इम्प्लांट।"
outcomes:
  - en: "Compare medical, social and cultural views of deafness"
    zh: "比较对耳聋的医学、社会和文化观点"
    zh-TW: "比較對聽障的醫學、社會和文化觀點"
    ja: "ろうに対する医学・社会・文化の見方を比べる"
    ko: "청각장애에 대한 의학·사회·문화 관점 비교하기"
    vi: "So sánh quan điểm y học, xã hội, văn hóa về khiếm thính"
    ms: "Membandingkan pandangan perubatan, sosial dan budaya tentang pekak"
    id: "Membandingkan pandangan medis, sosial dan budaya tentang Tuli"
    hi: "बधिरता पर चिकित्सा, सामाजिक और सांस्कृतिक नज़रिए की तुलना"
  - en: "Explain how hearing works and why hearing loss happens"
    zh: "解释听觉原理和听力损失的成因"
    zh-TW: "解釋聽覺原理和聽力損失的成因"
    ja: "聴覚の仕組みと難聴の原因を説明する"
    ko: "청각의 원리와 난청의 원인 설명하기"
    vi: "Giải thích cơ chế nghe và nguyên nhân mất thính lực"
    ms: "Menerangkan cara pendengaran berfungsi dan punca hilang pendengaran"
    id: "Menjelaskan cara kerja pendengaran dan penyebab gangguannya"
    hi: "सुनना कैसे काम करता है और श्रवण हानि क्यों होती है, समझाना"
  - en: "Suggest ways to include deaf and hard-of-hearing people"
    zh: "提出包容聋人和听障人士的方法"
    zh-TW: "提出包容聾人和聽障人士的方法"
    ja: "ろう者・難聴者を包摂する方法を提案する"
    ko: "농인과 난청인을 포용하는 방법 제안하기"
    vi: "Đề xuất cách hòa nhập người Điếc và người khiếm thính"
    ms: "Mencadangkan cara merangkumi orang pekak dan kurang pendengaran"
    id: "Mengusulkan cara melibatkan orang Tuli dan sulit mendengar"
    hi: "बधिर और कम सुनने वाले लोगों को शामिल करने के तरीके सुझाना"
