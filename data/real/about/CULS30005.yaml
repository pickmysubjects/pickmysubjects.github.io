code: CULS30005
year: 2026
learn:
  en: "How cities have been theorised and pictured in photos, film and writing, and the cultural and environmental issues they face now."
  zh: "城市如何被理论化，并在摄影、电影和文学中被呈现，以及城市当下面临的文化与环境问题。"
  zh-TW: "城市如何被理論化，並在攝影、電影和文學中被呈現，以及城市當下面臨的文化與環境問題。"
  ja: "都市がどう理論化され、写真・映画・文学に描かれてきたか、今の都市が抱える文化・環境の課題を学ぶ。"
  ko: "도시가 어떻게 이론화되고 사진·영화·글로 그려졌는지, 오늘날 도시의 문화·환경 문제를 배운다."
  vi: "Thành phố được lý thuyết hóa và khắc họa qua ảnh, phim, văn chương ra sao, và những vấn đề văn hóa, môi trường hiện nay."
  ms: "Cara bandar diteorikan dan digambarkan dalam foto, filem dan tulisan, serta isu budaya dan alam sekitar yang dihadapinya kini."
  id: "Cara kota diteorikan dan digambarkan dalam foto, film dan tulisan, serta masalah budaya dan lingkungan yang dihadapinya kini."
  hi: "शहरों को कैसे सिद्धांतबद्ध किया गया और तस्वीरों, फ़िल्म व लेखन में दिखाया गया, और आज उनके सामने कौन-से सांस्कृतिक व पर्यावरणीय सवाल हैं।"
outcomes:
  - en: "Explain key theories of the modern city"
    zh: "说明关于现代城市的主要理论"
    zh-TW: "說明關於現代城市的主要理論"
    ja: "近代都市についての主な理論を説明する"
    ko: "현대 도시에 관한 주요 이론 설명하기"
    vi: "Giải thích các lý thuyết chính về thành phố hiện đại"
    ms: "Terangkan teori utama tentang bandar moden"
    id: "Menjelaskan teori utama tentang kota modern"
    hi: "आधुनिक शहर के मुख्य सिद्धांत समझाना"
  - en: "Analyse how cities are shown in art and media"
    zh: "分析城市在艺术和媒体中的呈现"
    zh-TW: "分析城市在藝術和媒體中的呈現"
    ja: "芸術やメディアで都市がどう描かれるか分析する"
    ko: "예술과 미디어 속 도시 묘사 분석하기"
    vi: "Phân tích cách thành phố được thể hiện trong nghệ thuật và truyền thông"
    ms: "Analisis cara bandar dipaparkan dalam seni dan media"
    id: "Menganalisis cara kota ditampilkan dalam seni dan media"
    hi: "कला और मीडिया में शहरों को कैसे दिखाया जाता है, विश्लेषण करना"
  - en: "Discuss current urban social and green challenges"
    zh: "讨论当下城市的社会与环境挑战"
    zh-TW: "討論當下城市的社會與環境挑戰"
    ja: "今の都市の社会・環境の課題を論じる"
    ko: "현재 도시의 사회·환경 과제 논의하기"
    vi: "Thảo luận thách thức xã hội và môi trường đô thị hiện nay"
    ms: "Bincangkan cabaran sosial dan alam sekitar bandar kini"
    id: "Membahas tantangan sosial dan lingkungan kota saat ini"
    hi: "आज की शहरी सामाजिक और पर्यावरणीय चुनौतियों पर चर्चा करना"
