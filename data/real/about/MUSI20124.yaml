code: MUSI20124
year: 2026
learn:
  en: "Play in an auditioned orchestra or wind band, rehearsing and performing major symphonic works through the semester."
  zh: "通过试音加入管弦乐团或管乐团，整个学期排练并演出大型交响作品。"
  zh-TW: "通過試音加入管弦樂團或管樂團，整個學期排練並演出大型交響作品。"
  ja: "オーディションで管弦楽団か吹奏楽団に入り、学期を通じて交響作品を練習・演奏する。"
  ko: "오디션을 거쳐 오케스트라나 관악단에서 한 학기 동안 교향곡을 연습하고 공연."
  vi: "Chơi trong dàn nhạc giao hưởng hoặc kèn hơi qua thử giọng, tập và diễn tác phẩm lớn suốt học kỳ."
  ms: "Bermain dalam orkestra atau band tiup melalui uji bakat, berlatih dan membuat persembahan karya simfoni."
  id: "Bermain di orkestra atau band tiup lewat audisi, berlatih dan tampil membawakan karya simfoni."
  hi: "ऑडिशन से ऑर्केस्ट्रा या विंड बैंड में बजाना, पूरे सेमेस्टर सिम्फ़ोनिक रचनाओं का अभ्यास और प्रस्तुति।"
outcomes:
  - en: "Prepare your part for group rehearsals"
    zh: "为合排准备好自己的声部"
    zh-TW: "為合排準備好自己的聲部"
    ja: "合同練習に向けて自分のパートを準備する"
    ko: "합주를 위해 자기 파트 준비하기"
    vi: "Chuẩn bị phần của mình cho buổi tập"
    ms: "Sediakan bahagian sendiri untuk latihan"
    id: "Menyiapkan bagian sendiri untuk latihan"
    hi: "समूह रिहर्सल के लिए अपना भाग तैयार करना"
  - en: "Perform repertoire to concert standard"
    zh: "以音乐会水准演出曲目"
    zh-TW: "以音樂會水準演出曲目"
    ja: "演奏会レベルで曲を演奏する"
    ko: "연주회 수준으로 곡 연주하기"
    vi: "Biểu diễn tác phẩm ở chuẩn hòa nhạc"
    ms: "Persembahkan karya pada tahap konsert"
    id: "Membawakan repertoar setara konser"
    hi: "कॉन्सर्ट स्तर पर रचनाएँ प्रस्तुत करना"
  - en: "Work confidently as part of an ensemble"
    zh: "自信地作为合奏团的一员合作"
    zh-TW: "自信地作為合奏團的一員合作"
    ja: "アンサンブルの一員として自信を持って演奏する"
    ko: "앙상블의 일원으로 자신 있게 협업하기"
    vi: "Tự tin phối hợp trong một ban nhạc"
    ms: "Bekerja yakin sebagai ahli ensembel"
    id: "Bekerja percaya diri dalam ensambel"
    hi: "समूह के सदस्य के रूप में आत्मविश्वास से बजाना"
