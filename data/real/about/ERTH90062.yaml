code: ERTH90062
year: 2027
learn:
  en: "How geoscience methods like dating, isotopes and provenance answer archaeology questions, with a focus on Indigenous Australia."
  zh: "如何用测年、同位素和溯源等地球科学方法解答考古问题，重点关注澳大利亚原住民考古。"
  zh-TW: "如何用定年、同位素與溯源等地球科學方法解答考古問題，重點關注澳洲原住民考古。"
  ja: "年代測定、同位体、産地推定など地球科学の手法で考古学の問いに答える。先住民考古学が中心。"
  ko: "연대 측정, 동위원소, 산지 추정 등 지구과학 방법으로 고고학 질문에 답합니다. 원주민 고고학 중심."
  vi: "Dùng phương pháp địa chất như định tuổi, đồng vị, nguồn gốc để trả lời câu hỏi khảo cổ, tập trung Úc bản địa."
  ms: "Kaedah geosains seperti pentarikhan, isotop dan asal usul untuk soalan arkeologi, fokus Orang Asli Australia."
  id: "Metode geosains seperti penanggalan, isotop, dan asal-usul untuk menjawab soal arkeologi, fokus Pribumi Australia."
  hi: "डेटिंग, आइसोटोप और उत्पत्ति जैसी भू-विज्ञान विधियों से पुरातत्व प्रश्न, स्वदेशी ऑस्ट्रेलिया पर ध्यान।"
outcomes:
  - en: "Apply geology to archaeological science questions"
    zh: "用地质知识解答考古科学问题"
    zh-TW: "用地質知識解答考古科學問題"
    ja: "地質学の知識を考古学の問いに使う"
    ko: "지질학 지식을 고고과학 질문에 적용하기"
    vi: "Áp dụng địa chất vào câu hỏi khảo cổ"
    ms: "Mengaplikasi geologi pada soalan arkeologi"
    id: "Menerapkan geologi pada soal arkeologi"
    hi: "भूविज्ञान को पुरातत्व प्रश्नों पर लागू करना"
  - en: "Choose methods for dating and provenance"
    zh: "为测年和溯源选择合适方法"
    zh-TW: "為定年與溯源選擇合適方法"
    ja: "年代測定と産地推定の手法を選ぶ"
    ko: "연대 측정과 산지 추정 방법 고르기"
    vi: "Chọn phương pháp định tuổi và nguồn gốc"
    ms: "Memilih kaedah pentarikhan dan asal usul"
    id: "Memilih metode penanggalan dan asal-usul"
    hi: "डेटिंग व उत्पत्ति के तरीके चुनना"
