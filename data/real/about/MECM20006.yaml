code: MECM20006
year: 2026
learn:
  en: "How Australian media works, from ownership, regulation and public broadcasting to news, advertising and journalism ethics."
  zh: "澳大利亚媒体如何运作：从所有权、监管和公共广播，到新闻、广告和新闻伦理。"
  zh-TW: "澳洲媒體如何運作：從所有權、監管和公共廣播，到新聞、廣告和新聞倫理。"
  ja: "オーストラリアのメディアの仕組みを、所有・規制・公共放送からニュース、広告、報道倫理まで学ぶ。"
  ko: "호주 미디어가 어떻게 돌아가는지 소유 구조, 규제, 공영 방송부터 뉴스, 광고, 언론 윤리까지 배운다."
  vi: "Truyền thông Úc vận hành ra sao, từ quyền sở hữu, quản lý, phát thanh công cộng đến tin tức, quảng cáo và đạo đức báo chí."
  ms: "Cara media Australia berfungsi, dari pemilikan, peraturan dan penyiaran awam hingga berita, pengiklanan dan etika kewartawanan."
  id: "Cara kerja media Australia, dari kepemilikan, regulasi, dan penyiaran publik hingga berita, iklan, dan etika jurnalistik."
  hi: "ऑस्ट्रेलियाई मीडिया कैसे चलता है: स्वामित्व, नियमन और सार्वजनिक प्रसारण से लेकर खबरें, विज्ञापन और पत्रकारिता की नैतिकता तक।"
outcomes:
  - en: "Describe past and current issues in Australian media"
    zh: "描述澳大利亚媒体过去和现在的主要问题"
    zh-TW: "描述澳洲媒體過去和現在的主要問題"
    ja: "オーストラリアのメディアの過去と現在の課題を説明する"
    ko: "호주 미디어의 과거와 현재 쟁점 설명하기"
    vi: "Mô tả các vấn đề xưa và nay của truyền thông Úc"
    ms: "Huraikan isu lalu dan semasa media Australia"
    id: "Menjelaskan isu lama dan terkini media Australia"
    hi: "ऑस्ट्रेलियाई मीडिया के पुराने और मौजूदा मुद्दे बताना"
  - en: "Identify the interest groups behind Australian media"
    zh: "识别影响澳大利亚媒体的利益群体"
    zh-TW: "辨識影響澳洲媒體的利益團體"
    ja: "オーストラリアのメディアに関わる利害集団を見極める"
    ko: "호주 미디어에 얽힌 이해 집단 파악하기"
    vi: "Nhận ra các nhóm lợi ích đứng sau truyền thông Úc"
    ms: "Kenal pasti kumpulan berkepentingan di sebalik media Australia"
    id: "Mengenali kelompok kepentingan di balik media Australia"
    hi: "ऑस्ट्रेलियाई मीडिया के पीछे के हित-समूह पहचानना"
  - en: "Judge media content as an informed citizen"
    zh: "以知情公民的眼光评判媒体内容"
    zh-TW: "以知情公民的眼光評判媒體內容"
    ja: "情報を持つ市民としてメディアの内容を判断する"
    ko: "깨어 있는 시민으로서 미디어 내용 판단하기"
    vi: "Đánh giá nội dung truyền thông như một công dân hiểu biết"
    ms: "Menilai kandungan media sebagai rakyat yang celik"
    id: "Menilai konten media sebagai warga yang melek informasi"
    hi: "एक जागरूक नागरिक की तरह मीडिया सामग्री को परखना"
