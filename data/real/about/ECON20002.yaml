code: ECON20002
year: 2026
learn:
  en: "Deeper theory of how consumers and firms decide, including under risk and limited information."
  zh: "深入学消费者和企业怎么做决定，包括有风险和信息不全时。"
  zh-TW: "深入學習消費者和企業怎麼做決定，包括有風險和資訊不全時。"
  ja: "消費者と企業の意思決定をより深く学ぶ。リスクや情報が限られる場合も含む。"
  ko: "소비자와 기업의 의사결정에 대한 심화 이론. 위험과 정보 부족 상황 포함."
  vi: "Lý thuyết sâu hơn về cách người tiêu dùng và doanh nghiệp ra quyết định, kể cả khi có rủi ro và thiếu thông tin."
  ms: "Teori lebih mendalam tentang keputusan pengguna dan firma, termasuk di bawah risiko dan maklumat terhad."
  id: "Teori lebih dalam tentang cara konsumen dan perusahaan memutuskan, termasuk saat ada risiko dan informasi terbatas."
  hi: "उपभोक्ता और कंपनियाँ फ़ैसले कैसे लेती हैं, इसका गहरा सिद्धांत, जोखिम और सीमित जानकारी में भी।"
outcomes:
  - en: "Apply theory to business and policy problems"
    zh: "用理论分析商业和政策问题"
    zh-TW: "用理論分析商業和政策問題"
    ja: "理論をビジネスや政策の問題に応用する"
    ko: "이론을 경영·정책 문제에 적용"
    vi: "Áp dụng lý thuyết vào vấn đề kinh doanh và chính sách"
    ms: "Guna teori pada masalah perniagaan dan dasar"
    id: "Menerapkan teori pada masalah bisnis dan kebijakan"
    hi: "बिज़नेस और नीति की समस्याओं पर सिद्धांत लगाना"
  - en: "Judge the limits of economic models"
    zh: "判断经济模型的局限"
    zh-TW: "判斷經濟模型的侷限"
    ja: "経済モデルの限界を見極める"
    ko: "경제 모형의 한계 판단"
    vi: "Đánh giá giới hạn của mô hình kinh tế"
    ms: "Nilai had model ekonomi"
    id: "Menilai batasan model ekonomi"
    hi: "आर्थिक मॉडलों की सीमाएँ परखना"
  - en: "Assess the roles of markets and government"
    zh: "评估市场和政府的作用"
    zh-TW: "評估市場和政府的角色"
    ja: "市場と政府の役割を評価する"
    ko: "시장과 정부의 역할 평가"
    vi: "Đánh giá vai trò của thị trường và chính phủ"
    ms: "Nilai peranan pasaran dan kerajaan"
    id: "Menilai peran pasar dan pemerintah"
    hi: "बाज़ार और सरकार की भूमिका का आकलन"
