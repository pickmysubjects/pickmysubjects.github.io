code: CMCE30003
year: 2026
learn:
  en: "Using machine learning in Python to predict things like customer behaviour and help businesses decide."
  zh: "用Python做机器学习，预测顾客行为等，帮助企业做决策。"
  zh-TW: "用Python做機器學習，預測顧客行為等，協助企業做決策。"
  ja: "Pythonで機械学習を使い、顧客の行動などを予測して企業の意思決定を助ける。"
  ko: "Python 머신러닝으로 고객 행동 등을 예측해 기업 의사결정 돕기."
  vi: "Dùng học máy bằng Python để dự đoán hành vi khách hàng và hỗ trợ doanh nghiệp ra quyết định."
  ms: "Guna pembelajaran mesin dalam Python untuk ramal tingkah laku pelanggan dan bantu keputusan perniagaan."
  id: "Memakai machine learning di Python untuk memprediksi perilaku pelanggan dan membantu keputusan bisnis."
  hi: "Python में मशीन लर्निंग से ग्राहक व्यवहार जैसी चीज़ें भाँपना और कंपनियों को फ़ैसले में मदद करना।"
outcomes:
  - en: "Build models like decision trees, neural networks and clusters"
    zh: "构建决策树、神经网络和聚类等模型"
    zh-TW: "建立決策樹、神經網路和分群等模型"
    ja: "決定木・ニューラルネット・クラスタリングのモデルを作る"
    ko: "의사결정나무, 신경망, 군집 모델 만들기"
    vi: "Xây mô hình cây quyết định, mạng nơ-ron và phân cụm"
    ms: "Bina model seperti pepohon keputusan, rangkaian neural dan kluster"
    id: "Membangun model pohon keputusan, jaringan saraf, dan klaster"
    hi: "डिसीज़न ट्री, न्यूरल नेटवर्क और क्लस्टरिंग मॉडल बनाना"
  - en: "Prepare business data in Python for modelling"
    zh: "用Python整理业务数据以供建模"
    zh-TW: "用Python整理業務資料以供建模"
    ja: "Pythonで業務データをモデル用に整える"
    ko: "Python으로 비즈니스 데이터를 모델링용으로 준비"
    vi: "Chuẩn bị dữ liệu kinh doanh bằng Python để lập mô hình"
    ms: "Sediakan data perniagaan dalam Python untuk pemodelan"
    id: "Menyiapkan data bisnis di Python untuk pemodelan"
    hi: "Python में बिज़नेस डेटा को मॉडलिंग के लिए तैयार करना"
  - en: "Think through the ethics of AI in business"
    zh: "思考商业中AI的伦理问题"
    zh-TW: "思考商業中AI的倫理議題"
    ja: "ビジネスにおけるAIの倫理を考える"
    ko: "비즈니스 속 AI 윤리 고민하기"
    vi: "Suy xét đạo đức của AI trong kinh doanh"
    ms: "Fikirkan etika AI dalam perniagaan"
    id: "Memikirkan etika AI dalam bisnis"
    hi: "बिज़नेस में AI की नैतिकता पर सोचना"
