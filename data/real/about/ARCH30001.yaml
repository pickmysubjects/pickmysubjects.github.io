code: ARCH30001
year: 2026
learn:
  en: "A third-year architecture studio on planning and spatial order: how buildings shape a community's social and civic life."
  zh: "三年级建筑设计课，聚焦规划与空间秩序：建筑如何塑造社区的社会和公共生活。"
  zh-TW: "三年級建築設計課，聚焦規劃與空間秩序：建築如何形塑社區的社會與公共生活。"
  ja: "計画と空間秩序を扱う3年次の建築スタジオ。建築が地域の社会・公共生活をどう形づくるかを考える。"
  ko: "계획과 공간 질서를 다루는 3학년 건축 스튜디오. 건축이 공동체의 사회·시민 생활을 어떻게 만드는지 탐구."
  vi: "Studio kiến trúc năm 3 về quy hoạch và trật tự không gian: công trình định hình đời sống cộng đồng ra sao."
  ms: "Studio seni bina tahun 3 tentang perancangan dan susunan ruang: bagaimana bangunan membentuk kehidupan komuniti."
  id: "Studio arsitektur tahun 3 tentang perencanaan dan tatanan ruang: bagaimana bangunan membentuk kehidupan komunitas."
  hi: "योजना और स्थानिक क्रम पर तीसरे वर्ष का आर्किटेक्चर स्टूडियो: इमारतें समुदाय के सामाजिक जीवन को कैसे गढ़ती हैं।"
outcomes:
  - en: "Organise a complex building programme clearly"
    zh: "清晰地组织复杂的建筑功能"
    zh-TW: "清楚地組織複雜的建築機能"
    ja: "複雑な建築プログラムを明快にまとめる"
    ko: "복잡한 건축 프로그램을 명확히 구성하기"
    vi: "Sắp xếp rõ ràng công năng phức tạp của công trình"
    ms: "Susun program bangunan kompleks dengan jelas"
    id: "Menata program bangunan yang rumit dengan jelas"
    hi: "जटिल भवन कार्यक्रम को स्पष्ट रूप से व्यवस्थित करना"
  - en: "Link design choices to community and civic needs"
    zh: "把设计决策与社区和公共需求联系起来"
    zh-TW: "把設計決策與社區和公共需求連結起來"
    ja: "設計判断を地域や公共のニーズと結びつける"
    ko: "설계 결정을 공동체·공공의 필요와 연결하기"
    vi: "Gắn lựa chọn thiết kế với nhu cầu cộng đồng"
    ms: "Kaitkan keputusan reka bentuk dengan keperluan komuniti"
    id: "Mengaitkan keputusan desain dengan kebutuhan komunitas"
    hi: "डिज़ाइन फ़ैसलों को सामुदायिक ज़रूरतों से जोड़ना"
  - en: "Communicate a scheme through drawings, models and talks"
    zh: "用图纸、模型和汇报表达方案"
    zh-TW: "用圖面、模型和簡報表達方案"
    ja: "図面・模型・発表で案を伝える"
    ko: "도면·모형·발표로 안 전달하기"
    vi: "Truyền đạt phương án bằng bản vẽ, mô hình, thuyết trình"
    ms: "Sampaikan skema melalui lukisan, model dan pembentangan"
    id: "Menyampaikan rancangan lewat gambar, maket, dan presentasi"
    hi: "ड्रॉइंग, मॉडल और प्रस्तुति से योजना समझाना"
