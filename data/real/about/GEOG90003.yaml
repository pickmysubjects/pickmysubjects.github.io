code: GEOG90003
year: 2027
learn:
  en: "How rivers work physically and ecologically, and how to plan and carry out river and catchment management."
  zh: "河流的物理与生态过程，以及如何制定和实施河流与流域管理。"
  zh-TW: "河流的物理與生態過程，以及如何制定和實施河流與流域管理。"
  ja: "河川の物理・生態的なしくみと、河川・流域管理の計画と実施。"
  ko: "하천의 물리적·생태적 작동 원리와 하천·유역 관리 계획 및 실행."
  vi: "Cách sông vận hành về vật lý và sinh thái, và cách lập, thực hiện quản lý sông và lưu vực."
  ms: "Cara sungai berfungsi secara fizikal dan ekologi, serta merancang dan melaksana pengurusan sungai dan tadahan."
  id: "Cara sungai bekerja secara fisik dan ekologis, serta merencanakan dan menjalankan pengelolaan sungai dan DAS."
  hi: "नदियाँ भौतिक व पारिस्थितिक रूप से कैसे काम करती हैं, और नदी व जलग्रहण प्रबंधन की योजना।"
outcomes:
  - en: "Explain river processes and functions"
    zh: "解释河流的过程与功能"
    zh-TW: "解釋河流的過程與功能"
    ja: "河川のプロセスと機能を説明する"
    ko: "하천의 과정과 기능 설명하기"
    vi: "Giải thích các quá trình và chức năng của sông"
    ms: "Menerangkan proses dan fungsi sungai"
    id: "Menjelaskan proses dan fungsi sungai"
    hi: "नदी की प्रक्रियाएँ और कार्य समझाना"
  - en: "Use the policy framework for river management"
    zh: "运用河流管理的政策框架"
    zh-TW: "運用河流管理的政策框架"
    ja: "河川管理の政策枠組みを使う"
    ko: "하천 관리 정책 틀 활용하기"
    vi: "Áp dụng khung chính sách quản lý sông"
    ms: "Menggunakan rangka dasar pengurusan sungai"
    id: "Memakai kerangka kebijakan pengelolaan sungai"
    hi: "नदी प्रबंधन की नीति रूपरेखा लागू करना"
  - en: "Develop a river or catchment management plan"
    zh: "制定河流或流域管理计划"
    zh-TW: "制定河流或流域管理計畫"
    ja: "河川・流域の管理計画を作る"
    ko: "하천·유역 관리 계획 세우기"
    vi: "Xây dựng kế hoạch quản lý sông hoặc lưu vực"
    ms: "Membangunkan pelan pengurusan sungai atau tadahan"
    id: "Menyusun rencana pengelolaan sungai atau DAS"
    hi: "नदी या जलग्रहण प्रबंधन योजना बनाना"
