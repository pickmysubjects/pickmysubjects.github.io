code: PHYC10009
year: 2026
learn:
  en: "Physics for students with little background: motion, waves, electricity, magnetism and key modern experiments."
  zh: "给物理基础少的人：运动、波、电、磁和近代物理实验。"
  zh-TW: "給物理基礎少的人：運動、波、電、磁和近代物理實驗。"
  ja: "物理の予備知識が少ない人向け：運動、波、電気、磁気、重要な現代の実験。"
  ko: "물리 배경이 적은 학생용: 운동, 파동, 전기, 자기, 주요 현대 실험."
  vi: "Vật lý cho SV ít nền tảng: chuyển động, sóng, điện, từ và các thí nghiệm hiện đại quan trọng."
  ms: "Fizik untuk pelajar kurang asas: gerakan, gelombang, elektrik, magnet dan eksperimen moden penting."
  id: "Fisika untuk mahasiswa dengan sedikit dasar: gerak, gelombang, listrik, magnet, dan eksperimen modern penting."
  hi: "कम बैकग्राउंड वालों के लिए फ़िज़िक्स: गति, तरंगें, बिजली, चुंबकत्व और अहम आधुनिक प्रयोग।"
outcomes:
  - en: "Explain basic physics ideas in everyday terms"
    zh: "用日常的话讲清基础物理概念"
    zh-TW: "用日常的話講清基礎物理概念"
    ja: "基本的な物理の考え方を身近な言葉で説明する"
    ko: "기초 물리 개념을 일상 언어로 설명"
    vi: "Giải thích khái niệm vật lý cơ bản bằng lời đời thường"
    ms: "Terangkan idea asas fizik dalam bahasa harian"
    id: "Menjelaskan konsep dasar fisika dengan bahasa sehari-hari"
    hi: "बेसिक फ़िज़िक्स आम भाषा में समझाना"
  - en: "Solve simple physics problems with maths"
    zh: "用数学解简单物理题"
    zh-TW: "用數學解簡單物理題"
    ja: "数学で簡単な物理の問題を解く"
    ko: "수학으로 간단한 물리 문제 풀기"
    vi: "Giải bài vật lý đơn giản bằng toán"
    ms: "Selesaikan masalah fizik mudah dengan matematik"
    id: "Menyelesaikan soal fisika sederhana dengan matematika"
    hi: "मैथ्स से आसान फ़िज़िक्स सवाल हल करना"
  - en: "Take measurements in the lab and interpret them"
    zh: "在实验室测量并解读数据"
    zh-TW: "在實驗室測量並解讀數據"
    ja: "実験室で測定し、結果を解釈する"
    ko: "실험실에서 측정하고 해석"
    vi: "Đo đạc trong lab và giải thích kết quả"
    ms: "Buat pengukuran di makmal dan tafsirkannya"
    id: "Melakukan pengukuran di lab dan menafsirkannya"
    hi: "लैब में माप लेना और उन्हें समझना"
