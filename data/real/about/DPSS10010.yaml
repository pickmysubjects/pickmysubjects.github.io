code: DPSS10010
year: 2026
learn:
  en: "Pick three stage production areas, such as lighting, sound, costume or stage management, and practise them in studio."
  zh: "从灯光、音响、服装、舞台监督等方向选三个，在工作室中实践舞台制作。"
  zh-TW: "從燈光、音響、服裝、舞台監督等方向選三個，在工作室中實作舞台製作。"
  ja: "照明・音響・衣装・舞台監督などから3分野を選び、スタジオで舞台制作を実践する。"
  ko: "조명, 음향, 의상, 무대 감독 등에서 세 분야를 골라 스튜디오에서 무대 제작을 실습한다."
  vi: "Chọn ba mảng sản xuất sân khấu như ánh sáng, âm thanh, trang phục hay quản lý sân khấu để thực hành."
  ms: "Pilih tiga bidang produksi pentas seperti pencahayaan, bunyi, kostum atau pengurusan pentas dan amalkannya."
  id: "Pilih tiga bidang produksi panggung seperti tata cahaya, suara, kostum, atau manajemen panggung dan praktikkan."
  hi: "लाइटिंग, साउंड, कॉस्ट्यूम या स्टेज मैनेजमेंट जैसे तीन क्षेत्र चुनकर स्टूडियो में अभ्यास करना।"
outcomes:
  - en: "Use technical skills to realise live shows"
    zh: "运用技术技能实现现场演出"
    zh-TW: "運用技術技能實現現場演出"
    ja: "技術でライブ公演を形にする"
    ko: "기술로 라이브 공연 구현하기"
    vi: "Dùng kỹ năng kỹ thuật để dựng buổi diễn trực tiếp"
    ms: "Guna kemahiran teknikal untuk persembahan langsung"
    id: "Memakai keterampilan teknis untuk pertunjukan langsung"
    hi: "लाइव शो के लिए तकनीकी कौशल लगाना"
  - en: "Work well with theatre makers and crews"
    zh: "与戏剧创作者和制作团队有效合作"
    zh-TW: "與劇場創作者和製作團隊有效合作"
    ja: "演劇の作り手やスタッフと協力する"
    ko: "연극 제작자·스태프와 협업하기"
    vi: "Phối hợp tốt với người làm sân khấu và ê-kíp"
    ms: "Bekerjasama dengan pembikin teater dan krew"
    id: "Bekerja sama dengan pembuat teater dan kru"
    hi: "थिएटर मेकर्स और क्रू के साथ अच्छे से काम करना"
  - en: "Follow safe practice in technical theatre"
    zh: "在舞台技术工作中遵守安全规范"
    zh-TW: "在舞台技術工作中遵守安全規範"
    ja: "舞台技術で安全な作業を守る"
    ko: "무대 기술 작업의 안전 수칙 지키기"
    vi: "Tuân thủ an toàn trong kỹ thuật sân khấu"
    ms: "Mematuhi amalan selamat dalam teater teknikal"
    id: "Menerapkan praktik aman di teknik panggung"
    hi: "तकनीकी थिएटर में सुरक्षित तरीक़े अपनाना"
