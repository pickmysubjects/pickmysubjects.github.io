code: FLTV30009
year: 2026
learn:
  en: "Directing actors for the screen, working with professional actors, plus short exercises in film form."
  zh: "为银幕导演演员，与职业演员合作，并做电影形式短练习。"
  zh-TW: "為銀幕導演演員，與職業演員合作，並做電影形式短練習。"
  ja: "映像のための俳優演出をプロ俳優と学び、映画形式の短い演習も行う。"
  ko: "프로 배우와 함께 스크린 연기 연출을 배우고 영화 형식 단편 연습을 한다."
  vi: "Đạo diễn diễn viên cho màn ảnh với diễn viên chuyên nghiệp, kèm bài tập hình thức phim."
  ms: "Mengarah pelakon untuk skrin bersama pelakon profesional, serta latihan bentuk filem."
  id: "Menyutradarai aktor untuk layar bersama aktor profesional, plus latihan bentuk film."
  hi: "पेशेवर अभिनेताओं के साथ स्क्रीन के लिए अभिनय निर्देशन, और फ़िल्म-रूप के छोटे अभ्यास।"
outcomes:
  - en: "Direct actors through a 3-minute scene"
    zh: "指导演员完成3分钟的戏"
    zh-TW: "指導演員完成 3 分鐘的戲"
    ja: "3分の場面で俳優を演出する"
    ko: "3분 장면에서 배우 연출하기"
    vi: "Đạo diễn diễn viên trong cảnh 3 phút"
    ms: "Arah pelakon dalam babak 3 minit"
    id: "Mengarahkan aktor dalam adegan 3 menit"
    hi: "3 मिनट के दृश्य में अभिनेताओं का निर्देशन"
  - en: "Shoot short exercises in film language"
    zh: "拍摄电影语言短练习"
    zh-TW: "拍攝電影語言短練習"
    ja: "映画言語の短い演習を撮る"
    ko: "영화 언어 단편 연습 촬영하기"
    vi: "Quay bài tập ngắn về ngôn ngữ điện ảnh"
    ms: "Rakam latihan pendek bahasa filem"
    id: "Merekam latihan pendek bahasa film"
    hi: "फ़िल्म भाषा के छोटे अभ्यास शूट करना"
  - en: "Explain your own approach to directing"
    zh: "说明自己的导演理念"
    zh-TW: "說明自己的導演理念"
    ja: "自分の演出観を説明する"
    ko: "자신의 연출 방식 설명하기"
    vi: "Trình bày cách đạo diễn của riêng bạn"
    ms: "Jelaskan pendekatan pengarahan sendiri"
    id: "Menjelaskan pendekatan sutradara sendiri"
    hi: "निर्देशन का अपना तरीका बताना"
