code: ISYS90109
year: 2027
learn:
  en: "A supervised research project in Information Systems: review the literature, collect and analyse data, and report the findings."
  zh: "在导师指导下完成信息系统研究项目：文献综述、收集和分析数据，并汇报研究结果。"
  zh-TW: "在導師指導下完成資訊系統研究專案：文獻回顧、蒐集與分析資料，並發表研究成果。"
  ja: "指導教員のもとで行う情報システムの研究：文献調査、データ収集と分析、成果の報告。"
  ko: "지도교수와 함께하는 정보시스템 연구: 문헌 검토, 데이터 수집·분석, 결과 보고."
  vi: "Dự án nghiên cứu Hệ thống Thông tin có hướng dẫn: tổng quan tài liệu, thu thập, phân tích dữ liệu, báo cáo."
  ms: "Projek penyelidikan Sistem Maklumat berpenyelia: kajian literatur, kumpul dan analisis data, laporkan dapatan."
  id: "Proyek riset Sistem Informasi dengan pembimbing: tinjauan pustaka, kumpulkan dan analisis data, laporkan hasil."
  hi: "पर्यवेक्षक के साथ सूचना प्रणाली पर शोध प्रोजेक्ट: साहित्य समीक्षा, डेटा जुटाना व विश्लेषण, नतीजों की रिपोर्ट।"
outcomes:
  - en: "Turn a topic into a clear research question"
    zh: "将研究主题转化为清晰的研究问题"
    zh-TW: "將研究主題轉化為清楚的研究問題"
    ja: "テーマを明確な研究課題にする"
    ko: "주제를 명확한 연구 질문으로 만들기"
    vi: "Biến một chủ đề thành câu hỏi nghiên cứu rõ ràng"
    ms: "Menukar topik menjadi soalan kajian yang jelas"
    id: "Mengubah topik menjadi pertanyaan riset yang jelas"
    hi: "किसी विषय को साफ़ शोध प्रश्न में बदलना"
  - en: "Review and critique published research"
    zh: "综述并评析已发表的研究"
    zh-TW: "回顧並評析已發表的研究"
    ja: "既存の研究を整理し批判的に読む"
    ko: "발표된 연구를 검토하고 비평하기"
    vi: "Tổng quan và phê bình các nghiên cứu đã công bố"
    ms: "Mengkaji dan mengkritik penyelidikan terbitan"
    id: "Meninjau dan mengkritisi riset yang sudah terbit"
    hi: "प्रकाशित शोध की समीक्षा और आलोचना करना"
