code: ASIA20009
year: 2026
learn:
  en: "Why many people in Asia stay poor for a long time, looking at rural and urban poverty in China, India and South Asia."
  zh: "为什么亚洲许多人长期贫困，聚焦中国、印度和南亚的城乡贫困。"
  zh-TW: "為什麼亞洲許多人長期貧困，聚焦中國、印度和南亞的城鄉貧困。"
  ja: "なぜアジアの多くの人が長く貧困にとどまるのかを、中国・インド・南アジアの農村と都市から見る。"
  ko: "왜 아시아의 많은 사람이 오래 가난한지 중국, 인도, 남아시아의 농촌·도시 빈곤으로 살펴본다."
  vi: "Vì sao nhiều người ở châu Á nghèo lâu dài, xem xét nghèo đói nông thôn và đô thị ở Trung Quốc, Ấn Độ và Nam Á."
  ms: "Mengapa ramai orang di Asia kekal miskin lama, melihat kemiskinan luar bandar dan bandar di China, India dan Asia Selatan."
  id: "Mengapa banyak orang di Asia lama hidup miskin, melihat kemiskinan desa dan kota di Tiongkok, India, dan Asia Selatan."
  hi: "एशिया में बहुत लोग लंबे समय तक गरीब क्यों रहते हैं, चीन, भारत और दक्षिण एशिया की ग्रामीण-शहरी गरीबी से।"
outcomes:
  - en: "Explain causes of long-term poverty"
    zh: "解释长期贫困的成因"
    zh-TW: "解釋長期貧困的成因"
    ja: "長期的な貧困の原因を説明する"
    ko: "장기 빈곤의 원인 설명하기"
    vi: "Giải thích nguyên nhân của nghèo đói kéo dài"
    ms: "Terangkan punca kemiskinan jangka panjang"
    id: "Menjelaskan penyebab kemiskinan jangka panjang"
    hi: "लंबे समय की गरीबी के कारण समझाना"
  - en: "Compare rural and urban poverty in Asia"
    zh: "比较亚洲城乡贫困"
    zh-TW: "比較亞洲城鄉貧困"
    ja: "アジアの農村と都市の貧困を比べる"
    ko: "아시아의 농촌·도시 빈곤 비교하기"
    vi: "So sánh nghèo đói nông thôn và đô thị ở châu Á"
    ms: "Bandingkan kemiskinan luar bandar dan bandar di Asia"
    id: "Membandingkan kemiskinan desa dan kota di Asia"
    hi: "एशिया में ग्रामीण और शहरी गरीबी की तुलना करना"
  - en: "Assess policies that aim to reduce poverty"
    zh: "评估减贫政策"
    zh-TW: "評估減貧政策"
    ja: "貧困削減の政策を評価する"
    ko: "빈곤 감소 정책 평가하기"
    vi: "Đánh giá các chính sách giảm nghèo"
    ms: "Nilai dasar untuk mengurangkan kemiskinan"
    id: "Menilai kebijakan pengurangan kemiskinan"
    hi: "गरीबी घटाने वाली नीतियों का आकलन करना"
