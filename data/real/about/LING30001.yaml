code: LING30001
year: 2026
learn:
  en: "How much the world's languages differ, what they share, and how language systems change over time."
  zh: "世界语言差别有多大、有何共性，以及语言系统如何随时间变化。"
  zh-TW: "世界語言差別有多大、有何共性，以及語言系統如何隨時間變化。"
  ja: "世界の言語はどれほど違い、何を共有し、言語の仕組みが時間とともにどう変わるかを学ぶ。"
  ko: "세계 언어들이 얼마나 다르고 무엇을 공유하는지, 언어 체계가 시간에 따라 어떻게 변하는지 배운다."
  vi: "Các ngôn ngữ trên thế giới khác nhau đến đâu, có gì chung, và hệ thống ngôn ngữ thay đổi theo thời gian ra sao."
  ms: "Sejauh mana bahasa dunia berbeza, apa yang dikongsi, dan cara sistem bahasa berubah dari masa ke masa."
  id: "Seberapa jauh bahasa-bahasa dunia berbeda, apa kesamaannya, dan cara sistem bahasa berubah seiring waktu."
  hi: "दुनिया की भाषाएँ कितनी अलग हैं, उनमें क्या साझा है, और भाषा प्रणालियाँ समय के साथ कैसे बदलती हैं।"
outcomes:
  - en: "Evaluate debates on language origins and diversity"
    zh: "评价关于语言起源和多样性的争论"
    zh-TW: "評價關於語言起源和多樣性的爭論"
    ja: "言語の起源と多様性をめぐる論争を評価する"
    ko: "언어의 기원과 다양성에 관한 논쟁 평가하기"
    vi: "Đánh giá tranh luận về nguồn gốc và sự đa dạng ngôn ngữ"
    ms: "Nilai perdebatan tentang asal usul dan kepelbagaian bahasa"
    id: "Menilai perdebatan soal asal usul dan keragaman bahasa"
    hi: "भाषा की उत्पत्ति और विविधता पर बहसों को परखना"
  - en: "Take a position in linguistic theory debates"
    zh: "在语言学理论争论中表明立场"
    zh-TW: "在語言學理論爭論中表明立場"
    ja: "言語学の理論論争で立場を示す"
    ko: "언어학 이론 논쟁에서 입장 정하기"
    vi: "Đưa ra quan điểm trong tranh luận lý thuyết ngôn ngữ học"
    ms: "Ambil pendirian dalam perdebatan teori linguistik"
    id: "Mengambil sikap dalam perdebatan teori linguistik"
    hi: "भाषाविज्ञान के सैद्धांतिक बहसों में अपना पक्ष रखना"
  - en: "Analyse how language systems change over time"
    zh: "分析语言系统如何随时间演变"
    zh-TW: "分析語言系統如何隨時間演變"
    ja: "言語の仕組みが時間とともにどう変わるか分析する"
    ko: "언어 체계가 시간에 따라 어떻게 변하는지 분석하기"
    vi: "Phân tích hệ thống ngôn ngữ thay đổi theo thời gian ra sao"
    ms: "Analisis cara sistem bahasa berubah dari masa ke masa"
    id: "Menganalisis cara sistem bahasa berubah seiring waktu"
    hi: "भाषा प्रणालियाँ समय के साथ कैसे बदलती हैं, विश्लेषण करना"
