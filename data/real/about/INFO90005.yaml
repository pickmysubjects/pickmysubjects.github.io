code: INFO90005
year: 2027
learn:
  en: "Using AI methods to design, build and test interactive systems that give people a better experience."
  zh: "用人工智能方法设计、开发和评估交互系统，改善用户体验。"
  zh-TW: "用人工智慧方法設計、開發和評估互動系統，改善使用者體驗。"
  ja: "AIを使って対話型システムを設計・開発・評価し、体験を良くする。"
  ko: "AI 기법으로 인터랙티브 시스템을 설계·개발·평가해 사용자 경험 개선하기."
  vi: "Dùng AI để thiết kế, xây dựng và đánh giá hệ thống tương tác, cải thiện trải nghiệm người dùng."
  ms: "Menggunakan AI untuk mereka bentuk, membina dan menilai sistem interaktif bagi pengalaman pengguna lebih baik."
  id: "Memakai AI untuk merancang, membangun, dan menguji sistem interaktif demi pengalaman pengguna."
  hi: "AI से इंटरैक्टिव सिस्टम डिज़ाइन, विकसित और परखना ताकि यूज़र अनुभव बेहतर हो।"
outcomes:
  - en: "Apply AI techniques to improve a user interface"
    zh: "运用AI技术改进用户界面"
    zh-TW: "運用AI技術改善使用者介面"
    ja: "AI技術でUIを改善する"
    ko: "AI 기법으로 사용자 인터페이스 개선하기"
    vi: "Áp dụng AI để cải thiện giao diện người dùng"
    ms: "Menggunakan AI untuk menambah baik antara muka"
    id: "Menerapkan AI untuk memperbaiki antarmuka"
    hi: "AI तकनीकों से यूज़र इंटरफ़ेस सुधारना"
  - en: "Evaluate AI-driven interactive systems with users"
    zh: "和用户一起评估AI交互系统"
    zh-TW: "與使用者一起評估AI互動系統"
    ja: "AI搭載システムをユーザーと評価する"
    ko: "사용자와 함께 AI 기반 시스템 평가하기"
    vi: "Đánh giá hệ thống tương tác dùng AI cùng người dùng"
    ms: "Menilai sistem interaktif berasaskan AI bersama pengguna"
    id: "Menguji sistem interaktif berbasis AI bersama pengguna"
    hi: "यूज़र्स के साथ AI-आधारित सिस्टम परखना"
