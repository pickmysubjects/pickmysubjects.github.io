code: AGRI30046
year: 2026
learn:
  en: "Agronomy for efficient, sustainable Australian farms: yields, fertiliser, pests, field trials and decision tools."
  zh: "澳大利亚农场的高效可持续农艺：产量、施肥、病虫害和田间试验。"
  zh-TW: "澳洲農場的高效永續農藝：產量、施肥、病蟲害與田間試驗。"
  ja: "効率的で持続可能な豪州農業の農学：収量、施肥、病害虫、圃場試験。"
  ko: "효율적이고 지속 가능한 호주 농업의 농학: 수량, 시비, 병해충, 포장 시험."
  vi: "Nông học cho trang trại Úc hiệu quả, bền vững: năng suất, phân bón, sâu bệnh, thí nghiệm đồng ruộng."
  ms: "Agronomi untuk ladang Australia yang cekap dan mampan: hasil, baja, perosak, ujian ladang."
  id: "Agronomi untuk pertanian Australia yang efisien dan berkelanjutan: hasil, pupuk, hama, uji lapangan."
  hi: "कुशल, टिकाऊ ऑस्ट्रेलियाई खेती का कृषि-विज्ञान: उपज, उर्वरक, कीट, खेत परीक्षण।"
outcomes:
  - en: "Estimate potential yield and fertiliser needs"
    zh: "估算潜在产量与施肥需求"
    zh-TW: "估算潛在產量與施肥需求"
    ja: "潜在収量と施肥量を見積もる"
    ko: "잠재 수량과 비료 요구량 추정하기"
    vi: "Ước tính năng suất tiềm năng và nhu cầu phân bón"
    ms: "Anggar hasil berpotensi dan keperluan baja"
    id: "Memperkirakan hasil potensial dan kebutuhan pupuk"
    hi: "संभावित उपज और उर्वरक ज़रूरत का अनुमान लगाएँ"
  - en: "Design field trials that give useful data"
    zh: "设计能产出有用数据的田间试验"
    zh-TW: "設計能產出有用數據的田間試驗"
    ja: "有用なデータが取れる圃場試験を設計する"
    ko: "유용한 데이터를 주는 포장 시험 설계하기"
    vi: "Thiết kế thí nghiệm đồng ruộng cho dữ liệu hữu ích"
    ms: "Reka ujian ladang yang beri data berguna"
    id: "Merancang uji lapangan yang memberi data berguna"
    hi: "उपयोगी डेटा देने वाले खेत परीक्षण डिज़ाइन करें"
  - en: "Use farm decision support tools"
    zh: "使用农业决策支持工具"
    zh-TW: "使用農業決策支援工具"
    ja: "農業の意思決定支援ツールを使う"
    ko: "농업 의사결정 지원 도구 활용하기"
    vi: "Sử dụng công cụ hỗ trợ ra quyết định nông nghiệp"
    ms: "Guna alat sokongan keputusan pertanian"
    id: "Memakai alat pendukung keputusan pertanian"
    hi: "कृषि निर्णय सहायक टूल्स का उपयोग करें"
