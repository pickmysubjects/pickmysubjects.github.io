code: ACTL20006
year: 2026
learn:
  en: "Models of how people move between states like healthy, sick and dead, and how to estimate them from data."
  zh: "描述人在健康、患病、死亡等状态间转移的模型，以及如何从数据估计。"
  zh-TW: "描述人在健康、生病、死亡等狀態間移轉的模型，以及如何從資料估計。"
  ja: "健康・病気・死亡などの状態間の移り変わりのモデルと、データからの推定。"
  ko: "건강·질병·사망 같은 상태 사이의 이동을 다루는 모형과 데이터로 추정하는 법."
  vi: "Mô hình người chuyển giữa các trạng thái như khoẻ, ốm, tử vong và cách ước lượng chúng từ dữ liệu."
  ms: "Model pergerakan orang antara keadaan seperti sihat, sakit dan mati, serta cara menganggarnya dari data."
  id: "Model perpindahan orang antar keadaan seperti sehat, sakit, dan meninggal, serta cara menaksirnya dari data."
  hi: "लोगों के स्वस्थ, बीमार और मृत जैसी अवस्थाओं के बीच जाने के मॉडल, और डेटा से उनका अनुमान लगाना।"
outcomes:
  - en: "Analyse Markov chains in actuarial problems"
    zh: "在精算问题中分析马尔可夫链"
    zh-TW: "在精算問題中分析馬可夫鏈"
    ja: "アクチュアリーの問題でマルコフ連鎖を分析する"
    ko: "보험계리 문제에서 마르코프 연쇄 분석"
    vi: "Phân tích chuỗi Markov trong bài toán tính toán bảo hiểm"
    ms: "Analisis rantai Markov dalam masalah aktuari"
    id: "Menganalisis rantai Markov dalam soal aktuaria"
    hi: "एक्चुअरियल सवालों में मार्कोव चेन का विश्लेषण"
  - en: "Estimate transition rates by maximum likelihood"
    zh: "用极大似然估计转移强度"
    zh-TW: "用最大概似法估計轉移強度"
    ja: "最尤法で推移強度を推定する"
    ko: "최대우도법으로 전이율 추정"
    vi: "Ước lượng cường độ chuyển bằng hợp lý cực đại"
    ms: "Anggar kadar peralihan dengan kebolehjadian maksimum"
    id: "Menaksir laju transisi dengan likelihood maksimum"
    hi: "मैक्सिमम लाइकलीहुड से ट्रांज़िशन दरों का अनुमान"
  - en: "Model linked risks with copulas and extreme values"
    zh: "用Copula和极值理论建模相关风险"
    zh-TW: "用Copula和極值理論建模相關風險"
    ja: "コピュラと極値理論で関連するリスクをモデル化する"
    ko: "코퓰러와 극단값 이론으로 연관 위험 모형화"
    vi: "Mô hình rủi ro liên quan bằng copula và giá trị cực trị"
    ms: "Model risiko berkait dengan kopula dan nilai ekstrem"
    id: "Memodelkan risiko terkait dengan kopula dan nilai ekstrem"
    hi: "कोपुला और एक्सट्रीम वैल्यू से जुड़े जोखिमों का मॉडल"
