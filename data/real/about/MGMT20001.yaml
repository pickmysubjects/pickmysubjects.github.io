code: MGMT20001
year: 2026
learn:
  en: "How people behave at work, alone and in groups: motivation, teams, culture, power, conflict and change."
  zh: "人在工作中个人与群体的行为：激励、团队、文化、权力、冲突和变革。"
  zh-TW: "人在職場中個人與群體的行為：激勵、團隊、文化、權力、衝突和變革。"
  ja: "職場での個人と集団の行動：動機づけ、チーム、文化、権力、対立、変革。"
  ko: "직장 내 개인과 집단의 행동: 동기, 팀, 문화, 권력, 갈등, 변화."
  vi: "Con người hành xử ra sao ở nơi làm việc: động lực, nhóm, văn hóa, quyền lực, xung đột và thay đổi."
  ms: "Tingkah laku orang di tempat kerja, sendiri dan berkumpulan: motivasi, pasukan, budaya, kuasa, konflik, perubahan."
  id: "Perilaku orang di tempat kerja, sendiri dan berkelompok: motivasi, tim, budaya, kekuasaan, konflik, perubahan."
  hi: "काम पर लोग अकेले और समूह में कैसे व्यवहार करते हैं: प्रेरणा, टीम, संस्कृति, सत्ता, टकराव और बदलाव।"
outcomes:
  - en: "Apply organisational behaviour theory to real cases"
    zh: "把组织行为理论用于真实案例"
    zh-TW: "把組織行為理論用於真實個案"
    ja: "組織行動論を実際のケースに当てはめる"
    ko: "조직행동 이론을 실제 사례에 적용"
    vi: "Áp dụng lý thuyết hành vi tổ chức vào tình huống thật"
    ms: "Guna teori tingkah laku organisasi pada kes sebenar"
    id: "Menerapkan teori perilaku organisasi pada kasus nyata"
    hi: "संगठनात्मक व्यवहार के सिद्धांत असली केस पर लगाना"
  - en: "Summarise and judge recent research on a topic"
    zh: "总结并评价某主题的近期研究"
    zh-TW: "整理並評價某主題的近期研究"
    ja: "あるテーマの最近の研究をまとめて評価する"
    ko: "한 주제의 최근 연구를 요약·평가"
    vi: "Tóm tắt và đánh giá nghiên cứu gần đây về một chủ đề"
    ms: "Ringkas dan nilai kajian terkini tentang satu topik"
    id: "Merangkum dan menilai riset terbaru tentang suatu topik"
    hi: "किसी विषय पर हाल की रिसर्च का सार और आकलन"
  - en: "Understand and handle team dynamics"
    zh: "理解并处理团队动态"
    zh-TW: "理解並處理團隊動態"
    ja: "チームの力学を理解して対処する"
    ko: "팀 역학을 이해하고 다루기"
    vi: "Hiểu và xử lý động lực nhóm"
    ms: "Fahami dan urus dinamik pasukan"
    id: "Memahami dan menangani dinamika tim"
    hi: "टीम की गतिशीलता समझना और संभालना"
