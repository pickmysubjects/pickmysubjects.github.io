code: MGMT10003
year: 2026
learn:
  en: "What managers do and the forces shaping today's organisations, from planning and leading to ethics and structure."
  zh: "管理者做什么，以及影响现代组织的各种力量。"
  zh-TW: "管理者做什麼，以及影響現代組織的各種力量。"
  ja: "マネジャーの仕事と、今日の組織を形づくる力。計画やリーダーシップから倫理まで。"
  ko: "관리자가 하는 일과 오늘날 조직에 영향을 주는 힘: 계획, 리더십, 윤리, 구조."
  vi: "Nhà quản lý làm gì và những yếu tố định hình tổ chức ngày nay, từ lập kế hoạch, lãnh đạo đến đạo đức."
  ms: "Apa yang dibuat pengurus dan kuasa yang membentuk organisasi hari ini, dari perancangan hingga etika."
  id: "Apa yang dilakukan manajer dan faktor yang membentuk organisasi kini, dari perencanaan sampai etika."
  hi: "मैनेजर क्या करते हैं और आज के संगठनों को कौन-सी ताक़तें आकार देती हैं, योजना से नैतिकता तक।"
outcomes:
  - en: "Describe the main theories of management"
    zh: "描述主要的管理理论"
    zh-TW: "描述主要的管理理論"
    ja: "主な経営管理の理論を説明する"
    ko: "주요 경영 이론 설명하기"
    vi: "Mô tả các lý thuyết quản lý chính"
    ms: "Huraikan teori utama pengurusan"
    id: "Menjelaskan teori-teori utama manajemen"
    hi: "प्रबंधन के मुख्य सिद्धांत बताना"
  - en: "Explain how inside and outside forces affect an organisation"
    zh: "解释内外部因素如何影响组织"
    zh-TW: "說明內外部因素如何影響組織"
    ja: "組織に影響する内外の要因を説明する"
    ko: "조직에 영향을 주는 내외부 요인 설명"
    vi: "Giải thích yếu tố bên trong, bên ngoài tác động tổ chức"
    ms: "Terangkan kesan faktor dalaman dan luaran ke atas organisasi"
    id: "Menjelaskan pengaruh faktor internal dan eksternal pada organisasi"
    hi: "अंदरूनी और बाहरी ताक़तें संगठन पर कैसे असर डालती हैं, समझाना"
  - en: "Judge an organisation's performance, including its social responsibility"
    zh: "评估组织的表现，包括社会责任"
    zh-TW: "評估組織的表現，包括社會責任"
    ja: "社会的責任を含めて組織の成果を評価する"
    ko: "사회적 책임을 포함해 조직 성과 평가"
    vi: "Đánh giá hiệu quả tổ chức, kể cả trách nhiệm xã hội"
    ms: "Nilai prestasi organisasi termasuk tanggungjawab sosial"
    id: "Menilai kinerja organisasi, termasuk tanggung jawab sosial"
    hi: "सामाजिक ज़िम्मेदारी सहित संगठन के प्रदर्शन का आकलन"
