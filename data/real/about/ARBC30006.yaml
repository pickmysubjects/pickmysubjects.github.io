code: ARBC30006
year: 2026
learn:
  en: "Advanced Arabic style and rhetoric through literary, historical and academic texts, with long essays and presentations."
  zh: "通过文学、历史和学术文本学习高级阿拉伯语文体与修辞，写长文并做口头报告。"
  zh-TW: "透過文學、歷史和學術文本學習高級阿拉伯語文體與修辭，寫長文並做口頭報告。"
  ja: "文学・歴史・学術の文章で上級のアラビア語の文体と修辞を学び、長文と発表に取り組む。"
  ko: "문학·역사·학술 글로 고급 아랍어 문체와 수사를 배우고 긴 글과 발표를 한다."
  vi: "Văn phong và tu từ tiếng Ả Rập nâng cao qua văn bản văn học, lịch sử, học thuật, với bài luận dài và thuyết trình."
  ms: "Gaya dan retorik Arab lanjutan melalui teks sastera, sejarah dan akademik, dengan esei panjang dan pembentangan."
  id: "Gaya dan retorika Arab lanjutan lewat teks sastra, sejarah dan akademik, dengan esai panjang dan presentasi."
  hi: "साहित्यिक, ऐतिहासिक और अकादमिक पाठों से उन्नत अरबी शैली और अलंकार, लंबे निबंध और प्रस्तुतियाँ।"
outcomes:
  - en: "Discuss social and cultural topics in Arabic"
    zh: "用阿拉伯语讨论社会和文化话题"
    zh-TW: "用阿拉伯語討論社會和文化話題"
    ja: "社会や文化の話題をアラビア語で話し合う"
    ko: "사회·문화 주제를 아랍어로 토론하기"
    vi: "Thảo luận chủ đề xã hội, văn hóa bằng tiếng Ả Rập"
    ms: "Bincangkan topik sosial dan budaya dalam bahasa Arab"
    id: "Membahas topik sosial dan budaya dalam bahasa Arab"
    hi: "सामाजिक और सांस्कृतिक विषयों पर अरबी में चर्चा करना"
  - en: "Read and write longer Arabic texts"
    zh: "读写较长的阿拉伯语文章"
    zh-TW: "讀寫較長的阿拉伯語文章"
    ja: "長めのアラビア語の文章を読み書きする"
    ko: "긴 아랍어 글 읽고 쓰기"
    vi: "Đọc và viết văn bản tiếng Ả Rập dài hơn"
    ms: "Baca dan tulis teks bahasa Arab yang lebih panjang"
    id: "Membaca dan menulis teks bahasa Arab yang lebih panjang"
    hi: "लंबे अरबी पाठ पढ़ना-लिखना"
  - en: "Give a clear presentation in Arabic"
    zh: "用阿拉伯语做清楚的口头报告"
    zh-TW: "用阿拉伯語做清楚的口頭報告"
    ja: "アラビア語で分かりやすく発表する"
    ko: "아랍어로 명확하게 발표하기"
    vi: "Thuyết trình rõ ràng bằng tiếng Ả Rập"
    ms: "Buat pembentangan yang jelas dalam bahasa Arab"
    id: "Melakukan presentasi yang jelas dalam bahasa Arab"
    hi: "अरबी में स्पष्ट प्रस्तुति देना"
