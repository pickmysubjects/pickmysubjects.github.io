code: ECON30003
year: 2026
learn:
  en: "How firms compete in markets with a few big players: pricing, mergers, advertising, entry and R&D."
  zh: "少数大企业主导的市场中企业如何竞争：定价、并购、广告、进入和研发。"
  zh-TW: "少數大企業主導的市場中企業如何競爭：定價、併購、廣告、進入和研發。"
  ja: "少数の大企業が占める市場での競争：価格設定、合併、広告、参入、研究開発。"
  ko: "소수 대기업 시장에서의 경쟁: 가격, 인수합병, 광고, 진입, 연구개발."
  vi: "Doanh nghiệp cạnh tranh ra sao trong thị trường ít công ty lớn: định giá, sáp nhập, quảng cáo, gia nhập, R&D."
  ms: "Cara firma bersaing dalam pasaran dengan beberapa pemain besar: harga, penggabungan, iklan, kemasukan, R&D."
  id: "Cara perusahaan bersaing di pasar dengan sedikit pemain besar: harga, merger, iklan, masuk pasar, R&D."
  hi: "कुछ बड़ी कंपनियों वाले बाज़ार में मुकाबला कैसे होता है: कीमतें, विलय, विज्ञापन, प्रवेश और R&D।"
outcomes:
  - en: "Explain how different market structures work"
    zh: "解释不同市场结构如何运作"
    zh-TW: "解釋不同市場結構如何運作"
    ja: "さまざまな市場構造の仕組みを説明する"
    ko: "다양한 시장 구조의 작동 방식 설명"
    vi: "Giải thích cách các cấu trúc thị trường vận hành"
    ms: "Terangkan cara pelbagai struktur pasaran berfungsi"
    id: "Menjelaskan cara kerja berbagai struktur pasar"
    hi: "अलग-अलग बाज़ार ढाँचे कैसे काम करते हैं, समझाना"
  - en: "Analyse strategic moves between competing firms"
    zh: "分析竞争企业之间的策略行为"
    zh-TW: "分析競爭企業之間的策略行為"
    ja: "競合企業間の戦略的な動きを分析する"
    ko: "경쟁 기업 간 전략적 행동 분석"
    vi: "Phân tích các nước đi chiến lược giữa các công ty"
    ms: "Analisis langkah strategik antara firma yang bersaing"
    id: "Menganalisis langkah strategis antarperusahaan pesaing"
    hi: "प्रतिस्पर्धी कंपनियों की रणनीतिक चालें परखना"
  - en: "Judge when competition policy improves efficiency"
    zh: "判断竞争政策何时提升效率"
    zh-TW: "判斷競爭政策何時提升效率"
    ja: "競争政策が効率を高める場面を判断する"
    ko: "경쟁정책이 효율을 높이는 경우 판단"
    vi: "Đánh giá khi nào chính sách cạnh tranh tăng hiệu quả"
    ms: "Nilai bila dasar persaingan tingkatkan kecekapan"
    id: "Menilai kapan kebijakan persaingan menaikkan efisiensi"
    hi: "प्रतिस्पर्धा नीति कब दक्षता बढ़ाती है, आँकना"
