code: MKTG30013
year: 2026
learn:
  en: "How firms analyse their market and choose marketing strategies that build and keep an edge over rivals."
  zh: "企业如何分析市场，选择能建立并保持优势的营销战略。"
  zh-TW: "企業如何分析市場，選擇能建立並維持優勢的行銷策略。"
  ja: "企業が市場を分析し、競争優位を築き保つマーケティング戦略を選ぶ方法。"
  ko: "기업이 시장을 분석하고 경쟁 우위를 만들고 지키는 마케팅 전략을 고르는 법."
  vi: "Doanh nghiệp phân tích thị trường và chọn chiến lược marketing để tạo, giữ lợi thế trước đối thủ ra sao."
  ms: "Cara firma menganalisis pasaran dan memilih strategi pemasaran yang membina dan mengekalkan kelebihan."
  id: "Cara perusahaan menganalisis pasar dan memilih strategi pemasaran untuk membangun dan menjaga keunggulan."
  hi: "कंपनियाँ बाज़ार का विश्लेषण कर ऐसी मार्केटिंग रणनीति कैसे चुनती हैं जो बढ़त बनाए और बनाए रखे।"
outcomes:
  - en: "Analyse strategic marketing problems with models"
    zh: "用模型分析战略营销问题"
    zh-TW: "用模型分析策略行銷問題"
    ja: "モデルを使って戦略的マーケティングの問題を分析する"
    ko: "모델로 전략 마케팅 문제 분석하기"
    vi: "Dùng mô hình phân tích vấn đề marketing chiến lược"
    ms: "Analisis masalah pemasaran strategik dengan model"
    id: "Menganalisis masalah pemasaran strategis dengan model"
    hi: "मॉडल से रणनीतिक मार्केटिंग समस्याओं का विश्लेषण"
  - en: "Assess when to enter or leave a market niche"
    zh: "评估何时进入或退出细分市场"
    zh-TW: "評估何時進入或退出利基市場"
    ja: "ニッチ市場への参入・撤退の時期を判断する"
    ko: "틈새시장 진입·철수 시점 판단하기"
    vi: "Đánh giá khi nào vào hay rời một thị trường ngách"
    ms: "Nilai bila perlu masuk atau keluar pasaran niche"
    id: "Menilai kapan masuk atau keluar dari ceruk pasar"
    hi: "किसी निश बाज़ार में कब उतरें या निकलें, परखना"
  - en: "Turn market analysis into a marketing plan"
    zh: "把市场分析转化为营销计划"
    zh-TW: "把市場分析轉化為行銷計畫"
    ja: "市場分析をマーケティング計画に落とし込む"
    ko: "시장 분석을 마케팅 계획으로 바꾸기"
    vi: "Biến phân tích thị trường thành kế hoạch marketing"
    ms: "Jadikan analisis pasaran sebagai pelan pemasaran"
    id: "Mengubah analisis pasar menjadi rencana pemasaran"
    hi: "मार्केट एनालिसिस को मार्केटिंग प्लान में बदलना"
