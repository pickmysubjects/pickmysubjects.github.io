code: CHEN90012
year: 2027
learn:
  en: "Designing chemical plant equipment like pressure vessels, heat exchangers, pumps and piping, with CAD drawings."
  zh: "设计压力容器、换热器、泵和管道等化工设备，并绘制 CAD 图纸。"
  zh-TW: "設計壓力容器、熱交換器、泵與管線等化工設備，並繪製 CAD 圖。"
  ja: "圧力容器、熱交換器、ポンプ、配管などの化学プラント機器を設計し、CAD 図面を描く。"
  ko: "압력용기, 열교환기, 펌프, 배관 등 화공 장치 설계와 CAD 도면 작성."
  vi: "Thiết kế thiết bị nhà máy hóa chất như bình áp lực, bộ trao đổi nhiệt, bơm, đường ống, kèm bản vẽ CAD."
  ms: "Mereka peralatan loji kimia seperti bekas tekanan, penukar haba, pam dan paip, dengan lukisan CAD."
  id: "Merancang peralatan pabrik kimia seperti bejana tekan, penukar panas, pompa, dan pipa, dengan gambar CAD."
  hi: "प्रेशर वेसल, हीट एक्सचेंजर, पंप और पाइपिंग जैसे केमिकल प्लांट उपकरण डिज़ाइन करना, CAD ड्रॉइंग के साथ।"
outcomes:
  - en: "Design process units safely and to standards"
    zh: "按标准安全地设计工艺设备"
    zh-TW: "依標準安全地設計製程設備"
    ja: "基準に沿って安全にプロセス機器を設計する"
    ko: "기준에 맞게 안전하게 공정 장치 설계하기"
    vi: "Thiết kế thiết bị quy trình an toàn và đúng tiêu chuẩn"
    ms: "Mereka unit proses dengan selamat dan mengikut piawaian"
    id: "Merancang unit proses dengan aman dan sesuai standar"
    hi: "मानकों के अनुसार सुरक्षित प्रोसेस यूनिट डिज़ाइन करना"
  - en: "Lay out plant piping and prepare CAD drawings"
    zh: "布置工厂管线并绘制 CAD 图纸"
    zh-TW: "配置工廠管線並繪製 CAD 圖"
    ja: "プラントの配管を配置し CAD 図面を作る"
    ko: "플랜트 배관 배치와 CAD 도면 작성하기"
    vi: "Bố trí đường ống nhà máy và lập bản vẽ CAD"
    ms: "Menyusun paip loji dan menyediakan lukisan CAD"
    id: "Menata pipa pabrik dan membuat gambar CAD"
    hi: "प्लांट पाइपिंग का लेआउट और CAD ड्रॉइंग बनाना"
  - en: "Apply heat transfer to heat exchanger design"
    zh: "把传热原理用于换热器设计"
    zh-TW: "把熱傳原理用於熱交換器設計"
    ja: "伝熱の原理を熱交換器の設計に使う"
    ko: "열전달 원리를 열교환기 설계에 적용하기"
    vi: "Áp dụng truyền nhiệt vào thiết kế bộ trao đổi nhiệt"
    ms: "Menggunakan pemindahan haba dalam reka bentuk penukar haba"
    id: "Menerapkan perpindahan panas pada desain penukar panas"
    hi: "हीट एक्सचेंजर डिज़ाइन में ऊष्मा स्थानांतरण लागू करना"
