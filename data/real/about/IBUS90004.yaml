code: IBUS90004
year: 2027
learn:
  en: "Managing across cultures: communication, negotiation, conflict, expatriates and global teams in international firms."
  zh: "跨文化管理：沟通、谈判、冲突处理、外派员工和全球团队。"
  zh-TW: "跨文化管理：溝通、談判、衝突處理、外派員工與全球團隊。"
  ja: "異文化マネジメント：コミュニケーション、交渉、対立の解決、海外駐在員、グローバルチーム。"
  ko: "문화 간 경영: 소통, 협상, 갈등 해결, 해외 파견 인력, 글로벌 팀."
  vi: "Quản lý đa văn hóa: giao tiếp, đàm phán, xử lý xung đột, nhân viên biệt phái và nhóm toàn cầu."
  ms: "Pengurusan merentas budaya: komunikasi, rundingan, konflik, ekspatriat dan pasukan global."
  id: "Manajemen lintas budaya: komunikasi, negosiasi, konflik, ekspatriat, dan tim global."
  hi: "संस्कृतियों के पार प्रबंधन: संवाद, बातचीत, विवाद, विदेश भेजे कर्मचारी और वैश्विक टीमें।"
outcomes:
  - en: "Explain theories of managing across borders"
    zh: "解释跨国管理的相关理论"
    zh-TW: "解釋跨國管理的相關理論"
    ja: "国境を越えたマネジメントの理論を説明する"
    ko: "국경을 넘는 경영 이론 설명하기"
    vi: "Giải thích lý thuyết quản lý xuyên biên giới"
    ms: "Menerangkan teori pengurusan merentas sempadan"
    id: "Menjelaskan teori manajemen lintas negara"
    hi: "सीमाओं के पार प्रबंधन के सिद्धांत समझाना"
  - en: "Apply them to case studies and exercises"
    zh: "将理论用于案例和练习"
    zh-TW: "將理論用於案例與練習"
    ja: "ケーススタディや演習に応用する"
    ko: "사례 연구와 실습에 적용하기"
    vi: "Áp dụng vào tình huống và bài tập"
    ms: "Mengaplikasikannya pada kajian kes dan latihan"
    id: "Menerapkannya pada studi kasus dan latihan"
    hi: "केस स्टडी और अभ्यासों में लागू करना"
  - en: "Judge how useful these ideas are in practice"
    zh: "评判这些理论在实践中的用处"
    zh-TW: "評判這些理論在實務中的用處"
    ja: "これらの考え方の実際の有用性を評価する"
    ko: "이 개념들의 실제 유용성 평가하기"
    vi: "Đánh giá mức hữu ích của các ý tưởng trong thực tế"
    ms: "Menilai kegunaan idea ini dalam amalan"
    id: "Menilai kegunaan gagasan ini dalam praktik"
    hi: "इन विचारों की व्यावहारिक उपयोगिता आँकना"
