code: MGMT30015
year: 2026
learn:
  en: "What working in an organisation is really like, and how to get a job and build your career, based on research."
  zh: "在组织中工作是怎样的，以及如何求职和发展职业，基于研究。"
  zh-TW: "在組織裡工作是什麼樣子，以及如何求職和發展職涯，以研究為基礎。"
  ja: "組織で働くとはどういうことか、就職とキャリア形成の方法を研究に基づいて学ぶ。"
  ko: "조직에서 일한다는 것의 실제와 취업·경력 개발 방법을 연구에 기반해 배운다."
  vi: "Làm việc trong tổ chức thực sự ra sao, cách xin việc và phát triển sự nghiệp, dựa trên nghiên cứu."
  ms: "Bagaimana sebenarnya bekerja dalam organisasi, dan cara dapat kerja serta bina kerjaya, berasaskan kajian."
  id: "Seperti apa bekerja di organisasi, serta cara mendapat kerja dan membangun karier, berdasarkan riset."
  hi: "किसी संगठन में काम करना असल में कैसा है, और नौकरी पाने व करियर बनाने के तरीके, रिसर्च के आधार पर।"
outcomes:
  - en: "Use career research to plan your own career"
    zh: "用职业研究规划自己的职业"
    zh-TW: "用職涯研究規劃自己的職涯"
    ja: "キャリア研究を使って自分のキャリアを計画する"
    ko: "경력 연구를 활용해 자신의 경력 계획하기"
    vi: "Dùng nghiên cứu nghề nghiệp để lên kế hoạch sự nghiệp"
    ms: "Guna kajian kerjaya untuk merancang kerjaya sendiri"
    id: "Memakai riset karier untuk merencanakan karier sendiri"
    hi: "करियर रिसर्च से अपना करियर प्लान करना"
  - en: "Apply career theories to case studies"
    zh: "把职业理论用到案例分析"
    zh-TW: "把職涯理論用在個案分析"
    ja: "キャリア理論を事例に当てはめる"
    ko: "경력 이론을 사례에 적용하기"
    vi: "Áp dụng lý thuyết nghề nghiệp vào tình huống"
    ms: "Guna teori kerjaya pada kajian kes"
    id: "Menerapkan teori karier pada studi kasus"
    hi: "करियर के सिद्धांत केस स्टडी पर लागू करना"
