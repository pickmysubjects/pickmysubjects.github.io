code: LAWS20015
year: 2026
learn:
  en: "Two-week July intensive on law, science and technology: climate, biomedicine, surveillance, platform work and automation."
  zh: "七月两周密集课：法律与科学技术，涵盖气候、生物医学、监控、平台劳动和自动化"
  zh-TW: "七月兩週密集課：法律與科學技術，涵蓋氣候、生物醫學、監控、平台勞動和自動化"
  ja: "7月の2週間集中講座。法と科学技術：気候、生物医学、監視、プラットフォーム労働、自動化。"
  ko: "7월 2주 집중 과정: 법과 과학기술 — 기후, 생명의학, 감시, 플랫폼 노동, 자동화."
  vi: "Khóa cấp tốc 2 tuần tháng 7 về luật, khoa học, công nghệ: khí hậu, y sinh, giám sát, lao động nền tảng, tự động hóa."
  ms: "Intensif 2 minggu Julai tentang undang-undang, sains dan teknologi: iklim, bioperubatan, pengawasan, automasi."
  id: "Intensif 2 minggu Juli tentang hukum, sains, dan teknologi: iklim, biomedis, pengawasan, kerja platform, otomasi."
  hi: "जुलाई का दो हफ़्ते का इंटेंसिव: कानून, विज्ञान और तकनीक — जलवायु, बायोमेडिसिन, निगरानी, प्लेटफ़ॉर्म काम, ऑटोमेशन।"
outcomes:
  - en: "Explain the legal rules that govern new technology"
    zh: "说明规范新技术的法律框架"
    zh-TW: "說明規範新技術的法律框架"
    ja: "新技術を規律する法的枠組みを説明する"
    ko: "신기술을 규율하는 법적 틀 설명하기"
    vi: "Giải thích khung pháp lý điều chỉnh công nghệ mới"
    ms: "Menerangkan peraturan undang-undang bagi teknologi baharu"
    id: "Menjelaskan aturan hukum yang mengatur teknologi baru"
    hi: "नई तकनीक पर लागू कानूनी नियम समझाना"
  - en: "Analyse how law, science and technology shape each other"
    zh: "分析法律、科学与技术如何相互影响"
    zh-TW: "分析法律、科學與技術如何相互影響"
    ja: "法・科学・技術の相互作用を分析する"
    ko: "법, 과학, 기술이 서로 어떻게 영향을 주는지 분석하기"
    vi: "Phân tích luật, khoa học, công nghệ tác động lẫn nhau"
    ms: "Menganalisis pengaruh timbal balik undang-undang dan sains"
    id: "Menganalisis pengaruh timbal balik hukum, sains, teknologi"
    hi: "कानून, विज्ञान और तकनीक के आपसी प्रभाव का विश्लेषण करना"
  - en: "Argue a legal and ethical position in writing"
    zh: "书面论证一个法律和伦理立场"
    zh-TW: "書面論證一個法律和倫理立場"
    ja: "法的・倫理的な立場を文章で論じる"
    ko: "법적·윤리적 입장을 글로 논증하기"
    vi: "Lập luận quan điểm pháp lý và đạo đức bằng văn bản"
    ms: "Berhujah tentang pendirian undang-undang dan etika secara bertulis"
    id: "Berargumen tentang posisi hukum dan etika secara tertulis"
    hi: "कानूनी और नैतिक पक्ष को लिखकर तर्क देना"
