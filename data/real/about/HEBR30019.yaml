code: HEBR30019
year: 2026
learn:
  en: "Follows Hebrew 9: accurate, fluent Hebrew for scholarly essays and presentations, with close reading across genres."
  zh: "接续希伯来语 9：用准确流利的希伯来语写学术论文、做报告，精读多种文体。"
  zh-TW: "接續希伯來語 9：用準確流利的希伯來語寫學術論文、做報告，精讀多種文體。"
  ja: "ヘブライ語9の続き。正確で流暢なヘブライ語で論文と発表に取り組み、多様なジャンルを精読。"
  ko: "히브리어 9에 이어 정확하고 유창한 히브리어로 학술 에세이와 발표, 여러 장르 정독."
  vi: "Tiếp nối Hebrew 9: tiếng Do Thái chính xác, trôi chảy cho bài luận học thuật và thuyết trình, đọc kỹ nhiều thể loại."
  ms: "Sambungan Hebrew 9: bahasa Ibrani tepat dan fasih untuk esei ilmiah dan pembentangan, dengan bacaan teliti pelbagai genre."
  id: "Lanjutan Hebrew 9: bahasa Ibrani akurat dan lancar untuk esai ilmiah dan presentasi, dengan membaca cermat berbagai genre."
  hi: "हिब्रू 9 के आगे: अकादमिक निबंध और प्रस्तुतियों के लिए सटीक, धाराप्रवाह हिब्रू, कई विधाओं का गहन पाठ।"
outcomes:
  - en: "Discuss social and cultural topics in Hebrew"
    zh: "用希伯来语讨论社会和文化话题"
    zh-TW: "用希伯來語討論社會和文化話題"
    ja: "社会や文化の話題をヘブライ語で話し合う"
    ko: "사회·문화 주제를 히브리어로 토론하기"
    vi: "Thảo luận chủ đề xã hội, văn hóa bằng tiếng Do Thái"
    ms: "Bincangkan topik sosial dan budaya dalam bahasa Ibrani"
    id: "Membahas topik sosial dan budaya dalam bahasa Ibrani"
    hi: "सामाजिक और सांस्कृतिक विषयों पर हिब्रू में चर्चा करना"
  - en: "Read and write longer Hebrew texts"
    zh: "读写较长的希伯来语文章"
    zh-TW: "讀寫較長的希伯來語文章"
    ja: "長めのヘブライ語の文章を読み書きする"
    ko: "긴 히브리어 글 읽고 쓰기"
    vi: "Đọc và viết văn bản tiếng Do Thái dài hơn"
    ms: "Baca dan tulis teks bahasa Ibrani yang lebih panjang"
    id: "Membaca dan menulis teks bahasa Ibrani yang lebih panjang"
    hi: "लंबे हिब्रू पाठ पढ़ना-लिखना"
  - en: "Give a clear presentation in Hebrew"
    zh: "用希伯来语做清楚的口头报告"
    zh-TW: "用希伯來語做清楚的口頭報告"
    ja: "ヘブライ語で分かりやすく発表する"
    ko: "히브리어로 명확하게 발표하기"
    vi: "Thuyết trình rõ ràng bằng tiếng Do Thái"
    ms: "Buat pembentangan yang jelas dalam bahasa Ibrani"
    id: "Melakukan presentasi yang jelas dalam bahasa Ibrani"
    hi: "हिब्रू में स्पष्ट प्रस्तुति देना"
