code: FLTV30022
year: 2026
learn:
  en: "Two weekends in real film studios: write a short script, then shoot two short films in small teams with professional gear."
  zh: "在真正的电影棚里度过两个周末：写短剧本，再与小组用专业设备拍两部短片"
  zh-TW: "在真正的電影棚裡度過兩個週末：寫短劇本，再與小組用專業設備拍兩部短片"
  ja: "本物の撮影スタジオで2週末。短い脚本を書き、少人数チームでプロ機材を使い短編を2本撮る。"
  ko: "실제 촬영 스튜디오에서 두 주말: 짧은 각본을 쓰고 소규모 팀으로 전문 장비로 단편 두 편 촬영."
  vi: "Hai cuối tuần trong trường quay thật: viết kịch bản ngắn rồi cùng nhóm quay hai phim ngắn bằng thiết bị chuyên nghiệp."
  ms: "Dua hujung minggu di studio filem: tulis skrip pendek, kemudian rakam dua filem pendek bersama pasukan."
  id: "Dua akhir pekan di studio film: tulis naskah pendek, lalu syuting dua film pendek bersama tim kecil."
  hi: "असली फ़िल्म स्टूडियो में दो वीकेंड: छोटी स्क्रिप्ट लिखना, फिर टीम में पेशेवर उपकरणों से दो छोटी फ़िल्में शूट करना।"
outcomes:
  - en: "Write a properly formatted short screenplay"
    zh: "写一份格式规范的短剧本"
    zh-TW: "寫一份格式規範的短劇本"
    ja: "正しい書式で短い脚本を書く"
    ko: "형식에 맞는 단편 각본 쓰기"
    vi: "Viết kịch bản ngắn đúng định dạng"
    ms: "Menulis lakon layar pendek dengan format betul"
    id: "Menulis naskah film pendek dengan format yang benar"
    hi: "सही फ़ॉर्मैट में छोटी पटकथा लिखना"
  - en: "Plan a shoot with character notes and storyboards"
    zh: "用角色设定和分镜规划拍摄"
    zh-TW: "用角色設定和分鏡規劃拍攝"
    ja: "人物設定と絵コンテで撮影を計画する"
    ko: "인물 설정과 스토리보드로 촬영 계획하기"
    vi: "Lên kế hoạch quay với hồ sơ nhân vật và phân cảnh"
    ms: "Merancang penggambaran dengan watak dan papan cerita"
    id: "Merencanakan syuting dengan profil tokoh dan storyboard"
    hi: "किरदार नोट्स और स्टोरीबोर्ड से शूट की योजना बनाना"
  - en: "Work in a film crew and pitch your film idea"
    zh: "在剧组中合作并讲解自己的电影构想"
    zh-TW: "在劇組中合作並講解自己的電影構想"
    ja: "撮影チームで協力し自分の企画を説明する"
    ko: "촬영팀에서 협업하고 영화 아이디어 발표하기"
    vi: "Làm việc trong đoàn phim và trình bày ý tưởng phim"
    ms: "Bekerja dalam kru dan membentang idea filem"
    id: "Bekerja dalam kru dan memaparkan ide film"
    hi: "फ़िल्म क्रू में काम करना और अपना आइडिया प्रस्तुत करना"
