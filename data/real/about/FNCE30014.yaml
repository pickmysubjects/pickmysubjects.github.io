code: FNCE30014
year: 2026
learn:
  en: "Real problems in finance and economics, and how machine learning can be used to tackle them."
  zh: "金融和经济中的实际问题，以及如何用机器学习来解决。"
  zh-TW: "金融和經濟上的實際問題，以及如何用機器學習來解決。"
  ja: "金融・経済の現実の問題と、機械学習でそれにどう取り組むか。"
  ko: "금융·경제의 실제 문제와 머신러닝으로 이를 해결하는 방법."
  vi: "Các vấn đề thực tế trong tài chính, kinh tế và cách dùng học máy để giải quyết."
  ms: "Masalah sebenar dalam kewangan dan ekonomi, dan cara pembelajaran mesin digunakan untuk menanganinya."
  id: "Masalah nyata di keuangan dan ekonomi, serta cara machine learning dipakai untuk mengatasinya."
  hi: "फ़ाइनेंस और अर्थशास्त्र की असली समस्याएँ, और मशीन लर्निंग से उन्हें कैसे सुलझाया जाए।"
outcomes:
  - en: "Use basic machine learning methods on finance problems"
    zh: "用基础机器学习方法处理金融问题"
    zh-TW: "用基本機器學習方法處理金融問題"
    ja: "基本的な機械学習手法を金融問題に使う"
    ko: "기본 머신러닝 기법을 금융 문제에 적용하기"
    vi: "Áp dụng phương pháp học máy cơ bản cho bài toán tài chính"
    ms: "Guna kaedah asas pembelajaran mesin pada masalah kewangan"
    id: "Memakai metode dasar machine learning untuk masalah keuangan"
    hi: "फ़ाइनेंस की समस्याओं पर बेसिक मशीन लर्निंग तरीके लगाना"
  - en: "Tell real disruption apart from simple computerisation"
    zh: "分清真正的颠覆与单纯的电脑化"
    zh-TW: "分清真正的顛覆與單純的電腦化"
    ja: "本当の変革と単なるコンピュータ化を見分ける"
    ko: "진짜 혁신과 단순 전산화 구분하기"
    vi: "Phân biệt đổi mới đột phá với tin học hóa đơn thuần"
    ms: "Bezakan gangguan sebenar daripada pengkomputeran semata-mata"
    id: "Membedakan disrupsi nyata dari sekadar komputerisasi"
    hi: "असली बदलाव और सिर्फ़ कंप्यूटरीकरण में फ़र्क करना"
  - en: "Judge new ideas and spot chances to innovate"
    zh: "评估新想法，发现创新机会"
    zh-TW: "評估新點子，找出創新機會"
    ja: "新しいアイデアを評価し、革新の機会を見つける"
    ko: "새 아이디어를 평가하고 혁신 기회 찾기"
    vi: "Đánh giá ý tưởng mới và nhận ra cơ hội đổi mới"
    ms: "Nilai idea baharu dan kenal pasti peluang berinovasi"
    id: "Menilai ide baru dan melihat peluang berinovasi"
    hi: "नए आइडिया परखना और इनोवेशन के मौके पहचानना"
