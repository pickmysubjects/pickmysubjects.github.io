code: ELEN30011
year: 2026
learn:
  en: "Building models of real electrical devices, from capacitors to transistors and motors, from physics and lab data."
  zh: "根据物理原理和实验数据，为电容、晶体管、电机等器件建模。"
  zh-TW: "根據物理原理與實驗數據，為電容、電晶體、馬達等元件建模。"
  ja: "物理と実験データから、コンデンサ・トランジスタ・モーターなどのモデルを作る。"
  ko: "물리와 실험 데이터로 커패시터·트랜지스터·모터 등 소자 모델 만들기."
  vi: "Xây mô hình linh kiện điện thực, từ tụ điện tới transistor, động cơ, dựa trên vật lý và dữ liệu thí nghiệm."
  ms: "Membina model peranti elektrik sebenar, dari kapasitor hingga transistor dan motor, daripada fizik dan data makmal."
  id: "Membangun model perangkat listrik nyata, dari kapasitor hingga transistor dan motor, dari fisika dan data lab."
  hi: "भौतिकी और लैब डेटा से असली विद्युत उपकरणों, कैपेसिटर से ट्रांज़िस्टर व मोटर तक, के मॉडल बनाना।"
outcomes:
  - en: "Model devices from physics or measured data"
    zh: "依物理或实测数据为器件建模"
    zh-TW: "依物理或實測數據為元件建模"
    ja: "物理や実測から素子をモデル化する"
    ko: "물리·측정 데이터로 소자 모델링하기"
    vi: "Mô hình hóa linh kiện từ vật lý hoặc dữ liệu đo"
    ms: "Memodelkan peranti dari fizik atau data ukuran"
    id: "Memodelkan perangkat dari fisika atau data ukur"
    hi: "भौतिकी या मापे गए डेटा से उपकरण मॉडल करना"
  - en: "Run lab experiments on electronic devices"
    zh: "进行电子器件实验"
    zh-TW: "進行電子元件實驗"
    ja: "電子素子の実験を行う"
    ko: "전자 소자 실험 수행하기"
    vi: "Làm thí nghiệm với linh kiện điện tử"
    ms: "Menjalankan eksperimen peranti elektronik"
    id: "Melakukan eksperimen perangkat elektronik"
    hi: "इलेक्ट्रॉनिक उपकरणों पर लैब प्रयोग करना"
  - en: "Simulate device behaviour with software"
    zh: "用软件仿真器件行为"
    zh-TW: "用軟體模擬元件行為"
    ja: "ソフトで素子の挙動を模擬する"
    ko: "소프트웨어로 소자 동작 시뮬레이션하기"
    vi: "Mô phỏng hoạt động linh kiện bằng phần mềm"
    ms: "Mensimulasi kelakuan peranti dengan perisian"
    id: "Mensimulasikan perilaku perangkat dengan software"
    hi: "सॉफ़्टवेयर से उपकरण व्यवहार सिमुलेट करना"
