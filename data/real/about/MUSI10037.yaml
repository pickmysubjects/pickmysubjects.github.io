code: MUSI10037
year: 2027
learn:
  en: "Learn to listen actively and talk about music, across popular, classical, jazz and non-Western styles."
  zh: "学会主动聆听和谈论音乐，涵盖流行、古典、爵士和非西方风格。"
  zh-TW: "學會主動聆聽和談論音樂，涵蓋流行、古典、爵士和非西方風格。"
  ja: "ポピュラー、クラシック、ジャズ、非西洋音楽まで、能動的に聴き語る力を身につける。"
  ko: "대중음악·클래식·재즈·비서양 음악을 아우르며 능동적으로 듣고 말하는 법 배우기."
  vi: "Học cách nghe chủ động và bàn luận về âm nhạc, từ nhạc đại chúng, cổ điển, jazz đến ngoài phương Tây."
  ms: "Belajar mendengar secara aktif dan membincangkan muzik, merangkumi gaya popular, klasik, jaz dan bukan Barat."
  id: "Belajar mendengarkan secara aktif dan membicarakan musik, dari gaya populer, klasik, jazz, hingga non-Barat."
  hi: "पॉपुलर, क्लासिकल, जैज़ और गैर-पश्चिमी शैलियों में संगीत को ध्यान से सुनना और उस पर बात करना सीखें।"
outcomes:
  - en: "Tell musical styles apart by ear"
    zh: "凭听觉分辨不同音乐风格"
    zh-TW: "憑聽覺分辨不同音樂風格"
    ja: "耳で音楽のスタイルを聴き分ける"
    ko: "귀로 음악 스타일 구별하기"
    vi: "Phân biệt phong cách âm nhạc bằng tai"
    ms: "Bezakan gaya muzik dengan pendengaran"
    id: "Membedakan gaya musik lewat pendengaran"
    hi: "कान से संगीत शैलियों में फ़र्क करना"
  - en: "Describe music using the right terms"
    zh: "用恰当的术语描述音乐"
    zh-TW: "用恰當的術語描述音樂"
    ja: "適切な用語で音楽を説明する"
    ko: "알맞은 용어로 음악 설명하기"
    vi: "Mô tả âm nhạc bằng thuật ngữ phù hợp"
    ms: "Huraikan muzik dengan istilah yang betul"
    id: "Menjelaskan musik dengan istilah yang tepat"
    hi: "सही शब्दावली से संगीत का वर्णन करना"
