code: MUSI20176
year: 2026
learn:
  en: "Play in small and large jazz ensembles, arrange for your group and take more solo improvisation."
  zh: "在大小爵士乐团中演奏，为乐团编曲，并有更多即兴独奏。"
  zh-TW: "在大小爵士樂團中演奏，為樂團編曲，並有更多即興獨奏。"
  ja: "大小のジャズアンサンブルで演奏し、編曲やソロ即興にも取り組む。"
  ko: "대·소규모 재즈 앙상블에서 연주하고 편곡하며 즉흥 솔로를 늘림."
  vi: "Chơi trong nhóm jazz nhỏ và lớn, phối khí cho nhóm và ngẫu hứng solo nhiều hơn."
  ms: "Bermain dalam ensembel jaz kecil dan besar, mengatur muzik dan lebih banyak solo."
  id: "Bermain di ansambel jazz kecil dan besar, mengaransemen dan lebih banyak solo improvisasi."
  hi: "छोटे-बड़े जैज़ समूहों में बजाना, अरेंज करना और ज़्यादा सोलो इम्प्रोवाइज़ेशन।"
outcomes:
  - en: "Arrange music for a small ensemble"
    zh: "为小型乐团编曲"
    zh-TW: "為小型樂團編曲"
    ja: "小編成向けに編曲する"
    ko: "소규모 앙상블 편곡하기"
    vi: "Phối khí cho nhóm nhỏ"
    ms: "Atur muzik untuk ensembel kecil"
    id: "Mengaransemen untuk ansambel kecil"
    hi: "छोटे समूह के लिए अरेंजमेंट"
  - en: "Perform jazz across many styles"
    zh: "演奏多种风格的爵士乐"
    zh-TW: "演奏多種風格的爵士樂"
    ja: "多様なスタイルのジャズを演奏する"
    ko: "다양한 스타일의 재즈 연주하기"
    vi: "Biểu diễn jazz nhiều phong cách"
    ms: "Persembah jaz pelbagai gaya"
    id: "Membawakan jazz berbagai gaya"
    hi: "कई शैलियों में जैज़ बजाना"
  - en: "Build your own performing style"
    zh: "形成个人演奏风格"
    zh-TW: "形成個人演奏風格"
    ja: "自分の演奏スタイルを築く"
    ko: "나만의 연주 스타일 만들기"
    vi: "Hình thành phong cách biểu diễn riêng"
    ms: "Bina gaya persembahan sendiri"
    id: "Membangun gaya tampil sendiri"
    hi: "अपनी प्रदर्शन शैली बनाना"
