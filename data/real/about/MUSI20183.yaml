code: MUSI20183
year: 2026
learn:
  en: "The next step in interactive composition: a 16-minute audio-visual portfolio and a live presentation of your own event."
  zh: "互动作曲进阶：16分钟视听作品集，并现场呈现自己的作品活动。"
  zh-TW: "互動作曲進階：16分鐘視聽作品集，並現場呈現自己的作品活動。"
  ja: "インタラクティブ作曲の続き。16分の視聴覚作品集と自作イベントの発表。"
  ko: "인터랙티브 작곡 심화: 16분 시청각 포트폴리오와 자신의 이벤트 발표."
  vi: "Sáng tác tương tác nâng cao: tập nghe nhìn 16 phút và trình diễn sự kiện riêng."
  ms: "Gubahan interaktif lanjutan: portfolio audio-visual 16 minit dan acara persembahan sendiri."
  id: "Komposisi interaktif lanjutan: portofolio audio-visual 16 menit dan acara presentasi sendiri."
  hi: "इंटरैक्टिव रचना आगे: 16 मिनट का ऑडियो-विज़ुअल पोर्टफोलियो और अपने इवेंट की प्रस्तुति।"
outcomes:
  - en: "Create audio-visual compositions"
    zh: "创作视听作品"
    zh-TW: "創作視聽作品"
    ja: "視聴覚作品を作る"
    ko: "시청각 작품 만들기"
    vi: "Sáng tác tác phẩm nghe nhìn"
    ms: "Cipta gubahan audio-visual"
    id: "Membuat karya audio-visual"
