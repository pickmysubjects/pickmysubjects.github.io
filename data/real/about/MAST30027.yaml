code: MAST30027
year: 2026
learn:
  en: "Using computers to do statistics: simulation, Bayesian methods and models for categorical data."
  zh: "用电脑做统计：模拟、贝叶斯方法和分类数据的模型。"
  zh-TW: "用電腦做統計：模擬、貝氏方法和類別資料的模型。"
  ja: "コンピュータで統計を行う：シミュレーション、ベイズ法、カテゴリデータのモデル。"
  ko: "컴퓨터로 하는 통계: 시뮬레이션, 베이즈 방법, 범주형 데이터 모델."
  vi: "Dùng máy tính làm thống kê: mô phỏng, phương pháp Bayes và mô hình cho dữ liệu phân loại."
  ms: "Menggunakan komputer untuk statistik: simulasi, kaedah Bayesian dan model data berkategori."
  id: "Memakai komputer untuk statistik: simulasi, metode Bayesian, dan model data kategorik."
  hi: "कंप्यूटर से सांख्यिकी: सिमुलेशन, बायेसियन तरीके और श्रेणीबद्ध डेटा के मॉडल।"
outcomes:
  - en: "Pick a suitable statistical model for real data"
    zh: "为真实数据选合适的统计模型"
    zh-TW: "為真實資料選合適的統計模型"
    ja: "実データに合う統計モデルを選ぶ"
    ko: "실제 데이터에 맞는 통계 모델 고르기"
    vi: "Chọn mô hình thống kê phù hợp cho dữ liệu thực"
    ms: "Memilih model statistik yang sesuai untuk data sebenar"
    id: "Memilih model statistik yang cocok untuk data nyata"
    hi: "असली डेटा के लिए सही सांख्यिकीय मॉडल चुनना"
  - en: "Run the analysis in software and explain the results"
    zh: "用软件做分析并解释结果"
    zh-TW: "用軟體做分析並解釋結果"
    ja: "ソフトで分析し結果を説明する"
    ko: "소프트웨어로 분석하고 결과 설명하기"
    vi: "Phân tích bằng phần mềm và giải thích kết quả"
    ms: "Menjalankan analisis dalam perisian dan menerangkan hasil"
    id: "Menjalankan analisis di software dan menjelaskan hasilnya"
    hi: "सॉफ्टवेयर में विश्लेषण करना और नतीजे समझाना"
