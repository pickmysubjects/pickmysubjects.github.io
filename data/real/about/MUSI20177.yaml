code: MUSI20177
year: 2026
learn:
  en: "The harmony, rhythm and history behind contemporary music, with practical tutorials on leading an ensemble."
  zh: "当代音乐的和声、节奏和历史，并在实践课中学习带领乐团。"
  zh-TW: "當代音樂的和聲、節奏和歷史，並在實作課中學習帶領樂團。"
  ja: "現代音楽の和声・リズム・歴史を学び、実技でアンサンブルを率いる。"
  ko: "현대음악의 화성·리듬·역사를 배우고 실습에서 앙상블을 이끔."
  vi: "Hòa âm, tiết tấu và lịch sử nhạc đương đại, thực hành dẫn dắt ban nhạc."
  ms: "Harmoni, ritma dan sejarah muzik kontemporari, dengan tutorial memimpin ensembel."
  id: "Harmoni, ritme dan sejarah musik kontemporer, dengan praktik memimpin ansambel."
  hi: "समकालीन संगीत की हार्मनी, लय और इतिहास, साथ में समूह का नेतृत्व।"
outcomes:
  - en: "Describe the history of improvised music"
    zh: "讲述即兴音乐的历史"
    zh-TW: "講述即興音樂的歷史"
    ja: "即興音楽の歴史を説明する"
    ko: "즉흥음악의 역사 설명하기"
    vi: "Trình bày lịch sử nhạc ngẫu hứng"
    ms: "Huraikan sejarah muzik improvisasi"
    id: "Menjelaskan sejarah musik improvisasi"
    hi: "इम्प्रोवाइज़्ड संगीत का इतिहास बताना"
  - en: "Hear and perform rhythms and harmonies"
    zh: "听辨并演奏节奏与和声"
    zh-TW: "聽辨並演奏節奏與和聲"
    ja: "リズムと和声を聴き取り演奏する"
    ko: "리듬과 화성 듣고 연주하기"
    vi: "Nghe và thể hiện tiết tấu, hòa âm"
    ms: "Dengar dan persembah ritma serta harmoni"
    id: "Mendengar dan membawakan ritme serta harmoni"
    hi: "लय और हार्मनी सुनना व बजाना"
  - en: "Apply music theory to jazz"
    zh: "把乐理用于爵士"
    zh-TW: "把樂理用於爵士"
    ja: "音楽理論をジャズに応用する"
    ko: "음악 이론을 재즈에 적용하기"
    vi: "Áp dụng nhạc lý vào jazz"
    ms: "Guna teori muzik dalam jaz"
    id: "Menerapkan teori musik ke jazz"
    hi: "संगीत सिद्धांत को जैज़ पर लागू करना"
