code: MUSI10246
year: 2027
learn:
  en: "Basic solo and ensemble skills for jazz and improvisation, through lessons, rehearsals and performances."
  zh: "爵士与即兴的独奏和合奏基础，通过课程、排练和演出学习。"
  zh-TW: "爵士與即興的獨奏和合奏基礎，透過課程、排練和演出學習。"
  ja: "ジャズと即興のソロ・アンサンブルの基礎を、レッスン・リハーサル・本番で学ぶ。"
  ko: "재즈와 즉흥연주의 솔로·앙상블 기초를 레슨, 리허설, 공연으로 익힘."
  vi: "Kỹ năng cơ bản độc tấu và hòa tấu jazz, ứng tác qua các buổi học, tập và biểu diễn."
  ms: "Kemahiran asas solo dan ensembel untuk jaz dan improvisasi melalui kelas, latihan dan persembahan."
  id: "Keterampilan dasar solo dan ensambel untuk jazz dan improvisasi lewat kelas, latihan, dan pertunjukan."
  hi: "जैज़ और इम्प्रोवाइज़ेशन में सोलो व समूह वादन की बुनियादी कला, कक्षाओं, रिहर्सल और प्रदर्शन के ज़रिए।"
outcomes:
  - en: "Improvise using basic techniques"
    zh: "掌握基本的即兴演奏技巧"
    zh-TW: "掌握基本的即興演奏技巧"
    ja: "基本的な即興演奏の技術を使う"
    ko: "기본 즉흥연주 기법 활용하기"
    vi: "Ứng tác bằng các kỹ thuật cơ bản"
    ms: "Berimprovisasi dengan teknik asas"
    id: "Berimprovisasi dengan teknik dasar"
    hi: "बुनियादी तकनीकों से इम्प्रोवाइज़ करना"
  - en: "Use basic jazz harmony and chord building"
    zh: "运用爵士和声与和弦构成基础"
    zh-TW: "運用爵士和聲與和弦構成基礎"
    ja: "ジャズの和声とコード構成の基礎を使う"
    ko: "재즈 화성과 코드 구성 기초 활용하기"
    vi: "Dùng hòa âm jazz và cách dựng hợp âm cơ bản"
    ms: "Guna harmoni jaz dan binaan kord asas"
    id: "Memakai harmoni jazz dan susunan akor dasar"
    hi: "जैज़ हार्मनी और कॉर्ड बनाने की बुनियादी बातें"
  - en: "Play as an active member of a jazz ensemble"
    zh: "作为爵士乐团成员积极参与演奏"
    zh-TW: "作為爵士樂團成員積極參與演奏"
    ja: "ジャズアンサンブルの一員として積極的に演奏する"
    ko: "재즈 앙상블의 일원으로 적극 연주하기"
    vi: "Tham gia tích cực như thành viên ban nhạc jazz"
    ms: "Bermain aktif sebagai ahli ensembel jaz"
    id: "Bermain aktif sebagai anggota ensambel jazz"
    hi: "जैज़ समूह के सक्रिय सदस्य के रूप में बजाना"
