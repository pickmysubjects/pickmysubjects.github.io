code: HPSC30019
year: 2026
learn:
  en: "The history and philosophy of madness and mental illness: whether such illnesses are real kinds, and how treatments came about."
  zh: "疯狂与精神疾病的历史和哲学：这些疾病是否真实存在，治疗方法如何产生。"
  zh-TW: "瘋狂與精神疾病的歷史和哲學：這些疾病是否真實存在，治療方法如何產生。"
  ja: "狂気と精神疾患の歴史と哲学。病が実在する種類なのか、治療法がどう生まれたかを学ぶ。"
  ko: "광기와 정신질환의 역사와 철학: 이런 질환이 실재하는 종류인지, 치료법이 어떻게 생겼는지 배운다."
  vi: "Lịch sử và triết học về điên loạn và bệnh tâm thần: chúng có thật sự là một loại bệnh không, và cách chữa ra đời thế nào."
  ms: "Sejarah dan falsafah kegilaan dan penyakit mental: sama ada ia jenis yang nyata, dan bagaimana rawatan muncul."
  id: "Sejarah dan filsafat kegilaan dan penyakit mental: apakah ia jenis yang nyata, dan bagaimana pengobatan muncul."
  hi: "पागलपन और मानसिक बीमारी का इतिहास और दर्शन: क्या ये असली श्रेणियाँ हैं, और इलाज कैसे विकसित हुए।"
outcomes:
  - en: "Trace changing ideas of madness over time"
    zh: "梳理“疯狂”观念的历史变化"
    zh-TW: "梳理「瘋狂」觀念的歷史變化"
    ja: "狂気の考え方の移り変わりをたどる"
    ko: "광기 개념의 변화 따라가기"
    vi: "Lần theo sự thay đổi quan niệm về điên loạn"
    ms: "Jejaki perubahan idea tentang kegilaan"
    id: "Menelusuri perubahan gagasan tentang kegilaan"
    hi: "समय के साथ पागलपन की धारणाओं में बदलाव समझना"
  - en: "Discuss whether mental illnesses are natural kinds"
    zh: "讨论精神疾病是否属于自然类别"
    zh-TW: "討論精神疾病是否屬於自然類別"
    ja: "精神疾患が自然種かどうかを論じる"
    ko: "정신질환이 자연종인지 논의하기"
    vi: "Thảo luận bệnh tâm thần có phải loại tự nhiên không"
    ms: "Bincangkan sama ada penyakit mental jenis semula jadi"
    id: "Membahas apakah penyakit mental termasuk jenis alami"
    hi: "क्या मानसिक बीमारियाँ प्राकृतिक श्रेणियाँ हैं, चर्चा करना"
  - en: "Link theories of cause to forms of treatment"
    zh: "把病因理论与治疗方式联系起来"
    zh-TW: "把病因理論與治療方式聯繫起來"
    ja: "原因の理論と治療法を結びつける"
    ko: "원인 이론을 치료 방식에 연결하기"
    vi: "Liên hệ lý thuyết nguyên nhân với cách điều trị"
    ms: "Kaitkan teori punca dengan bentuk rawatan"
    id: "Mengaitkan teori penyebab dengan bentuk pengobatan"
    hi: "कारण के सिद्धांतों को इलाज के तरीकों से जोड़ना"
