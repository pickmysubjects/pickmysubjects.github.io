code: EVSC90025
year: 2027
learn:
  en: "Designing cities so stormwater, wastewater and water supply work together with the landscape."
  zh: "设计城市，让雨水、污水和供水与城市景观协同运作。"
  zh-TW: "設計城市，讓雨水、污水與供水和都市景觀協同運作。"
  ja: "雨水・下水・上水が景観と一体となって機能するよう都市を設計する。"
  ko: "빗물, 하수, 상수가 도시 경관과 함께 작동하도록 도시를 설계합니다."
  vi: "Thiết kế đô thị để nước mưa, nước thải và cấp nước hoạt động hài hòa với cảnh quan."
  ms: "Mereka bentuk bandar supaya air ribut, air sisa dan bekalan air berfungsi bersama landskap."
  id: "Merancang kota agar air hujan, air limbah, dan pasokan air bekerja selaras dengan lanskap."
  hi: "शहरों को ऐसे डिज़ाइन करना कि बरसाती पानी, अपशिष्ट जल और जल आपूर्ति परिदृश्य के साथ मिलकर काम करें।"
outcomes:
  - en: "Explain the urban water cycle and how its parts interact"
    zh: "解释城市水循环及其各部分的相互作用"
    zh-TW: "解釋都市水循環及其各部分的交互作用"
    ja: "都市の水循環と各要素の関係を説明する"
    ko: "도시 물순환과 구성 요소 간 상호작용 설명하기"
    vi: "Giải thích vòng tuần hoàn nước đô thị và các thành phần tương tác"
    ms: "Menerangkan kitaran air bandar dan interaksi bahagiannya"
    id: "Menjelaskan siklus air kota dan interaksi bagian-bagiannya"
    hi: "शहरी जल चक्र और उसके हिस्सों का आपसी संबंध समझाना"
  - en: "Compare WSUD options using modelling tools like MUSIC"
    zh: "用 MUSIC 等建模工具比较 WSUD 方案"
    zh-TW: "用 MUSIC 等建模工具比較 WSUD 方案"
    ja: "MUSIC などのツールで WSUD 案を比べる"
    ko: "MUSIC 같은 모델링 도구로 WSUD 대안 비교하기"
    vi: "So sánh phương án WSUD bằng công cụ như MUSIC"
    ms: "Membandingkan pilihan WSUD dengan alat pemodelan seperti MUSIC"
    id: "Membandingkan opsi WSUD dengan alat seperti MUSIC"
    hi: "MUSIC जैसे मॉडलिंग टूल से WSUD विकल्पों की तुलना"
  - en: "Design WSUD layouts for a given urban site"
    zh: "为给定城市地块设计 WSUD 方案"
    zh-TW: "為指定都市基地設計 WSUD 方案"
    ja: "与えられた街区に WSUD を設計する"
    ko: "주어진 도시 부지에 WSUD 설계하기"
    vi: "Thiết kế WSUD cho một khu đô thị cho trước"
    ms: "Mereka bentuk WSUD untuk tapak bandar yang diberi"
    id: "Merancang WSUD untuk tapak kota tertentu"
    hi: "दिए गए शहरी क्षेत्र के लिए WSUD डिज़ाइन"
