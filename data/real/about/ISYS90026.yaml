code: ISYS90026
year: 2027
learn:
  en: "How organisations use information systems: stakeholders, digital strategy, AI and responsible technology, through real cases."
  zh: "组织如何使用信息系统：相关方、数字化战略、人工智能与负责任的技术，结合真实案例。"
  zh-TW: "組織如何使用資訊系統：利害關係人、數位策略、人工智慧與負責任的科技，結合真實案例。"
  ja: "組織の情報システム活用：関係者、デジタル戦略、AI、責任ある技術を実例で学ぶ。"
  ko: "조직의 정보시스템 활용: 이해관계자, 디지털 전략, AI, 책임 있는 기술을 실제 사례로."
  vi: "Tổ chức dùng hệ thống thông tin thế nào: các bên liên quan, chiến lược số, AI, công nghệ có trách nhiệm, qua tình huống thật."
  ms: "Cara organisasi menggunakan sistem maklumat: pihak berkepentingan, strategi digital, AI dan teknologi bertanggungjawab, melalui kes sebenar."
  id: "Cara organisasi memakai sistem informasi: pemangku kepentingan, strategi digital, AI, teknologi bertanggung jawab, lewat kasus nyata."
  hi: "संगठन सूचना प्रणालियों का उपयोग कैसे करते हैं: हितधारक, डिजिटल रणनीति, AI और ज़िम्मेदार तकनीक, असली केस के साथ।"
outcomes:
  - en: "Look at an IT project from different stakeholders' views"
    zh: "从不同相关方的角度看一个IT项目"
    zh-TW: "從不同利害關係人的角度看一個IT專案"
    ja: "ITプロジェクトを関係者それぞれの視点で見る"
    ko: "IT 프로젝트를 여러 이해관계자 관점에서 보기"
    vi: "Nhìn một dự án IT từ góc độ các bên liên quan"
    ms: "Melihat projek IT dari sudut pihak berkepentingan berbeza"
    id: "Melihat proyek TI dari sudut pandang berbagai pihak"
    hi: "किसी IT प्रोजेक्ट को अलग-अलग हितधारकों की नज़र से देखना"
  - en: "Judge how technology can add business and social value"
    zh: "判断技术如何带来商业和社会价值"
    zh-TW: "判斷科技如何帶來商業與社會價值"
    ja: "技術が事業と社会にどう価値を生むか判断する"
    ko: "기술이 사업·사회적 가치를 어떻게 더하는지 판단하기"
    vi: "Đánh giá công nghệ tạo giá trị kinh doanh và xã hội ra sao"
    ms: "Menilai cara teknologi menambah nilai perniagaan dan sosial"
    id: "Menilai bagaimana teknologi menambah nilai bisnis dan sosial"
    hi: "आँकना कि तकनीक व्यापार और समाज के लिए कैसे मूल्य जोड़ती है"
