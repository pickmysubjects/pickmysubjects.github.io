code: ENGR30005
year: 2026
learn:
  en: "A two-week study tour abroad looking at how engineering works in another country and its culture."
  zh: "两周海外游学，了解另一个国家的工程实践与文化。"
  zh-TW: "兩週海外遊學，了解另一個國家的工程實務與文化。"
  ja: "2週間の海外研修で、他国の工学の実際と文化を学ぶ。"
  ko: "2주 해외 연수로 다른 나라의 공학 현장과 문화를 배운다."
  vi: "Chuyến học tập hai tuần ở nước ngoài, tìm hiểu kỹ thuật và văn hóa nước đó."
  ms: "Lawatan sambil belajar dua minggu di luar negara untuk melihat kejuruteraan dan budaya negara lain."
  id: "Studi tur dua minggu ke luar negeri untuk melihat praktik teknik dan budaya negara lain."
  hi: "दो हफ़्ते का विदेश स्टडी टूर: दूसरे देश में इंजीनियरिंग और उसकी संस्कृति को समझना।"
outcomes:
  - en: "Analyse engineering issues in a global context"
    zh: "在全球背景下分析工程问题"
    zh-TW: "在全球脈絡下分析工程問題"
    ja: "世界的な視点で工学の課題を分析する"
    ko: "글로벌 맥락에서 공학 문제를 분석한다"
    vi: "Phân tích vấn đề kỹ thuật trong bối cảnh toàn cầu"
    ms: "Analisis isu kejuruteraan dalam konteks global"
    id: "Menganalisis isu teknik dalam konteks global"
    hi: "वैश्विक संदर्भ में इंजीनियरिंग मुद्दों का विश्लेषण"
  - en: "Communicate across cultures"
    zh: "进行跨文化沟通"
    zh-TW: "進行跨文化溝通"
    ja: "異文化間でコミュニケーションする"
    ko: "문화 간에 소통한다"
    vi: "Giao tiếp liên văn hóa"
    ms: "Berkomunikasi merentas budaya"
    id: "Berkomunikasi lintas budaya"
    hi: "अलग संस्कृतियों के बीच संवाद करना"
