code: EURO20006
year: 2026
learn:
  en: "How Europe pictured its 'Others', such as Jews, Muslims, Roma and refugees, in books, film and food, and how that shaped identity."
  zh: "欧洲如何在书籍、电影和饮食中描绘“他者”（犹太人、穆斯林、罗姆人、难民），以及这如何塑造身份认同。"
  zh-TW: "歐洲如何在書籍、電影和飲食中描繪「他者」（猶太人、穆斯林、羅姆人、難民），以及這如何塑造身分認同。"
  ja: "ユダヤ人、ムスリム、ロマ、難民などの「他者」を、ヨーロッパは本や映画、食でどう描き、自己像をどう作ったか。"
  ko: "유럽이 유대인, 무슬림, 로마인, 난민 같은 '타자'를 책·영화·음식에서 어떻게 그렸고, 그것이 정체성을 어떻게 만들었나."
  vi: "Châu Âu khắc họa 'người khác' như người Do Thái, Hồi giáo, Roma, người tị nạn qua sách, phim, ẩm thực ra sao, và điều đó định hình bản sắc."
  ms: "Cara Eropah menggambarkan 'Orang Lain' seperti Yahudi, Muslim, Roma dan pelarian dalam buku, filem dan makanan, serta kesannya pada identiti."
  id: "Cara Eropa menggambarkan 'Liyan' seperti Yahudi, Muslim, Roma dan pengungsi dalam buku, film dan makanan, serta dampaknya pada identitas."
  hi: "यूरोप ने यहूदियों, मुसलमानों, रोमा और शरणार्थियों जैसे 'अन्यों' को किताबों, फ़िल्मों और खाने में कैसे दिखाया, और इससे पहचान कैसे बनी।"
outcomes:
  - en: "Analyse how 'Others' appear in European culture"
    zh: "分析欧洲文化中“他者”的形象"
    zh-TW: "分析歐洲文化中「他者」的形象"
    ja: "ヨーロッパ文化における「他者」の描かれ方を分析する"
    ko: "유럽 문화 속 '타자'의 모습 분석하기"
    vi: "Phân tích hình ảnh 'người khác' trong văn hóa châu Âu"
    ms: "Analisis gambaran 'Orang Lain' dalam budaya Eropah"
    id: "Menganalisis gambaran 'Liyan' dalam budaya Eropa"
    hi: "यूरोपीय संस्कृति में 'अन्य' के चित्रण का विश्लेषण करना"
  - en: "Explain how national identities are built"
    zh: "解释民族身份是如何建构的"
    zh-TW: "解釋民族身分是如何建構的"
    ja: "国民的アイデンティティの作られ方を説明する"
    ko: "국가 정체성이 만들어지는 방식 설명하기"
    vi: "Giải thích bản sắc dân tộc được xây dựng ra sao"
    ms: "Terangkan cara identiti nasional dibina"
    id: "Menjelaskan cara identitas nasional dibangun"
    hi: "राष्ट्रीय पहचान कैसे बनती है, समझाना"
  - en: "Compare national stories across Europe"
    zh: "比较欧洲各国的国家叙事"
    zh-TW: "比較歐洲各國的國家敘事"
    ja: "ヨーロッパ各国の国の物語を比べる"
    ko: "유럽 여러 나라의 국가 서사 비교하기"
    vi: "So sánh câu chuyện quốc gia khắp châu Âu"
    ms: "Bandingkan naratif nasional di seluruh Eropah"
    id: "Membandingkan narasi nasional di Eropa"
    hi: "यूरोप के देशों की राष्ट्रीय कहानियों की तुलना करना"
