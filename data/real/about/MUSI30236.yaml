code: MUSI30236
year: 2026
learn:
  en: "What a music producer does, from classic recordings to beats: critical listening, comparing productions and a logbook."
  zh: "音乐制作人的工作，从经典录音到节拍：批判性聆听、比较制作并记录日志。"
  zh-TW: "音樂製作人的工作，從經典錄音到節拍：批判性聆聽、比較製作並記錄日誌。"
  ja: "名録音からビートまで、音楽プロデューサーの仕事。批評的に聴き比べ、記録を残す。"
  ko: "고전 녹음부터 비트까지 프로듀서의 일: 비판적 듣기, 비교, 작업 일지."
  vi: "Nhà sản xuất âm nhạc làm gì, từ bản thu kinh điển tới beat: nghe phản biện, so sánh, nhật ký."
  ms: "Kerja penerbit muzik, dari rakaman klasik ke beat: mendengar kritis, membanding, buku log."
  id: "Kerja produser musik, dari rekaman klasik ke beat: mendengar kritis, membandingkan, logbook."
  hi: "संगीत निर्माता क्या करता है, क्लासिक रिकॉर्डिंग से बीट्स तक: आलोचनात्मक सुनना, तुलना, लॉगबुक।"
outcomes:
  - en: "Evaluate production choices in released recordings"
    zh: "评价已发行录音中的制作选择"
    zh-TW: "評價已發行錄音中的製作選擇"
    ja: "市販録音の制作上の判断を評価する"
    ko: "발매 음반의 프로덕션 선택 평가하기"
    vi: "Đánh giá lựa chọn sản xuất trong bản thu"
    ms: "Nilai pilihan penerbitan dalam rakaman"
    id: "Menilai pilihan produksi pada rekaman"
    hi: "जारी रिकॉर्डिंग में निर्माण के निर्णय परखना"
  - en: "Compare how different styles are produced"
    zh: "比较不同风格的制作方式"
    zh-TW: "比較不同風格的製作方式"
    ja: "様式ごとの制作の違いを比べる"
    ko: "스타일별 제작 방식 비교하기"
    vi: "So sánh cách sản xuất các phong cách khác nhau"
    ms: "Banding cara gaya berbeza dihasilkan"
    id: "Membandingkan cara produksi gaya berbeda"
    hi: "अलग शैलियों के निर्माण की तुलना करना"
  - en: "Apply production ideas to your own recordings"
    zh: "把制作理念用于自己的录音"
    zh-TW: "把製作理念用於自己的錄音"
    ja: "制作の考え方を自分の録音に使う"
    ko: "프로덕션 개념을 내 녹음에 적용하기"
    vi: "Áp dụng ý tưởng sản xuất vào bản thu của bạn"
    ms: "Guna idea penerbitan pada rakaman sendiri"
    id: "Menerapkan ide produksi ke rekaman sendiri"
    hi: "अपनी रिकॉर्डिंग पर निर्माण विचार लागू करना"
