code: PHYC30021
year: 2026
learn:
  en: "Advanced lab projects (nuclear, optics, electronics, astronomy) plus computational physics projects."
  zh: "高阶实验项目（核物理、光学、电子、天文）加计算物理。"
  zh-TW: "進階實驗專題（核物理、光學、電子、天文）加計算物理。"
  ja: "原子核・光学・電子回路・天文の実験課題と計算物理の課題。"
  ko: "핵물리, 광학, 전자, 천문 고급 실험과 계산 물리 프로젝트."
  vi: "Dự án thí nghiệm nâng cao (hạt nhân, quang, điện tử, thiên văn) và vật lý tính toán."
  ms: "Projek makmal lanjutan (nuklear, optik, elektronik, astronomi) dan fizik pengkomputeran."
  id: "Proyek lab lanjutan (nuklir, optik, elektronika, astronomi) dan fisika komputasi."
  hi: "एडवांस्ड लैब प्रोजेक्ट (न्यूक्लियर, ऑप्टिक्स, इलेक्ट्रॉनिक्स, खगोल) और कम्प्यूटेशनल फ़िज़िक्स।"
outcomes:
  - en: "Collect, analyse and interpret lab data"
    zh: "采集、分析和解读实验数据"
    zh-TW: "擷取、分析和解讀實驗數據"
    ja: "実験データを集め分析・解釈する"
    ko: "실험 데이터 수집·분석·해석하기"
    vi: "Thu thập, phân tích và diễn giải dữ liệu"
    ms: "Mengumpul, menganalisis dan mentafsir data makmal"
    id: "Mengumpulkan, menganalisis, dan menafsirkan data lab"
    hi: "लैब डेटा जुटाना, विश्लेषण और व्याख्या करना"
  - en: "Apply Monte Carlo and FFT to physics"
    zh: "把蒙特卡罗和FFT用于物理"
    zh-TW: "把蒙地卡羅和FFT用於物理"
    ja: "モンテカルロ法とFFTを物理に使う"
    ko: "몬테카를로와 FFT를 물리에 적용하기"
    vi: "Áp dụng Monte Carlo và FFT cho vật lý"
    ms: "Mengguna Monte Carlo dan FFT dalam fizik"
    id: "Menerapkan Monte Carlo dan FFT pada fisika"
    hi: "फ़िज़िक्स में Monte Carlo और FFT लगाना"
  - en: "Write scientific and technical reports"
    zh: "撰写科学技术报告"
    zh-TW: "撰寫科學技術報告"
    ja: "科学技術レポートを書く"
    ko: "과학 기술 보고서 작성하기"
    vi: "Viết báo cáo khoa học kỹ thuật"
    ms: "Menulis laporan saintifik dan teknikal"
    id: "Menulis laporan ilmiah dan teknis"
    hi: "वैज्ञानिक और तकनीकी रिपोर्ट लिखना"
