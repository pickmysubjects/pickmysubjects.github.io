code: GEOG20008
year: 2026
learn:
  en: "How class, gender, race and disability shape people's lives in cities, with your own field research in Melbourne."
  zh: "阶级、性别、种族和残障如何影响城市生活，并在墨尔本开展自己的田野调查。"
  zh-TW: "階級、性別、種族和身心障礙如何影響城市生活，並在墨爾本開展自己的田野調查。"
  ja: "階級・ジェンダー・人種・障害が都市での暮らしをどう形づくるかを、メルボルンでの自分の調査とともに学ぶ。"
  ko: "계급, 젠더, 인종, 장애가 도시 생활을 어떻게 만드는지 멜버른에서 직접 현장 조사하며 배운다."
  vi: "Giai cấp, giới, chủng tộc và khuyết tật định hình đời sống đô thị ra sao, kèm nghiên cứu thực địa của bạn ở Melbourne."
  ms: "Cara kelas, gender, kaum dan kecacatan membentuk hidup di bandar, dengan kajian lapangan anda sendiri di Melbourne."
  id: "Cara kelas, gender, ras, dan disabilitas membentuk hidup di kota, dengan riset lapangan Anda sendiri di Melbourne."
  hi: "वर्ग, जेंडर, नस्ल और विकलांगता शहरों में जीवन को कैसे गढ़ते हैं, मेलबर्न में आपके अपने फील्ड रिसर्च के साथ।"
outcomes:
  - en: "Compare theories of social difference in cities"
    zh: "比较城市社会差异的理论"
    zh-TW: "比較城市社會差異的理論"
    ja: "都市の社会的差異の理論を比べる"
    ko: "도시 내 사회적 차이 이론 비교하기"
    vi: "So sánh các lý thuyết về khác biệt xã hội trong đô thị"
    ms: "Bandingkan teori perbezaan sosial di bandar"
    id: "Membandingkan teori perbedaan sosial di kota"
    hi: "शहरों में सामाजिक अंतर के सिद्धांतों की तुलना करना"
  - en: "Carry out field research in Melbourne"
    zh: "在墨尔本开展田野调查"
    zh-TW: "在墨爾本開展田野調查"
    ja: "メルボルンでフィールド調査を行う"
    ko: "멜버른에서 현장 조사 수행하기"
    vi: "Thực hiện nghiên cứu thực địa ở Melbourne"
    ms: "Jalankan kajian lapangan di Melbourne"
    id: "Melakukan riset lapangan di Melbourne"
    hi: "मेलबर्न में फील्ड रिसर्च करना"
  - en: "Analyse issues like gentrification and housing"
    zh: "分析士绅化和住房等问题"
    zh-TW: "分析仕紳化和住房等問題"
    ja: "ジェントリフィケーションや住宅の問題を分析する"
    ko: "젠트리피케이션과 주거 문제 분석하기"
    vi: "Phân tích các vấn đề như cải tạo đô thị và nhà ở"
    ms: "Analisis isu seperti gentrifikasi dan perumahan"
    id: "Menganalisis isu seperti gentrifikasi dan perumahan"
    hi: "जेंट्रिफ़िकेशन और आवास जैसे मुद्दों का विश्लेषण करना"
