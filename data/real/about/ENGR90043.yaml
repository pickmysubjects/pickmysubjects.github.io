code: ENGR90043
year: 2027
learn:
  en: "A summer research project in a Mechanical Engineering research group, supervised by academic staff."
  zh: "在机械工程系研究组中完成的暑期研究项目，由教师指导。"
  zh-TW: "在機械工程系研究團隊中進行的暑期研究專題，由教師指導。"
  ja: "機械工学科の研究グループで、教員の指導のもと行う夏季集中の研究プロジェクト。"
  ko: "기계공학과 연구실에서 교수 지도 아래 진행하는 여름 집중 연구 프로젝트."
  vi: "Dự án nghiên cứu mùa hè trong một nhóm nghiên cứu Kỹ thuật Cơ khí, có giảng viên hướng dẫn."
  ms: "Projek penyelidikan musim panas dalam kumpulan penyelidikan Kejuruteraan Mekanikal, diselia staf akademik."
  id: "Proyek riset musim panas di kelompok riset Teknik Mesin, dibimbing dosen."
  hi: "मैकेनिकल इंजीनियरिंग के किसी शोध समूह में, स्टाफ़ की देखरेख में गर्मियों का शोध प्रोजेक्ट।"
outcomes:
  - en: "Review literature and frame a research problem"
    zh: "查阅文献并提出研究问题"
    zh-TW: "查閱文獻並界定研究問題"
    ja: "文献を調べ研究課題を設定する"
    ko: "문헌을 검토하고 연구 문제 설정하기"
    vi: "Tổng quan tài liệu và xác định vấn đề nghiên cứu"
    ms: "Menyemak literatur dan merangka masalah penyelidikan"
    id: "Meninjau literatur dan merumuskan masalah riset"
    hi: "साहित्य की समीक्षा कर शोध समस्या तय करना"
  - en: "Design experiments and analyse the data"
    zh: "设计实验并分析数据"
    zh-TW: "設計實驗並分析資料"
    ja: "実験を設計しデータを分析する"
    ko: "실험을 설계하고 데이터 분석하기"
    vi: "Thiết kế thí nghiệm và phân tích dữ liệu"
    ms: "Mereka bentuk eksperimen dan menganalisis data"
    id: "Merancang eksperimen dan menganalisis data"
    hi: "प्रयोग डिज़ाइन करना और डेटा का विश्लेषण"
  - en: "Write a technical report on the findings"
    zh: "撰写研究发现的技术报告"
    zh-TW: "撰寫研究發現的技術報告"
    ja: "結果を技術レポートにまとめる"
    ko: "결과를 기술 보고서로 작성하기"
    vi: "Viết báo cáo kỹ thuật về kết quả"
    ms: "Menulis laporan teknikal tentang dapatan"
    id: "Menulis laporan teknis tentang temuan"
    hi: "निष्कर्षों पर तकनीकी रिपोर्ट लिखना"
