code: CULS10005
year: 2026
learn:
  en: "An intro to cultural studies: how media and everyday practices shape how we see ourselves, others and the world."
  zh: "文化研究入门：媒体和日常实践如何影响我们看待自己、他人和世界。"
  zh-TW: "文化研究入門：媒體和日常實踐如何影響我們看待自己、他人和世界。"
  ja: "カルチュラル・スタディーズ入門。メディアと日常の営みが自分・他者・世界の見方をどう形づくるかを学ぶ。"
  ko: "문화연구 입문. 미디어와 일상 실천이 자신·타인·세계를 보는 방식을 어떻게 만드는지 배운다."
  vi: "Nhập môn nghiên cứu văn hóa: truyền thông và thực hành thường ngày định hình cách ta nhìn bản thân, người khác và thế giới."
  ms: "Pengenalan kajian budaya: cara media dan amalan harian membentuk pandangan kita tentang diri, orang lain dan dunia."
  id: "Pengantar kajian budaya: cara media dan praktik sehari-hari membentuk cara kita melihat diri, orang lain dan dunia."
  hi: "कल्चरल स्टडीज़ का परिचय: मीडिया और रोज़मर्रा की प्रथाएं हमारे खुद को, दूसरों को और दुनिया को देखने के तरीके को कैसे गढ़ती हैं।"
outcomes:
  - en: "Explain key ideas in cultural studies"
    zh: "说明文化研究的核心概念"
    zh-TW: "說明文化研究的核心概念"
    ja: "カルチュラル・スタディーズの主な考えを説明する"
    ko: "문화연구의 핵심 개념 설명하기"
    vi: "Giải thích các ý tưởng chính của nghiên cứu văn hóa"
    ms: "Terangkan idea utama kajian budaya"
    id: "Menjelaskan gagasan utama kajian budaya"
    hi: "कल्चरल स्टडीज़ के मुख्य विचार समझाना"
  - en: "Analyse representation in popular media"
    zh: "分析流行媒体中的再现"
    zh-TW: "分析流行媒體中的再現"
    ja: "大衆メディアにおける表象を分析する"
    ko: "대중 매체의 재현 분석하기"
    vi: "Phân tích sự biểu đạt trong truyền thông đại chúng"
    ms: "Analisis representasi dalam media popular"
    id: "Menganalisis representasi dalam media populer"
    hi: "लोकप्रिय मीडिया में प्रतिनिधित्व का विश्लेषण करना"
  - en: "Discuss how media shapes identity and groups"
    zh: "讨论媒体如何塑造身份和群体"
    zh-TW: "討論媒體如何塑造身分和群體"
    ja: "メディアがアイデンティティと集団をどう形づくるか論じる"
    ko: "미디어가 정체성과 집단을 만드는 방식 논의하기"
    vi: "Thảo luận truyền thông định hình bản sắc và nhóm ra sao"
    ms: "Bincangkan cara media membentuk identiti dan kumpulan"
    id: "Membahas cara media membentuk identitas dan kelompok"
    hi: "मीडिया पहचान और समूहों को कैसे गढ़ता है, चर्चा करना"
