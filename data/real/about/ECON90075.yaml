code: ECON90075
year: 2027
learn:
  en: "Using economics and data to analyse policy, with topics such as health, microeconomic reform, inequality and poverty."
  zh: "用经济学和数据分析政策，涵盖医疗、微观改革、收入分配与贫困。"
  zh-TW: "用經濟學與資料分析政策，涵蓋醫療、個體改革、所得分配與貧窮。"
  ja: "経済学とデータで政策を分析する。医療、ミクロ経済改革、格差、貧困など。"
  ko: "경제학과 데이터로 정책 분석: 보건, 미시경제 개혁, 불평등, 빈곤 등."
  vi: "Dùng kinh tế học và dữ liệu phân tích chính sách: y tế, cải cách vi mô, bất bình đẳng và nghèo đói."
  ms: "Menggunakan ekonomi dan data untuk menganalisis dasar: kesihatan, reformasi mikro, ketaksamaan dan kemiskinan."
  id: "Memakai ilmu ekonomi dan data untuk menganalisis kebijakan: kesehatan, reformasi mikro, ketimpangan, kemiskinan."
  hi: "अर्थशास्त्र व डेटा से नीति विश्लेषण: स्वास्थ्य, माइक्रोइकोनॉमिक सुधार, असमानता और गरीबी।"
outcomes:
  - en: "Apply micro principles to public policy"
    zh: "把微观经济原理用于公共政策"
    zh-TW: "將個體經濟原理用於公共政策"
    ja: "ミクロ経済の原理を公共政策に使う"
    ko: "미시경제 원리를 공공정책에 적용하기"
    vi: "Áp dụng nguyên lý vi mô vào chính sách công"
    ms: "Menggunakan prinsip mikro dalam dasar awam"
    id: "Menerapkan prinsip mikro pada kebijakan publik"
    hi: "सार्वजनिक नीति में माइक्रो सिद्धांत लागू करना"
  - en: "Evaluate current policy debates"
    zh: "评析当前的政策争论"
    zh-TW: "評析當前的政策爭論"
    ja: "現在の政策論争を評価する"
    ko: "현재 정책 논쟁 평가하기"
    vi: "Đánh giá các tranh luận chính sách hiện nay"
    ms: "Menilai perdebatan dasar semasa"
    id: "Menilai perdebatan kebijakan terkini"
    hi: "मौजूदा नीति बहसों का मूल्यांकन"
