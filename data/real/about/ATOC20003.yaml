code: ATOC20003
year: 2026
learn:
  en: "Using code and numerical models to study storms, wind, radiation and climate feedbacks."
  zh: "用编程和数值模型研究风暴、风、辐射与气候反馈。"
  zh-TW: "用程式和數值模型研究風暴、風、輻射與氣候回饋。"
  ja: "プログラムと数値モデルで嵐・風・放射・気候フィードバックを調べる。"
  ko: "코드와 수치 모델로 폭풍, 바람, 복사, 기후 피드백을 연구한다."
  vi: "Dùng lập trình và mô hình số để nghiên cứu bão, gió, bức xạ và phản hồi khí hậu."
  ms: "Guna kod dan model berangka untuk kaji ribut, angin, sinaran dan maklum balas iklim."
  id: "Memakai kode dan model numerik untuk mempelajari badai, angin, radiasi, dan umpan balik iklim."
  hi: "कोड और न्यूमेरिकल मॉडल से तूफ़ान, हवा, विकिरण और जलवायु फ़ीडबैक का अध्ययन।"
outcomes:
  - en: "Solve simple weather models numerically"
    zh: "用数值方法求解简单天气模型"
    zh-TW: "用數值方法求解簡單天氣模型"
    ja: "簡単な気象モデルを数値的に解く"
    ko: "간단한 기상 모델 수치 풀이하기"
    vi: "Giải mô hình thời tiết đơn giản bằng số"
    ms: "Selesaikan model cuaca mudah secara berangka"
    id: "Menyelesaikan model cuaca sederhana secara numerik"
    hi: "सरल मौसम मॉडल को न्यूमेरिकली हल करें"
  - en: "Code to analyse and map atmosphere data"
    zh: "编程分析和绘制大气数据"
    zh-TW: "寫程式分析與繪製大氣數據"
    ja: "大気データを解析・地図化するコードを書く"
    ko: "대기 데이터 분석·지도화 코딩하기"
    vi: "Lập trình phân tích và vẽ bản đồ dữ liệu khí quyển"
    ms: "Tulis kod untuk analisis dan peta data atmosfera"
    id: "Menulis kode untuk analisis dan peta data atmosfer"
    hi: "वायुमंडलीय डेटा के विश्लेषण व मैपिंग का कोड लिखें"
  - en: "Explain what different climate models can't do"
    zh: "解释各类气候模型的局限"
    zh-TW: "解釋各類氣候模型的局限"
    ja: "各種気候モデルの限界を説明する"
    ko: "기후 모델 유형별 한계 설명하기"
    vi: "Giải thích giới hạn của các loại mô hình khí hậu"
    ms: "Terangkan had pelbagai model iklim"
    id: "Menjelaskan batasan berbagai model iklim"
    hi: "अलग-अलग जलवायु मॉडलों की सीमाएँ समझाएँ"
