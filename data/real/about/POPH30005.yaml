code: POPH30005
year: 2026
learn:
  en: "How health messages work against misinformation and industry marketing, ending with content for a real campus health campaign."
  zh: "健康信息如何对抗虚假信息和行业营销，最后为一个真实的校园健康宣传活动制作内容。"
  zh-TW: "健康訊息如何對抗假訊息和產業行銷，最後為一個真實的校園健康宣傳活動製作內容。"
  ja: "健康メッセージで誤情報や企業のマーケティングにどう対抗するかを学び、最後に実際の学内健康キャンペーンの内容を作る。"
  ko: "건강 메시지로 허위 정보와 기업 마케팅에 맞서는 법을 배우고, 마지막에 실제 교내 건강 캠페인 콘텐츠를 만든다."
  vi: "Cách thông điệp sức khỏe chống lại tin sai và tiếp thị của doanh nghiệp, kết thúc bằng nội dung cho một chiến dịch sức khỏe thật trong trường."
  ms: "Cara mesej kesihatan melawan maklumat palsu dan pemasaran industri, diakhiri dengan kandungan untuk kempen kesihatan kampus sebenar."
  id: "Cara pesan kesehatan melawan misinformasi dan pemasaran industri, diakhiri dengan konten untuk kampanye kesehatan kampus sungguhan."
  hi: "हेल्थ मैसेज गलत जानकारी और कंपनियों की मार्केटिंग का मुकाबला कैसे करते हैं, अंत में कैंपस के असली हेल्थ कैंपेन के लिए कंटेंट बनाना।"
outcomes:
  - en: "Recognise how companies use open and hidden marketing to shape health choices"
    zh: "识别企业如何用公开和隐蔽的营销影响人们的健康选择"
    zh-TW: "辨識企業如何用公開和隱蔽的行銷影響人們的健康選擇"
    ja: "企業が表立った宣伝や隠れた宣伝で健康の選択に影響を与える方法を見抜く"
    ko: "기업이 드러난 마케팅과 숨은 마케팅으로 건강 선택에 영향을 주는 방식 알아보기"
    vi: "Nhận ra cách doanh nghiệp dùng tiếp thị công khai và ngầm để tác động đến lựa chọn sức khỏe"
    ms: "Mengenal pasti cara syarikat menggunakan pemasaran terbuka dan tersembunyi untuk mempengaruhi pilihan kesihatan"
    id: "Mengenali cara perusahaan memakai pemasaran terbuka dan terselubung untuk memengaruhi pilihan kesehatan"
    hi: "पहचानना कि कंपनियाँ खुली और छिपी मार्केटिंग से सेहत से जुड़े फ़ैसलों पर कैसे असर डालती हैं"
  - en: "Plan a health communication strategy using evidence, ethics and equity"
    zh: "结合证据、伦理和公平来规划健康传播策略"
    zh-TW: "結合證據、倫理和公平來規劃健康傳播策略"
    ja: "根拠・倫理・公平性をもとに健康コミュニケーションの戦略を立てる"
    ko: "근거, 윤리, 형평성을 바탕으로 건강 커뮤니케이션 전략 세우기"
    vi: "Lập chiến lược truyền thông sức khỏe dựa trên bằng chứng, đạo đức và công bằng"
    ms: "Merancang strategi komunikasi kesihatan berdasarkan bukti, etika dan ekuiti"
    id: "Merencanakan strategi komunikasi kesehatan berdasarkan bukti, etika, dan keadilan"
    hi: "सबूत, नैतिकता और बराबरी को ध्यान में रखकर हेल्थ कम्युनिकेशन की रणनीति बनाना"
  - en: "Make health messages for a live campaign as part of a team"
    zh: "以团队形式为正在进行的宣传活动制作健康信息"
    zh-TW: "以團隊形式為正在進行的宣傳活動製作健康訊息"
    ja: "チームで実際に進行中のキャンペーン用の健康メッセージを作る"
    ko: "팀으로 실제 진행 중인 캠페인용 건강 메시지 만들기"
    vi: "Làm việc nhóm để tạo thông điệp sức khỏe cho một chiến dịch đang diễn ra"
    ms: "Menghasilkan mesej kesihatan untuk kempen sebenar secara berkumpulan"
    id: "Membuat pesan kesehatan untuk kampanye yang sedang berjalan bersama tim"
    hi: "टीम में मिलकर चल रहे कैंपेन के लिए हेल्थ मैसेज बनाना"
