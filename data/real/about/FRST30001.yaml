code: FRST30001
year: 2026
learn:
  en: "How forests grow and are managed, mixing forest science with fire and what society wants from forests."
  zh: "森林如何生长与管理，结合森林科学、火和社会需求。"
  zh-TW: "森林如何生長與經營，結合森林科學、火與社會需求。"
  ja: "森林の成長と管理を、森林科学・火・社会のニーズから学ぶ。"
  ko: "숲이 자라고 관리되는 방식을 숲 과학, 불, 사회적 요구와 함께 배움."
  vi: "Rừng phát triển và được quản lý ra sao, kết hợp khoa học rừng, lửa và nhu cầu xã hội."
  ms: "Cara hutan tumbuh dan diurus, gabungan sains hutan, api dan kehendak masyarakat."
  id: "Cara hutan tumbuh dan dikelola, memadukan ilmu hutan, api, dan kebutuhan masyarakat."
  hi: "जंगल कैसे बढ़ते और प्रबंधित होते हैं, वन विज्ञान, आग और समाज की ज़रूरतों के साथ।"
outcomes:
  - en: "Explain forest growth and how management steers it"
    zh: "解释森林如何生长、管理如何影响它"
    zh-TW: "解釋森林如何生長、經營如何影響它"
    ja: "森林の成長と管理の効果を説明する"
    ko: "숲이 어떻게 자라고 관리가 어떤 영향을 주는지 설명하기"
    vi: "Giải thích rừng phát triển ra sao và quản lý tác động thế nào"
    ms: "Terangkan pertumbuhan hutan dan peranan pengurusan"
    id: "Menjelaskan pertumbuhan hutan dan peran pengelolaan"
    hi: "वन वृद्धि और प्रबंधन का असर समझाना"
  - en: "Describe fire's role in forests and its use in management"
    zh: "描述火在森林中的作用及其管理用途"
    zh-TW: "描述火在森林中的角色及其經營用途"
    ja: "森林での火の役割と管理への利用を説明する"
    ko: "숲에서 불의 역할과 관리 활용 설명하기"
    vi: "Mô tả vai trò của lửa trong rừng và trong quản lý"
    ms: "Huraikan peranan api dalam hutan dan pengurusan"
    id: "Menjelaskan peran api di hutan dan pengelolaannya"
    hi: "जंगल में आग की भूमिका और प्रबंधन में उपयोग बताना"
  - en: "Weigh what different groups want from forests"
    zh: "权衡不同群体对森林的需求"
    zh-TW: "權衡不同群體對森林的需求"
    ja: "森林に求めるものが人によってどう違うか比べる"
    ko: "여러 집단이 숲에 바라는 것 따져 보기"
    vi: "Cân nhắc mong muốn khác nhau của các nhóm đối với rừng"
    ms: "Timbang kehendak pelbagai kumpulan terhadap hutan"
    id: "Menimbang keinginan berbagai kelompok terhadap hutan"
    hi: "अलग-अलग समूह जंगलों से क्या चाहते हैं, इसे तौलना"
