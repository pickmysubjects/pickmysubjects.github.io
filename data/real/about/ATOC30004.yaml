code: ATOC30004
year: 2026
learn:
  en: "The physics of how air and oceans move, from pressure systems and Rossby waves to weather models."
  zh: "大气和海洋运动的物理：从高低压系统、罗斯贝波到天气模型。"
  zh-TW: "大氣與海洋運動的物理：從高低壓系統、羅士比波到天氣模型。"
  ja: "大気と海洋の運動の物理：高低気圧、ロスビー波から気象モデルまで。"
  ko: "대기와 해양 운동의 물리: 고·저기압, 로스비파에서 기상 모델까지."
  vi: "Vật lý về chuyển động của khí quyển và đại dương: hệ áp suất, sóng Rossby đến mô hình thời tiết."
  ms: "Fizik pergerakan udara dan laut: sistem tekanan, gelombang Rossby hingga model cuaca."
  id: "Fisika gerak udara dan laut: sistem tekanan, gelombang Rossby, hingga model cuaca."
  hi: "हवा और समुद्र की गति की भौतिकी: दाब प्रणालियाँ, रॉस्बी तरंगें और मौसम मॉडल।"
outcomes:
  - en: "Derive equations of air and ocean motion"
    zh: "推导大气和海洋运动方程"
    zh-TW: "推導大氣與海洋運動方程"
    ja: "大気・海洋の運動方程式を導く"
    ko: "대기·해양 운동 방정식 유도하기"
    vi: "Suy ra phương trình chuyển động khí quyển, đại dương"
    ms: "Terbitkan persamaan gerakan udara dan laut"
    id: "Menurunkan persamaan gerak udara dan laut"
    hi: "हवा और समुद्र की गति के समीकरण निकालें"
  - en: "Explain how pressure systems shape weather"
    zh: "解释气压系统如何影响天气"
    zh-TW: "解釋氣壓系統如何影響天氣"
    ja: "気圧配置が天気に与える影響を説明する"
    ko: "기압 계통이 날씨에 미치는 영향 설명하기"
    vi: "Giải thích hệ áp suất ảnh hưởng thời tiết"
    ms: "Terangkan kesan sistem tekanan pada cuaca"
    id: "Menjelaskan pengaruh sistem tekanan pada cuaca"
    hi: "दाब प्रणालियाँ मौसम कैसे बनाती हैं, समझाएँ"
  - en: "Explain how weather models are built"
    zh: "解释天气模型是如何构建的"
    zh-TW: "解釋天氣模型如何建構"
    ja: "気象モデルの作り方を説明する"
    ko: "기상 모델 구축 방식 설명하기"
    vi: "Giải thích cách xây dựng mô hình thời tiết"
    ms: "Terangkan cara model cuaca dibina"
    id: "Menjelaskan cara model cuaca dibangun"
    hi: "मौसम मॉडल कैसे बनते हैं, समझाएँ"
