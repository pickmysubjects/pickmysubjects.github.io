code: MUST30013
year: 2026
learn:
  en: "Join a professional music theatre production on secondment, study its techniques and perform an excerpt from your role."
  zh: "借调到专业音乐剧制作中，研究其技巧，并表演自己角色的一段。"
  zh-TW: "借調到專業音樂劇製作中，研究其技巧，並演出自己角色的一段。"
  ja: "プロのミュージカル公演に派遣され、技法を学び、自分の役の一部を演じる。"
  ko: "전문 뮤지컬 제작에 파견되어 기법을 배우고 맡은 역의 일부를 공연한다."
  vi: "Tham gia một vở nhạc kịch chuyên nghiệp, học kỹ thuật và diễn một đoạn vai mình."
  ms: "Sertai produksi teater muzikal profesional dan persembahkan petikan peranan anda."
  id: "Bergabung di produksi teater musikal profesional dan menampilkan cuplikan peran."
  hi: "पेशेवर म्यूज़िक थिएटर प्रोडक्शन में शामिल होकर तकनीक सीखना और अपनी भूमिका का अंश प्रस्तुत करना।"
outcomes:
  - en: "Work inside a professional production"
    zh: "在专业制作中工作"
    zh-TW: "在專業製作中工作"
    ja: "プロの公演の中で働く"
    ko: "전문 제작 현장에서 일하기"
    vi: "Làm việc trong vở chuyên nghiệp"
    ms: "Bekerja dalam produksi profesional"
    id: "Bekerja di produksi profesional"
    hi: "पेशेवर प्रोडक्शन के अंदर काम करना"
  - en: "Analyse the techniques a show uses"
    zh: "分析一部剧使用的技巧"
    zh-TW: "分析一齣劇使用的技巧"
    ja: "作品で使われる技法を分析する"
    ko: "공연에 쓰인 기법 분석하기"
    vi: "Phân tích kỹ thuật của vở diễn"
    ms: "Analisis teknik yang digunakan"
    id: "Menganalisis teknik pertunjukan"
    hi: "शो की तकनीकों का विश्लेषण"
  - en: "Perform an excerpt to a professional standard"
    zh: "以专业水准表演片段"
    zh-TW: "以專業水準演出片段"
    ja: "プロの水準で抜粋を演じる"
    ko: "전문 수준으로 발췌 공연하기"
    vi: "Diễn một đoạn đạt chuẩn chuyên nghiệp"
    ms: "Persembah petikan pada tahap profesional"
    id: "Menampilkan cuplikan secara profesional"
    hi: "पेशेवर स्तर पर अंश प्रस्तुत करना"
