code: MUSI30019
year: 2026
learn:
  en: "Small-group chamber music with a tutor, refining listening and teamwork towards a public concert."
  zh: "在导师指导下进行小组室内乐，提升聆听与配合，最终公开演出。"
  zh-TW: "在導師指導下進行小組室內樂，提升聆聽與配合，最終公開演出。"
  ja: "講師と小編成の室内楽に取り組み、聴く力と協調を磨いて公開演奏へ。"
  ko: "튜터와 함께 소규모 실내악을 하며 듣기와 협업을 다듬어 공개 연주."
  vi: "Thính phòng nhóm nhỏ với giảng viên, rèn nghe và phối hợp, hướng tới buổi diễn công khai."
  ms: "Muzik kamar berkumpulan kecil bersama tutor, mengasah pendengaran ke arah konsert awam."
  id: "Musik kamar kelompok kecil bersama tutor, mengasah mendengar menuju konser publik."
  hi: "ट्यूटर के साथ छोटे समूह में चैम्बर संगीत, सुनना और तालमेल निखारकर सार्वजनिक प्रस्तुति।"
outcomes:
  - en: "Listen and react closely within a small group"
    zh: "在小组中细心聆听并即时回应"
    zh-TW: "在小組中細心聆聽並即時回應"
    ja: "小編成で注意深く聴き反応する"
    ko: "소규모 그룹에서 세심히 듣고 반응하기"
    vi: "Lắng nghe và phản ứng sát trong nhóm nhỏ"
    ms: "Dengar dan beri respons rapat dalam kumpulan"
    id: "Mendengar dan merespons erat dalam kelompok"
    hi: "छोटे समूह में ध्यान से सुनना और प्रतिक्रिया देना"
  - en: "Plan and run your group's rehearsals"
    zh: "规划并组织小组排练"
    zh-TW: "規劃並組織小組排練"
    ja: "グループの練習を計画し進める"
    ko: "그룹 리허설 계획하고 진행하기"
    vi: "Lên kế hoạch và điều hành buổi tập nhóm"
    ms: "Rancang dan urus latihan kumpulan"
    id: "Merencanakan dan menjalankan latihan kelompok"
    hi: "समूह के रिहर्सल की योजना बनाना और चलाना"
  - en: "Give a concert-standard chamber performance"
    zh: "呈现音乐会水准的室内乐演出"
    zh-TW: "呈現音樂會水準的室內樂演出"
    ja: "演奏会水準の室内楽を披露する"
    ko: "공연 수준의 실내악 연주하기"
    vi: "Biểu diễn thính phòng đạt chuẩn hòa nhạc"
    ms: "Persembahan muzik kamar bertaraf konsert"
    id: "Tampil musik kamar setara konser"
    hi: "कॉन्सर्ट स्तर की चैम्बर प्रस्तुति देना"
