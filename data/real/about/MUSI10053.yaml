code: MUSI10053
year: 2026
learn:
  en: "Rehearse and perform varied repertoire, from transcriptions to original works, in a large brass ensemble."
  zh: "在大型铜管合奏团中排练并演出多样曲目，包括改编曲和原创作品。"
  zh-TW: "在大型銅管合奏團中排練並演出多樣曲目，包括改編曲與原創作品。"
  ja: "大編成の金管アンサンブルで編曲作品からオリジナル曲まで幅広く練習・演奏。"
  ko: "대형 금관 앙상블에서 편곡부터 창작곡까지 다양한 곡을 연습하고 공연."
  vi: "Tập và biểu diễn nhiều tiết mục, từ chuyển soạn đến tác phẩm gốc, trong dàn kèn đồng lớn."
  ms: "Berlatih dan membuat persembahan pelbagai repertoir dalam ensembel brass besar."
  id: "Berlatih dan tampil dengan beragam repertoar, dari aransemen hingga karya asli, di ansambel brass besar."
  hi: "बड़े ब्रास समूह में ट्रांसक्रिप्शन से मूल रचनाओं तक विविध संगीत का अभ्यास और प्रदर्शन।"
outcomes:
  - en: "Prepare parts for each rehearsal"
    zh: "为每次排练准备好声部"
    zh-TW: "為每次排練準備好聲部"
    ja: "毎回の練習に向けパートを準備する"
    ko: "매 리허설 파트 준비하기"
    vi: "Chuẩn bị bè cho mỗi buổi tập"
    ms: "Sedia bahagian untuk setiap latihan"
    id: "Menyiapkan bagian untuk tiap latihan"
    hi: "हर रिहर्सल के लिए भाग तैयार करना"
  - en: "Play in a large brass section"
    zh: "在大型铜管声部中演奏"
    zh-TW: "在大型銅管聲部中演奏"
    ja: "大きな金管セクションで演奏する"
    ko: "대규모 금관 파트에서 연주하기"
    vi: "Chơi trong bè kèn đồng lớn"
    ms: "Main dalam seksyen brass besar"
    id: "Bermain dalam seksi brass besar"
    hi: "बड़े ब्रास सेक्शन में बजाना"
  - en: "Perform a range of brass styles"
    zh: "演奏多种铜管风格"
    zh-TW: "演奏多種銅管風格"
    ja: "さまざまな金管の様式を演奏する"
    ko: "다양한 금관 스타일 연주하기"
    vi: "Biểu diễn nhiều phong cách kèn đồng"
    ms: "Persembah pelbagai gaya brass"
    id: "Membawakan beragam gaya brass"
    hi: "कई तरह की ब्रास शैलियाँ बजाना"
