code: ECOM30004
year: 2026
learn:
  en: "Forecasting economic and financial data with time series models like ARIMA, VAR and ARCH."
  zh: "用ARIMA、VAR、ARCH等时间序列模型预测经济和金融数据。"
  zh-TW: "用ARIMA、VAR、ARCH等時間序列模型預測經濟和金融資料。"
  ja: "ARIMA・VAR・ARCHなどの時系列モデルで経済・金融データを予測する。"
  ko: "ARIMA, VAR, ARCH 같은 시계열 모형으로 경제·금융 데이터 예측."
  vi: "Dự báo dữ liệu kinh tế và tài chính bằng các mô hình chuỗi thời gian như ARIMA, VAR và ARCH."
  ms: "Meramal data ekonomi dan kewangan dengan model siri masa seperti ARIMA, VAR dan ARCH."
  id: "Meramal data ekonomi dan keuangan dengan model deret waktu seperti ARIMA, VAR, dan ARCH."
  hi: "ARIMA, VAR और ARCH जैसे टाइम सीरीज़ मॉडल से आर्थिक व वित्तीय डेटा का पूर्वानुमान।"
outcomes:
  - en: "Pick a forecasting model for a single time series"
    zh: "为单个时间序列选择预测模型"
    zh-TW: "為單一時間序列選擇預測模型"
    ja: "単一の時系列に合う予測モデルを選ぶ"
    ko: "단일 시계열에 맞는 예측 모형 선택"
    vi: "Chọn mô hình dự báo cho một chuỗi thời gian"
    ms: "Pilih model ramalan untuk satu siri masa"
    id: "Memilih model peramalan untuk satu deret waktu"
    hi: "एक टाइम सीरीज़ के लिए पूर्वानुमान मॉडल चुनना"
  - en: "Study how several economic series move together"
    zh: "分析多个经济序列如何共同变动"
    zh-TW: "分析多個經濟序列如何連動"
    ja: "複数の経済系列の連動を分析する"
    ko: "여러 경제 시계열이 함께 움직이는 방식 분석"
    vi: "Phân tích cách nhiều chuỗi kinh tế biến động cùng nhau"
    ms: "Kaji cara beberapa siri ekonomi bergerak bersama"
    id: "Menganalisis bagaimana beberapa deret ekonomi bergerak bersama"
    hi: "कई आर्थिक सीरीज़ साथ कैसे चलती हैं, यह परखना"
  - en: "Model and forecast market volatility"
    zh: "对市场波动建模并预测"
    zh-TW: "對市場波動建模並預測"
    ja: "市場のボラティリティをモデル化し予測する"
    ko: "시장 변동성 모형화·예측"
    vi: "Lập mô hình và dự báo biến động thị trường"
    ms: "Modelkan dan ramal kemeruapan pasaran"
    id: "Memodelkan dan meramal volatilitas pasar"
    hi: "बाज़ार के उतार-चढ़ाव का मॉडल और पूर्वानुमान"
