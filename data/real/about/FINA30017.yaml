code: FINA30017
year: 2026
learn:
  en: "Staff-led seminars on current art theory, criticism and history, going deep into one theme of contemporary culture."
  zh: "教师主持的研讨课，深入当代艺术理论、批评与艺术史的一个主题。"
  zh-TW: "教師主持的研討課，深入當代藝術理論、批評與藝術史的一個主題。"
  ja: "教員のセミナーで、現代美術の理論・批評・歴史の一テーマを掘り下げる。"
  ko: "교수진 세미나로 현대 미술 이론·비평·역사의 한 주제를 깊이 다룬다."
  vi: "Seminar do giảng viên dẫn về lý thuyết, phê bình, lịch sử nghệ thuật đương đại."
  ms: "Seminar staf tentang teori, kritikan dan sejarah seni semasa, mendalami satu tema."
  id: "Seminar dosen soal teori, kritik dan sejarah seni kini, mendalami satu tema."
  hi: "स्टाफ़ के सेमिनार: समकालीन कला-सिद्धांत, आलोचना और इतिहास के एक विषय में गहराई।"
outcomes:
  - en: "Present on a theme in contemporary art"
    zh: "就当代艺术主题做展示"
    zh-TW: "就當代藝術主題做報告"
    ja: "現代美術のテーマについて発表する"
    ko: "현대 미술 주제로 발표하기"
    vi: "Thuyết trình về một chủ đề nghệ thuật đương đại"
    ms: "Bentang tema dalam seni kontemporari"
    id: "Presentasi tentang tema seni kontemporer"
    hi: "समकालीन कला के विषय पर प्रस्तुति"
  - en: "Use art theory terms with confidence"
    zh: "熟练使用艺术理论术语"
    zh-TW: "熟練使用藝術理論術語"
    ja: "美術理論の用語を使いこなす"
    ko: "미술 이론 용어 능숙하게 쓰기"
    vi: "Dùng thuật ngữ lý thuyết nghệ thuật vững vàng"
    ms: "Guna istilah teori seni dengan yakin"
    id: "Memakai istilah teori seni dengan yakin"
    hi: "कला-सिद्धांत के शब्दों का आत्मविश्वास से उपयोग"
  - en: "Argue a position in an oral assessment"
    zh: "在口头考核中论证观点"
    zh-TW: "在口頭評量中論證觀點"
    ja: "口頭評価で立場を論じる"
    ko: "구술 평가에서 입장 논증하기"
    vi: "Lập luận một quan điểm khi vấn đáp"
    ms: "Hujahkan pendirian dalam penilaian lisan"
    id: "Memperdebatkan posisi dalam asesmen lisan"
    hi: "मौखिक मूल्यांकन में अपना पक्ष रखना"
