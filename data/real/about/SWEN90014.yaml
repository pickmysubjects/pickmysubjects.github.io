code: SWEN90014
year: 2027
learn:
  en: "A team software project for a real client: requirements, design, building, testing and project management."
  zh: "为真实客户做的团队软件项目：需求、设计、开发、测试与项目管理。"
  zh-TW: "為真實客戶做的團隊軟體專案：需求、設計、開發、測試與專案管理。"
  ja: "実際の顧客向けチーム開発：要求、設計、実装、テスト、プロジェクト管理。"
  ko: "실제 고객을 위한 팀 소프트웨어 프로젝트: 요구사항, 설계, 구현, 테스트, 프로젝트 관리."
  vi: "Dự án phần mềm nhóm cho khách hàng thật: yêu cầu, thiết kế, xây dựng, kiểm thử, quản lý dự án."
  ms: "Projek perisian berkumpulan untuk pelanggan sebenar: keperluan, reka bentuk, pembinaan, ujian dan pengurusan projek."
  id: "Proyek perangkat lunak tim untuk klien nyata: kebutuhan, desain, pembangunan, pengujian, manajemen proyek."
  hi: "असली क्लाइंट के लिए टीम सॉफ़्टवेयर प्रोजेक्ट: आवश्यकताएँ, डिज़ाइन, निर्माण, परीक्षण, प्रोजेक्ट प्रबंधन।"
outcomes:
  - en: "Build and test working software with a team"
    zh: "与团队一起开发并测试可用的软件"
    zh-TW: "與團隊一起開發並測試可用的軟體"
    ja: "チームで動くソフトを作りテストする"
    ko: "팀과 함께 동작하는 소프트웨어 만들고 테스트하기"
    vi: "Cùng nhóm xây dựng và kiểm thử phần mềm chạy được"
    ms: "Membina dan menguji perisian yang berfungsi bersama pasukan"
    id: "Membangun dan menguji perangkat lunak bersama tim"
    hi: "टीम के साथ चलने वाला सॉफ़्टवेयर बनाना और परखना"
  - en: "Run a repeatable process to deliver to a client"
    zh: "用可重复的流程向客户交付"
    zh-TW: "以可重複的流程向客戶交付"
    ja: "繰り返せるプロセスで顧客に納品する"
    ko: "반복 가능한 프로세스로 고객에게 납품하기"
    vi: "Áp dụng quy trình lặp lại được để giao cho khách hàng"
    ms: "Menjalankan proses berulang untuk menyerahkan kepada pelanggan"
    id: "Menjalankan proses yang dapat diulang untuk menyerahkan ke klien"
    hi: "दोहराने योग्य प्रक्रिया से क्लाइंट को डिलीवर करना"
