code: PHIL30052
year: 2026
learn:
  en: "Philosophical questions about race and gender: what they are, how they connect, and what a just future would look like."
  zh: "关于种族与性别的哲学问题：它们是什么、如何相互关联，以及公正的未来应是什么样。"
  zh-TW: "關於種族與性別的哲學問題：它們是什麼、如何相互關聯，以及公正的未來應是什麼樣。"
  ja: "人種とジェンダーをめぐる哲学的な問い。それが何で、どう結びつき、公正な未来はどんな姿かを考える。"
  ko: "인종과 젠더에 관한 철학적 질문. 그것이 무엇이고 어떻게 얽히며 정의로운 미래는 어떤 모습인지 다룬다."
  vi: "Câu hỏi triết học về chủng tộc và giới: chúng là gì, liên hệ ra sao và một tương lai công bằng sẽ thế nào."
  ms: "Persoalan falsafah tentang kaum dan gender: apa ia, bagaimana ia berkait, dan rupa masa depan yang adil."
  id: "Pertanyaan filsafat tentang ras dan gender: apa itu, bagaimana saling terkait, dan seperti apa masa depan yang adil."
  hi: "नस्ल और जेंडर पर दार्शनिक सवाल: ये क्या हैं, कैसे जुड़े हैं, और एक न्यायपूर्ण भविष्य कैसा होगा।"
outcomes:
  - en: "Explain theories of what race and gender are"
    zh: "说明关于种族与性别本质的理论"
    zh-TW: "說明關於種族與性別本質的理論"
    ja: "人種とジェンダーとは何かの理論を説明する"
    ko: "인종과 젠더가 무엇인지에 관한 이론 설명하기"
    vi: "Giải thích các lý thuyết về bản chất chủng tộc và giới"
    ms: "Terangkan teori tentang apa itu kaum dan gender"
    id: "Menjelaskan teori tentang apa itu ras dan gender"
    hi: "नस्ल और जेंडर क्या हैं, इसके सिद्धांत समझाना"
  - en: "Analyse how race and gender intersect"
    zh: "分析种族与性别如何交织"
    zh-TW: "分析種族與性別如何交織"
    ja: "人種とジェンダーの交わりを分析する"
    ko: "인종과 젠더의 교차 분석하기"
    vi: "Phân tích chủng tộc và giới giao thoa ra sao"
    ms: "Analisis persilangan kaum dan gender"
    id: "Menganalisis persilangan ras dan gender"
    hi: "नस्ल और जेंडर कैसे एक-दूसरे से जुड़ते हैं, विश्लेषण करना"
  - en: "Assess views on justice and structural racism"
    zh: "评估关于正义和结构性种族主义的观点"
    zh-TW: "評估關於正義和結構性種族主義的觀點"
    ja: "正義と構造的人種差別についての見方を評価する"
    ko: "정의와 구조적 인종차별에 관한 견해 평가하기"
    vi: "Đánh giá quan điểm về công lý và phân biệt chủng tộc mang tính cấu trúc"
    ms: "Nilai pandangan tentang keadilan dan perkauman struktur"
    id: "Menilai pandangan tentang keadilan dan rasisme struktural"
    hi: "न्याय और संरचनात्मक नस्लवाद पर विचारों को परखना"
