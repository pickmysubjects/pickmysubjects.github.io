code: ABPL90134
year: 2027
learn:
  en: "The main planning theories of the last two centuries and why planning arose, with Australia set in an international context."
  zh: "近两个世纪的主要规划理论以及规划为何出现，把澳大利亚放在国际背景中看。"
  zh-TW: "近兩個世紀的主要規劃理論以及規劃為何出現，把澳洲放在國際脈絡中看。"
  ja: "過去200年の主な計画理論と計画が生まれた理由。豪州を国際的文脈で見る。"
  ko: "지난 200년의 주요 계획 이론과 계획의 등장 배경. 국제적 맥락의 호주."
  vi: "Các lý thuyết quy hoạch chính trong hai thế kỷ qua và vì sao quy hoạch ra đời."
  ms: "Teori perancangan utama dua abad lalu dan sebab perancangan wujud."
  id: "Teori perencanaan utama dua abad terakhir dan mengapa perencanaan muncul."
  hi: "पिछली दो सदियों के मुख्य नियोजन सिद्धांत और नियोजन क्यों उभरा।"
outcomes:
  - en: "Explain how planning theories developed over time"
    zh: "解释规划理论的演变"
    zh-TW: "解釋規劃理論的演變"
    ja: "計画理論の変遷を説明する"
    ko: "계획 이론의 변천 설명하기"
    vi: "Giải thích sự phát triển lý thuyết quy hoạch"
    ms: "Menerangkan perkembangan teori perancangan"
    id: "Menjelaskan perkembangan teori perencanaan"
    hi: "नियोजन सिद्धांतों के विकास को समझाना"
  - en: "Relate today's planning debates to history"
    zh: "把当今规划争论与历史联系起来"
    zh-TW: "把當今規劃爭論與歷史連結"
    ja: "現代の計画論争を歴史と結びつける"
    ko: "오늘의 계획 논쟁을 역사와 연결하기"
    vi: "Liên hệ tranh luận quy hoạch hiện nay với lịch sử"
    ms: "Mengaitkan perdebatan perancangan kini dengan sejarah"
    id: "Mengaitkan perdebatan perencanaan kini dengan sejarah"
    hi: "आज की बहसों को इतिहास से जोड़ना"
