code: BIOM30002
year: 2026
learn:
  en: "Six diseases studied end to end, from normal body function and causes to diagnosis, treatment and public health."
  zh: "完整研究六种疾病：从正常身体功能、病因，到诊断、治疗和公共卫生。"
  zh-TW: "完整研究六種疾病：從正常身體功能、病因，到診斷、治療和公共衛生。"
  ja: "6つの病気を、正常な体の働きや原因から診断・治療・公衆衛生まで通して学ぶ。"
  ko: "여섯 가지 질병을 정상 신체 기능과 원인부터 진단, 치료, 공중보건까지 처음부터 끝까지 다룬다."
  vi: "Tìm hiểu trọn vẹn sáu bệnh, từ chức năng cơ thể bình thường và nguyên nhân đến chẩn đoán, điều trị và y tế công cộng."
  ms: "Enam penyakit dikaji sepenuhnya, dari fungsi badan normal dan punca hingga diagnosis, rawatan dan kesihatan awam."
  id: "Enam penyakit dipelajari utuh, dari fungsi tubuh normal dan penyebab hingga diagnosis, pengobatan, dan kesehatan masyarakat."
  hi: "छह बीमारियों का पूरा अध्ययन: सामान्य शरीर क्रिया और कारण से लेकर निदान, इलाज और पब्लिक हेल्थ तक।"
outcomes:
  - en: "Describe the molecular and cell-level causes of diseases"
    zh: "描述疾病在分子和细胞层面的成因"
    zh-TW: "描述疾病在分子和細胞層面的成因"
    ja: "病気の分子・細胞レベルの原因を説明する"
    ko: "질병의 분자·세포 수준 원인 설명하기"
    vi: "Mô tả nguyên nhân bệnh ở mức phân tử và tế bào"
    ms: "Huraikan punca penyakit pada tahap molekul dan sel"
    id: "Menjelaskan penyebab penyakit di tingkat molekul dan sel"
    hi: "बीमारियों के अणु और कोशिका-स्तर के कारण बताना"
  - en: "Link how a disease works to how it is diagnosed and treated"
    zh: "把疾病机制和诊断、治疗联系起来"
    zh-TW: "把疾病機制和診斷、治療連結起來"
    ja: "病気の仕組みを診断や治療と結びつける"
    ko: "질병 기전을 진단과 치료로 연결하기"
    vi: "Liên hệ cơ chế bệnh với cách chẩn đoán và điều trị"
    ms: "Kaitkan cara penyakit berlaku dengan diagnosis dan rawatan"
    id: "Menghubungkan mekanisme penyakit dengan diagnosis dan pengobatan"
    hi: "बीमारी के काम करने के तरीके को निदान और इलाज से जोड़ना"
  - en: "Explain why complex diseases need a team of specialties"
    zh: "解释为什么复杂疾病需要多学科合作"
    zh-TW: "解釋為什麼複雜疾病需要多學科合作"
    ja: "複雑な病気に多分野の連携が必要な理由を説明する"
    ko: "복잡한 질병에 여러 분야의 협력이 필요한 이유 설명하기"
    vi: "Giải thích vì sao bệnh phức tạp cần nhiều chuyên ngành"
    ms: "Terangkan mengapa penyakit kompleks perlukan pelbagai bidang"
    id: "Menjelaskan mengapa penyakit kompleks butuh banyak bidang"
    hi: "समझाना कि जटिल बीमारियों के लिए कई विशेषज्ञताएँ क्यों चाहिए"
