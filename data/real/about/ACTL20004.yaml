code: ACTL20004
year: 2026
learn:
  en: "Stochastic interest rates, time series, ruin theory, claim run-off triangles and simulation for actuaries."
  zh: "精算用的随机利率、时间序列、破产理论、赔款进展三角和模拟。"
  zh-TW: "精算用的隨機利率、時間序列、破產理論、賠款進展三角和模擬。"
  ja: "確率的金利、時系列、破産理論、支払備金の三角表、シミュレーション。"
  ko: "확률적 금리, 시계열, 파산 이론, 지급준비금 삼각표, 시뮬레이션."
  vi: "Lãi suất ngẫu nhiên, chuỗi thời gian, lý thuyết phá sản, tam giác bồi thường và mô phỏng."
  ms: "Kadar faedah stokastik, siri masa, teori kemusnahan, segi tiga tuntutan dan simulasi."
  id: "Suku bunga stokastik, deret waktu, teori kebangkrutan, segitiga klaim, dan simulasi."
  hi: "स्टोकेस्टिक ब्याज दरें, टाइम सीरीज़, रुइन थ्योरी, क्लेम ट्रायंगल और सिमुलेशन।"
outcomes:
  - en: "Use simple random models for investment returns"
    zh: "用简单随机模型分析投资回报"
    zh-TW: "用簡單隨機模型分析投資報酬"
    ja: "投資収益を簡単な確率モデルで扱う"
    ko: "간단한 확률 모형으로 투자 수익 분석하기"
    vi: "Dùng mô hình ngẫu nhiên đơn giản cho lợi suất đầu tư"
    ms: "Guna model rawak mudah untuk pulangan pelaburan"
    id: "Memakai model acak sederhana untuk imbal hasil investasi"
    hi: "निवेश रिटर्न के लिए सरल रैंडम मॉडल लागू करना"
  - en: "Project claims from a run-off triangle"
    zh: "用进展三角预测最终赔款"
    zh-TW: "用進展三角預測最終賠款"
    ja: "三角表から最終的な支払額を予測する"
    ko: "지급 삼각표로 최종 청구액 예측하기"
    vi: "Dự báo bồi thường từ tam giác phát triển"
    ms: "Unjur tuntutan daripada segi tiga tuntutan"
    id: "Memproyeksikan klaim dari segitiga run-off"
    hi: "रन-ऑफ़ ट्रायंगल से दावों का अनुमान लगाना"
  - en: "Build financial models in a spreadsheet"
    zh: "用电子表格建立金融模型"
    zh-TW: "用試算表建立金融模型"
    ja: "表計算ソフトで金融モデルを作る"
    ko: "스프레드시트로 금융 모형 만들기"
    vi: "Xây dựng mô hình tài chính trên bảng tính"
    ms: "Bina model kewangan dalam hamparan"
    id: "Membuat model keuangan di spreadsheet"
    hi: "स्प्रेडशीट में वित्तीय मॉडल बनाना"
