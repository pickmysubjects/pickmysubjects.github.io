code: CEDB30004
year: 2026
learn:
  en: "Stem cells in development, disease and regenerative medicine, plus the ethics of new stem cell therapies."
  zh: "干细胞在发育、疾病和再生医学中的作用，以及新疗法的伦理问题。"
  zh-TW: "幹細胞在發育、疾病與再生醫學中的角色，以及新療法的倫理問題。"
  ja: "発生・病気・再生医療における幹細胞と、新しい幹細胞治療の倫理。"
  ko: "발생·질병·재생의학에서의 줄기세포와 새로운 줄기세포 치료의 윤리."
  vi: "Tế bào gốc trong phát triển, bệnh tật, y học tái tạo, và vấn đề đạo đức của liệu pháp mới."
  ms: "Sel stem dalam perkembangan, penyakit dan perubatan regeneratif, serta etika terapi sel stem baharu."
  id: "Sel punca dalam perkembangan, penyakit, dan kedokteran regeneratif, serta etika terapi sel punca baru."
  hi: "विकास, बीमारी और रीजनरेटिव मेडिसिन में स्टेम सेल, और नई स्टेम सेल थेरेपी की नैतिकता।"
outcomes:
  - en: "Describe key stem cell research methods"
    zh: "描述干细胞研究的主要方法"
    zh-TW: "描述幹細胞研究的主要方法"
    ja: "幹細胞研究の主な手法を説明する"
    ko: "줄기세포 연구의 주요 방법 설명하기"
    vi: "Mô tả phương pháp chính trong nghiên cứu tế bào gốc"
    ms: "Menghuraikan kaedah utama kajian sel stem"
    id: "Menjelaskan metode utama riset sel punca"
    hi: "स्टेम सेल शोध की मुख्य विधियाँ बताना"
  - en: "Discuss ethical debates on stem cell use"
    zh: "讨论干细胞应用的伦理争议"
    zh-TW: "討論幹細胞應用的倫理爭議"
    ja: "幹細胞利用の倫理的論点を議論する"
    ko: "줄기세포 활용의 윤리 논쟁 토론하기"
    vi: "Thảo luận tranh cãi đạo đức về tế bào gốc"
    ms: "Membincangkan isu etika penggunaan sel stem"
    id: "Membahas perdebatan etika penggunaan sel punca"
    hi: "स्टेम सेल उपयोग की नैतिक बहसों पर चर्चा करना"
  - en: "Weigh the limits of stem cell advances"
    zh: "评估干细胞研究进展的局限"
    zh-TW: "評估幹細胞研究進展的侷限"
    ja: "幹細胞研究の限界を評価する"
    ko: "줄기세포 연구 성과의 한계 평가하기"
    vi: "Đánh giá giới hạn của tiến bộ tế bào gốc"
    ms: "Menilai had kemajuan sel stem"
    id: "Menilai keterbatasan kemajuan sel punca"
    hi: "स्टेम सेल प्रगति की सीमाएँ आँकना"
