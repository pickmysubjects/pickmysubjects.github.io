code: MKTG90009
year: 2027
learn:
  en: "Mostly advertising, plus online ads, PR and promotions: how persuasion works, choosing strategy and setting budgets."
  zh: "以广告为主，兼及网络广告、公关和促销：说服如何起作用、如何选择策略和制定预算。"
  zh-TW: "以廣告為主，兼及網路廣告、公關與促銷：說服如何運作、如何選擇策略與編列預算。"
  ja: "広告が中心で、ネット広告・PR・販促も扱う：説得の仕組み、戦略の選び方、予算づくり。"
  ko: "광고 중심에 온라인 광고, PR, 판촉까지: 설득의 원리, 전략 선택, 예산 수립."
  vi: "Chủ yếu là quảng cáo, thêm quảng cáo online, PR, khuyến mãi: cách thuyết phục, chọn chiến lược, lập ngân sách."
  ms: "Kebanyakan pengiklanan, serta iklan dalam talian, PR dan promosi: cara pujukan berfungsi, strategi dan bajet."
  id: "Terutama periklanan, plus iklan daring, PR dan promosi: cara persuasi bekerja, memilih strategi dan anggaran."
  hi: "मुख्य रूप से विज्ञापन, साथ में ऑनलाइन विज्ञापन, PR और प्रमोशन: मनाने का तरीका, रणनीति चुनना और बजट बनाना।"
outcomes:
  - en: "Judge why some ad campaigns work better"
    zh: "评判为何有些广告活动更有效"
    zh-TW: "評判為何有些廣告活動更有效"
    ja: "効果的な広告キャンペーンの理由を見極める"
    ko: "어떤 광고 캠페인이 더 효과적인지 판단하기"
    vi: "Đánh giá vì sao chiến dịch quảng cáo hiệu quả hơn"
    ms: "Menilai mengapa kempen iklan tertentu lebih berkesan"
    id: "Menilai mengapa kampanye iklan tertentu lebih efektif"
    hi: "कुछ विज्ञापन अभियान बेहतर क्यों चलते हैं, परखना"
  - en: "Apply ad theory to real problems"
    zh: "将广告理论用于实际问题"
    zh-TW: "將廣告理論應用於實際問題"
    ja: "広告理論を実際の課題に使う"
    ko: "광고 이론을 실제 문제에 적용하기"
    vi: "Áp dụng lý thuyết quảng cáo vào vấn đề thực"
    ms: "Menggunakan teori iklan pada masalah sebenar"
    id: "Menerapkan teori iklan pada masalah nyata"
    hi: "विज्ञापन सिद्धांत असली समस्याओं पर लगाना"
