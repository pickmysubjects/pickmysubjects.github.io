code: PPMN90058
year: 2027
learn:
  en: "Research for policy: research design, methods, ethics, and getting findings to policymakers."
  zh: "面向政策的研究：研究设计、研究方法、伦理，以及把成果传达给决策者。"
  zh-TW: "面向政策的研究：研究設計、研究方法、倫理，以及把成果傳達給決策者。"
  ja: "政策のための研究：研究設計、手法、倫理、政策担当者への成果の伝え方。"
  ko: "정책을 위한 연구: 연구 설계, 방법, 윤리, 정책 결정자에게 결과 전달하기."
  vi: "Nghiên cứu cho chính sách: thiết kế nghiên cứu, phương pháp, đạo đức, truyền đạt kết quả cho nhà hoạch định."
  ms: "Penyelidikan untuk dasar: reka bentuk kajian, kaedah, etika dan menyampaikan dapatan kepada pembuat dasar."
  id: "Riset untuk kebijakan: desain riset, metode, etika, dan menyampaikan temuan ke pembuat kebijakan."
  hi: "नीति के लिए शोध: शोध डिज़ाइन, विधियाँ, नैतिकता, और नतीजे नीति-निर्माताओं तक पहुँचाना।"
outcomes:
  - en: "Frame an original research question about a policy problem"
    zh: "针对政策问题提出原创研究问题"
    zh-TW: "針對政策問題提出原創研究問題"
    ja: "政策課題について独自の研究課題を立てる"
    ko: "정책 문제에 대한 독창적인 연구 질문 세우기"
    vi: "Đặt câu hỏi nghiên cứu mới về một vấn đề chính sách"
    ms: "Merangka soalan kajian asli tentang isu dasar"
    id: "Merumuskan pertanyaan riset orisinal tentang masalah kebijakan"
    hi: "किसी नीतिगत समस्या पर मौलिक शोध प्रश्न बनाना"
  - en: "Design and carry out a small policy research project"
    zh: "设计并完成一个小型政策研究项目"
    zh-TW: "設計並完成一個小型政策研究專案"
    ja: "小規模な政策研究を設計し実施する"
    ko: "소규모 정책 연구를 설계하고 수행하기"
    vi: "Thiết kế và thực hiện một dự án nghiên cứu chính sách nhỏ"
    ms: "Mereka bentuk dan melaksanakan projek kajian dasar kecil"
    id: "Merancang dan menjalankan proyek riset kebijakan kecil"
    hi: "एक छोटा नीति शोध प्रोजेक्ट डिज़ाइन करना और करना"
