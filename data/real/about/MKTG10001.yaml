code: MKTG10001
year: 2026
learn:
  en: "Marketing basics: who buys and why, products, pricing, promotion, sales channels and market research."
  zh: "营销基础：谁买、为什么买，产品、定价、推广、渠道和市场调研。"
  zh-TW: "行銷基礎：誰買、為什麼買，產品、定價、推廣、通路和市場調查。"
  ja: "マーケティングの基礎：誰がなぜ買うか、製品、価格、販促、販売チャネル、市場調査。"
  ko: "마케팅 기초: 누가 왜 사는지, 제품, 가격, 홍보, 판매 채널, 시장 조사."
  vi: "Marketing cơ bản: ai mua và vì sao, sản phẩm, giá, quảng bá, kênh bán hàng và nghiên cứu thị trường."
  ms: "Asas pemasaran: siapa membeli dan mengapa, produk, harga, promosi, saluran jualan dan kajian pasaran."
  id: "Dasar pemasaran: siapa yang membeli dan kenapa, produk, harga, promosi, saluran penjualan, riset pasar."
  hi: "मार्केटिंग की बुनियादी बातें: कौन और क्यों खरीदता है, प्रोडक्ट, कीमत, प्रमोशन, सेल्स चैनल और मार्केट रिसर्च।"
outcomes:
  - en: "Explain why some marketing works better than others"
    zh: "解释为什么有的营销更有效"
    zh-TW: "解釋為什麼有的行銷比較有效"
    ja: "なぜ効果的なマーケティングとそうでないものがあるか説明する"
    ko: "어떤 마케팅이 더 효과적인 이유 설명하기"
    vi: "Giải thích vì sao có cách marketing hiệu quả hơn"
    ms: "Menerangkan mengapa sesetengah pemasaran lebih berkesan"
    id: "Menjelaskan kenapa sebagian pemasaran lebih berhasil"
    hi: "कुछ मार्केटिंग दूसरों से बेहतर क्यों चलती है, समझाना"
  - en: "Apply marketing models to case studies"
    zh: "把营销模型用在案例上"
    zh-TW: "把行銷模型用在案例上"
    ja: "マーケティングモデルを事例に当てはめる"
    ko: "마케팅 모델을 사례에 적용하기"
    vi: "Áp dụng mô hình marketing vào tình huống"
    ms: "Menggunakan model pemasaran pada kajian kes"
    id: "Menerapkan model pemasaran pada studi kasus"
    hi: "केस स्टडी पर मार्केटिंग मॉडल लागू करना"
