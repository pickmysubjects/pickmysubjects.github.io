code: GEOL30004
year: 2026
learn:
  en: "How elements and isotopes reveal Earth processes, from dating rocks to tracing material between reservoirs."
  zh: "元素和同位素如何揭示地球过程，从岩石定年到追踪物质迁移。"
  zh-TW: "元素與同位素如何揭示地球過程，從岩石定年到追蹤物質遷移。"
  ja: "元素と同位体で地球の過程を読み解く。岩石の年代測定から物質移動の追跡まで。"
  ko: "원소와 동위원소로 지구 과정을 밝히기, 암석 연대측정부터 물질 이동 추적까지."
  vi: "Nguyên tố và đồng vị cho thấy quá trình Trái Đất ra sao, từ định tuổi đá đến truy vết vật chất."
  ms: "Cara unsur dan isotop mendedahkan proses Bumi, dari pentarikhan batuan hingga jejak bahan."
  id: "Cara unsur dan isotop mengungkap proses Bumi, dari penentuan umur batuan hingga melacak materi."
  hi: "तत्व और समस्थानिक पृथ्वी की प्रक्रियाएँ कैसे दिखाते हैं, चट्टानों की आयु से पदार्थ की आवाजाही तक।"
outcomes:
  - en: "Use isotopes to estimate ages of Earth processes"
    zh: "用同位素估算地质过程年龄"
    zh-TW: "用同位素估算地質過程年代"
    ja: "同位体で地球の過程の年代を推定する"
    ko: "동위원소로 지구 과정 연대 추정하기"
    vi: "Dùng đồng vị ước tính tuổi quá trình địa chất"
    ms: "Guna isotop untuk anggar usia proses Bumi"
    id: "Memakai isotop untuk menaksir umur proses Bumi"
    hi: "समस्थानिकों से पृथ्वी प्रक्रियाओं की आयु आंकना"
  - en: "Draw conclusions from geochemical datasets"
    zh: "从地球化学数据得出结论"
    zh-TW: "從地球化學資料得出結論"
    ja: "地球化学データから結論を導く"
    ko: "지구화학 데이터로 결론 내리기"
    vi: "Rút kết luận từ dữ liệu địa hóa"
    ms: "Buat kesimpulan dari data geokimia"
    id: "Menarik kesimpulan dari data geokimia"
    hi: "भू-रासायनिक डेटा से निष्कर्ष निकालना"
