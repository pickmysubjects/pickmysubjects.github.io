code: ABPL90314
year: 2027
learn:
  en: "How property is sold and leased through real estate agencies in Victoria: law, licensing, ethics, trust accounts and marketing."
  zh: "维州房地产中介如何买卖和租赁物业：法规、执照、职业道德、信托账户和营销。"
  zh-TW: "維州房地產仲介如何買賣和租賃物業：法規、執照、職業道德、信託帳戶和行銷。"
  ja: "ビクトリア州の不動産仲介による売買・賃貸：法律、免許、倫理、信託口座、マーケティング。"
  ko: "빅토리아주 부동산 중개를 통한 매매·임대: 법, 면허, 윤리, 신탁 계좌, 마케팅."
  vi: "Cách bất động sản được mua bán, cho thuê qua môi giới ở Victoria: luật, giấy phép, đạo đức, tài khoản ủy thác, tiếp thị."
  ms: "Cara hartanah dijual dan disewa melalui ejen di Victoria: undang-undang, lesen, etika, akaun amanah dan pemasaran."
  id: "Cara properti dijual dan disewakan lewat agen di Victoria: hukum, lisensi, etika, rekening trust, dan pemasaran."
  hi: "विक्टोरिया में एजेंसी के ज़रिये संपत्ति बिक्री व किराया: क़ानून, लाइसेंस, नैतिकता, ट्रस्ट अकाउंट और मार्केटिंग।"
outcomes:
  - en: "Explain sale by private treaty and by auction"
    zh: "说明私下协议和拍卖两种出售流程"
    zh-TW: "說明私下協議和拍賣兩種出售流程"
    ja: "任意売却と競売の手順を説明する"
    ko: "사적 계약 매매와 경매 절차 설명하기"
    vi: "Giải thích bán theo thỏa thuận riêng và đấu giá"
    ms: "Menerangkan jualan perjanjian persendirian dan lelongan"
    id: "Menjelaskan penjualan perjanjian pribadi dan lelang"
    hi: "निजी सौदे और नीलामी से बिक्री समझाना"
  - en: "Read and explain property sales data"
    zh: "解读并传达房产交易数据"
    zh-TW: "解讀並傳達房產交易數據"
    ja: "不動産取引データを読み解き伝える"
    ko: "부동산 거래 데이터 해석하고 전달하기"
    vi: "Đọc và trình bày dữ liệu giao dịch bất động sản"
    ms: "Mentafsir dan menyampaikan data transaksi hartanah"
    id: "Membaca dan menyampaikan data transaksi properti"
    hi: "संपत्ति लेन-देन डेटा पढ़ना और बताना"
