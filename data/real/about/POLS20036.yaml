code: POLS20036
year: 2027
learn:
  en: "The politics of international migration: why people move, how states respond, and why it causes political conflict."
  zh: "国际移民的政治：人为何迁移、国家如何应对、为何引发政治冲突。"
  zh-TW: "國際移民的政治：人為何遷移、國家如何因應、為何引發政治衝突。"
  ja: "国際移民の政治：人はなぜ移動し、国家はどう対応し、なぜ政治対立を生むのか。"
  ko: "국제 이주의 정치: 사람들이 왜 이동하고, 국가는 어떻게 대응하며, 왜 정치적 갈등이 되는지."
  vi: "Chính trị của di cư quốc tế: vì sao con người di chuyển, các nhà nước phản ứng ra sao và vì sao nó gây xung đột chính trị."
  ms: "Politik migrasi antarabangsa: mengapa orang berpindah, bagaimana negara bertindak balas dan mengapa ia mencetuskan konflik politik."
  id: "Politik migrasi internasional: mengapa orang berpindah, bagaimana negara merespons, dan mengapa memicu konflik politik."
  hi: "अंतरराष्ट्रीय प्रवास की राजनीति: लोग क्यों जाते हैं, देश कैसे जवाब देते हैं, और यह राजनीतिक टकराव क्यों बनता है।"
outcomes:
  - en: "Explain the causes of migration politics and conflicts"
    zh: "解释移民政治与冲突的成因"
    zh-TW: "解釋移民政治與衝突的成因"
    ja: "移民をめぐる政治と対立の原因を説明する"
    ko: "이주 정치와 갈등의 원인 설명하기"
    vi: "Giải thích nguyên nhân của chính trị và xung đột về di cư"
    ms: "Terangkan punca politik dan konflik migrasi"
    id: "Menjelaskan penyebab politik dan konflik migrasi"
    hi: "प्रवास की राजनीति और टकराव के कारण समझाना"
  - en: "Use migration data to weigh evidence and argue a case"
    zh: "用移民数据评估证据并论证观点"
    zh-TW: "用移民資料評估證據並論證觀點"
    ja: "移民データで根拠を評価し主張を組み立てる"
    ko: "이주 데이터로 근거를 평가하고 주장 펼치기"
    vi: "Dùng dữ liệu di cư để đánh giá bằng chứng và lập luận"
    ms: "Guna data migrasi untuk menilai bukti dan berhujah"
    id: "Memakai data migrasi untuk menilai bukti dan berargumen"
    hi: "प्रवास के डेटा से सबूत परखना और तर्क रखना"
  - en: "Suggest policies that ease migration conflicts"
    zh: "提出缓解移民冲突的政策"
    zh-TW: "提出緩解移民衝突的政策"
    ja: "移民をめぐる対立を和らげる政策を考える"
    ko: "이주 갈등을 줄이는 정책 제안하기"
    vi: "Đề xuất chính sách giảm xung đột về di cư"
    ms: "Cadangkan dasar untuk meredakan konflik migrasi"
    id: "Mengusulkan kebijakan untuk meredakan konflik migrasi"
    hi: "प्रवास से जुड़े टकराव कम करने वाली नीतियाँ सुझाना"
