code: BMEN90032
year: 2027
learn:
  en: "A major research or design project in biomedical engineering, ending with a conference-style talk."
  zh: "完成一个生物医学工程的大型研究或设计项目，最后以会议形式汇报。"
  zh-TW: "完成一個生醫工程的大型研究或設計專案，最後以研討會形式發表。"
  ja: "生体医工学の大きな研究・設計プロジェクトに取り組み、学会形式で発表する。"
  ko: "의공학 대형 연구·설계 프로젝트를 수행하고 학회 형식으로 발표하기."
  vi: "Một dự án nghiên cứu hoặc thiết kế lớn về kỹ thuật y sinh, kết thúc bằng bài trình bày kiểu hội nghị."
  ms: "Projek penyelidikan atau reka bentuk besar dalam kejuruteraan bioperubatan, diakhiri pembentangan gaya persidangan."
  id: "Proyek riset atau desain besar di teknik biomedis, ditutup dengan presentasi gaya konferensi."
  hi: "बायोमेडिकल इंजीनियरिंग की बड़ी रिसर्च या डिज़ाइन परियोजना, अंत में सम्मेलन-शैली प्रस्तुति।"
outcomes:
  - en: "Define a problem from the literature and plan a method"
    zh: "从文献中明确问题并制定方法"
    zh-TW: "從文獻中界定問題並擬定方法"
    ja: "文献から課題を定め、方法を計画する"
    ko: "문헌으로 문제를 정의하고 방법 세우기"
    vi: "Xác định vấn đề từ tài liệu và lập phương pháp"
    ms: "Mentakrifkan masalah daripada literatur dan merancang kaedah"
    id: "Merumuskan masalah dari literatur dan merencanakan metode"
    hi: "साहित्य से समस्या तय करना और तरीका बनाना"
  - en: "Plan and manage a large engineering project"
    zh: "规划并管理一个大型工程项目"
    zh-TW: "規劃並管理大型工程專案"
    ja: "大規模な工学プロジェクトを計画・管理する"
    ko: "대형 공학 프로젝트 계획과 관리하기"
    vi: "Lập kế hoạch và quản lý một dự án kỹ thuật lớn"
    ms: "Merancang dan mengurus projek kejuruteraan besar"
    id: "Merencanakan dan mengelola proyek teknik besar"
    hi: "बड़ी इंजीनियरिंग परियोजना की योजना और प्रबंधन"
  - en: "Present and defend the results in writing and in person"
    zh: "以书面和口头形式展示并答辩成果"
    zh-TW: "以書面與口頭形式呈現並答辯成果"
    ja: "成果を文章と口頭で発表し、説明する"
    ko: "결과를 글과 발표로 제시하고 방어하기"
    vi: "Trình bày và bảo vệ kết quả bằng văn bản và lời nói"
    ms: "Membentang dan mempertahankan hasil secara bertulis dan lisan"
    id: "Menyajikan dan mempertahankan hasil secara tertulis dan lisan"
    hi: "परिणामों को लिखित और मौखिक रूप में प्रस्तुत करना और बचाव करना"
