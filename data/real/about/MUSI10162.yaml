code: MUSI10162
year: 2026
learn:
  en: "Sing in a large auditioned choir, rehearsing Western choral works from the 1600s to today for an end-of-semester concert."
  zh: "参加大型合唱团，排练17世纪至今的西方合唱作品，学期末公开演出。"
  zh-TW: "參加大型合唱團，排練17世紀至今的西方合唱作品，學期末公開演出。"
  ja: "大規模合唱団で17世紀から現代までの西洋合唱曲を練習し、学期末に演奏会。"
  ko: "대규모 합창단에서 17세기부터 현대까지의 서양 합창곡을 연습해 학기말 공연."
  vi: "Hát trong dàn hợp xướng lớn, tập tác phẩm hợp xướng phương Tây từ thế kỷ 17 đến nay và biểu diễn cuối kỳ."
  ms: "Menyanyi dalam koir besar, berlatih karya koral Barat dari abad ke-17 hingga kini untuk konsert akhir semester."
  id: "Bernyanyi dalam paduan suara besar, berlatih karya koral Barat abad ke-17 hingga kini untuk konser akhir semester."
  hi: "बड़े कोयर में 17वीं सदी से आज तक की पश्चिमी कोरल रचनाएँ गाना, सेमेस्टर के अंत में प्रस्तुति।"
outcomes:
  - en: "Improve vocal technique and diction"
    zh: "提高发声技巧和咬字"
    zh-TW: "提升發聲技巧與咬字"
    ja: "発声技術と発音を磨く"
    ko: "발성 기술과 발음 향상하기"
    vi: "Cải thiện kỹ thuật thanh nhạc và phát âm"
    ms: "Tingkatkan teknik vokal dan sebutan"
    id: "Meningkatkan teknik vokal dan dikasi"
    hi: "गायन तकनीक और उच्चारण सुधारना"
  - en: "Prepare your part for group rehearsals"
    zh: "为合排准备好自己的声部"
    zh-TW: "為合排準備好自己的聲部"
    ja: "合同練習に向けて自分のパートを準備する"
    ko: "합주를 위해 자기 파트 준비하기"
    vi: "Chuẩn bị phần của mình cho buổi tập"
    ms: "Sediakan bahagian sendiri untuk latihan"
    id: "Menyiapkan bagian sendiri untuk latihan"
    hi: "समूह रिहर्सल के लिए अपना भाग तैयार करना"
  - en: "Perform repertoire to concert standard"
    zh: "以音乐会水准演出曲目"
    zh-TW: "以音樂會水準演出曲目"
    ja: "演奏会レベルで曲を演奏する"
    ko: "연주회 수준으로 곡 연주하기"
    vi: "Biểu diễn tác phẩm ở chuẩn hòa nhạc"
    ms: "Persembahkan karya pada tahap konsert"
    id: "Membawakan repertoar setara konser"
    hi: "कॉन्सर्ट स्तर पर रचनाएँ प्रस्तुत करना"
