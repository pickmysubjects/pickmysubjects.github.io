code: MUSI20181
year: 2026
learn:
  en: "Workshops on composing for music and sound with other media, ending in a 16-minute portfolio of new work and a talk."
  zh: "通过工作坊创作结合其他媒体的音乐与声音作品，最后交16分钟作品集并做报告。"
  zh-TW: "透過工作坊創作結合其他媒體的音樂與聲音作品，最後交16分鐘作品集並做報告。"
  ja: "他メディアと組み合わせた音楽・音響作品を制作し、16分の作品集と発表。"
  ko: "다른 매체와 결합한 음악·사운드 작품을 만들고 16분 포트폴리오와 발표로 마무리."
  vi: "Sáng tác âm nhạc và âm thanh kết hợp đa phương tiện, nộp tập tác phẩm 16 phút và thuyết trình."
  ms: "Menggubah muzik dan bunyi dengan media lain, diakhiri portfolio 16 minit dan pembentangan."
  id: "Mengarang musik dan suara dengan media lain, diakhiri portofolio 16 menit dan presentasi."
  hi: "अन्य मीडिया के साथ संगीत-ध्वनि रचना, अंत में 16 मिनट का पोर्टफोलियो और प्रस्तुति।"
outcomes:
  - en: "Compose for sound with other media"
    zh: "为结合其他媒体的声音作曲"
    zh-TW: "為結合其他媒體的聲音作曲"
    ja: "他メディアと組む音を作曲する"
    ko: "다른 매체와 결합한 사운드 작곡"
    vi: "Sáng tác âm thanh cùng đa phương tiện"
    ms: "Menggubah bunyi bersama media lain"
    id: "Mengarang suara bersama media lain"
    hi: "अन्य मीडिया के साथ ध्वनि रचना"
  - en: "Build a portfolio of new work"
    zh: "建立新作品集"
    zh-TW: "建立新作品集"
    ja: "新作のポートフォリオを作る"
    ko: "신작 포트폴리오 만들기"
    vi: "Xây dựng tập tác phẩm mới"
    ms: "Bina portfolio karya baharu"
    id: "Membangun portofolio karya baru"
    hi: "नए काम का पोर्टफोलियो बनाना"
  - en: "Present and explain creative choices"
    zh: "展示并解释创作选择"
    zh-TW: "展示並解釋創作選擇"
    ja: "創作上の選択を説明する"
    ko: "창작 선택을 발표·설명하기"
    vi: "Trình bày lựa chọn sáng tạo"
    ms: "Bentang dan terangkan pilihan kreatif"
    id: "Menyajikan dan menjelaskan pilihan kreatif"
    hi: "रचनात्मक निर्णय प्रस्तुत करना"
