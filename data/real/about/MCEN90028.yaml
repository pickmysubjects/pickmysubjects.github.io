code: MCEN90028
year: 2027
learn:
  en: "Kinematics, dynamics, trajectory planning and control of robot arms."
  zh: "机械臂的运动学、动力学、轨迹规划与控制。"
  zh-TW: "機械手臂的運動學、動力學、軌跡規劃與控制。"
  ja: "ロボットアームの運動学・動力学・軌道計画・制御。"
  ko: "로봇 팔의 기구학, 동역학, 궤적 계획과 제어."
  vi: "Động học, động lực học, lập quỹ đạo và điều khiển tay máy."
  ms: "Kinematik, dinamik, perancangan trajektori dan kawalan lengan robot."
  id: "Kinematika, dinamika, perencanaan lintasan, dan kendali lengan robot."
  hi: "रोबोट आर्म की काइनेमैटिक्स, डायनेमिक्स, ट्रैजेक्टरी प्लानिंग और नियंत्रण।"
outcomes:
  - en: "Work out the kinematics and dynamics of a serial manipulator"
    zh: "推导串联机械臂的运动学和动力学"
    zh-TW: "推導串聯機械手臂的運動學與動力學"
    ja: "シリアルマニピュレータの運動学と動力学を求める"
    ko: "직렬 매니퓰레이터의 기구학·동역학 구하기"
    vi: "Tính động học và động lực học tay máy nối tiếp"
    ms: "Menentukan kinematik dan dinamik manipulator bersiri"
    id: "Menghitung kinematika dan dinamika manipulator serial"
    hi: "सीरियल मैनिपुलेटर की काइनेमैटिक्स और डायनेमिक्स निकालना"
  - en: "Check motion planning and control numerically before testing on hardware"
    zh: "在上实机前用数值方法验证运动规划和控制"
    zh-TW: "在上實機前用數值方法驗證運動規劃與控制"
    ja: "実機実験の前に軌道計画と制御を数値で確かめる"
    ko: "실험 전에 운동 계획과 제어를 수치로 검증하기"
    vi: "Kiểm tra số kế hoạch chuyển động và điều khiển trước khi thử thật"
    ms: "Menyemak perancangan gerakan dan kawalan secara berangka sebelum ujian fizikal"
    id: "Memeriksa perencanaan gerak dan kendali secara numerik sebelum uji fisik"
    hi: "भौतिक परीक्षण से पहले गति योजना व नियंत्रण की संख्यात्मक जाँच"
