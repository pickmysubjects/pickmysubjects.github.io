code: PHYS30009
year: 2026
learn:
  en: "A group research project: pick a question, design and run an experiment, and write it up as a journal paper."
  zh: "小组研究：选题、设计并做实验，写成期刊论文格式。"
  zh-TW: "小組研究：選題、設計並做實驗，寫成期刊論文格式。"
  ja: "グループ研究：問いを決め、実験を設計・実施し、学術論文の形でまとめる。"
  ko: "그룹 연구: 질문을 정하고 실험을 설계·수행해 학술지 논문 형식으로 작성."
  vi: "Dự án nhóm: chọn câu hỏi, thiết kế và làm thí nghiệm, viết thành bài báo khoa học."
  ms: "Projek penyelidikan berkumpulan: pilih soalan, reka dan jalankan eksperimen, tulis sebagai kertas jurnal."
  id: "Proyek riset kelompok: pilih pertanyaan, rancang dan jalankan eksperimen, tulis sebagai artikel jurnal."
  hi: "ग्रुप रिसर्च प्रोजेक्ट: सवाल चुनें, प्रयोग डिज़ाइन करें और चलाएँ, जर्नल पेपर की तरह लिखें।"
outcomes:
  - en: "Design an experiment from a research question"
    zh: "根据研究问题设计实验"
    zh-TW: "根據研究問題設計實驗"
    ja: "研究課題から実験を設計する"
    ko: "연구 질문에서 실험 설계"
    vi: "Thiết kế thí nghiệm từ câu hỏi nghiên cứu"
    ms: "Reka eksperimen daripada soalan kajian"
    id: "Merancang eksperimen dari pertanyaan riset"
    hi: "रिसर्च सवाल से प्रयोग डिज़ाइन करना"
  - en: "Carry out a four-week experiment as a team"
    zh: "和小组完成四周的实验"
    zh-TW: "和小組完成四週的實驗"
    ja: "チームで4週間の実験を行う"
    ko: "팀으로 4주간 실험 수행"
    vi: "Cùng nhóm làm thí nghiệm trong bốn tuần"
    ms: "Jalankan eksperimen empat minggu secara berpasukan"
    id: "Menjalankan eksperimen empat minggu bersama tim"
    hi: "टीम के साथ चार हफ़्ते का प्रयोग करना"
  - en: "Write up results like a journal article"
    zh: "把结果写成期刊论文"
    zh-TW: "把結果寫成期刊論文"
    ja: "結果を学術論文のようにまとめる"
    ko: "결과를 학술지 논문처럼 작성"
    vi: "Viết kết quả như một bài báo khoa học"
    ms: "Tulis hasil seperti artikel jurnal"
    id: "Menulis hasil seperti artikel jurnal"
    hi: "नतीजे जर्नल आर्टिकल की तरह लिखना"
