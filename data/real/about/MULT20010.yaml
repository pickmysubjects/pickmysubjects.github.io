code: MULT20010
year: 2026
learn:
  en: "An 80 to 100 hour work placement you find yourself, used to test your skills at work and plan your career."
  zh: "自己找一份80到100小时的实习，在职场中检验能力并规划职业方向。"
  zh-TW: "自己找一份80到100小時的實習，在職場中檢驗能力並規劃職涯方向。"
  ja: "自分で探した80〜100時間の職場実習で、仕事で力を試しキャリアを考える。"
  ko: "직접 구한 80~100시간 인턴십으로 직장에서 실력을 시험하고 진로를 계획한다."
  vi: "Một kỳ thực tập 80–100 giờ do bạn tự tìm, để thử sức ở nơi làm việc và định hướng nghề nghiệp."
  ms: "Penempatan kerja 80 hingga 100 jam yang anda cari sendiri, untuk menguji kemahiran di tempat kerja dan merancang kerjaya."
  id: "Magang 80 sampai 100 jam yang kamu cari sendiri, untuk menguji kemampuan di tempat kerja dan merencanakan karier."
  hi: "80 से 100 घंटे की इंटर्नशिप जो आप खुद ढूँढते हैं, ताकि काम पर अपने कौशल परखें और करियर की योजना बनाएँ।"
outcomes:
  - en: "Set personal and career goals for your placement"
    zh: "为实习定下个人和职业目标"
    zh-TW: "為實習訂下個人和職涯目標"
    ja: "実習での個人目標とキャリア目標を立てる"
    ko: "인턴십의 개인 목표와 진로 목표 세우기"
    vi: "Đặt mục tiêu cá nhân và nghề nghiệp cho kỳ thực tập"
    ms: "Tetapkan matlamat peribadi dan kerjaya untuk penempatan"
    id: "Menetapkan target pribadi dan karier untuk magang"
    hi: "इंटर्नशिप के लिए निजी और करियर लक्ष्य तय करना"
  - en: "Reflect on what happens day to day at work"
    zh: "反思工作中每天发生的事"
    zh-TW: "反思工作中每天發生的事"
    ja: "職場での日々の出来事を振り返る"
    ko: "직장에서 매일 겪는 일 돌아보기"
    vi: "Suy ngẫm về những việc diễn ra hằng ngày ở nơi làm việc"
    ms: "Renung apa yang berlaku setiap hari di tempat kerja"
    id: "Merefleksikan kejadian sehari-hari di tempat kerja"
    hi: "काम पर रोज़ होने वाली बातों पर सोचना"
  - en: "Put together a portfolio of your skills and achievements"
    zh: "整理一份展示技能和成果的作品集"
    zh-TW: "整理一份展示技能和成果的作品集"
    ja: "スキルと実績をまとめたポートフォリオを作る"
    ko: "역량과 성과를 담은 포트폴리오 만들기"
    vi: "Làm hồ sơ năng lực thể hiện kỹ năng và thành tích"
    ms: "Sediakan portfolio kemahiran dan pencapaian"
    id: "Menyusun portofolio keterampilan dan pencapaian"
    hi: "अपने कौशल और उपलब्धियों का पोर्टफ़ोलियो बनाना"
