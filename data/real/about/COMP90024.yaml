code: COMP90024
year: 2027
learn:
  en: "Using clusters and cloud services for parallel and distributed computing, especially big-data problems."
  zh: "用集群和云服务做并行与分布式计算，侧重大数据问题。"
  zh-TW: "用叢集與雲端服務做平行與分散式運算，著重大數據問題。"
  ja: "クラスタとクラウドで並列・分散計算を行い、特にビッグデータを扱う。"
  ko: "클러스터와 클라우드로 병렬·분산 컴퓨팅, 특히 빅데이터 문제."
  vi: "Dùng cluster và đám mây cho tính toán song song, phân tán, nhất là dữ liệu lớn."
  ms: "Guna kluster dan awan untuk pengkomputeran selari dan teragih, terutama data raya."
  id: "Memakai klaster dan cloud untuk komputasi paralel dan terdistribusi, terutama big data."
  hi: "क्लस्टर और क्लाउड से पैरेलल व डिस्ट्रिब्यूटेड कंप्यूटिंग, खासकर बिग डेटा।"
outcomes:
  - en: "Run data-heavy work on clusters and cloud platforms"
    zh: "在集群和云平台上处理大量数据"
    zh-TW: "在叢集與雲端平台處理大量資料"
    ja: "クラスタやクラウドで大規模データ処理を行う"
    ko: "클러스터·클라우드에서 대용량 데이터 처리하기"
    vi: "Chạy xử lý dữ liệu lớn trên cluster và đám mây"
    ms: "Jalankan kerja data besar di kluster dan awan"
    id: "Menjalankan pengolahan data besar di klaster dan cloud"
    hi: "क्लस्टर और क्लाउड पर बड़े डेटा का काम चलाना"
  - en: "Compare cluster and cloud approaches"
    zh: "比较集群与云计算方案"
    zh-TW: "比較叢集與雲端方案"
    ja: "クラスタとクラウドの方式を比べる"
    ko: "클러스터와 클라우드 방식 비교하기"
    vi: "So sánh cách tiếp cận cluster và đám mây"
    ms: "Bandingkan pendekatan kluster dan awan"
    id: "Membandingkan pendekatan klaster dan cloud"
    hi: "क्लस्टर और क्लाउड तरीकों की तुलना करना"
