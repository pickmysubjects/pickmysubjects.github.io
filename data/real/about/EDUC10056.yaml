code: EDUC10056
year: 2026
learn:
  en: "How young people learn, create and connect through digital media, in school and out, with local and global examples."
  zh: "年轻人如何借助数字媒体在校内外学习、创作和交流。"
  zh-TW: "年輕人如何藉由數位媒體在校內外學習、創作與交流。"
  ja: "若者がデジタルメディアで学校内外にどう学び、創り、つながるか。"
  ko: "젊은 세대가 디지털 매체로 학교 안팎에서 배우고 만들고 소통하는 방식."
  vi: "Giới trẻ học, sáng tạo và kết nối qua truyền thông số trong và ngoài trường, với ví dụ trong nước và quốc tế."
  ms: "Cara golongan muda belajar, mencipta dan berhubung melalui media digital, di dalam dan luar sekolah."
  id: "Cara anak muda belajar, berkarya, dan terhubung lewat media digital, di dalam dan luar sekolah."
  hi: "युवा डिजिटल माध्यमों से स्कूल के अंदर-बाहर कैसे सीखते, रचते और जुड़ते हैं।"
outcomes:
  - en: "Explain how digital communication shapes learning"
    zh: "解释数字传播如何影响学习"
    zh-TW: "解釋數位傳播如何影響學習"
    ja: "デジタル通信が学びに与える影響を説明する"
    ko: "디지털 소통이 학습에 미치는 영향 설명하기"
    vi: "Giải thích truyền thông số ảnh hưởng việc học ra sao"
    ms: "Terangkan cara komunikasi digital membentuk pembelajaran"
    id: "Menjelaskan pengaruh komunikasi digital pada belajar"
    hi: "समझाना कि डिजिटल संचार सीखने को कैसे आकार देता है"
  - en: "Discuss how digital literacies can help disadvantaged youth"
    zh: "讨论数字素养如何帮助弱势青年"
    zh-TW: "討論數位素養如何幫助弱勢青年"
    ja: "デジタル・リテラシーが不利な若者をどう助けるか論じる"
    ko: "디지털 리터러시가 취약 청소년을 돕는 방식 논의하기"
    vi: "Thảo luận kỹ năng số giúp thanh niên thiệt thòi thế nào"
    ms: "Bincang cara literasi digital membantu belia kurang bernasib baik"
    id: "Membahas cara literasi digital membantu pemuda kurang beruntung"
    hi: "चर्चा करना कि डिजिटल साक्षरता वंचित युवाओं की कैसे मदद करती है"
  - en: "Weigh the challenges and chances digital media bring to education"
    zh: "权衡数字媒体给教育带来的挑战与机会"
    zh-TW: "權衡數位媒體為教育帶來的挑戰與機會"
    ja: "デジタルメディアが教育にもたらす課題と機会を考える"
    ko: "디지털 매체가 교육에 주는 도전과 기회 따져 보기"
    vi: "Cân nhắc thách thức và cơ hội truyền thông số mang lại cho giáo dục"
    ms: "Timbang cabaran dan peluang media digital dalam pendidikan"
    id: "Menimbang tantangan dan peluang media digital bagi pendidikan"
    hi: "शिक्षा में डिजिटल माध्यमों की चुनौतियाँ और अवसर परखना"
