code: FREN30024
year: 2026
learn:
  en: "The French major capstone for students who did French 7: research on current topics, led by staff research."
  zh: "法语专业毕业课（已修法语 7）：结合教师研究探讨当下话题。"
  zh-TW: "法語主修畢業課（已修法語 7）：結合教師研究探討當下話題。"
  ja: "フランス語7を修了した専攻生向けの総仕上げ科目。教員の研究をもとに現代的な話題を研究する。"
  ko: "프랑스어 7을 마친 전공생의 마무리 과목. 교수진 연구를 바탕으로 현재의 주제를 연구한다."
  vi: "Môn tổng kết chuyên ngành Pháp cho ai đã học French 7: nghiên cứu chủ đề thời sự theo hướng của giảng viên."
  ms: "Subjek penutup major Perancis bagi yang sudah ambil French 7: kajian topik semasa berpandukan penyelidikan staf."
  id: "Mata kuliah penutup jurusan Prancis bagi yang sudah ambil French 7: riset topik terkini berbasis riset dosen."
  hi: "फ़्रेंच 7 कर चुके फ़्रेंच मेजर छात्रों का समापन विषय: स्टाफ़ के शोध पर आधारित समकालीन विषयों पर शोध।"
outcomes:
  - en: "Apply your research skills to current topics in French"
    zh: "用法语研究当下的话题"
    zh-TW: "用法語研究當下的話題"
    ja: "現在の話題をフランス語で調べ分析する"
    ko: "현재의 주제를 프랑스어로 연구하기"
    vi: "Nghiên cứu các chủ đề thời sự bằng tiếng Pháp"
    ms: "Kaji topik semasa dalam bahasa Perancis"
    id: "Meneliti topik terkini dalam bahasa Prancis"
    hi: "समकालीन विषयों पर फ़्रेंच में शोध करना"
  - en: "See French in its global, intercultural setting"
    zh: "在全球和跨文化背景中理解法语"
    zh-TW: "在全球和跨文化背景中理解法語"
    ja: "世界的・異文化的な文脈でフランス語を捉える"
    ko: "세계적·다문화적 맥락에서 프랑스어 이해하기"
    vi: "Hiểu tiếng Pháp trong bối cảnh toàn cầu, liên văn hóa"
    ms: "Fahami bahasa Perancis dalam konteks global dan antara budaya"
    id: "Memahami bahasa Prancis dalam konteks global dan antarbudaya"
    hi: "फ़्रेंच को वैश्विक, अंतरसांस्कृतिक संदर्भ में समझना"
  - en: "Work on a research project with classmates in French"
    zh: "和同学用法语合作完成研究项目"
    zh-TW: "和同學用法語合作完成研究專題"
    ja: "仲間とフランス語で研究プロジェクトに取り組む"
    ko: "동료와 프랑스어로 연구 프로젝트 하기"
    vi: "Làm dự án nghiên cứu nhóm bằng tiếng Pháp"
    ms: "Jalankan projek penyelidikan berkumpulan dalam bahasa Perancis"
    id: "Mengerjakan proyek riset kelompok dalam bahasa Prancis"
    hi: "सहपाठियों के साथ फ़्रेंच में शोध परियोजना करना"
