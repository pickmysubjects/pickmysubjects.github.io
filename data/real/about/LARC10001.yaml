code: LARC10001
year: 2026
learn:
  en: "Natural history for designers: Earth history, plants, soils, collections, Indigenous knowledge and oceans."
  zh: "面向设计的自然史：地球历史、植物、土壤、标本收藏、原住民知识与海洋。"
  zh-TW: "面向設計的自然史：地球歷史、植物、土壤、標本收藏、原住民知識與海洋。"
  ja: "デザインのための博物学：地球史、植物、土壌、標本収集、先住民の知、海洋。"
  ko: "디자인을 위한 자연사: 지구 역사, 식물, 토양, 표본 수집, 원주민 지식, 바다."
  vi: "Lịch sử tự nhiên cho thiết kế: lịch sử Trái Đất, thực vật, đất, bộ sưu tập, tri thức bản địa, đại dương."
  ms: "Sejarah alam untuk reka bentuk: sejarah Bumi, tumbuhan, tanah, koleksi, ilmu Orang Asli, lautan."
  id: "Sejarah alam untuk desain: sejarah Bumi, tumbuhan, tanah, koleksi, pengetahuan adat dan lautan."
  hi: "डिज़ाइन के लिए प्राकृतिक इतिहास: पृथ्वी का इतिहास, पौधे, मिट्टी, संग्रह, स्वदेशी ज्ञान और महासागर।"
outcomes:
  - en: "Relate natural history to design today"
    zh: "将自然史与当今设计相联系"
    zh-TW: "將自然史與當今設計相連結"
    ja: "博物学を現代のデザインに結びつける"
    ko: "자연사를 오늘날의 디자인과 연결한다"
    vi: "Liên hệ lịch sử tự nhiên với thiết kế ngày nay"
    ms: "Kaitkan sejarah alam dengan reka bentuk masa kini"
    id: "Menghubungkan sejarah alam dengan desain masa kini"
    hi: "प्राकृतिक इतिहास को आज के डिज़ाइन से जोड़ें"
  - en: "Collect and assess sources and materials"
    zh: "收集并评估资料与材料"
    zh-TW: "蒐集並評估資料與材料"
    ja: "資料や素材を収集し評価する"
    ko: "자료와 재료를 수집하고 평가한다"
    vi: "Thu thập và đánh giá nguồn tư liệu, vật liệu"
    ms: "Kumpul dan nilai sumber serta bahan"
    id: "Mengumpulkan dan menilai sumber dan bahan"
    hi: "स्रोत और सामग्री इकट्ठा करें और परखें"
  - en: "Draw on Indigenous knowledge of landscape"
    zh: "借鉴原住民关于土地景观的知识"
    zh-TW: "借鑑原住民關於土地景觀的知識"
    ja: "先住民の土地に関する知識に学ぶ"
    ko: "원주민의 경관 지식 참고하기"
    vi: "Học hỏi từ tri thức bản địa về cảnh quan"
    ms: "Manfaatkan pengetahuan Orang Asal tentang landskap"
    id: "Menimba pengetahuan Pribumi tentang lanskap"
    hi: "लैंडस्केप के बारे में मूलनिवासी ज्ञान से सीखना"
