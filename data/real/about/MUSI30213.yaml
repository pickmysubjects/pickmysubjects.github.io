code: MUSI30213
year: 2026
learn:
  en: "Grow your composing for ensembles and electronics through listening and score study, ending in a folio and a concert."
  zh: "通过聆听与读谱提升合奏和电子音乐创作，最后交作品集并开音乐会。"
  zh-TW: "透過聆聽與讀譜提升合奏與電子音樂創作，最後交作品集並開音樂會。"
  ja: "聴取と読譜を通じ、アンサンブルと電子音楽の作曲を深め、作品集と演奏会で締めくくる。"
  ko: "감상과 악보 분석으로 앙상블·전자음악 작곡을 키우고 작품집과 연주회로 마무리."
  vi: "Phát triển sáng tác cho hòa tấu và điện tử qua nghe, đọc tổng phổ; kết thúc bằng tập tác phẩm và hòa nhạc."
  ms: "Kembangkan gubahan untuk ensembel dan elektronik, berakhir dengan folio dan konsert."
  id: "Kembangkan komposisi untuk ansambel dan elektronik, diakhiri folio dan konser."
  hi: "सुनने और स्कोर पढ़ने से एन्सेम्बल व इलेक्ट्रॉनिक रचना निखारें; अंत में फ़ोलियो और कॉन्सर्ट।"
outcomes:
  - en: "Compose a folio of scores and recordings"
    zh: "创作乐谱与录音作品集"
    zh-TW: "創作樂譜與錄音作品集"
    ja: "楽譜と録音の作品集を作る"
    ko: "악보·녹음 작품집 만들기"
    vi: "Sáng tác tập bản nhạc và bản thu"
    ms: "Hasilkan folio skor dan rakaman"
    id: "Membuat folio partitur dan rekaman"
    hi: "स्कोर और रिकॉर्डिंग का फ़ोलियो बनाना"
  - en: "Write clear notation for performers"
    zh: "为演奏者写清晰的乐谱"
    zh-TW: "為演奏者寫清晰的樂譜"
    ja: "演奏者向けに明快な記譜をする"
    ko: "연주자를 위한 명확한 기보"
    vi: "Ghi nhạc rõ ràng cho người biểu diễn"
    ms: "Tulis notasi jelas untuk pemain"
    id: "Menulis notasi jelas untuk pemain"
    hi: "कलाकारों के लिए साफ़ नोटेशन लिखना"
  - en: "Present your music in a concert"
    zh: "在音乐会上展示作品"
    zh-TW: "在音樂會上發表作品"
    ja: "演奏会で自作を発表する"
    ko: "연주회에서 작품 발표"
    vi: "Trình diễn tác phẩm trong buổi hòa nhạc"
    ms: "Persembahkan muzik dalam konsert"
    id: "Menampilkan musik dalam konser"
    hi: "कॉन्सर्ट में अपना संगीत प्रस्तुत करना"
