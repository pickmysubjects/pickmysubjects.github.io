code: CRIM20009
year: 2026
learn:
  en: "Why some racial and ethnic groups have far more contact with the justice system, and how well efforts to fix this have worked."
  zh: "为什么某些种族和族裔群体与司法系统的接触多得多，以及改善这一问题的努力效果如何。"
  zh-TW: "為什麼某些種族和族裔群體與司法體系的接觸多得多，以及改善這一問題的努力成效如何。"
  ja: "一部の人種・民族集団が司法と関わる機会がなぜずっと多いのか、そしてそれを改める取り組みがどれほど機能してきたかを学ぶ。"
  ko: "왜 일부 인종·민족 집단이 사법 제도와 훨씬 더 많이 마주치는지, 이를 바로잡으려는 노력이 얼마나 효과가 있었는지 배운다."
  vi: "Vì sao một số nhóm chủng tộc, sắc tộc tiếp xúc với hệ thống tư pháp nhiều hơn hẳn, và các nỗ lực khắc phục hiệu quả đến đâu."
  ms: "Kenapa sesetengah kumpulan kaum dan etnik jauh lebih kerap berdepan sistem keadilan, dan sejauh mana usaha memperbaikinya berkesan."
  id: "Kenapa sebagian kelompok ras dan etnis jauh lebih sering berurusan dengan sistem peradilan, dan seberapa berhasil upaya memperbaikinya."
  hi: "कुछ नस्लीय और जातीय समूहों का न्याय व्यवस्था से सामना कहीं ज़्यादा क्यों होता है, और इसे सुधारने की कोशिशें कितनी कारगर रहीं।"
outcomes:
  - en: "Explain why some groups are over-represented in justice"
    zh: "解释某些群体为何在司法系统中比例过高"
    zh-TW: "解釋某些群體為何在司法體系中比例過高"
    ja: "一部の集団が司法で過剰に代表される理由を説明する"
    ko: "일부 집단이 사법 제도에서 과대 대표되는 이유 설명하기"
    vi: "Giải thích vì sao một số nhóm bị đại diện quá mức trong tư pháp"
    ms: "Terangkan kenapa sesetengah kumpulan terlebih wakil dalam sistem keadilan"
    id: "Menjelaskan kenapa sebagian kelompok terlalu banyak di sistem peradilan"
    hi: "समझाना कि कुछ समूह न्याय व्यवस्था में ज़रूरत से ज़्यादा क्यों दिखते हैं"
  - en: "Apply criminology theories to issues of race"
    zh: "把犯罪学理论用于种族问题"
    zh-TW: "把犯罪學理論用於種族問題"
    ja: "犯罪学の理論を人種の問題に当てはめる"
    ko: "범죄학 이론을 인종 문제에 적용하기"
    vi: "Áp dụng lý thuyết tội phạm học vào vấn đề chủng tộc"
    ms: "Guna teori kriminologi pada isu kaum"
    id: "Menerapkan teori kriminologi pada isu ras"
    hi: "नस्ल से जुड़े मुद्दों पर क्रिमिनोलॉजी के सिद्धांत लागू करना"
  - en: "Assess efforts like Indigenous courts"
    zh: "评估原住民法庭等改进措施"
    zh-TW: "評估原住民法庭等改進措施"
    ja: "先住民裁判所などの取り組みを評価する"
    ko: "원주민 법원 같은 노력 평가하기"
    vi: "Đánh giá các nỗ lực như tòa án dành cho người bản địa"
    ms: "Nilai usaha seperti mahkamah Orang Asli"
    id: "Menilai upaya seperti pengadilan khusus Pribumi"
    hi: "आदिवासी अदालतों जैसी कोशिशों का आकलन करना"
