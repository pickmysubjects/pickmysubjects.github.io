code: AHIS30027
year: 2027
learn:
  en: "Contemporary art studied on location in Indonesia: its history, museums, galleries, biennales, curating and cultural context."
  zh: "在印度尼西亚实地学习当代艺术：艺术史、博物馆、画廊、双年展、策展和文化背景。"
  zh-TW: "在印尼實地學習當代藝術：藝術史、博物館、藝廊、雙年展、策展和文化脈絡。"
  ja: "インドネシアで現地学習する現代美術：歴史、美術館、ギャラリー、ビエンナーレ、キュレーション、文化的背景。"
  ko: "인도네시아 현지에서 배우는 현대미술: 역사, 미술관, 갤러리, 비엔날레, 큐레이션, 문화적 맥락."
  vi: "Học nghệ thuật đương đại ngay tại Indonesia: lịch sử, bảo tàng, phòng tranh, biennale, giám tuyển và bối cảnh văn hóa."
  ms: "Seni kontemporari dipelajari di lokasi di Indonesia: sejarah, muzium, galeri, biennale, kurasi dan konteks budaya."
  id: "Seni kontemporer dipelajari langsung di Indonesia: sejarah, museum, galeri, bienial, kurasi, dan konteks budaya."
  hi: "इंडोनेशिया में मौके पर समकालीन कला का अध्ययन: इतिहास, संग्रहालय, गैलरी, बिएनाले, क्यूरेशन और सांस्कृतिक संदर्भ।"
outcomes:
  - en: "Explain an art centre's history through close study"
    zh: "通过实地考察解读一个艺术中心的历史"
    zh-TW: "透過實地考察解讀一個藝術中心的歷史"
    ja: "詳しい調査を通じてアートセンターの歴史を説明する"
    ko: "면밀한 조사로 예술 중심지의 역사 설명하기"
    vi: "Giải thích lịch sử một trung tâm nghệ thuật qua nghiên cứu kỹ"
    ms: "Terangkan sejarah pusat seni melalui kajian dekat"
    id: "Menjelaskan sejarah pusat seni lewat kajian mendalam"
    hi: "गहन अध्ययन से किसी कला केंद्र का इतिहास समझाना"
  - en: "Relate art display to curating, policy and tourism"
    zh: "将艺术展示与策展、政策和旅游联系起来"
    zh-TW: "將藝術展示與策展、政策和觀光連結起來"
    ja: "美術の展示をキュレーション・政策・観光と関連づける"
    ko: "미술 전시를 큐레이션·정책·관광과 연결하기"
    vi: "Liên hệ trưng bày nghệ thuật với giám tuyển, chính sách và du lịch"
    ms: "Kaitkan pameran seni dengan kurasi, dasar dan pelancongan"
    id: "Mengaitkan pameran seni dengan kurasi, kebijakan, dan pariwisata"
    hi: "कला प्रदर्शन को क्यूरेशन, नीति और पर्यटन से जोड़ना"
  - en: "Discuss art and censorship, gender and politics"
    zh: "讨论艺术与审查、性别和政治的关系"
    zh-TW: "討論藝術與審查、性別和政治的關係"
    ja: "芸術と検閲、ジェンダー、政治について論じる"
    ko: "예술과 검열, 젠더, 정치에 관해 논의하기"
    vi: "Thảo luận nghệ thuật với kiểm duyệt, giới và chính trị"
    ms: "Bincang seni dan penapisan, gender serta politik"
    id: "Membahas seni dan sensor, gender, serta politik"
    hi: "कला और सेंसरशिप, जेंडर व राजनीति पर चर्चा करना"
