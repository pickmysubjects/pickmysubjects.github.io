code: MIIM30002
year: 2026
learn:
  en: "How the immune system develops and works, and what happens in autoimmunity, allergy and transplants."
  zh: "免疫系统怎么发育和运作，以及自身免疫、过敏和移植中的问题。"
outcomes:
  - en: "Explain how antibodies and immune cells work"
    zh: "解释抗体和免疫细胞的作用"
  - en: "Explain immune responses to infection and disease"
    zh: "解释感染和疾病中的免疫反应"
  - en: "Interpret experimental evidence in immunology"
    zh: "解读免疫学的实验证据"
