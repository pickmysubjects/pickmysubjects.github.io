code: MIIM30002
year: 2026
learn:
  en: "How the immune system develops and works, and what happens in autoimmunity, allergy and transplants."
  zh: "免疫系统怎么发育和运作，以及自身免疫、过敏和移植中的问题。"
  zh-TW: "免疫系統怎麼發育和運作，以及自體免疫、過敏和移植中的問題。"
  ja: "免疫系の発達と働き、そして自己免疫・アレルギー・移植で起こること。"
  ko: "면역계의 발달과 작동, 그리고 자가면역, 알레르기, 이식에서 일어나는 일."
  vi: "Hệ miễn dịch phát triển và hoạt động ra sao, và chuyện gì xảy ra khi tự miễn, dị ứng, cấy ghép."
  ms: "Cara sistem imun berkembang dan berfungsi, serta apa berlaku dalam autoimun, alahan dan pemindahan."
  id: "Cara sistem imun berkembang dan bekerja, serta apa yang terjadi pada autoimun, alergi, dan transplantasi."
  hi: "इम्यून सिस्टम कैसे विकसित होता और काम करता है, और ऑटोइम्यूनिटी, एलर्जी व ट्रांसप्लांट में क्या होता है।"
outcomes:
  - en: "Explain how antibodies and immune cells work"
    zh: "解释抗体和免疫细胞的作用"
    zh-TW: "解釋抗體和免疫細胞的作用"
    ja: "抗体と免疫細胞の働きを説明する"
    ko: "항체와 면역세포의 작용 설명하기"
    vi: "Giải thích kháng thể và tế bào miễn dịch hoạt động ra sao"
    ms: "Menerangkan cara antibodi dan sel imun berfungsi"
    id: "Menjelaskan cara kerja antibodi dan sel imun"
    hi: "एंटीबॉडी और इम्यून कोशिकाएँ कैसे काम करती हैं"
  - en: "Explain immune responses to infection and disease"
    zh: "解释感染和疾病中的免疫反应"
    zh-TW: "解釋感染和疾病中的免疫反應"
    ja: "感染や病気への免疫応答を説明する"
    ko: "감염과 질병에 대한 면역 반응 설명하기"
    vi: "Giải thích phản ứng miễn dịch với nhiễm trùng và bệnh"
    ms: "Menerangkan tindak balas imun terhadap jangkitan dan penyakit"
    id: "Menjelaskan respons imun terhadap infeksi dan penyakit"
    hi: "संक्रमण और बीमारी पर इम्यून प्रतिक्रिया समझाना"
  - en: "Interpret experimental evidence in immunology"
    zh: "解读免疫学的实验证据"
    zh-TW: "解讀免疫學的實驗證據"
    ja: "免疫学の実験結果を解釈する"
    ko: "면역학 실험 근거 해석하기"
    vi: "Diễn giải bằng chứng thực nghiệm trong miễn dịch học"
    ms: "Mentafsir bukti eksperimen dalam imunologi"
    id: "Menafsirkan bukti eksperimen dalam imunologi"
    hi: "इम्यूनोलॉजी के प्रयोगात्मक सबूतों की व्याख्या"
