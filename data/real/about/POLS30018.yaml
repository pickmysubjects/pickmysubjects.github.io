code: POLS30018
year: 2026
learn:
  en: "How the European Union works, the pull between nationalism and integration, key policies like the euro and migration, and its global role."
  zh: "欧盟如何运作，民族主义与一体化之间的拉扯，欧元和移民等关键政策，以及欧盟的全球角色。"
  zh-TW: "歐盟如何運作，民族主義與整合之間的拉扯，歐元和移民等關鍵政策，以及歐盟的全球角色。"
  ja: "EUの仕組み、ナショナリズムと統合のせめぎ合い、ユーロや移民などの主要政策、そして世界での役割を学ぶ。"
  ko: "유럽연합의 작동 방식, 민족주의와 통합의 긴장, 유로와 이민 같은 핵심 정책, 세계에서의 역할을 배운다."
  vi: "Liên minh châu Âu vận hành ra sao, giằng co giữa chủ nghĩa dân tộc và hội nhập, các chính sách chính như đồng euro, di cư và vai trò toàn cầu."
  ms: "Cara Kesatuan Eropah berfungsi, tarikan antara nasionalisme dan integrasi, dasar utama seperti euro dan migrasi, serta peranan globalnya."
  id: "Cara kerja Uni Eropa, tarik-menarik nasionalisme dan integrasi, kebijakan utama seperti euro dan migrasi, serta perannya di dunia."
  hi: "यूरोपीय संघ कैसे चलता है, राष्ट्रवाद और एकीकरण के बीच खिंचाव, यूरो और प्रवास जैसी मुख्य नीतियाँ, और दुनिया में उसकी भूमिका।"
outcomes:
  - en: "Explain how EU institutions make policy"
    zh: "说明欧盟机构如何制定政策"
    zh-TW: "說明歐盟機構如何制定政策"
    ja: "EUの機関がどう政策を決めるか説明する"
    ko: "EU 기관의 정책 결정 방식 설명하기"
    vi: "Giải thích các thể chế EU làm chính sách ra sao"
    ms: "Terangkan cara institusi EU membuat dasar"
    id: "Menjelaskan cara lembaga UE membuat kebijakan"
    hi: "समझाना कि EU की संस्थाएँ नीतियाँ कैसे बनाती हैं"
  - en: "Weigh the costs and benefits of EU membership"
    zh: "权衡加入欧盟的利弊"
    zh-TW: "權衡加入歐盟的利弊"
    ja: "EU加盟の利点と負担を比べる"
    ko: "EU 가입의 득실 따져 보기"
    vi: "Cân nhắc lợi hại của việc là thành viên EU"
    ms: "Timbang untung rugi keahlian EU"
    id: "Menimbang untung rugi keanggotaan UE"
    hi: "EU सदस्यता के फ़ायदे और नुकसान तौलना"
  - en: "Analyse recent crises facing the EU"
    zh: "分析欧盟近年面临的危机"
    zh-TW: "分析歐盟近年面臨的危機"
    ja: "EUが直面した最近の危機を分析する"
    ko: "EU가 최근 겪은 위기 분석하기"
    vi: "Phân tích các cuộc khủng hoảng gần đây của EU"
    ms: "Analisis krisis terkini yang dihadapi EU"
    id: "Menganalisis krisis terbaru yang dihadapi UE"
    hi: "EU के हाल के संकटों का विश्लेषण करना"
