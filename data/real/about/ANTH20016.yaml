code: ANTH20016
year: 2026
learn:
  en: "How social movements respond to crises like debt, climate change and pandemics, read through ethnographies of activism."
  zh: "社会运动如何回应债务、气候变化和疫情等危机，通过社运民族志来解读。"
  zh-TW: "社會運動如何回應債務、氣候變遷和疫情等危機，透過社運民族誌來解讀。"
  ja: "債務危機、気候変動、パンデミックなどに社会運動がどう応えてきたかを、運動のエスノグラフィーから読む。"
  ko: "부채, 기후변화, 팬데믹 같은 위기에 사회운동이 어떻게 대응하는지 활동가 민족지로 살펴본다."
  vi: "Các phong trào xã hội ứng phó khủng hoảng như nợ, biến đổi khí hậu, đại dịch ra sao, qua dân tộc chí về hoạt động."
  ms: "Cara gerakan sosial bertindak balas terhadap krisis seperti hutang, perubahan iklim dan pandemik, melalui etnografi aktivisme."
  id: "Cara gerakan sosial merespons krisis seperti utang, perubahan iklim dan pandemi, dibaca lewat etnografi aktivisme."
  hi: "कर्ज़, जलवायु परिवर्तन और महामारी जैसे संकटों पर सामाजिक आंदोलन कैसे जवाब देते हैं, आंदोलनों की नृवंशविज्ञान के ज़रिए।"
outcomes:
  - en: "Compare how different movements organise"
    zh: "比较不同社会运动的组织方式"
    zh-TW: "比較不同社會運動的組織方式"
    ja: "さまざまな運動の組織のされ方を比べる"
    ko: "여러 운동의 조직 방식 비교하기"
    vi: "So sánh cách các phong trào tự tổ chức"
    ms: "Bandingkan cara gerakan berbeza disusun"
    id: "Membandingkan cara berbagai gerakan berorganisasi"
    hi: "अलग-अलग आंदोलनों के संगठन की तुलना करना"
  - en: "Read ethnographic writing critically"
    zh: "批判性地阅读民族志著作"
    zh-TW: "批判性地閱讀民族誌著作"
    ja: "エスノグラフィーを批判的に読む"
    ko: "민족지 글을 비판적으로 읽기"
    vi: "Đọc phản biện các công trình dân tộc chí"
    ms: "Baca tulisan etnografi secara kritis"
    id: "Membaca tulisan etnografi secara kritis"
    hi: "नृवंशविज्ञान लेखन को आलोचनात्मक ढंग से पढ़ना"
  - en: "Reflect on the role of activist researchers"
    zh: "反思行动派研究者的角色"
    zh-TW: "反思行動派研究者的角色"
    ja: "活動に関わる研究者の役割を考える"
    ko: "활동가 연구자의 역할 성찰하기"
    vi: "Suy ngẫm về vai trò của nhà nghiên cứu hoạt động"
    ms: "Renungkan peranan penyelidik aktivis"
    id: "Merefleksikan peran peneliti aktivis"
    hi: "कार्यकर्ता शोधकर्ताओं की भूमिका पर विचार करना"
