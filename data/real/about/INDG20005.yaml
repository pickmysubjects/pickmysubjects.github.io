code: INDG20005
year: 2026
learn:
  en: "Indigenous cultural heritage past and present, and how it supports identity, self-determination and resistance."
  zh: "原住民文化遗产的过去与现在，以及它如何支持身份认同、自决与抵抗。"
  zh-TW: "原住民文化遺產的過去與現在，以及它如何支持身分認同、自決與抵抗。"
  ja: "先住民の文化遺産の過去と現在、そしてそれがアイデンティティ・自己決定・抵抗をどう支えるかを学ぶ。"
  ko: "원주민 문화유산의 과거와 현재, 그리고 그것이 정체성, 자기결정, 저항을 어떻게 뒷받침하는지 배운다."
  vi: "Di sản văn hóa bản địa xưa và nay, và cách nó hỗ trợ bản sắc, quyền tự quyết và sự kháng cự."
  ms: "Warisan budaya Orang Asal dulu dan kini, serta cara ia menyokong identiti, penentuan nasib sendiri dan penentangan."
  id: "Warisan budaya adat dulu dan kini, serta cara ia mendukung identitas, penentuan nasib sendiri, dan perlawanan."
  hi: "मूलनिवासी सांस्कृतिक विरासत अतीत और वर्तमान में, और यह पहचान, आत्मनिर्णय व प्रतिरोध को कैसे सहारा देती है।"
outcomes:
  - en: "Analyse Indigenous cultural works"
    zh: "分析原住民文化作品"
    zh-TW: "分析原住民文化作品"
    ja: "先住民の文化作品を分析する"
    ko: "원주민 문화 작품 분석하기"
    vi: "Phân tích các tác phẩm văn hóa bản địa"
    ms: "Analisis karya budaya Orang Asal"
    id: "Menganalisis karya budaya masyarakat adat"
    hi: "मूलनिवासी सांस्कृतिक कृतियों का विश्लेषण करना"
  - en: "Assess law and policy on cultural heritage"
    zh: "评估文化遗产相关的法律与政策"
    zh-TW: "評估文化遺產相關的法律與政策"
    ja: "文化遺産をめぐる法と政策を評価する"
    ko: "문화유산 관련 법과 정책 평가하기"
    vi: "Đánh giá luật và chính sách về di sản văn hóa"
    ms: "Nilai undang-undang dan dasar warisan budaya"
    id: "Menilai hukum dan kebijakan warisan budaya"
    hi: "सांस्कृतिक विरासत पर कानून और नीति का आकलन करना"
  - en: "Explain heritage's role in self-determination"
    zh: "解释文化遗产在自决中的作用"
    zh-TW: "解釋文化遺產在自決中的作用"
    ja: "自己決定における文化遺産の役割を説明する"
    ko: "자기결정에서 유산의 역할 설명하기"
    vi: "Giải thích vai trò của di sản trong quyền tự quyết"
    ms: "Terangkan peranan warisan dalam penentuan nasib sendiri"
    id: "Menjelaskan peran warisan dalam penentuan nasib sendiri"
    hi: "आत्मनिर्णय में विरासत की भूमिका समझाना"
