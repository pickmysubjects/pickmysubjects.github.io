code: LING20006
year: 2026
learn:
  en: "How sentences are built: constituents, word order and clauses, analysed across many languages."
  zh: "句子如何构成：成分、语序和从句，跨多种语言进行分析。"
  zh-TW: "句子如何構成：成分、語序和子句，跨多種語言進行分析。"
  ja: "文がどう組み立てられるか。構成素・語順・節を多くの言語で分析する。"
  ko: "문장이 어떻게 만들어지는지, 구성 성분, 어순, 절을 여러 언어에 걸쳐 분석한다."
  vi: "Câu được cấu tạo ra sao: thành phần, trật tự từ và mệnh đề, phân tích trên nhiều ngôn ngữ."
  ms: "Cara ayat dibina: konstituen, susunan kata dan klausa, dianalisis merentas banyak bahasa."
  id: "Cara kalimat dibangun: konstituen, urutan kata, dan klausa, dianalisis di banyak bahasa."
  hi: "वाक्य कैसे बनते हैं: घटक, शब्द-क्रम और उपवाक्य, कई भाषाओं में विश्लेषण।"
outcomes:
  - en: "Analyse sentence structure in many languages"
    zh: "分析多种语言的句子结构"
    zh-TW: "分析多種語言的句子結構"
    ja: "さまざまな言語の文構造を分析する"
    ko: "여러 언어의 문장 구조 분석하기"
    vi: "Phân tích cấu trúc câu ở nhiều ngôn ngữ"
    ms: "Analisis struktur ayat dalam banyak bahasa"
    id: "Menganalisis struktur kalimat di banyak bahasa"
    hi: "कई भाषाओं में वाक्य संरचना का विश्लेषण करना"
  - en: "Use several theoretical models of syntax"
    zh: "运用几种句法理论模型"
    zh-TW: "運用幾種句法理論模型"
    ja: "いくつかの統語論のモデルを使う"
    ko: "여러 통사론 이론 모델 활용하기"
    vi: "Sử dụng một số mô hình lý thuyết cú pháp"
    ms: "Guna beberapa model teori sintaksis"
    id: "Memakai beberapa model teori sintaksis"
    hi: "वाक्यविन्यास के कई सैद्धांतिक मॉडल इस्तेमाल करना"
  - en: "Engage with current debates in syntax"
    zh: "参与句法学当前的争论"
    zh-TW: "參與句法學當前的爭論"
    ja: "統語論の今の論争に取り組む"
    ko: "통사론의 현재 논쟁 다루기"
    vi: "Tham gia các tranh luận hiện nay về cú pháp"
    ms: "Libatkan diri dalam perdebatan semasa sintaksis"
    id: "Terlibat dalam perdebatan terkini sintaksis"
    hi: "वाक्यविन्यास की मौजूदा बहसों से जुड़ना"
