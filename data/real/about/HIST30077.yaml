code: HIST30077
year: 2026
learn:
  en: "The Greek diaspora and others like Italian, Chinese and Vietnamese: migration, home and belonging, seen through film, poetry and photos."
  zh: "希腊侨民及意大利、华人、越南等其他侨民群体：通过电影、诗歌和摄影看移民、家园与归属。"
  zh-TW: "希臘僑民及義大利、華人、越南等其他僑民群體：透過電影、詩歌和攝影看移民、家園與歸屬。"
  ja: "ギリシャ系をはじめ、イタリア系、中国系、ベトナム系などのディアスポラ。映画、詩、写真から移民、故郷、帰属を考える。"
  ko: "그리스계를 비롯해 이탈리아계, 중국계, 베트남계 등의 디아스포라. 영화, 시, 사진으로 이주, 고향, 소속을 살핀다."
  vi: "Cộng đồng Hy Lạp hải ngoại cùng người Ý, Hoa, Việt…: di cư, quê hương và cảm giác thuộc về qua phim, thơ và ảnh."
  ms: "Diaspora Yunani bersama diaspora lain seperti Itali, Cina dan Vietnam: migrasi, kampung halaman dan rasa milik melalui filem, puisi dan foto."
  id: "Diaspora Yunani bersama diaspora lain seperti Italia, Tionghoa dan Vietnam: migrasi, rumah dan rasa memiliki lewat film, puisi dan foto."
  hi: "यूनानी प्रवासी समुदाय के साथ इतालवी, चीनी, वियतनामी जैसे अन्य: प्रवास, घर और अपनापन, फ़िल्म, कविता और तस्वीरों के ज़रिए।"
outcomes:
  - en: "Trace histories of migration and diaspora"
    zh: "追溯移民与侨民的历史"
    zh-TW: "追溯移民與僑民的歷史"
    ja: "移民とディアスポラの歴史をたどる"
    ko: "이주와 디아스포라의 역사 추적하기"
    vi: "Lần theo lịch sử di cư và cộng đồng hải ngoại"
    ms: "Jejaki sejarah migrasi dan diaspora"
    id: "Menelusuri sejarah migrasi dan diaspora"
    hi: "प्रवास और प्रवासी समुदायों के इतिहास को समझना"
  - en: "Analyse diaspora culture in film, poetry and photos"
    zh: "分析电影、诗歌和摄影中的侨民文化"
    zh-TW: "分析電影、詩歌和攝影中的僑民文化"
    ja: "映画、詩、写真に表れたディアスポラ文化を分析する"
    ko: "영화, 시, 사진 속 디아스포라 문화 분석하기"
    vi: "Phân tích văn hóa cộng đồng hải ngoại qua phim, thơ, ảnh"
    ms: "Analisis budaya diaspora dalam filem, puisi dan foto"
    id: "Menganalisis budaya diaspora dalam film, puisi dan foto"
    hi: "फ़िल्म, कविता और तस्वीरों में प्रवासी संस्कृति का विश्लेषण करना"
  - en: "Discuss what 'home' and 'nation' mean"
    zh: "讨论“家”与“国”的含义"
    zh-TW: "討論「家」與「國」的含義"
    ja: "「故郷」と「国」の意味を議論する"
    ko: "'집'과 '국가'의 의미 토론하기"
    vi: "Thảo luận ý nghĩa của 'quê hương' và 'quốc gia'"
    ms: "Bincangkan maksud 'rumah' dan 'negara'"
    id: "Membahas makna 'rumah' dan 'bangsa'"
    hi: "'घर' और 'राष्ट्र' के अर्थ पर चर्चा करना"
