code: PHRM30009
year: 2026
learn:
  en: "Designing and running lab experiments with drugs, ending in a small team research project."
  zh: "设计并做药理实验，最后和小组完成一个研究项目。"
  zh-TW: "設計並做藥理實驗，最後和小組完成一個研究專題。"
  ja: "薬を使った実験の設計と実施。最後に少人数チームで研究プロジェクトを行う。"
  ko: "약물 실험을 설계하고 수행하며, 마지막에 소규모 팀 연구 프로젝트를 진행."
  vi: "Thiết kế và làm thí nghiệm với thuốc, kết thúc bằng một dự án nghiên cứu nhóm nhỏ."
  ms: "Mereka bentuk dan menjalankan eksperimen makmal dengan ubat, diakhiri projek penyelidikan pasukan kecil."
  id: "Merancang dan menjalankan eksperimen lab dengan obat, diakhiri proyek riset tim kecil."
  hi: "दवाओं के साथ लैब प्रयोग डिज़ाइन करना और चलाना, अंत में छोटी टीम का रिसर्च प्रोजेक्ट।"
outcomes:
  - en: "Design an experiment and analyse the data"
    zh: "设计实验并分析数据"
    zh-TW: "設計實驗並分析數據"
    ja: "実験を設計しデータを分析する"
    ko: "실험을 설계하고 데이터 분석"
    vi: "Thiết kế thí nghiệm và phân tích dữ liệu"
    ms: "Reka eksperimen dan analisis data"
    id: "Merancang eksperimen dan menganalisis data"
    hi: "प्रयोग डिज़ाइन करना और डेटा का विश्लेषण"
  - en: "Use common lab techniques from biomedical research"
    zh: "用生物医学研究常用的实验技术"
    zh-TW: "使用生醫研究常用的實驗技術"
    ja: "生物医学研究でよく使う実験技術を使う"
    ko: "생명의학 연구의 일반적인 실험 기법 사용"
    vi: "Dùng các kỹ thuật lab phổ biến trong nghiên cứu y sinh"
    ms: "Guna teknik makmal biasa dalam penyelidikan bioperubatan"
    id: "Memakai teknik lab umum dalam riset biomedis"
    hi: "बायोमेडिकल रिसर्च की आम लैब तकनीकें इस्तेमाल करना"
  - en: "Keep good lab notes and report your findings"
    zh: "规范记实验笔记并汇报结果"
    zh-TW: "規範地記實驗筆記並報告結果"
    ja: "実験ノートをきちんと取り、結果を報告する"
    ko: "실험 노트를 잘 작성하고 결과 보고"
    vi: "Ghi chép lab cẩn thận và báo cáo kết quả"
    ms: "Simpan nota makmal yang baik dan laporkan dapatan"
    id: "Mencatat lab dengan baik dan melaporkan temuan"
    hi: "अच्छे लैब नोट्स रखना और नतीजे रिपोर्ट करना"
