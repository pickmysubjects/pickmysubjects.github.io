code: BUSA90525
year: 2027
learn:
  en: "A supervised work placement with a host organisation or the on-campus WorkHub, plus employability modules."
  zh: "在合作机构或校内 WorkHub 完成有导师指导的实习，并学习就业能力模块。"
  zh-TW: "在合作機構或校內 WorkHub 完成有導師指導的實習，並修習就業能力單元。"
  ja: "受入れ先または学内 WorkHub での指導付きインターンシップと就業力モジュール。"
  ko: "기관 또는 교내 WorkHub에서 지도받는 인턴십과 취업역량 모듈."
  vi: "Thực tập có hướng dẫn tại tổ chức tiếp nhận hoặc WorkHub trong trường, kèm học phần kỹ năng nghề nghiệp."
  ms: "Penempatan kerja berpenyelia di organisasi tuan rumah atau WorkHub kampus, serta modul kebolehpasaran."
  id: "Magang terbimbing di organisasi mitra atau WorkHub kampus, ditambah modul kesiapan kerja."
  hi: "किसी संस्था या कैंपस के WorkHub में निगरानी वाली इंटर्नशिप, साथ में रोजगार-कौशल मॉड्यूल।"
outcomes:
  - en: "Apply business knowledge in a real workplace"
    zh: "在真实职场运用商业知识"
    zh-TW: "在真實職場運用商業知識"
    ja: "実際の職場でビジネス知識を活かす"
    ko: "실제 직장에서 경영 지식 활용하기"
    vi: "Vận dụng kiến thức kinh doanh tại nơi làm việc thực tế"
    ms: "Mengaplikasi pengetahuan perniagaan di tempat kerja sebenar"
    id: "Menerapkan pengetahuan bisnis di tempat kerja nyata"
    hi: "असली कार्यस्थल पर व्यावसायिक ज्ञान लागू करना"
  - en: "Reflect on workplace culture and career paths"
    zh: "反思职场文化与职业路径"
    zh-TW: "反思職場文化與職涯路徑"
    ja: "職場文化とキャリアの道筋を振り返る"
    ko: "직장 문화와 진로 돌아보기"
    vi: "Suy ngẫm về văn hóa công sở và lộ trình nghề nghiệp"
    ms: "Merenung budaya tempat kerja dan laluan kerjaya"
    id: "Merefleksikan budaya kerja dan jalur karier"
    hi: "कार्यस्थल संस्कृति और करियर रास्तों पर विचार करना"
