code: AGRI10051
year: 2026
learn:
  en: "Genetics for breeding crops and farm animals, from Mendel's laws to genomic selection and GM."
  zh: "用于作物和家畜育种的遗传学，从孟德尔定律到基因组选择与转基因。"
  zh-TW: "用於作物和家畜育種的遺傳學，從孟德爾定律到基因體選拔與基因改造。"
  ja: "メンデルの法則からゲノム選抜、遺伝子組換えまで、作物と家畜の育種のための遺伝学。"
  ko: "멘델 법칙부터 유전체 선발, GM까지 작물·가축 육종을 위한 유전학."
  vi: "Di truyền học cho chọn giống cây trồng và vật nuôi, từ định luật Mendel đến chọn lọc hệ gen và biến đổi gen."
  ms: "Genetik untuk pembiakan tanaman dan ternakan, dari hukum Mendel hingga pemilihan genomik dan GM."
  id: "Genetika untuk pemuliaan tanaman dan ternak, dari hukum Mendel hingga seleksi genomik dan GM."
  hi: "फसलों और पशुओं के प्रजनन के लिए आनुवंशिकी, मेंडल के नियमों से जीनोमिक चयन और GM तक।"
outcomes:
  - en: "Explain inheritance, recombination and mutation"
    zh: "解释遗传、重组与突变"
    zh-TW: "解釋遺傳、重組與突變"
    ja: "遺伝、組換え、突然変異を説明する"
    ko: "유전, 재조합, 돌연변이를 설명한다"
    vi: "Giải thích di truyền, tái tổ hợp và đột biến"
    ms: "Terangkan pewarisan, rekombinasi dan mutasi"
    id: "Menjelaskan pewarisan, rekombinasi dan mutasi"
    hi: "वंशागति, पुनर्संयोजन और उत्परिवर्तन समझाएँ"
  - en: "Link genotype, phenotype and environment"
    zh: "关联基因型、表型与环境"
    zh-TW: "連結基因型、表型與環境"
    ja: "遺伝子型・表現型・環境を関連づける"
    ko: "유전형, 표현형, 환경을 연결한다"
    vi: "Liên hệ kiểu gen, kiểu hình và môi trường"
    ms: "Kaitkan genotip, fenotip dan persekitaran"
    id: "Menghubungkan genotipe, fenotipe dan lingkungan"
    hi: "जीनोटाइप, फ़ीनोटाइप और पर्यावरण को जोड़ें"
  - en: "Apply genetic tools to plant and animal breeding"
    zh: "将遗传工具用于动植物育种"
    zh-TW: "將遺傳工具用於動植物育種"
    ja: "動植物の育種に遺伝学的手法を使う"
    ko: "동식물 육종에 유전학 도구를 적용한다"
    vi: "Áp dụng công cụ di truyền vào chọn giống"
    ms: "Gunakan alat genetik dalam pembiakan"
    id: "Menerapkan alat genetik dalam pemuliaan"
    hi: "पौधों और पशुओं के प्रजनन में आनुवंशिक उपकरण लागू करें"
