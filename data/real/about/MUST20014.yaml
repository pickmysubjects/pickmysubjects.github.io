code: MUST20014
year: 2026
learn:
  en: "More acting through song, studying one character in depth, and performing in the ensemble of a musical."
  zh: "进一步以歌演戏，深入研究一个角色，并在音乐剧中担任群演。"
  zh-TW: "進一步以歌演戲，深入研究一個角色，並在音樂劇中擔任群演。"
  ja: "歌で演じる力を深め、一人の役を掘り下げ、ミュージカルのアンサンブルに出演する。"
  ko: "노래로 연기하기를 심화하고 한 인물을 깊이 연구해 뮤지컬 앙상블로 출연한다."
  vi: "Thêm diễn qua bài hát, nghiên cứu sâu một nhân vật, diễn trong dàn đồng ca nhạc kịch."
  ms: "Lebih banyak lakonan melalui lagu, mendalami satu watak, dan beraksi dalam ensembel muzikal."
  id: "Akting lewat lagu lebih dalam, mendalami satu tokoh, dan tampil di ensambel musikal."
  hi: "गीत के ज़रिए अभिनय, एक किरदार का गहन अध्ययन और म्यूज़िकल के ensemble में प्रदर्शन।"
outcomes:
  - en: "Study and play one character through song"
    zh: "通过歌曲研究并演出一个角色"
    zh-TW: "透過歌曲研究並演出一個角色"
    ja: "歌で一人の役を研究し演じる"
    ko: "노래로 한 인물 연구하고 연기하기"
    vi: "Nghiên cứu và diễn một nhân vật qua bài hát"
    ms: "Kaji dan lakon satu watak melalui lagu"
    id: "Mendalami dan memerankan tokoh lewat lagu"
    hi: "गीत के ज़रिए एक किरदार निभाना"
  - en: "Present songs in different styles"
    zh: "用不同风格演唱歌曲"
    zh-TW: "用不同風格演唱歌曲"
    ja: "様々な様式で歌を発表する"
    ko: "여러 스타일로 노래 선보이기"
    vi: "Trình bày bài hát ở nhiều phong cách"
    ms: "Persembah lagu dalam pelbagai gaya"
    id: "Membawakan lagu dalam berbagai gaya"
    hi: "अलग-अलग शैलियों में गीत प्रस्तुत करना"
  - en: "Perform in a group musical project"
    zh: "参与小组音乐剧演出"
    zh-TW: "參與小組音樂劇演出"
    ja: "グループのミュージカル企画に出演する"
    ko: "그룹 뮤지컬 프로젝트 공연하기"
    vi: "Diễn trong dự án nhạc kịch nhóm"
    ms: "Beraksi dalam projek muzikal kumpulan"
    id: "Tampil di proyek musikal kelompok"
    hi: "समूह म्यूज़िकल प्रोजेक्ट में प्रदर्शन"
