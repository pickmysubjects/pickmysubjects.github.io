code: ABPL90414
year: 2027
learn:
  en: "Lean construction: lean thinking from Toyota, tools like the Last Planner System, and cutting waste on projects."
  zh: "精益建造：源自丰田的精益思想、末位计划者体系等工具，以及减少项目浪费。"
  zh-TW: "精實營建：源自豐田的精實思維、Last Planner System 等工具，以及減少專案浪費。"
  ja: "リーン建設：トヨタ由来の考え方、ラストプランナーなどのツール、無駄の削減。"
  ko: "린 건설: 도요타식 린 사고, 라스트 플래너 시스템 등 도구, 낭비 줄이기."
  vi: "Xây dựng tinh gọn: tư duy Toyota, công cụ Last Planner System và giảm lãng phí."
  ms: "Pembinaan lean: pemikiran Toyota, alat seperti Last Planner System dan mengurangkan pembaziran."
  id: "Konstruksi lean: pemikiran Toyota, alat seperti Last Planner System dan mengurangi pemborosan."
  hi: "लीन निर्माण: टोयोटा से आई सोच, Last Planner System जैसे टूल और बर्बादी घटाना।"
outcomes:
  - en: "Explain the lean project delivery framework"
    zh: "解释精益项目交付框架"
    zh-TW: "解釋精實專案交付架構"
    ja: "リーンなプロジェクト実施体系を説明する"
    ko: "린 프로젝트 수행 체계 설명하기"
    vi: "Giải thích khung triển khai dự án tinh gọn"
    ms: "Menerangkan rangka kerja penyampaian projek lean"
    id: "Menjelaskan kerangka penyelesaian proyek lean"
    hi: "लीन परियोजना ढाँचा समझाना"
  - en: "Apply lean tools to construction case studies"
    zh: "把精益工具用于建筑案例"
    zh-TW: "把精實工具用於營建個案"
    ja: "リーン手法を建設事例に使う"
    ko: "린 도구를 건설 사례에 적용하기"
    vi: "Áp dụng công cụ tinh gọn vào tình huống"
    ms: "Menggunakan alat lean pada kajian kes"
    id: "Menerapkan alat lean pada studi kasus"
    hi: "निर्माण मामलों पर लीन टूल लागू करना"
