code: GEOG20002
year: 2026
learn:
  en: "How landforms like rivers, coasts and glaciers form and change, with lab, GIS and a 4-day field trip."
  zh: "河流、海岸、冰川等地貌如何形成和变化，含实验、GIS和4天野外考察。"
  zh-TW: "河流、海岸、冰河等地形如何形成與變化，含實驗、GIS與4天野外考察。"
  ja: "川・海岸・氷河などの地形の形成と変化を、実験・GIS・4日間の野外調査で学ぶ。"
  ko: "강·해안·빙하 같은 지형의 형성과 변화를 실험, GIS, 4일 현장답사로 배움."
  vi: "Địa hình như sông, bờ biển, sông băng hình thành và đổi ra sao, có lab, GIS và 4 ngày thực địa."
  ms: "Cara bentuk muka bumi seperti sungai, pantai, glasier terbentuk, dengan makmal, GIS dan lawatan 4 hari."
  id: "Cara bentang alam seperti sungai, pantai, gletser terbentuk, dengan lab, GIS, dan kunjungan lapangan 4 hari."
  hi: "नदियाँ, तट, ग्लेशियर जैसे भू-आकार कैसे बनते-बदलते हैं, लैब, GIS और 4 दिन की फ़ील्ड ट्रिप के साथ।"
outcomes:
  - en: "Analyse geomorphic data to read landscape change"
    zh: "分析地貌数据解读景观变化"
    zh-TW: "分析地形資料解讀地景變化"
    ja: "地形データで景観変化を読み解く"
    ko: "지형 데이터로 경관 변화 해석하기"
    vi: "Phân tích dữ liệu địa mạo để hiểu biến đổi cảnh quan"
    ms: "Analisis data geomorfologi untuk perubahan landskap"
    id: "Menganalisis data geomorfologi untuk perubahan lanskap"
    hi: "भू-आकृति डेटा से परिदृश्य परिवर्तन समझना"
  - en: "Use field and lab methods to classify landscapes"
    zh: "用野外和实验方法划分景观"
    zh-TW: "用野外與實驗方法分類地景"
    ja: "野外・実験手法で景観を分類する"
    ko: "현장·실험 기법으로 경관 분류하기"
    vi: "Dùng phương pháp thực địa và lab để phân loại cảnh quan"
    ms: "Guna kaedah lapangan dan makmal untuk kelaskan landskap"
    id: "Memakai metode lapangan dan lab untuk klasifikasi lanskap"
    hi: "फ़ील्ड और लैब विधियों से परिदृश्य वर्गीकृत करना"
