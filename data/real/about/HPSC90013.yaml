code: HPSC90013
year: 2027
learn:
  en: "Why science gets caught up in public controversies, from genetic modification to climate change, and how policy responds."
  zh: "从转基因到气候变化，科学为何卷入公共争议，以及政策如何应对。"
  zh-TW: "從基因改造到氣候變遷，科學為何捲入公共爭議，以及政策如何回應。"
  ja: "遺伝子組換えから気候変動まで、科学が社会的論争に巻き込まれる理由と政策の対応。"
  ko: "유전자 변형부터 기후변화까지, 과학이 공적 논쟁에 휘말리는 이유와 정책의 대응."
  vi: "Vì sao khoa học vướng vào tranh cãi công khai, từ biến đổi gen đến biến đổi khí hậu, và chính sách phản ứng thế nào."
  ms: "Mengapa sains terlibat dalam kontroversi awam, dari pengubahsuaian genetik hingga perubahan iklim, dan respons dasar."
  id: "Mengapa sains terseret kontroversi publik, dari rekayasa genetika hingga perubahan iklim, dan bagaimana kebijakan merespons."
  hi: "विज्ञान सार्वजनिक विवादों में क्यों फँसता है, आनुवंशिक संशोधन से जलवायु परिवर्तन तक, और नीति कैसे जवाब देती है।"
outcomes:
  - en: "Explain how science-policy controversies arise"
    zh: "解释科学与政策争议如何产生"
    zh-TW: "解釋科學與政策爭議如何產生"
    ja: "科学と政策の論争が生まれる仕組みを説明する"
    ko: "과학·정책 논쟁이 생기는 이유 설명하기"
    vi: "Giải thích tranh cãi khoa học–chính sách nảy sinh ra sao"
    ms: "Menerangkan bagaimana kontroversi sains-dasar timbul"
    id: "Menjelaskan bagaimana kontroversi sains-kebijakan muncul"
    hi: "विज्ञान-नीति विवाद कैसे उठते हैं, समझाना"
  - en: "Use theory to analyse real case studies"
    zh: "用理论分析真实案例"
    zh-TW: "用理論分析真實案例"
    ja: "理論を使って実例を分析する"
    ko: "이론으로 실제 사례 분석하기"
    vi: "Dùng lý thuyết phân tích tình huống thực tế"
    ms: "Menggunakan teori untuk menganalisis kajian kes sebenar"
    id: "Memakai teori untuk menganalisis studi kasus nyata"
    hi: "सिद्धांत से वास्तविक केस स्टडी का विश्लेषण"
