code: COMP10002
year: 2026
learn:
  en: "Programming in C with control over memory, plus standard ways to sort, search and store data."
  zh: "用C语言编程，学会管内存，以及常用的排序、查找和数据结构。"
  zh-TW: "用C語言程式設計，學會管理記憶體，以及常用的排序、搜尋和資料結構。"
  ja: "メモリを制御しながらCでプログラミングし、データの整列・探索・格納の定番手法を学ぶ。"
  ko: "메모리를 직접 다루는 C 프로그래밍과 정렬·탐색·저장의 표준 기법."
  vi: "Lập trình C có kiểm soát bộ nhớ, cùng các cách chuẩn để sắp xếp, tìm kiếm và lưu dữ liệu."
  ms: "Pengaturcaraan C dengan kawalan memori, serta cara standard mengisih, mencari dan menyimpan data."
  id: "Pemrograman C dengan kendali memori, plus cara standar untuk mengurutkan, mencari, dan menyimpan data."
  hi: "मेमोरी कंट्रोल के साथ C में प्रोग्रामिंग, और डेटा सॉर्ट, सर्च व स्टोर करने के स्टैंडर्ड तरीके।"
outcomes:
  - en: "Write, test and debug small C programs"
    zh: "编写、测试和调试小型C程序"
    zh-TW: "撰寫、測試和除錯小型C程式"
    ja: "小さなCプログラムを書き、テストし、デバッグする"
    ko: "작은 C 프로그램 작성, 테스트, 디버그하기"
    vi: "Viết, kiểm thử và gỡ lỗi chương trình C nhỏ"
    ms: "Tulis, uji dan nyahpepijat program C kecil"
    id: "Menulis, menguji, dan men-debug program C kecil"
    hi: "छोटे C प्रोग्राम लिखना, टेस्ट और डिबग करना"
  - en: "Use linked lists, search trees and hash tables"
    zh: "会用链表、搜索树和哈希表"
    zh-TW: "會用鏈結串列、搜尋樹和雜湊表"
    ja: "連結リスト、探索木、ハッシュ表を使う"
    ko: "연결 리스트, 탐색 트리, 해시 테이블 사용하기"
    vi: "Dùng danh sách liên kết, cây tìm kiếm và bảng băm"
    ms: "Guna senarai berpaut, pepohon carian dan jadual cincang"
    id: "Memakai linked list, search tree, dan hash table"
    hi: "लिंक्ड लिस्ट, सर्च ट्री और हैश टेबल इस्तेमाल करना"
  - en: "Pick an algorithm by comparing how fast it runs"
    zh: "比较运行效率来选算法"
    zh-TW: "比較執行效率來選演算法"
    ja: "実行速度を比べてアルゴリズムを選ぶ"
    ko: "실행 속도를 비교해 알고리즘 고르기"
    vi: "Chọn thuật toán bằng cách so sánh tốc độ chạy"
    ms: "Pilih algoritma dengan banding kelajuannya"
    id: "Memilih algoritma dengan membandingkan kecepatannya"
    hi: "रनटाइम की तुलना करके एल्गोरिद्म चुनना"
