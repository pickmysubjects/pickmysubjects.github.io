code: BOTA30004
year: 2026
learn:
  en: "Victorian plant communities, threats to native vegetation, and how to assess and manage it, with field trips."
  zh: "维州植物群落、原生植被面临的威胁，以及如何评估和管理，含野外考察。"
  zh-TW: "維州植物群落、原生植被面臨的威脅，以及如何評估與管理，含野外考察。"
  ja: "ビクトリア州の植物群落、在来植生への脅威、その評価と管理を野外実習で学ぶ。"
  ko: "빅토리아주 식물 군락, 자생 식생의 위협, 그 평가와 관리를 현장 답사로 배운다."
  vi: "Quần xã thực vật bang Victoria, mối đe dọa với thảm thực vật bản địa, cách đánh giá và quản lý, có đi thực địa."
  ms: "Komuniti tumbuhan Victoria, ancaman kepada tumbuhan asli, serta cara menilai dan mengurusnya, dengan lawatan lapangan."
  id: "Komunitas tumbuhan Victoria, ancaman bagi vegetasi asli, serta cara menilai dan mengelolanya, dengan kunjungan lapangan."
  hi: "विक्टोरिया के पौधों के समुदाय, देशी वनस्पति के खतरे, और उनका आकलन व प्रबंधन, फ़ील्ड ट्रिप के साथ।"
outcomes:
  - en: "Assess native plant communities in the field"
    zh: "在野外评估原生植物群落"
    zh-TW: "在野外評估原生植物群落"
    ja: "在来植物群落を野外で評価する"
    ko: "현장에서 자생 식물 군락 평가하기"
    vi: "Đánh giá quần xã thực vật bản địa ngoài thực địa"
    ms: "Menilai komuniti tumbuhan asli di lapangan"
    id: "Menilai komunitas tumbuhan asli di lapangan"
    hi: "फ़ील्ड में देशी पौधों के समुदायों का आकलन करना"
  - en: "Make a vegetation map and management plan"
    zh: "绘制植被图并制定管理方案"
    zh-TW: "繪製植被圖並擬定管理計畫"
    ja: "植生図と管理計画を作る"
    ko: "식생 지도와 관리 계획 만들기"
    vi: "Lập bản đồ thảm thực vật và kế hoạch quản lý"
    ms: "Membuat peta tumbuhan dan pelan pengurusan"
    id: "Membuat peta vegetasi dan rencana pengelolaan"
    hi: "वनस्पति मानचित्र और प्रबंधन योजना बनाना"
  - en: "Explain Victoria's native vegetation laws"
    zh: "解释维州原生植被相关法规"
    zh-TW: "解釋維州原生植被相關法規"
    ja: "ビクトリア州の在来植生の法制度を説明する"
    ko: "빅토리아주 자생 식생 관련 법 설명하기"
    vi: "Giải thích luật về thảm thực vật bản địa ở Victoria"
    ms: "Menerangkan undang-undang tumbuhan asli Victoria"
    id: "Menjelaskan aturan vegetasi asli di Victoria"
    hi: "विक्टोरिया के देशी वनस्पति कानून समझाना"
