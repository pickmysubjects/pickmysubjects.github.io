code: ELEN90095
year: 2027
learn:
  en: "The software and algorithms that let robots sense, plan and move through their environment on their own."
  zh: "让机器人自主感知、规划并在环境中移动的软件与算法。"
  zh-TW: "讓機器人自主感知、規劃並在環境中移動的軟體與演算法。"
  ja: "ロボットが自律的に感知・計画・移動するためのソフトとアルゴリズム。"
  ko: "로봇이 스스로 감지·계획·이동하게 하는 소프트웨어와 알고리즘."
  vi: "Phần mềm và thuật toán giúp robot tự cảm nhận, lập kế hoạch và di chuyển."
  ms: "Perisian dan algoritma yang membolehkan robot mengesan, merancang dan bergerak sendiri."
  id: "Perangkat lunak dan algoritma yang membuat robot mengindra, merencanakan, dan bergerak sendiri."
  hi: "सॉफ़्टवेयर और एल्गोरिद्म जिनसे रोबोट खुद महसूस, योजना और आवाजाही करते हैं।"
outcomes:
  - en: "Explain the sense-plan-act loop of a robot"
    zh: "解释机器人的感知-规划-行动循环"
    zh-TW: "解釋機器人的感知-規劃-行動循環"
    ja: "ロボットの感知・計画・行動ループを説明する"
    ko: "로봇의 감지-계획-행동 루프 설명하기"
    vi: "Giải thích vòng cảm nhận-lập kế hoạch-hành động"
    ms: "Terangkan gelung kesan-rancang-bertindak robot"
    id: "Menjelaskan siklus indra-rencana-aksi robot"
    hi: "रोबोट का सेंस-प्लान-एक्ट लूप समझाना"
  - en: "Implement algorithms for autonomous robot movement"
    zh: "实现机器人自主移动算法"
    zh-TW: "實作機器人自主移動演算法"
    ja: "自律移動のアルゴリズムを実装する"
    ko: "자율 이동 알고리즘 구현하기"
    vi: "Cài đặt thuật toán cho robot tự di chuyển"
    ms: "Laksana algoritma pergerakan robot autonomi"
    id: "Mengimplementasikan algoritma gerak robot otonom"
    hi: "स्वायत्त रोबोट गति के एल्गोरिद्म बनाना"
