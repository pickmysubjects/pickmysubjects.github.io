code: MUSI10228
year: 2026
learn:
  en: "Builds on Sound Studies 1: how sound works in film, games and other media, through listening, analysis and hands-on studio tasks."
  zh: "承接声音研究1：通过聆听、分析和实操，学习声音在影视、游戏等媒体中的作用。"
  zh-TW: "承接聲音研究1：透過聆聽、分析與實作，學習聲音在影視、遊戲等媒體中的作用。"
  ja: "サウンド研究1の続き。聴取・分析・実習で、映像やゲームなどにおける音の働きを学ぶ。"
  ko: "사운드 연구 1의 후속. 청취·분석·실습으로 영상·게임 등 매체 속 소리의 역할을 배운다."
  vi: "Tiếp nối Sound Studies 1: âm thanh trong phim, game và truyền thông qua nghe, phân tích và thực hành."
  ms: "Lanjutan Sound Studies 1: fungsi bunyi dalam filem, permainan dan media melalui dengar, analisis dan amali."
  id: "Lanjutan Sound Studies 1: peran suara dalam film, game, dan media lewat mendengar, analisis, dan praktik."
  hi: "साउंड स्टडीज़ 1 के आगे: सुनकर, विश्लेषण और प्रैक्टिकल से फ़िल्म, गेम व मीडिया में ध्वनि की भूमिका।"
outcomes:
  - en: "Analyse sound in media by ear"
    zh: "凭听觉分析媒体中的声音"
    zh-TW: "憑聽覺分析媒體中的聲音"
    ja: "メディアの音を耳で分析する"
    ko: "매체 속 소리를 귀로 분석하기"
    vi: "Phân tích âm thanh trong truyền thông bằng tai"
    ms: "Analisis bunyi dalam media melalui dengar"
    id: "Menganalisis suara dalam media lewat telinga"
    hi: "मीडिया की ध्वनि सुनकर विश्लेषण"
  - en: "Apply sound theory to media work"
    zh: "把声音理论用于媒体创作"
    zh-TW: "把聲音理論用於媒體創作"
    ja: "音響理論をメディア制作に生かす"
    ko: "소리 이론을 매체 작업에 적용하기"
    vi: "Áp dụng lý thuyết âm thanh vào sản phẩm"
    ms: "Guna teori bunyi dalam kerja media"
    id: "Menerapkan teori suara pada karya media"
    hi: "ध्वनि सिद्धांत मीडिया काम में लगाना"
  - en: "Use audio technology with purpose"
    zh: "有目的地使用音频技术"
    zh-TW: "有目的地使用音訊技術"
    ja: "目的に合わせて音響技術を使う"
    ko: "목적에 맞게 오디오 기술 쓰기"
    vi: "Dùng công nghệ âm thanh có mục đích"
    ms: "Guna teknologi audio dengan tujuan"
    id: "Memakai teknologi audio dengan tujuan"
    hi: "उद्देश्य से ऑडियो तकनीक का उपयोग"
