code: AGRI20038
year: 2026
learn:
  en: "How soil chemistry, physics and biology decide whether land suits farming, and how farming changes soil."
  zh: "用化学、物理和生物看土壤是否适合耕种，以及耕作如何改变土壤。"
  zh-TW: "用化學、物理和生物看土壤是否適合耕作，以及耕作如何改變土壤。"
  ja: "土壌の化学・物理・生物から農業適性を判断し、農業が土壌に与える影響を学ぶ。"
  ko: "토양의 화학·물리·생물 특성으로 농업 적합성과 농업이 토양에 주는 영향을 본다."
  vi: "Dùng hóa, lý, sinh học để xem đất có hợp trồng trọt không, và canh tác làm đất thay đổi ra sao."
  ms: "Kimia, fizik dan biologi tanah menentukan kesesuaian untuk pertanian, dan kesan pertanian pada tanah."
  id: "Kimia, fisika, dan biologi tanah menentukan kecocokan untuk bertani, dan dampak pertanian pada tanah."
  hi: "मिट्टी का रसायन, भौतिकी और जीवविज्ञान खेती की उपयुक्तता तय करते हैं, और खेती मिट्टी बदलती है।"
outcomes:
  - en: "Infer soil functions from its properties"
    zh: "根据土壤性质推断其功能"
    zh-TW: "根據土壤性質推斷其功能"
    ja: "性質から土壌の機能を推定する"
    ko: "토양 특성으로 기능 추론하기"
    vi: "Suy ra chức năng đất từ tính chất"
    ms: "Simpulkan fungsi tanah daripada sifatnya"
    id: "Menyimpulkan fungsi tanah dari sifatnya"
    hi: "गुणों से मिट्टी के कार्य का अनुमान लगाएँ"
  - en: "Analyse field soil data against land use"
    zh: "用田间土壤数据分析土地利用"
    zh-TW: "用田間土壤數據分析土地利用"
    ja: "野外の土壌データで土地利用を分析する"
    ko: "현장 토양 데이터로 토지 이용 분석하기"
    vi: "Phân tích dữ liệu đất thực địa theo sử dụng đất"
    ms: "Analisis data tanah lapangan dengan guna tanah"
    id: "Menganalisis data tanah lapangan terhadap tata guna lahan"
    hi: "खेत के मिट्टी डेटा से भूमि उपयोग का विश्लेषण करें"
  - en: "Advise farmers on how soil affects production"
    zh: "就土壤影响生产向农户提建议"
    zh-TW: "就土壤影響生產向農民提供建議"
    ja: "土壌が生産に与える影響を助言する"
    ko: "토양이 생산에 미치는 영향 조언하기"
    vi: "Tư vấn nông dân về ảnh hưởng của đất"
    ms: "Nasihatkan petani tentang kesan tanah pada hasil"
    id: "Memberi saran petani soal pengaruh tanah"
    hi: "किसानों को मिट्टी के उत्पादन पर असर की सलाह दें"
