code: HIST20087
year: 2026
learn:
  en: "An intensive urban history of Melbourne: its neighbourhoods, migrant communities and places, explored on site."
  zh: "墨尔本城市史密集课程：实地探索它的街区、移民社区和各种场所。"
  zh-TW: "墨爾本城市史密集課程：實地探索它的街區、移民社群和各種場所。"
  ja: "メルボルンの都市史を集中講義で学び、街区や移民コミュニティ、さまざまな場所を現地で探る。"
  ko: "멜버른 도시사를 집중 과정으로 배우며, 동네와 이민자 공동체, 여러 장소를 현장에서 탐방한다."
  vi: "Lịch sử đô thị Melbourne học tập trung: khám phá tại chỗ các khu phố, cộng đồng di dân và địa điểm của thành phố."
  ms: "Sejarah bandar Melbourne secara intensif: kejiranan, komuniti migran dan tempat-tempatnya diterokai di lokasi."
  id: "Sejarah kota Melbourne secara intensif: lingkungan, komunitas migran, dan tempat-tempatnya dijelajahi langsung."
  hi: "मेलबर्न का शहरी इतिहास, गहन कोर्स में: उसके मोहल्ले, प्रवासी समुदाय और जगहें मौके पर जाकर।"
outcomes:
  - en: "Describe how the modern city developed"
    zh: "描述现代城市如何发展起来"
    zh-TW: "描述現代城市如何發展起來"
    ja: "近代都市がどう発展したかを説明する"
    ko: "근대 도시가 어떻게 발전했는지 설명하기"
    vi: "Mô tả quá trình phát triển của thành phố hiện đại"
    ms: "Huraikan bagaimana bandar moden berkembang"
    id: "Menguraikan bagaimana kota modern berkembang"
    hi: "आधुनिक शहर कैसे विकसित हुआ, इसका वर्णन करना"
  - en: "Explain how class, race and gender shaped city life"
    zh: "说明阶层、种族和性别如何塑造城市生活"
    zh-TW: "說明階級、種族和性別如何形塑城市生活"
    ja: "階級・人種・ジェンダーが都市生活をどう形づくったか説明する"
    ko: "계층, 인종, 젠더가 도시 생활을 어떻게 만들었는지 설명하기"
    vi: "Giải thích giai cấp, chủng tộc và giới định hình đời sống đô thị ra sao"
    ms: "Terangkan cara kelas, kaum dan gender membentuk kehidupan bandar"
    id: "Menjelaskan cara kelas, ras, dan gender membentuk kehidupan kota"
    hi: "वर्ग, नस्ल और जेंडर ने शहरी जीवन को कैसे आकार दिया, समझाना"
  - en: "Use visual and site evidence as historical sources"
    zh: "把图像和实地证据当作史料使用"
    zh-TW: "把圖像和實地證據當作史料使用"
    ja: "図像や現地の証拠を史料として使う"
    ko: "시각 자료와 현장 증거를 사료로 활용하기"
    vi: "Dùng bằng chứng hình ảnh và thực địa làm nguồn sử liệu"
    ms: "Guna bukti visual dan tapak sebagai sumber sejarah"
    id: "Memakai bukti visual dan lapangan sebagai sumber sejarah"
    hi: "दृश्य और स्थल के सबूतों को ऐतिहासिक स्रोत की तरह इस्तेमाल करना"
