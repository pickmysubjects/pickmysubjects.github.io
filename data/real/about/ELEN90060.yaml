code: ELEN90060
year: 2027
learn:
  en: "Analysing power grids: power flow, fault calculations, frequency and voltage control, and stability, with simulation tools."
  zh: "电网分析：潮流计算、故障计算、频率与电压控制以及稳定性，并使用仿真工具。"
  zh-TW: "電網分析：電力潮流、故障計算、頻率與電壓控制以及穩定度，並使用模擬工具。"
  ja: "電力系統の解析：潮流計算・故障計算・周波数と電圧の制御・安定度、シミュレーションツールを使う。"
  ko: "전력 계통 해석: 조류 계산, 고장 계산, 주파수·전압 제어, 안정도. 시뮬레이션 도구 사용."
  vi: "Phân tích lưới điện: trào lưu công suất, tính ngắn mạch, điều khiển tần số và điện áp, ổn định, dùng công cụ mô phỏng."
  ms: "Analisis grid kuasa: aliran kuasa, pengiraan kerosakan, kawalan frekuensi dan voltan, serta kestabilan, dengan alat simulasi."
  id: "Analisis jaringan listrik: aliran daya, perhitungan gangguan, kendali frekuensi dan tegangan, serta stabilitas, dengan alat simulasi."
  hi: "पावर ग्रिड का विश्लेषण: पावर फ़्लो, फ़ॉल्ट गणना, आवृत्ति और वोल्टेज नियंत्रण, और स्थिरता, सिमुलेशन टूल के साथ।"
outcomes:
  - en: "Compute power flow in transmission systems"
    zh: "计算输电系统的潮流"
    zh-TW: "計算輸電系統的電力潮流"
    ja: "送電系統の潮流を計算する"
    ko: "송전 계통의 조류 계산하기"
    vi: "Tính trào lưu công suất trong hệ thống truyền tải"
    ms: "Mengira aliran kuasa dalam sistem penghantaran"
    id: "Menghitung aliran daya pada sistem transmisi"
    hi: "ट्रांसमिशन प्रणालियों में पावर फ़्लो की गणना"
  - en: "Calculate voltages and currents during faults"
    zh: "计算故障时的电压和电流"
    zh-TW: "計算故障時的電壓與電流"
    ja: "故障時の電圧と電流を計算する"
    ko: "고장 시 전압과 전류 계산하기"
    vi: "Tính điện áp và dòng điện khi có sự cố"
    ms: "Mengira voltan dan arus semasa kerosakan"
    id: "Menghitung tegangan dan arus saat gangguan"
    hi: "फ़ॉल्ट के समय वोल्टेज और करंट की गणना"
  - en: "Assess system stability and simulate it with software"
    zh: "评估系统稳定性并用软件仿真"
    zh-TW: "評估系統穩定度並以軟體模擬"
    ja: "系統の安定度を評価しソフトでシミュレーションする"
    ko: "계통 안정도를 평가하고 소프트웨어로 시뮬레이션하기"
    vi: "Đánh giá ổn định hệ thống và mô phỏng bằng phần mềm"
    ms: "Menilai kestabilan sistem dan mensimulasikannya dengan perisian"
    id: "Menilai stabilitas sistem dan mensimulasikannya dengan perangkat lunak"
    hi: "सिस्टम की स्थिरता आँकना और सॉफ़्टवेयर से सिमुलेट करना"
