code: HEBR30016
year: 2026
learn:
  en: "Wider Hebrew skills in formal and casual registers: conversation practice, media, advanced grammar, essays and reviews."
  zh: "提升正式与日常希伯来语：会话练习、媒体材料、高级语法，写论文和评论。"
  zh-TW: "提升正式與日常希伯來語：會話練習、媒體材料、高級文法，寫論文和評論。"
  ja: "改まった場面とくだけた場面のヘブライ語。会話練習、メディア、上級文法、論文やレビュー。"
  ko: "격식체와 일상체 히브리어 강화. 회화 연습, 미디어, 고급 문법, 에세이와 리뷰 쓰기."
  vi: "Tiếng Do Thái trang trọng và thân mật: luyện hội thoại, truyền thông, ngữ pháp nâng cao, viết luận và bài điểm."
  ms: "Kemahiran Ibrani formal dan santai: latihan perbualan, media, tatabahasa lanjutan, esei dan ulasan."
  id: "Keterampilan Ibrani formal dan santai: latihan percakapan, media, tata bahasa lanjutan, esai dan ulasan."
  hi: "औपचारिक और अनौपचारिक हिब्रू: बातचीत का अभ्यास, मीडिया, उन्नत व्याकरण, निबंध और समीक्षाएँ।"
outcomes:
  - en: "Discuss social and cultural topics in Hebrew"
    zh: "用希伯来语讨论社会和文化话题"
    zh-TW: "用希伯來語討論社會和文化話題"
    ja: "社会や文化の話題をヘブライ語で話し合う"
    ko: "사회·문화 주제를 히브리어로 토론하기"
    vi: "Thảo luận chủ đề xã hội, văn hóa bằng tiếng Do Thái"
    ms: "Bincangkan topik sosial dan budaya dalam bahasa Ibrani"
    id: "Membahas topik sosial dan budaya dalam bahasa Ibrani"
    hi: "सामाजिक और सांस्कृतिक विषयों पर हिब्रू में चर्चा करना"
  - en: "Read and write longer Hebrew texts"
    zh: "读写较长的希伯来语文章"
    zh-TW: "讀寫較長的希伯來語文章"
    ja: "長めのヘブライ語の文章を読み書きする"
    ko: "긴 히브리어 글 읽고 쓰기"
    vi: "Đọc và viết văn bản tiếng Do Thái dài hơn"
    ms: "Baca dan tulis teks bahasa Ibrani yang lebih panjang"
    id: "Membaca dan menulis teks bahasa Ibrani yang lebih panjang"
    hi: "लंबे हिब्रू पाठ पढ़ना-लिखना"
  - en: "Give a clear presentation in Hebrew"
    zh: "用希伯来语做清楚的口头报告"
    zh-TW: "用希伯來語做清楚的口頭報告"
    ja: "ヘブライ語で分かりやすく発表する"
    ko: "히브리어로 명확하게 발표하기"
    vi: "Thuyết trình rõ ràng bằng tiếng Do Thái"
    ms: "Buat pembentangan yang jelas dalam bahasa Ibrani"
    id: "Melakukan presentasi yang jelas dalam bahasa Ibrani"
    hi: "हिब्रू में स्पष्ट प्रस्तुति देना"
