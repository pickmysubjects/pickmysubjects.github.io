code: BMEN90022
year: 2027
learn:
  en: "Building computer models of muscles, bones and nerves to study how people move."
  zh: "建立肌肉、骨骼和神经的计算模型，研究人体运动。"
  zh-TW: "建立肌肉、骨骼與神經的計算模型，研究人體運動。"
  ja: "筋・骨・神経のコンピュータモデルを作り、人の動きを調べる。"
  ko: "근육·뼈·신경의 컴퓨터 모델로 사람의 움직임 연구하기."
  vi: "Xây dựng mô hình máy tính của cơ, xương và thần kinh để nghiên cứu chuyển động."
  ms: "Membina model komputer otot, tulang dan saraf untuk mengkaji pergerakan manusia."
  id: "Membangun model komputer otot, tulang, dan saraf untuk mempelajari gerak manusia."
  hi: "लोगों की गति समझने के लिए मांसपेशी, हड्डी और नसों के कंप्यूटर मॉडल बनाना।"
outcomes:
  - en: "Solve the equations of motion for linked body segments"
    zh: "求解人体环节的运动方程"
    zh-TW: "求解人體環節的運動方程"
    ja: "身体セグメントの運動方程式を解く"
    ko: "신체 분절의 운동 방정식 풀기"
    vi: "Giải phương trình chuyển động của các đoạn cơ thể"
    ms: "Menyelesaikan persamaan gerakan bagi segmen badan"
    id: "Menyelesaikan persamaan gerak segmen tubuh"
    hi: "शरीर खंडों की गति के समीकरण हल करना"
  - en: "Use models to study muscle function in walking and running"
    zh: "用模型研究行走和跑步时的肌肉功能"
    zh-TW: "用模型研究行走與跑步時的肌肉功能"
    ja: "歩行や走行時の筋の働きをモデルで調べる"
    ko: "걷기·달리기 중 근육 기능을 모델로 연구하기"
    vi: "Dùng mô hình để nghiên cứu chức năng cơ khi đi và chạy"
    ms: "Menggunakan model untuk mengkaji fungsi otot semasa berjalan dan berlari"
    id: "Memakai model untuk mempelajari fungsi otot saat berjalan dan berlari"
    hi: "चलने और दौड़ने में मांसपेशियों के काम को मॉडल से समझना"
