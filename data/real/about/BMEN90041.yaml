code: BMEN90041
year: 2027
learn:
  en: "A supervised summer research project in a biomedical engineering group: reading the literature, planning experiments and analysing data."
  zh: "在生物医学工程研究组完成暑期研究：读文献、设计实验、分析数据。"
  zh-TW: "在生醫工程研究團隊完成暑期研究：讀文獻、設計實驗、分析資料。"
  ja: "医用工学の研究室で指導を受けながら行う夏期研究。文献調査、実験計画、データ分析。"
  ko: "의공학 연구실에서 지도를 받으며 하는 여름 연구 프로젝트: 문헌 조사, 실험 설계, 데이터 분석."
  vi: "Dự án nghiên cứu hè có hướng dẫn trong nhóm kỹ thuật y sinh: đọc tài liệu, thiết kế thí nghiệm và phân tích dữ liệu."
  ms: "Projek penyelidikan musim panas berpenyelia dalam kumpulan kejuruteraan bioperubatan: kajian literatur, reka bentuk eksperimen dan analisis data."
  id: "Proyek riset musim panas terbimbing di kelompok teknik biomedis: kajian pustaka, desain eksperimen, dan analisis data."
  hi: "बायोमेडिकल इंजीनियरिंग समूह में निगरानी में गर्मियों का रिसर्च प्रोजेक्ट: साहित्य पढ़ना, प्रयोग की योजना और डेटा विश्लेषण।"
outcomes:
  - en: "Carry out a guided research project"
    zh: "在指导下完成一项研究"
    zh-TW: "在指導下完成一項研究"
    ja: "指導のもとで研究課題を進める"
    ko: "지도를 받으며 연구 과제 수행하기"
    vi: "Thực hiện một dự án nghiên cứu có hướng dẫn"
    ms: "Menjalankan projek penyelidikan berpandu"
    id: "Menjalankan proyek riset terbimbing"
    hi: "मार्गदर्शन में एक रिसर्च प्रोजेक्ट पूरा करना"
  - en: "Weigh published work, patents and standards"
    zh: "评估已发表研究、专利和标准"
    zh-TW: "評估已發表研究、專利與標準"
    ja: "既存の研究・特許・規格を評価する"
    ko: "발표된 연구, 특허, 표준 평가하기"
    vi: "Đánh giá công trình đã công bố, bằng sáng chế và tiêu chuẩn"
    ms: "Menilai kajian terbitan, paten dan piawaian"
    id: "Menilai riset terbitan, paten, dan standar"
    hi: "प्रकाशित शोध, पेटेंट और मानकों का आकलन"
  - en: "Report results in writing and a short talk"
    zh: "用报告和简短演讲呈现结果"
    zh-TW: "用報告和簡短簡報呈現結果"
    ja: "結果をレポートと短い発表で伝える"
    ko: "보고서와 짧은 발표로 결과 전달하기"
    vi: "Trình bày kết quả qua báo cáo và bài nói ngắn"
    ms: "Melaporkan hasil secara bertulis dan pembentangan ringkas"
    id: "Melaporkan hasil lewat laporan dan presentasi singkat"
    hi: "नतीजे रिपोर्ट और छोटी प्रस्तुति में बताना"
