code: MGMT30013
year: 2026
learn:
  en: "How firms build an edge over rivals: reading the industry, choosing a market position and managing change."
  zh: "企业如何胜过对手：分析行业、选择市场定位和管理变革。"
  zh-TW: "企業如何勝過對手：分析產業、選擇市場定位和管理變革。"
  ja: "企業が競合に勝つ方法：業界の分析、市場での立ち位置の選択、変革の管理。"
  ko: "기업이 경쟁 우위를 만드는 법: 산업 분석, 시장 포지션 선택, 변화 관리."
  vi: "Doanh nghiệp tạo lợi thế trước đối thủ: phân tích ngành, chọn vị thế thị trường và quản lý thay đổi."
  ms: "Cara firma mendapat kelebihan atas pesaing: baca industri, pilih kedudukan pasaran dan urus perubahan."
  id: "Cara perusahaan unggul dari pesaing: membaca industri, memilih posisi pasar, dan mengelola perubahan."
  hi: "कंपनियाँ प्रतिद्वंद्वियों से आगे कैसे निकलती हैं: इंडस्ट्री समझना, बाज़ार में जगह चुनना और बदलाव संभालना।"
outcomes:
  - en: "Analyse the competitive environment a firm faces"
    zh: "分析企业面对的竞争环境"
    zh-TW: "分析企業面對的競爭環境"
    ja: "企業を取り巻く競争環境を分析する"
    ko: "기업이 처한 경쟁 환경 분석하기"
    vi: "Phân tích môi trường cạnh tranh của doanh nghiệp"
    ms: "Analisis persekitaran persaingan yang dihadapi firma"
    id: "Menganalisis lingkungan persaingan perusahaan"
    hi: "किसी कंपनी के प्रतिस्पर्धी माहौल का विश्लेषण"
  - en: "Weigh up a firm's strategy choices"
    zh: "评估企业的战略选择"
    zh-TW: "評估企業的策略選擇"
    ja: "企業の戦略上の選択肢を評価する"
    ko: "기업의 전략 선택지 평가하기"
    vi: "Đánh giá các lựa chọn chiến lược của doanh nghiệp"
    ms: "Nilai pilihan strategi sesebuah firma"
    id: "Menimbang pilihan strategi perusahaan"
    hi: "कंपनी के रणनीतिक विकल्प परखना"
  - en: "Link HR and organisational change to advantage"
    zh: "把人力资源和组织变革与竞争优势联系起来"
    zh-TW: "把人力資源和組織變革與競爭優勢連結起來"
    ja: "人事と組織変革を競争優位につなげて考える"
    ko: "인사와 조직 변화를 경쟁 우위와 연결하기"
    vi: "Liên hệ nhân sự và thay đổi tổ chức với lợi thế"
    ms: "Kaitkan HR dan perubahan organisasi dengan kelebihan"
    id: "Mengaitkan SDM dan perubahan organisasi dengan keunggulan"
    hi: "HR और संगठनात्मक बदलाव को बढ़त से जोड़ना"
