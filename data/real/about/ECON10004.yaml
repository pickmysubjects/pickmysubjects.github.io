code: ECON10004
year: 2026
learn:
  en: "How markets, firms and governments decide on prices and use limited resources."
  zh: "市场、企业和政府怎么定价、分配有限的资源。"
  zh-TW: "市場、企業和政府怎麼定價、分配有限的資源。"
  ja: "市場・企業・政府がどう価格を決め、限られた資源を使うか。"
  ko: "시장, 기업, 정부가 가격을 정하고 한정된 자원을 쓰는 방식."
  vi: "Thị trường, doanh nghiệp và chính phủ định giá và dùng nguồn lực hạn chế ra sao."
  ms: "Cara pasaran, firma dan kerajaan menetapkan harga dan guna sumber terhad."
  id: "Cara pasar, perusahaan, dan pemerintah menentukan harga dan memakai sumber daya terbatas."
  hi: "बाज़ार, कंपनियाँ और सरकारें कीमतें कैसे तय करती हैं और सीमित संसाधन कैसे बाँटती हैं।"
outcomes:
  - en: "Use supply and demand to explain prices"
    zh: "用供需解释价格"
    zh-TW: "用供需解釋價格"
    ja: "需要と供給で価格を説明する"
    ko: "수요와 공급으로 가격 설명"
    vi: "Dùng cung cầu để giải thích giá"
    ms: "Guna penawaran dan permintaan untuk terangkan harga"
    id: "Menjelaskan harga dengan penawaran dan permintaan"
    hi: "मांग-आपूर्ति से कीमतें समझाना"
  - en: "Judge when government intervention helps"
    zh: "判断政府干预什么时候有用"
    zh-TW: "判斷政府介入什麼時候有用"
    ja: "政府の介入が役立つ場面を判断する"
    ko: "정부 개입이 도움이 되는 경우 판단"
    vi: "Đánh giá khi nào can thiệp của chính phủ có ích"
    ms: "Nilai bila campur tangan kerajaan membantu"
    id: "Menilai kapan intervensi pemerintah membantu"
    hi: "तय करना कि सरकारी दखल कब मदद करता है"
  - en: "Analyse strategic choices with game theory"
    zh: "用博弈论分析策略选择"
    zh-TW: "用賽局理論分析策略選擇"
    ja: "ゲーム理論で戦略的な選択を分析する"
    ko: "게임 이론으로 전략적 선택 분석"
    vi: "Phân tích lựa chọn chiến lược bằng lý thuyết trò chơi"
    ms: "Analisis pilihan strategik dengan teori permainan"
    id: "Menganalisis pilihan strategis dengan teori permainan"
    hi: "गेम थ्योरी से रणनीतिक फ़ैसलों का विश्लेषण"
