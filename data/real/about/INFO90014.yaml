code: INFO90014
year: 2027
learn:
  en: "Core theory and industry methods for user-centred design: user research, usability, prototyping and evaluation."
  zh: "以用户为中心的设计：用户研究、可用性、原型与评估的理论和行业方法。"
  zh-TW: "以使用者為中心的設計：使用者研究、易用性、原型與評估的理論和業界方法。"
  ja: "ユーザー中心設計の理論と手法：ユーザー調査、ユーザビリティ、試作、評価。"
  ko: "사용자 중심 설계의 이론과 실무 방법: 사용자 조사, 사용성, 프로토타입, 평가."
  vi: "Lý thuyết và phương pháp thiết kế lấy người dùng làm trung tâm: nghiên cứu, khả dụng, nguyên mẫu, đánh giá."
  ms: "Teori dan kaedah industri reka bentuk berpusatkan pengguna: kajian pengguna, kebolehgunaan, prototaip, penilaian."
  id: "Teori dan metode industri desain berpusat pengguna: riset pengguna, usability, prototipe, evaluasi."
  hi: "यूज़र-केंद्रित डिज़ाइन के सिद्धांत और तरीके: यूज़र रिसर्च, उपयोगिता, प्रोटोटाइप, मूल्यांकन।"
outcomes:
  - en: "Use interviews and observation to understand user needs"
    zh: "用访谈和观察了解用户需求"
    zh-TW: "用訪談與觀察了解使用者需求"
    ja: "インタビューや観察でユーザーのニーズを知る"
    ko: "인터뷰와 관찰로 사용자 요구 파악하기"
    vi: "Dùng phỏng vấn và quan sát để hiểu nhu cầu người dùng"
    ms: "Menggunakan temu bual dan pemerhatian untuk faham keperluan pengguna"
    id: "Memakai wawancara dan observasi untuk memahami pengguna"
    hi: "इंटरव्यू और अवलोकन से यूज़र की ज़रूरतें समझना"
  - en: "Apply design principles to judge an interface"
    zh: "运用设计原则评判界面"
    zh-TW: "運用設計原則評估介面"
    ja: "設計原則でUIを評価する"
    ko: "디자인 원칙으로 인터페이스 평가하기"
    vi: "Áp dụng nguyên tắc thiết kế để đánh giá giao diện"
    ms: "Menggunakan prinsip reka bentuk untuk menilai antara muka"
    id: "Menerapkan prinsip desain untuk menilai antarmuka"
    hi: "डिज़ाइन सिद्धांतों से इंटरफ़ेस का आकलन करना"
