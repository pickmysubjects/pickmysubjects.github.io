code: MUSI20224
year: 2026
learn:
  en: "How gender shapes music-making and listening, explored through historical and cross-cultural case studies. Not offered in 2026."
  zh: "性别如何影响音乐创作与聆听，透过历史与跨文化案例探讨。2026年不开。"
  zh-TW: "性別如何影響音樂創作與聆聽，透過歷史與跨文化案例探討。2026年不開。"
  ja: "ジェンダーが音楽の実践と聴取をどう形づくるか、歴史・異文化の事例で考える。2026年休講。"
  ko: "젠더가 음악 활동과 감상을 어떻게 형성하는지 사례로 탐구. 2026년 미개설."
  vi: "Giới ảnh hưởng thế nào đến làm nhạc và nghe nhạc, qua ví dụ lịch sử và đa văn hóa. Không mở 2026."
  ms: "Bagaimana gender membentuk amalan dan pendengaran muzik, melalui kajian kes. Tiada pada 2026."
  id: "Bagaimana gender membentuk praktik dan cara mendengar musik, lewat studi kasus. Tidak dibuka 2026."
  hi: "जेंडर संगीत बनाने और सुनने को कैसे बदलता है, ऐतिहासिक और अंतर-सांस्कृतिक उदाहरणों से। 2026 में नहीं।"
outcomes:
  - en: "Explain how gender shapes musical practice"
    zh: "说明性别如何影响音乐实践"
    zh-TW: "說明性別如何影響音樂實踐"
    ja: "ジェンダーが音楽実践に与える影響を説明する"
    ko: "젠더가 음악 실천에 미치는 영향 설명"
    vi: "Giải thích giới định hình thực hành âm nhạc"
    ms: "Terangkan cara gender membentuk amalan muzik"
    id: "Menjelaskan pengaruh gender pada praktik musik"
    hi: "जेंडर संगीत अभ्यास को कैसे गढ़ता है, बताना"
  - en: "Read research critically and respond in writing"
    zh: "批判性阅读研究并书面回应"
    zh-TW: "批判性閱讀研究並書面回應"
    ja: "研究文献を批判的に読み、文章で応える"
    ko: "연구를 비판적으로 읽고 글로 답하기"
    vi: "Đọc nghiên cứu có phản biện và viết phản hồi"
    ms: "Baca kajian secara kritis dan balas secara bertulis"
    id: "Membaca riset secara kritis dan menanggapinya tertulis"
    hi: "शोध को आलोचनात्मक रूप से पढ़कर लिखित जवाब देना"
  - en: "Plan and write a research essay on music"
    zh: "规划并撰写一篇音乐研究论文"
    zh-TW: "規劃並撰寫一篇音樂研究論文"
    ja: "音楽に関する研究エッセイを計画し書く"
    ko: "음악에 관한 연구 에세이 기획·작성하기"
    vi: "Lên kế hoạch và viết bài luận nghiên cứu về âm nhạc"
    ms: "Rancang dan tulis esei kajian tentang muzik"
    id: "Merancang dan menulis esai riset tentang musik"
    hi: "संगीत पर शोध निबंध की योजना बनाकर लिखना"
