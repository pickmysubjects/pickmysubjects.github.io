code: JAPN30006
year: 2026
learn:
  en: "Japanese for students who finished Japanese 7: reading real texts and discussing social and cultural topics."
  zh: "适合学完日语 7的学生：阅读真实材料，讨论社会和文化话题。"
  zh-TW: "適合學完日語 7的學生：閱讀真實材料，討論社會和文化話題。"
  ja: "日本語7を終えた学生向け。生の文章を読み、社会や文化の話題を話し合う。"
  ko: "일본어 7을(를) 마친 학생 대상. 실제 자료를 읽고 사회·문화 주제를 토론한다."
  vi: "tiếng Nhật cho sinh viên đã học xong tiếng Nhật 7: đọc tài liệu thật và thảo luận chủ đề xã hội, văn hóa."
  ms: "bahasa Jepun untuk pelajar yang sudah tamat bahasa Jepun 7: membaca teks sebenar dan membincangkan topik sosial dan budaya."
  id: "bahasa Jepang untuk mahasiswa yang sudah lulus bahasa Jepang 7: membaca teks asli dan membahas topik sosial dan budaya."
  hi: "जापानी 7 पूरा कर चुके छात्रों के लिए जापानी: असली पाठ पढ़ना और सामाजिक व सांस्कृतिक विषयों पर चर्चा।"
outcomes:
  - en: "Discuss social and cultural topics in Japanese"
    zh: "用日语讨论社会和文化话题"
    zh-TW: "用日語討論社會和文化話題"
    ja: "社会や文化の話題を日本語で話し合う"
    ko: "사회·문화 주제를 일본어로 토론하기"
    vi: "Thảo luận chủ đề xã hội, văn hóa bằng tiếng Nhật"
    ms: "Bincangkan topik sosial dan budaya dalam bahasa Jepun"
    id: "Membahas topik sosial dan budaya dalam bahasa Jepang"
    hi: "सामाजिक और सांस्कृतिक विषयों पर जापानी में चर्चा करना"
  - en: "Read and write longer Japanese texts"
    zh: "读写较长的日语文章"
    zh-TW: "讀寫較長的日語文章"
    ja: "長めの日本語の文章を読み書きする"
    ko: "긴 일본어 글 읽고 쓰기"
    vi: "Đọc và viết văn bản tiếng Nhật dài hơn"
    ms: "Baca dan tulis teks bahasa Jepun yang lebih panjang"
    id: "Membaca dan menulis teks bahasa Jepang yang lebih panjang"
    hi: "लंबे जापानी पाठ पढ़ना-लिखना"
  - en: "Give a clear presentation in Japanese"
    zh: "用日语做清楚的口头报告"
    zh-TW: "用日語做清楚的口頭報告"
    ja: "日本語で分かりやすく発表する"
    ko: "일본어로 명확하게 발표하기"
    vi: "Thuyết trình rõ ràng bằng tiếng Nhật"
    ms: "Buat pembentangan yang jelas dalam bahasa Jepun"
    id: "Melakukan presentasi yang jelas dalam bahasa Jepang"
    hi: "जापानी में स्पष्ट प्रस्तुति देना"
