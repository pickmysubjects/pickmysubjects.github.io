code: FREN30018
year: 2026
learn:
  en: "A three-week online intensive on Renaissance France, centred on the castles of the Loire Valley."
  zh: "为期三周的线上密集课：以卢瓦尔河谷城堡为中心的文艺复兴时期法国。"
  zh-TW: "為期三週的線上密集課：以羅亞爾河谷城堡為中心的文藝復興時期法國。"
  ja: "ロワール渓谷の城を中心に、ルネサンス期のフランスを学ぶ3週間のオンライン集中科目。"
  ko: "루아르 계곡의 성을 중심으로 르네상스 시대 프랑스를 배우는 3주 온라인 집중 과목."
  vi: "Khóa trực tuyến cấp tốc ba tuần về nước Pháp thời Phục Hưng, xoay quanh các lâu đài thung lũng Loire."
  ms: "Kursus intensif dalam talian tiga minggu tentang Perancis zaman Renaissance, berpusat di Lembah Loire."
  id: "Kursus intensif daring tiga minggu tentang Prancis masa Renaisans, berpusat pada kastel Lembah Loire."
  hi: "लोआर घाटी के महलों पर केंद्रित, पुनर्जागरण कालीन फ़्रांस पर तीन हफ़्ते का ऑनलाइन गहन कोर्स।"
outcomes:
  - en: "Describe Renaissance life in the Loire Valley"
    zh: "描述卢瓦尔河谷的文艺复兴生活"
    zh-TW: "描述羅亞爾河谷的文藝復興生活"
    ja: "ロワール渓谷のルネサンス期の暮らしを説明する"
    ko: "루아르 계곡의 르네상스 생활 설명하기"
    vi: "Mô tả đời sống thời Phục Hưng ở thung lũng Loire"
    ms: "Huraikan kehidupan Renaissance di Lembah Loire"
    id: "Menjelaskan kehidupan Renaisans di Lembah Loire"
    hi: "लोआर घाटी में पुनर्जागरण जीवन का वर्णन करना"
  - en: "Link art and buildings to their history"
    zh: "把艺术和建筑与历史联系起来"
    zh-TW: "把藝術和建築與歷史聯繫起來"
    ja: "芸術や建築を歴史と結びつける"
    ko: "예술과 건축을 역사와 연결하기"
    vi: "Liên hệ nghệ thuật và kiến trúc với lịch sử"
    ms: "Kaitkan seni dan bangunan dengan sejarah"
    id: "Mengaitkan seni dan bangunan dengan sejarahnya"
    hi: "कला और इमारतों को उनके इतिहास से जोड़ना"
  - en: "Present a short project in French"
    zh: "用法语展示一个小项目"
    zh-TW: "用法語展示一個小項目"
    ja: "フランス語で短い課題を発表する"
    ko: "프랑스어로 짧은 프로젝트 발표하기"
    vi: "Trình bày một dự án ngắn bằng tiếng Pháp"
    ms: "Bentangkan projek ringkas dalam bahasa Perancis"
    id: "Mempresentasikan proyek singkat dalam bahasa Prancis"
    hi: "फ़्रेंच में एक छोटा प्रोजेक्ट प्रस्तुत करना"
