code: MUSI30298
year: 2027
learn:
  en: "Individual lessons to refine your technique, style and interpretation through exercises and repertoire on a personal program."
  zh: "个别辅导，按个人计划通过练习和曲目打磨技巧、风格和诠释。"
  zh-TW: "個別指導，依個人計畫透過練習和曲目琢磨技巧、風格和詮釋。"
  ja: "個人レッスンで、個別プログラムの練習と曲を通じて技術・スタイル・解釈を磨く。"
  ko: "개인 레슨으로 개인 프로그램의 연습과 레퍼토리를 통해 테크닉, 스타일, 해석 다듬기."
  vi: "Học riêng để trau chuốt kỹ thuật, phong cách và cách diễn giải qua bài tập và tiết mục theo chương trình cá nhân."
  ms: "Kelas individu untuk memperhalus teknik, gaya dan tafsiran melalui latihan dan repertoir mengikut program peribadi."
  id: "Les individual untuk mengasah teknik, gaya, dan interpretasi lewat latihan dan repertoar sesuai program pribadi."
  hi: "व्यक्तिगत कक्षाओं में निजी कार्यक्रम के अभ्यास व रिपर्टॉयर से तकनीक, शैली और व्याख्या निखारना।"
outcomes:
  - en: "Keep consistent technical control and focus"
    zh: "保持稳定的技术控制和专注"
    zh-TW: "保持穩定的技術控制和專注"
    ja: "安定した技術コントロールと集中を保つ"
    ko: "일관된 기술 통제와 집중력 유지하기"
    vi: "Duy trì kiểm soát kỹ thuật và tập trung ổn định"
    ms: "Kekalkan kawalan teknik dan tumpuan yang konsisten"
    id: "Menjaga kontrol teknik dan fokus yang konsisten"
    hi: "लगातार तकनीकी नियंत्रण और एकाग्रता बनाए रखना"
  - en: "Develop a varied, expressive sound"
    zh: "发出多变且有表现力的声音"
    zh-TW: "發出多變且有表現力的聲音"
    ja: "変化に富んだ表情豊かな音をつくる"
    ko: "다채롭고 표현력 있는 소리 만들기"
    vi: "Phát triển âm thanh đa dạng, giàu biểu cảm"
    ms: "Bangunkan bunyi yang pelbagai dan ekspresif"
    id: "Mengembangkan suara yang beragam dan ekspresif"
    hi: "विविध और भावपूर्ण ध्वनि विकसित करना"
  - en: "Perform with confidence and professional manner"
    zh: "自信、专业地演奏"
    zh-TW: "自信、專業地演奏"
    ja: "自信とプロらしい態度で演奏する"
    ko: "자신감 있고 프로답게 연주하기"
    vi: "Biểu diễn tự tin và chuyên nghiệp"
    ms: "Membuat persembahan dengan yakin dan profesional"
    id: "Tampil dengan percaya diri dan profesional"
    hi: "आत्मविश्वास और पेशेवर ढंग से प्रस्तुति देना"
