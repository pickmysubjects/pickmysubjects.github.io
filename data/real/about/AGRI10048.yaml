code: AGRI10048
year: 2026
learn:
  en: "Australian crop, pasture and horticulture industries, and what drives their yield and sustainability."
  zh: "澳大利亚作物、牧草与园艺产业，以及影响其产量和可持续性的因素。"
  zh-TW: "澳洲作物、牧草與園藝產業，以及影響其產量和永續性的因素。"
  ja: "オーストラリアの作物・牧草・園芸産業と、収量や持続可能性を左右する要因。"
  ko: "호주의 작물·목초·원예 산업과 수확량·지속가능성을 좌우하는 요인."
  vi: "Ngành trồng trọt, đồng cỏ và làm vườn ở Úc cùng các yếu tố quyết định năng suất và bền vững."
  ms: "Industri tanaman, padang ragut dan hortikultur Australia serta faktor hasil dan kelestariannya."
  id: "Industri tanaman, padang rumput dan hortikultura Australia serta faktor hasil dan keberlanjutannya."
  hi: "ऑस्ट्रेलिया के फसल, चारागाह और बागवानी उद्योग, और उनकी उपज व स्थिरता को प्रभावित करने वाले कारक।"
outcomes:
  - en: "Explain how Australian farm industries operate"
