    vi: "Giải thích cách ngành nông nghiệp Úc vận hành"
    ms: "Terangkan operasi industri pertanian Australia"
    id: "Menjelaskan cara kerja industri pertanian Australia"
    hi: "ऑस्ट्रेलियाई कृषि उद्योग कैसे चलते हैं, समझाएँ"
  - en: "Identify ecology behind crop and pasture systems"
    zh: "识别作物与牧草系统的生态原理"
    zh-TW: "辨識作物與牧草系統的生態原理"
    ja: "作物・牧草システムの生態原理を見極める"
