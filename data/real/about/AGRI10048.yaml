    ja: "乾燥地と灌漑の生産を比較する"
    ko: "건조지 농업과 관개 농업을 비교한다"
    vi: "Cân nhắc sản xuất khô hạn và có tưới"
    ms: "Bandingkan pengeluaran tanah kering dan berpengairan"
