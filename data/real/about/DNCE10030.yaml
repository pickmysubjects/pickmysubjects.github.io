code: DNCE10030
year: 2026
learn:
  en: "Daily studio training in contemporary dance technique, improvisation and partnering, ending in a practical exam."
  zh: "每日的现代舞技术、即兴与双人练习，期末有实操考试。"
  zh-TW: "每日的現代舞技術、即興與雙人練習，期末有實作考試。"
  ja: "コンテンポラリーダンスの技術・即興・パートナリングを毎日訓練し、最後に実技試験。"
  ko: "현대무용 테크닉, 즉흥, 파트너링을 매일 훈련하고 실기 시험으로 마무리한다."
  vi: "Tập hằng ngày kỹ thuật múa đương đại, ứng tác và múa đôi, kết thúc bằng thi thực hành."
  ms: "Latihan studio harian teknik tarian kontemporari, improvisasi dan berpasangan, diakhiri ujian amali."
  id: "Latihan studio harian teknik tari kontemporer, improvisasi dan berpasangan, diakhiri ujian praktik."
  hi: "कंटेम्पररी डांस तकनीक, इम्प्रोवाइज़ेशन और पार्टनरिंग की रोज़ाना ट्रेनिंग, अंत में प्रैक्टिकल परीक्षा।"
outcomes:
  - en: "Perform set phrases with control and clarity"
    zh: "有控制、清晰地完成规定组合"
    zh-TW: "有控制、清晰地完成規定組合"
    ja: "決められたフレーズを正確に踊る"
    ko: "정해진 프레이즈를 정확히 수행하기"
    vi: "Thể hiện các đoạn múa mẫu chính xác, rõ ràng"
    ms: "Persembahkan frasa tetap dengan kawalan"
    id: "Menarikan frasa baku dengan terkontrol"
    hi: "तय फ़्रेज़ को नियंत्रण और स्पष्टता से करना"
  - en: "Build a broad vocabulary of movement"
    zh: "积累丰富的动作语汇"
    zh-TW: "累積豐富的動作語彙"
    ja: "幅広い動きの語彙を身につける"
    ko: "폭넓은 움직임 어휘 쌓기"
    vi: "Mở rộng vốn từ vựng chuyển động"
    ms: "Bina perbendaharaan gerak yang luas"
    id: "Membangun kosakata gerak yang luas"
    hi: "गति की व्यापक शब्दावली बनाना"
  - en: "Document and reflect on your own training"
    zh: "记录并反思自己的训练"
    zh-TW: "記錄並反思自己的訓練"
    ja: "自分の訓練を記録し振り返る"
    ko: "자신의 훈련을 기록하고 성찰하기"
    vi: "Ghi chép và suy ngẫm việc tập của mình"
    ms: "Dokumen dan renung latihan sendiri"
    id: "Mendokumentasikan dan merefleksikan latihan sendiri"
    hi: "अपनी ट्रेनिंग का दस्तावेज़ और चिंतन"
