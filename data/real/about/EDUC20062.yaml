code: EDUC20062
year: 2026
learn:
  en: "How young people use visual art, music and drama to shape who they are, through hands-on arts activities and a site visit."
  zh: "年轻人如何通过视觉艺术、音乐和戏剧塑造自我认同，含实践活动和参观。"
  zh-TW: "年輕人如何透過視覺藝術、音樂和戲劇形塑自我認同，含實作活動和參訪。"
  ja: "若者が美術・音楽・演劇で自分らしさをどう形づくるか。実践活動と見学あり。"
  ko: "청소년이 미술·음악·연극으로 정체성을 만드는 방식. 실습 활동과 현장 견학 포함."
  vi: "Giới trẻ dùng mỹ thuật, âm nhạc và kịch để định hình bản thân ra sao, qua hoạt động thực hành và tham quan."
  ms: "Cara anak muda menggunakan seni visual, muzik dan drama untuk membentuk identiti, melalui aktiviti seni dan lawatan."
  id: "Cara anak muda memakai seni rupa, musik dan drama untuk membentuk jati diri, lewat kegiatan seni dan kunjungan."
  hi: "युवा कैसे दृश्य कला, संगीत और नाटक से अपनी पहचान बनाते हैं, व्यावहारिक गतिविधियों और भ्रमण के साथ।"
outcomes:
  - en: "Explain current social and cultural theories of youth"
    zh: "解释关于青年的当代社会文化理论"
    zh-TW: "解釋關於青年的當代社會文化理論"
    ja: "若者に関する現代の社会文化理論を説明する"
    ko: "청소년에 관한 현대 사회문화 이론 설명하기"
    vi: "Giải thích các lý thuyết văn hóa xã hội hiện đại về giới trẻ"
    ms: "Menerangkan teori sosial budaya semasa tentang belia"
    id: "Menjelaskan teori sosial budaya terkini tentang kaum muda"
    hi: "युवाओं पर वर्तमान सामाजिक-सांस्कृतिक सिद्धांत समझाना"
  - en: "Make and respond to art as a maker or audience"
    zh: "以创作者或观众身份创作和回应艺术"
    zh-TW: "以創作者或觀眾身分創作和回應藝術"
    ja: "作り手や観客として芸術を作り、応答する"
    ko: "창작자나 관객으로서 예술을 만들고 반응하기"
    vi: "Sáng tác và cảm nhận nghệ thuật với vai trò người làm hoặc khán giả"
    ms: "Menghasilkan dan menanggapi seni sebagai pencipta atau penonton"
    id: "Berkarya dan menanggapi seni sebagai pembuat atau penonton"
    hi: "कलाकार या दर्शक के रूप में कला बनाना और उस पर प्रतिक्रिया देना"
  - en: "Analyse how youth use arts and digital media for identity"
    zh: "分析年轻人如何用艺术和数字媒体表达自我"
    zh-TW: "分析年輕人如何用藝術和數位媒體表達自我"
    ja: "若者が芸術とデジタルメディアで自己を表す方法を分析する"
    ko: "청소년이 예술과 디지털 미디어로 정체성을 표현하는 방식 분석하기"
    vi: "Phân tích cách giới trẻ dùng nghệ thuật và truyền thông số để thể hiện bản thân"
    ms: "Menganalisis cara belia guna seni dan media digital untuk identiti"
    id: "Menganalisis cara kaum muda memakai seni dan media digital untuk jati diri"
    hi: "युवा पहचान के लिए कला और डिजिटल मीडिया का उपयोग कैसे करते हैं, इसका विश्लेषण"
