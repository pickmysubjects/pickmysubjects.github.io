code: PHIL10002
year: 2026
learn:
  en: "An introduction to philosophy through big questions like truth, right and wrong, justice, free will and personal identity."
  zh: "通过几个大问题入门哲学：真理、对与错、正义、自由意志，以及“我是谁”。"
  zh-TW: "透過幾個大問題入門哲學：真理、對與錯、正義、自由意志，以及「我是誰」。"
  ja: "真理、善悪、正義、自由意志、自分とは何か、といった大きな問いから入る哲学入門。"
  ko: "진리, 옳고 그름, 정의, 자유의지, 나는 누구인가 같은 큰 질문으로 시작하는 철학 입문."
  vi: "Nhập môn triết học qua những câu hỏi lớn: chân lý, đúng sai, công bằng, ý chí tự do và bản thân là ai."
  ms: "Pengenalan falsafah melalui soalan besar seperti kebenaran, betul dan salah, keadilan, kehendak bebas dan identiti diri."
  id: "Pengantar filsafat lewat pertanyaan besar seperti kebenaran, benar dan salah, keadilan, kehendak bebas, dan jati diri."
  hi: "सत्य, सही-गलत, न्याय, स्वतंत्र इच्छा और 'मैं कौन हूँ' जैसे बड़े सवालों से दर्शनशास्त्र की शुरुआत।"
outcomes:
  - en: "Explain how modern philosophers answer the big questions"
    zh: "说明现代哲学家怎么回答这些大问题"
    zh-TW: "說明現代哲學家怎麼回答這些大問題"
    ja: "現代の哲学者が大きな問いにどう答えているか説明する"
    ko: "현대 철학자들이 큰 질문에 어떻게 답하는지 설명하기"
    vi: "Giải thích cách các triết gia hiện đại trả lời câu hỏi lớn"
    ms: "Terangkan cara ahli falsafah moden menjawab soalan besar"
    id: "Menjelaskan cara filsuf modern menjawab pertanyaan besar"
    hi: "समझाना कि आधुनिक दार्शनिक बड़े सवालों का जवाब कैसे देते हैं"
  - en: "Spot weak points in an argument"
    zh: "找出论证中的薄弱环节"
    zh-TW: "找出論證中的薄弱環節"
    ja: "議論の弱いところを見つける"
    ko: "논증의 약점 찾아내기"
    vi: "Nhận ra điểm yếu trong một lập luận"
    ms: "Kenal pasti kelemahan dalam sesuatu hujah"
    id: "Menemukan titik lemah dalam argumen"
    hi: "किसी तर्क की कमज़ोरियाँ पहचानना"
  - en: "Form and defend your own philosophical view"
    zh: "形成并捍卫你自己的哲学观点"
    zh-TW: "形成並捍衛你自己的哲學觀點"
    ja: "自分の哲学的な立場を持ち、それを擁護する"
    ko: "자신의 철학적 견해를 세우고 옹호하기"
    vi: "Hình thành và bảo vệ quan điểm triết học của mình"
    ms: "Bentuk dan pertahankan pandangan falsafah sendiri"
    id: "Membentuk dan membela pandangan filsafat sendiri"
    hi: "अपना दार्शनिक नज़रिया बनाना और उसका बचाव करना"
