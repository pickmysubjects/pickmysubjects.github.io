code: MULT30021
year: 2026
learn:
  en: "An 80 to 100 hour volunteer placement with a not-for-profit overseas, learning how community development works."
  zh: "在海外非营利机构做80到100小时志愿服务，了解社区发展是怎么做的。"
  zh-TW: "在海外非營利機構做80到100小時志工服務，了解社區發展是怎麼做的。"
  ja: "海外の非営利団体で80〜100時間ボランティアをし、地域開発の実際を学ぶ。"
  ko: "해외 비영리 단체에서 80~100시간 봉사하며 지역 개발이 어떻게 이뤄지는지 배운다."
  vi: "Tình nguyện 80–100 giờ tại một tổ chức phi lợi nhuận ở nước ngoài, tìm hiểu cách phát triển cộng đồng."
  ms: "Penempatan sukarelawan 80 hingga 100 jam dengan badan bukan untung di luar negara, belajar cara pembangunan komuniti berjalan."
  id: "Relawan 80 sampai 100 jam di organisasi nirlaba luar negeri, belajar cara kerja pembangunan masyarakat."
  hi: "विदेश में किसी गैर-लाभकारी संस्था के साथ 80 से 100 घंटे का स्वयंसेवा, यह सीखते हुए कि सामुदायिक विकास कैसे होता है।"
outcomes:
  - en: "Explain key issues in international community development"
    zh: "说明国际社区发展的关键问题"
    zh-TW: "說明國際社區發展的關鍵問題"
    ja: "国際的な地域開発の主な課題を説明する"
    ko: "국제 지역 개발의 핵심 쟁점 설명하기"
    vi: "Giải thích các vấn đề chính của phát triển cộng đồng quốc tế"
    ms: "Terangkan isu utama pembangunan komuniti antarabangsa"
    id: "Menjelaskan isu utama pembangunan masyarakat internasional"
    hi: "अंतरराष्ट्रीय सामुदायिक विकास के मुख्य मुद्दे समझाना"
  - en: "Contribute to a real community project"
    zh: "为一个真实的社区项目出力"
    zh-TW: "為一個真實的社區專案出力"
    ja: "実際の地域プロジェクトに貢献する"
    ko: "실제 지역 사회 프로젝트에 기여하기"
    vi: "Đóng góp cho một dự án cộng đồng thật"
    ms: "Menyumbang kepada projek komuniti sebenar"
    id: "Berkontribusi pada proyek masyarakat nyata"
    hi: "किसी असली सामुदायिक प्रोजेक्ट में योगदान देना"
  - en: "Work in a culturally aware and respectful way"
    zh: "以尊重、有文化意识的方式工作"
    zh-TW: "以尊重、有文化意識的方式工作"
    ja: "文化に配慮し、敬意をもって活動する"
    ko: "문화를 이해하고 존중하는 방식으로 일하기"
    vi: "Làm việc tôn trọng và nhạy bén về văn hóa"
    ms: "Bekerja dengan peka dan hormat terhadap budaya"
    id: "Bekerja dengan peka dan menghormati budaya setempat"
    hi: "सांस्कृतिक समझ और सम्मान के साथ काम करना"
