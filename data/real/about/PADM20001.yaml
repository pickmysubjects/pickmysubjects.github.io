code: PADM20001
year: 2027
learn:
  en: "How governments use digital tools, online services and data, and the ethical, legal and policy issues this raises."
  zh: "政府如何使用数字工具、在线服务和数据，以及由此带来的伦理、法律和政策问题。"
  zh-TW: "政府如何使用數位工具、線上服務和資料，以及由此帶來的倫理、法律和政策問題。"
  ja: "政府がデジタルツールやオンラインサービス、データをどう使うか、そこから生じる倫理・法・政策の問題。"
  ko: "정부가 디지털 도구, 온라인 서비스, 데이터를 쓰는 방식과 그로 인한 윤리·법·정책 문제."
  vi: "Cách chính phủ dùng công cụ số, dịch vụ trực tuyến và dữ liệu, cùng các vấn đề đạo đức, pháp lý và chính sách nảy sinh."
  ms: "Cara kerajaan guna alat digital, perkhidmatan dalam talian dan data, serta isu etika, undang-undang dan dasar yang timbul."
  id: "Cara pemerintah memakai alat digital, layanan online, dan data, serta isu etika, hukum, dan kebijakan yang muncul."
  hi: "सरकारें डिजिटल टूल, ऑनलाइन सेवाओं व डेटा का कैसे उपयोग करती हैं और इससे जुड़े नैतिक, कानूनी व नीतिगत मुद्दे।"
outcomes:
  - en: "Critique real examples of digital government"
    zh: "评析国内外数字政府的真实案例"
    zh-TW: "評析國內外數位政府的真實案例"
    ja: "デジタル政府の実例を批評する"
    ko: "디지털 정부의 실제 사례 비평하기"
    vi: "Phân tích phê phán ví dụ thực tế về chính phủ số"
    ms: "Kritik contoh sebenar kerajaan digital"
    id: "Mengkritisi contoh nyata pemerintahan digital"
    hi: "डिजिटल सरकार के वास्तविक उदाहरणों की समीक्षा"
  - en: "Weigh the opportunities and risks of government tech"
    zh: "权衡政府技术的机遇与风险"
    zh-TW: "權衡政府科技的機會與風險"
    ja: "政府の技術の機会とリスクを比べる"
    ko: "정부 기술의 기회와 위험 따져보기"
    vi: "Cân nhắc cơ hội và rủi ro của công nghệ trong chính phủ"
    ms: "Timbang peluang dan risiko teknologi kerajaan"
    id: "Menimbang peluang dan risiko teknologi pemerintah"
    hi: "सरकारी तकनीक के अवसर और जोखिम तौलना"
  - en: "Turn research into policy recommendations"
    zh: "把学术知识转化为政策建议"
    zh-TW: "把學術知識轉化為政策建議"
    ja: "学術的知識を政策提言にする"
    ko: "학술 지식을 정책 제안으로 바꾸기"
    vi: "Biến kiến thức học thuật thành khuyến nghị chính sách"
    ms: "Tukar ilmu akademik kepada cadangan dasar"
    id: "Mengubah pengetahuan akademik menjadi rekomendasi kebijakan"
    hi: "शैक्षणिक ज्ञान को नीति सुझावों में बदलना"
