code: GERM20001
year: 2026
learn:
  en: "Advanced German through myths old and new, read and watched in real texts and media, with more academic language."
  zh: "通过新旧神话学习高级德语，阅读和观看真实文本与媒体，并学习更学术的表达。"
  zh-TW: "透過新舊神話學習進階德語，閱讀和觀看真實文本與媒體，並學習更學術的表達。"
  ja: "新旧の神話を本物の文章やメディアで読み・見て、学術的な表現も含め上級ドイツ語を学ぶ。"
  ko: "옛 신화와 새 신화를 실제 글과 미디어로 읽고 보며, 학술적 표현까지 고급 독일어를 배운다."
  vi: "Tiếng Đức nâng cao qua các huyền thoại xưa và nay, đọc và xem tư liệu thật, thêm ngôn ngữ học thuật."
  ms: "Bahasa Jerman lanjutan melalui mitos lama dan baharu dalam teks dan media sebenar, dengan bahasa lebih akademik."
  id: "Bahasa Jerman lanjut lewat mitos lama dan baru dalam teks dan media asli, dengan bahasa yang lebih akademis."
  hi: "पुराने और नए मिथकों के ज़रिए उन्नत जर्मन, असली पाठ और मीडिया से, ज़्यादा अकादमिक भाषा के साथ।"
outcomes:
  - en: "Discuss social and cultural topics in German"
    zh: "用德语讨论社会和文化话题"
    zh-TW: "用德語討論社會和文化話題"
    ja: "社会や文化の話題をドイツ語で話し合う"
    ko: "사회·문화 주제를 독일어로 토론하기"
    vi: "Thảo luận chủ đề xã hội, văn hóa bằng tiếng Đức"
    ms: "Bincangkan topik sosial dan budaya dalam bahasa Jerman"
    id: "Membahas topik sosial dan budaya dalam bahasa Jerman"
    hi: "सामाजिक और सांस्कृतिक विषयों पर जर्मन में चर्चा करना"
  - en: "Read and write longer German texts"
    zh: "读写较长的德语文章"
    zh-TW: "讀寫較長的德語文章"
    ja: "長めのドイツ語の文章を読み書きする"
    ko: "긴 독일어 글 읽고 쓰기"
    vi: "Đọc và viết văn bản tiếng Đức dài hơn"
    ms: "Baca dan tulis teks bahasa Jerman yang lebih panjang"
    id: "Membaca dan menulis teks bahasa Jerman yang lebih panjang"
    hi: "लंबे जर्मन पाठ पढ़ना-लिखना"
  - en: "Give a clear presentation in German"
    zh: "用德语做清楚的口头报告"
    zh-TW: "用德語做清楚的口頭報告"
    ja: "ドイツ語で分かりやすく発表する"
    ko: "독일어로 명확하게 발표하기"
    vi: "Thuyết trình rõ ràng bằng tiếng Đức"
    ms: "Buat pembentangan yang jelas dalam bahasa Jerman"
    id: "Melakukan presentasi yang jelas dalam bahasa Jerman"
    hi: "जर्मन में स्पष्ट प्रस्तुति देना"
