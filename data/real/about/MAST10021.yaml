code: MAST10021
year: 2026
learn:
  en: "Same topics as Calculus 2, but deeper, with more focus on concepts and proofs."
  zh: "内容同微积分2，但更深入，更重概念和证明。"
  zh-TW: "內容同微積分2，但更深入，更重概念和證明。"
  ja: "微積分2と同じ内容をより深く、概念と証明を重視して学ぶ。"
  ko: "미적분 2와 같은 주제를 더 깊이, 개념과 증명에 더 집중한다."
  vi: "Cùng chủ đề với Giải tích 2 nhưng sâu hơn, chú trọng khái niệm và chứng minh."
  ms: "Topik sama seperti Kalkulus 2, tetapi lebih mendalam, lebih fokus pada konsep dan pembuktian."
  id: "Topik sama dengan Kalkulus 2, tapi lebih dalam, lebih fokus pada konsep dan pembuktian."
  hi: "कैलकुलस 2 जैसे ही विषय, पर ज़्यादा गहराई से, कॉन्सेप्ट और प्रमाण पर ज़्यादा ध्यान।"
outcomes:
  - en: "Test sequences and series for convergence"
    zh: "判断数列和级数是否收敛"
    zh-TW: "判斷數列和級數是否收斂"
    ja: "数列と級数の収束を判定する"
    ko: "수열과 급수의 수렴 판정"
    vi: "Xét sự hội tụ của dãy và chuỗi"
    ms: "Uji jujukan dan siri untuk penumpuan"
    id: "Menguji kekonvergenan barisan dan deret"
    hi: "अनुक्रम और सीरीज़ का अभिसरण जाँचना"
  - en: "Solve differential equations to model systems"
    zh: "解微分方程为系统建模"
    zh-TW: "解微分方程為系統建模"
    ja: "微分方程式を解いて系をモデル化する"
    ko: "미분방정식을 풀어 시스템 모델링"
    vi: "Giải phương trình vi phân để mô hình hóa hệ thống"
    ms: "Selesaikan persamaan pembezaan untuk memodelkan sistem"
    id: "Menyelesaikan persamaan diferensial untuk memodelkan sistem"
    hi: "सिस्टम मॉडल करने के लिए अवकल समीकरण हल करना"
  - en: "Find maxima and minima of multivariable functions"
    zh: "求多元函数的极值"
    zh-TW: "求多變數函數的極值"
    ja: "多変数関数の極大・極小を求める"
    ko: "다변수 함수의 극대·극소 구하기"
    vi: "Tìm cực đại, cực tiểu của hàm nhiều biến"
    ms: "Cari maksimum dan minimum fungsi multipemboleh ubah"
    id: "Mencari maksimum dan minimum fungsi multivariabel"
    hi: "बहुचर फ़ंक्शन के अधिकतम और न्यूनतम निकालना"
