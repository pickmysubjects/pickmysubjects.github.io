code: LAWS70469
year: 2027
learn:
  en: "Construction law for construction managers: contracts, security of payment, time and cost claims, subcontracting, insurance and disputes."
  zh: "面向建筑管理者的建筑法：合同、付款保障、工期与费用索赔、分包、保险和争议。"
  zh-TW: "面向營建管理者的營建法：合約、付款保障、工期與費用求償、分包、保險與爭議。"
  ja: "建設管理者向けの建設法：契約、支払保障、工期・費用、下請、保険、紛争。"
  ko: "건설관리자를 위한 건설법: 계약, 대금 지급 보장, 공기·비용, 하도급, 보험, 분쟁."
  vi: "Luật xây dựng cho nhà quản lý: hợp đồng, bảo đảm thanh toán, thầu phụ, bảo hiểm, tranh chấp."
  ms: "Undang-undang pembinaan: kontrak, jaminan pembayaran, subkontrak, insurans dan pertikaian."
  id: "Hukum konstruksi: kontrak, jaminan pembayaran, subkontrak, asuransi dan sengketa."
  hi: "निर्माण प्रबंधकों के लिए कानून: अनुबंध, भुगतान सुरक्षा, उप-अनुबंध, बीमा और विवाद।"
outcomes:
  - en: "Explain how contracts allocate time, cost and quality risk"
    zh: "说明合同如何分配工期、成本和质量风险"
    zh-TW: "說明合約如何分配工期、成本與品質風險"
    ja: "契約が工期・費用・品質のリスクをどう配分するか説明する"
    ko: "계약의 공기·비용·품질 위험 배분 설명하기"
    vi: "Giải thích hợp đồng phân bổ rủi ro ra sao"
    ms: "Menerangkan pembahagian risiko masa, kos dan kualiti"
    id: "Menjelaskan pembagian risiko waktu, biaya dan mutu"
    hi: "अनुबंध समय, लागत, गुणवत्ता जोखिम कैसे बाँटते हैं, समझाना"
  - en: "Describe ways to avoid and resolve disputes"
    zh: "说明避免和解决争议的方法"
    zh-TW: "說明避免與解決爭議的方法"
    ja: "紛争の予防と解決方法を説明する"
    ko: "분쟁 예방·해결 방법 설명하기"
    vi: "Mô tả cách tránh và giải quyết tranh chấp"
    ms: "Menghuraikan cara mengelak dan menyelesaikan pertikaian"
    id: "Menguraikan cara mencegah dan menyelesaikan sengketa"
    hi: "विवाद रोकने और सुलझाने के तरीके बताना"
