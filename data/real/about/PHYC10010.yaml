code: PHYC10010
year: 2026
learn:
  en: "How Indigenous cultures worldwide read the Sun, Moon and stars as calendar, map and law, alongside Western astronomy."
  zh: "世界各地原住民如何把日月星辰当作历法、地图和律法，并与西方天文学对照。"
  zh-TW: "世界各地原住民如何把日月星辰當作曆法、地圖和律法，並與西方天文學對照。"
  ja: "世界の先住民が太陽・月・星を暦や地図、掟としてどう読んできたかを、西洋天文学と比べて学ぶ。"
  ko: "세계 원주민이 해·달·별을 달력·지도·법으로 읽어 온 방식을 서양 천문학과 함께 배우기."
  vi: "Các nền văn hóa bản địa đọc Mặt Trời, Mặt Trăng, sao như lịch, bản đồ và luật lệ ra sao."
  ms: "Cara budaya Orang Asal dunia membaca matahari, bulan dan bintang sebagai kalendar, peta dan undang-undang."
  id: "Cara budaya adat dunia membaca matahari, bulan, dan bintang sebagai kalender, peta, dan hukum."
  hi: "दुनिया की आदिवासी संस्कृतियाँ सूर्य, चंद्र और तारों को कैलेंडर, नक्शे और कानून की तरह कैसे पढ़ती हैं।"
outcomes:
  - en: "Describe Indigenous astronomical knowledge"
    zh: "描述原住民的天文知识"
    zh-TW: "描述原住民的天文知識"
    ja: "先住民の天文知識を説明する"
    ko: "원주민 천문 지식 설명하기"
    vi: "Mô tả tri thức thiên văn bản địa"
    ms: "Huraikan ilmu astronomi Orang Asal"
    id: "Menjelaskan pengetahuan astronomi masyarakat adat"
    hi: "आदिवासी खगोल ज्ञान का वर्णन करना"
  - en: "Observe and explain basic sky motions"
    zh: "观察并解释基本的天体运动"
    zh-TW: "觀察並解釋基本的天體運動"
    ja: "基本的な天体の動きを観察し説明する"
    ko: "기본 천체 운동 관찰하고 설명하기"
    vi: "Quan sát và giải thích chuyển động cơ bản của bầu trời"
    ms: "Perhati dan terangkan pergerakan asas langit"
    id: "Mengamati dan menjelaskan gerak dasar langit"
    hi: "आकाश की बुनियादी गतियाँ देखना और समझाना"
  - en: "Compare different ways of knowing the sky"
    zh: "比较认识星空的不同方式"
    zh-TW: "比較認識星空的不同方式"
    ja: "空を知るさまざまな方法を比べる"
    ko: "하늘을 이해하는 여러 방식 비교하기"
    vi: "So sánh các cách hiểu bầu trời khác nhau"
    ms: "Bandingkan cara berbeza memahami langit"
    id: "Membandingkan berbagai cara memahami langit"
    hi: "आकाश को समझने के अलग-अलग तरीकों की तुलना करना"
