code: MKTG30010
year: 2026
learn:
  en: "How firms plan and manage advertising, promotions, PR and online media as one joined-up communication effort."
  zh: "企业如何把广告、促销、公关和网络媒体作为整体来规划和管理。"
  zh-TW: "企業如何把廣告、促銷、公關和網路媒體當作整體來規劃和管理。"
  ja: "広告、販促、PR、ネット媒体を一体として計画・管理する方法。"
  ko: "광고, 판촉, PR, 온라인 미디어를 하나로 묶어 기획·관리하는 방법."
  vi: "Doanh nghiệp lên kế hoạch, quản lý quảng cáo, khuyến mãi, PR và truyền thông online như một thể thống nhất."
  ms: "Cara firma merancang dan mengurus iklan, promosi, PR dan media dalam talian sebagai satu usaha bersepadu."
  id: "Cara perusahaan merencanakan dan mengelola iklan, promosi, PR, dan media online sebagai satu kesatuan."
  hi: "कंपनियाँ विज्ञापन, प्रमोशन, PR और ऑनलाइन मीडिया को एक साथ जोड़कर कैसे प्लान और मैनेज करती हैं।"
outcomes:
  - en: "Compare the pros and cons of promotion techniques"
    zh: "比较各种推广手段的优缺点"
    zh-TW: "比較各種推廣手法的優缺點"
    ja: "販促手法の長所と短所を比べる"
    ko: "프로모션 기법의 장단점 비교하기"
    vi: "So sánh ưu, nhược điểm của các kỹ thuật quảng bá"
    ms: "Banding kebaikan dan keburukan teknik promosi"
    id: "Membandingkan kelebihan dan kekurangan teknik promosi"
    hi: "प्रमोशन के तरीकों के फ़ायदे-नुकसान तुलना करना"
  - en: "Judge why some campaigns work better than others"
    zh: "判断为什么有些宣传活动更有效"
    zh-TW: "判斷為什麼有些宣傳活動更有效"
    ja: "なぜ効果の高いキャンペーンがあるのか評価する"
    ko: "어떤 캠페인이 더 효과적인 이유 판단하기"
    vi: "Đánh giá vì sao có chiến dịch hiệu quả hơn"
    ms: "Nilai mengapa sesetengah kempen lebih berkesan"
    id: "Menilai mengapa sebagian kampanye lebih efektif"
    hi: "कुछ कैंपेन दूसरों से बेहतर क्यों चलते हैं, परखना"
  - en: "Plan an integrated marketing communications campaign"
    zh: "策划整合营销传播活动"
    zh-TW: "策劃整合行銷傳播活動"
    ja: "統合型マーケティング・コミュニケーションを企画する"
    ko: "통합 마케팅 커뮤니케이션 캠페인 기획하기"
    vi: "Lập kế hoạch chiến dịch truyền thông marketing tích hợp"
    ms: "Rancang kempen komunikasi pemasaran bersepadu"
    id: "Merencanakan kampanye komunikasi pemasaran terpadu"
    hi: "इंटीग्रेटेड मार्केटिंग कम्युनिकेशन कैंपेन की योजना बनाना"
