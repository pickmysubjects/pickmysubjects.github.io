code: ISYS90051
year: 2027
learn:
  en: "How digitisation changes organisations and daily life, with a focus on privacy, security, law and ethics."
  zh: "数字化如何改变组织和日常生活，重点关注隐私、安全、法律与伦理。"
  zh-TW: "數位化如何改變組織與日常生活，著重隱私、資安、法律與倫理。"
  ja: "デジタル化が組織と日常をどう変えるか。プライバシー、セキュリティ、法、倫理を中心に。"
  ko: "디지털화가 조직과 일상을 어떻게 바꾸는지, 프라이버시·보안·법·윤리를 중심으로."
  vi: "Số hóa thay đổi tổ chức và đời sống ra sao, tập trung vào quyền riêng tư, bảo mật, luật và đạo đức."
  ms: "Cara pendigitalan mengubah organisasi dan kehidupan harian, berfokus pada privasi, keselamatan, undang-undang, etika."
  id: "Cara digitalisasi mengubah organisasi dan kehidupan sehari-hari, berfokus pada privasi, keamanan, hukum, dan etika."
  hi: "डिजिटलीकरण संगठनों और रोज़मर्रा की ज़िंदगी को कैसे बदलता है: निजता, सुरक्षा, क़ानून और नैतिकता पर ज़ोर।"
outcomes:
  - en: "Analyse how digitisation and AI affect organisations"
    zh: "分析数字化与 AI 对组织的影响"
    zh-TW: "分析數位化與 AI 對組織的影響"
    ja: "デジタル化とAIが組織に与える影響を分析する"
    ko: "디지털화와 AI가 조직에 미치는 영향 분석하기"
    vi: "Phân tích tác động của số hóa và AI đến tổ chức"
    ms: "Menganalisis kesan pendigitalan dan AI pada organisasi"
    id: "Menganalisis dampak digitalisasi dan AI pada organisasi"
    hi: "डिजिटलीकरण और AI का संगठनों पर असर समझना"
  - en: "Argue a position on privacy and data ethics"
    zh: "就隐私和数据伦理问题提出论证"
    zh-TW: "就隱私與資料倫理提出論證"
    ja: "プライバシーとデータ倫理について論じる"
    ko: "프라이버시와 데이터 윤리에 대해 논증하기"
    vi: "Lập luận về quyền riêng tư và đạo đức dữ liệu"
    ms: "Berhujah tentang privasi dan etika data"
    id: "Berargumen tentang privasi dan etika data"
    hi: "निजता और डेटा नैतिकता पर तर्क रखना"
