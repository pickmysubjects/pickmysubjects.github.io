code: GEOG30030
year: 2026
learn:
  en: "Advanced GIS modelling in ArcGIS: networks, accessibility and predicting land-use and environmental change."
  zh: "ArcGIS高级空间建模：网络、可达性，以及预测土地利用和环境变化。"
  zh-TW: "ArcGIS進階空間建模：網路、可及性，以及預測土地利用與環境變化。"
  ja: "ArcGISでの高度な空間モデリング：ネットワーク、到達性、土地利用や環境変化の予測。"
  ko: "ArcGIS 고급 공간 모델링: 네트워크, 접근성, 토지이용·환경 변화 예측."
  vi: "Mô hình GIS nâng cao bằng ArcGIS: mạng lưới, khả năng tiếp cận, dự báo thay đổi sử dụng đất và môi trường."
  ms: "Pemodelan GIS lanjutan dengan ArcGIS: rangkaian, kebolehcapaian, ramalan guna tanah dan alam sekitar."
  id: "Pemodelan GIS lanjutan dengan ArcGIS: jaringan, aksesibilitas, prediksi tata guna lahan dan lingkungan."
  hi: "ArcGIS में उन्नत GIS मॉडलिंग: नेटवर्क, पहुँच, और भूमि-उपयोग व पर्यावरण बदलाव का पूर्वानुमान।"
outcomes:
  - en: "Apply and evaluate geospatial modelling methods"
    zh: "应用并评估地理空间建模方法"
    zh-TW: "應用並評估地理空間建模方法"
    ja: "地理空間モデリング手法を使い評価する"
    ko: "지리공간 모델링 기법 적용·평가하기"
    vi: "Áp dụng và đánh giá mô hình không gian địa lý"
    ms: "Guna dan nilai kaedah pemodelan geospatial"
    id: "Menerapkan dan menilai pemodelan geospasial"
    hi: "भू-स्थानिक मॉडलिंग विधियाँ लगाना और परखना"
  - en: "Communicate spatial model results for decisions"
    zh: "展示空间模型结果以辅助决策"
    zh-TW: "呈現空間模型結果以輔助決策"
    ja: "空間モデルの結果を意思決定向けに伝える"
    ko: "의사결정용 공간 모델 결과 전달하기"
    vi: "Trình bày kết quả mô hình để hỗ trợ quyết định"
    ms: "Sampaikan hasil model ruang untuk keputusan"
    id: "Menyampaikan hasil model spasial untuk keputusan"
    hi: "निर्णयों के लिए स्थानिक मॉडल परिणाम बताना"
