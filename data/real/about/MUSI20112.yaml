code: MUSI20112
year: 2026
learn:
  en: "Small vocal ensembles and opera scenes: tuning, breathing together, matched diction and stage roles. Audition; pass/fail."
  zh: "小型声乐重唱与歌剧场景：音准、共同呼吸、统一咬字与角色；需试音，通过/不通过。"
  zh-TW: "小型聲樂重唱與歌劇場景：音準、共同呼吸、統一咬字與角色；需試音，通過/不通過。"
  ja: "声楽アンサンブルとオペラの重唱：音程、呼吸、発音、役割。要オーディション、合否評価。"
  ko: "성악 앙상블과 오페라 중창: 음정, 호흡, 발음, 역할. 오디션, 통과/불통과."
  vi: "Nhóm hát nhỏ và cảnh opera: cao độ, thở cùng nhau, phát âm, vai diễn. Thử giọng; đạt/không."
  ms: "Ensembel vokal kecil dan babak opera: nada, pernafasan, sebutan, peranan. Uji bakat; lulus/gagal."
  id: "Ansambel vokal kecil dan adegan opera: intonasi, napas, diksi, peran. Audisi; lulus/tidak."
  hi: "छोटे वोकल समूह और ओपेरा दृश्य: सुर, साथ साँस, उच्चारण, भूमिकाएँ। ऑडिशन; पास/फ़ेल।"
outcomes:
  - en: "Learn choral parts and sing them securely"
    zh: "学会合唱声部并唱得稳"
    zh-TW: "學會合唱聲部並唱得穩"
    ja: "合唱パートを覚えて確実に歌う"
    ko: "합창 파트를 익혀 안정적으로 부르기"
    vi: "Học bè hợp xướng và hát vững vàng"
    ms: "Pelajari bahagian koir dan nyanyikan dengan yakin"
    id: "Mempelajari suara paduan dan menyanyikannya dengan mantap"
    hi: "कोरल पार्ट सीखकर भरोसे से गाना"
  - en: "Work on tuning, breath and diction as a group"
    zh: "集体练习音准、气息与咬字"
    zh-TW: "集體練習音準、氣息與咬字"
    ja: "音程・呼吸・発音をみんなで整える"
    ko: "음정, 호흡, 발음을 함께 다듬기"
    vi: "Luyện cao độ, hơi thở và phát âm cùng nhóm"
    ms: "Latih nada, pernafasan dan sebutan bersama"
    id: "Melatih intonasi, napas, dan diksi bersama"
    hi: "सुर, साँस और उच्चारण पर समूह में काम करना"
  - en: "Sing in public performances under a conductor"
    zh: "在指挥带领下参加公开演出"
    zh-TW: "在指揮帶領下參加公開演出"
    ja: "指揮者のもとで公演に出る"
    ko: "지휘자와 함께 공개 공연하기"
    vi: "Hát trong buổi diễn công khai dưới tay chỉ huy"
    ms: "Menyanyi dalam persembahan awam di bawah konduktor"
    id: "Bernyanyi di pertunjukan publik bersama dirigen"
    hi: "कंडक्टर के साथ सार्वजनिक प्रस्तुति में गाना"
