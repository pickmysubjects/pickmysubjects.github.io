code: EVSC90033
year: 2027
learn:
  en: "Building a low-cost air sensor with Python, designing a sampling experiment and turning results into an air action plan."
  zh: "用Python搭建低成本空气传感器，设计采样实验，并把结果写成空气行动计划。"
  zh-TW: "用Python打造低成本空氣感測器，設計採樣實驗，並把結果寫成空氣行動計畫。"
  ja: "Pythonで低コスト大気センサーを作り、採取実験を設計し、結果を大気行動計画にまとめる。"
  ko: "Python으로 저가 대기 센서를 만들고 측정 실험을 설계해 결과를 대기 행동 계획으로 정리합니다."
  vi: "Lắp cảm biến không khí giá rẻ bằng Python, thiết kế thí nghiệm lấy mẫu và lập kế hoạch hành động."
  ms: "Membina sensor udara kos rendah dengan Python, mereka eksperimen dan menghasilkan pelan tindakan udara."
  id: "Membuat sensor udara murah dengan Python, merancang eksperimen sampling, dan menyusun rencana aksi udara."
  hi: "Python से कम लागत वाला वायु सेंसर बनाना, सैंपलिंग प्रयोग डिज़ाइन करना और वायु कार्य योजना बनाना।"
outcomes:
  - en: "Build and calibrate a low-cost air sensor"
    zh: "搭建并校准低成本空气传感器"
    zh-TW: "打造並校準低成本空氣感測器"
    ja: "低コスト大気センサーを作り校正する"
    ko: "저가 대기 센서 만들고 보정하기"
    vi: "Lắp và hiệu chuẩn cảm biến không khí"
    ms: "Membina dan menentukur sensor udara"
    id: "Membuat dan mengkalibrasi sensor udara"
    hi: "कम लागत वाला वायु सेंसर बनाना व कैलिब्रेट करना"
  - en: "Compare pollutant levels with health standards"
    zh: "将污染物浓度与健康标准对比"
    zh-TW: "將污染物濃度與健康標準對比"
    ja: "汚染物質濃度を健康基準と比べる"
    ko: "오염물질 농도를 건강 기준과 비교하기"
    vi: "So sánh mức ô nhiễm với chuẩn sức khỏe"
    ms: "Membandingkan tahap pencemar dengan piawaian"
    id: "Membandingkan kadar polutan dengan standar"
    hi: "प्रदूषक स्तरों की स्वास्थ्य मानकों से तुलना"
