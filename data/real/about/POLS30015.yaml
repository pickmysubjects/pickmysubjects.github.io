code: POLS30015
year: 2026
learn:
  en: "Gender and sexuality in world politics: war, global labour, religion, reproduction, trafficking and sexual violence."
  zh: "世界政治中的性别与性：战争、全球劳动分工、宗教、生育、人口贩卖和性暴力。"
  zh-TW: "世界政治中的性別與性：戰爭、全球勞動分工、宗教、生育、人口販運和性暴力。"
  ja: "世界政治の中のジェンダーとセクシュアリティ。戦争、国際分業、宗教、生殖、人身売買、性暴力。"
  ko: "세계 정치 속 젠더와 섹슈얼리티. 전쟁, 국제 노동 분업, 종교, 출산, 인신매매, 성폭력."
  vi: "Giới và tính dục trong chính trị thế giới: chiến tranh, phân công lao động toàn cầu, tôn giáo, sinh sản, buôn người và bạo lực tình dục."
  ms: "Gender dan seksualiti dalam politik dunia: perang, buruh global, agama, reproduksi, pemerdagangan manusia dan keganasan seksual."
  id: "Gender dan seksualitas dalam politik dunia: perang, buruh global, agama, reproduksi, perdagangan orang dan kekerasan seksual."
  hi: "विश्व राजनीति में जेंडर और कामुकता: युद्ध, वैश्विक श्रम, धर्म, प्रजनन, मानव तस्करी और यौन हिंसा।"
outcomes:
  - en: "Explain how gender shapes international relations"
    zh: "说明性别如何影响国际关系"
    zh-TW: "說明性別如何影響國際關係"
    ja: "ジェンダーが国際関係をどう形作るか説明する"
    ko: "젠더가 국제관계를 만드는 방식 설명하기"
    vi: "Giải thích giới định hình quan hệ quốc tế ra sao"
    ms: "Terangkan cara gender membentuk hubungan antarabangsa"
    id: "Menjelaskan cara gender membentuk hubungan internasional"
    hi: "जेंडर अंतरराष्ट्रीय संबंधों को कैसे गढ़ता है, समझाना"
  - en: "Assess how Western policy affects women abroad"
    zh: "评估西方政策如何影响其他地区的女性"
    zh-TW: "評估西方政策如何影響其他地區的女性"
    ja: "欧米の政策が他地域の女性に与える影響を評価する"
    ko: "서구 정책이 다른 지역 여성에게 주는 영향 평가하기"
    vi: "Đánh giá chính sách phương Tây ảnh hưởng phụ nữ nơi khác ra sao"
    ms: "Nilai kesan dasar Barat terhadap wanita di luar negara"
    id: "Menilai dampak kebijakan Barat pada perempuan di negara lain"
    hi: "पश्चिमी नीतियाँ दूसरे देशों की महिलाओं पर कैसे असर डालती हैं, आँकना"
  - en: "Debate human rights and cultural relativism"
    zh: "辩论人权与文化相对主义"
    zh-TW: "辯論人權與文化相對主義"
    ja: "人権と文化相対主義について論じる"
    ko: "인권과 문화 상대주의 토론하기"
    vi: "Tranh luận về nhân quyền và thuyết tương đối văn hóa"
    ms: "Bahaskan hak asasi dan relativisme budaya"
    id: "Memperdebatkan HAM dan relativisme budaya"
    hi: "मानवाधिकार और सांस्कृतिक सापेक्षवाद पर बहस करना"
