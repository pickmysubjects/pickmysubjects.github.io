code: EDUC20076
year: 2026
learn:
  en: "An introduction to Auslan and Deaf culture, learning to sign from Deaf teachers and thinking about visual communication."
  zh: "入门澳大利亚手语和聋人文化，跟聋人老师学手语。"
  zh-TW: "入門澳洲手語和聾人文化，跟聾人老師學手語。"
  ja: "オーストラリア手話（Auslan）とろう文化の入門。ろう者の先生から手話を学ぶ。"
  ko: "호주 수어(Auslan)와 농문화 입문, 농인 선생님께 수어 배우기."
  vi: "Nhập môn Auslan và văn hóa người Điếc, học ký hiệu từ giáo viên Điếc."
  ms: "Pengenalan Auslan dan budaya Pekak, belajar isyarat daripada guru Pekak."
  id: "Pengantar Auslan dan budaya Tuli, belajar isyarat dari guru Tuli."
  hi: "ऑसलैन और बधिर संस्कृति का परिचय, बधिर शिक्षकों से साइन सीखना।"
outcomes:
  - en: "Explain the linguistic parts of Auslan"
    zh: "解释澳大利亚手语的语言结构"
    zh-TW: "解釋澳洲手語的語言結構"
    ja: "Auslanの言語的な構成を説明する"
    ko: "Auslan의 언어적 구성 설명하기"
    vi: "Giải thích các thành phần ngôn ngữ của Auslan"
    ms: "Terangkan komponen linguistik Auslan"
    id: "Menjelaskan komponen linguistik Auslan"
    hi: "ऑसलैन के भाषाई हिस्सों को समझाना"
  - en: "Use basic Auslan to communicate"
    zh: "用基础手语进行交流"
    zh-TW: "用基礎手語進行交流"
    ja: "基本的なAuslanでやり取りする"
    ko: "기초 Auslan으로 소통하기"
    vi: "Dùng Auslan cơ bản để giao tiếp"
    ms: "Berkomunikasi dengan Auslan asas"
    id: "Berkomunikasi dengan Auslan dasar"
    hi: "बुनियादी ऑसलैन में बातचीत करना"
  - en: "Connect language with Deaf culture"
    zh: "理解语言与聋人文化的联系"
    zh-TW: "理解語言與聾人文化的聯繫"
    ja: "言語とろう文化のつながりを考える"
    ko: "언어와 농문화의 연결 이해하기"
    vi: "Liên hệ ngôn ngữ với văn hóa người Điếc"
    ms: "Kaitkan bahasa dengan budaya Pekak"
    id: "Mengaitkan bahasa dengan budaya Tuli"
    hi: "भाषा और बधिर संस्कृति के संबंध को समझना"
