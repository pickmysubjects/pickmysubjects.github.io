code: LAWS90003
year: 2027
learn:
  en: "How biotech drugs, devices, foods and pesticides get approved by Australian regulators such as the TGA and OGTR."
  zh: "生物技术药物、器械、食品和农药如何通过TGA、OGTR等澳洲监管机构审批。"
  zh-TW: "生物科技藥物、器材、食品與農藥如何通過TGA、OGTR等澳洲監管機構審批。"
  ja: "バイオ医薬品・機器・食品・農薬がTGAやOGTRなど豪州の規制当局に承認される流れ。"
  ko: "생명공학 의약품·기기·식품·농약이 TGA, OGTR 등 호주 규제기관의 승인을 받는 과정."
  vi: "Cách thuốc, thiết bị, thực phẩm và thuốc trừ sâu sinh học được cơ quan Úc như TGA, OGTR phê duyệt."
  ms: "Cara ubat, peranti, makanan dan racun perosak bioteknologi diluluskan oleh pengawal selia Australia seperti TGA dan OGTR."
  id: "Cara obat, alat, pangan, dan pestisida bioteknologi disetujui regulator Australia seperti TGA dan OGTR."
  hi: "बायोटेक दवाएँ, उपकरण, खाद्य और कीटनाशक TGA व OGTR जैसे ऑस्ट्रेलियाई नियामकों से कैसे मंज़ूर होते हैं।"
outcomes:
  - en: "Pick the right regulator for a product"
    zh: "为产品选择正确的监管机构"
    zh-TW: "為產品選擇正確的監管機構"
    ja: "製品に合う規制当局を選ぶ"
    ko: "제품에 맞는 규제기관 고르기"
    vi: "Chọn đúng cơ quan quản lý cho sản phẩm"
    ms: "Memilih pengawal selia yang betul untuk produk"
    id: "Memilih regulator yang tepat untuk produk"
    hi: "उत्पाद के लिए सही नियामक चुनना"
  - en: "Plan a product registration"
    zh: "制定产品注册计划"
    zh-TW: "制定產品註冊計畫"
    ja: "製品登録の計画を立てる"
    ko: "제품 등록 계획 세우기"
    vi: "Lập kế hoạch đăng ký sản phẩm"
    ms: "Merancang pendaftaran produk"
    id: "Merencanakan registrasi produk"
    hi: "उत्पाद पंजीकरण की योजना बनाना"
  - en: "Weigh registration cost against the market"
    zh: "权衡注册成本与市场前景"
    zh-TW: "權衡註冊成本與市場前景"
    ja: "登録費用と市場を比べる"
    ko: "등록 비용과 시장 비교하기"
    vi: "Cân nhắc chi phí đăng ký với thị trường"
    ms: "Menimbang kos pendaftaran dengan pasaran"
    id: "Menimbang biaya registrasi dengan pasar"
    hi: "पंजीकरण लागत को बाज़ार से तौलना"
