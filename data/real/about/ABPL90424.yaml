code: ABPL90424
year: 2027
learn:
  en: "Sustainable design principles for building performance: thermal comfort, acoustics, daylight and indoor air quality."
  zh: "面向建筑性能的可持续设计原理：热舒适、声学、采光和室内空气质量。"
  zh-TW: "面向建築性能的永續設計原理：熱舒適、聲學、採光和室內空氣品質。"
  ja: "建物性能のための持続可能な設計：温熱快適性、音響、採光、室内空気質。"
  ko: "건물 성능을 위한 지속가능 설계: 열쾌적, 음향, 채광, 실내 공기질."
  vi: "Nguyên lý thiết kế bền vững cho hiệu năng công trình: tiện nghi nhiệt, âm học, ánh sáng, chất lượng không khí."
  ms: "Prinsip reka bentuk mampan untuk prestasi bangunan: keselesaan terma, akustik, cahaya dan kualiti udara dalaman."
  id: "Prinsip desain berkelanjutan untuk kinerja bangunan: kenyamanan termal, akustik, cahaya, dan kualitas udara dalam."
  hi: "भवन प्रदर्शन के लिए टिकाऊ डिज़ाइन: तापीय आराम, ध्वनिकी, रोशनी और इनडोर वायु गुणवत्ता।"
outcomes:
  - en: "Use building performance tools"
    zh: "使用建筑性能分析工具"
    zh-TW: "使用建築性能分析工具"
    ja: "建物性能ツールを使う"
    ko: "건물 성능 도구 사용하기"
    vi: "Dùng công cụ đánh giá hiệu năng công trình"
    ms: "Menggunakan alat prestasi bangunan"
    id: "Memakai alat analisis kinerja bangunan"
    hi: "भवन प्रदर्शन टूल्स का उपयोग करना"
  - en: "Solve indoor environment issues in space design"
    zh: "解决空间设计中的室内环境问题"
    zh-TW: "解決空間設計中的室內環境問題"
    ja: "空間設計の室内環境の課題を解く"
    ko: "공간 설계의 실내 환경 문제 해결하기"
    vi: "Giải quyết vấn đề môi trường trong nhà khi thiết kế"
    ms: "Menyelesaikan isu persekitaran dalaman dalam reka bentuk"
    id: "Mengatasi masalah lingkungan dalam ruang pada desain"
    hi: "स्थान डिज़ाइन में इनडोर पर्यावरण समस्याएँ हल करना"
