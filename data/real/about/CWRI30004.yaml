code: CWRI30004
year: 2026
learn:
  en: "Creative writing as a profession: weekly panels with writers and industry people and a hands-on group project."
  zh: "作为职业的创意写作：每周与作家和业内人士的座谈，以及一个实践性小组项目。"
  zh-TW: "作為職業的創意寫作：每週與作家和業內人士的座談，以及一個實作性小組專題。"
  ja: "職業としての創作。作家や業界人による毎週のパネルと、実践的なグループ課題。"
  ko: "직업으로서의 창작. 작가·업계인과의 주간 패널과 실습형 팀 프로젝트."
  vi: "Viết sáng tạo như một nghề: tọa đàm hằng tuần với nhà văn, người trong ngành và một dự án nhóm thực hành."
  ms: "Penulisan kreatif sebagai profesion: panel mingguan bersama penulis dan orang industri serta projek kumpulan amali."
  id: "Menulis kreatif sebagai profesi: panel mingguan bersama penulis dan pelaku industri serta proyek kelompok praktis."
  hi: "पेशे के रूप में रचनात्मक लेखन: लेखकों और उद्योग के लोगों के साथ साप्ताहिक पैनल और एक व्यावहारिक समूह प्रोजेक्ट।"
outcomes:
  - en: "Describe how the writing industry works"
    zh: "描述写作行业如何运作"
    zh-TW: "描述寫作產業如何運作"
    ja: "出版・執筆業界の仕組みを説明する"
    ko: "글쓰기 업계가 돌아가는 방식 설명하기"
    vi: "Mô tả ngành viết lách vận hành ra sao"
    ms: "Huraikan cara industri penulisan berfungsi"
    id: "Menguraikan cara kerja industri penulisan"
    hi: "लेखन उद्योग कैसे काम करता है, बताना"
  - en: "Complete a collaborative real-world project"
    zh: "完成一个面向真实世界的合作项目"
    zh-TW: "完成一個面向真實世界的合作專題"
    ja: "実社会に根ざした共同プロジェクトを仕上げる"
    ko: "현실과 연결된 협업 프로젝트 완수하기"
    vi: "Hoàn thành một dự án hợp tác gắn với thực tế"
    ms: "Siapkan projek kolaboratif dunia sebenar"
    id: "Menyelesaikan proyek kolaboratif dunia nyata"
    hi: "असली दुनिया से जुड़ा सहयोगी प्रोजेक्ट पूरा करना"
  - en: "Reflect on your own writing practice"
    zh: "反思自己的写作实践"
    zh-TW: "反思自己的寫作實踐"
    ja: "自分の書く営みを振り返る"
    ko: "자신의 글쓰기 실천 돌아보기"
    vi: "Suy ngẫm về việc viết của bản thân"
    ms: "Renungkan amalan penulisan sendiri"
    id: "Merefleksikan praktik menulis sendiri"
    hi: "अपने लेखन अभ्यास पर विचार करना"
