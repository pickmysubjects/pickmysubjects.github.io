code: COMP90041
year: 2026
learn:
  en: "Object-oriented programming in Java: designing and writing programs for moderately complex problems."
  zh: "用 Java 学面向对象编程：为中等复杂问题设计和编写程序。"
  zh-TW: "用 Java 學物件導向程式設計：為中等複雜問題設計和撰寫程式。"
  ja: "Java によるオブジェクト指向プログラミング：中程度の複雑さの問題向けにプログラムを設計・作成する。"
  ko: "Java 객체지향 프로그래밍: 중간 난이도 문제를 위한 프로그램 설계와 작성."
  vi: "Lập trình hướng đối tượng với Java: thiết kế và viết chương trình cho bài toán khá phức tạp."
  ms: "Pengaturcaraan berorientasikan objek dalam Java: reka dan tulis program untuk masalah sederhana kompleks."
  id: "Pemrograman berorientasi objek dengan Java: merancang dan menulis program untuk masalah cukup kompleks."
  hi: "Java में ऑब्जेक्ट-ओरिएंटेड प्रोग्रामिंग: मध्यम कठिन समस्याओं के लिए प्रोग्राम डिज़ाइन करना और लिखना।"
outcomes:
  - en: "Write, test and debug Java programs"
    zh: "编写、测试和调试 Java 程序"
    zh-TW: "撰寫、測試和除錯 Java 程式"
    ja: "Java プログラムを書き、テストし、デバッグする"
    ko: "Java 프로그램 작성, 테스트, 디버그하기"
    vi: "Viết, kiểm thử và gỡ lỗi chương trình Java"
    ms: "Tulis, uji dan nyahpepijat program Java"
    id: "Menulis, menguji, dan men-debug program Java"
    hi: "Java प्रोग्राम लिखना, टेस्ट करना और डिबग करना"
  - en: "Use classes, inheritance and interfaces well"
    zh: "用好类、继承和接口"
    zh-TW: "用好類別、繼承和介面"
    ja: "クラス、継承、インターフェースを使いこなす"
    ko: "클래스, 상속, 인터페이스 잘 활용하기"
    vi: "Dùng tốt lớp, kế thừa và giao diện"
    ms: "Guna kelas, pewarisan dan antara muka dengan baik"
    id: "Memakai kelas, pewarisan, dan interface dengan baik"
    hi: "क्लास, इनहेरिटेंस और इंटरफ़ेस अच्छे से इस्तेमाल करना"
  - en: "Design a program before coding it"
    zh: "先设计程序再写代码"
    zh-TW: "先設計程式再寫程式碼"
    ja: "コードを書く前にプログラムを設計する"
    ko: "코딩 전에 프로그램 설계하기"
    vi: "Thiết kế chương trình trước khi viết mã"
    ms: "Reka bentuk program sebelum menulis kod"
    id: "Merancang program sebelum menulis kode"
    hi: "कोड लिखने से पहले प्रोग्राम डिज़ाइन करना"
