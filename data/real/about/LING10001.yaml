code: LING10001
year: 2026
learn:
  en: "A hands-on intro to linguistics: sounds, words, sentences, meaning and language change, using data from world languages."
  zh: "动手入门语言学：语音、词、句子、意义和语言演变，使用世界各地语言的数据。"
  zh-TW: "動手入門語言學：語音、詞、句子、意義和語言演變，使用世界各地語言的資料。"
  ja: "世界の言語のデータを使い、音・語・文・意味・言語変化を実際に分析しながら言語学の基礎を学ぶ。"
  ko: "세계 여러 언어의 자료로 소리, 단어, 문장, 의미, 언어 변화를 직접 분석하며 언어학의 기초를 배운다."
  vi: "Nhập môn ngôn ngữ học thực hành: âm, từ, câu, nghĩa và biến đổi ngôn ngữ, dùng dữ liệu từ các ngôn ngữ trên thế giới."
  ms: "Pengenalan praktikal linguistik: bunyi, perkataan, ayat, makna dan perubahan bahasa, dengan data bahasa dunia."
  id: "Pengantar praktis linguistik: bunyi, kata, kalimat, makna, dan perubahan bahasa, dengan data bahasa dunia."
  hi: "भाषाविज्ञान का व्यावहारिक परिचय: ध्वनि, शब्द, वाक्य, अर्थ और भाषा परिवर्तन, दुनिया की भाषाओं के डेटा के साथ।"
outcomes:
  - en: "Describe the general nature of human language"
    zh: "描述人类语言的一般特点"
    zh-TW: "描述人類語言的一般特點"
    ja: "人間の言語の一般的な性質を説明する"
    ko: "인간 언어의 일반적 특성 설명하기"
    vi: "Mô tả bản chất chung của ngôn ngữ loài người"
    ms: "Huraikan sifat umum bahasa manusia"
    id: "Menguraikan sifat umum bahasa manusia"
    hi: "मानव भाषा के सामान्य स्वरूप का वर्णन करना"
  - en: "Analyse language data with basic linguistic tools"
    zh: "用基础语言学工具分析语言数据"
    zh-TW: "用基礎語言學工具分析語言資料"
    ja: "基本的な言語学の道具で言語データを分析する"
    ko: "기초 언어학 도구로 언어 자료 분석하기"
    vi: "Phân tích dữ liệu ngôn ngữ bằng công cụ ngôn ngữ học cơ bản"
    ms: "Analisis data bahasa dengan alat linguistik asas"
    id: "Menganalisis data bahasa dengan alat linguistik dasar"
    hi: "बुनियादी भाषावैज्ञानिक तरीकों से भाषा डेटा का विश्लेषण करना"
  - en: "Outline the main areas of linguistics"
    zh: "概述语言学的主要领域"
    zh-TW: "概述語言學的主要領域"
    ja: "言語学の主な分野を概観する"
    ko: "언어학의 주요 분야 개관하기"
    vi: "Nêu khái quát các lĩnh vực chính của ngôn ngữ học"
    ms: "Gariskan bidang utama linguistik"
    id: "Menguraikan bidang utama linguistik"
    hi: "भाषाविज्ञान के मुख्य क्षेत्रों की रूपरेखा बताना"
