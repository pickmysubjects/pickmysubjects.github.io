code: MCEN90045
year: 2027
learn:
  en: "Modelling, stability and control of aircraft and spacecraft, using MATLAB."
  zh: "用 MATLAB 对飞行器和航天器进行建模、稳定性分析与控制。"
  zh-TW: "用 MATLAB 對飛行器與太空載具進行建模、穩定性分析與控制。"
  ja: "MATLABを使った航空機・宇宙機のモデル化、安定性、制御。"
  ko: "MATLAB으로 항공기·우주선 모델링, 안정성, 제어."
  vi: "Mô hình hóa, ổn định và điều khiển máy bay, tàu vũ trụ bằng MATLAB."
  ms: "Pemodelan, kestabilan dan kawalan pesawat serta kapal angkasa dengan MATLAB."
  id: "Pemodelan, kestabilan, dan kendali pesawat serta wahana antariksa dengan MATLAB."
  hi: "MATLAB से विमान और अंतरिक्ष यान की मॉडलिंग, स्थिरता और नियंत्रण।"
outcomes:
  - en: "Model aerospace vehicles as differential equations"
    zh: "把航空航天飞行器建模为微分方程"
    zh-TW: "把航太載具建模為微分方程"
    ja: "航空宇宙機を微分方程式でモデル化する"
    ko: "항공우주 비행체를 미분방정식으로 모델링하기"
    vi: "Mô hình hóa phương tiện hàng không vũ trụ bằng phương trình vi phân"
    ms: "Memodelkan kenderaan aeroangkasa sebagai persamaan pembezaan"
    id: "Memodelkan wahana dirgantara sebagai persamaan diferensial"
    hi: "एयरोस्पेस वाहनों को अवकल समीकरणों में मॉडल करना"
  - en: "Design controllers to stabilise flight and orbit"
    zh: "设计控制器稳定飞行和轨道"
    zh-TW: "設計控制器穩定飛行與軌道"
    ja: "飛行や軌道を安定させる制御器を設計する"
    ko: "비행·궤도를 안정화하는 제어기 설계하기"
    vi: "Thiết kế bộ điều khiển ổn định bay và quỹ đạo"
    ms: "Mereka bentuk pengawal untuk menstabilkan penerbangan dan orbit"
    id: "Merancang pengendali untuk menstabilkan terbang dan orbit"
    hi: "उड़ान और कक्षा स्थिर करने वाले कंट्रोलर डिज़ाइन"
