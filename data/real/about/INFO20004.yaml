code: INFO20004
year: 2026
learn:
  en: "How to test whether a digital design is usable: industry methods for evaluating with users and improving the design."
  zh: "如何检验数字设计是否好用：与用户一起评估并改进设计的业界方法。"
  zh-TW: "如何檢驗數位設計是否好用：與使用者一起評估並改進設計的業界方法。"
  ja: "デジタル設計が使いやすいかを確かめる：ユーザーと評価し改善する業界の手法。"
  ko: "디지털 디자인의 사용성 검증: 사용자와 함께 평가하고 개선하는 업계 방법."
  vi: "Cách kiểm tra thiết kế số có dễ dùng không: phương pháp ngành để đánh giá cùng người dùng và cải tiến."
  ms: "Cara menguji kebolehgunaan reka bentuk digital: kaedah industri menilai bersama pengguna dan menambah baik."
  id: "Cara menguji kegunaan desain digital: metode industri untuk mengevaluasi bersama pengguna dan memperbaikinya."
  hi: "डिजिटल डिज़ाइन उपयोगी है या नहीं, कैसे परखें: यूज़र्स के साथ जाँच और सुधार के इंडस्ट्री तरीक़े।"
outcomes:
  - en: "Plan and run a usability test"
    zh: "策划并开展可用性测试"
    zh-TW: "規劃並進行易用性測試"
    ja: "ユーザビリティテストを計画・実施する"
    ko: "사용성 테스트 계획·진행하기"
    vi: "Lên kế hoạch và chạy kiểm thử khả dụng"
    ms: "Rancang dan jalankan ujian kebolehgunaan"
    id: "Merencanakan dan menjalankan uji kegunaan"
    hi: "यूज़ेबिलिटी टेस्ट की योजना बनाकर चलाना"
  - en: "Analyse findings to spot design problems"
    zh: "分析结果找出设计问题"
    zh-TW: "分析結果找出設計問題"
    ja: "結果を分析して設計の問題を見つける"
    ko: "결과를 분석해 디자인 문제 찾기"
    vi: "Phân tích kết quả để tìm lỗi thiết kế"
    ms: "Analisis dapatan untuk kesan masalah reka bentuk"
    id: "Menganalisis temuan untuk menemukan masalah desain"
    hi: "नतीजों से डिज़ाइन की समस्याएँ पहचानना"
  - en: "Recommend changes in a clear report"
    zh: "在清晰的报告中提出改进建议"
    zh-TW: "在清晰的報告中提出改進建議"
    ja: "分かりやすい報告で改善を提案する"
    ko: "명확한 보고서로 개선안 제시하기"
    vi: "Đề xuất thay đổi trong báo cáo rõ ràng"
    ms: "Cadang perubahan dalam laporan jelas"
    id: "Merekomendasikan perubahan dalam laporan jelas"
    hi: "साफ़ रिपोर्ट में बदलाव सुझाना"
