code: BIOL90001
year: 2027
learn:
  en: "Light, electron and confocal microscopy, preparing biological samples and analysing images."
  zh: "光学、电子和共聚焦显微镜，生物样品制备与图像分析。"
  zh-TW: "光學、電子與共軛焦顯微鏡，生物樣本製備與影像分析。"
  ja: "光学・電子・共焦点顕微鏡、生物試料の作製と画像解析。"
  ko: "광학·전자·공초점 현미경, 생물 시료 준비와 이미지 분석."
  vi: "Kính hiển vi quang học, điện tử, đồng tiêu; chuẩn bị mẫu và phân tích ảnh."
  ms: "Mikroskopi cahaya, elektron dan konfokal, penyediaan sampel dan analisis imej."
  id: "Mikroskopi cahaya, elektron, dan konfokal; persiapan sampel dan analisis citra."
  hi: "प्रकाश, इलेक्ट्रॉन और कॉन्फ़ोकल माइक्रोस्कोपी, नमूना तैयारी और इमेज विश्लेषण।"
outcomes:
  - en: "Explain how optical and electron microscopy differ"
    zh: "解释光学与电子显微镜的原理差别"
    zh-TW: "解釋光學與電子顯微鏡的原理差別"
    ja: "光学顕微鏡と電子顕微鏡の違いを説明する"
    ko: "광학·전자 현미경의 차이 설명하기"
    vi: "Giải thích khác biệt giữa kính quang học và điện tử"
    ms: "Menerangkan beza mikroskopi optik dan elektron"
    id: "Menjelaskan beda mikroskopi optik dan elektron"
    hi: "ऑप्टिकल और इलेक्ट्रॉन माइक्रोस्कोपी का अंतर समझाना"
  - en: "Prepare and image samples for each method"
    zh: "为不同方法制备样品并成像"
    zh-TW: "為不同方法製備樣本並成像"
    ja: "手法ごとに試料を作り撮像する"
    ko: "방법별로 시료 준비·촬영하기"
    vi: "Chuẩn bị và chụp mẫu cho từng phương pháp"
    ms: "Menyedia dan mengimej sampel bagi setiap kaedah"
    id: "Menyiapkan dan mencitrakan sampel tiap metode"
    hi: "हर विधि के लिए नमूना तैयार कर इमेज लेना"
  - en: "Judge and analyse microscopy images"
    zh: "评估并分析显微图像"
    zh-TW: "評估並分析顯微影像"
    ja: "顕微鏡画像を評価・解析する"
    ko: "현미경 이미지 평가·분석하기"
    vi: "Đánh giá và phân tích ảnh hiển vi"
    ms: "Menilai dan menganalisis imej mikroskopi"
    id: "Menilai dan menganalisis citra mikroskopi"
    hi: "माइक्रोस्कोपी इमेज का आकलन और विश्लेषण"
