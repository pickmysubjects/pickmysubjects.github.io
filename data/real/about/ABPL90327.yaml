code: ABPL90327
year: 2027
learn:
  en: "Construction procurement methods and contract types, how to choose between them, and ethics in public procurement."
  zh: "建筑采购方式与合同类型、如何选择，以及公共采购中的伦理。"
  zh-TW: "營建採購方式與合約類型、如何選擇，以及公共採購的倫理。"
  ja: "建設調達方式と契約形態、その選び方、公共調達の倫理。"
  ko: "건설 조달 방식과 계약 유형, 선택 방법, 공공 조달 윤리."
  vi: "Các phương thức mua sắm xây dựng, loại hợp đồng, cách chọn và đạo đức mua sắm công."
  ms: "Kaedah perolehan pembinaan, jenis kontrak, cara memilih dan etika perolehan awam."
  id: "Metode pengadaan konstruksi, jenis kontrak, cara memilih dan etika pengadaan publik."
  hi: "निर्माण खरीद के तरीके, अनुबंध प्रकार, चयन कैसे करें और सार्वजनिक खरीद की नैतिकता।"
outcomes:
  - en: "Compare procurement methods and their contracts"
    zh: "比较不同采购方式及其合同"
    zh-TW: "比較不同採購方式及其合約"
    ja: "調達方式と契約を比較する"
    ko: "조달 방식과 계약 비교하기"
    vi: "So sánh phương thức mua sắm và hợp đồng"
    ms: "Membanding kaedah perolehan dan kontraknya"
    id: "Membandingkan metode pengadaan dan kontraknya"
    hi: "खरीद तरीकों और अनुबंधों की तुलना"
  - en: "Choose a procurement method for a client"
    zh: "为业主选择合适的采购方式"
    zh-TW: "為業主選擇合適的採購方式"
    ja: "発注者に合う調達方式を選ぶ"
    ko: "발주자에게 맞는 조달 방식 고르기"
    vi: "Chọn phương thức mua sắm cho chủ đầu tư"
    ms: "Memilih kaedah perolehan untuk klien"
    id: "Memilih metode pengadaan untuk klien"
    hi: "ग्राहक के लिए खरीद तरीका चुनना"
