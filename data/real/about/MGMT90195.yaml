code: MGMT90195
year: 2027
learn:
  en: "Research-level survey of major management theories such as agency theory, resource-based view and transaction cost economics."
  zh: "研究层面梳理代理理论、资源基础观、交易成本经济学等主要管理理论。"
  zh-TW: "研究層面梳理代理理論、資源基礎觀、交易成本經濟學等主要管理理論。"
  ja: "エージェンシー理論、資源ベース論、取引費用経済学など主要な経営理論を研究レベルで学ぶ。"
  ko: "대리인 이론, 자원기반관점, 거래비용경제학 등 주요 경영 이론을 연구 수준에서 검토."
  vi: "Tổng quan các lý thuyết quản trị chính như lý thuyết người đại diện, nguồn lực và chi phí giao dịch."
  ms: "Tinjauan teori pengurusan utama seperti teori agensi, pandangan berasaskan sumber dan ekonomi kos urus niaga."
  id: "Tinjauan teori manajemen utama seperti teori keagenan, pandangan berbasis sumber daya, dan biaya transaksi."
  hi: "एजेंसी सिद्धांत, संसाधन-आधारित दृष्टि और लेन-देन लागत जैसे प्रमुख प्रबंधन सिद्धांतों का शोध-स्तरीय अध्ययन।"
outcomes:
  - en: "Know the major paradigms in management and organisation theory"
    zh: "了解管理与组织理论的主要范式"
    zh-TW: "了解管理與組織理論的主要典範"
    ja: "経営・組織理論の主要なパラダイムを理解する"
    ko: "경영·조직 이론의 주요 패러다임 이해하기"
    vi: "Nắm các trường phái chính trong lý thuyết quản trị và tổ chức"
    ms: "Memahami paradigma utama teori pengurusan dan organisasi"
    id: "Memahami paradigma utama teori manajemen dan organisasi"
    hi: "प्रबंधन व संगठन सिद्धांत के प्रमुख प्रतिमान जानना"
  - en: "Critically evaluate theoretical contributions"
    zh: "批判地评估理论贡献"
    zh-TW: "批判地評估理論貢獻"
    ja: "理論的な貢献を批判的に評価する"
    ko: "이론적 기여 비판적으로 평가하기"
    vi: "Đánh giá phản biện các đóng góp lý thuyết"
    ms: "Menilai sumbangan teori secara kritis"
    id: "Menilai kontribusi teori secara kritis"
    hi: "सैद्धांतिक योगदानों का आलोचनात्मक मूल्यांकन"
