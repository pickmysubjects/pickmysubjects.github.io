code: ANCW10002
year: 2026
learn:
  en: "An introduction to ancient Greece and Rome: how their cultures grew, their links with the Near East, and their lasting legacy."
  zh: "古希腊罗马入门：文化如何发展、与近东的联系，以及深远影响。"
  zh-TW: "古希臘羅馬入門：文化如何發展、與近東的聯繫，以及深遠影響。"
  ja: "古代ギリシャ・ローマ入門。文化の発展、近東とのつながり、後世への影響を学ぶ。"
  ko: "고대 그리스·로마 입문: 문화의 발전, 근동과의 연결, 오랜 유산을 배운다."
  vi: "Nhập môn Hy Lạp và La Mã cổ đại: văn hóa phát triển ra sao, mối liên hệ với Cận Đông và di sản lâu dài."
  ms: "Pengenalan Yunani dan Rom kuno: perkembangan budayanya, kaitan dengan Timur Dekat, dan warisannya."
  id: "Pengantar Yunani dan Romawi kuno: perkembangan budayanya, kaitannya dengan Timur Dekat, dan warisannya."
  hi: "प्राचीन यूनान और रोम का परिचय: उनकी संस्कृतियाँ कैसे बढ़ीं, निकट पूर्व से संबंध और उनकी स्थायी विरासत।"
outcomes:
  - en: "Outline the growth of Greek and Roman culture"
    zh: "概述希腊罗马文化的发展"
    zh-TW: "概述希臘羅馬文化的發展"
    ja: "ギリシャ・ローマ文化の発展をまとめる"
    ko: "그리스·로마 문화의 발전 정리하기"
    vi: "Tóm tắt sự phát triển của văn hóa Hy Lạp, La Mã"
    ms: "Ringkaskan perkembangan budaya Yunani dan Rom"
    id: "Merangkum perkembangan budaya Yunani dan Romawi"
    hi: "यूनानी और रोमन संस्कृति के विकास की रूपरेखा देना"
  - en: "Explain links with the ancient Near East"
    zh: "解释与古代近东的联系"
    zh-TW: "解釋與古代近東的聯繫"
    ja: "古代近東とのつながりを説明する"
    ko: "고대 근동과의 연결 설명하기"
    vi: "Giải thích mối liên hệ với Cận Đông cổ đại"
    ms: "Terangkan kaitan dengan Timur Dekat kuno"
    id: "Menjelaskan kaitan dengan Timur Dekat kuno"
    hi: "प्राचीन निकट पूर्व से संबंध समझाना"
  - en: "Analyse myths, art and texts as evidence"
    zh: "把神话、艺术和文本作为证据分析"
    zh-TW: "把神話、藝術和文本作為證據分析"
    ja: "神話・美術・テキストを資料として分析する"
    ko: "신화, 예술, 문헌을 증거로 분석하기"
    vi: "Phân tích thần thoại, nghệ thuật và văn bản như bằng chứng"
    ms: "Analisis mitos, seni dan teks sebagai bukti"
    id: "Menganalisis mitos, seni, dan teks sebagai bukti"
    hi: "मिथकों, कला और ग्रंथों का साक्ष्य के रूप में विश्लेषण करना"
