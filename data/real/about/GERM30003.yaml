code: GERM30003
year: 2026
learn:
  en: "High-level German on language, the self and identity, from Freud to current debates on gender and sexuality."
  zh: "高级德语：语言、自我与身份，从弗洛伊德到当下关于性别与性向的讨论。"
  zh-TW: "高級德語：語言、自我與身分，從佛洛伊德到當下關於性別與性向的討論。"
  ja: "上級ドイツ語で言語・自己・アイデンティティを考える。フロイトから性とジェンダーをめぐる今の議論まで。"
  ko: "고급 독일어로 언어·자아·정체성을 다룬다. 프로이트부터 젠더와 섹슈얼리티에 관한 현재 논쟁까지."
  vi: "Tiếng Đức trình độ cao về ngôn ngữ, bản thân và bản sắc, từ Freud đến tranh luận hiện nay về giới và tính dục."
  ms: "Bahasa Jerman tahap tinggi tentang bahasa, diri dan identiti, dari Freud hingga perdebatan semasa tentang gender dan seksualiti."
  id: "Bahasa Jerman tingkat tinggi tentang bahasa, diri dan identitas, dari Freud hingga debat terkini soal gender dan seksualitas."
  hi: "भाषा, स्व और पहचान पर उच्च-स्तरीय जर्मन, फ़्रायड से लेकर जेंडर व यौनिकता पर आज की बहसों तक।"
outcomes:
  - en: "Discuss social and cultural topics in German"
    zh: "用德语讨论社会和文化话题"
    zh-TW: "用德語討論社會和文化話題"
    ja: "社会や文化の話題をドイツ語で話し合う"
    ko: "사회·문화 주제를 독일어로 토론하기"
    vi: "Thảo luận chủ đề xã hội, văn hóa bằng tiếng Đức"
    ms: "Bincangkan topik sosial dan budaya dalam bahasa Jerman"
    id: "Membahas topik sosial dan budaya dalam bahasa Jerman"
    hi: "सामाजिक और सांस्कृतिक विषयों पर जर्मन में चर्चा करना"
  - en: "Read and write longer German texts"
    zh: "读写较长的德语文章"
    zh-TW: "讀寫較長的德語文章"
    ja: "長めのドイツ語の文章を読み書きする"
    ko: "긴 독일어 글 읽고 쓰기"
    vi: "Đọc và viết văn bản tiếng Đức dài hơn"
    ms: "Baca dan tulis teks bahasa Jerman yang lebih panjang"
    id: "Membaca dan menulis teks bahasa Jerman yang lebih panjang"
    hi: "लंबे जर्मन पाठ पढ़ना-लिखना"
  - en: "Give a clear presentation in German"
    zh: "用德语做清楚的口头报告"
    zh-TW: "用德語做清楚的口頭報告"
    ja: "ドイツ語で分かりやすく発表する"
    ko: "독일어로 명확하게 발표하기"
    vi: "Thuyết trình rõ ràng bằng tiếng Đức"
    ms: "Buat pembentangan yang jelas dalam bahasa Jerman"
    id: "Melakukan presentasi yang jelas dalam bahasa Jerman"
    hi: "जर्मन में स्पष्ट प्रस्तुति देना"
