code: GDES30005
year: 2026
learn:
  en: "Professional typography, from Gutenberg to digital: text setting, expressive and responsive type for graphic design."
  zh: "面向职业的字体排印：从古腾堡到数字时代，正文排版、表现性与响应式字体。"
  zh-TW: "面向職場的字體排印：從古騰堡到數位時代，內文排版、表現性與響應式字體。"
  ja: "グーテンベルクからデジタルまでのタイポグラフィ。本文組版、表現的・レスポンシブな文字。"
  ko: "구텐베르크부터 디지털까지 실무 타이포그래피: 본문 조판, 표현적·반응형 타입."
  vi: "Typography chuyên nghiệp từ Gutenberg đến số: dàn chữ, chữ biểu cảm và chữ đáp ứng."
  ms: "Tipografi profesional dari Gutenberg ke digital: susun teks, taip ekspresif dan responsif."
  id: "Tipografi profesional dari Gutenberg ke digital: tata teks, huruf ekspresif dan responsif."
  hi: "गुटेनबर्ग से डिजिटल तक प्रोफ़ेशनल टाइपोग्राफ़ी: टेक्स्ट सेटिंग, अभिव्यंजक और रिस्पॉन्सिव टाइप।"
outcomes:
  - en: "Set clear, well-crafted text"
    zh: "排出清晰、精致的正文"
    zh-TW: "排出清晰、精緻的內文"
    ja: "読みやすく丁寧に本文を組む"
    ko: "명확하고 정교하게 본문 조판하기"
    vi: "Dàn chữ rõ ràng, tinh tế"
    ms: "Susun teks yang jelas dan kemas"
    id: "Menata teks yang jelas dan rapi"
    hi: "साफ़ और सधा हुआ टेक्स्ट सेट करना"
  - en: "Use type expressively to fit a brief"
    zh: "按设计要求富有表现力地使用字体"
    zh-TW: "依設計需求富表現力地使用字體"
    ja: "課題に合わせ文字を表現的に使う"
    ko: "브리프에 맞게 타입을 표현적으로 쓰기"
    vi: "Dùng chữ biểu cảm đúng yêu cầu"
    ms: "Guna taip secara ekspresif ikut taklimat"
    id: "Memakai huruf secara ekspresif sesuai brief"
    hi: "ब्रीफ़ के हिसाब से टाइप का अभिव्यंजक उपयोग"
  - en: "Build an industry-ready typography folio"
    zh: "完成面向行业的字体作品集"
    zh-TW: "完成面向產業的字體作品集"
    ja: "業界向けの文字作品集をつくる"
    ko: "업계용 타이포그래피 포트폴리오 만들기"
    vi: "Làm hồ sơ typography sẵn sàng đi làm"
    ms: "Bina folio tipografi sedia industri"
    id: "Menyusun portofolio tipografi siap industri"
    hi: "इंडस्ट्री-तैयार टाइपोग्राफ़ी फ़ोलियो बनाना"
