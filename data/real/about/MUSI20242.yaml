code: MUSI20242
year: 2026
learn:
  en: "West African drumming, bells, singing and dance, learned in weekly workshops with traditional musicians."
  zh: "在每周工作坊中跟随传统艺人学习西非鼓、铃、歌唱与舞蹈。"
  zh-TW: "在每週工作坊中跟隨傳統藝人學習西非鼓、鈴、歌唱與舞蹈。"
  ja: "伝統音楽家との週1回のワークショップで西アフリカの太鼓・鈴・踊りを学ぶ。"
  ko: "전통 음악가와 매주 워크숍에서 서아프리카 북·종·춤을 배운다."
  vi: "Học trống, chuông, hát và múa Tây Phi qua workshop hằng tuần với nghệ nhân."
  ms: "Belajar gendang, loceng dan tarian Afrika Barat dalam bengkel mingguan."
  id: "Belajar kendang, lonceng dan tari Afrika Barat di lokakarya mingguan."
  hi: "पारंपरिक कलाकारों के साथ साप्ताहिक कार्यशालाओं में पश्चिम अफ़्रीकी ढोल, घंटी और नृत्य।"
outcomes:
  - en: "Play basic West African rhythm patterns"
    zh: "演奏基本的西非节奏型"
    zh-TW: "演奏基本的西非節奏型"
    ja: "西アフリカの基本リズムを演奏する"
    ko: "서아프리카 기본 리듬 패턴 연주하기"
    vi: "Chơi các tiết tấu Tây Phi cơ bản"
    ms: "Mainkan corak irama asas Afrika Barat"
    id: "Memainkan pola ritme dasar Afrika Barat"
    hi: "पश्चिम अफ़्रीकी बुनियादी ताल बजाना"
  - en: "Dance and drum together as an ensemble"
    zh: "作为乐团一起跳舞和打鼓"
    zh-TW: "作為樂團一起跳舞和打鼓"
    ja: "アンサンブルとして踊り演奏する"
    ko: "앙상블로 함께 춤추고 북 치기"
    vi: "Vừa múa vừa đánh trống cùng nhóm"
    ms: "Menari dan bergendang bersama kumpulan"
    id: "Menari dan menabuh bersama ansambel"
    hi: "समूह में साथ नाचना और ढोल बजाना"
  - en: "Appreciate music from another cultural tradition"
    zh: "欣赏另一文化传统的音乐"
    zh-TW: "欣賞另一文化傳統的音樂"
    ja: "異なる文化の音楽を理解し味わう"
    ko: "다른 문화 전통의 음악 이해하기"
    vi: "Trân trọng âm nhạc của một truyền thống khác"
    ms: "Hargai muzik daripada tradisi budaya lain"
    id: "Menghargai musik dari tradisi budaya lain"
    hi: "दूसरी सांस्कृतिक परंपरा के संगीत को समझना"
