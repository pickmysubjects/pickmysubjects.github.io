code: DNCE30030
year: 2026
learn:
  en: "Career skills for dancers: auditions, pitches, budgets, CVs, funding applications and an online portfolio, with industry guests."
  zh: "舞者的职业技能：试镜、提案、预算、简历、资助申请和在线作品集。"
  zh-TW: "舞者的職業技能：試鏡、提案、預算、履歷、補助申請和線上作品集。"
  ja: "ダンサーのキャリア術：オーディション、企画、予算、履歴書、助成申請、オンライン作品集。"
  ko: "무용수 커리어 기술: 오디션, 피칭, 예산, 이력서, 지원금 신청, 온라인 포트폴리오."
  vi: "Kỹ năng nghề cho vũ công: thử vai, thuyết trình ý tưởng, ngân sách, CV, xin tài trợ, hồ sơ trực tuyến."
  ms: "Kemahiran kerjaya penari: uji bakat, pic, bajet, CV, permohonan dana dan portfolio dalam talian."
  id: "Keterampilan karier penari: audisi, pitching, anggaran, CV, pengajuan dana dan portofolio daring."
  hi: "डांसरों के करियर कौशल: ऑडिशन, पिच, बजट, CV, फ़ंडिंग आवेदन और ऑनलाइन पोर्टफ़ोलियो।"
outcomes:
  - en: "Pitch a project to industry as a group"
    zh: "小组向业界做项目提案"
    zh-TW: "小組向業界做專案提案"
    ja: "グループで業界に企画を提案する"
    ko: "그룹으로 업계에 프로젝트 피칭하기"
    vi: "Cùng nhóm thuyết trình dự án cho giới nghề"
    ms: "Pic projek kepada industri berkumpulan"
    id: "Mempresentasikan proyek ke industri berkelompok"
    hi: "समूह में इंडस्ट्री के सामने प्रोजेक्ट पिच करना"
  - en: "Build an online portfolio and CV"
    zh: "制作在线作品集与简历"
    zh-TW: "製作線上作品集與履歷"
    ja: "オンライン作品集と履歴書を作る"
    ko: "온라인 포트폴리오와 이력서 만들기"
    vi: "Làm hồ sơ năng lực trực tuyến và CV"
    ms: "Bina portfolio dalam talian dan CV"
    id: "Membuat portofolio daring dan CV"
    hi: "ऑनलाइन पोर्टफ़ोलियो और CV बनाना"
  - en: "Plan a sustainable career path in dance"
    zh: "规划可持续的舞蹈职业道路"
    zh-TW: "規劃可持續的舞蹈職涯"
    ja: "ダンスで続けられるキャリアを計画する"
    ko: "지속 가능한 무용 커리어 계획하기"
    vi: "Lên kế hoạch nghề múa bền vững"
    ms: "Rancang laluan kerjaya tarian yang mampan"
    id: "Merencanakan karier tari yang berkelanjutan"
    hi: "डांस में टिकाऊ करियर की योजना बनाना"
