code: ABPL90418
year: 2027
learn:
  en: "How Asian architects of the mid to late 20th century responded to modernism, colonialism, nationalism and heritage."
  zh: "20世纪中后期亚洲建筑师如何回应现代主义、殖民、民族主义和遗产问题。"
  zh-TW: "20世紀中後期亞洲建築師如何回應現代主義、殖民、民族主義和遺產問題。"
  ja: "20世紀中後期のアジアの建築家が近代主義・植民地・ナショナリズム・遺産にどう応えたか。"
  ko: "20세기 중후반 아시아 건축가들이 모더니즘, 식민, 민족주의, 유산에 어떻게 응답했는지."
  vi: "Kiến trúc sư châu Á giữa–cuối thế kỷ 20 ứng phó với chủ nghĩa hiện đại, thuộc địa, dân tộc và di sản."
  ms: "Cara arkitek Asia abad ke-20 menanggapi modenisme, kolonialisme, nasionalisme dan warisan."
  id: "Cara arsitek Asia abad ke-20 menanggapi modernisme, kolonialisme, nasionalisme, dan warisan."
  hi: "20वीं सदी के मध्य-उत्तरार्ध के एशियाई आर्किटेक्टों ने आधुनिकता, उपनिवेशवाद, राष्ट्रवाद व विरासत को कैसे देखा।"
