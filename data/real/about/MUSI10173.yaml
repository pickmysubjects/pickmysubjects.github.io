code: MUSI10173
year: 2026
learn:
  en: "Play in a guitar ensemble, from full-group pieces to duets, trios and quartets in many styles; nylon-string preferred."
  zh: "参加吉他合奏，曲目从全团合奏到二重奏、三重奏、四重奏，风格多样；建议用尼龙弦吉他。"
  zh-TW: "參加吉他合奏，曲目從全團合奏到二重奏、三重奏、四重奏，風格多樣；建議用尼龍弦吉他。"
  ja: "ギターアンサンブルで全体合奏から二重奏・三重奏・四重奏まで多様な曲を演奏。ナイロン弦推奨。"
  ko: "기타 앙상블에서 전체 합주부터 2·3·4중주까지 다양한 스타일 연주. 나일론 줄 기타 권장."
  vi: "Chơi trong nhóm guitar, từ bản hòa tấu lớn đến song tấu, tam tấu, tứ tấu nhiều phong cách; ưu tiên guitar dây nylon."
  ms: "Bermain dalam ensembel gitar, dari karya kumpulan besar hingga duet, trio dan kuartet; gitar tali nilon digalakkan."
  id: "Bermain dalam ensambel gitar, dari karya kelompok besar hingga duet, trio dan kuartet; disarankan gitar senar nilon."
  hi: "गिटार समूह में बड़े टुकड़ों से लेकर युगल, त्रय और चौकड़ी तक कई शैलियाँ; नायलॉन तार गिटार बेहतर।"
outcomes:
  - en: "Prepare your part for group rehearsals"
    zh: "为合排准备好自己的声部"
    zh-TW: "為合排準備好自己的聲部"
    ja: "合同練習に向けて自分のパートを準備する"
    ko: "합주를 위해 자기 파트 준비하기"
    vi: "Chuẩn bị phần của mình cho buổi tập"
    ms: "Sediakan bahagian sendiri untuk latihan"
    id: "Menyiapkan bagian sendiri untuk latihan"
    hi: "समूह रिहर्सल के लिए अपना भाग तैयार करना"
  - en: "Perform repertoire to concert standard"
    zh: "以音乐会水准演出曲目"
    zh-TW: "以音樂會水準演出曲目"
    ja: "演奏会レベルで曲を演奏する"
    ko: "연주회 수준으로 곡 연주하기"
    vi: "Biểu diễn tác phẩm ở chuẩn hòa nhạc"
    ms: "Persembahkan karya pada tahap konsert"
    id: "Membawakan repertoar setara konser"
    hi: "कॉन्सर्ट स्तर पर रचनाएँ प्रस्तुत करना"
  - en: "Know a range of ensemble repertoire"
    zh: "熟悉多种合奏曲目"
    zh-TW: "熟悉多種合奏曲目"
    ja: "さまざまなアンサンブル曲を知る"
    ko: "다양한 앙상블 레퍼토리 알기"
    vi: "Hiểu nhiều tác phẩm hòa tấu"
    ms: "Kenali pelbagai repertoir ensembel"
    id: "Mengenal beragam repertoar ensambel"
    hi: "विभिन्न समूह रचनाओं की जानकारी"
