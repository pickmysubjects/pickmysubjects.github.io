code: GEOL30003
year: 2026
learn:
  en: "How sedimentary rocks record Earth's 4-billion-year history, and how groundwater moves through them."
  zh: "沉积岩如何记录地球40亿年历史，以及地下水如何在其中流动。"
  zh-TW: "沉積岩如何記錄地球40億年歷史，以及地下水如何在其中流動。"
  ja: "堆積岩が地球40億年の歴史をどう記録し、地下水がどう流れるか。"
  ko: "퇴적암이 지구 40억 년 역사를 기록하는 방식과 그 속 지하수의 흐름."
  vi: "Đá trầm tích ghi lại 4 tỷ năm lịch sử Trái Đất ra sao, và nước ngầm chảy qua thế nào."
  ms: "Cara batuan sedimen merekod 4 bilion tahun sejarah Bumi, dan aliran air bawah tanah."
  id: "Cara batuan sedimen merekam 4 miliar tahun sejarah Bumi, dan aliran air tanah di dalamnya."
  hi: "अवसादी चट्टानें पृथ्वी के 4 अरब वर्षों का इतिहास कैसे दर्ज करती हैं, और भूजल उनमें कैसे बहता है।"
outcomes:
  - en: "Measure and describe stratigraphic sections"
    zh: "测量并描述地层剖面"
    zh-TW: "測量並描述地層剖面"
    ja: "地層断面を測定し記載する"
    ko: "층서 단면 측정·기술하기"
    vi: "Đo và mô tả mặt cắt địa tầng"
    ms: "Ukur dan huraikan keratan stratigrafi"
    id: "Mengukur dan mendeskripsikan penampang stratigrafi"
    hi: "स्तरिक खंड मापना और वर्णन करना"
  - en: "Explain groundwater flow and water budgets"
    zh: "解释地下水流动和水量平衡"
    zh-TW: "解釋地下水流動與水量平衡"
    ja: "地下水の流れと水収支を説明する"
    ko: "지하수 흐름과 물 수지 설명하기"
    vi: "Giải thích dòng chảy và cân bằng nước ngầm"
    ms: "Terangkan aliran dan bajet air bawah tanah"
    id: "Menjelaskan aliran dan neraca air tanah"
    hi: "भूजल प्रवाह और जल बजट समझाना"
