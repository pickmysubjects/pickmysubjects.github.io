code: SOCI30001
year: 2026
learn:
  en: "Major recent theories in sociology on power, order, conflict, globalisation and identity, and how research uses them."
  zh: "当代社会学关于权力、秩序、冲突、全球化和身份的主要理论，以及研究如何运用它们。"
  zh-TW: "當代社會學關於權力、秩序、衝突、全球化和身分的主要理論，以及研究如何運用它們。"
  ja: "権力・秩序・対立・グローバル化・アイデンティティをめぐる現代社会学の主要理論と、研究での使われ方。"
  ko: "권력·질서·갈등·세계화·정체성에 관한 현대 사회학 이론과 연구에서의 활용을 배운다."
  vi: "Các lý thuyết xã hội học gần đây về quyền lực, trật tự, xung đột, toàn cầu hóa và bản sắc, và cách nghiên cứu dùng chúng."
  ms: "Teori sosiologi terkini tentang kuasa, ketertiban, konflik, globalisasi dan identiti, serta cara kajian menggunakannya."
  id: "Teori sosiologi mutakhir tentang kekuasaan, keteraturan, konflik, globalisasi dan identitas, serta cara riset memakainya."
  hi: "सत्ता, व्यवस्था, संघर्ष, वैश्वीकरण और पहचान पर समाजशास्त्र के हाल के बड़े सिद्धांत और शोध में उनका उपयोग।"
outcomes:
  - en: "Explain major contemporary sociological theories"
    zh: "说明主要的当代社会学理论"
    zh-TW: "說明主要的當代社會學理論"
    ja: "主な現代社会学理論を説明する"
    ko: "주요 현대 사회학 이론 설명하기"
    vi: "Giải thích các lý thuyết xã hội học đương đại chính"
    ms: "Terangkan teori sosiologi kontemporari utama"
    id: "Menjelaskan teori sosiologi kontemporer utama"
    hi: "मुख्य समकालीन समाजशास्त्रीय सिद्धांत समझाना"
  - en: "Use theory to analyse globalisation and identity"
    zh: "运用理论分析全球化与身份"
    zh-TW: "運用理論分析全球化與身分"
    ja: "理論を使ってグローバル化とアイデンティティを分析する"
    ko: "이론으로 세계화와 정체성 분석하기"
    vi: "Dùng lý thuyết phân tích toàn cầu hóa và bản sắc"
    ms: "Guna teori untuk analisis globalisasi dan identiti"
    id: "Memakai teori untuk menganalisis globalisasi dan identitas"
    hi: "वैश्वीकरण और पहचान का सिद्धांत से विश्लेषण करना"
  - en: "Evaluate how research builds and tests theory"
    zh: "评估研究如何构建和检验理论"
    zh-TW: "評估研究如何建構和檢驗理論"
    ja: "研究が理論をどう作り検証するか評価する"
    ko: "연구가 이론을 세우고 검증하는 방식 평가하기"
    vi: "Đánh giá cách nghiên cứu xây dựng và kiểm chứng lý thuyết"
    ms: "Nilai cara kajian membina dan menguji teori"
    id: "Menilai cara riset membangun dan menguji teori"
    hi: "शोध सिद्धांत कैसे बनाता और परखता है, आंकना"
