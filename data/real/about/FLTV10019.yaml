code: FLTV10019
year: 2026
learn:
  en: "Make a short animated film through every stage of production, plus an introduction to digital 3D animation."
  zh: "经历制作全流程完成一部动画短片，并入门数字 3D 动画。"
  zh-TW: "經歷製作全流程完成一部動畫短片，並入門數位 3D 動畫。"
  ja: "制作の全工程を経て短編アニメを作り、デジタル3Dの入門も学ぶ。"
  ko: "제작 전 과정을 거쳐 단편 애니메이션을 만들고 디지털 3D 입문도 배운다."
  vi: "Làm phim hoạt hình ngắn qua mọi khâu sản xuất, cùng nhập môn hoạt hình 3D kỹ thuật số."
  ms: "Hasilkan filem animasi pendek melalui setiap peringkat produksi, serta pengenalan animasi 3D digital."
  id: "Membuat film animasi pendek melalui semua tahap produksi, plus pengantar animasi 3D digital."
  hi: "प्रोडक्शन के हर चरण से गुज़रकर छोटी एनिमेटेड फ़िल्म बनाना, साथ में डिजिटल 3D की शुरुआत।"
outcomes:
  - en: "Plan an animation in pre-production"
    zh: "在前期制作中规划动画"
    zh-TW: "在前期製作中規劃動畫"
    ja: "プリプロダクションでアニメを計画する"
    ko: "프리프로덕션에서 애니메이션 기획하기"
    vi: "Lên kế hoạch hoạt hình ở khâu tiền kỳ"
    ms: "Rancang animasi dalam praproduksi"
    id: "Merencanakan animasi di praproduksi"
    hi: "प्री-प्रोडक्शन में एनिमेशन की योजना"
  - en: "Animate simple sequences in digital 3D"
    zh: "用数字 3D 制作简单动画片段"
    zh-TW: "用數位 3D 製作簡單動畫片段"
    ja: "デジタル3Dで簡単なシーンを動かす"
    ko: "디지털 3D로 간단한 시퀀스 만들기"
    vi: "Làm đoạn hoạt hình 3D đơn giản"
    ms: "Animasikan urutan mudah dalam 3D digital"
    id: "Menganimasikan sekuens sederhana dalam 3D"
    hi: "डिजिटल 3D में सरल सीक्वेंस एनिमेट करना"
  - en: "Finish a 30-to-60-second short film"
    zh: "完成一部 30-60 秒短片"
    zh-TW: "完成一部 30-60 秒短片"
    ja: "30〜60秒の短編を完成させる"
    ko: "30~60초 단편 완성하기"
    vi: "Hoàn thành phim ngắn 30-60 giây"
    ms: "Siapkan filem pendek 30-60 saat"
    id: "Menyelesaikan film pendek 30-60 detik"
    hi: "30-60 सेकंड की शॉर्ट फ़िल्म पूरी करना"
