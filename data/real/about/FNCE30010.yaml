code: FNCE30010
year: 2026
learn:
  en: "How modern electronic markets work and how trading robots are designed, tested and used."
  zh: "现代电子市场如何运作，以及交易机器人的设计、测试和使用。"
  zh-TW: "現代電子市場如何運作，以及交易機器人的設計、測試和使用。"
  ja: "現代の電子市場の仕組みと、取引ロボットの設計・検証・活用。"
  ko: "현대 전자 시장의 작동 방식과 트레이딩 로봇의 설계·검증·활용."
  vi: "Thị trường điện tử hiện đại vận hành ra sao và cách thiết kế, kiểm thử, sử dụng robot giao dịch."
  ms: "Cara pasaran elektronik moden berfungsi dan cara robot dagangan direka, diuji dan digunakan."
  id: "Cara pasar elektronik modern bekerja dan cara robot trading dirancang, diuji, dan dipakai."
  hi: "आधुनिक इलेक्ट्रॉनिक बाज़ार कैसे चलते हैं और ट्रेडिंग रोबोट कैसे बनाए, जाँचे और इस्तेमाल किए जाते हैं।"
outcomes:
  - en: "Explain how market microstructure works"
    zh: "解释市场微观结构"
    zh-TW: "解釋市場微結構"
    ja: "市場のマイクロストラクチャーを説明する"
    ko: "시장 미시구조 설명하기"
    vi: "Giải thích vi cấu trúc thị trường"
    ms: "Terangkan struktur mikro pasaran"
    id: "Menjelaskan mikrostruktur pasar"
    hi: "मार्केट माइक्रोस्ट्रक्चर समझाना"
  - en: "Design and back-test trading algorithms"
    zh: "设计并回测交易算法"
    zh-TW: "設計並回測交易演算法"
    ja: "取引アルゴリズムを設計しバックテストする"
    ko: "트레이딩 알고리즘 설계하고 백테스트하기"
    vi: "Thiết kế và kiểm thử ngược thuật toán giao dịch"
    ms: "Reka dan uji semula algoritma dagangan"
    id: "Merancang dan melakukan back-test algoritma trading"
    hi: "ट्रेडिंग एल्गोरिदम बनाना और बैक-टेस्ट करना"
  - en: "Weigh the pros and cons of algorithmic trading"
    zh: "权衡算法交易的利弊"
    zh-TW: "權衡演算法交易的利弊"
    ja: "アルゴリズム取引の長所と短所を考える"
    ko: "알고리즘 트레이딩의 장단점 따지기"
    vi: "Cân nhắc ưu nhược điểm của giao dịch thuật toán"
    ms: "Timbang kebaikan dan keburukan dagangan algoritma"
    id: "Menimbang untung rugi trading algoritmik"
    hi: "एल्गोरिदमिक ट्रेडिंग के फ़ायदे-नुकसान तौलना"
