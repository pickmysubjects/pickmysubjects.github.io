code: CHIN20008
year: 2026
learn:
  en: "Political, social and cultural change in China since 1976, from the end of the Mao era to its current place in the world."
  zh: "1976年以来中国的政治、社会和文化变化，从毛泽东时代结束到如今的国际地位。"
  zh-TW: "1976年以來中國的政治、社會和文化變化，從毛澤東時代結束到如今的國際地位。"
  ja: "1976年以降の中国の政治・社会・文化の変化を、毛沢東時代の終わりから今日の国際的地位まで学ぶ。"
  ko: "1976년 이후 중국의 정치·사회·문화 변화를 마오 시대의 끝부터 오늘날 국제적 위상까지 배운다."
  vi: "Biến đổi chính trị, xã hội, văn hóa ở Trung Quốc từ 1976, từ cuối thời Mao đến vị thế hiện nay trên thế giới."
  ms: "Perubahan politik, sosial dan budaya di China sejak 1976, dari akhir era Mao hingga kedudukannya di dunia kini."
  id: "Perubahan politik, sosial, dan budaya di Tiongkok sejak 1976, dari akhir era Mao hingga posisinya di dunia saat ini."
  hi: "1976 से चीन में राजनीतिक, सामाजिक और सांस्कृतिक बदलाव, माओ युग के अंत से आज की वैश्विक स्थिति तक।"
outcomes:
  - en: "Outline major events in China since 1976"
    zh: "概述1976年以来中国的重大事件"
    zh-TW: "概述1976年以來中國的重大事件"
    ja: "1976年以降の中国の主な出来事をまとめる"
    ko: "1976년 이후 중국의 주요 사건 정리하기"
    vi: "Tóm tắt các sự kiện lớn ở Trung Quốc từ 1976"
    ms: "Ringkaskan peristiwa utama di China sejak 1976"
    id: "Merangkum peristiwa besar di Tiongkok sejak 1976"
    hi: "1976 से चीन की प्रमुख घटनाओं की रूपरेखा देना"
  - en: "Explain how reform grew out of socialism"
    zh: "解释改革如何从社会主义体制中发展而来"
    zh-TW: "解釋改革如何從社會主義體制中發展而來"
    ja: "改革が社会主義体制からどう生まれたか説明する"
    ko: "개혁이 사회주의 체제에서 어떻게 나왔는지 설명하기"
    vi: "Giải thích cải cách nảy sinh từ chế độ xã hội chủ nghĩa ra sao"
    ms: "Terangkan bagaimana reformasi lahir daripada sosialisme"
    id: "Menjelaskan bagaimana reformasi tumbuh dari sosialisme"
    hi: "सुधार समाजवादी व्यवस्था से कैसे निकला, समझाना"
  - en: "Analyse key issues facing China today"
    zh: "分析中国当前面临的关键问题"
    zh-TW: "分析中國當前面臨的關鍵問題"
    ja: "今の中国が抱える主要な課題を分析する"
    ko: "오늘날 중국이 마주한 핵심 문제 분석하기"
    vi: "Phân tích các vấn đề chính Trung Quốc đang đối mặt"
    ms: "Analisis isu utama yang dihadapi China kini"
    id: "Menganalisis isu utama yang dihadapi Tiongkok kini"
    hi: "आज चीन के सामने मुख्य मुद्दों का विश्लेषण करना"
