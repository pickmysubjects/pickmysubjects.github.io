code: GEND20011
year: 2026
learn:
  en: "How sexual norms have changed over time, and how power, culture, economics and medicine shape our sexual lives."
  zh: "性规范如何随时代变化，以及权力、文化、经济和医学如何塑造性生活。"
  zh-TW: "性規範如何隨時代變化，以及權力、文化、經濟和醫學如何塑造性生活。"
  ja: "性の規範が時代とともにどう変わり、権力・文化・経済・医学が性生活をどう形づくるかを学ぶ。"
  ko: "성 규범이 시대에 따라 어떻게 변했고 권력·문화·경제·의학이 성생활을 어떻게 만드는지 배운다."
  vi: "Chuẩn mực tình dục thay đổi qua thời gian ra sao, và quyền lực, văn hóa, kinh tế, y học định hình đời sống tình dục thế nào."
  ms: "Cara norma seksual berubah dari masa ke masa, dan cara kuasa, budaya, ekonomi dan perubatan membentuk kehidupan seksual."
  id: "Cara norma seksual berubah seiring waktu, dan cara kekuasaan, budaya, ekonomi, dan kedokteran membentuk kehidupan seksual."
  hi: "यौन मानदंड समय के साथ कैसे बदले, और सत्ता, संस्कृति, अर्थव्यवस्था व चिकित्सा यौन जीवन को कैसे गढ़ते हैं।"
outcomes:
  - en: "Trace key moments of change in sexual norms"
    zh: "梳理性规范变化的关键时刻"
    zh-TW: "梳理性規範變化的關鍵時刻"
    ja: "性規範の変化の重要な時点をたどる"
    ko: "성 규범 변화의 핵심 순간 따라가기"
    vi: "Lần theo các thời điểm thay đổi then chốt của chuẩn mực tình dục"
    ms: "Jejaki detik penting perubahan norma seksual"
    id: "Menelusuri momen penting perubahan norma seksual"
    hi: "यौन मानदंडों में बदलाव के मुख्य पल समझना"
  - en: "Explain sexuality as a social phenomenon"
    zh: "把性解释为一种社会现象"
    zh-TW: "把性解釋為一種社會現象"
    ja: "セクシュアリティを社会現象として説明する"
    ko: "섹슈얼리티를 사회 현상으로 설명하기"
    vi: "Giải thích tính dục như một hiện tượng xã hội"
    ms: "Terangkan seksualiti sebagai fenomena sosial"
    id: "Menjelaskan seksualitas sebagai fenomena sosial"
    hi: "यौनिकता को एक सामाजिक घटना के रूप में समझाना"
  - en: "Analyse case studies from different cultures"
    zh: "分析不同文化中的案例"
    zh-TW: "分析不同文化中的案例"
    ja: "さまざまな文化の事例を分析する"
    ko: "여러 문화의 사례 분석하기"
    vi: "Phân tích các ca từ những nền văn hóa khác nhau"
    ms: "Analisis kajian kes dari budaya berbeza"
    id: "Menganalisis studi kasus dari berbagai budaya"
    hi: "अलग-अलग संस्कृतियों के केस स्टडी का विश्लेषण करना"
