code: SCIE10009
year: 2026
learn:
  en: "Core chemistry for the Extended science degree: atoms, bonding, reactions and lab basics, in small seminars."
  zh: "扩展理学学位的化学基础：原子、化学键、反应与实验入门，小班研讨授课。"
  zh-TW: "延長理學學位的化學基礎：原子、化學鍵、反應與實驗入門，小班研討授課。"
  ja: "理学延長課程の化学基礎：原子、結合、反応、実験の基本を少人数で学ぶ。"
  ko: "확장 이학 학위의 화학 기초: 원자, 결합, 반응, 실험 기본을 소규모 세미나로."
  vi: "Hóa học nền tảng cho cử nhân Khoa học mở rộng: nguyên tử, liên kết, phản ứng."
  ms: "Asas kimia untuk ijazah Sains Lanjutan: atom, ikatan, tindak balas dan makmal."
  id: "Kimia dasar untuk gelar Sains Diperluas: atom, ikatan, reaksi dan dasar lab."
  hi: "एक्सटेंडेड साइंस डिग्री की बुनियादी केमिस्ट्री: परमाणु, बंधन, अभिक्रियाएँ।"
outcomes:
  - en: "Explain atoms, bonds and molecules"
    zh: "说明原子、化学键和分子"
    zh-TW: "說明原子、化學鍵與分子"
    ja: "原子・結合・分子を説明する"
    ko: "원자, 결합, 분자 설명하기"
    vi: "Giải thích nguyên tử, liên kết, phân tử"
    ms: "Jelaskan atom, ikatan dan molekul"
    id: "Menjelaskan atom, ikatan, dan molekul"
    hi: "परमाणु, बंधन और अणु समझाना"
  - en: "Work through common chemical reactions"
    zh: "掌握常见化学反应"
    zh-TW: "掌握常見化學反應"
    ja: "よくある化学反応を扱う"
    ko: "주요 화학 반응 다루기"
    vi: "Làm quen các phản ứng hóa học phổ biến"
    ms: "Kendalikan tindak balas kimia biasa"
    id: "Mengerjakan reaksi kimia umum"
    hi: "आम रासायनिक अभिक्रियाएँ हल करना"
  - en: "Build a base for first-year chemistry"
    zh: "为一年级化学打好基础"
    zh-TW: "為一年級化學打好基礎"
    ja: "1年次の化学への土台を作る"
    ko: "1학년 화학의 기초 다지기"
    vi: "Xây nền cho hóa học năm nhất"
    ms: "Bina asas untuk kimia tahun pertama"
    id: "Membangun dasar kimia tahun pertama"
    hi: "पहले साल की केमिस्ट्री की नींव बनाना"
