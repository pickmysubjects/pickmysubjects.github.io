code: VETS30014
year: 2026
learn:
  en: "The heart and blood vessels of domestic animals: how they work, go wrong, get examined and are treated with drugs."
  zh: "家畜的心血管系统：如何运作、如何出问题、如何检查及用药治疗。"
  zh-TW: "家畜的心血管系統：如何運作、如何出問題、如何檢查及用藥治療。"
  ja: "家畜の心血管系：働き、異常、診察、薬による治療。"
  ko: "가축의 심혈관계: 작동 원리, 이상, 검사, 약물 치료."
  vi: "Hệ tim mạch của vật nuôi: cách hoạt động, khi nào trục trặc, cách khám và điều trị bằng thuốc."
  ms: "Sistem kardiovaskular haiwan peliharaan: cara berfungsi, masalah, pemeriksaan dan rawatan ubat."
  id: "Sistem kardiovaskular hewan domestik: cara kerja, gangguan, pemeriksaan dan pengobatan."
  hi: "पालतू पशुओं का हृदय-रक्तवाहिनी तंत्र: कैसे काम करता है, कैसे बिगड़ता है, जांच और दवा से इलाज।"
outcomes:
  - en: "Do a clinical exam of an animal's heart system"
    zh: "对动物心血管系统做临床检查"
    zh-TW: "對動物心血管系統做臨床檢查"
    ja: "動物の心血管系を臨床診察する"
    ko: "동물 심혈관계 임상 검사 수행"
    vi: "Khám lâm sàng hệ tim mạch động vật"
    ms: "Jalankan pemeriksaan klinikal sistem jantung"
    id: "Melakukan pemeriksaan klinis sistem jantung"
    hi: "पशु के हृदय तंत्र की क्लिनिकल जांच करना"
  - en: "Read ECGs, histology and diagnostic images"
    zh: "判读心电图、组织切片和影像"
    zh-TW: "判讀心電圖、組織切片與影像"
    ja: "心電図・組織標本・画像を読む"
    ko: "심전도·조직표본·영상 판독"
    vi: "Đọc điện tim, mô học và hình ảnh chẩn đoán"
    ms: "Baca ECG, histologi dan imej diagnostik"
    id: "Membaca EKG, histologi dan citra diagnostik"
    hi: "ईसीजी, हिस्टोलॉजी और डायग्नोस्टिक इमेज पढ़ना"
  - en: "Explain how heart drugs are used in treatment"
    zh: "解释心血管药物的治疗用途"
    zh-TW: "解釋心血管藥物的治療用途"
    ja: "心血管薬の治療での使い方を説明する"
    ko: "심혈관 약물의 치료 용도 설명"
    vi: "Giải thích cách dùng thuốc tim mạch"
    ms: "Terangkan penggunaan ubat jantung"
    id: "Menjelaskan penggunaan obat jantung"
    hi: "हृदय दवाओं का इलाज में उपयोग समझाना"
