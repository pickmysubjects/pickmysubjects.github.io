code: ABPL90362
year: 2027
learn:
  en: "Complete a supervised property research thesis, from running your research plan to presenting the results."
  zh: "在导师指导下完成房地产研究论文，从执行研究计划到展示成果。"
  zh-TW: "在導師指導下完成房地產研究論文，從執行研究計畫到展示成果。"
  ja: "指導のもと、研究計画の実行から成果発表まで不動産研究論文を仕上げる。"
  ko: "지도 아래 연구 계획 실행부터 결과 발표까지 부동산 연구 논문을 완성합니다."
  vi: "Hoàn thành luận văn nghiên cứu bất động sản có hướng dẫn, từ thực hiện kế hoạch đến trình bày kết quả."
  ms: "Siapkan tesis kajian hartanah diselia, dari melaksana pelan kajian hingga membentangkan hasil."
  id: "Menyelesaikan tesis riset properti terbimbing, dari menjalankan rencana hingga menyajikan hasil."
  hi: "सुपरवाइज़र के साथ संपत्ति शोध थीसिस, योजना लागू करने से परिणाम प्रस्तुत करने तक।"
outcomes:
  - en: "Apply research methods to a property question"
    zh: "用研究方法解决房地产问题"
    zh-TW: "用研究方法解決房地產問題"
    ja: "不動産の問いに研究方法を使う"
    ko: "부동산 문제에 연구 방법 적용하기"
    vi: "Áp dụng phương pháp nghiên cứu cho vấn đề bất động sản"
    ms: "Menggunakan kaedah kajian pada isu hartanah"
    id: "Menerapkan metode riset pada masalah properti"
    hi: "संपत्ति प्रश्न पर शोध पद्धति लागू करना"
  - en: "Write and present a research thesis"
    zh: "撰写并展示研究论文"
    zh-TW: "撰寫並展示研究論文"
    ja: "研究論文を書き発表する"
    ko: "연구 논문 쓰고 발표하기"
    vi: "Viết và trình bày luận văn"
    ms: "Menulis dan membentang tesis kajian"
    id: "Menulis dan mempresentasikan tesis"
    hi: "शोध थीसिस लिखना और प्रस्तुत करना"
