code: POLS10003
year: 2026
learn:
  en: "Big ideas in Western political thought, like power, liberty, equality and democracy, read through famous texts from Machiavelli onwards."
  zh: "西方政治思想的核心概念：权力、自由、平等、民主，从马基雅维利起读经典文本。"
  zh-TW: "西方政治思想的核心概念：權力、自由、平等、民主，從馬基維利起讀經典文本。"
  ja: "権力・自由・平等・民主主義など西洋政治思想の大きな考え方を、マキャヴェッリ以降の有名な著作から学ぶ。"
  ko: "권력, 자유, 평등, 민주주의 같은 서양 정치사상의 핵심 개념을 마키아벨리 이후의 고전을 읽으며 배운다."
  vi: "Những ý tưởng lớn của tư tưởng chính trị phương Tây như quyền lực, tự do, bình đẳng, dân chủ qua các văn bản nổi tiếng từ Machiavelli."
  ms: "Idea besar pemikiran politik Barat seperti kuasa, kebebasan, kesaksamaan dan demokrasi, melalui teks terkenal sejak Machiavelli."
  id: "Gagasan besar pemikiran politik Barat seperti kekuasaan, kebebasan, kesetaraan, dan demokrasi, lewat teks terkenal sejak Machiavelli."
  hi: "पश्चिमी राजनीतिक चिंतन के बड़े विचार जैसे सत्ता, आज़ादी, समानता और लोकतंत्र, मैकियावेली से आगे के मशहूर ग्रंथों के ज़रिए।"
outcomes:
  - en: "Explain key ideas like power, sovereignty and liberty"
    zh: "解释权力、主权、自由等关键概念"
    zh-TW: "解釋權力、主權、自由等關鍵概念"
    ja: "権力・主権・自由といった重要概念を説明する"
    ko: "권력, 주권, 자유 같은 핵심 개념 설명하기"
    vi: "Giải thích các khái niệm như quyền lực, chủ quyền, tự do"
    ms: "Terangkan idea utama seperti kuasa, kedaulatan dan kebebasan"
    id: "Menjelaskan konsep kunci seperti kekuasaan, kedaulatan, dan kebebasan"
    hi: "सत्ता, संप्रभुता और आज़ादी जैसे मुख्य विचार समझाना"
  - en: "Read and analyse classic political texts"
    zh: "阅读并分析经典政治文本"
    zh-TW: "閱讀並分析經典政治文本"
    ja: "古典的な政治の著作を読み、分析する"
    ko: "고전 정치 텍스트를 읽고 분석하기"
    vi: "Đọc và phân tích các văn bản chính trị kinh điển"
    ms: "Baca dan analisis teks politik klasik"
    id: "Membaca dan menganalisis teks politik klasik"
    hi: "क्लासिक राजनीतिक ग्रंथ पढ़ना और उनका विश्लेषण करना"
  - en: "Connect old ideas to today's political debates"
    zh: "把这些思想和今天的政治争论联系起来"
    zh-TW: "把這些思想和今天的政治爭論連結起來"
    ja: "昔の考え方を今日の政治論争に結びつける"
    ko: "옛 사상을 오늘날 정치 논쟁과 연결하기"
    vi: "Liên hệ ý tưởng cũ với các tranh luận chính trị hiện nay"
    ms: "Kaitkan idea lama dengan perdebatan politik hari ini"
    id: "Mengaitkan gagasan lama dengan perdebatan politik sekarang"
    hi: "पुराने विचारों को आज की राजनीतिक बहसों से जोड़ना"
