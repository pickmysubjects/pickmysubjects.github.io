code: ABPL90241
year: 2027
learn:
  en: "How built environment and heritage professionals record, document and interpret significant places, including digital techniques."
  zh: "建成环境和遗产专业人员如何记录、建档和诠释重要场所，包括数字技术。"
  zh-TW: "建成環境與遺產專業人員如何記錄、建檔與詮釋重要場所，包括數位技術。"
  ja: "重要な場所を記録・文書化・解釈する方法。デジタル技術を含む。"
  ko: "중요한 장소를 기록·문서화·해석하는 방법. 디지털 기법 포함."
  vi: "Cách ghi chép, lập hồ sơ và diễn giải địa điểm có giá trị, gồm cả kỹ thuật số."
  ms: "Cara merekod, mendokumen dan mentafsir tempat bersejarah, termasuk teknik digital."
  id: "Cara merekam, mendokumentasikan dan menafsirkan tempat bersejarah, termasuk teknik digital."
  hi: "महत्वपूर्ण स्थानों को दर्ज करना, दस्तावेज़ बनाना और व्याख्या करना, डिजिटल तकनीकों सहित।"
outcomes:
  - en: "Document and interpret a Melbourne site as a group"
    zh: "小组记录并诠释墨尔本的一个场所"
    zh-TW: "小組記錄並詮釋墨爾本的一個場所"
    ja: "グループでメルボルンの場所を記録・解釈する"
    ko: "그룹으로 멜버른 장소 기록·해석하기"
    vi: "Ghi chép, diễn giải một địa điểm ở Melbourne"
    ms: "Mendokumen dan mentafsir tapak di Melbourne"
    id: "Mendokumentasikan dan menafsirkan situs di Melbourne"
    hi: "समूह में मेलबर्न की जगह का दस्तावेज़ीकरण"
  - en: "Reflect critically on ways of representing places"
    zh: "批判性反思场所的再现方式"
    zh-TW: "批判性反思場所的再現方式"
    ja: "場所の表現方法を批判的に振り返る"
    ko: "장소 재현 방식 비판적으로 성찰하기"
    vi: "Phản tư về cách thể hiện địa điểm"
    ms: "Merenung secara kritis cara mewakili tempat"
    id: "Merefleksikan cara merepresentasikan tempat"
    hi: "स्थानों के प्रस्तुतीकरण पर आलोचनात्मक चिंतन"
