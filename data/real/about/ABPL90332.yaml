code: ABPL90332
year: 2027
learn:
  en: "Managing people and teams in construction, with five industry guest presenters sharing real experience."
  zh: "建筑业中人和团队的管理，有五位行业嘉宾分享实际经验。"
  zh-TW: "營建業中人與團隊的管理，有五位業界講者分享實務經驗。"
  ja: "建設業の人とチームの管理。業界ゲスト5人が実体験を語る。"
  ko: "건설업의 인력·팀 관리. 업계 연사 5명이 실제 경험 공유."
  vi: "Quản lý con người và đội nhóm trong xây dựng, với năm khách mời từ ngành."
  ms: "Mengurus orang dan pasukan dalam pembinaan, dengan lima penceramah industri."
  id: "Mengelola orang dan tim di konstruksi, dengan lima pembicara tamu dari industri."
  hi: "निर्माण में लोगों और टीमों का प्रबंधन, पाँच उद्योग अतिथि वक्ताओं के साथ।"
outcomes:
  - en: "Explain how people are managed across construction roles"
    zh: "说明建筑业各岗位的人员管理方式"
    zh-TW: "說明營建業各職位的人員管理方式"
    ja: "建設の各職種での人の管理を説明する"
    ko: "건설 직무별 인력 관리 방식 설명하기"
    vi: "Giải thích cách quản lý người ở các vai trò"
    ms: "Menerangkan cara orang diurus dalam pelbagai peranan"
    id: "Menjelaskan cara orang dikelola di berbagai peran"
    hi: "निर्माण की भूमिकाओं में लोगों का प्रबंधन समझाना"
  - en: "Reflect on industry practice in written reports"
    zh: "在书面反思报告中分析行业实践"
    zh-TW: "在書面反思報告中分析業界實務"
    ja: "業界の実例を振り返りレポートにまとめる"
    ko: "업계 실무를 성찰 보고서로 정리하기"
    vi: "Viết báo cáo phản tư về thực tiễn ngành"
    ms: "Menulis laporan refleksi tentang amalan industri"
    id: "Menulis laporan reflektif tentang praktik industri"
    hi: "उद्योग अभ्यास पर चिंतनशील रिपोर्ट लिखना"
