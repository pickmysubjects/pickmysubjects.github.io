code: ACTL30006
year: 2026
learn:
  en: "Portfolio theory, utility, CAPM and arbitrage pricing, and random models of share prices for actuaries."
  zh: "投资组合理论、效用、CAPM与套利定价，以及股价随机模型。"
  zh-TW: "投資組合理論、效用、CAPM與套利定價，以及股價隨機模型。"
  ja: "ポートフォリオ理論、効用、CAPMと裁定価格、株価の確率モデル。"
  ko: "포트폴리오 이론, 효용, CAPM과 차익거래 가격결정, 주가의 확률 모형."
  vi: "Lý thuyết danh mục, hữu dụng, CAPM, định giá chênh lệch và mô hình giá cổ phiếu."
  ms: "Teori portfolio, utiliti, CAPM dan harga arbitraj, serta model rawak harga saham."
  id: "Teori portofolio, utilitas, CAPM dan arbitrase, serta model acak harga saham."
  hi: "पोर्टफोलियो थ्योरी, यूटिलिटी, CAPM व आर्बिट्राज प्राइसिंग, और शेयर कीमतों के रैंडम मॉडल।"
outcomes:
  - en: "Find mean-variance efficient portfolios"
    zh: "求出均值-方差有效投资组合"
    zh-TW: "求出均值-變異數有效投資組合"
    ja: "平均分散で効率的なポートフォリオを求める"
    ko: "평균-분산 효율 포트폴리오 구하기"
    vi: "Tìm danh mục hiệu quả theo trung bình-phương sai"
    ms: "Cari portfolio cekap min-varians"
    id: "Menemukan portofolio efisien mean-variance"
    hi: "मीन-वेरिएंस कुशल पोर्टफोलियो निकालना"
  - en: "Apply and critique CAPM and factor models"
    zh: "应用并评析CAPM和因子模型"
    zh-TW: "應用並評析CAPM和因子模型"
    ja: "CAPMとファクターモデルを使い評価する"
    ko: "CAPM과 요인 모형 적용하고 비판하기"
    vi: "Áp dụng và đánh giá CAPM, mô hình nhân tố"
    ms: "Guna dan kritik CAPM serta model faktor"
    id: "Menerapkan dan mengkritisi CAPM serta model faktor"
    hi: "CAPM और फ़ैक्टर मॉडल लागू करना और परखना"
  - en: "Use share price models to judge long-term risk"
    zh: "用股价模型评估长期风险"
    zh-TW: "用股價模型評估長期風險"
    ja: "株価モデルで長期リスクを評価する"
    ko: "주가 모형으로 장기 위험 평가하기"
    vi: "Dùng mô hình giá cổ phiếu đánh giá rủi ro dài hạn"
    ms: "Guna model harga saham untuk menilai risiko jangka panjang"
    id: "Memakai model harga saham untuk menilai risiko jangka panjang"
    hi: "शेयर कीमत मॉडल से दीर्घकालिक जोखिम आंकना"
