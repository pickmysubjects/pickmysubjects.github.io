code: HIST10016
year: 2026
learn:
  en: "Europe from the Black Death to the early 1600s: plague, war, the Reformations, witch trials and contact with the Americas."
  zh: "从黑死病到17世纪初的欧洲：瘟疫、战争、宗教改革、猎巫和与美洲的接触。"
  zh-TW: "從黑死病到17世紀初的歐洲：瘟疫、戰爭、宗教改革、獵巫和與美洲的接觸。"
  ja: "黒死病から17世紀初めまでのヨーロッパ。疫病、戦争、宗教改革、魔女裁判、アメリカ大陸との接触。"
  ko: "흑사병부터 17세기 초까지의 유럽, 역병, 전쟁, 종교개혁, 마녀재판, 아메리카와의 만남을 다룬다."
  vi: "Châu Âu từ Cái chết Đen đến đầu thế kỷ 17: dịch bệnh, chiến tranh, Cải cách tôn giáo, săn phù thủy và tiếp xúc với châu Mỹ."
  ms: "Eropah dari Wabak Hitam hingga awal 1600-an: wabak, perang, Reformasi, perbicaraan ahli sihir dan hubungan dengan Amerika."
  id: "Eropa dari Maut Hitam hingga awal 1600-an: wabah, perang, Reformasi, pengadilan penyihir, dan kontak dengan Amerika."
  hi: "ब्लैक डेथ से 1600 के दशक की शुरुआत तक का यूरोप: महामारी, युद्ध, धर्मसुधार, डायन मुकदमे और अमेरिका से संपर्क।"
outcomes:
  - en: "Describe Europe's main changes from 1348 to 1618"
    zh: "描述1348至1618年欧洲的主要变化"
    zh-TW: "描述1348至1618年歐洲的主要變化"
    ja: "1348〜1618年のヨーロッパの主な変化を説明する"
    ko: "1348~1618년 유럽의 주요 변화 설명하기"
    vi: "Mô tả những thay đổi chính của châu Âu từ 1348 đến 1618"
    ms: "Huraikan perubahan utama Eropah dari 1348 hingga 1618"
    id: "Menguraikan perubahan utama Eropa dari 1348 hingga 1618"
    hi: "1348 से 1618 तक यूरोप के मुख्य बदलावों का वर्णन करना"
  - en: "Assess the long-term effects of the Black Death"
    zh: "评估黑死病的长期影响"
    zh-TW: "評估黑死病的長期影響"
    ja: "黒死病の長期的な影響を評価する"
    ko: "흑사병의 장기적 영향 평가하기"
    vi: "Đánh giá tác động lâu dài của Cái chết Đen"
    ms: "Nilai kesan jangka panjang Wabak Hitam"
    id: "Menilai dampak jangka panjang Maut Hitam"
    hi: "ब्लैक डेथ के दीर्घकालिक असर का आकलन करना"
  - en: "Write about the past using primary sources"
    zh: "利用一手史料书写历史"
    zh-TW: "利用一手史料書寫歷史"
    ja: "一次史料を使って過去について書く"
    ko: "1차 사료를 활용해 과거에 대해 글쓰기"
    vi: "Viết về quá khứ bằng nguồn sử liệu sơ cấp"
    ms: "Menulis tentang masa lalu dengan sumber primer"
    id: "Menulis tentang masa lalu dengan sumber primer"
    hi: "प्राथमिक स्रोतों से अतीत के बारे में लिखना"
