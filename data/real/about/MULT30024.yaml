code: MULT30024
year: 2027
learn:
  en: "Teams propose a business venture that helps Australia progress on a UN Sustainable Development Goal."
  zh: "团队提出一个创业构想，帮助澳大利亚推进联合国可持续发展目标。"
  zh-TW: "團隊提出一個創業構想，協助澳洲推進聯合國永續發展目標。"
  ja: "チームで、国連の持続可能な開発目標に向けたオーストラリアの取り組みを進める事業案を提案する。"
  ko: "팀으로 호주의 유엔 지속가능발전목표(SDG) 달성을 돕는 창업 아이디어 제안."
  vi: "Nhóm đề xuất một dự án khởi nghiệp giúp Úc tiến tới một Mục tiêu Phát triển Bền vững của Liên Hợp Quốc."
  ms: "Pasukan mencadangkan usaha keusahawanan untuk membantu Australia mencapai Matlamat Pembangunan Mampan PBB."
  id: "Tim mengusulkan usaha wirausaha yang membantu Australia mencapai Tujuan Pembangunan Berkelanjutan PBB."
  hi: "टीमें एक उद्यम का प्रस्ताव देती हैं जो ऑस्ट्रेलिया को संयुक्त राष्ट्र के किसी सतत विकास लक्ष्य पर आगे बढ़ाए।"
outcomes:
  - en: "Use the SDGs to shape a business idea"
    zh: "用可持续发展目标框架形成创业构想"
    zh-TW: "用永續發展目標框架形成創業構想"
    ja: "SDGsの枠組みで事業アイデアを形にする"
    ko: "SDG 틀로 창업 아이디어 구체화하기"
    vi: "Dùng khung SDG để định hình ý tưởng kinh doanh"
    ms: "Guna rangka SDG untuk membentuk idea perniagaan"
    id: "Memakai kerangka SDG untuk membentuk ide usaha"
    hi: "SDG ढाँचे से उद्यम का विचार गढ़ना"
  - en: "Use startup tools to tackle a real problem"
    zh: "用创业工具和方法解决真实问题"
    zh-TW: "用創業工具和方法解決真實問題"
    ja: "起業の手法で実際の課題に取り組む"
    ko: "창업 도구와 방법으로 실제 문제 다루기"
    vi: "Dùng công cụ khởi nghiệp để giải quyết vấn đề thực tế"
    ms: "Guna alat keusahawanan untuk menangani masalah sebenar"
    id: "Memakai alat kewirausahaan untuk menangani masalah nyata"
    hi: "उद्यमिता के टूल्स से असल समस्या सुलझाना"
  - en: "Pitch your idea to peers and the community"
    zh: "向同学和社区推介你的构想"
    zh-TW: "向同學和社區推銷你的構想"
    ja: "仲間や地域の人々にアイデアをピッチする"
    ko: "동료와 지역사회 앞에서 아이디어 피칭하기"
    vi: "Thuyết trình ý tưởng trước bạn học và cộng đồng"
    ms: "Bentangkan idea kepada rakan dan komuniti"
    id: "Mempresentasikan ide kepada teman dan komunitas"
    hi: "साथियों और समुदाय के सामने अपना विचार पेश करना"
