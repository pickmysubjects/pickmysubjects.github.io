code: BTCH30003
year: 2026
learn:
  en: "How biotech discoveries go from the lab to market, including intellectual property, regulation and funding."
  zh: "生物技术怎样从实验室走向市场：知识产权、监管和资金。"
  zh-TW: "生物技術如何從實驗室走向市場：智慧財產權、監管和資金。"
  ja: "バイオテクの発見が研究室から市場に出るまで。知的財産、規制、資金調達を含む。"
  ko: "생명공학 발견이 실험실에서 시장으로 가는 과정. 지식재산, 규제, 자금 포함."
  vi: "Phát hiện công nghệ sinh học đi từ phòng thí nghiệm ra thị trường ra sao: sở hữu trí tuệ, quản lý, vốn."
  ms: "Cara penemuan biotek pergi dari makmal ke pasaran, termasuk harta intelek, peraturan dan pembiayaan."
  id: "Cara temuan bioteknologi dari lab ke pasar, termasuk kekayaan intelektual, regulasi, dan pendanaan."
  hi: "बायोटेक खोजें लैब से मार्केट तक कैसे जाती हैं, बौद्धिक संपदा, नियमन और फ़ंडिंग समेत।"
outcomes:
  - en: "Assess the commercial potential of a biotech"
    zh: "评估生物技术的商业潜力"
    zh-TW: "評估生物技術的商業潛力"
    ja: "バイオテクの商業的な可能性を評価する"
    ko: "생명공학 기술의 상업적 잠재력 평가하기"
    vi: "Đánh giá tiềm năng thương mại của một công nghệ sinh học"
    ms: "Nilai potensi komersial sesuatu biotek"
    id: "Menilai potensi komersial suatu bioteknologi"
    hi: "किसी बायोटेक की कमर्शियल संभावना आँकना"
  - en: "Pitch the value of a new biotech product"
    zh: "讲清新生物技术的价值"
    zh-TW: "講清新生物技術的價值"
    ja: "新しいバイオテク製品の価値を売り込む"
    ko: "새 생명공학 제품의 가치 피칭하기"
    vi: "Thuyết trình giá trị của sản phẩm sinh học mới"
    ms: "Pitch nilai produk biotek baharu"
    id: "Mem-pitch nilai produk bioteknologi baru"
    hi: "नए बायोटेक प्रोडक्ट की वैल्यू पिच करना"
  - en: "Weigh the ethical and social impacts"
    zh: "权衡伦理和社会影响"
    zh-TW: "權衡倫理和社會影響"
    ja: "倫理的・社会的な影響を比較検討する"
    ko: "윤리적·사회적 영향 따져보기"
    vi: "Cân nhắc tác động đạo đức và xã hội"
    ms: "Timbang kesan etika dan sosial"
    id: "Menimbang dampak etis dan sosial"
    hi: "नैतिक और सामाजिक असर तौलना"
