code: EDUC10051
year: 2026
learn:
  en: "How to plan, run and reflect on sports coaching sessions, drawing on sports psychology, pedagogy and motor learning."
  zh: "结合运动心理学和教学法，学习规划、执教并反思体育训练课。"
  zh-TW: "結合運動心理學與教學法，學習規劃、執教並反思運動訓練課。"
  ja: "スポーツ心理学や指導法をもとに、コーチングの計画・実施・振り返りを学ぶ。"
  ko: "스포츠 심리학과 교수법을 바탕으로 코칭 세션을 계획·진행·성찰하는 법."
  vi: "Cách lên kế hoạch, dẫn dắt và rút kinh nghiệm buổi huấn luyện thể thao, dựa trên tâm lý học thể thao."
  ms: "Cara merancang, mengendali dan menilai sesi kejurulatihan sukan, berdasarkan psikologi sukan dan pedagogi."
  id: "Cara merencanakan, menjalankan, dan merefleksikan sesi melatih olahraga, berbekal psikologi olahraga."
  hi: "खेल मनोविज्ञान और शिक्षण-विधि के सहारे कोचिंग सत्र की योजना, संचालन और समीक्षा।"
outcomes:
  - en: "Use key coaching terms, theories and models"
    zh: "运用主要的执教术语、理论和模型"
    zh-TW: "運用主要的執教術語、理論和模型"
    ja: "コーチングの用語・理論・モデルを使う"
    ko: "코칭의 핵심 용어·이론·모델 활용하기"
    vi: "Vận dụng thuật ngữ, lý thuyết và mô hình huấn luyện"
    ms: "Guna istilah, teori dan model kejurulatihan utama"
    id: "Memakai istilah, teori, dan model kepelatihan utama"
    hi: "कोचिंग की मुख्य शब्दावली, सिद्धांत और मॉडल लागू करना"
  - en: "Design and evaluate a coaching session"
    zh: "设计并评估一节训练课"
    zh-TW: "設計並評估一堂訓練課"
    ja: "練習セッションを設計し評価する"
    ko: "코칭 세션 설계하고 평가하기"
    vi: "Thiết kế và đánh giá một buổi huấn luyện"
    ms: "Reka dan nilai sesi kejurulatihan"
    id: "Merancang dan mengevaluasi sesi latihan"
    hi: "कोचिंग सत्र डिज़ाइन करना और उसका मूल्यांकन करना"
  - en: "Apply and improve your own coaching skills"
    zh: "运用并改进自己的执教技能"
    zh-TW: "運用並改進自己的執教技能"
    ja: "自分のコーチング技術を使い改善する"
    ko: "자신의 코칭 기술 적용하고 개선하기"
    vi: "Áp dụng và cải thiện kỹ năng huấn luyện của bản thân"
    ms: "Amalkan dan perbaiki kemahiran kejurulatihan sendiri"
    id: "Menerapkan dan memperbaiki keterampilan melatih sendiri"
    hi: "अपने कोचिंग कौशल लागू करना और सुधारना"
