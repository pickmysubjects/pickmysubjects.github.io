code: BMEN90029
year: 2027
learn:
  en: "The mechanics of soft tissues and cells, including finite element modelling."
  zh: "软组织和细胞的力学，包括有限元建模。"
  zh-TW: "軟組織與細胞的力學，包括有限元素建模。"
  ja: "有限要素モデルを含め、軟組織と細胞の力学を学ぶ。"
  ko: "유한요소 모델링을 포함한 연조직과 세포의 역학."
  vi: "Cơ học của mô mềm và tế bào, gồm cả mô hình phần tử hữu hạn."
  ms: "Mekanik tisu lembut dan sel, termasuk pemodelan unsur terhingga."
  id: "Mekanika jaringan lunak dan sel, termasuk pemodelan elemen hingga."
  hi: "मुलायम ऊतकों और कोशिकाओं की यांत्रिकी, फ़ाइनाइट एलिमेंट मॉडलिंग सहित।"
outcomes:
  - en: "Build finite element models of soft tissues and cells"
    zh: "建立软组织和细胞的有限元模型"
    zh-TW: "建立軟組織與細胞的有限元素模型"
    ja: "軟組織と細胞の有限要素モデルを作る"
    ko: "연조직과 세포의 유한요소 모델 만들기"
    vi: "Xây dựng mô hình phần tử hữu hạn cho mô mềm và tế bào"
    ms: "Membina model unsur terhingga tisu lembut dan sel"
    id: "Membangun model elemen hingga jaringan lunak dan sel"
    hi: "मुलायम ऊतकों और कोशिकाओं के फ़ाइनाइट एलिमेंट मॉडल बनाना"
  - en: "Describe tissue behaviour with stress-strain models"
    zh: "用应力-应变模型描述组织行为"
    zh-TW: "用應力-應變模型描述組織行為"
    ja: "応力-ひずみモデルで組織の挙動を説明する"
    ko: "응력-변형률 모델로 조직 거동 설명하기"
    vi: "Mô tả hành vi của mô bằng mô hình ứng suất-biến dạng"
    ms: "Menerangkan kelakuan tisu dengan model tegasan-terikan"
    id: "Menjelaskan perilaku jaringan dengan model tegangan-regangan"
    hi: "स्ट्रेस-स्ट्रेन मॉडल से ऊतक का व्यवहार बताना"
