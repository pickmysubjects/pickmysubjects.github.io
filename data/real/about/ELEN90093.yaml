code: ELEN90093
year: 2027
learn:
  en: "How microprocessors, compilers and operating systems fit together, and designing a processor yourself."
  zh: "微处理器、编译器和操作系统如何配合，并亲手设计一个处理器。"
  zh-TW: "微處理器、編譯器與作業系統如何搭配，並親手設計一個處理器。"
  ja: "マイクロプロセッサ・コンパイラ・OS の関係を学び、自分でプロセッサを設計する。"
  ko: "마이크로프로세서, 컴파일러, 운영체제의 관계를 배우고 직접 프로세서를 설계합니다."
  vi: "Bộ vi xử lý, trình biên dịch và hệ điều hành phối hợp thế nào, và tự thiết kế một bộ xử lý."
  ms: "Bagaimana mikropemproses, pengkompil dan sistem pengendalian berfungsi bersama, dan mereka bentuk pemproses sendiri."
  id: "Bagaimana mikroprosesor, kompiler, dan sistem operasi bekerja sama, lalu merancang prosesor sendiri."
  hi: "माइक्रोप्रोसेसर, कंपाइलर और ऑपरेटिंग सिस्टम कैसे मिलकर काम करते हैं, और ख़ुद एक प्रोसेसर डिज़ाइन करना।"
outcomes:
  - en: "Compare RISC and CISC designs"
    zh: "比较 RISC 与 CISC 设计"
    zh-TW: "比較 RISC 與 CISC 設計"
    ja: "RISC と CISC の設計を比べる"
    ko: "RISC와 CISC 설계 비교하기"
    vi: "So sánh thiết kế RISC và CISC"
    ms: "Membandingkan reka bentuk RISC dan CISC"
    id: "Membandingkan desain RISC dan CISC"
    hi: "RISC और CISC डिज़ाइन की तुलना"
  - en: "Design a microprocessor in a hardware description language"
    zh: "用硬件描述语言设计微处理器"
    zh-TW: "用硬體描述語言設計微處理器"
    ja: "ハードウェア記述言語でマイクロプロセッサを設計する"
    ko: "하드웨어 기술 언어로 마이크로프로세서 설계하기"
    vi: "Thiết kế bộ vi xử lý bằng ngôn ngữ mô tả phần cứng"
    ms: "Mereka bentuk mikropemproses dengan bahasa perihalan perkakasan"
    id: "Merancang mikroprosesor dengan bahasa deskripsi perangkat keras"
    hi: "हार्डवेयर विवरण भाषा में माइक्रोप्रोसेसर डिज़ाइन करना"
  - en: "Get an operating system like Linux running on a target processor"
    zh: "让 Linux 等操作系统在目标处理器上运行"
    zh-TW: "讓 Linux 等作業系統在目標處理器上執行"
    ja: "Linux などの OS を対象プロセッサで動かす"
    ko: "Linux 같은 운영체제를 대상 프로세서에서 실행하기"
    vi: "Chạy hệ điều hành như Linux trên bộ xử lý đích"
    ms: "Menjalankan sistem pengendalian seperti Linux pada pemproses sasaran"
    id: "Menjalankan sistem operasi seperti Linux di prosesor target"
    hi: "Linux जैसे ऑपरेटिंग सिस्टम को लक्ष्य प्रोसेसर पर चलाना"
