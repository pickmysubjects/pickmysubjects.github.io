code: RUSS20006
year: 2026
learn:
  en: "Advanced Russian through literary and historical texts, with participles, gerunds and more complex argument."
  zh: "通过文学和历史文本学习高级俄语，掌握分词和副动词，练习更复杂的论述。"
  zh-TW: "透過文學和歷史文本學習高級俄語，掌握分詞和副動詞，練習更複雜的論述。"
  ja: "文学や歴史の文章で上級ロシア語。分詞・副動詞を学び、より複雑な議論をする。"
  ko: "문학·역사 글로 배우는 고급 러시아어. 분사와 부동사, 더 복잡한 논증."
  vi: "Tiếng Nga nâng cao qua văn bản văn học và lịch sử, với phân từ, trạng động từ và lập luận phức tạp hơn."
  ms: "Bahasa Rusia lanjutan melalui teks sastera dan sejarah, dengan participle, gerund dan hujah lebih kompleks."
  id: "Bahasa Rusia lanjutan lewat teks sastra dan sejarah, dengan partisip, gerund dan argumen lebih rumit."
  hi: "साहित्यिक और ऐतिहासिक पाठों से उन्नत रूसी, कृदंत रूपों और ज़्यादा जटिल तर्क के साथ।"
outcomes:
  - en: "Discuss social and cultural topics in Russian"
    zh: "用俄语讨论社会和文化话题"
    zh-TW: "用俄語討論社會和文化話題"
    ja: "社会や文化の話題をロシア語で話し合う"
    ko: "사회·문화 주제를 러시아어로 토론하기"
    vi: "Thảo luận chủ đề xã hội, văn hóa bằng tiếng Nga"
    ms: "Bincangkan topik sosial dan budaya dalam bahasa Rusia"
    id: "Membahas topik sosial dan budaya dalam bahasa Rusia"
    hi: "सामाजिक और सांस्कृतिक विषयों पर रूसी में चर्चा करना"
  - en: "Read and write longer Russian texts"
    zh: "读写较长的俄语文章"
    zh-TW: "讀寫較長的俄語文章"
    ja: "長めのロシア語の文章を読み書きする"
    ko: "긴 러시아어 글 읽고 쓰기"
    vi: "Đọc và viết văn bản tiếng Nga dài hơn"
    ms: "Baca dan tulis teks bahasa Rusia yang lebih panjang"
    id: "Membaca dan menulis teks bahasa Rusia yang lebih panjang"
    hi: "लंबे रूसी पाठ पढ़ना-लिखना"
  - en: "Give a clear presentation in Russian"
    zh: "用俄语做清楚的口头报告"
    zh-TW: "用俄語做清楚的口頭報告"
    ja: "ロシア語で分かりやすく発表する"
    ko: "러시아어로 명확하게 발표하기"
    vi: "Thuyết trình rõ ràng bằng tiếng Nga"
    ms: "Buat pembentangan yang jelas dalam bahasa Rusia"
    id: "Melakukan presentasi yang jelas dalam bahasa Rusia"
    hi: "रूसी में स्पष्ट प्रस्तुति देना"
