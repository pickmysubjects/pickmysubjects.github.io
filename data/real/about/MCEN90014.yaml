code: MCEN90014
year: 2027
learn:
  en: "How metals, ceramics and polymers are processed, and how that shapes their structure and properties."
  zh: "金属、陶瓷和聚合物如何加工，以及加工如何决定其结构与性能。"
  zh-TW: "金屬、陶瓷與高分子如何加工，以及加工如何決定其結構與性質。"
  ja: "金属・セラミックス・高分子の加工と、それが組織や特性をどう決めるか。"
  ko: "금속·세라믹·고분자의 가공과 그것이 구조와 성질을 결정하는 방식."
  vi: "Cách gia công kim loại, gốm và polyme, và điều đó quyết định cấu trúc, tính chất ra sao."
  ms: "Cara logam, seramik dan polimer diproses serta kesannya pada struktur dan sifat."
  id: "Cara logam, keramik, dan polimer diproses serta pengaruhnya pada struktur dan sifat."
  hi: "धातु, सिरेमिक और पॉलिमर की प्रोसेसिंग और उससे उनकी संरचना व गुण कैसे बनते हैं।"
outcomes:
  - en: "Explain key properties of engineering materials"
    zh: "解释工程材料的主要性能"
    zh-TW: "解釋工程材料的主要性質"
    ja: "工学材料の主な特性を説明する"
    ko: "공학 재료의 주요 성질 설명하기"
    vi: "Giải thích các tính chất chính của vật liệu kỹ thuật"
    ms: "Menerangkan sifat utama bahan kejuruteraan"
    id: "Menjelaskan sifat utama material teknik"
    hi: "इंजीनियरिंग सामग्रियों के मुख्य गुण समझाना"
  - en: "Run experiments to analyse microstructures"
    zh: "做实验分析显微组织"
    zh-TW: "做實驗分析顯微組織"
    ja: "実験で微細組織を分析する"
    ko: "실험으로 미세조직 분석하기"
    vi: "Làm thí nghiệm phân tích vi cấu trúc"
    ms: "Menjalankan eksperimen untuk menganalisis mikrostruktur"
    id: "Melakukan eksperimen untuk menganalisis mikrostruktur"
    hi: "प्रयोग से सूक्ष्म संरचना का विश्लेषण"
  - en: "Use computational tools to predict material structures"
    zh: "用计算工具预测材料结构"
    zh-TW: "用計算工具預測材料結構"
    ja: "計算ツールで材料組織を予測する"
    ko: "계산 도구로 재료 구조 예측하기"
    vi: "Dùng công cụ tính toán để dự đoán cấu trúc vật liệu"
    ms: "Menggunakan alat pengiraan untuk meramal struktur bahan"
    id: "Memakai alat komputasi untuk memprediksi struktur material"
    hi: "कम्प्यूटेशनल टूल से सामग्री संरचना का अनुमान"
