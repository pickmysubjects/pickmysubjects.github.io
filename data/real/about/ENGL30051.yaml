code: ENGL30051
year: 2026
learn:
  en: "Comedy from ancient Greece to today's Melbourne: how it makes us laugh and what satire, parody and drag say about society."
  zh: "从古希腊到今天墨尔本的喜剧：它如何让人发笑，讽刺、戏仿和变装表演又反映了什么。"
  zh-TW: "從古希臘到今天墨爾本的喜劇：它如何讓人發笑，諷刺、戲仿和變裝表演又反映了什麼。"
  ja: "古代ギリシャから今のメルボルンまでの喜劇。笑いの仕組みと、風刺・パロディ・ドラァグが社会について語ることを学ぶ。"
  ko: "고대 그리스부터 오늘날 멜버른까지의 코미디. 웃음의 원리와 풍자·패러디·드래그가 사회에 대해 말하는 것을 배운다."
  vi: "Hài kịch từ Hy Lạp cổ đến Melbourne hôm nay: cách nó gây cười và trào phúng, nhại, drag nói gì về xã hội."
  ms: "Komedi dari Yunani purba hingga Melbourne kini: cara ia membuat kita ketawa dan apa kata satira, parodi dan drag tentang masyarakat."
  id: "Komedi dari Yunani kuno sampai Melbourne masa kini: cara ia membuat kita tertawa dan apa kata satire, parodi dan drag soal masyarakat."
  hi: "प्राचीन यूनान से आज के मेलबर्न तक कॉमेडी: यह हंसाती कैसे है और व्यंग्य, पैरोडी व ड्रैग समाज के बारे में क्या कहते हैं।"
outcomes:
  - en: "Explain major theories of comedy"
    zh: "说明喜剧的主要理论"
    zh-TW: "說明喜劇的主要理論"
    ja: "喜劇の主な理論を説明する"
    ko: "코미디의 주요 이론 설명하기"
    vi: "Giải thích các lý thuyết chính về hài kịch"
    ms: "Terangkan teori utama komedi"
    id: "Menjelaskan teori utama komedi"
    hi: "कॉमेडी के मुख्य सिद्धांत समझाना"
  - en: "Analyse comic texts and performances"
    zh: "分析喜剧文本和表演"
    zh-TW: "分析喜劇文本和表演"
    ja: "喜劇の作品と上演を分析する"
    ko: "코미디 작품과 공연 분석하기"
    vi: "Phân tích văn bản và trình diễn hài"
    ms: "Analisis teks dan persembahan komedi"
    id: "Menganalisis teks dan pertunjukan komedi"
    hi: "हास्य पाठों और प्रदर्शनों का विश्लेषण करना"
  - en: "Discuss how comedy reflects identity and taste"
    zh: "讨论喜剧如何反映身份与品味"
    zh-TW: "討論喜劇如何反映身分與品味"
    ja: "喜劇がアイデンティティや好みをどう映すか論じる"
    ko: "코미디가 정체성과 취향을 반영하는 방식 논의하기"
    vi: "Thảo luận cách hài kịch phản ánh bản sắc và thị hiếu"
    ms: "Bincangkan cara komedi mencerminkan identiti dan citarasa"
    id: "Membahas cara komedi mencerminkan identitas dan selera"
    hi: "कॉमेडी पहचान और रुचि को कैसे दिखाती है, चर्चा करना"
