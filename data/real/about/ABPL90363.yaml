code: ABPL90363
year: 2027
learn:
  en: "Theories and techniques for property research, leading to a research proposal for the property thesis."
  zh: "房地产研究的理论与方法，并为房地产论文写出研究方案。"
  zh-TW: "房地產研究的理論與方法，並為房地產論文寫出研究方案。"
  ja: "不動産研究の理論と手法を学び、論文のための研究計画をまとめる。"
  ko: "부동산 연구의 이론과 기법을 배우고 논문용 연구 계획을 세웁니다."
  vi: "Lý thuyết và kỹ thuật nghiên cứu bất động sản, dẫn tới đề cương cho luận văn."
  ms: "Teori dan teknik kajian hartanah, menghasilkan cadangan kajian untuk tesis."
  id: "Teori dan teknik riset properti, menghasilkan proposal untuk tesis properti."
  hi: "संपत्ति शोध के सिद्धांत और तकनीकें, थीसिस के लिए शोध प्रस्ताव तक।"
outcomes:
  - en: "Collect primary and secondary data"
    zh: "收集一手和二手数据"
    zh-TW: "收集一手和二手資料"
    ja: "一次・二次データを集める"
    ko: "1차·2차 데이터 수집하기"
    vi: "Thu thập dữ liệu sơ cấp và thứ cấp"
    ms: "Mengumpul data primer dan sekunder"
    id: "Mengumpulkan data primer dan sekunder"
    hi: "प्राथमिक और द्वितीयक डेटा जुटाना"
  - en: "Write an annotated bibliography and review"
    zh: "撰写注释书目和文献综述"
    zh-TW: "撰寫註釋書目和文獻回顧"
    ja: "注釈付き文献目録とレビューを書く"
    ko: "주석 참고문헌과 검토 쓰기"
    vi: "Viết thư mục chú giải và tổng quan"
    ms: "Menulis bibliografi beranotasi dan kajian"
    id: "Menulis bibliografi beranotasi dan tinjauan"
    hi: "एनोटेटेड ग्रंथसूची और समीक्षा लिखना"
