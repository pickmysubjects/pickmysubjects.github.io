code: MAST30011
year: 2026
learn:
  en: "Graphs as models of networks, and how proofs lead to algorithms that solve graph problems."
  zh: "用图来描述各种网络，以及怎么从证明推出解题算法。"
  zh-TW: "用圖來描述各種網路，以及怎麼從證明推出解題演算法。"
  ja: "ネットワークのモデルとしてのグラフと、証明からグラフ問題を解くアルゴリズムを導く方法。"
  ko: "네트워크 모델로서의 그래프, 그리고 증명이 그래프 문제 알고리즘으로 이어지는 방식."
  vi: "Đồ thị làm mô hình mạng, và cách chứng minh dẫn tới thuật toán giải bài toán đồ thị."
  ms: "Graf sebagai model rangkaian, dan cara bukti membawa kepada algoritma untuk masalah graf."
  id: "Graf sebagai model jaringan, dan bagaimana bukti mengarah ke algoritma untuk soal graf."
  hi: "नेटवर्क के मॉडल के रूप में ग्राफ़, और प्रमाण से ग्राफ़ समस्याओं के एल्गोरिद्म कैसे बनते हैं।"
outcomes:
  - en: "Implement standard graph algorithms"
    zh: "实现常见的图算法"
    zh-TW: "實作常見的圖演算法"
    ja: "標準的なグラフアルゴリズムを実装する"
    ko: "표준 그래프 알고리즘 구현하기"
    vi: "Cài đặt các thuật toán đồ thị cơ bản"
    ms: "Melaksanakan algoritma graf standard"
    id: "Mengimplementasikan algoritma graf standar"
    hi: "मानक ग्राफ़ एल्गोरिद्म लागू करना"
  - en: "Prove simple results about graphs"
    zh: "证明简单的图论结论"
    zh-TW: "證明簡單的圖論結論"
    ja: "グラフについて簡単な結果を証明する"
    ko: "그래프에 관한 간단한 결과 증명하기"
    vi: "Chứng minh kết quả đơn giản về đồ thị"
    ms: "Membuktikan hasil mudah tentang graf"
    id: "Membuktikan hasil sederhana tentang graf"
    hi: "ग्राफ़ के सरल परिणाम सिद्ध करना"
