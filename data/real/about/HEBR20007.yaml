code: HEBR20007
year: 2026
learn:
  en: "Advanced Hebrew through modern Israeli prose and poetry, news and academic articles on Israeli and Jewish culture."
  zh: "通过现代以色列小说、诗歌、新闻和学术文章学习高级希伯来语。"
  zh-TW: "透過現代以色列小說、詩歌、新聞和學術文章學習高級希伯來語。"
  ja: "現代イスラエルの小説や詩、ニュース、学術記事で上級ヘブライ語。イスラエルとユダヤの文化。"
  ko: "현대 이스라엘 소설과 시, 뉴스, 학술 기사로 배우는 고급 히브리어. 이스라엘·유대 문화."
  vi: "Tiếng Do Thái nâng cao qua văn xuôi, thơ Israel hiện đại, tin tức và bài học thuật về văn hóa Israel và Do Thái."
  ms: "Bahasa Ibrani lanjutan melalui prosa dan puisi Israel moden, berita dan artikel akademik tentang budaya Israel dan Yahudi."
  id: "Bahasa Ibrani lanjutan lewat prosa dan puisi Israel modern, berita dan artikel akademik tentang budaya Israel dan Yahudi."
  hi: "आधुनिक इज़राइली गद्य-कविता, ख़बरों और अकादमिक लेखों से उन्नत हिब्रू, इज़राइली व यहूदी संस्कृति पर।"
outcomes:
  - en: "Discuss social and cultural topics in Hebrew"
    zh: "用希伯来语讨论社会和文化话题"
    zh-TW: "用希伯來語討論社會和文化話題"
    ja: "社会や文化の話題をヘブライ語で話し合う"
    ko: "사회·문화 주제를 히브리어로 토론하기"
    vi: "Thảo luận chủ đề xã hội, văn hóa bằng tiếng Do Thái"
    ms: "Bincangkan topik sosial dan budaya dalam bahasa Ibrani"
    id: "Membahas topik sosial dan budaya dalam bahasa Ibrani"
    hi: "सामाजिक और सांस्कृतिक विषयों पर हिब्रू में चर्चा करना"
  - en: "Read and write longer Hebrew texts"
    zh: "读写较长的希伯来语文章"
    zh-TW: "讀寫較長的希伯來語文章"
    ja: "長めのヘブライ語の文章を読み書きする"
    ko: "긴 히브리어 글 읽고 쓰기"
    vi: "Đọc và viết văn bản tiếng Do Thái dài hơn"
    ms: "Baca dan tulis teks bahasa Ibrani yang lebih panjang"
    id: "Membaca dan menulis teks bahasa Ibrani yang lebih panjang"
    hi: "लंबे हिब्रू पाठ पढ़ना-लिखना"
  - en: "Give a clear presentation in Hebrew"
    zh: "用希伯来语做清楚的口头报告"
    zh-TW: "用希伯來語做清楚的口頭報告"
    ja: "ヘブライ語で分かりやすく発表する"
    ko: "히브리어로 명확하게 발표하기"
    vi: "Thuyết trình rõ ràng bằng tiếng Do Thái"
    ms: "Buat pembentangan yang jelas dalam bahasa Ibrani"
    id: "Melakukan presentasi yang jelas dalam bahasa Ibrani"
    hi: "हिब्रू में स्पष्ट प्रस्तुति देना"
