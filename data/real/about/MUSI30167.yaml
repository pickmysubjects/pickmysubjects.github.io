code: MUSI30167
year: 2026
learn:
  en: "A large brass ensemble playing original works and transcriptions in many styles. Audition entry, pass/fail."
  zh: "大型铜管合奏，演奏多种风格的原创作品与改编曲。需试音，及格制。"
  zh-TW: "大型銅管合奏，演奏多種風格的原創作品與改編曲。需試音，及格制。"
  ja: "大編成の金管アンサンブル。多様な原曲と編曲。オーディション制・合否判定。"
  ko: "대규모 금관 앙상블. 다양한 원곡과 편곡. 오디션, 합격/불합격."
  vi: "Dàn kèn đồng lớn chơi tác phẩm gốc và chuyển soạn. Thử giọng, đạt/không đạt."
  ms: "Ensembel brass besar, karya asal dan transkripsi. Uji bakat, lulus/gagal."
  id: "Ansambel brass besar, karya asli dan transkripsi. Audisi, lulus/gagal."
  hi: "बड़ा ब्रास समूह, मूल और रूपांतरित रचनाएँ। ऑडिशन, पास/फ़ेल।"
outcomes:
  - en: "Blend and balance within a full brass section"
    zh: "在完整铜管声部中融合与平衡"
    zh-TW: "在完整銅管聲部中融合與平衡"
    ja: "金管全体の中で溶け合い釣り合う"
    ko: "금관 전체 안에서 어울리고 균형 잡기"
    vi: "Hòa âm và cân bằng trong dàn kèn đồng"
    ms: "Selaras dan seimbang dalam seksyen brass"
    id: "Menyatu dan seimbang dalam seksi brass"
    hi: "पूरे ब्रास समूह में संतुलन से बजाना"
  - en: "Prepare parts across different musical styles"
    zh: "为不同风格的作品准备声部"
    zh-TW: "為不同風格的作品準備聲部"
    ja: "様々な様式のパートを準備する"
    ko: "여러 양식의 파트 준비하기"
    vi: "Chuẩn bị bè cho nhiều phong cách"
    ms: "Sediakan bahagian untuk pelbagai gaya"
    id: "Menyiapkan partisi berbagai gaya"
    hi: "अलग-अलग शैलियों के भाग तैयार करना"
  - en: "Perform in brass ensemble concerts"
    zh: "参加铜管合奏音乐会演出"
    zh-TW: "參加銅管合奏音樂會演出"
    ja: "金管アンサンブルの演奏会に出る"
    ko: "금관 앙상블 공연에 서기"
    vi: "Biểu diễn trong hòa nhạc kèn đồng"
    ms: "Membuat persembahan dalam konsert brass"
    id: "Tampil dalam konser ansambel brass"
    hi: "ब्रास समूह कॉन्सर्ट में प्रस्तुति देना"
