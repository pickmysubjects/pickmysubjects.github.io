code: ARTS10003
year: 2026
learn:
  en: "How digital tech quietly runs everyday life: data, algorithms, surveillance and AI, looked at through games, film and stories."
  zh: "数字技术如何悄然支撑日常生活：数据、算法、监控与 AI，通过游戏、电影和故事来探讨。"
  zh-TW: "數位技術如何悄然支撐日常生活：數據、演算法、監控與 AI，透過遊戲、電影和故事來探討。"
  ja: "デジタル技術が日常をどう動かしているか。データ、アルゴリズム、監視、AIをゲーム・映画・物語から考える。"
  ko: "디지털 기술이 일상을 어떻게 움직이는가. 데이터, 알고리즘, 감시, AI를 게임·영화·이야기로 살펴본다."
  vi: "Công nghệ số âm thầm vận hành đời sống ra sao: dữ liệu, thuật toán, giám sát và AI, qua trò chơi, phim và truyện."
  ms: "Bagaimana teknologi digital menggerakkan kehidupan harian: data, algoritma, pengawasan dan AI, melalui permainan, filem dan cerita."
  id: "Bagaimana teknologi digital diam-diam menjalankan hidup sehari-hari: data, algoritme, pengawasan dan AI, lewat gim, film dan cerita."
  hi: "डिजिटल तकनीक रोज़मर्रा की ज़िंदगी कैसे चलाती है: डेटा, एल्गोरिद्म, निगरानी और AI, गेम, फ़िल्म और कहानियों के ज़रिए।"
outcomes:
  - en: "Explain the key ideas behind digital technology"
    zh: "解释数字技术背后的核心概念"
    zh-TW: "解釋數位技術背後的核心概念"
    ja: "デジタル技術の基本概念を説明する"
    ko: "디지털 기술의 핵심 개념 설명하기"
    vi: "Giải thích các khái niệm chính của công nghệ số"
    ms: "Terangkan idea utama di sebalik teknologi digital"
    id: "Menjelaskan gagasan utama di balik teknologi digital"
    hi: "डिजिटल तकनीक के मुख्य विचार समझाना"
  - en: "Think critically about data, platforms and power"
    zh: "批判性地思考数据、平台与权力"
    zh-TW: "批判性地思考數據、平台與權力"
    ja: "データ、プラットフォーム、権力を批判的に考える"
    ko: "데이터, 플랫폼, 권력을 비판적으로 생각하기"
    vi: "Suy nghĩ phản biện về dữ liệu, nền tảng và quyền lực"
    ms: "Fikir secara kritis tentang data, platform dan kuasa"
    id: "Berpikir kritis tentang data, platform dan kekuasaan"
    hi: "डेटा, प्लेटफ़ॉर्म और सत्ता पर आलोचनात्मक सोचना"
  - en: "Build your own digital project"
    zh: "制作自己的数字作品"
    zh-TW: "製作自己的數位作品"
    ja: "自分のデジタル作品を作る"
    ko: "나만의 디지털 프로젝트 만들기"
    vi: "Tự làm một dự án số của riêng bạn"
    ms: "Bina projek digital sendiri"
    id: "Membuat proyek digital sendiri"
    hi: "अपना डिजिटल प्रोजेक्ट बनाना"
