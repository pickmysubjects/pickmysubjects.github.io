code: FNCE90087
year: 2027
learn:
  en: "Bringing ESG risks such as climate change and human rights into investment decisions, engagement and impact investing."
  zh: "将气候变化、人权等 ESG 风险纳入投资决策、股东参与和影响力投资。"
  zh-TW: "將氣候變遷、人權等 ESG 風險納入投資決策、股東議合與影響力投資。"
  ja: "気候変動や人権などの ESG リスクを投資判断、エンゲージメント、インパクト投資に組み込む。"
  ko: "기후변화·인권 등 ESG 위험을 투자결정, 주주관여, 임팩트 투자에 반영한다."
  vi: "Đưa rủi ro ESG như biến đổi khí hậu, nhân quyền vào quyết định đầu tư, tham gia cổ đông và đầu tư tác động."
  ms: "Memasukkan risiko ESG seperti perubahan iklim dan hak asasi ke dalam keputusan pelaburan dan pelaburan impak."
  id: "Memasukkan risiko ESG seperti perubahan iklim dan HAM ke keputusan investasi, keterlibatan dan investasi berdampak."
  hi: "जलवायु परिवर्तन व मानवाधिकार जैसे ESG जोखिम निवेश निर्णय, जुड़ाव और इम्पैक्ट निवेश में शामिल करना।"
outcomes:
  - en: "Integrate ESG risks into investment decisions"
    zh: "将 ESG 风险纳入投资决策"
    zh-TW: "將 ESG 風險納入投資決策"
    ja: "ESG リスクを投資判断に組み込む"
    ko: "ESG 위험을 투자결정에 반영하기"
    vi: "Đưa rủi ro ESG vào quyết định đầu tư"
    ms: "Mengintegrasi risiko ESG dalam keputusan pelaburan"
    id: "Mengintegrasikan risiko ESG ke keputusan investasi"
    hi: "निवेश निर्णयों में ESG जोखिम शामिल करना"
  - en: "Explain how investors drive social and green impact"
    zh: "解释投资者如何推动社会与环境影响"
    zh-TW: "解釋投資人如何推動社會與環境影響"
    ja: "投資家が社会・環境への効果を生む方法を説明する"
    ko: "투자자가 사회·환경 임팩트를 만드는 방식 설명하기"
    vi: "Giải thích nhà đầu tư tạo tác động xã hội, môi trường"
    ms: "Menerangkan cara pelabur memacu impak sosial dan alam"
    id: "Menjelaskan cara investor mendorong dampak sosial dan lingkungan"
    hi: "निवेशक सामाजिक और पर्यावरणीय प्रभाव कैसे लाते हैं, बताना"
