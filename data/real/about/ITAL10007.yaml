code: ITAL10007
year: 2026
learn:
  en: "Italian for students who finished Italian 5: modern short stories, a theatre project and an online exchange with students in Italy."
  zh: "适合学完意大利语 5 的学生：当代短篇、戏剧项目和与意大利学生的线上交流。"
  zh-TW: "適合學完義大利語 5 的學生：當代短篇、戲劇專題和與義大利學生的線上交流。"
  ja: "イタリア語5を終えた学生向け。現代の短編小説、演劇プロジェクト、イタリアの学生とのオンライン交流。"
  ko: "이탈리아어 5를 마친 학생 대상. 현대 단편 소설, 연극 프로젝트, 이탈리아 학생과의 온라인 교류."
  vi: "Tiếng Ý cho ai đã học xong Italian 5: truyện ngắn hiện đại, dự án kịch và giao lưu trực tuyến với sinh viên Ý."
  ms: "Bahasa Itali untuk yang tamat Italian 5: cerpen moden, projek teater dan pertukaran dalam talian dengan pelajar Itali."
  id: "Bahasa Italia untuk yang lulus Italian 5: cerpen modern, proyek teater dan pertukaran daring dengan mahasiswa Italia."
  hi: "इतालवी 5 पूरा कर चुके छात्रों के लिए: आधुनिक कहानियाँ, नाटक परियोजना और इटली के छात्रों से ऑनलाइन आदान-प्रदान।"
outcomes:
  - en: "Discuss social and cultural topics in Italian"
    zh: "用意大利语讨论社会和文化话题"
    zh-TW: "用義大利語討論社會和文化話題"
    ja: "社会や文化の話題をイタリア語で話し合う"
    ko: "사회·문화 주제를 이탈리아어로 토론하기"
    vi: "Thảo luận chủ đề xã hội, văn hóa bằng tiếng Ý"
    ms: "Bincangkan topik sosial dan budaya dalam bahasa Itali"
    id: "Membahas topik sosial dan budaya dalam bahasa Italia"
    hi: "सामाजिक और सांस्कृतिक विषयों पर इतालवी में चर्चा करना"
  - en: "Read and write longer Italian texts"
    zh: "读写较长的意大利语文章"
    zh-TW: "讀寫較長的義大利語文章"
    ja: "長めのイタリア語の文章を読み書きする"
    ko: "긴 이탈리아어 글 읽고 쓰기"
    vi: "Đọc và viết văn bản tiếng Ý dài hơn"
    ms: "Baca dan tulis teks bahasa Itali yang lebih panjang"
    id: "Membaca dan menulis teks bahasa Italia yang lebih panjang"
    hi: "लंबे इतालवी पाठ पढ़ना-लिखना"
  - en: "Give a clear presentation in Italian"
    zh: "用意大利语做清楚的口头报告"
    zh-TW: "用義大利語做清楚的口頭報告"
    ja: "イタリア語で分かりやすく発表する"
    ko: "이탈리아어로 명확하게 발표하기"
    vi: "Thuyết trình rõ ràng bằng tiếng Ý"
    ms: "Buat pembentangan yang jelas dalam bahasa Itali"
    id: "Melakukan presentasi yang jelas dalam bahasa Italia"
    hi: "इतालवी में स्पष्ट प्रस्तुति देना"
