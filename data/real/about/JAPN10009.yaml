code: JAPN10009
year: 2026
learn:
  en: "Reading real Japanese novels and poems, with new vocabulary, reading strategies and culture-specific language. Taught in Japanese."
  zh: "阅读真实的日本小说和诗歌，学习新词汇、阅读策略和带有文化色彩的表达。全日语授课。"
  zh-TW: "閱讀真實的日本小說和詩歌，學習新詞彙、閱讀策略和帶有文化色彩的表達。全日語授課。"
  ja: "本物の日本の小説や詩を読み、新しい語彙、読解の方法、文化に根ざした表現を学ぶ。授業はすべて日本語。"
  ko: "실제 일본 소설과 시를 읽으며 새 어휘, 읽기 전략, 문화가 담긴 표현을 배운다. 전부 일본어 수업."
  vi: "Đọc tiểu thuyết và thơ Nhật thật, học từ mới, chiến lược đọc và cách nói mang màu sắc văn hóa. Dạy hoàn toàn bằng tiếng Nhật."
  ms: "Membaca novel dan puisi Jepun sebenar, dengan kosa kata baharu, strategi membaca dan bahasa khas budaya. Diajar dalam bahasa Jepun."
  id: "Membaca novel dan puisi Jepang asli, dengan kosakata baru, strategi membaca dan ungkapan khas budaya. Diajarkan dalam bahasa Jepang."
  hi: "असली जापानी उपन्यास और कविताएँ पढ़ना, नई शब्दावली, पढ़ने की रणनीतियाँ और संस्कृति से जुड़ी भाषा। पूरी तरह जापानी में।"
outcomes:
  - en: "Read Japanese literary texts on your own"
    zh: "独立阅读日语文学作品"
    zh-TW: "獨立閱讀日語文學作品"
    ja: "日本語の文学作品を自力で読む"
    ko: "일본어 문학 작품을 혼자 읽기"
    vi: "Tự đọc tác phẩm văn học tiếng Nhật"
    ms: "Baca teks sastera Jepun secara sendiri"
    id: "Membaca teks sastra Jepang secara mandiri"
    hi: "जापानी साहित्यिक पाठ ख़ुद पढ़ना"
  - en: "Use reading strategies for harder texts"
    zh: "运用阅读策略处理较难的文本"
    zh-TW: "運用閱讀策略處理較難的文本"
    ja: "難しい文章に読解の方法を使う"
    ko: "어려운 글에 읽기 전략 활용하기"
    vi: "Dùng chiến lược đọc cho văn bản khó hơn"
    ms: "Guna strategi membaca untuk teks yang lebih sukar"
    id: "Memakai strategi membaca untuk teks yang lebih sulit"
    hi: "कठिन पाठों के लिए पढ़ने की रणनीतियाँ अपनाना"
  - en: "Understand language tied to Japanese culture"
    zh: "理解与日本文化相关的语言表达"
    zh-TW: "理解與日本文化相關的語言表達"
    ja: "日本文化に結びついた言葉づかいを理解する"
    ko: "일본 문화와 관련된 언어 표현 이해하기"
    vi: "Hiểu cách nói gắn với văn hóa Nhật"
    ms: "Fahami bahasa yang berkait dengan budaya Jepun"
    id: "Memahami bahasa yang terkait budaya Jepang"
    hi: "जापानी संस्कृति से जुड़ी भाषा समझना"
