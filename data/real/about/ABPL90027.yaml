code: ABPL90027
year: 2027
learn:
  en: "Owning and running buildings sustainably over time: life cycle costing, maintenance, depreciation, obsolescence and value."
  zh: "长期可持续地持有和运营建筑：全寿命成本、维护、折旧、老化和价值。"
  zh-TW: "長期永續地持有與營運建築：全生命週期成本、維護、折舊、老化與價值。"
  ja: "建物を長く持続的に所有・運用する：LCC、保全、減価、陳腐化、価値。"
  ko: "건물의 지속가능한 장기 보유·운영: 생애주기비용, 유지보수, 감가, 노후화."
  vi: "Sở hữu và vận hành tòa nhà bền vững: chi phí vòng đời, bảo trì, khấu hao, lỗi thời."
  ms: "Memiliki dan mengendalikan bangunan secara mampan: kos kitaran hayat, penyelenggaraan, susut nilai."
  id: "Memiliki dan mengoperasikan bangunan secara berkelanjutan: biaya siklus hidup, pemeliharaan, depresiasi."
  hi: "इमारतों का टिकाऊ स्वामित्व और संचालन: जीवन-चक्र लागत, रखरखाव, मूल्यह्रास और मूल्य।"
outcomes:
  - en: "Carry out a life cycle cost analysis of a building"
    zh: "对建筑做全寿命成本分析"
    zh-TW: "對建築做全生命週期成本分析"
    ja: "建物のライフサイクルコストを分析する"
    ko: "건물 생애주기비용 분석하기"
    vi: "Phân tích chi phí vòng đời của tòa nhà"
    ms: "Menjalankan analisis kos kitaran hayat"
    id: "Melakukan analisis biaya siklus hidup"
    hi: "इमारत का जीवन-चक्र लागत विश्लेषण"
  - en: "Explain how maintenance and obsolescence affect value"
    zh: "说明维护和老化如何影响价值"
    zh-TW: "說明維護與老化如何影響價值"
    ja: "保全と陳腐化が価値に与える影響を説明する"
    ko: "유지보수·노후화가 가치에 주는 영향 설명"
    vi: "Giải thích bảo trì, lỗi thời ảnh hưởng giá trị"
    ms: "Menerangkan kesan penyelenggaraan pada nilai"
    id: "Menjelaskan pengaruh pemeliharaan pada nilai"
    hi: "रखरखाव और अप्रचलन का मूल्य पर असर समझाना"
