code: BIOL10008
year: 2026
learn:
  en: "Life at the molecular and cell level: evolution, cell structure, genes and how bodies regulate themselves."
  zh: "从分子和细胞层面认识生命：演化、细胞结构、基因和调节。"
  zh-TW: "從分子和細胞層面認識生命：演化、細胞結構、基因和調節。"
  ja: "分子と細胞のレベルで見る生命：進化、細胞構造、遺伝子、体の調節。"
  ko: "분자·세포 수준의 생명: 진화, 세포 구조, 유전자, 몸의 자기 조절."
  vi: "Sự sống ở cấp phân tử và tế bào: tiến hóa, cấu trúc tế bào, gen và cách cơ thể tự điều hòa."
  ms: "Kehidupan pada aras molekul dan sel: evolusi, struktur sel, gen dan cara badan mengawal diri."
  id: "Kehidupan di tingkat molekul dan sel: evolusi, struktur sel, gen, dan cara tubuh mengatur diri."
  hi: "अणु और सेल स्तर पर जीवन: विकास, सेल संरचना, जीन और शरीर खुद को कैसे नियंत्रित करता है।"
outcomes:
  - en: "Explain how cells work and pass on information"
    zh: "解释细胞怎样工作和传递信息"
    zh-TW: "解釋細胞如何運作和傳遞資訊"
    ja: "細胞の働きと情報の伝え方を説明する"
    ko: "세포가 작동하고 정보를 전달하는 방식 설명하기"
    vi: "Giải thích tế bào hoạt động và truyền thông tin ra sao"
    ms: "Terangkan cara sel berfungsi dan menyampaikan maklumat"
    id: "Menjelaskan cara sel bekerja dan meneruskan informasi"
    hi: "समझाना कि सेल कैसे काम करते और जानकारी आगे देते हैं"
  - en: "Describe how organisms regulate their internal state"
    zh: "说明生物怎样调节内部环境"
    zh-TW: "說明生物如何調節內部環境"
    ja: "生物が体内環境を調節する仕組みを説明する"
    ko: "생물이 내부 상태를 조절하는 방식 설명하기"
    vi: "Mô tả sinh vật điều hòa trạng thái bên trong ra sao"
    ms: "Huraikan cara organisma mengawal keadaan dalamannya"
    id: "Menjelaskan cara organisme mengatur kondisi internalnya"
    hi: "बताना कि जीव अपनी अंदरूनी स्थिति कैसे नियंत्रित करते हैं"
  - en: "Link biology ideas to experiments and data"
    zh: "把生物学概念和实验数据联系起来"
    zh-TW: "把生物學概念和實驗資料聯繫起來"
    ja: "生物学の考え方を実験やデータと結びつける"
    ko: "생물학 개념을 실험·데이터와 연결하기"
    vi: "Liên hệ khái niệm sinh học với thí nghiệm và dữ liệu"
    ms: "Kaitkan idea biologi dengan eksperimen dan data"
    id: "Mengaitkan konsep biologi dengan eksperimen dan data"
    hi: "बायोलॉजी के विचारों को प्रयोग और डेटा से जोड़ना"
