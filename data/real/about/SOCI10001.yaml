code: SOCI10001
year: 2026
learn:
  en: "An introduction to sociology: how institutions, inequality and social change shape our identities and lives."
  zh: "社会学入门：制度、不平等和社会变迁如何塑造我们的身份和生活。"
  zh-TW: "社會學入門：制度、不平等和社會變遷如何形塑我們的身分和生活。"
  ja: "社会学の入門：制度や格差、社会の変化が私たちのアイデンティティと人生をどう形づくるか。"
  ko: "사회학 입문: 제도, 불평등, 사회 변화가 우리의 정체성과 삶을 어떻게 만드는지 배운다."
  vi: "Nhập môn xã hội học: thể chế, bất bình đẳng và biến đổi xã hội định hình bản sắc và cuộc sống ra sao."
  ms: "Pengenalan sosiologi: bagaimana institusi, ketidaksamaan dan perubahan sosial membentuk identiti dan kehidupan kita."
  id: "Pengantar sosiologi: bagaimana institusi, ketimpangan, dan perubahan sosial membentuk identitas dan hidup kita."
  hi: "समाजशास्त्र की शुरुआत: संस्थाएँ, असमानता और सामाजिक बदलाव हमारी पहचान और ज़िंदगी को कैसे गढ़ते हैं।"
outcomes:
  - en: "Explain the main approaches in sociology"
    zh: "说明社会学的主要流派"
    zh-TW: "說明社會學的主要流派"
    ja: "社会学の主なアプローチを説明する"
    ko: "사회학의 주요 접근법 설명하기"
    vi: "Giải thích các hướng tiếp cận chính của xã hội học"
    ms: "Terangkan pendekatan utama dalam sosiologi"
    id: "Menjelaskan pendekatan utama dalam sosiologi"
    hi: "समाजशास्त्र के मुख्य नज़रिए समझाना"
  - en: "Apply sociological ideas to current social issues"
    zh: "用社会学概念分析当下的社会问题"
    zh-TW: "用社會學概念分析當下的社會問題"
    ja: "社会学の考え方を今の社会問題に当てはめる"
    ko: "사회학 개념을 지금의 사회 문제에 적용하기"
    vi: "Áp dụng ý tưởng xã hội học vào các vấn đề xã hội hiện nay"
    ms: "Gunakan idea sosiologi pada isu sosial semasa"
    id: "Menerapkan konsep sosiologi pada masalah sosial terkini"
    hi: "समाजशास्त्र के विचारों को आज के सामाजिक मुद्दों पर लागू करना"
  - en: "Write an evidence-based argument about society"
    zh: "写出有证据支持的社会议题论证"
    zh-TW: "寫出有證據支持的社會議題論證"
    ja: "根拠にもとづいて社会について論じる文章を書く"
    ko: "근거를 바탕으로 사회에 관한 논증 글쓰기"
    vi: "Viết lập luận có dẫn chứng về xã hội"
    ms: "Tulis hujah berasaskan bukti tentang masyarakat"
    id: "Menulis argumen berbasis bukti tentang masyarakat"
    hi: "समाज पर सबूत के साथ तर्क लिखना"
