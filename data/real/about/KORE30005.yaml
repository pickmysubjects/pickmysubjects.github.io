code: KORE30005
year: 2026
learn:
  en: "Korean society and culture in the 20th and 21st centuries, seen through films and TV dramas."
  zh: "通过电影和电视剧了解20和21世纪的韩国社会与文化。"
  zh-TW: "透過電影和電視劇了解20和21世紀的韓國社會與文化。"
  ja: "映画やドラマを通して20〜21世紀の韓国の社会と文化を知る。"
  ko: "영화와 드라마로 20~21세기 한국 사회와 문화를 이해한다."
  vi: "Xã hội và văn hóa Hàn Quốc thế kỷ 20 và 21 qua phim điện ảnh và phim truyền hình."
  ms: "Masyarakat dan budaya Korea abad ke-20 dan ke-21, dilihat melalui filem dan drama TV."
  id: "Masyarakat dan budaya Korea abad ke-20 dan ke-21, dilihat lewat film dan drama TV."
  hi: "20वीं और 21वीं सदी का कोरियाई समाज और संस्कृति, फ़िल्मों और टीवी ड्रामा के ज़रिए।"
outcomes:
  - en: "Analyse Korean films and dramas critically"
    zh: "批判性地分析韩国电影和电视剧"
    zh-TW: "批判性地分析韓國電影和電視劇"
    ja: "韓国の映画やドラマを批判的に分析する"
    ko: "한국 영화와 드라마 비판적으로 분석하기"
    vi: "Phân tích có phê phán phim và phim truyền hình Hàn"
    ms: "Analisis filem dan drama Korea secara kritis"
    id: "Menganalisis film dan drama Korea secara kritis"
    hi: "कोरियाई फ़िल्मों और ड्रामा का आलोचनात्मक विश्लेषण करना"
  - en: "Discuss identity, gender and inequality in Korea"
    zh: "讨论韩国的身份、性别与不平等"
    zh-TW: "討論韓國的身分、性別與不平等"
    ja: "韓国のアイデンティティ・ジェンダー・格差を論じる"
    ko: "한국의 정체성·젠더·불평등 논의하기"
    vi: "Thảo luận bản sắc, giới và bất bình đẳng ở Hàn Quốc"
    ms: "Bincangkan identiti, gender dan ketaksamaan di Korea"
    id: "Membahas identitas, gender dan ketimpangan di Korea"
    hi: "कोरिया में पहचान, लिंग और असमानता पर चर्चा करना"
  - en: "Write a research report on Korean media"
    zh: "就韩国影视写研究报告"
    zh-TW: "就韓國影視寫研究報告"
    ja: "韓国のメディアについて研究レポートを書く"
    ko: "한국 미디어에 관한 연구 보고서 쓰기"
    vi: "Viết báo cáo nghiên cứu về truyền thông Hàn"
    ms: "Tulis laporan kajian tentang media Korea"
    id: "Menulis laporan penelitian tentang media Korea"
    hi: "कोरियाई मीडिया पर शोध रिपोर्ट लिखना"
