code: MUSI20061
year: 2026
learn:
  en: "Chromatic harmony, counterpoint and musical form through analysis and writing Bach-style chorales."
  zh: "通过分析和写巴赫式众赞歌学习半音和声、对位与曲式。"
  zh-TW: "透過分析和寫巴赫式聖詠學習半音和聲、對位與曲式。"
  ja: "分析とバッハ風コラール作成で半音階和声・対位法・形式を学ぶ。"
  ko: "분석과 바흐풍 코랄 작곡으로 반음계 화성, 대위법, 형식을 배움."
  vi: "Hòa âm bán cung, đối âm và cấu trúc qua phân tích và viết hợp xướng kiểu Bach."
  ms: "Harmoni kromatik, kontrapuntal dan bentuk melalui analisis dan korale gaya Bach."
  id: "Harmoni kromatik, kontrapung dan bentuk lewat analisis dan menulis koral gaya Bach."
  hi: "विश्लेषण और बाख-शैली कोरल लिखकर क्रोमैटिक हार्मनी, काउंटरपॉइंट व फ़ॉर्म।"
outcomes:
  - en: "Analyse chromatic harmony and modulation"
    zh: "分析半音和声与转调"
    zh-TW: "分析半音和聲與轉調"
    ja: "半音階和声と転調を分析する"
    ko: "반음계 화성과 전조 분석하기"
    vi: "Phân tích hòa âm bán cung và chuyển giọng"
    ms: "Analisis harmoni kromatik dan modulasi"
    id: "Menganalisis harmoni kromatik dan modulasi"
    hi: "क्रोमैटिक हार्मनी और मॉड्यूलेशन का विश्लेषण"
  - en: "Write two-part counterpoint and chorales"
    zh: "写二声部对位和众赞歌"
    zh-TW: "寫二聲部對位和聖詠"
    ja: "2声対位法とコラールを書く"
    ko: "2성 대위법과 코랄 쓰기"
    vi: "Viết đối âm hai bè và hợp xướng"
    ms: "Tulis kontrapuntal dua suara dan korale"
    id: "Menulis kontrapung dua suara dan koral"
    hi: "दो-स्वर काउंटरपॉइंट और कोरल लिखना"
  - en: "Recognise common musical forms"
    zh: "识别常见曲式"
    zh-TW: "辨識常見曲式"
    ja: "よくある楽曲形式を見分ける"
    ko: "흔한 음악 형식 알아보기"
    vi: "Nhận biết các cấu trúc nhạc phổ biến"
    ms: "Kenal pasti bentuk muzik biasa"
    id: "Mengenali bentuk musik umum"
    hi: "आम संगीत रूपों को पहचानना"
