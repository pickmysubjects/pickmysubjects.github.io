code: SPAN20028
year: 2026
learn:
  en: "Four weeks in and around Santiago, taught in Spanish: sites that tell Chile's story, local community groups, music, crafts and food."
  zh: "在圣地亚哥及周边学习四周，用西班牙语授课：走访讲述智利故事的地点和社区组织，体验音乐、手工艺和美食。"
  zh-TW: "在聖地牙哥及周邊學習四週，用西班牙語授課：走訪講述智利歷史的地點，接觸當地社區組織，體驗音樂、手工藝和美食。"
  ja: "サンティアゴとその周辺で4週間、スペイン語で学ぶ。チリの歴史を語る場所、地域の団体、音楽、工芸、食。"
  ko: "산티아고와 주변에서 4주간 스페인어로 배운다. 칠레의 이야기를 품은 장소, 지역 단체, 음악, 공예, 음식."
  vi: "Bốn tuần ở Santiago và vùng lân cận, dạy bằng tiếng Tây Ban Nha: địa điểm kể chuyện Chile, tổ chức cộng đồng, âm nhạc, thủ công, ẩm thực."
  ms: "Empat minggu di sekitar Santiago, diajar dalam bahasa Sepanyol: tapak yang bercerita tentang Chile, kumpulan komuniti, muzik, kraf dan makanan."
  id: "Empat minggu di sekitar Santiago, diajar dalam bahasa Spanyol: situs yang bercerita tentang Chile, kelompok komunitas, musik, kerajinan dan kuliner."
  hi: "सैंटियागो और आसपास चार हफ़्ते, स्पेनिश में पढ़ाई: चिली की कहानी कहने वाली जगहें, स्थानीय सामुदायिक संगठन, संगीत, शिल्प और खाना।"
outcomes:
  - en: "Explain how Chilean identity was formed"
    zh: "说明智利的身份认同如何形成"
    zh-TW: "說明智利的身分認同如何形成"
    ja: "チリのアイデンティティがどう形成されたか説明する"
    ko: "칠레 정체성이 형성된 과정 설명하기"
    vi: "Giải thích bản sắc Chile được hình thành ra sao"
    ms: "Terangkan cara identiti Chile terbentuk"
    id: "Menjelaskan cara identitas Chile terbentuk"
    hi: "चिली की पहचान कैसे बनी, समझाना"
  - en: "Engage respectfully with local communities"
    zh: "尊重地与当地社区交流"
    zh-TW: "尊重地與當地社區交流"
    ja: "地域の人々と敬意を持って関わる"
    ko: "지역 공동체와 존중하며 교류하기"
    vi: "Giao lưu tôn trọng với cộng đồng địa phương"
    ms: "Berinteraksi dengan hormat bersama komuniti tempatan"
    id: "Berinteraksi dengan hormat bersama komunitas lokal"
    hi: "स्थानीय समुदायों से सम्मान के साथ जुड़ना"
  - en: "Reflect on links between Chile and Australia"
    zh: "思考智利与澳洲之间的联系"
    zh-TW: "思考智利與澳洲之間的聯繫"
    ja: "チリとオーストラリアのつながりを考える"
    ko: "칠레와 호주의 연결 성찰하기"
    vi: "Suy ngẫm mối liên hệ giữa Chile và Úc"
    ms: "Renungkan kaitan antara Chile dan Australia"
    id: "Merefleksikan kaitan Chile dan Australia"
    hi: "चिली और ऑस्ट्रेलिया के रिश्तों पर विचार करना"
