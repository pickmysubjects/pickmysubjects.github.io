code: ABPL90416
year: 2027
learn:
  en: "The economic, social, legal and political context of land and property markets."
  zh: "土地与房地产市场的经济、社会、法律和政治背景。"
  zh-TW: "土地與房地產市場的經濟、社會、法律和政治背景。"
  ja: "土地・不動産市場の経済的・社会的・法的・政治的背景。"
  ko: "토지·부동산 시장의 경제적·사회적·법적·정치적 맥락."
  vi: "Bối cảnh kinh tế, xã hội, pháp lý và chính trị của thị trường đất đai và bất động sản."
  ms: "Konteks ekonomi, sosial, undang-undang dan politik pasaran tanah dan hartanah."
  id: "Konteks ekonomi, sosial, hukum, dan politik pasar tanah dan properti."
  hi: "भूमि और संपत्ति बाज़ार का आर्थिक, सामाजिक, क़ानूनी और राजनीतिक संदर्भ।"
outcomes:
  - en: "Apply economic theory to property markets"
    zh: "把经济理论用于房地产市场"
    zh-TW: "把經濟理論用於房地產市場"
    ja: "経済理論を不動産市場に使う"
    ko: "경제 이론을 부동산 시장에 적용하기"
    vi: "Áp dụng lý thuyết kinh tế vào thị trường bất động sản"
    ms: "Menggunakan teori ekonomi pada pasaran hartanah"
    id: "Menerapkan teori ekonomi pada pasar properti"
    hi: "संपत्ति बाज़ार पर आर्थिक सिद्धांत लागू करना"
  - en: "Explain how property rights are shared"
    zh: "解释产权如何在各方之间分配"
    zh-TW: "解釋產權如何在各方之間分配"
    ja: "財産権の配分を説明する"
    ko: "재산권 분배 설명하기"
    vi: "Giải thích cách phân bổ quyền tài sản"
    ms: "Menerangkan agihan hak harta"
    id: "Menjelaskan pembagian hak properti"
    hi: "संपत्ति अधिकारों का बँटवारा समझाना"
