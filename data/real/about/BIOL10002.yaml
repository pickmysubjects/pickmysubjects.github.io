code: BIOL10002
year: 2026
learn:
  en: "Life at the molecular and cell level: evolution, cell structure, genes, regulation and how organisms interact."
  zh: "从分子和细胞层面看生命：演化、细胞、基因和生理调节。"
  zh-TW: "從分子和細胞層面看生命：演化、細胞、基因和生理調節。"
  ja: "分子と細胞のレベルで見る生命：進化、細胞構造、遺伝子、調節、生物間の相互作用。"
  ko: "분자·세포 수준의 생명: 진화, 세포 구조, 유전자, 조절, 생물 간 상호작용."
  vi: "Sự sống ở cấp phân tử và tế bào: tiến hóa, cấu trúc tế bào, gen, điều hòa và tương tác sinh vật."
  ms: "Kehidupan pada aras molekul dan sel: evolusi, struktur sel, gen, pengawalaturan dan interaksi organisma."
  id: "Kehidupan di tingkat molekul dan sel: evolusi, struktur sel, gen, regulasi, dan interaksi organisme."
  hi: "अणु और सेल स्तर पर जीवन: विकास, सेल संरचना, जीन, नियमन और जीवों का आपसी संबंध।"
outcomes:
  - en: "Explain how cells work and pass on information"
    zh: "解释细胞怎样工作和传递信息"
    zh-TW: "解釋細胞如何運作和傳遞資訊"
    ja: "細胞の働きと情報の伝え方を説明する"
    ko: "세포가 작동하고 정보를 전달하는 방식 설명하기"
    vi: "Giải thích tế bào hoạt động và truyền thông tin ra sao"
    ms: "Terangkan cara sel berfungsi dan menyampaikan maklumat"
    id: "Menjelaskan cara sel bekerja dan meneruskan informasi"
    hi: "समझाना कि सेल कैसे काम करते और जानकारी आगे देते हैं"
  - en: "Describe how organisms regulate their internal state"
    zh: "说明生物怎样调节内部环境"
    zh-TW: "說明生物如何調節內部環境"
    ja: "生物が体内環境を調節する仕組みを説明する"
    ko: "생물이 내부 상태를 조절하는 방식 설명하기"
    vi: "Mô tả sinh vật điều hòa trạng thái bên trong ra sao"
    ms: "Huraikan cara organisma mengawal keadaan dalamannya"
    id: "Menjelaskan cara organisme mengatur kondisi internalnya"
    hi: "बताना कि जीव अपनी अंदरूनी स्थिति कैसे नियंत्रित करते हैं"
  - en: "Design and run a small inquiry project"
    zh: "设计并完成一个探究项目"
    zh-TW: "設計並完成一個探究專題"
    ja: "小さな探究プロジェクトを計画・実施する"
    ko: "작은 탐구 프로젝트 설계하고 수행하기"
    vi: "Thiết kế và thực hiện một dự án tìm hiểu nhỏ"
    ms: "Reka dan jalankan projek inkuiri kecil"
    id: "Merancang dan menjalankan proyek inkuiri kecil"
    hi: "एक छोटा इन्क्वायरी प्रोजेक्ट डिज़ाइन करके चलाना"
