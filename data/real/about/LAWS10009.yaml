code: LAWS10009
year: 2026
learn:
  en: "How law and ethics respond to AI: facial recognition, predictive policing, deepfakes, automated decisions and AI in medicine."
  zh: "法律与伦理如何回应人工智能：人脸识别、预测性执法、深度伪造、自动化决策和医疗 AI"
  zh-TW: "法律與倫理如何回應人工智慧：人臉辨識、預測性執法、深偽、自動化決策和醫療 AI"
  ja: "法と倫理はAIにどう向き合うか。顔認識、予測型警察、ディープフェイク、自動判断、医療AI。"
  ko: "법과 윤리는 AI에 어떻게 대응하나: 얼굴 인식, 예측 치안, 딥페이크, 자동화된 결정, 의료 AI."
  vi: "Luật và đạo đức ứng phó với AI: nhận diện khuôn mặt, dự đoán tội phạm, deepfake, quyết định tự động, AI y tế."
  ms: "Cara undang-undang dan etika menangani AI: pengecaman wajah, deepfake, keputusan automatik dan AI perubatan."
  id: "Cara hukum dan etika menanggapi AI: pengenalan wajah, polisi prediktif, deepfake, keputusan otomatis, AI medis."
  hi: "कानून और नैतिकता AI से कैसे निपटते हैं: चेहरा पहचान, प्रेडिक्टिव पुलिसिंग, डीपफ़ेक, स्वचालित निर्णय, चिकित्सा AI।"
outcomes:
  - en: "Explain the main legal issues AI raises"
    zh: "说明人工智能带来的主要法律问题"
    zh-TW: "說明人工智慧帶來的主要法律問題"
    ja: "AIが生む主な法的問題を説明する"
    ko: "AI가 일으키는 주요 법적 문제 설명하기"
    vi: "Giải thích các vấn đề pháp lý chính do AI đặt ra"
    ms: "Menerangkan isu undang-undang utama akibat AI"
    id: "Menjelaskan isu hukum utama yang dimunculkan AI"
    hi: "AI से उठने वाले मुख्य कानूनी मुद्दे समझाना"
  - en: "Apply legal responses to real AI cases"
    zh: "把法律对策应用到真实的 AI 案例"
    zh-TW: "把法律對策應用到真實的 AI 案例"
    ja: "実際のAI事例に法的対応を当てはめる"
    ko: "실제 AI 사례에 법적 대응 적용하기"
    vi: "Áp dụng giải pháp pháp lý vào ca AI thực tế"
    ms: "Mengaplikasi respons undang-undang pada kes AI sebenar"
    id: "Menerapkan respons hukum pada kasus AI nyata"
    hi: "असली AI मामलों पर कानूनी उपाय लागू करना"
  - en: "Argue about AI clearly to experts and non-experts"
    zh: "向专业和非专业人士清楚讨论 AI"
    zh-TW: "向專業和非專業人士清楚討論 AI"
    ja: "専門家にも一般にもAIを明快に論じる"
    ko: "전문가와 일반인 모두에게 AI를 명확히 논하기"
    vi: "Tranh luận rõ ràng về AI với chuyên gia lẫn người thường"
    ms: "Berhujah tentang AI dengan jelas kepada semua"
    id: "Berargumen tentang AI dengan jelas kepada siapa pun"
    hi: "विशेषज्ञों और आम लोगों से AI पर स्पष्ट तर्क करना"
