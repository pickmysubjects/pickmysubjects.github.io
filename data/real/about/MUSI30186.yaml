code: MUSI30186
year: 2026
learn:
  en: "A second semester in the Conservatorium orchestras and wind bands, with up to 72 hours of rehearsals and concerts. Pass/fail."
  zh: "音乐学院乐团第二学期，排练与演出最多72小时。及格制。"
  zh-TW: "音樂學院樂團第二學期，排練與演出最多72小時。及格制。"
  ja: "オーケストラ・吹奏楽の後期。練習と本番は最大72時間。合否判定。"
  ko: "오케스트라·관악단 2학기. 리허설과 공연 최대 72시간. 합격/불합격."
  vi: "Học kỳ hai trong dàn nhạc, tối đa 72 giờ tập và diễn. Đạt/không đạt."
  ms: "Semester kedua orkestra, sehingga 72 jam latihan dan konsert. Lulus/gagal."
  id: "Semester kedua orkestra, hingga 72 jam latihan dan konser. Lulus/gagal."
  hi: "ऑर्केस्ट्रा का दूसरा सत्र, 72 घंटे तक रिहर्सल और कॉन्सर्ट। पास/फ़ेल।"
outcomes:
  - en: "Keep up with intensive orchestral rehearsals"
    zh: "跟上密集的乐团排练"
    zh-TW: "跟上密集的樂團排練"
    ja: "集中的なオーケストラ練習についていく"
    ko: "집중적인 오케스트라 리허설 소화하기"
    vi: "Theo kịp lịch tập dàn nhạc dày đặc"
    ms: "Ikuti latihan orkestra yang padat"
    id: "Mengikuti latihan orkestra yang padat"
    hi: "गहन ऑर्केस्ट्रा रिहर्सल के साथ चलना"
  - en: "Follow a conductor in large-ensemble playing"
    zh: "在大编制演奏中跟随指挥"
    zh-TW: "在大編制演奏中跟隨指揮"
    ja: "大編成で指揮者に従って演奏する"
    ko: "대편성 연주에서 지휘자 따르기"
    vi: "Theo chỉ huy khi chơi trong dàn lớn"
    ms: "Ikut konduktor dalam ensembel besar"
    id: "Mengikuti konduktor di ansambel besar"
    hi: "बड़े समूह में संचालक का अनुसरण करना"
  - en: "Perform in public symphonic concerts"
    zh: "参加公开交响音乐会"
    zh-TW: "參加公開交響音樂會"
    ja: "公開の交響演奏会に出る"
    ko: "공개 교향 공연에 서기"
    vi: "Biểu diễn trong hòa nhạc giao hưởng"
    ms: "Membuat persembahan konsert simfoni"
    id: "Tampil dalam konser simfoni publik"
    hi: "सार्वजनिक सिम्फ़नी कॉन्सर्ट में बजाना"
