code: ISYS90112
year: 2027
learn:
  en: "Modelling business processes and analysing historical business data through a process lens, with hands-on software tools."
  zh: "业务流程建模，并从流程视角分析历史业务数据，配合软件工具实操。"
  zh-TW: "業務流程建模，並從流程角度分析歷史業務資料，搭配軟體工具實作。"
  ja: "業務プロセスのモデル化と、プロセスの観点での過去データ分析。ソフトウェアで実習。"
  ko: "업무 프로세스 모델링과 프로세스 관점의 과거 업무 데이터 분석, 소프트웨어 실습 포함."
  vi: "Mô hình hóa quy trình và phân tích dữ liệu kinh doanh quá khứ theo góc nhìn quy trình, thực hành với phần mềm."
  ms: "Memodelkan proses perniagaan dan menganalisis data lampau dari sudut proses, dengan latihan perisian."
  id: "Memodelkan proses bisnis dan menganalisis data historis dari sudut proses, dengan praktik perangkat lunak."
  hi: "बिज़नेस प्रक्रियाओं का मॉडल बनाना और पुराने डेटा को प्रक्रिया की नज़र से जाँचना, सॉफ़्टवेयर पर अभ्यास के साथ।"
outcomes:
  - en: "Model and document business processes"
    zh: "为业务流程建模并编写文档"
    zh-TW: "為業務流程建模並撰寫文件"
    ja: "業務プロセスをモデル化し文書にする"
    ko: "업무 프로세스를 모델링하고 문서화하기"
    vi: "Mô hình hóa và lập tài liệu quy trình nghiệp vụ"
    ms: "Memodelkan dan mendokumenkan proses perniagaan"
    id: "Memodelkan dan mendokumentasikan proses bisnis"
    hi: "बिज़नेस प्रक्रियाओं का मॉडल और दस्तावेज़ बनाना"
  - en: "Analyse event data to see how a process really runs"
    zh: "分析事件数据，了解流程的实际运行"
    zh-TW: "分析事件資料，了解流程的實際運作"
    ja: "イベントデータからプロセスの実態を分析する"
    ko: "이벤트 데이터로 프로세스의 실제 흐름 분석하기"
    vi: "Phân tích dữ liệu sự kiện để thấy quy trình thực tế"
    ms: "Menganalisis data peristiwa untuk melihat proses sebenar"
    id: "Menganalisis data kejadian untuk melihat proses nyata"
    hi: "इवेंट डेटा से देखना कि प्रक्रिया असल में कैसे चलती है"
