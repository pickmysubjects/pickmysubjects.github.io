code: ZOOL30009
year: 2026
learn:
  en: "A field research project in ecology, usually in the Daintree Rainforest, from design to reporting."
  zh: "生态学野外研究项目，通常在戴恩树雨林，从设计到汇报。"
  zh-TW: "生態學野外研究專題，通常在戴恩樹雨林，從設計到報告。"
  ja: "主にデインツリー熱帯雨林での生態学フィールド研究、設計から報告まで。"
  ko: "주로 데인트리 열대우림에서 하는 생태 현장 연구, 설계부터 보고까지."
  vi: "Dự án nghiên cứu sinh thái thực địa, thường ở rừng Daintree, từ thiết kế đến báo cáo."
  ms: "Projek kajian lapangan ekologi, biasanya di Hutan Hujan Daintree, dari reka bentuk ke laporan."
  id: "Proyek riset lapangan ekologi, biasanya di Hutan Hujan Daintree, dari desain hingga laporan."
  hi: "इकोलॉजी का फ़ील्ड रिसर्च प्रोजेक्ट, आमतौर पर Daintree वर्षावन में, डिज़ाइन से रिपोर्ट तक।"
outcomes:
  - en: "Collect field data as a team"
    zh: "团队合作采集野外数据"
    zh-TW: "團隊合作蒐集野外數據"
    ja: "チームで野外データを集める"
    ko: "팀으로 현장 데이터 수집하기"
    vi: "Thu thập dữ liệu thực địa theo nhóm"
    ms: "Mengumpul data lapangan secara berkumpulan"
    id: "Mengumpulkan data lapangan dalam tim"
    hi: "टीम में फ़ील्ड डेटा जुटाना"
  - en: "Test hypotheses with statistics"
    zh: "用统计检验假设"
    zh-TW: "用統計檢驗假設"
    ja: "統計で仮説を検証する"
    ko: "통계로 가설 검정하기"
    vi: "Kiểm định giả thuyết bằng thống kê"
    ms: "Menguji hipotesis dengan statistik"
    id: "Menguji hipotesis dengan statistik"
    hi: "आँकड़ों से परिकल्पना जाँचना"
  - en: "Present results in talks and reports"
    zh: "通过演讲和报告展示结果"
    zh-TW: "透過簡報和報告呈現結果"
    ja: "発表とレポートで結果を伝える"
    ko: "발표와 보고서로 결과 전달하기"
    vi: "Trình bày kết quả qua thuyết trình và báo cáo"
    ms: "Membentang hasil melalui ceramah dan laporan"
    id: "Menyajikan hasil lewat presentasi dan laporan"
    hi: "प्रेज़ेंटेशन और रिपोर्ट में नतीजे पेश करना"
