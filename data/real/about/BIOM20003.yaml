code: BIOM20003
year: 2027
learn:
  en: "How genes and cells build tissues and organs, and what goes wrong in disease, including injury, repair and cancer."
  zh: "基因和细胞如何构建组织和器官，以及疾病中出了什么问题，包括损伤、修复和癌症。"
  zh-TW: "基因和細胞如何構成組織和器官，以及疾病中出了什麼問題，包括損傷、修復和癌症。"
  ja: "遺伝子と細胞が組織や臓器をどう作り、病気で何が狂うのか。損傷、修復、がんまで。"
  ko: "유전자와 세포가 조직·장기를 어떻게 만들고, 질병에서 무엇이 잘못되는지: 손상, 회복, 암까지."
  vi: "Gen và tế bào tạo nên mô và cơ quan ra sao, và điều gì trục trặc khi mắc bệnh, gồm tổn thương, phục hồi và ung thư."
  ms: "Bagaimana gen dan sel membina tisu dan organ, dan apa yang salah dalam penyakit termasuk kecederaan, pemulihan dan kanser."
  id: "Bagaimana gen dan sel membangun jaringan dan organ, dan apa yang salah saat sakit, termasuk cedera, pemulihan, dan kanker."
  hi: "जीन और कोशिकाएँ ऊतक व अंग कैसे बनाती हैं, और बीमारी में क्या बिगड़ता है, जैसे चोट, मरम्मत और कैंसर।"
outcomes:
  - en: "Explain how cells and tissues form and work"
    zh: "解释细胞和组织如何形成与运作"
    zh-TW: "解釋細胞和組織如何形成與運作"
    ja: "細胞と組織の形成としくみを説明する"
    ko: "세포와 조직의 형성과 작동 설명하기"
    vi: "Giải thích tế bào và mô hình thành, hoạt động ra sao"
    ms: "Terangkan cara sel dan tisu terbentuk dan berfungsi"
    id: "Menjelaskan cara sel dan jaringan terbentuk dan bekerja"
    hi: "कोशिकाएँ और ऊतक कैसे बनते व काम करते हैं, समझाना"
  - en: "Analyse injury, repair and pathological change"
    zh: "分析损伤、修复和病理变化"
    zh-TW: "分析損傷、修復和病理變化"
    ja: "損傷・修復・病的変化を分析する"
    ko: "손상·회복·병리적 변화 분석하기"
    vi: "Phân tích tổn thương, phục hồi và biến đổi bệnh lý"
    ms: "Analisis kecederaan, pemulihan dan perubahan patologi"
    id: "Menganalisis cedera, pemulihan, dan perubahan patologis"
    hi: "चोट, मरम्मत और रोग-परिवर्तन का विश्लेषण"
  - en: "Explain the cell and gene basis of cancer"
    zh: "解释癌症在细胞和基因层面的成因"
    zh-TW: "解釋癌症在細胞和基因層面的成因"
    ja: "がんの細胞・遺伝子レベルの成り立ちを説明する"
    ko: "암의 세포·유전자 수준 원인 설명하기"
    vi: "Giải thích cơ sở tế bào và gen của ung thư"
    ms: "Terangkan asas sel dan gen bagi kanser"
    id: "Menjelaskan dasar sel dan gen dari kanker"
    hi: "कैंसर का कोशिका और जीन स्तर पर आधार समझाना"
