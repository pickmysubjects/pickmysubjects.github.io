code: AGRI30016
year: 2026
learn:
  en: "Water for farm irrigation: systems, hydraulics, costs, policy and the Murray–Darling Basin."
  zh: "农业灌溉用水：系统、水力学、成本、政策和墨累-达令盆地。"
  zh-TW: "農業灌溉用水：系統、水力學、成本、政策與墨累-達令盆地。"
  ja: "農業灌漑の水：設備、水理、コスト、政策とマレー・ダーリング流域。"
  ko: "농업 관개용수: 시스템, 수리학, 비용, 정책과 머리-달링 유역."
  vi: "Nước tưới nông nghiệp: hệ thống, thủy lực, chi phí, chính sách và lưu vực Murray–Darling."
  ms: "Air pengairan ladang: sistem, hidraulik, kos, dasar dan Lembangan Murray–Darling."
  id: "Air irigasi pertanian: sistem, hidrolika, biaya, kebijakan, dan Cekungan Murray–Darling."
  hi: "खेती की सिंचाई का पानी: प्रणालियाँ, हाइड्रॉलिक्स, लागत, नीति और मरे–डार्लिंग बेसिन।"
outcomes:
  - en: "Work out crop water needs"
    zh: "计算作物需水量"
    zh-TW: "計算作物需水量"
    ja: "作物の必要水量を求める"
    ko: "작물 필요 수량 산정하기"
    vi: "Tính nhu cầu nước của cây"
    ms: "Kira keperluan air tanaman"
    id: "Menghitung kebutuhan air tanaman"
    hi: "फसल की पानी की ज़रूरत निकालें"
  - en: "Apply hydraulics to choose irrigation systems"
    zh: "运用水力学选择灌溉系统"
    zh-TW: "運用水力學選擇灌溉系統"
    ja: "水理学で灌漑方式を選ぶ"
    ko: "수리학으로 관개 방식 선택하기"
    vi: "Dùng thủy lực học để chọn hệ thống tưới"
    ms: "Guna hidraulik untuk pilih sistem pengairan"
    id: "Menerapkan hidrolika untuk memilih sistem irigasi"
    hi: "सिंचाई प्रणाली चुनने में हाइड्रॉलिक्स लगाएँ"
  - en: "Assess irrigation efficiency, cost and impact"
    zh: "评估灌溉的效率、成本和环境影响"
    zh-TW: "評估灌溉的效率、成本與環境影響"
    ja: "灌漑の効率・コスト・影響を評価する"
    ko: "관개 효율·비용·영향 평가하기"
    vi: "Đánh giá hiệu quả, chi phí và tác động tưới"
    ms: "Nilai kecekapan, kos dan kesan pengairan"
    id: "Menilai efisiensi, biaya, dan dampak irigasi"
    hi: "सिंचाई की दक्षता, लागत और प्रभाव आँकें"
