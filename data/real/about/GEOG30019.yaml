code: GEOG30019
year: 2026
learn:
  en: "What 'sustainable development' really means, its history and critiques, and whether it helps in practice."
  zh: "“可持续发展”的真正含义、历史与批评，以及它在实践中是否有用。"
  zh-TW: "「永續發展」的真正含義、歷史與批評，以及它在實務上是否有用。"
  ja: "「持続可能な開発」の本当の意味、歴史と批判、実際に役立つか。"
  ko: "'지속가능한 발전'의 실제 의미, 역사와 비판, 실제로 도움이 되는지."
  vi: "'Phát triển bền vững' thực sự là gì, lịch sử, phê bình và liệu nó có ích trong thực tế."
  ms: "Maksud sebenar 'pembangunan lestari', sejarah dan kritikannya, serta kegunaannya."
  id: "Arti sebenarnya 'pembangunan berkelanjutan', sejarah dan kritiknya, serta manfaat praktisnya."
  hi: "'सतत विकास' का असली अर्थ, इतिहास और आलोचनाएँ, और क्या यह व्यवहार में काम आता है।"
outcomes:
  - en: "Compare theories of sustainable development"
    zh: "比较可持续发展理论"
    zh-TW: "比較永續發展理論"
    ja: "持続可能な開発の理論を比較する"
    ko: "지속가능발전 이론 비교하기"
    vi: "So sánh các lý thuyết phát triển bền vững"
    ms: "Banding teori pembangunan lestari"
    id: "Membandingkan teori pembangunan berkelanjutan"
    hi: "सतत विकास के सिद्धांतों की तुलना करना"
  - en: "Weigh competing views in sustainability debates"
    zh: "权衡可持续性争论中的不同观点"
    zh-TW: "權衡永續爭論中的不同觀點"
    ja: "持続可能性の対立する見解を整理する"
    ko: "지속가능성 논쟁의 상반된 관점 종합하기"
    vi: "Cân nhắc các quan điểm trái chiều về bền vững"
    ms: "Timbang pandangan bersaing dalam isu kelestarian"
    id: "Menimbang pandangan berbeda soal keberlanjutan"
    hi: "स्थिरता बहस के विरोधी मतों को परखना"
