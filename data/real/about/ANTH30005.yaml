code: ANTH30005
year: 2026
learn:
  en: "How inequality is created, kept up and challenged, using Marxist, post-structural and post-colonial anthropology."
  zh: "用马克思主义、后结构和后殖民人类学，看不平等如何产生、维持与被挑战。"
  zh-TW: "用馬克思主義、後結構和後殖民人類學，看不平等如何產生、維持與被挑戰。"
  ja: "マルクス主義・ポスト構造主義・ポストコロニアルの人類学から、格差がどう生まれ続き挑まれるかを学ぶ。"
  ko: "마르크스주의, 탈구조주의, 탈식민 인류학으로 불평등이 만들어지고 유지되고 도전받는 방식을 배운다."
  vi: "Bất bình đẳng được tạo ra, duy trì và thách thức ra sao, qua nhân học Marxist, hậu cấu trúc và hậu thuộc địa."
  ms: "Cara ketaksamaan dicipta, dikekalkan dan dicabar, melalui antropologi Marxis, pascastruktural dan pascakolonial."
  id: "Cara ketimpangan diciptakan, dipertahankan, dan ditantang, lewat antropologi Marxis, pascastruktural, dan pascakolonial."
  hi: "असमानता कैसे बनती, टिकती और चुनौती पाती है, मार्क्सवादी, उत्तर-संरचनावादी और उत्तर-औपनिवेशिक मानवशास्त्र से।"
outcomes:
  - en: "Explain major theories of power and ideology"
    zh: "解释关于权力与意识形态的主要理论"
    zh-TW: "解釋關於權力與意識形態的主要理論"
    ja: "権力とイデオロギーの主な理論を説明する"
    ko: "권력과 이데올로기의 주요 이론 설명하기"
    vi: "Giải thích các lý thuyết lớn về quyền lực và ý thức hệ"
    ms: "Terangkan teori utama kuasa dan ideologi"
    id: "Menjelaskan teori utama kekuasaan dan ideologi"
    hi: "सत्ता और विचारधारा के प्रमुख सिद्धांत समझाना"
  - en: "Compare forms of inequality across cultures"
    zh: "跨文化比较不同形式的不平等"
    zh-TW: "跨文化比較不同形式的不平等"
    ja: "文化を越えて格差の形を比べる"
    ko: "문화 간 불평등 형태 비교하기"
    vi: "So sánh các dạng bất bình đẳng giữa các nền văn hóa"
    ms: "Bandingkan bentuk ketaksamaan merentas budaya"
    id: "Membandingkan bentuk ketimpangan lintas budaya"
    hi: "संस्कृतियों में असमानता के रूपों की तुलना करना"
  - en: "Assess the role of colonialism in inequality"
    zh: "评估殖民主义在不平等中的作用"
    zh-TW: "評估殖民主義在不平等中的作用"
    ja: "格差における植民地主義の役割を評価する"
    ko: "불평등에서 식민주의의 역할 평가하기"
    vi: "Đánh giá vai trò của chủ nghĩa thực dân trong bất bình đẳng"
    ms: "Nilai peranan penjajahan dalam ketaksamaan"
    id: "Menilai peran kolonialisme dalam ketimpangan"
    hi: "असमानता में उपनिवेशवाद की भूमिका का आकलन करना"
