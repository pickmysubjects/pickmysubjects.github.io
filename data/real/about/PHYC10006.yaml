code: PHYC10006
year: 2026
learn:
  en: "Physics behind living things and the environment: blood flow, heat, nerves, radiation and medical imaging."
  zh: "生物和环境背后的物理：血流、热、神经电、辐射和医学成像。"
  zh-TW: "生物和環境背後的物理：血流、熱、神經電、輻射和醫學影像。"
  ja: "生物と環境の背後にある物理：血流、熱、神経、放射線、医療画像。"
  ko: "생물과 환경 뒤의 물리: 혈류, 열, 신경, 방사선, 의료 영상."
  vi: "Vật lý đằng sau sinh vật và môi trường: dòng máu, nhiệt, thần kinh, bức xạ, chẩn đoán hình ảnh."
  ms: "Fizik di sebalik hidupan dan alam sekitar: aliran darah, haba, saraf, sinaran dan pengimejan perubatan."
  id: "Fisika di balik makhluk hidup dan lingkungan: aliran darah, panas, saraf, radiasi, pencitraan medis."
  hi: "जीवों और पर्यावरण के पीछे की फ़िज़िक्स: रक्त प्रवाह, ऊष्मा, नसें, रेडिएशन, मेडिकल इमेजिंग।"
outcomes:
  - en: "Apply physics to biology and environment problems"
    zh: "用物理解释生物和环境问题"
    zh-TW: "用物理解釋生物和環境問題"
    ja: "物理を生物や環境の問題に応用する"
    ko: "물리를 생물·환경 문제에 적용"
    vi: "Áp dụng vật lý vào vấn đề sinh học và môi trường"
    ms: "Gunakan fizik pada masalah biologi dan alam sekitar"
    id: "Menerapkan fisika pada masalah biologi dan lingkungan"
    hi: "फ़िज़िक्स को बायोलॉजी व पर्यावरण समस्याओं पर लागू करना"
  - en: "Explain how X-rays, CT and ultrasound work"
    zh: "解释X光、CT和超声的原理"
    zh-TW: "解釋X光、CT和超音波的原理"
    ja: "X線、CT、超音波の仕組みを説明する"
    ko: "X선, CT, 초음파의 원리 설명"
    vi: "Giải thích X-quang, CT và siêu âm hoạt động ra sao"
    ms: "Terangkan cara X-ray, CT dan ultrabunyi berfungsi"
    id: "Menjelaskan cara kerja sinar-X, CT, dan USG"
    hi: "X-ray, CT और अल्ट्रासाउंड कैसे काम करते हैं, समझाना"
  - en: "Take measurements in the lab and interpret them"
    zh: "在实验室测量并解读数据"
    zh-TW: "在實驗室測量並解讀數據"
    ja: "実験室で測定し、結果を解釈する"
    ko: "실험실에서 측정하고 해석"
    vi: "Đo đạc trong lab và giải thích kết quả"
    ms: "Buat pengukuran di makmal dan tafsirkannya"
    id: "Melakukan pengukuran di lab dan menafsirkannya"
    hi: "लैब में माप लेना और उन्हें समझना"
