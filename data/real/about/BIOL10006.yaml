code: BIOL10006
year: 2026
learn:
  en: "Cells, plant and animal systems, biodiversity and human impact on life, with hands-on lab work."
  zh: "细胞、动植物系统、生物多样性及人类对生命的影响，含实验课。"
  zh-TW: "細胞、動植物系統、生物多樣性及人類對生命的影響，含實驗課。"
  ja: "細胞、動植物のしくみ、生物多様性と人間の影響を実習も交えて学ぶ。"
  ko: "세포, 동식물 체계, 생물다양성과 인간의 영향을 실험과 함께 배운다."
  vi: "Tế bào, hệ thống động thực vật, đa dạng sinh học và tác động của con người, kèm thực hành."
  ms: "Sel, sistem tumbuhan dan haiwan, biodiversiti dan kesan manusia, dengan kerja makmal."
  id: "Sel, sistem tumbuhan dan hewan, keanekaragaman hayati dan dampak manusia, dengan praktikum."
  hi: "कोशिकाएँ, पौधों और जानवरों के तंत्र, जैव विविधता और मानव प्रभाव, प्रयोगशाला कार्य सहित।"
outcomes:
  - en: "Describe prokaryotic and eukaryotic cells"
    zh: "描述原核与真核细胞"
    zh-TW: "描述原核與真核細胞"
    ja: "原核細胞と真核細胞を説明する"
    ko: "원핵세포와 진핵세포를 설명한다"
    vi: "Mô tả tế bào nhân sơ và nhân thực"
    ms: "Huraikan sel prokariot dan eukariot"
    id: "Menjelaskan sel prokariot dan eukariot"
    hi: "प्रोकैरियोटिक और यूकैरियोटिक कोशिकाओं का वर्णन करें"
  - en: "Explain how plant and animal systems work"
    zh: "解释动植物系统如何运作"
    zh-TW: "解釋動植物系統如何運作"
    ja: "動植物の器官系のはたらきを説明する"
    ko: "동식물 기관계의 작동을 설명한다"
    vi: "Giải thích cách hệ thống động thực vật hoạt động"
    ms: "Terangkan cara sistem tumbuhan dan haiwan berfungsi"
    id: "Menjelaskan cara kerja sistem tumbuhan dan hewan"
    hi: "पौधों और जानवरों के तंत्र कैसे काम करते हैं, समझाएँ"
  - en: "Use basic lab equipment in groups"
    zh: "分组使用基本实验设备"
    zh-TW: "分組使用基本實驗設備"
    ja: "グループで基本的な実験器具を使う"
    ko: "조별로 기본 실험 장비를 사용한다"
    vi: "Sử dụng thiết bị thí nghiệm cơ bản theo nhóm"
    ms: "Gunakan peralatan makmal asas secara berkumpulan"
    id: "Menggunakan alat laboratorium dasar dalam kelompok"
    hi: "समूह में बुनियादी प्रयोगशाला उपकरण का उपयोग करें"
