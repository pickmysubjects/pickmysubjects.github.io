code: FLTV20011
year: 2026
learn:
  en: "Writing for games: game concepts, interactive stories and a group pitch for an original game idea."
  zh: "为游戏写作：游戏概念、互动叙事，并以小组形式推介原创游戏。"
  zh-TW: "為遊戲寫作：遊戲概念、互動敘事，並以小組形式提案原創遊戲。"
  ja: "ゲームのための執筆：ゲーム概念、インタラクティブな物語、オリジナル企画のピッチ。"
  ko: "게임을 위한 글쓰기: 게임 개념, 인터랙티브 서사, 오리지널 게임 그룹 피칭."
  vi: "Viết cho game: khái niệm game, truyện tương tác và pitch nhóm cho ý tưởng game."
  ms: "Menulis untuk permainan: konsep, naratif interaktif dan pitch kumpulan idea asli."
  id: "Menulis untuk gim: konsep gim, narasi interaktif dan pitch kelompok ide orisinal."
  hi: "गेम्स के लिए लेखन: गेम कॉन्सेप्ट, इंटरैक्टिव कहानी और मौलिक गेम का समूह पिच।"
outcomes:
  - en: "Write a short interactive narrative"
    zh: "写一段短的互动叙事"
    zh-TW: "寫一段短的互動敘事"
    ja: "短いインタラクティブ物語を書く"
    ko: "짧은 인터랙티브 서사 쓰기"
    vi: "Viết một truyện tương tác ngắn"
    ms: "Tulis naratif interaktif pendek"
    id: "Menulis narasi interaktif pendek"
    hi: "छोटी इंटरैक्टिव कहानी लिखना"
  - en: "Develop an original game concept in a team"
    zh: "与团队开发原创游戏概念"
    zh-TW: "與團隊開發原創遊戲概念"
    ja: "チームでオリジナルのゲーム案を作る"
    ko: "팀으로 오리지널 게임 콘셉트 개발하기"
    vi: "Cùng nhóm phát triển ý tưởng game"
    ms: "Bangunkan konsep permainan asli berkumpulan"
    id: "Mengembangkan konsep gim bersama tim"
    hi: "टीम में मौलिक गेम कॉन्सेप्ट बनाना"
  - en: "Pitch a game with sales documents"
    zh: "用推介文件推销一款游戏"
    zh-TW: "用提案文件推銷一款遊戲"
    ja: "販売資料付きでゲームをピッチする"
    ko: "판매 자료로 게임 피칭하기"
    vi: "Pitch game kèm tài liệu bán hàng"
    ms: "Bentang permainan dengan dokumen jualan"
    id: "Mem-pitch gim dengan dokumen jual"
    hi: "सेल डॉक्यूमेंट के साथ गेम पिच करना"
