code: ELEN90052
year: 2027
learn:
  en: "Statistical signal processing: random signals, estimation, Kalman and Wiener filters, using MATLAB and DSP boards."
  zh: "统计信号处理：随机信号、参数估计、卡尔曼滤波和维纳滤波，使用 MATLAB 和 DSP 开发板。"
  zh-TW: "統計訊號處理：隨機訊號、參數估計、卡爾曼與維納濾波，使用 MATLAB 與 DSP 開發板。"
  ja: "統計的信号処理：ランダム信号・推定・カルマン/ウィーナーフィルタ。MATLABとDSPボードを使う。"
  ko: "통계적 신호처리: 랜덤 신호, 추정, 칼만·위너 필터. MATLAB과 DSP 보드 사용."
  vi: "Xử lý tín hiệu thống kê: tín hiệu ngẫu nhiên, ước lượng, bộ lọc Kalman và Wiener, dùng MATLAB và bo mạch DSP."
  ms: "Pemprosesan isyarat statistik: isyarat rawak, anggaran, penapis Kalman dan Wiener, dengan MATLAB dan papan DSP."
  id: "Pengolahan sinyal statistik: sinyal acak, estimasi, filter Kalman dan Wiener, dengan MATLAB dan papan DSP."
  hi: "सांख्यिकीय सिग्नल प्रोसेसिंग: यादृच्छिक सिग्नल, आकलन, कालमैन और वीनर फ़िल्टर, MATLAB और DSP बोर्ड के साथ।"
outcomes:
  - en: "Apply stochastic tools to signal processing systems"
    zh: "把随机方法用于信号处理系统"
    zh-TW: "把隨機方法用於訊號處理系統"
    ja: "確率的手法を信号処理システムに使う"
    ko: "확률적 기법을 신호처리 시스템에 적용하기"
    vi: "Áp dụng công cụ ngẫu nhiên cho hệ thống xử lý tín hiệu"
    ms: "Menggunakan alat stokastik dalam sistem pemprosesan isyarat"
    id: "Menerapkan alat stokastik pada sistem pengolahan sinyal"
    hi: "सिग्नल प्रोसेसिंग प्रणालियों में स्टोकेस्टिक साधनों का उपयोग"
  - en: "Design and implement estimation algorithms"
    zh: "设计并实现估计算法"
    zh-TW: "設計並實作估計演算法"
    ja: "推定アルゴリズムを設計・実装する"
    ko: "추정 알고리즘 설계·구현하기"
    vi: "Thiết kế và cài đặt thuật toán ước lượng"
    ms: "Mereka bentuk dan melaksanakan algoritma anggaran"
    id: "Merancang dan mengimplementasikan algoritma estimasi"
    hi: "आकलन एल्गोरिद्म डिज़ाइन और लागू करना"
  - en: "Run signal processing on DSP boards in the lab"
    zh: "在实验室用 DSP 开发板实现信号处理"
    zh-TW: "在實驗室用 DSP 開發板實作訊號處理"
    ja: "実験室でDSPボード上に信号処理を実装する"
    ko: "실험실에서 DSP 보드로 신호처리 구현하기"
    vi: "Chạy xử lý tín hiệu trên bo DSP trong phòng thí nghiệm"
    ms: "Menjalankan pemprosesan isyarat pada papan DSP di makmal"
    id: "Menjalankan pengolahan sinyal pada papan DSP di laboratorium"
    hi: "लैब में DSP बोर्ड पर सिग्नल प्रोसेसिंग चलाना"
