code: DRAM30034
year: 2026
learn:
  en: "Take your voice, movement and text skills into dramaturgy, directing and creative writing for new contexts."
  zh: "把声音、形体与文本技能用到戏剧构作、导演与创意写作中。"
  zh-TW: "把聲音、形體與文本技能用到戲劇構作、導演與創意寫作中。"
  ja: "声・身体・テキストの技能をドラマトゥルギー、演出、創作文に広げる。"
  ko: "목소리·움직임·텍스트 기량을 드라마투르기·연출·창작 글쓰기로 넓힌다."
  vi: "Đưa kỹ năng giọng, hình thể, văn bản vào biên kịch, đạo diễn và viết sáng tạo."
  ms: "Bawa kemahiran suara, gerak dan teks ke dramaturgi, pengarahan dan penulisan kreatif."
  id: "Membawa keterampilan suara, gerak dan teks ke dramaturgi, sutradara dan menulis kreatif."
  hi: "आवाज़, गति और टेक्स्ट कौशल को ड्रामाटर्जी, निर्देशन और रचनात्मक लेखन तक ले जाना।"
outcomes:
  - en: "Write a short piece of creative writing"
    zh: "写一篇短篇创意作品"
    zh-TW: "寫一篇短篇創意作品"
    ja: "短い創作文を書く"
    ko: "짧은 창작 글 쓰기"
    vi: "Viết một bài sáng tác ngắn"
    ms: "Tulis karya kreatif pendek"
    id: "Menulis karya kreatif pendek"
    hi: "छोटा रचनात्मक लेखन करना"
  - en: "Perform a composed performance task"
    zh: "完成一项编排好的表演任务"
    zh-TW: "完成一項編排好的表演任務"
    ja: "構成した作品を上演する"
    ko: "구성한 공연 과제 해내기"
    vi: "Diễn một bài đã dàn dựng"
    ms: "Persembah tugasan persembahan tersusun"
    id: "Membawakan tugas pertunjukan tersusun"
    hi: "रचित प्रदर्शन कार्य प्रस्तुत करना"
  - en: "Adapt your skills to new creative settings"
    zh: "把技能用到新的创作情境"
    zh-TW: "把技能用到新的創作情境"
    ja: "新しい創作の場に技能を応用する"
    ko: "새로운 창작 환경에 기량 적용하기"
    vi: "Áp dụng kỹ năng vào bối cảnh mới"
    ms: "Sesuaikan kemahiran pada konteks baharu"
    id: "Menyesuaikan keterampilan ke konteks baru"
    hi: "नए रचनात्मक संदर्भों में कौशल ढालना"
