code: CREA30001
year: 2026
learn:
  en: "An online subject on how First Nations artists and designers have used art, craft and design to resist colonisation."
  zh: "线上科目：原住民艺术家与设计师如何用艺术、工艺与设计抵抗殖民。"
  zh-TW: "線上科目：原住民藝術家與設計師如何用藝術、工藝與設計抵抗殖民。"
  ja: "オンライン科目。先住民のアーティストやデザイナーが芸術・工芸・デザインで植民地化に抗ってきた歴史。"
  ko: "온라인 과목. 원주민 예술가·디자이너가 예술·공예·디자인으로 식민화에 저항해 온 방식."
  vi: "Môn trực tuyến: nghệ sĩ, nhà thiết kế bản địa dùng nghệ thuật, thủ công để chống thực dân."
  ms: "Subjek dalam talian: cara artis dan pereka Orang Asal menentang penjajahan melalui seni dan reka bentuk."
  id: "Mata kuliah daring: cara seniman dan desainer Pribumi melawan kolonialisme lewat seni dan desain."
  hi: "ऑनलाइन विषय: आदिवासी कलाकारों और डिज़ाइनरों ने कला व डिज़ाइन से उपनिवेशवाद का विरोध कैसे किया।"
outcomes:
  - en: "Read design history through First Nations views"
    zh: "从原住民视角解读设计史"
    zh-TW: "從原住民視角解讀設計史"
    ja: "先住民の視点からデザイン史を読む"
    ko: "원주민 시각으로 디자인사 읽기"
    vi: "Đọc lịch sử thiết kế qua góc nhìn bản địa"
    ms: "Tafsir sejarah reka bentuk dari pandangan Orang Asal"
    id: "Membaca sejarah desain dari sudut Pribumi"
    hi: "आदिवासी नज़रिए से डिज़ाइन इतिहास पढ़ना"
  - en: "Work with Indigenous Knowledges in a safe way"
    zh: "以文化安全的方式运用原住民知识"
    zh-TW: "以文化安全的方式運用原住民知識"
    ja: "先住民の知を文化的に安全に扱う"
    ko: "원주민 지식을 문화적으로 안전하게 다루기"
    vi: "Dùng tri thức bản địa một cách an toàn"
    ms: "Guna Pengetahuan Orang Asal secara selamat"
    id: "Memakai Pengetahuan Pribumi dengan aman"
    hi: "आदिवासी ज्ञान का सुरक्षित तरीक़े से उपयोग"
  - en: "Create a strengths-based creative project"
    zh: "完成一个以优势为本的创作项目"
    zh-TW: "完成一個以優勢為本的創作專案"
    ja: "強みに基づく創作プロジェクトをつくる"
    ko: "강점 기반 창작 프로젝트 만들기"
    vi: "Làm dự án sáng tạo dựa trên thế mạnh"
    ms: "Hasilkan projek kreatif berasaskan kekuatan"
    id: "Membuat proyek kreatif berbasis kekuatan"
    hi: "ताक़त-आधारित रचनात्मक प्रोजेक्ट बनाना"
