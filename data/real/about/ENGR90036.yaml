code: ENGR90036
year: 2027
learn:
  en: "Leading innovation teams: motivation, team process and mentoring a real industry project."
  zh: "领导创新团队：激励、团队协作过程，并指导一个真实的行业项目。"
  zh-TW: "領導創新團隊：激勵、團隊運作，並指導一個真實的產業專案。"
  ja: "イノベーションチームを率いる：動機づけ、チーム運営、実際の企業プロジェクトの指導。"
  ko: "혁신 팀 이끌기: 동기 부여, 팀 운영, 실제 산업 프로젝트 멘토링."
  vi: "Lãnh đạo nhóm đổi mới: tạo động lực, vận hành nhóm, hướng dẫn một dự án doanh nghiệp thật."
  ms: "Memimpin pasukan inovasi: motivasi, proses pasukan dan membimbing projek industri sebenar."
  id: "Memimpin tim inovasi: motivasi, proses tim, dan membimbing proyek industri nyata."
  hi: "नवाचार टीमों का नेतृत्व: प्रेरणा, टीम प्रक्रिया और असली उद्योग प्रोजेक्ट की मेंटरिंग।"
outcomes:
  - en: "Mentor a student team through an innovation project"
    zh: "指导学生团队完成创新项目"
    zh-TW: "指導學生團隊完成創新專案"
    ja: "学生チームのイノベーション課題を指導する"
    ko: "학생 팀의 혁신 프로젝트 멘토링하기"
    vi: "Hướng dẫn một nhóm sinh viên làm dự án đổi mới"
    ms: "Membimbing pasukan pelajar dalam projek inovasi"
    id: "Membimbing tim mahasiswa dalam proyek inovasi"
    hi: "छात्र टीम को नवाचार प्रोजेक्ट में मार्गदर्शन देना"
  - en: "Manage the relationship with an outside project sponsor"
    zh: "处理与外部项目赞助方的关系"
    zh-TW: "處理與外部專案贊助方的關係"
    ja: "外部のプロジェクト出資者との関係を管理する"
    ko: "외부 프로젝트 후원사와의 관계 관리하기"
    vi: "Quản lý quan hệ với nhà tài trợ dự án bên ngoài"
    ms: "Mengurus hubungan dengan penaja projek luar"
    id: "Mengelola hubungan dengan sponsor proyek dari luar"
    hi: "बाहरी प्रोजेक्ट प्रायोजक के साथ संबंध संभालना"
