code: IBUS30002
year: 2027
learn:
  en: "Corporate governance in global business: theories, ethics, boards, leadership, executive pay and investors."
  zh: "全球商业中的公司治理：理论、伦理、董事会、领导力、高管薪酬和投资者。"
  zh-TW: "全球商業中的公司治理：理論、倫理、董事會、領導力、高階主管薪酬和投資人。"
  ja: "国際ビジネスのコーポレートガバナンス：理論、倫理、取締役会、リーダーシップ、役員報酬、投資家。"
  ko: "글로벌 비즈니스의 기업 지배구조: 이론, 윤리, 이사회, 리더십, 경영진 보수, 투자자."
  vi: "Quản trị doanh nghiệp trong kinh doanh toàn cầu: lý thuyết, đạo đức, hội đồng quản trị, lãnh đạo, lương thưởng điều hành và nhà đầu tư."
  ms: "Tadbir urus korporat dalam perniagaan global: teori, etika, lembaga pengarah, kepimpinan, ganjaran eksekutif dan pelabur."
  id: "Tata kelola perusahaan dalam bisnis global: teori, etika, dewan direksi, kepemimpinan, kompensasi eksekutif, dan investor."
  hi: "वैश्विक व्यापार में कॉर्पोरेट गवर्नेंस: सिद्धांत, नैतिकता, बोर्ड, नेतृत्व, अधिकारियों का वेतन और निवेशक।"
outcomes:
  - en: "Explain current corporate governance theories"
    zh: "解释当前的公司治理理论"
    zh-TW: "解釋當前的公司治理理論"
    ja: "現在のコーポレートガバナンス理論を説明する"
    ko: "현재의 기업 지배구조 이론 설명하기"
    vi: "Giải thích các lý thuyết quản trị doanh nghiệp hiện nay"
    ms: "Terangkan teori tadbir urus korporat semasa"
    id: "Menjelaskan teori tata kelola perusahaan terkini"
    hi: "मौजूदा कॉर्पोरेट गवर्नेंस सिद्धांत समझाना"
  - en: "Link ethics to how global firms are governed"
    zh: "把伦理与跨国企业治理联系起来"
    zh-TW: "把倫理與跨國企業治理聯繫起來"
    ja: "倫理と国際企業の統治を結びつける"
    ko: "윤리와 글로벌 기업 지배의 관계 파악하기"
    vi: "Liên hệ đạo đức với cách quản trị công ty toàn cầu"
    ms: "Kaitkan etika dengan tadbir urus syarikat global"
    id: "Mengaitkan etika dengan tata kelola perusahaan global"
    hi: "नैतिकता को वैश्विक कंपनियों के शासन से जोड़ना"
  - en: "Identify key elements of good governance"
    zh: "识别良好治理的关键要素"
    zh-TW: "辨識良好治理的關鍵要素"
    ja: "良いガバナンスの要素を見極める"
    ko: "좋은 지배구조의 핵심 요소 파악하기"
    vi: "Nhận diện yếu tố chính của quản trị tốt"
    ms: "Kenal pasti elemen utama tadbir urus yang baik"
    id: "Mengenali unsur utama tata kelola yang baik"
    hi: "अच्छे गवर्नेंस के मुख्य तत्व पहचानना"
