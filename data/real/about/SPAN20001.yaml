code: SPAN20001
year: 2026
learn:
  en: "Sharpen your Spanish while studying films, books, art and propaganda from Spain and Latin America, with first research skills."
  zh: "在研读西班牙和拉丁美洲的电影、书籍、艺术和宣传品的同时提升西班牙语，并学习基础研究方法。"
  zh-TW: "在研讀西班牙和拉丁美洲的電影、書籍、藝術和宣傳品的同時提升西班牙語，並學習基礎研究方法。"
  ja: "スペインと中南米の映画、本、美術、プロパガンダを読み解きながらスペイン語を磨き、研究の基礎も学ぶ。"
  ko: "스페인과 라틴아메리카의 영화, 책, 미술, 선전물을 공부하며 스페인어를 다듬고 기초 연구 방법도 배운다."
  vi: "Trau dồi tiếng Tây Ban Nha khi học phim, sách, nghệ thuật, tuyên truyền của Tây Ban Nha và Mỹ Latinh, kèm kỹ năng nghiên cứu."
  ms: "Asah bahasa Sepanyol sambil mengkaji filem, buku, seni dan propaganda dari Sepanyol dan Amerika Latin, serta kemahiran penyelidikan asas."
  id: "Asah bahasa Spanyol sambil mempelajari film, buku, seni dan propaganda dari Spanyol dan Amerika Latin, plus dasar-dasar riset."
  hi: "स्पेन और लातिन अमेरिका की फ़िल्मों, किताबों, कला और प्रचार सामग्री को पढ़ते हुए स्पेनिश निखारना, साथ में शोध की शुरुआत।"
outcomes:
  - en: "Use Spanish to discuss cultural texts"
    zh: "用西班牙语讨论文化文本"
    zh-TW: "用西班牙語討論文化文本"
    ja: "スペイン語で文化テクストを議論する"
    ko: "스페인어로 문화 텍스트 토론하기"
    vi: "Dùng tiếng Tây Ban Nha thảo luận văn bản văn hóa"
    ms: "Guna bahasa Sepanyol untuk membincangkan teks budaya"
    id: "Memakai bahasa Spanyol untuk membahas teks budaya"
    hi: "स्पेनिश में सांस्कृतिक पाठों पर चर्चा करना"
  - en: "Analyse films, art and writing from the Hispanic world"
    zh: "分析西语世界的电影、艺术和文学"
    zh-TW: "分析西語世界的電影、藝術和文學"
    ja: "スペイン語圏の映画、美術、文学を分析する"
    ko: "스페인어권의 영화, 미술, 글 분석하기"
    vi: "Phân tích phim, nghệ thuật, văn chương thế giới nói tiếng Tây Ban Nha"
    ms: "Analisis filem, seni dan tulisan dunia Hispanik"
    id: "Menganalisis film, seni dan tulisan dunia Hispanik"
    hi: "हिस्पैनिक दुनिया की फ़िल्मों, कला और लेखन का विश्लेषण करना"
  - en: "Learn basic archive and translation research"
    zh: "学习基础的档案与翻译研究方法"
    zh-TW: "學習基礎的檔案與翻譯研究方法"
    ja: "記録資料と翻訳を使った研究の基礎を学ぶ"
    ko: "기록물·번역 연구의 기초 배우기"
    vi: "Học cách nghiên cứu cơ bản với lưu trữ và dịch thuật"
    ms: "Belajar asas penyelidikan arkib dan terjemahan"
    id: "Mempelajari dasar riset arsip dan terjemahan"
    hi: "अभिलेख और अनुवाद आधारित शोध की बुनियाद सीखना"
