code: JAPN20005
year: 2026
learn:
  en: "Key themes in Japanese society today, such as the individual and the group, status, gender and age, taught in English."
  zh: "当代日本社会的核心主题，如个人与集体、地位、性别与年龄，英语授课。"
  zh-TW: "當代日本社會的核心主題，如個人與集體、地位、性別與年齡，英語授課。"
  ja: "個人と集団、地位、ジェンダーと年齢など、今の日本社会の主なテーマを英語で学ぶ。"
  ko: "개인과 집단, 지위, 젠더와 나이 등 오늘날 일본 사회의 핵심 주제를 영어로 배운다."
  vi: "Các chủ đề chính của xã hội Nhật Bản ngày nay như cá nhân và tập thể, địa vị, giới và tuổi tác, dạy bằng tiếng Anh."
  ms: "Tema utama masyarakat Jepun kini seperti individu dan kumpulan, status, gender dan umur, diajar dalam bahasa Inggeris."
  id: "Tema utama masyarakat Jepang kini seperti individu dan kelompok, status, gender, dan usia, diajarkan dalam bahasa Inggris."
  hi: "आज के जापानी समाज के मुख्य विषय, जैसे व्यक्ति और समूह, हैसियत, जेंडर और उम्र, अंग्रेज़ी में।"
outcomes:
  - en: "Explain key models used to study Japan"
    zh: "解释研究日本的主要理论模型"
    zh-TW: "解釋研究日本的主要理論模型"
    ja: "日本研究で使う主なモデルを説明する"
    ko: "일본 연구의 주요 모델 설명하기"
    vi: "Giải thích các mô hình chính để nghiên cứu Nhật Bản"
    ms: "Terangkan model utama untuk mengkaji Jepun"
    id: "Menjelaskan model utama untuk mengkaji Jepang"
    hi: "जापान के अध्ययन के मुख्य मॉडल समझाना"
  - en: "Analyse current events in Japanese society"
    zh: "分析日本社会的时事"
    zh-TW: "分析日本社會的時事"
    ja: "日本社会の時事を分析する"
    ko: "일본 사회의 시사 분석하기"
    vi: "Phân tích các sự kiện hiện nay trong xã hội Nhật"
    ms: "Analisis peristiwa semasa dalam masyarakat Jepun"
    id: "Menganalisis peristiwa terkini di masyarakat Jepang"
    hi: "जापानी समाज की मौजूदा घटनाओं का विश्लेषण करना"
  - en: "Compare Japan with your own society"
    zh: "把日本与自己的社会作比较"
    zh-TW: "把日本與自己的社會作比較"
    ja: "日本と自分の社会を比べる"
    ko: "일본과 자신의 사회 비교하기"
    vi: "So sánh Nhật Bản với xã hội của bạn"
    ms: "Bandingkan Jepun dengan masyarakat anda"
    id: "Membandingkan Jepang dengan masyarakat sendiri"
    hi: "जापान की अपने समाज से तुलना करना"
