code: MAST20030
year: 2026
learn:
  en: "Solving linear differential equations, the models used across science and engineering."
  zh: "解线性微分方程，这类方程是理工科常用的模型。"
  zh-TW: "解線性微分方程，這類方程是理工科常用的模型。"
  ja: "線形微分方程式を解く。理工系で広く使われるモデル。"
  ko: "선형 미분방정식 풀기. 과학과 공학 전반에서 쓰이는 모델."
  vi: "Giải phương trình vi phân tuyến tính, mô hình dùng khắp khoa học và kỹ thuật."
  ms: "Menyelesaikan persamaan pembezaan linear, model yang digunakan dalam sains dan kejuruteraan."
  id: "Menyelesaikan persamaan diferensial linear, model yang dipakai di sains dan teknik."
  hi: "रैखिक अवकल समीकरण हल करना, जो विज्ञान और इंजीनियरिंग में आम मॉडल हैं।"
outcomes:
  - en: "Solve differential equations with series methods"
    zh: "用级数方法解微分方程"
    zh-TW: "用級數方法解微分方程"
    ja: "級数法で微分方程式を解く"
    ko: "급수법으로 미분방정식 풀기"
    vi: "Giải phương trình vi phân bằng chuỗi"
    ms: "Menyelesaikan persamaan pembezaan dengan kaedah siri"
    id: "Menyelesaikan persamaan diferensial dengan metode deret"
    hi: "श्रेणी विधि से अवकल समीकरण हल करना"
  - en: "Use Laplace and Fourier transforms to find solutions"
    zh: "用拉普拉斯和傅里叶变换求解"
    zh-TW: "用拉普拉斯和傅立葉轉換求解"
    ja: "ラプラス変換とフーリエ変換で解を求める"
    ko: "라플라스·푸리에 변환으로 해 구하기"
    vi: "Dùng biến đổi Laplace và Fourier để tìm nghiệm"
    ms: "Menggunakan jelmaan Laplace dan Fourier untuk mencari penyelesaian"
    id: "Memakai transformasi Laplace dan Fourier untuk mencari solusi"
    hi: "लाप्लास और फ़ूरिये ट्रांसफ़ॉर्म से हल निकालना"
  - en: "Solve partial differential equations from applications"
    zh: "解应用中出现的偏微分方程"
    zh-TW: "解應用中出現的偏微分方程"
    ja: "応用で出てくる偏微分方程式を解く"
    ko: "응용에서 나오는 편미분방정식 풀기"
    vi: "Giải phương trình đạo hàm riêng trong ứng dụng"
    ms: "Menyelesaikan persamaan pembezaan separa daripada aplikasi"
    id: "Menyelesaikan persamaan diferensial parsial dari aplikasi"
    hi: "व्यावहारिक आंशिक अवकल समीकरण हल करना"
