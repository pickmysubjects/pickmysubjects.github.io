code: ELEN90091
year: 2027
learn:
  en: "The physics of semiconductors and how diodes, LEDs and transistors work."
  zh: "半导体物理，以及二极管、LED 和晶体管的工作原理。"
  zh-TW: "半導體物理，以及二極體、LED 與電晶體的工作原理。"
  ja: "半導体の物理と、ダイオード・LED・トランジスタの動作原理。"
  ko: "반도체 물리와 다이오드, LED, 트랜지스터의 작동 원리."
  vi: "Vật lý bán dẫn và cách diode, LED, transistor hoạt động."
  ms: "Fizik semikonduktor dan cara diod, LED dan transistor berfungsi."
  id: "Fisika semikonduktor dan cara kerja dioda, LED, dan transistor."
  hi: "सेमीकंडक्टर का भौतिकी और डायोड, LED व ट्रांज़िस्टर कैसे काम करते हैं।"
outcomes:
  - en: "Explain energy bands, charge carriers and the Fermi level"
    zh: "解释能带、载流子和费米能级"
    zh-TW: "解釋能帶、載子與費米能階"
    ja: "エネルギーバンド・キャリア・フェルミ準位を説明する"
    ko: "에너지 밴드, 전하 운반자, 페르미 준위 설명하기"
    vi: "Giải thích vùng năng lượng, hạt tải điện và mức Fermi"
    ms: "Menerangkan jalur tenaga, pembawa cas dan aras Fermi"
    id: "Menjelaskan pita energi, pembawa muatan, dan tingkat Fermi"
    hi: "ऊर्जा बैंड, चार्ज कैरियर और फ़र्मी स्तर समझाना"
  - en: "Analyse pn junctions, diodes and transistors"
    zh: "分析 pn 结、二极管和晶体管"
    zh-TW: "分析 pn 接面、二極體與電晶體"
    ja: "pn 接合・ダイオード・トランジスタを解析する"
    ko: "pn 접합, 다이오드, 트랜지스터 분석하기"
    vi: "Phân tích tiếp giáp pn, diode và transistor"
    ms: "Menganalisis simpang pn, diod dan transistor"
    id: "Menganalisis sambungan pn, dioda, dan transistor"
    hi: "pn जंक्शन, डायोड और ट्रांज़िस्टर का विश्लेषण"
  - en: "Model and simulate semiconductor devices"
    zh: "为半导体器件建模和仿真"
    zh-TW: "為半導體元件建模與模擬"
    ja: "半導体デバイスをモデル化・シミュレーションする"
    ko: "반도체 소자 모델링 및 시뮬레이션하기"
    vi: "Mô hình hóa và mô phỏng linh kiện bán dẫn"
    ms: "Memodelkan dan mensimulasi peranti semikonduktor"
    id: "Memodelkan dan menyimulasikan perangkat semikonduktor"
    hi: "सेमीकंडक्टर डिवाइस का मॉडल और सिमुलेशन"
