code: ABPL30053
year: 2026
learn:
  en: "Follows ideas in architecture and design from the 1700s to the 1900s, read against their social and cultural settings."
  zh: "梳理18至20世纪建筑与设计思想，并放回当时的社会与文化背景中理解。"
  zh-TW: "梳理18至20世紀建築與設計思想，並放回當時的社會與文化脈絡中理解。"
  ja: "18〜20世紀の建築・デザイン思想を、当時の社会や文化の背景とあわせてたどる。"
  ko: "18~20세기 건축·디자인 사상을 당시 사회·문화적 맥락 속에서 살펴본다."
  vi: "Theo dõi các tư tưởng kiến trúc và thiết kế từ thế kỷ 18 đến 20 trong bối cảnh xã hội, văn hóa."
  ms: "Menjejak idea seni bina dan reka bentuk abad ke-18 hingga ke-20 dalam konteks sosial dan budaya."
  id: "Menelusuri gagasan arsitektur dan desain abad ke-18 hingga ke-20 dalam konteks sosial dan budaya."
  hi: "18वीं से 20वीं सदी तक आर्किटेक्चर और डिज़ाइन के विचारों को उनके सामाजिक-सांस्कृतिक संदर्भ में समझना।"
outcomes:
  - en: "Trace key ideas from neo-classicism to modernism"
    zh: "梳理从新古典主义到现代主义的关键思想"
    zh-TW: "梳理從新古典主義到現代主義的關鍵思想"
    ja: "新古典主義からモダニズムまでの主要な思想をたどる"
    ko: "신고전주의에서 모더니즘까지 핵심 사상 따라가기"
    vi: "Theo dõi tư tưởng chính từ tân cổ điển đến hiện đại"
    ms: "Jejak idea utama dari neoklasik ke modenisme"
    id: "Menelusuri gagasan utama dari neoklasik ke modernisme"
    hi: "नवशास्त्रीयता से आधुनिकतावाद तक मुख्य विचार समझना"
  - en: "Read historical buildings against their social context"
    zh: "结合社会背景解读历史建筑"
    zh-TW: "結合社會背景解讀歷史建築"
    ja: "歴史的建築を社会的背景と結びつけて読む"
    ko: "역사적 건축을 사회적 맥락과 함께 읽기"
    vi: "Đọc công trình lịch sử trong bối cảnh xã hội"
    ms: "Tafsir bangunan bersejarah dalam konteks sosial"
    id: "Membaca bangunan bersejarah dalam konteks sosial"
    hi: "ऐतिहासिक इमारतों को सामाजिक संदर्भ में पढ़ना"
  - en: "Write and draw clear analyses of past precedents"
    zh: "用文字和图示清楚分析历史先例"
    zh-TW: "用文字和圖示清楚分析歷史先例"
    ja: "過去の事例を文章と図で分析する"
    ko: "과거 사례를 글과 그림으로 분석하기"
    vi: "Phân tích tiền lệ bằng bài viết và hình vẽ"
    ms: "Analisis preseden lampau melalui tulisan dan lukisan"
    id: "Menganalisis preseden lewat tulisan dan gambar"
    hi: "पुराने उदाहरणों का लेखन व चित्र से विश्लेषण करना"
