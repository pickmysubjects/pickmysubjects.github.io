code: MAST30032
year: 2026
learn:
  en: "Maths and computer models of biology, like disease spread and ecology, tested against data."
  zh: "用数学和电脑模型研究生物问题，比如疾病传播和生态，再用数据检验。"
  zh-TW: "用數學和電腦模型研究生物問題，比如疾病傳播和生態，再用資料檢驗。"
  ja: "感染症の広がりや生態など生物学の数理・計算モデルを、データで検証する。"
  ko: "질병 확산, 생태 같은 생물학의 수학·컴퓨터 모델을 데이터로 검증."
  vi: "Mô hình toán và máy tính cho sinh học như lây lan bệnh, sinh thái, kiểm chứng bằng dữ liệu."
  ms: "Model matematik dan komputer bagi biologi, seperti penyebaran penyakit dan ekologi, diuji dengan data."
  id: "Model matematika dan komputer untuk biologi, seperti penyebaran penyakit dan ekologi, diuji dengan data."
  hi: "बीमारी के फैलाव और पारिस्थितिकी जैसे जीवविज्ञान के गणितीय व कंप्यूटर मॉडल, डेटा से जाँचे गए।"
outcomes:
  - en: "Write programs that solve simple biological models"
    zh: "编程求解简单的生物模型"
    zh-TW: "寫程式求解簡單的生物模型"
    ja: "簡単な生物モデルを解くプログラムを書く"
    ko: "간단한 생물학 모델을 푸는 프로그램 작성하기"
    vi: "Viết chương trình giải mô hình sinh học đơn giản"
    ms: "Menulis program untuk menyelesaikan model biologi mudah"
    id: "Menulis program untuk menyelesaikan model biologi sederhana"
    hi: "सरल जैविक मॉडल हल करने वाले प्रोग्राम लिखना"
  - en: "Choose between modelling approaches for a problem"
    zh: "为问题选合适的建模方法"
    zh-TW: "為問題選合適的建模方法"
    ja: "問題に合ったモデル化の手法を選ぶ"
    ko: "문제에 맞는 모델링 방식 고르기"
    vi: "Chọn cách mô hình hóa phù hợp cho bài toán"
    ms: "Memilih pendekatan pemodelan untuk sesuatu masalah"
    id: "Memilih pendekatan pemodelan untuk suatu masalah"
    hi: "किसी समस्या के लिए सही मॉडलिंग तरीका चुनना"
  - en: "Test biological hypotheses with simulation"
    zh: "用统计模拟检验生物学假设"
    zh-TW: "用模擬檢驗生物學假設"
    ja: "シミュレーションで生物学の仮説を検証する"
    ko: "시뮬레이션으로 생물학 가설 검증하기"
    vi: "Kiểm định giả thuyết sinh học bằng mô phỏng"
    ms: "Menguji hipotesis biologi dengan simulasi"
    id: "Menguji hipotesis biologi dengan simulasi"
    hi: "सिमुलेशन से जैविक परिकल्पनाओं की जाँच"
