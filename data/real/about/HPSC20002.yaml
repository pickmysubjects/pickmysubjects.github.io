code: HPSC20002
year: 2026
learn:
  en: "How Western ideas of nature changed over 500 years and shaped science, from taxonomy and gardens to environmentalism."
  zh: "五百年来西方的自然观如何变化并影响科学，从分类学、园艺到环保主义。"
  zh-TW: "五百年來西方的自然觀如何變化並影響科學，從分類學、園藝到環保主義。"
  ja: "分類学や庭園から環境保護主義まで、500年間で西洋の自然観がどう変わり科学を形づくったかを学ぶ。"
  ko: "분류학과 정원에서 환경주의까지, 500년 동안 서구의 자연관이 어떻게 변하며 과학을 만들었는지 배운다."
  vi: "Quan niệm phương Tây về tự nhiên thay đổi ra sao trong 500 năm và định hình khoa học, từ phân loại học đến chủ nghĩa môi trường."
  ms: "Cara idea Barat tentang alam berubah selama 500 tahun dan membentuk sains, daripada taksonomi hingga environmentalisme."
  id: "Cara gagasan Barat tentang alam berubah selama 500 tahun dan membentuk sains, dari taksonomi hingga environmentalisme."
  hi: "500 सालों में प्रकृति के बारे में पश्चिमी विचार कैसे बदले और विज्ञान को आकार दिया, वर्गीकरण से पर्यावरणवाद तक।"
outcomes:
  - en: "Trace changes in Western ideas of nature"
    zh: "梳理西方自然观的变化"
    zh-TW: "梳理西方自然觀的變化"
    ja: "西洋の自然観の変化をたどる"
    ko: "서구 자연관의 변화 추적하기"
    vi: "Lần theo những thay đổi trong quan niệm phương Tây về tự nhiên"
    ms: "Jejaki perubahan idea Barat tentang alam"
    id: "Menelusuri perubahan gagasan Barat tentang alam"
    hi: "प्रकृति के बारे में पश्चिमी विचारों में बदलाव को समझना"
  - en: "Discuss key ideas in science and philosophy"
    zh: "讨论科学和哲学中的核心概念"
    zh-TW: "討論科學和哲學中的核心概念"
    ja: "科学と哲学の主要な概念を論じる"
    ko: "과학과 철학의 핵심 개념 토론하기"
    vi: "Thảo luận các khái niệm chính trong khoa học và triết học"
    ms: "Bincangkan konsep utama dalam sains dan falsafah"
    id: "Membahas konsep utama dalam sains dan filsafat"
    hi: "विज्ञान और दर्शन के मुख्य विचारों पर चर्चा करना"
  - en: "Make an evidence-based historical argument"
    zh: "提出有证据支持的历史论点"
    zh-TW: "提出有證據支持的歷史論點"
    ja: "証拠に基づく歴史的な議論をする"
    ko: "근거에 기반한 역사적 논증 펴기"
    vi: "Đưa ra lập luận lịch sử dựa trên bằng chứng"
    ms: "Kemukakan hujah sejarah berasaskan bukti"
    id: "Menyusun argumen sejarah berbasis bukti"
    hi: "सबूतों पर आधारित ऐतिहासिक तर्क देना"
