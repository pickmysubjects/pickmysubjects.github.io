code: ECON20004
year: 2026
learn:
  en: "Using economics on environmental problems: pollution, valuing nature, and comparing taxes, bans and emissions trading."
  zh: "用经济学分析环境问题：污染、环境估值，比较税收、禁令和排放交易。"
  zh-TW: "用經濟學分析環境問題：污染、環境估值，比較稅收、禁令和排放交易。"
  ja: "経済学で環境問題を考える：汚染、自然の価値評価、税・禁止・排出量取引の比較。"
  ko: "경제학으로 환경 문제 보기: 오염, 자연의 가치 평가, 세금·금지·배출권 거래 비교."
  vi: "Dùng kinh tế học cho vấn đề môi trường: ô nhiễm, định giá thiên nhiên, so sánh thuế, lệnh cấm và mua bán phát thải."
  ms: "Guna ekonomi untuk isu alam sekitar: pencemaran, menilai alam, dan banding cukai, larangan serta dagangan pelepasan."
  id: "Ekonomi untuk masalah lingkungan: polusi, menilai alam, serta membandingkan pajak, larangan, dan perdagangan emisi."
  hi: "पर्यावरण की समस्याओं पर अर्थशास्त्र: प्रदूषण, प्रकृति का मूल्य, और टैक्स, प्रतिबंध व उत्सर्जन व्यापार की तुलना।"
outcomes:
  - en: "Explain externalities and public goods behind environmental problems"
    zh: "解释环境问题背后的外部性和公共物品"
    zh-TW: "說明環境問題背後的外部性和公共財"
    ja: "環境問題の背景にある外部性と公共財を説明する"
    ko: "환경 문제 뒤의 외부효과와 공공재 설명"
    vi: "Giải thích ngoại tác và hàng hóa công sau vấn đề môi trường"
    ms: "Terangkan eksternaliti dan barangan awam di sebalik isu alam"
    id: "Menjelaskan eksternalitas dan barang publik di balik masalah lingkungan"
    hi: "पर्यावरण समस्याओं के पीछे एक्सटर्नैलिटी और सार्वजनिक वस्तुएँ समझाना"
  - en: "Compare ways of putting a dollar value on the environment"
    zh: "比较为环境定价的不同方法"
    zh-TW: "比較為環境定價的不同方法"
    ja: "環境に金銭的価値をつける方法を比べる"
    ko: "환경에 금전적 가치를 매기는 방법 비교"
    vi: "So sánh cách quy đổi môi trường ra tiền"
    ms: "Banding cara meletakkan nilai wang pada alam sekitar"
    id: "Membandingkan cara memberi nilai uang pada lingkungan"
    hi: "पर्यावरण का पैसे में मूल्य लगाने के तरीक़ों की तुलना"
  - en: "Judge regulation against market-based incentives"
    zh: "评估管制手段与市场激励手段"
    zh-TW: "評估管制手段與市場誘因手段"
    ja: "規制と市場型インセンティブを比べて評価する"
    ko: "직접 규제와 시장 유인책 비교 평가"
    vi: "Đánh giá quy định so với công cụ khuyến khích thị trường"
    ms: "Nilai peraturan berbanding insentif berasaskan pasaran"
    id: "Menilai regulasi dibandingkan insentif berbasis pasar"
    hi: "नियंत्रण वाले नियम बनाम बाज़ार आधारित प्रोत्साहन का आकलन"
