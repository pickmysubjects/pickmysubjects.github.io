code: ABPL90443
year: 2027
learn:
  en: "Social procurement in construction: contract targets for hiring disadvantaged workers and local supply, and how to meet them."
  zh: "建筑业的社会采购：合同中雇用弱势群体和本地供应的指标，以及如何达成。"
  zh-TW: "營建業的社會採購：合約中僱用弱勢族群與在地供應的指標，以及如何達成。"
  ja: "建設の社会的調達：不利な立場の人の雇用や地元調達の契約目標と達成方法。"
  ko: "건설 사회적 조달: 취약계층 고용·지역 조달 계약 목표와 달성 방법."
  vi: "Mua sắm xã hội trong xây dựng: chỉ tiêu tuyển lao động yếu thế, cung ứng địa phương và cách đạt."
  ms: "Perolehan sosial dalam pembinaan: sasaran kontrak mengupah pekerja kurang bernasib baik dan bekalan tempatan."
  id: "Pengadaan sosial di konstruksi: target kontrak merekrut pekerja rentan dan pasokan lokal."
  hi: "निर्माण में सामाजिक खरीद: वंचित श्रमिकों और स्थानीय आपूर्ति के अनुबंध लक्ष्य और उन्हें पूरा करना।"
outcomes:
  - en: "Explain social procurement clauses in contracts"
    zh: "解释合同中的社会采购条款"
    zh-TW: "解釋合約中的社會採購條款"
    ja: "契約の社会的調達条項を説明する"
    ko: "계약의 사회적 조달 조항 설명하기"
    vi: "Giải thích điều khoản mua sắm xã hội"
    ms: "Menerangkan klausa perolehan sosial dalam kontrak"
    id: "Menjelaskan klausul pengadaan sosial"
    hi: "अनुबंध में सामाजिक खरीद धाराएँ समझाना"
  - en: "Propose ways to meet social procurement targets"
    zh: "提出达成社会采购指标的方案"
    zh-TW: "提出達成社會採購指標的方案"
    ja: "社会的調達の目標達成策を提案する"
    ko: "사회적 조달 목표 달성 방안 제안하기"
    vi: "Đề xuất cách đạt chỉ tiêu mua sắm xã hội"
    ms: "Mencadang cara mencapai sasaran perolehan sosial"
    id: "Mengusulkan cara mencapai target pengadaan sosial"
    hi: "सामाजिक खरीद लक्ष्य पूरे करने के उपाय सुझाना"
