code: FINA30024
year: 2026
learn:
  en: "Performance Design capstone: design for a play, music or dance piece and a brief, drawing on your earlier studios."
  zh: "表演设计方向毕业设计课：为戏剧、音乐或舞蹈作品及设计任务书做设计，综合以往工作室所学。"
  zh-TW: "表演設計方向畢業設計課：為戲劇、音樂或舞蹈作品及設計任務做設計，整合先前工作室所學。"
  ja: "パフォーマンスデザインの総仕上げ。戯曲・音楽・ダンスと課題をもとに、これまでのスタジオを生かして設計する。"
  ko: "퍼포먼스 디자인 캡스톤. 희곡·음악·무용 작품과 과제에 맞춰 이전 스튜디오 경험을 살려 디자인한다."
  vi: "Môn tốt nghiệp Thiết kế biểu diễn: thiết kế cho vở kịch, nhạc hoặc múa theo đề bài, dựa trên các studio trước."
  ms: "Kemuncak Reka Bentuk Persembahan: reka untuk drama, muzik atau tarian dan taklimat, berasaskan studio terdahulu."
  id: "Capstone Desain Pertunjukan: mendesain untuk naskah drama, musik, atau tari sesuai brief, berbekal studio sebelumnya."
  hi: "परफ़ॉर्मेंस डिज़ाइन कैपस्टोन: नाटक, संगीत या नृत्य और ब्रीफ़ के लिए डिज़ाइन, पिछले स्टूडियो के अनुभव से।"
outcomes:
  - en: "Develop a performance design from a text and brief"
    zh: "根据作品和任务书发展表演设计"
    zh-TW: "依作品與任務發展表演設計"
    ja: "作品と課題から舞台デザインを展開する"
    ko: "작품과 과제로부터 공연 디자인 발전시키기"
    vi: "Phát triển thiết kế biểu diễn từ tác phẩm và đề bài"
    ms: "Bangunkan reka bentuk persembahan dari teks dan taklimat"
    id: "Mengembangkan desain pertunjukan dari naskah dan brief"
    hi: "पाठ और ब्रीफ़ से परफ़ॉर्मेंस डिज़ाइन बनाना"
  - en: "Draw on history and theory behind a work"
    zh: "运用作品背后的历史和理论"
    zh-TW: "運用作品背後的歷史與理論"
    ja: "作品の歴史と理論を生かす"
    ko: "작품 배경의 역사와 이론 활용하기"
    vi: "Vận dụng lịch sử và lý thuyết của tác phẩm"
    ms: "Guna sejarah dan teori di sebalik karya"
    id: "Memanfaatkan sejarah dan teori di balik karya"
    hi: "रचना के पीछे के इतिहास और सिद्धांत का उपयोग"
  - en: "Combine skills from earlier design studios"
    zh: "综合运用以往设计工作室的技能"
    zh-TW: "整合先前設計工作室的技能"
    ja: "これまでのスタジオで得た技能を組み合わせる"
    ko: "이전 디자인 스튜디오의 기술 결합하기"
    vi: "Kết hợp kỹ năng từ các studio trước"
    ms: "Gabung kemahiran dari studio terdahulu"
    id: "Memadukan keterampilan dari studio sebelumnya"
    hi: "पिछले डिज़ाइन स्टूडियो के कौशल जोड़ना"
