code: MAST20034
year: 2026
learn:
  en: "Judging data-based claims: study design, causality, p-values, and reporting statistical evidence honestly."
  zh: "评判基于数据的说法：研究设计、因果、p值和如实报告"
  zh-TW: "評判以資料為據的說法：研究設計、因果、p值與如實報告"
  ja: "データに基づく主張を見極める：研究デザイン、因果、p値、誠実な報告。"
  ko: "데이터 기반 주장 판단하기: 연구설계, 인과, p값, 정직한 보고."
  vi: "Đánh giá tuyên bố dựa trên dữ liệu: thiết kế nghiên cứu, nhân quả, giá trị p, báo cáo trung thực."
  ms: "Menilai dakwaan berasaskan data: reka bentuk kajian, sebab-akibat, nilai p dan laporan yang jujur."
  id: "Menilai klaim berbasis data: desain studi, kausalitas, nilai p, dan pelaporan yang jujur."
  hi: "डेटा-आधारित दावों को परखना: अध्ययन डिज़ाइन, कारणता, p-मान और ईमानदार रिपोर्टिंग।"
outcomes:
  - en: "Critically assess claims based on data"
    zh: "批判性评估基于数据的说法"
    zh-TW: "批判性評估以資料為據的說法"
    ja: "データに基づく主張を批判的に評価する"
    ko: "데이터 기반 주장 비판적으로 평가하기"
    vi: "Đánh giá phản biện tuyên bố dựa trên dữ liệu"
    ms: "Menilai secara kritis dakwaan berasaskan data"
    id: "Menilai kritis klaim berbasis data"
    hi: "डेटा-आधारित दावों का आलोचनात्मक आकलन"
  - en: "Draw conclusions from CIs, p-values, meta-analysis"
    zh: "用置信区间、p值和元分析下结论"
    zh-TW: "用信賴區間、p值和統合分析下結論"
    ja: "信頼区間・p値・メタ分析から結論を出す"
    ko: "신뢰구간·p값·메타분석으로 결론 내리기"
    vi: "Kết luận từ KTC, giá trị p, phân tích gộp"
    ms: "Membuat kesimpulan daripada SK, nilai p, meta-analisis"
    id: "Menyimpulkan dari SK, nilai p, meta-analisis"
    hi: "CI, p-मान और मेटा-विश्लेषण से निष्कर्ष निकालना"
  - en: "Present quantitative findings clearly"
    zh: "清楚地展示定量结果"
    zh-TW: "清楚地呈現量化結果"
    ja: "定量的な結果をわかりやすく伝える"
    ko: "정량적 결과를 명확히 발표하기"
    vi: "Trình bày kết quả định lượng rõ ràng"
    ms: "Membentangkan dapatan kuantitatif dengan jelas"
    id: "Menyajikan temuan kuantitatif dengan jelas"
    hi: "मात्रात्मक निष्कर्ष स्पष्ट रूप से प्रस्तुत करना"
