code: KORE20006
year: 2026
learn:
  en: "Advanced Korean for history, society and specialist topics: Sino-Korean idioms, Hanja, technical terms and translation."
  zh: "高级韩语，涉及历史、社会和专业话题：汉字词成语、汉字、专业术语和翻译。"
  zh-TW: "高級韓語，涉及歷史、社會和專業話題：漢字詞成語、漢字、專業術語和翻譯。"
  ja: "歴史・社会・専門分野を扱う上級韓国語。漢字語の慣用句、漢字、専門用語、翻訳。"
  ko: "역사·사회·전문 주제를 다루는 고급 한국어. 한자 성어, 한자, 전문 용어, 번역."
  vi: "Tiếng Hàn nâng cao cho lịch sử, xã hội và chủ đề chuyên ngành: thành ngữ Hán-Hàn, Hanja, thuật ngữ và dịch thuật."
  ms: "Bahasa Korea lanjutan untuk sejarah, masyarakat dan topik khusus: simpulan Sino-Korea, Hanja, istilah teknikal dan terjemahan."
  id: "Bahasa Korea lanjut untuk sejarah, masyarakat dan topik khusus: idiom Sino-Korea, Hanja, istilah teknis dan penerjemahan."
  hi: "इतिहास, समाज और विशेष विषयों के लिए उन्नत कोरियाई: चीनी-मूल मुहावरे, हंजा, तकनीकी शब्द और अनुवाद।"
outcomes:
  - en: "Discuss social and cultural topics in Korean"
    zh: "用韩语讨论社会和文化话题"
    zh-TW: "用韓語討論社會和文化話題"
    ja: "社会や文化の話題を韓国語で話し合う"
    ko: "사회·문화 주제를 한국어로 토론하기"
    vi: "Thảo luận chủ đề xã hội, văn hóa bằng tiếng Hàn"
    ms: "Bincangkan topik sosial dan budaya dalam bahasa Korea"
    id: "Membahas topik sosial dan budaya dalam bahasa Korea"
    hi: "सामाजिक और सांस्कृतिक विषयों पर कोरियाई में चर्चा करना"
  - en: "Read and write longer Korean texts"
    zh: "读写较长的韩语文章"
    zh-TW: "讀寫較長的韓語文章"
    ja: "長めの韓国語の文章を読み書きする"
    ko: "긴 한국어 글 읽고 쓰기"
    vi: "Đọc và viết văn bản tiếng Hàn dài hơn"
    ms: "Baca dan tulis teks bahasa Korea yang lebih panjang"
    id: "Membaca dan menulis teks bahasa Korea yang lebih panjang"
    hi: "लंबे कोरियाई पाठ पढ़ना-लिखना"
  - en: "Give a clear presentation in Korean"
    zh: "用韩语做清楚的口头报告"
    zh-TW: "用韓語做清楚的口頭報告"
    ja: "韓国語で分かりやすく発表する"
    ko: "한국어로 명확하게 발표하기"
    vi: "Thuyết trình rõ ràng bằng tiếng Hàn"
    ms: "Buat pembentangan yang jelas dalam bahasa Korea"
    id: "Melakukan presentasi yang jelas dalam bahasa Korea"
    hi: "कोरियाई में स्पष्ट प्रस्तुति देना"
