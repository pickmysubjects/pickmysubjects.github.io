code: ARTS20005
year: 2027
learn:
  en: "How Buddhism grew from an Indian ascetic movement into a world religion, and what its ideas say about today's debates."
  zh: "佛教如何从古印度苦行运动发展为世界宗教，以及它的思想如何回应当代议题。"
  zh-TW: "佛教如何從古印度苦行運動發展為世界宗教，以及它的思想如何回應當代議題。"
  ja: "仏教がインドの修行運動から世界宗教へどう広がったか、その思想が現代の議論に何を語るか。"
  ko: "불교가 인도의 고행 운동에서 세계 종교로 어떻게 성장했는지, 그 사상이 오늘날 논쟁에 무엇을 말하는지."
  vi: "Phật giáo từ phong trào khổ hạnh ở Ấn Độ trở thành tôn giáo thế giới ra sao, và tư tưởng ấy nói gì về các tranh luận ngày nay."
  ms: "Bagaimana Buddhisme berkembang daripada gerakan zuhud India menjadi agama dunia, dan apa kata ideanya tentang isu semasa."
  id: "Bagaimana Buddhisme tumbuh dari gerakan pertapa India menjadi agama dunia, dan apa kata gagasannya tentang perdebatan masa kini."
  hi: "बौद्ध धर्म भारत के एक तपस्वी आंदोलन से विश्व धर्म कैसे बना, और उसके विचार आज की बहसों पर क्या कहते हैं।"
outcomes:
  - en: "Relate Buddhist texts to how Buddhism is lived"
    zh: "把佛教经典与实际信仰生活联系起来"
    zh-TW: "把佛教經典與實際信仰生活連結起來"
    ja: "仏典を実際の仏教の営みと結びつける"
    ko: "불교 경전을 실제 신앙생활과 연결하기"
    vi: "Liên hệ kinh điển Phật giáo với đời sống tu tập thực tế"
    ms: "Kaitkan teks Buddha dengan amalan sebenar"
    id: "Mengaitkan teks Buddhis dengan praktik nyata"
    hi: "बौद्ध ग्रंथों को जीवंत बौद्ध परंपरा से जोड़ना"
  - en: "Apply Buddhist ethics to current debates"
    zh: "用佛教伦理分析当下的争议"
    zh-TW: "用佛教倫理分析當下的爭議"
    ja: "仏教の倫理を現代の議論に当てはめる"
    ko: "불교 윤리를 오늘날 논쟁에 적용하기"
    vi: "Áp dụng đạo đức Phật giáo vào các tranh luận hiện nay"
    ms: "Guna etika Buddha dalam perdebatan semasa"
    id: "Menerapkan etika Buddhis pada perdebatan masa kini"
    hi: "बौद्ध नैतिकता को आज की बहसों पर लागू करना"
  - en: "Interpret Buddhist objects and artworks"
    zh: "解读佛教器物和艺术品"
    zh-TW: "解讀佛教器物和藝術品"
    ja: "仏教の法具や美術作品を読み解く"
    ko: "불교 의례 물품과 예술품 해석하기"
    vi: "Giải nghĩa pháp khí và tác phẩm nghệ thuật Phật giáo"
    ms: "Tafsir objek dan karya seni Buddha"
    id: "Menafsirkan benda dan karya seni Buddhis"
    hi: "बौद्ध वस्तुओं और कलाकृतियों की व्याख्या"
