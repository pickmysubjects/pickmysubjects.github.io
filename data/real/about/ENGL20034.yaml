code: ENGL20034
year: 2026
learn:
  en: "An open-to-all course on watching and understanding theatre, with local and international shows in many styles."
  zh: "面向所有学生的戏剧欣赏课，通过本地和国际的各类演出学习观看和理解戏剧。"
  zh-TW: "面向所有學生的戲劇欣賞課，透過本地和國際的各類演出學習觀看和理解戲劇。"
  ja: "誰でも受けられる演劇鑑賞の授業。国内外の様々な舞台を通して見方と理解を学ぶ。"
  ko: "누구나 들을 수 있는 연극 감상 수업. 국내외 다양한 공연으로 보는 법과 이해를 배운다."
  vi: "Môn học mở cho mọi người về cách xem và hiểu sân khấu, qua các vở diễn trong và ngoài nước nhiều phong cách."
  ms: "Kursus terbuka untuk semua tentang menonton dan memahami teater, melalui persembahan tempatan dan antarabangsa."
  id: "Kuliah terbuka untuk semua tentang menonton dan memahami teater, lewat pertunjukan lokal dan internasional."
  hi: "सबके लिए खुला कोर्स, जिसमें देशी-विदेशी कई शैलियों के नाटकों से रंगमंच देखना और समझना सीखते हैं।"
outcomes:
  - en: "Describe what makes theatre distinctive"
    zh: "说明戏剧的独特之处"
    zh-TW: "說明戲劇的獨特之處"
    ja: "演劇ならではの特徴を説明する"
    ko: "연극만의 특징 설명하기"
    vi: "Mô tả điều làm sân khấu khác biệt"
    ms: "Huraikan keistimewaan teater"
    id: "Menguraikan kekhasan teater"
    hi: "रंगमंच को खास क्या बनाता है, बताना"
  - en: "Analyse live performances you attend"
    zh: "分析自己观看的现场演出"
    zh-TW: "分析自己觀看的現場演出"
    ja: "自分が観た舞台を分析する"
    ko: "직접 본 공연 분석하기"
    vi: "Phân tích các buổi diễn trực tiếp bạn xem"
    ms: "Analisis persembahan langsung yang anda tonton"
    id: "Menganalisis pertunjukan langsung yang ditonton"
    hi: "देखे गए लाइव प्रदर्शनों का विश्लेषण करना"
  - en: "Write thoughtful theatre reviews"
    zh: "撰写有见地的剧评"
    zh-TW: "撰寫有見地的劇評"
    ja: "考えのある劇評を書く"
    ko: "생각이 담긴 연극 리뷰 쓰기"
    vi: "Viết bài phê bình sân khấu sâu sắc"
    ms: "Tulis ulasan teater yang bernas"
    id: "Menulis ulasan teater yang bernas"
    hi: "सोच-समझकर नाटक समीक्षाएं लिखना"
