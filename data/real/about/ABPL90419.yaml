code: ABPL90419
year: 2027
learn:
  en: "How architecture firms' physical and digital records can be found, digitised and managed as archives for research."
  zh: "如何查找、数字化并管理建筑事务所的实体与数字资料，作为研究档案。"
  zh-TW: "如何查找、數位化並管理建築事務所的實體與數位資料，作為研究檔案。"
  ja: "設計事務所の紙やデジタル資料を探し、デジタル化し、研究用アーカイブとして管理する。"
  ko: "건축사무소의 실물·디지털 자료를 찾아 디지털화하고 연구용 아카이브로 관리합니다."
  vi: "Tìm, số hóa và quản lý tư liệu giấy và số của công ty kiến trúc làm kho lưu trữ nghiên cứu."
  ms: "Mencari, mendigitalkan dan mengurus rekod fizikal dan digital firma seni bina sebagai arkib."
  id: "Menemukan, mendigitalkan, dan mengelola arsip fisik dan digital biro arsitek untuk riset."
  hi: "आर्किटेक्चर फ़र्मों के भौतिक व डिजिटल रिकॉर्ड खोजना, डिजिटाइज़ करना और शोध-संग्रह के रूप में संभालना।"
outcomes:
  - en: "Plan the management of an archive"
    zh: "制定档案管理计划"
    zh-TW: "制定檔案管理計畫"
    ja: "アーカイブ管理計画を立てる"
    ko: "아카이브 관리 계획 세우기"
    vi: "Lập kế hoạch quản lý lưu trữ"
    ms: "Merancang pengurusan arkib"
    id: "Menyusun rencana pengelolaan arsip"
    hi: "संग्रह प्रबंधन योजना बनाना"
  - en: "Explain how media shape architectural records"
    zh: "说明媒介如何影响建筑记录"
    zh-TW: "說明媒介如何影響建築記錄"
    ja: "媒体が建築記録に与える影響を説明する"
    ko: "매체가 건축 기록에 미치는 영향 설명하기"
    vi: "Giải thích phương tiện ảnh hưởng hồ sơ kiến trúc"
    ms: "Menerangkan kesan media pada rekod seni bina"
    id: "Menjelaskan pengaruh media pada arsip arsitektur"
    hi: "माध्यम वास्तु रिकॉर्ड को कैसे प्रभावित करते हैं"
