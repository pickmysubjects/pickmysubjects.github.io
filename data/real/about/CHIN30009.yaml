code: CHIN30009
year: 2026
learn:
  en: "For learners without a Chinese background after Chinese 5: Chinese society topics, opinion pieces, and a move to real texts."
  zh: "面向非华裔背景、学完中文 5 的学生：中国社会话题、观点文章，并过渡到真实中文材料。"
  zh-TW: "面向非華裔背景、學完中文 5 的學生：中國社會話題、觀點文章，並過渡到真實中文材料。"
  ja: "中国語5を終えた非中国語話者向け。中国社会の話題や意見文を扱い、本物の中国語文献へ移行する。"
  ko: "중국어 5를 마친 비중국어권 학습자 대상. 중국 사회 주제와 의견글을 다루며 실제 중국어 자료로 넘어간다."
  vi: "Cho người không có gốc Hoa đã xong Chinese 5: chủ đề xã hội Trung Quốc, bài nêu ý kiến, và chuyển sang văn bản thật."
  ms: "Untuk pelajar tanpa latar Cina selepas Chinese 5: topik masyarakat China, tulisan pendapat, dan peralihan ke teks sebenar."
  id: "Untuk pelajar tanpa latar Tionghoa setelah Chinese 5: topik masyarakat Tiongkok, tulisan opini, dan peralihan ke teks asli."
  hi: "चीनी पृष्ठभूमि के बिना, Chinese 5 के बाद: चीनी समाज के विषय, राय-लेख, और असली चीनी पाठों की ओर क़दम।"
outcomes:
  - en: "Discuss social and cultural topics in Chinese"
    zh: "用中文讨论社会和文化话题"
    zh-TW: "用中文討論社會和文化話題"
    ja: "社会や文化の話題を中国語で話し合う"
    ko: "사회·문화 주제를 중국어로 토론하기"
    vi: "Thảo luận chủ đề xã hội, văn hóa bằng tiếng Trung"
    ms: "Bincangkan topik sosial dan budaya dalam bahasa Cina"
    id: "Membahas topik sosial dan budaya dalam bahasa Mandarin"
    hi: "सामाजिक और सांस्कृतिक विषयों पर चीनी में चर्चा करना"
  - en: "Read and write longer Chinese texts"
    zh: "读写较长的中文文章"
    zh-TW: "讀寫較長的中文文章"
    ja: "長めの中国語の文章を読み書きする"
    ko: "긴 중국어 글 읽고 쓰기"
    vi: "Đọc và viết văn bản tiếng Trung dài hơn"
    ms: "Baca dan tulis teks bahasa Cina yang lebih panjang"
    id: "Membaca dan menulis teks bahasa Mandarin yang lebih panjang"
    hi: "लंबे चीनी पाठ पढ़ना-लिखना"
  - en: "Give a clear presentation in Chinese"
    zh: "用中文做清楚的口头报告"
    zh-TW: "用中文做清楚的口頭報告"
    ja: "中国語で分かりやすく発表する"
    ko: "중국어로 명확하게 발표하기"
    vi: "Thuyết trình rõ ràng bằng tiếng Trung"
    ms: "Buat pembentangan yang jelas dalam bahasa Cina"
    id: "Melakukan presentasi yang jelas dalam bahasa Mandarin"
    hi: "चीनी में स्पष्ट प्रस्तुति देना"
