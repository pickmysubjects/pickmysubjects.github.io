code: FINA20026
year: 2026
learn:
  en: "Hands-on contemporary painting: try a range of techniques and materials, and keep a visual diary of your progress."
  zh: "动手学当代绘画：尝试多种技法与材料，用视觉日记记录进步。"
  zh-TW: "動手學當代繪畫：嘗試多種技法與材料，用視覺日記記錄進步。"
  ja: "実践で学ぶ現代絵画：さまざまな技法と画材を試し、ビジュアル日記で上達を記録する。"
  ko: "직접 해보는 현대 회화: 여러 기법과 재료를 시도하고 시각 일지로 발전 과정을 기록."
  vi: "Thực hành hội họa đương đại: thử nhiều kỹ thuật, chất liệu và ghi nhật ký hình ảnh về tiến bộ."
  ms: "Lukisan kontemporari secara amali: cuba pelbagai teknik dan bahan, dan simpan diari visual kemajuan anda."
  id: "Praktik lukis kontemporer: mencoba beragam teknik dan bahan, serta mencatat kemajuan di buku visual."
  hi: "समकालीन पेंटिंग का अभ्यास: कई तकनीकें और सामग्री आज़माना, और विज़ुअल डायरी में प्रगति दर्ज करना।"
outcomes:
  - en: "Use several painting techniques with control"
    zh: "熟练运用多种绘画技法"
    zh-TW: "熟練運用多種繪畫技法"
    ja: "複数の描画技法を使いこなす"
    ko: "여러 회화 기법을 능숙하게 쓰기"
    vi: "Dùng thành thạo nhiều kỹ thuật vẽ"
    ms: "Guna beberapa teknik melukis dengan kawalan"
    id: "Menguasai beberapa teknik melukis"
    hi: "कई पेंटिंग तकनीकें नियंत्रण से इस्तेमाल करना"
  - en: "Develop ideas through experiments"
    zh: "通过实验发展创作想法"
    zh-TW: "透過實驗發展創作想法"
    ja: "実験を通して発想を深める"
    ko: "실험을 통해 아이디어 발전시키기"
    vi: "Phát triển ý tưởng qua thử nghiệm"
    ms: "Kembangkan idea melalui eksperimen"
    id: "Mengembangkan ide lewat eksperimen"
    hi: "प्रयोगों से विचार विकसित करना"
  - en: "Document progress in a visual diary"
    zh: "用视觉日记记录进展"
    zh-TW: "用視覺日記記錄進展"
    ja: "ビジュアル日記で過程を記録する"
    ko: "시각 일지에 과정 기록하기"
    vi: "Ghi lại tiến trình trong nhật ký hình ảnh"
    ms: "Rekod kemajuan dalam diari visual"
    id: "Mencatat kemajuan di buku visual"
    hi: "विज़ुअल डायरी में प्रगति दर्ज करना"
