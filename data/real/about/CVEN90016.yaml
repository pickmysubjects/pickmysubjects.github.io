code: CVEN90016
year: 2027
learn:
  en: "Designing prestressed concrete and engineered timber buildings to the Standards, with a focus on lower carbon."
  zh: "按照标准设计预应力混凝土和工程木结构建筑，并注重低碳。"
  zh-TW: "依照標準設計預力混凝土與工程木結構建築，並注重低碳。"
  ja: "規格に沿ってプレストレストコンクリートと集成材の建物を設計し、低炭素を重視する。"
  ko: "기준에 따라 프리스트레스트 콘크리트와 공학 목재 건물을 설계하고 저탄소에 초점을 둔다."
  vi: "Thiết kế công trình bê tông dự ứng lực và gỗ kỹ thuật theo tiêu chuẩn, chú trọng giảm carbon."
  ms: "Mereka bentuk bangunan konkrit prategasan dan kayu kejuruteraan mengikut Piawaian, dengan fokus karbon rendah."
  id: "Merancang bangunan beton prategang dan kayu rekayasa sesuai Standar, dengan fokus rendah karbon."
  hi: "मानकों के अनुसार प्रीस्ट्रेस्ड कंक्रीट और इंजीनियर्ड लकड़ी की इमारतें डिज़ाइन करना, कम कार्बन पर ध्यान के साथ।"
outcomes:
  - en: "Analyse and design partially prestressed concrete beams"
    zh: "分析和设计部分预应力混凝土梁"
    zh-TW: "分析與設計部分預力混凝土梁"
    ja: "部分プレストレストコンクリート梁を解析・設計する"
    ko: "부분 프리스트레스트 콘크리트 보 해석·설계하기"
    vi: "Phân tích và thiết kế dầm bê tông dự ứng lực một phần"
    ms: "Menganalisis dan mereka bentuk rasuk konkrit prategasan separa"
    id: "Menganalisis dan merancang balok beton prategang parsial"
    hi: "आंशिक प्रीस्ट्रेस्ड कंक्रीट बीम का विश्लेषण और डिज़ाइन"
  - en: "Design multi-storey timber buildings"
    zh: "设计多层木结构建筑"
    zh-TW: "設計多層木結構建築"
    ja: "中高層の木造建物を設計する"
    ko: "다층 목조 건물 설계하기"
    vi: "Thiết kế nhà gỗ nhiều tầng"
    ms: "Mereka bentuk bangunan kayu bertingkat"
    id: "Merancang bangunan kayu bertingkat"
    hi: "बहुमंज़िला लकड़ी की इमारतें डिज़ाइन करना"
  - en: "Assess a structural design for sustainability and durability"
    zh: "从可持续性和耐久性角度评估结构设计"
    zh-TW: "從永續性與耐久性角度評估結構設計"
    ja: "構造設計を持続可能性と耐久性の観点から評価する"
    ko: "구조 설계를 지속가능성과 내구성 측면에서 평가하기"
    vi: "Đánh giá thiết kế kết cấu về bền vững và độ bền"
    ms: "Menilai reka bentuk struktur dari segi kelestarian dan ketahanan"
    id: "Menilai desain struktur dari sisi keberlanjutan dan durabilitas"
    hi: "संरचनात्मक डिज़ाइन का स्थिरता और टिकाऊपन के लिए आकलन"
