code: INDG10001
year: 2026
learn:
  en: "An introduction to Aboriginal and Torres Strait Islander peoples, their cultures and history, and the effects of colonisation."
  zh: "认识澳大利亚原住民和托雷斯海峡岛民：他们的文化、历史，以及殖民带来的影响。"
  zh-TW: "認識澳洲原住民和托雷斯海峽島民：他們的文化、歷史，以及殖民帶來的影響。"
  ja: "アボリジナルとトレス海峡諸島民の文化と歴史、そして植民地化の影響を学ぶ入門科目。"
  ko: "애버리지니와 토러스 해협 섬 주민의 문화와 역사, 식민지화의 영향을 배우는 입문 과목."
  vi: "Nhập môn về người Thổ dân và người đảo Torres Strait: văn hóa, lịch sử và tác động của thời thuộc địa."
  ms: "Pengenalan kepada orang Asli Aborigin dan Kepulauan Selat Torres, budaya dan sejarah mereka, serta kesan penjajahan."
  id: "Pengantar tentang masyarakat Aborigin dan Kepulauan Selat Torres, budaya dan sejarahnya, serta dampak kolonisasi."
  hi: "एबोरिजिनल और टोरेस स्ट्रेट आइलैंडर लोगों, उनकी संस्कृति, इतिहास और उपनिवेशवाद के असर का परिचय।"
outcomes:
  - en: "Describe Indigenous histories and politics in Australia"
    zh: "说明澳大利亚原住民的历史和政治处境"
    zh-TW: "說明澳洲原住民的歷史和政治處境"
    ja: "オーストラリア先住民の歴史と政治状況を説明する"
    ko: "호주 원주민의 역사와 정치 상황 설명하기"
    vi: "Mô tả lịch sử và chính trị của người bản địa ở Úc"
    ms: "Huraikan sejarah dan politik orang Asli di Australia"
    id: "Menjelaskan sejarah dan politik masyarakat adat di Australia"
    hi: "ऑस्ट्रेलिया में मूल निवासियों के इतिहास और राजनीति को बताना"
  - en: "Explain how colonisation still shapes Indigenous lives"
    zh: "说明殖民至今如何影响原住民的生活"
    zh-TW: "說明殖民至今如何影響原住民的生活"
    ja: "植民地化が今も先住民の暮らしにどう影響しているか説明する"
    ko: "식민지화가 지금도 원주민의 삶에 어떤 영향을 주는지 설명하기"
    vi: "Giải thích thời thuộc địa vẫn ảnh hưởng đời sống người bản địa ra sao"
    ms: "Terangkan bagaimana penjajahan masih membentuk kehidupan orang Asli"
    id: "Menjelaskan bagaimana kolonisasi masih memengaruhi hidup masyarakat adat"
    hi: "समझाना कि उपनिवेशवाद आज भी मूल निवासियों के जीवन पर कैसे असर डालता है"
  - en: "Reflect on your own standpoint with respect for Indigenous knowledge"
    zh: "带着对原住民知识的尊重反思自己的立场"
    zh-TW: "帶著對原住民知識的尊重反思自己的立場"
    ja: "先住民の知を尊重しつつ自分の立場を振り返る"
    ko: "원주민의 지식을 존중하며 자신의 관점 돌아보기"
    vi: "Tự nhìn lại quan điểm của mình với sự tôn trọng tri thức bản địa"
    ms: "Renung kedudukan diri sambil menghormati ilmu orang Asli"
    id: "Merefleksikan posisi diri dengan menghormati pengetahuan masyarakat adat"
    hi: "मूल निवासी ज्ञान का सम्मान करते हुए अपने नज़रिए पर सोचना"
