code: ZOOL30007
year: 2026
learn:
  en: "Running your own group research project on animal behaviour, from hypothesis to stats and reports."
  zh: "小组做动物行为原创研究，从假设到统计和报告。"
  zh-TW: "小組做動物行為原創研究，從假設到統計和報告。"
  ja: "グループで動物行動の研究を行い、仮説から統計・発表まで進める。"
  ko: "팀으로 동물 행동 연구를 직접 수행, 가설부터 통계와 보고까지."
  vi: "Tự làm nghiên cứu nhóm về hành vi động vật, từ giả thuyết đến thống kê và báo cáo."
  ms: "Projek kajian berkumpulan tentang tingkah laku haiwan, dari hipotesis hingga statistik dan laporan."
  id: "Proyek riset kelompok tentang perilaku hewan, dari hipotesis hingga statistik dan laporan."
  hi: "ग्रुप में जानवरों के व्यवहार पर अपना रिसर्च, परिकल्पना से आँकड़ों और रिपोर्ट तक।"
outcomes:
  - en: "Design a rigorous behaviour study"
    zh: "设计严谨的行为研究"
    zh-TW: "設計嚴謹的行為研究"
    ja: "厳密な行動研究を設計する"
    ko: "엄밀한 행동 연구 설계하기"
    vi: "Thiết kế nghiên cứu hành vi chặt chẽ"
    ms: "Mereka kajian tingkah laku yang teliti"
    id: "Merancang studi perilaku yang ketat"
    hi: "सख़्त व्यवहार अध्ययन डिज़ाइन करना"
  - en: "Analyse data with statistical inference"
    zh: "用统计推断分析数据"
    zh-TW: "用統計推論分析數據"
    ja: "統計的推測でデータを分析する"
    ko: "통계적 추론으로 데이터 분석하기"
    vi: "Phân tích dữ liệu bằng suy luận thống kê"
    ms: "Menganalisis data dengan inferens statistik"
    id: "Menganalisis data dengan inferensi statistik"
    hi: "सांख्यिकीय अनुमान से डेटा का विश्लेषण करना"
  - en: "Give peer feedback on reports"
    zh: "对同学的报告给出反馈"
    zh-TW: "對同學的報告給予回饋"
    ja: "他の学生の報告に講評する"
    ko: "동료 보고서에 피드백 주기"
    vi: "Góp ý báo cáo của bạn học"
    ms: "Memberi maklum balas rakan terhadap laporan"
    id: "Memberi umpan balik atas laporan teman"
    hi: "साथियों की रिपोर्ट पर फ़ीडबैक देना"
