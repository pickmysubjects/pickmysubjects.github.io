code: MUSI20225
year: 2026
learn:
  en: "Online: why people everywhere make music, and how listening and playing shape mood, emotions and wellbeing."
  zh: 线上课：人类为何创造音乐，以及聆听和演奏如何影响情绪与身心健康。
  zh-TW: 線上課：人類為何創造音樂，以及聆聽和演奏如何影響情緒與身心健康。
  ja: オンライン科目。人はなぜ音楽をするのか、聴くことや演奏が気分・感情・ウェルビーイングにどう影響するか。
  ko: 온라인 과목. 사람들이 왜 음악을 하는지, 듣기와 연주가 기분·감정·웰빙에 미치는 영향.
  vi: "Học online: vì sao con người làm nhạc, và nghe, chơi nhạc ảnh hưởng tâm trạng, cảm xúc, sức khỏe ra sao."
  ms: "Dalam talian: mengapa manusia bermuzik dan cara mendengar serta bermain mempengaruhi emosi dan kesejahteraan."
  id: "Daring: mengapa manusia bermusik dan bagaimana mendengar serta bermain musik memengaruhi emosi dan kesejahteraan."
  hi: "ऑनलाइन: लोग संगीत क्यों बनाते हैं, और सुनना-बजाना मूड, भावनाओं व सेहत को कैसे प्रभावित करता है।"
outcomes:
  - en: Explain music's role in society
    zh: 解释音乐在社会中的作用
    zh-TW: 解釋音樂在社會中的作用
    ja: 社会における音楽の役割を説明する
    ko: 사회 속 음악의 역할 설명하기
    vi: Giải thích vai trò của âm nhạc trong xã hội
    ms: Terangkan peranan muzik dalam masyarakat
    id: Menjelaskan peran musik di masyarakat
    hi: समाज में संगीत की भूमिका समझाना
  - en: Link music use to wellbeing
    zh: 把音乐使用与身心健康联系起来
    zh-TW: 把音樂使用與身心健康聯繫起來
    ja: 音楽の使い方とウェルビーイングを結びつける
    ko: 음악 활용과 웰빙 연결하기
    vi: Liên hệ âm nhạc với sức khỏe tinh thần
    ms: Kaitkan penggunaan muzik dengan kesejahteraan
    id: Mengaitkan musik dengan kesejahteraan
    hi: संगीत के उपयोग को सेहत से जोड़ना
  - en: Reflect and discuss with peers
    zh: 反思并与同学讨论
    zh-TW: 反思並與同學討論
    ja: 振り返り、仲間と議論する
    ko: 성찰하고 동료와 토론하기
    vi: Suy ngẫm và thảo luận với bạn học
    ms: Renung dan berbincang dengan rakan
    id: Merefleksikan dan berdiskusi dengan teman
    hi: चिंतन करना और साथियों से चर्चा
