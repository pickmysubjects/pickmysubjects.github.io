code: MUSI20149
year: 2026
learn:
  en: "What research says about music, the brain and the body, and how musical skills grow from birth to old age."
  zh: "音乐与大脑、身体的研究，以及音乐能力从出生到老年如何发展。"
  zh-TW: "音樂與大腦、身體的研究，以及音樂能力從出生到老年如何發展。"
  ja: "音楽と脳・身体の研究、そして音楽能力が誕生から老年までどう育つか。"
  ko: "음악과 뇌·몸에 관한 연구, 그리고 음악 능력이 평생 어떻게 자라는지."
  vi: "Nghiên cứu về âm nhạc, não và cơ thể, và kỹ năng âm nhạc phát triển suốt đời ra sao."
  ms: "Kajian tentang muzik, otak dan badan, serta perkembangan kemahiran muzik sepanjang hayat."
  id: "Riset tentang musik, otak dan tubuh, serta perkembangan kemampuan musik sepanjang hidup."
  hi: "संगीत, मस्तिष्क और शरीर पर शोध, और जन्म से बुढ़ापे तक संगीत कौशल कैसे बढ़ता है।"
outcomes:
  - en: "Find relevant research across several disciplines"
    zh: "从多个学科找到相关研究"
    zh-TW: "從多個學科找到相關研究"
    ja: "複数分野から関連研究を探す"
    ko: "여러 분야에서 관련 연구 찾기"
    vi: "Tìm nghiên cứu liên quan từ nhiều ngành"
    ms: "Cari kajian berkaitan daripada pelbagai bidang"
    id: "Menemukan riset relevan dari berbagai bidang"
    hi: "कई विषयों से संबंधित शोध खोजना"
  - en: "Summarise research studies clearly"
    zh: "清楚地总结研究成果"
    zh-TW: "清楚地總結研究成果"
    ja: "研究を分かりやすく要約する"
    ko: "연구 내용을 명확히 요약하기"
    vi: "Tóm tắt các nghiên cứu một cách rõ ràng"
    ms: "Ringkaskan kajian dengan jelas"
    id: "Merangkum studi riset dengan jelas"
    hi: "शोध अध्ययनों का स्पष्ट सार लिखना"
  - en: "Critique theories in music psychology"
    zh: "批判性评价音乐心理学理论"
    zh-TW: "批判性評價音樂心理學理論"
    ja: "音楽心理学の理論を批判的に検討する"
    ko: "음악심리학 이론 비판적으로 검토하기"
    vi: "Phản biện các lý thuyết tâm lý học âm nhạc"
    ms: "Kritik teori psikologi muzik"
    id: "Mengkritisi teori psikologi musik"
    hi: "संगीत मनोविज्ञान के सिद्धांतों की समीक्षा करना"
