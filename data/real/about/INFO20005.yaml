code: INFO20005
year: 2026
learn:
  en: "Visual design principles and prototyping, taking a user interface from paper sketch to working app."
  zh: "视觉设计原则与原型制作，把界面从纸面草图做成可用应用。"
  zh-TW: "視覺設計原則與原型製作，把介面從紙面草圖做成可用應用程式。"
  ja: "視覚デザインの原則とプロトタイピングで、UIを紙のスケッチから動くアプリへ。"
  ko: "시각 디자인 원칙과 프로토타이핑으로 UI를 종이 스케치에서 작동하는 앱까지 만든다."
  vi: "Nguyên tắc thiết kế trực quan và tạo mẫu, đưa giao diện từ bản phác giấy đến ứng dụng chạy được."
  ms: "Prinsip reka bentuk visual dan prototaip, membawa antara muka dari lakaran kertas ke aplikasi."
  id: "Prinsip desain visual dan prototipe, membawa antarmuka dari sketsa kertas ke aplikasi jadi."
  hi: "दृश्य डिज़ाइन सिद्धांत और प्रोटोटाइपिंग: यूज़र इंटरफ़ेस को कागज़ी स्केच से चलने वाले ऐप तक।"
outcomes:
  - en: "Apply visual design to graphical interfaces"
    zh: "将视觉设计用于图形界面"
    zh-TW: "將視覺設計用於圖形介面"
    ja: "GUIに視覚デザインを応用する"
    ko: "그래픽 UI에 시각 디자인을 적용한다"
    vi: "Áp dụng thiết kế trực quan cho giao diện đồ họa"
    ms: "Gunakan reka bentuk visual pada antara muka grafik"
    id: "Menerapkan desain visual pada antarmuka grafis"
    hi: "ग्राफ़िकल इंटरफ़ेस में दृश्य डिज़ाइन लागू करें"
  - en: "Build low- to high-fidelity prototypes"
    zh: "制作低到高保真原型"
    zh-TW: "製作低到高擬真度原型"
    ja: "低〜高忠実度のプロトタイプを作る"
    ko: "저충실도부터 고충실도 프로토타입을 만든다"
    vi: "Tạo mẫu từ độ trung thực thấp đến cao"
    ms: "Bina prototaip kesetiaan rendah hingga tinggi"
    id: "Membuat prototipe fidelitas rendah hingga tinggi"
    hi: "कम से उच्च फ़िडेलिटी के प्रोटोटाइप बनाएँ"
  - en: "Implement interface designs in working systems"
    zh: "在可运行系统中实现界面设计"
    zh-TW: "在可運作系統中實作介面設計"
    ja: "UIデザインを動くシステムに実装する"
    ko: "UI 디자인을 작동하는 시스템으로 구현한다"
    vi: "Hiện thực thiết kế giao diện thành hệ thống chạy được"
    ms: "Laksanakan reka bentuk antara muka dalam sistem"
    id: "Mengimplementasikan desain antarmuka ke sistem nyata"
    hi: "इंटरफ़ेस डिज़ाइन को कार्यशील सिस्टम में लागू करें"
