code: MAST10026
year: 2026
learn:
  en: "Catch-up maths for Uni Ready students: polynomials, trig, exponentials, logs and basic calculus."
  zh: "给 Uni Ready 学生补数学：多项式、三角、指数对数和基础微积分。"
  zh-TW: "給 Uni Ready 學生補數學：多項式、三角、指數對數和基礎微積分。"
  ja: "Uni Ready生向けの補習数学：多項式、三角関数、指数、対数、基礎微積分。"
  ko: "Uni Ready 학생을 위한 보충 수학: 다항식, 삼각함수, 지수, 로그, 기초 미적분."
  vi: "Toán bổ trợ cho sinh viên Uni Ready: đa thức, lượng giác, mũ, logarit và giải tích cơ bản."
  ms: "Matematik susulan untuk pelajar Uni Ready: polinomial, trigonometri, eksponen, log dan kalkulus asas."
  id: "Matematika penyusul untuk mahasiswa Uni Ready: polinomial, trigonometri, eksponen, logaritma, dan kalkulus dasar."
  hi: "Uni Ready छात्रों के लिए कैच-अप गणित: बहुपद, त्रिकोणमिति, एक्सपोनेंशियल, लॉग और बेसिक कैलकुलस।"
outcomes:
  - en: "Sketch and transform graphs of common functions"
    zh: "画常见函数图像并做变换"
    zh-TW: "畫常見函數圖形並做變換"
    ja: "よく使う関数のグラフを描き変換する"
    ko: "주요 함수 그래프 그리기와 변환"
    vi: "Vẽ và biến đổi đồ thị hàm thường gặp"
    ms: "Lakar dan jelmakan graf fungsi biasa"
    id: "Menggambar dan mentransformasi grafik fungsi umum"
    hi: "आम फ़ंक्शन के ग्राफ़ बनाना और रूपांतरित करना"
  - en: "Differentiate and find maximums and minimums"
    zh: "求导并找最大最小值"
    zh-TW: "求導並找最大最小值"
    ja: "微分して最大値・最小値を求める"
    ko: "미분해서 최댓값·최솟값 구하기"
    vi: "Đạo hàm và tìm giá trị lớn nhất, nhỏ nhất"
    ms: "Bezakan dan cari maksimum serta minimum"
    id: "Menurunkan dan mencari maksimum serta minimum"
    hi: "अवकलन करके अधिकतम और न्यूनतम निकालना"
  - en: "Integrate to find areas under curves"
    zh: "用积分算曲线下面积"
    zh-TW: "用積分算曲線下面積"
    ja: "積分で曲線の下の面積を求める"
    ko: "적분으로 곡선 아래 넓이 구하기"
    vi: "Tích phân để tính diện tích dưới đường cong"
    ms: "Kamirkan untuk cari luas bawah lengkung"
    id: "Mengintegralkan untuk mencari luas di bawah kurva"
    hi: "इंटीग्रेशन से कर्व के नीचे का क्षेत्रफल निकालना"
