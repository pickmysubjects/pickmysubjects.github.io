code: ANCW20019
year: 2026
learn:
  en: "The history of the Roman Republic from its start around 500 BCE to the murder of Julius Caesar in 44 BCE."
  zh: "罗马共和国从约公元前500年建立到公元前44年恺撒遇刺的历史。"
  zh-TW: "羅馬共和國從約公元前500年建立到公元前44年凱撒遇刺的歷史。"
  ja: "紀元前500年頃の成立から紀元前44年のカエサル暗殺までのローマ共和政の歴史を学ぶ。"
  ko: "기원전 500년경 성립부터 기원전 44년 카이사르 암살까지 로마 공화정의 역사를 배운다."
  vi: "Lịch sử Cộng hòa La Mã từ khởi đầu khoảng 500 TCN đến vụ ám sát Julius Caesar năm 44 TCN."
  ms: "Sejarah Republik Rom dari permulaannya sekitar 500 SM hingga pembunuhan Julius Caesar pada 44 SM."
  id: "Sejarah Republik Romawi dari awalnya sekitar 500 SM hingga pembunuhan Julius Caesar pada 44 SM."
  hi: "लगभग 500 ईसा पूर्व की शुरुआत से 44 ईसा पूर्व में जूलियस सीज़र की हत्या तक रोमन गणराज्य का इतिहास।"
outcomes:
  - en: "Outline the main phases of the Republic"
    zh: "概述共和国的主要阶段"
    zh-TW: "概述共和國的主要階段"
    ja: "共和政の主な段階をまとめる"
    ko: "공화정의 주요 단계 정리하기"
    vi: "Tóm tắt các giai đoạn chính của nền Cộng hòa"
    ms: "Ringkaskan fasa utama Republik"
    id: "Merangkum fase utama Republik"
    hi: "गणराज्य के मुख्य चरणों की रूपरेखा देना"
  - en: "Explain Roman political and social institutions"
    zh: "解释罗马的政治与社会制度"
    zh-TW: "解釋羅馬的政治與社會制度"
    ja: "ローマの政治・社会制度を説明する"
    ko: "로마의 정치·사회 제도 설명하기"
    vi: "Giải thích thể chế chính trị và xã hội La Mã"
    ms: "Terangkan institusi politik dan sosial Rom"
    id: "Menjelaskan lembaga politik dan sosial Romawi"
    hi: "रोमन राजनीतिक और सामाजिक संस्थाएँ समझाना"
  - en: "Analyse why the Republic fell"
    zh: "分析共和国为何衰亡"
    zh-TW: "分析共和國為何衰亡"
    ja: "共和政が崩れた理由を分析する"
    ko: "공화정이 무너진 이유 분석하기"
    vi: "Phân tích vì sao nền Cộng hòa sụp đổ"
    ms: "Analisis mengapa Republik runtuh"
    id: "Menganalisis mengapa Republik runtuh"
    hi: "गणराज्य क्यों गिरा, विश्लेषण करना"
