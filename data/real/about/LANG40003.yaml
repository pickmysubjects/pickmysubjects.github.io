code: LANG40003
year: 2026
learn:
  en: "Graduate Arts seminar on an approved topic in your language specialisation, written up in two research essays."
  zh: "文科研究生证书/文凭的语言研讨课：围绕所学语言的指定主题，写两篇研究论文"
  zh-TW: "文科研究生證書/文憑的語言研討課：圍繞所學語言的指定主題，寫兩篇研究論文"
  ja: "文学系大学院修了証・ディプロマ向けのゼミ。専攻言語の承認テーマで研究エッセイを2本書く。"
  ko: "인문학 대학원 수료·디플로마 과정 세미나: 전공 언어의 승인된 주제로 연구 에세이 두 편 작성."
  vi: "Hội thảo sau đại học ngành Nhân văn về một chủ đề ngôn ngữ đã duyệt, viết hai bài luận nghiên cứu."
  ms: "Seminar Sastera pascasiswazah tentang topik yang diluluskan dalam bahasa pengkhususan, dengan dua esei kajian."
  id: "Seminar Sastra pascasarjana tentang topik yang disetujui dalam spesialisasi bahasa, dengan dua esai riset."
  hi: "आर्ट्स ग्रेजुएट सेमिनार: अपनी भाषा विशेषज्ञता के स्वीकृत विषय पर, दो शोध निबंधों के साथ।"
outcomes:
  - en: "Use sound research methods and theory on a language topic"
    zh: "在语言主题上运用严谨的研究方法和理论"
    zh-TW: "在語言主題上運用嚴謹的研究方法和理論"
    ja: "言語のテーマに確かな研究方法と理論を使う"
    ko: "언어 주제에 엄밀한 연구 방법과 이론 적용하기"
    vi: "Dùng phương pháp và lý thuyết nghiên cứu vững cho chủ đề ngôn ngữ"
    ms: "Menggunakan kaedah dan teori kajian yang kukuh"
    id: "Menerapkan metode dan teori riset yang kuat pada topik bahasa"
    hi: "भाषा विषय पर ठोस शोध पद्धति और सिद्धांत लगाना"
  - en: "Analyse complex issues with critical frameworks"
    zh: "用批判框架分析复杂问题"
    zh-TW: "用批判框架分析複雜問題"
    ja: "批判的な枠組みで複雑な問題を分析する"
    ko: "비판적 틀로 복잡한 문제 분석하기"
    vi: "Phân tích vấn đề phức tạp bằng khung phê phán"
    ms: "Menganalisis isu kompleks dengan kerangka kritis"
    id: "Menganalisis isu kompleks dengan kerangka kritis"
    hi: "आलोचनात्मक ढाँचों से जटिल मुद्दों का विश्लेषण करना"
  - en: "Write clearly in academic language"
    zh: "用规范的学术语言清晰写作"
    zh-TW: "用規範的學術語言清晰寫作"
    ja: "学術的な言葉で明快に書く"
    ko: "학술 언어로 명확하게 글쓰기"
    vi: "Viết rõ ràng bằng ngôn ngữ học thuật"
    ms: "Menulis dengan jelas dalam bahasa akademik"
    id: "Menulis dengan jelas dalam bahasa akademik"
    hi: "अकादमिक भाषा में स्पष्ट लिखना"
