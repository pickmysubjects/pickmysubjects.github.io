code: BUSA30000
year: 2026
learn:
  en: "A capstone where teams use management and marketing know-how to make and defend business calls in simulations and cases."
  zh: "管理和营销的总结课：团队在模拟和案例中做出并论证商业判断。"
  zh-TW: "管理與行銷的總整課：團隊在模擬與個案中做出並論證商業判斷。"
  ja: "経営とマーケティングの総まとめ：チームでシミュレーションや事例の判断を下し説明する。"
  ko: "경영·마케팅 캡스톤: 팀이 시뮬레이션과 사례에서 사업 판단을 내리고 그 근거를 제시한다."
  vi: "Môn tổng kết: các nhóm dùng kiến thức quản trị và marketing để ra và bảo vệ quyết định kinh doanh qua mô phỏng, tình huống."
  ms: "Subjek puncak: pasukan guna ilmu pengurusan dan pemasaran untuk buat dan pertahankan keputusan dalam simulasi dan kes."
  id: "Mata kuliah puncak: tim memakai ilmu manajemen dan pemasaran untuk mengambil dan membela keputusan bisnis dalam simulasi dan kasus."
  hi: "कैपस्टोन सब्जेक्ट: टीमें मैनेजमेंट और मार्केटिंग की समझ से सिमुलेशन और केस में बिज़नेस फ़ैसले लेती और उनका बचाव करती हैं।"
outcomes:
  - en: "Prioritise and justify business judgements"
    zh: "排定商业判断的优先级并说明理由"
    zh-TW: "排定商業判斷的優先順序並說明理由"
    ja: "ビジネス上の判断に優先順位をつけ、根拠を示す"
    ko: "사업 판단의 우선순위를 정하고 근거 제시"
    vi: "Xếp ưu tiên và lý giải các quyết định kinh doanh"
    ms: "Susun keutamaan dan wajarkan keputusan perniagaan"
    id: "Memprioritaskan dan membenarkan keputusan bisnis"
    hi: "बिज़नेस फ़ैसलों को प्राथमिकता देना और उनका औचित्य बताना"
  - en: "Use data to back up a recommendation"
    zh: "用数据支撑建议"
    zh-TW: "用資料支持建議"
    ja: "データで提案を裏づける"
    ko: "데이터로 제안 뒷받침하기"
    vi: "Dùng dữ liệu để củng cố đề xuất"
    ms: "Guna data untuk menyokong cadangan"
    id: "Memakai data untuk mendukung rekomendasi"
    hi: "डेटा से सुझाव को मज़बूत करना"
  - en: "Weigh ethical and sustainability factors"
    zh: "权衡伦理和可持续因素"
    zh-TW: "權衡倫理與永續因素"
    ja: "倫理とサステナビリティの観点を考える"
    ko: "윤리와 지속가능성 요소 고려하기"
    vi: "Cân nhắc yếu tố đạo đức và bền vững"
    ms: "Timbang faktor etika dan kelestarian"
    id: "Menimbang faktor etika dan keberlanjutan"
    hi: "नैतिक और सस्टेनेबिलिटी पहलुओं को तौलना"
