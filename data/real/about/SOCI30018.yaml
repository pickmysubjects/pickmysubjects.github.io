code: SOCI30018
year: 2026
learn:
  en: "The sociology of family life: changing patterns in marriage, children, living together, singlehood and housework."
  zh: "家庭生活社会学：婚姻、生育、同居、单身和家务分工的变化趋势。"
  zh-TW: "家庭生活社會學：婚姻、生育、同居、單身和家務分工的變化趨勢。"
  ja: "家族生活の社会学。結婚、出産、同居、独身、家事分担の変化を学ぶ。"
  ko: "가족생활의 사회학. 결혼, 출산, 동거, 비혼, 가사 분담의 변화를 배운다."
  vi: "Xã hội học đời sống gia đình: xu hướng thay đổi về hôn nhân, sinh con, sống chung, độc thân và việc nhà."
  ms: "Sosiologi kehidupan keluarga: perubahan dalam perkahwinan, anak, tinggal bersama, hidup bujang dan kerja rumah."
  id: "Sosiologi kehidupan keluarga: perubahan dalam pernikahan, anak, tinggal bersama, hidup lajang dan pekerjaan rumah."
  hi: "पारिवारिक जीवन का समाजशास्त्र: शादी, बच्चे, साथ रहना, अकेले रहना और घरेलू काम में बदलते रुझान।"
outcomes:
  - en: "Explain key theories of family and personal life"
    zh: "说明关于家庭和私人生活的主要理论"
    zh-TW: "說明關於家庭和私人生活的主要理論"
    ja: "家族と私生活についての主な理論を説明する"
    ko: "가족과 사적 삶에 관한 주요 이론 설명하기"
    vi: "Giải thích các lý thuyết chính về gia đình và đời sống riêng"
    ms: "Terangkan teori utama tentang keluarga dan kehidupan peribadi"
    id: "Menjelaskan teori utama tentang keluarga dan kehidupan pribadi"
    hi: "परिवार और निजी जीवन के मुख्य सिद्धांत समझाना"
  - en: "Analyse trends in marriage, fertility and households"
    zh: "分析婚姻、生育和家庭结构的趋势"
    zh-TW: "分析婚姻、生育和家庭結構的趨勢"
    ja: "結婚・出生・世帯の傾向を分析する"
    ko: "결혼·출산·가구 추세 분석하기"
    vi: "Phân tích xu hướng hôn nhân, sinh sản và hộ gia đình"
    ms: "Analisis trend perkahwinan, kesuburan dan isi rumah"
    id: "Menganalisis tren pernikahan, kelahiran dan rumah tangga"
    hi: "शादी, जन्मदर और परिवारों के रुझानों का विश्लेषण करना"
  - en: "Discuss what family change means for policy"
    zh: "讨论家庭变化对社会政策的意义"
    zh-TW: "討論家庭變化對社會政策的意義"
    ja: "家族の変化が政策に持つ意味を論じる"
    ko: "가족 변화가 정책에 주는 의미 논의하기"
    vi: "Thảo luận ý nghĩa của thay đổi gia đình với chính sách"
    ms: "Bincangkan maksud perubahan keluarga untuk dasar"
    id: "Membahas arti perubahan keluarga bagi kebijakan"
    hi: "पारिवारिक बदलाव का नीति के लिए क्या मतलब है, चर्चा करना"
