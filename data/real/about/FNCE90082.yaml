code: FNCE90082
year: 2027
learn:
  en: "Managing price, interest rate, credit and currency risk with derivatives, value-at-risk and securitisation, using real cases."
  zh: "用衍生品、风险价值和证券化管理价格、利率、信用和汇率风险，结合真实案例。"
  zh-TW: "用衍生性商品、風險值與證券化管理價格、利率、信用與匯率風險，搭配真實個案。"
  ja: "デリバティブ、VaR、証券化で価格・金利・信用・為替リスクを管理する。実例を使う。"
  ko: "파생상품, VaR, 증권화로 가격·금리·신용·환율 위험을 관리한다. 실제 사례 활용."
  vi: "Quản lý rủi ro giá, lãi suất, tín dụng, tỷ giá bằng phái sinh, VaR và chứng khoán hóa qua tình huống thật."
  ms: "Mengurus risiko harga, kadar faedah, kredit dan mata wang dengan derivatif, VaR dan pensekuritian."
  id: "Mengelola risiko harga, suku bunga, kredit dan kurs dengan derivatif, VaR dan sekuritisasi."
  hi: "डेरिवेटिव, VaR और प्रतिभूतिकरण से मूल्य, ब्याज, ऋण और मुद्रा जोखिम संभालना, असली केस के साथ।"
outcomes:
  - en: "Identify the key financial risks firms face"
    zh: "识别企业面临的主要金融风险"
    zh-TW: "辨識企業面臨的主要金融風險"
    ja: "企業が直面する主な金融リスクを見極める"
    ko: "기업이 직면한 주요 금융위험 파악하기"
    vi: "Xác định rủi ro tài chính chính của doanh nghiệp"
    ms: "Mengenal pasti risiko kewangan utama firma"
    id: "Mengenali risiko keuangan utama perusahaan"
    hi: "कंपनियों के प्रमुख वित्तीय जोखिम पहचानना"
  - en: "Use options, futures and swaps to manage risk"
    zh: "用期权、期货和互换管理风险"
    zh-TW: "用選擇權、期貨與交換管理風險"
    ja: "オプション・先物・スワップでリスクを管理する"
    ko: "옵션·선물·스왑으로 위험 관리하기"
    vi: "Dùng quyền chọn, tương lai, hoán đổi để quản lý rủi ro"
    ms: "Menggunakan opsyen, niaga hadapan dan swap untuk urus risiko"
    id: "Memakai opsi, futures dan swap untuk mengelola risiko"
    hi: "जोखिम संभालने में ऑप्शन, फ्यूचर्स और स्वैप का उपयोग"
