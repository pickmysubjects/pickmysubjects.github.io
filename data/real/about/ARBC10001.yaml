code: ARBC10001
year: 2026
learn:
  en: "More complex Arabic through real texts, from ads and letters to news and life stories, with more listening practice."
  zh: "通过广告、书信、新闻和传记等真实文本学习更复杂的阿拉伯语，并加强听力。"
  zh-TW: "透過廣告、書信、新聞和傳記等真實文本學習更複雜的阿拉伯語，並加強聽力。"
  ja: "広告や手紙からニュース、伝記まで本物の文章で、より複雑なアラビア語と聞き取りを学ぶ。"
  ko: "광고·편지·뉴스·전기 같은 실제 글로 더 복잡한 아랍어를 배우고 듣기를 강화한다."
  vi: "Tiếng Ả Rập phức tạp hơn qua văn bản thật, từ quảng cáo, thư từ đến tin tức và tiểu sử, cùng luyện nghe nhiều hơn."
  ms: "Bahasa Arab lebih kompleks melalui teks sebenar, daripada iklan dan surat hingga berita dan biografi, serta lebih latihan mendengar."
  id: "Bahasa Arab lebih rumit lewat teks asli, dari iklan dan surat hingga berita dan biografi, plus lebih banyak latihan menyimak."
  hi: "असली पाठों से ज़्यादा जटिल अरबी: विज्ञापन और पत्रों से लेकर ख़बरें और जीवनियाँ, साथ में ज़्यादा सुनने का अभ्यास।"
outcomes:
  - en: "Talk about familiar topics in Arabic with more confidence"
    zh: "更自信地用阿拉伯语谈论熟悉的话题"
    zh-TW: "更自信地用阿拉伯語談論熟悉的話題"
    ja: "身近な話題をアラビア語でより自信を持って話す"
    ko: "익숙한 주제를 아랍어로 더 자신 있게 말하기"
    vi: "Nói về chủ đề quen thuộc bằng tiếng Ả Rập tự tin hơn"
    ms: "Bercakap tentang topik biasa dalam bahasa Arab dengan lebih yakin"
    id: "Membicarakan topik akrab dalam bahasa Arab dengan lebih percaya diri"
    hi: "परिचित विषयों पर अरबी में ज़्यादा आत्मविश्वास से बात करना"
  - en: "Read and write short Arabic texts"
    zh: "读写简短的阿拉伯语文章"
    zh-TW: "讀寫簡短的阿拉伯語文章"
    ja: "短いアラビア語の文章を読み書きする"
    ko: "짧은 아랍어 글 읽고 쓰기"
    vi: "Đọc và viết đoạn văn tiếng Ả Rập ngắn"
    ms: "Baca dan tulis teks pendek bahasa Arab"
    id: "Membaca dan menulis teks pendek bahasa Arab"
    hi: "छोटे अरबी पाठ पढ़ना-लिखना"
  - en: "Use new grammar and vocabulary correctly"
    zh: "正确运用新语法和词汇"
    zh-TW: "正確運用新文法和詞彙"
    ja: "新しい文法と語彙を正しく使う"
    ko: "새 문법과 어휘를 정확히 쓰기"
    vi: "Dùng đúng ngữ pháp và từ vựng mới"
    ms: "Guna tatabahasa dan kosa kata baharu dengan betul"
    id: "Memakai tata bahasa dan kosakata baru dengan benar"
    hi: "नया व्याकरण और शब्दावली सही इस्तेमाल करना"
