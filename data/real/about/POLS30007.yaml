code: POLS30007
year: 2026
learn:
  en: "Australian politics over the long run: parties, federalism, crises, and how the system has handled multiculturalism and social movements."
  zh: "长时段看澳洲政治：政党、联邦制、危机，以及这个体制如何应对多元文化和社会运动。"
  zh-TW: "長時段看澳洲政治：政黨、聯邦制、危機，以及這個體制如何應對多元文化和社會運動。"
  ja: "長い時間軸で見るオーストラリア政治。政党、連邦制、危機、そして多文化化や社会運動への制度の対応。"
  ko: "긴 호흡으로 보는 호주 정치. 정당, 연방제, 위기, 그리고 다문화와 사회운동에 대한 체제의 대응."
  vi: "Chính trị Úc trong dài hạn: đảng phái, liên bang, khủng hoảng, và cách hệ thống ứng phó với đa văn hóa và phong trào xã hội."
  ms: "Politik Australia jangka panjang: parti, persekutuan, krisis, dan cara sistem menangani multibudaya serta gerakan sosial."
  id: "Politik Australia jangka panjang: partai, federalisme, krisis, dan cara sistem menangani multikulturalisme serta gerakan sosial."
  hi: "लंबे दौर में ऑस्ट्रेलियाई राजनीति: दल, संघवाद, संकट, और व्यवस्था ने बहुसंस्कृतिवाद व सामाजिक आंदोलनों को कैसे संभाला।"
outcomes:
  - en: "Trace how Australia's party system developed"
    zh: "追溯澳洲政党体系的发展"
    zh-TW: "追溯澳洲政黨體系的發展"
    ja: "オーストラリアの政党制の発展をたどる"
    ko: "호주 정당 체제의 발전 추적하기"
    vi: "Lần theo sự phát triển của hệ thống đảng ở Úc"
    ms: "Jejaki perkembangan sistem parti Australia"
    id: "Menelusuri perkembangan sistem partai Australia"
    hi: "ऑस्ट्रेलिया की दलीय व्यवस्था का विकास समझना"
  - en: "Assess how stable the political system is"
    zh: "评估政治体制的稳定性"
    zh-TW: "評估政治體制的穩定性"
    ja: "政治制度の安定性を評価する"
    ko: "정치 체제의 안정성 평가하기"
    vi: "Đánh giá mức ổn định của hệ thống chính trị"
    ms: "Nilai kestabilan sistem politik"
    id: "Menilai stabilitas sistem politik"
    hi: "राजनीतिक व्यवस्था कितनी स्थिर है, आकलन करना"
  - en: "Use history to make sense of politics today"
    zh: "借历史理解今天的政治"
    zh-TW: "藉歷史理解今天的政治"
    ja: "歴史から今日の政治を理解する"
    ko: "역사로 오늘의 정치 이해하기"
    vi: "Dùng lịch sử để hiểu chính trị hôm nay"
    ms: "Guna sejarah untuk memahami politik kini"
    id: "Memakai sejarah untuk memahami politik kini"
    hi: "आज की राजनीति समझने के लिए इतिहास का इस्तेमाल करना"
