code: ECON90016
year: 2027
learn:
  en: "Economics of the environment: externalities, public goods, benefit-cost analysis, with water, forests and climate cases."
  zh: "环境经济学：外部性、公共物品、成本效益分析，以及水、森林和气候案例。"
  zh-TW: "環境經濟學：外部性、公共財、成本效益分析，以及水、森林與氣候案例。"
  ja: "環境の経済学：外部性、公共財、費用便益分析と、水・森林・気候の事例。"
  ko: "환경경제학: 외부효과, 공공재, 비용편익분석과 물·산림·기후 사례."
  vi: "Kinh tế môi trường: ngoại ứng, hàng hóa công, phân tích chi phí-lợi ích, với ví dụ nước, rừng, khí hậu."
  ms: "Ekonomi alam sekitar: eksternaliti, barang awam, analisis kos-faedah, dengan kes air, hutan dan iklim."
  id: "Ekonomi lingkungan: eksternalitas, barang publik, analisis biaya-manfaat, dengan kasus air, hutan, dan iklim."
  hi: "पर्यावरण अर्थशास्त्र: बाह्यताएँ, सार्वजनिक वस्तुएँ, लागत-लाभ विश्लेषण, जल, वन और जलवायु के उदाहरण।"
outcomes:
  - en: "Apply benefit-cost analysis to environmental decisions"
    zh: "将成本效益分析用于环境决策"
    zh-TW: "將成本效益分析用於環境決策"
    ja: "環境に関する判断に費用便益分析を使う"
    ko: "환경 결정에 비용편익분석 적용하기"
    vi: "Áp dụng phân tích chi phí-lợi ích cho quyết định môi trường"
    ms: "Menggunakan analisis kos-faedah untuk keputusan alam sekitar"
    id: "Menerapkan analisis biaya-manfaat pada keputusan lingkungan"
    hi: "पर्यावरणीय निर्णयों पर लागत-लाभ विश्लेषण लागू करना"
  - en: "Evaluate when government should step in"
    zh: "评价政府何时应当干预"
    zh-TW: "評價政府何時應該介入"
    ja: "政府が介入すべき場面を評価する"
    ko: "정부 개입이 필요한 경우 평가하기"
    vi: "Đánh giá khi nào chính phủ nên can thiệp"
    ms: "Menilai bila kerajaan patut campur tangan"
    id: "Menilai kapan pemerintah perlu campur tangan"
    hi: "सरकार को कब हस्तक्षेप करना चाहिए, आंकना"
