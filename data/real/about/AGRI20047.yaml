code: AGRI20047
year: 2027
learn:
  en: "How farm data from soil, climate, crops, livestock and markets is collected and analysed to make better decisions."
  zh: "如何收集和分析土壤、气候、作物、牲畜和市场等农业数据，以做出更好的决策。"
  zh-TW: "如何蒐集和分析土壤、氣候、作物、牲畜和市場等農業資料，以做出更好的決策。"
  ja: "土壌・気候・作物・家畜・市場などの農業データを集めて分析し、より良い判断につなげる。"
  ko: "토양·기후·작물·가축·시장 등 농업 데이터를 모으고 분석해 더 나은 결정 내리기."
  vi: "Cách thu thập và phân tích dữ liệu nông nghiệp từ đất, khí hậu, cây trồng, vật nuôi và thị trường để ra quyết định tốt hơn."
  ms: "Cara data pertanian daripada tanah, iklim, tanaman, ternakan dan pasaran dikumpul dan dianalisis untuk keputusan yang lebih baik."
  id: "Cara data pertanian dari tanah, iklim, tanaman, ternak, dan pasar dikumpulkan dan dianalisis untuk keputusan yang lebih baik."
  hi: "मिट्टी, जलवायु, फ़सल, पशुधन और बाज़ार के कृषि डेटा को इकट्ठा कर विश्लेषण करना ताकि बेहतर फ़ैसले हों।"
outcomes:
  - en: "Collect and clean farm data from sensors and satellites"
    zh: "收集并清洗来自传感器和卫星的农业数据"
    zh-TW: "蒐集並清理來自感測器和衛星的農業資料"
    ja: "センサーや衛星から農業データを集めて整える"
    ko: "센서·위성의 농업 데이터 수집·정제하기"
    vi: "Thu thập và làm sạch dữ liệu nông trại từ cảm biến và vệ tinh"
    ms: "Kumpul dan bersihkan data ladang daripada penderia dan satelit"
    id: "Mengumpulkan dan membersihkan data pertanian dari sensor dan satelit"
    hi: "सेंसर और सैटेलाइट से खेत का डेटा जुटाना और साफ़ करना"
  - en: "Plan data collection for a real farming problem"
    zh: "为实际农业问题设计数据收集方案"
    zh-TW: "為實際農業問題設計資料蒐集方案"
    ja: "実際の農業課題のためにデータ収集を計画する"
    ko: "실제 농업 문제를 위한 데이터 수집 계획 세우기"
    vi: "Lập kế hoạch thu thập dữ liệu cho vấn đề nông nghiệp thực tế"
    ms: "Rancang pengumpulan data untuk masalah pertanian sebenar"
    id: "Merencanakan pengumpulan data untuk masalah pertanian nyata"
    hi: "असली कृषि समस्या के लिए डेटा संग्रह की योजना बनाना"
  - en: "Propose digital solutions for sustainable farming"
    zh: "提出提升农业可持续性的数字方案"
    zh-TW: "提出提升農業永續性的數位方案"
    ja: "持続可能な農業のためのデジタル解決策を提案する"
    ko: "지속가능한 농업을 위한 디지털 해법 제안하기"
    vi: "Đề xuất giải pháp số cho nông nghiệp bền vững"
    ms: "Cadangkan penyelesaian digital untuk pertanian mampan"
    id: "Mengusulkan solusi digital untuk pertanian berkelanjutan"
    hi: "टिकाऊ खेती के लिए डिजिटल समाधान सुझाना"
