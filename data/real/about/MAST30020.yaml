code: MAST30020
year: 2026
learn:
  en: "Probability built on measure theory, the rigorous base for limit theorems used in statistics."
  zh: "基于测度论的概率论，是统计里极限定理的严格基础。"
  zh-TW: "以測度論為基礎的機率論，是統計中極限定理的嚴格基礎。"
  ja: "測度論に基づく確率論。統計で使う極限定理の厳密な土台。"
  ko: "측도론에 기반한 확률론. 통계에서 쓰는 극한 정리의 엄밀한 기초."
  vi: "Xác suất dựa trên lý thuyết độ đo, nền tảng chặt chẽ cho các định lý giới hạn trong thống kê."
  ms: "Kebarangkalian berasaskan teori ukuran, asas rapi bagi teorem had dalam statistik."
  id: "Peluang berbasis teori ukuran, dasar ketat untuk teorema limit dalam statistik."
  hi: "माप सिद्धांत पर बनी प्रायिकता, जो सांख्यिकी के सीमा प्रमेयों का सख्त आधार है।"
outcomes:
  - en: "Work with multivariate probability distributions"
    zh: "处理多元概率分布"
    zh-TW: "處理多變量機率分布"
    ja: "多変量確率分布を扱う"
    ko: "다변량 확률분포 다루기"
    vi: "Làm việc với phân phối xác suất nhiều chiều"
    ms: "Mengendalikan taburan kebarangkalian multivariat"
    id: "Bekerja dengan distribusi peluang multivariat"
    hi: "बहुचर प्रायिकता वितरणों के साथ काम करना"
  - en: "Construct general conditional expectations"
    zh: "构造一般的条件期望"
    zh-TW: "構造一般的條件期望值"
    ja: "一般の条件付き期待値を構成する"
    ko: "일반적인 조건부 기댓값 구성하기"
    vi: "Xây dựng kỳ vọng có điều kiện tổng quát"
    ms: "Membina jangkaan bersyarat am"
    id: "Mengonstruksi ekspektasi bersyarat umum"
    hi: "सामान्य सशर्त अपेक्षा बनाना"
  - en: "Compare different kinds of convergence"
    zh: "比较不同的收敛方式"
    zh-TW: "比較不同的收斂方式"
    ja: "さまざまな収束の種類を比べる"
    ko: "여러 종류의 수렴 비교하기"
    vi: "So sánh các kiểu hội tụ khác nhau"
    ms: "Membandingkan jenis penumpuan yang berbeza"
    id: "Membandingkan berbagai jenis konvergensi"
    hi: "अलग-अलग तरह के अभिसरण की तुलना"
