code: GEOG20001
year: 2026
learn:
  en: "How society and nature are tangled together, and how ideas of 'nature' get used in environmental debates."
  zh: "社会与自然如何交织，以及“自然”概念如何被用于环境争论。"
  zh-TW: "社會與自然如何交織，以及「自然」概念如何被用於環境爭論。"
  ja: "社会と自然の絡み合いと、「自然」の考えが環境論争でどう使われるか。"
  ko: "사회와 자연이 얽힌 방식, 그리고 '자연' 개념이 환경 논쟁에서 쓰이는 방식."
  vi: "Xã hội và tự nhiên gắn với nhau ra sao, và khái niệm 'tự nhiên' được dùng thế nào trong tranh luận môi trường."
  ms: "Bagaimana masyarakat dan alam berkait, dan idea 'alam' digunakan dalam perdebatan alam sekitar."
  id: "Bagaimana masyarakat dan alam saling terkait, dan gagasan 'alam' dipakai dalam debat lingkungan."
  hi: "समाज और प्रकृति कैसे जुड़े हैं, और पर्यावरण बहसों में 'प्रकृति' की धारणा कैसे इस्तेमाल होती है।"
outcomes:
  - en: "Compare theories of how society and nature relate"
    zh: "比较社会与自然关系的理论"
    zh-TW: "比較社會與自然關係的理論"
    ja: "社会と自然の関係の理論を比較する"
    ko: "사회-자연 관계 이론 비교하기"
    vi: "So sánh lý thuyết quan hệ xã hội và tự nhiên"
    ms: "Banding teori hubungan masyarakat dan alam"
    id: "Membandingkan teori hubungan masyarakat-alam"
    hi: "समाज-प्रकृति संबंध के सिद्धांतों की तुलना करना"
  - en: "Build a case-study argument from field observations"
    zh: "基于实地观察构建案例论证"
    zh-TW: "根據實地觀察建構案例論證"
    ja: "現地観察から事例の論証を組み立てる"
    ko: "현장 관찰로 사례 논증 세우기"
    vi: "Lập luận về một ca nghiên cứu từ quan sát thực địa"
    ms: "Bina hujah kajian kes dari pemerhatian lapangan"
    id: "Menyusun argumen studi kasus dari observasi lapangan"
    hi: "फ़ील्ड अवलोकन से केस स्टडी तर्क बनाना"
