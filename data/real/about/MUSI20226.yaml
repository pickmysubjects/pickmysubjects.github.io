code: MUSI20226
year: 2026
learn:
  en: "Two-week study tour overseas for Jazz & Improvisation students: workshops and gigs in local music traditions. Not offered in 2026."
  zh: "爵士与即兴专业的两周海外游学：参与当地音乐工作坊与演出。2026年不开。"
  zh-TW: "爵士與即興主修的兩週海外遊學：參與當地音樂工作坊與演出。2026年不開。"
  ja: "ジャズ・即興専攻向け2週間の海外研修。現地音楽のワークショップと演奏。2026年休講。"
  ko: "재즈·즉흥 전공 2주 해외 연수: 현지 음악 워크숍과 공연. 2026년 미개설."
  vi: "Chuyến học 2 tuần ở nước ngoài cho ngành Jazz: workshop và biểu diễn nhạc bản địa. Không mở 2026."
  ms: "Lawatan 2 minggu ke luar negara untuk pelajar Jaz: bengkel dan persembahan muzik tempatan. Tiada 2026."
  id: "Studi 2 minggu ke luar negeri untuk jurusan Jazz: lokakarya dan pentas musik lokal. Tidak dibuka 2026."
  hi: "जैज़ छात्रों के लिए दो हफ़्ते का विदेश अध्ययन: स्थानीय संगीत वर्कशॉप और प्रस्तुतियाँ। 2026 में नहीं।"
outcomes:
  - en: "Learn from local musicians in workshops abroad"
    zh: "在海外工作坊向当地音乐人学习"
    zh-TW: "在海外工作坊向當地音樂人學習"
    ja: "海外のワークショップで現地の音楽家に学ぶ"
    ko: "해외 워크숍에서 현지 음악가에게 배우기"
    vi: "Học từ nhạc sĩ bản địa ở nước ngoài"
    ms: "Belajar daripada pemuzik tempatan di luar negara"
    id: "Belajar dari musisi lokal di luar negeri"
    hi: "विदेश में स्थानीय संगीतकारों से सीखना"
  - en: "Create a 5-minute piece inspired by the trip"
    zh: "创作一首受游学启发的5分钟作品"
    zh-TW: "創作一首受遊學啟發的5分鐘作品"
    ja: "旅に着想を得た5分の作品をつくる"
    ko: "연수에서 영감받은 5분 작품 만들기"
    vi: "Sáng tác bản 5 phút lấy cảm hứng từ chuyến đi"
    ms: "Cipta karya 5 minit berinspirasikan lawatan"
    id: "Menciptakan karya 5 menit terinspirasi perjalanan"
    hi: "यात्रा से प्रेरित 5 मिनट की रचना बनाना"
  - en: "Keep a reflective journal of what you heard and did"
    zh: "以日志记录所见所闻与反思"
    zh-TW: "以日誌記錄所見所聞與反思"
    ja: "見聞きしたことを日誌に振り返る"
    ko: "보고 들은 것을 성찰 일지로 남기기"
    vi: "Ghi nhật ký suy ngẫm về điều đã nghe và làm"
    ms: "Simpan jurnal refleksi tentang pengalaman"
    id: "Menulis jurnal refleksi tentang pengalaman"
    hi: "जो सुना-किया उसकी चिंतन डायरी रखना"
