code: ARCH30003
year: 2026
learn:
  en: "Sustainable design and rating tools (Green Star, NABERS) for offices, schools, hospitals and other commercial buildings."
  zh: "办公楼、学校、医院等商业建筑的可持续设计与评级工具（Green Star、NABERS）。"
  zh-TW: "辦公大樓、學校、醫院等商業建築的永續設計與評級工具（Green Star、NABERS）。"
  ja: "オフィス・学校・病院など商業建築のサステナブル設計と評価ツール（Green Star、NABERS）。"
  ko: "사무실·학교·병원 등 상업 건축의 지속가능 설계와 평가 도구(Green Star, NABERS)."
  vi: "Thiết kế bền vững và công cụ đánh giá (Green Star, NABERS) cho văn phòng, trường, bệnh viện."
  ms: "Reka bentuk lestari dan alat penarafan (Green Star, NABERS) untuk pejabat, sekolah, hospital."
  id: "Desain berkelanjutan dan alat penilaian (Green Star, NABERS) untuk kantor, sekolah, rumah sakit."
  hi: "ऑफ़िस, स्कूल, अस्पताल जैसी व्यावसायिक इमारतों का टिकाऊ डिज़ाइन और रेटिंग टूल।"
outcomes:
  - en: "Assess energy, daylight and comfort in buildings"
    zh: "评估建筑的能耗、采光与舒适度"
    zh-TW: "評估建築的能耗、採光與舒適度"
    ja: "建物のエネルギー・採光・快適性を評価する"
    ko: "건물의 에너지·채광·쾌적성 평가하기"
    vi: "Đánh giá năng lượng, ánh sáng, tiện nghi tòa nhà"
    ms: "Nilai tenaga, cahaya siang dan keselesaan bangunan"
    id: "Menilai energi, cahaya alami dan kenyamanan"
    hi: "इमारत की ऊर्जा, रोशनी और आराम का आकलन"
  - en: "Apply industry rating tools and building codes"
    zh: "运用行业评级工具与建筑规范"
    zh-TW: "運用產業評級工具與建築法規"
    ja: "業界の評価ツールと建築基準を使う"
    ko: "업계 평가 도구와 건축 규정 적용하기"
    vi: "Áp dụng công cụ đánh giá và quy chuẩn xây dựng"
    ms: "Guna alat penarafan industri dan kod bangunan"
    id: "Menerapkan alat penilaian dan kode bangunan"
    hi: "उद्योग रेटिंग टूल और बिल्डिंग कोड लागू करना"
  - en: "Advise on greener commercial design"
    zh: "为更环保的商业设计提出建议"
    zh-TW: "為更環保的商業設計提出建議"
    ja: "より環境に優しい商業設計を提案する"
    ko: "더 친환경적인 상업 설계 조언하기"
    vi: "Tư vấn thiết kế thương mại xanh hơn"
    ms: "Beri nasihat reka bentuk komersial lebih hijau"
    id: "Memberi saran desain komersial lebih hijau"
    hi: "ज़्यादा हरित व्यावसायिक डिज़ाइन पर सलाह देना"
