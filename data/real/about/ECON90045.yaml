code: ECON90045
year: 2027
learn:
  en: "Theory of consumers, firms and government: competition, general equilibrium, market power, externalities, public goods."
  zh: "消费者、企业和政府的理论：竞争、一般均衡、市场势力、外部性和公共物品。"
  zh-TW: "消費者、企業與政府的理論：競爭、一般均衡、市場力量、外部性與公共財。"
  ja: "消費者・企業・政府の理論：競争、一般均衡、市場支配力、外部性、公共財。"
  ko: "소비자·기업·정부 이론: 경쟁, 일반균형, 시장지배력, 외부효과, 공공재."
  vi: "Lý thuyết người tiêu dùng, doanh nghiệp, chính phủ: cạnh tranh, cân bằng tổng thể, sức mạnh thị trường, ngoại ứng."
  ms: "Teori pengguna, firma dan kerajaan: persaingan, keseimbangan am, kuasa pasaran, eksternaliti, barang awam."
  id: "Teori konsumen, perusahaan, dan pemerintah: persaingan, keseimbangan umum, kekuatan pasar, eksternalitas, barang publik."
  hi: "उपभोक्ता, फर्म और सरकार का सिद्धांत: प्रतिस्पर्धा, सामान्य संतुलन, बाज़ार शक्ति, बाह्यताएँ, सार्वजनिक वस्तुएँ।"
outcomes:
  - en: "Explain core theories of the consumer and the firm"
    zh: "解释消费者和企业的核心理论"
    zh-TW: "解釋消費者與企業的核心理論"
    ja: "消費者と企業の基本理論を説明する"
    ko: "소비자와 기업의 핵심 이론 설명하기"
    vi: "Giải thích lý thuyết cốt lõi về người tiêu dùng và doanh nghiệp"
    ms: "Menerangkan teori teras pengguna dan firma"
    id: "Menjelaskan teori inti konsumen dan perusahaan"
    hi: "उपभोक्ता और फर्म के मूल सिद्धांत समझाना"
  - en: "Apply micro theory to business problems"
    zh: "将微观理论应用于商业问题"
    zh-TW: "將個體理論應用於商業問題"
    ja: "ミクロ理論を経営問題に応用する"
    ko: "미시이론을 경영 문제에 적용하기"
    vi: "Áp dụng lý thuyết vi mô vào vấn đề kinh doanh"
    ms: "Menggunakan teori mikro pada masalah perniagaan"
    id: "Menerapkan teori mikro pada masalah bisnis"
    hi: "व्यावसायिक समस्याओं पर सूक्ष्म सिद्धांत लागू करना"
