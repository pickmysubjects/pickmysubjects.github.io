code: DPSS10008
year: 2026
learn:
  en: "Key plays, ideas and objects in world art, design and performance up to modernism, plus academic reading and writing."
  zh: "现代主义之前世界艺术、设计与表演中的重要剧作和物件，并练学术写作。"
  zh-TW: "現代主義之前世界藝術、設計與表演中的重要劇作和物件，並練學術寫作。"
  ja: "モダニズムまでの世界の美術・デザイン・舞台の重要作品と物を学び、学術的な書き方も身につける。"
  ko: "모더니즘까지 세계 미술·디자인·공연의 주요 작품과 사물, 그리고 학술 글쓰기."
  vi: "Kịch bản, ý tưởng và đồ vật quan trọng trong nghệ thuật, thiết kế, biểu diễn đến chủ nghĩa hiện đại."
  ms: "Teks, idea dan objek penting dalam seni, reka bentuk dan persembahan dunia hingga modenisme."
  id: "Naskah, gagasan dan objek penting seni, desain dan pertunjukan dunia hingga modernisme."
  hi: "आधुनिकतावाद तक विश्व कला, डिज़ाइन और प्रदर्शन के प्रमुख नाटक, विचार और वस्तुएँ।"
outcomes:
  - en: "Read a play and an object in their original setting"
    zh: "在原始背景中解读剧作与物件"
    zh-TW: "在原始背景中解讀劇作與物件"
    ja: "戯曲と物を元の文脈で読み解く"
    ko: "희곡과 사물을 원래 맥락에서 읽기"
    vi: "Đọc vở kịch và đồ vật trong bối cảnh gốc"
    ms: "Baca teks dan objek dalam konteks asalnya"
    id: "Membaca naskah dan objek dalam konteks aslinya"
    hi: "नाटक और वस्तु को मूल संदर्भ में पढ़ना"
  - en: "Find and use library sources well"
    zh: "善用图书馆资源找资料"
    zh-TW: "善用圖書館資源找資料"
    ja: "図書館の資料を探して活用する"
    ko: "도서관 자료를 찾아 활용하기"
    vi: "Tìm và dùng tốt nguồn thư viện"
    ms: "Cari dan guna sumber perpustakaan"
    id: "Mencari dan memakai sumber perpustakaan"
    hi: "लाइब्रेरी स्रोत ढूँढना और उपयोग करना"
  - en: "Discuss your analysis in an oral assessment"
    zh: "在口头考核中阐述你的分析"
    zh-TW: "在口頭評量中闡述你的分析"
    ja: "口頭評価で自分の分析を説明する"
    ko: "구술 평가에서 분석 내용 논하기"
    vi: "Trình bày phân tích trong bài đánh giá vấn đáp"
    ms: "Bincang analisis dalam penilaian lisan"
    id: "Membahas analisis dalam asesmen lisan"
    hi: "मौखिक मूल्यांकन में अपना विश्लेषण बताना"
