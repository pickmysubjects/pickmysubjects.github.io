code: JAPN30013
year: 2026
learn:
  en: "Japanese grammar up close: how structures work and how to use them in real communication."
  zh: "深入学习日语语法：结构如何运作以及如何在实际交流中使用。"
  zh-TW: "深入學習日語文法：結構如何運作以及如何在實際交流中使用。"
  ja: "日本語の文法を詳しく学び、実際のやりとりで使えるようにする。"
  ko: "일본어 문법을 자세히 배우고 실제 의사소통에서 쓰는 법을 익힌다."
  vi: "Ngữ pháp tiếng Nhật chi tiết: cấu trúc vận hành ra sao và cách dùng trong giao tiếp thật."
  ms: "Tatabahasa Jepun secara dekat: cara struktur berfungsi dan cara menggunakannya."
  id: "Tata bahasa Jepang secara mendalam: cara struktur bekerja dan cara memakainya."
  hi: "जापानी व्याकरण को नज़दीक से: संरचनाएँ कैसे काम करती हैं और असली बातचीत में उनका इस्तेमाल।"
outcomes:
  - en: "Explain how key Japanese structures work"
    zh: "说明日语主要句型的用法"
    zh-TW: "說明日語主要句型的用法"
    ja: "日本語の主な文型の働きを説明する"
    ko: "일본어 주요 문형의 작동 방식 설명하기"
    vi: "Giải thích cách các cấu trúc tiếng Nhật chính vận hành"
    ms: "Terangkan cara struktur utama Jepun berfungsi"
    id: "Menjelaskan cara kerja struktur utama bahasa Jepang"
    hi: "मुख्य जापानी संरचनाओं का काम समझाना"
  - en: "Spot and fix common grammar errors"
    zh: "发现并改正常见语法错误"
    zh-TW: "發現並改正常見文法錯誤"
    ja: "よくある文法の誤りを見つけて直す"
    ko: "흔한 문법 오류 찾아 고치기"
    vi: "Phát hiện và sửa lỗi ngữ pháp thường gặp"
    ms: "Kenal pasti dan betulkan kesilapan tatabahasa biasa"
    id: "Menemukan dan memperbaiki kesalahan tata bahasa umum"
    hi: "आम व्याकरण की ग़लतियाँ पहचानना और सुधारना"
  - en: "Use advanced grammar in speech and writing"
    zh: "在口语和写作中运用高级语法"
    zh-TW: "在口語和寫作中運用高級文法"
    ja: "話し言葉と書き言葉で上級文法を使う"
    ko: "말하기와 쓰기에서 고급 문법 쓰기"
    vi: "Dùng ngữ pháp nâng cao khi nói và viết"
    ms: "Guna tatabahasa lanjutan dalam lisan dan tulisan"
    id: "Memakai tata bahasa lanjutan dalam lisan dan tulisan"
    hi: "बोलने और लिखने में उन्नत व्याकरण इस्तेमाल करना"
