code: ANSC20003
year: 2026
learn:
  en: "Animal disease and health management: zoonoses, biosecurity, outbreaks, diagnosis and disease control."
  zh: "动物疾病与健康管理：人畜共患病、生物安全、疫情、诊断与防控。"
  zh-TW: "動物疾病與健康管理：人畜共通傳染病、生物安全、疫情、診斷與防治。"
  ja: "動物の病気と健康管理：人獣共通感染症、バイオセキュリティ、診断と防疫。"
  ko: "동물 질병과 건강 관리: 인수공통감염병, 차단방역, 진단과 방역."
  vi: "Bệnh và quản lý sức khỏe động vật: bệnh lây sang người, an toàn sinh học, chẩn đoán, kiểm soát dịch."
  ms: "Penyakit dan pengurusan kesihatan haiwan: zoonosis, biosekuriti, diagnosis dan kawalan wabak."
  id: "Penyakit dan manajemen kesehatan hewan: zoonosis, biosekuriti, diagnosis, dan pengendalian wabah."
  hi: "पशु रोग और स्वास्थ्य प्रबंधन: ज़ूनोटिक रोग, जैव-सुरक्षा, निदान और प्रकोप नियंत्रण।"
outcomes:
  - en: "Explain how diseases arise, inflame and heal"
    zh: "解释疾病如何发生、发炎与愈合"
    zh-TW: "解釋疾病如何發生、發炎與癒合"
    ja: "病気の発生・炎症・治癒を説明する"
    ko: "질병의 발생, 염증, 치유 설명하기"
    vi: "Giải thích bệnh phát sinh, viêm và lành ra sao"
    ms: "Terangkan cara penyakit berlaku, radang dan sembuh"
    id: "Menjelaskan proses penyakit, radang, dan penyembuhan"
    hi: "रोग, सूजन और घाव भरने की प्रक्रिया समझाना"
  - en: "Apply biosecurity strategies on farms"
    zh: "在养殖场应用生物安全措施"
    zh-TW: "在牧場應用生物安全措施"
    ja: "農場でバイオセキュリティ対策を実践する"
    ko: "농장에 차단방역 전략 적용하기"
    vi: "Áp dụng biện pháp an toàn sinh học ở trang trại"
    ms: "Gunakan strategi biosekuriti di ladang"
    id: "Menerapkan strategi biosekuriti di peternakan"
    hi: "फ़ार्म पर जैव-सुरक्षा उपाय लागू करना"
