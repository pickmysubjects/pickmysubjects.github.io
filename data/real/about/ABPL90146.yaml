code: ABPL90146
year: 2027
learn:
  en: "Heritage conservation across Asia: charters like Burra and Nara, local traditions, tourism and activism, through case studies."
  zh: "亚洲的建筑遗产保护：《巴拉宪章》《奈良文件》等、地方传统、旅游和民间行动，通过案例学习。"
  zh-TW: "亞洲的建築遺產保存：《巴拉憲章》《奈良文件》等、在地傳統、觀光與民間行動，透過個案學習。"
  ja: "アジアの文化遺産保護：バラ憲章や奈良文書、地域の伝統、観光、市民運動。"
  ko: "아시아 건축유산 보존: 버라 헌장·나라 문서, 지역 전통, 관광, 시민운동."
  vi: "Bảo tồn di sản kiến trúc châu Á: các hiến chương, truyền thống địa phương, du lịch, qua tình huống."
  ms: "Pemuliharaan warisan di Asia: piagam Burra dan Nara, tradisi tempatan dan pelancongan."
  id: "Konservasi warisan di Asia: piagam Burra dan Nara, tradisi lokal dan pariwisata."
  hi: "एशिया में धरोहर संरक्षण: बुर्रा व नारा चार्टर, स्थानीय परंपराएँ, पर्यटन और सक्रियता।"
outcomes:
  - en: "Compare heritage practice in different Asian countries"
    zh: "比较亚洲各国的遗产保护做法"
    zh-TW: "比較亞洲各國的遺產保存做法"
    ja: "アジア各国の保存の実践を比べる"
    ko: "아시아 각국의 유산 보존 비교하기"
    vi: "So sánh thực hành di sản ở các nước châu Á"
    ms: "Membanding amalan warisan di negara Asia"
    id: "Membandingkan praktik warisan di negara Asia"
    hi: "एशियाई देशों में धरोहर प्रथाओं की तुलना"
  - en: "Write a research essay on a heritage issue"
    zh: "就一个遗产问题撰写研究论文"
    zh-TW: "就一個遺產問題撰寫研究論文"
    ja: "遺産の課題について研究論文を書く"
    ko: "유산 문제에 대한 연구 에세이 쓰기"
    vi: "Viết tiểu luận nghiên cứu về di sản"
    ms: "Menulis esei penyelidikan isu warisan"
    id: "Menulis esai riset tentang isu warisan"
    hi: "धरोहर मुद्दे पर शोध निबंध लिखना"
