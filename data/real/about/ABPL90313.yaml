code: ABPL90313
year: 2027
learn:
  en: "An overview of construction management with a focus on site practice: planning, scheduling, procurement and tendering."
  zh: "全面了解施工管理，侧重现场实践：计划、进度、采购和招标。"
  zh-TW: "全面了解施工管理，著重現場實務：計畫、進度、採購和招標。"
  ja: "現場実務を中心に、計画・工程・調達・入札など施工管理の全体像を学ぶ。"
  ko: "현장 실무 중심으로 계획, 공정, 조달, 입찰 등 시공 관리를 개관합니다."
  vi: "Tổng quan quản lý thi công, chú trọng thực hành công trường: lập kế hoạch, tiến độ, mua sắm, đấu thầu."
  ms: "Gambaran pengurusan pembinaan, fokus amalan tapak: perancangan, penjadualan, perolehan dan tender."
  id: "Gambaran manajemen konstruksi, fokus praktik lapangan: perencanaan, penjadwalan, pengadaan, dan tender."
  hi: "साइट प्रैक्टिस पर ज़ोर के साथ निर्माण प्रबंधन: योजना, शेड्यूलिंग, खरीद और टेंडर।"
outcomes:
  - en: "Plan work with the Critical Path Method"
    zh: "用关键路径法安排工作"
    zh-TW: "用要徑法安排工作"
    ja: "クリティカルパス法で工程を組む"
    ko: "주공정법으로 작업 계획하기"
    vi: "Lập kế hoạch bằng phương pháp đường găng"
    ms: "Merancang kerja dengan Kaedah Laluan Kritikal"
    id: "Merencanakan kerja dengan Metode Jalur Kritis"
    hi: "क्रिटिकल पाथ मेथड से काम की योजना"
  - en: "Choose a suitable procurement system"
    zh: "选择合适的项目采购方式"
    zh-TW: "選擇合適的專案採購方式"
    ja: "適切な調達方式を選ぶ"
    ko: "적절한 조달 방식 선택하기"
    vi: "Chọn hình thức mua sắm phù hợp"
    ms: "Memilih sistem perolehan yang sesuai"
    id: "Memilih sistem pengadaan yang tepat"
    hi: "उपयुक्त खरीद प्रणाली चुनना"
