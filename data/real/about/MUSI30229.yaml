code: MUSI30229
year: 2026
learn:
  en: "Compose music and sound to a creative brief alongside other media, with mentor tutorials and a talk on your own practice."
  zh: "根据创作需求为其他媒体配乐与声音，有导师指导，并做个人创作反思报告。"
  zh-TW: "依創作需求為其他媒體配樂與聲音，有導師指導，並做個人創作反思報告。"
  ja: "課題に沿って他メディアと組む音楽・音を作曲。メンター指導と自作についての発表。"
  ko: "브리프에 맞춰 다른 매체와 함께할 음악·사운드 작곡, 멘토 지도와 작업 발표."
  vi: "Sáng tác nhạc, âm thanh theo yêu cầu cho truyền thông khác, có cố vấn và bài thuyết trình."
  ms: "Gubah muzik dan bunyi mengikut taklimat bersama media lain, dengan mentor dan pembentangan."
  id: "Menggubah musik dan suara sesuai brief bersama media lain, dengan mentor dan presentasi."
  hi: "क्रिएटिव ब्रीफ़ पर अन्य मीडिया के साथ संगीत-ध्वनि रचना, मेंटर और अपने काम पर प्रस्तुति।"
outcomes:
  - en: "Compose music and sound for other media"
    zh: "为其他媒体创作音乐和声音"
    zh-TW: "為其他媒體創作音樂與聲音"
    ja: "他メディアのための音楽と音を作る"
    ko: "다른 매체를 위한 음악·사운드 작곡"
    vi: "Sáng tác âm nhạc cho truyền thông khác"
    ms: "Gubah muzik dan bunyi untuk media lain"
    id: "Menggubah musik dan suara untuk media lain"
    hi: "अन्य मीडिया के लिए संगीत व ध्वनि रचना"
  - en: "Respond to a creative brief"
    zh: "回应创作需求"
    zh-TW: "回應創作需求"
    ja: "制作課題に応える"
    ko: "크리에이티브 브리프에 응답하기"
    vi: "Đáp ứng yêu cầu sáng tạo"
    ms: "Menjawab taklimat kreatif"
    id: "Menanggapi brief kreatif"
    hi: "क्रिएटिव ब्रीफ़ का जवाब देना"
  - en: "Reflect critically on your practice"
    zh: "批判性反思自己的创作"
    zh-TW: "批判性反思自己的創作"
    ja: "自分の創作を批判的に振り返る"
    ko: "자신의 작업 비판적으로 성찰"
    vi: "Tự phản tư về sáng tác"
    ms: "Renungi amalan sendiri secara kritis"
    id: "Merefleksikan karya sendiri secara kritis"
    hi: "अपने काम पर आलोचनात्मक चिंतन"
