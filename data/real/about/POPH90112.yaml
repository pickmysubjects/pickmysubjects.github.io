code: POPH90112
year: 2027
learn:
  en: "How infectious diseases spread and are controlled, with surveillance data, outbreak investigation and weekly topical cases."
  zh: "传染病如何传播和控制，涵盖监测数据、疫情调查和每周时事案例。"
  zh-TW: "傳染病如何傳播與控制，涵蓋監測資料、疫情調查與每週時事案例。"
  ja: "感染症の広がり方と対策。サーベイランスデータ、アウトブレイク調査、毎週の時事事例。"
  ko: "감염병의 전파와 통제, 감시 데이터, 유행 조사, 매주 시사 사례."
  vi: "Bệnh truyền nhiễm lây lan và được kiểm soát ra sao, với dữ liệu giám sát, điều tra ổ dịch và tình huống thời sự hàng tuần."
  ms: "Cara penyakit berjangkit merebak dan dikawal, dengan data pengawasan, siasatan wabak dan kes semasa mingguan."
  id: "Cara penyakit menular menyebar dan dikendalikan, dengan data surveilans, investigasi wabah, dan kasus terkini mingguan."
  hi: "संक्रामक रोग कैसे फैलते और नियंत्रित होते हैं, निगरानी डेटा, प्रकोप जाँच और साप्ताहिक ताज़ा मामलों के साथ।"
outcomes:
  - en: "Explain how infections spread in populations"
    zh: "解释感染如何在人群中传播"
    zh-TW: "解釋感染如何在族群中傳播"
    ja: "感染が集団に広がる仕組みを説明する"
    ko: "감염이 인구에 퍼지는 방식 설명하기"
    vi: "Giải thích bệnh lây lan trong dân số ra sao"
    ms: "Menerangkan cara jangkitan merebak dalam populasi"
    id: "Menjelaskan cara infeksi menyebar di populasi"
    hi: "आबादी में संक्रमण कैसे फैलता है, समझाना"
  - en: "Analyse surveillance data"
    zh: "分析监测数据"
    zh-TW: "分析監測資料"
    ja: "サーベイランスデータを分析する"
    ko: "감시 데이터 분석하기"
    vi: "Phân tích dữ liệu giám sát"
    ms: "Menganalisis data pengawasan"
    id: "Menganalisis data surveilans"
    hi: "निगरानी डेटा का विश्लेषण"
  - en: "Investigate an outbreak and design a response"
    zh: "调查疫情并设计应对方案"
    zh-TW: "調查疫情並設計應對方案"
    ja: "アウトブレイクを調べ、対応を設計する"
    ko: "유행을 조사하고 대응 설계하기"
    vi: "Điều tra ổ dịch và thiết kế biện pháp ứng phó"
    ms: "Menyiasat wabak dan mereka bentuk tindak balas"
    id: "Menyelidiki wabah dan merancang respons"
    hi: "प्रकोप की जाँच और प्रतिक्रिया तैयार करना"
