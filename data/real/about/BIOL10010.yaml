code: BIOL10010
year: 2026
learn:
  en: "Biology from individuals to ecosystems: evolution, how organisms work and interact. No prior biology needed."
  zh: "从个体到生态系统的生物学：演化、生物结构和相互作用，零基础可学。"
  zh-TW: "從個體到生態系的生物學：演化、生物結構和交互作用，零基礎可學。"
  ja: "個体から生態系までの生物学：進化、生物の仕組みと相互作用。生物の予備知識は不要。"
  ko: "개체에서 생태계까지의 생물학: 진화, 생물의 작동과 상호작용. 생물 선수 지식 불필요."
  vi: "Sinh học từ cá thể đến hệ sinh thái: tiến hóa, cách sinh vật hoạt động và tương tác. Không cần nền tảng."
  ms: "Biologi dari individu ke ekosistem: evolusi, cara organisma berfungsi dan berinteraksi. Tiada asas biologi diperlukan."
  id: "Biologi dari individu ke ekosistem: evolusi, cara organisme bekerja dan berinteraksi. Tanpa dasar biologi."
  hi: "व्यक्ति से इकोसिस्टम तक बायोलॉजी: विकास, जीव कैसे काम और बातचीत करते हैं। पहले की बायोलॉजी ज़रूरी नहीं।"
outcomes:
  - en: "Use basic biology terms and classify living things"
    zh: "用生物学术语给生物分类"
    zh-TW: "用生物學術語為生物分類"
    ja: "生物学の基本用語を使い、生き物を分類する"
    ko: "기본 생물학 용어로 생물 분류하기"
    vi: "Dùng thuật ngữ sinh học cơ bản và phân loại sinh vật"
    ms: "Guna istilah asas biologi dan kelaskan hidupan"
    id: "Memakai istilah dasar biologi dan mengklasifikasi makhluk hidup"
    hi: "बुनियादी बायोलॉजी शब्दों से जीवों का वर्गीकरण"
  - en: "Explain how evolution created life's diversity"
    zh: "解释演化怎样造就生物多样性"
    zh-TW: "解釋演化如何造就生物多樣性"
    ja: "進化が生物の多様性を生んだ仕組みを説明する"
    ko: "진화가 생물 다양성을 만든 과정 설명하기"
    vi: "Giải thích tiến hóa tạo nên đa dạng sự sống ra sao"
    ms: "Terangkan cara evolusi mencipta kepelbagaian hidupan"
    id: "Menjelaskan cara evolusi menciptakan keragaman hayati"
    hi: "समझाना कि विकास से जीवन की विविधता कैसे बनी"
  - en: "Describe energy flow through ecosystems"
    zh: "描述能量在生态系统中的流动"
    zh-TW: "描述能量在生態系中的流動"
    ja: "生態系でのエネルギーの流れを説明する"
    ko: "생태계의 에너지 흐름 설명하기"
    vi: "Mô tả dòng năng lượng trong hệ sinh thái"
    ms: "Huraikan aliran tenaga dalam ekosistem"
    id: "Menjelaskan aliran energi dalam ekosistem"
    hi: "इकोसिस्टम में ऊर्जा का प्रवाह बताना"
