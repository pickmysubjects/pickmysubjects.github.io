code: BIOL10010
year: 2026
learn:
  en: "Biology from individuals to ecosystems: evolution, how organisms work and interact. No prior biology needed."
  zh: "从个体到生态系统的生物学：演化、生物结构和相互作用，零基础可学。"
outcomes:
  - en: "Use basic biology terms and classify living things"
    zh: "用生物学术语给生物分类"
  - en: "Explain how evolution created life's diversity"
    zh: "解释演化怎样造就生物多样性"
  - en: "Describe energy flow through ecosystems"
    zh: "描述能量在生态系统中的流动"
