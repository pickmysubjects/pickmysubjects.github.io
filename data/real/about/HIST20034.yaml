code: HIST20034
year: 2026
learn:
  en: "Southeast Asia in the 19th and 20th centuries: colonial rule, Japanese occupation, the Cold War, nationhood and today's issues."
  zh: "19 至 20 世纪的东南亚：殖民统治、日本占领、冷战、民族国家建立与当代议题。"
  zh-TW: "19 至 20 世紀的東南亞：殖民統治、日本佔領、冷戰、民族國家建立與當代議題。"
  ja: "19〜20世紀の東南アジア。植民地支配、日本占領、冷戦、国民国家の形成、そして現在の課題。"
  ko: "19~20세기 동남아시아. 식민 통치, 일본 점령, 냉전, 국민국가 형성과 오늘의 과제."
  vi: "Đông Nam Á thế kỷ 19–20: ách thực dân, Nhật chiếm đóng, Chiến tranh Lạnh, hình thành quốc gia và các vấn đề hôm nay."
  ms: "Asia Tenggara abad ke-19 dan ke-20: pemerintahan kolonial, pendudukan Jepun, Perang Dingin, kenegaraan dan isu semasa."
  id: "Asia Tenggara abad ke-19 dan ke-20: pemerintahan kolonial, pendudukan Jepang, Perang Dingin, kebangsaan dan isu masa kini."
  hi: "19वीं-20वीं सदी का दक्षिण-पूर्व एशिया: औपनिवेशिक शासन, जापानी कब्ज़ा, शीत युद्ध, राष्ट्र-निर्माण और आज के मुद्दे।"
outcomes:
  - en: "Outline key events in modern Southeast Asia"
    zh: "概述现代东南亚的关键事件"
    zh-TW: "概述現代東南亞的關鍵事件"
    ja: "近代東南アジアの主な出来事を整理する"
    ko: "현대 동남아시아의 주요 사건 정리하기"
    vi: "Tóm lược các sự kiện chính của Đông Nam Á hiện đại"
    ms: "Gariskan peristiwa utama Asia Tenggara moden"
    id: "Merangkum peristiwa kunci Asia Tenggara modern"
    hi: "आधुनिक दक्षिण-पूर्व एशिया की मुख्य घटनाएँ बताना"
  - en: "Use translated memoirs and speeches as sources"
    zh: "把翻译的回忆录和演讲当作史料"
    zh-TW: "把翻譯的回憶錄和演講當作史料"
    ja: "翻訳された回想録や演説を史料として使う"
    ko: "번역된 회고록과 연설을 사료로 활용하기"
    vi: "Dùng hồi ký và bài diễn văn đã dịch làm nguồn"
    ms: "Guna memoir dan ucapan terjemahan sebagai sumber"
    id: "Memakai memoar dan pidato terjemahan sebagai sumber"
    hi: "अनूदित संस्मरणों और भाषणों को स्रोत की तरह इस्तेमाल करना"
  - en: "Link past events to current regional issues"
    zh: "把历史事件与当今地区问题联系起来"
    zh-TW: "把歷史事件與當今地區問題聯繫起來"
    ja: "過去の出来事を現在の地域課題と結びつける"
    ko: "과거 사건을 오늘날 지역 문제와 연결하기"
    vi: "Liên hệ sự kiện quá khứ với vấn đề khu vực hiện nay"
    ms: "Kaitkan peristiwa lalu dengan isu serantau kini"
    id: "Mengaitkan peristiwa lalu dengan isu kawasan kini"
    hi: "पुरानी घटनाओं को आज के क्षेत्रीय मुद्दों से जोड़ना"
