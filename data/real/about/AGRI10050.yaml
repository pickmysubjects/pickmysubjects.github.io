code: AGRI10050
year: 2026
learn:
  en: "Biology for farming: cells, microbes and soil health, crop and animal systems, evolution and ecology."
  zh: "农业中的生物学：细胞、微生物与土壤健康、作物与动物系统、进化和生态。"
  zh-TW: "農業中的生物學：細胞、微生物與土壤健康、作物與動物系統、演化和生態。"
  ja: "農業のための生物学：細胞、微生物と土壌、作物と家畜のしくみ、進化と生態。"
  ko: "농업을 위한 생물학: 세포, 미생물과 토양 건강, 작물·가축 체계, 진화와 생태."
  vi: "Sinh học cho nông nghiệp: tế bào, vi sinh vật và đất, cây trồng, vật nuôi, tiến hóa và sinh thái."
  ms: "Biologi untuk pertanian: sel, mikrob dan kesihatan tanah, tanaman, haiwan, evolusi dan ekologi."
  id: "Biologi untuk pertanian: sel, mikroba dan kesehatan tanah, tanaman, ternak, evolusi dan ekologi."
  hi: "कृषि के लिए जीवविज्ञान: कोशिकाएँ, सूक्ष्मजीव और मिट्टी, फसल और पशु तंत्र, विकास और पारिस्थितिकी।"
outcomes:
  - en: "Explain cell biology in a farming context"
    zh: "在农业情境中解释细胞生物学"
    zh-TW: "在農業情境中解釋細胞生物學"
    ja: "農業の文脈で細胞生物学を説明する"
    ko: "농업 맥락에서 세포생물학을 설명한다"
    vi: "Giải thích sinh học tế bào trong bối cảnh nông nghiệp"
    ms: "Terangkan biologi sel dalam konteks pertanian"
    id: "Menjelaskan biologi sel dalam konteks pertanian"
    hi: "कृषि संदर्भ में कोशिका जीवविज्ञान समझाएँ"
  - en: "Describe crop growth and animal systems"
    zh: "描述作物生长与动物系统"
    zh-TW: "描述作物生長與動物系統"
    ja: "作物の生育と家畜のしくみを説明する"
    ko: "작물 생장과 동물 체계를 설명한다"
    vi: "Mô tả sự phát triển cây trồng và hệ thống động vật"
    ms: "Huraikan pertumbuhan tanaman dan sistem haiwan"
    id: "Menjelaskan pertumbuhan tanaman dan sistem hewan"
    hi: "फसल वृद्धि और पशु तंत्रों का वर्णन करें"
