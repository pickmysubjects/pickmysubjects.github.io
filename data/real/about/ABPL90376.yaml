code: ABPL90376
year: 2027
learn:
  en: "The final urban design studio of the Master of Urban Design, where you develop an original research-based project."
  zh: "城市设计硕士的毕业设计课，完成一个基于研究的原创项目。"
  zh-TW: "城市設計碩士的畢業設計課，完成一個基於研究的原創專案。"
  ja: "都市デザイン修士の最終スタジオで、研究に基づく独自のプロジェクトをまとめる。"
  ko: "도시설계 석사의 마지막 스튜디오로, 연구 기반의 독창적 프로젝트를 완성합니다."
  vi: "Studio cuối của Thạc sĩ Thiết kế Đô thị: phát triển một dự án nguyên bản dựa trên nghiên cứu."
  ms: "Studio akhir Sarjana Reka Bentuk Bandar untuk projek asli berasaskan kajian."
  id: "Studio akhir Magister Desain Kota untuk proyek orisinal berbasis riset."
  hi: "मास्टर ऑफ़ अर्बन डिज़ाइन का अंतिम स्टूडियो, शोध-आधारित मौलिक प्रोजेक्ट।"
outcomes:
  - en: "Use design as research"
    zh: "把设计作为研究方法"
    zh-TW: "把設計作為研究方法"
    ja: "デザインを研究として用いる"
    ko: "설계를 연구로 활용하기"
    vi: "Dùng thiết kế như nghiên cứu"
    ms: "Menggunakan reka bentuk sebagai kajian"
    id: "Menggunakan desain sebagai riset"
    hi: "डिज़ाइन को शोध के रूप में अपनाना"
  - en: "Develop an urban design proposal"
    zh: "完成一个城市设计方案"
    zh-TW: "完成一個城市設計方案"
    ja: "都市デザイン案をまとめる"
    ko: "도시설계안 완성하기"
    vi: "Phát triển đề xuất thiết kế đô thị"
    ms: "Membangunkan cadangan reka bentuk bandar"
    id: "Menyusun usulan desain kota"
    hi: "शहरी डिज़ाइन प्रस्ताव बनाना"
