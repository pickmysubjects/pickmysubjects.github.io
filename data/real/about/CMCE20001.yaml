code: CMCE20001
year: 2026
learn:
  en: "A work placement at the on-campus WorkHub or an approved host, doing real business tasks with career training."
  zh: "在校内WorkHub或认可机构实习，做真实业务并接受职业培训。"
  zh-TW: "在校內WorkHub或認可機構實習，做真實業務並接受職涯培訓。"
  ja: "学内WorkHubか認定先でのインターン。実際の業務とキャリア研修。"
  ko: "교내 WorkHub나 승인된 기관에서 실제 업무와 커리어 교육을 하는 인턴십."
  vi: "Thực tập tại WorkHub trong trường hoặc nơi được duyệt, làm việc thật và được đào tạo nghề nghiệp."
  ms: "Penempatan kerja di WorkHub kampus atau hos diluluskan, buat tugas sebenar dengan latihan kerjaya."
  id: "Magang di WorkHub kampus atau tempat yang disetujui, mengerjakan tugas nyata dengan pelatihan karier."
  hi: "कैंपस के WorkHub या मंज़ूर संस्था में इंटर्नशिप, असली काम और करियर ट्रेनिंग के साथ।"
outcomes:
  - en: "Apply what you've studied to real business problems"
    zh: "把所学用于真实商业问题"
    zh-TW: "把所學用於真實商業問題"
    ja: "学んだことを実際のビジネス課題に生かす"
    ko: "배운 것을 실제 비즈니스 문제에 적용"
    vi: "Áp dụng kiến thức vào vấn đề kinh doanh thật"
    ms: "Guna ilmu yang dipelajari pada masalah perniagaan sebenar"
    id: "Menerapkan ilmu pada masalah bisnis nyata"
    hi: "पढ़ी हुई बातें असली बिज़नेस समस्याओं पर लागू करना"
  - en: "Weigh evidence from many sources to make decisions at work"
    zh: "权衡多方证据，在工作中做决定"
    zh-TW: "權衡多方證據，在工作中做決定"
    ja: "多くの情報源の根拠を比べ仕事で判断する"
    ko: "여러 출처의 근거를 따져 업무 결정 내리기"
    vi: "Cân nhắc bằng chứng từ nhiều nguồn để quyết định"
    ms: "Timbang bukti pelbagai sumber untuk buat keputusan"
    id: "Menimbang bukti dari banyak sumber untuk mengambil keputusan"
    hi: "कई स्रोतों के सबूत तौलकर काम पर फ़ैसले लेना"
  - en: "Manage yourself and handle uncertainty in a workplace"
    zh: "在职场中自我管理、应对不确定性"
    zh-TW: "在職場中自我管理、應對不確定性"
    ja: "職場で自己管理し不確実さに対処する"
    ko: "직장에서 자기관리와 불확실성 대처"
    vi: "Tự quản lý và xử lý sự mơ hồ nơi làm việc"
    ms: "Urus diri dan hadapi ketidakpastian di tempat kerja"
    id: "Mengelola diri dan menghadapi ketidakpastian di kantor"
    hi: "कार्यस्थल पर ख़ुद को संभालना और अनिश्चितता से निपटना"
