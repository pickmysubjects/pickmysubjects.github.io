code: GEOG10003
year: 2026
learn:
  en: "How young people around the world face chances and threats in education, work and politics, compared with your own life."
  zh: "世界各地的年轻人如何在教育、工作和政治中面对机会与威胁，并与自己的生活比较。"
  zh-TW: "世界各地的年輕人如何在教育、工作和政治中面對機會與威脅，並與自己的生活比較。"
  ja: "世界の若者が教育・仕事・政治でどんな機会と脅威に向き合うかを、自分の生活と比べて学ぶ。"
  ko: "세계의 젊은이들이 교육, 일, 정치에서 기회와 위협을 어떻게 마주하는지 자신의 삶과 비교해 배운다."
  vi: "Giới trẻ khắp thế giới đối mặt cơ hội và thách thức trong giáo dục, việc làm, chính trị ra sao, so với cuộc sống của bạn."
  ms: "Cara anak muda di seluruh dunia berdepan peluang dan ancaman dalam pendidikan, kerja dan politik, dibandingkan dengan hidup anda."
  id: "Cara anak muda di seluruh dunia menghadapi peluang dan ancaman dalam pendidikan, kerja, dan politik, dibandingkan dengan hidup Anda."
  hi: "दुनिया भर के युवा शिक्षा, काम और राजनीति में अवसरों और खतरों का सामना कैसे करते हैं, आपके अपने जीवन से तुलना करते हुए।"
outcomes:
  - en: "Compare youth experiences across the world"
    zh: "比较世界各地青年的经历"
    zh-TW: "比較世界各地青年的經歷"
    ja: "世界各地の若者の経験を比べる"
    ko: "세계 각지 청년의 경험 비교하기"
    vi: "So sánh trải nghiệm của giới trẻ khắp thế giới"
    ms: "Bandingkan pengalaman belia di seluruh dunia"
    id: "Membandingkan pengalaman pemuda di berbagai negara"
    hi: "दुनिया भर के युवाओं के अनुभवों की तुलना करना"
  - en: "Reflect on your own place in a global world"
    zh: "反思自己在全球中的位置"
    zh-TW: "反思自己在全球中的位置"
    ja: "グローバルな世界での自分の位置を考える"
    ko: "세계 속 자신의 위치 성찰하기"
    vi: "Suy ngẫm về vị trí của bạn trong thế giới"
    ms: "Renungkan kedudukan diri dalam dunia global"
    id: "Merefleksikan posisi diri di dunia global"
    hi: "वैश्विक दुनिया में अपनी जगह पर विचार करना"
  - en: "Discuss youth issues in education and work"
    zh: "讨论教育和就业中的青年议题"
    zh-TW: "討論教育和就業中的青年議題"
    ja: "教育と仕事における若者の問題を論じる"
    ko: "교육과 일자리의 청년 문제 논의하기"
    vi: "Thảo luận vấn đề giới trẻ trong giáo dục và việc làm"
    ms: "Bincangkan isu belia dalam pendidikan dan kerja"
    id: "Membahas isu pemuda dalam pendidikan dan kerja"
    hi: "शिक्षा और काम में युवाओं के मुद्दों पर चर्चा करना"
