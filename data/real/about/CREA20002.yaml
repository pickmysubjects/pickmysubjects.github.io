code: CREA20002
year: 2026
learn:
  en: "The science and psychology of creativity: what shapes creative people and how to grow your own creative thinking."
  zh: "创造力的科学与心理学：什么造就有创意的人，以及如何培养自己的创造力。"
  zh-TW: "創造力的科學與心理學：什麼造就有創意的人，以及如何培養自己的創造力。"
  ja: "創造性の科学と心理学。何が創造的な人を作るのか、自分の発想力をどう伸ばすか。"
  ko: "창의성의 과학과 심리학: 창의적인 사람을 만드는 요인과 내 창의력을 키우는 법."
  vi: "Khoa học và tâm lý của sáng tạo: điều gì tạo nên người sáng tạo và cách phát triển tư duy của bạn."
  ms: "Sains dan psikologi kreativiti: apa yang membentuk orang kreatif dan cara memupuk pemikiran kreatif anda."
  id: "Sains dan psikologi kreativitas: apa yang membentuk orang kreatif dan cara menumbuhkan kreativitas sendiri."
  hi: "रचनात्मकता का विज्ञान और मनोविज्ञान: रचनात्मक लोग कैसे बनते हैं और अपनी रचनात्मकता कैसे बढ़ाएँ।"
outcomes:
  - en: "Explain what conditions give rise to creativity"
    zh: "解释哪些条件会激发创造力"
    zh-TW: "解釋哪些條件會激發創造力"
    ja: "創造性を生む条件を説明する"
    ko: "창의성을 낳는 조건 설명하기"
    vi: "Giải thích điều kiện nào sinh ra sự sáng tạo"
    ms: "Terangkan keadaan yang melahirkan kreativiti"
    id: "Menjelaskan kondisi yang memunculkan kreativitas"
    hi: "समझाना कि कौन-सी परिस्थितियाँ रचनात्मकता लाती हैं"
  - en: "Analyse theories of talent, expertise and genius"
    zh: "分析关于天赋、专长和天才的理论"
    zh-TW: "分析關於天賦、專長和天才的理論"
    ja: "才能・熟達・天才に関する理論を分析する"
    ko: "재능·전문성·천재성 이론 분석하기"
    vi: "Phân tích lý thuyết về tài năng, chuyên môn và thiên tài"
    ms: "Analisis teori bakat, kepakaran dan genius"
    id: "Menganalisis teori bakat, keahlian dan kejeniusan"
    hi: "प्रतिभा, विशेषज्ञता और जीनियस के सिद्धांतों का विश्लेषण"
  - en: "Plan ways to build creativity into your own growth"
    zh: "规划把创造力融入个人成长的方法"
    zh-TW: "規劃把創造力融入個人成長的方法"
    ja: "自分の成長に創造性を取り入れる方法を考える"
    ko: "내 성장에 창의성을 더하는 방법 계획하기"
    vi: "Lên kế hoạch đưa sáng tạo vào sự phát triển bản thân"
    ms: "Rancang cara memupuk kreativiti dalam diri"
    id: "Merencanakan cara menumbuhkan kreativitas dalam diri"
    hi: "अपने विकास में रचनात्मकता लाने के तरीके बनाना"
