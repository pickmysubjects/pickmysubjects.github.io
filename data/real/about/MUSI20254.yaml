code: MUSI20254
year: 2027
learn:
  en: "Individual lessons on technique, style and interpretation, working toward a recital program on a personal study plan."
  zh: "个别辅导技巧、风格和诠释，按个人学习计划准备独奏会曲目。"
  zh-TW: "個別指導技巧、風格和詮釋，依個人學習計畫準備獨奏會曲目。"
  ja: "技術・スタイル・解釈の個人レッスンで、個別計画に沿ってリサイタルの曲目を準備する。"
  ko: "테크닉, 스타일, 해석 개인 레슨으로 개인 계획에 따라 리사이틀 프로그램 준비."
  vi: "Học riêng về kỹ thuật, phong cách và cách diễn giải, hướng tới chương trình độc tấu theo kế hoạch cá nhân."
  ms: "Kelas individu tentang teknik, gaya dan tafsiran, menuju program resital mengikut pelan peribadi."
  id: "Les individual tentang teknik, gaya, dan interpretasi, menuju program resital sesuai rencana pribadi."
  hi: "तकनीक, शैली और व्याख्या की व्यक्तिगत कक्षाएँ, निजी योजना से रिसाइटल कार्यक्रम की तैयारी।"
outcomes:
  - en: "Play recital pieces fluently, accurately and with character"
    zh: "流畅、准确且有个性地演奏曲目"
    zh-TW: "流暢、準確且有個性地演奏曲目"
    ja: "曲を流暢・正確に、個性をもって演奏する"
    ko: "레퍼토리를 유창하고 정확하게, 개성 있게 연주하기"
    vi: "Trình diễn tiết mục trôi chảy, chính xác và có cá tính"
    ms: "Persembahkan repertoir dengan lancar, tepat dan berkarakter"
    id: "Membawakan repertoar dengan lancar, akurat, dan berkarakter"
    hi: "रिपर्टॉयर को सहजता, सटीकता और भाव के साथ प्रस्तुत करना"
  - en: "Shape phrases into a coherent performance"
    zh: "塑造乐句，让演奏连贯完整"
    zh-TW: "塑造樂句，讓演奏連貫完整"
    ja: "フレーズを形づくりまとまった演奏にする"
    ko: "프레이즈를 다듬어 일관된 연주 만들기"
    vi: "Định hình câu nhạc cho màn trình diễn mạch lạc"
    ms: "Bentuk frasa menjadi persembahan yang padu"
    id: "Membentuk frasa menjadi penampilan yang utuh"
    hi: "फ़्रेज़ को आकार देकर सुसंगत प्रस्तुति बनाना"
  - en: "Co-design and present a balanced recital"
    zh: "共同设计并呈现均衡的独奏会"
    zh-TW: "共同設計並呈現均衡的獨奏會"
    ja: "バランスの取れたリサイタルを共に企画し発表する"
    ko: "균형 잡힌 리사이틀 공동 기획·발표하기"
    vi: "Cùng thiết kế và trình bày buổi độc tấu cân đối"
    ms: "Reka bersama dan persembahkan resital seimbang"
    id: "Merancang bersama dan menyajikan resital seimbang"
    hi: "संतुलित रिसाइटल मिलकर बनाना और प्रस्तुत करना"
