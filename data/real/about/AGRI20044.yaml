code: AGRI20044
year: 2026
learn:
  en: "Bacteria, viruses and fungi in farming: soil, plant and animal health, food production and lab detection."
  zh: "农业中的细菌、病毒与真菌：土壤、动植物健康、食品生产和实验室检测。"
  zh-TW: "農業中的細菌、病毒與真菌：土壤、動植物健康、食品生產和實驗室檢測。"
  ja: "農業における細菌・ウイルス・真菌：土壌や動植物の健康、食品製造、検出法。"
  ko: "농업 속 세균·바이러스·곰팡이: 토양, 동식물 건강, 식품 생산, 실험실 검출."
  vi: "Vi khuẩn, virus và nấm trong nông nghiệp: sức khỏe đất, cây trồng, vật nuôi, thực phẩm và phát hiện."
  ms: "Bakteria, virus dan kulat dalam pertanian: kesihatan tanah, tumbuhan, haiwan, makanan dan pengesanan."
  id: "Bakteri, virus dan jamur dalam pertanian: kesehatan tanah, tanaman, hewan, pangan dan deteksi lab."
  hi: "खेती में बैक्टीरिया, वायरस और कवक: मिट्टी, पौधे व पशु स्वास्थ्य, खाद्य उत्पादन और प्रयोगशाला पहचान।"
outcomes:
  - en: "Describe bacteria, fungi and virus biology"
    zh: "描述细菌、真菌和病毒的生物学"
    zh-TW: "描述細菌、真菌和病毒的生物學"
    ja: "細菌・真菌・ウイルスの生物学を説明する"
    ko: "세균, 곰팡이, 바이러스의 생물학을 설명한다"
    vi: "Mô tả sinh học của vi khuẩn, nấm và virus"
    ms: "Huraikan biologi bakteria, kulat dan virus"
    id: "Menjelaskan biologi bakteri, jamur dan virus"
    hi: "बैक्टीरिया, कवक और वायरस की जीवविज्ञान बताएँ"
  - en: "Perform basic microbiology lab techniques"
    zh: "掌握基本微生物实验技术"
    zh-TW: "執行基本微生物實驗技術"
    ja: "微生物学の基本実験手技を行う"
    ko: "기본 미생물 실험 기법을 수행한다"
    vi: "Thực hiện kỹ thuật vi sinh cơ bản"
    ms: "Jalankan teknik makmal mikrobiologi asas"
    id: "Melakukan teknik dasar laboratorium mikrobiologi"
    hi: "बुनियादी सूक्ष्मजीव विज्ञान प्रयोगशाला तकनीकें करें"
  - en: "Explain microbe roles in plant and soil health"
    zh: "解释微生物对植物和土壤健康的作用"
    zh-TW: "解釋微生物對植物和土壤健康的作用"
    ja: "植物や土壌の健康での微生物の役割を説明する"
    ko: "식물·토양 건강에서 미생물의 역할을 설명한다"
    vi: "Giải thích vai trò vi sinh vật với cây và đất"
    ms: "Terangkan peranan mikrob pada tumbuhan dan tanah"
    id: "Menjelaskan peran mikroba bagi tanaman dan tanah"
    hi: "पौधे और मिट्टी के स्वास्थ्य में सूक्ष्मजीवों की भूमिका समझाएँ"
