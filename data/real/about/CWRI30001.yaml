code: CWRI30001
year: 2026
learn:
  en: "Reading and writing novels, with a focus on openings: you read many novel beginnings and write one of your own."
  zh: "阅读与写作长篇小说，重点在开篇：阅读大量小说开头，并写出自己的小说开篇。"
  zh-TW: "閱讀與寫作長篇小說，重點在開篇：閱讀大量小說開頭，並寫出自己的小說開篇。"
  ja: "長編小説を読み書きする。特に冒頭に注目し、多くの書き出しを読んで自分の冒頭を書く。"
  ko: "장편 소설을 읽고 쓴다. 특히 도입부에 집중해 여러 시작을 읽고 자신의 도입부를 쓴다."
  vi: "Đọc và viết tiểu thuyết, tập trung vào phần mở đầu: đọc nhiều đoạn mở đầu và viết phần mở đầu của riêng bạn."
  ms: "Membaca dan menulis novel, berfokus pada pembukaan: membaca banyak permulaan novel dan menulis pembukaan anda sendiri."
  id: "Membaca dan menulis novel, berfokus pada pembuka: membaca banyak awal novel dan menulis pembuka sendiri."
  hi: "उपन्यास पढ़ना और लिखना, शुरुआत पर ख़ास ध्यान: कई उपन्यासों की शुरुआत पढ़ना और अपनी शुरुआत लिखना।"
outcomes:
  - en: "Analyse how novels open and hook readers"
    zh: "分析小说如何开篇并吸引读者"
    zh-TW: "分析小說如何開篇並吸引讀者"
    ja: "小説の書き出しが読者をどう引き込むか分析する"
    ko: "소설 도입부가 독자를 사로잡는 방식 분석하기"
    vi: "Phân tích cách tiểu thuyết mở đầu và cuốn hút người đọc"
    ms: "Analisis cara novel bermula dan menarik pembaca"
    id: "Menganalisis cara novel dibuka dan memikat pembaca"
    hi: "उपन्यास कैसे शुरू होते हैं और पाठक को कैसे बांधते हैं, विश्लेषण करना"
  - en: "Compare classic and contemporary novels"
    zh: "比较经典与当代小说"
    zh-TW: "比較經典與當代小說"
    ja: "古典と現代の小説を比べる"
    ko: "고전 소설과 현대 소설 비교하기"
    vi: "So sánh tiểu thuyết kinh điển và đương đại"
    ms: "Bandingkan novel klasik dan kontemporari"
    id: "Membandingkan novel klasik dan kontemporer"
    hi: "क्लासिक और समकालीन उपन्यासों की तुलना करना"
  - en: "Write the opening of your own novel"
    zh: "写出自己小说的开篇"
    zh-TW: "寫出自己小說的開篇"
    ja: "自分の小説の冒頭を書く"
    ko: "자기 소설의 도입부 쓰기"
    vi: "Viết phần mở đầu tiểu thuyết của bạn"
    ms: "Tulis pembukaan novel sendiri"
    id: "Menulis pembuka novel sendiri"
    hi: "अपने उपन्यास की शुरुआत लिखना"
