code: INDG20002
year: 2026
learn:
  en: "How Indigenous knowledge and ways of caring for Country can respond to today's environmental and ecological crises."
  zh: "原住民知识和照护土地的方式如何应对当今的环境与生态危机。"
  zh-TW: "原住民知識和照護土地的方式如何應對當今的環境與生態危機。"
  ja: "先住民の知識と土地を守る方法が、今の環境・生態危機にどう応えうるかを学ぶ。"
  ko: "원주민의 지식과 땅을 돌보는 방식이 오늘날 환경·생태 위기에 어떻게 대응할 수 있는지 배운다."
  vi: "Tri thức bản địa và cách chăm sóc đất đai có thể ứng phó với khủng hoảng môi trường và sinh thái ngày nay ra sao."
  ms: "Cara ilmu Orang Asal dan cara menjaga tanah boleh menangani krisis alam sekitar dan ekologi hari ini."
  id: "Cara pengetahuan adat dan cara merawat Country dapat menjawab krisis lingkungan dan ekologi saat ini."
  hi: "मूलनिवासी ज्ञान और धरती की देखभाल के तरीके आज के पर्यावरण और पारिस्थितिक संकट का जवाब कैसे दे सकते हैं।"
outcomes:
  - en: "Explain Indigenous ways of caring for Country"
    zh: "解释原住民照护土地的方式"
    zh-TW: "解釋原住民照護土地的方式"
    ja: "先住民の土地の守り方を説明する"
    ko: "원주민이 땅을 돌보는 방식 설명하기"
    vi: "Giải thích cách người bản địa chăm sóc đất đai"
    ms: "Terangkan cara Orang Asal menjaga tanah"
    id: "Menjelaskan cara masyarakat adat merawat Country"
    hi: "धरती की देखभाल के मूलनिवासी तरीके समझाना"
  - en: "Analyse forces driving ecological change"
    zh: "分析推动生态变化的因素"
    zh-TW: "分析推動生態變化的因素"
    ja: "生態系の変化を引き起こす要因を分析する"
    ko: "생태 변화를 이끄는 요인 분석하기"
    vi: "Phân tích các yếu tố thúc đẩy biến đổi sinh thái"
    ms: "Analisis faktor yang mendorong perubahan ekologi"
    id: "Menganalisis faktor pendorong perubahan ekologis"
    hi: "पारिस्थितिक बदलाव के कारणों का विश्लेषण करना"
  - en: "Assess conservation policy and its impacts"
    zh: "评估保护政策及其影响"
    zh-TW: "評估保育政策及其影響"
    ja: "保全政策とその影響を評価する"
    ko: "보전 정책과 그 영향 평가하기"
    vi: "Đánh giá chính sách bảo tồn và tác động của nó"
    ms: "Nilai dasar pemuliharaan dan kesannya"
    id: "Menilai kebijakan konservasi dan dampaknya"
    hi: "संरक्षण नीति और उसके प्रभावों का आकलन करना"
