code: ELEN90090
year: 2027
learn:
  en: "A team builds and tests an autonomous robot-style system that carries out a set task."
  zh: "以小组形式设计、制作并测试一个执行特定任务的自主系统。"
  zh-TW: "以小組形式設計、製作並測試一個執行特定任務的自主系統。"
  ja: "チームで、決められたタスクをこなす自律システムを設計・製作・試験する。"
  ko: "팀이 정해진 작업을 수행하는 자율 시스템을 설계·제작·시험합니다."
  vi: "Nhóm thiết kế, chế tạo và thử nghiệm một hệ thống tự hành thực hiện nhiệm vụ cho trước."
  ms: "Pasukan membina dan menguji sistem autonomi yang melaksanakan tugasan tertentu."
  id: "Tim membangun dan menguji sistem otonom yang menjalankan tugas tertentu."
  hi: "टीम एक तय काम करने वाली स्वायत्त प्रणाली बनाती और परखती है।"
outcomes:
  - en: "Combine embedded systems, control and signal processing in one design"
    zh: "在一个设计中结合嵌入式系统、控制和信号处理"
    zh-TW: "在一個設計中結合嵌入式系統、控制與訊號處理"
    ja: "組込み・制御・信号処理を一つの設計にまとめる"
    ko: "임베디드, 제어, 신호처리를 하나의 설계로 통합하기"
    vi: "Kết hợp hệ nhúng, điều khiển và xử lý tín hiệu trong một thiết kế"
    ms: "Menggabungkan sistem terbenam, kawalan dan pemprosesan isyarat dalam satu reka bentuk"
    id: "Menggabungkan sistem tertanam, kendali, dan pemrosesan sinyal dalam satu desain"
    hi: "एक डिज़ाइन में एम्बेडेड सिस्टम, कंट्रोल और सिग्नल प्रोसेसिंग जोड़ना"
  - en: "Prototype, build and test with sensors, motors and cameras"
    zh: "用传感器、电机和摄像头制作原型并测试"
    zh-TW: "用感測器、馬達與攝影機製作原型並測試"
    ja: "センサー・モーター・カメラで試作し試験する"
    ko: "센서, 모터, 카메라로 시제품 제작 및 시험하기"
    vi: "Làm mẫu thử, chế tạo và kiểm tra với cảm biến, động cơ, camera"
    ms: "Membuat prototaip, membina dan menguji dengan penderia, motor dan kamera"
    id: "Membuat prototipe, membangun, dan menguji dengan sensor, motor, dan kamera"
    hi: "सेंसर, मोटर और कैमरे से प्रोटोटाइप बनाना और परखना"
  - en: "Present the project in reports, talks and videos"
    zh: "通过报告、演讲和视频展示项目"
    zh-TW: "透過報告、簡報與影片展示專題"
    ja: "レポート・発表・動画でプロジェクトを伝える"
    ko: "보고서, 발표, 영상으로 프로젝트 소개하기"
    vi: "Trình bày dự án qua báo cáo, thuyết trình và video"
    ms: "Membentangkan projek melalui laporan, pembentangan dan video"
    id: "Menyajikan proyek lewat laporan, presentasi, dan video"
    hi: "रिपोर्ट, प्रस्तुति और वीडियो से प्रोजेक्ट दिखाना"
