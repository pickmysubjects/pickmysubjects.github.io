code: DRAM20029
year: 2026
learn:
  en: "Studio classes on the actor's instrument: voice, movement and contemporary acting methods for flexible, transformative character work."
  zh: "演员“乐器”的训练：声音、形体与当代表演方法，让角色塑造更灵活多变。"
  zh-TW: "演員「樂器」的訓練：聲音、肢體與當代表演方法，讓角色塑造更靈活多變。"
  ja: "俳優という楽器の訓練：声・動き・現代の演技法で柔軟に役を変える。"
  ko: "배우의 악기 훈련: 목소리, 움직임, 현대 연기법으로 유연하게 인물을 바꾼다."
  vi: "Rèn 'nhạc cụ' của diễn viên: giọng, hình thể và phương pháp diễn đương đại để nhập vai linh hoạt."
  ms: "Kelas studio alat pelakon: suara, gerak dan kaedah lakonan semasa untuk watak yang fleksibel."
  id: "Kelas studio instrumen aktor: suara, gerak dan metode akting kontemporer untuk tokoh yang lentur."
  hi: "अभिनेता के 'वाद्य' की स्टूडियो क्लास: आवाज़, गति और समकालीन अभिनय विधियाँ ताकि किरदार लचीले बनें।"
outcomes:
  - en: "Build vocal and physical flexibility"
    zh: "提升声音与身体的灵活性"
    zh-TW: "提升聲音與身體的靈活性"
    ja: "声と身体の柔軟性を高める"
    ko: "목소리와 몸의 유연성 키우기"
    vi: "Tăng độ linh hoạt của giọng và cơ thể"
    ms: "Bina kelenturan suara dan fizikal"
    id: "Membangun kelenturan suara dan fisik"
    hi: "आवाज़ और शरीर का लचीलापन बढ़ाना"
  - en: "Create a character through improvisation"
    zh: "通过即兴创造角色"
    zh-TW: "透過即興創造角色"
    ja: "即興で役を作る"
    ko: "즉흥으로 인물 만들기"
    vi: "Tạo nhân vật qua ứng tác"
    ms: "Cipta watak melalui improvisasi"
    id: "Menciptakan tokoh lewat improvisasi"
    hi: "इम्प्रोवाइज़ेशन से किरदार गढ़ना"
  - en: "Perform a scene joining voice and movement"
    zh: "演一场结合声音与形体的戏"
    zh-TW: "演一場結合聲音與肢體的戲"
    ja: "声と動きを合わせた場面を演じる"
    ko: "목소리와 움직임을 합친 장면 연기하기"
    vi: "Diễn một cảnh kết hợp giọng và hình thể"
    ms: "Persembahkan babak gabungan suara dan gerak"
    id: "Mementaskan adegan dengan suara dan gerak"
    hi: "आवाज़ और गति को जोड़कर दृश्य प्रस्तुत करना"
