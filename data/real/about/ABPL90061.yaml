code: ABPL90061
year: 2027
learn:
  en: "An urban design studio: abstract design exercises building up to a major urban design proposal, reviewed by a jury."
  zh: "城市设计工作室：从抽象设计练习逐步做出一个大型城市设计方案，由评审团点评。"
  zh-TW: "都市設計工作室：從抽象設計練習逐步做出大型都市設計方案，由評審團講評。"
  ja: "都市デザインスタジオ：抽象的な課題から大きな都市デザイン提案へ。講評会あり。"
  ko: "도시설계 스튜디오: 추상 설계 과제에서 대형 도시설계안까지, 심사 크리틱."
  vi: "Studio thiết kế đô thị: bài tập trừu tượng dẫn tới một đề xuất lớn, được hội đồng nhận xét."
  ms: "Studio reka bentuk bandar: latihan abstrak membawa kepada cadangan besar yang dinilai juri."
  id: "Studio desain kota: latihan abstrak menuju usulan besar yang dinilai juri."
  hi: "शहरी डिज़ाइन स्टूडियो: अमूर्त अभ्यासों से बड़े प्रस्ताव तक, जूरी समीक्षा के साथ।"
outcomes:
  - en: "Develop and present an urban design proposal"
    zh: "提出并展示城市设计方案"
    zh-TW: "提出並展示都市設計方案"
    ja: "都市デザイン案を作り発表する"
    ko: "도시설계안 개발·발표하기"
    vi: "Phát triển và trình bày đề xuất thiết kế đô thị"
    ms: "Membangun dan membentang cadangan reka bentuk bandar"
    id: "Mengembangkan dan mempresentasikan usulan desain kota"
    hi: "शहरी डिज़ाइन प्रस्ताव बनाना और प्रस्तुत करना"
  - en: "Tell apart plans, schemes, guidelines and frameworks"
    zh: "区分规划、方案、导则和框架"
    zh-TW: "區分計畫、方案、準則與架構"
    ja: "計画・スキーム・ガイドライン・枠組みを区別する"
    ko: "계획·지침·프레임워크 구별하기"
    vi: "Phân biệt quy hoạch, hướng dẫn và khung"
    ms: "Membezakan pelan, skim, garis panduan dan rangka"
    id: "Membedakan rencana, skema, pedoman dan kerangka"
    hi: "योजनाओं, दिशानिर्देशों और ढाँचों में अंतर करना"
