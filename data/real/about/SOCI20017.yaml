code: SOCI20017
year: 2026
learn:
  en: "A sociology look at sexuality: how social norms shape what people want, linked to gender, race and identity."
  zh: "从社会学看性：社会规范如何塑造个人偏好，并与性别、种族和身份相连。"
  zh-TW: "從社會學看性：社會規範如何形塑個人偏好，並與性別、種族和身分相連。"
  ja: "社会学からみたセクシュアリティ。社会規範が好みをどう形づくり、ジェンダー・人種・アイデンティティとどう関わるか。"
  ko: "사회학으로 보는 섹슈얼리티, 사회 규범이 개인의 선호를 어떻게 만들고 젠더·인종·정체성과 어떻게 얽히는지 배운다."
  vi: "Góc nhìn xã hội học về tính dục: chuẩn mực xã hội định hình sở thích ra sao, gắn với giới, chủng tộc và bản sắc."
  ms: "Seksualiti dari sudut sosiologi: cara norma sosial membentuk keinginan, berkait dengan gender, kaum dan identiti."
  id: "Seksualitas dari sudut sosiologi: cara norma sosial membentuk preferensi, terkait gender, ras, dan identitas."
  hi: "समाजशास्त्र से यौनिकता: सामाजिक मानदंड पसंद को कैसे आकार देते हैं, और जेंडर, नस्ल व पहचान से इसका संबंध।"
outcomes:
  - en: "Use a sociological approach to sexuality"
    zh: "用社会学方法看待性"
    zh-TW: "用社會學方法看待性"
    ja: "セクシュアリティを社会学的にとらえる"
    ko: "섹슈얼리티를 사회학적으로 바라보기"
    vi: "Tiếp cận tính dục theo hướng xã hội học"
    ms: "Gunakan pendekatan sosiologi terhadap seksualiti"
    id: "Menggunakan pendekatan sosiologi untuk seksualitas"
    hi: "यौनिकता को समाजशास्त्रीय नज़रिए से देखना"
  - en: "Apply sociological concepts to real examples"
    zh: "把社会学概念应用到真实例子上"
    zh-TW: "把社會學概念應用到真實例子上"
    ja: "社会学の概念を実例に当てはめる"
    ko: "사회학 개념을 실제 사례에 적용하기"
    vi: "Áp dụng khái niệm xã hội học vào ví dụ thực tế"
    ms: "Aplikasikan konsep sosiologi pada contoh sebenar"
    id: "Menerapkan konsep sosiologi pada contoh nyata"
    hi: "समाजशास्त्रीय अवधारणाओं को असली उदाहरणों पर लागू करना"
  - en: "Argue a position in debates about sexuality"
    zh: "在有关性的争论中论证自己的立场"
    zh-TW: "在有關性的爭論中論證自己的立場"
    ja: "セクシュアリティをめぐる論争で自分の立場を論じる"
    ko: "섹슈얼리티 논쟁에서 자기 입장 논증하기"
    vi: "Lập luận cho quan điểm của mình trong tranh luận về tính dục"
    ms: "Pertahankan pendirian dalam perdebatan tentang seksualiti"
    id: "Mempertahankan sikap dalam perdebatan soal seksualitas"
    hi: "यौनिकता पर बहसों में अपना पक्ष तर्क के साथ रखना"
