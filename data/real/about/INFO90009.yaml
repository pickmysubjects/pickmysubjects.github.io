code: INFO90009
year: 2027
learn:
  en: "A hands-on, industry-style UX project: research stakeholders, explore ideas, prototype and evaluate a design."
  zh: "实践型行业UX项目：调研相关方、探索方案、制作原型并评估设计。"
  zh-TW: "實作型業界UX專題：調查利害關係人、探索方案、製作原型並評估設計。"
  ja: "実務型のUXプロジェクト：関係者調査、アイデア検討、試作、評価。"
  ko: "실무형 UX 프로젝트: 이해관계자 조사, 아이디어 탐색, 프로토타입, 평가."
  vi: "Dự án UX thực tế theo kiểu doanh nghiệp: tìm hiểu các bên liên quan, ý tưởng, nguyên mẫu, đánh giá."
  ms: "Projek UX amali gaya industri: kaji pihak berkepentingan, teroka idea, buat prototaip dan nilai."
  id: "Proyek UX praktis gaya industri: riset pemangku kepentingan, eksplorasi ide, prototipe, evaluasi."
  hi: "इंडस्ट्री जैसा व्यावहारिक UX प्रोजेक्ट: हितधारक रिसर्च, आइडिया, प्रोटोटाइप और मूल्यांकन।"
outcomes:
  - en: "Run a full UX design process on a real brief"
    zh: "在真实需求上完成完整UX设计流程"
    zh-TW: "在真實需求上完成完整UX設計流程"
    ja: "実際の課題でUX設計の全工程を回す"
    ko: "실제 과제로 UX 설계 전 과정 수행하기"
    vi: "Thực hiện trọn quy trình UX trên đề bài thật"
    ms: "Menjalankan proses reka bentuk UX penuh untuk projek sebenar"
    id: "Menjalankan proses UX lengkap pada brief nyata"
    hi: "असली ब्रीफ़ पर पूरी UX प्रक्रिया चलाना"
  - en: "Present design work and deliverables to stakeholders"
    zh: "向相关方展示设计成果"
    zh-TW: "向利害關係人展示設計成果"
    ja: "関係者に設計成果を発表する"
    ko: "이해관계자에게 디자인 결과물 발표하기"
    vi: "Trình bày sản phẩm thiết kế cho các bên liên quan"
    ms: "Membentangkan hasil reka bentuk kepada pihak berkepentingan"
    id: "Mempresentasikan hasil desain ke pemangku kepentingan"
    hi: "हितधारकों के सामने डिज़ाइन काम प्रस्तुत करना"
