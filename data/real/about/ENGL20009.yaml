code: ENGL20009
year: 2026
learn:
  en: "150 years of Australian literature and the competing stories it tells about the nation, including Indigenous and migrant ones."
  zh: "150年澳大利亚文学，以及其中关于国家的不同叙事，包括原住民和移民的故事。"
  zh-TW: "150年澳洲文學，以及其中關於國家的不同敘事，包括原住民和移民的故事。"
  ja: "150年のオーストラリア文学と、先住民や移民の物語を含む国をめぐる様々な語りを学ぶ。"
  ko: "150년 호주 문학과, 원주민·이민자 이야기를 포함한 국가에 관한 여러 서사를 배운다."
  vi: "150 năm văn học Úc và những câu chuyện khác nhau về quốc gia, gồm cả câu chuyện người bản địa và di dân."
  ms: "150 tahun sastera Australia dan kisah bersaing tentang negara itu, termasuk kisah Orang Asli dan pendatang."
  id: "150 tahun sastra Australia dan kisah-kisah yang bersaing tentang bangsa, termasuk kisah Pribumi dan migran."
  hi: "ऑस्ट्रेलियाई साहित्य के 150 साल और राष्ट्र के बारे में उसकी अलग-अलग कहानियां, मूलनिवासी और प्रवासी कहानियों समेत।"
outcomes:
  - en: "Describe major periods of Australian literature"
    zh: "描述澳大利亚文学的主要时期"
    zh-TW: "描述澳洲文學的主要時期"
    ja: "オーストラリア文学の主な時代を説明する"
    ko: "호주 문학의 주요 시기 설명하기"
    vi: "Mô tả các giai đoạn chính của văn học Úc"
    ms: "Huraikan zaman utama sastera Australia"
    id: "Menguraikan periode utama sastra Australia"
    hi: "ऑस्ट्रेलियाई साहित्य के मुख्य दौर बताना"
  - en: "Analyse how texts imagine the nation"
    zh: "分析作品如何想象国家"
    zh-TW: "分析作品如何想像國家"
    ja: "作品が国をどう描くか分析する"
    ko: "작품이 국가를 상상하는 방식 분석하기"
    vi: "Phân tích cách tác phẩm hình dung quốc gia"
    ms: "Analisis cara teks membayangkan negara"
    id: "Menganalisis cara teks membayangkan bangsa"
    hi: "पाठ राष्ट्र की कल्पना कैसे करते हैं, विश्लेषण करना"
  - en: "Discuss Indigenous and migrant voices in literature"
    zh: "讨论文学中原住民和移民的声音"
    zh-TW: "討論文學中原住民和移民的聲音"
    ja: "文学における先住民と移民の声を論じる"
    ko: "문학 속 원주민과 이민자의 목소리 논의하기"
    vi: "Thảo luận tiếng nói người bản địa và di dân trong văn học"
    ms: "Bincangkan suara Orang Asli dan pendatang dalam sastera"
    id: "Membahas suara Pribumi dan migran dalam sastra"
    hi: "साहित्य में मूलनिवासी और प्रवासी आवाज़ों पर चर्चा करना"
