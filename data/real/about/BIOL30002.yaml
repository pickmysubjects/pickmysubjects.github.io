code: BIOL30002
year: 2026
learn:
  en: "A hands-on lab project on animal hormone and reproductive systems, from hypothesis to written paper."
  zh: "动物激素和生殖系统的实验项目，从提出假设到写成论文。"
  zh-TW: "動物激素和生殖系統的實驗專題，從提出假設到寫成論文。"
  ja: "動物のホルモンと生殖系に関する実験プロジェクト。仮説から論文執筆まで。"
  ko: "동물 호르몬·생식계 실습 프로젝트. 가설 설정부터 논문 작성까지."
  vi: "Dự án thí nghiệm thực hành về hormone và hệ sinh sản động vật, từ giả thuyết đến bài viết."
  ms: "Projek makmal praktikal tentang hormon dan sistem pembiakan haiwan, dari hipotesis hingga kertas bertulis."
  id: "Proyek lab praktik tentang hormon dan sistem reproduksi hewan, dari hipotesis sampai makalah."
  hi: "जानवरों के हार्मोन व प्रजनन तंत्र पर प्रैक्टिकल लैब प्रोजेक्ट, हाइपोथीसिस से लिखित पेपर तक।"
outcomes:
  - en: "Design and run an animal physiology experiment"
    zh: "设计并完成动物生理实验"
    zh-TW: "設計並完成動物生理實驗"
    ja: "動物生理学の実験を計画・実施する"
    ko: "동물 생리학 실험 설계하고 수행하기"
    vi: "Thiết kế và làm thí nghiệm sinh lý động vật"
    ms: "Reka dan jalankan eksperimen fisiologi haiwan"
    id: "Merancang dan menjalankan eksperimen fisiologi hewan"
    hi: "एनिमल फ़िज़ियोलॉजी प्रयोग डिज़ाइन करके चलाना"
  - en: "Discuss the issues in using animals in research"
    zh: "讨论用动物做实验的问题"
    zh-TW: "討論用動物做實驗的問題"
    ja: "研究で動物を使うことの問題を議論する"
    ko: "연구에 동물을 쓰는 문제 논의하기"
    vi: "Thảo luận vấn đề dùng động vật trong nghiên cứu"
    ms: "Bincang isu penggunaan haiwan dalam kajian"
    id: "Membahas isu penggunaan hewan dalam riset"
    hi: "रिसर्च में जानवरों के इस्तेमाल के मुद्दों पर चर्चा"
  - en: "Write up results as a scientific paper"
    zh: "把结果写成科学论文"
    zh-TW: "把結果寫成科學論文"
    ja: "結果を科学論文にまとめる"
    ko: "결과를 과학 논문으로 작성하기"
    vi: "Viết kết quả thành bài báo khoa học"
    ms: "Tulis keputusan sebagai kertas saintifik"
    id: "Menulis hasil sebagai makalah ilmiah"
    hi: "नतीजों को वैज्ञानिक पेपर में लिखना"
