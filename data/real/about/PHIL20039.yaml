code: PHIL20039
year: 2026
learn:
  en: "Is the world as it seems, or shaped by our minds? Realism and idealism, personal identity, and the nature of time, using texts and films."
  zh: "世界真如我们所见，还是由心灵塑造？借助文本和电影探讨实在论与观念论、人格同一性和时间的本质。"
  zh-TW: "世界真如我們所見，還是由心靈塑造？藉助文本和電影探討實在論與觀念論、人格同一性和時間的本質。"
  ja: "世界は見たとおりか、心が形作るのか。実在論と観念論、人格の同一性、時間の本性を、文章や映画で考える。"
  ko: "세계는 보이는 그대로인가, 마음이 만드는가. 실재론과 관념론, 인격 동일성, 시간의 본성을 글과 영화로 탐구한다."
  vi: "Thế giới có như ta thấy, hay do tâm trí tạo ra? Hiện thực luận, duy tâm luận, bản sắc cá nhân và bản chất thời gian, qua sách và phim."
  ms: "Adakah dunia seperti yang kelihatan, atau dibentuk minda? Realisme dan idealisme, identiti diri dan hakikat masa, melalui teks dan filem."
  id: "Apakah dunia seperti tampaknya, atau dibentuk pikiran? Realisme dan idealisme, identitas diri, dan hakikat waktu, lewat teks dan film."
  hi: "क्या दुनिया वैसी ही है जैसी दिखती है, या मन उसे गढ़ता है? यथार्थवाद-आदर्शवाद, व्यक्तिगत पहचान और समय का स्वरूप, पाठों व फ़िल्मों से।"
outcomes:
  - en: "Compare realist and idealist views of the world"
    zh: "比较实在论和观念论的世界观"
    zh-TW: "比較實在論和觀念論的世界觀"
    ja: "実在論と観念論の世界観を比べる"
    ko: "실재론과 관념론의 세계관 비교하기"
    vi: "So sánh quan điểm hiện thực luận và duy tâm luận"
    ms: "Bandingkan pandangan realis dan idealis"
    id: "Membandingkan pandangan realis dan idealis"
    hi: "यथार्थवादी और आदर्शवादी दृष्टिकोणों की तुलना करना"
  - en: "Discuss what makes you the same person over time"
    zh: "讨论是什么让你随时间仍是同一个人"
    zh-TW: "討論是什麼讓你隨時間仍是同一個人"
    ja: "時間がたっても同じ自分である理由を議論する"
    ko: "시간이 지나도 같은 사람인 이유 토론하기"
    vi: "Thảo luận điều gì giữ bạn là cùng một người theo thời gian"
    ms: "Bincangkan apa yang menjadikan anda orang sama dari masa ke masa"
    id: "Membahas apa yang membuat Anda tetap orang yang sama"
    hi: "समय के साथ आप वही इंसान क्यों रहते हैं, चर्चा करना"
  - en: "Write clear philosophical arguments"
    zh: "写出清晰的哲学论证"
    zh-TW: "寫出清晰的哲學論證"
    ja: "明快な哲学的議論を書く"
    ko: "명확한 철학적 논증 쓰기"
    vi: "Viết lập luận triết học rõ ràng"
    ms: "Tulis hujah falsafah yang jelas"
    id: "Menulis argumen filsafat yang jelas"
    hi: "साफ़ दार्शनिक तर्क लिखना"
