code: ANSC30002
year: 2026
learn:
  en: "Controlling infectious disease across whole animal populations, and how animal surveillance protects human health."
  zh: "在整个动物群体中控制传染病，以及动物监测如何保护人类健康。"
  zh-TW: "在整個動物族群中控制傳染病，以及動物監測如何保護人類健康。"
  ja: "動物集団全体での感染症対策と、動物の監視が人の健康を守るしくみ。"
  ko: "동물 집단 전체의 감염병 관리와 동물 감시가 사람 건강을 지키는 방식."
  vi: "Kiểm soát bệnh truyền nhiễm trên cả đàn và cách giám sát động vật bảo vệ sức khỏe con người."
  ms: "Kawalan penyakit berjangkit dalam populasi haiwan dan cara pengawasan melindungi kesihatan manusia."
  id: "Pengendalian penyakit menular di populasi hewan dan cara surveilans hewan melindungi kesehatan manusia."
  hi: "पूरी पशु आबादी में संक्रामक रोग नियंत्रण, और पशु निगरानी से मानव स्वास्थ्य की रक्षा।"
outcomes:
  - en: "Use techniques to detect and prevent outbreaks"
    zh: "运用技术发现和预防疫情"
    zh-TW: "運用技術偵測與預防疫情"
    ja: "感染拡大を見つけて防ぐ手法を使う"
    ko: "발병을 감지하고 예방하는 기법 쓰기"
    vi: "Dùng kỹ thuật phát hiện và ngăn dịch"
    ms: "Guna teknik untuk kesan dan cegah wabak"
    id: "Memakai teknik untuk mendeteksi dan mencegah wabah"
    hi: "प्रकोप पहचानने और रोकने की तकनीकें अपनाना"
  - en: "Compare disease monitoring and control strategies"
    zh: "比较疾病监测与控制策略"
    zh-TW: "比較疾病監測與控制策略"
    ja: "病気の監視・制御の戦略を比較する"
    ko: "질병 감시·통제 전략 비교하기"
    vi: "So sánh chiến lược giám sát và kiểm soát bệnh"
    ms: "Banding strategi pemantauan dan kawalan penyakit"
    id: "Membandingkan strategi pemantauan dan pengendalian"
    hi: "रोग निगरानी और नियंत्रण रणनीतियों की तुलना"
