code: MUSI20204
year: 2026
learn:
  en: "How music and politics meet: regimes using music, protest songs and censorship, through case studies from many eras and places."
  zh: "音乐与政治：政权如何利用音乐、抗议歌曲与审查，跨时代跨文化案例。"
  zh-TW: "音樂與政治：政權如何利用音樂、抗議歌曲與審查，跨時代跨文化案例。"
  ja: "音楽と政治：体制による音楽利用、抗議歌、検閲を時代や地域の事例で学ぶ。"
  ko: "음악과 정치: 정권의 음악 이용, 저항 노래, 검열을 여러 사례로."
  vi: "Âm nhạc và chính trị: chế độ dùng âm nhạc, bài hát phản kháng, kiểm duyệt qua nhiều ví dụ."
  ms: "Muzik dan politik: rejim menggunakan muzik, lagu protes dan penapisan melalui kajian kes."
  id: "Musik dan politik: rezim memakai musik, lagu protes, dan sensor lewat studi kasus."
  hi: "संगीत और राजनीति: सत्ता द्वारा संगीत का इस्तेमाल, विरोध गीत और सेंसरशिप, कई उदाहरणों से।"
outcomes:
  - en: "Explain how music has served and resisted power"
    zh: "说明音乐如何服务或反抗权力"
    zh-TW: "說明音樂如何服務或反抗權力"
    ja: "音楽が権力に仕え、抗ってきたかを説明する"
    ko: "음악이 권력에 봉사·저항해 온 방식 설명"
    vi: "Giải thích âm nhạc phục vụ và chống lại quyền lực"
    ms: "Terangkan muzik menyokong dan menentang kuasa"
    id: "Menjelaskan musik melayani dan melawan kekuasaan"
    hi: "संगीत ने सत्ता का साथ और विरोध कैसे किया, बताना"
  - en: "Read research critically and respond in writing"
    zh: "批判性阅读研究并书面回应"
    zh-TW: "批判性閱讀研究並書面回應"
    ja: "研究文献を批判的に読み、文章で応える"
    ko: "연구를 비판적으로 읽고 글로 답하기"
    vi: "Đọc nghiên cứu có phản biện và viết phản hồi"
    ms: "Baca kajian secara kritis dan balas secara bertulis"
    id: "Membaca riset secara kritis dan menanggapinya tertulis"
    hi: "शोध को आलोचनात्मक रूप से पढ़कर लिखित जवाब देना"
  - en: "Plan and write a research essay on music"
    zh: "规划并撰写一篇音乐研究论文"
    zh-TW: "規劃並撰寫一篇音樂研究論文"
    ja: "音楽に関する研究エッセイを計画し書く"
    ko: "음악에 관한 연구 에세이 기획·작성하기"
    vi: "Lên kế hoạch và viết bài luận nghiên cứu về âm nhạc"
    ms: "Rancang dan tulis esei kajian tentang muzik"
    id: "Merancang dan menulis esai riset tentang musik"
    hi: "संगीत पर शोध निबंध की योजना बनाकर लिखना"
