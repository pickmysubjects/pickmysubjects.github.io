code: ELEN90066
year: 2027
learn:
  en: "Embedded systems: microprocessors, modelling, real-time software, interfacing with hardware, and a design project."
  zh: "嵌入式系统：微处理器、建模、实时软件、硬件接口，以及一个设计项目。"
  zh-TW: "嵌入式系統：微處理器、建模、即時軟體、硬體介面，以及一個設計專案。"
  ja: "組込みシステム：マイクロプロセッサ、モデリング、リアルタイムソフト、ハードとの接続、設計プロジェクト。"
  ko: "임베디드 시스템: 마이크로프로세서, 모델링, 실시간 소프트웨어, 하드웨어 인터페이스, 설계 프로젝트."
  vi: "Hệ thống nhúng: vi xử lý, mô hình hóa, phần mềm thời gian thực, giao tiếp phần cứng, dự án thiết kế."
  ms: "Sistem terbenam: mikropemproses, pemodelan, perisian masa nyata, antara muka perkakasan dan projek reka bentuk."
  id: "Sistem tertanam: mikroprosesor, pemodelan, perangkat lunak waktu nyata, antarmuka perangkat keras, proyek desain."
  hi: "एम्बेडेड सिस्टम: माइक्रोप्रोसेसर, मॉडलिंग, रियल-टाइम सॉफ़्टवेयर, हार्डवेयर इंटरफ़ेसिंग, डिज़ाइन प्रोजेक्ट।"
outcomes:
  - en: "Program a microprocessor to control a physical device"
    zh: "给微处理器编程以控制物理设备"
    zh-TW: "為微處理器寫程式以控制實體裝置"
    ja: "マイコンをプログラムして機器を制御する"
    ko: "마이크로프로세서를 프로그래밍해 장치 제어하기"
    vi: "Lập trình vi xử lý để điều khiển thiết bị vật lý"
    ms: "Memprogram mikropemproses untuk mengawal peranti fizikal"
    id: "Memprogram mikroprosesor untuk mengendalikan perangkat fisik"
    hi: "माइक्रोप्रोसेसर को प्रोग्राम करके भौतिक उपकरण नियंत्रित करना"
  - en: "Design, test and document an embedded system"
    zh: "设计、测试并记录一个嵌入式系统"
    zh-TW: "設計、測試並記錄一個嵌入式系統"
    ja: "組込みシステムを設計・テストし文書化する"
    ko: "임베디드 시스템을 설계·테스트·문서화하기"
    vi: "Thiết kế, kiểm thử và viết tài liệu cho hệ thống nhúng"
    ms: "Mereka bentuk, menguji dan mendokumen sistem terbenam"
    id: "Merancang, menguji, dan mendokumentasikan sistem tertanam"
    hi: "एम्बेडेड सिस्टम डिज़ाइन करना, परखना और दस्तावेज़ बनाना"
