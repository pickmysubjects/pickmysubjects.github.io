code: MUSI20025
year: 2026
learn:
  en: "Weekly lessons and instrument classes on a second instrument or voice, building to a short technical exam."
  zh: "学第二件乐器或声乐：每周个别课和器乐课，期末做简短技术考试。"
  zh-TW: "學第二件樂器或聲樂：每週個別課和器樂課，期末做簡短技術考試。"
  ja: "第二楽器・声楽を週1回のレッスンとクラスで学び、短い技術試験に臨む。"
  ko: "제2악기나 성악을 매주 레슨과 클래스로 배우고 짧은 기술 시험을 본다."
  vi: "Học nhạc cụ thứ hai hoặc thanh nhạc qua bài học hằng tuần, kết thúc bằng bài thi kỹ thuật ngắn."
  ms: "Belajar alat muzik kedua atau vokal melalui kelas mingguan, berakhir dengan ujian teknik ringkas."
  id: "Belajar instrumen kedua atau vokal lewat les mingguan, diakhiri ujian teknik singkat."
  hi: "दूसरे वाद्य या गायन की साप्ताहिक कक्षाएँ, अंत में छोटी तकनीकी परीक्षा।"
outcomes:
  - en: "Play a short technical exam on a second instrument"
    zh: "在第二件乐器上完成简短技术考试"
    zh-TW: "在第二件樂器上完成簡短技術考試"
    ja: "第二楽器で短い技術試験を演奏する"
    ko: "제2악기로 짧은 기술 시험 연주하기"
    vi: "Hoàn thành bài thi kỹ thuật ngắn trên nhạc cụ thứ hai"
    ms: "Persembahkan ujian teknik ringkas dengan alat kedua"
    id: "Memainkan ujian teknik singkat di instrumen kedua"
    hi: "दूसरे वाद्य पर छोटी तकनीकी परीक्षा देना"
  - en: "Show solid basic craft on that instrument or voice"
    zh: "展现该乐器或声乐的扎实基本功"
    zh-TW: "展現該樂器或聲樂的紮實基本功"
    ja: "その楽器・声で確かな基礎技術を示す"
    ko: "그 악기나 목소리의 탄탄한 기본기 보여주기"
    vi: "Thể hiện kỹ năng cơ bản vững trên nhạc cụ hoặc giọng hát đó"
    ms: "Tunjukkan kemahiran asas yang kukuh"
    id: "Menunjukkan keterampilan dasar yang kuat"
    hi: "उस वाद्य या आवाज़ पर ठोस बुनियादी कौशल दिखाना"
  - en: "Judge your own progress and fix weak spots"
    zh: "评估自己的进步并改进弱点"
    zh-TW: "評估自己的進步並改進弱點"
    ja: "自分の上達を見極め弱点を直す"
    ko: "자기 발전을 평가하고 약점 고치기"
    vi: "Tự đánh giá tiến bộ và sửa điểm yếu"
    ms: "Nilai kemajuan sendiri dan baiki kelemahan"
    id: "Menilai kemajuan sendiri dan memperbaiki kelemahan"
    hi: "अपनी प्रगति आँकना और कमज़ोरियाँ सुधारना"
