code: UNIB10019
year: 2026
learn:
  en: "Tools from many fields for thinking through messy 'wicked' problems, and how knowledge is made and contested."
  zh: "借助多学科思维工具应对棘手的复杂问题，并理解知识如何产生与被质疑。"
  zh-TW: "借助多學科思維工具應對棘手的複雜問題，並理解知識如何產生與被質疑。"
  ja: "厄介な「ウィキッド・プロブレム」を考える多分野の思考ツールと、知識が生まれ争われる仕組み。"
  ko: "복잡하게 얽힌 '난제'를 생각하는 여러 학문의 도구와 지식이 만들어지고 논쟁되는 방식."
  vi: "Công cụ tư duy liên ngành cho các 'vấn đề nan giải' và cách tri thức được tạo ra, tranh luận."
  ms: "Alat pemikiran pelbagai bidang untuk masalah 'rumit', dan cara ilmu dihasilkan serta dipertikai."
  id: "Alat berpikir lintas bidang untuk masalah 'pelik', dan cara pengetahuan dibuat serta diperdebatkan."
  hi: "उलझी 'विकेड' समस्याओं पर सोचने के बहुविषयी टूल, और ज्ञान कैसे बनता व परखा जाता है।"
outcomes:
  - en: "Break down a complex problem from many angles"
    zh: "从多个角度拆解复杂问题"
    zh-TW: "從多個角度拆解複雜問題"
    ja: "複雑な問題を多角的に分解する"
    ko: "복잡한 문제를 여러 각도로 분석하기"
    vi: "Phân tích vấn đề phức tạp từ nhiều góc độ"
    ms: "Pecahkan masalah kompleks dari pelbagai sudut"
    id: "Mengurai masalah kompleks dari banyak sudut"
    hi: "जटिल समस्या को कई कोणों से समझना"
  - en: "Question how knowledge is produced and used"
    zh: "审视知识如何产生和被使用"
    zh-TW: "審視知識如何產生和被使用"
    ja: "知識の生まれ方と使われ方を問う"
    ko: "지식의 생산과 활용에 질문 던지기"
    vi: "Đặt câu hỏi về cách tri thức được tạo và dùng"
    ms: "Persoalkan cara ilmu dihasilkan dan digunakan"
    id: "Mempertanyakan cara pengetahuan dibuat dan dipakai"
    hi: "ज्ञान कैसे बनता और उपयोग होता है, इस पर सवाल करना"
  - en: "Discuss hard questions respectfully in a group"
    zh: "在小组中尊重地讨论难题"
    zh-TW: "在小組中尊重地討論難題"
    ja: "難しい問いをグループで敬意をもって話し合う"
    ko: "어려운 질문을 그룹에서 존중하며 토론하기"
    vi: "Thảo luận câu hỏi khó trong nhóm một cách tôn trọng"
    ms: "Bincang soalan sukar secara hormat dalam kumpulan"
    id: "Membahas pertanyaan sulit dengan saling menghargai"
    hi: "कठिन सवालों पर समूह में सम्मान से चर्चा करना"
