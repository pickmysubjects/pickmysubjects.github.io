code: AHIS20002
year: 2026
learn:
  en: "Australian art, including First Nations art, and the question of whether art has a nationality, from colonial times to today."
  zh: "澳大利亚艺术（包括原住民艺术），以及艺术是否有国籍的问题，从殖民时期到今天。"
  zh-TW: "澳洲藝術（包括原住民藝術），以及藝術是否有國籍的問題，從殖民時期到今天。"
  ja: "先住民の芸術を含むオーストラリア美術と、芸術に国籍はあるかという問いを植民地期から現在まで考える。"
  ko: "원주민 미술을 포함한 호주 미술과, 예술에 국적이 있는가라는 질문을 식민 시대부터 현재까지 다룬다."
  vi: "Nghệ thuật Úc, gồm cả nghệ thuật bản địa, và câu hỏi nghệ thuật có quốc tịch không, từ thời thuộc địa đến nay."
  ms: "Seni Australia, termasuk seni Orang Asli, dan persoalan sama ada seni mempunyai kewarganegaraan, dari zaman kolonial hingga kini."
  id: "Seni Australia, termasuk seni Pribumi, dan pertanyaan apakah seni punya kebangsaan, dari masa kolonial sampai kini."
  hi: "ऑस्ट्रेलियाई कला, मूलनिवासी कला समेत, और यह सवाल कि क्या कला की कोई राष्ट्रीयता होती है, औपनिवेशिक दौर से आज तक।"
outcomes:
  - en: "Describe major periods of Australian art"
    zh: "描述澳大利亚艺术的主要时期"
    zh-TW: "描述澳洲藝術的主要時期"
    ja: "オーストラリア美術の主な時代を説明する"
    ko: "호주 미술의 주요 시기 설명하기"
    vi: "Mô tả các giai đoạn chính của nghệ thuật Úc"
    ms: "Huraikan zaman utama seni Australia"
    id: "Menguraikan periode utama seni Australia"
    hi: "ऑस्ट्रेलियाई कला के मुख्य दौर बताना"
  - en: "Discuss First Nations and settler art together"
    zh: "一并讨论原住民艺术与移民定居者艺术"
    zh-TW: "一併討論原住民藝術與移民定居者藝術"
    ja: "先住民と入植者の美術を合わせて論じる"
    ko: "원주민 미술과 정착민 미술 함께 논의하기"
    vi: "Thảo luận cùng lúc nghệ thuật bản địa và của người định cư"
    ms: "Bincangkan seni Orang Asli dan peneroka bersama"
    id: "Membahas seni Pribumi dan pendatang bersama-sama"
    hi: "मूलनिवासी और बसने वालों की कला पर साथ चर्चा करना"
  - en: "Analyse how art shapes national identity"
    zh: "分析艺术如何塑造国家认同"
    zh-TW: "分析藝術如何塑造國家認同"
    ja: "美術が国のアイデンティティをどう形づくるか分析する"
    ko: "미술이 국가 정체성을 만드는 방식 분석하기"
    vi: "Phân tích nghệ thuật định hình bản sắc quốc gia ra sao"
    ms: "Analisis cara seni membentuk identiti nasional"
    id: "Menganalisis cara seni membentuk identitas nasional"
    hi: "कला राष्ट्रीय पहचान को कैसे गढ़ती है, विश्लेषण करना"
