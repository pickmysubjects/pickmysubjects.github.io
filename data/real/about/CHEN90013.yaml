code: CHEN90013
year: 2027
learn:
  en: "Feasibility studies and early design of chemical plants, including economics and safety."
  zh: "化工厂的可行性研究和初步设计，涵盖经济性与安全。"
  zh-TW: "化工廠的可行性研究與初步設計，涵蓋經濟性與安全。"
  ja: "化学プラントの事業性調査と初期設計。経済性と安全も扱う。"
  ko: "화학 공장의 타당성 조사와 초기 설계, 경제성과 안전 포함."
  vi: "Nghiên cứu khả thi và thiết kế sơ bộ nhà máy hóa chất, gồm kinh tế và an toàn."
  ms: "Kajian kebolehlaksanaan dan reka bentuk awal loji kimia, termasuk ekonomi dan keselamatan."
  id: "Studi kelayakan dan desain awal pabrik kimia, termasuk ekonomi dan keselamatan."
  hi: "केमिकल प्लांट का व्यवहार्यता अध्ययन और शुरुआती डिज़ाइन, अर्थशास्त्र और सुरक्षा सहित।"
outcomes:
  - en: "Explain the steps in designing a chemical plant"
    zh: "说明设计化工厂的步骤"
    zh-TW: "說明設計化工廠的步驟"
    ja: "化学プラント設計の手順を説明する"
    ko: "화학 공장 설계 단계 설명하기"
    vi: "Giải thích các bước thiết kế nhà máy hóa chất"
    ms: "Menerangkan langkah mereka loji kimia"
    id: "Menjelaskan langkah merancang pabrik kimia"
    hi: "केमिकल प्लांट डिज़ाइन के चरण समझाना"
  - en: "Weigh safety, sustainability and cost in design"
    zh: "在设计中兼顾安全、可持续性和成本"
    zh-TW: "在設計中兼顧安全、永續與成本"
    ja: "設計で安全・持続可能性・コストを考える"
    ko: "설계에서 안전, 지속가능성, 비용 따지기"
    vi: "Cân nhắc an toàn, bền vững và chi phí khi thiết kế"
    ms: "Menimbang keselamatan, kelestarian dan kos dalam reka bentuk"
    id: "Menimbang keselamatan, keberlanjutan, dan biaya dalam desain"
    hi: "डिज़ाइन में सुरक्षा, स्थिरता और लागत को तौलना"
  - en: "Communicate technical work in reports and talks"
    zh: "通过报告和口头汇报传达技术内容"
    zh-TW: "透過報告與口頭發表傳達技術內容"
    ja: "技術的な内容をレポートと発表で伝える"
    ko: "보고서와 발표로 기술 내용 전달하기"
    vi: "Truyền đạt nội dung kỹ thuật qua báo cáo và thuyết trình"
    ms: "Menyampaikan kerja teknikal melalui laporan dan pembentangan"
    id: "Menyampaikan isi teknis lewat laporan dan presentasi"
    hi: "रिपोर्ट और प्रस्तुति से तकनीकी काम समझाना"
