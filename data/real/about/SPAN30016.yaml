code: SPAN30016
year: 2026
learn:
  en: "Spanish for students who finished Spanish 6: major Spanish and Latin American literature, plus workplace language skills."
  zh: "适合学完西班牙语 6 的学生：西语文学名作，以及职场语言能力。"
  zh-TW: "適合學完西班牙語 6 的學生：西語文學名作，以及職場語言能力。"
  ja: "スペイン語6を終えた学生向け。スペインと中南米の主要な文学と、仕事で使う言語力。"
  ko: "스페인어 6을 마친 학생 대상. 스페인·중남미 주요 문학과 직장 언어 능력."
  vi: "Tiếng Tây Ban Nha cho ai đã học xong Spanish 6: văn học lớn của Tây Ban Nha, Mỹ Latinh và kỹ năng nơi làm việc."
  ms: "Bahasa Sepanyol untuk yang tamat Spanish 6: sastera utama Sepanyol dan Amerika Latin, serta kemahiran bahasa kerja."
  id: "Bahasa Spanyol untuk yang lulus Spanish 6: sastra utama Spanyol dan Amerika Latin, serta keterampilan bahasa kerja."
  hi: "स्पेनिश 6 पूरा कर चुके छात्रों के लिए: स्पेन व लैटिन अमेरिका का प्रमुख साहित्य और कार्यस्थल की भाषा।"
outcomes:
  - en: "Discuss social and cultural topics in Spanish"
    zh: "用西班牙语讨论社会和文化话题"
    zh-TW: "用西班牙語討論社會和文化話題"
    ja: "社会や文化の話題をスペイン語で話し合う"
    ko: "사회·문화 주제를 스페인어로 토론하기"
    vi: "Thảo luận chủ đề xã hội, văn hóa bằng tiếng Tây Ban Nha"
    ms: "Bincangkan topik sosial dan budaya dalam bahasa Sepanyol"
    id: "Membahas topik sosial dan budaya dalam bahasa Spanyol"
    hi: "सामाजिक और सांस्कृतिक विषयों पर स्पेनिश में चर्चा करना"
  - en: "Read and write longer Spanish texts"
    zh: "读写较长的西班牙语文章"
    zh-TW: "讀寫較長的西班牙語文章"
    ja: "長めのスペイン語の文章を読み書きする"
    ko: "긴 스페인어 글 읽고 쓰기"
    vi: "Đọc và viết văn bản tiếng Tây Ban Nha dài hơn"
    ms: "Baca dan tulis teks bahasa Sepanyol yang lebih panjang"
    id: "Membaca dan menulis teks bahasa Spanyol yang lebih panjang"
    hi: "लंबे स्पेनिश पाठ पढ़ना-लिखना"
  - en: "Give a clear presentation in Spanish"
    zh: "用西班牙语做清楚的口头报告"
    zh-TW: "用西班牙語做清楚的口頭報告"
    ja: "スペイン語で分かりやすく発表する"
    ko: "스페인어로 명확하게 발표하기"
    vi: "Thuyết trình rõ ràng bằng tiếng Tây Ban Nha"
    ms: "Buat pembentangan yang jelas dalam bahasa Sepanyol"
    id: "Melakukan presentasi yang jelas dalam bahasa Spanyol"
    hi: "स्पेनिश में स्पष्ट प्रस्तुति देना"
