code: DPSS30007
year: 2026
learn:
  en: "A study-abroad intensive at a major performance design festival, such as the Prague Quadrennial, in a new city each year."
  zh: "海外密集课程，参加如布拉格四年展等国际表演设计节，每年城市不同。"
  zh-TW: "海外密集課程，參加如布拉格四年展等國際表演設計節，每年城市不同。"
  ja: "プラハ・カドリエンナーレなど国際的な舞台デザイン祭に参加する海外集中講座。開催都市は毎年変わる。"
  ko: "프라하 콰드리엔날레 등 국제 공연 디자인 축제에 참가하는 해외 집중 과목. 매년 도시가 바뀐다."
  vi: "Khóa học ngắn ở nước ngoài tại lễ hội thiết kế biểu diễn lớn như Prague Quadrennial."
  ms: "Kursus intensif luar negara di festival reka bentuk persembahan seperti Prague Quadrennial."
  id: "Kursus intensif luar negeri di festival desain pertunjukan seperti Prague Quadrennial."
  hi: "विदेश में गहन कोर्स, प्राग क्वाड्रेनियल जैसे बड़े परफ़ॉर्मेंस डिज़ाइन फ़ेस्टिवल में।"
outcomes:
  - en: "See current stage design practice worldwide"
    zh: "了解全球当代舞台设计实践"
    zh-TW: "了解全球當代舞台設計實務"
    ja: "世界の最新の舞台デザインを知る"
    ko: "세계 무대 디자인의 현재 살펴보기"
    vi: "Tìm hiểu thiết kế sân khấu đương đại thế giới"
    ms: "Lihat amalan reka bentuk pentas semasa dunia"
    id: "Melihat praktik desain panggung dunia"
    hi: "दुनिया भर की मौजूदा स्टेज डिज़ाइन प्रैक्टिस देखना"
  - en: "Join festival workshops, talks and debates"
    zh: "参与展会工作坊、讲座与讨论"
    zh-TW: "參與展會工作坊、講座與討論"
    ja: "祭典のワークショップや講演、討論に参加する"
    ko: "축제 워크숍·강연·토론 참여하기"
    vi: "Tham gia hội thảo, buổi nói chuyện tại lễ hội"
    ms: "Sertai bengkel, ceramah dan debat festival"
    id: "Ikut lokakarya, ceramah dan debat festival"
    hi: "फ़ेस्टिवल की वर्कशॉप, वार्ता और बहस में भाग लेना"
  - en: "Reflect on trends shaping the field"
    zh: "反思影响该领域的趋势"
    zh-TW: "反思影響該領域的趨勢"
    ja: "分野を動かすトレンドを考察する"
    ko: "분야를 이끄는 흐름 성찰하기"
    vi: "Suy ngẫm xu hướng định hình ngành"
    ms: "Renungkan trend yang membentuk bidang ini"
    id: "Merenungkan tren yang membentuk bidang ini"
    hi: "इस क्षेत्र को आकार देने वाले रुझानों पर सोचना"
