code: ELEN90099
year: 2027
learn:
  en: "Deep learning for engineering systems: autoencoders, transformers, GANs, federated learning and graph networks, through team projects."
  zh: "通过团队项目学习工程中的深度学习：自编码器、Transformer、GAN、联邦学习等。"
  zh-TW: "透過團隊專題學習工程中的深度學習：自編碼器、Transformer、GAN、聯邦學習等。"
  ja: "チームプロジェクトで学ぶ工学のための深層学習。オートエンコーダ、Transformer、GAN、連合学習、グラフニューラルネットワーク。"
  ko: "팀 프로젝트로 배우는 공학용 딥러닝. 오토인코더, 트랜스포머, GAN, 연합학습, 그래프 신경망."
  vi: "Học sâu cho hệ thống kỹ thuật qua dự án nhóm: autoencoder, transformer, GAN, học liên kết và mạng nơ-ron đồ thị."
  ms: "Pembelajaran mendalam untuk sistem kejuruteraan melalui projek pasukan: autoencoder, transformer, GAN, pembelajaran teragih dan rangkaian graf."
  id: "Deep learning untuk sistem teknik lewat proyek tim: autoencoder, transformer, GAN, federated learning, dan graph neural network."
  hi: "टीम प्रोजेक्ट के ज़रिए इंजीनियरिंग के लिए डीप लर्निंग: ऑटोएनकोडर, ट्रांसफ़ॉर्मर, GAN, फ़ेडरेटेड लर्निंग और ग्राफ़ नेटवर्क।"
outcomes:
  - en: "Apply deep learning to sequential data from engineering systems"
    zh: "把深度学习用于工程系统的序列数据"
    zh-TW: "把深度學習用於工程系統的序列資料"
    ja: "工学システムの時系列データに深層学習を使う"
    ko: "공학 시스템의 순차 데이터에 딥러닝 적용하기"
    vi: "Áp dụng học sâu cho dữ liệu chuỗi của hệ thống kỹ thuật"
    ms: "Menggunakan pembelajaran mendalam pada data berjujukan sistem kejuruteraan"
    id: "Menerapkan deep learning pada data sekuensial sistem teknik"
    hi: "इंजीनियरिंग सिस्टम के सीक्वेंशियल डेटा पर डीप लर्निंग लागू करना"
  - en: "Use federated learning and GNNs for networked systems like IoT"
    zh: "把联邦学习和图神经网络用于物联网等系统"
    zh-TW: "把聯邦學習和圖神經網路用於物聯網等系統"
    ja: "連合学習や GNN を IoT などのネットワークシステムに使う"
    ko: "연합학습과 GNN을 IoT 같은 네트워크 시스템에 활용하기"
    vi: "Dùng học liên kết và GNN cho hệ thống mạng như IoT"
    ms: "Menggunakan pembelajaran teragih dan GNN untuk sistem rangkaian seperti IoT"
    id: "Memakai federated learning dan GNN untuk sistem jaringan seperti IoT"
    hi: "IoT जैसे नेटवर्क सिस्टम में फ़ेडरेटेड लर्निंग और GNN का उपयोग"
  - en: "Build deep learning models to detect anomalies and threats"
    zh: "构建深度学习模型检测异常和威胁"
    zh-TW: "建立深度學習模型偵測異常與威脅"
    ja: "異常や脅威を検知する深層学習モデルを作る"
    ko: "이상 및 위협 탐지용 딥러닝 모델 만들기"
    vi: "Xây dựng mô hình học sâu phát hiện bất thường và mối đe dọa"
    ms: "Membina model pembelajaran mendalam untuk mengesan anomali dan ancaman"
    id: "Membangun model deep learning untuk mendeteksi anomali dan ancaman"
    hi: "विसंगति और खतरे पकड़ने वाले डीप लर्निंग मॉडल बनाना"
