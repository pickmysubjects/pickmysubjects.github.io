code: CRIM10002
year: 2026
learn:
  en: "How law works in Australian society, focusing on who gets to call something harmful and what that means for different groups."
  zh: "法律在澳大利亚社会中如何运作，重点看谁有权把某件事定义为伤害，以及这对不同群体意味着什么。"
  zh-TW: "法律在澳洲社會中如何運作，重點看誰有權把某件事定義為傷害，以及這對不同群體意味著什麼。"
  ja: "オーストラリア社会で法がどう働くのかを、何を「害」と呼ぶ力を誰が持ち、それが集団ごとに何を意味するかに注目して学ぶ。"
  ko: "호주 사회에서 법이 어떻게 작동하는지, 누가 무엇을 '해악'이라 부를 수 있고 그것이 집단마다 어떤 의미인지 중심으로 배운다."
  vi: "Pháp luật vận hành trong xã hội Úc ra sao, tập trung vào việc ai có quyền gọi điều gì là gây hại và điều đó có ý nghĩa gì với các nhóm khác nhau."
  ms: "Cara undang-undang berfungsi dalam masyarakat Australia, berfokus pada siapa yang berhak menamakan sesuatu sebagai bahaya dan maknanya bagi kumpulan berbeza."
  id: "Cara hukum bekerja dalam masyarakat Australia, berfokus pada siapa yang berhak menyebut sesuatu berbahaya dan artinya bagi kelompok yang berbeda."
  hi: "ऑस्ट्रेलियाई समाज में कानून कैसे काम करता है, इस पर ध्यान के साथ कि किसी चीज़ को नुकसानदेह कहने का हक किसके पास है और अलग समूहों के लिए इसका क्या मतलब है।"
outcomes:
  - en: "Use key ideas from socio-legal studies"
    zh: "运用法律社会学研究的核心概念"
    zh-TW: "運用法律社會學研究的核心概念"
    ja: "法社会学の主要な考え方を使う"
    ko: "법사회학의 핵심 개념 활용하기"
    vi: "Dùng các ý chính của nghiên cứu pháp luật - xã hội"
    ms: "Guna idea utama kajian sosio-perundangan"
    id: "Memakai gagasan utama kajian sosio-legal"
    hi: "सामाजिक-कानूनी अध्ययन के मुख्य विचार इस्तेमाल करना"
  - en: "Explain how harm becomes a legal category"
    zh: "说明“伤害”如何成为法律概念"
    zh-TW: "說明「傷害」如何成為法律概念"
    ja: "「害」がどう法的な概念になるのか説明する"
    ko: "해악이 어떻게 법적 범주가 되는지 설명하기"
    vi: "Giải thích sự gây hại trở thành phạm trù pháp lý ra sao"
    ms: "Terangkan cara bahaya menjadi kategori undang-undang"
    id: "Menjelaskan cara bahaya menjadi kategori hukum"
    hi: "समझाना कि नुकसान एक कानूनी श्रेणी कैसे बनता है"
  - en: "Question who law protects and who it leaves out"
    zh: "审视法律保护了谁、忽略了谁"
    zh-TW: "審視法律保護了誰、忽略了誰"
    ja: "法が誰を守り、誰を取りこぼすのかを問う"
    ko: "법이 누구를 보호하고 누구를 놓치는지 따져 보기"
    vi: "Đặt câu hỏi luật bảo vệ ai và bỏ sót ai"
    ms: "Persoalkan siapa yang dilindungi undang-undang dan siapa yang tertinggal"
    id: "Mempertanyakan siapa yang dilindungi hukum dan siapa yang terabaikan"
    hi: "सवाल उठाना कि कानून किसकी रक्षा करता है और किसे छोड़ देता है"
