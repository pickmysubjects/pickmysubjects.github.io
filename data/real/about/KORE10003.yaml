code: KORE10003
year: 2026
learn:
  en: "After Korean 2: Korean pop culture, food, fashion and social issues, using magazines, news, music videos and dramas."
  zh: "学完韩语 2 后：通过杂志、新闻、音乐视频和韩剧了解韩国流行文化、饮食、时尚和社会议题。"
  zh-TW: "學完韓語 2 後：透過雜誌、新聞、音樂影片和韓劇了解韓國流行文化、飲食、時尚和社會議題。"
  ja: "韓国語2の続き。雑誌、ニュース、MV、ドラマで韓国の大衆文化、食、ファッション、社会問題を扱う。"
  ko: "한국어 2 다음 단계. 잡지, 뉴스, 뮤직비디오, 드라마로 한국 대중문화, 음식, 패션, 사회 문제를 다룬다."
  vi: "Sau Korean 2: văn hóa đại chúng, ẩm thực, thời trang và vấn đề xã hội Hàn Quốc qua tạp chí, tin tức, MV và phim."
  ms: "Selepas Korean 2: budaya pop, makanan, fesyen dan isu sosial Korea melalui majalah, berita, video muzik dan drama."
  id: "Setelah Korean 2: budaya pop, makanan, fesyen dan isu sosial Korea lewat majalah, berita, video musik dan drama."
  hi: "Korean 2 के बाद: पत्रिकाओं, ख़बरों, म्यूज़िक वीडियो और ड्रामा से कोरियाई पॉप संस्कृति, खाना, फ़ैशन और सामाजिक मुद्दे।"
outcomes:
  - en: "Talk about familiar topics in Korean with more confidence"
    zh: "更自信地用韩语谈论熟悉的话题"
    zh-TW: "更自信地用韓語談論熟悉的話題"
    ja: "身近な話題を韓国語でより自信を持って話す"
    ko: "익숙한 주제를 한국어로 더 자신 있게 말하기"
    vi: "Nói về chủ đề quen thuộc bằng tiếng Hàn tự tin hơn"
    ms: "Bercakap tentang topik biasa dalam bahasa Korea dengan lebih yakin"
    id: "Membicarakan topik akrab dalam bahasa Korea dengan lebih percaya diri"
    hi: "परिचित विषयों पर कोरियाई में ज़्यादा आत्मविश्वास से बात करना"
  - en: "Read and write short Korean texts"
    zh: "读写简短的韩语文章"
    zh-TW: "讀寫簡短的韓語文章"
    ja: "短い韓国語の文章を読み書きする"
    ko: "짧은 한국어 글 읽고 쓰기"
    vi: "Đọc và viết đoạn văn tiếng Hàn ngắn"
    ms: "Baca dan tulis teks pendek bahasa Korea"
    id: "Membaca dan menulis teks pendek bahasa Korea"
    hi: "छोटे कोरियाई पाठ पढ़ना-लिखना"
  - en: "Use new grammar and vocabulary correctly"
    zh: "正确运用新语法和词汇"
    zh-TW: "正確運用新文法和詞彙"
    ja: "新しい文法と語彙を正しく使う"
    ko: "새 문법과 어휘를 정확히 쓰기"
    vi: "Dùng đúng ngữ pháp và từ vựng mới"
    ms: "Guna tatabahasa dan kosa kata baharu dengan betul"
    id: "Memakai tata bahasa dan kosakata baru dengan benar"
    hi: "नया व्याकरण और शब्दावली सही इस्तेमाल करना"
