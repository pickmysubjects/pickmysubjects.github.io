code: BMEN90027
year: 2027
learn:
  en: "Modelling biochemical reactions and gene networks with differential equations in MATLAB."
  zh: "用 MATLAB 中的微分方程为生化反应和基因网络建模。"
  zh-TW: "用 MATLAB 中的微分方程為生化反應與基因網路建模。"
  ja: "MATLAB で微分方程式を使い、生化学反応と遺伝子ネットワークをモデル化する。"
  ko: "MATLAB 미분방정식으로 생화학 반응과 유전자 네트워크 모델링."
  vi: "Mô hình hóa phản ứng sinh hóa và mạng gen bằng phương trình vi phân trong MATLAB."
  ms: "Memodelkan tindak balas biokimia dan rangkaian gen dengan persamaan pembezaan dalam MATLAB."
  id: "Memodelkan reaksi biokimia dan jaringan gen dengan persamaan diferensial di MATLAB."
  hi: "MATLAB में अवकल समीकरणों से जैव-रासायनिक अभिक्रियाओं और जीन नेटवर्क का मॉडल बनाना।"
outcomes:
  - en: "Build ODE models of biochemical and enzyme reactions"
    zh: "建立生化和酶反应的常微分方程模型"
    zh-TW: "建立生化與酵素反應的常微分方程模型"
    ja: "生化学反応と酵素反応の ODE モデルを作る"
    ko: "생화학·효소 반응의 ODE 모델 만들기"
    vi: "Xây dựng mô hình ODE cho phản ứng sinh hóa và enzyme"
    ms: "Membina model ODE tindak balas biokimia dan enzim"
    id: "Membangun model ODE reaksi biokimia dan enzim"
    hi: "जैव-रासायनिक और एंजाइम अभिक्रियाओं के ODE मॉडल बनाना"
  - en: "Analyse large network models of biological systems"
    zh: "分析生物系统的大规模网络模型"
    zh-TW: "分析生物系統的大規模網路模型"
    ja: "生物システムの大規模ネットワークモデルを分析する"
    ko: "생물 시스템의 대규모 네트워크 모델 분석하기"
    vi: "Phân tích mô hình mạng lớn của hệ sinh học"
    ms: "Menganalisis model rangkaian besar sistem biologi"
    id: "Menganalisis model jaringan besar sistem biologis"
    hi: "जैविक प्रणालियों के बड़े नेटवर्क मॉडल का विश्लेषण"
