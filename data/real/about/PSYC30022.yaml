code: PSYC30022
year: 2026
learn:
  en: "Current research in personality and social psychology, building on earlier years."
  zh: "人格心理学和社会心理学的前沿研究，在前两年基础上深入。"
  zh-TW: "人格心理學和社會心理學的前沿研究，在前兩年的基礎上深入。"
  ja: "パーソナリティ心理学と社会心理学の最新研究。これまでの学年の内容を発展させる。"
  ko: "성격심리학과 사회심리학의 최신 연구, 이전 학년 내용을 바탕으로."
  vi: "Nghiên cứu hiện nay về tâm lý nhân cách và xã hội, xây trên nền các năm trước."
  ms: "Kajian terkini dalam psikologi personaliti dan sosial, berasaskan tahun-tahun sebelumnya."
  id: "Riset terkini psikologi kepribadian dan sosial, melanjutkan tahun-tahun sebelumnya."
  hi: "पर्सनैलिटी और सोशल साइकोलॉजी में मौजूदा रिसर्च, पिछले सालों की पढ़ाई पर आधारित।"
outcomes:
  - en: "Explain the main theories and findings in both fields"
    zh: "讲清两个领域的主要理论和发现"
    zh-TW: "講清兩個領域的主要理論和發現"
    ja: "両分野の主な理論と知見を説明する"
    ko: "두 분야의 주요 이론과 발견 설명"
    vi: "Giải thích lý thuyết và phát hiện chính của cả hai lĩnh vực"
    ms: "Terangkan teori dan dapatan utama kedua-dua bidang"
    id: "Menjelaskan teori dan temuan utama di kedua bidang"
    hi: "दोनों क्षेत्रों के मुख्य सिद्धांत और खोजें समझाना"
  - en: "Critically assess personality and social research"
    zh: "批判性评估相关研究"
    zh-TW: "批判性評估人格和社會心理研究"
    ja: "パーソナリティと社会心理の研究を批判的に評価する"
    ko: "성격·사회심리 연구를 비판적으로 평가"
    vi: "Đánh giá có phản biện các nghiên cứu nhân cách và xã hội"
    ms: "Nilai secara kritis kajian personaliti dan sosial"
    id: "Menilai secara kritis riset kepribadian dan sosial"
    hi: "पर्सनैलिटी व सोशल रिसर्च का आलोचनात्मक आकलन"
  - en: "Design and run a study on people and groups"
    zh: "设计并开展关于个体和群体的研究"
    zh-TW: "設計並開展關於個體和群體的研究"
    ja: "個人と集団についての研究を設計・実施する"
    ko: "개인과 집단에 관한 연구 설계·수행"
    vi: "Thiết kế và thực hiện nghiên cứu về cá nhân và nhóm"
    ms: "Reka dan jalankan kajian tentang individu dan kumpulan"
    id: "Merancang dan menjalankan studi tentang individu dan kelompok"
    hi: "लोगों और समूहों पर स्टडी डिज़ाइन करना और चलाना"
