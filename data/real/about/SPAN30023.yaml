code: SPAN30023
year: 2026
learn:
  en: "Capstone for the Spanish major: Spanish-language films as a way to deepen language and culture, and look back on your major."
  zh: "西语专业毕业课：通过西语电影深化语言和文化，并回顾整个专业学习。"
  zh-TW: "西語主修畢業課：透過西語電影深化語言和文化，並回顧整個主修學習。"
  ja: "スペイン語専攻の総仕上げ。スペイン語映画で言語と文化を深め、専攻での学びを振り返る。"
  ko: "스페인어 전공 마무리 과목. 스페인어 영화로 언어와 문화를 깊이 익히고 전공 학습을 돌아본다."
  vi: "Môn tổng kết chuyên ngành Tây Ban Nha: dùng phim nói tiếng Tây Ban Nha để hiểu sâu ngôn ngữ, văn hóa."
  ms: "Subjek penutup major Sepanyol: filem berbahasa Sepanyol untuk mendalami bahasa dan budaya serta menilai major."
  id: "Mata kuliah penutup jurusan Spanyol: film berbahasa Spanyol untuk mendalami bahasa, budaya dan menilik jurusan."
  hi: "स्पेनिश मेजर का समापन विषय: स्पेनिश-भाषी फ़िल्मों से भाषा और संस्कृति गहराना, और मेजर पर पीछे देखना।"
outcomes:
  - en: "Analyse Spanish-language films in depth"
    zh: "深入分析西语电影"
    zh-TW: "深入分析西語電影"
    ja: "スペイン語映画を深く分析する"
    ko: "스페인어 영화를 깊이 분석하기"
    vi: "Phân tích sâu phim nói tiếng Tây Ban Nha"
    ms: "Analisis filem berbahasa Sepanyol secara mendalam"
    id: "Menganalisis film berbahasa Spanyol secara mendalam"
    hi: "स्पेनिश-भाषी फ़िल्मों का गहराई से विश्लेषण करना"
  - en: "Link films to social and political stories"
    zh: "把电影与社会政治议题联系起来"
    zh-TW: "把電影與社會政治議題聯繫起來"
    ja: "映画を社会や政治の物語と結びつける"
    ko: "영화를 사회·정치 이야기와 연결하기"
    vi: "Liên hệ phim với câu chuyện xã hội, chính trị"
    ms: "Kaitkan filem dengan kisah sosial dan politik"
    id: "Mengaitkan film dengan kisah sosial dan politik"
    hi: "फ़िल्मों को सामाजिक-राजनीतिक कहानियों से जोड़ना"
  - en: "Reflect on your own language and culture learning"
    zh: "反思自己的语言和文化学习"
    zh-TW: "反思自己的語言和文化學習"
    ja: "自分の言語・文化学習を振り返る"
    ko: "자신의 언어·문화 학습 돌아보기"
    vi: "Nhìn lại quá trình học ngôn ngữ, văn hóa của mình"
    ms: "Renungkan pembelajaran bahasa dan budaya anda"
    id: "Merefleksikan pembelajaran bahasa dan budaya Anda"
    hi: "अपनी भाषा और संस्कृति की पढ़ाई पर विचार करना"
