code: SPAN30023
year: 2026
learn:
  en: "Films from Spain and Latin America: how they tell stories, and what they say about history and society."
  zh: "西班牙和拉美电影：它们如何讲故事，又如何反映历史与社会。"
  zh-TW: "西班牙和拉美電影：它們如何講故事，又如何反映歷史與社會。"
  ja: "スペインとラテンアメリカの映画。物語の語り方と、歴史や社会について語ること。"
  ko: "스페인과 라틴아메리카 영화. 이야기 방식과 역사·사회에 대해 말하는 것."
  vi: "Phim Tây Ban Nha và Mỹ Latinh: cách kể chuyện và những gì phim nói về lịch sử, xã hội."
  ms: "Filem dari Sepanyol dan Amerika Latin: cara bercerita dan apa yang dikatakan tentang sejarah dan masyarakat."
  id: "Film dari Spanyol dan Amerika Latin: cara bercerita dan apa yang dikatakan tentang sejarah dan masyarakat."
  hi: "स्पेन और लैटिन अमेरिका की फ़िल्में: वे कहानी कैसे कहती हैं और इतिहास व समाज के बारे में क्या कहती हैं।"
outcomes:
  - en: "Analyse films using basic film terms"
    zh: "用基本电影术语分析影片"
    zh-TW: "用基本電影術語分析影片"
    ja: "基本的な映画用語で作品を分析する"
    ko: "기본 영화 용어로 작품 분석하기"
    vi: "Phân tích phim bằng thuật ngữ điện ảnh cơ bản"
    ms: "Analisis filem dengan istilah filem asas"
    id: "Menganalisis film dengan istilah film dasar"
    hi: "बुनियादी फ़िल्म शब्दों से फ़िल्मों का विश्लेषण करना"
  - en: "Link films to their historical setting"
    zh: "把电影和历史背景联系起来"
    zh-TW: "把電影和歷史背景聯繫起來"
    ja: "映画を歴史的背景と結びつける"
    ko: "영화를 역사적 배경과 연결하기"
    vi: "Liên hệ phim với bối cảnh lịch sử"
    ms: "Kaitkan filem dengan latar sejarahnya"
    id: "Mengaitkan film dengan latar sejarahnya"
    hi: "फ़िल्मों को उनके ऐतिहासिक संदर्भ से जोड़ना"
  - en: "Make a short creative or research project"
    zh: "完成一个创作或研究小项目"
    zh-TW: "完成一個創作或研究小專題"
    ja: "短い創作または研究プロジェクトを作る"
    ko: "짧은 창작 또는 연구 프로젝트 만들기"
    vi: "Làm một dự án sáng tạo hoặc nghiên cứu ngắn"
    ms: "Hasilkan projek kreatif atau penyelidikan pendek"
    id: "Membuat proyek kreatif atau riset singkat"
    hi: "छोटी रचनात्मक या शोध परियोजना बनाना"
