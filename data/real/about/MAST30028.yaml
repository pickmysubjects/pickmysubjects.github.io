code: MAST30028
year: 2026
learn:
  en: "Solving maths problems on a computer: approximation, simulation, data fitting and accuracy."
  zh: "用电脑解数学问题：数值近似、模拟、数据拟合和误差。"
  zh-TW: "用電腦解數學問題：數值近似、模擬、資料擬合和誤差。"
  ja: "コンピュータで数学の問題を解く：近似、シミュレーション、データ当てはめ、精度。"
  ko: "컴퓨터로 수학 문제 풀기: 근사, 시뮬레이션, 데이터 적합, 정확도."
  vi: "Giải toán trên máy tính: xấp xỉ, mô phỏng, khớp dữ liệu và độ chính xác."
  ms: "Menyelesaikan masalah matematik dengan komputer: penghampiran, simulasi, padanan data dan ketepatan."
  id: "Menyelesaikan soal matematika di komputer: aproksimasi, simulasi, pencocokan data, dan akurasi."
  hi: "कंप्यूटर पर गणित की समस्याएँ हल करना: सन्निकटन, सिमुलेशन, डेटा फ़िटिंग और सटीकता।"
outcomes:
  - en: "Write simple numerical programs"
    zh: "写简单的数值计算程序"
    zh-TW: "寫簡單的數值計算程式"
    ja: "簡単な数値計算プログラムを書く"
    ko: "간단한 수치 계산 프로그램 작성하기"
    vi: "Viết chương trình tính toán số đơn giản"
    ms: "Menulis program berangka yang mudah"
    id: "Menulis program numerik sederhana"
    hi: "सरल न्यूमेरिकल प्रोग्राम लिखना"
  - en: "Explain roundoff and truncation errors"
    zh: "解释舍入误差和截断误差"
    zh-TW: "解釋捨入誤差和截斷誤差"
    ja: "丸め誤差と打ち切り誤差を説明する"
    ko: "반올림 오차와 절단 오차 설명하기"
    vi: "Giải thích sai số làm tròn và sai số cắt cụt"
    ms: "Menerangkan ralat pembundaran dan pemangkasan"
    id: "Menjelaskan galat pembulatan dan pemotongan"
    hi: "राउंडऑफ़ और ट्रंकेशन त्रुटियाँ समझाना"
  - en: "Pick a suitable numerical method and read its output"
    zh: "选合适的数值方法并解读结果"
    zh-TW: "選合適的數值方法並解讀結果"
    ja: "適切な数値計算法を選び結果を読む"
    ko: "알맞은 수치 방법을 고르고 결과 읽기"
    vi: "Chọn phương pháp số phù hợp và đọc kết quả"
    ms: "Memilih kaedah berangka yang sesuai dan membaca output"
    id: "Memilih metode numerik yang cocok dan membaca hasilnya"
    hi: "सही न्यूमेरिकल तरीका चुनना और आउटपुट पढ़ना"
