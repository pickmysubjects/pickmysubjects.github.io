code: POLS30033
year: 2026
learn:
  en: "The history of ideas about democracy and the problems it keeps facing, like voter ignorance, majority rule and deep disagreement."
  zh: "民主思想的发展史，以及民主一直面对的难题，比如选民无知、多数暴政和深层分歧。"
  zh-TW: "民主思想的發展史，以及民主一直面對的難題，例如選民無知、多數暴政和深層分歧。"
  ja: "民主主義をめぐる思想の歴史と、有権者の無知、多数派の専制、深い対立など、民主主義が抱え続ける難題を学ぶ。"
  ko: "민주주의 사상의 역사와 유권자의 무지, 다수의 횡포, 깊은 의견 대립처럼 민주주의가 계속 마주하는 난제를 배운다."
  vi: "Lịch sử tư tưởng về dân chủ và những vấn đề nó luôn gặp phải, như cử tri thiếu hiểu biết, chuyên chế của đa số và bất đồng sâu sắc."
  ms: "Sejarah idea tentang demokrasi dan masalah yang terus dihadapinya, seperti kejahilan pengundi, kuasa majoriti dan perselisihan mendalam."
  id: "Sejarah gagasan tentang demokrasi dan masalah yang terus dihadapinya, seperti ketidaktahuan pemilih, tirani mayoritas, dan perbedaan mendalam."
  hi: "लोकतंत्र से जुड़े विचारों का इतिहास और उसकी बार-बार आने वाली समस्याएँ, जैसे मतदाताओं की अनजानी, बहुमत की तानाशाही और गहरे मतभेद।"
outcomes:
  - en: "Explain the main theories of democracy"
    zh: "解释主要的民主理论"
    zh-TW: "解釋主要的民主理論"
    ja: "民主主義の主要な理論を説明する"
    ko: "민주주의의 주요 이론 설명하기"
    vi: "Giải thích các lý thuyết chính về dân chủ"
    ms: "Terangkan teori utama demokrasi"
    id: "Menjelaskan teori utama demokrasi"
    hi: "लोकतंत्र के मुख्य सिद्धांत समझाना"
  - en: "Analyse the lasting dilemmas of democracy"
    zh: "分析民主长期存在的困境"
    zh-TW: "分析民主長期存在的困境"
    ja: "民主主義が抱え続けるジレンマを分析する"
    ko: "민주주의의 오랜 딜레마 분석하기"
    vi: "Phân tích những tiến thoái lưỡng nan lâu dài của dân chủ"
    ms: "Analisis dilema berpanjangan demokrasi"
    id: "Menganalisis dilema demokrasi yang terus ada"
    hi: "लोकतंत्र की पुरानी दुविधाओं का विश्लेषण करना"
  - en: "Relate these ideas to politics today"
    zh: "把这些思想和当今政治联系起来"
    zh-TW: "把這些思想和當今政治連結起來"
    ja: "これらの考えを今の政治に結びつける"
    ko: "이 생각들을 오늘날 정치와 연결하기"
    vi: "Liên hệ những ý tưởng này với chính trị hiện nay"
    ms: "Kaitkan idea ini dengan politik kini"
    id: "Mengaitkan gagasan ini dengan politik masa kini"
    hi: "इन विचारों को आज की राजनीति से जोड़ना"
