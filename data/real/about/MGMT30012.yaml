code: MGMT30012
year: 2026
learn:
  en: "A team consulting project for a real client organisation, backed by lectures and workshops on consulting methods."
  zh: "为真实客户做团队咨询项目，配合咨询方法的讲座和研讨课。"
  zh-TW: "為真實客戶做團隊顧問專案，搭配顧問方法的講課和工作坊。"
  ja: "実在のクライアント組織に向けたチームでのコンサル案件。手法の講義とワークショップ付き。"
  ko: "실제 고객 조직을 위한 팀 컨설팅 프로젝트, 컨설팅 기법 강의와 워크숍 병행."
  vi: "Dự án tư vấn theo nhóm cho một tổ chức khách hàng thật, kèm bài giảng và workshop về phương pháp tư vấn."
  ms: "Projek perundingan berkumpulan untuk organisasi pelanggan sebenar, disokong kuliah dan bengkel kaedah perundingan."
  id: "Proyek konsultasi tim untuk organisasi klien nyata, didukung kuliah dan workshop metode konsultasi."
  hi: "असली क्लाइंट संगठन के लिए टीम में कंसल्टिंग प्रोजेक्ट, साथ में कंसल्टिंग तरीकों पर लेक्चर और वर्कशॉप।"
outcomes:
  - en: "Research and propose practical options for a client"
    zh: "为客户调研并提出可行方案"
    zh-TW: "為客戶研究並提出可行方案"
    ja: "クライアント向けに調査し実行可能な案を出す"
    ko: "고객을 위해 조사하고 실현 가능한 안 제시하기"
    vi: "Nghiên cứu và đề xuất phương án thực tế cho khách hàng"
    ms: "Kaji dan cadangkan pilihan praktikal untuk pelanggan"
    id: "Meneliti dan mengusulkan opsi praktis untuk klien"
    hi: "क्लाइंट के लिए रिसर्च कर व्यावहारिक विकल्प सुझाना"
  - en: "Work with partial information and tight constraints"
    zh: "在信息不全和条件受限下工作"
    zh-TW: "在資訊不全和條件受限下工作"
    ja: "不完全な情報と制約の中で仕事を進める"
    ko: "불완전한 정보와 제약 속에서 일하기"
    vi: "Làm việc với thông tin thiếu và ràng buộc chặt"
    ms: "Bekerja dengan maklumat tidak lengkap dan kekangan"
    id: "Bekerja dengan informasi tak lengkap dan batasan ketat"
    hi: "अधूरी जानकारी और सीमाओं के बीच काम करना"
  - en: "Communicate progress with a team and a client"
    zh: "与团队和客户沟通进展"
    zh-TW: "與團隊和客戶溝通進度"
    ja: "チームとクライアントに進捗を伝える"
    ko: "팀과 고객에게 진행 상황 공유하기"
    vi: "Trao đổi tiến độ với nhóm và khách hàng"
    ms: "Berkomunikasi tentang kemajuan dengan pasukan dan pelanggan"
    id: "Mengomunikasikan kemajuan dengan tim dan klien"
    hi: "टीम और क्लाइंट के साथ प्रगति साझा करना"
