code: MKTG20001
year: 2026
learn:
  en: "Why consumers buy what they do, using ideas from psychology and sociology to make marketing decisions."
  zh: "消费者为什么这样购买，借心理学和社会学的观点做营销决策。"
  zh-TW: "消費者為什麼這樣購買，借心理學和社會學的觀點做行銷決策。"
  ja: "消費者はなぜそれを買うのか。心理学や社会学の考えでマーケティング判断をする。"
  ko: "소비자가 왜 그렇게 구매하는지, 심리학·사회학 개념으로 마케팅 결정하기."
  vi: "Vì sao người tiêu dùng mua như vậy, dùng ý tưởng tâm lý học và xã hội học để ra quyết định marketing."
  ms: "Mengapa pengguna membeli sesuatu, guna idea psikologi dan sosiologi untuk keputusan pemasaran."
  id: "Mengapa konsumen membeli sesuatu, memakai gagasan psikologi dan sosiologi untuk keputusan pemasaran."
  hi: "ग्राहक जो खरीदते हैं वह क्यों खरीदते हैं, मनोविज्ञान और समाजशास्त्र से मार्केटिंग फ़ैसले लेना।"
outcomes:
  - en: "Apply consumer behaviour concepts to real cases"
    zh: "把消费者行为概念用于真实案例"
    zh-TW: "把消費者行為概念用於真實個案"
    ja: "消費者行動の概念を実際のケースに当てはめる"
    ko: "소비자 행동 개념을 실제 사례에 적용"
    vi: "Áp dụng khái niệm hành vi tiêu dùng vào tình huống thật"
    ms: "Guna konsep tingkah laku pengguna pada kes sebenar"
    id: "Menerapkan konsep perilaku konsumen pada kasus nyata"
    hi: "उपभोक्ता व्यवहार की अवधारणाएँ असली केस पर लगाना"
  - en: "Think like a marketing manager when solving problems"
    zh: "像营销经理一样思考解决问题"
    zh-TW: "像行銷經理一樣思考解決問題"
    ja: "マーケティング担当者の視点で問題を解く"
    ko: "마케팅 매니저처럼 생각하며 문제 해결"
    vi: "Suy nghĩ như quản lý marketing khi giải quyết vấn đề"
    ms: "Berfikir seperti pengurus pemasaran semasa selesaikan masalah"
    id: "Berpikir seperti manajer pemasaran saat memecahkan masalah"
    hi: "समस्या सुलझाते समय मार्केटिंग मैनेजर की तरह सोचना"
  - en: "Better understand yourself as a consumer"
    zh: "更了解作为消费者的自己"
    zh-TW: "更了解身為消費者的自己"
    ja: "消費者としての自分をよりよく知る"
    ko: "소비자로서의 자신을 더 잘 이해"
    vi: "Hiểu rõ hơn bản thân với tư cách người tiêu dùng"
    ms: "Lebih memahami diri sebagai pengguna"
    id: "Lebih memahami diri sendiri sebagai konsumen"
    hi: "एक उपभोक्ता के रूप में खुद को बेहतर समझना"
