code: AGRI10047
year: 2026
learn:
  en: "A first look at agriculture: world food supply, how Australian farming grew, and what makes farm businesses work."
  zh: "农业入门：全球粮食供需、澳洲农业的发展，以及农场经营的关键。"
  zh-TW: "農業入門：全球糧食供需、澳洲農業的發展，以及農場經營的關鍵。"
  ja: "農業への入門：世界の食料需給、オーストラリア農業の発展、農場経営の要点。"
  ko: "농업 입문: 세계 식량 수급, 호주 농업의 발전, 농장 경영이 잘되는 요인."
  vi: "Nhập môn nông nghiệp: cung cầu lương thực thế giới, nông nghiệp Úc phát triển ra sao và điều gì giúp trang trại kinh doanh tốt."
  ms: "Pengenalan pertanian: bekalan makanan dunia, perkembangan pertanian Australia dan apa yang menjayakan perniagaan ladang."
  id: "Pengantar pertanian: pasokan pangan dunia, perkembangan pertanian Australia, dan kunci sukses usaha tani."
  hi: "खेती का परिचय: दुनिया में भोजन की आपूर्ति, ऑस्ट्रेलियाई खेती का विकास और फ़ार्म बिज़नेस किस से चलता है।"
outcomes:
  - en: "Describe world food supply and demand"
    zh: "描述全球粮食的供给与需求"
    zh-TW: "描述全球糧食的供給與需求"
    ja: "世界の食料の需要と供給を説明する"
    ko: "세계 식량 수요와 공급 설명하기"
    vi: "Mô tả cung và cầu lương thực thế giới"
    ms: "Huraikan bekalan dan permintaan makanan dunia"
    id: "Menjelaskan pasokan dan permintaan pangan dunia"
    hi: "दुनिया में भोजन की माँग और आपूर्ति बताना"
  - en: "Explain what shapes farming in Australia, from climate to markets"
    zh: "解释从气候到市场有哪些因素塑造澳洲农业"
    zh-TW: "解釋從氣候到市場有哪些因素塑造澳洲農業"
    ja: "気候から市場まで、豪州農業を形づくる要因を説明する"
    ko: "기후부터 시장까지 호주 농업을 좌우하는 요인 설명하기"
    vi: "Giải thích yếu tố định hình nông nghiệp Úc, từ khí hậu đến thị trường"
    ms: "Terangkan faktor yang membentuk pertanian Australia, dari iklim ke pasaran"
    id: "Menjelaskan faktor pembentuk pertanian Australia, dari iklim hingga pasar"
    hi: "जलवायु से बाज़ार तक, ऑस्ट्रेलियाई खेती को आकार देने वाले कारण समझाना"
  - en: "Plan and report a small project on a farming topic"
    zh: "就一个农业主题完成并汇报小项目"
    zh-TW: "就一個農業主題完成並報告小專案"
    ja: "農業テーマの小さなプロジェクトを計画し報告する"
    ko: "농업 주제로 작은 프로젝트를 계획하고 보고하기"
    vi: "Lập kế hoạch và báo cáo một dự án nhỏ về nông nghiệp"
    ms: "Rancang dan laporkan projek kecil tentang pertanian"
    id: "Merencanakan dan melaporkan proyek kecil soal pertanian"
    hi: "खेती से जुड़े किसी विषय पर छोटा प्रोजेक्ट बनाना और रिपोर्ट करना"
