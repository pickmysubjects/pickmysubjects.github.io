code: MUSI20083
year: 2026
learn:
  en: "A large choir open to every voice type, singing Western choral music from the 1600s to today. Audition via Canvas; pass/fail."
  zh: "面向所有声部的大型合唱团，唱17世纪至今的西方合唱；Canvas试音，通过/不通过。"
  zh-TW: "面向所有聲部的大型合唱團，唱17世紀至今的西方合唱；Canvas試音，通過/不通過。"
  ja: "全声部に開かれた大合唱団。17世紀〜現代の西洋合唱曲。Canvasで審査、合否評価。"
  ko: "모든 성부의 대합창단. 17세기~현대 서양 합창곡. Canvas 오디션, 통과/불통과."
  vi: "Hợp xướng lớn cho mọi bè, hát nhạc hợp xướng phương Tây từ thế kỷ 17. Thử giọng qua Canvas; đạt/không."
  ms: "Koir besar untuk semua jenis suara, muzik koral Barat abad ke-17 hingga kini. Uji bakat Canvas; lulus/gagal."
  id: "Paduan suara besar untuk semua jenis suara, musik koral Barat abad ke-17 hingga kini. Audisi Canvas; lulus/tidak."
  hi: "हर आवाज़ के लिए बड़ा कॉयर: 1600 से आज तक का पश्चिमी कोरल संगीत। Canvas ऑडिशन; पास/फ़ेल।"
outcomes:
  - en: "Learn choral parts and sing them securely"
    zh: "学会合唱声部并唱得稳"
    zh-TW: "學會合唱聲部並唱得穩"
    ja: "合唱パートを覚えて確実に歌う"
    ko: "합창 파트를 익혀 안정적으로 부르기"
    vi: "Học bè hợp xướng và hát vững vàng"
    ms: "Pelajari bahagian koir dan nyanyikan dengan yakin"
    id: "Mempelajari suara paduan dan menyanyikannya dengan mantap"
    hi: "कोरल पार्ट सीखकर भरोसे से गाना"
  - en: "Work on tuning, breath and diction as a group"
    zh: "集体练习音准、气息与咬字"
    zh-TW: "集體練習音準、氣息與咬字"
    ja: "音程・呼吸・発音をみんなで整える"
    ko: "음정, 호흡, 발음을 함께 다듬기"
    vi: "Luyện cao độ, hơi thở và phát âm cùng nhóm"
    ms: "Latih nada, pernafasan dan sebutan bersama"
    id: "Melatih intonasi, napas, dan diksi bersama"
    hi: "सुर, साँस और उच्चारण पर समूह में काम करना"
  - en: "Sing in public performances under a conductor"
    zh: "在指挥带领下参加公开演出"
    zh-TW: "在指揮帶領下參加公開演出"
    ja: "指揮者のもとで公演に出る"
    ko: "지휘자와 함께 공개 공연하기"
    vi: "Hát trong buổi diễn công khai dưới tay chỉ huy"
    ms: "Menyanyi dalam persembahan awam di bawah konduktor"
    id: "Bernyanyi di pertunjukan publik bersama dirigen"
    hi: "कंडक्टर के साथ सार्वजनिक प्रस्तुति में गाना"
