code: COMP90063
year: 2027
learn:
  en: "A supervised computer science research project spread over three parts, ending in a written report."
  zh: "在导师指导下分三部分完成的计算机科学研究项目，最后提交书面报告。"
  zh-TW: "在導師指導下分三部分完成的電腦科學研究專題，最後提交書面報告。"
  ja: "指導のもと3パートにわたって進めるコンピュータサイエンス研究で、最後に報告書を書く。"
  ko: "지도교수와 함께 세 파트에 걸쳐 진행하는 컴퓨터과학 연구로, 마지막에 보고서를 쓴다."
  vi: "Dự án nghiên cứu khoa học máy tính có hướng dẫn, chia ba phần, kết thúc bằng báo cáo."
  ms: "Projek penyelidikan sains komputer berpenyelia dalam tiga bahagian, diakhiri laporan bertulis."
  id: "Proyek riset ilmu komputer terbimbing dalam tiga bagian, diakhiri laporan tertulis."
  hi: "पर्यवेक्षक के साथ तीन भागों में कंप्यूटर साइंस शोध परियोजना, अंत में लिखित रिपोर्ट।"
outcomes:
  - en: "Survey research and plan a computational experiment"
    zh: "调研文献并规划计算实验"
    zh-TW: "調研文獻並規劃計算實驗"
    ja: "先行研究を調べ計算実験を計画する"
    ko: "선행 연구 조사 및 계산 실험 계획하기"
    vi: "Khảo sát nghiên cứu và lên kế hoạch thí nghiệm tính toán"
    ms: "Meninjau kajian dan merancang eksperimen pengkomputeran"
    id: "Mengkaji riset dan merencanakan eksperimen komputasi"
    hi: "शोध सर्वेक्षण और कम्प्यूटेशनल प्रयोग की योजना"
  - en: "Run the experiment or theory work and interpret results"
    zh: "开展实验或理论研究并解读结果"
    zh-TW: "進行實驗或理論研究並解讀結果"
    ja: "実験や理論研究を行い結果を解釈する"
    ko: "실험 또는 이론 연구 수행 후 결과 해석하기"
    vi: "Thực hiện thí nghiệm hoặc lý thuyết và diễn giải kết quả"
    ms: "Menjalankan eksperimen atau kerja teori dan mentafsir hasil"
    id: "Menjalankan eksperimen atau teori dan menafsirkan hasil"
    hi: "प्रयोग या सैद्धांतिक काम करना और नतीजे समझना"
  - en: "Communicate computer science research"
    zh: "交流和汇报计算机科学研究"
    zh-TW: "交流與報告電腦科學研究"
    ja: "CS研究の内容を伝える"
    ko: "컴퓨터과학 연구 결과 전달하기"
    vi: "Truyền đạt nghiên cứu khoa học máy tính"
    ms: "Menyampaikan penyelidikan sains komputer"
    id: "Mengomunikasikan riset ilmu komputer"
    hi: "कंप्यूटर साइंस शोध को प्रस्तुत करना"
