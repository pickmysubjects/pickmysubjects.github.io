code: ECON30017
year: 2026
learn:
  en: "How hidden information and hidden actions shape contracts and incentives inside firms."
  zh: "隐藏信息和隐藏行动如何影响企业内部的合同与激励。"
  zh-TW: "隱藏資訊和隱藏行動如何影響企業內部的契約與誘因。"
  ja: "隠れた情報や行動が企業内の契約とインセンティブをどう形作るか。"
  ko: "숨겨진 정보와 행동이 기업 내 계약과 인센티브를 어떻게 좌우하는지."
  vi: "Thông tin và hành động bị che giấu định hình hợp đồng và động lực trong doanh nghiệp như thế nào."
  ms: "Bagaimana maklumat dan tindakan tersembunyi membentuk kontrak dan insentif dalam firma."
  id: "Bagaimana informasi dan tindakan tersembunyi membentuk kontrak dan insentif di dalam perusahaan."
  hi: "छिपी जानकारी और छिपे कदम कंपनियों के अंदर अनुबंध और प्रोत्साहन कैसे तय करते हैं।"
outcomes:
  - en: "Use information economics to explain contracts in firms"
    zh: "用信息经济学解释企业内的合同"
    zh-TW: "用資訊經濟學解釋企業內的契約"
    ja: "情報の経済学で企業内の契約を説明する"
    ko: "정보경제학으로 기업 내 계약 설명하기"
    vi: "Dùng kinh tế học thông tin giải thích hợp đồng trong doanh nghiệp"
    ms: "Guna ekonomi maklumat untuk terangkan kontrak dalam firma"
    id: "Memakai ekonomi informasi untuk menjelaskan kontrak di perusahaan"
    hi: "इन्फ़ॉर्मेशन इकोनॉमिक्स से कंपनी के अनुबंध समझाना"
  - en: "Analyse how a firm behaves under different contracts"
    zh: "分析不同合同结构下的企业行为"
    zh-TW: "分析不同契約結構下的企業行為"
    ja: "契約の形による企業行動の違いを分析する"
    ko: "계약 구조에 따른 기업 행동 분석하기"
    vi: "Phân tích hành vi doanh nghiệp dưới các cấu trúc hợp đồng khác nhau"
    ms: "Analisis tingkah laku firma di bawah kontrak berbeza"
    id: "Menganalisis perilaku perusahaan di bawah kontrak yang berbeda"
    hi: "अलग अनुबंधों में कंपनी के व्यवहार का विश्लेषण करना"
