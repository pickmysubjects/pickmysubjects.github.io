code: ENGL30054
year: 2026
learn:
  en: "How medieval and early modern English writers reshaped legendary and real figures into heroes and villains for their own ends."
  zh: "中世纪和近代早期英国作家如何把传说和真实人物塑造成英雄或恶人，为己所用。"
  zh-TW: "中世紀和近代早期英國作家如何把傳說和真實人物塑造成英雄或惡人，為己所用。"
  ja: "中世・近世の英国の作家が伝説や実在の人物を英雄や悪役にどう作り変え利用したかを学ぶ。"
  ko: "중세·근대 초기 영국 작가들이 전설과 실존 인물을 영웅이나 악당으로 어떻게 바꿔 활용했는지 배운다."
  vi: "Các nhà văn Anh trung cổ và đầu cận đại biến nhân vật huyền thoại và có thật thành anh hùng hay kẻ ác ra sao, vì mục đích riêng."
  ms: "Cara penulis Inggeris zaman pertengahan dan awal moden mengubah tokoh legenda dan sebenar menjadi wira atau penjahat untuk tujuan mereka."
  id: "Cara penulis Inggris abad pertengahan dan awal modern mengubah tokoh legenda dan nyata menjadi pahlawan atau penjahat demi tujuan mereka."
  hi: "मध्यकालीन और आरंभिक आधुनिक अंग्रेज़ लेखकों ने पौराणिक और असली व्यक्तियों को अपने मक़सद के लिए नायक या खलनायक कैसे बनाया।"
outcomes:
  - en: "Analyse how literature uses history and legend"
    zh: "分析文学如何运用历史与传说"
    zh-TW: "分析文學如何運用歷史與傳說"
    ja: "文学が歴史と伝説をどう使うか分析する"
    ko: "문학이 역사와 전설을 활용하는 방식 분석하기"
    vi: "Phân tích cách văn học dùng lịch sử và huyền thoại"
    ms: "Analisis cara sastera menggunakan sejarah dan legenda"
    id: "Menganalisis cara sastra memakai sejarah dan legenda"
    hi: "साहित्य इतिहास और किंवदंती का उपयोग कैसे करता है, विश्लेषण करना"
  - en: "Compare portrayals of heroes and villains"
    zh: "比较英雄与恶人的形象塑造"
    zh-TW: "比較英雄與惡人的形象塑造"
    ja: "英雄と悪役の描かれ方を比べる"
    ko: "영웅과 악당 묘사 비교하기"
    vi: "So sánh cách khắc họa anh hùng và kẻ ác"
    ms: "Bandingkan gambaran wira dan penjahat"
    id: "Membandingkan penggambaran pahlawan dan penjahat"
    hi: "नायकों और खलनायकों के चित्रण की तुलना करना"
  - en: "Link texts to their political context"
    zh: "把作品与其政治背景联系起来"
    zh-TW: "把作品與其政治背景聯繫起來"
    ja: "作品を当時の政治的文脈と結びつける"
    ko: "작품을 정치적 맥락과 연결하기"
    vi: "Liên hệ văn bản với bối cảnh chính trị"
    ms: "Kaitkan teks dengan konteks politiknya"
    id: "Mengaitkan teks dengan konteks politiknya"
    hi: "पाठों को उनके राजनीतिक संदर्भ से जोड़ना"
