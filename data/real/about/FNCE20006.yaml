code: FNCE20006
year: 2026
learn:
  en: "How financial markets, banks, super funds and regulators work, using real market data."
  zh: "金融市场、银行、养老金和监管机构如何运作，并使用真实市场数据。"
  zh-TW: "金融市場、銀行、退休基金和監理機關如何運作，並使用真實市場資料。"
  ja: "金融市場・銀行・年金基金・規制当局の仕組みを実際の市場データで学ぶ。"
  ko: "금융시장, 은행, 연금기금, 규제기관의 작동을 실제 시장 데이터로 학습."
  vi: "Thị trường tài chính, ngân hàng, quỹ hưu trí và cơ quan quản lý vận hành ra sao, dùng dữ liệu thị trường thật."
  ms: "Cara pasaran kewangan, bank, dana persaraan dan pengawal selia berfungsi, guna data pasaran sebenar."
  id: "Cara kerja pasar keuangan, bank, dana pensiun, dan regulator, memakai data pasar nyata."
  hi: "वित्तीय बाज़ार, बैंक, सुपर फ़ंड और नियामक कैसे काम करते हैं, असली बाज़ार डेटा के साथ।"
outcomes:
  - en: "Describe the main financial markets, products and regulators"
    zh: "描述主要金融市场、产品和监管机构"
    zh-TW: "描述主要金融市場、商品和監理機關"
    ja: "主な金融市場・商品・規制当局を説明する"
    ko: "주요 금융시장, 상품, 규제기관 설명"
    vi: "Mô tả các thị trường, sản phẩm và cơ quan quản lý tài chính chính"
    ms: "Huraikan pasaran, produk dan pengawal selia kewangan utama"
    id: "Menjelaskan pasar, produk, dan regulator keuangan utama"
    hi: "मुख्य वित्तीय बाज़ार, उत्पाद और नियामक बताना"
  - en: "Analyse market developments using real data and research"
    zh: "用真实数据和研究分析市场动态"
    zh-TW: "用真實資料和研究分析市場動態"
    ja: "実データと研究で市場の動きを分析する"
    ko: "실제 데이터와 연구로 시장 동향 분석"
    vi: "Phân tích diễn biến thị trường bằng dữ liệu thật và nghiên cứu"
    ms: "Analisis perkembangan pasaran guna data sebenar dan kajian"
    id: "Menganalisis perkembangan pasar dengan data nyata dan riset"
    hi: "असली डेटा और रिसर्च से बाज़ार के बदलाव परखना"
  - en: "Judge how regulation affects market participants"
    zh: "判断监管如何影响市场参与者"
    zh-TW: "判斷監理如何影響市場參與者"
    ja: "規制が市場参加者に与える影響を判断する"
    ko: "규제가 시장 참여자에게 미치는 영향 판단"
    vi: "Đánh giá quy định ảnh hưởng người tham gia thị trường ra sao"
    ms: "Nilai kesan peraturan pada peserta pasaran"
    id: "Menilai dampak regulasi pada pelaku pasar"
    hi: "नियमन का बाज़ार प्रतिभागियों पर असर आँकना"
