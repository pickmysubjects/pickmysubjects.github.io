code: MKTG90023
year: 2027
learn:
  en: "Research-level consumer behaviour theory, drawing on cognitive and social psychology."
  zh: "研究层面的消费者行为理论，借鉴认知心理学和社会心理学。"
  zh-TW: "研究層面的消費者行為理論，借鑑認知心理學和社會心理學。"
  ja: "認知心理学・社会心理学をもとに消費者行動の理論を研究レベルで学ぶ。"
  ko: "인지·사회심리학을 바탕으로 소비자 행동 이론을 연구 수준에서 탐구."
  vi: "Lý thuyết hành vi người tiêu dùng ở mức nghiên cứu, dựa trên tâm lý học nhận thức và xã hội."
  ms: "Teori tingkah laku pengguna peringkat penyelidikan, berasaskan psikologi kognitif dan sosial."
  id: "Teori perilaku konsumen tingkat riset, berdasar psikologi kognitif dan sosial."
  hi: "संज्ञानात्मक और सामाजिक मनोविज्ञान पर आधारित उपभोक्ता व्यवहार सिद्धांत।"
outcomes:
  - en: "Critically evaluate key issues in consumer behaviour"
    zh: "批判地评估消费者行为的关键问题"
    zh-TW: "批判地評估消費者行為的關鍵問題"
    ja: "消費者行動の主要課題を批判的に評価する"
    ko: "소비자 행동의 핵심 쟁점 비판적으로 평가하기"
    vi: "Đánh giá phản biện vấn đề chính của hành vi tiêu dùng"
    ms: "Menilai isu utama tingkah laku pengguna secara kritis"
    id: "Menilai isu utama perilaku konsumen secara kritis"
    hi: "उपभोक्ता व्यवहार के मुख्य मुद्दों का आलोचनात्मक मूल्यांकन"
  - en: "Develop new research ideas on consumer behaviour"
    zh: "提出消费者行为的新研究想法"
    zh-TW: "提出消費者行為的新研究構想"
    ja: "消費者行動の新しい研究アイデアを練る"
    ko: "소비자 행동의 새 연구 아이디어 개발하기"
    vi: "Phát triển ý tưởng nghiên cứu mới về người tiêu dùng"
    ms: "Membangunkan idea penyelidikan baharu tentang pengguna"
    id: "Mengembangkan ide riset baru tentang konsumen"
    hi: "उपभोक्ता व्यवहार पर नए शोध विचार विकसित करना"
