code: GEOG30024
year: 2026
learn:
  en: "Sub-Saharan Africa's environment, history and development debates, beyond media stereotypes."
  zh: "撒哈拉以南非洲的环境、历史与发展争论，超越媒体刻板印象。"
  zh-TW: "撒哈拉以南非洲的環境、歷史與發展爭論，超越媒體刻板印象。"
  ja: "サハラ以南アフリカの環境・歴史・開発の議論を、メディアの固定観念を越えて。"
  ko: "사하라 이남 아프리카의 환경·역사·개발 논쟁, 미디어 고정관념 너머로."
  vi: "Môi trường, lịch sử và tranh luận phát triển ở châu Phi hạ Sahara, vượt khỏi định kiến truyền thông."
  ms: "Alam sekitar, sejarah dan perdebatan pembangunan Afrika Sub-Sahara, melangkaui stereotaip media."
  id: "Lingkungan, sejarah, dan debat pembangunan Afrika Sub-Sahara, melampaui stereotip media."
  hi: "उप-सहारा अफ़्रीका का पर्यावरण, इतिहास और विकास बहसें, मीडिया की रूढ़ियों से आगे।"
outcomes:
  - en: "Compare approaches to development in Africa"
    zh: "比较非洲发展的不同路径"
    zh-TW: "比較非洲發展的不同路徑"
    ja: "アフリカの開発手法を比較する"
    ko: "아프리카 개발 접근법 비교하기"
    vi: "So sánh các cách tiếp cận phát triển ở châu Phi"
    ms: "Banding pendekatan pembangunan di Afrika"
    id: "Membandingkan pendekatan pembangunan di Afrika"
    hi: "अफ़्रीका में विकास के तरीकों की तुलना करना"
  - en: "Argue well-supported positions in essays"
    zh: "在论文中提出有据论点"
    zh-TW: "在論文中提出有據論點"
    ja: "根拠ある主張をレポートで述べる"
    ko: "에세이에서 근거 있는 주장 펼치기"
    vi: "Lập luận có căn cứ trong bài luận"
    ms: "Kemukakan hujah berasas dalam esei"
    id: "Menyusun argumen berdasar dalam esai"
    hi: "निबंधों में ठोस तर्क रखना"
