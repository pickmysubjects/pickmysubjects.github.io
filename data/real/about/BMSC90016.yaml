code: BMSC90016
year: 2027
learn:
  en: "Cell and gene therapies: growing, editing and scaling cells for manufacture, with real industry challenges."
  zh: "细胞与基因疗法：细胞培养、编辑与规模化生产，并处理真实的行业难题。"
  zh-TW: "細胞與基因療法：細胞培養、編輯與規模化生產，並處理真實的產業難題。"
  ja: "細胞・遺伝子治療：細胞の培養・編集・スケールアップを学び、実際の業界課題に取り組む。"
  ko: "세포·유전자 치료: 세포 배양·편집·대량 생산과 실제 산업 과제."
  vi: "Liệu pháp tế bào và gen: nuôi, chỉnh sửa và mở rộng sản xuất tế bào, với bài toán thực tế."
  ms: "Terapi sel dan gen: membiak, menyunting dan menskala sel, dengan cabaran industri sebenar."
  id: "Terapi sel dan gen: menumbuhkan, menyunting, dan menskalakan sel, dengan tantangan industri nyata."
  hi: "सेल व जीन थेरेपी: कोशिकाएँ उगाना, एडिट करना और बड़े पैमाने पर बनाना, असली उद्योग चुनौतियों के साथ।"
outcomes:
  - en: "Weigh the social and historical context of cell products"
    zh: "评估细胞产品的社会与历史背景"
    zh-TW: "評估細胞產品的社會與歷史背景"
    ja: "細胞製品の社会的・歴史的背景を評価する"
    ko: "세포 제품의 사회·역사적 맥락 평가하기"
    vi: "Đánh giá bối cảnh xã hội, lịch sử của sản phẩm tế bào"
    ms: "Menilai konteks sosial dan sejarah produk sel"
    id: "Menilai konteks sosial dan sejarah produk sel"
    hi: "सेल उत्पादों का सामाजिक व ऐतिहासिक संदर्भ आँकना"
  - en: "Assess regulatory and patient issues in gene therapy"
    zh: "评估基因治疗中的监管与患者问题"
    zh-TW: "評估基因治療中的法規與病患問題"
    ja: "遺伝子治療の規制と患者の課題を評価する"
    ko: "유전자 치료의 규제·환자 문제 평가하기"
    vi: "Đánh giá vấn đề pháp lý và bệnh nhân trong liệu pháp gen"
    ms: "Menilai isu kawal selia dan pesakit"
    id: "Menilai isu regulasi dan pasien"
    hi: "जीन थेरेपी में नियामक और मरीज़ से जुड़े मुद्दे आँकना"
  - en: "Critique cell editing and manufacturing technologies"
    zh: "评析细胞编辑与生产技术"
    zh-TW: "評析細胞編輯與生產技術"
    ja: "細胞編集と製造技術を批評する"
    ko: "세포 편집·제조 기술 비평하기"
    vi: "Phê bình công nghệ chỉnh sửa và sản xuất tế bào"
    ms: "Mengkritik teknologi penyuntingan dan pembuatan sel"
    id: "Mengkritisi teknologi penyuntingan dan produksi sel"
    hi: "सेल एडिटिंग और निर्माण तकनीकों की समीक्षा"
