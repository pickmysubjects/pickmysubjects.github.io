code: ENEN90033
year: 2027
learn:
  en: "How solar collectors and PV systems work, and designing a solar system for a real use in a team."
  zh: "太阳能集热器和光伏系统的原理，并以小组形式为实际用途设计太阳能系统。"
  zh-TW: "太陽能集熱器與太陽光電系統的原理，並以小組形式為實際用途設計太陽能系統。"
  ja: "太陽熱集熱器と太陽光発電の仕組みを学び、チームで実用途の太陽エネルギーシステムを設計する。"
  ko: "태양열 집열기와 태양광 시스템의 원리를 배우고 팀으로 실제 용도의 태양 에너지 시스템을 설계합니다."
  vi: "Cách bộ thu nhiệt mặt trời và hệ PV hoạt động, và thiết kế hệ thống năng lượng mặt trời theo nhóm."
  ms: "Cara pengumpul solar dan sistem PV berfungsi, dan mereka bentuk sistem solar untuk kegunaan sebenar secara berkumpulan."
  id: "Cara kerja kolektor surya dan sistem PV, lalu merancang sistem surya untuk kebutuhan nyata secara berkelompok."
  hi: "सोलर कलेक्टर और PV सिस्टम कैसे काम करते हैं, और टीम में किसी असली उपयोग के लिए सोलर सिस्टम डिज़ाइन करना।"
outcomes:
  - en: "Estimate how much solar energy is available at a site"
    zh: "估算某地可利用的太阳能"
    zh-TW: "估算某地可利用的太陽能"
    ja: "ある場所で使える太陽エネルギーを見積もる"
    ko: "특정 장소의 일사량 추정하기"
    vi: "Ước tính lượng năng lượng mặt trời có ở một địa điểm"
    ms: "Menganggar tenaga solar yang ada di sesuatu lokasi"
    id: "Memperkirakan energi surya yang tersedia di suatu lokasi"
    hi: "किसी स्थान पर उपलब्ध सौर ऊर्जा का अनुमान"
  - en: "Design a solar system within cost and environmental limits"
    zh: "在成本和环境约束下设计太阳能系统"
    zh-TW: "在成本與環境限制下設計太陽能系統"
    ja: "コストと環境の制約内で太陽エネルギーシステムを設計する"
    ko: "비용과 환경 제약 안에서 태양 에너지 시스템 설계하기"
    vi: "Thiết kế hệ thống mặt trời trong giới hạn chi phí và môi trường"
    ms: "Mereka bentuk sistem solar dalam had kos dan alam sekitar"
    id: "Merancang sistem surya dalam batas biaya dan lingkungan"
    hi: "लागत और पर्यावरण सीमाओं में सोलर सिस्टम डिज़ाइन करना"
