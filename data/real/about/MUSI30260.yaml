code: MUSI30260
year: 2026
learn:
  en: "A mixed voices-and-instruments group performing Renaissance music, with period instruments lent by the University."
  zh: "人声与器乐混合的团体，演奏文艺复兴音乐，古乐器由大学提供。"
  zh-TW: "人聲與器樂混合的團體，演奏文藝復興音樂，古樂器由大學提供。"
  ja: "声と楽器の混成グループでルネサンス音楽を演奏。古楽器は大学が貸与。"
  ko: "성악과 기악 혼성 그룹으로 르네상스 음악 연주. 고악기는 대학이 대여."
  vi: "Nhóm hát và nhạc cụ kết hợp diễn nhạc Phục hưng, nhạc cụ cổ do trường cho mượn."
  ms: "Kumpulan vokal dan alat muzik untuk muzik Renaissance, alat dipinjam universiti."
  id: "Grup vokal dan instrumen memainkan musik Renaisans, alat dipinjami universitas."
  hi: "आवाज़ और वाद्यों का मिश्रित समूह, पुनर्जागरण संगीत; पुराने वाद्य विश्वविद्यालय से।"
outcomes:
  - en: "Play or sing Renaissance music in style"
    zh: "以恰当风格演奏或演唱文艺复兴音乐"
    zh-TW: "以恰當風格演奏或演唱文藝復興音樂"
    ja: "ルネサンス音楽を様式に沿って演奏・歌唱する"
    ko: "르네상스 음악을 양식에 맞게 연주·노래하기"
    vi: "Chơi hoặc hát nhạc Phục hưng đúng phong cách"
    ms: "Mainkan atau nyanyi muzik Renaissance dengan gaya"
    id: "Memainkan atau menyanyikan musik Renaisans"
    hi: "पुनर्जागरण संगीत शैली के साथ बजाना या गाना"
  - en: "Try out historical instruments"
    zh: "尝试历史乐器"
    zh-TW: "嘗試歷史樂器"
    ja: "歴史的楽器に触れる"
    ko: "역사적 악기 다뤄보기"
    vi: "Thử chơi nhạc cụ lịch sử"
    ms: "Cuba alat muzik bersejarah"
    id: "Mencoba alat musik bersejarah"
    hi: "ऐतिहासिक वाद्य आज़माना"
  - en: "Contribute to rehearsals and performances"
    zh: "积极参与排练与演出"
    zh-TW: "積極參與排練與演出"
    ja: "練習と本番に積極的に関わる"
    ko: "리허설과 공연에 적극 참여하기"
    vi: "Đóng góp vào buổi tập và biểu diễn"
    ms: "Menyumbang dalam latihan dan persembahan"
    id: "Berkontribusi di latihan dan pertunjukan"
    hi: "रिहर्सल और प्रस्तुतियों में योगदान देना"
