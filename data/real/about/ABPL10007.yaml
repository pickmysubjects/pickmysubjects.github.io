code: ABPL10007
year: 2026
learn:
  en: "Basics of sustainable, buildable design: passive strategies, structure, materials and how ideas become real buildings."
  zh: "可持续且可建造的设计基础：被动式策略、结构、材料，以及构想如何变成建筑。"
  zh-TW: "永續且可建造的設計基礎：被動式策略、結構、材料，以及構想如何變成建築。"
  ja: "持続可能で建てられる設計の基礎：パッシブ手法、構造、材料、アイデアを建物にする方法。"
  ko: "지속가능하고 지을 수 있는 설계 기초: 패시브 전략, 구조, 재료, 아이디어를 건물로 만드는 법."
  vi: "Nền tảng thiết kế bền vững, khả thi: chiến lược thụ động, kết cấu, vật liệu, biến ý tưởng thành công trình."
  ms: "Asas reka bentuk lestari yang boleh dibina: strategi pasif, struktur, bahan, dan idea menjadi bangunan."
  id: "Dasar desain berkelanjutan yang bisa dibangun: strategi pasif, struktur, material, ide jadi bangunan."
  hi: "टिकाऊ और बनने लायक डिज़ाइन की बुनियाद: पैसिव तरीक़े, ढाँचा, सामग्री, विचार से इमारत तक।"
outcomes:
  - en: "Apply passive design ideas for comfort"
    zh: "运用被动式设计提升舒适度"
    zh-TW: "運用被動式設計提升舒適度"
    ja: "快適さのためにパッシブ設計を使う"
    ko: "쾌적성을 위한 패시브 설계 적용하기"
    vi: "Áp dụng thiết kế thụ động cho sự thoải mái"
    ms: "Guna idea reka bentuk pasif untuk keselesaan"
    id: "Menerapkan desain pasif untuk kenyamanan"
    hi: "आराम के लिए पैसिव डिज़ाइन लागू करना"
  - en: "Choose materials with their life cycle in mind"
    zh: "结合生命周期选择材料"
    zh-TW: "結合生命週期選擇材料"
    ja: "ライフサイクルを考えて材料を選ぶ"
    ko: "생애주기를 고려해 재료 선택하기"
    vi: "Chọn vật liệu có tính đến vòng đời"
    ms: "Pilih bahan dengan mengambil kira kitaran hayat"
    id: "Memilih material dengan memperhatikan siklus hidup"
    hi: "जीवन-चक्र ध्यान में रखकर सामग्री चुनना"
  - en: "Turn a design idea into a buildable form"
    zh: "把设计构想转化为可建造的形式"
    zh-TW: "把設計構想轉化為可建造的形式"
    ja: "設計アイデアを建てられる形にする"
    ko: "설계 아이디어를 지을 수 있는 형태로 만들기"
    vi: "Biến ý tưởng thiết kế thành hình khối xây được"
    ms: "Jadikan idea reka bentuk sesuatu yang boleh dibina"
    id: "Mengubah ide desain jadi bentuk yang bisa dibangun"
    hi: "डिज़ाइन विचार को बनने लायक रूप देना"
