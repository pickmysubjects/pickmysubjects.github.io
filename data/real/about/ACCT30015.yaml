code: ACCT30015
year: 2026
learn:
  en: "How digital systems carry accounting data, the risks they bring, and the internal controls that keep data reliable."
  zh: "数字系统如何处理会计数据、带来哪些风险，以及保证数据可靠的内控。"
  zh-TW: "數位系統如何處理會計資料、帶來哪些風險，以及確保資料可靠的內控。"
  ja: "デジタルシステムが会計データをどう扱い、どんなリスクがあり、内部統制でどう守るか。"
  ko: "디지털 시스템이 회계 데이터를 다루는 방식, 그 위험, 데이터를 믿을 수 있게 하는 내부통제."
  vi: "Hệ thống số xử lý dữ liệu kế toán ra sao, rủi ro đi kèm và các kiểm soát nội bộ giữ dữ liệu đáng tin cậy."
  ms: "Cara sistem digital mengendali data perakaunan, risikonya, dan kawalan dalaman yang memastikan data boleh dipercayai."
  id: "Cara sistem digital mengolah data akuntansi, risikonya, dan pengendalian internal yang menjaga data tetap andal."
  hi: "डिजिटल सिस्टम अकाउंटिंग डेटा कैसे संभालते हैं, उनके जोखिम, और डेटा भरोसेमंद रखने वाले इंटरनल कंट्रोल।"
outcomes:
  - en: "Read and analyse business process documentation"
    zh: "读懂并分析业务流程文档"
    zh-TW: "讀懂並分析業務流程文件"
    ja: "業務プロセスの資料を読み解き分析する"
    ko: "업무 프로세스 문서 읽고 분석하기"
    vi: "Đọc và phân tích tài liệu quy trình kinh doanh"
    ms: "Baca dan analisis dokumentasi proses perniagaan"
    id: "Membaca dan menganalisis dokumentasi proses bisnis"
    hi: "बिज़नेस प्रोसेस के दस्तावेज़ पढ़ना और समझना"
  - en: "Design internal controls for key process risks"
    zh: "针对关键流程风险设计内控"
    zh-TW: "針對關鍵流程風險設計內控"
    ja: "主要プロセスのリスクに対する内部統制を設計する"
    ko: "핵심 프로세스 위험에 맞는 내부통제 설계"
    vi: "Thiết kế kiểm soát nội bộ cho rủi ro quy trình chính"
    ms: "Reka kawalan dalaman untuk risiko proses utama"
    id: "Merancang pengendalian internal untuk risiko proses utama"
    hi: "मुख्य प्रोसेस जोखिमों के लिए इंटरनल कंट्रोल बनाना"
  - en: "Judge how reliable a firm's accounting data is"
    zh: "判断企业会计数据是否可靠"
    zh-TW: "判斷企業會計資料是否可靠"
    ja: "企業の会計データの信頼性を判断する"
    ko: "기업 회계 데이터의 신뢰성 판단"
    vi: "Đánh giá độ tin cậy của dữ liệu kế toán"
    ms: "Nilai sejauh mana data perakaunan firma boleh dipercayai"
    id: "Menilai keandalan data akuntansi perusahaan"
    hi: "कंपनी के अकाउंटिंग डेटा की विश्वसनीयता परखना"
