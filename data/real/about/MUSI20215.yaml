code: MUSI20215
year: 2026
learn:
  en: "Mixed voices and instruments, 12 to 20 people, performing Renaissance music. Period instruments are lent from the collection."
  zh: "12至20人的声乐与器乐混合团体，演奏文艺复兴音乐，可借用古乐器。"
  zh-TW: "12至20人的聲樂與器樂混合團體，演奏文藝復興音樂，可借用古樂器。"
  ja: "12〜20人の声楽・器楽混成アンサンブル。ルネサンス音楽。古楽器の貸出あり。"
  ko: "12~20명 성악·기악 혼성 앙상블. 르네상스 음악. 고악기 대여."
  vi: "Nhóm hát và nhạc cụ 12–20 người, diễn nhạc Phục Hưng; có cho mượn nhạc cụ cổ."
  ms: "Ensembel vokal dan instrumen 12–20 orang, muzik Renaissance; alat zaman itu dipinjamkan."
  id: "Ansambel vokal dan instrumen 12–20 orang, musik Renaisans; instrumen periode dipinjamkan."
  hi: "12–20 लोगों का गायन-वादन समूह, रेनेसां संगीत; पुराने वाद्य संग्रह से मिलते हैं।"
outcomes:
  - en: "Play or sing early music in a historically informed style"
    zh: "以历史风格演奏或演唱早期音乐"
    zh-TW: "以歷史風格演奏或演唱早期音樂"
    ja: "時代様式に沿って古楽を演奏・歌唱する"
    ko: "시대 양식에 맞게 고음악 연주·노래하기"
    vi: "Chơi hoặc hát nhạc cổ theo phong cách lịch sử"
    ms: "Main atau nyanyi muzik awal mengikut gaya sejarah"
    id: "Memainkan atau menyanyikan musik awal sesuai gaya sejarahnya"
    hi: "पुराने संगीत को ऐतिहासिक शैली में बजाना या गाना"
  - en: "Rehearse actively in a mixed voice and instrument group"
    zh: "在声乐器乐混合团体中积极排练"
    zh-TW: "在聲樂器樂混合團體中積極排練"
    ja: "声楽と器楽の混成で積極的に練習する"
    ko: "성악·기악 혼성 그룹에서 적극적으로 연습"
    vi: "Tập tích cực trong nhóm hát và nhạc cụ"
    ms: "Berlatih aktif dalam kumpulan vokal dan instrumen"
    id: "Berlatih aktif di grup vokal dan instrumen"
    hi: "गायन-वादन समूह में सक्रिय रिहर्सल"
  - en: "Perform with the ensemble at the end of semester"
    zh: "学期末随乐团演出"
    zh-TW: "學期末隨樂團演出"
    ja: "学期末にアンサンブルで演奏する"
    ko: "학기 말 앙상블 공연에 참여하기"
    vi: "Biểu diễn cùng nhóm cuối học kỳ"
    ms: "Membuat persembahan bersama ensembel di hujung semester"
    id: "Tampil bersama ansambel di akhir semester"
    hi: "सेमेस्टर के अंत में समूह के साथ प्रस्तुति"
