code: FREN20003
year: 2026
learn:
  en: "19th-century French novels from Romanticism to Decadence: how they are built as stories and the society they reflect."
  zh: "19 世纪法国小说，从浪漫主义到颓废派：小说的叙事结构及其反映的社会。"
  zh-TW: "19 世紀法國小說，從浪漫主義到頹廢派：小說的敘事結構及其反映的社會。"
  ja: "ロマン主義からデカダンスまでの19世紀フランス小説。物語の構造と、映し出される社会。"
  ko: "낭만주의에서 데카당스까지 19세기 프랑스 소설. 서사 구조와 그 속에 비친 사회."
  vi: "Tiểu thuyết Pháp thế kỷ 19 từ Lãng mạn đến Suy đồi: cấu trúc tự sự và xã hội mà chúng phản chiếu."
  ms: "Novel Perancis abad ke-19 dari Romantisisme ke Dekadens: struktur naratif dan masyarakat yang dicerminkan."
  id: "Novel Prancis abad ke-19 dari Romantisisme ke Dekadensi: struktur naratifnya dan masyarakat yang dicerminkan."
  hi: "रोमांटिसिज़्म से डिकेडेंस तक 19वीं सदी के फ़्रेंच उपन्यास: कथा की बनावट और वे किस समाज को दिखाते हैं।"
outcomes:
  - en: "Analyse how a novel's narrative is built"
    zh: "分析小说的叙事结构"
    zh-TW: "分析小說的敘事結構"
    ja: "小説の語りの構造を分析する"
    ko: "소설의 서사 구조 분석하기"
    vi: "Phân tích cấu trúc tự sự của tiểu thuyết"
    ms: "Analisis binaan naratif sebuah novel"
    id: "Menganalisis struktur naratif novel"
    hi: "उपन्यास की कथा-संरचना का विश्लेषण करना"
  - en: "Place novels in their social and political context"
    zh: "把小说放回其社会政治背景中"
    zh-TW: "把小說放回其社會政治背景中"
    ja: "小説を社会・政治的背景の中に位置づける"
    ko: "소설을 사회·정치적 맥락에 놓고 보기"
    vi: "Đặt tiểu thuyết vào bối cảnh xã hội, chính trị"
    ms: "Letakkan novel dalam konteks sosial dan politik"
    id: "Menempatkan novel dalam konteks sosial politik"
    hi: "उपन्यासों को उनके सामाजिक-राजनीतिक संदर्भ में रखना"
  - en: "Trace how the French novel changed over the century"
    zh: "梳理法国小说在这一世纪的演变"
    zh-TW: "梳理法國小說在這一世紀的演變"
    ja: "この世紀のフランス小説の変化をたどる"
    ko: "한 세기 동안 프랑스 소설의 변화 추적하기"
    vi: "Lần theo sự thay đổi của tiểu thuyết Pháp trong thế kỷ"
    ms: "Jejaki perubahan novel Perancis sepanjang abad"
    id: "Menelusuri perubahan novel Prancis sepanjang abad"
    hi: "सदी भर में फ़्रेंच उपन्यास के बदलाव को समझना"
