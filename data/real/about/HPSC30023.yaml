code: HPSC30023
year: 2026
learn:
  en: "Science's place in society: experts, values, markets, public input, climate disputes and race, via sociology and philosophy of science."
  zh: "科学在社会中的位置：专家、价值观、市场、公众参与、气候分歧与种族问题，借助科学社会学与科学哲学。"
  zh-TW: "科學在社會中的位置：專家、價值觀、市場、公眾參與、氣候分歧與種族問題，藉助科學社會學與科學哲學。"
  ja: "社会における科学の位置。専門家、価値、市場、市民参加、気候をめぐる対立、人種を、科学社会学・科学哲学から考える。"
  ko: "사회 속 과학의 자리. 전문성, 가치, 시장, 시민 참여, 기후 논쟁, 인종을 과학사회학·과학철학으로 다룬다."
  vi: "Vị trí của khoa học trong xã hội: chuyên gia, giá trị, thị trường, tiếng nói công chúng, bất đồng khí hậu và chủng tộc."
  ms: "Tempat sains dalam masyarakat: kepakaran, nilai, pasaran, suara awam, pertikaian iklim dan kaum, melalui sosiologi dan falsafah sains."
  id: "Tempat sains di masyarakat: keahlian, nilai, pasar, suara publik, perselisihan iklim dan ras, lewat sosiologi dan filsafat sains."
  hi: "समाज में विज्ञान की जगह: विशेषज्ञता, मूल्य, बाज़ार, जनता की भागीदारी, जलवायु पर मतभेद और नस्ल, विज्ञान के समाजशास्त्र व दर्शन से।"
outcomes:
  - en: "Compare views of what scientific knowledge is"
    zh: "比较对科学知识本质的不同看法"
    zh-TW: "比較對科學知識本質的不同看法"
    ja: "科学的知識とは何かについての見方を比べる"
    ko: "과학 지식이 무엇인지에 대한 관점 비교하기"
    vi: "So sánh các quan niệm về tri thức khoa học"
    ms: "Bandingkan pandangan tentang apa itu ilmu sains"
    id: "Membandingkan pandangan tentang hakikat pengetahuan ilmiah"
    hi: "वैज्ञानिक ज्ञान क्या है, इस पर विचारों की तुलना करना"
  - en: "Discuss the role of experts in policy"
    zh: "讨论专家在政策中的角色"
    zh-TW: "討論專家在政策中的角色"
    ja: "政策における専門家の役割を議論する"
    ko: "정책에서 전문가의 역할 토론하기"
    vi: "Thảo luận vai trò của chuyên gia trong chính sách"
    ms: "Bincangkan peranan pakar dalam dasar"
    id: "Membahas peran ahli dalam kebijakan"
    hi: "नीति में विशेषज्ञों की भूमिका पर चर्चा करना"
  - en: "Analyse current debates about science"
    zh: "分析当下关于科学的争论"
    zh-TW: "分析當下關於科學的爭論"
    ja: "科学をめぐる現在の論争を分析する"
    ko: "과학을 둘러싼 현재 논쟁 분석하기"
    vi: "Phân tích các tranh luận hiện nay về khoa học"
    ms: "Analisis perdebatan semasa tentang sains"
    id: "Menganalisis debat terkini tentang sains"
    hi: "विज्ञान पर आज की बहसों का विश्लेषण करना"
