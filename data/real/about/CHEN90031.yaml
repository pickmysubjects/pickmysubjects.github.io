code: CHEN90031
year: 2027
learn:
  en: "Using microbes and biomass to make chemical products sustainably, including bioreactor design."
  zh: "利用微生物和生物质可持续地生产化学品，包括生物反应器设计。"
  zh-TW: "利用微生物與生質永續地生產化學品，包括生物反應器設計。"
  ja: "微生物とバイオマスで化学製品を持続的につくる。バイオリアクター設計を含む。"
  ko: "미생물과 바이오매스로 화학 제품을 지속가능하게 생산, 생물반응기 설계 포함."
  vi: "Dùng vi sinh vật và sinh khối để sản xuất hóa chất bền vững, gồm thiết kế bể phản ứng sinh học."
  ms: "Menggunakan mikrob dan biojisim untuk menghasilkan produk kimia secara lestari, termasuk reka bentuk bioreaktor."
  id: "Memakai mikroba dan biomassa untuk membuat produk kimia secara berkelanjutan, termasuk desain bioreaktor."
  hi: "सूक्ष्मजीवों और बायोमास से टिकाऊ ढंग से रासायनिक उत्पाद बनाना, बायोरिएक्टर डिज़ाइन सहित।"
outcomes:
  - en: "Explain the biochemistry and microbiology behind bioprocessing"
    zh: "解释生物过程背后的生物化学和微生物学"
    zh-TW: "解釋生物程序背後的生物化學與微生物學"
    ja: "バイオプロセスの生化学と微生物学を説明する"
    ko: "생물공정의 생화학과 미생물학 설명하기"
    vi: "Giải thích hóa sinh và vi sinh đằng sau quá trình sinh học"
    ms: "Menerangkan biokimia dan mikrobiologi di sebalik bioproses"
    id: "Menjelaskan biokimia dan mikrobiologi di balik bioproses"
    hi: "बायोप्रोसेसिंग के पीछे की जैव-रसायन और सूक्ष्मजीव विज्ञान समझाना"
  - en: "Design key parts of an industrial bioprocess"
    zh: "设计工业生物过程的关键部分"
    zh-TW: "設計工業生物程序的關鍵部分"
    ja: "工業規模のバイオプロセスの主要部分を設計する"
    ko: "산업 규모 생물공정의 핵심 부분 설계하기"
    vi: "Thiết kế phần chính của quy trình sinh học công nghiệp"
    ms: "Mereka bahagian utama bioproses industri"
    id: "Merancang bagian utama bioproses industri"
    hi: "औद्योगिक बायोप्रोसेस के मुख्य हिस्से डिज़ाइन करना"
