code: COMP90099
year: 2027
learn:
  en: "A group project developing a digital product idea: customer discovery, prototyping, testing and a plan to take it to market."
  zh: "小组开发数字产品构想：客户探索、原型、测试及上市计划。"
  zh-TW: "小組開發數位產品構想：客戶探索、原型、測試與上市計畫。"
  ja: "チームでデジタル製品を構想：顧客探索、試作、検証、市場投入計画。"
  ko: "팀으로 디지털 제품 개발: 고객 탐색, 프로토타입, 테스트, 시장 진출 계획."
  vi: "Dự án nhóm phát triển sản phẩm số: khám phá khách hàng, mẫu thử, kiểm nghiệm, kế hoạch ra thị trường."
  ms: "Projek berkumpulan membangunkan produk digital: penemuan pelanggan, prototaip, ujian, pelan ke pasaran."
  id: "Proyek kelompok mengembangkan produk digital: penemuan pelanggan, prototipe, uji, rencana ke pasar."
  hi: "डिजिटल प्रोडक्ट पर ग्रुप प्रोजेक्ट: ग्राहक खोज, प्रोटोटाइप, टेस्टिंग, बाज़ार की योजना।"
outcomes:
  - en: "Test a product idea with real customers"
    zh: "与真实用户验证产品构想"
    zh-TW: "與真實用戶驗證產品構想"
    ja: "実際の顧客でアイデアを検証する"
    ko: "실제 고객과 제품 아이디어 검증하기"
    vi: "Kiểm nghiệm ý tưởng sản phẩm với khách hàng thật"
    ms: "Uji idea produk dengan pelanggan sebenar"
    id: "Menguji ide produk dengan pelanggan nyata"
    hi: "असली ग्राहकों के साथ प्रोडक्ट आइडिया परखना"
  - en: "Build a prototype and a go-to-market plan"
    zh: "做出原型与上市策略"
    zh-TW: "做出原型與上市策略"
    ja: "試作品と市場投入計画を作る"
    ko: "프로토타입과 시장 진출 계획 만들기"
    vi: "Làm mẫu thử và kế hoạch ra thị trường"
    ms: "Bina prototaip dan pelan ke pasaran"
    id: "Membuat prototipe dan rencana ke pasar"
    hi: "प्रोटोटाइप और बाज़ार योजना बनाना"
