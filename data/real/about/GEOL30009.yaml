code: GEOL30009
year: 2026
learn:
  en: "Hands-on field geology: mapping rocks and structures, building cross-sections, and working safely in remote areas."
  zh: "实践野外地质：填图、绘制剖面，并在偏远地区安全作业。"
  zh-TW: "實作野外地質：填圖、繪製剖面，並在偏遠地區安全作業。"
  ja: "実践的な野外地質：岩石や構造の地図化、断面図作成、遠隔地での安全な作業。"
  ko: "실전 야외지질: 암석·구조 매핑, 단면도 작성, 오지 안전 작업."
  vi: "Địa chất thực địa: lập bản đồ đá và cấu trúc, dựng mặt cắt, làm việc an toàn ở vùng xa."
  ms: "Geologi lapangan amali: memeta batuan dan struktur, membina keratan rentas, kerja selamat di kawasan terpencil."
  id: "Geologi lapangan praktis: memetakan batuan dan struktur, membuat penampang, bekerja aman di daerah terpencil."
  hi: "व्यावहारिक फ़ील्ड भूविज्ञान: चट्टानों-संरचनाओं की मैपिंग, क्रॉस-सेक्शन बनाना, दूरदराज़ में सुरक्षित काम।"
outcomes:
  - en: "Build geological maps and cross-sections"
    zh: "绘制地质图和剖面图"
    zh-TW: "繪製地質圖與剖面圖"
    ja: "地質図と断面図を作成する"
    ko: "지질도와 단면도 작성하기"
    vi: "Lập bản đồ và mặt cắt địa chất"
    ms: "Bina peta dan keratan rentas geologi"
    id: "Membuat peta dan penampang geologi"
    hi: "भूवैज्ञानिक नक्शे और क्रॉस-सेक्शन बनाना"
  - en: "Plan safe fieldwork in remote areas"
    zh: "规划偏远地区的安全野外工作"
    zh-TW: "規劃偏遠地區的安全野外工作"
    ja: "遠隔地での安全な野外調査を計画する"
    ko: "오지의 안전한 현장작업 계획하기"
    vi: "Lập kế hoạch thực địa an toàn ở vùng xa"
    ms: "Rancang kerja lapangan selamat di kawasan terpencil"
    id: "Merencanakan kerja lapangan aman di daerah terpencil"
    hi: "दूरदराज़ में सुरक्षित फ़ील्डवर्क की योजना बनाना"
  - en: "Identify geohazards from geological mapping"
    zh: "通过地质填图识别地质灾害"
    zh-TW: "透過地質填圖辨識地質災害"
    ja: "地質図から地質災害を見つける"
    ko: "지질 매핑으로 지질재해 파악하기"
    vi: "Nhận diện tai biến địa chất từ bản đồ"
    ms: "Kenal pasti geobahaya dari pemetaan geologi"
    id: "Mengenali bahaya geologi dari pemetaan"
    hi: "भूवैज्ञानिक मैपिंग से भू-खतरे पहचानना"
