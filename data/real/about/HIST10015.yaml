code: HIST10015
year: 2026
learn:
  en: "A global history of dictatorship and democracy over the last 200 years, and what helped one or the other take hold."
  zh: "近两百年来独裁与民主的全球史，以及是什么让其中一种扎下根来。"
  zh-TW: "近兩百年來獨裁與民主的全球史，以及是什麼讓其中一種扎下根來。"
  ja: "この200年の独裁と民主主義の世界史と、どちらかが根づいた理由を学ぶ。"
  ko: "지난 200년 동안의 독재와 민주주의의 세계사, 그리고 어느 쪽이 자리 잡게 된 이유를 배운다."
  vi: "Lịch sử toàn cầu về độc tài và dân chủ trong 200 năm qua, và điều gì giúp mỗi bên bám rễ."
  ms: "Sejarah global pemerintahan diktator dan demokrasi sepanjang 200 tahun lalu, serta apa yang membuat salah satunya bertapak."
  id: "Sejarah global kediktatoran dan demokrasi selama 200 tahun terakhir, dan apa yang membuat salah satunya mengakar."
  hi: "पिछले 200 सालों में तानाशाही और लोकतंत्र का वैश्विक इतिहास, और किस वजह से इनमें से कोई एक जड़ पकड़ता है।"
outcomes:
  - en: "Describe how dictatorships and democracies rose and fell"
    zh: "说明独裁和民主政权如何兴起和衰落"
    zh-TW: "說明獨裁和民主政權如何興起和衰落"
    ja: "独裁と民主主義の興亡を説明する"
    ko: "독재와 민주주의의 흥망 설명하기"
    vi: "Mô tả sự trỗi dậy và sụp đổ của độc tài và dân chủ"
    ms: "Huraikan kebangkitan dan kejatuhan diktator dan demokrasi"
    id: "Menjelaskan naik turunnya kediktatoran dan demokrasi"
    hi: "तानाशाही और लोकतंत्र के उभार और पतन को बताना"
  - en: "Tell primary sources apart from secondary ones"
    zh: "分辨一手资料和二手资料"
    zh-TW: "分辨一手資料和二手資料"
    ja: "一次資料と二次資料を見分ける"
    ko: "1차 자료와 2차 자료 구별하기"
    vi: "Phân biệt nguồn sơ cấp và thứ cấp"
    ms: "Bezakan sumber primer dan sekunder"
    id: "Membedakan sumber primer dan sekunder"
    hi: "प्राथमिक और द्वितीयक स्रोतों में फ़र्क करना"
  - en: "Build a historical argument from a case study"
    zh: "围绕一个案例写出历史论证"
    zh-TW: "圍繞一個案例寫出歷史論證"
    ja: "一つの事例から歴史的な議論を組み立てる"
    ko: "하나의 사례로 역사적 논증 세우기"
    vi: "Xây dựng lập luận lịch sử từ một trường hợp cụ thể"
    ms: "Bina hujah sejarah daripada satu kajian kes"
    id: "Menyusun argumen sejarah dari satu studi kasus"
    hi: "एक केस स्टडी से ऐतिहासिक तर्क बनाना"
