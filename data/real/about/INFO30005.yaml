code: INFO30005
year: 2026
learn:
  en: "Designing and prototyping for technology beyond screens, like AI, VR/AR, smart homes and voice."
  zh: "为屏幕之外的技术做设计和原型，比如AI、VR/AR、智能家居和语音。"
  zh-TW: "為螢幕之外的技術做設計和原型，例如AI、VR/AR、智慧家庭和語音。"
  ja: "AI、VR/AR、スマートホーム、音声など画面の外の技術のデザインとプロトタイプ。"
  ko: "AI, VR/AR, 스마트홈, 음성 등 화면 너머의 기술을 위한 디자인과 프로토타입."
  vi: "Thiết kế và làm prototype cho công nghệ ngoài màn hình như AI, VR/AR, nhà thông minh và giọng nói."
  ms: "Mereka dan membuat prototaip untuk teknologi di luar skrin seperti AI, VR/AR, rumah pintar dan suara."
  id: "Merancang dan membuat prototipe untuk teknologi di luar layar, seperti AI, VR/AR, rumah pintar, dan suara."
  hi: "स्क्रीन से आगे की टेक्नोलॉजी जैसे AI, VR/AR, स्मार्ट होम और वॉइस के लिए डिज़ाइन और प्रोटोटाइप।"
outcomes:
  - en: "Prototype different kinds of interactive devices"
    zh: "为不同交互设备做原型"
    zh-TW: "為不同互動裝置做原型"
    ja: "さまざまなインタラクティブ機器を試作する"
    ko: "다양한 인터랙티브 기기 프로토타입 제작"
    vi: "Làm prototype cho nhiều loại thiết bị tương tác"
    ms: "Buat prototaip pelbagai peranti interaktif"
    id: "Membuat prototipe berbagai perangkat interaktif"
    hi: "अलग-अलग इंटरैक्टिव डिवाइस के प्रोटोटाइप बनाना"
  - en: "Design a new user experience step by step"
    zh: "迭代设计一个新的用户体验"
    zh-TW: "逐步設計一個新的使用者體驗"
    ja: "新しいユーザー体験を段階的に設計する"
    ko: "새로운 사용자 경험을 단계별로 설계"
    vi: "Thiết kế trải nghiệm người dùng mới từng bước"
    ms: "Reka pengalaman pengguna baharu langkah demi langkah"
    id: "Merancang pengalaman pengguna baru bertahap"
    hi: "नया यूज़र अनुभव चरण-दर-चरण डिज़ाइन करना"
  - en: "Present design ideas to stakeholders"
    zh: "向相关方展示设计想法"
    zh-TW: "向利害關係人展示設計想法"
    ja: "関係者にデザイン案を発表する"
    ko: "이해관계자에게 디자인 아이디어 발표"
    vi: "Trình bày ý tưởng thiết kế với các bên liên quan"
    ms: "Bentang idea reka bentuk kepada pihak berkepentingan"
    id: "Mempresentasikan ide desain ke pemangku kepentingan"
    hi: "स्टेकहोल्डर्स को डिज़ाइन आइडिया पेश करना"
