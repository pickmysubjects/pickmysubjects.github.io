code: ECOM30001
year: 2026
learn:
  en: "Multiple regression in depth: testing ideas with real data and fixing common problems, plus a project."
  zh: "深入学习多元回归：用真实数据检验假设、处理常见问题，并做一个项目。"
  zh-TW: "深入學習多元迴歸：用真實資料檢定假設、處理常見問題，並做一個專題。"
  ja: "重回帰を深く学ぶ：実データで仮説を検証し、よくある問題に対処し、プロジェクトも行う。"
  ko: "다중회귀 심화: 실제 데이터로 가설 검정, 흔한 문제 해결, 프로젝트 수행."
  vi: "Hồi quy bội chuyên sâu: kiểm định giả thuyết với dữ liệu thật, xử lý lỗi thường gặp và làm một dự án."
  ms: "Regresi berganda secara mendalam: uji idea dengan data sebenar, atasi masalah biasa, dan satu projek."
  id: "Regresi berganda secara mendalam: menguji gagasan dengan data nyata, mengatasi masalah umum, plus proyek."
  hi: "मल्टीपल रिग्रेशन गहराई से: असली डेटा से परिकल्पना जाँचना, आम दिक्कतें सुधारना और एक प्रोजेक्ट।"
outcomes:
  - en: "Run and interpret regressions on real data"
    zh: "对真实数据做回归并解读结果"
    zh-TW: "對真實資料跑迴歸並解讀結果"
    ja: "実データで回帰を行い結果を解釈する"
    ko: "실제 데이터로 회귀분석하고 해석"
    vi: "Chạy và diễn giải hồi quy trên dữ liệu thật"
    ms: "Jalankan dan tafsir regresi pada data sebenar"
    id: "Menjalankan dan menafsirkan regresi pada data nyata"
    hi: "असली डेटा पर रिग्रेशन चलाना और समझाना"
  - en: "Test hypotheses about how variables are related"
    zh: "检验变量之间关系的假设"
    zh-TW: "檢定變數之間關係的假設"
    ja: "変数間の関係について仮説を検定する"
    ko: "변수 간 관계에 대한 가설 검정"
    vi: "Kiểm định giả thuyết về quan hệ giữa các biến"
    ms: "Uji hipotesis tentang hubungan antara pemboleh ubah"
    id: "Menguji hipotesis tentang hubungan antarvariabel"
    hi: "वैरिएबल के आपसी संबंध की परिकल्पना जाँचना"
  - en: "Detect and fix broken model assumptions"
    zh: "发现并修正违背的模型假设"
    zh-TW: "發現並修正違反的模型假設"
    ja: "モデルの仮定違反を見つけて直す"
    ko: "모델 가정 위반을 찾아 고치기"
    vi: "Phát hiện và sửa vi phạm giả định của mô hình"
    ms: "Kesan dan betulkan andaian model yang dilanggar"
    id: "Mendeteksi dan memperbaiki asumsi model yang dilanggar"
    hi: "मॉडल की टूटी मान्यताएँ पकड़ना और सुधारना"
