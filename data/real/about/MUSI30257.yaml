code: MUSI30257
year: 2026
learn:
  en: "Basso continuo from figures for continuo players: harder pieces, sight-reading, improvising and partimento."
  zh: "面向通奏低音乐手：更难曲目、视奏、即兴与partimento。"
  zh-TW: "面向通奏低音樂手：更難曲目、視奏、即興與partimento。"
  ja: "通奏低音奏者向け：難しい曲、初見、即興、パルティメント。"
  ko: "콘티누오 연주자용: 더 어려운 곡, 초견, 즉흥, 파르티멘토."
  vi: "Cho người chơi continuo: bài khó hơn, đọc thị tấu, ứng tác và partimento."
  ms: "Untuk pemain continuo: karya lebih sukar, bacaan pandang, improvisasi, partimento."
  id: "Untuk pemain continuo: karya lebih sulit, baca prima vista, improvisasi, partimento."
  hi: "कॉन्टिनुओ वादकों के लिए: कठिन रचनाएँ, साइट-रीडिंग, इम्प्रोवाइज़ेशन और पार्टिमेंटो।"
outcomes:
  - en: "Realise a figured bass at sight"
    zh: "视奏实现数字低音"
    zh-TW: "視奏實現數字低音"
    ja: "数字付き低音を初見で弾く"
    ko: "숫자 저음을 초견으로 연주하기"
    vi: "Đọc thị tấu bè trầm số"
    ms: "Mainkan bes berangka secara bacaan pandang"
    id: "Memainkan bas berangka prima vista"
    hi: "फ़िगर्ड बास को साइट पर बजाना"
  - en: "Improvise in a period style"
    zh: "按时代风格即兴演奏"
    zh-TW: "按時代風格即興演奏"
    ja: "時代様式で即興する"
    ko: "시대 양식으로 즉흥 연주하기"
    vi: "Ứng tác theo phong cách thời kỳ"
    ms: "Berimprovisasi dalam gaya zaman"
    id: "Berimprovisasi dalam gaya zaman"
    hi: "काल-शैली में इम्प्रोवाइज़ करना"
  - en: "Use old sources to guide performance"
    zh: "以史料指导演奏"
    zh-TW: "以史料指導演奏"
    ja: "史料をもとに演奏を組み立てる"
    ko: "사료를 바탕으로 연주 결정하기"
    vi: "Dựa vào tư liệu cổ để biểu diễn"
    ms: "Guna sumber lama untuk panduan persembahan"
    id: "Memakai sumber lama sebagai panduan main"
    hi: "पुराने स्रोतों से वादन तय करना"
