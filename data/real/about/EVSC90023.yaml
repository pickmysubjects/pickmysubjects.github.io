code: EVSC90023
year: 2027
learn:
  en: "How houses respond to bushfire, and how building rules and land use planning reduce the risk."
  zh: "房屋在山火中的表现，以及建筑法规和土地规划如何降低风险。"
  zh-TW: "房屋在山火中的表現，以及建築法規和土地規劃如何降低風險。"
  ja: "住宅が山火事にどう反応するかと、建築規制・土地利用計画によるリスク低減。"
  ko: "주택이 산불에 어떻게 반응하는지, 건축 규정과 토지이용계획으로 위험을 줄이는 법."
  vi: "Nhà ở phản ứng với cháy rừng ra sao và quy chuẩn xây dựng, quy hoạch giảm rủi ro thế nào."
  ms: "Cara rumah bertindak balas pada kebakaran semak dan cara peraturan bangunan mengurangkan risiko."
  id: "Cara rumah bereaksi terhadap kebakaran hutan dan cara aturan bangunan serta tata ruang menekan risiko."
  hi: "घर बुशफ़ायर में कैसे प्रतिक्रिया करते हैं, और भवन नियम व भूमि योजना जोखिम कैसे घटाते हैं।"
outcomes:
  - en: "Judge building compliance for bushfire"
    zh: "判断建筑是否符合山火规范"
    zh-TW: "判斷建築是否符合山火規範"
    ja: "建物の山火事基準適合を判断する"
    ko: "건물의 산불 기준 적합성 판단하기"
    vi: "Đánh giá tuân thủ chống cháy rừng của công trình"
    ms: "Menilai pematuhan bangunan untuk kebakaran"
    id: "Menilai kepatuhan bangunan terhadap kebakaran"
    hi: "बुशफ़ायर के लिए भवन अनुपालन आँकना"
  - en: "Interpret Victorian building law"
    zh: "解读维州建筑法规"
    zh-TW: "解讀維州建築法規"
    ja: "州の建築法規を読み解く"
    ko: "빅토리아 건축법 해석하기"
    vi: "Diễn giải luật xây dựng Victoria"
    ms: "Mentafsir undang-undang bangunan Victoria"
    id: "Menafsirkan hukum bangunan Victoria"
    hi: "विक्टोरिया भवन क़ानून की व्याख्या"
