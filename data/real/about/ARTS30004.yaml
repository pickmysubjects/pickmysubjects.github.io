code: ARTS30004
year: 2027
learn:
  en: "Core Buddhist philosophy, like impermanence, karma, non-self and emptiness, across schools such as Madhyamaka and Yogācāra."
  zh: "佛教哲学核心概念：无常、业、无我和空，涵盖中观、唯识等学派。"
  zh-TW: "佛教哲學核心概念：無常、業、無我和空，涵蓋中觀、唯識等學派。"
  ja: "無常・業・無我・空など仏教哲学の核心を、中観・唯識などの学派を通して学ぶ。"
  ko: "무상·업·무아·공 등 불교 철학의 핵심을 중관·유식 등 학파를 통해 배우기."
  vi: "Triết học Phật giáo cốt lõi như vô thường, nghiệp, vô ngã và tánh không, qua các trường phái như Trung quán và Duy thức."
  ms: "Falsafah teras Buddha seperti ketidakkekalan, karma, bukan-diri dan kekosongan, merentas aliran seperti Madhyamaka dan Yogācāra."
  id: "Filsafat inti Buddhis seperti ketidakkekalan, karma, tanpa-diri, dan kekosongan, lintas aliran seperti Madhyamaka dan Yogācāra."
  hi: "बौद्ध दर्शन के मूल विचार जैसे अनित्यता, कर्म, अनात्म और शून्यता, माध्यमक और योगाचार जैसे संप्रदायों में।"
outcomes:
  - en: "Interpret key ideas like non-self and emptiness"
    zh: "解读无我、空等核心概念"
    zh-TW: "解讀無我、空等核心概念"
    ja: "無我や空などの重要概念を読み解く"
    ko: "무아와 공 같은 핵심 개념 해석하기"
    vi: "Giải thích các khái niệm chính như vô ngã và tánh không"
    ms: "Tafsir idea utama seperti bukan-diri dan kekosongan"
    id: "Menafsirkan gagasan utama seperti tanpa-diri dan kekosongan"
    hi: "अनात्म और शून्यता जैसे मुख्य विचारों की व्याख्या"
  - en: "Evaluate arguments in Buddhist philosophical texts"
    zh: "评析佛教哲学文本中的论证"
    zh-TW: "評析佛教哲學文本中的論證"
    ja: "仏教哲学のテキストの議論を評価する"
    ko: "불교 철학 문헌의 논증 평가하기"
    vi: "Đánh giá lập luận trong văn bản triết học Phật giáo"
    ms: "Nilai hujah dalam teks falsafah Buddha"
    id: "Menilai argumen dalam teks filsafat Buddhis"
    hi: "बौद्ध दार्शनिक ग्रंथों के तर्कों का मूल्यांकन"
  - en: "See how reasoning links to meditation and ethics"
    zh: "理解哲学思辨如何与禅修和伦理结合"
    zh-TW: "理解哲學思辨如何與禪修和倫理結合"
    ja: "哲学的思考が瞑想や倫理とどうつながるかを見る"
    ko: "철학적 사유가 명상·윤리와 어떻게 이어지는지 보기"
    vi: "Hiểu lý luận gắn với thiền định và đạo đức thế nào"
    ms: "Lihat kaitan penaakulan dengan meditasi dan etika"
    id: "Melihat kaitan penalaran dengan meditasi dan etika"
    hi: "तर्क का ध्यान और नैतिकता से संबंध समझना"
