code: MUSI30253
year: 2026
learn:
  en: "Build a large concert repertoire across styles and present a 35-minute recital as the final exam."
  zh: "积累跨风格的大量音乐会曲目，最后以35分钟独奏会作为考核。"
  zh-TW: "累積跨風格的大量音樂會曲目，最後以35分鐘獨奏會作為考核。"
  ja: "様々な様式の演奏会レパートリーを広げ、最後に35分のリサイタルで試験。"
  ko: "여러 양식의 큰 연주 레퍼토리를 쌓고 35분 리사이틀로 최종 시험."
  vi: "Xây dựng kho tiết mục hòa nhạc đa phong cách, thi cuối bằng buổi độc tấu 35 phút."
  ms: "Bina repertoir konsert pelbagai gaya dan persembahkan resital 35 minit sebagai ujian akhir."
  id: "Membangun repertoar konser lintas gaya dan tampil resital 35 menit sebagai ujian akhir."
  hi: "विविध शैलियों का बड़ा कॉन्सर्ट रिपर्टरी बनाना, अंत में 35 मिनट का रिसाइटल।"
outcomes:
  - en: "Design and present a balanced recital"
    zh: "设计并呈现结构均衡的独奏会"
    zh-TW: "設計並呈現結構均衡的獨奏會"
    ja: "バランスの取れたリサイタルを構成し演奏する"
    ko: "균형 잡힌 리사이틀 구성·연주하기"
    vi: "Thiết kế và trình diễn buổi độc tấu cân đối"
    ms: "Reka dan persembahkan resital seimbang"
    id: "Merancang dan menampilkan resital seimbang"
    hi: "संतुलित रिसाइटल तैयार और प्रस्तुत करना"
  - en: "Control technique with consistency"
    zh: "稳定地掌控演奏技巧"
    zh-TW: "穩定地掌控演奏技巧"
    ja: "安定して技術をコントロールする"
    ko: "기술을 일관되게 다루기"
    vi: "Kiểm soát kỹ thuật ổn định"
    ms: "Kawal teknik dengan konsisten"
    id: "Mengendalikan teknik secara konsisten"
    hi: "तकनीक पर लगातार नियंत्रण"
  - en: "Perform with confidence and professionalism"
    zh: "自信而专业地演出"
    zh-TW: "自信而專業地演出"
    ja: "自信を持ってプロらしく演奏する"
    ko: "자신감 있고 프로답게 연주하기"
    vi: "Biểu diễn tự tin, chuyên nghiệp"
    ms: "Membuat persembahan dengan yakin dan profesional"
    id: "Tampil percaya diri dan profesional"
    hi: "आत्मविश्वास और पेशेवर ढंग से प्रस्तुति"
