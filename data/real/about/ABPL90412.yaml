code: ABPL90412
year: 2027
learn:
  en: "A digital fabrication elective where you design an architectural piece made with robotic fabrication."
  zh: "数字制造选修课，设计一件用机器人加工制造的建筑作品。"
  zh-TW: "數位製造選修課，設計一件用機器人加工製造的建築作品。"
  ja: "ロボット加工でつくる建築作品を設計するデジタル制作の選択科目。"
  ko: "로봇 제작으로 만드는 건축 작품을 설계하는 디지털 제작 선택과목."
  vi: "Môn chế tác số: thiết kế sản phẩm kiến trúc làm bằng robot."
  ms: "Elektif fabrikasi digital: mereka karya seni bina yang dibuat dengan robot."
  id: "Elektif fabrikasi digital: mendesain karya arsitektur yang dibuat dengan robot."
  hi: "डिजिटल फ़ैब्रिकेशन ऐच्छिक: रोबोटिक फ़ैब्रिकेशन से बनी वास्तु कृति डिज़ाइन करना।"
outcomes:
  - en: "Design for robotic fabrication"
