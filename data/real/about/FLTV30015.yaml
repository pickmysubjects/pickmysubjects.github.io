code: FLTV30015
year: 2026
learn:
  en: "Adapt existing material for the screen and write a short script, with peer feedback in script tutorials."
  zh: "把现有作品改编成影视，写一部短剧本，并在小组中互评。"
  zh-TW: "把現有作品改編成影視，寫一部短劇本，並在小組中互評。"
  ja: "既存の作品を映像向けに脚色し短い脚本を書き、互いに講評する。"
  ko: "기존 작품을 영상으로 각색해 짧은 대본을 쓰고 동료 피드백을 주고받는다."
  vi: "Chuyển thể tác phẩm có sẵn lên màn ảnh, viết kịch bản ngắn, góp ý lẫn nhau."
  ms: "Adaptasi bahan sedia ada untuk skrin, tulis skrip pendek, dengan maklum balas rakan."
  id: "Mengadaptasi karya yang ada ke layar, menulis naskah pendek, dengan umpan balik rekan."
  hi: "मौजूदा सामग्री को स्क्रीन के लिए ढालना, छोटी स्क्रिप्ट लिखना, साथियों से फ़ीडबैक।"
outcomes:
  - en: "Choose and shape source material for screen"
    zh: "选择并改造原作以适合银幕"
    zh-TW: "選擇並改造原作以適合銀幕"
    ja: "原作を選び映像向けに形づくる"
    ko: "원작을 골라 영상에 맞게 다듬기"
    vi: "Chọn và chỉnh nguyên tác cho màn ảnh"
    ms: "Pilih dan bentuk bahan asal untuk skrin"
    id: "Memilih dan membentuk sumber untuk layar"
    hi: "स्रोत सामग्री चुनकर स्क्रीन के लिए ढालना"
  - en: "Present a script in progress"
    zh: "展示进行中的剧本"
    zh-TW: "報告進行中的劇本"
    ja: "執筆中の脚本を発表する"
    ko: "진행 중인 대본 발표하기"
    vi: "Trình bày kịch bản đang viết"
    ms: "Bentang skrip yang sedang ditulis"
    id: "Mempresentasikan naskah yang berjalan"
    hi: "प्रगति में स्क्रिप्ट प्रस्तुत करना"
  - en: "Write a 24 to 26-page adapted script"
    zh: "写24到26页的改编剧本"
    zh-TW: "寫 24 到 26 頁的改編劇本"
    ja: "24〜26ページの脚色脚本を書く"
    ko: "24~26쪽 각색 대본 쓰기"
    vi: "Viết kịch bản chuyển thể 24–26 trang"
    ms: "Tulis skrip adaptasi 24–26 halaman"
    id: "Menulis naskah adaptasi 24–26 halaman"
    hi: "24 से 26 पेज की रूपांतरित स्क्रिप्ट लिखना"
