code: ECOM90012
year: 2027
learn:
  en: "Applied macro modelling: New Keynesian DSGE models and structural VARs, applied to Australia, with a project."
  zh: "应用宏观建模：新凯恩斯 DSGE 与结构 VAR，结合澳大利亚，含研究项目。"
  zh-TW: "應用總體建模：新凱因斯 DSGE 與結構 VAR，結合澳洲，含研究專題。"
  ja: "応用マクロモデル：ニューケインジアンDSGEと構造VAR、オーストラリアへの応用とプロジェクト。"
  ko: "응용 거시 모형: 뉴케인지언 DSGE와 구조 VAR, 호주 적용과 프로젝트."
  vi: "Mô hình vĩ mô ứng dụng: DSGE Keynes mới và VAR cấu trúc, áp dụng cho Úc, kèm dự án."
  ms: "Pemodelan makro gunaan: DSGE Keynesian Baharu dan VAR struktur, diguna pada Australia, dengan projek."
  id: "Pemodelan makro terapan: DSGE Keynesian Baru dan SVAR, diterapkan ke Australia, dengan proyek."
  hi: "एप्लाइड मैक्रो मॉडलिंग: न्यू कीनेसियन DSGE और स्ट्रक्चरल VAR, ऑस्ट्रेलिया पर लागू, प्रोजेक्ट सहित।"
