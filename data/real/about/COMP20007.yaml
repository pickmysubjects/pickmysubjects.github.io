code: COMP20007
year: 2027
learn:
  en: "Designing algorithms: graph algorithms, advanced sorting, dynamic programming and greedy methods, and how to compare their speed."
  zh: "设计算法：图算法、进阶排序、动态规划和贪心法，以及如何比较它们的效率。"
  zh-TW: "設計演算法：圖演算法、進階排序、動態規劃和貪婪法，以及如何比較它們的效率。"
  ja: "アルゴリズム設計：グラフアルゴリズム、発展的なソート、動的計画法、貪欲法と、その速さの比べ方。"
  ko: "알고리즘 설계: 그래프 알고리즘, 고급 정렬, 동적 계획법과 탐욕법, 그리고 속도를 비교하는 법."
  vi: "Thiết kế thuật toán: thuật toán đồ thị, sắp xếp nâng cao, quy hoạch động, thuật toán tham lam và cách so sánh tốc độ của chúng."
  ms: "Mereka bentuk algoritma: algoritma graf, pengisihan lanjutan, pengaturcaraan dinamik dan kaedah tamak, serta cara membandingkan kelajuannya."
  id: "Merancang algoritma: algoritma graf, pengurutan lanjutan, pemrograman dinamis dan metode greedy, serta cara membandingkan kecepatannya."
  hi: "एल्गोरिद्म डिज़ाइन: ग्राफ़ एल्गोरिद्म, उन्नत सॉर्टिंग, डायनामिक प्रोग्रामिंग और ग्रीडी तरीके, और उनकी रफ़्तार की तुलना।"
outcomes:
  - en: "Write and debug graph, dynamic programming and greedy algorithms"
    zh: "编写并调试图算法、动态规划和贪心算法"
    zh-TW: "撰寫並除錯圖演算法、動態規劃和貪婪演算法"
    ja: "グラフ・動的計画法・貪欲法のコードを書いてデバッグする"
    ko: "그래프·동적 계획법·탐욕 알고리즘 작성과 디버깅"
    vi: "Viết và gỡ lỗi thuật toán đồ thị, quy hoạch động và tham lam"
    ms: "Tulis dan nyahpepijat algoritma graf, pengaturcaraan dinamik dan tamak"
    id: "Menulis dan men-debug algoritma graf, pemrograman dinamis dan greedy"
    hi: "ग्राफ़, डायनामिक प्रोग्रामिंग और ग्रीडी एल्गोरिद्म लिखना और डीबग करना"
  - en: "Choose an algorithm by analysing its complexity"
    zh: "通过分析复杂度来选择算法"
    zh-TW: "透過分析複雜度來選擇演算法"
    ja: "計算量を分析してアルゴリズムを選ぶ"
    ko: "복잡도를 분석해 알고리즘 고르기"
    vi: "Chọn thuật toán bằng cách phân tích độ phức tạp"
    ms: "Pilih algoritma dengan menganalisis kerumitannya"
    id: "Memilih algoritma dengan menganalisis kompleksitasnya"
    hi: "जटिलता का विश्लेषण करके एल्गोरिद्म चुनना"
  - en: "Write multi-module programs in C"
    zh: "用 C 写多模块程序"
    zh-TW: "用 C 寫多模組程式"
    ja: "C で複数モジュールのプログラムを書く"
    ko: "C로 여러 모듈 프로그램 작성"
    vi: "Viết chương trình nhiều mô-đun bằng C"
    ms: "Tulis program berbilang modul dalam C"
    id: "Menulis program multi-modul dalam C"
    hi: "C में कई मॉड्यूल वाले प्रोग्राम लिखना"
