code: COMP20007
year: 2026
learn:
  en: "Common data structures and algorithms, why they work, how fast they are and when to use each."
  zh: "常用数据结构和算法：为什么对、有多快、什么时候用。"
  zh-TW: "常用資料結構和演算法：為什麼正確、有多快、什麼時候用。"
  ja: "よく使うデータ構造とアルゴリズム：なぜ正しいか、どれだけ速いか、いつ使うか。"
  ko: "자주 쓰는 자료구조와 알고리즘: 왜 맞는지, 얼마나 빠른지, 언제 쓰는지."
  vi: "Cấu trúc dữ liệu và thuật toán phổ biến: vì sao đúng, nhanh cỡ nào, khi nào dùng."
  ms: "Struktur data dan algoritma biasa: kenapa ia betul, sepantas mana dan bila guna."
  id: "Struktur data dan algoritma umum: kenapa benar, seberapa cepat, dan kapan dipakai."
  hi: "आम डेटा स्ट्रक्चर और एल्गोरिद्म: ये क्यों काम करते हैं, कितने तेज़ हैं और कब इस्तेमाल करें।"
outcomes:
  - en: "Write graph, greedy and dynamic programming code"
    zh: "写图算法、贪心和动态规划"
    zh-TW: "寫圖論、貪婪和動態規劃程式"
    ja: "グラフ・貪欲法・動的計画法のコードを書く"
    ko: "그래프·그리디·동적 계획법 코드 작성"
    vi: "Viết code đồ thị, tham lam và quy hoạch động"
    ms: "Tulis kod graf, tamak dan pengaturcaraan dinamik"
    id: "Menulis kode graf, greedy, dan dynamic programming"
    hi: "ग्राफ़, ग्रीडी और डायनैमिक प्रोग्रामिंग कोड लिखना"
  - en: "Compare algorithms by how fast they run"
    zh: "按运行效率比较算法"
    zh-TW: "依執行效率比較演算法"
    ja: "実行速度でアルゴリズムを比較する"
    ko: "실행 속도로 알고리즘 비교"
    vi: "So sánh thuật toán theo tốc độ chạy"
    ms: "Banding algoritma ikut kelajuan"
    id: "Membandingkan algoritma dari kecepatannya"
    hi: "चलने की गति से एल्गोरिद्म की तुलना करना"
  - en: "Build multi-file programs in C"
    zh: "用C写多模块程序"
    zh-TW: "用C寫多檔案程式"
    ja: "C言語で複数ファイルのプログラムを作る"
    ko: "C로 다중 파일 프로그램 작성"
    vi: "Viết chương trình C nhiều file"
    ms: "Bina program C berbilang fail"
    id: "Membuat program C multi-file"
    hi: "C में मल्टी-फ़ाइल प्रोग्राम बनाना"
