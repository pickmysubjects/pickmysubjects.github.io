code: MIIM30014
year: 2026
learn:
  en: "How viruses infect cells and cause disease, how the body fights back, and how vaccines and antivirals help."
  zh: "病毒怎么感染细胞致病、身体怎么抵抗，以及疫苗和抗病毒药。"
  zh-TW: "病毒怎麼感染細胞致病、身體怎麼抵抗，以及疫苗和抗病毒藥。"
  ja: "ウイルスが細胞に感染し病気を起こす仕組み、体の防御、ワクチンと抗ウイルス薬の役割。"
  ko: "바이러스가 세포를 감염시켜 병을 일으키는 방식, 몸의 방어, 백신과 항바이러스제의 역할."
  vi: "Virus lây nhiễm tế bào và gây bệnh ra sao, cơ thể chống lại thế nào, và vắc-xin, thuốc kháng virus giúp gì."
  ms: "Cara virus menjangkiti sel dan menyebabkan penyakit, cara badan melawan, dan peranan vaksin serta antivirus."
  id: "Cara virus menginfeksi sel dan menyebabkan penyakit, cara tubuh melawan, dan peran vaksin serta antivirus."
  hi: "वायरस कोशिकाओं को कैसे संक्रमित कर बीमारी करते हैं, शरीर कैसे लड़ता है, और टीके व एंटीवायरल कैसे मदद करते हैं।"
outcomes:
  - en: "Explain how viruses replicate inside host cells"
    zh: "解释病毒怎么在宿主细胞里复制"
    zh-TW: "解釋病毒怎麼在宿主細胞裡複製"
    ja: "ウイルスが宿主細胞内で増える仕組みを説明する"
    ko: "바이러스가 숙주세포 안에서 복제되는 방식 설명하기"
    vi: "Giải thích virus nhân lên trong tế bào chủ ra sao"
    ms: "Menerangkan cara virus bereplikasi dalam sel perumah"
    id: "Menjelaskan cara virus bereplikasi di dalam sel inang"
    hi: "वायरस होस्ट कोशिका में कैसे बढ़ते हैं, समझाना"
  - en: "Explain how viruses dodge the immune system"
    zh: "解释病毒怎么躲过免疫系统"
    zh-TW: "解釋病毒怎麼躲過免疫系統"
    ja: "ウイルスが免疫系をかわす仕組みを説明する"
    ko: "바이러스가 면역계를 피하는 방식 설명하기"
    vi: "Giải thích virus né tránh hệ miễn dịch ra sao"
    ms: "Menerangkan cara virus mengelak sistem imun"
    id: "Menjelaskan cara virus menghindari sistem imun"
    hi: "वायरस इम्यून सिस्टम से कैसे बचते हैं, समझाना"
  - en: "Choose suitable tools to investigate an outbreak"
    zh: "选合适的方法调查病毒暴发"
    zh-TW: "選合適的方法調查疫情爆發"
    ja: "流行を調べるのに適した手法を選ぶ"
    ko: "유행 조사에 알맞은 도구 고르기"
    vi: "Chọn công cụ phù hợp để điều tra một đợt bùng phát"
    ms: "Memilih alat yang sesuai untuk menyiasat wabak"
    id: "Memilih alat yang tepat untuk menyelidiki wabah"
    hi: "प्रकोप की जाँच के लिए सही साधन चुनना"
