code: EVSC20008
year: 2026
learn:
  en: "An 8-day field trip mapping landforms, rocks, soils and fossils, combined with satellite imagery."
  zh: "为期8天的野外考察，结合卫星影像绘制地貌、岩石、土壤和化石。"
  zh-TW: "為期8天的野外考察，結合衛星影像繪製地貌、岩石、土壤和化石。"
  ja: "8日間の野外実習で、衛星画像も使い地形・岩石・土壌・化石を地図化する。"
  ko: "8일간 야외 답사로 위성영상과 함께 지형·암석·토양·화석을 지도화한다."
  vi: "Chuyến thực địa 8 ngày lập bản đồ địa hình, đá, đất và hóa thạch, kết hợp ảnh vệ tinh."
  ms: "Lawatan lapangan 8 hari memetakan bentuk muka bumi, batuan, tanih dan fosil dengan imej satelit."
  id: "Kunjungan lapangan 8 hari memetakan bentang alam, batuan, tanah, dan fosil dengan citra satelit."
  hi: "8 दिन की फ़ील्ड ट्रिप: सैटेलाइट इमेजरी के साथ भू-आकृतियों, चट्टानों, मिट्टी और जीवाश्मों की मैपिंग।"
outcomes:
  - en: "Map landscapes in the field"
    zh: "在野外绘制地貌图"
    zh-TW: "在野外繪製地貌圖"
    ja: "野外で地形を地図化する"
    ko: "야외에서 지형을 지도화한다"
    vi: "Lập bản đồ cảnh quan ngoài thực địa"
    ms: "Petakan landskap di lapangan"
    id: "Memetakan bentang alam di lapangan"
    hi: "फ़ील्ड में भू-दृश्य की मैपिंग करना"
  - en: "Interpret an area's geological history"
    zh: "解读一个地区的地质历史"
    zh-TW: "解讀一個地區的地質歷史"
    ja: "地域の地質史を読み解く"
    ko: "지역의 지질 역사를 해석한다"
    vi: "Diễn giải lịch sử địa chất một vùng"
    ms: "Tafsir sejarah geologi sesuatu kawasan"
    id: "Menafsirkan sejarah geologi suatu wilayah"
    hi: "किसी क्षेत्र का भूवैज्ञानिक इतिहास समझना"
