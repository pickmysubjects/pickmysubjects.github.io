code: ABPL90289
year: 2027
learn:
  en: "Architecture after modernism: postmodernism, regionalism, deconstruction, sustainability and globalisation."
  zh: "现代主义之后的建筑：后现代主义、地域主义、解构、可持续和全球化。"
  zh-TW: "現代主義之後的建築：後現代主義、地域主義、解構、永續和全球化。"
  ja: "モダニズム以後の建築：ポストモダン、地域主義、脱構築、持続可能性、グローバル化。"
  ko: "모더니즘 이후 건축: 포스트모더니즘, 지역주의, 해체주의, 지속가능성, 세계화."
  vi: "Kiến trúc sau chủ nghĩa hiện đại: hậu hiện đại, địa phương, giải cấu trúc, bền vững và toàn cầu hóa."
  ms: "Seni bina selepas modenisme: pascamoden, regionalisme, dekonstruksi, kelestarian dan globalisasi."
  id: "Arsitektur setelah modernisme: postmodernisme, regionalisme, dekonstruksi, keberlanjutan, dan globalisasi."
  hi: "आधुनिकतावाद के बाद की वास्तुकला: उत्तर-आधुनिकतावाद, क्षेत्रवाद, विखंडन, स्थिरता और वैश्वीकरण।"
outcomes:
  - en: "Place buildings in their social and political context"
    zh: "把建筑放回其社会与政治背景中理解"
    zh-TW: "把建築放回其社會與政治背景中理解"
    ja: "建築を社会・政治的文脈に位置づける"
    ko: "건축을 사회·정치적 맥락에서 이해하기"
    vi: "Đặt công trình vào bối cảnh xã hội và chính trị"
    ms: "Meletakkan bangunan dalam konteks sosial dan politik"
    id: "Menempatkan bangunan dalam konteks sosial dan politik"
    hi: "भवनों को सामाजिक-राजनीतिक संदर्भ में रखना"
  - en: "Write a research essay on architecture"
    zh: "撰写一篇建筑研究论文"
    zh-TW: "撰寫一篇建築研究論文"
    ja: "建築の研究エッセイを書く"
    ko: "건축 연구 에세이 쓰기"
    vi: "Viết bài luận nghiên cứu về kiến trúc"
    ms: "Menulis esei penyelidikan tentang seni bina"
    id: "Menulis esai riset tentang arsitektur"
    hi: "वास्तुकला पर शोध निबंध लिखना"
