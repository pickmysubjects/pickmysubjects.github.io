code: COMP90051
year: 2027
learn:
  en: "The maths and methods of machine learning: supervised and unsupervised learning, kernels, graphical models, neural nets."
  zh: "机器学习的数学与方法：监督与无监督学习、核方法、图模型、神经网络。"
  zh-TW: "機器學習的數學與方法：監督與非監督學習、核方法、圖模型、神經網路。"
  ja: "機械学習の数理と手法：教師あり・なし学習、カーネル法、グラフィカルモデル、ニューラルネット。"
  ko: "기계학습의 수학과 방법: 지도·비지도 학습, 커널, 그래프 모델, 신경망."
  vi: "Toán và phương pháp học máy: có/không giám sát, kernel, mô hình đồ thị, mạng nơ-ron."
  ms: "Matematik dan kaedah pembelajaran mesin: berselia, tanpa selia, kernel, model grafik, rangkaian neural."
  id: "Matematika dan metode pembelajaran mesin: terawasi, tak terawasi, kernel, model grafis, jaringan saraf."
  hi: "मशीन लर्निंग का गणित और विधियाँ: सुपरवाइज़्ड, अनसुपरवाइज़्ड, कर्नेल, ग्राफ़िकल मॉडल, न्यूरल नेट।"
outcomes:
  - en: "Explain the theory behind common learning methods"
    zh: "解释常见学习方法背后的理论"
    zh-TW: "解釋常見學習方法背後的理論"
    ja: "主な学習手法の理論を説明する"
    ko: "주요 학습 방법의 이론 설명하기"
    vi: "Giải thích lý thuyết của các phương pháp học phổ biến"
    ms: "Terangkan teori kaedah pembelajaran biasa"
    id: "Menjelaskan teori metode pembelajaran umum"
    hi: "आम लर्निंग विधियों का सिद्धांत समझाना"
  - en: "Apply and evaluate learning methods on real data"
    zh: "在真实数据上应用并评估学习方法"
    zh-TW: "在真實資料上應用並評估學習方法"
    ja: "実データで手法を適用・評価する"
    ko: "실제 데이터에 적용하고 평가하기"
    vi: "Áp dụng và đánh giá phương pháp trên dữ liệu thật"
    ms: "Guna dan nilai kaedah pada data sebenar"
    id: "Menerapkan dan mengevaluasi metode pada data nyata"
    hi: "असली डेटा पर विधियाँ लागू और मूल्यांकन करना"
