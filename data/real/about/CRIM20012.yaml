code: CRIM20012
year: 2026
learn:
  en: "How young people meet crime and justice as victims, offenders and targets of social control, and how society has responded."
  zh: "青少年作为受害者、犯罪者和社会控制对象如何接触犯罪与司法，以及社会的应对。"
  zh-TW: "青少年作為受害者、犯罪者和社會控制對象如何接觸犯罪與司法，以及社會的回應。"
  ja: "若者が被害者・加害者・社会統制の対象として犯罪や司法とどう関わり、社会がどう対応してきたかを学ぶ。"
  ko: "청소년이 피해자, 가해자, 사회 통제의 대상으로서 범죄와 사법을 어떻게 겪는지, 사회가 어떻게 대응해 왔는지 배운다."
  vi: "Thanh thiếu niên gặp tội phạm và tư pháp ra sao với tư cách nạn nhân, người phạm tội và đối tượng kiểm soát xã hội."
  ms: "Cara golongan muda berdepan jenayah dan keadilan sebagai mangsa, pesalah dan sasaran kawalan sosial."
  id: "Cara anak muda bersinggungan dengan kejahatan dan peradilan sebagai korban, pelaku, dan sasaran kontrol sosial."
  hi: "युवा पीड़ित, अपराधी और सामाजिक नियंत्रण के निशाने के रूप में अपराध और न्याय से कैसे जुड़ते हैं, और समाज ने क्या किया।"
outcomes:
  - en: "Explain how youth is treated as a site of risk and control"
    zh: "说明青少年为何被视为风险与控制的对象"
    zh-TW: "說明青少年為何被視為風險與控制的對象"
    ja: "若者がリスクと統制の対象とされる理由を説明する"
    ko: "청소년이 위험과 통제의 대상으로 여겨지는 방식 설명하기"
    vi: "Giải thích vì sao tuổi trẻ bị xem là đối tượng rủi ro và kiểm soát"
    ms: "Terangkan bagaimana belia dilihat sebagai sumber risiko dan kawalan"
    id: "Menjelaskan mengapa remaja dipandang sebagai sasaran risiko dan kontrol"
    hi: "समझाना कि युवाओं को जोखिम और नियंत्रण के नज़रिए से कैसे देखा जाता है"
  - en: "Trace shifts in how society responds to youth crime"
    zh: "梳理社会应对青少年犯罪方式的变化"
    zh-TW: "梳理社會回應青少年犯罪方式的變化"
    ja: "少年犯罪への社会の対応の変化をたどる"
    ko: "청소년 범죄에 대한 사회 대응의 변화 추적하기"
    vi: "Lần theo thay đổi trong cách xã hội ứng phó tội phạm vị thành niên"
    ms: "Jejaki perubahan cara masyarakat menangani jenayah belia"
    id: "Menelusuri perubahan cara masyarakat menangani kejahatan remaja"
    hi: "युवा अपराध पर समाज की प्रतिक्रिया में आए बदलावों को समझना"
  - en: "Discuss current debates on youth justice"
    zh: "讨论当前关于青少年司法的争论"
    zh-TW: "討論當前關於少年司法的爭論"
    ja: "少年司法をめぐる今の論争を論じる"
    ko: "소년 사법에 관한 현재 논쟁 토론하기"
    vi: "Thảo luận các tranh luận hiện nay về tư pháp người chưa thành niên"
    ms: "Bincangkan perdebatan semasa tentang keadilan juvana"
    id: "Membahas perdebatan terkini soal peradilan anak"
    hi: "किशोर न्याय पर मौजूदा बहसों पर चर्चा करना"
