code: INFO10001
year: 2026
learn:
  en: "Designing apps and technology that people find useful and easy to use, starting from users' needs."
  zh: "从用户需求出发，设计有用又好用的应用和产品。"
  zh-TW: "從使用者需求出發，設計有用又好用的應用程式和產品。"
  ja: "ユーザーのニーズから出発し、役に立って使いやすいアプリや技術を設計する。"
  ko: "사용자 요구에서 출발해 유용하고 쓰기 쉬운 앱과 기술을 설계한다."
  vi: "Thiết kế ứng dụng và công nghệ hữu ích, dễ dùng, bắt đầu từ nhu cầu người dùng."
  ms: "Mereka aplikasi dan teknologi yang berguna dan mudah digunakan, bermula dari keperluan pengguna."
  id: "Merancang aplikasi dan teknologi yang berguna dan mudah dipakai, berangkat dari kebutuhan pengguna."
  hi: "यूज़र की ज़रूरतों से शुरू करके उपयोगी और आसान ऐप व टेक्नोलॉजी डिज़ाइन करना।"
outcomes:
  - en: "Interview users to find out what they need"
    zh: "通过访谈了解用户需求"
    zh-TW: "透過訪談了解使用者需求"
    ja: "ユーザーにインタビューしてニーズを探る"
    ko: "사용자 인터뷰로 요구 파악"
    vi: "Phỏng vấn người dùng để biết họ cần gì"
    ms: "Temu bual pengguna untuk tahu keperluan mereka"
    id: "Mewawancarai pengguna untuk tahu kebutuhannya"
    hi: "यूज़र से इंटरव्यू करके उनकी ज़रूरत जानना"
  - en: "Build prototypes and apply design principles"
    zh: "做原型并运用设计原则"
    zh-TW: "做原型並運用設計原則"
    ja: "プロトタイプを作り、デザイン原則を適用する"
    ko: "프로토타입 제작과 디자인 원칙 적용"
    vi: "Làm prototype và áp dụng nguyên tắc thiết kế"
    ms: "Bina prototaip dan guna prinsip reka bentuk"
    id: "Membuat prototipe dan menerapkan prinsip desain"
    hi: "प्रोटोटाइप बनाना और डिज़ाइन सिद्धांत लगाना"
  - en: "Present and justify design decisions"
    zh: "展示并说明设计决策"
    zh-TW: "展示並說明設計決策"
    ja: "デザインの判断を発表し根拠を示す"
    ko: "디자인 결정 발표 및 근거 제시"
    vi: "Trình bày và lý giải quyết định thiết kế"
    ms: "Bentang dan wajarkan keputusan reka bentuk"
    id: "Mempresentasikan dan menjelaskan keputusan desain"
    hi: "डिज़ाइन फ़ैसले पेश करना और उनका कारण बताना"
