code: MAST20029
year: 2026
learn:
  en: "Maths for engineers: vector calculus, differential equations, Laplace transforms and Fourier series."
  zh: "工程数学：向量微积分、微分方程、拉普拉斯变换和傅里叶级数"
  zh-TW: "工程數學：向量微積分、微分方程、拉普拉斯轉換和傅立葉級數"
  ja: "工学のための数学：ベクトル解析、微分方程式、ラプラス変換、フーリエ級数。"
  ko: "공학용 수학: 벡터 미적분, 미분방정식, 라플라스 변환, 푸리에 급수."
  vi: "Toán cho kỹ sư: giải tích vectơ, phương trình vi phân, biến đổi Laplace, chuỗi Fourier."
  ms: "Matematik untuk jurutera: kalkulus vektor, persamaan pembezaan, jelmaan Laplace dan siri Fourier."
  id: "Matematika untuk insinyur: kalkulus vektor, persamaan diferensial, transformasi Laplace, deret Fourier."
  hi: "इंजीनियरों के लिए गणित: वेक्टर कैलकुलस, अवकल समीकरण, लाप्लास रूपांतरण और फूरियर श्रेणी।"
outcomes:
  - en: "Solve ODEs with Laplace transforms"
    zh: "用拉普拉斯变换解常微分方程"
    zh-TW: "用拉普拉斯轉換解常微分方程"
    ja: "ラプラス変換で常微分方程式を解く"
    ko: "라플라스 변환으로 상미분방정식 풀기"
    vi: "Giải PTVP thường bằng biến đổi Laplace"
    ms: "Menyelesaikan PPB dengan jelmaan Laplace"
    id: "Menyelesaikan PDB dengan transformasi Laplace"
    hi: "लाप्लास रूपांतरण से ODE हल करना"
  - en: "Solve PDEs by separation of variables"
    zh: "用分离变量法解偏微分方程"
    zh-TW: "用分離變數法解偏微分方程"
    ja: "変数分離法で偏微分方程式を解く"
    ko: "변수분리법으로 편미분방정식 풀기"
    vi: "Giải PTĐHR bằng tách biến"
    ms: "Menyelesaikan PPS dengan pemisahan pemboleh ubah"
    id: "Menyelesaikan PDP dengan pemisahan variabel"
    hi: "चर-पृथक्करण से PDE हल करना"
  - en: "Write functions as Fourier series"
    zh: "把函数展开为傅里叶级数"
    zh-TW: "把函數展開為傅立葉級數"
    ja: "関数をフーリエ級数で表す"
    ko: "함수를 푸리에 급수로 나타내기"
    vi: "Biểu diễn hàm bằng chuỗi Fourier"
    ms: "Mewakili fungsi dengan siri Fourier"
    id: "Menyatakan fungsi sebagai deret Fourier"
    hi: "फ़ंक्शन को फूरियर श्रेणी में लिखना"
