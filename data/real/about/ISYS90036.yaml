code: ISYS90036
year: 2027
learn:
  en: "What ERP, CRM and supply chain systems do, how they are rolled out, and how firms get value from them."
  zh: "ERP、CRM 和供应链等企业系统的作用、实施方式，以及企业如何从中获益。"
  zh-TW: "ERP、CRM 與供應鏈等企業系統的作用、導入方式，以及企業如何從中獲益。"
  ja: "ERP・CRM・SCMなどの企業システムの役割、導入方法、そして企業がそこから価値を得る方法。"
  ko: "ERP·CRM·공급망 시스템의 역할, 도입 방법, 기업이 이를 통해 가치를 얻는 방법."
  vi: "ERP, CRM, hệ thống chuỗi cung ứng làm gì, triển khai ra sao và doanh nghiệp thu lợi từ chúng thế nào."
  ms: "Fungsi sistem ERP, CRM dan rantaian bekalan, cara ia dilaksanakan dan cara firma mendapat nilai daripadanya."
  id: "Fungsi sistem ERP, CRM, dan rantai pasok, cara penerapannya, dan cara perusahaan mendapat nilai darinya."
  hi: "ERP, CRM और सप्लाई चेन सिस्टम क्या करते हैं, कैसे लागू होते हैं और कंपनियाँ उनसे फ़ायदा कैसे उठाती हैं।"
outcomes:
  - en: "Explain how enterprise systems link processes and data"
    zh: "说明企业系统如何打通流程与数据"
    zh-TW: "說明企業系統如何串連流程與資料"
    ja: "企業システムが業務プロセスとデータをつなぐ仕組みを説明する"
    ko: "기업 시스템이 프로세스와 데이터를 잇는 방식 설명하기"
    vi: "Giải thích hệ thống doanh nghiệp kết nối quy trình và dữ liệu"
    ms: "Menerangkan cara sistem perusahaan menghubungkan proses dan data"
    id: "Menjelaskan cara sistem perusahaan menghubungkan proses dan data"
    hi: "समझाना कि एंटरप्राइज़ सिस्टम प्रक्रियाओं और डेटा को कैसे जोड़ते हैं"
  - en: "Plan an enterprise system rollout, including multi-site"
    zh: "规划企业系统的实施，包括多地点部署"
    zh-TW: "規劃企業系統的導入，包括多據點部署"
    ja: "複数拠点を含む企業システム導入を計画する"
    ko: "다중 사업장을 포함한 기업 시스템 도입 계획하기"
    vi: "Lập kế hoạch triển khai hệ thống, kể cả nhiều địa điểm"
    ms: "Merancang pelaksanaan sistem, termasuk di banyak lokasi"
    id: "Merencanakan penerapan sistem, termasuk di banyak lokasi"
    hi: "कई साइटों सहित एंटरप्राइज़ सिस्टम लागू करने की योजना बनाना"
