code: ABPL90422
year: 2027
learn:
  en: "A digital design elective using laser scanning, photography, film and AR/VR to analyse and represent space."
  zh: "数字设计选修课，用激光扫描、摄影、影片和AR/VR分析并表现空间。"
  zh-TW: "數位設計選修課，用雷射掃描、攝影、影片和AR/VR分析並表現空間。"
  ja: "レーザースキャン、写真、映像、AR/VRで空間を分析・表現するデジタル設計の選択科目。"
  ko: "레이저 스캔, 사진, 영상, AR/VR로 공간을 분석·표현하는 디지털 설계 선택과목."
  vi: "Môn thiết kế số dùng quét laser, ảnh, phim và AR/VR để phân tích và thể hiện không gian."
  ms: "Elektif reka bentuk digital dengan imbasan laser, fotografi, filem dan AR/VR untuk ruang."
  id: "Elektif desain digital dengan pemindaian laser, fotografi, film, dan AR/VR untuk ruang."
  hi: "लेज़र स्कैनिंग, फ़ोटोग्राफ़ी, फ़िल्म और AR/VR से स्थान का विश्लेषण व प्रस्तुति वाला ऐच्छिक।"
outcomes:
  - en: "Analyse space with 3D imaging"
    zh: "用三维成像分析空间"
    zh-TW: "用三維成像分析空間"
    ja: "3Dイメージングで空間を分析する"
    ko: "3D 이미징으로 공간 분석하기"
    vi: "Phân tích không gian bằng hình ảnh 3D"
    ms: "Menganalisis ruang dengan pengimejan 3D"
    id: "Menganalisis ruang dengan pencitraan 3D"
    hi: "3D इमेजिंग से स्थान का विश्लेषण"
  - en: "Create a resolved digital design piece"
    zh: "完成一件成熟的数字设计作品"
    zh-TW: "完成一件成熟的數位設計作品"
    ja: "完成度の高いデジタル作品をつくる"
    ko: "완성도 높은 디지털 작품 만들기"
    vi: "Tạo sản phẩm thiết kế số hoàn chỉnh"
    ms: "Menghasilkan karya reka bentuk digital lengkap"
    id: "Membuat karya desain digital yang matang"
    hi: "परिपक्व डिजिटल डिज़ाइन कृति बनाना"
