code: ECON30020
year: 2026
learn:
  en: "The maths economists use: calculus, linear algebra and constrained optimisation applied to economic problems."
  zh: "经济学用到的数学：微积分、线性代数和约束优化。"
  zh-TW: "經濟學用到的數學：微積分、線性代數和限制條件下的最佳化。"
  ja: "経済学で使う数学：微積分、線形代数、制約付き最適化を経済問題に応用。"
  ko: "경제학에서 쓰는 수학: 미적분, 선형대수, 제약 최적화를 경제 문제에 적용."
  vi: "Toán học cho kinh tế: giải tích, đại số tuyến tính và tối ưu có ràng buộc áp dụng vào bài toán kinh tế."
  ms: "Matematik untuk ahli ekonomi: kalkulus, aljabar linear dan pengoptimuman berkekangan untuk masalah ekonomi."
  id: "Matematika untuk ekonom: kalkulus, aljabar linear, dan optimasi berkendala untuk masalah ekonomi."
  hi: "अर्थशास्त्र में काम आने वाला गणित: कैलकुलस, लीनियर अलजेब्रा और बंधित ऑप्टिमाइज़ेशन, आर्थिक समस्याओं पर।"
outcomes:
  - en: "Set up and solve utility, profit and cost problems"
    zh: "建立并求解效用、利润和成本问题"
    zh-TW: "建立並求解效用、利潤和成本問題"
    ja: "効用・利潤・費用の最適化問題を立てて解く"
    ko: "효용·이윤·비용 문제 세우고 풀기"
    vi: "Thiết lập và giải bài toán lợi ích, lợi nhuận, chi phí"
    ms: "Bina dan selesaikan masalah utiliti, untung dan kos"
    id: "Menyusun dan menyelesaikan masalah utilitas, laba, dan biaya"
    hi: "यूटिलिटी, मुनाफ़ा और लागत की समस्याएँ बनाना और हल करना"
  - en: "Solve Lagrange and Kuhn-Tucker problems"
    zh: "求解拉格朗日和库恩-塔克问题"
    zh-TW: "求解拉格朗日和庫恩-塔克問題"
    ja: "ラグランジュやクーン・タッカー問題を解く"
    ko: "라그랑주·쿤-터커 문제 풀기"
    vi: "Giải bài toán Lagrange và Kuhn-Tucker"
    ms: "Selesaikan masalah Lagrange dan Kuhn-Tucker"
    id: "Menyelesaikan masalah Lagrange dan Kuhn-Tucker"
    hi: "लैग्रांज और कुन-टकर समस्याएँ हल करना"
  - en: "Do matrix algebra and comparative statics"
    zh: "掌握矩阵代数和比较静态分析"
    zh-TW: "掌握矩陣代數和比較靜態分析"
    ja: "行列計算と比較静学ができる"
    ko: "행렬 대수와 비교정학 다루기"
    vi: "Làm đại số ma trận và tĩnh học so sánh"
    ms: "Buat aljabar matriks dan statik perbandingan"
    id: "Mengerjakan aljabar matriks dan statika komparatif"
    hi: "मैट्रिक्स अलजेब्रा और कम्पैरेटिव स्टैटिक्स करना"
