code: COMP90025
year: 2027
learn:
  en: "Parallel algorithms and how to analyse them, across architectures and tools like OpenMP and MPI."
  zh: "并行算法及其分析，涵盖多种架构以及 OpenMP、MPI 等工具。"
  zh-TW: "平行演算法及其分析，涵蓋多種架構與 OpenMP、MPI 等工具。"
  ja: "並列アルゴリズムとその解析を、各種アーキテクチャや OpenMP・MPI で学ぶ。"
  ko: "병렬 알고리즘과 분석, 다양한 아키텍처와 OpenMP·MPI 같은 도구."
  vi: "Thuật toán song song và cách phân tích, trên nhiều kiến trúc và công cụ như OpenMP, MPI."
  ms: "Algoritma selari dan analisisnya, merentas seni bina serta alat seperti OpenMP dan MPI."
  id: "Algoritma paralel dan analisisnya, di berbagai arsitektur serta alat seperti OpenMP dan MPI."
  hi: "पैरेलल एल्गोरिद्म और उनका विश्लेषण, अलग आर्किटेक्चर और OpenMP, MPI जैसे टूल के साथ।"
outcomes:
  - en: "Analyse the speed and cost of parallel algorithms"
    zh: "分析并行算法的速度与开销"
    zh-TW: "分析平行演算法的速度與成本"
    ja: "並列アルゴリズムの速度とコストを分析する"
    ko: "병렬 알고리즘의 속도·비용 분석하기"
    vi: "Phân tích tốc độ và chi phí của thuật toán song song"
    ms: "Analisis kelajuan dan kos algoritma selari"
    id: "Menganalisis kecepatan dan biaya algoritma paralel"
    hi: "पैरेलल एल्गोरिद्म की गति और लागत का विश्लेषण"
  - en: "Write parallel programs with OpenMP or MPI"
    zh: "用 OpenMP 或 MPI 编写并行程序"
    zh-TW: "用 OpenMP 或 MPI 撰寫平行程式"
    ja: "OpenMP や MPI で並列プログラムを書く"
    ko: "OpenMP나 MPI로 병렬 프로그램 작성하기"
    vi: "Viết chương trình song song bằng OpenMP hoặc MPI"
    ms: "Tulis program selari dengan OpenMP atau MPI"
    id: "Menulis program paralel dengan OpenMP atau MPI"
    hi: "OpenMP या MPI से पैरेलल प्रोग्राम लिखना"
