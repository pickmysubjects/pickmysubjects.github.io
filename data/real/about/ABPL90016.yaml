code: ABPL90016
year: 2027
learn:
  en: "Managing property assets over their whole life: condition, obsolescence, maintenance, finance, tax and risk."
  zh: "全寿命周期的物业资产管理：状况、老化、维护、融资、税务和风险。"
  zh-TW: "全生命週期的不動產資產管理：狀況、老化、維護、融資、稅務與風險。"
  ja: "ライフサイクルを通じた不動産資産管理：劣化、陳腐化、保全、財務、税、リスク。"
  ko: "생애주기 부동산 자산관리: 상태, 노후화, 유지보수, 금융, 세금, 위험."
  vi: "Quản lý tài sản bất động sản suốt vòng đời: tình trạng, lỗi thời, bảo trì, tài chính, thuế, rủi ro."
  ms: "Pengurusan aset hartanah sepanjang hayat: keadaan, keusangan, penyelenggaraan, kewangan dan risiko."
  id: "Manajemen aset properti sepanjang umur: kondisi, keusangan, pemeliharaan, keuangan dan risiko."
  hi: "पूरे जीवनकाल में संपत्ति परिसंपत्ति प्रबंधन: स्थिति, अप्रचलन, रखरखाव, वित्त, कर और जोखिम।"
outcomes:
  - en: "Analyse the financial side of asset management"
    zh: "分析资产管理的财务方面"
    zh-TW: "分析資產管理的財務面"
    ja: "資産管理の財務面を分析する"
    ko: "자산관리의 재무 측면 분석하기"
    vi: "Phân tích khía cạnh tài chính của quản lý tài sản"
    ms: "Menganalisis aspek kewangan pengurusan aset"
    id: "Menganalisis sisi keuangan manajemen aset"
    hi: "परिसंपत्ति प्रबंधन के वित्तीय पक्ष का विश्लेषण"
  - en: "Do quantitative analysis of whole buildings"
    zh: "对整栋建筑做定量分析"
    zh-TW: "對整棟建築做量化分析"
    ja: "建物全体を定量的に分析する"
    ko: "건물 전체를 정량 분석하기"
    vi: "Phân tích định lượng toàn bộ tòa nhà"
    ms: "Membuat analisis kuantitatif seluruh bangunan"
    id: "Melakukan analisis kuantitatif seluruh bangunan"
    hi: "पूरी इमारत का मात्रात्मक विश्लेषण"
