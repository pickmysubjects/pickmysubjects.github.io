code: ITAL20011
year: 2026
learn:
  en: "Italian for students who finished Italian 4: lots of reading and listening, with a focus on gender and inclusive language."
  zh: "适合学完意大利语 4 的学生：大量读和听，重点是性别与包容性语言。"
  zh-TW: "適合學完義大利語 4 的學生：大量讀和聽，重點是性別與包容性語言。"
  ja: "イタリア語4を終えた学生向け。多くの読解と聴解、ジェンダーと包摂的な言葉遣いに注目。"
  ko: "이탈리아어 4를 마친 학생 대상. 많이 읽고 들으며 성별과 포용적 언어에 주목한다."
  vi: "Tiếng Ý cho ai đã học xong Italian 4: đọc, nghe nhiều, chú trọng giới và ngôn ngữ hòa nhập."
  ms: "Bahasa Itali untuk yang tamat Italian 4: banyak membaca dan mendengar, fokus pada gender dan bahasa inklusif."
  id: "Bahasa Italia untuk yang lulus Italian 4: banyak membaca dan menyimak, fokus pada gender dan bahasa inklusif."
  hi: "इतालवी 4 पूरा कर चुके छात्रों के लिए: ख़ूब पढ़ना-सुनना, लिंग और समावेशी भाषा पर ध्यान।"
outcomes:
  - en: "Discuss social and cultural topics in Italian"
    zh: "用意大利语讨论社会和文化话题"
    zh-TW: "用義大利語討論社會和文化話題"
    ja: "社会や文化の話題をイタリア語で話し合う"
    ko: "사회·문화 주제를 이탈리아어로 토론하기"
    vi: "Thảo luận chủ đề xã hội, văn hóa bằng tiếng Ý"
    ms: "Bincangkan topik sosial dan budaya dalam bahasa Itali"
    id: "Membahas topik sosial dan budaya dalam bahasa Italia"
    hi: "सामाजिक और सांस्कृतिक विषयों पर इतालवी में चर्चा करना"
  - en: "Read and write longer Italian texts"
    zh: "读写较长的意大利语文章"
    zh-TW: "讀寫較長的義大利語文章"
    ja: "長めのイタリア語の文章を読み書きする"
    ko: "긴 이탈리아어 글 읽고 쓰기"
    vi: "Đọc và viết văn bản tiếng Ý dài hơn"
    ms: "Baca dan tulis teks bahasa Itali yang lebih panjang"
    id: "Membaca dan menulis teks bahasa Italia yang lebih panjang"
    hi: "लंबे इतालवी पाठ पढ़ना-लिखना"
  - en: "Give a clear presentation in Italian"
    zh: "用意大利语做清楚的口头报告"
    zh-TW: "用義大利語做清楚的口頭報告"
    ja: "イタリア語で分かりやすく発表する"
    ko: "이탈리아어로 명확하게 발표하기"
    vi: "Thuyết trình rõ ràng bằng tiếng Ý"
    ms: "Buat pembentangan yang jelas dalam bahasa Itali"
    id: "Melakukan presentasi yang jelas dalam bahasa Italia"
    hi: "इतालवी में स्पष्ट प्रस्तुति देना"
