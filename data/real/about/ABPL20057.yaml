code: ABPL20057
year: 2026
learn:
  en: "A game design studio on a steampunk theme: level and narrative design, world mechanics and art direction in Unreal."
  zh: "以蒸汽朋克为主题的游戏设计工作室：在Unreal中做关卡、叙事、世界机制与美术指导。"
  zh-TW: "以蒸汽龐克為主題的遊戲設計工作室：在 Unreal 中做關卡、敘事、世界機制與美術指導。"
  ja: "スチームパンクを題材にしたゲームデザインスタジオ：Unrealでレベル、物語、ワールドの仕組み、アートディレクション。"
  ko: "스팀펑크 주제의 게임 디자인 스튜디오: Unreal로 레벨·내러티브·월드 메커닉·아트 디렉션."
  vi: "Studio thiết kế game chủ đề steampunk: thiết kế màn chơi, cốt truyện, cơ chế thế giới, chỉ đạo mỹ thuật trên Unreal."
  ms: "Studio reka permainan bertema steampunk: reka tahap, naratif, mekanik dunia dan arahan seni dalam Unreal."
  id: "Studio desain game bertema steampunk: desain level, narasi, mekanika dunia, dan arahan seni di Unreal."
  hi: "स्टीमपंक थीम वाला गेम डिज़ाइन स्टूडियो: Unreal में लेवल, कहानी, गेम-वर्ल्ड मैकेनिक्स और आर्ट डायरेक्शन।"
outcomes:
  - en: "Design game world and movement mechanics"
    zh: "设计游戏世界与移动机制"
    zh-TW: "設計遊戲世界與移動機制"
    ja: "ゲームワールドと移動の仕組みを設計する"
    ko: "게임 월드와 이동 메커닉 설계하기"
    vi: "Thiết kế thế giới game và cơ chế di chuyển"
    ms: "Reka dunia permainan dan mekanik pergerakan"
    id: "Merancang dunia game dan mekanika gerak"
    hi: "गेम-वर्ल्ड और मूवमेंट मैकेनिक्स डिज़ाइन करना"
  - en: "Improve a game design through playtests and critique"
    zh: "通过试玩与评图改进游戏设计"
    zh-TW: "透過試玩與評圖改進遊戲設計"
    ja: "試遊と講評でゲームを改善する"
    ko: "플레이테스트와 비평으로 게임 개선하기"
    vi: "Cải thiện thiết kế game qua chơi thử và góp ý"
    ms: "Baiki reka bentuk permainan melalui ujian main dan kritikan"
    id: "Memperbaiki desain game lewat uji main dan kritik"
    hi: "प्लेटेस्ट और समीक्षा से गेम डिज़ाइन सुधारना"
  - en: "Pitch a game with design documents and a build"
    zh: "用设计文档和可玩版本推介游戏"
    zh-TW: "用設計文件和可玩版本推介遊戲"
    ja: "設計書とビルドでゲームを提案する"
    ko: "기획 문서와 빌드로 게임 피칭하기"
    vi: "Thuyết trình game bằng tài liệu thiết kế và bản chơi"
    ms: "Pitch permainan dengan dokumen reka bentuk dan binaan"
    id: "Mempresentasikan game dengan dokumen desain dan build"
    hi: "डिज़ाइन दस्तावेज़ और बिल्ड से गेम पिच करना"
