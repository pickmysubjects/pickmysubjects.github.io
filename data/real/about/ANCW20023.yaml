code: ANCW20023
year: 2026
learn:
  en: "The third ancient Egyptian course, focused on the verb system, to start translating hieroglyphic texts on your own."
  zh: "古埃及语第三阶段，重点学习动词体系，开始独立翻译象形文字文本。"
  zh-TW: "古埃及語第三階段，重點學習動詞體系，開始獨立翻譯象形文字文本。"
  ja: "古代エジプト語の第3段階。動詞体系を中心に学び、ヒエログリフを自分で訳し始める。"
  ko: "고대 이집트어 3단계: 동사 체계를 중심으로 배우며 상형문자 글을 스스로 번역하기 시작한다."
  vi: "Khóa tiếng Ai Cập cổ thứ ba, tập trung vào hệ thống động từ, để bắt đầu tự dịch văn bản tượng hình."
  ms: "Kursus ketiga bahasa Mesir kuno, tertumpu pada sistem kata kerja, untuk mula menterjemah teks hieroglif sendiri."
  id: "Kursus ketiga bahasa Mesir kuno, fokus pada sistem verba, untuk mulai menerjemahkan teks hieroglif sendiri."
  hi: "प्राचीन मिस्री का तीसरा कोर्स, क्रिया-व्यवस्था पर केंद्रित, ताकि खुद चित्रलिपि पाठों का अनुवाद शुरू कर सकें।"
outcomes:
  - en: "Explain the Egyptian verb system"
    zh: "解释古埃及语的动词体系"
    zh-TW: "解釋古埃及語的動詞體系"
    ja: "エジプト語の動詞体系を説明する"
    ko: "이집트어 동사 체계 설명하기"
    vi: "Giải thích hệ thống động từ tiếng Ai Cập"
    ms: "Terangkan sistem kata kerja bahasa Mesir"
    id: "Menjelaskan sistem verba bahasa Mesir"
    hi: "मिस्री क्रिया-व्यवस्था समझाना"
  - en: "Translate multi-sentence hieroglyphic texts"
    zh: "翻译多句的象形文字文本"
    zh-TW: "翻譯多句的象形文字文本"
    ja: "複数の文からなるヒエログリフを訳す"
    ko: "여러 문장의 상형문자 글 번역하기"
    vi: "Dịch văn bản tượng hình nhiều câu"
    ms: "Terjemah teks hieroglif berbilang ayat"
    id: "Menerjemahkan teks hieroglif beberapa kalimat"
    hi: "कई वाक्यों वाले चित्रलिपि पाठों का अनुवाद करना"
  - en: "Read texts critically and more independently"
    zh: "更独立、批判地阅读文本"
    zh-TW: "更獨立、批判地閱讀文本"
    ja: "より自立して批判的に文章を読む"
    ko: "글을 더 독립적·비판적으로 읽기"
    vi: "Đọc văn bản một cách độc lập và phản biện hơn"
    ms: "Baca teks secara kritis dan lebih berdikari"
    id: "Membaca teks secara kritis dan lebih mandiri"
    hi: "पाठों को अधिक स्वतंत्र और आलोचनात्मक रूप से पढ़ना"
