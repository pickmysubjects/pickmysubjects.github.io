code: MAST30025
year: 2026
learn:
  en: "The theory behind linear models, the most widely used statistical models: estimation, testing and model checking."
  zh: "最常用的统计模型——线性模型背后的理论：估计、检验和模型诊断。"
  zh-TW: "最常用的統計模型——線性模型背後的理論：估計、檢定和模型診斷。"
  ja: "最もよく使われる統計モデルである線形モデルの理論：推定・検定・モデル診断。"
  ko: "가장 널리 쓰이는 통계 모델인 선형 모델의 이론: 추정, 검정, 모델 진단."
  vi: "Lý thuyết của mô hình tuyến tính, mô hình thống kê phổ biến nhất: ước lượng, kiểm định, kiểm tra mô hình."
  ms: "Teori di sebalik model linear, model statistik paling meluas: penganggaran, ujian dan semakan model."
  id: "Teori di balik model linear, model statistik paling umum: estimasi, pengujian, dan pemeriksaan model."
  hi: "सबसे ज़्यादा इस्तेमाल होने वाले रैखिक मॉडलों का सिद्धांत: अनुमान, परीक्षण और मॉडल जाँच।"
outcomes:
  - en: "Explain how linear models work and where they fall short"
    zh: "讲清线性模型的原理和局限"
    zh-TW: "講清楚線性模型的原理和局限"
    ja: "線形モデルの仕組みと限界を説明する"
    ko: "선형 모델의 원리와 한계 설명하기"
    vi: "Giải thích cách mô hình tuyến tính hoạt động và hạn chế của nó"
    ms: "Menerangkan cara model linear berfungsi dan kelemahannya"
    id: "Menjelaskan cara kerja model linear dan kekurangannya"
    hi: "रैखिक मॉडल कैसे काम करते हैं और कहाँ कमज़ोर हैं, समझाना"
  - en: "Fit linear models in statistics software and read the output"
    zh: "用统计软件拟合线性模型并解读结果"
    zh-TW: "用統計軟體擬合線性模型並解讀結果"
    ja: "統計ソフトで線形モデルを当てはめ結果を読む"
    ko: "통계 소프트웨어로 선형 모델 적합하고 결과 읽기"
    vi: "Khớp mô hình tuyến tính bằng phần mềm và đọc kết quả"
    ms: "Memadankan model linear dalam perisian statistik dan membaca output"
    id: "Mencocokkan model linear di software statistik dan membaca hasilnya"
    hi: "सॉफ्टवेयर में रैखिक मॉडल फिट करना और आउटपुट पढ़ना"
