code: INDO10001
year: 2026
learn:
  en: "Building your Indonesian with magazines, news and TV clips on youth culture, city life, family, ethnicity and religion."
  zh: "借助杂志、新闻和电视片段提升印尼语，话题有青年文化、城市、家庭、民族和宗教。"
  zh-TW: "借助雜誌、新聞和電視片段提升印尼語，話題有青年文化、城市、家庭、民族和宗教。"
  ja: "雑誌・ニュース・テレビ映像でインドネシア語を伸ばす。若者文化、都市、家族、民族、宗教。"
  ko: "잡지·뉴스·TV 클립으로 인도네시아어를 키운다. 청년 문화, 도시, 가족, 민족, 종교."
  vi: "Nâng tiếng Indonesia qua tạp chí, tin tức và clip truyền hình về giới trẻ, đô thị, gia đình, dân tộc và tôn giáo."
  ms: "Membina bahasa Indonesia melalui majalah, berita dan klip TV tentang budaya belia, bandar, keluarga, etnik dan agama."
  id: "Mengembangkan bahasa Indonesia lewat majalah, berita dan klip TV tentang budaya anak muda, kota, keluarga, etnis dan agama."
  hi: "पत्रिकाओं, ख़बरों और टीवी क्लिप से इंडोनेशियाई बढ़ाना: युवा संस्कृति, शहर, परिवार, जातीयता और धर्म।"
outcomes:
  - en: "Talk about familiar topics in Indonesian with more confidence"
    zh: "更自信地用印尼语谈论熟悉的话题"
    zh-TW: "更自信地用印尼語談論熟悉的話題"
    ja: "身近な話題をインドネシア語でより自信を持って話す"
    ko: "익숙한 주제를 인도네시아어로 더 자신 있게 말하기"
    vi: "Nói về chủ đề quen thuộc bằng tiếng Indonesia tự tin hơn"
    ms: "Bercakap tentang topik biasa dalam bahasa Indonesia dengan lebih yakin"
    id: "Membicarakan topik akrab dalam bahasa Indonesia dengan lebih percaya diri"
    hi: "परिचित विषयों पर इंडोनेशियाई में ज़्यादा आत्मविश्वास से बात करना"
  - en: "Read and write short Indonesian texts"
    zh: "读写简短的印尼语文章"
    zh-TW: "讀寫簡短的印尼語文章"
    ja: "短いインドネシア語の文章を読み書きする"
    ko: "짧은 인도네시아어 글 읽고 쓰기"
    vi: "Đọc và viết đoạn văn tiếng Indonesia ngắn"
    ms: "Baca dan tulis teks pendek bahasa Indonesia"
    id: "Membaca dan menulis teks pendek bahasa Indonesia"
    hi: "छोटे इंडोनेशियाई पाठ पढ़ना-लिखना"
  - en: "Use new grammar and vocabulary correctly"
    zh: "正确运用新语法和词汇"
    zh-TW: "正確運用新文法和詞彙"
    ja: "新しい文法と語彙を正しく使う"
    ko: "새 문법과 어휘를 정확히 쓰기"
    vi: "Dùng đúng ngữ pháp và từ vựng mới"
    ms: "Guna tatabahasa dan kosa kata baharu dengan betul"
    id: "Memakai tata bahasa dan kosakata baru dengan benar"
    hi: "नया व्याकरण और शब्दावली सही इस्तेमाल करना"
