code: MAST10014
year: 2026
learn:
  en: "Foundation maths for the Diploma of Science: algebra, functions, exponentials, logs and trigonometry."
  zh: "理学预科的基础数学：代数、函数、指数、对数和三角。"
  zh-TW: "理學預科的基礎數學：代數、函數、指數、對數和三角。"
  ja: "Diploma of Science向けの基礎数学：代数、関数、指数、対数、三角関数。"
  ko: "Diploma of Science를 위한 기초 수학: 대수, 함수, 지수, 로그, 삼각함수."
  vi: "Toán nền tảng cho Diploma of Science: đại số, hàm số, mũ, logarit và lượng giác."
  ms: "Matematik asas untuk Diploma of Science: aljabar, fungsi, eksponen, log dan trigonometri."
  id: "Matematika dasar untuk Diploma of Science: aljabar, fungsi, eksponen, logaritma, dan trigonometri."
  hi: "Diploma of Science के लिए बुनियादी गणित: अलजेब्रा, फ़ंक्शन, एक्सपोनेंशियल, लॉग और त्रिकोणमिति।"
outcomes:
  - en: "Solve linear and simultaneous equations"
    zh: "解一次方程和方程组"
    zh-TW: "解一次方程和聯立方程"
    ja: "一次方程式と連立方程式を解く"
    ko: "일차방정식과 연립방정식 풀기"
    vi: "Giải phương trình bậc nhất và hệ phương trình"
    ms: "Selesaikan persamaan linear dan serentak"
    id: "Menyelesaikan persamaan linear dan simultan"
    hi: "रैखिक और युगपत समीकरण हल करना"
  - en: "Sketch and transform graphs of functions"
    zh: "画函数图像并做变换"
    zh-TW: "畫函數圖形並做變換"
    ja: "関数のグラフを描き変換する"
    ko: "함수 그래프 그리기와 변환"
    vi: "Vẽ và biến đổi đồ thị hàm số"
    ms: "Lakar dan jelmakan graf fungsi"
    id: "Menggambar dan mentransformasi grafik fungsi"
    hi: "फ़ंक्शन के ग्राफ़ बनाना और रूपांतरित करना"
  - en: "Use maths models for real-world problems"
    zh: "用数学模型解决实际问题"
    zh-TW: "用數學模型解決實際問題"
    ja: "数学モデルで現実の問題に取り組む"
    ko: "수학 모형으로 실제 문제 해결"
    vi: "Dùng mô hình toán cho bài toán thực tế"
    ms: "Guna model matematik untuk masalah sebenar"
    id: "Memakai model matematika untuk masalah nyata"
    hi: "असली समस्याओं के लिए गणितीय मॉडल लगाना"
