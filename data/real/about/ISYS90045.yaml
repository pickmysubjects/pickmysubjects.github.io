code: ISYS90045
year: 2027
learn:
  en: "Consulting skills for IS professionals: understanding clients, setting expectations, giving advice and communicating well."
  zh: "信息系统从业者的咨询技能：理解客户、管理预期、提供建议和有效沟通。"
  zh-TW: "資訊系統從業人員的顧問技能：了解客戶、管理期望、提供建議與有效溝通。"
  ja: "IS専門家のためのコンサルティング力：顧客理解、期待値の調整、助言、伝え方。"
  ko: "IS 전문가를 위한 컨설팅 역량: 고객 이해, 기대치 조율, 조언, 효과적인 소통."
  vi: "Kỹ năng tư vấn cho người làm IS: hiểu khách hàng, đặt kỳ vọng, đưa lời khuyên, giao tiếp tốt."
  ms: "Kemahiran perundingan untuk profesional IS: memahami klien, menetapkan jangkaan, memberi nasihat, berkomunikasi."
  id: "Keterampilan konsultasi bagi profesional SI: memahami klien, mengatur ekspektasi, memberi saran, berkomunikasi."
  hi: "IS पेशेवरों के लिए कंसल्टिंग कौशल: क्लाइंट को समझना, अपेक्षाएँ तय करना, सलाह देना और अच्छा संवाद।"
outcomes:
  - en: "Set and manage client expectations on IS work"
    zh: "设定并管理客户对信息系统工作的预期"
    zh-TW: "設定並管理客戶對資訊系統工作的期望"
    ja: "IS業務で顧客の期待値を設定・管理する"
    ko: "IS 업무에서 고객 기대치 설정·관리하기"
    vi: "Đặt và quản lý kỳ vọng của khách hàng về công việc IS"
    ms: "Menetapkan dan mengurus jangkaan klien terhadap kerja IS"
    id: "Menetapkan dan mengelola ekspektasi klien atas pekerjaan SI"
    hi: "IS काम पर क्लाइंट की अपेक्षाएँ तय करना और संभालना"
  - en: "Give clear advice in writing and in person"
    zh: "以书面和面对面方式给出清晰建议"
    zh-TW: "以書面與面對面方式提出清楚建議"
    ja: "文書と対面でわかりやすく助言する"
    ko: "글과 대면으로 명확하게 조언하기"
    vi: "Đưa lời khuyên rõ ràng bằng văn bản và trực tiếp"
    ms: "Memberi nasihat jelas secara bertulis dan bersemuka"
    id: "Memberi saran yang jelas secara tertulis dan langsung"
    hi: "लिखकर और आमने-सामने साफ़ सलाह देना"
