code: UNIB10027
year: 2026
learn:
  en: "Reasoning through everyday moral dilemmas using psychology, philosophy and law, from identity to AI and climate."
  zh: "借助心理学、哲学和法律思考日常道德困境，从身份认同到人工智能与气候。"
  zh-TW: "借助心理學、哲學和法律思考日常道德困境，從身分認同到人工智慧與氣候。"
  ja: "心理学・哲学・法を使い、アイデンティティからAI・気候まで日常の道徳的ジレンマを考える。"
  ko: "심리학·철학·법으로 정체성부터 AI·기후까지 일상의 도덕적 딜레마 생각하기."
  vi: "Suy luận về các tình huống đạo đức đời thường bằng tâm lý học, triết học và luật, từ bản sắc đến AI, khí hậu."
  ms: "Menimbang dilema moral harian guna psikologi, falsafah dan undang-undang, dari identiti hingga AI dan iklim."
  id: "Menalar dilema moral sehari-hari dengan psikologi, filsafat, dan hukum, dari identitas hingga AI dan iklim."
  hi: "मनोविज्ञान, दर्शन और कानून से रोज़ की नैतिक दुविधाओं पर सोचना, पहचान से AI और जलवायु तक।"
outcomes:
  - en: "Compare how people do and should reason morally"
    zh: "比较人们实际与应当如何进行道德推理"
    zh-TW: "比較人們實際與應當如何進行道德推理"
    ja: "人が実際にどう判断し、どう判断すべきか比べる"
    ko: "사람들이 실제로, 그리고 마땅히 어떻게 도덕 판단하는지 비교하기"
    vi: "So sánh cách con người suy luận đạo đức thực tế và lý tưởng"
    ms: "Banding cara orang menaakul moral dan cara sepatutnya"
    id: "Membandingkan cara orang menalar moral dan seharusnya"
    hi: "लोग नैतिक तर्क कैसे करते हैं और कैसे करना चाहिए, तुलना करना"
  - en: "Apply ethical ideas to current issues"
    zh: "将伦理观念用于当下议题"
    zh-TW: "將倫理觀念用於當下議題"
    ja: "倫理の考え方を時事問題に当てはめる"
    ko: "윤리 개념을 현안에 적용하기"
    vi: "Áp dụng ý tưởng đạo đức vào vấn đề hiện nay"
    ms: "Gunakan idea etika pada isu semasa"
    id: "Menerapkan gagasan etika pada isu terkini"
    hi: "नैतिक विचार मौजूदा मुद्दों पर लागू करना"
  - en: "Present and defend a moral position"
    zh: "阐述并捍卫一个道德立场"
    zh-TW: "闡述並捍衛一個道德立場"
    ja: "道徳的立場を示し、擁護する"
    ko: "도덕적 입장 발표하고 방어하기"
    vi: "Trình bày và bảo vệ một quan điểm đạo đức"
    ms: "Bentang dan pertahankan pendirian moral"
    id: "Menyampaikan dan membela suatu posisi moral"
    hi: "एक नैतिक पक्ष रखना और उसका बचाव करना"
