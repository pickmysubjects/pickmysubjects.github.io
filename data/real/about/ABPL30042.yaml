code: ABPL30042
year: 2026
learn:
  en: "A landscape studio where you design an urban open space, learning from precedents and urban landscape principles."
  zh: "景观设计课：设计一处城市开放空间，学习相关案例和城市景观设计原则。"
  zh-TW: "景觀設計課：設計一處城市開放空間，學習相關案例與城市景觀設計原則。"
  ja: "都市のオープンスペースを設計するランドスケープスタジオ。事例と都市景観の原則を学ぶ。"
  ko: "도시 오픈 스페이스를 설계하는 조경 스튜디오. 사례와 도시 조경 원칙을 배운다."
  vi: "Studio cảnh quan thiết kế một không gian mở đô thị, học từ tiền lệ và nguyên tắc cảnh quan đô thị."
  ms: "Studio landskap untuk mereka ruang terbuka bandar, belajar daripada contoh dan prinsip landskap bandar."
  id: "Studio lanskap untuk merancang ruang terbuka kota, belajar dari preseden dan prinsip lanskap kota."
  hi: "लैंडस्केप स्टूडियो जिसमें शहरी खुली जगह डिज़ाइन करते हैं, उदाहरणों और सिद्धांतों से सीखते हुए।"
outcomes:
  - en: "Design a public open space in a city setting"
    zh: "在城市环境中设计公共开放空间"
    zh-TW: "在城市環境中設計公共開放空間"
    ja: "都市の公共オープンスペースを設計する"
    ko: "도시 속 공공 오픈 스페이스 설계하기"
    vi: "Thiết kế không gian công cộng mở trong đô thị"
    ms: "Reka ruang terbuka awam di bandar"
    id: "Merancang ruang terbuka publik di kota"
    hi: "शहर में सार्वजनिक खुली जगह डिज़ाइन करना"
  - en: "Learn from built urban landscape precedents"
    zh: "借鉴已建成的城市景观案例"
    zh-TW: "借鏡已建成的城市景觀案例"
    ja: "実在する都市景観の事例から学ぶ"
    ko: "실제 도시 조경 사례에서 배우기"
    vi: "Học từ các công trình cảnh quan đô thị có thật"
    ms: "Belajar daripada contoh landskap bandar sebenar"
    id: "Belajar dari preseden lanskap kota yang ada"
    hi: "बने हुए शहरी लैंडस्केप उदाहरणों से सीखना"
  - en: "Present a design with drawings and digital models"
    zh: "用图纸和数字模型展示设计"
    zh-TW: "用圖面和數位模型展示設計"
    ja: "図面とデジタルモデルで設計を示す"
    ko: "도면과 디지털 모델로 설계 발표하기"
    vi: "Trình bày thiết kế bằng bản vẽ và mô hình số"
    ms: "Bentang reka bentuk dengan lukisan dan model digital"
    id: "Menyajikan desain lewat gambar dan model digital"
    hi: "ड्रॉइंग और डिजिटल मॉडल से डिज़ाइन दिखाना"
