code: ECOM90017
year: 2027
learn:
  en: "Building econometric models from economic theory to study markets, mergers and pricing, and test policy questions."
  zh: "从经济理论构建计量模型，研究市场、并购与定价，回答政策问题。"
  zh-TW: "從經濟理論建構計量模型，研究市場、併購與定價，回答政策問題。"
  ja: "経済理論から計量モデルを作り、市場・合併・価格設定と政策を分析する。"
  ko: "경제 이론으로 계량 모형을 세워 시장·합병·가격 결정과 정책 질문 분석."
  vi: "Xây mô hình kinh tế lượng từ lý thuyết để nghiên cứu thị trường, sáp nhập, định giá và chính sách."
  ms: "Membina model ekonometrik daripada teori untuk mengkaji pasaran, penggabungan, harga dan soalan dasar."
  id: "Membangun model ekonometrika dari teori untuk mengkaji pasar, merger, harga, dan pertanyaan kebijakan."
  hi: "आर्थिक सिद्धांत से इकोनोमेट्रिक मॉडल बनाकर बाज़ार, विलय, कीमत तय करने और नीति प्रश्नों का अध्ययन।"
outcomes:
  - en: "Estimate structural models and run counterfactuals"
    zh: "估计结构模型并做反事实分析"
    zh-TW: "估計結構模型並做反事實分析"
    ja: "構造モデルを推定し反実仮想分析を行う"
    ko: "구조 모형 추정과 반사실 분석하기"
    vi: "Ước lượng mô hình cấu trúc và phân tích phản thực"
    ms: "Menganggar model struktur dan analisis kontrafaktual"
    id: "Mengestimasi model struktural dan analisis kontrafaktual"
    hi: "स्ट्रक्चरल मॉडल व काउंटरफ़ैक्चुअल विश्लेषण"
  - en: "Use basic programming and numerical methods"
    zh: "掌握基础编程与数值方法"
    zh-TW: "掌握基礎程式設計與數值方法"
    ja: "基本的なプログラミングと数値計算を使う"
    ko: "기초 프로그래밍과 수치 방법 활용하기"
    vi: "Dùng lập trình cơ bản và phương pháp số"
    ms: "Menggunakan pengaturcaraan asas dan kaedah berangka"
    id: "Memakai pemrograman dasar dan metode numerik"
    hi: "बुनियादी प्रोग्रामिंग व संख्यात्मक तरीके"
