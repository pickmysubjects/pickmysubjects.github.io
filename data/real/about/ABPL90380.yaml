code: ABPL90380
year: 2027
learn:
  en: "Designing public spaces for heat and thermal comfort using simulation, Rhino, Grasshopper and sensor data."
  zh: "用模拟、Rhino、Grasshopper和传感器数据，为公共空间做应对高温与热舒适的设计。"
  zh-TW: "用模擬、Rhino、Grasshopper和感測器資料，為公共空間做應對高溫與熱舒適的設計。"
  ja: "シミュレーション、Rhino、Grasshopper、センサーデータで暑さに対応した公共空間を設計する。"
  ko: "시뮬레이션, Rhino, Grasshopper, 센서 데이터로 더위와 열쾌적성을 고려한 공공공간을 설계합니다."
  vi: "Thiết kế không gian công cộng chống nóng bằng mô phỏng, Rhino, Grasshopper và dữ liệu cảm biến."
  ms: "Mereka ruang awam untuk haba dan keselesaan terma dengan simulasi, Rhino, Grasshopper dan data sensor."
  id: "Mendesain ruang publik untuk panas dan kenyamanan termal dengan simulasi, Rhino, Grasshopper, dan data sensor."
  hi: "सिमुलेशन, Rhino, Grasshopper और सेंसर डेटा से गर्मी व थर्मल आराम के लिए सार्वजनिक स्थान डिज़ाइन।"
outcomes:
  - en: "Use data and digital tools in design"
    zh: "在设计中运用数据和数字工具"
    zh-TW: "在設計中運用資料和數位工具"
    ja: "設計にデータとデジタル道具を使う"
    ko: "설계에 데이터와 디지털 도구 활용하기"
    vi: "Dùng dữ liệu và công cụ số trong thiết kế"
    ms: "Menggunakan data dan alat digital dalam reka bentuk"
    id: "Memakai data dan alat digital dalam desain"
    hi: "डिज़ाइन में डेटा और डिजिटल टूल का उपयोग"
  - en: "Run an independent research project"
    zh: "独立完成一个研究项目"
    zh-TW: "獨立完成一個研究專案"
    ja: "独自の研究プロジェクトを行う"
    ko: "독립 연구 프로젝트 수행하기"
    vi: "Thực hiện dự án nghiên cứu độc lập"
    ms: "Menjalankan projek kajian bebas"
    id: "Menjalankan proyek riset mandiri"
    hi: "स्वतंत्र शोध प्रोजेक्ट करना"
