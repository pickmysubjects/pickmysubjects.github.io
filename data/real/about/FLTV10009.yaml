code: FLTV10009
year: 2026
learn:
  en: "History of cinema and screen storytelling for filmmakers: screenings, discussion, research and talks with working practitioners."
  zh: "面向电影创作者的电影史与影视叙事：放映、讨论、研究及与业界人士交流。"
  zh-TW: "面向電影創作者的電影史與影視敘事：放映、討論、研究及與業界人士交流。"
  ja: "作り手のための映画史と映像の語り：上映、議論、調査、現役の作り手との交流。"
  ko: "영화인을 위한 영화사와 영상 스토리텔링: 상영, 토론, 조사, 현업인과의 만남."
  vi: "Lịch sử điện ảnh và kể chuyện màn ảnh cho người làm phim: chiếu phim, thảo luận, nghiên cứu, gặp người trong nghề."
  ms: "Sejarah sinema dan penceritaan skrin untuk pembikin filem: tayangan, perbincangan dan pengamal industri."
  id: "Sejarah sinema dan bercerita di layar bagi pembuat film: pemutaran, diskusi, riset dan praktisi."
  hi: "फ़िल्मकारों के लिए सिनेमा इतिहास और स्क्रीन कथा: स्क्रीनिंग, चर्चा, शोध और पेशेवरों से बातचीत।"
outcomes:
  - en: "Analyse films from different styles and periods"
    zh: "分析不同风格与年代的电影"
    zh-TW: "分析不同風格與年代的電影"
    ja: "さまざまな様式・時代の映画を分析する"
    ko: "다양한 양식과 시대의 영화 분석하기"
    vi: "Phân tích phim nhiều phong cách và thời kỳ"
    ms: "Analisis filem pelbagai gaya dan zaman"
    id: "Menganalisis film berbagai gaya dan zaman"
    hi: "अलग शैलियों और दौर की फ़िल्मों का विश्लेषण"
  - en: "Make a short video essay"
    zh: "制作一部视频随笔"
    zh-TW: "製作一部影像短論"
    ja: "ビデオエッセイを作る"
    ko: "비디오 에세이 만들기"
    vi: "Làm một video tiểu luận ngắn"
    ms: "Hasilkan esei video pendek"
    id: "Membuat esai video pendek"
    hi: "छोटा वीडियो निबंध बनाना"
  - en: "Research and interview a screen professional"
    zh: "研究并采访一位影视从业者"
    zh-TW: "研究並訪問一位影視從業者"
    ja: "映像業界の人を調べインタビューする"
    ko: "영상 업계 전문가 조사·인터뷰하기"
    vi: "Tìm hiểu và phỏng vấn một người làm nghề"
    ms: "Kaji dan temu bual pengamal skrin"
    id: "Meneliti dan mewawancarai praktisi layar"
    hi: "किसी स्क्रीन प्रोफ़ेशनल पर शोध और इंटरव्यू"
