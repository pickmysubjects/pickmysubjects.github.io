code: COMP90044
year: 2027
learn:
  en: "How research in computing works: questions, literature, methods, data analysis, ethics and reporting."
  zh: "计算机领域的研究方法：提出问题、文献综述、研究方法、数据分析、伦理与成果汇报。"
  zh-TW: "電腦領域的研究方法：提出問題、文獻回顧、研究方法、資料分析、倫理與成果報告。"
  ja: "コンピュータ分野の研究方法：問い、文献調査、手法、データ分析、倫理、発表。"
  ko: "컴퓨팅 연구 방법: 연구 질문, 문헌 조사, 방법론, 데이터 분석, 윤리, 발표."
  vi: "Phương pháp nghiên cứu trong ngành máy tính: câu hỏi, tổng quan tài liệu, phương pháp, phân tích dữ liệu, đạo đức, trình bày."
  ms: "Kaedah penyelidikan dalam pengkomputeran: soalan, sorotan literatur, kaedah, analisis data, etika dan pembentangan."
  id: "Metode riset di bidang komputasi: pertanyaan, kajian pustaka, metode, analisis data, etika, presentasi."
  hi: "कंप्यूटिंग में शोध के तरीके: प्रश्न, साहित्य समीक्षा, विधियाँ, डेटा विश्लेषण, नैतिकता, प्रस्तुति।"
outcomes:
  - en: "Turn a topic into a clear research question and plan"
    zh: "把一个题目变成清楚的研究问题和计划"
    zh-TW: "把一個題目變成清楚的研究問題與計畫"
    ja: "テーマを明確な研究課題と計画にする"
    ko: "주제를 명확한 연구 질문과 계획으로 만들기"
    vi: "Biến một chủ đề thành câu hỏi và kế hoạch nghiên cứu rõ ràng"
    ms: "Menjadikan topik soalan dan rancangan kajian yang jelas"
    id: "Mengubah topik menjadi pertanyaan dan rencana riset yang jelas"
    hi: "किसी विषय को स्पष्ट शोध प्रश्न और योजना में बदलना"
  - en: "Present research findings in writing and in a talk"
    zh: "用书面和口头方式汇报研究结果"
    zh-TW: "以書面與口頭方式報告研究結果"
    ja: "研究結果を文章と口頭で発表する"
    ko: "연구 결과를 글과 발표로 전달하기"
    vi: "Trình bày kết quả nghiên cứu bằng văn bản và thuyết trình"
    ms: "Membentangkan dapatan kajian secara bertulis dan lisan"
    id: "Menyampaikan hasil riset secara tertulis dan lisan"
    hi: "शोध के नतीजे लिखकर और बोलकर प्रस्तुत करना"
