code: MUSI30183
year: 2026
learn:
  en: "A specialist string ensemble learning and performing key works of the string repertoire. Audition entry."
  zh: "专业弦乐合奏，学习并演出弦乐重要曲目。需试音。"
  zh-TW: "專業弦樂合奏，學習並演出弦樂重要曲目。需試音。"
  ja: "弦楽の重要曲を学び演奏する専門アンサンブル。オーディション制。"
  ko: "현악 주요 레퍼토리를 배우고 연주하는 전문 앙상블. 오디션."
  vi: "Dàn dây chuyên sâu học và diễn các tác phẩm dây quan trọng. Cần thử giọng."
  ms: "Ensembel bertali khusus untuk karya penting repertoir tali. Uji bakat."
  id: "Ansambel gesek khusus untuk karya penting repertoar gesek. Audisi."
  hi: "विशेष स्ट्रिंग समूह, प्रमुख तार-वाद्य रचनाएँ सीखना और बजाना। ऑडिशन।"
outcomes:
  - en: "Build string ensemble skills"
    zh: "培养弦乐合奏技能"
    zh-TW: "培養弦樂合奏技能"
    ja: "弦楽合奏の技能を養う"
    ko: "현악 합주 기술 기르기"
    vi: "Rèn kỹ năng hòa tấu đàn dây"
    ms: "Bina kemahiran ensembel bertali"
    id: "Membangun keterampilan ansambel gesek"
    hi: "स्ट्रिंग समूह कौशल बनाना"
  - en: "Prepare parts from major string works"
    zh: "准备重要弦乐作品的声部"
    zh-TW: "準備重要弦樂作品的聲部"
    ja: "主要な弦楽曲のパートを準備する"
    ko: "주요 현악곡 파트 준비하기"
    vi: "Chuẩn bị bè từ tác phẩm dây lớn"
    ms: "Sediakan bahagian karya tali utama"
    id: "Menyiapkan partisi karya gesek utama"
    hi: "प्रमुख तार-वाद्य रचनाओं के भाग तैयार करना"
  - en: "Pass an individual part test"
    zh: "通过个人声部测试"
    zh-TW: "通過個人聲部測試"
    ja: "個人パートテストに合格する"
    ko: "개인 파트 테스트 통과하기"
    vi: "Vượt qua bài kiểm tra bè cá nhân"
    ms: "Lulus ujian bahagian individu"
    id: "Lulus tes partisi individu"
    hi: "व्यक्तिगत भाग परीक्षा पास करना"
