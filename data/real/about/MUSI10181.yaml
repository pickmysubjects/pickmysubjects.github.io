code: MUSI10181
year: 2026
learn:
  en: "Play in small and large jazz ensembles: rehearse, arrange, compose for your group and perform in workshops."
  zh: "在大小爵士乐团中演奏：排练、编曲、为乐队创作，并在工作坊中演出。"
  zh-TW: "在大小爵士樂團中演奏：排練、編曲、為樂隊創作，並在工作坊中演出。"
  ja: "大小のジャズアンサンブルで演奏。リハーサル、編曲、バンド用の作曲、ワークショップでの演奏。"
  ko: "크고 작은 재즈 앙상블에서 연주. 리허설, 편곡, 팀을 위한 작곡, 워크숍 공연."
  vi: "Chơi trong ban jazz nhỏ và lớn: tập, phối khí, sáng tác cho nhóm và biểu diễn ở workshop."
  ms: "Bermain dalam ensembel jaz kecil dan besar: latihan, gubahan, karya untuk kumpulan, persembahan."
  id: "Bermain dalam ansambel jazz kecil dan besar: latihan, aransemen, komposisi untuk grup, dan pentas."
  hi: "छोटे-बड़े जैज़ समूहों में बजाना: रिहर्सल, अरेंजमेंट, समूह के लिए रचना और वर्कशॉप प्रदर्शन।"
outcomes:
  - en: "Perform as a member of a jazz band"
    zh: "作为爵士乐队成员演奏"
    zh-TW: "作為爵士樂隊成員演奏"
    ja: "ジャズバンドの一員として演奏する"
    ko: "재즈 밴드의 일원으로 연주하기"
    vi: "Biểu diễn như thành viên ban jazz"
    ms: "Bermain sebagai ahli band jaz"
    id: "Tampil sebagai anggota band jazz"
    hi: "जैज़ बैंड के सदस्य के रूप में बजाना"
  - en: "Write and arrange pieces for your group"
    zh: "为乐队写曲和编曲"
    zh-TW: "為樂隊寫曲與編曲"
    ja: "グループのために作曲・編曲する"
    ko: "팀을 위해 작곡·편곡하기"
    vi: "Viết và phối khí cho nhóm"
    ms: "Tulis dan susun lagu untuk kumpulan"
    id: "Menulis dan mengaransemen untuk grup"
    hi: "समूह के लिए रचना और अरेंजमेंट"
  - en: "Start to show your own style"
    zh: "开始展现个人风格"
    zh-TW: "開始展現個人風格"
    ja: "自分のスタイルを示し始める"
    ko: "자신만의 스타일 보여 주기 시작"
    vi: "Bắt đầu thể hiện phong cách riêng"
    ms: "Mula tunjuk gaya sendiri"
    id: "Mulai menunjukkan gaya sendiri"
    hi: "अपनी शैली दिखाना शुरू करना"
