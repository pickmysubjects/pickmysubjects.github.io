code: DRAM20030
year: 2026
learn:
  en: "Rehearse and perform non-Australian plays under different directors, adding dialect work and transformational character skills."
  zh: "在不同导演下排演非澳洲剧作，加入口音训练与角色转变技巧。"
  zh-TW: "在不同導演下排演非澳洲劇作，加入口音訓練與角色轉變技巧。"
  ja: "異なる演出家のもとで海外戯曲を稽古・上演し、方言と役の変身を学ぶ。"
  ko: "여러 연출가와 비호주 희곡을 연습·공연하며 사투리와 인물 변신을 익힌다."
  vi: "Tập và diễn kịch ngoài nước Úc với nhiều đạo diễn, thêm luyện giọng địa phương và biến hóa nhân vật."
  ms: "Berlatih dan beraksi drama bukan Australia dengan pengarah berbeza, termasuk dialek dan transformasi watak."
  id: "Berlatih dan mementaskan lakon non-Australia dengan sutradara berbeda, plus dialek dan transformasi tokoh."
  hi: "अलग निर्देशकों के साथ ग़ैर-ऑस्ट्रेलियाई नाटकों का मंचन, बोली और किरदार परिवर्तन कौशल सहित।"
outcomes:
  - en: "Play a role in a dialect not your own"
    zh: "用非母语口音演角色"
    zh-TW: "用非母語口音演角色"
    ja: "自分と違う方言で役を演じる"
    ko: "자기 것이 아닌 사투리로 연기하기"
    vi: "Đóng vai bằng giọng địa phương khác"
    ms: "Lakon watak dalam dialek lain"
    id: "Memerankan tokoh dengan dialek lain"
    hi: "किसी दूसरी बोली में किरदार निभाना"
  - en: "Adapt to different directing approaches"
    zh: "适应不同的导演方式"
    zh-TW: "適應不同的導演方式"
    ja: "さまざまな演出法に適応する"
    ko: "다양한 연출 방식에 적응하기"
    vi: "Thích nghi với nhiều cách đạo diễn"
    ms: "Sesuaikan diri dengan gaya pengarahan"
    id: "Beradaptasi dengan gaya penyutradaraan"
    hi: "अलग-अलग निर्देशन शैलियों के अनुसार ढलना"
  - en: "Keep developing your own artistic voice"
    zh: "持续发展自己的艺术声音"
    zh-TW: "持續發展自己的藝術聲音"
    ja: "自分の芸術的な声を育て続ける"
    ko: "자신만의 예술적 목소리 키우기"
    vi: "Tiếp tục phát triển giọng nghệ thuật riêng"
    ms: "Terus kembangkan suara seni sendiri"
    id: "Terus mengembangkan suara seni sendiri"
    hi: "अपनी कलात्मक आवाज़ विकसित करते रहना"
