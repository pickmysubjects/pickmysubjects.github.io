code: NEUR30002
year: 2026
learn:
  en: "How nerve cells make electrical signals, talk to each other and form circuits that control the body."
  zh: "神经细胞怎么产生电信号、互相交流，并组成控制身体的回路。"
  zh-TW: "神經細胞怎麼產生電訊號、互相溝通，並組成控制身體的迴路。"
  ja: "神経細胞が電気信号を作り、互いに伝え合い、体を制御する回路を作る仕組み。"
  ko: "신경세포가 전기 신호를 만들고 서로 소통하며 몸을 조절하는 회로를 이루는 방식."
  vi: "Tế bào thần kinh tạo tín hiệu điện, giao tiếp với nhau và tạo mạch điều khiển cơ thể ra sao."
  ms: "Cara sel saraf menghasilkan isyarat elektrik, berhubung dan membentuk litar yang mengawal badan."
  id: "Cara sel saraf membuat sinyal listrik, saling berkomunikasi, dan membentuk sirkuit pengendali tubuh."
  hi: "तंत्रिका कोशिकाएँ बिजली के सिग्नल कैसे बनाती हैं, आपस में बात करती हैं और शरीर चलाने वाले सर्किट बनाती हैं।"
outcomes:
  - en: "Explain how nerve cells generate electrical signals"
    zh: "解释神经细胞怎么产生电信号"
    zh-TW: "解釋神經細胞怎麼產生電訊號"
    ja: "神経細胞が電気信号を生む仕組みを説明する"
    ko: "신경세포가 전기 신호를 만드는 방식 설명하기"
    vi: "Giải thích tế bào thần kinh tạo tín hiệu điện ra sao"
    ms: "Menerangkan cara sel saraf menjana isyarat elektrik"
    id: "Menjelaskan cara sel saraf menghasilkan sinyal listrik"
    hi: "तंत्रिका कोशिकाएँ बिजली के सिग्नल कैसे बनाती हैं"
  - en: "Explain how nerves signal to other cells"
    zh: "解释神经怎么向其他细胞传信号"
    zh-TW: "解釋神經怎麼向其他細胞傳訊號"
    ja: "神経が他の細胞に信号を送る仕組みを説明する"
    ko: "신경이 다른 세포에 신호를 보내는 방식 설명하기"
    vi: "Giải thích dây thần kinh truyền tín hiệu tới tế bào khác ra sao"
    ms: "Menerangkan cara saraf menghantar isyarat kepada sel lain"
    id: "Menjelaskan cara saraf memberi sinyal ke sel lain"
    hi: "नसें दूसरी कोशिकाओं को सिग्नल कैसे देती हैं"
  - en: "Describe simple circuits behind reflexes"
    zh: "描述反射背后的简单回路"
    zh-TW: "描述反射背後的簡單迴路"
    ja: "反射を担う簡単な回路を説明する"
    ko: "반사 작용의 간단한 회로 설명하기"
    vi: "Mô tả các mạch đơn giản đằng sau phản xạ"
    ms: "Menghuraikan litar mudah di sebalik refleks"
    id: "Menjelaskan sirkuit sederhana di balik refleks"
    hi: "रिफ़्लेक्स के पीछे के सरल सर्किट बताना"
