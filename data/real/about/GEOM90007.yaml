code: GEOM90007
year: 2027
learn:
  en: "Designing clear, interactive visuals to explore large, complex data, especially spatial data, and support decisions."
  zh: "设计清晰、可交互的可视化来探索大型复杂数据（尤其是空间数据）并辅助决策。"
  zh-TW: "設計清晰、可互動的視覺化來探索大型複雜資料（尤其是空間資料）並輔助決策。"
  ja: "大規模で複雑なデータ（特に空間データ）を探る、分かりやすく対話的な可視化を設計する。"
  ko: "크고 복잡한 데이터(특히 공간 데이터)를 탐색하는 명확한 인터랙티브 시각화 설계."
  vi: "Thiết kế hình ảnh trực quan rõ ràng, tương tác để khám phá dữ liệu lớn, nhất là dữ liệu không gian."
  ms: "Mereka visual jelas dan interaktif untuk meneroka data besar dan kompleks, terutama data ruang."
  id: "Merancang visual jelas dan interaktif untuk menjelajah data besar dan kompleks, terutama data spasial."
  hi: "बड़े, जटिल (खासकर स्थानिक) डेटा को समझने के लिए साफ़, इंटरैक्टिव विज़ुअल बनाना।"
outcomes:
  - en: "Design effective charts and interactive visuals"
    zh: "设计有效的图表与交互式可视化"
    zh-TW: "設計有效的圖表與互動式視覺化"
    ja: "効果的なグラフと対話的な可視化を作る"
    ko: "효과적인 차트와 인터랙티브 시각화 설계하기"
    vi: "Thiết kế biểu đồ và hình ảnh tương tác hiệu quả"
    ms: "Reka carta dan visual interaktif yang berkesan"
    id: "Merancang grafik dan visual interaktif yang efektif"
    hi: "असरदार चार्ट और इंटरैक्टिव विज़ुअल डिज़ाइन करना"
  - en: "Judge whether a visualisation supports a decision"
    zh: "判断可视化能否支持决策"
    zh-TW: "判斷視覺化能否支援決策"
    ja: "可視化が判断に役立つか評価する"
    ko: "시각화가 의사결정에 도움되는지 판단하기"
    vi: "Đánh giá trực quan hóa có hỗ trợ quyết định không"
    ms: "Nilai sama ada visualisasi membantu keputusan"
    id: "Menilai apakah visualisasi mendukung keputusan"
    hi: "आंकना कि विज़ुअलाइज़ेशन निर्णय में मदद करता है या नहीं"
