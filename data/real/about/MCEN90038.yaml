code: MCEN90038
year: 2027
learn:
  en: "3D motion of rigid bodies: kinematics, kinetics, collisions and gyroscopic motion."
  zh: "刚体的三维运动：运动学、动力学、碰撞与陀螺运动。"
  zh-TW: "剛體的三維運動：運動學、動力學、碰撞與陀螺運動。"
  ja: "剛体の三次元運動：運動学、動力学、衝突、ジャイロ運動。"
  ko: "강체의 3차원 운동: 기구학, 동역학, 충돌, 자이로 운동."
  vi: "Chuyển động 3D của vật rắn: động học, động lực học, va chạm, con quay."
  ms: "Gerakan 3D jasad tegar: kinematik, kinetik, perlanggaran dan gerakan giroskop."
  id: "Gerak 3D benda tegar: kinematika, kinetika, tumbukan, dan gerak giroskop."
  hi: "दृढ़ पिंडों की 3D गति: काइनेमैटिक्स, काइनेटिक्स, टक्कर और जाइरोस्कोपिक गति।"
outcomes:
  - en: "Model 3D dynamics of mechanical systems"
    zh: "为机械系统建立三维动力学模型"
    zh-TW: "為機械系統建立三維動力學模型"
    ja: "機械系の三次元動力学をモデル化する"
    ko: "기계 시스템의 3차원 동역학 모델링하기"
    vi: "Lập mô hình động lực học 3D cho hệ cơ khí"
    ms: "Memodelkan dinamik 3D sistem mekanikal"
    id: "Memodelkan dinamika 3D sistem mekanis"
    hi: "यांत्रिक सिस्टम की 3D डायनेमिक्स का मॉडल बनाना"
  - en: "Solve the models analytically and numerically"
    zh: "用解析和数值方法求解模型"
    zh-TW: "用解析與數值方法求解模型"
    ja: "モデルを解析的・数値的に解く"
    ko: "모델을 해석적·수치적으로 풀기"
    vi: "Giải mô hình bằng giải tích và phương pháp số"
    ms: "Menyelesaikan model secara analitik dan berangka"
    id: "Menyelesaikan model secara analitik dan numerik"
    hi: "मॉडल को विश्लेषणात्मक व संख्यात्मक रूप से हल करना"
