code: JAPN30018
year: 2026
learn:
  en: "The Japanese Studies capstone: an independent project on Japanese language use around the world."
  zh: "日本研究专业的毕业课：围绕日语在世界各地的使用做独立项目。"
  zh-TW: "日本研究專業的畢業課：圍繞日語在世界各地的使用做獨立項目。"
  ja: "日本研究専攻の総仕上げ。世界で使われる日本語について独自の課題に取り組む。"
  ko: "일본학 전공 캡스톤. 세계 곳곳의 일본어 사용에 관한 독립 프로젝트."
  vi: "Môn tổng kết ngành Nhật Bản học: dự án độc lập về việc dùng tiếng Nhật trên thế giới."
  ms: "Subjek puncak Pengajian Jepun: projek bebas tentang penggunaan bahasa Jepun di seluruh dunia."
  id: "Mata kuliah puncak Studi Jepang: proyek mandiri tentang pemakaian bahasa Jepang di dunia."
  hi: "जापानी अध्ययन का कैपस्टोन: दुनिया भर में जापानी के इस्तेमाल पर स्वतंत्र प्रोजेक्ट।"
outcomes:
  - en: "Plan and run an independent project"
    zh: "策划并完成独立项目"
    zh-TW: "策劃並完成獨立項目"
    ja: "独自の課題を計画し実行する"
    ko: "독립 프로젝트 기획하고 수행하기"
    vi: "Lên kế hoạch và thực hiện dự án độc lập"
    ms: "Rancang dan jalankan projek bebas"
    id: "Merancang dan menjalankan proyek mandiri"
    hi: "एक स्वतंत्र प्रोजेक्ट की योजना बनाना और पूरा करना"
  - en: "Use Japanese in real community settings"
    zh: "在真实社区场景中使用日语"
    zh-TW: "在真實社區場景中使用日語"
    ja: "実際の地域社会で日本語を使う"
    ko: "실제 공동체 환경에서 일본어 쓰기"
    vi: "Dùng tiếng Nhật trong cộng đồng thật"
    ms: "Guna bahasa Jepun dalam komuniti sebenar"
    id: "Memakai bahasa Jepang di komunitas nyata"
    hi: "असली सामुदायिक माहौल में जापानी इस्तेमाल करना"
  - en: "Present your findings in Japanese"
    zh: "用日语展示成果"
    zh-TW: "用日語展示成果"
    ja: "成果を日本語で発表する"
    ko: "결과를 일본어로 발표하기"
    vi: "Trình bày kết quả bằng tiếng Nhật"
    ms: "Bentangkan dapatan dalam bahasa Jepun"
    id: "Mempresentasikan hasil dalam bahasa Jepang"
    hi: "अपने नतीजे जापानी में प्रस्तुत करना"
