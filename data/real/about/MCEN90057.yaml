code: MCEN90057
year: 2027
learn:
  en: "Automation and information systems at every level of manufacturing, from device control up to the supply chain."
  zh: "制造各层级的自动化和信息系统，从设备控制到供应链。"
  zh-TW: "製造各層級的自動化與資訊系統，從設備控制到供應鏈。"
  ja: "装置制御からサプライチェーンまで、製造の各階層の自動化と情報システム。"
  ko: "장치 제어부터 공급망까지 제조 각 계층의 자동화와 정보 시스템."
  vi: "Tự động hóa và hệ thống thông tin ở mọi cấp sản xuất, từ điều khiển thiết bị đến chuỗi cung ứng."
  ms: "Automasi dan sistem maklumat di setiap peringkat pembuatan, daripada kawalan peranti hingga rantaian bekalan."
  id: "Otomasi dan sistem informasi di setiap tingkat manufaktur, dari kendali perangkat hingga rantai pasok."
  hi: "निर्माण के हर स्तर पर ऑटोमेशन और सूचना प्रणालियाँ, डिवाइस नियंत्रण से सप्लाई चेन तक।"
outcomes:
  - en: "Identify the goals of automation in industry"
    zh: "明确工业自动化的目标"
    zh-TW: "明確工業自動化的目標"
    ja: "産業における自動化の目的を見極める"
    ko: "산업 자동화의 목적 파악하기"
    vi: "Xác định mục tiêu tự động hóa trong công nghiệp"
    ms: "Mengenal pasti matlamat automasi dalam industri"
    id: "Mengidentifikasi tujuan otomasi di industri"
    hi: "उद्योग में ऑटोमेशन के लक्ष्य पहचानना"
  - en: "Match automation and IT to each level of manufacturing"
    zh: "为制造的每个层级匹配自动化和信息系统"
    zh-TW: "為製造的每個層級搭配自動化與資訊系統"
    ja: "製造の各階層に合う自動化とITを選ぶ"
    ko: "제조 각 계층에 맞는 자동화·IT 정하기"
    vi: "Chọn tự động hóa và CNTT cho từng cấp sản xuất"
    ms: "Memadankan automasi dan IT dengan setiap peringkat pembuatan"
    id: "Mencocokkan otomasi dan TI dengan tiap tingkat manufaktur"
    hi: "निर्माण के हर स्तर के लिए ऑटोमेशन व IT चुनना"
