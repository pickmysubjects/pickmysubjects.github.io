code: ACCT90026
year: 2027
learn:
  en: "Forensic accounting: quantifying loss, valuing businesses in disputes, expert witness reports and fraud."
  zh: "法务会计：损失量化、争议中的企业估值、专家证人报告和舞弊调查。"
  zh-TW: "鑑識會計：損失量化、爭議中的企業評價、專家證人報告與舞弊調查。"
  ja: "フォレンジック会計：損失の算定、紛争時の企業評価、専門家証人報告、不正調査。"
  ko: "포렌식 회계: 손해액 산정, 분쟁 시 기업가치 평가, 전문가 증인 보고서, 부정 조사."
  vi: "Kế toán điều tra: định lượng thiệt hại, định giá doanh nghiệp khi tranh chấp, báo cáo giám định và gian lận."
  ms: "Perakaunan forensik: mengira kerugian, menilai perniagaan dalam pertikaian, laporan saksi pakar dan penipuan."
  id: "Akuntansi forensik: menghitung kerugian, valuasi bisnis saat sengketa, laporan saksi ahli, dan kecurangan."
  hi: "फ़ोरेंसिक अकाउंटिंग: नुकसान का आकलन, विवादों में व्यवसाय मूल्यांकन, विशेषज्ञ गवाह रिपोर्ट और धोखाधड़ी।"
outcomes:
  - en: "Describe the role of a forensic accountant"
    zh: "说明法务会计师的角色"
    zh-TW: "說明鑑識會計師的角色"
    ja: "フォレンジック会計士の役割を説明する"
    ko: "포렌식 회계사의 역할 설명하기"
    vi: "Mô tả vai trò của kế toán điều tra"
    ms: "Menerangkan peranan akauntan forensik"
    id: "Menjelaskan peran akuntan forensik"
    hi: "फ़ोरेंसिक अकाउंटेंट की भूमिका बताना"
  - en: "Plan fraud prevention and detection"
    zh: "制定舞弊预防和侦测方案"
    zh-TW: "規劃舞弊預防與偵測"
    ja: "不正の防止と発見を計画する"
    ko: "부정 예방 및 적발 계획하기"
    vi: "Lập kế hoạch phòng ngừa và phát hiện gian lận"
    ms: "Merancang pencegahan dan pengesanan penipuan"
    id: "Merencanakan pencegahan dan deteksi kecurangan"
    hi: "धोखाधड़ी रोकथाम और पहचान की योजना"
