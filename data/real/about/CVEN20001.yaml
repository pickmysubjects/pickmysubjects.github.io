code: CVEN20001
year: 2026
learn:
  en: "How to judge infrastructure projects on environmental, economic and social sustainability, not just engineering."
  zh: "如何从环境、经济和社会可持续性角度评估基础设施项目。"
  zh-TW: "如何從環境、經濟與社會永續角度評估基礎建設專案。"
  ja: "インフラ事業を工学だけでなく環境・経済・社会の持続可能性から評価する方法。"
  ko: "인프라 사업을 공학만이 아닌 환경·경제·사회 지속가능성으로 평가하는 법."
  vi: "Cách đánh giá dự án hạ tầng theo tính bền vững môi trường, kinh tế, xã hội, không chỉ kỹ thuật."
  ms: "Cara menilai projek infrastruktur dari segi kelestarian alam sekitar, ekonomi dan sosial, bukan kejuruteraan sahaja."
  id: "Cara menilai proyek infrastruktur dari sisi keberlanjutan lingkungan, ekonomi, dan sosial, bukan teknis saja."
  hi: "इंफ्रास्ट्रक्चर प्रोजेक्ट को सिर्फ़ इंजीनियरिंग नहीं, पर्यावरण, आर्थिक व सामाजिक स्थिरता पर परखना।"
outcomes:
  - en: "Assess a project's sustainability"
    zh: "评估项目的可持续性"
    zh-TW: "評估專案的永續性"
    ja: "事業の持続可能性を評価する"
    ko: "사업의 지속가능성 평가하기"
    vi: "Đánh giá tính bền vững của dự án"
    ms: "Menilai kelestarian sesuatu projek"
    id: "Menilai keberlanjutan suatu proyek"
    hi: "किसी प्रोजेक्ट की स्थिरता का आकलन करना"
  - en: "Use multi-criteria methods to make decisions"
    zh: "用多准则方法辅助决策"
    zh-TW: "用多準則方法輔助決策"
    ja: "多基準評価で意思決定する"
    ko: "다기준 분석으로 의사결정하기"
    vi: "Dùng phương pháp đa tiêu chí để ra quyết định"
    ms: "Menggunakan kaedah pelbagai kriteria untuk keputusan"
    id: "Memakai metode multikriteria untuk keputusan"
    hi: "बहु-मानदंड तरीकों से निर्णय लेना"
  - en: "Write technical reports and present them"
    zh: "撰写并展示技术报告"
    zh-TW: "撰寫並發表技術報告"
    ja: "技術報告を書いて発表する"
    ko: "기술 보고서 작성·발표하기"
    vi: "Viết và trình bày báo cáo kỹ thuật"
    ms: "Menulis dan membentang laporan teknikal"
    id: "Menulis dan mempresentasikan laporan teknis"
    hi: "तकनीकी रिपोर्ट लिखना और प्रस्तुत करना"
