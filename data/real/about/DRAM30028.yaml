code: DRAM30028
year: 2026
learn:
  en: "Take acting skills into new media: voice work in audio studios, dance and choreography, and technical classes for production work."
  zh: "把表演技能带到新媒介：录音棚配音、舞蹈编排，以及支持制作的技术课。"
  zh-TW: "把表演技能帶到新媒介：錄音室配音、舞蹈編排，以及支援製作的技術課。"
  ja: "演技を新しい媒体へ：録音スタジオでの声の仕事、ダンス、制作を支える技術クラス。"
  ko: "연기를 새 매체로: 녹음 스튜디오 음성 작업, 춤과 안무, 제작을 돕는 기술 수업."
  vi: "Đưa kỹ năng diễn vào phương tiện mới: lồng tiếng trong phòng thu, múa, và lớp kỹ thuật."
  ms: "Bawa kemahiran lakonan ke media baharu: suara di studio audio, tarian dan kelas teknikal."
  id: "Membawa akting ke media baru: kerja suara di studio audio, tari dan kelas teknis produksi."
  hi: "अभिनय कौशल को नए माध्यमों में: ऑडियो स्टूडियो में वॉइस वर्क, डांस और प्रोडक्शन के लिए तकनीकी क्लास।"
outcomes:
  - en: "Record voice work in a studio setting"
    zh: "在录音棚完成配音"
    zh-TW: "在錄音室完成配音"
    ja: "スタジオで声の収録をする"
    ko: "스튜디오에서 음성 녹음하기"
    vi: "Thu âm giọng nói trong phòng thu"
    ms: "Rakam kerja suara di studio"
    id: "Merekam suara di studio"
    hi: "स्टूडियो में वॉइस रिकॉर्ड करना"
  - en: "Learn and perform choreography"
    zh: "学习并表演编舞"
    zh-TW: "學習並表演編舞"
    ja: "振付を覚えて踊る"
    ko: "안무 배우고 공연하기"
    vi: "Học và biểu diễn vũ đạo"
    ms: "Belajar dan persembahkan koreografi"
    id: "Mempelajari dan menampilkan koreografi"
    hi: "कोरियोग्राफ़ी सीखना और प्रस्तुत करना"
  - en: "Play a dialect scene with a group"
    zh: "与小组演一场方言戏"
    zh-TW: "與小組演一場方言戲"
    ja: "グループで方言の場面を演じる"
    ko: "그룹으로 사투리 장면 연기하기"
    vi: "Cùng nhóm diễn một cảnh dùng giọng địa phương"
    ms: "Lakonkan babak dialek berkumpulan"
    id: "Memerankan adegan berdialek berkelompok"
    hi: "समूह में बोली वाला दृश्य निभाना"
