code: ACCT90012
year: 2027
learn:
  en: "Preparing company financial reports under the Corporations Act and Australian Accounting Standards."
  zh: "按照《公司法》和澳大利亚会计准则编制公司财务报告。"
  zh-TW: "依照《公司法》與澳洲會計準則編製公司財務報告。"
  ja: "会社法とオーストラリア会計基準に沿った企業財務報告の作成。"
  ko: "회사법과 호주 회계기준에 따른 기업 재무보고서 작성."
  vi: "Lập báo cáo tài chính công ty theo Luật Công ty và Chuẩn mực kế toán Úc."
  ms: "Menyediakan laporan kewangan syarikat mengikut Akta Syarikat dan Piawaian Perakaunan Australia."
  id: "Menyusun laporan keuangan perusahaan sesuai UU Perseroan dan Standar Akuntansi Australia."
  hi: "कॉर्पोरेशंस एक्ट और ऑस्ट्रेलियाई लेखा मानकों के अनुसार कंपनी वित्तीय रिपोर्ट तैयार करना।"
outcomes:
  - en: "Explain the rules that govern financial reporting"
    zh: "解释规范财务报告的法规和准则"
    zh-TW: "解釋規範財務報導的法規與準則"
    ja: "財務報告を規制するルールを説明する"
    ko: "재무보고를 규율하는 규정 설명하기"
    vi: "Giải thích quy định chi phối báo cáo tài chính"
    ms: "Menerangkan peraturan yang mengawal pelaporan kewangan"
    id: "Menjelaskan aturan yang mengatur pelaporan keuangan"
    hi: "वित्तीय रिपोर्टिंग को नियंत्रित करने वाले नियम समझाना"
  - en: "Prepare statements and notes under the standards"
    zh: "按准则编制报表及附注"
    zh-TW: "依準則編製報表及附註"
    ja: "基準に沿って財務諸表と注記を作成する"
    ko: "기준에 따라 재무제표와 주석 작성하기"
    vi: "Lập báo cáo và thuyết minh theo chuẩn mực"
    ms: "Menyediakan penyata dan nota mengikut piawaian"
    id: "Menyusun laporan dan catatan sesuai standar"
    hi: "मानकों के अनुसार विवरण और नोट्स तैयार करना"
