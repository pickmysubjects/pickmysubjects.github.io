code: ASIA20003
year: 2026
learn:
  en: "How gender and desire are lived and contested in Asian societies and diasporas, and how history, religion and media shape them."
  zh: "性别与欲望在亚洲社会和海外华人等群体中如何被实践和争论，受历史、宗教、媒体影响。"
  zh-TW: "性別與慾望在亞洲社會和海外離散社群中如何被實踐和爭論，受歷史、宗教、媒體影響。"
  ja: "アジアの社会とディアスポラでジェンダーと欲望がどう生きられ争われ、歴史・宗教・メディアがどう影響するかを学ぶ。"
  ko: "아시아 사회와 디아스포라에서 젠더와 욕망이 어떻게 실천되고 논쟁되며 역사·종교·미디어가 어떤 영향을 주는지 배운다."
  vi: "Giới và dục vọng được sống và tranh luận ra sao ở các xã hội châu Á và cộng đồng di dân, chịu ảnh hưởng của lịch sử, tôn giáo, truyền thông."
  ms: "Cara gender dan keinginan dihayati dan dipertikai dalam masyarakat Asia dan diaspora, serta pengaruh sejarah, agama dan media."
  id: "Cara gender dan hasrat dijalani dan diperdebatkan di masyarakat Asia dan diaspora, serta pengaruh sejarah, agama, dan media."
  hi: "एशियाई समाजों और प्रवासी समुदायों में जेंडर और इच्छा कैसे जी और बहस की जाती है, और इतिहास, धर्म व मीडिया का असर।"
outcomes:
  - en: "Apply gender theory to Asian contexts"
    zh: "把性别理论用于亚洲语境"
    zh-TW: "把性別理論用於亞洲語境"
    ja: "ジェンダー理論をアジアの文脈に当てはめる"
    ko: "젠더 이론을 아시아 맥락에 적용하기"
    vi: "Áp dụng lý thuyết giới vào bối cảnh châu Á"
    ms: "Gunakan teori gender dalam konteks Asia"
    id: "Menerapkan teori gender pada konteks Asia"
    hi: "जेंडर सिद्धांत को एशियाई संदर्भ में लागू करना"
  - en: "Analyse how media and religion shape gender norms"
    zh: "分析媒体与宗教如何塑造性别规范"
    zh-TW: "分析媒體與宗教如何塑造性別規範"
    ja: "メディアと宗教がジェンダー規範をどう形づくるか分析する"
    ko: "미디어와 종교가 젠더 규범을 만드는 방식 분석하기"
    vi: "Phân tích truyền thông và tôn giáo định hình chuẩn mực giới"
    ms: "Analisis cara media dan agama membentuk norma gender"
    id: "Menganalisis cara media dan agama membentuk norma gender"
    hi: "मीडिया और धर्म जेंडर मानदंड कैसे गढ़ते हैं, विश्लेषण करना"
  - en: "Compare gender issues across Asian societies"
    zh: "比较亚洲各社会的性别议题"
    zh-TW: "比較亞洲各社會的性別議題"
    ja: "アジア各社会のジェンダー問題を比べる"
    ko: "아시아 사회 간 젠더 문제 비교하기"
    vi: "So sánh vấn đề giới giữa các xã hội châu Á"
    ms: "Bandingkan isu gender merentas masyarakat Asia"
    id: "Membandingkan isu gender antarmasyarakat Asia"
    hi: "एशियाई समाजों में जेंडर मुद्दों की तुलना करना"
