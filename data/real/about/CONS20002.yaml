code: CONS20002
year: 2026
learn:
  en: "How to measure building work: quantities, descriptions and bills of quantities for simple houses using the Australian standard."
  zh: "如何计量建筑工程：按澳洲标准为简单住宅计算工程量并编制工程量清单。"
  zh-TW: "如何計量建築工程：依澳洲標準為簡單住宅計算數量並編製數量清單。"
  ja: "建築工事の数量算出：豪州基準で簡単な住宅の数量と内訳書をつくる。"
  ko: "건축 공사 물량 산출: 호주 기준으로 단순 주택의 수량과 내역서 작성."
  vi: "Cách đo bóc khối lượng: mô tả hạng mục và lập bảng khối lượng cho nhà đơn giản theo chuẩn Úc."
  ms: "Cara mengukur kerja binaan: kuantiti, huraian dan senarai kuantiti untuk rumah ringkas ikut piawai Australia."
  id: "Cara mengukur pekerjaan bangunan: kuantitas, uraian, dan daftar kuantitas rumah sederhana sesuai standar Australia."
  hi: "निर्माण कार्य का माप: ऑस्ट्रेलियाई मानक से सरल घरों की मात्रा और बिल ऑफ़ क्वांटिटीज़।"
outcomes:
  - en: "Take off quantities from drawings"
    zh: "从图纸中计算工程量"
    zh-TW: "從圖面中計算數量"
    ja: "図面から数量を拾い出す"
    ko: "도면에서 물량 산출하기"
    vi: "Bóc khối lượng từ bản vẽ"
    ms: "Ambil kuantiti daripada lukisan"
    id: "Menghitung kuantitas dari gambar"
    hi: "ड्रॉइंग से मात्रा निकालना"
  - en: "Write clear item descriptions"
    zh: "撰写清晰的项目描述"
    zh-TW: "撰寫清晰的項目描述"
    ja: "分かりやすい項目説明を書く"
    ko: "명확한 항목 설명 쓰기"
    vi: "Viết mô tả hạng mục rõ ràng"
    ms: "Tulis huraian item yang jelas"
    id: "Menulis uraian item yang jelas"
    hi: "मदों का साफ़ विवरण लिखना"
  - en: "Prepare a bill of quantities"
    zh: "编制工程量清单"
    zh-TW: "編製數量清單"
    ja: "数量内訳書を作成する"
    ko: "물량 내역서 작성하기"
    vi: "Lập bảng khối lượng"
    ms: "Sediakan senarai kuantiti"
    id: "Menyusun daftar kuantitas"
    hi: "बिल ऑफ़ क्वांटिटीज़ तैयार करना"
