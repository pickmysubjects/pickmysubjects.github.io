code: ENGL20039
year: 2027
learn:
  en: "Indigenous and Pasifika performance, from ceremony and dance to theatre and digital work, as a way of holding knowledge."
  zh: "原住民与太平洋岛民的表演：从仪式、舞蹈到戏剧和数字作品，看表演如何承载知识。"
  zh-TW: "原住民與太平洋島民的表演：從儀式、舞蹈到戲劇和數位作品，看表演如何承載知識。"
  ja: "先住民と太平洋諸島の人々のパフォーマンス：儀式や踊りから演劇・デジタル作品まで、知を伝えるものとして学ぶ。"
  ko: "원주민과 태평양 도서민의 공연: 의식과 춤부터 연극·디지털 작품까지, 지식을 담는 방식으로서 살펴본다."
  vi: "Nghệ thuật trình diễn của người bản địa và Pasifika, từ nghi lễ, múa đến sân khấu và tác phẩm số, như một cách lưu giữ tri thức."
  ms: "Persembahan Orang Asli dan Pasifika, daripada upacara dan tarian hingga teater dan karya digital, sebagai cara menyimpan ilmu."
  id: "Pertunjukan Pribumi dan Pasifika, dari upacara dan tari hingga teater dan karya digital, sebagai cara menyimpan pengetahuan."
  hi: "आदिवासी और पासिफ़िका प्रदर्शन — अनुष्ठान व नृत्य से थिएटर और डिजिटल काम तक — ज्ञान संजोने के तरीके के रूप में।"
outcomes:
  - en: "Read performances in their cultural and political context"
    zh: "在文化和政治背景中解读表演"
    zh-TW: "在文化和政治脈絡中解讀表演"
    ja: "文化的・政治的文脈の中で上演を読み解く"
    ko: "문화·정치적 맥락 속에서 공연 해석하기"
    vi: "Hiểu các buổi diễn trong bối cảnh văn hóa và chính trị"
    ms: "Tafsir persembahan dalam konteks budaya dan politik"
    id: "Menafsirkan pertunjukan dalam konteks budaya dan politik"
    hi: "प्रदर्शनों को उनके सांस्कृतिक व राजनीतिक संदर्भ में समझना"
  - en: "Link performance to sovereignty, activism and ecology"
    zh: "分析表演与主权、社会运动和生态的关系"
    zh-TW: "分析表演與主權、社會運動和生態的關係"
    ja: "上演と主権・アクティビズム・環境の関係を分析する"
    ko: "공연과 주권·행동주의·생태의 관계 분석하기"
    vi: "Liên hệ trình diễn với chủ quyền, hoạt động xã hội và sinh thái"
    ms: "Kaitkan persembahan dengan kedaulatan, aktivisme dan ekologi"
    id: "Mengaitkan pertunjukan dengan kedaulatan, aktivisme, dan ekologi"
    hi: "प्रदर्शन को संप्रभुता, सक्रियता और पारिस्थितिकी से जोड़ना"
