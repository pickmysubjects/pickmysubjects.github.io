code: FLTV30026
year: 2026
learn:
  en: "Film marketing, publicity and funding from industry speakers, applied to your own graduate film."
  zh: "行业嘉宾讲电影营销、宣传与资助，并用在你的毕业作品上。"
  zh-TW: "業界講者談電影行銷、宣傳與補助，並用在你的畢業作品上。"
  ja: "業界講師から映画の宣伝・広報・資金調達を学び、自分の卒業作品に生かす。"
  ko: "업계 강사에게 영화 마케팅·홍보·펀딩을 배워 졸업 작품에 적용한다."
  vi: "Tiếp thị, quảng bá và tài trợ phim từ người trong ngành, áp dụng cho phim tốt nghiệp."
  ms: "Pemasaran, publisiti dan dana filem daripada penceramah industri, untuk filem graduan."
  id: "Pemasaran, publisitas dan pendanaan film dari praktisi, untuk film kelulusan sendiri."
  hi: "इंडस्ट्री वक्ताओं से फ़िल्म मार्केटिंग, पब्लिसिटी और फ़ंडिंग, अपनी ग्रेजुएट फ़िल्म पर लागू।"
outcomes:
  - en: "Profile and interview an industry professional"
    zh: "采访并介绍一位业内人士"
    zh-TW: "採訪並介紹一位業界人士"
    ja: "業界人に取材しプロフィールを書く"
    ko: "업계 전문가 인터뷰하고 소개하기"
    vi: "Phỏng vấn và viết về người trong ngành"
    ms: "Temu bual dan profil profesional industri"
    id: "Mewawancarai dan memprofilkan praktisi"
    hi: "किसी इंडस्ट्री पेशेवर का इंटरव्यू और प्रोफ़ाइल"
  - en: "Put together an electronic press kit"
    zh: "制作电子宣传资料包"
    zh-TW: "製作電子宣傳資料包"
    ja: "電子プレスキットを作る"
    ko: "전자 보도자료 키트 만들기"
    vi: "Làm bộ tài liệu báo chí điện tử"
    ms: "Sediakan kit media elektronik"
    id: "Menyusun kit pers elektronik"
    hi: "इलेक्ट्रॉनिक प्रेस किट बनाना"
  - en: "Plan a festival strategy for a short film"
    zh: "为短片制定电影节策略"
    zh-TW: "為短片制定影展策略"
    ja: "短編の映画祭戦略を立てる"
    ko: "단편 영화제 전략 세우기"
    vi: "Lập chiến lược liên hoan cho phim ngắn"
    ms: "Rancang strategi festival filem pendek"
    id: "Menyusun strategi festival film pendek"
    hi: "शॉर्ट फ़िल्म के लिए फ़ेस्टिवल रणनीति बनाना"
