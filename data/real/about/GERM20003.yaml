code: GERM20003
year: 2026
learn:
  en: "A focused study, in German, of one topic in the literature, media, culture or history of German-speaking societies."
  zh: "用德语深入学习德语社会文学、媒体、文化或历史中的一个专题。"
  zh-TW: "用德語深入學習德語社會文學、媒體、文化或歷史中的一個專題。"
  ja: "ドイツ語圏社会の文学・メディア・文化・歴史から一つのテーマをドイツ語で掘り下げる。"
  ko: "독일어권 사회의 문학·미디어·문화·역사 중 한 주제를 독일어로 깊이 공부한다."
  vi: "Học sâu bằng tiếng Đức một chủ đề về văn học, truyền thông, văn hóa hay lịch sử các xã hội nói tiếng Đức."
  ms: "Kajian mendalam dalam bahasa Jerman tentang satu topik sastera, media, budaya atau sejarah masyarakat berbahasa Jerman."
  id: "Kajian mendalam dalam bahasa Jerman atas satu topik sastra, media, budaya atau sejarah masyarakat berbahasa Jerman."
  hi: "जर्मन-भाषी समाजों के साहित्य, मीडिया, संस्कृति या इतिहास के एक विषय का जर्मन में गहन अध्ययन।"
outcomes:
  - en: "Explain a cultural topic and why it still matters"
    zh: "解释一个文化专题及其当下意义"
    zh-TW: "解釋一個文化專題及其當下意義"
    ja: "文化のテーマとその今日的な意味を説明する"
    ko: "문화 주제와 그 현재적 의미 설명하기"
    vi: "Giải thích một chủ đề văn hóa và ý nghĩa ngày nay"
    ms: "Terangkan topik budaya dan kepentingannya kini"
    id: "Menjelaskan topik budaya dan relevansinya kini"
    hi: "किसी सांस्कृतिक विषय और उसकी आज की अहमियत समझाना"
  - en: "Analyse German texts and media"
    zh: "分析德语文本和媒体"
    zh-TW: "分析德語文本和媒體"
    ja: "ドイツ語の文章やメディアを分析する"
    ko: "독일어 글과 미디어 분석하기"
    vi: "Phân tích văn bản và truyền thông tiếng Đức"
    ms: "Analisis teks dan media Jerman"
    id: "Menganalisis teks dan media Jerman"
    hi: "जर्मन पाठों और मीडिया का विश्लेषण करना"
  - en: "Discuss the topic in German"
    zh: "用德语讨论该专题"
    zh-TW: "用德語討論該專題"
    ja: "テーマについてドイツ語で議論する"
    ko: "주제를 독일어로 토론하기"
    vi: "Thảo luận chủ đề bằng tiếng Đức"
    ms: "Bincang topik dalam bahasa Jerman"
    id: "Membahas topik dalam bahasa Jerman"
    hi: "विषय पर जर्मन में चर्चा करना"
