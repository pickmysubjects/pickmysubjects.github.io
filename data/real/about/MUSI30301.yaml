code: MUSI30301
year: 2027
learn:
  en: "A supervised work placement with a music or performing arts organisation, plus seminars on careers and workplaces."
  zh: "在音乐或表演艺术机构进行有指导的实习，并参加关于职业和职场的研讨课。"
  zh-TW: "在音樂或表演藝術機構進行有指導的實習，並參加關於職涯和職場的研討課。"
  ja: "音楽・舞台芸術団体での指導付き職場実習と、キャリアや職場についてのセミナー。"
  ko: "음악·공연예술 단체에서의 지도 인턴십과 커리어·직장에 관한 세미나."
  vi: "Thực tập có hướng dẫn tại tổ chức âm nhạc hoặc nghệ thuật biểu diễn, kèm các buổi seminar về nghề nghiệp và nơi làm việc."
  ms: "Penempatan kerja diselia di organisasi muzik atau seni persembahan, serta seminar tentang kerjaya dan tempat kerja."
  id: "Magang terbimbing di organisasi musik atau seni pertunjukan, plus seminar tentang karier dan dunia kerja."
  hi: "संगीत या प्रदर्शन कला संगठन में निगरानी वाली इंटर्नशिप, साथ ही करियर व कार्यस्थल पर सेमिनार।"
outcomes:
  - en: "Make career connections with people and organisations"
    zh: "与业内人士和机构建立职业联系"
    zh-TW: "與業內人士和機構建立職涯人脈"
    ja: "人や団体とキャリアのつながりを作る"
    ko: "사람·단체와 커리어 인맥 쌓기"
    vi: "Tạo mối quan hệ nghề nghiệp với cá nhân và tổ chức"
    ms: "Bina hubungan kerjaya dengan individu dan organisasi"
    id: "Membangun relasi karier dengan orang dan organisasi"
    hi: "लोगों व संगठनों से करियर संबंध बनाना"
  - en: "Work professionally in a real workplace"
    zh: "在真实职场中专业地工作"
    zh-TW: "在真實職場中專業地工作"
    ja: "実際の職場でプロとして働く"
    ko: "실제 직장에서 전문적으로 일하기"
    vi: "Làm việc chuyên nghiệp tại nơi làm việc thật"
    ms: "Bekerja secara profesional di tempat kerja sebenar"
    id: "Bekerja secara profesional di tempat kerja nyata"
    hi: "असली कार्यस्थल पर पेशेवर ढंग से काम करना"
  - en: "Reflect critically on your placement"
    zh: "批判性地反思实习经历"
    zh-TW: "批判性地反思實習經驗"
    ja: "実習経験を批判的に振り返る"
    ko: "인턴십 경험 비판적으로 돌아보기"
    vi: "Nhìn nhận có phê phán về kỳ thực tập"
    ms: "Renung secara kritis pengalaman penempatan"
    id: "Merefleksikan pengalaman magang secara kritis"
    hi: "इंटर्नशिप अनुभव पर आलोचनात्मक चिंतन"
