code: ELEN90089
year: 2027
learn:
  en: "A team project building and tuning parts of a real communication system for a set application."
  zh: "以小组项目形式，为特定应用搭建并优化通信系统的组件。"
  zh-TW: "以小組專題形式，為特定應用建置並最佳化通訊系統的元件。"
  ja: "チームで、特定用途に向けた通信システムの構成要素を実装・最適化する。"
  ko: "팀 프로젝트로 특정 용도의 통신 시스템 구성 요소를 구현하고 최적화합니다."
  vi: "Dự án nhóm xây dựng và tối ưu các thành phần của hệ thống truyền thông cho một ứng dụng cụ thể."
  ms: "Projek berkumpulan membina dan menala komponen sistem komunikasi untuk aplikasi tertentu."
  id: "Proyek tim membangun dan menyetel komponen sistem komunikasi untuk aplikasi tertentu."
  hi: "किसी तय उपयोग के लिए संचार प्रणाली के हिस्से बनाने और सुधारने का टीम प्रोजेक्ट।"
outcomes:
  - en: "Set requirements and compare design options through analysis and simulation"
    zh: "确定需求，并通过分析和仿真比较设计方案"
    zh-TW: "確定需求，並透過分析與模擬比較設計方案"
    ja: "要件を定め、解析とシミュレーションで設計案を比べる"
    ko: "요구사항을 정하고 분석과 시뮬레이션으로 설계안 비교하기"
    vi: "Xác định yêu cầu và so sánh phương án qua phân tích, mô phỏng"
    ms: "Menetapkan keperluan dan membandingkan pilihan reka bentuk melalui analisis dan simulasi"
    id: "Menetapkan kebutuhan dan membandingkan opsi desain lewat analisis dan simulasi"
    hi: "आवश्यकताएँ तय करना और विश्लेषण व सिमुलेशन से डिज़ाइन विकल्पों की तुलना"
  - en: "Build with modern communication hardware and software"
    zh: "使用现代通信软硬件进行开发"
    zh-TW: "使用現代通訊軟硬體進行開發"
    ja: "最新の通信ハード・ソフトで構築する"
    ko: "최신 통신 하드웨어·소프트웨어로 구현하기"
    vi: "Xây dựng với phần cứng và phần mềm truyền thông hiện đại"
    ms: "Membina dengan perkakasan dan perisian komunikasi moden"
    id: "Membangun dengan perangkat keras dan lunak komunikasi modern"
    hi: "आधुनिक संचार हार्डवेयर और सॉफ़्टवेयर से निर्माण"
  - en: "Manage a team design project and report on it"
    zh: "管理团队设计项目并撰写报告"
    zh-TW: "管理團隊設計專題並撰寫報告"
    ja: "チームの設計プロジェクトを管理し報告する"
    ko: "팀 설계 프로젝트 관리 및 보고하기"
    vi: "Quản lý dự án thiết kế nhóm và báo cáo"
    ms: "Mengurus projek reka bentuk berkumpulan dan melaporkannya"
    id: "Mengelola proyek desain tim dan melaporkannya"
    hi: "टीम डिज़ाइन प्रोजेक्ट का प्रबंधन और रिपोर्ट"
