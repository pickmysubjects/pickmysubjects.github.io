code: OPTO30007
year: 2026
learn:
  en: "How the eyes and brain process what we see, and how it links to other senses and to eye disorders."
  zh: "眼睛和大脑怎么处理视觉，和其他感官及视觉疾病的关系。"
outcomes:
  - en: "Explain how each part of the visual system works"
    zh: "讲清视觉系统各部分怎么工作"
  - en: "Link brain problems to specific vision disorders"
    zh: "把大脑问题和视觉疾病对应起来"
  - en: "Explain vision science to non-scientists"
    zh: "给非专业的人讲明白视觉科学"
