code: OPTO30007
year: 2026
learn:
  en: "How the eyes and brain process what we see, and how it links to other senses and to eye disorders."
  zh: "眼睛和大脑怎么处理视觉，和其他感官及视觉疾病的关系。"
  zh-TW: "眼睛和大腦怎麼處理視覺，和其他感官及視覺疾病的關係。"
  ja: "目と脳が見たものを処理する仕組みと、他の感覚や目の病気との関わり。"
  ko: "눈과 뇌가 시각 정보를 처리하는 방식, 그리고 다른 감각 및 눈 질환과의 관계."
  vi: "Mắt và não xử lý hình ảnh ra sao, và liên hệ với giác quan khác và bệnh về mắt."
  ms: "Cara mata dan otak memproses apa yang dilihat, dan kaitannya dengan deria lain serta gangguan mata."
  id: "Cara mata dan otak memproses apa yang kita lihat, dan kaitannya dengan indra lain serta gangguan mata."
  hi: "आँखें और दिमाग देखी चीज़ों को कैसे समझते हैं, और इसका दूसरी इंद्रियों व आँखों के रोगों से संबंध।"
outcomes:
  - en: "Explain how each part of the visual system works"
    zh: "讲清视觉系统各部分怎么工作"
    zh-TW: "講清楚視覺系統各部分怎麼運作"
    ja: "視覚系の各部分の働きを説明する"
    ko: "시각계 각 부분의 작동 방식 설명하기"
    vi: "Giải thích từng phần của hệ thị giác hoạt động ra sao"
    ms: "Menerangkan cara setiap bahagian sistem visual berfungsi"
    id: "Menjelaskan cara kerja tiap bagian sistem visual"
    hi: "दृष्टि तंत्र का हर हिस्सा कैसे काम करता है"
  - en: "Link brain problems to specific vision disorders"
    zh: "把大脑问题和视觉疾病对应起来"
    zh-TW: "把大腦問題和視覺疾病對應起來"
    ja: "脳の問題を特定の視覚障害と結びつける"
    ko: "뇌 문제를 특정 시각 장애와 연결하기"
    vi: "Liên hệ vấn đề ở não với rối loạn thị giác cụ thể"
    ms: "Mengaitkan masalah otak dengan gangguan penglihatan tertentu"
    id: "Menghubungkan masalah otak dengan gangguan penglihatan tertentu"
    hi: "दिमाग की समस्याओं को खास दृष्टि रोगों से जोड़ना"
  - en: "Explain vision science to non-scientists"
    zh: "给非专业的人讲明白视觉科学"
    zh-TW: "向非專業的人講明白視覺科學"
    ja: "視覚科学を専門外の人に説明する"
    ko: "비전문가에게 시각 과학 설명하기"
    vi: "Giải thích khoa học thị giác cho người ngoài ngành"
    ms: "Menerangkan sains penglihatan kepada bukan saintis"
    id: "Menjelaskan ilmu penglihatan ke orang awam"
    hi: "गैर-वैज्ञानिकों को दृष्टि विज्ञान समझाना"
