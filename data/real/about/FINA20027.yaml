code: FINA20027
year: 2026
learn:
  en: "Studio art with more room to experiment, moving toward a focused line of enquiry and a regular studio routine."
  zh: "更有实验空间的工作室创作，逐步聚焦自己的创作方向。"
  zh-TW: "更有實驗空間的工作室創作，逐步聚焦自己的創作方向。"
  ja: "実験の余地を広げた制作で、自分の探究テーマを絞り込む。"
  ko: "실험 폭을 넓힌 작업실 작업으로 자신의 탐구 방향을 좁혀 간다."
  vi: "Sáng tác ở xưởng với nhiều thử nghiệm, dần tìm hướng đi riêng."
  ms: "Seni studio dengan lebih ruang uji kaji, menuju bidang tumpuan sendiri."
  id: "Seni studio dengan ruang eksperimen, menuju fokus kajian sendiri."
  hi: "प्रयोग की ज़्यादा जगह वाला स्टूडियो कला-कार्य, अपनी दिशा तय करते हुए।"
outcomes:
  - en: "Keep a journal linking your work to art history"
    zh: "写日志把作品与艺术史联系起来"
    zh-TW: "寫日誌把作品與藝術史連結起來"
    ja: "作品と美術史をつなぐ日誌をつける"
    ko: "작업과 미술사를 잇는 일지 쓰기"
    vi: "Ghi nhật ký nối tác phẩm với lịch sử nghệ thuật"
    ms: "Simpan jurnal kaitkan karya dengan sejarah seni"
    id: "Membuat jurnal yang mengaitkan karya dan sejarah seni"
    hi: "अपने काम को कला-इतिहास से जोड़ती डायरी रखना"
  - en: "Present a folio or final body of work"
    zh: "提交作品集或最终系列作品"
    zh-TW: "提交作品集或最終系列作品"
    ja: "ポートフォリオまたは最終作品群を提出する"
    ko: "포트폴리오나 최종 작품군 제출하기"
    vi: "Nộp hồ sơ tác phẩm hoặc bộ tác phẩm cuối"
    ms: "Serah folio atau himpunan karya akhir"
    id: "Menyerahkan portofolio atau karya akhir"
    hi: "फ़ोलियो या अंतिम कृतियाँ प्रस्तुत करना"
  - en: "Talk about your work and others' in critiques"
    zh: "在评图中讨论自己和他人的作品"
    zh-TW: "在評圖中討論自己和他人的作品"
    ja: "講評で自他の作品を語る"
    ko: "크리틱에서 자기·남의 작업 이야기하기"
    vi: "Bàn về tác phẩm của mình và người khác"
    ms: "Bincang karya sendiri dan orang lain"
    id: "Membahas karya sendiri dan orang lain"
    hi: "क्रिटीक में अपने और दूसरों के काम पर बात करना"
