code: COMP90053
year: 2027
learn:
  en: "Meta-programs: programs that read, analyse, transform or generate other programs."
  zh: "元程序：读取、分析、变换或生成其他程序的程序。"
  zh-TW: "元程式：讀取、分析、轉換或產生其他程式的程式。"
  ja: "メタプログラム：他のプログラムを読み、解析し、変換・生成するプログラム。"
  ko: "메타 프로그램: 다른 프로그램을 읽고 분석·변환·생성하는 프로그램."
  vi: "Siêu chương trình: chương trình đọc, phân tích, biến đổi hoặc sinh chương trình khác."
  ms: "Meta-program: program yang membaca, menganalisis, mengubah atau menjana program lain."
  id: "Meta-program: program yang membaca, menganalisis, mengubah, atau menghasilkan program lain."
  hi: "मेटा-प्रोग्राम: दूसरे प्रोग्राम पढ़ने, विश्लेषण, बदलने या बनाने वाले प्रोग्राम।"
outcomes:
  - en: "Explain how program analysis tools work"
    zh: "解释程序分析工具的原理"
    zh-TW: "解釋程式分析工具的原理"
    ja: "プログラム解析ツールの仕組みを説明する"
    ko: "프로그램 분석 도구 원리 설명하기"
    vi: "Giải thích cách công cụ phân tích chương trình hoạt động"
    ms: "Terangkan cara alat analisis program berfungsi"
    id: "Menjelaskan cara kerja alat analisis program"
    hi: "प्रोग्राम विश्लेषण टूल कैसे काम करते हैं, समझाना"
  - en: "Write programs that analyse or transform code"
    zh: "编写分析或变换代码的程序"
    zh-TW: "撰寫分析或轉換程式碼的程式"
    ja: "コードを解析・変換するプログラムを書く"
    ko: "코드를 분석·변환하는 프로그램 작성하기"
    vi: "Viết chương trình phân tích hoặc biến đổi mã"
    ms: "Tulis program yang menganalisis atau mengubah kod"
    id: "Menulis program yang menganalisis atau mengubah kode"
    hi: "कोड का विश्लेषण या बदलाव करने वाले प्रोग्राम लिखना"
