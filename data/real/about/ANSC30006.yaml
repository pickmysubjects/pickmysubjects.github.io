code: ANSC30006
year: 2026
learn:
  en: "What keeps production animals healthy, key diseases in Australian livestock, and using data to find disease."
  zh: "影响生产动物健康的因素、澳洲家畜主要疾病，用数据发现疾病。"
  zh-TW: "影響生產動物健康的因素、澳洲家畜主要疾病，用數據發現疾病。"
  ja: "生産動物の健康要因、オーストラリアの主要な家畜疾病、データでの病気の発見。"
  ko: "생산 동물 건강 요인, 호주 가축 주요 질병, 데이터로 질병 찾기."
  vi: "Yếu tố sức khỏe vật nuôi sản xuất, bệnh chính ở gia súc Úc, dùng dữ liệu phát hiện bệnh."
  ms: "Faktor kesihatan haiwan pengeluaran, penyakit utama ternakan Australia, dan guna data untuk kesan penyakit."
  id: "Faktor kesehatan hewan produksi, penyakit utama ternak Australia, dan memakai data untuk deteksi penyakit."
  hi: "उत्पादन पशुओं का स्वास्थ्य, ऑस्ट्रेलियाई पशुधन के मुख्य रोग, और डेटा से रोग पहचानना।"
outcomes:
  - en: "Analyse herd data to measure disease impact"
    zh: "分析畜群数据评估疾病影响"
    zh-TW: "分析畜群數據評估疾病影響"
    ja: "家畜データを分析し病気の影響を測る"
    ko: "가축 데이터로 질병 영향 분석하기"
    vi: "Phân tích dữ liệu đàn để đo tác động bệnh"
    ms: "Analisis data ternakan untuk ukur kesan penyakit"
    id: "Menganalisis data ternak untuk mengukur dampak penyakit"
    hi: "झुंड के डेटा से रोग का असर आँकना"
  - en: "Link farm management to disease risk"
    zh: "把养殖管理与疾病风险联系起来"
    zh-TW: "把飼養管理與疾病風險連結起來"
    ja: "飼養管理と病気のリスクを結びつける"
    ko: "사육 관리와 질병 위험 연결하기"
    vi: "Gắn quản lý trang trại với nguy cơ bệnh"
    ms: "Kaitkan pengurusan ladang dengan risiko penyakit"
    id: "Mengaitkan manajemen peternakan dengan risiko penyakit"
    hi: "फ़ार्म प्रबंधन को रोग जोखिम से जोड़ना"
