code: CCDP10002
year: 2026
learn:
  en: "A tour of 20th and 21st century electronic art, from video and sound art to installations and design."
  zh: "20至21世纪电子艺术概览，从影像、声音艺术到装置与设计。"
  zh-TW: "20至21世紀電子藝術概覽，從影像、聲音藝術到裝置與設計。"
  ja: "映像やサウンドアートから設置作品まで、20〜21世紀の電子芸術。"
  ko: "영상·사운드 아트부터 설치·디자인까지 20~21세기 전자 예술 개관."
  vi: "Tổng quan nghệ thuật điện tử thế kỷ 20-21, từ video, âm thanh đến sắp đặt và thiết kế."
  ms: "Tinjauan seni elektronik abad ke-20 dan 21, dari video dan bunyi hingga instalasi."
  id: "Tinjauan seni elektronik abad 20 dan 21, dari video dan bunyi hingga instalasi."
  hi: "20वीं-21वीं सदी की इलेक्ट्रॉनिक कला, वीडियो और साउंड आर्ट से इंस्टॉलेशन तक।"
outcomes:
  - en: "Describe the history of artists working with electronics"
    zh: "讲述使用电子技术的艺术家的历史"
    zh-TW: "講述使用電子技術的藝術家的歷史"
    ja: "電子技術を使う芸術家の歴史を説明する"
    ko: "전자 기술을 쓰는 예술가의 역사 설명하기"
    vi: "Mô tả lịch sử các nghệ sĩ làm việc với điện tử"
    ms: "Huraikan sejarah artis yang menggunakan elektronik"
    id: "Menjelaskan sejarah seniman yang memakai elektronik"
    hi: "इलेक्ट्रॉनिक्स से काम करने वाले कलाकारों का इतिहास बताना"
  - en: "Make and present original electronic work in a group"
    zh: "小组创作并展示原创电子作品"
    zh-TW: "小組創作並展示原創電子作品"
    ja: "グループで電子作品を作り発表する"
    ko: "그룹으로 전자 작품 만들고 발표하기"
    vi: "Cùng nhóm làm và trình bày tác phẩm điện tử"
    ms: "Hasil dan bentang karya elektronik dalam kumpulan"
    id: "Membuat dan menyajikan karya elektronik bersama kelompok"
    hi: "समूह में मौलिक इलेक्ट्रॉनिक कृति बनाना और दिखाना"
  - en: "Write critically about art and technology"
    zh: "批判性地书写艺术与科技"
    zh-TW: "批判性地書寫藝術與科技"
    ja: "芸術と技術について批評的に書く"
    ko: "예술과 기술에 대해 비판적으로 글쓰기"
    vi: "Viết có tính phản biện về nghệ thuật và công nghệ"
    ms: "Menulis secara kritis tentang seni dan teknologi"
    id: "Menulis kritis tentang seni dan teknologi"
    hi: "कला और तकनीक पर आलोचनात्मक लेखन करना"
