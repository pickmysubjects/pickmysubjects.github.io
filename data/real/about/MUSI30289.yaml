code: MUSI30289
year: 2026
learn:
  en: "Rehearse and perform in a guitar ensemble, from large group pieces to duets, trios and quartets."
  zh: "在吉他合奏团排练演出，从大合奏到二重奏、三重奏和四重奏。"
  zh-TW: "在吉他合奏團排練演出，從大合奏到二重奏、三重奏和四重奏。"
  ja: "ギターアンサンブルで大編成曲からデュオ・トリオ・カルテットまで練習し演奏する。"
  ko: "기타 앙상블에서 대편성 곡부터 2·3·4중주까지 연습하고 공연하기."
  vi: "Tập và biểu diễn trong dàn guitar, từ bản hòa tấu lớn đến song tấu, tam tấu, tứ tấu."
  ms: "Berlatih dan membuat persembahan dalam ensembel gitar, dari karya kumpulan besar hingga duet, trio dan kuartet."
  id: "Berlatih dan tampil dalam ansambel gitar, dari karya kelompok besar hingga duet, trio, dan kuartet."
  hi: "गिटार एन्सेम्बल में बड़े समूह के टुकड़ों से लेकर डुएट, ट्रायो और क्वार्टेट तक का अभ्यास और प्रदर्शन।"
outcomes:
  - en: "Play your part confidently in a group"
    zh: "在团队中自信地演奏自己的声部"
    zh-TW: "在團隊中自信地演奏自己的聲部"
    ja: "グループの中で自信を持って自分のパートを弾く"
    ko: "그룹 안에서 자기 파트를 자신 있게 연주하기"
    vi: "Tự tin chơi phần của mình trong nhóm"
    ms: "Mainkan bahagian sendiri dengan yakin dalam kumpulan"
    id: "Memainkan bagian sendiri dengan percaya diri dalam grup"
    hi: "समूह में अपना हिस्सा आत्मविश्वास से बजाना"
  - en: "Bring ensemble pieces up to concert standard"
    zh: "把合奏曲目练到音乐会水准"
    zh-TW: "把合奏曲目練到音樂會水準"
    ja: "合奏曲をコンサート水準まで仕上げる"
    ko: "합주곡을 공연 수준까지 완성하기"
    vi: "Đưa các bản hòa tấu lên chuẩn biểu diễn"
    ms: "Bawa karya ensembel ke tahap konsert"
    id: "Membawa karya ansambel ke standar konser"
    hi: "एन्सेम्बल रचनाओं को कॉन्सर्ट स्तर तक लाना"
  - en: "Plan rehearsal time and work as a team"
    zh: "规划排练时间并做好团队协作"
    zh-TW: "規劃排練時間並做好團隊協作"
    ja: "練習時間を計画し、チームで取り組む"
    ko: "리허설 시간을 계획하고 팀으로 협업하기"
    vi: "Lên kế hoạch tập luyện và làm việc nhóm"
    ms: "Rancang masa latihan dan bekerja sebagai pasukan"
    id: "Merencanakan waktu latihan dan bekerja sebagai tim"
    hi: "रिहर्सल का समय तय करना और टीम में काम करना"
