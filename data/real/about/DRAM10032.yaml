code: DRAM10032
year: 2026
learn:
  en: "Meet key theatre makers past and present through themes like ritual, text, space and body, and learn to analyse performance."
  zh: "通过仪式、文本、空间、身体等主题认识古今戏剧人，学会分析表演。"
  zh-TW: "透過儀式、文本、空間、身體等主題認識古今劇場人，學會分析表演。"
  ja: "儀式・テキスト・空間・身体などのテーマで古今の演劇人を知り、上演の分析を学ぶ。"
  ko: "의식, 텍스트, 공간, 몸 같은 주제로 고금의 연극인을 만나고 공연 분석을 배운다."
  vi: "Tìm hiểu các nhà sân khấu xưa và nay qua chủ đề nghi lễ, văn bản, không gian, cơ thể; học phân tích biểu diễn."
  ms: "Kenali pengamal teater dulu dan kini melalui tema ritual, teks, ruang dan tubuh, serta belajar menganalisis persembahan."
  id: "Mengenal tokoh teater dulu dan kini lewat tema ritual, teks, ruang dan tubuh, serta belajar menganalisis pertunjukan."
  hi: "अनुष्ठान, पाठ, स्थान और शरीर जैसे विषयों से पुराने-नए रंगकर्मियों को जानना और प्रस्तुति का विश्लेषण सीखना।"
outcomes:
  - en: "Describe, interpret and analyse a performance"
    zh: "描述、诠释并分析一场演出"
    zh-TW: "描述、詮釋並分析一場演出"
    ja: "上演を記述・解釈・分析する"
    ko: "공연을 묘사·해석·분석하기"
    vi: "Mô tả, diễn giải và phân tích một buổi diễn"
    ms: "Huraikan, tafsir dan analisis persembahan"
    id: "Mendeskripsikan, menafsirkan dan menganalisis pertunjukan"
    hi: "किसी प्रस्तुति का वर्णन, व्याख्या और विश्लेषण"
  - en: "Research using library sources"
    zh: "利用图书馆资料做研究"
    zh-TW: "利用圖書館資料做研究"
    ja: "図書館の資料で調べる"
    ko: "도서관 자료로 조사하기"
    vi: "Nghiên cứu bằng nguồn thư viện"
    ms: "Buat kajian menggunakan sumber perpustakaan"
    id: "Meneliti dengan sumber perpustakaan"
    hi: "लाइब्रेरी स्रोतों से शोध करना"
  - en: "Place your own artistic growth in history"
    zh: "把自己的艺术成长放入历史脉络"
    zh-TW: "把自己的藝術成長放入歷史脈絡"
    ja: "自分の芸術的成長を歴史の中に位置づける"
    ko: "자신의 예술적 성장을 역사 속에 놓기"
    vi: "Đặt sự phát triển nghệ thuật của mình vào lịch sử"
    ms: "Letak perkembangan seni diri dalam sejarah"
    id: "Menempatkan perkembangan seni diri dalam sejarah"
    hi: "अपने कलात्मक विकास को इतिहास में रखना"
