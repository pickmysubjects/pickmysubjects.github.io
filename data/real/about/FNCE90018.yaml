code: FNCE90018
year: 2027
learn:
  en: "Capital budgeting, capital structure, dividends and risk management, including Australia's dividend imputation system."
  zh: "资本预算、资本结构、股利政策和风险管理，包括澳大利亚股息归集抵免制度。"
  zh-TW: "資本預算、資本結構、股利政策與風險管理，包括澳洲股利設算扣抵制度。"
  ja: "資本予算、資本構成、配当政策、リスク管理と、豪州の配当インピュテーション制度。"
  ko: "자본예산, 자본구조, 배당정책, 위험관리와 호주의 배당귀속 제도."
  vi: "Hoạch định vốn, cơ cấu vốn, cổ tức, quản lý rủi ro, gồm cơ chế khấu trừ thuế cổ tức của Úc."
  ms: "Belanjawan modal, struktur modal, dividen dan pengurusan risiko, termasuk sistem imputasi dividen Australia."
  id: "Penganggaran modal, struktur modal, dividen, dan manajemen risiko, termasuk sistem imputasi dividen Australia."
  hi: "पूंजी बजटिंग, पूंजी संरचना, लाभांश और जोखिम प्रबंधन, ऑस्ट्रेलिया की डिविडेंड इम्प्यूटेशन प्रणाली सहित।"
outcomes:
  - en: "Analyse dividend and capital structure decisions"
    zh: "分析股利与资本结构决策"
    zh-TW: "分析股利與資本結構決策"
    ja: "配当と資本構成の意思決定を分析する"
    ko: "배당과 자본구조 결정 분석하기"
    vi: "Phân tích quyết định cổ tức và cơ cấu vốn"
    ms: "Menganalisis keputusan dividen dan struktur modal"
    id: "Menganalisis keputusan dividen dan struktur modal"
    hi: "लाभांश और पूंजी संरचना निर्णयों का विश्लेषण"
  - en: "Evaluate funding options such as leases"
    zh: "评估租赁等融资方式"
    zh-TW: "評估租賃等融資方式"
    ja: "リースなどの資金調達手段を評価する"
    ko: "리스 등 자금조달 방법 평가하기"
    vi: "Đánh giá các hình thức huy động vốn như thuê tài chính"
    ms: "Menilai pilihan pembiayaan seperti pajakan"
    id: "Mengevaluasi opsi pendanaan seperti sewa guna usaha"
    hi: "लीज़ जैसे वित्तपोषण विकल्पों का मूल्यांकन"
