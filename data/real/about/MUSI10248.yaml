code: MUSI10248
year: 2027
learn:
  en: "Individual lessons on your instrument or voice, working through technical exercises and recital pieces on a personal study plan."
  zh: "在自己的乐器或声乐方向上接受个别辅导，按个人学习计划练技巧和独奏曲目。"
  zh-TW: "在自己的樂器或聲樂方向上接受個別指導，依個人學習計畫練技巧和獨奏曲目。"
  ja: "自分の楽器または声楽の個人レッスンで、個別の学習計画に沿って技術練習とリサイタル曲に取り組む。"
  ko: "자신의 악기나 성악 개인 레슨을 받으며 개인 학습 계획에 따라 테크닉 연습과 리사이틀 곡을 익힘."
  vi: "Học riêng nhạc cụ hoặc thanh nhạc, luyện bài tập kỹ thuật và tiết mục độc tấu theo kế hoạch cá nhân."
  ms: "Kelas individu untuk alat muzik atau vokal, berlatih teknik dan repertoir resital mengikut pelan peribadi."
  id: "Les individual alat musik atau vokal, berlatih teknik dan repertoar resital sesuai rencana belajar pribadi."
  hi: "अपने वाद्य या गायन की व्यक्तिगत कक्षाएँ, निजी अध्ययन योजना के अनुसार तकनीकी अभ्यास और रिसाइटल पीस।"
outcomes:
  - en: "Apply technical control when performing"
    zh: "演奏时运用技术控制"
    zh-TW: "演奏時運用技術控制"
    ja: "演奏で技術的なコントロールを使う"
    ko: "연주에서 기술적 통제력 발휘하기"
    vi: "Vận dụng kiểm soát kỹ thuật khi biểu diễn"
    ms: "Gunakan kawalan teknik semasa persembahan"
    id: "Menerapkan kontrol teknik saat tampil"
    hi: "प्रस्तुति में तकनीकी नियंत्रण लागू करना"
  - en: "Play recital pieces fluently, accurately and with character"
    zh: "流畅、准确且有个性地演奏曲目"
    zh-TW: "流暢、準確且有個性地演奏曲目"
    ja: "曲を流暢・正確に、個性をもって演奏する"
    ko: "레퍼토리를 유창하고 정확하게, 개성 있게 연주하기"
    vi: "Trình diễn tiết mục trôi chảy, chính xác và có cá tính"
    ms: "Persembahkan repertoir dengan lancar, tepat dan berkarakter"
    id: "Membawakan repertoar dengan lancar, akurat, dan berkarakter"
    hi: "रिपर्टॉयर को सहजता, सटीकता और भाव के साथ प्रस्तुत करना"
  - en: "Bring the right style to a performance"
    zh: "在演奏中把握合适的风格"
    zh-TW: "在演奏中掌握合適的風格"
    ja: "演奏に適したスタイルを取り入れる"
    ko: "연주에 알맞은 스타일 적용하기"
    vi: "Thể hiện phong cách phù hợp khi biểu diễn"
    ms: "Bawa gaya yang sesuai dalam persembahan"
    id: "Membawakan gaya yang tepat dalam penampilan"
    hi: "प्रस्तुति में सही शैली लाना"
