code: MUSI10047
year: 2026
learn:
  en: "Music and society in Europe from about 1600 to 1800, through works, documents and debates on authenticity and meaning."
  zh: "约1600至1800年欧洲的音乐与社会，透过作品、史料及真实性与意义之争来学习。"
  zh-TW: "約1600至1800年歐洲的音樂與社會，透過作品、史料及真實性與意義之爭來學習。"
  ja: "1600〜1800年頃のヨーロッパの音楽と社会を、作品・史料・真正性の議論から学ぶ。"
  ko: "약 1600~1800년 유럽의 음악과 사회를 작품·사료·진정성 논쟁으로 탐구."
  vi: "Âm nhạc và xã hội châu Âu khoảng 1600–1800 qua tác phẩm, tư liệu và tranh luận về tính xác thực."
  ms: "Muzik dan masyarakat Eropah sekitar 1600–1800 melalui karya, dokumen dan debat keaslian."
  id: "Musik dan masyarakat Eropa sekitar 1600–1800 lewat karya, dokumen, dan debat tentang keaslian."
  hi: "लगभग 1600–1800 के यूरोप में संगीत और समाज: रचनाएँ, दस्तावेज़ और प्रामाणिकता पर बहस।"
outcomes:
  - en: "Trace how Baroque and Classical styles grew"
    zh: "梳理巴洛克与古典风格的发展"
    zh-TW: "梳理巴洛克與古典風格的發展"
    ja: "バロックと古典派様式の発展をたどる"
    ko: "바로크·고전 양식의 발전 추적하기"
    vi: "Theo dõi sự phát triển phong cách Baroque"
    ms: "Jejak perkembangan gaya Barok dan Klasik"
    id: "Menelusuri perkembangan gaya Barok-Klasik"
    hi: "बारोक और क्लासिकल शैलियों का विकास समझना"
  - en: "Discuss music, politics and gender"
    zh: "讨论音乐与政治、性别的关系"
    zh-TW: "討論音樂與政治、性別的關係"
    ja: "音楽と政治・ジェンダーを論じる"
    ko: "음악과 정치·젠더 논의하기"
    vi: "Bàn về âm nhạc, chính trị và giới"
    ms: "Bincang muzik, politik dan gender"
    id: "Membahas musik, politik dan gender"
    hi: "संगीत, राजनीति और जेंडर पर चर्चा"
  - en: "Research a work in an essay"
    zh: "通过论文研究一部作品"
    zh-TW: "透過論文研究一部作品"
    ja: "作品を調べて論文にまとめる"
    ko: "한 작품을 에세이로 연구하기"
    vi: "Nghiên cứu một tác phẩm qua bài luận"
    ms: "Kaji satu karya dalam esei"
    id: "Meneliti satu karya dalam esai"
    hi: "एक रचना पर शोध निबंध लिखना"
