code: FLTV10017
year: 2026
learn:
  en: "History and context of animation, with essay and research skills, and short animations that present research."
  zh: "动画的历史与背景，训练论文与研究能力，并用短动画呈现研究。"
  zh-TW: "動畫的歷史與背景，訓練論文與研究能力，並用短動畫呈現研究。"
  ja: "アニメーションの歴史と文脈。論文と調査の力を鍛え、研究を短いアニメで表す。"
  ko: "애니메이션의 역사와 맥락, 에세이·연구 능력, 연구를 담은 짧은 애니메이션."
  vi: "Lịch sử và bối cảnh hoạt hình, kỹ năng viết luận, nghiên cứu, và hoạt hình ngắn trình bày nghiên cứu."
  ms: "Sejarah dan konteks animasi, kemahiran esei dan kajian, serta animasi pendek tentang kajian."
  id: "Sejarah dan konteks animasi, keterampilan esai dan riset, serta animasi pendek tentang riset."
  hi: "एनिमेशन का इतिहास और संदर्भ, निबंध व शोध कौशल, और शोध दिखाती छोटी एनिमेशन।"
outcomes:
  - en: "Write an essay on animation history"
    zh: "撰写动画史论文"
    zh-TW: "撰寫動畫史論文"
    ja: "アニメーション史の論文を書く"
    ko: "애니메이션사 에세이 쓰기"
    vi: "Viết tiểu luận về lịch sử hoạt hình"
    ms: "Tulis esei sejarah animasi"
    id: "Menulis esai sejarah animasi"
    hi: "एनिमेशन इतिहास पर निबंध लिखना"
  - en: "Curate a program for an animation festival"
    zh: "为动画节策划放映单元"
    zh-TW: "為動畫節策劃放映單元"
    ja: "アニメ映画祭のプログラムを組む"
    ko: "애니메이션 영화제 프로그램 기획하기"
    vi: "Tuyển chọn chương trình cho liên hoan hoạt hình"
    ms: "Susun program festival animasi"
    id: "Mengkurasi program festival animasi"
    hi: "एनिमेशन फ़ेस्टिवल का कार्यक्रम क्यूरेट करना"
  - en: "Present research through a short animation"
    zh: "用短动画呈现研究"
    zh-TW: "用短動畫呈現研究"
    ja: "研究を短いアニメで示す"
    ko: "짧은 애니메이션으로 연구 보여주기"
    vi: "Trình bày nghiên cứu bằng hoạt hình ngắn"
    ms: "Persembahkan kajian melalui animasi pendek"
    id: "Menyajikan riset lewat animasi pendek"
    hi: "छोटी एनिमेशन से शोध प्रस्तुत करना"
