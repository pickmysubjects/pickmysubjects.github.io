code: ABPL90359
year: 2027
learn:
  en: "Carry out your own construction research project with a supervisor, from research design to written results."
  zh: "在导师指导下完成自己的建筑研究课题，从研究设计到成果撰写。"
  zh-TW: "在導師指導下完成自己的建築研究課題，從研究設計到成果撰寫。"
  ja: "指導教員のもと、研究設計から論文執筆まで自分の建設研究を進める。"
  ko: "지도교수와 함께 연구 설계부터 결과 작성까지 자신의 건설 연구를 수행합니다."
  vi: "Thực hiện đề tài nghiên cứu xây dựng của bạn với giảng viên hướng dẫn, từ thiết kế đến viết kết quả."
  ms: "Jalankan projek kajian pembinaan sendiri bersama penyelia, dari reka bentuk kajian hingga penulisan."
  id: "Jalankan proyek riset konstruksi sendiri dengan pembimbing, dari desain riset hingga penulisan hasil."
  hi: "सुपरवाइज़र के साथ अपना निर्माण शोध प्रोजेक्ट, शोध डिज़ाइन से लिखित परिणाम तक।"
outcomes:
  - en: "Apply a research method to your question"
    zh: "用研究方法回答你的研究问题"
    zh-TW: "用研究方法回答你的研究問題"
    ja: "研究方法を使って問いに答える"
    ko: "연구 방법으로 질문에 답하기"
    vi: "Áp dụng phương pháp để trả lời câu hỏi nghiên cứu"
    ms: "Menggunakan kaedah kajian untuk soalan anda"
    id: "Menerapkan metode riset pada pertanyaan Anda"
    hi: "अपने प्रश्न पर शोध पद्धति लागू करना"
  - en: "Present research in writing and talks"
    zh: "以书面和口头形式呈现研究"
    zh-TW: "以書面和口頭形式呈現研究"
    ja: "研究を文章と発表で伝える"
    ko: "연구를 글과 발표로 전달하기"
    vi: "Trình bày nghiên cứu bằng bài viết và thuyết trình"
    ms: "Membentangkan kajian secara bertulis dan lisan"
    id: "Menyajikan riset secara tertulis dan lisan"
    hi: "शोध को लेखन और प्रस्तुति से रखना"
