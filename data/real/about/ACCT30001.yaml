code: ACCT30001
year: 2026
learn:
  en: "Using financial reports to judge how well a firm performs, what it is worth, and how its managers are doing."
  zh: "用财务报表判断公司表现、估算公司价值并评价管理层。"
  zh-TW: "用財務報表判斷公司表現、估算公司價值並評估經營團隊。"
  ja: "財務報告を使って企業の業績・価値・経営者を評価する。"
  ko: "재무보고서로 기업의 성과와 가치, 경영진을 평가하는 방법."
  vi: "Dùng báo cáo tài chính để đánh giá hiệu quả, giá trị của công ty và năng lực của ban quản lý."
  ms: "Guna laporan kewangan untuk menilai prestasi firma, nilainya dan prestasi pengurusnya."
  id: "Memakai laporan keuangan untuk menilai kinerja perusahaan, nilainya, dan kinerja manajernya."
  hi: "फ़ाइनेंशियल रिपोर्ट से कंपनी का प्रदर्शन, उसकी कीमत और मैनेजरों का काम परखना।"
outcomes:
  - en: "Spot bias and errors in reported accounting numbers"
    zh: "发现财报数字中的偏差和误差"
    zh-TW: "找出財報數字中的偏差與誤差"
    ja: "会計数値の偏りや誤差を見抜く"
    ko: "보고된 회계 수치의 편향과 오류 찾기"
    vi: "Phát hiện thiên lệch và sai sót trong số liệu kế toán"
    ms: "Kesan bias dan ralat dalam angka perakaunan yang dilaporkan"
    id: "Menemukan bias dan kesalahan dalam angka akuntansi yang dilaporkan"
    hi: "रिपोर्ट किए गए अकाउंटिंग आँकड़ों में पक्षपात और गलतियाँ पकड़ना"
  - en: "Analyse what drives a firm's performance"
    zh: "分析公司业绩背后的驱动因素"
    zh-TW: "分析公司績效背後的驅動因素"
    ja: "企業業績を動かす要因を分析する"
    ko: "기업 성과를 이끄는 요인 분석"
    vi: "Phân tích yếu tố thúc đẩy hiệu quả của công ty"
    ms: "Analisis faktor yang memacu prestasi firma"
    id: "Menganalisis pendorong kinerja perusahaan"
    hi: "कंपनी के प्रदर्शन के पीछे के कारणों का विश्लेषण"
  - en: "Value a firm using its financial reports"
    zh: "用财务报表给公司估值"
    zh-TW: "用財務報表替公司估值"
    ja: "財務報告を使って企業価値を評価する"
    ko: "재무보고서로 기업 가치 평가"
    vi: "Định giá công ty từ báo cáo tài chính"
    ms: "Nilai firma menggunakan laporan kewangannya"
    id: "Menilai perusahaan dari laporan keuangannya"
    hi: "फ़ाइनेंशियल रिपोर्ट से कंपनी का मूल्यांकन करना"
