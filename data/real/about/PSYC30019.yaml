code: PSYC30019
year: 2026
learn:
  en: "How children's thinking and brain function develop, and how to tell typical from atypical development."
  zh: "儿童思维和大脑怎么发展，怎么区分正常和异常发展。"
  zh-TW: "兒童思維和大腦功能怎麼發展，怎麼區分典型和非典型發展。"
  ja: "子どもの思考と脳機能がどう発達するか、定型発達と非定型発達をどう見分けるか。"
  ko: "아동의 사고와 뇌 기능 발달, 그리고 전형적·비전형적 발달을 구별하는 법."
  vi: "Tư duy và chức năng não của trẻ phát triển ra sao, và cách phân biệt phát triển điển hình với không điển hình."
  ms: "Cara pemikiran dan fungsi otak kanak-kanak berkembang, dan cara membezakan perkembangan tipikal dan atipikal."
  id: "Cara pikiran dan fungsi otak anak berkembang, serta cara membedakan perkembangan tipikal dan atipikal."
  hi: "बच्चों की सोच और दिमागी कार्य कैसे विकसित होते हैं, और सामान्य व असामान्य विकास में फ़र्क कैसे करें।"
outcomes:
  - en: "Tell typical from atypical development patterns"
    zh: "区分正常和异常的发展模式"
    zh-TW: "區分典型和非典型的發展模式"
    ja: "定型と非定型の発達パターンを見分ける"
    ko: "전형적·비전형적 발달 패턴 구별"
    vi: "Phân biệt mô hình phát triển điển hình và không điển hình"
    ms: "Bezakan corak perkembangan tipikal dan atipikal"
    id: "Membedakan pola perkembangan tipikal dan atipikal"
    hi: "सामान्य और असामान्य विकास पैटर्न पहचानना"
  - en: "Judge methods used to study child development"
    zh: "评估研究儿童发展的方法"
    zh-TW: "評估研究兒童發展的方法"
    ja: "子どもの発達研究の手法を評価する"
    ko: "아동 발달 연구 방법 평가"
    vi: "Đánh giá phương pháp nghiên cứu sự phát triển của trẻ"
    ms: "Nilai kaedah mengkaji perkembangan kanak-kanak"
    id: "Menilai metode untuk meneliti perkembangan anak"
    hi: "बाल विकास पढ़ने के तरीकों को परखना"
  - en: "Assess interventions for children with a team"
    zh: "和组员一起评估儿童干预方法"
    zh-TW: "和組員一起評估兒童介入方法"
    ja: "チームで子ども向け支援方法を評価する"
    ko: "팀으로 아동 개입 방법 평가"
    vi: "Cùng nhóm đánh giá các can thiệp cho trẻ"
    ms: "Nilai intervensi untuk kanak-kanak bersama pasukan"
    id: "Menilai intervensi untuk anak bersama tim"
    hi: "टीम के साथ बच्चों के लिए इंटरवेंशन का आकलन"
