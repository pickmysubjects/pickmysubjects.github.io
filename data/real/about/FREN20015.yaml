code: FREN20015
year: 2026
learn:
  en: "French for students who finished French 2: more everyday speaking, reading and writing, with new grammar."
  zh: "适合学完法语 2的学生：更多日常听说读写和新语法。"
  zh-TW: "適合學完法語 2的學生：更多日常聽說讀寫和新文法。"
  ja: "フランス語2を終えた学生向け。日常の会話・読み書きを広げ、新しい文法を学ぶ。"
  ko: "프랑스어 2을(를) 마친 학생 대상. 일상 말하기·읽기·쓰기를 넓히고 새 문법을 배운다."
  vi: "tiếng Pháp cho sinh viên đã học xong tiếng Pháp 2: thêm nói, đọc, viết hằng ngày và ngữ pháp mới."
  ms: "bahasa Perancis untuk pelajar yang sudah tamat bahasa Perancis 2: lebih banyak bertutur, membaca dan menulis harian, dengan tatabahasa baharu."
  id: "bahasa Prancis untuk mahasiswa yang sudah lulus bahasa Prancis 2: lebih banyak berbicara, membaca dan menulis sehari-hari, dengan tata bahasa baru."
  hi: "फ़्रेंच 2 पूरा कर चुके छात्रों के लिए फ़्रेंच: रोज़मर्रा का बोलना, पढ़ना, लिखना और नया व्याकरण।"
outcomes:
  - en: "Talk about familiar topics in French with more confidence"
    zh: "更自信地用法语谈论熟悉的话题"
    zh-TW: "更自信地用法語談論熟悉的話題"
    ja: "身近な話題をフランス語でより自信を持って話す"
    ko: "익숙한 주제를 프랑스어로 더 자신 있게 말하기"
    vi: "Nói về chủ đề quen thuộc bằng tiếng Pháp tự tin hơn"
    ms: "Bercakap tentang topik biasa dalam bahasa Perancis dengan lebih yakin"
    id: "Membicarakan topik akrab dalam bahasa Prancis dengan lebih percaya diri"
    hi: "परिचित विषयों पर फ़्रेंच में ज़्यादा आत्मविश्वास से बात करना"
  - en: "Read and write short French texts"
    zh: "读写简短的法语文章"
    zh-TW: "讀寫簡短的法語文章"
    ja: "短いフランス語の文章を読み書きする"
    ko: "짧은 프랑스어 글 읽고 쓰기"
    vi: "Đọc và viết đoạn văn tiếng Pháp ngắn"
    ms: "Baca dan tulis teks pendek bahasa Perancis"
    id: "Membaca dan menulis teks pendek bahasa Prancis"
    hi: "छोटे फ़्रेंच पाठ पढ़ना-लिखना"
  - en: "Use new grammar and vocabulary correctly"
    zh: "正确运用新语法和词汇"
    zh-TW: "正確運用新文法和詞彙"
    ja: "新しい文法と語彙を正しく使う"
    ko: "새 문법과 어휘를 정확히 쓰기"
    vi: "Dùng đúng ngữ pháp và từ vựng mới"
    ms: "Guna tatabahasa dan kosa kata baharu dengan betul"
    id: "Memakai tata bahasa dan kosakata baru dengan benar"
    hi: "नया व्याकरण और शब्दावली सही इस्तेमाल करना"
