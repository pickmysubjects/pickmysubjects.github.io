code: MAST20032
year: 2026
learn:
  en: "Calculus with several variables and vectors, covered with more proof and some extra topics."
  zh: "多元和向量微积分，比普通版更重证明，还多讲一些内容。"
  zh-TW: "多變數和向量微積分，比普通版更重證明，還多講一些內容。"
  ja: "多変数とベクトルの微積分。証明を重視し、追加のトピックもある。"
  ko: "다변수와 벡터 미적분. 증명을 더 다루고 추가 주제도 있음."
  vi: "Giải tích nhiều biến và vectơ, chú trọng chứng minh hơn và có thêm vài chủ đề."
  ms: "Kalkulus berbilang pemboleh ubah dan vektor, dengan lebih banyak bukti dan topik tambahan."
  id: "Kalkulus multivariabel dan vektor, dengan lebih banyak bukti dan beberapa topik tambahan."
  hi: "कई चरों और वेक्टर का कैलकुलस, ज़्यादा प्रमाण और कुछ अतिरिक्त विषयों के साथ।"
outcomes:
  - en: "Calculate line, surface and volume integrals"
    zh: "算线积分、面积分和体积分"
    zh-TW: "算線積分、面積分和體積分"
    ja: "線積分・面積分・体積積分を計算する"
    ko: "선적분, 면적분, 부피 적분 계산하기"
    vi: "Tính tích phân đường, mặt và khối"
    ms: "Mengira kamiran garis, permukaan dan isi padu"
    id: "Menghitung integral garis, permukaan, dan volume"
    hi: "रेखा, सतह और आयतन इंटीग्रल निकालना"
  - en: "Find constrained maximums and minimums"
    zh: "求带约束条件的极值"
    zh-TW: "求帶約束條件的極值"
    ja: "制約付きの最大・最小を求める"
    ko: "제약 조건이 있는 최댓값·최솟값 구하기"
    vi: "Tìm cực trị có ràng buộc"
    ms: "Mencari maksimum dan minimum berkekangan"
    id: "Mencari maksimum dan minimum berkendala"
    hi: "बाधाओं के साथ अधिकतम और न्यूनतम निकालना"
  - en: "Prove and apply calculus theorems rigorously"
    zh: "严谨地证明和应用微积分定理"
    zh-TW: "嚴謹地證明和應用微積分定理"
    ja: "微積分の定理を厳密に証明し応用する"
    ko: "미적분 정리를 엄밀히 증명하고 적용하기"
    vi: "Chứng minh và áp dụng chặt chẽ các định lý giải tích"
    ms: "Membuktikan dan menggunakan teorem kalkulus dengan rapi"
    id: "Membuktikan dan menerapkan teorema kalkulus secara ketat"
    hi: "कैलकुलस प्रमेयों को सख्ती से सिद्ध करना और लागू करना"
