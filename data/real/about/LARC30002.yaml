code: LARC30002
year: 2026
learn:
  en: "The history of landscape design in Australia and the ideas behind it, with site visits to heritage landscapes."
  zh: "澳大利亚景观设计的历史及其背后的思想，并实地考察遗产景观。"
  zh-TW: "澳洲景觀設計的歷史與背後的思想，並實地考察文化遺產景觀。"
  ja: "オーストラリアのランドスケープデザインの歴史と思想。遺産景観の現地調査も行う。"
  ko: "호주 조경 디자인의 역사와 그 배경 사상. 유산 경관 현장 답사 포함."
  vi: "Lịch sử thiết kế cảnh quan ở Úc và tư tưởng phía sau, có khảo sát thực địa các cảnh quan di sản."
  ms: "Sejarah reka bentuk landskap di Australia dan idea di sebaliknya, dengan lawatan ke landskap warisan."
  id: "Sejarah desain lanskap di Australia dan gagasan di baliknya, dengan kunjungan ke lanskap warisan."
  hi: "ऑस्ट्रेलिया में लैंडस्केप डिज़ाइन का इतिहास और उसके विचार, विरासत स्थलों की फ़ील्ड यात्राओं के साथ।"
outcomes:
  - en: "Trace how Australian landscape design developed"
    zh: "梳理澳大利亚景观设计的发展脉络"
    zh-TW: "梳理澳洲景觀設計的發展脈絡"
    ja: "豪州のランドスケープデザインの発展をたどる"
    ko: "호주 조경 디자인의 발전 과정 추적하기"
    vi: "Lần theo sự phát triển thiết kế cảnh quan Úc"
    ms: "Jejak perkembangan reka bentuk landskap Australia"
    id: "Menelusuri perkembangan desain lanskap Australia"
    hi: "ऑस्ट्रेलियाई लैंडस्केप डिज़ाइन का विकास समझना"
  - en: "Link designs to social and international influences"
    zh: "把设计与社会和国际影响联系起来"
    zh-TW: "把設計與社會和國際影響連結起來"
    ja: "設計を社会や海外の影響と結びつける"
    ko: "설계를 사회적·국제적 영향과 연결하기"
    vi: "Gắn thiết kế với ảnh hưởng xã hội và quốc tế"
    ms: "Kaitkan reka bentuk dengan pengaruh sosial dan antarabangsa"
    id: "Mengaitkan desain dengan pengaruh sosial dan global"
    hi: "डिज़ाइन को सामाजिक और अंतरराष्ट्रीय प्रभावों से जोड़ना"
  - en: "Assess a heritage landscape on a site visit"
    zh: "通过实地考察评估遗产景观"
    zh-TW: "透過實地考察評估遺產景觀"
    ja: "現地調査で遺産景観を評価する"
    ko: "현장 답사로 유산 경관 평가하기"
    vi: "Đánh giá cảnh quan di sản qua thực địa"
    ms: "Nilai landskap warisan semasa lawatan tapak"
    id: "Menilai lanskap warisan lewat kunjungan lapangan"
    hi: "फ़ील्ड यात्रा में विरासत लैंडस्केप का आकलन"
