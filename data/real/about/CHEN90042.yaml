code: CHEN90042
year: 2027
learn:
  en: "Designing separation processes: evaporators, distillation, absorption, extraction, membranes and cooling towers."
  zh: "设计分离过程：蒸发器、精馏、吸收、萃取、膜分离和冷却塔。"
  zh-TW: "設計分離過程：蒸發器、蒸餾、吸收、萃取、膜分離和冷卻塔。"
  ja: "分離プロセスの設計：蒸発缶、蒸留、吸収、抽出、膜分離、冷却塔。"
  ko: "분리 공정 설계: 증발기, 증류, 흡수, 추출, 막 분리, 냉각탑."
  vi: "Thiết kế quá trình tách: thiết bị bay hơi, chưng cất, hấp thụ, chiết, màng và tháp giải nhiệt."
  ms: "Mereka bentuk proses pemisahan: penyejat, penyulingan, penyerapan, pengekstrakan, membran dan menara penyejuk."
  id: "Merancang proses pemisahan: evaporator, distilasi, absorpsi, ekstraksi, membran, dan menara pendingin."
  hi: "पृथक्करण प्रक्रियाओं का डिज़ाइन: वाष्पित्र, आसवन, अवशोषण, निष्कर्षण, मेम्ब्रेन और कूलिंग टावर।"
outcomes:
  - en: "Solve advanced heat and mass transfer problems"
    zh: "求解高级传热与传质问题"
    zh-TW: "求解高級傳熱與傳質問題"
    ja: "高度な熱・物質移動の問題を解く"
    ko: "고급 열·물질 전달 문제 풀기"
    vi: "Giải bài toán truyền nhiệt và truyền khối nâng cao"
    ms: "Menyelesaikan masalah pemindahan haba dan jisim lanjutan"
    id: "Menyelesaikan soal perpindahan panas dan massa lanjut"
    hi: "उन्नत ऊष्मा और द्रव्यमान स्थानांतरण समस्याएँ हल करना"
  - en: "Design separation equipment, using simulation software"
    zh: "借助模拟软件设计分离设备"
    zh-TW: "藉助模擬軟體設計分離設備"
    ja: "シミュレーションソフトで分離装置を設計する"
    ko: "시뮬레이션 소프트웨어로 분리 장비 설계하기"
    vi: "Thiết kế thiết bị tách bằng phần mềm mô phỏng"
    ms: "Mereka bentuk peralatan pemisahan dengan perisian simulasi"
    id: "Merancang alat pemisahan dengan perangkat lunak simulasi"
    hi: "सिमुलेशन सॉफ़्टवेयर से पृथक्करण उपकरण डिज़ाइन करना"
