code: ISLM10003
year: 2026
learn:
  en: "An introduction to Islam: its beliefs, sacred texts, law, branches and the variety of Muslim practice worldwide."
  zh: "伊斯兰入门：信仰、经典、教法、教派，以及全球穆斯林实践的多样性。"
  zh-TW: "伊斯蘭入門：信仰、經典、教法、教派，以及全球穆斯林實踐的多樣性。"
  ja: "イスラム入門。信仰、聖典、法、宗派、世界のムスリムの多様な実践を学ぶ。"
  ko: "이슬람 입문: 신앙, 경전, 율법, 종파, 전 세계 무슬림 실천의 다양성을 배운다."
  vi: "Nhập môn Hồi giáo: niềm tin, kinh sách, luật, các nhánh và sự đa dạng thực hành của người Hồi giáo."
  ms: "Pengenalan Islam: kepercayaan, kitab suci, syariah, mazhab dan kepelbagaian amalan umat Islam di dunia."
  id: "Pengantar Islam: keyakinan, kitab suci, syariat, aliran, dan keragaman praktik Muslim di seluruh dunia."
  hi: "इस्लाम का परिचय: इसकी आस्थाएँ, पवित्र ग्रंथ, शरीअत, शाखाएँ और दुनिया भर में मुस्लिम प्रथाओं की विविधता।"
outcomes:
  - en: "Describe the core beliefs and texts of Islam"
    zh: "描述伊斯兰的核心信仰与经典"
    zh-TW: "描述伊斯蘭的核心信仰與經典"
    ja: "イスラムの基本的な信仰と聖典を説明する"
    ko: "이슬람의 핵심 신앙과 경전 설명하기"
    vi: "Mô tả niềm tin cốt lõi và kinh sách Hồi giáo"
    ms: "Huraikan kepercayaan teras dan kitab Islam"
    id: "Mendeskripsikan keyakinan inti dan kitab Islam"
    hi: "इस्लाम की मूल आस्थाओं और ग्रंथों का वर्णन करना"
  - en: "Explain differences between major branches"
    zh: "解释主要教派之间的差异"
    zh-TW: "解釋主要教派之間的差異"
    ja: "主な宗派の違いを説明する"
    ko: "주요 종파 간 차이 설명하기"
    vi: "Giải thích khác biệt giữa các nhánh chính"
    ms: "Terangkan perbezaan antara mazhab utama"
    id: "Menjelaskan perbedaan antaraliran utama"
    hi: "प्रमुख शाखाओं के अंतर समझाना"
  - en: "Discuss Islam's role in culture and politics"
    zh: "讨论伊斯兰在文化和政治中的作用"
    zh-TW: "討論伊斯蘭在文化和政治中的作用"
    ja: "文化と政治におけるイスラムの役割を論じる"
    ko: "문화와 정치에서 이슬람의 역할 논의하기"
    vi: "Thảo luận vai trò của Hồi giáo trong văn hóa và chính trị"
    ms: "Bincangkan peranan Islam dalam budaya dan politik"
    id: "Membahas peran Islam dalam budaya dan politik"
    hi: "संस्कृति और राजनीति में इस्लाम की भूमिका पर चर्चा करना"
