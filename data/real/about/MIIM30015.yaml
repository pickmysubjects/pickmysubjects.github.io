code: MIIM30015
year: 2026
learn:
  en: "Lab-based capstone: immunology lab methods and a research project you present in talks and reports."
  zh: "实验型毕业课：学免疫学实验方法，做研究项目并口头和书面汇报。"
  zh-TW: "實驗型總結課：學免疫學實驗方法，做研究專題並口頭和書面報告。"
  ja: "実験中心の総まとめ科目：免疫学の実験手法と、発表・レポートで報告する研究課題。"
  ko: "실험 중심 캡스톤: 면역학 실험 방법과 발표·보고서로 제출하는 연구 프로젝트."
  vi: "Môn capstone thực hành: phương pháp thí nghiệm miễn dịch và dự án nghiên cứu trình bày bằng thuyết trình, báo cáo."
  ms: "Capstone berasaskan makmal: kaedah makmal imunologi dan projek penyelidikan yang dibentang dan dilapor."
  id: "Capstone berbasis lab: metode lab imunologi dan proyek riset yang dipresentasikan dan dilaporkan."
  hi: "लैब-आधारित कैपस्टोन: इम्यूनोलॉजी लैब तरीके और एक रिसर्च प्रोजेक्ट, जिसे प्रेज़ेंटेशन व रिपोर्ट में पेश करते हैं।"
outcomes:
  - en: "Run flow cytometry and other immune cell assays"
    zh: "做流式细胞术等免疫细胞检测"
    zh-TW: "做流式細胞術等免疫細胞檢測"
    ja: "フローサイトメトリーなど免疫細胞の測定を行う"
    ko: "유세포 분석 등 면역세포 검사 수행하기"
    vi: "Thực hiện đo tế bào dòng chảy và xét nghiệm tế bào miễn dịch khác"
    ms: "Menjalankan sitometri aliran dan asai sel imun lain"
    id: "Menjalankan flow cytometry dan uji sel imun lainnya"
    hi: "फ़्लो साइटोमेट्री और दूसरे इम्यून सेल परीक्षण करना"
  - en: "Design an experiment with proper controls"
    zh: "设计带对照组的实验"
    zh-TW: "設計有對照組的實驗"
    ja: "適切な対照を置いた実験を設計する"
    ko: "적절한 대조군을 둔 실험 설계하기"
    vi: "Thiết kế thí nghiệm có đối chứng phù hợp"
    ms: "Mereka bentuk eksperimen dengan kawalan yang betul"
    id: "Merancang eksperimen dengan kontrol yang tepat"
    hi: "सही कंट्रोल के साथ प्रयोग डिज़ाइन करना"
  - en: "Keep lab records and present your findings"
    zh: "做好实验记录并汇报结果"
    zh-TW: "做好實驗記錄並報告結果"
    ja: "実験記録をつけ、結果を発表する"
    ko: "실험 기록을 남기고 결과 발표하기"
    vi: "Ghi chép thí nghiệm và trình bày kết quả"
    ms: "Menyimpan rekod makmal dan membentangkan dapatan"
    id: "Mencatat hasil lab dan mempresentasikan temuan"
    hi: "लैब रिकॉर्ड रखना और नतीजे पेश करना"
