code: LING30007
year: 2026
learn:
  en: "The study of meaning in language, from prototype and cognitive approaches to formal semantics."
  zh: "研究语言中的意义，从原型、认知方法到形式语义学。"
  zh-TW: "研究語言中的意義，從原型、認知取向到形式語意學。"
  ja: "言語の意味の研究。プロトタイプ意味論や認知言語学から形式意味論まで。"
  ko: "언어의 의미를 연구한다. 원형 의미론과 인지 언어학부터 형식 의미론까지 다룬다."
  vi: "Nghiên cứu nghĩa trong ngôn ngữ, từ cách tiếp cận nguyên mẫu, tri nhận đến ngữ nghĩa học hình thức."
  ms: "Kajian makna dalam bahasa, daripada pendekatan prototaip dan kognitif hingga semantik formal."
  id: "Kajian makna dalam bahasa, dari pendekatan prototipe dan kognitif hingga semantik formal."
  hi: "भाषा में अर्थ का अध्ययन, प्रोटोटाइप और संज्ञानात्मक तरीकों से औपचारिक अर्थविज्ञान तक।"
outcomes:
  - en: "Explain the main approaches to studying meaning"
    zh: "说明研究意义的主要方法"
    zh-TW: "說明研究意義的主要取向"
    ja: "意味を研究する主なアプローチを説明する"
    ko: "의미 연구의 주요 접근 설명하기"
    vi: "Giải thích các cách tiếp cận chính để nghiên cứu nghĩa"
    ms: "Terangkan pendekatan utama mengkaji makna"
    id: "Menjelaskan pendekatan utama mengkaji makna"
    hi: "अर्थ के अध्ययन के मुख्य तरीकों को समझाना"
  - en: "Apply semantic analysis to language data"
    zh: "对语言数据进行语义分析"
    zh-TW: "對語言資料進行語意分析"
    ja: "言語データに意味分析を当てはめる"
    ko: "언어 자료에 의미 분석 적용하기"
    vi: "Áp dụng phân tích ngữ nghĩa cho dữ liệu ngôn ngữ"
    ms: "Aplikasikan analisis semantik pada data bahasa"
    id: "Menerapkan analisis semantik pada data bahasa"
    hi: "भाषा डेटा पर अर्थ विश्लेषण लागू करना"
  - en: "Evaluate theories of meaning"
    zh: "评价关于意义的理论"
    zh-TW: "評價關於意義的理論"
    ja: "意味の理論を評価する"
    ko: "의미 이론 평가하기"
    vi: "Đánh giá các lý thuyết về nghĩa"
    ms: "Nilai teori tentang makna"
    id: "Menilai teori tentang makna"
    hi: "अर्थ के सिद्धांतों को परखना"
