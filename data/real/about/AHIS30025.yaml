code: AHIS30025
year: 2026
learn:
  en: "Photography in greater China from the 1800s to now, as art, everyday practice and a tool of propaganda and surveillance."
  zh: "从19世纪至今的大中华地区摄影，作为艺术、日常实践以及宣传和监控的工具。"
  zh-TW: "從19世紀至今的大中華地區攝影，作為藝術、日常實踐以及宣傳和監控的工具。"
  ja: "19世紀から現在までの中華圏の写真を、芸術、日常の営み、宣伝と監視の道具として学ぶ。"
  ko: "19세기부터 지금까지 중화권 사진을 예술, 일상 실천, 선전과 감시의 도구로 본다."
  vi: "Nhiếp ảnh ở Đại Trung Hoa từ thế kỷ 19 đến nay, như nghệ thuật, thực hành đời thường và công cụ tuyên truyền, giám sát."
  ms: "Fotografi di China raya dari 1800-an hingga kini, sebagai seni, amalan harian serta alat propaganda dan pengawasan."
  id: "Fotografi di Tiongkok raya dari 1800-an hingga kini, sebagai seni, praktik sehari-hari serta alat propaganda dan pengawasan."
  hi: "1800 के दशक से अब तक बृहत्तर चीन में फ़ोटोग्राफ़ी, कला, रोज़मर्रा की प्रथा और प्रचार व निगरानी के औज़ार के रूप में।"
outcomes:
  - en: "Trace the history of photography in China"
    zh: "梳理中国摄影的历史"
    zh-TW: "梳理中國攝影的歷史"
    ja: "中国の写真の歴史をたどる"
    ko: "중국 사진의 역사 짚어 보기"
    vi: "Lần theo lịch sử nhiếp ảnh ở Trung Quốc"
    ms: "Jejaki sejarah fotografi di China"
    id: "Menelusuri sejarah fotografi di Tiongkok"
    hi: "चीन में फ़ोटोग्राफ़ी के इतिहास को खोजना"
  - en: "Analyse photos as art and as political tools"
    zh: "把照片作为艺术和政治工具来分析"
    zh-TW: "把照片作為藝術和政治工具來分析"
    ja: "写真を芸術と政治の道具の両面から分析する"
    ko: "사진을 예술이자 정치적 도구로 분석하기"
    vi: "Phân tích ảnh như nghệ thuật và công cụ chính trị"
    ms: "Analisis foto sebagai seni dan alat politik"
    id: "Menganalisis foto sebagai seni dan alat politik"
    hi: "तस्वीरों का कला और राजनीतिक औज़ार दोनों रूपों में विश्लेषण करना"
  - en: "Use theories of looking to read images"
    zh: "运用观看理论解读图像"
    zh-TW: "運用觀看理論解讀圖像"
    ja: "見ることの理論で画像を読む"
    ko: "보기의 이론으로 이미지 읽기"
    vi: "Dùng lý thuyết về cái nhìn để đọc hình ảnh"
    ms: "Guna teori melihat untuk membaca imej"
    id: "Memakai teori melihat untuk membaca gambar"
    hi: "देखने के सिद्धांतों से छवियां पढ़ना"
