code: CHIN20021
year: 2026
learn:
  en: "How Chinese society today is divided and studied, by class, region, gender and ethnicity."
  zh: "当代中国社会如何按阶层、地区、性别和民族划分和研究。"
  zh-TW: "當代中國社會如何按階層、地區、性別和民族劃分和研究。"
  ja: "現代中国社会が階層・地域・性別・民族でどう分かれ、どう研究されるか。"
  ko: "현대 중국 사회가 계층·지역·성별·민족으로 어떻게 나뉘고 연구되는지."
  vi: "Xã hội Trung Quốc ngày nay được phân chia và nghiên cứu ra sao theo giai cấp, vùng, giới và dân tộc."
  ms: "Cara masyarakat China hari ini dibahagi dan dikaji mengikut kelas, wilayah, gender dan etnik."
  id: "Cara masyarakat Tiongkok masa kini dibagi dan dikaji menurut kelas, wilayah, gender dan etnis."
  hi: "आज का चीनी समाज वर्ग, क्षेत्र, लिंग और जातीयता के आधार पर कैसे बँटा और पढ़ा जाता है।"
outcomes:
  - en: "Describe the main social divisions in China"
    zh: "描述中国主要的社会分层"
    zh-TW: "描述中國主要的社會分層"
    ja: "中国の主な社会的区分を説明する"
    ko: "중국의 주요 사회적 구분 설명하기"
    vi: "Mô tả các phân tầng xã hội chính ở Trung Quốc"
    ms: "Huraikan pembahagian sosial utama di China"
    id: "Menjelaskan pembagian sosial utama di Tiongkok"
    hi: "चीन के मुख्य सामाजिक बँटवारे बताना"
  - en: "Compare ways of analysing Chinese society"
    zh: "比较分析中国社会的不同方法"
    zh-TW: "比較分析中國社會的不同方法"
    ja: "中国社会の分析方法を比べる"
    ko: "중국 사회 분석 방법 비교하기"
    vi: "So sánh các cách phân tích xã hội Trung Quốc"
    ms: "Bandingkan cara menganalisis masyarakat China"
    id: "Membandingkan cara menganalisis masyarakat Tiongkok"
    hi: "चीनी समाज के विश्लेषण के तरीक़ों की तुलना करना"
  - en: "Write a research report on a social issue"
    zh: "就一个社会问题写研究报告"
    zh-TW: "就一個社會問題寫研究報告"
    ja: "社会問題について研究レポートを書く"
    ko: "사회 문제에 관한 연구 보고서 쓰기"
    vi: "Viết báo cáo nghiên cứu về một vấn đề xã hội"
    ms: "Tulis laporan kajian tentang isu sosial"
    id: "Menulis laporan penelitian tentang isu sosial"
    hi: "किसी सामाजिक मुद्दे पर शोध रिपोर्ट लिखना"
