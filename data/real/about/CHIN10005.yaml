code: CHIN10005
year: 2026
learn:
  en: "Chinese for complete beginners: basic speaking, listening, reading and writing for everyday situations."
  zh: "零基础中文：日常场景下的基本听说读写。"
  zh-TW: "零基礎中文：日常場景下的基本聽說讀寫。"
  ja: "まったくの初心者向けの中国語。日常場面での基本的な聞く・話す・読む・書く。"
  ko: "완전 초보자를 위한 중국어. 일상 상황에서의 기본 듣기·말하기·읽기·쓰기."
  vi: "tiếng Trung cho người mới hoàn toàn: nghe, nói, đọc, viết cơ bản trong tình huống hằng ngày."
  ms: "bahasa Cina untuk pemula sepenuhnya: asas bertutur, mendengar, membaca dan menulis untuk situasi harian."
  id: "bahasa Mandarin untuk pemula total: dasar berbicara, mendengar, membaca dan menulis untuk situasi sehari-hari."
  hi: "बिल्कुल शुरुआती छात्रों के लिए चीनी: रोज़मर्रा की स्थितियों में बोलना, सुनना, पढ़ना और लिखना।"
outcomes:
  - en: "Hold simple everyday conversations in Chinese"
    zh: "用中文进行简单的日常对话"
    zh-TW: "用中文進行簡單的日常對話"
    ja: "中国語で簡単な日常会話をする"
    ko: "중국어로 간단한 일상 대화하기"
    vi: "Trò chuyện đơn giản hằng ngày bằng tiếng Trung"
    ms: "Berbual ringkas harian dalam bahasa Cina"
    id: "Bercakap sederhana sehari-hari dalam bahasa Mandarin"
    hi: "चीनी में सरल रोज़मर्रा की बातचीत करना"
  - en: "Read and write basic Chinese words and sentences"
    zh: "读写基础中文词句"
    zh-TW: "讀寫基礎中文詞句"
    ja: "中国語の基本的な語や文を読み書きする"
    ko: "기초 중국어 단어와 문장 읽고 쓰기"
    vi: "Đọc và viết từ, câu tiếng Trung cơ bản"
    ms: "Baca dan tulis perkataan serta ayat asas bahasa Cina"
    id: "Membaca dan menulis kata serta kalimat dasar bahasa Mandarin"
    hi: "चीनी के बुनियादी शब्द और वाक्य पढ़ना-लिखना"
  - en: "Understand everyday customs where Chinese is spoken"
    zh: "了解使用中文地区的日常习俗"
    zh-TW: "了解使用中文地區的日常習俗"
    ja: "中国語が話される地域の日常の習慣を知る"
    ko: "중국어 사용 지역의 일상 관습 이해하기"
    vi: "Hiểu phong tục hằng ngày nơi nói tiếng Trung"
    ms: "Fahami adat harian di tempat bahasa Cina dituturkan"
    id: "Memahami kebiasaan sehari-hari di tempat bahasa Mandarin dipakai"
    hi: "चीनी बोलने वाली जगहों के रोज़मर्रा के रीति-रिवाज समझना"
