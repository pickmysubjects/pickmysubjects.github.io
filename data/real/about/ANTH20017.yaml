code: ANTH20017
year: 2026
learn:
  en: "The history of anthropological theory over 150 years, its main schools, and what they still offer today's debates."
  zh: "150年来人类学理论的历史、主要流派，以及它们对当今争论的意义。"
  zh-TW: "150年來人類學理論的歷史、主要流派，以及它們對當今爭論的意義。"
  ja: "150年にわたる人類学理論の歴史と主な学派、そして今の議論への意味を学ぶ。"
  ko: "150년간의 인류학 이론사와 주요 학파, 그리고 오늘날 논쟁에 주는 의미를 배운다."
  vi: "Lịch sử lý thuyết nhân học suốt 150 năm, các trường phái chính và giá trị của chúng với tranh luận ngày nay."
  ms: "Sejarah teori antropologi selama 150 tahun, aliran utamanya dan nilainya untuk perdebatan hari ini."
  id: "Sejarah teori antropologi selama 150 tahun, aliran utamanya, dan relevansinya bagi perdebatan masa kini."
  hi: "150 वर्षों में मानवशास्त्रीय सिद्धांत का इतिहास, इसके मुख्य स्कूल और आज की बहसों में उनका महत्व।"
outcomes:
  - en: "Trace the main schools of anthropological thought"
    zh: "梳理人类学思想的主要流派"
    zh-TW: "梳理人類學思想的主要流派"
    ja: "人類学思想の主な学派をたどる"
    ko: "인류학 사상의 주요 학파 따라가기"
    vi: "Lần theo các trường phái tư tưởng nhân học chính"
    ms: "Jejaki aliran utama pemikiran antropologi"
    id: "Menelusuri aliran utama pemikiran antropologi"
    hi: "मानवशास्त्रीय चिंतन के मुख्य स्कूलों का क्रम समझना"
  - en: "Read key texts in their historical context"
    zh: "在历史背景中阅读重要文本"
    zh-TW: "在歷史背景中閱讀重要文本"
    ja: "重要な文献を歴史的文脈の中で読む"
    ko: "주요 문헌을 역사적 맥락 속에서 읽기"
    vi: "Đọc các văn bản quan trọng trong bối cảnh lịch sử"
    ms: "Baca teks penting dalam konteks sejarahnya"
    id: "Membaca teks penting dalam konteks sejarahnya"
    hi: "मुख्य ग्रंथों को उनके ऐतिहासिक संदर्भ में पढ़ना"
  - en: "Apply theory to current political debates"
    zh: "把理论用于当下的政治争论"
    zh-TW: "把理論用於當下的政治爭論"
    ja: "理論を今の政治的議論に当てはめる"
    ko: "이론을 현재 정치 논쟁에 적용하기"
    vi: "Áp dụng lý thuyết vào các tranh luận chính trị hiện nay"
    ms: "Gunakan teori pada perdebatan politik semasa"
    id: "Menerapkan teori pada perdebatan politik terkini"
    hi: "सिद्धांत को आज की राजनीतिक बहसों पर लागू करना"
