code: COMP90069
year: 2027
learn:
  en: "Continuing an independent computer science research project over three study periods."
  zh: "在三个学期里继续完成一项独立的计算机科学研究项目。"
  zh-TW: "在三個學期裡繼續完成一項獨立的計算機科學研究專題。"
  ja: "3学期にわたって独立したコンピュータサイエンスの研究プロジェクトを進める。"
  ko: "세 학기에 걸쳐 독립적인 컴퓨터 과학 연구 프로젝트를 이어 간다."
  vi: "Tiếp tục một dự án nghiên cứu khoa học máy tính độc lập qua ba kỳ học."
  ms: "Meneruskan projek penyelidikan sains komputer secara bebas selama tiga tempoh pengajian."
  id: "Melanjutkan proyek riset ilmu komputer mandiri selama tiga periode studi."
  hi: "तीन अध्ययन अवधियों में एक स्वतंत्र कंप्यूटर विज्ञान शोध परियोजना जारी रखना।"
outcomes:
  - en: "Plan, run and report a computational experiment"
    zh: "规划、开展并报告计算实验"
    zh-TW: "規劃、進行並報告計算實驗"
    ja: "計算実験を計画・実施・報告する"
    ko: "계산 실험을 계획하고 수행하고 보고하기"
    vi: "Lập kế hoạch, thực hiện và báo cáo thí nghiệm tính toán"
    ms: "Merancang, menjalankan dan melaporkan eksperimen pengiraan"
    id: "Merencanakan, menjalankan, dan melaporkan eksperimen komputasi"
    hi: "कम्प्यूटेशनल प्रयोग की योजना, संचालन और रिपोर्टिंग"
  - en: "Carry out a research survey on your own"
    zh: "独立完成研究文献综述"
    zh-TW: "獨立完成研究文獻回顧"
    ja: "研究サーベイを自分で行う"
    ko: "연구 조사를 스스로 수행하기"
    vi: "Tự thực hiện khảo sát nghiên cứu"
    ms: "Menjalankan tinjauan penyelidikan sendiri"
    id: "Melakukan survei riset secara mandiri"
    hi: "स्वयं शोध सर्वेक्षण करना"
  - en: "Communicate computer science research"
    zh: "交流和展示计算机科学研究"
    zh-TW: "交流和展示計算機科學研究"
    ja: "コンピュータサイエンスの研究を伝える"
    ko: "컴퓨터 과학 연구 결과 전달하기"
    vi: "Trình bày nghiên cứu khoa học máy tính"
    ms: "Menyampaikan penyelidikan sains komputer"
    id: "Mengomunikasikan riset ilmu komputer"
    hi: "कंप्यूटर विज्ञान शोध को प्रस्तुत करना"
