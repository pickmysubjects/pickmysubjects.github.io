code: FLTV10024
year: 2026
learn:
  en: "Shoot and edit a 3-minute documentary on your own phone, learning how short unscripted films capture the real world."
  zh: "用自己的手机拍摄并剪辑一部3分钟纪录片，学习无剧本短片如何记录真实世界"
  zh-TW: "用自己的手機拍攝並剪輯一部3分鐘紀錄片，學習無劇本短片如何記錄真實世界"
  ja: "自分のスマホで3分のドキュメンタリーを撮影・編集し、台本なしの短編で現実を捉える方法を学ぶ。"
  ko: "내 휴대폰으로 3분 다큐를 촬영·편집하며 대본 없는 단편이 현실을 담는 법을 배움."
  vi: "Quay và dựng phim tài liệu 3 phút bằng điện thoại, học cách phim ngắn không kịch bản ghi lại thực tế."
  ms: "Rakam dan sunting dokumentari 3 minit dengan telefon sendiri, belajar cara filem pendek merakam dunia nyata."
  id: "Rekam dan sunting dokumenter 3 menit dengan ponsel sendiri, pelajari cara film pendek menangkap dunia nyata."
  hi: "अपने फ़ोन से 3 मिनट की डॉक्यूमेंट्री शूट और एडिट करना, बिना स्क्रिप्ट की छोटी फ़िल्मों से असल दुनिया दिखाना।"
outcomes:
  - en: "Plan and film a micro documentary on a mobile device"
    zh: "用手机策划并拍摄微纪录片"
    zh-TW: "用手機策劃並拍攝微紀錄片"
    ja: "スマホでマイクロドキュメンタリーを企画・撮影する"
    ko: "휴대 기기로 마이크로 다큐 기획·촬영하기"
    vi: "Lên kế hoạch và quay phim tài liệu ngắn bằng điện thoại"
    ms: "Merancang dan merakam dokumentari mikro dengan telefon"
    id: "Merencanakan dan merekam dokumenter mikro dengan ponsel"
    hi: "मोबाइल से माइक्रो डॉक्यूमेंट्री की योजना बनाकर शूट करना"
  - en: "Use documentary modes and basic production safety"
    zh: "运用纪录片的各种模式和基本拍摄安全"
    zh-TW: "運用紀錄片的各種模式和基本拍攝安全"
    ja: "ドキュメンタリーの様式と基本の撮影安全を使う"
    ko: "다큐 양식과 기본 촬영 안전 수칙 활용하기"
    vi: "Dùng các phong cách phim tài liệu và an toàn sản xuất"
    ms: "Menggunakan mod dokumentari dan keselamatan produksi"
    id: "Menerapkan mode dokumenter dan keselamatan produksi"
    hi: "डॉक्यूमेंट्री शैलियाँ और बुनियादी प्रोडक्शन सुरक्षा अपनाना"
  - en: "Reflect on your own creative voice as a filmmaker"
    zh: "反思自己作为创作者的风格"
    zh-TW: "反思自己作為創作者的風格"
    ja: "作り手としての自分の表現を振り返る"
    ko: "영상 제작자로서 자신의 창작 목소리 돌아보기"
    vi: "Suy ngẫm về giọng sáng tạo riêng khi làm phim"
    ms: "Menilai suara kreatif sendiri sebagai pembikin filem"
    id: "Merefleksikan suara kreatif sendiri sebagai pembuat film"
    hi: "फ़िल्ममेकर के रूप में अपनी रचनात्मक आवाज़ पर विचार करना"
