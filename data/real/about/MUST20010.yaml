code: MUST20010
year: 2027
learn:
  en: "Sing well-known pop songs in a group while learning the history and social power of pop music from the 1950s on."
  zh: "在小组里唱经典流行歌曲，同时了解 1950 年代以来流行音乐的历史和社会影响力。"
  zh-TW: "在小組裡唱經典流行歌曲，同時了解 1950 年代以來流行音樂的歷史和社會影響力。"
  ja: "有名なポップスをグループで歌いながら、1950年代以降のポップ音楽の歴史と社会的な力を学ぶ。"
  ko: "유명 팝송을 그룹으로 부르며 1950년대 이후 팝 음악의 역사와 사회적 힘을 배움."
  vi: "Hát các bài pop nổi tiếng theo nhóm, đồng thời tìm hiểu lịch sử và sức ảnh hưởng xã hội của nhạc pop từ thập niên 1950."
  ms: "Nyanyi lagu pop terkenal secara berkumpulan sambil belajar sejarah dan pengaruh sosial muzik pop sejak 1950-an."
  id: "Bernyanyi lagu pop terkenal bersama kelompok sambil mempelajari sejarah dan kekuatan sosial musik pop sejak 1950-an."
  hi: "समूह में मशहूर पॉप गीत गाना और 1950 के दशक से पॉप संगीत का इतिहास व सामाजिक असर सीखना।"
outcomes:
  - en: "Sing safely with good voice habits"
    zh: "用正确的发声习惯安全地唱歌"
    zh-TW: "用正確的發聲習慣安全地唱歌"
    ja: "正しい発声習慣で安全に歌う"
    ko: "좋은 발성 습관으로 안전하게 노래하기"
    vi: "Hát an toàn với thói quen dùng giọng đúng"
    ms: "Menyanyi dengan selamat dan tabiat suara yang baik"
    id: "Bernyanyi dengan aman dan kebiasaan vokal yang baik"
    hi: "अच्छी आवाज़ की आदतों से सुरक्षित गाना"
  - en: "Sing together with others in a group"
    zh: "与他人一起合唱"
    zh-TW: "與他人一起合唱"
    ja: "グループで他の人と一緒に歌う"
    ko: "그룹에서 다른 사람과 함께 노래하기"
    vi: "Hát cùng người khác trong nhóm"
    ms: "Menyanyi bersama orang lain dalam kumpulan"
    id: "Bernyanyi bersama orang lain dalam kelompok"
    hi: "समूह में दूसरों के साथ गाना"
  - en: "Analyse a pop song in its social and political context"
    zh: "从社会和政治背景分析一首流行歌"
    zh-TW: "從社會和政治背景分析一首流行歌"
    ja: "ポップ曲を社会的・政治的文脈で分析する"
    ko: "팝송을 사회·정치적 맥락에서 분석하기"
    vi: "Phân tích một bài pop trong bối cảnh xã hội và chính trị"
    ms: "Analisis lagu pop dalam konteks sosial dan politik"
    id: "Menganalisis lagu pop dalam konteks sosial dan politik"
    hi: "पॉप गीत का सामाजिक-राजनीतिक संदर्भ में विश्लेषण"
