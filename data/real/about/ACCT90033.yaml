code: ACCT90033
year: 2027
learn:
  en: "Capstone tying together financial and management accounting, auditing, tax and finance through case studies and news."
  zh: "综合课：通过案例和时事，把财务会计、管理会计、审计、税务和金融串起来。"
  zh-TW: "綜合課：透過案例和時事，把財務會計、管理會計、審計、稅務和金融串起來。"
  ja: "事例やニュースを通じて、財務会計・管理会計・監査・税務・金融をつなぐ総まとめ科目。"
  ko: "사례와 시사 뉴스로 재무회계, 관리회계, 감사, 세무, 재무를 통합하는 캡스톤 과목."
  vi: "Môn tổng hợp kết nối kế toán tài chính, quản trị, kiểm toán, thuế và tài chính qua tình huống và tin tức."
  ms: "Subjek akhir yang menggabungkan perakaunan kewangan, pengurusan, audit, cukai dan kewangan melalui kes dan berita."
  id: "Mata kuliah capstone yang memadukan akuntansi keuangan, manajemen, audit, pajak, dan keuangan lewat kasus dan berita."
  hi: "केस स्टडी और खबरों से वित्तीय व प्रबंधन लेखांकन, ऑडिट, कर और वित्त को जोड़ने वाला कैपस्टोन विषय।"
outcomes:
  - en: "Use professional judgement to reach well-reasoned decisions"
    zh: "运用专业判断做出有理有据的决定"
    zh-TW: "運用專業判斷做出有理有據的決定"
    ja: "専門的判断で筋の通った結論を出す"
    ko: "전문적 판단으로 근거 있는 결정 내리기"
    vi: "Dùng phán đoán chuyên môn để ra quyết định hợp lý"
    ms: "Guna pertimbangan profesional untuk membuat keputusan wajar"
    id: "Memakai penilaian profesional untuk keputusan yang beralasan"
    hi: "पेशेवर विवेक से सोच-समझकर निर्णय लेना"
  - en: "Critically assess financial and non-financial information"
    zh: "批判地评估财务与非财务信息"
    zh-TW: "批判地評估財務與非財務資訊"
    ja: "財務・非財務情報を批判的に評価する"
    ko: "재무·비재무 정보를 비판적으로 평가하기"
    vi: "Đánh giá có phản biện thông tin tài chính và phi tài chính"
    ms: "Menilai maklumat kewangan dan bukan kewangan secara kritis"
    id: "Menilai informasi keuangan dan nonkeuangan secara kritis"
    hi: "वित्तीय और गैर-वित्तीय जानकारी का आलोचनात्मक आकलन"
