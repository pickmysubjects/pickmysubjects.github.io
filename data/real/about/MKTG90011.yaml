code: MKTG90011
year: 2027
learn:
  en: "Planning marketing research, collecting and analysing qualitative and quantitative data, on a real client project."
  zh: "规划市场调研，收集并分析定性和定量数据，完成一个真实客户项目。"
  zh-TW: "規劃市場調查，蒐集並分析質化與量化資料，完成一個真實客戶專案。"
  ja: "市場調査を計画し、定性・定量データを集めて分析する。実際のクライアント案件で行う。"
  ko: "시장조사를 계획하고 정성·정량 데이터를 수집·분석한다. 실제 고객 프로젝트로 진행."
  vi: "Lập kế hoạch nghiên cứu thị trường, thu thập, phân tích dữ liệu định tính và định lượng trong dự án khách hàng thật."
  ms: "Merancang penyelidikan pemasaran, mengumpul dan menganalisis data kualitatif dan kuantitatif dalam projek pelanggan sebenar."
  id: "Merencanakan riset pemasaran, mengumpulkan dan menganalisis data kualitatif dan kuantitatif dalam proyek klien nyata."
  hi: "मार्केटिंग रिसर्च की योजना बनाना, गुणात्मक और मात्रात्मक डेटा जुटाना व विश्लेषण करना, एक असली क्लाइंट प्रोजेक्ट पर।"
outcomes:
  - en: "Analyse research data with key methods"
    zh: "用主要方法分析调研数据"
    zh-TW: "以主要方法分析調查資料"
    ja: "主要な手法で調査データを分析する"
    ko: "주요 기법으로 조사 데이터 분석하기"
    vi: "Phân tích dữ liệu nghiên cứu bằng phương pháp chính"
    ms: "Menganalisis data kajian dengan kaedah utama"
    id: "Menganalisis data riset dengan metode utama"
    hi: "मुख्य तरीकों से रिसर्च डेटा का विश्लेषण करना"
  - en: "Run a research project for a real client"
    zh: "为真实客户完成调研项目"
    zh-TW: "為真實客戶完成調查專案"
    ja: "実際の顧客向けに調査を行う"
    ko: "실제 고객을 위한 조사 수행하기"
    vi: "Thực hiện dự án nghiên cứu cho khách hàng thật"
    ms: "Menjalankan projek kajian untuk pelanggan sebenar"
    id: "Menjalankan proyek riset untuk klien nyata"
    hi: "असली क्लाइंट के लिए रिसर्च प्रोजेक्ट करना"
