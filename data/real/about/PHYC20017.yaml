code: PHYC20017
year: 2026
learn:
  en: "How ancient monuments, rock art and stone arrangements line up with the Sun, Moon and stars, and what that says about past cultures."
  zh: "古代遗迹、岩画和石阵如何对齐日月星辰，以及这揭示了怎样的古代文化。"
  zh-TW: "古代遺跡、岩畫和石陣如何對齊日月星辰，以及這揭示了怎樣的古代文化。"
  ja: "古代の建造物や岩絵、石の配置が天体とどう対応し、過去の文化について何を語るかを学ぶ。"
  ko: "고대 유적·암각화·돌 배열이 해·달·별과 어떻게 맞춰졌고 옛 문화에 대해 무엇을 말하는지."
  vi: "Di tích cổ, tranh đá và bãi đá xếp thẳng hàng với thiên thể ra sao và nói gì về văn hóa xưa."
  ms: "Cara monumen purba, lukisan batu dan susunan batu sejajar dengan langit, dan maksudnya tentang budaya lampau."
  id: "Cara monumen kuno, lukisan batu, dan susunan batu sejajar dengan langit, dan artinya bagi budaya masa lalu."
  hi: "प्राचीन स्मारक, शैल चित्र और पत्थर की संरचनाएँ आकाश से कैसे जुड़ती हैं और पुरानी संस्कृतियों के बारे में क्या बताती हैं।"
outcomes:
  - en: "Explain how sites align with the sky"
    zh: "解释遗址如何与天象对齐"
    zh-TW: "解釋遺址如何與天象對齊"
    ja: "遺跡が天体とどう並ぶか説明する"
    ko: "유적이 하늘과 어떻게 정렬되는지 설명하기"
    vi: "Giải thích cách di tích thẳng hàng với bầu trời"
    ms: "Terangkan cara tapak sejajar dengan langit"
    id: "Menjelaskan cara situs sejajar dengan langit"
    hi: "स्थल आकाश के साथ कैसे संरेखित होते हैं, समझाना"
  - en: "Weigh evidence for astronomical claims"
    zh: "评估天文说法背后的证据"
    zh-TW: "評估天文說法背後的證據"
    ja: "天文学的な主張の根拠を吟味する"
    ko: "천문학적 주장의 근거 따져보기"
    vi: "Cân nhắc bằng chứng cho các nhận định thiên văn"
    ms: "Nilai bukti bagi dakwaan astronomi"
    id: "Menimbang bukti untuk klaim astronomi"
    hi: "खगोलीय दावों के सबूत परखना"
  - en: "Write critically about cultural astronomy"
    zh: "就文化天文学进行批判性写作"
    zh-TW: "就文化天文學進行批判性寫作"
    ja: "文化天文学について批判的に書く"
    ko: "문화 천문학에 대해 비판적으로 글쓰기"
    vi: "Viết có phản biện về thiên văn văn hóa"
    ms: "Menulis secara kritis tentang astronomi budaya"
    id: "Menulis kritis tentang astronomi budaya"
    hi: "सांस्कृतिक खगोल विज्ञान पर आलोचनात्मक लेखन"
