code: GDES10001
year: 2026
learn:
  en: "First graphic design studio: type, image making and combining the two through hands-on projects."
  zh: "第一门平面设计工作室：通过实践项目学习字体、图像创作及二者结合。"
  zh-TW: "第一門平面設計工作室：透過實作專案學習字體、圖像創作及兩者結合。"
  ja: "最初のグラフィックデザインスタジオ：書体と画像制作、その組み合わせを実制作で学ぶ。"
  ko: "첫 그래픽 디자인 스튜디오: 실습 프로젝트로 서체, 이미지 제작, 둘의 결합을 배운다."
  vi: "Studio thiết kế đồ họa đầu tiên: chữ, tạo hình ảnh và kết hợp cả hai qua các dự án thực hành."
  ms: "Studio reka grafik pertama: tipografi, penghasilan imej dan gabungan keduanya melalui projek amali."
  id: "Studio desain grafis pertama: huruf, pembuatan gambar, dan memadukan keduanya lewat proyek praktik."
  hi: "पहला ग्राफ़िक डिज़ाइन स्टूडियो: टाइप, इमेज बनाना और दोनों को प्रोजेक्ट में जोड़ना।"
outcomes:
  - en: "Combine type and image in a layout"
    zh: "在版面中结合文字与图像"
    zh-TW: "在版面中結合文字與圖像"
    ja: "レイアウトで文字と画像を組み合わせる"
    ko: "레이아웃에서 글자와 이미지 결합하기"
    vi: "Kết hợp chữ và hình trong bố cục"
    ms: "Gabung tipografi dan imej dalam susun atur"
    id: "Memadukan huruf dan gambar dalam tata letak"
    hi: "लेआउट में टाइप और इमेज को जोड़ना"
  - en: "Try out several design options for a brief"
    zh: "针对设计任务尝试多种方案"
    zh-TW: "針對設計任務嘗試多種方案"
    ja: "課題に対し複数の案を試す"
    ko: "과제에 맞춰 여러 디자인안 시도하기"
    vi: "Thử nhiều phương án cho một đề bài"
    ms: "Cuba beberapa pilihan reka bentuk untuk satu taklimat"
    id: "Mencoba beberapa opsi desain untuk satu brief"
    hi: "एक ब्रीफ़ के लिए कई डिज़ाइन विकल्प आज़माना"
  - en: "Build and present a design portfolio"
    zh: "制作并展示设计作品集"
    zh-TW: "製作並展示設計作品集"
    ja: "デザインのポートフォリオを作り発表する"
    ko: "디자인 포트폴리오 제작·발표하기"
    vi: "Làm và trình bày portfolio thiết kế"
    ms: "Bina dan bentang portfolio reka bentuk"
    id: "Menyusun dan menyajikan portofolio desain"
    hi: "डिज़ाइन पोर्टफ़ोलियो बनाना और पेश करना"
