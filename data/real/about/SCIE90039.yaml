code: SCIE90039
year: 2027
learn:
  en: "An 80–100 hour science placement in research, government or industry. You must secure an approved placement first."
  zh: "在研究机构、政府或企业完成80至100小时的科学实习，须先获得批准的实习岗位。"
  zh-TW: "在研究機構、政府或企業完成80至100小時的科學實習，須先取得核准的實習職位。"
  ja: "研究機関・政府・企業で80〜100時間の科学インターンシップ。事前に承認された受け入れ先が必要。"
  ko: "연구기관·정부·산업체에서 80~100시간 과학 인턴십. 승인된 실습처를 먼저 확보해야 한다."
  vi: "Thực tập khoa học 80–100 giờ ở viện nghiên cứu, chính phủ hoặc doanh nghiệp. Phải có nơi thực tập được duyệt trước."
  ms: "Penempatan sains 80–100 jam dalam penyelidikan, kerajaan atau industri. Perlu dapatkan penempatan diluluskan dahulu."
  id: "Magang sains 80–100 jam di lembaga riset, pemerintah, atau industri. Harus mendapat tempat magang yang disetujui dulu."
  hi: "शोध, सरकार या उद्योग में 80–100 घंटे का विज्ञान प्लेसमेंट। पहले स्वीकृत प्लेसमेंट पाना ज़रूरी।"
outcomes:
  - en: "Apply your studies in a professional setting"
    zh: "在职业环境中运用所学"
    zh-TW: "在職場環境中運用所學"
    ja: "専門の現場で学んだことを活かす"
    ko: "전문 현장에서 배운 것 적용하기"
    vi: "Áp dụng kiến thức trong môi trường chuyên nghiệp"
    ms: "Mengaplikasi pengajian dalam suasana profesional"
    id: "Menerapkan ilmu di lingkungan profesional"
    hi: "पेशेवर माहौल में अपनी पढ़ाई लागू करना"
  - en: "Assess the skills a future career needs"
    zh: "评估未来职业所需的技能"
    zh-TW: "評估未來職涯所需的技能"
    ja: "将来の職業に必要なスキルを見極める"
    ko: "미래 진로에 필요한 역량 평가하기"
    vi: "Đánh giá kỹ năng mà nghề nghiệp tương lai cần"
    ms: "Menilai kemahiran yang diperlukan kerjaya masa depan"
    id: "Menilai keterampilan yang dibutuhkan karier masa depan"
    hi: "भविष्य के करियर के लिए ज़रूरी कौशल आँकना"
