code: LING20005
year: 2026
learn:
  en: "The sounds of the world's languages: how they are made, heard and transcribed, and how to read sound spectrograms."
  zh: "世界语言的语音：如何发音、感知和转写，以及如何读声谱图。"
  zh-TW: "世界語言的語音：如何發音、感知和轉寫，以及如何讀聲譜圖。"
  ja: "世界の言語の音がどう作られ、聞こえ、表記されるのか、そしてスペクトログラムの読み方を学ぶ。"
  ko: "세계 언어의 소리가 어떻게 만들어지고 들리고 전사되는지, 소리 스펙트로그램 읽는 법을 배운다."
  vi: "Âm thanh của các ngôn ngữ trên thế giới: cách phát âm, nghe và phiên âm, cùng cách đọc phổ đồ âm thanh."
  ms: "Bunyi bahasa dunia: cara ia dihasilkan, didengar dan ditranskripsi, serta cara membaca spektrogram bunyi."
  id: "Bunyi bahasa-bahasa dunia: cara dihasilkan, didengar, dan ditranskripsi, serta cara membaca spektrogram."
  hi: "दुनिया की भाषाओं की ध्वनियाँ: वे कैसे बनती, सुनी और लिखी जाती हैं, और ध्वनि स्पेक्ट्रोग्राम कैसे पढ़ें।"
outcomes:
  - en: "Identify speech sounds of the world's languages"
    zh: "辨识世界各语言的语音"
    zh-TW: "辨識世界各語言的語音"
    ja: "世界の言語の音を聞き分ける"
    ko: "세계 언어의 말소리 식별하기"
    vi: "Nhận biết các âm lời nói của các ngôn ngữ thế giới"
    ms: "Kenal pasti bunyi pertuturan bahasa dunia"
    id: "Mengenali bunyi ujaran bahasa-bahasa dunia"
    hi: "दुनिया की भाषाओं की वाक् ध्वनियाँ पहचानना"
  - en: "Transcribe speech with phonetic symbols"
    zh: "用音标转写语音"
    zh-TW: "用音標轉寫語音"
    ja: "音声記号で発話を書き取る"
    ko: "음성 기호로 말소리 전사하기"
    vi: "Phiên âm lời nói bằng ký hiệu ngữ âm"
    ms: "Transkripsi pertuturan dengan simbol fonetik"
    id: "Mentranskripsi ujaran dengan simbol fonetik"
    hi: "ध्वन्यात्मक चिह्नों से बोली को लिखना"
  - en: "Read basic sound spectrograms"
    zh: "读懂基础的声谱图"
    zh-TW: "讀懂基礎的聲譜圖"
    ja: "基本的なスペクトログラムを読む"
    ko: "기본적인 소리 스펙트로그램 읽기"
    vi: "Đọc phổ đồ âm thanh cơ bản"
    ms: "Baca spektrogram bunyi asas"
    id: "Membaca spektrogram bunyi dasar"
    hi: "बुनियादी ध्वनि स्पेक्ट्रोग्राम पढ़ना"
