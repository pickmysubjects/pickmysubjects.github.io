code: CHEN90027
year: 2027
learn:
  en: "Fossil fuels from formation to refining, their costs and carbon emissions, and alternative fuels."
  zh: "化石燃料从形成到炼制，其成本与碳排放，以及替代燃料。"
  zh-TW: "化石燃料從形成到煉製，其成本與碳排放，以及替代燃料。"
  ja: "化石燃料の生成から精製まで、コストと炭素排出、代替燃料。"
  ko: "화석연료의 생성부터 정제까지, 비용과 탄소 배출, 대체 연료."
  vi: "Nhiên liệu hóa thạch từ hình thành đến lọc dầu, chi phí, phát thải carbon và nhiên liệu thay thế."
  ms: "Bahan api fosil dari pembentukan hingga penapisan, kos dan pelepasan karbon, serta bahan api alternatif."
  id: "Bahan bakar fosil dari pembentukan hingga kilang, biaya dan emisi karbon, serta bahan bakar alternatif."
  hi: "जीवाश्म ईंधन का बनना से रिफ़ाइनिंग तक, लागत, कार्बन उत्सर्जन और वैकल्पिक ईंधन।"
outcomes:
  - en: "Design an early process for oil extraction and refining"
    zh: "设计石油开采和炼制的初步流程"
    zh-TW: "設計石油開採與煉製的初步流程"
    ja: "石油の採掘と精製の初期プロセスを設計する"
    ko: "석유 채굴과 정제의 초기 공정 설계하기"
    vi: "Thiết kế quy trình sơ bộ khai thác và lọc dầu"
    ms: "Mereka proses awal pengekstrakan dan penapisan petroleum"
    id: "Merancang proses awal ekstraksi dan pengilangan minyak"
    hi: "तेल निकालने और रिफ़ाइनिंग की शुरुआती प्रक्रिया डिज़ाइन करना"
  - en: "Compare petroleum and alternative fuel options"
    zh: "比较石油与替代燃料的方案"
    zh-TW: "比較石油與替代燃料的方案"
    ja: "石油と代替燃料の選択肢を比べる"
    ko: "석유와 대체 연료 선택지 비교하기"
    vi: "So sánh dầu mỏ và các phương án nhiên liệu thay thế"
    ms: "Membandingkan pilihan petroleum dan bahan api alternatif"
    id: "Membandingkan opsi minyak bumi dan bahan bakar alternatif"
    hi: "पेट्रोलियम और वैकल्पिक ईंधन विकल्पों की तुलना"
