code: MUSI20198
year: 2026
learn:
  en: "Western music from Beethoven to the early 1900s: lectures, tutorial writing, quizzes and a research project."
  zh: "从贝多芬到二十世纪初的西方音乐：讲座、辅导课写作、小测和研究项目。"
  zh-TW: "從貝多芬到二十世紀初的西方音樂：講座、導修寫作、小測與研究專題。"
  ja: "ベートーヴェンから20世紀初頭までの西洋音楽。講義、課題、小テスト、研究。"
  ko: "베토벤부터 20세기 초까지 서양음악: 강의, 튜토리얼 글쓰기, 퀴즈, 연구 과제."
  vi: "Âm nhạc phương Tây từ Beethoven đến đầu thế kỷ 20: bài giảng, viết, trắc nghiệm, dự án."
  ms: "Muzik Barat dari Beethoven hingga awal 1900-an: kuliah, penulisan, kuiz dan projek kajian."
  id: "Musik Barat dari Beethoven hingga awal 1900-an: kuliah, tulisan, kuis, dan proyek riset."
  hi: "बीथोवन से 1900 के शुरू तक पश्चिमी संगीत: लेक्चर, लेखन, क्विज़ और शोध परियोजना।"
outcomes:
  - en: "Explain key 19th-century music styles"
    zh: "解释19世纪主要音乐风格"
    zh-TW: "解釋19世紀主要音樂風格"
    ja: "19世紀の主な様式を説明する"
    ko: "19세기 주요 음악 양식 설명하기"
    vi: "Giải thích phong cách nhạc thế kỷ 19"
    ms: "Terangkan gaya muzik abad ke-19"
    id: "Menjelaskan gaya musik abad ke-19"
    hi: "19वीं सदी की मुख्य संगीत शैलियाँ समझाना"
  - en: "Link music to its social context"
    zh: "把音乐与社会背景联系起来"
    zh-TW: "把音樂與社會背景連結"
    ja: "音楽を社会背景と結びつける"
    ko: "음악을 사회적 맥락과 연결하기"
    vi: "Gắn âm nhạc với bối cảnh xã hội"
    ms: "Kaitkan muzik dengan konteks sosial"
    id: "Mengaitkan musik dengan konteks sosial"
    hi: "संगीत को सामाजिक संदर्भ से जोड़ना"
  - en: "Write a researched music essay"
    zh: "撰写有研究支撑的音乐论文"
    zh-TW: "撰寫有研究支撐的音樂論文"
    ja: "調べた上で音楽論文を書く"
    ko: "연구 기반 음악 에세이 쓰기"
    vi: "Viết bài luận âm nhạc có nghiên cứu"
    ms: "Tulis esei muzik berasaskan kajian"
    id: "Menulis esai musik berbasis riset"
    hi: "शोध आधारित संगीत निबंध लिखना"
