code: ABPL90038
year: 2027
learn:
  en: "Group case studies abroad over four intensive weeks on property, construction and infrastructure projects; you pay your own travel."
  zh: "在海外四周密集小组案例研究，涉及房地产、建造和基础设施项目；差旅自费。"
  zh-TW: "在海外四週密集小組個案研究，涉及不動產、營建與基礎設施專案；旅費自付。"
  ja: "海外で4週間の集中グループ事例研究。不動産・建設・インフラ。渡航費は自己負担。"
  ko: "해외에서 4주 집중 그룹 사례 연구. 부동산·건설·인프라. 여행 경비 본인 부담."
  vi: "Nghiên cứu tình huống nhóm ở nước ngoài 4 tuần về bất động sản, xây dựng, hạ tầng; tự trả chi phí."
  ms: "Kajian kes berkumpulan di luar negara selama empat minggu; kos perjalanan sendiri."
  id: "Studi kasus kelompok di luar negeri selama empat minggu; biaya perjalanan sendiri."
  hi: "विदेश में चार हफ़्ते के समूह केस अध्ययन: संपत्ति, निर्माण, ढाँचा; यात्रा ख़र्च स्वयं।"
outcomes:
  - en: "Analyse property projects in other countries"
    zh: "分析其他国家的房地产项目"
    zh-TW: "分析其他國家的不動產專案"
    ja: "海外の不動産プロジェクトを分析する"
    ko: "해외 부동산 프로젝트 분석하기"
    vi: "Phân tích dự án bất động sản ở nước khác"
    ms: "Menganalisis projek hartanah di negara lain"
    id: "Menganalisis proyek properti di negara lain"
    hi: "दूसरे देशों की संपत्ति परियोजनाओं का विश्लेषण"
  - en: "Present case study findings as a group"
    zh: "以小组形式汇报案例研究成果"
    zh-TW: "以小組形式報告個案研究成果"
    ja: "グループで事例研究を発表する"
    ko: "그룹으로 사례 연구 결과 발표하기"
    vi: "Trình bày kết quả nghiên cứu theo nhóm"
    ms: "Membentang dapatan kajian kes secara berkumpulan"
    id: "Mempresentasikan temuan studi kasus berkelompok"
    hi: "समूह में केस अध्ययन के निष्कर्ष प्रस्तुत करना"
