code: FLTV20019
year: 2026
learn:
  en: "Story research, character and world building for animation, an animated documentary from real life, and a script ready for production."
  zh: "动画故事的研究、角色与世界构建，以真实素材做动画纪录片，并完成可开拍的剧本。"
  zh-TW: "動畫故事的研究、角色與世界建構，以真實素材做動畫紀錄片，並完成可開拍的劇本。"
  ja: "アニメの物語調査、人物と世界観づくり、実話のアニメドキュメンタリー、制作できる脚本。"
  ko: "애니메이션 이야기 조사, 인물·세계관 구축, 실화 애니 다큐, 제작 가능한 각본."
  vi: "Nghiên cứu truyện, xây nhân vật, thế giới cho hoạt hình, phim tài liệu hoạt hình và kịch bản sẵn sàng sản xuất."
  ms: "Kajian cerita, watak dan dunia untuk animasi, dokumentari animasi dan skrip sedia diterbitkan."
  id: "Riset cerita, tokoh dan dunia untuk animasi, dokumenter animasi dan naskah siap produksi."
  hi: "एनिमेशन के लिए कहानी शोध, किरदार व दुनिया बनाना, असली कहानी पर एनिमेटेड डॉक्यूमेंट्री और तैयार स्क्रिप्ट।"
outcomes:
  - en: "Research a story and build its world"
    zh: "研究故事并构建其世界"
    zh-TW: "研究故事並建構其世界"
    ja: "物語を調べ世界観を作る"
    ko: "이야기를 조사하고 세계 구축하기"
    vi: "Nghiên cứu câu chuyện và xây dựng thế giới"
    ms: "Kaji cerita dan bina dunianya"
    id: "Meneliti cerita dan membangun dunianya"
    hi: "कहानी पर शोध और उसकी दुनिया बनाना"
  - en: "Animate a short real-life story"
    zh: "把一个真实故事做成短动画"
    zh-TW: "把一個真實故事做成短動畫"
    ja: "実話を短いアニメにする"
    ko: "실제 이야기를 짧은 애니로 만들기"
    vi: "Làm hoạt hình ngắn từ chuyện có thật"
    ms: "Animasikan kisah benar yang pendek"
    id: "Menganimasikan kisah nyata pendek"
    hi: "असली जीवन की छोटी कहानी एनिमेट करना"
  - en: "Write a short animation screenplay"
    zh: "写一部动画短剧本"
    zh-TW: "寫一部動畫短劇本"
    ja: "短いアニメ脚本を書く"
    ko: "짧은 애니메이션 각본 쓰기"
    vi: "Viết kịch bản hoạt hình ngắn"
    ms: "Tulis lakon layar animasi pendek"
    id: "Menulis skenario animasi pendek"
    hi: "छोटी एनिमेशन पटकथा लिखना"
