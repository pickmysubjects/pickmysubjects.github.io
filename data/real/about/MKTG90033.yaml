code: MKTG90033
year: 2027
learn:
  en: "How brain science is used in marketing: key brain systems in consumer decisions and neuroscience research tools."
  zh: "脑科学如何用于营销：消费者决策中的关键脑系统和神经科学研究工具。"
  zh-TW: "腦科學如何應用於行銷：消費者決策中的關鍵腦系統與神經科學研究工具。"
  ja: "脳科学をマーケティングにどう使うか：消費者の意思決定に関わる脳の仕組みと研究手法。"
  ko: "뇌과학을 마케팅에 활용하는 법: 소비자 의사결정의 핵심 뇌 시스템과 신경과학 연구 도구."
  vi: "Khoa học não bộ được dùng trong marketing ra sao: hệ thống não then chốt trong quyết định và công cụ nghiên cứu."
  ms: "Cara sains otak digunakan dalam pemasaran: sistem otak utama dalam keputusan pengguna dan alat kajian neurosains."
  id: "Cara ilmu otak dipakai dalam pemasaran: sistem otak utama dalam keputusan konsumen dan alat riset neurosains."
  hi: "मार्केटिंग में दिमाग़ विज्ञान का उपयोग: उपभोक्ता निर्णय में मुख्य मस्तिष्क तंत्र और न्यूरोसाइंस शोध साधन।"
outcomes:
  - en: "Describe neuroscience tools in marketing"
    zh: "描述营销中的神经科学工具"
    zh-TW: "描述行銷中的神經科學工具"
    ja: "マーケティングの神経科学手法を説明する"
    ko: "마케팅의 신경과학 도구 설명하기"
    vi: "Mô tả công cụ khoa học thần kinh trong marketing"
    ms: "Menerangkan alat neurosains dalam pemasaran"
    id: "Menjelaskan alat neurosains dalam pemasaran"
    hi: "मार्केटिंग में न्यूरोसाइंस के साधन बताना"
  - en: "Apply brain research to marketing practice"
    zh: "将脑科学研究用于营销实践"
    zh-TW: "將腦科學研究應用於行銷實務"
    ja: "脳研究をマーケティング実務に活かす"
    ko: "뇌 연구를 마케팅 실무에 적용하기"
    vi: "Áp dụng nghiên cứu não vào thực tế marketing"
    ms: "Menggunakan kajian otak dalam amalan pemasaran"
    id: "Menerapkan riset otak pada praktik pemasaran"
    hi: "दिमाग़ के शोध को मार्केटिंग में लगाना"
