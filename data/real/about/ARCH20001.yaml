code: ARCH20001
year: 2026
learn:
  en: "Second architecture studio: develop a building design further, weighing space, site and structure, in drawings and models."
  zh: "第二门建筑设计工作室：进一步发展建筑设计，兼顾空间、场地与结构。"
  zh-TW: "第二門建築設計工作室：進一步發展建築設計，兼顧空間、基地與結構。"
  ja: "2つ目の建築スタジオ：空間・敷地・構造を考えながら設計を深め、図面と模型で示す。"
  ko: "두 번째 건축 스튜디오: 공간·대지·구조를 따져 설계를 발전시키고 도면·모형으로 표현."
  vi: "Studio kiến trúc thứ hai: phát triển thiết kế sâu hơn, cân nhắc không gian, khu đất, kết cấu qua bản vẽ, mô hình."
  ms: "Studio seni bina kedua: kembangkan reka bentuk bangunan, timbang ruang, tapak dan struktur, dalam lukisan dan model."
  id: "Studio arsitektur kedua: mengembangkan desain bangunan dengan menimbang ruang, tapak, dan struktur."
  hi: "दूसरा आर्किटेक्चर स्टूडियो: स्पेस, साइट और संरचना तौलकर डिज़ाइन आगे बढ़ाना, ड्रॉइंग-मॉडल में।"
outcomes:
  - en: "Refine a design through repeated iterations"
    zh: "通过反复迭代完善设计"
    zh-TW: "透過反覆迭代完善設計"
    ja: "繰り返し検討して設計を磨く"
    ko: "반복을 통해 설계 다듬기"
    vi: "Hoàn thiện thiết kế qua nhiều vòng"
    ms: "Perhalusi reka bentuk melalui ulangan"
    id: "Menyempurnakan desain lewat iterasi"
    hi: "बार-बार सुधार करके डिज़ाइन निखारना"
  - en: "Respond to site and structural needs"
    zh: "回应场地与结构需求"
    zh-TW: "回應基地與結構需求"
    ja: "敷地と構造の条件に応える"
    ko: "대지와 구조 요구에 대응하기"
    vi: "Đáp ứng yêu cầu khu đất và kết cấu"
    ms: "Balas keperluan tapak dan struktur"
    id: "Menanggapi kebutuhan tapak dan struktur"
    hi: "साइट और संरचना की ज़रूरतों का जवाब देना"
  - en: "Present a full proposal at a final review"
    zh: "在终期评图中展示完整方案"
    zh-TW: "在期末評圖中展示完整方案"
    ja: "最終講評で案全体を発表する"
    ko: "최종 크리틱에서 전체 안 발표하기"
    vi: "Trình bày đề xuất hoàn chỉnh ở buổi chấm cuối"
    ms: "Bentang cadangan penuh pada semakan akhir"
    id: "Menyajikan usulan lengkap di review akhir"
    hi: "फ़ाइनल रिव्यू में पूरा प्रस्ताव पेश करना"
