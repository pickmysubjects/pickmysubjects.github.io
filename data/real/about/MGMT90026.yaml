code: MGMT90026
year: 2027
learn:
  en: "How goods and information move between trading partners: inventory, logistics networks, partnerships and strategy."
  zh: "货物和信息如何在贸易伙伴之间流动：库存、物流网络、合作关系与战略。"
  zh-TW: "貨物與資訊如何在貿易夥伴之間流動：存貨、物流網絡、合作關係與策略。"
  ja: "取引先の間でモノと情報がどう流れるか：在庫、物流網、提携、戦略。"
  ko: "거래 파트너 간 물자와 정보의 흐름: 재고, 물류 네트워크, 협력 관계, 전략."
  vi: "Hàng hóa và thông tin di chuyển giữa các đối tác: tồn kho, mạng lưới logistics, quan hệ hợp tác, chiến lược."
  ms: "Cara barang dan maklumat bergerak antara rakan dagang: inventori, rangkaian logistik, perkongsian dan strategi."
  id: "Cara barang dan informasi bergerak antarmitra dagang: persediaan, jaringan logistik, kemitraan dan strategi."
  hi: "व्यापारिक साझेदारों के बीच माल और जानकारी कैसे चलती है: इन्वेंटरी, लॉजिस्टिक्स नेटवर्क, साझेदारी और रणनीति।"
outcomes:
  - en: "Explain inventory's role in supply chains"
    zh: "解释库存在供应链中的作用"
    zh-TW: "說明存貨在供應鏈中的作用"
    ja: "サプライチェーンでの在庫の役割を説明する"
    ko: "공급망에서 재고의 역할 설명하기"
    vi: "Giải thích vai trò tồn kho trong chuỗi cung ứng"
    ms: "Menerangkan peranan inventori dalam rantaian bekalan"
    id: "Menjelaskan peran persediaan dalam rantai pasok"
    hi: "सप्लाई चेन में इन्वेंटरी की भूमिका समझाना"
  - en: "Weigh factors in logistics network design"
    zh: "权衡物流网络设计的因素"
    zh-TW: "權衡物流網絡設計的因素"
    ja: "物流網設計の要因を検討する"
    ko: "물류 네트워크 설계 요인 따져보기"
    vi: "Cân nhắc yếu tố khi thiết kế mạng logistics"
    ms: "Menimbang faktor reka bentuk rangkaian logistik"
    id: "Menimbang faktor desain jaringan logistik"
    hi: "लॉजिस्टिक्स नेटवर्क डिज़ाइन के कारक तौलना"
