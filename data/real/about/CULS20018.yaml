code: CULS20018
year: 2026
learn:
  en: "How pop music, films, memes and selfies shape how we think, feel and relate, and what they say about politics."
  zh: "流行音乐、电影、表情包和自拍如何影响我们的思考、感受和人际关系，又反映了怎样的政治。"
  zh-TW: "流行音樂、電影、迷因和自拍如何影響我們的思考、感受和人際關係，又反映了怎樣的政治。"
  ja: "ポップ音楽、映画、ミーム、自撮りが考え方・感じ方・関係をどう形づくり、政治について何を語るかを学ぶ。"
  ko: "팝 음악, 영화, 밈, 셀카가 생각·감정·관계를 어떻게 만들고 정치에 대해 무엇을 말하는지 배운다."
  vi: "Nhạc pop, phim, meme và ảnh tự sướng định hình cách ta nghĩ, cảm và kết nối ra sao, và chúng nói gì về chính trị."
  ms: "Cara muzik pop, filem, meme dan swafoto membentuk cara kita berfikir, merasa dan berhubung, serta apa katanya tentang politik."
  id: "Cara musik pop, film, meme dan swafoto membentuk cara kita berpikir, merasa dan berelasi, serta apa katanya soal politik."
  hi: "पॉप संगीत, फ़िल्में, मीम और सेल्फ़ी हमारे सोचने, महसूस करने और जुड़ने को कैसे गढ़ते हैं, और राजनीति के बारे में क्या कहते हैं।"
outcomes:
  - en: "Define what makes culture popular"
    zh: "界定何为流行文化"
    zh-TW: "界定何為流行文化"
    ja: "何が文化を「大衆的」にするか定義する"
    ko: "무엇이 문화를 대중적으로 만드는지 정의하기"
    vi: "Xác định điều gì làm văn hóa trở nên đại chúng"
    ms: "Takrifkan apa yang menjadikan budaya popular"
    id: "Mendefinisikan apa yang membuat budaya populer"
    hi: "संस्कृति को लोकप्रिय क्या बनाता है, परिभाषित करना"
  - en: "Analyse your own media habits critically"
    zh: "批判性分析自己的媒体使用习惯"
    zh-TW: "批判性分析自己的媒體使用習慣"
    ja: "自分のメディア習慣を批判的に分析する"
    ko: "자신의 미디어 습관 비판적으로 분석하기"
    vi: "Phân tích có phê phán thói quen truyền thông của bạn"
    ms: "Analisis tabiat media anda secara kritis"
    id: "Menganalisis kebiasaan media sendiri secara kritis"
    hi: "अपनी मीडिया आदतों का आलोचनात्मक विश्लेषण करना"
  - en: "Link popular culture to political debates"
    zh: "把流行文化与政治议题联系起来"
    zh-TW: "把流行文化與政治議題聯繫起來"
    ja: "大衆文化を政治的な論争と結びつける"
    ko: "대중문화를 정치 논쟁과 연결하기"
    vi: "Liên hệ văn hóa đại chúng với các tranh luận chính trị"
    ms: "Kaitkan budaya popular dengan perdebatan politik"
    id: "Mengaitkan budaya populer dengan perdebatan politik"
    hi: "लोकप्रिय संस्कृति को राजनीतिक बहसों से जोड़ना"
