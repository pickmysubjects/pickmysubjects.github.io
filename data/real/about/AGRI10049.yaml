code: AGRI10049
year: 2026
learn:
  en: "How Australian farms raise cattle, sheep, pigs, poultry and fish for meat, milk, eggs and wool, with a field trip to the Dookie farm."
  zh: "了解澳洲如何饲养牛羊猪禽鱼来生产肉奶蛋毛，含 Dookie 农场实地考察。"
  zh-TW: "了解澳洲如何飼養牛羊豬禽魚來生產肉奶蛋毛，含 Dookie 農場實地考察。"
  ja: "オーストラリアの農場が肉・乳・卵・羊毛のために牛・羊・豚・家禽・魚を育てる仕組みを学び、Dookie農場を見学する。"
  ko: "호주 농장이 고기·우유·달걀·양모를 위해 소·양·돼지·가금·어류를 기르는 방식을 배우고 Dookie 농장을 견학한다."
  vi: "Cách trang trại Úc nuôi bò, cừu, lợn, gia cầm, cá lấy thịt, sữa, trứng, len; có chuyến thực địa tới trại Dookie."
  ms: "Cara ladang Australia menternak lembu, biri-biri, babi, ayam dan ikan untuk daging, susu, telur dan bulu; termasuk lawatan ke ladang Dookie."
  id: "Cara peternakan Australia memelihara sapi, domba, babi, unggas dan ikan untuk daging, susu, telur dan wol; ada kunjungan ke peternakan Dookie."
  hi: "ऑस्ट्रेलियाई फ़ार्म मांस, दूध, अंडे और ऊन के लिए मवेशी, भेड़, सूअर, मुर्गी और मछली कैसे पालते हैं; Dookie फ़ार्म की फ़ील्ड यात्रा सहित।"
outcomes:
  - en: "Compare intensive and extensive livestock systems"
    zh: "比较集约与粗放的养殖方式"
    zh-TW: "比較集約與粗放的養殖方式"
    ja: "集約型と粗放型の畜産を比較する"
    ko: "집약형과 조방형 축산 비교하기"
    vi: "So sánh chăn nuôi thâm canh và quảng canh"
    ms: "Banding sistem ternakan intensif dan ekstensif"
    id: "Membandingkan peternakan intensif dan ekstensif"
    hi: "सघन और विस्तृत पशुपालन प्रणालियों की तुलना"
  - en: "Explain what drives output and welfare on a farm"
    zh: "说明影响农场产量与动物福利的因素"
    zh-TW: "說明影響農場產量與動物福利的因素"
    ja: "農場の生産性と動物福祉を左右する要因を説明する"
    ko: "농장의 생산성과 동물 복지를 좌우하는 요인 설명하기"
    vi: "Giải thích yếu tố quyết định sản lượng và phúc lợi vật nuôi"
    ms: "Jelaskan faktor yang mempengaruhi hasil dan kebajikan haiwan"
    id: "Menjelaskan faktor yang memengaruhi hasil dan kesejahteraan hewan"
    hi: "फ़ार्म के उत्पादन और पशु कल्याण को प्रभावित करने वाले कारक समझाना"
  - en: "Report on a real farm from what you saw"
    zh: "根据实地所见写农场报告"
    zh-TW: "根據實地所見寫農場報告"
    ja: "実際に見た農場についてレポートを書く"
    ko: "직접 본 농장에 대해 보고서 쓰기"
    vi: "Viết báo cáo về một trang trại thực tế đã thăm"
    ms: "Tulis laporan tentang ladang sebenar yang dilawati"
    id: "Menulis laporan tentang peternakan nyata yang dikunjungi"
    hi: "देखे गए असली फ़ार्म पर रिपोर्ट लिखना"
