code: ITAL30006
year: 2026
learn:
  en: "Italian literature, film and visual texts studied in Italian, with the focus changing to suit current staff research."
  zh: "用意大利语学习意大利文学、电影和视觉文本，具体主题随教师研究方向而变。"
  zh-TW: "用義大利語學習義大利文學、電影和視覺文本，具體主題隨教師研究方向而變。"
  ja: "イタリアの文学・映画・視覚作品をイタリア語で学ぶ。内容は教員の研究に合わせて変わる。"
  ko: "이탈리아 문학·영화·시각 텍스트를 이탈리아어로 배운다. 주제는 교수진의 연구에 따라 바뀐다."
  vi: "Văn học, phim và văn bản hình ảnh Ý học bằng tiếng Ý; trọng tâm thay đổi theo nghiên cứu của giảng viên."
  ms: "Sastera, filem dan teks visual Itali dipelajari dalam bahasa Itali; fokus berubah mengikut penyelidikan pensyarah."
  id: "Sastra, film dan teks visual Italia dipelajari dalam bahasa Italia; fokusnya berganti mengikuti riset pengajar."
  hi: "इतालवी साहित्य, फ़िल्म और दृश्य पाठ इतालवी में; विषय शिक्षकों के मौजूदा शोध के हिसाब से बदलता है।"
outcomes:
  - en: "Analyse Italian literary and visual works"
    zh: "分析意大利文学和视觉作品"
    zh-TW: "分析義大利文學和視覺作品"
    ja: "イタリアの文学・視覚作品を分析する"
    ko: "이탈리아 문학·시각 작품 분석하기"
    vi: "Phân tích tác phẩm văn học và hình ảnh Ý"
    ms: "Analisis karya sastera dan visual Itali"
    id: "Menganalisis karya sastra dan visual Italia"
    hi: "इतालवी साहित्यिक और दृश्य रचनाओं का विश्लेषण करना"
  - en: "Use critical approaches to read texts"
    zh: "运用批评方法解读文本"
    zh-TW: "運用批評方法解讀文本"
    ja: "批評的な方法で作品を読む"
    ko: "비평적 방법으로 텍스트 읽기"
    vi: "Dùng phương pháp phê bình để đọc văn bản"
    ms: "Guna pendekatan kritis untuk membaca teks"
    id: "Memakai pendekatan kritis untuk membaca teks"
    hi: "आलोचनात्मक तरीकों से पाठ पढ़ना"
  - en: "Write about literature in Italian"
    zh: "用意大利语撰写文学评论"
    zh-TW: "用義大利語撰寫文學評論"
    ja: "文学についてイタリア語で書く"
    ko: "문학에 대해 이탈리아어로 쓰기"
    vi: "Viết về văn học bằng tiếng Ý"
    ms: "Menulis tentang sastera dalam bahasa Itali"
    id: "Menulis tentang sastra dalam bahasa Italia"
    hi: "साहित्य पर इतालवी में लिखना"
