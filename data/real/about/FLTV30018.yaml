code: FLTV30018
year: 2026
learn:
  en: "Animation beyond the cinema: projection design and animated work for galleries, public spaces and live performance."
  zh: "电影院之外的动画：投影设计，以及为美术馆、公共空间和现场演出做动画。"
  zh-TW: "電影院之外的動畫：投影設計，以及為美術館、公共空間和現場演出做動畫。"
  ja: "映画館の外のアニメ：プロジェクション設計、美術館・公共空間・ライブ公演のための作品。"
  ko: "극장 밖의 애니메이션: 프로젝션 디자인과 갤러리·공공장소·라이브 공연용 작품."
  vi: "Hoạt hình ngoài rạp chiếu: thiết kế trình chiếu và tác phẩm cho bảo tàng, không gian công cộng, biểu diễn."
  ms: "Animasi di luar pawagam: reka bentuk unjuran untuk galeri, ruang awam dan persembahan langsung."
  id: "Animasi di luar bioskop: desain proyeksi untuk galeri, ruang publik dan pertunjukan langsung."
  hi: "सिनेमा से आगे एनिमेशन: प्रोजेक्शन डिज़ाइन और गैलरी, सार्वजनिक जगहों व लाइव प्रस्तुति के लिए काम।"
outcomes:
  - en: "Design animated projection for an exhibition"
    zh: "为展览设计动画投影"
    zh-TW: "為展覽設計動畫投影"
    ja: "展示用のアニメ投影を設計する"
    ko: "전시용 애니메이션 프로젝션 디자인하기"
    vi: "Thiết kế trình chiếu hoạt hình cho triển lãm"
    ms: "Reka unjuran animasi untuk pameran"
    id: "Merancang proyeksi animasi untuk pameran"
    hi: "प्रदर्शनी के लिए एनिमेटेड प्रोजेक्शन डिज़ाइन"
  - en: "Work with projection technology"
    zh: "运用投影技术"
    zh-TW: "運用投影技術"
    ja: "投影技術を扱う"
    ko: "프로젝션 기술 다루기"
    vi: "Làm việc với công nghệ trình chiếu"
    ms: "Bekerja dengan teknologi unjuran"
    id: "Bekerja dengan teknologi proyeksi"
    hi: "प्रोजेक्शन तकनीक के साथ काम"
  - en: "Present new screen contexts for animation"
    zh: "介绍动画的新兴银幕场景"
    zh-TW: "介紹動畫的新興螢幕場景"
    ja: "アニメの新しい上映の場を発表する"
    ko: "애니메이션의 새로운 스크린 맥락 발표하기"
    vi: "Trình bày bối cảnh màn hình mới cho hoạt hình"
    ms: "Bentang konteks skrin baharu untuk animasi"
    id: "Mempresentasikan konteks layar baru animasi"
    hi: "एनिमेशन के नए स्क्रीन संदर्भ प्रस्तुत करना"
