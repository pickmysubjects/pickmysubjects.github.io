code: SCRN30007
year: 2026
learn:
  en: "Films and filmmakers from around the world, with a focus on Latin America, and how festivals and streaming move them."
  zh: "世界各地的电影与导演，重点关注拉丁美洲，以及电影节和流媒体如何让它们流通。"
  zh-TW: "世界各地的電影與導演，重點關注拉丁美洲，以及影展和串流平台如何讓它們流通。"
  ja: "中南米を中心に世界の映画と映画作家を見て、映画祭や配信がそれをどう広めるかを学ぶ。"
  ko: "라틴아메리카를 중심으로 세계 영화와 감독을 보고, 영화제와 스트리밍이 영화를 어떻게 퍼뜨리는지 배운다."
  vi: "Phim và nhà làm phim khắp thế giới, tập trung vào Mỹ Latinh, và cách liên hoan phim, phát trực tuyến đưa chúng đi xa."
  ms: "Filem dan pembikin filem dari seluruh dunia, berfokus pada Amerika Latin, serta cara festival dan penstriman mengedarkannya."
  id: "Film dan sineas dari seluruh dunia, dengan fokus Amerika Latin, serta cara festival dan streaming mengedarkannya."
  hi: "दुनिया भर की फ़िल्में और फ़िल्मकार, लैटिन अमेरिका पर ख़ास ध्यान, और फ़ेस्टिवल व स्ट्रीमिंग उन्हें कैसे फैलाते हैं।"
outcomes:
  - en: "Describe major movements in world cinema"
    zh: "描述世界电影的主要运动"
    zh-TW: "描述世界電影的主要運動"
    ja: "世界映画の主な運動を説明する"
    ko: "세계 영화의 주요 운동 설명하기"
    vi: "Mô tả các trào lưu chính của điện ảnh thế giới"
    ms: "Huraikan gerakan utama sinema dunia"
    id: "Menguraikan gerakan utama sinema dunia"
    hi: "विश्व सिनेमा के मुख्य आंदोलनों का वर्णन करना"
  - en: "Analyse films in their cultural context"
    zh: "结合文化背景分析电影"
    zh-TW: "結合文化背景分析電影"
    ja: "映画を文化的文脈の中で分析する"
    ko: "영화를 문화적 맥락에서 분석하기"
    vi: "Phân tích phim trong bối cảnh văn hóa"
    ms: "Analisis filem dalam konteks budayanya"
    id: "Menganalisis film dalam konteks budayanya"
    hi: "फ़िल्मों का उनके सांस्कृतिक संदर्भ में विश्लेषण करना"
  - en: "Explain how films circulate around the world"
    zh: "说明电影如何在全球流通"
    zh-TW: "說明電影如何在全球流通"
    ja: "映画が世界をどう巡るか説明する"
    ko: "영화가 세계로 퍼지는 방식 설명하기"
    vi: "Giải thích phim lưu hành khắp thế giới ra sao"
    ms: "Terangkan cara filem beredar ke seluruh dunia"
    id: "Menjelaskan cara film beredar ke seluruh dunia"
    hi: "फ़िल्में दुनिया भर में कैसे फैलती हैं, समझाना"
