code: MAST10007
year: 2026
learn:
  en: "Vectors, matrices and solving systems of equations, plus a first taste of mathematical proof."
  zh: "向量、矩阵和解方程组，并初步接触数学证明。"
  zh-TW: "向量、矩陣和解方程組，並初步接觸數學證明。"
  ja: "ベクトル、行列、連立方程式の解法と、数学的証明への入門。"
  ko: "벡터, 행렬, 연립방정식 풀이와 수학적 증명 맛보기."
  vi: "Vectơ, ma trận và giải hệ phương trình, cùng bước đầu làm quen chứng minh toán học."
  ms: "Vektor, matriks dan penyelesaian sistem persamaan, serta pengenalan awal pembuktian matematik."
  id: "Vektor, matriks, dan menyelesaikan sistem persamaan, plus pengenalan awal pembuktian matematika."
  hi: "वेक्टर, मैट्रिक्स और समीकरण निकाय हल करना, साथ में गणितीय प्रमाण की पहली झलक।"
outcomes:
  - en: "Solve systems of linear equations with matrices"
    zh: "用矩阵解线性方程组"
    zh-TW: "用矩陣解線性方程組"
    ja: "行列で連立一次方程式を解く"
    ko: "행렬로 연립일차방정식 풀기"
    vi: "Giải hệ phương trình tuyến tính bằng ma trận"
    ms: "Selesaikan sistem persamaan linear dengan matriks"
    id: "Menyelesaikan sistem persamaan linear dengan matriks"
    hi: "मैट्रिक्स से रैखिक समीकरण निकाय हल करना"
  - en: "Describe lines and planes with vectors"
    zh: "用向量描述直线和平面"
    zh-TW: "用向量描述直線和平面"
    ja: "ベクトルで直線と平面を表す"
    ko: "벡터로 직선과 평면 표현"
    vi: "Mô tả đường thẳng và mặt phẳng bằng vectơ"
    ms: "Huraikan garis dan satah dengan vektor"
    id: "Menggambarkan garis dan bidang dengan vektor"
    hi: "वेक्टर से रेखाओं और समतलों का वर्णन"
  - en: "Use software for maths calculations"
    zh: "用软件做数学计算"
    zh-TW: "用軟體做數學計算"
    ja: "ソフトウェアで数学の計算をする"
    ko: "소프트웨어로 수학 계산"
    vi: "Dùng phần mềm để tính toán"
    ms: "Guna perisian untuk pengiraan matematik"
    id: "Memakai software untuk perhitungan matematika"
    hi: "गणित की गणना के लिए सॉफ़्टवेयर इस्तेमाल करना"
