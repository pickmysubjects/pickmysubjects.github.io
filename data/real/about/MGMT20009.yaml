code: MGMT20009
year: 2027
learn:
  en: "The people, institutions and processes that set pay and conditions at work, and debates on unions, disputes and regulation."
  zh: "决定工资和劳动条件的各方、制度与流程，以及工会、劳资纠纷和监管的争论。"
  zh-TW: "決定薪資和勞動條件的各方、制度與流程，以及工會、勞資爭議和監管的爭論。"
  ja: "賃金や労働条件を決める当事者・制度・プロセスと、労働組合・紛争・規制をめぐる議論。"
  ko: "임금과 근로조건을 정하는 주체·제도·과정, 그리고 노조·분쟁·규제를 둘러싼 논쟁."
  vi: "Các bên, thể chế và quy trình quyết định lương và điều kiện làm việc, cùng tranh luận về công đoàn, tranh chấp và quản lý."
  ms: "Pihak, institusi dan proses yang menentukan gaji dan syarat kerja, serta perdebatan tentang kesatuan sekerja, pertikaian dan peraturan."
  id: "Pihak, lembaga, dan proses yang menentukan upah dan syarat kerja, serta perdebatan soal serikat pekerja, sengketa, dan regulasi."
  hi: "काम का वेतन और शर्तें तय करने वाले पक्ष, संस्थाएँ और प्रक्रियाएँ, साथ ही यूनियनों, विवादों और नियमन पर बहस।"
outcomes:
  - en: "Describe the key players and institutions in employment"
    zh: "描述劳动关系中的主要角色和制度"
    zh-TW: "描述勞動關係中的主要角色和制度"
    ja: "雇用関係の主な当事者と制度を説明する"
    ko: "고용 관계의 주요 주체와 제도 설명하기"
    vi: "Mô tả các bên và thể chế chính trong quan hệ lao động"
    ms: "Huraikan pihak dan institusi utama dalam pekerjaan"
    id: "Menjelaskan pihak dan lembaga utama dalam ketenagakerjaan"
    hi: "रोज़गार से जुड़े मुख्य पक्ष और संस्थाएँ बताना"
  - en: "Weigh competing views on employee relations issues"
    zh: "评估劳资关系议题上的不同观点"
    zh-TW: "評估勞資關係議題上的不同觀點"
    ja: "労使関係の論点で対立する見方を比較する"
    ko: "노사관계 쟁점에 대한 상반된 견해 평가하기"
    vi: "Đánh giá các quan điểm trái chiều về quan hệ lao động"
    ms: "Nilai pandangan berbeza tentang isu hubungan pekerja"
    id: "Menilai pandangan berbeda soal hubungan industrial"
    hi: "कर्मचारी संबंधों पर अलग-अलग मतों को परखना"
  - en: "Devise strategies for real workplace relations challenges"
    zh: "为现实中的劳资问题制定策略"
    zh-TW: "為現實中的勞資問題制定策略"
    ja: "実際の労使関係の課題に対する戦略を考える"
    ko: "실제 노사관계 과제에 대한 전략 세우기"
    vi: "Đưa ra chiến lược cho thách thức quan hệ lao động thực tế"
    ms: "Rangka strategi untuk cabaran hubungan pekerja sebenar"
    id: "Menyusun strategi untuk tantangan hubungan kerja nyata"
    hi: "असल कर्मचारी-संबंध चुनौतियों के लिए रणनीति बनाना"
