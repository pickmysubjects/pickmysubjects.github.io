code: FOOD30010
year: 2026
learn:
  en: "How food ingredients like water, emulsifiers and flavours interact inside food, and how processing changes them."
  zh: "食物里水、乳化剂、风味等成分如何相互作用，加工又如何改变它们。"
  zh-TW: "食物中水、乳化劑、風味等成分如何交互作用，加工又如何改變它們。"
  ja: "水・乳化剤・風味など食品成分が食品中でどう相互作用し、加工でどう変わるか。"
  ko: "물, 유화제, 풍미 등 식품 성분이 식품 안에서 어떻게 상호작용하고 가공으로 어떻게 변하는지."
  vi: "Các thành phần như nước, chất nhũ hóa, hương vị tương tác ra sao trong thực phẩm và chế biến thay đổi chúng thế nào."
  ms: "Cara bahan makanan seperti air, pengemulsi dan perisa berinteraksi dalam makanan, dan kesan pemprosesan."
  id: "Cara bahan pangan seperti air, pengemulsi dan perisa berinteraksi dalam makanan, dan pengaruh pengolahan."
  hi: "भोजन में पानी, इमल्सीफ़ायर और फ्लेवर जैसे तत्व कैसे आपस में क्रिया करते हैं और प्रोसेसिंग उन्हें कैसे बदलती है।"
outcomes:
  - en: "Explain how emulsifiers interact with food parts"
    zh: "解释乳化剂与食物成分的作用"
    zh-TW: "解釋乳化劑與食物成分的作用"
    ja: "乳化剤と食品成分の作用を説明する"
    ko: "유화제와 식품 성분의 상호작용 설명"
    vi: "Giải thích tác động của chất nhũ hóa trong thực phẩm"
    ms: "Terangkan interaksi pengemulsi dengan komponen makanan"
    id: "Menjelaskan interaksi pengemulsi dengan komponen pangan"
    hi: "इमल्सीफ़ायर और खाद्य घटकों की क्रिया समझाना"
  - en: "Describe how flavour and food structure affect taste"
    zh: "描述风味与食物结构如何影响感知"
    zh-TW: "描述風味與食物結構如何影響感知"
    ja: "風味と食品構造が知覚に与える影響を述べる"
    ko: "풍미와 식품 구조가 맛 인식에 주는 영향 설명"
    vi: "Mô tả hương vị và cấu trúc ảnh hưởng cảm nhận"
    ms: "Huraikan kesan perisa dan struktur makanan pada rasa"
    id: "Menguraikan pengaruh perisa dan struktur pada rasa"
    hi: "फ्लेवर और भोजन की संरचना का स्वाद पर असर बताना"
  - en: "Assess how processing changes food structure"
    zh: "评估加工如何改变食物结构"
    zh-TW: "評估加工如何改變食物結構"
    ja: "加工が食品構造をどう変えるか評価する"
    ko: "가공이 식품 구조를 바꾸는 방식 평가"
    vi: "Đánh giá chế biến làm đổi cấu trúc thực phẩm"
    ms: "Nilai kesan pemprosesan pada struktur makanan"
    id: "Menilai pengaruh pengolahan pada struktur pangan"
    hi: "प्रोसेसिंग से भोजन की संरचना में बदलाव आंकना"
