code: HPSC20020
year: 2026
learn:
  en: "The long, complicated relationship between religion and science, from Kepler and Newton to today's debates."
  zh: "宗教与科学之间漫长而复杂的关系，从开普勒、牛顿到今天的争论。"
  zh-TW: "宗教與科學之間漫長而複雜的關係，從克卜勒、牛頓到今天的爭論。"
  ja: "ケプラーやニュートンから今日の論争まで、宗教と科学の長く複雑な関係を学ぶ。"
  ko: "케플러와 뉴턴부터 오늘날 논쟁까지, 종교와 과학의 길고 복잡한 관계를 배운다."
  vi: "Mối quan hệ lâu dài và phức tạp giữa tôn giáo và khoa học, từ Kepler, Newton đến các tranh luận hôm nay."
  ms: "Hubungan panjang dan rumit antara agama dan sains, dari Kepler dan Newton hingga perdebatan masa kini."
  id: "Hubungan panjang dan rumit antara agama dan sains, dari Kepler dan Newton sampai perdebatan masa kini."
  hi: "धर्म और विज्ञान का लंबा, उलझा रिश्ता, केपलर और न्यूटन से आज की बहसों तक।"
outcomes:
  - en: "Describe key moments in science and religion history"
    zh: "描述科学与宗教史上的关键时刻"
    zh-TW: "描述科學與宗教史上的關鍵時刻"
    ja: "科学と宗教の歴史の重要な場面を説明する"
    ko: "과학과 종교 역사의 주요 순간 설명하기"
    vi: "Mô tả các mốc chính trong lịch sử khoa học và tôn giáo"
    ms: "Huraikan detik penting sejarah sains dan agama"
    id: "Menguraikan momen penting sejarah sains dan agama"
    hi: "विज्ञान और धर्म के इतिहास के अहम पलों का वर्णन करना"
  - en: "Analyse arguments about God and nature"
    zh: "分析关于上帝与自然的论证"
    zh-TW: "分析關於上帝與自然的論證"
    ja: "神と自然をめぐる議論を分析する"
    ko: "신과 자연에 관한 논증 분석하기"
    vi: "Phân tích các lập luận về Thượng đế và tự nhiên"
    ms: "Analisis hujah tentang Tuhan dan alam"
    id: "Menganalisis argumen tentang Tuhan dan alam"
    hi: "ईश्वर और प्रकृति पर तर्कों का विश्लेषण करना"
  - en: "Discuss current debates with care and evidence"
    zh: "用证据审慎地讨论当前争论"
    zh-TW: "用證據審慎地討論當前爭論"
    ja: "今の論争を根拠をもって丁寧に論じる"
    ko: "현재 논쟁을 근거를 들어 신중히 논의하기"
    vi: "Thảo luận các tranh luận hiện nay một cách thận trọng, có dẫn chứng"
    ms: "Bincangkan perdebatan semasa dengan teliti dan bukti"
    id: "Membahas perdebatan terkini dengan cermat dan berbukti"
    hi: "मौजूदा बहसों पर सावधानी और प्रमाण से चर्चा करना"
