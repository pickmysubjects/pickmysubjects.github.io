code: CHEM10004
year: 2026
learn:
  en: "Follows Chemistry 1: reaction rates, organic reactions, redox, spectroscopy, metal compounds and solids."
  zh: "接着化学1：反应速率、有机反应、氧化还原、光谱和金属化合物。"
  zh-TW: "接續化學1：反應速率、有機反應、氧化還原、光譜和金屬化合物。"
  ja: "化学1の続き：反応速度、有機反応、酸化還元、分光法、金属化合物、固体。"
  ko: "화학 1의 후속: 반응 속도, 유기 반응, 산화환원, 분광학, 금속 화합물, 고체."
  vi: "Tiếp nối Hóa học 1: tốc độ phản ứng, phản ứng hữu cơ, oxi hóa khử, quang phổ, hợp chất kim loại và chất rắn."
  ms: "Sambungan Kimia 1: kadar tindak balas, tindak balas organik, redoks, spektroskopi, sebatian logam dan pepejal."
  id: "Lanjutan Kimia 1: laju reaksi, reaksi organik, redoks, spektroskopi, senyawa logam, dan padatan."
  hi: "केमिस्ट्री 1 के बाद: रिएक्शन रेट, ऑर्गेनिक रिएक्शन, रेडॉक्स, स्पेक्ट्रोस्कोपी, धातु यौगिक और ठोस।"
outcomes:
  - en: "Work out chemical structures from spectra"
    zh: "根据光谱数据推断分子结构"
    zh-TW: "根據光譜資料推斷分子結構"
    ja: "スペクトルから化学構造を決める"
    ko: "스펙트럼으로 화학 구조 알아내기"
    vi: "Xác định cấu trúc hóa học từ phổ"
    ms: "Tentukan struktur kimia daripada spektrum"
    id: "Menentukan struktur kimia dari spektrum"
    hi: "स्पेक्ट्रा से रासायनिक संरचना निकालना"
  - en: "Do basic lab experiments and write reports"
    zh: "做基础实验并写实验报告"
    zh-TW: "做基礎實驗並寫實驗報告"
    ja: "基本的な実験をしてレポートを書く"
    ko: "기초 실험을 하고 보고서 쓰기"
    vi: "Làm thí nghiệm cơ bản và viết báo cáo"
    ms: "Buat eksperimen asas dan tulis laporan"
    id: "Melakukan eksperimen dasar dan menulis laporan"
    hi: "बेसिक लैब प्रयोग करना और रिपोर्ट लिखना"
  - en: "Explain reaction rates and redox chemistry"
    zh: "解释反应速率和氧化还原"
    zh-TW: "解釋反應速率和氧化還原"
    ja: "反応速度と酸化還元を説明する"
    ko: "반응 속도와 산화환원 설명하기"
    vi: "Giải thích tốc độ phản ứng và hóa học oxi hóa khử"
    ms: "Terangkan kadar tindak balas dan kimia redoks"
    id: "Menjelaskan laju reaksi dan kimia redoks"
    hi: "रिएक्शन रेट और रेडॉक्स केमिस्ट्री समझाना"
