code: SPAN20025
year: 2026
learn:
  en: "Argentina's history and society seen through its novels, stories and films, and how they mix fact and fiction."
  zh: "通过阿根廷的小说、故事和电影了解其历史与社会，以及虚实交织。"
  zh-TW: "透過阿根廷的小說、故事和電影了解其歷史與社會，以及虛實交織。"
  ja: "アルゼンチンの小説・物語・映画を通して、その歴史と社会、事実と虚構の交わりを学ぶ。"
  ko: "아르헨티나의 소설·이야기·영화로 그 역사와 사회, 사실과 허구의 뒤섞임을 본다."
  vi: "Lịch sử và xã hội Argentina qua tiểu thuyết, truyện và phim, cùng cách chúng pha trộn thực và hư cấu."
  ms: "Sejarah dan masyarakat Argentina melalui novel, cerita dan filem, serta cara fakta dan fiksyen bercampur."
  id: "Sejarah dan masyarakat Argentina melalui novel, cerita dan film, serta cara fakta dan fiksi berbaur."
  hi: "अर्जेंटीना का इतिहास और समाज उसके उपन्यासों, कहानियों और फ़िल्मों से, और कैसे उनमें सच और कल्पना मिलते हैं।"
outcomes:
  - en: "Read Argentine stories and novels closely"
    zh: "细读阿根廷的故事和小说"
    zh-TW: "細讀阿根廷的故事和小說"
    ja: "アルゼンチンの物語や小説を精読する"
    ko: "아르헨티나 이야기와 소설 정독하기"
    vi: "Đọc kỹ truyện và tiểu thuyết Argentina"
    ms: "Baca cerita dan novel Argentina dengan teliti"
    id: "Membaca cerita dan novel Argentina dengan cermat"
    hi: "अर्जेंटीनी कहानियाँ और उपन्यास ध्यान से पढ़ना"
  - en: "Connect texts to Argentina's history"
    zh: "把作品与阿根廷历史联系起来"
    zh-TW: "把作品與阿根廷歷史聯繫起來"
    ja: "作品をアルゼンチンの歴史と結びつける"
    ko: "작품을 아르헨티나 역사와 연결하기"
    vi: "Liên hệ tác phẩm với lịch sử Argentina"
    ms: "Kaitkan teks dengan sejarah Argentina"
    id: "Mengaitkan teks dengan sejarah Argentina"
    hi: "पाठों को अर्जेंटीना के इतिहास से जोड़ना"
  - en: "Write and present your analysis in Spanish"
    zh: "用西班牙语撰写并展示你的分析"
    zh-TW: "用西班牙語撰寫並展示你的分析"
    ja: "分析をスペイン語で書き発表する"
    ko: "분석을 스페인어로 쓰고 발표하기"
    vi: "Viết và trình bày phân tích bằng tiếng Tây Ban Nha"
    ms: "Tulis dan bentangkan analisis dalam bahasa Sepanyol"
    id: "Menulis dan mempresentasikan analisis dalam bahasa Spanyol"
    hi: "अपना विश्लेषण स्पेनिश में लिखना और प्रस्तुत करना"
