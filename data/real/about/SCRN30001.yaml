code: SCRN30001
year: 2026
learn:
  en: "Love stories in art cinema from Australia, Europe and North America, and the film styles used to tell them."
  zh: "澳大利亚、欧洲和北美艺术电影中的爱情故事，以及讲述它们的电影手法。"
  zh-TW: "澳洲、歐洲和北美藝術電影中的愛情故事，以及講述它們的電影手法。"
  ja: "オーストラリア・欧州・北米のアート映画における恋愛物語と、それを語る映像手法を学ぶ。"
  ko: "호주·유럽·북미 예술 영화 속 사랑 이야기와 그것을 풀어내는 영화 기법을 배운다."
  vi: "Chuyện tình trong điện ảnh nghệ thuật Úc, châu Âu và Bắc Mỹ, cùng các phong cách điện ảnh dùng để kể chúng."
  ms: "Kisah cinta dalam filem seni dari Australia, Eropah dan Amerika Utara, serta gaya filem yang digunakan untuk menceritakannya."
  id: "Kisah cinta dalam film seni dari Australia, Eropa dan Amerika Utara, serta gaya film yang dipakai untuk menuturkannya."
  hi: "ऑस्ट्रेलिया, यूरोप और उत्तरी अमेरिका के आर्ट सिनेमा में प्रेम कहानियां, और उन्हें कहने की फ़िल्मी शैलियां।"
outcomes:
  - en: "Close-analyse scenes from art films"
    zh: "对艺术电影的段落进行细读分析"
    zh-TW: "對藝術電影的段落進行細讀分析"
    ja: "アート映画の場面を細かく分析する"
    ko: "예술 영화 장면을 면밀히 분석하기"
    vi: "Phân tích kỹ các cảnh trong phim nghệ thuật"
    ms: "Analisis rapi babak daripada filem seni"
    id: "Menganalisis cermat adegan film seni"
    hi: "आर्ट फ़िल्मों के दृश्यों का बारीक विश्लेषण करना"
  - en: "Compare how genres tell love stories"
    zh: "比较不同类型如何讲述爱情"
    zh-TW: "比較不同類型如何講述愛情"
    ja: "ジャンルごとの恋愛の語り方を比べる"
    ko: "장르별로 사랑 이야기를 푸는 방식 비교하기"
    vi: "So sánh cách các thể loại kể chuyện tình"
    ms: "Bandingkan cara genre menceritakan kisah cinta"
    id: "Membandingkan cara berbagai genre menuturkan kisah cinta"
    hi: "अलग विधाएं प्रेम कहानियां कैसे कहती हैं, तुलना करना"
  - en: "Discuss how films represent love and desire"
    zh: "讨论电影如何表现爱与欲望"
    zh-TW: "討論電影如何表現愛與慾望"
    ja: "映画が愛と欲望をどう描くか論じる"
    ko: "영화가 사랑과 욕망을 그리는 방식 논의하기"
    vi: "Thảo luận phim thể hiện tình yêu và khát khao ra sao"
    ms: "Bincangkan cara filem menggambarkan cinta dan keinginan"
    id: "Membahas cara film menggambarkan cinta dan hasrat"
    hi: "फ़िल्में प्रेम और इच्छा को कैसे दिखाती हैं, चर्चा करना"
