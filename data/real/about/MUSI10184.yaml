code: MUSI10184
year: 2026
learn:
  en: "Write pop songs: song form, hooks, choruses and lyrics, workshopped in class, ending with an original song."
  zh: "创作流行歌曲：曲式、记忆点、副歌和歌词，课上互评，最后完成一首原创歌曲。"
  zh-TW: "創作流行歌曲：曲式、記憶點、副歌與歌詞，課堂互評，最後完成一首原創歌曲。"
  ja: "ポップソングを書く。曲構成、フック、サビ、歌詞を授業で練り、最後にオリジナル曲を作る。"
  ko: "팝송 작곡: 곡 구성, 훅, 후렴, 가사를 수업에서 다듬고 창작곡 완성."
  vi: "Sáng tác nhạc pop: cấu trúc, hook, điệp khúc và lời, góp ý trên lớp, kết thúc bằng một bài gốc."
  ms: "Tulis lagu pop: bentuk lagu, cangkuk, korus dan lirik, dibengkelkan di kelas, lagu asli di akhir."
  id: "Menulis lagu pop: bentuk lagu, hook, reff, dan lirik, dibahas di kelas, diakhiri satu lagu orisinal."
  hi: "पॉप गीत लिखना: गीत संरचना, हुक, कोरस और बोल; कक्षा में चर्चा, अंत में एक मौलिक गीत।"
outcomes:
  - en: "Structure a song around a strong hook"
    zh: "围绕抓耳的记忆点构建歌曲"
    zh-TW: "圍繞抓耳的記憶點建構歌曲"
    ja: "印象的なフックを軸に曲を組み立てる"
    ko: "강한 훅을 중심으로 곡 구성하기"
    vi: "Dựng bài quanh một hook mạnh"
    ms: "Bina lagu sekitar cangkuk kuat"
    id: "Menyusun lagu di sekitar hook kuat"
    hi: "मज़बूत हुक के इर्द-गिर्द गीत बनाना"
  - en: "Write lyrics that fit the melody"
    zh: "写出贴合旋律的歌词"
    zh-TW: "寫出貼合旋律的歌詞"
    ja: "メロディに合う歌詞を書く"
    ko: "선율에 맞는 가사 쓰기"
    vi: "Viết lời hợp với giai điệu"
    ms: "Tulis lirik sesuai melodi"
    id: "Menulis lirik yang pas dengan melodi"
    hi: "धुन से मेल खाते बोल लिखना"
  - en: "Understand what the music industry wants"
    zh: "了解音乐行业的要求"
    zh-TW: "了解音樂產業的要求"
    ja: "音楽業界が求めるものを知る"
    ko: "음악 산업의 요구 이해하기"
    vi: "Hiểu ngành âm nhạc cần gì"
    ms: "Faham kehendak industri muzik"
    id: "Memahami kebutuhan industri musik"
    hi: "संगीत उद्योग की ज़रूरतें समझना"
