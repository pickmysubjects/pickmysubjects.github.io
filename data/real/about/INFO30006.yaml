code: INFO30006
year: 2026
learn:
  en: "Protecting information and privacy: security threats, managing risk, encryption and hands-on security tools."
  zh: "保护信息和隐私：安全威胁、风险管理、加密和实用安全工具。"
  zh-TW: "保護資訊和隱私：資安威脅、風險管理、加密和實用資安工具。"
  ja: "情報とプライバシーの保護：セキュリティ脅威、リスク管理、暗号化、実践的なセキュリティツール。"
  ko: "정보와 프라이버시 보호: 보안 위협, 위험 관리, 암호화, 실습 보안 도구."
  vi: "Bảo vệ thông tin và quyền riêng tư: mối đe dọa bảo mật, quản lý rủi ro, mã hóa và công cụ bảo mật thực hành."
  ms: "Melindungi maklumat dan privasi: ancaman keselamatan, pengurusan risiko, penyulitan dan alat keselamatan amali."
  id: "Melindungi informasi dan privasi: ancaman keamanan, manajemen risiko, enkripsi, dan alat keamanan praktis."
  hi: "जानकारी और प्राइवेसी की सुरक्षा: सिक्योरिटी खतरे, जोखिम प्रबंधन, एन्क्रिप्शन और प्रैक्टिकल सिक्योरिटी टूल।"
outcomes:
  - en: "Identify security and privacy threats"
    zh: "识别安全和隐私威胁"
    zh-TW: "辨識資安和隱私威脅"
    ja: "セキュリティとプライバシーの脅威を見つける"
    ko: "보안·프라이버시 위협 식별"
    vi: "Nhận diện mối đe dọa bảo mật và quyền riêng tư"
    ms: "Kenal pasti ancaman keselamatan dan privasi"
    id: "Mengenali ancaman keamanan dan privasi"
    hi: "सिक्योरिटी और प्राइवेसी खतरे पहचानना"
  - en: "Apply security best practices"
    zh: "运用安全最佳实践"
    zh-TW: "運用資安最佳實務"
    ja: "セキュリティのベストプラクティスを実践する"
    ko: "보안 모범 사례 적용"
    vi: "Áp dụng các thực hành bảo mật tốt nhất"
    ms: "Guna amalan terbaik keselamatan"
    id: "Menerapkan praktik terbaik keamanan"
    hi: "सिक्योरिटी की बेस्ट प्रैक्टिस अपनाना"
  - en: "Explain how encryption protects information"
    zh: "解释加密如何保护信息"
    zh-TW: "解釋加密如何保護資訊"
    ja: "暗号化が情報を守る仕組みを説明する"
    ko: "암호화가 정보를 보호하는 방식 설명"
    vi: "Giải thích mã hóa bảo vệ thông tin ra sao"
    ms: "Terangkan cara penyulitan melindungi maklumat"
    id: "Menjelaskan cara enkripsi melindungi informasi"
    hi: "एन्क्रिप्शन जानकारी कैसे बचाता है, समझाना"
