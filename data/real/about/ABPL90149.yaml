code: ABPL90149
year: 2027
learn:
  en: "How digital technology is changing architectural practice, from design data to digital fabrication, with guest designers."
  zh: "数字技术如何改变建筑实践，从设计信息到数字制造，有设计师讲座和案例。"
  zh-TW: "數位科技如何改變建築實務，從設計資訊到數位製造，有設計師講座與個案。"
  ja: "デジタル技術が建築実務をどう変えるか。設計情報からデジタル製作まで、ゲストと事例。"
  ko: "디지털 기술이 건축 실무를 바꾸는 방식. 설계 정보부터 디지털 제작까지."
  vi: "Công nghệ số thay đổi hành nghề kiến trúc ra sao, từ thông tin thiết kế đến chế tạo số."
  ms: "Cara teknologi digital mengubah amalan seni bina, dari maklumat reka bentuk hingga fabrikasi digital."
  id: "Cara teknologi digital mengubah praktik arsitektur, dari informasi desain hingga fabrikasi digital."
  hi: "डिजिटल तकनीक वास्तु अभ्यास को कैसे बदल रही है, डिज़ाइन जानकारी से डिजिटल फ़ैब्रिकेशन तक।"
outcomes:
  - en: "Assess how digital tools affect architects' work"
    zh: "评估数字工具对建筑师工作的影响"
    zh-TW: "評估數位工具對建築師工作的影響"
    ja: "デジタルツールが建築家の仕事に与える影響を評価する"
    ko: "디지털 도구가 건축가 업무에 주는 영향 평가"
    vi: "Đánh giá tác động công cụ số đến kiến trúc sư"
    ms: "Menilai kesan alat digital pada kerja arkitek"
    id: "Menilai dampak alat digital pada kerja arsitek"
    hi: "डिजिटल टूल का वास्तुकारों के काम पर असर आँकना"
  - en: "Write a case study and essay on digital practice"
    zh: "就数字实践撰写案例与论文"
    zh-TW: "就數位實務撰寫個案與論文"
    ja: "デジタル実務の事例と論文を書く"
    ko: "디지털 실무 사례와 에세이 쓰기"
    vi: "Viết tình huống và tiểu luận về thực hành số"
    ms: "Menulis kajian kes dan esei amalan digital"
    id: "Menulis studi kasus dan esai praktik digital"
    hi: "डिजिटल अभ्यास पर केस स्टडी और निबंध लिखना"
