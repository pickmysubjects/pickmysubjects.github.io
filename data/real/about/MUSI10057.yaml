code: MUSI10057
year: 2026
learn:
  en: "Sing medieval, Renaissance and Baroque music in a small chamber choir, a cappella or with early instruments."
  zh: "在小型室内合唱团中演唱中世纪、文艺复兴和巴洛克音乐，无伴奏或与古乐器合作。"
  zh-TW: "在小型室內合唱團中演唱中世紀、文藝復興與巴洛克音樂，無伴奏或與古樂器合作。"
  ja: "小さな室内合唱団で中世・ルネサンス・バロックの音楽を無伴奏や古楽器と歌う。"
  ko: "소규모 실내합창단에서 중세·르네상스·바로크 음악을 무반주 또는 고악기와 함께 노래."
  vi: "Hát nhạc Trung cổ, Phục hưng và Baroque trong hợp xướng nhỏ, a cappella hoặc với nhạc cụ cổ."
  ms: "Nyanyi muzik zaman pertengahan, Renaissance dan Barok dalam koir kecil, a cappella atau berinstrumen."
  id: "Menyanyikan musik abad pertengahan, Renaisans dan Barok di paduan suara kecil, a cappella atau berinstrumen."
  hi: "छोटे चैंबर कोयर में मध्ययुगीन, पुनर्जागरण और बारोक संगीत गाना, बिना या पुराने वाद्यों के साथ।"
outcomes:
  - en: "Sing early music in a small choir"
    zh: "在小型合唱团中演唱早期音乐"
    zh-TW: "在小型合唱團中演唱早期音樂"
    ja: "小編成の合唱で古楽を歌う"
    ko: "소규모 합창으로 고음악 부르기"
    vi: "Hát nhạc cổ trong hợp xướng nhỏ"
    ms: "Nyanyi muzik awal dalam koir kecil"
    id: "Menyanyikan musik kuno di paduan suara kecil"
    hi: "छोटे कोयर में प्राचीन संगीत गाना"
  - en: "Prepare your vocal part accurately"
    zh: "准确准备自己的声部"
    zh-TW: "準確準備自己的聲部"
    ja: "自分の声部を正確に準備する"
    ko: "자기 성부를 정확히 준비하기"
    vi: "Chuẩn bị bè giọng chính xác"
    ms: "Sedia bahagian vokal dengan tepat"
    id: "Menyiapkan bagian vokal dengan tepat"
    hi: "अपना स्वर भाग सही तैयार करना"
  - en: "Perform with early instrument groups"
    zh: "与古乐器团体合作演出"
    zh-TW: "與古樂器團體合作演出"
    ja: "古楽器グループと共演する"
    ko: "고악기 그룹과 함께 공연하기"
    vi: "Biểu diễn cùng nhóm nhạc cụ cổ"
    ms: "Membuat persembahan dengan kumpulan alat lama"
    id: "Tampil bersama grup alat musik kuno"
    hi: "पुराने वाद्य समूहों के साथ प्रस्तुति"
