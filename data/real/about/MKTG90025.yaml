code: MKTG90025
year: 2027
learn:
  en: "Marketing for startups: idea generation, market analysis, customer alignment and building a new brand."
  zh: "创业营销：创意产生、市场分析、贴合客户和打造新品牌。"
  zh-TW: "創業行銷：創意發想、市場分析、貼近顧客和打造新品牌。"
  ja: "スタートアップのマーケティング：アイデア創出、市場分析、顧客理解、新ブランド構築。"
  ko: "스타트업 마케팅: 아이디어 발굴, 시장 분석, 고객 정렬, 새 브랜드 구축."
  vi: "Marketing cho khởi nghiệp: tìm ý tưởng, phân tích thị trường, hiểu khách hàng và xây thương hiệu mới."
  ms: "Pemasaran untuk syarikat baharu: menjana idea, analisis pasaran, menyelaras pelanggan dan membina jenama."
  id: "Pemasaran untuk startup: mencari ide, analisis pasar, menyelaraskan pelanggan, dan membangun merek baru."
  hi: "स्टार्टअप के लिए मार्केटिंग: विचार, बाज़ार विश्लेषण, ग्राहक तालमेल और नया ब्रांड बनाना।"
outcomes:
  - en: "Evaluate whether a new market entry is viable"
    zh: "评估进入新市场是否可行"
    zh-TW: "評估進入新市場是否可行"
    ja: "新市場参入の実現性を評価する"
    ko: "신규 시장 진입의 타당성 평가하기"
    vi: "Đánh giá tính khả thi khi gia nhập thị trường mới"
    ms: "Menilai daya maju kemasukan pasaran baharu"
    id: "Menilai kelayakan masuk pasar baru"
    hi: "नए बाज़ार में प्रवेश की व्यवहार्यता आँकना"
  - en: "Build a start-up marketing strategy from theory"
    zh: "用营销理论制定创业策略"
    zh-TW: "用行銷理論制定創業策略"
    ja: "理論をもとにスタートアップ戦略を立てる"
    ko: "이론으로 스타트업 마케팅 전략 세우기"
    vi: "Xây chiến lược marketing khởi nghiệp từ lý thuyết"
    ms: "Membina strategi pemasaran syarikat baharu"
    id: "Menyusun strategi pemasaran startup dari teori"
    hi: "सिद्धांत से स्टार्टअप मार्केटिंग रणनीति बनाना"
  - en: "Create a campaign plan for a new venture"
    zh: "为新创企业制定营销活动计划"
    zh-TW: "為新創企業制定行銷活動計畫"
    ja: "新事業のキャンペーン計画を作る"
    ko: "신규 사업의 캠페인 계획 수립하기"
    vi: "Lập kế hoạch chiến dịch cho dự án mới"
    ms: "Membina pelan kempen untuk usaha baharu"
    id: "Menyusun rencana kampanye untuk usaha baru"
    hi: "नए उद्यम के लिए अभियान योजना बनाना"
