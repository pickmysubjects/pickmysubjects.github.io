code: MUSI20253
year: 2027
learn:
  en: "Individual lessons to build your technique, musicianship and sense of style through exercises and repertoire on a personal plan."
  zh: "个别辅导，按个人计划通过练习和曲目提升技巧、音乐性和风格感。"
  zh-TW: "個別指導，依個人計畫透過練習和曲目提升技巧、音樂性和風格感。"
  ja: "個人レッスンで、個別計画の練習と曲を通じて技術・音楽性・スタイル感覚を伸ばす。"
  ko: "개인 레슨으로 개인 계획에 따른 연습과 레퍼토리를 통해 테크닉, 음악성, 스타일 감각 키우기."
  vi: "Học riêng để phát triển kỹ thuật, nhạc cảm và phong cách qua bài tập và tiết mục theo kế hoạch cá nhân."
  ms: "Kelas individu untuk bina teknik, kemuzikan dan gaya melalui latihan dan repertoir mengikut pelan peribadi."
  id: "Les individual untuk membangun teknik, musikalitas, dan rasa gaya lewat latihan dan repertoar sesuai rencana pribadi."
  hi: "व्यक्तिगत कक्षाओं में निजी योजना के अभ्यास व रिपर्टॉयर से तकनीक, संगीतमयता और शैली की समझ बढ़ाना।"
outcomes:
  - en: "Build strategies for technical control"
    zh: "建立技术控制的方法"
    zh-TW: "建立技術控制的方法"
    ja: "技術をコントロールする方法を身につける"
    ko: "기술 통제 전략 세우기"
    vi: "Xây dựng cách kiểm soát kỹ thuật"
    ms: "Bina strategi kawalan teknik"
    id: "Membangun strategi kontrol teknik"
    hi: "तकनीकी नियंत्रण की रणनीतियाँ बनाना"
  - en: "Produce a well-shaped, expressive sound"
    zh: "发出圆润而有表现力的声音"
    zh-TW: "發出圓潤而有表現力的聲音"
    ja: "整った表情豊かな音を出す"
    ko: "균형 잡히고 표현력 있는 소리 내기"
    vi: "Tạo âm thanh tròn trịa, giàu biểu cảm"
    ms: "Hasilkan bunyi yang kemas dan ekspresif"
    id: "Menghasilkan suara yang terbentuk baik dan ekspresif"
    hi: "सुगठित और भावपूर्ण ध्वनि निकालना"
  - en: "Perform with commitment and confidence"
    zh: "投入且自信地演奏"
    zh-TW: "投入且自信地演奏"
    ja: "打ち込んで自信をもって演奏する"
    ko: "몰입하고 자신 있게 연주하기"
    vi: "Biểu diễn tận tâm và tự tin"
    ms: "Membuat persembahan dengan komited dan yakin"
    id: "Tampil dengan sungguh-sungguh dan percaya diri"
    hi: "लगन और आत्मविश्वास से प्रस्तुति देना"
