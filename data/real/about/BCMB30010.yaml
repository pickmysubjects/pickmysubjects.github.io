code: BCMB30010
year: 2026
learn:
  en: "Advanced lab training in DNA, protein and cell culture work, from designing experiments to writing papers."
  zh: "进阶实验训练：DNA、蛋白质和细胞培养，从设计实验到写论文。"
  zh-TW: "進階實驗訓練：DNA、蛋白質和細胞培養，從設計實驗到寫論文。"
  ja: "DNA・タンパク質・細胞培養の上級実験トレーニング。実験計画から論文執筆まで。"
  ko: "DNA, 단백질, 세포 배양 고급 실험 훈련. 실험 설계부터 논문 작성까지."
  vi: "Đào tạo thí nghiệm nâng cao về DNA, protein, nuôi cấy tế bào, từ thiết kế thí nghiệm đến viết bài."
  ms: "Latihan makmal lanjutan dalam DNA, protein dan kultur sel, dari reka eksperimen hingga tulis kertas."
  id: "Pelatihan lab lanjutan DNA, protein, dan kultur sel, dari merancang eksperimen sampai menulis makalah."
  hi: "DNA, प्रोटीन और सेल कल्चर में एडवांस्ड लैब ट्रेनिंग, प्रयोग डिज़ाइन से पेपर लिखने तक।"
outcomes:
  - en: "Keep a proper lab notebook"
    zh: "规范记录实验笔记"
    zh-TW: "規範記錄實驗筆記"
    ja: "きちんとした実験ノートをつける"
    ko: "실험 노트를 제대로 작성하기"
    vi: "Ghi sổ thí nghiệm đúng chuẩn"
    ms: "Simpan buku nota makmal dengan betul"
    id: "Membuat buku catatan lab yang baik"
    hi: "सही ढंग से लैब नोटबुक रखना"
  - en: "Analyse DNA and protein data with bioinformatics"
    zh: "用生物信息软件分析DNA和蛋白数据"
    zh-TW: "用生物資訊軟體分析DNA和蛋白質資料"
    ja: "バイオインフォマティクスでDNA・タンパク質データを解析する"
    ko: "생물정보학으로 DNA·단백질 데이터 분석하기"
    vi: "Phân tích dữ liệu DNA, protein bằng tin sinh học"
    ms: "Analisis data DNA dan protein dengan bioinformatik"
    id: "Menganalisis data DNA dan protein dengan bioinformatika"
    hi: "बायोइन्फ़ॉर्मेटिक्स से DNA व प्रोटीन डेटा का विश्लेषण"
  - en: "Write up findings as a scientific report"
    zh: "把结果写成科学报告"
    zh-TW: "把結果寫成科學報告"
    ja: "結果を科学レポートにまとめる"
    ko: "결과를 과학 보고서로 작성하기"
    vi: "Viết kết quả thành báo cáo khoa học"
    ms: "Tulis dapatan sebagai laporan saintifik"
    id: "Menulis temuan sebagai laporan ilmiah"
    hi: "नतीजों को वैज्ञानिक रिपोर्ट में लिखना"
