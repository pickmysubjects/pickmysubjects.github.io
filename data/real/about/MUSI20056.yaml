code: MUSI20056
year: 2026
learn:
  en: "Extend your composing to small ensembles and electronic media, building a 15-minute folio of new work."
  zh: "把作曲扩展到小型合奏和电子媒介，完成15分钟作品集。"
  zh-TW: "把作曲擴展到小型合奏和電子媒介，完成15分鐘作品集。"
  ja: "小編成アンサンブルや電子メディアへ作曲を広げ、15分の作品集を作る。"
  ko: "소규모 앙상블과 전자 매체로 작곡을 넓혀 15분 작품집 완성."
  vi: "Mở rộng sáng tác cho nhóm nhỏ và phương tiện điện tử, làm tập 15 phút."
  ms: "Luaskan gubahan ke ensembel kecil dan media elektronik, hasilkan folio 15 minit."
  id: "Memperluas gubahan ke ansambel kecil dan media elektronik, folio 15 menit."
  hi: "छोटे समूह और इलेक्ट्रॉनिक माध्यम तक रचना बढ़ाना, 15 मिनट का संग्रह।"
outcomes:
  - en: "Compose for small ensembles"
    zh: "为小型合奏作曲"
    zh-TW: "為小型合奏作曲"
    ja: "小編成アンサンブルのために作曲する"
    ko: "소규모 앙상블 작곡하기"
    vi: "Sáng tác cho nhóm nhạc nhỏ"
    ms: "Gubah untuk ensembel kecil"
    id: "Menggubah untuk ansambel kecil"
    hi: "छोटे समूहों के लिए रचना"
  - en: "Use electronic music tools with confidence"
    zh: "熟练使用电子音乐工具"
    zh-TW: "熟練使用電子音樂工具"
    ja: "電子音楽の機材を使いこなす"
    ko: "전자음악 도구 자신 있게 쓰기"
    vi: "Dùng tự tin công cụ nhạc điện tử"
    ms: "Guna alat muzik elektronik dengan yakin"
    id: "Memakai alat musik elektronik dengan yakin"
    hi: "इलेक्ट्रॉनिक संगीत उपकरण आराम से चलाना"
  - en: "Critique new music by others"
    zh: "评析他人的新音乐"
    zh-TW: "評析他人的新音樂"
    ja: "他者の新作を批評する"
    ko: "타인의 신작 음악 비평하기"
    vi: "Phê bình nhạc mới của người khác"
    ms: "Kritik muzik baharu orang lain"
    id: "Mengkritik musik baru karya orang lain"
    hi: "दूसरों के नए संगीत की समीक्षा"
