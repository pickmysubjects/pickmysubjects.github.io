code: AHIS30019
year: 2026
learn:
  en: "The capstone on how art history is done: its main methods since the early modern period and their use in museums and beyond."
  zh: "艺术史方法的毕业课：近代早期以来的主要研究方法，以及它们在博物馆等领域的应用。"
  zh-TW: "藝術史方法的畢業課：近代早期以來的主要研究方法，以及它們在博物館等領域的應用。"
  ja: "美術史の方法を学ぶ総まとめ科目。近世以降の主な方法論と、美術館などでの活かし方。"
  ko: "미술사 방법론 캡스톤. 근대 초기 이후의 주요 방법과 박물관 등에서의 활용을 배운다."
  vi: "Môn tổng kết về cách làm lịch sử nghệ thuật: các phương pháp chính từ đầu thời cận đại và ứng dụng trong bảo tàng và hơn thế."
  ms: "Kursus kemuncak tentang cara sejarah seni dijalankan: kaedah utamanya sejak awal moden dan penggunaannya di muzium dan lain-lain."
  id: "Mata kuliah puncak tentang cara sejarah seni dikerjakan: metode utamanya sejak awal modern dan penerapannya di museum dan lainnya."
  hi: "कला इतिहास कैसे किया जाता है, इस पर अंतिम कोर्स: आरंभिक आधुनिक काल से इसके मुख्य तरीके और संग्रहालयों व बाहर उनका उपयोग।"
outcomes:
  - en: "Explain the main methods of art history"
    zh: "说明艺术史的主要研究方法"
    zh-TW: "說明藝術史的主要研究方法"
    ja: "美術史の主な方法を説明する"
    ko: "미술사의 주요 방법 설명하기"
    vi: "Giải thích các phương pháp chính của lịch sử nghệ thuật"
    ms: "Terangkan kaedah utama sejarah seni"
    id: "Menjelaskan metode utama sejarah seni"
    hi: "कला इतिहास के मुख्य तरीके समझाना"
  - en: "Apply methods to real artworks"
    zh: "把方法用于真实的艺术品"
    zh-TW: "把方法用於真實的藝術品"
    ja: "方法を実際の作品に当てはめる"
    ko: "방법을 실제 작품에 적용하기"
    vi: "Áp dụng phương pháp vào tác phẩm thật"
    ms: "Gunakan kaedah pada karya seni sebenar"
    id: "Menerapkan metode pada karya seni nyata"
    hi: "असली कलाकृतियों पर तरीके लागू करना"
  - en: "Link art history to museum and industry work"
    zh: "把艺术史与博物馆和行业工作联系起来"
    zh-TW: "把藝術史與博物館和產業工作聯繫起來"
    ja: "美術史を美術館や業界の仕事と結びつける"
    ko: "미술사를 박물관·업계 일과 연결하기"
    vi: "Liên hệ lịch sử nghệ thuật với công việc bảo tàng và ngành"
    ms: "Kaitkan sejarah seni dengan kerja muzium dan industri"
    id: "Mengaitkan sejarah seni dengan kerja museum dan industri"
    hi: "कला इतिहास को संग्रहालय और उद्योग के काम से जोड़ना"
