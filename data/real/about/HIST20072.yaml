code: HIST20072
year: 2026
learn:
  en: "Piracy from the 1500s to 1700s in the Mediterranean and Atlantic: why people raided at sea, how states fought back, and pirates in film."
  zh: "16 至 18 世纪地中海与大西洋的海盗：人们为何海上劫掠、国家如何应对，以及影视中的海盗。"
  zh-TW: "16 至 18 世紀地中海與大西洋的海盜：人們為何海上劫掠、國家如何應對，以及影視中的海盜。"
  ja: "16〜18世紀の地中海と大西洋の海賊。なぜ海で略奪したのか、国家はどう対抗したか、映画の中の海賊。"
  ko: "16~18세기 지중해와 대서양의 해적. 사람들은 왜 바다에서 약탈했고 국가는 어떻게 맞섰는가, 영화 속 해적."
  vi: "Cướp biển thế kỷ 16–18 ở Địa Trung Hải và Đại Tây Dương: vì sao người ta cướp trên biển, nhà nước đối phó ra sao, và hải tặc trên phim."
  ms: "Lanun abad ke-16 hingga ke-18 di Mediterranean dan Atlantik: mengapa orang merompak di laut, cara negara melawan dan lanun dalam filem."
  id: "Bajak laut abad ke-16 hingga ke-18 di Mediterania dan Atlantik: mengapa orang merompak di laut, cara negara melawan, dan bajak laut di film."
  hi: "1500 से 1700 के दशक तक भूमध्य और अटलांटिक में समुद्री डकैती: लोग क्यों लूटते थे, राज्यों ने कैसे जवाब दिया, और फ़िल्मों में समुद्री डाकू।"
outcomes:
  - en: "Explain why sea raiding flourished"
    zh: "解释海上劫掠为何盛行"
    zh-TW: "解釋海上劫掠為何盛行"
    ja: "海上略奪が盛んになった理由を説明する"
    ko: "해상 약탈이 번성한 이유 설명하기"
    vi: "Giải thích vì sao cướp biển phát triển mạnh"
    ms: "Terangkan mengapa rompakan laut berkembang"
    id: "Menjelaskan mengapa perompakan laut berkembang"
    hi: "समझाना कि समुद्री लूट क्यों फली-फूली"
  - en: "Compare how states defined and fought piracy"
    zh: "比较各国如何界定和打击海盗"
    zh-TW: "比較各國如何界定和打擊海盜"
    ja: "国家が海賊をどう定義し取り締まったか比べる"
    ko: "국가들이 해적을 정의하고 단속한 방식 비교하기"
    vi: "So sánh cách các nhà nước định nghĩa và chống cướp biển"
    ms: "Bandingkan cara negara mentakrif dan memerangi lanun"
    id: "Membandingkan cara negara mendefinisikan dan melawan bajak laut"
    hi: "राज्यों ने डकैती को कैसे परिभाषित किया और रोका, तुलना करना"
  - en: "Separate pirate myth from history"
    zh: "区分海盗神话与历史真相"
    zh-TW: "區分海盜神話與歷史真相"
    ja: "海賊の神話と史実を見分ける"
    ko: "해적 신화와 역사 구분하기"
    vi: "Phân biệt huyền thoại cướp biển với lịch sử"
    ms: "Bezakan mitos lanun daripada sejarah"
    id: "Membedakan mitos bajak laut dari sejarah"
    hi: "समुद्री डाकुओं के मिथक और इतिहास को अलग करना"
