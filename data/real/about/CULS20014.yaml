code: CULS20014
year: 2026
learn:
  en: "What \"lifestyle\" means in consumer culture, and how media and advertising tie what we buy to who we are."
  zh: "\"生活方式\"在消费文化中的含义，以及媒体和广告如何把消费与身份联系在一起。"
  zh-TW: "「生活風格」在消費文化中的含義，以及媒體和廣告如何把消費與身分連結在一起。"
  ja: "消費文化で「ライフスタイル」が何を意味するか、メディアと広告が買い物と自分らしさをどう結びつけるかを学ぶ。"
  ko: "소비문화에서 '라이프스타일'이 뜻하는 바와, 미디어와 광고가 소비를 정체성과 어떻게 엮는지 배운다."
  vi: "\"Lối sống\" nghĩa là gì trong văn hóa tiêu dùng, và truyền thông, quảng cáo gắn thứ ta mua với con người ta ra sao."
  ms: "Maksud \"gaya hidup\" dalam budaya pengguna, dan cara media serta iklan mengaitkan apa yang kita beli dengan siapa kita."
  id: "Arti \"gaya hidup\" dalam budaya konsumen, dan cara media serta iklan mengaitkan apa yang kita beli dengan siapa kita."
  hi: "उपभोक्ता संस्कृति में \"लाइफ़स्टाइल\" का क्या मतलब है, और मीडिया व विज्ञापन हमारी ख़रीद को हमारी पहचान से कैसे जोड़ते हैं।"
outcomes:
  - en: "Explain how the idea of lifestyle developed"
    zh: "说明生活方式概念的发展"
    zh-TW: "說明生活風格概念的發展"
    ja: "ライフスタイルという考えの成り立ちを説明する"
    ko: "라이프스타일 개념의 발전 설명하기"
    vi: "Giải thích khái niệm lối sống đã phát triển ra sao"
    ms: "Terangkan perkembangan idea gaya hidup"
    id: "Menjelaskan perkembangan gagasan gaya hidup"
    hi: "लाइफ़स्टाइल का विचार कैसे विकसित हुआ, समझाना"
  - en: "Analyse lifestyle media and advertising"
    zh: "分析生活方式媒体和广告"
    zh-TW: "分析生活風格媒體和廣告"
    ja: "ライフスタイル系メディアと広告を分析する"
    ko: "라이프스타일 미디어와 광고 분석하기"
    vi: "Phân tích truyền thông và quảng cáo về lối sống"
    ms: "Analisis media dan iklan gaya hidup"
    id: "Menganalisis media dan iklan gaya hidup"
    hi: "लाइफ़स्टाइल मीडिया और विज्ञापन का विश्लेषण करना"
  - en: "Link consumption to taste and identity"
    zh: "把消费与品味和身份联系起来"
    zh-TW: "把消費與品味和身分連結起來"
    ja: "消費を好みやアイデンティティと結びつける"
    ko: "소비를 취향·정체성과 연결하기"
    vi: "Liên hệ tiêu dùng với thị hiếu và bản sắc"
    ms: "Kaitkan penggunaan dengan citarasa dan identiti"
    id: "Mengaitkan konsumsi dengan selera dan identitas"
    hi: "उपभोग को रुचि और पहचान से जोड़ना"
