code: ASIA30003
year: 2026
learn:
  en: "Asian religions from folk traditions to world faiths, their view of life, their role in society and politics, and their spread."
  zh: "从民间信仰到世界性宗教的亚洲宗教，它们的人生观、在社会政治中的角色和传播。"
  zh-TW: "從民間信仰到世界性宗教的亞洲宗教，它們的人生觀、在社會政治中的角色和傳播。"
  ja: "民間信仰から世界宗教まで、アジアの宗教の人生観、社会と政治での役割、広がりを学ぶ。"
  ko: "민간 신앙부터 세계 종교까지 아시아 종교의 인생관, 사회·정치적 역할, 전파를 배운다."
  vi: "Các tôn giáo châu Á từ tín ngưỡng dân gian đến tôn giáo lớn, nhân sinh quan, vai trò xã hội, chính trị và sự lan tỏa."
  ms: "Agama Asia daripada tradisi rakyat hingga agama dunia, pandangan hidupnya, peranannya dalam masyarakat dan politik, serta penyebarannya."
  id: "Agama Asia dari tradisi rakyat hingga agama dunia, pandangan hidupnya, perannya dalam masyarakat dan politik, serta penyebarannya."
  hi: "लोक परंपराओं से विश्व धर्मों तक एशियाई धर्म, उनका जीवन-दर्शन, समाज व राजनीति में भूमिका और प्रसार।"
outcomes:
  - en: "Describe the main Asian religious traditions"
    zh: "描述亚洲主要宗教传统"
    zh-TW: "描述亞洲主要宗教傳統"
    ja: "アジアの主な宗教伝統を説明する"
    ko: "아시아의 주요 종교 전통 설명하기"
    vi: "Mô tả các truyền thống tôn giáo chính ở châu Á"
    ms: "Huraikan tradisi agama utama Asia"
    id: "Mendeskripsikan tradisi agama utama Asia"
    hi: "प्रमुख एशियाई धार्मिक परंपराओं का वर्णन करना"
  - en: "Explain religion's role in society and politics"
    zh: "解释宗教在社会和政治中的作用"
    zh-TW: "解釋宗教在社會和政治中的作用"
    ja: "社会と政治における宗教の役割を説明する"
    ko: "사회와 정치에서 종교의 역할 설명하기"
    vi: "Giải thích vai trò của tôn giáo trong xã hội và chính trị"
    ms: "Terangkan peranan agama dalam masyarakat dan politik"
    id: "Menjelaskan peran agama dalam masyarakat dan politik"
    hi: "समाज और राजनीति में धर्म की भूमिका समझाना"
  - en: "Discuss how religions interact across regions"
    zh: "讨论宗教在不同地区之间如何互动"
    zh-TW: "討論宗教在不同地區之間如何互動"
    ja: "地域を越えた宗教の交流を論じる"
    ko: "지역 간 종교의 상호작용 논의하기"
    vi: "Thảo luận các tôn giáo tương tác giữa các vùng ra sao"
    ms: "Bincangkan interaksi agama merentas wilayah"
    id: "Membahas interaksi agama antarwilayah"
    hi: "क्षेत्रों के बीच धर्मों की परस्पर क्रिया पर चर्चा करना"
