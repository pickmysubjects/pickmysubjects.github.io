code: ISYS90069
year: 2027
learn:
  en: "Why and how healthcare is going digital: health data, information systems, and the chances and hurdles involved."
  zh: "医疗为何及如何数字化：健康数据、信息系统，以及其中的机会与挑战。"
  zh-TW: "醫療為何及如何數位化：健康資料、資訊系統，以及其中的機會與挑戰。"
  ja: "医療のデジタル化の理由と方法：健康データ、情報システム、機会と課題。"
  ko: "의료 디지털 전환의 이유와 방법: 건강 데이터, 정보 시스템, 기회와 과제."
  vi: "Vì sao và cách y tế chuyển đổi số: dữ liệu sức khỏe, hệ thống thông tin, cơ hội và trở ngại."
  ms: "Mengapa dan bagaimana penjagaan kesihatan menjadi digital: data kesihatan, sistem maklumat, peluang dan halangan."
  id: "Mengapa dan bagaimana layanan kesehatan menjadi digital: data kesehatan, sistem informasi, peluang dan hambatan."
  hi: "स्वास्थ्य सेवा डिजिटल क्यों और कैसे हो रही है: हेल्थ डेटा, सूचना प्रणाली, अवसर और बाधाएँ।"
outcomes:
  - en: "Explain how health data flows between systems"
    zh: "解释健康数据如何在系统间流动"
    zh-TW: "解釋健康資料如何在系統間流動"
    ja: "健康データがシステム間をどう流れるか説明する"
    ko: "건강 데이터가 시스템 간 어떻게 흐르는지 설명하기"
    vi: "Giải thích dữ liệu sức khỏe di chuyển giữa các hệ thống"
    ms: "Menerangkan aliran data kesihatan antara sistem"
    id: "Menjelaskan aliran data kesehatan antarsistem"
    hi: "हेल्थ डेटा सिस्टम्स के बीच कैसे चलता है, समझाना"
  - en: "Discuss how digital tools can make care safer and cheaper"
    zh: "讨论数字工具如何让医疗更安全、更便宜"
    zh-TW: "討論數位工具如何讓醫療更安全、更便宜"
    ja: "デジタル技術で医療を安全・安価にする方法を論じる"
    ko: "디지털 도구로 의료를 더 안전하고 저렴하게 하는 방법 논하기"
    vi: "Bàn cách công cụ số giúp chăm sóc an toàn và rẻ hơn"
    ms: "Membincangkan cara alat digital menjadikan rawatan lebih selamat dan murah"
    id: "Membahas cara alat digital membuat layanan lebih aman dan murah"
    hi: "डिजिटल टूल इलाज को सुरक्षित और सस्ता कैसे बनाते हैं, चर्चा करना"
