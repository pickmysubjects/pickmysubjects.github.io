code: MUSI30258
year: 2026
learn:
  en: "A second semester in the auditioned chamber choir, with new repertoire and work alongside instrumentalists. Pass/fail."
  zh: "需试音的室内合唱团第二学期，新曲目，并与器乐演奏者合作。及格制。"
  zh-TW: "需試音的室內合唱團第二學期，新曲目，並與器樂演奏者合作。及格制。"
  ja: "室内合唱の後期。新しい曲目と器楽奏者との共演。合否判定。"
  ko: "실내합창단 2학기. 새 레퍼토리, 기악 연주자와 협연. 합격/불합격."
  vi: "Học kỳ hai dàn hợp xướng thính phòng, tiết mục mới, diễn cùng nhạc công. Đạt/không đạt."
  ms: "Semester kedua koir kamar, repertoir baharu bersama pemain alat. Lulus/gagal."
  id: "Semester kedua paduan suara kamar, repertoar baru bersama instrumentalis. Lulus/gagal."
  hi: "चैम्बर कोरस का दूसरा सत्र, नई रचनाएँ और वादकों के साथ काम। पास/फ़ेल।"
outcomes:
  - en: "Refine blend and diction in a chamber choir"
    zh: "在室内合唱中打磨融合与咬字"
    zh-TW: "在室內合唱中打磨融合與咬字"
    ja: "室内合唱で響きと発音を磨く"
    ko: "실내합창에서 어울림과 딕션 다듬기"
    vi: "Trau chuốt độ hòa và phát âm trong dàn"
    ms: "Halusi keselarasan dan diksi dalam koir"
    id: "Menyempurnakan paduan dan diksi"
    hi: "चैम्बर कोरस में मेल और उच्चारण निखारना"
  - en: "Sing with instrumentalists as well as a cappella"
    zh: "既能无伴奏也能与器乐合作演唱"
    zh-TW: "既能無伴奏也能與器樂合作演唱"
    ja: "無伴奏でも器楽と共にでも歌う"
    ko: "무반주와 기악 반주 모두로 노래하기"
    vi: "Hát không đệm lẫn cùng nhạc cụ"
    ms: "Menyanyi tanpa iringan dan bersama alat muzik"
    id: "Bernyanyi tanpa iringan maupun bersama instrumen"
    hi: "बिना संगत और वादकों के साथ दोनों तरह गाना"
  - en: "Place each work in its historical style"
    zh: "把每部作品放回其历史风格中"
    zh-TW: "把每部作品放回其歷史風格中"
    ja: "各曲をその時代の様式で捉える"
    ko: "각 작품을 역사적 양식 속에서 이해하기"
    vi: "Đặt mỗi tác phẩm vào phong cách lịch sử"
    ms: "Letak setiap karya dalam gaya sejarahnya"
    id: "Menempatkan karya dalam gaya historisnya"
    hi: "हर रचना को उसकी ऐतिहासिक शैली में समझना"
