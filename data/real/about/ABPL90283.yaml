code: ABPL90283
year: 2027
learn:
  en: "Basic ecology for landscape design: plants, biomes, soils, water, resilience and how designs perform ecologically, with field reports."
  zh: "景观设计的基础生态学：植物、生物群落、土壤、水、韧性和设计的生态表现，含野外报告。"
  zh-TW: "景觀設計的基礎生態學：植物、生物群系、土壤、水、韌性與設計的生態表現，含野外報告。"
  ja: "景観設計のための生態学基礎：植物、バイオーム、土壌、水、レジリエンス。現地レポートあり。"
  ko: "조경 설계를 위한 기초 생태학: 식물, 생물군계, 토양, 물, 회복력. 현장 보고서."
  vi: "Sinh thái cơ bản cho thiết kế cảnh quan: thực vật, quần xã, đất, nước, khả năng phục hồi, báo cáo thực địa."
  ms: "Ekologi asas untuk reka bentuk landskap: tumbuhan, biom, tanah, air dan laporan lapangan."
  id: "Ekologi dasar untuk desain lanskap: tumbuhan, bioma, tanah, air dan laporan lapangan."
  hi: "लैंडस्केप डिज़ाइन के लिए बुनियादी पारिस्थितिकी: पौधे, बायोम, मिट्टी, पानी, फ़ील्ड रिपोर्ट।"
outcomes:
  - en: "Read landscapes as living ecological systems"
    zh: "把景观理解为活的生态系统"
    zh-TW: "把景觀理解為活的生態系統"
    ja: "景観を生きた生態系として読む"
    ko: "경관을 살아 있는 생태계로 읽기"
    vi: "Hiểu cảnh quan như hệ sinh thái sống"
    ms: "Membaca landskap sebagai sistem ekologi hidup"
    id: "Membaca lanskap sebagai sistem ekologi hidup"
    hi: "लैंडस्केप को जीवित पारिस्थितिक तंत्र के रूप में समझना"
  - en: "Link environmental factors to ecological processes"
    zh: "把环境因素与生态过程联系起来"
    zh-TW: "把環境因子與生態過程連結"
    ja: "環境要因と生態過程を結びつける"
    ko: "환경 요인과 생태 과정 연결하기"
    vi: "Liên hệ yếu tố môi trường với quá trình sinh thái"
    ms: "Mengaitkan faktor alam sekitar dengan proses ekologi"
    id: "Mengaitkan faktor lingkungan dengan proses ekologi"
    hi: "पर्यावरणीय कारकों को पारिस्थितिक प्रक्रियाओं से जोड़ना"
