code: GEOG90019
year: 2027
learn:
  en: "How Indigenous people manage land in Australia and abroad, taught as a 14-day field intensive in Victoria and the NT."
  zh: "澳大利亚及海外原住民如何管理土地，以在维州和北领地为期14天的野外集中课形式授课。"
  zh-TW: "澳洲及海外原住民如何管理土地，以在維州與北領地為期14天的野外密集課形式授課。"
  ja: "オーストラリア内外の先住民の土地管理を、ビクトリア州と北部準州での14日間の野外集中講義で学ぶ。"
  ko: "호주와 해외 원주민의 토지 관리를 빅토리아주와 노던준주 14일 현장 집중 수업으로 배웁니다."
  vi: "Cách người bản địa quản lý đất ở Úc và nơi khác, học tập trung 14 ngày thực địa ở Victoria và NT."
  ms: "Cara Orang Asli mengurus tanah di Australia dan luar negara, kursus intensif lapangan 14 hari."
  id: "Cara masyarakat Pribumi mengelola lahan di Australia dan luar negeri, lewat kuliah lapangan intensif 14 hari."
  hi: "ऑस्ट्रेलिया व विदेश में स्वदेशी लोग भूमि कैसे संभालते हैं, विक्टोरिया व NT में 14 दिन का फ़ील्ड कोर्स।"
outcomes:
  - en: "Explain how traditional knowledge guides land care"
    zh: "解释传统知识如何指导土地管理"
    zh-TW: "解釋傳統知識如何引導土地管理"
    ja: "伝統知が土地管理をどう導くか説明する"
    ko: "전통 지식이 토지 관리를 이끄는 방식 설명하기"
    vi: "Giải thích tri thức truyền thống dẫn dắt quản lý đất"
    ms: "Menerangkan peranan ilmu tradisional dalam pengurusan tanah"
    id: "Menjelaskan peran pengetahuan tradisional"
    hi: "पारंपरिक ज्ञान भूमि प्रबंधन को कैसे दिशा देता है"
  - en: "Compare land management across regions"
    zh: "比较不同地区的土地管理"
    zh-TW: "比較不同地區的土地管理"
    ja: "地域ごとの土地管理を比べる"
    ko: "지역별 토지 관리 비교하기"
    vi: "So sánh quản lý đất giữa các vùng"
    ms: "Membandingkan pengurusan tanah antara wilayah"
    id: "Membandingkan pengelolaan lahan antarwilayah"
    hi: "क्षेत्रों के बीच भूमि प्रबंधन की तुलना"
