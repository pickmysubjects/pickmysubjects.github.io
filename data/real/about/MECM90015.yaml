code: MECM90015
year: 2027
learn:
  en: "Critical views of digital platforms and their social, political and economic impact, with a research project on one platform feature."
  zh: "批判性审视数字平台及其社会、政治和经济影响，并就某一平台功能做研究项目。"
  zh-TW: "批判性檢視數位平台及其社會、政治與經濟影響，並就某一平台功能做研究專案。"
  ja: "デジタルプラットフォームとその社会・政治・経済的影響を批判的に考え、特定機能を研究する。"
  ko: "디지털 플랫폼과 그 사회·정치·경제적 영향을 비판적으로 보고, 한 기능을 연구."
  vi: "Nhìn nhận phản biện về nền tảng số và tác động xã hội, chính trị, kinh tế, kèm dự án nghiên cứu một tính năng."
  ms: "Pandangan kritis tentang platform digital dan kesan sosial, politik serta ekonominya, dengan projek kajian satu ciri platform."
  id: "Pandangan kritis atas platform digital dan dampak sosial, politik, serta ekonominya, dengan proyek riset satu fitur platform."
  hi: "डिजिटल प्लेटफ़ॉर्म और उनके सामाजिक, राजनीतिक व आर्थिक प्रभाव पर आलोचनात्मक नज़र, एक फ़ीचर पर शोध परियोजना।"
outcomes:
  - en: "Research digital platforms alone and in groups"
    zh: "独立及分组研究数字平台"
    zh-TW: "獨立及分組研究數位平台"
    ja: "個人とグループでデジタルプラットフォームを調べる"
    ko: "개인·그룹으로 디지털 플랫폼 연구하기"
    vi: "Nghiên cứu nền tảng số cá nhân và theo nhóm"
    ms: "Mengkaji platform digital secara individu dan berkumpulan"
    id: "Meneliti platform digital secara mandiri dan berkelompok"
    hi: "अकेले और समूह में डिजिटल प्लेटफ़ॉर्म पर शोध"
  - en: "Discuss the social, political and economic effects of platforms"
    zh: "讨论平台的社会、政治和经济影响"
    zh-TW: "討論平台的社會、政治與經濟影響"
    ja: "プラットフォームの社会・政治・経済的影響を論じる"
    ko: "플랫폼의 사회·정치·경제적 영향 논의하기"
    vi: "Thảo luận tác động xã hội, chính trị, kinh tế của nền tảng"
    ms: "Membincangkan kesan sosial, politik dan ekonomi platform"
    id: "Membahas dampak sosial, politik, dan ekonomi platform"
    hi: "प्लेटफ़ॉर्म के सामाजिक, राजनीतिक व आर्थिक प्रभाव पर चर्चा"
