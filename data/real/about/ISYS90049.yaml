code: ISYS90049
year: 2027
learn:
  en: "Business analysis for digital solutions: eliciting requirements, modelling processes and designing and judging IS solutions."
  zh: "面向数字化方案的业务分析：需求获取、流程建模，以及信息系统方案的设计与评估。"
  zh-TW: "面向數位方案的業務分析：需求擷取、流程建模，以及資訊系統方案的設計與評估。"
  ja: "デジタルソリューションのための業務分析：要件の聞き取り、プロセスのモデル化、ISの設計と評価。"
  ko: "디지털 솔루션을 위한 비즈니스 분석: 요구사항 도출, 프로세스 모델링, IS 설계와 평가."
  vi: "Phân tích nghiệp vụ cho giải pháp số: thu thập yêu cầu, mô hình hóa quy trình, thiết kế và đánh giá giải pháp IS."
  ms: "Analisis perniagaan untuk penyelesaian digital: mendapatkan keperluan, memodelkan proses, mereka dan menilai IS."
  id: "Analisis bisnis untuk solusi digital: menggali kebutuhan, memodelkan proses, merancang dan menilai solusi SI."
  hi: "डिजिटल समाधानों के लिए बिज़नेस एनालिसिस: ज़रूरतें निकालना, प्रक्रिया मॉडल बनाना, IS समाधान डिज़ाइन व परखना।"
outcomes:
  - en: "Elicit requirements from stakeholders"
    zh: "从利益相关方处获取需求"
    zh-TW: "從利害關係人處擷取需求"
    ja: "関係者から要件を引き出す"
    ko: "이해관계자에게서 요구사항 도출하기"
    vi: "Thu thập yêu cầu từ các bên liên quan"
    ms: "Mendapatkan keperluan daripada pihak berkepentingan"
    id: "Menggali kebutuhan dari para pemangku kepentingan"
    hi: "हितधारकों से ज़रूरतें निकालना"
  - en: "Judge digital solutions on cost, social and environmental impact"
    zh: "从成本、社会和环境影响评估数字化方案"
    zh-TW: "從成本、社會與環境影響評估數位方案"
    ja: "コスト・社会・環境への影響でデジタル策を評価する"
    ko: "비용·사회·환경 영향으로 디지털 솔루션 평가하기"
    vi: "Đánh giá giải pháp số theo chi phí, tác động xã hội và môi trường"
    ms: "Menilai penyelesaian digital dari segi kos, kesan sosial dan alam sekitar"
    id: "Menilai solusi digital dari sisi biaya, dampak sosial, dan lingkungan"
    hi: "डिजिटल समाधानों को लागत, सामाजिक और पर्यावरणीय असर पर परखना"
