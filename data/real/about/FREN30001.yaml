code: FREN30001
year: 2026
learn:
  en: "French for students who finished French 6: how French varies across places, history and genres."
  zh: "适合学完法语 6 的学生：法语在不同地区、历史和文体中的差异。"
  zh-TW: "適合學完法語 6 的學生：法語在不同地區、歷史和文體中的差異。"
  ja: "フランス語6を終えた学生向け。地域・歴史・ジャンルによるフランス語の違い。"
  ko: "프랑스어 6을 마친 학생 대상. 지역·역사·장르에 따른 프랑스어의 다양성."
  vi: "Tiếng Pháp cho sinh viên đã học xong French 6: sự khác nhau của tiếng Pháp theo vùng, lịch sử và thể loại."
  ms: "Bahasa Perancis untuk pelajar yang sudah tamat French 6: kepelbagaian bahasa Perancis mengikut tempat dan genre."
  id: "Bahasa Prancis untuk mahasiswa yang sudah lulus French 6: ragam bahasa Prancis menurut tempat dan genre."
  hi: "फ़्रेंच 6 पूरा कर चुके छात्रों के लिए: जगह, इतिहास और विधा के साथ फ़्रेंच कैसे बदलती है।"
outcomes:
  - en: "Discuss social and cultural topics in French"
    zh: "用法语讨论社会和文化话题"
    zh-TW: "用法語討論社會和文化話題"
    ja: "社会や文化の話題をフランス語で話し合う"
    ko: "사회·문화 주제를 프랑스어로 토론하기"
    vi: "Thảo luận chủ đề xã hội, văn hóa bằng tiếng Pháp"
    ms: "Bincangkan topik sosial dan budaya dalam bahasa Perancis"
    id: "Membahas topik sosial dan budaya dalam bahasa Prancis"
    hi: "सामाजिक और सांस्कृतिक विषयों पर फ़्रेंच में चर्चा करना"
  - en: "Read and write longer French texts"
    zh: "读写较长的法语文章"
    zh-TW: "讀寫較長的法語文章"
    ja: "長めのフランス語の文章を読み書きする"
    ko: "긴 프랑스어 글 읽고 쓰기"
    vi: "Đọc và viết văn bản tiếng Pháp dài hơn"
    ms: "Baca dan tulis teks bahasa Perancis yang lebih panjang"
    id: "Membaca dan menulis teks bahasa Prancis yang lebih panjang"
    hi: "लंबे फ़्रेंच पाठ पढ़ना-लिखना"
  - en: "Give a clear presentation in French"
    zh: "用法语做清楚的口头报告"
    zh-TW: "用法語做清楚的口頭報告"
    ja: "フランス語で分かりやすく発表する"
    ko: "프랑스어로 명확하게 발표하기"
    vi: "Thuyết trình rõ ràng bằng tiếng Pháp"
    ms: "Buat pembentangan yang jelas dalam bahasa Perancis"
    id: "Melakukan presentasi yang jelas dalam bahasa Prancis"
    hi: "फ़्रेंच में स्पष्ट प्रस्तुति देना"
