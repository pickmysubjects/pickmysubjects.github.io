code: FNCE90094
year: 2027
learn:
  en: "A semester-long academic research project building on FNCE90081: theory, empirical work and a research essay."
  zh: "在 FNCE90081 基础上完成一学期学术研究：理论框架、实证分析和研究论文。"
  zh-TW: "在 FNCE90081 基礎上完成一學期學術研究：理論框架、實證分析與研究論文。"
  ja: "FNCE90081 を発展させた1学期の学術研究：理論、実証、研究論文。"
  ko: "FNCE90081을 잇는 한 학기 학술 연구: 이론, 실증 분석, 연구 논문."
  vi: "Dự án nghiên cứu học thuật một học kỳ tiếp nối FNCE90081: lý thuyết, thực nghiệm và bài luận."
  ms: "Projek penyelidikan akademik satu semester lanjutan FNCE90081: teori, kerja empirikal dan esei."
  id: "Proyek riset akademik satu semester lanjutan FNCE90081: teori, kajian empiris dan esai riset."
  hi: "FNCE90081 पर आधारित एक सेमेस्टर का अकादमिक शोध: सिद्धांत, अनुभवजन्य काम और शोध निबंध।"
outcomes:
  - en: "Apply research methods to a finance question"
    zh: "用研究方法探讨金融问题"
    zh-TW: "用研究方法探討金融問題"
    ja: "金融の問いに研究手法を適用する"
    ko: "금융 질문에 연구방법 적용하기"
    vi: "Áp dụng phương pháp nghiên cứu cho câu hỏi tài chính"
    ms: "Mengaplikasi kaedah penyelidikan pada soalan kewangan"
    id: "Menerapkan metode riset pada pertanyaan keuangan"
    hi: "वित्त प्रश्न पर शोध विधियां लागू करना"
  - en: "Write a well-structured finance research essay"
    zh: "撰写结构清晰的金融研究论文"
    zh-TW: "撰寫結構清晰的金融研究論文"
    ja: "構成の整った金融研究論文を書く"
    ko: "구조가 잘 잡힌 금융 연구 논문 쓰기"
    vi: "Viết bài luận nghiên cứu tài chính chặt chẽ"
    ms: "Menulis esei penyelidikan kewangan yang tersusun"
    id: "Menulis esai riset keuangan yang terstruktur"
    hi: "सुव्यवस्थित वित्त शोध निबंध लिखना"
