code: IBUS90008
year: 2027
learn:
  en: "How global value chains form, are governed and managed, their risks, sustainability challenges and future."
  zh: "全球价值链如何形成、治理和管理，以及其风险、可持续挑战和未来。"
  zh-TW: "全球價值鏈如何形成、治理與管理，以及其風險、永續挑戰與未來。"
  ja: "グローバル・バリューチェーンの形成、統治と管理、リスク、持続可能性の課題、今後。"
  ko: "글로벌 가치사슬의 형성, 거버넌스와 관리, 위험, 지속가능성 과제와 미래."
  vi: "Chuỗi giá trị toàn cầu hình thành, được quản trị và quản lý ra sao, rủi ro, thách thức bền vững và tương lai."
  ms: "Cara rantaian nilai global terbentuk, ditadbir dan diurus, risiko, cabaran kelestarian dan masa depannya."
  id: "Cara rantai nilai global terbentuk, diatur, dan dikelola, beserta risiko, tantangan keberlanjutan, dan masa depannya."
  hi: "वैश्विक मूल्य शृंखलाएँ कैसे बनती और संचालित होती हैं, उनके जोखिम, स्थिरता चुनौतियाँ और भविष्य।"
outcomes:
  - en: "Explain how global value chains work"
    zh: "解释全球价值链如何运作"
    zh-TW: "解釋全球價值鏈如何運作"
    ja: "グローバル・バリューチェーンの仕組みを説明する"
    ko: "글로벌 가치사슬의 작동 방식 설명하기"
    vi: "Giải thích chuỗi giá trị toàn cầu vận hành ra sao"
    ms: "Menerangkan cara rantaian nilai global berfungsi"
    id: "Menjelaskan cara kerja rantai nilai global"
    hi: "वैश्विक मूल्य शृंखलाएँ कैसे काम करती हैं, समझाना"
  - en: "Propose strategies to manage value chain risks"
    zh: "提出管理价值链风险的策略"
    zh-TW: "提出管理價值鏈風險的策略"
    ja: "バリューチェーンのリスク管理策を提案する"
    ko: "가치사슬 위험 관리 전략 제안하기"
    vi: "Đề xuất chiến lược quản lý rủi ro chuỗi giá trị"
    ms: "Mencadangkan strategi mengurus risiko rantaian nilai"
    id: "Mengusulkan strategi mengelola risiko rantai nilai"
    hi: "मूल्य शृंखला जोखिम प्रबंधन की रणनीतियाँ सुझाना"
