code: ABPL90135
year: 2027
learn:
  en: "Designing urban research with qualitative and quantitative methods, and judging the limits of data sources."
  zh: "用定性和定量方法设计城市研究，并判断数据来源的局限。"
  zh-TW: "用質性與量化方法設計都市研究，並判斷資料來源的侷限。"
  ja: "質的・量的手法で都市研究を設計し、データの限界を見極める。"
  ko: "질적·양적 방법으로 도시 연구 설계와 데이터 한계 판단."
  vi: "Thiết kế nghiên cứu đô thị bằng phương pháp định tính, định lượng và đánh giá dữ liệu."
  ms: "Mereka bentuk penyelidikan bandar dengan kaedah kualitatif dan kuantitatif."
  id: "Merancang riset kota dengan metode kualitatif dan kuantitatif."
  hi: "गुणात्मक और मात्रात्मक विधियों से शहरी शोध डिज़ाइन करना और डेटा की सीमाएँ परखना।"
outcomes:
  - en: "Write a research proposal on an urban issue"
    zh: "就城市问题撰写研究计划"
    zh-TW: "就都市議題撰寫研究計畫"
    ja: "都市問題の研究計画書を書く"
    ko: "도시 문제 연구계획서 쓰기"
    vi: "Viết đề cương nghiên cứu về vấn đề đô thị"
    ms: "Menulis cadangan penyelidikan isu bandar"
    id: "Menulis proposal riset isu perkotaan"
    hi: "शहरी मुद्दे पर शोध प्रस्ताव लिखना"
  - en: "Choose suitable qualitative or quantitative methods"
    zh: "选择合适的定性或定量方法"
    zh-TW: "選擇合適的質性或量化方法"
    ja: "適切な質的・量的手法を選ぶ"
    ko: "알맞은 질적·양적 방법 고르기"
    vi: "Chọn phương pháp định tính hay định lượng"
    ms: "Memilih kaedah kualitatif atau kuantitatif"
    id: "Memilih metode kualitatif atau kuantitatif"
    hi: "उपयुक्त गुणात्मक या मात्रात्मक विधि चुनना"
