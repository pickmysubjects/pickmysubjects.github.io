code: GEND30007
year: 2026
learn:
  en: "The field of trans studies: what 'trans' means, how it has reshaped thinking on gender, and issues of recognition and visibility."
  zh: "跨性别研究领域：“跨”意味着什么，它如何改变性别思考，以及承认与可见性问题。"
  zh-TW: "跨性別研究領域：「跨」意味著什麼，它如何改變性別思考，以及承認與可見性問題。"
  ja: "トランス研究の分野。「トランス」の意味、ジェンダー観をどう変えたか、承認と可視性の問題を学ぶ。"
  ko: "트랜스 연구 분야: ‘트랜스’의 의미, 젠더 사고를 어떻게 바꿨는지, 인정과 가시성 문제를 배운다."
  vi: "Lĩnh vực nghiên cứu người chuyển giới: “trans” nghĩa là gì, nó thay đổi tư duy về giới ra sao, và vấn đề công nhận, hiện diện."
  ms: "Bidang kajian trans: maksud 'trans', cara ia mengubah pemikiran tentang gender, serta isu pengiktirafan dan keterlihatan."
  id: "Bidang studi trans: arti 'trans', bagaimana ia mengubah pemikiran soal gender, serta isu pengakuan dan visibilitas."
  hi: "ट्रांस स्टडीज़ का क्षेत्र: ‘ट्रांस’ का अर्थ, इसने जेंडर की सोच को कैसे बदला, और मान्यता व दृश्यता के मुद्दे।"
outcomes:
  - en: "Explain how trans studies emerged as a field"
    zh: "解释跨性别研究如何形成为一个领域"
    zh-TW: "解釋跨性別研究如何形成為一個領域"
    ja: "トランス研究が分野として生まれた経緯を説明する"
    ko: "트랜스 연구가 분야로 등장한 과정 설명하기"
    vi: "Giải thích nghiên cứu trans hình thành như một lĩnh vực"
    ms: "Terangkan bagaimana kajian trans muncul sebagai bidang"
    id: "Menjelaskan munculnya studi trans sebagai bidang"
    hi: "ट्रांस स्टडीज़ एक क्षेत्र के रूप में कैसे उभरी, समझाना"
  - en: "Analyse representation and recognition issues"
    zh: "分析再现与承认的问题"
    zh-TW: "分析再現與承認的問題"
    ja: "表象と承認の問題を分析する"
    ko: "재현과 인정 문제 분석하기"
    vi: "Phân tích các vấn đề về hình ảnh đại diện và công nhận"
    ms: "Analisis isu representasi dan pengiktirafan"
    id: "Menganalisis isu representasi dan pengakuan"
    hi: "प्रतिनिधित्व और मान्यता के मुद्दों का विश्लेषण करना"
  - en: "Discuss how gender is regulated by institutions"
    zh: "讨论机构如何规管性别"
    zh-TW: "討論機構如何規管性別"
    ja: "制度がジェンダーをどう規制するか論じる"
    ko: "제도가 젠더를 규제하는 방식 논의하기"
    vi: "Thảo luận cách các thể chế kiểm soát giới"
    ms: "Bincangkan cara institusi mengawal gender"
    id: "Membahas cara lembaga mengatur gender"
    hi: "संस्थाएँ जेंडर को कैसे नियंत्रित करती हैं, चर्चा करना"
