code: EDUC10060
year: 2027
learn:
  en: "An introduction to Aboriginal and Torres Strait Islander education, past and present, compared with other countries."
  zh: "原住民与托雷斯海峡岛民教育入门：过去与现在，并与其他国家比较。"
  zh-TW: "原住民與托雷斯海峽島民教育入門：過去與現在，並與其他國家比較。"
  ja: "アボリジニとトレス海峡諸島民の教育入門：過去と現在、他国との比較。"
  ko: "애버리지니 및 토레스 해협 섬 주민 교육 입문: 과거와 현재, 다른 나라와의 비교."
  vi: "Nhập môn giáo dục người Thổ dân và người dân đảo eo biển Torres, xưa và nay, so sánh với các nước khác."
  ms: "Pengenalan pendidikan Orang Asli Aborigin dan Kepulauan Selat Torres, dahulu dan kini, berbanding negara lain."
  id: "Pengantar pendidikan Aborigin dan Kepulauan Selat Torres, dulu dan kini, dibandingkan dengan negara lain."
  hi: "एबोरिजिनल और टोरेस स्ट्रेट आइलैंडर शिक्षा का परिचय, अतीत और वर्तमान, दूसरे देशों से तुलना के साथ।"
outcomes:
  - en: "Analyse past and present views on Indigenous education"
    zh: "分析历来对原住民教育的看法"
    zh-TW: "分析歷來對原住民教育的看法"
    ja: "先住民教育に関する過去と現在の見方を分析する"
    ko: "원주민 교육에 대한 과거와 현재의 관점 분석하기"
    vi: "Phân tích quan điểm xưa và nay về giáo dục bản địa"
    ms: "Analisis pandangan lampau dan kini tentang pendidikan Orang Asli"
    id: "Menganalisis pandangan dulu dan kini tentang pendidikan Pribumi"
    hi: "आदिवासी शिक्षा पर पुराने और नए विचारों का विश्लेषण करना"
  - en: "Compare with Indigenous education in other countries"
    zh: "与其他国家的原住民教育作比较"
    zh-TW: "與其他國家的原住民教育作比較"
    ja: "他国の先住民教育と比較する"
    ko: "다른 나라의 원주민 교육과 비교하기"
    vi: "So sánh với giáo dục bản địa ở các nước khác"
    ms: "Bandingkan dengan pendidikan Orang Asli di negara lain"
    id: "Membandingkan dengan pendidikan Pribumi di negara lain"
    hi: "दूसरे देशों की आदिवासी शिक्षा से तुलना करना"
  - en: "Link colonisation to today's education practice"
    zh: "理解殖民与当今教育实践的关系"
    zh-TW: "理解殖民與當今教育實踐的關係"
    ja: "植民地化と現在の教育実践の関係を理解する"
    ko: "식민화와 오늘날 교육 실천의 관계 이해하기"
    vi: "Hiểu mối liên hệ giữa thực dân hóa và giáo dục ngày nay"
    ms: "Kaitkan penjajahan dengan amalan pendidikan masa kini"
    id: "Mengaitkan kolonisasi dengan praktik pendidikan kini"
    hi: "उपनिवेशवाद और आज की शिक्षा का संबंध समझना"
