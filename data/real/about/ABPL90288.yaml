code: ABPL90288
year: 2027
learn:
  en: "How 20th-century architecture shaped and reflected politics and society, from colonial cities to modernism."
  zh: "20 世纪建筑如何塑造并反映政治与社会，从殖民城市到现代主义。"
  zh-TW: "20 世紀建築如何塑造並反映政治與社會，從殖民城市到現代主義。"
  ja: "植民地都市からモダニズムまで、20世紀建築が政治・社会とどう関わったか。"
  ko: "식민 도시부터 모더니즘까지 20세기 건축이 정치·사회와 맺은 관계."
  vi: "Kiến trúc thế kỷ 20 định hình và phản ánh chính trị, xã hội ra sao, từ đô thị thuộc địa đến chủ nghĩa hiện đại."
  ms: "Bagaimana seni bina abad ke-20 membentuk dan mencerminkan politik dan masyarakat, dari bandar kolonial hingga modenisme."
  id: "Bagaimana arsitektur abad ke-20 membentuk dan mencerminkan politik dan masyarakat, dari kota kolonial hingga modernisme."
  hi: "20वीं सदी की वास्तुकला ने राजनीति और समाज को कैसे आकार दिया, औपनिवेशिक शहरों से आधुनिकतावाद तक।"
outcomes:
  - en: "Place buildings in their social and political context"
    zh: "把建筑放回其社会与政治背景中理解"
    zh-TW: "把建築放回其社會與政治背景中理解"
    ja: "建築を社会・政治的文脈に位置づける"
    ko: "건축을 사회·정치적 맥락에서 이해하기"
    vi: "Đặt công trình vào bối cảnh xã hội và chính trị"
    ms: "Meletakkan bangunan dalam konteks sosial dan politik"
    id: "Menempatkan bangunan dalam konteks sosial dan politik"
    hi: "भवनों को सामाजिक-राजनीतिक संदर्भ में रखना"
  - en: "Identify key people and works of modernism"
    zh: "认识现代主义的关键人物和作品"
    zh-TW: "認識現代主義的關鍵人物和作品"
    ja: "モダニズムの主要人物と作品を知る"
    ko: "모더니즘의 핵심 인물과 작품 알기"
    vi: "Nhận biết nhân vật và tác phẩm chính của chủ nghĩa hiện đại"
    ms: "Mengenal pasti tokoh dan karya utama modenisme"
    id: "Mengenali tokoh dan karya utama modernisme"
    hi: "आधुनिकतावाद के प्रमुख लोगों और कृतियों को पहचानना"
