code: MUSI10221
year: 2026
learn:
  en: "Second practical semester: lessons and classes on your instrument or voice, building toward a 20-minute recital exam."
  zh: "第二个实践学期：乐器或声乐课程与小组课，最后进行20分钟的独奏考试。"
  zh-TW: "第二個實作學期：樂器或聲樂課程與小組課，最後進行20分鐘的獨奏考試。"
  ja: "実技の2学期目。楽器や声のレッスンとクラスを経て20分のリサイタル試験へ。"
  ko: "두 번째 실기 학기: 악기·성악 레슨과 수업을 거쳐 20분 리사이틀 시험."
  vi: "Học kỳ thực hành thứ hai: học nhạc cụ/giọng, hướng tới bài thi độc tấu 20 phút."
  ms: "Semester praktikal kedua: kelas alat atau vokal menuju ujian resital 20 minit."
  id: "Semester praktik kedua: les alat atau vokal menuju ujian resital 20 menit."
  hi: "दूसरा प्रैक्टिकल सेमेस्टर: वाद्य/आवाज़ की कक्षाएँ, अंत में 20 मिनट की रिसाइटल परीक्षा।"
outcomes:
  - en: "Build solid technique on your instrument or voice"
    zh: "在乐器或声乐上打好技术基础"
    zh-TW: "在樂器或聲樂上打好技術基礎"
    ja: "楽器や声の確かな技術を築く"
    ko: "악기·성악 기초 기술 다지기"
    vi: "Xây kỹ thuật vững cho nhạc cụ, giọng"
    ms: "Bina teknik kukuh alat atau vokal"
    id: "Membangun teknik alat musik atau vokal"
    hi: "वाद्य या आवाज़ की मज़बूत तकनीक"
  - en: "Play with accuracy, style and good tone"
    zh: "准确、有风格且音色好地演奏"
    zh-TW: "準確、有風格且音色好地演奏"
    ja: "正確に、様式と良い音色で演奏する"
    ko: "정확하고 양식에 맞게 좋은 음색으로"
    vi: "Chơi chính xác, đúng phong cách"
    ms: "Main dengan tepat, gaya dan nada baik"
    id: "Bermain akurat, bergaya, nada bagus"
    hi: "सटीकता, शैली व अच्छे स्वर से बजाना"
  - en: "Plan and present a balanced recital program"
    zh: "策划并呈现均衡的独奏曲目"
    zh-TW: "策劃並呈現均衡的獨奏曲目"
    ja: "バランスのよいリサイタルを組み発表する"
    ko: "균형 잡힌 리사이틀 프로그램 짜기"
    vi: "Lên và trình bày chương trình độc tấu"
    ms: "Rancang dan persembah program resital"
    id: "Menyusun dan membawakan program resital"
    hi: "संतुलित रिसाइटल कार्यक्रम बनाना"
