code: SCIE20005
year: 2026
learn:
  en: "How science and technology such as AI, biotech, energy and space shape global security, and how to respond."
  zh: "人工智能、生物技术、能源和太空等科技如何塑造全球安全，以及如何应对。"
  zh-TW: "人工智慧、生物科技、能源和太空等科技如何塑造全球安全，以及如何應對。"
  ja: "AI・バイオ・エネルギー・宇宙などの科学技術が世界の安全保障をどう形づくり、どう対応するか。"
  ko: "AI·바이오·에너지·우주 등 과학기술이 세계 안보를 어떻게 바꾸고 어떻게 대응할지."
  vi: "Khoa học công nghệ như AI, sinh học, năng lượng, vũ trụ định hình an ninh toàn cầu ra sao và cách ứng phó."
  ms: "Cara sains dan teknologi seperti AI, bioteknologi, tenaga dan angkasa membentuk keselamatan global."
  id: "Cara sains dan teknologi seperti AI, bioteknologi, energi, dan antariksa membentuk keamanan global."
  hi: "AI, बायोटेक, ऊर्जा और अंतरिक्ष जैसी तकनीकें वैश्विक सुरक्षा को कैसे बदलती हैं और कैसे जवाब दें।"
outcomes:
  - en: "Explain links between technology and security"
    zh: "解释科技与安全之间的关联"
    zh-TW: "解釋科技與安全之間的關聯"
    ja: "技術と安全保障の関係を説明する"
    ko: "기술과 안보의 연관성 설명하기"
    vi: "Giải thích mối liên hệ giữa công nghệ và an ninh"
    ms: "Terangkan kaitan teknologi dan keselamatan"
    id: "Menjelaskan kaitan teknologi dan keamanan"
    hi: "तकनीक और सुरक्षा के संबंध समझाना"
  - en: "Assess policy responses to global challenges"
    zh: "评估应对全球挑战的政策"
    zh-TW: "評估應對全球挑戰的政策"
    ja: "世界的課題への政策対応を評価する"
    ko: "세계적 과제에 대한 정책 대응 평가하기"
    vi: "Đánh giá phản ứng chính sách với thách thức toàn cầu"
    ms: "Nilai respons dasar terhadap cabaran global"
    id: "Menilai respons kebijakan atas tantangan global"
    hi: "वैश्विक चुनौतियों पर नीतिगत जवाब परखना"
  - en: "Present an analysis as part of a team"
    zh: "以团队形式展示分析"
    zh-TW: "以團隊形式展示分析"
    ja: "チームで分析を発表する"
    ko: "팀으로 분석 발표하기"
    vi: "Trình bày phân tích cùng nhóm"
    ms: "Bentang analisis sebagai satu pasukan"
    id: "Mempresentasikan analisis bersama tim"
    hi: "टीम के साथ विश्लेषण प्रस्तुत करना"
