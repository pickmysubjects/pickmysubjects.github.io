code: CHEN90030
year: 2027
learn:
  en: "An individual, higher-level research project that extends earlier research work for another semester."
  zh: "个人完成的高阶研究项目，把之前的研究再延续一个学期。"
  zh-TW: "個人完成的進階研究專案，把先前的研究再延續一個學期。"
  ja: "以前の研究をもう一学期続けて深める、個人の上級研究プロジェクト。"
  ko: "이전 연구를 한 학기 더 이어가는 개인 심화 연구 프로젝트."
  vi: "Dự án nghiên cứu cá nhân nâng cao, kéo dài nghiên cứu trước thêm một học kỳ."
  ms: "Projek penyelidikan individu peringkat tinggi yang menyambung kajian terdahulu satu semester lagi."
  id: "Proyek riset individu tingkat lanjut yang melanjutkan riset sebelumnya satu semester lagi."
  hi: "व्यक्तिगत उन्नत शोध परियोजना जो पिछले शोध को एक और सेमेस्टर आगे बढ़ाती है।"
outcomes:
  - en: "Plan and carry out your own research project"
    zh: "规划并完成个人研究项目"
    zh-TW: "規劃並完成個人研究專案"
    ja: "自分の研究プロジェクトを計画し実行する"
    ko: "개인 연구 프로젝트 계획과 수행하기"
    vi: "Lập kế hoạch và thực hiện dự án nghiên cứu riêng"
    ms: "Merancang dan menjalankan projek penyelidikan sendiri"
    id: "Merencanakan dan menjalankan proyek riset sendiri"
    hi: "अपनी शोध परियोजना की योजना बनाना और पूरा करना"
  - en: "Report results in writing and in a talk"
    zh: "以书面报告和口头汇报展示结果"
    zh-TW: "以書面報告與口頭發表呈現結果"
    ja: "結果をレポートと発表で伝える"
    ko: "결과를 보고서와 발표로 전달하기"
    vi: "Trình bày kết quả bằng báo cáo và thuyết trình"
    ms: "Melaporkan hasil secara bertulis dan pembentangan"
    id: "Melaporkan hasil secara tertulis dan presentasi"
    hi: "परिणाम लिखित रिपोर्ट और प्रस्तुति में बताना"
