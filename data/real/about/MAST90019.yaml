code: MAST90019
year: 2027
learn:
  en: "Theory of random processes, such as Markov, renewal and Lévy processes, and how they model things changing over time."
  zh: "随机过程理论（马尔可夫、更新、莱维过程等）及其对随时间变化现象的建模。"
  zh-TW: "隨機過程理論（馬可夫、更新、Lévy過程等）及其對隨時間變化現象的建模。"
  ja: "マルコフ・再生・レヴィ過程など確率過程の理論と、時間変化のモデル化。"
  ko: "마르코프·재생·레비 과정 등 확률과정 이론과 시간에 따른 현상 모델링."
  vi: "Lý thuyết quá trình ngẫu nhiên như Markov, hồi phục, Lévy và mô hình hiện tượng theo thời gian."
  ms: "Teori proses rawak seperti Markov, pembaharuan dan Lévy, serta pemodelan fenomena mengikut masa."
  id: "Teori proses acak seperti Markov, renewal, dan Lévy, serta pemodelan fenomena sepanjang waktu."
  hi: "मार्कोव, रिन्यूअल, लेवी जैसी रैंडम प्रक्रियाओं का सिद्धांत और समय के साथ बदलाव का मॉडल।"
outcomes:
  - en: "Work with Markov and renewal process models"
    zh: "运用马尔可夫过程和更新过程模型"
    zh-TW: "運用馬可夫過程與更新過程模型"
    ja: "マルコフ過程と再生過程を扱う"
    ko: "마르코프·재생 과정 모델 다루기"
    vi: "Làm việc với mô hình Markov và quá trình hồi phục"
    ms: "Menggunakan model proses Markov dan pembaharuan"
    id: "Bekerja dengan model Markov dan renewal"
    hi: "मार्कोव और रिन्यूअल प्रक्रिया मॉडल पर काम करना"
  - en: "Model random events that evolve over time"
    zh: "为随时间演变的随机现象建模"
    zh-TW: "為隨時間演變的隨機現象建模"
    ja: "時間とともに変わる確率的現象をモデル化する"
    ko: "시간에 따라 변하는 무작위 현상 모델링하기"
    vi: "Mô hình hóa hiện tượng ngẫu nhiên theo thời gian"
    ms: "Memodelkan peristiwa rawak yang berubah mengikut masa"
    id: "Memodelkan peristiwa acak yang berubah dari waktu ke waktu"
    hi: "समय के साथ बदलने वाली रैंडम घटनाओं का मॉडल बनाना"
