code: DRAM20035
year: 2026
learn:
  en: "Ongoing voice, movement, devising and contemporary text classes that feed the semester's devised projects."
  zh: "持续的声音、形体、编创与当代文本课，支撑本学期的编创项目。"
  zh-TW: "持續的聲音、形體、編創與當代文本課，支撐本學期的編創專案。"
  ja: "声・身体・創作・現代テキストの授業を続け、学期の創作に生かす。"
  ko: "목소리·움직임·창작·현대 텍스트 수업으로 학기 창작 프로젝트를 받친다."
  vi: "Tiếp tục lớp giọng, hình thể, dựng vở, văn bản đương đại cho dự án học kỳ."
  ms: "Kelas suara, gerak, cipta dan teks kontemporari untuk projek semester."
  id: "Kelas suara, gerak, kreasi dan teks kontemporer untuk proyek semester."
  hi: "आवाज़, गति, रचना और समकालीन टेक्स्ट की कक्षाएँ, सेमेस्टर प्रोजेक्ट के लिए।"
outcomes:
  - en: "Perform a group piece and a solo task"
    zh: "完成小组作品与个人演出"
    zh-TW: "完成小組作品與個人演出"
    ja: "グループ作品とソロ課題を演じる"
    ko: "그룹 작품과 솔로 과제 공연하기"
    vi: "Diễn một tiết mục nhóm và một bài đơn"
    ms: "Persembah karya kumpulan dan solo"
    id: "Membawakan karya kelompok dan solo"
    hi: "समूह और सोलो प्रस्तुति करना"
  - en: "Use voice and body more flexibly"
    zh: "更灵活地运用声音与身体"
    zh-TW: "更靈活地運用聲音與身體"
    ja: "声と身体をより柔軟に使う"
    ko: "목소리와 몸을 더 유연하게 쓰기"
    vi: "Dùng giọng và cơ thể linh hoạt hơn"
    ms: "Guna suara dan tubuh dengan lebih fleksibel"
    id: "Memakai suara dan tubuh lebih luwes"
    hi: "आवाज़ और शरीर का अधिक लचीला उपयोग"
  - en: "Write a reflective response on your practice"
    zh: "就自己的实践写反思"
    zh-TW: "就自己的實踐寫反思"
    ja: "自分の実践について振り返りを書く"
    ko: "자신의 작업에 대한 성찰 글 쓰기"
    vi: "Viết suy ngẫm về quá trình thực hành"
    ms: "Tulis refleksi tentang amalan sendiri"
    id: "Menulis refleksi atas praktik sendiri"
    hi: "अपने अभ्यास पर चिंतन लिखना"
