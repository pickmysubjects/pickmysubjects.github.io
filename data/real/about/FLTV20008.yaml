code: FLTV20008
year: 2026
learn:
  en: "Writing for genre: sci-fi, romance, thriller, fantasy and horror conventions, story-team exercises and a 10-page genre script."
  zh: "类型片写作：科幻、爱情、惊悚、奇幻与恐怖的惯例，故事小组练习和 10 页剧本。"
  zh-TW: "類型片寫作：科幻、愛情、驚悚、奇幻與恐怖的慣例，故事小組練習和 10 頁劇本。"
  ja: "ジャンルの脚本：SF・恋愛・スリラー・ファンタジー・ホラーの型、チーム演習、10ページの脚本。"
  ko: "장르 각본: SF, 로맨스, 스릴러, 판타지, 호러 관습, 스토리팀 연습, 10쪽 각본."
  vi: "Viết theo thể loại: khoa học viễn tưởng, lãng mạn, giật gân, kỳ ảo, kinh dị; bài nhóm và kịch bản 10 trang."
  ms: "Menulis genre: konvensi sains fiksyen, cinta, thriller, fantasi dan seram, latihan kumpulan, skrip 10 halaman."
  id: "Menulis genre: konvensi fiksi ilmiah, roman, thriller, fantasi dan horor, latihan tim dan naskah 10 halaman."
  hi: "जॉनर लेखन: साइ-फ़ाई, रोमांस, थ्रिलर, फ़ैंटेसी और हॉरर की परंपराएँ, टीम अभ्यास और 10 पेज की स्क्रिप्ट।"
outcomes:
  - en: "Use the conventions of a chosen genre"
    zh: "运用所选类型的惯例"
    zh-TW: "運用所選類型的慣例"
    ja: "選んだジャンルの型を使う"
    ko: "선택한 장르의 관습 활용하기"
    vi: "Vận dụng quy ước của thể loại đã chọn"
    ms: "Guna konvensi genre pilihan"
    id: "Memakai konvensi genre pilihan"
    hi: "चुने जॉनर की परंपराओं का उपयोग"
  - en: "Build stories together in a story team"
    zh: "在故事小组中共同构建故事"
    zh-TW: "在故事小組中共同建構故事"
    ja: "ストーリーチームで共に物語を作る"
    ko: "스토리팀에서 함께 이야기 만들기"
    vi: "Cùng nhóm xây dựng câu chuyện"
    ms: "Bina cerita bersama dalam pasukan"
    id: "Membangun cerita bersama dalam tim"
    hi: "स्टोरी टीम में मिलकर कहानियाँ बनाना"
  - en: "Write a 10-page genre screenplay"
    zh: "写一部 10 页类型片剧本"
    zh-TW: "寫一部 10 頁類型片劇本"
    ja: "10ページのジャンル脚本を書く"
    ko: "10쪽 장르 각본 쓰기"
    vi: "Viết kịch bản thể loại 10 trang"
    ms: "Tulis lakon layar genre 10 halaman"
    id: "Menulis skenario genre 10 halaman"
    hi: "10 पेज की जॉनर पटकथा लिखना"
