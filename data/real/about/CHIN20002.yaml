code: CHIN20002
year: 2026
learn:
  en: "Chinese for students who finished Chinese 3: more everyday speaking, reading and writing, with new grammar."
  zh: "适合学完中文 3的学生：更多日常听说读写和新语法。"
  zh-TW: "適合學完中文 3的學生：更多日常聽說讀寫和新文法。"
  ja: "中国語3を終えた学生向け。日常の会話・読み書きを広げ、新しい文法を学ぶ。"
  ko: "중국어 3을(를) 마친 학생 대상. 일상 말하기·읽기·쓰기를 넓히고 새 문법을 배운다."
  vi: "tiếng Trung cho sinh viên đã học xong tiếng Trung 3: thêm nói, đọc, viết hằng ngày và ngữ pháp mới."
  ms: "bahasa Cina untuk pelajar yang sudah tamat bahasa Cina 3: lebih banyak bertutur, membaca dan menulis harian, dengan tatabahasa baharu."
  id: "bahasa Mandarin untuk mahasiswa yang sudah lulus bahasa Mandarin 3: lebih banyak berbicara, membaca dan menulis sehari-hari, dengan tata bahasa baru."
  hi: "चीनी 3 पूरा कर चुके छात्रों के लिए चीनी: रोज़मर्रा का बोलना, पढ़ना, लिखना और नया व्याकरण।"
outcomes:
  - en: "Talk about familiar topics in Chinese with more confidence"
    zh: "更自信地用中文谈论熟悉的话题"
    zh-TW: "更自信地用中文談論熟悉的話題"
    ja: "身近な話題を中国語でより自信を持って話す"
    ko: "익숙한 주제를 중국어로 더 자신 있게 말하기"
    vi: "Nói về chủ đề quen thuộc bằng tiếng Trung tự tin hơn"
    ms: "Bercakap tentang topik biasa dalam bahasa Cina dengan lebih yakin"
    id: "Membicarakan topik akrab dalam bahasa Mandarin dengan lebih percaya diri"
    hi: "परिचित विषयों पर चीनी में ज़्यादा आत्मविश्वास से बात करना"
  - en: "Read and write short Chinese texts"
    zh: "读写简短的中文文章"
    zh-TW: "讀寫簡短的中文文章"
    ja: "短い中国語の文章を読み書きする"
    ko: "짧은 중국어 글 읽고 쓰기"
    vi: "Đọc và viết đoạn văn tiếng Trung ngắn"
    ms: "Baca dan tulis teks pendek bahasa Cina"
    id: "Membaca dan menulis teks pendek bahasa Mandarin"
    hi: "छोटे चीनी पाठ पढ़ना-लिखना"
  - en: "Use new grammar and vocabulary correctly"
    zh: "正确运用新语法和词汇"
    zh-TW: "正確運用新文法和詞彙"
    ja: "新しい文法と語彙を正しく使う"
    ko: "새 문법과 어휘를 정확히 쓰기"
    vi: "Dùng đúng ngữ pháp và từ vựng mới"
    ms: "Guna tatabahasa dan kosa kata baharu dengan betul"
    id: "Memakai tata bahasa dan kosakata baru dengan benar"
    hi: "नया व्याकरण और शब्दावली सही इस्तेमाल करना"
