code: MUSI30274
year: 2026
learn:
  en: "Team up to plan a performing arts project, writing a project plan and a mock grant proposal with a budget."
  zh: "组队策划一个表演艺术项目，撰写项目计划和含预算的模拟资助申请。"
  zh-TW: "組隊策劃一個表演藝術專案，撰寫專案計畫與含預算的模擬補助申請。"
  ja: "チームで舞台芸術プロジェクトを企画し、計画書と予算付きの模擬助成申請を作る。"
  ko: "팀으로 공연예술 프로젝트를 기획하고 계획서와 예산이 포함된 모의 지원금 신청서 작성."
  vi: "Lập nhóm lên kế hoạch dự án nghệ thuật biểu diễn, viết kế hoạch và hồ sơ xin tài trợ giả định."
  ms: "Berpasukan merancang projek seni persembahan, tulis pelan projek dan cadangan geran olok-olok."
  id: "Berkelompok merancang proyek seni pertunjukan, menulis rencana proyek dan proposal hibah simulasi."
  hi: "टीम में परफ़ॉर्मिंग आर्ट्स प्रोजेक्ट की योजना, प्रोजेक्ट प्लान और बजट सहित नकली अनुदान प्रस्ताव।"
outcomes:
  - en: "Develop a performing arts concept"
    zh: "构思表演艺术项目概念"
    zh-TW: "構思表演藝術專案概念"
    ja: "舞台芸術の企画を練る"
    ko: "공연예술 콘셉트 개발하기"
    vi: "Phát triển ý tưởng dự án biểu diễn"
    ms: "Bangunkan konsep seni persembahan"
    id: "Mengembangkan konsep seni pertunjukan"
    hi: "परफ़ॉर्मिंग आर्ट्स अवधारणा विकसित करना"
  - en: "Write a grant proposal and budget"
    zh: "撰写资助申请和预算"
    zh-TW: "撰寫補助申請與預算"
    ja: "助成申請書と予算を書く"
    ko: "지원금 신청서와 예산 작성하기"
    vi: "Viết hồ sơ tài trợ và ngân sách"
    ms: "Tulis cadangan geran dan bajet"
    id: "Menulis proposal hibah dan anggaran"
    hi: "अनुदान प्रस्ताव और बजट लिखना"
  - en: "Collaborate in a creative team"
    zh: "在创意团队中合作"
    zh-TW: "在創意團隊中合作"
    ja: "創作チームで協働する"
    ko: "창작 팀에서 협업하기"
    vi: "Hợp tác trong nhóm sáng tạo"
    ms: "Bekerjasama dalam pasukan kreatif"
    id: "Berkolaborasi dalam tim kreatif"
    hi: "रचनात्मक टीम में सहयोग"
