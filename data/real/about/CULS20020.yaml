code: CULS20020
year: 2026
learn:
  en: "How ideas of nature and culture shaped colonial and postcolonial Australia, drawing especially on First Nations scholars."
  zh: "自然与文化的观念如何塑造殖民及后殖民时期的澳大利亚，尤其借鉴原住民学者的研究。"
  zh-TW: "自然與文化的觀念如何塑造殖民及後殖民時期的澳洲，尤其借鑑原住民學者的研究。"
  ja: "自然と文化の考え方が植民地期とその後のオーストラリアをどう形づくったか、特に先住民の研究者から学ぶ。"
  ko: "자연과 문화의 관념이 식민·탈식민 호주를 어떻게 만들었는지, 특히 원주민 학자의 연구로 배운다."
  vi: "Quan niệm về tự nhiên và văn hóa đã định hình nước Úc thuộc địa và hậu thuộc địa ra sao, dựa nhiều vào học giả bản địa."
  ms: "Cara idea alam dan budaya membentuk Australia kolonial dan pascakolonial, terutama menurut sarjana Orang Asli."
  id: "Cara gagasan alam dan budaya membentuk Australia kolonial dan pascakolonial, terutama lewat karya akademisi Pribumi."
  hi: "प्रकृति और संस्कृति के विचारों ने औपनिवेशिक और उत्तर-औपनिवेशिक ऑस्ट्रेलिया को कैसे गढ़ा, ख़ासकर मूलनिवासी विद्वानों के काम के सहारे।"
outcomes:
  - en: "Explain the idea of natureculture"
    zh: "说明\"自然文化\"这一概念"
    zh-TW: "說明「自然文化」這一概念"
    ja: "「ネイチャーカルチャー」という考えを説明する"
    ko: "'자연문화' 개념 설명하기"
    vi: "Giải thích khái niệm tự nhiên-văn hóa"
    ms: "Terangkan idea alam-budaya"
    id: "Menjelaskan gagasan alam-budaya"
    hi: "नेचरकल्चर का विचार समझाना"
  - en: "Analyse how colonialism shaped land and water use"
    zh: "分析殖民如何影响土地和水的利用"
    zh-TW: "分析殖民如何影響土地和水的利用"
    ja: "植民地支配が土地と水の使い方をどう変えたか分析する"
    ko: "식민주의가 토지·물 이용을 바꾼 방식 분석하기"
    vi: "Phân tích chủ nghĩa thực dân định hình việc dùng đất và nước ra sao"
    ms: "Analisis cara kolonialisme membentuk penggunaan tanah dan air"
    id: "Menganalisis cara kolonialisme membentuk penggunaan tanah dan air"
    hi: "उपनिवेशवाद ने ज़मीन और पानी के उपयोग को कैसे बदला, विश्लेषण करना"
  - en: "Discuss First Nations perspectives on country"
    zh: "讨论原住民对土地的视角"
    zh-TW: "討論原住民對土地的視角"
    ja: "土地についての先住民の視点を論じる"
    ko: "땅에 대한 원주민의 관점 논의하기"
    vi: "Thảo luận quan điểm người bản địa về đất đai"
    ms: "Bincangkan perspektif Orang Asli tentang tanah"
    id: "Membahas perspektif Pribumi tentang tanah"
    hi: "ज़मीन (कंट्री) पर मूलनिवासी दृष्टिकोणों पर चर्चा करना"
