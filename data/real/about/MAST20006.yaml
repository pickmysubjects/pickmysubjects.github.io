code: MAST20006
year: 2026
learn:
  en: "The probability theory you need to understand statistics, with computer help but no programming."
  zh: "学懂统计所需的概率论，会用电脑算但不用编程。"
  zh-TW: "學懂統計所需的機率論，會用電腦計算但不用寫程式。"
  ja: "統計を理解するための確率論。コンピュータは使うがプログラミングはなし。"
  ko: "통계를 이해하는 데 필요한 확률론. 컴퓨터는 쓰지만 프로그래밍은 없음."
  vi: "Lý thuyết xác suất cần để hiểu thống kê, có dùng máy tính nhưng không lập trình."
  ms: "Teori kebarangkalian untuk memahami statistik, guna komputer tetapi tiada pengaturcaraan."
  id: "Teori peluang yang dibutuhkan untuk memahami statistik, pakai komputer tapi tanpa pemrograman."
  hi: "सांख्यिकी समझने के लिए ज़रूरी प्रायिकता सिद्धांत, कंप्यूटर की मदद से पर प्रोग्रामिंग के बिना।"
outcomes:
  - en: "Build probability models from real-world problems"
    zh: "从实际问题建立概率模型"
    zh-TW: "從實際問題建立機率模型"
    ja: "現実の問題から確率モデルを作る"
    ko: "실제 문제로 확률 모델 만들기"
    vi: "Xây dựng mô hình xác suất từ bài toán thực tế"
    ms: "Membina model kebarangkalian daripada masalah sebenar"
    id: "Membangun model peluang dari masalah nyata"
    hi: "असल समस्याओं से प्रायिकता मॉडल बनाना"
  - en: "Work out distributions of sums and functions of variables"
    zh: "求随机变量的和与函数的分布"
    zh-TW: "求隨機變數的和與函數的分布"
    ja: "変数の和や関数の分布を求める"
    ko: "변수의 합과 함수의 분포 구하기"
    vi: "Tìm phân phối của tổng và hàm các biến"
    ms: "Mencari taburan bagi hasil tambah dan fungsi pemboleh ubah"
    id: "Mencari distribusi jumlah dan fungsi variabel"
    hi: "चरों के योग और फ़ंक्शन का वितरण निकालना"
  - en: "Use a computer package for probability calculations"
    zh: "用软件做概率计算"
    zh-TW: "用軟體做機率計算"
    ja: "ソフトウェアで確率計算をする"
    ko: "소프트웨어로 확률 계산하기"
    vi: "Dùng phần mềm để tính xác suất"
    ms: "Menggunakan perisian untuk pengiraan kebarangkalian"
    id: "Memakai software untuk menghitung peluang"
    hi: "प्रायिकता की गणना के लिए सॉफ्टवेयर का उपयोग"
