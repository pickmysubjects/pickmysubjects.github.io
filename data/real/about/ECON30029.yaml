code: ECON30029
year: 2026
learn:
  en: "Open-economy macro and international finance: exchange rates, balance of payments, crises and policy."
  zh: "开放经济宏观与国际金融：汇率、国际收支、危机和政策。"
  zh-TW: "開放經濟總體與國際金融：匯率、國際收支、危機和政策。"
  ja: "開放経済のマクロと国際金融：為替レート、国際収支、危機、政策。"
  ko: "개방경제 거시와 국제금융: 환율, 국제수지, 위기, 정책."
  vi: "Vĩ mô kinh tế mở và tài chính quốc tế: tỷ giá, cán cân thanh toán, khủng hoảng và chính sách."
  ms: "Makro ekonomi terbuka dan kewangan antarabangsa: kadar pertukaran, imbangan pembayaran, krisis dan dasar."
  id: "Makro ekonomi terbuka dan keuangan internasional: kurs, neraca pembayaran, krisis, dan kebijakan."
  hi: "ओपन-इकोनॉमी मैक्रो और अंतरराष्ट्रीय वित्त: विनिमय दर, भुगतान संतुलन, संकट और नीति।"
outcomes:
  - en: "Use open-economy models to explain current events"
    zh: "用开放经济模型解释时事"
    zh-TW: "用開放經濟模型解釋時事"
    ja: "開放経済モデルで時事を説明する"
    ko: "개방경제 모형으로 최근 사건 설명하기"
    vi: "Dùng mô hình kinh tế mở giải thích sự kiện thời sự"
    ms: "Guna model ekonomi terbuka untuk terangkan peristiwa semasa"
    id: "Memakai model ekonomi terbuka untuk menjelaskan peristiwa terkini"
    hi: "ओपन-इकोनॉमी मॉडल से मौजूदा घटनाएँ समझाना"
  - en: "Give policy advice on fixed vs floating rates"
    zh: "就固定与浮动汇率给出政策建议"
    zh-TW: "就固定與浮動匯率提出政策建議"
    ja: "固定・変動相場制について政策提言する"
    ko: "고정·변동환율에 대한 정책 조언하기"
    vi: "Đưa lời khuyên chính sách về tỷ giá cố định và thả nổi"
    ms: "Beri nasihat dasar tentang kadar tetap dan terapung"
    id: "Memberi saran kebijakan soal kurs tetap dan mengambang"
    hi: "फ़िक्स्ड बनाम फ़्लोटिंग दर पर नीति सलाह देना"
  - en: "Test competing theories with data"
    zh: "用数据检验相互竞争的理论"
    zh-TW: "用資料檢驗相互競爭的理論"
    ja: "対立する理論をデータで検証する"
    ko: "경쟁 이론을 데이터로 검증하기"
    vi: "Kiểm định các lý thuyết cạnh tranh bằng dữ liệu"
    ms: "Uji teori yang bersaing dengan data"
    id: "Menguji teori yang bersaing dengan data"
    hi: "प्रतिस्पर्धी सिद्धांतों को डेटा से परखना"
