code: INTS10001
year: 2026
learn:
  en: "The players, institutions and big debates in world politics today, from war and great-power rivalry to climate change and refugees."
  zh: "当今世界政治中的主要角色、机构和重大争论，从战争、恐怖主义、大国竞争到气候变化和难民问题。"
  zh-TW: "當今世界政治中的主要角色、機構和重大爭論，從戰爭、恐怖主義、大國競爭到氣候變遷和難民問題。"
  ja: "今日の国際政治の主な担い手、制度、大きな論点を、戦争、テロ、大国間の対立から気候変動、難民まで学ぶ。"
  ko: "오늘날 국제 정치의 주요 행위자, 제도, 큰 논쟁을 전쟁, 테러, 강대국 경쟁부터 기후 변화, 난민까지 배운다."
  vi: "Các chủ thể, thể chế và tranh luận lớn của chính trị thế giới hiện nay, từ chiến tranh, khủng bố, cạnh tranh nước lớn đến biến đổi khí hậu và người tị nạn."
  ms: "Pelaku, institusi dan perdebatan besar dalam politik dunia hari ini, dari perang, keganasan dan persaingan kuasa besar hingga perubahan iklim dan pelarian."
  id: "Aktor, lembaga, dan perdebatan besar dalam politik dunia saat ini, dari perang, terorisme, dan rivalitas negara besar hingga perubahan iklim dan pengungsi."
  hi: "आज की विश्व राजनीति के मुख्य खिलाड़ी, संस्थाएँ और बड़ी बहसें: युद्ध, आतंकवाद और महाशक्तियों की होड़ से जलवायु परिवर्तन और शरणार्थियों तक।"
outcomes:
  - en: "Explain the main theories of international politics"
    zh: "解释国际政治的主要理论"
    zh-TW: "解釋國際政治的主要理論"
    ja: "国際政治の主要な理論を説明する"
    ko: "국제 정치의 주요 이론 설명하기"
    vi: "Giải thích các lý thuyết chính của chính trị quốc tế"
    ms: "Terangkan teori utama politik antarabangsa"
    id: "Menjelaskan teori utama politik internasional"
    hi: "अंतरराष्ट्रीय राजनीति के मुख्य सिद्धांत समझाना"
  - en: "Look behind the news on world events"
    zh: "看懂国际新闻背后的深层原因"
    zh-TW: "看懂國際新聞背後的深層原因"
    ja: "世界のニュースの背景を読み解く"
    ko: "국제 뉴스 이면의 맥락 읽어 내기"
    vi: "Nhìn ra điều ẩn sau tin tức thế giới"
    ms: "Fahami apa di sebalik berita dunia"
    id: "Memahami apa di balik berita dunia"
    hi: "दुनिया की खबरों के पीछे की बात समझना"
  - en: "Analyse global issues like war, trade and climate"
    zh: "分析战争、贸易和气候等全球议题"
    zh-TW: "分析戰爭、貿易和氣候等全球議題"
    ja: "戦争、貿易、気候などの地球規模の問題を分析する"
    ko: "전쟁, 무역, 기후 같은 지구적 문제 분석하기"
    vi: "Phân tích các vấn đề toàn cầu như chiến tranh, thương mại, khí hậu"
    ms: "Analisis isu global seperti perang, perdagangan dan iklim"
    id: "Menganalisis isu global seperti perang, perdagangan, dan iklim"
    hi: "युद्ध, व्यापार और जलवायु जैसे वैश्विक मुद्दों का विश्लेषण करना"
