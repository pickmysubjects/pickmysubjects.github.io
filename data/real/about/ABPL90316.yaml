code: ABPL90316
year: 2027
learn:
  en: "An introduction to urban design tools and theory, with fieldwork in Melbourne's CBD and graphic ways to show urban change."
  zh: "入门城市设计的工具与理论，在墨尔本市中心实地考察，并用图像表现城市变化。"
  zh-TW: "入門城市設計的工具與理論，在墨爾本市中心實地考察，並用圖像表現城市變化。"
  ja: "都市デザインの道具と理論を学び、メルボルンCBDで現地調査し、都市の変化を図で表す。"
  ko: "도시설계 도구와 이론을 배우고 멜버른 CBD 현장조사와 도시 변화의 시각 표현을 익힙니다."
  vi: "Nhập môn công cụ và lý thuyết thiết kế đô thị, thực địa ở trung tâm Melbourne và thể hiện thay đổi đô thị bằng hình ảnh."
  ms: "Pengenalan alat dan teori reka bentuk bandar, kerja lapangan di CBD Melbourne dan cara grafik menunjukkan perubahan bandar."
  id: "Pengantar alat dan teori desain kota, kerja lapangan di CBD Melbourne, dan cara grafis menampilkan perubahan kota."
  hi: "अर्बन डिज़ाइन के टूल और सिद्धांत, मेलबर्न CBD में फ़ील्डवर्क और शहरी बदलाव को ग्राफ़िक रूप में दिखाना।"
outcomes:
  - en: "Analyse urban places with design theory"
    zh: "用城市设计理论分析城市空间"
    zh-TW: "用城市設計理論分析城市空間"
    ja: "都市デザイン理論で都市空間を分析する"
    ko: "도시설계 이론으로 도시 공간 분석하기"
    vi: "Phân tích không gian đô thị bằng lý thuyết thiết kế"
    ms: "Menganalisis ruang bandar dengan teori reka bentuk"
    id: "Menganalisis ruang kota dengan teori desain"
    hi: "डिज़ाइन सिद्धांत से शहरी स्थानों का विश्लेषण"
  - en: "Present design ideas in graphics, text and talks"
    zh: "用图像、文字和口头展示设计想法"
    zh-TW: "用圖像、文字和口頭展示設計想法"
    ja: "図・文章・口頭で設計案を示す"
    ko: "그래픽, 글, 발표로 설계안 제시하기"
    vi: "Trình bày ý tưởng bằng hình, chữ và lời nói"
    ms: "Membentangkan idea reka bentuk melalui grafik, teks dan lisan"
    id: "Menyajikan ide desain lewat grafis, teks, dan lisan"
    hi: "ग्राफ़िक, लेखन और प्रस्तुति से डिज़ाइन विचार रखना"
