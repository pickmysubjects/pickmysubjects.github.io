code: MUSI30166
year: 2026
learn:
  en: "A second semester in the Conservatorium big band: more repertoire, student charts, solos and public gigs."
  zh: "音乐学院大乐队第二学期：更多曲目、学生编曲、独奏和公开演出。"
  zh-TW: "音樂學院大樂隊第二學期：更多曲目、學生編曲、獨奏和公開演出。"
  ja: "ビッグバンドの後期。曲目を増やし、学生編曲やソロ、公演も。"
  ko: "빅밴드 2학기. 더 많은 곡, 학생 편곡, 솔로, 공개 공연."
  vi: "Học kỳ hai big band: thêm tiết mục, bản phối của sinh viên, solo, diễn công khai."
  ms: "Semester kedua big band: lebih repertoir, susunan pelajar, solo dan persembahan."
  id: "Semester kedua big band: repertoar baru, aransemen mahasiswa, solo, pentas publik."
  hi: "बिग बैंड का दूसरा सत्र: अधिक रचनाएँ, छात्र व्यवस्थाएँ, सोलो और सार्वजनिक शो।"
outcomes:
  - en: "Read and play a wider range of big band charts"
    zh: "读奏更多样的大乐队谱"
    zh-TW: "讀奏更多樣的大樂隊譜"
    ja: "より幅広いビッグバンド譜を演奏する"
    ko: "더 다양한 빅밴드 악보 연주하기"
    vi: "Đọc và chơi nhiều bản big band hơn"
    ms: "Baca dan mainkan lebih banyak skor big band"
    id: "Membaca dan memainkan lebih banyak partitur"
    hi: "अधिक तरह के बिग बैंड चार्ट पढ़ना और बजाना"
  - en: "Take solos with growing confidence"
    zh: "更自信地担任独奏"
    zh-TW: "更自信地擔任獨奏"
    ja: "より自信を持ってソロを取る"
    ko: "더 자신 있게 솔로 하기"
    vi: "Chơi solo tự tin hơn"
    ms: "Bermain solo dengan lebih yakin"
    id: "Bermain solo dengan makin percaya diri"
    hi: "बढ़ते आत्मविश्वास से सोलो बजाना"
  - en: "Perform with the band at public events"
    zh: "随乐队参加公开演出"
    zh-TW: "隨樂隊參加公開演出"
    ja: "バンドとして公の場で演奏する"
    ko: "밴드와 공개 행사에서 공연하기"
    vi: "Biểu diễn cùng ban nhạc ở sự kiện công khai"
    ms: "Membuat persembahan awam bersama band"
    id: "Tampil bersama band di acara publik"
    hi: "बैंड के साथ सार्वजनिक कार्यक्रमों में बजाना"
