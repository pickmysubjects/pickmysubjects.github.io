code: AGRI30038
year: 2026
learn:
  en: "A capstone where you investigate a real farming industry challenge with systems thinking, solo and in groups."
  zh: "毕业项目：用系统思维单独和分组研究真实农业难题。"
  zh-TW: "畢業專題：用系統思維獨自及分組研究真實農業難題。"
  ja: "総まとめ科目：実際の農業課題をシステム思考で個人とグループで調べる。"
  ko: "캡스톤: 실제 농업 문제를 시스템 사고로 개인·팀 단위로 탐구한다."
  vi: "Môn tổng kết: tìm hiểu một vấn đề thực của ngành nông nghiệp bằng tư duy hệ thống, cá nhân và nhóm."
  ms: "Subjek puncak: siasat cabaran sebenar industri pertanian dengan pemikiran sistem, solo dan berkumpulan."
  id: "Mata kuliah capstone: menyelidiki tantangan nyata industri pertanian dengan berpikir sistem, sendiri dan berkelompok."
  hi: "कैपस्टोन: सिस्टम थिंकिंग से असली कृषि उद्योग की चुनौती की अकेले और समूह में जाँच।"
outcomes:
  - en: "Use evidence to find options for farm problems"
    zh: "用证据为农业问题找出方案"
    zh-TW: "用證據為農業問題找出方案"
    ja: "根拠をもとに農業課題の解決策を探す"
    ko: "근거로 농업 문제 해결안 찾기"
    vi: "Dùng bằng chứng tìm giải pháp cho nông nghiệp"
    ms: "Guna bukti untuk cari pilihan masalah ladang"
    id: "Memakai bukti untuk mencari opsi solusi"
    hi: "सबूतों से कृषि समस्याओं के विकल्प खोजें"
  - en: "Apply systems thinking to farm sustainability"
    zh: "用系统思维分析农业可持续性"
    zh-TW: "用系統思維分析農業永續性"
    ja: "農業の持続性にシステム思考を使う"
    ko: "농업 지속가능성에 시스템 사고 적용하기"
    vi: "Áp dụng tư duy hệ thống cho nông nghiệp bền vững"
    ms: "Guna pemikiran sistem untuk kemampanan ladang"
    id: "Menerapkan berpikir sistem pada keberlanjutan"
    hi: "कृषि स्थिरता पर सिस्टम थिंकिंग लागू करें"
  - en: "Work with stakeholders on improvement ideas"
    zh: "与相关方合作提出改进方案"
    zh-TW: "與利害關係人合作提出改善方案"
    ja: "関係者と協力して改善案を作る"
    ko: "이해관계자와 개선안 함께 만들기"
    vi: "Hợp tác với các bên để đề xuất cải tiến"
    ms: "Bekerjasama dengan pihak berkepentingan"
    id: "Bekerja sama dengan pemangku kepentingan"
    hi: "हितधारकों के साथ सुधार के विचार बनाएँ"
