code: MUSI30292
year: 2026
learn:
  en: "Art song in its original languages: interpret standard songs and present them as mini lecture-recitals."
  zh: "以原文演绎艺术歌曲，并以讲演音乐会形式呈现。"
  zh-TW: "以原文詮釋藝術歌曲，並以講演音樂會形式呈現。"
  ja: "原語で歌曲を解釈し、短いレクチャー・リサイタルで発表する。"
  ko: "원어로 예술가곡을 해석하고 렉처 리사이틀로 발표."
  vi: "Diễn giải ca khúc nghệ thuật bằng ngôn ngữ gốc qua buổi giảng-diễn ngắn."
  ms: "Tafsir lagu seni dalam bahasa asal dan persembah sebagai resital-kuliah."
  id: "Menafsirkan lagu seni dalam bahasa asli lewat resital-ceramah singkat."
  hi: "मूल भाषाओं में आर्ट सॉन्ग की व्याख्या, छोटे लेक्चर-रिसाइटल के रूप में।"
outcomes:
  - en: "Interpret standard art song repertoire"
    zh: "诠释经典艺术歌曲曲目"
    zh-TW: "詮釋經典藝術歌曲曲目"
    ja: "定番の歌曲を解釈する"
    ko: "대표 예술가곡 해석하기"
    vi: "Diễn giải các ca khúc nghệ thuật chuẩn"
    ms: "Tafsir repertoir lagu seni standard"
    id: "Menafsirkan repertoar lagu seni standar"
    hi: "प्रमुख आर्ट सॉन्ग की व्याख्या करना"
  - en: "Explain a song's text and score aloud"
    zh: "口头讲解歌曲的歌词与乐谱"
    zh-TW: "口頭講解歌曲的歌詞與樂譜"
    ja: "歌詞と楽譜を口頭で解説する"
    ko: "가사와 악보를 말로 설명하기"
    vi: "Trình bày lời và bản nhạc bằng lời nói"
    ms: "Terangkan lirik dan skor secara lisan"
    id: "Menjelaskan lirik dan partitur secara lisan"
    hi: "गीत के बोल और स्कोर मौखिक समझाना"
  - en: "Perform in a lecture-recital format"
    zh: "以讲演音乐会形式演出"
    zh-TW: "以講演音樂會形式演出"
    ja: "レクチャー・リサイタル形式で演奏する"
    ko: "렉처 리사이틀 형식으로 공연하기"
    vi: "Biểu diễn theo dạng giảng-diễn"
    ms: "Persembah dalam format resital-kuliah"
    id: "Tampil dalam format resital-ceramah"
    hi: "लेक्चर-रिसाइटल रूप में प्रस्तुति"
