code: CHIN30027
year: 2026
learn:
  en: "Chinese for background speakers with limited reading and writing: formal reading, writing and speaking."
  zh: "适合有中文背景但读写有限的学生：正式的阅读、写作和口语。"
  zh-TW: "適合有中文背景但讀寫有限的學生：正式的閱讀、寫作和口語。"
  ja: "中国語の背景はあるが読み書きが限られる学生向け。改まった読み書きと話し方。"
  ko: "중국어 배경은 있으나 읽기·쓰기가 부족한 학생 대상. 격식 있는 읽기·쓰기·말하기."
  vi: "Tiếng Trung cho người có nền tảng nhưng đọc viết còn hạn chế: đọc, viết, nói trang trọng."
  ms: "Bahasa Cina untuk penutur berlatar belakang Cina yang terhad membaca dan menulis: bahasa formal."
  id: "Bahasa Mandarin untuk penutur berlatar belakang Tionghoa yang terbatas membaca dan menulis: bahasa formal."
  hi: "चीनी पृष्ठभूमि वाले पर सीमित पढ़ने-लिखने वाले छात्रों के लिए: औपचारिक पढ़ना, लिखना और बोलना।"
outcomes:
  - en: "Discuss social and cultural topics in Chinese"
    zh: "用中文讨论社会和文化话题"
    zh-TW: "用中文討論社會和文化話題"
    ja: "社会や文化の話題を中国語で話し合う"
    ko: "사회·문화 주제를 중국어로 토론하기"
    vi: "Thảo luận chủ đề xã hội, văn hóa bằng tiếng Trung"
    ms: "Bincangkan topik sosial dan budaya dalam bahasa Cina"
    id: "Membahas topik sosial dan budaya dalam bahasa Mandarin"
    hi: "सामाजिक और सांस्कृतिक विषयों पर चीनी में चर्चा करना"
  - en: "Read and write longer Chinese texts"
    zh: "读写较长的中文文章"
    zh-TW: "讀寫較長的中文文章"
    ja: "長めの中国語の文章を読み書きする"
    ko: "긴 중국어 글 읽고 쓰기"
    vi: "Đọc và viết văn bản tiếng Trung dài hơn"
    ms: "Baca dan tulis teks bahasa Cina yang lebih panjang"
    id: "Membaca dan menulis teks bahasa Mandarin yang lebih panjang"
    hi: "लंबे चीनी पाठ पढ़ना-लिखना"
  - en: "Give a clear presentation in Chinese"
    zh: "用中文做清楚的口头报告"
    zh-TW: "用中文做清楚的口頭報告"
    ja: "中国語で分かりやすく発表する"
    ko: "중국어로 명확하게 발표하기"
    vi: "Thuyết trình rõ ràng bằng tiếng Trung"
    ms: "Buat pembentangan yang jelas dalam bahasa Cina"
    id: "Melakukan presentasi yang jelas dalam bahasa Mandarin"
    hi: "चीनी में स्पष्ट प्रस्तुति देना"
