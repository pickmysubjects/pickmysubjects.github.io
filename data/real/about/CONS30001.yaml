code: CONS30001
year: 2026
learn:
  en: "An introduction to BIM: model a building in Revit and Navisworks and manage its data from design to operation."
  zh: "BIM入门：用Revit和Navisworks建立建筑模型，管理从设计到运营的信息。"
  zh-TW: "BIM入門：用Revit和Navisworks建立建築模型，管理從設計到營運的資訊。"
  ja: "BIM入門：RevitとNavisworksで建物をモデル化し、設計から運用まで情報を管理する。"
  ko: "BIM 입문: Revit과 Navisworks로 건물을 모델링하고 설계부터 운영까지 정보를 관리한다."
  vi: "Nhập môn BIM: dựng mô hình tòa nhà bằng Revit, Navisworks và quản lý dữ liệu đến vận hành."
  ms: "Pengenalan BIM: model bangunan dalam Revit dan Navisworks serta urus datanya hingga operasi."
  id: "Pengantar BIM: memodelkan gedung di Revit dan Navisworks serta mengelola datanya."
  hi: "BIM का परिचय: Revit और Navisworks में इमारत का मॉडल बनाना और डिज़ाइन से संचालन तक डेटा संभालना।"
outcomes:
  - en: "Explain core BIM ideas without the jargon"
    zh: "不用术语讲清BIM核心概念"
    zh-TW: "不用術語講清BIM核心概念"
    ja: "BIMの基本を専門用語抜きで説明する"
    ko: "BIM 핵심 개념을 쉽게 설명하기"
    vi: "Giải thích ý chính của BIM dễ hiểu"
    ms: "Jelaskan idea teras BIM tanpa jargon"
    id: "Menjelaskan konsep inti BIM tanpa jargon"
    hi: "BIM के मूल विचार आसान भाषा में समझाना"
  - en: "Build 2D and 3D building models in Revit"
    zh: "用Revit建立二维和三维建筑模型"
    zh-TW: "用Revit建立2D和3D建築模型"
    ja: "Revitで2D・3Dの建物モデルを作る"
    ko: "Revit으로 2D·3D 건물 모델 만들기"
    vi: "Dựng mô hình 2D, 3D trong Revit"
    ms: "Bina model bangunan 2D dan 3D dalam Revit"
    id: "Membuat model gedung 2D dan 3D di Revit"
    hi: "Revit में 2D और 3D बिल्डिंग मॉडल बनाना"
  - en: "Manage model data across a project's life"
    zh: "在项目全周期中管理模型数据"
    zh-TW: "在專案全週期中管理模型資料"
    ja: "プロジェクト全体でモデル情報を管理する"
    ko: "프로젝트 전 주기 모델 데이터 관리하기"
    vi: "Quản lý dữ liệu mô hình suốt vòng đời dự án"
    ms: "Urus data model sepanjang hayat projek"
    id: "Mengelola data model sepanjang proyek"
    hi: "प्रोजेक्ट भर मॉडल डेटा संभालना"
