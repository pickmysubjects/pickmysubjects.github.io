code: ARTS30003
year: 2026
learn:
  en: "Guest researchers each week show a digital method, from text analysis to 3D models, and you try it in hands-on workshops."
  zh: "每周由不同研究者介绍一种数字方法，从文本分析到 3D 建模，你在实践工作坊中亲自尝试。"
  zh-TW: "每週由不同研究者介紹一種數位方法，從文本分析到 3D 建模，你在實作工作坊中親自嘗試。"
  ja: "毎週ゲスト研究者がテキスト分析から3Dモデルまでデジタル手法を紹介し、ワークショップで実際に試す。"
  ko: "매주 초청 연구자가 텍스트 분석부터 3D 모델까지 디지털 방법을 소개하고, 워크숍에서 직접 해 본다."
  vi: "Mỗi tuần một nhà nghiên cứu khách mời giới thiệu một phương pháp số, từ phân tích văn bản đến mô hình 3D, và bạn thực hành."
  ms: "Setiap minggu penyelidik jemputan menunjukkan kaedah digital, dari analisis teks hingga model 3D, dan anda mencubanya di bengkel."
  id: "Tiap minggu peneliti tamu menunjukkan metode digital, dari analisis teks hingga model 3D, dan Anda mencobanya di lokakarya."
  hi: "हर हफ़्ते अतिथि शोधकर्ता टेक्स्ट विश्लेषण से 3D मॉडल तक कोई डिजिटल तरीक़ा दिखाते हैं, और आप वर्कशॉप में आज़माते हैं।"
outcomes:
  - en: "Discuss how digital tools are changing the humanities"
    zh: "讨论数字工具如何改变人文学科"
    zh-TW: "討論數位工具如何改變人文學科"
    ja: "デジタル技術が人文学をどう変えているか論じる"
    ko: "디지털 도구가 인문학을 어떻게 바꾸는지 토론하기"
    vi: "Thảo luận công cụ số đang thay đổi ngành nhân văn ra sao"
    ms: "Bincangkan cara alat digital mengubah bidang kemanusiaan"
    id: "Membahas bagaimana alat digital mengubah humaniora"
    hi: "डिजिटल उपकरण मानविकी को कैसे बदल रहे हैं, इस पर चर्चा करना"
  - en: "Try out a range of research methods hands-on"
    zh: "亲手尝试多种研究方法"
    zh-TW: "親手嘗試多種研究方法"
    ja: "さまざまな研究手法を実際に試す"
    ko: "여러 연구 방법을 직접 해 보기"
    vi: "Thực hành nhiều phương pháp nghiên cứu khác nhau"
    ms: "Cuba pelbagai kaedah penyelidikan secara praktikal"
    id: "Mencoba berbagai metode riset secara langsung"
    hi: "कई शोध तरीक़ों को ख़ुद आज़माना"
  - en: "Write a research essay on a digital method"
    zh: "撰写关于某种数字方法的研究论文"
    zh-TW: "撰寫關於某種數位方法的研究論文"
    ja: "デジタル手法についての研究レポートを書く"
    ko: "디지털 방법에 관한 연구 에세이 쓰기"
    vi: "Viết bài luận nghiên cứu về một phương pháp số"
    ms: "Tulis esei penyelidikan tentang kaedah digital"
    id: "Menulis esai riset tentang suatu metode digital"
    hi: "किसी डिजिटल तरीक़े पर शोध निबंध लिखना"
