code: BOTA30005
year: 2026
learn:
  en: "How plants work at the molecular level and how biotech can improve crops, food security and climate outcomes."
  zh: "植物的分子层面运作，以及生物技术如何改良作物、保障粮食和应对气候。"
  zh-TW: "植物的分子層面運作，以及生物技術如何改良作物、確保糧食並因應氣候。"
  ja: "植物の分子レベルの仕組みと、作物・食料安全保障・気候対策へのバイオ技術の応用。"
  ko: "식물의 분자 수준 작동 원리와, 생명공학으로 작물·식량 안보·기후 문제를 개선하는 법."
  vi: "Cách thực vật hoạt động ở cấp phân tử và công nghệ sinh học cải thiện cây trồng, an ninh lương thực, khí hậu."
  ms: "Cara tumbuhan berfungsi pada tahap molekul dan bagaimana bioteknologi memperbaiki tanaman, makanan dan iklim."
  id: "Cara tumbuhan bekerja di tingkat molekuler dan bagaimana bioteknologi memperbaiki tanaman, pangan, dan iklim."
  hi: "पौधे आणविक स्तर पर कैसे काम करते हैं, और बायोटेक फ़सल, खाद्य सुरक्षा व जलवायु में कैसे मदद करता है।"
outcomes:
  - en: "Run plant molecular biology lab experiments"
    zh: "进行植物分子生物学实验"
    zh-TW: "進行植物分子生物學實驗"
    ja: "植物分子生物学の実験を行う"
    ko: "식물 분자생물학 실험 수행하기"
    vi: "Làm thí nghiệm sinh học phân tử thực vật"
    ms: "Menjalankan eksperimen biologi molekul tumbuhan"
    id: "Melakukan eksperimen biologi molekuler tumbuhan"
    hi: "पौधों की आणविक जीवविज्ञान प्रयोगशाला प्रयोग करना"
  - en: "Apply biotech to farming, forestry and food"
    zh: "将生物技术用于农林和食品"
    zh-TW: "將生物技術應用於農林與食品"
    ja: "農林業や食品にバイオ技術を応用する"
    ko: "농림업과 식품에 생명공학 적용하기"
    vi: "Áp dụng công nghệ sinh học vào nông lâm, thực phẩm"
    ms: "Menggunakan bioteknologi dalam pertanian dan makanan"
    id: "Menerapkan bioteknologi pada pertanian dan pangan"
    hi: "खेती, वानिकी और खाद्य में बायोटेक लागू करना"
  - en: "Weigh the limits of plant biotechnology"
    zh: "评估植物生物技术的局限"
    zh-TW: "評估植物生物技術的侷限"
    ja: "植物バイオ技術の限界を評価する"
    ko: "식물 생명공학의 한계 평가하기"
    vi: "Đánh giá giới hạn của công nghệ sinh học thực vật"
    ms: "Menilai had bioteknologi tumbuhan"
    id: "Menilai keterbatasan bioteknologi tumbuhan"
    hi: "पादप बायोटेक की सीमाओं का आकलन करना"
