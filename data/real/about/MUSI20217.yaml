code: MUSI20217
year: 2026
learn:
  en: "One big research topic in ethnomusicology, looked at through case studies from around the world and across time."
  zh: "聚焦民族音乐学的一个研究主题，通过世界各地、不同时期的案例展开。"
  zh-TW: "聚焦民族音樂學的一個研究主題，透過世界各地、不同時期的案例展開。"
  ja: "民族音楽学の大きなテーマ一つを、世界各地・各時代の事例で掘り下げる。"
  ko: "민족음악학의 큰 연구 주제 하나를 세계 각지·시대의 사례로 탐구."
  vi: "Một chủ đề lớn của dân tộc nhạc học, qua ví dụ từ khắp thế giới và nhiều thời kỳ."
  ms: "Satu topik kajian etnomuzikologi, melalui kajian kes dari seluruh dunia dan zaman."
  id: "Satu topik riset etnomusikologi, lewat studi kasus dari seluruh dunia dan berbagai zaman."
  hi: "एथ्नोम्यूज़िकोलॉजी का एक बड़ा शोध विषय, दुनिया भर और अलग दौर के उदाहरणों से।"
outcomes:
  - en: "Compare how researchers studied music across cultures"
    zh: "比较不同文化中的音乐研究方法"
    zh-TW: "比較不同文化中的音樂研究方法"
    ja: "文化をまたぐ音楽研究の方法を比べる"
    ko: "문화별 음악 연구 방식 비교하기"
    vi: "So sánh cách nghiên cứu âm nhạc ở các nền văn hóa"
    ms: "Bandingkan cara penyelidik mengkaji muzik"
    id: "Membandingkan cara peneliti mengkaji musik"
    hi: "संस्कृतियों में संगीत शोध के तरीके तुलना करना"
  - en: "Read research critically and respond in writing"
    zh: "批判性阅读研究并书面回应"
    zh-TW: "批判性閱讀研究並書面回應"
    ja: "研究文献を批判的に読み、文章で応える"
    ko: "연구를 비판적으로 읽고 글로 답하기"
    vi: "Đọc nghiên cứu có phản biện và viết phản hồi"
    ms: "Baca kajian secara kritis dan balas secara bertulis"
    id: "Membaca riset secara kritis dan menanggapinya tertulis"
    hi: "शोध को आलोचनात्मक रूप से पढ़कर लिखित जवाब देना"
  - en: "Plan and write a research essay on music"
    zh: "规划并撰写一篇音乐研究论文"
    zh-TW: "規劃並撰寫一篇音樂研究論文"
    ja: "音楽に関する研究エッセイを計画し書く"
    ko: "음악에 관한 연구 에세이 기획·작성하기"
    vi: "Lên kế hoạch và viết bài luận nghiên cứu về âm nhạc"
    ms: "Rancang dan tulis esei kajian tentang muzik"
    id: "Merancang dan menulis esai riset tentang musik"
    hi: "संगीत पर शोध निबंध की योजना बनाकर लिखना"
