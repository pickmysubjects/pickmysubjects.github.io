code: ABPL90153
year: 2027
learn:
  en: "Using building energy modelling software to test and argue for innovative energy-efficient designs on a case study."
  zh: "用建筑能耗模拟软件，在案例中检验并论证创新的节能设计。"
  zh-TW: "用建築能耗模擬軟體，在案例中檢驗並論證創新的節能設計。"
  ja: "建物エネルギーシミュレーションで、事例の革新的な省エネ設計を検証し根拠を示す。"
  ko: "건물 에너지 모델링 소프트웨어로 사례의 혁신적 에너지 효율 설계를 검증하고 설명합니다."
  vi: "Dùng phần mềm mô phỏng năng lượng để kiểm tra và bảo vệ thiết kế tiết kiệm năng lượng."
  ms: "Menggunakan perisian pemodelan tenaga bangunan untuk menguji dan menghujahkan reka bentuk cekap tenaga."
  id: "Memakai perangkat lunak pemodelan energi bangunan untuk menguji dan mendukung desain hemat energi."
  hi: "केस स्टडी पर बिल्डिंग ऊर्जा मॉडलिंग सॉफ़्टवेयर से नवीन ऊर्जा-कुशल डिज़ाइन जांचना।"
outcomes:
  - en: "Model natural and mixed-mode ventilation scenarios"
    zh: "模拟自然通风和混合通风情景"
    zh-TW: "模擬自然通風與混合通風情境"
    ja: "自然換気・ハイブリッド換気を解析する"
    ko: "자연 및 혼합 환기 시나리오 모델링하기"
    vi: "Mô phỏng thông gió tự nhiên và hỗn hợp"
    ms: "Memodelkan senario pengudaraan semula jadi"
    id: "Memodelkan skenario ventilasi alami dan campuran"
    hi: "प्राकृतिक व मिश्रित वेंटिलेशन मॉडल करना"
  - en: "Judge the practicality and risk of energy solutions"
    zh: "判断节能方案的可行性和风险"
    zh-TW: "判斷節能方案的可行性與風險"
    ja: "省エネ案の実用性とリスクを判断する"
    ko: "에너지 해법의 실용성과 위험 판단하기"
    vi: "Đánh giá tính khả thi và rủi ro của giải pháp"
    ms: "Menilai kepraktisan dan risiko penyelesaian tenaga"
    id: "Menilai kepraktisan dan risiko solusi energi"
    hi: "ऊर्जा समाधानों की व्यावहारिकता व जोखिम आंकना"
