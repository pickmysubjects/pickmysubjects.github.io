code: PSYC30014
year: 2026
learn:
  en: "Anxiety, depression, hallucinations and similar experiences, seen as a range from everyday life to disorder."
  zh: "焦虑、抑郁、幻觉等体验，从日常到疾病是连续的。"
  zh-TW: "焦慮、憂鬱、幻覺等經驗，從日常生活到疾病是連續的光譜。"
  ja: "不安、うつ、幻覚などの体験を、日常から障害までの連続として捉える。"
  ko: "불안, 우울, 환각 같은 경험을 일상부터 장애까지 이어지는 범위로 봄."
  vi: "Lo âu, trầm cảm, ảo giác và trải nghiệm tương tự, nhìn như một dải từ đời thường đến rối loạn."
  ms: "Kebimbangan, kemurungan, halusinasi dan pengalaman serupa, dilihat sebagai julat dari kehidupan harian ke gangguan."
  id: "Kecemasan, depresi, halusinasi, dan pengalaman serupa, dilihat sebagai rentang dari keseharian hingga gangguan."
  hi: "चिंता, डिप्रेशन, भ्रम जैसे अनुभव, जिन्हें रोज़मर्रा से बीमारी तक एक दायरे के रूप में देखा जाता है।"
outcomes:
  - en: "Compare the category and continuum views of mental illness"
    zh: "比较分类和连续两种心理病观点"
    zh-TW: "比較心理疾病的分類觀和連續觀"
    ja: "精神疾患のカテゴリー説と連続体説を比較する"
    ko: "정신질환의 범주적 관점과 연속적 관점 비교"
    vi: "So sánh quan điểm phân loại và liên tục về bệnh tâm thần"
    ms: "Bandingkan pandangan kategori dan kontinum penyakit mental"
    id: "Membandingkan pandangan kategori dan kontinum gangguan mental"
    hi: "मानसिक बीमारी के कैटेगरी और कंटिन्यूअम नज़रिए की तुलना"
  - en: "Discuss mental health topics sensitively"
    zh: "敏感而尊重地讨论心理健康话题"
    zh-TW: "敏感而尊重地討論心理健康話題"
    ja: "メンタルヘルスの話題に配慮して話し合う"
    ko: "정신 건강 주제를 세심하게 논의"
    vi: "Thảo luận chủ đề sức khỏe tâm thần một cách tế nhị"
    ms: "Bincang topik kesihatan mental dengan sensitif"
    id: "Membahas topik kesehatan mental dengan peka"
    hi: "मानसिक स्वास्थ्य विषयों पर संवेदनशीलता से चर्चा"
  - en: "Build an argument from theory and evidence"
    zh: "用理论和证据构建论点"
    zh-TW: "用理論和證據建構論點"
    ja: "理論と証拠から論証を組み立てる"
    ko: "이론과 근거로 논증 구성"
    vi: "Xây dựng lập luận từ lý thuyết và bằng chứng"
    ms: "Bina hujah daripada teori dan bukti"
    id: "Menyusun argumen dari teori dan bukti"
    hi: "सिद्धांत और सबूत से तर्क बनाना"
