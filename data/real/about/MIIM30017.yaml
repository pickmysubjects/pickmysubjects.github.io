code: MIIM30017
year: 2026
learn:
  en: "Parasites like protists, worms and insects: how they infect people and how to stop them."
  zh: "原虫、蠕虫、昆虫等寄生虫怎么感染人，以及怎么防治。"
  zh-TW: "原蟲、蠕蟲、昆蟲等寄生蟲怎麼感染人，以及怎麼防治。"
  ja: "原生生物・蠕虫・昆虫などの寄生虫：人への感染の仕方と防ぎ方。"
  ko: "원생생물, 기생충, 곤충 같은 기생체: 사람을 감염시키는 방식과 막는 법."
  vi: "Ký sinh trùng như nguyên sinh vật, giun và côn trùng: cách chúng lây cho người và cách ngăn chặn."
  ms: "Parasit seperti protista, cacing dan serangga: cara ia menjangkiti manusia dan cara menghalangnya."
  id: "Parasit seperti protista, cacing, dan serangga: cara mereka menginfeksi manusia dan cara mencegahnya."
  hi: "प्रोटिस्ट, कृमि और कीड़ों जैसे परजीवी: ये लोगों को कैसे संक्रमित करते हैं और इन्हें कैसे रोकें।"
outcomes:
  - en: "Describe parasite life cycles and how they spread"
    zh: "描述寄生虫的生命周期和传播"
    zh-TW: "描述寄生蟲的生命週期和傳播"
    ja: "寄生虫の生活環と広がり方を説明する"
    ko: "기생충의 생활사와 전파 방식 설명하기"
    vi: "Mô tả vòng đời và cách lây lan của ký sinh trùng"
    ms: "Menghuraikan kitaran hidup parasit dan cara ia merebak"
    id: "Menjelaskan siklus hidup parasit dan cara penyebarannya"
    hi: "परजीवियों का जीवन चक्र और फैलाव बताना"
  - en: "Recommend ways to prevent and treat infections"
    zh: "提出预防和治疗感染的办法"
    zh-TW: "提出預防和治療感染的辦法"
    ja: "感染の予防と治療の方法を提案する"
    ko: "감염 예방 및 치료 방법 제안하기"
    vi: "Đề xuất cách phòng và điều trị nhiễm trùng"
    ms: "Mencadangkan cara mencegah dan merawat jangkitan"
    id: "Merekomendasikan cara mencegah dan mengobati infeksi"
    hi: "संक्रमण की रोकथाम और इलाज के तरीके सुझाना"
  - en: "Identify parasites in the lab"
    zh: "在实验室鉴定寄生虫"
    zh-TW: "在實驗室鑑定寄生蟲"
    ja: "実験室で寄生虫を同定する"
    ko: "실험실에서 기생충 동정하기"
    vi: "Định danh ký sinh trùng trong phòng thí nghiệm"
    ms: "Mengenal pasti parasit di makmal"
    id: "Mengidentifikasi parasit di lab"
    hi: "लैब में परजीवियों की पहचान"
