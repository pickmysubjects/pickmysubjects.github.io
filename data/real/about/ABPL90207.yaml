code: ABPL90207
year: 2027
learn:
  en: "Strategy, finance, leadership and innovation in construction companies, studied through research and business case studies."
  zh: "通过研究和商学院案例，学习建筑企业的战略、财务、领导力和创新。"
  zh-TW: "透過研究與商學院個案，學習營建企業的策略、財務、領導與創新。"
  ja: "建設会社の戦略・財務・リーダーシップ・イノベーションをケーススタディで学ぶ。"
  ko: "건설 기업의 전략·재무·리더십·혁신을 연구와 사례로 학습."
  vi: "Chiến lược, tài chính, lãnh đạo và đổi mới trong công ty xây dựng, qua nghiên cứu tình huống."
  ms: "Strategi, kewangan, kepimpinan dan inovasi syarikat pembinaan melalui kajian kes."
  id: "Strategi, keuangan, kepemimpinan dan inovasi perusahaan konstruksi lewat studi kasus."
  hi: "निर्माण कंपनियों में रणनीति, वित्त, नेतृत्व और नवाचार, केस स्टडी के ज़रिए।"
outcomes:
  - en: "Compare strategies construction firms use to compete"
    zh: "比较建筑企业的竞争战略"
    zh-TW: "比較營建企業的競爭策略"
    ja: "建設会社の競争戦略を比べる"
    ko: "건설사의 경쟁 전략 비교하기"
    vi: "So sánh chiến lược cạnh tranh của công ty xây dựng"
    ms: "Membanding strategi persaingan firma pembinaan"
    id: "Membandingkan strategi bersaing perusahaan konstruksi"
    hi: "निर्माण कंपनियों की प्रतिस्पर्धी रणनीतियों की तुलना"
  - en: "Analyse a construction company through a case study"
    zh: "用案例分析一家建筑企业"
    zh-TW: "用個案分析一家營建企業"
    ja: "事例を通じて建設会社を分析する"
    ko: "사례로 건설 기업 분석하기"
    vi: "Phân tích một công ty xây dựng qua tình huống"
    ms: "Menganalisis syarikat pembinaan melalui kajian kes"
    id: "Menganalisis perusahaan konstruksi lewat studi kasus"
    hi: "केस स्टडी से निर्माण कंपनी का विश्लेषण"
