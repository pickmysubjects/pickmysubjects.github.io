code: ANCW10001
year: 2026
learn:
  en: "The archaeology, history and literature of the first civilisations in Egypt and Mesopotamia, and their neighbours."
  zh: "埃及和美索不达米亚这些最早文明及其邻邦的考古、历史与文学。"
  zh-TW: "埃及和美索不達米亞這些最早文明及其鄰邦的考古、歷史與文學。"
  ja: "エジプトとメソポタミアという最古の文明とその周辺の考古学・歴史・文学を学ぶ。"
  ko: "이집트와 메소포타미아라는 최초 문명과 그 이웃의 고고학, 역사, 문학을 배운다."
  vi: "Khảo cổ, lịch sử và văn học của các nền văn minh đầu tiên ở Ai Cập, Lưỡng Hà và các vùng lân cận."
  ms: "Arkeologi, sejarah dan sastera tamadun terawal di Mesir dan Mesopotamia serta jirannya."
  id: "Arkeologi, sejarah, dan sastra peradaban pertama di Mesir dan Mesopotamia serta tetangganya."
  hi: "मिस्र और मेसोपोटामिया की पहली सभ्यताओं और उनके पड़ोसियों का पुरातत्व, इतिहास और साहित्य।"
outcomes:
  - en: "Describe the main features of each civilisation"
    zh: "描述两大文明的主要特征"
    zh-TW: "描述兩大文明的主要特徵"
    ja: "それぞれの文明の主な特徴を説明する"
    ko: "각 문명의 주요 특징 설명하기"
    vi: "Mô tả các đặc điểm chính của mỗi nền văn minh"
    ms: "Huraikan ciri utama setiap tamadun"
    id: "Mendeskripsikan ciri utama tiap peradaban"
    hi: "हर सभ्यता की मुख्य विशेषताओं का वर्णन करना"
  - en: "Compare their art, myths and institutions"
    zh: "比较它们的艺术、神话和制度"
    zh-TW: "比較它們的藝術、神話和制度"
    ja: "両者の美術・神話・制度を比べる"
    ko: "두 문명의 예술, 신화, 제도 비교하기"
    vi: "So sánh nghệ thuật, thần thoại và thể chế của chúng"
    ms: "Bandingkan seni, mitos dan institusi mereka"
    id: "Membandingkan seni, mitos, dan lembaga keduanya"
    hi: "उनकी कला, मिथकों और संस्थाओं की तुलना करना"
  - en: "Use archaeological and written evidence"
    zh: "运用考古与文字证据"
    zh-TW: "運用考古與文字證據"
    ja: "考古資料と文字資料を使う"
    ko: "고고학 자료와 문헌 증거 활용하기"
    vi: "Sử dụng bằng chứng khảo cổ và văn tự"
    ms: "Gunakan bukti arkeologi dan bertulis"
    id: "Memakai bukti arkeologis dan tertulis"
    hi: "पुरातात्विक और लिखित साक्ष्यों का उपयोग करना"
