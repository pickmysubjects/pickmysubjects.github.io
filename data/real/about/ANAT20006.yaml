code: ANAT20006
year: 2026
learn:
  en: "An overview of the human body: its main structures, organ systems and how they look on medical images."
  zh: "人体解剖概览：主要结构、器官系统和它们在医学影像上的样子。"
outcomes:
  - en: "Use the basic terms of human anatomy"
    zh: "掌握人体解剖的基本术语"
  - en: "Identify structures on cadaver specimens"
    zh: "在尸体标本上辨认结构"
  - en: "Describe body structure in writing and speech"
    zh: "用文字和口头描述人体结构"
