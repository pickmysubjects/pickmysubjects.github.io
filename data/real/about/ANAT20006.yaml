code: ANAT20006
year: 2026
learn:
  en: "An overview of the human body: its main structures, organ systems and how they look on medical images."
  zh: "人体解剖概览：主要结构、器官系统和它们在医学影像上的样子。"
  zh-TW: "人體解剖概覽：主要結構、器官系統和它們在醫學影像上的樣子。"
  ja: "人体の概要：主な構造、器官系、医用画像での見え方。"
  ko: "인체 개요: 주요 구조, 기관계, 의료 영상에서 보이는 모습."
  vi: "Tổng quan cơ thể người: cấu trúc chính, hệ cơ quan và hình ảnh trên ảnh y khoa."
  ms: "Gambaran tubuh manusia: struktur utama, sistem organ dan rupanya dalam imej perubatan."
  id: "Gambaran tubuh manusia: struktur utama, sistem organ, dan tampilannya di citra medis."
  hi: "मानव शरीर का ओवरव्यू: मुख्य संरचनाएँ, अंग-तंत्र और मेडिकल इमेज में वे कैसे दिखते हैं।"
outcomes:
  - en: "Use the basic terms of human anatomy"
    zh: "掌握人体解剖的基本术语"
    zh-TW: "掌握人體解剖的基本術語"
    ja: "人体解剖学の基本用語を使う"
    ko: "인체 해부학 기본 용어 사용하기"
    vi: "Dùng thuật ngữ cơ bản của giải phẫu người"
    ms: "Guna istilah asas anatomi manusia"
    id: "Memakai istilah dasar anatomi manusia"
    hi: "मानव एनाटॉमी के बुनियादी शब्द इस्तेमाल करना"
  - en: "Identify structures on cadaver specimens"
    zh: "在尸体标本上辨认结构"
    zh-TW: "在大體標本上辨認結構"
    ja: "献体標本で構造を見分ける"
    ko: "카데바 표본에서 구조 식별하기"
    vi: "Nhận diện cấu trúc trên mẫu tử thi"
    ms: "Kenal pasti struktur pada spesimen kadaver"
    id: "Mengenali struktur pada spesimen kadaver"
    hi: "कैडेवर नमूनों पर संरचनाएँ पहचानना"
  - en: "Describe body structure in writing and speech"
    zh: "用文字和口头描述人体结构"
    zh-TW: "用文字和口頭描述人體結構"
    ja: "体の構造を文章と口頭で説明する"
    ko: "신체 구조를 글과 말로 설명하기"
    vi: "Mô tả cấu trúc cơ thể bằng viết và nói"
    ms: "Huraikan struktur badan secara bertulis dan lisan"
    id: "Menjelaskan struktur tubuh secara tulisan dan lisan"
    hi: "शरीर की संरचना लिखकर और बोलकर बताना"
