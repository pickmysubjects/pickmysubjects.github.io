code: MKTG90040
year: 2027
learn:
  en: "How sales creates value: salesperson roles, pricing, value-based selling, and writing a sales plan and pitch."
  zh: "销售如何创造价值：销售人员角色、定价、价值销售，以及撰写销售计划和推介。"
  zh-TW: "銷售如何創造價值：業務人員角色、定價、價值銷售，以及撰寫銷售計畫與提案簡報。"
  ja: "営業が価値を生む仕組み：営業の役割、価格設定、価値型営業、営業計画とピッチの作成。"
  ko: "영업이 가치를 만드는 방식: 영업 역할, 가격 책정, 가치 기반 영업, 영업 계획과 피치 작성."
  vi: "Bán hàng tạo giá trị thế nào: vai trò người bán, định giá, bán hàng dựa trên giá trị, viết kế hoạch và bài chào hàng."
  ms: "Cara jualan mencipta nilai: peranan jurujual, harga, jualan berasaskan nilai, menulis pelan jualan dan pitch."
  id: "Cara penjualan menciptakan nilai: peran tenaga penjual, harga, penjualan berbasis nilai, rencana dan pitch penjualan."
  hi: "बिक्री मूल्य कैसे बनाती है: सेल्सपर्सन की भूमिकाएँ, कीमत, वैल्यू-आधारित बिक्री, सेल्स प्लान और पिच लिखना।"
outcomes:
  - en: "Create a sales plan and pitch"
    zh: "制定销售计划和推介"
    zh-TW: "制定銷售計畫與提案簡報"
    ja: "営業計画とピッチを作る"
    ko: "영업 계획과 피치 만들기"
    vi: "Lập kế hoạch bán hàng và bài chào hàng"
    ms: "Membina pelan jualan dan pitch"
    id: "Membuat rencana dan pitch penjualan"
    hi: "सेल्स प्लान और पिच तैयार करना"
  - en: "Manage the sales process end to end"
    zh: "全程管理销售流程"
    zh-TW: "全程管理銷售流程"
    ja: "営業プロセスを最初から最後まで管理する"
    ko: "영업 과정 전체 관리하기"
    vi: "Quản lý quy trình bán hàng từ đầu đến cuối"
    ms: "Mengurus proses jualan dari mula hingga akhir"
    id: "Mengelola proses penjualan dari awal hingga akhir"
    hi: "बिक्री प्रक्रिया शुरू से अंत तक संभालना"
