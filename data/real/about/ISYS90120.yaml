code: ISYS90120
year: 2027
learn:
  en: "Real-world teaching cases on the management side of cybersecurity in organisations, debated in class."
  zh: "通过真实案例，在课堂讨论组织中网络安全的管理问题。"
  zh-TW: "透過真實個案，在課堂討論組織中資安的管理問題。"
  ja: "実例ケースを通じ、組織のサイバーセキュリティ管理を授業で議論する。"
  ko: "실제 사례로 조직의 사이버보안 관리 문제를 수업에서 토론."
  vi: "Các tình huống thực tế về quản lý an ninh mạng trong tổ chức, thảo luận trên lớp."
  ms: "Kes pengajaran sebenar tentang pengurusan keselamatan siber dalam organisasi, dibincang di kelas."
  id: "Kasus nyata tentang sisi manajemen keamanan siber di organisasi, didiskusikan di kelas."
  hi: "संगठनों में साइबर सुरक्षा प्रबंधन के असली केस, कक्षा में चर्चा के साथ।"
outcomes:
  - en: "Analyse cybersecurity risks in a real organisation case"
    zh: "分析真实组织案例中的网络安全风险"
    zh-TW: "分析真實組織個案中的資安風險"
    ja: "実際の組織事例でセキュリティリスクを分析する"
    ko: "실제 조직 사례의 사이버보안 위험 분석하기"
    vi: "Phân tích rủi ro an ninh mạng trong tình huống thật"
    ms: "Menganalisis risiko keselamatan siber dalam kes organisasi sebenar"
    id: "Menganalisis risiko keamanan siber pada kasus nyata"
    hi: "असली संगठन केस में साइबर जोखिमों का विश्लेषण करना"
  - en: "Argue a management position on a security problem"
    zh: "就安全问题提出并论证管理观点"
    zh-TW: "就資安問題提出並論證管理觀點"
    ja: "セキュリティ問題に対する管理上の立場を論じる"
    ko: "보안 문제에 대한 관리 관점 주장하기"
    vi: "Lập luận quan điểm quản lý cho một vấn đề bảo mật"
    ms: "Mempertahankan pendirian pengurusan bagi masalah keselamatan"
    id: "Mengemukakan argumen manajemen atas masalah keamanan"
    hi: "सुरक्षा समस्या पर प्रबंधन का पक्ष तर्क से रखना"
