code: MCEN90029
year: 2027
learn:
  en: "3D stress and strain, plasticity, fatigue, fracture and creep, with examples from biomechanics research."
  zh: "三维应力应变、塑性、疲劳、断裂和蠕变，并结合生物力学研究案例。"
  zh-TW: "三維應力應變、塑性、疲勞、破壞與潛變，並結合生物力學研究案例。"
  ja: "三次元の応力・ひずみ、塑性、疲労、破壊、クリープを生体力学研究の例とともに。"
  ko: "3차원 응력·변형률, 소성, 피로, 파괴, 크리프와 생체역학 연구 사례."
  vi: "Ứng suất, biến dạng 3D, dẻo, mỏi, nứt gãy, rão, với ví dụ cơ sinh học."
  ms: "Tegasan dan terikan 3D, keplastikan, lesu, patah dan rayapan, dengan contoh biomekanik."
  id: "Tegangan dan regangan 3D, plastisitas, kelelahan, patahan, dan rangkak, dengan contoh biomekanika."
  hi: "3D प्रतिबल-विकृति, प्लास्टिसिटी, थकान, भंग और क्रीप, बायोमैकेनिक्स उदाहरणों के साथ।"
outcomes:
  - en: "Solve 3D stress and strain problems analytically or numerically"
    zh: "用解析或数值方法求解三维应力应变问题"
    zh-TW: "用解析或數值方法求解三維應力應變問題"
    ja: "三次元応力・ひずみ問題を解析的・数値的に解く"
    ko: "3차원 응력·변형률 문제를 해석적·수치적으로 풀기"
    vi: "Giải bài toán ứng suất, biến dạng 3D bằng giải tích hoặc số"
    ms: "Menyelesaikan masalah tegasan dan terikan 3D secara analitik atau berangka"
    id: "Menyelesaikan masalah tegangan dan regangan 3D secara analitik atau numerik"
    hi: "3D प्रतिबल-विकृति समस्याएँ विश्लेषणात्मक या संख्यात्मक रूप से हल करना"
  - en: "Run strain gauge experiments and apply failure criteria"
    zh: "做应变片实验并运用失效准则"
    zh-TW: "做應變規實驗並運用破壞準則"
    ja: "ひずみゲージ実験を行い破壊基準を適用する"
    ko: "스트레인 게이지 실험과 파손 기준 적용하기"
    vi: "Làm thí nghiệm tenzo và áp dụng tiêu chí phá hủy"
    ms: "Menjalankan eksperimen tolok terikan dan menggunakan kriteria kegagalan"
    id: "Melakukan eksperimen strain gauge dan menerapkan kriteria kegagalan"
    hi: "स्ट्रेन गेज प्रयोग और विफलता मानदंड लागू करना"
