code: MGMT90015
year: 2027
learn:
  en: "The core HR practices: attracting and keeping staff, developing them, and assessing and rewarding performance."
  zh: "人力资源核心实务：吸引和留住员工、培养员工、评估并奖励绩效。"
  zh-TW: "人力資源核心實務：吸引與留任員工、培育員工、評估並獎酬績效。"
  ja: "人事の基本：人材の確保と定着、育成、業績の評価と報酬。"
  ko: "인사관리의 핵심: 인재 확보와 유지, 육성, 성과 평가와 보상."
  vi: "Các hoạt động nhân sự cốt lõi: thu hút, giữ chân, phát triển nhân viên, đánh giá và khen thưởng hiệu suất."
  ms: "Amalan teras HR: menarik dan mengekalkan pekerja, membangunkan mereka, menilai dan memberi ganjaran prestasi."
  id: "Praktik inti SDM: menarik dan mempertahankan karyawan, mengembangkan, menilai dan memberi imbalan kinerja."
  hi: "HR के मुख्य काम: कर्मचारियों को लाना और रोकना, उन्हें विकसित करना, प्रदर्शन आँकना और पुरस्कृत करना।"
outcomes:
  - en: "Link HR strategy to organisational performance"
    zh: "把人力资源战略与组织绩效联系起来"
    zh-TW: "將人資策略與組織績效連結起來"
    ja: "人事戦略と組織業績を結びつける"
    ko: "인사 전략과 조직 성과 연결하기"
    vi: "Gắn chiến lược nhân sự với hiệu quả tổ chức"
    ms: "Mengaitkan strategi HR dengan prestasi organisasi"
    id: "Mengaitkan strategi SDM dengan kinerja organisasi"
    hi: "HR रणनीति को संगठन के प्रदर्शन से जोड़ना"
  - en: "Apply HR research to case study problems"
    zh: "将人力资源研究用于案例问题"
    zh-TW: "將人資研究應用於個案問題"
    ja: "人事の研究をケース課題に応用する"
    ko: "인사 연구를 사례 문제에 적용하기"
    vi: "Áp dụng nghiên cứu nhân sự vào tình huống"
    ms: "Menggunakan kajian HR pada masalah kajian kes"
    id: "Menerapkan riset SDM pada masalah studi kasus"
    hi: "HR शोध को केस स्टडी की समस्याओं पर लागू करना"
