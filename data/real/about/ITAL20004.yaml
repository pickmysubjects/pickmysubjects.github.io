code: ITAL20004
year: 2026
learn:
  en: "Three weeks in Italy (Florence, Sorrento, Rome) studying language, society and the arts alongside local Italians."
  zh: "在意大利三周（佛罗伦萨、索伦托、罗马），与当地人一起学语言、社会和艺术。"
  zh-TW: "在義大利三週（佛羅倫斯、索倫托、羅馬），與當地人一起學語言、社會和藝術。"
  ja: "イタリアで3週間（フィレンツェ、ソレント、ローマ）。地元の人と共に言語・社会・芸術を学ぶ。"
  ko: "이탈리아에서 3주(피렌체, 소렌토, 로마). 현지인과 함께 언어·사회·예술을 배운다."
  vi: "Ba tuần ở Ý (Florence, Sorrento, Rome) học ngôn ngữ, xã hội và nghệ thuật cùng người dân địa phương."
  ms: "Tiga minggu di Itali (Florence, Sorrento, Rom) mempelajari bahasa, masyarakat dan seni bersama penduduk tempatan."
  id: "Tiga minggu di Italia (Florence, Sorrento, Roma) mempelajari bahasa, masyarakat dan seni bersama warga lokal."
  hi: "इटली में तीन हफ़्ते (फ़्लोरेंस, सोरेंटो, रोम): स्थानीय लोगों के साथ भाषा, समाज और कला सीखना।"
outcomes:
  - en: "Use Italian in everyday life in Italy"
    zh: "在意大利的日常生活中使用意大利语"
    zh-TW: "在義大利的日常生活中使用義大利語"
    ja: "イタリアでの日常生活でイタリア語を使う"
    ko: "이탈리아 일상생활에서 이탈리아어 쓰기"
    vi: "Dùng tiếng Ý trong đời sống hằng ngày ở Ý"
    ms: "Guna bahasa Itali dalam kehidupan harian di Itali"
    id: "Memakai bahasa Italia dalam keseharian di Italia"
    hi: "इटली में रोज़मर्रा की ज़िंदगी में इतालवी इस्तेमाल करना"
  - en: "Work on group activities with local Italians"
    zh: "与当地意大利人合作完成活动"
    zh-TW: "與當地義大利人合作完成活動"
    ja: "地元のイタリア人と共同で活動する"
    ko: "현지 이탈리아인과 함께 활동하기"
    vi: "Hoạt động nhóm cùng người Ý địa phương"
    ms: "Jalankan aktiviti bersama penduduk Itali tempatan"
    id: "Berkegiatan bersama warga Italia setempat"
    hi: "स्थानीय इतालवियों के साथ समूह गतिविधियाँ करना"
  - en: "Discuss contemporary Italian society and art"
    zh: "讨论当代意大利社会和艺术"
    zh-TW: "討論當代義大利社會和藝術"
    ja: "現代イタリアの社会と芸術について話し合う"
    ko: "현대 이탈리아 사회와 예술 토론하기"
    vi: "Thảo luận xã hội và nghệ thuật Ý đương đại"
    ms: "Bincangkan masyarakat dan seni Itali kini"
    id: "Membahas masyarakat dan seni Italia masa kini"
    hi: "आज के इतालवी समाज और कला पर चर्चा करना"
