code: ITAL20004
year: 2026
learn:
  en: "Studying in Italy: daily life, language and current issues in contemporary Italy, seen up close."
  zh: "在意大利学习：近距离了解当代意大利的日常生活、语言和时事。"
  zh-TW: "在義大利學習：近距離了解當代義大利的日常生活、語言和時事。"
  ja: "イタリアで学ぶ。現代イタリアの日常生活・言葉・時事を間近で見る。"
  ko: "이탈리아에서 공부하며 현대 이탈리아의 일상·언어·시사를 가까이서 본다."
  vi: "Học tại Ý: đời sống, ngôn ngữ và vấn đề thời sự của Ý đương đại, nhìn tận nơi."
  ms: "Belajar di Itali: kehidupan harian, bahasa dan isu semasa Itali kini, dilihat dari dekat."
  id: "Belajar di Italia: kehidupan sehari-hari, bahasa dan isu terkini Italia masa kini, dilihat dari dekat."
  hi: "इटली में पढ़ाई: आज के इटली का रोज़मर्रा का जीवन, भाषा और ताज़ा मुद्दे, क़रीब से।"
outcomes:
  - en: "Use Italian in everyday life in Italy"
    zh: "在意大利的日常生活中使用意大利语"
    zh-TW: "在義大利的日常生活中使用義大利語"
    ja: "イタリアでの日常生活でイタリア語を使う"
    ko: "이탈리아 일상생활에서 이탈리아어 쓰기"
    vi: "Dùng tiếng Ý trong đời sống hằng ngày ở Ý"
    ms: "Guna bahasa Itali dalam kehidupan harian di Itali"
    id: "Memakai bahasa Italia dalam keseharian di Italia"
    hi: "इटली में रोज़मर्रा की ज़िंदगी में इतालवी इस्तेमाल करना"
  - en: "Explain current issues in Italian society"
    zh: "说明意大利社会的时事问题"
    zh-TW: "說明義大利社會的時事問題"
    ja: "イタリア社会の時事問題を説明する"
    ko: "이탈리아 사회의 시사 문제 설명하기"
    vi: "Giải thích các vấn đề thời sự của xã hội Ý"
    ms: "Terangkan isu semasa masyarakat Itali"
    id: "Menjelaskan isu terkini masyarakat Italia"
    hi: "इतालवी समाज के ताज़ा मुद्दे समझाना"
  - en: "Complete a group project on life in Italy"
    zh: "完成关于意大利生活的小组项目"
    zh-TW: "完成關於義大利生活的小組專題"
    ja: "イタリアの暮らしについてグループ課題をする"
    ko: "이탈리아 생활에 관한 그룹 프로젝트 하기"
    vi: "Làm dự án nhóm về cuộc sống ở Ý"
    ms: "Siapkan projek berkumpulan tentang kehidupan di Itali"
    id: "Menyelesaikan proyek kelompok tentang hidup di Italia"
    hi: "इटली के जीवन पर समूह परियोजना पूरी करना"
