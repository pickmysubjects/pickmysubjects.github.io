code: MAST10024
year: 2026
learn:
  en: "Maths models and statistics for biomedicine, from cell processes to disease spread and experiment design."
  zh: "面向生物医学的数学模型与统计：从细胞过程到疾病传播和实验设计。"
  zh-TW: "面向生物醫學的數學模型與統計：從細胞過程到疾病傳播和實驗設計。"
  ja: "細胞過程から感染症の広がり、実験計画まで、生物医学の数理モデルと統計。"
  ko: "세포 과정부터 감염병 확산, 실험 설계까지 생물의학을 위한 수학 모델과 통계."
  vi: "Mô hình toán và thống kê cho y sinh, từ quá trình tế bào đến lây lan dịch bệnh và thiết kế thí nghiệm."
  ms: "Model matematik dan statistik untuk bioperubatan, dari proses sel hingga penyebaran penyakit."
  id: "Model matematika dan statistika untuk biomedis, dari proses sel hingga penyebaran penyakit."
  hi: "जैव-चिकित्सा के लिए गणितीय मॉडल और सांख्यिकी: कोशिका प्रक्रियाओं से रोग प्रसार और प्रयोग डिज़ाइन तक।"
outcomes:
  - en: "Apply maths reasoning to biomedical problems"
    zh: "用数学推理解决生物医学问题"
    zh-TW: "用數學推理解決生物醫學問題"
    ja: "生物医学の問題に数学的推論を使う"
    ko: "생물의학 문제에 수학적 추론을 적용한다"
    vi: "Áp dụng suy luận toán học vào bài toán y sinh"
    ms: "Gunakan penaakulan matematik dalam masalah bioperubatan"
    id: "Menerapkan penalaran matematis pada masalah biomedis"
    hi: "जैव-चिकित्सा समस्याओं पर गणितीय तर्क लागू करें"
  - en: "Apply standard statistical methods to data"
    zh: "对数据运用标准统计方法"
    zh-TW: "對資料運用標準統計方法"
    ja: "データに標準的な統計手法を使う"
    ko: "데이터에 표준 통계 기법을 적용한다"
    vi: "Áp dụng phương pháp thống kê chuẩn cho dữ liệu"
    ms: "Gunakan kaedah statistik standard pada data"
    id: "Menerapkan metode statistik standar pada data"
    hi: "डेटा पर मानक सांख्यिकीय विधियाँ लागू करें"
  - en: "Choose a suitable experimental design"
    zh: "选择合适的实验设计"
    zh-TW: "選擇合適的實驗設計"
    ja: "適切な実験計画を選ぶ"
    ko: "적절한 실험 설계를 선택한다"
    vi: "Chọn thiết kế thí nghiệm phù hợp"
    ms: "Pilih reka bentuk eksperimen yang sesuai"
    id: "Memilih desain eksperimen yang sesuai"
    hi: "उपयुक्त प्रयोग डिज़ाइन चुनें"
