code: INDO10012
year: 2026
learn:
  en: "Modern Indonesian novels, short stories, feature films and documentaries, from nationalism to today. Taught in Indonesian."
  zh: "阅读和观看印尼现代小说、短篇、剧情片和纪录片，从民族主义时期至今。用印尼语授课。"
  zh-TW: "閱讀和觀看印尼現代小說、短篇、劇情片和紀錄片，從民族主義時期至今。用印尼語授課。"
  ja: "民族主義の時代から現在までのインドネシアの小説、短編、劇映画、ドキュメンタリー。授業はインドネシア語。"
  ko: "민족주의 시기부터 오늘날까지의 인도네시아 소설, 단편, 극영화, 다큐멘터리. 인도네시아어 수업."
  vi: "Tiểu thuyết, truyện ngắn, phim truyện và phim tài liệu Indonesia hiện đại, từ thời dân tộc chủ nghĩa đến nay. Dạy bằng tiếng Indonesia."
  ms: "Novel, cerpen, filem cereka dan dokumentari Indonesia moden, dari era nasionalis hingga kini. Diajar dalam bahasa Indonesia."
  id: "Novel, cerpen, film cerita dan dokumenter Indonesia modern, dari masa pergerakan nasional hingga kini. Diajarkan dalam bahasa Indonesia."
  hi: "राष्ट्रवादी दौर से आज तक के आधुनिक इंडोनेशियाई उपन्यास, कहानियाँ, फ़िल्में और वृत्तचित्र। इंडोनेशियाई में पढ़ाया जाता है।"
outcomes:
  - en: "Analyse Indonesian novels, stories and films"
    zh: "分析印尼的小说、短篇和电影"
    zh-TW: "分析印尼的小說、短篇和電影"
    ja: "インドネシアの小説、短編、映画を分析する"
    ko: "인도네시아 소설, 단편, 영화 분석하기"
    vi: "Phân tích tiểu thuyết, truyện và phim Indonesia"
    ms: "Analisis novel, cerpen dan filem Indonesia"
    id: "Menganalisis novel, cerpen dan film Indonesia"
    hi: "इंडोनेशियाई उपन्यासों, कहानियों और फ़िल्मों का विश्लेषण करना"
  - en: "Connect works to changes in Indonesian society"
    zh: "把作品与印尼社会变迁联系起来"
    zh-TW: "把作品與印尼社會變遷聯繫起來"
    ja: "作品をインドネシア社会の変化と結びつける"
    ko: "작품을 인도네시아 사회 변화와 연결하기"
    vi: "Liên hệ tác phẩm với biến đổi xã hội Indonesia"
    ms: "Kaitkan karya dengan perubahan masyarakat Indonesia"
    id: "Mengaitkan karya dengan perubahan masyarakat Indonesia"
    hi: "रचनाओं को इंडोनेशियाई समाज के बदलावों से जोड़ना"
  - en: "Present and write about them in Indonesian"
    zh: "用印尼语进行报告和写作"
    zh-TW: "用印尼語進行報告和寫作"
    ja: "インドネシア語で発表し、文章を書く"
    ko: "인도네시아어로 발표하고 글쓰기"
    vi: "Thuyết trình và viết về chúng bằng tiếng Indonesia"
    ms: "Bentang dan tulis tentangnya dalam bahasa Indonesia"
    id: "Mempresentasikan dan menulisnya dalam bahasa Indonesia"
    hi: "इंडोनेशियाई में उन पर प्रस्तुति देना और लिखना"
