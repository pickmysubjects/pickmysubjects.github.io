code: CVEN90051
year: 2027
learn:
  en: "Water flow in rivers and channels, coastal waves, and how sediment moves."
  zh: "河道和渠道中的水流、海岸波浪以及泥沙输运。"
  zh-TW: "河道與渠道中的水流、海岸波浪以及泥沙輸送。"
  ja: "河川・水路の流れ、沿岸の波、土砂の移動。"
  ko: "하천과 수로의 흐름, 해안 파랑, 유사 이동."
  vi: "Dòng chảy trong sông và kênh, sóng ven biển và vận chuyển bùn cát."
  ms: "Aliran air di sungai dan saluran, ombak pantai dan pergerakan sedimen."
  id: "Aliran air di sungai dan saluran, gelombang pantai dan pergerakan sedimen."
  hi: "नदियों और नहरों में पानी का बहाव, तटीय लहरें और तलछट का बहना।"
outcomes:
  - en: "Analyse flow and water levels in natural and built channels"
    zh: "分析天然和人工渠道中的水流与水位"
    zh-TW: "分析天然與人工渠道中的水流與水位"
    ja: "自然・人工水路の流れと水位を解析する"
    ko: "자연·인공 수로의 흐름과 수위 해석하기"
    vi: "Phân tích dòng chảy và mực nước trong kênh tự nhiên và nhân tạo"
    ms: "Menganalisis aliran dan paras air dalam saluran semula jadi dan binaan"
    id: "Menganalisis aliran dan muka air di saluran alami dan buatan"
    hi: "प्राकृतिक और निर्मित नहरों में बहाव और जल स्तर का विश्लेषण"
  - en: "Predict sediment transport and riverbed change"
    zh: "预测泥沙输运和河床变化"
    zh-TW: "預測泥沙輸送與河床變化"
    ja: "土砂輸送と河床変動を予測する"
    ko: "유사 이동과 하상 변화 예측하기"
    vi: "Dự báo vận chuyển bùn cát và biến đổi lòng sông"
    ms: "Meramal pengangkutan sedimen dan perubahan dasar sungai"
    id: "Memprediksi angkutan sedimen dan perubahan dasar sungai"
    hi: "तलछट परिवहन और नदी तल में बदलाव का पूर्वानुमान"
  - en: "Predict wave behaviour and breaking near the shore"
    zh: "预测近岸波浪的变化和破碎"
    zh-TW: "預測近岸波浪的變化與碎波"
    ja: "沿岸での波の変形と砕波を予測する"
    ko: "연안에서 파랑 변형과 쇄파 예측하기"
    vi: "Dự báo diễn biến và sóng vỡ gần bờ"
    ms: "Meramal kelakuan ombak dan pecahan ombak berhampiran pantai"
    id: "Memprediksi perilaku dan pecahnya gelombang dekat pantai"
    hi: "तट के पास लहरों के व्यवहार और टूटने का पूर्वानुमान"
