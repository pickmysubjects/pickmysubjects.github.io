code: ECOM30003
year: 2026
learn:
  en: "Building and testing econometric models of individual choices using cross-section and panel data in Stata."
  zh: "用Stata和截面、面板数据，建立并检验个体选择的计量模型。"
  zh-TW: "用Stata和橫斷面、追蹤資料，建立並檢定個體選擇的計量模型。"
  ja: "Stataでクロスセクション・パネルデータを使い、個人の選択の計量モデルを作り検証する。"
  ko: "Stata와 횡단면·패널 데이터로 개인 선택의 계량모형 구축·검정."
  vi: "Xây và kiểm định mô hình kinh tế lượng về lựa chọn cá nhân bằng dữ liệu chéo và dữ liệu bảng trong Stata."
  ms: "Bina dan uji model ekonometrik pilihan individu guna data keratan rentas dan panel dalam Stata."
  id: "Membangun dan menguji model ekonometrika pilihan individu dengan data silang dan panel di Stata."
  hi: "Stata में क्रॉस-सेक्शन और पैनल डेटा से व्यक्तिगत फ़ैसलों के इकोनोमेट्रिक मॉडल बनाना और जाँचना।"
outcomes:
  - en: "Pick and apply the right model for micro data"
    zh: "为微观数据选择并应用合适模型"
    zh-TW: "為個體資料選擇並套用合適模型"
    ja: "ミクロデータに合うモデルを選んで使う"
    ko: "미시 데이터에 맞는 모형 선택·적용"
    vi: "Chọn và áp dụng mô hình phù hợp cho dữ liệu vi mô"
    ms: "Pilih dan guna model yang sesuai untuk data mikro"
    id: "Memilih dan menerapkan model yang tepat untuk data mikro"
    hi: "माइक्रो डेटा के लिए सही मॉडल चुनना और लगाना"
  - en: "Produce and read econometric output in Stata"
    zh: "在Stata中产出并解读计量结果"
    zh-TW: "在Stata中產出並解讀計量結果"
    ja: "Stataで計量分析の結果を出して読む"
    ko: "Stata로 계량 결과를 만들고 해석"
    vi: "Tạo và đọc kết quả kinh tế lượng trong Stata"
    ms: "Hasil dan baca output ekonometrik dalam Stata"
    id: "Menghasilkan dan membaca output ekonometrika di Stata"
    hi: "Stata में इकोनोमेट्रिक आउटपुट बनाना और पढ़ना"
  - en: "Carry out a small research project semi-independently"
    zh: "半独立地完成一个小型研究项目"
    zh-TW: "半獨立地完成一個小型研究專題"
    ja: "半ば自力で小さな研究プロジェクトを行う"
    ko: "반독립적으로 소규모 연구 프로젝트 수행"
    vi: "Tự thực hiện một dự án nghiên cứu nhỏ có hướng dẫn"
    ms: "Jalankan projek penyelidikan kecil secara separa berdikari"
    id: "Menjalankan proyek riset kecil secara semi-mandiri"
    hi: "आंशिक रूप से खुद एक छोटा रिसर्च प्रोजेक्ट करना"
