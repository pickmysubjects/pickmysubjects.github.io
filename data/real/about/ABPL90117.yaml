code: ABPL90117
year: 2027
learn:
  en: "Contemporary architectural theories and thinkers, from tectonics and materiality to digital design and ecology."
  zh: "当代建筑理论与思想家，从建构、材料性到数字设计和生态。"
  zh-TW: "當代建築理論與思想家，從建構、材料性到數位設計和生態。"
  ja: "構法や素材性からデジタル設計・エコロジーまで、現代建築の理論と思想家。"
  ko: "텍토닉스와 물성부터 디지털 디자인과 생태까지 현대 건축 이론과 사상가."
  vi: "Các lý thuyết và nhà tư tưởng kiến trúc đương đại, từ kiến tạo, vật liệu đến thiết kế số và sinh thái."
  ms: "Teori dan pemikir seni bina kontemporari, dari tektonik dan bahan hingga reka bentuk digital dan ekologi."
  id: "Teori dan pemikir arsitektur kontemporer, dari tektonika dan materialitas hingga desain digital dan ekologi."
  hi: "समकालीन वास्तुकला सिद्धांत और विचारक, टेक्टॉनिक्स और सामग्री से डिजिटल डिज़ाइन और पारिस्थितिकी तक।"
outcomes:
  - en: "Explain major contemporary architectural theories"
    zh: "阐述主要的当代建筑理论"
    zh-TW: "闡述主要的當代建築理論"
    ja: "主要な現代建築理論を説明する"
    ko: "주요 현대 건축 이론 설명하기"
    vi: "Giải thích các lý thuyết kiến trúc đương đại chính"
    ms: "Menerangkan teori seni bina kontemporari utama"
    id: "Menjelaskan teori arsitektur kontemporer utama"
    hi: "प्रमुख समकालीन वास्तुकला सिद्धांत समझाना"
  - en: "Develop a theory for your own design work"
    zh: "把一种理论发展到自己的设计中"
    zh-TW: "把一種理論發展到自己的設計中"
    ja: "理論を自分の設計に生かす"
    ko: "이론을 자신의 설계에 적용하기"
    vi: "Phát triển một lý thuyết cho thiết kế của mình"
    ms: "Membangunkan teori untuk kerja reka bentuk sendiri"
    id: "Mengembangkan teori untuk karya desain sendiri"
    hi: "अपने डिज़ाइन कार्य के लिए एक सिद्धांत विकसित करना"
