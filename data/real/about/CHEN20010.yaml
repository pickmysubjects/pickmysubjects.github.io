code: CHEN20010
year: 2026
learn:
  en: "Mass and energy balance calculations for chemical processes, plus the basics of process safety."
  zh: "化工过程的物料与能量衡算，以及过程安全基础。"
  zh-TW: "化工製程的質量與能量平衡計算，以及製程安全基礎。"
  ja: "化学プロセスの物質・エネルギー収支計算と、プロセス安全の基礎。"
  ko: "화학 공정의 물질·에너지 수지 계산과 공정 안전의 기초."
  vi: "Tính cân bằng vật chất và năng lượng cho quá trình hóa học, cùng kiến thức cơ bản về an toàn quy trình."
  ms: "Pengiraan imbangan jisim dan tenaga untuk proses kimia, serta asas keselamatan proses."
  id: "Perhitungan neraca massa dan energi untuk proses kimia, serta dasar keselamatan proses."
  hi: "रासायनिक प्रक्रियाओं के लिए द्रव्यमान व ऊर्जा संतुलन की गणना, और प्रोसेस सेफ़्टी की बुनियाद।"
outcomes:
  - en: "Solve material and energy balances"
    zh: "求解物料与能量衡算"
    zh-TW: "求解質量與能量平衡"
    ja: "物質・エネルギー収支を解く"
    ko: "물질·에너지 수지 풀기"
    vi: "Giải bài toán cân bằng vật chất, năng lượng"
    ms: "Menyelesaikan imbangan jisim dan tenaga"
    id: "Menyelesaikan neraca massa dan energi"
    hi: "द्रव्यमान और ऊर्जा संतुलन हल करना"
  - en: "Model flows in reacting systems with software"
    zh: "用软件模拟反应体系的流动"
    zh-TW: "用軟體模擬反應系統的流動"
    ja: "ソフトで反応系の流れをモデル化する"
    ko: "소프트웨어로 반응계 흐름 모델링하기"
    vi: "Mô hình hóa dòng trong hệ phản ứng bằng phần mềm"
    ms: "Memodelkan aliran sistem tindak balas dengan perisian"
    id: "Memodelkan aliran sistem reaksi dengan software"
    hi: "सॉफ़्टवेयर से रिएक्टिंग सिस्टम का प्रवाह मॉडल करना"
  - en: "Explain why process safety matters"
    zh: "解释过程安全的重要性"
    zh-TW: "解釋製程安全的重要性"
    ja: "プロセス安全の重要性を説明する"
    ko: "공정 안전의 중요성 설명하기"
    vi: "Giải thích vì sao an toàn quy trình quan trọng"
    ms: "Menerangkan kepentingan keselamatan proses"
    id: "Menjelaskan pentingnya keselamatan proses"
    hi: "प्रोसेस सेफ़्टी क्यों ज़रूरी है, समझाना"
