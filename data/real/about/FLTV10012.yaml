code: FLTV10012
year: 2026
learn:
  en: "How pictures, sounds and words work together on screen, then use them in a short film and a short screenplay."
  zh: "画面、声音与文字在银幕上如何配合，并用于短片和短剧本。"
  zh-TW: "畫面、聲音與文字在銀幕上如何配合，並用於短片和短劇本。"
  ja: "映像・音・言葉がスクリーンでどう働くかを学び、短編映画と脚本に生かす。"
  ko: "화면·소리·말이 스크린에서 어떻게 작동하는지 배워 단편과 각본에 쓴다."
  vi: "Hình, âm thanh và lời phối hợp ra sao trên màn ảnh, rồi dùng cho phim và kịch bản ngắn."
  ms: "Cara gambar, bunyi dan kata berfungsi di skrin, lalu guna dalam filem dan skrip pendek."
  id: "Cara gambar, suara dan kata bekerja di layar, lalu dipakai di film dan naskah pendek."
  hi: "स्क्रीन पर चित्र, ध्वनि और शब्द कैसे मिलते हैं, फिर शॉर्ट फ़िल्म और पटकथा में उपयोग।"
outcomes:
  - en: "Storyboard and pitch a scene"
    zh: "为一场戏画分镜并讲解"
    zh-TW: "為一場戲畫分鏡並講解"
    ja: "場面の絵コンテを作り説明する"
    ko: "장면 스토리보드 만들고 발표하기"
    vi: "Vẽ storyboard và trình bày một cảnh"
    ms: "Buat papan cerita dan bentang satu babak"
    id: "Membuat storyboard dan mempresentasikan adegan"
    hi: "दृश्य का स्टोरीबोर्ड बनाकर प्रस्तुत करना"
  - en: "Make a 2 to 3-minute short film"
    zh: "拍一部2到3分钟的短片"
    zh-TW: "拍一部 2 到 3 分鐘的短片"
    ja: "2〜3分の短編映画を作る"
    ko: "2~3분 단편 영화 만들기"
    vi: "Làm phim ngắn 2–3 phút"
    ms: "Hasilkan filem pendek 2 hingga 3 minit"
    id: "Membuat film pendek 2–3 menit"
    hi: "2 से 3 मिनट की शॉर्ट फ़िल्म बनाना"
  - en: "Write a 10 to 12-page screenplay"
    zh: "写一部10到12页的剧本"
    zh-TW: "寫一部 10 到 12 頁的劇本"
    ja: "10〜12ページの脚本を書く"
    ko: "10~12쪽 각본 쓰기"
    vi: "Viết kịch bản 10–12 trang"
    ms: "Tulis skrip filem 10 hingga 12 halaman"
    id: "Menulis naskah 10–12 halaman"
    hi: "10 से 12 पेज की पटकथा लिखना"
