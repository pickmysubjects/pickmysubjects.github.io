code: MCEN30021
year: 2026
learn:
  en: "Designing and prototyping machines with motors, sensors and control, from idea to working build."
  zh: "用电机、传感器和控制设计并做出机械原型。"
  zh-TW: "用馬達、感測器和控制設計並做出機械原型。"
  ja: "モーター・センサー・制御で機械を設計し、試作まで作る。"
  ko: "모터, 센서, 제어로 기계를 설계하고 시제품까지 만들기."
  vi: "Thiết kế và làm mẫu máy với động cơ, cảm biến và điều khiển, từ ý tưởng đến sản phẩm."
  ms: "Mereka bentuk dan membina prototaip mesin dengan motor, penderia dan kawalan."
  id: "Merancang dan membuat prototipe mesin dengan motor, sensor, dan kendali."
  hi: "मोटर, सेंसर और कंट्रोल से मशीन डिज़ाइन कर प्रोटोटाइप बनाना।"
outcomes:
  - en: "Write clear engineering requirements"
    zh: "写出清晰的工程需求"
    zh-TW: "寫出清楚的工程需求"
    ja: "明確な設計要件を作る"
    ko: "명확한 공학 요구사항 작성하기"
    vi: "Viết yêu cầu kỹ thuật rõ ràng"
    ms: "Menulis keperluan kejuruteraan yang jelas"
    id: "Menyusun kebutuhan teknik yang jelas"
    hi: "साफ़ इंजीनियरिंग ज़रूरतें लिखना"
  - en: "Select and design basic machine elements"
    zh: "选型和设计基础机械零件"
    zh-TW: "選型和設計基礎機械元件"
    ja: "基本的な機械要素を選び設計する"
    ko: "기본 기계 요소 선정·설계하기"
    vi: "Chọn và thiết kế chi tiết máy cơ bản"
    ms: "Memilih dan mereka unsur mesin asas"
    id: "Memilih dan merancang elemen mesin dasar"
    hi: "बेसिक मशीन एलिमेंट चुनना और डिज़ाइन करना"
  - en: "Combine motors, sensors and control"
    zh: "整合电机、传感器和控制"
    zh-TW: "整合馬達、感測器和控制"
    ja: "モーター・センサー・制御を組み合わせる"
    ko: "모터·센서·제어 통합하기"
    vi: "Kết hợp động cơ, cảm biến và điều khiển"
    ms: "Menggabung motor, penderia dan kawalan"
    id: "Menggabungkan motor, sensor, dan kendali"
    hi: "मोटर, सेंसर और कंट्रोल को जोड़ना"
