code: ACCT90002
year: 2027
learn:
  en: "Reading company financial statements to judge performance, solvency and value, and adjusting reported figures."
  zh: "阅读公司财务报表，评估业绩、偿债能力和价值，并调整报表数据。"
  zh-TW: "閱讀公司財務報表，評估績效、償債能力與價值，並調整報表數字。"
  ja: "企業の財務諸表を読み、業績・支払能力・価値を評価し、報告数値を調整する。"
  ko: "기업 재무제표를 읽고 성과·지급능력·가치를 평가하며 보고 수치를 조정한다."
  vi: "Đọc báo cáo tài chính doanh nghiệp để đánh giá hiệu quả, khả năng thanh toán, giá trị và điều chỉnh số liệu."
  ms: "Membaca penyata kewangan syarikat untuk menilai prestasi, kesolvenan dan nilai, serta melaraskan angka."
  id: "Membaca laporan keuangan perusahaan untuk menilai kinerja, solvabilitas dan nilai, serta menyesuaikan angka."
  hi: "कंपनी के वित्तीय विवरण पढ़कर प्रदर्शन, सॉल्वेंसी और मूल्य आंकना, और रिपोर्ट किए आंकड़े समायोजित करना।"
outcomes:
  - en: "Adjust reported accounts to suit an analysis"
    zh: "按分析目的调整报表数据"
    zh-TW: "依分析目的調整報表數據"
    ja: "分析目的に合わせて財務数値を調整する"
    ko: "분석 목적에 맞게 보고 수치 조정하기"
    vi: "Điều chỉnh số liệu báo cáo theo mục đích phân tích"
    ms: "Melaraskan data perakaunan mengikut tujuan analisis"
    id: "Menyesuaikan data akuntansi sesuai tujuan analisis"
    hi: "विश्लेषण के उद्देश्य के अनुसार लेखा आंकड़े समायोजित करना"
  - en: "Assess profitability, solvency and liquidity from statements"
    zh: "从报表评估盈利、偿债和流动性"
    zh-TW: "從報表評估獲利、償債與流動性"
    ja: "財務諸表から収益性・支払能力・流動性を評価する"
    ko: "재무제표로 수익성·지급능력·유동성 평가하기"
    vi: "Đánh giá khả năng sinh lời, thanh toán và thanh khoản"
    ms: "Menilai keuntungan, kesolvenan dan kecairan daripada penyata"
    id: "Menilai profitabilitas, solvabilitas dan likuiditas dari laporan"
    hi: "विवरणों से लाभप्रदता, सॉल्वेंसी और तरलता आंकना"
