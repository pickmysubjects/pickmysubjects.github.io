code: VETS30032
year: 2026
learn:
  en: "Intensive animal production in poultry, pigs, fish and lab animals: health, welfare, profitability and law."
  zh: "禽类、猪、鱼和实验动物的集约化生产：健康、福利、效益与法规。"
  zh-TW: "禽類、豬、魚與實驗動物的集約化生產：健康、福利、效益與法規。"
  ja: "家禽・豚・魚・実験動物の集約的生産：健康、福祉、収益性、法規。"
  ko: "가금·돼지·어류·실험동물의 집약적 생산: 건강, 복지, 수익성, 법규."
  vi: "Chăn nuôi thâm canh gia cầm, lợn, cá và động vật thí nghiệm: sức khỏe, phúc lợi, lợi nhuận, luật."
  ms: "Pengeluaran haiwan intensif ayam, babi, ikan dan haiwan makmal: kesihatan, kebajikan, keuntungan, undang-undang."
  id: "Produksi hewan intensif unggas, babi, ikan, dan hewan lab: kesehatan, kesejahteraan, profitabilitas, hukum."
  hi: "मुर्गी, सूअर, मछली और प्रयोगशाला पशुओं का सघन उत्पादन: स्वास्थ्य, कल्याण, मुनाफ़ा और कानून।"
outcomes:
  - en: "Analyse intensive animal production systems"
    zh: "分析集约化动物生产系统"
    zh-TW: "分析集約化動物生產系統"
    ja: "集約的動物生産システムを分析する"
    ko: "집약적 동물 생산 시스템을 분석한다"
    vi: "Phân tích hệ thống chăn nuôi thâm canh"
    ms: "Menganalisis sistem pengeluaran haiwan intensif"
    id: "Menganalisis sistem produksi hewan intensif"
    hi: "सघन पशु उत्पादन प्रणालियों का विश्लेषण करना"
  - en: "Describe breeding, nutrition and disease control"
    zh: "阐述育种、营养与疾病控制"
    zh-TW: "闡述育種、營養與疾病控制"
    ja: "育種・栄養・疾病管理を説明する"
    ko: "육종, 영양, 질병 관리를 기술한다"
    vi: "Mô tả nhân giống, dinh dưỡng và kiểm soát bệnh"
    ms: "Menghuraikan pembiakan, nutrisi dan kawalan penyakit"
    id: "Mendeskripsikan pemuliaan, nutrisi, dan pengendalian penyakit"
    hi: "प्रजनन, पोषण और रोग नियंत्रण का वर्णन करना"
  - en: "Apply livestock laws and ethics to food production"
    zh: "将畜牧法规与伦理用于食品生产"
    zh-TW: "將畜牧法規與倫理應用於食品生產"
    ja: "畜産の法と倫理を食品生産に適用する"
    ko: "축산 법·윤리를 식품 생산에 적용한다"
    vi: "Áp dụng luật và đạo đức chăn nuôi vào sản xuất thực phẩm"
    ms: "Mengaplikasi undang-undang dan etika ternakan pada pengeluaran makanan"
    id: "Menerapkan hukum dan etika peternakan pada produksi pangan"
    hi: "खाद्य उत्पादन में पशुधन कानून और नैतिकता लागू करना"
