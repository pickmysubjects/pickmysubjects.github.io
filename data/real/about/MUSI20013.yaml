code: MUSI20013
year: 2026
learn:
  en: "Chamber music in a small group: you rehearse on your own, get weekly coaching from a tutor, and end with a public concert."
  zh: "小型室内乐：小组自主排练，导师每周指导，期末公开音乐会。"
  zh-TW: "小型室內樂：小組自主排練，導師每週指導，期末公開音樂會。"
  ja: "少人数の室内楽：自主練習と講師の週次指導、最後に公開演奏会。"
  ko: "소규모 실내악: 자율 연습과 튜터의 주간 지도, 마지막엔 공개 연주회."
  vi: "Thính phòng nhóm nhỏ: tự tập, được giảng viên hướng dẫn hàng tuần, kết thúc bằng buổi hòa nhạc."
  ms: "Muzik kamar kumpulan kecil: latihan sendiri, bimbingan tutor mingguan, berakhir dengan konsert awam."
  id: "Musik kamar kelompok kecil: latihan mandiri, bimbingan tutor tiap minggu, ditutup konser publik."
  hi: "छोटे समूह में चैंबर संगीत: खुद रिहर्सल, ट्यूटर से साप्ताहिक मार्गदर्शन, अंत में सार्वजनिक कॉन्सर्ट।"
outcomes:
  - en: "Run productive group rehearsals and keep a schedule"
    zh: "高效组织小组排练并按计划执行"
    zh-TW: "高效組織小組排練並按計畫執行"
    ja: "効率よく合わせ練習を計画・実行する"
    ko: "효율적인 그룹 리허설 계획·진행하기"
    vi: "Tổ chức buổi tập nhóm hiệu quả và đúng lịch"
    ms: "Jalankan latihan kumpulan yang produktif ikut jadual"
    id: "Menjalankan latihan kelompok yang efektif sesuai jadwal"
    hi: "समूह रिहर्सल को योजना के साथ असरदार ढंग से चलाना"
  - en: "Listen and blend with the group: tuning, balance, timing"
    zh: "倾听并融入集体：音准、平衡与节奏"
    zh-TW: "傾聽並融入團體：音準、平衡與節奏"
    ja: "周りを聴いて合わせる：音程・バランス・タイミング"
    ko: "앙상블과 어울리기: 음정, 균형, 타이밍"
    vi: "Lắng nghe và hòa với nhóm: cao độ, cân bằng, nhịp"
    ms: "Dengar dan sebati dengan kumpulan: nada, imbangan, masa"
    id: "Mendengar dan menyatu dengan grup: intonasi, keseimbangan, tempo"
    hi: "समूह को सुनकर घुलना-मिलना: सुर, संतुलन, टाइमिंग"
  - en: "Give a 15-minute concert with your group"
    zh: "与小组完成15分钟的音乐会演出"
    zh-TW: "與小組完成15分鐘的音樂會演出"
    ja: "グループで15分の演奏会を行う"
    ko: "그룹과 15분 연주회 하기"
    vi: "Biểu diễn 15 phút cùng nhóm"
    ms: "Beri konsert 15 minit bersama kumpulan"
    id: "Membawakan konser 15 menit bersama kelompok"
    hi: "समूह के साथ 15 मिनट का कॉन्सर्ट देना"
