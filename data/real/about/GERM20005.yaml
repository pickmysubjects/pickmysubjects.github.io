code: GERM20005
year: 2026
learn:
  en: "More German through songs, speeches, poems and TV about revolutions and turning points in German-speaking history."
  zh: "通过歌曲、演讲、诗歌和电视节目继续学德语，主题是德语地区历史上的革命。"
  zh-TW: "透過歌曲、演講、詩歌和電視節目繼續學德語，主題是德語地區歷史上的革命。"
  ja: "歌・演説・詩・テレビ番組でドイツ語を深める。テーマはドイツ語圏の歴史に残る革命。"
  ko: "노래·연설·시·TV로 독일어를 더 배운다. 주제는 독일어권 역사 속 혁명."
  vi: "Học thêm tiếng Đức qua bài hát, diễn văn, thơ và truyền hình về các cuộc cách mạng trong lịch sử nói tiếng Đức."
  ms: "Lebih banyak bahasa Jerman melalui lagu, ucapan, puisi dan TV tentang revolusi dalam sejarah berbahasa Jerman."
  id: "Lebih jauh dengan bahasa Jerman lewat lagu, pidato, puisi dan TV tentang revolusi dalam sejarah berbahasa Jerman."
  hi: "गीतों, भाषणों, कविताओं और टीवी से जर्मन आगे; विषय: जर्मन-भाषी इतिहास की क्रांतियाँ।"
outcomes:
  - en: "Talk about familiar topics in German with more confidence"
    zh: "更自信地用德语谈论熟悉的话题"
    zh-TW: "更自信地用德語談論熟悉的話題"
    ja: "身近な話題をドイツ語でより自信を持って話す"
    ko: "익숙한 주제를 독일어로 더 자신 있게 말하기"
    vi: "Nói về chủ đề quen thuộc bằng tiếng Đức tự tin hơn"
    ms: "Bercakap tentang topik biasa dalam bahasa Jerman dengan lebih yakin"
    id: "Membicarakan topik akrab dalam bahasa Jerman dengan lebih percaya diri"
    hi: "परिचित विषयों पर जर्मन में ज़्यादा आत्मविश्वास से बात करना"
  - en: "Read and write short German texts"
    zh: "读写简短的德语文章"
    zh-TW: "讀寫簡短的德語文章"
    ja: "短いドイツ語の文章を読み書きする"
    ko: "짧은 독일어 글 읽고 쓰기"
    vi: "Đọc và viết đoạn văn tiếng Đức ngắn"
    ms: "Baca dan tulis teks pendek bahasa Jerman"
    id: "Membaca dan menulis teks pendek bahasa Jerman"
    hi: "छोटे जर्मन पाठ पढ़ना-लिखना"
  - en: "Use new grammar and vocabulary correctly"
    zh: "正确运用新语法和词汇"
    zh-TW: "正確運用新文法和詞彙"
    ja: "新しい文法と語彙を正しく使う"
    ko: "새 문법과 어휘를 정확히 쓰기"
    vi: "Dùng đúng ngữ pháp và từ vựng mới"
    ms: "Guna tatabahasa dan kosa kata baharu dengan betul"
    id: "Memakai tata bahasa dan kosakata baru dengan benar"
    hi: "नया व्याकरण और शब्दावली सही इस्तेमाल करना"
