code: ECOM90011
year: 2027
learn:
  en: "Econometrics for financial data: returns, exchange and interest rates, volatility models and cointegration."
  zh: "金融数据计量：收益率、汇率与利率、波动率模型和协整。"
  zh-TW: "金融資料計量：報酬率、匯率與利率、波動率模型與共整合。"
  ja: "金融データの計量：収益率、為替・金利、ボラティリティモデル、共和分。"
  ko: "금융 자료 계량: 수익률, 환율·금리, 변동성 모형, 공적분."
  vi: "Kinh tế lượng cho dữ liệu tài chính: lợi suất, tỷ giá, lãi suất, mô hình biến động và đồng liên kết."
  ms: "Ekonometrik untuk data kewangan: pulangan, kadar tukaran dan faedah, model volatiliti dan kointegrasi."
  id: "Ekonometrika data keuangan: imbal hasil, kurs dan suku bunga, model volatilitas, dan kointegrasi."
  hi: "वित्तीय डेटा की इकोनोमेट्रिक्स: रिटर्न, विनिमय व ब्याज दरें, उतार-चढ़ाव मॉडल और कोइंटीग्रेशन।"
outcomes:
  - en: "Test finance theories such as CAPM on data"
    zh: "用数据检验 CAPM 等金融理论"
    zh-TW: "用資料檢驗 CAPM 等金融理論"
    ja: "CAPMなどの理論をデータで検証する"
    ko: "CAPM 등 금융 이론을 데이터로 검증하기"
    vi: "Kiểm định các lý thuyết như CAPM bằng dữ liệu"
    ms: "Menguji teori kewangan seperti CAPM dengan data"
    id: "Menguji teori keuangan seperti CAPM dengan data"
    hi: "CAPM जैसे वित्त सिद्धांतों को डेटा पर परखना"
  - en: "Model volatility with ARCH/GARCH"
    zh: "用 ARCH/GARCH 刻画波动"
    zh-TW: "用 ARCH/GARCH 刻畫波動"
    ja: "ARCH/GARCHで変動をモデル化する"
    ko: "ARCH/GARCH로 변동성 모형화하기"
    vi: "Mô hình hóa biến động bằng ARCH/GARCH"
    ms: "Memodel volatiliti dengan ARCH/GARCH"
    id: "Memodelkan volatilitas dengan ARCH/GARCH"
    hi: "ARCH/GARCH से उतार-चढ़ाव का मॉडल"
