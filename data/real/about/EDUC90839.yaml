code: EDUC90839
year: 2027
learn:
  en: "How science is taught in Victorian schools, with up to 20 hours helping a teacher in a real classroom."
  zh: "了解维州学校如何教科学，并在真实课堂里协助老师最多20小时。"
  zh-TW: "了解維州學校如何教科學，並在真實課堂裡協助老師最多20小時。"
  ja: "ビクトリア州の学校での理科教育を学び、実際の教室で最大20時間教師を補助する。"
  ko: "빅토리아주 학교의 과학 수업을 배우고 실제 교실에서 최대 20시간 교사를 돕는다."
  vi: "Cách dạy khoa học ở trường Victoria, kèm tối đa 20 giờ phụ giáo viên trong lớp học thật."
  ms: "Cara sains diajar di sekolah Victoria, dengan sehingga 20 jam membantu guru di bilik darjah sebenar."
  id: "Cara sains diajarkan di sekolah Victoria, dengan hingga 20 jam membantu guru di kelas nyata."
  hi: "विक्टोरियाई स्कूलों में विज्ञान कैसे पढ़ाया जाता है, असली कक्षा में 20 घंटे तक शिक्षक की मदद के साथ।"
outcomes:
  - en: "Explain why some science ideas are hard to teach"
    zh: "解释为什么有些科学概念难教"
    zh-TW: "解釋為什麼有些科學概念難教"
    ja: "理科の考え方が教えにくい理由を説明する"
    ko: "어떤 과학 개념이 가르치기 어려운 이유 설명하기"
    vi: "Giải thích vì sao một số ý tưởng khoa học khó dạy"
    ms: "Menerangkan mengapa sesetengah idea sains sukar diajar"
    id: "Menjelaskan mengapa beberapa konsep sains sulit diajarkan"
    hi: "समझाना कि कुछ वैज्ञानिक विचार पढ़ाना कठिन क्यों है"
  - en: "Understand how a school science curriculum is built"
    zh: "理解学校科学课程如何制定"
    zh-TW: "理解學校科學課程如何制定"
    ja: "学校の理科カリキュラムの作られ方を理解する"
    ko: "학교 과학 교육과정이 만들어지는 방식 이해하기"
    vi: "Hiểu cách xây dựng chương trình khoa học ở trường"
    ms: "Memahami cara kurikulum sains sekolah dibina"
    id: "Memahami cara kurikulum sains sekolah disusun"
    hi: "स्कूल विज्ञान पाठ्यक्रम कैसे बनता है, समझना"
  - en: "Support science learners in the classroom"
    zh: "在课堂上帮助学生学科学"
    zh-TW: "在課堂上幫助學生學科學"
    ja: "教室で理科を学ぶ生徒を支援する"
    ko: "교실에서 과학 학습자 돕기"
    vi: "Hỗ trợ học sinh học khoa học trên lớp"
    ms: "Membantu pelajar sains di bilik darjah"
    id: "Membantu siswa belajar sains di kelas"
    hi: "कक्षा में विज्ञान सीखने वालों की मदद करना"
