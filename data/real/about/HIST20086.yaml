code: HIST20086
year: 2026
learn:
  en: "China's links with the wider world since 1945, covering the PRC, Taiwan and Hong Kong, with practice reading sources."
  zh: "1945年以来中国与世界的联系，涵盖中华人民共和国、台湾和香港，并练习解读史料。"
  zh-TW: "1945年以來中國與世界的連結，涵蓋中華人民共和國、臺灣和香港，並練習解讀史料。"
  ja: "1945年以降の中国と世界のつながりを、中華人民共和国・台湾・香港を含めて学び、史料読解も練習する。"
  ko: "1945년 이후 중국과 세계의 연결을 중화인민공화국, 대만, 홍콩까지 다루며 사료 읽기도 연습한다."
  vi: "Mối liên hệ của Trung Quốc với thế giới từ 1945, gồm CHND Trung Hoa, Đài Loan và Hồng Kông, kèm luyện đọc sử liệu."
  ms: "Hubungan China dengan dunia sejak 1945, merangkumi RRC, Taiwan dan Hong Kong, sambil berlatih membaca sumber."
  id: "Hubungan Tiongkok dengan dunia sejak 1945, mencakup RRT, Taiwan, dan Hong Kong, sambil berlatih membaca sumber."
  hi: "1945 के बाद चीन के दुनिया से रिश्ते, जिसमें पीआरसी, ताइवान और हांगकांग शामिल हैं, साथ में स्रोत पढ़ने का अभ्यास।"
outcomes:
  - en: "Evaluate China's history since 1945 and its global ties"
    zh: "评价1945年以来的中国历史及其全球联系"
    zh-TW: "評價1945年以來的中國歷史及其全球連結"
    ja: "1945年以降の中国史と世界とのつながりを評価する"
    ko: "1945년 이후 중국사와 세계적 연결 평가하기"
    vi: "Đánh giá lịch sử Trung Quốc từ 1945 và các mối liên hệ toàn cầu"
    ms: "Nilai sejarah China sejak 1945 dan hubungan globalnya"
    id: "Menilai sejarah Tiongkok sejak 1945 dan kaitan globalnya"
    hi: "1945 के बाद के चीनी इतिहास और उसके वैश्विक रिश्तों को परखना"
  - en: "Interpret primary and secondary sources"
    zh: "解读一手和二手史料"
    zh-TW: "解讀一手和二手史料"
    ja: "一次史料と二次文献を解釈する"
    ko: "1차·2차 사료 해석하기"
    vi: "Diễn giải nguồn sơ cấp và thứ cấp"
    ms: "Tafsir sumber primer dan sekunder"
    id: "Menafsirkan sumber primer dan sekunder"
    hi: "प्राथमिक और द्वितीयक स्रोतों की व्याख्या करना"
  - en: "Write an essay with your own argument"
    zh: "写一篇有自己观点的论文"
    zh-TW: "寫一篇有自己觀點的論文"
    ja: "自分の主張を持ったエッセイを書く"
    ko: "자기 주장을 담은 에세이 쓰기"
    vi: "Viết bài luận với lập luận của riêng mình"
    ms: "Tulis esei dengan hujah sendiri"
    id: "Menulis esai dengan argumen sendiri"
    hi: "अपने तर्क के साथ निबंध लिखना"
