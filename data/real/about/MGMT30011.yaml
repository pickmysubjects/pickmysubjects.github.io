code: MGMT30011
year: 2026
learn:
  en: "How supply chains and networks work, and the data and systems used to run them better."
  zh: "供应链和网络如何运作，以及用来改进它们的数据和系统。"
  zh-TW: "供應鏈和網絡如何運作，以及用來改善它們的資料和系統。"
  ja: "サプライチェーンとネットワークの仕組みと、それを改善するデータやシステム。"
  ko: "공급망과 네트워크의 작동 방식과 이를 개선하는 데이터·시스템."
  vi: "Chuỗi cung ứng và mạng lưới vận hành ra sao, cùng dữ liệu và hệ thống để cải thiện chúng."
  ms: "Cara rantaian bekalan dan rangkaian berfungsi, serta data dan sistem untuk menambah baiknya."
  id: "Cara rantai pasok dan jaringan bekerja, serta data dan sistem untuk memperbaikinya."
  hi: "सप्लाई चेन और नेटवर्क कैसे काम करते हैं, और उन्हें बेहतर चलाने के डेटा व सिस्टम।"
outcomes:
  - en: "Describe the role of supply chains and networks"
    zh: "描述供应链和网络的作用"
    zh-TW: "描述供應鏈和網絡的作用"
    ja: "サプライチェーンとネットワークの役割を説明する"
    ko: "공급망과 네트워크의 역할 설명하기"
    vi: "Mô tả vai trò của chuỗi cung ứng và mạng lưới"
    ms: "Huraikan peranan rantaian bekalan dan rangkaian"
    id: "Menjelaskan peran rantai pasok dan jaringan"
    hi: "सप्लाई चेन और नेटवर्क की भूमिका बताना"
  - en: "Assess tools and data for improving performance"
    zh: "评估提升绩效的工具和数据"
    zh-TW: "評估提升績效的工具和資料"
    ja: "成果を高めるツールとデータを評価する"
    ko: "성과 향상을 위한 도구와 데이터 평가하기"
    vi: "Đánh giá công cụ và dữ liệu để nâng hiệu quả"
    ms: "Nilai alat dan data untuk tingkatkan prestasi"
    id: "Menilai alat dan data untuk meningkatkan kinerja"
    hi: "प्रदर्शन सुधारने के टूल और डेटा परखना"
  - en: "Apply supply chain ideas to real cases"
    zh: "把供应链知识用到真实案例"
    zh-TW: "把供應鏈知識用在真實案例"
    ja: "サプライチェーンの考えを実例に当てはめる"
    ko: "공급망 개념을 실제 사례에 적용하기"
    vi: "Áp dụng kiến thức chuỗi cung ứng vào tình huống thực tế"
    ms: "Guna idea rantaian bekalan pada kes sebenar"
    id: "Menerapkan ide rantai pasok pada kasus nyata"
    hi: "सप्लाई चेन के विचार असली मामलों पर लागू करना"
