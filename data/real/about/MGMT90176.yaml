code: MGMT90176
year: 2027
learn:
  en: "Staffing as a \"make or buy\" choice: recruiting and selecting new staff, or training and developing existing ones."
  zh: "把人员配置看作“自培还是外招”：招聘甄选新员工，或培训发展现有员工。"
  zh-TW: "把人力配置視為「自行培育或外部招募」：招募甄選新員工，或訓練發展現有員工。"
  ja: "人材確保を「育てるか採るか」の選択として学ぶ：採用・選考か、研修・育成か。"
  ko: "인력 확보를 '육성이냐 채용이냐'의 선택으로 본다: 신규 채용·선발 또는 기존 인력 교육·개발."
  vi: "Bố trí nhân sự như lựa chọn \"tự đào tạo hay tuyển ngoài\": tuyển chọn người mới hoặc đào tạo người hiện có."
  ms: "Perjawatan sebagai pilihan \"latih atau ambil\": merekrut dan memilih pekerja baharu, atau melatih yang sedia ada."
  id: "Penempatan staf sebagai pilihan \"latih atau rekrut\": merekrut dan menyeleksi baru, atau melatih yang ada."
  hi: "स्टाफ़िंग को \"तैयार करें या भर्ती करें\" के चुनाव की तरह: नए लोग भर्ती करना या मौजूदा लोगों को प्रशिक्षित करना।"
outcomes:
  - en: "Apply recruitment and selection tools"
    zh: "运用招聘与甄选工具"
    zh-TW: "運用招募與甄選工具"
    ja: "採用・選考の手法を使う"
    ko: "채용·선발 도구 활용하기"
    vi: "Áp dụng công cụ tuyển dụng và tuyển chọn"
    ms: "Menggunakan alat pengambilan dan pemilihan"
    id: "Menerapkan alat rekrutmen dan seleksi"
    hi: "भर्ती और चयन के साधन अपनाना"
  - en: "Evaluate the impact of training"
    zh: "评估培训的效果"
    zh-TW: "評估訓練的成效"
    ja: "研修の効果を評価する"
    ko: "교육 훈련의 효과 평가하기"
    vi: "Đánh giá tác động của đào tạo"
    ms: "Menilai impak latihan"
    id: "Menilai dampak pelatihan"
    hi: "प्रशिक्षण के असर का आकलन करना"
