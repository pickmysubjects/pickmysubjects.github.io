code: MAST20031
year: 2026
learn:
  en: "Designing biology experiments and analysing the data in R, from field studies to lab work."
  zh: "设计生物实验并用R分析数据，从野外到实验室"
  zh-TW: "設計生物實驗並用R分析資料，從野外到實驗室"
  ja: "野外から実験室まで、生物実験を設計しRでデータを分析する。"
  ko: "야외부터 실험실까지 생물 실험을 설계하고 R로 데이터를 분석한다."
  vi: "Thiết kế thí nghiệm sinh học và phân tích dữ liệu bằng R, từ thực địa đến phòng lab."
  ms: "Mereka bentuk eksperimen biologi dan menganalisis data dalam R, dari lapangan ke makmal."
  id: "Merancang eksperimen biologi dan menganalisis datanya di R, dari lapangan hingga lab."
  hi: "जीव विज्ञान प्रयोग डिज़ाइन करना और R में डेटा विश्लेषण, फ़ील्ड से लैब तक।"
outcomes:
  - en: "Design lab, greenhouse and field experiments"
    zh: "设计实验室、温室和野外实验"
    zh-TW: "設計實驗室、溫室和野外實驗"
    ja: "実験室・温室・野外の実験を設計する"
    ko: "실험실·온실·야외 실험 설계하기"
    vi: "Thiết kế thí nghiệm lab, nhà kính, thực địa"
    ms: "Mereka bentuk eksperimen makmal, rumah hijau, lapangan"
    id: "Merancang eksperimen lab, rumah kaca, lapangan"
    hi: "लैब, ग्रीनहाउस और फ़ील्ड प्रयोग डिज़ाइन करना"
  - en: "Fit linear models to biological data"
    zh: "对生物数据拟合线性模型"
    zh-TW: "對生物資料擬合線性模型"
    ja: "生物データに線形モデルを当てはめる"
    ko: "생물 데이터에 선형모형 적합하기"
    vi: "Khớp mô hình tuyến tính cho dữ liệu sinh học"
    ms: "Memadankan model linear pada data biologi"
    id: "Mencocokkan model linear ke data biologi"
    hi: "जैविक डेटा पर रैखिक मॉडल फ़िट करना"
  - en: "Use resampling and likelihood methods"
    zh: "使用重抽样和似然方法"
    zh-TW: "使用重抽樣和概似方法"
    ja: "リサンプリングと尤度法を使う"
    ko: "재표본추출과 우도법 사용하기"
    vi: "Dùng phương pháp tái lấy mẫu và hợp lý"
    ms: "Menggunakan kaedah pensampelan semula dan kebolehjadian"
    id: "Memakai metode resampling dan likelihood"
    hi: "रीसैंपलिंग और लाइकलीहुड विधियाँ अपनाना"
