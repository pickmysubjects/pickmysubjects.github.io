code: CWRI20007
year: 2026
learn:
  en: "Reading a wide range of mostly 20th and 21st-century poetry and how poets have changed forms and styles."
  zh: "广泛阅读以20和21世纪为主的诗歌，了解诗人如何革新诗歌形式与风格。"
  zh-TW: "廣泛閱讀以20和21世紀為主的詩歌，了解詩人如何革新詩歌形式與風格。"
  ja: "主に20〜21世紀の多様な詩を読み、詩人が形式や文体をどう変えてきたかを学ぶ。"
  ko: "주로 20~21세기의 다양한 시를 읽고 시인들이 형식과 문체를 어떻게 바꿔 왔는지 배운다."
  vi: "Đọc nhiều thơ, chủ yếu thế kỷ 20 và 21, và cách các nhà thơ đổi mới hình thức, phong cách."
  ms: "Membaca pelbagai puisi, kebanyakannya abad ke-20 dan ke-21, dan cara penyair mengubah bentuk serta gaya."
  id: "Membaca beragam puisi, kebanyakan abad ke-20 dan ke-21, dan cara penyair mengubah bentuk serta gaya."
  hi: "ज़्यादातर 20वीं और 21वीं सदी की तरह-तरह की कविताएं पढ़ना, और कवियों ने रूप व शैली कैसे बदली।"
outcomes:
  - en: "Identify a range of poetic forms and styles"
    zh: "辨识多种诗歌形式和风格"
    zh-TW: "辨識多種詩歌形式和風格"
    ja: "様々な詩の形式と文体を見分ける"
    ko: "여러 시 형식과 문체 구별하기"
    vi: "Nhận ra nhiều hình thức và phong cách thơ"
    ms: "Kenal pasti pelbagai bentuk dan gaya puisi"
    id: "Mengenali beragam bentuk dan gaya puisi"
    hi: "कविता के कई रूप और शैलियां पहचानना"
  - en: "Read poems in their historical context"
    zh: "结合历史背景阅读诗歌"
    zh-TW: "結合歷史背景閱讀詩歌"
    ja: "詩を歴史的な文脈の中で読む"
    ko: "역사적 맥락에서 시 읽기"
    vi: "Đọc thơ trong bối cảnh lịch sử"
    ms: "Baca puisi dalam konteks sejarahnya"
    id: "Membaca puisi dalam konteks sejarahnya"
    hi: "कविताओं को ऐतिहासिक संदर्भ में पढ़ना"
  - en: "Write your own poems drawing on what you read"
    zh: "借鉴所读作品写自己的诗"
    zh-TW: "借鑑所讀作品寫自己的詩"
    ja: "読んだものを手がかりに自分の詩を書く"
    ko: "읽은 작품을 바탕으로 자기 시 쓰기"
    vi: "Viết thơ của mình dựa trên những gì đã đọc"
    ms: "Tulis puisi sendiri berdasarkan bacaan"
    id: "Menulis puisi sendiri berdasarkan bacaan"
    hi: "पढ़ी गई चीज़ों के सहारे अपनी कविताएं लिखना"
