code: LING30015
year: 2026
learn:
  en: "Finding patterns in real language with large text databases, using corpus software and beginner Python. No tech background needed."
  zh: "借助大型语料库发现真实语言中的规律，使用语料库软件和入门 Python，无需技术基础。"
  zh-TW: "藉助大型語料庫發現真實語言中的規律，使用語料庫軟體和入門 Python，無需技術基礎。"
  ja: "大規模なコーパスで実際の言語のパターンを探る。コーパスソフトと初歩のPythonを使う。技術の経験は不要。"
  ko: "대규모 말뭉치로 실제 언어의 패턴을 찾는다. 말뭉치 소프트웨어와 입문 Python 사용. 기술 배경 불필요."
  vi: "Tìm quy luật trong ngôn ngữ thật bằng kho ngữ liệu lớn, dùng phần mềm ngữ liệu và Python cơ bản. Không cần nền tảng kỹ thuật."
  ms: "Mencari corak dalam bahasa sebenar dengan pangkalan teks besar, menggunakan perisian korpus dan Python asas. Tiada latar teknikal diperlukan."
  id: "Mencari pola bahasa nyata dengan basis data teks besar, memakai perangkat lunak korpus dan Python dasar. Tanpa latar teknis."
  hi: "बड़े टेक्स्ट डेटाबेस से असली भाषा में पैटर्न ढूँढना, कॉर्पस सॉफ़्टवेयर और शुरुआती Python से। तकनीकी पृष्ठभूमि ज़रूरी नहीं।"
outcomes:
  - en: "Search corpora with dedicated software"
    zh: "使用专门软件检索语料库"
    zh-TW: "使用專門軟體檢索語料庫"
    ja: "専用ソフトでコーパスを検索する"
    ko: "전용 소프트웨어로 말뭉치 검색하기"
    vi: "Tra cứu kho ngữ liệu bằng phần mềm chuyên dụng"
    ms: "Cari korpus dengan perisian khusus"
    id: "Menelusuri korpus dengan perangkat lunak khusus"
    hi: "विशेष सॉफ़्टवेयर से कॉर्पस खोजना"
  - en: "Write simple Python to explore language data"
    zh: "编写简单的 Python 探索语言数据"
    zh-TW: "編寫簡單的 Python 探索語言資料"
    ja: "簡単なPythonで言語データを調べる"
    ko: "간단한 Python으로 언어 데이터 탐색하기"
    vi: "Viết Python đơn giản để khám phá dữ liệu ngôn ngữ"
    ms: "Tulis Python ringkas untuk meneroka data bahasa"
    id: "Menulis Python sederhana untuk menjelajah data bahasa"
    hi: "भाषा डेटा देखने के लिए सरल Python लिखना"
  - en: "Present and discuss patterns you find"
    zh: "展示并讨论你发现的规律"
    zh-TW: "展示並討論你發現的規律"
    ja: "見つけたパターンを発表し議論する"
    ko: "발견한 패턴 발표하고 토론하기"
    vi: "Trình bày và thảo luận quy luật tìm được"
    ms: "Bentang dan bincangkan corak yang ditemui"
    id: "Mempresentasikan dan membahas pola yang ditemukan"
    hi: "मिले पैटर्न प्रस्तुत करना और उन पर चर्चा करना"
