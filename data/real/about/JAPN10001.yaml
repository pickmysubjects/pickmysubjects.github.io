code: JAPN10001
year: 2026
learn:
  en: "Japanese from zero: hiragana, katakana, about 60 kanji and everyday conversation."
  zh: "零基础日语：平假名、片假名、约60个汉字和日常会话。"
  zh-TW: "零基礎日語：平假名、片假名、約60個漢字和日常會話。"
  ja: "ゼロから学ぶ日本語：ひらがな、カタカナ、漢字約60字と日常会話。"
  ko: "기초부터 배우는 일본어: 히라가나, 가타카나, 한자 약 60자, 일상 회화."
  vi: "Tiếng Nhật từ đầu: hiragana, katakana, khoảng 60 chữ kanji và hội thoại hằng ngày."
  ms: "Bahasa Jepun dari sifar: hiragana, katakana, kira-kira 60 kanji dan perbualan harian."
  id: "Bahasa Jepang dari nol: hiragana, katakana, sekitar 60 kanji, dan percakapan sehari-hari."
  hi: "शून्य से जापानी: हिरागाना, काताकाना, लगभग 60 कांजी और रोज़मर्रा की बातचीत।"
outcomes:
  - en: "Read and write kana and about 60 kanji"
    zh: "会读写假名和约60个汉字"
    zh-TW: "會讀寫假名和約60個漢字"
    ja: "かなと約60字の漢字を読み書きする"
    ko: "가나와 한자 약 60자 읽고 쓰기"
    vi: "Đọc viết kana và khoảng 60 kanji"
    ms: "Baca dan tulis kana serta kira-kira 60 kanji"
    id: "Membaca dan menulis kana serta sekitar 60 kanji"
    hi: "काना और लगभग 60 कांजी पढ़ना-लिखना"
  - en: "Introduce yourself and chat in simple Japanese"
    zh: "用简单日语自我介绍和聊天"
    zh-TW: "用簡單日語自我介紹和聊天"
    ja: "簡単な日本語で自己紹介や会話をする"
    ko: "쉬운 일본어로 자기소개와 대화"
    vi: "Tự giới thiệu và trò chuyện bằng tiếng Nhật đơn giản"
    ms: "Perkenalkan diri dan berbual dalam bahasa Jepun mudah"
    id: "Memperkenalkan diri dan mengobrol dalam bahasa Jepang sederhana"
    hi: "सरल जापानी में परिचय देना और बात करना"
  - en: "Handle shopping and asking for directions"
    zh: "应付购物和问路"
    zh-TW: "應付購物和問路"
    ja: "買い物や道を尋ねる場面に対応する"
    ko: "쇼핑하기와 길 묻기"
    vi: "Xoay xở khi mua sắm và hỏi đường"
    ms: "Urus membeli-belah dan bertanya arah"
    id: "Berbelanja dan menanyakan arah"
    hi: "खरीदारी करना और रास्ता पूछना"
