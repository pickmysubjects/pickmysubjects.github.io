code: ABPL30044
year: 2026
learn:
  en: "Construction capstone: teams turn a real industry design into construction and project management plans."
  zh: "施工方向毕业设计课：小组把真实行业项目的设计转化为施工和项目管理计划。"
  zh-TW: "營建方向畢業專題：小組把真實產業專案的設計轉成施工與專案管理計畫。"
  ja: "建設系の総仕上げ。チームで実際の業界案件の設計を施工・プロジェクト管理計画にする。"
  ko: "건설 캡스톤. 팀이 실제 업계 프로젝트 설계를 시공·사업관리 계획으로 바꾼다."
  vi: "Môn tốt nghiệp xây dựng: nhóm biến thiết kế dự án thật thành kế hoạch thi công và quản lý dự án."
  ms: "Kemuncak pembinaan: pasukan menukar reka bentuk projek industri sebenar kepada pelan pembinaan dan pengurusan."
  id: "Capstone konstruksi: tim mengubah desain proyek industri nyata jadi rencana konstruksi dan manajemen proyek."
  hi: "कंस्ट्रक्शन कैपस्टोन: टीमें असली इंडस्ट्री डिज़ाइन को निर्माण और प्रोजेक्ट मैनेजमेंट योजना में बदलती हैं।"
outcomes:
  - en: "Plan the construction of a real building project"
    zh: "为真实建筑项目做施工规划"
    zh-TW: "為真實建築專案做施工規劃"
    ja: "実際の建築プロジェクトの施工を計画する"
    ko: "실제 건축 프로젝트의 시공 계획하기"
    vi: "Lập kế hoạch thi công cho dự án thật"
    ms: "Rancang pembinaan untuk projek bangunan sebenar"
    id: "Merencanakan konstruksi proyek bangunan nyata"
    hi: "असली इमारत प्रोजेक्ट के निर्माण की योजना बनाना"
  - en: "Make project decisions from concept to completion"
    zh: "从概念到完工做项目决策"
    zh-TW: "從概念到完工做專案決策"
    ja: "構想から完成までのプロジェクト判断をする"
    ko: "구상부터 준공까지 프로젝트 결정 내리기"
    vi: "Ra quyết định dự án từ ý tưởng đến hoàn thành"
    ms: "Buat keputusan projek dari konsep hingga siap"
    id: "Mengambil keputusan proyek dari konsep hingga selesai"
    hi: "विचार से पूरा होने तक प्रोजेक्ट के फ़ैसले लेना"
  - en: "Work in a team playing real industry roles"
    zh: "在团队中扮演真实行业角色"
    zh-TW: "在團隊中扮演真實產業角色"
    ja: "チームで実際の業界の役割を担う"
    ko: "팀에서 실제 업계 역할 맡기"
    vi: "Làm việc nhóm trong vai trò thực tế của ngành"
    ms: "Bekerja dalam pasukan dengan peranan industri"
    id: "Bekerja dalam tim dengan peran industri nyata"
    hi: "टीम में असली इंडस्ट्री भूमिकाएँ निभाना"
