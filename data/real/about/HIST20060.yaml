code: HIST20060
year: 2026
learn:
  en: "World War II as a total war: its causes in Europe and Asia, life on the home front, the Holocaust and its legacy."
  zh: "作为总体战的二战：欧亚战争起因、后方生活、大屠杀及其遗产。"
  zh-TW: "作為總體戰的二戰：歐亞戰爭起因、後方生活、大屠殺及其遺產。"
  ja: "総力戦としての第二次世界大戦。欧州とアジアでの原因、銃後の暮らし、ホロコースト、その遺産。"
  ko: "총력전으로서의 제2차 세계대전, 유럽과 아시아에서의 원인, 후방의 삶, 홀로코스트와 그 유산을 다룬다."
  vi: "Thế chiến II như một cuộc chiến tổng lực: nguyên nhân ở châu Âu và châu Á, đời sống hậu phương, Holocaust và di sản."
  ms: "Perang Dunia II sebagai perang total: puncanya di Eropah dan Asia, kehidupan di barisan belakang, Holocaust dan legasinya."
  id: "Perang Dunia II sebagai perang total: penyebabnya di Eropa dan Asia, kehidupan di garis belakang, Holocaust, dan warisannya."
  hi: "पूर्ण युद्ध के रूप में दूसरा विश्व युद्ध: यूरोप और एशिया में कारण, घरेलू मोर्चे का जीवन, होलोकॉस्ट और उसकी विरासत।"
outcomes:
  - en: "Identify the key people and events of WWII"
    zh: "辨识二战的关键人物和事件"
    zh-TW: "辨識二戰的關鍵人物和事件"
    ja: "第二次大戦の主要人物と出来事を押さえる"
    ko: "2차 대전의 핵심 인물과 사건 파악하기"
    vi: "Nhận biết các nhân vật và sự kiện chính của Thế chiến II"
    ms: "Kenal pasti tokoh dan peristiwa utama Perang Dunia II"
    id: "Mengenali tokoh dan peristiwa utama Perang Dunia II"
    hi: "दूसरे विश्व युद्ध के मुख्य व्यक्तियों और घटनाओं को पहचानना"
  - en: "Explain total war and its impact on society"
    zh: "说明总体战及其对社会的影响"
    zh-TW: "說明總體戰及其對社會的影響"
    ja: "総力戦とその社会への影響を説明する"
    ko: "총력전과 그 사회적 영향 설명하기"
    vi: "Giải thích chiến tranh tổng lực và tác động lên xã hội"
    ms: "Terangkan perang total dan kesannya terhadap masyarakat"
    id: "Menjelaskan perang total dan dampaknya bagi masyarakat"
    hi: "पूर्ण युद्ध और समाज पर उसके असर को समझाना"
  - en: "Use sources to build historical arguments"
    zh: "运用史料构建历史论点"
    zh-TW: "運用史料建構歷史論點"
    ja: "史料を使って歴史的な議論を組み立てる"
    ko: "사료로 역사적 논증 세우기"
    vi: "Dùng nguồn sử liệu để xây dựng lập luận lịch sử"
    ms: "Guna sumber untuk membina hujah sejarah"
    id: "Memakai sumber untuk menyusun argumen sejarah"
    hi: "स्रोतों से ऐतिहासिक तर्क बनाना"
