code: ECOM90009
year: 2027
learn:
  en: "Collecting, summarising and analysing data for business decisions: sampling, hypothesis tests, regression, forecasting."
  zh: "为商业决策收集、汇总和分析数据：抽样、假设检验、回归和预测。"
  zh-TW: "為商業決策蒐集、彙整與分析資料：抽樣、假設檢定、迴歸與預測。"
  ja: "経営判断のためのデータ収集・要約・分析：標本調査、仮説検定、回帰、予測。"
  ko: "경영 의사결정을 위한 데이터 수집·요약·분석: 표본추출, 가설검정, 회귀, 예측."
  vi: "Thu thập, tóm tắt và phân tích dữ liệu cho quyết định kinh doanh: chọn mẫu, kiểm định, hồi quy, dự báo."
  ms: "Mengumpul, meringkas dan menganalisis data untuk keputusan perniagaan: persampelan, ujian hipotesis, regresi, ramalan."
  id: "Mengumpulkan, merangkum, dan menganalisis data untuk keputusan bisnis: sampling, uji hipotesis, regresi, peramalan."
  hi: "व्यावसायिक निर्णयों के लिए डेटा संग्रह, सारांश और विश्लेषण: सैंपलिंग, परिकल्पना परीक्षण, रिग्रेशन, पूर्वानुमान।"
outcomes:
  - en: "Explain how statistics supports decision-making"
    zh: "解释统计学如何辅助决策"
    zh-TW: "解釋統計學如何輔助決策"
    ja: "統計が意思決定をどう支えるか説明する"
    ko: "통계가 의사결정을 돕는 방식 설명하기"
    vi: "Giải thích thống kê hỗ trợ ra quyết định ra sao"
    ms: "Menerangkan cara statistik menyokong keputusan"
    id: "Menjelaskan cara statistik mendukung keputusan"
    hi: "सांख्यिकी निर्णय लेने में कैसे मदद करती है, समझाना"
  - en: "Interpret regression results and forecasts"
    zh: "解读回归结果和预测"
    zh-TW: "解讀迴歸結果與預測"
    ja: "回帰分析の結果と予測を解釈する"
    ko: "회귀 결과와 예측 해석하기"
    vi: "Diễn giải kết quả hồi quy và dự báo"
    ms: "Mentafsir keputusan regresi dan ramalan"
    id: "Menafsirkan hasil regresi dan peramalan"
    hi: "रिग्रेशन परिणाम और पूर्वानुमान की व्याख्या"
