code: EVSC30006
year: 2026
learn:
  en: "How cities change landscapes and wildlife, and how ecology can help plan greener urban areas."
  zh: "城市如何改变景观和野生动物，以及生态学如何帮助规划更绿色的城市。"
  zh-TW: "城市如何改變地景和野生動物，以及生態學如何幫助規劃更綠色的城市。"
  ja: "都市化が景観と野生生物をどう変えるか、生態学でより緑豊かな都市をどう計画するか。"
  ko: "도시가 경관과 야생동물을 어떻게 바꾸는지, 생태학으로 더 푸른 도시를 계획하는 법."
  vi: "Đô thị làm thay đổi cảnh quan và động vật hoang dã ra sao, và sinh thái học giúp quy hoạch đô thị xanh hơn."
  ms: "Bagaimana bandar mengubah landskap dan hidupan liar, dan cara ekologi membantu merancang bandar lebih hijau."
  id: "Bagaimana kota mengubah bentang alam dan satwa liar, dan cara ekologi membantu merencanakan kota lebih hijau."
  hi: "शहर भू-दृश्य और वन्यजीवों को कैसे बदलते हैं, और पारिस्थितिकी हरित शहर बनाने में कैसे मदद करती है।"
outcomes:
  - en: "Assess effects of habitat fragmentation"
    zh: "评估栖息地破碎化的影响"
    zh-TW: "評估棲地破碎化的影響"
    ja: "生息地分断の影響を評価する"
    ko: "서식지 단편화의 영향을 평가한다"
    vi: "Đánh giá tác động của phân mảnh sinh cảnh"
    ms: "Nilai kesan pemecahan habitat"
    id: "Menilai dampak fragmentasi habitat"
    hi: "आवास विखंडन के प्रभाव आँकना"
  - en: "Apply ecology to urban landscape design"
    zh: "把生态学用于城市景观设计"
    zh-TW: "把生態學用於城市地景設計"
    ja: "生態学を都市景観設計に活かす"
    ko: "생태학을 도시 경관 설계에 적용한다"
    vi: "Áp dụng sinh thái vào thiết kế cảnh quan đô thị"
    ms: "Guna ekologi dalam reka landskap bandar"
    id: "Menerapkan ekologi pada desain lanskap kota"
    hi: "शहरी भू-दृश्य डिज़ाइन में पारिस्थितिकी लगाना"
