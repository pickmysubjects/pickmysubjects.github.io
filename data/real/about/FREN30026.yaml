code: FREN30026
year: 2026
learn:
  en: "The history, geography and culture of cities across the French-speaking world."
  zh: "法语世界各地城市的历史、地理和文化。"
  zh-TW: "法語世界各地城市的歷史、地理和文化。"
  ja: "フランス語圏各地の都市の歴史・地理・文化。"
  ko: "프랑스어권 여러 도시의 역사·지리·문화."
  vi: "Lịch sử, địa lý và văn hóa các thành phố trong thế giới nói tiếng Pháp."
  ms: "Sejarah, geografi dan budaya bandar di seluruh dunia berbahasa Perancis."
  id: "Sejarah, geografi dan budaya kota-kota di dunia berbahasa Prancis."
  hi: "फ़्रेंच-भाषी दुनिया के शहरों का इतिहास, भूगोल और संस्कृति।"
outcomes:
  - en: "Compare French-speaking cities around the world"
    zh: "比较世界各地的法语城市"
    zh-TW: "比較世界各地的法語城市"
    ja: "世界のフランス語圏の都市を比べる"
    ko: "세계 프랑스어권 도시 비교하기"
    vi: "So sánh các thành phố nói tiếng Pháp trên thế giới"
    ms: "Bandingkan bandar berbahasa Perancis di dunia"
    id: "Membandingkan kota berbahasa Prancis di dunia"
    hi: "दुनिया भर के फ़्रेंच-भाषी शहरों की तुलना करना"
  - en: "Link city life to history and colonialism"
    zh: "把城市生活与历史和殖民联系起来"
    zh-TW: "把城市生活與歷史和殖民聯繫起來"
    ja: "都市の暮らしを歴史や植民地支配と結びつける"
    ko: "도시 생활을 역사·식민주의와 연결하기"
    vi: "Liên hệ đời sống đô thị với lịch sử và chủ nghĩa thực dân"
    ms: "Kaitkan kehidupan bandar dengan sejarah dan kolonialisme"
    id: "Mengaitkan kehidupan kota dengan sejarah dan kolonialisme"
    hi: "शहरी जीवन को इतिहास और उपनिवेशवाद से जोड़ना"
  - en: "Present on a city in French"
    zh: "用法语介绍一座城市"
    zh-TW: "用法語介紹一座城市"
    ja: "ある都市についてフランス語で発表する"
    ko: "한 도시에 대해 프랑스어로 발표하기"
    vi: "Thuyết trình về một thành phố bằng tiếng Pháp"
    ms: "Bentangkan tentang sebuah bandar dalam bahasa Perancis"
    id: "Mempresentasikan sebuah kota dalam bahasa Prancis"
    hi: "किसी शहर पर फ़्रेंच में प्रस्तुति देना"
