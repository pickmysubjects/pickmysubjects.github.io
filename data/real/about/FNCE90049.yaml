code: FNCE90049
year: 2027
learn:
  en: "Analysing property investments and developments with discounted cash flows, market analysis and debt or equity raising."
  zh: "用现金流折现、市场分析和股债融资分析房地产投资与开发。"
  zh-TW: "用現金流量折現、市場分析與股債籌資分析不動產投資與開發。"
  ja: "割引キャッシュフロー、市場分析、資金調達で不動産投資・開発を分析する。"
  ko: "할인현금흐름, 시장분석, 부채·자본 조달로 부동산 투자와 개발을 분석한다."
  vi: "Phân tích đầu tư và phát triển bất động sản bằng chiết khấu dòng tiền, phân tích thị trường, huy động vốn."
  ms: "Menganalisis pelaburan dan pembangunan hartanah dengan aliran tunai terdiskaun, analisis pasaran dan pembiayaan."
  id: "Menganalisis investasi dan pengembangan properti dengan arus kas terdiskonto, analisis pasar dan pendanaan."
  hi: "डिस्काउंटेड कैश फ्लो, बाज़ार विश्लेषण और पूंजी जुटाने से संपत्ति निवेश व विकास का विश्लेषण।"
outcomes:
  - en: "Identify what drives property investment value"
    zh: "识别影响房地产投资价值的因素"
    zh-TW: "辨識影響不動產投資價值的因素"
    ja: "不動産投資価値を左右する要因を見極める"
    ko: "부동산 투자가치를 좌우하는 요인 파악하기"
    vi: "Xác định yếu tố quyết định giá trị đầu tư bất động sản"
    ms: "Mengenal pasti pemacu nilai pelaburan hartanah"
    id: "Mengenali faktor penentu nilai investasi properti"
    hi: "संपत्ति निवेश मूल्य तय करने वाले कारक पहचानना"
  - en: "Run a financial analysis of a development"
    zh: "对开发项目做财务分析"
    zh-TW: "對開發案做財務分析"
    ja: "開発案件の財務分析を行う"
    ko: "개발 사업의 재무분석 수행하기"
    vi: "Phân tích tài chính một dự án phát triển"
    ms: "Menjalankan analisis kewangan bagi pembangunan"
    id: "Melakukan analisis keuangan suatu pengembangan"
    hi: "किसी विकास परियोजना का वित्तीय विश्लेषण करना"
