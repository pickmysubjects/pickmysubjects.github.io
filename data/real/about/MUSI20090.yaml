code: MUSI20090
year: 2026
learn:
  en: "Guitar ensemble, mostly nylon-string, playing large pieces plus duets, trios and quartets in many styles. Good sight-reading needed."
  zh: "吉他合奏（以古典吉他为主），演奏大合奏及二至四重奏；需较好视奏能力。"
  zh-TW: "吉他合奏（以古典吉他為主），演奏大合奏及二至四重奏；需較好視奏能力。"
  ja: "ギター・アンサンブル（主にクラシックギター）。大編成と二〜四重奏。初見力が必要。"
  ko: "기타 앙상블(주로 클래식 기타). 대편성과 2~4중주. 초견 능력 필요."
  vi: "Hòa tấu guitar (chủ yếu dây nylon): bản lớn và song, tam, tứ tấu. Cần đọc nhạc tốt."
  ms: "Ensembel gitar (kebanyakan tali nilon): karya besar, duet, trio, kuartet. Perlu bacaan pandang baik."
  id: "Ansambel gitar (kebanyakan senar nilon): karya besar, duet, trio, kuartet. Perlu sight-reading baik."
  hi: "गिटार समूह (ज़्यादातर नायलॉन स्ट्रिंग): बड़े पीस और डुएट-क्वार्टेट। अच्छी साइट-रीडिंग ज़रूरी।"
outcomes:
  - en: "Prepare your part and play it accurately in rehearsal"
    zh: "认真准备声部，排练中准确演奏"
    zh-TW: "認真準備聲部，排練中準確演奏"
    ja: "自分のパートを準備し、合奏で正確に演奏する"
    ko: "자기 파트를 준비해 리허설에서 정확히 연주하기"
    vi: "Chuẩn bị bè của mình và chơi chính xác khi tập"
    ms: "Sediakan bahagian sendiri dan mainkan dengan tepat semasa latihan"
    id: "Menyiapkan bagian sendiri dan memainkannya dengan tepat saat latihan"
    hi: "अपना पार्ट तैयार कर रिहर्सल में सही बजाना"
  - en: "Sight-read and play ensemble guitar parts"
    zh: "视奏并演奏合奏吉他声部"
    zh-TW: "視奏並演奏合奏吉他聲部"
    ja: "ギターの合奏パートを初見で弾く"
    ko: "합주 기타 파트 초견 연주하기"
    vi: "Đọc ngay và chơi bè guitar hòa tấu"
    ms: "Baca pandang dan main bahagian gitar ensembel"
    id: "Membaca langsung dan memainkan bagian gitar ansambel"
    hi: "एन्सेम्बल गिटार पार्ट देखकर बजाना"
  - en: "Perform in public concerts as part of the ensemble"
    zh: "随乐团参加公开演出"
    zh-TW: "隨樂團參加公開演出"
    ja: "アンサンブルの一員として公演に出る"
    ko: "앙상블 일원으로 공개 공연하기"
    vi: "Biểu diễn trước khán giả cùng dàn nhạc"
    ms: "Membuat persembahan awam bersama ensembel"
    id: "Tampil di konser publik bersama ansambel"
    hi: "समूह के साथ सार्वजनिक कॉन्सर्ट में प्रस्तुति देना"
