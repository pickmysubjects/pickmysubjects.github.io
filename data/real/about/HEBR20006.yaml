code: HEBR20006
year: 2026
learn:
  en: "Hebrew for wider social settings: songs, films, stories and debates, and giving your own views on cultural issues."
  zh: "在更广的社交场景中用希伯来语：歌曲、电影、故事和辩论，表达对文化议题的看法。"
  zh-TW: "在更廣的社交場景中用希伯來語：歌曲、電影、故事和辯論，表達對文化議題的看法。"
  ja: "より広い場面でのヘブライ語。歌、映画、物語、討論を通じ、文化的な問題に意見を述べる。"
  ko: "더 넓은 사회적 상황의 히브리어. 노래·영화·이야기·토론으로 문화 문제에 의견을 말한다."
  vi: "Tiếng Do Thái cho nhiều bối cảnh xã hội hơn: bài hát, phim, truyện, tranh luận và nêu ý kiến về vấn đề văn hóa."
  ms: "Bahasa Ibrani untuk lebih banyak situasi sosial: lagu, filem, cerita dan debat, serta memberi pandangan tentang isu budaya."
  id: "Bahasa Ibrani untuk lebih banyak situasi sosial: lagu, film, cerita dan debat, serta menyampaikan pendapat soal isu budaya."
  hi: "ज़्यादा सामाजिक संदर्भों में हिब्रू: गीत, फ़िल्में, कहानियाँ और बहस, और सांस्कृतिक मुद्दों पर अपनी राय देना।"
outcomes:
  - en: "Talk about familiar topics in Hebrew with more confidence"
    zh: "更自信地用希伯来语谈论熟悉的话题"
    zh-TW: "更自信地用希伯來語談論熟悉的話題"
    ja: "身近な話題をヘブライ語でより自信を持って話す"
    ko: "익숙한 주제를 히브리어로 더 자신 있게 말하기"
    vi: "Nói về chủ đề quen thuộc bằng tiếng Do Thái tự tin hơn"
    ms: "Bercakap tentang topik biasa dalam bahasa Ibrani dengan lebih yakin"
    id: "Membicarakan topik akrab dalam bahasa Ibrani dengan lebih percaya diri"
    hi: "परिचित विषयों पर हिब्रू में ज़्यादा आत्मविश्वास से बात करना"
  - en: "Read and write short Hebrew texts"
    zh: "读写简短的希伯来语文章"
    zh-TW: "讀寫簡短的希伯來語文章"
    ja: "短いヘブライ語の文章を読み書きする"
    ko: "짧은 히브리어 글 읽고 쓰기"
    vi: "Đọc và viết đoạn văn tiếng Do Thái ngắn"
    ms: "Baca dan tulis teks pendek bahasa Ibrani"
    id: "Membaca dan menulis teks pendek bahasa Ibrani"
    hi: "छोटे हिब्रू पाठ पढ़ना-लिखना"
  - en: "Use new grammar and vocabulary correctly"
    zh: "正确运用新语法和词汇"
    zh-TW: "正確運用新文法和詞彙"
    ja: "新しい文法と語彙を正しく使う"
    ko: "새 문법과 어휘를 정확히 쓰기"
    vi: "Dùng đúng ngữ pháp và từ vựng mới"
    ms: "Guna tatabahasa dan kosa kata baharu dengan betul"
    id: "Memakai tata bahasa dan kosakata baru dengan benar"
    hi: "नया व्याकरण और शब्दावली सही इस्तेमाल करना"
