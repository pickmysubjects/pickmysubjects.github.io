code: MGMT30022
year: 2026
learn:
  en: "The ideas and tactics behind negotiating in business, from contracts and pay to international and multi-party deals."
  zh: "商业谈判的理论和技巧，从合同、薪酬到国际和多方谈判。"
  zh-TW: "商業談判的理論和技巧，從合約、薪資到國際和多方談判。"
  ja: "ビジネス交渉の理論と戦術。契約や賃金から国際・多者間の交渉まで。"
  ko: "비즈니스 협상의 이론과 전술: 계약·임금부터 국제·다자간 협상까지."
  vi: "Lý thuyết và chiến thuật đàm phán kinh doanh, từ hợp đồng, lương đến thương lượng quốc tế, nhiều bên."
  ms: "Idea dan taktik rundingan perniagaan, dari kontrak dan gaji hingga rundingan antarabangsa dan berbilang pihak."
  id: "Teori dan taktik negosiasi bisnis, dari kontrak dan gaji hingga negosiasi internasional dan multipihak."
  hi: "बिज़नेस में मोलभाव के सिद्धांत और तरीके, कॉन्ट्रैक्ट और वेतन से लेकर अंतरराष्ट्रीय और कई पक्षों वाली डील तक।"
outcomes:
  - en: "Plan and run a business negotiation"
    zh: "规划并进行商业谈判"
    zh-TW: "規劃並進行商業談判"
    ja: "ビジネス交渉を計画し実行する"
    ko: "비즈니스 협상 계획하고 진행하기"
    vi: "Lên kế hoạch và tiến hành đàm phán kinh doanh"
    ms: "Rancang dan jalankan rundingan perniagaan"
    id: "Merencanakan dan menjalankan negosiasi bisnis"
    hi: "बिज़नेस नेगोशिएशन प्लान करना और चलाना"
  - en: "Adapt your approach across cultures"
    zh: "根据不同文化调整谈判方式"
    zh-TW: "依不同文化調整談判方式"
    ja: "文化に応じて交渉のやり方を変える"
    ko: "문화에 맞게 협상 방식 조정하기"
    vi: "Điều chỉnh cách đàm phán theo văn hóa"
    ms: "Sesuaikan pendekatan merentas budaya"
    id: "Menyesuaikan pendekatan lintas budaya"
    hi: "अलग संस्कृतियों के हिसाब से तरीका बदलना"
  - en: "Link negotiation tactics to business ethics"
    zh: "把谈判策略与商业伦理联系起来"
    zh-TW: "把談判策略與商業倫理連結起來"
    ja: "交渉戦術とビジネス倫理を結びつけて考える"
    ko: "협상 전술을 기업 윤리와 연결하기"
    vi: "Liên hệ chiến thuật đàm phán với đạo đức kinh doanh"
    ms: "Kaitkan taktik rundingan dengan etika perniagaan"
    id: "Mengaitkan taktik negosiasi dengan etika bisnis"
    hi: "नेगोशिएशन की चालों को बिज़नेस एथिक्स से जोड़ना"
