code: CVEN90049
year: 2027
learn:
  en: "Matrix and finite element structural analysis, and designing reinforced concrete, prestressed concrete and steel members."
  zh: "矩阵法和有限元结构分析，以及钢筋混凝土、预应力混凝土和钢构件设计。"
  zh-TW: "矩陣法與有限元素結構分析，以及鋼筋混凝土、預力混凝土與鋼構件設計。"
  ja: "マトリクス法・有限要素法による構造解析と、RC・PC・鋼部材の設計。"
  ko: "매트릭스법·유한요소법 구조 해석과 철근콘크리트·프리스트레스트 콘크리트·강 부재 설계."
  vi: "Phân tích kết cấu bằng phương pháp ma trận và phần tử hữu hạn, thiết kế cấu kiện bê tông cốt thép, dự ứng lực và thép."
  ms: "Analisis struktur kaedah matriks dan unsur terhingga, serta reka bentuk anggota konkrit bertetulang, prategasan dan keluli."
  id: "Analisis struktur metode matriks dan elemen hingga, serta desain elemen beton bertulang, prategang dan baja."
  hi: "मैट्रिक्स और फ़ाइनाइट एलिमेंट संरचनात्मक विश्लेषण, और आरसीसी, प्रीस्ट्रेस्ड कंक्रीट व स्टील अवयवों का डिज़ाइन।"
outcomes:
  - en: "Analyse indeterminate beams, frames and trusses by the stiffness method"
    zh: "用刚度法分析超静定梁、刚架和桁架"
    zh-TW: "以勁度法分析靜不定梁、剛架與桁架"
    ja: "剛性法で不静定の梁・ラーメン・トラスを解析する"
    ko: "강성법으로 부정정 보·골조·트러스 해석하기"
    vi: "Phân tích dầm, khung, giàn siêu tĩnh bằng phương pháp độ cứng"
    ms: "Menganalisis rasuk, kerangka dan kekuda tak boleh tentu dengan kaedah kekukuhan"
    id: "Menganalisis balok, portal dan rangka batang statis tak tentu dengan metode kekakuan"
    hi: "स्टिफ़नेस विधि से अनिर्धार्य बीम, फ़्रेम और ट्रस का विश्लेषण"
  - en: "Use commercial software to analyse structures"
    zh: "使用商业软件进行结构分析"
    zh-TW: "使用商業軟體進行結構分析"
    ja: "商用ソフトで構造を解析する"
    ko: "상용 소프트웨어로 구조 해석하기"
    vi: "Dùng phần mềm thương mại để phân tích kết cấu"
    ms: "Menggunakan perisian komersial untuk menganalisis struktur"
    id: "Memakai perangkat lunak komersial untuk analisis struktur"
    hi: "व्यावसायिक सॉफ़्टवेयर से संरचनाओं का विश्लेषण"
  - en: "Design structures mixing materials to Australian Standards"
    zh: "按澳大利亚标准设计多种材料组合的结构"
    zh-TW: "依澳洲標準設計多種材料組合的結構"
    ja: "複数材料を組み合わせた構造を豪州規格で設計する"
    ko: "호주 기준에 따라 여러 재료를 조합한 구조 설계하기"
    vi: "Thiết kế kết cấu kết hợp nhiều vật liệu theo tiêu chuẩn Úc"
    ms: "Mereka bentuk struktur pelbagai bahan mengikut Piawaian Australia"
    id: "Merancang struktur gabungan material sesuai Standar Australia"
    hi: "ऑस्ट्रेलियाई मानकों के अनुसार कई सामग्रियों वाली संरचनाएँ डिज़ाइन करना"
