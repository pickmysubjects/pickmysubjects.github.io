code: THTR10007
year: 2026
learn:
  en: "A one-week acting intensive: text analysis, improvisation, voice and movement, and building a character."
  zh: "为期一周的表演密集课：文本分析、即兴、声音与形体，以及塑造角色。"
  zh-TW: "為期一週的表演密集課：文本分析、即興、聲音與肢體，以及塑造角色。"
  ja: "1週間の演技集中講座：台本分析、即興、声と動き、役づくり。"
  ko: "일주일 연기 집중 과정: 텍스트 분석, 즉흥, 발성과 움직임, 캐릭터 만들기."
  vi: "Khóa diễn xuất cấp tốc một tuần: phân tích kịch bản, ứng biến, giọng, hình thể và xây dựng nhân vật."
  ms: "Intensif lakonan seminggu: analisis teks, improvisasi, suara dan gerak, serta membina watak."
  id: "Intensif akting seminggu: analisis teks, improvisasi, vokal dan gerak, serta membangun karakter."
  hi: "एक हफ़्ते का अभिनय इंटेंसिव: पाठ विश्लेषण, इम्प्रोवाइज़ेशन, आवाज़-गति और किरदार गढ़ना।"
outcomes:
  - en: "Perform a prepared monologue"
    zh: "表演一段准备好的独白"
    zh-TW: "表演一段準備好的獨白"
    ja: "準備したモノローグを演じる"
    ko: "준비한 독백 연기하기"
    vi: "Diễn một đoạn độc thoại đã chuẩn bị"
    ms: "Persembahkan monolog yang disediakan"
    id: "Membawakan monolog yang sudah disiapkan"
    hi: "तैयार किया हुआ एकालाप प्रस्तुत करना"
  - en: "Use voice and movement to build a character"
    zh: "运用声音和形体塑造角色"
    zh-TW: "運用聲音和肢體塑造角色"
    ja: "声と動きで役をつくる"
    ko: "발성과 움직임으로 캐릭터 만들기"
    vi: "Dùng giọng và hình thể để xây dựng nhân vật"
    ms: "Guna suara dan gerak untuk membina watak"
    id: "Memakai vokal dan gerak untuk membangun karakter"
    hi: "आवाज़ और गति से किरदार बनाना"
  - en: "Give and take constructive feedback"
    zh: "给出并接受建设性反馈"
    zh-TW: "給出並接受建設性回饋"
    ja: "建設的なフィードバックをやり取りする"
    ko: "건설적인 피드백 주고받기"
    vi: "Góp ý và tiếp nhận góp ý mang tính xây dựng"
    ms: "Beri dan terima maklum balas membina"
    id: "Memberi dan menerima masukan membangun"
    hi: "रचनात्मक प्रतिक्रिया देना और लेना"
