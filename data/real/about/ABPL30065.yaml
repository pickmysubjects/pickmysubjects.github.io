code: ABPL30065
year: 2026
learn:
  en: "A short design studio plus a look at how Western architecture ties in with power, culture and politics."
  zh: "短期设计工作室，加上西方建筑与权力、文化和政治的关系。"
  zh-TW: "短期設計工作室，加上西方建築與權力、文化和政治的關係。"
  ja: "短期の設計スタジオと、西洋建築と権力・文化・政治の関係。"
  ko: "단기 설계 스튜디오와 서양 건축이 권력·문화·정치와 맺는 관계."
  vi: "Xưởng thiết kế ngắn hạn và mối liên hệ giữa kiến trúc phương Tây với quyền lực, văn hóa, chính trị."
  ms: "Studio reka bentuk ringkas serta kaitan seni bina Barat dengan kuasa, budaya dan politik."
  id: "Studio desain singkat dan kaitan arsitektur Barat dengan kekuasaan, budaya, dan politik."
  hi: "छोटा डिज़ाइन स्टूडियो, और पश्चिमी वास्तुकला का सत्ता, संस्कृति व राजनीति से संबंध।"
outcomes:
  - en: "Turn spatial ideas into 2D and 3D designs"
    zh: "把空间构想转化为二维和三维设计"
    zh-TW: "把空間構想轉化為二維和三維設計"
    ja: "空間のアイデアを2D・3Dの設計にする"
    ko: "공간 아이디어를 2D·3D 디자인으로 옮기기"
    vi: "Biến ý tưởng không gian thành thiết kế 2D và 3D"
    ms: "Tukar idea ruang kepada reka bentuk 2D dan 3D"
    id: "Mengubah ide ruang menjadi desain 2D dan 3D"
    hi: "स्थानिक विचारों को 2D और 3D डिज़ाइन में बदलना"
  - en: "Present and critique design work in a studio"
    zh: "在工作室中展示并评析设计作品"
    zh-TW: "在工作室中展示並評析設計作品"
    ja: "スタジオで設計作品を発表し講評する"
    ko: "스튜디오에서 디자인 작품 발표하고 비평하기"
    vi: "Trình bày và phản biện bài thiết kế trong xưởng"
    ms: "Bentang dan kritik kerja reka bentuk di studio"
    id: "Mempresentasikan dan mengkritik karya desain di studio"
    hi: "स्टूडियो में डिज़ाइन प्रस्तुत करना और समीक्षा करना"
  - en: "Explain key phases and themes of Western architecture"
    zh: "说明西方建筑的主要阶段和主题"
    zh-TW: "說明西方建築的主要階段和主題"
    ja: "西洋建築の主な時代とテーマを説明する"
    ko: "서양 건축의 주요 시기와 주제 설명하기"
    vi: "Giải thích các giai đoạn và chủ đề chính của kiến trúc phương Tây"
    ms: "Terangkan fasa dan tema utama seni bina Barat"
    id: "Menjelaskan fase dan tema utama arsitektur Barat"
    hi: "पश्चिमी वास्तुकला के मुख्य दौर और विषय समझाना"
