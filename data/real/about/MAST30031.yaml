code: MAST30031
year: 2026
learn:
  en: "Advanced maths tools for physics, with examples from quantum theory, electromagnetism and particles."
  zh: "物理用的进阶数学工具，例子来自量子、电磁和粒子物理。"
  zh-TW: "物理用的進階數學工具，例子來自量子、電磁和粒子物理。"
  ja: "物理のための発展的な数学。量子論・電磁気学・素粒子の例を使う。"
  ko: "물리학을 위한 고급 수학 도구. 양자론, 전자기학, 입자물리 예시."
  vi: "Công cụ toán nâng cao cho vật lý, với ví dụ từ lượng tử, điện từ học và hạt."
  ms: "Alat matematik lanjutan untuk fizik, dengan contoh daripada teori kuantum, elektromagnet dan zarah."
  id: "Alat matematika lanjutan untuk fisika, dengan contoh dari teori kuantum, elektromagnetisme, dan partikel."
  hi: "भौतिकी के लिए उन्नत गणित, क्वांटम, विद्युतचुंबकत्व और कणों के उदाहरणों के साथ।"
outcomes:
  - en: "Use special functions to solve physics equations"
    zh: "用特殊函数解物理方程"
    zh-TW: "用特殊函數解物理方程"
    ja: "特殊関数で物理の方程式を解く"
    ko: "특수함수로 물리 방정식 풀기"
    vi: "Dùng hàm đặc biệt để giải phương trình vật lý"
    ms: "Menggunakan fungsi khas untuk menyelesaikan persamaan fizik"
    id: "Memakai fungsi khusus untuk menyelesaikan persamaan fisika"
    hi: "विशेष फ़ंक्शन से भौतिकी के समीकरण हल करना"
  - en: "Use differential forms in multivariable calculus"
    zh: "在多元微积分里用微分形式"
    zh-TW: "在多變數微積分裡用微分形式"
    ja: "多変数微積分で微分形式を使う"
    ko: "다변수 미적분에서 미분형식 사용하기"
    vi: "Dùng dạng vi phân trong giải tích nhiều biến"
    ms: "Menggunakan bentuk pembezaan dalam kalkulus multivariat"
    id: "Memakai bentuk diferensial di kalkulus multivariabel"
    hi: "बहुचर कैलकुलस में डिफ़रेंशियल फ़ॉर्म का उपयोग"
  - en: "Model symmetries with groups and Lie algebras"
    zh: "用群和李代数描述对称性"
    zh-TW: "用群和李代數描述對稱性"
    ja: "群とリー代数で対称性を表す"
    ko: "군과 리 대수로 대칭성 모델링하기"
    vi: "Mô hình hóa đối xứng bằng nhóm và đại số Lie"
    ms: "Memodelkan simetri dengan kumpulan dan algebra Lie"
    id: "Memodelkan simetri dengan grup dan aljabar Lie"
    hi: "ग्रुप और ली बीजगणित से सममिति का मॉडल बनाना"
