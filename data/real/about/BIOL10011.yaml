code: BIOL10011
year: 2026
learn:
  en: "Biology from individuals to ecosystems: evolution, how organisms work and interact, and energy flow."
  zh: "从个体到生态系统：演化、生物结构、相互作用和能量流动。"
  zh-TW: "從個體到生態系：演化、生物結構、交互作用和能量流動。"
  ja: "個体から生態系までの生物学：進化、生物の仕組みと相互作用、エネルギーの流れ。"
  ko: "개체에서 생태계까지의 생물학: 진화, 생물의 작동과 상호작용, 에너지 흐름."
  vi: "Sinh học từ cá thể đến hệ sinh thái: tiến hóa, hoạt động, tương tác của sinh vật và dòng năng lượng."
  ms: "Biologi dari individu ke ekosistem: evolusi, fungsi dan interaksi organisma, serta aliran tenaga."
  id: "Biologi dari individu ke ekosistem: evolusi, cara organisme bekerja dan berinteraksi, serta aliran energi."
  hi: "व्यक्ति से इकोसिस्टम तक बायोलॉजी: विकास, जीवों का काम व आपसी संबंध, और ऊर्जा प्रवाह।"
outcomes:
  - en: "Explain how evolution created life's diversity"
    zh: "解释演化怎样造就生物多样性"
    zh-TW: "解釋演化如何造就生物多樣性"
    ja: "進化が生物の多様性を生んだ仕組みを説明する"
    ko: "진화가 생물 다양성을 만든 과정 설명하기"
    vi: "Giải thích tiến hóa tạo nên đa dạng sự sống ra sao"
    ms: "Terangkan cara evolusi mencipta kepelbagaian hidupan"
    id: "Menjelaskan cara evolusi menciptakan keragaman hayati"
    hi: "समझाना कि विकास से जीवन की विविधता कैसे बनी"
  - en: "Describe energy and material cycles in ecosystems"
    zh: "描述生态系统的能量和物质循环"
    zh-TW: "描述生態系的能量和物質循環"
    ja: "生態系のエネルギーと物質の循環を説明する"
    ko: "생태계의 에너지·물질 순환 설명하기"
    vi: "Mô tả chu trình năng lượng và vật chất trong hệ sinh thái"
    ms: "Huraikan kitaran tenaga dan bahan dalam ekosistem"
    id: "Menjelaskan siklus energi dan materi dalam ekosistem"
    hi: "इकोसिस्टम में ऊर्जा और पदार्थ के चक्र बताना"
  - en: "Design and run a small inquiry project"
    zh: "设计并完成一个探究项目"
    zh-TW: "設計並完成一個探究專題"
    ja: "小さな探究プロジェクトを計画・実施する"
    ko: "작은 탐구 프로젝트 설계하고 수행하기"
    vi: "Thiết kế và thực hiện một dự án tìm hiểu nhỏ"
    ms: "Reka dan jalankan projek inkuiri kecil"
    id: "Merancang dan menjalankan proyek inkuiri kecil"
    hi: "एक छोटा इन्क्वायरी प्रोजेक्ट डिज़ाइन करके चलाना"
