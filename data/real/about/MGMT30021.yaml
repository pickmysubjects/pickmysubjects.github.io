code: MGMT30021
year: 2026
learn:
  en: "Using people data and analytics to understand behaviour at work and support HR decisions."
  zh: "用员工数据和分析理解职场行为，支持人力资源决策。"
  zh-TW: "用員工資料和分析理解職場行為，支援人資決策。"
  ja: "人材データと分析で職場の行動を理解し、人事の判断を支える。"
  ko: "인사 데이터와 분석으로 직장 내 행동을 이해하고 HR 결정 지원하기."
  vi: "Dùng dữ liệu và phân tích về con người để hiểu hành vi nơi làm việc và hỗ trợ quyết định nhân sự."
  ms: "Guna data dan analitik pekerja untuk faham tingkah laku di tempat kerja dan sokong keputusan HR."
  id: "Memakai data dan analitik karyawan untuk memahami perilaku kerja dan mendukung keputusan SDM."
  hi: "लोगों के डेटा और एनालिटिक्स से कार्यस्थल का व्यवहार समझना और HR फ़ैसलों में मदद करना।"
outcomes:
  - en: "Design HR metrics and pick suitable statistical tests"
    zh: "设计人力资源指标并选择合适的统计检验"
    zh-TW: "設計人資指標並選擇合適的統計檢定"
    ja: "人事指標を設計し適切な統計検定を選ぶ"
    ko: "HR 지표 설계와 적절한 통계 검정 선택"
    vi: "Thiết kế chỉ số nhân sự và chọn kiểm định thống kê"
    ms: "Reka metrik HR dan pilih ujian statistik sesuai"
    id: "Merancang metrik SDM dan memilih uji statistik"
    hi: "HR मेट्रिक्स बनाना और सही सांख्यिकीय टेस्ट चुनना"
  - en: "Present HR data clearly to decision makers"
    zh: "向决策者清楚呈现人力资源数据"
    zh-TW: "向決策者清楚呈現人資資料"
    ja: "人事データを意思決定者にわかりやすく示す"
    ko: "HR 데이터를 의사결정자에게 명확히 제시하기"
    vi: "Trình bày dữ liệu nhân sự rõ ràng cho người ra quyết định"
    ms: "Bentangkan data HR dengan jelas kepada pembuat keputusan"
    id: "Menyajikan data SDM dengan jelas ke pengambil keputusan"
    hi: "फ़ैसला लेने वालों को HR डेटा साफ़ दिखाना"
  - en: "Weigh the ethics of collecting people data"
    zh: "权衡收集员工数据的伦理问题"
    zh-TW: "權衡蒐集員工資料的倫理問題"
    ja: "人に関するデータ収集の倫理を考える"
    ko: "인사 데이터 수집의 윤리 따져보기"
    vi: "Cân nhắc đạo đức khi thu thập dữ liệu về con người"
    ms: "Timbang etika mengumpul data pekerja"
    id: "Menimbang etika pengumpulan data karyawan"
    hi: "लोगों का डेटा जुटाने की नैतिकता पर सोचना"
