code: CWRI10003
year: 2026
learn:
  en: "Trying many creative forms, such as creative nonfiction, comics, photo-essays, scripts and podcasts, from idea to edit."
  zh: "尝试多种创意形式，如创意非虚构、漫画、图片散文、剧本和播客，从构思到修改。"
  zh-TW: "嘗試多種創意形式，如創意非虛構、漫畫、圖片散文、劇本和Podcast，從構思到修改。"
  ja: "創作ノンフィクション、漫画、フォトエッセイ、脚本、ポッドキャストなど様々な形式を、着想から推敲まで試す。"
  ko: "창작 논픽션, 만화, 포토 에세이, 대본, 팟캐스트 등 여러 형식을 아이디어부터 퇴고까지 시도한다."
  vi: "Thử nhiều hình thức sáng tạo như phi hư cấu sáng tạo, truyện tranh, tiểu luận ảnh, kịch bản và podcast, từ ý tưởng đến chỉnh sửa."
  ms: "Mencuba pelbagai bentuk kreatif seperti bukan fiksyen kreatif, komik, esei foto, skrip dan podcast, dari idea hingga suntingan."
  id: "Mencoba banyak bentuk kreatif seperti nonfiksi kreatif, komik, esai foto, naskah dan podcast, dari ide sampai suntingan."
  hi: "कई रचनात्मक रूप आज़माना, जैसे रचनात्मक नॉन-फ़िक्शन, कॉमिक्स, फ़ोटो-निबंध, स्क्रिप्ट और पॉडकास्ट, विचार से संपादन तक।"
outcomes:
  - en: "Write in several creative and multimodal forms"
    zh: "用多种创意和多模态形式写作"
    zh-TW: "用多種創意和多模態形式寫作"
    ja: "複数の創作・マルチモーダル形式で書く"
    ko: "여러 창작·멀티모달 형식으로 쓰기"
    vi: "Viết bằng nhiều hình thức sáng tạo và đa phương thức"
    ms: "Menulis dalam beberapa bentuk kreatif dan multimodal"
    id: "Menulis dalam beberapa bentuk kreatif dan multimodal"
    hi: "कई रचनात्मक और मल्टीमोडल रूपों में लिखना"
  - en: "Choose form and style to suit an idea"
    zh: "根据构思选择合适的形式和风格"
    zh-TW: "根據構思選擇合適的形式和風格"
    ja: "着想に合う形式と文体を選ぶ"
    ko: "아이디어에 맞는 형식과 문체 고르기"
    vi: "Chọn hình thức và văn phong hợp với ý tưởng"
    ms: "Pilih bentuk dan gaya yang sesuai dengan idea"
    id: "Memilih bentuk dan gaya yang sesuai dengan ide"
    hi: "विचार के अनुसार रूप और शैली चुनना"
  - en: "Discuss your own and others' creative work"
    zh: "讨论自己和他人的创作"
    zh-TW: "討論自己和他人的創作"
    ja: "自分や他人の作品について話し合う"
    ko: "자신과 다른 사람의 창작물 논의하기"
    vi: "Thảo luận tác phẩm của mình và người khác"
    ms: "Bincangkan karya kreatif sendiri dan orang lain"
    id: "Membahas karya kreatif sendiri dan orang lain"
    hi: "अपने और दूसरों के रचनात्मक काम पर चर्चा करना"
