code: MECM20010
year: 2026
learn:
  en: "How global media companies and platforms are organised and regulated, and how their reach plays out differently across regions."
  zh: "全球媒体公司和平台如何组织、受到怎样的监管，以及它们的影响在不同地区有何差异。"
  zh-TW: "全球媒體公司和平台如何組織、受到怎樣的監管，以及它們的影響在不同地區有何差異。"
  ja: "世界的なメディア企業やプラットフォームの組織と規制、そしてその影響が地域ごとにどう違うかを学ぶ。"
  ko: "글로벌 미디어 기업과 플랫폼이 어떻게 조직되고 규제되는지, 그 영향이 지역마다 어떻게 다른지 배운다."
  vi: "Các công ty và nền tảng truyền thông toàn cầu được tổ chức, quản lý ra sao và ảnh hưởng của chúng khác nhau thế nào giữa các khu vực."
  ms: "Bagaimana syarikat dan platform media global disusun dan dikawal, dan bagaimana pengaruhnya berbeza mengikut rantau."
  id: "Bagaimana perusahaan dan platform media global diatur dan diregulasi, serta bagaimana pengaruhnya berbeda di tiap wilayah."
  hi: "वैश्विक मीडिया कंपनियाँ और प्लेटफ़ॉर्म कैसे संगठित और नियंत्रित होते हैं, और उनका असर अलग-अलग क्षेत्रों में कैसे अलग दिखता है।"
outcomes:
  - en: "Describe how global media organisations are structured"
    zh: "描述跨国媒体机构的组织结构"
    zh-TW: "描述跨國媒體機構的組織結構"
    ja: "多国籍メディア組織の構造を説明する"
    ko: "다국적 미디어 조직의 구조 설명하기"
    vi: "Mô tả cấu trúc của các tổ chức truyền thông xuyên quốc gia"
    ms: "Huraikan struktur organisasi media rentas negara"
    id: "Menjelaskan struktur organisasi media lintas negara"
    hi: "वैश्विक मीडिया संगठनों की संरचना बताना"
  - en: "Explain how global media plays out in different regions"
    zh: "说明全球媒体在不同地区的具体影响"
    zh-TW: "說明全球媒體在不同地區的具體影響"
    ja: "世界的なメディアが地域ごとにどう作用するか説明する"
    ko: "글로벌 미디어가 지역마다 어떻게 작용하는지 설명하기"
    vi: "Giải thích truyền thông toàn cầu tác động thế nào ở từng khu vực"
    ms: "Terangkan kesan media global di rantau berbeza"
    id: "Menjelaskan dampak media global di berbagai wilayah"
    hi: "समझाना कि वैश्विक मीडिया अलग क्षेत्रों में कैसे असर करता है"
  - en: "Compare media systems across countries"
    zh: "比较不同国家的媒体体制"
    zh-TW: "比較不同國家的媒體體制"
    ja: "国ごとのメディア制度を比較する"
    ko: "나라별 미디어 체계 비교하기"
    vi: "So sánh hệ thống truyền thông giữa các nước"
    ms: "Bandingkan sistem media antara negara"
    id: "Membandingkan sistem media antarnegara"
    hi: "अलग-अलग देशों की मीडिया व्यवस्थाओं की तुलना करना"
