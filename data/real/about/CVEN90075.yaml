code: CVEN90075
year: 2027
learn:
  en: "Road geometry, pavement design, bridges and tunnels, public transport planning and digital transport systems."
  zh: "道路线形、路面设计、桥梁隧道、公共交通规划和数字交通系统。"
  zh-TW: "道路線形、路面設計、橋梁隧道、公共交通規劃和數位交通系統。"
  ja: "道路の線形設計、舗装設計、橋梁・トンネル、公共交通計画、デジタル交通システム。"
  ko: "도로 선형, 포장 설계, 교량·터널, 대중교통 계획, 디지털 교통 시스템."
  vi: "Thiết kế hình học đường, mặt đường, cầu hầm, quy hoạch giao thông công cộng và hệ thống giao thông số."
  ms: "Reka bentuk geometri jalan, turapan, jambatan dan terowong, perancangan pengangkutan awam dan sistem pengangkutan digital."
  id: "Desain geometri jalan, perkerasan, jembatan dan terowongan, perencanaan transportasi umum, dan sistem transportasi digital."
  hi: "सड़क ज्यामिति, पेवमेंट डिज़ाइन, पुल-सुरंग, सार्वजनिक परिवहन योजना और डिजिटल परिवहन प्रणालियाँ।"
outcomes:
  - en: "Develop geometric and pavement designs for roads"
    zh: "完成道路线形和路面设计"
    zh-TW: "道路線形と路面設計を完成"
    ja: "道路の線形・舗装設計を行う"
    ko: "도로 선형과 포장 설계하기"
    vi: "Thiết kế hình học và mặt đường cho đường bộ"
    ms: "Membangunkan reka bentuk geometri dan turapan jalan"
    id: "Menyusun desain geometri dan perkerasan jalan"
    hi: "सड़कों का ज्यामितीय और पेवमेंट डिज़ाइन बनाना"
  - en: "Evaluate public transport and digital transport infrastructure"
    zh: "评估公共交通和数字交通基础设施"
    zh-TW: "評估公共交通和數位交通基礎設施"
    ja: "公共交通とデジタル交通インフラを評価する"
    ko: "대중교통과 디지털 교통 인프라 평가하기"
    vi: "Đánh giá hạ tầng giao thông công cộng và giao thông số"
    ms: "Menilai infrastruktur pengangkutan awam dan digital"
    id: "Menilai infrastruktur transportasi umum dan digital"
    hi: "सार्वजनिक और डिजिटल परिवहन अवसंरचना का मूल्यांकन"
