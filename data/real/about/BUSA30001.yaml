code: BUSA30001
year: 2026
learn:
  en: "Working through real business cases in teams, building a strategy and presenting it."
  zh: "分组分析真实商业案例，制定策略并做展示。"
  zh-TW: "分組分析真實商業個案，擬定策略並上台簡報。"
  ja: "チームで実際のビジネス事例に取り組み、戦略を立てて発表する。"
  ko: "팀으로 실제 비즈니스 사례를 분석하고 전략을 세워 발표한다."
  vi: "Làm việc nhóm với các tình huống kinh doanh thực tế, xây dựng chiến lược và thuyết trình."
  ms: "Menyelesaikan kes perniagaan sebenar secara berpasukan, membina strategi dan membentangkannya."
  id: "Mengerjakan kasus bisnis nyata dalam tim, menyusun strategi, lalu mempresentasikannya."
  hi: "टीम में असली बिज़नेस केस पर काम करना, रणनीति बनाना और उसे प्रेज़ेंट करना।"
outcomes:
  - en: "Break down and analyse a business case"
    zh: "拆解并分析商业案例"
    zh-TW: "拆解並分析商業個案"
    ja: "ビジネス事例を分解して分析する"
    ko: "비즈니스 사례를 나눠 분석하기"
    vi: "Phân tích chi tiết một tình huống kinh doanh"
    ms: "Pecahkan dan analisis kes perniagaan"
    id: "Mengurai dan menganalisis kasus bisnis"
    hi: "बिज़नेस केस को तोड़कर उसका विश्लेषण करना"
  - en: "Develop a strategy and justify the choice"
    zh: "制定策略并论证选择"
    zh-TW: "擬定策略並論證選擇"
    ja: "戦略を立て、その選択を説明する"
    ko: "전략을 세우고 선택의 근거 제시"
    vi: "Xây dựng chiến lược và lý giải lựa chọn"
    ms: "Bina strategi dan wajarkan pilihan"
    id: "Menyusun strategi dan membenarkan pilihannya"
    hi: "रणनीति बनाना और चुनाव का औचित्य बताना"
  - en: "Present as a team and handle questions"
    zh: "以团队形式展示并回答提问"
    zh-TW: "以團隊形式簡報並回答提問"
    ja: "チームで発表し質問に答える"
    ko: "팀으로 발표하고 질문에 답하기"
    vi: "Thuyết trình theo nhóm và trả lời câu hỏi"
    ms: "Bentang secara berpasukan dan jawab soalan"
    id: "Presentasi bersama tim dan menjawab pertanyaan"
    hi: "टीम के रूप में प्रेज़ेंट करना और सवालों के जवाब देना"
