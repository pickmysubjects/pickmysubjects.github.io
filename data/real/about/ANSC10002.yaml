code: ANSC10002
year: 2026
learn:
  en: "How farm animals work: nutrition, breeding, health, behaviour and welfare, with hands-on practicals."
  zh: "农场动物的营养、繁育、健康、行为与福利，含动手实践课。"
  zh-TW: "農場動物的營養、繁育、健康、行為與福利，含動手實作課。"
  ja: "家畜の栄養・繁殖・健康・行動・福祉を実習とともに学ぶ。"
  ko: "가축의 영양·번식·건강·행동·복지를 실습과 함께 배움."
  vi: "Dinh dưỡng, chọn giống, sức khỏe, hành vi và phúc lợi vật nuôi, có thực hành."
  ms: "Pemakanan, pembiakan, kesihatan, tingkah laku dan kebajikan haiwan ternakan, dengan amali."
  id: "Nutrisi, pemuliaan, kesehatan, perilaku, dan kesejahteraan ternak, dengan praktikum."
  hi: "खेत के पशुओं का पोषण, प्रजनन, स्वास्थ्य, व्यवहार और कल्याण, प्रैक्टिकल के साथ।"
outcomes:
  - en: "Match feeds to animal needs and plan rations"
    zh: "按动物需求搭配饲料、制定日粮"
    zh-TW: "依動物需求搭配飼料、制定日糧"
    ja: "家畜の要求に合わせ飼料を設計する"
    ko: "동물 요구에 맞춰 사료 배합하기"
    vi: "Phối thức ăn theo nhu cầu vật nuôi"
    ms: "Padankan makanan dengan keperluan haiwan"
    id: "Menyesuaikan pakan dengan kebutuhan ternak"
    hi: "पशु की ज़रूरत के अनुसार चारा तय करना"
  - en: "Plan breeding and health programs"
    zh: "规划繁育和健康管理方案"
    zh-TW: "規劃繁育和健康管理方案"
    ja: "繁殖と衛生の計画を立てる"
    ko: "번식 및 건강 관리 계획 세우기"
    vi: "Lập kế hoạch chọn giống và chăm sóc sức khỏe"
    ms: "Rancang program pembiakan dan kesihatan"
    id: "Merencanakan program pemuliaan dan kesehatan"
    hi: "प्रजनन और स्वास्थ्य कार्यक्रम बनाना"
  - en: "Handle and work safely with animals"
    zh: "安全地接触和处理动物"
    zh-TW: "安全地接觸和處理動物"
    ja: "動物を安全に扱う"
    ko: "동물을 안전하게 다루기"
    vi: "Xử lý và làm việc an toàn với động vật"
    ms: "Kendalikan haiwan dengan selamat"
    id: "Menangani ternak dengan aman"
    hi: "पशुओं को सुरक्षित रूप से संभालना"
