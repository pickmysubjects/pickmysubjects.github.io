code: ENEN90038
year: 2027
learn:
  en: "Surface water and groundwater for engineers: rainfall, floods, runoff and groundwater flow models."
  zh: "面向工程的地表水和地下水：降雨、洪水、径流和地下水流动模型。"
  zh-TW: "面向工程的地表水與地下水：降雨、洪水、逕流與地下水流動模型。"
  ja: "技術者のための地表水・地下水：降雨、洪水、流出、地下水流動モデル。"
  ko: "엔지니어를 위한 지표수와 지하수: 강우, 홍수, 유출, 지하수 흐름 모델."
  vi: "Nước mặt và nước ngầm cho kỹ sư: mưa, lũ, dòng chảy và mô hình dòng nước ngầm."
  ms: "Air permukaan dan air bawah tanah untuk jurutera: hujan, banjir, larian dan model aliran air bawah tanah."
  id: "Air permukaan dan air tanah untuk insinyur: hujan, banjir, limpasan, dan model aliran air tanah."
  hi: "इंजीनियरों के लिए सतही और भूजल: वर्षा, बाढ़, अपवाह और भूजल प्रवाह मॉडल।"
outcomes:
  - en: "Run flood frequency analysis for design"
    zh: "为设计开展洪水频率分析"
    zh-TW: "為設計進行洪水頻率分析"
    ja: "設計のための洪水頻度解析を行う"
    ko: "설계를 위한 홍수 빈도 분석하기"
    vi: "Phân tích tần suất lũ cho thiết kế"
    ms: "Menjalankan analisis kekerapan banjir untuk reka bentuk"
    id: "Melakukan analisis frekuensi banjir untuk desain"
    hi: "डिज़ाइन के लिए बाढ़ आवृत्ति विश्लेषण"
  - en: "Build water balance and simple water quality models"
    zh: "建立水量平衡和简单水质模型"
    zh-TW: "建立水量平衡與簡單水質模型"
    ja: "水収支と簡単な水質モデルを作る"
    ko: "물수지와 간단한 수질 모델 만들기"
    vi: "Xây dựng mô hình cân bằng nước và chất lượng nước đơn giản"
    ms: "Membina model imbangan air dan kualiti air ringkas"
    id: "Membangun model neraca air dan kualitas air sederhana"
    hi: "जल संतुलन और सरल जल गुणवत्ता मॉडल बनाना"
  - en: "Model groundwater flow and contamination"
    zh: "为地下水流动和污染建模"
    zh-TW: "為地下水流動與污染建模"
    ja: "地下水の流れと汚染をモデル化する"
    ko: "지하수 흐름과 오염 모델링하기"
    vi: "Mô hình hóa dòng chảy và ô nhiễm nước ngầm"
    ms: "Memodelkan aliran dan pencemaran air bawah tanah"
    id: "Memodelkan aliran dan pencemaran air tanah"
    hi: "भूजल प्रवाह और प्रदूषण का मॉडल"
