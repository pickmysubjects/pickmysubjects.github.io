code: SCIE90002
year: 2027
learn:
  en: "State-of-the-art analytical techniques in biotechnology, taught by scientists from industry and academia."
  zh: "生物技术前沿分析技术，由产业界和学术界的科学家授课。"
  zh-TW: "生物科技前沿分析技術，由產業界與學術界的科學家授課。"
  ja: "産業界と学術界の研究者が教える、バイオテクノロジーの最新分析技術。"
  ko: "산업계와 학계 과학자가 가르치는 생명공학 최신 분석 기술."
  vi: "Các kỹ thuật phân tích hiện đại trong công nghệ sinh học, do nhà khoa học từ ngành và học thuật giảng dạy."
  ms: "Teknik analisis terkini dalam bioteknologi, diajar oleh saintis industri dan akademik."
  id: "Teknik analisis mutakhir di bioteknologi, diajarkan ilmuwan dari industri dan akademisi."
  hi: "जैव-प्रौद्योगिकी की आधुनिक विश्लेषण तकनीकें, उद्योग और अकादमिक वैज्ञानिकों द्वारा।"
outcomes:
  - en: "Discuss current analytical techniques"
    zh: "讨论当前的分析技术"
    zh-TW: "討論當前的分析技術"
    ja: "最新の分析技術について論じる"
    ko: "최신 분석 기술 논의하기"
    vi: "Thảo luận các kỹ thuật phân tích hiện nay"
    ms: "Membincangkan teknik analisis semasa"
    id: "Membahas teknik analisis terkini"
    hi: "वर्तमान विश्लेषण तकनीकों पर चर्चा"
  - en: "Evaluate biotech research in industry and academia"
    zh: "评价产业和学术界的生物技术研究"
    zh-TW: "評價產業與學術界的生物科技研究"
    ja: "産業界と学術界のバイオ研究を評価する"
    ko: "산업계·학계 생명공학 연구 평가하기"
    vi: "Đánh giá nghiên cứu công nghệ sinh học"
    ms: "Menilai penyelidikan bioteknologi industri dan akademik"
    id: "Mengevaluasi riset bioteknologi industri dan akademik"
    hi: "उद्योग और अकादमिक बायोटेक शोध का मूल्यांकन"
  - en: "Analyse and interpret biotech data"
    zh: "分析和解读生物技术数据"
    zh-TW: "分析與解讀生物科技資料"
    ja: "バイオのデータを分析・解釈する"
    ko: "생명공학 데이터 분석·해석하기"
    vi: "Phân tích và diễn giải dữ liệu sinh học"
    ms: "Menganalisis dan mentafsir data bioteknologi"
    id: "Menganalisis dan menafsirkan data bioteknologi"
    hi: "बायोटेक डेटा का विश्लेषण और व्याख्या"
