code: HPSC20027
year: 2027
learn:
  en: "How science became a modern profession between 1700 and 1900, set in the history of Europe and colonial expansion."
  zh: "1700到1900年间，科学如何在欧洲历史和殖民扩张中成为现代职业。"
  zh-TW: "1700到1900年間，科學如何在歐洲歷史和殖民擴張中成為現代職業。"
  ja: "1700〜1900年に、ヨーロッパ史と植民地拡大の中で科学が近代的な職業になった過程。"
  ko: "1700~1900년 유럽사와 식민 확장 속에서 과학이 근대적 직업이 된 과정."
  vi: "Khoa học trở thành một nghề hiện đại từ 1700 đến 1900 ra sao, trong bối cảnh lịch sử châu Âu và bành trướng thuộc địa."
  ms: "Cara sains menjadi profesion moden antara 1700 dan 1900, dalam sejarah Eropah dan perluasan penjajahan."
  id: "Bagaimana sains menjadi profesi modern antara 1700 dan 1900, dalam sejarah Eropa dan ekspansi kolonial."
  hi: "1700 से 1900 के बीच यूरोप के इतिहास और औपनिवेशिक विस्तार के दौर में विज्ञान आधुनिक पेशा कैसे बना।"
outcomes:
  - en: "Identify major shifts in the history of science"
    zh: "识别科学史上的重大转变"
    zh-TW: "辨識科學史上的重大轉變"
    ja: "科学史の大きな転換を見分ける"
    ko: "과학사의 주요 전환 파악하기"
    vi: "Nhận ra các bước chuyển lớn trong lịch sử khoa học"
    ms: "Kenal pasti perubahan besar dalam sejarah sains"
    id: "Mengenali pergeseran besar dalam sejarah sains"
    hi: "विज्ञान के इतिहास के बड़े बदलाव पहचानना"
  - en: "See how social context shapes knowledge"
    zh: "理解社会背景如何塑造知识"
    zh-TW: "理解社會背景如何形塑知識"
    ja: "社会的背景が知識を形づくる仕組みを知る"
    ko: "사회적 맥락이 지식을 형성하는 방식 이해하기"
    vi: "Hiểu bối cảnh xã hội định hình tri thức thế nào"
    ms: "Fahami cara konteks sosial membentuk ilmu"
    id: "Memahami cara konteks sosial membentuk pengetahuan"
    hi: "सामाजिक संदर्भ ज्ञान को कैसे गढ़ता है, यह समझना"
