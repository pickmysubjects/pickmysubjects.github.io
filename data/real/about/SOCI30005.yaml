code: SOCI30005
year: 2026
learn:
  en: "A supervised placement with an outside organisation, doing a sociology research project or portfolio of work."
  zh: "在校外机构实习，并在指导下完成一项社会学研究项目或作品集。"
  zh-TW: "在校外機構實習，並在指導下完成一項社會學研究計畫或作品集。"
  ja: "学外の組織で実習し、指導のもと社会学の研究プロジェクトや成果物をまとめる。"
  ko: "외부 기관에서 실습하며 지도 아래 사회학 연구 프로젝트나 작업 포트폴리오를 완성한다."
  vi: "Thực tập có hướng dẫn tại một tổ chức bên ngoài, làm dự án nghiên cứu xã hội học hoặc hồ sơ công việc."
  ms: "Penempatan berpenyelia di organisasi luar, menjalankan projek penyelidikan sosiologi atau portfolio kerja."
  id: "Magang terbimbing di organisasi luar, mengerjakan proyek riset sosiologi atau portofolio kerja."
  hi: "किसी बाहरी संस्था में निगरानी वाला प्लेसमेंट, जिसमें समाजशास्त्रीय शोध प्रोजेक्ट या काम का पोर्टफोलियो बनाना है।"
outcomes:
  - en: "Apply sociology in a real workplace"
    zh: "在真实工作场所中运用社会学"
    zh-TW: "在真實工作場所中運用社會學"
    ja: "実際の職場で社会学を活かす"
    ko: "실제 직장에서 사회학 적용하기"
    vi: "Áp dụng xã hội học tại nơi làm việc thực tế"
    ms: "Aplikasikan sosiologi di tempat kerja sebenar"
    id: "Menerapkan sosiologi di tempat kerja nyata"
    hi: "असली कार्यस्थल में समाजशास्त्र लागू करना"
  - en: "Plan and complete a project with a host organisation"
    zh: "与实习机构一起规划并完成项目"
    zh-TW: "與實習機構一起規劃並完成計畫"
    ja: "受け入れ先と一緒に課題を計画し仕上げる"
    ko: "기관과 함께 프로젝트 계획하고 완수하기"
    vi: "Lên kế hoạch và hoàn thành dự án với tổ chức tiếp nhận"
    ms: "Rancang dan siapkan projek bersama organisasi tuan rumah"
    id: "Merencanakan dan menyelesaikan proyek bersama organisasi mitra"
    hi: "मेज़बान संस्था के साथ प्रोजेक्ट की योजना बनाकर पूरा करना"
  - en: "Reflect on your work in a written report"
    zh: "在书面报告中反思自己的工作"
    zh-TW: "在書面報告中反思自己的工作"
    ja: "自分の仕事をレポートで振り返る"
    ko: "서면 보고서로 자신의 작업 돌아보기"
    vi: "Viết báo cáo nhìn lại công việc của mình"
    ms: "Renungkan kerja anda dalam laporan bertulis"
    id: "Merefleksikan pekerjaan dalam laporan tertulis"
    hi: "लिखित रिपोर्ट में अपने काम पर विचार करना"
