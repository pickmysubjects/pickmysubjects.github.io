code: POLS20006
year: 2026
learn:
  en: "Main schools of recent political theory, like liberalism and multiculturalism, applied to debates such as migration and welfare."
  zh: "近几十年政治理论的主要流派，比如自由主义和多元文化主义，并用来分析移民、福利等争议。"
  zh-TW: "近幾十年政治理論的主要流派，例如自由主義和多元文化主義，並用來分析移民、福利等爭議。"
  ja: "ここ数十年の政治理論の主要な学派（リベラリズム、多文化主義など）を学び、移民や福祉などの論争に当てはめる。"
  ko: "최근 수십 년간의 주요 정치 이론 학파(자유주의, 다문화주의 등)를 배우고 이민, 복지 같은 논쟁에 적용한다."
  vi: "Các trường phái lý thuyết chính trị chính trong vài thập kỷ gần đây như chủ nghĩa tự do, đa văn hóa, áp dụng vào tranh luận về di cư, phúc lợi."
  ms: "Aliran utama teori politik beberapa dekad kebelakangan, seperti liberalisme dan multibudaya, diguna pada perdebatan seperti migrasi dan kebajikan."
  id: "Aliran utama teori politik beberapa dekade terakhir, seperti liberalisme dan multikulturalisme, dipakai untuk membahas isu seperti migrasi dan kesejahteraan."
  hi: "पिछले कुछ दशकों के राजनीतिक सिद्धांत के मुख्य स्कूल, जैसे उदारवाद और बहुसंस्कृतिवाद, और प्रवास व कल्याण जैसी बहसों पर उनका इस्तेमाल।"
outcomes:
  - en: "Explain the main schools of recent political theory"
    zh: "解释近年政治理论的主要流派"
    zh-TW: "解釋近年政治理論的主要流派"
    ja: "近年の政治理論の主要な学派を説明する"
    ko: "최근 정치 이론의 주요 학파 설명하기"
    vi: "Giải thích các trường phái chính của lý thuyết chính trị gần đây"
    ms: "Terangkan aliran utama teori politik terkini"
    id: "Menjelaskan aliran utama teori politik mutakhir"
    hi: "हाल के राजनीतिक सिद्धांत के मुख्य स्कूल समझाना"
  - en: "Debate ideas of power, ideology and sovereignty"
    zh: "讨论权力、意识形态和主权等概念"
    zh-TW: "討論權力、意識形態和主權等概念"
    ja: "権力、イデオロギー、主権の考え方を議論する"
    ko: "권력, 이데올로기, 주권 개념 토론하기"
    vi: "Tranh luận về quyền lực, hệ tư tưởng và chủ quyền"
    ms: "Bahaskan idea kuasa, ideologi dan kedaulatan"
    id: "Memperdebatkan gagasan kuasa, ideologi, dan kedaulatan"
    hi: "सत्ता, विचारधारा और संप्रभुता के विचारों पर बहस करना"
  - en: "Use theory to make sense of current politics"
    zh: "用理论理解当下的政治事件"
    zh-TW: "用理論理解當下的政治事件"
    ja: "理論を使って今の政治を読み解く"
    ko: "이론으로 현재 정치 이해하기"
    vi: "Dùng lý thuyết để hiểu chính trị hiện nay"
    ms: "Guna teori untuk memahami politik semasa"
    id: "Memakai teori untuk memahami politik terkini"
    hi: "मौजूदा राजनीति को समझने के लिए सिद्धांत का इस्तेमाल करना"
