code: MIIM30016
year: 2026
learn:
  en: "Lab-based capstone: methods for identifying microbes and a research project you present."
  zh: "实验型毕业课：学鉴定微生物的方法，做研究项目并汇报。"
  zh-TW: "實驗型總結課：學鑑定微生物的方法，做研究專題並報告。"
  ja: "実験中心の総まとめ科目：微生物の同定法と、発表する研究課題。"
  ko: "실험 중심 캡스톤: 미생물 동정 방법과 발표하는 연구 프로젝트."
  vi: "Môn capstone thực hành: phương pháp định danh vi sinh vật và dự án nghiên cứu để trình bày."
  ms: "Capstone berasaskan makmal: kaedah mengenal pasti mikrob dan projek penyelidikan yang dibentang."
  id: "Capstone berbasis lab: metode identifikasi mikroba dan proyek riset yang dipresentasikan."
  hi: "लैब-आधारित कैपस्टोन: सूक्ष्मजीव पहचानने के तरीके और एक रिसर्च प्रोजेक्ट जिसे आप पेश करते हैं।"
outcomes:
  - en: "Identify microbes with molecular lab methods"
    zh: "用分子实验方法鉴定微生物"
    zh-TW: "用分子實驗方法鑑定微生物"
    ja: "分子生物学的手法で微生物を同定する"
    ko: "분자 실험 방법으로 미생물 동정하기"
    vi: "Định danh vi sinh vật bằng phương pháp phân tử"
    ms: "Mengenal pasti mikrob dengan kaedah makmal molekul"
    id: "Mengidentifikasi mikroba dengan metode lab molekuler"
    hi: "मॉलिक्यूलर लैब तरीकों से सूक्ष्मजीव पहचानना"
  - en: "Design an experiment with proper controls"
    zh: "设计带对照组的实验"
    zh-TW: "設計有對照組的實驗"
    ja: "適切な対照を置いた実験を設計する"
    ko: "적절한 대조군을 둔 실험 설계하기"
    vi: "Thiết kế thí nghiệm có đối chứng phù hợp"
    ms: "Mereka bentuk eksperimen dengan kawalan yang betul"
    id: "Merancang eksperimen dengan kontrol yang tepat"
    hi: "सही कंट्रोल के साथ प्रयोग डिज़ाइन करना"
  - en: "Keep lab records and present your findings"
    zh: "做好实验记录并汇报结果"
    zh-TW: "做好實驗記錄並報告結果"
    ja: "実験記録をつけ、結果を発表する"
    ko: "실험 기록을 남기고 결과 발표하기"
    vi: "Ghi chép thí nghiệm và trình bày kết quả"
    ms: "Menyimpan rekod makmal dan membentangkan dapatan"
    id: "Mencatat hasil lab dan mempresentasikan temuan"
    hi: "लैब रिकॉर्ड रखना और नतीजे पेश करना"
