code: PHIL20040
year: 2026
learn:
  en: "Ancient Greek philosophy from the Presocratics to Plato's Republic and Aristotle: justice, democracy, change and what the world is made of."
  zh: "古希腊哲学，从前苏格拉底学派到柏拉图《理想国》和亚里士多德：正义、民主、变化与世界的构成。"
  zh-TW: "古希臘哲學，從前蘇格拉底學派到柏拉圖《理想國》和亞里斯多德：正義、民主、變化與世界的構成。"
  ja: "ソクラテス以前からプラトン『国家』、アリストテレスまでの古代ギリシャ哲学。正義、民主政、変化、世界の成り立ち。"
  ko: "소크라테스 이전 철학부터 플라톤 『국가』, 아리스토텔레스까지 고대 그리스 철학. 정의, 민주정, 변화, 세계의 구성."
  vi: "Triết học Hy Lạp cổ từ tiền Socrates đến Cộng hòa của Plato và Aristotle: công lý, dân chủ, biến đổi và cấu tạo thế giới."
  ms: "Falsafah Yunani kuno dari Prasokratik hingga Republic Plato dan Aristotle: keadilan, demokrasi, perubahan dan asas dunia."
  id: "Filsafat Yunani kuno dari pra-Sokratik hingga Republik Plato dan Aristoteles: keadilan, demokrasi, perubahan dan penyusun dunia."
  hi: "प्री-सॉक्रेटिक से प्लेटो की 'रिपब्लिक' और अरस्तू तक प्राचीन यूनानी दर्शन: न्याय, लोकतंत्र, परिवर्तन और दुनिया किससे बनी है।"
outcomes:
  - en: "Interpret key Greek philosophical texts"
    zh: "解读重要的希腊哲学文本"
    zh-TW: "解讀重要的希臘哲學文本"
    ja: "主要なギリシャ哲学のテクストを解釈する"
    ko: "주요 그리스 철학 텍스트 해석하기"
    vi: "Diễn giải các văn bản triết học Hy Lạp chính"
    ms: "Tafsir teks falsafah Yunani utama"
    id: "Menafsirkan teks filsafat Yunani utama"
    hi: "मुख्य यूनानी दार्शनिक पाठों की व्याख्या करना"
  - en: "Explain Plato's and Aristotle's main ideas"
    zh: "解释柏拉图和亚里士多德的主要思想"
    zh-TW: "解釋柏拉圖和亞里斯多德的主要思想"
    ja: "プラトンとアリストテレスの主な考えを説明する"
    ko: "플라톤과 아리스토텔레스의 핵심 사상 설명하기"
    vi: "Giải thích tư tưởng chính của Plato và Aristotle"
    ms: "Terangkan idea utama Plato dan Aristotle"
    id: "Menjelaskan gagasan utama Plato dan Aristoteles"
    hi: "प्लेटो और अरस्तू के मुख्य विचार समझाना"
  - en: "Place ideas in their historical setting"
    zh: "把思想放回其历史背景中"
    zh-TW: "把思想放回其歷史背景中"
    ja: "思想を歴史的背景の中に置く"
    ko: "사상을 역사적 배경 속에 놓기"
    vi: "Đặt tư tưởng vào bối cảnh lịch sử"
    ms: "Letakkan idea dalam latar sejarahnya"
    id: "Menempatkan gagasan dalam latar sejarahnya"
    hi: "विचारों को उनके ऐतिहासिक परिवेश में रखना"
