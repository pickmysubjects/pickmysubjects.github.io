code: BIOM30001
year: 2026
learn:
  en: "Big health issues like obesity, stem cells, lung disease and mental health, looked at from molecules up to whole populations."
  zh: "肥胖、干细胞、呼吸系统疾病和心理健康等重大健康问题，从分子一直看到整个人群。"
  zh-TW: "肥胖、幹細胞、呼吸系統疾病和心理健康等重大健康問題，從分子一直看到整個族群。"
  ja: "肥満、幹細胞、呼吸器の病気、メンタルヘルスなどの健康問題を、分子から集団まで見ていく。"
  ko: "비만, 줄기세포, 호흡기 질환, 정신 건강 같은 건강 문제를 분자부터 인구 집단까지 살펴본다."
  vi: "Các vấn đề sức khỏe lớn như béo phì, tế bào gốc, bệnh hô hấp và sức khỏe tâm thần, nhìn từ phân tử đến cả cộng đồng."
  ms: "Isu kesihatan besar seperti obesiti, sel stem, penyakit pernafasan dan kesihatan mental, dari tahap molekul hingga populasi."
  id: "Masalah kesehatan besar seperti obesitas, sel punca, penyakit pernapasan, dan kesehatan mental, dari molekul hingga populasi."
  hi: "मोटापा, स्टेम सेल, फेफड़ों की बीमारी और मानसिक स्वास्थ्य जैसे बड़े मुद्दे, अणु से लेकर पूरी आबादी तक।"
outcomes:
  - en: "Analyse a disease using several fields of medical science"
    zh: "综合多个医学学科来分析一种疾病"
    zh-TW: "綜合多個醫學學科來分析一種疾病"
    ja: "複数の医学分野を使って病気を分析する"
    ko: "여러 의학 분야를 활용해 질병 분석하기"
    vi: "Phân tích một bệnh bằng nhiều lĩnh vực y học"
    ms: "Analisis penyakit menggunakan beberapa bidang sains perubatan"
    id: "Menganalisis penyakit dengan beberapa bidang ilmu kedokteran"
    hi: "कई मेडिकल विषयों की मदद से किसी बीमारी का विश्लेषण करना"
  - en: "Explain how public health and drugs work together against disease"
    zh: "解释公共卫生和药物如何共同应对疾病"
    zh-TW: "解釋公共衛生和藥物如何共同對抗疾病"
    ja: "公衆衛生と薬が協力して病気に対処する仕組みを説明する"
    ko: "공중보건과 약물이 함께 질병에 대응하는 방식 설명하기"
    vi: "Giải thích y tế công cộng và thuốc cùng chống bệnh ra sao"
    ms: "Terangkan bagaimana kesihatan awam dan ubat bersama menangani penyakit"
    id: "Menjelaskan bagaimana kesehatan masyarakat dan obat bersama melawan penyakit"
    hi: "समझाना कि पब्लिक हेल्थ और दवाएँ मिलकर बीमारी से कैसे लड़ती हैं"
  - en: "Talk and write about medical research for different audiences"
    zh: "面向不同听众讲解和书写医学研究"
    zh-TW: "面向不同聽眾講解和撰寫醫學研究"
    ja: "相手に合わせて医学研究について話し、書く"
    ko: "대상에 맞게 의학 연구에 대해 말하고 쓰기"
    vi: "Nói và viết về nghiên cứu y học cho nhiều đối tượng khác nhau"
    ms: "Bercakap dan menulis tentang kajian perubatan untuk pelbagai khalayak"
    id: "Berbicara dan menulis tentang riset medis untuk berbagai audiens"
    hi: "अलग-अलग लोगों के लिए मेडिकल रिसर्च पर बोलना और लिखना"
