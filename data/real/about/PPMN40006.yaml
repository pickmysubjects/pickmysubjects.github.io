code: PPMN40006
year: 2026
learn:
  en: "Begin a supervised 12,000-word thesis on a public policy question, from topic proposal to progress report."
  zh: "在导师指导下开始撰写1.2万字公共政策论文，从选题提案到进度报告。"
  zh-TW: "在導師指導下開始撰寫1.2萬字公共政策論文，從選題提案到進度報告。"
  ja: "指導のもと、公共政策をテーマに1万2千語の論文に着手し、テーマ提案から中間報告まで進める。"
  ko: "지도교수와 함께 공공정책 주제로 1만 2천 단어 논문을 시작해 주제 제안부터 중간 보고까지."
  vi: "Bắt đầu luận văn 12.000 từ có hướng dẫn về một câu hỏi chính sách công, từ đề xuất đến báo cáo tiến độ."
  ms: "Mulakan tesis 12,000 patah perkataan berpenyelia tentang dasar awam, dari cadangan topik hingga laporan kemajuan."
  id: "Memulai tesis 12.000 kata terbimbing tentang kebijakan publik, dari usulan topik hingga laporan kemajuan."
  hi: "पर्यवेक्षक के साथ सार्वजनिक नीति पर 12,000 शब्दों की थीसिस शुरू करना, विषय प्रस्ताव से प्रगति रिपोर्ट तक।"
outcomes:
  - en: "Frame a researchable policy question"
    zh: "提出可研究的政策问题"
    zh-TW: "提出可研究的政策問題"
    ja: "研究可能な政策課題を設定する"
    ko: "연구 가능한 정책 질문 세우기"
    vi: "Đặt câu hỏi chính sách có thể nghiên cứu"
    ms: "Bentuk soalan dasar yang boleh dikaji"
    id: "Merumuskan pertanyaan kebijakan yang bisa diteliti"
    hi: "शोध-योग्य नीति प्रश्न तय करना"
  - en: "Review literature and choose methods"
    zh: "梳理文献并选择研究方法"
    zh-TW: "梳理文獻並選擇研究方法"
    ja: "先行研究を整理し方法を選ぶ"
    ko: "문헌 검토하고 방법 선택하기"
    vi: "Tổng quan tài liệu và chọn phương pháp"
    ms: "Kaji literatur dan pilih kaedah"
    id: "Meninjau literatur dan memilih metode"
    hi: "साहित्य की समीक्षा कर विधि चुनना"
  - en: "Work independently with a supervisor"
    zh: "在导师指导下独立开展研究"
    zh-TW: "在導師指導下獨立開展研究"
    ja: "指導教員と組んで自立して研究する"
    ko: "지도교수와 함께 독립적으로 연구하기"
    vi: "Làm việc độc lập cùng người hướng dẫn"
    ms: "Bekerja secara berdikari dengan penyelia"
    id: "Bekerja mandiri bersama pembimbing"
    hi: "पर्यवेक्षक के साथ स्वतंत्र रूप से काम करना"
