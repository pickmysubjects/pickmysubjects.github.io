code: ACCT20008
year: 2026
learn:
  en: "The judgements accountants make when recording transactions and preparing reports under accounting standards."
  zh: "会计在记账和编财报时要做的判断，以及背后的准则。"
outcomes:
  - en: "Record and report transactions in accounting systems"
    zh: "在会计系统里记账和出报表"
  - en: "Explain how accounting standards link to their framework"
    zh: "解释会计准则和概念框架的关系"
  - en: "Discuss the judgement calls behind financial reports"
    zh: "讨论财报背后的会计判断"
