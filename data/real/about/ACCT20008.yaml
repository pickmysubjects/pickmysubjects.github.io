code: ACCT20008
year: 2026
learn:
  en: "The judgements accountants make when recording transactions and preparing reports under accounting standards."
  zh: "会计在记账和编财报时要做的判断，以及背后的准则。"
  zh-TW: "會計在記帳和編財報時要做的判斷，以及背後的準則。"
  ja: "会計基準のもとで取引を記録し報告書を作る際に会計士が下す判断。"
  ko: "회계 기준에 따라 거래를 기록하고 보고서를 작성할 때 회계사가 내리는 판단."
  vi: "Những phán đoán kế toán viên đưa ra khi ghi sổ và lập báo cáo theo chuẩn mực kế toán."
  ms: "Pertimbangan akauntan semasa merekod urus niaga dan menyediakan laporan ikut piawaian perakaunan."
  id: "Pertimbangan yang dibuat akuntan saat mencatat transaksi dan menyusun laporan sesuai standar akuntansi."
  hi: "अकाउंटिंग स्टैंडर्ड के तहत लेन-देन दर्ज करते और रिपोर्ट बनाते समय अकाउंटेंट के फ़ैसले।"
outcomes:
  - en: "Record and report transactions in accounting systems"
    zh: "在会计系统里记账和出报表"
    zh-TW: "在會計系統裡記帳和出報表"
    ja: "会計システムで取引を記録・報告する"
    ko: "회계 시스템에서 거래를 기록하고 보고하기"
    vi: "Ghi sổ và báo cáo giao dịch trong hệ thống kế toán"
    ms: "Rekod dan lapor urus niaga dalam sistem perakaunan"
    id: "Mencatat dan melaporkan transaksi di sistem akuntansi"
    hi: "अकाउंटिंग सिस्टम में लेन-देन दर्ज करना और रिपोर्ट करना"
  - en: "Explain how accounting standards link to their framework"
    zh: "解释会计准则和概念框架的关系"
    zh-TW: "解釋會計準則和觀念架構的關係"
    ja: "会計基準と概念フレームワークの関係を説明する"
    ko: "회계 기준과 개념 체계의 관계 설명하기"
    vi: "Giải thích chuẩn mực kế toán gắn với khuôn khổ ra sao"
    ms: "Terangkan kaitan piawaian perakaunan dengan rangkanya"
    id: "Menjelaskan kaitan standar akuntansi dengan kerangkanya"
    hi: "समझाना कि अकाउंटिंग स्टैंडर्ड अपने फ़्रेमवर्क से कैसे जुड़े हैं"
  - en: "Discuss the judgement calls behind financial reports"
    zh: "讨论财报背后的会计判断"
    zh-TW: "討論財報背後的會計判斷"
    ja: "財務報告の裏にある判断について議論する"
    ko: "재무 보고서 뒤에 있는 판단 논의하기"
    vi: "Thảo luận các phán đoán đằng sau báo cáo tài chính"
    ms: "Bincang pertimbangan di sebalik laporan kewangan"
    id: "Membahas pertimbangan di balik laporan keuangan"
    hi: "फ़ाइनेंशियल रिपोर्ट के पीछे के फ़ैसलों पर चर्चा"
