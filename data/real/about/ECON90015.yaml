code: ECON90015
year: 2027
learn:
  en: "Basic microeconomics, strategy and macroeconomics applied to business: markets, costs, pricing and policy."
  zh: "把微观经济学、战略和宏观经济学基础用于商业：市场、成本、定价和政策。"
  zh-TW: "把個體經濟學、策略與總體經濟學基礎用於商業：市場、成本、定價與政策。"
  ja: "ミクロ経済学・戦略・マクロ経済学の基礎を経営に応用：市場、コスト、価格設定、政策。"
  ko: "미시경제·전략·거시경제 기초를 경영에 적용: 시장, 비용, 가격결정, 정책."
  vi: "Kinh tế vi mô, chiến lược và kinh tế vĩ mô cơ bản áp dụng vào kinh doanh: thị trường, chi phí, định giá, chính sách."
  ms: "Asas mikroekonomi, strategi dan makroekonomi dalam perniagaan: pasaran, kos, harga dan dasar."
  id: "Dasar mikroekonomi, strategi, dan makroekonomi untuk bisnis: pasar, biaya, penetapan harga, dan kebijakan."
  hi: "व्यवसाय पर लागू बुनियादी सूक्ष्म अर्थशास्त्र, रणनीति और समष्टि अर्थशास्त्र: बाज़ार, लागत, मूल्य निर्धारण, नीति।"
outcomes:
  - en: "Use supply and demand to analyse business strategy"
    zh: "用供求分析商业战略"
    zh-TW: "用供需分析商業策略"
    ja: "需要と供給で経営戦略を分析する"
    ko: "수요·공급으로 경영 전략 분석하기"
    vi: "Dùng cung cầu để phân tích chiến lược kinh doanh"
    ms: "Menggunakan penawaran dan permintaan untuk analisis strategi"
    id: "Memakai penawaran dan permintaan untuk analisis strategi"
    hi: "आपूर्ति-माँग से व्यावसायिक रणनीति का विश्लेषण"
  - en: "Explain how the macroeconomy affects business"
    zh: "解释宏观经济如何影响企业"
    zh-TW: "解釋總體經濟如何影響企業"
    ja: "マクロ経済が企業に与える影響を説明する"
    ko: "거시경제가 기업에 미치는 영향 설명하기"
    vi: "Giải thích kinh tế vĩ mô ảnh hưởng doanh nghiệp ra sao"
    ms: "Menerangkan kesan makroekonomi terhadap perniagaan"
    id: "Menjelaskan pengaruh makroekonomi pada bisnis"
    hi: "समष्टि अर्थव्यवस्था व्यवसाय को कैसे प्रभावित करती है"
