code: ANCW30023
year: 2026
learn:
  en: "Hands-on intro to archaeology methods: surveying, a mock excavation, artefact analysis and recording monuments. No prior study needed."
  zh: "考古方法实操入门：测量、模拟发掘、文物分析和古迹记录，无需考古基础。"
  zh-TW: "考古方法實作入門：測量、模擬發掘、文物分析和古蹟記錄，無需考古基礎。"
  ja: "考古学の方法を実践で学ぶ入門。測量、模擬発掘、遺物分析、遺構の記録。予備知識は不要。"
  ko: "측량, 모의 발굴, 유물 분석, 유적 기록 등 고고학 방법을 실습으로 배우는 입문. 사전 지식 불필요."
  vi: "Nhập môn thực hành phương pháp khảo cổ: đo đạc, khai quật mô phỏng, phân tích hiện vật, ghi chép di tích. Không cần nền tảng."
  ms: "Pengenalan praktikal kaedah arkeologi: ukur, galian simulasi, analisis artifak dan rekod monumen. Tiada asas diperlukan."
  id: "Pengantar praktik metode arkeologi: survei, simulasi ekskavasi, analisis artefak dan pencatatan monumen. Tanpa dasar."
  hi: "पुरातत्व के तरीकों का व्यावहारिक परिचय: सर्वेक्षण, नकली खुदाई, कलाकृति विश्लेषण और स्मारकों का रिकॉर्ड। पहले से पढ़ाई ज़रूरी नहीं।"
outcomes:
  - en: "Use basic survey and excavation techniques"
    zh: "运用基本的测量和发掘技术"
    zh-TW: "運用基本的測量和發掘技術"
    ja: "基本的な測量と発掘の技術を使う"
    ko: "기본 측량·발굴 기법 사용하기"
    vi: "Dùng kỹ thuật đo đạc và khai quật cơ bản"
    ms: "Guna teknik asas ukur dan galian"
    id: "Memakai teknik dasar survei dan ekskavasi"
    hi: "सर्वेक्षण और खुदाई की बुनियादी तकनीकें इस्तेमाल करना"
  - en: "Record and describe artefacts accurately"
    zh: "准确记录和描述文物"
    zh-TW: "準確記錄和描述文物"
    ja: "遺物を正確に記録し記述する"
    ko: "유물을 정확히 기록하고 설명하기"
    vi: "Ghi chép và mô tả hiện vật chính xác"
    ms: "Rekod dan huraikan artifak dengan tepat"
    id: "Mencatat dan mendeskripsikan artefak dengan akurat"
    hi: "कलाकृतियों को सही ढंग से दर्ज और वर्णित करना"
  - en: "Interpret the past from archaeological data"
    zh: "从考古数据解读过去"
    zh-TW: "從考古資料解讀過去"
    ja: "考古データから過去を解釈する"
    ko: "고고학 자료로 과거 해석하기"
    vi: "Diễn giải quá khứ từ dữ liệu khảo cổ"
    ms: "Tafsir masa lalu daripada data arkeologi"
    id: "Menafsirkan masa lalu dari data arkeologi"
    hi: "पुरातात्विक आँकड़ों से अतीत की व्याख्या करना"
