code: ACTL20003
year: 2026
learn:
  en: "Probability tools used in insurance and finance, from key distributions to Brownian motion and stochastic calculus."
  zh: "保险和金融中的概率工具，从常用分布到布朗运动和随机微积分。"
  zh-TW: "保險與金融中的機率工具，從常用分配到布朗運動和隨機微積分。"
  ja: "保険と金融で使う確率の道具：主な分布からブラウン運動、確率解析まで。"
  ko: "보험·금융에서 쓰는 확률 도구: 주요 분포부터 브라운 운동과 확률미적분까지."
  vi: "Công cụ xác suất dùng trong bảo hiểm và tài chính, từ các phân phối chính đến chuyển động Brown và giải tích ngẫu nhiên."
  ms: "Alat kebarangkalian dalam insurans dan kewangan, dari taburan utama hingga gerakan Brown dan kalkulus stokastik."
  id: "Alat probabilitas di asuransi dan keuangan, dari distribusi utama sampai gerak Brown dan kalkulus stokastik."
  hi: "बीमा और फ़ाइनेंस में इस्तेमाल होने वाले प्रायिकता के टूल, मुख्य वितरणों से लेकर ब्राउनियन मोशन और स्टोकेस्टिक कैलकुलस तक।"
outcomes:
  - en: "Use common insurance distributions and expectations"
    zh: "运用保险常用分布和期望"
    zh-TW: "運用保險常用分配與期望值"
    ja: "保険でよく使う分布と期待値を扱う"
    ko: "보험에서 쓰는 분포와 기댓값 활용"
    vi: "Dùng các phân phối và kỳ vọng phổ biến trong bảo hiểm"
    ms: "Guna taburan dan jangkaan lazim dalam insurans"
    id: "Memakai distribusi dan ekspektasi yang umum di asuransi"
    hi: "बीमा के आम वितरण और अपेक्षित मान इस्तेमाल करना"
  - en: "Apply the law of large numbers and the CLT to risk"
    zh: "把大数定律和中心极限定理用于风险"
    zh-TW: "將大數法則和中央極限定理用於風險"
    ja: "大数の法則と中心極限定理をリスクに使う"
    ko: "대수의 법칙과 중심극한정리를 위험에 적용"
    vi: "Áp dụng luật số lớn và định lý giới hạn trung tâm"
    ms: "Guna hukum nombor besar dan teorem had memusat"
    id: "Menerapkan hukum bilangan besar dan teorema limit pusat"
    hi: "बड़ी संख्याओं का नियम और CLT जोखिम पर लागू करना"
  - en: "Solve problems with recursions and differential equations"
    zh: "用递推和微分方程解决问题"
    zh-TW: "用遞迴和微分方程式解題"
    ja: "漸化式や微分方程式で問題を解く"
    ko: "점화식과 미분방정식으로 문제 풀기"
    vi: "Giải bài toán bằng đệ quy và phương trình vi phân"
    ms: "Selesaikan masalah dengan rekursi dan persamaan pembezaan"
    id: "Menyelesaikan soal dengan rekursi dan persamaan diferensial"
    hi: "रिकर्शन और अवकल समीकरणों से सवाल हल करना"
