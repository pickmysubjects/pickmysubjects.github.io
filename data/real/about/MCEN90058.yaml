code: MCEN90058
year: 2027
learn:
  en: "Core ideas of industrial engineering: lean production, facility layout, work measurement and ergonomics."
  zh: "工业工程的核心：精益生产、设施布局、工作测量和人因工程。"
  zh-TW: "工業工程的核心：精實生產、設施佈置、工作衡量與人因工程。"
  ja: "生産工学の基本：リーン生産、設備レイアウト、作業測定、人間工学。"
  ko: "산업공학의 핵심: 린 생산, 설비 배치, 작업 측정, 인간공학."
  vi: "Cốt lõi kỹ thuật công nghiệp: sản xuất tinh gọn, bố trí mặt bằng, đo lường công việc, công thái học."
  ms: "Asas kejuruteraan industri: pengeluaran lean, susun atur kemudahan, pengukuran kerja dan ergonomik."
  id: "Inti teknik industri: produksi lean, tata letak fasilitas, pengukuran kerja, dan ergonomi."
  hi: "औद्योगिक इंजीनियरिंग के मूल: लीन उत्पादन, सुविधा लेआउट, कार्य मापन और एर्गोनॉमिक्स।"
outcomes:
  - en: "Apply lean production techniques"
    zh: "运用精益生产方法"
    zh-TW: "運用精實生產方法"
    ja: "リーン生産の手法を使う"
    ko: "린 생산 기법 적용하기"
    vi: "Áp dụng kỹ thuật sản xuất tinh gọn"
    ms: "Menggunakan teknik pengeluaran lean"
    id: "Menerapkan teknik produksi lean"
    hi: "लीन उत्पादन तकनीकें लागू करना"
  - en: "Plan facility layout and production flow"
    zh: "规划设施布局和生产流程"
    zh-TW: "規劃設施佈置與生產流程"
    ja: "設備レイアウトと生産の流れを計画する"
    ko: "설비 배치와 생산 흐름 계획하기"
    vi: "Lập bố trí mặt bằng và dòng sản xuất"
    ms: "Merancang susun atur kemudahan dan aliran pengeluaran"
    id: "Merencanakan tata letak fasilitas dan alur produksi"
    hi: "सुविधा लेआउट और उत्पादन प्रवाह की योजना"
