code: MUSI30269
year: 2026
learn:
  en: "Music-making in Australia, from classical and pop to folk and Indigenous music, and what it says about identity."
  zh: "澳大利亚的古典、流行、民间和原住民音乐及其身份议题。"
  zh-TW: "澳洲的古典、流行、民間與原住民音樂及其身分議題。"
  ja: "クラシック、ポップ、民謡、先住民音楽まで、オーストラリアの音楽とアイデンティティ。"
  ko: "클래식·대중·민속·원주민 음악까지 호주 음악과 정체성."
  vi: "Âm nhạc ở Úc, từ cổ điển, pop đến dân gian và bản địa, cùng câu chuyện bản sắc."
  ms: "Muzik di Australia, dari klasik, pop, rakyat hingga Orang Asli, dan soal identiti."
  id: "Musik di Australia, dari klasik, pop, rakyat hingga Pribumi, dan soal identitas."
  hi: "ऑस्ट्रेलिया में संगीत, क्लासिकल-पॉप से लोक और आदिवासी संगीत तक, और पहचान का सवाल।"
outcomes:
  - en: "Trace how music in Australia developed"
    zh: "梳理澳大利亚音乐的发展"
    zh-TW: "梳理澳洲音樂的發展"
    ja: "オーストラリア音楽の発展をたどる"
    ko: "호주 음악의 발전 과정 짚기"
    vi: "Lần theo sự phát triển âm nhạc ở Úc"
    ms: "Jejak perkembangan muzik di Australia"
    id: "Menelusuri perkembangan musik Australia"
    hi: "ऑस्ट्रेलिया में संगीत का विकास समझना"
  - en: "Present research to the class"
    zh: "向全班展示研究成果"
    zh-TW: "向全班展示研究成果"
    ja: "研究をクラスで発表する"
    ko: "연구를 수업에서 발표하기"
    vi: "Thuyết trình nghiên cứu trước lớp"
    ms: "Bentang kajian kepada kelas"
    id: "Mempresentasikan riset di kelas"
    hi: "कक्षा में शोध प्रस्तुत करना"
  - en: "Answer a research question with sources"
    zh: "用资料回答研究问题"
    zh-TW: "用資料回答研究問題"
    ja: "資料を使って研究課題に答える"
    ko: "자료로 연구 질문에 답하기"
    vi: "Trả lời câu hỏi nghiên cứu bằng nguồn"
    ms: "Jawab soalan kajian dengan sumber"
    id: "Menjawab pertanyaan riset dengan sumber"
    hi: "स्रोतों से शोध प्रश्न का उत्तर देना"
