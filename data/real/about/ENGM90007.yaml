code: ENGM90007
year: 2027
learn:
  en: "Planning the early stage of construction and complex projects: feasibility, scope, risk and governance."
  zh: "规划建筑项目和复杂项目的前期阶段：可行性、范围、风险和治理。"
  zh-TW: "規劃營建專案與複雜專案的前期階段：可行性、範疇、風險與治理。"
  ja: "建設・複雑なプロジェクトの初期計画：実現可能性・スコープ・リスク・ガバナンス。"
  ko: "건설 및 복잡한 프로젝트의 초기 계획: 타당성, 범위, 위험, 거버넌스."
  vi: "Lập kế hoạch giai đoạn đầu của dự án xây dựng và dự án phức tạp: khả thi, phạm vi, rủi ro, quản trị."
  ms: "Merancang peringkat awal projek pembinaan dan projek kompleks: kebolehlaksanaan, skop, risiko dan tadbir urus."
  id: "Merencanakan tahap awal proyek konstruksi dan proyek kompleks: kelayakan, lingkup, risiko, dan tata kelola."
  hi: "निर्माण और जटिल परियोजनाओं के शुरुआती चरण की योजना: व्यवहार्यता, दायरा, जोखिम और गवर्नेंस।"
outcomes:
  - en: "Build investment logic maps and acquisition strategies"
    zh: "制作投资逻辑图和采购策略"
    zh-TW: "製作投資邏輯圖與採購策略"
    ja: "投資ロジックマップと調達戦略を作る"
    ko: "투자 논리도와 조달 전략 만들기"
    vi: "Lập bản đồ logic đầu tư và chiến lược mua sắm"
    ms: "Membina peta logik pelaburan dan strategi perolehan"
    id: "Menyusun peta logika investasi dan strategi pengadaan"
    hi: "इन्वेस्टमेंट लॉजिक मैप और अधिग्रहण रणनीति बनाना"
  - en: "Analyse project risks, including Monte Carlo methods"
    zh: "分析项目风险，包括蒙特卡洛方法"
    zh-TW: "分析專案風險，包括蒙地卡羅方法"
    ja: "モンテカルロ法などでプロジェクトのリスクを分析する"
    ko: "몬테카를로 방법 등으로 프로젝트 위험 분석하기"
    vi: "Phân tích rủi ro dự án, kể cả phương pháp Monte Carlo"
    ms: "Menganalisis risiko projek, termasuk kaedah Monte Carlo"
    id: "Menganalisis risiko proyek, termasuk metode Monte Carlo"
    hi: "मोंटे कार्लो सहित परियोजना जोखिमों का विश्लेषण"
  - en: "Write a project management plan"
    zh: "编写项目管理计划"
    zh-TW: "撰寫專案管理計畫"
    ja: "プロジェクト管理計画書を作る"
    ko: "프로젝트 관리 계획서 작성하기"
    vi: "Viết kế hoạch quản lý dự án"
    ms: "Menulis pelan pengurusan projek"
    id: "Menyusun rencana manajemen proyek"
    hi: "परियोजना प्रबंधन योजना लिखना"
