code: ABPL90315
year: 2027
learn:
  en: "How citizens and stakeholders take part in planning, and the skills to encourage and manage that participation."
  zh: "公众和利益相关方如何参与规划，以及推动和管理公众参与的技能。"
  zh-TW: "公眾和利害關係人如何參與規劃，以及推動和管理公眾參與的技能。"
  ja: "市民や関係者の計画への参加と、それを促し運営するスキル。"
  ko: "시민과 이해관계자가 계획에 참여하는 방식과 이를 이끌고 관리하는 기술."
  vi: "Cách người dân và các bên liên quan tham gia quy hoạch, và kỹ năng thúc đẩy, quản lý sự tham gia đó."
  ms: "Cara warga dan pihak berkepentingan terlibat dalam perancangan, serta kemahiran menggalak dan mengurusnya."
  id: "Cara warga dan pemangku kepentingan ikut perencanaan, serta keterampilan mendorong dan mengelolanya."
  hi: "नागरिक और हितधारक योजना में कैसे भाग लेते हैं, और उस भागीदारी को बढ़ाने व संभालने का कौशल।"
outcomes:
  - en: "Manage public participation and build consensus"
    zh: "组织公众参与并促成共识"
    zh-TW: "組織公眾參與並促成共識"
    ja: "市民参加を運営し合意を形成する"
    ko: "시민 참여를 운영하고 합의 이끌기"
    vi: "Điều phối sự tham gia và xây dựng đồng thuận"
    ms: "Mengurus penyertaan awam dan membina konsensus"
    id: "Mengelola partisipasi publik dan membangun konsensus"
    hi: "जन-भागीदारी संभालना और सहमति बनाना"
  - en: "Report on a real public consultation"
    zh: "撰写一场真实公众咨询的报告"
    zh-TW: "撰寫一場真實公眾諮詢的報告"
    ja: "実際の住民協議についてレポートする"
    ko: "실제 공청회에 대한 보고서 쓰기"
    vi: "Viết báo cáo về một buổi tham vấn công chúng thật"
    ms: "Melapor tentang perundingan awam sebenar"
    id: "Melaporkan konsultasi publik nyata"
    hi: "असली जन-परामर्श पर रिपोर्ट लिखना"
