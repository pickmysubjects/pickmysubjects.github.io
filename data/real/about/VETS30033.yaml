code: VETS30033
year: 2026
learn:
  en: "What makes wildlife populations healthy or sick, how disease spreads to animals and people, and how to manage it."
  zh: "野生动物种群健康与疾病的成因，疾病如何传给家畜和人，以及如何管理。"
  zh-TW: "野生動物族群健康與疾病的成因，疾病如何傳給家畜與人，以及如何管理。"
  ja: "野生動物集団の健康と病気の要因、家畜や人への感染、その管理。"
  ko: "야생동물 개체군의 건강과 질병 요인, 가축·사람으로의 전파, 관리 방법."
  vi: "Điều gì khiến quần thể hoang dã khỏe hay bệnh, bệnh lây sang vật nuôi và người, và cách quản lý."
  ms: "Punca kesihatan dan penyakit populasi hidupan liar, penularan kepada haiwan dan manusia, dan cara mengurusnya."
  id: "Penyebab sehat dan sakit populasi satwa liar, penularan ke hewan dan manusia, serta pengelolaannya."
  hi: "वन्यजीव आबादी के स्वस्थ या बीमार होने के कारण, रोग का पशुओं व इंसानों तक फैलना, और उसका प्रबंधन।"
outcomes:
  - en: "Measure disease impact on wildlife populations"
    zh: "分析疾病对野生动物种群的影响"
    zh-TW: "分析疾病對野生動物族群的影響"
    ja: "疾病が野生動物集団に与える影響を分析"
    ko: "질병이 야생 개체군에 주는 영향 분석"
    vi: "Phân tích tác động bệnh lên quần thể hoang dã"
    ms: "Analisis kesan penyakit pada hidupan liar"
    id: "Menganalisis dampak penyakit pada satwa liar"
    hi: "वन्यजीव आबादी पर रोग का असर आंकना"
  - en: "Recommend actions for wildlife disease outbreaks"
    zh: "为野生动物疫情提出干预建议"
    zh-TW: "為野生動物疫情提出介入建議"
    ja: "野生動物の疾病発生に対策を提案する"
    ko: "야생동물 질병 발생 시 대응 권고"
    vi: "Đề xuất can thiệp khi dịch bệnh hoang dã"
    ms: "Cadang tindakan bagi wabak hidupan liar"
    id: "Merekomendasikan tindakan saat wabah satwa liar"
    hi: "वन्यजीव रोग प्रकोप के लिए कदम सुझाना"
