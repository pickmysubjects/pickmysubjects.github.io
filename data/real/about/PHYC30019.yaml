code: PHYC30019
year: 2026
learn:
  en: "How stars, black holes, the Milky Way and the universe work, plus current research questions."
  zh: "恒星、黑洞、银河系和宇宙如何运作，以及前沿问题。"
  zh-TW: "恆星、黑洞、銀河系和宇宙如何運作，以及前沿問題。"
  ja: "恒星・ブラックホール・銀河系・宇宙のしくみと最新の研究課題。"
  ko: "별, 블랙홀, 은하수, 우주의 작동 원리와 최신 연구 질문."
  vi: "Sao, hố đen, Ngân Hà và vũ trụ vận hành ra sao, cùng các câu hỏi nghiên cứu mới."
  ms: "Cara bintang, lubang hitam, Bima Sakti dan alam semesta berfungsi, serta soalan kajian semasa."
  id: "Cara kerja bintang, lubang hitam, Bima Sakti, dan alam semesta, plus pertanyaan riset terkini."
  hi: "तारे, ब्लैक होल, आकाशगंगा और ब्रह्मांड कैसे काम करते हैं, और नए रिसर्च सवाल।"
outcomes:
  - en: "Explain how stars form and evolve"
    zh: "解释恒星的结构与演化"
    zh-TW: "解釋恆星的結構與演化"
    ja: "恒星の構造と進化を説明する"
    ko: "별의 구조와 진화 설명하기"
    vi: "Giải thích cấu trúc và tiến hóa của sao"
    ms: "Menerangkan struktur dan evolusi bintang"
    id: "Menjelaskan struktur dan evolusi bintang"
    hi: "तारों की बनावट और विकास समझाना"
  - en: "Solve problems on black holes and cosmology"
    zh: "解决黑洞和宇宙学问题"
    zh-TW: "解決黑洞和宇宙學問題"
    ja: "ブラックホールや宇宙論の問題を解く"
    ko: "블랙홀과 우주론 문제 풀기"
    vi: "Giải bài toán về hố đen và vũ trụ học"
    ms: "Menyelesaikan masalah lubang hitam dan kosmologi"
    id: "Memecahkan soal lubang hitam dan kosmologi"
    hi: "ब्लैक होल और कॉस्मोलॉजी के सवाल हल करना"
