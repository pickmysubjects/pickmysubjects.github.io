code: ISYS90050
year: 2027
learn:
  en: "Running IT projects from plan to delivery: scheduling, critical path, budgets, risk, quality and managing change."
  zh: "从规划到交付管理 IT 项目：排期、关键路径、预算、风险、质量和变革管理。"
  zh-TW: "從規劃到交付管理 IT 專案：排程、要徑、預算、風險、品質與變革管理。"
  ja: "計画から納品までのITプロジェクト運営：スケジュール、クリティカルパス、予算、リスク、品質、変革管理。"
  ko: "계획부터 완료까지 IT 프로젝트 운영: 일정, 주경로, 예산, 위험, 품질, 변화 관리."
  vi: "Điều hành dự án IT từ kế hoạch đến bàn giao: lịch, đường găng, ngân sách, rủi ro, chất lượng, quản lý thay đổi."
  ms: "Menjalankan projek IT dari pelan hingga siap: jadual, laluan kritikal, bajet, risiko, kualiti, pengurusan perubahan."
  id: "Menjalankan proyek TI dari rencana hingga selesai: jadwal, jalur kritis, anggaran, risiko, mutu, manajemen perubahan."
  hi: "योजना से डिलीवरी तक IT प्रोजेक्ट चलाना: शेड्यूल, क्रिटिकल पाथ, बजट, जोखिम, गुणवत्ता और बदलाव प्रबंधन।"
outcomes:
  - en: "Build a project plan, schedule and budget"
    zh: "制定项目计划、排期和预算"
    zh-TW: "擬定專案計畫、排程與預算"
    ja: "プロジェクト計画・日程・予算を作る"
    ko: "프로젝트 계획·일정·예산 세우기"
    vi: "Lập kế hoạch, lịch và ngân sách dự án"
    ms: "Menyediakan pelan, jadual dan bajet projek"
    id: "Menyusun rencana, jadwal, dan anggaran proyek"
    hi: "प्रोजेक्ट योजना, शेड्यूल और बजट बनाना"
  - en: "Handle resistance and politics during change"
    zh: "应对变革中的阻力与人际政治"
    zh-TW: "因應變革中的阻力與組織政治"
    ja: "変革時の抵抗や社内政治に対処する"
    ko: "변화 과정의 저항과 조직 정치 다루기"
    vi: "Xử lý sự phản kháng và chính trị khi thay đổi"
    ms: "Menangani tentangan dan politik semasa perubahan"
    id: "Menangani penolakan dan politik saat perubahan"
    hi: "बदलाव के दौरान विरोध और राजनीति से निपटना"
