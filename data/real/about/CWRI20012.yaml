code: CWRI20012
year: 2026
learn:
  en: "Creative writing about identity and difference: who gets to speak for whom, and how to write about others ethically."
  zh: "关于身份与差异的创意写作：谁有资格替谁发声，以及如何有伦理地书写他人。"
  zh-TW: "關於身分與差異的創意寫作：誰有資格替誰發聲，以及如何有倫理地書寫他人。"
  ja: "アイデンティティと差異をめぐる創作。誰が誰の代わりに語れるのか、他者を倫理的に書くには。"
  ko: "정체성과 차이에 관한 창작. 누가 누구를 대신해 말할 수 있는가, 타인을 윤리적으로 쓰는 법."
  vi: "Viết sáng tạo về bản sắc và khác biệt: ai được nói thay ai, và viết về người khác sao cho có đạo đức."
  ms: "Penulisan kreatif tentang identiti dan perbezaan: siapa boleh bersuara untuk siapa, dan cara menulis tentang orang lain secara beretika."
  id: "Penulisan kreatif tentang identitas dan perbedaan: siapa boleh bicara untuk siapa, dan cara menulis tentang orang lain secara etis."
  hi: "पहचान और भिन्नता पर रचनात्मक लेखन: कौन किसकी ओर से बोले, और दूसरों के बारे में नैतिक ढंग से कैसे लिखें।"
outcomes:
  - en: "Critique how texts represent self and other"
    zh: "批评文本如何呈现自我与他者"
    zh-TW: "批評文本如何呈現自我與他者"
    ja: "テクストが自己と他者をどう表すか批評する"
    ko: "텍스트가 자기와 타자를 재현하는 방식 비평하기"
    vi: "Phê bình cách văn bản thể hiện cái tôi và người khác"
    ms: "Kritik cara teks menggambarkan diri dan orang lain"
    id: "Mengkritik cara teks menampilkan diri dan liyan"
    hi: "पाठ में 'स्व' और 'अन्य' के चित्रण की आलोचना करना"
  - en: "Think through the ethics of representation"
    zh: "思考再现的伦理问题"
    zh-TW: "思考再現的倫理問題"
    ja: "表象の倫理を考える"
    ko: "재현의 윤리 고민하기"
    vi: "Suy nghĩ về đạo đức của sự thể hiện"
    ms: "Fikirkan etika representasi"
    id: "Memikirkan etika representasi"
    hi: "प्रतिनिधित्व की नैतिकता पर सोचना"
  - en: "Write your own creative pieces with care"
    zh: "用心创作自己的作品"
    zh-TW: "用心創作自己的作品"
    ja: "配慮をもって自分の作品を書く"
    ko: "신중하게 자신의 창작물 쓰기"
    vi: "Viết tác phẩm sáng tạo của riêng bạn một cách cẩn trọng"
    ms: "Tulis karya kreatif sendiri dengan teliti"
    id: "Menulis karya kreatif sendiri dengan cermat"
    hi: "सावधानी से अपनी रचनाएँ लिखना"
