code: AGRI30040
year: 2026
learn:
  en: "How farm products are marketed and moved to buyers, and where value is added or lost along the chain."
  zh: "农产品如何营销并送到买家手中，以及价值在链条中哪里增加或流失。"
  zh-TW: "農產品如何行銷並送到買家手中，以及價值在鏈條中哪裡增加或流失。"
  ja: "農産物の販売と流通、そしてチェーンのどこで価値が生まれ失われるか。"
  ko: "농산물의 마케팅·유통과 가치사슬에서 가치가 생기고 사라지는 지점."
  vi: "Nông sản được tiếp thị, phân phối ra sao và giá trị tăng giảm ở đâu."
  ms: "Cara hasil ladang dipasarkan dan di mana nilai bertambah dalam rantaian."
  id: "Cara hasil tani dipasarkan dan di mana nilai bertambah dalam rantai."
  hi: "कृषि उत्पादों की मार्केटिंग और सप्लाई चेन में मूल्य कहाँ बढ़ता या घटता है।"
outcomes:
  - en: "Analyse agricultural markets and prices"
    zh: "分析农产品市场与价格"
    zh-TW: "分析農產品市場與價格"
    ja: "農産物市場と価格を分析する"
    ko: "농산물 시장과 가격 분석하기"
    vi: "Phân tích thị trường và giá nông sản"
    ms: "Analisis pasaran dan harga pertanian"
    id: "Menganalisis pasar dan harga pertanian"
    hi: "कृषि बाज़ार और क़ीमतों का विश्लेषण"
  - en: "Map a value chain from farm to consumer"
    zh: "梳理从农场到消费者的价值链"
    zh-TW: "梳理從農場到消費者的價值鏈"
    ja: "農場から消費者までのバリューチェーンを描く"
    ko: "농장에서 소비자까지 가치사슬 그리기"
    vi: "Vẽ chuỗi giá trị từ trại đến người tiêu dùng"
    ms: "Petakan rantaian nilai ladang ke pengguna"
    id: "Memetakan rantai nilai dari lahan ke konsumen"
    hi: "खेत से उपभोक्ता तक मूल्य शृंखला बनाना"
  - en: "Suggest marketing strategies for a product"
    zh: "为产品提出营销策略"
    zh-TW: "為產品提出行銷策略"
    ja: "製品の販売戦略を提案する"
    ko: "제품 마케팅 전략 제안하기"
    vi: "Đề xuất chiến lược tiếp thị sản phẩm"
    ms: "Cadang strategi pemasaran produk"
    id: "Mengusulkan strategi pemasaran produk"
    hi: "उत्पाद के लिए मार्केटिंग रणनीति सुझाना"
