code: ANTH20013
year: 2026
learn:
  en: "An anthropology of state surveillance: how diplomats, soldiers and spies work, and how watching citizens has changed over time."
  zh: "国家监控的人类学：外交官、士兵和间谍如何工作，监视公民的方式如何变化。"
  zh-TW: "國家監控的人類學：外交官、士兵和間諜如何工作，監視公民的方式如何變化。"
  ja: "国家による監視の人類学。外交官・兵士・スパイの仕事と、市民監視の移り変わりを学ぶ。"
  ko: "국가 감시의 인류학: 외교관, 군인, 스파이의 일과 시민 감시 방식의 변화를 배운다."
  vi: "Nhân học về giám sát của nhà nước: nhà ngoại giao, binh lính, gián điệp làm việc ra sao và việc theo dõi dân thay đổi thế nào."
  ms: "Antropologi pengawasan negara: cara diplomat, askar dan perisik bekerja, dan bagaimana pemantauan rakyat berubah."
  id: "Antropologi pengawasan negara: cara diplomat, tentara, dan mata-mata bekerja, serta perubahan cara mengawasi warga."
  hi: "राज्य निगरानी का मानवशास्त्र: राजनयिक, सैनिक और जासूस कैसे काम करते हैं और नागरिकों की निगरानी कैसे बदली।"
outcomes:
  - en: "Describe old and new methods of state surveillance"
    zh: "描述新旧国家监控手段"
    zh-TW: "描述新舊國家監控手段"
    ja: "国家監視の新旧の手法を説明する"
    ko: "국가 감시의 옛 방식과 새 방식 설명하기"
    vi: "Mô tả các phương thức giám sát cũ và mới của nhà nước"
    ms: "Huraikan kaedah pengawasan negara lama dan baharu"
    id: "Mendeskripsikan metode pengawasan negara lama dan baru"
    hi: "राज्य निगरानी के पुराने और नए तरीकों का वर्णन करना"
  - en: "Analyse the hidden networks behind state power"
    zh: "分析国家权力背后的隐秘网络"
    zh-TW: "分析國家權力背後的隱密網絡"
    ja: "国家権力の裏にある見えない関係網を分析する"
    ko: "국가 권력 뒤의 숨은 연결망 분석하기"
    vi: "Phân tích mạng lưới ngầm đằng sau quyền lực nhà nước"
    ms: "Analisis rangkaian tersembunyi di sebalik kuasa negara"
    id: "Menganalisis jaringan tersembunyi di balik kekuasaan negara"
    hi: "राज्य सत्ता के पीछे छिपे नेटवर्क का विश्लेषण करना"
  - en: "Use ethnography to study secretive institutions"
    zh: "用民族志方法研究隐秘机构"
    zh-TW: "用民族誌方法研究隱密機構"
    ja: "民族誌の方法で秘密の組織を研究する"
    ko: "민족지 방법으로 비밀 기관 연구하기"
    vi: "Dùng dân tộc chí để nghiên cứu các thể chế bí mật"
    ms: "Gunakan etnografi untuk mengkaji institusi rahsia"
    id: "Memakai etnografi untuk meneliti lembaga rahasia"
    hi: "गुप्त संस्थाओं के अध्ययन में एथ्नोग्राफी का उपयोग करना"
