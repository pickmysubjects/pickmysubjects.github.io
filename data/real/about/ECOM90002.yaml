code: ECOM90002
year: 2027
learn:
  en: "Beyond basic regression: causal effects with instrumental variables, panel data and time series, with a data project."
  zh: "进阶回归：工具变量识别因果、面板数据与时间序列，并做数据项目。"
  zh-TW: "進階迴歸：工具變數識別因果、追蹤資料與時間序列，並做資料專題。"
  ja: "回帰の発展：操作変数による因果、パネルデータ、時系列、データプロジェクト。"
  ko: "회귀 심화: 도구변수로 인과 추정, 패널·시계열 자료, 데이터 프로젝트."
  vi: "Hồi quy nâng cao: biến công cụ cho quan hệ nhân quả, dữ liệu bảng, chuỗi thời gian và dự án dữ liệu."
  ms: "Regresi lanjutan: pemboleh ubah instrumen untuk kesan sebab, data panel, siri masa dan projek data."
  id: "Regresi lanjutan: variabel instrumen untuk efek kausal, data panel, deret waktu, dan proyek data."
  hi: "उन्नत रिग्रेशन: इंस्ट्रुमेंटल वेरिएबल से कारण-प्रभाव, पैनल व टाइम सीरीज़ डेटा, और डेटा प्रोजेक्ट।"
outcomes:
  - en: "Estimate causal effects with instrumental variables"
    zh: "用工具变量估计因果效应"
    zh-TW: "用工具變數估計因果效應"
    ja: "操作変数で因果効果を推定する"
    ko: "도구변수로 인과효과 추정하기"
    vi: "Ước lượng tác động nhân quả bằng biến công cụ"
    ms: "Menganggar kesan sebab dengan pemboleh ubah instrumen"
    id: "Mengestimasi efek kausal dengan variabel instrumen"
    hi: "इंस्ट्रुमेंटल वेरिएबल से कारण-प्रभाव का अनुमान"
  - en: "Model panel and time series data"
    zh: "为面板和时间序列数据建模"
    zh-TW: "為追蹤與時間序列資料建模"
    ja: "パネル・時系列データをモデル化する"
    ko: "패널·시계열 자료 모형화하기"
    vi: "Mô hình hóa dữ liệu bảng và chuỗi thời gian"
    ms: "Memodelkan data panel dan siri masa"
