code: COMP30020
year: 2026
learn:
  en: "Functional and logic programming: recursion, strong types, higher-order functions, laziness, monads, backtracking."
  zh: "函数式与逻辑编程：递归、强类型、高阶函数、惰性求值、单子、回溯。"
  zh-TW: "函數式與邏輯程式設計：遞迴、強型別、高階函數、惰性求值、單子、回溯。"
  ja: "関数型・論理型プログラミング：再帰、強い型、高階関数、遅延評価、モナド、バックトラック。"
  ko: "함수형·논리형 프로그래밍: 재귀, 강타입, 고차 함수, 지연 평가, 모나드, 백트래킹."
  vi: "Lập trình hàm và logic: đệ quy, kiểu mạnh, hàm bậc cao, đánh giá lười, monad, quay lui."
  ms: "Pengaturcaraan fungsian dan logik: rekursi, jenis kuat, fungsi tertib tinggi, penilaian malas, monad, jejak balik."
  id: "Pemrograman fungsional dan logika: rekursi, tipe kuat, fungsi orde tinggi, lazy evaluation, monad, backtracking."
  hi: "फ़ंक्शनल और लॉजिक प्रोग्रामिंग: रिकर्शन, स्ट्रॉन्ग टाइप्स, हायर-ऑर्डर फ़ंक्शन, लेज़ी इवैल्यूएशन, मोनाड, बैकट्रैकिंग।"
outcomes:
  - en: "Write medium-size programs in a declarative language"
    zh: "用声明式语言写中等规模程序"
    zh-TW: "用宣告式語言寫中型程式"
    ja: "宣言型言語で中規模プログラムを書く"
    ko: "선언형 언어로 중간 규모 프로그램 작성"
    vi: "Viết chương trình cỡ vừa bằng ngôn ngữ khai báo"
    ms: "Tulis program sederhana dalam bahasa deklaratif"
    id: "Menulis program menengah dengan bahasa deklaratif"
    hi: "डिक्लेरेटिव भाषा में मध्यम आकार के प्रोग्राम लिखना"
  - en: "Combine languages across parts of one project"
    zh: "在一个项目中混用多种语言"
    zh-TW: "在一個專案中混用多種語言"
    ja: "1つのプロジェクトで複数言語を組み合わせる"
    ko: "한 프로젝트에서 여러 언어 조합"
    vi: "Kết hợp nhiều ngôn ngữ trong một dự án"
    ms: "Gabung beberapa bahasa dalam satu projek"
    id: "Menggabungkan beberapa bahasa dalam satu proyek"
    hi: "एक प्रोजेक्ट में कई भाषाएं जोड़ना"
