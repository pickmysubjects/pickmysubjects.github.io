code: ABPL20042
year: 2026
learn:
  en: "How houses and low-rise flats are built: footings, frames, walls and roofs, materials and structural choices."
  zh: "住宅与低层公寓如何建造：基础、框架、墙体与屋顶，以及材料与结构选择。"
  zh-TW: "住宅與低層公寓如何建造：基礎、框架、牆體與屋頂，以及材料與結構選擇。"
  ja: "住宅と低層集合住宅の建て方：基礎、骨組み、壁、屋根、材料と構造の選択。"
  ko: "주택과 저층 공동주택의 시공: 기초, 골조, 벽, 지붕, 재료와 구조 선택."
  vi: "Cách xây nhà ở và chung cư thấp tầng: móng, khung, tường, mái, vật liệu và lựa chọn kết cấu."
  ms: "Cara rumah dan pangsapuri rendah dibina: asas, kerangka, dinding, bumbung, bahan dan pilihan struktur."
  id: "Cara membangun rumah dan hunian bertingkat rendah: fondasi, rangka, dinding, atap, material, struktur."
  hi: "घर और कम ऊँचाई वाले फ़्लैट कैसे बनते हैं: नींव, फ़्रेम, दीवारें, छत, सामग्री और संरचना।"
outcomes:
  - en: "Describe residential construction methods"
    zh: "描述住宅建造方法"
    zh-TW: "描述住宅營造方法"
    ja: "住宅の施工方法を説明する"
    ko: "주거 시공 방법 설명하기"
    vi: "Mô tả phương pháp xây nhà ở"
    ms: "Huraikan kaedah pembinaan kediaman"
    id: "Menjelaskan metode konstruksi hunian"
    hi: "आवासीय निर्माण के तरीक़े बताना"
  - en: "Select suitable materials and structures"
    zh: "选择合适的材料与结构"
    zh-TW: "選擇合適的材料與結構"
    ja: "適した材料と構造を選ぶ"
    ko: "적합한 재료와 구조 선택하기"
    vi: "Chọn vật liệu và kết cấu phù hợp"
    ms: "Pilih bahan dan struktur yang sesuai"
    id: "Memilih material dan struktur yang cocok"
    hi: "उपयुक्त सामग्री और संरचना चुनना"
  - en: "Read and report on a building site"
    zh: "观察工地并撰写报告"
    zh-TW: "觀察工地並撰寫報告"
    ja: "建設現場を観察して報告する"
    ko: "건설 현장 관찰·보고하기"
    vi: "Quan sát và báo cáo về công trường"
    ms: "Tinjau dan lapor tentang tapak bina"
    id: "Mengamati dan melaporkan lokasi proyek"
    hi: "निर्माण स्थल देखकर रिपोर्ट बनाना"
