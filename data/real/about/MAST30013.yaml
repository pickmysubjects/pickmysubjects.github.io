code: MAST30013
year: 2026
learn:
  en: "Methods for solving nonlinear optimisation problems, with a group project on a real problem."
  zh: "解非线性优化问题的方法，还有一个解决实际问题的小组项目。"
  zh-TW: "解非線性最佳化問題的方法，還有一個解決實際問題的小組專題。"
  ja: "非線形最適化問題の解法。実際の問題に取り組むグループ課題あり。"
  ko: "비선형 최적화 문제 해법. 실제 문제를 다루는 조별 프로젝트 포함."
  vi: "Phương pháp giải bài toán tối ưu phi tuyến, có dự án nhóm về một vấn đề thực tế."
  ms: "Kaedah menyelesaikan masalah pengoptimuman tak linear, dengan projek kumpulan atas masalah sebenar."
  id: "Metode menyelesaikan masalah optimasi nonlinear, dengan proyek kelompok tentang masalah nyata."
  hi: "अरैखिक ऑप्टिमाइज़ेशन समस्याएँ हल करने के तरीके, असली समस्या पर एक ग्रुप प्रोजेक्ट के साथ।"
outcomes:
  - en: "Build models for planning and management problems"
    zh: "为规划和管理问题建模"
    zh-TW: "為規劃和管理問題建立模型"
    ja: "計画・管理の問題をモデル化する"
    ko: "계획 및 관리 문제 모델링하기"
    vi: "Xây dựng mô hình cho bài toán lập kế hoạch và quản lý"
    ms: "Membina model untuk masalah perancangan dan pengurusan"
    id: "Membuat model untuk masalah perencanaan dan manajemen"
    hi: "योजना और प्रबंधन की समस्याओं के मॉडल बनाना"
  - en: "Implement optimisation algorithms in code"
    zh: "编程实现优化算法"
    zh-TW: "寫程式實作最佳化演算法"
    ja: "最適化アルゴリズムをコードで実装する"
    ko: "최적화 알고리즘을 코드로 구현하기"
    vi: "Lập trình các thuật toán tối ưu"
    ms: "Melaksanakan algoritma pengoptimuman dalam kod"
    id: "Mengimplementasikan algoritma optimasi dalam kode"
    hi: "ऑप्टिमाइज़ेशन एल्गोरिद्म को कोड में लिखना"
  - en: "Use software to solve and interpret problems"
    zh: "用软件求解并解读结果"
    zh-TW: "用軟體求解並解讀結果"
    ja: "ソフトウェアで問題を解き結果を解釈する"
    ko: "소프트웨어로 문제를 풀고 해석하기"
    vi: "Dùng phần mềm để giải và diễn giải bài toán"
    ms: "Menggunakan perisian untuk menyelesai dan mentafsir masalah"
    id: "Memakai software untuk menyelesaikan dan menafsirkan masalah"
    hi: "सॉफ्टवेयर से समस्याएँ हल करना और समझाना"
