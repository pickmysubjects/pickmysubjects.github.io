code: MUST30017
year: 2026
learn:
  en: "Final audition, voice, dance and repertoire training to meet professional music theatre standards."
  zh: "最后的试镜、语音、舞蹈与曲目训练，达到职业音乐剧标准。"
  zh-TW: "最後的試鏡、語音、舞蹈與曲目訓練，達到職業音樂劇標準。"
  ja: "プロの水準に向けた最後のオーディション・発声・ダンス・レパートリー訓練。"
  ko: "전문 뮤지컬 기준에 맞춘 마지막 오디션·발성·춤·레퍼토리 훈련."
  vi: "Luyện thử vai, giọng, múa và tiết mục lần cuối theo chuẩn nhạc kịch chuyên nghiệp."
  ms: "Latihan akhir uji bakat, suara, tarian dan repertoir ke tahap profesional."
  id: "Latihan akhir audisi, vokal, tari dan repertoar sesuai standar profesional."
  hi: "पेशेवर मानकों के लिए अंतिम ऑडिशन, आवाज़, नृत्य और रेपर्टरी प्रशिक्षण।"
outcomes:
  - en: "Present audition material with confidence"
    zh: "自信地呈现试镜材料"
    zh-TW: "自信地呈現試鏡材料"
    ja: "オーディション曲を自信を持って披露する"
    ko: "오디션 자료 자신 있게 선보이기"
    vi: "Trình bày bài thử vai tự tin"
    ms: "Persembah bahan uji bakat dengan yakin"
    id: "Membawakan materi audisi dengan percaya diri"
    hi: "ऑडिशन सामग्री आत्मविश्वास से प्रस्तुत करना"
  - en: "Perform dance audition choreography"
    zh: "表演舞蹈试镜编舞"
    zh-TW: "表演舞蹈試鏡編舞"
    ja: "ダンスオーディションの振付を踊る"
    ko: "댄스 오디션 안무 공연하기"
    vi: "Trình diễn vũ đạo thử vai"
    ms: "Persembah koreografi uji bakat tarian"
    id: "Membawakan koreografi audisi tari"
    hi: "डांस ऑडिशन कोरियोग्राफ़ी प्रस्तुत करना"
  - en: "Complete a repertoire folio"
    zh: "完成曲目作品集"
    zh-TW: "完成曲目作品集"
    ja: "レパートリー集を完成させる"
    ko: "레퍼토리 폴리오 완성하기"
    vi: "Hoàn thiện hồ sơ tiết mục"
    ms: "Siapkan folio repertoir"
    id: "Menyelesaikan portofolio repertoar"
    hi: "रेपर्टरी फ़ोलियो पूरा करना"
