code: ECON20005
year: 2026
learn:
  en: "An intro to game theory and information economics: strategy, uncertainty, signalling, collusion and competition."
  zh: "博弈论与信息经济学入门：策略、不确定性、信号、合谋与竞争。"
  zh-TW: "賽局理論與資訊經濟學入門：策略、不確定性、信號、勾結與競爭。"
  ja: "ゲーム理論と情報の経済学入門：戦略、不確実性、シグナリング、談合、競争。"
  ko: "게임이론과 정보경제학 입문: 전략, 불확실성, 신호, 담합, 경쟁."
  vi: "Nhập môn lý thuyết trò chơi và kinh tế thông tin: chiến lược, bất định, phát tín hiệu, cấu kết và cạnh tranh."
  ms: "Pengenalan teori permainan dan ekonomi maklumat: strategi, ketidakpastian, isyarat, pakatan dan persaingan."
  id: "Pengantar teori permainan dan ekonomi informasi: strategi, ketidakpastian, sinyal, kolusi, dan persaingan."
  hi: "गेम थ्योरी और सूचना अर्थशास्त्र का परिचय: रणनीति, अनिश्चितता, सिग्नलिंग, मिलीभगत और प्रतिस्पर्धा।"
outcomes:
  - en: "Use game theory to reason about real strategic situations"
    zh: "用博弈论分析真实的策略情境"
    zh-TW: "用賽局理論分析真實的策略情境"
    ja: "ゲーム理論で現実の戦略的状況を考える"
    ko: "게임이론으로 실제 전략 상황 분석"
    vi: "Dùng lý thuyết trò chơi cho tình huống chiến lược thật"
    ms: "Guna teori permainan untuk situasi strategik sebenar"
    id: "Memakai teori permainan untuk situasi strategis nyata"
    hi: "असली रणनीतिक हालात को गेम थ्योरी से समझना"
  - en: "See how contracts deal with hidden information"
    zh: "理解合同如何应对信息不对称"
    zh-TW: "理解契約如何因應資訊不對稱"
    ja: "契約が情報の非対称性にどう対処するか知る"
    ko: "계약이 정보 비대칭을 다루는 방식 이해"
    vi: "Hiểu hợp đồng xử lý thông tin bất cân xứng ra sao"
    ms: "Fahami cara kontrak menangani maklumat tersembunyi"
    id: "Memahami cara kontrak mengatasi informasi asimetris"
    hi: "छिपी जानकारी की समस्या से अनुबंध कैसे निपटते हैं, समझना"
  - en: "Understand imperfect competition and antitrust policy"
    zh: "理解不完全竞争和反垄断政策"
    zh-TW: "理解不完全競爭和反壟斷政策"
    ja: "不完全競争と独占禁止政策を理解する"
    ko: "불완전경쟁과 독점규제 정책 이해"
    vi: "Hiểu cạnh tranh không hoàn hảo và chính sách chống độc quyền"
    ms: "Fahami persaingan tidak sempurna dan dasar antitrust"
    id: "Memahami persaingan tidak sempurna dan kebijakan antimonopoli"
    hi: "अपूर्ण प्रतिस्पर्धा और एंटीट्रस्ट नीति समझना"
