code: FNCE90011
year: 2027
learn:
  en: "Forwards, futures and options: pricing with cost-of-carry and Black-Scholes, arbitrage, hedging and risk management."
  zh: "远期、期货和期权：持有成本模型和Black-Scholes定价、套利、对冲与风险管理。"
  zh-TW: "遠期、期貨與選擇權：持有成本模型與Black-Scholes定價、套利、避險與風險管理。"
  ja: "先渡・先物・オプション：キャリーコストとブラック・ショールズによる価格付け、裁定、ヘッジ、リスク管理。"
  ko: "선도·선물·옵션: 보유비용 모형과 블랙-숄즈 가격결정, 차익거래, 헤지, 위험관리."
  vi: "Hợp đồng kỳ hạn, tương lai, quyền chọn: định giá theo chi phí lưu giữ và Black-Scholes, kinh doanh chênh lệch, phòng ngừa rủi ro."
  ms: "Hadapan, niaga hadapan dan opsyen: penentuan harga kos bawaan dan Black-Scholes, arbitraj, lindung nilai dan risiko."
  id: "Forward, futures, dan opsi: penentuan harga cost-of-carry dan Black-Scholes, arbitrase, lindung nilai, manajemen risiko."
  hi: "फ़ॉरवर्ड, फ़्यूचर्स और ऑप्शन: कॉस्ट-ऑफ़-कैरी व ब्लैक-शोल्स से मूल्य निर्धारण, आर्बिट्राज, हेजिंग और जोखिम प्रबंधन।"
