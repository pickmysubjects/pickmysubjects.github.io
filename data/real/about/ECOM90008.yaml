code: ECOM90008
year: 2027
learn:
  en: "Models for survey data: discrete choice, censored, duration, count and panel data, plus a research project."
  zh: "调查数据模型：离散选择、截尾、生存时间、计数和面板数据，另有研究项目。"
  zh-TW: "調查資料模型：離散選擇、設限、存活時間、計數與追蹤資料，另有研究專題。"
  ja: "調査データのモデル：離散選択、打ち切り、期間、カウント、パネル。研究プロジェクトあり。"
  ko: "설문 자료 모형: 이산선택, 절단, 생존, 계수, 패널 자료와 연구 프로젝트."
  vi: "Mô hình cho dữ liệu khảo sát: lựa chọn rời rạc, kiểm duyệt, thời gian, đếm và dữ liệu bảng, kèm dự án."
  ms: "Model data tinjauan: pilihan diskret, tertapis, tempoh, kiraan dan panel, serta projek penyelidikan."
  id: "Model data survei: pilihan diskret, tersensor, durasi, cacah, dan panel, plus proyek riset."
  hi: "सर्वे डेटा के मॉडल: डिस्क्रीट चॉइस, सेंसर्ड, अवधि, गिनती और पैनल डेटा, साथ में रिसर्च प्रोजेक्ट।"
outcomes:
  - en: "Pick the right model for survey data"
    zh: "为调查数据选对模型"
    zh-TW: "為調查資料選對模型"
    ja: "調査データに合うモデルを選ぶ"
    ko: "설문 자료에 맞는 모형 고르기"
    vi: "Chọn mô hình phù hợp cho dữ liệu khảo sát"
    ms: "Memilih model sesuai untuk data tinjauan"
    id: "Memilih model yang tepat untuk data survei"
    hi: "सर्वे डेटा के लिए सही मॉडल चुनना"
  - en: "Check how robust results on real data are"
    zh: "检验真实数据结果的稳健性"
    zh-TW: "檢驗真實資料結果的穩健性"
    ja: "実データの結果の頑健性を確かめる"
    ko: "실제 데이터 결과의 강건성 점검하기"
    vi: "Đánh giá độ vững của kết quả trên dữ liệu thật"
    ms: "Menilai keteguhan keputusan pada data sebenar"
    id: "Menilai ketangguhan hasil pada data nyata"
    hi: "असली डेटा पर नतीजों की मज़बूती जाँचना"
