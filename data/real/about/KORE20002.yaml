    ja: "1945年以降の朝鮮半島の歴史をまとめる"
    ko: "1945년 이후 한반도 역사 정리하기"
    vi: "Tóm tắt lịch sử bán đảo Triều Tiên từ 1945"
    ms: "Ringkaskan sejarah Korea sejak 1945"
    id: "Merangkum sejarah Korea sejak 1945"
    hi: "1945 से कोरिया के इतिहास की रूपरेखा देना"
