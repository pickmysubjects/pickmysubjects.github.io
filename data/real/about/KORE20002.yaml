code: KORE20002
year: 2026
learn:
  en: "An introduction to Korea since 1945, both South and North: history, politics, security, economy and culture up to K-pop."
  zh: "1945年以来南北韩概论：历史、政治、安全、经济和文化，一直讲到K-pop。"
  zh-TW: "1945年以來南北韓概論：歷史、政治、安全、經濟和文化，一直講到K-pop。"
  ja: "1945年以降の韓国と北朝鮮の入門。歴史・政治・安全保障・経済・文化からK-POPまで学ぶ。"
  ko: "1945년 이후 남북한 입문: 역사, 정치, 안보, 경제, 문화부터 K팝까지 배운다."
  vi: "Nhập môn Hàn Quốc và Triều Tiên từ 1945: lịch sử, chính trị, an ninh, kinh tế và văn hóa đến K-pop."
  ms: "Pengenalan Korea sejak 1945, Selatan dan Utara: sejarah, politik, keselamatan, ekonomi dan budaya hingga K-pop."
  id: "Pengantar Korea sejak 1945, Selatan dan Utara: sejarah, politik, keamanan, ekonomi, dan budaya hingga K-pop."
  hi: "1945 से दक्षिण और उत्तर कोरिया का परिचय: इतिहास, राजनीति, सुरक्षा, अर्थव्यवस्था और संस्कृति, K-pop तक।"
outcomes:
