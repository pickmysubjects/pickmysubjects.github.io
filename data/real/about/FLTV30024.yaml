code: FLTV30024
year: 2026
learn:
  en: "Capstone: direct and finish a short animation to broadcast standard, handling budgets, marketing and distribution too."
  zh: "毕业项目：导演并完成一部达到播出标准的动画短片，同时负责预算、营销与发行。"
  zh-TW: "畢業專題：導演並完成一部達到播出標準的動畫短片，同時負責預算、行銷與發行。"
  ja: "総仕上げ：放送水準の短編アニメを監督・完成させ、予算・宣伝・配給も担う。"
  ko: "캡스톤: 방송 수준의 단편 애니를 연출·완성하고 예산, 마케팅, 배급도 맡는다."
  vi: "Đồ án cuối: đạo diễn và hoàn thành phim hoạt hình ngắn chuẩn phát sóng, kèm ngân sách, tiếp thị, phát hành."
  ms: "Projek akhir: arah dan siapkan animasi pendek bertaraf siaran, termasuk bajet, pemasaran dan edaran."
  id: "Proyek akhir: menyutradarai animasi pendek standar siaran, termasuk anggaran, pemasaran dan distribusi."
  hi: "कैपस्टोन: प्रसारण स्तर की छोटी एनिमेशन निर्देशित व पूरी करना, बजट, मार्केटिंग और वितरण सहित।"
outcomes:
  - en: "Manage a full animation production"
    zh: "管理完整的动画制作"
    zh-TW: "管理完整的動畫製作"
    ja: "アニメ制作全体を管理する"
    ko: "애니메이션 제작 전체 관리하기"
    vi: "Quản lý toàn bộ sản xuất hoạt hình"
    ms: "Urus produksi animasi sepenuhnya"
    id: "Mengelola produksi animasi penuh"
    hi: "पूरे एनिमेशन प्रोडक्शन का प्रबंधन"
  - en: "Deliver a short film to broadcast standard"
    zh: "交付达到播出标准的短片"
    zh-TW: "交付達到播出標準的短片"
    ja: "放送水準の短編を納品する"
    ko: "방송 수준의 단편 납품하기"
    vi: "Hoàn thiện phim ngắn đạt chuẩn phát sóng"
    ms: "Hasilkan filem pendek bertaraf siaran"
    id: "Menghasilkan film pendek standar siaran"
    hi: "प्रसारण स्तर की शॉर्ट फ़िल्म देना"
  - en: "Plan marketing and festival distribution"
    zh: "规划营销与影展发行"
    zh-TW: "規劃行銷與影展發行"
    ja: "宣伝と映画祭への配給を計画する"
    ko: "마케팅과 영화제 배급 계획하기"
    vi: "Lên kế hoạch tiếp thị và phát hành ở liên hoan"
    ms: "Rancang pemasaran dan edaran festival"
    id: "Merencanakan pemasaran dan distribusi festival"
    hi: "मार्केटिंग और फ़ेस्टिवल वितरण की योजना"
