code: PHIL30054
year: 2026
learn:
  en: "Linking metaphysics and ethics through social ontology: objects, causation and identity, and what they mean for moral responsibility."
  zh: "以社会本体论连接形而上学与伦理学：物体、因果与同一性，及其对道德责任的意义。"
  zh-TW: "以社會本體論連接形上學與倫理學：物體、因果與同一性，及其對道德責任的意義。"
  ja: "社会存在論を橋に形而上学と倫理学をつなぐ。対象、因果、同一性が道徳的責任に何を意味するか。"
  ko: "사회 존재론으로 형이상학과 윤리학을 잇는다. 대상, 인과, 동일성이 도덕적 책임에 갖는 의미."
  vi: "Nối siêu hình học và đạo đức học qua bản thể luận xã hội: sự vật, nhân quả, đồng nhất và ý nghĩa với trách nhiệm đạo đức."
  ms: "Menghubungkan metafizik dan etika melalui ontologi sosial: objek, sebab-akibat dan identiti, serta maknanya bagi tanggungjawab moral."
  id: "Menghubungkan metafisika dan etika lewat ontologi sosial: objek, kausalitas dan identitas, serta artinya bagi tanggung jawab moral."
  hi: "सामाजिक सत्तामीमांसा से तत्वमीमांसा और नैतिकता को जोड़ना: वस्तुएँ, कार्य-कारण और पहचान, और नैतिक ज़िम्मेदारी के लिए उनका अर्थ।"
outcomes:
  - en: "Explain core ideas in metaphysics"
    zh: "解释形而上学的核心概念"
    zh-TW: "解釋形上學的核心概念"
    ja: "形而上学の中心的な考えを説明する"
    ko: "형이상학의 핵심 개념 설명하기"
    vi: "Giải thích các ý tưởng cốt lõi của siêu hình học"
    ms: "Terangkan idea teras metafizik"
    id: "Menjelaskan gagasan inti metafisika"
    hi: "तत्वमीमांसा के मूल विचार समझाना"
  - en: "Connect metaphysics to moral questions"
    zh: "把形而上学与道德问题联系起来"
    zh-TW: "把形上學與道德問題聯繫起來"
    ja: "形而上学を道徳の問いと結びつける"
    ko: "형이상학을 도덕적 질문과 연결하기"
    vi: "Liên hệ siêu hình học với câu hỏi đạo đức"
    ms: "Kaitkan metafizik dengan persoalan moral"
    id: "Mengaitkan metafisika dengan soal moral"
    hi: "तत्वमीमांसा को नैतिक सवालों से जोड़ना"
  - en: "Apply ideas to cases like reparations"
    zh: "把理论用于赔偿等实际案例"
    zh-TW: "把理論用於賠償等實際案例"
    ja: "補償などの事例に考えを当てはめる"
    ko: "배상 같은 사례에 이론 적용하기"
    vi: "Áp dụng ý tưởng vào trường hợp như bồi thường"
    ms: "Gunakan idea pada kes seperti pampasan"
    id: "Menerapkan gagasan pada kasus seperti reparasi"
    hi: "मुआवज़े जैसे मामलों पर विचार लागू करना"
