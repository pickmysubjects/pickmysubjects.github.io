code: HIST30079
year: 2027
learn:
  en: "Latin American history since European arrival: first contact, colonial rule, revolutions, and today's debates on identity."
  zh: "欧洲人到来后的拉丁美洲史：初次接触、殖民统治、革命及当今的身份认同争论。"
  zh-TW: "歐洲人到來後的拉丁美洲史：初次接觸、殖民統治、革命及當今的身分認同爭論。"
  ja: "ヨーロッパ人到来以降のラテンアメリカ史：最初の接触、植民地支配、革命、今日のアイデンティティ論争。"
  ko: "유럽인 도래 이후의 라틴아메리카 역사: 첫 접촉, 식민 지배, 혁명, 오늘날의 정체성 논쟁."
  vi: "Lịch sử Mỹ Latinh từ khi người châu Âu đến: lần tiếp xúc đầu, thời thuộc địa, các cuộc cách mạng và tranh luận về bản sắc ngày nay."
  ms: "Sejarah Amerika Latin sejak ketibaan Eropah: pertemuan pertama, penjajahan, revolusi dan perdebatan identiti masa kini."
  id: "Sejarah Amerika Latin sejak kedatangan Eropa: kontak pertama, masa kolonial, revolusi, dan perdebatan identitas masa kini."
  hi: "यूरोपीय आगमन के बाद का लैटिन अमेरिकी इतिहास: पहला संपर्क, औपनिवेशिक शासन, क्रांतियाँ और आज की पहचान पर बहसें।"
outcomes:
  - en: "Explain colonisation, independence and revolution"
    zh: "解释殖民、独立和革命"
    zh-TW: "解釋殖民、獨立和革命"
    ja: "植民地化・独立・革命を説明する"
    ko: "식민화, 독립, 혁명 설명하기"
    vi: "Giải thích thực dân hóa, độc lập và cách mạng"
    ms: "Terangkan penjajahan, kemerdekaan dan revolusi"
    id: "Menjelaskan kolonisasi, kemerdekaan, dan revolusi"
    hi: "उपनिवेशीकरण, स्वतंत्रता और क्रांति समझाना"
  - en: "Compare regions and periods across Latin America"
    zh: "比较拉美不同地区和时期"
    zh-TW: "比較拉美不同地區和時期"
    ja: "ラテンアメリカの地域と時代を比較する"
    ko: "라틴아메리카의 지역과 시대 비교하기"
    vi: "So sánh các vùng và thời kỳ ở Mỹ Latinh"
    ms: "Bandingkan wilayah dan zaman di Amerika Latin"
    id: "Membandingkan wilayah dan periode di Amerika Latin"
    hi: "लैटिन अमेरिका के क्षेत्रों और कालों की तुलना करना"
  - en: "Examine how race, class and identity were contested"
    zh: "探讨种族、阶级和身份如何被争论"
    zh-TW: "探討種族、階級和身分如何被爭論"
    ja: "人種・階級・アイデンティティをめぐる争いを考える"
    ko: "인종, 계급, 정체성을 둘러싼 논쟁 살펴보기"
    vi: "Xem xét tranh luận về chủng tộc, giai cấp và bản sắc"
    ms: "Teliti pertikaian tentang kaum, kelas dan identiti"
    id: "Menelaah perdebatan soal ras, kelas, dan identitas"
    hi: "नस्ल, वर्ग और पहचान पर हुए संघर्ष को परखना"
