code: UNIB10007
year: 2027
learn:
  en: "A broad first look at climate change: the science, Earth's climate history, energy, economics, policy, law and impacts."
  zh: "气候变化入门：科学原理、地球气候史、能源、经济、政策、法律及影响。"
  zh-TW: "氣候變遷入門：科學原理、地球氣候史、能源、經濟、政策、法律及影響。"
  ja: "気候変動の入門：温室効果の科学、地球の気候史、エネルギー、経済、政策、法律、そして影響まで幅広く学ぶ。"
  ko: "기후변화 입문: 과학적 원리, 지구 기후 역사, 에너지, 경제, 정책, 법, 그리고 영향까지 폭넓게 다룬다."
  vi: "Nhập môn biến đổi khí hậu: cơ sở khoa học, lịch sử khí hậu Trái Đất, năng lượng, kinh tế, chính sách, pháp luật và tác động."
  ms: "Pengenalan menyeluruh kepada perubahan iklim: sains, sejarah iklim Bumi, tenaga, ekonomi, dasar, undang-undang dan kesannya."
  id: "Pengantar luas perubahan iklim: sains, sejarah iklim Bumi, energi, ekonomi, kebijakan, hukum, dan dampaknya."
  hi: "जलवायु परिवर्तन का व्यापक परिचय: विज्ञान, पृथ्वी के जलवायु का इतिहास, ऊर्जा, अर्थशास्त्र, नीति, कानून और असर।"
outcomes:
  - en: "Compare how different fields view climate change"
    zh: "比较不同学科对气候变化的看法"
    zh-TW: "比較不同學科對氣候變遷的看法"
    ja: "分野ごとの気候変動の見方を比べる"
    ko: "분야별로 기후변화를 보는 시각 비교하기"
    vi: "So sánh cách các ngành nhìn nhận biến đổi khí hậu"
    ms: "Bandingkan pandangan pelbagai bidang tentang perubahan iklim"
    id: "Membandingkan cara berbagai bidang memandang perubahan iklim"
    hi: "अलग-अलग विषय जलवायु परिवर्तन को कैसे देखते हैं, तुलना करना"
  - en: "Critically analyse climate information in writing and talks"
    zh: "在写作和发言中批判分析气候信息"
    zh-TW: "在寫作和發言中批判分析氣候資訊"
    ja: "気候に関する情報を文章や発表で批判的に分析する"
    ko: "글과 발표로 기후 정보를 비판적으로 분석하기"
    vi: "Phân tích có phản biện thông tin khí hậu qua bài viết và thuyết trình"
    ms: "Analisis maklumat iklim secara kritis dalam penulisan dan pembentangan"
    id: "Menganalisis informasi iklim secara kritis lewat tulisan dan presentasi"
    hi: "लेखन और प्रस्तुति में जलवायु जानकारी का आलोचनात्मक विश्लेषण करना"
  - en: "Combine ideas from several fields on climate problems"
    zh: "结合多学科知识讨论气候问题"
    zh-TW: "結合多學科知識討論氣候問題"
    ja: "複数分野の知識を組み合わせて気候問題を考える"
    ko: "여러 분야의 지식을 합쳐 기후 문제 논의하기"
    vi: "Kết hợp kiến thức nhiều ngành khi bàn về vấn đề khí hậu"
    ms: "Gabungkan idea pelbagai bidang tentang masalah iklim"
    id: "Menggabungkan gagasan berbagai bidang untuk masalah iklim"
    hi: "जलवायु समस्याओं पर कई विषयों के विचार जोड़ना"
