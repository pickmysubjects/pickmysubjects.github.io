code: FREN20018
year: 2026
learn:
  en: "A summer intensive covering French 3 and 4: a full review and build-up of core French grammar."
  zh: "暑期密集课，涵盖法语 3 和 4：系统复习并巩固法语核心语法。"
  zh-TW: "暑期密集課，涵蓋法語 3 和 4：系統複習並鞏固法語核心文法。"
  ja: "フランス語3と4をまとめた夏の集中科目。基本文法を体系的に復習し固める。"
  ko: "프랑스어 3과 4를 묶은 여름 집중 과목. 핵심 문법을 체계적으로 복습하고 다진다."
  vi: "Khóa hè cấp tốc gồm French 3 và 4: ôn tập và củng cố ngữ pháp tiếng Pháp cốt lõi."
  ms: "Kursus intensif musim panas merangkumi French 3 dan 4: ulang kaji tatabahasa teras Perancis."
  id: "Kursus intensif musim panas mencakup French 3 dan 4: mengulang dan memperkuat tata bahasa inti Prancis."
  hi: "फ़्रेंच 3 और 4 को समेटने वाला गर्मियों का गहन कोर्स: मुख्य व्याकरण की पूरी दोहराई।"
outcomes:
  - en: "Talk about familiar topics in French with more confidence"
    zh: "更自信地用法语谈论熟悉的话题"
    zh-TW: "更自信地用法語談論熟悉的話題"
    ja: "身近な話題をフランス語でより自信を持って話す"
    ko: "익숙한 주제를 프랑스어로 더 자신 있게 말하기"
    vi: "Nói về chủ đề quen thuộc bằng tiếng Pháp tự tin hơn"
    ms: "Bercakap tentang topik biasa dalam bahasa Perancis dengan lebih yakin"
    id: "Membicarakan topik akrab dalam bahasa Prancis dengan lebih percaya diri"
    hi: "परिचित विषयों पर फ़्रेंच में ज़्यादा आत्मविश्वास से बात करना"
  - en: "Read and write short French texts"
    zh: "读写简短的法语文章"
    zh-TW: "讀寫簡短的法語文章"
    ja: "短いフランス語の文章を読み書きする"
    ko: "짧은 프랑스어 글 읽고 쓰기"
    vi: "Đọc và viết đoạn văn tiếng Pháp ngắn"
    ms: "Baca dan tulis teks pendek bahasa Perancis"
    id: "Membaca dan menulis teks pendek bahasa Prancis"
    hi: "छोटे फ़्रेंच पाठ पढ़ना-लिखना"
  - en: "Use new grammar and vocabulary correctly"
    zh: "正确运用新语法和词汇"
    zh-TW: "正確運用新文法和詞彙"
    ja: "新しい文法と語彙を正しく使う"
    ko: "새 문법과 어휘를 정확히 쓰기"
    vi: "Dùng đúng ngữ pháp và từ vựng mới"
    ms: "Guna tatabahasa dan kosa kata baharu dengan betul"
    id: "Memakai tata bahasa dan kosakata baru dengan benar"
    hi: "नया व्याकरण और शब्दावली सही इस्तेमाल करना"
