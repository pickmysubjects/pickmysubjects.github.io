code: BMEN90033
year: 2027
learn:
  en: "Designing and building electronic circuits that measure signals from the body, with hands-on practicals."
  zh: "设计并搭建测量人体信号的电子电路，包含动手实验课。"
  zh-TW: "設計並搭建量測人體訊號的電子電路，包含動手實作課。"
  ja: "体の信号を測る電子回路を設計・製作する。実習あり。"
  ko: "인체 신호를 측정하는 전자 회로를 설계·제작하는 실습 과목."
  vi: "Thiết kế và lắp mạch điện tử đo tín hiệu từ cơ thể, có thực hành."
  ms: "Mereka dan membina litar elektronik yang mengukur isyarat badan, dengan amali."
  id: "Merancang dan merakit rangkaian elektronik untuk mengukur sinyal tubuh, dengan praktikum."
  hi: "शरीर के संकेत मापने वाले इलेक्ट्रॉनिक सर्किट डिज़ाइन करना और बनाना, प्रैक्टिकल सहित।"
outcomes:
  - en: "Design and build instruments that meet medical device standards"
    zh: "设计并制作符合医疗器械标准的仪器"
    zh-TW: "設計並製作符合醫療器材標準的儀器"
    ja: "医療機器の基準を満たす計測器を設計・製作する"
    ko: "의료기기 기준에 맞는 기기 설계·제작하기"
    vi: "Thiết kế và chế tạo thiết bị đạt chuẩn thiết bị y tế"
    ms: "Mereka dan membina instrumen yang memenuhi piawaian peranti perubatan"
    id: "Merancang dan membuat instrumen sesuai standar alat medis"
    hi: "मेडिकल डिवाइस मानकों पर खरे उपकरण बनाना"
  - en: "Design signal conditioning for a biomedical device"
    zh: "为生物医学器械设计信号调理电路"
    zh-TW: "為生醫器材設計訊號調理電路"
    ja: "生体医用機器の信号調整回路を設計する"
    ko: "의료 기기의 신호 조절 설계하기"
    vi: "Thiết kế xử lý tín hiệu cho thiết bị y sinh"
    ms: "Mereka penyesuaian isyarat untuk peranti bioperubatan"
    id: "Merancang pengondisian sinyal untuk alat biomedis"
    hi: "बायोमेडिकल डिवाइस के लिए सिग्नल कंडीशनिंग डिज़ाइन करना"
  - en: "Apply safety concepts to medical instruments"
    zh: "把安全原则应用于医疗仪器"
    zh-TW: "把安全原則應用於醫療儀器"
    ja: "医療計測器に安全の考え方を適用する"
    ko: "의료 기기에 안전 개념 적용하기"
    vi: "Áp dụng nguyên tắc an toàn cho thiết bị y tế"
    ms: "Menggunakan konsep keselamatan pada instrumen perubatan"
    id: "Menerapkan konsep keselamatan pada instrumen medis"
    hi: "मेडिकल उपकरणों में सुरक्षा सिद्धांत लागू करना"
