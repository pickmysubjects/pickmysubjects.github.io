code: INDG30006
year: 2027
learn:
  en: "How First Nations build economic power through their own funds, businesses and settlements, and what stands in the way."
  zh: "原住民族如何通过自有基金、企业和和解协议建立经济实力，以及面临的障碍。"
  zh-TW: "原住民族如何透過自有基金、企業和和解協議建立經濟實力，以及面臨的障礙。"
  ja: "先住民族が独自の基金・企業・和解金で経済力を築く方法と、その障壁。"
  ko: "원주민 민족이 자체 기금, 기업, 합의금으로 경제력을 쌓는 방식과 그 장애물."
  vi: "Cách các dân tộc bản địa xây dựng sức mạnh kinh tế qua quỹ, doanh nghiệp và thỏa thuận bồi thường của riêng họ, cùng những rào cản."
  ms: "Cara Bangsa Pertama membina kuasa ekonomi melalui dana, perniagaan dan penyelesaian sendiri, serta halangan yang dihadapi."
  id: "Cara masyarakat adat membangun kekuatan ekonomi lewat dana, usaha, dan penyelesaian milik sendiri, serta hambatannya."
  hi: "फ़र्स्ट नेशंस अपने फ़ंड, उद्यमों और समझौतों से आर्थिक ताक़त कैसे बनाते हैं, और रास्ते में क्या बाधाएँ हैं।"
outcomes:
  - en: "Discuss what shapes Indigenous economic sovereignty"
    zh: "讨论影响原住民经济主权的因素"
    zh-TW: "討論影響原住民經濟主權的因素"
    ja: "先住民の経済的主権を左右する要因を論じる"
    ko: "원주민 경제 주권에 영향을 주는 요인 논의하기"
    vi: "Thảo luận các yếu tố ảnh hưởng đến chủ quyền kinh tế bản địa"
    ms: "Bincang faktor yang mempengaruhi kedaulatan ekonomi Orang Asli"
    id: "Membahas faktor yang memengaruhi kedaulatan ekonomi Pribumi"
    hi: "आदिवासी आर्थिक संप्रभुता को प्रभावित करने वाले कारकों पर चर्चा करना"
  - en: "Compare models of economic self-determination"
    zh: "比较不同的经济自决模式"
    zh-TW: "比較不同的經濟自決模式"
    ja: "経済的自己決定のモデルを比べる"
    ko: "경제적 자결 모델 비교하기"
    vi: "So sánh các mô hình tự quyết kinh tế"
    ms: "Bandingkan model penentuan nasib ekonomi sendiri"
    id: "Membandingkan model penentuan nasib ekonomi sendiri"
    hi: "आर्थिक आत्मनिर्णय के मॉडलों की तुलना करना"
