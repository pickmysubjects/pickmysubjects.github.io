code: MUSI20138
year: 2026
learn:
  en: "Play Indonesian gamelan, with its gongs, chimes and interlocking melodies, in weekly rehearsals leading to a concert."
  zh: "演奏印尼甘美兰：锣、编钟与交错旋律，每周排练，期末演出。"
  zh-TW: "演奏印尼甘美蘭：鑼、編鐘與交錯旋律，每週排練，期末演出。"
  ja: "インドネシアのガムランを演奏。ゴングや鍵盤打楽器、かみ合う旋律を週1で練習し演奏会へ。"
  ko: "인도네시아 가믈란 연주: 공, 차임, 맞물리는 선율. 주간 연습 후 공연."
  vi: "Chơi gamelan Indonesia: cồng, chiêng và giai điệu đan xen, tập hằng tuần rồi biểu diễn."
  ms: "Main gamelan Indonesia: gong, cim dan melodi bertaut, latihan mingguan hingga konsert."
  id: "Memainkan gamelan: gong, bilah logam, dan melodi saling mengunci, latihan mingguan hingga konser."
  hi: "इंडोनेशियाई गमेलन: गोंग, घंटियाँ और गुँथी धुनें, साप्ताहिक रिहर्सल से कॉन्सर्ट तक।"
outcomes:
  - en: "Play a traditional instrument with sound basic technique"
    zh: "掌握一件传统乐器的基本技巧"
    zh-TW: "掌握一件傳統樂器的基本技巧"
    ja: "伝統楽器の基本奏法を身につける"
    ko: "전통 악기의 기본 주법 익히기"
    vi: "Chơi một nhạc cụ truyền thống với kỹ thuật cơ bản"
    ms: "Main alat muzik tradisional dengan teknik asas"
    id: "Memainkan alat musik tradisional dengan teknik dasar"
    hi: "एक पारंपरिक वाद्य को बुनियादी तकनीक से बजाना"
  - en: "Perform interlocking gamelan patterns with others"
    zh: "与他人合奏甘美兰交错音型"
    zh-TW: "與他人合奏甘美蘭交錯音型"
    ja: "かみ合うガムランの音型を合奏する"
    ko: "맞물리는 가믈란 패턴 함께 연주하기"
    vi: "Chơi các mẫu đan xen của gamelan cùng nhóm"
    ms: "Mainkan corak gamelan bertaut bersama"
    id: "Memainkan pola gamelan yang saling mengunci"
    hi: "दूसरों के साथ गमेलन के गुँथे पैटर्न बजाना"
  - en: "Explain gamelan theory and its cultural setting"
    zh: "讲解甘美兰乐理及其文化背景"
    zh-TW: "講解甘美蘭樂理及其文化背景"
    ja: "ガムランの理論と文化的背景を説明する"
    ko: "가믈란 이론과 문화적 배경 설명하기"
    vi: "Giải thích lý thuyết gamelan và bối cảnh văn hóa"
    ms: "Terangkan teori gamelan dan konteks budayanya"
    id: "Menjelaskan teori gamelan dan konteks budayanya"
    hi: "गमेलन सिद्धांत और उसका सांस्कृतिक संदर्भ समझाना"
