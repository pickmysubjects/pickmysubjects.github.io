code: ENEN90029
year: 2027
learn:
  en: "Water quality standards and how drinking water, wastewater and recycled water are treated."
  zh: "水质标准，以及饮用水、污水和再生水如何处理。"
  zh-TW: "水質標準，以及飲用水、污水與再生水如何處理。"
  ja: "水質基準と、飲料水・下水・再生水の処理方法。"
  ko: "수질 기준과 음용수, 하수, 재이용수의 처리 방법."
  vi: "Tiêu chuẩn chất lượng nước và cách xử lý nước uống, nước thải, nước tái sử dụng."
  ms: "Piawaian kualiti air dan cara air minuman, air sisa dan air kitar semula dirawat."
  id: "Standar kualitas air dan cara mengolah air minum, air limbah, dan air daur ulang."
  hi: "जल गुणवत्ता मानक और पीने के पानी, अपशिष्ट जल व पुनर्चक्रित जल का उपचार।"
outcomes:
  - en: "Read water quality data against guidelines"
    zh: "对照标准解读水质数据"
    zh-TW: "對照標準解讀水質資料"
    ja: "基準に照らして水質データを読む"
    ko: "기준에 따라 수질 데이터 해석하기"
    vi: "Đọc dữ liệu chất lượng nước theo hướng dẫn"
    ms: "Membaca data kualiti air berdasarkan garis panduan"
    id: "Membaca data kualitas air sesuai pedoman"
    hi: "दिशानिर्देशों के अनुसार जल गुणवत्ता डेटा पढ़ना"
  - en: "Run a water quality risk assessment"
    zh: "开展水质风险评估"
    zh-TW: "進行水質風險評估"
    ja: "水質リスク評価を行う"
    ko: "수질 위험 평가 수행하기"
    vi: "Thực hiện đánh giá rủi ro chất lượng nước"
    ms: "Menjalankan penilaian risiko kualiti air"
    id: "Melakukan penilaian risiko kualitas air"
    hi: "जल गुणवत्ता जोखिम आकलन करना"
  - en: "Draft a treatment system for a small town"
    zh: "为一个小镇做给水和污水处理的概念设计"
    zh-TW: "為一個小鎮做給水與污水處理的概念設計"
    ja: "小さな町の上下水処理を概念設計する"
    ko: "작은 마을의 상하수 처리 시스템 개념 설계하기"
    vi: "Thiết kế sơ bộ hệ thống xử lý nước cho một thị trấn nhỏ"
    ms: "Mereka bentuk konsep sistem rawatan untuk pekan kecil"
    id: "Merancang konsep sistem pengolahan untuk kota kecil"
    hi: "एक छोटे कस्बे के लिए उपचार प्रणाली का प्रारूप डिज़ाइन"
