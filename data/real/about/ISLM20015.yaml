code: ISLM20015
year: 2026
learn:
  en: "Religion and politics in the Middle East and South Asia, from Egypt and Iran to Pakistan and India, through constitutions and manifestos."
  zh: "中东与南亚的宗教与政治，从埃及、伊朗到巴基斯坦、印度，通过宪法和宣言等一手资料来读。"
  zh-TW: "中東與南亞的宗教與政治，從埃及、伊朗到巴基斯坦、印度，透過憲法和宣言等一手資料來讀。"
  ja: "エジプト、イランからパキスタン、インドまで、中東と南アジアの宗教と政治を憲法や宣言などの一次資料で読む。"
  ko: "이집트, 이란부터 파키스탄, 인도까지 중동과 남아시아의 종교와 정치를 헌법, 선언문 같은 1차 자료로 읽는다."
  vi: "Tôn giáo và chính trị ở Trung Đông, Nam Á, từ Ai Cập, Iran đến Pakistan, Ấn Độ, qua hiến pháp và tuyên ngôn."
  ms: "Agama dan politik di Timur Tengah dan Asia Selatan, dari Mesir dan Iran hingga Pakistan dan India, melalui perlembagaan dan manifesto."
  id: "Agama dan politik di Timur Tengah dan Asia Selatan, dari Mesir dan Iran hingga Pakistan dan India, lewat konstitusi dan manifesto."
  hi: "मध्य पूर्व और दक्षिण एशिया में धर्म और राजनीति, मिस्र व ईरान से पाकिस्तान व भारत तक, संविधानों और घोषणापत्रों के ज़रिए।"
outcomes:
  - en: "Compare religion's role in different states"
    zh: "比较宗教在不同国家中的角色"
    zh-TW: "比較宗教在不同國家中的角色"
    ja: "国ごとの宗教の役割を比べる"
    ko: "여러 국가에서 종교의 역할 비교하기"
    vi: "So sánh vai trò của tôn giáo ở các quốc gia"
    ms: "Bandingkan peranan agama di negara berbeza"
    id: "Membandingkan peran agama di berbagai negara"
    hi: "अलग-अलग देशों में धर्म की भूमिका की तुलना करना"
  - en: "Analyse political documents as sources"
    zh: "把政治文件当作资料来分析"
    zh-TW: "把政治文件當作資料來分析"
    ja: "政治文書を資料として分析する"
    ko: "정치 문서를 자료로 분석하기"
    vi: "Phân tích văn bản chính trị như nguồn tư liệu"
    ms: "Analisis dokumen politik sebagai sumber"
    id: "Menganalisis dokumen politik sebagai sumber"
    hi: "राजनीतिक दस्तावेज़ों का स्रोत के रूप में विश्लेषण करना"
  - en: "Discuss elections, revolution and human rights"
    zh: "讨论选举、革命与人权"
    zh-TW: "討論選舉、革命與人權"
    ja: "選挙、革命、人権について議論する"
    ko: "선거, 혁명, 인권 토론하기"
    vi: "Thảo luận bầu cử, cách mạng và nhân quyền"
    ms: "Bincangkan pilihan raya, revolusi dan hak asasi"
    id: "Membahas pemilu, revolusi dan hak asasi"
    hi: "चुनाव, क्रांति और मानवाधिकार पर चर्चा करना"
