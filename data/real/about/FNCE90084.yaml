code: FNCE90084
year: 2027
learn:
  en: "How machine learning and AI solve real finance problems, taught through case studies and hands-on projects."
  zh: "机器学习和人工智能如何解决真实金融问题，通过案例和动手项目学习。"
  zh-TW: "機器學習與人工智慧如何解決真實金融問題，透過個案與實作專題學習。"
  ja: "機械学習と AI が実際の金融問題をどう解くかを、事例と実践課題で学ぶ。"
  ko: "머신러닝과 AI가 실제 금융 문제를 푸는 방법을 사례와 실습 프로젝트로 배운다."
  vi: "Học máy và AI giải quyết vấn đề tài chính thực tế ra sao, qua tình huống và dự án thực hành."
  ms: "Cara pembelajaran mesin dan AI menyelesaikan masalah kewangan sebenar, melalui kes dan projek amali."
  id: "Cara machine learning dan AI memecahkan masalah keuangan nyata, lewat studi kasus dan proyek praktik."
  hi: "मशीन लर्निंग और AI असली वित्तीय समस्याएं कैसे हल करते हैं, केस स्टडी और प्रोजेक्ट से।"
outcomes:
  - en: "Match machine learning methods to finance problems"
    zh: "将机器学习方法用于金融问题"
    zh-TW: "將機器學習方法用於金融問題"
    ja: "機械学習の手法を金融問題に当てはめる"
    ko: "머신러닝 기법을 금융 문제에 적용하기"
    vi: "Áp dụng phương pháp học máy vào bài toán tài chính"
    ms: "Memadankan kaedah pembelajaran mesin dengan masalah kewangan"
    id: "Mencocokkan metode machine learning dengan masalah keuangan"
    hi: "वित्तीय समस्याओं पर मशीन लर्निंग विधियां लागू करना"
  - en: "Tell real disruption from mere computerisation"
    zh: "区分真正的颠覆与单纯的电脑化"
    zh-TW: "區分真正的顛覆與單純的電腦化"
    ja: "真の変革と単なる電算化を見分ける"
    ko: "진짜 혁신과 단순 전산화 구분하기"
    vi: "Phân biệt đổi mới đột phá với tin học hóa đơn thuần"
    ms: "Membezakan gangguan sebenar daripada pengkomputeran semata-mata"
    id: "Membedakan disrupsi nyata dari sekadar komputerisasi"
    hi: "असली बदलाव और सिर्फ़ कंप्यूटरीकरण में फ़र्क करना"
