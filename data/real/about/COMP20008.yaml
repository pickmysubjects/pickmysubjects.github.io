code: COMP20008
year: 2026
learn:
  en: "Getting data ready for analysis: collecting, cleaning, combining, querying and visualising it."
  zh: "为分析准备数据：收集、清洗、合并、查询和可视化。"
  zh-TW: "為分析準備資料：蒐集、清理、合併、查詢和視覺化。"
  ja: "分析のためのデータ準備：収集・クリーニング・統合・クエリ・可視化。"
  ko: "분석을 위한 데이터 준비: 수집, 정제, 결합, 조회, 시각화."
  vi: "Chuẩn bị dữ liệu để phân tích: thu thập, làm sạch, kết hợp, truy vấn và trực quan hóa."
  ms: "Sediakan data untuk analisis: kumpul, bersih, gabung, tanya dan visualkan."
  id: "Menyiapkan data untuk analisis: mengumpulkan, membersihkan, menggabungkan, query, dan visualisasi."
  hi: "डेटा को विश्लेषण के लिए तैयार करना: इकट्ठा करना, साफ़ करना, जोड़ना, क्वेरी और विज़ुअलाइज़ करना।"
outcomes:
  - en: "Clean messy data and fill in missing values"
    zh: "清洗数据、补全缺失值"
    zh-TW: "清理資料、補齊缺失值"
    ja: "乱れたデータを整え、欠損値を補う"
    ko: "지저분한 데이터 정제와 결측값 보완"
    vi: "Làm sạch dữ liệu lộn xộn và điền giá trị thiếu"
    ms: "Bersihkan data bersepah dan isi nilai hilang"
    id: "Membersihkan data berantakan dan mengisi nilai kosong"
    hi: "गंदा डेटा साफ़ करना और गायब वैल्यू भरना"
  - en: "Combine data from several sources"
    zh: "合并多个来源的数据"
    zh-TW: "合併多個來源的資料"
    ja: "複数ソースのデータを統合する"
    ko: "여러 출처의 데이터 결합"
    vi: "Kết hợp dữ liệu từ nhiều nguồn"
    ms: "Gabungkan data dari pelbagai sumber"
    id: "Menggabungkan data dari beberapa sumber"
    hi: "कई स्रोतों का डेटा जोड़ना"
  - en: "Build and compare steps in a data pipeline"
    zh: "搭建并比较数据处理流程"
    zh-TW: "建立並比較資料處理流程"
    ja: "データパイプラインの各段階を作り比較する"
    ko: "데이터 파이프라인 단계 구축 및 비교"
    vi: "Xây dựng và so sánh các bước trong pipeline dữ liệu"
    ms: "Bina dan banding langkah dalam saluran data"
    id: "Membangun dan membandingkan tahap data pipeline"
    hi: "डेटा पाइपलाइन के चरण बनाना और तुलना करना"
