code: ECOM30002
year: 2026
learn:
  en: "Next-step econometrics: finding causal effects, instrumental variables, panel data and time series."
  zh: "进阶计量经济学：识别因果效应、工具变量、面板数据和时间序列。"
  zh-TW: "進階計量經濟學：辨識因果效果、工具變數、追蹤資料和時間序列。"
  ja: "一歩進んだ計量経済学：因果効果、操作変数、パネルデータ、時系列。"
  ko: "한 단계 위 계량경제학: 인과효과, 도구변수, 패널 데이터, 시계열."
  vi: "Kinh tế lượng nâng cao: tìm hiệu ứng nhân quả, biến công cụ, dữ liệu bảng và chuỗi thời gian."
  ms: "Ekonometrik lanjutan: kesan sebab-akibat, pemboleh ubah instrumen, data panel dan siri masa."
  id: "Ekonometrika lanjutan: efek kausal, variabel instrumen, data panel, dan deret waktu."
  hi: "आगे की इकोनोमेट्रिक्स: कारण-प्रभाव, इंस्ट्रुमेंटल वैरिएबल, पैनल डेटा और टाइम सीरीज़।"
outcomes:
  - en: "Use instrumental variables to estimate causal effects"
    zh: "用工具变量估计因果效应"
    zh-TW: "用工具變數估計因果效果"
    ja: "操作変数で因果効果を推定する"
    ko: "도구변수로 인과효과 추정"
    vi: "Dùng biến công cụ để ước lượng hiệu ứng nhân quả"
    ms: "Guna pemboleh ubah instrumen untuk anggar kesan sebab-akibat"
    id: "Memakai variabel instrumen untuk mengestimasi efek kausal"
    hi: "इंस्ट्रुमेंटल वैरिएबल से कारण-प्रभाव का अनुमान लगाना"
  - en: "Model panel and time series data"
    zh: "为面板和时间序列数据建模"
    zh-TW: "為追蹤資料和時間序列建模"
    ja: "パネルデータと時系列をモデル化する"
    ko: "패널 데이터와 시계열 모형화"
    vi: "Lập mô hình dữ liệu bảng và chuỗi thời gian"
    ms: "Modelkan data panel dan siri masa"
    id: "Memodelkan data panel dan deret waktu"
    hi: "पैनल और टाइम सीरीज़ डेटा का मॉडल बनाना"
  - en: "Test an economic question with data you collect"
    zh: "用自己收集的数据检验经济问题"
    zh-TW: "用自己蒐集的資料檢驗經濟問題"
    ja: "自分で集めたデータで経済の問いを検証する"
    ko: "직접 모은 데이터로 경제 질문 검증"
    vi: "Kiểm chứng một câu hỏi kinh tế bằng dữ liệu tự thu thập"
    ms: "Uji soalan ekonomi dengan data yang anda kumpul"
    id: "Menguji pertanyaan ekonomi dengan data yang dikumpulkan sendiri"
    hi: "खुद जुटाए डेटा से आर्थिक सवाल जाँचना"
