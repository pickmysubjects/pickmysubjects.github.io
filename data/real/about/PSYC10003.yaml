code: PSYC10003
year: 2026
learn:
  en: "How we sense, perceive, learn, think and remember, and how psychologists study it."
  zh: "人怎么感知、学习、思考和记忆，以及心理学怎么研究这些。"
  zh-TW: "人怎麼感知、學習、思考和記憶，以及心理學家怎麼研究這些。"
  ja: "人がどう感じ、知覚し、学び、考え、記憶するか、そして心理学者がそれをどう研究するか。"
  ko: "우리가 감각하고 지각하고 배우고 생각하고 기억하는 방식, 그리고 심리학자의 연구 방법."
  vi: "Cách ta cảm nhận, tri giác, học, suy nghĩ, ghi nhớ và cách nhà tâm lý học nghiên cứu điều đó."
  ms: "Cara kita merasa, mempersepsi, belajar, berfikir dan mengingat, serta cara ahli psikologi mengkajinya."
  id: "Cara kita merasakan, mempersepsi, belajar, berpikir, dan mengingat, serta cara psikolog menelitinya."
  hi: "हम कैसे महसूस, अनुभव, सीखते, सोचते और याद रखते हैं, और मनोवैज्ञानिक इसे कैसे पढ़ते हैं।"
outcomes:
  - en: "Describe and interpret psychological data"
    zh: "描述并解读心理学数据"
    zh-TW: "描述並解讀心理學數據"
    ja: "心理学のデータを記述し解釈する"
    ko: "심리학 데이터를 기술하고 해석"
    vi: "Mô tả và giải thích dữ liệu tâm lý học"
    ms: "Huraikan dan tafsirkan data psikologi"
    id: "Mendeskripsikan dan menafsirkan data psikologi"
    hi: "मनोवैज्ञानिक डेटा का वर्णन और व्याख्या"
  - en: "Plan a research proposal as a team"
    zh: "和小组一起写研究计划"
    zh-TW: "和小組一起規劃研究計畫"
    ja: "チームで研究計画を立てる"
    ko: "팀으로 연구 계획서 기획"
    vi: "Lập đề cương nghiên cứu theo nhóm"
    ms: "Rancang cadangan penyelidikan secara berpasukan"
    id: "Menyusun proposal riset bersama tim"
    hi: "टीम के साथ रिसर्च प्रस्ताव की योजना बनाना"
  - en: "Write a literature review or research report"
    zh: "写文献综述或研究报告"
    zh-TW: "寫文獻回顧或研究報告"
    ja: "文献レビューか研究レポートを書く"
    ko: "문헌 리뷰나 연구 보고서 작성"
    vi: "Viết tổng quan tài liệu hoặc báo cáo nghiên cứu"
    ms: "Tulis sorotan literatur atau laporan kajian"
    id: "Menulis tinjauan pustaka atau laporan riset"
    hi: "लिटरेचर रिव्यू या रिसर्च रिपोर्ट लिखना"
