code: CVEN90035
year: 2027
learn:
  en: "Behaviour and design of composite, prestressed, timber and cold-formed steel structures, plus fire design and embodied carbon."
  zh: "组合结构、预应力、木结构和冷弯薄壁钢结构的性能与设计，以及防火设计和隐含碳。"
  zh-TW: "複合結構、預力、木結構與冷軋型鋼結構的行為與設計，以及防火設計與蘊含碳。"
  ja: "合成・プレストレスト・木質・冷間成形鋼構造の挙動と設計、耐火設計と内包炭素。"
  ko: "합성·프리스트레스트·목재·냉간성형강 구조의 거동과 설계, 내화 설계와 내재 탄소."
  vi: "Ứng xử và thiết kế kết cấu liên hợp, dự ứng lực, gỗ và thép tạo hình nguội, cùng thiết kế chống cháy và carbon hàm chứa."
  ms: "Kelakuan dan reka bentuk struktur komposit, prategasan, kayu dan keluli terbentuk sejuk, serta reka bentuk kebakaran dan karbon terkandung."
  id: "Perilaku dan desain struktur komposit, prategang, kayu dan baja canai dingin, serta desain kebakaran dan karbon terkandung."
  hi: "कम्पोज़िट, प्रीस्ट्रेस्ड, लकड़ी और कोल्ड-फ़ॉर्म्ड स्टील संरचनाओं का व्यवहार और डिज़ाइन, साथ में अग्नि डिज़ाइन और अंतर्निहित कार्बन।"
outcomes:
  - en: "Analyse how modern structural members behave"
    zh: "分析现代结构构件的受力性能"
    zh-TW: "分析現代結構構件的受力行為"
    ja: "現代の構造部材の挙動を解析する"
    ko: "현대 구조 부재의 거동 해석하기"
    vi: "Phân tích ứng xử của cấu kiện kết cấu hiện đại"
    ms: "Menganalisis kelakuan anggota struktur moden"
    id: "Menganalisis perilaku elemen struktur modern"
    hi: "आधुनिक संरचनात्मक अवयवों के व्यवहार का विश्लेषण"
  - en: "Assess fire performance and apply fire design principles"
    zh: "评估结构耐火性能并应用防火设计原则"
    zh-TW: "評估結構耐火性能並應用防火設計原則"
    ja: "耐火性能を評価し耐火設計の原則を適用する"
    ko: "내화 성능 평가 및 내화 설계 원칙 적용하기"
    vi: "Đánh giá khả năng chịu lửa và áp dụng nguyên tắc thiết kế chống cháy"
    ms: "Menilai prestasi kebakaran dan menggunakan prinsip reka bentuk kebakaran"
    id: "Menilai kinerja terhadap kebakaran dan menerapkan prinsip desain kebakaran"
    hi: "अग्नि प्रदर्शन का आकलन और अग्नि डिज़ाइन सिद्धांत लागू करना"
  - en: "Design real structures with material efficiency and embodied carbon in mind"
    zh: "兼顾材料效率和隐含碳设计实际结构"
    zh-TW: "兼顧材料效率與蘊含碳設計實際結構"
    ja: "材料効率と内包炭素を考えて実際の構造を設計する"
    ko: "재료 효율과 내재 탄소를 고려해 실제 구조 설계하기"
    vi: "Thiết kế công trình thực tế có tính đến hiệu quả vật liệu và carbon hàm chứa"
    ms: "Mereka bentuk struktur sebenar dengan mengambil kira kecekapan bahan dan karbon terkandung"
    id: "Merancang struktur nyata dengan memperhatikan efisiensi material dan karbon terkandung"
    hi: "सामग्री दक्षता और अंतर्निहित कार्बन ध्यान में रखकर वास्तविक संरचनाएँ डिज़ाइन करना"
