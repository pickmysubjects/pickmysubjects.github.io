code: CVEN90068
year: 2027
learn:
  en: "Ship traffic, channel design, navigation aids, moorings and port safety, taught with industry lecturers."
  zh: "船舶交通、航道设计、助航设施、系泊和港口安全，并有业界讲师参与授课。"
  zh-TW: "船舶交通、航道設計、助航設施、繫泊與港口安全，並有業界講師參與授課。"
  ja: "船舶交通・航路設計・航路標識・係留・港の安全を、業界講師とともに学ぶ。"
  ko: "선박 교통, 항로 설계, 항로 표지, 계류, 항만 안전을 업계 강사와 함께 배운다."
  vi: "Giao thông tàu, thiết kế luồng, phao tiêu, neo buộc và an toàn cảng, có giảng viên từ ngành."
  ms: "Trafik kapal, reka bentuk alur, alat bantu navigasi, tambatan dan keselamatan pelabuhan, bersama pensyarah industri."
  id: "Lalu lintas kapal, desain alur, sarana bantu navigasi, tambatan dan keselamatan pelabuhan, bersama pengajar industri."
  hi: "जहाज़ यातायात, चैनल डिज़ाइन, नौवहन सहायक, मूरिंग और बंदरगाह सुरक्षा, उद्योग के व्याख्याताओं के साथ।"
outcomes:
  - en: "Analyse port access and navigation problems"
    zh: "分析港口进出与航行问题"
    zh-TW: "分析港口進出與航行問題"
    ja: "港へのアクセスと航行の問題を解析する"
    ko: "항만 접근과 항행 문제 분석하기"
    vi: "Phân tích vấn đề ra vào cảng và hàng hải"
    ms: "Menganalisis masalah akses dan navigasi pelabuhan"
    id: "Menganalisis masalah akses dan navigasi pelabuhan"
    hi: "बंदरगाह पहुँच और नौवहन समस्याओं का विश्लेषण"
  - en: "Prepare an access and navigation plan for a class of vessel"
    zh: "为某类船舶制定进出港和航行方案"
    zh-TW: "為某類船舶制定進出港與航行計畫"
    ja: "特定の船型向けに入出港・航行計画を作る"
    ko: "특정 선형에 맞는 입출항·항행 계획 세우기"
    vi: "Lập kế hoạch ra vào và hàng hải cho một loại tàu"
    ms: "Menyediakan pelan akses dan navigasi untuk satu kelas kapal"
    id: "Menyusun rencana akses dan navigasi untuk satu kelas kapal"
    hi: "किसी श्रेणी के जहाज़ के लिए पहुँच और नौवहन योजना बनाना"
