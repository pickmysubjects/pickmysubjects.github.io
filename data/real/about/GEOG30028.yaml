code: GEOG30028
year: 2026
learn:
  en: "Why movement matters, from tourists and commuters to migrants and refugees, and how mobility links to power and climate change."
  zh: "为什么流动很重要，从游客、通勤者到移民和难民，以及流动如何与权力和气候变化相关。"
  zh-TW: "為什麼流動很重要，從遊客、通勤者到移民和難民，以及流動如何與權力和氣候變遷相關。"
  ja: "観光客や通勤者から移民・難民まで、移動がなぜ重要か、移動が権力や気候変動とどう結びつくかを学ぶ。"
  ko: "관광객과 통근자부터 이주민과 난민까지 이동이 왜 중요한지, 이동성이 권력·기후 변화와 어떻게 연결되는지 배운다."
  vi: "Vì sao sự di chuyển quan trọng, từ du khách, người đi làm đến người di cư, tị nạn, và nó gắn với quyền lực, biến đổi khí hậu ra sao."
  ms: "Mengapa pergerakan penting, daripada pelancong dan penumpang harian hingga migran dan pelarian, serta kaitannya dengan kuasa dan iklim."
  id: "Mengapa pergerakan penting, dari turis dan komuter hingga migran dan pengungsi, serta kaitan mobilitas dengan kekuasaan dan perubahan iklim."
  hi: "आवाजाही क्यों मायने रखती है, पर्यटकों और यात्रियों से प्रवासियों और शरणार्थियों तक, और यह सत्ता व जलवायु बदलाव से कैसे जुड़ी है।"
outcomes:
  - en: "Explain key ideas in mobility studies"
    zh: "解释流动研究的核心概念"
    zh-TW: "解釋流動研究的核心概念"
    ja: "モビリティ研究の主な考えを説明する"
    ko: "모빌리티 연구의 핵심 개념 설명하기"
    vi: "Giải thích các khái niệm chính của nghiên cứu di chuyển"
    ms: "Terangkan idea utama kajian mobiliti"
    id: "Menjelaskan gagasan utama studi mobilitas"
    hi: "मोबिलिटी अध्ययन के मुख्य विचार समझाना"
  - en: "Analyse how mobility relates to power"
    zh: "分析流动与权力的关系"
    zh-TW: "分析流動與權力的關係"
    ja: "移動と権力の関係を分析する"
    ko: "이동성과 권력의 관계 분석하기"
    vi: "Phân tích mối quan hệ giữa di chuyển và quyền lực"
    ms: "Analisis kaitan mobiliti dengan kuasa"
    id: "Menganalisis kaitan mobilitas dengan kekuasaan"
    hi: "आवाजाही और सत्ता के संबंध का विश्लेषण करना"
  - en: "Apply these ideas to current debates"
    zh: "把这些概念用于当下的争论"
    zh-TW: "把這些概念用於當下的爭論"
    ja: "これらの考えを今の議論に当てはめる"
    ko: "이 개념을 현재 논쟁에 적용하기"
    vi: "Áp dụng các ý tưởng này vào tranh luận hiện nay"
    ms: "Gunakan idea ini pada perdebatan semasa"
    id: "Menerapkan gagasan ini pada perdebatan terkini"
    hi: "इन विचारों को आज की बहसों पर लागू करना"
