code: MCEN90059
year: 2027
learn:
  en: "Probability and statistics for engineers, applied to reliability, maintenance, quality control and experiment design."
  zh: "工程概率与统计，用于可靠性、维护、质量控制和实验设计。"
  zh-TW: "工程機率與統計，用於可靠度、維護、品質管制與實驗設計。"
  ja: "技術者のための確率・統計を、信頼性・保全・品質管理・実験計画に使う。"
  ko: "공학 확률·통계를 신뢰성, 정비, 품질관리, 실험 설계에 적용."
  vi: "Xác suất thống kê cho kỹ sư, áp dụng vào độ tin cậy, bảo trì, kiểm soát chất lượng, thiết kế thí nghiệm."
  ms: "Kebarangkalian dan statistik untuk jurutera, digunakan pada kebolehpercayaan, penyelenggaraan, kawalan kualiti dan reka bentuk eksperimen."
  id: "Probabilitas dan statistik untuk insinyur, diterapkan pada keandalan, perawatan, kendali mutu, dan desain eksperimen."
  hi: "इंजीनियरों के लिए प्रायिकता व सांख्यिकी, विश्वसनीयता, रखरखाव, गुणवत्ता नियंत्रण और प्रयोग डिज़ाइन में।"
outcomes:
  - en: "Run parametric and non-parametric hypothesis tests"
    zh: "做参数和非参数假设检验"
    zh-TW: "做參數與無母數假設檢定"
    ja: "パラメトリック・ノンパラメトリック検定を行う"
    ko: "모수·비모수 가설검정 수행하기"
    vi: "Thực hiện kiểm định giả thuyết tham số và phi tham số"
    ms: "Menjalankan ujian hipotesis berparameter dan tak berparameter"
    id: "Melakukan uji hipotesis parametrik dan nonparametrik"
    hi: "पैरामीट्रिक और नॉन-पैरामीट्रिक परिकल्पना परीक्षण"
  - en: "Design experiments to collect engineering data"
    zh: "设计实验来收集工程数据"
    zh-TW: "設計實驗來蒐集工程資料"
    ja: "工学データを集める実験を計画する"
    ko: "공학 데이터 수집을 위한 실험 설계하기"
    vi: "Thiết kế thí nghiệm để thu thập dữ liệu kỹ thuật"
    ms: "Mereka bentuk eksperimen untuk mengumpul data kejuruteraan"
    id: "Merancang eksperimen untuk mengumpulkan data teknik"
    hi: "इंजीनियरिंग डेटा के लिए प्रयोग डिज़ाइन करना"
