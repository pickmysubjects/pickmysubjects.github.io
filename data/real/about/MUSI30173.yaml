code: MUSI30173
year: 2026
learn:
  en: "A second semester with the early music chamber choir, learning new repertoire and performing with other early ensembles."
  zh: "早期音乐室内合唱团第二学期，学习新曲目并与其他古乐团合演。"
  zh-TW: "早期音樂室內合唱團第二學期，學習新曲目並與其他古樂團合演。"
  ja: "古楽合唱の後期。新しい曲を学び、他の古楽アンサンブルと共演する。"
  ko: "고음악 합창단 2학기. 새 곡을 배우고 다른 고음악 앙상블과 협연."
  vi: "Học kỳ hai với dàn hợp xướng nhạc cổ, tiết mục mới, diễn cùng nhóm khác."
  ms: "Semester kedua koir muzik awal, repertoir baharu dan persembahan bersama."
  id: "Semester kedua paduan musik awal, repertoar baru dan tampil bersama."
  hi: "प्रारंभिक संगीत कोरस का दूसरा सत्र, नई रचनाएँ और अन्य समूहों के साथ प्रस्तुति।"
outcomes:
  - en: "Tune and blend closely without accompaniment"
    zh: "无伴奏时精准调音与融合"
    zh-TW: "無伴奏時精準調音與融合"
    ja: "無伴奏で音程を合わせ溶け合う"
    ko: "무반주로 음정 맞추고 어우러지기"
    vi: "Giữ cao độ và hòa giọng khi không đệm"
    ms: "Selaraskan nada tanpa iringan"
    id: "Menyelaraskan nada tanpa iringan"
    hi: "बिना संगत के सुर मिलाना और घुलना"
  - en: "Sing alongside early instrument ensembles"
    zh: "与古乐器合奏团同台演唱"
    zh-TW: "與古樂器合奏團同台演唱"
    ja: "古楽器アンサンブルと共に歌う"
    ko: "고악기 앙상블과 함께 노래하기"
    vi: "Hát cùng nhóm nhạc cụ cổ"
    ms: "Menyanyi bersama ensembel alat lama"
    id: "Bernyanyi bersama ansambel alat musik lama"
    hi: "पुराने वाद्य समूहों के साथ गाना"
  - en: "Pass an individual part test"
    zh: "通过个人声部测试"
    zh-TW: "通過個人聲部測試"
    ja: "個人パートテストに合格する"
    ko: "개인 파트 테스트 통과하기"
    vi: "Vượt qua bài kiểm tra bè cá nhân"
    ms: "Lulus ujian bahagian individu"
    id: "Lulus tes partisi individu"
    hi: "व्यक्तिगत भाग परीक्षा पास करना"
