code: ABPL90394
year: 2027
learn:
  en: "A five-day workshop on zero-energy mass-custom housing, with energy simulation tools and a housing prototype."
  zh: "为期五天的零能耗大规模定制住宅工作坊，使用能耗模拟工具并做住宅原型。"
  zh-TW: "為期五天的零耗能大量客製住宅工作坊，使用能耗模擬工具並做住宅原型。"
  ja: "5日間のゼロエネルギー・マスカスタム住宅ワークショップで、省エネシミュレーションと試作を行う。"
  ko: "제로에너지 대량맞춤 주택 5일 워크숍으로, 에너지 시뮬레이션과 주택 프로토타입을 만듭니다."
  vi: "Workshop 5 ngày về nhà ở năng lượng bằng không, dùng công cụ mô phỏng và làm nguyên mẫu."
  ms: "Bengkel 5 hari perumahan sifar tenaga, dengan alat simulasi tenaga dan prototaip rumah."
  id: "Lokakarya 5 hari rumah nol energi, dengan alat simulasi energi dan prototipe rumah."
  hi: "ज़ीरो-एनर्जी मास-कस्टम हाउसिंग पर 5 दिन की वर्कशॉप, ऊर्जा सिमुलेशन और हाउसिंग प्रोटोटाइप।"
outcomes:
  - en: "Design low-energy, inclusive housing"
    zh: "设计低能耗、包容性住宅"
    zh-TW: "設計低耗能、包容性住宅"
    ja: "省エネで誰もが使える住宅を設計する"
    ko: "저에너지·포용적 주택 설계하기"
    vi: "Thiết kế nhà ít tiêu thụ năng lượng, hòa nhập"
    ms: "Mereka rumah rendah tenaga dan inklusif"
    id: "Mendesain rumah hemat energi dan inklusif"
    hi: "कम-ऊर्जा, समावेशी आवास डिज़ाइन करना"
  - en: "Apply cost-saving housing strategies"
    zh: "运用降低住宅成本的策略"
    zh-TW: "運用降低住宅成本的策略"
    ja: "住宅のコスト削減策を使う"
    ko: "주택 비용 절감 전략 적용하기"
    vi: "Áp dụng chiến lược giảm chi phí nhà ở"
    ms: "Menggunakan strategi penjimatan kos rumah"
    id: "Menerapkan strategi hemat biaya rumah"
    hi: "आवास लागत घटाने की रणनीतियाँ लागू करना"
