code: SPAN30021
year: 2026
learn:
  en: "An overview of Latin America's history, politics and cultures, from colonial times to today."
  zh: "拉丁美洲从殖民时期到今天的历史、政治和文化概览。"
  zh-TW: "拉丁美洲從殖民時期到今天的歷史、政治和文化概覽。"
  ja: "植民地時代から現在までのラテンアメリカの歴史・政治・文化の概観。"
  ko: "식민지 시대부터 오늘날까지 라틴아메리카의 역사·정치·문화 개관."
  vi: "Tổng quan lịch sử, chính trị và văn hóa Mỹ Latinh từ thời thuộc địa đến nay."
  ms: "Gambaran sejarah, politik dan budaya Amerika Latin dari zaman penjajahan hingga kini."
  id: "Gambaran sejarah, politik dan budaya Amerika Latin dari masa kolonial hingga kini."
  hi: "औपनिवेशिक काल से आज तक लैटिन अमेरिका के इतिहास, राजनीति और संस्कृतियों का परिचय।"
outcomes:
  - en: "Outline key events in Latin American history"
    zh: "概述拉美历史上的重要事件"
    zh-TW: "概述拉美歷史上的重要事件"
    ja: "ラテンアメリカ史の主な出来事を説明する"
    ko: "라틴아메리카 역사의 주요 사건 설명하기"
    vi: "Nêu các sự kiện chính của lịch sử Mỹ Latinh"
    ms: "Huraikan peristiwa utama sejarah Amerika Latin"
    id: "Menguraikan peristiwa penting sejarah Amerika Latin"
    hi: "लैटिन अमेरिकी इतिहास की मुख्य घटनाएँ बताना"
  - en: "Compare cultures across the region"
    zh: "比较该地区不同国家的文化"
    zh-TW: "比較該地區不同國家的文化"
    ja: "地域内の文化を比べる"
    ko: "지역 내 여러 문화 비교하기"
    vi: "So sánh các nền văn hóa trong khu vực"
    ms: "Bandingkan budaya di seluruh rantau"
    id: "Membandingkan budaya di seluruh kawasan"
    hi: "इस क्षेत्र की संस्कृतियों की तुलना करना"
  - en: "Present on a Latin American topic in Spanish"
    zh: "用西班牙语就拉美话题做报告"
    zh-TW: "用西班牙語就拉美話題做報告"
    ja: "ラテンアメリカの話題をスペイン語で発表する"
    ko: "라틴아메리카 주제로 스페인어 발표하기"
    vi: "Thuyết trình về chủ đề Mỹ Latinh bằng tiếng Tây Ban Nha"
    ms: "Bentang topik Amerika Latin dalam bahasa Sepanyol"
    id: "Presentasi topik Amerika Latin dalam bahasa Spanyol"
    hi: "लैटिन अमेरिकी विषय पर स्पेनिश में प्रस्तुति देना"
