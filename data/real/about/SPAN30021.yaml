code: SPAN30021
year: 2026
learn:
  en: "Latin American societies, economies and politics, and how the region deals with globalisation and China. Taught in English."
  zh: "拉美的社会、经济与政治，以及该地区如何应对全球化和中国。英语授课。"
  zh-TW: "拉美的社會、經濟與政治，以及該地區如何面對全球化和中國。英語授課。"
  ja: "ラテンアメリカの社会・経済・政治と、グローバル化や中国との関わり。英語で授業。"
  ko: "라틴아메리카의 사회·경제·정치, 그리고 세계화와 중국에 대한 대응. 영어 강의."
  vi: "Xã hội, kinh tế, chính trị Mỹ Latinh và cách khu vực ứng phó toàn cầu hóa, Trung Quốc. Dạy bằng tiếng Anh."
  ms: "Masyarakat, ekonomi dan politik Amerika Latin, serta respons rantau terhadap globalisasi dan China. Diajar dalam bahasa Inggeris."
  id: "Masyarakat, ekonomi dan politik Amerika Latin, serta respons kawasan terhadap globalisasi dan Tiongkok. Diajar dalam bahasa Inggris."
  hi: "लैटिन अमेरिका के समाज, अर्थव्यवस्था और राजनीति, और वैश्वीकरण व चीन से उसका रिश्ता। अंग्रेज़ी में।"
outcomes:
  - en: "Outline the region's history and cultures"
    zh: "概述该地区的历史和文化"
    zh-TW: "概述該地區的歷史和文化"
    ja: "地域の歴史と文化を説明する"
    ko: "지역의 역사와 문화 개관하기"
    vi: "Nêu khái quát lịch sử và văn hóa khu vực"
    ms: "Huraikan sejarah dan budaya rantau ini"
    id: "Menguraikan sejarah dan budaya kawasan ini"
    hi: "इस क्षेत्र का इतिहास और संस्कृतियाँ बताना"
  - en: "Explain how Latin America engages with the world"
    zh: "说明拉美如何与世界打交道"
    zh-TW: "說明拉美如何與世界往來"
    ja: "ラテンアメリカと世界との関わりを説明する"
    ko: "라틴아메리카가 세계와 관계 맺는 방식 설명하기"
    vi: "Giải thích Mỹ Latinh giao lưu với thế giới ra sao"
    ms: "Terangkan cara Amerika Latin berhubung dengan dunia"
    id: "Menjelaskan cara Amerika Latin terlibat dengan dunia"
    hi: "लैटिन अमेरिका दुनिया से कैसे जुड़ता है, समझाना"
  - en: "Analyse a country through a case study"
    zh: "通过案例研究分析一个国家"
    zh-TW: "透過案例研究分析一個國家"
    ja: "事例研究で一つの国を分析する"
    ko: "사례 연구로 한 나라 분석하기"
    vi: "Phân tích một quốc gia qua nghiên cứu tình huống"
    ms: "Analisis sebuah negara melalui kajian kes"
    id: "Menganalisis satu negara lewat studi kasus"
    hi: "केस स्टडी से किसी देश का विश्लेषण करना"
