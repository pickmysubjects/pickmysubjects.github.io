code: ORAL20001
year: 2026
learn:
  en: "Plan and run oral health education, learn health promotion principles, and handle ethics and research in practice."
  zh: "规划并开展口腔健康教育，学习健康促进原则，并处理实践中的伦理与研究问题。"
  zh-TW: "規劃並推行口腔健康教育，學習健康促進原則，並處理實務中的倫理與研究問題。"
  ja: "口腔保健教育の計画と実施、健康増進の原則、実践での倫理と研究を学ぶ。"
  ko: "구강 보건 교육 계획·실행, 건강 증진 원칙, 실무 속 윤리와 연구를 배운다."
  vi: "Lập và triển khai giáo dục sức khỏe răng miệng, nguyên tắc nâng cao sức khỏe, đạo đức."
  ms: "Rancang pendidikan kesihatan mulut, prinsip promosi kesihatan, etika dan penyelidikan."
  id: "Merancang edukasi kesehatan mulut, prinsip promosi kesehatan, etika, dan riset."
  hi: "मुख-स्वास्थ्य शिक्षा की योजना, स्वास्थ्य संवर्धन के सिद्धांत, नैतिकता और शोध।"
outcomes:
  - en: "Design a health education lesson"
    zh: "设计健康教育课"
    zh-TW: "設計健康教育課"
    ja: "健康教育の授業を設計する"
    ko: "보건 교육 수업 설계하기"
    vi: "Thiết kế bài giáo dục sức khỏe"
    ms: "Reka pelajaran pendidikan kesihatan"
    id: "Merancang pelajaran edukasi kesehatan"
    hi: "स्वास्थ्य शिक्षा पाठ बनाना"
  - en: "Apply health promotion principles"
    zh: "运用健康促进原则"
    zh-TW: "運用健康促進原則"
    ja: "健康増進の原則を使う"
    ko: "건강 증진 원칙 적용하기"
    vi: "Áp dụng nguyên tắc nâng cao sức khỏe"
    ms: "Guna prinsip promosi kesihatan"
    id: "Menerapkan prinsip promosi kesehatan"
    hi: "स्वास्थ्य संवर्धन सिद्धांत लागू करना"
  - en: "Reason through ethical issues in practice"
    zh: "思考实践中的伦理问题"
    zh-TW: "思考實務中的倫理問題"
    ja: "実践での倫理的問題を考える"
    ko: "실무 속 윤리 문제 따져보기"
    vi: "Lập luận về vấn đề đạo đức"
    ms: "Fikir isu etika dalam amalan"
    id: "Menalar isu etika dalam praktik"
    hi: "व्यवहार में नैतिक मुद्दों पर सोचना"
