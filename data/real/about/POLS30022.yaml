code: POLS30022
year: 2026
learn:
  en: "The politics behind global environmental problems: who holds power, how well global efforts work, and what fairness demands."
  zh: "全球环境问题背后的政治：谁掌握权力、全球应对效果如何，以及公平与可持续发展要求什么。"
  zh-TW: "全球環境問題背後的政治：誰掌握權力、全球因應成效如何，以及公平與永續發展要求什麼。"
  ja: "地球環境問題の背後にある政治、誰が力を持つのか、国際的な取り組みはどれほど機能しているのか、公正と持続可能性が何を求めるのかを学ぶ。"
  ko: "지구 환경 문제 뒤의 정치, 누가 권력을 쥐는지, 국제적 대응이 얼마나 효과적인지, 공정과 지속 가능성이 무엇을 요구하는지 배운다."
  vi: "Chính trị đằng sau các vấn đề môi trường toàn cầu: ai nắm quyền, nỗ lực toàn cầu hiệu quả đến đâu, và công bằng, bền vững đòi hỏi gì."
  ms: "Politik di sebalik masalah alam sekitar global: siapa berkuasa, sejauh mana usaha global berkesan, dan apa tuntutan keadilan serta kelestarian."
  id: "Politik di balik masalah lingkungan global: siapa yang berkuasa, seberapa efektif upaya global, dan apa tuntutan keadilan serta keberlanjutan."
  hi: "वैश्विक पर्यावरण समस्याओं के पीछे की राजनीति: ताकत किसके पास है, वैश्विक प्रयास कितने कारगर हैं, और न्याय व स्थिरता क्या माँगते हैं।"
outcomes:
  - en: "Explain the political roots of environmental problems"
    zh: "说明环境问题的政治根源"
    zh-TW: "說明環境問題的政治根源"
    ja: "環境問題の政治的な根を説明する"
    ko: "환경 문제의 정치적 뿌리 설명하기"
    vi: "Giải thích gốc rễ chính trị của các vấn đề môi trường"
    ms: "Terangkan akar politik masalah alam sekitar"
    id: "Menjelaskan akar politik masalah lingkungan"
    hi: "पर्यावरण समस्याओं की राजनीतिक जड़ें समझाना"
  - en: "Judge how well global environmental action works"
    zh: "评判全球环境行动的实际效果"
    zh-TW: "評判全球環境行動的實際成效"
    ja: "国際的な環境対策の効果を判断する"
    ko: "국제 환경 대응의 효과 판단하기"
    vi: "Đánh giá hành động môi trường toàn cầu hiệu quả đến đâu"
    ms: "Nilai keberkesanan tindakan alam sekitar global"
    id: "Menilai efektivitas aksi lingkungan global"
    hi: "परखना कि वैश्विक पर्यावरण कार्रवाई कितनी कारगर है"
  - en: "Reflect on justice and sustainability questions"
    zh: "思考公平与可持续性问题"
    zh-TW: "思考公平與永續性問題"
    ja: "正義と持続可能性の問いについて考える"
    ko: "정의와 지속 가능성의 문제 성찰하기"
    vi: "Suy ngẫm về công bằng và bền vững"
    ms: "Renung persoalan keadilan dan kelestarian"
    id: "Merenungkan soal keadilan dan keberlanjutan"
    hi: "न्याय और स्थिरता के सवालों पर विचार करना"
