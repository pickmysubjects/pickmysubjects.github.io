code: ECON30007
year: 2026
learn:
  en: "Why and how governments intervene in food and farming, and what that means for trade and food security."
  zh: "政府为何及如何干预粮食与农业，以及这对贸易和粮食安全的影响。"
  zh-TW: "政府為何及如何介入糧食與農業，以及這對貿易和糧食安全的影響。"
  ja: "政府が食料と農業になぜどう介入するのか、それが貿易と食料安全保障に与える影響。"
  ko: "정부가 식량·농업에 개입하는 이유와 방식, 무역과 식량안보에 미치는 영향."
  vi: "Vì sao và cách chính phủ can thiệp vào lương thực, nông nghiệp, và tác động đến thương mại, an ninh lương thực."
  ms: "Mengapa dan cara kerajaan campur tangan dalam makanan dan pertanian, serta kesannya pada dagangan dan keselamatan makanan."
  id: "Mengapa dan cara pemerintah campur tangan di pangan dan pertanian, serta dampaknya pada perdagangan dan ketahanan pangan."
  hi: "सरकारें खाद्य और खेती में क्यों और कैसे दखल देती हैं, और इसका व्यापार व खाद्य सुरक्षा पर असर।"
outcomes:
  - en: "Analyse the trade and welfare effects of farm policies"
    zh: "分析农业政策对贸易和福利的影响"
    zh-TW: "分析農業政策對貿易和福利的影響"
    ja: "農業政策の貿易・厚生への影響を分析する"
    ko: "농업정책의 무역·후생 효과 분석"
    vi: "Phân tích tác động thương mại và phúc lợi của chính sách nông nghiệp"
    ms: "Analisis kesan dagangan dan kebajikan dasar pertanian"
    id: "Menganalisis efek dagang dan kesejahteraan kebijakan pertanian"
    hi: "कृषि नीतियों का व्यापार और कल्याण पर असर परखना"
  - en: "Discuss world food security and food price swings"
    zh: "讨论全球粮食安全和粮价波动"
    zh-TW: "討論全球糧食安全和糧價波動"
    ja: "世界の食料安全保障と食料価格の変動を論じる"
    ko: "세계 식량안보와 식량 가격 변동 논의"
    vi: "Bàn về an ninh lương thực thế giới và biến động giá"
    ms: "Bincang keselamatan makanan dunia dan turun naik harga makanan"
    id: "Membahas ketahanan pangan dunia dan gejolak harga pangan"
    hi: "विश्व खाद्य सुरक्षा और खाद्य कीमतों के उतार-चढ़ाव पर चर्चा"
  - en: "Explain where agriculture stands in WTO talks"
    zh: "解释农业在世贸谈判中的位置"
    zh-TW: "解釋農業在WTO談判中的位置"
    ja: "WTO交渉での農業の位置づけを説明する"
    ko: "WTO 협상에서 농업의 위치 설명"
    vi: "Giải thích vị trí của nông nghiệp trong đàm phán WTO"
    ms: "Terangkan kedudukan pertanian dalam rundingan WTO"
    id: "Menjelaskan posisi pertanian dalam perundingan WTO"
    hi: "WTO वार्ता में कृषि की स्थिति समझाना"
