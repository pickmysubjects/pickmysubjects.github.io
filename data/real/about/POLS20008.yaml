code: POLS20008
year: 2026
learn:
  en: "How public policy actually gets made, who influences it beyond government, and why some groups gain more from it than others."
  zh: "公共政策实际上是怎么制定的，政府以外还有谁在影响它，以及为什么一些群体比别人获益更多。"
  zh-TW: "公共政策實際上是怎麼制定的，政府以外還有誰在影響它，以及為什麼一些群體比別人獲益更多。"
  ja: "公共政策が実際にどう作られるのか、政府以外に誰が影響しているのか、なぜ一部の集団がより得をするのかを学ぶ。"
  ko: "공공 정책이 실제로 어떻게 만들어지는지, 정부 밖에서 누가 영향을 주는지, 왜 어떤 집단이 더 이득을 보는지 배운다."
  vi: "Chính sách công thực sự được làm ra thế nào, ngoài chính phủ còn ai tác động, và vì sao có nhóm được lợi hơn nhóm khác."
  ms: "Bagaimana dasar awam sebenarnya dibuat, siapa selain kerajaan yang mempengaruhinya, dan kenapa sesetengah kumpulan lebih beruntung."
  id: "Bagaimana kebijakan publik sebenarnya dibuat, siapa selain pemerintah yang memengaruhinya, dan kenapa sebagian kelompok lebih diuntungkan."
  hi: "सार्वजनिक नीति असल में कैसे बनती है, सरकार के अलावा कौन उस पर असर डालता है, और कुछ समूहों को दूसरों से ज़्यादा फ़ायदा क्यों मिलता है।"
outcomes:
  - en: "Explain the stages and actors in policy making"
    zh: "说明政策制定的各个阶段和参与者"
    zh-TW: "說明政策制定的各個階段和參與者"
    ja: "政策形成の段階と関係者を説明する"
    ko: "정책 결정의 단계와 행위자 설명하기"
    vi: "Giải thích các giai đoạn và chủ thể trong hoạch định chính sách"
    ms: "Terangkan peringkat dan pelaku dalam penggubalan dasar"
    id: "Menjelaskan tahap dan aktor dalam pembuatan kebijakan"
    hi: "नीति बनाने के चरण और उसमें शामिल लोग समझाना"
  - en: "Analyse real cases of policy success and failure"
    zh: "分析政策成功与失败的真实案例"
    zh-TW: "分析政策成功與失敗的真實案例"
    ja: "政策の成功例と失敗例を分析する"
    ko: "정책 성공과 실패의 실제 사례 분석하기"
    vi: "Phân tích các trường hợp chính sách thành công và thất bại"
    ms: "Analisis kes sebenar kejayaan dan kegagalan dasar"
    id: "Menganalisis kasus nyata kebijakan yang berhasil dan gagal"
    hi: "नीतियों की सफलता और असफलता के असली मामलों का विश्लेषण करना"
  - en: "Assess who wins and who loses from a policy"
    zh: "评估一项政策让谁受益、让谁受损"
    zh-TW: "評估一項政策讓誰受益、讓誰受損"
    ja: "政策で誰が得をし誰が損をするか評価する"
    ko: "정책으로 누가 이익을 보고 손해를 보는지 평가하기"
    vi: "Đánh giá ai được và ai mất từ một chính sách"
    ms: "Nilai siapa untung dan siapa rugi daripada sesuatu dasar"
    id: "Menilai siapa yang untung dan rugi dari suatu kebijakan"
    hi: "आकलन करना कि किसी नीति से किसे फ़ायदा और किसे नुकसान होता है"
