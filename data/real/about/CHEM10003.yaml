code: CHEM10003
year: 2026
learn:
  en: "First-year general chemistry: atoms, bonding, gases, energy, equilibrium, acids and bases, and carbon compounds."
  zh: "大一普通化学：原子、化学键、气体、能量、平衡、酸碱和有机物。"
  zh-TW: "大一普通化學：原子、化學鍵、氣體、能量、平衡、酸鹼和有機物。"
  ja: "1年次の一般化学：原子、結合、気体、エネルギー、平衡、酸と塩基、炭素化合物。"
  ko: "1학년 일반화학: 원자, 결합, 기체, 에너지, 평형, 산과 염기, 탄소 화합물."
  vi: "Hóa đại cương năm nhất: nguyên tử, liên kết, khí, năng lượng, cân bằng, axit-bazơ và hợp chất cacbon."
  ms: "Kimia am tahun pertama: atom, ikatan, gas, tenaga, keseimbangan, asid dan bes, serta sebatian karbon."
  id: "Kimia dasar tahun pertama: atom, ikatan, gas, energi, kesetimbangan, asam-basa, dan senyawa karbon."
  hi: "फ़र्स्ट-ईयर जनरल केमिस्ट्री: परमाणु, बॉन्डिंग, गैसें, ऊर्जा, साम्य, अम्ल-क्षार और कार्बन यौगिक।"
outcomes:
  - en: "Do basic lab experiments and write reports"
    zh: "做基础实验并写实验报告"
    zh-TW: "做基礎實驗並寫實驗報告"
    ja: "基本的な実験をしてレポートを書く"
    ko: "기초 실험을 하고 보고서 쓰기"
    vi: "Làm thí nghiệm cơ bản và viết báo cáo"
    ms: "Buat eksperimen asas dan tulis laporan"
    id: "Melakukan eksperimen dasar dan menulis laporan"
    hi: "बेसिक लैब प्रयोग करना और रिपोर्ट लिखना"
  - en: "Handle and dispose of chemicals safely"
    zh: "安全处理和处置化学品"
    zh-TW: "安全處理和處置化學品"
    ja: "化学物質を安全に扱い廃棄する"
    ko: "화학물질을 안전하게 다루고 폐기하기"
    vi: "Xử lý và thải bỏ hóa chất an toàn"
    ms: "Kendali dan buang bahan kimia dengan selamat"
    id: "Menangani dan membuang bahan kimia dengan aman"
    hi: "रसायनों को सुरक्षित संभालना और निपटाना"
  - en: "Name carbon compounds and spot functional groups"
    zh: "给有机物命名、识别官能团"
    zh-TW: "為有機物命名、辨識官能基"
    ja: "炭素化合物に名前をつけ官能基を見分ける"
    ko: "탄소 화합물 명명하고 작용기 찾기"
    vi: "Gọi tên hợp chất cacbon và nhận ra nhóm chức"
    ms: "Namakan sebatian karbon dan kenal kumpulan berfungsi"
    id: "Menamai senyawa karbon dan mengenali gugus fungsi"
    hi: "कार्बन यौगिकों का नाम रखना और फ़ंक्शनल ग्रुप पहचानना"
