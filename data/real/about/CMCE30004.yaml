code: CMCE30004
year: 2026
learn:
  en: "Turning messy data like text, images and audio into insights about customers, staff and markets."
  zh: "把文本、图像、音频等杂乱数据变成关于顾客、员工和市场的洞察。"
  zh-TW: "把文字、影像、音訊等雜亂資料變成關於顧客、員工和市場的洞見。"
  ja: "テキスト・画像・音声などの非構造化データから顧客・従業員・市場を読み解く。"
  ko: "텍스트, 이미지, 오디오 같은 비정형 데이터로 고객·직원·시장 인사이트 얻기."
  vi: "Biến dữ liệu lộn xộn như văn bản, hình ảnh, âm thanh thành hiểu biết về khách hàng, nhân viên và thị trường."
  ms: "Tukar data tidak berstruktur seperti teks, imej dan audio jadi wawasan tentang pelanggan, pekerja dan pasaran."
  id: "Mengubah data tak terstruktur seperti teks, gambar, dan audio jadi wawasan soal pelanggan, karyawan, dan pasar."
  hi: "टेक्स्ट, इमेज और ऑडियो जैसे बिखरे डेटा से ग्राहकों, कर्मचारियों और बाज़ार की समझ बनाना।"
outcomes:
  - en: "Plan how to collect and clean unstructured data"
    zh: "规划非结构化数据的收集和清理"
    zh-TW: "規劃非結構化資料的蒐集與清理"
    ja: "非構造化データの収集と整形を計画する"
    ko: "비정형 데이터 수집·정제 계획 세우기"
    vi: "Lên kế hoạch thu thập và làm sạch dữ liệu phi cấu trúc"
    ms: "Rancang cara kumpul dan bersihkan data tidak berstruktur"
    id: "Merencanakan pengumpulan dan pembersihan data tak terstruktur"
    hi: "बिखरे डेटा को जुटाने और साफ़ करने की योजना बनाना"
  - en: "Explore and predict with text and other qualitative data"
    zh: "用文本等定性数据做探索和预测"
    zh-TW: "用文字等質性資料做探索和預測"
    ja: "テキストなど質的データで探索・予測する"
    ko: "텍스트 등 질적 데이터로 탐색·예측하기"
    vi: "Khám phá và dự đoán với văn bản và dữ liệu định tính"
    ms: "Teroka dan ramal dengan teks dan data kualitatif lain"
    id: "Mengeksplorasi dan memprediksi dengan teks dan data kualitatif"
    hi: "टेक्स्ट व अन्य गुणात्मक डेटा से खोज और अनुमान लगाना"
  - en: "Judge the risks of building tools on this kind of data"
    zh: "判断基于这类数据做工具的风险"
    zh-TW: "判斷以這類資料打造工具的風險"
    ja: "この種のデータで作るツールのリスクを判断する"
    ko: "이런 데이터로 도구를 만들 때의 위험 판단"
    vi: "Đánh giá rủi ro khi xây công cụ trên loại dữ liệu này"
    ms: "Nilai risiko bina alat atas data jenis ini"
    id: "Menilai risiko membangun alat dari data semacam ini"
    hi: "ऐसे डेटा पर टूल बनाने के जोखिम परखना"
