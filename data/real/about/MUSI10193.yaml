code: MUSI10193
year: 2026
learn:
  en: "Builds on Contextual Studies 1: jazz scales and how improvisers choose notes, through singing, playing and tests."
  zh: "在语境研究1的基础上：学习爵士音阶和即兴时如何选音，通过演唱、演奏和测验练习。"
  zh-TW: "在情境研究1的基礎上：學習爵士音階與即興時如何選音，透過演唱、演奏與測驗練習。"
  ja: "Contextual Studies 1の続き。ジャズのスケールと即興での音選びを、歌唱・演奏・テストで学ぶ。"
  ko: "Contextual Studies 1의 심화. 재즈 스케일과 즉흥 시 음 선택을 노래·연주·시험으로 익히기."
  vi: "Nối tiếp phần 1: thang âm jazz và cách chọn nốt khi ứng tấu, qua hát, chơi và bài kiểm tra."
  ms: "Lanjutan bahagian 1: skala jaz dan cara memilih not semasa improvisasi, melalui nyanyian dan ujian."
  id: "Lanjutan bagian 1: tangga nada jazz dan cara memilih nada saat improvisasi, lewat bernyanyi dan tes."
  hi: "भाग 1 का अगला चरण: जैज़ स्केल और इम्प्रोवाइज़ करते समय सुर चुनना; गाकर, बजाकर, टेस्ट से।"
outcomes:
  - en: "Use the main jazz scales"
    zh: "运用主要的爵士音阶"
    zh-TW: "運用主要的爵士音階"
    ja: "主なジャズスケールを使う"
    ko: "주요 재즈 스케일 활용하기"
    vi: "Dùng các thang âm jazz chính"
    ms: "Guna skala jaz utama"
    id: "Memakai tangga nada jazz utama"
    hi: "मुख्य जैज़ स्केल इस्तेमाल करना"
  - en: "Choose notes that fit the harmony"
    zh: "选择贴合和声的音"
    zh-TW: "選擇貼合和聲的音"
    ja: "和声に合う音を選ぶ"
    ko: "화성에 맞는 음 고르기"
    vi: "Chọn nốt hợp với hòa âm"
    ms: "Pilih not sesuai harmoni"
    id: "Memilih nada yang cocok dengan harmoni"
    hi: "हार्मनी से मेल खाते सुर चुनना"
  - en: "Sing and play harmonic structures"
    zh: "演唱并演奏和声结构"
    zh-TW: "演唱並演奏和聲結構"
    ja: "和声構造を歌い、演奏する"
    ko: "화성 구조를 노래하고 연주하기"
    vi: "Hát và chơi cấu trúc hòa âm"
    ms: "Nyanyi dan main struktur harmoni"
    id: "Menyanyikan dan memainkan struktur harmoni"
    hi: "हार्मनी संरचनाएँ गाना और बजाना"
