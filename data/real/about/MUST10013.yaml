code: MUST10013
year: 2026
learn:
  en: "Music theatre history from the 1900s to the 1960s, plus music theory, aural and musicianship basics."
  zh: "1900到1960年代的音乐剧史，加上乐理、听力与音乐基础。"
  zh-TW: "1900 到 1960 年代的音樂劇史，加上樂理、聽力與音樂基礎。"
  ja: "1900〜60年代のミュージカル史と、音楽理論・聴音・音楽性の基礎。"
  ko: "1900~1960년대 뮤지컬 역사와 음악 이론·청음·음악성 기초."
  vi: "Lịch sử nhạc kịch từ 1900 đến 1960, cùng nhạc lý, nghe và nền tảng âm nhạc."
  ms: "Sejarah teater muzikal 1900-an hingga 1960-an, serta asas teori muzik dan pendengaran."
  id: "Sejarah teater musikal 1900-an hingga 1960-an, plus dasar teori musik dan pendengaran."
  hi: "1900 से 1960 के दशक तक म्यूज़िकल थिएटर का इतिहास, साथ में संगीत-सिद्धांत की बुनियाद।"
outcomes:
  - en: "Read and use basic music theory"
    zh: "读懂并运用基础乐理"
    zh-TW: "讀懂並運用基礎樂理"
    ja: "基礎的な音楽理論を読み使う"
    ko: "기초 음악 이론 읽고 쓰기"
    vi: "Đọc và dùng nhạc lý cơ bản"
    ms: "Baca dan guna teori muzik asas"
    id: "Membaca dan memakai teori musik dasar"
    hi: "बुनियादी संगीत-सिद्धांत पढ़ना और उपयोग करना"
  - en: "Place musicals in their social context"
    zh: "把音乐剧放回社会背景"
    zh-TW: "把音樂劇放回社會背景"
    ja: "ミュージカルを社会的文脈に置く"
    ko: "뮤지컬을 사회적 맥락에 놓기"
    vi: "Đặt nhạc kịch vào bối cảnh xã hội"
    ms: "Letak muzikal dalam konteks sosial"
    id: "Menempatkan musikal dalam konteks sosial"
    hi: "म्यूज़िकल को सामाजिक संदर्भ में रखना"
  - en: "Sit a written theory exam"
    zh: "参加乐理笔试"
    zh-TW: "參加樂理筆試"
    ja: "理論の筆記試験を受ける"
    ko: "이론 필기시험 치르기"
    vi: "Làm bài thi viết về nhạc lý"
    ms: "Duduki peperiksaan bertulis teori"
    id: "Mengikuti ujian tulis teori"
    hi: "सिद्धांत की लिखित परीक्षा देना"
