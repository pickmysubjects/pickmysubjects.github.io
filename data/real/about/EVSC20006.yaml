code: EVSC20006
year: 2026
learn:
  en: "The physics and chemistry of fossil, renewable and nuclear energy, and their environmental and social costs."
  zh: "化石、可再生和核能的物理与化学原理，以及其环境和社会代价。"
  zh-TW: "化石、再生和核能的物理與化學原理，以及其環境和社會代價。"
  ja: "化石・再生可能・原子力エネルギーの物理と化学、そして環境・社会的コスト。"
  ko: "화석·재생·원자력 에너지의 물리·화학 원리와 환경·사회적 비용."
  vi: "Vật lý và hóa học của năng lượng hóa thạch, tái tạo và hạt nhân, cùng chi phí môi trường, xã hội."
  ms: "Fizik dan kimia tenaga fosil, boleh baharu dan nuklear, serta kos alam sekitar dan sosialnya."
  id: "Fisika dan kimia energi fosil, terbarukan, dan nuklir, serta biaya lingkungan dan sosialnya."
  hi: "जीवाश्म, नवीकरणीय और परमाणु ऊर्जा का भौतिकी-रसायन, और उनकी पर्यावरणीय व सामाजिक कीमत।"
outcomes:
  - en: "Estimate a city's energy resource needs"
    zh: "估算城市的能源资源需求"
    zh-TW: "估算城市的能源資源需求"
    ja: "都市に必要なエネルギー資源を見積もる"
    ko: "도시의 에너지 자원 수요를 추정한다"
    vi: "Ước tính nhu cầu năng lượng của thành phố"
    ms: "Anggar keperluan sumber tenaga bandar"
    id: "Memperkirakan kebutuhan energi sebuah kota"
    hi: "शहर की ऊर्जा संसाधन ज़रूरत का अनुमान"
  - en: "Weigh energy sources' environmental impacts"
    zh: "权衡各能源的环境影响"
    zh-TW: "權衡各能源的環境影響"
    ja: "各エネルギー源の環境影響を比較する"
    ko: "에너지원별 환경 영향을 비교한다"
    vi: "Cân nhắc tác động môi trường của nguồn năng lượng"
    ms: "Timbang kesan alam sekitar sumber tenaga"
    id: "Menimbang dampak lingkungan sumber energi"
    hi: "ऊर्जा स्रोतों के पर्यावरणीय प्रभाव तौलना"
