code: ABPL90293
year: 2027
learn:
  en: "Steel and composite building systems for mid-rise buildings: framing, slabs, basements, piling, tilt-up and precast construction."
  zh: "中低层建筑的钢结构与组合结构体系：框架、楼板、地下室、桩基、预制和翻转墙施工。"
  zh-TW: "中低層建築的鋼構與複合構造系統：框架、樓板、地下室、樁基、預鑄與傾斜牆施工。"
  ja: "中低層建物の鉄骨・合成構造：骨組み、床、地下、杭、ティルトアップ、プレキャスト。"
  ko: "중저층 건물의 철골·합성 구조: 골조, 슬래브, 지하, 말뚝, 틸트업, 프리캐스트."
  vi: "Hệ kết cấu thép và liên hợp cho nhà trung tầng: khung, sàn, tầng hầm, cọc, đúc sẵn."
  ms: "Sistem binaan keluli dan komposit: kerangka, papak, ruang bawah tanah, cerucuk dan pratuang."
  id: "Sistem baja dan komposit untuk gedung menengah: rangka, pelat, basement, tiang pancang dan pracetak."
  hi: "मध्यम ऊँचाई इमारतों के स्टील और कम्पोज़िट सिस्टम: फ़्रेम, स्लैब, बेसमेंट, पाइलिंग, प्रीकास्ट।"
outcomes:
  - en: "Choose a structural system to suit a project"
    zh: "为项目选择合适的结构体系"
    zh-TW: "為專案選擇合適的結構系統"
    ja: "プロジェクトに合う構造形式を選ぶ"
    ko: "프로젝트에 맞는 구조 시스템 고르기"
    vi: "Chọn hệ kết cấu phù hợp dự án"
    ms: "Memilih sistem struktur yang sesuai projek"
    id: "Memilih sistem struktur sesuai proyek"
    hi: "परियोजना के लिए उपयुक्त संरचना प्रणाली चुनना"
  - en: "Propose a construction sequence for a building"
    zh: "为建筑提出施工顺序"
    zh-TW: "為建築提出施工順序"
    ja: "建物の施工手順を提案する"
    ko: "건물의 시공 순서 제안하기"
    vi: "Đề xuất trình tự thi công cho tòa nhà"
    ms: "Mencadang urutan pembinaan bangunan"
    id: "Mengusulkan urutan konstruksi bangunan"
    hi: "इमारत के लिए निर्माण क्रम सुझाना"
