code: ENGL30048
year: 2026
learn:
  en: "Performance on stage, in public, online and in daily life, and how it reflects and shapes the world around us."
  zh: "舞台、公共空间、网络和日常生活中的表演，以及它如何反映并塑造周围的世界。"
  zh-TW: "舞台、公共空間、網路和日常生活中的表演，以及它如何反映並塑造周圍的世界。"
  ja: "舞台・公共空間・ネット・日常のパフォーマンスと、それが世界をどう映し形づくるかを学ぶ。"
  ko: "무대·공공장소·온라인·일상 속 퍼포먼스가 세상을 어떻게 비추고 만드는지 배운다."
  vi: "Trình diễn trên sân khấu, nơi công cộng, trên mạng và trong đời thường, và cách nó phản ánh, định hình thế giới."
  ms: "Persembahan di pentas, di khalayak, dalam talian dan kehidupan harian, serta cara ia mencerminkan dan membentuk dunia."
  id: "Pertunjukan di panggung, ruang publik, daring dan keseharian, serta cara ia mencerminkan dan membentuk dunia."
  hi: "मंच, सार्वजनिक जगहों, ऑनलाइन और रोज़मर्रा में प्रदर्शन, और यह हमारे आसपास की दुनिया को कैसे दिखाता और गढ़ता है।"
outcomes:
  - en: "Apply theatre studies ideas to many kinds of performance"
    zh: "把戏剧研究的观点用于各类表演"
    zh-TW: "把戲劇研究的觀點用於各類表演"
    ja: "演劇学の考えを様々なパフォーマンスに当てはめる"
    ko: "연극학 개념을 여러 퍼포먼스에 적용하기"
    vi: "Áp dụng ý tưởng nghiên cứu sân khấu cho nhiều loại trình diễn"
    ms: "Gunakan idea kajian teater pada pelbagai persembahan"
    id: "Menerapkan gagasan kajian teater pada berbagai pertunjukan"
    hi: "रंगमंच अध्ययन के विचार कई तरह के प्रदर्शनों पर लागू करना"
  - en: "Analyse performance used for activism"
    zh: "分析用于社会运动的表演"
    zh-TW: "分析用於社會運動的表演"
    ja: "社会運動に使われるパフォーマンスを分析する"
    ko: "사회 운동에 쓰인 퍼포먼스 분석하기"
    vi: "Phân tích trình diễn dùng cho hoạt động xã hội"
    ms: "Analisis persembahan untuk aktivisme"
    id: "Menganalisis pertunjukan untuk aktivisme"
    hi: "सक्रियता के लिए इस्तेमाल प्रदर्शन का विश्लेषण करना"
  - en: "Discuss how performance stages cultural difference"
    zh: "讨论表演如何呈现文化差异"
    zh-TW: "討論表演如何呈現文化差異"
    ja: "パフォーマンスが文化の違いをどう見せるか論じる"
    ko: "퍼포먼스가 문화 차이를 보여 주는 방식 논의하기"
    vi: "Thảo luận cách trình diễn thể hiện khác biệt văn hóa"
    ms: "Bincangkan cara persembahan memaparkan perbezaan budaya"
    id: "Membahas cara pertunjukan menampilkan perbedaan budaya"
    hi: "प्रदर्शन सांस्कृतिक अंतर को कैसे दिखाता है, चर्चा करना"
