code: FLTV30032
year: 2026
learn:
  en: "Develop the script for your graduate film in stages, pitch it as a director, and shape your filmmaking approach."
  zh: "分阶段开发毕业短片剧本，以导演身份推介，并形成自己的创作思路。"
  zh-TW: "分階段開發畢業短片劇本，以導演身分提案，並形成自己的創作思路。"
  ja: "卒業映画の脚本を段階的に練り、監督としてピッチし、自分の映画観を固める。"
  ko: "졸업 영화 각본을 단계별로 다듬고 감독으로 피칭하며 연출관을 세운다."
  vi: "Phát triển kịch bản phim tốt nghiệp theo từng bước, pitch với tư cách đạo diễn."
  ms: "Bangunkan skrip filem graduan berperingkat dan bentang sebagai pengarah."
  id: "Mengembangkan naskah film kelulusan bertahap dan mem-pitch sebagai sutradara."
  hi: "ग्रेजुएट फ़िल्म की स्क्रिप्ट चरणों में विकसित करना और निर्देशक के रूप में पिच करना।"
outcomes:
  - en: "Develop a short film script in stages"
    zh: "分阶段开发短片剧本"
    zh-TW: "分階段開發短片劇本"
    ja: "短編脚本を段階的に練る"
    ko: "단편 각본 단계별로 개발하기"
    vi: "Phát triển kịch bản ngắn theo từng bước"
    ms: "Bangunkan skrip filem pendek berperingkat"
    id: "Mengembangkan naskah film pendek bertahap"
    hi: "शॉर्ट फ़िल्म स्क्रिप्ट चरणों में विकसित करना"
  - en: "Record a director's pitch"
    zh: "录制一段导演推介"
    zh-TW: "錄製一段導演提案"
    ja: "監督としてのピッチを収録する"
    ko: "감독 피칭 영상 녹화하기"
    vi: "Quay một đoạn pitch của đạo diễn"
    ms: "Rakam pitch pengarah"
    id: "Merekam pitch sutradara"
    hi: "निर्देशक की पिच रिकॉर्ड करना"
  - en: "Write a screenplay or director's treatment"
    zh: "写剧本或导演阐述"
    zh-TW: "寫劇本或導演闡述"
    ja: "脚本または監督トリートメントを書く"
    ko: "각본 또는 연출 트리트먼트 쓰기"
    vi: "Viết kịch bản hoặc đề cương đạo diễn"
    ms: "Tulis skrip atau olahan pengarah"
    id: "Menulis naskah atau treatment sutradara"
    hi: "पटकथा या निर्देशक ट्रीटमेंट लिखना"
