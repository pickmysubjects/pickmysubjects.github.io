code: KORE30004
year: 2026
learn:
  en: "Korean for students who finished Korean 5: reading real texts and discussing social and cultural topics."
  zh: "适合学完韩语 5的学生：阅读真实材料，讨论社会和文化话题。"
  zh-TW: "適合學完韓語 5的學生：閱讀真實材料，討論社會和文化話題。"
  ja: "韓国語5を終えた学生向け。生の文章を読み、社会や文化の話題を話し合う。"
  ko: "한국어 5을(를) 마친 학생 대상. 실제 자료를 읽고 사회·문화 주제를 토론한다."
  vi: "tiếng Hàn cho sinh viên đã học xong tiếng Hàn 5: đọc tài liệu thật và thảo luận chủ đề xã hội, văn hóa."
  ms: "bahasa Korea untuk pelajar yang sudah tamat bahasa Korea 5: membaca teks sebenar dan membincangkan topik sosial dan budaya."
  id: "bahasa Korea untuk mahasiswa yang sudah lulus bahasa Korea 5: membaca teks asli dan membahas topik sosial dan budaya."
  hi: "कोरियाई 5 पूरा कर चुके छात्रों के लिए कोरियाई: असली पाठ पढ़ना और सामाजिक व सांस्कृतिक विषयों पर चर्चा।"
outcomes:
  - en: "Discuss social and cultural topics in Korean"
    zh: "用韩语讨论社会和文化话题"
    zh-TW: "用韓語討論社會和文化話題"
    ja: "社会や文化の話題を韓国語で話し合う"
    ko: "사회·문화 주제를 한국어로 토론하기"
    vi: "Thảo luận chủ đề xã hội, văn hóa bằng tiếng Hàn"
    ms: "Bincangkan topik sosial dan budaya dalam bahasa Korea"
    id: "Membahas topik sosial dan budaya dalam bahasa Korea"
    hi: "सामाजिक और सांस्कृतिक विषयों पर कोरियाई में चर्चा करना"
  - en: "Read and write longer Korean texts"
    zh: "读写较长的韩语文章"
    zh-TW: "讀寫較長的韓語文章"
    ja: "長めの韓国語の文章を読み書きする"
    ko: "긴 한국어 글 읽고 쓰기"
    vi: "Đọc và viết văn bản tiếng Hàn dài hơn"
    ms: "Baca dan tulis teks bahasa Korea yang lebih panjang"
    id: "Membaca dan menulis teks bahasa Korea yang lebih panjang"
    hi: "लंबे कोरियाई पाठ पढ़ना-लिखना"
  - en: "Give a clear presentation in Korean"
    zh: "用韩语做清楚的口头报告"
    zh-TW: "用韓語做清楚的口頭報告"
    ja: "韓国語で分かりやすく発表する"
    ko: "한국어로 명확하게 발표하기"
    vi: "Thuyết trình rõ ràng bằng tiếng Hàn"
    ms: "Buat pembentangan yang jelas dalam bahasa Korea"
    id: "Melakukan presentasi yang jelas dalam bahasa Korea"
    hi: "कोरियाई में स्पष्ट प्रस्तुति देना"
