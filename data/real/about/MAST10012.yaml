code: MAST10012
year: 2026
learn:
  en: "Builds up algebra, functions, probability and basic calculus to prepare for Calculus 1."
  zh: "补强代数、函数、概率和基础微积分，为微积分1做准备。"
  zh-TW: "加強代數、函數、機率和基礎微積分，為微積分1做準備。"
  ja: "微積分1に備えて、代数・関数・確率・基礎微積分を固める。"
  ko: "미적분 1을 대비해 대수, 함수, 확률, 기초 미적분을 다진다."
  vi: "Củng cố đại số, hàm số, xác suất và giải tích cơ bản để chuẩn bị cho Giải tích 1."
  ms: "Memperkukuh aljabar, fungsi, kebarangkalian dan kalkulus asas sebagai persediaan Kalkulus 1."
  id: "Memperkuat aljabar, fungsi, peluang, dan kalkulus dasar sebagai persiapan Kalkulus 1."
  hi: "कैलकुलस 1 की तैयारी के लिए अलजेब्रा, फ़ंक्शन, प्रायिकता और बेसिक कैलकुलस मज़बूत करना।"
outcomes:
  - en: "Sketch graphs of common functions"
    zh: "画常见函数的图像"
    zh-TW: "畫常見函數的圖形"
    ja: "よく使う関数のグラフを描く"
    ko: "주요 함수의 그래프 그리기"
    vi: "Vẽ đồ thị các hàm thường gặp"
    ms: "Lakar graf fungsi biasa"
    id: "Menggambar grafik fungsi umum"
    hi: "आम फ़ंक्शन के ग्राफ़ बनाना"
  - en: "Differentiate and integrate basic functions"
    zh: "对基本函数求导和积分"
    zh-TW: "對基本函數求導和積分"
    ja: "基本的な関数を微分・積分する"
    ko: "기본 함수의 미분과 적분"
    vi: "Đạo hàm và tích phân hàm cơ bản"
    ms: "Bezakan dan kamirkan fungsi asas"
    id: "Menurunkan dan mengintegralkan fungsi dasar"
    hi: "बेसिक फ़ंक्शन का अवकलन और समाकलन"
  - en: "Calculate binomial and normal probabilities"
    zh: "计算二项和正态分布概率"
    zh-TW: "計算二項和常態分布機率"
    ja: "二項分布と正規分布の確率を計算する"
    ko: "이항·정규분포 확률 계산"
    vi: "Tính xác suất nhị thức và chuẩn"
    ms: "Kira kebarangkalian binomial dan normal"
    id: "Menghitung peluang binomial dan normal"
    hi: "बाइनोमियल और नॉर्मल प्रायिकता निकालना"
