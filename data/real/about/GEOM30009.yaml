code: GEOM30009
year: 2026
learn:
  en: "Using satellite and aerial images to map land cover, vegetation, water and cities."
  zh: "用卫星和航拍图像绘制土地覆盖、植被、水体和城市。"
  zh-TW: "用衛星與空拍影像繪製土地覆蓋、植被、水體和城市。"
  ja: "衛星・航空画像で土地被覆、植生、水域、都市を地図化する。"
  ko: "위성·항공 영상으로 토지 피복, 식생, 수역, 도시를 지도화하기."
  vi: "Dùng ảnh vệ tinh và ảnh hàng không để lập bản đồ đất, thực vật, nước và đô thị."
  ms: "Guna imej satelit dan udara untuk memeta litupan tanah, tumbuhan, air dan bandar."
  id: "Memakai citra satelit dan udara untuk memetakan lahan, vegetasi, air, dan kota."
  hi: "सैटेलाइट और एरियल इमेज से ज़मीन, वनस्पति, पानी और शहरों का नक्शा बनाना।"
outcomes:
  - en: "Analyse image data to monitor environments"
    zh: "分析图像数据以监测环境"
    zh-TW: "分析影像資料以監測環境"
    ja: "画像データを分析して環境を監視する"
    ko: "영상 데이터로 환경 모니터링하기"
    vi: "Phân tích dữ liệu ảnh để giám sát môi trường"
    ms: "Menganalisis data imej untuk memantau persekitaran"
    id: "Menganalisis data citra untuk memantau lingkungan"
    hi: "इमेज डेटा से पर्यावरण की निगरानी करना"
  - en: "Make maps from information in images"
    zh: "根据图像信息制作地图"
    zh-TW: "根據影像資訊製作地圖"
    ja: "画像から得た情報で地図を作る"
    ko: "영상 정보로 지도 만들기"
    vi: "Tạo bản đồ từ thông tin trong ảnh"
    ms: "Membuat peta daripada maklumat imej"
    id: "Membuat peta dari informasi citra"
    hi: "इमेज की जानकारी से नक्शे बनाना"
