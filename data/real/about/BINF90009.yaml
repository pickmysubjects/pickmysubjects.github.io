code: BINF90009
year: 2027
learn:
  en: "An original computational bioinformatics research project, done under a supervisor."
  zh: "在导师指导下完成一个原创的计算生物信息学研究项目。"
  zh-TW: "在導師指導下完成一個原創的計算生物資訊學研究專題。"
  ja: "指導教員のもとで行う、独自の計算バイオインフォマティクス研究プロジェクト。"
  ko: "지도교수 아래에서 진행하는 독창적인 계산 생물정보학 연구 프로젝트."
  vi: "Một dự án nghiên cứu tin sinh học tính toán độc lập, có người hướng dẫn."
  ms: "Projek penyelidikan bioinformatik pengkomputeran yang asli, di bawah penyelia."
  id: "Proyek riset bioinformatika komputasional orisinal di bawah pembimbing."
  hi: "पर्यवेक्षक के मार्गदर्शन में एक मौलिक कम्प्यूटेशनल बायोइन्फ़ॉर्मेटिक्स शोध परियोजना।"
outcomes:
  - en: "Design and carry out a bioinformatics research project"
    zh: "设计并完成一个生物信息学研究项目"
    zh-TW: "設計並完成一個生物資訊學研究專題"
    ja: "バイオインフォ研究を計画し実行する"
    ko: "생물정보학 연구를 설계하고 수행하기"
    vi: "Thiết kế và thực hiện dự án nghiên cứu tin sinh học"
    ms: "Mereka bentuk dan menjalankan projek penyelidikan bioinformatik"
    id: "Merancang dan menjalankan proyek riset bioinformatika"
    hi: "बायोइन्फ़ॉर्मेटिक्स शोध परियोजना बनाना और पूरा करना"
  - en: "Build or apply bioinformatics tools to a research question"
    zh: "开发或运用生物信息学工具解决研究问题"
    zh-TW: "開發或運用生物資訊學工具解決研究問題"
    ja: "研究課題にバイオインフォのツールを作る・使う"
    ko: "연구 질문에 생물정보학 도구 개발·적용하기"
    vi: "Xây dựng hoặc áp dụng công cụ tin sinh học cho câu hỏi nghiên cứu"
    ms: "Membina atau menggunakan alat bioinformatik untuk soalan kajian"
    id: "Membangun atau memakai alat bioinformatika untuk pertanyaan riset"
    hi: "शोध प्रश्न पर बायोइन्फ़ॉर्मेटिक्स टूल बनाना या लगाना"
  - en: "Report the research in writing and in talks"
    zh: "以书面和口头方式汇报研究"
    zh-TW: "以書面與口頭方式報告研究"
    ja: "研究を文章と口頭で発表する"
    ko: "연구를 글과 발표로 전달하기"
    vi: "Trình bày nghiên cứu bằng văn bản và thuyết trình"
    ms: "Melaporkan kajian secara bertulis dan lisan"
    id: "Melaporkan riset secara tertulis dan lisan"
    hi: "शोध को लिखकर और बोलकर प्रस्तुत करना"
