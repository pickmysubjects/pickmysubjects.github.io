code: HORT20027
year: 2026
learn:
  en: "Growing and establishing plants in cities: seeds, propagation, nursery production, urban soils and planting."
  zh: "在城市里育苗种植：种子、繁殖、苗圃生产、城市土壤和栽种。"
  zh-TW: "在城市中育苗種植：種子、繁殖、苗圃生產、都市土壤與栽植。"
  ja: "都市での植物の育成と定着：種子、繁殖、苗生産、都市土壌、植栽。"
  ko: "도시에서 식물 기르고 정착시키기: 종자, 번식, 묘목 생산, 도시 토양, 식재."
  vi: "Trồng và gây dựng cây trong đô thị: hạt giống, nhân giống, vườn ươm, đất đô thị và trồng cây."
  ms: "Menanam dan menumbuhkan tumbuhan di bandar: benih, pembiakan, tapak semaian, tanah bandar dan penanaman."
  id: "Menanam dan membangun tanaman di kota: benih, perbanyakan, pembibitan, tanah perkotaan, penanaman."
  hi: "शहरों में पौधे उगाना और जमाना: बीज, प्रवर्धन, नर्सरी उत्पादन, शहरी मिट्टी और रोपण।"
outcomes:
  - en: "Propagate and establish landscape plants"
    zh: "繁殖并种植园林植物"
    zh-TW: "繁殖並栽植景觀植物"
    ja: "景観植物を繁殖・定着させる"
    ko: "조경 식물 번식 및 정착시키기"
    vi: "Nhân giống và trồng cây cảnh quan"
    ms: "Membiak dan menanam tumbuhan landskap"
    id: "Memperbanyak dan menanam tanaman lanskap"
    hi: "लैंडस्केप पौधों का प्रवर्धन और रोपण करना"
  - en: "Present data from plant propagation trials"
    zh: "展示植物繁殖实验的数据"
    zh-TW: "呈現植物繁殖實驗的數據"
    ja: "植物繁殖実験のデータを発表する"
    ko: "식물 번식 실험 데이터 발표"
    vi: "Trình bày dữ liệu thí nghiệm nhân giống"
    ms: "Bentangkan data ujian pembiakan tumbuhan"
    id: "Menyajikan data percobaan perbanyakan tanaman"
    hi: "पौध प्रवर्धन प्रयोगों का डेटा प्रस्तुत करना"
  - en: "Discuss challenges of managing urban plantings"
    zh: "讨论城市绿化管理的难点"
    zh-TW: "討論都市綠化管理的難處"
    ja: "都市植栽管理の課題を論じる"
    ko: "도시 식재 관리의 어려움 논의"
    vi: "Thảo luận khó khăn quản lý cây đô thị"
    ms: "Bincang cabaran mengurus tanaman bandar"
    id: "Membahas tantangan mengelola tanaman kota"
    hi: "शहरी पौधरोपण प्रबंधन की चुनौतियां बताना"
