code: ANTH20011
year: 2026
learn:
  en: "How ethnicity and nationalism form and clash, studied through one in-depth case plus examples from around the world."
  zh: "族群与民族主义如何形成与冲突，以一个深入案例加世界各地例子来学习。"
  zh-TW: "族群與民族主義如何形成與衝突，以一個深入案例加世界各地例子來學習。"
  ja: "民族性とナショナリズムがどう生まれ衝突するかを、一つの詳しい事例と世界各地の例から学ぶ。"
  ko: "민족성과 민족주의가 어떻게 형성되고 충돌하는지 한 가지 심층 사례와 세계 여러 예로 배운다."
  vi: "Sắc tộc và chủ nghĩa dân tộc hình thành và xung đột ra sao, qua một ca nghiên cứu sâu và ví dụ khắp thế giới."
  ms: "Cara etnik dan nasionalisme terbentuk dan bertembung, melalui satu kajian kes mendalam serta contoh dari seluruh dunia."
  id: "Cara etnisitas dan nasionalisme terbentuk dan berbenturan, lewat satu studi kasus mendalam dan contoh dari berbagai negara."
  hi: "जातीयता और राष्ट्रवाद कैसे बनते और टकराते हैं, एक गहन केस स्टडी और दुनिया भर के उदाहरणों से।"
outcomes:
  - en: "Compare theories of ethnicity and nationalism"
    zh: "比较族群与民族主义的理论"
    zh-TW: "比較族群與民族主義的理論"
    ja: "民族性とナショナリズムの理論を比べる"
    ko: "민족성과 민족주의 이론 비교하기"
    vi: "So sánh các lý thuyết về sắc tộc và chủ nghĩa dân tộc"
    ms: "Bandingkan teori etnik dan nasionalisme"
    id: "Membandingkan teori etnisitas dan nasionalisme"
    hi: "जातीयता और राष्ट्रवाद के सिद्धांतों की तुलना करना"
  - en: "Link nation-building to development and change"
    zh: "把国家建构与发展和变迁联系起来"
    zh-TW: "把國家建構與發展和變遷聯繫起來"
    ja: "国家形成を開発や変化と結びつける"
    ko: "국가 형성을 발전과 변화에 연결하기"
    vi: "Liên hệ việc xây dựng quốc gia với phát triển và biến đổi"
    ms: "Kaitkan pembinaan negara dengan pembangunan dan perubahan"
    id: "Mengaitkan pembangunan bangsa dengan pembangunan dan perubahan"
    hi: "राष्ट्र-निर्माण को विकास और बदलाव से जोड़ना"
  - en: "Analyse a real case of ethnic conflict"
    zh: "分析一个真实的族群冲突案例"
    zh-TW: "分析一個真實的族群衝突案例"
    ja: "民族紛争の実例を分析する"
    ko: "실제 민족 갈등 사례 분석하기"
    vi: "Phân tích một trường hợp xung đột sắc tộc thực tế"
    ms: "Analisis kes sebenar konflik etnik"
    id: "Menganalisis kasus nyata konflik etnis"
    hi: "जातीय संघर्ष के एक वास्तविक मामले का विश्लेषण करना"
