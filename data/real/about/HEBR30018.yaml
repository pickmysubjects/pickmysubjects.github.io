code: HEBR30018
year: 2026
learn:
  en: "Close reading of Israeli prose and poetry in different styles and registers, with regular speaking and writing practice."
  zh: "精读不同风格和语体的以色列小说与诗歌，持续练习口语和写作。"
  zh-TW: "精讀不同風格和語體的以色列小說與詩歌，持續練習口語和寫作。"
  ja: "さまざまな文体のイスラエルの小説と詩を精読し、話す・書く練習を続ける。"
  ko: "다양한 문체의 이스라엘 소설과 시를 정독하고 말하기·쓰기를 꾸준히 연습한다."
  vi: "Đọc kỹ văn xuôi và thơ Israel nhiều phong cách, kèm luyện nói và viết thường xuyên."
  ms: "Bacaan teliti prosa dan puisi Israel pelbagai gaya, dengan latihan bertutur dan menulis yang kerap."
  id: "Membaca cermat prosa dan puisi Israel beragam gaya, dengan latihan berbicara dan menulis rutin."
  hi: "अलग-अलग शैलियों की इज़राइली गद्य-कविता का गहन पाठ, नियमित बोलने और लिखने के अभ्यास के साथ।"
outcomes:
  - en: "Discuss social and cultural topics in Hebrew"
    zh: "用希伯来语讨论社会和文化话题"
    zh-TW: "用希伯來語討論社會和文化話題"
    ja: "社会や文化の話題をヘブライ語で話し合う"
    ko: "사회·문화 주제를 히브리어로 토론하기"
    vi: "Thảo luận chủ đề xã hội, văn hóa bằng tiếng Do Thái"
    ms: "Bincangkan topik sosial dan budaya dalam bahasa Ibrani"
    id: "Membahas topik sosial dan budaya dalam bahasa Ibrani"
    hi: "सामाजिक और सांस्कृतिक विषयों पर हिब्रू में चर्चा करना"
  - en: "Read and write longer Hebrew texts"
    zh: "读写较长的希伯来语文章"
    zh-TW: "讀寫較長的希伯來語文章"
    ja: "長めのヘブライ語の文章を読み書きする"
    ko: "긴 히브리어 글 읽고 쓰기"
    vi: "Đọc và viết văn bản tiếng Do Thái dài hơn"
    ms: "Baca dan tulis teks bahasa Ibrani yang lebih panjang"
    id: "Membaca dan menulis teks bahasa Ibrani yang lebih panjang"
    hi: "लंबे हिब्रू पाठ पढ़ना-लिखना"
  - en: "Give a clear presentation in Hebrew"
    zh: "用希伯来语做清楚的口头报告"
    zh-TW: "用希伯來語做清楚的口頭報告"
    ja: "ヘブライ語で分かりやすく発表する"
    ko: "히브리어로 명확하게 발표하기"
    vi: "Thuyết trình rõ ràng bằng tiếng Do Thái"
    ms: "Buat pembentangan yang jelas dalam bahasa Ibrani"
    id: "Melakukan presentasi yang jelas dalam bahasa Ibrani"
    hi: "हिब्रू में स्पष्ट प्रस्तुति देना"
