code: PLAN10002
year: 2026
learn:
  en: "What urban planners and designers do, and the drawing, writing and analysis skills to improve real places."
  zh: "城市规划与城市设计做什么，以及改善真实场所所需的绘图、写作与分析技能。"
  zh-TW: "都市計畫與都市設計做什麼，以及改善真實場所所需的繪圖、寫作與分析技能。"
  ja: "都市計画・都市デザインの仕事と、実際の場所を良くする作図・文章・分析の技能。"
  ko: "도시계획·도시설계가 하는 일과 실제 장소를 개선하는 도면·글쓰기·분석 능력."
  vi: "Nhà quy hoạch và thiết kế đô thị làm gì, cùng kỹ năng vẽ, viết, phân tích để cải thiện nơi chốn thật."
  ms: "Apa kerja perancang bandar, serta kemahiran melukis, menulis dan menganalisis untuk memperbaik tempat sebenar."
  id: "Apa kerja perencana dan perancang kota, plus keterampilan menggambar, menulis, dan analisis untuk memperbaiki tempat."
  hi: "शहरी प्लानर और डिज़ाइनर क्या करते हैं, और असली जगहें सुधारने के लिए ड्रॉइंग, लेखन, विश्लेषण।"
outcomes:
  - en: "Analyse an urban place and its problems"
    zh: "分析一个城市场所及其问题"
    zh-TW: "分析一個都市場所及其問題"
    ja: "都市の場所と課題を分析する"
    ko: "도시 장소와 문제 분석하기"
    vi: "Phân tích một nơi chốn đô thị và vấn đề của nó"
    ms: "Analisis tempat bandar dan masalahnya"
    id: "Menganalisis tempat di kota dan masalahnya"
    hi: "किसी शहरी जगह और उसकी समस्याओं का विश्लेषण"
  - en: "Draft a plan or policy for a place"
    zh: "为场所起草规划或政策"
    zh-TW: "為場所草擬計畫或政策"
    ja: "場所の計画や方針を作る"
    ko: "장소에 대한 계획·정책 초안 쓰기"
    vi: "Soạn kế hoạch hoặc chính sách cho một nơi"
    ms: "Draf pelan atau dasar untuk satu tempat"
    id: "Menyusun rencana atau kebijakan untuk suatu tempat"
    hi: "किसी जगह के लिए योजना या नीति बनाना"
  - en: "Communicate ideas with drawings and text"
    zh: "用图纸和文字表达构想"
    zh-TW: "用圖面和文字表達構想"
    ja: "図と文章でアイデアを伝える"
    ko: "도면과 글로 아이디어 전달하기"
    vi: "Truyền đạt ý tưởng bằng hình vẽ và chữ"
    ms: "Sampaikan idea dengan lukisan dan teks"
    id: "Menyampaikan ide lewat gambar dan teks"
    hi: "ड्रॉइंग और लेखन से विचार बताना"
