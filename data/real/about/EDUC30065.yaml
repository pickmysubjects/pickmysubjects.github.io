code: EDUC30065
year: 2026
learn:
  en: "How families are shaped by law, schools, medicine and the state, seen through feminist, gender and childhood studies."
  zh: "从女性主义、性别和童年研究看法律、学校、医疗和国家如何影响家庭。"
  zh-TW: "從女性主義、性別和童年研究看法律、學校、醫療和國家如何影響家庭。"
  ja: "フェミニズムやジェンダー・子ども研究から、法・学校・医療・国家が家族に与える影響を見る。"
  ko: "페미니즘·젠더·아동 연구로 법, 학교, 의료, 국가가 가족에 미치는 영향 살펴보기."
  vi: "Gia đình bị luật pháp, trường học, y tế và nhà nước tác động ra sao, qua góc nhìn nữ quyền, giới và tuổi thơ."
  ms: "Bagaimana keluarga dibentuk oleh undang-undang, sekolah, perubatan dan negara, dari sudut feminisme, gender dan zaman kanak-kanak."
  id: "Bagaimana keluarga dibentuk hukum, sekolah, kedokteran dan negara, lewat kajian feminis, gender dan anak."
  hi: "नारीवाद, जेंडर और बचपन अध्ययन से देखें कि क़ानून, स्कूल, चिकित्सा और राज्य परिवार को कैसे प्रभावित करते हैं।"
outcomes:
  - en: "Compare old and new theories of family life"
    zh: "比较新旧家庭生活理论"
    zh-TW: "比較新舊家庭生活理論"
    ja: "家族をめぐる新旧の理論を比べる"
    ko: "가족에 관한 옛 이론과 새 이론 비교하기"
    vi: "So sánh lý thuyết cũ và mới về đời sống gia đình"
    ms: "Bandingkan teori lama dan baharu tentang kehidupan keluarga"
    id: "Membandingkan teori lama dan baru tentang keluarga"
    hi: "परिवार के पुराने और नए सिद्धांतों की तुलना करना"
  - en: "Present a case study on men's changing roles in families"
    zh: "就男性在家庭中角色的变化做案例展示"
    zh-TW: "就男性在家庭中角色的變化做案例報告"
    ja: "家族における男性の役割の変化を事例で発表する"
    ko: "가족 내 남성 역할 변화에 대한 사례 발표하기"
    vi: "Trình bày tình huống về vai trò thay đổi của nam giới trong gia đình"
    ms: "Bentangkan kajian kes tentang peranan lelaki dalam keluarga yang berubah"
    id: "Mempresentasikan studi kasus peran pria dalam keluarga"
    hi: "परिवार में पुरुषों की बदलती भूमिका पर केस स्टडी प्रस्तुत करना"
  - en: "Weigh children's rights against parents' rights"
    zh: "权衡儿童权利与父母权利"
    zh-TW: "權衡兒童權利與父母權利"
    ja: "子どもの権利と親の権利のバランスを考える"
    ko: "아동의 권리와 부모의 권리 사이 균형 따져보기"
    vi: "Cân nhắc quyền của trẻ em và quyền của cha mẹ"
    ms: "Menimbang hak kanak-kanak berbanding hak ibu bapa"
    id: "Menimbang hak anak dan hak orang tua"
    hi: "बच्चों और माता-पिता के अधिकारों में संतुलन परखना"
