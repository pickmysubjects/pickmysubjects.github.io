code: FNCE90064
year: 2027
learn:
  en: "Financial decisions in emerging economies: their growth, risks and opportunities for investors and firms."
  zh: "新兴经济体中的金融决策：增长、风险以及投资者和企业的机会。"
  zh-TW: "新興經濟體中的金融決策：成長、風險以及投資人與企業的機會。"
  ja: "新興国での金融意思決定：成長、リスク、投資家と企業の機会。"
  ko: "신흥국의 금융 의사결정: 성장, 위험, 투자자와 기업의 기회."
  vi: "Quyết định tài chính ở các nền kinh tế mới nổi: tăng trưởng, rủi ro và cơ hội."
  ms: "Keputusan kewangan di ekonomi baru muncul: pertumbuhan, risiko dan peluang pelabur serta firma."
  id: "Keputusan keuangan di negara berkembang: pertumbuhan, risiko dan peluang bagi investor dan perusahaan."
  hi: "उभरती अर्थव्यवस्थाओं में वित्तीय निर्णय: विकास, जोखिम और निवेशकों व कंपनियों के अवसर।"
outcomes:
  - en: "Analyse emerging markets from several angles"
    zh: "从多个角度分析新兴市场"
    zh-TW: "從多個角度分析新興市場"
    ja: "新興市場を多角的に分析する"
    ko: "신흥시장을 여러 관점에서 분석하기"
    vi: "Phân tích thị trường mới nổi từ nhiều góc độ"
    ms: "Menganalisis pasaran baru muncul dari pelbagai sudut"
    id: "Menganalisis pasar berkembang dari berbagai sudut"
    hi: "उभरते बाज़ारों का कई नज़रियों से विश्लेषण"
  - en: "Weigh risks of investing in developing economies"
    zh: "权衡投资发展中经济体的风险"
    zh-TW: "權衡投資開發中經濟體的風險"
    ja: "途上国への投資リスクを見極める"
    ko: "개발도상국 투자 위험 따져보기"
    vi: "Cân nhắc rủi ro đầu tư vào nền kinh tế đang phát triển"
    ms: "Menimbang risiko melabur di ekonomi membangun"
    id: "Menimbang risiko investasi di negara berkembang"
    hi: "विकासशील अर्थव्यवस्थाओं में निवेश के जोखिम तौलना"
