code: MUSI10225
year: 2026
learn:
  en: "An auditioned chamber choir: work on tuning, breath and blend, singing sacred and secular music from the 13th century to now."
  zh: "需试音的室内合唱团：练音准、气息与融合，演唱13世纪至今的宗教与世俗作品。"
  zh-TW: "需試音的室內合唱團：練音準、氣息與融合，演唱13世紀至今的宗教與世俗作品。"
  ja: "オーディション制の室内合唱団。音程、呼吸、響きを磨き、13世紀から現代の曲を歌う。"
  ko: "오디션 실내합창단: 음정·호흡·조화를 다듬고 13세기부터 현대까지의 곡을 부른다."
  vi: "Dàn hợp xướng thính phòng có thử giọng: luyện cao độ, hơi thở, hát nhạc từ thế kỷ 13 đến nay."
  ms: "Koir kamar beruji bakat: latih intonasi dan pernafasan, nyanyi muzik abad ke-13 hingga kini."
  id: "Paduan suara kamar beraudisi: latih intonasi dan napas, nyanyikan musik abad ke-13 hingga kini."
  hi: "ऑडिशन वाला चैंबर कॉयर: सुर, साँस व मेल पर काम, 13वीं सदी से अब तक का संगीत।"
outcomes:
  - en: "Perform repertoire to concert standard"
    zh: "以音乐会水准演出曲目"
    zh-TW: "以音樂會水準演出曲目"
    ja: "演奏会レベルで曲を演奏する"
    ko: "연주회 수준으로 레퍼토리 공연"
    vi: "Biểu diễn đạt chuẩn hòa nhạc"
    ms: "Persembahkan repertoir tahap konsert"
    id: "Menampilkan repertoar setara konser"
    hi: "कॉन्सर्ट स्तर पर प्रस्तुति देना"
  - en: "Work as a reliable ensemble member"
    zh: "成为可靠的合奏成员"
    zh-TW: "成為可靠的合奏成員"
    ja: "信頼できるアンサンブル員になる"
    ko: "믿을 만한 앙상블 단원 되기"
    vi: "Làm thành viên nhóm đáng tin cậy"
    ms: "Jadi ahli ensembel yang boleh diharap"
    id: "Menjadi anggota ansambel yang andal"
    hi: "भरोसेमंद समूह सदस्य बनना"
  - en: "Know a range of ensemble repertoire"
    zh: "熟悉各类合奏曲目"
    zh-TW: "熟悉各類合奏曲目"
    ja: "幅広いアンサンブル曲を知る"
    ko: "다양한 앙상블 레퍼토리 알기"
    vi: "Hiểu nhiều tiết mục hòa tấu"
    ms: "Kenal pelbagai repertoir ensembel"
    id: "Mengenal beragam repertoar ansambel"
    hi: "कई तरह की समूह रचनाएँ जानना"
