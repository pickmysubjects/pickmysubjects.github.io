code: PHRM30002
year: 2026
learn:
  en: "How drugs act on the brain and nerves to treat mood disorders, addiction, pain, epilepsy and brain diseases."
  zh: "药物怎么作用于大脑和神经，治疗情绪、成瘾、疼痛等问题。"
  zh-TW: "藥物怎麼作用於大腦和神經，治療情緒、成癮、疼痛等問題。"
  ja: "気分障害、依存症、痛み、てんかん、脳疾患の治療で薬が脳と神経にどう作用するか。"
  ko: "기분장애, 중독, 통증, 뇌전증, 뇌질환 치료를 위해 약물이 뇌와 신경에 작용하는 방식."
  vi: "Thuốc tác động lên não và thần kinh để chữa rối loạn cảm xúc, nghiện, đau, động kinh và bệnh não."
  ms: "Cara ubat bertindak pada otak dan saraf untuk merawat gangguan mood, ketagihan, sakit, epilepsi dan penyakit otak."
  id: "Cara obat bekerja di otak dan saraf untuk mengobati gangguan mood, adiksi, nyeri, epilepsi, dan penyakit otak."
  hi: "मूड डिसऑर्डर, नशे, दर्द, मिर्गी और दिमागी बीमारियों में दवाएँ दिमाग व नसों पर कैसे काम करती हैं।"
outcomes:
  - en: "Explain drug treatments for common brain disorders"
    zh: "解释常见脑部疾病的药物治疗"
    zh-TW: "解釋常見腦部疾病的藥物治療"
    ja: "よくある脳の病気の薬物治療を説明する"
    ko: "흔한 뇌 질환의 약물 치료 설명"
    vi: "Giải thích cách dùng thuốc chữa bệnh não thường gặp"
    ms: "Terangkan rawatan ubat untuk gangguan otak biasa"
    id: "Menjelaskan pengobatan obat untuk gangguan otak umum"
    hi: "आम दिमागी बीमारियों के दवा-इलाज समझाना"
  - en: "Discuss effects of medical and recreational drugs"
    zh: "讨论治疗药物和消遣性药物的作用"
    zh-TW: "討論治療藥物和娛樂性藥物的作用"
    ja: "医療用薬物と嗜好目的の薬物の作用を論じる"
    ko: "의료용 약물과 기호용 약물의 효과 논의"
    vi: "Thảo luận tác dụng của thuốc chữa bệnh và chất kích thích"
    ms: "Bincang kesan ubat perubatan dan rekreasi"
    id: "Membahas efek obat medis dan rekreasional"
    hi: "मेडिकल और नशे वाली दवाओं के असर पर चर्चा"
  - en: "Show how understanding disease guides new drugs"
    zh: "说明了解病理怎么帮助研发新药"
    zh-TW: "說明了解病理怎麼幫助研發新藥"
    ja: "病気の理解が新薬開発にどうつながるか示す"
    ko: "질병 이해가 신약 개발로 어떻게 이어지는지 보여주기"
    vi: "Cho thấy hiểu bệnh giúp tạo thuốc mới ra sao"
    ms: "Tunjukkan cara memahami penyakit membantu ubat baharu"
    id: "Menunjukkan pemahaman penyakit menuntun obat baru"
    hi: "दिखाना कि बीमारी की समझ नई दवाओं में कैसे मदद करती है"
