code: PHRM30002
year: 2026
learn:
  en: "How drugs act on the brain and nerves to treat mood disorders, addiction, pain, epilepsy and brain diseases."
  zh: "药物怎么作用于大脑和神经，治疗情绪、成瘾、疼痛等问题。"
outcomes:
