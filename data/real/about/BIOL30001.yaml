code: BIOL30001
year: 2026
learn:
  en: "How reproduction works in humans and animals, reproductive disorders and assisted reproduction technology."
  zh: "人和动物的生殖原理、生殖疾病和辅助生殖技术。"
  zh-TW: "人和動物的生殖原理、生殖疾病和人工生殖技術。"
  ja: "ヒトと動物の生殖の仕組み、生殖障害、生殖補助技術。"
  ko: "사람과 동물의 생식 원리, 생식 장애, 보조생식기술."
  vi: "Sinh sản ở người và động vật diễn ra thế nào, rối loạn sinh sản và công nghệ hỗ trợ sinh sản."
  ms: "Cara pembiakan berlaku pada manusia dan haiwan, gangguan pembiakan dan teknologi bantuan pembiakan."
  id: "Cara reproduksi pada manusia dan hewan, gangguan reproduksi, dan teknologi reproduksi berbantu."
  hi: "इंसानों और जानवरों में प्रजनन कैसे होता है, प्रजनन विकार और असिस्टेड रिप्रोडक्शन तकनीक।"
outcomes:
  - en: "Compare male and female reproductive systems"
    zh: "比较男女生殖系统"
    zh-TW: "比較男女生殖系統"
    ja: "男性と女性の生殖器系を比べる"
    ko: "남녀 생식계 비교하기"
    vi: "So sánh hệ sinh sản nam và nữ"
    ms: "Banding sistem pembiakan lelaki dan wanita"
    id: "Membandingkan sistem reproduksi pria dan wanita"
    hi: "पुरुष और महिला प्रजनन तंत्र की तुलना"
  - en: "Explain how hormones control reproduction"
    zh: "解释激素怎样调控生殖"
    zh-TW: "解釋激素如何調控生殖"
    ja: "ホルモンが生殖をどう制御するか説明する"
    ko: "호르몬이 생식을 조절하는 방식 설명하기"
    vi: "Giải thích hormone điều khiển sinh sản ra sao"
    ms: "Terangkan cara hormon mengawal pembiakan"
    id: "Menjelaskan cara hormon mengatur reproduksi"
    hi: "समझाना कि हार्मोन प्रजनन को कैसे नियंत्रित करते हैं"
  - en: "Search and critique reproductive biology research"
    zh: "检索和评价生殖生物学文献"
    zh-TW: "檢索和評價生殖生物學文獻"
    ja: "生殖生物学の研究を調べて批評する"
    ko: "생식생물학 연구 검색하고 비평하기"
    vi: "Tìm và phản biện nghiên cứu sinh học sinh sản"
    ms: "Cari dan kritik kajian biologi pembiakan"
    id: "Mencari dan mengkritisi riset biologi reproduksi"
    hi: "प्रजनन बायोलॉजी रिसर्च खोजना और परखना"
