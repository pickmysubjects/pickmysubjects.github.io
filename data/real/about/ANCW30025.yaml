code: ANCW30025
year: 2026
learn:
  en: "A residential winter field school on a real dig in Georgia: excavating, recording and post-dig analysis, plus museum and site visits."
  zh: "冬季驻地田野学校，在格鲁吉亚真实遗址发掘：挖掘、记录和后续分析，并参观博物馆与遗址。"
  zh-TW: "冬季駐地田野學校，在喬治亞真實遺址發掘：挖掘、記錄和後續分析，並參觀博物館與遺址。"
  ja: "ジョージアの実際の遺跡で行う冬の合宿型フィールドスクール。発掘、記録、発掘後の分析、博物館や遺跡見学。"
  ko: "조지아의 실제 유적에서 진행하는 겨울 합숙 현장 학교. 발굴, 기록, 발굴 후 분석과 박물관·유적 답사."
  vi: "Trường thực địa mùa đông nội trú tại công trường thật ở Georgia: khai quật, ghi chép, phân tích sau đào và tham quan bảo tàng."
  ms: "Sekolah lapangan musim sejuk berasrama di tapak galian sebenar di Georgia: menggali, merekod, analisis dan lawatan muzium."
  id: "Sekolah lapangan musim dingin berasrama di situs galian nyata di Georgia: menggali, mencatat, analisis dan kunjungan museum."
  hi: "जॉर्जिया में असली खुदाई स्थल पर सर्दियों का आवासीय फ़ील्ड स्कूल: खुदाई, रिकॉर्डिंग, बाद का विश्लेषण और संग्रहालय भ्रमण।"
outcomes:
  - en: "Excavate and record finds on a real site"
    zh: "在真实遗址发掘并记录出土物"
    zh-TW: "在真實遺址發掘並記錄出土物"
    ja: "実際の遺跡で発掘し出土品を記録する"
    ko: "실제 유적에서 발굴하고 출토품 기록하기"
    vi: "Khai quật và ghi chép hiện vật tại công trường thật"
    ms: "Gali dan rekod penemuan di tapak sebenar"
    id: "Menggali dan mencatat temuan di situs nyata"
    hi: "असली स्थल पर खुदाई कर खोजों को दर्ज करना"
  - en: "Process and interpret finds after the dig"
    zh: "发掘后整理并解读出土物"
    zh-TW: "發掘後整理並解讀出土物"
    ja: "発掘後に出土品を整理し解釈する"
    ko: "발굴 후 출토품 정리하고 해석하기"
    vi: "Xử lý và diễn giải hiện vật sau khi đào"
    ms: "Proses dan tafsir penemuan selepas galian"
    id: "Mengolah dan menafsirkan temuan setelah penggalian"
    hi: "खुदाई के बाद खोजों को व्यवस्थित कर उनकी व्याख्या करना"
  - en: "Work as part of a field team"
    zh: "作为田野团队的一员协作"
    zh-TW: "作為田野團隊的一員協作"
    ja: "発掘チームの一員として働く"
    ko: "현장 팀의 일원으로 협력하기"
    vi: "Làm việc trong một nhóm thực địa"
    ms: "Bekerja sebagai sebahagian pasukan lapangan"
    id: "Bekerja sebagai bagian dari tim lapangan"
    hi: "फ़ील्ड टीम के हिस्से के रूप में काम करना"
