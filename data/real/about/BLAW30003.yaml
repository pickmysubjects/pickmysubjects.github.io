code: BLAW30003
year: 2026
learn:
  en: "Australian tax law beyond individuals: companies, trusts, partnerships, international tax and superannuation."
  zh: "个人以外的澳洲税法：公司、信托、合伙、国际税务和养老金。"
  zh-TW: "個人以外的澳洲稅法：公司、信託、合夥、國際稅務和退休金。"
  ja: "個人以外の豪州税法：会社、信託、パートナーシップ、国際課税、年金。"
  ko: "개인 외 호주 세법: 회사, 신탁, 파트너십, 국제 조세, 연금."
  vi: "Luật thuế Úc ngoài cá nhân: công ty, quỹ tín thác, hợp danh, thuế quốc tế và hưu bổng."
  ms: "Undang-undang cukai Australia selain individu: syarikat, amanah, perkongsian, cukai antarabangsa dan superannuasi."
  id: "Hukum pajak Australia di luar perorangan: perusahaan, trust, persekutuan, pajak internasional, dan dana pensiun."
  hi: "व्यक्तियों से आगे ऑस्ट्रेलियाई टैक्स क़ानून: कंपनियाँ, ट्रस्ट, पार्टनरशिप, अंतरराष्ट्रीय टैक्स और सुपरएनुएशन।"
outcomes:
  - en: "Explain how companies, trusts and partnerships are taxed"
    zh: "解释公司、信托和合伙如何纳税"
    zh-TW: "說明公司、信託和合夥如何課稅"
    ja: "会社・信託・パートナーシップの課税を説明する"
    ko: "회사, 신탁, 파트너십의 과세 방식 설명"
    vi: "Giải thích cách đánh thuế công ty, tín thác và hợp danh"
    ms: "Terangkan cara syarikat, amanah dan perkongsian dicukai"
    id: "Menjelaskan pajak perusahaan, trust, dan persekutuan"
    hi: "कंपनी, ट्रस्ट और पार्टनरशिप पर टैक्स कैसे लगता है, समझाना"
  - en: "Apply residency, source and double tax rules across borders"
    zh: "把居民、来源和双重征税规则用于跨境情况"
    zh-TW: "把居民、來源和雙重課稅規則用於跨境情況"
    ja: "居住地・源泉・二重課税のルールを国際事例に当てはめる"
    ko: "거주지·원천·이중과세 규칙을 국경 간 사례에 적용"
    vi: "Áp dụng quy tắc cư trú, nguồn và đánh thuế hai lần"
    ms: "Guna peraturan pemastautin, sumber dan cukai berganda"
    id: "Menerapkan aturan residensi, sumber, dan pajak berganda"
    hi: "निवास, स्रोत और दोहरे टैक्स के नियम सीमा-पार मामलों पर लागू करना"
  - en: "Interpret the rules on superannuation and tax accounting"
    zh: "解读养老金和税务会计的规则"
    zh-TW: "解讀退休金和稅務會計的規則"
    ja: "年金と税務会計のルールを読み解く"
    ko: "연금과 세무회계 규칙 해석"
    vi: "Diễn giải quy định về hưu bổng và kế toán thuế"
    ms: "Tafsir peraturan superannuasi dan perakaunan cukai"
    id: "Menafsirkan aturan dana pensiun dan akuntansi pajak"
    hi: "सुपरएनुएशन और टैक्स अकाउंटिंग के नियम समझना"
