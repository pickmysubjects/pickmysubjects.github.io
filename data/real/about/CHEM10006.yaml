code: CHEM10006
year: 2026
learn:
  en: "First-year chemistry with a biomedical focus: bonding, carbon compounds, reaction rates, energy and the molecules of life."
  zh: "偏生物医学方向的大一化学：化学键、有机物、反应速率、能量和生命分子。"
  zh-TW: "偏生物醫學方向的大一化學：化學鍵、有機物、反應速率、能量和生命分子。"
  ja: "生物医学向けの1年次化学：結合、炭素化合物、反応速度、エネルギー、生体分子。"
  ko: "생물의학 중심의 1학년 화학: 결합, 탄소 화합물, 반응 속도, 에너지, 생체 분자."
  vi: "Hóa năm nhất thiên về y sinh: liên kết, hợp chất cacbon, tốc độ phản ứng, năng lượng và các phân tử sự sống."
  ms: "Kimia tahun pertama berfokus bioperubatan: ikatan, sebatian karbon, kadar tindak balas, tenaga dan molekul hidupan."
  id: "Kimia tahun pertama dengan fokus biomedis: ikatan, senyawa karbon, laju reaksi, energi, dan molekul kehidupan."
  hi: "बायोमेडिकल फ़ोकस वाली फ़र्स्ट-ईयर केमिस्ट्री: बॉन्डिंग, कार्बन यौगिक, अभिक्रिया की दर, ऊर्जा और जीवन के अणु।"
outcomes:
  - en: "Do basic lab experiments and write reports"
    zh: "做基础实验并写实验报告"
    zh-TW: "做基礎實驗並寫實驗報告"
    ja: "基本的な実験をしてレポートを書く"
    ko: "기초 실험을 하고 보고서 쓰기"
    vi: "Làm thí nghiệm cơ bản và viết báo cáo"
    ms: "Buat eksperimen asas dan tulis laporan"
    id: "Melakukan eksperimen dasar dan menulis laporan"
    hi: "बेसिक लैब प्रयोग करना और रिपोर्ट लिखना"
  - en: "Explain what controls how fast a reaction goes"
    zh: "解释哪些因素影响反应快慢"
    zh-TW: "解釋哪些因素影響反應快慢"
    ja: "反応の速さを決める要因を説明する"
    ko: "반응 속도에 영향을 주는 요인 설명하기"
    vi: "Giải thích điều gì quyết định tốc độ phản ứng"
    ms: "Terangkan apa yang mempengaruhi kelajuan tindak balas"
    id: "Menjelaskan apa yang memengaruhi kecepatan reaksi"
    hi: "समझाना कि अभिक्रिया की रफ़्तार किन बातों पर निर्भर है"
  - en: "Describe the structure of common biological molecules"
    zh: "描述常见生物分子的结构"
    zh-TW: "描述常見生物分子的結構"
    ja: "よくある生体分子の構造を説明する"
    ko: "흔한 생체 분자의 구조 설명하기"
    vi: "Mô tả cấu trúc các phân tử sinh học phổ biến"
    ms: "Huraikan struktur molekul biologi biasa"
    id: "Menjelaskan struktur molekul biologis yang umum"
    hi: "आम जैविक अणुओं की संरचना बताना"
