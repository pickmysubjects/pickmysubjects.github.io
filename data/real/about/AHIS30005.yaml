code: AHIS30005
year: 2026
learn:
  en: "Contemporary Aboriginal art from the Papunya desert painters to new media, and debates over copyright, markets and curating."
  zh: "当代原住民艺术，从帕普尼亚沙漠绘画到新媒体，以及版权、市场和策展方面的争论。"
  zh-TW: "當代原住民藝術，從帕普尼亞沙漠繪畫到新媒體，以及版權、市場和策展方面的爭論。"
  ja: "パプニャの砂漠画からニューメディアまでの現代アボリジナル美術と、著作権・市場・キュレーションをめぐる議論。"
  ko: "파푸냐 사막 회화부터 뉴미디어까지 현대 원주민 미술과 저작권·시장·큐레이션 논쟁을 배운다."
  vi: "Nghệ thuật thổ dân đương đại từ hội họa sa mạc Papunya đến truyền thông mới, cùng tranh luận về bản quyền, thị trường và giám tuyển."
  ms: "Seni Orang Asli kontemporari dari pelukis gurun Papunya hingga media baharu, serta perdebatan hak cipta, pasaran dan kurasi."
  id: "Seni Aborigin kontemporer dari pelukis gurun Papunya sampai media baru, serta perdebatan hak cipta, pasar dan kurasi."
  hi: "पापुन्या रेगिस्तानी चित्रकारों से न्यू मीडिया तक समकालीन एबोरिजिनल कला, और कॉपीराइट, बाज़ार व क्यूरेशन पर बहसें।"
outcomes:
  - en: "Describe key Aboriginal artists and movements"
    zh: "介绍重要的原住民艺术家和流派"
    zh-TW: "介紹重要的原住民藝術家和流派"
    ja: "主なアボリジナルの作家と動向を説明する"
    ko: "주요 원주민 작가와 흐름 설명하기"
    vi: "Mô tả các nghệ sĩ và trào lưu thổ dân chính"
    ms: "Huraikan artis dan gerakan Orang Asli utama"
    id: "Menguraikan seniman dan gerakan Aborigin utama"
    hi: "मुख्य एबोरिजिनल कलाकारों और आंदोलनों का वर्णन करना"
  - en: "Discuss copyright, appropriation and the market"
    zh: "讨论版权、挪用和艺术市场"
    zh-TW: "討論版權、挪用和藝術市場"
    ja: "著作権・盗用・市場について論じる"
    ko: "저작권·전유·시장 논의하기"
    vi: "Thảo luận bản quyền, chiếm dụng và thị trường"
    ms: "Bincangkan hak cipta, pengambilan dan pasaran"
    id: "Membahas hak cipta, apropriasi dan pasar"
    hi: "कॉपीराइट, विनियोग और बाज़ार पर चर्चा करना"
  - en: "Interpret works with cultural respect"
    zh: "以尊重文化的方式解读作品"
    zh-TW: "以尊重文化的方式解讀作品"
    ja: "文化に敬意を払って作品を解釈する"
    ko: "문화를 존중하며 작품 해석하기"
    vi: "Diễn giải tác phẩm với sự tôn trọng văn hóa"
    ms: "Tafsir karya dengan hormat terhadap budaya"
    id: "Menafsirkan karya dengan menghormati budaya"
    hi: "सांस्कृतिक सम्मान के साथ कृतियों की व्याख्या करना"
