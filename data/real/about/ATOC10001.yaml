code: ATOC10001
year: 2026
learn:
  en: "How the atmosphere and oceans shape the weather, and how weather affects our lives, health and resources."
  zh: "大气和海洋怎样决定天气，天气又怎样影响生活、健康和资源。"
outcomes:
  - en: "Read weather maps and forecasts"
    zh: "看懂天气图和天气预报"
  - en: "Explain heat waves, cyclones and air pollution"
    zh: "解释热浪、气旋和空气污染"
  - en: "Describe how the atmosphere and ocean are structured"
    zh: "说明大气和海洋的结构"
