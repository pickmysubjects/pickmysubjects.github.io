code: ATOC10001
year: 2026
learn:
  en: "How the atmosphere and oceans shape the weather, and how weather affects our lives, health and resources."
  zh: "大气和海洋怎样决定天气，天气又怎样影响生活、健康和资源。"
  zh-TW: "大氣和海洋如何決定天氣，天氣又如何影響生活、健康和資源。"
  ja: "大気と海洋が天気をどう形作り、天気が生活・健康・資源にどう影響するか。"
  ko: "대기와 바다가 날씨를 어떻게 만들고, 날씨가 삶·건강·자원에 어떤 영향을 주는지."
  vi: "Khí quyển và đại dương tạo nên thời tiết ra sao, và thời tiết ảnh hưởng đời sống, sức khỏe, tài nguyên thế nào."
  ms: "Cara atmosfera dan lautan membentuk cuaca, dan kesan cuaca pada hidup, kesihatan dan sumber kita."
  id: "Cara atmosfer dan laut membentuk cuaca, dan dampak cuaca pada hidup, kesehatan, dan sumber daya kita."
  hi: "वायुमंडल और समुद्र मौसम कैसे बनाते हैं, और मौसम हमारे जीवन, सेहत व संसाधनों पर क्या असर डालता है।"
outcomes:
  - en: "Read weather maps and forecasts"
    zh: "看懂天气图和天气预报"
    zh-TW: "看懂天氣圖和天氣預報"
    ja: "天気図と天気予報を読む"
    ko: "일기도와 일기예보 읽기"
    vi: "Đọc bản đồ thời tiết và dự báo"
    ms: "Baca peta cuaca dan ramalan"
    id: "Membaca peta cuaca dan prakiraan"
    hi: "मौसम के नक्शे और पूर्वानुमान पढ़ना"
  - en: "Explain heat waves, cyclones and air pollution"
    zh: "解释热浪、气旋和空气污染"
    zh-TW: "解釋熱浪、氣旋和空氣汙染"
    ja: "熱波・サイクロン・大気汚染を説明する"
    ko: "폭염, 사이클론, 대기오염 설명하기"
    vi: "Giải thích nắng nóng, lốc xoáy và ô nhiễm không khí"
    ms: "Terangkan gelombang haba, siklon dan pencemaran udara"
    id: "Menjelaskan gelombang panas, siklon, dan polusi udara"
    hi: "हीट वेव, चक्रवात और वायु प्रदूषण समझाना"
  - en: "Describe how the atmosphere and ocean are structured"
    zh: "说明大气和海洋的结构"
    zh-TW: "說明大氣和海洋的結構"
    ja: "大気と海洋の構造を説明する"
    ko: "대기와 바다의 구조 설명하기"
    vi: "Mô tả cấu trúc của khí quyển và đại dương"
    ms: "Huraikan struktur atmosfera dan lautan"
    id: "Menjelaskan struktur atmosfer dan laut"
    hi: "वायुमंडल और समुद्र की संरचना बताना"
