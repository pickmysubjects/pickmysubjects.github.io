code: ABPL90371
year: 2027
learn:
  en: "How architectural design relates to protest and activism, through case studies like the Occupy movement."
  zh: "通过占领运动等案例，探讨建筑设计与抗议和社会行动的关系。"
  zh-TW: "透過佔領運動等案例，探討建築設計與抗議和社會行動的關係。"
  ja: "オキュパイ運動などの事例から、建築設計と抗議・社会運動の関係を探る。"
  ko: "오큐파이 운동 등 사례로 건축 설계와 시위·행동주의의 관계를 탐구합니다."
  vi: "Quan hệ giữa thiết kế kiến trúc với biểu tình và hoạt động xã hội, qua các tình huống như phong trào Occupy."
  ms: "Hubungan reka bentuk seni bina dengan protes dan aktivisme melalui kajian kes seperti Occupy."
  id: "Hubungan desain arsitektur dengan protes dan aktivisme lewat studi kasus seperti gerakan Occupy."
  hi: "ऑक्युपाई आंदोलन जैसे उदाहरणों से वास्तु डिज़ाइन और विरोध-सक्रियता का संबंध।"
outcomes:
  - en: "Explain theories of protest and urbanism"
    zh: "解释抗议与城市主义的理论"
    zh-TW: "解釋抗議與城市主義的理論"
    ja: "抗議と都市論の理論を説明する"
    ko: "시위와 도시론 이론 설명하기"
    vi: "Giải thích lý thuyết về biểu tình và đô thị"
    ms: "Menerangkan teori protes dan urbanisme"
    id: "Menjelaskan teori protes dan urbanisme"
    hi: "विरोध और शहरीकरण के सिद्धांत समझाना"
  - en: "Develop a group design activism proposal"
    zh: "小组提出设计行动方案"
    zh-TW: "小組提出設計行動方案"
    ja: "グループでデザイン・アクティビズム案をつくる"
    ko: "팀으로 디자인 행동주의 제안 만들기"
    vi: "Cùng nhóm xây dựng đề xuất hành động thiết kế"
    ms: "Membangunkan cadangan aktivisme reka bentuk berkumpulan"
    id: "Menyusun usulan aktivisme desain secara kelompok"
    hi: "समूह में डिज़ाइन एक्टिविज़्म प्रस्ताव बनाना"
