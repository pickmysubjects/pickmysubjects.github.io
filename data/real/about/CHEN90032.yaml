code: CHEN90032
year: 2027
learn:
  en: "Simulating how chemical processes change over time and designing controllers, with MATLAB Simulink."
  zh: "模拟化工过程随时间的变化并设计控制器，使用 MATLAB Simulink。"
  zh-TW: "模擬化工程序隨時間的變化並設計控制器，使用 MATLAB Simulink。"
  ja: "化学プロセスの時間変化をシミュレーションし、MATLAB Simulink で制御器を設計する。"
  ko: "화학 공정의 시간 변화를 모사하고 MATLAB Simulink로 제어기 설계하기."
  vi: "Mô phỏng quá trình hóa học thay đổi theo thời gian và thiết kế bộ điều khiển bằng MATLAB Simulink."
  ms: "Mensimulasikan perubahan proses kimia dari masa ke masa dan mereka pengawal dengan MATLAB Simulink."
  id: "Menyimulasikan perubahan proses kimia dari waktu ke waktu dan merancang pengendali dengan MATLAB Simulink."
  hi: "समय के साथ रासायनिक प्रक्रियाओं के बदलाव का सिमुलेशन और MATLAB Simulink से कंट्रोलर डिज़ाइन।"
outcomes:
  - en: "Simulate unit operations with analytical and numerical methods"
    zh: "用解析和数值方法模拟单元操作"
    zh-TW: "用解析與數值方法模擬單元操作"
    ja: "解析的・数値的な方法で単位操作をシミュレーションする"
    ko: "해석적·수치적 방법으로 단위 조작 모사하기"
    vi: "Mô phỏng quá trình đơn vị bằng phương pháp giải tích và số"
    ms: "Mensimulasikan operasi unit dengan kaedah analitik dan berangka"
    id: "Menyimulasikan operasi satuan dengan metode analitik dan numerik"
    hi: "विश्लेषणात्मक और संख्यात्मक तरीकों से यूनिट ऑपरेशन का सिमुलेशन"
  - en: "Design and tune feedback controllers like PID"
    zh: "设计并整定 PID 等反馈控制器"
    zh-TW: "設計並調校 PID 等回饋控制器"
    ja: "PID などのフィードバック制御器を設計・調整する"
    ko: "PID 등 피드백 제어기 설계와 튜닝하기"
    vi: "Thiết kế và chỉnh bộ điều khiển phản hồi như PID"
    ms: "Mereka dan menala pengawal suap balik seperti PID"
    id: "Merancang dan menyetel pengendali umpan balik seperti PID"
    hi: "PID जैसे फ़ीडबैक कंट्रोलर डिज़ाइन और ट्यून करना"
  - en: "Check the stability of closed-loop systems"
    zh: "分析闭环系统的稳定性"
    zh-TW: "分析閉迴路系統的穩定性"
    ja: "閉ループ系の安定性を調べる"
    ko: "폐루프 시스템의 안정성 확인하기"
    vi: "Kiểm tra độ ổn định của hệ vòng kín"
    ms: "Menyemak kestabilan sistem gelung tertutup"
    id: "Memeriksa kestabilan sistem loop tertutup"
    hi: "क्लोज़्ड-लूप सिस्टम की स्थिरता जाँचना"
