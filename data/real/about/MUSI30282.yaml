code: MUSI30282
year: 2026
learn:
  en: "Advanced rhythm for jazz improvisers: complex meters and polyrhythms, learned through playing, listening and transcribing."
  zh: "面向爵士即兴乐手的高级节奏：通过演奏、聆听和扒谱学习复杂拍子与复节奏。"
  zh-TW: "面向爵士即興樂手的高級節奏：透過演奏、聆聽和扒譜學習複雜拍子與複節奏。"
  ja: "ジャズ即興奏者のための上級リズム。複雑な拍子とポリリズムを演奏・聴取・採譜で学ぶ。"
  ko: "재즈 즉흥 연주자를 위한 고급 리듬. 복잡한 박자와 폴리리듬을 연주·듣기·채보로."
  vi: "Tiết tấu nâng cao cho người ứng tác jazz: nhịp phức và đa tiết tấu."
  ms: "Irama lanjutan untuk pemain jaz: meter kompleks dan poliritma."
  id: "Ritme lanjut untuk improvisator jazz: birama kompleks dan poliritme."
  hi: "जैज़ वादकों के लिए उन्नत लय: जटिल ताल और पॉलीरिद्म, बजाकर, सुनकर, लिखकर।"
outcomes:
  - en: "Play complex rhythms and polyrhythms accurately"
    zh: "准确演奏复杂节奏与复节奏"
    zh-TW: "準確演奏複雜節奏與複節奏"
    ja: "複雑なリズムとポリリズムを正確に演奏する"
    ko: "복잡한 리듬과 폴리리듬 정확히 연주하기"
    vi: "Chơi chính xác nhịp phức và đa tiết tấu"
    ms: "Mainkan irama kompleks dan poliritma dengan tepat"
    id: "Memainkan ritme kompleks dan poliritme dengan tepat"
    hi: "जटिल लय और पॉलीरिद्म सही बजाना"
  - en: "Transcribe rhythmically demanding music"
    zh: "扒写节奏复杂的音乐"
    zh-TW: "扒寫節奏複雜的音樂"
    ja: "リズムの難しい曲を採譜する"
    ko: "리듬이 까다로운 음악 채보하기"
    vi: "Chép lại nhạc có tiết tấu khó"
    ms: "Transkrip muzik yang mencabar dari segi irama"
    id: "Mentranskripsi musik dengan ritme sulit"
    hi: "कठिन लय वाले संगीत को लिखना"
  - en: "Pass live rhythm tests in front of an examiner"
    zh: "当面通过节奏实操考试"
    zh-TW: "當面通過節奏實作考試"
    ja: "試験官の前でリズム実技に合格する"
    ko: "시험관 앞에서 리듬 실기 통과하기"
    vi: "Vượt qua bài thi tiết tấu trực tiếp"
    ms: "Lulus ujian irama secara langsung"
    id: "Lulus ujian ritme langsung di depan penguji"
    hi: "परीक्षक के सामने लय की मौखिक परीक्षा पास करना"
