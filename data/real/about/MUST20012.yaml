code: MUST20012
year: 2026
learn:
  en: "Combine acting, singing and dance in solo and ensemble work, presenting prepared songs for feedback."
  zh: "把表演、演唱与舞蹈结合到独唱和群体作品中，准备歌曲接受点评。"
  zh-TW: "把表演、演唱與舞蹈結合到獨唱和群體作品中，準備歌曲接受講評。"
  ja: "演技・歌・ダンスをソロと集団作品で組み合わせ、準備した歌で講評を受ける。"
  ko: "연기·노래·춤을 솔로와 앙상블로 결합하고 준비한 곡으로 피드백을 받는다."
  vi: "Kết hợp diễn, hát, múa trong bài đơn và tập thể, trình bày bài hát để nhận góp ý."
  ms: "Gabung lakonan, nyanyian dan tarian dalam kerja solo dan ensembel, dengan maklum balas."
  id: "Menggabungkan akting, nyanyi dan tari dalam solo dan ensambel, menerima masukan."
  hi: "अभिनय, गायन और नृत्य को सोलो व समूह काम में जोड़ना, तैयार गीतों पर फ़ीडबैक।"
outcomes:
  - en: "Prepare songs on your own for feedback"
    zh: "独立准备歌曲接受点评"
    zh-TW: "獨立準備歌曲接受講評"
    ja: "自分で歌を準備し講評を受ける"
    ko: "혼자 곡을 준비해 피드백 받기"
    vi: "Tự chuẩn bị bài hát để nhận góp ý"
    ms: "Sedia lagu sendiri untuk maklum balas"
    id: "Menyiapkan lagu sendiri untuk masukan"
    hi: "ख़ुद गीत तैयार कर फ़ीडबैक लेना"
  - en: "Sing and dance together in a group number"
    zh: "在群体曲目中边唱边跳"
    zh-TW: "在群體曲目中邊唱邊跳"
    ja: "グループナンバーで歌い踊る"
    ko: "그룹 넘버에서 노래하며 춤추기"
    vi: "Vừa hát vừa múa trong tiết mục nhóm"
    ms: "Nyanyi dan menari dalam nombor kumpulan"
    id: "Menyanyi dan menari dalam nomor kelompok"
    hi: "समूह गीत में गाते हुए नाचना"
  - en: "Assess your own performance critically"
    zh: "批判性地评估自己的表演"
    zh-TW: "批判性地評估自己的表演"
    ja: "自分の上演を批判的に評価する"
    ko: "자기 공연 비판적으로 평가하기"
    vi: "Tự đánh giá màn diễn của mình"
    ms: "Nilai persembahan sendiri secara kritis"
    id: "Menilai penampilan sendiri secara kritis"
    hi: "अपने प्रदर्शन का आलोचनात्मक आकलन"
