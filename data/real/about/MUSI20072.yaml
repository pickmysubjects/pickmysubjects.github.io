code: MUSI20072
year: 2026
learn:
  en: "The Conservatorium's audition-only Big Band: jazz from the 1930s to now, student charts and plenty of improvising at gigs around town."
  zh: "需试音的音乐学院大乐队：演奏30年代至今的爵士，含学生编曲，鼓励即兴。"
  zh-TW: "需試音的音樂學院大樂隊：演奏30年代至今的爵士，含學生編曲，鼓勵即興。"
  ja: "オーディション制のビッグバンド：30年代から現代のジャズ、学生編曲、即興も。"
  ko: "오디션제 빅밴드: 1930년대부터 현재까지 재즈, 학생 편곡, 즉흥 연주."
  vi: "Big Band tuyển qua thử giọng: jazz từ thập niên 30 đến nay, bản phối của sinh viên, nhiều ngẫu hứng."
  ms: "Big Band melalui uji bakat: jaz dari 1930-an hingga kini, gubahan pelajar dan banyak improvisasi."
  id: "Big Band lewat audisi: jazz era 1930-an hingga kini, aransemen mahasiswa, banyak improvisasi."
  hi: "ऑडिशन वाला बिग बैंड: 1930 से आज तक का जैज़, छात्रों की रचनाएँ और खूब इम्प्रोवाइज़ेशन।"
outcomes:
  - en: "Prepare your part and play it accurately in rehearsal"
    zh: "认真准备声部，排练中准确演奏"
    zh-TW: "認真準備聲部，排練中準確演奏"
    ja: "自分のパートを準備し、合奏で正確に演奏する"
    ko: "자기 파트를 준비해 리허설에서 정확히 연주하기"
    vi: "Chuẩn bị bè của mình và chơi chính xác khi tập"
    ms: "Sediakan bahagian sendiri dan mainkan dengan tepat semasa latihan"
    id: "Menyiapkan bagian sendiri dan memainkannya dengan tepat saat latihan"
    hi: "अपना पार्ट तैयार कर रिहर्सल में सही बजाना"
  - en: "Improvise solos in big band jazz styles"
    zh: "以大乐队爵士风格即兴独奏"
    zh-TW: "以大樂隊爵士風格即興獨奏"
    ja: "ビッグバンドのスタイルで即興ソロをとる"
    ko: "빅밴드 재즈 스타일로 즉흥 솔로하기"
    vi: "Ngẫu hứng solo theo phong cách big band"
    ms: "Improvisasi solo dalam gaya jaz big band"
    id: "Berimprovisasi solo dalam gaya jazz big band"
    hi: "बिग बैंड जैज़ शैली में सोलो इम्प्रोवाइज़ करना"
  - en: "Perform in public concerts as part of the ensemble"
    zh: "随乐团参加公开演出"
    zh-TW: "隨樂團參加公開演出"
    ja: "アンサンブルの一員として公演に出る"
    ko: "앙상블 일원으로 공개 공연하기"
    vi: "Biểu diễn trước khán giả cùng dàn nhạc"
    ms: "Membuat persembahan awam bersama ensembel"
    id: "Tampil di konser publik bersama ansambel"
    hi: "समूह के साथ सार्वजनिक कॉन्सर्ट में प्रस्तुति देना"
