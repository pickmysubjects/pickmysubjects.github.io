code: ABPL30055
year: 2026
learn:
  en: "Running a building site: resources, labour productivity, critical-path scheduling, cost control, safety and quality."
  zh: "管理施工现场：资源、劳动效率、关键路径进度、成本控制、安全和质量。"
  zh-TW: "管理施工現場：資源、勞動效率、要徑排程、成本控制、安全與品質。"
  ja: "建設現場の運営：資源、労働生産性、クリティカルパス工程、原価管理、安全と品質。"
  ko: "건설 현장 운영: 자원, 노동 생산성, 주공정 일정, 원가 관리, 안전과 품질."
  vi: "Vận hành công trường: nguồn lực, năng suất lao động, tiến độ đường găng, kiểm soát chi phí, an toàn, chất lượng."
  ms: "Mengurus tapak bina: sumber, produktiviti buruh, jadual laluan kritikal, kawalan kos, keselamatan dan kualiti."
  id: "Mengelola lokasi proyek: sumber daya, produktivitas tenaga kerja, jadwal jalur kritis, biaya, K3, dan mutu."
  hi: "निर्माण साइट चलाना: संसाधन, श्रम उत्पादकता, क्रिटिकल-पाथ शेड्यूल, लागत नियंत्रण, सुरक्षा और गुणवत्ता।"
outcomes:
  - en: "Build a critical-path schedule for a building project"
    zh: "为建筑项目编制关键路径进度计划"
    zh-TW: "為建築專案編制要徑排程"
    ja: "建築プロジェクトのクリティカルパス工程表を作る"
    ko: "건축 프로젝트의 주공정 일정표 만들기"
    vi: "Lập tiến độ đường găng cho dự án xây dựng"
    ms: "Bina jadual laluan kritikal untuk projek binaan"
    id: "Menyusun jadwal jalur kritis proyek bangunan"
    hi: "इमारत प्रोजेक्ट का क्रिटिकल-पाथ शेड्यूल बनाना"
  - en: "Plan labour, materials and equipment on site"
    zh: "规划现场的人力、材料和设备"
    zh-TW: "規劃現場的人力、材料和設備"
    ja: "現場の人員・資材・機材を計画する"
    ko: "현장의 인력·자재·장비 계획하기"
    vi: "Lập kế hoạch nhân lực, vật tư, thiết bị"
    ms: "Rancang buruh, bahan dan peralatan di tapak"
    id: "Merencanakan tenaga kerja, material, dan alat"
    hi: "साइट पर श्रम, सामग्री और उपकरण की योजना"
  - en: "Understand site cost control, safety and quality"
    zh: "理解现场成本控制、安全与质量管理"
    zh-TW: "理解現場成本控制、安全與品質管理"
    ja: "現場の原価・安全・品質管理を理解する"
    ko: "현장 원가·안전·품질 관리 이해하기"
    vi: "Hiểu kiểm soát chi phí, an toàn và chất lượng"
    ms: "Faham kawalan kos, keselamatan dan kualiti tapak"
    id: "Memahami kendali biaya, K3, dan mutu di lapangan"
    hi: "साइट पर लागत, सुरक्षा और गुणवत्ता नियंत्रण समझना"
