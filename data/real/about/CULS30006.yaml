code: CULS30006
year: 2026
learn:
  en: "How migration, travel, study abroad and media flows shape culture and identity, with case studies mostly from Asia."
  zh: "移民、旅行、留学和媒体流动如何塑造文化和身份认同，案例主要来自亚洲。"
  zh-TW: "移民、旅行、留學和媒體流動如何形塑文化和身分認同，案例主要來自亞洲。"
  ja: "移住、旅行、留学、メディアの流れが文化やアイデンティティをどう形づくるかを、主にアジアの事例で学ぶ。"
  ko: "이주, 여행, 유학, 미디어의 흐름이 문화와 정체성을 어떻게 만드는지 주로 아시아 사례로 배운다."
  vi: "Di cư, du lịch, du học và dòng chảy truyền thông định hình văn hóa và bản sắc ra sao, với ví dụ chủ yếu từ châu Á."
  ms: "Bagaimana migrasi, pelancongan, belajar di luar negara dan aliran media membentuk budaya serta identiti, dengan kajian kes kebanyakannya dari Asia."
  id: "Bagaimana migrasi, perjalanan, kuliah di luar negeri, dan arus media membentuk budaya serta identitas, dengan contoh kasus kebanyakan dari Asia."
  hi: "प्रवास, यात्रा, विदेश में पढ़ाई और मीडिया का प्रवाह संस्कृति और पहचान को कैसे आकार देते हैं, ज़्यादातर एशिया के उदाहरणों के साथ।"
outcomes:
  - en: "Explain cultural studies ideas on globalisation"
    zh: "解释文化研究对全球化的主要观点"
    zh-TW: "解釋文化研究對全球化的主要觀點"
    ja: "グローバル化に関する文化研究の考え方を説明する"
    ko: "세계화에 관한 문화 연구의 관점 설명하기"
    vi: "Giải thích các quan điểm của nghiên cứu văn hóa về toàn cầu hóa"
    ms: "Terangkan idea kajian budaya tentang globalisasi"
    id: "Menjelaskan gagasan kajian budaya tentang globalisasi"
    hi: "वैश्वीकरण पर सांस्कृतिक अध्ययन के विचार समझाना"
  - en: "Link mobility to gender, race, class and power"
    zh: "把人口流动和性别、种族、阶级与权力联系起来"
    zh-TW: "把人口流動和性別、種族、階級與權力連結起來"
    ja: "移動をジェンダー、人種、階級、権力と結びつけて考える"
    ko: "이동을 젠더, 인종, 계급, 권력과 연결하기"
    vi: "Liên hệ sự di chuyển với giới, chủng tộc, giai cấp và quyền lực"
    ms: "Kaitkan mobiliti dengan gender, kaum, kelas dan kuasa"
    id: "Mengaitkan mobilitas dengan gender, ras, kelas, dan kuasa"
    hi: "आवाजाही को लिंग, नस्ल, वर्ग और सत्ता से जोड़ना"
  - en: "Critique research on global culture in Asia"
    zh: "评析有关亚洲全球文化的研究"
    zh-TW: "評析有關亞洲全球文化的研究"
    ja: "アジアのグローバル文化に関する研究を批評する"
    ko: "아시아의 글로벌 문화 연구 비평하기"
    vi: "Phê bình các nghiên cứu về văn hóa toàn cầu ở châu Á"
    ms: "Kritik kajian tentang budaya global di Asia"
    id: "Mengkritisi riset tentang budaya global di Asia"
    hi: "एशिया में वैश्विक संस्कृति पर हुए शोध की समीक्षा करना"
