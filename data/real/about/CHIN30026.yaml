code: CHIN30026
year: 2026
learn:
  en: "Advanced Chinese for those who speak some but read little: newspapers, opinion writing and debate on social issues."
  zh: "面向会说但读写较弱的学生的高级中文：读报、写评论，并就社会议题展开讨论。"
  zh-TW: "面向會說但讀寫較弱的學生的高級中文：讀報、寫評論，並就社會議題展開討論。"
  ja: "話せるが読み書きが弱い人向けの上級中国語。新聞読解、意見文、社会問題の討論。"
  ko: "말은 하지만 읽기·쓰기가 약한 학습자를 위한 고급 중국어. 신문 읽기, 의견글, 사회 문제 토론."
  vi: "Tiếng Trung nâng cao cho người nói được nhưng đọc viết yếu: đọc báo, viết bài nêu ý kiến và tranh luận về vấn đề xã hội."
  ms: "Bahasa Cina lanjutan bagi yang boleh bertutur tetapi kurang membaca: akhbar, penulisan pendapat dan debat isu sosial."
  id: "Bahasa Mandarin lanjut bagi yang bisa bicara tapi kurang membaca: koran, menulis opini dan debat isu sosial."
  hi: "जो कुछ बोल लेते हैं पर कम पढ़ते हैं, उनके लिए उन्नत चीनी: अख़बार, राय-लेखन और सामाजिक मुद्दों पर बहस।"
outcomes:
  - en: "Discuss social and cultural topics in Chinese"
    zh: "用中文讨论社会和文化话题"
    zh-TW: "用中文討論社會和文化話題"
    ja: "社会や文化の話題を中国語で話し合う"
    ko: "사회·문화 주제를 중국어로 토론하기"
    vi: "Thảo luận chủ đề xã hội, văn hóa bằng tiếng Trung"
    ms: "Bincangkan topik sosial dan budaya dalam bahasa Cina"
    id: "Membahas topik sosial dan budaya dalam bahasa Mandarin"
    hi: "सामाजिक और सांस्कृतिक विषयों पर चीनी में चर्चा करना"
  - en: "Read and write longer Chinese texts"
    zh: "读写较长的中文文章"
    zh-TW: "讀寫較長的中文文章"
    ja: "長めの中国語の文章を読み書きする"
    ko: "긴 중국어 글 읽고 쓰기"
    vi: "Đọc và viết văn bản tiếng Trung dài hơn"
    ms: "Baca dan tulis teks bahasa Cina yang lebih panjang"
    id: "Membaca dan menulis teks bahasa Mandarin yang lebih panjang"
    hi: "लंबे चीनी पाठ पढ़ना-लिखना"
  - en: "Give a clear presentation in Chinese"
    zh: "用中文做清楚的口头报告"
    zh-TW: "用中文做清楚的口頭報告"
    ja: "中国語で分かりやすく発表する"
    ko: "중국어로 명확하게 발표하기"
    vi: "Thuyết trình rõ ràng bằng tiếng Trung"
    ms: "Buat pembentangan yang jelas dalam bahasa Cina"
    id: "Melakukan presentasi yang jelas dalam bahasa Mandarin"
    hi: "चीनी में स्पष्ट प्रस्तुति देना"
