code: ECON90034
year: 2027
learn:
  en: "Using economic theory to explain financial markets: payments, credit rationing, regulation and macro forces."
  zh: "用经济理论解释金融市场：支付系统、信贷配给、监管和宏观因素。"
  zh-TW: "用經濟理論解釋金融市場：支付系統、信用配給、監理與總體因素。"
  ja: "経済理論で金融市場を説明する：決済、信用割当、規制、マクロ要因。"
  ko: "경제이론으로 금융시장 설명하기: 지급결제, 신용할당, 규제, 거시 요인."
  vi: "Dùng lý thuyết kinh tế giải thích thị trường tài chính: thanh toán, phân bổ tín dụng, quản lý, yếu tố vĩ mô."
  ms: "Menggunakan teori ekonomi untuk menerangkan pasaran kewangan: pembayaran, catuan kredit, kawal selia, makro."
  id: "Memakai teori ekonomi untuk menjelaskan pasar keuangan: pembayaran, penjatahan kredit, regulasi, makro."
  hi: "आर्थिक सिद्धांत से वित्तीय बाज़ार समझाना: भुगतान, ऋण राशनिंग, नियमन और मैक्रो कारक।"
outcomes:
  - en: "Apply economic theory to share and financial markets"
    zh: "将经济理论用于股市和金融市场"
    zh-TW: "將經濟理論用於股市與金融市場"
    ja: "経済理論を株式・金融市場に当てはめる"
    ko: "경제이론을 주식·금융시장에 적용하기"
    vi: "Áp dụng lý thuyết kinh tế vào thị trường cổ phiếu, tài chính"
    ms: "Mengaplikasi teori ekonomi pada pasaran saham dan kewangan"
    id: "Menerapkan teori ekonomi pada pasar saham dan keuangan"
    hi: "शेयर और वित्तीय बाज़ारों पर आर्थिक सिद्धांत लागू करना"
  - en: "Evaluate macroeconomic policy on current issues"
    zh: "评估当前议题中的宏观经济政策"
    zh-TW: "評估當前議題中的總體經濟政策"
    ja: "時事に関するマクロ経済政策を評価する"
    ko: "현안에 대한 거시경제 정책 평가하기"
    vi: "Đánh giá chính sách kinh tế vĩ mô với vấn đề thời sự"
    ms: "Menilai dasar makroekonomi bagi isu semasa"
    id: "Mengevaluasi kebijakan makroekonomi atas isu terkini"
    hi: "मौजूदा मुद्दों पर मैक्रोआर्थिक नीति का मूल्यांकन"
