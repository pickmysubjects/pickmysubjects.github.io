code: MUSI20120
year: 2026
learn:
  en: "Music in 19th-century Paris, from Berlioz to the Ballets Russes: critics, concert societies, theatres and opera. Not offered in 2026."
  zh: "19世纪巴黎的音乐：从柏辽兹到俄罗斯芭蕾舞团，乐评、剧院与歌剧。2026年不开。"
  zh-TW: "19世紀巴黎的音樂：從白遼士到俄羅斯芭蕾舞團，樂評、劇院與歌劇。2026年不開。"
  ja: "19世紀パリの音楽：ベルリオーズからバレエ・リュスまで、批評・劇場・オペラ。2026年休講。"
  ko: "19세기 파리 음악: 베를리오즈부터 발레 뤼스까지, 비평·극장·오페라. 2026년 미개설."
  vi: "Âm nhạc Paris thế kỷ 19: từ Berlioz đến Ballets Russes, phê bình, nhà hát, opera. Không mở năm 2026."
  ms: "Muzik Paris abad ke-19: Berlioz hingga Ballets Russes, kritikan, teater, opera. Tiada pada 2026."
  id: "Musik Paris abad ke-19: dari Berlioz hingga Ballets Russes, kritik, teater, opera. Tidak dibuka 2026."
  hi: "19वीं सदी के पेरिस का संगीत: बर्लियोज़ से बैले रूस तक, आलोचना, थिएटर, ओपेरा। 2026 में नहीं।"
outcomes:
  - en: "Recognise key works by ear in a listening test"
    zh: "在聆听测验中辨认重要作品"
    zh-TW: "在聆聽測驗中辨認重要作品"
    ja: "聴音テストで主要作品を聴き分ける"
    ko: "청음 시험에서 주요 작품 알아듣기"
    vi: "Nhận ra tác phẩm chính qua bài nghe"
    ms: "Kenal pasti karya utama melalui ujian dengar"
    id: "Mengenali karya penting lewat tes mendengar"
    hi: "लिसनिंग टेस्ट में मुख्य रचनाएँ पहचानना"
  - en: "Read research critically and respond in writing"
    zh: "批判性阅读研究并书面回应"
    zh-TW: "批判性閱讀研究並書面回應"
    ja: "研究文献を批判的に読み、文章で応える"
    ko: "연구를 비판적으로 읽고 글로 답하기"
    vi: "Đọc nghiên cứu có phản biện và viết phản hồi"
    ms: "Baca kajian secara kritis dan balas secara bertulis"
    id: "Membaca riset secara kritis dan menanggapinya tertulis"
    hi: "शोध को आलोचनात्मक रूप से पढ़कर लिखित जवाब देना"
  - en: "Plan and write a research essay on music"
    zh: "规划并撰写一篇音乐研究论文"
    zh-TW: "規劃並撰寫一篇音樂研究論文"
    ja: "音楽に関する研究エッセイを計画し書く"
    ko: "음악에 관한 연구 에세이 기획·작성하기"
    vi: "Lên kế hoạch và viết bài luận nghiên cứu về âm nhạc"
    ms: "Rancang dan tulis esei kajian tentang muzik"
    id: "Merancang dan menulis esai riset tentang musik"
    hi: "संगीत पर शोध निबंध की योजना बनाकर लिखना"
