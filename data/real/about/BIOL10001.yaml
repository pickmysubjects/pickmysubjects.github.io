code: BIOL10001
year: 2026
learn:
  en: "Australia's plants and animals: how they evolved, how people changed their environments, and how to protect them."
  zh: "澳洲动植物怎样演化、人类怎样改变环境，以及怎样保护它们。"
outcomes:
  - en: "Identify and record plants and animals in the field"
    zh: "在野外辨认和记录动植物"
  - en: "Link native species' features to their survival"
    zh: "把本土物种特征和生存联系起来"
  - en: "Explain ways to conserve Australian wildlife"
    zh: "说明保护澳洲动植物的方法"
