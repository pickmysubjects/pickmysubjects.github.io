code: BIOL10001
year: 2026
learn:
  en: "Australia's plants and animals: how they evolved, how people changed their environments, and how to protect them."
  zh: "澳洲动植物怎样演化、人类怎样改变环境，以及怎样保护它们。"
  zh-TW: "澳洲動植物如何演化、人類如何改變環境，以及如何保護牠們。"
  ja: "オーストラリアの動植物：その進化、人間による環境の変化、保護の方法。"
  ko: "호주의 동식물: 어떻게 진화했고, 사람이 환경을 어떻게 바꿨으며, 어떻게 보호할지."
  vi: "Động thực vật Úc: tiến hóa ra sao, con người thay đổi môi trường thế nào, và cách bảo vệ chúng."
  ms: "Tumbuhan dan haiwan Australia: evolusinya, cara manusia ubah persekitarannya, dan cara melindunginya."
  id: "Tumbuhan dan hewan Australia: evolusinya, cara manusia mengubah lingkungannya, dan cara melindunginya."
  hi: "ऑस्ट्रेलिया के पेड़-पौधे और जानवर: वे कैसे विकसित हुए, इंसानों ने उनका माहौल कैसे बदला, और उन्हें कैसे बचाएँ।"
outcomes:
  - en: "Identify and record plants and animals in the field"
    zh: "在野外辨认和记录动植物"
    zh-TW: "在野外辨認和記錄動植物"
    ja: "野外で動植物を識別し記録する"
    ko: "야외에서 동식물 식별하고 기록하기"
    vi: "Nhận diện và ghi lại động thực vật ngoài thực địa"
    ms: "Kenal pasti dan rekod tumbuhan dan haiwan di lapangan"
    id: "Mengenali dan mencatat tumbuhan dan hewan di lapangan"
    hi: "फ़ील्ड में पेड़-पौधे और जानवर पहचानना व दर्ज करना"
  - en: "Link native species' features to their survival"
    zh: "把本土物种特征和生存联系起来"
    zh-TW: "把本土物種特徵和生存聯繫起來"
    ja: "在来種の特徴と生存を結びつける"
    ko: "토종 생물의 특징을 생존과 연결하기"
    vi: "Liên hệ đặc điểm loài bản địa với sự sống còn"
    ms: "Kaitkan ciri spesies asli dengan kemandiriannya"
    id: "Mengaitkan ciri spesies asli dengan kelangsungan hidupnya"
    hi: "देशी प्रजातियों की विशेषताओं को उनके जीवित रहने से जोड़ना"
  - en: "Explain ways to conserve Australian wildlife"
    zh: "说明保护澳洲动植物的方法"
    zh-TW: "說明保護澳洲動植物的方法"
    ja: "オーストラリアの野生生物を守る方法を説明する"
    ko: "호주 야생동식물 보전 방법 설명하기"
    vi: "Giải thích cách bảo tồn động vật hoang dã Úc"
    ms: "Terangkan cara memulihara hidupan liar Australia"
    id: "Menjelaskan cara melestarikan satwa liar Australia"
    hi: "ऑस्ट्रेलियाई वन्यजीवों को बचाने के तरीके बताना"
