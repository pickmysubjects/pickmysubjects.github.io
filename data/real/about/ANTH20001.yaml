code: ANTH20001
year: 2026
learn:
  en: "How different cultures shape and experience the human body, from body image and modification to illness, sport and healing."
  zh: "不同文化如何塑造和体验身体，从身体形象、改造到疾病、运动与疗愈。"
  zh-TW: "不同文化如何塑造和體驗身體，從身體形象、改造到疾病、運動與療癒。"
  ja: "身体イメージや身体改造から病、スポーツ、癒しまで、文化が身体をどう形づくり経験させるかを学ぶ。"
  ko: "신체 이미지와 신체 변형부터 질병, 스포츠, 치유까지 문화가 몸을 어떻게 만들고 경험하게 하는지 배운다."
  vi: "Các nền văn hóa định hình và trải nghiệm cơ thể ra sao, từ hình ảnh cơ thể, biến đổi cơ thể đến bệnh tật, thể thao và chữa lành."
  ms: "Cara budaya berbeza membentuk dan mengalami tubuh, daripada imej tubuh dan pengubahsuaian hingga penyakit, sukan dan penyembuhan."
  id: "Cara budaya yang berbeda membentuk dan mengalami tubuh, dari citra tubuh dan modifikasi hingga penyakit, olahraga, dan penyembuhan."
  hi: "अलग-अलग संस्कृतियाँ शरीर को कैसे गढ़ती और अनुभव करती हैं, शरीर की छवि और बदलाव से लेकर बीमारी, खेल और उपचार तक।"
outcomes:
  - en: "Compare how cultures understand the body"
    zh: "比较不同文化对身体的理解"
    zh-TW: "比較不同文化對身體的理解"
    ja: "文化ごとの身体の捉え方を比べる"
    ko: "문화별로 몸을 이해하는 방식 비교하기"
    vi: "So sánh cách các nền văn hóa hiểu về cơ thể"
    ms: "Bandingkan cara budaya memahami tubuh"
    id: "Membandingkan cara budaya memahami tubuh"
    hi: "संस्कृतियाँ शरीर को कैसे समझती हैं, तुलना करना"
  - en: "Discuss debates on body, mind and environment"
    zh: "讨论身体、心智与环境关系的争论"
    zh-TW: "討論身體、心智與環境關係的爭論"
    ja: "身体・心・環境をめぐる議論を論じる"
    ko: "몸, 마음, 환경을 둘러싼 논쟁 논의하기"
    vi: "Thảo luận các tranh luận về cơ thể, tâm trí và môi trường"
    ms: "Bincangkan perdebatan tentang tubuh, minda dan persekitaran"
    id: "Membahas perdebatan tentang tubuh, pikiran, dan lingkungan"
    hi: "शरीर, मन और परिवेश पर बहसों की चर्चा करना"
  - en: "Carry out a small piece of field research"
    zh: "完成一项小型田野调查"
    zh-TW: "完成一項小型田野調查"
    ja: "小規模なフィールド調査を行う"
    ko: "소규모 현장 조사 수행하기"
    vi: "Thực hiện một nghiên cứu thực địa nhỏ"
    ms: "Jalankan kajian lapangan berskala kecil"
    id: "Melakukan penelitian lapangan kecil"
    hi: "एक छोटा फील्ड रिसर्च करना"
