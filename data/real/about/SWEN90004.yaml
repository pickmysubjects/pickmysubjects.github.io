code: SWEN90004
year: 2027
learn:
  en: "Using maths models, like dynamical systems, agent-based models and networks, to analyse and verify complex software."
  zh: "用数学模型（动力系统、多智能体、网络等）分析和验证复杂软件系统。"
  zh-TW: "用數學模型（動態系統、代理人模型、網路等）分析與驗證複雜軟體系統。"
  ja: "力学系・エージェントモデル・ネットワークなど数理モデルで複雑なソフトを分析・検証。"
  ko: "동역학계·에이전트 모형·네트워크 등 수리 모형으로 복잡한 소프트웨어 분석·검증."
  vi: "Dùng mô hình toán như hệ động lực, mô hình tác tử, mạng lưới để phân tích và kiểm chứng phần mềm phức tạp."
  ms: "Guna model matematik seperti sistem dinamik, model agen dan rangkaian untuk analisis perisian kompleks."
  id: "Memakai model matematika seperti sistem dinamis, model agen, jaringan untuk menganalisis perangkat lunak."
  hi: "डायनेमिकल सिस्टम, एजेंट मॉडल, नेटवर्क जैसे गणितीय मॉडलों से जटिल सॉफ़्टवेयर का विश्लेषण।"
outcomes:
  - en: "Abstract a complex system into a model"
    zh: "把复杂系统抽象为模型"
    zh-TW: "把複雜系統抽象為模型"
    ja: "複雑なシステムをモデルに抽象化する"
    ko: "복잡한 시스템을 모델로 추상화하기"
    vi: "Trừu tượng hóa hệ thống phức tạp thành mô hình"
    ms: "Mengabstrak sistem kompleks menjadi model"
    id: "Mengabstraksi sistem kompleks menjadi model"
    hi: "जटिल सिस्टम को मॉडल में बदलना"
  - en: "Simulate and analyse concurrent and complex systems"
    zh: "模拟并分析并发与复杂系统"
    zh-TW: "模擬並分析並行與複雜系統"
    ja: "並行・複雑系をシミュレーションし分析する"
    ko: "동시성·복잡 시스템 시뮬레이션·분석하기"
    vi: "Mô phỏng và phân tích hệ thống đồng thời và phức tạp"
    ms: "Mensimulasi dan menganalisis sistem serentak dan kompleks"
    id: "Menyimulasikan dan menganalisis sistem konkuren dan kompleks"
    hi: "समवर्ती और जटिल सिस्टम सिमुलेट और विश्लेषण करना"
