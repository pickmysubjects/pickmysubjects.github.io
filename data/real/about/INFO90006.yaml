code: INFO90006
year: 2026
learn:
  en: "How to study people and their settings in the field, and turn what you find into design requirements for technology."
  zh: "如何实地研究用户及其环境，并把发现转化为技术设计需求。"
  zh-TW: "如何實地研究使用者及其環境，並把發現轉化為科技設計需求。"
  ja: "人々とその環境を現場で調べ、得た知見を技術の設計要件にする方法。"
  ko: "현장에서 사람과 환경을 연구하고, 그 결과를 기술 설계 요구사항으로 바꾸는 방법."
  vi: "Cách nghiên cứu con người và bối cảnh thực địa, rồi biến phát hiện thành yêu cầu thiết kế công nghệ."
  ms: "Cara mengkaji manusia dan persekitarannya di lapangan, lalu jadikan dapatan keperluan reka bentuk teknologi."
  id: "Cara meneliti orang dan lingkungannya di lapangan, lalu mengubah temuan jadi kebutuhan desain teknologi."
  hi: "लोगों और उनके माहौल को फ़ील्ड में समझना, और नतीजों को टेक्नोलॉजी की डिज़ाइन ज़रूरतों में बदलना।"
outcomes:
  - en: "Plan and run field studies with intended users"
    zh: "规划并开展面向目标用户的实地研究"
    zh-TW: "規劃並進行面向目標使用者的實地研究"
    ja: "想定ユーザーを対象にフィールド調査を計画・実施する"
    ko: "대상 사용자와 현장 연구 계획하고 진행하기"
    vi: "Lập kế hoạch và thực hiện nghiên cứu thực địa với người dùng"
    ms: "Rancang dan jalankan kajian lapangan dengan pengguna sasaran"
    id: "Merencanakan dan menjalankan studi lapangan dengan pengguna"
    hi: "लक्षित यूज़र्स के साथ फ़ील्ड स्टडी की योजना बनाना और करना"
  - en: "Analyse qualitative data such as interviews and notes"
    zh: "分析访谈、笔记等定性数据"
    zh-TW: "分析訪談、筆記等質性資料"
    ja: "インタビューやメモなどの質的データを分析する"
    ko: "인터뷰, 메모 같은 질적 데이터 분석하기"
    vi: "Phân tích dữ liệu định tính như phỏng vấn và ghi chép"
    ms: "Analisis data kualitatif seperti temu bual dan catatan"
    id: "Menganalisis data kualitatif seperti wawancara dan catatan"
    hi: "इंटरव्यू और नोट्स जैसे गुणात्मक डेटा का विश्लेषण करना"
  - en: "Turn findings into requirements and prototypes"
    zh: "把发现转化为需求和原型"
    zh-TW: "把發現轉化為需求和原型"
    ja: "調査結果を要件やプロトタイプにする"
    ko: "연구 결과를 요구사항과 프로토타입으로 만들기"
    vi: "Biến phát hiện thành yêu cầu và bản mẫu"
    ms: "Jadikan dapatan keperluan dan prototaip"
    id: "Mengubah temuan jadi kebutuhan dan prototipe"
    hi: "नतीजों को ज़रूरतों और प्रोटोटाइप में बदलना"
