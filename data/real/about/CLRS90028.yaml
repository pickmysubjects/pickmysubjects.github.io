code: CLRS90028
year: 2027
learn:
  en: "Designing, running and analysing randomised controlled trials, from randomisation to consent and monitoring."
  zh: "随机对照试验的设计、实施和分析，涵盖随机化、知情同意和监查。"
  zh-TW: "隨機對照試驗的設計、執行與分析，涵蓋隨機分派、知情同意與監測。"
  ja: "ランダム化比較試験の設計・実施・解析。割付、同意、モニタリングまで。"
  ko: "무작위 대조시험의 설계·수행·분석, 무작위 배정부터 동의·모니터링까지."
  vi: "Thiết kế, triển khai và phân tích thử nghiệm ngẫu nhiên có đối chứng."
  ms: "Mereka, menjalankan dan menganalisis ujian rawak terkawal."
  id: "Merancang, menjalankan, dan menganalisis uji acak terkontrol."
  hi: "रैंडमाइज़्ड कंट्रोल्ड ट्रायल की डिज़ाइन, संचालन और विश्लेषण, रैंडमाइज़ेशन से सहमति तक।"
outcomes:
  - en: "Design randomisation and blinding for a trial"
    zh: "设计试验的随机化与盲法"
    zh-TW: "設計試驗的隨機分派與盲性"
    ja: "試験の割付と盲検化を設計する"
    ko: "시험의 무작위 배정·눈가림 설계하기"
    vi: "Thiết kế ngẫu nhiên hóa và làm mù"
    ms: "Mereka rawak dan pembutaan ujian"
    id: "Merancang randomisasi dan blinding"
    hi: "ट्रायल के लिए रैंडमाइज़ेशन और ब्लाइंडिंग बनाना"
  - en: "Explain consent, quality and regulatory steps"
    zh: "解释知情同意、质量保证和监管流程"
    zh-TW: "解釋知情同意、品質保證與法規流程"
    ja: "同意・品質保証・規制の手順を説明する"
    ko: "동의·품질 보증·규제 절차 설명하기"
    vi: "Giải thích đồng thuận, chất lượng và quy định"
    ms: "Menerangkan persetujuan, kualiti dan kawal selia"
    id: "Menjelaskan persetujuan, mutu, dan regulasi"
    hi: "सहमति, गुणवत्ता और नियामक चरण समझाना"
  - en: "Manage and analyse trial data"
    zh: "管理和分析试验数据"
    zh-TW: "管理與分析試驗資料"
    ja: "試験データを管理・解析する"
    ko: "시험 데이터 관리·분석하기"
    vi: "Quản lý và phân tích dữ liệu thử nghiệm"
    ms: "Mengurus dan menganalisis data ujian"
    id: "Mengelola dan menganalisis data uji"
    hi: "ट्रायल डेटा का प्रबंधन और विश्लेषण"
