code: ORAL20003
year: 2026
learn:
  en: "Deeper oral health science for clinical work, including local anaesthesia, pharmacology and a group research project."
  zh: "更深入的临床口腔健康科学，包括局部麻醉、药理学和小组研究项目。"
  zh-TW: "更深入的臨床口腔健康科學，包括局部麻醉、藥理學與小組研究專題。"
  ja: "臨床に向けたより深い口腔保健科学。局所麻酔、薬理学、グループ研究を含む。"
  ko: "임상을 위한 심화 구강 보건 과학. 국소마취, 약리학, 그룹 연구 포함."
  vi: "Khoa học răng miệng chuyên sâu: gây tê tại chỗ, dược lý và dự án nhóm."
  ms: "Sains kesihatan mulut lanjutan: bius setempat, farmakologi dan projek kumpulan."
  id: "Sains kesehatan mulut lanjutan: anestesi lokal, farmakologi, dan proyek kelompok."
  hi: "क्लिनिकल काम के लिए गहरा विज्ञान: लोकल एनेस्थीसिया, फ़ार्माकोलॉजी और समूह शोध।"
outcomes:
  - en: "Give local anaesthesia safely"
    zh: "安全地实施局部麻醉"
    zh-TW: "安全地施行局部麻醉"
    ja: "安全に局所麻酔を行う"
    ko: "국소마취 안전하게 시행하기"
    vi: "Gây tê tại chỗ an toàn"
    ms: "Beri bius setempat dengan selamat"
    id: "Memberi anestesi lokal dengan aman"
    hi: "सुरक्षित लोकल एनेस्थीसिया देना"
  - en: "Explain drugs used in dental care"
    zh: "说明牙科护理中使用的药物"
    zh-TW: "說明牙科照護中使用的藥物"
    ja: "歯科で使う薬を説明する"
    ko: "치과에서 쓰는 약물 설명하기"
    vi: "Giải thích thuốc dùng trong nha khoa"
    ms: "Jelaskan ubat dalam rawatan gigi"
    id: "Menjelaskan obat dalam perawatan gigi"
    hi: "दंत देखभाल की दवाएँ समझाना"
  - en: "Research and present as a group"
    zh: "以小组形式研究并展示"
    zh-TW: "以小組形式研究並發表"
    ja: "グループで調べて発表する"
    ko: "그룹으로 조사·발표하기"
    vi: "Nghiên cứu và trình bày theo nhóm"
    ms: "Kaji dan bentang secara berkumpulan"
    id: "Meneliti dan mempresentasikan berkelompok"
    hi: "समूह में शोध और प्रस्तुति"
