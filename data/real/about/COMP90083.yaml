code: COMP90083
year: 2027
learn:
  en: "Designing, building and testing computer models and simulations of complex systems like epidemics or cities."
  zh: "设计、实现并评估流行病、城市等复杂系统的计算模型与仿真。"
  zh-TW: "設計、實作並評估流行病、城市等複雜系統的計算模型與模擬。"
  ja: "感染症や都市などの複雑系を計算モデル・シミュレーションで設計し評価する。"
  ko: "전염병·도시 같은 복잡계의 계산 모델과 시뮬레이션 설계·구현·평가."
  vi: "Thiết kế, xây và kiểm tra mô hình, mô phỏng hệ phức tạp như dịch bệnh, đô thị."
  ms: "Mereka, membina dan menguji model serta simulasi sistem kompleks seperti wabak atau bandar."
  id: "Merancang, membuat, dan menguji model serta simulasi sistem kompleks seperti epidemi atau kota."
  hi: "महामारी या शहरों जैसे जटिल सिस्टम के कंप्यूटर मॉडल और सिमुलेशन बनाना और जाँचना।"
outcomes:
  - en: "Build a simulation model of a complex system"
    zh: "构建复杂系统的仿真模型"
    zh-TW: "建立複雜系統的模擬模型"
    ja: "複雑系のシミュレーションモデルを作る"
    ko: "복잡계 시뮬레이션 모델 만들기"
    vi: "Xây mô hình mô phỏng hệ phức tạp"
    ms: "Bina model simulasi sistem kompleks"
    id: "Membuat model simulasi sistem kompleks"
    hi: "जटिल सिस्टम का सिमुलेशन मॉडल बनाना"
  - en: "Evaluate what a model can and can't tell you"
    zh: "评估模型能说明什么、不能说明什么"
    zh-TW: "評估模型能說明與不能說明的事"
    ja: "モデルで分かること・分からないことを評価する"
    ko: "모델로 알 수 있는 것과 없는 것 평가하기"
    vi: "Đánh giá mô hình cho biết gì và không cho biết gì"
    ms: "Nilai apa yang model boleh dan tak boleh tunjukkan"
    id: "Menilai apa yang bisa dan tidak bisa ditunjukkan model"
    hi: "मॉडल क्या बता सकता है और क्या नहीं, आंकना"
