code: DRAM30020
year: 2026
learn:
  en: "A one-week intensive in screen acting: scene work, screen tests and getting comfortable in front of the camera."
  zh: "一周集中的镜头表演课：片段排演、试镜，学会在镜头前自如表演。"
  zh-TW: "一週密集的鏡頭表演課：片段排練、試鏡，學會在鏡頭前自在表演。"
  ja: "1週間の映像演技集中講座。シーン練習やスクリーンテストでカメラの前に慣れる。"
  ko: "1주 집중 카메라 연기: 장면 연습, 스크린 테스트, 카메라 앞에서 편해지기."
  vi: "Khóa diễn xuất trước máy quay một tuần: tập cảnh, thử vai và tự tin trước ống kính."
  ms: "Kursus intensif seminggu lakonan kamera: latihan babak, uji bakat skrin dan selesa di depan kamera."
  id: "Kursus intensif seminggu akting kamera: latihan adegan, screen test dan nyaman di depan kamera."
  hi: "एक हफ़्ते का स्क्रीन एक्टिंग इंटेंसिव: सीन वर्क, स्क्रीन टेस्ट और कैमरे के सामने सहज होना।"
outcomes:
  - en: "Apply acting-for-camera techniques"
    zh: "运用镜头表演技巧"
    zh-TW: "運用鏡頭表演技巧"
    ja: "カメラ演技の技法を使う"
    ko: "카메라 연기 기법 적용하기"
    vi: "Áp dụng kỹ thuật diễn trước máy quay"
    ms: "Guna teknik lakonan untuk kamera"
    id: "Menerapkan teknik akting untuk kamera"
    hi: "कैमरे के लिए अभिनय की तकनीकें लागू करना"
  - en: "Analyse a script for a filmed scene"
    zh: "为拍摄场景分析剧本"
    zh-TW: "為拍攝場景分析劇本"
    ja: "撮影シーンのために脚本を分析する"
    ko: "촬영 장면을 위해 대본 분석하기"
    vi: "Phân tích kịch bản cho cảnh quay"
    ms: "Analisis skrip untuk babak yang dirakam"
    id: "Menganalisis naskah untuk adegan yang direkam"
    hi: "फ़िल्माए जाने वाले सीन की स्क्रिप्ट का विश्लेषण"
  - en: "Critically evaluate an on-camera performance"
    zh: "批判性评价镜头前的表演"
    zh-TW: "批判性評價鏡頭前的表演"
    ja: "カメラの前の演技を批評する"
    ko: "카메라 앞 연기 비평적으로 평가하기"
    vi: "Đánh giá phản biện một màn diễn trước máy quay"
    ms: "Nilai secara kritis lakonan di depan kamera"
    id: "Menilai kritis akting di depan kamera"
    hi: "कैमरे पर किए अभिनय का आलोचनात्मक मूल्यांकन"
