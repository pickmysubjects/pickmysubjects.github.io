code: MUSI30244
year: 2026
learn:
  en: "An auditioned chamber choir singing sacred and secular music from the 13th to the 21st century. Pass/fail."
  zh: "需试音的室内合唱团，演唱13至21世纪的宗教与世俗作品。及格制。"
  zh-TW: "需試音的室內合唱團，演唱13至21世紀的宗教與世俗作品。及格制。"
  ja: "オーディション制の室内合唱。13〜21世紀の宗教曲・世俗曲を歌う。合否判定。"
  ko: "오디션으로 뽑는 실내합창단. 13~21세기 종교·세속곡. 합격/불합격."
  vi: "Dàn hợp xướng thính phòng qua thử giọng, hát nhạc thế kỷ 13–21. Đạt/không đạt."
  ms: "Koir kamar melalui uji bakat, muzik abad ke-13 hingga ke-21. Lulus/gagal."
  id: "Paduan suara kamar lewat audisi, musik abad 13–21. Lulus/gagal."
  hi: "ऑडिशन वाला चैम्बर कोरस, 13वीं से 21वीं सदी का संगीत। पास/फ़ेल।"
outcomes:
  - en: "Sing with accurate tuning, breath and legato"
    zh: "以准确的音准、气息与连音演唱"
    zh-TW: "以準確的音準、氣息與連音演唱"
    ja: "正確な音程・呼吸・レガートで歌う"
    ko: "정확한 음정·호흡·레가토로 노래하기"
    vi: "Hát đúng cao độ, hơi thở và legato"
    ms: "Menyanyi dengan intonasi, nafas dan legato tepat"
    id: "Bernyanyi dengan intonasi, napas, legato tepat"
    hi: "सही सुर, साँस और लेगाटो के साथ गाना"
  - en: "Respond to a conductor and fellow singers"
    zh: "回应指挥与其他歌手"
    zh-TW: "回應指揮與其他歌手"
    ja: "指揮者と仲間の声に応える"
    ko: "지휘자와 동료 가수에게 반응하기"
    vi: "Phản hồi chỉ huy và bạn hát"
    ms: "Beri respons kepada konduktor dan rakan"
    id: "Merespons konduktor dan sesama penyanyi"
    hi: "संचालक और साथी गायकों के साथ तालमेल"
  - en: "Know choral styles across eight centuries"
    zh: "了解八个世纪的合唱风格"
    zh-TW: "了解八個世紀的合唱風格"
    ja: "8世紀にわたる合唱様式を知る"
    ko: "8세기에 걸친 합창 양식 알기"
    vi: "Hiểu phong cách hợp xướng qua tám thế kỷ"
    ms: "Kenal gaya koir merentas lapan abad"
    id: "Mengenal gaya paduan suara delapan abad"
    hi: "आठ सदियों की कोरस शैलियाँ जानना"
