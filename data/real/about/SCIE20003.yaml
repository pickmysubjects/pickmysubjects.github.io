code: SCIE20003
year: 2026
learn:
  en: "How nations set big goals and use diplomacy, economics, information and force to reach them: grand strategy and analysis."
  zh: "国家如何确立大目标，并运用外交、经济、信息和军事手段实现：大战略与分析。"
  zh-TW: "國家如何確立大目標，並運用外交、經濟、資訊和軍事手段實現：大戰略與分析。"
  ja: "国家が大きな目標を定め、外交・経済・情報・軍事でどう達成するか。大戦略とその分析。"
  ko: "국가가 큰 목표를 세우고 외교·경제·정보·군사로 이루는 방법: 대전략과 분석."
  vi: "Quốc gia đặt mục tiêu lớn và dùng ngoại giao, kinh tế, thông tin, quân sự để đạt được: đại chiến lược."
  ms: "Cara negara menetapkan matlamat besar dan menggunakan diplomasi, ekonomi, maklumat dan kuasa: strategi besar."
  id: "Cara negara menetapkan tujuan besar dan memakai diplomasi, ekonomi, informasi, dan kekuatan: strategi besar."
  hi: "देश बड़े लक्ष्य कैसे तय करते हैं और कूटनीति, अर्थव्यवस्था, सूचना व सैन्य शक्ति से उन्हें कैसे पाते हैं: ग्रैंड स्ट्रैटेजी।"
outcomes:
  - en: "Explain the core ideas of grand strategy"
    zh: "解释大战略的核心概念"
    zh-TW: "解釋大戰略的核心概念"
    ja: "大戦略の中心概念を説明する"
    ko: "대전략의 핵심 개념 설명하기"
    vi: "Giải thích ý tưởng cốt lõi của đại chiến lược"
    ms: "Terangkan idea teras strategi besar"
    id: "Menjelaskan gagasan inti strategi besar"
    hi: "ग्रैंड स्ट्रैटेजी के मूल विचार समझाना"
  - en: "Analyse a strategic problem with limited means"
    zh: "分析资源有限时的战略问题"
    zh-TW: "分析資源有限時的戰略問題"
    ja: "限られた手段で戦略課題を分析する"
    ko: "제한된 수단으로 전략 문제 분석하기"
    vi: "Phân tích vấn đề chiến lược với nguồn lực hạn chế"
    ms: "Analisis masalah strategik dengan sumber terhad"
    id: "Menganalisis masalah strategis dengan sumber terbatas"
    hi: "सीमित साधनों में रणनीतिक समस्या का विश्लेषण करना"
  - en: "Present a reasoned strategic assessment"
    zh: "做出有理有据的战略评估并展示"
    zh-TW: "做出有理有據的戰略評估並展示"
    ja: "根拠のある戦略評価を発表する"
    ko: "근거 있는 전략 평가 발표하기"
    vi: "Trình bày đánh giá chiến lược có lập luận"
    ms: "Bentang penilaian strategik yang berasas"
    id: "Mempresentasikan penilaian strategis yang beralasan"
    hi: "तर्कसंगत रणनीतिक आकलन प्रस्तुत करना"
