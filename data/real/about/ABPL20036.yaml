code: ABPL20036
year: 2026
learn:
  en: "How buildings use energy, water and air over their life: solar access, ventilation, envelope and services."
  zh: "建筑在全生命周期如何使用能源、水和空气：日照、通风、围护与设备。"
  zh-TW: "建築在全生命週期如何使用能源、水和空氣：日照、通風、外殼與設備。"
  ja: "建物が生涯でエネルギー・水・空気をどう使うか：日射、換気、外皮、設備。"
  ko: "건물이 생애 동안 에너지·물·공기를 쓰는 방식: 일조, 환기, 외피, 설비."
  vi: "Công trình dùng năng lượng, nước, không khí suốt vòng đời: nắng, thông gió, vỏ bao che, hệ thống kỹ thuật."
  ms: "Cara bangunan guna tenaga, air dan udara sepanjang hayat: cahaya matahari, pengudaraan, sampul dan servis."
  id: "Cara bangunan memakai energi, air, dan udara sepanjang umurnya: matahari, ventilasi, selubung, utilitas."
  hi: "इमारतें जीवन भर ऊर्जा, पानी, हवा कैसे इस्तेमाल करती हैं: धूप, वेंटिलेशन, आवरण, सर्विसेज़।"
outcomes:
  - en: "Explain the physics of building comfort"
    zh: "说明建筑舒适度背后的物理"
    zh-TW: "說明建築舒適度背後的物理"
    ja: "建物の快適性の物理を説明する"
    ko: "건물 쾌적성의 물리 설명하기"
    vi: "Giải thích vật lý của tiện nghi trong nhà"
    ms: "Jelaskan fizik keselesaan bangunan"
    id: "Menjelaskan fisika kenyamanan bangunan"
    hi: "इमारत के आराम के पीछे की भौतिकी समझाना"
  - en: "Estimate a building's environmental performance"
    zh: "估算建筑的环境性能"
    zh-TW: "估算建築的環境性能"
    ja: "建物の環境性能を見積もる"
    ko: "건물의 환경 성능 추정하기"
    vi: "Ước tính hiệu năng môi trường của công trình"
    ms: "Anggar prestasi alam sekitar bangunan"
    id: "Memperkirakan kinerja lingkungan bangunan"
    hi: "इमारत के पर्यावरणीय प्रदर्शन का अनुमान लगाना"
  - en: "Propose design changes to cut energy use"
    zh: "提出降低能耗的设计改进"
    zh-TW: "提出降低能耗的設計改進"
    ja: "省エネのための設計変更を提案する"
    ko: "에너지 절감을 위한 설계 변경 제안하기"
    vi: "Đề xuất thay đổi thiết kế để giảm năng lượng"
    ms: "Cadang perubahan reka bentuk untuk jimat tenaga"
    id: "Mengusulkan perubahan desain untuk hemat energi"
    hi: "ऊर्जा बचाने के लिए डिज़ाइन बदलाव सुझाना"
