code: GEOG30031
year: 2026
learn:
  en: "A four-week intensive on legal geography: how places like borders, camps and war zones shape, and are shaped by, law and justice."
  zh: "四周密集课，介绍法律地理学：边境、营地、战区等空间如何与法律和正义相互塑造。"
  zh-TW: "四週密集課，介紹法律地理學：邊境、營地、戰區等空間如何與法律和正義相互塑造。"
  ja: "4週間の集中授業で法地理学を学ぶ。国境、収容所、戦場などの場所が法や正義とどう影響し合うか。"
  ko: "4주 집중 수업으로 법지리학을 배운다. 국경, 수용소, 전쟁 지역 같은 공간이 법·정의와 어떻게 서로 영향을 주는가."
  vi: "Khóa 4 tuần về địa lý pháp lý: không gian như biên giới, trại, vùng chiến sự và pháp luật, công lý định hình lẫn nhau ra sao."
  ms: "Intensif empat minggu tentang geografi undang-undang: cara tempat seperti sempadan, kem dan zon perang saling membentuk dengan keadilan."
  id: "Intensif empat minggu tentang geografi hukum: cara tempat seperti perbatasan, kamp dan zona perang saling membentuk dengan keadilan."
  hi: "कानूनी भूगोल पर चार हफ़्ते का इंटेंसिव: सीमाएँ, शिविर और युद्ध क्षेत्र जैसी जगहें क़ानून व न्याय को कैसे गढ़ती और उनसे गढ़ी जाती हैं।"
outcomes:
  - en: "Explain how space and law shape each other"
    zh: "解释空间与法律如何相互塑造"
    zh-TW: "解釋空間與法律如何相互塑造"
    ja: "空間と法が互いをどう形作るか説明する"
    ko: "공간과 법이 서로를 만드는 방식 설명하기"
    vi: "Giải thích không gian và pháp luật định hình nhau ra sao"
    ms: "Terangkan cara ruang dan undang-undang saling membentuk"
    id: "Menjelaskan cara ruang dan hukum saling membentuk"
    hi: "जगह और क़ानून एक-दूसरे को कैसे गढ़ते हैं, समझाना"
  - en: "Analyse places of conflict and displacement"
    zh: "分析冲突与流离失所的空间"
    zh-TW: "分析衝突與流離失所的空間"
    ja: "紛争と強制移動の場を分析する"
    ko: "분쟁과 강제 이주의 공간 분석하기"
    vi: "Phân tích nơi xung đột và di dời"
    ms: "Analisis tempat konflik dan perpindahan paksa"
    id: "Menganalisis tempat konflik dan pengungsian"
    hi: "संघर्ष और विस्थापन वाली जगहों का विश्लेषण करना"
  - en: "Present a case study of a legal space"
    zh: "展示一个法律空间的案例研究"
    zh-TW: "展示一個法律空間的案例研究"
    ja: "法的空間の事例研究を発表する"
    ko: "법적 공간 사례 연구 발표하기"
    vi: "Trình bày tình huống về một không gian pháp lý"
    ms: "Bentangkan kajian kes satu ruang undang-undang"
    id: "Mempresentasikan studi kasus ruang hukum"
    hi: "किसी कानूनी स्थान पर केस स्टडी प्रस्तुत करना"
