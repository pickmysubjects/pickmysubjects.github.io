code: SCIE90034
year: 2027
learn:
  en: "Workplace communication for scientists: writing, speaking and working with people from many backgrounds."
  zh: "科学工作者的职场沟通：写作、口头表达，以及与不同背景的人合作。"
  zh-TW: "科學工作者的職場溝通：寫作、口語表達，以及與不同背景的人合作。"
  ja: "科学系の職場コミュニケーション：文章、話し方、多様な人との協働。"
  ko: "과학자를 위한 직장 커뮤니케이션: 글쓰기, 말하기, 다양한 배경의 사람과 협업."
  vi: "Giao tiếp nơi làm việc cho người làm khoa học: viết, nói, làm việc với người đa văn hóa."
  ms: "Komunikasi tempat kerja untuk saintis: menulis, bercakap dan bekerja dengan pelbagai latar belakang."
  id: "Komunikasi kerja untuk ilmuwan: menulis, berbicara, dan bekerja dengan beragam latar."
  hi: "वैज्ञानिकों के लिए कार्यस्थल संवाद: लिखना, बोलना, अलग पृष्ठभूमि के लोगों के साथ काम।"
outcomes:
  - en: "Write clear workplace documents and emails"
    zh: "撰写清晰的职场文件与邮件"
    zh-TW: "撰寫清楚的職場文件與電子郵件"
    ja: "分かりやすい職場文書やメールを書く"
    ko: "명확한 업무 문서와 이메일 쓰기"
    vi: "Viết tài liệu và email công việc rõ ràng"
    ms: "Menulis dokumen dan e-mel kerja yang jelas"
    id: "Menulis dokumen dan email kerja yang jelas"
    hi: "साफ़ ऑफ़िस दस्तावेज़ और ईमेल लिखना"
  - en: "Explain your analysis to different audiences"
    zh: "向不同受众讲清你的分析"
    zh-TW: "向不同對象說明你的分析"
    ja: "分析を相手に合わせて説明する"
    ko: "다양한 청중에게 분석 결과 설명하기"
    vi: "Giải thích phân tích cho nhiều đối tượng khác nhau"
    ms: "Menerangkan analisis kepada pelbagai khalayak"
    id: "Menjelaskan analisis ke berbagai audiens"
    hi: "अलग-अलग लोगों को अपना विश्लेषण समझाना"
