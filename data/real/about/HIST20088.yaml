code: HIST20088
year: 2026
learn:
  en: "Aboriginal history in Australia told through Charles Perkins's life: oral history, the Freedom Ride, land rights and self-determination."
  zh: "通过查尔斯·珀金斯的一生讲述澳洲原住民历史：口述史、自由乘车运动、土地权与自决。"
  zh-TW: "透過查爾斯·珀金斯的一生講述澳洲原住民歷史：口述史、自由乘車運動、土地權與自決。"
  ja: "チャールズ・パーキンスの生涯からオーストラリア先住民の歴史を学ぶ。オーラルヒストリー、フリーダム・ライド、土地権、自己決定。"
  ko: "찰스 퍼킨스의 삶으로 보는 호주 원주민 역사. 구술사, 프리덤 라이드, 토지권, 자기결정."
  vi: "Lịch sử thổ dân Úc qua cuộc đời Charles Perkins: lịch sử truyền miệng, Freedom Ride, quyền đất đai và quyền tự quyết."
  ms: "Sejarah Orang Asli Australia melalui kehidupan Charles Perkins: sejarah lisan, Freedom Ride, hak tanah dan penentuan nasib sendiri."
  id: "Sejarah Aborigin Australia lewat hidup Charles Perkins: sejarah lisan, Freedom Ride, hak atas tanah dan penentuan nasib sendiri."
  hi: "चार्ल्स पर्किन्स के जीवन से ऑस्ट्रेलिया का आदिवासी इतिहास: मौखिक इतिहास, फ़्रीडम राइड, भूमि अधिकार और आत्मनिर्णय।"
outcomes:
  - en: "Use oral history ethically as a source"
    zh: "以合乎伦理的方式使用口述史料"
    zh-TW: "以合乎倫理的方式使用口述史料"
    ja: "オーラルヒストリーを倫理的に史料として使う"
    ko: "구술사를 윤리적으로 사료로 활용하기"
    vi: "Dùng lịch sử truyền miệng làm nguồn một cách có đạo đức"
    ms: "Guna sejarah lisan sebagai sumber secara beretika"
    id: "Memakai sejarah lisan sebagai sumber secara etis"
    hi: "मौखिक इतिहास को नैतिक ढंग से स्रोत के रूप में इस्तेमाल करना"
  - en: "Explain key moments in Aboriginal political history"
    zh: "说明原住民政治史上的关键时刻"
    zh-TW: "說明原住民政治史上的關鍵時刻"
    ja: "先住民の政治史の重要な出来事を説明する"
    ko: "원주민 정치사의 주요 순간 설명하기"
    vi: "Giải thích các mốc chính trong lịch sử chính trị thổ dân"
    ms: "Terangkan detik penting sejarah politik Orang Asli"
    id: "Menjelaskan momen penting sejarah politik Aborigin"
    hi: "आदिवासी राजनीतिक इतिहास के अहम पल समझाना"
  - en: "Discuss whose stories shape national history"
    zh: "讨论谁的故事塑造了国家历史"
    zh-TW: "討論誰的故事塑造了國家歷史"
    ja: "誰の物語が国の歴史を形作るか議論する"
    ko: "누구의 이야기가 국가 역사를 만드는지 토론하기"
    vi: "Thảo luận câu chuyện của ai định hình lịch sử quốc gia"
    ms: "Bincangkan kisah siapa membentuk sejarah negara"
    id: "Membahas kisah siapa yang membentuk sejarah bangsa"
    hi: "चर्चा करना कि किसकी कहानियाँ राष्ट्रीय इतिहास गढ़ती हैं"
