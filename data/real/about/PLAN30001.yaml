code: PLAN30001
year: 2026
learn:
  en: "Scenario planning for cities: build plausible futures, such as climate change, and test planning decisions against them."
  zh: "城市情景规划：构建可能的未来（如气候变化），并用它们检验规划决策。"
  zh-TW: "都市情境規劃：建構可能的未來（如氣候變遷），並用它們檢驗規劃決策。"
  ja: "都市のシナリオプランニング。気候変動などあり得る未来を描き、計画判断を検証する。"
  ko: "도시 시나리오 계획: 기후변화 같은 가능한 미래를 그려 보고 계획 결정을 시험한다."
  vi: "Lập kịch bản cho đô thị: dựng các tương lai khả dĩ như biến đổi khí hậu và thử các quyết định quy hoạch."
  ms: "Perancangan senario bandar: bina masa depan yang munasabah, seperti perubahan iklim, dan uji keputusan perancangan."
  id: "Perencanaan skenario kota: menyusun masa depan yang masuk akal, misalnya perubahan iklim, dan menguji keputusan."
  hi: "शहरों की परिदृश्य योजना: जलवायु परिवर्तन जैसे संभावित भविष्य बनाकर योजना फ़ैसलों को परखना।"
outcomes:
  - en: "Identify key uncertainties for a city's future"
    zh: "找出影响城市未来的关键不确定因素"
    zh-TW: "找出影響城市未來的關鍵不確定因素"
    ja: "都市の将来を左右する不確実性を見つける"
    ko: "도시 미래의 핵심 불확실성 찾기"
    vi: "Xác định yếu tố bất định chính của đô thị"
    ms: "Kenal pasti ketidakpastian utama masa depan bandar"
    id: "Mengenali ketidakpastian utama masa depan kota"
    hi: "शहर के भविष्य की मुख्य अनिश्चितताएँ पहचानना"
  - en: "Build and compare future scenarios"
    zh: "构建并比较未来情景"
    zh-TW: "建構並比較未來情境"
    ja: "将来シナリオを作って比べる"
    ko: "미래 시나리오 만들고 비교하기"
    vi: "Xây dựng và so sánh các kịch bản tương lai"
    ms: "Bina dan banding senario masa depan"
    id: "Menyusun dan membandingkan skenario masa depan"
    hi: "भविष्य के परिदृश्य बनाना और तुलना करना"
  - en: "Turn scenarios into planning policy advice"
    zh: "把情景分析转化为规划政策建议"
    zh-TW: "把情境分析轉成規劃政策建議"
    ja: "シナリオを計画政策の提言にする"
    ko: "시나리오를 계획 정책 제안으로 바꾸기"
    vi: "Biến kịch bản thành đề xuất chính sách"
    ms: "Jadikan senario nasihat dasar perancangan"
    id: "Mengubah skenario jadi saran kebijakan"
    hi: "परिदृश्यों को योजना नीति सलाह में बदलना"
