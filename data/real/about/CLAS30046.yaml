code: CLAS30046
year: 2026
learn:
  en: "Advanced reading of Roman philosophical prose, its ties to Roman politics and society, and its reception in Late Latin."
  zh: "深入阅读罗马哲学散文，探讨其与罗马政治社会的关系，以及在后期拉丁语中的接受。"
  zh-TW: "深入閱讀羅馬哲學散文，探討其與羅馬政治社會的關係，以及在後期拉丁語中的接受。"
  ja: "ローマの哲学散文を上級レベルで読み、ローマの政治・社会との関係と後期ラテン語での受容を探る。"
  ko: "로마 철학 산문을 고급 수준으로 읽고 로마 정치·사회와의 관계, 후기 라틴어에서의 수용을 살핀다."
  vi: "Đọc nâng cao văn xuôi triết học La Mã, mối liên hệ với chính trị, xã hội La Mã và sự tiếp nhận trong Latinh muộn."
  ms: "Bacaan lanjutan prosa falsafah Rom, kaitannya dengan politik dan masyarakat Rom, serta penerimaannya dalam Latin Akhir."
  id: "Bacaan lanjut prosa filsafat Romawi, kaitannya dengan politik dan masyarakat Romawi, serta penerimaannya dalam Latin Akhir."
  hi: "रोमन दार्शनिक गद्य का उन्नत पठन, रोमन राजनीति व समाज से उसका रिश्ता, और उत्तर लैटिन में उसका ग्रहण।"
outcomes:
  - en: "Read original Latin texts with some dictionary help"
    zh: "借助词典阅读拉丁语原文"
    zh-TW: "藉助詞典閱讀拉丁語原文"
    ja: "辞書を使ってラテン語の原典を読む"
    ko: "사전을 활용해 라틴어 원문 읽기"
    vi: "Đọc nguyên bản tiếng Latinh với sự hỗ trợ của từ điển"
    ms: "Baca teks asal bahasa Latin dengan bantuan kamus"
    id: "Membaca teks asli bahasa Latin dengan bantuan kamus"
    hi: "शब्दकोश की मदद से मूल लैटिन पाठ पढ़ना"
  - en: "Analyse complex Latin grammar and sentence structure"
    zh: "分析复杂的拉丁语语法和句子结构"
    zh-TW: "分析複雜的拉丁語文法和句子結構"
    ja: "ラテン語の複雑な文法と構文を分析する"
    ko: "복잡한 라틴어 문법과 문장 구조 분석하기"
    vi: "Phân tích ngữ pháp và cấu trúc câu tiếng Latinh phức tạp"
    ms: "Analisis tatabahasa dan struktur ayat bahasa Latin yang kompleks"
    id: "Menganalisis tata bahasa dan struktur kalimat bahasa Latin yang rumit"
    hi: "जटिल लैटिन व्याकरण और वाक्य-रचना का विश्लेषण करना"
  - en: "Translate and interpret ancient literature"
    zh: "翻译并解读古代文学作品"
    zh-TW: "翻譯並解讀古代文學作品"
    ja: "古代の文学作品を訳し解釈する"
    ko: "고대 문학 작품 번역하고 해석하기"
    vi: "Dịch và diễn giải văn học cổ đại"
    ms: "Terjemah dan tafsir karya sastera kuno"
    id: "Menerjemahkan dan menafsirkan karya sastra kuno"
    hi: "प्राचीन साहित्य का अनुवाद और व्याख्या करना"
