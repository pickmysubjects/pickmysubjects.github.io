code: ARTS10004
year: 2026
learn:
  en: "Big public debates through philosophy, politics and economics: justice, equality, free markets, health care, climate and global duties."
  zh: "从哲学、政治和经济三个角度看重大公共议题：正义、平等、自由市场、医疗、气候和全球责任。"
  zh-TW: "從哲學、政治和經濟三個角度看重大公共議題：正義、平等、自由市場、醫療、氣候和全球責任。"
  ja: "哲学・政治・経済の視点から大きな公共の論争を考える。正義、平等、自由市場、医療、気候、国際的な責任。"
  ko: "철학·정치·경제의 시각으로 큰 공공 논쟁을 다룬다. 정의, 평등, 자유시장, 의료, 기후, 국제적 책임."
  vi: "Các tranh luận công lớn qua triết học, chính trị và kinh tế: công lý, bình đẳng, thị trường tự do, y tế, khí hậu và trách nhiệm toàn cầu."
  ms: "Perdebatan awam besar melalui falsafah, politik dan ekonomi: keadilan, kesaksamaan, pasaran bebas, kesihatan, iklim dan tanggungjawab global."
  id: "Debat publik besar lewat filsafat, politik dan ekonomi: keadilan, kesetaraan, pasar bebas, layanan kesehatan, iklim dan kewajiban global."
  hi: "दर्शन, राजनीति और अर्थशास्त्र से बड़ी सार्वजनिक बहसें: न्याय, समानता, मुक्त बाज़ार, स्वास्थ्य, जलवायु और वैश्विक कर्तव्य।"
outcomes:
  - en: "Use three disciplines to analyse a public issue"
    zh: "用三个学科的方法分析公共议题"
    zh-TW: "用三個學科的方法分析公共議題"
    ja: "3つの分野の方法で公共の問題を分析する"
    ko: "세 학문의 방법으로 공공 문제 분석하기"
    vi: "Dùng ba ngành học để phân tích một vấn đề công"
    ms: "Guna tiga disiplin untuk menganalisis isu awam"
    id: "Memakai tiga disiplin untuk menganalisis isu publik"
    hi: "तीन विषयों से किसी सार्वजनिक मुद्दे का विश्लेषण करना"
  - en: "Argue about justice, equality and freedom"
    zh: "就正义、平等和自由展开论证"
    zh-TW: "就正義、平等和自由展開論證"
    ja: "正義、平等、自由について論じる"
    ko: "정의, 평등, 자유에 대해 논증하기"
    vi: "Lập luận về công lý, bình đẳng và tự do"
    ms: "Berhujah tentang keadilan, kesaksamaan dan kebebasan"
    id: "Berargumen tentang keadilan, kesetaraan dan kebebasan"
    hi: "न्याय, समानता और स्वतंत्रता पर तर्क देना"
  - en: "Judge how resources should be shared"
    zh: "判断资源应如何分配"
    zh-TW: "判斷資源應如何分配"
    ja: "資源をどう分けるべきか判断する"
    ko: "자원을 어떻게 나눌지 판단하기"
    vi: "Đánh giá nên phân chia nguồn lực ra sao"
    ms: "Nilai cara sumber patut diagihkan"
    id: "Menilai bagaimana sumber daya harus dibagi"
    hi: "तय करना कि संसाधन कैसे बाँटे जाएँ"
