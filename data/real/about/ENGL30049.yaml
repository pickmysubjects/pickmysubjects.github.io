code: ENGL30049
year: 2026
learn:
  en: "Major modern Irish writers, from Swift and Yeats to Joyce, Beckett and Heaney, and the history they wrote through."
  zh: "斯威夫特、叶芝、乔伊斯、贝克特和希尼等现代爱尔兰重要作家，以及他们所处的历史。"
  zh-TW: "斯威夫特、葉慈、喬伊斯、貝克特和希尼等現代愛爾蘭重要作家，以及他們所處的歷史。"
  ja: "スウィフト、イェイツからジョイス、ベケット、ヒーニーまで、近代アイルランドの主要作家とその時代を学ぶ。"
  ko: "스위프트, 예이츠부터 조이스, 베케트, 히니까지 현대 아일랜드 주요 작가와 그 시대를 배운다."
  vi: "Các nhà văn Ireland hiện đại lớn, từ Swift, Yeats đến Joyce, Beckett, Heaney, và lịch sử họ đã trải qua."
  ms: "Penulis Ireland moden utama, dari Swift dan Yeats hingga Joyce, Beckett dan Heaney, serta sejarah zaman mereka."
  id: "Penulis Irlandia modern utama, dari Swift dan Yeats hingga Joyce, Beckett dan Heaney, serta sejarah yang mereka alami."
  hi: "स्विफ़्ट और येट्स से जॉयस, बेकेट और हीनी तक आधुनिक आयरलैंड के बड़े लेखक, और वह इतिहास जिससे वे गुज़रे।"
outcomes:
  - en: "Describe key Irish writers and their works"
    zh: "介绍重要的爱尔兰作家及其作品"
    zh-TW: "介紹重要的愛爾蘭作家及其作品"
    ja: "主なアイルランド作家と作品を説明する"
    ko: "주요 아일랜드 작가와 작품 설명하기"
    vi: "Mô tả các nhà văn Ireland chính và tác phẩm"
    ms: "Huraikan penulis Ireland utama dan karya mereka"
    id: "Menguraikan penulis Irlandia utama dan karyanya"
    hi: "मुख्य आयरिश लेखकों और उनकी रचनाओं का वर्णन करना"
  - en: "Link Irish writing to colonialism and politics"
    zh: "把爱尔兰文学与殖民和政治联系起来"
    zh-TW: "把愛爾蘭文學與殖民和政治聯繫起來"
    ja: "アイルランド文学を植民地支配や政治と結びつける"
    ko: "아일랜드 문학을 식민주의·정치와 연결하기"
    vi: "Liên hệ văn học Ireland với chủ nghĩa thực dân và chính trị"
    ms: "Kaitkan penulisan Ireland dengan kolonialisme dan politik"
    id: "Mengaitkan sastra Irlandia dengan kolonialisme dan politik"
    hi: "आयरिश लेखन को उपनिवेशवाद और राजनीति से जोड़ना"
  - en: "Write close readings of Irish texts"
    zh: "对爱尔兰作品进行细读写作"
    zh-TW: "對愛爾蘭作品進行細讀寫作"
    ja: "アイルランドの作品の精読を書く"
    ko: "아일랜드 작품을 꼼꼼히 읽고 글쓰기"
    vi: "Viết bài đọc kỹ về văn bản Ireland"
    ms: "Tulis bacaan rapi teks Ireland"
    id: "Menulis pembacaan cermat atas teks Irlandia"
    hi: "आयरिश पाठों की बारीक पढ़त लिखना"
