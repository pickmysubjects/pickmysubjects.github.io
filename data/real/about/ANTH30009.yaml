code: ANTH30009
year: 2026
learn:
  en: "How cultures see nature and their place in it: ecological knowledge, land, animals, and whether 'nature' and 'culture' really split."
  zh: "不同文化如何看待自然及人在其中的位置：生态知识、土地、动物，以及“自然”与“文化”是否真能分开。"
  zh-TW: "不同文化如何看待自然及人在其中的位置：生態知識、土地、動物，以及「自然」與「文化」是否真能分開。"
  ja: "文化は自然と自らの位置をどう捉えるか。生態知、土地、動物、そして「自然」と「文化」は本当に分けられるのか。"
  ko: "여러 문화가 자연과 그 속의 인간을 어떻게 보는가. 생태 지식, 땅, 동물, 그리고 '자연'과 '문화'는 정말 나뉘는가."
  vi: "Các nền văn hóa nhìn thiên nhiên và vị trí con người ra sao: tri thức sinh thái, đất đai, động vật, và ranh giới tự nhiên–văn hóa."
  ms: "Cara budaya melihat alam dan tempat manusia: pengetahuan ekologi, tanah, haiwan, dan sama ada 'alam' dan 'budaya' benar-benar terpisah."
  id: "Cara budaya memandang alam dan tempat manusia: pengetahuan ekologis, tanah, hewan, dan apakah 'alam' dan 'budaya' benar terpisah."
  hi: "संस्कृतियाँ प्रकृति और उसमें अपनी जगह को कैसे देखती हैं: पारिस्थितिक ज्ञान, ज़मीन, जानवर, और क्या 'प्रकृति' व 'संस्कृति' सच में अलग हैं।"
outcomes:
  - en: "Compare how societies understand the natural world"
    zh: "比较不同社会对自然界的理解"
    zh-TW: "比較不同社會對自然界的理解"
    ja: "社会ごとの自然理解を比べる"
    ko: "사회마다 자연을 이해하는 방식 비교하기"
    vi: "So sánh cách các xã hội hiểu thế giới tự nhiên"
    ms: "Bandingkan cara masyarakat memahami alam"
    id: "Membandingkan cara masyarakat memahami alam"
    hi: "समाज प्रकृति को कैसे समझते हैं, इसकी तुलना करना"
  - en: "Question the divide between nature and culture"
    zh: "质疑自然与文化的二分"
    zh-TW: "質疑自然與文化的二分"
    ja: "自然と文化の二分法を問い直す"
    ko: "자연과 문화의 이분법에 질문하기"
    vi: "Đặt câu hỏi về sự tách biệt tự nhiên và văn hóa"
    ms: "Persoalkan pemisahan antara alam dan budaya"
    id: "Mempertanyakan pemisahan alam dan budaya"
    hi: "प्रकृति और संस्कृति के बँटवारे पर सवाल उठाना"
  - en: "Relate these ideas to today's environmental crises"
    zh: "把这些观点与当今环境危机联系起来"
    zh-TW: "把這些觀點與當今環境危機聯繫起來"
    ja: "これらの考えを現代の環境危機と結びつける"
    ko: "이 생각들을 오늘날 환경 위기와 연결하기"
    vi: "Liên hệ các ý tưởng với khủng hoảng môi trường hiện nay"
    ms: "Kaitkan idea ini dengan krisis alam sekitar kini"
    id: "Mengaitkan gagasan ini dengan krisis lingkungan kini"
    hi: "इन विचारों को आज के पर्यावरण संकटों से जोड़ना"
