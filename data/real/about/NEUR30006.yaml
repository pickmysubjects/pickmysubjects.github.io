code: NEUR30006
year: 2026
learn:
  en: "How real and artificial neural networks learn, and building your own network in Python."
  zh: "真实和人工神经网络怎么学习，并用 Python 自己搭一个。"
  zh-TW: "真實和人工神經網路怎麼學習，並用 Python 自己搭一個。"
  ja: "実際の神経回路と人工ニューラルネットの学習の仕組み、そしてPythonで自作する。"
  ko: "실제 신경망과 인공 신경망의 학습 방식, 그리고 Python으로 직접 만들기."
  vi: "Mạng nơ-ron thật và nhân tạo học ra sao, và tự xây mạng bằng Python."
  ms: "Cara rangkaian neural sebenar dan buatan belajar, serta membina rangkaian sendiri dalam Python."
  id: "Cara jaringan saraf asli dan buatan belajar, serta membuat jaringan sendiri dengan Python."
  hi: "असली और कृत्रिम न्यूरल नेटवर्क कैसे सीखते हैं, और Python में अपना नेटवर्क बनाना।"
outcomes:
  - en: "Program in Python with Jupyter notebooks"
    zh: "用Jupyter写Python程序"
    zh-TW: "用 Jupyter 寫 Python 程式"
    ja: "JupyterノートブックでPythonを書く"
    ko: "Jupyter 노트북으로 Python 프로그래밍하기"
    vi: "Lập trình Python với Jupyter notebook"
    ms: "Memprogram Python dengan Jupyter notebook"
    id: "Memprogram Python dengan Jupyter notebook"
    hi: "Jupyter नोटबुक में Python प्रोग्रामिंग"
  - en: "Build a neural network that learns from a large dataset"
    zh: "搭一个从大数据中学习的神经网络"
    zh-TW: "搭一個從大量資料中學習的神經網路"
    ja: "大規模データから学ぶニューラルネットを作る"
    ko: "대용량 데이터로 학습하는 신경망 만들기"
    vi: "Xây mạng nơ-ron học từ bộ dữ liệu lớn"
    ms: "Membina rangkaian neural yang belajar daripada set data besar"
    id: "Membuat jaringan saraf yang belajar dari data set besar"
    hi: "बड़े डेटासेट से सीखने वाला न्यूरल नेटवर्क बनाना"
  - en: "Visualise and evaluate how well your network works"
    zh: "可视化并评估网络的效果"
    zh-TW: "視覺化並評估網路的效果"
    ja: "ネットワークの性能を可視化し評価する"
    ko: "신경망의 성능을 시각화하고 평가하기"
    vi: "Trực quan hóa và đánh giá mạng hoạt động tốt đến đâu"
    ms: "Memvisualkan dan menilai prestasi rangkaian anda"
    id: "Memvisualisasikan dan menilai kinerja jaringanmu"
    hi: "अपने नेटवर्क के प्रदर्शन को दिखाना और आँकना"
