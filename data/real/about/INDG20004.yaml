code: INDG20004
year: 2026
learn:
  en: "Reading race critically: how Indigeneity and whiteness are shown in Australian books, media, film and art, using race and whiteness theory."
  zh: "批判性地解读种族：澳洲书籍、媒体、电影和艺术如何呈现原住民性与白人性，运用种族与白人性理论。"
  zh-TW: "批判性地解讀種族：澳洲書籍、媒體、電影和藝術如何呈現原住民性與白人性，運用種族與白人性理論。"
  ja: "人種を批判的に読む。オーストラリアの本、メディア、映画、美術で先住民性と白人性がどう描かれるかを、人種・白人性研究で分析。"
  ko: "인종을 비판적으로 읽기. 호주의 책, 미디어, 영화, 미술이 원주민성과 백인성을 어떻게 그리는지 인종·백인성 이론으로 분석."
  vi: "Đọc chủng tộc một cách phản biện: tính bản địa và tính da trắng được thể hiện ra sao trong sách, truyền thông, phim, nghệ thuật Úc."
  ms: "Membaca kaum secara kritis: cara keaslian dan keputihan digambarkan dalam buku, media, filem dan seni Australia, dengan teori kaum."
  id: "Membaca ras secara kritis: cara kepribumian dan keputihan ditampilkan dalam buku, media, film dan seni Australia, dengan teori ras."
  hi: "नस्ल को आलोचनात्मक ढंग से पढ़ना: ऑस्ट्रेलियाई किताबों, मीडिया, फ़िल्म और कला में आदिवासियत और श्वेतता कैसे दिखती है।"
outcomes:
  - en: "Read race in texts, images and media"
    zh: "解读文本、图像和媒体中的种族"
    zh-TW: "解讀文本、圖像和媒體中的種族"
    ja: "テクスト、画像、メディアの中の人種を読む"
    ko: "텍스트, 이미지, 미디어 속 인종 읽기"
    vi: "Đọc vấn đề chủng tộc trong văn bản, hình ảnh, truyền thông"
    ms: "Tafsir isu kaum dalam teks, imej dan media"
    id: "Membaca ras dalam teks, gambar dan media"
    hi: "पाठ, चित्र और मीडिया में नस्ल को पढ़ना"
  - en: "Apply race and whiteness theory"
    zh: "运用种族与白人性理论"
    zh-TW: "運用種族與白人性理論"
    ja: "人種・白人性の理論を当てはめる"
    ko: "인종·백인성 이론 적용하기"
    vi: "Áp dụng lý thuyết chủng tộc và tính da trắng"
    ms: "Gunakan teori kaum dan keputihan"
    id: "Menerapkan teori ras dan keputihan"
    hi: "नस्ल और श्वेतता सिद्धांत लागू करना"
  - en: "Reflect on your own position on race"
    zh: "反思自己在种族问题上的位置"
    zh-TW: "反思自己在種族問題上的位置"
    ja: "人種をめぐる自分の立場を振り返る"
    ko: "인종 문제에서 자신의 위치 성찰하기"
    vi: "Suy ngẫm vị trí của bản thân về chủng tộc"
    ms: "Renungkan kedudukan diri dalam isu kaum"
    id: "Merefleksikan posisi diri soal ras"
    hi: "नस्ल के सवाल पर अपनी स्थिति पर विचार करना"
