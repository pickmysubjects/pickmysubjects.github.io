code: LING20009
year: 2026
learn:
  en: "The role of language in Aboriginal Australian societies, past and present, and what Australia's languages have in common."
  zh: "语言在澳大利亚原住民社会中过去和现在的作用，以及澳洲各语言的共同特点。"
  zh-TW: "語言在澳洲原住民社會中過去和現在的作用，以及澳洲各語言的共同特點。"
  ja: "アボリジナル社会で言語が昔と今に果たす役割と、オーストラリアの言語に共通する特徴を学ぶ。"
  ko: "호주 원주민 사회에서 언어가 과거와 현재에 맡는 역할, 호주 언어들의 공통 특징을 배운다."
  vi: "Vai trò của ngôn ngữ trong xã hội thổ dân Úc xưa và nay, cùng những đặc điểm chung của các ngôn ngữ Úc."
  ms: "Peranan bahasa dalam masyarakat Orang Asli Australia, dahulu dan kini, serta ciri yang dikongsi bahasa-bahasa Australia."
  id: "Peran bahasa dalam masyarakat Aborigin Australia, dulu dan kini, serta ciri yang dimiliki bersama bahasa-bahasa Australia."
  hi: "ऑस्ट्रेलिया के आदिवासी समाजों में भाषा की भूमिका, पहले और आज, और ऑस्ट्रेलियाई भाषाओं की साझा विशेषताएँ।"
outcomes:
  - en: "Explain the role of language in Aboriginal Australia"
    zh: "说明语言在原住民社会中的作用"
    zh-TW: "說明語言在原住民社會中的作用"
    ja: "アボリジナル社会での言語の役割を説明する"
    ko: "호주 원주민 사회에서 언어의 역할 설명하기"
    vi: "Giải thích vai trò của ngôn ngữ trong xã hội thổ dân Úc"
    ms: "Terangkan peranan bahasa dalam masyarakat Orang Asli Australia"
    id: "Menjelaskan peran bahasa dalam masyarakat Aborigin"
    hi: "आदिवासी ऑस्ट्रेलिया में भाषा की भूमिका समझाना"
  - en: "Describe common features of Australian languages"
    zh: "描述澳洲语言的共同特征"
    zh-TW: "描述澳洲語言的共同特徵"
    ja: "オーストラリアの言語に共通する特徴を説明する"
    ko: "호주 언어들의 공통 특징 설명하기"
    vi: "Mô tả các đặc điểm chung của ngôn ngữ Úc"
    ms: "Huraikan ciri umum bahasa Australia"
    id: "Menguraikan ciri umum bahasa-bahasa Australia"
    hi: "ऑस्ट्रेलियाई भाषाओं की साझा विशेषताओं का वर्णन करना"
  - en: "Show how social factors shape language use"
    zh: "说明社会因素如何影响语言使用"
    zh-TW: "說明社會因素如何影響語言使用"
    ja: "社会的要因が言語使用にどう影響するか示す"
    ko: "사회적 요인이 언어 사용에 미치는 영향 보여 주기"
    vi: "Chỉ ra yếu tố xã hội ảnh hưởng cách dùng ngôn ngữ ra sao"
    ms: "Tunjukkan cara faktor sosial membentuk penggunaan bahasa"
    id: "Menunjukkan cara faktor sosial membentuk pemakaian bahasa"
    hi: "सामाजिक कारक भाषा के इस्तेमाल को कैसे आकार देते हैं, दिखाना"
