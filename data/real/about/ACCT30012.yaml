code: ACCT30012
year: 2026
learn:
  en: "How organisations report on environmental, social and governance (ESG) matters, and how that information gets used."
  zh: "组织如何披露环境、社会和治理（ESG）信息，以及这些信息如何被使用。"
  zh-TW: "組織如何揭露環境、社會與治理（ESG）資訊，以及這些資訊如何被運用。"
  ja: "組織が環境・社会・ガバナンス（ESG）をどう報告し、その情報がどう使われるか。"
  ko: "조직이 환경·사회·지배구조(ESG)를 어떻게 보고하고 그 정보가 어떻게 쓰이는지."
  vi: "Tổ chức báo cáo về môi trường, xã hội và quản trị (ESG) ra sao, và thông tin đó được dùng thế nào."
  ms: "Cara organisasi melapor isu alam sekitar, sosial dan tadbir urus (ESG), dan cara maklumat itu digunakan."
  id: "Cara organisasi melaporkan aspek lingkungan, sosial, dan tata kelola (ESG), serta cara informasi itu dipakai."
  hi: "संगठन पर्यावरण, सामाजिक और गवर्नेंस (ESG) मामलों की रिपोर्ट कैसे देते हैं और वह जानकारी कैसे इस्तेमाल होती है।"
outcomes:
  - en: "Compare frameworks for sustainability reporting"
    zh: "比较各种可持续发展报告框架"
    zh-TW: "比較各種永續報告框架"
    ja: "サステナビリティ報告の枠組みを比べる"
    ko: "지속가능성 보고 체계 비교"
    vi: "So sánh các khung báo cáo bền vững"
    ms: "Banding rangka kerja pelaporan kelestarian"
    id: "Membandingkan kerangka pelaporan keberlanjutan"
    hi: "सस्टेनेबिलिटी रिपोर्टिंग के फ़्रेमवर्क की तुलना"
  - en: "Judge the quality of a firm's ESG disclosures"
    zh: "判断企业ESG披露的质量"
    zh-TW: "判斷企業ESG揭露的品質"
    ja: "企業のESG開示の質を判断する"
    ko: "기업 ESG 공시의 질 판단"
    vi: "Đánh giá chất lượng công bố ESG của doanh nghiệp"
    ms: "Nilai kualiti pendedahan ESG sesebuah firma"
    id: "Menilai kualitas pengungkapan ESG perusahaan"
    hi: "किसी कंपनी के ESG खुलासों की गुणवत्ता परखना"
  - en: "Explain how investors use sustainability information"
    zh: "解释投资者如何使用可持续信息"
    zh-TW: "說明投資人如何運用永續資訊"
    ja: "投資家がサステナビリティ情報をどう使うか説明する"
    ko: "투자자가 지속가능성 정보를 쓰는 방식 설명"
    vi: "Giải thích nhà đầu tư dùng thông tin bền vững ra sao"
    ms: "Terangkan cara pelabur guna maklumat kelestarian"
    id: "Menjelaskan cara investor memakai informasi keberlanjutan"
    hi: "समझाना कि निवेशक सस्टेनेबिलिटी जानकारी कैसे इस्तेमाल करते हैं"
