code: ABPL90020
year: 2027
learn:
  en: "Recording historic buildings by hand and with photogrammetry and 3D laser scanning, then producing measured drawings."
  zh: "用手工测绘、摄影测量和三维激光扫描记录历史建筑，并绘制测绘图。"
  zh-TW: "用手工測繪、攝影測量和三維雷射掃描記錄歷史建築，並繪製測繪圖。"
  ja: "手作業や写真測量・3Dレーザースキャンで歴史的建物を記録し、実測図を作成する。"
  ko: "수작업과 사진측량, 3D 레이저 스캐닝으로 역사적 건물을 기록하고 실측 도면을 작성합니다."
  vi: "Ghi lại công trình lịch sử bằng tay, đo ảnh và quét laser 3D, rồi vẽ bản vẽ đo đạc."
  ms: "Merekod bangunan bersejarah secara manual dan dengan fotogrametri serta imbasan laser 3D, lalu menghasilkan lukisan terukur."
  id: "Merekam bangunan bersejarah secara manual serta dengan fotogrametri dan pemindaian laser 3D, lalu membuat gambar terukur."
  hi: "हाथ से, फ़ोटोग्रामेट्री और 3D लेज़र स्कैनिंग से ऐतिहासिक इमारतों को दर्ज करना और मापित ड्रॉइंग बनाना।"
outcomes:
  - en: "Record existing and historic buildings accurately"
    zh: "准确记录现有和历史建筑"
    zh-TW: "準確記錄現有與歷史建築"
    ja: "既存・歴史的建物を正確に記録する"
    ko: "기존 및 역사적 건물을 정확히 기록하기"
    vi: "Ghi lại chính xác công trình hiện có và lịch sử"
    ms: "Merekod bangunan sedia ada dan bersejarah dengan tepat"
    id: "Merekam bangunan lama dan bersejarah secara akurat"
    hi: "मौजूदा और ऐतिहासिक इमारतों को सटीक रूप से दर्ज करना"
  - en: "Reflect on measured drawing and digital heritage practice"
    zh: "反思测绘制图和数字遗产记录的做法"
    zh-TW: "反思測繪製圖與數位遺產記錄的做法"
    ja: "実測図とデジタル遺産記録の実践を考察する"
    ko: "실측 도면과 디지털 유산 기록 방식 성찰하기"
    vi: "Suy ngẫm về đo vẽ và số hóa di sản"
    ms: "Merenung amalan lukisan terukur dan warisan digital"
    id: "Merefleksikan praktik gambar terukur dan warisan digital"
    hi: "मापित ड्रॉइंग और डिजिटल धरोहर पद्धति पर विचार"
