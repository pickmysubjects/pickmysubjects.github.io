code: ABPL90022
year: 2027
learn:
  en: "How urban planning helps cities prepare for and recover from heat, flood, fire and sea level rise, with site visits."
  zh: "城市规划如何帮助城市应对和恢复高温、洪水、火灾和海平面上升，含实地考察。"
  zh-TW: "都市規劃如何協助城市因應與復原高溫、洪水、火災與海平面上升，含實地參訪。"
  ja: "猛暑・洪水・火災・海面上昇への備えと復興に都市計画がどう役立つか。現地見学あり。"
  ko: "폭염·홍수·화재·해수면 상승 대비와 복구에서 도시계획의 역할. 현장 답사 포함."
  vi: "Quy hoạch đô thị giúp chuẩn bị và phục hồi trước nắng nóng, lũ, cháy, nước biển dâng."
  ms: "Cara perancangan bandar membantu bersedia dan pulih daripada banjir, kebakaran dan haba."
  id: "Cara perencanaan kota membantu bersiap dan pulih dari banjir, kebakaran dan panas ekstrem."
  hi: "गर्मी, बाढ़, आग और समुद्र-स्तर वृद्धि से निपटने में शहरी नियोजन की भूमिका, साइट विज़िट सहित।"
outcomes:
  - en: "Explain key frameworks for disaster resilience planning"
    zh: "解释防灾韧性规划的主要框架"
    zh-TW: "解釋防災韌性規劃的主要架構"
    ja: "防災レジリエンス計画の枠組みを説明する"
    ko: "재난 회복력 계획의 핵심 틀 설명하기"
    vi: "Giải thích các khung quy hoạch chống chịu thiên tai"
    ms: "Menerangkan rangka kerja perancangan daya tahan bencana"
    id: "Menjelaskan kerangka perencanaan ketahanan bencana"
    hi: "आपदा लचीलापन योजना के प्रमुख ढाँचे समझाना"
  - en: "Assess how unequally disaster risk affects communities"
    zh: "评估灾害风险对不同社区的不均衡影响"
    zh-TW: "評估災害風險對不同社區的不均影響"
    ja: "災害リスクの不平等な影響を評価する"
    ko: "재난 위험의 불평등한 영향 평가하기"
    vi: "Đánh giá rủi ro thiên tai bất bình đẳng"
    ms: "Menilai ketidaksamaan kesan risiko bencana"
    id: "Menilai dampak risiko bencana yang tidak merata"
    hi: "आपदा जोखिम के असमान प्रभाव का आकलन"
