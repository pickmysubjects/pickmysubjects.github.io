code: HPSC20015
year: 2026
learn:
  en: "How cultures from East Asia to Australia studied the sky, with simple observations and a look at historical instruments."
  zh: "从东亚到澳大利亚，不同文化如何研究天空，包括简单观测和历史仪器。"
  zh-TW: "從東亞到澳洲，不同文化如何研究天空，包括簡單觀測和歷史儀器。"
  ja: "東アジアからオーストラリアまで、文化ごとに空をどう研究したかを、簡単な観測と歴史的な器具から学ぶ。"
  ko: "동아시아부터 호주까지 여러 문화가 하늘을 어떻게 연구했는지 간단한 관측과 옛 기구로 배운다."
  vi: "Các nền văn hóa từ Đông Á đến Úc nghiên cứu bầu trời ra sao, qua quan sát đơn giản và các dụng cụ lịch sử."
  ms: "Cara budaya dari Asia Timur hingga Australia mengkaji langit, dengan cerapan mudah dan alat bersejarah."
  id: "Cara budaya dari Asia Timur hingga Australia mempelajari langit, lewat pengamatan sederhana dan instrumen bersejarah."
  hi: "पूर्वी एशिया से ऑस्ट्रेलिया तक संस्कृतियों ने आकाश का अध्ययन कैसे किया, सरल अवलोकन और ऐतिहासिक उपकरणों के साथ।"
outcomes:
  - en: "Compare astronomy in different cultures"
    zh: "比较不同文化中的天文学"
    zh-TW: "比較不同文化中的天文學"
    ja: "文化ごとの天文学を比べる"
    ko: "여러 문화의 천문학 비교하기"
    vi: "So sánh thiên văn học ở các nền văn hóa"
    ms: "Bandingkan astronomi dalam budaya berbeza"
    id: "Membandingkan astronomi di berbagai budaya"
    hi: "अलग-अलग संस्कृतियों में खगोलशास्त्र की तुलना करना"
  - en: "Make simple sky observations"
    zh: "进行简单的天空观测"
    zh-TW: "進行簡單的天空觀測"
    ja: "簡単な天体観測を行う"
    ko: "간단한 하늘 관측하기"
    vi: "Thực hiện quan sát bầu trời đơn giản"
    ms: "Buat cerapan langit yang mudah"
    id: "Melakukan pengamatan langit sederhana"
    hi: "आकाश का सरल अवलोकन करना"
  - en: "Explain how historical instruments worked"
    zh: "解释历史上的天文仪器如何运作"
    zh-TW: "解釋歷史上的天文儀器如何運作"
    ja: "歴史的な観測器具の仕組みを説明する"
    ko: "옛 천문 기구의 작동 방식 설명하기"
    vi: "Giải thích cách các dụng cụ lịch sử hoạt động"
    ms: "Terangkan cara alat bersejarah berfungsi"
    id: "Menjelaskan cara kerja instrumen bersejarah"
    hi: "ऐतिहासिक उपकरण कैसे काम करते थे, समझाना"
