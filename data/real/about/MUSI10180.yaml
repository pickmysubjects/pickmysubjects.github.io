code: MUSI10180
year: 2026
learn:
  en: "Jazz basics for improvisers: harmony, melody and rhythm, practised by singing, playing, transcribing and keyboard work."
  zh: "面向即兴乐手的爵士基础：和声、旋律与节奏，通过演唱、演奏、扒谱和键盘练习掌握。"
  zh-TW: "面向即興樂手的爵士基礎：和聲、旋律與節奏，透過演唱、演奏、扒譜與鍵盤練習掌握。"
  ja: "即興演奏者向けのジャズの基礎。和声・旋律・リズムを歌唱、演奏、採譜、鍵盤で身につける。"
  ko: "즉흥 연주자를 위한 재즈 기초. 화성·선율·리듬을 노래, 연주, 채보, 건반으로 익히기."
  vi: "Nền tảng jazz cho người ứng tấu: hòa âm, giai điệu, tiết tấu qua hát, chơi, chép nhạc và phím đàn."
  ms: "Asas jaz untuk pemuzik improvisasi: harmoni, melodi, ritma melalui nyanyian, permainan, transkripsi."
  id: "Dasar jazz untuk improvisator: harmoni, melodi, ritme lewat bernyanyi, bermain, transkripsi, dan keyboard."
  hi: "इम्प्रोवाइज़ करने वालों के लिए जैज़ की बुनियाद: हार्मनी, धुन, लय; गाकर, बजाकर, ट्रांसक्राइब कर।"
outcomes:
  - en: "Use the building blocks of tonal harmony"
    zh: "运用调性和声的基本元素"
    zh-TW: "運用調性和聲的基本元素"
    ja: "調性和声の基本要素を使う"
    ko: "조성 화성의 기본 요소 활용하기"
    vi: "Dùng các yếu tố cơ bản của hòa âm"
    ms: "Guna asas harmoni tonal"
    id: "Memakai dasar-dasar harmoni tonal"
    hi: "टोनल हार्मनी के मूल तत्व इस्तेमाल करना"
  - en: "Transcribe and perform jazz examples"
    zh: "扒谱并演奏爵士范例"
    zh-TW: "扒譜並演奏爵士範例"
    ja: "ジャズの例を採譜して演奏する"
    ko: "재즈 예시를 채보하고 연주하기"
    vi: "Chép và trình diễn ví dụ jazz"
    ms: "Transkripsi dan persembahkan contoh jaz"
    id: "Mentranskripsi dan memainkan contoh jazz"
    hi: "जैज़ उदाहरण ट्रांसक्राइब कर बजाना"
  - en: "Play polyrhythms and rhythmic patterns"
    zh: "演奏复节奏和节奏型"
    zh-TW: "演奏複節奏與節奏型"
    ja: "ポリリズムやリズムパターンを演奏する"
    ko: "폴리리듬과 리듬 패턴 연주하기"
    vi: "Chơi đa tiết tấu và mẫu nhịp"
    ms: "Mainkan poliritma dan corak ritma"
    id: "Memainkan poliritme dan pola ritme"
    hi: "पॉलीरिद्म और लय पैटर्न बजाना"
