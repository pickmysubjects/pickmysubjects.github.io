code: CRIM30006
year: 2026
learn:
  en: "How film and TV show crime and justice, from police shows to trial movies, and what that says about culture."
  zh: "电影和电视如何呈现犯罪与司法，从警匪剧到法庭片，以及这反映出的文化。"
  zh-TW: "電影和電視如何呈現犯罪與司法，從警匪劇到法庭片，以及這反映出的文化。"
  ja: "刑事ドラマから法廷映画まで、映画やテレビが犯罪と司法をどう描き、それが文化について何を示すかを学ぶ。"
  ko: "경찰 드라마부터 법정 영화까지 영화와 TV가 범죄와 사법을 어떻게 그리는지, 그것이 문화에 대해 말해 주는 것을 배운다."
  vi: "Phim và truyền hình thể hiện tội phạm và tư pháp ra sao, từ phim cảnh sát đến phim xử án, và điều đó nói gì về văn hóa."
  ms: "Cara filem dan TV memaparkan jenayah dan keadilan, daripada drama polis hingga filem perbicaraan, dan maksudnya tentang budaya."
  id: "Cara film dan TV menampilkan kejahatan dan peradilan, dari serial polisi hingga film pengadilan, dan maknanya bagi budaya."
  hi: "फ़िल्म और टीवी अपराध व न्याय को कैसे दिखाते हैं, पुलिस शो से कोर्टरूम फ़िल्मों तक, और यह संस्कृति के बारे में क्या बताता है।"
outcomes:
  - en: "Use theories of how culture represents crime"
    zh: "运用关于文化如何呈现犯罪的理论"
    zh-TW: "運用關於文化如何呈現犯罪的理論"
    ja: "文化による犯罪表象の理論を使う"
    ko: "문화가 범죄를 재현하는 방식에 관한 이론 활용하기"
    vi: "Vận dụng lý thuyết về cách văn hóa thể hiện tội phạm"
    ms: "Guna teori tentang cara budaya memaparkan jenayah"
    id: "Memakai teori tentang cara budaya menggambarkan kejahatan"
    hi: "संस्कृति अपराध को कैसे दर्शाती है, इसके सिद्धांत इस्तेमाल करना"
  - en: "Analyse images of crime and justice on screen"
    zh: "分析银幕上的犯罪与司法形象"
    zh-TW: "分析銀幕上的犯罪與司法形象"
    ja: "映像の中の犯罪と司法のイメージを分析する"
    ko: "화면 속 범죄와 사법의 이미지 분석하기"
    vi: "Phân tích hình ảnh tội phạm và tư pháp trên màn ảnh"
    ms: "Analisis imej jenayah dan keadilan di layar"
    id: "Menganalisis citra kejahatan dan peradilan di layar"
    hi: "परदे पर अपराध और न्याय की छवियों का विश्लेषण करना"
  - en: "Link popular culture to debates in criminology"
    zh: "把流行文化与犯罪学的争论联系起来"
    zh-TW: "把流行文化與犯罪學的爭論連結起來"
    ja: "大衆文化を犯罪学の議論と結びつける"
    ko: "대중문화를 범죄학 논쟁과 연결하기"
    vi: "Liên hệ văn hóa đại chúng với tranh luận tội phạm học"
    ms: "Kaitkan budaya popular dengan perdebatan kriminologi"
    id: "Mengaitkan budaya populer dengan perdebatan kriminologi"
    hi: "लोकप्रिय संस्कृति को क्रिमिनोलॉजी की बहसों से जोड़ना"
