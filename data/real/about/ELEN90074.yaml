code: ELEN90074
year: 2027
learn:
  en: "The basics of generating, transmitting and converting electric power, from transformers to motors."
  zh: "电力的产生、输送和转换基础，涵盖变压器到电动机。"
  zh-TW: "電力的產生、輸送與轉換基礎，涵蓋變壓器到電動機。"
  ja: "変圧器からモーターまで、電力の発電・送電・変換の基礎。"
  ko: "변압기부터 모터까지, 전력의 생산·송전·변환 기초."
  vi: "Cơ bản về phát, truyền tải và chuyển đổi điện năng, từ máy biến áp đến động cơ."
  ms: "Asas penjanaan, penghantaran dan penukaran kuasa elektrik, daripada pengubah hingga motor."
  id: "Dasar pembangkitan, transmisi, dan konversi tenaga listrik, dari trafo hingga motor."
  hi: "ट्रांसफ़ॉर्मर से मोटर तक, बिजली के उत्पादन, संचरण और रूपांतरण की बुनियाद।"
outcomes:
  - en: "Analyse power flow in electrical networks"
    zh: "分析电网中的潮流"
    zh-TW: "分析電網中的電力潮流"
    ja: "電力網の潮流を分析する"
    ko: "전력망의 전력 조류 분석하기"
    vi: "Phân tích trào lưu công suất trong lưới điện"
    ms: "Menganalisis aliran kuasa dalam rangkaian elektrik"
    id: "Menganalisis aliran daya pada jaringan listrik"
    hi: "विद्युत नेटवर्क में पावर फ़्लो का विश्लेषण"
  - en: "Model lines, transformers, motors and generators"
    zh: "为线路、变压器、电动机和发电机建模"
    zh-TW: "為線路、變壓器、電動機與發電機建模"
    ja: "送電線・変圧器・モーター・発電機をモデル化する"
    ko: "선로, 변압기, 모터, 발전기 모델링하기"
    vi: "Mô hình hóa đường dây, máy biến áp, động cơ và máy phát"
    ms: "Memodelkan talian, pengubah, motor dan penjana"
    id: "Memodelkan saluran, trafo, motor, dan generator"
    hi: "लाइन, ट्रांसफ़ॉर्मर, मोटर और जनरेटर का मॉडल बनाना"
  - en: "Compare simulation results with theory"
    zh: "把仿真结果与理论分析对比"
    zh-TW: "把模擬結果與理論分析比較"
    ja: "シミュレーション結果を理論と比べる"
    ko: "시뮬레이션 결과를 이론과 비교하기"
    vi: "So sánh kết quả mô phỏng với lý thuyết"
    ms: "Membandingkan keputusan simulasi dengan teori"
    id: "Membandingkan hasil simulasi dengan teori"
    hi: "सिमुलेशन परिणामों की सिद्धांत से तुलना"
