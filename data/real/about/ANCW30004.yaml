code: ANCW30004
year: 2026
learn:
  en: "Comparing the rise and fall of Egyptian, Near Eastern and Persian civilisations using texts and archaeology."
  zh: "结合文本与考古，比较埃及、近东和波斯文明的兴衰。"
  zh-TW: "結合文本與考古，比較埃及、近東和波斯文明的興衰。"
  ja: "文献と考古学を使い、エジプト・近東・ペルシアの文明の興亡を比べる。"
  ko: "문헌과 고고학으로 이집트, 근동, 페르시아 문명의 흥망을 비교한다."
  vi: "So sánh sự hưng vong của các nền văn minh Ai Cập, Cận Đông và Ba Tư qua văn bản và khảo cổ."
  ms: "Membandingkan kebangkitan dan kejatuhan tamadun Mesir, Timur Dekat dan Parsi melalui teks dan arkeologi."
  id: "Membandingkan bangkit dan runtuhnya peradaban Mesir, Timur Dekat, dan Persia lewat teks dan arkeologi."
  hi: "ग्रंथों और पुरातत्व से मिस्री, निकट-पूर्वी और फ़ारसी सभ्यताओं के उत्थान और पतन की तुलना।"
outcomes:
  - en: "Compare the structure of ancient civilisations"
    zh: "比较古代文明的结构"
    zh-TW: "比較古代文明的結構"
    ja: "古代文明の構造を比べる"
    ko: "고대 문명의 구조 비교하기"
    vi: "So sánh cấu trúc của các nền văn minh cổ"
    ms: "Bandingkan struktur tamadun kuno"
    id: "Membandingkan struktur peradaban kuno"
    hi: "प्राचीन सभ्यताओं की संरचना की तुलना करना"
  - en: "Explain why complex societies rise and fall"
    zh: "解释复杂社会为何兴起与衰落"
    zh-TW: "解釋複雜社會為何興起與衰落"
    ja: "複雑な社会がなぜ興り衰えるか説明する"
    ko: "복잡한 사회가 흥하고 망하는 이유 설명하기"
    vi: "Giải thích vì sao các xã hội phức tạp hưng thịnh và suy tàn"
    ms: "Terangkan mengapa masyarakat kompleks bangkit dan jatuh"
    id: "Menjelaskan mengapa masyarakat kompleks bangkit dan runtuh"
    hi: "जटिल समाज क्यों उठते और गिरते हैं, समझाना"
  - en: "Combine texts and material evidence"
    zh: "结合文本与实物证据"
    zh-TW: "結合文本與實物證據"
    ja: "文献と物的証拠を組み合わせる"
    ko: "문헌과 물질 증거 결합하기"
    vi: "Kết hợp văn bản và bằng chứng vật chất"
    ms: "Gabungkan teks dan bukti material"
    id: "Menggabungkan teks dan bukti material"
    hi: "ग्रंथों और भौतिक साक्ष्यों को जोड़ना"
