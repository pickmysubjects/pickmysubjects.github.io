code: MGMT90018
year: 2027
learn:
  en: "The psychology behind management: using ideas about thinking, emotion, personality and groups to solve workplace problems."
  zh: "管理背后的心理学：用认知、情绪、人格和群体理论解决职场问题。"
  zh-TW: "管理背後的心理學：用認知、情緒、人格與群體理論解決職場問題。"
  ja: "経営の背後にある心理学：認知・感情・性格・集団の理論で職場の問題を解く。"
  ko: "경영 뒤의 심리학: 인지, 감정, 성격, 집단 이론으로 직장 문제를 푼다."
  vi: "Tâm lý học đằng sau quản lý: dùng lý thuyết về nhận thức, cảm xúc, tính cách, nhóm để giải quyết vấn đề nơi làm việc."
  ms: "Psikologi di sebalik pengurusan: guna idea tentang kognisi, emosi, personaliti dan kumpulan untuk masalah tempat kerja."
  id: "Psikologi di balik manajemen: memakai teori kognisi, emosi, kepribadian dan kelompok untuk masalah tempat kerja."
  hi: "प्रबंधन के पीछे का मनोविज्ञान: सोच, भावना, व्यक्तित्व और समूह के विचारों से कार्यस्थल की समस्याएँ सुलझाना।"
outcomes:
  - en: "Read management problems through psychology"
    zh: "用心理学理论解读管理问题"
    zh-TW: "以心理學理論解讀管理問題"
    ja: "心理学で経営課題を読み解く"
    ko: "심리학으로 경영 문제 해석하기"
    vi: "Phân tích vấn đề quản lý qua tâm lý học"
    ms: "Mentafsir masalah pengurusan melalui psikologi"
    id: "Menafsirkan masalah manajemen lewat psikologi"
    hi: "मनोविज्ञान से प्रबंधन की समस्याएँ समझना"
  - en: "See how practices shape employee behaviour"
    zh: "理解管理做法如何影响员工行为"
    zh-TW: "理解管理做法如何影響員工行為"
    ja: "経営の実践が社員の行動に与える影響を知る"
    ko: "관리 방식이 직원 행동에 주는 영향 이해하기"
    vi: "Thấy cách quản lý định hình hành vi nhân viên"
    ms: "Melihat cara amalan membentuk tingkah laku pekerja"
    id: "Melihat cara praktik membentuk perilaku karyawan"
    hi: "प्रबंधन के तरीके कर्मचारियों के व्यवहार को कैसे ढालते हैं, समझना"
