code: ANSC30004
year: 2026
learn:
  en: "Animal reproduction and breeding: reproductive hormones, fertility, reproductive tech, genetics and selection."
  zh: "动物繁殖与育种：生殖激素、繁殖力、繁殖技术、遗传与选育。"
  zh-TW: "動物繁殖與育種：生殖荷爾蒙、繁殖力、繁殖技術、遺傳與選育。"
  ja: "動物の繁殖と育種：生殖ホルモン、繁殖性、繁殖技術、遺伝と選抜。"
  ko: "동물 번식과 육종: 생식 호르몬, 번식력, 번식 기술, 유전과 선발."
  vi: "Sinh sản và chọn giống vật nuôi: hormone sinh sản, khả năng sinh sản, công nghệ, di truyền."
  ms: "Pembiakan dan baka haiwan: hormon pembiakan, kesuburan, teknologi pembiakan, genetik dan pemilihan."
  id: "Reproduksi dan pemuliaan hewan: hormon reproduksi, kesuburan, teknologi, genetika, dan seleksi."
  hi: "पशु प्रजनन और नस्ल सुधार: प्रजनन हार्मोन, प्रजनन क्षमता, तकनीक, आनुवंशिकी और चयन।"
outcomes:
  - en: "Plan ways to improve reproductive performance"
    zh: "制定提升繁殖表现的管理方案"
    zh-TW: "制定提升繁殖表現的管理方案"
    ja: "繁殖成績を上げる管理策を立てる"
    ko: "번식 성적 높이는 관리 방안 세우기"
    vi: "Lập kế hoạch nâng hiệu quả sinh sản"
    ms: "Rancang cara tingkatkan prestasi pembiakan"
    id: "Merancang cara meningkatkan kinerja reproduksi"
    hi: "प्रजनन प्रदर्शन सुधारने की योजना बनाना"
  - en: "Weigh inbreeding against crossbreeding"
    zh: "权衡近亲繁殖与杂交的利弊"
    zh-TW: "權衡近親繁殖與雜交的利弊"
    ja: "近親交配と交雑の利点・欠点を比べる"
    ko: "근친교배와 교잡의 장단점 비교하기"
    vi: "Cân nhắc giữa cận huyết và lai tạo"
    ms: "Timbang pembiakbakaan dalam dengan kacukan"
    id: "Menimbang perkawinan sedarah dan silang"
    hi: "अंतःप्रजनन और संकरण की तुलना करना"
