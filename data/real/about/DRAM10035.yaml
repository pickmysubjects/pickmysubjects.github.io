code: DRAM10035
year: 2026
learn:
  en: "Acting methods for character and text: script analysis, physical mapping, improvisation and devising, ending with an Australian piece."
  zh: "以角色与文本为中心的表演方法：剧本分析、形体探索、即兴与集体创作，最后演澳洲作品。"
  zh-TW: "以角色與文本為中心的表演方法：劇本分析、肢體探索、即興與集體創作，最後演澳洲作品。"
  ja: "役とテキストの演技法：台本分析、身体マッピング、即興と創作。最後にオーストラリア作品を演じる。"
  ko: "인물과 텍스트 중심 연기법: 대본 분석, 신체 매핑, 즉흥과 공동 창작, 마지막에 호주 작품."
  vi: "Phương pháp diễn cho nhân vật và văn bản: phân tích kịch bản, khám phá hình thể, ứng tác, dựng vở; cuối khóa diễn tác phẩm Úc."
  ms: "Kaedah lakonan untuk watak dan teks: analisis skrip, pemetaan fizikal, improvisasi, diakhiri karya Australia."
  id: "Metode akting untuk tokoh dan teks: analisis naskah, pemetaan fisik, improvisasi, diakhiri karya Australia."
  hi: "किरदार और पाठ के लिए अभिनय विधियाँ: स्क्रिप्ट विश्लेषण, शारीरिक मैपिंग, इम्प्रोवाइज़ेशन, अंत में ऑस्ट्रेलियाई पीस।"
outcomes:
  - en: "Analyse a script to build a character"
    zh: "分析剧本来塑造角色"
    zh-TW: "分析劇本來塑造角色"
    ja: "台本を分析して役を作る"
    ko: "대본을 분석해 인물 만들기"
    vi: "Phân tích kịch bản để xây dựng nhân vật"
    ms: "Analisis skrip untuk membina watak"
    id: "Menganalisis naskah untuk membangun tokoh"
    hi: "स्क्रिप्ट विश्लेषण से किरदार बनाना"
  - en: "Link space, weight and rhythm to acting choices"
    zh: "把空间、重量与节奏用于表演选择"
    zh-TW: "把空間、重量與節奏用於表演選擇"
    ja: "空間・重さ・リズムを演技の選択に結びつける"
    ko: "공간, 무게, 리듬을 연기 선택에 연결하기"
    vi: "Gắn không gian, trọng lượng, nhịp vào lựa chọn diễn"
    ms: "Kaitkan ruang, berat dan rentak dengan lakonan"
    id: "Mengaitkan ruang, bobot dan ritme dengan akting"
    hi: "स्थान, भार और लय को अभिनय विकल्पों से जोड़ना"
  - en: "Perform a scene or short devised piece"
    zh: "演出一场戏或短篇集体创作"
    zh-TW: "演出一場戲或短篇集體創作"
    ja: "場面または短い創作作品を演じる"
    ko: "장면이나 짧은 창작극 공연하기"
    vi: "Diễn một cảnh hoặc tiểu phẩm tự dựng"
    ms: "Persembahkan babak atau karya pendek ciptaan"
    id: "Mementaskan adegan atau karya pendek"
    hi: "एक दृश्य या छोटा स्वरचित पीस प्रस्तुत करना"
