code: MCEN90053
year: 2027
learn:
  en: "Systems engineering for industrial projects, with discrete event simulation and real industry problems."
  zh: "面向工业项目的系统工程，包括离散事件仿真和真实行业问题。"
  zh-TW: "面向工業專案的系統工程，包括離散事件模擬與真實產業問題。"
  ja: "産業プロジェクトのシステムズエンジニアリングと離散事象シミュレーション、実際の産業課題。"
  ko: "산업 프로젝트의 시스템 공학, 이산 사건 시뮬레이션과 실제 산업 문제."
  vi: "Kỹ thuật hệ thống cho dự án công nghiệp, mô phỏng sự kiện rời rạc và bài toán thực tế."
  ms: "Kejuruteraan sistem untuk projek industri, simulasi peristiwa diskret dan masalah industri sebenar."
  id: "Rekayasa sistem untuk proyek industri, simulasi peristiwa diskret, dan masalah industri nyata."
  hi: "औद्योगिक परियोजनाओं के लिए सिस्टम इंजीनियरिंग, डिस्क्रीट इवेंट सिमुलेशन और असली उद्योग समस्याएँ।"
outcomes:
  - en: "Plan an industrial project with a systems engineering framework"
    zh: "用系统工程框架规划工业项目"
    zh-TW: "用系統工程框架規劃工業專案"
    ja: "システムズエンジニアリングの枠組みで産業プロジェクトを計画する"
    ko: "시스템 공학 틀로 산업 프로젝트 계획하기"
    vi: "Lập dự án công nghiệp theo khung kỹ thuật hệ thống"
    ms: "Merancang projek industri dengan rangka kerja kejuruteraan sistem"
    id: "Merencanakan proyek industri dengan kerangka rekayasa sistem"
    hi: "सिस्टम इंजीनियरिंग ढाँचे से औद्योगिक परियोजना बनाना"
  - en: "Build and validate discrete event simulation models"
    zh: "构建并验证离散事件仿真模型"
    zh-TW: "建構並驗證離散事件模擬模型"
    ja: "離散事象シミュレーションモデルを作り検証する"
    ko: "이산 사건 시뮬레이션 모델 구축·검증하기"
    vi: "Xây và kiểm chứng mô hình mô phỏng sự kiện rời rạc"
    ms: "Membina dan mengesahkan model simulasi peristiwa diskret"
    id: "Membangun dan memvalidasi model simulasi peristiwa diskret"
    hi: "डिस्क्रीट इवेंट सिमुलेशन मॉडल बनाना और जाँचना"
