code: ENGR90044
year: 2027
learn:
  en: "The physics of air and water flows in the environment: waves, stratified flows, convection and pollutant dispersion."
  zh: "环境中空气和水流的物理原理：波浪、分层流、对流和污染物扩散。"
  zh-TW: "環境中空氣和水流的物理原理：波浪、分層流、對流和污染物擴散。"
  ja: "環境中の空気と水の流れの物理：波、成層流、対流、汚染物質の拡散。"
  ko: "환경 속 공기와 물 흐름의 물리: 파동, 성층 흐름, 대류, 오염물질 확산."
  vi: "Vật lý của dòng khí và nước trong môi trường: sóng, dòng phân tầng, đối lưu và phát tán chất ô nhiễm."
  ms: "Fizik aliran udara dan air dalam alam sekitar: gelombang, aliran berstrata, perolakan dan penyebaran bahan cemar."
  id: "Fisika aliran udara dan air di lingkungan: gelombang, aliran berlapis, konveksi, dan penyebaran polutan."
  hi: "पर्यावरण में हवा और पानी के प्रवाह की भौतिकी: तरंगें, स्तरीकृत प्रवाह, संवहन और प्रदूषक फैलाव।"
outcomes:
  - en: "Apply theory and numerical methods to environmental flows"
    zh: "用理论和数值方法分析环境流动"
    zh-TW: "用理論和數值方法分析環境流動"
    ja: "理論と数値手法で環境流れを解析する"
    ko: "이론과 수치 기법으로 환경 흐름 분석하기"
    vi: "Áp dụng lý thuyết và phương pháp số cho dòng chảy môi trường"
    ms: "Menggunakan teori dan kaedah berangka untuk aliran alam sekitar"
    id: "Menerapkan teori dan metode numerik pada aliran lingkungan"
    hi: "पर्यावरणीय प्रवाहों पर सिद्धांत और संख्यात्मक विधियाँ लागू करना"
  - en: "Run a research project and present the findings"
    zh: "完成研究项目并展示结果"
    zh-TW: "完成研究專案並展示結果"
    ja: "研究プロジェクトを行い成果を発表する"
    ko: "연구 프로젝트를 수행하고 결과 발표하기"
    vi: "Thực hiện dự án nghiên cứu và trình bày kết quả"
    ms: "Menjalankan projek penyelidikan dan membentangkan dapatan"
    id: "Menjalankan proyek riset dan mempresentasikan hasilnya"
    hi: "शोध परियोजना करना और निष्कर्ष प्रस्तुत करना"
