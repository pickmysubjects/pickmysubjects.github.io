code: CRIM30005
year: 2026
learn:
  en: "Crimes and harms by businesses and the powerful, such as corporate crime and corruption, and why they are hard to stop."
  zh: "企业和权势者的犯罪与危害，如公司犯罪和腐败，以及为何难以遏制。"
  zh-TW: "企業和權勢者的犯罪與危害，如公司犯罪和貪腐，以及為何難以遏止。"
  ja: "企業犯罪や汚職など、企業や権力者による犯罪と害悪、そしてそれを止めにくい理由を学ぶ。"
  ko: "기업 범죄와 부패처럼 기업과 권력자가 저지르는 범죄와 해악, 그리고 그것을 막기 어려운 이유를 배운다."
  vi: "Tội phạm và tác hại do doanh nghiệp và giới quyền lực gây ra, như tội phạm doanh nghiệp, tham nhũng, và vì sao khó ngăn chặn."
  ms: "Jenayah dan kemudaratan oleh syarikat dan golongan berkuasa, seperti jenayah korporat dan rasuah, dan sebab ia sukar dibendung."
  id: "Kejahatan dan kerugian oleh perusahaan dan kaum berkuasa, seperti kejahatan korporasi dan korupsi, serta alasan sulit dicegah."
  hi: "कंपनियों और ताकतवर लोगों के अपराध और नुकसान, जैसे कॉर्पोरेट अपराध और भ्रष्टाचार, और इन्हें रोकना मुश्किल क्यों है।"
outcomes:
  - en: "Explain why corporate crime is hard to define"
    zh: "说明公司犯罪为何难以界定"
    zh-TW: "說明公司犯罪為何難以界定"
    ja: "企業犯罪の定義が難しい理由を説明する"
    ko: "기업 범죄를 정의하기 어려운 이유 설명하기"
    vi: "Giải thích vì sao khó định nghĩa tội phạm doanh nghiệp"
    ms: "Terangkan mengapa jenayah korporat sukar ditakrifkan"
    id: "Menjelaskan mengapa kejahatan korporasi sulit didefinisikan"
    hi: "समझाना कि कॉर्पोरेट अपराध को परिभाषित करना कठिन क्यों है"
  - en: "Use criminology theory to explain harms by the powerful"
    zh: "用犯罪学理论解释权势者造成的危害"
    zh-TW: "用犯罪學理論解釋權勢者造成的危害"
    ja: "犯罪学の理論で権力者の害悪を説明する"
    ko: "범죄학 이론으로 권력자의 해악 설명하기"
    vi: "Dùng lý thuyết tội phạm học giải thích tác hại của giới quyền lực"
    ms: "Guna teori kriminologi untuk menjelaskan kemudaratan golongan berkuasa"
    id: "Memakai teori kriminologi untuk menjelaskan kerugian akibat kaum berkuasa"
    hi: "ताकतवर लोगों के नुकसान को क्रिमिनोलॉजी सिद्धांत से समझाना"
  - en: "Assess how the state regulates business misconduct"
    zh: "评估国家如何监管企业不当行为"
    zh-TW: "評估國家如何監管企業不當行為"
    ja: "国家による企業不正の規制を評価する"
    ko: "국가의 기업 비위 규제 방식 평가하기"
    vi: "Đánh giá cách nhà nước quản lý sai phạm của doanh nghiệp"
    ms: "Nilai cara negara mengawal salah laku perniagaan"
    id: "Menilai cara negara mengatur pelanggaran bisnis"
    hi: "राज्य व्यावसायिक गड़बड़ी को कैसे नियंत्रित करता है, आकलन करना"
