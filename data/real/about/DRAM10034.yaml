code: DRAM10034
year: 2026
learn:
  en: "Core theories of theatre studies and how they connect to your own practice, shared with Theatre students."
  zh: "戏剧研究的核心理论及其与自身实践的联系，与戏剧方向学生同堂。"
  zh-TW: "劇場研究的核心理論及其與自身實踐的連結，與劇場方向學生同堂。"
  ja: "演劇学の基本理論と自分の実践とのつながりを学ぶ。演劇専攻と合同。"
  ko: "연극학의 핵심 이론과 자기 실천의 연결을 배운다. 연극 전공과 함께 듣는다."
  vi: "Các lý thuyết cốt lõi của nghiên cứu sân khấu và liên hệ với thực hành của bạn, học chung với ngành Sân khấu."
  ms: "Teori teras pengajian teater dan kaitannya dengan amalan sendiri, bersama pelajar Teater."
  id: "Teori inti kajian teater dan kaitannya dengan praktik sendiri, bersama mahasiswa Teater."
  hi: "थिएटर अध्ययन के मूल सिद्धांत और आपके अभ्यास से उनका संबंध, थिएटर छात्रों के साथ।"
outcomes:
  - en: "Use theory to analyse performance"
    zh: "用理论分析表演"
    zh-TW: "用理論分析表演"
    ja: "理論を使って上演を分析する"
    ko: "이론으로 공연 분석하기"
    vi: "Dùng lý thuyết để phân tích biểu diễn"
    ms: "Guna teori untuk menganalisis persembahan"
    id: "Memakai teori untuk menganalisis pertunjukan"
    hi: "सिद्धांत से प्रस्तुति का विश्लेषण"
  - en: "Present a theory-based idea as a group"
    zh: "小组展示基于理论的观点"
    zh-TW: "小組展示基於理論的觀點"
    ja: "理論に基づく考えをグループで発表する"
    ko: "이론 기반 아이디어를 그룹 발표하기"
    vi: "Cùng nhóm thuyết trình ý tưởng dựa trên lý thuyết"
    ms: "Bentang idea berasaskan teori berkumpulan"
    id: "Mempresentasikan gagasan berbasis teori berkelompok"
    hi: "समूह में सिद्धांत-आधारित विचार प्रस्तुत करना"
  - en: "Write a critical essay on your development"
    zh: "撰写关于自身发展的批判性论文"
    zh-TW: "撰寫關於自身發展的批判性論文"
    ja: "自分の成長について批評的な論文を書く"
    ko: "자기 발전에 관한 비평 에세이 쓰기"
    vi: "Viết tiểu luận phản biện về sự phát triển của mình"
    ms: "Tulis esei kritis tentang perkembangan diri"
    id: "Menulis esai kritis tentang perkembangan diri"
    hi: "अपने विकास पर आलोचनात्मक निबंध लिखना"
