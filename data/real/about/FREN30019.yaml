code: FREN30019
year: 2026
learn:
  en: "History, politics and culture of the French-speaking Pacific, with time studying in the region."
  zh: "法语太平洋地区的历史、政治与文化，包含在当地学习的时间。"
  zh-TW: "法語太平洋地區的歷史、政治與文化，包含在當地學習的時間。"
  ja: "フランス語圏太平洋の歴史・政治・文化。現地での学習期間を含む。"
  ko: "프랑스어권 태평양의 역사·정치·문화. 현지 학습 기간 포함."
  vi: "Lịch sử, chính trị và văn hóa vùng Thái Bình Dương nói tiếng Pháp, có thời gian học tại chỗ."
  ms: "Sejarah, politik dan budaya Pasifik berbahasa Perancis, termasuk masa belajar di rantau itu."
  id: "Sejarah, politik dan budaya Pasifik berbahasa Prancis, termasuk masa belajar di kawasan itu."
  hi: "फ़्रेंच-भाषी प्रशांत क्षेत्र का इतिहास, राजनीति और संस्कृति, वहीं जाकर पढ़ाई के साथ।"
outcomes:
  - en: "Explain France's history in the Pacific"
    zh: "说明法国在太平洋地区的历史"
    zh-TW: "說明法國在太平洋地區的歷史"
    ja: "太平洋におけるフランスの歴史を説明する"
    ko: "태평양에서 프랑스의 역사 설명하기"
    vi: "Giải thích lịch sử của Pháp ở Thái Bình Dương"
    ms: "Terangkan sejarah Perancis di Pasifik"
    id: "Menjelaskan sejarah Prancis di Pasifik"
    hi: "प्रशांत में फ़्रांस का इतिहास समझाना"
  - en: "Discuss current political debates in the region"
    zh: "讨论该地区当前的政治争论"
    zh-TW: "討論該地區當前的政治爭論"
    ja: "この地域の今の政治論争を論じる"
    ko: "이 지역의 현재 정치 논쟁 논의하기"
    vi: "Thảo luận tranh luận chính trị hiện nay trong vùng"
    ms: "Bincangkan perdebatan politik semasa di rantau ini"
    id: "Membahas perdebatan politik terkini di kawasan itu"
    hi: "इस क्षेत्र की मौजूदा राजनीतिक बहसों पर चर्चा करना"
  - en: "Use French during in-country study"
    zh: "在当地学习时使用法语"
    zh-TW: "在當地學習時使用法語"
    ja: "現地学習でフランス語を使う"
    ko: "현지 학습 중 프랑스어 쓰기"
    vi: "Dùng tiếng Pháp khi học tại chỗ"
    ms: "Guna bahasa Perancis semasa belajar di sana"
    id: "Memakai bahasa Prancis saat belajar di lokasi"
    hi: "वहाँ की पढ़ाई के दौरान फ़्रेंच इस्तेमाल करना"
