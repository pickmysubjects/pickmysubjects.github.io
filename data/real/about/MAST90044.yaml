code: MAST90044
year: 2027
learn:
  en: "How to draw sound conclusions from data without overreaching."
  zh: "如何从数据中得出可靠结论，又不过度解读。"
  zh-TW: "如何從資料中得出可靠結論，又不過度解讀。"
  ja: "データから行き過ぎずに確かな結論を導く方法。"
  ko: "데이터에서 과장 없이 믿을 만한 결론을 내리는 법."
  vi: "Cách rút ra kết luận đáng tin từ dữ liệu mà không suy diễn quá mức."
  ms: "Cara membuat kesimpulan yang kukuh daripada data tanpa melampau."
  id: "Cara menarik kesimpulan yang kuat dari data tanpa berlebihan."
  hi: "डेटा से बिना बढ़ा-चढ़ाकर ठोस निष्कर्ष निकालना।"
outcomes:
  - en: "Understand sampling and experimental design"
    zh: "理解抽样与实验设计"
    zh-TW: "理解抽樣與實驗設計"
    ja: "標本抽出と実験計画を理解する"
    ko: "표본 추출과 실험 설계 이해하기"
    vi: "Hiểu về lấy mẫu và thiết kế thí nghiệm"
    ms: "Memahami persampelan dan reka bentuk eksperimen"
    id: "Memahami pengambilan sampel dan desain eksperimen"
    hi: "नमूना चयन और प्रयोग डिज़ाइन समझना"
  - en: "Read how statistical results are reported"
    zh: "看懂统计结果是如何报告的"
    zh-TW: "看懂統計結果是如何報告的"
    ja: "統計結果の報告の仕方を読み取る"
    ko: "통계 결과가 보고되는 방식 읽기"
    vi: "Đọc hiểu cách báo cáo kết quả thống kê"
    ms: "Memahami cara keputusan statistik dilaporkan"
    id: "Memahami cara hasil statistik dilaporkan"
    hi: "सांख्यिकीय परिणामों की रिपोर्टिंग समझना"
  - en: "Carry out common statistical techniques"
    zh: "运用常见的统计方法"
    zh-TW: "運用常見的統計方法"
    ja: "一般的な統計手法を実行する"
    ko: "일반적인 통계 기법 수행하기"
    vi: "Thực hiện các kỹ thuật thống kê thông dụng"
    ms: "Menjalankan teknik statistik biasa"
    id: "Menerapkan teknik statistik umum"
    hi: "सामान्य सांख्यिकीय तकनीकें लागू करना"
