code: MULT10020
year: 2026
learn:
  en: "Where mindfulness and meditation come from, what the research says about them, and when they help or don't."
  zh: "正念和冥想的来源、研究怎么说，以及它们什么时候有用、什么时候没用。"
  zh-TW: "正念和冥想的來源、研究怎麼說，以及它們什麼時候有用、什麼時候沒用。"
  ja: "マインドフルネスや瞑想の起源、研究からわかっていること、役立つ場面とそうでない場面を学ぶ。"
  ko: "마음챙김과 명상의 기원, 연구 결과, 그리고 언제 도움이 되고 언제 그렇지 않은지 배운다."
  vi: "Chánh niệm và thiền đến từ đâu, nghiên cứu nói gì, và khi nào chúng có ích hay không."
  ms: "Asal usul kesedaran penuh dan meditasi, apa kata kajian, dan bila ia membantu atau tidak."
  id: "Asal-usul mindfulness dan meditasi, apa kata penelitian, dan kapan keduanya membantu atau tidak."
  hi: "माइंडफ़ुलनेस और ध्यान कहाँ से आए, शोध क्या कहता है, और कब ये मदद करते हैं और कब नहीं।"
outcomes:
  - en: "Read and judge research on meditation"
    zh: "阅读并评估关于冥想的研究"
    zh-TW: "閱讀並評估關於冥想的研究"
    ja: "瞑想に関する研究を読み、評価する"
    ko: "명상 관련 연구를 읽고 평가하기"
    vi: "Đọc và đánh giá nghiên cứu về thiền"
    ms: "Baca dan nilai kajian tentang meditasi"
    id: "Membaca dan menilai penelitian tentang meditasi"
    hi: "ध्यान पर हुए शोध को पढ़ना और परखना"
  - en: "Look at meditation from science, philosophy and culture"
    zh: "从科学、哲学和文化角度看冥想"
    zh-TW: "從科學、哲學和文化角度看冥想"
    ja: "科学・哲学・文化の視点から瞑想を見る"
    ko: "과학, 철학, 문화의 관점에서 명상 보기"
    vi: "Nhìn thiền từ góc độ khoa học, triết học và văn hóa"
    ms: "Lihat meditasi dari sudut sains, falsafah dan budaya"
    id: "Melihat meditasi dari sisi sains, filsafat, dan budaya"
    hi: "ध्यान को विज्ञान, दर्शन और संस्कृति की नज़र से देखना"
  - en: "Try meditation yourself and reflect on it"
    zh: "亲自练习冥想并反思体验"
    zh-TW: "親自練習冥想並反思體驗"
    ja: "自分で瞑想を試し、その体験を振り返る"
    ko: "직접 명상해 보고 경험 돌아보기"
    vi: "Tự thực hành thiền và suy ngẫm về trải nghiệm"
    ms: "Cuba bermeditasi sendiri dan renungkannya"
    id: "Mencoba meditasi sendiri dan merefleksikannya"
    hi: "खुद ध्यान करके उस अनुभव पर सोचना"
