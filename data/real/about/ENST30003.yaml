    ko: "그린 인프라 기술을 평가한다"
    vi: "Đánh giá công nghệ hạ tầng xanh"
    ms: "Nilai teknologi infrastruktur hijau"
    id: "Mengevaluasi teknologi infrastruktur hijau"
    hi: "ग्रीन इंफ्रास्ट्रक्चर तकनीकों का मूल्यांकन"
  - en: "Design a multi-function green installation"
    zh: "设计多功能绿色设施"
    zh-TW: "設計多功能綠色設施"
    ja: "多機能な緑化設備を設計する"
    ko: "다기능 녹화 시설을 설계한다"
    vi: "Thiết kế công trình xanh đa chức năng"
