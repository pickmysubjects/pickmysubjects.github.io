code: ENST30003
year: 2026
learn:
  en: "The science behind green roofs, green walls and water-sensitive urban design, and how to design them."
  zh: "绿色屋顶、绿墙和水敏性城市设计背后的科学及设计方法。"
  zh-TW: "綠屋頂、綠牆和水敏感城市設計背後的科學及設計方法。"
  ja: "屋上緑化・壁面緑化・水循環に配慮した都市設計の科学と設計方法。"
  ko: "옥상녹화·벽면녹화·물순환 도시설계의 과학과 설계 방법."
  vi: "Khoa học đằng sau mái xanh, tường xanh, thiết kế đô thị nhạy cảm với nước và cách thiết kế chúng."
  ms: "Sains di sebalik bumbung hijau, dinding hijau dan reka bentuk bandar peka air, serta cara mereka bentuknya."
  id: "Ilmu di balik atap hijau, dinding hijau, dan desain kota peka air, serta cara merancangnya."
  hi: "ग्रीन रूफ़, ग्रीन वॉल और वॉटर-सेंसिटिव शहरी डिज़ाइन के पीछे का विज्ञान और उन्हें डिज़ाइन करना।"
outcomes:
  - en: "Evaluate green infrastructure technologies"
    zh: "评估绿色基础设施技术"
    zh-TW: "評估綠色基礎設施技術"
