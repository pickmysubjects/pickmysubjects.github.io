code: FNCE30001
year: 2026
learn:
  en: "Investment analysis of shares and bonds: risk and return, portfolio theory and asset pricing models."
  zh: "股票和债券投资分析：风险收益、投资组合理论和资产定价。"
  zh-TW: "股票和債券投資分析：風險報酬、投資組合理論和資產定價。"
  ja: "株式と債券の投資分析：リスクとリターン、ポートフォリオ理論、資産価格モデル。"
  ko: "주식·채권 투자 분석: 위험과 수익, 포트폴리오 이론, 자산가격 모형."
  vi: "Phân tích đầu tư cổ phiếu và trái phiếu: rủi ro và lợi nhuận, lý thuyết danh mục và mô hình định giá tài sản."
  ms: "Analisis pelaburan saham dan bon: risiko dan pulangan, teori portfolio dan model harga aset."
  id: "Analisis investasi saham dan obligasi: risiko dan imbal hasil, teori portofolio, dan model harga aset."
  hi: "शेयर और बॉन्ड का निवेश विश्लेषण: जोखिम और रिटर्न, पोर्टफ़ोलियो थ्योरी और एसेट प्राइसिंग मॉडल।"
outcomes:
  - en: "Build portfolios with mean-variance analysis"
    zh: "用均值-方差方法构建投资组合"
    zh-TW: "用平均數-變異數方法建構投資組合"
    ja: "平均分散法でポートフォリオを組む"
    ko: "평균-분산 분석으로 포트폴리오 구성하기"
    vi: "Xây danh mục bằng phân tích trung bình–phương sai"
    ms: "Bina portfolio dengan analisis min-varians"
    id: "Menyusun portofolio dengan analisis mean-variance"
    hi: "मीन-वेरियंस विश्लेषण से पोर्टफ़ोलियो बनाना"
  - en: "Price bonds and manage fixed-income portfolios"
    zh: "为债券定价并管理固定收益组合"
    zh-TW: "為債券定價並管理固定收益組合"
    ja: "債券の価格を求め、債券ポートフォリオを運用する"
    ko: "채권 가격 매기고 채권 포트폴리오 관리하기"
    vi: "Định giá trái phiếu và quản lý danh mục thu nhập cố định"
    ms: "Tentukan harga bon dan urus portfolio pendapatan tetap"
    id: "Menghitung harga obligasi dan mengelola portofolio pendapatan tetap"
    hi: "बॉन्ड की कीमत निकालना और फ़िक्स्ड-इनकम पोर्टफ़ोलियो संभालना"
  - en: "Critique asset pricing theories"
    zh: "评析资产定价理论"
    zh-TW: "評析資產定價理論"
    ja: "資産価格理論を批判的に評価する"
    ko: "자산가격 이론 비판적으로 평가하기"
    vi: "Đánh giá phản biện các lý thuyết định giá tài sản"
    ms: "Kritik teori penentuan harga aset"
    id: "Mengkritisi teori penetapan harga aset"
    hi: "एसेट प्राइसिंग सिद्धांतों की समीक्षा करना"
