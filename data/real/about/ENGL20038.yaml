code: ENGL20038
year: 2026
learn:
  en: "Women in the King Arthur legend, from medieval tales and Victorian revivals to modern feminist retellings."
  zh: "亚瑟王传说中的女性，从中世纪故事、维多利亚时期复兴到现代女性主义改写。"
  zh-TW: "亞瑟王傳說中的女性，從中世紀故事、維多利亞時期復興到現代女性主義改寫。"
  ja: "アーサー王伝説の女性たちを、中世の物語やヴィクトリア朝の復興から現代のフェミニズム的な語り直しまで追う。"
  ko: "아서왕 전설 속 여성을 중세 이야기와 빅토리아 시대 부흥부터 현대 페미니즘 재해석까지 살펴본다."
  vi: "Phụ nữ trong truyền thuyết vua Arthur, từ truyện trung cổ, sự phục hưng thời Victoria đến các bản kể lại nữ quyền hiện đại."
  ms: "Wanita dalam legenda Raja Arthur, dari kisah zaman pertengahan dan kebangkitan Victoria hingga penceritaan semula feminis moden."
  id: "Perempuan dalam legenda Raja Arthur, dari kisah abad pertengahan dan kebangkitan era Victoria sampai penceritaan ulang feminis modern."
  hi: "राजा आर्थर की कथा में महिलाएं, मध्यकालीन कहानियों और विक्टोरियाई पुनरुद्धार से आधुनिक नारीवादी पुनर्कथनों तक।"
outcomes:
  - en: "Trace the Arthurian legend across periods"
    zh: "梳理亚瑟王传说在各时期的变化"
    zh-TW: "梳理亞瑟王傳說在各時期的變化"
    ja: "アーサー王伝説を時代ごとにたどる"
    ko: "시대별 아서왕 전설 짚어 보기"
    vi: "Lần theo truyền thuyết Arthur qua các thời kỳ"
    ms: "Jejaki legenda Arthur merentas zaman"
    id: "Menelusuri legenda Arthur lintas zaman"
    hi: "अलग-अलग कालों में आर्थर कथा को खोजना"
  - en: "Analyse how Arthurian women are portrayed"
    zh: "分析亚瑟王传说中女性形象的塑造"
    zh-TW: "分析亞瑟王傳說中女性形象的塑造"
    ja: "アーサー王伝説の女性像を分析する"
    ko: "아서왕 전설 속 여성 묘사 분석하기"
    vi: "Phân tích cách khắc họa phụ nữ trong truyền thuyết Arthur"
    ms: "Analisis gambaran wanita dalam legenda Arthur"
    id: "Menganalisis penggambaran perempuan dalam legenda Arthur"
    hi: "आर्थर कथा में महिलाओं के चित्रण का विश्लेषण करना"
  - en: "Compare medieval and modern retellings"
    zh: "比较中世纪与现代的改写"
    zh-TW: "比較中世紀與現代的改寫"
    ja: "中世の語りと現代の語り直しを比べる"
    ko: "중세와 현대의 재해석 비교하기"
    vi: "So sánh bản kể trung cổ và hiện đại"
    ms: "Bandingkan penceritaan zaman pertengahan dan moden"
    id: "Membandingkan penceritaan abad pertengahan dan modern"
    hi: "मध्यकालीन और आधुनिक पुनर्कथनों की तुलना करना"
