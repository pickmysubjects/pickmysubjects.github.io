code: ENST20001
year: 2026
learn:
  en: "Why people care, or don't, about the environment, and how to encourage greener behaviour."
  zh: "人们为何在意或不在意环境，以及如何促进更环保的行为。"
  zh-TW: "人們為何在意或不在意環境，以及如何促進更環保的行為。"
  ja: "人が環境を気にかける理由・かけない理由と、環境にやさしい行動を促す方法。"
  ko: "사람들이 환경에 관심을 갖거나 갖지 않는 이유와 친환경 행동을 이끄는 법."
  vi: "Vì sao người ta quan tâm hay không đến môi trường, và cách khuyến khích hành vi xanh hơn."
  ms: "Mengapa orang peduli atau tidak tentang alam sekitar, dan cara menggalakkan tingkah laku lebih hijau."
  id: "Mengapa orang peduli atau tidak pada lingkungan, dan cara mendorong perilaku lebih ramah lingkungan."
  hi: "लोग पर्यावरण की परवाह क्यों करते या नहीं करते, और हरित व्यवहार को कैसे बढ़ावा दें।"
outcomes:
  - en: "Analyse what drives sustainable behaviour"
    zh: "分析影响环保行为的因素"
    zh-TW: "分析影響環保行為的因素"
    ja: "持続可能な行動を左右する要因を分析する"
    ko: "지속가능한 행동의 요인을 분석한다"
    vi: "Phân tích yếu tố thúc đẩy hành vi bền vững"
    ms: "Analisis pendorong tingkah laku lestari"
    id: "Menganalisis pendorong perilaku berkelanjutan"
    hi: "सस्टेनेबल व्यवहार के कारणों का विश्लेषण"
  - en: "Suggest ways to build environmental concern"
    zh: "提出提升环保意识的策略"
    zh-TW: "提出提升環保意識的策略"
    ja: "環境への関心を高める方策を提案する"
    ko: "환경 관심을 높일 전략을 제안한다"
    vi: "Đề xuất cách nâng cao ý thức môi trường"
    ms: "Cadang cara tingkatkan keprihatinan alam sekitar"
    id: "Mengusulkan cara meningkatkan kepedulian lingkungan"
    hi: "पर्यावरण जागरूकता बढ़ाने के तरीके सुझाना"
