code: ABPL90420
year: 2027
learn:
  en: "Architecture that responds to people, using sensors, actuators and computational design to create adaptive spaces."
  zh: "利用传感器、执行器和计算设计，打造能回应人的自适应建筑空间。"
  zh-TW: "利用感測器、致動器和計算設計，打造能回應人的自適應建築空間。"
  ja: "センサー・アクチュエーター・計算設計で、人に反応する適応的な空間をつくる。"
  ko: "센서, 액추에이터, 컴퓨테이셔널 디자인으로 사람에 반응하는 적응형 공간을 만듭니다."
  vi: "Kiến trúc phản hồi con người, dùng cảm biến, cơ cấu chấp hành và thiết kế tính toán."
  ms: "Seni bina yang bertindak balas kepada manusia dengan sensor, penggerak dan reka bentuk pengiraan."
  id: "Arsitektur yang merespons manusia dengan sensor, aktuator, dan desain komputasional."
  hi: "सेंसर, एक्चुएटर और कम्प्यूटेशनल डिज़ाइन से लोगों पर प्रतिक्रिया देने वाली अनुकूली वास्तुकला।"
outcomes:
  - en: "Design adaptive spaces with sensors"
    zh: "用传感器设计自适应空间"
    zh-TW: "用感測器設計自適應空間"
    ja: "センサーで適応空間を設計する"
    ko: "센서로 적응형 공간 설계하기"
    vi: "Thiết kế không gian thích ứng với cảm biến"
    ms: "Mereka ruang adaptif dengan sensor"
    id: "Mendesain ruang adaptif dengan sensor"
    hi: "सेंसर से अनुकूली स्थान डिज़ाइन करना"
  - en: "Work with engineers and computing specialists"
    zh: "与工程和计算领域的人合作"
    zh-TW: "與工程和計算領域的人合作"
    ja: "工学や情報の専門家と協働する"
    ko: "공학·컴퓨팅 전문가와 협업하기"
    vi: "Hợp tác với kỹ sư và chuyên gia máy tính"
    ms: "Bekerjasama dengan jurutera dan pakar pengkomputeran"
    id: "Bekerja sama dengan insinyur dan ahli komputasi"
    hi: "इंजीनियरों और कंप्यूटिंग विशेषज्ञों के साथ काम"
