code: FINA10026
year: 2026
learn:
  en: "How to describe and interpret art, from the earliest works to the late 1800s, with essay and research skills."
  zh: "学习描述与解读艺术，从最早作品到19世纪末，并练习论文与研究技能。"
  zh-TW: "學習描述與解讀藝術，從最早作品到19世紀末，並練習論文與研究技能。"
  ja: "最古の作品から19世紀末までの美術を記述・解釈し、論文と調査の技能を磨く。"
  ko: "가장 오래된 작품부터 19세기 말까지 미술을 서술·해석하고 에세이·조사 능력을 기른다."
  vi: "Cách mô tả và diễn giải nghệ thuật từ thời sơ khai đến cuối thế kỷ 19, kèm kỹ năng viết và nghiên cứu."
  ms: "Cara menghurai dan mentafsir seni dari karya terawal hingga akhir 1800-an, dengan kemahiran esei dan kajian."
  id: "Cara mendeskripsikan dan menafsirkan seni dari karya terawal hingga akhir 1800-an, plus menulis esai dan riset."
  hi: "शुरुआती कला से 1800 के अंत तक कला का वर्णन-व्याख्या करना, निबंध और रिसर्च कौशल के साथ।"
outcomes:
  - en: "Describe and interpret works of art"
    zh: "描述并解读艺术作品"
    zh-TW: "描述並解讀藝術作品"
    ja: "美術作品を記述し解釈する"
    ko: "미술 작품 서술·해석하기"
    vi: "Mô tả và diễn giải tác phẩm nghệ thuật"
    ms: "Huraikan dan tafsir karya seni"
    id: "Mendeskripsikan dan menafsirkan karya seni"
    hi: "कलाकृतियों का वर्णन और व्याख्या करना"
  - en: "Link art to its historical context"
    zh: "把艺术与历史背景联系起来"
    zh-TW: "把藝術與歷史背景連結起來"
    ja: "美術を歴史的文脈と結びつける"
    ko: "미술을 역사적 맥락과 연결하기"
    vi: "Gắn nghệ thuật với bối cảnh lịch sử"
    ms: "Kaitkan seni dengan konteks sejarah"
    id: "Mengaitkan seni dengan konteks sejarah"
    hi: "कला को उसके ऐतिहासिक संदर्भ से जोड़ना"
  - en: "Research and write an art history essay"
    zh: "研究并撰写艺术史论文"
    zh-TW: "研究並撰寫藝術史論文"
    ja: "美術史の論文を調べて書く"
    ko: "미술사 에세이 조사·작성하기"
    vi: "Nghiên cứu và viết tiểu luận lịch sử nghệ thuật"
    ms: "Kaji dan tulis esei sejarah seni"
    id: "Meriset dan menulis esai sejarah seni"
    hi: "कला-इतिहास पर रिसर्च करके निबंध लिखना"
