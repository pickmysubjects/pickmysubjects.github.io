code: MGMT90267
year: 2027
learn:
  en: "Using machine learning for business decisions: clustering, logistic regression, decision trees, neural nets, and AI's limits."
  zh: "用机器学习辅助商业决策：聚类、逻辑回归、决策树、神经网络，以及 AI 的局限。"
  zh-TW: "用機器學習輔助商業決策：分群、邏輯迴歸、決策樹、神經網路，以及 AI 的侷限。"
  ja: "機械学習を経営判断に使う：クラスタリング、ロジスティック回帰、決定木、ニューラルネット、AIの限界。"
  ko: "머신러닝을 경영 의사결정에 활용: 군집화, 로지스틱 회귀, 의사결정나무, 신경망, AI의 한계."
  vi: "Dùng học máy cho quyết định kinh doanh: phân cụm, hồi quy logistic, cây quyết định, mạng nơ-ron, giới hạn của AI."
  ms: "Menggunakan pembelajaran mesin untuk keputusan: kelompok, regresi logistik, pokok keputusan, rangkaian neural, had AI."
  id: "Memakai machine learning untuk keputusan bisnis: klaster, regresi logistik, pohon keputusan, jaringan saraf, batas AI."
  hi: "कारोबारी फ़ैसलों में मशीन लर्निंग: क्लस्टरिंग, लॉजिस्टिक रिग्रेशन, डिसीज़न ट्री, न्यूरल नेट और AI की सीमाएँ।"
outcomes:
  - en: "Apply ML methods to a business problem and read results"
    zh: "将机器学习方法用于商业问题并解读结果"
    zh-TW: "將機器學習方法用於商業問題並解讀結果"
    ja: "機械学習を業務課題に使い結果を読み解く"
    ko: "머신러닝을 업무 문제에 적용하고 결과 해석하기"
    vi: "Áp dụng học máy vào bài toán kinh doanh, đọc kết quả"
    ms: "Menggunakan ML pada masalah perniagaan dan mentafsir hasil"
    id: "Menerapkan ML pada masalah bisnis dan membaca hasilnya"
    hi: "मशीन लर्निंग को व्यावसायिक समस्या पर लगाकर नतीजे समझना"
  - en: "Decide whether and how to use AI at work"
    zh: "判断是否以及如何在工作中使用 AI"
    zh-TW: "判斷是否以及如何在工作中使用 AI"
    ja: "職場でAIを使うか、どう使うかを判断する"
    ko: "직장에서 AI를 쓸지, 어떻게 쓸지 판단하기"
    vi: "Quyết định có nên và cách dùng AI trong công việc"
    ms: "Menentukan sama ada dan cara menggunakan AI di tempat kerja"
    id: "Memutuskan perlu tidaknya dan cara memakai AI di kerja"
    hi: "तय करना कि काम पर AI लगाएँ या नहीं, और कैसे"
