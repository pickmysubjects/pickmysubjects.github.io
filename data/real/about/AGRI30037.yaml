code: AGRI30037
year: 2026
learn:
  en: "Managing farm soils sustainably using soil chemistry, physics, biology and soil test data."
  zh: "用土壤化学、物理、生物和检测数据可持续地管理农田土壤。"
  zh-TW: "用土壤化學、物理、生物與檢測數據永續管理農田土壤。"
  ja: "土壌の化学・物理・生物と土壌分析で農地を持続的に管理する。"
  ko: "토양의 화학·물리·생물과 검사 데이터로 농지를 지속 가능하게 관리한다."
  vi: "Quản lý đất nông nghiệp bền vững bằng hóa, lý, sinh học đất và dữ liệu xét nghiệm."
  ms: "Mengurus tanah ladang secara mampan dengan kimia, fizik, biologi dan data ujian tanah."
  id: "Mengelola tanah pertanian secara berkelanjutan dengan kimia, fisika, biologi, dan data uji tanah."
  hi: "मिट्टी के रसायन, भौतिकी, जीवविज्ञान और जाँच डेटा से खेत की मिट्टी का टिकाऊ प्रबंधन।"
outcomes:
  - en: "Design soil management fixes for farms"
    zh: "为农场设计土壤管理措施"
    zh-TW: "為農場設計土壤管理措施"
    ja: "農地の土壌管理策を立てる"
    ko: "농장 토양 관리 방안 설계하기"
    vi: "Đề xuất biện pháp quản lý đất cho trang trại"
    ms: "Reka langkah pengurusan tanah untuk ladang"
    id: "Merancang intervensi pengelolaan tanah"
    hi: "खेतों के लिए मिट्टी प्रबंधन उपाय बनाएँ"
  - en: "Evaluate practices using soil test data"
    zh: "用土壤检测数据评估耕作方法"
    zh-TW: "用土壤檢測數據評估耕作方式"
    ja: "土壌分析データで農法を評価する"
    ko: "토양 검사 데이터로 영농 방식 평가하기"
    vi: "Đánh giá canh tác bằng dữ liệu xét nghiệm đất"
    ms: "Nilai amalan dengan data ujian tanah"
    id: "Menilai praktik dengan data uji tanah"
    hi: "मिट्टी जाँच डेटा से खेती के तरीके आँकें"
  - en: "Assess soil variation across a landscape"
    zh: "评估地貌中土壤的空间差异"
    zh-TW: "評估地景中土壤的空間差異"
    ja: "景観内の土壌のばらつきを評価する"
    ko: "경관 내 토양 변이 평가하기"
    vi: "Đánh giá biến động đất theo cảnh quan"
    ms: "Nilai variasi tanah merentas landskap"
    id: "Menilai variasi tanah di lanskap"
    hi: "भू-दृश्य में मिट्टी के अंतर आँकें"
