code: MCEN90056
year: 2027
learn:
  en: "How industry uses the industrial internet of things and digital twins to link production, suppliers and product development."
  zh: "工业如何用工业物联网、数字孪生等数字技术打通生产、供应链和产品开发。"
  zh-TW: "工業如何用工業物聯網、數位孿生等數位技術串連生產、供應鏈與產品開發。"
  ja: "産業IoTやデジタルツインで生産・サプライチェーン・製品開発をつなぐ方法。"
  ko: "산업 IoT, 디지털 트윈으로 생산·공급망·제품 개발을 연결하는 방법."
  vi: "Cách công nghiệp dùng IoT công nghiệp, bản sao số để kết nối sản xuất, chuỗi cung ứng và phát triển sản phẩm."
  ms: "Cara industri menggunakan IoT industri dan kembar digital untuk menghubungkan pengeluaran, rantaian bekalan dan pembangunan produk."
  id: "Cara industri memakai IoT industri dan digital twin untuk menghubungkan produksi, rantai pasok, dan pengembangan produk."
  hi: "उद्योग IIoT और डिजिटल ट्विन से उत्पादन, सप्लाई चेन और उत्पाद विकास कैसे जोड़ता है।"
outcomes:
  - en: "Explain the technologies behind industrial digital transformation"
    zh: "解释工业数字化转型背后的技术"
    zh-TW: "解釋工業數位轉型背後的技術"
    ja: "産業のデジタル変革を支える技術を説明する"
    ko: "산업 디지털 전환의 기반 기술 설명하기"
    vi: "Giải thích công nghệ đằng sau chuyển đổi số công nghiệp"
    ms: "Menerangkan teknologi di sebalik transformasi digital industri"
    id: "Menjelaskan teknologi di balik transformasi digital industri"
    hi: "औद्योगिक डिजिटल परिवर्तन की तकनीकें समझाना"
  - en: "Compare vertical, horizontal and end-to-end integration"
    zh: "比较纵向、横向和端到端集成"
    zh-TW: "比較垂直、水平與端到端整合"
    ja: "垂直・水平・エンドツーエンド統合を比べる"
    ko: "수직·수평·엔드투엔드 통합 비교하기"
    vi: "So sánh tích hợp dọc, ngang và đầu-cuối"
    ms: "Membandingkan integrasi menegak, mendatar dan hujung ke hujung"
    id: "Membandingkan integrasi vertikal, horizontal, dan ujung ke ujung"
    hi: "वर्टिकल, हॉरिज़ॉन्टल और एंड-टू-एंड इंटीग्रेशन की तुलना"
