code: ABPL90034
year: 2027
learn:
  en: "Property as an investment through trusts, funds and listed and unlisted REITs: structures, pricing, financing and tax."
  zh: "通过信托、基金及上市和非上市 REIT 投资房地产：结构、定价、融资和税务。"
  zh-TW: "透過信託、基金及上市與非上市 REIT 投資不動產：結構、定價、融資與稅務。"
  ja: "信託・ファンド・上場/非上場REITによる不動産投資：仕組み、価格、資金調達、税。"
  ko: "신탁·펀드·상장/비상장 리츠를 통한 부동산 투자: 구조, 가격, 금융, 세금."
  vi: "Đầu tư bất động sản qua quỹ, tín thác và REIT: cấu trúc, định giá, tài trợ, thuế."
  ms: "Pelaburan hartanah melalui amanah, dana dan REIT: struktur, harga, pembiayaan dan cukai."
  id: "Investasi properti lewat trust, dana dan REIT: struktur, harga, pembiayaan dan pajak."
  hi: "ट्रस्ट, फ़ंड और REIT के ज़रिए संपत्ति निवेश: संरचना, मूल्य निर्धारण, वित्त और कर।"
