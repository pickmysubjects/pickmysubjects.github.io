code: COMP90077
year: 2027
learn:
  en: "Advanced algorithms and data structures for problems where standard ones don't scale to huge data."
  zh: "应对海量数据的高级算法与数据结构，弥补常规方法的不足。"
  zh-TW: "應對海量資料的進階演算法與資料結構，補足常規方法的不足。"
  ja: "標準手法では追いつかない巨大データ向けの高度なアルゴリズムとデータ構造。"
  ko: "표준 방법으로 감당 못 하는 대용량 데이터를 위한 고급 알고리즘과 자료구조."
  vi: "Thuật toán và cấu trúc dữ liệu nâng cao cho dữ liệu khổng lồ mà cách thông thường không đáp ứng."
  ms: "Algoritma dan struktur data lanjutan untuk data besar yang kaedah biasa tak mampu."
  id: "Algoritma dan struktur data lanjutan untuk data besar yang tak tertangani cara standar."
  hi: "बहुत बड़े डेटा के लिए उन्नत एल्गोरिद्म और डेटा स्ट्रक्चर, जहाँ सामान्य तरीके नहीं चलते।"
outcomes:
  - en: "Design and reason about advanced data structures"
    zh: "设计并分析高级数据结构"
    zh-TW: "設計並分析進階資料結構"
    ja: "高度なデータ構造を設計・分析する"
    ko: "고급 자료구조 설계·분석하기"
    vi: "Thiết kế và lập luận về cấu trúc dữ liệu nâng cao"
    ms: "Reka dan analisis struktur data lanjutan"
    id: "Merancang dan menganalisis struktur data lanjutan"
    hi: "उन्नत डेटा स्ट्रक्चर डिज़ाइन और विश्लेषण करना"
  - en: "Analyse algorithm performance on large inputs"
    zh: "分析算法在大规模输入下的性能"
    zh-TW: "分析演算法在大規模輸入下的效能"
    ja: "大きな入力での性能を分析する"
    ko: "대규모 입력에서 성능 분석하기"
    vi: "Phân tích hiệu năng thuật toán với đầu vào lớn"
    ms: "Analisis prestasi algoritma pada input besar"
    id: "Menganalisis kinerja algoritma pada input besar"
    hi: "बड़े इनपुट पर एल्गोरिद्म का प्रदर्शन आंकना"
