code: ABPL90406
year: 2027
learn:
  en: "Real estate derivatives and structured products: options, forwards, futures and swaps applied to property."
  zh: "房地产衍生品与结构化产品：期权、远期、期货和互换在房地产中的应用。"
  zh-TW: "房地產衍生性商品與結構型商品：選擇權、遠期、期貨和交換在房地產中的應用。"
  ja: "不動産デリバティブと仕組商品：オプション・先渡・先物・スワップの不動産への応用。"
  ko: "부동산 파생상품과 구조화 상품: 옵션, 선도, 선물, 스왑의 부동산 적용."
  vi: "Phái sinh và sản phẩm cấu trúc bất động sản: quyền chọn, kỳ hạn, tương lai và hoán đổi."
  ms: "Derivatif dan produk berstruktur hartanah: opsyen, hadapan, niaga hadapan dan swap."
  id: "Derivatif dan produk terstruktur properti: opsi, forward, futures, dan swap."
  hi: "रियल एस्टेट डेरिवेटिव और स्ट्रक्चर्ड उत्पाद: ऑप्शन, फ़ॉरवर्ड, फ़्यूचर और स्वैप।"
outcomes:
  - en: "Build a base model for structured products"
    zh: "为结构化产品建立基础模型"
    zh-TW: "為結構型商品建立基礎模型"
    ja: "仕組商品の基本モデルをつくる"
    ko: "구조화 상품 기본 모델 만들기"
    vi: "Xây mô hình cơ bản cho sản phẩm cấu trúc"
    ms: "Membina model asas produk berstruktur"
    id: "Membuat model dasar produk terstruktur"
    hi: "स्ट्रक्चर्ड उत्पादों का बेस मॉडल बनाना"
  - en: "Link property risks to derivatives"
    zh: "把房地产风险与衍生品联系起来"
    zh-TW: "把房地產風險與衍生性商品連結"
    ja: "不動産リスクとデリバティブを結びつける"
    ko: "부동산 위험과 파생상품 연결하기"
    vi: "Liên hệ rủi ro bất động sản với phái sinh"
    ms: "Mengaitkan risiko hartanah dengan derivatif"
    id: "Mengaitkan risiko properti dengan derivatif"
    hi: "संपत्ति जोखिम को डेरिवेटिव से जोड़ना"
