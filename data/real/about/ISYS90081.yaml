code: ISYS90081
year: 2027
learn:
  en: "Finding, modelling in BPMN, analysing, redesigning and monitoring how work flows through an organisation."
  zh: "识别业务流程、用 BPMN 建模，并对其进行分析、重新设计和监控。"
  zh-TW: "辨識業務流程、以 BPMN 建模，並進行分析、重新設計與監控。"
  ja: "業務プロセスを見つけ、BPMNでモデル化し、分析・再設計・監視する。"
  ko: "업무 프로세스를 찾고 BPMN으로 모델링한 뒤 분석·재설계·모니터링하기."
  vi: "Tìm quy trình, mô hình hóa bằng BPMN, phân tích, thiết kế lại và giám sát cách công việc vận hành."
  ms: "Mengenal pasti proses, memodelkannya dengan BPMN, menganalisis, mereka semula dan memantaunya."
  id: "Menemukan proses, memodelkannya dengan BPMN, menganalisis, merancang ulang, dan memantaunya."
  hi: "संगठन में काम के प्रवाह को पहचानना, BPMN में मॉडल करना, विश्लेषण, नया डिज़ाइन और निगरानी करना।"
outcomes:
  - en: "Model business processes in BPMN"
    zh: "用 BPMN 为业务流程建模"
    zh-TW: "以 BPMN 為業務流程建模"
    ja: "BPMNで業務プロセスをモデル化する"
    ko: "BPMN으로 업무 프로세스 모델링하기"
    vi: "Mô hình hóa quy trình nghiệp vụ bằng BPMN"
    ms: "Memodelkan proses perniagaan dengan BPMN"
    id: "Memodelkan proses bisnis dengan BPMN"
    hi: "BPMN में बिज़नेस प्रक्रियाओं का मॉडल बनाना"
  - en: "Find process problems and redesign the process"
    zh: "找出流程问题并重新设计流程"
    zh-TW: "找出流程問題並重新設計"
    ja: "プロセスの問題を見つけて再設計する"
    ko: "프로세스 문제를 찾아 재설계하기"
    vi: "Tìm vấn đề trong quy trình và thiết kế lại"
    ms: "Mengenal pasti masalah proses dan mereka semula"
    id: "Menemukan masalah proses dan merancang ulang"
    hi: "प्रक्रिया की कमियाँ ढूँढना और उसे फिर से डिज़ाइन करना"
