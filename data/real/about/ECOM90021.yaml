code: ECOM90021
year: 2027
learn:
  en: "An independent applied econometrics research project, presented in a talk and an extended written report."
  zh: "独立完成应用计量研究，口头汇报并撰写长篇报告。"
  zh-TW: "獨立完成應用計量研究，口頭報告並撰寫長篇報告。"
  ja: "応用計量の独立研究を行い、口頭発表と長めの報告書にまとめる。"
  ko: "독립적인 응용계량 연구를 수행하고 발표와 긴 보고서로 정리."
  vi: "Dự án nghiên cứu kinh tế lượng ứng dụng độc lập, trình bày miệng và viết báo cáo dài."
  ms: "Projek penyelidikan ekonometrik gunaan secara bebas, dibentang secara lisan dan laporan bertulis panjang."
  id: "Proyek riset ekonometrika terapan mandiri, dipresentasikan lisan dan dalam laporan tertulis panjang."
  hi: "स्वतंत्र एप्लाइड इकोनोमेट्रिक्स शोध प्रोजेक्ट, मौखिक प्रस्तुति और विस्तृत लिखित रिपोर्ट के साथ।"
outcomes:
  - en: "Research a topic independently"
    zh: "独立研究一个课题"
    zh-TW: "獨立研究一個題目"
    ja: "テーマを自力で研究する"
    ko: "주제를 독립적으로 연구하기"
    vi: "Tự nghiên cứu một chủ đề"
    ms: "Menyelidik topik secara bebas"
    id: "Meneliti topik secara mandiri"
    hi: "किसी विषय पर स्वतंत्र शोध"
  - en: "Present results orally and in a report"
    zh: "口头和书面呈现研究结果"
    zh-TW: "以口頭與書面呈現成果"
    ja: "口頭と報告書で結果を発表する"
    ko: "결과를 발표와 보고서로 제시하기"
    vi: "Trình bày kết quả bằng lời và báo cáo"
    ms: "Membentang keputusan secara lisan dan laporan"
    id: "Menyajikan hasil secara lisan dan laporan"
    hi: "नतीजे मौखिक व रिपोर्ट में प्रस्तुत करना"
