code: ABPL90085
year: 2027
learn:
  en: "How buildings have been made from antiquity on, mainly the 19th and 20th centuries, and how materials and skills spread between cultures."
  zh: "从古代起建筑如何建造，重点是 19、20 世纪，以及材料和技艺如何在文化间传播。"
  zh-TW: "從古代起建築如何興建，重點在 19、20 世紀，以及材料與技藝如何在文化間傳播。"
  ja: "古代からの建物の造り方、特に19〜20世紀。材料と技術の文化間の伝わり方。"
  ko: "고대부터의 건축 방식, 특히 19~20세기. 재료와 기술의 문화 간 전파."
  vi: "Cách xây dựng từ cổ đại, chủ yếu thế kỷ 19–20, và sự lan truyền vật liệu, kỹ năng giữa các nền văn hóa."
  ms: "Cara bangunan dibina sejak zaman purba, terutama abad ke-19 dan ke-20, dan penyebaran kemahiran."
  id: "Cara bangunan dibuat sejak zaman kuno, terutama abad ke-19 dan ke-20, dan penyebaran keterampilan."
  hi: "प्राचीन काल से इमारतें कैसे बनीं, ख़ासकर 19वीं-20वीं सदी, और कौशल का संस्कृतियों में फैलाव।"
outcomes:
  - en: "Trace the origins of traditional building methods"
    zh: "追溯传统建造方法的起源"
    zh-TW: "追溯傳統營造方法的起源"
    ja: "伝統的な工法の起源をたどる"
    ko: "전통 건축 방식의 기원 추적하기"
    vi: "Truy nguồn gốc phương pháp xây truyền thống"
    ms: "Menjejak asal-usul kaedah binaan tradisional"
    id: "Menelusuri asal-usul metode bangunan tradisional"
    hi: "पारंपरिक निर्माण विधियों की उत्पत्ति खोजना"
  - en: "Plan and write a research report on construction history"
    zh: "策划并撰写建造史研究报告"
    zh-TW: "規劃並撰寫營建史研究報告"
    ja: "建設史の研究報告を計画し書く"
    ko: "건축사 연구 보고서 계획·작성하기"
    vi: "Lập và viết báo cáo nghiên cứu lịch sử xây dựng"
    ms: "Merancang dan menulis laporan sejarah pembinaan"
    id: "Merencanakan dan menulis laporan sejarah konstruksi"
    hi: "निर्माण इतिहास पर शोध रिपोर्ट लिखना"
