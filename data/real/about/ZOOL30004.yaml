code: ZOOL30004
year: 2026
learn:
  en: "Using evolution to understand human origins, behaviour and the systems humans create."
  zh: "用进化论理解人类起源、行为和人类造成的系统。"
  zh-TW: "用演化論理解人類起源、行為和人類造成的系統。"
  ja: "進化の視点で人類の起源・行動・人が作る仕組みを理解する。"
  ko: "진화로 인간의 기원, 행동, 인간이 만든 시스템 이해하기."
  vi: "Dùng tiến hóa để hiểu nguồn gốc, hành vi con người và hệ thống do người tạo ra."
  ms: "Guna evolusi untuk memahami asal usul, tingkah laku manusia dan sistem buatan manusia."
  id: "Memakai evolusi untuk memahami asal-usul, perilaku manusia, dan sistem buatan manusia."
  hi: "विकासवाद से इंसान की उत्पत्ति, व्यवहार और इंसानी सिस्टम समझना।"
outcomes:
  - en: "Explain evolutionary ideas to a general audience"
    zh: "向大众解释进化观点"
    zh-TW: "向大眾解釋演化觀點"
    ja: "進化の考えを一般向けに説明する"
    ko: "일반인에게 진화 관점 설명하기"
    vi: "Giải thích quan điểm tiến hóa cho công chúng"
    ms: "Menerangkan idea evolusi kepada orang awam"
    id: "Menjelaskan gagasan evolusi kepada publik"
    hi: "आम लोगों को विकासवादी विचार समझाना"
  - en: "Search and critique the literature"
    zh: "检索并评析文献"
    zh-TW: "檢索並評析文獻"
    ja: "文献を調べ批判的に評価する"
    ko: "문헌 검색하고 비평하기"
    vi: "Tìm kiếm và phê bình tài liệu"
    ms: "Mencari dan mengkritik literatur"
    id: "Mencari dan mengkritisi literatur"
    hi: "साहित्य खोजना और उसकी समीक्षा करना"
