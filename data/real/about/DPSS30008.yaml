code: DPSS30008
year: 2026
learn:
  en: "The first half of a two-part final-year subject: a senior role on a VCA production or your own independent project."
  zh: "两部分毕业年课程的前半：在VCA演出中担任主要岗位，或做自己的独立项目。"
  zh-TW: "兩部分畢業年課程的前半：在VCA演出中擔任主要職位，或做自己的獨立專題。"
  ja: "2部構成の最終学年科目の前半。VCA公演で主要な役割を担うか、独自のプロジェクトを行う。"
  ko: "두 부분으로 된 졸업학년 과목의 전반부. VCA 공연의 주요 역할 또는 독립 프로젝트."
  vi: "Nửa đầu môn năm cuối hai phần: vai trò chính ở vở VCA hoặc dự án độc lập."
  ms: "Separuh pertama subjek tahun akhir dua bahagian: peranan kanan atau projek sendiri."
  id: "Paruh pertama mata kuliah tahun akhir: peran senior di produksi VCA atau proyek mandiri."
  hi: "दो भाग वाले अंतिम वर्ष विषय का पहला भाग: VCA प्रोडक्शन में वरिष्ठ भूमिका या अपना प्रोजेक्ट।"
outcomes:
  - en: "Lead a production role or project"
    zh: "主导一个制作岗位或项目"
    zh-TW: "主導一個製作職位或專題"
    ja: "制作の役割やプロジェクトを率いる"
    ko: "제작 역할이나 프로젝트 이끌기"
    vi: "Dẫn dắt một vai trò hoặc dự án"
    ms: "Pimpin peranan atau projek produksi"
    id: "Memimpin peran atau proyek produksi"
    hi: "प्रोडक्शन भूमिका या प्रोजेक्ट का नेतृत्व"
  - en: "Manage time, budget and people"
    zh: "管理时间、预算和人员"
    zh-TW: "管理時間、預算與人員"
    ja: "時間・予算・人を管理する"
    ko: "시간·예산·인력 관리하기"
    vi: "Quản lý thời gian, ngân sách, con người"
    ms: "Urus masa, belanjawan dan orang"
    id: "Mengelola waktu, anggaran, dan orang"
    hi: "समय, बजट और लोगों का प्रबंधन"
  - en: "Reflect critically on your practice"
    zh: "批判性地反思自己的实践"
    zh-TW: "批判性地反思自己的實務"
    ja: "自分の実践を批判的に振り返る"
    ko: "자신의 작업을 비판적으로 성찰하기"
    vi: "Suy ngẫm phản biện về thực hành"
    ms: "Renung secara kritis amalan sendiri"
    id: "Merefleksikan praktik secara kritis"
    hi: "अपने काम पर आलोचनात्मक चिंतन"
