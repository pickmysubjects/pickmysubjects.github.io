code: GEOG30029
year: 2026
learn:
  en: "Theories, patterns and issues of human migration, from refugees and labour migration to moving from country to city."
  zh: "人口迁移的理论、格局和议题，从难民、劳务移民到从乡村迁往城市。"
  zh-TW: "人口遷移的理論、格局和議題，從難民、勞務移民到從鄉村遷往城市。"
  ja: "難民や労働移住から農村から都市への移動まで、人の移住の理論・パターン・課題を学ぶ。"
  ko: "난민과 노동 이주부터 농촌에서 도시로의 이동까지 인구 이동의 이론, 양상, 쟁점을 배운다."
  vi: "Lý thuyết, xu hướng và vấn đề di cư, từ tị nạn, di cư lao động đến di chuyển từ nông thôn ra thành thị."
  ms: "Teori, corak dan isu migrasi manusia, daripada pelarian dan migrasi buruh hingga berpindah dari desa ke bandar."
  id: "Teori, pola, dan isu migrasi manusia, dari pengungsi dan migrasi tenaga kerja hingga perpindahan dari desa ke kota."
  hi: "मानव प्रवास के सिद्धांत, पैटर्न और मुद्दे, शरणार्थियों और श्रम प्रवास से गाँव से शहर जाने तक।"
outcomes:
  - en: "Explain key theories of migration"
    zh: "解释主要的迁移理论"
    zh-TW: "解釋主要的遷移理論"
    ja: "移住の主な理論を説明する"
    ko: "이주의 주요 이론 설명하기"
    vi: "Giải thích các lý thuyết di cư chính"
    ms: "Terangkan teori utama migrasi"
    id: "Menjelaskan teori utama migrasi"
    hi: "प्रवास के मुख्य सिद्धांत समझाना"
  - en: "Describe global and internal migration patterns"
    zh: "描述国际与国内的迁移格局"
    zh-TW: "描述國際與國內的遷移格局"
    ja: "国際移住と国内移住のパターンを説明する"
    ko: "국제 및 국내 이주 양상 설명하기"
    vi: "Mô tả xu hướng di cư quốc tế và trong nước"
    ms: "Huraikan corak migrasi global dan dalaman"
    id: "Mendeskripsikan pola migrasi global dan internal"
    hi: "वैश्विक और आंतरिक प्रवास के पैटर्न का वर्णन करना"
  - en: "Analyse current issues such as forced displacement"
    zh: "分析被迫流离等当下问题"
    zh-TW: "分析被迫流離等當下問題"
    ja: "強制移動などの今の問題を分析する"
    ko: "강제 이주 같은 현재 문제 분석하기"
    vi: "Phân tích các vấn đề hiện nay như di dời cưỡng bức"
    ms: "Analisis isu semasa seperti pemindahan paksa"
    id: "Menganalisis isu terkini seperti pengungsian paksa"
    hi: "जबरन विस्थापन जैसे मौजूदा मुद्दों का विश्लेषण करना"
