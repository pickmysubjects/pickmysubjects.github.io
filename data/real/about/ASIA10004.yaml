code: ASIA10004
year: 2027
learn:
  en: "Change across Asia, with a focus on South Asia: economies, democracy, environment, culture like Bollywood, and Covid-19."
  zh: "亚洲的变化与挑战，以南亚为重点：经济、民主、环境、宝莱坞等文化以及新冠疫情。"
  zh-TW: "亞洲的變化與挑戰，以南亞為重點：經濟、民主、環境、寶萊塢等文化以及新冠疫情。"
  ja: "南アジアを中心に見るアジアの変化：経済、民主主義、環境、ボリウッドなどの文化、新型コロナ。"
  ko: "남아시아 중심으로 본 아시아의 변화: 경제, 민주주의, 환경, 발리우드 같은 문화, 코로나19."
  vi: "Những thay đổi ở châu Á, tập trung vào Nam Á: kinh tế, dân chủ, môi trường, văn hóa như Bollywood và Covid-19."
  ms: "Perubahan di Asia dengan fokus Asia Selatan: ekonomi, demokrasi, alam sekitar, budaya seperti Bollywood, dan Covid-19."
  id: "Perubahan di Asia dengan fokus Asia Selatan: ekonomi, demokrasi, lingkungan, budaya seperti Bollywood, dan Covid-19."
  hi: "दक्षिण एशिया पर ध्यान के साथ एशिया में बदलाव: अर्थव्यवस्था, लोकतंत्र, पर्यावरण, बॉलीवुड जैसी संस्कृति और कोविड-19।"
outcomes:
  - en: "Summarise and evaluate research on Asia"
    zh: "总结和评价有关亚洲的学术研究"
    zh-TW: "總結和評價有關亞洲的學術研究"
    ja: "アジアに関する研究をまとめて評価する"
    ko: "아시아에 관한 연구 요약·평가하기"
    vi: "Tóm tắt và đánh giá nghiên cứu về châu Á"
    ms: "Ringkas dan nilai kajian tentang Asia"
    id: "Merangkum dan menilai kajian tentang Asia"
    hi: "एशिया पर शोध का सार और मूल्यांकन"
  - en: "Compare regions across Asia"
    zh: "对亚洲各地区进行比较"
    zh-TW: "對亞洲各地區進行比較"
    ja: "アジアの地域を比較する"
    ko: "아시아 지역들 비교하기"
    vi: "So sánh các khu vực ở châu Á"
    ms: "Bandingkan rantau di seluruh Asia"
    id: "Membandingkan kawasan di Asia"
    hi: "एशिया के क्षेत्रों की तुलना करना"
  - en: "Explain why studying South Asia matters"
    zh: "说明研究南亚的重要性"
    zh-TW: "說明研究南亞的重要性"
    ja: "南アジアを学ぶ意義を説明する"
    ko: "남아시아를 공부하는 이유 설명하기"
    vi: "Giải thích vì sao nghiên cứu Nam Á quan trọng"
    ms: "Terangkan kepentingan mengkaji Asia Selatan"
    id: "Menjelaskan pentingnya mempelajari Asia Selatan"
    hi: "दक्षिण एशिया के अध्ययन का महत्व समझाना"
