code: SOCI30009
year: 2026
learn:
  en: "Why risk and uncertainty matter so much in modern life, from shifting work and families to tech and disasters."
  zh: "为什么风险与不确定性在现代生活中如此重要，从工作和家庭变化到科技与灾难。"
  zh-TW: "為什麼風險與不確定性在現代生活中如此重要，從工作和家庭變化到科技與災難。"
  ja: "仕事や家族の変化から技術や災害まで、現代生活でリスクと不確実性がなぜ重要かを学ぶ。"
  ko: "일과 가족의 변화부터 기술과 재난까지, 현대 생활에서 위험과 불확실성이 왜 중요한지 배운다."
  vi: "Vì sao rủi ro và bất định quan trọng trong đời sống hiện đại, từ việc làm, gia đình đến công nghệ và thảm họa."
  ms: "Mengapa risiko dan ketidakpastian penting dalam kehidupan moden, daripada kerja dan keluarga hingga teknologi dan bencana."
  id: "Mengapa risiko dan ketidakpastian penting dalam hidup modern, dari pekerjaan dan keluarga sampai teknologi dan bencana."
  hi: "आधुनिक जीवन में जोखिम और अनिश्चितता इतनी अहम क्यों हैं, बदलते काम और परिवार से लेकर तकनीक और आपदाओं तक।"
outcomes:
  - en: "Explain main theories of the risk society"
    zh: "说明风险社会的主要理论"
    zh-TW: "說明風險社會的主要理論"
    ja: "リスク社会の主な理論を説明する"
    ko: "위험 사회의 주요 이론 설명하기"
    vi: "Giải thích các lý thuyết chính về xã hội rủi ro"
    ms: "Terangkan teori utama masyarakat berisiko"
    id: "Menjelaskan teori utama masyarakat risiko"
    hi: "जोखिम समाज के मुख्य सिद्धांत समझाना"
  - en: "Analyse how people and institutions handle risk"
    zh: "分析个人和机构如何应对风险"
    zh-TW: "分析個人和機構如何應對風險"
    ja: "人や制度がリスクにどう対処するか分析する"
    ko: "개인과 제도가 위험에 대처하는 방식 분석하기"
    vi: "Phân tích cách con người và thể chế xử lý rủi ro"
    ms: "Analisis cara individu dan institusi menangani risiko"
    id: "Menganalisis cara orang dan lembaga menangani risiko"
    hi: "लोग और संस्थाएं जोखिम से कैसे निपटते हैं, विश्लेषण करना"
  - en: "Apply risk ideas to issues like AI and climate"
    zh: "把风险理论用于人工智能和气候等议题"
    zh-TW: "把風險理論用於人工智慧和氣候等議題"
    ja: "リスクの考えをAIや気候の問題に当てはめる"
    ko: "위험 개념을 AI와 기후 문제에 적용하기"
    vi: "Áp dụng ý tưởng rủi ro vào các vấn đề như AI và khí hậu"
    ms: "Gunakan idea risiko pada isu seperti AI dan iklim"
    id: "Menerapkan gagasan risiko pada isu seperti AI dan iklim"
    hi: "जोखिम के विचार AI और जलवायु जैसे मुद्दों पर लागू करना"
