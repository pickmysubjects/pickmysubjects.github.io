code: LING20013
year: 2027
learn:
  en: "How English grew from its origins into a global language, studied through changes seen in historical texts."
  zh: "英语如何从起源发展成全球语言，通过历史文本观察其变化。"
  zh-TW: "英語如何從起源發展成全球語言，透過歷史文本觀察其變化。"
  ja: "英語が起源から世界語になるまでの歩みを、歴史的な文章の変化から学ぶ。"
  ko: "영어가 기원에서 세계어가 되기까지의 변화를 역사 문헌을 통해 살펴봄."
  vi: "Tiếng Anh phát triển từ nguồn gốc thành ngôn ngữ toàn cầu ra sao, qua những thay đổi trong văn bản lịch sử."
  ms: "Cara bahasa Inggeris berkembang daripada asal-usulnya menjadi bahasa global, dikaji melalui perubahan dalam teks sejarah."
  id: "Bagaimana bahasa Inggris berkembang dari asal-usulnya menjadi bahasa global, dipelajari lewat perubahan dalam teks sejarah."
  hi: "अंग्रेज़ी अपनी शुरुआत से वैश्विक भाषा कैसे बनी, ऐतिहासिक ग्रंथों में दिखे बदलावों के ज़रिए।"
outcomes:
  - en: "Describe changes in English words, spelling, sounds and grammar"
    zh: "描述英语在词汇、拼写、语音和语法上的变化"
    zh-TW: "描述英語在詞彙、拼寫、語音和文法上的變化"
    ja: "英語の語彙・綴り・音・文法の変化を説明する"
    ko: "영어의 어휘·철자·소리·문법 변화 설명하기"
    vi: "Mô tả thay đổi của tiếng Anh về từ vựng, chính tả, âm và ngữ pháp"
    ms: "Huraikan perubahan kosa kata, ejaan, bunyi dan tatabahasa Inggeris"
    id: "Menjelaskan perubahan kosakata, ejaan, bunyi, dan tata bahasa Inggris"
    hi: "अंग्रेज़ी के शब्द, वर्तनी, ध्वनि और व्याकरण में बदलाव बताना"
  - en: "Explain how social history drove language change"
    zh: "解释社会历史因素如何推动语言变化"
    zh-TW: "解釋社會歷史因素如何推動語言變化"
    ja: "社会や歴史が言語変化をどう促したかを説明する"
    ko: "사회·역사적 요인이 언어 변화를 이끈 방식 설명하기"
    vi: "Giải thích yếu tố xã hội - lịch sử thúc đẩy biến đổi ngôn ngữ"
    ms: "Terangkan cara faktor sosial dan sejarah mendorong perubahan bahasa"
    id: "Menjelaskan cara faktor sosial-sejarah mendorong perubahan bahasa"
    hi: "समझाना कि सामाजिक-ऐतिहासिक कारणों ने भाषा को कैसे बदला"
  - en: "Critique standard English and its colonial legacy"
    zh: "批判性看待标准英语及其殖民遗产"
    zh-TW: "批判性看待標準英語及其殖民遺緒"
    ja: "標準英語と植民地的な遺産を批判的に考える"
    ko: "표준 영어와 그 식민지적 유산을 비판적으로 보기"
    vi: "Nhìn nhận phê phán tiếng Anh chuẩn và di sản thuộc địa"
    ms: "Menilai secara kritis bahasa Inggeris standard dan warisan kolonialnya"
    id: "Menilai kritis bahasa Inggris baku dan warisan kolonialnya"
    hi: "मानक अंग्रेज़ी और उसकी औपनिवेशिक विरासत की आलोचनात्मक समझ"
