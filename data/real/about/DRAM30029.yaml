code: DRAM30029
year: 2026
learn:
  en: "The business side of acting: a development plan, promotional material, show reel, budgets, tax, agents and auditions."
  zh: "表演职业的实务：发展计划、宣传材料、作品片段、预算、税务、经纪人与试镜。"
  zh-TW: "表演職業的實務：發展計畫、宣傳素材、作品片段、預算、稅務、經紀人與試鏡。"
  ja: "俳優業の実務：育成計画、宣材、リール、予算、税金、エージェント、オーディション。"
  ko: "연기 직업의 실무: 발전 계획, 홍보물, 쇼릴, 예산, 세금, 에이전트, 오디션."
  vi: "Mặt kinh doanh của nghề diễn: kế hoạch phát triển, tư liệu quảng bá, showreel, ngân sách, thuế, đại diện, thử vai."
  ms: "Sisi perniagaan lakonan: pelan pembangunan, bahan promosi, showreel, bajet, cukai, ejen dan uji bakat."
  id: "Sisi bisnis akting: rencana pengembangan, materi promosi, showreel, anggaran, pajak, agen dan audisi."
  hi: "अभिनय का व्यावसायिक पक्ष: विकास योजना, प्रचार सामग्री, शो रील, बजट, टैक्स, एजेंट और ऑडिशन।"
outcomes:
  - en: "Write a professional development plan"
    zh: "撰写职业发展计划"
    zh-TW: "撰寫職涯發展計畫"
    ja: "キャリア開発計画を書く"
    ko: "직업 발전 계획서 쓰기"
    vi: "Viết kế hoạch phát triển nghề nghiệp"
    ms: "Tulis pelan pembangunan profesional"
    id: "Menulis rencana pengembangan profesional"
    hi: "पेशेवर विकास योजना लिखना"
  - en: "Make your own promotional material and reel"
    zh: "制作自己的宣传材料与作品片段"
    zh-TW: "製作自己的宣傳素材與作品片段"
    ja: "自分の宣材とリールを作る"
    ko: "자신의 홍보물과 쇼릴 만들기"
    vi: "Tự làm tư liệu quảng bá và showreel"
    ms: "Hasilkan bahan promosi dan showreel sendiri"
    id: "Membuat materi promosi dan showreel sendiri"
    hi: "अपनी प्रचार सामग्री और रील बनाना"
  - en: "Handle budgets, tax and agents as a freelancer"
    zh: "作为自由职业者处理预算、税务与经纪"
    zh-TW: "作為自由工作者處理預算、稅務與經紀"
    ja: "フリーとして予算・税金・エージェントを扱う"
    ko: "프리랜서로서 예산·세금·에이전트 다루기"
    vi: "Xử lý ngân sách, thuế, đại diện khi làm tự do"
    ms: "Urus bajet, cukai dan ejen sebagai pekerja bebas"
    id: "Mengurus anggaran, pajak dan agen sebagai pekerja lepas"
    hi: "फ़्रीलांसर के रूप में बजट, टैक्स और एजेंट संभालना"
