code: MGMT90197
year: 2027
learn:
  en: "Research-level survey of organisational behaviour topics like personality, diversity and emerging research areas."
  zh: "研究层面梳理组织行为学主题，如人格、多元化和新兴研究方向。"
  zh-TW: "研究層面梳理組織行為學主題，如人格、多元化和新興研究方向。"
  ja: "性格、多様性、新しい研究分野など組織行動論のテーマを研究レベルで学ぶ。"
  ko: "성격, 다양성, 신흥 연구 분야 등 조직행동 주제를 연구 수준에서 검토."
  vi: "Tổng quan hành vi tổ chức ở mức nghiên cứu: tính cách, đa dạng và hướng nghiên cứu mới."
  ms: "Tinjauan tingkah laku organisasi seperti personaliti, kepelbagaian dan bidang penyelidikan baharu."
  id: "Tinjauan perilaku organisasi seperti kepribadian, keberagaman, dan bidang riset baru."
  hi: "व्यक्तित्व, विविधता और उभरते शोध क्षेत्रों जैसे संगठनात्मक व्यवहार विषयों का शोध-स्तरीय अध्ययन।"
outcomes:
  - en: "Critically evaluate theories in organisational behaviour"
    zh: "批判地评估组织行为学理论"
    zh-TW: "批判地評估組織行為學理論"
    ja: "組織行動論の理論を批判的に評価する"
    ko: "조직행동 이론 비판적으로 평가하기"
    vi: "Đánh giá phản biện lý thuyết hành vi tổ chức"
    ms: "Menilai teori tingkah laku organisasi secara kritis"
    id: "Menilai teori perilaku organisasi secara kritis"
    hi: "संगठनात्मक व्यवहार सिद्धांतों का आलोचनात्मक मूल्यांकन"
  - en: "Turn topics into studies of research questions"
    zh: "把研究主题转化为可执行的研究"
    zh-TW: "把研究主題轉化為可執行的研究"
    ja: "テーマを研究課題として具体化する"
    ko: "주제를 연구 질문을 다루는 연구로 구체화하기"
    vi: "Biến chủ đề thành nghiên cứu cho câu hỏi cụ thể"
    ms: "Menukar topik menjadi kajian soalan penyelidikan"
    id: "Mengubah topik menjadi studi atas pertanyaan riset"
    hi: "विषयों को शोध प्रश्नों के अध्ययन में बदलना"
