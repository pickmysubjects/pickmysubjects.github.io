code: ENGM90016
year: 2027
learn:
  en: "Team capstone using business cases to plan engineering projects: finance, procurement, contracts, risk and budgets."
  zh: "团队毕业项目：用商业案例规划工程项目，涵盖财务、采购、合同、风险和预算。"
  zh-TW: "團隊畢業專題：用商業案例規劃工程專案，涵蓋財務、採購、合約、風險與預算。"
  ja: "ビジネスケースを使い、財務・調達・契約・リスク・予算を含めて工学プロジェクトを計画するチーム課題。"
  ko: "비즈니스 케이스로 재무, 조달, 계약, 위험, 예산을 포함한 공학 프로젝트를 계획하는 팀 캡스톤."
  vi: "Đồ án nhóm dùng tình huống kinh doanh để lập kế hoạch dự án kỹ thuật: tài chính, mua sắm, hợp đồng, rủi ro, ngân sách."
  ms: "Projek akhir berkumpulan menggunakan kes perniagaan untuk merancang projek kejuruteraan: kewangan, perolehan, kontrak, risiko dan bajet."
  id: "Proyek akhir tim memakai kasus bisnis untuk merencanakan proyek rekayasa: keuangan, pengadaan, kontrak, risiko, dan anggaran."
  hi: "बिज़नेस केस से इंजीनियरिंग परियोजना की योजना बनाने वाला टीम कैपस्टोन: वित्त, खरीद, अनुबंध, जोखिम और बजट।"
outcomes:
  - en: "Pitch a business case for an engineering project to senior leaders"
    zh: "向高层提交工程项目的商业案例"
    zh-TW: "向高層提交工程專案的商業案例"
    ja: "工学プロジェクトのビジネスケースを経営層に提案する"
    ko: "공학 프로젝트의 비즈니스 케이스를 경영진에게 제안하기"
    vi: "Trình bày tình huống kinh doanh của dự án kỹ thuật cho lãnh đạo cấp cao"
    ms: "Membentangkan kes perniagaan projek kejuruteraan kepada pengurusan atasan"
    id: "Mengajukan kasus bisnis proyek rekayasa kepada pimpinan senior"
    hi: "वरिष्ठ नेतृत्व के सामने इंजीनियरिंग परियोजना का बिज़नेस केस रखना"
  - en: "Use financial analysis to compare options and set budgets"
    zh: "用财务分析比较方案并制定预算"
    zh-TW: "用財務分析比較方案並制定預算"
    ja: "財務分析で選択肢を比較し予算を立てる"
    ko: "재무 분석으로 대안을 비교하고 예산 세우기"
    vi: "Dùng phân tích tài chính để so sánh phương án và lập ngân sách"
    ms: "Menggunakan analisis kewangan untuk membanding pilihan dan menetapkan bajet"
    id: "Memakai analisis keuangan untuk membandingkan opsi dan menyusun anggaran"
    hi: "वित्तीय विश्लेषण से विकल्पों की तुलना और बजट तय करना"
  - en: "Build a full project management plan covering cost, risk and schedule"
    zh: "制定涵盖成本、风险和进度的完整项目计划"
    zh-TW: "制定涵蓋成本、風險與進度的完整專案計畫"
    ja: "コスト・リスク・日程を含む完全なプロジェクト計画を作る"
    ko: "비용, 위험, 일정을 포함한 전체 프로젝트 관리 계획 세우기"
    vi: "Xây dựng kế hoạch quản lý dự án đầy đủ về chi phí, rủi ro và tiến độ"
    ms: "Membina pelan pengurusan projek lengkap merangkumi kos, risiko dan jadual"
    id: "Menyusun rencana manajemen proyek lengkap mencakup biaya, risiko, dan jadwal"
    hi: "लागत, जोखिम और समय-सारिणी सहित पूरी परियोजना प्रबंधन योजना बनाना"
