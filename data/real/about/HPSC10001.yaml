code: HPSC10001
year: 2026
learn:
  en: "How ideas about the physical world changed from ancient Greek philosophy to Einstein's theory of gravity."
  zh: "对物理世界的认识如何从古希腊哲学变化到爱因斯坦的引力理论。"
  zh-TW: "對物理世界的認識如何從古希臘哲學變化到愛因斯坦的引力理論。"
  ja: "物理的世界についての考えが、古代ギリシャ哲学からアインシュタインの重力理論までどう変わったかを学ぶ。"
  ko: "물리 세계에 대한 생각이 고대 그리스 철학부터 아인슈타인의 중력 이론까지 어떻게 변했는지 배운다."
  vi: "Quan niệm về thế giới vật chất thay đổi ra sao từ triết học Hy Lạp cổ đến thuyết hấp dẫn của Einstein."
  ms: "Cara idea tentang alam fizikal berubah daripada falsafah Yunani kuno hingga teori graviti Einstein."
  id: "Cara gagasan tentang dunia fisik berubah dari filsafat Yunani kuno hingga teori gravitasi Einstein."
  hi: "भौतिक जगत के बारे में विचार प्राचीन यूनानी दर्शन से आइंस्टाइन के गुरुत्व सिद्धांत तक कैसे बदले।"
outcomes:
  - en: "Outline the main stages in the history of science"
    zh: "概述科学史的主要阶段"
    zh-TW: "概述科學史的主要階段"
    ja: "科学史の主な段階をまとめる"
    ko: "과학사의 주요 단계 정리하기"
    vi: "Tóm tắt các giai đoạn chính của lịch sử khoa học"
    ms: "Ringkaskan peringkat utama sejarah sains"
    id: "Merangkum tahap utama sejarah sains"
    hi: "विज्ञान के इतिहास के मुख्य चरणों की रूपरेखा देना"
  - en: "Explain the shift to a mathematical view of nature"
    zh: "解释向数学化自然观的转变"
    zh-TW: "解釋向數學化自然觀的轉變"
    ja: "自然を数学で捉える見方への転換を説明する"
    ko: "자연을 수학으로 보는 관점으로의 전환 설명하기"
    vi: "Giải thích bước chuyển sang cách nhìn tự nhiên bằng toán học"
    ms: "Terangkan peralihan kepada pandangan matematik tentang alam"
    id: "Menjelaskan peralihan ke pandangan matematis tentang alam"
    hi: "प्रकृति को गणितीय नज़र से देखने के बदलाव को समझाना"
  - en: "Discuss how science relates to its culture"
    zh: "讨论科学与其所处文化的关系"
    zh-TW: "討論科學與其所處文化的關係"
    ja: "科学とその時代の文化の関係を論じる"
    ko: "과학과 그 시대 문화의 관계 논의하기"
    vi: "Thảo luận mối quan hệ giữa khoa học và văn hóa của nó"
    ms: "Bincangkan hubungan sains dengan budayanya"
    id: "Membahas hubungan sains dengan budayanya"
    hi: "विज्ञान का अपनी संस्कृति से संबंध पर चर्चा करना"
