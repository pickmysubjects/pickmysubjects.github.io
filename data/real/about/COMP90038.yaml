code: COMP90038
year: 2026
learn:
  en: "How to design and analyse efficient algorithms: sorting, searching, graphs, dynamic programming and complexity."
  zh: "设计并分析高效算法：排序、搜索、图、动态规划和复杂度。"
  zh-TW: "設計並分析高效演算法：排序、搜尋、圖、動態規劃和複雜度。"
  ja: "効率的なアルゴリズムの設計と分析：整列、探索、グラフ、動的計画法、計算量。"
  ko: "효율적인 알고리즘 설계와 분석: 정렬, 탐색, 그래프, 동적 계획법, 복잡도."
  vi: "Thiết kế và phân tích thuật toán hiệu quả: sắp xếp, tìm kiếm, đồ thị, quy hoạch động và độ phức tạp."
  ms: "Cara mereka bentuk dan menganalisis algoritma cekap: isihan, carian, graf, pengaturcaraan dinamik dan kerumitan."
  id: "Cara merancang dan menganalisis algoritma efisien: pengurutan, pencarian, graf, pemrograman dinamis, dan kompleksitas."
  hi: "कुशल एल्गोरिदम बनाना और परखना: सॉर्टिंग, सर्चिंग, ग्राफ़, डायनेमिक प्रोग्रामिंग और कॉम्प्लेक्सिटी।"
outcomes:
  - en: "Analyse running time with asymptotic notation"
    zh: "用渐近记号分析运行时间"
    zh-TW: "用漸近記號分析執行時間"
    ja: "漸近記法で実行時間を分析する"
    ko: "점근 표기법으로 실행 시간 분석하기"
    vi: "Phân tích thời gian chạy bằng ký hiệu tiệm cận"
    ms: "Analisis masa larian dengan tatatanda asimptot"
    id: "Menganalisis waktu jalan dengan notasi asimtotik"
    hi: "एसिम्प्टोटिक नोटेशन से रनिंग टाइम का विश्लेषण करना"
  - en: "Pick and use the right data structure for a problem"
    zh: "为问题选用合适的数据结构"
    zh-TW: "為問題選用合適的資料結構"
    ja: "問題に合ったデータ構造を選んで使う"
    ko: "문제에 맞는 자료구조 골라 쓰기"
    vi: "Chọn và dùng đúng cấu trúc dữ liệu cho bài toán"
    ms: "Pilih dan guna struktur data yang sesuai untuk masalah"
    id: "Memilih dan memakai struktur data yang tepat"
    hi: "समस्या के लिए सही डेटा स्ट्रक्चर चुनना और इस्तेमाल करना"
  - en: "Apply divide-and-conquer, greedy and dynamic programming"
    zh: "运用分治、贪心和动态规划"
    zh-TW: "運用分治、貪婪和動態規劃"
    ja: "分割統治法、貪欲法、動的計画法を使う"
    ko: "분할 정복, 탐욕법, 동적 계획법 적용하기"
    vi: "Áp dụng chia để trị, tham lam và quy hoạch động"
    ms: "Guna pecah-dan-takluk, tamak dan pengaturcaraan dinamik"
    id: "Menerapkan divide-and-conquer, greedy, dan pemrograman dinamis"
    hi: "डिवाइड-एंड-कॉन्कर, ग्रीडी और डायनेमिक प्रोग्रामिंग लगाना"
