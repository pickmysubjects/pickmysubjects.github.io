code: ISYS90090
year: 2027
learn:
  en: "How organisations manage information security: risk assessment, incident response, recovery, policy and culture."
  zh: "组织如何管理信息安全：风险评估、事件响应、灾难恢复、政策与文化。"
  zh-TW: "組織如何管理資訊安全：風險評估、事件應變、災難復原、政策與文化。"
  ja: "組織の情報セキュリティ管理：リスク評価、インシデント対応、復旧、方針と文化。"
  ko: "조직의 정보보안 관리: 위험 평가, 사고 대응, 재해 복구, 정책과 문화."
  vi: "Tổ chức quản lý an ninh thông tin: đánh giá rủi ro, ứng phó sự cố, khôi phục, chính sách, văn hóa."
  ms: "Cara organisasi mengurus keselamatan maklumat: penilaian risiko, tindak balas insiden, pemulihan, dasar, budaya."
  id: "Cara organisasi mengelola keamanan informasi: penilaian risiko, respons insiden, pemulihan, kebijakan, budaya."
  hi: "संगठन सूचना सुरक्षा कैसे संभालते हैं: जोखिम आकलन, घटना प्रतिक्रिया, रिकवरी, नीति और संस्कृति।"
outcomes:
  - en: "Carry out a basic security risk assessment"
    zh: "开展基础的安全风险评估"
    zh-TW: "進行基本的資安風險評估"
    ja: "基本的なセキュリティリスク評価を行う"
    ko: "기본 보안 위험 평가 수행하기"
    vi: "Thực hiện đánh giá rủi ro bảo mật cơ bản"
    ms: "Menjalankan penilaian risiko keselamatan asas"
    id: "Melakukan penilaian risiko keamanan dasar"
    hi: "बुनियादी सुरक्षा जोखिम आकलन करना"
  - en: "Plan responses to incidents and disasters"
    zh: "制定事件与灾难应对计划"
    zh-TW: "制定事件與災難應變計畫"
    ja: "インシデントや災害への対応を計画する"
    ko: "사고·재해 대응 계획 세우기"
    vi: "Lập kế hoạch ứng phó sự cố và thảm họa"
    ms: "Merancang tindak balas insiden dan bencana"
    id: "Merencanakan respons insiden dan bencana"
    hi: "घटनाओं और आपदाओं से निपटने की योजना बनाना"
