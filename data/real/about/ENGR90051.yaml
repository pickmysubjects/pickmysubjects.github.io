code: ENGR90051
year: 2027
learn:
  en: "A real interdisciplinary design project: from defining the problem through prototyping and testing."
  zh: "真实的跨学科设计项目：从定义问题到原型制作和测试。"
  zh-TW: "真實的跨領域設計專案：從定義問題到原型製作與測試。"
  ja: "実際の分野横断設計プロジェクト：問題定義から試作・テストまで。"
  ko: "실제 융합 설계 프로젝트: 문제 정의부터 시제품 제작과 시험까지."
  vi: "Dự án thiết kế liên ngành thực tế: từ xác định vấn đề đến làm mẫu và thử nghiệm."
  ms: "Projek reka bentuk antara disiplin sebenar: dari takrif masalah hingga prototaip dan ujian."
  id: "Proyek desain lintas disiplin nyata: dari merumuskan masalah hingga prototipe dan pengujian."
  hi: "असली अंतर्विषयक डिज़ाइन प्रोजेक्ट: समस्या तय करने से प्रोटोटाइप और परीक्षण तक।"
outcomes:
  - en: "Take a design from first idea to tested prototype"
    zh: "把设计从最初想法做到经过测试的原型"
    zh-TW: "把設計從最初點子做到經過測試的原型"
    ja: "設計を最初の発想から試験済みの試作まで進める"
    ko: "설계를 첫 아이디어부터 시험한 시제품까지 진행하기"
    vi: "Đưa thiết kế từ ý tưởng ban đầu đến mẫu đã thử nghiệm"
    ms: "Membawa reka bentuk dari idea awal ke prototaip yang diuji"
    id: "Membawa desain dari ide awal ke prototipe yang sudah diuji"
    hi: "डिज़ाइन को पहले विचार से परखे हुए प्रोटोटाइप तक ले जाना"
  - en: "Weigh safety, sustainability and stakeholder needs in a design"
    zh: "在设计中兼顾安全、可持续性和相关方需求"
    zh-TW: "在設計中兼顧安全、永續與利害關係人需求"
    ja: "設計で安全性・持続可能性・関係者の要望を考える"
    ko: "설계에서 안전·지속가능성·이해관계자 요구 고려하기"
    vi: "Cân nhắc an toàn, bền vững và nhu cầu các bên trong thiết kế"
    ms: "Menimbang keselamatan, kelestarian dan keperluan pihak berkepentingan"
    id: "Menimbang keselamatan, keberlanjutan, dan kebutuhan pemangku kepentingan"
    hi: "डिज़ाइन में सुरक्षा, स्थिरता और हितधारकों की ज़रूरतें तौलना"
