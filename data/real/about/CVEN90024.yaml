code: CVEN90024
year: 2027
learn:
  en: "Structural design of tall buildings: floor and frame systems, wind and earthquake loads, foundations and construction."
  zh: "高层建筑的结构设计：楼板与框架体系、风荷载与地震荷载、基础和施工。"
  zh-TW: "高層建築的結構設計：樓板與構架系統、風力與地震載重、基礎與施工。"
  ja: "高層建物の構造設計：床・架構システム、風・地震荷重、基礎と施工。"
  ko: "고층 건물의 구조 설계: 바닥·골조 시스템, 풍하중·지진하중, 기초와 시공."
  vi: "Thiết kế kết cấu nhà cao tầng: hệ sàn và khung, tải gió và động đất, móng và thi công."
  ms: "Reka bentuk struktur bangunan tinggi: sistem lantai dan kerangka, beban angin dan gempa, asas dan pembinaan."
  id: "Desain struktur gedung tinggi: sistem lantai dan rangka, beban angin dan gempa, fondasi dan konstruksi."
  hi: "ऊँची इमारतों का संरचनात्मक डिज़ाइन: फ़्लोर और फ़्रेम सिस्टम, हवा और भूकंप भार, नींव और निर्माण।"
outcomes:
  - en: "Develop concept designs for floors, lateral systems and foundations"
    zh: "为楼板、抗侧力体系和基础做概念设计"
    zh-TW: "為樓板、抗側力系統與基礎做概念設計"
    ja: "床・水平抵抗システム・基礎の概念設計を行う"
    ko: "바닥·횡하중 저항 시스템·기초의 개념 설계하기"
    vi: "Lập thiết kế ý tưởng cho sàn, hệ chịu lực ngang và móng"
    ms: "Membangunkan reka bentuk konsep lantai, sistem sisi dan asas"
    id: "Menyusun desain konsep lantai, sistem lateral dan fondasi"
    hi: "फ़्लोर, पार्श्व भार प्रणाली और नींव के अवधारणात्मक डिज़ाइन बनाना"
  - en: "Calculate wind loads and motion comfort in tall buildings"
    zh: "计算高层建筑的风荷载和舒适度"
    zh-TW: "計算高層建築的風載重與舒適度"
    ja: "高層建物の風荷重と揺れの快適性を計算する"
    ko: "고층 건물의 풍하중과 진동 사용성 계산하기"
    vi: "Tính tải gió và độ êm (dao động) trong nhà cao tầng"
    ms: "Mengira beban angin dan keselesaan gerakan bangunan tinggi"
    id: "Menghitung beban angin dan kenyamanan getaran gedung tinggi"
    hi: "ऊँची इमारतों में हवा का भार और कंपन आराम की गणना"
  - en: "Build approximate and computer models of building structures"
    zh: "建立建筑结构的近似模型和计算机模型"
    zh-TW: "建立建築結構的近似模型與電腦模型"
    ja: "建物構造の略算モデルとコンピュータモデルを作る"
    ko: "건물 구조의 근사 모델과 컴퓨터 모델 만들기"
    vi: "Xây dựng mô hình gần đúng và mô hình máy tính cho kết cấu"
    ms: "Membina model anggaran dan model komputer bagi struktur bangunan"
    id: "Membuat model pendekatan dan model komputer struktur bangunan"
    hi: "भवन संरचनाओं के अनुमानित और कंप्यूटर मॉडल बनाना"
