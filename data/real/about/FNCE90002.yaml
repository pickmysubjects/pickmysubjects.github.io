code: FNCE90002
year: 2027
learn:
  en: "The theory behind modern finance: choice under uncertainty, portfolios, CAPM, arbitrage and option pricing."
  zh: "现代金融的理论基础：不确定下的选择、投资组合、CAPM、套利和期权定价。"
  zh-TW: "現代金融的理論基礎：不確定下的選擇、投資組合、CAPM、套利與選擇權定價。"
  ja: "現代ファイナンスの理論：不確実性下の選択、ポートフォリオ、CAPM、裁定、オプション価格。"
  ko: "현대 재무이론: 불확실성 하의 선택, 포트폴리오, CAPM, 차익거래, 옵션 가격결정."
  vi: "Nền tảng lý thuyết tài chính hiện đại: lựa chọn khi bất định, danh mục, CAPM, kinh doanh chênh lệch, định giá quyền chọn."
  ms: "Teori di sebalik kewangan moden: pilihan dalam ketidakpastian, portfolio, CAPM, arbitraj dan harga opsyen."
  id: "Teori dasar keuangan modern: pilihan dalam ketidakpastian, portofolio, CAPM, arbitrase dan harga opsi."
  hi: "आधुनिक वित्त का सिद्धांत: अनिश्चितता में चुनाव, पोर्टफोलियो, CAPM, आर्बिट्राज और ऑप्शन मूल्य निर्धारण।"
outcomes:
  - en: "Explain how choices under risk set asset prices"
    zh: "解释风险下的选择如何决定资产价格"
    zh-TW: "解釋風險下的選擇如何決定資產價格"
    ja: "リスク下の選択が資産価格を決める仕組みを説明する"
    ko: "위험 하의 선택이 자산가격을 정하는 방식 설명하기"
    vi: "Giải thích lựa chọn khi có rủi ro quyết định giá tài sản"
    ms: "Menerangkan cara pilihan berisiko menentukan harga aset"
    id: "Menjelaskan cara pilihan berisiko menentukan harga aset"
    hi: "जोखिम में चुनाव से परिसंपत्ति कीमत कैसे बनती है, समझाना"
  - en: "Use arbitrage to value real and financial assets"
    zh: "用套利思路为实物和金融资产估值"
    zh-TW: "用套利思路為實質與金融資產估值"
    ja: "裁定の考え方で実物・金融資産を評価する"
    ko: "차익거래 개념으로 실물·금융자산 가치평가하기"
    vi: "Dùng kinh doanh chênh lệch để định giá tài sản"
    ms: "Menggunakan arbitraj untuk menilai aset sebenar dan kewangan"
    id: "Memakai arbitrase untuk menilai aset riil dan keuangan"
    hi: "वास्तविक और वित्तीय परिसंपत्तियों के मूल्यांकन में आर्बिट्राज"
