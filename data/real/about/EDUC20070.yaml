code: EDUC20070
year: 2026
learn:
  en: "What sport and outdoor education teach, explored through field trips, your own reflective writing and John Dewey's ideas."
  zh: "体育和户外教育能教会什么，通过野外考察、自我反思写作和杜威思想来探讨。"
  zh-TW: "運動和戶外教育能教會什麼，透過戶外考察、自我反思寫作和杜威思想來探討。"
  ja: "スポーツと野外教育から何を学べるか。野外実習、自己省察の記述、デューイの思想を通して。"
  ko: "스포츠와 야외 교육이 가르치는 것을 현장 학습, 자기 성찰 글쓰기, 듀이 사상으로 탐구."
  vi: "Thể thao và giáo dục ngoài trời dạy được gì, qua các chuyến thực địa, bài viết tự phản tư và tư tưởng Dewey."
  ms: "Apa yang diajar oleh sukan dan pendidikan luar, melalui lawatan lapangan, penulisan reflektif dan idea Dewey."
  id: "Apa yang diajarkan olahraga dan pendidikan alam terbuka, lewat kunjungan lapangan, tulisan reflektif dan gagasan Dewey."
  hi: "खेल और आउटडोर शिक्षा क्या सिखाते हैं, फ़ील्ड ट्रिप, आत्म-चिंतन लेखन और ड्यूई के विचारों के ज़रिए।"
outcomes:
  - en: "Judge the educational value of sport and outdoor education"
    zh: "评估体育和户外教育的教育价值"
    zh-TW: "評估運動和戶外教育的教育價值"
    ja: "スポーツと野外教育の教育的価値を評価する"
    ko: "스포츠와 야외 교육의 교육적 가치 평가하기"
    vi: "Đánh giá giá trị giáo dục của thể thao và giáo dục ngoài trời"
    ms: "Menilai nilai pendidikan sukan dan pendidikan luar"
    id: "Menilai nilai edukatif olahraga dan pendidikan alam terbuka"
    hi: "खेल और आउटडोर शिक्षा के शैक्षिक मूल्य का आकलन"
  - en: "Explain Dewey's theory of experiential learning"
    zh: "解释杜威的体验式学习理论"
    zh-TW: "解釋杜威的體驗式學習理論"
    ja: "デューイの経験学習理論を説明する"
    ko: "듀이의 경험 학습 이론 설명하기"
    vi: "Giải thích lý thuyết học qua trải nghiệm của Dewey"
    ms: "Menerangkan teori pembelajaran berasaskan pengalaman Dewey"
    id: "Menjelaskan teori belajar dari pengalaman Dewey"
    hi: "ड्यूई का अनुभवात्मक शिक्षा सिद्धांत समझाना"
  - en: "Carry out a basic ethnography of your own experience"
    zh: "对自身经历做一次基础的民族志研究"
    zh-TW: "對自身經歷做一次基礎的民族誌研究"
    ja: "自分の経験について簡単なエスノグラフィーを行う"
    ko: "자신의 경험으로 기초 민족지 연구 수행하기"
    vi: "Thực hiện một nghiên cứu dân tộc học cơ bản về trải nghiệm của mình"
    ms: "Menjalankan etnografi asas tentang pengalaman sendiri"
    id: "Melakukan etnografi dasar tentang pengalaman sendiri"
    hi: "अपने अनुभव पर एक बुनियादी नृवंशविज्ञान करना"
