code: ECON90033
year: 2027
learn:
  en: "Modelling and forecasting financial data: non-normal returns, unit roots, cointegration and GARCH volatility."
  zh: "金融数据的建模与预测：非正态收益、单位根、协整和 GARCH 波动率。"
  zh-TW: "金融資料的建模與預測：非常態報酬、單根、共整合與 GARCH 波動率。"
  ja: "金融データのモデル化と予測：非正規リターン、単位根、共和分、GARCH ボラティリティ。"
  ko: "금융 데이터 모형화와 예측: 비정규 수익률, 단위근, 공적분, GARCH 변동성."
  vi: "Mô hình hóa và dự báo dữ liệu tài chính: lợi suất phi chuẩn, nghiệm đơn vị, đồng liên kết, biến động GARCH."
  ms: "Memodel dan meramal data kewangan: pulangan tak normal, punca unit, kointegrasi dan volatiliti GARCH."
  id: "Memodelkan dan meramal data keuangan: return tak normal, akar unit, kointegrasi dan volatilitas GARCH."
  hi: "वित्तीय डेटा का मॉडल और पूर्वानुमान: गैर-सामान्य रिटर्न, यूनिट रूट, कोइंटीग्रेशन और GARCH अस्थिरता।"
outcomes:
  - en: "Analyse the statistical properties of asset returns"
    zh: "分析资产收益的统计特性"
    zh-TW: "分析資產報酬的統計特性"
    ja: "資産リターンの統計的性質を分析する"
    ko: "자산 수익률의 통계적 성질 분석하기"
    vi: "Phân tích đặc tính thống kê của lợi suất tài sản"
    ms: "Menganalisis sifat statistik pulangan aset"
    id: "Menganalisis sifat statistik return aset"
    hi: "परिसंपत्ति रिटर्न के सांख्यिकीय गुणों का विश्लेषण"
  - en: "Test CAPM-based risk models with real data"
    zh: "用真实数据检验基于 CAPM 的风险模型"
    zh-TW: "用真實資料檢驗以 CAPM 為基礎的風險模型"
    ja: "実データで CAPM 系リスクモデルを検証する"
    ko: "실제 데이터로 CAPM 기반 위험모형 검증하기"
    vi: "Kiểm định mô hình rủi ro dựa trên CAPM bằng dữ liệu thật"
    ms: "Menguji model risiko berasaskan CAPM dengan data sebenar"
    id: "Menguji model risiko berbasis CAPM dengan data nyata"
    hi: "असली डेटा से CAPM आधारित जोखिम मॉडल जांचना"
