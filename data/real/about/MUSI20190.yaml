code: MUSI20190
year: 2026
learn:
  en: "Next step after The Laptop Recording Studio: miking bands and soloists, acoustics, mixing and editing in a real studio."
  zh: "接续笔记本录音课：乐队与独奏收音、声学、混音与剪辑。"
  zh-TW: "接續筆電錄音課：樂隊與獨奏收音、聲學、混音與剪輯。"
  ja: "ノートPC録音の次の段階：バンドやソロの収録、音響、ミックス、編集。"
  ko: "노트북 녹음의 다음 단계: 밴드·솔로 수음, 음향, 믹싱, 편집."
  vi: "Bước tiếp theo sau thu âm laptop: thu ban nhạc và solo, âm học, mix và chỉnh sửa."
  ms: "Lanjutan rakaman komputer riba: rakam band dan solo, akustik, campuran dan suntingan."
  id: "Lanjutan rekaman laptop: merekam band dan solo, akustik, mixing, dan editing."
  hi: "लैपटॉप रिकॉर्डिंग के बाद: बैंड और सोलो रिकॉर्डिंग, ध्वनिकी, मिक्सिंग, एडिटिंग।"
outcomes:
  - en: "Record a band or soloist with studio techniques"
    zh: "用录音室技巧录制乐队或独奏"
    zh-TW: "用錄音室技巧錄製樂隊或獨奏"
    ja: "スタジオ技法でバンドやソロを録る"
    ko: "스튜디오 기법으로 밴드·솔로 녹음하기"
    vi: "Thu ban nhạc hoặc solo bằng kỹ thuật phòng thu"
    ms: "Rakam band atau solo dengan teknik studio"
    id: "Merekam band atau solo dengan teknik studio"
    hi: "स्टूडियो तकनीक से बैंड या सोलो रिकॉर्ड करना"
  - en: "Record, edit and mix audio in a DAW"
    zh: "在数字音频工作站中录音、剪辑与混音"
    zh-TW: "在數位音訊工作站中錄音、剪輯與混音"
    ja: "DAWで録音・編集・ミックスする"
    ko: "DAW에서 녹음·편집·믹싱하기"
    vi: "Thu, chỉnh sửa và mix âm thanh trên DAW"
    ms: "Rakam, sunting dan campur audio dalam DAW"
    id: "Merekam, mengedit, dan mixing audio di DAW"
    hi: "DAW में ऑडियो रिकॉर्ड, एडिट और मिक्स करना"
  - en: "Explain the choices behind your finished tracks"
    zh: "说明作品背后的制作思路"
    zh-TW: "說明作品背後的製作思路"
    ja: "完成した曲の制作意図を説明する"
    ko: "완성곡의 제작 의도 설명하기"
    vi: "Giải thích lựa chọn trong bản nhạc đã hoàn thành"
    ms: "Terangkan pilihan di sebalik trek siap anda"
    id: "Menjelaskan alasan di balik lagu yang selesai"
    hi: "तैयार ट्रैक के पीछे के फ़ैसले समझाना"
