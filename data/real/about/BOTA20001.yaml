code: BOTA20001
year: 2026
learn:
  en: "Why plants matter for the planet: carbon, water, nutrients, stress, disease and how seeds and fruits form."
  zh: "植物对地球为何重要：碳、水、养分、逆境、病害及种子果实形成。"
  zh-TW: "植物對地球為何重要：碳、水、養分、逆境、病害及種子果實形成。"
  ja: "植物が地球に大切な理由：炭素、水、養分、ストレス、病気、種子と果実。"
  ko: "식물이 지구에 중요한 이유: 탄소, 물, 양분, 스트레스, 병, 종자와 열매."
  vi: "Vì sao thực vật quan trọng với hành tinh: carbon, nước, dinh dưỡng, stress, bệnh và hạt, quả."
  ms: "Mengapa tumbuhan penting untuk planet: karbon, air, nutrien, tekanan, penyakit, biji dan buah."
  id: "Mengapa tumbuhan penting bagi bumi: karbon, air, hara, cekaman, penyakit, biji dan buah."
  hi: "पौधे धरती के लिए क्यों ज़रूरी हैं: कार्बन, पानी, पोषक तत्व, तनाव, रोग, बीज और फल।"
outcomes:
  - en: "Relate plant structure to its environment"
    zh: "把植物结构与环境联系起来"
    zh-TW: "將植物結構與環境連結"
    ja: "植物の構造を環境と結びつける"
    ko: "식물 구조를 환경과 연결하기"
    vi: "Liên hệ cấu trúc cây với môi trường"
    ms: "Kaitkan struktur tumbuhan dengan persekitaran"
    id: "Mengaitkan struktur tumbuhan dengan lingkungan"
    hi: "पौधे की संरचना को पर्यावरण से जोड़ें"
  - en: "Link plant biology to climate and nutrient cycles"
    zh: "将植物学与气候和养分循环联系"
    zh-TW: "將植物學與氣候和養分循環連結"
    ja: "植物学を気候・養分循環と結びつける"
    ko: "식물학을 기후·양분 순환과 연결하기"
    vi: "Liên hệ thực vật học với khí hậu, chu trình dinh dưỡng"
    ms: "Kaitkan biologi tumbuhan dengan iklim dan kitaran"
    id: "Mengaitkan biologi tumbuhan dengan iklim dan siklus hara"
    hi: "पौध विज्ञान को जलवायु और पोषक चक्र से जोड़ें"
