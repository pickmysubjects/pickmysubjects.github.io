code: ABPL90385
year: 2027
learn:
  en: "How to diagnose and treat conservation problems in heritage buildings, by material, with lab sessions and site visits."
  zh: "通过实验课和实地考察，按材料学习诊断和处理历史建筑的保护问题。"
  zh-TW: "透過實驗課和實地考察，按材料學習診斷和處理歷史建築的保護問題。"
  ja: "実験と現地見学を通して、素材ごとに歴史的建造物の保存問題を診断・処置する。"
  ko: "실험 수업과 현장 답사로 재료별 문화유산 건물의 보존 문제를 진단·처리합니다."
  vi: "Chẩn đoán và xử lý vấn đề bảo tồn di sản theo vật liệu, qua giờ thí nghiệm và thực địa."
  ms: "Mendiagnosis dan merawat masalah pemuliharaan bangunan warisan mengikut bahan, dengan makmal dan lawatan."
  id: "Mendiagnosis dan menangani masalah konservasi bangunan warisan per material, lewat lab dan kunjungan lapangan."
  hi: "लैब और साइट विज़िट से सामग्री के अनुसार विरासत भवनों की संरक्षण समस्याओं का निदान व उपचार।"
outcomes:
  - en: "Identify conservation issues by material"
    zh: "按材料识别保护问题"
    zh-TW: "按材料辨識保護問題"
    ja: "素材ごとの保存問題を見分ける"
    ko: "재료별 보존 문제 파악하기"
    vi: "Nhận diện vấn đề bảo tồn theo vật liệu"
    ms: "Mengenal pasti isu pemuliharaan mengikut bahan"
    id: "Mengenali masalah konservasi per material"
    hi: "सामग्री के अनुसार संरक्षण समस्याएँ पहचानना"
  - en: "Choose treatments for common problems"
    zh: "为常见问题选择处理方法"
    zh-TW: "為常見問題選擇處理方法"
    ja: "よくある問題の処置を選ぶ"
    ko: "흔한 문제의 처리 방법 고르기"
    vi: "Chọn cách xử lý vấn đề thường gặp"
    ms: "Memilih rawatan untuk masalah biasa"
    id: "Memilih penanganan untuk masalah umum"
    hi: "आम समस्याओं के उपचार चुनना"
