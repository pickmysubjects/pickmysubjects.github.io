code: ENGR30004
year: 2026
learn:
  en: "Data structures and algorithms for engineering: trees, graphs, sorting, shortest paths and dynamic programming."
  zh: "工程中的数据结构与算法：树、图、排序、最短路径和动态规划。"
  zh-TW: "工程中的資料結構與演算法：樹、圖、排序、最短路徑和動態規劃。"
  ja: "工学のためのデータ構造とアルゴリズム：木、グラフ、ソート、最短経路、動的計画法。"
  ko: "공학용 자료구조와 알고리즘: 트리, 그래프, 정렬, 최단 경로, 동적 계획법."
  vi: "Cấu trúc dữ liệu và thuật toán cho kỹ thuật: cây, đồ thị, sắp xếp, đường đi ngắn nhất, quy hoạch động."
  ms: "Struktur data dan algoritma untuk kejuruteraan: pokok, graf, isihan, laluan terpendek dan pengaturcaraan dinamik."
  id: "Struktur data dan algoritma untuk teknik: pohon, graf, pengurutan, jalur terpendek, dan pemrograman dinamis."
  hi: "इंजीनियरिंग के लिए डेटा स्ट्रक्चर और एल्गोरिदम: ट्री, ग्राफ़, सॉर्टिंग, शॉर्टेस्ट पाथ, डायनेमिक प्रोग्रामिंग।"
outcomes:
  - en: "Build data structures for search and optimisation"
    zh: "构建用于搜索和优化的数据结构"
    zh-TW: "建構用於搜尋和最佳化的資料結構"
    ja: "探索と最適化のためのデータ構造を作る"
    ko: "탐색과 최적화를 위한 자료구조를 만든다"
    vi: "Xây cấu trúc dữ liệu cho tìm kiếm, tối ưu"
    ms: "Bina struktur data untuk carian dan pengoptimuman"
    id: "Membangun struktur data untuk pencarian dan optimasi"
    hi: "सर्च और ऑप्टिमाइज़ेशन के लिए डेटा स्ट्रक्चर बनाना"
  - en: "Analyse time and memory complexity"
    zh: "分析时间和内存复杂度"
    zh-TW: "分析時間和記憶體複雜度"
    ja: "時間・メモリ計算量を解析する"
    ko: "시간·메모리 복잡도를 분석한다"
    vi: "Phân tích độ phức tạp thời gian, bộ nhớ"
    ms: "Analisis kerumitan masa dan memori"
    id: "Menganalisis kompleksitas waktu dan memori"
    hi: "टाइम और मेमोरी कॉम्प्लेक्सिटी का विश्लेषण"
