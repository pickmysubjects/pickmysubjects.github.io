code: CHIN20022
year: 2026
learn:
  en: "Academic Chinese for humanities research: reading scholarly Chinese, discussing it in class and writing a research essay."
  zh: "面向人文研究的学术中文：阅读中文学术文献、课堂讨论并撰写研究论文。"
  zh-TW: "面向人文研究的學術中文：閱讀中文學術文獻、課堂討論並撰寫研究論文。"
  ja: "人文学研究のための学術中国語。中国語の論文を読み、授業で議論し、研究レポートを書く。"
  ko: "인문학 연구를 위한 학술 중국어. 중국어 학술 자료를 읽고 토론하며 연구 에세이를 쓴다."
  vi: "Tiếng Trung học thuật cho nghiên cứu nhân văn: đọc tài liệu học thuật, thảo luận trên lớp và viết bài luận nghiên cứu."
  ms: "Bahasa Cina akademik untuk penyelidikan kemanusiaan: membaca bahan ilmiah, berbincang di kelas dan menulis esei kajian."
  id: "Mandarin akademik untuk riset humaniora: membaca bahan ilmiah, berdiskusi di kelas dan menulis esai riset."
  hi: "मानविकी शोध के लिए अकादमिक चीनी: विद्वत् चीनी पढ़ना, कक्षा में चर्चा करना और शोध निबंध लिखना।"
outcomes:
  - en: "Read academic research written in Chinese"
    zh: "阅读中文学术研究文献"
    zh-TW: "閱讀中文學術研究文獻"
    ja: "中国語で書かれた学術研究を読む"
    ko: "중국어로 쓰인 학술 연구 읽기"
    vi: "Đọc nghiên cứu học thuật viết bằng tiếng Trung"
    ms: "Baca kajian akademik dalam bahasa Cina"
    id: "Membaca riset akademik berbahasa Mandarin"
    hi: "चीनी में लिखा अकादमिक शोध पढ़ना"
  - en: "Discuss scholarly topics in Chinese"
    zh: "用中文讨论学术话题"
    zh-TW: "用中文討論學術話題"
    ja: "学術的なテーマを中国語で議論する"
    ko: "학술 주제를 중국어로 토론하기"
    vi: "Thảo luận chủ đề học thuật bằng tiếng Trung"
    ms: "Bincangkan topik ilmiah dalam bahasa Cina"
    id: "Membahas topik ilmiah dalam bahasa Mandarin"
    hi: "विद्वत् विषयों पर चीनी में चर्चा करना"
  - en: "Write a research essay in Chinese"
    zh: "用中文撰写研究论文"
    zh-TW: "用中文撰寫研究論文"
    ja: "中国語で研究レポートを書く"
    ko: "중국어로 연구 에세이 쓰기"
    vi: "Viết bài luận nghiên cứu bằng tiếng Trung"
    ms: "Tulis esei kajian dalam bahasa Cina"
    id: "Menulis esai riset dalam bahasa Mandarin"
    hi: "चीनी में शोध निबंध लिखना"
