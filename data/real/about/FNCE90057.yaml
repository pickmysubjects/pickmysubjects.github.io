code: FNCE90057
year: 2027
learn:
  en: "Ethical conduct for finance professionals, based on the CFA Institute Code and Standards and real scandals."
  zh: "金融从业者的职业道德，以 CFA Institute 准则和真实丑闻为基础。"
  zh-TW: "金融從業人員的職業道德，以 CFA Institute 準則與真實弊案為基礎。"
  ja: "CFA Institute の倫理規範と実際の不祥事をもとに、金融専門職の倫理を学ぶ。"
  ko: "CFA Institute 윤리강령과 실제 스캔들을 바탕으로 금융인의 윤리를 배운다."
  vi: "Đạo đức nghề nghiệp tài chính dựa trên Bộ quy tắc CFA Institute và các vụ bê bối thật."
  ms: "Etika profesional kewangan berdasarkan Kod dan Piawaian CFA Institute serta skandal sebenar."
  id: "Etika profesional keuangan berdasarkan Kode dan Standar CFA Institute serta skandal nyata."
  hi: "CFA Institute की आचार संहिता और असली घोटालों पर आधारित वित्तीय पेशेवर नैतिकता।"
outcomes:
  - en: "Apply the CFA Code and Standards to cases"
    zh: "将 CFA 准则应用于案例"
    zh-TW: "將 CFA 準則應用於個案"
    ja: "CFA 倫理規範を事例に当てはめる"
    ko: "CFA 윤리강령을 사례에 적용하기"
    vi: "Áp dụng Bộ quy tắc CFA vào tình huống"
    ms: "Mengaplikasi Kod dan Piawaian CFA pada kes"
    id: "Menerapkan Kode dan Standar CFA pada kasus"
    hi: "मामलों पर CFA संहिता और मानक लागू करना"
  - en: "Explain why ethics matters for financial markets"
    zh: "解释伦理为何对金融市场重要"
    zh-TW: "解釋倫理為何對金融市場重要"
    ja: "倫理が金融市場で重要な理由を説明する"
    ko: "윤리가 금융시장에 중요한 이유 설명하기"
    vi: "Giải thích vì sao đạo đức quan trọng với thị trường"
    ms: "Menerangkan kepentingan etika bagi pasaran kewangan"
    id: "Menjelaskan pentingnya etika bagi pasar keuangan"
    hi: "वित्तीय बाज़ार के लिए नैतिकता क्यों ज़रूरी है, बताना"
