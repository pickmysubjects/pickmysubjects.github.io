code: FLTV20018
year: 2026
learn:
  en: "Writing screen content for kids, tweens and young teens: what they watch, how, and a full youth TV script."
  zh: "为儿童与青少年写影视内容：他们看什么、怎么看，并写完整剧本。"
  zh-TW: "為兒童與青少年寫影視內容：他們看什麼、怎麼看，並寫完整劇本。"
  ja: "子ども・ティーン向けの映像脚本：何をどう見るかを学び、脚本を一本書く。"
  ko: "어린이·청소년용 영상 글쓰기: 무엇을 어떻게 보는지, 그리고 대본 한 편."
  vi: "Viết nội dung cho trẻ em và thiếu niên: các em xem gì, xem ra sao, và một kịch bản."
  ms: "Menulis kandungan skrin untuk kanak-kanak dan remaja, serta skrip TV penuh."
  id: "Menulis konten layar untuk anak dan remaja: apa dan cara mereka menonton, plus naskah."
  hi: "बच्चों और किशोरों के लिए स्क्रीन लेखन: वे क्या, कैसे देखते हैं, और पूरी स्क्रिप्ट।"
outcomes:
  - en: "Describe today's youth screen market"
    zh: "描述当今青少年影视市场"
    zh-TW: "描述當今青少年影視市場"
    ja: "今の子ども向け映像市場を説明する"
    ko: "요즘 청소년 영상 시장 설명하기"
    vi: "Mô tả thị trường phim cho giới trẻ"
    ms: "Huraikan pasaran skrin belia kini"
    id: "Menjelaskan pasar layar anak muda kini"
    hi: "आज के युवा स्क्रीन बाज़ार को समझाना"
  - en: "Write a youth TV script to industry format"
    zh: "按行业格式写青少年剧本"
    zh-TW: "按業界格式寫青少年劇本"
    ja: "業界形式で子ども向け脚本を書く"
    ko: "업계 형식으로 청소년 대본 쓰기"
    vi: "Viết kịch bản thiếu nhi theo chuẩn ngành"
    ms: "Tulis skrip belia ikut format industri"
    id: "Menulis naskah anak sesuai format industri"
    hi: "इंडस्ट्री फ़ॉर्मैट में युवा टीवी स्क्रिप्ट लिखना"
  - en: "Keep a critical and creative blog"
    zh: "写批判性与创意博客"
    zh-TW: "寫批判性與創意部落格"
    ja: "批評的・創作的なブログを書く"
    ko: "비평적·창의적 블로그 쓰기"
    vi: "Viết blog phê bình và sáng tạo"
    ms: "Tulis blog kritis dan kreatif"
    id: "Menulis blog kritis dan kreatif"
    hi: "आलोचनात्मक और रचनात्मक ब्लॉग लिखना"
