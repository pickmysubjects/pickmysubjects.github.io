code: HPSC30034
year: 2026
learn:
  en: "How magic, from alchemy to demonology, fed into the rise of modern science in Europe between 1450 and 1750."
  zh: "从炼金术到恶魔学，魔法如何在1450至1750年间促成欧洲现代科学的兴起。"
  zh-TW: "從煉金術到惡魔學，魔法如何在1450至1750年間促成歐洲現代科學的興起。"
  ja: "錬金術から悪魔学まで、魔術が1450〜1750年のヨーロッパで近代科学の誕生にどうつながったかを学ぶ。"
  ko: "연금술부터 악마학까지, 마술이 1450~1750년 유럽에서 근대 과학의 등장에 어떻게 이어졌는지 배운다."
  vi: "Ma thuật, từ giả kim đến quỷ học, đã góp phần vào sự ra đời của khoa học hiện đại ở châu Âu 1450–1750 ra sao."
  ms: "Cara magis, daripada alkimia hingga demonologi, menyumbang kepada kemunculan sains moden di Eropah antara 1450 dan 1750."
  id: "Cara sihir, dari alkimia hingga demonologi, ikut melahirkan sains modern di Eropa antara 1450 dan 1750."
  hi: "जादू, कीमियागरी से दानव-विद्या तक, 1450 से 1750 के बीच यूरोप में आधुनिक विज्ञान के उदय से कैसे जुड़ा।"
outcomes:
  - en: "Reflect on major changes in Europe, 1400s to 1700s"
    zh: "反思15至18世纪欧洲的重大变化"
    zh-TW: "反思15至18世紀歐洲的重大變化"
    ja: "15〜18世紀ヨーロッパの大きな変化を考える"
    ko: "15~18세기 유럽의 큰 변화 성찰하기"
    vi: "Suy ngẫm về những thay đổi lớn ở châu Âu thế kỷ 15–18"
    ms: "Renungkan perubahan besar di Eropah, abad ke-15 hingga 18"
    id: "Merenungkan perubahan besar Eropa abad ke-15 hingga 18"
    hi: "15वीं से 18वीं सदी के यूरोप के बड़े बदलावों पर विचार करना"
  - en: "Analyse how magic and reason shaped early science"
    zh: "分析魔法与理性如何塑造早期科学"
    zh-TW: "分析魔法與理性如何形塑早期科學"
    ja: "魔術と理性が初期の科学をどう形づくったか分析する"
    ko: "마술과 이성이 초기 과학을 어떻게 만들었는지 분석하기"
    vi: "Phân tích ma thuật và lý trí định hình khoa học sơ khai ra sao"
    ms: "Analisis cara magis dan akal membentuk sains awal"
    id: "Menganalisis cara sihir dan nalar membentuk sains awal"
    hi: "जादू और तर्क ने शुरुआती विज्ञान को कैसे आकार दिया, विश्लेषण करना"
  - en: "Present and write a research argument"
    zh: "陈述并撰写研究论点"
    zh-TW: "陳述並撰寫研究論點"
    ja: "研究に基づく主張を発表し、文章にする"
    ko: "연구 논지를 발표하고 글로 쓰기"
    vi: "Trình bày và viết một lập luận nghiên cứu"
    ms: "Bentang dan tulis hujah kajian"
    id: "Memaparkan dan menulis argumen riset"
    hi: "शोध तर्क को प्रस्तुत करना और लिखना"
