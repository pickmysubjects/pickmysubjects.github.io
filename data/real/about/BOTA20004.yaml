    ko: "빅토리아 식물 식별·구분하기"
    vi: "Nhận diện và phân biệt thực vật Victoria"
    ms: "Kenal pasti dan bezakan tumbuhan Victoria"
    id: "Mengenali dan membedakan tumbuhan Victoria"
    hi: "विक्टोरिया के पौधों की पहचान और अंतर करें"
  - en: "Analyse threats to Victorian ecosystems"
    zh: "分析维州生态系统面临的威胁"
    zh-TW: "分析維州生態系統面臨的威脅"
    ja: "州の生態系への脅威を分析する"
    ko: "빅토리아 생태계 위협 분석하기"
