code: BOTA20004
year: 2026
learn:
  en: "A summer course on Victoria's native plants: where they grow, how they adapt, and threats to them."
  zh: "夏季课程：维多利亚州原生植物的分布、适应与面临的威胁。"
  zh-TW: "夏季課程：維多利亞州原生植物的分布、適應與面臨的威脅。"
  ja: "夏期科目：ビクトリア州の在来植物の分布、適応、脅威。"
  ko: "여름 과목: 빅토리아주 자생 식물의 분포, 적응, 위협 요인."
  vi: "Môn học hè về thực vật bản địa bang Victoria: nơi sống, cách thích nghi và mối đe dọa."
  ms: "Kursus musim panas tentang tumbuhan asli Victoria: taburan, adaptasi dan ancaman."
  id: "Kuliah musim panas tentang tumbuhan asli Victoria: sebaran, adaptasi, dan ancamannya."
  hi: "गर्मियों का कोर्स: विक्टोरिया के देशी पौधे, उनका फैलाव, अनुकूलन और ख़तरे।"
outcomes:
  - en: "Identify and tell apart Victoria's plants"
