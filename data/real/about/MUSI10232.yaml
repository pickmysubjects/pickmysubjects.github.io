code: MUSI10232
year: 2026
learn:
  en: "Composition as personal expression: study scores and recordings, then build a 12-minute folio of your own music."
  zh: "把作曲当作个人表达：研读乐谱和录音，完成一份12分钟的原创作品集。"
  zh-TW: "把作曲當作個人表達：研讀樂譜與錄音，完成一份12分鐘的原創作品集。"
  ja: "自己表現としての作曲。楽譜と録音を研究し、12分の自作作品集を仕上げる。"
  ko: "개인 표현으로서의 작곡. 악보와 녹음을 연구하고 12분 분량의 자작곡 포트폴리오를 만든다."
  vi: "Sáng tác như tự biểu đạt: nghiên cứu tổng phổ, bản thu và làm tập tác phẩm riêng dài 12 phút."
  ms: "Gubahan sebagai ekspresi diri: kaji skor dan rakaman, kemudian hasilkan folio muzik sendiri 12 minit."
  id: "Komposisi sebagai ekspresi diri: pelajari partitur dan rekaman, lalu buat folio musik sendiri 12 menit."
  hi: "रचना निजी अभिव्यक्ति के रूप में: स्कोर व रिकॉर्डिंग पढ़ना और 12 मिनट का अपना फ़ोलियो बनाना।"
outcomes:
  - en: "Build a folio of original music"
    zh: "完成一份原创音乐作品集"
    zh-TW: "完成一份原創音樂作品集"
    ja: "オリジナル作品集をまとめる"
    ko: "자작곡 포트폴리오 완성하기"
    vi: "Hoàn thành tập tác phẩm gốc"
    ms: "Hasilkan folio muzik asli"
    id: "Menyusun folio musik orisinal"
    hi: "मौलिक संगीत का फ़ोलियो बनाना"
  - en: "Learn from scores and new music concerts"
    zh: "从乐谱和新音乐会中学习"
    zh-TW: "從樂譜與新音樂會中學習"
    ja: "楽譜と現代音楽の演奏会から学ぶ"
    ko: "악보와 현대음악 공연에서 배우기"
    vi: "Học từ tổng phổ và buổi diễn nhạc mới"
    ms: "Belajar daripada skor dan konsert muzik baharu"
    id: "Belajar dari partitur dan konser musik baru"
    hi: "स्कोर और नए संगीत कॉन्सर्ट से सीखना"
  - en: "Reflect on your composing process"
    zh: "反思自己的创作过程"
    zh-TW: "反思自己的創作過程"
    ja: "自分の作曲過程を振り返る"
    ko: "자신의 작곡 과정 성찰하기"
    vi: "Suy ngẫm về quá trình sáng tác"
    ms: "Renung proses gubahan sendiri"
    id: "Merefleksikan proses menggubah"
    hi: "अपनी रचना प्रक्रिया पर विचार करना"
