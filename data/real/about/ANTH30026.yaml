code: ANTH30026
year: 2026
learn:
  en: "What health, illness and wellness mean around the world, and how culture, money, politics and environment shape them."
  zh: "健康、疾病与身心安康在世界各地意味着什么，以及文化、经济、政治和环境如何塑造它们。"
  zh-TW: "健康、疾病與身心安康在世界各地意味著什麼，以及文化、經濟、政治和環境如何塑造它們。"
  ja: "世界各地で健康、病、ウェルネスは何を意味するか。文化、経済、政治、環境がそれをどう形作るか。"
  ko: "세계 곳곳에서 건강, 질병, 웰니스는 무엇을 뜻하며 문화·경제·정치·환경이 이를 어떻게 만드는가."
  vi: "Sức khỏe, bệnh tật và an lạc mang nghĩa gì trên thế giới, và văn hóa, kinh tế, chính trị, môi trường định hình chúng ra sao."
  ms: "Maksud kesihatan, penyakit dan kesejahteraan di seluruh dunia, serta cara budaya, ekonomi, politik dan alam sekitar membentuknya."
  id: "Arti sehat, sakit dan kesejahteraan di berbagai belahan dunia, serta cara budaya, ekonomi, politik dan lingkungan membentuknya."
  hi: "दुनिया भर में स्वास्थ्य, बीमारी और तंदुरुस्ती का मतलब, और संस्कृति, पैसा, राजनीति व पर्यावरण उन्हें कैसे गढ़ते हैं।"
outcomes:
  - en: "Compare ideas of health across cultures"
    zh: "比较不同文化中的健康观念"
    zh-TW: "比較不同文化中的健康觀念"
    ja: "文化ごとの健康観を比べる"
    ko: "문화마다 다른 건강 개념 비교하기"
    vi: "So sánh quan niệm sức khỏe giữa các nền văn hóa"
    ms: "Bandingkan idea kesihatan merentas budaya"
    id: "Membandingkan gagasan kesehatan lintas budaya"
    hi: "संस्कृतियों में स्वास्थ्य की धारणाओं की तुलना करना"
  - en: "Link personal illness to wider global forces"
    zh: "把个人病痛与更大的全球力量联系起来"
    zh-TW: "把個人病痛與更大的全球力量聯繫起來"
    ja: "個人の病をより大きな世界的な力と結びつける"
    ko: "개인의 질병을 더 큰 세계적 힘과 연결하기"
    vi: "Liên hệ bệnh tật cá nhân với các lực lượng toàn cầu"
    ms: "Kaitkan penyakit individu dengan kuasa global"
    id: "Mengaitkan sakit pribadi dengan kekuatan global"
    hi: "निजी बीमारी को बड़ी वैश्विक ताकतों से जोड़ना"
  - en: "Read media portrayals of health critically"
    zh: "批判性地看待媒体对健康的呈现"
    zh-TW: "批判性地看待媒體對健康的呈現"
    ja: "健康に関するメディア表現を批判的に読む"
    ko: "건강에 관한 미디어 표현을 비판적으로 읽기"
    vi: "Đọc phản biện cách truyền thông khắc họa sức khỏe"
    ms: "Nilai secara kritis gambaran media tentang kesihatan"
    id: "Membaca kritis gambaran media soal kesehatan"
    hi: "स्वास्थ्य के मीडिया चित्रण को आलोचनात्मक ढंग से देखना"
