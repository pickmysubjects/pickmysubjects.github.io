code: ECOM90023
year: 2027
learn:
  en: "Estimating treatment effects and evaluating policies with difference-in-differences, instruments and regression discontinuity."
  zh: "用双重差分、工具变量和断点回归估计处理效应、评估政策。"
  zh-TW: "用差異中的差異、工具變數與斷點迴歸估計處理效果、評估政策。"
  ja: "差の差、操作変数、回帰不連続デザインで処置効果を推定し政策を評価する。"
  ko: "이중차분, 도구변수, 회귀불연속으로 처치효과 추정과 정책 평가."
  vi: "Ước lượng tác động can thiệp và đánh giá chính sách bằng DiD, biến công cụ và hồi quy gián đoạn."
  ms: "Menganggar kesan rawatan dan menilai dasar dengan perbezaan-dalam-perbezaan, instrumen dan regresi tak selanjar."
  id: "Mengestimasi efek perlakuan dan mengevaluasi kebijakan dengan DiD, instrumen, dan regresi diskontinuitas."
  hi: "डिफ़रेंस-इन-डिफ़रेंसेज़, इंस्ट्रुमेंट और रिग्रेशन डिस्कंटिन्युइटी से ट्रीटमेंट प्रभाव और नीति मूल्यांकन।"
outcomes:
  - en: "Estimate causal effects from observational data"
    zh: "从观测数据估计因果效应"
    zh-TW: "從觀察資料估計因果效果"
    ja: "観察データから因果効果を推定する"
    ko: "관찰 자료로 인과효과 추정하기"
    vi: "Ước lượng tác động nhân quả từ dữ liệu quan sát"
    ms: "Menganggar kesan sebab daripada data pemerhatian"
    id: "Mengestimasi efek kausal dari data observasi"
    hi: "अवलोकन डेटा से कारण-प्रभाव का अनुमान"
  - en: "Judge the assumptions behind each method"
    zh: "评估各方法背后的假设"
    zh-TW: "評估各方法背後的假設"
    ja: "各手法の前提を評価する"
    ko: "각 방법의 가정 평가하기"
    vi: "Đánh giá giả định của từng phương pháp"
    ms: "Menilai andaian setiap kaedah"
    id: "Menilai asumsi tiap metode"
    hi: "हर तरीके की मान्यताओं को परखना"
