code: VETS20019
year: 2026
learn:
  en: "Big issues in animal health: welfare, diseases passed to humans, antibiotic resistance, biosecurity and vets' roles."
  zh: "动物健康的大问题：福利、人畜共患病、抗药性、生物安全和兽医的角色。"
  zh-TW: "動物健康的重大議題：福利、人畜共通傳染病、抗藥性、生物安全與獸醫角色。"
  ja: "動物の健康の大きな課題：福祉、人獣共通感染症、薬剤耐性、バイオセキュリティ、獣医の役割。"
  ko: "동물 건강의 큰 쟁점: 복지, 인수공통감염병, 항생제 내성, 생물보안, 수의사의 역할."
  vi: "Vấn đề lớn của sức khỏe động vật: phúc lợi, bệnh lây sang người, kháng kháng sinh, an toàn sinh học, vai trò bác sĩ thú y."
  ms: "Isu besar kesihatan haiwan: kebajikan, penyakit zoonosis, rintangan antimikrob, biosekuriti dan peranan doktor haiwan."
  id: "Isu besar kesehatan hewan: kesejahteraan, zoonosis, resistansi antimikroba, biosekuriti dan peran dokter hewan."
  hi: "पशु स्वास्थ्य के बड़े मुद्दे: कल्याण, जानवरों से इंसानों में रोग, एंटीबायोटिक प्रतिरोध, जैव-सुरक्षा और पशु चिकित्सकों की भूमिका।"
outcomes:
  - en: "Describe what shapes animal health"
    zh: "描述决定动物健康的因素"
    zh-TW: "描述決定動物健康的因素"
    ja: "動物の健康を左右する要因を述べる"
    ko: "동물 건강 결정 요인 설명"
    vi: "Mô tả các yếu tố quyết định sức khỏe động vật"
    ms: "Huraikan penentu kesihatan haiwan"
    id: "Menguraikan penentu kesehatan hewan"
    hi: "पशु स्वास्थ्य के निर्धारक बताना"
  - en: "Explain how animal health affects human health"
    zh: "解释动物健康如何影响人类健康"
    zh-TW: "解釋動物健康如何影響人類健康"
    ja: "動物の健康が人の健康に及ぼす影響を説明"
    ko: "동물 건강이 인간 건강에 주는 영향 설명"
    vi: "Giải thích sức khỏe động vật ảnh hưởng con người"
    ms: "Terangkan kesan kesihatan haiwan pada manusia"
    id: "Menjelaskan dampak kesehatan hewan pada manusia"
    hi: "पशु स्वास्थ्य का मानव स्वास्थ्य पर असर समझाना"
  - en: "Evaluate animal management and welfare problems"
    zh: "评估动物管理与福利难题"
    zh-TW: "評估動物管理與福利難題"
    ja: "動物管理と福祉の課題を評価する"
    ko: "동물 관리·복지 문제 평가"
    vi: "Đánh giá vấn đề quản lý và phúc lợi động vật"
    ms: "Nilai cabaran pengurusan dan kebajikan haiwan"
    id: "Menilai masalah pengelolaan dan kesejahteraan hewan"
    hi: "पशु प्रबंधन और कल्याण समस्याओं का मूल्यांकन"
