code: MUSI10234
year: 2026
learn:
  en: "Large-ensemble and chamber music for Bachelor of Music students also at ANAM: rehearse and perform at the Conservatorium and ANAM."
  zh: "仅限同时在ANAM就读的音乐学士：在音乐学院和ANAM排练演出大型合奏与室内乐。"
  zh-TW: "僅限同時在ANAM就讀的音樂學士：在音樂學院與ANAM排練演出大型合奏與室內樂。"
  ja: "ANAMにも在籍する音楽学士向け。音楽院とANAMで大編成と室内楽を練習・演奏する。"
  ko: "ANAM에도 재학 중인 음악학사 대상. 음악원과 ANAM에서 대형 합주와 실내악을 연습·공연."
  vi: "Dành cho SV Cử nhân Âm nhạc học cả ở ANAM: tập và diễn hòa tấu lớn, thính phòng tại Nhạc viện và ANAM."
  ms: "Untuk pelajar Sarjana Muda Muzik yang juga di ANAM: latihan dan persembahan ensembel besar dan muzik kamar."
  id: "Untuk mahasiswa Sarjana Musik yang juga di ANAM: latihan dan pentas ansambel besar dan musik kamar."
  hi: "ANAM में भी पढ़ रहे संगीत स्नातकों के लिए: कंज़र्वेटोरियम और ANAM में बड़े समूह व चैम्बर संगीत।"
outcomes:
  - en: "Prepare parts for ensemble rehearsals"
    zh: "为合奏排练准备声部"
    zh-TW: "為合奏排練準備聲部"
    ja: "合奏練習のためにパートを準備する"
    ko: "합주 리허설을 위해 파트 준비하기"
    vi: "Chuẩn bị bè cho buổi tập hòa tấu"
    ms: "Sediakan bahagian untuk latihan ensembel"
    id: "Menyiapkan partai untuk latihan ansambel"
    hi: "समूह रिहर्सल के लिए अपना हिस्सा तैयार करना"
  - en: "Perform in large ensembles and chamber groups"
    zh: "在大型合奏和室内乐组中演出"
    zh-TW: "在大型合奏與室內樂組中演出"
    ja: "大編成と室内楽で演奏する"
    ko: "대형 합주와 실내악에서 공연하기"
    vi: "Biểu diễn trong dàn nhạc lớn và nhóm thính phòng"
    ms: "Bermain dalam ensembel besar dan kumpulan kamar"
    id: "Tampil dalam ansambel besar dan grup kamar"
    hi: "बड़े समूह और चैम्बर समूह में प्रस्तुति"
  - en: "Rehearse both directed and independently"
    zh: "在指导下和独立进行排练"
    zh-TW: "在指導下與獨立進行排練"
    ja: "指導の下でも自主的にも練習する"
    ko: "지도받으며 또 독립적으로 리허설하기"
    vi: "Tập luyện có hướng dẫn và tự lập"
    ms: "Berlatih dengan bimbingan dan sendiri"
    id: "Berlatih dengan arahan maupun mandiri"
    hi: "निर्देशन में और स्वतंत्र रूप से रिहर्सल"
