code: ANTH10001
year: 2026
learn:
  en: "An intro to anthropology: how people around the world live, love, believe and grieve, and how anthropologists study it."
  zh: "人类学入门：世界各地的人如何生活、恋爱、信仰和哀悼，以及人类学家如何研究这些。"
  zh-TW: "人類學入門：世界各地的人如何生活、戀愛、信仰和哀悼，以及人類學家如何研究這些。"
  ja: "人類学入門。世界の人々がどう暮らし、愛し、信じ、悲しむか、そして人類学者がそれをどう研究するか。"
  ko: "인류학 입문. 세계 사람들이 어떻게 살고 사랑하고 믿고 애도하는지, 인류학자는 이를 어떻게 연구하는지 배운다."
  vi: "Nhập môn nhân học: con người khắp thế giới sống, yêu, tin và đau buồn ra sao, và nhà nhân học nghiên cứu điều đó thế nào."
  ms: "Pengenalan antropologi: cara manusia di seluruh dunia hidup, bercinta, percaya dan berduka, serta cara ahli antropologi mengkajinya."
  id: "Pengantar antropologi: cara orang di seluruh dunia hidup, mencintai, percaya dan berduka, serta cara antropolog mempelajarinya."
  hi: "मानवशास्त्र का परिचय: दुनिया भर के लोग कैसे जीते, प्रेम करते, आस्था रखते और शोक मनाते हैं, और मानवशास्त्री इसका अध्ययन कैसे करते हैं।"
outcomes:
  - en: "Explain core ideas and methods of anthropology"
    zh: "说明人类学的核心观念和方法"
    zh-TW: "說明人類學的核心觀念和方法"
    ja: "人類学の基本的な考えと方法を説明する"
    ko: "인류학의 핵심 개념과 방법 설명하기"
    vi: "Giải thích ý tưởng và phương pháp cốt lõi của nhân học"
    ms: "Terangkan idea dan kaedah teras antropologi"
    id: "Menjelaskan gagasan dan metode inti antropologi"
    hi: "मानवशास्त्र के मूल विचार और तरीके समझाना"
  - en: "Compare social and cultural life across societies"
    zh: "比较不同社会的社会与文化生活"
    zh-TW: "比較不同社會的社會與文化生活"
    ja: "社会ごとの社会・文化生活を比べる"
    ko: "여러 사회의 사회·문화생활 비교하기"
    vi: "So sánh đời sống xã hội, văn hóa giữa các xã hội"
    ms: "Bandingkan kehidupan sosial dan budaya merentas masyarakat"
    id: "Membandingkan kehidupan sosial dan budaya lintas masyarakat"
    hi: "अलग-अलग समाजों के सामाजिक-सांस्कृतिक जीवन की तुलना करना"
  - en: "Reflect on your own culture with fresh eyes"
    zh: "以新的眼光反思自己的文化"
    zh-TW: "以新的眼光反思自己的文化"
    ja: "自分の文化を新しい目で見直す"
    ko: "자신의 문화를 새로운 눈으로 돌아보기"
    vi: "Nhìn lại văn hóa của chính mình bằng con mắt mới"
    ms: "Renungi budaya sendiri dengan pandangan baharu"
    id: "Merefleksikan budaya sendiri dengan cara pandang baru"
    hi: "अपनी संस्कृति को नई नज़र से देखना"
