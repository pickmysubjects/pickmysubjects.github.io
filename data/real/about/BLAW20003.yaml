code: BLAW20003
year: 2026
learn:
  en: "A practical look at the Australian Consumer Law: your rights as a buyer and what sellers and makers must do."
  zh: "实用的澳洲消费者法：买家的权利，以及卖家和厂商的义务。"
  zh-TW: "實用的澳洲消費者法：買家的權利，以及賣家和廠商的義務。"
  ja: "豪州消費者法を実践的に学ぶ：買い手の権利と売り手・メーカーの義務。"
  ko: "호주 소비자법을 실용적으로: 구매자의 권리와 판매자·제조사의 의무."
  vi: "Luật Bảo vệ Người tiêu dùng Úc theo hướng thực tế: quyền của người mua và nghĩa vụ của người bán, nhà sản xuất."
  ms: "Undang-undang Pengguna Australia secara praktikal: hak anda sebagai pembeli dan kewajipan penjual serta pengeluar."
  id: "Hukum Konsumen Australia secara praktis: hak Anda sebagai pembeli dan kewajiban penjual serta produsen."
  hi: "ऑस्ट्रेलियाई उपभोक्ता क़ानून व्यावहारिक रूप से: ख़रीदार के अधिकार और विक्रेता व निर्माता की ज़िम्मेदारियाँ।"
outcomes:
  - en: "Read and explain consumer protection laws"
    zh: "读懂并解释消费者保护法条"
    zh-TW: "讀懂並解釋消費者保護法條"
    ja: "消費者保護の条文を読み解き説明する"
    ko: "소비자 보호 법조문 읽고 설명하기"
    vi: "Đọc và giải thích quy định bảo vệ người tiêu dùng"
    ms: "Baca dan terangkan undang-undang perlindungan pengguna"
    id: "Membaca dan menjelaskan aturan perlindungan konsumen"
    hi: "उपभोक्ता संरक्षण क़ानून पढ़ना और समझाना"
  - en: "Explain consumer rights and supplier duties"
    zh: "说明消费者权利与供应商义务"
    zh-TW: "說明消費者權利與供應商義務"
    ja: "消費者の権利と供給者の義務を説明する"
    ko: "소비자 권리와 공급자 의무 설명"
    vi: "Giải thích quyền người tiêu dùng và nghĩa vụ nhà cung cấp"
    ms: "Terangkan hak pengguna dan kewajipan pembekal"
    id: "Menjelaskan hak konsumen dan kewajiban pemasok"
    hi: "उपभोक्ता के अधिकार और सप्लायर के कर्तव्य बताना"
  - en: "Apply the law to real cases and give clear advice"
    zh: "把法律用到具体案例并给出清晰建议"
    zh-TW: "把法律套用到具體案例並給出清楚建議"
    ja: "法を具体的な事例に当てはめ明確に助言する"
    ko: "실제 사례에 법을 적용해 명확히 조언하기"
    vi: "Áp dụng luật vào tình huống và tư vấn rõ ràng"
    ms: "Guna undang-undang pada kes sebenar dan beri nasihat jelas"
    id: "Menerapkan hukum pada kasus nyata dan memberi saran jelas"
    hi: "क़ानून को असली मामलों पर लागू कर साफ़ सलाह देना"
