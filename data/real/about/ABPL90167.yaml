code: ABPL90167
year: 2027
learn:
  en: "Drawing for design and building: freehand, constructed and digital drawing, orthographic projection and perspective."
  zh: "面向设计与建筑的绘图：徒手、尺规和数字绘图，正投影和透视。"
  zh-TW: "面向設計與建築的繪圖：徒手、尺規與數位繪圖，正投影與透視。"
  ja: "設計と建築のためのドローイング：フリーハンド、作図、デジタル、正投影と透視図。"
  ko: "설계·건축을 위한 드로잉: 손그림·제도·디지털, 정투영과 투시도."
  vi: "Vẽ cho thiết kế và xây dựng: vẽ tay, vẽ dựng hình, vẽ số, hình chiếu và phối cảnh."
  ms: "Lukisan untuk reka bentuk: lukisan bebas, terbina dan digital, unjuran ortografik dan perspektif."
  id: "Gambar untuk desain: gambar tangan, konstruksi dan digital, proyeksi ortografis dan perspektif."
  hi: "डिज़ाइन व निर्माण के लिए ड्रॉइंग: फ़्रीहैंड, निर्मित और डिजिटल, ऑर्थोग्राफ़िक और परिप्रेक्ष्य।"
outcomes:
  - en: "Create orthographic and perspective drawings"
    zh: "绘制正投影图和透视图"
    zh-TW: "繪製正投影圖與透視圖"
    ja: "正投影図と透視図を描く"
    ko: "정투영도와 투시도 그리기"
    vi: "Vẽ hình chiếu và phối cảnh"
    ms: "Membuat lukisan ortografik dan perspektif"
    id: "Membuat gambar ortografis dan perspektif"
    hi: "ऑर्थोग्राफ़िक और परिप्रेक्ष्य ड्रॉइंग बनाना"
  - en: "Draw and design with confidence"
    zh: "自信地绘图和设计"
    zh-TW: "自信地繪圖與設計"
    ja: "自信を持って描き設計する"
    ko: "자신 있게 그리고 설계하기"
    vi: "Tự tin vẽ và thiết kế"
    ms: "Melukis dan mereka bentuk dengan yakin"
    id: "Menggambar dan mendesain dengan percaya diri"
    hi: "आत्मविश्वास से ड्रॉ और डिज़ाइन करना"
