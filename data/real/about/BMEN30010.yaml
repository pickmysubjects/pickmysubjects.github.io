code: BMEN30010
year: 2026
learn:
  en: "Forces in the body, from walking to heartbeats: statics, stress and strain, materials testing and motion."
  zh: "人体中的力：从行走到心跳，静力学、应力应变、材料测试与运动。"
  zh-TW: "人體中的力：從行走到心跳，靜力學、應力應變、材料測試與運動。"
  ja: "体内の力：歩行から心拍まで、静力学、応力とひずみ、材料試験、運動。"
  ko: "인체 속 힘: 보행부터 심장박동까지, 정역학·응력·변형·재료 시험·운동."
  vi: "Lực trong cơ thể, từ đi bộ đến nhịp tim: tĩnh học, ứng suất, biến dạng, thử vật liệu và chuyển động."
  ms: "Daya dalam badan, dari berjalan hingga degupan jantung: statik, tegasan, terikan dan gerakan."
  id: "Gaya di tubuh, dari berjalan hingga detak jantung: statika, tegangan, regangan, dan gerak."
  hi: "शरीर में बल, चलने से धड़कन तक: स्टैटिक्स, तनाव-विकृति, सामग्री परीक्षण और गति।"
outcomes:
  - en: "Solve mechanics problems with free body diagrams"
    zh: "用受力图解决力学问题"
    zh-TW: "用自由體圖解決力學問題"
    ja: "自由物体図で力学問題を解く"
    ko: "자유물체도로 역학 문제 풀기"
    vi: "Giải bài toán cơ học bằng sơ đồ lực"
    ms: "Selesaikan masalah mekanik dengan rajah jasad bebas"
    id: "Menyelesaikan soal mekanika dengan diagram benda bebas"
    hi: "फ़्री बॉडी डायग्राम से यांत्रिकी समस्याएँ हल करें"
  - en: "Test materials and analyse failure"
    zh: "测试材料并分析失效"
    zh-TW: "測試材料並分析破壞"
    ja: "材料を試験し破壊を解析する"
    ko: "재료 시험과 파손 분석하기"
    vi: "Thử vật liệu và phân tích hư hỏng"
    ms: "Uji bahan dan analisis kegagalan"
    id: "Menguji bahan dan menganalisis kegagalan"
    hi: "सामग्री परखें और विफलता का विश्लेषण करें"
  - en: "Write programs to solve biomechanics problems"
    zh: "编程解决生物力学问题"
    zh-TW: "寫程式解決生物力學問題"
    ja: "生体力学の問題をプログラムで解く"
    ko: "생체역학 문제 해결 프로그램 작성하기"
    vi: "Viết chương trình giải bài toán cơ sinh học"
    ms: "Tulis program untuk masalah biomekanik"
    id: "Menulis program untuk soal biomekanika"
    hi: "बायोमैकेनिक्स समस्याओं के लिए प्रोग्राम लिखें"
