code: MECM20013
year: 2026
learn:
  en: "Writing news and feature stories for print, online and audio, with interviewing, editing, ethics codes and media law."
  zh: "为纸媒、网络和音频写新闻和特稿，包括采访、编辑、新闻伦理守则和媒体法。"
  zh-TW: "為紙媒、網路和音訊寫新聞和特稿，包括採訪、編輯、新聞倫理守則和媒體法。"
  ja: "紙・ウェブ・音声向けのニュース記事や特集記事を書き、取材、編集、倫理規定、メディア法も学ぶ。"
  ko: "인쇄, 온라인, 오디오용 뉴스와 기획 기사를 쓰며 인터뷰, 편집, 윤리 강령, 언론법도 배운다."
  vi: "Viết tin và bài phóng sự cho báo in, trực tuyến và âm thanh, cùng phỏng vấn, biên tập, quy tắc đạo đức và luật truyền thông."
  ms: "Menulis berita dan rencana untuk cetak, dalam talian dan audio, termasuk temu bual, suntingan, kod etika dan undang-undang media."
  id: "Menulis berita dan feature untuk cetak, daring, dan audio, termasuk wawancara, penyuntingan, kode etik, dan hukum media."
  hi: "प्रिंट, ऑनलाइन और ऑडियो के लिए खबरें और फ़ीचर लिखना, साथ में इंटरव्यू, संपादन, आचार संहिता और मीडिया कानून।"
outcomes:
  - en: "Write news for text and audio"
    zh: "为文字和音频平台写新闻"
    zh-TW: "為文字和音訊平台寫新聞"
    ja: "文字と音声の両方でニュースを書く"
    ko: "글과 오디오용 뉴스 쓰기"
    vi: "Viết tin cho văn bản và âm thanh"
    ms: "Menulis berita untuk teks dan audio"
    id: "Menulis berita untuk teks dan audio"
    hi: "टेक्स्ट और ऑडियो के लिए खबर लिखना"
  - en: "Apply journalism ethics codes to your work"
    zh: "在自己的报道中遵守新闻伦理守则"
    zh-TW: "在自己的報導中遵守新聞倫理守則"
    ja: "自分の記事に報道倫理規定を当てはめる"
    ko: "자기 기사에 언론 윤리 강령 적용하기"
    vi: "Áp dụng quy tắc đạo đức báo chí vào bài của mình"
    ms: "Guna kod etika kewartawanan dalam kerja sendiri"
    id: "Menerapkan kode etik jurnalistik pada karya sendiri"
    hi: "अपने काम में पत्रकारिता की आचार संहिता लागू करना"
  - en: "Explain how media law affects journalists"
    zh: "说明媒体法对记者的影响"
    zh-TW: "說明媒體法對記者的影響"
    ja: "メディア法が記者にどう影響するか説明する"
    ko: "언론법이 기자에게 미치는 영향 설명하기"
    vi: "Giải thích luật truyền thông ảnh hưởng thế nào đến nhà báo"
    ms: "Terangkan kesan undang-undang media kepada wartawan"
    id: "Menjelaskan pengaruh hukum media bagi jurnalis"
    hi: "समझाना कि मीडिया कानून पत्रकारों पर कैसे असर डालता है"
