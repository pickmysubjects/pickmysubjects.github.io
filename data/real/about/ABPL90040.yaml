code: ABPL90040
year: 2027
learn:
  en: "Two intensive weeks of group case studies in an Asian city on property, construction and infrastructure; you pay your own travel."
  zh: "在一座亚洲城市进行两周密集小组案例研究，涉及房地产、建造和基础设施；差旅自费。"
  zh-TW: "在一座亞洲城市進行兩週密集小組個案研究，涉及不動產、營建與基礎設施；旅費自付。"
  ja: "アジアの都市で2週間の集中グループ事例研究。不動産・建設・インフラ。渡航費自己負担。"
  ko: "아시아 도시에서 2주 집중 그룹 사례 연구. 부동산·건설·인프라. 경비 본인 부담."
  vi: "Hai tuần nghiên cứu tình huống nhóm tại một thành phố châu Á; tự trả chi phí đi lại."
  ms: "Dua minggu kajian kes berkumpulan di bandar Asia; kos perjalanan sendiri."
  id: "Dua minggu studi kasus kelompok di kota Asia; biaya perjalanan sendiri."
  hi: "एशियाई शहर में दो हफ़्ते के समूह केस अध्ययन; यात्रा ख़र्च स्वयं।"
outcomes:
  - en: "Study real projects on site in an Asian city"
    zh: "在亚洲城市实地研究真实项目"
    zh-TW: "在亞洲城市實地研究真實專案"
    ja: "アジアの都市で実プロジェクトを現地調査する"
    ko: "아시아 도시에서 실제 프로젝트 현장 조사하기"
    vi: "Khảo sát dự án thực tế tại thành phố châu Á"
    ms: "Mengkaji projek sebenar di bandar Asia"
    id: "Mempelajari proyek nyata di kota Asia"
    hi: "एशियाई शहर में असली परियोजनाओं का अध्ययन"
  - en: "Write an in-depth report on a case study"
    zh: "就案例撰写深入报告"
    zh-TW: "就個案撰寫深入報告"
    ja: "事例について詳しい報告書を書く"
    ko: "사례에 대한 심층 보고서 쓰기"
    vi: "Viết báo cáo chuyên sâu về một tình huống"
    ms: "Menulis laporan mendalam kajian kes"
    id: "Menulis laporan mendalam studi kasus"
    hi: "केस अध्ययन पर गहन रिपोर्ट लिखना"
