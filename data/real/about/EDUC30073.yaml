code: EDUC30073
year: 2026
learn:
  en: "How community sport drives social change on issues like disability and inequality, and how to lead that change."
  zh: "社区体育如何推动残障、不平等等社会议题的改变，以及如何领导变革。"
  zh-TW: "社區體育如何推動身障、不平等等社會議題的改變，以及如何領導變革。"
  ja: "地域スポーツが障害や格差などの社会課題をどう変え、どう変化を導くか。"
  ko: "지역 스포츠가 장애·불평등 같은 사회 문제를 바꾸는 방식과 변화 이끌기."
  vi: "Thể thao cộng đồng thúc đẩy thay đổi xã hội như khuyết tật, bất bình đẳng ra sao, và cách dẫn dắt thay đổi."
  ms: "Cara sukan komuniti memacu perubahan sosial seperti OKU dan ketidaksamaan, dan cara memimpinnya."
  id: "Cara olahraga komunitas mendorong perubahan sosial seperti disabilitas dan ketimpangan, dan cara memimpinnya."
  hi: "सामुदायिक खेल विकलांगता और असमानता जैसे मुद्दों पर बदलाव कैसे लाते हैं, और उस बदलाव का नेतृत्व।"
outcomes:
  - en: "Explain why sport matters so much in Australia"
    zh: "解释体育为何在澳大利亚如此重要"
    zh-TW: "解釋體育為何在澳洲如此重要"
    ja: "オーストラリアでスポーツが重視される理由を説明する"
    ko: "호주에서 스포츠가 왜 그렇게 중요한지 설명하기"
    vi: "Giải thích vì sao thể thao quan trọng ở Úc"
    ms: "Terangkan mengapa sukan begitu penting di Australia"
    id: "Menjelaskan mengapa olahraga begitu penting di Australia"
    hi: "समझाना कि ऑस्ट्रेलिया में खेल इतना अहम क्यों है"
  - en: "Show how sport programs engage diverse communities"
    zh: "说明体育项目如何联系多元社区"
    zh-TW: "說明體育計畫如何連結多元社區"
    ja: "スポーツ事業が多様な地域社会をどうつなぐかを示す"
    ko: "스포츠 프로그램이 다양한 공동체를 잇는 방식 보여주기"
    vi: "Cho thấy chương trình thể thao gắn kết cộng đồng đa dạng"
    ms: "Tunjukkan cara program sukan melibatkan komuniti pelbagai"
    id: "Menunjukkan cara program olahraga merangkul komunitas beragam"
    hi: "दिखाना कि खेल कार्यक्रम विविध समुदायों को कैसे जोड़ते हैं"
  - en: "Consult stakeholders to make a case for change"
    zh: "与相关方沟通，提出变革方案"
    zh-TW: "與利害關係人溝通，提出變革方案"
    ja: "関係者と話し合い、変化の提案をまとめる"
    ko: "이해관계자와 협의해 변화 제안하기"
    vi: "Tham vấn các bên liên quan để đề xuất thay đổi"
    ms: "Berunding dengan pihak berkepentingan untuk mencadangkan perubahan"
    id: "Berkonsultasi dengan pemangku kepentingan untuk mengusulkan perubahan"
    hi: "हितधारकों से परामर्श कर बदलाव का प्रस्ताव रखना"
