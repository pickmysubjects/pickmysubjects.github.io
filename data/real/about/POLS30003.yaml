code: POLS30003
year: 2026
learn:
  en: "A placement with a government, non-profit or community organisation, producing a policy report or portfolio for them."
  zh: "到政府、非营利或社区机构实习，为他们完成一份政策报告或作品集。"
  zh-TW: "到政府、非營利或社區機構實習，為他們完成一份政策報告或作品集。"
  ja: "政府、非営利団体、地域団体で実習し、その組織のために政策報告書かポートフォリオを作る。"
  ko: "정부, 비영리, 지역 단체에서 실습하며 그 기관을 위한 정책 보고서나 포트폴리오를 만든다."
  vi: "Thực tập tại cơ quan chính phủ, tổ chức phi lợi nhuận hoặc cộng đồng, làm báo cáo chính sách hoặc hồ sơ cho họ."
  ms: "Penempatan di organisasi kerajaan, bukan untung atau komuniti, menghasilkan laporan dasar atau portfolio untuk mereka."
  id: "Magang di lembaga pemerintah, nirlaba, atau komunitas, menyusun laporan kebijakan atau portofolio untuk mereka."
  hi: "किसी सरकारी, गैर-लाभकारी या सामुदायिक संगठन में प्लेसमेंट, उनके लिए नीति रिपोर्ट या पोर्टफ़ोलियो तैयार करना।"
outcomes:
  - en: "Apply what you know in a real workplace"
    zh: "把所学用到真实的工作环境中"
    zh-TW: "把所學用到真實的工作環境中"
    ja: "学んだことを実際の職場で生かす"
    ko: "배운 것을 실제 직장에서 활용하기"
    vi: "Áp dụng kiến thức vào nơi làm việc thực tế"
    ms: "Guna ilmu di tempat kerja sebenar"
    id: "Menerapkan ilmu di tempat kerja nyata"
    hi: "सीखी बातें असली कार्यस्थल पर लागू करना"
  - en: "Write a policy report for a host organisation"
    zh: "为实习机构撰写政策报告"
    zh-TW: "為實習機構撰寫政策報告"
    ja: "受け入れ先のために政策報告書を書く"
    ko: "실습 기관을 위한 정책 보고서 쓰기"
    vi: "Viết báo cáo chính sách cho đơn vị tiếp nhận"
    ms: "Tulis laporan dasar untuk organisasi tuan rumah"
    id: "Menulis laporan kebijakan untuk organisasi tempat magang"
    hi: "मेज़बान संगठन के लिए नीति रिपोर्ट लिखना"
  - en: "Communicate well with people at work"
    zh: "在工作中与人有效沟通"
    zh-TW: "在工作中與人有效溝通"
    ja: "職場の人と上手にやり取りする"
    ko: "직장에서 사람들과 잘 소통하기"
    vi: "Giao tiếp tốt với mọi người nơi làm việc"
    ms: "Berkomunikasi dengan baik di tempat kerja"
    id: "Berkomunikasi dengan baik di tempat kerja"
    hi: "काम पर लोगों से अच्छी तरह बातचीत करना"
