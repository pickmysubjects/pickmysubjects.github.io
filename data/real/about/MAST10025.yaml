code: MAST10025
year: 2026
learn:
  en: "Catch-up maths for Uni Ready students: sets, functions, trig, counting, probability and statistics."
  zh: "给 Uni Ready 学生补数学：集合、函数、三角、计数、概率和统计。"
  zh-TW: "給 Uni Ready 學生補數學：集合、函數、三角、計數、機率和統計。"
  ja: "Uni Ready生向けの補習数学：集合、関数、三角関数、数え上げ、確率、統計。"
  ko: "Uni Ready 학생을 위한 보충 수학: 집합, 함수, 삼각함수, 경우의 수, 확률, 통계."
  vi: "Toán bổ trợ cho sinh viên Uni Ready: tập hợp, hàm số, lượng giác, đếm, xác suất và thống kê."
  ms: "Matematik susulan untuk pelajar Uni Ready: set, fungsi, trigonometri, pembilangan, kebarangkalian dan statistik."
  id: "Matematika penyusul untuk mahasiswa Uni Ready: himpunan, fungsi, trigonometri, pencacahan, peluang, dan statistika."
  hi: "Uni Ready छात्रों के लिए कैच-अप गणित: सेट, फ़ंक्शन, त्रिकोणमिति, गिनती, प्रायिकता और स्टैटिस्टिक्स।"
outcomes:
  - en: "Work with sets and set operations"
    zh: "会用集合和集合运算"
    zh-TW: "會用集合和集合運算"
    ja: "集合と集合演算を扱う"
    ko: "집합과 집합 연산 다루기"
    vi: "Làm việc với tập hợp và phép toán tập hợp"
    ms: "Guna set dan operasi set"
    id: "Bekerja dengan himpunan dan operasinya"
    hi: "सेट और सेट ऑपरेशन के साथ काम करना"
  - en: "Analyse functions, compositions and inverses"
    zh: "分析函数、复合函数和反函数"
    zh-TW: "分析函數、合成函數和反函數"
    ja: "関数・合成関数・逆関数を分析する"
    ko: "함수, 합성함수, 역함수 분석"
    vi: "Phân tích hàm số, hàm hợp và hàm ngược"
    ms: "Analisis fungsi, gubahan dan songsangan"
    id: "Menganalisis fungsi, komposisi, dan invers"
    hi: "फ़ंक्शन, कंपोज़िशन और इनवर्स का विश्लेषण"
  - en: "Calculate probabilities and confidence intervals"
    zh: "算概率和置信区间"
    zh-TW: "算機率和信賴區間"
    ja: "確率と信頼区間を計算する"
    ko: "확률과 신뢰구간 계산"
    vi: "Tính xác suất và khoảng tin cậy"
    ms: "Kira kebarangkalian dan selang keyakinan"
    id: "Menghitung peluang dan selang kepercayaan"
    hi: "प्रायिकता और कॉन्फ़िडेंस इंटरवल निकालना"
