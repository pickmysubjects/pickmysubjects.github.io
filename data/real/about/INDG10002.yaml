code: INDG10002
year: 2026
learn:
  en: "An introduction to Indigenous peoples worldwide: their knowledge, histories and experience of colonialism, led by Indigenous scholars."
  zh: "全球原住民族入门：他们的知识、历史和殖民经历，以原住民学者的视角为主。"
  zh-TW: "全球原住民族入門：他們的知識、歷史和殖民經歷，以原住民學者的視角為主。"
  ja: "世界の先住民族入門。先住民の研究者を中心に、その知識・歴史・植民地経験を学ぶ。"
  ko: "세계 원주민 입문: 원주민 학자들의 관점으로 그들의 지식, 역사, 식민 경험을 배운다."
  vi: "Nhập môn về các dân tộc bản địa trên thế giới: tri thức, lịch sử và trải nghiệm thuộc địa, qua các học giả bản địa."
  ms: "Pengenalan Orang Asal di seluruh dunia: ilmu, sejarah dan pengalaman penjajahan mereka, dipimpin sarjana Orang Asal."
  id: "Pengantar masyarakat adat di seluruh dunia: pengetahuan, sejarah, dan pengalaman kolonialisme mereka, dari sudut pandang cendekia adat."
  hi: "दुनिया भर के मूलनिवासी लोगों का परिचय: उनका ज्ञान, इतिहास और उपनिवेशवाद का अनुभव, मूलनिवासी विद्वानों के नज़रिए से।"
outcomes:
  - en: "Describe the diversity of Indigenous cultures"
    zh: "描述原住民文化的多样性"
    zh-TW: "描述原住民文化的多樣性"
    ja: "先住民文化の多様さを説明する"
    ko: "원주민 문화의 다양성 설명하기"
    vi: "Mô tả sự đa dạng của các nền văn hóa bản địa"
    ms: "Huraikan kepelbagaian budaya Orang Asal"
    id: "Mendeskripsikan keragaman budaya masyarakat adat"
    hi: "मूलनिवासी संस्कृतियों की विविधता का वर्णन करना"
  - en: "Explain shared experiences of colonialism"
    zh: "解释共同的殖民经历"
    zh-TW: "解釋共同的殖民經歷"
    ja: "植民地主義の共通の経験を説明する"
    ko: "식민주의의 공통 경험 설명하기"
    vi: "Giải thích những trải nghiệm thuộc địa chung"
    ms: "Terangkan pengalaman penjajahan yang dikongsi"
    id: "Menjelaskan pengalaman kolonialisme yang serupa"
    hi: "उपनिवेशवाद के साझा अनुभव समझाना"
  - en: "Analyse Indigenous self-representation"
    zh: "分析原住民的自我表达"
    zh-TW: "分析原住民的自我表達"
    ja: "先住民による自己表現を分析する"
    ko: "원주민의 자기 재현 분석하기"
    vi: "Phân tích cách người bản địa tự thể hiện mình"
    ms: "Analisis perwakilan diri Orang Asal"
    id: "Menganalisis representasi diri masyarakat adat"
    hi: "मूलनिवासियों के आत्म-प्रतिनिधित्व का विश्लेषण करना"
