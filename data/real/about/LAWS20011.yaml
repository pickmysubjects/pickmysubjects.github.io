code: LAWS20011
year: 2027
learn:
  en: "How law shapes sport: governing bodies, contracts and disputes, plus doping, match-fixing and athlete rights."
  zh: "法律如何影响体育：体育组织、合同与纠纷，以及兴奋剂、假球和运动员权利。"
  zh-TW: "法律如何影響運動：運動組織、合約與爭議，以及禁藥、打假球和運動員權利。"
  ja: "法がスポーツをどう形作るか：競技団体、契約や紛争、ドーピング、八百長、選手の権利。"
  ko: "법이 스포츠를 어떻게 규율하는지: 스포츠 단체, 계약과 분쟁, 도핑, 승부조작, 선수 권리."
  vi: "Pháp luật định hình thể thao ra sao: tổ chức thể thao, hợp đồng và tranh chấp, doping, dàn xếp tỷ số và quyền vận động viên."
  ms: "Cara undang-undang membentuk sukan: badan induk, kontrak dan pertikaian, serta doping, pengaturan perlawanan dan hak atlet."
  id: "Cara hukum membentuk olahraga: badan pengatur, kontrak dan sengketa, serta doping, pengaturan skor, dan hak atlet."
  hi: "कानून खेल को कैसे आकार देता है: खेल संस्थाएँ, अनुबंध और विवाद, साथ ही डोपिंग, मैच फिक्सिंग और खिलाड़ियों के अधिकार।"
outcomes:
  - en: "Identify the legal principles that apply to sport"
    zh: "识别适用于体育的法律原则"
    zh-TW: "辨識適用於運動的法律原則"
    ja: "スポーツに関わる法原則を見極める"
    ko: "스포츠에 적용되는 법 원칙 파악하기"
    vi: "Nhận diện các nguyên tắc pháp lý áp dụng cho thể thao"
    ms: "Kenal pasti prinsip undang-undang yang terpakai pada sukan"
    id: "Mengenali prinsip hukum yang berlaku dalam olahraga"
    hi: "खेल पर लागू कानूनी सिद्धांत पहचानना"
  - en: "Examine sports bodies' legal duties at home and abroad"
    zh: "分析国内外体育组织的法律责任"
    zh-TW: "分析國內外運動組織的法律責任"
    ja: "国内外の競技団体の法的責任を検討する"
    ko: "국내외 스포츠 단체의 법적 책임 살펴보기"
    vi: "Xem xét trách nhiệm pháp lý của tổ chức thể thao trong và ngoài nước"
    ms: "Teliti tanggungjawab undang-undang badan sukan dalam dan luar negara"
    id: "Mengkaji tanggung jawab hukum badan olahraga di dalam dan luar negeri"
    hi: "देश-विदेश में खेल संस्थाओं की कानूनी ज़िम्मेदारियाँ परखना"
