code: ABPL90323
year: 2027
learn:
  en: "Building construction schedules with Primavera: defining and sequencing activities, and allocating and levelling resources."
  zh: "用 Primavera 编制施工进度：定义和排序工序，分配和平衡资源。"
  zh-TW: "用 Primavera 編製施工排程：定義與排序工項，分配與平衡資源。"
  ja: "Primavera で工程表を作る：作業の定義と順序付け、資源配分と平準化。"
  ko: "Primavera로 공정표 작성: 작업 정의·순서, 자원 배분·평준화."
  vi: "Lập tiến độ thi công bằng Primavera: xác định, sắp xếp công việc và phân bổ nguồn lực."
  ms: "Membina jadual pembinaan dengan Primavera: aktiviti, turutan dan peruntukan sumber."
  id: "Menyusun jadwal konstruksi dengan Primavera: aktivitas, urutan dan alokasi sumber daya."
  hi: "Primavera से निर्माण शेड्यूल बनाना: गतिविधियाँ, क्रम और संसाधन आवंटन।"
outcomes:
  - en: "Optimise construction time for real projects"
    zh: "优化实际项目的工期"
    zh-TW: "優化實際專案的工期"
    ja: "実プロジェクトの工期を最適化する"
    ko: "실제 프로젝트 공기 최적화하기"
    vi: "Tối ưu thời gian thi công cho dự án thực"
    ms: "Mengoptimumkan masa pembinaan projek sebenar"
    id: "Mengoptimalkan waktu konstruksi proyek nyata"
    hi: "असली परियोजनाओं का निर्माण समय अनुकूलित करना"
  - en: "Allocate and level resources in a schedule"
    zh: "在进度中分配和平衡资源"
    zh-TW: "在排程中分配與平衡資源"
    ja: "工程表で資源を配分し平準化する"
    ko: "공정표에서 자원 배분·평준화하기"
    vi: "Phân bổ và cân bằng nguồn lực trong tiến độ"
    ms: "Memperuntuk dan meratakan sumber dalam jadual"
    id: "Mengalokasikan dan meratakan sumber daya"
    hi: "शेड्यूल में संसाधन बाँटना और संतुलित करना"
