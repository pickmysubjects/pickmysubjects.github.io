code: FNCE20003
year: 2026
learn:
  en: "Managing your own money: budgeting, investing, buying property, retirement, tax and the psychology of money choices."
  zh: "管理个人财务：投资、买房、退休、税务，以及理财决策心理。"
  zh-TW: "管理個人財務：投資、買房、退休、稅務，以及理財決策心理。"
  ja: "個人のお金の管理：投資、住宅購入、退職、税金、お金の判断の心理。"
  ko: "개인 재무 관리: 투자, 주택 구매, 은퇴, 세금, 돈 결정의 심리."
  vi: "Quản lý tài chính cá nhân: đầu tư, mua nhà, nghỉ hưu, thuế và tâm lý khi ra quyết định về tiền."
  ms: "Mengurus kewangan peribadi: pelaburan, beli rumah, persaraan, cukai dan psikologi keputusan wang."
  id: "Mengelola keuangan pribadi: investasi, beli rumah, pensiun, pajak, dan psikologi keputusan soal uang."
  hi: "अपने पैसे का प्रबंधन: निवेश, घर ख़रीदना, रिटायरमेंट, टैक्स और पैसों के फ़ैसलों का मनोविज्ञान।"
outcomes:
  - en: "Explain financial wellbeing and why it matters"
    zh: "解释财务健康的含义及其重要性"
    zh-TW: "說明財務健康的意義及其重要性"
    ja: "経済的ウェルビーイングとその重要性を説明する"
    ko: "재정적 웰빙과 그 중요성 설명"
    vi: "Giải thích sức khỏe tài chính và vì sao quan trọng"
    ms: "Terangkan kesejahteraan kewangan dan kepentingannya"
    id: "Menjelaskan kesejahteraan finansial dan pentingnya"
    hi: "वित्तीय भलाई क्या है और क्यों ज़रूरी है, समझाना"
  - en: "Match common money problems with the right financial products"
    zh: "为常见财务问题匹配合适的金融产品"
    zh-TW: "為常見財務問題配對合適的金融商品"
    ja: "よくあるお金の問題に合う金融商品を選ぶ"
    ko: "흔한 돈 문제에 맞는 금융상품 고르기"
    vi: "Chọn sản phẩm tài chính phù hợp cho vấn đề tiền bạc thường gặp"
    ms: "Padankan masalah wang biasa dengan produk kewangan sesuai"
    id: "Mencocokkan masalah uang umum dengan produk keuangan yang tepat"
    hi: "आम पैसों की समस्याओं के लिए सही वित्तीय उत्पाद चुनना"
  - en: "Describe how financial planning works in Australia"
    zh: "描述澳洲的理财规划流程"
    zh-TW: "描述澳洲的理財規劃流程"
    ja: "豪州の資産計画の流れを説明する"
    ko: "호주의 재무설계 과정 설명"
    vi: "Mô tả quy trình hoạch định tài chính ở Úc"
    ms: "Huraikan proses perancangan kewangan di Australia"
    id: "Menjelaskan proses perencanaan keuangan di Australia"
    hi: "ऑस्ट्रेलिया में फ़ाइनेंशियल प्लानिंग कैसे होती है, बताना"
