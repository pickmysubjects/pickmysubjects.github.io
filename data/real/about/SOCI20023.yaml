code: SOCI20023
year: 2026
learn:
  en: "Designing and running a social survey, then cleaning the data and doing basic statistical analysis."
  zh: "设计并实施社会调查问卷，再清理数据、做基础统计分析。"
  zh-TW: "設計並實施社會調查問卷，再清理資料、做基礎統計分析。"
  ja: "社会調査を設計・実施し、データを整えて基本的な統計分析をする。"
  ko: "사회 조사를 설계하고 실행한 뒤 데이터를 정리해 기초 통계 분석을 한다."
  vi: "Thiết kế và thực hiện khảo sát xã hội, rồi làm sạch dữ liệu và phân tích thống kê cơ bản."
  ms: "Mereka bentuk dan menjalankan tinjauan sosial, kemudian membersihkan data dan membuat analisis statistik asas."
  id: "Merancang dan menjalankan survei sosial, lalu membersihkan data dan melakukan analisis statistik dasar."
  hi: "सामाजिक सर्वे बनाना और चलाना, फिर डेटा साफ़ करके बुनियादी सांख्यिकीय विश्लेषण करना।"
outcomes:
  - en: "Write survey questions that measure attitudes"
    zh: "编写测量态度的问卷题目"
    zh-TW: "編寫測量態度的問卷題目"
    ja: "態度を測る質問項目を作る"
    ko: "태도를 측정하는 설문 문항 만들기"
    vi: "Viết câu hỏi khảo sát đo lường thái độ"
    ms: "Tulis soalan tinjauan yang mengukur sikap"
    id: "Menyusun pertanyaan survei untuk mengukur sikap"
    hi: "दृष्टिकोण मापने वाले सर्वे प्रश्न लिखना"
  - en: "Analyse survey data with basic statistics"
    zh: "用基础统计方法分析问卷数据"
    zh-TW: "用基礎統計方法分析問卷資料"
    ja: "基本的な統計で調査データを分析する"
    ko: "기초 통계로 설문 데이터 분석하기"
    vi: "Phân tích dữ liệu khảo sát bằng thống kê cơ bản"
    ms: "Analisis data tinjauan dengan statistik asas"
    id: "Menganalisis data survei dengan statistik dasar"
    hi: "बुनियादी सांख्यिकी से सर्वे डेटा का विश्लेषण करना"
  - en: "Interpret and report findings using sociology"
    zh: "结合社会学解读并汇报结果"
    zh-TW: "結合社會學解讀並報告結果"
    ja: "社会学を使って結果を解釈し報告する"
    ko: "사회학을 바탕으로 결과 해석하고 보고하기"
    vi: "Diễn giải và trình bày kết quả dựa trên xã hội học"
    ms: "Tafsir dan laporkan dapatan menggunakan sosiologi"
    id: "Menafsirkan dan melaporkan temuan dengan sosiologi"
    hi: "समाजशास्त्र के सहारे नतीजों की व्याख्या और रिपोर्ट करना"
