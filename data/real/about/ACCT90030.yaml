code: ACCT90030
year: 2027
learn:
  en: "Business processes that produce accounting data, and the controls that keep that data reliable."
  zh: "产生会计数据的业务流程，以及确保数据可靠的内部控制。"
  zh-TW: "產生會計資料的業務流程，以及確保資料可靠的內部控制。"
  ja: "会計データを生む業務プロセスと、その信頼性を保つ内部統制。"
  ko: "회계 데이터를 만드는 업무 프로세스와 데이터 신뢰성을 지키는 통제."
  vi: "Quy trình kinh doanh tạo ra dữ liệu kế toán và các kiểm soát giữ cho dữ liệu đáng tin cậy."
  ms: "Proses perniagaan yang menghasilkan data perakaunan dan kawalan yang memastikannya boleh dipercayai."
  id: "Proses bisnis yang menghasilkan data akuntansi dan pengendalian yang menjaga keandalannya."
  hi: "लेखा डेटा बनाने वाली व्यावसायिक प्रक्रियाएँ और उसे विश्वसनीय रखने वाले नियंत्रण।"
outcomes:
  - en: "Explain how information systems support accounting"
    zh: "解释信息系统如何支持会计"
    zh-TW: "解釋資訊系統如何支援會計"
    ja: "情報システムが会計を支える仕組みを説明する"
    ko: "정보시스템이 회계를 지원하는 방식 설명하기"
    vi: "Giải thích hệ thống thông tin hỗ trợ kế toán ra sao"
    ms: "Menerangkan cara sistem maklumat menyokong perakaunan"
    id: "Menjelaskan cara sistem informasi mendukung akuntansi"
    hi: "सूचना प्रणालियाँ लेखा में कैसे मदद करती हैं, समझाना"
  - en: "Design controls to improve business processes"
    zh: "设计控制措施以改进业务流程"
    zh-TW: "設計控制措施以改善業務流程"
    ja: "業務プロセスを改善する統制を設計する"
    ko: "업무 프로세스 개선을 위한 통제 설계하기"
    vi: "Thiết kế kiểm soát để cải tiến quy trình"
    ms: "Mereka kawalan untuk menambah baik proses perniagaan"
    id: "Merancang pengendalian untuk memperbaiki proses bisnis"
    hi: "व्यावसायिक प्रक्रियाएँ सुधारने के लिए नियंत्रण बनाना"
