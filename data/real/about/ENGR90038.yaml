code: ENGR90038
year: 2027
learn:
  en: "A year-long team project on an advanced engineering design or research topic, supervised by staff and sometimes an industry partner."
  zh: "为期两学期的团队项目，在教师（有时还有企业伙伴）指导下完成高级工程设计或研究课题。"
  zh-TW: "為期兩學期的團隊專題，在教師（有時還有企業夥伴）指導下完成進階工程設計或研究題目。"
  ja: "教員（場合により企業パートナー）の指導で、高度な工学設計・研究課題に 2 学期かけてチームで取り組む。"
  ko: "교수(경우에 따라 기업 파트너)의 지도 아래 두 학기에 걸쳐 고급 공학 설계·연구 과제를 팀으로 수행합니다."
  vi: "Dự án nhóm kéo dài hai học kỳ về thiết kế hoặc nghiên cứu kỹ thuật nâng cao, có giảng viên và đôi khi đối tác doanh nghiệp hướng dẫn."
  ms: "Projek berkumpulan dua semester tentang reka bentuk atau penyelidikan kejuruteraan lanjutan, diselia staf dan kadangkala rakan industri."
  id: "Proyek tim dua semester tentang desain atau riset teknik lanjut, dibimbing dosen dan kadang mitra industri."
  hi: "दो सेमेस्टर का टीम प्रोजेक्ट, उन्नत इंजीनियरिंग डिज़ाइन या शोध पर, स्टाफ़ और कभी-कभी उद्योग साझेदार की देखरेख में।"
outcomes:
  - en: "Manage a team engineering project with standard tools"
    zh: "用标准工具管理团队工程项目"
    zh-TW: "用標準工具管理團隊工程專案"
    ja: "標準的なツールでチームの工学プロジェクトを管理する"
    ko: "표준 도구로 팀 공학 프로젝트 관리하기"
    vi: "Quản lý dự án kỹ thuật nhóm bằng công cụ chuẩn"
    ms: "Mengurus projek kejuruteraan berkumpulan dengan alat standard"
    id: "Mengelola proyek teknik tim dengan alat standar"
    hi: "मानक टूल से टीम इंजीनियरिंग प्रोजेक्ट का प्रबंधन"
  - en: "Use published research, patents and standards in the work"
    zh: "在项目中运用已发表研究、专利和标准"
    zh-TW: "在專案中運用已發表研究、專利與標準"
    ja: "既存の研究・特許・規格をプロジェクトに活かす"
    ko: "발표된 연구, 특허, 표준을 프로젝트에 활용하기"
    vi: "Dùng nghiên cứu đã công bố, bằng sáng chế và tiêu chuẩn trong dự án"
    ms: "Menggunakan penyelidikan terbitan, paten dan piawaian dalam kerja"
    id: "Memakai riset terbitan, paten, dan standar dalam pekerjaan"
    hi: "काम में प्रकाशित शोध, पेटेंट और मानकों का उपयोग"
  - en: "Report the results at each stage"
    zh: "在每个阶段汇报成果"
    zh-TW: "在每個階段報告成果"
    ja: "各段階で成果を報告する"
    ko: "단계마다 결과 보고하기"
    vi: "Báo cáo kết quả ở từng giai đoạn"
    ms: "Melaporkan hasil pada setiap peringkat"
    id: "Melaporkan hasil di setiap tahap"
    hi: "हर चरण के नतीजे बताना"
