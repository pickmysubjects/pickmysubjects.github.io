code: GENE20004
year: 2026
learn:
  en: "Hands-on lab work learning the main techniques of molecular biology and genetic analysis."
  zh: "在实验室动手学分子生物学和遗传分析的常用技术。"
  zh-TW: "在實驗室動手學分子生物學和遺傳分析的常用技術。"
  ja: "実験室での実習を通して、分子生物学と遺伝解析の主な技術を学ぶ。"
  ko: "실험실 실습으로 분자생물학과 유전 분석의 주요 기법을 배운다."
  vi: "Thực hành trong phòng lab, học các kỹ thuật chính của sinh học phân tử và phân tích di truyền."
  ms: "Kerja makmal secara amali untuk belajar teknik utama biologi molekul dan analisis genetik."
  id: "Praktik lab untuk mempelajari teknik utama biologi molekuler dan analisis genetik."
  hi: "लैब में हाथ से काम करके मॉलिक्यूलर बायोलॉजी और जेनेटिक विश्लेषण की मुख्य तकनीकें सीखना।"
outcomes:
  - en: "Run experiments on gene function and expression"
    zh: "做基因功能和表达的实验"
    zh-TW: "做基因功能和表現的實驗"
    ja: "遺伝子の機能と発現の実験を行う"
    ko: "유전자 기능·발현 실험 수행"
    vi: "Làm thí nghiệm về chức năng và biểu hiện gen"
    ms: "Jalankan eksperimen fungsi dan ekspresi gen"
    id: "Melakukan eksperimen fungsi dan ekspresi gen"
    hi: "जीन के कार्य और अभिव्यक्ति पर प्रयोग करना"
  - en: "Analyse genetic data with statistics"
    zh: "用统计方法分析遗传数据"
    zh-TW: "用統計方法分析遺傳資料"
    ja: "統計で遺伝データを分析する"
    ko: "통계로 유전 데이터 분석"
    vi: "Phân tích dữ liệu di truyền bằng thống kê"
    ms: "Analisis data genetik dengan statistik"
    id: "Menganalisis data genetik dengan statistik"
    hi: "स्टैटिस्टिक्स से जेनेटिक डेटा का विश्लेषण"
  - en: "Present results in scientific format"
    zh: "按科学格式呈现结果"
    zh-TW: "依科學格式呈現結果"
    ja: "科学的な形式で結果を発表する"
    ko: "과학 형식으로 결과 발표"
    vi: "Trình bày kết quả theo định dạng khoa học"
    ms: "Bentang keputusan dalam format saintifik"
    id: "Menyajikan hasil dalam format ilmiah"
    hi: "नतीजे वैज्ञानिक फ़ॉर्मेट में पेश करना"
