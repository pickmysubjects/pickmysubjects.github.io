code: ABPL90279
year: 2027
learn:
  en: "Housing in informal settlements: why slums form and persist, and the policies and upgrading approaches that aim for housing equity."
  zh: "非正规住区的住房问题：贫民窟为何形成和持续，以及追求住房公平的政策和改造方式。"
  zh-TW: "非正規聚落的住宅問題：貧民窟為何形成與持續，以及追求住宅公平的政策與改善方式。"
  ja: "インフォーマル居住地の住宅：スラムが生まれ続く理由と、住宅公正のための政策と改善。"
  ko: "비공식 정주지의 주거: 슬럼의 형성·지속 원인과 주거 형평을 위한 정책·개선."
  vi: "Nhà ở khu phi chính thức: vì sao khu ổ chuột hình thành và tồn tại, chính sách và cải tạo."
  ms: "Perumahan di penempatan tidak formal: punca setinggan dan dasar menaik taraf."
  id: "Perumahan di permukiman informal: penyebab kawasan kumuh dan kebijakan perbaikannya."
  hi: "अनौपचारिक बस्तियों में आवास: झुग्गियाँ क्यों बनती व टिकती हैं, नीतियाँ और सुधार।"
outcomes:
  - en: "Explain why slums form and persist"
    zh: "解释贫民窟为何形成并持续存在"
    zh-TW: "解釋貧民窟為何形成並持續存在"
    ja: "スラムが生まれ続く理由を説明する"
    ko: "슬럼의 형성과 지속 원인 설명하기"
    vi: "Giải thích vì sao khu ổ chuột tồn tại"
    ms: "Menerangkan punca setinggan terbentuk dan kekal"
    id: "Menjelaskan mengapa kawasan kumuh bertahan"
    hi: "झुग्गियाँ क्यों बनती और टिकती हैं, समझाना"
  - en: "Critique slum upgrading policies"
    zh: "批判性评析贫民窟改造政策"
    zh-TW: "批判性評析貧民窟改善政策"
    ja: "スラム改善政策を批評する"
    ko: "슬럼 개선 정책 비평하기"
    vi: "Phê bình chính sách cải tạo khu ổ chuột"
    ms: "Mengkritik dasar menaik taraf setinggan"
    id: "Mengkritisi kebijakan perbaikan kawasan kumuh"
    hi: "झुग्गी सुधार नीतियों की आलोचना"
