code: CHIN20003
year: 2026
learn:
  en: "Chinese for students who finished Chinese 4: reading real texts and discussing social and cultural topics."
  zh: "适合学完中文 4的学生：阅读真实材料，讨论社会和文化话题。"
  zh-TW: "適合學完中文 4的學生：閱讀真實材料，討論社會和文化話題。"
  ja: "中国語4を終えた学生向け。生の文章を読み、社会や文化の話題を話し合う。"
  ko: "중국어 4을(를) 마친 학생 대상. 실제 자료를 읽고 사회·문화 주제를 토론한다."
  vi: "tiếng Trung cho sinh viên đã học xong tiếng Trung 4: đọc tài liệu thật và thảo luận chủ đề xã hội, văn hóa."
  ms: "bahasa Cina untuk pelajar yang sudah tamat bahasa Cina 4: membaca teks sebenar dan membincangkan topik sosial dan budaya."
  id: "bahasa Mandarin untuk mahasiswa yang sudah lulus bahasa Mandarin 4: membaca teks asli dan membahas topik sosial dan budaya."
  hi: "चीनी 4 पूरा कर चुके छात्रों के लिए चीनी: असली पाठ पढ़ना और सामाजिक व सांस्कृतिक विषयों पर चर्चा।"
outcomes:
  - en: "Discuss social and cultural topics in Chinese"
    zh: "用中文讨论社会和文化话题"
    zh-TW: "用中文討論社會和文化話題"
    ja: "社会や文化の話題を中国語で話し合う"
    ko: "사회·문화 주제를 중국어로 토론하기"
    vi: "Thảo luận chủ đề xã hội, văn hóa bằng tiếng Trung"
    ms: "Bincangkan topik sosial dan budaya dalam bahasa Cina"
    id: "Membahas topik sosial dan budaya dalam bahasa Mandarin"
    hi: "सामाजिक और सांस्कृतिक विषयों पर चीनी में चर्चा करना"
  - en: "Read and write longer Chinese texts"
    zh: "读写较长的中文文章"
    zh-TW: "讀寫較長的中文文章"
    ja: "長めの中国語の文章を読み書きする"
    ko: "긴 중국어 글 읽고 쓰기"
    vi: "Đọc và viết văn bản tiếng Trung dài hơn"
    ms: "Baca dan tulis teks bahasa Cina yang lebih panjang"
    id: "Membaca dan menulis teks bahasa Mandarin yang lebih panjang"
    hi: "लंबे चीनी पाठ पढ़ना-लिखना"
  - en: "Give a clear presentation in Chinese"
    zh: "用中文做清楚的口头报告"
    zh-TW: "用中文做清楚的口頭報告"
    ja: "中国語で分かりやすく発表する"
    ko: "중국어로 명확하게 발표하기"
    vi: "Thuyết trình rõ ràng bằng tiếng Trung"
    ms: "Buat pembentangan yang jelas dalam bahasa Cina"
    id: "Melakukan presentasi yang jelas dalam bahasa Mandarin"
    hi: "चीनी में स्पष्ट प्रस्तुति देना"
