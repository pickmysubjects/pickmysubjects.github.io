code: ATOC30008
year: 2026
learn:
  en: "What sets the atmosphere's structure and makeup: clouds, rain, stability, air pollution and how to measure them."
  zh: "大气的结构与成分：云、降水、稳定度、空气污染及其观测。"
  zh-TW: "大氣的結構與成分：雲、降水、穩定度、空氣污染及其觀測。"
  ja: "大気の構造と組成：雲、降水、安定度、大気汚染とその観測。"
  ko: "대기의 구조와 성분: 구름, 강수, 안정도, 대기오염과 관측."
  vi: "Cấu trúc và thành phần khí quyển: mây, mưa, độ ổn định, ô nhiễm không khí và cách đo."
  ms: "Struktur dan komposisi atmosfera: awan, hujan, kestabilan, pencemaran udara dan cara mengukurnya."
  id: "Struktur dan komposisi atmosfer: awan, hujan, stabilitas, polusi udara, dan cara mengukurnya."
  hi: "वायुमंडल की बनावट और संरचना: बादल, वर्षा, स्थिरता, वायु प्रदूषण और उनका मापन।"
outcomes:
  - en: "Explain clouds, rain and air pollution"
    zh: "解释云、降水和空气污染"
    zh-TW: "解釋雲、降水與空氣污染"
    ja: "雲・降水・大気汚染を説明する"
    ko: "구름·강수·대기오염 설명하기"
    vi: "Giải thích mây, mưa và ô nhiễm không khí"
    ms: "Terangkan awan, hujan dan pencemaran udara"
    id: "Menjelaskan awan, hujan, dan polusi udara"
    hi: "बादल, वर्षा और वायु प्रदूषण समझाएँ"
  - en: "Measure the atmosphere with field instruments"
    zh: "用仪器观测大气"
    zh-TW: "用儀器觀測大氣"
    ja: "観測機器で大気を測る"
    ko: "관측 장비로 대기 측정하기"
    vi: "Đo khí quyển bằng thiết bị thực địa"
    ms: "Ukur atmosfera dengan alat lapangan"
    id: "Mengukur atmosfer dengan alat lapangan"
    hi: "फ़ील्ड उपकरणों से वायुमंडल मापें"
  - en: "Write code to analyse real atmospheric data"
    zh: "编程分析真实大气数据"
    zh-TW: "寫程式分析真實大氣數據"
    ja: "実際の大気データを解析するコードを書く"
    ko: "실제 대기 데이터 분석 코드 작성하기"
    vi: "Viết code phân tích dữ liệu khí quyển thực"
    ms: "Tulis kod analisis data atmosfera sebenar"
    id: "Menulis kode untuk analisis data atmosfer nyata"
    hi: "असली वायुमंडलीय डेटा के लिए कोड लिखें"
