code: MUSI30261
year: 2026
learn:
  en: "A second semester of the Renaissance voices-and-instruments ensemble, with new repertoire and performances."
  zh: "文艺复兴人声与器乐合奏第二学期，新曲目与新演出。"
  zh-TW: "文藝復興人聲與器樂合奏第二學期，新曲目與新演出。"
  ja: "ルネサンス混成アンサンブルの後期。新曲目と公演。"
  ko: "르네상스 성악·기악 앙상블 2학기. 새 레퍼토리와 공연."
  vi: "Học kỳ hai nhóm Phục hưng hát và nhạc cụ, tiết mục và buổi diễn mới."
  ms: "Semester kedua ensembel Renaissance, repertoir dan persembahan baharu."
  id: "Semester kedua ansambel Renaisans, repertoar dan pentas baru."
  hi: "पुनर्जागरण समूह का दूसरा सत्र, नई रचनाएँ और प्रस्तुतियाँ।"
outcomes:
  - en: "Grow confidence on historical instruments or voice"
    zh: "在历史乐器或声乐上更有信心"
    zh-TW: "在歷史樂器或聲樂上更有信心"
    ja: "歴史的楽器や声に自信をつける"
    ko: "역사적 악기나 노래에 자신감 키우기"
    vi: "Tự tin hơn với nhạc cụ cổ hoặc giọng hát"
    ms: "Lebih yakin dengan alat bersejarah atau vokal"
    id: "Makin percaya diri dengan alat historis atau vokal"
    hi: "ऐतिहासिक वाद्य या आवाज़ पर आत्मविश्वास बढ़ाना"
  - en: "Learn new Renaissance repertoire"
    zh: "学习新的文艺复兴曲目"
    zh-TW: "學習新的文藝復興曲目"
    ja: "新しいルネサンス曲を学ぶ"
    ko: "새 르네상스 레퍼토리 익히기"
    vi: "Học tiết mục Phục hưng mới"
    ms: "Pelajari repertoir Renaissance baharu"
    id: "Mempelajari repertoar Renaisans baru"
    hi: "नई पुनर्जागरण रचनाएँ सीखना"
  - en: "Perform as part of a mixed early ensemble"
    zh: "作为混合古乐团成员演出"
    zh-TW: "作為混合古樂團成員演出"
    ja: "混成古楽アンサンブルの一員として演奏する"
    ko: "혼성 고음악 앙상블로 공연하기"
    vi: "Biểu diễn trong nhóm nhạc cổ hỗn hợp"
    ms: "Persembahan dalam ensembel muzik awal"
    id: "Tampil dalam ansambel musik awal campuran"
    hi: "मिश्रित प्रारंभिक संगीत समूह में प्रस्तुति"
