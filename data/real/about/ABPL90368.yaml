  vi: "Kiến trúc và truyền thông cho di sản số: quét thực địa, AI tạo sinh và game engine."
  ms: "Seni bina dan media untuk warisan digital: imbasan lapangan, AI generatif dan enjin permainan."
  id: "Arsitektur dan media untuk warisan digital: pemindaian lapangan, AI generatif, dan game engine."
  hi: "डिजिटल विरासत के लिए वास्तुकला और मीडिया: स्कैनिंग फ़ील्डवर्क, जनरेटिव AI और गेम इंजन।"
