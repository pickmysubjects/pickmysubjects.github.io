code: JAPN30011
year: 2026
learn:
  en: "Reading real Japanese literary texts, from short stories to essays, in the original."
  zh: "阅读日语原版文学作品，从短篇小说到散文。"
  zh-TW: "閱讀日語原版文學作品，從短篇小說到散文。"
  ja: "短編小説から随筆まで、日本語の文学作品を原文で読む。"
  ko: "단편소설부터 수필까지 일본어 문학 작품을 원문으로 읽는다."
  vi: "Đọc nguyên bản các tác phẩm văn học Nhật, từ truyện ngắn đến tùy bút."
  ms: "Membaca teks sastera Jepun asli, daripada cerpen hingga esei."
  id: "Membaca teks sastra Jepang asli, dari cerpen hingga esai."
  hi: "मूल जापानी साहित्यिक पाठ पढ़ना, कहानियों से लेकर निबंधों तक।"
outcomes:
  - en: "Read Japanese literary texts in the original"
    zh: "阅读日语文学原文"
    zh-TW: "閱讀日語文學原文"
    ja: "日本語の文学作品を原文で読む"
    ko: "일본어 문학 작품 원문으로 읽기"
    vi: "Đọc nguyên bản văn học tiếng Nhật"
    ms: "Baca teks sastera Jepun dalam bahasa asal"
    id: "Membaca teks sastra Jepang dalam bahasa aslinya"
    hi: "जापानी साहित्य मूल भाषा में पढ़ना"
  - en: "Discuss style, theme and context"
    zh: "讨论文体、主题和背景"
    zh-TW: "討論文體、主題和背景"
    ja: "文体・テーマ・背景について論じる"
    ko: "문체·주제·맥락 논의하기"
    vi: "Thảo luận văn phong, chủ đề và bối cảnh"
    ms: "Bincangkan gaya, tema dan konteks"
    id: "Membahas gaya, tema dan konteks"
    hi: "शैली, विषय और संदर्भ पर चर्चा करना"
  - en: "Translate short literary passages"
    zh: "翻译简短的文学段落"
    zh-TW: "翻譯簡短的文學段落"
    ja: "短い文学の一節を翻訳する"
    ko: "짧은 문학 구절 번역하기"
    vi: "Dịch các đoạn văn học ngắn"
    ms: "Terjemah petikan sastera pendek"
    id: "Menerjemahkan penggalan sastra pendek"
    hi: "छोटे साहित्यिक अंशों का अनुवाद करना"
