code: MUSI20219
year: 2026
learn:
  en: "Popular music from Africa, the Americas, the Middle East, Asia and Eastern Europe, and what it means locally. Not offered in 2026."
  zh: "非洲、美洲、中东、亚洲与东欧的流行音乐及其本地意义。2026年不开。"
  zh-TW: "非洲、美洲、中東、亞洲與東歐的流行音樂及其在地意義。2026年不開。"
  ja: "アフリカ・南北米・中東・アジア・東欧のポピュラー音楽と地域での意味。2026年休講。"
  ko: "아프리카·미주·중동·아시아·동유럽 대중음악과 지역적 의미. 2026년 미개설."
  vi: "Nhạc pop châu Phi, châu Mỹ, Trung Đông, châu Á, Đông Âu và ý nghĩa địa phương. Không mở 2026."
  ms: "Muzik pop Afrika, Amerika, Timur Tengah, Asia dan Eropah Timur serta maknanya. Tiada pada 2026."
  id: "Musik pop Afrika, Amerika, Timur Tengah, Asia, Eropa Timur dan maknanya. Tidak dibuka 2026."
  hi: "अफ़्रीका, अमेरिका, मध्य-पूर्व, एशिया, पूर्वी यूरोप का पॉप संगीत और उसके अर्थ। 2026 में नहीं।"
outcomes:
  - en: "Identify global pop styles by ear"
    zh: "听辨世界各地的流行风格"
    zh-TW: "聽辨世界各地的流行風格"
    ja: "世界のポップ様式を聴き分ける"
    ko: "세계 팝 스타일 듣고 구별하기"
    vi: "Nhận ra phong cách pop toàn cầu qua tai"
    ms: "Kenal pasti gaya pop global melalui pendengaran"
    id: "Mengenali gaya pop dunia lewat pendengaran"
    hi: "दुनिया की पॉप शैलियाँ सुनकर पहचानना"
  - en: "Read research critically and respond in writing"
    zh: "批判性阅读研究并书面回应"
    zh-TW: "批判性閱讀研究並書面回應"
    ja: "研究文献を批判的に読み、文章で応える"
    ko: "연구를 비판적으로 읽고 글로 답하기"
    vi: "Đọc nghiên cứu có phản biện và viết phản hồi"
    ms: "Baca kajian secara kritis dan balas secara bertulis"
    id: "Membaca riset secara kritis dan menanggapinya tertulis"
    hi: "शोध को आलोचनात्मक रूप से पढ़कर लिखित जवाब देना"
  - en: "Plan and write a research essay on music"
    zh: "规划并撰写一篇音乐研究论文"
    zh-TW: "規劃並撰寫一篇音樂研究論文"
    ja: "音楽に関する研究エッセイを計画し書く"
    ko: "음악에 관한 연구 에세이 기획·작성하기"
    vi: "Lên kế hoạch và viết bài luận nghiên cứu về âm nhạc"
    ms: "Rancang dan tulis esei kajian tentang muzik"
    id: "Merancang dan menulis esai riset tentang musik"
    hi: "संगीत पर शोध निबंध की योजना बनाकर लिखना"
