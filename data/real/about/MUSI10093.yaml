code: MUSI10093
year: 2026
learn:
  en: "Sing in a small vocal group, working on tuning, breath and diction through chamber and opera ensemble pieces."
  zh: "在小型声乐团体中演唱，通过室内乐和歌剧重唱练习音准、呼吸和咬字。"
  zh-TW: "在小型聲樂團體中演唱，透過室內樂與歌劇重唱練習音準、呼吸與咬字。"
  ja: "少人数の声楽アンサンブルで、室内楽やオペラの重唱を通して音程・呼吸・発音を磨く。"
  ko: "소규모 성악 앙상블에서 실내악과 오페라 중창으로 음정·호흡·발음을 다듬기."
  vi: "Hát trong nhóm thanh nhạc nhỏ, rèn cao độ, hơi thở và phát âm qua nhạc thính phòng và opera."
  ms: "Nyanyi dalam kumpulan vokal kecil, latih nada, nafas dan sebutan melalui karya kamar dan opera."
  id: "Bernyanyi dalam grup vokal kecil, melatih nada, napas, dan pelafalan lewat karya kamar dan opera."
  hi: "छोटे वोकल समूह में गाना; चैंबर और ओपेरा रचनाओं से सुर, साँस और उच्चारण सुधारना।"
outcomes:
  - en: "Sing in tune as part of a group"
    zh: "在团体中准确地唱准音"
    zh-TW: "在團體中準確唱準音"
    ja: "グループの中で正確な音程で歌う"
    ko: "그룹 안에서 정확한 음정으로 노래하기"
    vi: "Hát đúng cao độ trong nhóm"
    ms: "Nyanyi tepat nada dalam kumpulan"
    id: "Bernyanyi tepat nada dalam grup"
    hi: "समूह में सही सुर में गाना"
  - en: "Prepare ensemble repertoire to concert level"
    zh: "把重唱曲目准备到音乐会水平"
    zh-TW: "把重唱曲目準備到音樂會水準"
    ja: "重唱曲を演奏会レベルまで仕上げる"
    ko: "앙상블 곡을 연주회 수준으로 준비하기"
    vi: "Chuẩn bị tiết mục đến mức hòa nhạc"
    ms: "Sediakan repertoir ke tahap konsert"
    id: "Menyiapkan repertoar ke level konser"
    hi: "रचनाओं को कॉन्सर्ट स्तर तक तैयार करना"
  - en: "Plan and run rehearsals as a team"
    zh: "以团队方式安排和进行排练"
    zh-TW: "以團隊方式安排與進行排練"
    ja: "チームでリハーサルを計画・進行する"
    ko: "팀으로 리허설을 계획하고 진행하기"
    vi: "Lên kế hoạch và tập luyện theo nhóm"
    ms: "Rancang dan jalankan latihan berpasukan"
    id: "Merencanakan dan menjalankan latihan bersama"
    hi: "टीम के रूप में रिहर्सल की योजना बनाना"
