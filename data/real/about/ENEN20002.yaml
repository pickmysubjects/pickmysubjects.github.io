code: ENEN20002
year: 2026
learn:
  en: "Climate, water, rocks and soils, and what they mean for engineering, with simple models and soil testing."
  zh: "气候、水、岩石和土壤及其对工程的意义，含简单建模与土壤测试。"
  zh-TW: "氣候、水、岩石與土壤及其對工程的意義，含簡單建模與土壤試驗。"
  ja: "気候・水・岩石・土壌と工学との関わりを、簡単なモデルと土質試験で学ぶ。"
  ko: "기후·물·암석·토양과 그 공학적 의미를 간단한 모델과 토질 시험으로."
  vi: "Khí hậu, nước, đá và đất cùng ý nghĩa với kỹ thuật, có mô hình đơn giản và thử nghiệm đất."
  ms: "Iklim, air, batuan dan tanah serta maknanya bagi kejuruteraan, dengan model ringkas dan ujian tanah."
  id: "Iklim, air, batuan, dan tanah serta artinya bagi teknik, dengan model sederhana dan uji tanah."
  hi: "जलवायु, पानी, चट्टानें और मिट्टी, और इंजीनियरिंग के लिए उनका मतलब, सरल मॉडल व मिट्टी परीक्षण के साथ।"
outcomes:
  - en: "Analyse water and energy in catchments"
    zh: "分析流域中的水与能量"
    zh-TW: "分析集水區的水與能量"
    ja: "流域の水とエネルギーを解析する"
    ko: "유역의 물과 에너지 분석하기"
    vi: "Phân tích nước và năng lượng trong lưu vực"
    ms: "Menganalisis air dan tenaga dalam tadahan"
    id: "Menganalisis air dan energi di daerah aliran"
    hi: "जलग्रहण क्षेत्र में पानी और ऊर्जा का विश्लेषण करना"
  - en: "Classify soils and rocks by their properties"
    zh: "按性质对土壤和岩石分类"
    zh-TW: "依性質為土壤與岩石分類"
    ja: "性質から土と岩を分類する"
    ko: "성질로 토양과 암석 분류하기"
    vi: "Phân loại đất và đá theo tính chất"
    ms: "Mengelaskan tanah dan batuan ikut sifat"
    id: "Mengklasifikasi tanah dan batuan menurut sifatnya"
    hi: "गुणों के आधार पर मिट्टी और चट्टान वर्गीकृत करना"
  - en: "Use compaction to stabilise soil"
    zh: "用压实方法加固土壤"
    zh-TW: "用夯實方法穩定土壤"
    ja: "締固めで土を安定させる"
    ko: "다짐으로 토양 안정화하기"
    vi: "Dùng đầm nén để ổn định đất"
    ms: "Menggunakan pemadatan untuk menstabilkan tanah"
    id: "Memakai pemadatan untuk menstabilkan tanah"
    hi: "कम्पैक्शन से मिट्टी को स्थिर करना"
