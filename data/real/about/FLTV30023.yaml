code: FLTV30023
year: 2026
learn:
  en: "Develop an original animation to production-ready stage: research, screenplay, character and world design, storyboard and animatic."
  zh: "把原创动画开发到可开拍阶段：研究、剧本、角色与世界设计、分镜和动态分镜。"
  zh-TW: "把原創動畫開發到可開拍階段：研究、劇本、角色與世界設計、分鏡和動態分鏡。"
  ja: "オリジナルアニメを制作直前まで開発：調査、脚本、キャラと世界、絵コンテ、アニマティック。"
  ko: "오리지널 애니메이션을 제작 직전까지 개발: 조사, 각본, 캐릭터·세계, 스토리보드, 애니매틱."
  vi: "Phát triển hoạt hình gốc tới mức sẵn sàng sản xuất: nghiên cứu, kịch bản, thiết kế, phân cảnh, animatic."
  ms: "Bangunkan animasi asli hingga sedia diterbit: kajian, skrip, reka watak dan dunia, papan cerita, animatik."
  id: "Mengembangkan animasi orisinal sampai siap produksi: riset, naskah, desain tokoh, storyboard, animatik."
  hi: "मौलिक एनिमेशन को प्रोडक्शन-तैयार बनाना: शोध, पटकथा, किरदार व दुनिया डिज़ाइन, स्टोरीबोर्ड और एनिमैटिक।"
outcomes:
  - en: "Build a pre-production folio"
    zh: "制作前期开发作品集"
    zh-TW: "製作前期開發作品集"
    ja: "プリプロダクションの作品集を作る"
    ko: "프리프로덕션 포트폴리오 만들기"
    vi: "Làm hồ sơ tiền kỳ"
    ms: "Bina folio praproduksi"
    id: "Menyusun folio praproduksi"
    hi: "प्री-प्रोडक्शन फ़ोलियो बनाना"
  - en: "Write a short film screenplay for animation"
    zh: "写一部动画短片剧本"
    zh-TW: "寫一部動畫短片劇本"
    ja: "短編アニメの脚本を書く"
    ko: "애니메이션 단편 각본 쓰기"
    vi: "Viết kịch bản phim hoạt hình ngắn"
    ms: "Tulis lakon layar animasi pendek"
    id: "Menulis skenario film animasi pendek"
    hi: "एनिमेशन के लिए छोटी फ़िल्म पटकथा लिखना"
  - en: "Make an animatic to a professional standard"
    zh: "制作专业水准的动态分镜"
    zh-TW: "製作專業水準的動態分鏡"
    ja: "プロ水準のアニマティックを作る"
    ko: "전문 수준의 애니매틱 만들기"
    vi: "Làm animatic đạt chuẩn chuyên nghiệp"
    ms: "Hasilkan animatik standard profesional"
    id: "Membuat animatik berstandar profesional"
    hi: "पेशेवर स्तर का एनिमैटिक बनाना"
