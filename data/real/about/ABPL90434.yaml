code: ABPL90434
year: 2027
learn:
  en: "A 160-hour internship with a construction organisation plus a research project on a real problem at the workplace."
  zh: "在建筑相关机构实习 160 小时，并就实际问题做研究项目。"
  zh-TW: "在營建相關機構實習 160 小時，並就實際問題做研究專案。"
  ja: "建設関連組織で160時間のインターンと、職場の課題についての研究。"
  ko: "건설 관련 기관에서 160시간 인턴십과 현장 문제 연구 프로젝트."
  vi: "Thực tập 160 giờ tại tổ chức xây dựng và dự án nghiên cứu vấn đề thực tế."
  ms: "Latihan industri 160 jam di organisasi pembinaan serta projek penyelidikan masalah sebenar."
  id: "Magang 160 jam di organisasi konstruksi dan proyek riset atas masalah nyata."
  hi: "किसी निर्माण संगठन में 160 घंटे की इंटर्नशिप और असली समस्या पर शोध परियोजना।"
outcomes:
  - en: "Investigate a real problem in a host organisation"
    zh: "研究实习单位中的实际问题"
    zh-TW: "研究實習單位中的實際問題"
    ja: "受け入れ先の実際の課題を調べる"
    ko: "인턴 기관의 실제 문제 조사하기"
    vi: "Nghiên cứu vấn đề thực tế tại nơi thực tập"
    ms: "Menyiasat masalah sebenar di organisasi tuan rumah"
    id: "Meneliti masalah nyata di organisasi tempat magang"
    hi: "मेज़बान संगठन की असली समस्या की जाँच"
  - en: "Reflect on your own professional growth"
    zh: "反思自己的职业成长"
    zh-TW: "反思自己的職涯成長"
    ja: "自分の職業的な成長を振り返る"
    ko: "자신의 직업적 성장 성찰하기"
    vi: "Tự đánh giá sự phát triển nghề nghiệp"
    ms: "Merenung perkembangan profesional sendiri"
    id: "Merefleksikan perkembangan profesional diri"
    hi: "अपने पेशेवर विकास पर चिंतन"
