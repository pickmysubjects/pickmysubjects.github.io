code: MKTG90005
year: 2027
learn:
  en: "Capstone on preparing, carrying out and adjusting marketing strategies and plans using market information."
  zh: "综合课：利用市场信息制定、执行和调整营销战略与计划。"
  zh-TW: "綜合課：利用市場資訊制定、執行和調整行銷策略與計畫。"
  ja: "市場情報を使ってマーケティング戦略と計画を立て、実行し、修正する総まとめ科目。"
  ko: "시장 정보를 활용해 마케팅 전략과 계획을 세우고 실행·조정하는 캡스톤 과목."
  vi: "Môn tổng hợp về xây dựng, triển khai và điều chỉnh chiến lược, kế hoạch marketing từ thông tin thị trường."
  ms: "Subjek akhir tentang menyediakan, melaksana dan menyesuaikan strategi serta pelan pemasaran."
  id: "Mata kuliah capstone tentang menyusun, menjalankan, dan menyesuaikan strategi serta rencana pemasaran."
  hi: "बाज़ार जानकारी से मार्केटिंग रणनीति व योजना बनाने, लागू करने और बदलने पर कैपस्टोन विषय।"
outcomes:
  - en: "Apply marketing concepts to build strategies and plans"
    zh: "运用营销概念制定战略与计划"
    zh-TW: "運用行銷概念制定策略與計畫"
    ja: "マーケティング概念で戦略と計画を立てる"
    ko: "마케팅 개념으로 전략과 계획 세우기"
    vi: "Áp dụng khái niệm marketing để lập chiến lược và kế hoạch"
    ms: "Guna konsep pemasaran untuk membina strategi dan pelan"
    id: "Menerapkan konsep pemasaran untuk menyusun strategi"
    hi: "मार्केटिंग अवधारणाओं से रणनीति व योजना बनाना"
  - en: "Use market information to evaluate strategies"
    zh: "用市场信息评估营销战略"
    zh-TW: "用市場資訊評估行銷策略"
    ja: "市場情報で戦略を評価する"
    ko: "시장 정보로 전략 평가하기"
    vi: "Dùng thông tin thị trường để đánh giá chiến lược"
    ms: "Guna maklumat pasaran untuk menilai strategi"
    id: "Memakai informasi pasar untuk menilai strategi"
    hi: "बाज़ार जानकारी से रणनीतियों का आकलन"
