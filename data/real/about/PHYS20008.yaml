code: PHYS20008
year: 2026
learn:
  en: "How the body's systems work and are controlled: nerves, heart, muscles, lungs, kidneys and gut."
  zh: "身体各系统怎么运作和调节：神经、心脏、肌肉、肺、肾和消化。"
  zh-TW: "身體各系統怎麼運作和調節：神經、心臟、肌肉、肺、腎和消化。"
  ja: "体の各システムの働きと調節：神経、心臓、筋肉、肺、腎臓、消化管。"
  ko: "신체 각 계통의 작동과 조절: 신경, 심장, 근육, 폐, 신장, 소화관."
  vi: "Các hệ cơ quan hoạt động và được điều hòa ra sao: thần kinh, tim, cơ, phổi, thận, tiêu hóa."
  ms: "Cara sistem badan berfungsi dan dikawal: saraf, jantung, otot, paru-paru, buah pinggang dan usus."
  id: "Cara sistem tubuh bekerja dan diatur: saraf, jantung, otot, paru, ginjal, dan pencernaan."
  hi: "शरीर के सिस्टम कैसे काम करते और नियंत्रित होते हैं: नसें, दिल, मांसपेशियाँ, फेफड़े, किडनी, पाचन।"
outcomes:
  - en: "Explain how body systems work together"
    zh: "解释身体各系统怎么配合"
    zh-TW: "解釋身體各系統怎麼配合"
    ja: "体の各システムがどう連携するか説明する"
    ko: "신체 계통이 어떻게 함께 작동하는지 설명"
    vi: "Giải thích các hệ cơ quan phối hợp ra sao"
    ms: "Terangkan cara sistem badan bekerjasama"
    id: "Menjelaskan cara sistem tubuh bekerja sama"
    hi: "शरीर के सिस्टम मिलकर कैसे काम करते हैं, समझाना"
  - en: "Apply physiology to new scenarios"
    zh: "把生理知识用到新情境"
    zh-TW: "把生理知識用到新情境"
    ja: "生理学を新しい場面に応用する"
    ko: "생리학을 새로운 상황에 적용"
    vi: "Áp dụng sinh lý học vào tình huống mới"
    ms: "Gunakan fisiologi pada senario baharu"
    id: "Menerapkan fisiologi pada situasi baru"
    hi: "फ़िज़ियोलॉजी को नई स्थितियों पर लागू करना"
  - en: "Explain physiology clearly to others"
    zh: "把生理知识讲给别人听"
    zh-TW: "把生理知識清楚講給別人聽"
    ja: "生理学を人にわかりやすく説明する"
    ko: "생리학을 다른 사람에게 명확히 설명"
    vi: "Giải thích sinh lý học rõ ràng cho người khác"
    ms: "Terangkan fisiologi dengan jelas kepada orang lain"
    id: "Menjelaskan fisiologi dengan jelas ke orang lain"
    hi: "दूसरों को फ़िज़ियोलॉजी साफ़ समझाना"
