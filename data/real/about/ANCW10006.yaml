code: ANCW10006
year: 2026
learn:
  en: "A beginners' course in ancient Egyptian: the hieroglyphic script, basic grammar and reading simple texts."
  zh: "古埃及语初级课程：象形文字、基础语法和简单文本阅读。"
  zh-TW: "古埃及語初級課程：象形文字、基礎語法和簡單文本閱讀。"
  ja: "古代エジプト語の初級。ヒエログリフ、基本文法、簡単な文章の読解を学ぶ。"
  ko: "고대 이집트어 초급: 상형문자, 기초 문법, 간단한 글 읽기를 배운다."
  vi: "Khóa nhập môn tiếng Ai Cập cổ: chữ tượng hình, ngữ pháp cơ bản và đọc văn bản đơn giản."
  ms: "Kursus permulaan bahasa Mesir kuno: tulisan hieroglif, tatabahasa asas dan membaca teks mudah."
  id: "Kursus pemula bahasa Mesir kuno: aksara hieroglif, tata bahasa dasar, dan membaca teks sederhana."
  hi: "प्राचीन मिस्री भाषा का शुरुआती कोर्स: चित्रलिपि, बुनियादी व्याकरण और सरल पाठ पढ़ना।"
outcomes:
  - en: "Read and write basic hieroglyphs"
    zh: "读写基础象形文字"
    zh-TW: "讀寫基礎象形文字"
    ja: "基本的なヒエログリフを読み書きする"
    ko: "기초 상형문자 읽고 쓰기"
    vi: "Đọc và viết chữ tượng hình cơ bản"
    ms: "Baca dan tulis hieroglif asas"
    id: "Membaca dan menulis hieroglif dasar"
    hi: "बुनियादी चित्रलिपि पढ़ना और लिखना"
  - en: "Use basic Egyptian grammar"
    zh: "运用基础古埃及语语法"
    zh-TW: "運用基礎古埃及語語法"
    ja: "基本的なエジプト語文法を使う"
    ko: "기초 이집트어 문법 사용하기"
    vi: "Sử dụng ngữ pháp tiếng Ai Cập cơ bản"
    ms: "Gunakan tatabahasa asas bahasa Mesir"
    id: "Memakai tata bahasa Mesir dasar"
    hi: "बुनियादी मिस्री व्याकरण का उपयोग करना"
  - en: "Translate simple hieroglyphic texts"
    zh: "翻译简单的象形文字文本"
    zh-TW: "翻譯簡單的象形文字文本"
    ja: "簡単なヒエログリフの文を訳す"
    ko: "간단한 상형문자 글 번역하기"
    vi: "Dịch các văn bản tượng hình đơn giản"
    ms: "Terjemah teks hieroglif mudah"
    id: "Menerjemahkan teks hieroglif sederhana"
    hi: "सरल चित्रलिपि पाठों का अनुवाद करना"
