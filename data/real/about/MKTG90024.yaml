code: MKTG90024
year: 2027
learn:
  en: "Key theories in marketing strategy, plus reviewing manuscripts and writing a conceptual research paper."
  zh: "营销战略的核心理论，以及审稿和撰写概念性研究论文。"
  zh-TW: "行銷策略的核心理論，以及審稿和撰寫概念性研究論文。"
  ja: "マーケティング戦略の主要理論に加え、論文の査読と概念研究論文の執筆。"
  ko: "마케팅 전략의 핵심 이론과 원고 심사, 개념적 연구 논문 작성."
  vi: "Các lý thuyết chính về chiến lược marketing, cùng phản biện bản thảo và viết bài nghiên cứu khái niệm."
  ms: "Teori utama strategi pemasaran, serta menilai manuskrip dan menulis kertas penyelidikan konseptual."
  id: "Teori utama strategi pemasaran, serta menelaah naskah dan menulis makalah riset konseptual."
  hi: "मार्केटिंग रणनीति के मुख्य सिद्धांत, पांडुलिपि समीक्षा और वैचारिक शोध पत्र लेखन।"
outcomes:
  - en: "Critically analyse theories and issues in marketing"
    zh: "批判地分析营销理论与问题"
    zh-TW: "批判地分析行銷理論與問題"
    ja: "マーケティングの理論と課題を批判的に分析する"
    ko: "마케팅 이론과 쟁점 비판적으로 분석하기"
    vi: "Phân tích phản biện lý thuyết và vấn đề marketing"
    ms: "Menganalisis teori dan isu pemasaran secara kritis"
    id: "Menganalisis teori dan isu pemasaran secara kritis"
    hi: "मार्केटिंग सिद्धांतों और मुद्दों का आलोचनात्मक विश्लेषण"
  - en: "Write a rigorous manuscript review"
    zh: "撰写严谨的论文审稿意见"
    zh-TW: "撰寫嚴謹的論文審稿意見"
    ja: "厳密な論文査読を書く"
    ko: "엄밀한 원고 심사평 작성하기"
    vi: "Viết bản phản biện bản thảo chặt chẽ"
    ms: "Menulis ulasan manuskrip yang teliti"
    id: "Menulis telaah naskah yang cermat"
    hi: "सटीक पांडुलिपि समीक्षा लिखना"
