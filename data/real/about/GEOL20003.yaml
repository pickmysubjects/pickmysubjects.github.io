code: GEOL20003
year: 2026
learn:
  en: "How igneous, metamorphic and sedimentary rocks form, and how to identify them in the lab and the field."
  zh: "火成岩、变质岩和沉积岩如何形成，以及如何在实验室和野外鉴定。"
  zh-TW: "火成岩、變質岩與沉積岩如何形成，以及如何在實驗室與野外鑑定。"
  ja: "火成岩・変成岩・堆積岩のでき方と、実験室や野外での見分け方。"
  ko: "화성암·변성암·퇴적암의 형성과 실험실·현장에서의 식별법."
  vi: "Đá magma, biến chất và trầm tích hình thành ra sao, và cách nhận biết trong lab và thực địa."
  ms: "Cara batuan igneus, metamorf dan sedimen terbentuk, dan cara kenal pasti di makmal dan lapangan."
  id: "Cara batuan beku, metamorf, dan sedimen terbentuk, serta cara mengenalinya di lab dan lapangan."
  hi: "आग्नेय, कायांतरित और अवसादी चट्टानें कैसे बनती हैं, और लैब व फ़ील्ड में उन्हें कैसे पहचानें।"
outcomes:
  - en: "Classify rocks in hand specimen and thin section"
    zh: "在手标本和薄片中分类岩石"
    zh-TW: "在手標本與薄片中分類岩石"
    ja: "手標本と薄片で岩石を分類する"
    ko: "손표본과 박편으로 암석 분류하기"
    vi: "Phân loại đá qua mẫu cầm tay và lát mỏng"
    ms: "Kelaskan batuan dalam spesimen dan keratan nipis"
    id: "Mengklasifikasi batuan di spesimen dan sayatan tipis"
    hi: "हाथ के नमूने और थिन सेक्शन में चट्टान वर्गीकृत करना"
  - en: "Infer how rocks formed from minerals and texture"
    zh: "根据矿物和结构推断成岩条件"
    zh-TW: "根據礦物與組構推斷成岩條件"
    ja: "鉱物と組織から岩石の形成条件を推定する"
    ko: "광물과 조직으로 형성 조건 추론하기"
    vi: "Suy ra điều kiện hình thành đá từ khoáng vật"
    ms: "Simpulkan pembentukan batuan dari mineral dan tekstur"
    id: "Menyimpulkan pembentukan batuan dari mineral dan tekstur"
    hi: "खनिज और बनावट से चट्टान बनने की स्थिति बताना"
  - en: "Read a rock's history from field observations"
    zh: "通过野外观察解读岩石的历史"
    zh-TW: "透過野外觀察解讀岩石的歷史"
    ja: "野外観察から岩石の歴史を読み取る"
    ko: "현장 관찰로 암석의 역사 읽어내기"
    vi: "Đọc lịch sử của đá từ quan sát thực địa"
    ms: "Baca sejarah batuan daripada pemerhatian lapangan"
    id: "Membaca sejarah batuan dari pengamatan lapangan"
    hi: "फ़ील्ड ऑब्ज़र्वेशन से किसी चट्टान का इतिहास पढ़ना"
