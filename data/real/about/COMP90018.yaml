code: COMP90018
year: 2027
learn:
  en: "Building mobile phone apps that use the device's sensors, interaction methods and awareness of context."
  zh: "开发利用手机传感器、交互方式和情境感知的移动应用。"
  zh-TW: "開發運用手機感測器、互動方式與情境感知的行動 App。"
  ja: "端末のセンサーや操作方法、状況認識を活かしたスマホアプリを作る。"
  ko: "휴대폰 센서·상호작용·상황 인식을 활용한 모바일 앱 개발."
  vi: "Xây ứng dụng điện thoại dùng cảm biến, cách tương tác và nhận biết ngữ cảnh."
  ms: "Membina aplikasi telefon yang guna sensor, interaksi dan kesedaran konteks peranti."
  id: "Membangun aplikasi ponsel yang memakai sensor, interaksi, dan kesadaran konteks."
  hi: "फ़ोन के सेंसर, इंटरैक्शन और संदर्भ-जागरूकता का उपयोग करने वाले मोबाइल ऐप बनाना।"
outcomes:
  - en: "Design and build a sensor-aware mobile app"
    zh: "设计并开发感知型移动应用"
    zh-TW: "設計並開發感知型行動 App"
    ja: "センサーを使うモバイルアプリを設計・開発する"
    ko: "센서 활용 모바일 앱 설계·개발하기"
    vi: "Thiết kế và xây ứng dụng di động dùng cảm biến"
    ms: "Reka dan bina aplikasi mudah alih berasaskan sensor"
    id: "Merancang dan membuat aplikasi seluler berbasis sensor"
    hi: "सेंसर-आधारित मोबाइल ऐप डिज़ाइन करना और बनाना"
  - en: "Explain challenges specific to mobile computing"
    zh: "说明移动计算特有的挑战"
    zh-TW: "說明行動運算特有的挑戰"
    ja: "モバイル特有の課題を説明する"
    ko: "모바일 컴퓨팅 고유 과제 설명하기"
    vi: "Giải thích thách thức riêng của tính toán di động"
    ms: "Terangkan cabaran khusus pengkomputeran mudah alih"
    id: "Menjelaskan tantangan khas komputasi seluler"
    hi: "मोबाइल कंप्यूटिंग की खास चुनौतियाँ समझाना"
