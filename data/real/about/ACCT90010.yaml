code: ACCT90010
year: 2027
learn:
  en: "Using management accounting for goals, budgets, performance measures, incentives and control systems."
  zh: "运用管理会计制定目标、预算、绩效指标、激励和控制系统。"
  zh-TW: "運用管理會計制定目標、預算、績效指標、激勵與控制系統。"
  ja: "目標設定・予算・業績評価・インセンティブ・管理統制に管理会計を活用する。"
  ko: "목표 설정, 예산, 성과 측정, 인센티브, 통제 시스템에 관리회계 활용."
  vi: "Dùng kế toán quản trị cho mục tiêu, ngân sách, đo lường hiệu quả, khen thưởng và hệ thống kiểm soát."
  ms: "Menggunakan perakaunan pengurusan untuk matlamat, belanjawan, ukuran prestasi, insentif dan kawalan."
  id: "Memakai akuntansi manajemen untuk tujuan, anggaran, ukuran kinerja, insentif, dan sistem pengendalian."
  hi: "लक्ष्य, बजट, प्रदर्शन माप, प्रोत्साहन और नियंत्रण प्रणालियों के लिए प्रबंधन लेखा का उपयोग।"
outcomes:
  - en: "Explain how performance measures and controls work"
    zh: "解释绩效衡量和控制系统的作用"
    zh-TW: "解釋績效衡量與控制系統的作用"
    ja: "業績評価と管理統制の役割を説明する"
    ko: "성과 측정과 통제 시스템의 역할 설명하기"
    vi: "Giải thích vai trò của đo lường hiệu quả và kiểm soát"
    ms: "Menerangkan peranan ukuran prestasi dan kawalan"
    id: "Menjelaskan peran ukuran kinerja dan pengendalian"
    hi: "प्रदर्शन माप और नियंत्रण की भूमिका समझाना"
  - en: "Assess how measures and incentives affect behaviour"
    zh: "评估指标和激励对员工行为的影响"
    zh-TW: "評估指標與激勵對員工行為的影響"
    ja: "指標とインセンティブが行動に与える影響を評価する"
    ko: "지표와 인센티브가 행동에 미치는 영향 평가하기"
    vi: "Đánh giá tác động của chỉ số và khen thưởng lên hành vi"
    ms: "Menilai kesan ukuran dan insentif terhadap tingkah laku"
    id: "Menilai dampak ukuran dan insentif pada perilaku"
    hi: "माप और प्रोत्साहन का व्यवहार पर असर आंकना"
