code: CLAS10020
year: 2026
learn:
  en: "For students with some Greek: translating and interpreting a Greek prose work, such as history or philosophy."
  zh: "适合有古希腊语基础的学生：翻译并解读一部希腊散文作品，如史书或哲学。"
  zh-TW: "適合有古希臘語基礎的學生：翻譯並解讀一部希臘散文作品，如史書或哲學。"
  ja: "古代ギリシャ語経験者向け。歴史書や哲学などギリシャの散文作品を訳し、解釈する。"
  ko: "고대 그리스어를 배운 학생용. 역사서나 철학 같은 그리스 산문 작품 번역과 해석."
  vi: "Cho người đã biết tiếng Hy Lạp cổ: dịch và diễn giải một tác phẩm văn xuôi Hy Lạp, như sử hay triết."
  ms: "Untuk yang tahu sedikit Yunani: menterjemah dan mentafsir karya prosa Yunani, seperti sejarah atau falsafah."
  id: "Untuk yang sudah belajar Yunani: menerjemahkan dan menafsirkan karya prosa Yunani, seperti sejarah atau filsafat."
  hi: "थोड़ी यूनानी जानने वालों के लिए: इतिहास या दर्शन जैसी किसी यूनानी गद्य कृति का अनुवाद और व्याख्या।"
outcomes:
  - en: "Read original Ancient Greek texts with some dictionary help"
    zh: "借助词典阅读古希腊语原文"
    zh-TW: "藉助詞典閱讀古希臘語原文"
    ja: "辞書を使って古代ギリシャ語の原典を読む"
    ko: "사전을 활용해 고대 그리스어 원문 읽기"
    vi: "Đọc nguyên bản tiếng Hy Lạp cổ với sự hỗ trợ của từ điển"
    ms: "Baca teks asal bahasa Yunani Kuno dengan bantuan kamus"
    id: "Membaca teks asli bahasa Yunani Kuno dengan bantuan kamus"
    hi: "शब्दकोश की मदद से मूल प्राचीन यूनानी पाठ पढ़ना"
  - en: "Analyse complex Ancient Greek grammar and sentence structure"
    zh: "分析复杂的古希腊语语法和句子结构"
    zh-TW: "分析複雜的古希臘語文法和句子結構"
    ja: "古代ギリシャ語の複雑な文法と構文を分析する"
    ko: "복잡한 고대 그리스어 문법과 문장 구조 분석하기"
    vi: "Phân tích ngữ pháp và cấu trúc câu tiếng Hy Lạp cổ phức tạp"
    ms: "Analisis tatabahasa dan struktur ayat bahasa Yunani Kuno yang kompleks"
    id: "Menganalisis tata bahasa dan struktur kalimat bahasa Yunani Kuno yang rumit"
    hi: "जटिल प्राचीन यूनानी व्याकरण और वाक्य-रचना का विश्लेषण करना"
  - en: "Translate and interpret ancient literature"
    zh: "翻译并解读古代文学作品"
    zh-TW: "翻譯並解讀古代文學作品"
    ja: "古代の文学作品を訳し解釈する"
    ko: "고대 문학 작품 번역하고 해석하기"
    vi: "Dịch và diễn giải văn học cổ đại"
    ms: "Terjemah dan tafsir karya sastera kuno"
    id: "Menerjemahkan dan menafsirkan karya sastra kuno"
    hi: "प्राचीन साहित्य का अनुवाद और व्याख्या करना"
