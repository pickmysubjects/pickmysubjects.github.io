code: FRST30003
year: 2026
learn:
  en: "What makes up city forests, what stresses urban trees, and how to plan and manage greener cities."
  zh: "城市森林的构成、城市树木的压力，以及如何规划管理绿色城市。"
  zh-TW: "都市森林的組成、都市樹木的壓力，以及如何規劃經營綠色城市。"
  ja: "都市林の構成、街の木へのストレス、緑の街の計画と管理。"
  ko: "도시숲의 구성, 도시 나무가 받는 스트레스, 녹색 도시 계획과 관리."
  vi: "Rừng đô thị gồm gì, cây xanh đô thị chịu áp lực gì và cách quy hoạch thành phố xanh."
  ms: "Komposisi hutan bandar, tekanan pada pokok bandar, dan cara rancang bandar lebih hijau."
  id: "Komposisi hutan kota, tekanan pada pohon kota, dan cara merencanakan kota lebih hijau."
  hi: "शहरी वन किससे बनते हैं, शहरी पेड़ों पर दबाव, और हरे शहरों की योजना व प्रबंधन।"
outcomes:
  - en: "Analyse stresses on urban tree health"
    zh: "分析影响城市树木健康的压力"
    zh-TW: "分析影響都市樹木健康的壓力"
    ja: "街路樹の健康へのストレスを分析する"
    ko: "도시 나무 건강의 스트레스 요인 분석하기"
    vi: "Phân tích áp lực lên sức khỏe cây đô thị"
    ms: "Analisis tekanan terhadap kesihatan pokok bandar"
    id: "Menganalisis tekanan pada kesehatan pohon kota"
    hi: "शहरी पेड़ों के स्वास्थ्य पर दबाव विश्लेषित करना"
  - en: "Write an urban forest management plan"
    zh: "撰写城市森林管理计划"
    zh-TW: "撰寫都市森林經營計畫"
    ja: "都市林の管理計画を作成する"
    ko: "도시숲 관리 계획 작성하기"
    vi: "Lập kế hoạch quản lý rừng đô thị"
    ms: "Tulis pelan pengurusan hutan bandar"
    id: "Menyusun rencana pengelolaan hutan kota"
    hi: "शहरी वन प्रबंधन योजना बनाना"
