code: ACCT30002
year: 2026
learn:
  en: "How organisations measure performance, set budgets and use rewards to steer what people do."
  zh: "组织如何衡量绩效、做预算，并用奖励引导员工行为。"
  zh-TW: "組織如何衡量績效、編列預算，並用獎勵引導員工行為。"
  ja: "組織が業績を測り、予算を立て、報酬で人の行動を導く方法。"
  ko: "조직이 성과를 측정하고 예산을 세우며 보상으로 행동을 이끄는 방법."
  vi: "Tổ chức đo lường hiệu quả, lập ngân sách và dùng khen thưởng để định hướng hành vi ra sao."
  ms: "Cara organisasi mengukur prestasi, menyediakan bajet dan guna ganjaran untuk mengarahkan tingkah laku."
  id: "Cara organisasi mengukur kinerja, menyusun anggaran, dan memakai imbalan untuk mengarahkan perilaku."
  hi: "संगठन प्रदर्शन कैसे मापते हैं, बजट कैसे बनाते हैं और इनाम से लोगों का व्यवहार कैसे दिशा देते हैं।"
outcomes:
  - en: "Explain how performance measures shape behaviour"
    zh: "解释绩效指标如何影响行为"
    zh-TW: "解釋績效指標如何影響行為"
    ja: "業績指標が行動にどう影響するか説明する"
    ko: "성과 지표가 행동에 미치는 영향 설명"
    vi: "Giải thích chỉ số hiệu quả ảnh hưởng hành vi thế nào"
    ms: "Terangkan cara ukuran prestasi membentuk tingkah laku"
    id: "Menjelaskan pengaruh ukuran kinerja terhadap perilaku"
    hi: "समझाना कि प्रदर्शन के पैमाने व्यवहार को कैसे बदलते हैं"
  - en: "Review how a business unit is performing"
    zh: "评估一个业务部门的表现"
    zh-TW: "評估一個事業單位的表現"
    ja: "事業部門の業績をレビューする"
    ko: "사업 부문의 성과 검토"
    vi: "Đánh giá hiệu quả của một bộ phận kinh doanh"
    ms: "Semak prestasi sesebuah unit perniagaan"
    id: "Meninjau kinerja suatu unit bisnis"
    hi: "किसी बिज़नेस यूनिट के प्रदर्शन की समीक्षा"
  - en: "Spot weaknesses in traditional performance systems"
    zh: "找出传统绩效体系的问题"
    zh-TW: "找出傳統績效制度的問題"
    ja: "従来の業績評価制度の弱点を見つける"
    ko: "전통적 성과 관리 체계의 약점 파악"
    vi: "Nhận ra điểm yếu của hệ thống đo lường truyền thống"
    ms: "Kenal pasti kelemahan sistem prestasi tradisional"
    id: "Menemukan kelemahan sistem kinerja tradisional"
    hi: "पारंपरिक परफ़ॉर्मेंस सिस्टम की कमियाँ पहचानना"
