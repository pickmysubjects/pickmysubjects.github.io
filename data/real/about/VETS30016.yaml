code: VETS30016
year: 2026
learn:
  en: "The digestive system of domestic animals: how it works, what goes wrong, diagnosis and drug treatment."
  zh: "家畜的消化系统：如何运作、哪里会出问题、诊断和药物治疗。"
  zh-TW: "家畜的消化系統：如何運作、哪裡會出問題、診斷與藥物治療。"
  ja: "家畜の消化器系：働き、異常、診断、薬物治療。"
  ko: "가축의 소화기계: 작동 원리, 이상, 진단, 약물 치료."
  vi: "Hệ tiêu hóa của vật nuôi: cách hoạt động, các rối loạn, chẩn đoán và điều trị bằng thuốc."
  ms: "Sistem pencernaan haiwan peliharaan: cara berfungsi, masalah, diagnosis dan rawatan ubat."
  id: "Sistem pencernaan hewan domestik: cara kerja, gangguan, diagnosis dan pengobatan."
  hi: "पालतू पशुओं का पाचन तंत्र: कैसे काम करता है, क्या बिगड़ता है, निदान और दवा से इलाज।"
outcomes:
  - en: "Tell normal from abnormal gut tissue and images"
    zh: "区分正常与异常的消化组织和影像"
    zh-TW: "區分正常與異常的消化組織與影像"
    ja: "消化器の正常・異常を組織や画像で見分ける"
    ko: "소화기 조직·영상의 정상/이상 구별"
    vi: "Phân biệt mô và hình ảnh tiêu hóa bất thường"
    ms: "Beza tisu dan imej usus normal dan abnormal"
    id: "Membedakan jaringan dan citra cerna normal-abnormal"
    hi: "पाचन ऊतक व इमेज में सामान्य-असामान्य पहचानना"
  - en: "Interpret clinical cases of digestive disease"
    zh: "分析消化系统疾病的临床病例"
    zh-TW: "分析消化系統疾病的臨床病例"
    ja: "消化器疾患の臨床症例を解釈する"
    ko: "소화기 질환 임상 사례 해석"
    vi: "Phân tích ca lâm sàng bệnh tiêu hóa"
    ms: "Tafsir kes klinikal penyakit pencernaan"
    id: "Menafsirkan kasus klinis penyakit cerna"
    hi: "पाचन रोग के क्लिनिकल केस की व्याख्या करना"
