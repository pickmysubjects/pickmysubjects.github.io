code: MUSI10197
year: 2026
learn:
  en: "Jazz and improvisation study: one-on-one lessons and group classes, harmony and rhythm work, and a 20-minute recital."
  zh: "爵士与即兴：一对一课程和小组课，练和声与节奏，最后举行20分钟独奏会。"
  zh-TW: "爵士與即興：一對一課程和小組課，練和聲與節奏，最後舉行20分鐘獨奏會。"
  ja: "ジャズと即興。個人レッスンとグループ授業で和声とリズムを学び、20分のリサイタル。"
  ko: "재즈와 즉흥: 개인 레슨과 그룹 수업으로 화성·리듬을 익히고 20분 리사이틀."
  vi: "Jazz và ứng tấu: học riêng và lớp nhóm, luyện hòa âm, nhịp điệu, kết thúc bằng độc tấu 20 phút."
  ms: "Jaz dan improvisasi: kelas individu dan kumpulan, harmoni dan ritma, serta resital 20 minit."
  id: "Jazz dan improvisasi: les privat dan kelas kelompok, harmoni dan ritme, serta resital 20 menit."
  hi: "जैज़ और इम्प्रोवाइज़ेशन: निजी व समूह कक्षाएँ, हार्मनी-रिदम अभ्यास और 20 मिनट का रिसाइटल।"
outcomes:
  - en: "Play jazz repertoire in a recital"
    zh: "在独奏会上演奏爵士曲目"
    zh-TW: "在獨奏會上演奏爵士曲目"
    ja: "リサイタルでジャズ曲を演奏する"
    ko: "리사이틀에서 재즈 레퍼토리 연주"
    vi: "Biểu diễn tiết mục jazz trong độc tấu"
    ms: "Mainkan repertoir jaz dalam resital"
    id: "Memainkan repertoar jazz dalam resital"
    hi: "रिसाइटल में जैज़ रचनाएँ बजाना"
  - en: "Improvise using harmony and rhythm tools"
    zh: "运用和声与节奏技巧即兴演奏"
    zh-TW: "運用和聲與節奏技巧即興演奏"
    ja: "和声とリズムを使って即興する"
    ko: "화성·리듬 도구로 즉흥 연주"
    vi: "Ứng tấu bằng công cụ hòa âm, nhịp điệu"
    ms: "Berimprovisasi dengan alat harmoni dan ritma"
    id: "Berimprovisasi dengan harmoni dan ritme"
    hi: "हार्मनी व रिदम से इम्प्रोवाइज़ करना"
  - en: "Judge how well your practice routine works"
    zh: "评估自己的练习方法是否有效"
    zh-TW: "評估自己的練習方法是否有效"
    ja: "自分の練習法の効果を見極める"
    ko: "자신의 연습 방식 효과 판단하기"
    vi: "Đánh giá cách luyện tập của mình"
    ms: "Nilai keberkesanan rutin latihan"
    id: "Menilai efektivitas rutinitas latihan"
    hi: "अपने अभ्यास तरीके को परखना"
