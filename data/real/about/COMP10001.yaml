code: COMP10001
year: 2026
learn:
  en: "A first programming subject for beginners: writing simple programs to work with and analyse data."
  zh: "零基础入门编程：写简单的程序来处理和分析数据。"
  zh-TW: "零基礎入門程式設計：寫簡單的程式來處理和分析資料。"
  ja: "初心者向けの最初のプログラミング科目：データを扱い分析する簡単なプログラムを書く。"
  ko: "초보자를 위한 첫 프로그래밍 과목: 데이터를 다루고 분석하는 간단한 프로그램 작성."
  vi: "Môn học lập trình đầu tiên cho người mới: viết chương trình đơn giản để xử lý và phân tích dữ liệu."
  ms: "Subjek pengaturcaraan pertama untuk pemula: tulis program mudah untuk mengurus dan analisis data."
  id: "Mata kuliah pemrograman pertama untuk pemula: menulis program sederhana untuk mengolah dan analisis data."
  hi: "शुरुआती लोगों के लिए पहला प्रोग्रामिंग सब्जेक्ट: डेटा संभालने व विश्लेषण के लिए सरल प्रोग्राम लिखना।"
outcomes:
  - en: "Read, write and debug small programs"
    zh: "读懂、编写和调试小程序"
    zh-TW: "讀懂、撰寫和除錯小程式"
    ja: "小さなプログラムを読み、書き、デバッグする"
    ko: "작은 프로그램 읽고, 쓰고, 디버그하기"
    vi: "Đọc, viết và gỡ lỗi chương trình nhỏ"
    ms: "Baca, tulis dan nyahpepijat program kecil"
    id: "Membaca, menulis, dan men-debug program kecil"
    hi: "छोटे प्रोग्राम पढ़ना, लिखना और डिबग करना"
  - en: "Use functions, lists and other basic data structures"
    zh: "会用函数、列表等基本数据结构"
    zh-TW: "會用函式、串列等基本資料結構"
    ja: "関数やリストなど基本的なデータ構造を使う"
    ko: "함수, 리스트 등 기본 자료구조 사용하기"
    vi: "Dùng hàm, danh sách và cấu trúc dữ liệu cơ bản khác"
    ms: "Guna fungsi, senarai dan struktur data asas lain"
    id: "Memakai fungsi, list, dan struktur data dasar lainnya"
    hi: "फ़ंक्शन, लिस्ट और दूसरे बेसिक डेटा स्ट्रक्चर इस्तेमाल करना"
  - en: "Break a problem into steps a program can solve"
    zh: "把问题拆成程序能解决的步骤"
    zh-TW: "把問題拆成程式能解決的步驟"
    ja: "問題をプログラムで解ける手順に分ける"
    ko: "문제를 프로그램이 풀 수 있는 단계로 나누기"
    vi: "Chia bài toán thành các bước chương trình giải được"
    ms: "Pecahkan masalah kepada langkah yang boleh diselesaikan program"
    id: "Memecah masalah jadi langkah yang bisa diselesaikan program"
    hi: "समस्या को ऐसे स्टेप में बाँटना जो प्रोग्राम हल कर सके"
