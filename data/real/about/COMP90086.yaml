code: COMP90086
year: 2027
learn:
  en: "How computers interpret images, from image formation to object recognition and 3D reconstruction, in Python."
  zh: "用 Python 学习计算机如何理解图像：从成像原理到物体识别与三维重建。"
  zh-TW: "用 Python 學習電腦如何理解影像：從成像原理到物體辨識與三維重建。"
  ja: "Python で画像理解を学ぶ：画像形成から物体認識、3次元復元まで。"
  ko: "Python으로 이미지 이해: 영상 형성부터 객체 인식, 3D 복원까지."
  vi: "Máy tính hiểu ảnh thế nào bằng Python: từ tạo ảnh đến nhận dạng vật thể và dựng 3D."
  ms: "Cara komputer mentafsir imej dengan Python: pembentukan imej, pengecaman objek, pembinaan semula 3D."
  id: "Cara komputer menafsirkan gambar dengan Python: pembentukan citra, pengenalan objek, rekonstruksi 3D."
  hi: "Python में कंप्यूटर तस्वीरें कैसे समझता है: इमेज बनने से ऑब्जेक्ट पहचान और 3D तक।"
outcomes:
  - en: "Explain how images are formed and processed"
    zh: "解释图像的形成与处理"
    zh-TW: "解釋影像的形成與處理"
    ja: "画像の形成と処理を説明する"
    ko: "영상 형성과 처리 설명하기"
    vi: "Giải thích cách ảnh được tạo và xử lý"
    ms: "Terangkan cara imej dibentuk dan diproses"
    id: "Menjelaskan pembentukan dan pemrosesan citra"
    hi: "तस्वीरें कैसे बनती और प्रोसेस होती हैं, समझाना"
  - en: "Build vision programs for tasks like object recognition"
    zh: "编写物体识别等视觉程序"
    zh-TW: "撰寫物體辨識等視覺程式"
    ja: "物体認識などの視覚プログラムを作る"
    ko: "객체 인식 같은 비전 프로그램 만들기"
    vi: "Viết chương trình thị giác như nhận dạng vật thể"
    ms: "Bina program visi seperti pengecaman objek"
    id: "Membuat program visi seperti pengenalan objek"
    hi: "ऑब्जेक्ट पहचान जैसे विज़न प्रोग्राम बनाना"
