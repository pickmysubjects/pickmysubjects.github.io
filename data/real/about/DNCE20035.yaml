code: DNCE20035
year: 2026
learn:
  en: "Dance history in context: intercultural roots of modern dance and Australian dance in relation to First Nations and settler cultures."
  zh: "放在背景中看舞蹈史：现代舞的跨文化根源，以及澳洲舞蹈与原住民及殖民文化。"
  zh-TW: "放在背景中看舞蹈史：現代舞的跨文化根源，以及澳洲舞蹈與原住民及殖民文化。"
  ja: "文脈で見るダンス史：モダンダンスの異文化的ルーツと、先住民・入植者文化とオーストラリアの舞踊。"
  ko: "맥락 속 무용사: 현대무용의 문화 간 뿌리, 원주민·정착민 문화와 호주 무용."
  vi: "Lịch sử múa trong bối cảnh: gốc rễ liên văn hóa của múa hiện đại và múa Úc với văn hóa bản địa, di dân."
  ms: "Sejarah tarian dalam konteks: akar antara budaya tarian moden dan tarian Australia dengan budaya Orang Asli dan peneroka."
  id: "Sejarah tari dalam konteks: akar lintas budaya tari modern dan tari Australia dengan budaya Pribumi dan pendatang."
  hi: "संदर्भ में डांस इतिहास: मॉडर्न डांस की अंतर-सांस्कृतिक जड़ें और आदिवासी व बसने वाली संस्कृतियों के साथ ऑस्ट्रेलियाई डांस।"
outcomes:
  - en: "Place dances in their cultural and historical context"
    zh: "把舞蹈放回其文化与历史背景"
    zh-TW: "把舞蹈放回其文化與歷史背景"
    ja: "ダンスを文化・歴史の文脈に位置づける"
    ko: "춤을 문화·역사적 맥락에 놓고 보기"
    vi: "Đặt điệu múa vào bối cảnh văn hóa, lịch sử"
    ms: "Letak tarian dalam konteks budaya dan sejarah"
    id: "Menempatkan tarian dalam konteks budaya dan sejarah"
    hi: "नृत्यों को उनके सांस्कृतिक-ऐतिहासिक संदर्भ में रखना"
  - en: "Write an essay on Australian dance histories"
    zh: "撰写关于澳洲舞蹈史的论文"
    zh-TW: "撰寫關於澳洲舞蹈史的論文"
    ja: "オーストラリアのダンス史について論文を書く"
    ko: "호주 무용사에 관한 에세이 쓰기"
    vi: "Viết tiểu luận về lịch sử múa Úc"
    ms: "Tulis esei tentang sejarah tarian Australia"
    id: "Menulis esai tentang sejarah tari Australia"
    hi: "ऑस्ट्रेलियाई डांस इतिहास पर निबंध लिखना"
  - en: "Re-enact a piece of choreography from the archive"
    zh: "根据档案重演一段编舞"
    zh-TW: "根據檔案重演一段編舞"
    ja: "アーカイブから振付を再演する"
    ko: "기록 자료로 안무 한 편 재연하기"
    vi: "Tái hiện một đoạn biên đạo từ tư liệu lưu trữ"
    ms: "Persembahkan semula koreografi dari arkib"
    id: "Memeragakan ulang koreografi dari arsip"
    hi: "आर्काइव से कोई कोरियोग्राफ़ी दोबारा प्रस्तुत करना"
