code: ABPL90090
year: 2027
learn:
  en: "Planning public transport networks and regional transport plans for spread-out cities."
  zh: "为分散型城市规划公共交通网络和区域交通方案。"
  zh-TW: "為分散型城市規劃大眾運輸路網與區域交通計畫。"
  ja: "郊外に広がる都市の公共交通ネットワークと地域交通計画を立てる。"
  ko: "넓게 퍼진 도시의 대중교통망과 지역 교통 계획 수립."
  vi: "Quy hoạch mạng lưới giao thông công cộng và kế hoạch giao thông vùng cho đô thị dàn trải."
  ms: "Merancang rangkaian pengangkutan awam dan pelan pengangkutan wilayah untuk bandar yang berselerak."
  id: "Merencanakan jaringan transportasi umum dan rencana transportasi wilayah untuk kota yang menyebar."
  hi: "फैले हुए शहरों के लिए सार्वजनिक परिवहन नेटवर्क और क्षेत्रीय परिवहन योजना बनाना।"
outcomes:
  - en: "Assess public transport in suburbs of spread-out cities"
    zh: "评估分散型城市郊区的公共交通"
    zh-TW: "評估分散型城市郊區的大眾運輸"
    ja: "郊外の公共交通を評価する"
    ko: "교외 지역의 대중교통 평가하기"
    vi: "Đánh giá giao thông công cộng ở vùng ngoại ô"
    ms: "Menilai pengangkutan awam di kawasan pinggir bandar"
    id: "Menilai transportasi umum di pinggiran kota"
    hi: "उपनगरों में सार्वजनिक परिवहन का आकलन"
  - en: "Apply network planning to a multi-modal transport plan"
    zh: "把网络规划原则用于多模式交通方案"
    zh-TW: "把路網規劃原則用於多運具交通計畫"
    ja: "ネットワーク計画の原則をマルチモーダル交通計画に使う"
    ko: "네트워크 계획 원칙을 복합 교통 계획에 적용하기"
    vi: "Áp dụng nguyên tắc quy hoạch mạng lưới vào kế hoạch giao thông đa phương thức"
    ms: "Menggunakan prinsip perancangan rangkaian dalam pelan pengangkutan pelbagai mod"
    id: "Menerapkan prinsip perencanaan jaringan pada rencana transportasi multimoda"
    hi: "बहु-मॉडल परिवहन योजना में नेटवर्क योजना सिद्धांत लागू करना"
