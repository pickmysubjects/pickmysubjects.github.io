code: CHEM30015
year: 2026
learn:
  en: "Advanced lab chemistry: making complex molecules, analysing them and designing your own experiments."
  zh: "高级化学实验：合成复杂分子、分析表征，并自己设计实验。"
  zh-TW: "高階化學實驗：合成複雜分子、分析鑑定，並自己設計實驗。"
  ja: "上級化学実験：複雑な分子を合成・分析し、自分で実験を計画する。"
  ko: "고급 화학 실험: 복잡한 분자 합성, 분석, 직접 실험 설계."
  vi: "Thí nghiệm hóa nâng cao: tổng hợp phân tử phức tạp, phân tích và tự thiết kế thí nghiệm."
  ms: "Kimia makmal lanjutan: hasilkan molekul kompleks, analisisnya dan reka eksperimen sendiri."
  id: "Kimia lab lanjutan: membuat molekul kompleks, menganalisisnya, dan merancang eksperimen sendiri."
  hi: "एडवांस्ड लैब केमिस्ट्री: जटिल अणु बनाना, उनका विश्लेषण और अपने प्रयोग डिज़ाइन करना।"
outcomes:
  - en: "Make complex molecules through reactions"
    zh: "通过反应合成复杂分子"
    zh-TW: "透過反應合成複雜分子"
    ja: "反応で複雑な分子を合成する"
    ko: "반응으로 복잡한 분자 합성하기"
    vi: "Tổng hợp phân tử phức tạp qua phản ứng"
    ms: "Hasilkan molekul kompleks melalui tindak balas"
    id: "Membuat molekul kompleks lewat reaksi"
    hi: "रिएक्शन से जटिल अणु बनाना"
  - en: "Collect and interpret spectroscopy data"
    zh: "采集并解读光谱数据"
    zh-TW: "採集並解讀光譜資料"
    ja: "分光データを集めて読み解く"
    ko: "분광 데이터 수집하고 해석하기"
    vi: "Thu thập và phân tích dữ liệu quang phổ"
    ms: "Kumpul dan tafsir data spektroskopi"
    id: "Mengumpulkan dan menafsirkan data spektroskopi"
    hi: "स्पेक्ट्रोस्कोपी डेटा इकट्ठा करना और समझना"
  - en: "Use computing to analyse chemical data"
    zh: "用计算方法分析化学数据"
    zh-TW: "用計算方法分析化學資料"
    ja: "コンピュータで化学データを分析する"
    ko: "컴퓨팅으로 화학 데이터 분석하기"
    vi: "Dùng máy tính phân tích dữ liệu hóa học"
    ms: "Guna pengkomputeran untuk analisis data kimia"
    id: "Memakai komputasi untuk analisis data kimia"
    hi: "कंप्यूटिंग से रासायनिक डेटा का विश्लेषण"
