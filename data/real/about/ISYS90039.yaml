code: ISYS90039
year: 2027
learn:
  en: "How digital innovation and entrepreneurship work together to create successful new ventures."
  zh: "数字创新与创业如何相互作用，创造成功的新企业。"
  zh-TW: "數位創新與創業如何相互作用，打造成功的新創事業。"
  ja: "デジタル革新と起業がどう結びつき、成功する事業を生むか。"
  ko: "디지털 혁신과 창업이 어떻게 맞물려 성공적인 사업을 만드는지."
  vi: "Đổi mới số và khởi nghiệp kết hợp ra sao để tạo nên doanh nghiệp thành công."
  ms: "Bagaimana inovasi digital dan keusahawanan bergabung untuk mencipta usaha niaga berjaya."
  id: "Bagaimana inovasi digital dan kewirausahaan bersama menciptakan usaha baru yang sukses."
  hi: "डिजिटल इनोवेशन और उद्यमिता मिलकर सफल नए वेंचर कैसे बनाते हैं।"
outcomes:
  - en: "Explain what drives innovation in fast-changing markets"
    zh: "解释快速变化市场中的创新动力"
    zh-TW: "解釋快速變化市場中的創新動力"
    ja: "変化の速い市場で革新を生む要因を説明する"
    ko: "빠르게 변하는 시장의 혁신 동력 설명하기"
    vi: "Giải thích động lực đổi mới ở thị trường thay đổi nhanh"
    ms: "Menerangkan pemacu inovasi dalam pasaran pantas berubah"
    id: "Menjelaskan pendorong inovasi di pasar yang cepat berubah"
    hi: "तेज़ी से बदलते बाज़ार में इनोवेशन के कारण समझाना"
  - en: "Assess a digital venture idea"
    zh: "评估数字创业构想"
    zh-TW: "評估數位創業構想"
    ja: "デジタル事業のアイデアを評価する"
    ko: "디지털 창업 아이디어 평가하기"
    vi: "Đánh giá một ý tưởng kinh doanh số"
    ms: "Menilai idea usaha niaga digital"
    id: "Menilai ide usaha digital"
    hi: "किसी डिजिटल वेंचर आइडिया का आकलन करना"
