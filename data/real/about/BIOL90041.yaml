code: BIOL90041
year: 2027
learn:
  en: "Data science for biology: collecting, cleaning, analysing and plotting data in R or Python, plus HPC and cloud."
  zh: "面向生物学的数据科学：用R或Python收集、整理、分析和可视化数据，并使用高性能和云计算。"
  zh-TW: "面向生物學的資料科學：用R或Python收集、整理、分析與視覺化資料，並使用高效能與雲端運算。"
  ja: "生物学のためのデータサイエンス：RやPythonで収集・整理・解析・可視化し、HPCとクラウドも使う。"
  ko: "생물학을 위한 데이터 과학: R·Python으로 수집·정리·분석·시각화, HPC와 클라우드 활용."
  vi: "Khoa học dữ liệu cho sinh học: thu thập, xử lý, phân tích, trực quan bằng R/Python, cùng HPC và đám mây."
  ms: "Sains data untuk biologi: kumpul, urus, analisis dan visual data dengan R/Python, serta HPC dan awan."
  id: "Sains data untuk biologi: kumpulkan, rapikan, analisis, visualisasikan dengan R/Python, plus HPC dan cloud."
  hi: "जीवविज्ञान के लिए डेटा साइंस: R या Python में डेटा जुटाना, साफ़ करना, विश्लेषण, विज़ुअलाइज़ेशन, HPC और क्लाउड।"
outcomes:
  - en: "Collect, organise and curate biological data"
    zh: "收集、整理和管理生物数据"
    zh-TW: "收集、整理與管理生物資料"
    ja: "生物データを集め整理する"
    ko: "생물 데이터 수집·정리하기"
    vi: "Thu thập, sắp xếp và quản lý dữ liệu sinh học"
    ms: "Mengumpul dan menyusun data biologi"
    id: "Mengumpulkan dan mengelola data biologi"
    hi: "जैविक डेटा जुटाना और व्यवस्थित करना"
  - en: "Visualise and interpret analysis results"
    zh: "可视化并解读分析结果"
    zh-TW: "視覺化並解讀分析結果"
    ja: "解析結果を可視化し解釈する"
    ko: "분석 결과 시각화·해석하기"
    vi: "Trực quan hóa và diễn giải kết quả"
    ms: "Memvisualkan dan mentafsir hasil analisis"
    id: "Memvisualkan dan menafsirkan hasil analisis"
    hi: "विश्लेषण परिणामों को दिखाना और समझना"
  - en: "Program in R or Python for data science"
    zh: "用R或Python编程做数据科学"
    zh-TW: "用R或Python寫程式做資料科學"
    ja: "RやPythonでデータ分析のプログラムを書く"
    ko: "R·Python으로 데이터 과학 코딩하기"
    vi: "Lập trình R hoặc Python cho khoa học dữ liệu"
    ms: "Memprogram dalam R atau Python untuk sains data"
    id: "Memprogram R atau Python untuk sains data"
    hi: "डेटा साइंस के लिए R या Python प्रोग्रामिंग"
