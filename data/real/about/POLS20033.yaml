code: POLS20033
year: 2026
learn:
  en: "How authoritarian rulers gain, keep and lose power, from repression to digital surveillance, with case studies from around the world."
  zh: "威权统治者如何获得、维持和失去权力，从镇压到数字监控，案例来自世界各地。"
  zh-TW: "威權統治者如何取得、維持和失去權力，從鎮壓到數位監控，案例來自世界各地。"
  ja: "権威主義の指導者がどう権力を得て、保ち、失うのかを、弾圧からデジタル監視まで世界各地の事例で学ぶ。"
  ko: "권위주의 통치자가 어떻게 권력을 얻고 유지하고 잃는지 탄압부터 디지털 감시까지 세계 사례로 배운다."
  vi: "Các nhà cai trị độc tài giành, giữ và mất quyền lực ra sao, từ đàn áp đến giám sát số, với các trường hợp trên khắp thế giới."
  ms: "Bagaimana pemerintah autoritarian meraih, mengekalkan dan kehilangan kuasa, dari penindasan hingga pengawasan digital, dengan kajian kes seluruh dunia."
  id: "Bagaimana penguasa otoriter meraih, mempertahankan, dan kehilangan kekuasaan, dari represi hingga pengawasan digital, dengan contoh dari seluruh dunia."
  hi: "तानाशाही शासक सत्ता कैसे पाते, बचाते और खोते हैं, दमन से डिजिटल निगरानी तक, दुनिया भर के उदाहरणों के साथ।"
outcomes:
  - en: "Recognise the key features of authoritarian rule"
    zh: "识别威权统治的主要特征"
    zh-TW: "辨識威權統治的主要特徵"
    ja: "権威主義体制の主な特徴を見分ける"
    ko: "권위주의 통치의 주요 특징 알아보기"
    vi: "Nhận ra các đặc điểm chính của chế độ độc tài"
    ms: "Kenal pasti ciri utama pemerintahan autoritarian"
    id: "Mengenali ciri utama pemerintahan otoriter"
    hi: "तानाशाही शासन की मुख्य विशेषताएँ पहचानना"
  - en: "Explain why some autocracies last"
    zh: "解释一些威权政权为何能长期维持"
    zh-TW: "解釋一些威權政權為何能長期維持"
    ja: "一部の独裁体制が長く続く理由を説明する"
    ko: "일부 독재 체제가 오래가는 이유 설명하기"
    vi: "Giải thích vì sao một số chế độ độc tài tồn tại lâu"
    ms: "Terangkan kenapa sesetengah autokrasi bertahan lama"
    id: "Menjelaskan kenapa sebagian autokrasi bertahan lama"
    hi: "समझाना कि कुछ तानाशाहियाँ लंबे समय तक क्यों टिकती हैं"
  - en: "Suggest policy responses for democracies"
    zh: "为民主国家提出应对政策"
    zh-TW: "為民主國家提出因應政策"
    ja: "民主国家に向けた政策対応を提案する"
    ko: "민주 국가를 위한 정책 대응 제안하기"
    vi: "Đề xuất chính sách ứng phó cho các nền dân chủ"
    ms: "Cadangkan tindak balas dasar untuk negara demokrasi"
    id: "Mengusulkan respons kebijakan bagi negara demokrasi"
    hi: "लोकतांत्रिक देशों के लिए नीतिगत जवाब सुझाना"
