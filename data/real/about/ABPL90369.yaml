code: ABPL90369
year: 2027
learn:
  en: "Architecture as spectacle in a consumer culture: branding, tourism, heritage and nation building."
  zh: "消费文化中作为奇观的建筑：品牌、旅游、遗产和国家建构。"
  zh-TW: "消費文化中作為奇觀的建築：品牌、觀光、遺產和國家建構。"
  ja: "消費文化の中のスペクタクルとしての建築：ブランド、観光、遺産、国家形成。"
  ko: "소비문화 속 스펙터클로서의 건축: 브랜딩, 관광, 유산, 국가 건설."
  vi: "Kiến trúc như một cảnh tượng trong văn hóa tiêu dùng: thương hiệu, du lịch, di sản, xây dựng quốc gia."
  ms: "Seni bina sebagai tontonan dalam budaya pengguna: penjenamaan, pelancongan, warisan dan pembinaan negara."
  id: "Arsitektur sebagai tontonan dalam budaya konsumen: branding, pariwisata, warisan, dan pembangunan bangsa."
  hi: "उपभोक्ता संस्कृति में तमाशे के रूप में वास्तुकला: ब्रांडिंग, पर्यटन, विरासत और राष्ट्र-निर्माण।"
outcomes:
  - en: "Read architecture as cultural production"
    zh: "把建筑解读为文化生产"
    zh-TW: "把建築解讀為文化生產"
    ja: "建築を文化的生産として読む"
    ko: "건축을 문화 생산으로 읽기"
    vi: "Đọc kiến trúc như sản phẩm văn hóa"
    ms: "Membaca seni bina sebagai pengeluaran budaya"
    id: "Membaca arsitektur sebagai produksi budaya"
    hi: "वास्तुकला को सांस्कृतिक उत्पादन के रूप में पढ़ना"
  - en: "Write a research essay"
    zh: "撰写研究论文"
    zh-TW: "撰寫研究論文"
    ja: "研究エッセイを書く"
    ko: "연구 에세이 쓰기"
    vi: "Viết bài luận nghiên cứu"
    ms: "Menulis esei kajian"
    id: "Menulis esai riset"
    hi: "शोध निबंध लिखना"
