code: MUSI30004
year: 2026
learn:
  en: "How music and film have worked together since 1900, studied through journals, class presentations and an essay."
  zh: "1900年以来音乐与电影如何结合，通过日志、课堂展示和论文学习。"
  zh-TW: "1900年以來音樂與電影如何結合，透過日誌、課堂展示和論文學習。"
  ja: "1900年以降の音楽と映画の関係を、日誌・発表・論文で学ぶ。"
  ko: "1900년 이후 음악과 영화의 결합을 저널·발표·에세이로 배운다."
  vi: "Âm nhạc và điện ảnh kết hợp ra sao từ 1900, học qua nhật ký, thuyết trình, tiểu luận."
  ms: "Hubungan muzik dan filem sejak 1900, melalui jurnal, pembentangan dan esei."
  id: "Hubungan musik dan film sejak 1900, lewat jurnal, presentasi dan esai."
  hi: "1900 से संगीत और फ़िल्म का संबंध, जर्नल, प्रस्तुति और निबंध के ज़रिए।"
outcomes:
  - en: "Analyse how music shapes what we see on screen"
    zh: "分析音乐如何塑造银幕画面"
    zh-TW: "分析音樂如何塑造銀幕畫面"
    ja: "音楽が映像の見え方をどう形づくるか分析する"
    ko: "음악이 화면을 어떻게 형성하는지 분석하기"
    vi: "Phân tích âm nhạc định hình hình ảnh trên màn ảnh"
    ms: "Analisis cara muzik membentuk paparan skrin"
    id: "Menganalisis cara musik membentuk tontonan"
    hi: "संगीत परदे के दृश्यों को कैसे गढ़ता है, विश्लेषण"
  - en: "Trace changes in film music across the century"
    zh: "梳理一个世纪以来电影音乐的变化"
    zh-TW: "梳理一個世紀以來電影音樂的變化"
    ja: "この100年の映画音楽の変化をたどる"
    ko: "한 세기 동안 영화음악의 변화 추적하기"
    vi: "Theo dõi thay đổi của nhạc phim qua thế kỷ"
    ms: "Jejaki perubahan muzik filem sepanjang abad"
    id: "Menelusuri perubahan musik film selama seabad"
    hi: "सदी भर में फ़िल्म संगीत के बदलाव समझना"
  - en: "Write and present clear arguments about film music"
    zh: "就电影音乐撰写并展示清晰论点"
    zh-TW: "就電影音樂撰寫並展示清晰論點"
    ja: "映画音楽について明確な論を書き発表する"
    ko: "영화음악에 대한 명확한 논지 쓰고 발표하기"
    vi: "Viết và trình bày lập luận rõ về nhạc phim"
    ms: "Tulis dan bentang hujah jelas tentang muzik filem"
    id: "Menulis dan memaparkan argumen jelas soal musik film"
    hi: "फ़िल्म संगीत पर स्पष्ट तर्क लिखना और प्रस्तुत करना"
