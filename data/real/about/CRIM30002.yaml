code: CRIM30002
year: 2026
learn:
  en: "Mass harms that criminology often overlooks, such as genocide, colonialism, slavery and war, and crimes committed by states."
  zh: "犯罪学常忽视的大规模伤害，如种族灭绝、殖民、奴隶制和战争，以及国家犯下的罪行。"
  zh-TW: "犯罪學常忽視的大規模傷害，如種族滅絕、殖民、奴隸制和戰爭，以及國家犯下的罪行。"
  ja: "犯罪学が見落としがちな大規模な加害。ジェノサイド、植民地主義、奴隷制、戦争、そして国家による犯罪。"
  ko: "범죄학이 흔히 놓치는 대규모 피해. 집단학살, 식민주의, 노예제, 전쟁, 그리고 국가가 저지른 범죄."
  vi: "Những tổn hại quy mô lớn mà tội phạm học hay bỏ qua: diệt chủng, thực dân, nô lệ, chiến tranh và tội ác của nhà nước."
  ms: "Bahaya besar-besaran yang sering terlepas pandang kriminologi: genosid, penjajahan, perhambaan, perang dan jenayah oleh negara."
  id: "Kejahatan massal yang sering luput dari kriminologi: genosida, kolonialisme, perbudakan, perang, dan kejahatan oleh negara."
  hi: "बड़े पैमाने के नुकसान जिन्हें अपराधशास्त्र अक्सर अनदेखा करता है: नरसंहार, उपनिवेशवाद, दासता, युद्ध और राज्य के अपराध।"
outcomes:
  - en: "Analyse mass harm through historical cases"
    zh: "通过历史案例分析大规模伤害"
    zh-TW: "透過歷史案例分析大規模傷害"
    ja: "歴史上の事例から大規模な加害を分析する"
    ko: "역사적 사례로 대규모 피해 분석하기"
    vi: "Phân tích tổn hại quy mô lớn qua các vụ việc lịch sử"
    ms: "Analisis bahaya besar melalui kes sejarah"
    id: "Menganalisis kejahatan massal lewat kasus sejarah"
    hi: "ऐतिहासिक मामलों से बड़े नुकसान का विश्लेषण करना"
  - en: "Apply decolonial ideas to crime"
    zh: "用去殖民视角看待犯罪"
    zh-TW: "用去殖民視角看待犯罪"
    ja: "脱植民地の視点で犯罪を考える"
    ko: "탈식민 관점으로 범죄 바라보기"
    vi: "Áp dụng góc nhìn giải thực dân vào tội phạm"
    ms: "Gunakan idea dekolonial terhadap jenayah"
    id: "Menerapkan gagasan dekolonial pada kejahatan"
    hi: "अपराध पर विउपनिवेशी विचार लागू करना"
  - en: "Assess international responses to state crimes"
    zh: "评估国际社会对国家罪行的回应"
    zh-TW: "評估國際社會對國家罪行的回應"
    ja: "国家犯罪への国際的な対応を評価する"
    ko: "국가 범죄에 대한 국제적 대응 평가하기"
    vi: "Đánh giá phản ứng quốc tế với tội ác nhà nước"
    ms: "Nilai respons antarabangsa terhadap jenayah negara"
    id: "Menilai respons internasional atas kejahatan negara"
    hi: "राज्य के अपराधों पर अंतरराष्ट्रीय प्रतिक्रिया का आकलन करना"
