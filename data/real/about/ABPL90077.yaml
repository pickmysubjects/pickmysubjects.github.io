code: ABPL90077
year: 2027
learn:
  en: "How transport systems shape city growth and form, theories since the 1950s, and tools for joint transport and land use planning."
  zh: "交通系统如何塑造城市增长与形态，1950 年代以来的理论，以及交通与用地一体化规划工具。"
  zh-TW: "交通系統如何塑造都市成長與形態，1950 年代以來的理論，以及交通與土地使用整合規劃工具。"
  ja: "交通が都市の成長と形をどう決めるか。1950年代以降の理論と、交通・土地利用の統合計画。"
  ko: "교통이 도시 성장과 형태를 만드는 방식, 1950년대 이후 이론, 교통·토지이용 통합계획 도구."
  vi: "Giao thông định hình đô thị ra sao, lý thuyết từ 1950 và công cụ quy hoạch giao thông–đất đai."
  ms: "Cara sistem pengangkutan membentuk bandar, teori sejak 1950-an dan alat perancangan bersepadu."
  id: "Cara transportasi membentuk kota, teori sejak 1950-an dan alat perencanaan terpadu."
  hi: "परिवहन शहर के विकास और रूप को कैसे गढ़ता है, 1950 से सिद्धांत और एकीकृत योजना के टूल।"
outcomes:
  - en: "Critique theories linking transport and land use"
    zh: "批判性分析交通与土地利用的理论"
    zh-TW: "批判性分析交通與土地使用的理論"
    ja: "交通と土地利用の理論を批評する"
    ko: "교통·토지이용 연계 이론 비평하기"
    vi: "Phê bình lý thuyết giao thông và sử dụng đất"
    ms: "Mengkritik teori pengangkutan dan guna tanah"
    id: "Mengkritisi teori transportasi dan tata guna lahan"
    hi: "परिवहन और भूमि उपयोग सिद्धांतों की आलोचना"
  - en: "Write a field paper on a real place"
    zh: "针对真实地点撰写实地研究论文"
    zh-TW: "針對真實地點撰寫實地研究論文"
    ja: "実際の場所についてフィールド論文を書く"
    ko: "실제 장소에 대한 현장 논문 쓰기"
    vi: "Viết bài nghiên cứu thực địa về một nơi thật"
    ms: "Menulis kertas lapangan tentang tempat sebenar"
    id: "Menulis makalah lapangan tentang tempat nyata"
    hi: "असली जगह पर फ़ील्ड पेपर लिखना"
