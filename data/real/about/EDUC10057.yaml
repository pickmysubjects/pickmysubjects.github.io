code: EDUC10057
year: 2026
learn:
  en: "The science of wellbeing, motivation and resilience, ending with an evidence-based wellbeing plan for your own life."
  zh: "幸福感、动机与韧性的科学，并为自己制定有依据的身心健康计划。"
  zh-TW: "幸福感、動機與韌性的科學，並為自己擬定有依據的身心健康計畫。"
  ja: "ウェルビーイング・動機づけ・レジリエンスの科学と、自分用の根拠ある計画づくり。"
  ko: "웰빙·동기·회복탄력성의 과학, 그리고 나를 위한 근거 기반 웰빙 계획."
  vi: "Khoa học về hạnh phúc, động lực và khả năng phục hồi, kết thúc bằng kế hoạch sống khỏe cho chính bạn."
  ms: "Sains kesejahteraan, motivasi dan daya tahan, diakhiri pelan kesejahteraan berasaskan bukti untuk diri sendiri."
  id: "Ilmu kesejahteraan, motivasi, dan ketangguhan, diakhiri rencana kesejahteraan berbasis bukti untuk diri sendiri."
  hi: "वेलबीइंग, प्रेरणा और लचीलेपन का विज्ञान, अंत में अपने लिए प्रमाण-आधारित वेलबीइंग योजना।"
outcomes:
  - en: "Choose wellbeing models that fit a situation"
    zh: "为具体情境选择合适的幸福感模型"
    zh-TW: "為具體情境選擇合適的幸福感模型"
    ja: "状況に合うウェルビーイングのモデルを選ぶ"
    ko: "상황에 맞는 웰빙 모델 고르기"
    vi: "Chọn mô hình hạnh phúc phù hợp từng bối cảnh"
    ms: "Pilih model kesejahteraan yang sesuai dengan situasi"
    id: "Memilih model kesejahteraan yang cocok untuk situasi"
    hi: "स्थिति के अनुसार वेलबीइंग मॉडल चुनना"
  - en: "Judge practices that claim to boost wellbeing"
    zh: "评估号称能提升幸福感的做法"
    zh-TW: "評估號稱能提升幸福感的做法"
    ja: "幸福度を高めるとされる実践を評価する"
    ko: "웰빙을 높인다는 실천법 평가하기"
    vi: "Đánh giá các cách được cho là tăng hạnh phúc"
    ms: "Nilai amalan yang didakwa meningkatkan kesejahteraan"
    id: "Menilai praktik yang diklaim meningkatkan kesejahteraan"
    hi: "वेलबीइंग बढ़ाने वाले तरीक़ों को परखना"
  - en: "Design an evidence-based wellbeing plan"
    zh: "设计有证据支持的幸福感计划"
    zh-TW: "設計有證據支持的幸福感計畫"
    ja: "根拠に基づくウェルビーイング計画を作る"
    ko: "근거 기반 웰빙 계획 세우기"
    vi: "Thiết kế kế hoạch sống khỏe dựa trên bằng chứng"
    ms: "Reka pelan kesejahteraan berasaskan bukti"
    id: "Merancang rencana kesejahteraan berbasis bukti"
    hi: "प्रमाण-आधारित वेलबीइंग योजना बनाना"
