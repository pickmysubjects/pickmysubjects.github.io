code: ANTH10002
year: 2026
learn:
  en: "An intro to anthropology through food: how getting, cooking, sharing and eating food reveals culture and belief."
  zh: "通过食物入门人类学：获取、烹饪、分享和进食如何体现文化与信仰。"
  zh-TW: "透過食物入門人類學：取得、烹飪、分享和進食如何體現文化與信仰。"
  ja: "食を通した人類学入門。食べ物を手に入れ、料理し、分け合い、食べることから文化と信仰を読み解く。"
  ko: "음식으로 배우는 인류학 입문. 음식을 구하고 요리하고 나누고 먹는 일에서 문화와 믿음을 읽는다."
  vi: "Nhập môn nhân học qua ẩm thực: việc kiếm, nấu, chia sẻ và ăn uống cho thấy văn hóa và niềm tin ra sao."
  ms: "Pengenalan antropologi melalui makanan: cara mendapatkan, memasak, berkongsi dan makan mendedahkan budaya dan kepercayaan."
  id: "Pengantar antropologi lewat makanan: cara mendapatkan, memasak, berbagi dan makan menyingkap budaya dan keyakinan."
  hi: "भोजन के ज़रिए मानवशास्त्र का परिचय: खाना जुटाना, पकाना, बांटना और खाना संस्कृति और आस्था को कैसे दिखाता है।"
outcomes:
  - en: "Explain key ideas in social anthropology"
    zh: "说明社会人类学的核心观念"
    zh-TW: "說明社會人類學的核心觀念"
    ja: "社会人類学の主な考えを説明する"
    ko: "사회인류학의 핵심 개념 설명하기"
    vi: "Giải thích các ý tưởng chính của nhân học xã hội"
    ms: "Terangkan idea utama antropologi sosial"
    id: "Menjelaskan gagasan utama antropologi sosial"
    hi: "सामाजिक मानवशास्त्र के मुख्य विचार समझाना"
  - en: "Analyse food practices as culture"
    zh: "把饮食实践作为文化来分析"
    zh-TW: "把飲食實踐作為文化來分析"
    ja: "食の営みを文化として分析する"
    ko: "음식 관행을 문화로 분석하기"
    vi: "Phân tích thực hành ăn uống như văn hóa"
    ms: "Analisis amalan makanan sebagai budaya"
    id: "Menganalisis praktik makan sebagai budaya"
    hi: "भोजन की प्रथाओं का संस्कृति के रूप में विश्लेषण करना"
  - en: "Question everyday \"common sense\" about food"
    zh: "反思关于食物的日常\"常识\""
    zh-TW: "反思關於食物的日常「常識」"
    ja: "食についての日常の「常識」を問い直す"
    ko: "음식에 관한 일상의 '상식' 의심해 보기"
    vi: "Đặt câu hỏi về \"lẽ thường\" hằng ngày quanh đồ ăn"
    ms: "Persoalkan \"akal biasa\" harian tentang makanan"
    id: "Mempertanyakan \"akal sehat\" sehari-hari soal makanan"
    hi: "भोजन के बारे में रोज़मर्रा की \"सामान्य समझ\" पर सवाल उठाना"
