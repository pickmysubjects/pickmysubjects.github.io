code: ABPL90307
year: 2027
learn:
  en: "A supervised work placement where you apply your design studies in a real workplace and reflect on it."
  zh: "在导师指导下到真实职场实习，运用所学并进行反思。"
  zh-TW: "在導師指導下到真實職場實習，運用所學並進行反思。"
  ja: "指導のもと実際の職場で実習し、学んだことを活かして振り返る。"
  ko: "지도를 받으며 실제 직장에서 실습하고 배운 것을 적용하며 성찰합니다."
  vi: "Thực tập có giám sát tại nơi làm việc thật, áp dụng kiến thức và tự đánh giá."
  ms: "Penempatan kerja diselia di tempat kerja sebenar untuk menggunakan ilmu dan membuat refleksi."
  id: "Magang terbimbing di tempat kerja nyata untuk menerapkan ilmu dan berefleksi."
  hi: "निगरानी में असली कार्यस्थल पर प्लेसमेंट, सीखी बातों का उपयोग और उस पर चिंतन।"
outcomes:
  - en: "Handle real project and workplace challenges"
    zh: "应对真实项目和职场中的问题"
    zh-TW: "應對真實專案和職場中的問題"
    ja: "実際のプロジェクトや職場の課題に対応する"
    ko: "실제 프로젝트와 직장 문제에 대응하기"
    vi: "Xử lý thách thức dự án và nơi làm việc thật"
    ms: "Menangani cabaran projek dan tempat kerja sebenar"
    id: "Menangani tantangan proyek dan tempat kerja nyata"
    hi: "असली प्रोजेक्ट और कार्यस्थल की चुनौतियाँ संभालना"
  - en: "Build professional networks"
    zh: "建立职业人脉"
    zh-TW: "建立職業人脈"
    ja: "業界での人脈をつくる"
    ko: "전문 인맥 쌓기"
    vi: "Xây dựng mạng lưới nghề nghiệp"
    ms: "Membina rangkaian profesional"
    id: "Membangun jaringan profesional"
    hi: "पेशेवर नेटवर्क बनाना"
