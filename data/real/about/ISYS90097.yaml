code: ISYS90097
year: 2027
learn:
  en: "IT spending from a CIO's view: cutting IT costs, knowledge capital, outsourcing and insuring against IT risk."
  zh: "从 CIO 角度看 IT 支出：降低 IT 成本、知识资本、外包，以及 IT 风险保险。"
  zh-TW: "從 CIO 角度看 IT 支出：降低 IT 成本、知識資本、外包，以及 IT 風險保險。"
  ja: "CIOの視点で見るIT支出：ITコスト削減、知識資本、アウトソーシング、ITリスクの保険。"
  ko: "CIO 관점의 IT 지출: IT 비용 절감, 지식 자본, 아웃소싱, IT 위험 보험."
  vi: "Chi tiêu IT từ góc nhìn CIO: cắt giảm chi phí IT, vốn tri thức, thuê ngoài, bảo hiểm rủi ro IT."
  ms: "Perbelanjaan IT dari sudut CIO: mengurangkan kos IT, modal pengetahuan, penyumberan luar, insurans risiko IT."
  id: "Belanja TI dari sudut pandang CIO: memangkas biaya TI, modal pengetahuan, alih daya, asuransi risiko TI."
  hi: "CIO की नज़र से IT ख़र्च: IT लागत घटाना, ज्ञान पूँजी, आउटसोर्सिंग और IT जोखिम का बीमा।"
outcomes:
