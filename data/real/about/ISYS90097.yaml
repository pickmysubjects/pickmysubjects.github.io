    zh: "分析企业的 IT 支出及节省空间"
    zh-TW: "分析企業的 IT 支出與節省空間"
    ja: "企業のIT支出と削減余地を分析する"
    ko: "기업의 IT 지출과 절감 여지 분석하기"
    vi: "Phân tích chi tiêu IT của doanh nghiệp và chỗ tiết kiệm"
    ms: "Menganalisis perbelanjaan IT firma dan ruang penjimatan"
    id: "Menganalisis belanja TI perusahaan dan peluang hemat"
    hi: "कंपनियों के IT ख़र्च और बचत की जगह का विश्लेषण करना"
  - en: "Discuss IT strategy issues using ethics codes"
    zh: "结合职业道德准则讨论 IT 战略问题"
    zh-TW: "結合職業倫理守則討論 IT 策略問題"
