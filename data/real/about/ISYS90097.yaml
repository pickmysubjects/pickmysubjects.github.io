    vi: "Thảo luận vấn đề chiến lược IT theo chuẩn mực đạo đức"
    ms: "Membincangkan isu strategi IT berpandukan kod etika"
    id: "Membahas isu strategi TI berdasarkan kode etik"
    hi: "आचार संहिताओं के आधार पर IT रणनीति के मुद्दों पर चर्चा करना"
