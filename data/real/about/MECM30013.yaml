code: MECM30013
year: 2026
learn:
  en: "How advertising, promotion and public relations fit together in a campaign, and how to plan one and judge whether it worked."
  zh: "广告、促销和公关如何在一场营销活动中配合，以及如何策划活动并判断效果。"
  zh-TW: "廣告、促銷和公關如何在一場行銷活動中配合，以及如何規劃活動並判斷成效。"
  ja: "広告、販売促進、広報がキャンペーンの中でどう組み合わさるか、そしてその企画方法と効果の見極め方を学ぶ。"
  ko: "광고, 판촉, 홍보가 캠페인에서 어떻게 맞물리는지, 캠페인을 기획하고 효과를 판단하는 법을 배운다."
  vi: "Quảng cáo, khuyến mãi và quan hệ công chúng phối hợp trong một chiến dịch ra sao, cách lên kế hoạch và đánh giá hiệu quả."
  ms: "Bagaimana pengiklanan, promosi dan perhubungan awam bergabung dalam kempen, serta cara merancang dan menilai keberkesanannya."
  id: "Bagaimana iklan, promosi, dan humas berpadu dalam satu kampanye, serta cara merancang dan menilai keberhasilannya."
  hi: "विज्ञापन, प्रमोशन और पब्लिक रिलेशन्स एक कैंपेन में कैसे जुड़ते हैं, और कैंपेन की योजना बनाना व उसका असर परखना।"
outcomes:
  - en: "Plan, run and evaluate a marketing campaign"
    zh: "策划、执行并评估营销活动"
    zh-TW: "規劃、執行並評估行銷活動"
    ja: "マーケティング施策を企画・実施・評価する"
    ko: "마케팅 캠페인 기획, 실행, 평가하기"
    vi: "Lên kế hoạch, triển khai và đánh giá chiến dịch tiếp thị"
    ms: "Rancang, jalankan dan nilai kempen pemasaran"
    id: "Merancang, menjalankan, dan mengevaluasi kampanye pemasaran"
    hi: "मार्केटिंग कैंपेन की योजना बनाना, चलाना और परखना"
  - en: "Explain why some campaigns work better than others"
    zh: "说明为什么有些营销活动效果更好"
    zh-TW: "說明為什麼有些行銷活動成效更好"
    ja: "なぜ効果の高いキャンペーンがあるのか説明する"
    ko: "어떤 캠페인이 더 효과적인 이유 설명하기"
    vi: "Giải thích vì sao có chiến dịch hiệu quả hơn"
    ms: "Terangkan kenapa sesetengah kempen lebih berkesan"
    id: "Menjelaskan kenapa sebagian kampanye lebih berhasil"
    hi: "समझाना कि कुछ कैंपेन दूसरों से बेहतर क्यों चलते हैं"
  - en: "Write a professional advertising plan"
    zh: "撰写一份专业的广告计划"
    zh-TW: "撰寫一份專業的廣告企劃"
    ja: "本格的な広告計画を作る"
    ko: "전문적인 광고 기획안 작성하기"
    vi: "Viết một kế hoạch quảng cáo chuyên nghiệp"
    ms: "Tulis pelan pengiklanan yang profesional"
    id: "Menyusun rencana iklan yang profesional"
    hi: "एक प्रोफ़ेशनल विज्ञापन योजना लिखना"
