code: COMP90048
year: 2027
learn:
  en: "Functional and logic programming: recursion, strong types, higher-order functions, laziness, monads and backtracking."
  zh: "函数式与逻辑编程：递归、强类型、高阶函数、惰性求值、单子与回溯。"
  zh-TW: "函數式與邏輯程式設計：遞迴、強型別、高階函數、惰性求值、單子與回溯。"
  ja: "関数型・論理型プログラミング：再帰、強い型、高階関数、遅延評価、モナド、バックトラック。"
  ko: "함수형·논리형 프로그래밍: 재귀, 강타입, 고차 함수, 지연 평가, 모나드, 백트래킹."
  vi: "Lập trình hàm và logic: đệ quy, kiểu mạnh, hàm bậc cao, đánh giá lười, monad, quay lui."
  ms: "Pengaturcaraan fungsian dan logik: rekursi, jenis kuat, fungsi tertib tinggi, malas, monad, jejak balik."
  id: "Pemrograman fungsional dan logika: rekursi, tipe kuat, fungsi orde tinggi, lazy, monad, backtracking."
  hi: "फ़ंक्शनल और लॉजिक प्रोग्रामिंग: रिकर्शन, स्ट्रॉन्ग टाइप, हायर-ऑर्डर फ़ंक्शन, लेज़ी, मोनाड, बैकट्रैकिंग।"
outcomes:
  - en: "Write programs in functional and logic styles"
    zh: "用函数式和逻辑式风格编程"
    zh-TW: "用函數式與邏輯式風格寫程式"
    ja: "関数型・論理型で書く"
    ko: "함수형·논리형 스타일로 프로그래밍하기"
    vi: "Viết chương trình theo kiểu hàm và logic"
    ms: "Tulis program gaya fungsian dan logik"
    id: "Menulis program gaya fungsional dan logika"
    hi: "फ़ंक्शनल और लॉजिक शैली में प्रोग्राम लिखना"
  - en: "Use type systems to catch errors early"
    zh: "利用类型系统及早发现错误"
    zh-TW: "利用型別系統及早發現錯誤"
    ja: "型システムで誤りを早く見つける"
    ko: "타입 시스템으로 오류 미리 잡기"
    vi: "Dùng hệ kiểu để bắt lỗi sớm"
    ms: "Guna sistem jenis untuk kesan ralat awal"
    id: "Memakai sistem tipe untuk menangkap galat lebih awal"
    hi: "टाइप सिस्टम से गलतियाँ जल्दी पकड़ना"
