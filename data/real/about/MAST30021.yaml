code: MAST30021
year: 2026
learn:
  en: "Calculus with complex numbers, a tool for equations that are hard to solve with real numbers alone."
  zh: "复数上的微积分，能解只用实数难解的方程。"
  zh-TW: "複數上的微積分，能解只用實數難解的方程。"
  ja: "複素数の微積分。実数だけでは解きにくい方程式のための道具。"
  ko: "복소수 미적분. 실수만으로는 풀기 어려운 방정식을 위한 도구."
  vi: "Giải tích số phức, công cụ cho phương trình khó giải chỉ bằng số thực."
  ms: "Kalkulus nombor kompleks, alat untuk persamaan yang sukar diselesaikan dengan nombor nyata sahaja."
  id: "Kalkulus bilangan kompleks, alat untuk persamaan yang sulit diselesaikan hanya dengan bilangan real."
  hi: "सम्मिश्र संख्याओं का कैलकुलस, उन समीकरणों के लिए जो सिर्फ़ वास्तविक संख्याओं से मुश्किल हैं।"
outcomes:
  - en: "Check whether a complex function is holomorphic"
    zh: "判断复函数是否全纯"
    zh-TW: "判斷複變函數是否全純"
    ja: "複素関数が正則か判定する"
    ko: "복소함수가 정칙인지 확인하기"
    vi: "Kiểm tra hàm phức có chỉnh hình không"
    ms: "Menyemak sama ada fungsi kompleks holomorfik"
    id: "Mengecek apakah fungsi kompleks holomorfik"
    hi: "जाँचना कि सम्मिश्र फ़ंक्शन होलोमॉर्फ़िक है या नहीं"
  - en: "Evaluate integrals with contour integration"
    zh: "用围道积分算积分"
    zh-TW: "用圍道積分算積分"
    ja: "周回積分で積分を計算する"
    ko: "경로적분으로 적분 계산하기"
    vi: "Tính tích phân bằng tích phân đường bao"
    ms: "Menilai kamiran dengan kamiran kontur"
    id: "Menghitung integral dengan integrasi kontur"
    hi: "कंटूर इंटीग्रेशन से इंटीग्रल निकालना"
  - en: "Apply the residue theorem"
    zh: "会用留数定理"
    zh-TW: "會用留數定理"
    ja: "留数定理を使う"
    ko: "유수 정리 적용하기"
    vi: "Áp dụng định lý thặng dư"
    ms: "Menggunakan teorem reja"
    id: "Menerapkan teorema residu"
    hi: "रेज़िड्यू प्रमेय लागू करना"
