code: ECOM90004
year: 2027
learn:
  en: "Forecasting economic and financial time series with ARIMA, VAR, cointegration and ARCH models."
  zh: "用 ARIMA、VAR、协整和 ARCH 模型预测经济金融时间序列。"
  zh-TW: "用 ARIMA、VAR、共整合與 ARCH 模型預測經濟金融時間序列。"
  ja: "ARIMA・VAR・共和分・ARCHモデルで経済・金融の時系列を予測する。"
  ko: "ARIMA, VAR, 공적분, ARCH 모형으로 경제·금융 시계열 예측."
  vi: "Dự báo chuỗi thời gian kinh tế, tài chính bằng ARIMA, VAR, đồng liên kết và ARCH."
  ms: "Meramal siri masa ekonomi dan kewangan dengan ARIMA, VAR, kointegrasi dan ARCH."
  id: "Meramalkan deret waktu ekonomi dan keuangan dengan ARIMA, VAR, kointegrasi, dan ARCH."
  hi: "ARIMA, VAR, कोइंटीग्रेशन और ARCH से आर्थिक व वित्तीय टाइम सीरीज़ का पूर्वानुमान।"
outcomes:
  - en: "Build Box-Jenkins forecasting models"
    zh: "建立 Box-Jenkins 预测模型"
    zh-TW: "建立 Box-Jenkins 預測模型"
    ja: "Box-Jenkins予測モデルを作る"
    ko: "Box-Jenkins 예측 모형 만들기"
    vi: "Xây dựng mô hình dự báo Box-Jenkins"
    ms: "Membina model ramalan Box-Jenkins"
    id: "Membangun model peramalan Box-Jenkins"
    hi: "Box-Jenkins पूर्वानुमान मॉडल बनाना"
  - en: "Model and forecast financial volatility"
    zh: "为金融波动建模并预测"
    zh-TW: "為金融波動建模並預測"
    ja: "金融市場のボラティリティを予測する"
    ko: "금융 변동성 모형화·예측하기"
    vi: "Mô hình hóa và dự báo biến động tài chính"
    ms: "Memodel dan meramal volatiliti kewangan"
    id: "Memodelkan dan meramalkan volatilitas keuangan"
    hi: "वित्तीय उतार-चढ़ाव का मॉडल व पूर्वानुमान"
