code: ARCH10003
year: 2026
learn:
  en: "First architecture studio: generate ideas, shape spaces and forms, and present them in drawings and models."
  zh: "第一门建筑设计工作室：产生构想、塑造空间与形体，用图纸和模型表达。"
  zh-TW: "第一門建築設計工作室：發想、塑造空間與形體，用圖面和模型表達。"
  ja: "最初の建築スタジオ：アイデアを出し、空間と形をつくり、図面と模型で伝える。"
  ko: "첫 건축 스튜디오: 아이디어를 내고 공간과 형태를 만들어 도면과 모형으로 표현한다."
  vi: "Studio kiến trúc đầu tiên: nảy ý tưởng, tạo không gian và hình khối, trình bày bằng bản vẽ và mô hình."
  ms: "Studio seni bina pertama: jana idea, bentuk ruang dan rupa, dan bentangkan melalui lukisan dan model."
  id: "Studio arsitektur pertama: menggali ide, membentuk ruang, lalu menyajikannya lewat gambar dan maket."
  hi: "पहला आर्किटेक्चर स्टूडियो: विचार बनाना, स्पेस और रूप गढ़ना, ड्रॉइंग और मॉडल से दिखाना।"
outcomes:
  - en: "Develop a design idea into an architectural form"
    zh: "把设计构想发展成建筑形式"
    zh-TW: "把設計構想發展成建築形式"
    ja: "アイデアを建築の形に発展させる"
    ko: "설계 아이디어를 건축 형태로 발전시키기"
    vi: "Phát triển ý tưởng thành hình thức kiến trúc"
    ms: "Kembangkan idea menjadi bentuk seni bina"
    id: "Mengembangkan ide menjadi bentuk arsitektur"
    hi: "डिज़ाइन विचार को आर्किटेक्चरल रूप में विकसित करना"
  - en: "Consider site, space and structure in a design"
    zh: "在设计中考虑场地、空间与结构"
    zh-TW: "在設計中考慮基地、空間與結構"
    ja: "敷地・空間・構造を設計で考える"
    ko: "설계에서 대지·공간·구조 고려하기"
    vi: "Cân nhắc khu đất, không gian và kết cấu"
    ms: "Ambil kira tapak, ruang dan struktur"
    id: "Mempertimbangkan tapak, ruang, dan struktur"
    hi: "डिज़ाइन में साइट, स्पेस और संरचना पर विचार करना"
  - en: "Present a proposal with 2D and 3D models"
    zh: "用二维和三维模型展示方案"
    zh-TW: "用 2D 與 3D 模型展示方案"
    ja: "2D・3Dモデルで提案を示す"
    ko: "2D·3D 모델로 제안 발표하기"
    vi: "Trình bày đề xuất bằng mô hình 2D và 3D"
    ms: "Bentang cadangan dengan model 2D dan 3D"
    id: "Menyajikan usulan dengan model 2D dan 3D"
    hi: "2D और 3D मॉडल से प्रस्ताव पेश करना"
