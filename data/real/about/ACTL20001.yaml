code: ACTL20001
year: 2026
learn:
  en: "The maths of money over time: interest rates, present values, bonds, loans and judging investment projects."
  zh: "资金的时间价值数学：利率、现值、债券、贷款和投资项目评估。"
  zh-TW: "資金的時間價值數學：利率、現值、債券、貸款和投資案評估。"
  ja: "お金の時間価値の数学：金利、現在価値、債券、ローン、投資案件の評価。"
  ko: "돈의 시간 가치 수학: 이자율, 현재가치, 채권, 대출, 투자안 평가."
  vi: "Toán về giá trị tiền theo thời gian: lãi suất, hiện giá, trái phiếu, khoản vay và đánh giá dự án đầu tư."
  ms: "Matematik nilai wang mengikut masa: kadar faedah, nilai kini, bon, pinjaman dan penilaian projek pelaburan."
  id: "Matematika nilai waktu uang: suku bunga, nilai kini, obligasi, pinjaman, dan penilaian proyek investasi."
  hi: "समय के साथ पैसे का गणित: ब्याज दर, वर्तमान मूल्य, बॉन्ड, लोन और निवेश प्रोजेक्ट का आकलन।"
outcomes:
  - en: "Find present and future values of payment streams"
    zh: "计算一系列付款的现值和终值"
    zh-TW: "計算一系列付款的現值與終值"
    ja: "支払いの流れの現在価値と将来価値を求める"
    ko: "지급 흐름의 현재가치와 미래가치 구하기"
    vi: "Tính hiện giá và giá trị tương lai của dòng tiền"
    ms: "Kira nilai kini dan nilai masa depan aliran bayaran"
    id: "Menghitung nilai kini dan nilai akan datang arus pembayaran"
    hi: "भुगतानों की श्रृंखला का वर्तमान और भविष्य मूल्य निकालना"
  - en: "Price bonds and build loan schedules"
    zh: "给债券定价并编制还款计划"
    zh-TW: "替債券定價並編製還款計畫"
    ja: "債券価格を計算し返済表を作る"
    ko: "채권 가격 산정과 상환 일정표 작성"
    vi: "Định giá trái phiếu và lập lịch trả nợ"
    ms: "Tentukan harga bon dan bina jadual pinjaman"
    id: "Menghitung harga obligasi dan menyusun jadwal pinjaman"
    hi: "बॉन्ड की कीमत निकालना और लोन शेड्यूल बनाना"
  - en: "Appraise projects with discounted cash flows"
    zh: "用折现现金流评估项目"
    zh-TW: "用折現現金流量評估投資案"
    ja: "割引キャッシュフローで案件を評価する"
    ko: "현금흐름 할인법으로 투자안 평가"
    vi: "Thẩm định dự án bằng dòng tiền chiết khấu"
    ms: "Nilai projek dengan aliran tunai terdiskaun"
    id: "Menilai proyek dengan arus kas terdiskonto"
    hi: "डिस्काउंटेड कैश फ़्लो से प्रोजेक्ट का आकलन"
