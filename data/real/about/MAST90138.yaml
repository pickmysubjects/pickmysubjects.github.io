code: MAST90138
year: 2027
learn:
  en: "Methods for high-dimensional data: classification, clustering and dimension reduction, both parametric and not."
  zh: "高维数据方法：分类、聚类与降维，包括参数和非参数方法。"
  zh-TW: "高維資料方法：分類、分群與降維，包括母數與無母數方法。"
  ja: "高次元データの手法：分類、クラスタリング、次元削減（パラ・ノンパラ）。"
  ko: "고차원 자료 방법: 분류, 군집, 차원 축소(모수·비모수)."
  vi: "Phương pháp cho dữ liệu nhiều chiều: phân loại, phân cụm, giảm chiều, có và không tham số."
  ms: "Kaedah data berdimensi tinggi: klasifikasi, pengelompokan dan pengurangan dimensi, parametrik dan bukan."
  id: "Metode data berdimensi tinggi: klasifikasi, klasterisasi, reduksi dimensi, parametrik dan non."
  hi: "हाई-डायमेंशनल डेटा की विधियाँ: क्लासिफ़िकेशन, क्लस्टरिंग, डायमेंशन रिडक्शन।"
outcomes:
  - en: "Reduce the dimension of large multivariate data"
    zh: "对大型多元数据降维"
    zh-TW: "對大型多變量資料降維"
    ja: "多変量データの次元を削減する"
    ko: "다변량 자료 차원 축소하기"
    vi: "Giảm chiều dữ liệu đa biến lớn"
    ms: "Mengurangkan dimensi data multivariat besar"
    id: "Mereduksi dimensi data multivariat besar"
    hi: "बड़े मल्टीवेरिएट डेटा का डायमेंशन घटाना"
  - en: "Classify and cluster high-dimensional data"
    zh: "对高维数据进行分类与聚类"
    zh-TW: "對高維資料進行分類與分群"
    ja: "高次元データを分類・クラスタリングする"
    ko: "고차원 자료 분류·군집하기"
    vi: "Phân loại và phân cụm dữ liệu nhiều chiều"
    ms: "Mengklasifikasi dan mengelompok data berdimensi tinggi"
    id: "Mengklasifikasi dan mengklaster data berdimensi tinggi"
    hi: "हाई-डायमेंशनल डेटा को क्लासिफ़ाई और क्लस्टर करना"
