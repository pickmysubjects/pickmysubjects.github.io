code: GEOM90041
year: 2027
learn:
  en: "The law and practice of surveying property boundaries in Victoria, from field work to plans."
  zh: "维多利亚州产权边界测量的法律与实务，从外业到绘制图件。"
  zh-TW: "維多利亞州產權邊界測量的法律與實務，從外業到繪製圖件。"
  ja: "ビクトリア州での土地境界測量の法律と実務、現地作業から図面作成まで。"
  ko: "빅토리아주 토지 경계 측량의 법과 실무, 현장 작업부터 도면까지."
  vi: "Luật và thực hành đo đạc ranh giới đất ở Victoria, từ thực địa đến bản vẽ."
  ms: "Undang-undang dan amalan ukur sempadan hartanah di Victoria, daripada kerja lapangan hingga pelan."
  id: "Hukum dan praktik survei batas properti di Victoria, dari lapangan hingga gambar rencana."
  hi: "विक्टोरिया में संपत्ति सीमा सर्वेक्षण का क़ानून और अभ्यास, फ़ील्ड कार्य से नक़्शे तक।"
outcomes:
  - en: "Know the legal and technical rules for a cadastral survey"
    zh: "了解地籍测量的法律和技术要求"
    zh-TW: "了解地籍測量的法律與技術要求"
    ja: "地籍測量の法的・技術的要件を知る"
    ko: "지적 측량의 법적·기술적 요건 알기"
    vi: "Nắm quy định pháp lý và kỹ thuật cho đo đạc địa chính"
    ms: "Mengetahui peraturan undang-undang dan teknikal untuk ukur kadaster"
    id: "Memahami aturan hukum dan teknis survei kadaster"
    hi: "कैडस्ट्रल सर्वे के क़ानूनी और तकनीकी नियम जानना"
  - en: "Carry out a cadastral survey in practice"
    zh: "实际完成一次地籍测量"
    zh-TW: "實際完成一次地籍測量"
    ja: "実際に地籍測量を行う"
    ko: "실제로 지적 측량 수행하기"
    vi: "Thực hiện một cuộc đo đạc địa chính"
    ms: "Menjalankan ukur kadaster secara praktikal"
    id: "Melakukan survei kadaster secara langsung"
    hi: "व्यवहार में कैडस्ट्रल सर्वे करना"
  - en: "Produce survey computations and plans with software and CAD"
    zh: "用软件和 CAD 完成测量计算并绘制图件"
    zh-TW: "用軟體與 CAD 完成測量計算並繪製圖件"
    ja: "ソフトと CAD で測量計算と図面作成を行う"
    ko: "소프트웨어와 CAD로 측량 계산 및 도면 작성하기"
    vi: "Tính toán đo đạc và lập bản vẽ bằng phần mềm và CAD"
    ms: "Menghasilkan pengiraan ukur dan pelan dengan perisian dan CAD"
    id: "Membuat perhitungan survei dan gambar dengan perangkat lunak dan CAD"
    hi: "सॉफ़्टवेयर और CAD से सर्वे गणना और नक़्शे बनाना"
