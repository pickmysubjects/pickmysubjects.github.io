code: CLAS30004
year: 2026
learn:
  en: "Two semesters of beginner Latin in one: grammar, sentence building, translation and simple texts, with some Roman culture."
  zh: "一门课学完两学期的拉丁语入门：语法、造句、翻译和简单文本，并介绍罗马文化。"
  zh-TW: "一門課學完兩學期的拉丁語入門：文法、造句、翻譯和簡單文本，並介紹羅馬文化。"
  ja: "2学期分のラテン語入門を1科目で。文法、文の組み立て、翻訳、やさしい文章、ローマ文化も少し。"
  ko: "두 학기 분량의 라틴어 입문을 한 과목에. 문법, 문장 구성, 번역, 쉬운 글, 로마 문화도 조금."
  vi: "Hai học kỳ Latinh nhập môn gộp làm một: ngữ pháp, đặt câu, dịch và văn bản đơn giản, kèm chút văn hóa La Mã."
  ms: "Dua semester Latin permulaan dalam satu: tatabahasa, binaan ayat, terjemahan dan teks mudah, serta sedikit budaya Rom."
  id: "Dua semester Latin pemula dalam satu: tata bahasa, menyusun kalimat, terjemahan dan teks sederhana, plus sedikit budaya Romawi."
  hi: "एक ही विषय में दो सेमेस्टर की शुरुआती लैटिन: व्याकरण, वाक्य-रचना, अनुवाद, सरल पाठ और कुछ रोमन संस्कृति।"
outcomes:
  - en: "Learn the core grammar and vocabulary of Latin"
    zh: "掌握拉丁语的核心语法和词汇"
    zh-TW: "掌握拉丁語的核心文法和詞彙"
    ja: "ラテン語の基本文法と語彙を身につける"
    ko: "라틴어의 핵심 문법과 어휘 익히기"
    vi: "Nắm ngữ pháp và từ vựng cốt lõi của tiếng Latinh"
    ms: "Kuasai tatabahasa dan kosa kata teras bahasa Latin"
    id: "Menguasai tata bahasa dan kosakata inti bahasa Latin"
    hi: "लैटिन का मूल व्याकरण और शब्दावली सीखना"
  - en: "Read simple Latin sentences and texts"
    zh: "阅读简单的拉丁语句子和文本"
    zh-TW: "閱讀簡單的拉丁語句子和文本"
    ja: "やさしいラテン語の文や文章を読む"
    ko: "쉬운 라틴어 문장과 글 읽기"
    vi: "Đọc câu và văn bản tiếng Latinh đơn giản"
    ms: "Baca ayat dan teks bahasa Latin yang mudah"
    id: "Membaca kalimat dan teks bahasa Latin sederhana"
    hi: "सरल लैटिन वाक्य और पाठ पढ़ना"
  - en: "Translate short Latin passages into English"
    zh: "把简短的拉丁语段落译成英语"
    zh-TW: "把簡短的拉丁語段落譯成英語"
    ja: "短いラテン語の文章を英語に訳す"
    ko: "짧은 라틴어 글을 영어로 번역하기"
    vi: "Dịch đoạn tiếng Latinh ngắn sang tiếng Anh"
    ms: "Terjemah petikan bahasa Latin pendek ke bahasa Inggeris"
    id: "Menerjemahkan bagian bahasa Latin pendek ke bahasa Inggris"
    hi: "छोटे लैटिन अंशों का अंग्रेज़ी में अनुवाद करना"
