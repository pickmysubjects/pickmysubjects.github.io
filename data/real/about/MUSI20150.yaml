code: MUSI20150
year: 2026
learn:
  en: "Why music helps (or doesn't) with mental, physical and social health, and how it is used in hospitals, schools and communities."
  zh: "音乐为何能（或不能）帮助身心与社交健康，及其在医院、学校、社区的应用。"
  zh-TW: "音樂為何能（或不能）幫助身心與社交健康，及其在醫院、學校、社區的應用。"
  ja: "音楽が心身や社会的健康にどう効くか、病院・学校・地域での使われ方。"
  ko: "음악이 몸·마음·사회적 건강에 왜 도움이 되는지, 병원·학교·지역에서의 활용."
  vi: "Vì sao âm nhạc giúp (hoặc không) sức khỏe tinh thần, thể chất, xã hội, và cách dùng ở bệnh viện, trường học."
  ms: "Mengapa muzik membantu kesihatan mental, fizikal dan sosial, serta penggunaannya di hospital dan sekolah."
  id: "Mengapa musik membantu kesehatan mental, fisik dan sosial, serta pemakaiannya di rumah sakit dan sekolah."
  hi: "संगीत मानसिक, शारीरिक और सामाजिक स्वास्थ्य में क्यों मदद करता है, और अस्पतालों-स्कूलों में इसका उपयोग।"
outcomes:
  - en: "Explain how music can support health and wellbeing"
    zh: "说明音乐如何促进健康与幸福感"
    zh-TW: "說明音樂如何促進健康與幸福感"
    ja: "音楽が健康と幸福をどう支えるか説明する"
    ko: "음악이 건강과 웰빙을 돕는 방식 설명하기"
    vi: "Giải thích âm nhạc hỗ trợ sức khỏe ra sao"
    ms: "Terangkan cara muzik menyokong kesejahteraan"
    id: "Menjelaskan cara musik mendukung kesehatan"
    hi: "संगीत स्वास्थ्य और कल्याण में कैसे मदद करता है, समझाना"
  - en: "Know when music helps and when it can harm"
    zh: "了解音乐何时有益、何时有害"
    zh-TW: "了解音樂何時有益、何時有害"
    ja: "音楽が役立つ時と害になる時を知る"
    ko: "음악이 도움이 될 때와 해가 될 때 알기"
    vi: "Biết khi nào âm nhạc có ích, khi nào gây hại"
    ms: "Tahu bila muzik membantu dan bila ia merugikan"
    id: "Tahu kapan musik membantu dan kapan merugikan"
    hi: "जानना कि संगीत कब मदद करता है और कब नुकसान"
  - en: "Apply these ideas to real-life cases"
    zh: "把这些知识应用到实际案例"
    zh-TW: "把這些知識應用到實際案例"
    ja: "実際の事例に応用する"
    ko: "실제 사례에 적용하기"
    vi: "Áp dụng vào tình huống thực tế"
    ms: "Gunakan idea ini pada kes sebenar"
    id: "Menerapkan gagasan ini pada kasus nyata"
    hi: "इन विचारों को वास्तविक मामलों पर लागू करना"
