code: FNCE30011
year: 2026
learn:
  en: "How to value companies, projects and private equity using cash flow and multiples methods."
  zh: "用现金流和乘数方法为公司、项目和私募股权估值。"
  zh-TW: "用現金流量和乘數法為公司、專案和私募股權估值。"
  ja: "キャッシュフロー法と倍率法で企業・事業・PEを評価する方法。"
  ko: "현금흐름법과 배수법으로 기업·프로젝트·사모펀드 가치평가하기."
  vi: "Cách định giá công ty, dự án và cổ phần tư nhân bằng phương pháp dòng tiền và hệ số."
  ms: "Cara menilai syarikat, projek dan ekuiti persendirian dengan kaedah aliran tunai dan gandaan."
  id: "Cara menilai perusahaan, proyek, dan ekuitas swasta dengan metode arus kas dan kelipatan."
  hi: "कैश फ़्लो और मल्टीपल तरीकों से कंपनियों, प्रोजेक्ट और प्राइवेट इक्विटी का मूल्यांकन।"
outcomes:
  - en: "Value a business with cash flow and multiples"
    zh: "用现金流和乘数为企业估值"
    zh-TW: "用現金流量和乘數為企業估值"
    ja: "キャッシュフローと倍率で企業価値を出す"
    ko: "현금흐름과 배수로 기업 가치평가하기"
    vi: "Định giá doanh nghiệp bằng dòng tiền và hệ số"
    ms: "Nilai perniagaan dengan aliran tunai dan gandaan"
    id: "Menilai bisnis dengan arus kas dan kelipatan"
    hi: "कैश फ़्लो और मल्टीपल से बिज़नेस का मूल्यांकन करना"
  - en: "Estimate discount rates and adjust for leverage"
    zh: "估算折现率并调整杠杆影响"
    zh-TW: "估算折現率並調整槓桿影響"
    ja: "割引率を推定しレバレッジを調整する"
    ko: "할인율 추정하고 레버리지 조정하기"
    vi: "Ước tính lãi suất chiết khấu và điều chỉnh đòn bẩy"
    ms: "Anggar kadar diskaun dan laras untuk leveraj"
    id: "Mengestimasi tingkat diskonto dan menyesuaikan leverage"
    hi: "डिस्काउंट रेट अनुमानित करना और लीवरेज के लिए समायोजन करना"
  - en: "Judge which valuation method fits the case"
    zh: "判断哪种估值方法适用"
    zh-TW: "判斷哪種估值方法適用"
    ja: "どの評価手法が適切か判断する"
    ko: "어떤 가치평가 방법이 맞는지 판단하기"
    vi: "Đánh giá phương pháp định giá nào phù hợp"
    ms: "Nilai kaedah penilaian mana yang sesuai"
    id: "Menilai metode valuasi mana yang cocok"
    hi: "तय करना कि कौन-सा मूल्यांकन तरीका सही है"
