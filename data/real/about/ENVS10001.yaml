code: ENVS10001
year: 2026
learn:
  en: "The natural systems behind farming and land management: soils, climate, water and landscapes."
  zh: "支撑农业和土地管理的自然系统：土壤、气候、水和地貌。"
  zh-TW: "支撐農業和土地管理的自然系統：土壤、氣候、水和地貌。"
  ja: "農業と土地管理を支える自然のしくみ：土壌、気候、水、地形。"
  ko: "농업과 토지 관리를 떠받치는 자연 시스템: 토양, 기후, 물, 경관."
  vi: "Các hệ tự nhiên nền tảng cho nông nghiệp và quản lý đất: đất, khí hậu, nước và cảnh quan."
  ms: "Sistem semula jadi di sebalik pertanian dan pengurusan tanah: tanih, iklim, air dan landskap."
  id: "Sistem alam di balik pertanian dan pengelolaan lahan: tanah, iklim, air, dan bentang alam."
  hi: "खेती और भूमि प्रबंधन के पीछे के प्राकृतिक तंत्र: मिट्टी, जलवायु, पानी और भू-दृश्य।"
outcomes:
  - en: "Quantify the water cycle and stream flow"
    zh: "量化水循环和河流径流"
    zh-TW: "量化水循環和河川逕流"
    ja: "水循環と河川流量を定量化する"
    ko: "물 순환과 하천 유량을 정량화한다"
    vi: "Định lượng vòng tuần hoàn nước và dòng chảy"
    ms: "Kuantifikasi kitaran air dan aliran sungai"
    id: "Mengukur siklus air dan aliran sungai"
    hi: "जल चक्र और नदी प्रवाह का आकलन करना"
  - en: "Analyse landscapes and land systems"
    zh: "分析地貌与土地系统"
    zh-TW: "分析地貌與土地系統"
    ja: "地形と土地システムを分析する"
    ko: "경관과 토지 시스템을 분석한다"
    vi: "Phân tích cảnh quan và hệ thống đất"
    ms: "Analisis landskap dan sistem tanah"
    id: "Menganalisis bentang alam dan sistem lahan"
    hi: "भू-दृश्य और भूमि प्रणालियों का विश्लेषण"
