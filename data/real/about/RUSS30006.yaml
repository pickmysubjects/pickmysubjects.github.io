code: RUSS30006
year: 2026
learn:
  en: "Russian major capstone: study society and culture in today's Russia, then research a topic you choose and present it."
  zh: "俄语专业毕业课：学习当今俄罗斯的社会与文化，再自选题目做研究并展示。"
  zh-TW: "俄語主修畢業課：學習當今俄羅斯的社會與文化，再自選題目做研究並展示。"
  ja: "ロシア語専攻の総まとめ科目。現代ロシアの社会と文化を学び、自分で選んだテーマを研究して発表する。"
  ko: "러시아어 전공 캡스톤. 오늘날 러시아의 사회와 문화를 배운 뒤 직접 고른 주제를 연구해 발표한다."
  vi: "Môn tổng kết chuyên ngành tiếng Nga: học về xã hội, văn hóa Nga ngày nay, rồi tự chọn đề tài nghiên cứu và trình bày."
  ms: "Subjek puncak major Rusia: kaji masyarakat dan budaya Rusia kini, kemudian selidik topik pilihan sendiri dan bentangkannya."
  id: "Mata kuliah puncak jurusan Rusia: pelajari masyarakat dan budaya Rusia kini, lalu teliti topik pilihan sendiri dan presentasikan."
  hi: "रूसी मेजर का कैपस्टोन: आज के रूस का समाज और संस्कृति पढ़ना, फिर अपनी पसंद के विषय पर शोध कर प्रस्तुत करना।"
outcomes:
  - en: "Discuss today's Russian society and culture in Russian"
    zh: "用俄语讨论当今俄罗斯社会与文化"
    zh-TW: "用俄語討論當今俄羅斯社會與文化"
    ja: "現代ロシアの社会と文化をロシア語で論じる"
    ko: "오늘날 러시아 사회와 문화를 러시아어로 토론하기"
    vi: "Thảo luận xã hội, văn hóa Nga ngày nay bằng tiếng Nga"
    ms: "Bincangkan masyarakat dan budaya Rusia kini dalam bahasa Rusia"
    id: "Membahas masyarakat dan budaya Rusia kini dalam bahasa Rusia"
    hi: "आज के रूसी समाज और संस्कृति पर रूसी में चर्चा करना"
  - en: "Research a topic of your own choice in depth"
    zh: "深入研究自选的题目"
    zh-TW: "深入研究自選的題目"
    ja: "自分で選んだテーマを深く研究する"
    ko: "직접 고른 주제를 깊이 연구하기"
    vi: "Nghiên cứu sâu một đề tài tự chọn"
    ms: "Selidik secara mendalam topik pilihan sendiri"
    id: "Meneliti secara mendalam topik pilihan sendiri"
    hi: "अपनी पसंद के विषय पर गहराई से शोध करना"
  - en: "Present your research and reflect on your skills"
    zh: "展示研究成果并反思所学能力"
    zh-TW: "展示研究成果並反思所學能力"
    ja: "研究を発表し、身につけた力を振り返る"
    ko: "연구를 발표하고 익힌 역량 돌아보기"
    vi: "Trình bày nghiên cứu và nhìn lại kỹ năng đã học"
    ms: "Bentangkan kajian dan renungkan kemahiran diri"
    id: "Mempresentasikan riset dan merefleksikan keterampilan"
    hi: "अपना शोध प्रस्तुत करना और सीखे कौशलों पर विचार करना"
