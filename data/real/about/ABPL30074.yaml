code: ABPL30074
year: 2026
learn:
  en: "Interior Design capstone: design sustainable, accessible retrofits of existing interiors for real client needs."
  zh: "室内设计方向毕业设计课：为现有室内空间做可持续、无障碍的改造设计，回应真实客户需求。"
  zh-TW: "室內設計方向畢業設計課：為既有室內空間做永續、無障礙的改造設計，回應真實客戶需求。"
  ja: "インテリアデザインの総仕上げ。既存の室内を、持続可能でバリアフリーに、依頼主の要望に沿って改修設計する。"
  ko: "실내디자인 캡스톤. 기존 실내를 실제 의뢰인 요구에 맞춰 지속가능하고 접근성 있게 리모델링 설계한다."
  vi: "Môn tốt nghiệp Thiết kế nội thất: cải tạo nội thất hiện có theo hướng bền vững, dễ tiếp cận, đúng nhu cầu khách."
  ms: "Kemuncak Reka Bentuk Dalaman: reka ubah suai ruang sedia ada yang lestari dan mesra akses untuk keperluan klien."
  id: "Capstone Desain Interior: merancang renovasi interior yang berkelanjutan dan aksesibel sesuai kebutuhan klien."
  hi: "इंटीरियर डिज़ाइन कैपस्टोन: मौजूदा इंटीरियर का टिकाऊ, सुलभ रेट्रोफ़िट, असली क्लाइंट की ज़रूरत के हिसाब से।"
outcomes:
  - en: "Redesign an existing interior for a new use"
    zh: "为新用途重新设计现有室内空间"
    zh-TW: "為新用途重新設計既有室內空間"
    ja: "既存の室内を新しい用途に再設計する"
    ko: "기존 실내를 새 용도로 재설계하기"
    vi: "Thiết kế lại nội thất cũ cho công năng mới"
    ms: "Reka semula ruang dalaman untuk kegunaan baharu"
    id: "Merancang ulang interior lama untuk fungsi baru"
    hi: "मौजूदा इंटीरियर को नए उपयोग के लिए बदलना"
  - en: "Build sustainability and accessibility into a design"
    zh: "在设计中融入可持续性和无障碍"
    zh-TW: "在設計中融入永續與無障礙"
    ja: "設計に持続可能性とバリアフリーを組み込む"
    ko: "설계에 지속가능성과 접근성 반영하기"
    vi: "Đưa tính bền vững và tiếp cận vào thiết kế"
    ms: "Masukkan kelestarian dan akses dalam reka bentuk"
    id: "Memasukkan keberlanjutan dan aksesibilitas"
    hi: "डिज़ाइन में टिकाऊपन और सुलभता शामिल करना"
  - en: "Respond to a client's brief and needs"
    zh: "回应客户的设计要求和需求"
    zh-TW: "回應客戶的設計要求與需求"
    ja: "依頼主の要望に応える"
    ko: "의뢰인의 요구와 필요에 대응하기"
    vi: "Đáp ứng yêu cầu và nhu cầu của khách hàng"
    ms: "Penuhi taklimat dan keperluan klien"
    id: "Menjawab brief dan kebutuhan klien"
    hi: "क्लाइंट के ब्रीफ़ और ज़रूरतों का जवाब देना"
