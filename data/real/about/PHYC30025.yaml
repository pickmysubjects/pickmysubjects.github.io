code: PHYC30025
year: 2026
learn:
  en: "The social and ethical questions raised by astronomy and space exploration, with a focus on Indigenous issues and dark skies."
  zh: "天文学和太空探索带来的社会与伦理问题，重点关注原住民议题和夜空保护。"
  zh-TW: "天文學和太空探索帶來的社會與倫理問題，重點關注原住民議題和夜空保護。"
  ja: "天文学と宇宙開発が投げかける社会的・倫理的な問いを、先住民の問題と暗い夜空の保護を中心に学ぶ。"
  ko: "천문학과 우주 탐사가 던지는 사회·윤리적 질문을 원주민 문제와 밤하늘 보호를 중심으로 배운다."
  vi: "Các câu hỏi xã hội và đạo đức từ thiên văn học và khám phá không gian, chú trọng vấn đề bản địa và bầu trời đêm."
  ms: "Persoalan sosial dan etika daripada astronomi dan penerokaan angkasa, dengan tumpuan isu Orang Asal dan langit gelap."
  id: "Pertanyaan sosial dan etis dari astronomi dan eksplorasi antariksa, dengan fokus isu adat dan langit gelap."
  hi: "खगोलशास्त्र और अंतरिक्ष खोज से उठने वाले सामाजिक और नैतिक प्रश्न, मूलनिवासी मुद्दों और अंधेरे आकाश पर ज़ोर के साथ।"
outcomes:
  - en: "Discuss social issues in astronomy research"
    zh: "讨论天文研究中的社会问题"
    zh-TW: "討論天文研究中的社會問題"
    ja: "天文学研究の社会的問題を論じる"
    ko: "천문학 연구의 사회 문제 논의하기"
    vi: "Thảo luận vấn đề xã hội trong nghiên cứu thiên văn"
    ms: "Bincangkan isu sosial dalam penyelidikan astronomi"
    id: "Membahas isu sosial dalam riset astronomi"
    hi: "खगोल शोध में सामाजिक मुद्दों पर चर्चा करना"
  - en: "Explain Indigenous views on the sky and space"
    zh: "解释原住民对天空与太空的观点"
    zh-TW: "解釋原住民對天空與太空的觀點"
    ja: "空と宇宙についての先住民の見方を説明する"
    ko: "하늘과 우주에 대한 원주민의 관점 설명하기"
    vi: "Giải thích quan điểm bản địa về bầu trời và không gian"
    ms: "Terangkan pandangan Orang Asal tentang langit dan angkasa"
    id: "Menjelaskan pandangan adat tentang langit dan antariksa"
    hi: "आकाश और अंतरिक्ष पर मूलनिवासी दृष्टि समझाना"
  - en: "Assess ethics and policy of space activity"
    zh: "评估太空活动的伦理与政策"
    zh-TW: "評估太空活動的倫理與政策"
    ja: "宇宙活動の倫理と政策を評価する"
    ko: "우주 활동의 윤리와 정책 평가하기"
    vi: "Đánh giá đạo đức và chính sách của hoạt động không gian"
    ms: "Nilai etika dan dasar aktiviti angkasa"
    id: "Menilai etika dan kebijakan kegiatan antariksa"
    hi: "अंतरिक्ष गतिविधियों की नैतिकता और नीति का आकलन करना"
