code: MUSI20212
year: 2026
learn:
  en: "Movement and body awareness for classical singers: fixing physical habits that hold the voice back on stage."
  zh: "古典歌手的动作与身体觉察：改正妨碍舞台发声的身体习惯。"
  zh-TW: "古典歌手的動作與身體覺察：改正妨礙舞台發聲的身體習慣。"
  ja: "クラシック歌手のための動きと身体感覚。舞台で声を妨げる癖を直す。"
  ko: "클래식 가수를 위한 움직임과 신체 인식: 무대 발성을 막는 습관 고치기."
  vi: "Vận động và cảm nhận cơ thể cho ca sĩ cổ điển: sửa thói quen cản trở giọng."
  ms: "Pergerakan dan kesedaran badan untuk penyanyi klasik: baiki tabiat yang menghalang suara."
  id: "Gerak dan kesadaran tubuh bagi penyanyi klasik: memperbaiki kebiasaan yang menghambat suara."
  hi: "शास्त्रीय गायकों के लिए गति और शरीर-बोध: आवाज़ रोकने वाली आदतें सुधारना।"
outcomes:
  - en: "Trace vocal problems back to their physical causes"
    zh: "找出嗓音问题的身体根源"
    zh-TW: "找出嗓音問題的身體根源"
    ja: "声の問題を身体的原因までたどる"
    ko: "발성 문제의 신체적 원인 찾기"
    vi: "Tìm nguyên nhân thể chất của vấn đề giọng hát"
    ms: "Kesan punca fizikal masalah vokal"
    id: "Melacak penyebab fisik masalah vokal"
    hi: "आवाज़ की समस्याओं के शारीरिक कारण खोजना"
  - en: "Observe how movement changes vocal quality"
    zh: "观察动作如何改变音色"
    zh-TW: "觀察動作如何改變音色"
    ja: "動きが声質をどう変えるか観察する"
    ko: "움직임이 음색을 어떻게 바꾸는지 관찰하기"
    vi: "Quan sát chuyển động thay đổi chất giọng ra sao"
    ms: "Perhati cara gerakan mengubah kualiti suara"
    id: "Mengamati gerak yang mengubah kualitas suara"
    hi: "देखना कि हलचल आवाज़ की गुणवत्ता कैसे बदलती है"
  - en: "Use body-based practices to learn and cut stage nerves"
    zh: "用身体练习辅助学习、减轻怯场"
    zh-TW: "用身體練習輔助學習、減輕怯場"
    ja: "身体的な練習で学びを助け緊張を減らす"
    ko: "신체 기반 연습으로 배우고 무대 긴장 줄이기"
    vi: "Dùng bài tập cơ thể để học và giảm run sân khấu"
    ms: "Guna latihan badan untuk belajar dan kurangkan gemuruh"
    id: "Memakai latihan tubuh untuk belajar dan kurangi demam panggung"
    hi: "शरीर-आधारित अभ्यास से सीखना और मंच का डर घटाना"
