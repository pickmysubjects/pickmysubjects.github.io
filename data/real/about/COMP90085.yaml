code: COMP90085
year: 2027
learn:
  en: "Credit for past unpaid IT volunteer work, like open source or school help, through a reflective portfolio; needs coordinator approval."
  zh: "通过反思作品集，为以往的 IT 志愿工作（如开源）获得学分；需协调人批准。"
  zh-TW: "透過反思作品集，為過去的 IT 志工經驗（如開源）取得學分；需協調人核准。"
  ja: "オープンソースなど過去の IT ボランティアを振り返りポートフォリオで単位化。担当者の承認が必要。"
  ko: "오픈소스 등 과거 IT 봉사 경험을 성찰 포트폴리오로 학점 인정; 코디네이터 승인 필요."
  vi: "Nhận tín chỉ cho công việc IT tình nguyện trước đây qua hồ sơ suy ngẫm; cần điều phối viên duyệt."
  ms: "Kredit untuk kerja sukarela IT lalu, seperti sumber terbuka, melalui portfolio reflektif; perlu kelulusan penyelaras."
  id: "Kredit untuk kerja sukarela IT sebelumnya, seperti open source, lewat portofolio reflektif; perlu persetujuan koordinator."
  hi: "पहले किए IT स्वयंसेवी काम (जैसे ओपन सोर्स) के लिए रिफ़्लेक्टिव पोर्टफ़ोलियो से क्रेडिट; कोऑर्डिनेटर की मंज़ूरी ज़रूरी।"
outcomes:
  - en: "Reflect on what you did and learned while volunteering"
    zh: "反思志愿工作中的所做所学"
    zh-TW: "反思志工經驗中的所做所學"
    ja: "ボランティアでの経験と学びを振り返る"
    ko: "봉사하며 한 일과 배운 점 성찰하기"
    vi: "Suy ngẫm việc đã làm và học được khi tình nguyện"
    ms: "Renungkan kerja dan pembelajaran semasa sukarela"
    id: "Merefleksikan apa yang dikerjakan dan dipelajari"
    hi: "स्वयंसेवा में क्या किया और सीखा, उस पर विचार करना"
  - en: "Present your work in a portfolio"
    zh: "用作品集展示你的工作"
    zh-TW: "用作品集展示你的工作"
    ja: "ポートフォリオで成果を示す"
    ko: "포트폴리오로 작업 보여주기"
    vi: "Trình bày công việc trong hồ sơ năng lực"
    ms: "Persembahkan kerja dalam portfolio"
    id: "Menyajikan karya dalam portofolio"
    hi: "पोर्टफ़ोलियो में अपना काम दिखाना"
