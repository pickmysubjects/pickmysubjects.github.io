code: ABPL90390
year: 2027
learn:
  en: "A capstone thesis where you research and design across architecture and engineering, then report and present it."
  zh: "毕业论文：跨建筑与工程开展研究和设计，并撰写报告和展示。"
  zh-TW: "畢業論文：跨建築與工程進行研究和設計，並撰寫報告和展示。"
  ja: "建築と工学にまたがる研究・設計を行い、報告・発表する修了論文。"
  ko: "건축과 공학을 아우르는 연구·설계를 하고 보고·발표하는 졸업 논문."
  vi: "Luận văn tốt nghiệp: nghiên cứu và thiết kế giữa kiến trúc và kỹ thuật, rồi viết báo cáo và trình bày."
  ms: "Tesis akhir: menyelidik dan mereka bentuk merentas seni bina dan kejuruteraan, kemudian melapor dan membentang."
  id: "Tesis akhir: riset dan desain lintas arsitektur dan teknik, lalu menulis laporan dan presentasi."
  hi: "कैपस्टोन थीसिस: वास्तुकला और इंजीनियरिंग में शोध व डिज़ाइन, फिर रिपोर्ट और प्रस्तुति।"
outcomes:
  - en: "Form a hypothesis and design a method to test it"
    zh: "提出假设并设计验证方法"
    zh-TW: "提出假設並設計驗證方法"
    ja: "仮説を立て検証方法を設計する"
    ko: "가설을 세우고 검증 방법 설계하기"
    vi: "Đặt giả thuyết và thiết kế phương pháp kiểm chứng"
    ms: "Membentuk hipotesis dan mereka kaedah mengujinya"
    id: "Menyusun hipotesis dan merancang metode pengujiannya"
    hi: "परिकल्पना बनाना और उसे जाँचने की विधि तय करना"
  - en: "Write a research report and present it orally"
    zh: "撰写研究报告并口头展示"
    zh-TW: "撰寫研究報告並口頭展示"
    ja: "研究報告を書き口頭発表する"
    ko: "연구 보고서 작성 및 구두 발표하기"
    vi: "Viết báo cáo nghiên cứu và thuyết trình"
    ms: "Menulis laporan penyelidikan dan membentangkannya"
    id: "Menulis laporan riset dan mempresentasikannya"
    hi: "शोध रिपोर्ट लिखना और मौखिक प्रस्तुति देना"
