code: MCEN90008
year: 2027
learn:
  en: "Calculating flow around bodies, from potential flow to supersonic compressible flow."
  zh: "计算物体周围的流动，从势流到超声速可压缩流。"
  zh-TW: "計算物體周圍的流動，從勢流到超音速可壓縮流。"
  ja: "ポテンシャル流から超音速の圧縮性流れまで、物体まわりの流れを計算する。"
  ko: "퍼텐셜 유동부터 초음속 압축성 유동까지 물체 주위 흐름 계산."
  vi: "Tính dòng chảy quanh vật thể, từ dòng thế đến dòng nén siêu âm."
  ms: "Mengira aliran di sekeliling jasad, daripada aliran keupayaan hingga aliran mampat supersonik."
  id: "Menghitung aliran di sekitar benda, dari aliran potensial hingga aliran kompresibel supersonik."
  hi: "पिंडों के चारों ओर प्रवाह की गणना, पोटेंशियल प्रवाह से सुपरसोनिक संपीड्य प्रवाह तक।"
outcomes:
  - en: "Build flow solutions from the basic equations of motion"
    zh: "从基本运动方程推出流动解"
    zh-TW: "從基本運動方程推出流動解"
    ja: "基本の運動方程式から流れの解を組み立てる"
    ko: "기본 운동 방정식에서 유동 해 구하기"
    vi: "Xây dựng lời giải dòng chảy từ phương trình chuyển động cơ bản"
    ms: "Membina penyelesaian aliran daripada persamaan gerakan asas"
    id: "Menyusun solusi aliran dari persamaan gerak dasar"
    hi: "मूल गति समीकरणों से प्रवाह के हल बनाना"
  - en: "Know the limits of potential and supersonic flow theory"
    zh: "了解势流和超声速理论的局限"
    zh-TW: "了解勢流與超音速理論的局限"
    ja: "ポテンシャル流と超音速理論の限界を知る"
    ko: "퍼텐셜·초음속 이론의 한계 알기"
    vi: "Biết giới hạn của lý thuyết dòng thế và siêu âm"
    ms: "Mengetahui had teori aliran keupayaan dan supersonik"
    id: "Mengetahui batas teori aliran potensial dan supersonik"
    hi: "पोटेंशियल और सुपरसोनिक सिद्धांत की सीमाएँ जानना"
