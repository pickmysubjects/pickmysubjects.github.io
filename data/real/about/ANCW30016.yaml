code: ANCW30016
year: 2026
learn:
  en: "The rise of Macedon, Alexander's empire and how his legacy has been told from ancient times to modern film."
  zh: "马其顿的崛起、亚历山大帝国，以及他的事迹从古代到现代电影如何被讲述。"
  zh-TW: "馬其頓的崛起、亞歷山大帝國，以及他的事蹟從古代到現代電影如何被講述。"
  ja: "マケドニアの台頭とアレクサンドロスの帝国、そしてその遺産が古代から現代映画までどう語られたかを学ぶ。"
  ko: "마케도니아의 부상, 알렉산드로스 제국, 그리고 그의 유산이 고대부터 현대 영화까지 어떻게 이야기되었는지 배운다."
  vi: "Sự trỗi dậy của Macedon, đế chế Alexander và cách di sản của ông được kể từ thời cổ đến phim hiện đại."
  ms: "Kebangkitan Macedon, empayar Alexander dan cara warisannya diceritakan dari zaman kuno hingga filem moden."
  id: "Kebangkitan Makedonia, kekaisaran Alexander, dan cara warisannya diceritakan dari zaman kuno hingga film modern."
  hi: "मैसेडोन का उदय, सिकंदर का साम्राज्य, और प्राचीन काल से आधुनिक फ़िल्मों तक उसकी विरासत कैसे सुनाई गई।"
outcomes:
  - en: "Explain how Macedon rose to power"
    zh: "解释马其顿如何崛起"
    zh-TW: "解釋馬其頓如何崛起"
    ja: "マケドニアがどう台頭したか説明する"
    ko: "마케도니아가 부상한 과정 설명하기"
    vi: "Giải thích Macedon vươn lên nắm quyền ra sao"
    ms: "Terangkan bagaimana Macedon menjadi kuasa besar"
    id: "Menjelaskan bagaimana Makedonia naik berkuasa"
    hi: "मैसेडोन सत्ता में कैसे आया, समझाना"
  - en: "Assess sources on Alexander's campaigns"
    zh: "评估关于亚历山大征战的史料"
    zh-TW: "評估關於亞歷山大征戰的史料"
    ja: "アレクサンドロスの遠征に関する史料を評価する"
    ko: "알렉산드로스 원정에 관한 사료 평가하기"
    vi: "Đánh giá các nguồn về các chiến dịch của Alexander"
    ms: "Nilai sumber tentang kempen Alexander"
    id: "Menilai sumber tentang kampanye Alexander"
    hi: "सिकंदर के अभियानों के स्रोतों का आकलन करना"
  - en: "Analyse Alexander's legacy in later culture"
    zh: "分析亚历山大在后世文化中的影响"
    zh-TW: "分析亞歷山大在後世文化中的影響"
    ja: "後世の文化におけるアレクサンドロス像を分析する"
    ko: "후대 문화 속 알렉산드로스의 유산 분석하기"
    vi: "Phân tích di sản của Alexander trong văn hóa đời sau"
    ms: "Analisis warisan Alexander dalam budaya kemudian"
    id: "Menganalisis warisan Alexander dalam budaya kemudian"
    hi: "बाद की संस्कृति में सिकंदर की विरासत का विश्लेषण करना"
