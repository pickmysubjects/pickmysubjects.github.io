code: CHEM20018
year: 2026
learn:
  en: "How organic and inorganic molecules are made, the energy changes in reactions, and what gives materials their properties."
  zh: "有机和无机分子怎样合成、反应中的能量变化和材料性质的来源。"
  zh-TW: "有機和無機分子如何合成、反應中的能量變化和材料性質的來源。"
  ja: "有機・無機分子の作り方、反応でのエネルギー変化、材料の性質を決めるもの。"
  ko: "유기·무기 분자를 만드는 방법, 반응의 에너지 변화, 물질 성질의 근원."
  vi: "Cách tạo phân tử hữu cơ, vô cơ, biến đổi năng lượng trong phản ứng và điều gì tạo nên tính chất vật liệu."
  ms: "Cara molekul organik dan bukan organik dihasilkan, perubahan tenaga dalam tindak balas, dan punca sifat bahan."
  id: "Cara molekul organik dan anorganik dibuat, perubahan energi dalam reaksi, dan asal sifat material."
  hi: "ऑर्गेनिक और इनऑर्गेनिक अणु कैसे बनते हैं, रिएक्शन में ऊर्जा बदलाव, और पदार्थों के गुण कहाँ से आते हैं।"
outcomes:
  - en: "Plan simple routes to make organic compounds"
    zh: "设计简单有机物的合成路线"
    zh-TW: "設計簡單有機物的合成路線"
    ja: "有機化合物の簡単な合成経路を考える"
    ko: "유기 화합물의 간단한 합성 경로 설계하기"
    vi: "Lập lộ trình đơn giản để tổng hợp hợp chất hữu cơ"
    ms: "Rancang laluan mudah untuk hasilkan sebatian organik"
    id: "Merancang rute sederhana membuat senyawa organik"
    hi: "ऑर्गेनिक यौगिक बनाने के सरल रास्ते प्लान करना"
  - en: "Apply thermodynamics to mixtures and phase changes"
    zh: "用热力学分析混合物和相变"
    zh-TW: "用熱力學分析混合物和相變"
    ja: "熱力学を混合物と相変化に応用する"
    ko: "열역학을 혼합물과 상변화에 적용하기"
    vi: "Áp dụng nhiệt động lực học cho hỗn hợp và chuyển pha"
    ms: "Guna termodinamik pada campuran dan perubahan fasa"
    id: "Menerapkan termodinamika pada campuran dan perubahan fase"
    hi: "मिश्रण और फ़ेज़ बदलाव पर थर्मोडायनामिक्स लागू करना"
  - en: "Explain reactions of main group and transition metals"
    zh: "解释主族和过渡金属的反应"
    zh-TW: "解釋主族和過渡金屬的反應"
    ja: "典型元素と遷移金属の反応を説明する"
    ko: "주족 원소와 전이 금속의 반응 설명하기"
    vi: "Giải thích phản ứng của nhóm chính và kim loại chuyển tiếp"
    ms: "Terangkan tindak balas kumpulan utama dan logam peralihan"
    id: "Menjelaskan reaksi golongan utama dan logam transisi"
    hi: "मेन ग्रुप और ट्रांज़िशन धातुओं के रिएक्शन समझाना"
