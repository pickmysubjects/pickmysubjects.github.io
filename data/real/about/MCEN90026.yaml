code: MCEN90026
year: 2027
learn:
  en: "Stress analysis of pressure vessels, shells and rotating discs, through to plasticity, fatigue and finite elements."
  zh: "压力容器、壳体和旋转盘的应力分析，并延伸到塑性、疲劳和有限元。"
  zh-TW: "壓力容器、殼體與旋轉盤的應力分析，並延伸到塑性、疲勞與有限元素。"
  ja: "圧力容器・シェル・回転円板の応力解析から塑性・疲労・有限要素法まで。"
  ko: "압력용기·쉘·회전 원판의 응력 해석부터 소성·피로·유한요소까지."
  vi: "Phân tích ứng suất bình áp lực, vỏ, đĩa quay, đến dẻo, mỏi và phần tử hữu hạn."
  ms: "Analisis tegasan bekas tekanan, cangkerang dan cakera berputar, hingga keplastikan, lesu dan unsur terhingga."
  id: "Analisis tegangan bejana tekan, cangkang, dan cakram berputar, hingga plastisitas, kelelahan, dan elemen hingga."
  hi: "प्रेशर वेसल, शेल और घूमती डिस्क का प्रतिबल विश्लेषण, प्लास्टिसिटी, थकान और फ़ाइनाइट एलिमेंट तक।"
outcomes:
  - en: "Find the maximum stress in a loaded beam"
    zh: "求受载梁中的最大应力"
    zh-TW: "求受載梁中的最大應力"
    ja: "荷重を受けるはりの最大応力を求める"
    ko: "하중을 받는 보의 최대 응력 구하기"
    vi: "Tìm ứng suất lớn nhất trong dầm chịu tải"
    ms: "Mencari tegasan maksimum dalam rasuk berbeban"
    id: "Mencari tegangan maksimum pada balok berbeban"
    hi: "भारित बीम में अधिकतम प्रतिबल ज्ञात करना"
  - en: "Predict failure by yielding"
    zh: "预测屈服导致的失效"
    zh-TW: "預測降伏導致的破壞"
    ja: "降伏による破壊を予測する"
    ko: "항복에 의한 파손 예측하기"
    vi: "Dự đoán phá hủy do chảy dẻo"
    ms: "Meramal kegagalan akibat alah"
    id: "Memprediksi kegagalan akibat luluh"
    hi: "यील्डिंग से विफलता का अनुमान"
  - en: "Use FEA software for stress analysis"
    zh: "用有限元软件做应力分析"
    zh-TW: "用有限元素軟體做應力分析"
    ja: "FEAソフトで応力解析を行う"
    ko: "FEA 소프트웨어로 응력 해석하기"
    vi: "Dùng phần mềm FEA phân tích ứng suất"
    ms: "Menggunakan perisian FEA untuk analisis tegasan"
    id: "Memakai perangkat lunak FEA untuk analisis tegangan"
    hi: "FEA सॉफ़्टवेयर से प्रतिबल विश्लेषण"
