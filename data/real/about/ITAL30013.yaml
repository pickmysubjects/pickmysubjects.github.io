code: ITAL30013
year: 2026
learn:
  en: "Advanced Italian through post-war Italy's literature, society and history, plus a group project using Italian in a school."
  zh: "通过战后意大利的文学、社会与历史学习高级意大利语，并完成一个在学校使用意大利语的小组项目。"
  zh-TW: "透過戰後義大利的文學、社會與歷史學習高級義大利語，並完成一個在學校使用義大利語的小組專案。"
  ja: "戦後イタリアの文学・社会・歴史を通して上級イタリア語を学び、学校でイタリア語を使うグループ課題も行う。"
  ko: "전후 이탈리아의 문학·사회·역사로 고급 이탈리아어를 배우고 학교에서 이탈리아어를 쓰는 조별 과제도 한다."
  vi: "Tiếng Ý nâng cao qua văn học, xã hội, lịch sử Ý thời hậu chiến, cùng dự án nhóm dùng tiếng Ý tại một trường học."
  ms: "Bahasa Itali lanjutan melalui sastera, masyarakat dan sejarah Itali pasca perang, serta projek kumpulan di sekolah."
  id: "Bahasa Italia lanjut lewat sastra, masyarakat dan sejarah Italia pascaperang, plus proyek kelompok memakai bahasa Italia di sekolah."
  hi: "युद्ध के बाद के इटली के साहित्य, समाज व इतिहास से उन्नत इतालवी, और एक स्कूल में इतालवी इस्तेमाल करने वाला समूह प्रोजेक्ट।"
outcomes:
  - en: "Discuss social and cultural topics in Italian"
    zh: "用意大利语讨论社会和文化话题"
    zh-TW: "用義大利語討論社會和文化話題"
    ja: "社会や文化の話題をイタリア語で話し合う"
    ko: "사회·문화 주제를 이탈리아어로 토론하기"
    vi: "Thảo luận chủ đề xã hội, văn hóa bằng tiếng Ý"
    ms: "Bincangkan topik sosial dan budaya dalam bahasa Itali"
    id: "Membahas topik sosial dan budaya dalam bahasa Italia"
    hi: "सामाजिक और सांस्कृतिक विषयों पर इतालवी में चर्चा करना"
  - en: "Read and write longer Italian texts"
    zh: "读写较长的意大利语文章"
    zh-TW: "讀寫較長的義大利語文章"
    ja: "長めのイタリア語の文章を読み書きする"
    ko: "긴 이탈리아어 글 읽고 쓰기"
    vi: "Đọc và viết văn bản tiếng Ý dài hơn"
    ms: "Baca dan tulis teks bahasa Itali yang lebih panjang"
    id: "Membaca dan menulis teks bahasa Italia yang lebih panjang"
    hi: "लंबे इतालवी पाठ पढ़ना-लिखना"
  - en: "Give a clear presentation in Italian"
    zh: "用意大利语做清楚的口头报告"
    zh-TW: "用義大利語做清楚的口頭報告"
    ja: "イタリア語で分かりやすく発表する"
    ko: "이탈리아어로 명확하게 발표하기"
    vi: "Thuyết trình rõ ràng bằng tiếng Ý"
    ms: "Buat pembentangan yang jelas dalam bahasa Itali"
    id: "Melakukan presentasi yang jelas dalam bahasa Italia"
    hi: "इतालवी में स्पष्ट प्रस्तुति देना"
