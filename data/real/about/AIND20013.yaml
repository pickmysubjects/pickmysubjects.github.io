code: AIND20013
year: 2027
learn:
  en: "A studio on Indigenous creative practice: land-based and heritage crafts, and who controls land, resources and knowledge."
  zh: "以原住民创作实践为核心的工作室课：基于土地的创作、传统手工艺，以及谁掌控土地、资源和知识。"
  zh-TW: "以原住民創作實踐為核心的工作室課：以土地為本的創作、傳統工藝，以及誰掌控土地、資源和知識。"
  ja: "先住民の創作実践を軸にしたスタジオ：土地に根ざした制作や伝統工芸、そして土地・資源・知識を誰が握るのか。"
  ko: "원주민 창작 실천 중심의 스튜디오: 땅에 기반한 작업과 전통 공예, 그리고 땅·자원·지식을 누가 통제하는가."
  vi: "Studio về thực hành sáng tạo của người bản địa: thủ công truyền thống gắn với đất đai, và ai kiểm soát đất, tài nguyên và tri thức."
  ms: "Studio amalan kreatif Orang Asli: kraf warisan berasaskan tanah, dan siapa yang menguasai tanah, sumber dan pengetahuan."
  id: "Studio praktik kreatif Pribumi: kerajinan warisan berbasis tanah, dan siapa yang menguasai tanah, sumber daya, dan pengetahuan."
  hi: "मूलनिवासी रचनात्मक अभ्यास पर स्टूडियो: ज़मीन से जुड़े पारंपरिक शिल्प, और ज़मीन, संसाधन व ज्ञान पर किसका नियंत्रण है।"
outcomes:
  - en: "Link your creative practice to your own position"
    zh: "把自己的创作与自身立场联系起来"
    zh-TW: "把自己的創作與自身立場連結起來"
    ja: "自分の創作を自分の立場と結びつける"
    ko: "자신의 창작을 자기 위치와 연결하기"
    vi: "Gắn thực hành sáng tạo với vị trí của bản thân"
    ms: "Kaitkan amalan kreatif dengan kedudukan diri"
    id: "Mengaitkan praktik kreatif dengan posisi diri"
    hi: "अपने रचनात्मक काम को अपनी स्थिति से जोड़ना"
  - en: "Create counter-narratives to colonial power"
    zh: "创作对抗殖民权力的另类叙事"
    zh-TW: "創作對抗殖民權力的另類敘事"
    ja: "植民地的な権力に対抗する物語をつくる"
    ko: "식민 권력에 맞서는 대안 서사 만들기"
    vi: "Tạo câu chuyện thay thế chống lại quyền lực thực dân"
    ms: "Hasilkan naratif alternatif menentang kuasa kolonial"
    id: "Membuat narasi tandingan terhadap kuasa kolonial"
    hi: "औपनिवेशिक सत्ता के विरुद्ध वैकल्पिक कथाएँ रचना"
  - en: "Make art with others across different views"
    zh: "在合作创作中协调不同观点"
    zh-TW: "在合作創作中協調不同觀點"
    ja: "異なる視点をすり合わせながら共同で制作する"
    ko: "다양한 관점을 조율하며 함께 작품 만들기"
    vi: "Sáng tác cùng người khác, dung hòa nhiều góc nhìn"
    ms: "Berkarya bersama orang lain merentas pandangan berbeza"
    id: "Berkarya bersama dengan menyatukan berbagai sudut pandang"
    hi: "अलग-अलग नज़रियों के साथ मिलकर कला बनाना"
