code: EURO20007
year: 2026
learn:
  en: "A summer intensive on European food cultures and how they have been adapted in Melbourne."
  zh: "暑期密集课：欧洲饮食文化以及它们在墨尔本的本地化。"
  zh-TW: "暑期密集課：歐洲飲食文化以及它們在墨爾本的在地化。"
  ja: "ヨーロッパの食文化と、それがメルボルンでどう取り入れられたかを学ぶ夏の集中科目。"
  ko: "유럽 음식 문화와 그것이 멜버른에서 어떻게 자리 잡았는지 배우는 여름 집중 과목."
  vi: "Khóa hè cấp tốc về văn hóa ẩm thực châu Âu và cách chúng thích nghi ở Melbourne."
  ms: "Kursus intensif musim panas tentang budaya makanan Eropah dan penyesuaiannya di Melbourne."
  id: "Kursus intensif musim panas tentang budaya makanan Eropa dan penyesuaiannya di Melbourne."
  hi: "यूरोपीय खान-पान संस्कृतियों और मेलबर्न में उनके ढलने पर गर्मियों का गहन कोर्स।"
outcomes:
  - en: "Describe several European food traditions"
    zh: "介绍几种欧洲饮食传统"
    zh-TW: "介紹幾種歐洲飲食傳統"
    ja: "いくつかのヨーロッパの食の伝統を説明する"
    ko: "여러 유럽 음식 전통 설명하기"
    vi: "Mô tả một số truyền thống ẩm thực châu Âu"
    ms: "Huraikan beberapa tradisi makanan Eropah"
    id: "Menjelaskan beberapa tradisi makanan Eropa"
    hi: "कई यूरोपीय खान-पान परंपराओं का वर्णन करना"
  - en: "Link food to migration and identity"
    zh: "把饮食与移民和身份联系起来"
    zh-TW: "把飲食與移民和身分聯繫起來"
    ja: "食を移民やアイデンティティと結びつける"
    ko: "음식을 이주와 정체성과 연결하기"
    vi: "Liên hệ ẩm thực với di cư và bản sắc"
    ms: "Kaitkan makanan dengan migrasi dan identiti"
    id: "Mengaitkan makanan dengan migrasi dan identitas"
    hi: "भोजन को प्रवास और पहचान से जोड़ना"
  - en: "Report on European food culture in Melbourne"
    zh: "报告墨尔本的欧洲饮食文化"
    zh-TW: "報告墨爾本的歐洲飲食文化"
    ja: "メルボルンのヨーロッパ食文化を報告する"
    ko: "멜버른의 유럽 음식 문화 보고하기"
    vi: "Báo cáo về văn hóa ẩm thực châu Âu ở Melbourne"
    ms: "Laporkan budaya makanan Eropah di Melbourne"
    id: "Melaporkan budaya makanan Eropa di Melbourne"
    hi: "मेलबर्न में यूरोपीय खान-पान संस्कृति पर रिपोर्ट देना"
