code: PSYC30018
year: 2026
learn:
  en: "How brain activity gives rise to attention, perception and memory, and how scientists measure it."
  zh: "大脑活动怎么产生注意、感知和记忆，科学家怎么测量它。"
outcomes:
  - en: "Judge the strengths and limits of brain research methods"
    zh: "评估脑研究方法的优缺点"
  - en: "Link brain dysfunction to mental health symptoms"
    zh: "把大脑功能异常和症状联系起来"
  - en: "Analyse data to answer a psychology question"
    zh: "分析数据回答心理学问题"
