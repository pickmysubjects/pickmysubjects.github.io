code: PSYC30018
year: 2026
learn:
  en: "How brain activity gives rise to attention, perception and memory, and how scientists measure it."
  zh: "大脑活动怎么产生注意、感知和记忆，科学家怎么测量它。"
  zh-TW: "大腦活動怎麼產生注意、感知和記憶，科學家怎麼測量它。"
  ja: "脳の活動から注意、知覚、記憶がどう生まれるか、科学者がそれをどう測るか。"
  ko: "뇌 활동이 주의, 지각, 기억을 만드는 방식과 과학자의 측정 방법."
  vi: "Hoạt động não tạo ra chú ý, tri giác, trí nhớ ra sao và các nhà khoa học đo nó thế nào."
  ms: "Cara aktiviti otak menghasilkan perhatian, persepsi dan ingatan, serta cara saintis mengukurnya."
  id: "Cara aktivitas otak memunculkan perhatian, persepsi, dan memori, serta cara ilmuwan mengukurnya."
  hi: "दिमागी गतिविधि से ध्यान, धारणा और याददाश्त कैसे बनती है, और वैज्ञानिक इसे कैसे मापते हैं।"
outcomes:
  - en: "Judge the strengths and limits of brain research methods"
    zh: "评估脑研究方法的优缺点"
    zh-TW: "評估腦研究方法的優缺點"
    ja: "脳研究の手法の長所と限界を判断する"
    ko: "뇌 연구 방법의 장단점 판단"
    vi: "Đánh giá điểm mạnh và giới hạn của phương pháp nghiên cứu não"
    ms: "Nilai kekuatan dan had kaedah kajian otak"
    id: "Menilai kelebihan dan batasan metode riset otak"
    hi: "ब्रेन रिसर्च तरीकों की खूबियाँ और सीमाएँ परखना"
  - en: "Link brain dysfunction to mental health symptoms"
    zh: "把大脑功能异常和症状联系起来"
    zh-TW: "把大腦功能異常和心理健康症狀連結起來"
    ja: "脳の機能障害と精神症状を結びつける"
    ko: "뇌 기능 이상과 정신건강 증상 연결"
    vi: "Liên hệ rối loạn chức năng não với triệu chứng tâm thần"
    ms: "Kaitkan gangguan fungsi otak dengan simptom kesihatan mental"
    id: "Menghubungkan gangguan fungsi otak dengan gejala mental"
    hi: "दिमाग की गड़बड़ी को मानसिक स्वास्थ्य लक्षणों से जोड़ना"
  - en: "Analyse data to answer a psychology question"
    zh: "分析数据回答心理学问题"
    zh-TW: "分析數據回答心理學問題"
    ja: "データを分析して心理学の問いに答える"
    ko: "데이터를 분석해 심리학 질문에 답하기"
    vi: "Phân tích dữ liệu để trả lời câu hỏi tâm lý"
    ms: "Analisis data untuk menjawab soalan psikologi"
    id: "Menganalisis data untuk menjawab pertanyaan psikologi"
    hi: "डेटा से साइकोलॉजी के सवाल का जवाब ढूँढना"
