code: MEDS40006
year: 2026
learn:
  en: "Medical Science Honours block: biostatistics, research proposals, turning evidence into clinical practice, and the ethics of research."
  zh: "医学科学荣誉学位课程：生物统计、研究计划书、把证据转化为临床实践，以及研究伦理"
  zh-TW: "醫學科學榮譽學位課程：生物統計、研究計畫書、把證據轉化為臨床實務，以及研究倫理"
  ja: "医科学オナーズの集中科目。生物統計、研究計画、エビデンスの臨床応用、研究倫理。"
  ko: "의과학 아너스 블록 과목: 생물통계, 연구 계획서, 근거의 임상 적용, 연구 윤리."
  vi: "Khối học Danh dự Khoa học Y: thống kê sinh học, đề cương nghiên cứu, đưa bằng chứng vào lâm sàng, đạo đức nghiên cứu."
  ms: "Blok Kepujian Sains Perubatan: biostatistik, cadangan penyelidikan, bukti ke amalan klinikal, etika penyelidikan."
  id: "Blok Honours Ilmu Kedokteran: biostatistik, proposal riset, bukti ke praktik klinis, dan etika penelitian."
  hi: "मेडिकल साइंस ऑनर्स ब्लॉक: बायोस्टैटिस्टिक्स, शोध प्रस्ताव, साक्ष्य को क्लिनिकल प्रैक्टिस में लाना, शोध नैतिकता।"
outcomes:
  - en: "Write a research proposal for a clinical question"
    zh: "为一个临床问题撰写研究计划书"
    zh-TW: "為一個臨床問題撰寫研究計畫書"
    ja: "臨床上の問いに対する研究計画を書く"
    ko: "임상 질문에 대한 연구 계획서 쓰기"
    vi: "Viết đề cương nghiên cứu cho một câu hỏi lâm sàng"
    ms: "Menulis cadangan kajian untuk soalan klinikal"
    id: "Menulis proposal riset untuk pertanyaan klinis"
    hi: "किसी क्लिनिकल प्रश्न के लिए शोध प्रस्ताव लिखना"
  - en: "Analyse research data and interpret the results"
    zh: "分析研究数据并解读结果"
    zh-TW: "分析研究數據並解讀結果"
    ja: "研究データを分析し結果を解釈する"
    ko: "연구 데이터를 분석하고 결과 해석하기"
    vi: "Phân tích dữ liệu nghiên cứu và diễn giải kết quả"
    ms: "Menganalisis data kajian dan mentafsir hasil"
    id: "Menganalisis data riset dan menafsirkan hasil"
    hi: "शोध डेटा का विश्लेषण और नतीजों की व्याख्या करना"
  - en: "Plan how findings can change clinical practice"
    zh: "规划研究结果如何改变临床实践"
    zh-TW: "規劃研究結果如何改變臨床實務"
    ja: "研究結果を臨床に生かす計画を立てる"
    ko: "연구 결과를 임상에 반영할 계획 세우기"
    vi: "Lập kế hoạch đưa kết quả vào thực hành lâm sàng"
    ms: "Merancang cara dapatan mengubah amalan klinikal"
    id: "Merencanakan cara temuan mengubah praktik klinis"
    hi: "निष्कर्षों से क्लिनिकल प्रैक्टिस बदलने की योजना बनाना"
