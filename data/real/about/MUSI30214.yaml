code: MUSI30214
year: 2026
learn:
  en: "The capstone of the composition sequence: a folio including large-ensemble and electronic works, plus a concert of your music."
  zh: "作曲系列的毕业课：完成含大型合奏与电子作品的作品集，并举办作品音乐会。"
  zh-TW: "作曲系列的總結課：完成含大型合奏與電子作品的作品集，並舉辦作品音樂會。"
  ja: "作曲シリーズの総仕上げ。大編成と電子音楽を含む作品集と、自作の演奏会。"
  ko: "작곡 과정의 마무리: 대편성·전자음악을 포함한 작품집과 자작곡 연주회."
  vi: "Môn tổng kết chuỗi sáng tác: tập tác phẩm gồm hòa tấu lớn, điện tử và buổi hòa nhạc."
  ms: "Kemuncak siri gubahan: folio termasuk ensembel besar dan elektronik, serta konsert."
  id: "Puncak seri komposisi: folio termasuk ansambel besar dan elektronik, plus konser."
  hi: "रचना श्रृंखला का अंतिम विषय: बड़े एन्सेम्बल व इलेक्ट्रॉनिक कृतियों का फ़ोलियो और कॉन्सर्ट।"
outcomes:
  - en: "Write for large ensembles"
    zh: "为大型合奏写作"
    zh-TW: "為大型合奏寫作"
    ja: "大編成のために書く"
    ko: "대편성 작곡하기"
    vi: "Viết cho dàn nhạc lớn"
    ms: "Menulis untuk ensembel besar"
    id: "Menulis untuk ansambel besar"
    hi: "बड़े एन्सेम्बल के लिए लिखना"
  - en: "Compose a folio of scores and recordings"
    zh: "创作乐谱与录音作品集"
    zh-TW: "創作樂譜與錄音作品集"
    ja: "楽譜と録音の作品集を作る"
    ko: "악보·녹음 작품집 만들기"
    vi: "Sáng tác tập bản nhạc và bản thu"
    ms: "Hasilkan folio skor dan rakaman"
    id: "Membuat folio partitur dan rekaman"
    hi: "स्कोर और रिकॉर्डिंग का फ़ोलियो बनाना"
  - en: "Present your music in a concert"
    zh: "在音乐会上展示作品"
    zh-TW: "在音樂會上發表作品"
    ja: "演奏会で自作を発表する"
    ko: "연주회에서 작품 발표"
    vi: "Trình diễn tác phẩm trong buổi hòa nhạc"
    ms: "Persembahkan muzik dalam konsert"
    id: "Menampilkan musik dalam konser"
    hi: "कॉन्सर्ट में अपना संगीत प्रस्तुत करना"
