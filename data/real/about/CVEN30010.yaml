code: CVEN30010
year: 2026
learn:
  en: "Soil mechanics, seepage and slope stability, applied in a geotechnical design project with computer modelling."
  zh: "土力学、渗流和边坡稳定，并通过计算机建模完成岩土设计项目。"
  zh-TW: "土壤力學、滲流與邊坡穩定，並透過電腦建模完成大地工程設計專題。"
  ja: "土質力学・浸透・斜面安定を学び、コンピュータモデルで地盤設計課題に取り組む。"
  ko: "토질역학·침투·사면 안정을 배우고 컴퓨터 모델링으로 지반 설계 프로젝트 수행."
  vi: "Cơ học đất, thấm và ổn định mái dốc, áp dụng vào dự án thiết kế địa kỹ thuật có mô hình máy tính."
  ms: "Mekanik tanah, resapan dan kestabilan cerun, digunakan dalam projek reka bentuk geoteknik dengan pemodelan komputer."
  id: "Mekanika tanah, rembesan, dan stabilitas lereng, dipakai dalam proyek desain geoteknik dengan pemodelan komputer."
  hi: "मृदा यांत्रिकी, रिसाव और ढलान स्थिरता, कंप्यूटर मॉडलिंग के साथ जियोटेक्निकल डिज़ाइन प्रोजेक्ट में।"
outcomes:
  - en: "Analyse seepage and slope stability"
    zh: "分析渗流与边坡稳定"
    zh-TW: "分析滲流與邊坡穩定"
    ja: "浸透と斜面安定を解析する"
    ko: "침투와 사면 안정 분석하기"
    vi: "Phân tích thấm và ổn định mái dốc"
    ms: "Menganalisis resapan dan kestabilan cerun"
    id: "Menganalisis rembesan dan stabilitas lereng"
    hi: "रिसाव और ढलान स्थिरता का विश्लेषण करना"
  - en: "Use modelling in a geotechnical design"
    zh: "在岩土设计中运用建模"
    zh-TW: "在大地工程設計中運用建模"
    ja: "地盤設計にモデリングを使う"
    ko: "지반 설계에 모델링 활용하기"
    vi: "Dùng mô hình trong thiết kế địa kỹ thuật"
    ms: "Guna pemodelan dalam reka bentuk geoteknik"
    id: "Memakai pemodelan dalam desain geoteknik"
    hi: "जियोटेक्निकल डिज़ाइन में मॉडलिंग का उपयोग करना"
  - en: "Write professional technical reports"
    zh: "撰写专业技术报告"
    zh-TW: "撰寫專業技術報告"
    ja: "専門的な技術報告書を書く"
    ko: "전문 기술 보고서 작성하기"
    vi: "Viết báo cáo kỹ thuật chuyên nghiệp"
    ms: "Menulis laporan teknikal profesional"
    id: "Menulis laporan teknis profesional"
    hi: "पेशेवर तकनीकी रिपोर्ट लिखना"
