code: DRAM10026
year: 2026
learn:
  en: "Behind the scenes at Melbourne Theatre Company: who makes a show and how to talk about theatre, with two free shows."
  zh: "走进墨尔本剧院公司幕后：了解谁在创作演出、如何评论戏剧，含两场免费演出。"
  zh-TW: "走進墨爾本劇院公司幕後：了解誰在創作演出、如何評論戲劇，含兩場免費演出。"
  ja: "メルボルン・シアター・カンパニーの舞台裏。公演を作る人々と演劇の語り方を学ぶ。2公演の観劇付き。"
  ko: "멜버른 시어터 컴퍼니의 무대 뒤: 공연을 만드는 사람들과 연극 비평법, 무료 공연 2편 포함."
  vi: "Hậu trường Melbourne Theatre Company: ai làm nên vở diễn và cách bàn về sân khấu, kèm hai vé xem miễn phí."
  ms: "Di sebalik tabir Melbourne Theatre Company: siapa menghasilkan persembahan dan cara mengulas teater, dua tiket percuma."
  id: "Di balik layar Melbourne Theatre Company: siapa pembuat pertunjukan dan cara membahas teater, dua tiket gratis."
  hi: "मेलबर्न थिएटर कंपनी के पर्दे के पीछे: शो कौन बनाता है और थिएटर पर कैसे बात करें, दो मुफ़्त शो के साथ।"
outcomes:
  - en: "Use theatre terms to analyse a show"
    zh: "用戏剧术语分析演出"
    zh-TW: "用戲劇術語分析演出"
    ja: "演劇用語で公演を分析する"
    ko: "연극 용어로 공연 분석하기"
    vi: "Dùng thuật ngữ sân khấu để phân tích vở diễn"
    ms: "Guna istilah teater untuk menganalisis persembahan"
    id: "Memakai istilah teater untuk menganalisis pertunjukan"
    hi: "थिएटर शब्दावली से शो का विश्लेषण करना"
  - en: "Recognise the roles of writer, director, actor and designer"
    zh: "认识编剧、导演、演员和设计师的角色"
    zh-TW: "認識編劇、導演、演員和設計師的角色"
    ja: "脚本家・演出家・俳優・デザイナーの役割を知る"
    ko: "작가·연출·배우·디자이너의 역할 이해하기"
    vi: "Nhận biết vai trò biên kịch, đạo diễn, diễn viên, thiết kế"
    ms: "Kenal peranan penulis, pengarah, pelakon dan pereka"
    id: "Mengenali peran penulis, sutradara, aktor dan perancang"
    hi: "लेखक, निर्देशक, अभिनेता और डिज़ाइनर की भूमिकाएँ पहचानना"
  - en: "Review theatre with an informed opinion"
    zh: "有理有据地评论戏剧"
    zh-TW: "有理有據地評論戲劇"
    ja: "根拠ある意見で演劇を評する"
    ko: "근거 있는 의견으로 연극 리뷰하기"
    vi: "Bình luận sân khấu có lập luận"
    ms: "Mengulas teater dengan pendapat berasas"
    id: "Mengulas teater dengan pendapat yang berdasar"
    hi: "सोच-समझकर थिएटर की समीक्षा करना"
