code: ISLM30003
year: 2026
learn:
  en: "Ethical traditions in Islamic thought, from theologians, philosophers and Sufis to modern debates on moral questions."
  zh: "伊斯兰思想中的伦理传统，从神学家、哲学家和苏菲派到现代道德问题的争论。"
  zh-TW: "伊斯蘭思想中的倫理傳統，從神學家、哲學家和蘇菲派到現代道德問題的爭論。"
  ja: "神学者・哲学者・スーフィーから現代の道徳的論争まで、イスラーム思想の倫理的伝統を学ぶ。"
  ko: "신학자·철학자·수피부터 현대 도덕 논쟁까지 이슬람 사상의 윤리 전통을 배운다."
  vi: "Các truyền thống đạo đức trong tư tưởng Hồi giáo, từ nhà thần học, triết gia, Sufi đến tranh luận đạo đức hiện đại."
  ms: "Tradisi etika dalam pemikiran Islam, dari ahli teologi, ahli falsafah dan sufi hingga perdebatan moral moden."
  id: "Tradisi etika dalam pemikiran Islam, dari teolog, filsuf dan sufi sampai perdebatan moral modern."
  hi: "इस्लामी चिंतन की नैतिक परंपराएं, धर्मशास्त्रियों, दार्शनिकों और सूफ़ियों से आधुनिक नैतिक बहसों तक।"
outcomes:
  - en: "Describe major Islamic ethical traditions"
    zh: "描述伊斯兰的主要伦理传统"
    zh-TW: "描述伊斯蘭的主要倫理傳統"
    ja: "イスラームの主な倫理的伝統を説明する"
    ko: "이슬람의 주요 윤리 전통 설명하기"
    vi: "Mô tả các truyền thống đạo đức Hồi giáo chính"
    ms: "Huraikan tradisi etika Islam utama"
    id: "Menguraikan tradisi etika Islam utama"
    hi: "मुख्य इस्लामी नैतिक परंपराओं का वर्णन करना"
  - en: "Compare reason and revelation in ethics"
    zh: "比较伦理学中的理性与启示"
    zh-TW: "比較倫理學中的理性與啟示"
    ja: "倫理における理性と啓示を比べる"
    ko: "윤리에서 이성과 계시 비교하기"
    vi: "So sánh lý trí và mặc khải trong đạo đức"
    ms: "Bandingkan akal dan wahyu dalam etika"
    id: "Membandingkan akal dan wahyu dalam etika"
    hi: "नैतिकता में तर्क और ईश्वरीय वाणी की तुलना करना"
  - en: "Apply these ideas to modern ethical issues"
    zh: "把这些观念用于现代伦理问题"
    zh-TW: "把這些觀念用於現代倫理問題"
    ja: "これらの考えを現代の倫理問題に当てはめる"
    ko: "이 사상을 현대 윤리 문제에 적용하기"
    vi: "Áp dụng các ý tưởng này vào vấn đề đạo đức hiện đại"
    ms: "Gunakan idea ini pada isu etika moden"
    id: "Menerapkan gagasan ini pada isu etika modern"
    hi: "इन विचारों को आधुनिक नैतिक मुद्दों पर लागू करना"
