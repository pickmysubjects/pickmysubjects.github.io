code: ELEN30013
year: 2026
learn:
  en: "Hands-on electronics: choosing parts, PCB layout, soldering, microcontroller code, and testing in team projects."
  zh: "动手做电子：选元件、PCB布局、焊接、单片机编程，并以团队项目测试。"
  zh-TW: "動手做電子：選元件、PCB佈局、焊接、微控制器程式，並以團隊專題測試。"
  ja: "実践電子工作：部品選定、PCB設計、はんだ付け、マイコンのプログラム、チームで試験。"
  ko: "실습 전자공학: 부품 선택, PCB 배치, 납땜, 마이크로컨트롤러 코딩, 팀 프로젝트로 시험."
  vi: "Điện tử thực hành: chọn linh kiện, thiết kế PCB, hàn, lập trình vi điều khiển và kiểm thử theo nhóm."
  ms: "Elektronik praktikal: memilih komponen, susun atur PCB, pematerian, kod mikropengawal dan ujian dalam projek kumpulan."
  id: "Elektronika praktik: memilih komponen, layout PCB, menyolder, kode mikrokontroler, dan pengujian dalam proyek tim."
  hi: "हैंड्स-ऑन इलेक्ट्रॉनिक्स: पार्ट चुनना, PCB लेआउट, सोल्डरिंग, माइक्रोकंट्रोलर कोड, और टीम प्रोजेक्ट में टेस्टिंग।"
outcomes:
  - en: "Pick and trade off circuit design choices"
    zh: "权衡并选择电路设计方案"
    zh-TW: "權衡並選擇電路設計方案"
    ja: "回路設計の選択肢を比較して選ぶ"
    ko: "회로 설계 대안 비교·선택하기"
    vi: "Cân nhắc và chọn phương án thiết kế mạch"
    ms: "Menimbang dan memilih pilihan reka bentuk litar"
    id: "Menimbang dan memilih opsi desain rangkaian"
    hi: "सर्किट डिज़ाइन विकल्पों को तौलकर चुनना"
  - en: "Assemble, test and debug electronic systems"
    zh: "组装、测试并调试电子系统"
    zh-TW: "組裝、測試並除錯電子系統"
    ja: "電子システムを組み立て試験・デバッグする"
    ko: "전자 시스템 조립·시험·디버그하기"
    vi: "Lắp ráp, kiểm thử và gỡ lỗi hệ thống điện tử"
    ms: "Memasang, menguji dan nyahpepijat sistem elektronik"
    id: "Merakit, menguji, dan men-debug sistem elektronik"
    hi: "इलेक्ट्रॉनिक सिस्टम जोड़ना, टेस्ट और डिबग करना"
  - en: "Explain how manufacturing limits design"
    zh: "解释制造工艺如何限制设计"
    zh-TW: "解釋製造工藝如何限制設計"
    ja: "製造工程が設計に与える制約を説明する"
    ko: "제조 공정이 설계를 제약하는 방식 설명하기"
    vi: "Giải thích sản xuất giới hạn thiết kế ra sao"
    ms: "Menerangkan cara pembuatan mengehadkan reka bentuk"
    id: "Menjelaskan bagaimana manufaktur membatasi desain"
    hi: "निर्माण प्रक्रिया डिज़ाइन को कैसे सीमित करती है, समझाना"
