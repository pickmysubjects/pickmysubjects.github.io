code: NRMT10007
year: 2026
learn:
  en: "How land is used and degraded, and how to manage it sustainably, with field trips around Dookie."
  zh: "土地如何利用与退化、如何可持续管理，含杜基周边实地考察。"
  zh-TW: "土地如何利用與退化、如何永續管理，含杜基周邊實地考察。"
  ja: "土地の利用と劣化、持続可能な管理を、ドゥーキー周辺の野外実習で学ぶ。"
  ko: "토지의 이용과 황폐화, 지속가능한 관리를 두키 주변 현장답사로 배우기."
  vi: "Đất được sử dụng và suy thoái ra sao, quản lý bền vững thế nào, kèm thực địa quanh Dookie."
  ms: "Cara tanah digunakan dan merosot, serta mengurusnya secara mampan, dengan lawatan lapangan di Dookie."
  id: "Cara lahan dipakai dan rusak, serta cara mengelolanya berkelanjutan, dengan kunjungan lapangan di Dookie."
  hi: "ज़मीन का उपयोग और क्षरण कैसे होता है, टिकाऊ प्रबंधन कैसे करें, डूकी के आसपास फ़ील्ड ट्रिप के साथ।"
outcomes:
  - en: "Explain how land becomes degraded"
    zh: "解释土地退化的过程"
    zh-TW: "解釋土地退化的過程"
    ja: "土地が劣化する仕組みを説明する"
    ko: "토지가 황폐해지는 과정 설명하기"
    vi: "Giải thích quá trình đất bị suy thoái"
    ms: "Terangkan cara tanah menjadi merosot"
    id: "Menjelaskan proses lahan menjadi rusak"
    hi: "ज़मीन का क्षरण कैसे होता है, समझाना"
  - en: "Draft a practical land management plan"
    zh: "制定实用的土地管理方案"
    zh-TW: "制定實用的土地管理方案"
    ja: "実用的な土地管理計画を作る"
    ko: "실용적인 토지 관리 계획 세우기"
    vi: "Soạn kế hoạch quản lý đất thực tế"
    ms: "Rangka pelan pengurusan tanah yang praktikal"
    id: "Menyusun rencana pengelolaan lahan yang praktis"
    hi: "व्यावहारिक भूमि प्रबंधन योजना बनाना"
  - en: "Weigh environmental, economic and social effects"
    zh: "权衡环境、经济和社会影响"
    zh-TW: "權衡環境、經濟和社會影響"
    ja: "環境・経済・社会への影響を比べる"
    ko: "환경·경제·사회적 영향 따져보기"
    vi: "Cân nhắc tác động môi trường, kinh tế, xã hội"
    ms: "Timbang kesan alam sekitar, ekonomi dan sosial"
    id: "Menimbang dampak lingkungan, ekonomi, dan sosial"
    hi: "पर्यावरणीय, आर्थिक और सामाजिक असर तौलना"
