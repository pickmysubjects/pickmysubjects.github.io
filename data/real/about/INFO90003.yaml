code: INFO90003
year: 2027
learn:
  en: "Designing for interfaces beyond the desktop, like mobile, tangible, wearable and ambient tech, and testing them."
  zh: "为桌面以外的界面做设计，如移动、实体、环境感知设备，并进行评估。"
  zh-TW: "為桌面以外的介面做設計，如行動、實體、環境感知裝置，並進行評估。"
  ja: "モバイルや触れるUI、環境ディスプレイなどデスクトップ外のUIの設計と評価。"
  ko: "모바일·실물형·주변 디스플레이 등 데스크톱 밖 인터페이스 설계와 평가."
  vi: "Thiết kế giao diện ngoài máy tính để bàn như di động, hữu hình, môi trường xung quanh, và đánh giá chúng."
  ms: "Mereka bentuk antara muka selain desktop seperti mudah alih, ketara dan ambien, serta menilainya."
  id: "Merancang antarmuka di luar desktop seperti seluler, tangible, dan ambient, serta mengujinya."
  hi: "डेस्कटॉप से आगे के इंटरफ़ेस, जैसे मोबाइल, टैंजिबल और एम्बिएंट डिज़ाइन करना और परखना।"
outcomes:
  - en: "Prototype an interactive system with new input methods"
    zh: "用新的输入方式制作交互原型"
    zh-TW: "用新的輸入方式製作互動原型"
    ja: "新しい入力方式で対話型システムを試作する"
    ko: "새로운 입력 방식으로 인터랙티브 시스템 프로토타입 만들기"
    vi: "Làm nguyên mẫu hệ thống tương tác với cách nhập mới"
    ms: "Membina prototaip sistem interaktif dengan input baharu"
    id: "Membuat prototipe sistem interaktif dengan input baru"
    hi: "नए इनपुट तरीकों से इंटरैक्टिव प्रोटोटाइप बनाना"
  - en: "Evaluate how well a novel interface works"
    zh: "评估新型界面的效果"
    zh-TW: "評估新型介面的成效"
    ja: "新しいインターフェースの有効性を評価する"
    ko: "새로운 인터페이스의 효과 평가하기"
    vi: "Đánh giá một giao diện mới hoạt động tốt đến đâu"
    ms: "Menilai keberkesanan antara muka baharu"
    id: "Menilai seberapa baik antarmuka baru bekerja"
    hi: "नए इंटरफ़ेस की उपयोगिता परखना"
