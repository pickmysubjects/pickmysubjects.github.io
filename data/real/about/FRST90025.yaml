code: FRST90025
year: 2027
learn:
  en: "What drives wildfire behaviour: fuel, weather, topography and ignition, and how to predict fire spread."
  zh: "野火行为的驱动因素：燃料、天气、地形和起火源，以及如何预测火势蔓延。"
  zh-TW: "野火行為的驅動因素：燃料、天氣、地形和起火源，以及如何預測火勢蔓延。"
  ja: "山火事の要因（燃料・気象・地形・着火）と延焼予測の方法。"
  ko: "산불 행동의 요인(연료, 기상, 지형, 발화)과 확산 예측 방법."
  vi: "Yếu tố chi phối cháy rừng: nhiên liệu, thời tiết, địa hình, nguồn lửa, và cách dự báo lan truyền."
  ms: "Pemacu tingkah laku kebakaran: bahan api, cuaca, topografi dan pencucuhan, serta ramalan rebakan."
  id: "Pendorong perilaku kebakaran: bahan bakar, cuaca, topografi, dan sumber api, serta prediksi penyebaran."
  hi: "जंगल की आग के कारक: ईंधन, मौसम, भू-आकृति और प्रज्वलन, और आग फैलाव का अनुमान।"
outcomes:
  - en: "Assess fuels and fire hazard"
    zh: "评估可燃物与火灾危险"
    zh-TW: "評估可燃物與火災危險"
    ja: "燃料と火災危険度を評価する"
    ko: "연료와 화재 위험 평가하기"
    vi: "Đánh giá nhiên liệu và nguy cơ cháy"
    ms: "Menilai bahan api dan bahaya kebakaran"
    id: "Menilai bahan bakar dan bahaya kebakaran"
    hi: "ईंधन और आग के ख़तरे का आकलन"
  - en: "Predict fire spread with models"
    zh: "用模型预测火势蔓延"
    zh-TW: "用模型預測火勢蔓延"
    ja: "モデルで延焼を予測する"
    ko: "모델로 화재 확산 예측하기"
    vi: "Dự báo lan truyền lửa bằng mô hình"
    ms: "Meramal rebakan api dengan model"
    id: "Memprediksi penyebaran api dengan model"
    hi: "मॉडल से आग फैलाव का अनुमान"
