code: MCEN90017
year: 2027
learn:
  en: "Designing and testing advanced controllers for industrial motion systems such as robots and machine tools."
  zh: "为机器人、机床等工业运动系统设计并实现高级控制器。"
  zh-TW: "為機器人、工具機等工業運動系統設計並實作進階控制器。"
  ja: "ロボットや工作機械などの産業用モーション制御で高度な制御器を設計・実装する。"
  ko: "로봇, 공작기계 같은 산업용 운동 시스템의 고급 제어기 설계와 구현."
  vi: "Thiết kế và triển khai bộ điều khiển nâng cao cho robot, máy công cụ."
  ms: "Mereka bentuk dan melaksanakan pengawal lanjutan untuk robot dan mesin perkakas."
  id: "Merancang dan menerapkan pengendali lanjut untuk robot dan mesin perkakas."
  hi: "रोबोट और मशीन टूल जैसे सिस्टम के लिए उन्नत कंट्रोलर डिज़ाइन व लागू करना।"
outcomes:
  - en: "Identify system models and compensate for friction"
    zh: "辨识系统模型并补偿摩擦"
    zh-TW: "辨識系統模型並補償摩擦"
    ja: "システム同定と摩擦補償を行う"
    ko: "시스템 식별과 마찰 보상하기"
    vi: "Nhận dạng hệ thống và bù ma sát"
    ms: "Mengenal pasti model sistem dan mengimbangi geseran"
    id: "Mengidentifikasi model sistem dan mengompensasi gesekan"
    hi: "सिस्टम पहचान और घर्षण की भरपाई"
  - en: "Design model-based, model-free and adaptive controllers"
    zh: "设计基于模型、无模型和自适应控制器"
    zh-TW: "設計基於模型、無模型與自適應控制器"
    ja: "モデルベース・モデルフリー・適応制御器を設計する"
    ko: "모델 기반·모델 프리·적응 제어기 설계하기"
    vi: "Thiết kế bộ điều khiển dựa trên mô hình, không mô hình và thích nghi"
    ms: "Mereka bentuk pengawal berasaskan model, tanpa model dan adaptif"
    id: "Merancang pengendali berbasis model, tanpa model, dan adaptif"
    hi: "मॉडल-आधारित, मॉडल-रहित और अनुकूली कंट्रोलर डिज़ाइन"
