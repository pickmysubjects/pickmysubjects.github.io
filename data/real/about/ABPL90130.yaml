code: ABPL90130
year: 2027
learn:
  en: "The legal framework for urban planning in Australia, especially Victoria, and how planning schemes are prepared and run."
  zh: "澳大利亚（尤其维州）城市规划的法律框架，以及规划方案如何制定和执行。"
  zh-TW: "澳洲（尤其維州）城市規劃的法律框架，以及規劃方案如何制定與執行。"
  ja: "オーストラリア（特にビクトリア州）の都市計画の法制度と、計画スキームの作成・運用。"
  ko: "호주(특히 빅토리아주) 도시계획의 법적 틀과 계획 체계의 수립·운영 방식."
  vi: "Khung pháp lý quy hoạch đô thị ở Úc, nhất là Victoria, và cách lập, vận hành quy hoạch."
  ms: "Rangka undang-undang perancangan bandar di Australia, terutama Victoria, dan cara skim perancangan dijalankan."
  id: "Kerangka hukum perencanaan kota di Australia, terutama Victoria, dan cara skema perencanaan dijalankan."
  hi: "ऑस्ट्रेलिया, खासकर विक्टोरिया में शहरी नियोजन का क़ानूनी ढांचा और योजना स्कीमें कैसे बनती-चलती हैं।"
outcomes:
  - en: "Carry out entry-level statutory planning tasks"
    zh: "完成入门级法定规划工作"
    zh-TW: "完成入門級法定規劃工作"
    ja: "初級レベルの法定計画業務を行う"
    ko: "초급 법정 계획 업무 수행하기"
    vi: "Thực hiện công việc quy hoạch luật định cơ bản"
    ms: "Melaksanakan tugas perancangan statutori asas"
    id: "Melakukan tugas perencanaan statutori dasar"
    hi: "प्रारंभिक वैधानिक नियोजन कार्य करना"
  - en: "Critically assess current planning processes"
    zh: "批判性评估现行规划程序"
    zh-TW: "批判性評估現行規劃程序"
    ja: "現行の計画手続きを批判的に評価する"
    ko: "현행 계획 절차 비판적으로 평가하기"
    vi: "Đánh giá phản biện quy trình quy hoạch hiện hành"
    ms: "Menilai proses perancangan semasa secara kritis"
    id: "Menilai kritis proses perencanaan saat ini"
    hi: "मौजूदा नियोजन प्रक्रियाओं का आलोचनात्मक आकलन"
