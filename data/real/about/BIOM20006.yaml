code: BIOM20006
year: 2027
learn:
  en: "The heart, lungs and kidneys: how the body keeps blood flowing, exchanges gases and filters its internal environment."
  zh: "心脏、肺和肾脏：身体如何维持血液流动、气体交换和内环境的过滤调节。"
  zh-TW: "心臟、肺和腎臟：身體如何維持血液流動、氣體交換和內在環境的過濾調節。"
  ja: "心臓・肺・腎臓：体が血流、ガス交換、体内環境のろ過と調節をどう保つか。"
  ko: "심장·폐·신장: 몸이 혈류, 가스 교환, 내부 환경 여과를 어떻게 유지하는지."
  vi: "Tim, phổi và thận: cơ thể duy trì dòng máu, trao đổi khí và lọc môi trường bên trong như thế nào."
  ms: "Jantung, paru-paru dan buah pinggang: cara badan mengekalkan aliran darah, pertukaran gas dan penapisan persekitaran dalaman."
  id: "Jantung, paru-paru, dan ginjal: cara tubuh menjaga aliran darah, pertukaran gas, dan penyaringan lingkungan internal."
  hi: "दिल, फेफड़े और गुर्दे: शरीर रक्त प्रवाह, गैस विनिमय और अंदरूनी वातावरण का फ़िल्टरेशन कैसे बनाए रखता है।"
outcomes:
  - en: "Predict heart, lung and kidney responses"
    zh: "预测心、肺、肾系统的反应"
    zh-TW: "預測心、肺、腎系統的反應"
    ja: "心臓・肺・腎臓の反応を予測する"
    ko: "심장·폐·신장의 반응 예측하기"
    vi: "Dự đoán phản ứng của tim, phổi và thận"
    ms: "Ramal tindak balas jantung, paru-paru dan buah pinggang"
    id: "Memprediksi respons jantung, paru, dan ginjal"
    hi: "दिल, फेफड़ों और गुर्दों की प्रतिक्रिया का अनुमान"
  - en: "Identify anatomy and relate structure to function"
    zh: "辨认解剖结构并联系其功能"
    zh-TW: "辨認解剖構造並連結其功能"
    ja: "解剖構造を見分け、構造と機能を結びつける"
    ko: "해부 구조를 식별하고 구조와 기능 연결하기"
    vi: "Nhận diện giải phẫu và liên hệ cấu trúc với chức năng"
    ms: "Kenal pasti anatomi dan kaitkan struktur dengan fungsi"
    id: "Mengenali anatomi dan mengaitkan struktur dengan fungsi"
    hi: "शरीर-रचना पहचानना और संरचना को कार्य से जोड़ना"
