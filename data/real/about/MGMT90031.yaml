code: MGMT90031
year: 2027
learn:
  en: "Choosing, planning, scheduling and tracking projects, and the leadership needed to make them succeed."
  zh: "项目的选择、规划、排期和跟踪，以及让项目成功所需的领导力。"
  zh-TW: "專案的選擇、規劃、排程與追蹤，以及讓專案成功所需的領導力。"
  ja: "プロジェクトの選定・計画・スケジュール・進捗管理と、成功に必要なリーダーシップ。"
  ko: "프로젝트 선정, 계획, 일정, 진척 관리와 성공에 필요한 리더십."
  vi: "Chọn, lập kế hoạch, lên lịch, theo dõi dự án và năng lực lãnh đạo để dự án thành công."
  ms: "Memilih, merancang, menjadual dan menjejak projek, serta kepimpinan untuk menjayakannya."
  id: "Memilih, merencanakan, menjadwalkan dan memantau proyek, serta kepemimpinan agar berhasil."
  hi: "प्रोजेक्ट चुनना, योजना, शेड्यूल और निगरानी करना, और उन्हें सफल बनाने वाला नेतृत्व।"
outcomes:
  - en: "Write a formal project plan"
    zh: "编写正式的项目计划"
    zh-TW: "撰寫正式的專案計畫"
    ja: "正式なプロジェクト計画を作る"
    ko: "공식 프로젝트 계획 작성하기"
    vi: "Viết kế hoạch dự án chính thức"
    ms: "Menulis pelan projek formal"
    id: "Menyusun rencana proyek formal"
    hi: "औपचारिक प्रोजेक्ट योजना लिखना"
  - en: "Schedule work and measure progress"
    zh: "安排进度并衡量项目进展"
    zh-TW: "安排進度並衡量專案進展"
    ja: "日程を組み進捗を測る"
    ko: "일정 수립과 진척 측정하기"
    vi: "Lên lịch và đo lường tiến độ"
    ms: "Menjadual kerja dan mengukur kemajuan"
    id: "Menjadwalkan kerja dan mengukur kemajuan"
    hi: "काम का शेड्यूल बनाना और प्रगति मापना"
