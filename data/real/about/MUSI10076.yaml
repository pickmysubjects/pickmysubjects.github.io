code: MUSI10076
year: 2026
learn:
  en: "Develop piano duo and four-hands duet technique on repertoire from the 18th century to today; entry by audition."
  zh: "学习双钢琴和四手联弹技巧，曲目从18世纪至今；需试音入选。"
  zh-TW: "學習雙鋼琴與四手聯彈技巧，曲目從18世紀至今；需試音入選。"
  ja: "18世紀から現代までの曲で、2台ピアノと連弾の技術を磨く。オーディションあり。"
  ko: "18세기부터 현대까지의 곡으로 피아노 듀오와 연탄 기술을 익힘. 오디션 필요."
  vi: "Rèn kỹ thuật song tấu hai đàn và bốn tay piano với tác phẩm từ thế kỷ 18 đến nay; cần thử giọng."
  ms: "Bangunkan teknik duo dan duet piano dengan karya abad ke-18 hingga kini; masuk melalui uji bakat."
  id: "Mengembangkan teknik duo dan duet piano dengan karya abad ke-18 hingga kini; masuk lewat audisi."
  hi: "18वीं सदी से आज तक की रचनाओं पर पियानो डुओ और डुएट तकनीक; ऑडिशन से प्रवेश।"
outcomes:
  - en: "Work confidently as part of an ensemble"
    zh: "自信地作为合奏团的一员合作"
    zh-TW: "自信地作為合奏團的一員合作"
    ja: "アンサンブルの一員として自信を持って演奏する"
    ko: "앙상블의 일원으로 자신 있게 협업하기"
    vi: "Tự tin phối hợp trong một ban nhạc"
    ms: "Bekerja yakin sebagai ahli ensembel"
    id: "Bekerja percaya diri dalam ensambel"
    hi: "समूह के सदस्य के रूप में आत्मविश्वास से बजाना"
  - en: "Perform repertoire to concert standard"
    zh: "以音乐会水准演出曲目"
    zh-TW: "以音樂會水準演出曲目"
    ja: "演奏会レベルで曲を演奏する"
    ko: "연주회 수준으로 곡 연주하기"
    vi: "Biểu diễn tác phẩm ở chuẩn hòa nhạc"
    ms: "Persembahkan karya pada tahap konsert"
    id: "Membawakan repertoar setara konser"
    hi: "कॉन्सर्ट स्तर पर रचनाएँ प्रस्तुत करना"
  - en: "Know a range of ensemble repertoire"
    zh: "熟悉多种合奏曲目"
    zh-TW: "熟悉多種合奏曲目"
    ja: "さまざまなアンサンブル曲を知る"
    ko: "다양한 앙상블 레퍼토리 알기"
    vi: "Hiểu nhiều tác phẩm hòa tấu"
    ms: "Kenali pelbagai repertoir ensembel"
    id: "Mengenal beragam repertoar ensambel"
    hi: "विभिन्न समूह रचनाओं की जानकारी"
