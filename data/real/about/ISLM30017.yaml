code: ISLM30017
year: 2026
learn:
  en: "The Islamic Studies capstone: how today's Muslim scholars respond to modern theological, political and ethical challenges."
  zh: "伊斯兰研究总结课：当代穆斯林学者如何回应神学、政治和伦理上的现代挑战。"
  zh-TW: "伊斯蘭研究總結課：當代穆斯林學者如何回應神學、政治和倫理上的現代挑戰。"
  ja: "イスラム研究のキャップストーン。現代のムスリム学者が神学・政治・倫理の課題にどう応えるかを学ぶ。"
  ko: "이슬람학 캡스톤: 오늘날 무슬림 학자들이 신학적·정치적·윤리적 과제에 어떻게 대응하는지 배운다."
  vi: "Môn tổng kết ngành Hồi giáo học: học giả Hồi giáo ngày nay ứng phó với thách thức thần học, chính trị, đạo đức ra sao."
  ms: "Subjek akhir Pengajian Islam: cara sarjana Islam kini menjawab cabaran teologi, politik dan etika moden."
  id: "Mata kuliah penutup Studi Islam: cara cendekiawan Muslim kini menjawab tantangan teologis, politik, dan etis modern."
  hi: "इस्लामिक स्टडीज़ कैपस्टोन: आज के मुस्लिम विद्वान आधुनिक धार्मिक, राजनीतिक और नैतिक चुनौतियों का जवाब कैसे देते हैं।"
outcomes:
  - en: "Draw together learning from the major"
    zh: "整合专业所学"
    zh-TW: "整合主修所學"
    ja: "専攻での学びをまとめる"
    ko: "전공에서 배운 것 종합하기"
    vi: "Tổng hợp kiến thức từ chuyên ngành"
    ms: "Gabungkan pembelajaran daripada major"
    id: "Menyatukan pembelajaran dari jurusan"
    hi: "मेजर से सीखी बातों को जोड़ना"
  - en: "Analyse modern challenges facing Muslims"
    zh: "分析穆斯林面临的现代挑战"
    zh-TW: "分析穆斯林面臨的現代挑戰"
    ja: "ムスリムが直面する現代の課題を分析する"
    ko: "무슬림이 마주한 현대적 과제 분석하기"
    vi: "Phân tích các thách thức hiện đại người Hồi giáo đối mặt"
    ms: "Analisis cabaran moden yang dihadapi umat Islam"
    id: "Menganalisis tantangan modern yang dihadapi Muslim"
    hi: "मुसलमानों के सामने आधुनिक चुनौतियों का विश्लेषण करना"
  - en: "Develop and present your own research"
    zh: "开展并展示自己的研究"
    zh-TW: "開展並展示自己的研究"
    ja: "自分の研究を進め発表する"
    ko: "자신의 연구를 발전시키고 발표하기"
    vi: "Phát triển và trình bày nghiên cứu của riêng bạn"
    ms: "Bangunkan dan bentangkan kajian sendiri"
    id: "Mengembangkan dan menyajikan riset sendiri"
    hi: "अपना शोध विकसित करना और प्रस्तुत करना"
