code: ABPL90386
year: 2027
learn:
  en: "A two-week July design studio run with the Architectural Association (UK), using digital design tools in teams."
  zh: "七月为期两周的设计工作营，与英国建筑联盟学院合办，小组使用数字设计工具。"
  zh-TW: "七月為期兩週的設計工作營，與英國建築聯盟學院合辦，小組使用數位設計工具。"
  ja: "英国AAスクールと行う7月の2週間スタジオで、チームでデジタル設計ツールを使う。"
  ko: "영국 AA 스쿨과 함께하는 7월 2주 디자인 스튜디오로, 팀으로 디지털 설계 도구를 씁니다."
  vi: "Studio thiết kế hai tuần vào tháng 7 cùng Architectural Association (Anh), làm nhóm với công cụ số."
  ms: "Studio reka bentuk dua minggu pada Julai bersama Architectural Association (UK), berpasukan dengan alat digital."
  id: "Studio desain dua minggu di bulan Juli bersama Architectural Association (UK), berkelompok dengan alat digital."
  hi: "जुलाई में आर्किटेक्चरल एसोसिएशन (UK) के साथ दो हफ़्ते का डिज़ाइन स्टूडियो, टीम में डिजिटल टूल।"
outcomes:
  - en: "Deliver a design project in a small team"
    zh: "小组合作完成设计项目"
    zh-TW: "小組合作完成設計專案"
    ja: "小チームで設計プロジェクトを仕上げる"
    ko: "소규모 팀으로 설계 프로젝트 완성하기"
    vi: "Hoàn thành dự án thiết kế theo nhóm nhỏ"
    ms: "Menyiapkan projek reka bentuk dalam pasukan kecil"
    id: "Menyelesaikan proyek desain dalam tim kecil"
    hi: "छोटी टीम में डिज़ाइन प्रोजेक्ट पूरा करना"
  - en: "Present with models and drawings"
    zh: "用模型和图纸进行展示"
    zh-TW: "用模型和圖紙進行展示"
    ja: "模型と図面で発表する"
    ko: "모형과 도면으로 발표하기"
    vi: "Trình bày bằng mô hình và bản vẽ"
    ms: "Membentang dengan model dan lukisan"
    id: "Presentasi dengan model dan gambar"
    hi: "मॉडल और ड्रॉइंग से प्रस्तुति"
