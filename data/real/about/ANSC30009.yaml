code: ANSC30009
year: 2026
learn:
  en: "Systems thinking for animal industries, balancing animal welfare, environment and profit in real decisions."
  zh: "用系统思维看动物产业，在实际决策中平衡福利、环境与收益。"
  zh-TW: "用系統思維看動物產業，在實際決策中平衡福利、環境與收益。"
  ja: "動物産業をシステム思考で捉え、福祉・環境・収益のバランスを取る。"
  ko: "동물 산업을 시스템적으로 보고 복지·환경·수익의 균형 잡기."
  vi: "Tư duy hệ thống cho ngành chăn nuôi, cân bằng phúc lợi, môi trường và lợi nhuận."
  ms: "Pemikiran sistem untuk industri haiwan, mengimbangi kebajikan, alam sekitar dan keuntungan."
  id: "Berpikir sistem untuk industri hewan, menyeimbangkan kesejahteraan, lingkungan, dan keuntungan."
  hi: "पशु उद्योग के लिए सिस्टम सोच, कल्याण, पर्यावरण और मुनाफ़े में संतुलन।"
outcomes:
  - en: "Apply systems theory to real animal enterprises"
    zh: "把系统理论用于真实养殖企业"
    zh-TW: "把系統理論用於真實畜牧企業"
    ja: "システム理論を実際の畜産経営に応用する"
    ko: "시스템 이론을 실제 축산 경영에 적용하기"
    vi: "Áp dụng lý thuyết hệ thống vào trang trại thật"
    ms: "Gunakan teori sistem pada perusahaan haiwan sebenar"
    id: "Menerapkan teori sistem pada usaha peternakan nyata"
    hi: "सिस्टम सिद्धांत को असली पशु उद्यमों पर लगाना"
  - en: "Use evidence to solve multi-stakeholder problems"
    zh: "用证据解决多方利益问题"
    zh-TW: "用證據解決多方利害問題"
    ja: "根拠に基づき多者間の問題を解く"
    ko: "근거로 다자 이해관계 문제 풀기"
    vi: "Dùng bằng chứng giải vấn đề nhiều bên"
    ms: "Guna bukti untuk selesaikan masalah pelbagai pihak"
    id: "Memakai bukti untuk masalah banyak pemangku"
    hi: "सबूतों से कई पक्षों वाली समस्याएँ हल करना"
