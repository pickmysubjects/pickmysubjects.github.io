code: DNCE20039
year: 2026
learn:
  en: "Spend at least ten days on placement with a dance company or arts organisation, then reflect on the industry."
  zh: "在舞蹈团或艺术机构至少实习十天，然后反思这个行业。"
  zh-TW: "在舞團或藝術機構至少實習十天，然後反思這個產業。"
  ja: "ダンスカンパニーや芸術団体で10日以上の実習を行い、業界について振り返る。"
  ko: "무용단이나 예술 기관에서 최소 10일 실습 후 업계를 성찰한다."
  vi: "Thực tập ít nhất mười ngày ở đoàn múa hay tổ chức nghệ thuật, rồi suy ngẫm về ngành."
  ms: "Penempatan sekurang-kurangnya sepuluh hari di syarikat tari, kemudian renung industri."
  id: "Magang minimal sepuluh hari di kelompok tari atau lembaga seni, lalu refleksi."
  hi: "किसी डांस कंपनी या कला संस्था में कम से कम दस दिन का प्लेसमेंट और उद्योग पर चिंतन।"
outcomes:
  - en: "Set goals and a plan for a placement"
    zh: "为实习制定目标和计划"
    zh-TW: "為實習訂定目標與計畫"
    ja: "実習の目標と計画を立てる"
    ko: "실습 목표와 계획 세우기"
    vi: "Đặt mục tiêu và kế hoạch thực tập"
    ms: "Tetapkan matlamat dan pelan penempatan"
    id: "Menetapkan tujuan dan rencana magang"
    hi: "प्लेसमेंट के लक्ष्य और योजना बनाना"
  - en: "Work professionally in the dance sector"
    zh: "在舞蹈行业中专业地工作"
    zh-TW: "在舞蹈產業中專業地工作"
    ja: "ダンス業界でプロとして働く"
    ko: "무용 업계에서 전문적으로 일하기"
    vi: "Làm việc chuyên nghiệp trong ngành múa"
    ms: "Bekerja secara profesional dalam sektor tari"
    id: "Bekerja profesional di sektor tari"
    hi: "डांस क्षेत्र में पेशेवर ढंग से काम करना"
  - en: "Document what you learned on placement"
    zh: "记录实习中的收获"
    zh-TW: "記錄實習中的收穫"
    ja: "実習で学んだことを記録する"
    ko: "실습에서 배운 것 기록하기"
    vi: "Ghi lại điều học được khi thực tập"
    ms: "Dokumen apa yang dipelajari"
    id: "Mendokumentasikan pelajaran magang"
    hi: "प्लेसमेंट में सीखी बातें दर्ज करना"
