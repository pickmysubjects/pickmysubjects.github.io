code: INDO20001
year: 2026
learn:
  en: "An overseas intensive in Indonesia on the history, politics, culture and language behind the modern nation, taught in English."
  zh: "在印尼进行的海外密集课程，用英语讲授现代印尼背后的历史、政治、文化和语言。"
  zh-TW: "在印尼進行的海外密集課程，以英語講授現代印尼背後的歷史、政治、文化和語言。"
  ja: "インドネシアで行う海外集中科目。現代国家の背景にある歴史・政治・文化・言語を英語で学ぶ。"
  ko: "인도네시아에서 하는 해외 집중 과목으로, 현대 국가 뒤의 역사·정치·문화·언어를 영어로 배운다."
  vi: "Môn học tập trung ở Indonesia về lịch sử, chính trị, văn hóa và ngôn ngữ làm nên quốc gia hiện đại, dạy bằng tiếng Anh."
  ms: "Kursus intensif di Indonesia tentang sejarah, politik, budaya dan bahasa di sebalik negara moden, diajar dalam bahasa Inggeris."
  id: "Kuliah intensif di Indonesia tentang sejarah, politik, budaya, dan bahasa di balik negara modern, diajarkan dalam bahasa Inggris."
  hi: "इंडोनेशिया में विदेशी इंटेंसिव विषय, आधुनिक राष्ट्र के पीछे के इतिहास, राजनीति, संस्कृति और भाषा पर, अंग्रेज़ी में।"
outcomes:
  - en: "Explain forces that shaped modern Indonesia"
    zh: "解释塑造现代印尼的因素"
    zh-TW: "解釋塑造現代印尼的因素"
    ja: "現代インドネシアを形づくった要因を説明する"
    ko: "현대 인도네시아를 만든 요인 설명하기"
    vi: "Giải thích các yếu tố định hình Indonesia hiện đại"
    ms: "Terangkan faktor yang membentuk Indonesia moden"
    id: "Menjelaskan faktor yang membentuk Indonesia modern"
    hi: "आधुनिक इंडोनेशिया को गढ़ने वाली ताकतें समझाना"
  - en: "Apply social science ideas to Indonesia"
    zh: "把社会科学概念用于印尼研究"
    zh-TW: "把社會科學概念用於印尼研究"
    ja: "社会科学の考えをインドネシアに当てはめる"
    ko: "사회과학 개념을 인도네시아에 적용하기"
    vi: "Áp dụng khái niệm khoa học xã hội vào Indonesia"
    ms: "Gunakan idea sains sosial pada Indonesia"
    id: "Menerapkan gagasan ilmu sosial pada Indonesia"
    hi: "सामाजिक विज्ञान के विचारों को इंडोनेशिया पर लागू करना"
  - en: "Prepare a research report on Indonesia"
    zh: "撰写一份关于印尼的研究报告"
    zh-TW: "撰寫一份關於印尼的研究報告"
    ja: "インドネシアについての研究レポートを作る"
    ko: "인도네시아 연구 보고서 작성하기"
    vi: "Chuẩn bị một báo cáo nghiên cứu về Indonesia"
    ms: "Sediakan laporan kajian tentang Indonesia"
    id: "Menyusun laporan riset tentang Indonesia"
    hi: "इंडोनेशिया पर एक शोध रिपोर्ट तैयार करना"
