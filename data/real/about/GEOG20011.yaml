code: GEOG20011
year: 2026
learn:
  en: "How inequality is made and lived at different scales, and how environmental change in the Anthropocene creates new forms of it."
  zh: "不平等在不同尺度上如何产生与被经历，以及人类世的环境变化如何带来新的不平等。"
  zh-TW: "不平等在不同尺度上如何產生與被經歷，以及人類世的環境變化如何帶來新的不平等。"
  ja: "不平等がさまざまなスケールでどう生まれ経験されるか、人新世の環境変化が新たな不平等をどう生むかを学ぶ。"
  ko: "불평등이 여러 규모에서 어떻게 만들어지고 경험되는지, 인류세의 환경 변화가 새 불평등을 어떻게 낳는지 배운다."
  vi: "Bất bình đẳng được tạo ra và trải nghiệm ở nhiều quy mô ra sao, và biến đổi môi trường thời Anthropocene tạo dạng mới thế nào."
  ms: "Cara ketaksamaan terhasil dan dialami pada pelbagai skala, dan cara perubahan alam sekitar Antroposen mencipta bentuk baharu."
  id: "Cara ketimpangan tercipta dan dialami di berbagai skala, dan cara perubahan lingkungan di Antroposen memunculkan bentuk baru."
  hi: "असमानता अलग-अलग स्तरों पर कैसे बनती और जी जाती है, और एंथ्रोपोसीन का पर्यावरण बदलाव इसके नए रूप कैसे बनाता है।"
outcomes:
  - en: "Explain inequality at local and global scales"
    zh: "解释地方与全球尺度上的不平等"
    zh-TW: "解釋地方與全球尺度上的不平等"
    ja: "地域と世界のスケールで不平等を説明する"
    ko: "지역과 세계 규모의 불평등 설명하기"
    vi: "Giải thích bất bình đẳng ở quy mô địa phương và toàn cầu"
    ms: "Terangkan ketaksamaan pada skala tempatan dan global"
    id: "Menjelaskan ketimpangan di skala lokal dan global"
    hi: "स्थानीय और वैश्विक स्तर पर असमानता समझाना"
  - en: "Link environmental change to inequality"
    zh: "把环境变化与不平等联系起来"
    zh-TW: "把環境變化與不平等聯繫起來"
    ja: "環境変化と不平等を結びつける"
    ko: "환경 변화를 불평등과 연결하기"
    vi: "Liên hệ biến đổi môi trường với bất bình đẳng"
    ms: "Kaitkan perubahan alam sekitar dengan ketaksamaan"
    id: "Mengaitkan perubahan lingkungan dengan ketimpangan"
    hi: "पर्यावरण बदलाव को असमानता से जोड़ना"
  - en: "Discuss ideas of justice in geography"
    zh: "讨论地理学中的正义观"
    zh-TW: "討論地理學中的正義觀"
    ja: "地理学における正義の考えを論じる"
    ko: "지리학의 정의 개념 논의하기"
    vi: "Thảo luận các quan niệm công bằng trong địa lý học"
    ms: "Bincangkan idea keadilan dalam geografi"
    id: "Membahas gagasan keadilan dalam geografi"
    hi: "भूगोल में न्याय के विचारों पर चर्चा करना"
