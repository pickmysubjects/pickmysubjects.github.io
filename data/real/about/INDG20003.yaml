code: INDG20003
year: 2026
learn:
  en: "The roles Aboriginal women have played in activism and leadership, past and present, and the voices often left out."
  zh: "原住民女性过去和现在在社会行动与领导中的角色，以及常被忽视的声音。"
  zh-TW: "原住民女性過去和現在在社會行動與領導中的角色，以及常被忽視的聲音。"
  ja: "アボリジナルの女性が過去と現在に運動とリーダーシップで果たした役割と、見過ごされがちな声を学ぶ。"
  ko: "원주민 여성이 과거와 현재 운동과 리더십에서 맡아 온 역할, 그리고 자주 지워지는 목소리를 배운다."
  vi: "Vai trò của phụ nữ Thổ dân trong hoạt động xã hội và lãnh đạo, xưa và nay, và những tiếng nói thường bị bỏ qua."
  ms: "Peranan wanita Orang Asli dalam aktivisme dan kepimpinan, dulu dan kini, serta suara yang sering diketepikan."
  id: "Peran perempuan Aborigin dalam aktivisme dan kepemimpinan, dulu dan kini, serta suara yang sering terabaikan."
  hi: "आदिवासी (एबोरिजिनल) महिलाओं की सक्रियता और नेतृत्व में भूमिका, अतीत और वर्तमान, और अक्सर छूट जाने वाली आवाज़ें।"
outcomes:
  - en: "Describe Aboriginal women's activism in history"
    zh: "描述历史上原住民女性的社会行动"
    zh-TW: "描述歷史上原住民女性的社會行動"
    ja: "歴史の中のアボリジナル女性の運動を説明する"
    ko: "역사 속 원주민 여성의 운동 설명하기"
    vi: "Mô tả hoạt động của phụ nữ Thổ dân trong lịch sử"
    ms: "Huraikan aktivisme wanita Orang Asli dalam sejarah"
    id: "Mendeskripsikan aktivisme perempuan Aborigin dalam sejarah"
    hi: "इतिहास में एबोरिजिनल महिलाओं की सक्रियता का वर्णन करना"
  - en: "Compare Indigenous and other views of leadership"
    zh: "比较原住民与其他视角下的领导观"
    zh-TW: "比較原住民與其他視角下的領導觀"
    ja: "先住民とそれ以外のリーダー観を比べる"
    ko: "원주민과 다른 관점의 리더십 비교하기"
    vi: "So sánh quan niệm lãnh đạo bản địa và quan niệm khác"
    ms: "Bandingkan pandangan kepimpinan Orang Asal dan lain-lain"
    id: "Membandingkan pandangan kepemimpinan adat dan lainnya"
    hi: "नेतृत्व पर मूलनिवासी और अन्य दृष्टियों की तुलना करना"
  - en: "Analyse how colonisation silenced women's voices"
    zh: "分析殖民如何压制女性的声音"
    zh-TW: "分析殖民如何壓制女性的聲音"
    ja: "植民地化が女性の声をどう封じたか分析する"
    ko: "식민화가 여성의 목소리를 지운 방식 분석하기"
    vi: "Phân tích thực dân hóa đã làm im tiếng phụ nữ ra sao"
    ms: "Analisis cara penjajahan membisukan suara wanita"
    id: "Menganalisis cara kolonisasi membungkam suara perempuan"
    hi: "उपनिवेशवाद ने महिलाओं की आवाज़ कैसे दबाई, विश्लेषण करना"
