code: FNCE20005
year: 2026
learn:
  en: "How companies decide on investments, funding and payouts, including taxes, takeovers and restructuring."
  zh: "公司怎么做投资、融资和分红决策，包括税务、并购和重组。"
  zh-TW: "公司怎麼做投資、籌資和股利決策，包括稅務、併購和重組。"
  ja: "企業の投資・資金調達・配当の意思決定。税金、買収、再編も含む。"
  ko: "기업의 투자, 자금 조달, 배당 결정. 세금, 인수, 구조조정 포함."
  vi: "Doanh nghiệp quyết định đầu tư, huy động vốn và chi trả ra sao, gồm thuế, thâu tóm và tái cấu trúc."
  ms: "Cara syarikat buat keputusan pelaburan, pembiayaan dan dividen, termasuk cukai, pengambilalihan dan penstrukturan semula."
  id: "Cara perusahaan memutuskan investasi, pendanaan, dan dividen, termasuk pajak, akuisisi, dan restrukturisasi."
  hi: "कंपनियाँ निवेश, फ़ंडिंग और भुगतान के फ़ैसले कैसे लेती हैं, टैक्स, अधिग्रहण और पुनर्गठन सहित।"
outcomes:
  - en: "Evaluate projects when taxes are involved"
    zh: "在考虑税的情况下评估项目"
    zh-TW: "在考慮稅的情況下評估專案"
    ja: "税金を考慮してプロジェクトを評価する"
    ko: "세금을 고려한 프로젝트 평가"
    vi: "Đánh giá dự án khi có thuế"
    ms: "Nilai projek apabila cukai terlibat"
    id: "Menilai proyek dengan memperhitungkan pajak"
    hi: "टैक्स को ध्यान में रखकर प्रोजेक्ट का मूल्यांकन"
  - en: "Explain how firms raise debt and equity"
    zh: "解释公司怎么借债和发股"
    zh-TW: "解釋公司怎麼舉債和發行股票"
    ja: "企業の借入と株式発行の仕組みを説明する"
    ko: "기업의 부채·자기자본 조달 방식 설명"
    vi: "Giải thích doanh nghiệp vay nợ và phát hành cổ phần ra sao"
    ms: "Terangkan cara firma kumpul hutang dan ekuiti"
    id: "Menjelaskan cara perusahaan menghimpun utang dan ekuitas"
    hi: "कंपनियाँ डेट और इक्विटी कैसे जुटाती हैं, समझाना"
  - en: "Assess the effects of mergers and restructuring"
    zh: "评估并购和重组的影响"
    zh-TW: "評估併購和重組的影響"
    ja: "合併や再編の影響を評価する"
    ko: "합병과 구조조정의 영향 평가"
    vi: "Đánh giá tác động của sáp nhập và tái cấu trúc"
    ms: "Nilai kesan penggabungan dan penstrukturan semula"
    id: "Menilai dampak merger dan restrukturisasi"
    hi: "विलय और पुनर्गठन के असर का आकलन"
