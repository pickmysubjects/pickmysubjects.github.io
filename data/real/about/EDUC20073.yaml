code: EDUC20073
year: 2026
learn:
  en: "How health and learning shape each other across life, and how to design and evaluate an intervention for a real issue."
  zh: "健康与学习如何在一生中相互影响，以及如何设计和评估干预方案。"
  zh-TW: "健康與學習如何在一生中相互影響，以及如何設計和評估介入方案。"
  ja: "健康と学びが生涯を通じて互いにどう影響するか、介入策の設計と評価。"
  ko: "건강과 학습이 평생 서로 어떤 영향을 주는지, 그리고 개입 방안 설계와 평가."
  vi: "Sức khỏe và việc học ảnh hưởng lẫn nhau suốt đời ra sao, và cách thiết kế, đánh giá một can thiệp."
  ms: "Cara kesihatan dan pembelajaran saling mempengaruhi sepanjang hayat, dan cara mereka bentuk serta menilai intervensi."
  id: "Cara kesehatan dan belajar saling memengaruhi sepanjang hidup, dan cara merancang serta menilai intervensi."
  hi: "जीवन भर स्वास्थ्य और सीखना एक-दूसरे को कैसे प्रभावित करते हैं, और हस्तक्षेप कैसे बनाएँ व परखें।"
outcomes:
  - en: "Discuss what drives health and learning outcomes"
    zh: "讨论影响健康和学习的因素"
    zh-TW: "討論影響健康和學習的因素"
    ja: "健康と学びを左右する要因を論じる"
    ko: "건강과 학습을 좌우하는 요인 논의하기"
    vi: "Bàn về các yếu tố quyết định sức khỏe và học tập"
    ms: "Membincangkan faktor penentu kesihatan dan pembelajaran"
    id: "Membahas faktor penentu kesehatan dan belajar"
    hi: "स्वास्थ्य और सीखने को प्रभावित करने वाले कारकों पर चर्चा"
  - en: "Compare theories of health literacy"
    zh: "比较不同的健康素养理论"
    zh-TW: "比較不同的健康素養理論"
    ja: "ヘルスリテラシーの理論を比較する"
    ko: "건강 문해력 이론 비교하기"
    vi: "So sánh các lý thuyết về hiểu biết sức khỏe"
    ms: "Membandingkan teori literasi kesihatan"
    id: "Membandingkan teori literasi kesehatan"
    hi: "स्वास्थ्य साक्षरता के सिद्धांतों की तुलना"
  - en: "Critique and evaluate health or learning interventions"
    zh: "评析并评估健康或学习干预方案"
    zh-TW: "評析並評估健康或學習介入方案"
    ja: "健康や学びの介入策を批評し評価する"
    ko: "건강·학습 개입 방안 비평하고 평가하기"
    vi: "Phản biện và đánh giá các can thiệp sức khỏe hoặc học tập"
    ms: "Mengkritik dan menilai intervensi kesihatan atau pembelajaran"
    id: "Mengkritisi dan mengevaluasi intervensi kesehatan atau belajar"
    hi: "स्वास्थ्य या शिक्षा हस्तक्षेपों की समीक्षा और मूल्यांकन"
