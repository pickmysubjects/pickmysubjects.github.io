code: ENGR20005
year: 2026
learn:
  en: "Writing programs that solve engineering maths numerically: roots, linear systems, curve fitting and ODEs."
  zh: "编程数值求解工程数学：求根、线性方程组、曲线拟合和常微分方程。"
  zh-TW: "寫程式數值求解工程數學：求根、線性方程組、曲線擬合和常微分方程。"
  ja: "工学の数学を数値的に解くプログラム：求根、連立一次方程式、曲線当てはめ、常微分方程式。"
  ko: "공학 수학을 수치로 푸는 프로그래밍: 근 찾기, 선형 연립방정식, 곡선 맞춤, 상미분방정식."
  vi: "Viết chương trình giải số toán kỹ thuật: tìm nghiệm, hệ tuyến tính, khớp đường cong và PTVP."
  ms: "Tulis atur cara untuk selesaikan matematik kejuruteraan secara berangka: punca, sistem linear, penyuaian lengkung, PBB."
  id: "Menulis program untuk menyelesaikan matematika teknik secara numerik: akar, sistem linear, fitting kurva, PDB."
  hi: "इंजीनियरिंग गणित को न्यूमेरिकल तरीके से हल करने वाले प्रोग्राम: रूट, लीनियर सिस्टम, कर्व फ़िटिंग, ODE।"
outcomes:
  - en: "Fit data with numerical regression"
    zh: "用数值回归拟合数据"
    zh-TW: "用數值迴歸擬合數據"
    ja: "数値回帰でデータを当てはめる"
    ko: "수치 회귀로 데이터를 맞춘다"
    vi: "Khớp dữ liệu bằng hồi quy số"
    ms: "Suaikan data dengan regresi berangka"
    id: "Mencocokkan data dengan regresi numerik"
    hi: "न्यूमेरिकल रिग्रेशन से डेटा फ़िट करना"
  - en: "Judge a program's numerical cost"
    zh: "判断程序的数值复杂度"
    zh-TW: "判斷程式的數值複雜度"
    ja: "プログラムの計算量を見積もる"
    ko: "프로그램의 계산 복잡도를 판단한다"
    vi: "Đánh giá độ phức tạp tính toán"
    ms: "Nilai kerumitan berangka atur cara"
    id: "Menilai kompleksitas numerik program"
    hi: "प्रोग्राम की न्यूमेरिकल जटिलता आँकना"
