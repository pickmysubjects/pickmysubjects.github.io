code: ARBC30005
year: 2026
learn:
  en: "Arabic poetry, medieval tales and argument pieces, TV and debates, and the debate over classical, standard and spoken Arabic."
  zh: "阅读阿拉伯诗歌、中世纪故事和议论文，看电视、辩论，探讨古典与现代阿拉伯语。"
  zh-TW: "閱讀阿拉伯詩歌、中世紀故事和議論文，看電視、辯論，探討古典與現代阿拉伯語。"
  ja: "アラビア語の詩、中世の物語、論説文、テレビや討論。古典語・標準語・口語をめぐる議論も。"
  ko: "아랍어 시, 중세 이야기, 논설문, TV와 토론. 고전·표준·구어 아랍어 논쟁도 다룬다."
  vi: "Thơ, truyện trung cổ và bài nghị luận tiếng Ả Rập, truyền hình, tranh luận, và chuyện tiếng Ả Rập cổ điển, chuẩn hay khẩu ngữ."
  ms: "Puisi, kisah zaman pertengahan dan tulisan hujah Arab, TV dan debat, serta isu bahasa Arab klasik, standard dan lisan."
  id: "Puisi, kisah abad pertengahan dan tulisan argumentatif Arab, TV dan debat, serta isu bahasa Arab klasik, standar dan lisan."
  hi: "अरबी कविता, मध्यकालीन कहानियाँ और तर्कपूर्ण लेख, टीवी और बहस, और शास्त्रीय, मानक व बोलचाल की अरबी पर चर्चा।"
outcomes:
  - en: "Discuss social and cultural topics in Arabic"
    zh: "用阿拉伯语讨论社会和文化话题"
    zh-TW: "用阿拉伯語討論社會和文化話題"
    ja: "社会や文化の話題をアラビア語で話し合う"
    ko: "사회·문화 주제를 아랍어로 토론하기"
    vi: "Thảo luận chủ đề xã hội, văn hóa bằng tiếng Ả Rập"
    ms: "Bincangkan topik sosial dan budaya dalam bahasa Arab"
    id: "Membahas topik sosial dan budaya dalam bahasa Arab"
    hi: "सामाजिक और सांस्कृतिक विषयों पर अरबी में चर्चा करना"
  - en: "Read and write longer Arabic texts"
    zh: "读写较长的阿拉伯语文章"
    zh-TW: "讀寫較長的阿拉伯語文章"
    ja: "長めのアラビア語の文章を読み書きする"
    ko: "긴 아랍어 글 읽고 쓰기"
    vi: "Đọc và viết văn bản tiếng Ả Rập dài hơn"
    ms: "Baca dan tulis teks bahasa Arab yang lebih panjang"
    id: "Membaca dan menulis teks bahasa Arab yang lebih panjang"
    hi: "लंबे अरबी पाठ पढ़ना-लिखना"
  - en: "Give a clear presentation in Arabic"
    zh: "用阿拉伯语做清楚的口头报告"
    zh-TW: "用阿拉伯語做清楚的口頭報告"
    ja: "アラビア語で分かりやすく発表する"
    ko: "아랍어로 명확하게 발표하기"
    vi: "Thuyết trình rõ ràng bằng tiếng Ả Rập"
    ms: "Buat pembentangan yang jelas dalam bahasa Arab"
    id: "Melakukan presentasi yang jelas dalam bahasa Arab"
    hi: "अरबी में स्पष्ट प्रस्तुति देना"
