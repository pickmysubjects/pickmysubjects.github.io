code: MULT10022
year: 2026
learn:
  en: "One Health: how the health of people, animals and ecosystems connects, through pandemics, food security and drug resistance."
  zh: "「同一健康」：人类、动物与生态系统的健康如何相连，涉及疫情、粮食安全和耐药性。"
  zh-TW: "「同一健康」：人類、動物與生態系統的健康如何相連，涉及疫情、糧食安全和抗藥性。"
  ja: "ワンヘルス。人・動物・生態系の健康のつながりを、パンデミック、食料安全保障、薬剤耐性から学ぶ。"
  ko: "원헬스. 사람·동물·생태계의 건강이 어떻게 연결되는지 팬데믹, 식량 안보, 약제 내성으로 살펴본다."
  vi: "Một sức khỏe (One Health): sức khỏe con người, động vật và hệ sinh thái gắn kết ra sao, qua đại dịch, an ninh lương thực, kháng thuốc."
  ms: "One Health: kaitan kesihatan manusia, haiwan dan ekosistem, melalui pandemik, keselamatan makanan dan rintangan antimikrob."
  id: "One Health: keterkaitan kesehatan manusia, hewan dan ekosistem, lewat pandemi, ketahanan pangan dan resistansi antimikroba."
  hi: "वन हेल्थ: इंसानों, जानवरों और पारिस्थितिक तंत्र का स्वास्थ्य कैसे जुड़ा है, महामारी, खाद्य सुरक्षा और दवा-प्रतिरोध के ज़रिए।"
outcomes:
  - en: "Explain how human, animal and ecosystem health link"
    zh: "解释人类、动物与生态健康之间的联系"
    zh-TW: "解釋人類、動物與生態健康之間的聯繫"
    ja: "人・動物・生態系の健康のつながりを説明する"
    ko: "사람·동물·생태계 건강의 연결 설명하기"
    vi: "Giải thích liên hệ giữa sức khỏe người, động vật, hệ sinh thái"
    ms: "Terangkan kaitan kesihatan manusia, haiwan dan ekosistem"
    id: "Menjelaskan kaitan kesehatan manusia, hewan dan ekosistem"
    hi: "इंसान, जानवर और पारिस्थितिकी के स्वास्थ्य का संबंध समझाना"
  - en: "Identify risk factors for diseases that jump species"
    zh: "找出跨物种传播疾病的风险因素"
    zh-TW: "找出跨物種傳播疾病的風險因素"
    ja: "種を越えて広がる病気のリスク要因を見つける"
    ko: "종을 넘나드는 질병의 위험 요인 찾기"
    vi: "Xác định yếu tố nguy cơ của bệnh lây giữa các loài"
    ms: "Kenal pasti faktor risiko penyakit rentas spesies"
    id: "Mengenali faktor risiko penyakit lintas spesies"
    hi: "प्रजातियों के बीच फैलने वाले रोगों के जोखिम कारक पहचानना"
  - en: "Discuss cultural and political barriers to One Health"
    zh: "讨论推行「同一健康」的文化与政治障碍"
    zh-TW: "討論推行「同一健康」的文化與政治障礙"
    ja: "ワンヘルスを阻む文化的・政治的な壁を論じる"
    ko: "원헬스를 가로막는 문화·정치적 장벽 토론하기"
    vi: "Thảo luận rào cản văn hóa, chính trị với One Health"
    ms: "Bincangkan halangan budaya dan politik kepada One Health"
    id: "Membahas hambatan budaya dan politik bagi One Health"
    hi: "वन हेल्थ के सांस्कृतिक और राजनीतिक अवरोधों पर चर्चा करना"
