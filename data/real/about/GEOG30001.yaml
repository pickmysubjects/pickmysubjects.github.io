code: GEOG30001
year: 2026
learn:
  en: "How beaches, dunes, estuaries and cliffs form and change, and how to manage coasts under pressure."
  zh: "海滩、沙丘、河口和悬崖如何形成变化，以及如何管理受压海岸。"
  zh-TW: "海灘、沙丘、河口與海崖如何形成變化，以及如何管理受壓海岸。"
  ja: "砂浜・砂丘・河口・崖の形成と変化、圧力を受ける海岸の管理。"
  ko: "해변·사구·하구·절벽의 형성과 변화, 압박받는 해안 관리."
  vi: "Bãi biển, cồn cát, cửa sông, vách đá hình thành và đổi ra sao, và quản lý bờ biển chịu áp lực."
  ms: "Cara pantai, bukit pasir, muara dan tebing terbentuk, serta mengurus pantai yang tertekan."
  id: "Cara pantai, bukit pasir, muara, dan tebing terbentuk, serta mengelola pesisir yang tertekan."
  hi: "समुद्र तट, टीले, मुहाने और चट्टानें कैसे बनती-बदलती हैं, और दबाव में तटों का प्रबंधन।"
outcomes:
  - en: "Identify coastal landforms and the processes behind them"
    zh: "识别海岸地貌及其成因过程"
    zh-TW: "辨識海岸地形及其成因過程"
    ja: "海岸地形とその成因を見分ける"
    ko: "해안 지형과 형성 과정 파악하기"
    vi: "Nhận diện địa hình bờ biển và quá trình tạo thành"
    ms: "Kenal pasti bentuk pantai dan prosesnya"
    id: "Mengenali bentang pesisir dan prosesnya"
    hi: "तटीय भू-आकार और उनकी प्रक्रियाएँ पहचानना"
  - en: "Assess tools for predicting coastal change"
    zh: "评估预测海岸变化的工具"
    zh-TW: "評估預測海岸變化的工具"
    ja: "海岸変化の予測ツールを評価する"
    ko: "해안 변화 예측 도구 평가하기"
    vi: "Đánh giá công cụ dự báo thay đổi bờ biển"
    ms: "Nilai alat ramalan perubahan pantai"
    id: "Menilai alat prediksi perubahan pesisir"
    hi: "तटीय बदलाव के पूर्वानुमान उपकरण परखना"
