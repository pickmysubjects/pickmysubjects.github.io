code: MUSI20214
year: 2026
learn:
  en: "Audition-only chamber choir working on tuning, breath, diction and legato, and on singing with conductors and players."
  zh: "需试音的室内合唱团：音准、气息、咬字与连音，并与指挥和乐手合作。"
  zh-TW: "需試音的室內合唱團：音準、氣息、咬字與連音，並與指揮和樂手合作。"
  ja: "オーディション制の室内合唱団。音程、呼吸、発音、レガート、指揮者や奏者との共演。"
  ko: "오디션제 실내 합창단. 음정, 호흡, 발음, 레가토, 지휘자·연주자와 협연."
  vi: "Hợp xướng thính phòng qua thử giọng: cao độ, hơi, phát âm, legato, hát cùng chỉ huy và nhạc công."
  ms: "Koir kamar melalui uji bakat: nada, nafas, sebutan, legato, bersama konduktor dan pemuzik."
  id: "Paduan suara kamar lewat audisi: intonasi, napas, diksi, legato, bersama dirigen dan pemain."
  hi: "ऑडिशन वाला चैंबर कॉयर: सुर, साँस, उच्चारण, लेगाटो, कंडक्टर और वादकों के साथ।"
outcomes:
  - en: "Learn choral parts and sing them securely"
    zh: "学会合唱声部并唱得稳"
    zh-TW: "學會合唱聲部並唱得穩"
    ja: "合唱パートを覚えて確実に歌う"
    ko: "합창 파트를 익혀 안정적으로 부르기"
    vi: "Học bè hợp xướng và hát vững vàng"
    ms: "Pelajari bahagian koir dan nyanyikan dengan yakin"
    id: "Mempelajari suara paduan dan menyanyikannya dengan mantap"
    hi: "कोरल पार्ट सीखकर भरोसे से गाना"
  - en: "Work on tuning, breath and diction as a group"
    zh: "集体练习音准、气息与咬字"
    zh-TW: "集體練習音準、氣息與咬字"
    ja: "音程・呼吸・発音をみんなで整える"
    ko: "음정, 호흡, 발음을 함께 다듬기"
    vi: "Luyện cao độ, hơi thở và phát âm cùng nhóm"
    ms: "Latih nada, pernafasan dan sebutan bersama"
    id: "Melatih intonasi, napas, dan diksi bersama"
    hi: "सुर, साँस और उच्चारण पर समूह में काम करना"
  - en: "Sing in public performances under a conductor"
    zh: "在指挥带领下参加公开演出"
    zh-TW: "在指揮帶領下參加公開演出"
    ja: "指揮者のもとで公演に出る"
    ko: "지휘자와 함께 공개 공연하기"
    vi: "Hát trong buổi diễn công khai dưới tay chỉ huy"
    ms: "Menyanyi dalam persembahan awam di bawah konduktor"
    id: "Bernyanyi di pertunjukan publik bersama dirigen"
    hi: "कंडक्टर के साथ सार्वजनिक प्रस्तुति में गाना"
