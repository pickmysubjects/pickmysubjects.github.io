code: BINF90001
year: 2027
learn:
  en: "Stochastic models and classical statistics applied to bioinformatics, including evolution models."
  zh: "生物信息学中的随机过程与经典统计方法，包括进化模型。"
  zh-TW: "生物資訊學中的隨機過程與古典統計方法，包括演化模型。"
  ja: "バイオインフォにおける確率過程と古典統計。進化モデルも扱う。"
  ko: "생물정보학의 확률과정과 고전 통계 기법, 진화 모델 포함."
  vi: "Quá trình ngẫu nhiên và thống kê cổ điển trong tin sinh học, gồm mô hình tiến hóa."
  ms: "Proses stokastik dan statistik klasik dalam bioinformatik, termasuk model evolusi."
  id: "Proses stokastik dan statistik klasik dalam bioinformatika, termasuk model evolusi."
  hi: "बायोइन्फ़ॉर्मेटिक्स में स्टोकेस्टिक मॉडल और पारंपरिक सांख्यिकी, विकास मॉडल सहित।"
outcomes:
  - en: "Understand common stochastic models in bioinformatics"
    zh: "理解生物信息学中常见的随机模型"
    zh-TW: "理解生物資訊學中常見的隨機模型"
    ja: "代表的な確率モデルを理解する"
    ko: "생물정보학의 주요 확률 모델 이해하기"
    vi: "Hiểu các mô hình ngẫu nhiên phổ biến"
    ms: "Memahami model stokastik biasa"
    id: "Memahami model stokastik umum"
    hi: "आम स्टोकेस्टिक मॉडल समझना"
  - en: "Apply testing, estimation and multivariate methods to data"
    zh: "对数据运用估计、检验和多元方法"
    zh-TW: "對資料運用估計、檢定與多變量方法"
    ja: "推定・検定・多変量手法をデータに使う"
    ko: "추정·검정·다변량 기법 적용하기"
    vi: "Áp dụng ước lượng, kiểm định và phân tích đa biến"
    ms: "Menggunakan anggaran, ujian dan kaedah multivariat"
    id: "Menerapkan estimasi, uji, dan metode multivariat"
    hi: "आकलन, परीक्षण और बहुचर विधियाँ लागू करना"
