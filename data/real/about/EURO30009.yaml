code: EURO30009
year: 2026
learn:
  en: "LGBTIQA+ life and culture in Europe: queer history, current debates, and how writers, filmmakers and artists pushed back."
  zh: "欧洲的 LGBTIQA+ 生活与文化：酷儿历史、当下议题，以及作家、导演和艺术家如何发声抗争。"
  zh-TW: "歐洲的 LGBTIQA+ 生活與文化：酷兒歷史、當下議題，以及作家、導演和藝術家如何發聲抗爭。"
  ja: "ヨーロッパのLGBTIQA+の暮らしと文化。クィアの歴史、現代の論争、作家・映画監督・芸術家の抵抗。"
  ko: "유럽의 LGBTIQA+ 삶과 문화. 퀴어 역사, 현재의 논쟁, 작가·감독·예술가들의 저항."
  vi: "Đời sống và văn hóa LGBTIQA+ ở châu Âu: lịch sử queer, tranh luận hiện nay, và cách nhà văn, nhà làm phim, nghệ sĩ lên tiếng."
  ms: "Kehidupan dan budaya LGBTIQA+ di Eropah: sejarah queer, perdebatan semasa, dan cara penulis, pembikin filem serta artis melawan."
  id: "Kehidupan dan budaya LGBTIQA+ di Eropa: sejarah queer, debat terkini, dan cara penulis, sineas dan seniman melawan."
  hi: "यूरोप में LGBTIQA+ जीवन और संस्कृति: क्वीयर इतिहास, आज की बहसें, और लेखकों, फ़िल्मकारों व कलाकारों का प्रतिरोध।"
