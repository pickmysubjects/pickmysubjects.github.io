code: CHEM10008
year: 2026
learn:
  en: "Basic chemistry from scratch: atoms, bonding, moles, acids and bases, energy, rates, equilibrium and redox."
  zh: "零基础化学：原子、化学键、摩尔、酸碱、能量、反应速率、平衡与氧化还原。"
  zh-TW: "零基礎化學：原子、化學鍵、莫耳、酸鹼、能量、反應速率、平衡與氧化還原。"
  ja: "初学者向けの化学：原子、結合、モル、酸塩基、エネルギー、反応速度、平衡、酸化還元。"
  ko: "기초 화학: 원자, 결합, 몰, 산과 염기, 에너지, 반응 속도, 평형, 산화환원."
  vi: "Hóa học nhập môn: nguyên tử, liên kết, mol, axit-bazơ, năng lượng, tốc độ phản ứng, cân bằng, oxi hóa khử."
  ms: "Kimia asas dari mula: atom, ikatan, mol, asid dan bes, tenaga, kadar tindak balas, keseimbangan, redoks."
  id: "Kimia dasar dari nol: atom, ikatan, mol, asam basa, energi, laju reaksi, kesetimbangan, redoks."
  hi: "शुरुआत से बुनियादी रसायन: परमाणु, बंधन, मोल, अम्ल-क्षार, ऊर्जा, अभिक्रिया दर, साम्य और रेडॉक्स।"
outcomes:
  - en: "Use the mole concept and stoichiometry"
    zh: "运用摩尔概念与化学计量"
    zh-TW: "運用莫耳概念與化學計量"
    ja: "モルの概念と化学量論を使う"
    ko: "몰 개념과 화학량론을 활용한다"
    vi: "Vận dụng khái niệm mol và hóa học lượng"
    ms: "Gunakan konsep mol dan stoikiometri"
    id: "Menggunakan konsep mol dan stoikiometri"
    hi: "मोल अवधारणा और स्टॉइकियोमेट्री का उपयोग करें"
  - en: "Explain acids, bases, pH and redox reactions"
    zh: "解释酸碱、pH与氧化还原反应"
    zh-TW: "解釋酸鹼、pH與氧化還原反應"
    ja: "酸塩基、pH、酸化還元反応を説明する"
    ko: "산·염기, pH, 산화환원 반응을 설명한다"
    vi: "Giải thích axit, bazơ, pH và phản ứng oxi hóa khử"
    ms: "Terangkan asid, bes, pH dan tindak balas redoks"
    id: "Menjelaskan asam, basa, pH dan reaksi redoks"
    hi: "अम्ल, क्षार, pH और रेडॉक्स अभिक्रियाएँ समझाएँ"
  - en: "Describe reaction rates and equilibrium"
    zh: "描述反应速率与化学平衡"
    zh-TW: "描述反應速率與化學平衡"
    ja: "反応速度と化学平衡を説明する"
    ko: "반응 속도와 화학 평형을 설명한다"
    vi: "Mô tả tốc độ phản ứng và cân bằng hóa học"
    ms: "Huraikan kadar tindak balas dan keseimbangan"
    id: "Menjelaskan laju reaksi dan kesetimbangan"
    hi: "अभिक्रिया दर और रासायनिक साम्य का वर्णन करें"
