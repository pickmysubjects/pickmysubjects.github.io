code: PHYC30016
year: 2026
learn:
  en: "Electromagnetic fields and waves from Maxwell's equations, with uses in communications, plasmas and optics."
  zh: "从麦克斯韦方程出发的电磁场与电磁波及其应用。"
  zh-TW: "從馬克士威方程出發的電磁場與電磁波及其應用。"
  ja: "マクスウェル方程式から電磁場・電磁波と、通信やプラズマへの応用。"
  ko: "맥스웰 방정식에서 출발한 전자기장·전자기파와 통신, 플라스마, 광학 응용."
  vi: "Trường và sóng điện từ từ phương trình Maxwell, ứng dụng trong viễn thông, plasma, quang học."
  ms: "Medan dan gelombang elektromagnet dari persamaan Maxwell, untuk komunikasi, plasma dan optik."
  id: "Medan dan gelombang elektromagnetik dari persamaan Maxwell, untuk komunikasi, plasma, dan optik."
  hi: "मैक्सवेल समीकरणों से इलेक्ट्रोमैग्नेटिक फ़ील्ड और वेव, कम्युनिकेशन, प्लाज़्मा और ऑप्टिक्स में उपयोग।"
outcomes:
  - en: "Calculate fields and charged-particle motion"
    zh: "计算电磁场和带电粒子运动"
    zh-TW: "計算電磁場和帶電粒子運動"
    ja: "電磁場と荷電粒子の運動を計算する"
    ko: "전자기장과 하전 입자 운동 계산하기"
    vi: "Tính trường và chuyển động hạt mang điện"
    ms: "Mengira medan dan gerakan zarah bercas"
    id: "Menghitung medan dan gerak partikel bermuatan"
    hi: "फ़ील्ड और चार्ज्ड कणों की गति निकालना"
  - en: "Explain electrodynamics in covariant form"
    zh: "用协变形式解释电动力学"
    zh-TW: "用協變形式解釋電動力學"
    ja: "共変形式で電磁力学を説明する"
    ko: "공변 형식으로 전기역학 설명하기"
    vi: "Giải thích điện động lực học dạng hiệp biến"
    ms: "Menerangkan elektrodinamik dalam bentuk kovarian"
    id: "Menjelaskan elektrodinamika dalam bentuk kovarian"
    hi: "कोवेरिएंट रूप में इलेक्ट्रोडायनामिक्स समझाना"
