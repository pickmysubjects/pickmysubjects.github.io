code: COMP30024
year: 2026
learn:
  en: "Making computer programs that act intelligently, using search, reasoning and learning."
  zh: "让程序表现得聪明：搜索、推理和机器学习。"
  zh-TW: "讓程式表現得聰明：搜尋、推理和機器學習。"
  ja: "探索・推論・学習を使って、賢く振る舞うプログラムを作る。"
  ko: "탐색, 추론, 학습을 이용해 지능적으로 행동하는 프로그램 만들기."
  vi: "Viết chương trình hành xử thông minh bằng tìm kiếm, suy luận và học máy."
  ms: "Bina program komputer yang bertindak pintar menggunakan carian, penaakulan dan pembelajaran."
  id: "Membuat program yang bertindak cerdas dengan pencarian, penalaran, dan pembelajaran."
  hi: "सर्च, रीज़निंग और लर्निंग से समझदारी से काम करने वाले प्रोग्राम बनाना।"
outcomes:
  - en: "Solve problems with search algorithms"
    zh: "用搜索算法解决问题"
    zh-TW: "用搜尋演算法解決問題"
    ja: "探索アルゴリズムで問題を解く"
    ko: "탐색 알고리즘으로 문제 해결"
    vi: "Giải bài toán bằng thuật toán tìm kiếm"
    ms: "Selesaikan masalah dengan algoritma carian"
    id: "Menyelesaikan masalah dengan algoritma pencarian"
    hi: "सर्च एल्गोरिद्म से समस्याएँ हल करना"
  - en: "Design agents that make their own decisions"
    zh: "设计能自己做决定的智能体"
    zh-TW: "設計能自己做決定的智慧代理"
    ja: "自分で判断するエージェントを設計する"
    ko: "스스로 결정하는 에이전트 설계"
    vi: "Thiết kế agent tự đưa ra quyết định"
    ms: "Reka ejen yang membuat keputusan sendiri"
    id: "Merancang agen yang mengambil keputusan sendiri"
    hi: "खुद फ़ैसले लेने वाले एजेंट डिज़ाइन करना"
  - en: "Build systems that improve by learning"
    zh: "做能通过学习变好的系统"
    zh-TW: "做能透過學習變好的系統"
    ja: "学習によって改善するシステムを作る"
    ko: "학습으로 개선되는 시스템 구축"
    vi: "Xây hệ thống tự cải thiện nhờ học"
    ms: "Bina sistem yang bertambah baik melalui pembelajaran"
    id: "Membangun sistem yang membaik lewat belajar"
    hi: "सीखकर बेहतर होने वाले सिस्टम बनाना"
