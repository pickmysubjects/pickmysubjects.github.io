code: FNCE30003
year: 2026
learn:
  en: "Finance for multinational firms: foreign exchange markets, currency risk, political risk and global investment."
  zh: "跨国企业金融：外汇市场、汇率风险、政治风险和全球投资。"
  zh-TW: "跨國企業財務：外匯市場、匯率風險、政治風險和全球投資。"
  ja: "多国籍企業のファイナンス：外国為替市場、為替リスク、政治リスク、国際投資。"
  ko: "다국적 기업 재무: 외환시장, 환위험, 정치적 위험, 글로벌 투자."
  vi: "Tài chính cho công ty đa quốc gia: thị trường ngoại hối, rủi ro tỷ giá, rủi ro chính trị và đầu tư toàn cầu."
  ms: "Kewangan untuk firma multinasional: pasaran tukaran asing, risiko mata wang, risiko politik dan pelaburan global."
  id: "Keuangan perusahaan multinasional: pasar valas, risiko kurs, risiko politik, dan investasi global."
  hi: "बहुराष्ट्रीय कंपनियों का वित्त: विदेशी मुद्रा बाज़ार, करेंसी जोखिम, राजनीतिक जोखिम और वैश्विक निवेश।"
