code: GEOM90005
year: 2027
learn:
  en: "Pulling useful information out of satellite and aerial images for environmental and resource work."
  zh: "从卫星和航空影像中提取有用信息，用于环境和资源工作。"
  zh-TW: "從衛星與航空影像中擷取有用資訊，用於環境與資源工作。"
  ja: "衛星・航空画像から環境や資源の仕事に役立つ情報を取り出す。"
  ko: "위성·항공 영상에서 환경·자원 업무에 쓸 정보를 뽑아냅니다."
  vi: "Trích xuất thông tin hữu ích từ ảnh vệ tinh và ảnh hàng không cho công việc môi trường, tài nguyên."
  ms: "Mengeluarkan maklumat berguna daripada imej satelit dan udara untuk kerja alam sekitar dan sumber."
  id: "Menggali informasi berguna dari citra satelit dan udara untuk pekerjaan lingkungan dan sumber daya."
  hi: "पर्यावरण और संसाधन कार्य के लिए उपग्रह व हवाई चित्रों से उपयोगी जानकारी निकालना।"
outcomes:
  - en: "Describe how remote sensing data is collected"
    zh: "描述遥感数据如何获取"
    zh-TW: "描述遙測資料如何取得"
    ja: "リモートセンシングデータの取得方法を説明する"
    ko: "원격탐사 자료의 획득 방법 설명하기"
    vi: "Mô tả cách thu thập dữ liệu viễn thám"
    ms: "Menerangkan cara data penderiaan jauh dikumpul"
    id: "Menjelaskan cara data penginderaan jauh dikumpulkan"
    hi: "रिमोट सेंसिंग डेटा कैसे जुटाया जाता है, बताना"
  - en: "Correct and classify images for a client's needs"
    zh: "按客户需求对影像进行校正和分类"
    zh-TW: "依客戶需求對影像進行校正與分類"
    ja: "顧客のニーズに合わせて画像を補正・分類する"
    ko: "고객 요구에 맞게 영상 보정 및 분류하기"
    vi: "Hiệu chỉnh và phân loại ảnh theo nhu cầu khách hàng"
    ms: "Membetulkan dan mengelaskan imej mengikut keperluan pelanggan"
    id: "Mengoreksi dan mengklasifikasi citra sesuai kebutuhan klien"
    hi: "ग्राहक की ज़रूरत के अनुसार चित्रों को सुधारना और वर्गीकृत करना"
  - en: "Explain the results to a client"
    zh: "向客户解释分析结果"
    zh-TW: "向客戶說明分析結果"
    ja: "分析結果を顧客に説明する"
    ko: "분석 결과를 고객에게 설명하기"
    vi: "Giải thích kết quả cho khách hàng"
    ms: "Menerangkan hasil kepada pelanggan"
    id: "Menjelaskan hasil kepada klien"
    hi: "ग्राहक को नतीजे समझाना"
