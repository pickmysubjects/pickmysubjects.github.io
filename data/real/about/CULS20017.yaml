code: CULS20017
year: 2026
learn:
  en: "How gender norms form and dominate in today's culture, which genders are privileged, and where people push back."
  zh: "当代文化中的性别规范如何形成并占主导，哪些性别更受优待，人们又在哪些地方反抗。"
  zh-TW: "當代文化中的性別規範如何形成並占主導，哪些性別更受優待，人們又在哪些地方反抗。"
  ja: "現代文化でジェンダー規範がどう作られ支配的になるか、どの性が優遇され、どこで抵抗があるかを学ぶ。"
  ko: "오늘날 문화에서 젠더 규범이 어떻게 만들어지고 지배하는지, 어떤 젠더가 특권을 얻고 어디서 저항하는지 배운다."
  vi: "Chuẩn mực giới hình thành và chi phối văn hóa hôm nay ra sao, giới nào được ưu ái, và con người phản kháng ở đâu."
  ms: "Cara norma gender terbentuk dan menguasai budaya kini, gender mana yang diistimewakan, dan di mana orang menentang."
  id: "Cara norma gender terbentuk dan mendominasi budaya kini, gender mana yang diistimewakan, dan di mana orang melawan."
  hi: "आज की संस्कृति में जेंडर मानदंड कैसे बनते और हावी होते हैं, किसे विशेषाधिकार मिलता है, और लोग कहां विरोध करते हैं।"
outcomes:
  - en: "Explain key ideas in feminist cultural studies"
    zh: "说明女性主义文化研究的核心观念"
    zh-TW: "說明女性主義文化研究的核心觀念"
    ja: "フェミニスト文化研究の主な考えを説明する"
    ko: "페미니즘 문화연구의 핵심 개념 설명하기"
    vi: "Giải thích ý tưởng chính của nghiên cứu văn hóa nữ quyền"
    ms: "Terangkan idea utama kajian budaya feminis"
    id: "Menjelaskan gagasan utama kajian budaya feminis"
    hi: "नारीवादी कल्चरल स्टडीज़ के मुख्य विचार समझाना"
  - en: "Analyse gender norms in media and daily life"
    zh: "分析媒体和日常生活中的性别规范"
    zh-TW: "分析媒體和日常生活中的性別規範"
    ja: "メディアと日常のジェンダー規範を分析する"
    ko: "미디어와 일상의 젠더 규범 분석하기"
    vi: "Phân tích chuẩn mực giới trong truyền thông và đời sống"
    ms: "Analisis norma gender dalam media dan kehidupan harian"
    id: "Menganalisis norma gender dalam media dan keseharian"
    hi: "मीडिया और रोज़मर्रा में जेंडर मानदंडों का विश्लेषण करना"
  - en: "Discuss resistance to dominant gender ideas"
    zh: "讨论对主流性别观念的反抗"
    zh-TW: "討論對主流性別觀念的反抗"
    ja: "支配的なジェンダー観への抵抗を論じる"
    ko: "지배적 젠더 관념에 대한 저항 논의하기"
    vi: "Thảo luận sự phản kháng trước quan niệm giới chủ đạo"
    ms: "Bincangkan penentangan terhadap idea gender dominan"
    id: "Membahas perlawanan terhadap gagasan gender dominan"
    hi: "प्रभावी जेंडर विचारों के विरोध पर चर्चा करना"
