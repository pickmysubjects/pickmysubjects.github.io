code: ECON30016
year: 2026
learn:
  en: "Why taxes exist, how tax systems like Australia's work, and what different taxes do to the economy."
  zh: "税为什么存在、澳洲等税制如何运作，以及各种税的经济影响。"
  zh-TW: "稅為什麼存在、澳洲等稅制如何運作，以及各種稅的經濟影響。"
  ja: "税はなぜあるのか、豪州などの税制の仕組み、各種の税が経済に与える影響。"
  ko: "세금이 왜 있는지, 호주 등 세제의 작동 방식, 각 세금이 경제에 미치는 영향."
  vi: "Vì sao có thuế, hệ thống thuế như của Úc vận hành ra sao, và các loại thuế tác động gì đến nền kinh tế."
  ms: "Mengapa cukai wujud, cara sistem cukai seperti di Australia berfungsi, dan kesan pelbagai cukai kepada ekonomi."
  id: "Mengapa pajak ada, cara kerja sistem pajak seperti di Australia, dan dampak berbagai pajak bagi ekonomi."
  hi: "टैक्स क्यों होते हैं, ऑस्ट्रेलिया जैसे टैक्स सिस्टम कैसे चलते हैं, और अलग टैक्स अर्थव्यवस्था पर क्या असर डालते हैं।"
outcomes:
  - en: "Explain the effects of different tax bases"
    zh: "解释不同税基的影响"
    zh-TW: "解釋不同稅基的影響"
    ja: "課税ベースの違いによる影響を説明する"
    ko: "과세 기반별 효과 설명하기"
    vi: "Giải thích tác động của các cơ sở thuế khác nhau"
    ms: "Terangkan kesan asas cukai yang berbeza"
    id: "Menjelaskan dampak basis pajak yang berbeda"
    hi: "अलग-अलग टैक्स बेस के असर समझाना"
  - en: "Evaluate tax reform proposals"
    zh: "评估税制改革方案"
    zh-TW: "評估稅制改革方案"
    ja: "税制改革案を評価する"
    ko: "세제 개혁안 평가하기"
    vi: "Đánh giá các đề xuất cải cách thuế"
    ms: "Nilai cadangan pembaharuan cukai"
    id: "Menilai usulan reformasi pajak"
    hi: "टैक्स सुधार प्रस्तावों का आकलन करना"
  - en: "Analyse how taxes change work, saving and investment"
    zh: "分析税收如何影响工作、储蓄和投资"
    zh-TW: "分析稅收如何影響工作、儲蓄和投資"
    ja: "税が労働・貯蓄・投資をどう変えるか分析する"
    ko: "세금이 근로·저축·투자에 미치는 영향 분석하기"
    vi: "Phân tích thuế thay đổi việc làm, tiết kiệm và đầu tư ra sao"
    ms: "Analisis kesan cukai terhadap kerja, simpanan dan pelaburan"
    id: "Menganalisis pengaruh pajak pada kerja, tabungan dan investasi"
    hi: "विश्लेषण करना कि टैक्स काम, बचत और निवेश को कैसे बदलते हैं"
