code: ECOM90013
year: 2027
learn:
  en: "Estimation theory for single equations and systems: maximum likelihood, GLS, instrumental variables, GMM and VARs."
  zh: "单方程与方程组的估计理论：极大似然、GLS、工具变量、GMM 与 VAR。"
  zh-TW: "單方程與聯立方程的估計理論：最大概似、GLS、工具變數、GMM 與 VAR。"
  ja: "単一方程式と連立方程式の推定理論：最尤法、GLS、操作変数、GMM、VAR。"
  ko: "단일·연립 방정식 추정 이론: 최우추정, GLS, 도구변수, GMM, VAR."
  vi: "Lý thuyết ước lượng cho một phương trình và hệ phương trình: hợp lý cực đại, GLS, biến công cụ, GMM, VAR."
  ms: "Teori anggaran persamaan tunggal dan sistem: kebolehjadian maksimum, GLS, pemboleh ubah instrumen, GMM dan VAR."
  id: "Teori estimasi persamaan tunggal dan sistem: kemungkinan maksimum, GLS, variabel instrumen, GMM, dan VAR."
  hi: "एकल समीकरण व समीकरण प्रणालियों का अनुमान सिद्धांत: मैक्सिमम लाइकलीहुड, GLS, इंस्ट्रुमेंटल वेरिएबल, GMM, VAR।"
outcomes:
  - en: "Match estimation methods to the data"
    zh: "根据数据选择估计方法"
    zh-TW: "依資料選擇估計方法"
    ja: "データに合う推定法を選ぶ"
    ko: "데이터에 맞는 추정 방법 고르기"
    vi: "Chọn phương pháp ước lượng hợp với dữ liệu"
    ms: "Memadankan kaedah anggaran dengan data"
    id: "Mencocokkan metode estimasi dengan data"
    hi: "डेटा के अनुसार अनुमान विधि चुनना"
  - en: "Explain the theory behind inference"
    zh: "解释推断背后的理论"
    zh-TW: "解釋推論背後的理論"
    ja: "推測の理論を説明する"
    ko: "추론의 이론 설명하기"
    vi: "Giải thích lý thuyết đằng sau suy luận"
    ms: "Menerangkan teori di sebalik inferens"
    id: "Menjelaskan teori di balik inferensi"
    hi: "अनुमान के पीछे का सिद्धांत समझाना"
