code: SCIE30001
year: 2026
learn:
  en: "Your own supervised research project in a science discipline, from design to written report and talk."
  zh: "在导师指导下做自己的科研项目，从设计到报告"
  zh-TW: "在指導老師帶領下做自己的研究專題，從設計到報告"
  ja: "指導教員のもとで自分の研究を行い、設計から報告・発表まで進める。"
  ko: "지도교수 아래 개인 연구 프로젝트를 설계부터 보고서·발표까지 진행."
  vi: "Dự án nghiên cứu cá nhân có hướng dẫn trong một ngành khoa học, từ thiết kế đến báo cáo và thuyết trình."
  ms: "Projek penyelidikan sendiri dengan penyelia dalam bidang sains, dari reka bentuk hingga laporan dan pembentangan."
  id: "Proyek riset pribadi dengan pembimbing di bidang sains, dari desain sampai laporan dan presentasi."
  hi: "किसी विज्ञान विषय में निर्देशित अपना शोध प्रोजेक्ट, डिज़ाइन से रिपोर्ट और प्रस्तुति तक।"
outcomes:
  - en: "Design an experiment or model for a research aim"
    zh: "为研究目标设计实验或模型"
    zh-TW: "為研究目標設計實驗或模型"
    ja: "研究目的に合う実験やモデルを設計する"
    ko: "연구 목표에 맞는 실험·모형 설계하기"
    vi: "Thiết kế thí nghiệm hoặc mô hình cho mục tiêu"
    ms: "Mereka bentuk eksperimen atau model untuk matlamat kajian"
    id: "Merancang eksperimen atau model untuk tujuan riset"
    hi: "शोध लक्ष्य हेतु प्रयोग या मॉडल डिज़ाइन करना"
  - en: "Collect and analyse research data"
    zh: "收集并分析研究数据"
    zh-TW: "收集並分析研究資料"
    ja: "研究データを集めて分析する"
    ko: "연구 데이터 수집·분석하기"
    vi: "Thu thập và phân tích dữ liệu nghiên cứu"
    ms: "Mengumpul dan menganalisis data kajian"
    id: "Mengumpulkan dan menganalisis data riset"
    hi: "शोध डेटा एकत्र और विश्लेषण करना"
  - en: "Present results in a report and talk or poster"
    zh: "用报告和演讲或海报呈现结果"
    zh-TW: "用報告和口頭或海報發表成果"
    ja: "結果を報告書と発表・ポスターにまとめる"
    ko: "보고서와 발표·포스터로 결과 제시하기"
    vi: "Trình bày kết quả bằng báo cáo và nói/poster"
    ms: "Membentang hasil dalam laporan dan ceramah/poster"
    id: "Menyajikan hasil lewat laporan dan presentasi/poster"
    hi: "रिपोर्ट और व्याख्यान/पोस्टर में परिणाम प्रस्तुत करना"
