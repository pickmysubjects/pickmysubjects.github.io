code: PSYC10004
year: 2026
learn:
  en: "How people develop and interact with others: development, social, personality and clinical psychology, plus stats."
  zh: "人怎么成长和与人相处：发展、社会、人格、临床心理和统计。"
  zh-TW: "人怎麼成長和與人相處：發展、社會、人格、臨床心理和統計。"
  ja: "人の成長と他者との関わり：発達・社会・パーソナリティ・臨床心理学と統計。"
  ko: "사람의 발달과 대인 관계: 발달·사회·성격·임상심리학과 통계."
  vi: "Con người phát triển và tương tác ra sao: tâm lý phát triển, xã hội, nhân cách, lâm sàng, cùng thống kê."
  ms: "Cara manusia berkembang dan berinteraksi: psikologi perkembangan, sosial, personaliti, klinikal, serta statistik."
  id: "Cara orang berkembang dan berinteraksi: psikologi perkembangan, sosial, kepribadian, klinis, plus statistik."
  hi: "लोग कैसे विकसित होते और दूसरों से जुड़ते हैं: विकास, सामाजिक, व्यक्तित्व, क्लिनिकल साइकोलॉजी और स्टैट्स।"
outcomes:
  - en: "Explain key theories in several areas of psychology"
    zh: "讲清心理学几个领域的主要理论"
    zh-TW: "講清心理學幾個領域的主要理論"
    ja: "心理学のいくつかの分野の主要理論を説明する"
    ko: "심리학 여러 분야의 핵심 이론 설명"
    vi: "Giải thích lý thuyết chính trong vài lĩnh vực tâm lý"
    ms: "Terangkan teori utama dalam beberapa bidang psikologi"
    id: "Menjelaskan teori utama di beberapa bidang psikologi"
    hi: "साइकोलॉजी के कई क्षेत्रों के मुख्य सिद्धांत समझाना"
  - en: "Design a study and analyse its data"
    zh: "设计研究并分析数据"
    zh-TW: "設計研究並分析數據"
    ja: "研究を設計しデータを分析する"
    ko: "연구를 설계하고 데이터 분석"
    vi: "Thiết kế nghiên cứu và phân tích dữ liệu"
    ms: "Reka kajian dan analisis datanya"
    id: "Merancang studi dan menganalisis datanya"
    hi: "स्टडी डिज़ाइन करना और डेटा का विश्लेषण"
  - en: "Write a psychology research report"
    zh: "写心理学研究报告"
    zh-TW: "寫心理學研究報告"
    ja: "心理学の研究レポートを書く"
    ko: "심리학 연구 보고서 작성"
    vi: "Viết báo cáo nghiên cứu tâm lý học"
    ms: "Tulis laporan penyelidikan psikologi"
    id: "Menulis laporan riset psikologi"
    hi: "साइकोलॉजी रिसर्च रिपोर्ट लिखना"
