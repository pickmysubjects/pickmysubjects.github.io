code: MGMT20005
year: 2026
learn:
  en: "Making business decisions with decision trees, simulation and optimisation in spreadsheets."
  zh: "在电子表格中用决策树、模拟和优化做商业决策。"
  zh-TW: "在試算表中用決策樹、模擬和最佳化做商業決策。"
  ja: "スプレッドシートで決定木・シミュレーション・最適化を使い、経営判断をする。"
  ko: "스프레드시트에서 의사결정나무, 시뮬레이션, 최적화로 경영 의사결정."
  vi: "Ra quyết định kinh doanh bằng cây quyết định, mô phỏng và tối ưu hóa trong bảng tính."
  ms: "Buat keputusan perniagaan dengan pepohon keputusan, simulasi dan pengoptimuman dalam hamparan."
  id: "Membuat keputusan bisnis dengan pohon keputusan, simulasi, dan optimasi di spreadsheet."
  hi: "स्प्रेडशीट में डिसीज़न ट्री, सिमुलेशन और ऑप्टिमाइज़ेशन से बिज़नेस फ़ैसले लेना।"
outcomes:
  - en: "Model a business decision with a decision tree"
    zh: "用决策树为商业决策建模"
    zh-TW: "用決策樹為商業決策建模"
    ja: "決定木で経営判断をモデル化する"
    ko: "의사결정나무로 경영 결정 모형화"
    vi: "Lập mô hình quyết định kinh doanh bằng cây quyết định"
    ms: "Modelkan keputusan perniagaan dengan pepohon keputusan"
    id: "Memodelkan keputusan bisnis dengan pohon keputusan"
    hi: "डिसीज़न ट्री से बिज़नेस फ़ैसले का मॉडल बनाना"
  - en: "Solve optimisation problems with Excel Solver"
    zh: "用Excel Solver求解优化问题"
    zh-TW: "用Excel Solver求解最佳化問題"
    ja: "Excelのソルバーで最適化問題を解く"
    ko: "Excel 해 찾기로 최적화 문제 풀기"
    vi: "Giải bài toán tối ưu bằng Excel Solver"
    ms: "Selesaikan masalah pengoptimuman dengan Excel Solver"
    id: "Menyelesaikan masalah optimasi dengan Excel Solver"
    hi: "Excel Solver से ऑप्टिमाइज़ेशन समस्याएँ हल करना"
  - en: "Simulate risk and test how sensitive results are"
    zh: "模拟风险并检验结果的敏感度"
    zh-TW: "模擬風險並檢驗結果的敏感度"
    ja: "リスクをシミュレーションし結果の感度を確かめる"
    ko: "위험을 시뮬레이션하고 결과 민감도 점검"
    vi: "Mô phỏng rủi ro và kiểm tra độ nhạy của kết quả"
    ms: "Simulasi risiko dan uji kepekaan keputusan"
    id: "Menyimulasikan risiko dan menguji sensitivitas hasil"
    hi: "जोखिम का सिमुलेशन और नतीजों की संवेदनशीलता जाँचना"
