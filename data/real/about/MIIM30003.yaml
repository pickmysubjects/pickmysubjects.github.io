code: MIIM30003
year: 2026
learn:
  en: "Immunology in medicine: vaccines, autoimmune disease, organ transplants and immune therapies for cancer."
  zh: "医学中的免疫学：疫苗、自身免疫病、器官移植和癌症免疫疗法。"
  zh-TW: "醫學中的免疫學：疫苗、自體免疫疾病、器官移植和癌症免疫療法。"
  ja: "医療における免疫学：ワクチン、自己免疫疾患、臓器移植、がんの免疫療法。"
  ko: "의학 속 면역학: 백신, 자가면역질환, 장기 이식, 암 면역치료."
  vi: "Miễn dịch học trong y khoa: vắc-xin, bệnh tự miễn, ghép tạng và liệu pháp miễn dịch trị ung thư."
  ms: "Imunologi dalam perubatan: vaksin, penyakit autoimun, pemindahan organ dan terapi imun untuk kanser."
  id: "Imunologi dalam kedokteran: vaksin, penyakit autoimun, transplantasi organ, dan imunoterapi kanker."
  hi: "चिकित्सा में इम्यूनोलॉजी: टीके, ऑटोइम्यून रोग, अंग प्रत्यारोपण और कैंसर की इम्यून थेरेपी।"
outcomes:
  - en: "Explain how vaccines work and why they matter"
    zh: "解释疫苗的原理和作用"
    zh-TW: "解釋疫苗的原理和重要性"
    ja: "ワクチンの仕組みと重要性を説明する"
    ko: "백신의 원리와 중요성 설명하기"
    vi: "Giải thích vắc-xin hoạt động ra sao và vì sao quan trọng"
    ms: "Menerangkan cara vaksin berfungsi dan kepentingannya"
    id: "Menjelaskan cara kerja vaksin dan pentingnya"
    hi: "टीके कैसे काम करते हैं और क्यों ज़रूरी हैं"
  - en: "Describe how immunotherapy treats disease and cancer"
    zh: "描述免疫疗法怎么治病和癌症"
    zh-TW: "描述免疫療法怎麼治療疾病和癌症"
    ja: "免疫療法が病気やがんを治す仕組みを説明する"
    ko: "면역치료가 질병과 암을 치료하는 방식 설명하기"
    vi: "Mô tả liệu pháp miễn dịch chữa bệnh và ung thư ra sao"
    ms: "Menghuraikan cara imunoterapi merawat penyakit dan kanser"
    id: "Menjelaskan cara imunoterapi mengobati penyakit dan kanker"
    hi: "इम्यूनोथेरेपी बीमारी और कैंसर का इलाज कैसे करती है"
  - en: "Link lab research to clinical treatments"
    zh: "把实验室研究和临床治疗联系起来"
    zh-TW: "把實驗室研究和臨床治療連結起來"
    ja: "実験室の研究を臨床治療に結びつける"
    ko: "실험실 연구를 임상 치료와 연결하기"
    vi: "Liên hệ nghiên cứu phòng thí nghiệm với điều trị lâm sàng"
    ms: "Mengaitkan penyelidikan makmal dengan rawatan klinikal"
    id: "Menghubungkan riset lab dengan pengobatan klinis"
    hi: "लैब रिसर्च को क्लिनिकल इलाज से जोड़ना"
