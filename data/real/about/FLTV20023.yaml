code: FLTV20023
year: 2026
learn:
  en: "How a screen production gets from idea to distribution, the producer's roles, and planning shoots that are sustainable."
  zh: "影视作品从构想到发行的过程、制片人的职责，以及规划可持续的拍摄。"
  zh-TW: "影視作品從構想到發行的過程、製片人的職責，以及規劃永續的拍攝。"
  ja: "映像作品が企画から配給に至る流れ、プロデューサーの役割、持続可能な撮影計画。"
  ko: "영상 제작이 기획에서 배급까지 가는 과정, 프로듀서의 역할, 지속 가능한 촬영 계획."
  vi: "Hành trình tác phẩm màn ảnh từ ý tưởng đến phát hành, vai trò nhà sản xuất, lập kế hoạch quay bền vững."
  ms: "Perjalanan produksi skrin dari idea ke edaran, peranan penerbit dan perancangan penggambaran mampan."
  id: "Perjalanan produksi layar dari ide ke distribusi, peran produser dan rencana syuting berkelanjutan."
  hi: "स्क्रीन प्रोडक्शन का आइडिया से वितरण तक सफ़र, प्रोड्यूसर की भूमिकाएँ और टिकाऊ शूट की योजना।"
outcomes:
  - en: "Plan a production team and its roles"
    zh: "规划制作团队及分工"
    zh-TW: "規劃製作團隊及分工"
    ja: "制作チームと役割を計画する"
    ko: "제작 팀과 역할 계획하기"
    vi: "Lập kế hoạch đội sản xuất và vai trò"
    ms: "Rancang pasukan produksi dan peranannya"
    id: "Merencanakan tim produksi dan perannya"
    hi: "प्रोडक्शन टीम और भूमिकाओं की योजना"
  - en: "Write a pitch document for a producer"
    zh: "为制片人写提案文件"
    zh-TW: "為製片人寫提案文件"
    ja: "プロデューサー向け企画書を書く"
    ko: "프로듀서용 피칭 문서 쓰기"
    vi: "Viết hồ sơ đề xuất cho nhà sản xuất"
    ms: "Tulis dokumen pic untuk penerbit"
    id: "Menulis dokumen pitching untuk produser"
    hi: "प्रोड्यूसर के लिए पिच दस्तावेज़ लिखना"
  - en: "Make a production greener and fairer"
    zh: "让制作更环保、更公平"
    zh-TW: "讓製作更環保、更公平"
    ja: "制作を環境にも人にも優しくする"
    ko: "제작을 더 친환경적이고 공정하게 만들기"
    vi: "Làm sản xuất xanh và công bằng hơn"
    ms: "Jadikan produksi lebih hijau dan adil"
    id: "Membuat produksi lebih hijau dan adil"
    hi: "प्रोडक्शन को ज़्यादा हरित और न्यायपूर्ण बनाना"
