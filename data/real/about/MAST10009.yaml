code: MAST10009
year: 2026
learn:
  en: "Rigorous calculus: limits, integrals, infinite series and differential equations, with proofs."
  zh: "严谨的微积分：极限、积分、无穷级数和微分方程，含证明。"
  zh-TW: "嚴謹的微積分：極限、積分、無窮級數和微分方程，含證明。"
  ja: "厳密な微積分：極限、積分、無限級数、微分方程式を証明付きで。"
  ko: "엄밀한 미적분: 극한, 적분, 무한급수, 미분방정식과 증명."
  vi: "Giải tích chặt chẽ: giới hạn, tích phân, chuỗi vô hạn và phương trình vi phân, có chứng minh."
  ms: "Kalkulus rapi: had, kamiran, siri tak terhingga dan persamaan pembezaan, dengan pembuktian."
  id: "Kalkulus yang ketat: limit, integral, deret tak hingga, dan persamaan diferensial, dengan pembuktian."
  hi: "कठोर कैलकुलस: लिमिट, इंटीग्रल, अनंत सीरीज़ और अवकल समीकरण, प्रमाणों के साथ।"
outcomes:
  - en: "Test whether an infinite series converges"
    zh: "判断无穷级数是否收敛"
    zh-TW: "判斷無窮級數是否收斂"
    ja: "無限級数が収束するか判定する"
    ko: "무한급수의 수렴 여부 판정"
    vi: "Xét chuỗi vô hạn có hội tụ không"
    ms: "Uji sama ada siri tak terhingga menumpu"
    id: "Menguji apakah deret tak hingga konvergen"
    hi: "जाँचना कि अनंत सीरीज़ अभिसारी है या नहीं"
  - en: "Write functions as Taylor and Fourier series"
    zh: "把函数展开成泰勒和傅里叶级数"
    zh-TW: "把函數展開成泰勒和傅立葉級數"
    ja: "関数をテイラー級数・フーリエ級数で表す"
    ko: "함수를 테일러·푸리에 급수로 표현"
    vi: "Khai triển hàm thành chuỗi Taylor và Fourier"
    ms: "Tulis fungsi sebagai siri Taylor dan Fourier"
    id: "Menulis fungsi sebagai deret Taylor dan Fourier"
    hi: "फ़ंक्शन को टेलर और फ़ूरिये सीरीज़ में लिखना"
  - en: "Solve differential equations for simple systems"
    zh: "解微分方程描述简单系统"
    zh-TW: "解微分方程描述簡單系統"
    ja: "簡単な系の微分方程式を解く"
    ko: "간단한 시스템의 미분방정식 풀기"
    vi: "Giải phương trình vi phân cho hệ đơn giản"
    ms: "Selesaikan persamaan pembezaan untuk sistem mudah"
    id: "Menyelesaikan persamaan diferensial sistem sederhana"
    hi: "सरल सिस्टम के अवकल समीकरण हल करना"
