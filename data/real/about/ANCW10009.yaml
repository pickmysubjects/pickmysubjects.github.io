code: ANCW10009
year: 2026
learn:
  en: "The second Akkadian course: more grammar, vocabulary and cuneiform, reading a wider range of ancient texts."
  zh: "阿卡德语第二阶段：更多语法、词汇和楔形文字，阅读更多类型的古代文本。"
  zh-TW: "阿卡德語第二階段：更多語法、詞彙和楔形文字，閱讀更多類型的古代文本。"
  ja: "アッカド語の第2段階。文法・語彙・楔形文字を広げ、より多様な古代の文章を読む。"
  ko: "아카드어 2단계: 더 많은 문법, 어휘, 쐐기문자를 익히고 다양한 고대 글을 읽는다."
  vi: "Khóa tiếng Akkad thứ hai: thêm ngữ pháp, từ vựng, chữ hình nêm và đọc nhiều loại văn bản cổ hơn."
  ms: "Kursus kedua Akkadia: lebih banyak tatabahasa, kosa kata dan tulisan paku, membaca pelbagai teks kuno."
  id: "Kursus kedua Akkadia: lebih banyak tata bahasa, kosakata, dan aksara paku, membaca ragam teks kuno lebih luas."
  hi: "अक्कादी का दूसरा कोर्स: अधिक व्याकरण, शब्दावली और कीलाक्षर, विविध प्राचीन पाठ पढ़ना।"
outcomes:
  - en: "Extend Akkadian grammar and vocabulary"
    zh: "扩展阿卡德语语法和词汇"
    zh-TW: "擴展阿卡德語語法和詞彙"
    ja: "アッカド語の文法と語彙を広げる"
    ko: "아카드어 문법과 어휘 넓히기"
    vi: "Mở rộng ngữ pháp và từ vựng tiếng Akkad"
    ms: "Luaskan tatabahasa dan kosa kata Akkadia"
    id: "Memperluas tata bahasa dan kosakata Akkadia"
    hi: "अक्कादी व्याकरण और शब्दावली बढ़ाना"
  - en: "Read more cuneiform signs with confidence"
    zh: "更熟练地读楔形文字"
    zh-TW: "更熟練地讀楔形文字"
    ja: "より多くの楔形文字を読めるようにする"
    ko: "더 많은 쐐기문자 자신 있게 읽기"
    vi: "Đọc thêm nhiều ký hiệu hình nêm một cách tự tin"
    ms: "Baca lebih banyak simbol tulisan paku dengan yakin"
    id: "Membaca lebih banyak tanda aksara paku dengan yakin"
    hi: "अधिक कीलाक्षर चिह्न आत्मविश्वास से पढ़ना"
  - en: "Translate a range of ancient text types"
    zh: "翻译多种类型的古代文本"
    zh-TW: "翻譯多種類型的古代文本"
    ja: "さまざまな種類の古代文書を訳す"
    ko: "여러 종류의 고대 글 번역하기"
    vi: "Dịch nhiều loại văn bản cổ"
    ms: "Terjemah pelbagai jenis teks kuno"
    id: "Menerjemahkan beragam jenis teks kuno"
    hi: "कई तरह के प्राचीन पाठों का अनुवाद करना"
