code: ASIA20001
year: 2026
learn:
  en: "Film, music, fashion and city life in East and Southeast Asia, and how media and cities have shaped politics and identity."
  zh: "东亚和东南亚的电影、音乐、时尚与城市生活，以及媒体和城市如何塑造政治与身份认同。"
  zh-TW: "東亞和東南亞的電影、音樂、時尚與城市生活，以及媒體和城市如何塑造政治與身分認同。"
  ja: "東アジア・東南アジアの映画、音楽、ファッション、都市生活。メディアと都市が政治やアイデンティティをどう形作ったか。"
  ko: "동아시아·동남아시아의 영화, 음악, 패션, 도시 생활. 미디어와 도시가 정치와 정체성을 어떻게 만들었는가."
  vi: "Phim, nhạc, thời trang và đời sống đô thị ở Đông Á, Đông Nam Á, và truyền thông, đô thị định hình chính trị, bản sắc ra sao."
  ms: "Filem, muzik, fesyen dan kehidupan bandar di Asia Timur dan Tenggara, serta cara media dan bandar membentuk politik dan identiti."
  id: "Film, musik, mode dan kehidupan kota di Asia Timur dan Tenggara, serta cara media dan kota membentuk politik dan identitas."
  hi: "पूर्वी व दक्षिण-पूर्वी एशिया में फ़िल्म, संगीत, फ़ैशन और शहरी जीवन, और मीडिया व शहरों ने राजनीति और पहचान को कैसे गढ़ा।"
outcomes:
  - en: "Analyse Asian films, music and fashion trends"
    zh: "分析亚洲的电影、音乐和时尚潮流"
    zh-TW: "分析亞洲的電影、音樂和時尚潮流"
    ja: "アジアの映画、音楽、ファッションの流行を分析する"
    ko: "아시아의 영화, 음악, 패션 흐름 분석하기"
    vi: "Phân tích xu hướng phim, nhạc, thời trang châu Á"
    ms: "Analisis trend filem, muzik dan fesyen Asia"
    id: "Menganalisis tren film, musik dan mode Asia"
    hi: "एशियाई फ़िल्म, संगीत और फ़ैशन रुझानों का विश्लेषण करना"
  - en: "Link urban life to social and political change"
    zh: "把城市生活与社会政治变迁联系起来"
    zh-TW: "把城市生活與社會政治變遷聯繫起來"
    ja: "都市生活を社会・政治の変化と結びつける"
    ko: "도시 생활을 사회·정치 변화와 연결하기"
    vi: "Liên hệ đời sống đô thị với biến đổi xã hội, chính trị"
    ms: "Kaitkan kehidupan bandar dengan perubahan sosial dan politik"
    id: "Mengaitkan kehidupan kota dengan perubahan sosial politik"
    hi: "शहरी जीवन को सामाजिक-राजनीतिक बदलाव से जोड़ना"
  - en: "Discuss identity and creativity in modern Asia"
    zh: "讨论现代亚洲的身份认同与创意"
    zh-TW: "討論現代亞洲的身分認同與創意"
    ja: "現代アジアのアイデンティティと創造性を論じる"
    ko: "현대 아시아의 정체성과 창의성 토론하기"
    vi: "Thảo luận bản sắc và sáng tạo ở châu Á hiện đại"
    ms: "Bincangkan identiti dan kreativiti di Asia moden"
    id: "Membahas identitas dan kreativitas di Asia modern"
    hi: "आधुनिक एशिया में पहचान और रचनात्मकता पर चर्चा करना"
