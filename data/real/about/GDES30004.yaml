code: GDES30004
year: 2026
learn:
  en: "Show design ideas by hand: scale models, perspective drawing and painting, ready to take into digital work."
  zh: "用手工表达设计构想：比例模型、透视图与绘画，并可转入数字化处理。"
  zh-TW: "用手工表達設計構想：比例模型、透視圖與繪畫，並可轉入數位處理。"
  ja: "手作業で設計を表現：縮尺模型、透視図、彩色。デジタル作業にもつなげる。"
  ko: "손으로 설계 아이디어 표현하기: 축척 모형, 투시도, 채색, 디지털 작업으로 연결."
  vi: "Thể hiện ý tưởng bằng tay: mô hình tỷ lệ, vẽ phối cảnh, tô màu, rồi đưa sang số hóa."
  ms: "Tunjuk idea reka bentuk dengan tangan: model skala, lukisan perspektif, cat, lalu ke digital."
  id: "Menyajikan ide desain dengan tangan: maket skala, gambar perspektif, lukis, lalu ke digital."
  hi: "हाथ से डिज़ाइन विचार दिखाना: स्केल मॉडल, पर्सपेक्टिव ड्रॉइंग, पेंटिंग, फिर डिजिटल में।"
outcomes:
  - en: "Make scale models and perspective drawings"
    zh: "制作比例模型与透视图"
    zh-TW: "製作比例模型與透視圖"
    ja: "縮尺模型と透視図をつくる"
    ko: "축척 모형과 투시도 만들기"
    vi: "Làm mô hình tỷ lệ và bản vẽ phối cảnh"
    ms: "Hasilkan model skala dan lukisan perspektif"
    id: "Membuat maket skala dan gambar perspektif"
    hi: "स्केल मॉडल और पर्सपेक्टिव ड्रॉइंग बनाना"
  - en: "Combine hand work with digital editing"
    zh: "把手工作品与数字处理结合"
    zh-TW: "把手工作品與數位處理結合"
    ja: "手作業とデジタル加工を組み合わせる"
    ko: "수작업과 디지털 편집 결합하기"
    vi: "Kết hợp làm tay với chỉnh sửa số"
    ms: "Gabungkan kerja tangan dengan suntingan digital"
    id: "Menggabungkan karya tangan dengan edit digital"
    hi: "हाथ के काम को डिजिटल एडिटिंग से जोड़ना"
  - en: "Start a portfolio of design visuals"
    zh: "开始建立设计图像作品集"
    zh-TW: "開始建立設計圖像作品集"
    ja: "設計ビジュアルのポートフォリオを始める"
    ko: "디자인 비주얼 포트폴리오 시작하기"
    vi: "Bắt đầu hồ sơ hình ảnh thiết kế"
    ms: "Mulakan portfolio visual reka bentuk"
    id: "Memulai portofolio visual desain"
    hi: "डिज़ाइन विज़ुअल का पोर्टफ़ोलियो शुरू करना"
