code: ENGL10002
year: 2026
learn:
  en: "What makes a book or play a classic: reading famous plays, poems and novels and asking who decides what is great."
  zh: "什么让一部作品成为经典：读著名的戏剧、诗歌和小说，并思考“好作品”是谁定的。"
  zh-TW: "什麼讓一部作品成為經典：讀著名的戲劇、詩歌和小說，並思考「好作品」是誰定的。"
  ja: "何が名作を名作にするのか：有名な戯曲・詩・小説を読み、「優れた作品」を誰が決めるのかを考える。"
  ko: "무엇이 고전을 만드는가: 유명한 희곡, 시, 소설을 읽고 '좋은 작품'은 누가 정하는지 생각한다."
  vi: "Điều gì làm nên một tác phẩm kinh điển: đọc kịch, thơ, tiểu thuyết nổi tiếng và hỏi ai quyết định thế nào là hay."
  ms: "Apa yang menjadikan karya itu klasik: baca drama, puisi dan novel terkenal serta tanya siapa yang menentukan karya hebat."
  id: "Apa yang membuat karya jadi klasik: membaca drama, puisi, dan novel terkenal sambil bertanya siapa yang menentukan karya hebat."
  hi: "किसी किताब या नाटक को क्लासिक क्या बनाता है: मशहूर नाटक, कविताएँ और उपन्यास पढ़ना और पूछना कि महान कौन तय करता है।"
outcomes:
  - en: "Read plays, poems and novels closely"
    zh: "细读戏剧、诗歌和小说"
    zh-TW: "細讀戲劇、詩歌和小說"
    ja: "戯曲・詩・小説を丁寧に読み込む"
    ko: "희곡, 시, 소설을 꼼꼼히 읽기"
    vi: "Đọc kỹ kịch, thơ và tiểu thuyết"
    ms: "Baca drama, puisi dan novel dengan teliti"
    id: "Membaca drama, puisi, dan novel secara cermat"
    hi: "नाटक, कविता और उपन्यास ध्यान से पढ़ना"
  - en: "Explain ideas like canon, genre and taste"
    zh: "解释经典、体裁、品味等概念"
    zh-TW: "解釋經典、文類、品味等概念"
    ja: "カノン・ジャンル・趣味といった概念を説明する"
    ko: "정전, 장르, 취향 같은 개념 설명하기"
    vi: "Giải thích các khái niệm như kinh điển, thể loại và gu thẩm mỹ"
    ms: "Terangkan idea seperti kanun, genre dan cita rasa"
    id: "Menjelaskan konsep seperti kanon, genre, dan selera"
    hi: "कैनन, विधा और रुचि जैसे विचार समझाना"
  - en: "Argue your own view on why a work matters"
    zh: "论证你自己对一部作品价值的看法"
    zh-TW: "論證你自己對一部作品價值的看法"
    ja: "作品の価値について自分の意見を論じる"
    ko: "작품이 왜 중요한지 자기 생각을 논증하기"
    vi: "Lập luận quan điểm riêng về giá trị của một tác phẩm"
    ms: "Hujahkan pandangan sendiri tentang kepentingan sesebuah karya"
    id: "Mengajukan pendapat sendiri tentang kenapa sebuah karya penting"
    hi: "किसी रचना के महत्व पर अपनी राय तर्क के साथ रखना"
