code: COMP90057
year: 2027
learn:
  en: "The limits of computing: Turing machines, decidability, complexity classes and what to do about hard problems."
  zh: "计算的极限：图灵机、可判定性、复杂度类，以及难题的应对。"
  zh-TW: "計算的極限：圖靈機、可判定性、複雜度類別，以及難題的因應。"
  ja: "計算の限界：チューリング機械、決定可能性、計算量クラス、難問への対処。"
  ko: "계산의 한계: 튜링 기계, 결정 가능성, 복잡도 클래스, 어려운 문제 대처."
  vi: "Giới hạn của tính toán: máy Turing, tính quyết định, lớp độ phức tạp, bài toán khó."
  ms: "Had pengkomputeran: mesin Turing, kebolehputusan, kelas kerumitan dan masalah sukar."
  id: "Batas komputasi: mesin Turing, keterputusan, kelas kompleksitas, dan masalah sulit."
  hi: "कंप्यूटिंग की सीमाएँ: ट्यूरिंग मशीन, डिसाइडेबिलिटी, कॉम्प्लेक्सिटी क्लास, कठिन समस्याएँ।"
outcomes:
  - en: "Prove whether a problem is decidable or tractable"
    zh: "证明问题是否可判定或可高效求解"
    zh-TW: "證明問題是否可判定或可有效求解"
    ja: "問題が決定可能か効率的に解けるか証明する"
    ko: "문제의 결정 가능성·효율성 증명하기"
    vi: "Chứng minh bài toán có quyết định được hay giải hiệu quả"
    ms: "Buktikan sama ada masalah boleh diputuskan atau mudah diurus"
    id: "Membuktikan apakah masalah dapat diputuskan atau efisien"
    hi: "साबित करना कि समस्या डिसाइडेबल या कुशलता से हल योग्य है"
  - en: "Use reductions to compare problem difficulty"
    zh: "用归约比较问题难度"
    zh-TW: "用歸約比較問題難度"
    ja: "帰着で問題の難しさを比べる"
    ko: "환원으로 문제 난이도 비교하기"
    vi: "Dùng phép quy dẫn để so độ khó"
    ms: "Guna penurunan untuk banding kesukaran masalah"
    id: "Memakai reduksi untuk membandingkan kesulitan"
    hi: "रिडक्शन से समस्याओं की कठिनाई की तुलना"
