code: ECON30025
year: 2026
learn:
  en: "Computer methods for economics and business: data visualisation, simulation, linear programming and more."
  zh: "经济与商业的计算机方法：数据可视化、模拟、线性规划等。"
  zh-TW: "經濟與商業的電腦方法：資料視覺化、模擬、線性規劃等。"
  ja: "経済・ビジネスのためのコンピュータ手法：データ可視化、シミュレーション、線形計画など。"
  ko: "경제·경영을 위한 컴퓨터 기법: 데이터 시각화, 시뮬레이션, 선형계획법 등."
  vi: "Phương pháp máy tính cho kinh tế và kinh doanh: trực quan hóa dữ liệu, mô phỏng, quy hoạch tuyến tính và hơn nữa."
  ms: "Kaedah komputer untuk ekonomi dan perniagaan: visualisasi data, simulasi, pengaturcaraan linear dan lain-lain."
  id: "Metode komputer untuk ekonomi dan bisnis: visualisasi data, simulasi, pemrograman linear, dan lainnya."
  hi: "अर्थशास्त्र और बिज़नेस के लिए कंप्यूटर तरीके: डेटा विज़ुअलाइज़ेशन, सिमुलेशन, लीनियर प्रोग्रामिंग आदि।"
outcomes:
  - en: "Summarise and chart survey or scanner data"
    zh: "汇总调查或扫码数据并作图"
    zh-TW: "彙整調查或掃描資料並作圖"
    ja: "調査データやPOSデータを集計しグラフ化する"
    ko: "설문·스캐너 데이터 요약하고 시각화하기"
    vi: "Tóm tắt và vẽ biểu đồ dữ liệu khảo sát, dữ liệu quét mã"
    ms: "Ringkas dan carta data tinjauan atau pengimbas"
    id: "Merangkum dan membuat grafik data survei atau pemindai"
    hi: "सर्वे या स्कैनर डेटा का सारांश और चार्ट बनाना"
  - en: "Solve optimisation problems with linear programming"
    zh: "用线性规划求解优化问题"
    zh-TW: "用線性規劃求解最佳化問題"
    ja: "線形計画で最適化問題を解く"
    ko: "선형계획법으로 최적화 문제 풀기"
    vi: "Giải bài toán tối ưu bằng quy hoạch tuyến tính"
    ms: "Selesaikan masalah pengoptimuman dengan pengaturcaraan linear"
    id: "Menyelesaikan masalah optimasi dengan pemrograman linear"
    hi: "लीनियर प्रोग्रामिंग से ऑप्टिमाइज़ेशन समस्याएँ हल करना"
  - en: "Run simulations to test an economic model"
    zh: "用模拟检验经济模型"
    zh-TW: "用模擬檢驗經濟模型"
    ja: "シミュレーションで経済モデルを検証する"
    ko: "시뮬레이션으로 경제 모형 검증하기"
    vi: "Chạy mô phỏng để kiểm tra mô hình kinh tế"
    ms: "Jalankan simulasi untuk uji model ekonomi"
    id: "Menjalankan simulasi untuk menguji model ekonomi"
    hi: "सिमुलेशन चलाकर आर्थिक मॉडल जाँचना"
