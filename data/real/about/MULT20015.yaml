code: MULT20015
year: 2026
learn:
  en: "Qubits, quantum logic and quantum algorithms, plus programming simulated and real quantum computers."
  zh: "量子比特、量子逻辑和算法，并动手编程量子计算机"
  zh-TW: "量子位元、量子邏輯和演算法，並動手寫程式操作量子電腦"
  ja: "量子ビット、量子論理、量子アルゴリズムと、量子コンピュータのプログラミング。"
  ko: "큐비트, 양자 논리, 양자 알고리즘과 양자컴퓨터 프로그래밍 실습."
  vi: "Qubit, logic lượng tử, thuật toán lượng tử, và lập trình máy tính lượng tử mô phỏng lẫn thật."
  ms: "Qubit, logik kuantum dan algoritma kuantum, serta memprogram komputer kuantum simulasi dan sebenar."
  id: "Qubit, logika kuantum, dan algoritma kuantum, plus memprogram komputer kuantum simulasi dan nyata."
  hi: "क्यूबिट, क्वांटम लॉजिक और एल्गोरिद्म, साथ में सिम्युलेटेड और असली क्वांटम कंप्यूटर प्रोग्रामिंग।"
outcomes:
  - en: "Program a quantum computer for simple logic tasks"
    zh: "编程让量子计算机完成简单逻辑任务"
    zh-TW: "寫程式讓量子電腦完成簡單邏輯任務"
    ja: "量子コンピュータで簡単な論理処理を組む"
    ko: "양자컴퓨터로 간단한 논리 작업 프로그래밍"
    vi: "Lập trình máy lượng tử cho tác vụ logic đơn giản"
    ms: "Memprogram komputer kuantum untuk tugas logik mudah"
    id: "Memprogram komputer kuantum untuk tugas logika sederhana"
    hi: "सरल लॉजिक कार्यों हेतु क्वांटम कंप्यूटर प्रोग्राम करना"
  - en: "Explain basic quantum algorithms"
    zh: "解释基本的量子算法"
    zh-TW: "解釋基本的量子演算法"
    ja: "基本的な量子アルゴリズムを説明する"
    ko: "기본 양자 알고리즘 설명하기"
    vi: "Giải thích thuật toán lượng tử cơ bản"
    ms: "Menerangkan algoritma kuantum asas"
    id: "Menjelaskan algoritma kuantum dasar"
    hi: "बुनियादी क्वांटम एल्गोरिद्म समझाना"
  - en: "Describe uses in finance and optimisation"
    zh: "说明在金融和优化中的应用"
    zh-TW: "說明在金融和最佳化中的應用"
    ja: "金融や最適化への応用を説明する"
    ko: "금융·최적화 분야 활용 설명하기"
    vi: "Mô tả ứng dụng trong tài chính và tối ưu"
    ms: "Menerangkan kegunaan dalam kewangan dan pengoptimuman"
    id: "Menjelaskan penerapan di keuangan dan optimisasi"
    hi: "वित्त और ऑप्टिमाइज़ेशन में उपयोग बताना"
