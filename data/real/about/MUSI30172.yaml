code: MUSI30172
year: 2026
learn:
  en: "A small chamber choir singing medieval, Renaissance and Baroque music, a cappella and with early instruments."
  zh: "小型室内合唱团，演唱中世纪、文艺复兴与巴洛克音乐，无伴奏或配古乐器。"
  zh-TW: "小型室內合唱團，演唱中世紀、文藝復興與巴洛克音樂，無伴奏或配古樂器。"
  ja: "中世・ルネサンス・バロックを歌う小編成合唱。無伴奏や古楽器と共に。"
  ko: "중세·르네상스·바로크를 부르는 소규모 합창단. 무반주 또는 고악기와 함께."
  vi: "Dàn hợp xướng nhỏ hát nhạc trung cổ, Phục hưng, Baroque, không đệm hoặc với nhạc cụ cổ."
  ms: "Koir kecil menyanyikan muzik zaman pertengahan, Renaissance dan Barok."
  id: "Paduan suara kecil menyanyikan musik abad pertengahan, Renaisans dan Barok."
  hi: "छोटा कोरस: मध्ययुगीन, पुनर्जागरण और बारोक संगीत, बिना संगत या पुराने वाद्यों के साथ।"
outcomes:
  - en: "Sing early music with accurate style"
    zh: "以准确风格演唱早期音乐"
    zh-TW: "以準確風格演唱早期音樂"
    ja: "正確な様式で古楽を歌う"
    ko: "정확한 양식으로 고음악 부르기"
    vi: "Hát nhạc cổ đúng phong cách"
    ms: "Nyanyikan muzik awal dengan gaya tepat"
    id: "Menyanyikan musik awal dengan gaya tepat"
    hi: "सही शैली में प्रारंभिक संगीत गाना"
  - en: "Hold your own line in a small choir"
    zh: "在小型合唱团中稳住自己的声部"
    zh-TW: "在小型合唱團中穩住自己的聲部"
    ja: "小編成合唱で自分の声部を保つ"
    ko: "소규모 합창에서 자기 성부 지키기"
    vi: "Giữ vững bè của mình trong dàn nhỏ"
    ms: "Kekalkan suara sendiri dalam koir kecil"
    id: "Menjaga suara sendiri di paduan kecil"
    hi: "छोटे कोरस में अपना स्वर-भाग संभालना"
  - en: "Pass an individual part test"
    zh: "通过个人声部测试"
    zh-TW: "通過個人聲部測試"
    ja: "個人パートテストに合格する"
    ko: "개인 파트 테스트 통과하기"
    vi: "Vượt qua bài kiểm tra bè cá nhân"
    ms: "Lulus ujian bahagian individu"
    id: "Lulus tes partisi individu"
    hi: "व्यक्तिगत भाग परीक्षा पास करना"
