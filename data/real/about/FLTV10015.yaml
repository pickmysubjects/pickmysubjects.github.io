code: FLTV10015
year: 2026
learn:
  en: "Write short scripts about film worlds and within set creative limits, and work on set with directing students."
  zh: "围绕电影世界和创作限制写短剧本，并与导演系学生一起上片场。"
  zh-TW: "圍繞電影世界和創作限制寫短劇本，並與導演系學生一起上片場。"
  ja: "映画の世界観や制約の中で短編脚本を書き、監督専攻の学生と現場に入る。"
  ko: "영화 세계와 창작 제약 속에서 단편 각본을 쓰고 연출 전공생과 촬영장에 간다."
  vi: "Viết kịch bản ngắn về thế giới phim và trong giới hạn sáng tạo, ra trường quay."
  ms: "Tulis skrip pendek tentang dunia filem dan dalam had kreatif, serta di set penggambaran."
  id: "Menulis naskah pendek soal dunia film dan batasan kreatif, ikut ke lokasi syuting."
  hi: "फ़िल्मी दुनिया और तय सीमाओं में छोटी पटकथाएँ लिखना, निर्देशन छात्रों के साथ सेट पर काम।"
outcomes:
  - en: "Write two short film scripts"
    zh: "写两部短片剧本"
    zh-TW: "寫兩部短片劇本"
    ja: "短編脚本を2本書く"
    ko: "단편 각본 두 편 쓰기"
    vi: "Viết hai kịch bản phim ngắn"
    ms: "Tulis dua skrip filem pendek"
    id: "Menulis dua naskah film pendek"
    hi: "दो शॉर्ट फ़िल्म पटकथाएँ लिखना"
  - en: "Give and take notes in script development"
    zh: "在剧本开发中给出并接受意见"
    zh-TW: "在劇本開發中給予並接受意見"
    ja: "脚本開発で意見を出し受け止める"
    ko: "각본 개발에서 피드백 주고받기"
    vi: "Góp ý và nhận góp ý khi phát triển kịch bản"
    ms: "Beri dan terima maklum balas skrip"
    id: "Memberi dan menerima masukan naskah"
    hi: "स्क्रिप्ट डेवलपमेंट में सुझाव देना और लेना"
  - en: "See how a script is used on set"
    zh: "了解剧本在片场如何使用"
    zh-TW: "了解劇本在片場如何使用"
    ja: "脚本が現場でどう使われるかを知る"
    ko: "각본이 촬영장에서 쓰이는 방식 보기"
    vi: "Thấy kịch bản được dùng ở trường quay"
    ms: "Lihat cara skrip digunakan di set"
    id: "Melihat cara naskah dipakai di lokasi"
    hi: "सेट पर स्क्रिप्ट का उपयोग देखना"
