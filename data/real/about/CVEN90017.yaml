code: CVEN90017
year: 2027
learn:
  en: "How earthquakes load buildings and how to design structures that can withstand them."
  zh: "地震如何作用于建筑，以及如何设计能抵御地震的结构。"
  zh-TW: "地震如何作用於建築，以及如何設計能抵禦地震的結構。"
  ja: "地震が建物にどう作用するか、そしてそれに耐える構造の設計方法。"
  ko: "지진이 건물에 미치는 하중과 이를 견디는 구조 설계 방법."
  vi: "Động đất tác động lên công trình ra sao và cách thiết kế kết cấu chịu được."
  ms: "Bagaimana gempa bumi membebani bangunan dan cara mereka bentuk struktur yang tahan."
  id: "Bagaimana gempa membebani bangunan dan cara merancang struktur yang tahan gempa."
  hi: "भूकंप इमारतों पर कैसे भार डालते हैं और उन्हें झेलने वाली संरचनाएँ कैसे डिज़ाइन करें।"
outcomes:
  - en: "Explain earthquake processes and earthquake-resistant design"
    zh: "解释地震过程和抗震设计原理"
    zh-TW: "解釋地震過程與耐震設計原理"
    ja: "地震の仕組みと耐震設計の原理を説明する"
    ko: "지진 과정과 내진 설계 원리 설명하기"
    vi: "Giải thích quá trình động đất và nguyên lý thiết kế kháng chấn"
    ms: "Menerangkan proses gempa bumi dan reka bentuk tahan gempa"
    id: "Menjelaskan proses gempa dan desain tahan gempa"
    hi: "भूकंप की प्रक्रिया और भूकंपरोधी डिज़ाइन समझाना"
  - en: "Run seismic analysis in software and check it by hand"
    zh: "用软件做地震分析并手算校核"
    zh-TW: "用軟體做地震分析並手算校核"
    ja: "ソフトで地震解析を行い手計算で確認する"
    ko: "소프트웨어로 지진 해석 후 손계산으로 검증하기"
    vi: "Phân tích động đất bằng phần mềm và kiểm tra bằng tay"
    ms: "Menjalankan analisis seismik dengan perisian dan menyemak secara manual"
    id: "Menjalankan analisis seismik dengan perangkat lunak dan memeriksanya manual"
    hi: "सॉफ़्टवेयर से भूकंपीय विश्लेषण कर हाथ से जाँचना"
  - en: "Design buildings for earthquake loads to Australian Standards"
    zh: "按澳大利亚标准进行建筑抗震设计"
    zh-TW: "依澳洲標準進行建築耐震設計"
    ja: "豪州規格に沿って建物を耐震設計する"
    ko: "호주 기준에 맞춰 건물 내진 설계하기"
    vi: "Thiết kế công trình chịu tải động đất theo tiêu chuẩn Úc"
    ms: "Mereka bentuk bangunan untuk beban gempa mengikut Piawaian Australia"
    id: "Merancang bangunan terhadap beban gempa sesuai Standar Australia"
    hi: "ऑस्ट्रेलियाई मानकों के अनुसार भूकंप भार के लिए इमारतें डिज़ाइन करना"
