code: SWEN20003
year: 2026
learn:
  en: "Designing software with objects and classes, and building those designs in a programming language."
  zh: "用对象和类来设计软件，并用编程语言实现。"
  zh-TW: "用物件和類別來設計軟體，並用程式語言實作。"
  ja: "オブジェクトとクラスによるソフトウェア設計と、プログラミング言語での実装。"
  ko: "객체와 클래스로 소프트웨어를 설계하고 프로그래밍 언어로 구현."
  vi: "Thiết kế phần mềm bằng đối tượng và lớp, rồi hiện thực bằng một ngôn ngữ lập trình."
  ms: "Mereka bentuk perisian dengan objek dan kelas, dan membinanya dalam bahasa pengaturcaraan."
  id: "Merancang perangkat lunak dengan objek dan kelas, lalu membangunnya dalam bahasa pemrograman."
  hi: "ऑब्जेक्ट और क्लास से सॉफ़्टवेयर डिज़ाइन करना और उसे प्रोग्रामिंग भाषा में बनाना।"
outcomes:
  - en: "Design a medium-sized program with object-oriented models"
    zh: "用面向对象方法设计中型程序"
    zh-TW: "用物件導向方法設計中型程式"
    ja: "オブジェクト指向モデルで中規模プログラムを設計する"
    ko: "객체지향 모델로 중간 규모 프로그램 설계"
    vi: "Thiết kế chương trình cỡ vừa bằng mô hình hướng đối tượng"
    ms: "Reka program bersaiz sederhana dengan model berorientasikan objek"
    id: "Merancang program menengah dengan model berorientasi objek"
    hi: "ऑब्जेक्ट-ओरिएंटेड मॉडल से मध्यम आकार का प्रोग्राम डिज़ाइन करना"
  - en: "Write code that follows your design"
    zh: "按设计写出代码"
    zh-TW: "按設計寫出程式碼"
    ja: "設計どおりにコードを書く"
    ko: "설계에 맞는 코드 작성"
    vi: "Viết code theo đúng thiết kế"
    ms: "Tulis kod mengikut reka bentuk anda"
    id: "Menulis kode sesuai desain"
    hi: "अपने डिज़ाइन के मुताबिक कोड लिखना"
  - en: "Compare the trade-offs of different designs"
    zh: "比较不同设计的利弊"
    zh-TW: "比較不同設計的利弊"
    ja: "設計ごとのトレードオフを比較する"
    ko: "여러 설계의 장단점 비교"
    vi: "So sánh ưu nhược của các thiết kế khác nhau"
    ms: "Bandingkan pertukaran antara reka bentuk berbeza"
    id: "Membandingkan untung-rugi berbagai desain"
    hi: "अलग डिज़ाइनों के फ़ायदे-नुकसान की तुलना"
