code: AIND20012
year: 2026
learn:
  en: "A second 5-day on-Country intensive: working with traditional materials and performance, then designing a new creative project."
  zh: "第二门 5 天在地密集课：接触传统材料与表演实践，之后设计一个新的创作项目。"
  zh-TW: "第二門 5 天在地密集課：接觸傳統材料與表演實踐，之後設計一個新的創作專案。"
  ja: "2つ目の5日間現地集中授業。伝統的な素材や身体表現に取り組み、新しい創作課題を企画する。"
  ko: "두 번째 5일 현지 집중 수업. 전통 재료와 공연 실천을 다루고 새 창작 과제를 기획한다."
  vi: "Khóa 5 ngày thực địa thứ hai: làm việc với vật liệu truyền thống và biểu diễn, rồi thiết kế một dự án sáng tạo mới."
  ms: "Intensif 5 hari kedua di tanah adat: bahan tradisional dan persembahan, kemudian mereka bentuk projek kreatif baharu."
  id: "Intensif 5 hari kedua di tanah adat: bahan tradisional dan pertunjukan, lalu merancang proyek kreatif baru."
  hi: "दूसरा 5 दिन का ऑन-कंट्री इंटेंसिव: पारंपरिक सामग्री और प्रदर्शन के साथ काम, फिर नया रचनात्मक प्रोजेक्ट बनाना।"
outcomes:
  - en: "Work with traditional materials and techniques"
    zh: "运用传统材料和技艺"
    zh-TW: "運用傳統材料和技藝"
    ja: "伝統的な素材と技法を使う"
    ko: "전통 재료와 기법 다루기"
    vi: "Làm việc với vật liệu và kỹ thuật truyền thống"
    ms: "Gunakan bahan dan teknik tradisional"
    id: "Bekerja dengan bahan dan teknik tradisional"
    hi: "पारंपरिक सामग्री और तकनीकों से काम करना"
  - en: "Engage safely and respectfully with Indigenous communities"
    zh: "安全且尊重地与原住民社区互动"
    zh-TW: "安全且尊重地與原住民社區互動"
    ja: "先住民コミュニティと安全に敬意を持って関わる"
    ko: "원주민 공동체와 안전하고 존중하며 교류하기"
    vi: "Giao tiếp an toàn, tôn trọng với cộng đồng bản địa"
    ms: "Berinteraksi dengan selamat dan hormat bersama komuniti Orang Asli"
    id: "Berinteraksi aman dan hormat dengan komunitas Pribumi"
    hi: "आदिवासी समुदायों से सुरक्षित और सम्मान के साथ जुड़ना"
  - en: "Design a new creative work in response to the intensive"
    zh: "围绕密集课所学设计新作品"
    zh-TW: "圍繞密集課所學設計新作品"
    ja: "集中授業を受けて新しい作品を企画する"
    ko: "집중 수업에 응답하는 새 작품 기획하기"
    vi: "Thiết kế tác phẩm mới đáp lại khóa học"
    ms: "Reka karya kreatif baharu sebagai respons kepada kursus"
    id: "Merancang karya baru sebagai tanggapan atas kursus"
    hi: "इंटेंसिव के जवाब में नई रचना तैयार करना"
