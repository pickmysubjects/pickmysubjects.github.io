code: MUSI10237
year: 2026
learn:
  en: "Why music helps or hurts wellbeing, drawing on psychology, sociology and medicine, and how it is used in hospitals, schools and communities."
  zh: "借助心理学、社会学和医学，探讨音乐为何能助益或损害健康，以及它在医院、学校和社区的应用。"
  zh-TW: "借助心理學、社會學與醫學，探討音樂為何能助益或損害健康，以及它在醫院、學校與社區的應用。"
  ja: "心理学・社会学・医学から、音楽が健康に良くも悪くも働く理由と、病院・学校・地域での活用を学ぶ。"
  ko: "심리학·사회학·의학을 바탕으로 음악이 건강에 득·실이 되는 이유와 병원·학교·지역사회 활용을 배운다."
  vi: "Vì sao âm nhạc giúp hay hại sức khỏe, dựa trên tâm lý, xã hội học, y học, và cách dùng ở bệnh viện, trường học."
  ms: "Mengapa muzik membantu atau menjejaskan kesejahteraan, dari psikologi, sosiologi dan perubatan, serta kegunaannya di hospital dan sekolah."
  id: "Mengapa musik membantu atau merugikan kesejahteraan, dari psikologi, sosiologi, kedokteran, dan penggunaannya di rumah sakit dan sekolah."
  hi: "मनोविज्ञान, समाजशास्त्र और चिकित्सा से समझना कि संगीत सेहत में कब मदद या नुकसान करता है, और अस्पताल-स्कूल में उपयोग।"
outcomes:
  - en: "Explain how music affects health"
    zh: "解释音乐如何影响健康"
    zh-TW: "解釋音樂如何影響健康"
    ja: "音楽が健康に与える影響を説明する"
    ko: "음악이 건강에 미치는 영향 설명하기"
    vi: "Giải thích âm nhạc ảnh hưởng sức khỏe ra sao"
    ms: "Terangkan kesan muzik pada kesihatan"
    id: "Menjelaskan pengaruh musik pada kesehatan"
    hi: "संगीत का सेहत पर असर समझाना"
  - en: "Compare music use across care settings"
    zh: "比较不同场所中音乐的使用"
    zh-TW: "比較不同場所中音樂的使用"
    ja: "さまざまな現場での音楽活用を比べる"
    ko: "여러 돌봄 현장의 음악 활용 비교하기"
    vi: "So sánh cách dùng âm nhạc ở các nơi chăm sóc"
    ms: "Banding penggunaan muzik di pelbagai tempat"
    id: "Membandingkan penggunaan musik di berbagai tempat"
    hi: "अलग-अलग जगहों पर संगीत उपयोग की तुलना"
  - en: "Apply research to real cases"
    zh: "把研究应用到真实案例"
    zh-TW: "把研究應用到真實案例"
    ja: "研究を実際の事例に当てはめる"
    ko: "연구를 실제 사례에 적용하기"
    vi: "Áp dụng nghiên cứu vào ca thực tế"
    ms: "Guna kajian pada kes sebenar"
    id: "Menerapkan riset pada kasus nyata"
    hi: "शोध को असली मामलों पर लागू करना"
