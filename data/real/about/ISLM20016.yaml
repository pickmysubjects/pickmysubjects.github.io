code: ISLM20016
year: 2026
learn:
  en: "Sufism as the spiritual side of Islam: its roots, ideas, practices like chanting and meditation, and its place today."
  zh: "苏菲主义作为伊斯兰的灵性面向：渊源、思想、诵念和冥想等实践，以及当今的地位。"
  zh-TW: "蘇菲主義作為伊斯蘭的靈性面向：淵源、思想、誦念和冥想等實踐，以及當今的地位。"
  ja: "イスラムの霊性面としてのスーフィズム。起源、思想、唱名や瞑想などの実践、今日の位置を学ぶ。"
  ko: "이슬람의 영성 측면인 수피즘: 뿌리, 사상, 염송과 명상 같은 수행, 오늘날의 위치를 배운다."
  vi: "Sufi giáo như khía cạnh tâm linh của Hồi giáo: nguồn gốc, tư tưởng, các thực hành như tụng niệm, thiền và vị trí ngày nay."
  ms: "Tasawuf sebagai sisi rohani Islam: akarnya, idea, amalan seperti zikir dan meditasi, serta tempatnya hari ini."
  id: "Tasawuf sebagai sisi spiritual Islam: akarnya, gagasan, praktik seperti zikir dan meditasi, serta tempatnya kini."
  hi: "इस्लाम का आध्यात्मिक पक्ष सूफ़ीवाद: इसकी जड़ें, विचार, ज़िक्र और ध्यान जैसी प्रथाएँ और आज इसकी जगह।"
outcomes:
  - en: "Explain the roots and ideas of Sufism"
    zh: "解释苏菲主义的渊源与思想"
    zh-TW: "解釋蘇菲主義的淵源與思想"
    ja: "スーフィズムの起源と思想を説明する"
    ko: "수피즘의 뿌리와 사상 설명하기"
    vi: "Giải thích nguồn gốc và tư tưởng của Sufi giáo"
    ms: "Terangkan akar dan idea tasawuf"
    id: "Menjelaskan akar dan gagasan tasawuf"
    hi: "सूफ़ीवाद की जड़ें और विचार समझाना"
  - en: "Describe Sufi practices and orders"
    zh: "描述苏菲的修行与教团"
    zh-TW: "描述蘇菲的修行與教團"
    ja: "スーフィーの実践と教団を説明する"
    ko: "수피 수행과 교단 설명하기"
    vi: "Mô tả các thực hành và dòng tu Sufi"
    ms: "Huraikan amalan dan tarekat sufi"
    id: "Mendeskripsikan praktik dan tarekat sufi"
    hi: "सूफ़ी प्रथाओं और सिलसिलों का वर्णन करना"
  - en: "Discuss Sufism's relevance today"
    zh: "讨论苏菲主义在当今的意义"
    zh-TW: "討論蘇菲主義在當今的意義"
    ja: "今日のスーフィズムの意義を論じる"
    ko: "오늘날 수피즘의 의미 논의하기"
    vi: "Thảo luận ý nghĩa của Sufi giáo ngày nay"
    ms: "Bincangkan kepentingan tasawuf hari ini"
    id: "Membahas relevansi tasawuf saat ini"
    hi: "आज सूफ़ीवाद की प्रासंगिकता पर चर्चा करना"
