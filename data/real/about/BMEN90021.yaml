code: BMEN90021
year: 2027
learn:
  en: "The physics and maths behind X-ray, CT, PET, MRI and ultrasound, with image reconstruction in MATLAB."
  zh: "X 光、CT、PET、MRI 和超声背后的物理与数学，并用 MATLAB 做图像重建。"
  zh-TW: "X 光、CT、PET、MRI 與超音波背後的物理與數學，並用 MATLAB 做影像重建。"
  ja: "X線・CT・PET・MRI・超音波の物理と数学を学び、MATLAB で画像再構成を行う。"
  ko: "X선, CT, PET, MRI, 초음파의 물리·수학과 MATLAB 영상 재구성."
  vi: "Vật lý và toán học của X-quang, CT, PET, MRI và siêu âm, cùng tái tạo ảnh bằng MATLAB."
  ms: "Fizik dan matematik di sebalik X-ray, CT, PET, MRI dan ultrabunyi, dengan pembinaan semula imej dalam MATLAB."
  id: "Fisika dan matematika di balik X-ray, CT, PET, MRI, dan USG, dengan rekonstruksi citra di MATLAB."
  hi: "एक्स-रे, CT, PET, MRI और अल्ट्रासाउंड के पीछे का भौतिकी-गणित, MATLAB में इमेज रीकंस्ट्रक्शन के साथ।"
outcomes:
  - en: "Describe how each imaging method works"
    zh: "描述各种成像方式的原理"
    zh-TW: "描述各種成像方式的原理"
    ja: "各画像診断法の仕組みを説明する"
    ko: "각 영상 기법의 원리 설명하기"
    vi: "Mô tả nguyên lý của từng phương pháp chụp ảnh"
    ms: "Menerangkan cara setiap kaedah pengimejan berfungsi"
    id: "Menjelaskan cara kerja tiap metode pencitraan"
    hi: "हर इमेजिंग विधि कैसे काम करती है, बताना"
  - en: "Reconstruct images with backprojection and Fourier methods"
    zh: "用反投影和傅里叶方法重建图像"
    zh-TW: "用反投影與傅立葉方法重建影像"
    ja: "逆投影法とフーリエ法で画像を再構成する"
    ko: "역투영과 푸리에 방법으로 영상 재구성하기"
    vi: "Tái tạo ảnh bằng phép chiếu ngược và Fourier"
    ms: "Membina semula imej dengan unjuran balik dan kaedah Fourier"
    id: "Merekonstruksi citra dengan backprojection dan Fourier"
    hi: "बैकप्रोजेक्शन और फूरियर विधियों से इमेज बनाना"
  - en: "Identify causes of image contrast and artefacts"
    zh: "找出图像对比度和伪影的成因"
    zh-TW: "找出影像對比與假影的成因"
    ja: "画像のコントラストとアーチファクトの原因を見分ける"
    ko: "영상 대비와 인공물의 원인 찾기"
    vi: "Xác định nguyên nhân độ tương phản và nhiễu ảnh"
    ms: "Mengenal pasti punca kontras dan artifak imej"
    id: "Mengenali penyebab kontras dan artefak citra"
    hi: "इमेज कंट्रास्ट और आर्टिफ़ैक्ट के कारण पहचानना"
