code: ABPL90064
year: 2027
learn:
  en: "How climate change and biodiversity loss shape urban planning, and how cities can act on mitigation goals."
  zh: "气候变化和生物多样性丧失如何影响城市规划，以及城市如何推进减排目标。"
  zh-TW: "氣候變遷與生物多樣性流失如何影響城市規劃，以及城市如何推動減排目標。"
  ja: "気候変動と生物多様性の損失が都市計画にどう関わり、都市が削減目標にどう取り組むか。"
  ko: "기후변화와 생물다양성 손실이 도시계획에 미치는 영향과 도시의 감축 목표 실행 방법."
  vi: "Biến đổi khí hậu và mất đa dạng sinh học ảnh hưởng quy hoạch đô thị ra sao, và đô thị hành động thế nào."
  ms: "Bagaimana perubahan iklim dan kehilangan biodiversiti membentuk perancangan bandar, dan cara bandar bertindak."
  id: "Bagaimana perubahan iklim dan hilangnya keanekaragaman hayati memengaruhi perencanaan kota, dan peran kota."
  hi: "जलवायु परिवर्तन और जैव-विविधता हानि शहरी नियोजन को कैसे प्रभावित करते हैं, और शहर क्या कर सकते हैं।"
outcomes:
  - en: "Explain key drivers of climate change and biodiversity loss"
    zh: "解释气候变化和生物多样性丧失的主要成因"
    zh-TW: "解釋氣候變遷與生物多樣性流失的主要成因"
    ja: "気候変動と生物多様性損失の主な要因を説明する"
    ko: "기후변화와 생물다양성 손실의 주요 원인 설명하기"
    vi: "Giải thích nguyên nhân chính của biến đổi khí hậu"
    ms: "Menerangkan punca utama perubahan iklim"
    id: "Menjelaskan pendorong utama perubahan iklim"
    hi: "जलवायु परिवर्तन के मुख्य कारण समझाना"
  - en: "Critically analyse urban responses to climate change"
    zh: "批判性分析城市应对气候变化的做法"
    zh-TW: "批判性分析城市因應氣候變遷的做法"
    ja: "都市の気候変動対策を批判的に分析する"
    ko: "도시의 기후변화 대응 비판적으로 분석하기"
    vi: "Phân tích phản biện cách đô thị ứng phó khí hậu"
    ms: "Menganalisis secara kritis tindak balas bandar"
    id: "Menganalisis kritis respons kota terhadap iklim"
    hi: "शहरों की जलवायु प्रतिक्रिया का आलोचनात्मक विश्लेषण"
