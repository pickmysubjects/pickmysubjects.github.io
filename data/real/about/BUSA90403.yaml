code: BUSA90403
year: 2027
learn:
  en: "The inside of an organisation: managing people, budgets and basic accounting, and processes and projects."
  zh: "组织内部运作：人员管理、预算与基础会计，以及流程和项目管理。"
  zh-TW: "組織內部運作：人員管理、預算與基礎會計，以及流程與專案管理。"
  ja: "組織の内側：人の管理、予算と基礎会計、プロセスとプロジェクト管理。"
  ko: "조직 내부 운영: 인력 관리, 예산과 기초 회계, 프로세스·프로젝트 관리."
  vi: "Bên trong tổ chức: quản lý con người, ngân sách và kế toán cơ bản, quy trình và dự án."
  ms: "Dalaman organisasi: mengurus orang, bajet dan perakaunan asas, proses serta projek."
  id: "Bagian dalam organisasi: kelola orang, anggaran dan akuntansi dasar, proses dan proyek."
  hi: "संगठन के भीतर: लोगों का प्रबंधन, बजट व बुनियादी लेखा, प्रक्रिया और प्रोजेक्ट।"
outcomes:
  - en: "Link people management to performance"
    zh: "把人员管理与绩效联系起来"
    zh-TW: "把人員管理與績效連結起來"
    ja: "人の管理と成果を結びつける"
    ko: "인력 관리와 성과 연결하기"
    vi: "Gắn quản lý con người với hiệu quả"
    ms: "Mengaitkan pengurusan orang dengan prestasi"
    id: "Mengaitkan manajemen orang dengan kinerja"
    hi: "लोगों के प्रबंधन को प्रदर्शन से जोड़ना"
  - en: "Use NPV, costing and budgets in decisions"
    zh: "运用净现值、成本核算和预算做决策"
    zh-TW: "運用淨現值、成本計算與預算做決策"
    ja: "NPV・原価計算・予算で判断する"
    ko: "NPV·원가·예산으로 의사결정하기"
    vi: "Dùng NPV, giá thành và ngân sách để ra quyết định"
    ms: "Guna NPV, kos dan bajet dalam keputusan"
    id: "Memakai NPV, biaya, dan anggaran untuk keputusan"
    hi: "NPV, लागत और बजट से निर्णय लेना"
  - en: "Apply process and project management tools"
    zh: "运用流程和项目管理工具"
    zh-TW: "運用流程與專案管理工具"
    ja: "プロセス・プロジェクト管理の道具を使う"
    ko: "프로세스·프로젝트 관리 도구 활용하기"
    vi: "Áp dụng công cụ quản lý quy trình và dự án"
    ms: "Menggunakan alat pengurusan proses dan projek"
    id: "Menerapkan alat manajemen proses dan proyek"
    hi: "प्रक्रिया व प्रोजेक्ट प्रबंधन टूल लागू करना"
