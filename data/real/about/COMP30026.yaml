code: COMP30026
year: 2026
learn:
  en: "The maths behind computer science: logic, sets, automata, formal languages and what can be computed."
  zh: "计算机科学背后的数学：逻辑、集合、自动机和可计算性。"
  zh-TW: "資訊科學背後的數學：邏輯、集合、自動機、形式語言和可計算性。"
  ja: "計算機科学の背後にある数学：論理、集合、オートマトン、形式言語、計算可能性。"
  ko: "컴퓨터 과학의 바탕이 되는 수학: 논리, 집합, 오토마타, 형식 언어, 계산 가능성."
  vi: "Toán nền tảng của khoa học máy tính: logic, tập hợp, automata, ngôn ngữ hình thức và tính khả tính."
  ms: "Matematik di sebalik sains komputer: logik, set, automata, bahasa formal dan kebolehkiraan."
  id: "Matematika di balik ilmu komputer: logika, himpunan, automata, bahasa formal, dan komputabilitas."
  hi: "कंप्यूटर साइंस के पीछे का गणित: लॉजिक, सेट, ऑटोमेटा, फ़ॉर्मल भाषाएँ और क्या कंप्यूट हो सकता है।"
outcomes:
  - en: "Use logic to reason about programs"
    zh: "用逻辑推理计算问题"
    zh-TW: "用邏輯推理程式問題"
    ja: "論理を使ってプログラムを推論する"
    ko: "논리로 프로그램에 대해 추론"
    vi: "Dùng logic để suy luận về chương trình"
    ms: "Guna logik untuk menaakul tentang program"
    id: "Memakai logika untuk menalar program"
    hi: "प्रोग्राम के बारे में लॉजिक से तर्क करना"
  - en: "Write grammars for simple languages"
    zh: "为简单语言写语法规则"
    zh-TW: "為簡單語言寫文法規則"
    ja: "簡単な言語の文法を書く"
    ko: "간단한 언어의 문법 작성"
    vi: "Viết văn phạm cho ngôn ngữ đơn giản"
    ms: "Tulis tatabahasa untuk bahasa ringkas"
    id: "Menulis tata bahasa untuk bahasa sederhana"
    hi: "सरल भाषाओं के लिए ग्रामर लिखना"
  - en: "Design finite-state and pushdown automata"
    zh: "设计有限状态和下推自动机"
    zh-TW: "設計有限狀態和下推自動機"
    ja: "有限オートマトンとプッシュダウンオートマトンを設計する"
    ko: "유한 상태·푸시다운 오토마타 설계"
    vi: "Thiết kế automata hữu hạn và automata đẩy xuống"
    ms: "Reka automata keadaan terhingga dan tolak-turun"
    id: "Merancang automata hingga dan pushdown"
    hi: "फ़ाइनाइट-स्टेट और पुशडाउन ऑटोमेटा बनाना"
