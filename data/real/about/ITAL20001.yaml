code: ITAL20001
year: 2026
learn:
  en: "Key parts of Italian culture through literary texts and films, and how Italian society has developed."
  zh: "通过文学作品和电影了解意大利文化的关键面向及社会发展。"
  zh-TW: "透過文學作品和電影了解義大利文化的關鍵面向及社會發展。"
  ja: "文学作品や映画を通して、イタリア文化の要点と社会の発展を学ぶ。"
  ko: "문학 작품과 영화로 이탈리아 문화의 핵심과 사회 발전을 배운다."
  vi: "Những nét chính của văn hóa Ý qua văn học và phim, và sự phát triển của xã hội Ý."
  ms: "Aspek utama budaya Itali melalui teks sastera dan filem, serta perkembangan masyarakat Itali."
  id: "Aspek utama budaya Italia melalui teks sastra dan film, serta perkembangan masyarakat Italia."
  hi: "साहित्यिक पाठों और फ़िल्मों से इतालवी संस्कृति के मुख्य पहलू, और इतालवी समाज का विकास।"
outcomes:
  - en: "Analyse Italian novels, stories and films"
    zh: "分析意大利小说、故事和电影"
    zh-TW: "分析義大利小說、故事和電影"
    ja: "イタリアの小説・物語・映画を分析する"
    ko: "이탈리아 소설·이야기·영화 분석하기"
    vi: "Phân tích tiểu thuyết, truyện và phim Ý"
    ms: "Analisis novel, cerita dan filem Itali"
    id: "Menganalisis novel, cerita dan film Italia"
    hi: "इतालवी उपन्यासों, कहानियों और फ़िल्मों का विश्लेषण करना"
  - en: "Trace how Italian society has changed"
    zh: "梳理意大利社会的变化"
    zh-TW: "梳理義大利社會的變化"
    ja: "イタリア社会の変化をたどる"
    ko: "이탈리아 사회의 변화 짚어 보기"
    vi: "Theo dõi xã hội Ý đã thay đổi ra sao"
    ms: "Jejaki perubahan masyarakat Itali"
    id: "Menelusuri perubahan masyarakat Italia"
    hi: "इतालवी समाज के बदलाव को समझना"
  - en: "Write critically about Italian history and culture"
    zh: "批判性地写作意大利历史与文化"
    zh-TW: "批判性地寫作義大利歷史與文化"
    ja: "イタリアの歴史と文化について批判的に書く"
    ko: "이탈리아 역사와 문화에 대해 비판적으로 쓰기"
    vi: "Viết có phê phán về lịch sử, văn hóa Ý"
    ms: "Tulis secara kritis tentang sejarah dan budaya Itali"
    id: "Menulis kritis tentang sejarah dan budaya Italia"
    hi: "इतालवी इतिहास और संस्कृति पर आलोचनात्मक लिखना"
