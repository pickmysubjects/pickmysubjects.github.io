code: ABPL90417
year: 2027
learn:
  en: "Field methods for studying how people use and perceive urban spaces, to inform planning and design."
  zh: "研究人们如何使用和感知城市空间的实地方法，用于指导规划与设计。"
  zh-TW: "研究人們如何使用和感知城市空間的實地方法，用於指導規劃與設計。"
  ja: "人々が都市空間をどう使い感じるかを調べる現地調査法と、その計画・設計への活用。"
  ko: "사람들이 도시 공간을 어떻게 쓰고 인식하는지 조사하는 현장 방법과 계획·설계 활용."
  vi: "Phương pháp thực địa để nghiên cứu cách con người dùng và cảm nhận không gian đô thị."
  ms: "Kaedah lapangan untuk mengkaji cara orang menggunakan dan melihat ruang bandar."
  id: "Metode lapangan untuk meneliti cara orang memakai dan memandang ruang kota."
  hi: "लोग शहरी स्थानों का कैसे उपयोग व अनुभव करते हैं, इसके फ़ील्ड तरीके, योजना व डिज़ाइन के लिए।"
outcomes:
  - en: "Collect and analyse field data on behaviour"
    zh: "收集并分析行为实地数据"
    zh-TW: "收集並分析行為實地資料"
    ja: "行動の現地データを集め分析する"
    ko: "행동 현장 데이터 수집·분석하기"
    vi: "Thu thập và phân tích dữ liệu hành vi"
    ms: "Mengumpul dan menganalisis data tingkah laku"
    id: "Mengumpulkan dan menganalisis data perilaku"
    hi: "व्यवहार पर फ़ील्ड डेटा जुटाना और विश्लेषण"
  - en: "Use research results in design thinking"
    zh: "把研究结果用于设计思考"
    zh-TW: "把研究結果用於設計思考"
    ja: "研究結果を設計に生かす"
    ko: "연구 결과를 설계에 활용하기"
    vi: "Dùng kết quả nghiên cứu cho tư duy thiết kế"
    ms: "Menggunakan hasil kajian dalam pemikiran reka bentuk"
    id: "Memakai hasil riset dalam pemikiran desain"
    hi: "शोध परिणामों का डिज़ाइन सोच में उपयोग"
