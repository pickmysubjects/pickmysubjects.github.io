code: GEOL20002
year: 2026
learn:
  en: "Earth's inner structure, plate tectonics and how rocks deform to build mountains and basins."
  zh: "地球内部结构、板块构造，以及岩石变形如何形成山脉和盆地。"
  zh-TW: "地球內部構造、板塊構造，以及岩石變形如何形成山脈與盆地。"
  ja: "地球の内部構造、プレートテクトニクス、岩石の変形による山脈と盆地の形成。"
  ko: "지구 내부 구조, 판구조론, 암석 변형으로 산맥과 분지가 생기는 과정."
  vi: "Cấu trúc bên trong Trái Đất, kiến tạo mảng và đá biến dạng tạo núi, bồn trũng ra sao."
  ms: "Struktur dalaman Bumi, tektonik plat dan ubah bentuk batuan membina gunung dan lembangan."
  id: "Struktur dalam Bumi, tektonik lempeng, dan deformasi batuan membentuk gunung dan cekungan."
  hi: "पृथ्वी की आंतरिक संरचना, प्लेट टेक्टोनिक्स, और चट्टानों का विरूपण कैसे पहाड़ व बेसिन बनाता है।"
outcomes:
  - en: "Evaluate large-scale geophysical datasets"
    zh: "评估大尺度地球物理数据"
    zh-TW: "評估大尺度地球物理資料"
    ja: "大規模な地球物理データを評価する"
    ko: "대규모 지구물리 데이터 평가하기"
    vi: "Đánh giá dữ liệu địa vật lý quy mô lớn"
    ms: "Nilai set data geofizik berskala besar"
    id: "Menilai data geofisika skala besar"
    hi: "बड़े पैमाने का भूभौतिकीय डेटा परखना"
  - en: "Read deformation on geological maps and sections"
    zh: "在地质图和剖面中解读变形"
    zh-TW: "在地質圖與剖面中解讀變形"
    ja: "地質図と断面図で変形を読み取る"
    ko: "지질도와 단면도에서 변형 읽기"
    vi: "Đọc biến dạng trên bản đồ và mặt cắt địa chất"
    ms: "Baca ubah bentuk pada peta dan keratan geologi"
    id: "Membaca deformasi di peta dan penampang geologi"
    hi: "भूवैज्ञानिक नक्शों और खंडों में विरूपण पढ़ना"
