code: MAST90083
year: 2027
learn:
  en: "Scalable computing methods for big-data statistics, such as nonparametric regression, splines and additive models."
  zh: "适用于大数据的计算统计方法：非参数回归、样条与广义可加模型等。"
  zh-TW: "適用於大數據的計算統計方法：無母數迴歸、樣條與廣義加成模型等。"
  ja: "大規模データ向け計算統計：ノンパラ回帰、スプライン、一般化加法モデルなど。"
  ko: "빅데이터용 계산통계 방법: 비모수 회귀, 스플라인, 일반화가법모형 등."
  vi: "Phương pháp thống kê tính toán cho dữ liệu lớn: hồi quy phi tham số, spline, mô hình cộng tính."
  ms: "Kaedah statistik pengiraan untuk data besar: regresi bukan parametrik, splin, model aditif."
  id: "Metode statistik komputasi untuk big data: regresi nonparametrik, spline, model aditif."
  hi: "बिग डेटा के लिए कम्प्यूटेशनल सांख्यिकी: नॉनपैरामेट्रिक रिग्रेशन, स्प्लाइन, एडिटिव मॉडल।"
outcomes:
  - en: "Fit flexible regression models to large datasets"
    zh: "对大型数据集拟合灵活的回归模型"
    zh-TW: "對大型資料集配適彈性迴歸模型"
    ja: "大規模データに柔軟な回帰モデルを当てはめる"
    ko: "대규모 데이터에 유연한 회귀모형 적합하기"
    vi: "Khớp mô hình hồi quy linh hoạt cho dữ liệu lớn"
    ms: "Memadankan model regresi fleksibel pada data besar"
    id: "Mencocokkan model regresi fleksibel ke data besar"
    hi: "बड़े डेटासेट पर लचीले रिग्रेशन मॉडल फ़िट करना"
  - en: "Check and compare models with diagnostic tools"
    zh: "用诊断工具检查和比较模型"
    zh-TW: "用診斷工具檢查與比較模型"
    ja: "診断手法でモデルを確認・比較する"
    ko: "진단 도구로 모델 점검·비교하기"
    vi: "Kiểm tra và so sánh mô hình bằng công cụ chẩn đoán"
    ms: "Menyemak dan membanding model dengan alat diagnostik"
    id: "Memeriksa dan membandingkan model dengan alat diagnostik"
    hi: "डायग्नॉस्टिक टूल से मॉडल जाँचना और तुलना करना"
