code: MUSI20196
year: 2026
learn:
  en: "More global guitar styles, from blues and rock to folk traditions, played in weekly classes and an end-of-semester group performance."
  zh: "继续学世界各地的吉他风格，从布鲁斯、摇滚到民谣，每周练习，期末小组演出"
  zh-TW: "繼續學世界各地的吉他風格，從藍調、搖滾到民謠，每週練習，期末小組演出"
  ja: "ブルースやロックから民俗音楽まで、世界のギタースタイルをさらに学び、学期末にグループ演奏。"
  ko: "블루스와 록부터 민속 전통까지 세계 기타 스타일을 더 배우고 학기 말 그룹 공연."
  vi: "Học thêm phong cách guitar thế giới, từ blues, rock đến dân gian, cuối kỳ biểu diễn nhóm."
  ms: "Lebih banyak gaya gitar dunia, dari blues dan rock hingga tradisi folk, dengan persembahan berkumpulan."
  id: "Lebih banyak gaya gitar dunia, dari blues dan rock hingga tradisi folk, dengan penampilan kelompok."
  hi: "दुनिया की और गिटार शैलियाँ, ब्लूज़-रॉक से लोक परंपराओं तक, साप्ताहिक कक्षाएँ और सेमेस्टर अंत में ग्रुप प्रस्तुति।"
outcomes:
  - en: "Tune, look after and play basic guitar techniques"
    zh: "调音、保养吉他并掌握基本弹奏技巧"
    zh-TW: "調音、保養吉他並掌握基本彈奏技巧"
    ja: "チューニング、手入れ、基本奏法を身につける"
    ko: "기타 조율·관리와 기본 주법 익히기"
    vi: "Lên dây, bảo quản và chơi kỹ thuật guitar cơ bản"
    ms: "Menala, menjaga dan memainkan teknik asas gitar"
    id: "Menyetem, merawat, dan memainkan teknik dasar gitar"
    hi: "गिटार ट्यून करना, सँभालना और बुनियादी तकनीकें बजाना"
  - en: "Perform guitar styles in a small group"
    zh: "在小组中演奏不同吉他风格"
    zh-TW: "在小組中演奏不同吉他風格"
    ja: "少人数でさまざまなギタースタイルを演奏する"
    ko: "소그룹으로 여러 기타 스타일 연주하기"
    vi: "Biểu diễn các phong cách guitar theo nhóm nhỏ"
    ms: "Mempersembahkan gaya gitar dalam kumpulan kecil"
    id: "Memainkan gaya gitar dalam kelompok kecil"
    hi: "छोटे समूह में गिटार शैलियाँ बजाना"
  - en: "Recognise and discuss guitar styles by ear"
    zh: "听辨并讨论各种吉他风格"
    zh-TW: "聽辨並討論各種吉他風格"
    ja: "耳でギタースタイルを聞き分け論じる"
    ko: "귀로 기타 스타일을 구별하고 논하기"
    vi: "Nghe nhận biết và bàn về phong cách guitar"
    ms: "Mengenal pasti dan membincangkan gaya gitar melalui pendengaran"
    id: "Mengenali dan membahas gaya gitar lewat pendengaran"
    hi: "सुनकर गिटार शैलियाँ पहचानना और उन पर चर्चा करना"
