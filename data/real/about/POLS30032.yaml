code: POLS30032
year: 2026
learn:
  en: "Why elections matter and how they work, from voting systems and turnout to party strategy, campaign money and media coverage."
  zh: "选举为什么重要、怎么运作，从投票制度和投票率，到政党策略、竞选资金和媒体报道。"
  zh-TW: "選舉為什麼重要、怎麼運作，從投票制度和投票率，到政黨策略、競選資金和媒體報導。"
  ja: "選挙がなぜ重要でどう機能するのかを、投票制度や投票率から政党の戦略、選挙資金、報道まで学ぶ。"
  ko: "선거가 왜 중요하고 어떻게 작동하는지 투표 제도와 투표율부터 정당 전략, 선거 자금, 언론 보도까지 배운다."
  vi: "Vì sao bầu cử quan trọng và vận hành ra sao, từ hệ thống bỏ phiếu, tỉ lệ đi bầu đến chiến lược đảng, tiền vận động và đưa tin."
  ms: "Kenapa pilihan raya penting dan cara ia berfungsi, dari sistem undian dan peratusan keluar mengundi hingga strategi parti, dana kempen dan liputan media."
  id: "Kenapa pemilu penting dan cara kerjanya, dari sistem pemungutan suara dan partisipasi hingga strategi partai, dana kampanye, dan liputan media."
  hi: "चुनाव क्यों मायने रखते हैं और कैसे होते हैं: वोटिंग प्रणाली और मतदान दर से लेकर पार्टी रणनीति, चुनावी पैसा और मीडिया कवरेज तक।"
outcomes:
  - en: "Explain how elections and voting systems work"
    zh: "说明选举和投票制度如何运作"
    zh-TW: "說明選舉和投票制度如何運作"
    ja: "選挙と投票制度の仕組みを説明する"
    ko: "선거와 투표 제도의 작동 방식 설명하기"
    vi: "Giải thích bầu cử và hệ thống bỏ phiếu vận hành ra sao"
    ms: "Terangkan cara pilihan raya dan sistem undian berfungsi"
    id: "Menjelaskan cara kerja pemilu dan sistem pemungutan suara"
    hi: "समझाना कि चुनाव और वोटिंग प्रणालियाँ कैसे काम करती हैं"
  - en: "Identify what shapes election results"
    zh: "找出影响选举结果的因素"
    zh-TW: "找出影響選舉結果的因素"
    ja: "選挙結果を左右する要因を見極める"
    ko: "선거 결과를 좌우하는 요인 파악하기"
    vi: "Xác định các yếu tố quyết định kết quả bầu cử"
    ms: "Kenal pasti faktor yang membentuk keputusan pilihan raya"
    id: "Mengenali faktor yang menentukan hasil pemilu"
    hi: "चुनाव के नतीजों को तय करने वाली बातें पहचानना"
  - en: "Analyse famous campaigns and their strategies"
    zh: "分析著名竞选活动及其策略"
    zh-TW: "分析著名競選活動及其策略"
    ja: "有名な選挙戦とその戦略を分析する"
    ko: "유명한 선거 운동과 전략 분석하기"
    vi: "Phân tích các chiến dịch nổi tiếng và chiến lược của họ"
    ms: "Analisis kempen terkenal dan strateginya"
    id: "Menganalisis kampanye terkenal dan strateginya"
    hi: "मशहूर चुनावी अभियानों और उनकी रणनीतियों का विश्लेषण करना"
