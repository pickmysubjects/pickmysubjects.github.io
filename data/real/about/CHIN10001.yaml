code: CHIN10001
year: 2026
learn:
  en: "Advanced Chinese for students who speak it but read and write less, using complex texts on social and cultural topics."
  zh: "面向会说但读写较弱的学生的高级中文，借助社会文化主题的复杂文本学习。"
  zh-TW: "面向會說但讀寫較弱的學生的高級中文，借助社會文化主題的複雜文本學習。"
  ja: "話せるが読み書きが弱い学生向けの上級中国語。社会・文化をテーマにした難しい文章で学ぶ。"
  ko: "말은 하지만 읽기·쓰기가 약한 학생을 위한 고급 중국어로, 사회·문화 주제의 어려운 글로 배운다."
  vi: "Tiếng Trung nâng cao cho người nói được nhưng đọc viết còn yếu, qua các văn bản phức tạp về xã hội và văn hóa."
  ms: "Bahasa Cina lanjutan untuk pelajar yang bertutur tetapi kurang membaca dan menulis, melalui teks sukar tentang sosial dan budaya."
  id: "Bahasa Mandarin lanjutan bagi yang bisa berbicara tetapi kurang membaca dan menulis, lewat teks sulit tentang sosial dan budaya."
  hi: "उन छात्रों के लिए उन्नत चीनी जो बोलते हैं पर पढ़ना-लिखना कम जानते हैं, सामाजिक-सांस्कृतिक विषयों के कठिन पाठों से।"
outcomes:
  - en: "Read complex Chinese texts on social topics"
    zh: "阅读社会话题的复杂中文文本"
    zh-TW: "閱讀社會話題的複雜中文文本"
    ja: "社会的なテーマの難しい中国語の文章を読む"
    ko: "사회 주제의 어려운 중국어 글 읽기"
    vi: "Đọc văn bản tiếng Trung phức tạp về chủ đề xã hội"
    ms: "Baca teks Cina yang sukar tentang topik sosial"
    id: "Membaca teks Mandarin sulit tentang topik sosial"
    hi: "सामाजिक विषयों पर कठिन चीनी पाठ पढ़ना"
  - en: "Discuss cultural issues in Chinese"
    zh: "用中文讨论文化议题"
    zh-TW: "用中文討論文化議題"
    ja: "中国語で文化的な問題を話し合う"
    ko: "중국어로 문화 문제 토론하기"
    vi: "Thảo luận vấn đề văn hóa bằng tiếng Trung"
    ms: "Bincangkan isu budaya dalam bahasa Cina"
    id: "Membahas isu budaya dalam bahasa Mandarin"
    hi: "चीनी में सांस्कृतिक मुद्दों पर चर्चा करना"
  - en: "Write clear Chinese at an advanced level"
    zh: "用高级中文清楚写作"
    zh-TW: "用高級中文清楚寫作"
    ja: "上級レベルの中国語で明確に書く"
    ko: "고급 수준의 중국어로 명확하게 쓰기"
    vi: "Viết tiếng Trung rõ ràng ở trình độ nâng cao"
    ms: "Tulis bahasa Cina dengan jelas pada tahap lanjutan"
    id: "Menulis bahasa Mandarin dengan jelas di tingkat lanjut"
    hi: "उन्नत स्तर पर स्पष्ट चीनी लिखना"
