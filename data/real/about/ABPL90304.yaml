code: ABPL90304
year: 2027
learn:
  en: "Large-scale design modelling with GIS, 3D modelling and civil information models, bringing social and environmental data into design."
  zh: "用 GIS、三维建模和土木信息模型做大尺度设计建模，把社会和环境数据纳入设计。"
  zh-TW: "用 GIS、3D 建模與土木資訊模型做大尺度設計建模，把社會與環境資料納入設計。"
  ja: "GIS・3D・CIM による大規模デザインモデリング。社会・環境データを設計に生かす。"
  ko: "GIS·3D 모델링·CIM으로 대규모 설계 모델링, 사회·환경 데이터 반영."
  vi: "Mô hình thiết kế quy mô lớn bằng GIS, 3D và CIM, đưa dữ liệu xã hội, môi trường vào thiết kế."
  ms: "Pemodelan reka bentuk berskala besar dengan GIS, 3D dan CIM, memasukkan data sosial dan alam sekitar."
  id: "Pemodelan desain skala besar dengan GIS, 3D dan CIM, memasukkan data sosial dan lingkungan."
  hi: "GIS, 3D मॉडलिंग और CIM से बड़े पैमाने की डिज़ाइन मॉडलिंग, सामाजिक-पर्यावरणीय डेटा के साथ।"
outcomes:
  - en: "Combine geospatial data with 3D design models"
    zh: "把地理空间数据与三维设计模型结合"
    zh-TW: "把地理空間資料與 3D 設計模型結合"
    ja: "地理空間データと3Dモデルを組み合わせる"
    ko: "지리공간 데이터와 3D 모델 결합하기"
    vi: "Kết hợp dữ liệu không gian với mô hình 3D"
    ms: "Menggabungkan data geospatial dengan model 3D"
    id: "Menggabungkan data geospasial dengan model 3D"
    hi: "भू-स्थानिक डेटा को 3D मॉडल से जोड़ना"
  - en: "Present a design workflow as a poster or video"
    zh: "以海报或视频展示设计流程"
    zh-TW: "以海報或影片展示設計流程"
    ja: "設計ワークフローをポスターや動画で示す"
    ko: "설계 워크플로를 포스터·영상으로 발표하기"
    vi: "Trình bày quy trình thiết kế bằng poster hoặc video"
    ms: "Membentang aliran kerja reka bentuk melalui poster atau video"
    id: "Menyajikan alur kerja desain lewat poster atau video"
    hi: "पोस्टर या वीडियो से डिज़ाइन प्रक्रिया दिखाना"
