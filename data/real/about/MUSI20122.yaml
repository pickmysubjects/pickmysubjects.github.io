code: MUSI20122
year: 2026
learn:
  en: "A first go at composing: write solo, duo and quartet pieces that classmates play in workshops."
  zh: "作曲入门：写独奏、二重奏和四重奏，由同学在课上演奏。"
  zh-TW: "作曲入門：寫獨奏、二重奏和四重奏，由同學在課上演奏。"
  ja: "作曲入門。独奏・二重奏・四重奏を書き、授業で仲間が演奏する。"
  ko: "작곡 입문. 독주·이중주·사중주를 써서 수업에서 동료가 연주."
  vi: "Nhập môn sáng tác: viết cho độc tấu, song tấu, tứ tấu để bạn cùng lớp chơi."
  ms: "Mula menggubah: tulis karya solo, duo dan kuartet dimainkan rakan sekelas."
  id: "Awal menggubah: menulis karya solo, duo dan kuartet yang dimainkan teman kelas."
  hi: "रचना की शुरुआत: सोलो, ड्यूओ और क्वार्टेट लिखना जिसे सहपाठी बजाते हैं।"
outcomes:
  - en: "Use practical strategies to write music"
    zh: "运用实用策略写音乐"
    zh-TW: "運用實用策略寫音樂"
    ja: "実践的な方法で作曲する"
    ko: "실용적 전략으로 곡 쓰기"
    vi: "Dùng chiến lược thực tế để sáng tác"
    ms: "Guna strategi praktikal untuk menggubah"
    id: "Memakai strategi praktis untuk menggubah"
    hi: "व्यावहारिक तरीकों से संगीत लिखना"
  - en: "Present clean, professional notation"
    zh: "呈现规范专业的乐谱"
    zh-TW: "呈現規範專業的樂譜"
    ja: "整ったプロの楽譜を作る"
    ko: "깔끔하고 전문적인 악보 만들기"
    vi: "Trình bày ký âm chuyên nghiệp"
    ms: "Sediakan notasi kemas dan profesional"
    id: "Menyajikan notasi rapi dan profesional"
    hi: "साफ़, पेशेवर नोटेशन तैयार करना"
  - en: "Respond to others' new music"
    zh: "对他人的新作品作出回应"
    zh-TW: "對他人的新作品作出回應"
    ja: "他者の新作に応答する"
    ko: "다른 사람의 신작에 반응하기"
    vi: "Phản hồi tác phẩm mới của người khác"
    ms: "Beri respons kepada karya baharu orang lain"
    id: "Menanggapi karya baru orang lain"
    hi: "दूसरों के नए संगीत पर प्रतिक्रिया"
