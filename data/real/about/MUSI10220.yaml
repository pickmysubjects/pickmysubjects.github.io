code: MUSI10220
year: 2026
learn:
  en: "First-year practical study: individual lessons and classes on your instrument or voice, a progress video and a 15-minute exam."
  zh: "一年级实践课：乐器或声乐个别课和小组课，提交进度视频并参加15分钟考试演奏。"
  zh-TW: "一年級實作課：樂器或聲樂個別課和小組課，提交進度影片並參加15分鐘考試演奏。"
  ja: "1年次の実技。楽器や声の個人レッスンとクラス、進捗動画と15分の実技試験。"
  ko: "1학년 실기: 악기·성악 개인 레슨과 수업, 진행 영상과 15분 실기 시험."
  vi: "Thực hành năm nhất: học riêng và lớp nhạc cụ/giọng, video tiến độ và thi diễn 15 phút."
  ms: "Praktikal tahun satu: kelas individu alat atau vokal, video kemajuan dan ujian 15 minit."
  id: "Praktik tahun pertama: les alat atau vokal, video perkembangan, dan ujian pentas 15 menit."
  hi: "पहले वर्ष की प्रैक्टिकल पढ़ाई: वाद्य/आवाज़ की निजी कक्षाएँ, प्रगति वीडियो, 15 मिनट परीक्षा।"
outcomes:
  - en: "Build solid technique on your instrument or voice"
    zh: "在乐器或声乐上打好技术基础"
    zh-TW: "在樂器或聲樂上打好技術基礎"
    ja: "楽器や声の確かな技術を築く"
    ko: "악기·성악 기초 기술 다지기"
    vi: "Xây kỹ thuật vững cho nhạc cụ, giọng"
    ms: "Bina teknik kukuh alat atau vokal"
    id: "Membangun teknik alat musik atau vokal"
    hi: "वाद्य या आवाज़ की मज़बूत तकनीक"
  - en: "Play with accuracy, style and good tone"
    zh: "准确、有风格且音色好地演奏"
    zh-TW: "準確、有風格且音色好地演奏"
    ja: "正確に、様式と良い音色で演奏する"
    ko: "정확하고 양식에 맞게 좋은 음색으로"
    vi: "Chơi chính xác, đúng phong cách"
    ms: "Main dengan tepat, gaya dan nada baik"
    id: "Bermain akurat, bergaya, nada bagus"
    hi: "सटीकता, शैली व अच्छे स्वर से बजाना"
  - en: "Perform with confidence, alone or in groups"
    zh: "独自或合作自信演出"
    zh-TW: "獨自或合作自信演出"
    ja: "一人でも合奏でも自信を持って演奏"
    ko: "혼자나 함께 자신 있게 연주하기"
    vi: "Tự tin biểu diễn đơn lẻ hoặc nhóm"
    ms: "Persembahan yakin, solo atau kumpulan"
    id: "Tampil percaya diri, solo atau grup"
    hi: "अकेले या समूह में आत्मविश्वास से प्रस्तुति"
