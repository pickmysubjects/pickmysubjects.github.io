code: ACTL30007
year: 2026
learn:
  en: "Modelling claim sizes and total claims in general insurance, including reinsurance, dependence and time series."
  zh: "非寿险中理赔金额和总赔款的建模，包括再保险、相关性和时间序列。"
  zh-TW: "產險中理賠金額與總賠款的建模，包括再保險、相依性和時間序列。"
  ja: "損害保険の損害額と総支払額のモデル化。再保険、依存関係、時系列も扱う。"
  ko: "손해보험의 보험금 크기와 총 보험금 모형화. 재보험, 의존성, 시계열 포함."
  vi: "Mô hình hoá mức bồi thường và tổng bồi thường trong bảo hiểm phi nhân thọ, gồm tái bảo hiểm, phụ thuộc và chuỗi thời gian."
  ms: "Memodel saiz tuntutan dan jumlah tuntutan dalam insurans am, termasuk insurans semula, kebergantungan dan siri masa."
  id: "Memodelkan besar klaim dan total klaim di asuransi umum, termasuk reasuransi, dependensi, dan deret waktu."
  hi: "जनरल इंश्योरेंस में क्लेम के आकार और कुल क्लेम का मॉडल, जिसमें रीइंश्योरेंस, निर्भरता और टाइम सीरीज़ शामिल हैं।"
outcomes:
  - en: "Fit loss distributions and test the fit"
    zh: "拟合损失分布并检验拟合优度"
    zh-TW: "配適損失分配並檢定配適度"
    ja: "損害額分布を当てはめ、適合度を検定する"
    ko: "손실 분포 적합과 적합도 검정"
    vi: "Khớp phân phối tổn thất và kiểm định độ phù hợp"
    ms: "Padankan taburan kerugian dan uji kesesuaiannya"
    id: "Mencocokkan distribusi kerugian dan menguji kecocokannya"
    hi: "लॉस डिस्ट्रीब्यूशन फ़िट करना और फ़िट की जाँच"
  - en: "Model total claims with and without reinsurance"
    zh: "在有无再保险时建模总赔款"
    zh-TW: "在有無再保險下建模總賠款"
    ja: "再保険の有無で総支払額をモデル化する"
    ko: "재보험 유무에 따른 총 보험금 모형화"
    vi: "Mô hình tổng bồi thường có và không có tái bảo hiểm"
    ms: "Model jumlah tuntutan dengan dan tanpa insurans semula"
    id: "Memodelkan total klaim dengan dan tanpa reasuransi"
    hi: "रीइंश्योरेंस के साथ और बिना कुल क्लेम का मॉडल"
  - en: "Use copulas and extreme value theory for big losses"
    zh: "用Copula和极值理论处理巨额损失"
    zh-TW: "用Copula和極值理論處理巨額損失"
    ja: "コピュラと極値理論で巨額損失を扱う"
    ko: "코퓰러와 극단값 이론으로 대형 손실 다루기"
    vi: "Dùng copula và lý thuyết cực trị cho tổn thất lớn"
    ms: "Guna kopula dan teori nilai ekstrem untuk kerugian besar"
    id: "Memakai kopula dan teori nilai ekstrem untuk kerugian besar"
    hi: "बड़े नुकसान के लिए कोपुला और एक्सट्रीम वैल्यू थ्योरी"
