code: FNCE90086
year: 2027
learn:
  en: "How psychology shapes financial decisions, and how it explains market anomalies standard finance cannot."
  zh: "心理如何影响金融决策，以及如何解释传统金融无法解释的市场异象。"
  zh-TW: "心理如何影響金融決策，以及如何解釋傳統金融無法解釋的市場異常。"
  ja: "心理が金融判断にどう影響し、従来理論で説明できない市場の異常をどう説明するか。"
  ko: "심리가 금융 의사결정에 미치는 영향과 전통 재무로 설명 못 하는 시장 이상현상."
  vi: "Tâm lý ảnh hưởng quyết định tài chính và giải thích bất thường thị trường mà tài chính truyền thống không giải thích được."
  ms: "Cara psikologi membentuk keputusan kewangan dan menerangkan anomali pasaran yang tidak dapat dijelaskan teori biasa."
  id: "Cara psikologi membentuk keputusan keuangan dan menjelaskan anomali pasar yang tak terjelaskan teori biasa."
  hi: "मनोविज्ञान वित्तीय निर्णयों को कैसे प्रभावित करता है और बाज़ार की विसंगतियां कैसे समझाता है।"
outcomes:
  - en: "Explain the psychology behind financial choices"
    zh: "解释金融选择背后的心理过程"
    zh-TW: "解釋金融選擇背後的心理過程"
    ja: "金融判断の背後にある心理を説明する"
    ko: "금융 선택 뒤의 심리 과정 설명하기"
    vi: "Giải thích tâm lý đằng sau lựa chọn tài chính"
    ms: "Menerangkan psikologi di sebalik pilihan kewangan"
    id: "Menjelaskan psikologi di balik pilihan keuangan"
    hi: "वित्तीय चुनावों के पीछे का मनोविज्ञान समझाना"
  - en: "Use behavioural ideas to explain market anomalies"
    zh: "用行为理论解释市场异象"
    zh-TW: "用行為理論解釋市場異常"
    ja: "行動理論で市場の異常を説明する"
    ko: "행동이론으로 시장 이상현상 설명하기"
    vi: "Dùng lý thuyết hành vi giải thích bất thường thị trường"
    ms: "Menggunakan idea tingkah laku untuk menerangkan anomali"
    id: "Memakai teori perilaku untuk menjelaskan anomali pasar"
    hi: "व्यवहारिक विचारों से बाज़ार विसंगतियां समझाना"
