code: MECM10006
year: 2026
learn:
  en: "How communication shapes social and political change, and how to research, write and edit persuasive pieces about issues you care about."
  zh: "传播如何推动社会和政治变化，以及如何为你关心的议题做研究、写作并修改有说服力的文章。"
  zh-TW: "傳播如何推動社會和政治變化，以及如何為你關心的議題做研究、寫作並修改有說服力的文章。"
  ja: "コミュニケーションが社会や政治の変化をどう形づくるか、そして関心のある問題について調べ、説得力ある文章を書き、推敲する方法を学ぶ。"
  ko: "소통이 사회와 정치 변화를 어떻게 이끄는지, 그리고 관심 있는 문제에 대해 조사하고 설득력 있는 글을 쓰고 다듬는 법을 배운다."
  vi: "Giao tiếp định hình thay đổi xã hội và chính trị ra sao, và cách nghiên cứu, viết, biên tập bài thuyết phục về vấn đề bạn quan tâm."
  ms: "Bagaimana komunikasi membentuk perubahan sosial dan politik, serta cara menyelidik, menulis dan menyunting tulisan yang meyakinkan tentang isu yang anda pedulikan."
  id: "Bagaimana komunikasi membentuk perubahan sosial dan politik, serta cara meneliti, menulis, dan menyunting tulisan persuasif tentang isu yang kamu pedulikan."
  hi: "संचार सामाजिक और राजनीतिक बदलाव को कैसे आकार देता है, और अपने पसंद के मुद्दों पर शोध करके असरदार लेख लिखना व संपादित करना।"
outcomes:
  - en: "Explain basic ideas of media and genre theory"
    zh: "解释媒体与体裁理论的基本概念"
    zh-TW: "解釋媒體與文類理論的基本概念"
    ja: "メディア論とジャンル論の基本概念を説明する"
    ko: "미디어 이론과 장르 이론의 기본 개념 설명하기"
    vi: "Giải thích các khái niệm cơ bản của lý thuyết truyền thông và thể loại"
    ms: "Terangkan konsep asas teori media dan genre"
    id: "Menjelaskan konsep dasar teori media dan genre"
    hi: "मीडिया और विधा (genre) सिद्धांत के बुनियादी विचार समझाना"
  - en: "Assess how media representation affects social issues"
    zh: "评估媒体呈现对社会议题的影响"
    zh-TW: "評估媒體再現對社會議題的影響"
    ja: "メディアの表象が社会問題に与える影響を評価する"
    ko: "미디어 재현이 사회 문제에 미치는 영향 평가하기"
    vi: "Đánh giá cách truyền thông khắc họa ảnh hưởng đến các vấn đề xã hội"
    ms: "Nilai kesan gambaran media terhadap isu sosial"
    id: "Menilai dampak representasi media pada isu sosial"
    hi: "आकलन करना कि मीडिया में चित्रण सामाजिक मुद्दों को कैसे प्रभावित करता है"
  - en: "Argue for change clearly in speech and writing"
    zh: "用口头和书面形式清楚地为变革发声"
    zh-TW: "用口頭和書面形式清楚地為變革發聲"
    ja: "口頭と文章で変化を求める主張をはっきり伝える"
    ko: "말과 글로 변화를 위한 주장을 분명하게 펼치기"
    vi: "Lập luận rõ ràng cho sự thay đổi bằng lời nói và bài viết"
    ms: "Berhujah untuk perubahan dengan jelas secara lisan dan bertulis"
    id: "Menyuarakan perubahan dengan jelas secara lisan dan tertulis"
    hi: "बोलकर और लिखकर बदलाव के पक्ष में साफ़ तर्क देना"
