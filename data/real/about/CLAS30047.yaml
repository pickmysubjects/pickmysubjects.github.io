code: CLAS30047
year: 2026
learn:
  en: "Latin comedy or tragedy at an advanced level: style, staging, links to Roman life, and how the plays were later received."
  zh: "高阶阅读拉丁喜剧或悲剧：风格、演出、与罗马生活的联系，以及后世的接受。"
  zh-TW: "高階閱讀拉丁喜劇或悲劇：風格、演出、與羅馬生活的聯繫，以及後世的接受。"
  ja: "ラテン語の喜劇や悲劇を上級で読む。文体、上演、ローマの暮らしとの関係、後世での受け止められ方。"
  ko: "라틴 희극이나 비극을 고급 수준으로 읽는다. 문체, 공연, 로마 생활과의 관계, 후대의 수용."
  vi: "Hài kịch hoặc bi kịch Latinh ở mức nâng cao: phong cách, dàn dựng, liên hệ với đời sống La Mã và sự tiếp nhận sau này."
  ms: "Komedi atau tragedi Latin di tahap lanjutan: gaya, pementasan, kaitan dengan kehidupan Rom, dan penerimaannya kemudian."
  id: "Komedi atau tragedi Latin tingkat lanjut: gaya, pementasan, kaitan dengan kehidupan Romawi, dan penerimaannya kemudian."
  hi: "उन्नत स्तर पर लैटिन कॉमेडी या त्रासदी: शैली, मंचन, रोमन जीवन से संबंध, और बाद में उनका ग्रहण।"
outcomes:
  - en: "Read original Latin texts with some dictionary help"
    zh: "借助词典阅读拉丁语原文"
    zh-TW: "藉助詞典閱讀拉丁語原文"
    ja: "辞書を使ってラテン語の原典を読む"
    ko: "사전을 활용해 라틴어 원문 읽기"
    vi: "Đọc nguyên bản tiếng Latinh với sự hỗ trợ của từ điển"
    ms: "Baca teks asal bahasa Latin dengan bantuan kamus"
    id: "Membaca teks asli bahasa Latin dengan bantuan kamus"
    hi: "शब्दकोश की मदद से मूल लैटिन पाठ पढ़ना"
  - en: "Analyse complex Latin grammar and sentence structure"
    zh: "分析复杂的拉丁语语法和句子结构"
    zh-TW: "分析複雜的拉丁語文法和句子結構"
    ja: "ラテン語の複雑な文法と構文を分析する"
    ko: "복잡한 라틴어 문법과 문장 구조 분석하기"
    vi: "Phân tích ngữ pháp và cấu trúc câu tiếng Latinh phức tạp"
    ms: "Analisis tatabahasa dan struktur ayat bahasa Latin yang kompleks"
    id: "Menganalisis tata bahasa dan struktur kalimat bahasa Latin yang rumit"
    hi: "जटिल लैटिन व्याकरण और वाक्य-रचना का विश्लेषण करना"
  - en: "Translate and interpret ancient literature"
    zh: "翻译并解读古代文学作品"
    zh-TW: "翻譯並解讀古代文學作品"
    ja: "古代の文学作品を訳し解釈する"
    ko: "고대 문학 작품 번역하고 해석하기"
    vi: "Dịch và diễn giải văn học cổ đại"
    ms: "Terjemah dan tafsir karya sastera kuno"
    id: "Menerjemahkan dan menafsirkan karya sastra kuno"
    hi: "प्राचीन साहित्य का अनुवाद और व्याख्या करना"
