code: ECON20013
year: 2026
learn:
  en: "How the world economy grew over the last 300 years, and the role of geography, institutions, technology and culture."
  zh: "过去300年世界经济如何发展，以及地理、制度、技术和文化的作用。"
  zh-TW: "過去300年世界經濟如何發展，以及地理、制度、科技和文化的作用。"
  ja: "過去300年の世界経済の発展と、地理・制度・技術・文化の役割。"
  ko: "지난 300년 세계 경제의 발전과 지리, 제도, 기술, 문화의 역할."
  vi: "Kinh tế thế giới phát triển ra sao trong 300 năm qua, và vai trò của địa lý, thể chế, công nghệ, văn hóa."
  ms: "Perkembangan ekonomi dunia 300 tahun lalu, dan peranan geografi, institusi, teknologi serta budaya."
  id: "Perkembangan ekonomi dunia 300 tahun terakhir, serta peran geografi, institusi, teknologi, dan budaya."
  hi: "पिछले 300 साल में विश्व अर्थव्यवस्था कैसे बढ़ी, और भूगोल, संस्थाओं, तकनीक व संस्कृति की भूमिका।"
outcomes:
  - en: "Explain why using scarce resources well is central to economics"
    zh: "解释稀缺资源配置为何是经济学核心"
    zh-TW: "說明稀缺資源配置為何是經濟學核心"
    ja: "希少な資源の配分がなぜ経済学の中心か説明する"
    ko: "희소 자원 배분이 경제학의 핵심인 이유 설명"
    vi: "Giải thích vì sao phân bổ nguồn lực khan hiếm là cốt lõi"
    ms: "Terangkan mengapa agihan sumber terhad teras ekonomi"
    id: "Menjelaskan mengapa alokasi sumber daya langka itu inti ekonomi"
    hi: "कम संसाधनों का सही उपयोग अर्थशास्त्र का केंद्र क्यों है, समझाना"
  - en: "Use theory and historical data to explain world events"
    zh: "用理论和历史数据解释世界经济事件"
    zh-TW: "用理論和歷史資料解釋世界經濟事件"
    ja: "理論と歴史データで世界の出来事を説明する"
    ko: "이론과 역사 자료로 세계 사건 설명"
    vi: "Dùng lý thuyết và dữ liệu lịch sử giải thích sự kiện"
    ms: "Guna teori dan data sejarah untuk terangkan peristiwa dunia"
    id: "Memakai teori dan data sejarah untuk menjelaskan peristiwa dunia"
    hi: "सिद्धांत और ऐतिहासिक डेटा से विश्व की घटनाएँ समझाना"
  - en: "Explain trade, comparative advantage and economic growth"
    zh: "解释贸易、比较优势和经济增长"
    zh-TW: "說明貿易、比較利益和經濟成長"
    ja: "貿易、比較優位、経済成長を説明する"
    ko: "무역, 비교우위, 경제성장 설명"
    vi: "Giải thích thương mại, lợi thế so sánh và tăng trưởng"
    ms: "Terangkan perdagangan, kelebihan bandingan dan pertumbuhan"
    id: "Menjelaskan perdagangan, keunggulan komparatif, dan pertumbuhan"
    hi: "व्यापार, तुलनात्मक लाभ और आर्थिक वृद्धि समझाना"
