code: ASIA20008
year: 2026
learn:
  en: "How digital technology, from social media to platforms and AI, is changing Asian societies and their links with the world."
  zh: "从社交媒体到平台和人工智能，数字技术如何改变亚洲社会及其与世界的联系。"
  zh-TW: "從社群媒體到平台和人工智慧，數位科技如何改變亞洲社會及其與世界的聯繫。"
  ja: "SNSからプラットフォーム、AIまで、デジタル技術がアジア社会と世界とのつながりをどう変えているかを学ぶ。"
  ko: "소셜미디어부터 플랫폼, AI까지 디지털 기술이 아시아 사회와 세계와의 연결을 어떻게 바꾸는지 배운다."
  vi: "Công nghệ số, từ mạng xã hội đến nền tảng và AI, đang thay đổi xã hội châu Á và mối liên hệ với thế giới ra sao."
  ms: "Cara teknologi digital, daripada media sosial hingga platform dan AI, mengubah masyarakat Asia dan hubungannya dengan dunia."
  id: "Cara teknologi digital, dari media sosial hingga platform dan AI, mengubah masyarakat Asia dan hubungannya dengan dunia."
  hi: "सोशल मीडिया से प्लेटफ़ॉर्म और AI तक, डिजिटल तकनीक एशियाई समाजों और दुनिया से उनके रिश्तों को कैसे बदल रही है।"
outcomes:
  - en: "Describe major digital trends in Asia"
    zh: "描述亚洲主要的数字趋势"
    zh-TW: "描述亞洲主要的數位趨勢"
    ja: "アジアの主なデジタル動向を説明する"
    ko: "아시아의 주요 디지털 흐름 설명하기"
    vi: "Mô tả các xu hướng số chính ở châu Á"
    ms: "Huraikan trend digital utama di Asia"
    id: "Mendeskripsikan tren digital utama di Asia"
    hi: "एशिया के मुख्य डिजिटल रुझानों का वर्णन करना"
  - en: "Analyse social effects of new technologies"
    zh: "分析新技术的社会影响"
    zh-TW: "分析新科技的社會影響"
    ja: "新技術の社会的影響を分析する"
    ko: "신기술의 사회적 영향 분석하기"
    vi: "Phân tích tác động xã hội của công nghệ mới"
    ms: "Analisis kesan sosial teknologi baharu"
    id: "Menganalisis dampak sosial teknologi baru"
    hi: "नई तकनीकों के सामाजिक प्रभाव का विश्लेषण करना"
  - en: "Compare digital cultures across Asian countries"
    zh: "比较亚洲各国的数字文化"
    zh-TW: "比較亞洲各國的數位文化"
    ja: "アジア各国のデジタル文化を比べる"
    ko: "아시아 국가 간 디지털 문화 비교하기"
    vi: "So sánh văn hóa số giữa các nước châu Á"
    ms: "Bandingkan budaya digital antara negara Asia"
    id: "Membandingkan budaya digital antarnegara Asia"
