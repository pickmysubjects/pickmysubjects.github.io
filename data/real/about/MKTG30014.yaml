code: MKTG30014
year: 2026
learn:
  en: "Using customer and sales data to make marketing decisions, from segmenting customers to measuring results."
  zh: "用顾客和销售数据做营销决策，从客户细分到衡量效果。"
  zh-TW: "用顧客和銷售資料做行銷決策，從客群區隔到衡量成效。"
  ja: "顧客・販売データでマーケティングの判断をする。セグメント化から効果測定まで。"
  ko: "고객·판매 데이터로 마케팅 결정 내리기: 고객 세분화부터 성과 측정까지."
  vi: "Dùng dữ liệu khách hàng và bán hàng để ra quyết định marketing, từ phân khúc đến đo lường kết quả."
  ms: "Guna data pelanggan dan jualan untuk keputusan pemasaran, dari segmentasi pelanggan hingga ukur hasil."
  id: "Memakai data pelanggan dan penjualan untuk keputusan pemasaran, dari segmentasi hingga mengukur hasil."
  hi: "ग्राहक और बिक्री डेटा से मार्केटिंग फ़ैसले, ग्राहकों को बाँटने से लेकर नतीजे मापने तक।"
outcomes:
  - en: "Segment customers and target them with data"
    zh: "用数据细分并锁定客户"
    zh-TW: "用資料區隔並鎖定客群"
    ja: "データで顧客を分類しターゲットを定める"
    ko: "데이터로 고객 세분화하고 타기팅하기"
    vi: "Phân khúc và nhắm khách hàng bằng dữ liệu"
    ms: "Segmentasi dan sasarkan pelanggan dengan data"
    id: "Menyegmentasi dan menargetkan pelanggan dengan data"
    hi: "डेटा से ग्राहकों को बाँटना और टार्गेट करना"
  - en: "Measure what works with marketing mix modelling"
    zh: "用营销组合模型衡量效果"
    zh-TW: "用行銷組合模型衡量成效"
    ja: "マーケティング・ミックス・モデリングで効果を測る"
    ko: "마케팅 믹스 모델링으로 효과 측정하기"
    vi: "Đo hiệu quả bằng mô hình marketing mix"
    ms: "Ukur keberkesanan dengan pemodelan campuran pemasaran"
    id: "Mengukur efektivitas dengan pemodelan bauran pemasaran"
    hi: "मार्केटिंग मिक्स मॉडलिंग से असर मापना"
  - en: "Handle customer data ethically and privately"
    zh: "以合乎伦理、保护隐私的方式处理客户数据"
    zh-TW: "以合乎倫理、保護隱私的方式處理顧客資料"
    ja: "顧客データを倫理的にプライバシーに配慮して扱う"
    ko: "고객 데이터를 윤리적으로, 사생활을 지켜 다루기"
    vi: "Xử lý dữ liệu khách hàng có đạo đức, bảo mật"
    ms: "Urus data pelanggan secara beretika dan sulit"
    id: "Mengelola data pelanggan secara etis dan menjaga privasi"
    hi: "ग्राहक डेटा को नैतिक और निजी तरीके से संभालना"
