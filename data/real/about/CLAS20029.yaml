code: CLAS20029
year: 2026
learn:
  en: "Roman oratory through a speech such as one by Cicero, plus grammar review, and how rhetoric shaped Roman politics."
  zh: "通过西塞罗等人的演说学习罗马演说术，复习语法，并了解修辞在罗马政治中的作用。"
  zh-TW: "透過西塞羅等人的演說學習羅馬演說術，複習文法，並了解修辭在羅馬政治中的作用。"
  ja: "キケロなどの演説を通してローマの弁論術を学び、文法を復習し、修辞がローマ政治で果たした役割を知る。"
  ko: "키케로 등의 연설로 로마 웅변술을 배우고 문법을 복습하며 수사학이 로마 정치에서 한 역할을 살핀다."
  vi: "Thuật hùng biện La Mã qua một bài diễn văn như của Cicero, ôn ngữ pháp, và vai trò của tu từ trong chính trị La Mã."
  ms: "Pidato Rom melalui ucapan seperti karya Cicero, ulang kaji tatabahasa, dan peranan retorik dalam politik Rom."
  id: "Seni pidato Romawi lewat pidato seperti karya Cicero, pengulangan tata bahasa, dan peran retorika dalam politik Romawi."
  hi: "सिसेरो जैसे किसी भाषण से रोमन वक्तृत्व कला, व्याकरण की दोहराई, और रोमन राजनीति में अलंकार-शास्त्र की भूमिका।"
outcomes:
  - en: "Read original Latin texts with some dictionary help"
    zh: "借助词典阅读拉丁语原文"
    zh-TW: "藉助詞典閱讀拉丁語原文"
    ja: "辞書を使ってラテン語の原典を読む"
    ko: "사전을 활용해 라틴어 원문 읽기"
    vi: "Đọc nguyên bản tiếng Latinh với sự hỗ trợ của từ điển"
    ms: "Baca teks asal bahasa Latin dengan bantuan kamus"
    id: "Membaca teks asli bahasa Latin dengan bantuan kamus"
    hi: "शब्दकोश की मदद से मूल लैटिन पाठ पढ़ना"
  - en: "Analyse complex Latin grammar and sentence structure"
    zh: "分析复杂的拉丁语语法和句子结构"
    zh-TW: "分析複雜的拉丁語文法和句子結構"
    ja: "ラテン語の複雑な文法と構文を分析する"
    ko: "복잡한 라틴어 문법과 문장 구조 분석하기"
    vi: "Phân tích ngữ pháp và cấu trúc câu tiếng Latinh phức tạp"
    ms: "Analisis tatabahasa dan struktur ayat bahasa Latin yang kompleks"
    id: "Menganalisis tata bahasa dan struktur kalimat bahasa Latin yang rumit"
    hi: "जटिल लैटिन व्याकरण और वाक्य-रचना का विश्लेषण करना"
  - en: "Translate and interpret ancient literature"
    zh: "翻译并解读古代文学作品"
    zh-TW: "翻譯並解讀古代文學作品"
    ja: "古代の文学作品を訳し解釈する"
    ko: "고대 문학 작품 번역하고 해석하기"
    vi: "Dịch và diễn giải văn học cổ đại"
    ms: "Terjemah dan tafsir karya sastera kuno"
    id: "Menerjemahkan dan menafsirkan karya sastra kuno"
    hi: "प्राचीन साहित्य का अनुवाद और व्याख्या करना"
