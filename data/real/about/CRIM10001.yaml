code: CRIM10001
year: 2026
learn:
  en: "What counts as crime, why people offend, and how society and the justice system respond, with a focus on Australia."
  zh: "什么算犯罪、人为什么犯罪，以及社会和司法系统怎么应对，重点看澳大利亚。"
  zh-TW: "什麼算犯罪、人為什麼犯罪，以及社會和司法體系怎麼因應，重點看澳洲。"
  ja: "何が犯罪とされるのか、人はなぜ罪を犯すのか、社会と司法はどう対応するのかを、オーストラリアを中心に学ぶ。"
  ko: "무엇이 범죄인지, 사람은 왜 범죄를 저지르는지, 사회와 사법 제도는 어떻게 대응하는지 호주를 중심으로 배운다."
  vi: "Thế nào là tội phạm, vì sao con người phạm tội và xã hội, tư pháp phản ứng ra sao, tập trung vào Úc."
  ms: "Apa yang dikira jenayah, kenapa orang melakukannya, dan bagaimana masyarakat serta sistem keadilan bertindak balas, dengan fokus Australia."
  id: "Apa yang disebut kejahatan, kenapa orang melakukannya, dan bagaimana masyarakat serta sistem peradilan menanganinya, dengan fokus Australia."
  hi: "अपराध किसे कहते हैं, लोग अपराध क्यों करते हैं और समाज व न्याय व्यवस्था कैसे जवाब देती है, ऑस्ट्रेलिया पर ध्यान के साथ।"
outcomes:
  - en: "Use the key terms and theories of criminology"
    zh: "掌握犯罪学的核心概念和理论"
    zh-TW: "掌握犯罪學的核心概念和理論"
    ja: "犯罪学の主要な用語と理論を使いこなす"
    ko: "범죄학의 핵심 용어와 이론 활용하기"
    vi: "Dùng các khái niệm và lý thuyết chính của tội phạm học"
    ms: "Guna istilah dan teori utama kriminologi"
    id: "Memakai istilah dan teori utama kriminologi"
    hi: "क्रिमिनोलॉजी के मुख्य शब्द और सिद्धांत इस्तेमाल करना"
  - en: "Explain how labelling acts as crime affects different groups"
    zh: "说明把行为定为犯罪对不同群体的影响"
    zh-TW: "說明把行為定為犯罪對不同群體的影響"
    ja: "行為を犯罪とみなすことが集団ごとにどう影響するか説明する"
    ko: "어떤 행위를 범죄로 규정하는 것이 집단별로 미치는 영향 설명하기"
    vi: "Giải thích việc hình sự hóa ảnh hưởng thế nào đến các nhóm khác nhau"
    ms: "Terangkan kesan menjadikan sesuatu jenayah kepada kumpulan berbeza"
    id: "Menjelaskan dampak kriminalisasi bagi kelompok yang berbeda"
    hi: "समझाना कि किसी काम को अपराध घोषित करने का अलग-अलग समूहों पर क्या असर पड़ता है"
  - en: "Question how crime is measured and recorded"
    zh: "审视犯罪是怎么被统计和记录的"
    zh-TW: "審視犯罪是怎麼被統計和記錄的"
    ja: "犯罪の測り方や記録のされ方を検討する"
    ko: "범죄가 측정되고 기록되는 방식 따져 보기"
    vi: "Đặt câu hỏi về cách đo lường và ghi nhận tội phạm"
    ms: "Persoalkan cara jenayah diukur dan direkod"
    id: "Mengkritisi cara kejahatan diukur dan dicatat"
    hi: "अपराध को कैसे मापा और दर्ज किया जाता है, इस पर सवाल उठाना"
