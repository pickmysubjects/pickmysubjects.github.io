code: AGRI10052
year: 2026
learn:
  en: "How traits pass from parents to offspring in crops and farm animals, and how breeders use genetics to improve them."
  zh: "作物和农场动物的性状如何遗传，以及育种者如何用遗传学改良它们。"
  zh-TW: "作物和農場動物的性狀如何遺傳，以及育種者如何用遺傳學改良牠們。"
  ja: "作物や家畜の形質が親から子へどう伝わるか、育種家が遺伝学で改良する方法を学ぶ。"
  ko: "작물과 가축의 형질이 어떻게 유전되는지, 육종가가 유전학으로 어떻게 개량하는지 배운다."
  vi: "Tính trạng ở cây trồng và vật nuôi di truyền thế nào, và nhà chọn giống dùng di truyền học để cải thiện chúng ra sao."
  ms: "Cara sifat tanaman dan haiwan ternakan diwarisi, dan cara pembiak baka guna genetik untuk memperbaikinya."
  id: "Bagaimana sifat tanaman dan ternak diwariskan, dan cara pemulia memakai genetika untuk memperbaikinya."
  hi: "फसलों और खेत के पशुओं में गुण कैसे विरासत में मिलते हैं, और प्रजनक जेनेटिक्स से उन्हें कैसे सुधारते हैं।"
outcomes:
  - en: "Explain Mendel's laws, linkage and gene mapping"
    zh: "讲清孟德尔定律、连锁与基因定位"
    zh-TW: "講清孟德爾定律、連鎖與基因定位"
    ja: "メンデルの法則、連鎖、遺伝子地図を説明する"
    ko: "멘델 법칙, 연관, 유전자 지도 설명하기"
    vi: "Giải thích định luật Mendel, liên kết gen và lập bản đồ gen"
    ms: "Terangkan hukum Mendel, rangkaian dan pemetaan gen"
    id: "Menjelaskan hukum Mendel, pautan, dan pemetaan gen"
    hi: "मेंडल के नियम, लिंकेज और जीन मैपिंग समझाना"
  - en: "Work out gene and genotype frequencies in a population"
    zh: "计算群体中的基因和基因型频率"
    zh-TW: "計算族群中的基因和基因型頻率"
    ja: "集団の遺伝子頻度と遺伝子型頻度を計算する"
    ko: "집단의 유전자·유전자형 빈도 계산하기"
    vi: "Tính tần số gen và kiểu gen trong quần thể"
    ms: "Kira frekuensi gen dan genotip dalam populasi"
    id: "Menghitung frekuensi gen dan genotipe dalam populasi"
    hi: "किसी आबादी में जीन और जीनोटाइप की आवृत्ति निकालना"
  - en: "Compare conventional and molecular breeding methods"
    zh: "比较传统育种和分子育种方法"
    zh-TW: "比較傳統育種和分子育種方法"
    ja: "従来育種と分子育種の方法を比べる"
    ko: "전통 육종과 분자 육종 방법 비교하기"
    vi: "So sánh phương pháp chọn giống truyền thống và phân tử"
    ms: "Bandingkan kaedah pembiakbakaan konvensional dan molekul"
    id: "Membandingkan pemuliaan konvensional dan molekuler"
    hi: "पारंपरिक और मॉलिक्यूलर प्रजनन तरीकों की तुलना करना"
