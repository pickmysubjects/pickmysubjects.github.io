code: ABPL90450
year: 2027
learn:
  en: "A studio comparing Indonesian and Australian cities to learn from local responses to climate, inequality and informality."
  zh: "比较印尼与澳大利亚城市，学习各地应对气候、不平等和非正规性的做法。"
  zh-TW: "比較印尼與澳洲城市，學習各地因應氣候、不平等和非正規性的做法。"
  ja: "インドネシアと豪州の都市を比べ、気候・格差・インフォーマル性への地域の対応を学ぶ。"
  ko: "인도네시아와 호주 도시를 비교해 기후, 불평등, 비공식성에 대한 지역 대응을 배웁니다."
  vi: "So sánh đô thị Indonesia và Úc để học cách địa phương ứng phó khí hậu, bất bình đẳng."
  ms: "Studio membandingkan bandar Indonesia dan Australia tentang iklim, ketaksamaan dan informaliti."
  id: "Studio membandingkan kota Indonesia dan Australia soal iklim, ketimpangan, dan informalitas."
  hi: "इंडोनेशियाई और ऑस्ट्रेलियाई शहरों की तुलना कर जलवायु, असमानता और अनौपचारिकता पर स्थानीय उपाय सीखना।"
outcomes:
  - en: "Compare formal and informal urban dynamics"
    zh: "比较正规与非正规的城市动态"
    zh-TW: "比較正規與非正規的城市動態"
    ja: "フォーマルとインフォーマルな都市動態を比べる"
    ko: "공식·비공식 도시 역학 비교하기"
    vi: "So sánh động lực đô thị chính thức và phi chính thức"
    ms: "Membandingkan dinamik bandar formal dan tidak formal"
    id: "Membandingkan dinamika kota formal dan informal"
    hi: "औपचारिक और अनौपचारिक शहरी गतिशीलता की तुलना"
  - en: "Do fieldwork and report on it"
    zh: "开展实地调查并撰写报告"
    zh-TW: "進行實地調查並撰寫報告"
    ja: "現地調査を行い報告する"
    ko: "현장조사하고 보고하기"
    vi: "Thực địa và viết báo cáo"
    ms: "Menjalankan kerja lapangan dan melapor"
    id: "Melakukan kerja lapangan dan melaporkannya"
    hi: "फ़ील्डवर्क करना और रिपोर्ट देना"
