code: PSYC20006
year: 2026
learn:
  en: "How the brain produces behaviour, from neurons and brain chemicals up to thinking, plus stats for research."
  zh: "大脑怎么产生行为，从神经元到思维，还有研究用的统计。"
  zh-TW: "大腦怎麼產生行為，從神經元到思維，還有研究用的統計。"
  ja: "脳がどう行動を生むか。ニューロンと脳内物質から思考まで、研究用の統計も。"
  ko: "뇌가 행동을 만드는 방식, 뉴런과 뇌 화학물질부터 사고까지, 연구용 통계 포함."
  vi: "Não tạo ra hành vi ra sao, từ nơ-ron và hóa chất não đến tư duy, kèm thống kê cho nghiên cứu."
  ms: "Cara otak menghasilkan tingkah laku, dari neuron dan bahan kimia otak hingga pemikiran, serta statistik kajian."
  id: "Cara otak menghasilkan perilaku, dari neuron dan zat kimia otak sampai berpikir, plus statistik riset."
  hi: "दिमाग व्यवहार कैसे बनाता है, न्यूरॉन और ब्रेन केमिकल्स से सोच तक, साथ में रिसर्च के लिए स्टैट्स।"
outcomes:
  - en: "Explain how the brain controls behaviour"
    zh: "解释大脑怎么控制行为"
    zh-TW: "解釋大腦怎麼控制行為"
    ja: "脳が行動をどう制御するか説明する"
    ko: "뇌가 행동을 어떻게 조절하는지 설명"
    vi: "Giải thích não điều khiển hành vi ra sao"
    ms: "Terangkan cara otak mengawal tingkah laku"
    id: "Menjelaskan cara otak mengendalikan perilaku"
    hi: "दिमाग व्यवहार को कैसे नियंत्रित करता है, समझाना"
  - en: "Analyse and interpret brain and behaviour data"
    zh: "分析和解读脑与行为的数据"
    zh-TW: "分析和解讀腦與行為的數據"
    ja: "脳と行動のデータを分析・解釈する"
    ko: "뇌와 행동 데이터 분석·해석"
    vi: "Phân tích và giải thích dữ liệu về não và hành vi"
    ms: "Analisis dan tafsir data otak dan tingkah laku"
    id: "Menganalisis dan menafsirkan data otak dan perilaku"
    hi: "दिमाग और व्यवहार के डेटा का विश्लेषण व व्याख्या"
  - en: "Write up research findings clearly"
    zh: "把研究结果写清楚"
    zh-TW: "把研究結果寫清楚"
    ja: "研究結果をわかりやすくまとめる"
    ko: "연구 결과를 명확하게 작성"
    vi: "Viết kết quả nghiên cứu rõ ràng"
    ms: "Tulis dapatan kajian dengan jelas"
    id: "Menulis temuan riset dengan jelas"
    hi: "रिसर्च के नतीजे साफ़ लिखना"
