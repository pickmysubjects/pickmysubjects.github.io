code: ABPL90208
year: 2027
learn:
  en: "Measuring commercial building works from a 3D BIM model and pricing projects with unit rates in CostX."
  zh: "基于三维BIM模型计量商业建筑工程，并在CostX中用单价为项目估价。"
  zh-TW: "以三維BIM模型計量商業建築工程，並在CostX中以單價為專案估價。"
  ja: "3D BIMモデルから商業建築工事を積算し、CostXで単価による見積りを行う。"
  ko: "3D BIM 모델로 상업용 건축 공사를 적산하고 CostX에서 단가로 견적을 냅니다."
  vi: "Đo bóc khối lượng công trình thương mại từ mô hình BIM 3D và lập giá bằng CostX."
  ms: "Mengukur kerja bangunan komersial daripada model BIM 3D dan menentukan harga dengan CostX."
  id: "Mengukur pekerjaan bangunan komersial dari model BIM 3D dan menaksir harga dengan CostX."
  hi: "3D BIM मॉडल से वाणिज्यिक भवन कार्य मापना और CostX में यूनिट रेट से मूल्य निर्धारण।"
outcomes:
  - en: "Develop a 3D BIM for a commercial building"
    zh: "为商业建筑建立三维BIM模型"
    zh-TW: "為商業建築建立三維BIM模型"
    ja: "商業建築の3D BIMを作成する"
    ko: "상업용 건물의 3D BIM 만들기"
    vi: "Xây dựng mô hình BIM 3D cho tòa nhà"
    ms: "Membangunkan BIM 3D untuk bangunan komersial"
    id: "Membuat BIM 3D untuk bangunan komersial"
    hi: "वाणिज्यिक भवन का 3D BIM बनाना"
  - en: "Estimate unit rates and price a project"
    zh: "估算单价并为项目定价"
    zh-TW: "估算單價並為專案定價"
    ja: "単価を見積もりプロジェクトを価格設定する"
    ko: "단가를 산정하고 프로젝트 가격 매기기"
    vi: "Ước tính đơn giá và lập giá dự án"
    ms: "Menganggar kadar unit dan harga projek"
    id: "Menaksir harga satuan dan harga proyek"
    hi: "यूनिट रेट आंकना और परियोजना मूल्य तय करना"
