code: MAST90107
year: 2027
learn:
  en: "Second half of the Data Science capstone: the same team carries out its project and presents results to clients."
  zh: "数据科学毕业项目下半部分：原小组执行项目，并向客户汇报成果。"
  zh-TW: "資料科學畢業專題下半：原小組執行專案，並向客戶報告成果。"
  ja: "データサイエンス修了プロジェクト後半：同じチームで実行し、顧客に成果を発表。"
  ko: "데이터 과학 캡스톤 후반부: 같은 팀이 프로젝트를 수행하고 고객에게 발표."
  vi: "Nửa sau dự án tốt nghiệp Khoa học Dữ liệu: nhóm thực hiện dự án và trình bày cho khách hàng."
  ms: "Separuh kedua projek akhir Sains Data: pasukan sama melaksanakan projek dan membentang kepada klien."
  id: "Paruh kedua capstone Sains Data: tim yang sama menjalankan proyek dan mempresentasikan ke klien."
  hi: "डेटा साइंस कैपस्टोन का दूसरा भाग: वही टीम प्रोजेक्ट पूरा कर क्लाइंट को नतीजे दिखाती है।"
outcomes:
  - en: "Deliver sound data science results as a team"
    zh: "作为团队交付可靠的数据科学成果"
    zh-TW: "以團隊交付可靠的資料科學成果"
    ja: "チームで確かな分析結果を出す"
    ko: "팀으로 정확한 데이터 과학 결과 내기"
    vi: "Cùng nhóm đưa ra kết quả dữ liệu đáng tin cậy"
    ms: "Menghasilkan dapatan sains data yang betul sebagai pasukan"
    id: "Menghasilkan hasil sains data yang benar bersama tim"
    hi: "टीम के रूप में सही डेटा साइंस नतीजे देना"
  - en: "Present results in a way clients can use"
    zh: "以客户能用的方式呈现结果"
    zh-TW: "以客戶能用的方式呈現成果"
    ja: "顧客が使える形で結果を伝える"
    ko: "고객이 활용할 수 있게 결과 발표하기"
    vi: "Trình bày kết quả để khách hàng dùng được"
    ms: "Membentangkan dapatan dalam bentuk berguna kepada klien"
    id: "Menyajikan hasil agar bisa dipakai klien"
    hi: "नतीजे ऐसे पेश करना कि क्लाइंट उपयोग कर सके"
