code: MUSI20156
year: 2026
learn:
  en: "How the body and acoustics make a classical singing sound, explored in lectures and hands-on voice work."
  zh: "古典歌唱声音背后的生理与声学原理，通过讲课和实践练习探索。"
  zh-TW: "古典歌唱聲音背後的生理與聲學原理，透過講課和實作練習探索。"
  ja: "クラシック発声を生む身体と音響の仕組みを講義と実習で学ぶ。"
  ko: "클래식 발성을 만드는 신체와 음향 원리를 강의와 실습으로 탐구한다."
  vi: "Cơ thể và âm học tạo nên giọng hát cổ điển, học qua giảng và thực hành."
  ms: "Bagaimana badan dan akustik menghasilkan suara nyanyian klasik, melalui kuliah dan amali."
  id: "Cara tubuh dan akustik membentuk suara nyanyi klasik, lewat kuliah dan praktik."
  hi: "शास्त्रीय गायन की आवाज़ के पीछे शरीर और ध्वनिकी, व्याख्यान व अभ्यास से।"
outcomes:
  - en: "Explain the basic acoustics and physiology of singing"
    zh: "解释歌唱的基本声学与生理原理"
    zh-TW: "解釋歌唱的基本聲學與生理原理"
    ja: "歌唱の音響・生理の基本を説明する"
    ko: "노래의 기본 음향·생리 원리 설명하기"
    vi: "Giải thích âm học và sinh lý cơ bản của ca hát"
    ms: "Terangkan akustik dan fisiologi asas nyanyian"
    id: "Menjelaskan akustik dan fisiologi dasar bernyanyi"
    hi: "गायन की बुनियादी ध्वनिकी और शरीर-क्रिया समझाना"
  - en: "Link vocal technique to how the body works"
    zh: "把发声技巧与身体运作联系起来"
    zh-TW: "把發聲技巧與身體運作聯繫起來"
    ja: "発声技術と身体の働きを結びつける"
    ko: "발성 기술을 몸의 작동과 연결하기"
    vi: "Liên hệ kỹ thuật thanh nhạc với cơ thể"
    ms: "Kaitkan teknik vokal dengan fungsi badan"
    id: "Mengaitkan teknik vokal dengan kerja tubuh"
    hi: "गायन तकनीक को शरीर की कार्यप्रणाली से जोड़ना"
  - en: "Read and use current voice science research"
    zh: "阅读并运用当前嗓音科学研究"
    zh-TW: "閱讀並運用當前嗓音科學研究"
    ja: "最新の音声科学研究を読み活用する"
    ko: "최신 음성 과학 연구 읽고 활용하기"
    vi: "Đọc và dùng nghiên cứu khoa học giọng nói mới"
    ms: "Baca dan guna kajian sains suara terkini"
    id: "Membaca dan memakai riset ilmu suara terkini"
    hi: "आवाज़ विज्ञान के ताज़ा शोध पढ़ना और उपयोग करना"
