code: JAPN10002
year: 2026
learn:
  en: "Continues from Japanese 1: about 100 more kanji, everyday conversation and simple writing about your life."
  zh: "接日语1：再学约100个汉字，日常会话和简单的叙述写作。"
  zh-TW: "接續日語1：再學約100個漢字、日常會話和簡單的生活寫作。"
  ja: "日本語1の続き：さらに漢字約100字、日常会話、自分の生活についての簡単な作文。"
  ko: "일본어 1에 이어서: 한자 약 100자 추가, 일상 회화, 자기 생활에 대한 간단한 글쓰기."
  vi: "Tiếp nối Tiếng Nhật 1: thêm khoảng 100 kanji, hội thoại hằng ngày và viết đơn giản về cuộc sống."
  ms: "Sambungan Bahasa Jepun 1: kira-kira 100 kanji lagi, perbualan harian dan penulisan ringkas tentang hidup anda."
  id: "Lanjutan Bahasa Jepang 1: sekitar 100 kanji lagi, percakapan sehari-hari, dan menulis sederhana tentang hidupmu."
  hi: "जापानी 1 के आगे: लगभग 100 और कांजी, रोज़ की बातचीत और अपनी ज़िंदगी पर सरल लेखन।"
outcomes:
  - en: "Make and answer requests and offers"
    zh: "提出和回应请求、邀请"
    zh-TW: "提出和回應請求、邀約"
    ja: "依頼や申し出をし、それに答える"
    ko: "부탁과 제안을 하고 답하기"
    vi: "Đưa ra và đáp lại lời nhờ, lời mời"
    ms: "Buat dan jawab permintaan serta tawaran"
    id: "Membuat dan menjawab permintaan serta tawaran"
    hi: "अनुरोध और पेशकश करना व उनका जवाब देना"
  - en: "Describe people, places and past events"
    zh: "描述人、地点和经历"
    zh-TW: "描述人、地點和經歷"
    ja: "人・場所・過去の出来事を描写する"
    ko: "사람, 장소, 지난 일 묘사"
    vi: "Miêu tả người, nơi chốn và chuyện đã qua"
    ms: "Huraikan orang, tempat dan peristiwa lalu"
    id: "Menggambarkan orang, tempat, dan kejadian lampau"
    hi: "लोगों, जगहों और बीती घटनाओं का वर्णन"
  - en: "Talk about weather and health"
    zh: "聊天气和健康"
    zh-TW: "聊天氣和健康"
    ja: "天気や健康について話す"
    ko: "날씨와 건강에 대해 말하기"
    vi: "Nói về thời tiết và sức khỏe"
    ms: "Berbual tentang cuaca dan kesihatan"
    id: "Membicarakan cuaca dan kesehatan"
    hi: "मौसम और सेहत पर बात करना"
