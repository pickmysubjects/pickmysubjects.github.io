code: INDO10013
year: 2026
learn:
  en: "Translating between Indonesian and English, both ways, with texts like speeches and news, plus key ideas in translation theory."
  zh: "印尼语与英语互译练习，材料包括演讲和新闻等，并介绍翻译理论的核心概念。"
  zh-TW: "印尼語與英語互譯練習，材料包括演講和新聞等，並介紹翻譯理論的核心概念。"
  ja: "インドネシア語と英語の双方向翻訳を演説やニュースなどで練習し、翻訳理論の基本も学ぶ。"
  ko: "인도네시아어와 영어를 양방향으로 번역하며 연설·뉴스 등을 다루고 번역 이론의 핵심도 배운다."
  vi: "Dịch qua lại giữa tiếng Indonesia và tiếng Anh với bài phát biểu, tin tức…, cùng các ý chính trong lý thuyết dịch."
  ms: "Menterjemah antara bahasa Indonesia dan Inggeris, dua hala, dengan teks seperti ucapan dan berita, serta teori terjemahan."
  id: "Menerjemahkan bahasa Indonesia dan Inggris bolak-balik, dengan teks seperti pidato dan berita, plus gagasan utama teori terjemahan."
  hi: "इंडोनेशियाई और अंग्रेज़ी के बीच दोनों ओर अनुवाद, भाषण और ख़बर जैसे पाठों से, साथ में अनुवाद सिद्धांत के मुख्य विचार।"
outcomes:
  - en: "Translate texts between Indonesian and English"
    zh: "在印尼语和英语之间翻译文本"
    zh-TW: "在印尼語和英語之間翻譯文本"
    ja: "インドネシア語と英語の間で文章を訳す"
    ko: "인도네시아어와 영어 사이에서 글 번역하기"
    vi: "Dịch văn bản giữa tiếng Indonesia và tiếng Anh"
    ms: "Terjemah teks antara bahasa Indonesia dan Inggeris"
    id: "Menerjemahkan teks antara bahasa Indonesia dan Inggris"
    hi: "इंडोनेशियाई और अंग्रेज़ी के बीच पाठों का अनुवाद करना"
  - en: "Spot cultural gaps that make translation hard"
    zh: "识别造成翻译困难的文化差异"
    zh-TW: "識別造成翻譯困難的文化差異"
    ja: "翻訳を難しくする文化の違いに気づく"
    ko: "번역을 어렵게 하는 문화 차이 찾아내기"
    vi: "Nhận ra khác biệt văn hóa khiến việc dịch khó"
    ms: "Kenal pasti jurang budaya yang menyukarkan terjemahan"
    id: "Mengenali perbedaan budaya yang menyulitkan terjemahan"
    hi: "अनुवाद को मुश्किल बनाने वाले सांस्कृतिक अंतर पहचानना"
  - en: "Compare and critique existing translations"
    zh: "比较并评析已有译文"
    zh-TW: "比較並評析已有譯文"
    ja: "既存の翻訳を比べて批評する"
    ko: "기존 번역을 비교하고 평가하기"
    vi: "So sánh và nhận xét các bản dịch có sẵn"
    ms: "Banding dan kritik terjemahan sedia ada"
    id: "Membandingkan dan mengkritisi terjemahan yang ada"
    hi: "मौजूदा अनुवादों की तुलना और समीक्षा करना"
