code: ABPL90324
year: 2027
learn:
  en: "Engineering materials, statics, mechanics and structural systems in timber, concrete and steel, for students new to engineering."
  zh: "为没有工程背景的学生介绍工程材料、静力学、力学，以及木、混凝土和钢结构体系。"
  zh-TW: "為沒有工程背景的學生介紹工程材料、靜力學、力學，以及木、混凝土與鋼結構系統。"
  ja: "工学未経験者向けに、材料、静力学、力学、木・コンクリート・鉄骨の構造を学ぶ。"
  ko: "공학 비전공자를 위한 공학 재료, 정역학, 역학, 목·콘크리트·철골 구조 시스템."
  vi: "Vật liệu, tĩnh học, cơ học và hệ kết cấu gỗ, bê tông, thép cho người mới học kỹ thuật."
  ms: "Bahan kejuruteraan, statik, mekanik dan sistem struktur kayu, konkrit dan keluli untuk pelajar baharu."
  id: "Material teknik, statika, mekanika, dan sistem struktur kayu, beton, baja untuk pemula."
  hi: "इंजीनियरिंग में नए छात्रों के लिए सामग्री, स्टैटिक्स, यांत्रिकी और लकड़ी-कंक्रीट-स्टील संरचनाएं।"
outcomes:
  - en: "Evaluate how loads affect structural systems"
    zh: "评估荷载对结构体系的影响"
    zh-TW: "評估荷載對結構系統的影響"
    ja: "荷重が構造に与える影響を評価する"
    ko: "하중이 구조에 미치는 영향 평가하기"
    vi: "Đánh giá tác động của tải trọng lên kết cấu"
    ms: "Menilai kesan beban pada sistem struktur"
    id: "Menilai pengaruh beban pada sistem struktur"
    hi: "भार का संरचना पर प्रभाव आंकना"
  - en: "Learn basic reinforced concrete design"
    zh: "掌握钢筋混凝土设计基础"
    zh-TW: "掌握鋼筋混凝土設計基礎"
    ja: "鉄筋コンクリート設計の基本を学ぶ"
    ko: "철근콘크리트 설계 기초 익히기"
    vi: "Nắm cơ bản thiết kế bê tông cốt thép"
    ms: "Mempelajari asas reka bentuk konkrit bertetulang"
    id: "Mempelajari dasar desain beton bertulang"
    hi: "प्रबलित कंक्रीट डिज़ाइन की मूल बातें"
