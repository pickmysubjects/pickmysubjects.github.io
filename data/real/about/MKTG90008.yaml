code: MKTG90008
year: 2027
learn:
  en: "Why people buy, use and dispose of products: psychological, social and cultural factors and consumer research methods."
  zh: "人们为何购买、使用和处置产品：心理、社会和文化因素以及消费者研究方法。"
  zh-TW: "人們為何購買、使用與處置產品：心理、社會與文化因素以及消費者研究方法。"
  ja: "人が製品を買い、使い、手放す理由：心理・社会・文化的要因と消費者調査の手法。"
  ko: "사람들이 제품을 사고 쓰고 버리는 이유: 심리·사회·문화 요인과 소비자 조사 방법."
  vi: "Vì sao người ta mua, dùng, bỏ sản phẩm: yếu tố tâm lý, xã hội, văn hóa và phương pháp nghiên cứu người tiêu dùng."
  ms: "Mengapa orang membeli, menggunakan dan membuang produk: faktor psikologi, sosial, budaya dan kaedah kajian pengguna."
  id: "Mengapa orang membeli, memakai dan membuang produk: faktor psikologis, sosial, budaya dan metode riset konsumen."
  hi: "लोग उत्पाद क्यों खरीदते, इस्तेमाल करते और फेंकते हैं: मनोवैज्ञानिक, सामाजिक, सांस्कृतिक कारक और उपभोक्ता शोध तरीके।"
outcomes:
  - en: "Apply consumer behaviour to marketing choices"
    zh: "将消费者行为用于营销决策"
    zh-TW: "將消費者行為應用於行銷決策"
    ja: "消費者行動をマーケティング判断に活かす"
    ko: "소비자 행동을 마케팅 결정에 적용하기"
    vi: "Áp dụng hành vi người tiêu dùng vào marketing"
    ms: "Guna tingkah laku pengguna dalam keputusan pemasaran"
    id: "Menerapkan perilaku konsumen pada keputusan pemasaran"
    hi: "उपभोक्ता व्यवहार को मार्केटिंग फ़ैसलों में लगाना"
  - en: "Assess consumer research techniques"
    zh: "评估消费者研究方法"
    zh-TW: "評估消費者研究方法"
    ja: "消費者調査の手法を評価する"
    ko: "소비자 조사 기법 평가하기"
    vi: "Đánh giá kỹ thuật nghiên cứu người tiêu dùng"
    ms: "Menilai teknik kajian pengguna"
    id: "Menilai teknik riset konsumen"
    hi: "उपभोक्ता शोध तकनीकों का आकलन करना"
