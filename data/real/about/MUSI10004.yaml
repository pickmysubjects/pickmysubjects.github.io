code: MUSI10004
year: 2026
learn:
  en: "Use notation and MIDI sequencing software to write scores, make parts and arrange music."
  zh: "使用打谱和MIDI音序软件制作乐谱、分谱并编曲。"
  zh-TW: "使用打譜與MIDI音序軟體製作樂譜、分譜並編曲。"
  ja: "記譜ソフトとMIDIシーケンサーで楽譜やパート譜を作り、編曲する。"
  ko: "악보 프로그램과 MIDI 시퀀서로 악보·파트보를 만들고 편곡."
  vi: "Dùng phần mềm ký âm và MIDI để viết tổng phổ, tách bè và phối khí."
  ms: "Guna perisian notasi dan MIDI untuk tulis skor, bahagian dan susunan muzik."
  id: "Memakai perangkat lunak notasi dan MIDI untuk menulis partitur, part dan aransemen."
  hi: "नोटेशन और MIDI सॉफ़्टवेयर से स्कोर, पार्ट और संगीत व्यवस्था बनाना।"
outcomes:
  - en: "Write clear scores in notation software"
    zh: "用打谱软件写出清晰乐谱"
    zh-TW: "用打譜軟體寫出清晰樂譜"
    ja: "記譜ソフトで見やすい楽譜を作る"
    ko: "악보 프로그램으로 깔끔한 악보 쓰기"
    vi: "Viết tổng phổ rõ ràng bằng phần mềm"
    ms: "Tulis skor jelas dengan perisian notasi"
    id: "Menulis partitur rapi dengan software"
    hi: "नोटेशन सॉफ़्टवेयर में साफ़ स्कोर लिखना"
  - en: "Set up and use a simple MIDI system"
    zh: "搭建并使用简单的MIDI系统"
    zh-TW: "架設並使用簡單的MIDI系統"
    ja: "簡単なMIDI環境を組んで使う"
    ko: "간단한 MIDI 시스템 구성·사용하기"
    vi: "Lắp và dùng hệ thống MIDI đơn giản"
    ms: "Pasang dan guna sistem MIDI ringkas"
    id: "Menyiapkan dan memakai sistem MIDI"
    hi: "सरल MIDI सिस्टम लगाना और चलाना"
  - en: "Arrange music with sequencing software"
    zh: "用音序软件编曲"
    zh-TW: "用音序軟體編曲"
    ja: "シーケンサーで編曲する"
    ko: "시퀀서로 편곡하기"
    vi: "Phối khí bằng phần mềm sequencing"
    ms: "Susun muzik dengan perisian penjujuk"
    id: "Mengaransemen musik dengan sequencer"
    hi: "सीक्वेंसिंग सॉफ़्टवेयर से संगीत व्यवस्थित करना"
