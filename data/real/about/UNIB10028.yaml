code: UNIB10028
year: 2026
learn:
  en: "Surfing in Australia: its Polynesian and First Nations roots, the surf industry, the science of waves, and time in the water."
  zh: "澳洲冲浪：波利尼西亚与原住民渊源、冲浪产业、海浪科学，以及下水实践。"
  zh-TW: "澳洲衝浪：玻里尼西亞與原住民淵源、衝浪產業、海浪科學，以及下水實作。"
  ja: "オーストラリアのサーフィン：ポリネシアと先住民のルーツ、産業、波の科学、そして実際に海へ。"
  ko: "호주 서핑: 폴리네시아·원주민 뿌리, 서핑 산업, 파도의 과학, 그리고 바다 실습."
  vi: "Lướt sóng ở Úc: nguồn gốc Polynesia và bản địa, ngành công nghiệp lướt sóng, khoa học về sóng, thực hành dưới nước."
  ms: "Luncur ombak di Australia: akar Polinesia dan Orang Asal, industri, sains ombak, dan latihan di air."
  id: "Selancar di Australia: akar Polinesia dan First Nations, industri selancar, sains ombak, dan praktik di air."
  hi: "ऑस्ट्रेलिया में सर्फ़िंग: पॉलिनेशियाई और फ़र्स्ट नेशंस जड़ें, सर्फ़ उद्योग, लहरों का विज्ञान और पानी में अभ्यास।"
outcomes:
  - en: "Explain how waves form and break"
    zh: "解释海浪如何形成和破碎"
    zh-TW: "解釋海浪如何形成和碎裂"
    ja: "波ができて崩れる仕組みを説明する"
    ko: "파도가 생기고 부서지는 원리 설명하기"
    vi: "Giải thích sóng hình thành và vỡ ra sao"
    ms: "Terangkan cara ombak terbentuk dan pecah"
    id: "Menjelaskan cara ombak terbentuk dan pecah"
    hi: "लहरें कैसे बनती और टूटती हैं, समझाना"
  - en: "Discuss surfing's place in Australian culture"
    zh: "讨论冲浪在澳洲文化中的地位"
    zh-TW: "討論衝浪在澳洲文化中的地位"
    ja: "豪州文化におけるサーフィンの位置を論じる"
    ko: "호주 문화 속 서핑의 위치 논의하기"
    vi: "Thảo luận vị trí của lướt sóng trong văn hóa Úc"
    ms: "Bincang tempat luncur ombak dalam budaya Australia"
    id: "Membahas tempat selancar dalam budaya Australia"
    hi: "ऑस्ट्रेलियाई संस्कृति में सर्फ़िंग की जगह पर चर्चा करना"
  - en: "Present creative work with a team"
    zh: "与团队一起展示创意作品"
    zh-TW: "與團隊一起展示創意作品"
    ja: "チームで創作物を発表する"
    ko: "팀과 함께 창작물 발표하기"
    vi: "Trình bày sản phẩm sáng tạo cùng nhóm"
    ms: "Bentang karya kreatif bersama pasukan"
    id: "Mempresentasikan karya kreatif bersama tim"
    hi: "टीम के साथ रचनात्मक काम प्रस्तुत करना"
