code: HPSC20026
year: 2026
learn:
  en: "What science is, what it is for, how it works and whom it serves, looking at how science differs from other knowledge."
  zh: "科学是什么、为何而存在、如何运作、为谁服务，以及它与其他知识有何不同。"
  zh-TW: "科學是什麼、為何而存在、如何運作、為誰服務，以及它與其他知識有何不同。"
  ja: "科学とは何か、何のためか、どう働き誰に役立つのか、他の知とどう違うのかを考える。"
  ko: "과학이란 무엇이고 무엇을 위한 것인지, 어떻게 작동하고 누구를 위한 것인지, 다른 지식과 어떻게 다른지 배운다."
  vi: "Khoa học là gì, để làm gì, vận hành ra sao và phục vụ ai, và nó khác các loại tri thức khác thế nào."
  ms: "Apa itu sains, untuk apa, bagaimana ia berfungsi dan siapa yang dilayaninya, serta bezanya dengan ilmu lain."
  id: "Apa itu sains, untuk apa, bagaimana cara kerjanya dan melayani siapa, serta bedanya dengan pengetahuan lain."
  hi: "विज्ञान क्या है, किसलिए है, कैसे काम करता है और किसके लिए है, और यह दूसरे ज्ञान से कैसे अलग है।"
outcomes:
  - en: "Explain views on what makes something science"
    zh: "说明关于何为科学的各种观点"
    zh-TW: "說明關於何為科學的各種觀點"
    ja: "何が科学であるかについての見解を説明する"
    ko: "무엇이 과학인지에 관한 견해 설명하기"
    vi: "Giải thích các quan điểm về điều gì làm nên khoa học"
    ms: "Terangkan pandangan tentang apa yang menjadikan sesuatu sains"
    id: "Menjelaskan pandangan tentang apa yang membuat sesuatu ilmiah"
    hi: "किसी चीज़ को विज्ञान क्या बनाता है, इस पर मत समझाना"
  - en: "Assess different methods of scientific inquiry"
    zh: "评估不同的科学研究方法"
    zh-TW: "評估不同的科學研究方法"
    ja: "科学的探究の様々な方法を評価する"
    ko: "여러 과학 탐구 방법 평가하기"
    vi: "Đánh giá các phương pháp nghiên cứu khoa học khác nhau"
    ms: "Nilai kaedah inkuiri saintifik yang berbeza"
    id: "Menilai berbagai metode penyelidikan ilmiah"
    hi: "वैज्ञानिक जांच के अलग-अलग तरीकों को परखना"
  - en: "Discuss science's role in society"
    zh: "讨论科学在社会中的角色"
    zh-TW: "討論科學在社會中的角色"
    ja: "社会における科学の役割を論じる"
    ko: "사회에서 과학의 역할 논의하기"
    vi: "Thảo luận vai trò của khoa học trong xã hội"
    ms: "Bincangkan peranan sains dalam masyarakat"
    id: "Membahas peran sains dalam masyarakat"
    hi: "समाज में विज्ञान की भूमिका पर चर्चा करना"
