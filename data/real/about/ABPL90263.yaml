code: ABPL90263
year: 2027
learn:
  en: "Ecology for landscape architects: biodiversity, soils, wetlands, stormwater and designing with water, including a hydro lab."
  zh: "面向景观设计师的生态学：生物多样性、土壤、湿地、雨水和以水为本的设计，含水文实验。"
  zh-TW: "面向景觀建築師的生態學：生物多樣性、土壤、濕地、雨水與以水為本的設計，含水文實驗。"
  ja: "ランドスケープのための生態学：生物多様性、土壌、湿地、雨水と水の設計。水理実習あり。"
  ko: "조경가를 위한 생태학: 생물다양성, 토양, 습지, 우수와 물 설계. 수리 실습 포함."
  vi: "Sinh thái cho kiến trúc cảnh quan: đa dạng sinh học, đất, đất ngập nước, nước mưa, có thí nghiệm thủy văn."
  ms: "Ekologi untuk arkitek landskap: biodiversiti, tanah, tanah lembap dan air ribut, dengan makmal hidro."
  id: "Ekologi untuk arsitek lanskap: keanekaragaman hayati, tanah, lahan basah dan air hujan, dengan lab hidro."
  hi: "लैंडस्केप आर्किटेक्ट्स के लिए पारिस्थितिकी: जैव विविधता, मिट्टी, आर्द्रभूमि, वर्षा जल, हाइड्रो लैब सहित।"
outcomes:
  - en: "Explain key ecological principles"
    zh: "解释主要生态学原理"
    zh-TW: "解釋主要生態學原理"
    ja: "主な生態学の原理を説明する"
    ko: "핵심 생태 원리 설명하기"
    vi: "Giải thích nguyên lý sinh thái chính"
    ms: "Menerangkan prinsip ekologi utama"
    id: "Menjelaskan prinsip ekologi utama"
    hi: "प्रमुख पारिस्थितिक सिद्धांत समझाना"
  - en: "Design landscapes that support ecosystem function"
    zh: "设计支持生态功能的景观"
    zh-TW: "設計支持生態功能的景觀"
    ja: "生態系の機能を支える景観を設計する"
    ko: "생태계 기능을 돕는 경관 설계하기"
    vi: "Thiết kế cảnh quan hỗ trợ hệ sinh thái"
    ms: "Mereka landskap yang menyokong ekosistem"
    id: "Mendesain lanskap yang mendukung ekosistem"
    hi: "पारिस्थितिक तंत्र को सहारा देने वाले लैंडस्केप डिज़ाइन"
