code: ABPL90437
year: 2027
learn:
  en: "A studio on designing for a site's culture and environment, including caring for Country with First Nations Peoples."
  zh: "设计课：从场地的文化与环境出发做设计，包括原住民照护土地的理念。"
  zh-TW: "設計課：從基地的文化與環境出發做設計，包括原住民照護土地的理念。"
  ja: "敷地の文化と環境から設計するスタジオ。先住民のケア・フォー・カントリーも扱う。"
  ko: "부지의 문화와 환경에서 출발하는 설계 스튜디오, 원주민의 땅 돌봄 포함."
  vi: "Studio thiết kế dựa trên văn hóa và môi trường của khu đất, gồm cả việc chăm sóc Đất cùng người bản địa."
  ms: "Studio mereka bentuk mengikut budaya dan alam sekitar tapak, termasuk menjaga Tanah bersama Orang Asal."
  id: "Studio desain berdasarkan budaya dan lingkungan tapak, termasuk merawat Tanah bersama masyarakat Pribumi."
  hi: "साइट की संस्कृति और पर्यावरण पर आधारित डिज़ाइन स्टूडियो, फ़र्स्ट नेशंस के साथ Country की देखभाल सहित।"
outcomes:
  - en: "Analyse a complex site and design for it"
    zh: "分析复杂场地并为之设计"
    zh-TW: "分析複雜基地並為之設計"
    ja: "複雑な敷地を分析し設計する"
    ko: "복잡한 부지를 분석하고 설계하기"
    vi: "Phân tích khu đất phức tạp và thiết kế cho nó"
    ms: "Menganalisis tapak kompleks dan mereka bentuk untuknya"
    id: "Menganalisis tapak kompleks dan mendesain untuknya"
    hi: "जटिल साइट का विश्लेषण कर डिज़ाइन बनाना"
  - en: "Embed First Nations care for Country in design"
    zh: "在设计中融入原住民照护土地的理念"
    zh-TW: "在設計中融入原住民照護土地的理念"
    ja: "先住民のケア・フォー・カントリーを設計に生かす"
    ko: "원주민의 땅 돌봄을 설계에 반영하기"
    vi: "Đưa việc chăm sóc Đất của người bản địa vào thiết kế"
    ms: "Menerapkan penjagaan Tanah Orang Asal dalam reka bentuk"
    id: "Menerapkan perawatan Tanah masyarakat Pribumi dalam desain"
    hi: "डिज़ाइन में फ़र्स्ट नेशंस की Country देखभाल शामिल करना"
