code: GEOG30026
year: 2026
learn:
  en: "A 12-day field trip to East Timor on development, landscapes and climate in a small post-conflict island state."
  zh: "12天东帝汶实地考察，了解冲突后小岛国的发展、地貌与气候。"
  zh-TW: "12天東帝汶實地考察，了解衝突後小島國的發展、地景與氣候。"
  ja: "東ティモール12日間の現地調査で、紛争後の小島国の開発・景観・気候を学ぶ。"
  ko: "동티모르 12일 현장답사로 분쟁 후 작은 섬나라의 개발·경관·기후를 배움."
  vi: "Chuyến thực địa 12 ngày ở Đông Timor về phát triển, cảnh quan, khí hậu của đảo quốc nhỏ hậu xung đột."
  ms: "Lawatan 12 hari ke Timor Timur tentang pembangunan, landskap dan iklim negara pulau pasca-konflik."
  id: "Kunjungan 12 hari ke Timor Leste tentang pembangunan, lanskap, dan iklim negara pulau pascakonflik."
  hi: "पूर्वी तिमोर की 12 दिन की फ़ील्ड ट्रिप: संघर्ष के बाद छोटे द्वीप देश का विकास, परिदृश्य और जलवायु।"
outcomes:
  - en: "Evaluate development in post-conflict island states"
    zh: "评估冲突后岛国的发展问题"
    zh-TW: "評估衝突後島國的發展議題"
    ja: "紛争後の島国の開発を評価する"
    ko: "분쟁 후 섬나라 개발 평가하기"
    vi: "Đánh giá phát triển ở đảo quốc hậu xung đột"
    ms: "Nilai pembangunan negara pulau pasca-konflik"
    id: "Menilai pembangunan negara pulau pascakonflik"
    hi: "संघर्ष-पश्चात द्वीप देशों का विकास परखना"
  - en: "Do cross-cultural field research"
    zh: "开展跨文化实地研究"
    zh-TW: "進行跨文化實地研究"
    ja: "異文化でフィールド調査を行う"
    ko: "문화 간 현장 연구 수행하기"
    vi: "Làm nghiên cứu thực địa liên văn hóa"
    ms: "Jalankan kajian lapangan rentas budaya"
    id: "Melakukan riset lapangan lintas budaya"
    hi: "अंतर-सांस्कृतिक फ़ील्ड शोध करना"
