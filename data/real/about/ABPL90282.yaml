code: ABPL90282
year: 2027
learn:
  en: "The theory and history of heritage, from the Burra Charter to Aboriginal and intangible heritage, through seminars and field trips."
  zh: "通过研讨课和实地考察，学习遗产保护的理论与历史，从《巴拉宪章》到原住民和非物质遗产。"
  zh-TW: "透過研討課與實地考察，學習遺產保護的理論與歷史，從《巴拉憲章》到原住民與非物質遺產。"
  ja: "セミナーと現地見学で、バラ憲章から先住民・無形遺産まで、遺産保護の理論と歴史を学ぶ。"
  ko: "세미나와 현장 답사로 버라 헌장부터 원주민·무형 유산까지 유산 보존의 이론과 역사를 배웁니다."
  vi: "Lý thuyết và lịch sử bảo tồn di sản, từ Hiến chương Burra đến di sản thổ dân và phi vật thể."
  ms: "Teori dan sejarah warisan, daripada Piagam Burra hingga warisan Orang Asli dan tidak ketara."
  id: "Teori dan sejarah warisan, dari Piagam Burra hingga warisan Aborigin dan takbenda."
  hi: "सेमिनार और फ़ील्ड ट्रिप से धरोहर का सिद्धांत व इतिहास, बुर्रा चार्टर से आदिवासी व अमूर्त धरोहर तक।"
outcomes:
  - en: "Describe how heritage principles developed"
    zh: "描述遗产保护原则的发展"
    zh-TW: "描述遺產保護原則的發展"
    ja: "遺産保護の原則の発展を説明する"
    ko: "유산 보존 원칙의 발전 설명하기"
    vi: "Mô tả sự phát triển của nguyên tắc di sản"
    ms: "Menerangkan perkembangan prinsip warisan"
    id: "Menjelaskan perkembangan prinsip warisan"
    hi: "धरोहर सिद्धांतों का विकास बताना"
  - en: "Use the vocabulary of conservation practice"
    zh: "运用遗产保护的专业术语"
    zh-TW: "運用遺產保護的專業術語"
    ja: "保存実務の専門用語を使う"
    ko: "보존 실무 전문 용어 사용하기"
    vi: "Dùng thuật ngữ chuyên ngành bảo tồn"
    ms: "Menggunakan istilah amalan pemuliharaan"
    id: "Memakai istilah praktik konservasi"
    hi: "संरक्षण की शब्दावली का उपयोग"
