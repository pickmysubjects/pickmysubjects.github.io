code: MCEN30018
year: 2026
learn:
  en: "How heat, energy and fluids behave, from the laws of thermodynamics to pipe flow, lift and drag."
  zh: "热、能量和流体的规律，从热力学定律到管流和升阻力。"
  zh-TW: "熱、能量與流體的規律，從熱力學定律到管流和升阻力。"
  ja: "熱力学の法則から管内流・揚力・抗力まで、熱とエネルギーと流体のふるまい。"
  ko: "열역학 법칙부터 관 유동, 양력, 항력까지 열·에너지·유체의 원리."
  vi: "Nhiệt, năng lượng và chất lưu, từ định luật nhiệt động đến dòng ống, lực nâng và lực cản."
  ms: "Kelakuan haba, tenaga dan bendalir, dari hukum termodinamik hingga aliran paip dan daya angkat."
  id: "Perilaku panas, energi, dan fluida, dari hukum termodinamika hingga aliran pipa dan gaya angkat."
  hi: "गर्मी, ऊर्जा और फ़्लूइड का व्यवहार, थर्मोडायनामिक्स के नियमों से पाइप फ़्लो और लिफ़्ट-ड्रैग तक।"
outcomes:
  - en: "Apply the laws of thermodynamics to devices"
    zh: "把热力学定律用于工程设备"
    zh-TW: "把熱力學定律用於工程設備"
    ja: "熱力学の法則を機器に適用する"
    ko: "열역학 법칙을 장치에 적용하기"
    vi: "Áp dụng định luật nhiệt động cho thiết bị"
    ms: "Mengguna hukum termodinamik pada peranti"
    id: "Menerapkan hukum termodinamika pada perangkat"
    hi: "उपकरणों पर थर्मोडायनामिक्स के नियम लागू करना"
  - en: "Analyse simple pipe and pump flows"
    zh: "分析简单的管道和泵流动"
    zh-TW: "分析簡單的管路和泵流動"
    ja: "簡単な管路・ポンプ流れを解析する"
    ko: "간단한 관·펌프 유동 해석하기"
    vi: "Phân tích dòng chảy ống và bơm đơn giản"
    ms: "Menganalisis aliran paip dan pam ringkas"
    id: "Menganalisis aliran pipa dan pompa sederhana"
    hi: "सरल पाइप और पंप फ़्लो का विश्लेषण करना"
