code: MAST90007
year: 2027
learn:
  en: "Statistical methods for designing and analysing research projects, for postgraduates in any field."
  zh: "面向各学科研究生的统计方法，用于设计和分析研究项目。"
  zh-TW: "面向各學科研究生的統計方法，用於設計與分析研究計畫。"
  ja: "分野を問わず大学院生向けの、研究の設計と分析のための統計手法。"
  ko: "모든 분야 대학원생을 위한 연구 설계와 분석의 통계 방법."
  vi: "Phương pháp thống kê để thiết kế và phân tích dự án nghiên cứu, cho học viên sau đại học mọi ngành."
  ms: "Kaedah statistik untuk mereka bentuk dan menganalisis projek penyelidikan, untuk pelajar pascasiswazah semua bidang."
  id: "Metode statistik untuk merancang dan menganalisis proyek riset, bagi mahasiswa pascasarjana semua bidang."
  hi: "किसी भी विषय के स्नातकोत्तर छात्रों के लिए शोध परियोजनाओं के डिज़ाइन और विश्लेषण की सांख्यिकीय विधियाँ।"
outcomes:
  - en: "Plan studies that collect quantitative data"
    zh: "设计收集定量数据的研究"
    zh-TW: "設計蒐集量化資料的研究"
    ja: "量的データを集める研究を計画する"
    ko: "정량 데이터를 수집하는 연구 설계하기"
    vi: "Lập kế hoạch nghiên cứu thu thập dữ liệu định lượng"
    ms: "Merancang kajian yang mengumpul data kuantitatif"
    id: "Merencanakan studi yang mengumpulkan data kuantitatif"
    hi: "मात्रात्मक डेटा जुटाने वाले अध्ययन की योजना"
  - en: "Analyse data with statistical software"
    zh: "用统计软件分析数据"
    zh-TW: "用統計軟體分析資料"
    ja: "統計ソフトでデータを分析する"
    ko: "통계 소프트웨어로 데이터 분석하기"
    vi: "Phân tích dữ liệu bằng phần mềm thống kê"
    ms: "Menganalisis data dengan perisian statistik"
    id: "Menganalisis data dengan perangkat lunak statistik"
    hi: "सांख्यिकीय सॉफ़्टवेयर से डेटा विश्लेषण"
  - en: "Judge the statistics in published research"
    zh: "评估已发表研究中的统计方法"
    zh-TW: "評估已發表研究中的統計方法"
    ja: "発表済み研究の統計を評価する"
    ko: "발표된 연구의 통계 평가하기"
    vi: "Đánh giá thống kê trong nghiên cứu đã công bố"
    ms: "Menilai statistik dalam penyelidikan terbitan"
    id: "Menilai statistik dalam riset terbitan"
    hi: "प्रकाशित शोध में सांख्यिकी का आकलन"
