code: CWRI30006
year: 2026
learn:
  en: "How contemporary poets challenge the canon and remake English and poetic form, and writing your own poems in response."
  zh: "当代诗人如何挑战经典、重塑英语和诗歌形式，并写诗作出回应。"
  zh-TW: "當代詩人如何挑戰經典、重塑英語和詩歌形式，並寫詩作出回應。"
  ja: "現代の詩人が正典に挑み英語と詩形をどう作り直すかを学び、応答として自分の詩を書く。"
  ko: "현대 시인들이 정전에 도전하며 영어와 시 형식을 어떻게 다시 만드는지 배우고, 응답으로 자기 시를 쓴다."
  vi: "Các nhà thơ đương đại thách thức kinh điển và làm mới tiếng Anh, hình thức thơ ra sao, và tự viết thơ để đáp lại."
  ms: "Cara penyair kontemporari mencabar kanun dan membentuk semula bahasa Inggeris dan bentuk puisi, serta menulis puisi sendiri sebagai jawapan."
  id: "Cara penyair kontemporer menantang kanon dan merombak bahasa Inggris serta bentuk puisi, lalu menulis puisi sendiri sebagai tanggapan."
  hi: "समकालीन कवि कैनन को कैसे चुनौती देते हैं और अंग्रेज़ी व काव्य-रूप को कैसे नया बनाते हैं, और जवाब में अपनी कविताएं लिखना।"
outcomes:
  - en: "Discuss canon, inclusion and exclusion in poetry"
    zh: "讨论诗歌中的经典、包容与排斥"
    zh-TW: "討論詩歌中的經典、包容與排斥"
    ja: "詩における正典、包摂と排除を論じる"
    ko: "시의 정전, 포용과 배제 논의하기"
    vi: "Thảo luận kinh điển, bao hàm và loại trừ trong thơ"
    ms: "Bincangkan kanun, keterangkuman dan pengecualian dalam puisi"
    id: "Membahas kanon, inklusi dan eksklusi dalam puisi"
    hi: "कविता में कैनन, समावेश और बहिष्कार पर चर्चा करना"
  - en: "Analyse how poets rework language and form"
    zh: "分析诗人如何改造语言与形式"
    zh-TW: "分析詩人如何改造語言與形式"
    ja: "詩人が言語と形式をどう作り変えるか分析する"
    ko: "시인이 언어와 형식을 재구성하는 방식 분석하기"
    vi: "Phân tích cách nhà thơ làm mới ngôn ngữ và hình thức"
    ms: "Analisis cara penyair mengolah bahasa dan bentuk"
    id: "Menganalisis cara penyair mengolah bahasa dan bentuk"
    hi: "कवि भाषा और रूप को कैसे नया गढ़ते हैं, विश्लेषण करना"
  - en: "Write poems that respond to other poems"
    zh: "写出回应其他诗作的诗"
    zh-TW: "寫出回應其他詩作的詩"
    ja: "他の詩に応答する詩を書く"
    ko: "다른 시에 응답하는 시 쓰기"
    vi: "Viết thơ đáp lại những bài thơ khác"
    ms: "Tulis puisi yang menjawab puisi lain"
    id: "Menulis puisi yang menanggapi puisi lain"
    hi: "दूसरी कविताओं के जवाब में कविताएं लिखना"
