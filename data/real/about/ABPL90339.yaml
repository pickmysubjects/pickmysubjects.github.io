code: ABPL90339
year: 2027
learn:
  en: "How national real estate markets work and connect in a global system, using business, institutional and finance theory."
  zh: "运用商业、制度和金融理论，了解各国房地产市场如何运作并在全球体系中相互关联。"
  zh-TW: "運用商業、制度和金融理論，了解各國房地產市場如何運作並在全球體系中相互連結。"
  ja: "ビジネス・制度・金融理論で、各国の不動産市場の仕組みと国際的なつながりを学ぶ。"
  ko: "경영·제도·금융 이론으로 각국 부동산 시장의 작동과 국제적 연결을 배웁니다."
  vi: "Cách thị trường bất động sản các nước vận hành và liên kết toàn cầu, dùng lý thuyết kinh doanh, thể chế và tài chính."
  ms: "Cara pasaran hartanah negara berfungsi dan berhubung secara global, guna teori perniagaan, institusi dan kewangan."
  id: "Cara pasar properti nasional bekerja dan terhubung secara global, dengan teori bisnis, kelembagaan, dan keuangan."
  hi: "व्यापार, संस्थागत और वित्त सिद्धांत से राष्ट्रीय रियल एस्टेट बाज़ार और उनके वैश्विक जुड़ाव को समझना।"
outcomes:
  - en: "Explain cross-border real estate investment"
    zh: "解释跨国房地产投资"
    zh-TW: "解釋跨國房地產投資"
    ja: "国境を越えた不動産投資を説明する"
    ko: "국경 간 부동산 투자 설명하기"
    vi: "Giải thích đầu tư bất động sản xuyên biên giới"
    ms: "Menerangkan pelaburan hartanah rentas sempadan"
    id: "Menjelaskan investasi properti lintas negara"
    hi: "सीमा-पार रियल एस्टेट निवेश समझाना"
  - en: "Compare national property markets"
    zh: "比较各国房地产市场"
    zh-TW: "比較各國房地產市場"
    ja: "各国の不動産市場を比べる"
    ko: "국가별 부동산 시장 비교하기"
    vi: "So sánh thị trường bất động sản các nước"
    ms: "Membandingkan pasaran hartanah negara"
    id: "Membandingkan pasar properti antarnegara"
    hi: "राष्ट्रीय संपत्ति बाज़ारों की तुलना"
