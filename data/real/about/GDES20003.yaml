code: GDES20003
year: 2027
learn:
  en: "Branding basics for beginners: strategy, naming, type, colour and logos, used to build simple visual identities."
  zh: "零基础品牌设计入门：品牌策略、命名、字体、色彩和标志，用来打造简单的视觉形象。"
  zh-TW: "零基礎品牌設計入門：品牌策略、命名、字體、色彩和標誌，用來打造簡單的視覺識別。"
  ja: "初心者向けブランディング入門：戦略・ネーミング・書体・色・ロゴで簡単なビジュアルアイデンティティを作る。"
  ko: "초보자를 위한 브랜딩 기초: 전략, 네이밍, 서체, 색, 로고로 간단한 비주얼 아이덴티티를 만든다."
  vi: "Kiến thức cơ bản về thương hiệu cho người mới: chiến lược, đặt tên, kiểu chữ, màu sắc và logo để xây dựng nhận diện hình ảnh đơn giản."
  ms: "Asas penjenamaan untuk pemula: strategi, penamaan, tipografi, warna dan logo untuk membina identiti visual ringkas."
  id: "Dasar branding untuk pemula: strategi, penamaan, tipografi, warna, dan logo untuk membangun identitas visual sederhana."
  hi: "शुरुआती लोगों के लिए ब्रांडिंग की बुनियाद: रणनीति, नामकरण, टाइपोग्राफ़ी, रंग और लोगो से सरल विज़ुअल पहचान बनाना।"
outcomes:
  - en: "Design brand elements with type, colour and layout"
    zh: "用字体、色彩和版式设计品牌元素"
    zh-TW: "用字體、色彩和版面設計品牌元素"
    ja: "書体・色・レイアウトでブランド要素を作る"
    ko: "서체, 색, 레이아웃으로 브랜드 요소 디자인하기"
    vi: "Thiết kế yếu tố thương hiệu bằng chữ, màu và bố cục"
    ms: "Reka elemen jenama dengan tipografi, warna dan susun atur"
    id: "Merancang elemen merek dengan tipografi, warna, dan tata letak"
    hi: "टाइप, रंग और लेआउट से ब्रांड तत्व डिज़ाइन करना"
  - en: "Develop a brand concept from a brief"
    zh: "根据设计任务构思品牌概念"
    zh-TW: "根據設計任務構思品牌概念"
    ja: "課題からブランドコンセプトを作る"
    ko: "과제를 바탕으로 브랜드 콘셉트 만들기"
    vi: "Phát triển ý tưởng thương hiệu từ đề bài"
    ms: "Bangunkan konsep jenama daripada taklimat"
    id: "Mengembangkan konsep merek dari brief"
    hi: "ब्रीफ़ से ब्रांड कॉन्सेप्ट बनाना"
  - en: "Justify design choices for the audience"
    zh: "针对目标受众说明设计选择"
    zh-TW: "針對目標受眾說明設計選擇"
    ja: "対象者に合わせてデザインの選択を説明する"
    ko: "대상 고객에 맞춘 디자인 선택 근거 대기"
    vi: "Giải thích lựa chọn thiết kế theo đối tượng"
    ms: "Wajarkan pilihan reka bentuk untuk khalayak"
    id: "Menjelaskan alasan pilihan desain bagi audiens"
    hi: "लक्षित दर्शकों के हिसाब से डिज़ाइन विकल्प समझाना"
