code: CVEN30009
year: 2026
learn:
  en: "Analysing beams and frames, and designing simple structures in concrete, steel, timber and masonry."
  zh: "分析梁和框架，并设计混凝土、钢、木和砌体的简单结构。"
  zh-TW: "分析樑與構架，並設計混凝土、鋼、木與磚石的簡單結構。"
  ja: "梁と骨組の解析と、コンクリート・鋼・木・組積の簡単な構造設計。"
  ko: "보와 골조 해석, 그리고 콘크리트·강·목재·조적 간단한 구조 설계."
  vi: "Phân tích dầm, khung và thiết kế kết cấu đơn giản bằng bê tông, thép, gỗ, gạch đá."
  ms: "Menganalisis rasuk dan kerangka, serta mereka bentuk struktur ringkas konkrit, keluli, kayu dan batu."
  id: "Menganalisis balok dan rangka, serta merancang struktur sederhana dari beton, baja, kayu, dan bata."
  hi: "बीम और फ़्रेम का विश्लेषण, और कंक्रीट, स्टील, लकड़ी व चिनाई से सरल संरचनाएँ डिज़ाइन करना।"
outcomes:
  - en: "Calculate stresses and deflections in beams"
    zh: "计算梁的应力和挠度"
    zh-TW: "計算樑的應力與撓度"
    ja: "梁の応力とたわみを計算する"
    ko: "보의 응력과 처짐 계산하기"
    vi: "Tính ứng suất và độ võng của dầm"
    ms: "Mengira tegasan dan pesongan rasuk"
    id: "Menghitung tegangan dan lendutan balok"
    hi: "बीम में तनाव और विक्षेपण की गणना करना"
  - en: "Design steel and reinforced concrete members"
    zh: "设计钢构件和钢筋混凝土构件"
    zh-TW: "設計鋼構件與鋼筋混凝土構件"
    ja: "鋼とRCの部材を設計する"
    ko: "강재·철근콘크리트 부재 설계하기"
    vi: "Thiết kế cấu kiện thép và bê tông cốt thép"
    ms: "Mereka bentuk anggota keluli dan konkrit bertetulang"
    id: "Merancang elemen baja dan beton bertulang"
    hi: "स्टील और RCC अवयव डिज़ाइन करना"
  - en: "Check columns for buckling"
    zh: "校核柱的屈曲稳定"
    zh-TW: "校核柱的挫屈穩定"
    ja: "柱の座屈を検討する"
    ko: "기둥의 좌굴 검토하기"
    vi: "Kiểm tra mất ổn định của cột"
    ms: "Menyemak lengkokan tiang"
    id: "Memeriksa tekuk kolom"
    hi: "स्तंभों में बकलिंग की जाँच करना"
