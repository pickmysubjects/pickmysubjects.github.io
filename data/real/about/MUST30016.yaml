code: MUST30016
year: 2026
learn:
  en: "The business and wellbeing side of a music theatre career, ending in an audition before an industry panel."
  zh: "音乐剧职业的商业与身心健康，最后在行业评审前试镜。"
  zh-TW: "音樂劇職涯的商業與身心健康，最後在業界評審前試鏡。"
  ja: "ミュージカル俳優のビジネスと心身の健康を学び、業界審査員の前でオーディション。"
  ko: "뮤지컬 커리어의 비즈니스와 웰빙, 업계 심사위원 앞 오디션으로 마무리."
  vi: "Mặt kinh doanh và sức khỏe của nghề nhạc kịch, kết thúc bằng thử vai trước ngành."
  ms: "Sisi perniagaan dan kesejahteraan kerjaya muzikal, berakhir dengan uji bakat industri."
  id: "Sisi bisnis dan kesejahteraan karier musikal, diakhiri audisi di depan panel industri."
  hi: "म्यूज़िकल थिएटर करियर का व्यवसाय और वेलबीइंग पक्ष, अंत में इंडस्ट्री पैनल ऑडिशन।"
outcomes:
  - en: "Audition for an industry panel"
    zh: "在行业评审前试镜"
    zh-TW: "在業界評審前試鏡"
    ja: "業界審査員の前でオーディションを受ける"
    ko: "업계 심사위원 앞에서 오디션 보기"
    vi: "Thử vai trước hội đồng trong ngành"
    ms: "Uji bakat di depan panel industri"
    id: "Audisi di depan panel industri"
    hi: "इंडस्ट्री पैनल के सामने ऑडिशन देना"
  - en: "Write a self-care plan for a long career"
    zh: "为长期职业写自我照顾计划"
    zh-TW: "為長期職涯寫自我照顧計畫"
    ja: "長く続けるためのセルフケア計画を書く"
    ko: "오래 일하기 위한 자기 관리 계획 쓰기"
    vi: "Viết kế hoạch tự chăm sóc cho nghề lâu dài"
    ms: "Tulis pelan penjagaan diri untuk kerjaya"
    id: "Menulis rencana perawatan diri"
    hi: "लंबे करियर के लिए सेल्फ़-केयर योजना लिखना"
  - en: "Assemble an industry portfolio"
    zh: "整理一份行业作品集"
    zh-TW: "整理一份業界作品集"
    ja: "業界向けのポートフォリオを作る"
    ko: "업계용 포트폴리오 만들기"
    vi: "Tập hợp hồ sơ cho ngành"
    ms: "Susun portfolio industri"
    id: "Menyusun portofolio industri"
    hi: "इंडस्ट्री पोर्टफ़ोलियो तैयार करना"
