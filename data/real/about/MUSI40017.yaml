code: MUSI40017
year: 2026
learn:
  en: "Keep building technique and repertoire in weekly lessons, then play an approved recital program for examiners."
  zh: "继续每周上课提升技术和曲目，最后为考官演奏经审批的独奏曲目。"
  zh-TW: "繼續每週上課提升技術和曲目，最後為考官演奏經審核的獨奏曲目。"
  ja: "週1レッスンで技術とレパートリーを磨き、承認済みのリサイタルを審査員の前で演奏する。"
  ko: "주간 레슨으로 테크닉과 레퍼토리를 키우고 승인된 리사이틀을 심사위원 앞에서 연주하기."
  vi: "Tiếp tục rèn kỹ thuật và tiết mục hàng tuần, rồi biểu diễn chương trình đã duyệt trước giám khảo."
  ms: "Terus bina teknik dan repertoir setiap minggu, kemudian mainkan program resital diluluskan di depan pemeriksa."
  id: "Terus mengasah teknik dan repertoar tiap minggu, lalu memainkan program resital yang disetujui di depan penguji."
  hi: "साप्ताहिक पाठों में तकनीक और रिपर्टॉयर बढ़ाना, फिर परीक्षकों के सामने स्वीकृत रिसाइटल बजाना।"
outcomes:
  - en: "Prepare and perform a full recital program"
    zh: "准备并演奏一套完整的独奏会曲目"
    zh-TW: "準備並演奏一套完整的獨奏會曲目"
    ja: "リサイタル一式を準備して演奏する"
    ko: "리사이틀 프로그램 전체를 준비해 연주하기"
    vi: "Chuẩn bị và biểu diễn trọn chương trình độc tấu"
    ms: "Sedia dan persembahkan program resital penuh"
    id: "Menyiapkan dan membawakan program resital lengkap"
    hi: "पूरा रिसाइटल कार्यक्रम तैयार कर प्रस्तुत करना"
  - en: "Interpret repertoire with a sense of style"
    zh: "有风格意识地诠释曲目"
    zh-TW: "有風格意識地詮釋曲目"
    ja: "様式を意識して曲を解釈する"
    ko: "양식감을 살려 레퍼토리 해석하기"
    vi: "Diễn giải tác phẩm có ý thức phong cách"
    ms: "Tafsir repertoir dengan kesedaran gaya"
    id: "Menafsirkan repertoar dengan kesadaran gaya"
    hi: "शैली की समझ के साथ रचनाओं की व्याख्या करना"
  - en: "Take part fully in performance classes"
    zh: "全程参与演奏课"
    zh-TW: "全程參與演奏課"
    ja: "演奏クラスに欠かさず参加する"
    ko: "공연 수업에 빠짐없이 참여하기"
    vi: "Tham gia đầy đủ các lớp biểu diễn"
    ms: "Sertai kelas persembahan sepenuhnya"
    id: "Ikut penuh dalam kelas pertunjukan"
    hi: "परफ़ॉर्मेंस कक्षाओं में पूरी भागीदारी करना"
