code: DNCE30029
year: 2026
learn:
  en: "Advanced technique and performance skills; you schedule your own rehearsals and research, ending in a practical exam."
  zh: "高阶技术与表演技巧；自行安排排练与研究，期末实操考试。"
  zh-TW: "高階技術與表演技巧；自行安排排練與研究，期末實作考試。"
  ja: "上級の技術と表現力。リハーサルと研究を自分で組み、最後に実技試験。"
  ko: "고급 테크닉과 공연 기술. 연습과 연구를 직접 계획하고 실기 시험으로 마친다."
  vi: "Kỹ thuật và kỹ năng biểu diễn nâng cao; tự lên lịch tập và nghiên cứu, kết thúc bằng thi thực hành."
  ms: "Teknik dan kemahiran persembahan lanjutan; anda atur latihan sendiri, diakhiri ujian amali."
  id: "Teknik dan keterampilan pentas lanjutan; atur latihan sendiri, diakhiri ujian praktik."
  hi: "उन्नत तकनीक और प्रस्तुति कौशल; अपनी रिहर्सल और शोध ख़ुद तय करना, अंत में प्रैक्टिकल परीक्षा।"
outcomes:
  - en: "Improvise to a graphic score"
    zh: "根据图形乐谱即兴"
    zh-TW: "根據圖形樂譜即興"
    ja: "図形楽譜で即興する"
    ko: "그래픽 악보로 즉흥하기"
    vi: "Ứng tác theo bản nhạc đồ họa"
    ms: "Improvisasi mengikut skor grafik"
    id: "Berimprovisasi dengan skor grafis"
    hi: "ग्राफ़िक स्कोर पर इम्प्रोवाइज़ करना"
  - en: "Bring presence and intention to the stage"
    zh: "在舞台上展现存在感与意图"
    zh-TW: "在舞台上展現存在感與意圖"
    ja: "舞台で存在感と意図を示す"
    ko: "무대에서 존재감과 의도 보여주기"
    vi: "Thể hiện sự hiện diện và chủ ý trên sân khấu"
    ms: "Bawa kehadiran dan niat ke pentas"
    id: "Membawa kehadiran dan niat ke panggung"
    hi: "मंच पर उपस्थिति और इरादा दिखाना"
  - en: "Take charge of your own training"
    zh: "主导自己的训练"
    zh-TW: "主導自己的訓練"
    ja: "自分の訓練を自ら管理する"
    ko: "자기 훈련을 주도하기"
    vi: "Tự chủ việc luyện tập của mình"
    ms: "Ambil alih latihan sendiri"
    id: "Mengendalikan latihan sendiri"
    hi: "अपनी ट्रेनिंग की ज़िम्मेदारी लेना"
