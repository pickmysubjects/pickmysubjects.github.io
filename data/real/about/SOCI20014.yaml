code: SOCI20014
year: 2026
learn:
  en: "How sociologists study youth: how work, education, family, class and digital life shape growing up today."
  zh: "社会学如何研究青年：工作、教育、家庭、阶层和数字生活如何影响成长。"
  zh-TW: "社會學如何研究青年：工作、教育、家庭、階層和數位生活如何影響成長。"
  ja: "社会学は若者をどう研究するか、仕事・教育・家族・階層・デジタル生活が成長にどう影響するかを学ぶ。"
  ko: "사회학이 청년을 연구하는 방법, 일·교육·가족·계층·디지털 생활이 성장에 미치는 영향을 배운다."
  vi: "Xã hội học nghiên cứu tuổi trẻ: việc làm, giáo dục, gia đình, giai cấp và đời sống số định hình sự trưởng thành ra sao."
  ms: "Cara sosiologi mengkaji belia: bagaimana kerja, pendidikan, keluarga, kelas dan kehidupan digital membentuk proses membesar."
  id: "Cara sosiologi mengkaji anak muda: bagaimana kerja, pendidikan, keluarga, kelas dan kehidupan digital membentuk proses tumbuh dewasa."
  hi: "समाजशास्त्र युवाओं को कैसे पढ़ता है: काम, शिक्षा, परिवार, वर्ग और डिजिटल जीवन बड़े होने को कैसे आकार देते हैं।"
outcomes:
  - en: "Explain the main sociological theories of youth"
    zh: "说明青年研究的主要社会学理论"
    zh-TW: "說明青年研究的主要社會學理論"
    ja: "若者研究の主な社会学理論を説明する"
    ko: "청년에 관한 주요 사회학 이론 설명하기"
    vi: "Giải thích các lý thuyết xã hội học chính về tuổi trẻ"
    ms: "Terangkan teori sosiologi utama tentang belia"
    id: "Menjelaskan teori sosiologi utama tentang anak muda"
    hi: "युवाओं पर मुख्य समाजशास्त्रीय सिद्धांत समझाना"
  - en: "Link young people's lives to wider social change"
    zh: "把年轻人的生活与更大的社会变化联系起来"
    zh-TW: "把年輕人的生活與更大的社會變化聯繫起來"
    ja: "若者の生活を大きな社会変化と結びつける"
    ko: "청년의 삶을 더 큰 사회 변화와 연결하기"
    vi: "Liên hệ đời sống người trẻ với biến đổi xã hội rộng hơn"
    ms: "Kaitkan kehidupan belia dengan perubahan sosial yang lebih luas"
    id: "Mengaitkan kehidupan anak muda dengan perubahan sosial yang lebih luas"
    hi: "युवाओं के जीवन को बड़े सामाजिक बदलाव से जोड़ना"
  - en: "Write evidence-based arguments about youth issues"
    zh: "就青年议题写出有证据的论证"
    zh-TW: "就青年議題寫出有證據的論證"
    ja: "若者の問題について根拠ある議論を書く"
    ko: "청년 문제에 대해 근거 있는 글 쓰기"
    vi: "Viết lập luận có dẫn chứng về các vấn đề tuổi trẻ"
    ms: "Tulis hujah berasaskan bukti tentang isu belia"
    id: "Menulis argumen berbasis bukti tentang isu anak muda"
    hi: "युवाओं के मुद्दों पर प्रमाण-आधारित तर्क लिखना"
