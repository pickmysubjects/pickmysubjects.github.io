code: CULS30004
year: 2026
learn:
  en: "Gender and sexuality as shaped by history and culture, tracing how categories like masculinity or homosexuality have changed."
  zh: "性别与性取向如何受历史和文化塑造，追溯男性气质、同性恋等类别的变化。"
  zh-TW: "性別與性傾向如何受歷史和文化塑造，追溯男性氣質、同性戀等類別的變化。"
  ja: "ジェンダーとセクシュアリティが歴史と文化にどう形づくられたか、男らしさや同性愛などの区分の変化をたどる。"
  ko: "젠더와 섹슈얼리티가 역사와 문화 속에서 어떻게 만들어졌는지, 남성성·동성애 같은 범주의 변화를 따라간다."
  vi: "Giới và tính dục được lịch sử và văn hóa định hình ra sao, lần theo sự thay đổi của các phạm trù như nam tính hay đồng tính."
  ms: "Gender dan seksualiti seperti dibentuk sejarah dan budaya, menjejaki perubahan kategori seperti kelelakian atau homoseksualiti."
  id: "Gender dan seksualitas sebagaimana dibentuk sejarah dan budaya, menelusuri perubahan kategori seperti maskulinitas atau homoseksualitas."
  hi: "जेंडर और यौनिकता इतिहास व संस्कृति से कैसे बनती हैं, पुरुषत्व या समलैंगिकता जैसी श्रेणियों के बदलाव को खोजते हुए।"
outcomes:
  - en: "Explain theories of gender and sexuality"
    zh: "说明关于性别与性取向的理论"
    zh-TW: "說明關於性別與性傾向的理論"
    ja: "ジェンダーとセクシュアリティの理論を説明する"
    ko: "젠더와 섹슈얼리티 이론 설명하기"
    vi: "Giải thích các lý thuyết về giới và tính dục"
    ms: "Terangkan teori gender dan seksualiti"
    id: "Menjelaskan teori gender dan seksualitas"
    hi: "जेंडर और यौनिकता के सिद्धांत समझाना"
  - en: "Trace how sexual categories changed over time"
    zh: "梳理性类别随时间的变化"
    zh-TW: "梳理性類別隨時間的變化"
    ja: "性の区分が時代とともにどう変わったかたどる"
    ko: "성적 범주의 시대별 변화 짚어 보기"
    vi: "Lần theo sự thay đổi của các phạm trù tính dục"
    ms: "Jejaki perubahan kategori seksual dari masa ke masa"
    id: "Menelusuri perubahan kategori seksual dari waktu ke waktu"
    hi: "यौन श्रेणियां समय के साथ कैसे बदलीं, खोजना"
  - en: "Analyse how medicine and media frame sexuality"
    zh: "分析医学和媒体如何框定性"
    zh-TW: "分析醫學和媒體如何框定性"
    ja: "医学とメディアが性をどう枠づけるか分析する"
    ko: "의학과 미디어가 섹슈얼리티를 규정하는 방식 분석하기"
    vi: "Phân tích y học và truyền thông định khung tính dục ra sao"
    ms: "Analisis cara perubatan dan media membingkai seksualiti"
    id: "Menganalisis cara kedokteran dan media membingkai seksualitas"
    hi: "चिकित्सा और मीडिया यौनिकता को कैसे पेश करते हैं, विश्लेषण करना"
