code: MGMT90193
year: 2027
learn:
  en: "Research-level look at theories of people, work and employment, drawing on psychology, sociology and industrial relations."
  zh: "研究层面的人与工作、雇佣理论，借鉴心理学、社会学和劳资关系。"
  zh-TW: "研究層面的人與工作、僱傭理論，借鑑心理學、社會學和勞資關係。"
  ja: "心理学・社会学・労使関係をもとに、人・仕事・雇用の理論を研究レベルで学ぶ。"
  ko: "심리학, 사회학, 노사관계를 바탕으로 사람·일·고용 이론을 연구 수준에서 탐구."
  vi: "Lý thuyết về con người, công việc và việc làm ở mức nghiên cứu, dựa trên tâm lý học, xã hội học và quan hệ lao động."
  ms: "Teori tentang manusia, kerja dan pekerjaan di peringkat penyelidikan, berasaskan psikologi, sosiologi dan perhubungan industri."
  id: "Teori tentang manusia, kerja, dan ketenagakerjaan tingkat riset, dari psikologi, sosiologi, dan hubungan industrial."
  hi: "मनोविज्ञान, समाजशास्त्र और औद्योगिक संबंधों के आधार पर लोगों, काम और रोज़गार के सिद्धांत।"
outcomes:
  - en: "Critically evaluate HRM theory and research"
    zh: "批判地评估人力资源管理理论与研究"
    zh-TW: "批判地評估人力資源管理理論與研究"
    ja: "人的資源管理の理論と研究を批判的に評価する"
    ko: "인적자원관리 이론과 연구 비판적으로 평가하기"
    vi: "Đánh giá phản biện lý thuyết và nghiên cứu quản trị nhân sự"
    ms: "Menilai teori dan kajian pengurusan sumber manusia secara kritis"
    id: "Menilai teori dan riset MSDM secara kritis"
    hi: "मानव संसाधन प्रबंधन सिद्धांत व शोध का आलोचनात्मक मूल्यांकन"
  - en: "Analyse the role of HRM in today's organisations"
    zh: "分析人力资源管理在现代组织中的作用"
    zh-TW: "分析人力資源管理在現代組織中的作用"
    ja: "現代の組織における人的資源管理の役割を分析する"
    ko: "현대 조직에서 인적자원관리의 역할 분석하기"
    vi: "Phân tích vai trò quản trị nhân sự trong tổ chức ngày nay"
    ms: "Menganalisis peranan pengurusan sumber manusia kini"
    id: "Menganalisis peran MSDM di organisasi masa kini"
    hi: "आज के संगठनों में HRM की भूमिका का विश्लेषण"
