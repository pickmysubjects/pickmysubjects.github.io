code: MECM20003
year: 2026
learn:
  en: "Hands-on workshops with digital tools to plan and publish an online project, alongside the social and economic issues of internet culture."
  zh: "在实操工作坊里用数字工具策划并发布一个线上项目，同时讨论网络文化背后的社会和经济问题。"
  zh-TW: "在實作工作坊裡用數位工具規劃並發布一個線上專案，同時討論網路文化背後的社會和經濟問題。"
  ja: "デジタルツールを使う実習でオンライン企画を立てて公開し、あわせてネット文化の社会的・経済的な問題を考える。"
  ko: "실습 워크숍에서 디지털 도구로 온라인 프로젝트를 기획하고 게시하며, 인터넷 문화의 사회적·경제적 문제도 함께 다룬다."
  vi: "Thực hành với công cụ số để lên kế hoạch và đăng một dự án trực tuyến, kèm các vấn đề xã hội và kinh tế của văn hóa internet."
  ms: "Bengkel praktikal dengan alat digital untuk merancang dan menerbitkan projek dalam talian, serta isu sosial dan ekonomi budaya internet."
  id: "Lokakarya praktik dengan alat digital untuk merancang dan menerbitkan proyek daring, sekaligus membahas isu sosial dan ekonomi budaya internet."
  hi: "डिजिटल टूल्स के साथ व्यावहारिक वर्कशॉप में एक ऑनलाइन प्रोजेक्ट बनाना और प्रकाशित करना, साथ में इंटरनेट संस्कृति के सामाजिक-आर्थिक मुद्दे।"
outcomes:
  - en: "Analyse the social context of online content"
    zh: "分析网络内容背后的社会背景"
    zh-TW: "分析網路內容背後的社會脈絡"
    ja: "オンラインコンテンツの社会的背景を分析する"
    ko: "온라인 콘텐츠의 사회적 맥락 분석하기"
    vi: "Phân tích bối cảnh xã hội của nội dung trực tuyến"
    ms: "Analisis konteks sosial kandungan dalam talian"
    id: "Menganalisis konteks sosial konten daring"
    hi: "ऑनलाइन कंटेंट के सामाजिक संदर्भ का विश्लेषण करना"
  - en: "Make and evaluate online content with digital tools"
    zh: "用数字工具制作并评估网络内容"
    zh-TW: "用數位工具製作並評估網路內容"
    ja: "デジタルツールでオンラインコンテンツを作り評価する"
    ko: "디지털 도구로 온라인 콘텐츠 만들고 평가하기"
    vi: "Tạo và đánh giá nội dung trực tuyến bằng công cụ số"
    ms: "Hasilkan dan nilai kandungan dalam talian dengan alat digital"
    id: "Membuat dan menilai konten daring dengan alat digital"
    hi: "डिजिटल टूल्स से ऑनलाइन कंटेंट बनाना और परखना"
  - en: "Design and present a digital project"
    zh: "设计并展示一个数字项目"
    zh-TW: "設計並展示一個數位專案"
    ja: "デジタル企画を設計し発表する"
    ko: "디지털 프로젝트 설계하고 발표하기"
    vi: "Thiết kế và trình bày một dự án số"
    ms: "Reka dan bentangkan projek digital"
    id: "Merancang dan mempresentasikan proyek digital"
    hi: "एक डिजिटल प्रोजेक्ट डिज़ाइन करके प्रस्तुत करना"
