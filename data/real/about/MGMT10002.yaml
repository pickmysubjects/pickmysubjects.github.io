code: MGMT10002
year: 2026
learn:
  en: "The basics of management: managing yourself, other people, organisations and the wider business ecosystem."
  zh: "管理学入门：管理自己、他人、组织和更大的商业生态。"
  zh-TW: "管理學入門：管理自己、他人、組織和更大的商業生態。"
  ja: "マネジメントの基礎：自分、他者、組織、そしてより広いビジネス生態系を管理する。"
  ko: "경영의 기초: 자기 자신, 타인, 조직, 더 넓은 비즈니스 생태계 관리."
  vi: "Nền tảng quản lý: quản lý bản thân, người khác, tổ chức và hệ sinh thái kinh doanh rộng hơn."
  ms: "Asas pengurusan: urus diri, orang lain, organisasi dan ekosistem perniagaan yang lebih luas."
  id: "Dasar manajemen: mengelola diri sendiri, orang lain, organisasi, dan ekosistem bisnis yang lebih luas."
  hi: "मैनेजमेंट की बुनियाद: खुद को, दूसरों को, संगठनों को और बड़े बिज़नेस इकोसिस्टम को संभालना।"
outcomes:
  - en: "Describe core management theories with real examples"
    zh: "用真实例子说明核心管理理论"
    zh-TW: "用真實例子說明核心管理理論"
    ja: "主要な経営理論を実例とともに説明する"
    ko: "핵심 경영 이론을 실제 사례로 설명"
    vi: "Mô tả các lý thuyết quản lý chính bằng ví dụ thật"
    ms: "Huraikan teori pengurusan teras dengan contoh sebenar"
    id: "Menjelaskan teori manajemen inti dengan contoh nyata"
    hi: "असली उदाहरणों से मुख्य मैनेजमेंट सिद्धांत बताना"
  - en: "Use theory to analyse cases and suggest fixes"
    zh: "用理论分析案例并提出解决方案"
    zh-TW: "用理論分析個案並提出解決方案"
    ja: "理論でケースを分析し解決策を出す"
    ko: "이론으로 사례 분석하고 해결책 제시"
    vi: "Dùng lý thuyết phân tích tình huống và đề xuất giải pháp"
    ms: "Guna teori untuk analisis kes dan cadang penyelesaian"
    id: "Memakai teori untuk menganalisis kasus dan mengusulkan solusi"
    hi: "सिद्धांत से केस परखना और हल सुझाना"
  - en: "Work with a team to develop better ways of managing"
    zh: "与团队合作提出更好的管理做法"
    zh-TW: "與團隊合作提出更好的管理做法"
    ja: "チームでより良いマネジメントの方法を考える"
    ko: "팀과 함께 더 나은 관리 방식 개발"
    vi: "Làm việc nhóm để tìm cách quản lý tốt hơn"
    ms: "Bekerja dalam pasukan untuk bangunkan cara urus lebih baik"
    id: "Bekerja dalam tim untuk merumuskan cara manajemen yang lebih baik"
    hi: "टीम के साथ मैनेज करने के बेहतर तरीके निकालना"
