code: ABPL90404
year: 2027
learn:
  en: "Placemaking: designing shared public places with community participation, through case studies and practical exercises."
  zh: "场所营造：通过案例和实践练习，学习在社区参与下设计公共空间。"
  zh-TW: "場所營造：透過案例和實作練習，學習在社區參與下設計公共空間。"
  ja: "プレイスメイキング：事例と演習で、住民参加による公共空間づくりを学ぶ。"
  ko: "플레이스메이킹: 사례와 실습으로 주민 참여 공공공간 만들기를 배웁니다."
  vi: "Kiến tạo nơi chốn: thiết kế không gian công cộng với cộng đồng, qua tình huống và bài tập thực hành."
  ms: "Pembinaan tempat: mereka ruang awam bersama komuniti melalui kajian kes dan latihan."
  id: "Placemaking: merancang ruang publik bersama warga lewat studi kasus dan latihan praktis."
  hi: "प्लेसमेकिंग: केस स्टडी और अभ्यास से समुदाय की भागीदारी के साथ सार्वजनिक स्थान बनाना।"
outcomes:
  - en: "Analyse placemaking case studies"
    zh: "分析场所营造案例"
    zh-TW: "分析場所營造案例"
    ja: "プレイスメイキング事例を分析する"
    ko: "플레이스메이킹 사례 분석하기"
    vi: "Phân tích tình huống kiến tạo nơi chốn"
    ms: "Menganalisis kajian kes pembinaan tempat"
    id: "Menganalisis studi kasus placemaking"
    hi: "प्लेसमेकिंग केस स्टडी का विश्लेषण"
  - en: "Study your own neighbourhood as a place"
    zh: "把自己的社区当作场所来研究"
    zh-TW: "把自己的社區當作場所來研究"
    ja: "自分の地域を場所として調べる"
    ko: "내 동네를 장소로 연구하기"
    vi: "Nghiên cứu khu phố của bạn như một nơi chốn"
    ms: "Mengkaji kejiranan sendiri sebagai tempat"
    id: "Meneliti lingkungan sendiri sebagai tempat"
    hi: "अपने मोहल्ले का स्थान के रूप में अध्ययन"
