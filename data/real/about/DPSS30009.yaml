code: DPSS30009
year: 2026
learn:
  en: "The second half of Production Practice 3: another senior production role or independent project, assessed with Part A."
  zh: "制作实践3的后半：再担任一个主要制作岗位或独立项目，与A部分一起评分。"
  zh-TW: "製作實務3的後半：再擔任一個主要製作職位或獨立專題，與A部分一起評分。"
  ja: "制作実践3の後半。もう一つの主要な役割か独自プロジェクトを行い、パートAと合わせて評価。"
  ko: "제작 실습 3의 후반부. 또 하나의 주요 역할이나 독립 프로젝트, A와 함께 평가."
  vi: "Nửa sau của Production Practice 3: thêm một vai trò chính hoặc dự án, chấm cùng phần A."
  ms: "Separuh kedua Amalan Produksi 3: satu lagi peranan kanan atau projek, dinilai bersama A."
  id: "Paruh kedua Praktik Produksi 3: satu peran senior atau proyek lagi, dinilai bersama A."
  hi: "प्रोडक्शन प्रैक्टिस 3 का दूसरा भाग: एक और वरिष्ठ भूमिका या प्रोजेक्ट, भाग A के साथ मूल्यांकन।"
outcomes:
  - en: "Take a second senior role or project"
    zh: "承担第二个主要岗位或项目"
    zh-TW: "承擔第二個主要職位或專題"
    ja: "2つ目の主要な役割やプロジェクトを担う"
    ko: "두 번째 주요 역할이나 프로젝트 맡기"
    vi: "Đảm nhận vai trò hay dự án thứ hai"
    ms: "Pegang peranan atau projek kedua"
    id: "Mengambil peran atau proyek kedua"
    hi: "दूसरी वरिष्ठ भूमिका या प्रोजेक्ट लेना"
  - en: "Build on lessons from Part A"
    zh: "在A部分的经验上提升"
    zh-TW: "在A部分的經驗上提升"
    ja: "パートAの学びを生かす"
    ko: "A의 교훈을 바탕으로 발전하기"
    vi: "Phát huy bài học từ phần A"
    ms: "Bina atas pengajaran Bahagian A"
    id: "Membangun dari pelajaran Bagian A"
    hi: "भाग A की सीख पर आगे बढ़ना"
  - en: "Show readiness for professional work"
    zh: "展示进入行业的准备"
    zh-TW: "展現進入產業的準備"
    ja: "プロとして働く準備を示す"
    ko: "전문 업무 준비를 보여주기"
    vi: "Thể hiện sẵn sàng làm nghề"
    ms: "Tunjuk kesediaan kerja profesional"
    id: "Menunjukkan kesiapan kerja profesional"
    hi: "पेशेवर काम की तैयारी दिखाना"
