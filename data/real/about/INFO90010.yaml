code: INFO90010
year: 2027
learn:
  en: "A group project using design thinking to find a real-world problem and build a technology prototype to solve it."
  zh: "小组项目：用设计思维找到真实问题，并开发技术原型来解决。"
  zh-TW: "小組專題：用設計思考找出真實問題，並開發技術原型來解決。"
  ja: "デザイン思考で実課題を見つけ、技術プロトタイプで解決するグループ課題。"
  ko: "디자인 씽킹으로 실제 문제를 찾고 기술 프로토타입으로 해결하는 팀 프로젝트."
  vi: "Dự án nhóm dùng tư duy thiết kế để tìm vấn đề thực tế và làm nguyên mẫu công nghệ giải quyết."
  ms: "Projek berkumpulan guna pemikiran reka bentuk untuk cari masalah sebenar dan bina prototaip teknologi."
  id: "Proyek kelompok dengan design thinking untuk menemukan masalah nyata dan membuat prototipe teknologi."
  hi: "डिज़ाइन थिंकिंग से असली समस्या ढूँढकर टेक प्रोटोटाइप बनाने वाला ग्रुप प्रोजेक्ट।"
outcomes:
  - en: "Discover customer problems and test ideas with them"
    zh: "发掘用户问题并验证想法"
    zh-TW: "發掘使用者問題並驗證想法"
    ja: "顧客の課題を見つけアイデアを検証する"
    ko: "고객 문제를 찾고 아이디어 검증하기"
    vi: "Tìm vấn đề của khách hàng và kiểm chứng ý tưởng"
    ms: "Mengenal pasti masalah pelanggan dan menguji idea"
    id: "Menemukan masalah pelanggan dan menguji ide"
    hi: "ग्राहकों की समस्या खोजना और आइडिया परखना"
  - en: "Build and pitch a working tech prototype"
    zh: "开发并展示可用的技术原型"
    zh-TW: "開發並展示可用的技術原型"
    ja: "動く技術プロトタイプを作り発表する"
    ko: "작동하는 기술 프로토타입 만들고 발표하기"
    vi: "Làm và trình bày nguyên mẫu công nghệ chạy được"
    ms: "Membina dan membentangkan prototaip teknologi berfungsi"
    id: "Membangun dan mempresentasikan prototipe yang berfungsi"
    hi: "काम करने वाला टेक प्रोटोटाइप बनाना और पेश करना"
