code: INFO20003
year: 2026
learn:
  en: "How databases are designed and work, with lots of practice writing SQL."
  zh: "数据库怎么设计和运作，大量练习写SQL。"
  zh-TW: "資料庫怎麼設計和運作，大量練習寫SQL。"
  ja: "データベースの設計と仕組みを、SQLをたくさん書きながら学ぶ。"
  ko: "데이터베이스의 설계와 작동 원리, SQL 작성 연습을 많이 한다."
  vi: "Cơ sở dữ liệu được thiết kế và hoạt động ra sao, luyện viết SQL nhiều."
  ms: "Cara pangkalan data direka dan berfungsi, dengan banyak latihan menulis SQL."
  id: "Cara database dirancang dan bekerja, dengan banyak latihan menulis SQL."
  hi: "डेटाबेस कैसे डिज़ाइन होते हैं और काम करते हैं, SQL लिखने की खूब प्रैक्टिस के साथ।"
outcomes:
  - en: "Model data for a database"
    zh: "为数据库设计数据模型"
    zh-TW: "為資料庫設計資料模型"
    ja: "データベース用にデータをモデル化する"
    ko: "데이터베이스용 데이터 모델링"
    vi: "Mô hình hóa dữ liệu cho CSDL"
    ms: "Modelkan data untuk pangkalan data"
    id: "Memodelkan data untuk database"
    hi: "डेटाबेस के लिए डेटा मॉडल बनाना"
  - en: "Write efficient SQL queries"
    zh: "写高效的SQL查询"
    zh-TW: "寫高效率的SQL查詢"
    ja: "効率的なSQLクエリを書く"
    ko: "효율적인 SQL 쿼리 작성"
    vi: "Viết truy vấn SQL hiệu quả"
    ms: "Tulis pertanyaan SQL yang cekap"
    id: "Menulis query SQL yang efisien"
    hi: "कुशल SQL क्वेरी लिखना"
  - en: "Use transactions and tune slow queries"
    zh: "使用事务、优化慢查询"
    zh-TW: "使用交易、優化慢查詢"
    ja: "トランザクションを使い遅いクエリを改善する"
    ko: "트랜잭션 사용과 느린 쿼리 튜닝"
    vi: "Dùng transaction và tối ưu truy vấn chậm"
    ms: "Guna transaksi dan tala pertanyaan perlahan"
    id: "Memakai transaksi dan mengoptimalkan query lambat"
    hi: "ट्रांज़ैक्शन इस्तेमाल करना, धीमी क्वेरी सुधारना"
