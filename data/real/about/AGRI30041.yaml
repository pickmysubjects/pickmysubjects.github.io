code: AGRI30041
year: 2026
learn:
  en: "An 80-hour placement with a host organisation you find yourself, plus workshops and reflective writing on the work."
  zh: "自己联系机构完成80小时实习，加上工作坊和对工作的反思写作。"
  zh-TW: "自行聯繫機構完成80小時實習，加上工作坊與對工作的反思寫作。"
  ja: "自分で探した受け入れ先での80時間の実習と、ワークショップ、振り返りの執筆。"
  ko: "직접 구한 기관에서 80시간 실습, 워크숍과 업무 성찰 글쓰기."
  vi: "Thực tập 80 giờ ở nơi tự tìm, kèm hội thảo và bài viết suy ngẫm."
  ms: "Penempatan 80 jam di organisasi yang anda cari sendiri, dengan bengkel dan penulisan refleksi."
  id: "Magang 80 jam di organisasi yang dicari sendiri, plus lokakarya dan tulisan refleksi."
  hi: "ख़ुद ढूँढी संस्था में 80 घंटे की इंटर्नशिप, वर्कशॉप और काम पर चिंतनशील लेखन।"
outcomes:
  - en: "Apply your studies in a workplace"
    zh: "在职场运用所学"
    zh-TW: "在職場運用所學"
    ja: "学んだことを職場で生かす"
    ko: "배운 것을 직장에서 활용하기"
    vi: "Vận dụng kiến thức ở nơi làm việc"
    ms: "Guna ilmu di tempat kerja"
    id: "Menerapkan ilmu di tempat kerja"
    hi: "पढ़ाई को कार्यस्थल पर लागू करना"
  - en: "Learn about careers by interviewing staff"
    zh: "通过访谈员工了解职业道路"
    zh-TW: "透過訪談員工了解職涯"
    ja: "社員への聞き取りでキャリアを知る"
    ko: "직원 인터뷰로 진로 알아보기"
    vi: "Tìm hiểu nghề qua phỏng vấn nhân viên"
    ms: "Kenali kerjaya melalui temu bual"
    id: "Mengenal karier lewat wawancara"
    hi: "कर्मचारियों से बात कर करियर समझना"
  - en: "Reflect on and present your placement"
    zh: "反思并展示实习经历"
    zh-TW: "反思並發表實習經歷"
    ja: "実習を振り返り発表する"
    ko: "실습을 돌아보고 발표하기"
    vi: "Suy ngẫm và trình bày kỳ thực tập"
    ms: "Renung dan bentang penempatan"
    id: "Merefleksikan dan memaparkan magang"
    hi: "इंटर्नशिप पर चिंतन कर प्रस्तुति देना"
