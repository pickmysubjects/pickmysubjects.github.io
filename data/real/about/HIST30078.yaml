code: HIST30078
year: 2026
learn:
  en: "Indigenous histories of Australian cities, through sites like Coranderrk, objects, archives and Indigenous-led storytelling."
  zh: "澳洲城市中的原住民历史，通过科兰德尔克等地点、器物、档案和原住民主导的叙事来探讨。"
  zh-TW: "澳洲城市中的原住民歷史，透過科蘭德爾克等地點、器物、檔案和原住民主導的敘事來探討。"
  ja: "コランダークなどの場所、物、記録、先住民自身の語りから、オーストラリアの都市の先住民史を学ぶ。"
  ko: "코랜더크 같은 장소, 사물, 기록, 원주민 주도의 이야기로 호주 도시의 원주민 역사를 배운다."
  vi: "Lịch sử bản địa của các thành phố Úc qua địa điểm như Coranderrk, đồ vật, lưu trữ và lời kể do người bản địa dẫn dắt."
  ms: "Sejarah Orang Asli di bandar Australia melalui tapak seperti Coranderrk, objek, arkib dan penceritaan dipimpin Orang Asli."
  id: "Sejarah Pribumi di kota-kota Australia lewat situs seperti Coranderrk, benda, arsip dan penuturan yang dipimpin Pribumi."
  hi: "ऑस्ट्रेलियाई शहरों का आदिवासी इतिहास, कोरैंडरक जैसी जगहों, वस्तुओं, अभिलेखों और आदिवासी-नेतृत्व वाली कहानियों से।"
outcomes:
  - en: "Read cities as places of Indigenous history"
    zh: "把城市当作原住民历史的场所来解读"
    zh-TW: "把城市當作原住民歷史的場所來解讀"
    ja: "都市を先住民の歴史の場として読む"
    ko: "도시를 원주민 역사의 장소로 읽기"
    vi: "Đọc thành phố như nơi chứa lịch sử bản địa"
    ms: "Tafsir bandar sebagai tempat sejarah Orang Asli"
    id: "Membaca kota sebagai tempat sejarah Pribumi"
    hi: "शहरों को आदिवासी इतिहास की जगह के रूप में पढ़ना"
  - en: "Use archives, objects and stories as sources"
    zh: "把档案、器物和口述故事当作史料"
    zh-TW: "把檔案、器物和口述故事當作史料"
    ja: "記録、物、語りを史料として使う"
    ko: "기록, 사물, 이야기를 사료로 활용하기"
    vi: "Dùng lưu trữ, đồ vật và câu chuyện làm nguồn"
    ms: "Guna arkib, objek dan cerita sebagai sumber"
    id: "Memakai arsip, benda dan cerita sebagai sumber"
    hi: "अभिलेखों, वस्तुओं और कहानियों को स्रोत बनाना"
  - en: "Reflect on truth-telling about the past"
    zh: "反思关于过去的真相讲述"
    zh-TW: "反思關於過去的真相講述"
    ja: "過去について真実を語ることを考える"
    ko: "과거에 대한 진실 말하기 성찰하기"
    vi: "Suy ngẫm về việc nói sự thật về quá khứ"
    ms: "Renungkan penceritaan kebenaran tentang masa lalu"
    id: "Merefleksikan pengungkapan kebenaran masa lalu"
    hi: "अतीत के बारे में सच कहने पर विचार करना"
