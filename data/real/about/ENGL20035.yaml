code: ENGL20035
year: 2026
learn:
  en: "Key debates in today's literary theory, including Black studies, media theory, climate criticism and decolonial thought."
  zh: "当代文学理论的重要论争，包括黑人研究、媒介理论、气候批评和去殖民思想。"
  zh-TW: "當代文學理論的重要論爭，包括黑人研究、媒介理論、氣候批評和去殖民思想。"
  ja: "ブラック・スタディーズ、メディア論、気候批評、脱植民地思想など、現代文学理論の主な論争を学ぶ。"
  ko: "흑인 연구, 미디어 이론, 기후 비평, 탈식민 사상 등 오늘날 문학 이론의 주요 논쟁을 배운다."
  vi: "Các tranh luận chính trong lý thuyết văn học hiện nay, gồm nghiên cứu người da đen, lý thuyết truyền thông, phê bình khí hậu và tư tưởng giải thực dân."
  ms: "Perdebatan utama teori sastera masa kini, termasuk kajian kulit hitam, teori media, kritikan iklim dan pemikiran dekolonial."
  id: "Perdebatan utama teori sastra masa kini, termasuk kajian kulit hitam, teori media, kritik iklim dan pemikiran dekolonial."
  hi: "आज के साहित्य सिद्धांत की मुख्य बहसें, जिनमें ब्लैक स्टडीज़, मीडिया सिद्धांत, जलवायु आलोचना और विउपनिवेशी चिंतन शामिल हैं।"
outcomes:
  - en: "Explain major positions in literary theory"
    zh: "说明文学理论中的主要立场"
    zh-TW: "說明文學理論中的主要立場"
    ja: "文学理論の主な立場を説明する"
    ko: "문학 이론의 주요 입장 설명하기"
    vi: "Giải thích các lập trường chính trong lý thuyết văn học"
    ms: "Terangkan pendirian utama dalam teori sastera"
    id: "Menjelaskan posisi utama dalam teori sastra"
    hi: "साहित्य सिद्धांत के मुख्य मत समझाना"
  - en: "Compare theorists on a shared question"
    zh: "比较不同理论家对同一问题的看法"
    zh-TW: "比較不同理論家對同一問題的看法"
    ja: "同じ問いへの理論家の答えを比べる"
    ko: "같은 질문에 대한 이론가들 비교하기"
    vi: "So sánh các nhà lý thuyết về cùng một câu hỏi"
    ms: "Bandingkan ahli teori tentang soalan yang sama"
    id: "Membandingkan para teoretikus pada pertanyaan yang sama"
    hi: "एक ही सवाल पर सिद्धांतकारों की तुलना करना"
  - en: "Apply theory to read literary texts"
    zh: "运用理论阅读文学作品"
    zh-TW: "運用理論閱讀文學作品"
    ja: "理論を使って文学作品を読む"
    ko: "이론으로 문학 작품 읽기"
    vi: "Áp dụng lý thuyết để đọc văn bản văn học"
    ms: "Gunakan teori untuk membaca teks sastera"
    id: "Menerapkan teori untuk membaca teks sastra"
    hi: "साहित्यिक पाठ पढ़ने में सिद्धांत लागू करना"
