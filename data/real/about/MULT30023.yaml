code: MULT30023
year: 2026
learn:
  en: "How films, games, comics, music videos and art picture science and engineering, and what that does to public understanding."
  zh: "电影、游戏、漫画、音乐录影带和艺术如何呈现科学与工程，又如何影响大众的理解。"
  zh-TW: "電影、遊戲、漫畫、音樂錄影帶和藝術如何呈現科學與工程，又如何影響大眾的理解。"
  ja: "映画、ゲーム、コミック、MV、絵画が科学と工学をどう描き、人々の理解にどう影響するか。"
  ko: "영화, 게임, 만화, 뮤직비디오, 미술이 과학과 공학을 어떻게 그리고, 대중의 이해에 어떤 영향을 주는가."
  vi: "Phim, trò chơi, truyện tranh, MV và hội họa khắc họa khoa học, kỹ thuật ra sao và ảnh hưởng thế nào tới hiểu biết công chúng."
  ms: "Cara filem, permainan, komik, video muzik dan seni menggambarkan sains dan kejuruteraan, serta kesannya pada kefahaman awam."
  id: "Cara film, gim, komik, video musik dan seni menggambarkan sains dan rekayasa, serta dampaknya pada pemahaman publik."
  hi: "फ़िल्में, गेम, कॉमिक्स, म्यूज़िक वीडियो और कला विज्ञान व इंजीनियरिंग को कैसे दिखाते हैं, और इससे लोगों की समझ पर क्या असर होता है।"
outcomes:
  - en: "Analyse how screen media portray science and technology"
    zh: "分析影视媒体如何描绘科学技术"
    zh-TW: "分析影視媒體如何描繪科學技術"
    ja: "映像メディアが科学技術をどう描くか分析する"
    ko: "영상 미디어가 과학기술을 그리는 방식 분석하기"
    vi: "Phân tích cách phim ảnh khắc họa khoa học công nghệ"
    ms: "Analisis cara media skrin menggambarkan sains dan teknologi"
    id: "Menganalisis cara media layar menggambarkan sains dan teknologi"
    hi: "स्क्रीन मीडिया में विज्ञान-तकनीक के चित्रण का विश्लेषण करना"
  - en: "Notice gaps such as missing women scientists on screen"
    zh: "发现荧幕上女性科学家缺席等问题"
    zh-TW: "發現螢幕上女性科學家缺席等問題"
    ja: "画面に女性科学者が少ないといった偏りに気づく"
    ko: "화면 속 여성 과학자 부재 같은 공백 알아차리기"
    vi: "Nhận ra khoảng trống như thiếu vắng nhà khoa học nữ trên màn ảnh"
    ms: "Kenal pasti jurang seperti kurangnya saintis wanita di skrin"
    id: "Menyadari celah seperti minimnya ilmuwan perempuan di layar"
    hi: "परदे पर महिला वैज्ञानिकों की कमी जैसी खामियाँ पहचानना"
  - en: "Discuss technology across disciplines in class"
    zh: "在课堂上跨学科讨论科技"
    zh-TW: "在課堂上跨學科討論科技"
    ja: "分野を越えて技術について議論する"
    ko: "여러 전공 관점에서 기술 토론하기"
    vi: "Thảo luận về công nghệ từ nhiều ngành học"
    ms: "Bincangkan teknologi merentas bidang dalam kelas"
    id: "Mendiskusikan teknologi lintas disiplin di kelas"
    hi: "कक्षा में अलग-अलग विषयों की नज़र से तकनीक पर चर्चा करना"
