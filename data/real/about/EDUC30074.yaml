code: EDUC30074
year: 2027
learn:
  en: "How social movements use education to push for justice and change, with Australian and international cases."
  zh: "通过澳大利亚和国际案例，了解社会运动如何借助教育推动公正与变革。"
  zh-TW: "透過澳洲和國際案例，了解社會運動如何借助教育推動正義與變革。"
  ja: "オーストラリアと海外の事例から、社会運動が教育を通じて正義と変化を求める方法を学ぶ。"
  ko: "호주와 해외 사례로 사회운동이 교육을 통해 정의와 변화를 추구하는 방식을 배운다."
  vi: "Các phong trào xã hội dùng giáo dục để đòi công bằng và thay đổi, qua ví dụ ở Úc và quốc tế."
  ms: "Cara gerakan sosial menggunakan pendidikan untuk menuntut keadilan dan perubahan, melalui kes Australia dan antarabangsa."
  id: "Cara gerakan sosial memakai pendidikan untuk memperjuangkan keadilan dan perubahan, lewat kasus Australia dan internasional."
  hi: "ऑस्ट्रेलियाई और अंतरराष्ट्रीय उदाहरणों से समझना कि सामाजिक आंदोलन न्याय और बदलाव के लिए शिक्षा का कैसे इस्तेमाल करते हैं।"
outcomes:
  - en: "Explain social movements' role in education policy"
    zh: "解释社会运动在教育政策中的作用"
    zh-TW: "解釋社會運動在教育政策中的作用"
    ja: "教育政策における社会運動の役割を説明する"
    ko: "교육 정책에서 사회운동의 역할 설명하기"
    vi: "Giải thích vai trò của phong trào xã hội trong chính sách giáo dục"
    ms: "Terangkan peranan gerakan sosial dalam dasar pendidikan"
    id: "Menjelaskan peran gerakan sosial dalam kebijakan pendidikan"
    hi: "शिक्षा नीति में सामाजिक आंदोलनों की भूमिका समझाना"
  - en: "Analyse education as a tool for social change"
    zh: "分析教育如何成为社会变革的工具"
    zh-TW: "分析教育如何成為社會變革的工具"
    ja: "社会変革の手段としての教育を分析する"
    ko: "사회 변화의 수단으로서 교육 분석하기"
    vi: "Phân tích giáo dục như công cụ thay đổi xã hội"
    ms: "Analisis pendidikan sebagai alat perubahan sosial"
    id: "Menganalisis pendidikan sebagai alat perubahan sosial"
    hi: "सामाजिक बदलाव के साधन के रूप में शिक्षा का विश्लेषण करना"
  - en: "Examine students and teachers as agents of change"
    zh: "探讨学生和教师作为变革推动者的角色"
    zh-TW: "探討學生和教師作為變革推動者的角色"
    ja: "変化の担い手としての学生と教師を考える"
    ko: "변화 주체로서 학생과 교사 살펴보기"
    vi: "Xem xét vai trò của học sinh và giáo viên trong thay đổi"
    ms: "Teliti pelajar dan pendidik sebagai agen perubahan"
    id: "Menelaah siswa dan pendidik sebagai agen perubahan"
    hi: "बदलाव लाने वालों के रूप में छात्रों व शिक्षकों को परखना"
