code: DNCE20034
year: 2026
learn:
  en: "Dance theatre: daily technique plus voice and movement work, learning repertory and recreating dance scores."
  zh: "舞蹈剧场：每日技术训练加声音与动作，学习保留剧目并重现舞谱。"
  zh-TW: "舞蹈劇場：每日技術訓練加聲音與動作，學習保留劇目並重現舞譜。"
  ja: "ダンスシアター：毎日の技術訓練に声と動きを加え、レパートリーと舞踊譜の再現を学ぶ。"
  ko: "댄스 시어터: 매일 테크닉에 목소리와 움직임을 더해 레퍼토리와 무보 재현을 배운다."
  vi: "Múa kịch: tập kỹ thuật hằng ngày cùng giọng nói và chuyển động, học tiết mục và tái hiện vũ phổ."
  ms: "Teater tari: teknik harian serta suara dan gerak, belajar repertori dan mencipta semula skor tarian."
  id: "Teater tari: teknik harian plus suara dan gerak, belajar repertoar dan merekonstruksi skor tari."
  hi: "डांस थिएटर: रोज़ की तकनीक के साथ आवाज़ और गति, रिपर्टरी सीखना और डांस स्कोर दोबारा बनाना।"
outcomes:
  - en: "Combine voice and movement in performance"
    zh: "在表演中结合声音与动作"
    zh-TW: "在表演中結合聲音與動作"
    ja: "声と動きを組み合わせて演じる"
    ko: "공연에서 목소리와 움직임 결합하기"
    vi: "Kết hợp giọng nói và chuyển động khi diễn"
    ms: "Gabungkan suara dan gerak dalam persembahan"
    id: "Memadukan suara dan gerak dalam pertunjukan"
    hi: "प्रस्तुति में आवाज़ और गति को जोड़ना"
  - en: "Interpret and recreate existing choreography"
    zh: "诠释并重现已有的编舞"
    zh-TW: "詮釋並重現既有的編舞"
    ja: "既存の振付を解釈し再現する"
    ko: "기존 안무를 해석하고 재현하기"
    vi: "Diễn giải và tái hiện biên đạo có sẵn"
    ms: "Tafsir dan cipta semula koreografi sedia ada"
    id: "Menafsirkan dan merekonstruksi koreografi"
    hi: "मौजूदा कोरियोग्राफ़ी की व्याख्या और पुनर्रचना"
  - en: "Keep a critical journal of your progress"
    zh: "写批判性的学习日志"
    zh-TW: "寫批判性的學習日誌"
    ja: "自分の成長を批評的に日誌に記す"
    ko: "자기 발전을 비판적으로 일지에 기록하기"
    vi: "Viết nhật ký phản biện về tiến bộ của mình"
    ms: "Simpan jurnal kritis tentang kemajuan diri"
    id: "Menulis jurnal kritis tentang kemajuan"
    hi: "अपनी प्रगति की आलोचनात्मक डायरी रखना"
