code: HIST30076
year: 2026
learn:
  en: "The Stalin years in the Soviet Union, 1928 to 1953, and the big debates over what Stalinism was and why it happened."
  zh: "1928至1953年苏联的斯大林时期，以及关于斯大林主义本质与成因的重大争论。"
  zh-TW: "1928至1953年蘇聯的史達林時期，以及關於史達林主義本質與成因的重大爭論。"
  ja: "1928〜1953年のソ連のスターリン時代と、スターリニズムとは何か、なぜ生まれたかをめぐる大きな論争を学ぶ。"
  ko: "1928~1953년 소련의 스탈린 시대와, 스탈린주의가 무엇이고 왜 생겼는지에 관한 큰 논쟁을 배운다."
  vi: "Thời kỳ Stalin ở Liên Xô 1928–1953, và các tranh luận lớn về bản chất cũng như nguyên nhân của chủ nghĩa Stalin."
  ms: "Zaman Stalin di Kesatuan Soviet, 1928 hingga 1953, dan perdebatan besar tentang apa itu Stalinisme dan puncanya."
  id: "Masa Stalin di Uni Soviet, 1928 hingga 1953, dan perdebatan besar tentang apa itu Stalinisme dan penyebabnya."
  hi: "सोवियत संघ में स्टालिन के साल, 1928 से 1953, और स्टालिनवाद क्या था व क्यों हुआ, इस पर बड़ी बहसें।"
outcomes:
  - en: "Apply current research on the Stalin years"
    zh: "运用关于斯大林时期的最新研究"
    zh-TW: "運用關於史達林時期的最新研究"
    ja: "スターリン時代の最新研究を活用する"
    ko: "스탈린 시대에 관한 최신 연구 활용하기"
    vi: "Vận dụng nghiên cứu hiện nay về thời kỳ Stalin"
    ms: "Aplikasikan kajian terkini tentang zaman Stalin"
    id: "Menerapkan riset terkini tentang masa Stalin"
    hi: "स्टालिन के दौर पर मौजूदा शोध का इस्तेमाल करना"
  - en: "Analyse how sources and politics shape our view"
    zh: "分析史料和政治如何影响我们的认识"
    zh-TW: "分析史料和政治如何影響我們的認識"
    ja: "史料と政治が私たちの理解をどう左右するか分析する"
    ko: "사료와 정치가 우리의 이해에 미치는 영향 분석하기"
    vi: "Phân tích nguồn sử liệu và chính trị định hình cách nhìn của ta ra sao"
    ms: "Analisis cara sumber dan politik membentuk pandangan kita"
    id: "Menganalisis cara sumber dan politik membentuk pandangan kita"
    hi: "स्रोत और राजनीति हमारी समझ को कैसे आकार देते हैं, विश्लेषण करना"
  - en: "Identify the factors driving Stalinist violence"
    zh: "找出推动斯大林式暴力的因素"
    zh-TW: "找出推動史達林式暴力的因素"
    ja: "スターリン体制の暴力を動かした要因を見極める"
    ko: "스탈린 체제 폭력을 이끈 요인 파악하기"
    vi: "Xác định các yếu tố thúc đẩy bạo lực thời Stalin"
    ms: "Kenal pasti faktor pendorong keganasan Stalinis"
    id: "Mengenali faktor pendorong kekerasan Stalinis"
    hi: "स्टालिनवादी हिंसा के पीछे के कारक पहचानना"
