code: DNCE20033
year: 2027
learn:
  en: "Creating your own solo dance piece, finding your own movement style, and filming and editing it."
  zh: "创作自己的独舞作品，找到个人的动作风格，并拍摄和剪辑成视频。"
  zh-TW: "創作自己的獨舞作品，找到個人的動作風格，並拍攝和剪輯成影片。"
  ja: "自分のソロダンス作品を作り、自分らしい動きを見つけ、撮影・編集する。"
  ko: "자신만의 솔로 춤 작품을 만들고 고유한 움직임 스타일을 찾아 영상으로 촬영·편집한다."
  vi: "Sáng tác tiết mục múa solo của riêng bạn, tìm phong cách chuyển động riêng, quay và dựng video."
  ms: "Cipta karya tarian solo sendiri, cari gaya gerak tersendiri, serta rakam dan sunting videonya."
  id: "Membuat karya tari solo sendiri, menemukan gaya gerak pribadi, lalu merekam dan menyunting videonya."
  hi: "अपना एकल नृत्य बनाना, अपनी मूवमेंट शैली खोजना, और उसे फ़िल्माकर एडिट करना।"
outcomes:
  - en: "Apply choreography principles to a solo"
    zh: "把编舞原理用于独舞"
    zh-TW: "把編舞原理用於獨舞"
    ja: "振付の原理をソロに生かす"
    ko: "안무 원리를 솔로에 적용하기"
    vi: "Áp dụng nguyên tắc biên đạo cho bài solo"
    ms: "Guna prinsip koreografi pada solo"
    id: "Menerapkan prinsip koreografi pada tarian solo"
    hi: "सोलो में कोरियोग्राफ़ी के सिद्धांत लागू करना"
  - en: "Capture a dance piece on video"
    zh: "把舞蹈作品拍成视频"
    zh-TW: "把舞蹈作品拍成影片"
    ja: "ダンス作品を映像に収める"
    ko: "춤 작품을 영상으로 담기"
    vi: "Ghi lại tiết mục múa bằng video"
    ms: "Rakam karya tarian dalam video"
    id: "Merekam karya tari dalam video"
    hi: "नृत्य को वीडियो में रिकॉर्ड करना"
  - en: "Reflect on and critique your own dance-making"
    zh: "反思并评价自己的舞蹈创作"
    zh-TW: "反思並評價自己的舞蹈創作"
    ja: "自分のダンス制作を振り返り評価する"
    ko: "자신의 춤 창작을 돌아보고 평가하기"
    vi: "Suy ngẫm và đánh giá quá trình sáng tác múa của mình"
    ms: "Renung dan nilai proses cipta tarian sendiri"
    id: "Merefleksikan dan menilai proses berkarya tari sendiri"
    hi: "अपने नृत्य-निर्माण पर विचार और आलोचना करना"
