code: CLAS10007
year: 2026
learn:
  en: "Follows Latin 1: harder grammar and longer literary and drama texts, read with some dictionary help."
  zh: "接续拉丁语 1：更难的语法，借助词典阅读更长的文学和戏剧文本。"
  zh-TW: "接續拉丁語 1：更難的文法，藉助詞典閱讀更長的文學和戲劇文本。"
  ja: "ラテン語1の続き。より難しい文法と、辞書を使って長めの文学・演劇作品を読む。"
  ko: "라틴어 1에 이어 더 어려운 문법, 사전을 활용해 더 긴 문학·희곡 읽기."
  vi: "Tiếp nối Latin 1: ngữ pháp khó hơn, đọc văn bản văn học và kịch dài hơn với từ điển."
  ms: "Sambungan Latin 1: tatabahasa lebih sukar dan teks sastera serta drama lebih panjang dengan bantuan kamus."
  id: "Lanjutan Latin 1: tata bahasa lebih sulit dan teks sastra serta drama lebih panjang dengan bantuan kamus."
  hi: "लैटिन 1 के आगे: कठिन व्याकरण, और शब्दकोश की मदद से लंबे साहित्यिक व नाटकीय पाठ।"
outcomes:
  - en: "Read original Latin texts with some dictionary help"
    zh: "借助词典阅读拉丁语原文"
    zh-TW: "藉助詞典閱讀拉丁語原文"
    ja: "辞書を使ってラテン語の原典を読む"
    ko: "사전을 활용해 라틴어 원문 읽기"
    vi: "Đọc nguyên bản tiếng Latinh với sự hỗ trợ của từ điển"
    ms: "Baca teks asal bahasa Latin dengan bantuan kamus"
    id: "Membaca teks asli bahasa Latin dengan bantuan kamus"
    hi: "शब्दकोश की मदद से मूल लैटिन पाठ पढ़ना"
  - en: "Analyse complex Latin grammar and sentence structure"
    zh: "分析复杂的拉丁语语法和句子结构"
    zh-TW: "分析複雜的拉丁語文法和句子結構"
    ja: "ラテン語の複雑な文法と構文を分析する"
    ko: "복잡한 라틴어 문법과 문장 구조 분석하기"
    vi: "Phân tích ngữ pháp và cấu trúc câu tiếng Latinh phức tạp"
    ms: "Analisis tatabahasa dan struktur ayat bahasa Latin yang kompleks"
    id: "Menganalisis tata bahasa dan struktur kalimat bahasa Latin yang rumit"
    hi: "जटिल लैटिन व्याकरण और वाक्य-रचना का विश्लेषण करना"
  - en: "Translate and interpret ancient literature"
    zh: "翻译并解读古代文学作品"
    zh-TW: "翻譯並解讀古代文學作品"
    ja: "古代の文学作品を訳し解釈する"
    ko: "고대 문학 작품 번역하고 해석하기"
    vi: "Dịch và diễn giải văn học cổ đại"
    ms: "Terjemah dan tafsir karya sastera kuno"
    id: "Menerjemahkan dan menafsirkan karya sastra kuno"
    hi: "प्राचीन साहित्य का अनुवाद और व्याख्या करना"
