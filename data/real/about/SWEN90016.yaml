code: SWEN90016
year: 2027
learn:
  en: "Managing software projects: processes, planning, estimation, quality, risk, configuration and teams."
  zh: "软件项目管理：开发流程、计划、估算、质量、风险、配置管理与团队。"
  zh-TW: "軟體專案管理：開發流程、規劃、估算、品質、風險、組態管理與團隊。"
  ja: "ソフトウェアプロジェクト管理：プロセス、計画、見積、品質、リスク、構成管理、チーム。"
  ko: "소프트웨어 프로젝트 관리: 프로세스, 계획, 추정, 품질, 위험, 형상 관리, 팀."
  vi: "Quản lý dự án phần mềm: quy trình, lập kế hoạch, ước lượng, chất lượng, rủi ro, cấu hình, đội nhóm."
  ms: "Mengurus projek perisian: proses, perancangan, anggaran, kualiti, risiko, konfigurasi dan pasukan."
  id: "Mengelola proyek perangkat lunak: proses, perencanaan, estimasi, kualitas, risiko, konfigurasi, tim."
  hi: "सॉफ़्टवेयर प्रोजेक्ट प्रबंधन: प्रक्रिया, योजना, अनुमान, गुणवत्ता, जोखिम, कॉन्फ़िगरेशन, टीम।"
outcomes:
  - en: "Plan, schedule and estimate a software project"
    zh: "为软件项目做计划、排期和估算"
    zh-TW: "為軟體專案做規劃、排程與估算"
    ja: "ソフト開発の計画・日程・見積を立てる"
    ko: "소프트웨어 프로젝트 계획·일정·추정하기"
    vi: "Lập kế hoạch, tiến độ và ước lượng dự án phần mềm"
    ms: "Merancang, menjadual dan menganggar projek perisian"
    id: "Merencanakan, menjadwalkan, dan mengestimasi proyek"
    hi: "सॉफ़्टवेयर प्रोजेक्ट की योजना, शेड्यूल और अनुमान बनाना"
  - en: "Choose a suitable development process for a team"
    zh: "为团队选择合适的开发流程"
    zh-TW: "為團隊選擇合適的開發流程"
    ja: "チームに合う開発プロセスを選ぶ"
    ko: "팀에 맞는 개발 프로세스 고르기"
    vi: "Chọn quy trình phát triển phù hợp cho nhóm"
    ms: "Memilih proses pembangunan sesuai untuk pasukan"
    id: "Memilih proses pengembangan yang cocok untuk tim"
    hi: "टीम के लिए सही विकास प्रक्रिया चुनना"
