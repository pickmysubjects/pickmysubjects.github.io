code: SCRN30005
year: 2026
learn:
  en: "Screen media and the environment: the energy and waste behind screens, and how film, TV and games respond to ecological crisis."
  zh: "影视媒体与环境：屏幕背后的能源与废弃物，以及电影、电视和游戏如何回应生态危机。"
  zh-TW: "影視媒體與環境：螢幕背後的能源與廢棄物，以及電影、電視和遊戲如何回應生態危機。"
  ja: "映像メディアと環境。スクリーンを支えるエネルギーと廃棄物、そして映画・テレビ・ゲームは生態系の危機にどう応えるか。"
  ko: "영상 미디어와 환경. 스크린 뒤의 에너지와 폐기물, 영화·TV·게임이 생태 위기에 응답하는 방식."
  vi: "Truyền thông màn ảnh và môi trường: năng lượng, rác thải sau màn hình, và phim, TV, trò chơi phản ứng với khủng hoảng sinh thái."
  ms: "Media skrin dan alam sekitar: tenaga dan sisa di sebalik skrin, serta cara filem, TV dan permainan bertindak balas terhadap krisis ekologi."
  id: "Media layar dan lingkungan: energi dan limbah di balik layar, serta cara film, TV dan gim merespons krisis ekologi."
  hi: "स्क्रीन मीडिया और पर्यावरण: स्क्रीन के पीछे की ऊर्जा और कचरा, और फ़िल्म, टीवी व गेम पारिस्थितिक संकट पर कैसे जवाब देते हैं।"
outcomes:
  - en: "Explain the physical footprint of digital media"
    zh: "说明数字媒体的实际环境足迹"
    zh-TW: "說明數位媒體的實際環境足跡"
    ja: "デジタルメディアの物理的な環境負荷を説明する"
    ko: "디지털 미디어의 물리적 환경 발자국 설명하기"
    vi: "Giải thích dấu chân môi trường của truyền thông số"
    ms: "Terangkan jejak fizikal media digital"
    id: "Menjelaskan jejak fisik media digital"
    hi: "डिजिटल मीडिया के भौतिक पर्यावरणीय असर को समझाना"
  - en: "Analyse eco-themed film, TV and games"
    zh: "分析生态主题的电影、电视和游戏"
    zh-TW: "分析生態主題的電影、電視和遊戲"
    ja: "環境をテーマにした映画、テレビ、ゲームを分析する"
    ko: "생태 주제의 영화, TV, 게임 분석하기"
    vi: "Phân tích phim, TV, trò chơi chủ đề sinh thái"
    ms: "Analisis filem, TV dan permainan bertema ekologi"
    id: "Menganalisis film, TV dan gim bertema ekologi"
    hi: "पर्यावरण विषयक फ़िल्म, टीवी और गेम का विश्लेषण करना"
  - en: "Apply ecocritical ideas to media"
    zh: "把生态批评理论用于媒体分析"
    zh-TW: "把生態批評理論用於媒體分析"
    ja: "エコクリティシズムをメディアに当てはめる"
    ko: "생태비평 이론을 미디어에 적용하기"
    vi: "Áp dụng phê bình sinh thái vào truyền thông"
    ms: "Gunakan idea ekokritik pada media"
    id: "Menerapkan gagasan ekokritik pada media"
    hi: "मीडिया पर पर्यावरण-आलोचना के विचार लागू करना"
