code: ACCT10001
year: 2026
learn:
  en: "How accounting works in business and markets, and how to read and use financial reports for decisions."
  zh: "会计在企业和市场里的作用，以及怎么读懂和使用财务报表。"
  zh-TW: "會計在企業和市場中的作用，以及如何讀懂和使用財務報表。"
  ja: "ビジネスや市場で会計がどう機能するか、財務報告を読んで意思決定に使う方法。"
  ko: "비즈니스와 시장에서 회계가 어떻게 작동하는지, 재무 보고서를 읽고 의사결정에 활용하는 법."
  vi: "Kế toán vận hành thế nào trong doanh nghiệp và thị trường, cách đọc và dùng báo cáo tài chính để ra quyết định."
  ms: "Cara perakaunan berfungsi dalam perniagaan dan pasaran, serta cara membaca dan guna laporan kewangan untuk keputusan."
  id: "Cara akuntansi bekerja di bisnis dan pasar, serta cara membaca dan memakai laporan keuangan untuk keputusan."
  hi: "बिज़नेस और मार्केट में अकाउंटिंग कैसे काम करती है, और फ़ैसलों के लिए फ़ाइनेंशियल रिपोर्ट कैसे पढ़ें और इस्तेमाल करें।"
outcomes:
  - en: "Read and interpret the main financial statements"
    zh: "读懂并分析主要财务报表"
    zh-TW: "讀懂並分析主要財務報表"
    ja: "主要な財務諸表を読み解く"
    ko: "주요 재무제표를 읽고 해석하기"
    vi: "Đọc và phân tích các báo cáo tài chính chính"
    ms: "Membaca dan mentafsir penyata kewangan utama"
    id: "Membaca dan menafsirkan laporan keuangan utama"
    hi: "मुख्य फ़ाइनेंशियल स्टेटमेंट पढ़ना और समझना"
  - en: "Use cost and revenue data for budgets and planning"
    zh: "用成本和收入数据做预算和规划"
    zh-TW: "用成本和收入資料做預算和規劃"
    ja: "コストと収益のデータを予算や計画に使う"
    ko: "비용·수익 데이터로 예산과 계획 세우기"
    vi: "Dùng dữ liệu chi phí và doanh thu để lập ngân sách, kế hoạch"
    ms: "Guna data kos dan hasil untuk bajet dan perancangan"
    id: "Memakai data biaya dan pendapatan untuk anggaran dan perencanaan"
    hi: "बजट और प्लानिंग के लिए लागत और रेवेन्यू डेटा का उपयोग"
  - en: "Spot the strengths and limits of accounting info"
    zh: "判断会计信息的优点和局限"
    zh-TW: "判斷會計資訊的優點和局限"
    ja: "会計情報の強みと限界を見極める"
    ko: "회계 정보의 장점과 한계 파악하기"
    vi: "Nhận ra ưu điểm và hạn chế của thông tin kế toán"
    ms: "Kenal pasti kekuatan dan had maklumat perakaunan"
    id: "Mengenali kelebihan dan batasan info akuntansi"
    hi: "अकाउंटिंग जानकारी की खूबियाँ और सीमाएँ पहचानना"
