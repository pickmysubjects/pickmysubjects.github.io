code: INDO20015
year: 2026
learn:
  en: "Modern Indonesian novels, stories, films and documentaries, and what they show about the country's changes since independence."
  zh: "印尼现代小说、故事、电影和纪录片，以及它们反映的国家变迁。"
  zh-TW: "印尼現代小說、故事、電影和紀錄片，以及它們反映的國家變遷。"
  ja: "インドネシアの近代小説・物語・映画・ドキュメンタリーと、それらが映す国の変化。"
  ko: "인도네시아 현대 소설·이야기·영화·다큐멘터리와 그 속에 비친 나라의 변화."
  vi: "Tiểu thuyết, truyện, phim và phim tài liệu Indonesia hiện đại, và những đổi thay của đất nước mà chúng phản ánh."
  ms: "Novel, cerita, filem dan dokumentari moden Indonesia, serta perubahan negara yang dipaparkannya."
  id: "Novel, cerpen, film dan dokumenter Indonesia modern, serta perubahan bangsa yang tercermin di dalamnya."
  hi: "आधुनिक इंडोनेशियाई उपन्यास, कहानियाँ, फ़िल्में और वृत्तचित्र, और उनमें दिखते देश के बदलाव।"
outcomes:
  - en: "Analyse Indonesian novels and films"
    zh: "分析印尼小说和电影"
    zh-TW: "分析印尼小說和電影"
    ja: "インドネシアの小説と映画を分析する"
    ko: "인도네시아 소설과 영화 분석하기"
    vi: "Phân tích tiểu thuyết và phim Indonesia"
    ms: "Analisis novel dan filem Indonesia"
    id: "Menganalisis novel dan film Indonesia"
    hi: "इंडोनेशियाई उपन्यासों और फ़िल्मों का विश्लेषण करना"
  - en: "Link works to moments in Indonesian history"
    zh: "把作品与印尼历史节点联系起来"
    zh-TW: "把作品與印尼歷史節點聯繫起來"
    ja: "作品をインドネシア史の出来事と結びつける"
    ko: "작품을 인도네시아 역사의 순간과 연결하기"
    vi: "Liên hệ tác phẩm với các thời điểm lịch sử Indonesia"
    ms: "Kaitkan karya dengan detik sejarah Indonesia"
    id: "Mengaitkan karya dengan momen sejarah Indonesia"
    hi: "रचनाओं को इंडोनेशियाई इतिहास के पड़ावों से जोड़ना"
  - en: "Discuss and present your ideas in Indonesian"
    zh: "用印尼语讨论并展示观点"
    zh-TW: "用印尼語討論並展示觀點"
    ja: "インドネシア語で考えを議論し発表する"
    ko: "인도네시아어로 생각을 토론하고 발표하기"
    vi: "Thảo luận và trình bày ý kiến bằng tiếng Indonesia"
    ms: "Bincang dan bentangkan idea dalam bahasa Indonesia"
    id: "Membahas dan mempresentasikan gagasan dalam bahasa Indonesia"
    hi: "इंडोनेशियाई में अपने विचारों पर चर्चा और प्रस्तुति"
