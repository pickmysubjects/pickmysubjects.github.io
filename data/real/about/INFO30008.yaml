code: INFO30008
year: 2026
learn:
  en: "UX Design capstone: a team spots a real problem, builds a digital prototype and tests it properly with users."
  zh: "用户体验设计毕业项目：团队找出真实问题，制作数字原型并认真做用户测试。"
  zh-TW: "使用者經驗設計畢業專題：團隊找出真實問題，製作數位原型並確實做使用者測試。"
  ja: "UXデザインの総仕上げ。チームで実際の課題を見つけ、デジタル試作を作りユーザーで検証する。"
  ko: "UX 디자인 캡스톤. 팀이 실제 문제를 찾아 디지털 프로토타입을 만들고 사용자 평가를 한다."
  vi: "Môn tốt nghiệp UX: nhóm tìm vấn đề thật, làm prototype số và kiểm thử kỹ với người dùng."
  ms: "Kemuncak Reka Bentuk UX: pasukan kenal pasti masalah sebenar, bina prototaip digital dan uji dengan pengguna."
  id: "Capstone Desain UX: tim menemukan masalah nyata, membuat prototipe digital, dan mengujinya dengan pengguna."
  hi: "UX डिज़ाइन कैपस्टोन: टीम असली समस्या पहचानती है, डिजिटल प्रोटोटाइप बनाती है और यूज़र्स से परखती है।"
outcomes:
  - en: "Analyse a real problem area for a new technology"
    zh: "分析新技术要解决的真实问题领域"
    zh-TW: "分析新技術要解決的真實問題領域"
    ja: "新技術が扱う実際の課題領域を分析する"
    ko: "새 기술이 다룰 실제 문제 영역 분석하기"
    vi: "Phân tích vấn đề thực tế cho công nghệ mới"
    ms: "Analisis bidang masalah sebenar untuk teknologi baharu"
    id: "Menganalisis masalah nyata untuk teknologi baru"
    hi: "नई तकनीक के लिए असली समस्या क्षेत्र समझना"
  - en: "Build a digital prototype of a design concept"
    zh: "把设计概念做成数字原型"
    zh-TW: "把設計概念做成數位原型"
    ja: "設計コンセプトをデジタル試作にする"
    ko: "디자인 콘셉트를 디지털 프로토타입으로 만들기"
    vi: "Làm prototype số cho ý tưởng thiết kế"
    ms: "Bina prototaip digital konsep reka bentuk"
    id: "Membuat prototipe digital dari konsep desain"
    hi: "डिज़ाइन विचार का डिजिटल प्रोटोटाइप बनाना"
  - en: "Run a user-based evaluation and report it"
    zh: "开展用户评估并撰写报告"
    zh-TW: "進行使用者評估並撰寫報告"
    ja: "ユーザー評価を行い報告する"
    ko: "사용자 평가를 진행하고 보고하기"
    vi: "Đánh giá với người dùng và viết báo cáo"
    ms: "Jalankan penilaian pengguna dan laporkan"
    id: "Melakukan evaluasi pengguna dan melaporkannya"
    hi: "यूज़र आधारित मूल्यांकन कर रिपोर्ट देना"
