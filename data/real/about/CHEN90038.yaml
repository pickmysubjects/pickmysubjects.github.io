code: CHEN90038
year: 2027
learn:
  en: "How interface science shapes everyday products like creams, foods and drug carriers, and how products go from idea to market."
  zh: "界面科学如何决定乳霜、食品、药物载体等产品的性能，以及产品如何从想法走向市场。"
  zh-TW: "界面科學如何決定乳霜、食品、藥物載體等產品的性能，以及產品如何從構想走向市場。"
  ja: "界面科学がクリーム・食品・薬物キャリアなどの製品をどう形づくるか、そしてアイデアから市場までの流れ。"
  ko: "계면 과학이 크림·식품·약물 전달체 같은 제품을 어떻게 결정하는지, 그리고 아이디어에서 시장까지의 과정."
  vi: "Khoa học bề mặt quyết định các sản phẩm như kem, thực phẩm, chất mang thuốc ra sao, và quy trình đưa sản phẩm ra thị trường."
  ms: "Bagaimana sains antara muka membentuk produk seperti krim, makanan dan pembawa ubat, serta laluan produk dari idea ke pasaran."
  id: "Bagaimana ilmu antarmuka membentuk produk seperti krim, makanan dan pembawa obat, serta jalan produk dari ide ke pasar."
  hi: "इंटरफ़ेस विज्ञान क्रीम, भोजन और दवा वाहकों जैसे उत्पादों को कैसे आकार देता है, और उत्पाद विचार से बाज़ार तक कैसे पहुँचता है।"
outcomes:
  - en: "Explain how particle slurries and soft materials flow"
    zh: "解释颗粒浆料和软物质如何流动"
    zh-TW: "解釋顆粒漿料與軟物質如何流動"
    ja: "粒子スラリーやソフトマテリアルの流れ方を説明する"
    ko: "입자 슬러리와 연성 물질의 흐름 설명하기"
    vi: "Giải thích cách hỗn dịch hạt và vật liệu mềm chảy"
    ms: "Menerangkan cara buburan zarah dan bahan lembut mengalir"
    id: "Menjelaskan cara bubur partikel dan material lunak mengalir"
    hi: "कण घोल और नरम पदार्थों के प्रवाह को समझाना"
  - en: "Link surface chemistry to how a product is formulated and designed"
    zh: "把表面化学与产品配方和设计联系起来"
    zh-TW: "把表面化學與產品配方和設計連結起來"
    ja: "表面化学を製品の配合や設計に結びつける"
    ko: "표면 화학을 제품 배합과 설계에 연결하기"
    vi: "Liên hệ hóa học bề mặt với công thức và thiết kế sản phẩm"
    ms: "Mengaitkan kimia permukaan dengan formulasi dan reka bentuk produk"
    id: "Mengaitkan kimia permukaan dengan formulasi dan desain produk"
    hi: "सतह रसायन को उत्पाद के फ़ॉर्मूलेशन और डिज़ाइन से जोड़ना"
  - en: "Describe how products are made and tested with industry instruments"
    zh: "说明产品如何制造，以及如何用工业仪器检测"
    zh-TW: "說明產品如何製造，以及如何用工業儀器檢測"
    ja: "製品の製造方法と産業用機器による分析を説明する"
    ko: "제품 제조 방식과 산업 장비를 이용한 분석 설명하기"
    vi: "Mô tả cách sản xuất và phân tích sản phẩm bằng thiết bị công nghiệp"
    ms: "Menerangkan cara produk dihasilkan dan dianalisis dengan peralatan industri"
    id: "Menjelaskan cara produk dibuat dan dianalisis dengan instrumen industri"
    hi: "उत्पाद कैसे बनते हैं और औद्योगिक उपकरणों से उनकी जाँच कैसे होती है, बताना"
