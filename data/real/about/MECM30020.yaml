code: MECM30020
year: 2026
learn:
  en: "The history of feminist activism online, how social media shapes feminist and anti-feminist ideas, and movements around the world."
  zh: "网络女性主义运动的历史、社交媒体如何塑造女性主义与反女性主义思潮，以及世界各地的相关运动。"
  zh-TW: "網路女性主義運動的歷史、社群媒體如何形塑女性主義與反女性主義思潮，以及世界各地的相關運動。"
  ja: "ネット上のフェミニズム運動の歴史、SNSがフェミニズムと反フェミニズムの考えをどう形づくるか、世界各地の運動を学ぶ。"
  ko: "온라인 페미니즘 운동의 역사, 소셜 미디어가 페미니즘과 반페미니즘 사상을 어떻게 만드는지, 세계 곳곳의 운동을 배운다."
  vi: "Lịch sử hoạt động nữ quyền trên mạng, mạng xã hội định hình tư tưởng nữ quyền và chống nữ quyền ra sao, và các phong trào trên thế giới."
  ms: "Sejarah aktivisme feminis dalam talian, cara media sosial membentuk idea feminis dan anti-feminis, serta gerakan di seluruh dunia."
  id: "Sejarah aktivisme feminis daring, cara media sosial membentuk gagasan feminis dan anti-feminis, serta gerakan di berbagai belahan dunia."
  hi: "ऑनलाइन नारीवादी आंदोलनों का इतिहास, सोशल मीडिया नारीवादी और नारीवाद-विरोधी विचारों को कैसे आकार देता है, और दुनिया भर के आंदोलन।"
outcomes:
  - en: "Trace the history of digital feminism"
    zh: "梳理数字女性主义的历史"
    zh-TW: "梳理數位女性主義的歷史"
    ja: "デジタル・フェミニズムの歴史をたどる"
    ko: "디지털 페미니즘의 역사 짚어 보기"
    vi: "Lần theo lịch sử nữ quyền số"
    ms: "Jejaki sejarah feminisme digital"
    id: "Menelusuri sejarah feminisme digital"
    hi: "डिजिटल नारीवाद का इतिहास समझना"
  - en: "Assess feminist movements online and the backlash"
    zh: "评估网络女性主义运动及其遭遇的反弹"
    zh-TW: "評估網路女性主義運動及其遭遇的反彈"
    ja: "ネット上のフェミニズム運動と反発を評価する"
    ko: "온라인 페미니즘 운동과 그 반발 평가하기"
    vi: "Đánh giá các phong trào nữ quyền trực tuyến và sự phản ứng ngược"
    ms: "Nilai gerakan feminis dalam talian dan tentangan terhadapnya"
    id: "Menilai gerakan feminis daring dan reaksi baliknya"
    hi: "ऑनलाइन नारीवादी आंदोलनों और उनके विरोध का आकलन करना"
  - en: "Reflect on your own position as a researcher"
    zh: "反思自己作为研究者的立场"
    zh-TW: "反思自己作為研究者的立場"
    ja: "研究者としての自分の立場を振り返る"
    ko: "연구자로서 자신의 위치 성찰하기"
    vi: "Suy ngẫm về vị trí của bản thân khi làm nghiên cứu"
    ms: "Renung kedudukan diri sebagai penyelidik"
    id: "Merefleksikan posisi diri sebagai peneliti"
    hi: "एक शोधकर्ता के रूप में अपनी स्थिति पर विचार करना"
