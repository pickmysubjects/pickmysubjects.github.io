code: ANCW30011
year: 2026
learn:
  en: "How ancient Egypt, Greece and Rome imagined death and the afterlife, through literature, objects and art."
  zh: "古埃及、希腊和罗马如何想象死亡与来世，通过文学、器物和艺术来看。"
  zh-TW: "古埃及、希臘和羅馬如何想像死亡與來世，透過文學、器物和藝術來看。"
  ja: "古代エジプト・ギリシャ・ローマが死と来世をどう想像したかを、文学・遺物・美術から学ぶ。"
  ko: "고대 이집트, 그리스, 로마가 죽음과 내세를 어떻게 상상했는지 문학, 유물, 예술로 배운다."
  vi: "Ai Cập, Hy Lạp và La Mã cổ tưởng tượng về cái chết và thế giới bên kia ra sao, qua văn học, hiện vật và nghệ thuật."
  ms: "Cara Mesir, Yunani dan Rom kuno membayangkan kematian dan akhirat, melalui sastera, objek dan seni."
  id: "Cara Mesir, Yunani, dan Romawi kuno membayangkan kematian dan akhirat, lewat sastra, benda, dan seni."
  hi: "प्राचीन मिस्र, यूनान और रोम ने मृत्यु और परलोक की कल्पना कैसे की, साहित्य, वस्तुओं और कला के ज़रिए।"
outcomes:
  - en: "Compare ancient ideas of the afterlife"
    zh: "比较古代对来世的看法"
    zh-TW: "比較古代對來世的看法"
    ja: "古代の来世観を比べる"
    ko: "고대의 내세관 비교하기"
    vi: "So sánh quan niệm cổ đại về thế giới bên kia"
    ms: "Bandingkan idea kuno tentang akhirat"
    id: "Membandingkan gagasan kuno tentang akhirat"
    hi: "परलोक के प्राचीन विचारों की तुलना करना"
  - en: "Analyse funerary objects and monuments"
    zh: "分析丧葬器物与墓葬建筑"
    zh-TW: "分析喪葬器物與墓葬建築"
    ja: "葬送の遺物と墓碑を分析する"
    ko: "장례 유물과 기념물 분석하기"
    vi: "Phân tích đồ tùy táng và công trình mộ táng"
    ms: "Analisis objek dan monumen pengebumian"
    id: "Menganalisis benda dan monumen pemakaman"
    hi: "अंत्येष्टि वस्तुओं और स्मारकों का विश्लेषण करना"
  - en: "Interpret ancient texts about death"
    zh: "解读关于死亡的古代文本"
    zh-TW: "解讀關於死亡的古代文本"
    ja: "死についての古代の文章を解釈する"
    ko: "죽음에 관한 고대 글 해석하기"
    vi: "Diễn giải các văn bản cổ về cái chết"
    ms: "Tafsir teks kuno tentang kematian"
    id: "Menafsirkan teks kuno tentang kematian"
    hi: "मृत्यु पर प्राचीन ग्रंथों की व्याख्या करना"
