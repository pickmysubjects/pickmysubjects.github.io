code: ERTH20003
year: 2026
learn:
  en: "Earth's climate history from Snowball Earth to ice ages, read from ice cores, tree rings and corals."
  zh: "从雪球地球到冰期的地球气候史，靠冰芯、树轮和珊瑚来解读。"
  zh-TW: "從雪球地球到冰期的地球氣候史，靠冰芯、樹輪和珊瑚來解讀。"
  ja: "スノーボールアースから氷期までの気候史を、氷床コア・年輪・サンゴから読み解く。"
  ko: "눈덩이 지구부터 빙하기까지의 기후사를 빙하 코어·나이테·산호로 읽어낸다."
  vi: "Lịch sử khí hậu Trái Đất từ Trái Đất quả cầu tuyết đến kỷ băng hà, đọc qua lõi băng, vòng cây, san hô."
  ms: "Sejarah iklim Bumi dari Bumi Bola Salji hingga zaman ais, dibaca melalui teras ais, gelang pokok dan karang."
  id: "Sejarah iklim Bumi dari Bumi Bola Salju hingga zaman es, dibaca dari inti es, lingkar pohon, dan karang."
  hi: "स्नोबॉल अर्थ से हिमयुग तक पृथ्वी का जलवायु इतिहास, बर्फ़ कोर, पेड़ के छल्लों और कोरल से।"
outcomes:
  - en: "Explain what drives climate change over time"
    zh: "解释不同时间尺度的气候驱动因素"
    zh-TW: "解釋不同時間尺度的氣候驅動因素"
    ja: "時代ごとの気候変動の要因を説明する"
    ko: "시간에 따른 기후 변화 요인을 설명한다"
    vi: "Giải thích động lực biến đổi khí hậu"
    ms: "Terangkan pemacu perubahan iklim"
    id: "Menjelaskan pendorong perubahan iklim"
    hi: "समय के साथ जलवायु परिवर्तन के कारण समझाना"
  - en: "Use proxy records to rebuild past climate"
    zh: "用代用指标重建古气候"
    zh-TW: "用代用指標重建古氣候"
    ja: "代替指標で過去の気候を復元する"
    ko: "대리 기록으로 과거 기후를 복원한다"
    vi: "Dùng dữ liệu gián tiếp tái dựng khí hậu cổ"
    ms: "Guna rekod proksi untuk bina semula iklim lampau"
    id: "Memakai data proksi merekonstruksi iklim purba"
    hi: "प्रॉक्सी रिकॉर्ड से पुरानी जलवायु दोबारा बनाना"
