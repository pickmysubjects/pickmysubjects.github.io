code: ABPL90129
year: 2027
learn:
  en: "Cost management from feasibility to completion: probabilistic estimating, life-cycle cost, value management, tenders and claims."
  zh: "从可行性到竣工的成本管理：概率估算、全寿命成本、价值管理、投标与索赔。"
  zh-TW: "從可行性到完工的成本管理：機率估算、全生命週期成本、價值管理、投標與求償。"
  ja: "構想から完成までのコスト管理：確率的見積り、LCC、VM、入札、クレーム。"
  ko: "사업성부터 준공까지 원가관리: 확률적 견적, 생애주기비용, VE, 입찰, 클레임."
  vi: "Quản lý chi phí từ khả thi đến hoàn thành: dự toán xác suất, chi phí vòng đời, đấu thầu, khiếu nại."
  ms: "Pengurusan kos dari kebolehlaksanaan hingga siap: anggaran probabilistik, kos kitaran hayat, tender dan tuntutan."
  id: "Manajemen biaya dari studi kelayakan hingga selesai: estimasi probabilistik, biaya siklus hidup, tender dan klaim."
  hi: "व्यवहार्यता से पूर्णता तक लागत प्रबंधन: संभाव्य अनुमान, जीवन-चक्र लागत, टेंडर और दावे।"
outcomes:
  - en: "Use parametric and probabilistic cost estimating methods"
    zh: "运用参数化和概率成本估算方法"
    zh-TW: "運用參數化與機率成本估算方法"
    ja: "パラメトリック・確率的見積り手法を使う"
    ko: "모수적·확률적 원가 추정 방법 쓰기"
    vi: "Dùng phương pháp dự toán tham số và xác suất"
    ms: "Menggunakan kaedah anggaran kos parametrik dan probabilistik"
    id: "Memakai metode estimasi biaya parametrik dan probabilistik"
    hi: "पैरामीट्रिक व संभाव्य लागत अनुमान विधियाँ अपनाना"
  - en: "Explain a quantity surveyor's role in tenders, variations and disputes"
    zh: "说明工料测量师在投标、变更和争议中的作用"
    zh-TW: "說明工料測量師在投標、變更與爭議中的角色"
    ja: "入札・変更・紛争での積算士の役割を説明する"
    ko: "입찰·변경·분쟁에서 적산사의 역할 설명하기"
    vi: "Giải thích vai trò kỹ sư dự toán trong đấu thầu, tranh chấp"
    ms: "Menerangkan peranan juruukur bahan dalam tender dan pertikaian"
    id: "Menjelaskan peran quantity surveyor dalam tender dan sengketa"
    hi: "टेंडर, बदलाव और विवादों में क्वांटिटी सर्वेयर की भूमिका समझाना"
