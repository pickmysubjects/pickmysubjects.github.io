code: MAST30030
year: 2026
learn:
  en: "Building differential equation models for disease spread, traffic flow and fluids."
  zh: "用微分方程给疾病传播、交通流和流体建模。"
  zh-TW: "用微分方程為疾病傳播、交通流和流體建模。"
  ja: "感染症の広がり・交通流・流体の微分方程式モデルを作る。"
  ko: "질병 확산, 교통 흐름, 유체에 대한 미분방정식 모델 만들기."
  vi: "Xây dựng mô hình phương trình vi phân cho lây lan bệnh, dòng giao thông và chất lưu."
  ms: "Membina model persamaan pembezaan untuk penyebaran penyakit, aliran trafik dan bendalir."
  id: "Membuat model persamaan diferensial untuk penyebaran penyakit, arus lalu lintas, dan fluida."
  hi: "बीमारी के फैलाव, ट्रैफ़िक प्रवाह और तरल पदार्थों के अवकल समीकरण मॉडल बनाना।"
outcomes:
  - en: "Formulate and critique mathematical models"
    zh: "建立并评价数学模型"
    zh-TW: "建立並評價數學模型"
    ja: "数理モデルを立て、批判的に評価する"
    ko: "수학 모델을 세우고 평가하기"
    vi: "Lập và đánh giá mô hình toán học"
    ms: "Merumus dan mengkritik model matematik"
    id: "Merumuskan dan mengkritisi model matematika"
    hi: "गणितीय मॉडल बनाना और उनकी समीक्षा करना"
  - en: "Classify critical points and sketch phase-plane behaviour"
    zh: "分类临界点并分析相平面行为"
    zh-TW: "分類臨界點並分析相平面行為"
    ja: "臨界点を分類し相平面の挙動を描く"
    ko: "임계점을 분류하고 상평면 거동 그리기"
    vi: "Phân loại điểm tới hạn và phác họa mặt phẳng pha"
    ms: "Mengelaskan titik genting dan melakar kelakuan satah fasa"
    id: "Mengklasifikasi titik kritis dan menggambar perilaku bidang fase"
    hi: "क्रिटिकल पॉइंट वर्गीकृत करना और फ़ेज़-प्लेन व्यवहार बनाना"
  - en: "Model traffic flow with conservation laws"
    zh: "用守恒律给交通流建模"
    zh-TW: "用守恆律為交通流建模"
    ja: "保存則で交通流をモデル化する"
    ko: "보존 법칙으로 교통 흐름 모델링하기"
    vi: "Mô hình hóa dòng giao thông bằng định luật bảo toàn"
    ms: "Memodelkan aliran trafik dengan hukum keabadian"
    id: "Memodelkan arus lalu lintas dengan hukum kekekalan"
    hi: "संरक्षण नियमों से ट्रैफ़िक प्रवाह का मॉडल बनाना"
