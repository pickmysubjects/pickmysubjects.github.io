code: ISLM30021
year: 2026
learn:
  en: "Debates over gender in Islam: the history of women in Islam, how key texts are read, and topics like Islamic feminism."
  zh: "伊斯兰中的性别争论：女性在伊斯兰中的历史、经典如何被解读，以及伊斯兰女性主义等议题。"
  zh-TW: "伊斯蘭中的性別爭論：女性在伊斯蘭中的歷史、經典如何被解讀，以及伊斯蘭女性主義等議題。"
  ja: "イスラムにおけるジェンダー論争。女性の歴史、主要な典拠の読まれ方、イスラム・フェミニズムなどを学ぶ。"
  ko: "이슬람의 젠더 논쟁: 여성의 역사, 주요 경전 해석, 이슬람 페미니즘 같은 주제를 배운다."
  vi: "Tranh luận về giới trong Hồi giáo: lịch sử phụ nữ, cách đọc các văn bản chính và các chủ đề như nữ quyền Hồi giáo."
  ms: "Perdebatan gender dalam Islam: sejarah wanita, cara teks utama ditafsir, dan topik seperti feminisme Islam."
  id: "Perdebatan gender dalam Islam: sejarah perempuan, cara teks utama ditafsirkan, dan topik seperti feminisme Islam."
  hi: "इस्लाम में जेंडर पर बहसें: महिलाओं का इतिहास, मुख्य ग्रंथों की व्याख्या, और इस्लामी नारीवाद जैसे विषय।"
outcomes:
  - en: "Trace the history of women in Islam"
    zh: "梳理伊斯兰中女性的历史"
    zh-TW: "梳理伊斯蘭中女性的歷史"
    ja: "イスラムにおける女性の歴史をたどる"
    ko: "이슬람 속 여성의 역사 따라가기"
    vi: "Lần theo lịch sử phụ nữ trong Hồi giáo"
    ms: "Jejaki sejarah wanita dalam Islam"
    id: "Menelusuri sejarah perempuan dalam Islam"
    hi: "इस्लाम में महिलाओं के इतिहास का क्रम समझना"
  - en: "Compare readings of the Qur'an and Hadith on gender"
    zh: "比较对古兰经和圣训中性别内容的解读"
    zh-TW: "比較對古蘭經和聖訓中性別內容的解讀"
    ja: "ジェンダーをめぐるクルアーンとハディースの解釈を比べる"
    ko: "젠더에 관한 꾸란과 하디스 해석 비교하기"
    vi: "So sánh cách đọc Qur'an và Hadith về giới"
    ms: "Bandingkan tafsiran al-Quran dan Hadis tentang gender"
    id: "Membandingkan tafsir Al-Qur'an dan Hadis soal gender"
    hi: "जेंडर पर क़ुरआन और हदीस की व्याख्याओं की तुलना करना"
  - en: "Discuss Islamic feminism and gender justice"
    zh: "讨论伊斯兰女性主义与性别正义"
    zh-TW: "討論伊斯蘭女性主義與性別正義"
    ja: "イスラム・フェミニズムとジェンダー正義を論じる"
    ko: "이슬람 페미니즘과 젠더 정의 논의하기"
    vi: "Thảo luận nữ quyền Hồi giáo và công bằng giới"
    ms: "Bincangkan feminisme Islam dan keadilan gender"
    id: "Membahas feminisme Islam dan keadilan gender"
    hi: "इस्लामी नारीवाद और लैंगिक न्याय पर चर्चा करना"
