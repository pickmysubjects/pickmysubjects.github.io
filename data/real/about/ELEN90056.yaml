code: ELEN90056
year: 2027
learn:
  en: "Transistor circuits and op-amps: biasing, amplifiers, feedback and voltage regulators, simulated and built in the lab."
  zh: "晶体管电路和运算放大器：偏置、放大器、反馈和稳压器，并通过仿真和实验搭建。"
  zh-TW: "電晶體電路與運算放大器：偏壓、放大器、回授與穩壓器，並透過模擬與實驗製作。"
  ja: "トランジスタ回路とオペアンプ：バイアス・増幅器・帰還・電圧レギュレータを、シミュレーションと実験で。"
  ko: "트랜지스터 회로와 연산증폭기: 바이어스, 증폭기, 피드백, 전압 레귤레이터를 시뮬레이션과 실험으로."
  vi: "Mạch transistor và op-amp: phân cực, khuếch đại, hồi tiếp và ổn áp, mô phỏng và lắp ráp trong phòng thí nghiệm."
  ms: "Litar transistor dan op-amp: pincangan, penguat, suap balik dan pengatur voltan, disimulasi dan dibina di makmal."
  id: "Rangkaian transistor dan op-amp: bias, penguat, umpan balik dan regulator tegangan, disimulasikan dan dirakit di laboratorium."
  hi: "ट्रांजिस्टर सर्किट और ऑप-एम्प: बायसिंग, एम्प्लिफ़ायर, फ़ीडबैक और वोल्टेज रेगुलेटर, सिमुलेशन और लैब में निर्माण।"
outcomes:
  - en: "Analyse circuits with transistors and other nonlinear devices"
    zh: "分析含晶体管等非线性器件的电路"
    zh-TW: "分析含電晶體等非線性元件的電路"
    ja: "トランジスタなど非線形素子を含む回路を解析する"
    ko: "트랜지스터 등 비선형 소자가 있는 회로 해석하기"
    vi: "Phân tích mạch có transistor và linh kiện phi tuyến"
    ms: "Menganalisis litar dengan transistor dan peranti tak linear"
    id: "Menganalisis rangkaian dengan transistor dan komponen nonlinier"
    hi: "ट्रांजिस्टर और अन्य नॉनलीनियर उपकरणों वाले सर्किट का विश्लेषण"
  - en: "Design and test amplifier circuits"
    zh: "设计并测试放大电路"
    zh-TW: "設計並測試放大電路"
    ja: "増幅回路を設計・試験する"
    ko: "증폭 회로 설계·시험하기"
    vi: "Thiết kế và kiểm thử mạch khuếch đại"
    ms: "Mereka bentuk dan menguji litar penguat"
    id: "Merancang dan menguji rangkaian penguat"
    hi: "एम्प्लिफ़ायर सर्किट डिज़ाइन और परीक्षण करना"
  - en: "Build circuits in the lab and simulate them in software"
    zh: "在实验室搭建电路并用软件仿真"
    zh-TW: "在實驗室製作電路並以軟體模擬"
    ja: "実験室で回路を組みソフトでシミュレーションする"
    ko: "실험실에서 회로를 만들고 소프트웨어로 시뮬레이션하기"
    vi: "Lắp mạch trong phòng thí nghiệm và mô phỏng bằng phần mềm"
    ms: "Membina litar di makmal dan mensimulasikannya dengan perisian"
    id: "Merakit rangkaian di laboratorium dan mensimulasikannya"
    hi: "लैब में सर्किट बनाना और सॉफ़्टवेयर में सिमुलेट करना"
