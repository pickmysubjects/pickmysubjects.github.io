code: ELEN30009
year: 2026
learn:
  en: "Analysing circuits in time and frequency, and designing active filters and amplifiers you build and test."
  zh: "在时域和频域分析电路，并设计、搭建和测试有源滤波器与放大器。"
  zh-TW: "在時域與頻域分析電路，並設計、搭建與測試主動濾波器和放大器。"
  ja: "時間・周波数領域での回路解析と、能動フィルタや増幅器の設計・製作・試験。"
  ko: "시간·주파수 영역 회로 해석, 능동 필터와 증폭기를 설계·제작·시험하기."
  vi: "Phân tích mạch trong miền thời gian và tần số, thiết kế, lắp và thử bộ lọc tích cực, khuếch đại."
  ms: "Menganalisis litar dalam domain masa dan frekuensi, serta mereka, membina dan menguji penapis aktif dan penguat."
  id: "Menganalisis rangkaian di domain waktu dan frekuensi, serta merancang, merakit, dan menguji filter aktif dan penguat."
  hi: "टाइम और फ़्रीक्वेंसी डोमेन में सर्किट विश्लेषण, और एक्टिव फ़िल्टर व एम्प्लीफ़ायर बनाकर परखना।"
outcomes:
  - en: "Analyse circuits in time and frequency"
    zh: "在时域和频域分析电路"
    zh-TW: "在時域與頻域分析電路"
    ja: "時間・周波数領域で回路を解析する"
    ko: "시간·주파수 영역에서 회로 분석하기"
    vi: "Phân tích mạch theo thời gian và tần số"
    ms: "Menganalisis litar dalam masa dan frekuensi"
    id: "Menganalisis rangkaian dalam waktu dan frekuensi"
    hi: "टाइम और फ़्रीक्वेंसी में सर्किट विश्लेषण करना"
  - en: "Design, build and test filter circuits"
    zh: "设计、搭建并测试滤波电路"
    zh-TW: "設計、搭建並測試濾波電路"
    ja: "フィルタ回路を設計・製作・試験する"
    ko: "필터 회로 설계·제작·시험하기"
    vi: "Thiết kế, lắp và thử mạch lọc"
    ms: "Mereka, membina dan menguji litar penapis"
    id: "Merancang, merakit, dan menguji rangkaian filter"
    hi: "फ़िल्टर सर्किट डिज़ाइन, निर्माण और परीक्षण करना"
  - en: "Simulate circuits with software"
    zh: "用软件仿真电路"
    zh-TW: "用軟體模擬電路"
    ja: "ソフトで回路をシミュレーションする"
    ko: "소프트웨어로 회로 시뮬레이션하기"
    vi: "Mô phỏng mạch bằng phần mềm"
    ms: "Mensimulasi litar dengan perisian"
    id: "Mensimulasikan rangkaian dengan software"
    hi: "सॉफ़्टवेयर से सर्किट सिमुलेट करना"
