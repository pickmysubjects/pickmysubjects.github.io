code: LING30002
year: 2026
learn:
  en: "How sound systems are organised across languages, with training in formal phonological analysis and theory."
  zh: "各种语言的语音系统如何组织，并训练形式化的音系分析和理论。"
  zh-TW: "各種語言的語音系統如何組織，並訓練形式化的音韻分析和理論。"
  ja: "さまざまな言語の音の体系がどう組み立てられているかを、形式的な音韻分析と理論の訓練を通して学ぶ。"
  ko: "여러 언어의 소리 체계가 어떻게 짜여 있는지 형식적 음운 분석과 이론 훈련을 통해 배운다."
  vi: "Hệ thống âm được tổ chức ra sao ở các ngôn ngữ, kèm rèn luyện phân tích và lý thuyết âm vị học hình thức."
  ms: "Cara sistem bunyi disusun merentas bahasa, dengan latihan analisis dan teori fonologi formal."
  id: "Cara sistem bunyi tersusun di berbagai bahasa, dengan latihan analisis dan teori fonologi formal."
  hi: "अलग-अलग भाषाओं में ध्वनि प्रणालियाँ कैसे व्यवस्थित होती हैं, औपचारिक स्वनिम विश्लेषण और सिद्धांत के अभ्यास के साथ।"
outcomes:
  - en: "Analyse sound systems using real language data"
    zh: "用真实语言数据分析语音系统"
    zh-TW: "用真實語言資料分析語音系統"
    ja: "実際の言語データで音の体系を分析する"
    ko: "실제 언어 자료로 소리 체계 분석하기"
    vi: "Phân tích hệ thống âm bằng dữ liệu ngôn ngữ thực"
    ms: "Analisis sistem bunyi dengan data bahasa sebenar"
    id: "Menganalisis sistem bunyi dengan data bahasa nyata"
    hi: "असली भाषा डेटा से ध्वनि प्रणालियों का विश्लेषण करना"
  - en: "Evaluate theoretical approaches to phonology"
    zh: "评价音系学的理论方法"
    zh-TW: "評價音韻學的理論取向"
    ja: "音韻論の理論的アプローチを評価する"
    ko: "음운론의 이론적 접근 평가하기"
    vi: "Đánh giá các hướng tiếp cận lý thuyết về âm vị học"
    ms: "Nilai pendekatan teori fonologi"
    id: "Menilai pendekatan teoretis fonologi"
    hi: "स्वनिमविज्ञान के सैद्धांतिक दृष्टिकोणों को परखना"
  - en: "Take a position in debates in phonology"
    zh: "在音系学争论中表明立场"
    zh-TW: "在音韻學爭論中表明立場"
    ja: "音韻論の論争で立場を示す"
    ko: "음운론 논쟁에서 입장 정하기"
    vi: "Đưa ra quan điểm trong tranh luận về âm vị học"
    ms: "Ambil pendirian dalam perdebatan fonologi"
    id: "Mengambil sikap dalam perdebatan fonologi"
    hi: "स्वनिमविज्ञान की बहसों में अपना पक्ष रखना"
