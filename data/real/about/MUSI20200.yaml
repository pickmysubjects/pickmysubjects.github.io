code: MUSI20200
year: 2026
learn:
  en: "Weekly lessons and class, a progress video, and a 20-minute exam on a program you choose and get approved."
  zh: "每周个别课和小组课，交进度视频，最后20分钟考试演奏自选并经批准的曲目。"
  zh-TW: "每週個別課與小組課，交進度影片，最後20分鐘考試演奏自選並經核准的曲目。"
  ja: "週1回のレッスンとクラス、進捗動画、承認された自選曲の20分試験。"
  ko: "주간 레슨과 수업, 진도 영상, 승인받은 자유곡 20분 시험."
  vi: "Học hằng tuần, video tiến độ và thi 20 phút với chương trình tự chọn đã duyệt."
  ms: "Pelajaran mingguan, video kemajuan, dan ujian 20 minit atas program pilihan yang diluluskan."
  id: "Pelajaran mingguan, video kemajuan, dan ujian 20 menit dengan program pilihan yang disetujui."
  hi: "साप्ताहिक पाठ, प्रगति वीडियो, और स्वीकृत अपनी पसंद के कार्यक्रम पर 20 मिनट की परीक्षा।"
outcomes:
  - en: "Perform a prepared exam program"
    zh: "演奏准备好的考试曲目"
    zh-TW: "演奏準備好的考試曲目"
    ja: "準備した試験曲を演奏する"
    ko: "준비한 시험 프로그램 연주하기"
    vi: "Biểu diễn chương trình thi đã chuẩn bị"
    ms: "Persembahkan program peperiksaan"
    id: "Membawakan program ujian"
    hi: "तैयार परीक्षा कार्यक्रम प्रस्तुत करना"
  - en: "Improve technique on your instrument"
    zh: "提升乐器或声乐技巧"
    zh-TW: "提升樂器或聲樂技巧"
    ja: "楽器や声の技術を高める"
    ko: "악기·성악 기술 향상하기"
    vi: "Nâng cao kỹ thuật nhạc cụ"
    ms: "Tingkatkan teknik alat muzik"
    id: "Meningkatkan teknik instrumen"
    hi: "अपने वाद्य की तकनीक सुधारना"
  - en: "Track progress through recordings"
    zh: "通过录像跟踪进步"
    zh-TW: "透過錄影追蹤進步"
    ja: "録画で上達を確かめる"
    ko: "녹화로 진도 점검하기"
    vi: "Theo dõi tiến bộ qua video"
    ms: "Jejak kemajuan melalui rakaman"
    id: "Memantau kemajuan lewat rekaman"
    hi: "रिकॉर्डिंग से प्रगति देखना"
