code: ZOOL20004
year: 2026
learn:
  en: "Australia's animals: how frogs, reptiles, birds and mammals evolved and adapted, and how they're conserved."
  zh: "澳洲动物：蛙、爬行类、鸟和哺乳类的演化适应与保护。"
  zh-TW: "澳洲動物：蛙、爬蟲類、鳥和哺乳類的演化適應與保育。"
  ja: "オーストラリアのカエル・爬虫類・鳥・哺乳類の進化、適応、保全。"
  ko: "호주 개구리, 파충류, 조류, 포유류의 진화·적응과 보전."
  vi: "Động vật Úc: ếch, bò sát, chim, thú tiến hóa, thích nghi và được bảo tồn ra sao."
  ms: "Haiwan Australia: evolusi dan adaptasi katak, reptilia, burung dan mamalia, serta pemuliharaannya."
  id: "Satwa Australia: evolusi dan adaptasi katak, reptil, burung, dan mamalia, serta konservasinya."
  hi: "ऑस्ट्रेलिया के मेंढक, सरीसृप, पक्षी और स्तनधारी कैसे विकसित हुए, ढले और बचाए जाते हैं।"
outcomes:
  - en: "Describe major groups of Australian fauna"
    zh: "描述澳洲动物的主要类群"
    zh-TW: "描述澳洲動物的主要類群"
    ja: "オーストラリア動物の主要グループを説明する"
    ko: "호주 동물의 주요 분류군 설명하기"
    vi: "Mô tả các nhóm động vật chính của Úc"
    ms: "Menerangkan kumpulan utama fauna Australia"
    id: "Menjelaskan kelompok utama fauna Australia"
    hi: "ऑस्ट्रेलियाई जीवों के मुख्य समूह बताना"
  - en: "Make and record field observations"
    zh: "进行并记录野外观察"
    zh-TW: "進行並記錄野外觀察"
    ja: "野外観察を行い記録する"
    ko: "야외 관찰 수행하고 기록하기"
    vi: "Quan sát và ghi chép thực địa"
    ms: "Membuat dan merekod pemerhatian lapangan"
    id: "Melakukan dan mencatat pengamatan lapangan"
    hi: "फ़ील्ड में अवलोकन करना और दर्ज करना"
