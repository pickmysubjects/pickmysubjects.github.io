code: SCIE10005
year: 2026
learn:
  en: "How science works and builds trust, and how it tackles big issues like climate change. Pass/fail, first semester."
  zh: "科学怎么运作、怎么赢得信任，怎么应对气候变化。只记通过与否。"
  zh-TW: "科學怎麼運作、怎麼贏得信任，怎麼應對氣候變遷等大問題。只記通過與否，第一學期。"
  ja: "科学の仕組みと信頼の築き方、気候変動など大きな課題への取り組み。合否のみ、前期。"
  ko: "과학이 작동하고 신뢰를 쌓는 방식, 기후변화 같은 큰 문제 대응. 통과/낙제, 1학기."
  vi: "Khoa học vận hành và tạo niềm tin ra sao, xử lý vấn đề lớn như biến đổi khí hậu. Đạt/trượt, học kỳ 1."
  ms: "Cara sains berfungsi dan membina kepercayaan, serta menangani isu besar seperti perubahan iklim. Lulus/gagal, semester 1."
  id: "Cara sains bekerja dan membangun kepercayaan, serta menangani isu besar seperti perubahan iklim. Lulus/gagal, semester 1."
  hi: "विज्ञान कैसे काम करता और भरोसा बनाता है, और जलवायु परिवर्तन जैसे बड़े मुद्दे कैसे सुलझाता है। पास/फ़ेल, पहला सेमेस्टर।"
outcomes:
  - en: "Explain how the scientific method works"
    zh: "讲清科学方法怎么运作"
    zh-TW: "講清科學方法怎麼運作"
    ja: "科学的方法の仕組みを説明する"
    ko: "과학적 방법의 작동 방식 설명"
    vi: "Giải thích phương pháp khoa học hoạt động ra sao"
    ms: "Terangkan cara kaedah saintifik berfungsi"
    id: "Menjelaskan cara kerja metode ilmiah"
    hi: "वैज्ञानिक तरीका कैसे काम करता है, समझाना"
  - en: "Discuss climate change and sustainability with evidence"
    zh: "有理有据地讨论气候和可持续"
    zh-TW: "有憑有據地討論氣候變遷和永續"
    ja: "証拠に基づいて気候変動と持続可能性を論じる"
    ko: "근거를 들어 기후변화와 지속가능성 논의"
    vi: "Thảo luận biến đổi khí hậu và bền vững có dẫn chứng"
    ms: "Bincang perubahan iklim dan kelestarian dengan bukti"
    id: "Membahas perubahan iklim dan keberlanjutan dengan bukti"
    hi: "सबूतों के साथ जलवायु परिवर्तन और सस्टेनेबिलिटी पर चर्चा"
  - en: "Work in a small group toward a shared goal"
    zh: "和小组合作完成共同目标"
    zh-TW: "和小組合作完成共同目標"
    ja: "少人数グループで共通の目標に取り組む"
    ko: "소그룹으로 공동 목표를 향해 협업"
    vi: "Làm việc nhóm nhỏ hướng tới mục tiêu chung"
    ms: "Bekerja dalam kumpulan kecil ke arah matlamat bersama"
    id: "Bekerja dalam kelompok kecil menuju tujuan bersama"
    hi: "छोटे ग्रुप में साझा लक्ष्य के लिए काम करना"
