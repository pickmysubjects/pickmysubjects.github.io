code: ENEN90031
year: 2027
learn:
  en: "Building, calibrating and testing your own environmental model in a numerical programming language."
  zh: "用数值编程语言搭建、校准和检验自己的环境模型。"
  zh-TW: "用數值程式語言建立、校準與檢驗自己的環境模型。"
  ja: "数値計算言語で自分の環境モデルを構築・較正・検証する。"
  ko: "수치 프로그래밍 언어로 직접 환경 모델을 만들고 보정·검증합니다."
  vi: "Xây dựng, hiệu chỉnh và kiểm tra mô hình môi trường của riêng bạn bằng ngôn ngữ lập trình số."
  ms: "Membina, menentukur dan menguji model alam sekitar sendiri dalam bahasa pengaturcaraan berangka."
  id: "Membangun, mengkalibrasi, dan menguji model lingkungan sendiri dengan bahasa pemrograman numerik."
  hi: "न्यूमेरिकल प्रोग्रामिंग भाषा में अपना पर्यावरण मॉडल बनाना, कैलिब्रेट करना और परखना।"
outcomes:
  - en: "Pick a suitable modelling approach for the data you have"
    zh: "根据已有数据选择合适的建模方法"
    zh-TW: "依現有資料選擇合適的建模方法"
    ja: "手元のデータに合ったモデル化手法を選ぶ"
    ko: "가진 데이터에 맞는 모델링 방법 고르기"
    vi: "Chọn cách mô hình hóa phù hợp với dữ liệu có sẵn"
    ms: "Memilih pendekatan pemodelan yang sesuai dengan data sedia ada"
    id: "Memilih pendekatan pemodelan yang cocok dengan data yang ada"
    hi: "उपलब्ध डेटा के लिए सही मॉडलिंग तरीक़ा चुनना"
  - en: "Calibrate a model and check its uncertainty"
    zh: "校准模型并评估不确定性"
    zh-TW: "校準模型並評估不確定性"
    ja: "モデルを較正し不確実性を確かめる"
    ko: "모델 보정 및 불확실성 확인하기"
    vi: "Hiệu chỉnh mô hình và kiểm tra độ bất định"
    ms: "Menentukur model dan menyemak ketidakpastiannya"
    id: "Mengkalibrasi model dan memeriksa ketidakpastiannya"
    hi: "मॉडल कैलिब्रेट करना और अनिश्चितता जाँचना"
  - en: "Write up a modelling study as an engineering report"
    zh: "把建模研究写成工程报告"
    zh-TW: "把建模研究寫成工程報告"
    ja: "モデル研究を工学レポートにまとめる"
    ko: "모델링 연구를 공학 보고서로 작성하기"
    vi: "Viết nghiên cứu mô hình thành báo cáo kỹ thuật"
    ms: "Menulis kajian pemodelan sebagai laporan kejuruteraan"
    id: "Menulis studi pemodelan sebagai laporan teknik"
    hi: "मॉडलिंग अध्ययन को इंजीनियरिंग रिपोर्ट के रूप में लिखना"
