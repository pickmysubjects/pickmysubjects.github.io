code: MGMT90012
year: 2027
learn:
  en: "How organisations plan and evaluate diversity, equity and inclusion, and attract and keep diverse talent."
  zh: "组织如何规划和评估多元、公平与包容，以及吸引并留住多元人才。"
  zh-TW: "組織如何規劃與評估多元、公平與共融，以及吸引並留住多元人才。"
  ja: "組織が多様性・公平性・包摂を計画・評価し、多様な人材を採用・定着させる方法。"
  ko: "조직이 다양성·형평성·포용을 계획·평가하고 다양한 인재를 유치·유지하는 방법."
  vi: "Tổ chức lập kế hoạch, đánh giá đa dạng, công bằng, hòa nhập và thu hút, giữ chân nhân tài đa dạng."
  ms: "Cara organisasi merancang dan menilai kepelbagaian, ekuiti dan keterangkuman serta menarik dan mengekalkan bakat pelbagai."
  id: "Cara organisasi merencanakan dan menilai keberagaman, kesetaraan, dan inklusi serta menarik dan mempertahankan talenta beragam."
  hi: "संगठन विविधता, समानता और समावेशन की योजना व मूल्यांकन कैसे करते हैं, और विविध प्रतिभा कैसे आकर्षित करते हैं।"
outcomes:
  - en: "Analyse DEI strategies with frameworks"
    zh: "用框架分析DEI策略"
    zh-TW: "用框架分析DEI策略"
    ja: "フレームワークでDEI戦略を分析する"
    ko: "프레임워크로 DEI 전략 분석하기"
    vi: "Phân tích chiến lược DEI bằng các khung lý thuyết"
    ms: "Menganalisis strategi DEI dengan kerangka"
    id: "Menganalisis strategi DEI dengan kerangka kerja"
    hi: "फ़्रेमवर्क से DEI रणनीतियों का विश्लेषण"
  - en: "Plan ways to build an inclusive workplace"
    zh: "规划打造包容职场的做法"
    zh-TW: "規劃打造共融職場的做法"
    ja: "インクルーシブな職場づくりを計画する"
    ko: "포용적인 직장 만들기 계획하기"
    vi: "Lập kế hoạch xây dựng nơi làm việc hòa nhập"
    ms: "Merancang cara membina tempat kerja inklusif"
    id: "Merencanakan cara membangun tempat kerja inklusif"
    hi: "समावेशी कार्यस्थल बनाने की योजना"
