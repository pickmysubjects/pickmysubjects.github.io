code: DRAM30036
year: 2026
learn:
  en: "Your final ensemble show: devise, rehearse and perform a new work for the public, with mentoring."
  zh: "最后的集体作品：在指导下编创、排练并公开演出新戏。"
  zh-TW: "最後的集體作品：在指導下編創、排練並公開演出新戲。"
  ja: "最終のアンサンブル公演：指導を受けて新作を創作・稽古・上演する。"
  ko: "마지막 앙상블 공연: 멘토링 속에 새 작품을 만들고 공개 공연한다."
  vi: "Vở tập thể cuối cùng: dựng, tập và diễn tác phẩm mới cho công chúng."
  ms: "Persembahan ensembel akhir: cipta, latih dan pentaskan karya baharu kepada umum."
  id: "Pertunjukan ensambel terakhir: buat, latih dan pentaskan karya baru untuk publik."
  hi: "अंतिम सामूहिक शो: मार्गदर्शन में नया काम रचना, रिहर्सल और सार्वजनिक प्रस्तुति।"
outcomes:
  - en: "Devise and rehearse a full public show"
    zh: "编创并排练一部完整公演"
    zh-TW: "編創並排練一部完整公演"
    ja: "一般公演を丸ごと創作・稽古する"
    ko: "공개 공연 한 편을 만들고 리허설하기"
    vi: "Dựng và tập một vở diễn công khai"
    ms: "Cipta dan latih persembahan awam penuh"
    id: "Membuat dan melatih pertunjukan publik"
    hi: "पूरा सार्वजनिक शो रचना और रिहर्सल करना"
  - en: "Write a dramaturgy reflection"
    zh: "写一篇戏剧构作反思"
    zh-TW: "寫一篇戲劇構作反思"
    ja: "ドラマトゥルギーの振り返りを書く"
    ko: "드라마투르기 성찰 글 쓰기"
    vi: "Viết suy ngẫm về biên kịch"
    ms: "Tulis refleksi dramaturgi"
    id: "Menulis refleksi dramaturgi"
    hi: "ड्रामाटर्जी पर चिंतन लिखना"
  - en: "Work on your own within a team"
    zh: "在团队中独立承担工作"
    zh-TW: "在團隊中獨立承擔工作"
    ja: "チームの中で自立して動く"
    ko: "팀 안에서 스스로 해내기"
    vi: "Làm việc chủ động trong nhóm"
    ms: "Bekerja secara berdikari dalam pasukan"
    id: "Bekerja mandiri di dalam tim"
    hi: "टीम में रहकर स्वतंत्र रूप से काम करना"
