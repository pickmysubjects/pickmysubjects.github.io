code: MUSI10016
year: 2026
learn:
  en: "How to teach piano step by step: teaching principles, repertoire for each level, and adapting to each student."
  zh: "如何循序渐进地教钢琴：教学原则、各级别曲目，以及因材施教。"
  zh-TW: "如何循序漸進地教鋼琴：教學原則、各級別曲目，以及因材施教。"
  ja: "ピアノを段階的に教える方法。指導原理、レベル別の曲、生徒に合わせた工夫。"
  ko: "피아노를 단계적으로 가르치는 법: 교수 원리, 수준별 레퍼토리, 학생 맞춤 지도."
  vi: "Cách dạy piano từng bước: nguyên tắc sư phạm, tiết mục theo trình độ và điều chỉnh cho từng học viên."
  ms: "Cara mengajar piano berperingkat: prinsip pengajaran, repertoir ikut tahap, dan sesuaikan pelajar."
  id: "Cara mengajar piano bertahap: prinsip pengajaran, repertoar per tingkat, dan menyesuaikan tiap murid."
  hi: "पियानो चरणबद्ध सिखाना: शिक्षण सिद्धांत, हर स्तर का संगीत और हर छात्र के अनुसार ढलना।"
outcomes:
  - en: "Plan a sequenced piano curriculum"
    zh: "规划循序渐进的钢琴课程"
    zh-TW: "規劃循序漸進的鋼琴課程"
    ja: "段階的なピアノ指導計画を立てる"
    ko: "단계별 피아노 교육과정 짜기"
    vi: "Lập giáo trình piano theo trình tự"
    ms: "Rancang kurikulum piano berperingkat"
    id: "Merancang kurikulum piano bertahap"
    hi: "चरणबद्ध पियानो पाठ्यक्रम बनाना"
  - en: "Choose repertoire for each level"
    zh: "为不同水平挑选曲目"
    zh-TW: "為不同程度挑選曲目"
    ja: "レベルに合う曲を選ぶ"
    ko: "수준별 곡 고르기"
    vi: "Chọn tiết mục cho từng trình độ"
    ms: "Pilih repertoir ikut tahap"
    id: "Memilih repertoar per tingkat"
    hi: "हर स्तर के लिए रचनाएँ चुनना"
  - en: "Teach a lesson in class"
    zh: "在课堂上进行教学示范"
    zh-TW: "在課堂上進行教學示範"
    ja: "授業で模擬レッスンをする"
    ko: "수업에서 시범 강의하기"
    vi: "Dạy thử một buổi trên lớp"
    ms: "Ajar satu pelajaran dalam kelas"
    id: "Mengajar satu sesi di kelas"
    hi: "कक्षा में पाठ पढ़ाकर दिखाना"
