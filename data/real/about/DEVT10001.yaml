code: DEVT10001
year: 2026
learn:
  en: "Why the world splits into rich North and poor South: colonial legacies, aid, debt, trade, migration and climate, via case studies."
  zh: "世界为何分成富裕的北方与贫穷的南方：殖民遗产、援助、债务、贸易、移民和气候，结合案例分析。"
  zh-TW: "世界為何分成富裕的北方與貧窮的南方：殖民遺產、援助、債務、貿易、移民和氣候，結合案例分析。"
  ja: "世界はなぜ豊かな北と貧しい南に分かれるのか。植民地の遺産、援助、債務、貿易、移民、気候を事例で学ぶ。"
  ko: "세계는 왜 부유한 북반구와 가난한 남반구로 나뉘는가. 식민 유산, 원조, 부채, 무역, 이주, 기후를 사례로 본다."
  vi: "Vì sao thế giới chia thành Bắc giàu và Nam nghèo: di sản thuộc địa, viện trợ, nợ, thương mại, di cư, khí hậu, qua các ca cụ thể."
  ms: "Mengapa dunia terbahagi kepada Utara kaya dan Selatan miskin: warisan penjajahan, bantuan, hutang, perdagangan, migrasi dan iklim."
  id: "Mengapa dunia terbelah menjadi Utara kaya dan Selatan miskin: warisan kolonial, bantuan, utang, perdagangan, migrasi dan iklim."
  hi: "दुनिया अमीर उत्तर और ग़रीब दक्षिण में क्यों बँटी है: औपनिवेशिक विरासत, सहायता, क़र्ज़, व्यापार, प्रवास और जलवायु।"
outcomes:
  - en: "Explain how colonialism shaped today's global divide"
    zh: "解释殖民主义如何造成今天的全球分化"
    zh-TW: "解釋殖民主義如何造成今天的全球分化"
    ja: "植民地主義が今日の南北格差をどう生んだか説明する"
    ko: "식민주의가 오늘날 세계 격차를 만든 과정 설명하기"
    vi: "Giải thích chủ nghĩa thực dân tạo ra chia rẽ toàn cầu ra sao"
    ms: "Terangkan cara penjajahan membentuk jurang global hari ini"
    id: "Menjelaskan bagaimana kolonialisme membentuk kesenjangan global"
    hi: "उपनिवेशवाद ने आज के वैश्विक विभाजन को कैसे गढ़ा, समझाना"
  - en: "Analyse poverty, aid and debt with real case studies"
    zh: "结合真实案例分析贫困、援助和债务"
    zh-TW: "結合真實案例分析貧困、援助和債務"
    ja: "実例をもとに貧困、援助、債務を分析する"
    ko: "실제 사례로 빈곤, 원조, 부채 분석하기"
    vi: "Phân tích nghèo đói, viện trợ, nợ qua ca thực tế"
    ms: "Analisis kemiskinan, bantuan dan hutang dengan kajian kes"
    id: "Menganalisis kemiskinan, bantuan dan utang lewat studi kasus"
    hi: "असली उदाहरणों से ग़रीबी, सहायता और क़र्ज़ का विश्लेषण करना"
  - en: "Assess the role of global bodies like the UN"
    zh: "评估联合国等国际组织的作用"
    zh-TW: "評估聯合國等國際組織的作用"
    ja: "国連など国際機関の役割を評価する"
    ko: "유엔 같은 국제기구의 역할 평가하기"
    vi: "Đánh giá vai trò của tổ chức quốc tế như Liên Hợp Quốc"
    ms: "Nilai peranan badan global seperti PBB"
    id: "Menilai peran lembaga global seperti PBB"
    hi: "संयुक्त राष्ट्र जैसी वैश्विक संस्थाओं की भूमिका परखना"
