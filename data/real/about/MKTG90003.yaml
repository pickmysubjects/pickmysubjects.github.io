code: MKTG90003
year: 2027
learn:
  en: "How organisations manage relationships with their publics: PR theory, ethics, tactics, crisis management and marketing PR."
  zh: "组织如何管理与公众的关系：公关理论、伦理、策略、危机管理和营销公关。"
  zh-TW: "組織如何經營與公眾的關係：公關理論、倫理、策略、危機管理與行銷公關。"
  ja: "組織と公衆の関係づくり：PR理論、倫理、戦術、危機管理、マーケティングPR。"
  ko: "조직이 대중과의 관계를 관리하는 법: PR 이론, 윤리, 전술, 위기관리, 마케팅 PR."
  vi: "Tổ chức quản lý quan hệ với công chúng: lý thuyết PR, đạo đức, chiến thuật, quản lý khủng hoảng, PR marketing."
  ms: "Cara organisasi mengurus hubungan dengan orang awam: teori PR, etika, taktik, pengurusan krisis dan PR pemasaran."
  id: "Cara organisasi mengelola hubungan dengan publik: teori PR, etika, taktik, manajemen krisis dan PR pemasaran."
  hi: "संगठन जनता से संबंध कैसे संभालते हैं: PR सिद्धांत, नैतिकता, रणनीति, संकट प्रबंधन और मार्केटिंग PR।"
outcomes:
  - en: "Identify an organisation's key stakeholders"
    zh: "识别组织的主要利益相关者"
    zh-TW: "辨識組織的主要利害關係人"
    ja: "組織の主要ステークホルダーを特定する"
    ko: "조직의 핵심 이해관계자 파악하기"
    vi: "Xác định các bên liên quan chính của tổ chức"
    ms: "Mengenal pasti pihak berkepentingan utama"
    id: "Mengidentifikasi pemangku kepentingan utama"
    hi: "किसी संगठन के मुख्य हितधारक पहचानना"
  - en: "Analyse ethical issues in PR"
    zh: "分析公关中的伦理问题"
    zh-TW: "分析公關中的倫理問題"
    ja: "PRにおける倫理問題を分析する"
    ko: "PR의 윤리 문제 분석하기"
    vi: "Phân tích vấn đề đạo đức trong PR"
    ms: "Menganalisis isu etika dalam PR"
    id: "Menganalisis isu etika dalam PR"
    hi: "PR में नैतिक मुद्दों का विश्लेषण करना"
