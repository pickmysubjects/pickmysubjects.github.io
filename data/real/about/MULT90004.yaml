code: MULT90004
year: 2027
learn:
  en: "An interdisciplinary look at environmental crises: earth systems, the Anthropocene, biodiversity, water, energy and food."
  zh: "跨学科看环境危机：地球系统、人类世、生物多样性、水、能源和粮食。"
  zh-TW: "跨學科看環境危機：地球系統、人類世、生物多樣性、水、能源與糧食。"
  ja: "環境危機を学際的に考える。地球システム、人新世、生物多様性、水・エネルギー・食料。"
  ko: "환경 위기를 학제적으로 본다: 지구 시스템, 인류세, 생물다양성, 물·에너지·식량."
  vi: "Góc nhìn liên ngành về khủng hoảng môi trường: hệ Trái Đất, kỷ Nhân sinh, đa dạng sinh học, nước, năng lượng, lương thực."
  ms: "Pandangan antara disiplin tentang krisis alam sekitar: sistem bumi, Antroposen, biodiversiti, air, tenaga dan makanan."
  id: "Pandangan lintas disiplin tentang krisis lingkungan: sistem bumi, Antroposen, keanekaragaman hayati, air, energi, pangan."
  hi: "पर्यावरण संकटों पर अंतर्विषयी नज़र: पृथ्वी प्रणालियाँ, एंथ्रोपोसीन, जैव विविधता, जल, ऊर्जा और भोजन।"
outcomes:
  - en: "Explain earth processes that support human life"
    zh: "解释支撑人类生存的地球过程"
    zh-TW: "解釋支撐人類生存的地球過程"
    ja: "人類の生活を支える地球のしくみを説明する"
    ko: "인간 생활을 지탱하는 지구 과정 설명하기"
    vi: "Giải thích các quá trình Trái Đất nuôi sống con người"
    ms: "Menerangkan proses bumi yang menyokong kehidupan manusia"
    id: "Menjelaskan proses bumi yang menopang kehidupan manusia"
    hi: "मानव जीवन को सहारा देने वाली पृथ्वी प्रक्रियाएँ समझाना"
  - en: "Analyse social-ecological systems"
    zh: "分析社会-生态系统"
    zh-TW: "分析社會-生態系統"
    ja: "社会生態システムを分析する"
    ko: "사회-생태 시스템 분석하기"
    vi: "Phân tích hệ thống xã hội–sinh thái"
    ms: "Menganalisis sistem sosial-ekologi"
    id: "Menganalisis sistem sosial-ekologis"
    hi: "सामाजिक-पारिस्थितिक प्रणालियों का विश्लेषण"
  - en: "Compare views and roles in building sustainability"
    zh: "比较推动可持续发展的不同观点和角色"
    zh-TW: "比較推動永續發展的不同觀點與角色"
    ja: "持続可能性をめぐる考え方と役割を比べる"
    ko: "지속가능성에 대한 관점과 역할 비교하기"
    vi: "So sánh quan điểm và vai trò trong phát triển bền vững"
    ms: "Membandingkan pandangan dan peranan dalam kelestarian"
    id: "Membandingkan pandangan dan peran dalam keberlanjutan"
    hi: "स्थिरता बनाने में दृष्टिकोण और भूमिकाओं की तुलना"
