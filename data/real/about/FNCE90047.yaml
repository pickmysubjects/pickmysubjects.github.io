code: FNCE90047
year: 2027
learn:
  en: "How money and capital markets work: bonds, interest rates, duration, futures, options, swaps and regulation."
  zh: "货币与资本市场如何运作：债券、利率、久期、期货、期权、互换和监管。"
  zh-TW: "貨幣與資本市場如何運作：債券、利率、存續期間、期貨、選擇權、交換與監理。"
  ja: "短期・資本市場の仕組み：債券、金利、デュレーション、先物、オプション、スワップ、規制。"
  ko: "자금·자본시장의 작동: 채권, 금리, 듀레이션, 선물, 옵션, 스왑, 규제."
  vi: "Thị trường tiền tệ và vốn vận hành thế nào: trái phiếu, lãi suất, kỳ hạn, hợp đồng tương lai, quyền chọn, hoán đổi."
  ms: "Cara pasaran wang dan modal berfungsi: bon, kadar faedah, tempoh, niaga hadapan, opsyen, swap dan kawal selia."
  id: "Cara pasar uang dan modal bekerja: obligasi, suku bunga, durasi, futures, opsi, swap dan regulasi."
  hi: "मुद्रा और पूंजी बाज़ार कैसे चलते हैं: बॉन्ड, ब्याज दर, ड्यूरेशन, फ्यूचर्स, ऑप्शन, स्वैप और नियमन।"
outcomes:
  - en: "Explain the risk and return of financial instruments"
    zh: "解释各类金融工具的风险与收益"
    zh-TW: "解釋各類金融工具的風險與報酬"
    ja: "金融商品のリスクとリターンを説明する"
    ko: "금융상품의 위험과 수익 설명하기"
    vi: "Giải thích rủi ro, lợi nhuận của công cụ tài chính"
    ms: "Menerangkan risiko dan pulangan instrumen kewangan"
    id: "Menjelaskan risiko dan imbal hasil instrumen keuangan"
    hi: "वित्तीय साधनों का जोखिम और रिटर्न समझाना"
  - en: "Describe how derivatives are used"
    zh: "说明衍生品的用途"
    zh-TW: "說明衍生性商品的用途"
    ja: "デリバティブの使われ方を説明する"
    ko: "파생상품의 활용 방식 설명하기"
    vi: "Mô tả cách sử dụng công cụ phái sinh"
    ms: "Menerangkan cara derivatif digunakan"
    id: "Menjelaskan cara derivatif digunakan"
    hi: "डेरिवेटिव कैसे इस्तेमाल होते हैं, बताना"
