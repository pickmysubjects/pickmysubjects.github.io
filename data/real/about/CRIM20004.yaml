code: CRIM20004
year: 2026
learn:
  en: "Sociological and criminological theories of social order, crime and deviance, tested on real cases from cults to industrial disasters."
  zh: "关于社会秩序、犯罪和越轨的社会学与犯罪学理论，并用邪教、工业灾难等真实案例来检验。"
  zh-TW: "關於社會秩序、犯罪和偏差的社會學與犯罪學理論，並用邪教、工業災難等真實案例來檢驗。"
  ja: "社会秩序、犯罪、逸脱に関する社会学と犯罪学の理論を、カルトから産業事故まで実際の事例で検証する。"
  ko: "사회 질서, 범죄, 일탈에 관한 사회학과 범죄학 이론을 사이비 종교부터 산업 재해까지 실제 사례로 검증한다."
  vi: "Các lý thuyết xã hội học và tội phạm học về trật tự xã hội, tội phạm và lệch chuẩn, được kiểm chứng qua các vụ thực tế từ giáo phái đến thảm họa công nghiệp."
  ms: "Teori sosiologi dan kriminologi tentang tertib sosial, jenayah dan devians, diuji pada kes sebenar dari kultus hingga bencana industri."
  id: "Teori sosiologi dan kriminologi tentang tatanan sosial, kejahatan, dan penyimpangan, diuji pada kasus nyata dari sekte hingga bencana industri."
  hi: "सामाजिक व्यवस्था, अपराध और विचलन पर समाजशास्त्र और क्रिमिनोलॉजी के सिद्धांत, जिन्हें पंथों से औद्योगिक हादसों तक असली मामलों पर परखा जाता है।"
outcomes:
  - en: "Explain the main theories of crime and deviance"
    zh: "解释犯罪与越轨的主要理论"
    zh-TW: "解釋犯罪與偏差的主要理論"
    ja: "犯罪と逸脱の主要な理論を説明する"
    ko: "범죄와 일탈의 주요 이론 설명하기"
    vi: "Giải thích các lý thuyết chính về tội phạm và lệch chuẩn"
    ms: "Terangkan teori utama jenayah dan devians"
    id: "Menjelaskan teori utama kejahatan dan penyimpangan"
    hi: "अपराध और विचलन के मुख्य सिद्धांत समझाना"
  - en: "Test theories against real-life cases"
    zh: "用真实案例检验理论"
    zh-TW: "用真實案例檢驗理論"
    ja: "理論を実際の事例で検証する"
    ko: "실제 사례로 이론 검증하기"
    vi: "Kiểm chứng lý thuyết bằng các trường hợp thực tế"
    ms: "Uji teori pada kes kehidupan sebenar"
    id: "Menguji teori pada kasus nyata"
    hi: "सिद्धांतों को असली मामलों पर परखना"
  - en: "Explain how people and society shape each other"
    zh: "说明个人与社会如何相互影响"
    zh-TW: "說明個人與社會如何相互影響"
    ja: "個人と社会が互いにどう影響し合うか説明する"
    ko: "개인과 사회가 서로 어떻게 영향을 주는지 설명하기"
    vi: "Giải thích con người và xã hội tác động lẫn nhau ra sao"
    ms: "Terangkan cara individu dan masyarakat saling membentuk"
    id: "Menjelaskan cara individu dan masyarakat saling membentuk"
    hi: "समझाना कि व्यक्ति और समाज एक-दूसरे को कैसे गढ़ते हैं"
