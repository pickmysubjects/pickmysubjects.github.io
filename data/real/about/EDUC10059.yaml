code: EDUC10059
year: 2026
learn:
  en: "What drives high performance across study, sport, arts and work, with coaching skills and goal setting you can use."
  zh: "学习、运动、艺术和工作中高表现的来源，以及可用的教练技巧和目标设定。"
  zh-TW: "學習、運動、藝術與工作中高表現的來源，以及可用的教練技巧與目標設定。"
  ja: "学業・スポーツ・芸術・仕事での高いパフォーマンスの要因と、コーチングや目標設定。"
  ko: "학업·스포츠·예술·일에서 높은 성과의 원리와 코칭·목표 설정 기술."
  vi: "Điều gì tạo nên hiệu suất cao trong học tập, thể thao, nghệ thuật và công việc, kèm kỹ năng coaching và đặt mục tiêu."
  ms: "Apa yang mendorong prestasi tinggi dalam pelajaran, sukan, seni dan kerja, dengan kemahiran bimbingan dan penetapan matlamat."
  id: "Apa yang mendorong performa tinggi di studi, olahraga, seni, dan kerja, plus keterampilan coaching dan menetapkan tujuan."
  hi: "पढ़ाई, खेल, कला और काम में उच्च प्रदर्शन के कारण, साथ में कोचिंग और लक्ष्य तय करने के कौशल।"
outcomes:
  - en: "See performance and potential from several disciplines"
    zh: "从多个学科理解表现与潜能"
    zh-TW: "從多個學科理解表現與潛能"
    ja: "複数分野からパフォーマンスと可能性を捉える"
    ko: "여러 학문 관점에서 성과와 잠재력 이해하기"
    vi: "Nhìn hiệu suất và tiềm năng từ nhiều ngành"
    ms: "Fahami prestasi dan potensi dari pelbagai bidang"
    id: "Memahami performa dan potensi dari berbagai bidang"
    hi: "कई विषयों की नज़र से प्रदर्शन और क्षमता समझना"
  - en: "Apply evidence-based performance strategies to yourself and others"
    zh: "把有依据的提升表现方法用于自己和他人"
    zh-TW: "把有依據的提升表現方法用於自己和他人"
    ja: "根拠ある方法を自分と他者のパフォーマンス向上に使う"
    ko: "근거 기반 성과 전략을 나와 타인에게 적용하기"
    vi: "Áp dụng chiến lược dựa trên bằng chứng cho mình và người khác"
    ms: "Guna strategi prestasi berasaskan bukti pada diri dan orang lain"
    id: "Menerapkan strategi performa berbasis bukti pada diri dan orang lain"
    hi: "प्रमाण-आधारित तरीक़े ख़ुद पर और दूसरों पर लागू करना"
  - en: "Critique the strengths and limits of performance models"
    zh: "批判看待表现模型的优点和局限"
    zh-TW: "批判看待表現模型的優點與侷限"
    ja: "パフォーマンス・モデルの長所と限界を批判的に見る"
    ko: "성과 모델의 강점과 한계 비판적으로 보기"
    vi: "Phản biện điểm mạnh và giới hạn của các mô hình hiệu suất"
    ms: "Kritik kekuatan dan had model prestasi"
    id: "Mengkritisi kelebihan dan keterbatasan model performa"
    hi: "प्रदर्शन मॉडलों की ख़ूबियों और सीमाओं की समीक्षा करना"
