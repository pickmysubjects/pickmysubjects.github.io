code: POLS30011
year: 2026
learn:
  en: "A history-based survey of Chinese politics, from the early Communist Party and Mao's rise to the society and politics of China today."
  zh: "以历史为主线的中国政治概览，从早期的共产党和毛泽东崛起，一直讲到当今中国的社会与政治。"
  zh-TW: "以歷史為主軸的中國政治概覽，從早期的共產黨和毛澤東崛起，一直講到當今中國的社會與政治。"
  ja: "歴史を軸に中国政治を概観し、初期の共産党と毛沢東の台頭から今日の中国の社会と政治までを学ぶ。"
  ko: "역사를 중심으로 중국 정치를 개관하며 초기 공산당과 마오쩌둥의 부상부터 오늘날 중국 사회와 정치까지 다룬다."
  vi: "Tổng quan chính trị Trung Quốc theo dòng lịch sử, từ Đảng Cộng sản thời đầu và sự nổi lên của Mao đến xã hội, chính trị Trung Quốc ngày nay."
  ms: "Tinjauan politik China berasaskan sejarah, dari Parti Komunis awal dan kebangkitan Mao hingga masyarakat dan politik China hari ini."
  id: "Tinjauan politik Tiongkok berbasis sejarah, dari Partai Komunis awal dan naiknya Mao hingga masyarakat dan politik Tiongkok kini."
  hi: "इतिहास के सहारे चीनी राजनीति का सर्वे, शुरुआती कम्युनिस्ट पार्टी और माओ के उभार से आज के चीन के समाज और राजनीति तक।"
outcomes:
  - en: "Describe key stages in modern Chinese political history"
    zh: "描述中国现代政治史的关键阶段"
    zh-TW: "描述中國現代政治史的關鍵階段"
    ja: "中国近現代政治史の重要な段階を説明する"
    ko: "중국 현대 정치사의 주요 단계 설명하기"
    vi: "Mô tả các giai đoạn chính của lịch sử chính trị Trung Quốc hiện đại"
    ms: "Huraikan peringkat utama sejarah politik China moden"
    id: "Menjelaskan tahap penting sejarah politik Tiongkok modern"
    hi: "आधुनिक चीनी राजनीतिक इतिहास के अहम दौर बताना"
  - en: "Link the past to China's politics today"
    zh: "把历史和当今中国政治联系起来"
    zh-TW: "把歷史和當今中國政治連結起來"
    ja: "過去と今日の中国政治を結びつける"
    ko: "과거와 오늘날 중국 정치 연결하기"
    vi: "Liên hệ quá khứ với chính trị Trung Quốc hôm nay"
    ms: "Kaitkan masa lalu dengan politik China kini"
    id: "Mengaitkan masa lalu dengan politik Tiongkok kini"
    hi: "अतीत को आज की चीनी राजनीति से जोड़ना"
  - en: "Analyse how the state and society interact in China"
    zh: "分析中国国家与社会的互动"
    zh-TW: "分析中國國家與社會的互動"
    ja: "中国で国家と社会がどう関わるか分析する"
    ko: "중국에서 국가와 사회의 상호작용 분석하기"
    vi: "Phân tích nhà nước và xã hội tương tác ra sao ở Trung Quốc"
    ms: "Analisis interaksi negara dan masyarakat di China"
    id: "Menganalisis interaksi negara dan masyarakat di Tiongkok"
    hi: "चीन में राज्य और समाज के आपसी रिश्ते का विश्लेषण करना"
