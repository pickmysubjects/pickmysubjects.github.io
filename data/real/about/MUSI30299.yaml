code: MUSI30299
year: 2027
learn:
  en: "Individual lessons that bring your skills together to plan and perform a coherent, balanced recital program of your own."
  zh: "个别辅导，综合所学技能，策划并演出一场连贯、均衡的个人独奏会。"
  zh-TW: "個別指導，綜合所學技能，策劃並演出一場連貫、均衡的個人獨奏會。"
  ja: "個人レッスンで、これまでの技能をまとめ、まとまりのある自分のリサイタルを企画・演奏する。"
  ko: "개인 레슨으로 배운 기술을 모아 일관되고 균형 잡힌 자신만의 리사이틀을 기획·공연."
  vi: "Học riêng để tổng hợp kỹ năng, lên ý tưởng và biểu diễn một chương trình độc tấu cá nhân mạch lạc, cân đối."
  ms: "Kelas individu untuk menggabungkan kemahiran, merancang dan mempersembahkan resital sendiri yang padu dan seimbang."
  id: "Les individual untuk memadukan keterampilan, merancang, dan membawakan resital pribadi yang utuh dan seimbang."
  hi: "व्यक्तिगत कक्षाओं में सीखे कौशल जोड़कर अपना सुसंगत, संतुलित रिसाइटल कार्यक्रम बनाना और प्रस्तुत करना।"
outcomes:
  - en: "Consolidate technical control in performance"
    zh: "巩固演奏中的技术控制"
    zh-TW: "鞏固演奏中的技術控制"
    ja: "演奏での技術コントロールを固める"
    ko: "연주에서 기술 통제력 굳히기"
    vi: "Củng cố kiểm soát kỹ thuật khi biểu diễn"
    ms: "Mantapkan kawalan teknik dalam persembahan"
    id: "Memantapkan kontrol teknik saat tampil"
    hi: "प्रस्तुति में तकनीकी नियंत्रण पक्का करना"
  - en: "Play recital pieces fluently, accurately and with character"
    zh: "流畅、准确且有个性地演奏曲目"
    zh-TW: "流暢、準確且有個性地演奏曲目"
    ja: "曲を流暢・正確に、個性をもって演奏する"
    ko: "레퍼토리를 유창하고 정확하게, 개성 있게 연주하기"
    vi: "Trình diễn tiết mục trôi chảy, chính xác và có cá tính"
    ms: "Persembahkan repertoir dengan lancar, tepat dan berkarakter"
    id: "Membawakan repertoar dengan lancar, akurat, dan berkarakter"
    hi: "रिपर्टॉयर को सहजता, सटीकता और भाव के साथ प्रस्तुत करना"
  - en: "Design, prepare and present a balanced recital"
    zh: "设计、准备并呈现均衡的独奏会"
    zh-TW: "設計、準備並呈現均衡的獨奏會"
    ja: "バランスの取れたリサイタルを企画・準備・発表する"
    ko: "균형 잡힌 리사이틀 기획, 준비, 발표하기"
    vi: "Thiết kế, chuẩn bị và trình bày buổi độc tấu cân đối"
    ms: "Reka, sedia dan persembahkan resital seimbang"
    id: "Merancang, menyiapkan, dan menyajikan resital seimbang"
    hi: "संतुलित रिसाइटल की योजना, तैयारी और प्रस्तुति"
