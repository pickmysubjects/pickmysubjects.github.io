code: DNCE30028
year: 2026
learn:
  en: "Final-semester season: rehearse with guest choreographers and perform in the public graduating dance event."
  zh: "毕业学期演出季：与客座编舞排练，并在公开的毕业舞蹈演出中登台。"
  zh-TW: "畢業學期演出季：與客座編舞排練，並在公開的畢業舞蹈演出中登台。"
  ja: "最終学期の公演：ゲスト振付家とリハーサルし、公開の卒業ダンス公演に出演する。"
  ko: "마지막 학기 시즌: 객원 안무가와 연습하고 공개 졸업 무용 공연에 오른다."
  vi: "Mùa diễn học kỳ cuối: tập với biên đạo khách mời và diễn trong chương trình tốt nghiệp."
  ms: "Musim semester akhir: berlatih dengan koreografer jemputan dan menari dalam acara graduasi."
  id: "Musim semester akhir: berlatih dengan koreografer tamu dan tampil di pertunjukan kelulusan."
  hi: "अंतिम सेमेस्टर सीज़न: अतिथि कोरियोग्राफ़रों के साथ रिहर्सल और सार्वजनिक ग्रेजुएटिंग डांस इवेंट।"
outcomes:
  - en: "Adapt to different choreographers and styles"
    zh: "适应不同编舞者和风格"
    zh-TW: "適應不同編舞者和風格"
    ja: "さまざまな振付家とスタイルに適応する"
    ko: "여러 안무가와 스타일에 적응하기"
    vi: "Thích nghi với nhiều biên đạo và phong cách"
    ms: "Menyesuaikan diri dengan pelbagai koreografer"
    id: "Beradaptasi dengan berbagai koreografer dan gaya"
    hi: "अलग कोरियोग्राफ़रों और शैलियों के अनुसार ढलना"
  - en: "Show work in progress from research and rehearsal"
    zh: "展示研究与排练中的阶段成果"
    zh-TW: "展示研究與排練中的階段成果"
    ja: "研究と稽古の途中経過を発表する"
    ko: "연구·리허설 중간 결과 발표하기"
    vi: "Trình bày tác phẩm đang dàn dựng"
    ms: "Tunjuk karya dalam proses"
    id: "Menampilkan karya yang sedang dikembangkan"
    hi: "शोध और रिहर्सल का प्रगति-कार्य दिखाना"
  - en: "Perform in a public season"
    zh: "在公开演出季中表演"
    zh-TW: "在公開演出季中表演"
    ja: "公開公演に出演する"
    ko: "공개 공연 시즌에 출연하기"
    vi: "Biểu diễn trong mùa diễn công khai"
    ms: "Membuat persembahan dalam musim awam"
    id: "Tampil dalam musim pertunjukan publik"
    hi: "सार्वजनिक सीज़न में प्रस्तुति देना"
