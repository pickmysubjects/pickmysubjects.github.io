code: SCRN30006
year: 2026
learn:
  en: "Documentary and ethnographic film, from Nanook of the North to recent works: realism, filming 'the other', and the ethics of non-fiction."
  zh: "纪录片与民族志电影，从《北方的纳努克》到近作：真实性、拍摄“他者”以及非虚构影像的伦理。"
  zh-TW: "紀錄片與民族誌電影，從《北方的納努克》到近作：真實性、拍攝「他者」以及非虛構影像的倫理。"
  ja: "『極北のナヌーク』から近作までのドキュメンタリーと民族誌映画。リアリズム、「他者」を撮ること、ノンフィクションの倫理。"
  ko: "『북극의 나누크』부터 최근작까지 다큐멘터리와 민족지 영화. 리얼리즘, '타자' 촬영, 논픽션의 윤리."
  vi: "Phim tài liệu và phim dân tộc học, từ Nanook of the North đến nay: tính hiện thực, quay 'người khác' và đạo đức phi hư cấu."
  ms: "Filem dokumentari dan etnografi, dari Nanook of the North hingga karya baharu: realisme, merakam 'orang lain' dan etika bukan fiksyen."
  id: "Film dokumenter dan etnografi, dari Nanook of the North hingga karya baru: realisme, merekam 'liyan' dan etika nonfiksi."
  hi: "डॉक्यूमेंट्री और नृवंश-विज्ञान फ़िल्में, 'नानूक ऑफ़ द नॉर्थ' से हाल की रचनाओं तक: यथार्थ, 'दूसरों' को फ़िल्माना और गैर-काल्पनिक की नैतिकता।"
outcomes:
  - en: "Tell apart the main documentary styles"
    zh: "区分纪录片的主要风格"
    zh-TW: "區分紀錄片的主要風格"
    ja: "ドキュメンタリーの主な様式を見分ける"
    ko: "다큐멘터리의 주요 양식 구별하기"
    vi: "Phân biệt các phong cách phim tài liệu chính"
    ms: "Bezakan gaya dokumentari utama"
    id: "Membedakan gaya dokumenter utama"
    hi: "डॉक्यूमेंट्री की मुख्य शैलियों में फ़र्क करना"
  - en: "Weigh the ethics of filming other people"
    zh: "权衡拍摄他人的伦理"
    zh-TW: "權衡拍攝他人的倫理"
    ja: "他者を撮ることの倫理を考える"
    ko: "타인을 촬영하는 윤리 따져보기"
    vi: "Cân nhắc đạo đức khi quay người khác"
    ms: "Timbang etika merakam orang lain"
    id: "Menimbang etika merekam orang lain"
    hi: "दूसरों को फ़िल्माने की नैतिकता तौलना"
  - en: "Analyse documentaries on social issues"
    zh: "分析关注社会议题的纪录片"
    zh-TW: "分析關注社會議題的紀錄片"
    ja: "社会問題を扱うドキュメンタリーを分析する"
    ko: "사회 문제를 다룬 다큐멘터리 분석하기"
    vi: "Phân tích phim tài liệu về vấn đề xã hội"
    ms: "Analisis dokumentari tentang isu sosial"
    id: "Menganalisis dokumenter tentang isu sosial"
    hi: "सामाजिक मुद्दों पर बनी डॉक्यूमेंट्री का विश्लेषण करना"
