code: COMP90017
year: 2027
learn:
  en: "Sensor networks from three angles, sensing, communication and computing, plus where they are used."
  zh: "从感知、通信、计算三方面学习传感器网络及其应用。"
  zh-TW: "從感測、通訊、運算三方面學習感測器網路及其應用。"
  ja: "センシング・通信・計算の三面からセンサーネットワークと応用を学ぶ。"
  ko: "센싱·통신·컴퓨팅 세 측면에서 센서 네트워크와 응용을 배움."
  vi: "Mạng cảm biến từ ba góc độ: cảm biến, truyền thông, tính toán, và ứng dụng."
  ms: "Rangkaian sensor dari tiga sudut: pengesanan, komunikasi, pengkomputeran, serta aplikasinya."
  id: "Jaringan sensor dari tiga sisi: penginderaan, komunikasi, komputasi, serta penerapannya."
  hi: "सेंसर नेटवर्क तीन नज़रियों से: सेंसिंग, संचार, कंप्यूटिंग, और उनके उपयोग।"
outcomes:
  - en: "Explain design and deployment issues of sensor networks"
    zh: "说明传感器网络的设计与部署问题"
    zh-TW: "說明感測器網路的設計與部署問題"
    ja: "センサーネットワークの設計・配置の課題を説明する"
    ko: "센서 네트워크 설계·배치 문제 설명하기"
    vi: "Giải thích vấn đề thiết kế và triển khai mạng cảm biến"
    ms: "Terangkan isu reka bentuk dan pemasangan rangkaian sensor"
    id: "Menjelaskan isu desain dan penerapan jaringan sensor"
    hi: "सेंसर नेटवर्क के डिज़ाइन और तैनाती के मुद्दे समझाना"
  - en: "Reason about energy and bandwidth limits in routing"
    zh: "分析路由中的能耗与带宽限制"
    zh-TW: "分析路由中的能耗與頻寬限制"
    ja: "ルーティングでの電力と帯域の制約を考える"
    ko: "라우팅의 에너지·대역폭 제약 분석하기"
    vi: "Phân tích giới hạn năng lượng và băng thông khi định tuyến"
    ms: "Analisis had tenaga dan lebar jalur dalam penghalaan"
    id: "Menganalisis batas energi dan bandwidth dalam routing"
    hi: "रूटिंग में ऊर्जा और बैंडविड्थ सीमाओं पर विचार करना"
