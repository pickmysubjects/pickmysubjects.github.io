code: MUSI20236
year: 2026
learn:
  en: "Music of Spanish-speaking Latin America, from the Caribbean to the Andes, and how it ties to culture and language. Not offered in 2026."
  zh: "拉丁美洲西语地区音乐，从加勒比到安第斯，与文化和语言的联系。2026年不开。"
  zh-TW: "拉丁美洲西語地區音樂，從加勒比到安地斯，與文化和語言的連結。2026年不開。"
  ja: "スペイン語圏ラテンアメリカの音楽。カリブからアンデスまで、文化と言語との関係。2026年休講。"
  ko: "스페인어권 라틴아메리카 음악, 카리브에서 안데스까지 문화·언어와의 관계. 2026년 미개설."
  vi: "Âm nhạc Mỹ Latinh nói tiếng Tây Ban Nha, từ Caribe đến Andes, gắn với văn hóa, ngôn ngữ. Không mở 2026."
  ms: "Muzik Amerika Latin berbahasa Sepanyol, Caribbean hingga Andes, budaya dan bahasa. Tiada 2026."
  id: "Musik Amerika Latin berbahasa Spanyol, Karibia hingga Andes, budaya dan bahasa. Tidak dibuka 2026."
  hi: "स्पेनिश-भाषी लैटिन अमेरिका का संगीत, कैरिबियन से एंडीज़ तक, संस्कृति-भाषा से जुड़ाव। 2026 में नहीं।"
outcomes:
  - en: "Recognise Latin American styles by ear"
    zh: "听辨拉丁美洲音乐风格"
    zh-TW: "聽辨拉丁美洲音樂風格"
    ja: "ラテンアメリカの様式を聴き分ける"
    ko: "라틴아메리카 스타일 듣고 구별하기"
    vi: "Nhận ra phong cách Mỹ Latinh qua tai"
    ms: "Kenal pasti gaya Amerika Latin melalui dengar"
    id: "Mengenali gaya Amerika Latin lewat pendengaran"
    hi: "लैटिन अमेरिकी शैलियाँ सुनकर पहचानना"
  - en: "Read research critically and respond in writing"
    zh: "批判性阅读研究并书面回应"
    zh-TW: "批判性閱讀研究並書面回應"
    ja: "研究文献を批判的に読み、文章で応える"
    ko: "연구를 비판적으로 읽고 글로 답하기"
    vi: "Đọc nghiên cứu có phản biện và viết phản hồi"
    ms: "Baca kajian secara kritis dan balas secara bertulis"
    id: "Membaca riset secara kritis dan menanggapinya tertulis"
    hi: "शोध को आलोचनात्मक रूप से पढ़कर लिखित जवाब देना"
  - en: "Plan and write a research essay on music"
    zh: "规划并撰写一篇音乐研究论文"
    zh-TW: "規劃並撰寫一篇音樂研究論文"
    ja: "音楽に関する研究エッセイを計画し書く"
    ko: "음악에 관한 연구 에세이 기획·작성하기"
    vi: "Lên kế hoạch và viết bài luận nghiên cứu về âm nhạc"
    ms: "Rancang dan tulis esei kajian tentang muzik"
    id: "Merancang dan menulis esai riset tentang musik"
    hi: "संगीत पर शोध निबंध की योजना बनाकर लिखना"
