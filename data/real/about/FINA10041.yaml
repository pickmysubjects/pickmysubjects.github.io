code: FINA10041
year: 2027
learn:
  en: "How artists think and how artworks work as ideas, through themes like the body, humour, beauty and the everyday."
  zh: "通过身体、幽默、美和日常等主题，了解艺术家如何思考、作品如何表达想法。"
  zh-TW: "透過身體、幽默、美和日常等主題，了解藝術家如何思考、作品如何表達想法。"
  ja: "身体・ユーモア・美・日常などのテーマから、アーティストの考え方と作品がアイデアとして働く仕組みを学ぶ。"
  ko: "몸, 유머, 아름다움, 일상 같은 주제로 예술가의 사고방식과 작품이 생각을 담는 방식을 배운다."
  vi: "Cách nghệ sĩ suy nghĩ và tác phẩm truyền tải ý tưởng, qua các chủ đề như cơ thể, hài hước, cái đẹp và đời thường."
  ms: "Cara artis berfikir dan cara karya seni menyampaikan idea, melalui tema seperti tubuh, humor, keindahan dan kehidupan harian."
  id: "Cara seniman berpikir dan cara karya seni menyampaikan gagasan, lewat tema seperti tubuh, humor, keindahan, dan keseharian."
  hi: "शरीर, हास्य, सुंदरता और रोज़मर्रा जैसे विषयों से समझना कि कलाकार कैसे सोचते हैं और कलाकृतियाँ विचारों की तरह कैसे काम करती हैं।"
outcomes:
  - en: "Explain how contemporary art engages with ideas"
    zh: "解释当代艺术如何回应思想"
    zh-TW: "解釋當代藝術如何回應思想"
    ja: "現代アートがアイデアとどう関わるか説明する"
    ko: "현대 미술이 생각을 다루는 방식 설명하기"
    vi: "Giải thích nghệ thuật đương đại gắn với ý tưởng thế nào"
    ms: "Terangkan cara seni kontemporari berinteraksi dengan idea"
    id: "Menjelaskan cara seni kontemporer bergulat dengan gagasan"
    hi: "समकालीन कला विचारों से कैसे जुड़ती है, यह समझाना"
  - en: "Analyse how artists create and share meaning"
    zh: "分析艺术家如何创造和传达意义"
    zh-TW: "分析藝術家如何創造和傳達意義"
    ja: "アーティストが意味を生み伝える方法を分析する"
    ko: "예술가가 의미를 만들고 전하는 방식 분석하기"
    vi: "Phân tích cách nghệ sĩ tạo và truyền tải ý nghĩa"
    ms: "Analisis cara artis mencipta dan menyampaikan makna"
    id: "Menganalisis cara seniman menciptakan dan menyampaikan makna"
    hi: "कलाकार अर्थ कैसे रचते और पहुँचाते हैं, इसका विश्लेषण करना"
  - en: "Reflect on your own responses to artworks"
    zh: "反思自己对艺术作品的感受"
    zh-TW: "反思自己對藝術作品的感受"
    ja: "作品への自分の反応を振り返る"
    ko: "작품에 대한 자신의 반응 성찰하기"
    vi: "Suy ngẫm về cảm nhận của mình với tác phẩm"
    ms: "Renung respons sendiri terhadap karya seni"
    id: "Merefleksikan tanggapan pribadi terhadap karya seni"
    hi: "कलाकृतियों पर अपनी प्रतिक्रिया पर विचार करना"
