code: ABPL90309
year: 2027
learn:
  en: "How construction supply chains work and how to map and improve them, with case studies, site visits and industry guests."
  zh: "建筑供应链如何运作、如何梳理和改进，配合案例、工地参观和行业嘉宾。"
  zh-TW: "營建供應鏈如何運作、如何繪製與改善，搭配個案、工地參訪與業界講者。"
  ja: "建設サプライチェーンの仕組みと改善。事例・現場見学・業界ゲスト付き。"
  ko: "건설 공급망의 구조와 개선 방법. 사례·현장 견학·업계 연사."
  vi: "Chuỗi cung ứng xây dựng vận hành ra sao và cách cải thiện, qua tình huống và tham quan công trường."
  ms: "Cara rantaian bekalan pembinaan berfungsi dan cara memperbaikinya, dengan lawatan tapak."
  id: "Cara rantai pasok konstruksi bekerja dan cara memperbaikinya, dengan kunjungan lapangan."
  hi: "निर्माण आपूर्ति श्रृंखला कैसे चलती है और उसे कैसे सुधारें, साइट विज़िट के साथ।"
outcomes:
  - en: "Map a construction supply chain and find its critical points"
    zh: "梳理建筑供应链并找出关键节点"
    zh-TW: "繪製營建供應鏈並找出關鍵節點"
    ja: "サプライチェーンを図にし要所を見つける"
    ko: "공급망을 그려 핵심 지점 찾기"
    vi: "Vẽ chuỗi cung ứng và tìm điểm then chốt"
    ms: "Memetakan rantaian bekalan dan titik kritikal"
    id: "Memetakan rantai pasok dan titik kritisnya"
    hi: "आपूर्ति श्रृंखला का नक्शा बनाना व अहम बिंदु खोजना"
  - en: "Recommend ways to improve productivity and value"
    zh: "提出提高效率和价值的建议"
    zh-TW: "提出提升效率與價值的建議"
    ja: "生産性と価値を高める方法を提案する"
    ko: "생산성과 가치 개선 방안 제안하기"
    vi: "Đề xuất cách nâng năng suất và giá trị"
    ms: "Mencadang cara meningkatkan produktiviti dan nilai"
    id: "Merekomendasikan cara meningkatkan produktivitas"
    hi: "उत्पादकता और मूल्य बढ़ाने के उपाय सुझाना"
