code: NUTR30005
year: 2026
learn:
  en: "How genes, enzymes and diet interact, and what that means for health and personalised nutrition."
  zh: "基因、酶与饮食如何相互作用，以及对健康和个性化营养的意义。"
  zh-TW: "基因、酵素與飲食如何交互作用，以及對健康與個人化營養的意義。"
  ja: "遺伝子・酵素・食事の相互作用と、健康や個別化栄養への意味。"
  ko: "유전자·효소·식단의 상호작용과 건강 및 맞춤 영양에 주는 의미."
  vi: "Gen, enzyme và chế độ ăn tương tác ra sao, ý nghĩa với sức khỏe và dinh dưỡng cá nhân hóa."
  ms: "Interaksi gen, enzim dan diet, serta maknanya untuk kesihatan dan nutrisi peribadi."
  id: "Interaksi gen, enzim dan pola makan, serta artinya bagi kesehatan dan gizi personal."
  hi: "जीन, एंज़ाइम और आहार कैसे परस्पर क्रिया करते हैं, और स्वास्थ्य व पर्सनलाइज़्ड पोषण पर इसका अर्थ।"
outcomes:
  - en: "Explain the biochemical roles of nutrients"
    zh: "解释营养素的生化作用"
    zh-TW: "解釋營養素的生化作用"
    ja: "栄養素の生化学的役割を説明する"
    ko: "영양소의 생화학적 역할 설명"
    vi: "Giải thích vai trò sinh hóa của dưỡng chất"
    ms: "Terangkan peranan biokimia nutrien"
    id: "Menjelaskan peran biokimia zat gizi"
    hi: "पोषक तत्वों की जैव-रासायनिक भूमिका समझाना"
  - en: "Evaluate genomics evidence for personal nutrition"
    zh: "评估个性化营养的基因组证据"
    zh-TW: "評估個人化營養的基因體證據"
    ja: "個別化栄養のゲノム知見を評価する"
    ko: "맞춤 영양의 유전체 근거 평가"
    vi: "Đánh giá bằng chứng hệ gen cho dinh dưỡng cá nhân"
    ms: "Nilai bukti genomik untuk nutrisi peribadi"
    id: "Menilai bukti genomik untuk gizi personal"
    hi: "पर्सनल पोषण के लिए जीनोमिक साक्ष्य परखना"
