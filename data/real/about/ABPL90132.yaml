code: ABPL90132
year: 2027
learn:
  en: "Urban design for planners: what makes good public places and how urban codes can shape them, through studio workshops and fieldwork."
  zh: "面向规划师的城市设计：好的公共空间由什么构成，以及如何用城市规则塑造它们，通过工作坊和实地调研。"
  zh-TW: "面向規劃師的都市設計：好的公共空間由什麼構成，以及如何用都市規則塑造，透過工作坊與田野調查。"
  ja: "計画者のための都市デザイン：良い公共空間とは何か、都市コードでどう形作るか。"
  ko: "계획가를 위한 도시설계: 좋은 공공공간의 조건과 도시 코드로 만드는 법. 스튜디오·현장."
  vi: "Thiết kế đô thị cho nhà quy hoạch: không gian công cộng tốt và cách dùng quy tắc đô thị."
  ms: "Reka bentuk bandar untuk perancang: ruang awam yang baik dan cara kod bandar membentuknya."
  id: "Desain kota untuk perencana: ruang publik yang baik dan cara kode kota membentuknya."
  hi: "योजनाकारों के लिए शहरी डिज़ाइन: अच्छे सार्वजनिक स्थान और शहरी कोड से उन्हें गढ़ना।"
outcomes:
  - en: "Analyse the qualities of urban places"
    zh: "分析城市空间的品质"
    zh-TW: "分析都市空間的品質"
    ja: "都市空間の質を分析する"
    ko: "도시 장소의 특성 분석하기"
    vi: "Phân tích chất lượng không gian đô thị"
    ms: "Menganalisis kualiti tempat bandar"
    id: "Menganalisis kualitas tempat kota"
    hi: "शहरी स्थानों की गुणवत्ता का विश्लेषण"
  - en: "Use urban codes to guide design outcomes"
    zh: "用城市规则引导设计结果"
    zh-TW: "用都市規則引導設計結果"
    ja: "都市コードで設計を方向づける"
    ko: "도시 코드로 설계 결과 유도하기"
    vi: "Dùng quy tắc đô thị định hướng thiết kế"
    ms: "Menggunakan kod bandar untuk memandu reka bentuk"
    id: "Memakai kode kota untuk mengarahkan desain"
    hi: "शहरी कोड से डिज़ाइन परिणाम दिशा देना"
