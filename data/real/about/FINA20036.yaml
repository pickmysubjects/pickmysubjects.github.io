code: FINA20036
year: 2026
learn:
  en: "Make a short animated film frame by frame under a camera, using drawing, cut-outs or objects, in an online intensive."
  zh: "在线密集课：在镜头下逐帧拍摄，用绘画、剪纸或物件做一部动画短片"
  zh-TW: "線上密集課：在鏡頭下逐格拍攝，用繪畫、剪紙或物件做一部動畫短片"
  ja: "オンライン集中講座。描画や切り絵、物を使い、カメラの下で1コマずつ撮って短編アニメを作る。"
  ko: "온라인 집중 과정: 그림, 오려 붙이기, 사물로 카메라 아래에서 한 프레임씩 찍어 단편 애니메이션 제작."
  vi: "Khóa cấp tốc trực tuyến: làm phim hoạt hình ngắn từng khung hình dưới máy quay bằng tranh vẽ, giấy cắt hay đồ vật."
  ms: "Intensif dalam talian: hasilkan filem animasi pendek bingkai demi bingkai di bawah kamera dengan lukisan atau objek."
  id: "Intensif daring: buat film animasi pendek bingkai demi bingkai di bawah kamera dengan gambar, guntingan, atau benda."
  hi: "ऑनलाइन इंटेंसिव: कैमरे के नीचे फ़्रेम-दर-फ़्रेम ड्रॉइंग, कट-आउट या वस्तुओं से छोटी एनिमेटेड फ़िल्म बनाना।"
outcomes:
  - en: "Use several under-camera animation techniques"
    zh: "掌握几种镜头下动画技法"
    zh-TW: "掌握幾種鏡頭下動畫技法"
    ja: "カメラ下アニメーションの技法をいくつか使いこなす"
    ko: "여러 카메라 아래 애니메이션 기법 활용하기"
    vi: "Sử dụng nhiều kỹ thuật hoạt hình dưới máy quay"
    ms: "Menggunakan beberapa teknik animasi bawah kamera"
    id: "Menggunakan beberapa teknik animasi bawah kamera"
    hi: "कैमरे के नीचे एनिमेशन की कई तकनीकें इस्तेमाल करना"
  - en: "Edit photographed frames into a 30-60 second film"
    zh: "把拍好的帧剪辑成30到60秒的短片"
    zh-TW: "把拍好的影格剪輯成30到60秒的短片"
    ja: "撮影したコマを30〜60秒の作品に編集する"
    ko: "촬영한 프레임을 30~60초 영상으로 편집하기"
    vi: "Dựng các khung hình thành phim 30-60 giây"
    ms: "Menyunting bingkai menjadi filem 30-60 saat"
    id: "Menyunting bingkai menjadi film 30-60 detik"
    hi: "खींचे गए फ़्रेमों को 30-60 सेकंड की फ़िल्म में एडिट करना"
  - en: "Document and reflect on your process in a folio"
    zh: "在作品集中记录并反思创作过程"
    zh-TW: "在作品集中記錄並反思創作過程"
    ja: "制作過程を作品集に記録し振り返る"
    ko: "작업 과정을 포트폴리오에 기록하고 돌아보기"
    vi: "Ghi lại và suy ngẫm quá trình trong hồ sơ"
    ms: "Merekod dan menilai proses dalam folio"
    id: "Mendokumentasikan dan merefleksikan proses dalam portofolio"
    hi: "फ़ोलियो में अपनी प्रक्रिया दर्ज करना और उस पर विचार करना"
