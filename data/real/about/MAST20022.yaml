code: MAST20022
year: 2026
learn:
  en: "Abstract algebra: groups and symmetry, plus deeper linear algebra, with RSA encryption as an application."
  zh: "抽象代数：群和对称，加上更深的线性代数，还会讲 RSA 加密。"
  zh-TW: "抽象代數：群和對稱，加上更深入的線性代數，還會講 RSA 加密。"
  ja: "抽象代数：群と対称性、より深い線形代数。応用としてRSA暗号も扱う。"
  ko: "추상대수: 군과 대칭, 더 깊은 선형대수, 응용으로 RSA 암호."
  vi: "Đại số trừu tượng: nhóm và đối xứng, đại số tuyến tính sâu hơn, ứng dụng vào mã hóa RSA."
  ms: "Algebra abstrak: kumpulan dan simetri, algebra linear lebih mendalam, dengan aplikasi penyulitan RSA."
  id: "Aljabar abstrak: grup dan simetri, aljabar linear lebih dalam, dengan penerapan enkripsi RSA."
  hi: "अमूर्त बीजगणित: ग्रुप और सममिति, गहरा रैखिक बीजगणित, और RSA एन्क्रिप्शन में इसका उपयोग।"
outcomes:
  - en: "Do modular arithmetic and apply it to RSA encryption"
    zh: "做模运算并用在 RSA 加密上"
    zh-TW: "做模運算並用在 RSA 加密上"
    ja: "剰余演算を行いRSA暗号に応用する"
    ko: "모듈러 연산을 하고 RSA 암호에 적용하기"
    vi: "Làm số học đồng dư và áp dụng vào mã hóa RSA"
    ms: "Melakukan aritmetik modular dan menggunakannya untuk RSA"
    id: "Mengerjakan aritmetika modular dan menerapkannya pada RSA"
    hi: "मॉड्यूलर अंकगणित करना और RSA एन्क्रिप्शन में लगाना"
  - en: "Compute eigenvalues, eigenvectors and normal forms"
    zh: "算特征值、特征向量和标准形"
    zh-TW: "算特徵值、特徵向量和標準形"
    ja: "固有値・固有ベクトル・標準形を計算する"
    ko: "고윳값, 고유벡터, 표준형 계산하기"
    vi: "Tính trị riêng, vectơ riêng và dạng chuẩn"
    ms: "Mengira nilai eigen, vektor eigen dan bentuk normal"
    id: "Menghitung nilai eigen, vektor eigen, dan bentuk normal"
    hi: "आइगेनवैल्यू, आइगेनवेक्टर और नॉर्मल फ़ॉर्म निकालना"
  - en: "Write rigorous proofs in algebra"
    zh: "写严谨的代数证明"
    zh-TW: "寫嚴謹的代數證明"
    ja: "代数で厳密な証明を書く"
    ko: "대수에서 엄밀한 증명 쓰기"
    vi: "Viết chứng minh đại số chặt chẽ"
    ms: "Menulis bukti algebra yang rapi"
    id: "Menulis bukti aljabar yang ketat"
    hi: "बीजगणित में सख्त प्रमाण लिखना"
