code: BISY90009
year: 2027
learn:
  en: "How accounting and finance professionals use, manage and plan a firm's IT to make better decisions."
  zh: "会计和金融从业者如何使用、管理和规划企业的 IT，以做出更好的决策。"
  zh-TW: "會計與金融從業人員如何使用、管理與規劃企業的 IT，做出更好的決策。"
  ja: "会計・金融の専門家が企業のITを活用・管理・計画し、より良い意思決定につなげる方法。"
  ko: "회계·재무 전문가가 기업의 IT를 활용·관리·계획해 더 나은 결정을 내리는 방법."
  vi: "Cách người làm kế toán, tài chính dùng, quản lý và hoạch định IT của doanh nghiệp để ra quyết định tốt hơn."
  ms: "Cara profesional perakaunan dan kewangan menggunakan, mengurus dan merancang IT firma untuk keputusan lebih baik."
  id: "Cara profesional akuntansi dan keuangan memakai, mengelola, dan merencanakan TI perusahaan untuk keputusan lebih baik."
  hi: "लेखा और वित्त पेशेवर बेहतर फ़ैसलों के लिए कंपनी के IT का उपयोग, प्रबंधन और योजना कैसे करते हैं।"
outcomes:
  - en: "Judge business data on quality, security and privacy"
    zh: "从质量、安全和隐私角度评估业务数据"
    zh-TW: "從品質、安全與隱私角度評估業務資料"
    ja: "品質・セキュリティ・プライバシーの観点で業務データを評価する"
    ko: "품질·보안·프라이버시 관점에서 업무 데이터 평가하기"
    vi: "Đánh giá dữ liệu kinh doanh về chất lượng, bảo mật, quyền riêng tư"
    ms: "Menilai data perniagaan dari segi kualiti, keselamatan dan privasi"
    id: "Menilai data bisnis dari sisi kualitas, keamanan, dan privasi"
    hi: "गुणवत्ता, सुरक्षा और निजता के आधार पर व्यावसायिक डेटा का आकलन करना"
  - en: "Assess how new IT trends affect accounting and finance work"
    zh: "评估 IT 新趋势对会计和金融工作的影响"
    zh-TW: "評估 IT 新趨勢對會計與金融工作的影響"
    ja: "新しいIT動向が会計・金融業務に与える影響を評価する"
    ko: "새로운 IT 흐름이 회계·재무 업무에 미치는 영향 평가하기"
    vi: "Đánh giá tác động của xu hướng IT mới đến công việc kế toán, tài chính"
    ms: "Menilai kesan trend IT baharu terhadap kerja perakaunan dan kewangan"
    id: "Menilai dampak tren TI baru pada pekerjaan akuntansi dan keuangan"
    hi: "नए IT रुझानों का लेखा और वित्त के काम पर असर आँकना"
