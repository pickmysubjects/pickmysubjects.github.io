code: MCEN90047
year: 2027
learn:
  en: "How jet engines and rockets work and perform, and how aviation can become more sustainable."
  zh: "喷气发动机和火箭的原理与性能，以及航空如何更可持续。"
  zh-TW: "噴射引擎與火箭的原理與性能，以及航空如何更永續。"
  ja: "ジェットエンジンとロケットの仕組みと性能、航空の持続可能性。"
  ko: "제트엔진과 로켓의 원리·성능, 그리고 항공의 지속가능성."
  vi: "Nguyên lý, hiệu suất động cơ phản lực, tên lửa và hướng hàng không bền vững."
  ms: "Cara enjin jet dan roket berfungsi, prestasinya dan penerbangan yang lebih mampan."
  id: "Cara kerja dan kinerja mesin jet serta roket, dan penerbangan yang lebih berkelanjutan."
  hi: "जेट इंजन व रॉकेट कैसे काम करते हैं, उनका प्रदर्शन और टिकाऊ विमानन।"
outcomes:
  - en: "Evaluate jet engine performance and efficiency"
    zh: "评估喷气发动机的性能和效率"
    zh-TW: "評估噴射引擎的性能與效率"
    ja: "ジェットエンジンの性能と効率を評価する"
    ko: "제트엔진 성능과 효율 평가하기"
    vi: "Đánh giá hiệu suất động cơ phản lực"
    ms: "Menilai prestasi dan kecekapan enjin jet"
    id: "Mengevaluasi kinerja dan efisiensi mesin jet"
    hi: "जेट इंजन के प्रदर्शन व दक्षता का आकलन"
  - en: "Discuss the environmental impact of aviation"
    zh: "讨论航空对环境的影响"
    zh-TW: "討論航空對環境的影響"
    ja: "航空の環境への影響を論じる"
    ko: "항공의 환경 영향 논의하기"
    vi: "Thảo luận tác động môi trường của hàng không"
    ms: "Membincangkan kesan alam sekitar penerbangan"
    id: "Membahas dampak lingkungan penerbangan"
    hi: "विमानन के पर्यावरणीय प्रभाव पर चर्चा"
