code: FNCE90048
year: 2027
learn:
  en: "How large projects are financed: deal structures, participants, risks and returns, studied through real cases."
  zh: "大型项目如何融资：交易结构、参与方、风险与收益，结合真实案例学习。"
  zh-TW: "大型專案如何融資：交易結構、參與方、風險與報酬，搭配真實個案學習。"
  ja: "大型プロジェクトの資金調達：取引構造、関係者、リスクとリターンを実例で学ぶ。"
  ko: "대형 프로젝트 자금조달: 거래 구조, 참여자, 위험과 수익을 실제 사례로 배운다."
  vi: "Cách tài trợ dự án lớn: cấu trúc giao dịch, các bên, rủi ro và lợi nhuận qua tình huống thật."
  ms: "Cara projek besar dibiayai: struktur urus niaga, peserta, risiko dan pulangan melalui kes sebenar."
  id: "Cara proyek besar dibiayai: struktur transaksi, pihak terlibat, risiko dan imbal hasil lewat kasus nyata."
  hi: "बड़ी परियोजनाओं का वित्तपोषण: सौदा ढांचा, भागीदार, जोखिम और रिटर्न, असली केस के साथ।"
outcomes:
  - en: "Compare project financing arrangements"
    zh: "比较不同的项目融资安排"
    zh-TW: "比較不同的專案融資安排"
    ja: "プロジェクト・ファイナンスの仕組みを比較する"
    ko: "프로젝트 금융 구조 비교하기"
    vi: "So sánh các hình thức tài trợ dự án"
    ms: "Membandingkan susunan pembiayaan projek"
    id: "Membandingkan skema pembiayaan proyek"
    hi: "परियोजना वित्तपोषण व्यवस्थाओं की तुलना"
  - en: "Analyse and manage risks in project finance"
    zh: "分析并管理项目融资风险"
    zh-TW: "分析並管理專案融資風險"
    ja: "プロジェクト・ファイナンスのリスクを分析・管理する"
    ko: "프로젝트 금융의 위험 분석·관리하기"
    vi: "Phân tích và quản lý rủi ro tài trợ dự án"
    ms: "Menganalisis dan mengurus risiko pembiayaan projek"
    id: "Menganalisis dan mengelola risiko pembiayaan proyek"
    hi: "परियोजना वित्त के जोखिम आंकना और संभालना"
