code: LAWS10010
year: 2027
learn:
  en: "How the law treats animals, from pets and farm animals to wildlife, and how it is changing with science and new technology."
  zh: "法律如何对待动物：从宠物、农场动物到野生动物，以及科学和新技术带来的变化。"
  zh-TW: "法律如何對待動物：從寵物、農場動物到野生動物，以及科學和新科技帶來的變化。"
  ja: "法が動物をどう扱うか：ペットや家畜から野生動物まで、科学と新技術による変化も含めて。"
  ko: "법이 동물을 어떻게 다루는지: 반려동물·농장동물부터 야생동물까지, 과학과 신기술로 인한 변화까지."
  vi: "Pháp luật đối xử với động vật thế nào, từ thú cưng, vật nuôi đến động vật hoang dã, và thay đổi ra sao trước khoa học và công nghệ mới."
  ms: "Cara undang-undang melayan haiwan, daripada haiwan peliharaan dan ternakan hingga hidupan liar, serta perubahannya akibat sains dan teknologi baharu."
  id: "Cara hukum memperlakukan hewan, dari hewan peliharaan dan ternak hingga satwa liar, serta perubahannya karena sains dan teknologi baru."
  hi: "कानून जानवरों के साथ कैसा बर्ताव करता है: पालतू और खेती के जानवरों से वन्यजीवों तक, और विज्ञान व नई तकनीक से इसमें आ रहे बदलाव।"
outcomes:
  - en: "See how law classes animals: property, family, persons"
    zh: "了解法律如何定位动物：财产、家人或法律人格"
    zh-TW: "了解法律如何定位動物：財產、家人或法律人格"
    ja: "法が動物を財産・家族・法的人格などとどう位置づけるかを知る"
    ko: "법이 동물을 재산·가족·법인격 등으로 어떻게 분류하는지 알기"
    vi: "Hiểu luật xếp động vật là tài sản, thành viên gia đình hay pháp nhân"
    ms: "Faham cara undang-undang mengelaskan haiwan: harta, keluarga, entiti undang-undang"
    id: "Memahami cara hukum menggolongkan hewan: properti, keluarga, atau subjek hukum"
    hi: "समझना कि कानून जानवरों को संपत्ति, परिवार या कानूनी व्यक्ति कैसे मानता है"
  - en: "Apply law, science and ethics to real animal problems"
    zh: "用法律、科学和伦理分析现实中的动物问题"
    zh-TW: "用法律、科學和倫理分析現實中的動物問題"
    ja: "法・科学・倫理を実際の動物の問題に当てはめる"
    ko: "법·과학·윤리를 실제 동물 문제에 적용하기"
    vi: "Áp dụng luật, khoa học và đạo đức vào vấn đề thực tế về động vật"
    ms: "Gunakan undang-undang, sains dan etika pada isu haiwan sebenar"
    id: "Menerapkan hukum, sains, dan etika pada masalah hewan nyata"
    hi: "असल पशु-समस्याओं पर कानून, विज्ञान और नैतिकता लागू करना"
