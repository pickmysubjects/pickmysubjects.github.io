code: MUSI20179
year: 2026
learn:
  en: "Small and large ensemble rehearsals, workshops and arranging classes, ending in a group performance and a folio of arrangements."
  zh: "小型和大型乐团排练、工作坊与编曲课，最后有小组演出和编曲作品集。"
  zh-TW: "小型與大型樂團排練、工作坊與編曲課，最後有小組演出與編曲作品集。"
  ja: "小・大アンサンブルのリハーサルと編曲授業。最後にグループ演奏と編曲作品集。"
  ko: "소·대규모 앙상블 리허설과 편곡 수업, 마지막에 그룹 공연과 편곡 작품집."
  vi: "Tập dượt hòa tấu nhỏ và lớn, lớp phối khí, kết thúc bằng biểu diễn nhóm và tập phối khí."
  ms: "Latihan ensembel kecil dan besar serta kelas gubahan, diakhiri persembahan kumpulan dan folio."
  id: "Latihan ansambel kecil dan besar serta kelas aransemen, diakhiri penampilan grup dan folio."
  hi: "छोटे-बड़े एन्सेम्बल रिहर्सल और अरेंजिंग कक्षाएँ, अंत में समूह प्रदर्शन और अरेंजमेंट फोलियो।"
outcomes:
  - en: "Rehearse and perform as an ensemble"
    zh: "作为乐团排练和演出"
    zh-TW: "作為樂團排練與演出"
    ja: "アンサンブルで練習し演奏する"
    ko: "앙상블로 연습하고 공연하기"
    vi: "Tập và diễn cùng ban nhạc"
    ms: "Berlatih dan membuat persembahan berkumpulan"
    id: "Berlatih dan tampil sebagai ansambel"
    hi: "एन्सेम्बल के रूप में अभ्यास और प्रदर्शन"
  - en: "Arrange music for small groups"
    zh: "为小型乐团编曲"
    zh-TW: "為小型樂團編曲"
    ja: "小編成向けに編曲する"
    ko: "소규모 편성을 위한 편곡"
    vi: "Phối khí cho nhóm nhỏ"
    ms: "Menggubah muzik untuk kumpulan kecil"
    id: "Mengaransemen musik untuk grup kecil"
    hi: "छोटे समूहों के लिए अरेंजमेंट"
  - en: "Contribute reliably in rehearsals"
    zh: "在排练中可靠地贡献"
    zh-TW: "在排練中可靠地貢獻"
    ja: "リハーサルで確実に貢献する"
    ko: "리허설에 성실히 기여하기"
    vi: "Đóng góp đều đặn khi tập"
    ms: "Menyumbang dengan konsisten dalam latihan"
    id: "Berkontribusi andal dalam latihan"
    hi: "रिहर्सल में भरोसेमंद योगदान"
