code: JEWI20006
year: 2026
learn:
  en: "The Israeli-Palestinian conflict from its origins to peace efforts, including both national movements, memory and loss."
  zh: "以巴冲突从起源到和平努力，包括双方的民族运动、集体记忆与伤痛。"
  zh-TW: "以巴衝突從起源到和平努力，包括雙方的民族運動、集體記憶與傷痛。"
  ja: "イスラエル・パレスチナ紛争を起源から和平の試みまで、双方の民族運動、記憶、喪失を含めて学ぶ。"
  ko: "이스라엘-팔레스타인 분쟁을 기원부터 평화 노력까지, 양측의 민족운동, 기억, 상실을 포함해 배운다."
  vi: "Xung đột Israel - Palestine từ nguồn gốc đến các nỗ lực hòa bình, gồm phong trào dân tộc hai bên, ký ức và mất mát."
  ms: "Konflik Israel-Palestin dari asal usul hingga usaha damai, termasuk gerakan kebangsaan kedua-dua pihak, ingatan dan kehilangan."
  id: "Konflik Israel-Palestina dari asal-usul hingga upaya damai, termasuk gerakan nasional kedua pihak, ingatan, dan kehilangan."
  hi: "इज़राइली-फ़िलिस्तीनी संघर्ष उत्पत्ति से शांति प्रयासों तक, दोनों राष्ट्रीय आंदोलनों, स्मृति और क्षति समेत।"
outcomes:
  - en: "Outline the history of the conflict"
    zh: "概述冲突的历史"
    zh-TW: "概述衝突的歷史"
    ja: "紛争の歴史をまとめる"
    ko: "분쟁의 역사 정리하기"
    vi: "Tóm tắt lịch sử cuộc xung đột"
    ms: "Ringkaskan sejarah konflik"
    id: "Merangkum sejarah konflik"
    hi: "संघर्ष के इतिहास की रूपरेखा देना"
  - en: "Compare Israeli and Palestinian nationalism"
    zh: "比较以色列与巴勒斯坦的民族主义"
    zh-TW: "比較以色列與巴勒斯坦的民族主義"
    ja: "イスラエルとパレスチナのナショナリズムを比べる"
    ko: "이스라엘과 팔레스타인 민족주의 비교하기"
    vi: "So sánh chủ nghĩa dân tộc Israel và Palestine"
    ms: "Bandingkan nasionalisme Israel dan Palestin"
    id: "Membandingkan nasionalisme Israel dan Palestina"
    hi: "इज़राइली और फ़िलिस्तीनी राष्ट्रवाद की तुलना करना"
  - en: "Assess past attempts at peace"
    zh: "评估以往的和平尝试"
    zh-TW: "評估以往的和平嘗試"
    ja: "過去の和平の試みを評価する"
    ko: "과거의 평화 시도 평가하기"
    vi: "Đánh giá các nỗ lực hòa bình trước đây"
    ms: "Nilai usaha damai yang lalu"
    id: "Menilai upaya damai sebelumnya"
    hi: "शांति के पिछले प्रयासों का आकलन करना"
