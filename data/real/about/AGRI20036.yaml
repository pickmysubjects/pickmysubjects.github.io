code: AGRI20036
year: 2026
learn:
  en: "How Australian pastures grow, feed livestock and can be managed through grazing."
  zh: "澳大利亚牧场如何生长、喂养牲畜，以及放牧管理。"
  zh-TW: "澳洲牧場如何生長、餵養牲畜，以及放牧管理。"
  ja: "オーストラリアの牧草の育ち方、家畜の飼料価値、放牧管理。"
  ko: "호주 목초지의 생장, 가축 사료 가치, 방목 관리."
  vi: "Đồng cỏ Úc phát triển ra sao, nuôi gia súc thế nào và quản lý chăn thả."
  ms: "Cara padang ragut Australia tumbuh, memberi makan ternakan dan diurus melalui ragutan."
  id: "Cara padang rumput Australia tumbuh, memberi pakan ternak, dan dikelola lewat penggembalaan."
  hi: "ऑस्ट्रेलियाई चरागाह कैसे बढ़ते हैं, पशुओं को चारा देते हैं और चराई से कैसे संभाले जाते हैं।"
outcomes:
  - en: "Identify major pasture species and their needs"
    zh: "识别主要牧草种类及其需求"
    zh-TW: "辨識主要牧草種類及其需求"
    ja: "主な牧草種と管理要件を見分ける"
    ko: "주요 목초 종과 관리 요건 파악하기"
    vi: "Nhận biết các loài cỏ chính và nhu cầu"
    ms: "Kenal pasti spesies rumput utama dan keperluannya"
    id: "Mengenali spesies rumput utama dan kebutuhannya"
    hi: "मुख्य चारा प्रजातियाँ और उनकी ज़रूरतें पहचानें"
  - en: "Assess pasture feed value for livestock"
    zh: "评估牧草对牲畜的营养价值"
    zh-TW: "評估牧草對牲畜的營養價值"
    ja: "牧草の飼料価値を評価する"
    ko: "목초의 사료 가치 평가하기"
    vi: "Đánh giá giá trị dinh dưỡng của cỏ"
    ms: "Nilai nilai pemakanan rumput untuk ternakan"
    id: "Menilai nilai pakan rumput untuk ternak"
    hi: "पशुओं के लिए चारे का पोषण मूल्य आँकें"
  - en: "Plan grazing to keep pastures productive"
    zh: "规划放牧以保持牧场产量"
    zh-TW: "規劃放牧以維持牧場產量"
    ja: "生産性を保つ放牧を計画する"
    ko: "생산성을 유지하는 방목 계획하기"
    vi: "Lập kế hoạch chăn thả giữ năng suất đồng cỏ"
    ms: "Rancang ragutan untuk kekalkan hasil padang"
    id: "Merencanakan penggembalaan agar padang tetap produktif"
    hi: "चरागाह उत्पादक रखने हेतु चराई की योजना बनाएँ"
