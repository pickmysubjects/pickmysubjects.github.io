code: EURO20003
year: 2026
learn:
  en: "How memoirs and eyewitness accounts show the human side of Europe's 20th-century wars and upheavals."
  zh: "回忆录和亲历者记述如何呈现20世纪欧洲战争与动荡中的个人经历。"
  zh-TW: "回憶錄和親歷者記述如何呈現20世紀歐洲戰爭與動盪中的個人經歷。"
  ja: "回想録や目撃証言から、20世紀ヨーロッパの戦争と激動を生きた人々を見る。"
  ko: "회고록과 목격담으로 20세기 유럽의 전쟁과 격변 속 개인의 경험을 본다."
  vi: "Hồi ký và lời kể nhân chứng cho thấy mặt con người của chiến tranh, biến động châu Âu thế kỷ 20."
  ms: "Cara memoir dan kisah saksi menunjukkan sisi manusia perang dan pergolakan Eropah abad ke-20."
  id: "Cara memoar dan kesaksian menunjukkan sisi manusiawi perang dan gejolak Eropa abad ke-20."
  hi: "संस्मरण और प्रत्यक्षदर्शी विवरण 20वीं सदी के यूरोप के युद्धों और उथल-पुथल का मानवीय पक्ष कैसे दिखाते हैं।"
outcomes:
  - en: "Read memoirs as historical sources"
    zh: "把回忆录当作史料来阅读"
    zh-TW: "把回憶錄當作史料來閱讀"
    ja: "回想録を歴史資料として読む"
    ko: "회고록을 역사 자료로 읽기"
    vi: "Đọc hồi ký như nguồn sử liệu"
    ms: "Baca memoir sebagai sumber sejarah"
    id: "Membaca memoar sebagai sumber sejarah"
    hi: "संस्मरणों को ऐतिहासिक स्रोत की तरह पढ़ना"
  - en: "Compare how events are remembered"
    zh: "比较人们如何记忆历史事件"
    zh-TW: "比較人們如何記憶歷史事件"
    ja: "出来事がどう記憶されるかを比べる"
    ko: "사건이 어떻게 기억되는지 비교하기"
    vi: "So sánh cách các sự kiện được ghi nhớ"
    ms: "Bandingkan cara peristiwa diingati"
    id: "Membandingkan cara peristiwa dikenang"
    hi: "घटनाओं को कैसे याद किया जाता है, तुलना करना"
  - en: "Write essays on memory and history"
    zh: "撰写关于记忆与历史的论文"
    zh-TW: "撰寫關於記憶與歷史的論文"
    ja: "記憶と歴史についてレポートを書く"
    ko: "기억과 역사에 관한 글 쓰기"
    vi: "Viết tiểu luận về ký ức và lịch sử"
    ms: "Tulis esei tentang ingatan dan sejarah"
    id: "Menulis esai tentang ingatan dan sejarah"
    hi: "स्मृति और इतिहास पर निबंध लिखना"
