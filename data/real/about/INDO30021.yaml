code: INDO30021
year: 2026
learn:
  en: "Indonesian major capstone in English: linking Indonesia to global issues like inequality, digital tech and climate, via team projects."
  zh: "印尼研究专业毕业课（英语授课）：以团队项目把印尼与不平等、数字科技、气候等全球议题相连。"
  zh-TW: "印尼研究主修畢業課（英語授課）：以團隊專題把印尼與不平等、數位科技、氣候等全球議題相連。"
  ja: "インドネシア専攻の総まとめ科目（英語）。格差、デジタル技術、気候などの世界的課題とインドネシアをチームで結びつける。"
  ko: "인도네시아 전공 캡스톤(영어 수업). 불평등, 디지털 기술, 기후 등 세계 문제와 인도네시아를 팀 프로젝트로 연결한다."
  vi: "Môn tổng kết chuyên ngành Indonesia (dạy bằng tiếng Anh): nối Indonesia với vấn đề toàn cầu như bất bình đẳng, công nghệ số, khí hậu."
  ms: "Subjek puncak major Indonesia dalam bahasa Inggeris: mengaitkan Indonesia dengan isu global seperti ketaksamaan, teknologi digital dan iklim."
  id: "Mata kuliah puncak jurusan Indonesia dalam bahasa Inggris: mengaitkan Indonesia dengan isu global seperti ketimpangan, teknologi digital dan iklim."
  hi: "इंडोनेशियाई मेजर का कैपस्टोन (अंग्रेज़ी में): असमानता, डिजिटल तकनीक और जलवायु जैसे वैश्विक मुद्दों से इंडोनेशिया को जोड़ना।"
outcomes:
  - en: "Link local Indonesian issues to global ones"
    zh: "把印尼本地议题与全球议题联系起来"
    zh-TW: "把印尼在地議題與全球議題聯繫起來"
    ja: "インドネシアの地域課題を世界の課題と結びつける"
    ko: "인도네시아 지역 문제를 세계 문제와 연결하기"
    vi: "Gắn vấn đề địa phương Indonesia với vấn đề toàn cầu"
    ms: "Kaitkan isu tempatan Indonesia dengan isu global"
    id: "Mengaitkan isu lokal Indonesia dengan isu global"
    hi: "इंडोनेशिया के स्थानीय मुद्दों को वैश्विक मुद्दों से जोड़ना"
  - en: "Work across cultures in a project team"
    zh: "在项目团队中进行跨文化合作"
    zh-TW: "在專題團隊中進行跨文化合作"
    ja: "プロジェクトチームで異文化協働をする"
    ko: "프로젝트 팀에서 문화 간 협업하기"
    vi: "Hợp tác liên văn hóa trong nhóm dự án"
    ms: "Bekerja merentas budaya dalam pasukan projek"
    id: "Bekerja lintas budaya dalam tim proyek"
    hi: "प्रोजेक्ट टीम में अलग-अलग संस्कृतियों के साथ काम करना"
  - en: "Present research and propose real actions"
    zh: "展示研究并提出可行的行动建议"
    zh-TW: "展示研究並提出可行的行動建議"
    ja: "研究を発表し、実際の行動を提案する"
    ko: "연구를 발표하고 실제 행동 제안하기"
    vi: "Trình bày nghiên cứu và đề xuất hành động thực tế"
    ms: "Bentangkan kajian dan cadangkan tindakan sebenar"
    id: "Mempresentasikan riset dan mengusulkan tindakan nyata"
    hi: "शोध प्रस्तुत करना और असली कदम सुझाना"
