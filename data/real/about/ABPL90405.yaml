code: ABPL90405
year: 2027
learn:
  en: "Measuring and reducing operational and embodied energy and carbon in buildings and cities with digital tools."
  zh: "用数字工具衡量并降低建筑和城市的运行能耗、隐含能耗与碳排放。"
  zh-TW: "用數位工具衡量並降低建築與城市的運行能耗、隱含能耗與碳排放。"
  ja: "デジタルツールで建物・都市の運用時と内包エネルギー・炭素を測り減らす。"
  ko: "디지털 도구로 건물과 도시의 운영·내재 에너지와 탄소를 측정하고 줄입니다."
  vi: "Đo và giảm năng lượng, carbon vận hành và hàm chứa của công trình bằng công cụ số."
  ms: "Mengukur dan mengurangkan tenaga serta karbon operasi dan terkandung bangunan dengan alat digital."
  id: "Mengukur dan mengurangi energi serta karbon operasional dan terkandung bangunan dengan alat digital."
  hi: "डिजिटल टूल से इमारतों-शहरों की परिचालन व अंतर्निहित ऊर्जा और कार्बन मापना व घटाना।"
outcomes:
  - en: "Quantify energy and carbon impacts of buildings"
    zh: "量化建筑的能耗与碳影响"
    zh-TW: "量化建築的能耗與碳影響"
    ja: "建物のエネルギー・炭素影響を定量化する"
    ko: "건물의 에너지·탄소 영향 정량화하기"
    vi: "Định lượng tác động năng lượng và carbon"
    ms: "Mengukur kesan tenaga dan karbon bangunan"
    id: "Mengukur dampak energi dan karbon bangunan"
    hi: "इमारतों के ऊर्जा व कार्बन प्रभाव मापना"
  - en: "Propose feasible mitigation strategies"
    zh: "提出可行的减排策略"
    zh-TW: "提出可行的減排策略"
    ja: "実現可能な削減策を提案する"
    ko: "실현 가능한 감축 전략 제안하기"
    vi: "Đề xuất chiến lược giảm thiểu khả thi"
    ms: "Mencadangkan strategi mitigasi yang praktikal"
    id: "Mengusulkan strategi mitigasi yang layak"
    hi: "व्यावहारिक शमन रणनीतियां सुझाना"
