code: PERF30001
year: 2026
learn:
  en: "Design for parades, ceremonies, festivals and pop-up venues, turning familiar city spaces into a stage."
  zh: "为游行、典礼、节庆和临时场馆做设计，把熟悉的城市空间变成舞台。"
  zh-TW: "為遊行、典禮、節慶和臨時場館做設計，把熟悉的城市空間變成舞台。"
  ja: "パレード、式典、祭り、仮設会場をデザインし、見慣れた街を舞台に変える。"
  ko: "퍼레이드·의식·축제·임시 공연장을 디자인해 익숙한 도시 공간을 무대로 바꾼다."
  vi: "Thiết kế diễu hành, lễ hội, địa điểm tạm, biến không gian đô thị quen thuộc thành sân khấu."
  ms: "Reka bentuk perarakan, upacara, festival dan venue pop-up, jadikan ruang bandar sebagai pentas."
  id: "Mendesain parade, upacara, festival dan venue pop-up, mengubah ruang kota jadi panggung."
  hi: "परेड, समारोह, उत्सव और पॉप-अप वेन्यू का डिज़ाइन, जाने-पहचाने शहर को मंच बनाना।"
outcomes:
  - en: "Analyse how events reshape public space"
    zh: "分析活动如何重塑公共空间"
    zh-TW: "分析活動如何重塑公共空間"
    ja: "イベントが公共空間をどう変えるか分析する"
    ko: "이벤트가 공공 공간을 바꾸는 방식 분석하기"
    vi: "Phân tích sự kiện thay đổi không gian công cộng"
    ms: "Analisis cara acara mengubah ruang awam"
    id: "Menganalisis acara yang mengubah ruang publik"
    hi: "इवेंट सार्वजनिक जगह को कैसे बदलते हैं, विश्लेषण"
  - en: "Develop a temporary event design in studios"
    zh: "在工作室中发展临时活动设计"
    zh-TW: "在工作室中發展臨時活動設計"
    ja: "スタジオで仮設イベントの設計を練る"
    ko: "스튜디오에서 임시 이벤트 디자인 발전시키기"
    vi: "Phát triển thiết kế sự kiện tạm qua các studio"
    ms: "Bangunkan reka bentuk acara sementara di studio"
    id: "Mengembangkan desain acara sementara"
    hi: "स्टूडियो में अस्थायी इवेंट डिज़ाइन विकसित करना"
  - en: "Present a clear design proposal"
    zh: "清晰地展示设计方案"
    zh-TW: "清楚地展示設計方案"
    ja: "設計提案をわかりやすく発表する"
    ko: "설계안을 명확하게 발표하기"
    vi: "Trình bày đề xuất thiết kế rõ ràng"
    ms: "Bentang cadangan reka bentuk dengan jelas"
    id: "Mempresentasikan usulan desain dengan jelas"
    hi: "डिज़ाइन प्रस्ताव साफ़ तरीक़े से पेश करना"
