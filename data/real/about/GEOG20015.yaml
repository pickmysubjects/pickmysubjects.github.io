code: GEOG20015
year: 2026
learn:
  en: "How climate and environment shaped human evolution over 6 million years, and how humans changed them back."
  zh: "600万年来气候环境如何塑造人类演化，人类又如何改变环境。"
  zh-TW: "600萬年來氣候環境如何塑造人類演化，人類又如何改變環境。"
  ja: "600万年の気候と環境が人類の進化をどう形作り、人が環境をどう変えたか。"
  ko: "600만 년간 기후·환경이 인류 진화를 어떻게 만들고 인간이 환경을 어떻게 바꿨는지."
  vi: "Khí hậu và môi trường định hình tiến hóa loài người suốt 6 triệu năm ra sao, và con người thay đổi lại thế nào."
  ms: "Cara iklim dan alam membentuk evolusi manusia selama 6 juta tahun, dan cara manusia mengubahnya."
  id: "Cara iklim dan lingkungan membentuk evolusi manusia selama 6 juta tahun, dan cara manusia mengubahnya."
  hi: "60 लाख वर्षों में जलवायु और पर्यावरण ने मानव विकास को कैसे गढ़ा, और इंसानों ने उन्हें कैसे बदला।"
outcomes:
  - en: "Explain climate change over long and short timescales"
    zh: "解释长短时间尺度的气候变化"
    zh-TW: "解釋長短時間尺度的氣候變化"
    ja: "長短の時間スケールの気候変化を説明する"
    ko: "장단기 기후 변화 설명하기"
    vi: "Giải thích biến đổi khí hậu ở các thang thời gian"
    ms: "Terangkan perubahan iklim jangka panjang dan pendek"
    id: "Menjelaskan perubahan iklim jangka panjang dan pendek"
    hi: "लंबे और छोटे समय की जलवायु बदलाव समझाना"
  - en: "Use methods to reconstruct past environments"
    zh: "运用方法重建过去的环境"
    zh-TW: "運用方法重建過去的環境"
    ja: "過去の環境を復元する手法を使う"
    ko: "과거 환경 복원 기법 활용하기"
    vi: "Dùng phương pháp tái dựng môi trường quá khứ"
    ms: "Guna kaedah membina semula alam masa lalu"
    id: "Memakai metode merekonstruksi lingkungan masa lalu"
    hi: "पुराने पर्यावरण के पुनर्निर्माण की विधियाँ लगाना"
