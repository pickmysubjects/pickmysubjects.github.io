code: PHYC30024
year: 2026
learn:
  en: "The physics of solids: crystals, electron bands, conductors, semiconductors and superconductors."
  zh: "固体物理：晶体、能带、导体、半导体和超导体。"
  zh-TW: "固體物理：晶體、能帶、導體、半導體和超導體。"
  ja: "固体物理：結晶、バンド、導体、半導体、超伝導体。"
  ko: "고체 물리: 결정, 에너지 띠, 도체, 반도체, 초전도체."
  vi: "Vật lý chất rắn: tinh thể, vùng năng lượng, dẫn điện, bán dẫn và siêu dẫn."
  ms: "Fizik pepejal: kristal, jalur elektron, konduktor, semikonduktor dan superkonduktor."
  id: "Fisika zat padat: kristal, pita elektron, konduktor, semikonduktor, dan superkonduktor."
  hi: "सॉलिड की फ़िज़िक्स: क्रिस्टल, इलेक्ट्रॉन बैंड, कंडक्टर, सेमीकंडक्टर और सुपरकंडक्टर।"
outcomes:
  - en: "Classify crystals and their symmetries"
    zh: "对晶体及其对称性分类"
    zh-TW: "對晶體及其對稱性分類"
    ja: "結晶とその対称性を分類する"
    ko: "결정과 대칭성 분류하기"
    vi: "Phân loại tinh thể và đối xứng"
    ms: "Mengelaskan kristal dan simetrinya"
    id: "Mengklasifikasi kristal dan simetrinya"
    hi: "क्रिस्टल और उनकी सिमेट्री वर्गीकृत करना"
  - en: "Use Bloch's theorem to explain band structure"
    zh: "用布洛赫定理解释能带"
    zh-TW: "用布洛赫定理解釋能帶"
    ja: "ブロッホの定理でバンド構造を説明する"
    ko: "블로흐 정리로 띠 구조 설명하기"
    vi: "Dùng định lý Bloch giải thích cấu trúc vùng"
    ms: "Guna teorem Bloch untuk struktur jalur"
    id: "Memakai teorema Bloch untuk struktur pita"
    hi: "Bloch प्रमेय से बैंड स्ट्रक्चर समझाना"
