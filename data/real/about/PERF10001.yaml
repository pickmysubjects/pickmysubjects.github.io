code: PERF10001
year: 2027
learn:
  en: "A hands-on subject using play and clowning to build confidence, creativity and communication with others."
  zh: "动手实践的课程，借助游戏和小丑表演提升自信、创造力和与人沟通的能力。"
  zh-TW: "動手實作的課程，藉助遊戲和小丑表演提升自信、創造力和與人溝通的能力。"
  ja: "遊びとクラウンの手法で、自信・創造性・人とのコミュニケーションを育てる実践科目。"
  ko: "놀이와 광대 기법으로 자신감, 창의성, 소통 능력을 키우는 실습 과목."
  vi: "Môn học thực hành dùng trò chơi và nghệ thuật hề để tăng tự tin, sáng tạo và giao tiếp."
  ms: "Subjek amali yang guna permainan dan seni badut untuk bina keyakinan, kreativiti dan komunikasi."
  id: "Mata kuliah praktik yang memakai permainan dan teknik badut untuk membangun percaya diri, kreativitas, dan komunikasi."
  hi: "खेल और क्लाउनिंग से आत्मविश्वास, रचनात्मकता और दूसरों से संवाद बढ़ाने वाला व्यावहारिक विषय।"
outcomes:
  - en: "Explain how culture, norms and power shape play"
    zh: "解释文化、社会规范和权力如何影响玩乐"
    zh-TW: "解釋文化、社會規範和權力如何影響玩樂"
    ja: "文化・規範・権力が遊びをどう形づくるか説明する"
    ko: "문화, 규범, 권력이 놀이에 미치는 영향 설명하기"
    vi: "Giải thích văn hóa, chuẩn mực và quyền lực định hình sự vui chơi"
    ms: "Terangkan cara budaya, norma dan kuasa membentuk permainan"
    id: "Menjelaskan bagaimana budaya, norma, dan kuasa membentuk permainan"
    hi: "संस्कृति, मानदंड और सत्ता खेल को कैसे आकार देते हैं, समझाना"
  - en: "Use play and humour to connect with people"
    zh: "用玩乐和幽默与人建立联系"
    zh-TW: "用玩樂和幽默與人建立連結"
    ja: "遊びとユーモアで人とつながる"
    ko: "놀이와 유머로 사람들과 연결되기"
    vi: "Dùng trò chơi và sự hài hước để kết nối với người khác"
    ms: "Guna permainan dan humor untuk berhubung dengan orang"
    id: "Memakai permainan dan humor untuk terhubung dengan orang"
    hi: "खेल और हास्य से लोगों से जुड़ना"
  - en: "Judge when playfulness helps and when it doesn't"
    zh: "判断玩乐在何时有帮助、何时有局限"
    zh-TW: "判斷玩樂在何時有幫助、何時有局限"
    ja: "遊び心が役立つ場面と限界を見極める"
    ko: "장난스러움이 언제 도움이 되고 언제 한계가 있는지 판단하기"
    vi: "Đánh giá khi nào sự vui đùa có ích và khi nào không"
    ms: "Nilai bila sifat suka bermain membantu dan bila tidak"
    id: "Menilai kapan sikap bermain membantu dan kapan tidak"
    hi: "कब खिलंदड़ापन मदद करता है और कब नहीं, आंकना"
