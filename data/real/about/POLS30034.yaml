code: POLS30034
year: 2026
learn:
  en: "Why voters and leaders think and act as they do, through personality, emotion and motivation, and how this is used in practice."
  zh: "选民和领导人为什么会那样思考和行动，从性格、情绪和动机来看，以及这些研究在现实中如何被运用。"
  zh-TW: "選民和領導人為什麼會那樣思考和行動，從性格、情緒和動機來看，以及這些研究在現實中如何被運用。"
  ja: "有権者や指導者がなぜそう考え行動するのかを、性格、感情、動機から考え、その知見が実際にどう使われているかも学ぶ。"
  ko: "유권자와 지도자가 왜 그렇게 생각하고 행동하는지 성격, 감정, 동기로 살펴보고, 그 연구가 실제로 어떻게 쓰이는지 배운다."
  vi: "Vì sao cử tri và lãnh đạo nghĩ và hành động như vậy, qua tính cách, cảm xúc, động cơ, và cách các phát hiện này được dùng trong thực tế."
  ms: "Kenapa pengundi dan pemimpin berfikir dan bertindak begitu, melalui personaliti, emosi dan motivasi, serta cara dapatan ini digunakan secara praktikal."
  id: "Kenapa pemilih dan pemimpin berpikir dan bertindak seperti itu, dilihat dari kepribadian, emosi, dan motivasi, serta cara temuan ini dipakai dalam praktik."
  hi: "मतदाता और नेता जैसा सोचते और करते हैं वैसा क्यों, व्यक्तित्व, भावनाओं और प्रेरणा के ज़रिए, और ये नतीजे असल में कैसे इस्तेमाल होते हैं।"
outcomes:
  - en: "Explain the psychology behind political behaviour"
    zh: "解释政治行为背后的心理"
    zh-TW: "解釋政治行為背後的心理"
    ja: "政治行動の背後にある心理を説明する"
    ko: "정치 행동 뒤의 심리 설명하기"
    vi: "Giải thích tâm lý đằng sau hành vi chính trị"
    ms: "Terangkan psikologi di sebalik tingkah laku politik"
    id: "Menjelaskan psikologi di balik perilaku politik"
    hi: "राजनीतिक व्यवहार के पीछे का मनोविज्ञान समझाना"
  - en: "Analyse how leaders decide in a crisis"
    zh: "分析领导人在危机中如何决策"
    zh-TW: "分析領導人在危機中如何決策"
    ja: "危機の中で指導者がどう決断するか分析する"
    ko: "위기 속 지도자의 결정 방식 분석하기"
    vi: "Phân tích lãnh đạo ra quyết định thế nào khi khủng hoảng"
    ms: "Analisis cara pemimpin membuat keputusan ketika krisis"
    id: "Menganalisis cara pemimpin memutuskan saat krisis"
    hi: "संकट में नेता फ़ैसले कैसे लेते हैं, इसका विश्लेषण करना"
  - en: "Discuss real uses of political psychology"
    zh: "讨论政治心理学在现实中的应用"
    zh-TW: "討論政治心理學在現實中的應用"
    ja: "政治心理学の実際の使われ方を論じる"
    ko: "정치심리학의 실제 활용 논의하기"
    vi: "Thảo luận các ứng dụng thực tế của tâm lý học chính trị"
    ms: "Bincangkan penggunaan sebenar psikologi politik"
    id: "Membahas penerapan nyata psikologi politik"
    hi: "राजनीतिक मनोविज्ञान के असली इस्तेमाल पर चर्चा करना"
