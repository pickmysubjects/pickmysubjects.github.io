code: HLTH90021
year: 2027
learn:
  en: "Turning a biomedical research discovery into a new therapy, from drug development to commercial and legal issues."
  zh: "把生物医学研究发现转化为新疗法，涵盖药物开发及商业和法律问题。"
  zh-TW: "把生物醫學研究發現轉化為新療法，涵蓋藥物開發及商業與法律問題。"
  ja: "生物医学の発見を新しい治療法にする流れ。医薬品開発から商業・法的課題まで。"
  ko: "생명의학 연구 성과를 새 치료법으로 바꾸는 과정, 약물 개발부터 상업·법적 문제까지."
  vi: "Biến phát hiện y sinh thành liệu pháp mới, từ phát triển thuốc đến vấn đề thương mại và pháp lý."
  ms: "Menukar penemuan penyelidikan bioperubatan kepada terapi baharu, dari pembangunan ubat hingga isu komersial dan undang-undang."
  id: "Mengubah temuan riset biomedis menjadi terapi baru, dari pengembangan obat hingga isu komersial dan hukum."
  hi: "जैव-चिकित्सा शोध खोज को नई चिकित्सा में बदलना, दवा विकास से व्यावसायिक और कानूनी मुद्दों तक।"
outcomes:
  - en: "Spot possible products from your research"
    zh: "从自己的研究中发现潜在产品"
    zh-TW: "從自己的研究中發現潛在產品"
    ja: "自分の研究から製品の種を見つける"
    ko: "자신의 연구에서 제품 가능성 찾기"
    vi: "Tìm sản phẩm tiềm năng từ nghiên cứu của mình"
    ms: "Mengenal pasti produk berpotensi daripada penyelidikan anda"
    id: "Menemukan calon produk dari riset sendiri"
    hi: "अपने शोध से संभावित उत्पाद पहचानना"
  - en: "Explain how drugs and diagnostics are developed"
    zh: "解释药物和诊断产品的开发过程"
    zh-TW: "解釋藥物與診斷產品的開發過程"
    ja: "医薬品と診断法の開発過程を説明する"
    ko: "약물과 진단법 개발 과정 설명하기"
    vi: "Giải thích quá trình phát triển thuốc và chẩn đoán"
    ms: "Menerangkan cara ubat dan diagnostik dibangunkan"
    id: "Menjelaskan proses pengembangan obat dan diagnostik"
    hi: "दवाएँ और निदान कैसे विकसित होते हैं, समझाना"
  - en: "Weigh commercial and legal challenges"
    zh: "评估商业和法律方面的挑战"
    zh-TW: "評估商業與法律方面的挑戰"
    ja: "商業面・法律面の課題を評価する"
    ko: "상업적·법적 과제 평가하기"
    vi: "Đánh giá thách thức thương mại và pháp lý"
    ms: "Menilai cabaran komersial dan undang-undang"
    id: "Menilai tantangan komersial dan hukum"
    hi: "व्यावसायिक और कानूनी चुनौतियाँ आँकना"
