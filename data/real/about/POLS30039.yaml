code: POLS30039
year: 2026
learn:
  en: "How government policy has shaped the lives of Aboriginal and Torres Strait Islander peoples, from assimilation to self-rule."
  zh: "政府政策如何影响原住民和托雷斯海峡岛民的生活，从同化政策到自决，再到之后的变化。"
  zh-TW: "政府政策如何影響原住民和托雷斯海峽島民的生活，從同化政策到自決，再到之後的變化。"
  ja: "政府の政策がアボリジナルとトレス海峡諸島民の暮らしをどう形づくってきたかを、同化政策から自己決定、その後まで学ぶ。"
  ko: "정부 정책이 애버리지니와 토러스 해협 섬 주민의 삶을 어떻게 만들어 왔는지 동화 정책부터 자결권, 그 이후까지 배운다."
  vi: "Chính sách nhà nước đã định hình đời sống người Thổ dân và người dân đảo Torres Strait ra sao, từ đồng hóa đến tự quyết và về sau."
  ms: "Bagaimana dasar kerajaan membentuk kehidupan Orang Asli dan penduduk Selat Torres, dari asimilasi hingga penentuan nasib sendiri dan seterusnya."
  id: "Bagaimana kebijakan pemerintah membentuk kehidupan masyarakat Aborigin dan Kepulauan Selat Torres, dari asimilasi hingga penentuan nasib sendiri dan sesudahnya."
  hi: "सरकारी नीतियों ने एबोरिजिनल और टोरेस स्ट्रेट आइलैंडर लोगों की ज़िंदगी को कैसे आकार दिया, आत्मसात करने से आत्मनिर्णय और आगे तक।"
outcomes:
  - en: "Explain the main eras of Indigenous policy"
    zh: "说明原住民政策的几个主要阶段"
    zh-TW: "說明原住民政策的幾個主要階段"
    ja: "先住民政策の主な時代を説明する"
    ko: "원주민 정책의 주요 시기 설명하기"
    vi: "Giải thích các thời kỳ chính của chính sách về người bản địa"
    ms: "Terangkan era utama dasar Orang Asli"
    id: "Menjelaskan era utama kebijakan Pribumi"
    hi: "आदिवासी नीति के मुख्य दौर समझाना"
  - en: "Assess policies on land, health, education and justice"
    zh: "评估土地、健康、教育和司法方面的政策"
    zh-TW: "評估土地、健康、教育和司法方面的政策"
    ja: "土地、健康、教育、司法の政策を評価する"
    ko: "토지, 건강, 교육, 사법 정책 평가하기"
    vi: "Đánh giá chính sách về đất đai, y tế, giáo dục và tư pháp"
    ms: "Nilai dasar tanah, kesihatan, pendidikan dan keadilan"
    id: "Menilai kebijakan tanah, kesehatan, pendidikan, dan peradilan"
    hi: "ज़मीन, स्वास्थ्य, शिक्षा और न्याय की नीतियों का आकलन करना"
  - en: "Use basic ideas of public policy making"
    zh: "运用公共政策制定的基本概念"
    zh-TW: "運用公共政策制定的基本概念"
    ja: "公共政策づくりの基本的な考え方を使う"
    ko: "공공 정책 결정의 기본 개념 활용하기"
    vi: "Dùng các khái niệm cơ bản về hoạch định chính sách công"
    ms: "Guna idea asas penggubalan dasar awam"
    id: "Memakai konsep dasar pembuatan kebijakan publik"
    hi: "सार्वजनिक नीति बनाने के बुनियादी विचार इस्तेमाल करना"
