code: MUSI30246
year: 2026
learn:
  en: "Noise as music from the Futurists and Cage to today, and make your own short sound art piece."
  zh: "从未来主义、凯奇到当代的噪音音乐，并创作短篇声音艺术。"
  zh-TW: "從未來主義、凱吉到當代的噪音音樂，並創作短篇聲音藝術。"
  ja: "未来派やケージから現代までのノイズ音楽を学び、短いサウンドアートを作る。"
  ko: "미래파·케이지부터 현대까지의 소음 음악, 직접 짧은 사운드 아트 제작."
  vi: "Tiếng ồn như âm nhạc từ Futurism, Cage đến nay, và tự làm tác phẩm âm thanh."
  ms: "Bunyi bising sebagai muzik dari Futuris dan Cage hingga kini, dan cipta karya bunyi."
  id: "Bising sebagai musik dari Futuris dan Cage hingga kini, lalu buat karya seni bunyi."
  hi: "फ़्यूचरिस्ट और केज से आज तक शोर-संगीत, और अपनी छोटी साउंड आर्ट रचना।"
outcomes:
  - en: "Explain the history of noise as music"
    zh: "讲述噪音音乐的历史"
    zh-TW: "講述噪音音樂的歷史"
    ja: "ノイズ音楽の歴史を説明する"
    ko: "소음 음악의 역사 설명하기"
    vi: "Giải thích lịch sử nhạc tiếng ồn"
    ms: "Terangkan sejarah bising sebagai muzik"
    id: "Menjelaskan sejarah bising sebagai musik"
    hi: "शोर-संगीत का इतिहास समझाना"
  - en: "Record a short sound art work"
    zh: "录制一部短篇声音艺术作品"
    zh-TW: "錄製一部短篇聲音藝術作品"
    ja: "短いサウンドアート作品を録音する"
    ko: "짧은 사운드 아트 작품 녹음하기"
    vi: "Thu âm một tác phẩm âm thanh ngắn"
    ms: "Rakam karya seni bunyi pendek"
    id: "Merekam karya seni bunyi singkat"
    hi: "छोटी साउंड आर्ट रचना रिकॉर्ड करना"
  - en: "Write about the context of your own work"
    zh: "撰文阐述自己作品的背景"
    zh-TW: "撰文闡述自己作品的背景"
    ja: "自作の背景を文章で説明する"
    ko: "자기 작품의 맥락을 글로 쓰기"
    vi: "Viết về bối cảnh tác phẩm của mình"
    ms: "Tulis tentang konteks karya sendiri"
    id: "Menulis konteks karya sendiri"
    hi: "अपनी रचना के संदर्भ पर लिखना"
