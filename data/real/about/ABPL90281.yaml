code: ABPL90281
year: 2027
learn:
  en: "How housing is provided in Australia: markets, developers, banks, government, planning, and policy for low-income housing."
  zh: "澳大利亚的住房供给：市场、开发商、银行、政府、规划，以及低收入住房政策。"
  zh-TW: "澳洲的住宅供給：市場、開發商、銀行、政府、規劃，以及低收入住宅政策。"
  ja: "豪州の住宅供給：市場、開発業者、銀行、政府、計画、低所得者向け住宅政策。"
  ko: "호주 주택 공급: 시장, 개발사, 은행, 정부, 계획, 저소득층 주택 정책."
  vi: "Cung ứng nhà ở tại Úc: thị trường, chủ đầu tư, ngân hàng, chính phủ, quy hoạch, nhà ở thu nhập thấp."
  ms: "Penyediaan perumahan di Australia: pasaran, pemaju, bank, kerajaan dan dasar perumahan berpendapatan rendah."
  id: "Penyediaan perumahan di Australia: pasar, pengembang, bank, pemerintah dan kebijakan rumah murah."
  hi: "ऑस्ट्रेलिया में आवास: बाज़ार, डेवलपर, बैंक, सरकार, नियोजन और निम्न-आय आवास नीति।"
outcomes:
  - en: "Explain how the housing system works in Australia"
    zh: "解释澳大利亚住房体系如何运作"
    zh-TW: "解釋澳洲住宅體系如何運作"
    ja: "豪州の住宅システムを説明する"
    ko: "호주 주택 체계 설명하기"
    vi: "Giải thích hệ thống nhà ở tại Úc"
    ms: "Menerangkan sistem perumahan Australia"
    id: "Menjelaskan sistem perumahan Australia"
    hi: "ऑस्ट्रेलिया की आवास व्यवस्था समझाना"
  - en: "Analyse a housing policy or development case"
    zh: "分析一项住房政策或开发案例"
    zh-TW: "分析一項住宅政策或開發個案"
    ja: "住宅政策や開発事例を分析する"
    ko: "주택 정책이나 개발 사례 분석하기"
    vi: "Phân tích chính sách hoặc dự án nhà ở"
    ms: "Menganalisis dasar atau kes pembangunan perumahan"
    id: "Menganalisis kebijakan atau kasus perumahan"
    hi: "आवास नीति या विकास मामले का विश्लेषण"
