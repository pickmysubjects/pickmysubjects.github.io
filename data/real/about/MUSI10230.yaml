code: MUSI10230
year: 2026
learn:
  en: "First-year Music subject: performances and talks on the issues musicians face today, small-group work and the Joining Melbourne modules."
  zh: "音乐学士一年级必修：通过演出与对谈探讨音乐人面对的议题，小组合作并完成入学模块。"
  zh-TW: "音樂學士一年級必修：透過演出與對談探討音樂人面對的議題，小組合作並完成入學模組。"
  ja: "音楽学士1年次の必修：公演と対話で音楽家の課題を考え、少人数作業と入学モジュール。"
  ko: "음악 학사 1학년 필수: 공연과 대담으로 음악가의 과제를 다루고 소그룹 활동과 입학 모듈."
  vi: "Môn năm nhất Âm nhạc: biểu diễn và trò chuyện về vấn đề của nhạc sĩ ngày nay, làm nhóm nhỏ và mô-đun nhập học."
  ms: "Subjek tahun pertama Muzik: persembahan dan bual bicara tentang isu pemuzik, kerja kumpulan dan modul orientasi."
  id: "Mata kuliah tahun pertama Musik: pertunjukan dan diskusi isu musisi masa kini, kerja kelompok dan modul orientasi."
  hi: "संगीत का प्रथम-वर्ष विषय: आज के संगीतकारों के मुद्दों पर प्रस्तुतियाँ और बातचीत, छोटे समूह और जॉइनिंग मॉड्यूल।"
outcomes:
  - en: "Discuss ethical and social issues in music"
    zh: "讨论音乐中的伦理与社会议题"
    zh-TW: "討論音樂中的倫理與社會議題"
    ja: "音楽の倫理・社会問題を議論する"
    ko: "음악의 윤리·사회 문제 토론하기"
    vi: "Thảo luận vấn đề đạo đức, xã hội trong âm nhạc"
    ms: "Bincang isu etika dan sosial dalam muzik"
    id: "Mendiskusikan isu etika dan sosial musik"
    hi: "संगीत में नैतिक और सामाजिक मुद्दों पर चर्चा"
  - en: "Work in a small group on shared tasks"
    zh: "在小组中合作完成任务"
    zh-TW: "在小組中合作完成任務"
    ja: "少人数グループで課題に取り組む"
    ko: "소그룹으로 공동 과제 하기"
    vi: "Làm việc nhóm nhỏ cho nhiệm vụ chung"
    ms: "Bekerja dalam kumpulan kecil"
    id: "Bekerja dalam kelompok kecil"
    hi: "छोटे समूह में साझा काम करना"
  - en: "Present your ideas in a short video"
    zh: "用短视频呈现自己的想法"
    zh-TW: "用短影片呈現自己的想法"
    ja: "短い動画で考えを発表する"
    ko: "짧은 영상으로 생각 발표하기"
    vi: "Trình bày ý tưởng bằng video ngắn"
    ms: "Bentang idea dalam video pendek"
    id: "Menyajikan gagasan dalam video pendek"
    hi: "छोटे वीडियो में अपने विचार प्रस्तुत करना"
