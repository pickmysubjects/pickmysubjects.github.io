code: FINA30026
year: 2026
learn:
  en: "Make new art while travelling abroad, keeping a journal and folio and producing work for an exhibition."
  zh: "在海外旅行中创作新作品，写日志、做作品集，并完成展览作品。"
  zh-TW: "在海外旅行中創作新作品，寫日誌、做作品集，並完成展覽作品。"
  ja: "海外を旅しながら新作を制作し、日誌と作品集をつけ、展示作品を仕上げる。"
  ko: "해외를 여행하며 새 작품을 만들고 일지·포트폴리오와 전시작을 완성한다."
  vi: "Sáng tác khi đi nước ngoài, viết nhật ký, làm hồ sơ và tác phẩm triển lãm."
  ms: "Hasilkan seni baharu semasa mengembara, dengan jurnal, folio dan karya pameran."
  id: "Berkarya saat bepergian ke luar negeri, dengan jurnal, folio, dan karya pameran."
  hi: "विदेश यात्रा में नई कला, जर्नल, फ़ोलियो और प्रदर्शनी के लिए काम।"
outcomes:
  - en: "Respond to art and culture abroad"
    zh: "回应海外的艺术与文化"
    zh-TW: "回應海外的藝術與文化"
    ja: "海外の美術と文化に応答する"
    ko: "해외 예술·문화에 반응하기"
    vi: "Phản hồi nghệ thuật, văn hóa nước ngoài"
    ms: "Beri respons pada seni dan budaya luar"
    id: "Merespons seni dan budaya luar negeri"
    hi: "विदेश की कला और संस्कृति पर प्रतिक्रिया"
  - en: "Develop new work from travel research"
    zh: "从旅行研究中发展新作"
    zh-TW: "從旅行研究中發展新作"
    ja: "旅のリサーチから新作を作る"
    ko: "여행 리서치로 새 작품 만들기"
    vi: "Phát triển tác phẩm từ chuyến đi"
    ms: "Bangunkan karya baharu dari kajian"
    id: "Mengembangkan karya dari riset perjalanan"
    hi: "यात्रा शोध से नया काम बनाना"
  - en: "Prepare work for exhibition"
    zh: "准备展览作品"
    zh-TW: "準備展覽作品"
    ja: "展示用の作品を準備する"
    ko: "전시 작품 준비하기"
    vi: "Chuẩn bị tác phẩm triển lãm"
    ms: "Sediakan karya untuk pameran"
    id: "Menyiapkan karya untuk pameran"
    hi: "प्रदर्शनी के लिए काम तैयार करना"
