code: MAST90122
year: 2027
learn:
  en: "Models and inference methods for time series, spatial and spatio-temporal data, balancing theory and real data."
  zh: "时间序列、空间及时空数据的模型与推断方法，兼顾理论和真实数据。"
  zh-TW: "時間序列、空間及時空資料的模型與推論方法，兼顧理論與真實資料。"
  ja: "時系列・空間・時空間データのモデルと推論法を、理論と実データで学ぶ。"
  ko: "시계열·공간·시공간 자료의 모형과 추론 방법을 이론과 실제 자료로 배움."
  vi: "Mô hình và suy luận cho chuỗi thời gian, dữ liệu không gian và không–thời gian, cân bằng lý thuyết và dữ liệu thật."
  ms: "Model dan inferens untuk siri masa, data ruang dan ruang-masa, seimbang antara teori dan data sebenar."
  id: "Model dan inferensi untuk deret waktu, data spasial dan spasio-temporal, teori dan data nyata."
  hi: "टाइम सीरीज़, स्थानिक और स्पेस-टाइम डेटा के मॉडल व अनुमान, सिद्धांत और असली डेटा दोनों।"
outcomes:
  - en: "Fit and test time series models"
    zh: "拟合并检验时间序列模型"
    zh-TW: "配適並檢定時間序列模型"
    ja: "時系列モデルを当てはめ検定する"
    ko: "시계열 모형 적합·검정하기"
    vi: "Khớp và kiểm định mô hình chuỗi thời gian"
    ms: "Memadankan dan menguji model siri masa"
    id: "Mencocokkan dan menguji model deret waktu"
    hi: "टाइम सीरीज़ मॉडल फ़िट और टेस्ट करना"
  - en: "Analyse data that varies across space and time"
    zh: "分析随空间和时间变化的数据"
    zh-TW: "分析隨空間與時間變化的資料"
    ja: "空間と時間で変わるデータを分析する"
    ko: "공간·시간에 따라 변하는 자료 분석하기"
    vi: "Phân tích dữ liệu biến đổi theo không gian và thời gian"
    ms: "Menganalisis data yang berubah mengikut ruang dan masa"
    id: "Menganalisis data yang berubah menurut ruang dan waktu"
    hi: "स्थान और समय के साथ बदलते डेटा का विश्लेषण करना"
