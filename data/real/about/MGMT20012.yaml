code: MGMT20012
year: 2027
learn:
  en: "Team-based business case analysis: breaking down real cases, building a strategy and presenting it to judges."
  zh: "团队商业案例分析：拆解真实案例、制定策略，并向评委陈述。"
  zh-TW: "團隊商業個案分析：拆解真實個案、擬定策略，並向評審簡報。"
  ja: "チームでのビジネスケース分析：事例を分解し、戦略を立て、審査員に発表する。"
  ko: "팀 단위 비즈니스 케이스 분석: 사례를 분석하고 전략을 세워 심사위원 앞에서 발표."
  vi: "Phân tích tình huống kinh doanh theo nhóm: mổ xẻ tình huống, xây dựng chiến lược và trình bày trước giám khảo."
  ms: "Analisis kes perniagaan secara berpasukan: pecahkan kes, bina strategi dan bentangkan kepada panel hakim."
  id: "Analisis kasus bisnis secara tim: membedah kasus, menyusun strategi, dan mempresentasikannya kepada juri."
  hi: "टीम में बिज़नेस केस विश्लेषण: केस को तोड़कर समझना, रणनीति बनाना और जजों के सामने पेश करना।"
outcomes:
  - en: "Critically analyse a business strategy"
    zh: "批判性分析商业策略"
    zh-TW: "批判性分析商業策略"
    ja: "ビジネス戦略を批判的に分析する"
    ko: "비즈니스 전략을 비판적으로 분석하기"
    vi: "Phân tích phê phán một chiến lược kinh doanh"
    ms: "Analisis kritis strategi perniagaan"
    id: "Menganalisis strategi bisnis secara kritis"
    hi: "किसी बिज़नेस रणनीति का आलोचनात्मक विश्लेषण"
  - en: "Develop strategies for competitive advantage"
    zh: "制定能带来竞争优势的策略"
    zh-TW: "擬定能帶來競爭優勢的策略"
    ja: "競争優位につながる戦略を立てる"
    ko: "경쟁 우위를 만드는 전략 세우기"
    vi: "Xây dựng chiến lược tạo lợi thế cạnh tranh"
    ms: "Bangunkan strategi untuk kelebihan daya saing"
    id: "Menyusun strategi untuk keunggulan bersaing"
    hi: "प्रतिस्पर्धी बढ़त के लिए रणनीति बनाना"
  - en: "Justify strategic choices as a team"
    zh: "以团队方式论证战略选择"
    zh-TW: "以團隊方式論證策略選擇"
    ja: "チームで戦略的な選択の根拠を示す"
    ko: "팀으로 전략적 선택의 근거 제시하기"
    vi: "Cùng nhóm lập luận cho các lựa chọn chiến lược"
    ms: "Wajarkan pilihan strategik secara berpasukan"
    id: "Membenarkan pilihan strategis bersama tim"
    hi: "टीम के रूप में रणनीतिक फ़ैसलों को सही ठहराना"
