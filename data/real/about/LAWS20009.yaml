code: LAWS20009
year: 2026
learn:
  en: "How law shapes our treatment of the environment and animals: climate cases, Indigenous land, rights of nature and protest law."
  zh: "法律如何影响人类对待环境和动物：气候诉讼、原住民土地、自然权利和抗议相关法律"
  zh-TW: "法律如何影響人類對待環境和動物：氣候訴訟、原住民土地、自然權利和抗議相關法律"
  ja: "法は環境と動物の扱いをどう形づくるか。気候訴訟、先住民の土地、自然の権利、抗議の法。"
  ko: "법이 환경과 동물을 대하는 방식을 어떻게 만드나: 기후 소송, 원주민 토지, 자연의 권리, 시위 관련 법."
  vi: "Luật định hình cách ta đối xử với môi trường và động vật: kiện khí hậu, đất bản địa, quyền tự nhiên, luật biểu tình."
  ms: "Cara undang-undang membentuk layanan terhadap alam dan haiwan: kes iklim, tanah Orang Asal, hak alam, protes."
  id: "Cara hukum membentuk perlakuan pada lingkungan dan hewan: gugatan iklim, tanah adat, hak alam, hukum protes."
  hi: "कानून पर्यावरण और जानवरों के साथ व्यवहार को कैसे तय करता है: जलवायु मुकदमे, आदिवासी भूमि, प्रकृति के अधिकार।"
outcomes:
  - en: "Apply legal ideas like duty of care and property rights"
    zh: "运用注意义务、产权等法律概念"
    zh-TW: "運用注意義務、財產權等法律概念"
    ja: "注意義務や財産権などの法概念を使う"
    ko: "주의 의무, 재산권 같은 법 개념 적용하기"
    vi: "Áp dụng khái niệm như nghĩa vụ chăm sóc, quyền tài sản"
    ms: "Mengaplikasi konsep seperti kewajipan berjaga dan hak harta"
    id: "Menerapkan konsep seperti kewajiban kehati-hatian dan hak milik"
    hi: "देखभाल का दायित्व और संपत्ति अधिकार जैसे सिद्धांत लागू करना"
  - en: "Analyse the link between law, democracy and climate"
    zh: "分析法律、民主与气候变化的关系"
    zh-TW: "分析法律、民主與氣候變遷的關係"
    ja: "法、民主主義、気候変動の関係を分析する"
    ko: "법, 민주주의, 기후의 관계 분석하기"
    vi: "Phân tích mối liên hệ giữa luật, dân chủ và khí hậu"
    ms: "Menganalisis hubungan undang-undang, demokrasi dan iklim"
    id: "Menganalisis hubungan hukum, demokrasi, dan iklim"
    hi: "कानून, लोकतंत्र और जलवायु के संबंध का विश्लेषण करना"
  - en: "Write a submission to a parliamentary inquiry"
    zh: "撰写一份提交给议会调查的意见书"
    zh-TW: "撰寫一份提交給議會調查的意見書"
    ja: "議会調査への意見書を書く"
    ko: "의회 조사에 낼 의견서 쓰기"
    vi: "Viết bản góp ý gửi cuộc điều trần quốc hội"
    ms: "Menulis penyerahan kepada siasatan parlimen"
    id: "Menulis masukan untuk penyelidikan parlemen"
    hi: "संसदीय जाँच के लिए सबमिशन लिखना"
