code: MCEN90050
year: 2027
learn:
  en: "Designing and prototyping a mechanical device with and for a person living with disability."
  zh: "与残障人士合作，为其设计并制作机械装置原型。"
  zh-TW: "與身心障礙者合作，為其設計並製作機械裝置原型。"
  ja: "障害のある人と一緒に、その人のための機械装置を設計・試作する。"
  ko: "장애인과 함께 그들을 위한 기계 장치를 설계하고 시제품 만들기."
  vi: "Cùng người khuyết tật thiết kế và làm mẫu thiết bị cơ khí cho họ."
  ms: "Mereka bentuk dan membuat prototaip peranti mekanikal bersama dan untuk orang kurang upaya."
  id: "Merancang dan membuat purwarupa alat mekanis bersama dan untuk penyandang disabilitas."
  hi: "विकलांग व्यक्ति के साथ और उनके लिए यांत्रिक उपकरण डिज़ाइन व प्रोटोटाइप करना।"
outcomes:
  - en: "Use human-centred design thinking"
    zh: "运用以人为本的设计思维"
    zh-TW: "運用以人為本的設計思維"
    ja: "人間中心のデザイン思考を使う"
    ko: "인간 중심 디자인 사고 활용하기"
    vi: "Vận dụng tư duy thiết kế lấy con người làm trung tâm"
    ms: "Menggunakan pemikiran reka bentuk berpusatkan manusia"
    id: "Menerapkan design thinking yang berpusat pada manusia"
    hi: "मानव-केंद्रित डिज़ाइन थिंकिंग अपनाना"
  - en: "Assess existing assistive technologies and their limits"
    zh: "评估现有辅助技术及其不足"
    zh-TW: "評估現有輔助科技及其不足"
    ja: "既存の支援技術とその限界を評価する"
    ko: "기존 보조 기술과 한계 평가하기"
    vi: "Đánh giá công nghệ hỗ trợ hiện có và hạn chế"
    ms: "Menilai teknologi bantuan sedia ada dan hadnya"
    id: "Menilai teknologi bantu yang ada dan keterbatasannya"
    hi: "मौजूदा सहायक तकनीकों और उनकी सीमाओं का आकलन"
  - en: "Build and test a prototype solution"
    zh: "制作并测试原型方案"
    zh-TW: "製作並測試原型方案"
    ja: "試作品を作って評価する"
    ko: "시제품을 만들어 평가하기"
    vi: "Làm và thử nghiệm mẫu giải pháp"
    ms: "Membina dan menguji prototaip penyelesaian"
    id: "Membuat dan menguji purwarupa solusi"
    hi: "प्रोटोटाइप समाधान बनाना और परखना"
