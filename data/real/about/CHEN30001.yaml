code: CHEN30001
year: 2026
learn:
  en: "How to design chemical reactors, including catalytic ones, and predict how reactions behave inside them."
  zh: "如何设计化学反应器（含催化反应器）并预测其中的反应行为。"
  zh-TW: "如何設計化學反應器（含催化反應器）並預測其中的反應行為。"
  ja: "触媒反応器を含む化学反応器の設計と、内部の反応挙動の予測。"
  ko: "촉매 반응기를 포함한 화학 반응기 설계와 내부 반응 거동 예측."
  vi: "Cách thiết kế thiết bị phản ứng hóa học, kể cả xúc tác, và dự đoán phản ứng bên trong."
  ms: "Cara mereka bentuk reaktor kimia, termasuk reaktor bermangkin, dan meramal tindak balas di dalamnya."
  id: "Cara merancang reaktor kimia, termasuk reaktor katalitik, dan memprediksi perilaku reaksi di dalamnya."
  hi: "केमिकल रिएक्टर (कैटेलिटिक सहित) डिज़ाइन करना और उनके अंदर रिएक्शन का व्यवहार अनुमानित करना।"
outcomes:
  - en: "Interpret data from batch and flow reactors"
    zh: "解读间歇和流动反应器数据"
    zh-TW: "解讀批次與流動反應器數據"
    ja: "回分・流通反応器のデータを読む"
    ko: "회분식·연속 반응기 데이터 해석하기"
    vi: "Đọc dữ liệu thiết bị phản ứng mẻ và dòng"
    ms: "Mentafsir data reaktor kelompok dan aliran"
    id: "Menafsirkan data reaktor batch dan alir"
    hi: "बैच और फ़्लो रिएक्टर डेटा की व्याख्या करना"
  - en: "Design simple reactor systems"
    zh: "设计简单的反应器系统"
    zh-TW: "設計簡單的反應器系統"
    ja: "簡単な反応器システムを設計する"
    ko: "간단한 반응기 시스템 설계하기"
    vi: "Thiết kế hệ thiết bị phản ứng đơn giản"
    ms: "Mereka bentuk sistem reaktor ringkas"
    id: "Merancang sistem reaktor sederhana"
    hi: "सरल रिएक्टर सिस्टम डिज़ाइन करना"
  - en: "Solve catalytic reactor design problems"
    zh: "解决催化反应器设计问题"
    zh-TW: "解決催化反應器設計問題"
    ja: "触媒反応器の設計問題を解く"
    ko: "촉매 반응기 설계 문제 풀기"
    vi: "Giải bài toán thiết kế thiết bị xúc tác"
    ms: "Menyelesaikan masalah reka bentuk reaktor bermangkin"
    id: "Menyelesaikan soal desain reaktor katalitik"
    hi: "कैटेलिटिक रिएक्टर डिज़ाइन समस्याएँ हल करना"
