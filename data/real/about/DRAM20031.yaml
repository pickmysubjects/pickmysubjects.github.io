code: DRAM20031
year: 2026
learn:
  en: "More studio work on voice, movement and acting, with detailed character work and your own practice to build stamina and confidence."
  zh: "继续声音、形体与表演训练，细化角色并自主练习，增强体能与自信。"
  zh-TW: "繼續聲音、肢體與表演訓練，細化角色並自主練習，增強體能與自信。"
  ja: "声・動き・演技の訓練を続け、役を深め、自主練習で体力と自信をつける。"
  ko: "목소리·움직임·연기 수업을 이어가며 인물을 다듬고 자율 연습으로 체력과 자신감을 쌓는다."
  vi: "Tiếp tục luyện giọng, hình thể, diễn xuất; đào sâu nhân vật và tự tập để bền bỉ, tự tin."
  ms: "Lebih banyak kerja studio suara, gerak dan lakonan, dengan amalan sendiri untuk stamina dan keyakinan."
  id: "Lebih banyak latihan suara, gerak dan akting, plus latihan mandiri untuk stamina dan percaya diri."
  hi: "आवाज़, गति और अभिनय पर और काम, बारीक किरदार और अपना अभ्यास ताकि दम और आत्मविश्वास बढ़े।"
outcomes:
  - en: "Set and meet your own technical goals"
    zh: "设定并达成自己的技术目标"
    zh-TW: "設定並達成自己的技術目標"
    ja: "自分の技術目標を立て達成する"
    ko: "자신의 기술 목표 세우고 이루기"
    vi: "Đặt và đạt mục tiêu kỹ thuật riêng"
    ms: "Tetap dan capai matlamat teknikal sendiri"
    id: "Menetapkan dan mencapai target teknis sendiri"
    hi: "अपने तकनीकी लक्ष्य तय करना और पाना"
  - en: "Use voice and movement on script and character"
    zh: "把声音与形体用于剧本和角色"
    zh-TW: "把聲音與肢體用於劇本和角色"
    ja: "声と動きを台本と役に生かす"
    ko: "목소리와 움직임을 대본·인물에 적용하기"
    vi: "Áp dụng giọng và hình thể vào kịch bản, nhân vật"
    ms: "Guna suara dan gerak pada skrip dan watak"
    id: "Menerapkan suara dan gerak pada naskah dan tokoh"
    hi: "आवाज़ और गति को स्क्रिप्ट व किरदार पर लगाना"
  - en: "Build resilience as a performer"
    zh: "增强作为表演者的韧性"
    zh-TW: "增強作為表演者的韌性"
    ja: "演者としての粘り強さを育てる"
    ko: "공연자로서 회복력 키우기"
    vi: "Rèn sức bền tinh thần của người diễn"
    ms: "Bina ketahanan sebagai pelakon"
    id: "Membangun ketangguhan sebagai pemain"
    hi: "कलाकार के रूप में मज़बूती बनाना"
