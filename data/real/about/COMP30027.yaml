code: COMP30027
year: 2026
learn:
  en: "How computers learn to make predictions from data, from the ideas behind it to hands-on analysis."
  zh: "电脑如何从数据中学会预测，从原理到动手分析。"
  zh-TW: "電腦如何從資料中學會預測，從原理到實作分析。"
  ja: "コンピュータがデータから予測を学ぶ仕組みを、理論から実践的な分析まで。"
  ko: "컴퓨터가 데이터로 예측하는 법을 배우는 원리부터 실습 분석까지."
  vi: "Máy tính học dự đoán từ dữ liệu ra sao, từ ý tưởng nền tảng đến phân tích thực hành."
  ms: "Cara komputer belajar membuat ramalan daripada data, dari idea asas hingga analisis amali."
  id: "Cara komputer belajar memprediksi dari data, dari konsep dasar hingga analisis langsung."
  hi: "कंप्यूटर डेटा से अनुमान लगाना कैसे सीखता है, सिद्धांत से लेकर हैंड्स-ऑन विश्लेषण तक।"
outcomes:
  - en: "Apply machine learning methods to real data"
    zh: "把机器学习方法用到真实数据"
    zh-TW: "把機器學習方法用在真實資料"
    ja: "実データに機械学習の手法を使う"
    ko: "실제 데이터에 머신러닝 기법 적용"
    vi: "Áp dụng học máy vào dữ liệu thật"
    ms: "Guna kaedah pembelajaran mesin pada data sebenar"
    id: "Menerapkan machine learning pada data nyata"
    hi: "असली डेटा पर मशीन लर्निंग तरीके लगाना"
  - en: "Interpret and explain model results"
    zh: "解读模型结果"
    zh-TW: "解讀並說明模型結果"
    ja: "モデルの結果を解釈し説明する"
    ko: "모델 결과 해석 및 설명"
    vi: "Diễn giải và giải thích kết quả mô hình"
    ms: "Tafsir dan terangkan keputusan model"
    id: "Menafsirkan dan menjelaskan hasil model"
    hi: "मॉडल के नतीजे समझना और समझाना"
  - en: "Compare models and pick one for a problem"
    zh: "比较模型并为问题选一个"
    zh-TW: "比較模型並為問題選一個"
    ja: "モデルを比較し問題に合うものを選ぶ"
    ko: "모델을 비교하고 문제에 맞게 선택"
    vi: "So sánh mô hình và chọn cái phù hợp"
    ms: "Banding model dan pilih satu untuk masalah"
    id: "Membandingkan model dan memilih yang cocok"
    hi: "मॉडल की तुलना करके सही चुनना"
