code: ASIA10002
year: 2026
learn:
  en: "What the idea of the 'Asian Century' means, who it serves, who it leaves out, and its impact inside and outside Asia."
  zh: "“亚洲世纪”这一说法意味着什么、为谁服务、遗漏了谁，及其在亚洲内外的影响。"
  zh-TW: "「亞洲世紀」這一說法意味著什麼、為誰服務、遺漏了誰，及其在亞洲內外的影響。"
  ja: "「アジアの世紀」という考えが何を意味し、誰のためで、誰を取り残し、アジア内外にどう影響するかを学ぶ。"
  ko: "‘아시아의 세기’라는 생각이 무엇을 뜻하고, 누구에게 유리하며, 누구를 빠뜨리고, 아시아 안팎에 어떤 영향을 주는지 배운다."
  vi: "Ý tưởng “Thế kỷ châu Á” nghĩa là gì, phục vụ ai, bỏ sót ai và tác động trong lẫn ngoài châu Á."
  ms: "Maksud idea 'Abad Asia', siapa yang mendapat manfaat, siapa yang tertinggal, dan kesannya di dalam dan luar Asia."
  id: "Arti gagasan 'Abad Asia', siapa yang diuntungkan, siapa yang tertinggal, dan dampaknya di dalam dan luar Asia."
  hi: "‘एशियाई सदी’ के विचार का अर्थ, यह किसके हित में है, किसे छोड़ देता है, और एशिया के भीतर-बाहर इसका असर।"
outcomes:
  - en: "Assess claims about an 'Asian Century'"
    zh: "评估关于“亚洲世纪”的说法"
    zh-TW: "評估關於「亞洲世紀」的說法"
    ja: "「アジアの世紀」をめぐる主張を評価する"
    ko: "‘아시아의 세기’ 주장 평가하기"
    vi: "Đánh giá các nhận định về “Thế kỷ châu Á”"
    ms: "Nilai dakwaan tentang 'Abad Asia'"
    id: "Menilai klaim tentang 'Abad Asia'"
    hi: "‘एशियाई सदी’ के दावों का आकलन करना"
  - en: "Identify groups left out of Asia's rise"
    zh: "找出亚洲崛起中被忽略的群体"
    zh-TW: "找出亞洲崛起中被忽略的群體"
    ja: "アジアの台頭から取り残された人々を特定する"
    ko: "아시아 부상에서 소외된 집단 찾기"
    vi: "Xác định các nhóm bị bỏ lại trong sự trỗi dậy của châu Á"
    ms: "Kenal pasti kumpulan yang tertinggal dalam kebangkitan Asia"
    id: "Mengenali kelompok yang tertinggal dari kebangkitan Asia"
    hi: "एशिया के उभार में छूट गए समूहों की पहचान करना"
  - en: "Discuss Asia's links with the wider world"
    zh: "讨论亚洲与世界的联系"
    zh-TW: "討論亞洲與世界的聯繫"
    ja: "アジアと世界のつながりを論じる"
    ko: "아시아와 세계의 연결 논의하기"
    vi: "Thảo luận mối liên hệ của châu Á với thế giới"
    ms: "Bincangkan hubungan Asia dengan dunia"
    id: "Membahas hubungan Asia dengan dunia"
    hi: "एशिया के व्यापक दुनिया से संबंधों पर चर्चा करना"
