code: HPSC30037
year: 2026
learn:
  en: "How modern science took shape from Copernicus to Darwin, and how society, politics and culture shaped new ways of knowing."
  zh: "从哥白尼到达尔文，现代科学如何成形，以及社会、政治和文化如何塑造新的认知方式。"
  zh-TW: "從哥白尼到達爾文，現代科學如何成形，以及社會、政治和文化如何塑造新的認知方式。"
  ja: "コペルニクスからダーウィンまで、近代科学はどう形づくられ、社会・政治・文化が新しい知のあり方をどう方向づけたか。"
  ko: "코페르니쿠스부터 다윈까지 근대 과학은 어떻게 형성됐고, 사회·정치·문화는 새로운 앎의 방식을 어떻게 만들었나."
  vi: "Khoa học hiện đại hình thành ra sao từ Copernicus đến Darwin, và xã hội, chính trị, văn hóa định hình cách hiểu biết mới thế nào."
  ms: "Cara sains moden terbentuk dari Copernicus hingga Darwin, dan cara masyarakat, politik serta budaya membentuk cara mengetahui baharu."
  id: "Cara sains modern terbentuk dari Copernicus hingga Darwin, dan cara masyarakat, politik dan budaya membentuk cara mengetahui baru."
  hi: "कोपरनिकस से डार्विन तक आधुनिक विज्ञान कैसे बना, और समाज, राजनीति व संस्कृति ने जानने के नए तरीकों को कैसे गढ़ा।"
outcomes:
  - en: "Outline the major shifts in early modern science"
    zh: "概述近代早期科学的重大转变"
    zh-TW: "概述近代早期科學的重大轉變"
    ja: "初期近代科学の大きな転換を整理する"
    ko: "초기 근대 과학의 주요 전환 정리하기"
    vi: "Tóm lược các bước ngoặt lớn của khoa học cận đại"
    ms: "Gariskan perubahan besar sains moden awal"
    id: "Merangkum pergeseran besar sains modern awal"
    hi: "आरंभिक आधुनिक विज्ञान के बड़े बदलाव बताना"
  - en: "Link scientific ideas to their social context"
    zh: "把科学思想与社会背景联系起来"
    zh-TW: "把科學思想與社會背景聯繫起來"
    ja: "科学思想を社会的背景と結びつける"
    ko: "과학 사상을 사회적 맥락과 연결하기"
    vi: "Liên hệ ý tưởng khoa học với bối cảnh xã hội"
    ms: "Kaitkan idea sains dengan konteks sosial"
    id: "Mengaitkan gagasan ilmiah dengan konteks sosial"
    hi: "वैज्ञानिक विचारों को सामाजिक संदर्भ से जोड़ना"
  - en: "Present a historical argument clearly"
    zh: "清晰地陈述一个历史论点"
    zh-TW: "清晰地陳述一個歷史論點"
    ja: "歴史的な主張をわかりやすく発表する"
    ko: "역사적 논지를 명확히 발표하기"
    vi: "Trình bày rõ một lập luận lịch sử"
    ms: "Bentangkan hujah sejarah dengan jelas"
    id: "Menyampaikan argumen sejarah dengan jelas"
    hi: "ऐतिहासिक तर्क साफ़ ढंग से प्रस्तुत करना"
