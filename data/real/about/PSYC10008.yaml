code: PSYC10008
year: 2027
learn:
  en: "Learning and practising mindfulness skills, then using them for study, work and social life, like burnout or conflict."
  zh: "学习并练习正念技巧，用于学习、工作和社交中的倦怠、冲突等问题。"
  zh-TW: "學習並練習正念技巧，用在學業、工作和社交中的倦怠、衝突等問題。"
  ja: "マインドフルネスの技法を学んで実践し、燃え尽きや対人の衝突など、勉強・仕事・人付き合いの課題に活かす。"
  ko: "마인드풀니스 기술을 배우고 연습해 번아웃, 갈등 등 공부, 일, 인간관계의 문제에 적용한다."
  vi: "Học và luyện kỹ năng chánh niệm, rồi áp dụng vào việc học, công việc và đời sống xã hội như kiệt sức hay xung đột."
  ms: "Belajar dan berlatih kemahiran kesedaran penuh (mindfulness), lalu menggunakannya untuk belajar, kerja dan kehidupan sosial seperti burnout atau konflik."
  id: "Mempelajari dan melatih keterampilan mindfulness, lalu memakainya untuk kuliah, kerja, dan kehidupan sosial seperti burnout atau konflik."
  hi: "माइंडफुलनेस के कौशल सीखना और अभ्यास करना, फिर उन्हें पढ़ाई, काम और सामाजिक जीवन में बर्नआउट या टकराव जैसी चीज़ों पर लगाना।"
outcomes:
  - en: "Understand how mindfulness works and how it is practised"
    zh: "理解正念的原理和练习方法"
    zh-TW: "理解正念的原理和練習方法"
    ja: "マインドフルネスの仕組みと実践方法を理解する"
    ko: "마인드풀니스의 원리와 실천 방법 이해하기"
    vi: "Hiểu cơ chế và cách thực hành chánh niệm"
    ms: "Fahami cara mindfulness berfungsi dan diamalkan"
    id: "Memahami cara kerja mindfulness dan cara mempraktikkannya"
    hi: "माइंडफुलनेस कैसे काम करती है और कैसे अभ्यास होती है, समझना"
  - en: "Reflect on your own experience to find ways to self-care"
    zh: "反思自身经历，找到自我照顾的方法"
    zh-TW: "反思自身經驗，找到自我照顧的方法"
    ja: "自分の経験を振り返りセルフケアの方法を見つける"
    ko: "자신의 경험을 돌아보며 자기 돌봄 방법 찾기"
    vi: "Nhìn lại trải nghiệm bản thân để tìm cách tự chăm sóc"
    ms: "Renung pengalaman sendiri untuk mencari cara menjaga diri"
    id: "Merefleksikan pengalaman sendiri untuk menemukan cara merawat diri"
    hi: "अपने अनुभव पर सोचकर खुद की देखभाल के तरीके खोजना"
  - en: "Use mindfulness skills in study, work and social life"
    zh: "在学习、工作和社交中运用正念"
    zh-TW: "在學業、工作和社交中運用正念"
    ja: "勉強・仕事・人付き合いでマインドフルネスを使う"
    ko: "공부, 일, 인간관계에서 마인드풀니스 활용하기"
    vi: "Áp dụng chánh niệm trong học tập, công việc và giao tiếp"
    ms: "Guna kemahiran mindfulness dalam belajar, kerja dan kehidupan sosial"
    id: "Menerapkan mindfulness dalam kuliah, kerja, dan kehidupan sosial"
    hi: "पढ़ाई, काम और सामाजिक जीवन में माइंडफुलनेस अपनाना"
