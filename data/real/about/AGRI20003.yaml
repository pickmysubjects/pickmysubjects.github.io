code: AGRI20003
year: 2026
learn:
  en: "How food gets from farm to plate, and what makes that chain fairer, greener and more secure. Taught as a Dookie intensive."
  zh: "食物如何从农场到餐桌，以及怎样让这条链更公平、更环保、更安全。Dookie密集课。"
  zh-TW: "食物如何從農場到餐桌，以及怎樣讓這條鏈更公平、更環保、更安全。Dookie密集課。"
  ja: "食べ物が農場から食卓に届く仕組みと、それをより公正で持続可能にする方法。Dookie集中講義。"
  ko: "음식이 농장에서 식탁까지 오는 과정과 이를 더 공정하고 지속가능하게 만드는 법. Dookie 집중 과정."
  vi: "Thực phẩm đi từ trang trại đến bàn ăn ra sao, và cách làm chuỗi đó bền vững hơn. Học tập trung ở Dookie."
  ms: "Bagaimana makanan sampai dari ladang ke meja, dan cara menjadikannya lebih adil dan lestari. Intensif di Dookie."
  id: "Bagaimana pangan sampai dari lahan ke meja, dan cara membuatnya lebih adil dan berkelanjutan. Intensif di Dookie."
  hi: "खाना खेत से थाली तक कैसे पहुँचता है और इस शृंखला को टिकाऊ कैसे बनाएँ। Dookie इंटेंसिव।"
outcomes:
  - en: "Map the steps of a food supply chain"
    zh: "梳理食物供应链的各个环节"
    zh-TW: "梳理糧食供應鏈的各個環節"
    ja: "食料供給網の各段階を整理する"
    ko: "식품 공급망의 단계 정리하기"
    vi: "Vẽ ra các khâu của chuỗi cung ứng thực phẩm"
    ms: "Petakan peringkat rantaian bekalan makanan"
    id: "Memetakan tahapan rantai pasok pangan"
    hi: "खाद्य आपूर्ति शृंखला के चरण समझना"
  - en: "Weigh environmental and social trade-offs in food"
    zh: "权衡食物生产中的环境与社会取舍"
    zh-TW: "權衡糧食生產中的環境與社會取捨"
    ja: "食の環境的・社会的なトレードオフを考える"
    ko: "식품의 환경·사회적 득실 따지기"
    vi: "Cân nhắc đánh đổi môi trường và xã hội"
    ms: "Timbang kesan alam sekitar dan sosial"
    id: "Menimbang dampak lingkungan dan sosial"
    hi: "पर्यावरण और समाज के बीच संतुलन तौलना"
  - en: "Propose ways to make a food system more sustainable"
    zh: "提出让食物系统更可持续的办法"
    zh-TW: "提出讓糧食系統更永續的辦法"
    ja: "食料システムをより持続可能にする案を出す"
    ko: "식품 체계를 더 지속가능하게 할 방안 제시하기"
    vi: "Đề xuất cách làm hệ thống thực phẩm bền vững hơn"
    ms: "Cadang cara menjadikan sistem makanan lestari"
    id: "Mengusulkan cara agar sistem pangan berkelanjutan"
    hi: "खाद्य प्रणाली को टिकाऊ बनाने के उपाय सुझाना"
