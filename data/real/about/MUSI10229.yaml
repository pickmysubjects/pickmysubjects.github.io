code: MUSI10229
year: 2026
learn:
  en: "The basic elements of sound and music, learned through critical listening, theory, perception and audio technology tasks."
  zh: "通过批判性聆听、理论、听觉感知和音频技术练习，认识声音与音乐的基本元素。"
  zh-TW: "透過批判性聆聽、理論、聽覺感知與音訊技術練習，認識聲音與音樂的基本元素。"
  ja: "批判的聴取、理論、知覚、音響技術の課題で音と音楽の基本要素を学ぶ。"
  ko: "비판적 청취, 이론, 지각, 오디오 기술 과제로 소리와 음악의 기본 요소를 배운다."
  vi: "Các yếu tố cơ bản của âm thanh và âm nhạc qua nghe phân tích, lý thuyết, cảm thụ và công nghệ âm thanh."
  ms: "Unsur asas bunyi dan muzik melalui pendengaran kritis, teori, persepsi dan tugasan teknologi audio."
  id: "Unsur dasar suara dan musik lewat mendengar kritis, teori, persepsi, dan tugas teknologi audio."
  hi: "आलोचनात्मक सुनने, सिद्धांत, धारणा और ऑडियो तकनीक से ध्वनि व संगीत के मूल तत्व।"
outcomes:
  - en: "Describe the key elements of sound"
    zh: "描述声音的关键要素"
    zh-TW: "描述聲音的關鍵要素"
    ja: "音の主要な要素を説明する"
    ko: "소리의 핵심 요소 설명하기"
    vi: "Mô tả các yếu tố chính của âm thanh"
    ms: "Terangkan unsur utama bunyi"
    id: "Menjelaskan unsur utama suara"
    hi: "ध्वनि के मुख्य तत्व समझाना"
  - en: "Listen critically and analyse"
    zh: "进行批判性聆听和分析"
    zh-TW: "進行批判性聆聽與分析"
    ja: "批判的に聴いて分析する"
    ko: "비판적으로 듣고 분석하기"
    vi: "Nghe có phản biện và phân tích"
    ms: "Dengar secara kritis dan analisis"
    id: "Mendengar kritis dan menganalisis"
    hi: "ध्यान से सुनकर विश्लेषण करना"
  - en: "Handle basic audio tools"
    zh: "掌握基本音频工具"
    zh-TW: "掌握基本音訊工具"
    ja: "基本的な音響ツールを扱う"
    ko: "기본 오디오 도구 다루기"
    vi: "Sử dụng công cụ âm thanh cơ bản"
    ms: "Kendalikan alat audio asas"
    id: "Mengoperasikan alat audio dasar"
    hi: "बुनियादी ऑडियो टूल चलाना"
