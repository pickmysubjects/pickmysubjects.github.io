code: FINA10025
year: 2026
learn:
  en: "Start a studio practice in drawing and printmaking, painting, photography or sculpture by trying many materials and methods."
  zh: "在绘画版画、油画、摄影或雕塑方向起步，尝试多种材料与方法。"
  zh-TW: "在素描版畫、繪畫、攝影或雕塑方向起步，嘗試多種材料與方法。"
  ja: "ドローイング・版画、絵画、写真、彫刻のいずれかで、多様な素材と技法を試しながら制作を始める。"
  ko: "드로잉·판화, 회화, 사진, 조각 중 하나에서 다양한 재료와 기법을 시도하며 작업을 시작한다."
  vi: "Bắt đầu thực hành studio về vẽ và in, hội họa, nhiếp ảnh hay điêu khắc qua nhiều chất liệu và cách làm."
  ms: "Mulakan amalan studio dalam lukisan dan cetakan, catan, fotografi atau arca dengan pelbagai bahan dan kaedah."
  id: "Memulai praktik studio di gambar dan cetak grafis, lukis, fotografi, atau patung dengan beragam bahan dan cara."
  hi: "ड्रॉइंग-प्रिंटमेकिंग, पेंटिंग, फ़ोटोग्राफ़ी या मूर्तिकला में कई सामग्री और तरीक़े आज़माकर स्टूडियो अभ्यास शुरू करना।"
outcomes:
  - en: "Apply basic art skills across materials"
    zh: "在多种材料上运用基本艺术技能"
    zh-TW: "在多種材料上運用基本藝術技能"
    ja: "さまざまな素材で基本的な美術技能を使う"
    ko: "여러 재료에 기본 미술 기술 적용하기"
    vi: "Áp dụng kỹ năng mỹ thuật cơ bản trên nhiều chất liệu"
    ms: "Mengguna kemahiran seni asas pada pelbagai bahan"
    id: "Menerapkan keterampilan seni dasar di berbagai bahan"
    hi: "अलग-अलग सामग्री पर बुनियादी कला कौशल लगाना"
  - en: "Experiment with different working processes"
    zh: "尝试不同的创作过程"
    zh-TW: "嘗試不同的創作過程"
    ja: "さまざまな制作プロセスを試す"
    ko: "다양한 작업 과정 실험하기"
    vi: "Thử nghiệm nhiều quy trình sáng tác"
    ms: "Bereksperimen dengan proses kerja berbeza"
    id: "Bereksperimen dengan berbagai proses berkarya"
    hi: "अलग-अलग काम करने के तरीक़ों से प्रयोग करना"
  - en: "Use art history and theory in new work"
    zh: "把艺术史与理论用到新作品中"
    zh-TW: "把藝術史與理論用到新作品中"
    ja: "美術史と理論を新作に生かす"
    ko: "미술사와 이론을 새 작품에 활용하기"
    vi: "Vận dụng lịch sử và lý luận nghệ thuật vào tác phẩm mới"
    ms: "Mengguna sejarah dan teori seni dalam karya baharu"
    id: "Memakai sejarah dan teori seni dalam karya baru"
    hi: "नए काम में कला इतिहास और सिद्धांत लगाना"
