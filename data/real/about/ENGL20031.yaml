code: ENGL20031
year: 2026
learn:
  en: "Postcolonial adaptation: rewrites of Western classics, and postcolonial novels and plays turned into film, comics and documentary."
  zh: "后殖民视角下的改编：对西方经典的重写，以及后殖民小说和戏剧被改编成电影、漫画和纪录片。"
  zh-TW: "後殖民視角下的改編：對西方經典的重寫，以及後殖民小說和戲劇被改編成電影、漫畫和紀錄片。"
  ja: "ポストコロニアルな翻案。西洋古典の書き直しと、ポストコロニアル小説や戯曲の映画・漫画・ドキュメンタリー化。"
  ko: "탈식민 관점의 각색. 서양 고전 다시 쓰기와 탈식민 소설·희곡의 영화·만화·다큐멘터리화."
  vi: "Chuyển thể hậu thực dân: viết lại kinh điển phương Tây, và tiểu thuyết, kịch hậu thực dân thành phim, truyện tranh, phim tài liệu."
  ms: "Adaptasi pascakolonial: penulisan semula klasik Barat, serta novel dan drama pascakolonial dijadikan filem, komik dan dokumentari."
  id: "Adaptasi pascakolonial: penulisan ulang klasik Barat, serta novel dan drama pascakolonial yang diangkat ke film, komik dan dokumenter."
  hi: "उत्तर-औपनिवेशिक रूपांतरण: पश्चिमी क्लासिक्स का पुनर्लेखन, और उत्तर-औपनिवेशिक उपन्यासों-नाटकों से बनी फ़िल्में, कॉमिक्स और डॉक्यूमेंट्री।"
outcomes:
  - en: "Compare a text with its adaptations"
    zh: "比较原作与其改编作品"
    zh-TW: "比較原作與其改編作品"
    ja: "原作とその翻案を比べる"
    ko: "원작과 각색 작품 비교하기"
    vi: "So sánh một tác phẩm với các bản chuyển thể"
    ms: "Bandingkan teks dengan adaptasinya"
    id: "Membandingkan teks dengan adaptasinya"
    hi: "किसी पाठ की उसके रूपांतरणों से तुलना करना"
  - en: "Discuss appropriation and cultural exchange"
    zh: "讨论挪用与文化交流"
    zh-TW: "討論挪用與文化交流"
    ja: "文化の盗用と交流について議論する"
    ko: "문화 전유와 교류 토론하기"
    vi: "Thảo luận về chiếm dụng và giao lưu văn hóa"
    ms: "Bincangkan apropriasi dan pertukaran budaya"
    id: "Membahas apropriasi dan pertukaran budaya"
    hi: "सांस्कृतिक हड़प और आदान-प्रदान पर चर्चा करना"
  - en: "Read across novels, film and graphic forms"
    zh: "跨越小说、电影和图像叙事进行阅读"
    zh-TW: "跨越小說、電影和圖像敘事進行閱讀"
    ja: "小説、映画、グラフィック作品を横断して読む"
    ko: "소설, 영화, 그래픽 형식을 넘나들며 읽기"
    vi: "Đọc xuyên suốt tiểu thuyết, phim và truyện tranh"
    ms: "Baca merentas novel, filem dan bentuk grafik"
    id: "Membaca lintas novel, film dan karya grafis"
    hi: "उपन्यास, फ़िल्म और ग्राफ़िक रूपों को साथ पढ़ना"
