code: PHIL20046
year: 2026
learn:
  en: "What feminism is and who it's for: intersectionality, men as feminists, and debates like sex work, surrogacy and beauty norms."
  zh: "女性主义是什么、为谁而存在：交叉性、男性能否成为女性主义者，以及性工作、代孕和美貌标准等争论。"
  zh-TW: "女性主義是什麼、為誰而存在：交織性、男性能否成為女性主義者，以及性工作、代孕和美貌標準等爭論。"
  ja: "フェミニズムとは何か、誰のためのものか。インターセクショナリティ、男性とフェミニズム、性労働、代理出産、美の規範をめぐる論争。"
  ko: "페미니즘은 무엇이며 누구를 위한 것인가. 교차성, 남성 페미니스트, 성노동, 대리모, 미의 기준 논쟁."
  vi: "Nữ quyền là gì và dành cho ai: tính giao thoa, nam giới theo nữ quyền, và tranh luận về mại dâm, mang thai hộ, chuẩn mực sắc đẹp."
  ms: "Apa itu feminisme dan untuk siapa: interseksionaliti, lelaki sebagai feminis, dan perdebatan seperti kerja seks, ibu tumpang dan norma kecantikan."
  id: "Apa itu feminisme dan untuk siapa: interseksionalitas, laki-laki feminis, dan debat seperti kerja seks, surogasi dan standar kecantikan."
  hi: "नारीवाद क्या है और किसके लिए: अंतर्विभाजकता, पुरुष नारीवादी, और सेक्स वर्क, सरोगेसी व सुंदरता के मानकों जैसी बहसें।"
outcomes:
  - en: "Compare competing ideas of feminism"
    zh: "比较相互竞争的女性主义观点"
    zh-TW: "比較相互競爭的女性主義觀點"
    ja: "対立するフェミニズムの考え方を比べる"
    ko: "서로 다른 페미니즘 관점 비교하기"
    vi: "So sánh các quan niệm nữ quyền khác nhau"
    ms: "Bandingkan idea feminisme yang bersaing"
    id: "Membandingkan gagasan feminisme yang bersaing"
    hi: "नारीवाद के अलग-अलग विचारों की तुलना करना"
  - en: "Test feminist arguments critically"
    zh: "批判性地检验女性主义论证"
    zh-TW: "批判性地檢驗女性主義論證"
    ja: "フェミニズムの議論を批判的に検討する"
    ko: "페미니즘 논증을 비판적으로 검토하기"
    vi: "Kiểm tra phản biện các lập luận nữ quyền"
    ms: "Uji hujah feminis secara kritis"
    id: "Menguji argumen feminis secara kritis"
    hi: "नारीवादी तर्कों को आलोचनात्मक ढंग से परखना"
  - en: "Apply theory to real-world issues"
    zh: "把理论用于现实议题"
    zh-TW: "把理論用於現實議題"
    ja: "理論を現実の問題に当てはめる"
    ko: "이론을 현실 문제에 적용하기"
    vi: "Áp dụng lý thuyết vào vấn đề thực tế"
    ms: "Gunakan teori pada isu dunia sebenar"
    id: "Menerapkan teori pada isu nyata"
    hi: "सिद्धांत को असली मुद्दों पर लागू करना"
