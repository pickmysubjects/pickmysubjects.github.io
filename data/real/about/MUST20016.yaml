code: MUST20016
year: 2026
learn:
  en: "How musicals from Oklahoma to Hamilton reflect society, with online singing tasks and self-taped performances."
  zh: "从《俄克拉荷马》到《汉密尔顿》，看音乐剧如何反映社会，含线上演唱练习和自录表演。"
  zh-TW: "從《奧克拉荷馬》到《漢密爾頓》，看音樂劇如何反映社會，含線上演唱練習和自錄表演。"
  ja: "『オクラホマ!』から『ハミルトン』まで、ミュージカルが社会を映す仕組みを、歌の課題と自撮り演技で学ぶ。"
  ko: "오클라호마부터 해밀턴까지 뮤지컬이 사회를 비추는 방식을 온라인 노래 과제와 셀프테이프로 배우기."
  vi: "Nhạc kịch từ Oklahoma đến Hamilton phản ánh xã hội ra sao, kèm bài hát trực tuyến và tự quay biểu diễn."
  ms: "Bagaimana muzikal dari Oklahoma hingga Hamilton mencerminkan masyarakat, dengan tugasan nyanyian dalam talian."
  id: "Bagaimana musikal dari Oklahoma sampai Hamilton mencerminkan masyarakat, dengan tugas bernyanyi daring dan rekaman diri."
  hi: "ओक्लाहोमा से हैमिल्टन तक म्यूज़िकल समाज को कैसे दिखाते हैं, ऑनलाइन गायन और सेल्फ़-टेप प्रदर्शन के साथ।"
outcomes:
  - en: "Explain how musicals mirror their times"
    zh: "解释音乐剧如何映照其时代"
    zh-TW: "解釋音樂劇如何映照其時代"
    ja: "ミュージカルが時代をどう映すか説明する"
    ko: "뮤지컬이 시대를 어떻게 비추는지 설명하기"
    vi: "Giải thích nhạc kịch phản chiếu thời đại thế nào"
    ms: "Terangkan cara muzikal mencerminkan zamannya"
    id: "Menjelaskan cara musikal mencerminkan zamannya"
    hi: "म्यूज़िकल अपने समय को कैसे दर्शाते हैं, समझाना"
  - en: "Perform a song on a recorded self-tape"
    zh: "录制一段自己演唱的视频"
    zh-TW: "錄製一段自己演唱的影片"
    ja: "自撮り動画で一曲歌う"
    ko: "셀프테이프로 노래 한 곡 공연하기"
    vi: "Tự quay video trình diễn một bài hát"
    ms: "Persembahkan lagu dalam rakaman sendiri"
    id: "Membawakan lagu dalam rekaman mandiri"
    hi: "सेल्फ़-टेप वीडियो में एक गाना प्रस्तुत करना"
  - en: "Reflect on your own performance choices"
    zh: "反思自己的表演选择"
    zh-TW: "反思自己的表演選擇"
    ja: "自分の演技の選択を振り返る"
    ko: "자신의 공연 선택 성찰하기"
    vi: "Suy ngẫm lựa chọn biểu diễn của bản thân"
    ms: "Renungkan pilihan persembahan sendiri"
    id: "Merefleksikan pilihan penampilan sendiri"
    hi: "अपने प्रदर्शन के फ़ैसलों पर विचार करना"
