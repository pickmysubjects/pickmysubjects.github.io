code: AGRI10039
year: 2026
learn:
  en: "A one-week Dookie intensive on how Australian wine is grown, made and judged, with blind tasting at its core."
  zh: "在Dookie一周密集课，了解澳洲葡萄酒的种植、酿造和品鉴，核心是盲品。"
  zh-TW: "在Dookie一週密集課，了解澳洲葡萄酒的種植、釀造與品評，核心是盲品。"
  ja: "Dookieでの1週間集中講義。オーストラリアワインの栽培・醸造・評価を学び、ブラインドテイスティングが中心。"
  ko: "Dookie 캠퍼스 1주 집중 과정. 호주 와인의 재배·양조·평가를 배우며 블라인드 테이스팅이 핵심."
  vi: "Khóa tập trung một tuần ở Dookie về trồng, làm và đánh giá rượu vang Úc, trọng tâm là nếm mù."
  ms: "Kursus intensif seminggu di Dookie tentang penanaman, pembuatan dan penilaian wain Australia, berteraskan rasa buta."
  id: "Kursus intensif seminggu di Dookie tentang budidaya, pembuatan dan penilaian anggur Australia, intinya cicip buta."
  hi: "Dookie में एक हफ़्ते का इंटेंसिव: ऑस्ट्रेलियाई वाइन कैसे उगाई, बनाई और परखी जाती है, ब्लाइंड टेस्टिंग मुख्य।"
outcomes:
  - en: "Describe wine styles by sight, smell and taste"
    zh: "从外观、香气和口感描述酒款风格"
    zh-TW: "從外觀、香氣與口感描述酒款風格"
    ja: "見た目・香り・味でワインのスタイルを説明する"
    ko: "색·향·맛으로 와인 스타일 설명하기"
    vi: "Mô tả phong cách vang qua màu, mùi, vị"
    ms: "Huraikan gaya wain melalui rupa, bau dan rasa"
    id: "Menjelaskan gaya anggur lewat rupa, aroma, rasa"
    hi: "रूप, गंध और स्वाद से वाइन शैली बताना"
  - en: "Link grape growing and winemaking to the wine"
    zh: "把种植和酿造过程与成品联系起来"
    zh-TW: "把種植與釀造過程與成品連結起來"
    ja: "栽培と醸造をワインの特徴に結びつける"
    ko: "포도 재배·양조를 완성된 와인과 연결하기"
    vi: "Liên hệ trồng nho và làm vang với thành phẩm"
    ms: "Kaitkan penanaman dan pembuatan dengan wain"
    id: "Mengaitkan budidaya dan pembuatan dengan anggurnya"
    hi: "अंगूर की खेती और वाइन बनाने को नतीजे से जोड़ना"
  - en: "Place Australian wine within the world market"
    zh: "认识澳洲葡萄酒在世界市场中的位置"
    zh-TW: "認識澳洲葡萄酒在世界市場中的位置"
    ja: "世界市場の中でオーストラリアワインを位置づける"
    ko: "세계 시장 속 호주 와인의 위치 이해하기"
    vi: "Hiểu vị trí vang Úc trên thị trường thế giới"
    ms: "Fahami kedudukan wain Australia di pasaran dunia"
    id: "Memahami posisi anggur Australia di pasar dunia"
    hi: "विश्व बाज़ार में ऑस्ट्रेलियाई वाइन की जगह समझना"
