code: EVSC30002
year: 2026
learn:
  en: "How science feeds into environmental decisions: study design, monitoring and acting under uncertainty."
  zh: "科学如何支撑环境决策：研究设计、监测，以及在不确定中做决定。"
  zh-TW: "科學如何支撐環境決策：研究設計、監測，以及在不確定中做決定。"
  ja: "科学が環境の意思決定にどう役立つか：調査設計、モニタリング、不確実性下の判断。"
  ko: "과학이 환경 의사결정에 어떻게 쓰이는지: 연구 설계, 모니터링, 불확실성 속 판단."
  vi: "Khoa học góp phần vào quyết định môi trường: thiết kế nghiên cứu, giám sát và hành động khi bất định."
  ms: "Cara sains menyumbang kepada keputusan alam sekitar: reka bentuk kajian, pemantauan dan bertindak dalam ketidakpastian."
  id: "Cara sains mendukung keputusan lingkungan: desain studi, pemantauan, dan bertindak dalam ketidakpastian."
  hi: "विज्ञान पर्यावरण निर्णयों में कैसे काम आता है: स्टडी डिज़ाइन, मॉनिटरिंग और अनिश्चितता में फ़ैसले।"
outcomes:
  - en: "Design monitoring and evaluation studies"
    zh: "设计监测与评估研究"
    zh-TW: "設計監測與評估研究"
    ja: "モニタリングと評価の調査を設計する"
    ko: "모니터링·평가 연구를 설계한다"
    vi: "Thiết kế nghiên cứu giám sát và đánh giá"
    ms: "Reka kajian pemantauan dan penilaian"
    id: "Merancang studi pemantauan dan evaluasi"
    hi: "मॉनिटरिंग और मूल्यांकन अध्ययन डिज़ाइन करना"
  - en: "Communicate complex environmental problems"
    zh: "表达复杂的环境问题"
    zh-TW: "表達複雜的環境問題"
    ja: "複雑な環境問題を伝える"
    ko: "복잡한 환경 문제를 전달한다"
    vi: "Truyền đạt vấn đề môi trường phức tạp"
    ms: "Sampaikan masalah alam sekitar yang kompleks"
    id: "Mengomunikasikan masalah lingkungan kompleks"
    hi: "जटिल पर्यावरण समस्याओं को समझाना"
