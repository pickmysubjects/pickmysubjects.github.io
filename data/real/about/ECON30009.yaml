code: ECON30009
year: 2026
learn:
  en: "Advanced macroeconomics built around one life-cycle model: growth, business cycles, policy and trade."
  zh: "用一个生命周期模型学高级宏观：增长、经济周期、政策和贸易。"
  zh-TW: "用一個生命週期模型學進階總體經濟：成長、景氣循環、政策和貿易。"
  ja: "ライフサイクルモデルを軸に学ぶ上級マクロ経済：成長、景気循環、政策、貿易。"
  ko: "생애주기 모형 하나로 배우는 고급 거시경제: 성장, 경기순환, 정책, 무역."
  vi: "Kinh tế vĩ mô nâng cao xoay quanh mô hình vòng đời: tăng trưởng, chu kỳ kinh tế, chính sách và thương mại."
  ms: "Makroekonomi lanjutan berasaskan satu model kitaran hayat: pertumbuhan, kitaran perniagaan, dasar dan perdagangan."
  id: "Makroekonomi lanjutan berbasis satu model siklus hidup: pertumbuhan, siklus bisnis, kebijakan, dan perdagangan."
  hi: "एक लाइफ-साइकल मॉडल पर आधारित एडवांस्ड मैक्रोइकोनॉमिक्स: ग्रोथ, बिज़नेस साइकल, नीति और व्यापार।"
outcomes:
  - en: "Explain why incomes differ across countries"
    zh: "解释各国收入为何不同"
    zh-TW: "解釋各國所得為何不同"
    ja: "国ごとの所得差の理由を説明する"
    ko: "나라마다 소득이 다른 이유 설명하기"
    vi: "Giải thích vì sao thu nhập các nước khác nhau"
    ms: "Terangkan mengapa pendapatan berbeza antara negara"
    id: "Menjelaskan mengapa pendapatan antarnegara berbeda"
    hi: "देशों की आय में फ़र्क क्यों है, समझाना"
  - en: "Trace how the economy reacts to policy or productivity shocks"
    zh: "分析经济对政策或生产率冲击的反应"
    zh-TW: "分析經濟對政策或生產力衝擊的反應"
    ja: "政策や生産性ショックへの経済の反応を追う"
    ko: "정책·생산성 충격에 대한 경제 반응 분석하기"
    vi: "Phân tích phản ứng của nền kinh tế trước cú sốc chính sách hay năng suất"
    ms: "Jejak tindak balas ekonomi terhadap kejutan dasar atau produktiviti"
    id: "Melacak respons ekonomi terhadap guncangan kebijakan atau produktivitas"
    hi: "नीति या उत्पादकता के झटकों पर अर्थव्यवस्था की प्रतिक्रिया समझना"
  - en: "Use a two-country model to study trade"
    zh: "用两国模型分析国际贸易"
    zh-TW: "用兩國模型分析國際貿易"
    ja: "2国モデルで貿易を分析する"
    ko: "2국 모형으로 무역 분석하기"
    vi: "Dùng mô hình hai nước để phân tích thương mại"
    ms: "Guna model dua negara untuk kaji perdagangan"
    id: "Memakai model dua negara untuk menganalisis perdagangan"
    hi: "दो-देश मॉडल से व्यापार का विश्लेषण करना"
