code: ABPL30066
year: 2027
learn:
  en: "How architecture ties into power, politics and culture, from classical Western traditions to non-Western challenges."
  zh: "建筑如何与权力、政治和文化交织：从西方古典传统到非西方建筑的冲击。"
  zh-TW: "建築如何與權力、政治和文化交織：從西方古典傳統到非西方建築的衝擊。"
  ja: "建築が権力・政治・文化とどう結びつくか：西洋古典の伝統から非西洋建築の揺さぶりまで。"
  ko: "건축이 권력·정치·문화와 어떻게 얽히는지: 서양 고전 전통부터 비서양 건축의 도전까지."
  vi: "Kiến trúc gắn với quyền lực, chính trị và văn hóa ra sao: từ truyền thống cổ điển phương Tây đến tác động của kiến trúc phi phương Tây."
  ms: "Bagaimana seni bina berkait dengan kuasa, politik dan budaya, dari tradisi klasik Barat hingga cabaran bukan Barat."
  id: "Bagaimana arsitektur terkait kekuasaan, politik, dan budaya, dari tradisi klasik Barat hingga tantangan non-Barat."
  hi: "वास्तुकला सत्ता, राजनीति और संस्कृति से कैसे जुड़ी है: पश्चिमी शास्त्रीय परंपरा से गैर-पश्चिमी चुनौतियों तक।"
outcomes:
  - en: "Link architecture and spatial order to power"
    zh: "把建筑和空间秩序与权力联系起来"
    zh-TW: "把建築和空間秩序與權力連結起來"
    ja: "建築と空間秩序を権力と結びつけて考える"
    ko: "건축과 공간 질서를 권력과 연결해 보기"
    vi: "Liên hệ kiến trúc và trật tự không gian với quyền lực"
    ms: "Kaitkan seni bina dan susunan ruang dengan kuasa"
    id: "Mengaitkan arsitektur dan tatanan ruang dengan kekuasaan"
    hi: "वास्तुकला और स्थानिक व्यवस्था को सत्ता से जोड़ना"
  - en: "Rethink Western architectural tradition and style"
    zh: "重新审视西方建筑的传统与风格"
    zh-TW: "重新審視西方建築的傳統與風格"
    ja: "西洋建築の伝統と様式を見直す"
    ko: "서양 건축의 전통과 양식 다시 보기"
    vi: "Nhìn lại truyền thống và phong cách kiến trúc phương Tây"
    ms: "Menilai semula tradisi dan gaya seni bina Barat"
    id: "Meninjau ulang tradisi dan gaya arsitektur Barat"
    hi: "पश्चिमी वास्तुकला की परंपरा और शैली पर फिर से सोचना"
