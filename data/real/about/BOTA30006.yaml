code: BOTA30006
year: 2026
learn:
  en: "Field skills for botany: identifying Australian plants, collecting specimens, sampling and mapping vegetation."
  zh: "植物学野外技能：识别澳洲植物、采集标本、植被取样与制图。"
  zh-TW: "植物學野外技能：辨識澳洲植物、採集標本、植被取樣與製圖。"
  ja: "植物学の野外技術：オーストラリアの植物同定、標本採集、植生調査と地図作り。"
  ko: "식물학 현장 기술: 호주 식물 식별, 표본 채집, 식생 조사와 지도 제작."
  vi: "Kỹ năng thực địa thực vật học: nhận dạng cây Úc, thu mẫu, lấy mẫu và lập bản đồ thảm thực vật."
  ms: "Kemahiran lapangan botani: mengenal pasti tumbuhan Australia, mengumpul spesimen, persampelan dan pemetaan."
  id: "Keterampilan lapangan botani: mengenali tumbuhan Australia, mengumpulkan spesimen, sampling dan pemetaan vegetasi."
  hi: "वनस्पति विज्ञान के फ़ील्ड कौशल: ऑस्ट्रेलियाई पौधे पहचानना, नमूने इकट्ठा करना, सैंपलिंग और मैपिंग।"
outcomes:
  - en: "Identify and measure plants in the field"
    zh: "在野外识别并测量植物"
    zh-TW: "在野外辨識並測量植物"
    ja: "野外で植物を同定・計測する"
    ko: "현장에서 식물 식별·측정하기"
    vi: "Nhận dạng và đo đạc thực vật ngoài thực địa"
    ms: "Mengenal pasti dan mengukur tumbuhan di lapangan"
    id: "Mengenali dan mengukur tumbuhan di lapangan"
    hi: "फ़ील्ड में पौधों की पहचान और माप करना"
  - en: "Collect, preserve and catalogue specimens"
    zh: "采集、保存并编目标本"
    zh-TW: "採集、保存並編目標本"
    ja: "標本を採集・保存・目録化する"
    ko: "표본 채집·보존·목록화하기"
    vi: "Thu thập, bảo quản và lập danh mục mẫu vật"
    ms: "Mengumpul, mengawet dan mengkatalog spesimen"
    id: "Mengumpulkan, mengawetkan, dan mengkatalog spesimen"
    hi: "नमूने इकट्ठा, संरक्षित और सूचीबद्ध करना"
  - en: "Build a vegetation map"
    zh: "绘制植被图"
    zh-TW: "繪製植被圖"
    ja: "植生図を作る"
    ko: "식생 지도 만들기"
    vi: "Lập bản đồ thảm thực vật"
    ms: "Membina peta tumbuhan"
    id: "Membuat peta vegetasi"
    hi: "वनस्पति मानचित्र बनाना"
