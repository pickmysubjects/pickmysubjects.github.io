code: CRIM30010
year: 2026
learn:
  en: "How Victorian agencies and the state manage people at risk, in youth justice, family violence and more, with practitioner speakers."
  zh: "维州各机构与政府如何管理高风险人群，涉及青少年司法、家庭暴力等，并有一线从业者讲课。"
  zh-TW: "維州各機構與政府如何管理高風險人群，涉及青少年司法、家庭暴力等，並有第一線從業者講課。"
  ja: "ビクトリア州の機関と国家が、少年司法や家庭内暴力などで危険にさらされた人をどう扱うか。現場の講師も登壇。"
  ko: "빅토리아주 기관과 국가가 소년 사법, 가정폭력 등에서 위험군을 어떻게 관리하는지 현장 실무자 강연과 함께 배운다."
  vi: "Các cơ quan ở Victoria và nhà nước quản lý người có nguy cơ ra sao, như tư pháp vị thành niên, bạo lực gia đình, có diễn giả thực tế."
  ms: "Cara agensi Victoria dan negara mengurus orang berisiko, dalam keadilan belia, keganasan rumah tangga dan lain-lain, dengan penceramah pengamal."
  id: "Cara lembaga di Victoria dan negara menangani orang berisiko, seperti peradilan anak dan kekerasan keluarga, dengan pembicara praktisi."
  hi: "विक्टोरिया की एजेंसियाँ और राज्य जोखिम वाले लोगों को कैसे संभालते हैं, जैसे किशोर न्याय, घरेलू हिंसा, पेशेवर वक्ताओं के साथ।"
outcomes:
  - en: "Map how justice agencies work together"
    zh: "梳理司法相关机构如何协作"
    zh-TW: "梳理司法相關機構如何協作"
    ja: "司法関係機関の連携の仕組みを整理する"
    ko: "사법 관련 기관의 협력 방식 정리하기"
    vi: "Vẽ ra cách các cơ quan tư pháp phối hợp"
    ms: "Petakan cara agensi keadilan bekerjasama"
    id: "Memetakan cara lembaga peradilan bekerja sama"
    hi: "न्याय एजेंसियाँ मिलकर कैसे काम करती हैं, समझना"
  - en: "Link criminal justice to social justice"
    zh: "把刑事司法与社会公正联系起来"
    zh-TW: "把刑事司法與社會公正聯繫起來"
    ja: "刑事司法を社会正義と結びつける"
    ko: "형사 사법을 사회 정의와 연결하기"
    vi: "Liên hệ tư pháp hình sự với công bằng xã hội"
    ms: "Kaitkan keadilan jenayah dengan keadilan sosial"
    id: "Mengaitkan peradilan pidana dengan keadilan sosial"
    hi: "आपराधिक न्याय को सामाजिक न्याय से जोड़ना"
  - en: "Analyse a real case study in depth"
    zh: "深入分析一个真实案例"
    zh-TW: "深入分析一個真實案例"
    ja: "実際の事例を深く分析する"
    ko: "실제 사례 깊이 분석하기"
    vi: "Phân tích sâu một tình huống thực tế"
    ms: "Analisis satu kajian kes sebenar secara mendalam"
    id: "Menganalisis satu studi kasus nyata secara mendalam"
    hi: "किसी असली केस स्टडी का गहराई से विश्लेषण करना"
