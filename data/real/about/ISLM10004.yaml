code: ISLM10004
year: 2027
learn:
  en: "The Middle East beyond the stereotypes: its history, politics, conflicts and religion from several disciplines."
  zh: "跳出刻板印象看中东：从多个学科了解它的历史、政治、冲突和宗教。"
  zh-TW: "跳脫刻板印象看中東：從多個學科了解它的歷史、政治、衝突和宗教。"
  ja: "固定観念を超えて中東を学ぶ：複数の分野から歴史・政治・紛争・宗教を見る。"
  ko: "고정관념을 넘어 중동 이해하기: 여러 학문으로 역사, 정치, 분쟁, 종교를 살펴봄."
  vi: "Hiểu Trung Đông vượt qua định kiến: lịch sử, chính trị, xung đột và tôn giáo qua nhiều ngành học."
  ms: "Memahami Timur Tengah di luar stereotaip: sejarah, politik, konflik dan agama dari pelbagai bidang."
  id: "Memahami Timur Tengah di luar stereotip: sejarah, politik, konflik, dan agama dari berbagai disiplin."
  hi: "रूढ़ियों से परे मध्य पूर्व: कई विषयों के नज़रिए से इसका इतिहास, राजनीति, संघर्ष और धर्म।"
outcomes:
  - en: "Question how the Middle East is portrayed"
    zh: "辨析外界对中东的种种描绘"
    zh-TW: "辨析外界對中東的種種描繪"
    ja: "中東がどう描かれているかを問い直す"
    ko: "중동이 어떻게 그려지는지 비판적으로 따져보기"
    vi: "Đặt câu hỏi về cách Trung Đông được khắc họa"
    ms: "Menyoal cara Timur Tengah digambarkan"
    id: "Mempertanyakan cara Timur Tengah digambarkan"
    hi: "मध्य पूर्व को कैसे दिखाया जाता है, इस पर सवाल उठाना"
  - en: "See how religion ties in with politics and society there"
    zh: "理解宗教如何与当地政治和社会交织"
    zh-TW: "理解宗教如何與當地政治和社會交織"
    ja: "宗教が政治や社会とどう関わるかを理解する"
    ko: "종교가 정치·사회와 어떻게 얽히는지 이해하기"
    vi: "Hiểu tôn giáo gắn với chính trị và xã hội ra sao"
    ms: "Faham kaitan agama dengan politik dan masyarakat"
    id: "Memahami kaitan agama dengan politik dan masyarakat"
    hi: "समझना कि वहाँ धर्म राजनीति व समाज से कैसे जुड़ा है"
  - en: "Apply theory to real events and case studies"
    zh: "用理论框架分析真实事件和案例"
    zh-TW: "用理論框架分析真實事件和案例"
    ja: "理論を実際の出来事や事例に当てはめる"
    ko: "이론을 실제 사건과 사례에 적용하기"
    vi: "Áp dụng lý thuyết vào sự kiện và tình huống thực tế"
    ms: "Gunakan teori pada peristiwa dan kajian kes sebenar"
    id: "Menerapkan teori pada peristiwa dan studi kasus nyata"
    hi: "सिद्धांतों को वास्तविक घटनाओं और केस स्टडी पर लागू करना"
