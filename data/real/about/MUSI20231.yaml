code: MUSI20231
year: 2026
learn:
  en: "From the Wilin Centre: Indigenous music in Australia, its styles, contexts and histories, told by musicians. Not offered in 2026."
  zh: "威林中心开设：澳大利亚原住民音乐的风格、文化与历史，由音乐人亲述。2026年不开。"
  zh-TW: "威林中心開設：澳洲原住民音樂的風格、文化與歷史，由音樂人親述。2026年不開。"
  ja: "ウィリン・センター開講：オーストラリア先住民の音楽の様式・文化・歴史。2026年休講。"
  ko: "윌린 센터 개설: 호주 원주민 음악의 양식·문화·역사. 2026년 미개설."
  vi: "Từ Trung tâm Wilin: âm nhạc bản địa Úc, phong cách, văn hóa và lịch sử. Không mở 2026."
  ms: "Dari Pusat Wilin: muzik Orang Asli Australia, gaya, budaya dan sejarahnya. Tiada pada 2026."
  id: "Dari Wilin Centre: musik Pribumi Australia, gaya, budaya, dan sejarahnya. Tidak dibuka 2026."
  hi: "विलिन सेंटर से: ऑस्ट्रेलिया का आदिवासी संगीत, शैलियाँ, संस्कृति और इतिहास। 2026 में नहीं।"
outcomes:
  - en: "Describe styles of Indigenous music in Australia"
    zh: "描述澳大利亚原住民音乐的风格"
    zh-TW: "描述澳洲原住民音樂的風格"
    ja: "オーストラリア先住民音楽の様式を説明する"
    ko: "호주 원주민 음악 양식 설명하기"
    vi: "Mô tả phong cách âm nhạc bản địa Úc"
    ms: "Huraikan gaya muzik Orang Asli Australia"
    id: "Menjelaskan gaya musik Pribumi Australia"
    hi: "ऑस्ट्रेलियाई आदिवासी संगीत की शैलियाँ बताना"
  - en: "Write a listening guide to a piece of music"
    zh: "为一首作品写聆听导读"
    zh-TW: "為一首作品寫聆聽導讀"
    ja: "楽曲のリスニングガイドを書く"
    ko: "곡의 감상 가이드 작성하기"
    vi: "Viết hướng dẫn nghe cho một tác phẩm"
    ms: "Tulis panduan mendengar untuk satu karya"
    id: "Menulis panduan mendengar untuk satu karya"
    hi: "किसी रचना के लिए लिसनिंग गाइड लिखना"
  - en: "Reflect on your own learning about culture"
    zh: "反思自己对文化的学习"
    zh-TW: "反思自己對文化的學習"
    ja: "文化について学んだことを振り返る"
    ko: "문화 학습을 스스로 성찰하기"
    vi: "Suy ngẫm về việc học văn hóa của mình"
    ms: "Renungkan pembelajaran anda tentang budaya"
    id: "Merefleksikan pembelajaran tentang budaya"
    hi: "संस्कृति के बारे में अपनी सीख पर विचार करना"
