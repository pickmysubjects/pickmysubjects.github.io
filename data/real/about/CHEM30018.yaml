code: CHEM30018
year: 2026
learn:
  en: "How chemistry is used to design and deliver drugs, and to study and change how living systems work."
  zh: "用化学方法设计和递送药物，并研究和改变生物系统。"
  zh-TW: "用化學方法設計和遞送藥物，並研究和改變生物系統。"
  ja: "化学で薬を設計・送達し、生体システムの働きを調べて変える方法。"
  ko: "화학으로 약을 설계·전달하고, 생명 시스템의 작동을 연구하고 바꾸는 방법."
  vi: "Hóa học được dùng để thiết kế, đưa thuốc vào cơ thể, và nghiên cứu, thay đổi hệ sống ra sao."
  ms: "Cara kimia digunakan untuk reka dan hantar ubat, serta mengkaji dan mengubah sistem hidup."
  id: "Cara kimia dipakai untuk merancang dan menghantarkan obat, serta meneliti dan mengubah sistem hidup."
  hi: "दवाएँ डिज़ाइन करने व पहुँचाने, और जीवित सिस्टम को समझने व बदलने में केमिस्ट्री का उपयोग।"
outcomes:
  - en: "Describe tools used to design and test drugs"
    zh: "说明设计和评估药物的工具"
    zh-TW: "說明設計和評估藥物的工具"
    ja: "薬の設計と試験に使うツールを説明する"
    ko: "약 설계·시험에 쓰는 도구 설명하기"
    vi: "Mô tả công cụ thiết kế và thử nghiệm thuốc"
    ms: "Huraikan alat untuk reka dan uji ubat"
    id: "Menjelaskan alat untuk merancang dan menguji obat"
    hi: "दवाएँ डिज़ाइन व टेस्ट करने के टूल बताना"
  - en: "Identify what affects how well a treatment works"
    zh: "找出影响治疗效果的因素"
    zh-TW: "找出影響治療效果的因素"
    ja: "治療の効き目に影響する要因を見つける"
    ko: "치료 효과에 영향을 주는 요인 찾기"
    vi: "Xác định yếu tố ảnh hưởng hiệu quả điều trị"
    ms: "Kenal pasti faktor yang menjejaskan keberkesanan rawatan"
    id: "Mengenali faktor yang memengaruhi efektivitas pengobatan"
    hi: "इलाज के असर को प्रभावित करने वाली चीज़ें पहचानना"
  - en: "Interpret chemical biology lab data"
    zh: "解读化学生物学实验数据"
    zh-TW: "解讀化學生物學實驗資料"
    ja: "ケミカルバイオロジーの実験データを読み解く"
    ko: "화학생물학 실험 데이터 해석하기"
    vi: "Phân tích dữ liệu thí nghiệm hóa sinh học"
    ms: "Tafsir data makmal biologi kimia"
    id: "Menafsirkan data lab biologi kimia"
    hi: "केमिकल बायोलॉजी लैब डेटा समझना"
