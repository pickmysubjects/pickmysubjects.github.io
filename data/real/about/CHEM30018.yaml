code: CHEM30018
year: 2026
learn:
  en: "How chemistry is used to design and deliver drugs, and to study and change how living systems work."
  zh: "用化学方法设计和递送药物，并研究和改变生物系统。"
outcomes:
  - en: "Describe tools used to design and test drugs"
    zh: "说明设计和评估药物的工具"
  - en: "Identify what affects how well a treatment works"
    zh: "找出影响治疗效果的因素"
  - en: "Interpret chemical biology lab data"
    zh: "解读化学生物学实验数据"
