code: MAST90125
year: 2027
learn:
  en: "Bayesian inference from priors to posteriors, model choice, and putting it into practice with MCMC on real data."
  zh: "贝叶斯推断：先验到后验、模型选择，以及用MCMC分析真实数据。"
  zh-TW: "貝氏推論：先驗到後驗、模型選擇，以及用MCMC分析真實資料。"
  ja: "ベイズ推論：事前から事後へ、モデル選択、MCMCによる実データ分析。"
  ko: "베이즈 추론: 사전에서 사후로, 모형 선택, MCMC로 실제 자료 분석."
  vi: "Suy luận Bayes: từ tiên nghiệm đến hậu nghiệm, chọn mô hình, áp dụng MCMC trên dữ liệu thật."
  ms: "Inferens Bayes: dari prior ke posterior, pemilihan model, dan MCMC pada data sebenar."
  id: "Inferensi Bayes: dari prior ke posterior, pemilihan model, dan MCMC pada data nyata."
  hi: "बेज़ियन अनुमान: प्रायर से पोस्टीरियर, मॉडल चयन, और असली डेटा पर MCMC।"
outcomes:
  - en: "Set up priors and work out posterior results"
    zh: "设定先验并推导后验结果"
    zh-TW: "設定先驗並推導後驗結果"
    ja: "事前分布を設定し事後分布を求める"
    ko: "사전분포 설정과 사후 결과 도출하기"
    vi: "Đặt tiên nghiệm và tính kết quả hậu nghiệm"
    ms: "Menetapkan prior dan mendapatkan keputusan posterior"
    id: "Menetapkan prior dan menghitung posterior"
    hi: "प्रायर तय करना और पोस्टीरियर निकालना"
  - en: "Run MCMC to fit Bayesian models"
    zh: "运行MCMC拟合贝叶斯模型"
    zh-TW: "執行MCMC配適貝氏模型"
    ja: "MCMCでベイズモデルを当てはめる"
    ko: "MCMC로 베이즈 모형 적합하기"
    vi: "Chạy MCMC để khớp mô hình Bayes"
    ms: "Menjalankan MCMC untuk memadankan model Bayes"
    id: "Menjalankan MCMC untuk model Bayes"
    hi: "MCMC चलाकर बेज़ियन मॉडल फ़िट करना"
