code: GERM20011
year: 2026
learn:
  en: "A study trip to Berlin and two other German regions on German identity, life in East Germany and migration."
  zh: "前往柏林及德国另外两个地区的游学课：德国身份认同、东德生活和移民。"
  zh-TW: "前往柏林及德國另外兩個地區的遊學課：德國身分認同、東德生活和移民。"
  ja: "ベルリンとドイツの他の2地域を訪ねる研修。ドイツのアイデンティティ、東ドイツの暮らし、移民を学ぶ。"
  ko: "베를린과 독일의 다른 두 지역을 찾는 현지 연수. 독일 정체성, 동독의 삶, 이주를 다룬다."
  vi: "Chuyến học tập ở Berlin và hai vùng khác của Đức về bản sắc Đức, đời sống Đông Đức và di cư."
  ms: "Lawatan pembelajaran ke Berlin dan dua wilayah lain di Jerman tentang identiti Jerman, kehidupan Jerman Timur dan migrasi."
  id: "Perjalanan studi ke Berlin dan dua wilayah lain di Jerman tentang identitas Jerman, kehidupan Jerman Timur dan migrasi."
  hi: "बर्लिन और जर्मनी के दो अन्य क्षेत्रों की अध्ययन यात्रा: जर्मन पहचान, पूर्वी जर्मनी का जीवन और प्रवास।"
outcomes:
  - en: "Explain how the idea of Germany has changed"
    zh: "解释「德国」这一概念如何演变"
    zh-TW: "解釋「德國」這一概念如何演變"
    ja: "「ドイツ」という概念の移り変わりを説明する"
    ko: "'독일'이라는 개념의 변화 설명하기"
    vi: "Giải thích ý niệm về nước Đức đã thay đổi thế nào"
    ms: "Terangkan bagaimana idea tentang Jerman berubah"
    id: "Menjelaskan bagaimana gagasan tentang Jerman berubah"
    hi: "जर्मनी का विचार कैसे बदला, समझाना"
  - en: "Learn from on-site visits in Berlin and beyond"
    zh: "通过柏林等地的实地参观学习"
    zh-TW: "透過柏林等地的實地參訪學習"
    ja: "ベルリンなどでの現地見学から学ぶ"
    ko: "베를린 등 현장 방문을 통해 배우기"
    vi: "Học qua các chuyến tham quan ở Berlin và nơi khác"
    ms: "Belajar melalui lawatan tapak di Berlin dan lain-lain"
    id: "Belajar dari kunjungan langsung di Berlin dan sekitarnya"
    hi: "बर्लिन और आसपास के स्थलों पर जाकर सीखना"
  - en: "Read German history through film, music and books"
    zh: "通过电影、音乐和书籍理解德国历史"
    zh-TW: "透過電影、音樂和書籍理解德國歷史"
    ja: "映画、音楽、本を通してドイツ史を読み解く"
    ko: "영화, 음악, 책으로 독일 역사 읽기"
    vi: "Hiểu lịch sử Đức qua phim, nhạc và sách"
    ms: "Fahami sejarah Jerman melalui filem, muzik dan buku"
    id: "Memahami sejarah Jerman lewat film, musik dan buku"
    hi: "फ़िल्म, संगीत और किताबों से जर्मन इतिहास समझना"
