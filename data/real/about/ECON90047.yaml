code: ECON90047
year: 2027
learn:
  en: "Models macroeconomists use: long-run growth, flexible and sticky prices, open economies and policy making."
  zh: "宏观经济学家常用的模型：长期增长、弹性与粘性价格、开放经济和政策制定。"
  zh-TW: "總體經濟學家常用的模型：長期成長、彈性與僵固價格、開放經濟與政策制定。"
  ja: "マクロ経済学者が使うモデル：長期成長、伸縮価格と硬直価格、開放経済、政策決定。"
  ko: "거시경제학자가 쓰는 모형: 장기 성장, 신축·경직 가격, 개방경제, 정책 결정."
  vi: "Mô hình nhà kinh tế vĩ mô dùng: tăng trưởng dài hạn, giá linh hoạt và cứng nhắc, kinh tế mở, hoạch định chính sách."
  ms: "Model ahli makroekonomi: pertumbuhan jangka panjang, harga fleksibel dan tegar, ekonomi terbuka, penggubalan dasar."
  id: "Model para ekonom makro: pertumbuhan jangka panjang, harga fleksibel dan kaku, ekonomi terbuka, pembuatan kebijakan."
  hi: "समष्टि अर्थशास्त्रियों के मॉडल: दीर्घकालिक वृद्धि, लचीली और स्थिर कीमतें, खुली अर्थव्यवस्था, नीति निर्माण।"
outcomes:
  - en: "Use AD-AS and IS-LM models to explain issues"
    zh: "用AD-AS和IS-LM模型解释经济问题"
    zh-TW: "用AD-AS與IS-LM模型解釋經濟問題"
    ja: "AD-AS・IS-LMモデルで経済問題を説明する"
    ko: "AD-AS, IS-LM 모형으로 경제 문제 설명하기"
    vi: "Dùng mô hình AD-AS và IS-LM để giải thích vấn đề"
    ms: "Menggunakan model AD-AS dan IS-LM untuk menerangkan isu"
    id: "Memakai model AD-AS dan IS-LM untuk menjelaskan isu"
    hi: "AD-AS और IS-LM मॉडल से मुद्दे समझाना"
  - en: "Explain the role of expectations"
    zh: "解释预期在宏观经济中的作用"
    zh-TW: "解釋預期在總體經濟中的角色"
    ja: "期待の役割を説明する"
    ko: "기대의 역할 설명하기"
    vi: "Giải thích vai trò của kỳ vọng"
    ms: "Menerangkan peranan jangkaan"
    id: "Menjelaskan peran ekspektasi"
    hi: "अपेक्षाओं की भूमिका समझाना"
