code: ECON30008
year: 2026
learn:
  en: "How economic ideas developed, from the classical economists through the neoclassicals to Keynes."
  zh: "经济思想如何发展：从古典经济学家到新古典学派，再到凯恩斯。"
  zh-TW: "經濟思想如何發展：從古典經濟學家到新古典學派，再到凱因斯。"
  ja: "古典派から新古典派、ケインズまで、経済学の考え方はどう発展してきたか。"
  ko: "고전학파에서 신고전학파, 케인스까지 경제사상의 발전."
  vi: "Tư tưởng kinh tế phát triển ra sao, từ trường phái cổ điển, tân cổ điển đến Keynes."
  ms: "Perkembangan idea ekonomi, daripada ahli ekonomi klasik dan neoklasik hingga Keynes."
  id: "Perkembangan gagasan ekonomi, dari ekonom klasik dan neoklasik hingga Keynes."
  hi: "आर्थिक विचार कैसे विकसित हुए, क्लासिकल और नियोक्लासिकल अर्थशास्त्रियों से कीन्स तक।"
outcomes:
  - en: "See how economists' concerns changed over time"
    zh: "了解经济学家关注的问题如何随时代改变"
    zh-TW: "了解經濟學家關注的問題如何隨時代改變"
    ja: "経済学者の関心が時代とともにどう変わったか知る"
    ko: "경제학자의 관심사가 시대에 따라 바뀐 과정 이해"
    vi: "Thấy mối quan tâm của các nhà kinh tế thay đổi theo thời gian"
    ms: "Lihat cara tumpuan ahli ekonomi berubah mengikut masa"
    id: "Melihat bagaimana perhatian para ekonom berubah dari waktu ke waktu"
    hi: "समय के साथ अर्थशास्त्रियों की चिंताएँ कैसे बदलीं, समझना"
  - en: "Compare different schools of economic thought"
    zh: "比较不同的经济学流派"
    zh-TW: "比較不同的經濟學派"
    ja: "異なる経済学派を比べる"
    ko: "서로 다른 경제학파 비교"
    vi: "So sánh các trường phái kinh tế khác nhau"
    ms: "Banding aliran pemikiran ekonomi yang berbeza"
    id: "Membandingkan berbagai aliran pemikiran ekonomi"
    hi: "अर्थशास्त्र की अलग-अलग विचारधाराओं की तुलना"
  - en: "Read original works by major economists"
    zh: "阅读重要经济学家的原著"
    zh-TW: "閱讀重要經濟學家的原著"
    ja: "主要な経済学者の原典を読む"
    ko: "주요 경제학자의 원전 읽기"
    vi: "Đọc tác phẩm gốc của các nhà kinh tế lớn"
    ms: "Baca karya asal ahli ekonomi utama"
    id: "Membaca karya asli para ekonom besar"
    hi: "बड़े अर्थशास्त्रियों की मूल रचनाएँ पढ़ना"
