code: FLTV20022
year: 2026
learn:
  en: "An online look at the money side of screen production: budgets, financing and the accounting reports a production needs."
  zh: "网课：影视制作的财务面，包括预算、融资和制作所需的会计报告。"
  zh-TW: "線上課：影視製作的財務面，包括預算、融資與製作所需的會計報告。"
  ja: "オンライン科目。映像制作のお金の面：予算、資金調達、必要な会計報告。"
  ko: "온라인 과목. 영상 제작의 돈 문제: 예산, 자금 조달, 필요한 회계 보고."
  vi: "Môn trực tuyến về tiền trong sản xuất phim: ngân sách, tài trợ và báo cáo kế toán."
  ms: "Subjek dalam talian tentang wang dalam produksi skrin: belanjawan, pembiayaan, laporan."
  id: "Mata kuliah daring tentang uang dalam produksi layar: anggaran, pendanaan, laporan."
  hi: "ऑनलाइन विषय: स्क्रीन प्रोडक्शन का पैसा, बजट, फ़ंडिंग और अकाउंटिंग रिपोर्ट।"
outcomes:
  - en: "Build a budget for a screen project"
    zh: "为影视项目编制预算"
    zh-TW: "為影視專案編製預算"
    ja: "映像企画の予算を組む"
    ko: "영상 프로젝트 예산 짜기"
    vi: "Lập ngân sách cho dự án phim"
    ms: "Sediakan belanjawan projek skrin"
    id: "Menyusun anggaran proyek layar"
    hi: "स्क्रीन प्रोजेक्ट का बजट बनाना"
  - en: "Explain how films are financed"
    zh: "说明电影如何融资"
    zh-TW: "說明電影如何融資"
    ja: "映画の資金調達を説明する"
    ko: "영화 자금 조달 방식 설명하기"
    vi: "Giải thích cách phim được tài trợ"
    ms: "Jelaskan cara filem dibiayai"
    id: "Menjelaskan cara film didanai"
    hi: "फ़िल्मों की फ़ंडिंग कैसे होती है"
  - en: "Prepare production accounting reports"
    zh: "准备制作会计报告"
    zh-TW: "準備製作會計報告"
    ja: "制作の会計報告を作る"
    ko: "제작 회계 보고서 작성하기"
    vi: "Lập báo cáo kế toán sản xuất"
    ms: "Sediakan laporan perakaunan produksi"
    id: "Menyiapkan laporan akuntansi produksi"
    hi: "प्रोडक्शन अकाउंटिंग रिपोर्ट तैयार करना"
