code: AIND10003
year: 2026
learn:
  en: "A 5-day on-Country intensive with First Nations teachers: Indigenous art and cultural practice, then your own creative project."
  zh: "与原住民教师一起的 5 天在地密集课：原住民艺术与文化实践，之后完成自己的创作项目。"
  zh-TW: "與原住民教師一起的 5 天在地密集課：原住民藝術與文化實踐，之後完成自己的創作專案。"
  ja: "先住民の講師と過ごす5日間の現地集中授業。先住民の芸術と文化実践を学び、自分の創作課題に取り組む。"
  ko: "원주민 강사와 함께하는 5일간의 현지 집중 수업. 원주민 예술과 문화 실천을 배우고 자신의 창작 과제를 한다."
  vi: "Khóa 5 ngày tại thực địa cùng giảng viên bản địa: nghệ thuật, văn hóa bản địa, rồi làm dự án sáng tạo của riêng bạn."
  ms: "Intensif 5 hari di tanah adat bersama pengajar Orang Asli: seni dan amalan budaya Orang Asli, kemudian projek kreatif sendiri."
  id: "Intensif 5 hari di tanah adat bersama pengajar Pribumi: seni dan praktik budaya Pribumi, lalu proyek kreatif sendiri."
  hi: "फ़र्स्ट नेशंस शिक्षकों के साथ 5 दिन का ऑन-कंट्री इंटेंसिव: आदिवासी कला व सांस्कृतिक अभ्यास, फिर अपना रचनात्मक प्रोजेक्ट।"
outcomes:
  - en: "Take part respectfully in Indigenous cultural practice"
    zh: "以尊重的态度参与原住民文化实践"
    zh-TW: "以尊重的態度參與原住民文化實踐"
    ja: "敬意を持って先住民の文化実践に参加する"
    ko: "존중하는 태도로 원주민 문화 실천에 참여하기"
    vi: "Tham gia thực hành văn hóa bản địa một cách tôn trọng"
    ms: "Sertai amalan budaya Orang Asli dengan hormat"
    id: "Ikut serta dalam praktik budaya Pribumi dengan hormat"
    hi: "सम्मान के साथ आदिवासी सांस्कृतिक अभ्यास में भाग लेना"
  - en: "Reflect on your own position as a learner"
    zh: "反思自己作为学习者的立场"
    zh-TW: "反思自己作為學習者的立場"
    ja: "学ぶ者としての自分の立場を振り返る"
    ko: "배우는 사람으로서 자신의 위치 돌아보기"
    vi: "Suy ngẫm về vị trí của bản thân khi học"
    ms: "Renungkan kedudukan diri sebagai pelajar"
    id: "Merefleksikan posisi diri sebagai pembelajar"
    hi: "एक सीखने वाले के रूप में अपनी स्थिति पर विचार करना"
  - en: "Create an art project shaped by what you learned"
    zh: "根据所学完成一件艺术创作"
    zh-TW: "根據所學完成一件藝術創作"
    ja: "学んだことをもとに作品を制作する"
    ko: "배운 것을 바탕으로 작품 만들기"
    vi: "Tạo một dự án nghệ thuật từ những gì đã học"
    ms: "Hasilkan projek seni berdasarkan apa yang dipelajari"
    id: "Membuat proyek seni dari apa yang dipelajari"
    hi: "सीखी बातों से एक कला प्रोजेक्ट बनाना"
