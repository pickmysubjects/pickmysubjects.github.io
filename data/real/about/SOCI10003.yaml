code: SOCI10003
year: 2026
learn:
  en: "A sociology intro to inequality: how class, gender, race and sexuality create and keep social gaps."
  zh: "社会学入门看不平等：阶层、性别、种族和性如何制造并维持社会差距。"
  zh-TW: "社會學入門看不平等：階級、性別、種族和性如何製造並維持社會差距。"
  ja: "社会学から不平等を学ぶ入門。階級・ジェンダー・人種・セクシュアリティが格差をどう生み、保つか。"
  ko: "사회학으로 보는 불평등 입문, 계층·젠더·인종·섹슈얼리티가 사회적 격차를 어떻게 만들고 유지하는지 배운다."
  vi: "Nhập môn xã hội học về bất bình đẳng: giai cấp, giới, chủng tộc và tính dục tạo ra và duy trì khoảng cách xã hội ra sao."
  ms: "Pengenalan sosiologi tentang ketaksamaan: cara kelas, gender, kaum dan seksualiti mewujud dan mengekalkan jurang sosial."
  id: "Pengantar sosiologi tentang ketimpangan: cara kelas, gender, ras, dan seksualitas menciptakan dan mempertahankan kesenjangan."
  hi: "असमानता पर समाजशास्त्र का परिचय: वर्ग, जेंडर, नस्ल और यौनिकता सामाजिक खाई कैसे बनाते और बनाए रखते हैं।"
outcomes:
  - en: "Explain today's inequalities from a sociology view"
    zh: "从社会学角度解释当今的不平等"
    zh-TW: "從社會學角度解釋當今的不平等"
    ja: "今の不平等を社会学の視点で説明する"
    ko: "오늘날의 불평등을 사회학적으로 설명하기"
    vi: "Giải thích bất bình đẳng hiện nay theo góc nhìn xã hội học"
    ms: "Terangkan ketaksamaan hari ini dari sudut sosiologi"
    id: "Menjelaskan ketimpangan masa kini dari sudut sosiologi"
    hi: "आज की असमानताओं को समाजशास्त्र की नज़र से समझाना"
  - en: "Describe the different dimensions of inequality"
    zh: "描述不平等的不同维度"
    zh-TW: "描述不平等的不同面向"
    ja: "不平等のさまざまな側面を説明する"
    ko: "불평등의 여러 차원 설명하기"
    vi: "Mô tả các chiều cạnh khác nhau của bất bình đẳng"
    ms: "Huraikan pelbagai dimensi ketaksamaan"
    id: "Menguraikan berbagai dimensi ketimpangan"
    hi: "असमानता के अलग-अलग आयामों का वर्णन करना"
  - en: "Use theory and evidence to analyse its causes"
    zh: "运用理论和证据分析其成因"
    zh-TW: "運用理論和證據分析其成因"
    ja: "理論と証拠を使ってその原因を分析する"
    ko: "이론과 근거로 그 원인 분석하기"
    vi: "Dùng lý thuyết và bằng chứng để phân tích nguyên nhân"
    ms: "Guna teori dan bukti untuk menganalisis puncanya"
    id: "Memakai teori dan bukti untuk menganalisis penyebabnya"
    hi: "सिद्धांत और सबूतों से इसके कारणों का विश्लेषण करना"
