code: CVEN90018
year: 2027
learn:
  en: "Finite element modelling and dynamic analysis of structures, by hand, in spreadsheets and with commercial software."
  zh: "结构的有限元建模和动力分析，包括手算、电子表格和商业软件。"
  zh-TW: "結構的有限元素建模與動力分析，包括手算、試算表與商業軟體。"
  ja: "手計算・表計算ソフト・商用ソフトによる構造物の有限要素モデル化と動的解析。"
  ko: "손계산·스프레드시트·상용 소프트웨어로 하는 구조물 유한요소 모델링과 동적 해석."
  vi: "Mô hình phần tử hữu hạn và phân tích động lực kết cấu bằng tay, bảng tính và phần mềm thương mại."
  ms: "Pemodelan unsur terhingga dan analisis dinamik struktur secara manual, dengan hamparan dan perisian komersial."
  id: "Pemodelan elemen hingga dan analisis dinamis struktur secara manual, dengan spreadsheet dan perangkat lunak komersial."
  hi: "हाथ से, स्प्रेडशीट में और व्यावसायिक सॉफ़्टवेयर से संरचनाओं का फ़ाइनाइट एलिमेंट मॉडलिंग और डायनामिक विश्लेषण।"
outcomes:
  - en: "Model how single and multi-degree-of-freedom systems respond to vibration"
    zh: "建模单自由度和多自由度体系的振动响应"
    zh-TW: "建立單自由度與多自由度系統的振動反應模型"
    ja: "1自由度・多自由度系の振動応答をモデル化する"
    ko: "단자유도·다자유도 계의 진동 응답 모델링하기"
    vi: "Mô hình phản ứng dao động của hệ một và nhiều bậc tự do"
    ms: "Memodelkan tindak balas getaran sistem satu dan berbilang darjah kebebasan"
    id: "Memodelkan respons getaran sistem satu dan banyak derajat kebebasan"
    hi: "एकल और बहु-स्वतंत्रता प्रणालियों की कंपन प्रतिक्रिया का मॉडल बनाना"
  - en: "Build response spectra with time-step methods in spreadsheets"
    zh: "在电子表格中用时间步方法求反应谱"
    zh-TW: "在試算表中以時間步法求反應譜"
    ja: "表計算で時間刻み法を使い応答スペクトルを作る"
    ko: "스프레드시트에서 시간 단계법으로 응답 스펙트럼 만들기"
    vi: "Lập phổ phản ứng bằng phương pháp bước thời gian trên bảng tính"
    ms: "Membina spektrum tindak balas dengan kaedah langkah masa dalam hamparan"
    id: "Menyusun spektrum respons dengan metode langkah waktu di spreadsheet"
    hi: "स्प्रेडशीट में टाइम-स्टेप विधियों से रिस्पॉन्स स्पेक्ट्रा बनाना"
  - en: "Check computer results with hand calculations"
    zh: "用手算校核计算机结果"
    zh-TW: "以手算校核電腦結果"
    ja: "コンピュータの結果を手計算で確認する"
    ko: "컴퓨터 결과를 손계산으로 검증하기"
    vi: "Kiểm tra kết quả máy tính bằng tính tay"
    ms: "Menyemak keputusan komputer dengan pengiraan manual"
    id: "Memeriksa hasil komputer dengan perhitungan manual"
    hi: "कंप्यूटर परिणामों को हाथ की गणना से जाँचना"
