code: PATH30003
year: 2026
learn:
  en: "Recent research on major diseases and their cell, molecular and genetic causes."
  zh: "重大疾病的最新研究，以及它们在细胞和基因层面的成因。"
  zh-TW: "重大疾病的最新研究，以及它們在細胞和基因層面的成因。"
  ja: "主な病気に関する最新研究と、その細胞・分子・遺伝的な原因。"
  ko: "주요 질병에 대한 최신 연구와 그 세포·분자·유전적 원인."
  vi: "Nghiên cứu mới về các bệnh lớn và nguyên nhân ở cấp tế bào, phân tử, di truyền."
  ms: "Kajian terkini tentang penyakit utama dan punca sel, molekul serta genetiknya."
  id: "Riset terbaru tentang penyakit utama dan penyebab sel, molekuler, serta genetiknya."
  hi: "बड़ी बीमारियों पर नई रिसर्च और उनके सेल, मॉलिक्यूलर व जेनेटिक कारण।"
outcomes:
  - en: "Explain how new discoveries improve diagnosis and treatment"
    zh: "说明新发现怎么改进诊断和治疗"
    zh-TW: "說明新發現怎麼改善診斷和治療"
    ja: "新しい発見が診断と治療をどう改善するか説明する"
    ko: "새로운 발견이 진단과 치료를 어떻게 개선하는지 설명"
    vi: "Giải thích phát hiện mới giúp chẩn đoán và điều trị ra sao"
    ms: "Terangkan cara penemuan baharu memperbaik diagnosis dan rawatan"
    id: "Menjelaskan cara temuan baru memperbaiki diagnosis dan pengobatan"
    hi: "समझाना कि नई खोजें निदान और इलाज कैसे बेहतर करती हैं"
  - en: "Compare what different diseases have in common"
    zh: "比较不同疾病的共同机制"
    zh-TW: "比較不同疾病的共同機制"
    ja: "異なる病気の共通点を比較する"
    ko: "여러 질병의 공통점 비교"
    vi: "So sánh điểm chung giữa các bệnh khác nhau"
    ms: "Bandingkan persamaan antara penyakit berbeza"
    id: "Membandingkan kesamaan berbagai penyakit"
    hi: "अलग-अलग बीमारियों में समानताएँ तुलना करना"
  - en: "Propose new hypotheses from the latest data"
    zh: "根据最新数据提出新假设"
    zh-TW: "根據最新數據提出新假設"
    ja: "最新データから新しい仮説を立てる"
    ko: "최신 데이터로 새로운 가설 제시"
    vi: "Đưa ra giả thuyết mới từ dữ liệu mới nhất"
    ms: "Cadangkan hipotesis baharu daripada data terkini"
    id: "Mengajukan hipotesis baru dari data terbaru"
    hi: "नए डेटा से नई परिकल्पनाएँ सुझाना"
