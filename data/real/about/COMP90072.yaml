code: COMP90072
year: 2027
learn:
  en: "Building numerical simulation code in C, C++ or Fortran, then documenting, testing, optimising and parallelising it."
  zh: "用C、C++或Fortran编写数值模拟程序，并做文档、测试、优化和并行化。"
  zh-TW: "用C、C++或Fortran撰寫數值模擬程式，並做文件、測試、最佳化與平行化。"
  ja: "C・C++・Fortranで数値シミュレーションを作り、文書化・検証・最適化・並列化する。"
  ko: "C, C++, Fortran으로 수치 시뮬레이션을 만들고 문서화·검증·최적화·병렬화한다."
  vi: "Viết mã mô phỏng số bằng C, C++ hoặc Fortran, rồi viết tài liệu, kiểm thử, tối ưu và song song hóa."
  ms: "Membina kod simulasi berangka dalam C, C++ atau Fortran, kemudian mendokumen, menguji, mengoptimum dan menyelarikannya."
  id: "Membuat kode simulasi numerik dengan C, C++ atau Fortran, lalu mendokumentasi, menguji, mengoptimalkan, dan memparalelkannya."
  hi: "C, C++ या Fortran में संख्यात्मक सिमुलेशन कोड बनाना, फिर उसका दस्तावेज़, परीक्षण, अनुकूलन और समानांतरण।"
outcomes:
  - en: "Turn a research problem into steps a computer can run"
    zh: "把研究问题转化为计算机可执行的步骤"
    zh-TW: "把研究問題轉化為電腦可執行的步驟"
    ja: "研究課題をコンピュータで実行できる手順にする"
    ko: "연구 문제를 컴퓨터가 실행할 단계로 바꾸기"
    vi: "Biến bài toán nghiên cứu thành các bước máy tính chạy được"
    ms: "Menukar masalah penyelidikan kepada langkah yang boleh dilaksana komputer"
    id: "Mengubah masalah riset menjadi langkah yang bisa dijalankan komputer"
    hi: "शोध समस्या को कंप्यूटर के चरणों में बदलना"
  - en: "Profile, optimise and parallelise code with OpenMPI"
    zh: "分析性能、优化代码并用OpenMPI并行化"
    zh-TW: "分析效能、最佳化程式並用OpenMPI平行化"
    ja: "性能を測り、最適化し、OpenMPIで並列化する"
    ko: "성능 분석, 최적화, OpenMPI 병렬화하기"
    vi: "Đo hiệu năng, tối ưu và song song hóa bằng OpenMPI"
    ms: "Memprofil, mengoptimum dan menyelarikan kod dengan OpenMPI"
    id: "Memprofil, mengoptimalkan, dan memparalelkan kode dengan OpenMPI"
    hi: "कोड का प्रोफ़ाइल, अनुकूलन और OpenMPI से समानांतरण"
  - en: "Document code and its limits in LaTeX"
    zh: "用LaTeX记录代码及其局限"
    zh-TW: "用LaTeX記錄程式及其限制"
    ja: "LaTeXでコードとその限界を文書化する"
    ko: "LaTeX로 코드와 한계를 문서화하기"
    vi: "Viết tài liệu mã và giới hạn của nó bằng LaTeX"
    ms: "Mendokumenkan kod dan hadnya dalam LaTeX"
    id: "Mendokumentasikan kode dan batasannya dengan LaTeX"
    hi: "LaTeX में कोड और उसकी सीमाएँ लिखना"
