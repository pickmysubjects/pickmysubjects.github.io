code: GEND20001
year: 2026
learn:
  en: "Feminist and queer theories of power, and how gender and sexuality connect with race, class and place to create inequality."
  zh: "女性主义与酷儿权力理论，以及性别、性如何与种族、阶级和地域交织产生不平等。"
  zh-TW: "女性主義與酷兒權力理論，以及性別、性如何與種族、階級和地域交織產生不平等。"
  ja: "フェミニズムとクィアの権力理論、そしてジェンダーと性が人種・階級・地域と絡み格差を生む仕組みを学ぶ。"
  ko: "페미니즘·퀴어 권력 이론, 그리고 젠더와 섹슈얼리티가 인종, 계급, 지역과 얽혀 불평등을 만드는 방식을 배운다."
  vi: "Các lý thuyết nữ quyền và queer về quyền lực, và cách giới, tính dục gắn với chủng tộc, giai cấp, nơi chốn tạo ra bất bình đẳng."
  ms: "Teori kuasa feminis dan queer, serta cara gender dan seksualiti berkait dengan kaum, kelas dan tempat untuk mencipta ketaksamaan."
  id: "Teori kekuasaan feminis dan queer, serta cara gender dan seksualitas terkait ras, kelas, dan tempat menciptakan ketimpangan."
  hi: "सत्ता के नारीवादी और क्वीयर सिद्धांत, और जेंडर व यौनिकता कैसे नस्ल, वर्ग और स्थान से जुड़कर असमानता बनाते हैं।"
outcomes:
  - en: "Explain major feminist and queer theories of power"
    zh: "解释主要的女性主义和酷儿权力理论"
    zh-TW: "解釋主要的女性主義和酷兒權力理論"
    ja: "主なフェミニズム・クィアの権力理論を説明する"
    ko: "주요 페미니즘·퀴어 권력 이론 설명하기"
    vi: "Giải thích các lý thuyết quyền lực nữ quyền và queer chính"
    ms: "Terangkan teori kuasa feminis dan queer utama"
    id: "Menjelaskan teori kekuasaan feminis dan queer utama"
    hi: "मुख्य नारीवादी और क्वीयर सत्ता सिद्धांत समझाना"
  - en: "Analyse how gender links with race and class"
    zh: "分析性别如何与种族和阶级交织"
    zh-TW: "分析性別如何與種族和階級交織"
    ja: "ジェンダーと人種・階級の関係を分析する"
    ko: "젠더가 인종·계급과 얽히는 방식 분석하기"
    vi: "Phân tích mối liên hệ giữa giới với chủng tộc và giai cấp"
    ms: "Analisis kaitan gender dengan kaum dan kelas"
    id: "Menganalisis kaitan gender dengan ras dan kelas"
    hi: "जेंडर का नस्ल और वर्ग से संबंध विश्लेषित करना"
  - en: "Apply theory to real case studies"
    zh: "把理论用于真实案例"
    zh-TW: "把理論用於真實案例"
    ja: "理論を実際の事例に当てはめる"
    ko: "이론을 실제 사례에 적용하기"
    vi: "Áp dụng lý thuyết vào các ca thực tế"
    ms: "Gunakan teori pada kajian kes sebenar"
    id: "Menerapkan teori pada studi kasus nyata"
    hi: "सिद्धांत को वास्तविक केस स्टडी पर लागू करना"
