code: FLTV20013
year: 2026
learn:
  en: "Sound, music and interactivity in animation: design soundscapes and scores, and make interactive and generative animated works."
  zh: "动画中的声音、音乐与互动：设计音景与配乐，制作互动及生成式动画。"
  zh-TW: "動畫中的聲音、音樂與互動：設計音景與配樂，製作互動及生成式動畫。"
  ja: "アニメの音・音楽・インタラクション：音風景と音楽を設計し、インタラクティブ・生成的な作品を作る。"
  ko: "애니메이션의 소리, 음악, 상호작용: 사운드스케이프와 음악을 만들고 인터랙티브·생성형 작품을 만든다."
  vi: "Âm thanh, âm nhạc và tương tác trong hoạt hình: thiết kế âm cảnh, nhạc nền và tác phẩm tương tác, sinh tạo."
  ms: "Bunyi, muzik dan interaktiviti dalam animasi: reka bunyi latar, skor dan karya interaktif serta generatif."
  id: "Suara, musik dan interaktivitas animasi: merancang soundscape, skor dan karya interaktif serta generatif."
  hi: "एनिमेशन में ध्वनि, संगीत और इंटरैक्टिविटी: साउंडस्केप व स्कोर डिज़ाइन, इंटरैक्टिव और जनरेटिव एनिमेशन।"
outcomes:
  - en: "Design sound and music for an animated work"
    zh: "为动画作品设计声音与音乐"
    zh-TW: "為動畫作品設計聲音與音樂"
    ja: "アニメ作品の音と音楽を作る"
    ko: "애니메이션의 소리와 음악 디자인하기"
    vi: "Thiết kế âm thanh, âm nhạc cho tác phẩm hoạt hình"
    ms: "Reka bunyi dan muzik untuk karya animasi"
    id: "Merancang suara dan musik untuk animasi"
    hi: "एनिमेटेड काम के लिए ध्वनि और संगीत डिज़ाइन"
  - en: "Make interactive and generative animation"
    zh: "制作互动及生成式动画"
    zh-TW: "製作互動及生成式動畫"
    ja: "インタラクティブ・生成的なアニメを作る"
    ko: "인터랙티브·생성형 애니메이션 만들기"
    vi: "Làm hoạt hình tương tác và sinh tạo"
    ms: "Hasilkan animasi interaktif dan generatif"
    id: "Membuat animasi interaktif dan generatif"
    hi: "इंटरैक्टिव और जनरेटिव एनिमेशन बनाना"
  - en: "Give and take peer critique on works in progress"
    zh: "对进行中的作品互相点评"
    zh-TW: "對進行中的作品互相講評"
    ja: "制作中の作品を相互に講評する"
    ko: "진행 중 작품에 서로 피드백하기"
    vi: "Góp ý qua lại về tác phẩm đang làm"
    ms: "Beri dan terima kritikan rakan"
    id: "Saling memberi kritik pada karya"
    hi: "प्रगति-कार्य पर साथियों से समीक्षा देना-लेना"
