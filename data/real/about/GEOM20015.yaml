code: GEOM20015
year: 2026
learn:
  en: "How sensors and surveys capture the physical world and turn it into digital models and digital twins."
  zh: "传感器和测量如何把现实世界变成数字模型和数字孪生。"
  zh-TW: "感測器與測量如何把真實世界變成數位模型和數位孿生。"
  ja: "センサーや測量で現実世界をデジタルモデルやデジタルツインにする方法。"
  ko: "센서와 측량으로 현실 세계를 디지털 모델과 디지털 트윈으로 만드는 법."
  vi: "Cảm biến và đo đạc biến thế giới thực thành mô hình số và bản sao số."
  ms: "Cara penderia dan ukuran menukar dunia fizikal kepada model digital dan kembar digital."
  id: "Cara sensor dan pengukuran mengubah dunia fisik menjadi model digital dan digital twin."
  hi: "सेंसर और माप से असली दुनिया को डिजिटल मॉडल और डिजिटल ट्विन में बदलना।"
outcomes:
  - en: "Plan and take field measurements in a team"
    zh: "团队规划并完成野外测量"
    zh-TW: "團隊規劃並完成野外測量"
    ja: "チームで現地測量を計画・実施する"
    ko: "팀으로 현장 측정 계획하고 수행하기"
    vi: "Lên kế hoạch và đo đạc thực địa theo nhóm"
    ms: "Merancang dan membuat pengukuran lapangan berkumpulan"
    id: "Merencanakan dan melakukan pengukuran lapangan dalam tim"
    hi: "टीम में फ़ील्ड माप की योजना बनाना और करना"
  - en: "Process measurements into accurate maps and models"
    zh: "把测量数据处理成精确地图和模型"
    zh-TW: "把測量資料處理成精確地圖和模型"
    ja: "測定値を正確な地図やモデルに処理する"
    ko: "측정값을 정확한 지도와 모델로 처리하기"
    vi: "Xử lý số đo thành bản đồ và mô hình chính xác"
    ms: "Memproses ukuran menjadi peta dan model tepat"
    id: "Mengolah hasil ukur menjadi peta dan model akurat"
    hi: "माप को सटीक नक्शों और मॉडलों में बदलना"
