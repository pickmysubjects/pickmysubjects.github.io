code: MUSI20234
year: 2026
learn:
  en: "A practical first course in improvising, solo and in groups, for any instrument or voice, including playing from graphic scores."
  zh: "即兴入门实践课：独奏与合奏即兴，适合任何乐器或声乐，含图形乐谱演奏。"
  zh-TW: "即興入門實踐課：獨奏與合奏即興，適合任何樂器或聲樂，含圖形樂譜演奏。"
  ja: "即興演奏の実践入門。ソロとグループ、全楽器・声楽向け。図形楽譜も。"
  ko: "즉흥 연주 실기 입문. 솔로·그룹, 모든 악기·성악. 그래픽 악보 포함."
  vi: "Nhập môn ngẫu hứng thực hành, solo và nhóm, cho mọi nhạc cụ và giọng hát, kể cả bản nhạc đồ họa."
  ms: "Kursus praktikal pertama improvisasi, solo dan berkumpulan, untuk semua alat dan vokal."
  id: "Kuliah praktik improvisasi pertama, solo dan grup, untuk semua instrumen dan vokal."
  hi: "इम्प्रोवाइज़ेशन का पहला व्यावहारिक कोर्स: सोलो और समूह, हर वाद्य और आवाज़ के लिए।"
outcomes:
  - en: "Improvise on your own and with others"
    zh: "独自与合作即兴演奏"
    zh-TW: "獨自與合作即興演奏"
    ja: "一人でも仲間とも即興する"
    ko: "혼자 또는 함께 즉흥 연주하기"
    vi: "Ngẫu hứng một mình và cùng người khác"
    ms: "Berimprovisasi sendiri dan bersama"
    id: "Berimprovisasi sendiri dan bersama"
    hi: "अकेले और दूसरों के साथ इम्प्रोवाइज़ करना"
  - en: "Interpret a graphic score in performance"
    zh: "演绎图形乐谱"
    zh-TW: "演繹圖形樂譜"
    ja: "図形楽譜を解釈して演奏する"
    ko: "그래픽 악보 해석해 연주하기"
    vi: "Diễn giải bản nhạc đồ họa khi biểu diễn"
    ms: "Tafsir skor grafik dalam persembahan"
    id: "Menafsirkan partitur grafis saat tampil"
    hi: "ग्राफ़िक स्कोर की व्याख्या कर प्रस्तुति देना"
  - en: "Reflect on your progress as an improviser"
    zh: "反思自己的即兴进步"
    zh-TW: "反思自己的即興進步"
    ja: "即興奏者としての成長を振り返る"
    ko: "즉흥 연주자로서 성장 성찰하기"
    vi: "Suy ngẫm tiến bộ khi ngẫu hứng"
    ms: "Renungkan kemajuan sebagai pemain improvisasi"
    id: "Merefleksikan kemajuan sebagai improvisator"
    hi: "इम्प्रोवाइज़र के रूप में अपनी प्रगति पर विचार"
