code: DRAM10033
year: 2026
learn:
  en: "First acting training: voice, movement and improvisation to break habits and start building character and work with text."
  zh: "第一门表演训练：通过声音、形体与即兴改掉习惯，开始塑造角色、处理文本。"
  zh-TW: "第一門表演訓練：透過聲音、肢體與即興改掉習慣，開始塑造角色、處理文本。"
  ja: "最初の演技訓練：声・身体・即興で癖を直し、役作りとテキストに取り組み始める。"
  ko: "첫 연기 훈련: 목소리, 움직임, 즉흥으로 습관을 고치고 인물과 텍스트 작업을 시작한다."
  vi: "Khóa diễn xuất đầu tiên: giọng, hình thể, ứng tác để bỏ thói quen, bắt đầu xây dựng nhân vật và làm việc với văn bản."
  ms: "Latihan lakonan pertama: suara, gerak dan improvisasi untuk buang tabiat dan mula membina watak."
  id: "Latihan akting pertama: suara, gerak dan improvisasi untuk menghapus kebiasaan dan mulai membangun tokoh."
  hi: "पहली अभिनय ट्रेनिंग: आवाज़, शरीर और इम्प्रोवाइज़ेशन से आदतें तोड़ना और किरदार व पाठ पर काम शुरू करना।"
outcomes:
  - en: "Use voice and body freely and efficiently"
    zh: "自如而高效地运用声音与身体"
    zh-TW: "自如而高效地運用聲音與身體"
    ja: "声と身体を自由に効率よく使う"
    ko: "목소리와 몸을 자유롭고 효율적으로 쓰기"
    vi: "Dùng giọng và cơ thể linh hoạt, hiệu quả"
    ms: "Guna suara dan tubuh dengan bebas dan cekap"
    id: "Memakai suara dan tubuh secara bebas dan efisien"
    hi: "आवाज़ और शरीर का खुला व कुशल उपयोग"
  - en: "Improvise and work from a set text"
    zh: "即兴并根据指定文本表演"
    zh-TW: "即興並根據指定文本表演"
    ja: "即興し、指定テキストで演じる"
    ko: "즉흥하고 지정 텍스트로 연기하기"
    vi: "Ứng tác và diễn từ văn bản cho sẵn"
    ms: "Berimprovisasi dan berlakon dari teks tetap"
    id: "Berimprovisasi dan berakting dari teks"
    hi: "इम्प्रोवाइज़ करना और तय पाठ से अभिनय"
  - en: "Reflect on how your skills are developing"
    zh: "反思自己技能的进步"
    zh-TW: "反思自己技能的進步"
    ja: "自分の技能の伸びを振り返る"
    ko: "자기 기술의 성장 성찰하기"
    vi: "Suy ngẫm sự tiến bộ kỹ năng của mình"
    ms: "Renung perkembangan kemahiran sendiri"
    id: "Merefleksikan perkembangan keterampilan"
    hi: "अपने कौशल के विकास पर विचार करना"
