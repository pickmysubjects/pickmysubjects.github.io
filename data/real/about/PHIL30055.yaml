code: PHIL30055
year: 2026
learn:
  en: "An advanced look at metaphysics, such as existence, causation, time, identity and parts, ending with your own view."
  zh: "形而上学进阶：存在、因果、时间、同一性和部分整体等问题，并形成你自己的观点。"
  zh-TW: "形上學進階：存在、因果、時間、同一性和部分整體等問題，並形成你自己的觀點。"
  ja: "存在・因果・時間・同一性・部分などを扱う上級の形而上学。最後に自分の立場をまとめる。"
  ko: "존재·인과·시간·동일성·부분 등을 다루는 심화 형이상학. 마지막에 자기 입장을 세운다."
  vi: "Siêu hình học nâng cao về tồn tại, nhân quả, thời gian, đồng nhất và bộ phận, kết thúc bằng quan điểm của riêng bạn."
  ms: "Kajian lanjutan metafizik seperti kewujudan, sebab-akibat, masa, identiti dan bahagian, berakhir dengan pandangan anda sendiri."
  id: "Kajian lanjut metafisika seperti keberadaan, kausalitas, waktu, identitas dan bagian, diakhiri dengan pandangan sendiri."
  hi: "तत्वमीमांसा का उन्नत अध्ययन, जैसे अस्तित्व, कारण, समय, पहचान और अंश, जिसके अंत में आप अपना मत बनाते हैं।"
outcomes:
  - en: "Explain central debates in metaphysics"
    zh: "说明形而上学的核心争论"
    zh-TW: "說明形上學的核心爭論"
    ja: "形而上学の中心的な論争を説明する"
    ko: "형이상학의 핵심 논쟁 설명하기"
    vi: "Giải thích các tranh luận trọng tâm của siêu hình học"
    ms: "Terangkan perdebatan teras metafizik"
    id: "Menjelaskan perdebatan inti metafisika"
    hi: "तत्वमीमांसा की मुख्य बहसें समझाना"
  - en: "Evaluate competing metaphysical theories"
    zh: "评估相互竞争的形而上学理论"
    zh-TW: "評估相互競爭的形上學理論"
    ja: "対立する形而上学理論を評価する"
    ko: "경쟁하는 형이상학 이론 평가하기"
    vi: "Đánh giá các lý thuyết siêu hình đối lập"
    ms: "Nilai teori metafizik yang bersaing"
    id: "Menilai teori metafisika yang bersaing"
    hi: "प्रतिस्पर्धी तत्वमीमांसीय सिद्धांतों को परखना"
  - en: "Build and defend your own metaphysical view"
    zh: "构建并捍卫自己的形而上学观点"
    zh-TW: "建構並捍衛自己的形上學觀點"
    ja: "自分の形而上学的な立場を作り擁護する"
    ko: "자신의 형이상학적 입장 세우고 옹호하기"
    vi: "Xây dựng và bảo vệ quan điểm siêu hình của riêng bạn"
    ms: "Bina dan pertahankan pandangan metafizik sendiri"
    id: "Menyusun dan membela pandangan metafisika sendiri"
    hi: "अपना तत्वमीमांसीय मत बनाना और उसका बचाव करना"
