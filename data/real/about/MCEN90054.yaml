code: MCEN90054
year: 2027
learn:
  en: "Designing a product from customer needs through to manufacture, built as a team project."
  zh: "从客户需求出发设计产品直至制造，以团队项目完成。"
  zh-TW: "從客戶需求出發設計產品直至製造，以團隊專案完成。"
  ja: "顧客の要求から製造まで製品を設計し、チームで作り上げる。"
  ko: "고객 요구에서 제조까지 제품을 설계하는 팀 프로젝트."
  vi: "Thiết kế sản phẩm từ nhu cầu khách hàng đến chế tạo qua dự án nhóm."
  ms: "Mereka bentuk produk daripada keperluan pelanggan hingga pembuatan dalam projek berkumpulan."
  id: "Merancang produk dari kebutuhan pelanggan hingga manufaktur lewat proyek tim."
  hi: "ग्राहक ज़रूरत से निर्माण तक उत्पाद डिज़ाइन, टीम प्रोजेक्ट के रूप में।"
outcomes:
  - en: "Choose a suitable manufacturing system for a product"
    zh: "为产品选择合适的制造系统"
    zh-TW: "為產品選擇合適的製造系統"
    ja: "製品に合った生産システムを選ぶ"
    ko: "제품에 맞는 제조 시스템 선택하기"
    vi: "Chọn hệ thống sản xuất phù hợp cho sản phẩm"
    ms: "Memilih sistem pembuatan yang sesuai untuk produk"
    id: "Memilih sistem manufaktur yang cocok untuk produk"
    hi: "उत्पाद के लिए उपयुक्त निर्माण प्रणाली चुनना"
  - en: "Design parts for manufacture and assembly"
    zh: "按可制造和可装配原则设计零件"
    zh-TW: "依可製造與可組裝原則設計零件"
    ja: "製造・組立しやすい部品を設計する"
    ko: "제조·조립을 고려한 부품 설계하기"
    vi: "Thiết kế chi tiết dễ chế tạo và lắp ráp"
    ms: "Mereka bentuk komponen untuk pembuatan dan pemasangan"
    id: "Merancang komponen untuk manufaktur dan perakitan"
    hi: "निर्माण व असेंबली के अनुकूल पुर्ज़े डिज़ाइन करना"
