code: GERM10006
year: 2026
learn:
  en: "Stronger spoken and written German around travel and mobility: road trips, migration and crossing borders in Europe."
  zh: "围绕旅行与流动提升德语口语和写作：公路旅行、移民和欧洲的跨境。"
  zh-TW: "圍繞旅行與流動提升德語口說和寫作：公路旅行、移民和歐洲的跨境。"
  ja: "旅と移動をテーマに話す・書く力を伸ばす。ロードトリップ、移民、ヨーロッパの国境越え。"
  ko: "여행과 이동을 주제로 독일어 말하기·쓰기를 키운다. 로드트립, 이주, 유럽의 국경 넘기."
  vi: "Nâng tiếng Đức nói và viết quanh chủ đề đi lại: du lịch đường dài, di cư và vượt biên giới ở châu Âu."
  ms: "Bahasa Jerman lisan dan bertulis yang lebih kukuh tentang perjalanan: road trip, migrasi dan merentas sempadan Eropah."
  id: "Bahasa Jerman lisan dan tulis yang lebih kuat seputar perjalanan: road trip, migrasi dan melintasi perbatasan Eropa."
  hi: "यात्रा और आवाजाही के इर्द-गिर्द बोली और लिखित जर्मन मज़बूत करना: रोड ट्रिप, प्रवास, यूरोप की सीमाएँ पार करना।"
outcomes:
  - en: "Discuss social and cultural topics in German"
    zh: "用德语讨论社会和文化话题"
    zh-TW: "用德語討論社會和文化話題"
    ja: "社会や文化の話題をドイツ語で話し合う"
    ko: "사회·문화 주제를 독일어로 토론하기"
    vi: "Thảo luận chủ đề xã hội, văn hóa bằng tiếng Đức"
    ms: "Bincangkan topik sosial dan budaya dalam bahasa Jerman"
    id: "Membahas topik sosial dan budaya dalam bahasa Jerman"
    hi: "सामाजिक और सांस्कृतिक विषयों पर जर्मन में चर्चा करना"
  - en: "Read and write longer German texts"
    zh: "读写较长的德语文章"
    zh-TW: "讀寫較長的德語文章"
    ja: "長めのドイツ語の文章を読み書きする"
    ko: "긴 독일어 글 읽고 쓰기"
    vi: "Đọc và viết văn bản tiếng Đức dài hơn"
    ms: "Baca dan tulis teks bahasa Jerman yang lebih panjang"
    id: "Membaca dan menulis teks bahasa Jerman yang lebih panjang"
    hi: "लंबे जर्मन पाठ पढ़ना-लिखना"
  - en: "Give a clear presentation in German"
    zh: "用德语做清楚的口头报告"
    zh-TW: "用德語做清楚的口頭報告"
    ja: "ドイツ語で分かりやすく発表する"
    ko: "독일어로 명확하게 발표하기"
    vi: "Thuyết trình rõ ràng bằng tiếng Đức"
    ms: "Buat pembentangan yang jelas dalam bahasa Jerman"
    id: "Melakukan presentasi yang jelas dalam bahasa Jerman"
    hi: "जर्मन में स्पष्ट प्रस्तुति देना"
