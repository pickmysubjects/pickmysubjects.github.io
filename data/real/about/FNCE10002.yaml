code: FNCE10002
year: 2026
learn:
  en: "Key ideas of finance: time value of money, risk and return, investing in projects and raising funds."
  zh: "金融基础：货币时间价值、风险与收益、项目投资和融资。"
  zh-TW: "金融基礎：貨幣時間價值、風險與報酬、專案投資和籌資。"
  ja: "ファイナンスの基本：お金の時間価値、リスクとリターン、プロジェクト投資と資金調達。"
  ko: "재무의 핵심 개념: 화폐의 시간 가치, 위험과 수익, 프로젝트 투자와 자금 조달."
  vi: "Ý tưởng cốt lõi của tài chính: giá trị thời gian của tiền, rủi ro và lợi nhuận, đầu tư dự án và huy động vốn."
  ms: "Idea utama kewangan: nilai masa wang, risiko dan pulangan, pelaburan projek dan pengumpulan dana."
  id: "Konsep inti keuangan: nilai waktu uang, risiko dan imbal hasil, investasi proyek, dan pendanaan."
  hi: "फ़ाइनेंस के मुख्य विचार: पैसे का समय मूल्य, जोखिम और रिटर्न, प्रोजेक्ट में निवेश और फ़ंड जुटाना।"
outcomes:
  - en: "Solve basic financial maths problems"
    zh: "解基础的金融计算题"
    zh-TW: "解基礎的財務計算題"
    ja: "基本的な金融計算の問題を解く"
    ko: "기초 재무 수학 문제 풀기"
    vi: "Giải bài toán tài chính cơ bản"
    ms: "Selesaikan masalah matematik kewangan asas"
    id: "Menyelesaikan soal matematika keuangan dasar"
    hi: "बेसिक फ़ाइनेंशियल गणित के सवाल हल करना"
  - en: "Evaluate projects with budgeting methods"
    zh: "用资本预算方法评估项目"
    zh-TW: "用資本預算方法評估專案"
    ja: "資本予算の手法でプロジェクトを評価する"
    ko: "자본예산 기법으로 프로젝트 평가"
    vi: "Đánh giá dự án bằng phương pháp hoạch định ngân sách vốn"
    ms: "Nilai projek dengan kaedah belanjawan modal"
    id: "Menilai proyek dengan metode capital budgeting"
    hi: "कैपिटल बजटिंग तरीकों से प्रोजेक्ट का मूल्यांकन"
  - en: "Compare debt and equity as funding sources"
    zh: "比较债务和股权融资"
    zh-TW: "比較債務和股權籌資"
    ja: "負債と株式の資金調達を比較する"
    ko: "부채와 자기자본 조달 비교"
    vi: "So sánh vốn vay và vốn cổ phần"
    ms: "Banding hutang dan ekuiti sebagai sumber dana"
    id: "Membandingkan utang dan ekuitas sebagai sumber dana"
    hi: "फ़ंडिंग के लिए डेट और इक्विटी की तुलना"
