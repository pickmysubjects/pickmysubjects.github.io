code: MUSI30272
year: 2026
learn:
  en: "A contemporary music research seminar for jazz students: build and present your own research paper with peer feedback."
  zh: "面向爵士专业的当代音乐研究研讨课：在同学反馈下完成并展示研究论文。"
  zh-TW: "面向爵士主修的當代音樂研究研討課：在同學回饋下完成並展示研究論文。"
  ja: "ジャズ専攻向けの現代音楽研究ゼミ。仲間の意見を受けて研究論文を作り発表。"
  ko: "재즈 전공 현대음악 연구 세미나. 동료 피드백을 받아 연구 논문을 만들고 발표."
  vi: "Seminar nghiên cứu nhạc đương đại cho sinh viên jazz: làm và trình bày bài nghiên cứu."
  ms: "Seminar kajian muzik kontemporari untuk pelajar jaz: hasil dan bentang kertas kajian."
  id: "Seminar riset musik kontemporer untuk mahasiswa jazz: susun dan paparkan makalah."
  hi: "जैज़ छात्रों के लिए समकालीन संगीत शोध सेमिनार: साथियों की राय से शोधपत्र बनाना।"
outcomes:
  - en: "Develop a research question in contemporary music"
    zh: "提出当代音乐研究问题"
    zh-TW: "提出當代音樂研究問題"
    ja: "現代音楽の研究課題を立てる"
    ko: "현대음악 연구 질문 세우기"
    vi: "Xây dựng câu hỏi nghiên cứu nhạc đương đại"
    ms: "Bina soalan kajian muzik kontemporari"
    id: "Menyusun pertanyaan riset musik kontemporer"
    hi: "समकालीन संगीत में शोध प्रश्न बनाना"
  - en: "Write an abstract, bibliography and final paper"
    zh: "撰写摘要、文献目录与最终论文"
    zh-TW: "撰寫摘要、文獻目錄與最終論文"
    ja: "要旨・文献目録・最終論文を書く"
    ko: "초록·참고문헌·최종 논문 쓰기"
    vi: "Viết tóm tắt, thư mục và bài cuối"
    ms: "Tulis abstrak, bibliografi dan kertas akhir"
    id: "Menulis abstrak, bibliografi, makalah akhir"
    hi: "सार, ग्रंथसूची और अंतिम शोधपत्र लिखना"
  - en: "Present research, with or without a performance"
    zh: "展示研究成果，可结合演奏"
    zh-TW: "展示研究成果，可結合演奏"
    ja: "研究を発表する（演奏を交えても可）"
    ko: "연구 발표하기(연주 포함 가능)"
    vi: "Trình bày nghiên cứu, có thể kèm biểu diễn"
    ms: "Bentang kajian, boleh dengan persembahan"
    id: "Memaparkan riset, bisa disertai penampilan"
    hi: "शोध प्रस्तुत करना, चाहें तो वादन के साथ"
