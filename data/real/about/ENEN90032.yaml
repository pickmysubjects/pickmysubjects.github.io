code: ENEN90032
year: 2027
learn:
  en: "Analysing environmental data in Python: statistics, time series and multivariate methods."
  zh: "用 Python 分析环境数据：统计、时间序列和多元方法。"
  zh-TW: "用 Python 分析環境資料：統計、時間序列與多變量方法。"
  ja: "Python で環境データを分析する：統計・時系列・多変量解析。"
  ko: "Python으로 환경 데이터 분석: 통계, 시계열, 다변량 방법."
  vi: "Phân tích dữ liệu môi trường bằng Python: thống kê, chuỗi thời gian và phương pháp đa biến."
  ms: "Menganalisis data alam sekitar dengan Python: statistik, siri masa dan kaedah multivariat."
  id: "Menganalisis data lingkungan dengan Python: statistik, deret waktu, dan metode multivariat."
  hi: "Python में पर्यावरण डेटा का विश्लेषण: सांख्यिकी, टाइम सीरीज़ और बहुचर विधियाँ।"
outcomes:
  - en: "Test hypotheses and fit regressions on environmental data"
    zh: "对环境数据做假设检验和回归"
    zh-TW: "對環境資料做假設檢定與迴歸"
    ja: "環境データで仮説検定と回帰を行う"
    ko: "환경 데이터로 가설 검정과 회귀 분석하기"
    vi: "Kiểm định giả thuyết và hồi quy trên dữ liệu môi trường"
    ms: "Menguji hipotesis dan memadankan regresi pada data alam sekitar"
    id: "Menguji hipotesis dan membuat regresi pada data lingkungan"
    hi: "पर्यावरण डेटा पर परिकल्पना परीक्षण और रिग्रेशन"
  - en: "Model and forecast time series"
    zh: "对时间序列建模和预测"
    zh-TW: "對時間序列建模與預測"
    ja: "時系列をモデル化し予測する"
    ko: "시계열 모델링 및 예측하기"
    vi: "Mô hình hóa và dự báo chuỗi thời gian"
    ms: "Memodelkan dan meramal siri masa"
    id: "Memodelkan dan meramalkan deret waktu"
    hi: "टाइम सीरीज़ का मॉडल और पूर्वानुमान"
