code: POLS30036
year: 2026
learn:
  en: "How race, ethnicity and culture became political in Western democracies, from nationalism and colonialism to today's theories."
  zh: "种族、族裔和文化如何在西方民主国家成为政治议题，从民族主义和殖民主义到当今的理论。"
  zh-TW: "種族、族裔和文化如何在西方民主國家成為政治議題，從民族主義和殖民主義到當今的理論。"
  ja: "人種、エスニシティ、文化が西洋の民主国家でどう政治の問題になったかを、ナショナリズムと植民地主義から今日の理論まで学ぶ。"
  ko: "인종, 민족, 문화가 서구 민주 국가에서 어떻게 정치 문제가 되었는지 민족주의와 식민주의부터 오늘날 이론까지 배운다."
  vi: "Chủng tộc, sắc tộc và văn hóa trở thành vấn đề chính trị ở các nền dân chủ phương Tây ra sao, từ chủ nghĩa dân tộc, thực dân đến lý thuyết ngày nay."
  ms: "Bagaimana kaum, etnik dan budaya menjadi isu politik di negara demokrasi Barat, dari nasionalisme dan kolonialisme hingga teori hari ini."
  id: "Bagaimana ras, etnis, dan budaya menjadi isu politik di negara demokrasi Barat, dari nasionalisme dan kolonialisme hingga teori masa kini."
  hi: "पश्चिमी लोकतंत्रों में नस्ल, जातीयता और संस्कृति राजनीतिक मुद्दे कैसे बने, राष्ट्रवाद और उपनिवेशवाद से आज के सिद्धांतों तक।"
outcomes:
  - en: "Trace Western ideas about race and nation"
    zh: "梳理西方关于种族和民族的观念"
    zh-TW: "梳理西方關於種族和民族的觀念"
    ja: "人種と国民に関する西洋の考え方をたどる"
    ko: "인종과 민족에 관한 서구의 생각 짚어 보기"
    vi: "Lần theo các quan niệm phương Tây về chủng tộc và dân tộc"
    ms: "Jejaki idea Barat tentang kaum dan bangsa"
    id: "Menelusuri gagasan Barat tentang ras dan bangsa"
    hi: "नस्ल और राष्ट्र पर पश्चिमी विचारों को समझना"
  - en: "Compare theories of race and ethnic politics"
    zh: "比较种族与族裔政治的各种理论"
    zh-TW: "比較種族與族裔政治的各種理論"
    ja: "人種・民族政治の理論を比べる"
    ko: "인종·민족 정치 이론 비교하기"
    vi: "So sánh các lý thuyết về chính trị chủng tộc và sắc tộc"
    ms: "Bandingkan teori politik kaum dan etnik"
    id: "Membandingkan teori politik ras dan etnis"
    hi: "नस्लीय और जातीय राजनीति के सिद्धांतों की तुलना करना"
  - en: "Analyse current debates on identity and belonging"
    zh: "分析当下关于身份与归属的争论"
    zh-TW: "分析當下關於身分與歸屬的爭論"
    ja: "アイデンティティと帰属をめぐる今の論争を分析する"
    ko: "정체성과 소속에 관한 현재 논쟁 분석하기"
    vi: "Phân tích các tranh luận hiện nay về bản sắc và sự thuộc về"
    ms: "Analisis perdebatan semasa tentang identiti dan kepunyaan"
    id: "Menganalisis perdebatan terkini soal identitas dan rasa memiliki"
    hi: "पहचान और अपनापन पर मौजूदा बहसों का विश्लेषण करना"
