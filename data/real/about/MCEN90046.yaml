code: MCEN90046
year: 2027
learn:
  en: "Modelling vibrating systems, from mass-spring-damper to beams and plates, and aeroelastic effects like flutter."
  zh: "振动系统建模，从质量-弹簧-阻尼到梁和板，以及颤振等气动弹性现象。"
  zh-TW: "振動系統建模，從質量-彈簧-阻尼到樑與板，以及顫振等氣動彈性現象。"
  ja: "質量・ばね・ダンパから、はりや板までの振動系のモデル化と、フラッターなどの空力弾性。"
  ko: "질량-스프링-감쇠기부터 보·판까지 진동계 모델링과 플러터 같은 공탄성."
  vi: "Mô hình hệ dao động, từ khối-lò xo-giảm chấn đến dầm, tấm, và hiện tượng rung lắc khí đàn hồi."
  ms: "Pemodelan sistem bergetar, daripada jisim-spring-peredam hingga rasuk dan plat, serta kesan aeroelastik seperti kibaran."
  id: "Pemodelan sistem bergetar, dari massa-pegas-peredam hingga balok dan pelat, serta efek aeroelastis seperti flutter."
  hi: "कंपन प्रणालियों की मॉडलिंग, मास-स्प्रिंग-डैम्पर से बीम व प्लेट तक, और फ़्लटर जैसे एयरोइलास्टिक प्रभाव।"
outcomes:
  - en: "Find natural frequencies and mode shapes"
    zh: "求固有频率和振型"
    zh-TW: "求固有頻率與振型"
    ja: "固有振動数と振動モードを求める"
    ko: "고유진동수와 모드 형상 구하기"
    vi: "Tìm tần số riêng và dạng dao động"
    ms: "Mencari frekuensi tabii dan bentuk mod"
    id: "Mencari frekuensi alami dan bentuk mode"
    hi: "प्राकृतिक आवृत्तियाँ और मोड शेप निकालना"
  - en: "Judge when divergence and flutter can occur"
    zh: "判断何时会发生发散和颤振"
    zh-TW: "判斷何時會發生發散與顫振"
    ja: "発散とフラッターが起きる条件を判断する"
    ko: "발산과 플러터 발생 조건 판단하기"
    vi: "Xác định khi nào xảy ra phân kỳ và rung lắc"
    ms: "Menilai bila divergens dan kibaran boleh berlaku"
    id: "Menentukan kapan divergensi dan flutter terjadi"
    hi: "डाइवर्जेंस और फ़्लटर कब होते हैं, तय करना"
