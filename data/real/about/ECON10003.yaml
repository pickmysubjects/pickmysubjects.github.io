code: ECON10003
year: 2026
learn:
  en: "How the whole economy works: output, jobs, inflation, interest rates, exchange rates and government policy."
  zh: "整体经济怎么运转：产出、就业、通胀、利率、汇率和政策。"
  zh-TW: "整體經濟怎麼運作：產出、就業、通膨、利率、匯率和政府政策。"
  ja: "経済全体の仕組み：生産、雇用、インフレ、金利、為替、政府の政策。"
  ko: "경제 전체의 작동 원리: 생산, 고용, 인플레이션, 금리, 환율, 정부 정책."
  vi: "Nền kinh tế vận hành ra sao: sản lượng, việc làm, lạm phát, lãi suất, tỷ giá và chính sách."
  ms: "Cara ekonomi keseluruhan berfungsi: keluaran, pekerjaan, inflasi, kadar faedah, kadar tukaran dan dasar kerajaan."
  id: "Cara kerja ekonomi secara keseluruhan: output, lapangan kerja, inflasi, suku bunga, kurs, dan kebijakan pemerintah."
  hi: "पूरी अर्थव्यवस्था कैसे चलती है: उत्पादन, नौकरियाँ, महंगाई, ब्याज दर, विनिमय दर और सरकारी नीति।"
outcomes:
  - en: "Explain how GDP and inflation are measured"
    zh: "解释GDP和通胀怎么衡量"
    zh-TW: "解釋GDP和通膨如何衡量"
    ja: "GDPとインフレの測り方を説明する"
    ko: "GDP와 인플레이션 측정 방법 설명"
    vi: "Giải thích cách đo GDP và lạm phát"
    ms: "Terangkan cara KDNK dan inflasi diukur"
    id: "Menjelaskan cara mengukur PDB dan inflasi"
    hi: "GDP और महंगाई कैसे मापी जाती है, समझाना"
  - en: "Use demand and supply models for the economy"
    zh: "用总需求总供给模型分析经济"
    zh-TW: "用總需求與總供給模型分析經濟"
    ja: "経済全体の需要・供給モデルを使う"
    ko: "경제 전체의 수요·공급 모형 활용"
    vi: "Dùng mô hình cung cầu cho nền kinh tế"
    ms: "Guna model permintaan dan penawaran ekonomi"
    id: "Memakai model permintaan dan penawaran agregat"
    hi: "अर्थव्यवस्था के लिए मांग-आपूर्ति मॉडल लगाना"
  - en: "Assess monetary and fiscal policies"
    zh: "评估货币和财政政策"
    zh-TW: "評估貨幣和財政政策"
    ja: "金融政策と財政政策を評価する"
    ko: "통화·재정 정책 평가"
    vi: "Đánh giá chính sách tiền tệ và tài khóa"
    ms: "Nilai dasar monetari dan fiskal"
    id: "Menilai kebijakan moneter dan fiskal"
    hi: "मौद्रिक और राजकोषीय नीतियों का आकलन"
