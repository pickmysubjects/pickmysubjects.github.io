code: ABPL90056
year: 2027
learn:
  en: "The politics of transport planning in cities, from car dependency to tollways and light rail, using Australian and global cases."
  zh: "城市交通规划中的政治，从汽车依赖到收费公路和轻轨，用澳洲和全球案例。"
  zh-TW: "都市交通規劃中的政治，從汽車依賴到收費公路與輕軌，用澳洲與全球個案。"
  ja: "都市交通計画の政治。車依存から有料道路・LRTまで、豪州と世界の事例。"
  ko: "도시 교통계획의 정치. 자동차 의존부터 유료도로·경전철까지 국내외 사례."
  vi: "Chính trị trong quy hoạch giao thông đô thị, từ phụ thuộc ô tô đến đường thu phí, đường sắt nhẹ."
  ms: "Politik perancangan pengangkutan bandar, dari kebergantungan kereta hingga lebuh raya tol."
  id: "Politik perencanaan transportasi kota, dari ketergantungan mobil hingga jalan tol dan LRT."
  hi: "शहरी परिवहन योजना की राजनीति, कार निर्भरता से टोलवे और लाइट रेल तक।"
outcomes:
  - en: "Analyse political conflicts over transport projects"
    zh: "分析交通项目中的政治冲突"
    zh-TW: "分析交通專案中的政治衝突"
    ja: "交通事業をめぐる政治対立を分析する"
    ko: "교통 사업의 정치적 갈등 분석하기"
    vi: "Phân tích xung đột chính trị về dự án giao thông"
    ms: "Menganalisis konflik politik projek pengangkutan"
    id: "Menganalisis konflik politik proyek transportasi"
    hi: "परिवहन परियोजनाओं के राजनीतिक टकराव का विश्लेषण"
  - en: "Weigh sustainability and equity in transport choices"
    zh: "在交通决策中权衡可持续与公平"
    zh-TW: "在交通決策中權衡永續與公平"
    ja: "交通政策で持続性と公平性を比べる"
    ko: "교통 선택에서 지속가능성과 형평성 따지기"
    vi: "Cân nhắc bền vững và công bằng trong giao thông"
    ms: "Menimbang kelestarian dan keadilan pengangkutan"
    id: "Menimbang keberlanjutan dan keadilan transportasi"
    hi: "परिवहन में स्थिरता और समानता तौलना"
