code: BOTA30002
year: 2026
learn:
  en: "How plants evolved, and how to work out their family tree from body features, DNA and fossils."
  zh: "植物如何演化，以及如何用形态、DNA和化石推断系统发育。"
  zh-TW: "植物如何演化，以及如何用形態、DNA與化石推斷親緣關係。"
  ja: "植物の進化と、形態・DNA・化石から系統樹を推定する方法。"
  ko: "식물의 진화와 형태·DNA·화석으로 계통수를 추정하는 법."
  vi: "Thực vật tiến hóa ra sao và cách dựng cây phát sinh từ hình thái, DNA và hóa thạch."
  ms: "Cara tumbuhan berevolusi dan cara membina salasilahnya daripada morfologi, DNA dan fosil."
  id: "Cara tumbuhan berevolusi dan cara menyusun pohon kekerabatan dari morfologi, DNA, dan fosil."
  hi: "पौधे कैसे विकसित हुए, और रूप, DNA व जीवाश्मों से उनका वंश-वृक्ष कैसे बनाएँ।"
outcomes:
  - en: "Analyse DNA and trait data with phylogenetics"
    zh: "用系统发育方法分析DNA和形态数据"
    zh-TW: "用親緣分析方法分析DNA與形態數據"
    ja: "系統解析でDNAと形態データを分析する"
    ko: "계통 분석으로 DNA·형질 데이터 분석하기"
    vi: "Phân tích dữ liệu DNA và hình thái bằng phát sinh loài"
    ms: "Analisis data DNA dan ciri dengan filogenetik"
    id: "Menganalisis data DNA dan morfologi secara filogenetik"
    hi: "फ़ाइलोजेनेटिक्स से DNA और लक्षण डेटा का विश्लेषण करें"
  - en: "Describe key processes in plant evolution"
    zh: "描述植物演化的关键过程"
    zh-TW: "描述植物演化的關鍵過程"
    ja: "植物進化の主要過程を説明する"
    ko: "식물 진화의 핵심 과정 설명하기"
    vi: "Mô tả các quá trình chính trong tiến hóa thực vật"
    ms: "Huraikan proses utama evolusi tumbuhan"
    id: "Mendeskripsikan proses utama evolusi tumbuhan"
    hi: "पौधों के विकास की मुख्य प्रक्रियाएँ बताएँ"
