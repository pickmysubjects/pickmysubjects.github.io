code: CLAS10004
year: 2026
learn:
  en: "Ancient Greek from scratch: alphabet, grammar, building words and sentences, and reading simple texts."
  zh: "零基础古希腊语：字母、语法、构词造句，以及阅读简单文本。"
  zh-TW: "零基礎古希臘語：字母、文法、構詞造句，以及閱讀簡單文本。"
  ja: "ゼロから学ぶ古代ギリシャ語。文字、文法、語と文の組み立て、やさしい文章の読解。"
  ko: "처음 배우는 고대 그리스어. 문자, 문법, 단어와 문장 만들기, 쉬운 글 읽기."
  vi: "Tiếng Hy Lạp cổ từ đầu: bảng chữ cái, ngữ pháp, tạo từ và câu, đọc văn bản đơn giản."
  ms: "Bahasa Yunani Kuno dari asas: abjad, tatabahasa, membina kata dan ayat, serta membaca teks mudah."
  id: "Bahasa Yunani Kuno dari nol: alfabet, tata bahasa, membentuk kata dan kalimat, serta membaca teks sederhana."
  hi: "शून्य से प्राचीन यूनानी: वर्णमाला, व्याकरण, शब्द और वाक्य बनाना, और आसान पाठ पढ़ना।"
outcomes:
  - en: "Learn the core grammar and vocabulary of Ancient Greek"
    zh: "掌握古希腊语的核心语法和词汇"
    zh-TW: "掌握古希臘語的核心文法和詞彙"
    ja: "古代ギリシャ語の基本文法と語彙を身につける"
    ko: "고대 그리스어의 핵심 문법과 어휘 익히기"
    vi: "Nắm ngữ pháp và từ vựng cốt lõi của tiếng Hy Lạp cổ"
    ms: "Kuasai tatabahasa dan kosa kata teras bahasa Yunani Kuno"
    id: "Menguasai tata bahasa dan kosakata inti bahasa Yunani Kuno"
    hi: "प्राचीन यूनानी का मूल व्याकरण और शब्दावली सीखना"
  - en: "Read simple Ancient Greek sentences and texts"
    zh: "阅读简单的古希腊语句子和文本"
    zh-TW: "閱讀簡單的古希臘語句子和文本"
    ja: "やさしい古代ギリシャ語の文や文章を読む"
    ko: "쉬운 고대 그리스어 문장과 글 읽기"
    vi: "Đọc câu và văn bản tiếng Hy Lạp cổ đơn giản"
    ms: "Baca ayat dan teks bahasa Yunani Kuno yang mudah"
    id: "Membaca kalimat dan teks bahasa Yunani Kuno sederhana"
    hi: "सरल प्राचीन यूनानी वाक्य और पाठ पढ़ना"
  - en: "Translate short Ancient Greek passages into English"
    zh: "把简短的古希腊语段落译成英语"
    zh-TW: "把簡短的古希臘語段落譯成英語"
    ja: "短い古代ギリシャ語の文章を英語に訳す"
    ko: "짧은 고대 그리스어 글을 영어로 번역하기"
    vi: "Dịch đoạn tiếng Hy Lạp cổ ngắn sang tiếng Anh"
    ms: "Terjemah petikan bahasa Yunani Kuno pendek ke bahasa Inggeris"
    id: "Menerjemahkan bagian bahasa Yunani Kuno pendek ke bahasa Inggris"
    hi: "छोटे प्राचीन यूनानी अंशों का अंग्रेज़ी में अनुवाद करना"
