code: MUST10017
year: 2027
learn:
  en: "An online subject on working online well: using body, voice and mind-body practices for creativity, confidence and wellbeing."
  zh: "纯线上课程：如何更好地线上工作，借助身体、声音和身心练习提升创造力、自信和身心健康。"
  zh-TW: "純線上課程：如何更好地線上工作，藉助身體、聲音和身心練習提升創造力、自信和身心健康。"
  ja: "オンラインで上手に働くためのオンライン科目：体・声・心身の実践で創造性、自信、ウェルビーイングを高める。"
  ko: "온라인으로 잘 일하는 법을 다루는 온라인 과목: 몸, 목소리, 심신 수련으로 창의성·자신감·웰빙 높이기."
  vi: "Môn học trực tuyến về làm việc online hiệu quả: dùng cơ thể, giọng nói và thực hành thân-tâm để tăng sáng tạo, tự tin và sức khỏe tinh thần."
  ms: "Subjek dalam talian tentang bekerja dalam talian dengan baik: guna badan, suara dan amalan minda-badan untuk kreativiti, keyakinan dan kesejahteraan."
  id: "Mata kuliah daring tentang bekerja online dengan baik: memakai tubuh, suara, dan latihan pikiran-tubuh untuk kreativitas, percaya diri, dan kesejahteraan."
  hi: "ऑनलाइन काम को बेहतर बनाने पर ऑनलाइन विषय: शरीर, आवाज़ और मन-शरीर अभ्यास से रचनात्मकता, आत्मविश्वास और भलाई।"
outcomes:
  - en: "Understand basic anatomy of the body as instrument"
    zh: "了解把身体当作乐器的基础解剖知识"
    zh-TW: "了解把身體當作樂器的基礎解剖知識"
    ja: "楽器としての体の基本的な解剖学を理解する"
    ko: "악기로서의 몸에 대한 기초 해부학 이해하기"
    vi: "Hiểu giải phẫu cơ bản của cơ thể như một nhạc cụ"
    ms: "Fahami anatomi asas badan sebagai alat"
    id: "Memahami anatomi dasar tubuh sebagai instrumen"
    hi: "शरीर को वाद्य मानकर बुनियादी शरीर-रचना समझना"
  - en: "Use safe movement habits for online work"
    zh: "线上工作时保持安全的动作习惯"
    zh-TW: "線上工作時保持安全的動作習慣"
    ja: "オンライン作業で安全な動きの習慣を使う"
    ko: "온라인 작업을 위한 안전한 움직임 습관 익히기"
    vi: "Áp dụng thói quen vận động an toàn khi làm online"
    ms: "Amalkan pergerakan selamat semasa kerja dalam talian"
    id: "Menerapkan pola gerak aman saat bekerja online"
    hi: "ऑनलाइन काम में सुरक्षित मूवमेंट आदतें अपनाना"
  - en: "Judge how mind-body practices affect wellbeing"
    zh: "评估身心练习对健康的影响"
    zh-TW: "評估身心練習對健康的影響"
    ja: "心身の実践がウェルビーイングに与える影響を評価する"
    ko: "심신 수련이 웰빙에 미치는 영향 평가하기"
    vi: "Đánh giá tác động của thực hành thân-tâm lên sức khỏe tinh thần"
    ms: "Nilai kesan amalan minda-badan pada kesejahteraan"
    id: "Menilai dampak latihan pikiran-tubuh pada kesejahteraan"
    hi: "मन-शरीर अभ्यासों का भलाई पर असर आंकना"
