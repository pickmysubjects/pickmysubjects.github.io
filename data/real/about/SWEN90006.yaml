code: SWEN90006
year: 2027
learn:
  en: "Methods and tools for checking that software is correct, secure and reliable, from testing to static analysis."
  zh: "确保软件正确、安全、可靠的方法与工具，从测试到静态分析。"
  zh-TW: "確保軟體正確、安全、可靠的方法與工具，從測試到靜態分析。"
  ja: "ソフトの正しさ・安全性・信頼性を確かめる手法とツール：テストから静的解析まで。"
  ko: "소프트웨어의 정확성·보안·신뢰성을 확인하는 방법과 도구: 테스트부터 정적 분석까지."
  vi: "Phương pháp và công cụ kiểm tra phần mềm đúng, an toàn, tin cậy, từ kiểm thử đến phân tích tĩnh."
  ms: "Kaedah dan alat untuk pastikan perisian betul, selamat dan boleh dipercayai, dari ujian ke analisis statik."
  id: "Metode dan alat untuk memastikan perangkat lunak benar, aman, andal, dari pengujian hingga analisis statis."
  hi: "सॉफ़्टवेयर को सही, सुरक्षित और भरोसेमंद जाँचने के तरीके और टूल: टेस्टिंग से स्टैटिक विश्लेषण तक।"
outcomes:
  - en: "Design test cases that find bugs"
    zh: "设计能发现缺陷的测试用例"
    zh-TW: "設計能找出缺陷的測試案例"
    ja: "バグを見つけるテストケースを設計する"
    ko: "버그를 찾는 테스트 케이스 설계하기"
    vi: "Thiết kế ca kiểm thử tìm ra lỗi"
    ms: "Mereka bentuk kes ujian yang menemui pepijat"
    id: "Merancang kasus uji yang menemukan bug"
    hi: "बग पकड़ने वाले टेस्ट केस डिज़ाइन करना"
  - en: "Spot and reduce security weaknesses in code"
    zh: "发现并减少代码中的安全漏洞"
    zh-TW: "發現並減少程式碼中的資安弱點"
    ja: "コードのセキュリティ上の弱点を見つけ減らす"
    ko: "코드의 보안 취약점 찾아 줄이기"
    vi: "Phát hiện và giảm lỗ hổng bảo mật trong mã"
    ms: "Mengesan dan mengurangkan kelemahan keselamatan kod"
    id: "Menemukan dan mengurangi celah keamanan kode"
    hi: "कोड में सुरक्षा कमज़ोरियाँ पहचानना और घटाना"
