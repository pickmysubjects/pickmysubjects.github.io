code: ABPL30039
year: 2026
learn:
  en: "Construction contracts in practice: parties' rights and duties, payments, variations, delays, defects and disputes."
  zh: "建筑合同实务：双方权利义务、付款、变更、延误、缺陷和争议处理。"
  zh-TW: "營建合約實務：雙方權利義務、付款、變更、延誤、瑕疵與爭議處理。"
  ja: "建設契約の実務。当事者の権利義務、支払い、変更、遅延、瑕疵、紛争。"
  ko: "건설 계약 실무: 당사자 권리·의무, 기성금, 설계 변경, 지연, 하자, 분쟁."
  vi: "Hợp đồng xây dựng thực tế: quyền và nghĩa vụ, thanh toán, thay đổi, chậm trễ, sai sót, tranh chấp."
  ms: "Kontrak pembinaan secara praktikal: hak dan tanggungjawab, bayaran, ubahan, kelewatan, kecacatan, pertikaian."
  id: "Kontrak konstruksi dalam praktik: hak-kewajiban, pembayaran, perubahan, keterlambatan, cacat, dan sengketa."
  hi: "निर्माण अनुबंध व्यवहार में: अधिकार-दायित्व, भुगतान, बदलाव, देरी, दोष और विवाद।"
outcomes:
  - en: "Read and compare standard building contracts"
    zh: "阅读并比较标准建筑合同"
    zh-TW: "閱讀並比較標準營建合約"
    ja: "標準建設契約を読み比べる"
    ko: "표준 건설 계약서 읽고 비교하기"
    vi: "Đọc và so sánh hợp đồng xây dựng mẫu"
    ms: "Baca dan banding kontrak binaan standard"
    id: "Membaca dan membandingkan kontrak standar"
    hi: "मानक निर्माण अनुबंध पढ़ना और तुलना करना"
  - en: "Handle payments, variations and delays under a contract"
    zh: "依合同处理付款、变更和延误"
    zh-TW: "依合約處理付款、變更與延誤"
    ja: "契約に沿って支払い・変更・遅延を扱う"
    ko: "계약에 따라 기성·변경·지연 처리하기"
    vi: "Xử lý thanh toán, thay đổi, chậm trễ theo hợp đồng"
    ms: "Urus bayaran, ubahan dan kelewatan ikut kontrak"
    id: "Menangani pembayaran, perubahan, keterlambatan"
    hi: "अनुबंध के तहत भुगतान, बदलाव और देरी संभालना"
  - en: "Understand building law and how disputes get resolved"
    zh: "了解建筑法规及争议解决方式"
    zh-TW: "了解營建法規與爭議解決方式"
    ja: "建設法規と紛争解決の仕組みを理解する"
    ko: "건설 법규와 분쟁 해결 방식 이해하기"
    vi: "Hiểu luật xây dựng và cách giải quyết tranh chấp"
    ms: "Faham undang-undang binaan dan penyelesaian pertikaian"
    id: "Memahami hukum bangunan dan penyelesaian sengketa"
    hi: "भवन कानून और विवाद निपटारा समझना"
