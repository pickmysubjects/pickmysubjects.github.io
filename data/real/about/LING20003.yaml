code: LING20003
year: 2026
learn:
  en: "How people learn a second language, why some succeed more than others, and how to teach with that in mind."
  zh: "人们如何学习第二语言，为何有人学得更好，以及据此如何教学。"
  zh-TW: "人們如何學習第二語言，為何有人學得更好，以及據此如何教學。"
  ja: "人が第二言語をどう身につけ、なぜ上達に差が出るのか、それを踏まえてどう教えるかを学ぶ。"
  ko: "사람들이 제2언어를 어떻게 배우는지, 왜 누구는 더 잘하는지, 이를 고려해 어떻게 가르칠지 배운다."
  vi: "Con người học ngôn ngữ thứ hai ra sao, vì sao có người thành công hơn, và dạy thế nào cho phù hợp."
  ms: "Cara orang belajar bahasa kedua, sebab sesetengahnya lebih berjaya, dan cara mengajar dengan mengambil kira hal itu."
  id: "Cara orang belajar bahasa kedua, mengapa sebagian lebih berhasil, dan cara mengajar dengan memperhatikannya."
  hi: "लोग दूसरी भाषा कैसे सीखते हैं, कुछ लोग ज़्यादा सफल क्यों होते हैं, और इसे ध्यान में रखकर कैसे पढ़ाएँ।"
outcomes:
  - en: "Explain the main theories of second language learning"
    zh: "说明第二语言习得的主要理论"
    zh-TW: "說明第二語言習得的主要理論"
    ja: "第二言語習得の主な理論を説明する"
    ko: "제2언어 습득의 주요 이론 설명하기"
    vi: "Giải thích các lý thuyết chính về học ngôn ngữ thứ hai"
    ms: "Terangkan teori utama pembelajaran bahasa kedua"
    id: "Menjelaskan teori utama pemerolehan bahasa kedua"
    hi: "दूसरी भाषा सीखने के मुख्य सिद्धांत समझाना"
  - en: "Assess how age and motivation affect learning"
    zh: "评估年龄和动机如何影响学习"
    zh-TW: "評估年齡和動機如何影響學習"
    ja: "年齢や動機が学習に与える影響を評価する"
    ko: "나이와 동기가 학습에 미치는 영향 평가하기"
    vi: "Đánh giá tuổi tác và động lực ảnh hưởng đến việc học ra sao"
    ms: "Nilai kesan umur dan motivasi terhadap pembelajaran"
    id: "Menilai pengaruh usia dan motivasi pada pembelajaran"
    hi: "उम्र और प्रेरणा सीखने पर कैसे असर डालते हैं, आकलन करना"
  - en: "Analyse real learner data"
    zh: "分析真实的学习者数据"
    zh-TW: "分析真實的學習者資料"
    ja: "実際の学習者データを分析する"
    ko: "실제 학습자 자료 분석하기"
    vi: "Phân tích dữ liệu người học thực tế"
    ms: "Analisis data pelajar sebenar"
    id: "Menganalisis data pembelajar nyata"
    hi: "असली सीखने वालों के डेटा का विश्लेषण करना"
