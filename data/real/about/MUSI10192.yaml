code: MUSI10192
year: 2026
learn:
  en: "Continue small and large jazz ensemble work, widening your composing and improvising and developing your own style."
  zh: "继续在大小爵士乐团中演奏，拓展作曲与即兴能力，发展个人风格。"
  zh-TW: "繼續在大小爵士樂團中演奏，拓展作曲與即興能力，發展個人風格。"
  ja: "大小のジャズアンサンブルを継続し、作曲と即興の幅を広げ、自分のスタイルを育てる。"
  ko: "재즈 앙상블 활동을 이어 가며 작곡·즉흥 폭을 넓히고 자신의 스타일 키우기."
  vi: "Tiếp tục ban jazz nhỏ và lớn, mở rộng sáng tác, ứng tấu và phát triển phong cách riêng."
  ms: "Teruskan ensembel jaz kecil dan besar, luaskan gubahan dan improvisasi, bina gaya sendiri."
  id: "Melanjutkan ansambel jazz kecil dan besar, memperluas komposisi dan improvisasi, membangun gaya sendiri."
  hi: "जैज़ समूहों में आगे बजाना; रचना और इम्प्रोवाइज़ेशन बढ़ाना, अपनी शैली विकसित करना।"
outcomes:
  - en: "Perform jazz repertoire with a band"
    zh: "与乐队演奏爵士曲目"
    zh-TW: "與樂隊演奏爵士曲目"
    ja: "バンドでジャズのレパートリーを演奏する"
    ko: "밴드와 재즈 레퍼토리 연주하기"
    vi: "Chơi tiết mục jazz cùng ban"
    ms: "Mainkan repertoir jaz bersama band"
    id: "Memainkan repertoar jazz bersama band"
    hi: "बैंड के साथ जैज़ रचनाएँ बजाना"
  - en: "Compose a folio for small ensemble"
    zh: "为小型乐团创作作品集"
    zh-TW: "為小型樂團創作作品集"
    ja: "小編成アンサンブル用の作品集を作る"
    ko: "소규모 앙상블용 작품집 만들기"
    vi: "Sáng tác tập nhạc cho ban nhỏ"
    ms: "Gubah folio untuk ensembel kecil"
    id: "Menggubah portofolio untuk ansambel kecil"
    hi: "छोटे समूह के लिए रचनाओं का संग्रह"
  - en: "Give and take constructive critique"
    zh: "给予并接受建设性评价"
    zh-TW: "給予並接受建設性評價"
    ja: "建設的な批評をやり取りする"
    ko: "건설적인 비평 주고받기"
    vi: "Góp ý và nhận góp ý xây dựng"
    ms: "Beri dan terima kritikan membina"
    id: "Memberi dan menerima kritik membangun"
    hi: "रचनात्मक आलोचना देना और लेना"
