code: MECM30016
year: 2026
learn:
  en: "How to collect, clean and analyse social media data with ready-made software tools (no coding needed) and write it up as a report."
  zh: "用现成软件工具（无需编程）收集、清理和分析社交媒体数据，并写成研究报告。"
  zh-TW: "用現成軟體工具（不需寫程式）蒐集、清理和分析社群媒體資料，並寫成研究報告。"
  ja: "既存のソフトウェア（プログラミング不要）でSNSのデータを集め、整え、分析し、レポートにまとめる。"
  ko: "기존 소프트웨어 도구(코딩 불필요)로 소셜 미디어 데이터를 모으고 정리해 분석하고 보고서로 쓴다."
  vi: "Cách thu thập, làm sạch và phân tích dữ liệu mạng xã hội bằng phần mềm có sẵn (không cần lập trình) rồi viết thành báo cáo."
  ms: "Cara mengumpul, membersih dan menganalisis data media sosial dengan perisian sedia ada (tanpa pengaturcaraan) dan menulisnya sebagai laporan."
  id: "Cara mengumpulkan, membersihkan, dan menganalisis data media sosial dengan perangkat lunak siap pakai (tanpa coding), lalu menuliskannya jadi laporan."
  hi: "तैयार सॉफ़्टवेयर टूल्स (कोडिंग की ज़रूरत नहीं) से सोशल मीडिया डेटा इकट्ठा करना, साफ़ करना, विश्लेषण करना और रिपोर्ट लिखना।"
outcomes:
  - en: "Collect, clean and analyse digital media data"
    zh: "收集、清理和分析数字媒体数据"
    zh-TW: "蒐集、清理和分析數位媒體資料"
    ja: "デジタルメディアのデータを集め、整え、分析する"
    ko: "디지털 미디어 데이터 수집, 정리, 분석하기"
    vi: "Thu thập, làm sạch và phân tích dữ liệu truyền thông số"
    ms: "Kumpul, bersih dan analisis data media digital"
    id: "Mengumpulkan, membersihkan, dan menganalisis data media digital"
    hi: "डिजिटल मीडिया डेटा इकट्ठा करना, साफ़ करना और विश्लेषण करना"
  - en: "Weigh the pros and cons of digital research methods"
    zh: "权衡各种数字研究方法的利弊"
    zh-TW: "權衡各種數位研究方法的利弊"
    ja: "デジタル研究手法の長所と短所を比べる"
    ko: "디지털 연구 방법의 장단점 따져 보기"
    vi: "Cân nhắc ưu nhược điểm của các phương pháp nghiên cứu số"
    ms: "Timbang kebaikan dan keburukan kaedah kajian digital"
    id: "Menimbang plus-minus metode riset digital"
    hi: "डिजिटल शोध तरीकों के फ़ायदे-नुकसान परखना"
  - en: "Handle research design and ethics with online data"
    zh: "处理网络数据研究中的设计与伦理问题"
    zh-TW: "處理網路資料研究中的設計與倫理問題"
    ja: "オンラインデータを扱う研究の設計と倫理に対応する"
    ko: "온라인 데이터 연구의 설계와 윤리 다루기"
    vi: "Xử lý thiết kế nghiên cứu và đạo đức khi dùng dữ liệu trực tuyến"
    ms: "Urus reka bentuk kajian dan etika data dalam talian"
    id: "Menangani desain riset dan etika data daring"
    hi: "ऑनलाइन डेटा वाले शोध में डिज़ाइन और नैतिकता संभालना"
