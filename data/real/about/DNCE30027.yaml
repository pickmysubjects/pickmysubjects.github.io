code: DNCE30027
year: 2026
learn:
  en: "Cross-art-form workshops and a group project with other artists, ending in a full-length interdisciplinary performance."
  zh: "跨艺术形式的工作坊和合作项目，最后呈现一场跨学科演出。"
  zh-TW: "跨藝術形式的工作坊和合作專題，最後呈現一場跨領域演出。"
  ja: "他分野の芸術家とのワークショップと共同制作。最後に分野横断の公演を行う。"
  ko: "다른 예술 분야와의 워크숍과 협업 프로젝트, 마지막에 융합 공연을 올린다."
  vi: "Workshop liên ngành nghệ thuật và dự án nhóm, kết thúc bằng màn diễn liên ngành."
  ms: "Bengkel merentas bentuk seni dan projek bersama artis lain, diakhiri persembahan antara disiplin."
  id: "Lokakarya lintas seni dan proyek bersama seniman lain, diakhiri pertunjukan interdisipliner."
  hi: "अलग कला-रूपों की वर्कशॉप और समूह प्रोजेक्ट, अंत में एक अंतर-विषयी प्रस्तुति।"
outcomes:
  - en: "Collaborate with artists from other fields"
    zh: "与其他领域的艺术家合作"
    zh-TW: "與其他領域的藝術家合作"
    ja: "他分野の芸術家と協働する"
    ko: "다른 분야 예술가와 협업하기"
    vi: "Hợp tác với nghệ sĩ lĩnh vực khác"
    ms: "Bekerjasama dengan artis bidang lain"
    id: "Berkolaborasi dengan seniman bidang lain"
    hi: "दूसरे क्षेत्रों के कलाकारों के साथ सहयोग"
  - en: "Lead and support a creative team"
    zh: "带领并支持创作团队"
    zh-TW: "帶領並支持創作團隊"
    ja: "創作チームを率い支える"
    ko: "창작 팀을 이끌고 돕기"
    vi: "Dẫn dắt và hỗ trợ nhóm sáng tạo"
    ms: "Pimpin dan sokong pasukan kreatif"
    id: "Memimpin dan mendukung tim kreatif"
    hi: "रचनात्मक टीम का नेतृत्व और सहयोग"
  - en: "Plan a work placement with a clear brief"
    zh: "写清晰的实习计划书"
    zh-TW: "寫清楚的實習計畫書"
    ja: "明確な計画書で職業体験を準備する"
    ko: "명확한 계획서로 실무 경험 준비하기"
    vi: "Lập bản kế hoạch rõ ràng cho đợt thực tập"
    ms: "Rancang penempatan kerja dengan taklimat jelas"
    id: "Merencanakan magang dengan rencana jelas"
    hi: "साफ़ ब्रीफ़ के साथ वर्क प्लेसमेंट की योजना"
