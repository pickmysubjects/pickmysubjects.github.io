code: FOOD20003
year: 2026
learn:
  en: "The chemistry of carbs, proteins and fats, how the body digests and uses nutrients, and diet planning."
  zh: "碳水、蛋白质和脂肪的化学，人体如何消化利用营养，以及膳食规划。"
  zh-TW: "醣類、蛋白質和脂肪的化學，人體如何消化利用營養，以及膳食規劃。"
  ja: "炭水化物・たんぱく質・脂質の化学、体での栄養の消化と利用、食事計画。"
  ko: "탄수화물·단백질·지방의 화학, 몸의 영양 소화·이용, 식단 계획."
  vi: "Hóa học của tinh bột, đạm, chất béo, cơ thể tiêu hóa dinh dưỡng ra sao và lập thực đơn."
  ms: "Kimia karbohidrat, protein dan lemak, cara badan mencerna nutrien, dan perancangan diet."
  id: "Kimia karbohidrat, protein, dan lemak, cara tubuh mencerna gizi, dan perencanaan diet."
  hi: "कार्ब्स, प्रोटीन और वसा का रसायन, शरीर पोषक तत्व कैसे पचाता है, और आहार योजना।"
outcomes:
  - en: "Assess a diet against nutrient guidelines"
    zh: "对照营养标准评估个人饮食"
    zh-TW: "對照營養標準評估個人飲食"
    ja: "栄養基準と照らして食事を評価する"
    ko: "영양 기준에 맞춰 식단 평가하기"
    vi: "Đánh giá khẩu phần theo chuẩn dinh dưỡng"
    ms: "Nilai diet berdasarkan garis panduan nutrien"
    id: "Menilai pola makan terhadap pedoman gizi"
    hi: "पोषण दिशानिर्देशों से आहार परखना"
  - en: "Work out a person's energy needs"
    zh: "计算一个人的能量需求"
    zh-TW: "計算一個人的熱量需求"
    ja: "人のエネルギー必要量を算出する"
    ko: "사람의 에너지 필요량 계산하기"
    vi: "Tính nhu cầu năng lượng của một người"
    ms: "Kira keperluan tenaga seseorang"
    id: "Menghitung kebutuhan energi seseorang"
    hi: "किसी व्यक्ति की ऊर्जा ज़रूरत निकालना"
