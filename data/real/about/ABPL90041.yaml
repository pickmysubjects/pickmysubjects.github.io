code: ABPL90041
year: 2027
learn:
  en: "The basics of Australian property law: ownership, land titles, leases, easements and co-ownership."
  zh: "澳大利亚物业法基础：所有权、土地登记、租约、地役权和共有。"
  zh-TW: "澳洲不動產法基礎：所有權、土地登記、租約、地役權與共有。"
  ja: "オーストラリアの不動産法の基礎：所有権、土地登記、賃貸借、地役権、共有。"
  ko: "호주 부동산법 기초: 소유권, 토지 등기, 임대차, 지역권, 공동소유."
  vi: "Cơ bản về luật bất động sản Úc: quyền sở hữu, đăng ký đất, thuê, quyền địa dịch và đồng sở hữu."
  ms: "Asas undang-undang hartanah Australia: pemilikan, hak milik tanah, pajakan, ismen dan pemilikan bersama."
  id: "Dasar hukum properti Australia: kepemilikan, pendaftaran tanah, sewa, servitut, dan kepemilikan bersama."
  hi: "ऑस्ट्रेलियाई संपत्ति कानून की बुनियाद: स्वामित्व, भूमि रजिस्ट्री, लीज़, सुखाधिकार और सह-स्वामित्व।"
outcomes:
  - en: "Analyse basic property law issues"
    zh: "分析基本的物业法问题"
    zh-TW: "分析基本的不動產法問題"
    ja: "基本的な不動産法の問題を分析する"
    ko: "기본적인 부동산법 문제 분석하기"
    vi: "Phân tích các vấn đề cơ bản của luật bất động sản"
    ms: "Menganalisis isu asas undang-undang hartanah"
    id: "Menganalisis masalah dasar hukum properti"
    hi: "संपत्ति कानून के बुनियादी मुद्दों का विश्लेषण"
  - en: "Write a professional report and debate legal points"
    zh: "撰写专业报告并辩论法律问题"
    zh-TW: "撰寫專業報告並辯論法律問題"
    ja: "専門的なレポートを書き、法的論点を議論する"
    ko: "전문 보고서 작성과 법적 쟁점 토론하기"
    vi: "Viết báo cáo chuyên môn và tranh luận vấn đề pháp lý"
    ms: "Menulis laporan profesional dan berdebat tentang isu undang-undang"
    id: "Menulis laporan profesional dan berdebat soal hukum"
    hi: "पेशेवर रिपोर्ट लिखना और कानूनी बिंदुओं पर बहस"
