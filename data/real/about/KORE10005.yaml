code: KORE10005
year: 2026
learn:
  en: "Upper-intermediate Korean for formal and casual settings: society topics, proverbs, new slang and online media."
  zh: "中高级韩语，适用于正式和日常场合：社会话题、俗语、新词和网络媒体。"
  zh-TW: "中高級韓語，適用於正式和日常場合：社會話題、俗語、新詞和網路媒體。"
  ja: "フォーマルにもカジュアルにも使える中上級の韓国語。社会の話題、ことわざ、新語、ネットメディア。"
  ko: "격식·비격식 상황 모두를 위한 중상급 한국어. 사회 주제, 속담, 신조어, 온라인 미디어."
  vi: "Tiếng Hàn trung cao cấp cho bối cảnh trang trọng và thân mật: chủ đề xã hội, tục ngữ, từ mới và truyền thông mạng."
  ms: "Bahasa Korea pertengahan tinggi untuk situasi formal dan santai: topik masyarakat, peribahasa, istilah baharu dan media dalam talian."
  id: "Bahasa Korea menengah atas untuk situasi formal dan santai: topik masyarakat, peribahasa, istilah baru dan media daring."
  hi: "औपचारिक और अनौपचारिक मौक़ों के लिए उच्च-मध्यम कोरियाई: सामाजिक विषय, कहावतें, नए शब्द और ऑनलाइन मीडिया।"
outcomes:
  - en: "Discuss social and cultural topics in Korean"
    zh: "用韩语讨论社会和文化话题"
    zh-TW: "用韓語討論社會和文化話題"
    ja: "社会や文化の話題を韓国語で話し合う"
    ko: "사회·문화 주제를 한국어로 토론하기"
    vi: "Thảo luận chủ đề xã hội, văn hóa bằng tiếng Hàn"
    ms: "Bincangkan topik sosial dan budaya dalam bahasa Korea"
    id: "Membahas topik sosial dan budaya dalam bahasa Korea"
    hi: "सामाजिक और सांस्कृतिक विषयों पर कोरियाई में चर्चा करना"
  - en: "Read and write longer Korean texts"
    zh: "读写较长的韩语文章"
    zh-TW: "讀寫較長的韓語文章"
    ja: "長めの韓国語の文章を読み書きする"
    ko: "긴 한국어 글 읽고 쓰기"
    vi: "Đọc và viết văn bản tiếng Hàn dài hơn"
    ms: "Baca dan tulis teks bahasa Korea yang lebih panjang"
    id: "Membaca dan menulis teks bahasa Korea yang lebih panjang"
    hi: "लंबे कोरियाई पाठ पढ़ना-लिखना"
  - en: "Give a clear presentation in Korean"
    zh: "用韩语做清楚的口头报告"
    zh-TW: "用韓語做清楚的口頭報告"
    ja: "韓国語で分かりやすく発表する"
    ko: "한국어로 명확하게 발표하기"
    vi: "Thuyết trình rõ ràng bằng tiếng Hàn"
    ms: "Buat pembentangan yang jelas dalam bahasa Korea"
    id: "Melakukan presentasi yang jelas dalam bahasa Korea"
    hi: "कोरियाई में स्पष्ट प्रस्तुति देना"
