code: ARBC20001
year: 2026
learn:
  en: "Reading Arabic from news, academia and the web to understand the Arab world's history, politics and society, plus small research."
  zh: "阅读新闻、学术和网络上的阿拉伯语，了解阿拉伯世界的历史、政治和社会，并做小型研究。"
  zh-TW: "閱讀新聞、學術和網路上的阿拉伯語，了解阿拉伯世界的歷史、政治和社會，並做小型研究。"
  ja: "ニュース、学術、ネットのアラビア語を読み、アラブ世界の歴史・政治・社会を理解する。小さな調査も。"
  ko: "뉴스·학술·인터넷 아랍어를 읽으며 아랍 세계의 역사, 정치, 사회를 이해하고 작은 연구도 한다."
  vi: "Đọc tiếng Ả Rập từ báo chí, học thuật và mạng để hiểu lịch sử, chính trị, xã hội thế giới Ả Rập, cùng nghiên cứu nhỏ."
  ms: "Membaca bahasa Arab daripada berita, akademik dan internet untuk memahami sejarah, politik dan masyarakat Arab, serta kajian kecil."
  id: "Membaca bahasa Arab dari berita, akademik dan internet untuk memahami sejarah, politik dan masyarakat Arab, plus riset kecil."
  hi: "ख़बरों, अकादमिक लेखों और इंटरनेट की अरबी पढ़कर अरब दुनिया का इतिहास, राजनीति और समाज समझना, साथ में छोटा शोध।"
outcomes:
  - en: "Analyse the style and genre of Arabic texts"
    zh: "分析阿拉伯语文本的文体和体裁"
    zh-TW: "分析阿拉伯語文本的文體和體裁"
    ja: "アラビア語の文章の文体とジャンルを分析する"
    ko: "아랍어 글의 문체와 장르 분석하기"
    vi: "Phân tích văn phong và thể loại văn bản tiếng Ả Rập"
    ms: "Analisis gaya dan genre teks Arab"
    id: "Menganalisis gaya dan genre teks Arab"
    hi: "अरबी पाठों की शैली और विधा का विश्लेषण करना"
  - en: "Debate current issues in the Arab world"
    zh: "讨论阿拉伯世界的时事议题"
    zh-TW: "討論阿拉伯世界的時事議題"
    ja: "アラブ世界の時事問題を議論する"
    ko: "아랍 세계의 시사 문제 토론하기"
    vi: "Tranh luận về vấn đề thời sự ở thế giới Ả Rập"
    ms: "Berdebat tentang isu semasa dunia Arab"
    id: "Memperdebatkan isu terkini di dunia Arab"
    hi: "अरब दुनिया के मौजूदा मुद्दों पर बहस करना"
  - en: "Carry out a small research project"
    zh: "完成一个小型研究项目"
    zh-TW: "完成一個小型研究專題"
    ja: "小さな研究プロジェクトを行う"
    ko: "소규모 연구 프로젝트 수행하기"
    vi: "Thực hiện một dự án nghiên cứu nhỏ"
    ms: "Jalankan projek penyelidikan kecil"
    id: "Melakukan proyek riset kecil"
    hi: "एक छोटा शोध प्रोजेक्ट करना"
