code: ABPL20053
year: 2026
learn:
  en: "Reinforced concrete in commercial and high-rise buildings: reading engineers' drawings and how it gets built."
  zh: "商业与高层建筑中的钢筋混凝土：读懂结构图纸并了解施工方式。"
  zh-TW: "商業與高層建築中的鋼筋混凝土：讀懂結構圖面並了解施工方式。"
  ja: "商業・高層建築の鉄筋コンクリート：構造図の読み方と施工方法。"
  ko: "상업·고층 건물의 철근콘크리트: 구조 도면 읽기와 시공 방식."
  vi: "Bê tông cốt thép trong nhà thương mại, cao tầng: đọc bản vẽ kết cấu và cách thi công."
  ms: "Konkrit bertetulang dalam bangunan komersial dan tinggi: membaca lukisan jurutera dan cara ia dibina."
  id: "Beton bertulang di gedung komersial dan bertingkat tinggi: membaca gambar struktur dan cara membangunnya."
  hi: "व्यावसायिक और ऊँची इमारतों में रीइन्फ़ोर्स्ड कंक्रीट: इंजीनियरिंग ड्रॉइंग पढ़ना और निर्माण।"
outcomes:
  - en: "Read reinforced concrete drawings and specs"
    zh: "读懂钢筋混凝土图纸与规范"
    zh-TW: "讀懂鋼筋混凝土圖面與規範"
    ja: "RC図面と仕様書を読む"
    ko: "철근콘크리트 도면과 시방서 읽기"
    vi: "Đọc bản vẽ và chỉ dẫn bê tông cốt thép"
    ms: "Baca lukisan dan spesifikasi konkrit bertetulang"
    id: "Membaca gambar dan spesifikasi beton bertulang"
    hi: "RCC ड्रॉइंग और स्पेसिफ़िकेशन पढ़ना"
  - en: "Explain how concrete structures are built"
    zh: "说明混凝土结构如何施工"
    zh-TW: "說明混凝土結構如何施工"
    ja: "コンクリート構造の施工を説明する"
    ko: "콘크리트 구조 시공 과정 설명하기"
    vi: "Giải thích cách thi công kết cấu bê tông"
    ms: "Jelaskan cara struktur konkrit dibina"
    id: "Menjelaskan cara struktur beton dibangun"
    hi: "कंक्रीट संरचनाएँ कैसे बनती हैं, समझाना"
  - en: "Weigh the cost of structural options"
    zh: "权衡不同结构方案的成本"
    zh-TW: "權衡不同結構方案的成本"
    ja: "構造案のコストを比べる"
    ko: "구조 대안의 비용 비교하기"
    vi: "Cân nhắc chi phí các phương án kết cấu"
    ms: "Timbang kos pilihan struktur"
    id: "Menimbang biaya opsi struktur"
    hi: "संरचना विकल्पों की लागत तौलना"
