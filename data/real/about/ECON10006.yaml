code: ECON10006
year: 2026
learn:
  en: "An introduction to microeconomics: how people and firms make choices, how markets set prices, and when markets fail."
  zh: "微观经济学入门：个人和企业如何做选择，市场如何定价，何时会失灵。"
  zh-TW: "個體經濟學入門：個人和企業如何做選擇，市場如何定價，何時會失靈。"
  ja: "ミクロ経済学入門：人や企業の選択、市場による価格決定、市場が失敗する時。"
  ko: "미시경제학 입문: 개인과 기업의 선택, 시장의 가격 결정, 시장 실패."
  vi: "Nhập môn kinh tế vi mô: cá nhân và doanh nghiệp lựa chọn ra sao, thị trường định giá thế nào và khi nào thất bại."
  ms: "Pengenalan mikroekonomi: cara individu dan firma membuat pilihan, cara pasaran menetapkan harga, dan bila ia gagal."
  id: "Pengantar ekonomi mikro: cara orang dan perusahaan memilih, cara pasar menentukan harga, dan kapan pasar gagal."
  hi: "माइक्रोइकोनॉमिक्स का परिचय: लोग और कंपनियाँ कैसे चुनती हैं, बाज़ार दाम कैसे तय करता है, और कब विफल होता है।"
outcomes:
  - en: "Use supply and demand to explain prices"
    zh: "用供求关系解释价格"
    zh-TW: "用供需關係解釋價格"
    ja: "需要と供給で価格を説明する"
    ko: "수요와 공급으로 가격 설명하기"
    vi: "Dùng cung cầu để giải thích giá cả"
    ms: "Guna penawaran dan permintaan untuk terangkan harga"
    id: "Memakai penawaran dan permintaan untuk menjelaskan harga"
    hi: "माँग और आपूर्ति से क़ीमतें समझाना"
  - en: "Explain how firms and consumers make decisions at the margin"
    zh: "解释企业和消费者如何做边际决策"
    zh-TW: "說明企業和消費者如何做邊際決策"
    ja: "企業と消費者の限界的な意思決定を説明する"
    ko: "기업과 소비자의 한계적 의사결정 설명"
    vi: "Giải thích quyết định cận biên của doanh nghiệp và người tiêu dùng"
    ms: "Terangkan keputusan marginal firma dan pengguna"
    id: "Menjelaskan keputusan marginal perusahaan dan konsumen"
    hi: "कंपनियों और उपभोक्ताओं के मार्जिनल फ़ैसले समझाना"
  - en: "See how market failure, trade and government policy affect the economy"
    zh: "理解市场失灵、贸易和政府政策对经济的影响"
    zh-TW: "理解市場失靈、貿易和政府政策對經濟的影響"
    ja: "市場の失敗、貿易、政府の政策が経済に与える影響を知る"
    ko: "시장 실패, 무역, 정부 정책이 경제에 미치는 영향 이해"
    vi: "Hiểu thất bại thị trường, thương mại và chính sách tác động kinh tế"
    ms: "Fahami kesan kegagalan pasaran, perdagangan dan dasar kerajaan"
    id: "Memahami dampak kegagalan pasar, perdagangan, dan kebijakan"
    hi: "बाज़ार की विफलता, व्यापार और सरकारी नीति का असर समझना"
