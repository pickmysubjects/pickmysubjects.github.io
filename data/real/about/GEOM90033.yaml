code: GEOM90033
year: 2027
learn:
  en: "How GNSS, inertial, wireless and laser-based positioning work, and using them for precise positions."
  zh: "GNSS、惯性、无线和激光定位的原理，以及如何用它们获得高精度位置。"
  zh-TW: "GNSS、慣性、無線與雷射定位的原理，以及如何用它們取得高精度位置。"
  ja: "GNSS・慣性・無線・レーザーによる測位の仕組みと、高精度測位への使い方。"
  ko: "GNSS, 관성, 무선, 레이저 기반 측위의 원리와 정밀 측위 활용."
  vi: "Cách định vị GNSS, quán tính, không dây và laser hoạt động, và dùng chúng để định vị chính xác."
  ms: "Cara penentududukan GNSS, inersia, tanpa wayar dan laser berfungsi, dan menggunakannya untuk kedudukan tepat."
  id: "Cara kerja penentuan posisi GNSS, inersia, nirkabel, dan laser, serta memakainya untuk posisi presisi."
  hi: "GNSS, जड़त्वीय, वायरलेस और लेज़र आधारित पोज़िशनिंग कैसे काम करती है और सटीक स्थिति के लिए उनका उपयोग।"
outcomes:
  - en: "Transform between global and Australian coordinate systems"
    zh: "在全球和澳大利亚坐标系之间进行转换"
    zh-TW: "在全球與澳洲座標系之間轉換"
    ja: "世界と豪州の座標系を相互に変換する"
    ko: "전 세계 좌표계와 호주 좌표계 간 변환하기"
    vi: "Chuyển đổi giữa hệ tọa độ toàn cầu và Úc"
    ms: "Menukar antara sistem koordinat global dan Australia"
    id: "Mengonversi antara sistem koordinat global dan Australia"
    hi: "वैश्विक और ऑस्ट्रेलियाई निर्देशांक प्रणालियों के बीच रूपांतरण"
  - en: "Collect and process GNSS data with high-end equipment"
    zh: "用高端设备采集并处理 GNSS 数据"
    zh-TW: "用高階設備蒐集並處理 GNSS 資料"
    ja: "高性能機器で GNSS データを収集・処理する"
    ko: "고급 장비로 GNSS 데이터 수집 및 처리하기"
    vi: "Thu thập và xử lý dữ liệu GNSS bằng thiết bị cao cấp"
    ms: "Mengumpul dan memproses data GNSS dengan peralatan canggih"
    id: "Mengumpulkan dan mengolah data GNSS dengan peralatan kelas atas"
    hi: "उच्च-स्तरीय उपकरणों से GNSS डेटा जुटाना और प्रोसेस करना"
  - en: "Deal with errors when combining several sensors"
    zh: "处理多传感器组合时的误差"
    zh-TW: "處理多感測器組合時的誤差"
    ja: "複数センサーを組み合わせる際の誤差に対処する"
    ko: "여러 센서를 결합할 때 오차 다루기"
    vi: "Xử lý sai số khi kết hợp nhiều cảm biến"
    ms: "Menangani ralat apabila menggabungkan beberapa penderia"
    id: "Menangani galat saat menggabungkan beberapa sensor"
    hi: "कई सेंसर जोड़ते समय त्रुटियों से निपटना"
