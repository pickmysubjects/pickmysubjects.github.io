code: FNCE90083
year: 2027
learn:
  en: "Working with finance data in Python or R: cleaning, regression, time series, panel data and machine learning."
  zh: "用 Python 或 R 处理金融数据：清洗、回归、时间序列、面板数据和机器学习。"
  zh-TW: "用 Python 或 R 處理金融資料：清理、迴歸、時間序列、追蹤資料與機器學習。"
  ja: "Python や R で金融データを扱う：整理、回帰、時系列、パネルデータ、機械学習。"
  ko: "Python이나 R로 금융 데이터 다루기: 정제, 회귀, 시계열, 패널 데이터, 머신러닝."
  vi: "Xử lý dữ liệu tài chính bằng Python hoặc R: làm sạch, hồi quy, chuỗi thời gian, dữ liệu bảng, học máy."
  ms: "Mengolah data kewangan dengan Python atau R: pembersihan, regresi, siri masa, data panel, pembelajaran mesin."
  id: "Mengolah data keuangan dengan Python atau R: pembersihan, regresi, deret waktu, data panel, machine learning."
  hi: "Python या R में वित्त डेटा: सफाई, रिग्रेशन, टाइम सीरीज़, पैनल डेटा और मशीन लर्निंग।"
outcomes:
  - en: "Clean, summarise and visualise financial data"
    zh: "清洗、汇总并可视化金融数据"
    zh-TW: "清理、彙整並視覺化金融資料"
    ja: "金融データを整理・要約・可視化する"
    ko: "금융 데이터 정제·요약·시각화하기"
    vi: "Làm sạch, tóm tắt và trực quan hóa dữ liệu tài chính"
    ms: "Membersih, meringkas dan menggambarkan data kewangan"
    id: "Membersihkan, meringkas dan memvisualkan data keuangan"
    hi: "वित्तीय डेटा साफ़ करना, सारांश बनाना और दिखाना"
  - en: "Fit and assess regression and ML models"
    zh: "建立并评估回归和机器学习模型"
    zh-TW: "建立並評估迴歸與機器學習模型"
    ja: "回帰・機械学習モデルを当てはめ評価する"
    ko: "회귀·머신러닝 모형 적합·평가하기"
    vi: "Xây dựng và đánh giá mô hình hồi quy, học máy"
    ms: "Membina dan menilai model regresi dan ML"
    id: "Membangun dan menilai model regresi dan ML"
    hi: "रिग्रेशन और ML मॉडल बनाना और परखना"
