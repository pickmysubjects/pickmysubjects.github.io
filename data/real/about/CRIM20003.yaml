code: CRIM20003
year: 2026
learn:
  en: "Where modern police came from and how they work, covering police culture, misconduct, accountability and whether policing reduces crime."
  zh: "现代警察从何而来、如何运作，涉及警察文化、不当行为、问责，以及警务能否减少犯罪。"
  zh-TW: "現代警察從何而來、如何運作，涉及警察文化、不當行為、問責，以及警務能否減少犯罪。"
  ja: "現代の警察の成り立ちと働きを、警察文化、不祥事、説明責任、警察活動が犯罪を減らすのかという点から学ぶ。"
  ko: "현대 경찰의 기원과 작동 방식을 경찰 문화, 비위, 책임성, 치안 활동이 범죄를 줄이는지 등으로 살펴본다."
  vi: "Cảnh sát hiện đại ra đời và vận hành ra sao, gồm văn hóa cảnh sát, sai phạm, trách nhiệm giải trình và liệu cảnh sát có giảm được tội phạm."
  ms: "Asal usul dan cara polis moden bekerja, meliputi budaya polis, salah laku, akauntabiliti dan sama ada kepolisan mengurangkan jenayah."
  id: "Asal-usul dan cara kerja polisi modern, mencakup budaya polisi, pelanggaran, akuntabilitas, dan apakah pemolisian menurunkan kejahatan."
  hi: "आधुनिक पुलिस कहाँ से आई और कैसे काम करती है: पुलिस संस्कृति, दुर्व्यवहार, जवाबदेही और क्या पुलिसिंग से अपराध घटता है।"
outcomes:
  - en: "Explain the history and role of modern policing"
    zh: "说明现代警务的历史和作用"
    zh-TW: "說明現代警務的歷史和作用"
    ja: "現代の警察活動の歴史と役割を説明する"
    ko: "현대 치안의 역사와 역할 설명하기"
    vi: "Giải thích lịch sử và vai trò của cảnh sát hiện đại"
    ms: "Terangkan sejarah dan peranan kepolisan moden"
    id: "Menjelaskan sejarah dan peran pemolisian modern"
    hi: "आधुनिक पुलिसिंग का इतिहास और भूमिका समझाना"
  - en: "Analyse police culture and accountability"
    zh: "分析警察文化和问责机制"
    zh-TW: "分析警察文化和問責機制"
    ja: "警察文化と説明責任を分析する"
    ko: "경찰 문화와 책임성 분석하기"
    vi: "Phân tích văn hóa cảnh sát và trách nhiệm giải trình"
    ms: "Analisis budaya polis dan akauntabiliti"
    id: "Menganalisis budaya polisi dan akuntabilitas"
    hi: "पुलिस संस्कृति और जवाबदेही का विश्लेषण करना"
  - en: "Assess new trends and challenges in policing"
    zh: "评估警务的新趋势和挑战"
    zh-TW: "評估警務的新趨勢和挑戰"
    ja: "警察活動の新しい流れと課題を評価する"
    ko: "치안의 새로운 흐름과 과제 평가하기"
    vi: "Đánh giá xu hướng và thách thức mới của ngành cảnh sát"
    ms: "Nilai trend dan cabaran baharu kepolisan"
    id: "Menilai tren dan tantangan baru pemolisian"
    hi: "पुलिसिंग के नए रुझानों और चुनौतियों का आकलन करना"
