code: ARBC20002
year: 2026
learn:
  en: "Advanced Arabic style and syntax through long literary, historical and academic texts, plus classical and spoken Arabic."
  zh: "通过长篇文学、历史和学术文本学习高级阿拉伯语文体与句法，并接触古典与口语阿拉伯语。"
  zh-TW: "透過長篇文學、歷史和學術文本學習高級阿拉伯語文體與句法，並接觸古典與口語阿拉伯語。"
  ja: "長い文学・歴史・学術テキストで上級アラビア語の文体と構文を学び、古典語や口語にも触れる。"
  ko: "긴 문학·역사·학술 텍스트로 고급 아랍어 문체와 구문을 배우고 고전 아랍어와 구어도 접한다."
  vi: "Văn phong và cú pháp tiếng Ả Rập nâng cao qua văn bản văn học, lịch sử, học thuật dài, cùng tiếng Ả Rập cổ điển và khẩu ngữ."
  ms: "Gaya dan sintaksis bahasa Arab lanjutan melalui teks sastera, sejarah dan akademik panjang, serta Arab klasik dan lisan."
  id: "Gaya dan sintaksis bahasa Arab lanjut lewat teks sastra, sejarah dan akademik panjang, juga Arab klasik dan percakapan."
  hi: "लंबे साहित्यिक, ऐतिहासिक और अकादमिक पाठों से उन्नत अरबी शैली व वाक्य-रचना, साथ में शास्त्रीय और बोलचाल की अरबी।"
outcomes:
  - en: "Discuss social and cultural topics in Arabic"
    zh: "用阿拉伯语讨论社会和文化话题"
    zh-TW: "用阿拉伯語討論社會和文化話題"
    ja: "社会や文化の話題をアラビア語で話し合う"
    ko: "사회·문화 주제를 아랍어로 토론하기"
    vi: "Thảo luận chủ đề xã hội, văn hóa bằng tiếng Ả Rập"
    ms: "Bincangkan topik sosial dan budaya dalam bahasa Arab"
    id: "Membahas topik sosial dan budaya dalam bahasa Arab"
    hi: "सामाजिक और सांस्कृतिक विषयों पर अरबी में चर्चा करना"
  - en: "Read and write longer Arabic texts"
    zh: "读写较长的阿拉伯语文章"
    zh-TW: "讀寫較長的阿拉伯語文章"
    ja: "長めのアラビア語の文章を読み書きする"
    ko: "긴 아랍어 글 읽고 쓰기"
    vi: "Đọc và viết văn bản tiếng Ả Rập dài hơn"
    ms: "Baca dan tulis teks bahasa Arab yang lebih panjang"
    id: "Membaca dan menulis teks bahasa Arab yang lebih panjang"
    hi: "लंबे अरबी पाठ पढ़ना-लिखना"
  - en: "Give a clear presentation in Arabic"
    zh: "用阿拉伯语做清楚的口头报告"
    zh-TW: "用阿拉伯語做清楚的口頭報告"
    ja: "アラビア語で分かりやすく発表する"
    ko: "아랍어로 명확하게 발표하기"
    vi: "Thuyết trình rõ ràng bằng tiếng Ả Rập"
    ms: "Buat pembentangan yang jelas dalam bahasa Arab"
    id: "Melakukan presentasi yang jelas dalam bahasa Arab"
    hi: "अरबी में स्पष्ट प्रस्तुति देना"
