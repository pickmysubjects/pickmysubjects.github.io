code: ENEN90011
year: 2027
learn:
  en: "Ways to use less energy in transport, factories, offices and homes, and what that means for cost and the environment."
  zh: "在交通、工厂、办公和住宅中节约能源的方法，以及对成本和环境的影响。"
  zh-TW: "在交通、工廠、辦公與住宅中節約能源的方法，以及對成本與環境的影響。"
  ja: "交通・工場・オフィス・住宅で省エネする方法と、そのコストや環境への影響。"
  ko: "교통, 공장, 사무실, 주거에서 에너지를 아끼는 방법과 비용·환경 영향."
  vi: "Cách dùng ít năng lượng hơn trong giao thông, nhà máy, văn phòng, nhà ở, và ý nghĩa về chi phí, môi trường."
  ms: "Cara menjimatkan tenaga dalam pengangkutan, kilang, pejabat dan rumah, serta kesannya pada kos dan alam sekitar."
  id: "Cara menghemat energi di transportasi, pabrik, kantor, dan rumah, serta dampaknya pada biaya dan lingkungan."
  hi: "परिवहन, कारख़ानों, दफ़्तरों और घरों में कम ऊर्जा इस्तेमाल करने के तरीक़े, और लागत व पर्यावरण पर असर।"
outcomes:
  - en: "Identify where energy intensity can be cut in each sector"
    zh: "找出各行业可降低能源强度的环节"
    zh-TW: "找出各產業可降低能源密集度的環節"
    ja: "各部門でエネルギー原単位を下げられる点を見つける"
    ko: "부문별로 에너지 원단위를 줄일 수 있는 곳 찾기"
    vi: "Tìm chỗ có thể giảm cường độ năng lượng ở từng ngành"
    ms: "Mengenal pasti tempat keamatan tenaga boleh dikurangkan dalam setiap sektor"
    id: "Mengidentifikasi di mana intensitas energi bisa ditekan di tiap sektor"
    hi: "हर क्षेत्र में ऊर्जा तीव्रता कहाँ घटाई जा सकती है, पहचानना"
  - en: "Weigh the social, economic and environmental effects of these technologies"
    zh: "权衡这些技术的社会、经济和环境影响"
    zh-TW: "權衡這些技術的社會、經濟與環境影響"
    ja: "これらの技術の社会・経済・環境面の影響を考える"
    ko: "이 기술들의 사회·경제·환경 영향 따져보기"
    vi: "Cân nhắc tác động xã hội, kinh tế và môi trường của các công nghệ này"
    ms: "Menimbang kesan sosial, ekonomi dan alam sekitar teknologi ini"
    id: "Menimbang dampak sosial, ekonomi, dan lingkungan teknologi ini"
    hi: "इन तकनीकों के सामाजिक, आर्थिक और पर्यावरणीय प्रभाव तौलना"
