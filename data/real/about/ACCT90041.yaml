code: ACCT90041
year: 2027
learn:
  en: "Reading and interpreting financial reports as a user, for students from any field."
  zh: "从使用者角度阅读和解读财务报告，适合各专业学生。"
  zh-TW: "從使用者角度閱讀與解讀財務報告，適合各科系學生。"
  ja: "利用者の立場から財務報告を読み解く。どの分野の学生にも向く。"
  ko: "이용자 관점에서 재무보고서를 읽고 해석한다. 모든 전공 대상."
  vi: "Đọc và hiểu báo cáo tài chính từ góc nhìn người dùng, cho mọi ngành."
  ms: "Membaca dan mentafsir laporan kewangan sebagai pengguna, untuk semua bidang."
  id: "Membaca dan menafsirkan laporan keuangan sebagai pengguna, untuk semua jurusan."
  hi: "उपयोगकर्ता की नज़र से वित्तीय रिपोर्ट पढ़ना और समझना, किसी भी विषय के छात्रों के लिए।"
outcomes:
  - en: "Describe what financial statements are for"
    zh: "说明财务报表的性质和用途"
    zh-TW: "說明財務報表的性質與用途"
    ja: "財務諸表の目的を説明する"
    ko: "재무제표의 목적 설명하기"
    vi: "Mô tả mục đích của báo cáo tài chính"
    ms: "Menerangkan tujuan penyata kewangan"
    id: "Menjelaskan tujuan laporan keuangan"
    hi: "वित्तीय विवरणों का उद्देश्य बताना"
  - en: "Analyse statements from different kinds of businesses"
    zh: "分析不同类型企业的财务报表"
    zh-TW: "分析不同類型企業的財務報表"
    ja: "さまざまな企業の財務諸表を分析する"
    ko: "여러 유형 기업의 재무제표 분석하기"
    vi: "Phân tích báo cáo của nhiều loại doanh nghiệp"
    ms: "Menganalisis penyata pelbagai jenis perniagaan"
    id: "Menganalisis laporan berbagai jenis bisnis"
    hi: "अलग-अलग व्यवसायों के विवरणों का विश्लेषण"
  - en: "Judge how accounting info helps analysts, banks and managers"
    zh: "判断会计信息对分析师、银行和管理者的作用"
    zh-TW: "判斷會計資訊對分析師、銀行與管理者的作用"
    ja: "会計情報がアナリストや銀行、経営者に役立つかを判断する"
    ko: "분석가·은행·경영자에게 회계 정보의 쓸모 판단하기"
    vi: "Đánh giá giá trị thông tin kế toán với nhà phân tích, ngân hàng, quản lý"
    ms: "Menilai guna maklumat perakaunan bagi penganalisis, bank dan pengurus"
    id: "Menilai manfaat info akuntansi bagi analis, bank, dan manajer"
    hi: "विश्लेषकों, बैंकों और प्रबंधकों के लिए लेखा जानकारी का महत्व आँकना"
