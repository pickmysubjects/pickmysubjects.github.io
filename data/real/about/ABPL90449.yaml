code: ABPL90449
year: 2027
learn:
  en: "Contemporary housing research and practice, working with housing researchers on real issues in groups."
  zh: "当代住房研究与实践，分组与住房研究者一起探讨真实问题。"
  zh-TW: "當代住房研究與實務，分組與住房研究者一起探討真實問題。"
  ja: "現代の住宅研究と実践を、研究者とともにグループで実際の課題に取り組む。"
  ko: "현대 주택 연구와 실무를 주택 연구자와 함께 팀으로 실제 문제에 적용합니다."
  vi: "Nghiên cứu và thực tiễn nhà ở đương đại, làm nhóm với nhà nghiên cứu về vấn đề thật."
  ms: "Kajian dan amalan perumahan semasa, berkumpulan bersama penyelidik pada isu sebenar."
  id: "Riset dan praktik perumahan masa kini, berkelompok dengan peneliti pada isu nyata."
  hi: "समकालीन आवास शोध और व्यवहार, शोधकर्ताओं के साथ समूह में असली मुद्दों पर।"
outcomes:
  - en: "Analyse current approaches to housing issues"
    zh: "分析应对住房问题的现有做法"
    zh-TW: "分析因應住房問題的現有做法"
    ja: "住宅問題への取り組みを分析する"
    ko: "주택 문제 대응 방식 분석하기"
    vi: "Phân tích cách tiếp cận vấn đề nhà ở"
    ms: "Menganalisis pendekatan isu perumahan"
    id: "Menganalisis pendekatan masalah perumahan"
    hi: "आवास समस्याओं के मौजूदा तरीकों का विश्लेषण"
  - en: "Pitch a housing research proposal"
    zh: "展示住房研究提案"
    zh-TW: "展示住房研究提案"
    ja: "住宅研究の提案を発表する"
    ko: "주택 연구 제안 발표하기"
    vi: "Trình bày đề xuất nghiên cứu nhà ở"
    ms: "Membentang cadangan kajian perumahan"
    id: "Mempresentasikan proposal riset perumahan"
    hi: "आवास शोध प्रस्ताव पिच करना"
