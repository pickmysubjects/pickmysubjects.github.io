code: ARBC20005
year: 2026
learn:
  en: "Arabic used to explore the Arab world's history, customs and values, through essays, poems, reports and articles."
  zh: "用阿拉伯语认识阿拉伯世界的历史、习俗和价值观，读散文、诗歌、报道和文章。"
  zh-TW: "用阿拉伯語認識阿拉伯世界的歷史、習俗和價值觀，讀散文、詩歌、報導和文章。"
  ja: "エッセイ、詩、報告、記事を通じ、アラビア語でアラブ世界の歴史・習慣・価値観を知る。"
  ko: "에세이·시·보도·기사를 통해 아랍어로 아랍 세계의 역사, 관습, 가치관을 살펴본다."
  vi: "Dùng tiếng Ả Rập tìm hiểu lịch sử, phong tục và giá trị của thế giới Ả Rập qua tiểu luận, thơ, phóng sự và bài báo."
  ms: "Bahasa Arab untuk meneroka sejarah, adat dan nilai dunia Arab melalui esei, puisi, laporan dan artikel."
  id: "Bahasa Arab untuk menjelajahi sejarah, adat dan nilai dunia Arab lewat esai, puisi, laporan dan artikel."
  hi: "निबंधों, कविताओं, रिपोर्टों और लेखों के ज़रिए अरबी में अरब दुनिया का इतिहास, रिवाज और मूल्य जानना।"
outcomes:
  - en: "Talk about familiar topics in Arabic with more confidence"
    zh: "更自信地用阿拉伯语谈论熟悉的话题"
    zh-TW: "更自信地用阿拉伯語談論熟悉的話題"
    ja: "身近な話題をアラビア語でより自信を持って話す"
    ko: "익숙한 주제를 아랍어로 더 자신 있게 말하기"
    vi: "Nói về chủ đề quen thuộc bằng tiếng Ả Rập tự tin hơn"
    ms: "Bercakap tentang topik biasa dalam bahasa Arab dengan lebih yakin"
    id: "Membicarakan topik akrab dalam bahasa Arab dengan lebih percaya diri"
    hi: "परिचित विषयों पर अरबी में ज़्यादा आत्मविश्वास से बात करना"
  - en: "Read and write short Arabic texts"
    zh: "读写简短的阿拉伯语文章"
    zh-TW: "讀寫簡短的阿拉伯語文章"
    ja: "短いアラビア語の文章を読み書きする"
    ko: "짧은 아랍어 글 읽고 쓰기"
    vi: "Đọc và viết đoạn văn tiếng Ả Rập ngắn"
    ms: "Baca dan tulis teks pendek bahasa Arab"
    id: "Membaca dan menulis teks pendek bahasa Arab"
    hi: "छोटे अरबी पाठ पढ़ना-लिखना"
  - en: "Use new grammar and vocabulary correctly"
    zh: "正确运用新语法和词汇"
    zh-TW: "正確運用新文法和詞彙"
    ja: "新しい文法と語彙を正しく使う"
    ko: "새 문법과 어휘를 정확히 쓰기"
    vi: "Dùng đúng ngữ pháp và từ vựng mới"
    ms: "Guna tatabahasa dan kosa kata baharu dengan betul"
    id: "Memakai tata bahasa dan kosakata baru dengan benar"
    hi: "नया व्याकरण और शब्दावली सही इस्तेमाल करना"
