code: COMP90087
year: 2027
learn:
  en: "Spotting and reasoning about the social and ethical issues of AI and digital technology, and discussing them from several views."
  zh: "识别并思考人工智能与数字技术的社会和伦理问题，并从多角度讨论。"
  zh-TW: "辨識並思考人工智慧與數位科技的社會與倫理問題，並從多角度討論。"
  ja: "AI とデジタル技術の社会的・倫理的問題を見つけ、多様な視点で考える。"
  ko: "AI·디지털 기술의 사회적·윤리적 문제를 찾아 여러 관점으로 논의."
  vi: "Nhận ra và suy luận về vấn đề xã hội, đạo đức của AI và công nghệ số từ nhiều góc nhìn."
  ms: "Mengenal pasti dan menilai isu sosial dan etika AI serta teknologi digital dari pelbagai sudut."
  id: "Mengenali dan menalar isu sosial dan etika AI serta teknologi digital dari berbagai sudut."
  hi: "AI और डिजिटल तकनीक के सामाजिक व नैतिक मुद्दे पहचानना और कई नज़रियों से चर्चा करना।"
outcomes:
  - en: "Identify ethical risks in AI systems"
    zh: "识别 AI 系统中的伦理风险"
    zh-TW: "辨識 AI 系統中的倫理風險"
    ja: "AI システムの倫理的リスクを見つける"
    ko: "AI 시스템의 윤리적 위험 찾기"
    vi: "Nhận ra rủi ro đạo đức trong hệ thống AI"
    ms: "Kenal pasti risiko etika dalam sistem AI"
    id: "Mengenali risiko etika dalam sistem AI"
    hi: "AI सिस्टम में नैतिक जोखिम पहचानना"
  - en: "Argue a position on an AI ethics issue"
    zh: "就 AI 伦理问题提出并论证观点"
    zh-TW: "就 AI 倫理問題提出並論證觀點"
    ja: "AI 倫理の問題で立場を論じる"
    ko: "AI 윤리 문제에 대한 입장 논증하기"
    vi: "Lập luận quan điểm về một vấn đề đạo đức AI"
    ms: "Hujahkan pendirian tentang isu etika AI"
    id: "Mengargumentasikan sikap atas isu etika AI"
    hi: "AI नैतिकता के मुद्दे पर अपना पक्ष रखना"
