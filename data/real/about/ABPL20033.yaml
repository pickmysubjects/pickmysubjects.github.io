code: ABPL20033
year: 2026
learn:
  en: "Construction as a process: how structure, elements, materials, services and comfort strategies fit together."
  zh: "把建造看作过程：结构、构件、材料、设备与舒适策略如何组合。"
  zh-TW: "把營造看作過程：結構、構件、材料、設備與舒適策略如何組合。"
  ja: "プロセスとしての建設：構造・部材・材料・設備・快適性の工夫がどう組み合うか。"
  ko: "과정으로서의 시공: 구조, 부재, 재료, 설비, 쾌적성 전략이 어떻게 맞물리는지."
  vi: "Xây dựng như một quy trình: kết cấu, cấu kiện, vật liệu, hệ thống kỹ thuật và tiện nghi kết hợp ra sao."
  ms: "Pembinaan sebagai proses: cara struktur, elemen, bahan, servis dan strategi keselesaan bergabung."
  id: "Konstruksi sebagai proses: cara struktur, elemen, material, utilitas, dan strategi kenyamanan menyatu."
  hi: "निर्माण एक प्रक्रिया: संरचना, हिस्से, सामग्री, सर्विसेज़ और आराम के उपाय कैसे जुड़ते हैं।"
outcomes:
  - en: "Analyse how a case-study building is put together"
    zh: "分析案例建筑的构造方式"
    zh-TW: "分析案例建築的構造方式"
    ja: "事例建物の組み立てを分析する"
    ko: "사례 건물의 구성 방식 분석하기"
    vi: "Phân tích cách một công trình mẫu được cấu tạo"
    ms: "Analisis cara bangunan kajian kes disusun"
    id: "Menganalisis susunan bangunan studi kasus"
    hi: "केस-स्टडी इमारत कैसे बनी है, विश्लेषण करना"
  - en: "Link structural principles to building systems"
    zh: "把结构原理与建筑系统联系起来"
    zh-TW: "把結構原理與建築系統連結起來"
    ja: "構造原理を建物システムと結びつける"
    ko: "구조 원리를 건축 시스템과 연결하기"
    vi: "Gắn nguyên lý kết cấu với hệ thống công trình"
    ms: "Kaitkan prinsip struktur dengan sistem bangunan"
    id: "Mengaitkan prinsip struktur dengan sistem bangunan"
    hi: "संरचना के सिद्धांतों को बिल्डिंग सिस्टम से जोड़ना"
  - en: "Document construction details in drawings"
    zh: "用图纸记录构造细节"
    zh-TW: "用圖面記錄構造細節"
    ja: "施工詳細を図面にまとめる"
    ko: "도면으로 시공 디테일 정리하기"
    vi: "Thể hiện chi tiết cấu tạo bằng bản vẽ"
    ms: "Dokumentasi butiran binaan dalam lukisan"
    id: "Mendokumentasikan detail konstruksi dalam gambar"
    hi: "निर्माण के ब्योरे ड्रॉइंग में दर्ज करना"
