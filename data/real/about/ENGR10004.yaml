code: ENGR10004
year: 2026
learn:
  en: "How engineers solve real problems: a team design project with sensing, water treatment, CAD and 3D printing."
  zh: "工程师如何解决现实问题：结合传感、水处理、CAD和3D打印的团队设计项目。"
  zh-TW: "工程師如何解決真實問題：結合感測、水處理、CAD和3D列印的團隊設計專案。"
  ja: "エンジニアが実問題をどう解くか：センシング、水処理、CAD、3Dプリントのチーム設計。"
  ko: "엔지니어가 실제 문제를 푸는 방식: 센싱·수처리·CAD·3D 프린팅 팀 설계 프로젝트."
  vi: "Kỹ sư giải quyết vấn đề thực tế ra sao: dự án nhóm với cảm biến, xử lý nước, CAD và in 3D."
  ms: "Cara jurutera selesaikan masalah sebenar: projek reka bentuk berkumpulan dengan penderiaan, rawatan air, CAD dan cetakan 3D."
  id: "Cara insinyur memecahkan masalah nyata: proyek desain tim dengan sensor, pengolahan air, CAD, dan cetak 3D."
  hi: "इंजीनियर असली समस्याएँ कैसे हल करते हैं: सेंसिंग, वॉटर ट्रीटमेंट, CAD और 3D प्रिंटिंग वाला टीम प्रोजेक्ट।"
outcomes:
  - en: "Make simplifying assumptions to solve a problem"
    zh: "做合理简化假设来解决问题"
    zh-TW: "做合理簡化假設來解決問題"
    ja: "単純化の仮定を置いて問題を解く"
    ko: "단순화 가정을 세워 문제를 푼다"
    vi: "Đặt giả định đơn giản hóa để giải bài toán"
    ms: "Buat andaian mudah untuk selesaikan masalah"
    id: "Membuat asumsi penyederhanaan untuk memecahkan masalah"
    hi: "सरल मान्यताएँ बनाकर समस्या हल करना"
  - en: "Build models of systems for design"
    zh: "为设计建立系统模型"
    zh-TW: "為設計建立系統模型"
    ja: "設計のためにシステムのモデルを作る"
    ko: "설계를 위해 시스템 모델을 만든다"
    vi: "Xây dựng mô hình hệ thống để thiết kế"
    ms: "Bina model sistem untuk reka bentuk"
    id: "Membangun model sistem untuk desain"
    hi: "डिज़ाइन के लिए सिस्टम के मॉडल बनाना"
