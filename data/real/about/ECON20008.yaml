code: ECON20008
year: 2026
learn:
  en: "How Australia's economy grew, from gold rushes and farming to mining booms, wars and crises, and why it matters now."
  zh: "澳洲经济如何发展：淘金、农业、矿业繁荣、战争与危机。"
  zh-TW: "澳洲經濟如何發展：淘金、農業、礦業繁榮、戰爭與危機。"
  ja: "ゴールドラッシュ、農業、資源ブーム、戦争、危機を経た豪州経済の歩み。"
  ko: "골드러시, 농업, 광업 붐, 전쟁과 위기를 거친 호주 경제의 발전."
  vi: "Kinh tế Úc phát triển ra sao, từ cơn sốt vàng, nông nghiệp đến bùng nổ khai khoáng, chiến tranh và khủng hoảng."
  ms: "Cara ekonomi Australia berkembang, dari demam emas dan pertanian hingga ledakan perlombongan dan krisis."
  id: "Cara ekonomi Australia tumbuh, dari demam emas dan pertanian sampai booming tambang, perang, dan krisis."
  hi: "ऑस्ट्रेलिया की अर्थव्यवस्था कैसे बढ़ी, गोल्ड रश और खेती से माइनिंग बूम, युद्ध और संकट तक।"
outcomes:
  - en: "Explain the main stages of Australia's economic development"
    zh: "解释澳洲经济发展的主要阶段"
    zh-TW: "說明澳洲經濟發展的主要階段"
    ja: "豪州経済の発展の主な段階を説明する"
    ko: "호주 경제 발전의 주요 단계 설명"
    vi: "Giải thích các giai đoạn chính của kinh tế Úc"
    ms: "Terangkan peringkat utama pembangunan ekonomi Australia"
    id: "Menjelaskan tahap utama perkembangan ekonomi Australia"
    hi: "ऑस्ट्रेलिया के आर्थिक विकास के मुख्य चरण समझाना"
  - en: "Show how geography, institutions, migration and policy mattered"
    zh: "说明地理、制度、移民和政策的作用"
    zh-TW: "說明地理、制度、移民和政策的作用"
    ja: "地理、制度、移民、政策の役割を示す"
    ko: "지리, 제도, 이민, 정책의 역할 설명"
    vi: "Chỉ ra vai trò của địa lý, thể chế, di cư và chính sách"
    ms: "Tunjuk peranan geografi, institusi, migrasi dan dasar"
    id: "Menunjukkan peran geografi, institusi, migrasi, dan kebijakan"
    hi: "भूगोल, संस्थाओं, प्रवास और नीति की भूमिका दिखाना"
  - en: "Use theory and data to explain past crises and booms"
    zh: "用理论和数据解释过去的危机与繁荣"
    zh-TW: "用理論和數據解釋過去的危機與繁榮"
    ja: "理論とデータで過去の危機や好況を説明する"
    ko: "이론과 데이터로 과거 위기와 호황 설명"
    vi: "Dùng lý thuyết và dữ liệu giải thích khủng hoảng, bùng nổ"
    ms: "Guna teori dan data untuk terangkan krisis dan ledakan lalu"
    id: "Memakai teori dan data untuk menjelaskan krisis dan booming"
    hi: "सिद्धांत और डेटा से पुराने संकट और उछाल समझाना"
