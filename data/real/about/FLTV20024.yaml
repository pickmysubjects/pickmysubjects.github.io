code: FLTV20024
year: 2026
learn:
  en: "Tell stories in Unreal Engine online: pitch an idea, then build a short cinematic in a small team with virtual production tools."
  zh: "在线用虚幻引擎讲故事：先提案，再与小组用虚拟制作工具做一段短片"
  zh-TW: "線上用虛幻引擎說故事：先提案，再與小組用虛擬製作工具做一段短片"
  ja: "オンラインでUnreal Engineを使った物語制作。企画を出し、少人数チームで短いシネマティックを作る。"
  ko: "온라인으로 언리얼 엔진 스토리텔링: 아이디어를 피칭하고 소규모 팀으로 짧은 시네마틱 제작."
  vi: "Kể chuyện bằng Unreal Engine trực tuyến: trình bày ý tưởng rồi cùng nhóm làm một đoạn phim ngắn."
  ms: "Bercerita dengan Unreal Engine dalam talian: bentang idea, kemudian bina sinematik pendek bersama pasukan."
  id: "Bercerita dengan Unreal Engine secara daring: ajukan ide, lalu buat sinematik pendek bersama tim kecil."
  hi: "ऑनलाइन अनरियल इंजन से कहानी कहना: आइडिया पिच करना, फिर छोटी टीम में शॉर्ट सिनेमैटिक बनाना।"
outcomes:
  - en: "Build a short cinematic sequence in Unreal Engine"
    zh: "用虚幻引擎做一段短片"
    zh-TW: "用虛幻引擎做一段短片"
    ja: "Unreal Engineで短いシネマティックを作る"
    ko: "언리얼 엔진으로 짧은 시네마틱 만들기"
    vi: "Dựng một đoạn phim ngắn bằng Unreal Engine"
    ms: "Membina jujukan sinematik pendek dalam Unreal Engine"
    id: "Membuat sekuens sinematik pendek di Unreal Engine"
    hi: "अनरियल इंजन में छोटा सिनेमैटिक सीक्वेंस बनाना"
  - en: "Pitch an original story clearly in a short video"
    zh: "用短视频清楚地提案原创故事"
    zh-TW: "用短影片清楚地提案原創故事"
    ja: "短い動画でオリジナルの物語を企画提案する"
    ko: "짧은 영상으로 독창적 이야기를 명확히 피칭하기"
    vi: "Trình bày ý tưởng truyện gốc rõ ràng qua video ngắn"
    ms: "Membentangkan cerita asli dengan jelas dalam video"
    id: "Mengajukan cerita orisinal dengan jelas lewat video"
    hi: "छोटे वीडियो में मौलिक कहानी साफ़ तरीके से पिच करना"
  - en: "Keep a project organised and record your progress"
    zh: "把项目文件管理好并记录进度"
    zh-TW: "把專案檔案管理好並記錄進度"
    ja: "プロジェクトを整理し進捗を記録する"
    ko: "프로젝트를 정리하고 진행 상황 기록하기"
    vi: "Giữ dự án ngăn nắp và ghi lại tiến độ"
    ms: "Menyusun projek dan merekod kemajuan"
    id: "Menjaga proyek tetap rapi dan mencatat kemajuan"
    hi: "प्रोजेक्ट व्यवस्थित रखना और प्रगति दर्ज करना"
