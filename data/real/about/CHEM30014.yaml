code: CHEM30014
year: 2026
learn:
  en: "Pick three specialised chemistry modules, such as computational, green or metals-in-medicine chemistry."
  zh: "从计算化学、绿色化学、有机合成等专题里选三个模块学。"
  zh-TW: "從計算化學、綠色化學、有機合成等專題裡選三個模組學。"
  ja: "計算化学、グリーンケミストリー、医療と金属の化学などから専門モジュールを3つ選ぶ。"
  ko: "계산화학, 녹색화학, 의약 금속화학 등 전문 화학 모듈 3개 선택."
  vi: "Chọn ba học phần hóa chuyên sâu, như hóa tính toán, hóa xanh hay kim loại trong y học."
  ms: "Pilih tiga modul kimia khusus, seperti kimia pengkomputeran, hijau atau logam dalam perubatan."
  id: "Pilih tiga modul kimia khusus, seperti kimia komputasi, hijau, atau logam dalam kedokteran."
  hi: "तीन स्पेशलाइज़्ड केमिस्ट्री मॉड्यूल चुनें, जैसे कंप्यूटेशनल, ग्रीन या मेडिसिन में धातु।"
outcomes:
  - en: "Solve problems in applied chemistry"
    zh: "解决应用化学问题"
    zh-TW: "解決應用化學問題"
    ja: "応用化学の問題を解く"
    ko: "응용화학 문제 해결하기"
    vi: "Giải quyết bài toán hóa ứng dụng"
    ms: "Selesaikan masalah kimia gunaan"
    id: "Memecahkan masalah kimia terapan"
    hi: "एप्लाइड केमिस्ट्री की समस्याएँ हल करना"
  - en: "Prepare for honours or masters chemistry study"
    zh: "为荣誉或硕士课程打基础"
    zh-TW: "為榮譽學位或碩士課程打基礎"
    ja: "化学の優等学位や修士課程に備える"
    ko: "화학 아너스나 석사 과정 준비하기"
    vi: "Chuẩn bị cho học honours hoặc thạc sĩ hóa"
    ms: "Bersedia untuk pengajian kimia honours atau sarjana"
    id: "Bersiap untuk studi kimia honours atau magister"
    hi: "केमिस्ट्री ऑनर्स या मास्टर्स की तैयारी"
  - en: "Build an advanced view across chemistry fields"
    zh: "建立跨化学各领域的进阶视角"
    zh-TW: "建立跨化學各領域的進階視角"
    ja: "化学の各分野にまたがる高度な視点を身につける"
    ko: "화학 여러 분야를 아우르는 심화 관점 갖추기"
    vi: "Có góc nhìn nâng cao xuyên suốt các ngành hóa học"
    ms: "Bina pandangan lanjutan merentas bidang kimia"
    id: "Membangun wawasan lanjut lintas bidang kimia"
    hi: "केमिस्ट्री के अलग-अलग क्षेत्रों पर उन्नत समझ बनाना"
