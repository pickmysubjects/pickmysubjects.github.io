code: MUSI20182
year: 2026
learn:
  en: "Lab sessions of observation and experiment with others, kept in a logbook and ending in a new collaborative performance piece."
  zh: "在实验课上观察与尝试，记录日志，最后呈现一部合作创作的新作品。"
  zh-TW: "在實驗課上觀察與嘗試，記錄日誌，最後呈現一部合作創作的新作品。"
  ja: "実験的なラボで観察と試行を記録し、最後に共同制作の新作を発表。"
  ko: "관찰과 실험의 랩 수업을 기록하고, 공동 창작 신작 발표로 마무리."
  vi: "Các buổi lab quan sát, thử nghiệm, ghi nhật ký và trình diễn tác phẩm hợp tác mới."
  ms: "Sesi makmal pemerhatian dan eksperimen, dicatat dalam log, diakhiri karya kolaboratif baharu."
  id: "Sesi lab observasi dan eksperimen, dicatat di logbook, diakhiri karya kolaboratif baru."
  hi: "प्रयोग और अवलोकन की लैब, लॉगबुक में दर्ज, अंत में नई सहयोगी रचना की प्रस्तुति।"
outcomes:
  - en: "Experiment with new ways to make music"
    zh: "尝试新的音乐创作方式"
    zh-TW: "嘗試新的音樂創作方式"
    ja: "新しい音楽づくりを試す"
    ko: "새로운 음악 제작 방식 실험"
    vi: "Thử cách làm nhạc mới"
    ms: "Bereksperimen cara baharu bermuzik"
    id: "Bereksperimen cara baru bermusik"
    hi: "संगीत बनाने के नए तरीके आज़माना"
  - en: "Collaborate on an original work"
    zh: "合作完成原创作品"
    zh-TW: "合作完成原創作品"
    ja: "共同でオリジナル作品を作る"
    ko: "공동으로 창작곡 만들기"
    vi: "Hợp tác tạo tác phẩm gốc"
    ms: "Bekerjasama menghasilkan karya asli"
    id: "Berkolaborasi membuat karya orisinal"
    hi: "मिलकर मौलिक रचना बनाना"
  - en: "Document and reflect on practice"
    zh: "记录并反思实践"
    zh-TW: "記錄並反思實踐"
    ja: "実践を記録し振り返る"
    ko: "실천을 기록하고 성찰하기"
    vi: "Ghi chép và suy ngẫm thực hành"
    ms: "Merekod dan merenung amalan"
    id: "Mendokumentasikan dan merefleksikan praktik"
    hi: "अभ्यास दर्ज कर उस पर विचार"
