code: DPSS10007
year: 2026
learn:
  en: "An online subject tracing how \"cool\" was born in fashion, music and film, and how it gets copied and sold."
  zh: "网课：追溯\"酷\"如何在时尚、音乐和电影中诞生，又如何被模仿和售卖。"
  zh-TW: "線上課：追溯「酷」如何在時尚、音樂與電影中誕生，又如何被模仿與販售。"
  ja: "オンライン科目。ファッション・音楽・映画で「クール」がどう生まれ、どう売られるか。"
  ko: "온라인 과목. 패션·음악·영화에서 '쿨'이 어떻게 생기고 팔리는지 추적."
  vi: "Môn trực tuyến về cách \"ngầu\" ra đời trong thời trang, nhạc, phim và bị thương mại hóa."
  ms: "Subjek dalam talian tentang asal \"cool\" dalam fesyen, muzik dan filem, dan cara ia dijual."
  id: "Mata kuliah daring tentang lahirnya \"keren\" di mode, musik, film, dan cara ia dijual."
  hi: "ऑनलाइन विषय: फ़ैशन, संगीत और फ़िल्म में \"कूल\" कैसे बना और कैसे बिका।"
outcomes:
  - en: "Trace the history of cool in fashion"
    zh: "追溯时尚中\"酷\"的历史"
    zh-TW: "追溯時尚中「酷」的歷史"
    ja: "ファッションにおける「クール」の歴史をたどる"
    ko: "패션 속 '쿨'의 역사 추적하기"
    vi: "Lần lại lịch sử \"ngầu\" trong thời trang"
    ms: "Jejak sejarah cool dalam fesyen"
    id: "Menelusuri sejarah keren dalam mode"
    hi: "फ़ैशन में कूल का इतिहास खोजना"
  - en: "Analyse images for style and attitude"
    zh: "分析图像中的风格和态度"
    zh-TW: "分析圖像中的風格與態度"
    ja: "画像からスタイルと態度を読み解く"
    ko: "이미지 속 스타일과 태도 분석하기"
    vi: "Phân tích phong cách trong hình ảnh"
    ms: "Analisis gaya dan sikap dalam imej"
    id: "Menganalisis gaya dan sikap dalam gambar"
    hi: "तस्वीरों में शैली और रवैये का विश्लेषण"
  - en: "Present visual research clearly"
    zh: "清晰地展示视觉研究"
    zh-TW: "清楚地呈現視覺研究"
    ja: "視覚的なリサーチを分かりやすく発表する"
    ko: "시각 자료 연구를 명확히 발표하기"
    vi: "Trình bày nghiên cứu hình ảnh rõ ràng"
    ms: "Bentang kajian visual dengan jelas"
    id: "Menyajikan riset visual dengan jelas"
    hi: "दृश्य शोध साफ़ प्रस्तुत करना"
