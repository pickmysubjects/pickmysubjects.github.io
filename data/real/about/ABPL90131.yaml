code: ABPL90131
year: 2027
learn:
  en: "Strategic planning from problem finding and site analysis, through research with GIS, to policy and an implementation plan."
  zh: "从发现问题和场地分析，到用GIS做背景研究，再到制定政策和实施计划的战略规划。"
  zh-TW: "從發現問題與基地分析，到用GIS做背景研究，再到制定政策與實施計畫的策略規劃。"
  ja: "問題発見と敷地分析から、GISを使った調査、政策立案、実施計画までの戦略計画。"
  ko: "문제 파악과 부지 분석부터 GIS 조사, 정책 수립, 실행 계획까지의 전략 계획."
  vi: "Lập kế hoạch chiến lược từ xác định vấn đề, phân tích địa điểm, nghiên cứu bằng GIS đến chính sách và thực thi."
  ms: "Perancangan strategik daripada mengenal masalah dan analisis tapak, kajian GIS, hingga dasar dan pelan pelaksanaan."
  id: "Perencanaan strategis dari identifikasi masalah, analisis tapak, riset dengan GIS, hingga kebijakan dan implementasi."
  hi: "समस्या पहचान और स्थल विश्लेषण से GIS शोध, नीति और कार्यान्वयन योजना तक रणनीतिक नियोजन।"
outcomes:
  - en: "Analyse data and planning policies"
    zh: "分析数据和规划政策"
    zh-TW: "分析資料與規劃政策"
    ja: "データと計画政策を分析する"
    ko: "데이터와 계획 정책 분석하기"
    vi: "Phân tích dữ liệu và chính sách quy hoạch"
    ms: "Menganalisis data dan dasar perancangan"
    id: "Menganalisis data dan kebijakan perencanaan"
    hi: "डेटा और नियोजन नीतियों का विश्लेषण"
  - en: "Write a strategic plan from a field trip"
    zh: "根据实地考察制定战略规划"
    zh-TW: "根據實地考察制定策略規劃"
    ja: "現地調査をもとに戦略計画を作る"
    ko: "현장 답사를 바탕으로 전략 계획 세우기"
    vi: "Lập kế hoạch chiến lược từ chuyến thực địa"
    ms: "Menyediakan pelan strategik daripada lawatan lapangan"
    id: "Menyusun rencana strategis dari kunjungan lapangan"
    hi: "फ़ील्ड ट्रिप से रणनीतिक योजना बनाना"
