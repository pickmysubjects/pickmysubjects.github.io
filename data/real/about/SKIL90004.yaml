code: SKIL90004
year: 2027
learn:
  en: "Planning and running science projects, covering scope, time, cost, risk and managing people."
  zh: "规划和管理科学项目，涵盖范围、进度、成本、风险和人员管理。"
  zh-TW: "規劃與管理科學專案，涵蓋範疇、時程、成本、風險與人員管理。"
  ja: "研究プロジェクトの計画と運営：範囲、スケジュール、コスト、リスク、人の管理。"
  ko: "과학 프로젝트 계획과 운영: 범위, 일정, 비용, 위험, 사람 관리."
  vi: "Lập kế hoạch và điều hành dự án khoa học: phạm vi, thời gian, chi phí, rủi ro và con người."
  ms: "Merancang dan mengurus projek sains: skop, masa, kos, risiko dan pengurusan orang."
  id: "Merencanakan dan menjalankan proyek sains: ruang lingkup, waktu, biaya, risiko, dan mengelola orang."
  hi: "विज्ञान परियोजनाओं की योजना और संचालन: दायरा, समय, लागत, जोखिम और लोगों का प्रबंधन।"
outcomes:
  - en: "Plan a science consulting project"
    zh: "为科学咨询项目制定计划"
    zh-TW: "為科學顧問專案制定計畫"
    ja: "科学コンサルティング案件の計画を立てる"
    ko: "과학 컨설팅 프로젝트 계획 세우기"
    vi: "Lập kế hoạch cho dự án tư vấn khoa học"
    ms: "Merancang projek perundingan sains"
    id: "Merencanakan proyek konsultasi sains"
    hi: "विज्ञान परामर्श परियोजना की योजना बनाना"
  - en: "Use PERT charts and the critical path method"
    zh: "使用 PERT 图和关键路径法"
    zh-TW: "使用 PERT 圖與要徑法"
    ja: "PERT図とクリティカルパス法を使う"
    ko: "PERT 차트와 주경로법 활용하기"
    vi: "Dùng sơ đồ PERT và phương pháp đường găng"
    ms: "Menggunakan carta PERT dan kaedah laluan kritikal"
    id: "Memakai diagram PERT dan metode jalur kritis"
    hi: "PERT चार्ट और क्रिटिकल पाथ विधि का उपयोग"
  - en: "Lead and work well in project teams"
    zh: "领导项目团队并与他人有效协作"
    zh-TW: "領導專案團隊並與他人有效協作"
    ja: "プロジェクトチームを率い、うまく協働する"
    ko: "프로젝트 팀을 이끌고 협업하기"
    vi: "Lãnh đạo và làm việc tốt trong nhóm dự án"
    ms: "Memimpin dan bekerja dengan baik dalam pasukan projek"
    id: "Memimpin dan bekerja baik dalam tim proyek"
    hi: "प्रोजेक्ट टीम का नेतृत्व और अच्छा सहयोग"
