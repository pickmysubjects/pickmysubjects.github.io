code: MGMT90038
year: 2027
learn:
  en: "How companies are governed: boards, independent directors, committees, CEO and chair roles, and reputation risk."
  zh: "公司如何治理：董事会、独立董事、委员会、CEO 与董事长的角色以及声誉风险。"
  zh-TW: "公司如何治理：董事會、獨立董事、委員會、執行長與董事長的角色以及聲譽風險。"
  ja: "企業統治の仕組み：取締役会、独立取締役、委員会、CEOと会長の役割、評判リスク。"
  ko: "기업 지배구조: 이사회, 사외이사, 위원회, CEO와 의장의 역할, 평판 위험."
  vi: "Doanh nghiệp được quản trị thế nào: hội đồng quản trị, thành viên độc lập, ủy ban, vai trò CEO và chủ tịch, rủi ro danh tiếng."
  ms: "Cara syarikat ditadbir: lembaga pengarah, pengarah bebas, jawatankuasa, peranan CEO dan pengerusi, risiko reputasi."
  id: "Cara perusahaan dikelola: dewan direksi, direktur independen, komite, peran CEO dan ketua, risiko reputasi."
  hi: "कंपनियों का संचालन कैसे होता है: बोर्ड, स्वतंत्र निदेशक, समितियाँ, CEO और चेयर की भूमिका, प्रतिष्ठा जोखिम।"
outcomes:
  - en: "Explain key corporate governance theories"
    zh: "解释主要公司治理理论"
    zh-TW: "說明主要公司治理理論"
    ja: "主なコーポレートガバナンス理論を説明する"
    ko: "주요 기업 지배구조 이론 설명하기"
    vi: "Giải thích các lý thuyết quản trị công ty chính"
    ms: "Menerangkan teori tadbir urus korporat utama"
    id: "Menjelaskan teori tata kelola perusahaan utama"
    hi: "कॉर्पोरेट गवर्नेंस के मुख्य सिद्धांत समझाना"
  - en: "Apply them to governance failure cases"
    zh: "将其用于治理失败案例"
    zh-TW: "將其應用於治理失敗個案"
    ja: "ガバナンス失敗の事例に応用する"
    ko: "지배구조 실패 사례에 적용하기"
    vi: "Áp dụng vào các vụ thất bại quản trị"
    ms: "Menggunakannya pada kes kegagalan tadbir urus"
    id: "Menerapkannya pada kasus kegagalan tata kelola"
    hi: "उन्हें गवर्नेंस विफलता के मामलों पर लागू करना"
