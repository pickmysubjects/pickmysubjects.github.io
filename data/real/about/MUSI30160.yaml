code: MUSI30160
year: 2026
learn:
  en: "Builds on Acting for Singers 1 with more stage and character work for opera and music theatre."
  zh: "在歌手表演课1基础上，深入舞台与角色塑造。"
  zh-TW: "在歌手表演課1基礎上，深入舞台與角色塑造。"
  ja: "歌手のための演技1の続き。舞台と役作りをさらに深める。"
  ko: "가수 연기 1에 이어 무대와 인물 연기를 심화."
  vi: "Tiếp nối phần 1 với nhiều luyện tập sân khấu và nhân vật hơn."
  ms: "Sambungan bahagian 1 dengan lebih banyak kerja pentas dan watak."
  id: "Lanjutan bagian 1 dengan lebih banyak latihan panggung dan karakter."
  hi: "भाग 1 के आगे, ओपेरा और म्यूज़िक थिएटर के लिए मंच और किरदार पर ज़्यादा काम।"
outcomes:
  - en: "Analyse a script or libretto for drama"
    zh: "分析剧本或歌剧脚本的戏剧性"
    zh-TW: "分析劇本或歌劇腳本的戲劇性"
    ja: "台本やリブレットを演劇的に分析する"
    ko: "대본이나 리브레토를 극적으로 분석하기"
    vi: "Phân tích kịch tính của kịch bản"
    ms: "Analisis drama dalam skrip atau libreto"
    id: "Menganalisis drama dalam naskah"
    hi: "स्क्रिप्ट या लिब्रेटो का नाटकीय विश्लेषण"
  - en: "Act with confidence while you sing"
    zh: "边唱边自信地表演"
    zh-TW: "邊唱邊自信地表演"
    ja: "歌いながら自信を持って演じる"
    ko: "노래하며 자신 있게 연기하기"
    vi: "Tự tin diễn xuất khi hát"
    ms: "Berlakon dengan yakin sambil menyanyi"
    id: "Berakting percaya diri sambil bernyanyi"
    hi: "गाते हुए आत्मविश्वास से अभिनय"
  - en: "Work well in a rehearsal group"
    zh: "在排练团队中良好合作"
    zh-TW: "在排練團隊中良好合作"
    ja: "稽古のグループでうまく協力する"
    ko: "리허설 그룹에서 잘 협력하기"
    vi: "Phối hợp tốt trong nhóm tập"
    ms: "Bekerja baik dalam kumpulan latihan"
    id: "Bekerja sama baik dalam grup latihan"
    hi: "रिहर्सल समूह में अच्छा सहयोग"
