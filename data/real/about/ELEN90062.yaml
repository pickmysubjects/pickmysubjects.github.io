code: ELEN90062
year: 2027
learn:
  en: "How high-speed signals, transistors and logic circuits behave, and how to design and test them."
  zh: "高速信号、晶体管和逻辑电路的特性，以及如何设计和测试它们。"
  zh-TW: "高速訊號、電晶體和邏輯電路的特性，以及如何設計與測試它們。"
  ja: "高速信号・トランジスタ・論理回路の振る舞いと、その設計・試験方法。"
  ko: "고속 신호, 트랜지스터, 논리 회로의 동작과 설계·시험 방법."
  vi: "Hành vi của tín hiệu tốc độ cao, transistor, mạch logic và cách thiết kế, kiểm tra chúng."
  ms: "Kelakuan isyarat berkelajuan tinggi, transistor dan litar logik, serta cara mereka bentuk dan mengujinya."
  id: "Perilaku sinyal kecepatan tinggi, transistor, dan rangkaian logika, serta cara merancang dan mengujinya."
  hi: "हाई-स्पीड सिग्नल, ट्रांज़िस्टर और लॉजिक सर्किट का व्यवहार, और उन्हें डिज़ाइन व टेस्ट करना।"
outcomes:
  - en: "Model high-speed circuits and interconnects"
    zh: "为高速电路和互连建模"
    zh-TW: "為高速電路與互連建模"
    ja: "高速回路と配線をモデル化する"
    ko: "고속 회로와 인터커넥트 모델링하기"
    vi: "Mô hình hóa mạch và đường kết nối tốc độ cao"
    ms: "Memodelkan litar dan sambungan berkelajuan tinggi"
    id: "Memodelkan rangkaian dan interkoneksi kecepatan tinggi"
    hi: "हाई-स्पीड सर्किट और इंटरकनेक्ट का मॉडल बनाना"
  - en: "Simulate and test high-speed systems with software and instruments"
    zh: "用软件和仪器仿真并测试高速系统"
    zh-TW: "用軟體和儀器模擬並測試高速系統"
    ja: "ソフトと計測器で高速システムをシミュレーション・試験する"
    ko: "소프트웨어와 장비로 고속 시스템 시뮬레이션·시험하기"
    vi: "Mô phỏng và kiểm tra hệ thống tốc độ cao bằng phần mềm và thiết bị"
    ms: "Mensimulasi dan menguji sistem berkelajuan tinggi dengan perisian dan alat"
    id: "Menyimulasikan dan menguji sistem kecepatan tinggi dengan perangkat lunak dan alat"
    hi: "सॉफ़्टवेयर और उपकरणों से हाई-स्पीड सिस्टम का सिमुलेशन व परीक्षण"
