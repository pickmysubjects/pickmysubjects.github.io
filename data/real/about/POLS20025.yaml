code: POLS20025
year: 2026
learn:
  en: "Core ideas in international relations, such as order, sovereignty, power, war and cooperation, and how different theories read them."
  zh: "国际关系中的核心概念，比如秩序、主权、权力、战争与合作，以及不同理论如何理解它们。"
  zh-TW: "國際關係中的核心概念，例如秩序、主權、權力、戰爭與合作，以及不同理論如何理解它們。"
  ja: "秩序、主権、権力、戦争、協力といった国際関係の中心概念と、それを各理論がどう捉えるかを学ぶ。"
  ko: "질서, 주권, 권력, 전쟁, 협력 같은 국제 관계의 핵심 개념과 이론마다 이를 어떻게 보는지 배운다."
  vi: "Các khái niệm cốt lõi của quan hệ quốc tế như trật tự, chủ quyền, quyền lực, chiến tranh và hợp tác, và các lý thuyết hiểu chúng ra sao."
  ms: "Idea teras hubungan antarabangsa seperti tertib, kedaulatan, kuasa, perang dan kerjasama, serta cara teori berbeza mentafsirnya."
  id: "Konsep inti hubungan internasional seperti tatanan, kedaulatan, kekuasaan, perang, dan kerja sama, serta cara berbagai teori memaknainya."
  hi: "अंतरराष्ट्रीय संबंधों के मूल विचार जैसे व्यवस्था, संप्रभुता, शक्ति, युद्ध और सहयोग, और अलग-अलग सिद्धांत इन्हें कैसे देखते हैं।"
outcomes:
  - en: "Explain core concepts of international relations"
    zh: "解释国际关系的核心概念"
    zh-TW: "解釋國際關係的核心概念"
    ja: "国際関係の中心概念を説明する"
    ko: "국제 관계의 핵심 개념 설명하기"
    vi: "Giải thích các khái niệm cốt lõi của quan hệ quốc tế"
    ms: "Terangkan konsep teras hubungan antarabangsa"
    id: "Menjelaskan konsep inti hubungan internasional"
    hi: "अंतरराष्ट्रीय संबंधों की मूल अवधारणाएँ समझाना"
  - en: "Compare how theories answer questions about power and war"
    zh: "比较各理论如何回答权力与战争的问题"
    zh-TW: "比較各理論如何回答權力與戰爭的問題"
    ja: "権力や戦争の問いに各理論がどう答えるか比べる"
    ko: "권력과 전쟁에 대한 이론별 답 비교하기"
    vi: "So sánh cách các lý thuyết trả lời câu hỏi về quyền lực và chiến tranh"
    ms: "Bandingkan jawapan teori tentang kuasa dan perang"
    id: "Membandingkan jawaban teori soal kekuasaan dan perang"
    hi: "शक्ति और युद्ध के सवालों पर सिद्धांतों के जवाबों की तुलना करना"
  - en: "Apply these concepts to world events"
    zh: "把这些概念用于分析国际事件"
    zh-TW: "把這些概念用於分析國際事件"
    ja: "これらの概念を世界の出来事に当てはめる"
    ko: "이 개념들을 국제 사건에 적용하기"
    vi: "Áp dụng các khái niệm này vào sự kiện thế giới"
    ms: "Guna konsep ini pada peristiwa dunia"
    id: "Menerapkan konsep ini pada peristiwa dunia"
    hi: "इन अवधारणाओं को दुनिया की घटनाओं पर लागू करना"
