code: HPSC20009
year: 2026
learn:
  en: "The social, ethical and philosophical sides of AI and technology, and how they blur the line between people and machines."
  zh: "人工智能与技术的社会、伦理和哲学面向，以及它们如何模糊人与机器的界限。"
  zh-TW: "人工智慧與科技的社會、倫理和哲學面向，以及它們如何模糊人與機器的界線。"
  ja: "AIと技術の社会的・倫理的・哲学的な側面と、人と機械の境界がどう曖昧になるかを学ぶ。"
  ko: "AI와 기술의 사회적·윤리적·철학적 측면과 사람과 기계의 경계가 어떻게 흐려지는지 배운다."
  vi: "Các khía cạnh xã hội, đạo đức và triết học của AI và công nghệ, và cách chúng xóa nhòa ranh giới người và máy."
  ms: "Sisi sosial, etika dan falsafah AI dan teknologi, serta cara ia mengaburkan sempadan manusia dan mesin."
  id: "Sisi sosial, etis, dan filosofis AI dan teknologi, serta cara keduanya mengaburkan batas manusia dan mesin."
  hi: "AI और तकनीक के सामाजिक, नैतिक और दार्शनिक पहलू, और वे इंसान व मशीन की सीमा को कैसे धुंधला करते हैं।"
outcomes:
  - en: "Explain key ideas from science and technology studies"
    zh: "解释科学技术研究的核心概念"
    zh-TW: "解釋科學技術研究的核心概念"
    ja: "科学技術社会論の主な考えを説明する"
    ko: "과학기술학의 핵심 개념 설명하기"
    vi: "Giải thích các ý chính của nghiên cứu khoa học và công nghệ"
    ms: "Terangkan idea utama kajian sains dan teknologi"
    id: "Menjelaskan gagasan utama studi sains dan teknologi"
    hi: "विज्ञान और प्रौद्योगिकी अध्ययन के मुख्य विचार समझाना"
  - en: "Analyse social effects of AI on work and life"
    zh: "分析人工智能对工作和生活的社会影响"
    zh-TW: "分析人工智慧對工作和生活的社會影響"
    ja: "AIが仕事と生活に与える社会的影響を分析する"
    ko: "AI가 일과 삶에 미치는 사회적 영향 분석하기"
    vi: "Phân tích tác động xã hội của AI lên công việc và đời sống"
    ms: "Analisis kesan sosial AI terhadap kerja dan hidup"
    id: "Menganalisis dampak sosial AI pada kerja dan hidup"
    hi: "काम और जीवन पर AI के सामाजिक प्रभाव का विश्लेषण करना"
  - en: "Assess ethical debates about new technology"
    zh: "评估关于新技术的伦理争论"
    zh-TW: "評估關於新科技的倫理爭論"
    ja: "新技術をめぐる倫理的議論を評価する"
    ko: "신기술에 관한 윤리 논쟁 평가하기"
    vi: "Đánh giá các tranh luận đạo đức về công nghệ mới"
    ms: "Nilai perdebatan etika tentang teknologi baharu"
    id: "Menilai perdebatan etis tentang teknologi baru"
    hi: "नई तकनीक पर नैतिक बहसों का आकलन करना"
