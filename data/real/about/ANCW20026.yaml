code: ANCW20026
year: 2026
learn:
  en: "Everyday life in the Roman empire, about 100 BC to AD 300, pieced together from inscriptions, archaeology and images."
  zh: "罗马帝国的日常生活（约公元前 100 年至公元 300 年），从铭文、考古和图像中还原。"
  zh-TW: "羅馬帝國的日常生活（約公元前 100 年至公元 300 年），從銘文、考古和圖像中還原。"
  ja: "紀元前100年頃から紀元300年頃のローマ帝国の日常生活を、碑文、考古資料、図像から読み解く。"
  ko: "기원전 100년경부터 기원후 300년경까지 로마 제국의 일상을 비문, 고고학, 이미지로 재구성한다."
  vi: "Đời sống thường ngày ở đế chế La Mã, khoảng 100 TCN đến 300 SCN, dựng lại từ bia ký, khảo cổ và hình ảnh."
  ms: "Kehidupan harian empayar Rom, kira-kira 100 SM hingga 300 M, dibina semula daripada inskripsi, arkeologi dan imej."
  id: "Kehidupan sehari-hari di Kekaisaran Romawi, sekitar 100 SM hingga 300 M, disusun dari prasasti, arkeologi dan gambar."
  hi: "रोमन साम्राज्य का रोज़मर्रा जीवन, लगभग 100 ई.पू. से 300 ई. तक, शिलालेखों, पुरातत्व और चित्रों से।"
outcomes:
  - en: "Use inscriptions and material evidence as sources"
    zh: "把铭文和实物证据当作史料使用"
    zh-TW: "把銘文和實物證據當作史料使用"
    ja: "碑文や物的証拠を史料として使う"
    ko: "비문과 물적 증거를 사료로 활용하기"
    vi: "Dùng bia ký và hiện vật làm nguồn sử liệu"
    ms: "Guna inskripsi dan bukti bahan sebagai sumber"
    id: "Memakai prasasti dan bukti material sebagai sumber"
    hi: "शिलालेखों और भौतिक साक्ष्य को स्रोत के रूप में इस्तेमाल करना"
  - en: "Describe family, work and death in Roman society"
    zh: "描述罗马社会的家庭、工作与死亡"
    zh-TW: "描述羅馬社會的家庭、工作與死亡"
    ja: "ローマ社会の家族、仕事、死を説明する"
    ko: "로마 사회의 가족, 노동, 죽음 설명하기"
    vi: "Mô tả gia đình, lao động và cái chết trong xã hội La Mã"
    ms: "Huraikan keluarga, kerja dan kematian dalam masyarakat Rom"
    id: "Menggambarkan keluarga, kerja dan kematian di masyarakat Romawi"
    hi: "रोमन समाज में परिवार, काम और मृत्यु का वर्णन करना"
  - en: "Compare Roman life with life today"
    zh: "将罗马人的生活与今天比较"
    zh-TW: "將羅馬人的生活與今天比較"
    ja: "ローマ人の生活を現代と比べる"
    ko: "로마인의 삶을 오늘날과 비교하기"
    vi: "So sánh đời sống La Mã với ngày nay"
    ms: "Bandingkan kehidupan Rom dengan masa kini"
    id: "Membandingkan kehidupan Romawi dengan masa kini"
    hi: "रोमन जीवन की आज से तुलना करना"
