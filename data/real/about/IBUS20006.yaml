code: IBUS20006
year: 2027
learn:
  en: "An intensive look at business in the Asia-Pacific: its economies, cultures, governance, strategy and marketing."
  zh: "集中学习亚太地区商业：经济、文化、治理、战略和营销。"
  zh-TW: "密集學習亞太地區商業：經濟、文化、治理、策略和行銷。"
  ja: "アジア太平洋のビジネスを集中的に学ぶ：経済・文化・ガバナンス・戦略・マーケティング。"
  ko: "아시아태평양 비즈니스 집중 과정: 경제, 문화, 거버넌스, 전략, 마케팅."
  vi: "Học chuyên sâu về kinh doanh ở châu Á - Thái Bình Dương: kinh tế, văn hóa, quản trị, chiến lược và tiếp thị."
  ms: "Kajian intensif perniagaan di Asia-Pasifik: ekonomi, budaya, tadbir urus, strategi dan pemasaran."
  id: "Kajian intensif bisnis di Asia-Pasifik: ekonomi, budaya, tata kelola, strategi, dan pemasaran."
  hi: "एशिया-प्रशांत में व्यापार पर गहन अध्ययन: अर्थव्यवस्था, संस्कृति, शासन, रणनीति और मार्केटिंग।"
outcomes:
  - en: "Compare Asian and Western business strategies"
    zh: "比较亚洲与西方企业的经营策略"
    zh-TW: "比較亞洲與西方企業的經營策略"
    ja: "アジアと欧米企業の戦略を比べる"
    ko: "아시아와 서구 기업의 전략 비교하기"
    vi: "So sánh chiến lược kinh doanh châu Á và phương Tây"
    ms: "Bandingkan strategi perniagaan Asia dan Barat"
    id: "Membandingkan strategi bisnis Asia dan Barat"
    hi: "एशियाई और पश्चिमी कंपनियों की रणनीतियों की तुलना करना"
  - en: "Apply cross-cultural business models to cases"
    zh: "把跨文化商业模型用于案例"
    zh-TW: "把跨文化商業模型用於案例"
    ja: "異文化ビジネスのモデルを事例に当てはめる"
    ko: "문화 간 비즈니스 모델을 사례에 적용하기"
    vi: "Áp dụng mô hình kinh doanh đa văn hóa vào tình huống"
    ms: "Guna model perniagaan silang budaya pada kes"
    id: "Menerapkan model bisnis lintas budaya pada kasus"
    hi: "क्रॉस-कल्चरल बिज़नेस मॉडल को केस पर लागू करना"
