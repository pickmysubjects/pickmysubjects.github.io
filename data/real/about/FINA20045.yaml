code: FINA20045
year: 2026
learn:
  en: "Hands-on screenprinting in the print studio: stencils, layering and repetition, with the history of the medium alongside."
  zh: "在版画工作室动手学丝网印刷：模版、套色和重复，同时了解丝网印刷的历史"
  zh-TW: "在版畫工作室動手學絹印：模版、套色和重複，同時了解絹印的歷史"
  ja: "版画工房でシルクスクリーンを実践。型、重ね刷り、反復を学び、その歴史も扱う。"
  ko: "판화 작업실에서 실크스크린 실습: 스텐실, 겹쳐 찍기, 반복, 그리고 매체의 역사."
  vi: "Thực hành in lụa trong xưởng in: khuôn in, in chồng lớp và lặp lại, kèm lịch sử kỹ thuật."
  ms: "Cetakan saring secara praktikal di studio: stensil, lapisan dan ulangan, berserta sejarahnya."
  id: "Praktik sablon di studio cetak: stensil, lapisan, dan pengulangan, beserta sejarah tekniknya."
  hi: "प्रिंट स्टूडियो में स्क्रीनप्रिंटिंग का अभ्यास: स्टेंसिल, परतें और दोहराव, साथ में इसका इतिहास।"
outcomes:
  - en: "Use a range of screenprinting processes safely"
    zh: "安全地使用多种丝网印刷工艺"
    zh-TW: "安全地使用多種絹印工藝"
    ja: "さまざまなシルクスクリーン技法を安全に使う"
    ko: "여러 실크스크린 공정을 안전하게 사용하기"
    vi: "Dùng an toàn nhiều quy trình in lụa"
    ms: "Menggunakan pelbagai proses cetakan saring dengan selamat"
    id: "Menggunakan berbagai proses sablon dengan aman"
    hi: "कई स्क्रीनप्रिंटिंग प्रक्रियाओं का सुरक्षित उपयोग करना"
  - en: "Develop original images through repetition and variation"
    zh: "通过重复与变化发展原创图像"
    zh-TW: "透過重複與變化發展原創圖像"
    ja: "反復と変化でオリジナルの図像を展開する"
    ko: "반복과 변주로 독창적인 이미지 발전시키기"
    vi: "Phát triển hình ảnh riêng qua lặp lại và biến tấu"
    ms: "Membangunkan imej asli melalui ulangan dan variasi"
    id: "Mengembangkan gambar orisinal lewat pengulangan dan variasi"
    hi: "दोहराव और बदलाव से मौलिक चित्र विकसित करना"
  - en: "Place your prints in screenprinting's history"
    zh: "把自己的作品放到丝网印刷的历史脉络中"
    zh-TW: "把自己的作品放到絹印的歷史脈絡中"
    ja: "自作をシルクスクリーンの歴史の中に位置づける"
    ko: "자신의 작품을 실크스크린 역사 속에 위치시키기"
    vi: "Đặt tác phẩm của mình trong lịch sử in lụa"
    ms: "Meletakkan cetakan anda dalam sejarah cetakan saring"
    id: "Menempatkan karya cetak dalam sejarah sablon"
    hi: "अपने प्रिंट को स्क्रीनप्रिंटिंग के इतिहास में रखना"
