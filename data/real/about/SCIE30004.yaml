code: SCIE30004
year: 2026
learn:
  en: "Two-week July intensive on science innovation across Asia and Australia, with visits to Melbourne's science and cultural sites."
  zh: "七月两周密集课，探讨亚洲与澳洲的科学创新，参观墨尔本科研与文化场所。"
  zh-TW: "七月兩週密集課，探討亞洲與澳洲的科學創新，參觀墨爾本科研與文化場所。"
  ja: "7月の2週間集中講座。アジアと豪州の科学イノベーションを、メルボルンの研究・文化施設訪問で学ぶ。"
  ko: "7월 2주 집중 과정. 아시아·호주의 과학 혁신을 멜버른 과학·문화 현장 방문과 함께 배우기."
  vi: "Khóa cấp tốc 2 tuần tháng 7 về đổi mới khoa học châu Á và Úc, tham quan nơi khoa học, văn hóa ở Melbourne."
  ms: "Intensif dua minggu Julai tentang inovasi sains di Asia dan Australia, dengan lawatan tapak sains Melbourne."
  id: "Intensif dua minggu Juli soal inovasi sains di Asia dan Australia, dengan kunjungan ke situs sains Melbourne."
  hi: "जुलाई का दो हफ़्ते का इंटेंसिव: एशिया और ऑस्ट्रेलिया में विज्ञान नवाचार, मेलबर्न के वैज्ञानिक-सांस्कृतिक स्थलों की सैर।"
outcomes:
  - en: "Explain how science drives industry and society"
    zh: "解释科学如何推动产业与社会"
    zh-TW: "解釋科學如何推動產業與社會"
    ja: "科学が産業と社会を動かす仕組みを説明する"
    ko: "과학이 산업과 사회를 이끄는 방식 설명하기"
    vi: "Giải thích khoa học thúc đẩy công nghiệp, xã hội thế nào"
    ms: "Terangkan cara sains memacu industri dan masyarakat"
    id: "Menjelaskan cara sains mendorong industri dan masyarakat"
    hi: "विज्ञान उद्योग और समाज को कैसे आगे बढ़ाता है, समझाना"
  - en: "Work across cultures and disciplines"
    zh: "跨文化、跨学科合作"
    zh-TW: "跨文化、跨學科合作"
    ja: "文化と分野を越えて協働する"
    ko: "문화와 학문을 넘나들며 협업하기"
    vi: "Làm việc xuyên văn hóa và liên ngành"
    ms: "Bekerja merentas budaya dan bidang"
    id: "Bekerja lintas budaya dan disiplin"
    hi: "संस्कृतियों और विषयों के पार काम करना"
  - en: "Reflect on professional practice in science"
    zh: "反思科学领域的职业实践"
    zh-TW: "反思科學領域的職業實務"
    ja: "科学分野の職業実践を振り返る"
    ko: "과학 분야 직업 실무 성찰하기"
    vi: "Suy ngẫm về hành nghề trong khoa học"
    ms: "Renungkan amalan profesional dalam sains"
    id: "Merefleksikan praktik profesional di bidang sains"
    hi: "विज्ञान में पेशेवर काम पर विचार करना"
