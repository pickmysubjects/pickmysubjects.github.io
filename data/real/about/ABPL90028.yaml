code: ABPL90028
year: 2027
learn:
  en: "Project management across a building project's life, using simulations, Microsoft Project and team reflection."
  zh: "贯穿建筑项目全周期的项目管理，用模拟、Microsoft Project 和团队反思来学。"
  zh-TW: "貫穿建築專案全週期的專案管理，透過模擬、Microsoft Project 與團隊反思來學。"
  ja: "建築プロジェクト全体のプロジェクト管理。シミュレーションや Microsoft Project を使う。"
  ko: "건축 프로젝트 전 주기의 프로젝트 관리. 시뮬레이션과 Microsoft Project 활용."
  vi: "Quản lý dự án suốt vòng đời công trình, qua mô phỏng, Microsoft Project và tự đánh giá nhóm."
  ms: "Pengurusan projek sepanjang kitaran hayat bangunan, melalui simulasi, Microsoft Project dan refleksi pasukan."
  id: "Manajemen proyek sepanjang siklus bangunan, lewat simulasi, Microsoft Project dan refleksi tim."
  hi: "भवन परियोजना के पूरे चक्र में प्रोजेक्ट प्रबंधन, सिमुलेशन और Microsoft Project के साथ।"
outcomes:
  - en: "Apply project management skills to each phase of a building project"
    zh: "在建筑项目各阶段运用项目管理能力"
    zh-TW: "在建築專案各階段運用專案管理能力"
    ja: "建築プロジェクトの各段階で管理手法を使う"
    ko: "건축 프로젝트 단계별로 관리 역량 적용하기"
    vi: "Áp dụng kỹ năng quản lý dự án cho từng giai đoạn"
    ms: "Menggunakan kemahiran pengurusan projek di setiap fasa"
    id: "Menerapkan keterampilan manajemen proyek di tiap fase"
    hi: "हर चरण में प्रोजेक्ट प्रबंधन कौशल लागू करना"
  - en: "Link project data to decisions under uncertainty"
    zh: "在不确定中把项目数据和决策联系起来"
    zh-TW: "在不確定中把專案數據和決策連結起來"
    ja: "不確実な状況でデータを判断につなげる"
    ko: "불확실성 속에서 데이터를 의사결정과 연결하기"
    vi: "Gắn dữ liệu dự án với quyết định khi chưa chắc chắn"
    ms: "Mengaitkan data projek dengan keputusan dalam ketidakpastian"
    id: "Mengaitkan data proyek dengan keputusan di tengah ketidakpastian"
    hi: "अनिश्चितता में परियोजना डेटा को निर्णयों से जोड़ना"
