code: ELEN90094
year: 2027
learn:
  en: "Statistical tools for high-dimensional data, like random matrix theory, covariance estimation, PCA and spectral clustering."
  zh: "高维数据的统计工具：随机矩阵理论、协方差估计、主成分分析与谱聚类。"
  zh-TW: "高維資料的統計工具：隨機矩陣理論、共變異數估計、主成分分析與譜分群。"
  ja: "高次元データの統計手法：ランダム行列、共分散推定、主成分分析、スペクトラルクラスタリング。"
  ko: "고차원 데이터 통계 도구: 랜덤 행렬, 공분산 추정, PCA, 스펙트럴 군집."
  vi: "Công cụ thống kê cho dữ liệu nhiều chiều: ma trận ngẫu nhiên, ước lượng hiệp phương sai, PCA, phân cụm phổ."
  ms: "Alat statistik data berdimensi tinggi: matriks rawak, anggaran kovarians, PCA, pengelompokan spektrum."
  id: "Alat statistik untuk data berdimensi tinggi: matriks acak, estimasi kovarians, PCA, klasterisasi spektral."
  hi: "हाई-डायमेंशनल डेटा के सांख्यिकीय टूल: रैंडम मैट्रिक्स, कोवेरियंस अनुमान, PCA, स्पेक्ट्रल क्लस्टरिंग।"
outcomes:
  - en: "Apply PCA and clustering to large datasets"
    zh: "对大数据集应用主成分分析与聚类"
    zh-TW: "對大型資料集應用主成分分析與分群"
    ja: "大規模データに PCA とクラスタリングを使う"
    ko: "대규모 데이터에 PCA·군집 적용하기"
    vi: "Áp dụng PCA và phân cụm cho dữ liệu lớn"
    ms: "Guna PCA dan pengelompokan pada data besar"
    id: "Menerapkan PCA dan klasterisasi pada data besar"
    hi: "बड़े डेटा पर PCA और क्लस्टरिंग लागू करना"
  - en: "Explain eigenvalue behaviour in random matrices"
    zh: "解释随机矩阵的特征值行为"
    zh-TW: "解釋隨機矩陣的特徵值行為"
    ja: "ランダム行列の固有値の振る舞いを説明する"
    ko: "랜덤 행렬 고유값의 성질 설명하기"
    vi: "Giải thích hành vi trị riêng của ma trận ngẫu nhiên"
    ms: "Terangkan kelakuan nilai eigen matriks rawak"
    id: "Menjelaskan perilaku nilai eigen matriks acak"
    hi: "रैंडम मैट्रिक्स में आइगेनवैल्यू का व्यवहार समझाना"
