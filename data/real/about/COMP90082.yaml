code: COMP90082
year: 2027
learn:
  en: "A team software project taken from analysis and design through to delivery, using real teamwork tools and processes."
  zh: "小组完成软件项目，从分析、设计到交付，使用真实的协作工具与流程。"
  zh-TW: "小組完成軟體專題，從分析、設計到交付，使用真實的協作工具與流程。"
  ja: "チームでソフトウェアを分析・設計から納品まで、実際のツールと手順で進める。"
  ko: "팀으로 분석·설계부터 인도까지 소프트웨어 프로젝트 수행, 실제 협업 도구 사용."
  vi: "Dự án phần mềm nhóm từ phân tích, thiết kế đến bàn giao, với công cụ làm việc nhóm thật."
  ms: "Projek perisian berkumpulan dari analisis dan reka bentuk hingga penghantaran, guna alat kerja pasukan."
  id: "Proyek perangkat lunak tim dari analisis, desain hingga serah terima, dengan alat kolaborasi nyata."
  hi: "टीम सॉफ़्टवेयर प्रोजेक्ट, विश्लेषण और डिज़ाइन से डिलीवरी तक, असली टीमवर्क टूल के साथ।"
outcomes:
  - en: "Deliver working software as part of a team"
    zh: "作为团队成员交付可用软件"
    zh-TW: "作為團隊成員交付可用軟體"
    ja: "チームで動くソフトウェアを届ける"
    ko: "팀원으로 동작하는 소프트웨어 인도하기"
    vi: "Bàn giao phần mềm chạy được cùng nhóm"
    ms: "Hasilkan perisian berfungsi sebagai ahli pasukan"
    id: "Menyerahkan perangkat lunak yang berjalan bersama tim"
    hi: "टीम के साथ चलने वाला सॉफ़्टवेयर देना"
  - en: "Use project management and teamwork tools"
    zh: "使用项目管理与协作工具"
    zh-TW: "使用專案管理與協作工具"
    ja: "プロジェクト管理・協働ツールを使う"
    ko: "프로젝트 관리·협업 도구 사용하기"
    vi: "Dùng công cụ quản lý dự án và làm việc nhóm"
    ms: "Guna alat pengurusan projek dan kerja berpasukan"
    id: "Memakai alat manajemen proyek dan kolaborasi"
    hi: "प्रोजेक्ट मैनेजमेंट और टीमवर्क टूल इस्तेमाल करना"
