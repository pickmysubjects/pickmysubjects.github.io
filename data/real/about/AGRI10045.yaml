code: AGRI10045
year: 2026
learn:
  en: "The physics, chemistry and maths behind farming: sunlight and energy, chemical bonds, heat, and analysing data sets."
  zh: "农业背后的物理、化学和数学：阳光与能量、化学键、热和数据分析。"
  zh-TW: "農業背後的物理、化學和數學：陽光與能量、化學鍵、熱和資料分析。"
  ja: "農業の土台となる物理・化学・数学：太陽光とエネルギー、化学結合、熱、データ分析。"
  ko: "농업의 바탕이 되는 물리·화학·수학: 햇빛과 에너지, 화학 결합, 열, 데이터 분석."
  vi: "Vật lý, hóa học và toán học nền tảng của nông nghiệp: ánh sáng mặt trời và năng lượng, liên kết hóa học, nhiệt và phân tích dữ liệu."
  ms: "Fizik, kimia dan matematik di sebalik pertanian: cahaya matahari dan tenaga, ikatan kimia, haba dan analisis data."
  id: "Fisika, kimia, dan matematika di balik pertanian: sinar matahari dan energi, ikatan kimia, panas, dan analisis data."
  hi: "खेती के पीछे की फ़िज़िक्स, केमिस्ट्री और गणित: धूप और ऊर्जा, केमिकल बॉन्ड, ऊष्मा और डेटा विश्लेषण।"
outcomes:
  - en: "Link basic physics and chemistry to soils, plants and animals"
    zh: "把基础物理化学和土壤、动植物联系起来"
    zh-TW: "把基礎物理化學和土壤、動植物連結起來"
    ja: "基礎的な物理・化学を土壌や動植物と結びつける"
    ko: "기초 물리·화학을 토양, 동식물과 연결하기"
    vi: "Liên hệ vật lý, hóa học cơ bản với đất, cây và vật nuôi"
    ms: "Kaitkan fizik dan kimia asas dengan tanah, tumbuhan dan haiwan"
    id: "Mengaitkan fisika dan kimia dasar dengan tanah, tanaman, dan hewan"
    hi: "बेसिक फ़िज़िक्स-केमिस्ट्री को मिट्टी, पौधों और पशुओं से जोड़ना"
  - en: "Explain how energy moves through living and earth systems"
    zh: "解释能量如何在生物和地球系统中流动"
    zh-TW: "解釋能量如何在生物和地球系統中流動"
    ja: "エネルギーが生物と地球のシステムをどう流れるか説明する"
    ko: "에너지가 생물·지구 시스템에서 어떻게 흐르는지 설명하기"
    vi: "Giải thích năng lượng di chuyển qua hệ sinh vật và trái đất"
    ms: "Terangkan aliran tenaga dalam sistem hidup dan bumi"
    id: "Menjelaskan aliran energi dalam sistem makhluk hidup dan bumi"
    hi: "समझाना कि ऊर्जा जीवों और पृथ्वी के तंत्र में कैसे चलती है"
  - en: "Graph data and find rates of change, maxima and minima"
    zh: "绘制数据图并求变化率、最大值和最小值"
    zh-TW: "繪製資料圖並求變化率、最大值和最小值"
    ja: "データをグラフにし、変化率や最大・最小を求める"
    ko: "데이터를 그래프로 그리고 변화율, 최댓값·최솟값 구하기"
    vi: "Vẽ đồ thị dữ liệu, tìm tốc độ thay đổi, cực đại và cực tiểu"
    ms: "Plot data dan cari kadar perubahan, maksimum dan minimum"
    id: "Membuat grafik data dan mencari laju perubahan, maksimum, minimum"
    hi: "डेटा का ग्राफ़ बनाना और परिवर्तन दर, अधिकतम व न्यूनतम निकालना"
