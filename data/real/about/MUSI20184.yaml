code: MUSI20184
year: 2026
learn:
  en: "More lab sessions of shared experiment, a logbook of what you tried, and a new collaborative piece presented at the end."
  zh: "更多共同实验的实验课，用日志记录尝试，最后呈现新的合作作品。"
  zh-TW: "更多共同實驗的實驗課，用日誌記錄嘗試，最後呈現新的合作作品。"
  ja: "共同実験のラボを続け、試みをログに記録し、最後に新しい共作を発表。"
  ko: "공동 실험 랩을 이어가며 기록하고, 마지막에 새 공동 작품 발표."
  vi: "Thêm các buổi lab thử nghiệm chung, ghi nhật ký và trình diễn tác phẩm hợp tác mới."
  ms: "Lebih banyak sesi makmal eksperimen bersama, log, dan karya kolaboratif baharu di akhir."
  id: "Lebih banyak sesi lab eksperimen bersama, logbook, dan karya kolaboratif baru di akhir."
  hi: "साझा प्रयोग की और लैब, लॉगबुक, और अंत में नई सहयोगी रचना की प्रस्तुति।"
outcomes:
  - en: "Experiment with new ways to make music"
    zh: "尝试新的音乐创作方式"
    zh-TW: "嘗試新的音樂創作方式"
    ja: "新しい音楽づくりを試す"
    ko: "새로운 음악 제작 방식 실험"
    vi: "Thử cách làm nhạc mới"
    ms: "Bereksperimen cara baharu bermuzik"
    id: "Bereksperimen cara baru bermusik"
    hi: "संगीत बनाने के नए तरीके आज़माना"
  - en: "Collaborate on an original work"
    zh: "合作完成原创作品"
    zh-TW: "合作完成原創作品"
    ja: "共同でオリジナル作品を作る"
    ko: "공동으로 창작곡 만들기"
    vi: "Hợp tác tạo tác phẩm gốc"
    ms: "Bekerjasama menghasilkan karya asli"
    id: "Berkolaborasi membuat karya orisinal"
    hi: "मिलकर मौलिक रचना बनाना"
  - en: "Document and reflect on practice"
    zh: "记录并反思实践"
    zh-TW: "記錄並反思實踐"
    ja: "実践を記録し振り返る"
    ko: "실천을 기록하고 성찰하기"
    vi: "Ghi chép và suy ngẫm thực hành"
    ms: "Merekod dan merenung amalan"
    id: "Mendokumentasikan dan merefleksikan praktik"
    hi: "अभ्यास दर्ज कर उस पर विचार"
