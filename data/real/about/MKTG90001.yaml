code: MKTG90001
year: 2027
learn:
  en: "Retail strategy where online and physical stores work together: store experience, merchandise, pricing and channel partners."
  zh: "线上线下门店融合的零售战略：门店体验、商品组合、定价和渠道伙伴。"
  zh-TW: "線上線下門市融合的零售策略：門市體驗、商品組合、定價與通路夥伴。"
  ja: "オンラインと実店舗が一体となる小売戦略：店舗体験、品揃え、価格、チャネルパートナー。"
  ko: "온라인과 오프라인 매장이 함께 움직이는 소매 전략: 매장 경험, 상품 구성, 가격, 채널 파트너."
  vi: "Chiến lược bán lẻ kết hợp cửa hàng trực tuyến và thực: trải nghiệm, hàng hóa, giá, đối tác kênh."
  ms: "Strategi runcit di mana kedai dalam talian dan fizikal bergabung: pengalaman kedai, barangan, harga, rakan saluran."
  id: "Strategi ritel saat toko daring dan fisik menyatu: pengalaman toko, barang dagangan, harga dan mitra saluran."
  hi: "ऐसी रिटेल रणनीति जिसमें ऑनलाइन और भौतिक स्टोर साथ चलते हैं: स्टोर अनुभव, माल, कीमत और चैनल साझेदार।"
outcomes:
  - en: "Solve retail problems with retail models"
    zh: "用零售模型解决零售问题"
    zh-TW: "以零售模型解決零售問題"
    ja: "小売のモデルで小売の課題を解く"
    ko: "소매 모델로 소매 문제 해결하기"
    vi: "Giải quyết vấn đề bán lẻ bằng mô hình bán lẻ"
    ms: "Menyelesaikan masalah runcit dengan model runcit"
    id: "Menyelesaikan masalah ritel dengan model ritel"
    hi: "रिटेल मॉडल से रिटेल की समस्याएँ सुलझाना"
  - en: "Manage the retail marketing mix"
    zh: "管理零售营销组合"
    zh-TW: "管理零售行銷組合"
    ja: "小売のマーケティング・ミックスを管理する"
    ko: "소매 마케팅 믹스 관리하기"
    vi: "Quản lý marketing mix bán lẻ"
    ms: "Mengurus campuran pemasaran runcit"
    id: "Mengelola bauran pemasaran ritel"
    hi: "रिटेल मार्केटिंग मिक्स संभालना"
