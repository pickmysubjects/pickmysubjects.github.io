code: AHIS20021
year: 2026
learn:
  en: "Pre-modern Chinese, Japanese and Korean art, from ink painting, calligraphy and ceramics to gardens, tombs and Buddhist art."
  zh: "前现代的中国、日本和韩国艺术，从水墨画、书法、陶瓷到园林、墓葬和佛教艺术。"
  zh-TW: "前現代的中國、日本和韓國藝術，從水墨畫、書法、陶瓷到園林、墓葬和佛教藝術。"
  ja: "水墨画・書・陶磁から庭園・墓・仏教美術まで、前近代の中国・日本・朝鮮の美術を学ぶ。"
  ko: "수묵화·서예·도자기부터 정원·무덤·불교 미술까지 전근대 중국·일본·한국 미술을 배운다."
  vi: "Nghệ thuật tiền hiện đại Trung Quốc, Nhật Bản và Triều Tiên, từ tranh thủy mặc, thư pháp, gốm đến vườn, lăng mộ và nghệ thuật Phật giáo."
  ms: "Seni pramoden China, Jepun dan Korea, dari lukisan dakwat, kaligrafi dan seramik hingga taman, makam dan seni Buddha."
  id: "Seni pramodern Tiongkok, Jepang dan Korea, dari lukisan tinta, kaligrafi dan keramik sampai taman, makam dan seni Buddha."
  hi: "पूर्व-आधुनिक चीनी, जापानी और कोरियाई कला, स्याही चित्रकला, सुलेख और मिट्टी के बर्तनों से बाग़ों, मक़बरों और बौद्ध कला तक।"
outcomes:
  - en: "Describe key media and genres of East Asian art"
    zh: "描述东亚艺术的主要媒介和类型"
    zh-TW: "描述東亞藝術的主要媒介和類型"
    ja: "東アジア美術の主な媒体とジャンルを説明する"
    ko: "동아시아 미술의 주요 매체와 장르 설명하기"
    vi: "Mô tả các chất liệu và thể loại chính của nghệ thuật Đông Á"
    ms: "Huraikan media dan genre utama seni Asia Timur"
    id: "Menguraikan media dan genre utama seni Asia Timur"
    hi: "पूर्वी एशियाई कला के मुख्य माध्यमों और विधाओं का वर्णन करना"
  - en: "Compare art traditions of China, Japan and Korea"
    zh: "比较中日韩的艺术传统"
    zh-TW: "比較中日韓的藝術傳統"
    ja: "中国・日本・朝鮮の美術の伝統を比べる"
    ko: "중국·일본·한국의 미술 전통 비교하기"
    vi: "So sánh truyền thống nghệ thuật Trung, Nhật, Hàn"
    ms: "Bandingkan tradisi seni China, Jepun dan Korea"
    id: "Membandingkan tradisi seni Tiongkok, Jepang dan Korea"
    hi: "चीन, जापान और कोरिया की कला परंपराओं की तुलना करना"
  - en: "Link artworks to religion, power and society"
    zh: "把艺术品与宗教、权力和社会联系起来"
    zh-TW: "把藝術品與宗教、權力和社會聯繫起來"
    ja: "作品を宗教・権力・社会と結びつける"
    ko: "작품을 종교·권력·사회와 연결하기"
    vi: "Liên hệ tác phẩm với tôn giáo, quyền lực và xã hội"
    ms: "Kaitkan karya seni dengan agama, kuasa dan masyarakat"
    id: "Mengaitkan karya seni dengan agama, kekuasaan dan masyarakat"
    hi: "कलाकृतियों को धर्म, सत्ता और समाज से जोड़ना"
