code: ABPL20058
year: 2026
learn:
  en: "A game design studio on a cyberpunk theme: interface mechanics, level and narrative design in Unreal Blueprints."
  zh: "以赛博朋克为主题的游戏设计工作室：在Unreal蓝图中做界面机制、关卡与叙事设计。"
  zh-TW: "以賽博龐克為主題的遊戲設計工作室：在 Unreal 藍圖中做介面機制、關卡與敘事設計。"
  ja: "サイバーパンクを題材にしたゲームデザインスタジオ：Unreal Blueprintでインターフェース、レベル、物語を設計。"
  ko: "사이버펑크 주제의 게임 디자인 스튜디오: Unreal 블루프린트로 인터페이스·레벨·내러티브 설계."
  vi: "Studio thiết kế game chủ đề cyberpunk: cơ chế giao diện, màn chơi, cốt truyện với Unreal Blueprints."
  ms: "Studio reka permainan bertema cyberpunk: mekanik antara muka, reka tahap dan naratif dengan Unreal Blueprints."
  id: "Studio desain game bertema cyberpunk: mekanika antarmuka, level, dan narasi dengan Unreal Blueprints."
  hi: "साइबरपंक थीम वाला गेम डिज़ाइन स्टूडियो: Unreal Blueprints में इंटरफ़ेस, लेवल और कहानी डिज़ाइन।"
outcomes:
  - en: "Design in-game interfaces that fit a theme"
    zh: "设计契合主题的游戏界面"
    zh-TW: "設計契合主題的遊戲介面"
    ja: "テーマに合うゲーム内UIを設計する"
    ko: "주제에 맞는 게임 UI 설계하기"
    vi: "Thiết kế giao diện trong game hợp chủ đề"
    ms: "Reka antara muka permainan sesuai tema"
    id: "Merancang antarmuka game sesuai tema"
    hi: "थीम के अनुरूप गेम इंटरफ़ेस डिज़ाइन करना"
  - en: "Turn a design brief into a playable concept"
    zh: "把设计任务变成可玩的概念"
    zh-TW: "把設計任務變成可玩的概念"
    ja: "課題をプレイできる構想にする"
    ko: "과제를 플레이 가능한 콘셉트로 만들기"
    vi: "Biến đề bài thành ý tưởng chơi được"
    ms: "Jadikan taklimat konsep yang boleh dimain"
    id: "Mengubah brief menjadi konsep yang bisa dimainkan"
    hi: "डिज़ाइन ब्रीफ़ को खेलने लायक कॉन्सेप्ट बनाना"
  - en: "Pitch a game and respond to critique"
    zh: "推介游戏并回应评审意见"
    zh-TW: "推介遊戲並回應評審意見"
    ja: "ゲームを提案し講評に応える"
    ko: "게임을 피칭하고 비평에 답하기"
    vi: "Thuyết trình game và phản hồi góp ý"
    ms: "Pitch permainan dan balas kritikan"
    id: "Mempresentasikan game dan menanggapi kritik"
    hi: "गेम पिच करना और समीक्षा का जवाब देना"
