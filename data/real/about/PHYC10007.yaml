code: PHYC10007
year: 2026
learn:
  en: "The physics behind the body and medicine: movement, fluids, waves, electricity and imaging, with live demos and labs."
  zh: "人体与医学背后的物理：运动、流体、波、电和成像，含课堂演示与实验。"
  zh-TW: "人體與醫學背後的物理：運動、流體、波、電和成像，含課堂演示與實驗。"
  ja: "体と医療を支える物理：運動、流体、波、電気、画像診断を、実演と実験で学ぶ。"
  ko: "인체와 의학 속 물리: 운동, 유체, 파동, 전기, 영상을 시연과 실험으로 배우기."
  vi: "Vật lý đằng sau cơ thể và y học: chuyển động, chất lỏng, sóng, điện và chẩn đoán hình ảnh."
  ms: "Fizik di sebalik tubuh dan perubatan: gerakan, bendalir, gelombang, elektrik dan pengimejan."
  id: "Fisika di balik tubuh dan kedokteran: gerak, fluida, gelombang, listrik, dan pencitraan, dengan demo dan praktikum."
  hi: "शरीर और चिकित्सा के पीछे की भौतिकी: गति, तरल, तरंगें, बिजली और इमेजिंग, डेमो और लैब के साथ।"
outcomes:
  - en: "Apply physics principles to the human body"
    zh: "将物理原理应用于人体"
    zh-TW: "將物理原理應用於人體"
    ja: "物理の原理を人体に当てはめる"
    ko: "물리 원리를 인체에 적용하기"
    vi: "Áp dụng nguyên lý vật lý vào cơ thể người"
    ms: "Gunakan prinsip fizik pada tubuh manusia"
    id: "Menerapkan prinsip fisika pada tubuh manusia"
    hi: "भौतिकी के सिद्धांत मानव शरीर पर लागू करना"
  - en: "Explain the physics of medical imaging and therapy"
    zh: "解释医学成像与治疗的物理原理"
    zh-TW: "解釋醫學成像與治療的物理原理"
    ja: "医用画像と治療の物理を説明する"
    ko: "의료 영상과 치료의 물리 설명하기"
    vi: "Giải thích vật lý của chẩn đoán hình ảnh và điều trị"
    ms: "Terangkan fizik pengimejan dan terapi perubatan"
    id: "Menjelaskan fisika pencitraan dan terapi medis"
    hi: "मेडिकल इमेजिंग और थेरेपी की भौतिकी समझाना"
  - en: "Run experiments and write lab reports"
    zh: "做实验并撰写实验报告"
    zh-TW: "做實驗並撰寫實驗報告"
    ja: "実験を行いレポートを書く"
    ko: "실험하고 실험 보고서 쓰기"
    vi: "Làm thí nghiệm và viết báo cáo"
    ms: "Jalankan eksperimen dan tulis laporan makmal"
    id: "Melakukan eksperimen dan menulis laporan praktikum"
    hi: "प्रयोग करना और लैब रिपोर्ट लिखना"
