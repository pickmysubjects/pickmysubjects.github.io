code: MUSI30050
year: 2026
learn:
  en: "Weekly lessons and classes on a second instrument or voice, ending in a 10-minute technical exam."
  zh: "第二乐器或声乐的每周课程，期末10分钟技术考试。"
  zh-TW: "第二樂器或聲樂的每週課程，期末10分鐘技術考試。"
  ja: "第二楽器または声楽の週1レッスンと授業、最後に10分の技術試験。"
  ko: "제2악기·성악 주간 레슨과 수업, 마지막에 10분 기술 시험."
  vi: "Học nhạc cụ hoặc thanh nhạc thứ hai hằng tuần, cuối kỳ thi kỹ thuật 10 phút."
  ms: "Kelas mingguan alat muzik kedua atau vokal, diakhiri ujian teknik 10 minit."
  id: "Les mingguan instrumen kedua atau vokal, diakhiri ujian teknik 10 menit."
  hi: "दूसरे वाद्य या गायन की साप्ताहिक कक्षाएँ, अंत में 10 मिनट की तकनीकी परीक्षा।"
outcomes:
  - en: "Play technical work on a second instrument"
    zh: "用第二乐器演奏技术曲目"
    zh-TW: "用第二樂器演奏技術曲目"
    ja: "第二楽器で技術曲を演奏する"
    ko: "제2악기로 기술 곡 연주하기"
    vi: "Chơi bài kỹ thuật trên nhạc cụ thứ hai"
    ms: "Main karya teknik pada alat kedua"
    id: "Memainkan karya teknik di instrumen kedua"
    hi: "दूसरे वाद्य पर तकनीकी रचनाएँ बजाना"
  - en: "Prepare well for a short technical exam"
    zh: "为简短技术考试做好准备"
    zh-TW: "為簡短技術考試做好準備"
    ja: "短い技術試験にしっかり備える"
    ko: "짧은 기술 시험 잘 준비하기"
    vi: "Chuẩn bị tốt cho bài thi kỹ thuật ngắn"
    ms: "Bersedia untuk ujian teknik ringkas"
    id: "Bersiap untuk ujian teknik singkat"
    hi: "छोटी तकनीकी परीक्षा की अच्छी तैयारी"
  - en: "Judge your own progress honestly"
    zh: "客观评估自己的进步"
    zh-TW: "客觀評估自己的進步"
    ja: "自分の上達を正直に評価する"
    ko: "자신의 발전을 솔직하게 평가하기"
    vi: "Tự đánh giá tiến bộ một cách trung thực"
    ms: "Menilai kemajuan sendiri dengan jujur"
    id: "Menilai kemajuan diri dengan jujur"
    hi: "अपनी प्रगति का ईमानदारी से आकलन"
