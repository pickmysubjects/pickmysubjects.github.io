code: POLS30037
year: 2026
learn:
  en: "A capstone where you learn to reason with data and evidence, then research a policy area of your choice and share the findings."
  zh: "一门毕业项目课：学会用数据和证据推理，再自选一个政策领域做研究并汇报结果。"
  zh-TW: "一門畢業專題課：學會用數據和證據推理，再自選一個政策領域做研究並報告結果。"
  ja: "データと証拠で考える力を身につけ、自分で選んだ政策分野を調べて結果を伝えるキャップストーン科目。"
  ko: "데이터와 증거로 추론하는 법을 익힌 뒤, 스스로 고른 정책 분야를 연구하고 결과를 전달하는 캡스톤 과목."
  vi: "Môn tổng kết: học cách lập luận bằng dữ liệu và bằng chứng, rồi nghiên cứu một lĩnh vực chính sách tự chọn và trình bày kết quả."
  ms: "Subjek capstone untuk belajar menaakul dengan data dan bukti, kemudian mengkaji bidang dasar pilihan sendiri dan berkongsi dapatan."
  id: "Mata kuliah capstone untuk belajar bernalar dengan data dan bukti, lalu meneliti bidang kebijakan pilihan sendiri dan membagikan temuannya."
  hi: "एक कैपस्टोन जिसमें डेटा और सबूतों से तर्क करना सीखते हैं, फिर अपनी पसंद के नीति क्षेत्र पर शोध करके नतीजे साझा करते हैं।"
outcomes:
  - en: "Use basic quantitative and qualitative reasoning"
    zh: "运用基本的定量和定性推理"
    zh-TW: "運用基本的量化和質性推理"
    ja: "基本的な量的・質的推論を使う"
    ko: "기본적인 양적·질적 추론 활용하기"
    vi: "Dùng lập luận định lượng và định tính cơ bản"
    ms: "Guna penaakulan kuantitatif dan kualitatif asas"
    id: "Memakai penalaran kuantitatif dan kualitatif dasar"
    hi: "बुनियादी मात्रात्मक और गुणात्मक तर्क इस्तेमाल करना"
  - en: "Carry out an applied political science project"
    zh: "完成一个应用政治学研究项目"
    zh-TW: "完成一個應用政治學研究專題"
    ja: "応用政治学のプロジェクトをやり遂げる"
    ko: "응용 정치학 프로젝트 수행하기"
    vi: "Thực hiện một dự án khoa học chính trị ứng dụng"
    ms: "Jalankan projek sains politik gunaan"
    id: "Menjalankan proyek ilmu politik terapan"
    hi: "एक व्यावहारिक राजनीति विज्ञान प्रोजेक्ट पूरा करना"
  - en: "Explain findings and policy advice to different audiences"
    zh: "向不同受众说明研究结果和政策建议"
    zh-TW: "向不同受眾說明研究結果和政策建議"
    ja: "研究結果と政策提言を相手に合わせて伝える"
    ko: "연구 결과와 정책 제언을 청중에 맞게 전달하기"
    vi: "Trình bày kết quả và khuyến nghị chính sách cho nhiều đối tượng"
    ms: "Terangkan dapatan dan saranan dasar kepada pelbagai khalayak"
    id: "Menyampaikan temuan dan rekomendasi kebijakan ke berbagai khalayak"
    hi: "अलग-अलग लोगों को नतीजे और नीति सुझाव समझाना"
