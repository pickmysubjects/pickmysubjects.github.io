code: MKTG90037
year: 2027
learn:
  en: "How firms create and keep value through customers, partners and other stakeholders, and the choices managers face."
  zh: "企业如何通过客户、合作伙伴和其他利益相关者创造并保持价值，以及管理者面临的选择。"
  zh-TW: "企業如何透過顧客、合作夥伴與其他利害關係人創造並維持價值，以及管理者面對的抉擇。"
  ja: "企業が顧客や取引先などとの関わりで価値をどう生み維持するか、経営者の選択を学ぶ。"
  ko: "기업이 고객·파트너 등 이해관계자를 통해 가치를 만들고 유지하는 방식과 관리자의 선택."
  vi: "Doanh nghiệp tạo và giữ giá trị qua khách hàng, đối tác, các bên liên quan ra sao, và lựa chọn của nhà quản lý."
  ms: "Cara firma mencipta dan mengekalkan nilai melalui pelanggan, rakan kongsi dan pihak lain, serta pilihan pengurus."
  id: "Cara perusahaan menciptakan dan menjaga nilai lewat pelanggan, mitra dan pihak lain, serta pilihan manajer."
  hi: "फ़र्में ग्राहकों, साझेदारों और अन्य हितधारकों के ज़रिए मूल्य कैसे बनाती और बनाए रखती हैं, और प्रबंधकों के विकल्प।"
outcomes:
  - en: "Explain what drives value creation"
    zh: "解释推动价值创造的因素"
    zh-TW: "說明推動價值創造的因素"
    ja: "価値創造を動かす要因を説明する"
    ko: "가치 창출 요인 설명하기"
    vi: "Giải thích yếu tố thúc đẩy tạo giá trị"
    ms: "Menerangkan pemacu penciptaan nilai"
    id: "Menjelaskan pendorong penciptaan nilai"
    hi: "मूल्य निर्माण को क्या चलाता है, समझाना"
  - en: "Position a firm to maximise value"
    zh: "为企业定位以实现价值最大化"
    zh-TW: "為企業定位以實現價值最大化"
    ja: "価値を最大化する企業の立ち位置を決める"
    ko: "가치를 극대화하도록 기업 포지셔닝하기"
    vi: "Định vị doanh nghiệp để tối đa hóa giá trị"
    ms: "Meletakkan kedudukan firma untuk nilai maksimum"
    id: "Memosisikan perusahaan untuk nilai maksimal"
    hi: "अधिकतम मूल्य के लिए फ़र्म की स्थिति तय करना"
