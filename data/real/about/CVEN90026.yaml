code: CVEN90026
year: 2027
learn:
  en: "How earthquakes, impact, blast and strong wind affect structures, and how to estimate these effects for design."
  zh: "地震、撞击、爆炸和强风如何影响结构，以及如何为设计估算这些作用。"
  zh-TW: "地震、撞擊、爆炸與強風如何影響結構，以及如何為設計估算這些作用。"
  ja: "地震・衝撃・爆発・強風が構造物に与える影響と、設計のためのその見積もり方。"
  ko: "지진·충격·폭발·강풍이 구조물에 미치는 영향과 설계를 위한 추정 방법."
  vi: "Động đất, va chạm, nổ và gió mạnh tác động lên kết cấu ra sao, và cách ước tính để thiết kế."
  ms: "Bagaimana gempa bumi, hentaman, letupan dan angin kencang menjejaskan struktur, serta cara menganggarnya untuk reka bentuk."
  id: "Bagaimana gempa, tumbukan, ledakan dan angin kencang memengaruhi struktur, serta cara memperkirakannya untuk desain."
  hi: "भूकंप, टक्कर, विस्फोट और तेज़ हवा संरचनाओं को कैसे प्रभावित करते हैं, और डिज़ाइन के लिए इनका अनुमान कैसे लगाएँ।"
outcomes:
  - en: "Estimate extreme load effects with hand calculations"
    zh: "用手算估计极端荷载的作用"
    zh-TW: "以手算估計極端載重的作用"
    ja: "手計算で極端荷重の影響を見積もる"
    ko: "손계산으로 극한 하중 영향 추정하기"
    vi: "Ước tính tác động tải cực đoan bằng tính tay"
    ms: "Menganggar kesan beban ekstrem dengan pengiraan manual"
    id: "Memperkirakan efek beban ekstrem dengan perhitungan manual"
    hi: "हाथ की गणना से चरम भार के प्रभाव का अनुमान लगाना"
  - en: "Model transient loads in spreadsheets to check software results"
    zh: "用电子表格模拟瞬态荷载，以校核软件结果"
    zh-TW: "以試算表模擬暫態載重，以校核軟體結果"
    ja: "表計算で過渡荷重をモデル化しソフトの結果を検証する"
    ko: "스프레드시트로 과도 하중을 모델링해 소프트웨어 결과 검증하기"
    vi: "Mô phỏng tải tức thời trên bảng tính để kiểm tra kết quả phần mềm"
    ms: "Memodelkan beban fana dalam hamparan untuk menyemak keputusan perisian"
    id: "Memodelkan beban transien di spreadsheet untuk memeriksa hasil perangkat lunak"
    hi: "सॉफ़्टवेयर परिणाम जाँचने के लिए स्प्रेडशीट में क्षणिक भार का मॉडल बनाना"
  - en: "Use the results to meet performance-based design goals"
    zh: "用分析结果满足基于性能的设计要求"
    zh-TW: "用分析結果滿足性能設計要求"
    ja: "解析結果を性能設計の目標に活かす"
    ko: "해석 결과를 성능 기반 설계 목표에 활용하기"
    vi: "Dùng kết quả để đáp ứng mục tiêu thiết kế theo tính năng"
    ms: "Menggunakan keputusan untuk mencapai matlamat reka bentuk berasaskan prestasi"
    id: "Memakai hasil untuk memenuhi tujuan desain berbasis kinerja"
    hi: "परिणामों से प्रदर्शन-आधारित डिज़ाइन लक्ष्य पूरे करना"
