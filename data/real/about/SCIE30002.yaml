code: SCIE30002
year: 2026
learn:
  en: "An 80-100 hour science or tech work placement, plus classes on careers and employability skills."
  zh: "80-100小时的科学或科技实习，外加职业规划课"
  zh-TW: "80-100小時的科學或科技實習，外加職涯規劃課"
  ja: "80-100時間の科学・技術系インターンと、キャリアや就職スキルの授業。"
  ko: "80-100시간 과학·기술 분야 현장실습과 진로·취업역량 수업."
  vi: "Thực tập 80-100 giờ trong ngành khoa học hoặc công nghệ, kèm lớp về nghề nghiệp và kỹ năng."
  ms: "Penempatan kerja sains atau teknologi selama 80-100 jam, serta kelas kerjaya dan kebolehpasaran."
  id: "Magang 80-100 jam di bidang sains atau teknologi, plus kelas karier dan keterampilan kerja."
  hi: "80-100 घंटे का विज्ञान या टेक वर्क प्लेसमेंट, साथ में करियर और रोज़गार कौशल की कक्षाएँ।"
outcomes:
  - en: "Apply your science skills in a real workplace"
    zh: "在真实职场运用科学技能"
    zh-TW: "在真實職場運用科學技能"
    ja: "実際の職場で科学のスキルを活かす"
    ko: "실제 직장에서 과학 역량 활용하기"
    vi: "Áp dụng kỹ năng khoa học nơi làm việc thật"
    ms: "Menggunakan kemahiran sains di tempat kerja sebenar"
    id: "Menerapkan keterampilan sains di tempat kerja nyata"
    hi: "असली कार्यस्थल पर विज्ञान कौशल लगाना"
  - en: "Produce and report on a workplace project"
    zh: "完成并汇报一个职场项目"
    zh-TW: "完成並報告一個職場專案"
    ja: "職場でのプロジェクトをまとめて報告する"
    ko: "직장 프로젝트를 수행하고 보고하기"
    vi: "Thực hiện và báo cáo một dự án công việc"
    ms: "Menghasilkan dan melaporkan projek tempat kerja"
    id: "Mengerjakan dan melaporkan proyek kerja"
    hi: "कार्यस्थल प्रोजेक्ट बनाना और उसकी रिपोर्ट देना"
  - en: "Reflect on your skills and career path"
    zh: "反思自己的能力和职业方向"
    zh-TW: "反思自己的能力和職涯方向"
    ja: "自分のスキルとキャリアを振り返る"
    ko: "자신의 역량과 진로 돌아보기"
    vi: "Nhìn lại kỹ năng và hướng nghề nghiệp"
    ms: "Merenung kemahiran dan laluan kerjaya"
    id: "Merefleksikan keterampilan dan jalur karier"
    hi: "अपने कौशल और करियर पर विचार करना"
