code: JAPN30012
year: 2026
learn:
  en: "How Japanese varies by region, age, gender and setting, from dialects to slang."
  zh: "日语如何因地区、年龄、性别和场合而不同，从方言到俚语。"
  zh-TW: "日語如何因地區、年齡、性別和場合而不同，從方言到俚語。"
  ja: "方言から若者言葉まで、地域・年齢・性別・場面による日本語の違い。"
  ko: "방언부터 속어까지, 지역·나이·성별·상황에 따른 일본어의 차이."
  vi: "Tiếng Nhật thay đổi theo vùng, tuổi, giới và hoàn cảnh, từ phương ngữ đến tiếng lóng."
  ms: "Cara bahasa Jepun berbeza mengikut wilayah, umur, gender dan situasi, daripada dialek hingga slanga."
  id: "Cara bahasa Jepang berbeda menurut daerah, usia, gender dan situasi, dari dialek hingga slang."
  hi: "क्षेत्र, उम्र, लिंग और स्थिति के साथ जापानी कैसे बदलती है, बोलियों से स्लैंग तक।"
outcomes:
  - en: "Describe major varieties of Japanese"
    zh: "描述日语的主要变体"
    zh-TW: "描述日語的主要變體"
    ja: "日本語の主な変種を説明する"
    ko: "일본어의 주요 변종 설명하기"
    vi: "Mô tả các biến thể chính của tiếng Nhật"
    ms: "Huraikan variasi utama bahasa Jepun"
    id: "Menjelaskan ragam utama bahasa Jepang"
    hi: "जापानी के मुख्य रूपों का वर्णन करना"
  - en: "Link language choices to social identity"
    zh: "把语言选择与社会身份联系起来"
    zh-TW: "把語言選擇與社會身分聯繫起來"
    ja: "言葉の選び方を社会的アイデンティティと結びつける"
    ko: "언어 선택을 사회적 정체성과 연결하기"
    vi: "Liên hệ cách dùng ngôn ngữ với bản sắc xã hội"
    ms: "Kaitkan pilihan bahasa dengan identiti sosial"
    id: "Mengaitkan pilihan bahasa dengan identitas sosial"
    hi: "भाषा के चुनाव को सामाजिक पहचान से जोड़ना"
  - en: "Analyse real examples of spoken Japanese"
    zh: "分析真实的日语口语例子"
    zh-TW: "分析真實的日語口語例子"
    ja: "実際の話し言葉の例を分析する"
    ko: "실제 일본어 구어 사례 분석하기"
    vi: "Phân tích ví dụ thật về tiếng Nhật nói"
    ms: "Analisis contoh sebenar bahasa Jepun lisan"
    id: "Menganalisis contoh nyata bahasa Jepang lisan"
    hi: "बोली जाने वाली जापानी के असली उदाहरणों का विश्लेषण करना"
