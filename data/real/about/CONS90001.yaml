code: CONS90001
year: 2027
learn:
  en: "Safety, environmental and quality management systems in construction, including writing WHS, environmental and quality plans."
  zh: "建筑业的安全、环境和质量管理体系，包括编写安全、环境和质量计划。"
  zh-TW: "營建業的安全、環境與品質管理系統，包括撰寫安全、環境與品質計畫。"
  ja: "建設の安全・環境・品質マネジメントシステムと、各計画書の作成。"
  ko: "건설의 안전·환경·품질 경영시스템과 관련 계획서 작성."
  vi: "Hệ thống quản lý an toàn, môi trường, chất lượng trong xây dựng và viết các kế hoạch."
  ms: "Sistem pengurusan keselamatan, alam sekitar dan kualiti dalam pembinaan serta pelannya."
  id: "Sistem manajemen K3, lingkungan dan mutu di konstruksi serta penyusunan rencananya."
  hi: "निर्माण में सुरक्षा, पर्यावरण और गुणवत्ता प्रबंधन प्रणालियाँ और उनकी योजनाएँ लिखना।"
outcomes:
  - en: "Prepare a WHS plan and safe work method statement"
    zh: "编写安全计划和安全作业方法说明"
    zh-TW: "編寫安全計畫與安全作業方法說明"
    ja: "安全衛生計画と作業手順書を作る"
    ko: "안전보건계획과 안전작업방법서 작성하기"
    vi: "Lập kế hoạch an toàn và biện pháp thi công an toàn"
    ms: "Menyediakan pelan WHS dan kenyataan kaedah kerja selamat"
    id: "Menyusun rencana K3 dan metode kerja aman"
    hi: "सुरक्षा योजना और सुरक्षित कार्य विधि तैयार करना"
  - en: "Write environmental and quality management plans"
    zh: "编写环境和质量管理计划"
    zh-TW: "撰寫環境與品質管理計畫"
    ja: "環境・品質管理計画を書く"
    ko: "환경·품질관리계획 작성하기"
    vi: "Viết kế hoạch quản lý môi trường và chất lượng"
    ms: "Menulis pelan pengurusan alam sekitar dan kualiti"
    id: "Menulis rencana manajemen lingkungan dan mutu"
    hi: "पर्यावरण और गुणवत्ता प्रबंधन योजनाएँ लिखना"
