code: ABPL90032
year: 2027
learn:
  en: "Building services like electrical, mechanical, air handling and hydraulics, and fitting them into the building and construction process."
  zh: "电气、机械、空调和给排水等建筑设备，以及如何融入建筑和施工过程。"
  zh-TW: "電氣、機械、空調與給排水等建築設備，以及如何整合進建築與施工流程。"
  ja: "電気・機械・空調・給排水などの建築設備と、建物・施工への統合。"
  ko: "전기·기계·공조·배관 등 건축 설비와 건물·시공 과정의 통합."
  vi: "Hệ thống kỹ thuật tòa nhà như điện, cơ, điều hòa, cấp thoát nước và cách tích hợp vào thi công."
  ms: "Servis bangunan seperti elektrik, mekanikal, pengudaraan dan hidraulik serta integrasinya."
  id: "Utilitas bangunan seperti listrik, mekanikal, tata udara dan plumbing serta integrasinya."
  hi: "बिजली, मैकेनिकल, एयर हैंडलिंग, हाइड्रोलिक जैसी भवन सेवाएँ और निर्माण में उनका समावेश।"
outcomes:
  - en: "Explain the main types of building services"
    zh: "说明主要的建筑设备类型"
    zh-TW: "說明主要的建築設備類型"
    ja: "主な建築設備の種類を説明する"
    ko: "주요 건축 설비 유형 설명하기"
    vi: "Giải thích các loại hệ thống kỹ thuật chính"
    ms: "Menerangkan jenis utama servis bangunan"
    id: "Menjelaskan jenis utama utilitas bangunan"
    hi: "भवन सेवाओं के मुख्य प्रकार समझाना"
  - en: "Plan space and installation needs for services"
    zh: "规划设备的空间与安装需求"
    zh-TW: "規劃設備的空間與安裝需求"
    ja: "設備のスペースと施工条件を計画する"
    ko: "설비의 공간·설치 요건 계획하기"
    vi: "Lập kế hoạch không gian và lắp đặt hệ thống"
    ms: "Merancang ruang dan pemasangan servis"
    id: "Merencanakan ruang dan pemasangan utilitas"
    hi: "सेवाओं की जगह और स्थापना की योजना"
