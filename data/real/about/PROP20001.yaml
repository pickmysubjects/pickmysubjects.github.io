code: PROP20001
year: 2026
learn:
  en: "Investment basics for property: shares, bonds and real estate, risk and return, and the time value of money."
  zh: "物业投资基础：股票、债券与房地产，风险与回报，以及货币时间价值。"
  zh-TW: "不動產投資基礎：股票、債券與房地產，風險與報酬，以及貨幣時間價值。"
  ja: "不動産のための投資の基礎：株式・債券・不動産、リスクとリターン、貨幣の時間価値。"
  ko: "부동산 투자 기초: 주식·채권·부동산, 위험과 수익, 화폐의 시간가치."
  vi: "Cơ bản đầu tư cho bất động sản: cổ phiếu, trái phiếu, nhà đất, rủi ro và lợi nhuận, giá trị thời gian của tiền."
  ms: "Asas pelaburan untuk hartanah: saham, bon dan hartanah, risiko dan pulangan, serta nilai masa wang."
  id: "Dasar investasi untuk properti: saham, obligasi, real estat, risiko dan imbal hasil, nilai waktu uang."
  hi: "प्रॉपर्टी के लिए निवेश की बुनियाद: शेयर, बॉन्ड, रियल एस्टेट, जोखिम-रिटर्न और पैसे का समय मूल्य।"
outcomes:
  - en: "Compare risk and return across assets"
    zh: "比较不同资产的风险与回报"
    zh-TW: "比較不同資產的風險與報酬"
    ja: "資産ごとのリスクとリターンを比べる"
    ko: "자산별 위험과 수익 비교하기"
    vi: "So sánh rủi ro và lợi nhuận giữa các tài sản"
    ms: "Banding risiko dan pulangan antara aset"
    id: "Membandingkan risiko dan imbal hasil antaraset"
    hi: "अलग-अलग एसेट के जोखिम और रिटर्न की तुलना"
  - en: "Calculate present and future values"
    zh: "计算现值与终值"
    zh-TW: "計算現值與終值"
    ja: "現在価値と将来価値を計算する"
    ko: "현재가치와 미래가치 계산하기"
    vi: "Tính giá trị hiện tại và tương lai"
    ms: "Kira nilai kini dan nilai masa depan"
    id: "Menghitung nilai sekarang dan masa depan"
    hi: "वर्तमान और भविष्य मूल्य की गणना करना"
  - en: "Read basic financial statements"
    zh: "读懂基础财务报表"
    zh-TW: "讀懂基礎財務報表"
    ja: "基本的な財務諸表を読む"
    ko: "기본 재무제표 읽기"
    vi: "Đọc báo cáo tài chính cơ bản"
    ms: "Baca penyata kewangan asas"
    id: "Membaca laporan keuangan dasar"
    hi: "बुनियादी वित्तीय विवरण पढ़ना"
