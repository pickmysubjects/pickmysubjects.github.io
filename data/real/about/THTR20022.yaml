code: THTR20022
year: 2026
learn:
  en: "A one-week improvisation intensive: using space, text and action to create new performance, including with audio and video."
  zh: "一周即兴密集课：运用空间、文本和动作创作新表演，也会用到音频和视频。"
  zh-TW: "一週即興密集課：運用空間、文本和動作創作新表演，也會用到音訊和影片。"
  ja: "1週間の即興集中講座：空間・テキスト・動きで新しい上演をつくり、音声や映像も使う。"
  ko: "일주일 즉흥 집중 과정: 공간·텍스트·행동으로 새 공연을 만들고 오디오·영상도 활용."
  vi: "Khóa ứng biến cấp tốc một tuần: dùng không gian, văn bản, hành động để tạo tác phẩm mới, kể cả audio, video."
  ms: "Intensif improvisasi seminggu: guna ruang, teks dan aksi untuk cipta persembahan baharu, termasuk audio dan video."
  id: "Intensif improvisasi seminggu: memakai ruang, teks, dan aksi untuk karya baru, termasuk audio dan video."
  hi: "एक हफ़्ते का इम्प्रोव इंटेंसिव: जगह, पाठ और क्रिया से नया प्रदर्शन बनाना, ऑडियो-वीडियो के साथ भी।"
outcomes:
  - en: "Improvise alone and with others"
    zh: "独自及与他人一起即兴表演"
    zh-TW: "獨自及與他人一起即興表演"
    ja: "一人でも他者とも即興する"
    ko: "혼자 그리고 함께 즉흥 연기하기"
    vi: "Ứng biến một mình và cùng người khác"
    ms: "Berimprovisasi sendiri dan bersama orang lain"
    id: "Berimprovisasi sendiri dan bersama orang lain"
    hi: "अकेले और दूसरों के साथ इम्प्रोवाइज़ करना"
  - en: "Shape raw material into short performances"
    zh: "把原始素材打磨成短篇表演"
    zh-TW: "把原始素材打磨成短篇表演"
    ja: "素材を短い作品に仕上げる"
    ko: "원재료를 짧은 공연으로 다듬기"
    vi: "Biến chất liệu thô thành tiết mục ngắn"
    ms: "Bentuk bahan mentah menjadi persembahan pendek"
    id: "Mengolah bahan mentah jadi pertunjukan singkat"
    hi: "कच्ची सामग्री को छोटे प्रदर्शनों में ढालना"
  - en: "Reflect on your creative method"
    zh: "反思自己的创作方法"
    zh-TW: "反思自己的創作方法"
    ja: "自分の創作方法を振り返る"
    ko: "자신의 창작 방법 성찰하기"
    vi: "Suy ngẫm phương pháp sáng tạo của mình"
    ms: "Renungkan kaedah kreatif sendiri"
    id: "Merefleksikan metode kreatif sendiri"
    hi: "अपनी रचनात्मक पद्धति पर विचार करना"
