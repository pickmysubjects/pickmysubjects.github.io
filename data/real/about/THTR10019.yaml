code: THTR10019
year: 2026
learn:
  en: "For English as an additional language: weekly work with a voice specialist on clear pronunciation, fluency and confident speaking."
  zh: "面向英语非母语者：每周与嗓音专家练习清晰发音、流利度和自信表达。"
  zh-TW: "面向英語非母語者：每週與嗓音專家練習清晰發音、流利度和自信表達。"
  ja: "英語を第二言語とする人向け。発声の専門家と毎週、発音・流暢さ・話す自信を磨く。"
  ko: "영어가 모국어가 아닌 학생 대상. 매주 발성 전문가와 정확한 발음·유창성·자신감 연습."
  vi: "Cho người học tiếng Anh như ngôn ngữ thêm: luyện phát âm rõ, trôi chảy và tự tin với chuyên gia giọng nói."
  ms: "Untuk penutur bahasa Inggeris tambahan: latihan mingguan sebutan jelas, kelancaran dan yakin bercakap."
  id: "Untuk penutur bahasa Inggris tambahan: latihan mingguan pelafalan jelas, kelancaran, dan percaya diri bicara."
  hi: "अंग्रेज़ी दूसरी भाषा वालों के लिए: वॉयस विशेषज्ञ के साथ साफ़ उच्चारण, प्रवाह और आत्मविश्वास का अभ्यास।"
outcomes:
  - en: "Pronounce English sounds more clearly"
    zh: "更清晰地发出英语语音"
    zh-TW: "更清晰地發出英語語音"
    ja: "英語の音をよりはっきり発音する"
    ko: "영어 소리를 더 정확히 발음하기"
    vi: "Phát âm tiếng Anh rõ hơn"
    ms: "Sebut bunyi bahasa Inggeris dengan lebih jelas"
    id: "Melafalkan bunyi bahasa Inggris lebih jelas"
    hi: "अंग्रेज़ी की ध्वनियाँ और साफ़ बोलना"
  - en: "Speak fluently in prepared and live talks"
    zh: "在准备好的和现场的发言中流利表达"
    zh-TW: "在準備好的和現場的發言中流利表達"
    ja: "準備した発表でも即興でも流暢に話す"
    ko: "준비된 발표와 즉석 발언에서 유창하게 말하기"
    vi: "Nói trôi chảy khi chuẩn bị trước và khi nói trực tiếp"
    ms: "Bercakap lancar dalam ucapan tersedia dan langsung"
    id: "Berbicara lancar dalam presentasi siap dan langsung"
    hi: "तैयार और लाइव बातचीत में धाराप्रवाह बोलना"
  - en: "Use the IPA to work on your own accent"
    zh: "借助国际音标改善自己的口音"
    zh-TW: "借助國際音標改善自己的口音"
    ja: "IPAを使って自分の発音を直す"
    ko: "IPA로 자신의 억양 다듬기"
    vi: "Dùng IPA để cải thiện giọng của mình"
    ms: "Guna IPA untuk memperbaiki loghat sendiri"
    id: "Memakai IPA untuk memperbaiki aksen sendiri"
    hi: "IPA से अपने उच्चारण पर काम करना"
