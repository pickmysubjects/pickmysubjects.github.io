code: ABPL90266
year: 2027
learn:
  en: "Social exclusion in cities and how planning can make cities more inclusive for groups like youth, older people, refugees and women."
  zh: "城市中的社会排斥，以及规划如何让城市对青年、老人、难民和女性等群体更包容。"
  zh-TW: "城市中的社會排除，以及規劃如何讓城市對青年、長者、難民與女性等族群更包容。"
  ja: "都市の社会的排除と、若者・高齢者・難民・女性などに開かれた都市計画。"
  ko: "도시의 사회적 배제와 청년·노인·난민·여성을 포용하는 계획."
  vi: "Loại trừ xã hội ở đô thị và cách quy hoạch giúp thành phố bao trùm hơn cho người yếu thế."
  ms: "Pengecualian sosial di bandar dan cara perancangan menjadikan bandar lebih inklusif."
  id: "Eksklusi sosial di kota dan cara perencanaan membuat kota lebih inklusif."
  hi: "शहरों में सामाजिक बहिष्कार और योजना से उन्हें युवाओं, बुज़ुर्गों, शरणार्थियों व महिलाओं के लिए समावेशी बनाना।"
outcomes:
  - en: "Analyse where social exclusion in cities comes from"
    zh: "分析城市社会排斥的根源"
    zh-TW: "分析城市社會排除的根源"
    ja: "都市の社会的排除の原因を分析する"
    ko: "도시 사회적 배제의 원인 분석하기"
    vi: "Phân tích nguồn gốc loại trừ xã hội đô thị"
    ms: "Menganalisis punca pengecualian sosial bandar"
    id: "Menganalisis asal eksklusi sosial di kota"
    hi: "शहरी सामाजिक बहिष्कार के कारणों का विश्लेषण"
  - en: "Assess urban policies against inclusion principles"
    zh: "按包容原则评估城市政策"
    zh-TW: "依包容原則評估都市政策"
    ja: "包摂の原則で都市政策を評価する"
    ko: "포용 원칙으로 도시 정책 평가하기"
    vi: "Đánh giá chính sách theo nguyên tắc bao trùm"
    ms: "Menilai dasar bandar mengikut prinsip inklusif"
    id: "Menilai kebijakan kota dengan prinsip inklusi"
    hi: "समावेशन सिद्धांतों पर शहरी नीतियों का आकलन"
