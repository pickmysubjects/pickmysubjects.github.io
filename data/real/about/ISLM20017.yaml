code: ISLM20017
year: 2026
learn:
  en: "How racism, Islamophobia and antisemitism spread, and how young people push back through protest, media and pop culture."
  zh: "种族主义、伊斯兰恐惧和反犹主义如何蔓延，年轻人如何通过抗议、媒体和流行文化回击。"
  zh-TW: "種族主義、伊斯蘭恐懼和反猶主義如何蔓延，年輕人如何透過抗議、媒體和流行文化回擊。"
  ja: "人種差別、イスラム嫌悪、反ユダヤ主義がどう広がり、若者が抗議・メディア・ポップカルチャーでどう抵抗するかを学ぶ。"
  ko: "인종차별, 이슬람 혐오, 반유대주의가 어떻게 퍼지고 젊은이들이 시위, 미디어, 대중문화로 어떻게 맞서는지 배운다."
  vi: "Phân biệt chủng tộc, bài Hồi giáo và bài Do Thái lan rộng ra sao, và giới trẻ phản kháng bằng biểu tình, truyền thông, văn hóa đại chúng thế nào."
  ms: "Cara perkauman, Islamofobia dan antisemitisme merebak, dan cara anak muda melawan melalui protes, media dan budaya pop."
  id: "Cara rasisme, Islamofobia, dan antisemitisme menyebar, dan cara anak muda melawan lewat protes, media, dan budaya pop."
  hi: "नस्लवाद, इस्लामोफ़ोबिया और यहूदी-विरोध कैसे फैलते हैं, और युवा विरोध, मीडिया और पॉप संस्कृति से कैसे जवाब देते हैं।"
outcomes:
  - en: "Explain how prejudice is produced and spread"
    zh: "解释偏见如何产生与传播"
    zh-TW: "解釋偏見如何產生與傳播"
    ja: "偏見がどう生まれ広がるか説明する"
    ko: "편견이 만들어지고 퍼지는 방식 설명하기"
    vi: "Giải thích định kiến được tạo ra và lan truyền ra sao"
    ms: "Terangkan cara prasangka dihasilkan dan disebarkan"
    id: "Menjelaskan cara prasangka diciptakan dan disebarkan"
    hi: "पूर्वाग्रह कैसे बनता और फैलता है, समझाना"
  - en: "Analyse resistance in music, comedy and fashion"
    zh: "分析音乐、喜剧和时尚中的抵抗"
    zh-TW: "分析音樂、喜劇和時尚中的抵抗"
    ja: "音楽・コメディ・ファッションでの抵抗を分析する"
    ko: "음악, 코미디, 패션 속 저항 분석하기"
    vi: "Phân tích sự phản kháng trong âm nhạc, hài kịch và thời trang"
    ms: "Analisis penentangan dalam muzik, komedi dan fesyen"
    id: "Menganalisis perlawanan lewat musik, komedi, dan fesyen"
    hi: "संगीत, कॉमेडी और फ़ैशन में प्रतिरोध का विश्लेषण करना"
  - en: "Assess the role of online platforms"
    zh: "评估网络平台的作用"
    zh-TW: "評估網路平台的作用"
    ja: "オンラインプラットフォームの役割を評価する"
    ko: "온라인 플랫폼의 역할 평가하기"
    vi: "Đánh giá vai trò của các nền tảng trực tuyến"
    ms: "Nilai peranan platform dalam talian"
    id: "Menilai peran platform daring"
    hi: "ऑनलाइन प्लेटफ़ॉर्म की भूमिका का आकलन करना"
