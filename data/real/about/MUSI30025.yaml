code: MUSI30025
year: 2026
learn:
  en: "Writing and arranging for Western instruments: ranges, timbres, clear scores and parts, and directing your music in workshops."
  zh: 为西方乐器写作和编曲：音域、音色、清晰的总谱与分谱，并在工作坊中指挥。
  zh-TW: 為西方樂器寫作與編曲：音域、音色、清晰的總譜與分譜，並在工作坊中指揮。
  ja: 西洋楽器のための作曲・編曲。音域、音色、明確なスコアとパート譜、ワークショップでの指揮。
  ko: "서양 악기를 위한 작곡·편곡: 음역, 음색, 명확한 총보와 파트보, 워크숍에서 지휘."
  vi: "Viết và phối khí cho nhạc cụ phương Tây: âm vực, âm sắc, tổng phổ và phân phổ rõ ràng, chỉ huy ở workshop."
  ms: "Menulis dan mengubah untuk alat Barat: julat, warna bunyi, skor dan bahagian jelas, dan memimpin bengkel."
  id: "Menulis dan mengaransemen untuk instrumen Barat: wilayah nada, timbre, partitur jelas, dan memimpin lokakarya."
  hi: "पश्चिमी वाद्यों के लिए लेखन व अरेंजिंग: रेंज, टिम्बर, साफ़ स्कोर व पार्ट्स, वर्कशॉप में निर्देशन।"
outcomes:
  - en: Know instrument ranges and timbres
    zh: 掌握乐器音域和音色
    zh-TW: 掌握樂器音域與音色
    ja: 楽器の音域と音色を知る
    ko: 악기 음역과 음색 알기
    vi: Nắm âm vực và âm sắc nhạc cụ
    ms: Kenali julat dan warna bunyi alat
    id: Memahami wilayah nada dan timbre
    hi: वाद्यों की रेंज और टिम्बर जानना
  - en: Arrange music for ensembles
    zh: 为合奏团编曲
    zh-TW: 為合奏團編曲
    ja: アンサンブル用に編曲する
    ko: 앙상블을 위해 편곡하기
    vi: Phối khí cho dàn nhạc
    ms: Gubah susunan untuk ensembel
    id: Mengaransemen untuk ansambel
    hi: समूह के लिए संगीत अरेंज करना
  - en: Prepare clear scores and parts
    zh: 制作清晰的总谱和分谱
    zh-TW: 製作清晰的總譜與分譜
    ja: 明確なスコアとパート譜を作る
    ko: 명확한 총보와 파트보 만들기
    vi: Soạn tổng phổ và phân phổ rõ ràng
    ms: Sediakan skor dan bahagian yang jelas
    id: Menyiapkan partitur dan part yang jelas
    hi: साफ़ स्कोर और पार्ट्स तैयार करना
