code: ENEN30003
year: 2026
learn:
  en: "Using simulation models and optimisation to design environmental systems with competing goals."
  zh: "用仿真模型和优化方法设计目标相互冲突的环境系统。"
  zh-TW: "用模擬模型和最佳化方法設計目標相互衝突的環境系統。"
  ja: "シミュレーションと最適化で、目的が競合する環境システムを設計する。"
  ko: "시뮬레이션과 최적화로 목표가 상충하는 환경 시스템을 설계한다."
  vi: "Dùng mô hình mô phỏng và tối ưu hóa để thiết kế hệ thống môi trường có mục tiêu xung đột."
  ms: "Guna model simulasi dan pengoptimuman untuk mereka sistem alam sekitar dengan matlamat bersaing."
  id: "Memakai model simulasi dan optimasi untuk merancang sistem lingkungan dengan tujuan yang bersaing."
  hi: "सिमुलेशन मॉडल और ऑप्टिमाइज़ेशन से टकराते लक्ष्यों वाले पर्यावरण सिस्टम डिज़ाइन करना।"
outcomes:
  - en: "Apply optimisation algorithms to design problems"
    zh: "用优化算法解决设计问题"
    zh-TW: "用最佳化演算法解決設計問題"
    ja: "最適化アルゴリズムを設計問題に使う"
    ko: "최적화 알고리즘을 설계 문제에 적용한다"
    vi: "Áp dụng thuật toán tối ưu cho bài toán thiết kế"
    ms: "Guna algoritma pengoptimuman untuk masalah reka bentuk"
    id: "Menerapkan algoritma optimasi pada masalah desain"
    hi: "डिज़ाइन समस्याओं पर ऑप्टिमाइज़ेशन एल्गोरिदम लगाना"
  - en: "Make decisions with multiple objectives"
    zh: "在多目标之间做出决策"
    zh-TW: "在多目標之間做出決策"
    ja: "複数の目的の間で意思決定する"
    ko: "여러 목표 사이에서 결정을 내린다"
    vi: "Ra quyết định với nhiều mục tiêu"
    ms: "Buat keputusan dengan pelbagai objektif"
    id: "Mengambil keputusan dengan banyak tujuan"
    hi: "कई लक्ष्यों के बीच निर्णय लेना"
