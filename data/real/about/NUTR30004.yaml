code: NUTR30004
year: 2026
learn:
  en: "Current nutrition research: sports nutrition, gene–diet links, fad diets, supplements, gut microbiome and more."
  zh: "营养学前沿研究：运动营养、基因与饮食、流行节食、补充剂、肠道菌群等。"
  zh-TW: "營養學前沿研究：運動營養、基因與飲食、流行節食、補充劑、腸道菌群等。"
  ja: "栄養学の最新研究：スポーツ栄養、遺伝子と食事、流行ダイエット、サプリ、腸内細菌など。"
  ko: "최신 영양 연구: 스포츠 영양, 유전자-식단, 유행 다이어트, 보충제, 장내 미생물 등."
  vi: "Nghiên cứu dinh dưỡng mới: dinh dưỡng thể thao, gen–ăn uống, ăn kiêng trào lưu, thực phẩm bổ sung, vi sinh đường ruột."
  ms: "Kajian nutrisi terkini: nutrisi sukan, gen dan diet, diet fesyen, suplemen, mikrobiom usus dan lain-lain."
  id: "Riset gizi terkini: gizi olahraga, gen dan diet, diet tren, suplemen, mikrobioma usus, dan lainnya."
  hi: "पोषण के नए शोध: खेल पोषण, जीन-आहार संबंध, फ़ैड डाइट, सप्लीमेंट, आंत माइक्रोबायोम आदि।"
outcomes:
