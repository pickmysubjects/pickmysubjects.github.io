code: CRIM20007
year: 2026
learn:
  en: "Crime and harm online, from hacking and phishing to image-based abuse, why it is hard to police, and how victims seek justice online."
  zh: "网络犯罪和伤害，从黑客、钓鱼到图像性暴力，为何难管，受害者如何在网上讨公道。"
  zh-TW: "網路犯罪和傷害，從駭客、釣魚到影像性暴力，為何難管，受害者如何在網路上討公道。"
  ja: "ハッキングやフィッシングから画像を使った性的虐待まで、ネット上の犯罪と被害、取り締まりが難しい理由、被害者がネットで正義を求める方法を学ぶ。"
  ko: "해킹, 피싱부터 이미지 기반 성범죄까지 온라인 범죄와 피해, 단속이 어려운 이유, 피해자가 온라인에서 정의를 찾는 방식을 배운다."
  vi: "Tội phạm và tổn hại trên mạng, từ tin tặc, lừa đảo đến lạm dụng bằng hình ảnh, vì sao khó kiểm soát, và nạn nhân tìm công lý trên mạng ra sao."
  ms: "Jenayah dan bahaya dalam talian, dari penggodaman dan pancingan data hingga penderaan berasaskan imej, kenapa sukar dikawal, dan cara mangsa mencari keadilan."
  id: "Kejahatan dan bahaya daring, dari peretasan dan phishing hingga kekerasan berbasis gambar, kenapa sulit ditangani, dan cara korban mencari keadilan secara daring."
  hi: "ऑनलाइन अपराध और नुकसान, हैकिंग और फ़िशिंग से तस्वीरों के ज़रिए उत्पीड़न तक, इन्हें रोकना मुश्किल क्यों है, और पीड़ित ऑनलाइन न्याय कैसे माँगते हैं।"
outcomes:
  - en: "Describe the main types of cybercrime"
    zh: "描述网络犯罪的主要类型"
    zh-TW: "描述網路犯罪的主要類型"
    ja: "サイバー犯罪の主な種類を説明する"
    ko: "사이버 범죄의 주요 유형 설명하기"
    vi: "Mô tả các loại tội phạm mạng chính"
    ms: "Huraikan jenis utama jenayah siber"
    id: "Menjelaskan jenis utama kejahatan siber"
    hi: "साइबर अपराध के मुख्य प्रकार बताना"
  - en: "Explain why online harm is hard to prevent"
    zh: "说明网络伤害为什么难以防范"
    zh-TW: "說明網路傷害為什麼難以防範"
    ja: "ネット上の被害を防ぐのが難しい理由を説明する"
    ko: "온라인 피해를 막기 어려운 이유 설명하기"
    vi: "Giải thích vì sao tổn hại trên mạng khó ngăn chặn"
    ms: "Terangkan kenapa bahaya dalam talian sukar dicegah"
    id: "Menjelaskan kenapa bahaya daring sulit dicegah"
    hi: "समझाना कि ऑनलाइन नुकसान रोकना मुश्किल क्यों है"
  - en: "Assess how the internet can help victims"
    zh: "评估互联网能如何帮助受害者"
    zh-TW: "評估網路能如何幫助受害者"
    ja: "インターネットが被害者をどう助けられるか評価する"
    ko: "인터넷이 피해자를 어떻게 도울 수 있는지 평가하기"
    vi: "Đánh giá internet có thể giúp nạn nhân thế nào"
    ms: "Nilai cara internet boleh membantu mangsa"
    id: "Menilai cara internet bisa membantu korban"
    hi: "आकलन करना कि इंटरनेट पीड़ितों की कैसे मदद कर सकता है"
