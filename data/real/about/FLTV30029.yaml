code: FLTV30029
year: 2026
learn:
  en: "Write one feature-length screenplay to a professional first draft, mentored by a working writer."
  zh: "在职业编剧指导下，把一部长剧本写到专业初稿水准。"
  zh-TW: "在職業編劇指導下，把一部長劇本寫到專業初稿水準。"
  ja: "現役脚本家の指導で、長編脚本をプロ水準の初稿まで書く。"
  ko: "현역 작가의 멘토링으로 장편 각본을 전문가 수준 초고까지 쓴다."
  vi: "Viết một kịch bản dài đến bản nháp đầu chuyên nghiệp, có biên kịch hướng dẫn."
  ms: "Tulis satu skrip panjang hingga draf pertama profesional, dibimbing penulis."
  id: "Menulis satu naskah panjang hingga draf pertama profesional, dibimbing penulis."
  hi: "एक लंबी पटकथा को पेशेवर पहले ड्राफ़्ट तक लिखना, अनुभवी लेखक के मार्गदर्शन में।"
outcomes:
  - en: "Write a 50 to 60-page first draft"
    zh: "写50到60页的初稿"
    zh-TW: "寫 50 到 60 頁的初稿"
    ja: "50〜60ページの初稿を書く"
    ko: "50~60쪽 초고 쓰기"
    vi: "Viết bản nháp đầu 50–60 trang"
    ms: "Tulis draf pertama 50 hingga 60 halaman"
    id: "Menulis draf pertama 50–60 halaman"
    hi: "50 से 60 पेज का पहला ड्राफ़्ट लिखना"
  - en: "Give script notes to industry standard"
    zh: "按行业标准写剧本意见"
    zh-TW: "按業界標準寫劇本意見"
    ja: "業界水準の脚本ノートを書く"
    ko: "업계 기준의 대본 노트 쓰기"
    vi: "Góp ý kịch bản theo chuẩn ngành"
    ms: "Beri nota skrip ikut standard industri"
    id: "Memberi catatan naskah standar industri"
    hi: "इंडस्ट्री स्तर के स्क्रिप्ट नोट्स देना"
  - en: "Assess your own script honestly"
    zh: "客观评估自己的剧本"
    zh-TW: "客觀評估自己的劇本"
    ja: "自分の脚本を冷静に評価する"
    ko: "자기 대본 냉정하게 평가하기"
    vi: "Tự đánh giá kịch bản một cách thẳng thắn"
    ms: "Nilai skrip sendiri dengan jujur"
    id: "Menilai naskah sendiri secara jujur"
    hi: "अपनी स्क्रिप्ट का ईमानदार आकलन"
