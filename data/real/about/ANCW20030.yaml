code: ANCW20030
year: 2027
learn:
  en: "Religion in ancient Mesopotamia through archaeology: temples, rituals, sacred places, burials and the senses."
  zh: "通过考古看古代美索不达米亚的宗教：神庙、仪式、圣地、丧葬和感官体验。"
  zh-TW: "透過考古看古代美索不達米亞的宗教：神廟、儀式、聖地、喪葬和感官體驗。"
  ja: "考古学から見る古代メソポタミアの宗教：神殿、儀礼、聖地、埋葬、五感。"
  ko: "고고학으로 보는 고대 메소포타미아의 종교: 신전, 의례, 성소, 장례, 감각 경험."
  vi: "Tôn giáo Lưỡng Hà cổ đại qua khảo cổ: đền thờ, nghi lễ, nơi linh thiêng, mai táng và trải nghiệm giác quan."
  ms: "Agama di Mesopotamia purba melalui arkeologi: kuil, ritual, tempat suci, pengebumian dan deria."
  id: "Agama di Mesopotamia kuno lewat arkeologi: kuil, ritual, tempat suci, pemakaman, dan pengalaman indra."
  hi: "पुरातत्व के ज़रिए प्राचीन मेसोपोटामिया का धर्म: मंदिर, अनुष्ठान, पवित्र स्थान, अंत्येष्टि और इंद्रियाँ।"
outcomes:
  - en: "Interpret rituals and sacred spaces from finds"
    zh: "通过考古发现解读仪式和圣地"
    zh-TW: "透過考古發現解讀儀式和聖地"
    ja: "出土資料から儀礼や聖なる空間を読み解く"
    ko: "유물로 의례와 성스러운 공간 해석하기"
    vi: "Giải nghĩa nghi lễ và nơi linh thiêng từ hiện vật"
    ms: "Tafsir ritual dan ruang suci daripada penemuan"
    id: "Menafsirkan ritual dan ruang suci dari temuan"
    hi: "खोजों से अनुष्ठानों और पवित्र स्थानों की व्याख्या"
  - en: "Weigh rival readings and the limits of evidence"
    zh: "权衡不同解读及证据的局限"
    zh-TW: "權衡不同解讀及證據的侷限"
    ja: "対立する解釈と証拠の限界を見極める"
    ko: "상충하는 해석과 증거의 한계 따져 보기"
    vi: "Cân nhắc các cách giải thích khác nhau và giới hạn của bằng chứng"
    ms: "Timbang tafsiran berbeza dan had bukti"
    id: "Menimbang tafsiran yang bersaing dan batas bukti"
    hi: "विरोधी व्याख्याओं और साक्ष्य की सीमाओं को परखना"
