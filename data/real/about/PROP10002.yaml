code: PROP10002
year: 2026
learn:
  en: "Intro to property: how markets, law and society shape who controls, trades and develops land and buildings."
  zh: "物业入门：市场、法律和社会如何决定土地与建筑的控制、交易和开发。"
  zh-TW: "不動產入門：市場、法律和社會如何決定土地與建築的控制、交易和開發。"
  ja: "不動産入門：市場・法・社会が土地建物の支配・取引・開発をどう決めるか。"
  ko: "부동산 입문: 시장·법·사회가 토지와 건물의 통제·거래·개발을 어떻게 정하는지."
  vi: "Nhập môn bất động sản: thị trường, luật và xã hội định ai kiểm soát, giao dịch, phát triển đất và nhà."
  ms: "Pengenalan hartanah: cara pasaran, undang-undang dan masyarakat menentukan kawalan, urus niaga dan pembangunan."
  id: "Pengantar properti: cara pasar, hukum, dan masyarakat menentukan penguasaan, jual beli, dan pengembangan."
  hi: "प्रॉपर्टी का परिचय: बाज़ार, क़ानून और समाज ज़मीन-इमारतों पर नियंत्रण और विकास कैसे तय करते हैं।"
outcomes:
  - en: "Explain the basics of property markets"
    zh: "说明物业市场的基础"
    zh-TW: "說明不動產市場的基礎"
    ja: "不動産市場の基本を説明する"
    ko: "부동산 시장 기초 설명하기"
    vi: "Giải thích kiến thức cơ bản về thị trường BĐS"
    ms: "Jelaskan asas pasaran hartanah"
    id: "Menjelaskan dasar pasar properti"
    hi: "प्रॉपर्टी बाज़ार की बुनियादी बातें समझाना"
  - en: "Describe the legal and economic systems involved"
    zh: "描述相关的法律与经济制度"
    zh-TW: "描述相關的法律與經濟制度"
    ja: "関係する法と経済の制度を説明する"
    ko: "관련 법·경제 제도 설명하기"
    vi: "Mô tả hệ thống pháp lý và kinh tế liên quan"
    ms: "Huraikan sistem undang-undang dan ekonomi berkaitan"
    id: "Menjelaskan sistem hukum dan ekonomi terkait"
    hi: "जुड़ी क़ानूनी और आर्थिक व्यवस्थाएँ बताना"
  - en: "Weigh individual against collective property rights"
    zh: "权衡个人与集体的产权"
    zh-TW: "權衡個人與集體的產權"
    ja: "個人と集団の財産権を比べて考える"
    ko: "개인과 공동의 재산권 저울질하기"
    vi: "Cân nhắc quyền sở hữu cá nhân và tập thể"
    ms: "Timbang hak harta individu dan kolektif"
    id: "Menimbang hak milik individu dan kolektif"
    hi: "व्यक्तिगत और सामूहिक संपत्ति अधिकारों को तौलना"
