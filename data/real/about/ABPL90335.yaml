code: ABPL90335
year: 2027
learn:
  en: "Managing construction contracts from both sides: negotiation, payments, risk, delay claims and dispute management."
  zh: "从业主和承包商两方面管理建筑合同：谈判、付款、风险、延误索赔和争议处理。"
  zh-TW: "從業主與承包商兩方面管理營建合約：談判、付款、風險、延誤求償與爭議處理。"
  ja: "発注者と施工者双方の立場で建設契約を管理：交渉、支払、リスク、遅延請求、紛争。"
  ko: "발주자와 시공사 양쪽에서 건설 계약 관리: 협상, 지급, 위험, 지연 클레임, 분쟁."
  vi: "Quản lý hợp đồng xây dựng từ hai phía: đàm phán, thanh toán, rủi ro, khiếu nại chậm trễ, tranh chấp."
  ms: "Mengurus kontrak pembinaan dari kedua-dua pihak: rundingan, bayaran, risiko, tuntutan lewat dan pertikaian."
  id: "Mengelola kontrak konstruksi dari dua sisi: negosiasi, pembayaran, risiko, klaim keterlambatan, sengketa."
  hi: "दोनों पक्षों से निर्माण अनुबंध प्रबंधन: वार्ता, भुगतान, जोखिम, देरी दावे और विवाद।"
outcomes:
  - en: "Explain contract, tort and property law in construction"
    zh: "解释建筑中的合同法、侵权法和财产法"
    zh-TW: "解釋營建中的契約法、侵權法與財產法"
    ja: "建設における契約・不法行為・財産法を説明する"
    ko: "건설의 계약·불법행위·재산법 설명하기"
    vi: "Giải thích luật hợp đồng, bồi thường, tài sản"
    ms: "Menerangkan undang-undang kontrak, tort dan harta"
    id: "Menjelaskan hukum kontrak, tort, dan properti"
    hi: "निर्माण में अनुबंध, टॉर्ट व संपत्ति क़ानून समझाना"
  - en: "Manage delay claims and disputes"
    zh: "处理延误索赔和合同争议"
    zh-TW: "處理延誤求償與合約爭議"
    ja: "遅延請求と紛争を管理する"
    ko: "지연 클레임과 분쟁 관리하기"
    vi: "Xử lý khiếu nại chậm trễ và tranh chấp"
    ms: "Mengurus tuntutan kelewatan dan pertikaian"
    id: "Mengelola klaim keterlambatan dan sengketa"
    hi: "देरी दावों और विवादों का प्रबंधन"
