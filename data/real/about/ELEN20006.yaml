code: ELEN20006
year: 2026
learn:
  en: "How digital logic works and how to design digital systems in Verilog on FPGA hardware."
  zh: "数字逻辑的原理，以及如何用Verilog在FPGA上设计数字系统。"
  zh-TW: "數位邏輯的原理，以及如何用Verilog在FPGA上設計數位系統。"
  ja: "デジタル論理の仕組みと、VerilogでFPGA上にデジタル回路を設計する方法。"
  ko: "디지털 논리의 원리와 Verilog로 FPGA에서 디지털 시스템을 설계하는 법."
  vi: "Logic số hoạt động thế nào và cách thiết kế hệ thống số bằng Verilog trên phần cứng FPGA."
  ms: "Cara logik digital berfungsi dan cara mereka bentuk sistem digital dengan Verilog pada FPGA."
  id: "Cara kerja logika digital dan cara merancang sistem digital dengan Verilog di FPGA."
  hi: "डिजिटल लॉजिक कैसे काम करता है, और Verilog से FPGA पर डिजिटल सिस्टम कैसे डिज़ाइन करें।"
outcomes:
  - en: "Analyse combinational and sequential logic"
    zh: "分析组合逻辑和时序逻辑"
    zh-TW: "分析組合邏輯與循序邏輯"
    ja: "組合せ・順序回路を解析する"
    ko: "조합·순차 논리 분석하기"
    vi: "Phân tích logic tổ hợp và tuần tự"
    ms: "Menganalisis logik gabungan dan berjujukan"
    id: "Menganalisis logika kombinasional dan sekuensial"
    hi: "कॉम्बिनेशनल और सीक्वेंशियल लॉजिक का विश्लेषण करना"
  - en: "Design digital systems in Verilog"
    zh: "用Verilog设计数字系统"
    zh-TW: "用Verilog設計數位系統"
    ja: "Verilogでデジタル回路を設計する"
    ko: "Verilog로 디지털 시스템 설계하기"
    vi: "Thiết kế hệ thống số bằng Verilog"
    ms: "Mereka bentuk sistem digital dengan Verilog"
    id: "Merancang sistem digital dengan Verilog"
    hi: "Verilog में डिजिटल सिस्टम डिज़ाइन करना"
  - en: "Use FPGA boards in the lab"
    zh: "在实验室使用FPGA开发板"
    zh-TW: "在實驗室使用FPGA開發板"
    ja: "実験室でFPGAボードを使う"
    ko: "실험실에서 FPGA 보드 사용하기"
    vi: "Sử dụng bo mạch FPGA trong phòng thí nghiệm"
    ms: "Menggunakan papan FPGA di makmal"
    id: "Memakai papan FPGA di lab"
    hi: "लैब में FPGA बोर्ड का उपयोग करना"
