code: ARCH20004
year: 2026
learn:
  en: "Digital design workflows for architecture: diagramming, parametric modelling and prototyping from precedents."
  zh: "建筑数字设计流程：图解、参数化建模，以及从先例出发做原型。"
  zh-TW: "建築數位設計流程：圖解、參數化建模，以及從先例出發做原型。"
  ja: "建築のデジタル設計の流れ：ダイアグラム、パラメトリックモデリング、先例からの試作。"
  ko: "건축 디지털 설계 과정: 다이어그램, 파라메트릭 모델링, 선례 기반 프로토타이핑."
  vi: "Quy trình thiết kế số cho kiến trúc: sơ đồ hóa, mô hình tham số và làm mẫu thử từ công trình tiền lệ."
  ms: "Aliran kerja reka bentuk digital seni bina: gambar rajah, pemodelan parametrik dan prototaip daripada preseden."
  id: "Alur desain digital arsitektur: diagram, pemodelan parametrik, dan prototipe dari preseden."
  hi: "आर्किटेक्चर के डिजिटल डिज़ाइन वर्कफ़्लो: डायग्राम, पैरामीट्रिक मॉडलिंग और प्रोटोटाइप।"
outcomes:
  - en: "Diagram and model a design precedent"
    zh: "对设计先例做图解和建模"
    zh-TW: "對設計先例做圖解和建模"
    ja: "先例をダイアグラム化しモデル化する"
    ko: "설계 선례를 다이어그램·모델로 만들기"
    vi: "Sơ đồ hóa và dựng mô hình một tiền lệ"
    ms: "Buat gambar rajah dan model preseden"
    id: "Membuat diagram dan model preseden"
    hi: "किसी डिज़ाइन उदाहरण का डायग्राम और मॉडल बनाना"
  - en: "Use parametric tools to explore options"
    zh: "用参数化工具探索方案"
    zh-TW: "用參數化工具探索方案"
    ja: "パラメトリックツールで案を探る"
    ko: "파라메트릭 도구로 대안 탐색하기"
    vi: "Dùng công cụ tham số để thử phương án"
    ms: "Guna alat parametrik untuk meneroka pilihan"
    id: "Memakai alat parametrik untuk menjelajah opsi"
    hi: "पैरामीट्रिक टूल से विकल्प खोजना"
  - en: "Build and test physical or digital prototypes"
    zh: "制作并测试实体或数字原型"
    zh-TW: "製作並測試實體或數位原型"
    ja: "実物やデジタルの試作を作り試す"
    ko: "실물·디지털 프로토타입 제작·시험하기"
    vi: "Làm và thử mẫu thật hoặc mẫu số"
    ms: "Bina dan uji prototaip fizikal atau digital"
    id: "Membuat dan menguji prototipe fisik atau digital"
    hi: "भौतिक या डिजिटल प्रोटोटाइप बनाकर परखना"
