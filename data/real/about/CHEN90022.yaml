code: CHEN90022
year: 2027
learn:
  en: "A team capstone that produces a full chemical plant design, from feasibility study to detailed design."
  zh: "以团队完成化工厂的完整设计，从可行性研究到详细设计。"
  zh-TW: "以團隊完成化工廠的完整設計，從可行性研究到細部設計。"
  ja: "チームで化学プラントを事業性調査から詳細設計まで一通り設計するキャップストーン。"
  ko: "팀으로 타당성 조사부터 상세 설계까지 화학 공장 전체를 설계하는 캡스톤."
  vi: "Đồ án nhóm thiết kế trọn vẹn một nhà máy hóa chất, từ khả thi đến thiết kế chi tiết."
  ms: "Projek akhir berpasukan yang menghasilkan reka bentuk penuh loji kimia, dari kebolehlaksanaan hingga terperinci."
  id: "Proyek akhir tim yang menghasilkan desain lengkap pabrik kimia, dari kelayakan hingga desain rinci."
  hi: "टीम कैपस्टोन जिसमें व्यवहार्यता अध्ययन से विस्तृत डिज़ाइन तक पूरा केमिकल प्लांट डिज़ाइन होता है।"
outcomes:
  - en: "Complete a feasibility study for a new process"
    zh: "完成新工艺的可行性研究"
    zh-TW: "完成新製程的可行性研究"
    ja: "新しいプロセスの事業性調査をまとめる"
    ko: "새 공정의 타당성 조사 완성하기"
    vi: "Hoàn thành nghiên cứu khả thi cho quy trình mới"
    ms: "Melengkapkan kajian kebolehlaksanaan untuk proses baharu"
    id: "Menyelesaikan studi kelayakan untuk proses baru"
    hi: "नई प्रक्रिया का व्यवहार्यता अध्ययन पूरा करना"
  - en: "Do mass and energy balances and equipment design"
    zh: "完成物料与能量衡算及设备设计"
    zh-TW: "完成質能平衡與設備設計"
    ja: "物質・エネルギー収支と機器設計を行う"
    ko: "물질·에너지 수지와 장치 설계하기"
    vi: "Lập cân bằng vật chất, năng lượng và thiết kế thiết bị"
    ms: "Membuat imbangan jisim dan tenaga serta reka bentuk peralatan"
    id: "Membuat neraca massa dan energi serta desain alat"
    hi: "द्रव्यमान-ऊर्जा संतुलन और उपकरण डिज़ाइन करना"
  - en: "Work in a team and manage time on a long project"
    zh: "在长期项目中团队合作并管理时间"
    zh-TW: "在長期專案中團隊合作並管理時間"
    ja: "長期プロジェクトでチームで働き時間を管理する"
    ko: "장기 프로젝트에서 팀워크와 시간 관리하기"
    vi: "Làm việc nhóm và quản lý thời gian trong dự án dài"
    ms: "Bekerja dalam pasukan dan mengurus masa dalam projek panjang"
    id: "Bekerja dalam tim dan mengatur waktu di proyek panjang"
    hi: "लंबी परियोजना में टीम में काम और समय प्रबंधन"
