code: ANSC20004
year: 2026
learn:
  en: "The bond between people and animals: why it forms, how it helps health and wellbeing, and where it goes wrong."
  zh: "人与动物之间的纽带：如何形成、如何有益健康，以及会出什么问题。"
  zh-TW: "人與動物之間的連結：如何形成、如何有益健康，以及會出什麼問題。"
  ja: "人と動物の絆。なぜ生まれ、健康にどう役立ち、どこで問題が起きるか。"
  ko: "사람과 동물의 유대. 왜 생기고 건강에 어떻게 도움이 되며 어디서 문제가 생기는지."
  vi: "Gắn kết giữa người và động vật: vì sao hình thành, lợi ích sức khỏe, và rủi ro."
  ms: "Ikatan manusia dan haiwan: mengapa terbentuk, manfaat kesihatan dan masalahnya."
  id: "Ikatan manusia dan hewan: mengapa terbentuk, manfaat kesehatan, dan masalahnya."
  hi: "इंसान और जानवर का रिश्ता: क्यों बनता है, सेहत में कैसे मदद करता है, कहाँ बिगड़ता है।"
outcomes:
  - en: "Explain how human-animal bonds form"
    zh: "说明人与动物纽带如何形成"
    zh-TW: "說明人與動物連結如何形成"
    ja: "人と動物の絆の成り立ちを説明する"
    ko: "사람-동물 유대 형성 설명하기"
    vi: "Giải thích sự gắn kết người-vật hình thành"
    ms: "Jelaskan cara ikatan manusia-haiwan terbentuk"
    id: "Menjelaskan terbentuknya ikatan manusia-hewan"
    hi: "इंसान-जानवर रिश्ता कैसे बनता है"
  - en: "Discuss animals in health and therapy"
    zh: "讨论动物在健康和治疗中的作用"
    zh-TW: "討論動物在健康與治療中的作用"
    ja: "健康やセラピーでの動物の役割を論じる"
    ko: "건강·치료에서 동물의 역할 논하기"
    vi: "Bàn về động vật trong sức khỏe và trị liệu"
    ms: "Bincang haiwan dalam kesihatan dan terapi"
    id: "Membahas hewan dalam kesehatan dan terapi"
    hi: "स्वास्थ्य और थेरेपी में जानवरों पर चर्चा"
  - en: "Analyse problems such as neglect and conflict"
    zh: "分析忽视、冲突等问题"
    zh-TW: "分析疏忽、衝突等問題"
    ja: "放置や対立などの問題を分析する"
    ko: "방치·갈등 같은 문제 분석하기"
    vi: "Phân tích vấn đề như bỏ bê, xung đột"
    ms: "Analisis masalah seperti pengabaian"
    id: "Menganalisis masalah seperti penelantaran"
    hi: "उपेक्षा और टकराव जैसी समस्याओं का विश्लेषण"
