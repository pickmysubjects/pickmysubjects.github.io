code: CHIN10019
year: 2026
learn:
  en: "Chinese literature since 1949 read with political writings of the time, building advanced Chinese and a feel for modern China."
  zh: "结合同时期政治文本阅读 1949 年后的中国文学，提高高级中文水平并理解当代中国。"
  zh-TW: "結合同時期政治文本閱讀 1949 年後的中國文學，提高高級中文水準並理解當代中國。"
  ja: "1949年以降の中国文学を当時の政治的文章と合わせて読み、上級中国語と現代中国への理解を深める。"
  ko: "1949년 이후 중국 문학을 당시 정치 글과 함께 읽으며 고급 중국어와 현대 중국 이해를 넓힌다."
  vi: "Văn học Trung Quốc sau 1949 đọc cùng văn bản chính trị đương thời, nâng tiếng Trung cao cấp và hiểu Trung Quốc hiện đại."
  ms: "Sastera China selepas 1949 dibaca bersama tulisan politik semasa, membina bahasa Cina lanjutan dan kefahaman China moden."
  id: "Sastra Tiongkok sejak 1949 dibaca bersama tulisan politik zamannya, membangun Mandarin lanjut dan pemahaman Tiongkok modern."
  hi: "1949 के बाद का चीनी साहित्य, उस दौर के राजनीतिक लेखन के साथ, उन्नत चीनी और आधुनिक चीन की समझ के लिए।"
outcomes:
  - en: "Read contemporary Chinese literature in the original"
    zh: "阅读当代中国文学原著"
    zh-TW: "閱讀當代中國文學原著"
    ja: "現代中国文学を原文で読む"
    ko: "현대 중국 문학을 원문으로 읽기"
    vi: "Đọc văn học Trung Quốc đương đại nguyên bản"
    ms: "Baca sastera China kontemporari dalam bahasa asal"
    id: "Membaca sastra Tiongkok kontemporer dalam bahasa aslinya"
    hi: "समकालीन चीनी साहित्य मूल में पढ़ना"
  - en: "Link literary works to China's history since 1949"
    zh: "把文学作品与 1949 年后的历史联系起来"
    zh-TW: "把文學作品與 1949 年後的歷史聯繫起來"
    ja: "文学作品を1949年以降の歴史と結びつける"
    ko: "문학 작품을 1949년 이후 역사와 연결하기"
    vi: "Liên hệ tác phẩm với lịch sử Trung Quốc sau 1949"
    ms: "Kaitkan karya sastera dengan sejarah China sejak 1949"
    id: "Mengaitkan karya sastra dengan sejarah Tiongkok sejak 1949"
    hi: "रचनाओं को 1949 के बाद के चीनी इतिहास से जोड़ना"
  - en: "Discuss social issues in China in Chinese"
    zh: "用中文讨论中国的社会问题"
    zh-TW: "用中文討論中國的社會問題"
    ja: "中国の社会問題を中国語で論じる"
    ko: "중국 사회 문제를 중국어로 토론하기"
    vi: "Thảo luận vấn đề xã hội Trung Quốc bằng tiếng Trung"
    ms: "Bincangkan isu sosial China dalam bahasa Cina"
    id: "Membahas isu sosial Tiongkok dalam bahasa Mandarin"
    hi: "चीन के सामाजिक मुद्दों पर चीनी में चर्चा करना"
