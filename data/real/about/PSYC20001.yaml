code: PSYC20001
year: 2027
learn:
  en: "How to design psych studies and analyse the data in SPSS, plus how psychological tests measure people and how to judge them."
  zh: "心理学研究设计与SPSS数据分析，以及心理测验如何测量个体、如何评估。"
  zh-TW: "心理學研究設計與SPSS資料分析，以及心理測驗如何測量個人、如何評估。"
  ja: "心理学の研究デザインとSPSSでのデータ分析、そして心理検査が人をどう測り、どう評価するかを学ぶ。"
  ko: "심리학 연구 설계와 SPSS 데이터 분석, 그리고 심리검사가 개인을 어떻게 측정하고 평가되는지 배운다."
  vi: "Cách thiết kế nghiên cứu tâm lý và phân tích dữ liệu bằng SPSS, cùng cách trắc nghiệm tâm lý đo lường con người và cách đánh giá chúng."
  ms: "Cara mereka bentuk kajian psikologi dan menganalisis data dengan SPSS, serta cara ujian psikologi mengukur individu dan cara menilainya."
  id: "Cara merancang studi psikologi dan menganalisis data dengan SPSS, serta cara tes psikologi mengukur individu dan cara menilainya."
  hi: "मनोविज्ञान के अध्ययन बनाना और SPSS में डेटा विश्लेषण करना, साथ ही मनोवैज्ञानिक टेस्ट लोगों को कैसे मापते हैं और उन्हें कैसे परखें।"
outcomes:
  - en: "Explore data and test hypotheses with statistics"
    zh: "用统计方法探索数据并检验假设"
    zh-TW: "用統計方法探索資料並檢定假設"
    ja: "統計を使ってデータを探り仮説を検定する"
    ko: "통계로 데이터를 탐색하고 가설 검정하기"
    vi: "Khám phá dữ liệu và kiểm định giả thuyết bằng thống kê"
    ms: "Teroka data dan uji hipotesis dengan statistik"
    id: "Mengeksplorasi data dan menguji hipotesis dengan statistik"
    hi: "आँकड़ों से डेटा परखना और परिकल्पना जाँचना"
  - en: "Make and read graphs of data"
    zh: "绘制并解读数据图表"
    zh-TW: "繪製並解讀資料圖表"
    ja: "データのグラフを作って読み取る"
    ko: "데이터 그래프 만들고 해석하기"
    vi: "Vẽ và đọc biểu đồ dữ liệu"
    ms: "Hasilkan dan baca graf data"
    id: "Membuat dan membaca grafik data"
    hi: "डेटा के ग्राफ़ बनाना और पढ़ना"
  - en: "Understand how individual psychological testing works"
    zh: "了解针对个人的心理测验过程"
    zh-TW: "了解針對個人的心理測驗過程"
    ja: "個人を対象とした心理検査の流れを理解する"
    ko: "개인 대상 심리검사의 과정 이해하기"
    vi: "Hiểu quy trình trắc nghiệm tâm lý cho từng cá nhân"
    ms: "Fahami proses ujian psikologi bagi individu"
    id: "Memahami proses tes psikologi untuk individu"
    hi: "व्यक्ति स्तर पर मनोवैज्ञानिक टेस्टिंग कैसे होती है, समझना"
