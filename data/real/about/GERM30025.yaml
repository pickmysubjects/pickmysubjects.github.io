code: GERM30025
year: 2026
learn:
  en: "The German major's capstone: researching one German play in depth and staging it in German for a real audience."
  zh: "德语专业的毕业课：深入研究一部德语剧作，并用德语为真实观众排演。"
  zh-TW: "德語主修的總結課：深入研究一部德語劇作，並用德語為真實觀眾排演。"
  ja: "ドイツ語専攻の総仕上げ。ドイツ語の戯曲一作を深く調べ、ドイツ語で観客の前で上演する。"
  ko: "독일어 전공 캡스톤. 독일어 희곡 한 편을 깊이 연구하고 실제 관객 앞에서 독일어로 무대에 올린다."
  vi: "Môn tổng kết chuyên ngành tiếng Đức: nghiên cứu sâu một vở kịch Đức và dàn dựng bằng tiếng Đức cho khán giả thật."
  ms: "Capstone major Jerman: mengkaji satu drama Jerman secara mendalam dan mementaskannya dalam bahasa Jerman."
  id: "Capstone major Jerman: meneliti satu naskah drama Jerman secara mendalam dan mementaskannya dalam bahasa Jerman."
  hi: "जर्मन मेजर का कैपस्टोन: एक जर्मन नाटक का गहन शोध और असली दर्शकों के सामने जर्मन में मंचन।"
outcomes:
  - en: "Research a play's history and context"
    zh: "研究一部剧作的历史和背景"
    zh-TW: "研究一部劇作的歷史和背景"
    ja: "戯曲の歴史と背景を調べる"
    ko: "희곡의 역사와 맥락 연구하기"
    vi: "Nghiên cứu lịch sử và bối cảnh của một vở kịch"
    ms: "Kaji sejarah dan konteks sebuah drama"
    id: "Meneliti sejarah dan konteks sebuah drama"
    hi: "किसी नाटक के इतिहास और संदर्भ पर शोध करना"
  - en: "Interpret and stage a play in German"
    zh: "用德语诠释并排演剧作"
    zh-TW: "用德語詮釋並排演劇作"
    ja: "ドイツ語で戯曲を解釈し上演する"
    ko: "독일어로 희곡 해석하고 무대에 올리기"
    vi: "Diễn giải và dàn dựng vở kịch bằng tiếng Đức"
    ms: "Tafsir dan pentaskan drama dalam bahasa Jerman"
    id: "Menafsirkan dan mementaskan drama dalam bahasa Jerman"
    hi: "जर्मन में नाटक की व्याख्या और मंचन करना"
  - en: "Work independently as part of a team"
    zh: "在团队中独立承担工作"
    zh-TW: "在團隊中獨立承擔工作"
    ja: "チームの中で自立して動く"
    ko: "팀 안에서 독립적으로 일하기"
    vi: "Làm việc độc lập trong một nhóm"
    ms: "Bekerja secara berdikari dalam pasukan"
    id: "Bekerja mandiri sebagai bagian dari tim"
    hi: "टीम का हिस्सा रहते हुए स्वतंत्र रूप से काम करना"
