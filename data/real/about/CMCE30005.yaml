code: CMCE30005
year: 2026
learn:
  en: "The Business Analytics capstone: a real analytics project, alone or with an industry partner."
  zh: "商业分析专业的毕业项目：独立或与业界伙伴完成一个真实分析项目。"
  zh-TW: "商業分析主修的總整課程：獨立或與業界夥伴完成一個實際分析專案。"
  ja: "ビジネス分析専攻の総仕上げ：一人で、または企業と組んで実際の分析プロジェクトを行う。"
  ko: "비즈니스 분석 전공 캡스톤: 혼자 또는 산업 파트너와 실제 분석 프로젝트 수행."
  vi: "Môn tổng kết ngành Phân tích Kinh doanh: làm một dự án phân tích thật, một mình hoặc với đối tác doanh nghiệp."
  ms: "Projek akhir major Analitik Perniagaan: projek analitik sebenar, sendiri atau dengan rakan industri."
  id: "Capstone jurusan Analitik Bisnis: proyek analitik nyata, sendiri atau bersama mitra industri."
  hi: "बिज़नेस एनालिटिक्स मेजर का कैपस्टोन: अकेले या इंडस्ट्री पार्टनर के साथ एक असली एनालिटिक्स प्रोजेक्ट।"
outcomes:
  - en: "Frame a business problem as an analytics project"
    zh: "把商业问题设计成分析项目"
    zh-TW: "把商業問題規劃成分析專案"
    ja: "ビジネス課題を分析プロジェクトとして組み立てる"
    ko: "비즈니스 문제를 분석 프로젝트로 구성"
    vi: "Biến một vấn đề kinh doanh thành dự án phân tích"
    ms: "Rangka masalah perniagaan sebagai projek analitik"
    id: "Merumuskan masalah bisnis sebagai proyek analitik"
    hi: "बिज़नेस समस्या को एनालिटिक्स प्रोजेक्ट का रूप देना"
  - en: "Find suitable data and apply the right methods"
    zh: "找到合适的数据并用对方法"
    zh-TW: "找到合適的資料並用對方法"
    ja: "適切なデータを探し、正しい手法を使う"
    ko: "알맞은 데이터를 찾고 적절한 방법 적용"
    vi: "Tìm dữ liệu phù hợp và dùng đúng phương pháp"
    ms: "Cari data sesuai dan guna kaedah yang betul"
    id: "Mencari data yang cocok dan memakai metode yang tepat"
    hi: "सही डेटा ढूँढना और सही तरीके लगाना"
  - en: "Plan and deliver a project from start to finish"
    zh: "从头到尾规划并完成项目"
    zh-TW: "從頭到尾規劃並完成專案"
    ja: "プロジェクトを最初から最後までやり遂げる"
    ko: "프로젝트를 처음부터 끝까지 계획·완수"
    vi: "Lên kế hoạch và hoàn thành dự án từ đầu đến cuối"
    ms: "Rancang dan siapkan projek dari mula hingga akhir"
    id: "Merencanakan dan menuntaskan proyek dari awal sampai akhir"
    hi: "प्रोजेक्ट को शुरू से अंत तक प्लान करके पूरा करना"
