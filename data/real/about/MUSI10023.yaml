code: MUSI10023
year: 2026
learn:
  en: "Western harmony and counterpoint basics: voice leading, diatonic chords and analysis, practised in weekly tasks."
  zh: "西方和声与对位基础：声部进行、自然音和弦与分析，每周练习。"
  zh-TW: "西方和聲與對位基礎：聲部進行、自然音和弦與分析，每週練習。"
  ja: "西洋の和声と対位法の基礎。声部進行、全音階和音、分析を毎週の課題で練習。"
  ko: "서양 화성과 대위법 기초: 성부 진행, 온음계 화음, 분석을 매주 과제로 연습."
  vi: "Nền tảng hòa âm và đối vị phương Tây: dẫn giọng, hợp âm diatonic và phân tích, luyện qua bài tập tuần."
  ms: "Asas harmoni dan kontrapuntal Barat: pergerakan suara, kord diatonik dan analisis, latihan mingguan."
  id: "Dasar harmoni dan kontrapung Barat: alur suara, akor diatonik dan analisis, dilatih lewat tugas mingguan."
  hi: "पश्चिमी हार्मनी और काउंटरपॉइंट की बुनियाद: वॉइस लीडिंग, डायटोनिक कॉर्ड और विश्लेषण।"
outcomes:
  - en: "Write correct voice leading"
    zh: "写出正确的声部进行"
    zh-TW: "寫出正確的聲部進行"
    ja: "正しい声部進行を書く"
    ko: "올바른 성부 진행 쓰기"
    vi: "Viết dẫn giọng đúng"
    ms: "Tulis pergerakan suara yang betul"
    id: "Menulis alur suara yang benar"
    hi: "सही वॉइस लीडिंग लिखना"
  - en: "Analyse diatonic harmony"
    zh: "分析自然音和声"
    zh-TW: "分析自然音和聲"
    ja: "全音階和声を分析する"
    ko: "온음계 화성 분석하기"
    vi: "Phân tích hòa âm diatonic"
    ms: "Analisis harmoni diatonik"
    id: "Menganalisis harmoni diatonik"
    hi: "डायटोनिक हार्मनी का विश्लेषण"
  - en: "Know key works of the Western canon"
    zh: "熟悉西方经典作品"
    zh-TW: "熟悉西方經典作品"
    ja: "西洋の名曲を知る"
    ko: "서양 주요 작품 익히기"
    vi: "Biết các tác phẩm kinh điển phương Tây"
    ms: "Kenali karya utama kanun Barat"
    id: "Mengenal karya klasik Barat utama"
    hi: "पश्चिमी क्लासिक रचनाएँ जानना"
