code: CLAS30009
year: 2026
learn:
  en: "Roman comedy or early drama: Greek models, staging, archaic Latin forms, and how the plays were passed down and reread."
  zh: "罗马喜剧或早期戏剧：希腊范本、演出、古拉丁语形式，以及剧作如何流传和被重新解读。"
  zh-TW: "羅馬喜劇或早期戲劇：希臘範本、演出、古拉丁語形式，以及劇作如何流傳和被重新解讀。"
  ja: "ローマ喜劇や初期の劇。ギリシャの手本、上演、古いラテン語の形、作品の伝承と後世の読まれ方。"
  ko: "로마 희극이나 초기 연극. 그리스 원형, 공연, 고대 라틴어 형태, 작품의 전승과 후대의 해석."
  vi: "Hài kịch hoặc kịch sơ kỳ La Mã: mẫu Hy Lạp, dàn dựng, dạng Latinh cổ, và cách các vở kịch được lưu truyền, đọc lại."
  ms: "Komedi atau drama awal Rom: model Yunani, pementasan, bentuk Latin kuno, dan cara drama itu diwarisi serta dibaca semula."
  id: "Komedi atau drama awal Romawi: model Yunani, pementasan, bentuk Latin kuno, dan cara lakon itu diwariskan serta dibaca ulang."
  hi: "रोमन कॉमेडी या शुरुआती नाटक: यूनानी आदर्श, मंचन, पुराने लैटिन रूप, और नाटक कैसे आगे पहुँचे व फिर पढ़े गए।"
outcomes:
  - en: "Read original Latin texts with some dictionary help"
    zh: "借助词典阅读拉丁语原文"
    zh-TW: "藉助詞典閱讀拉丁語原文"
    ja: "辞書を使ってラテン語の原典を読む"
    ko: "사전을 활용해 라틴어 원문 읽기"
    vi: "Đọc nguyên bản tiếng Latinh với sự hỗ trợ của từ điển"
    ms: "Baca teks asal bahasa Latin dengan bantuan kamus"
    id: "Membaca teks asli bahasa Latin dengan bantuan kamus"
    hi: "शब्दकोश की मदद से मूल लैटिन पाठ पढ़ना"
  - en: "Analyse complex Latin grammar and sentence structure"
    zh: "分析复杂的拉丁语语法和句子结构"
    zh-TW: "分析複雜的拉丁語文法和句子結構"
    ja: "ラテン語の複雑な文法と構文を分析する"
    ko: "복잡한 라틴어 문법과 문장 구조 분석하기"
    vi: "Phân tích ngữ pháp và cấu trúc câu tiếng Latinh phức tạp"
    ms: "Analisis tatabahasa dan struktur ayat bahasa Latin yang kompleks"
    id: "Menganalisis tata bahasa dan struktur kalimat bahasa Latin yang rumit"
    hi: "जटिल लैटिन व्याकरण और वाक्य-रचना का विश्लेषण करना"
  - en: "Translate and interpret ancient literature"
    zh: "翻译并解读古代文学作品"
    zh-TW: "翻譯並解讀古代文學作品"
    ja: "古代の文学作品を訳し解釈する"
    ko: "고대 문학 작품 번역하고 해석하기"
    vi: "Dịch và diễn giải văn học cổ đại"
    ms: "Terjemah dan tafsir karya sastera kuno"
    id: "Menerjemahkan dan menafsirkan karya sastra kuno"
    hi: "प्राचीन साहित्य का अनुवाद और व्याख्या करना"
