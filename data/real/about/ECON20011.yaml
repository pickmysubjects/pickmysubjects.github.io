code: ECON20011
year: 2026
learn:
  en: "Economics of professional sport: fan demand, league design, player markets, coaching, umpiring and betting."
  zh: "职业体育经济学：球迷需求、联赛设计、球员市场、教练、裁判和博彩。"
  zh-TW: "職業運動經濟學：球迷需求、聯賽設計、球員市場、教練、裁判和運彩。"
  ja: "プロスポーツの経済学：観客需要、リーグ設計、選手市場、指導、審判、賭け。"
  ko: "프로스포츠 경제학: 팬 수요, 리그 설계, 선수 시장, 코칭, 심판, 베팅."
  vi: "Kinh tế học thể thao chuyên nghiệp: nhu cầu khán giả, thiết kế giải đấu, thị trường cầu thủ, trọng tài và cá cược."
  ms: "Ekonomi sukan profesional: permintaan peminat, reka bentuk liga, pasaran pemain, kejurulatihan dan pertaruhan."
  id: "Ekonomi olahraga profesional: permintaan penggemar, desain liga, pasar pemain, pelatihan, wasit, dan taruhan."
  hi: "पेशेवर खेलों का अर्थशास्त्र: दर्शकों की माँग, लीग का ढाँचा, खिलाड़ियों का बाज़ार, कोचिंग, अंपायरिंग और सट्टा।"
outcomes:
  - en: "Classify different kinds of pro sports competitions"
    zh: "对不同类型的职业赛事进行分类"
    zh-TW: "對不同類型的職業賽事進行分類"
    ja: "さまざまなプロスポーツの大会を分類する"
    ko: "여러 유형의 프로 스포츠 대회 분류"
    vi: "Phân loại các kiểu giải đấu thể thao chuyên nghiệp"
    ms: "Kelaskan jenis pertandingan sukan profesional"
    id: "Mengelompokkan jenis kompetisi olahraga profesional"
    hi: "अलग-अलग तरह की पेशेवर खेल प्रतियोगिताओं का वर्गीकरण"
  - en: "Use economic ideas and data to analyse how sports work"
    zh: "用经济学和数据分析体育运作"
    zh-TW: "用經濟學和數據分析運動產業運作"
    ja: "経済学とデータでスポーツの仕組みを分析する"
    ko: "경제 개념과 데이터로 스포츠 운영 분석"
    vi: "Dùng kinh tế học và dữ liệu phân tích thể thao"
    ms: "Guna idea ekonomi dan data untuk analisis sukan"
    id: "Memakai ekonomi dan data untuk analisis olahraga"
    hi: "आर्थिक विचारों और डेटा से खेलों का विश्लेषण"
  - en: "Advise team, league and government decision-makers"
    zh: "为球队、联赛和政府决策者提供建议"
    zh-TW: "為球隊、聯盟和政府決策者提供建議"
    ja: "チーム、リーグ、政府の意思決定者に助言する"
    ko: "팀, 리그, 정부 의사결정자에게 조언"
    vi: "Tư vấn cho đội, giải đấu và nhà hoạch định chính sách"
    ms: "Nasihati pembuat keputusan pasukan, liga dan kerajaan"
    id: "Memberi saran pada pengambil keputusan tim, liga, dan pemerintah"
    hi: "टीम, लीग और सरकारी फ़ैसला लेने वालों को सलाह देना"
