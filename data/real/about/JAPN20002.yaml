code: JAPN20002
year: 2026
learn:
  en: "Tools for understanding how Japanese conversation works, so you can speak more naturally."
  zh: "理解日语交流方式的分析工具，让你说得更自然。"
  zh-TW: "理解日語交流方式的分析工具，讓你說得更自然。"
  ja: "日本語の会話の仕組みを理解し、より自然に話すための分析の道具。"
  ko: "일본어 대화가 어떻게 이루어지는지 이해해 더 자연스럽게 말하기 위한 분석 도구."
  vi: "Công cụ để hiểu cách giao tiếp tiếng Nhật vận hành, giúp nói tự nhiên hơn."
  ms: "Alat untuk memahami cara perbualan Jepun berfungsi supaya anda bertutur lebih asli."
  id: "Alat untuk memahami cara percakapan Jepang bekerja agar Anda berbicara lebih alami."
  hi: "जापानी बातचीत कैसे चलती है, यह समझने के औज़ार ताकि आप ज़्यादा सहज बोल सकें।"
outcomes:
  - en: "Analyse politeness and style in Japanese talk"
    zh: "分析日语对话中的礼貌与语体"
    zh-TW: "分析日語對話中的禮貌與語體"
    ja: "日本語の会話の丁寧さと文体を分析する"
    ko: "일본어 대화의 공손함과 문체 분석하기"
    vi: "Phân tích phép lịch sự và văn phong trong hội thoại Nhật"
    ms: "Analisis kesantunan dan gaya dalam perbualan Jepun"
    id: "Menganalisis kesopanan dan gaya dalam percakapan Jepang"
    hi: "जापानी बातचीत में शिष्टता और शैली का विश्लेषण करना"
  - en: "Choose language that fits the situation"
    zh: "根据场合选择合适的说法"
    zh-TW: "根據場合選擇合適的說法"
    ja: "場面に合った言葉を選ぶ"
    ko: "상황에 맞는 말 고르기"
    vi: "Chọn cách nói phù hợp hoàn cảnh"
    ms: "Pilih bahasa yang sesuai dengan situasi"
    id: "Memilih bahasa yang cocok dengan situasi"
    hi: "स्थिति के अनुसार भाषा चुनना"
  - en: "Reflect on your own Japanese interactions"
    zh: "反思自己的日语交流"
    zh-TW: "反思自己的日語交流"
    ja: "自分の日本語でのやりとりを振り返る"
    ko: "자신의 일본어 상호작용 돌아보기"
    vi: "Tự nhìn lại các tương tác tiếng Nhật của mình"
    ms: "Renungi interaksi Jepun anda sendiri"
    id: "Merefleksikan interaksi bahasa Jepang Anda sendiri"
    hi: "अपनी जापानी बातचीत पर विचार करना"
