code: INDO20016
year: 2026
learn:
  en: "Translating both ways between Indonesian and English, with texts from news to legal papers, plus key translation theory."
  zh: "印尼语与英语互译练习，文本从新闻到法律文件，并学习翻译理论要点。"
  zh-TW: "印尼語與英語互譯練習，文本從新聞到法律文件，並學習翻譯理論要點。"
  ja: "インドネシア語と英語の双方向の翻訳。ニュースから法律文書まで扱い、翻訳理論の要点も学ぶ。"
  ko: "인도네시아어와 영어 양방향 번역. 뉴스부터 법률 문서까지 다루고 번역 이론 핵심도 배운다."
  vi: "Dịch hai chiều Indonesia–Anh, với văn bản từ tin tức đến giấy tờ pháp lý, cùng lý thuyết dịch cơ bản."
  ms: "Menterjemah dua hala antara bahasa Indonesia dan Inggeris, dari berita hingga dokumen undang-undang, serta teori asas."
  id: "Menerjemahkan dua arah antara bahasa Indonesia dan Inggris, dari berita hingga dokumen hukum, plus teori penerjemahan."
  hi: "इंडोनेशियाई और अंग्रेज़ी के बीच दोनों ओर अनुवाद, ख़बरों से क़ानूनी काग़ज़ों तक, और अनुवाद सिद्धांत की मुख्य बातें।"
outcomes:
  - en: "Translate texts between Indonesian and English"
    zh: "在印尼语和英语之间翻译文本"
    zh-TW: "在印尼語和英語之間翻譯文本"
    ja: "インドネシア語と英語の間で文章を訳す"
    ko: "인도네시아어와 영어 사이 글 번역하기"
    vi: "Dịch văn bản giữa tiếng Indonesia và tiếng Anh"
    ms: "Terjemah teks antara bahasa Indonesia dan Inggeris"
    id: "Menerjemahkan teks antara bahasa Indonesia dan Inggris"
    hi: "इंडोनेशियाई और अंग्रेज़ी के बीच पाठों का अनुवाद करना"
  - en: "Handle cultural differences in translation"
    zh: "处理翻译中的文化差异"
    zh-TW: "處理翻譯中的文化差異"
    ja: "翻訳での文化の違いに対処する"
    ko: "번역에서 문화 차이 다루기"
    vi: "Xử lý khác biệt văn hóa khi dịch"
    ms: "Tangani perbezaan budaya dalam terjemahan"
    id: "Menangani perbedaan budaya dalam penerjemahan"
    hi: "अनुवाद में सांस्कृतिक अंतर सँभालना"
  - en: "Compare and critique existing translations"
    zh: "比较和评析已有译文"
    zh-TW: "比較和評析既有譯文"
    ja: "既存の翻訳を比べて評価する"
    ko: "기존 번역 비교하고 평가하기"
    vi: "So sánh và nhận xét các bản dịch có sẵn"
    ms: "Banding dan nilai terjemahan sedia ada"
    id: "Membandingkan dan menilai terjemahan yang ada"
    hi: "मौजूदा अनुवादों की तुलना और समीक्षा करना"
