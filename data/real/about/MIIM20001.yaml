code: MIIM20001
year: 2026
learn:
  en: "The basics of microbes, mainly bacteria and viruses, and how the immune system fights them."
  zh: "微生物基础，主要是细菌和病毒，以及免疫系统怎么对付它们。"
  zh-TW: "微生物基礎，主要是細菌和病毒，以及免疫系統怎麼對付它們。"
  ja: "微生物の基礎（主に細菌とウイルス）と、免疫系がそれらと戦う仕組み。"
  ko: "미생물 기초(주로 세균과 바이러스)와 면역계가 이들과 싸우는 방식."
  vi: "Kiến thức cơ bản về vi sinh vật, chủ yếu là vi khuẩn và virus, và cách hệ miễn dịch chống lại chúng."
  ms: "Asas mikrob, terutamanya bakteria dan virus, dan cara sistem imun melawannya."
  id: "Dasar mikroba, terutama bakteri dan virus, dan cara sistem imun melawannya."
  hi: "सूक्ष्मजीवों की बुनियादी बातें, खासकर बैक्टीरिया और वायरस, और इम्यून सिस्टम उनसे कैसे लड़ता है।"
outcomes:
  - en: "Use the key terms of microbiology and immunology"
    zh: "会用微生物学和免疫学的术语"
    zh-TW: "會用微生物學和免疫學的術語"
    ja: "微生物学と免疫学の主要用語を使う"
    ko: "미생물학과 면역학의 핵심 용어 사용하기"
    vi: "Dùng thuật ngữ chính của vi sinh học và miễn dịch học"
    ms: "Menggunakan istilah utama mikrobiologi dan imunologi"
    id: "Memakai istilah utama mikrobiologi dan imunologi"
    hi: "माइक्रोबायोलॉजी और इम्यूनोलॉजी के मुख्य शब्द इस्तेमाल करना"
  - en: "Describe how bacteria and viruses live and multiply"
    zh: "描述细菌和病毒的生命周期"
    zh-TW: "描述細菌和病毒的生命週期"
    ja: "細菌とウイルスの生き方と増え方を説明する"
    ko: "세균과 바이러스가 살고 증식하는 방식 설명하기"
    vi: "Mô tả cách vi khuẩn và virus sống và sinh sôi"
    ms: "Menghuraikan cara bakteria dan virus hidup dan membiak"
    id: "Menjelaskan cara bakteri dan virus hidup dan berkembang biak"
    hi: "बैक्टीरिया और वायरस कैसे जीते और बढ़ते हैं, बताना"
  - en: "Explain how microbes cause disease and how we respond"
    zh: "解释微生物怎么致病、身体怎么应对"
    zh-TW: "解釋微生物怎麼致病、身體怎麼應對"
    ja: "微生物が病気を起こす仕組みと体の反応を説明する"
    ko: "미생물이 병을 일으키는 방식과 우리 몸의 반응 설명하기"
    vi: "Giải thích vi sinh vật gây bệnh và cơ thể phản ứng ra sao"
    ms: "Menerangkan cara mikrob menyebabkan penyakit dan tindak balas kita"
    id: "Menjelaskan cara mikroba menyebabkan penyakit dan respons kita"
    hi: "सूक्ष्मजीव बीमारी कैसे करते हैं और हम कैसे जवाब देते हैं"
