code: ELEN90077
year: 2027
learn:
  en: "How wind, solar, batteries and electric vehicles connect to the grid, and what smart grids do about it."
  zh: "风电、光伏、储能和电动车如何接入电网，以及智能电网如何应对。"
  zh-TW: "風電、太陽光電、儲能與電動車如何接入電網，以及智慧電網如何因應。"
  ja: "風力・太陽光・蓄電池・電気自動車の系統連系と、スマートグリッドの役割。"
  ko: "풍력, 태양광, 배터리, 전기차의 계통 연계와 스마트그리드의 역할."
  vi: "Gió, mặt trời, pin lưu trữ và xe điện kết nối vào lưới thế nào, và lưới điện thông minh xử lý ra sao."
  ms: "Cara angin, solar, bateri dan kenderaan elektrik disambung ke grid, dan peranan grid pintar."
  id: "Cara angin, surya, baterai, dan kendaraan listrik terhubung ke jaringan, serta peran smart grid."
  hi: "पवन, सौर, बैटरी और इलेक्ट्रिक वाहन ग्रिड से कैसे जुड़ते हैं और स्मार्ट ग्रिड इसमें क्या करता है।"
outcomes:
  - en: "Explain the grid impacts of renewables and storage"
    zh: "说明可再生能源和储能对电网的影响"
    zh-TW: "說明再生能源與儲能對電網的影響"
    ja: "再エネと蓄電が系統に与える影響を説明する"
    ko: "재생에너지와 저장장치가 전력망에 주는 영향 설명하기"
    vi: "Giải thích tác động của năng lượng tái tạo và lưu trữ lên lưới"
    ms: "Menerangkan kesan tenaga boleh baharu dan storan pada grid"
    id: "Menjelaskan dampak energi terbarukan dan penyimpanan pada jaringan"
    hi: "नवीकरणीय ऊर्जा और स्टोरेज का ग्रिड पर असर समझाना"
  - en: "Describe smart transmission and distribution networks"
    zh: "描述智能输电和配电网络"
    zh-TW: "描述智慧輸電與配電網路"
    ja: "スマートな送電網・配電網を説明する"
    ko: "스마트 송전·배전망 설명하기"
    vi: "Mô tả lưới truyền tải và phân phối thông minh"
    ms: "Menerangkan rangkaian penghantaran dan pengagihan pintar"
    id: "Menjelaskan jaringan transmisi dan distribusi cerdas"
    hi: "स्मार्ट ट्रांसमिशन और वितरण नेटवर्क का वर्णन"
