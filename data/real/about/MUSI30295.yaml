code: MUSI30295
year: 2026
learn:
  en: "An auditioned percussion ensemble for experienced players, presenting landmark works and new pieces each semester. Pass/fail."
  zh: "需试音的打击乐合奏，面向有经验的乐手，每学期演出经典与新作。及格制。"
  zh-TW: "需試音的打擊樂合奏，面向有經驗的樂手，每學期演出經典與新作。及格制。"
  ja: "経験者向けオーディション制打楽器アンサンブル。毎学期名作と新作を披露。合否判定。"
  ko: "숙련자를 위한 오디션 타악 앙상블. 학기마다 명작과 신작 공연. 합격/불합격."
  vi: "Hòa tấu bộ gõ qua thử giọng cho người có kinh nghiệm, diễn tác phẩm kinh điển và mới. Đạt/không đạt."
  ms: "Ensembel perkusi melalui uji bakat, karya penting dan baharu setiap semester. Lulus/gagal."
  id: "Ansambel perkusi lewat audisi, karya penting dan baru tiap semester. Lulus/gagal."
  hi: "अनुभवी वादकों का ऑडिशन वाला ताल समूह, हर सत्र प्रसिद्ध व नई रचनाएँ। पास/फ़ेल।"
outcomes:
  - en: "Lead and support within a percussion section"
    zh: "在打击乐组中带领并配合"
    zh-TW: "在打擊樂組中帶領並配合"
    ja: "打楽器セクションでリードし支える"
    ko: "타악 섹션에서 이끌고 받쳐주기"
    vi: "Dẫn dắt và hỗ trợ trong nhóm bộ gõ"
    ms: "Pimpin dan sokong dalam seksyen perkusi"
    id: "Memimpin dan mendukung di seksi perkusi"
    hi: "ताल समूह में नेतृत्व और सहयोग करना"
  - en: "Prepare landmark and new percussion works"
    zh: "准备经典与新的打击乐作品"
    zh-TW: "準備經典與新的打擊樂作品"
    ja: "打楽器の名作と新作を準備する"
    ko: "타악 명작과 신작 준비하기"
    vi: "Chuẩn bị tác phẩm bộ gõ kinh điển và mới"
    ms: "Sediakan karya perkusi penting dan baharu"
    id: "Menyiapkan karya perkusi penting dan baru"
    hi: "प्रसिद्ध और नई ताल रचनाएँ तैयार करना"
  - en: "Perform in percussion ensemble concerts"
    zh: "参加打击乐合奏音乐会"
    zh-TW: "參加打擊樂合奏音樂會"
    ja: "打楽器アンサンブルの演奏会に出る"
    ko: "타악 앙상블 공연에 서기"
    vi: "Biểu diễn trong hòa nhạc bộ gõ"
    ms: "Membuat persembahan konsert perkusi"
    id: "Tampil dalam konser ansambel perkusi"
    hi: "ताल समूह कॉन्सर्ट में प्रस्तुति देना"
