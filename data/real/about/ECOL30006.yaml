code: ECOL30006
year: 2026
learn:
  en: "How ecological and evolutionary theory explain species distributions and responses to changing environments."
  zh: "用生态与进化理论解释物种分布及其对环境变化的响应。"
  zh-TW: "用生態與演化理論解釋物種分布及其對環境變化的反應。"
  ja: "生態・進化理論で種の分布と環境変化への応答を説明する。"
  ko: "생태·진화 이론으로 종 분포와 환경 변화에 대한 반응 설명하기."
  vi: "Lý thuyết sinh thái và tiến hóa giải thích phân bố loài và phản ứng trước môi trường thay đổi."
  ms: "Teori ekologi dan evolusi untuk menerangkan taburan spesies dan tindak balas terhadap perubahan persekitaran."
  id: "Teori ekologi dan evolusi untuk menjelaskan sebaran spesies dan responsnya terhadap perubahan lingkungan."
  hi: "पारिस्थितिक और विकासवादी सिद्धांत से प्रजातियों का फैलाव और बदलते पर्यावरण पर उनकी प्रतिक्रिया समझना।"
outcomes:
  - en: "Design an ecology experiment"
    zh: "设计生态学实验"
    zh-TW: "設計生態學實驗"
    ja: "生態学の実験を設計する"
    ko: "생태학 실험 설계하기"
    vi: "Thiết kế thí nghiệm sinh thái"
    ms: "Mereka bentuk eksperimen ekologi"
    id: "Merancang eksperimen ekologi"
    hi: "इकोलॉजी प्रयोग डिज़ाइन करना"
  - en: "Use computer models to study ecology"
    zh: "用计算机模型研究生态"
    zh-TW: "用電腦模型研究生態"
    ja: "コンピュータモデルで生態を調べる"
    ko: "컴퓨터 모델로 생태 연구하기"
    vi: "Dùng mô hình máy tính nghiên cứu sinh thái"
    ms: "Guna model komputer untuk kaji ekologi"
    id: "Memakai model komputer untuk meneliti ekologi"
    hi: "कंप्यूटर मॉडल से इकोलॉजी का अध्ययन करना"
  - en: "Critically review ecology research"
    zh: "批判性评价生态学研究"
    zh-TW: "批判性評價生態學研究"
    ja: "生態学研究を批判的に読む"
    ko: "생태학 연구 비판적으로 검토하기"
    vi: "Đánh giá phản biện nghiên cứu sinh thái"
    ms: "Menilai kajian ekologi secara kritis"
    id: "Menelaah riset ekologi secara kritis"
    hi: "इकोलॉजी शोध की आलोचनात्मक समीक्षा करना"
