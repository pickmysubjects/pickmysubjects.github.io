code: HPSC20025
year: 2026
learn:
  en: "How ideas about inheritance and genetics have shaped politics and society over two centuries, including eugenics."
  zh: "两百年来关于遗传和基因的观念如何影响政治和社会，包括优生学。"
  zh-TW: "兩百年來關於遺傳和基因的觀念如何影響政治和社會，包括優生學。"
  ja: "遺伝と遺伝学の考えが200年にわたり政治と社会をどう形づくったかを、優生学も含めて学ぶ。"
  ko: "유전과 유전학에 관한 생각이 200년 동안 정치와 사회를 어떻게 만들었는지 우생학을 포함해 배운다."
  vi: "Quan niệm về di truyền đã định hình chính trị và xã hội trong hai thế kỷ ra sao, kể cả thuyết ưu sinh."
  ms: "Cara idea tentang pewarisan dan genetik membentuk politik dan masyarakat selama dua abad, termasuk eugenik."
  id: "Cara gagasan tentang pewarisan dan genetika membentuk politik dan masyarakat selama dua abad, termasuk eugenika."
  hi: "दो सदियों में आनुवंशिकता और जेनेटिक्स के विचारों ने राजनीति और समाज को कैसे गढ़ा, यूजेनिक्स समेत।"
outcomes:
  - en: "Trace the history of ideas about inheritance"
    zh: "梳理遗传观念的历史"
    zh-TW: "梳理遺傳觀念的歷史"
    ja: "遺伝についての考えの歴史をたどる"
    ko: "유전 개념의 역사 따라가기"
    vi: "Lần theo lịch sử các ý tưởng về di truyền"
    ms: "Jejaki sejarah idea tentang pewarisan"
    id: "Menelusuri sejarah gagasan tentang pewarisan"
    hi: "आनुवंशिकता से जुड़े विचारों का इतिहास समझना"
  - en: "Analyse how genetics has been used in politics"
    zh: "分析遗传学如何被用于政治"
    zh-TW: "分析遺傳學如何被用於政治"
    ja: "遺伝学が政治でどう使われたか分析する"
    ko: "유전학이 정치에 이용된 방식 분석하기"
    vi: "Phân tích di truyền học đã được dùng trong chính trị ra sao"
    ms: "Analisis cara genetik digunakan dalam politik"
    id: "Menganalisis cara genetika dipakai dalam politik"
    hi: "राजनीति में जेनेटिक्स के इस्तेमाल का विश्लेषण करना"
  - en: "Discuss ethical issues in genetics today"
    zh: "讨论当今遗传学的伦理问题"
    zh-TW: "討論當今遺傳學的倫理問題"
    ja: "今日の遺伝学の倫理的問題を論じる"
    ko: "오늘날 유전학의 윤리 문제 논의하기"
    vi: "Thảo luận các vấn đề đạo đức của di truyền học ngày nay"
    ms: "Bincangkan isu etika dalam genetik hari ini"
    id: "Membahas isu etis dalam genetika saat ini"
    hi: "आज जेनेटिक्स के नैतिक मुद्दों पर चर्चा करना"
