code: FREN30015
year: 2026
learn:
  en: "French food and wine culture since the 1800s: gastronomy, class, colonial and global influences, and food sovereignty. Taught in French."
  zh: "19 世纪以来的法国饮食与葡萄酒文化：美食学、阶层、殖民与全球化影响，以及食物主权，用法语授课。"
  zh-TW: "19 世紀以來的法國飲食與葡萄酒文化：美食學、階層、殖民與全球化影響，以及食物主權，用法語授課。"
  ja: "19世紀以降のフランスの食とワインの文化。ガストロノミー、階級、植民地・グローバル化の影響、食料主権。フランス語で授業。"
  ko: "19세기 이후 프랑스의 음식과 와인 문화. 미식학, 계급, 식민·세계화의 영향, 식량 주권. 프랑스어 수업."
  vi: "Văn hóa ẩm thực và rượu vang Pháp từ thế kỷ 19: ẩm thực học, giai cấp, ảnh hưởng thuộc địa, toàn cầu và chủ quyền lương thực."
  ms: "Budaya makanan dan wain Perancis sejak 1800-an: gastronomi, kelas, pengaruh kolonial dan global, kedaulatan makanan. Dalam bahasa Perancis."
  id: "Budaya makanan dan anggur Prancis sejak 1800-an: gastronomi, kelas, pengaruh kolonial dan global, kedaulatan pangan. Dalam bahasa Prancis."
  hi: "1800 के दशक से फ़्रांस का खान-पान और वाइन संस्कृति: गैस्ट्रोनॉमी, वर्ग, औपनिवेशिक व वैश्विक असर, खाद्य संप्रभुता। फ़्रेंच में।"
outcomes:
  - en: "Explain how food became a marker of French identity"
    zh: "解释饮食如何成为法国身份的标志"
    zh-TW: "解釋飲食如何成為法國身分的標誌"
    ja: "食がフランスらしさの象徴になった経緯を説明する"
    ko: "음식이 프랑스 정체성의 표지가 된 과정 설명하기"
    vi: "Giải thích ẩm thực trở thành dấu ấn bản sắc Pháp ra sao"
    ms: "Terangkan cara makanan menjadi penanda identiti Perancis"
    id: "Menjelaskan cara makanan menjadi penanda identitas Prancis"
    hi: "खाना फ़्रांसीसी पहचान का निशान कैसे बना, समझाना"
  - en: "Read recipes, reviews and films as cultural texts"
    zh: "把食谱、餐厅评论和电影当作文化文本来读"
    zh-TW: "把食譜、餐廳評論和電影當作文化文本來讀"
    ja: "レシピ、店評、映画を文化のテクストとして読む"
    ko: "요리책, 식당 평론, 영화를 문화 텍스트로 읽기"
    vi: "Đọc công thức, bài phê bình, phim như văn bản văn hóa"
    ms: "Baca resipi, ulasan dan filem sebagai teks budaya"
    id: "Membaca resep, ulasan dan film sebagai teks budaya"
    hi: "रेसिपी, समीक्षाएँ और फ़िल्में सांस्कृतिक पाठ के रूप में पढ़ना"
  - en: "Discuss food issues in French"
    zh: "用法语讨论饮食议题"
    zh-TW: "用法語討論飲食議題"
    ja: "食の問題をフランス語で話し合う"
    ko: "음식 문제를 프랑스어로 토론하기"
    vi: "Thảo luận vấn đề ẩm thực bằng tiếng Pháp"
    ms: "Bincangkan isu makanan dalam bahasa Perancis"
    id: "Membahas isu pangan dalam bahasa Prancis"
    hi: "खाने से जुड़े मुद्दों पर फ़्रेंच में चर्चा करना"
