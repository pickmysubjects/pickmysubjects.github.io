code: HPSC10002
year: 2026
learn:
  en: "What science is, what makes knowledge scientific, and why people trust or doubt experts."
  zh: "科学是什么、什么样的知识算科学，以及人们为什么信任或怀疑专家。"
  zh-TW: "科學是什麼、什麼樣的知識算科學，以及人們為什麼信任或懷疑專家。"
  ja: "科学とは何か、何が知識を科学的にするのか、人々はなぜ専門家を信じたり疑ったりするのか。"
  ko: "과학이란 무엇이고 어떤 지식이 과학적인지, 사람들은 왜 전문가를 믿거나 의심하는지 배운다."
  vi: "Khoa học là gì, điều gì làm tri thức mang tính khoa học, và vì sao người ta tin hay nghi ngờ chuyên gia."
  ms: "Apa itu sains, apa yang menjadikan ilmu itu saintifik, dan kenapa orang percaya atau ragu pada pakar."
  id: "Apa itu sains, apa yang membuat pengetahuan disebut ilmiah, dan kenapa orang percaya atau ragu pada pakar."
  hi: "विज्ञान क्या है, कौन-सा ज्ञान वैज्ञानिक माना जाता है और लोग विशेषज्ञों पर भरोसा या शक क्यों करते हैं।"
outcomes:
  - en: "Explain the main ideas from philosophy and sociology of science"
    zh: "说明科学哲学和科学社会学的主要观点"
    zh-TW: "說明科學哲學和科學社會學的主要觀點"
    ja: "科学哲学と科学社会学の主な考え方を説明する"
    ko: "과학철학과 과학사회학의 주요 관점 설명하기"
    vi: "Giải thích các ý chính của triết học và xã hội học khoa học"
    ms: "Terangkan idea utama falsafah dan sosiologi sains"
    id: "Menjelaskan gagasan utama filsafat dan sosiologi ilmu"
    hi: "विज्ञान के दर्शन और समाजशास्त्र के मुख्य विचार समझाना"
  - en: "Tell scientific claims apart from non-scientific ones"
    zh: "分辨科学和非科学的说法"
    zh-TW: "分辨科學和非科學的說法"
    ja: "科学的な主張とそうでない主張を見分ける"
    ko: "과학적 주장과 비과학적 주장 구별하기"
    vi: "Phân biệt nhận định khoa học với phi khoa học"
    ms: "Bezakan dakwaan saintifik dengan yang bukan saintifik"
    id: "Membedakan klaim ilmiah dari yang tidak ilmiah"
    hi: "वैज्ञानिक और गैर-वैज्ञानिक दावों में फ़र्क करना"
  - en: "Build a clear argument about science's place in society"
    zh: "就科学在社会中的位置写出清楚的论证"
    zh-TW: "就科學在社會中的位置寫出清楚的論證"
    ja: "社会における科学の位置づけについて筋の通った議論を組み立てる"
    ko: "사회 속 과학의 역할에 대해 명확한 논증 세우기"
    vi: "Xây dựng lập luận rõ ràng về vị trí của khoa học trong xã hội"
    ms: "Bina hujah yang jelas tentang tempat sains dalam masyarakat"
    id: "Menyusun argumen yang jelas tentang tempat sains di masyarakat"
    hi: "समाज में विज्ञान की जगह पर साफ़ तर्क बनाना"
