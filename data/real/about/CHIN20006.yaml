code: CHIN20006
year: 2026
learn:
  en: "An introduction to classical literary Chinese through famous texts from imperial China."
  zh: "通过中国古代名篇入门文言文。"
  zh-TW: "透過中國古代名篇入門文言文。"
  ja: "中国の古典の名文を通して文語文（文言）を学ぶ入門。"
  ko: "중국 고전 명문을 통해 문언문(한문)을 배우는 입문."
  vi: "Nhập môn văn ngôn Trung Quốc qua các tác phẩm nổi tiếng thời phong kiến."
  ms: "Pengenalan bahasa Cina klasik melalui teks terkenal dari zaman empayar."
  id: "Pengantar bahasa Tionghoa klasik melalui teks terkenal dari masa kekaisaran."
  hi: "शाही चीन के प्रसिद्ध ग्रंथों के ज़रिए शास्त्रीय साहित्यिक चीनी का परिचय।"
outcomes:
  - en: "Read short classical Chinese texts"
    zh: "阅读简短的文言文"
    zh-TW: "閱讀簡短的文言文"
    ja: "短い文言文を読む"
    ko: "짧은 문언문 읽기"
    vi: "Đọc các đoạn văn ngôn ngắn"
    ms: "Baca teks Cina klasik yang pendek"
    id: "Membaca teks Tionghoa klasik yang pendek"
    hi: "छोटे शास्त्रीय चीनी पाठ पढ़ना"
  - en: "Explain key grammar of literary Chinese"
    zh: "说明文言文的主要语法"
    zh-TW: "說明文言文的主要文法"
    ja: "文言文の主な文法を説明する"
    ko: "문언문의 주요 문법 설명하기"
    vi: "Giải thích ngữ pháp chính của văn ngôn"
    ms: "Terangkan tatabahasa utama bahasa Cina klasik"
    id: "Menjelaskan tata bahasa utama bahasa Tionghoa klasik"
    hi: "साहित्यिक चीनी का मुख्य व्याकरण समझाना"
  - en: "See how classical texts shape modern Chinese"
    zh: "理解古文如何影响现代汉语"
    zh-TW: "理解古文如何影響現代漢語"
    ja: "古典が現代中国語に与えた影響を知る"
    ko: "고전이 현대 중국어에 준 영향 이해하기"
    vi: "Thấy cổ văn ảnh hưởng tiếng Trung hiện đại thế nào"
    ms: "Lihat cara teks klasik membentuk bahasa Cina moden"
    id: "Melihat pengaruh teks klasik pada bahasa Tionghoa modern"
    hi: "समझना कि शास्त्रीय पाठ आधुनिक चीनी को कैसे गढ़ते हैं"
