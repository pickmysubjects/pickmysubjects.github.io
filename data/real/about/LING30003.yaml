code: LING30003
year: 2026
learn:
  en: "How children learn their first language, from before birth through school: sounds, grammar, meaning and use, across languages."
  zh: "儿童如何习得母语，从出生前到学龄期：语音、语法、语义和语用，并进行跨语言比较。"
  zh-TW: "兒童如何習得母語，從出生前到學齡期：語音、文法、語義和語用，並進行跨語言比較。"
  ja: "子どもは生まれる前から学齢期までに母語をどう身につけるか。音、文法、意味、使い方を言語間で比べる。"
  ko: "아이들은 태어나기 전부터 학령기까지 모국어를 어떻게 배우나. 소리, 문법, 의미, 쓰임을 언어 간 비교한다."
  vi: "Trẻ học tiếng mẹ đẻ ra sao từ trước khi sinh đến tuổi đi học: âm, ngữ pháp, nghĩa và cách dùng, so sánh nhiều ngôn ngữ."
  ms: "Cara kanak-kanak memperoleh bahasa pertama, dari sebelum lahir hingga alam persekolahan: bunyi, tatabahasa, makna dan penggunaan."
  id: "Cara anak memperoleh bahasa pertama, dari sebelum lahir hingga usia sekolah: bunyi, tata bahasa, makna dan penggunaan."
  hi: "बच्चे जन्म से पहले से स्कूल तक अपनी पहली भाषा कैसे सीखते हैं: ध्वनि, व्याकरण, अर्थ और प्रयोग, अलग-अलग भाषाओं में।"
outcomes:
  - en: "Describe the stages of child language"
    zh: "描述儿童语言发展的各个阶段"
    zh-TW: "描述兒童語言發展的各個階段"
    ja: "子どもの言語発達の段階を説明する"
    ko: "아동 언어 발달 단계 설명하기"
    vi: "Mô tả các giai đoạn phát triển ngôn ngữ ở trẻ"
    ms: "Huraikan peringkat bahasa kanak-kanak"
    id: "Menggambarkan tahap bahasa anak"
    hi: "बच्चों की भाषा के विकास के चरण बताना"
  - en: "Compare acquisition across languages"
    zh: "比较不同语言的习得过程"
    zh-TW: "比較不同語言的習得過程"
    ja: "言語ごとの習得の違いを比べる"
    ko: "언어별 습득 과정 비교하기"
    vi: "So sánh quá trình thụ đắc giữa các ngôn ngữ"
    ms: "Bandingkan pemerolehan merentas bahasa"
    id: "Membandingkan pemerolehan lintas bahasa"
    hi: "अलग-अलग भाषाओं में भाषा अर्जन की तुलना करना"
  - en: "Evaluate theories of how children learn language"
    zh: "评估儿童语言习得的理论"
    zh-TW: "評估兒童語言習得的理論"
    ja: "子どもの言語習得の理論を評価する"
    ko: "아동 언어 습득 이론 평가하기"
    vi: "Đánh giá các lý thuyết về cách trẻ học ngôn ngữ"
    ms: "Nilai teori cara kanak-kanak belajar bahasa"
    id: "Menilai teori cara anak belajar bahasa"
    hi: "बच्चे भाषा कैसे सीखते हैं, इन सिद्धांतों का मूल्यांकन करना"
