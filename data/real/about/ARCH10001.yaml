code: ARCH10001
year: 2026
learn:
  en: "Learn to observe and communicate design through hand drawing, models, 2D vector work and 3D modelling in Rhino."
  zh: "学习用手绘、模型、二维矢量图和Rhino三维建模来观察和表达设计。"
  zh-TW: "學習用手繪、模型、二維向量圖和 Rhino 三維建模來觀察和表達設計。"
  ja: "手描き、模型、2Dベクター、Rhinoの3Dモデリングで設計を観察し伝える方法を学ぶ。"
  ko: "손그림, 모형, 2D 벡터 작업, Rhino 3D 모델링으로 디자인을 관찰하고 전달하는 법을 배운다."
  vi: "Học quan sát và truyền đạt thiết kế bằng vẽ tay, mô hình, đồ họa vector 2D và dựng hình 3D trên Rhino."
  ms: "Belajar memerhati dan menyampaikan reka bentuk melalui lukisan tangan, model, kerja vektor 2D dan pemodelan 3D Rhino."
  id: "Belajar mengamati dan menyampaikan desain lewat gambar tangan, maket, vektor 2D, dan pemodelan 3D di Rhino."
  hi: "हाथ से ड्रॉइंग, मॉडल, 2D वेक्टर और Rhino 3D मॉडलिंग से डिज़ाइन को देखना और समझाना सीखना।"
outcomes:
  - en: "Draw and model by hand and on screen"
    zh: "手绘和电脑上绘图建模"
    zh-TW: "手繪和電腦上繪圖建模"
    ja: "手と画面の両方で描き、模型を作る"
    ko: "손과 컴퓨터로 그리고 모델링하기"
    vi: "Vẽ và dựng mô hình bằng tay lẫn trên máy"
    ms: "Melukis dan memodel dengan tangan dan komputer"
    id: "Menggambar dan memodelkan secara manual dan digital"
    hi: "हाथ से और स्क्रीन पर ड्रॉ और मॉडल करना"
  - en: "Represent spaces accurately at different scales"
    zh: "在不同比例下准确表现空间"
    zh-TW: "在不同比例下準確表現空間"
    ja: "さまざまな縮尺で空間を正確に表す"
    ko: "여러 축척에서 공간을 정확히 표현하기"
    vi: "Thể hiện không gian chính xác ở nhiều tỉ lệ"
    ms: "Mewakili ruang dengan tepat pada pelbagai skala"
    id: "Merepresentasikan ruang secara akurat di berbagai skala"
    hi: "अलग-अलग स्केल पर जगह को सही दिखाना"
  - en: "Reflect on how drawing shapes design thinking"
    zh: "反思表现方式如何影响设计思考"
    zh-TW: "反思表現方式如何影響設計思考"
    ja: "表現が設計思考に与える影響を振り返る"
    ko: "표현 방식이 디자인 사고에 주는 영향 성찰하기"
    vi: "Suy ngẫm cách thể hiện định hình tư duy thiết kế"
    ms: "Merenung cara lukisan membentuk pemikiran reka bentuk"
    id: "Merefleksikan pengaruh representasi pada pemikiran desain"
    hi: "ड्रॉइंग डिज़ाइन सोच को कैसे आकार देती है, इस पर विचार करना"
