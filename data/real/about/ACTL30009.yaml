code: ACTL30009
year: 2026
learn:
  en: "Pricing options and other derivatives, from binomial trees to Black-Scholes, plus interest-rate and credit risk models."
  zh: "期权等衍生品定价，从二叉树到Black-Scholes，以及利率和信用风险模型。"
  zh-TW: "選擇權等衍生性商品定價，從二元樹到Black-Scholes，以及利率與信用風險模型。"
  ja: "オプションなどデリバティブの価格付け：二項モデルからBlack-Scholes、金利・信用リスクモデルまで。"
  ko: "옵션 등 파생상품 가격 결정: 이항모형부터 블랙-숄즈, 금리·신용위험 모형까지."
  vi: "Định giá quyền chọn và phái sinh, từ cây nhị thức đến Black-Scholes, cùng mô hình lãi suất và rủi ro tín dụng."
  ms: "Penentuan harga opsyen dan derivatif, dari pokok binomial hingga Black-Scholes, serta model kadar faedah dan risiko kredit."
  id: "Penentuan harga opsi dan derivatif, dari pohon binomial sampai Black-Scholes, plus model suku bunga dan risiko kredit."
  hi: "ऑप्शन और दूसरे डेरिवेटिव की कीमत तय करना, बाइनोमियल ट्री से ब्लैक-शोल्स तक, साथ में ब्याज दर और क्रेडिट जोखिम मॉडल।"
outcomes:
  - en: "Value options with binomial trees"
    zh: "用二叉树给期权定价"
    zh-TW: "用二元樹替選擇權定價"
    ja: "二項ツリーでオプションを評価する"
    ko: "이항 트리로 옵션 가치 평가"
    vi: "Định giá quyền chọn bằng cây nhị thức"
    ms: "Nilai opsyen dengan pokok binomial"
    id: "Menilai opsi dengan pohon binomial"
    hi: "बाइनोमियल ट्री से ऑप्शन का मूल्यांकन"
  - en: "Derive Black-Scholes prices using Itô calculus"
    zh: "用伊藤微积分推导Black-Scholes价格"
    zh-TW: "用伊藤微積分推導Black-Scholes價格"
    ja: "伊藤解析でBlack-Scholes価格を導く"
    ko: "이토 미적분으로 블랙-숄즈 가격 유도"
    vi: "Suy ra giá Black-Scholes bằng giải tích Itô"
    ms: "Terbitkan harga Black-Scholes dengan kalkulus Itô"
    id: "Menurunkan harga Black-Scholes dengan kalkulus Itô"
    hi: "इटो कैलकुलस से ब्लैक-शोल्स कीमत निकालना"
  - en: "Use simple interest-rate and credit risk models"
    zh: "使用简单的利率和信用风险模型"
    zh-TW: "使用簡單的利率與信用風險模型"
    ja: "簡単な金利・信用リスクモデルを使う"
    ko: "간단한 금리·신용위험 모형 활용"
    vi: "Dùng mô hình lãi suất và rủi ro tín dụng đơn giản"
    ms: "Guna model mudah kadar faedah dan risiko kredit"
    id: "Memakai model sederhana suku bunga dan risiko kredit"
    hi: "सरल ब्याज दर और क्रेडिट जोखिम मॉडल इस्तेमाल करना"
