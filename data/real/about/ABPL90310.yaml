code: ABPL90310
year: 2027
learn:
  en: "The life-cycle environmental effects of building and construction, and how life cycle assessment measures and reduces them."
  zh: "建筑设计与施工的全生命周期环境影响，以及如何用生命周期评估来衡量和减少。"
  zh-TW: "建築設計與施工的全生命週期環境影響，以及如何用生命週期評估來衡量和減少。"
  ja: "建築と施工のライフサイクル環境影響と、LCAによる評価・削減。"
  ko: "건축·시공의 전과정 환경 영향과 전과정평가로 이를 측정·감소하는 법."
  vi: "Tác động môi trường vòng đời của xây dựng và cách đánh giá vòng đời đo lường, giảm thiểu."
  ms: "Kesan alam sekitar kitar hayat pembinaan dan cara penilaian kitar hayat mengukur serta mengurangkannya."
  id: "Dampak lingkungan siklus hidup konstruksi dan cara penilaian siklus hidup mengukur serta menguranginya."
  hi: "निर्माण के जीवन-चक्र पर्यावरणीय प्रभाव और लाइफ-साइकिल असेसमेंट से उन्हें मापना व घटाना।"
outcomes:
  - en: "Use life cycle assessment on construction"
    zh: "在建筑中运用生命周期评估"
    zh-TW: "在建築中運用生命週期評估"
    ja: "建設にLCAを使う"
    ko: "건설에 전과정평가 적용하기"
    vi: "Áp dụng đánh giá vòng đời cho xây dựng"
    ms: "Menggunakan penilaian kitar hayat dalam pembinaan"
    id: "Menerapkan penilaian siklus hidup pada konstruksi"
    hi: "निर्माण में लाइफ-साइकिल असेसमेंट लागू करना"
  - en: "Link construction to the wider economy with input-output analysis"
    zh: "用投入产出分析把建筑业与整体经济联系起来"
    zh-TW: "用投入產出分析把建築業與整體經濟連結起來"
    ja: "産業連関分析で建設と経済全体を結びつける"
    ko: "투입산출 분석으로 건설과 경제 전반 연결하기"
    vi: "Liên kết xây dựng với nền kinh tế bằng phân tích đầu vào–đầu ra"
    ms: "Mengaitkan pembinaan dengan ekonomi melalui analisis input-output"
    id: "Mengaitkan konstruksi dengan ekonomi lewat analisis input-output"
    hi: "इनपुट-आउटपुट विश्लेषण से निर्माण को अर्थव्यवस्था से जोड़ना"
