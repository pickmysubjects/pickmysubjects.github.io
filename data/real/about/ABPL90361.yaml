code: ABPL90361
year: 2027
learn:
  en: "A making-based elective where you design and build an experimental furniture piece around material qualities."
  zh: "以动手制作为主的选修课，围绕材料特性设计并制作一件实验性家具。"
  zh-TW: "以動手製作為主的選修課，圍繞材料特性設計並製作一件實驗性家具。"
  ja: "素材の特性を生かして実験的な家具を設計・制作するものづくり選択科目。"
  ko: "재료 특성을 살려 실험적 가구를 디자인하고 제작하는 실습 선택과목."
  vi: "Môn tự chọn thực hành: thiết kế và chế tác một món nội thất thử nghiệm dựa trên đặc tính vật liệu."
  ms: "Elektif berasaskan pembuatan: mereka dan membina perabot eksperimen berdasarkan sifat bahan."
  id: "Elektif berbasis pembuatan: mendesain dan membuat furnitur eksperimental berdasarkan sifat material."
  hi: "मटीरियल के गुणों पर आधारित प्रयोगात्मक फ़र्नीचर डिज़ाइन करके बनाने वाला ऐच्छिक विषय।"
outcomes:
  - en: "Develop a design through making"
    zh: "在制作中推进设计"
    zh-TW: "在製作中推進設計"
    ja: "制作を通してデザインを練る"
    ko: "제작을 통해 디자인 발전시키기"
    vi: "Phát triển thiết kế qua chế tác"
    ms: "Membangunkan reka bentuk melalui pembuatan"
    id: "Mengembangkan desain lewat pembuatan"
    hi: "बनाते हुए डिज़ाइन विकसित करना"
  - en: "Use material qualities in furniture design"
    zh: "在家具设计中发挥材料特性"
    zh-TW: "在家具設計中發揮材料特性"
    ja: "家具設計に素材の特性を生かす"
    ko: "가구 설계에 재료 특성 활용하기"
    vi: "Tận dụng đặc tính vật liệu trong thiết kế nội thất"
    ms: "Memanfaatkan sifat bahan dalam reka perabot"
    id: "Memanfaatkan sifat material dalam desain furnitur"
    hi: "फ़र्नीचर डिज़ाइन में मटीरियल गुणों का उपयोग"
