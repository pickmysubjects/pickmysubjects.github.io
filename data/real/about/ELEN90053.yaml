code: ELEN90053
year: 2027
learn:
  en: "Practical design of electronic systems, from PCBs and oscillators to power supplies and sensors, through a lab project."
  zh: "通过实验项目学习电子系统的实用设计，从 PCB、振荡器到电源和传感器。"
  zh-TW: "透過實驗專案學習電子系統的實用設計，從 PCB、振盪器到電源與感測器。"
  ja: "実験プロジェクトを通じ、PCB・発振器から電源・センサーまで電子システムの実践的設計を学ぶ。"
  ko: "실험 프로젝트를 통해 PCB, 발진기부터 전원, 센서까지 전자 시스템의 실무 설계를 배운다."
  vi: "Thiết kế thực hành hệ thống điện tử, từ mạch in, bộ dao động đến nguồn và cảm biến, qua một dự án thí nghiệm."
  ms: "Reka bentuk praktikal sistem elektronik, dari PCB dan pengayun hingga bekalan kuasa dan sensor, melalui projek makmal."
  id: "Desain praktis sistem elektronik, dari PCB dan osilator hingga catu daya dan sensor, lewat proyek laboratorium."
  hi: "लैब प्रोजेक्ट के ज़रिए इलेक्ट्रॉनिक सिस्टम का व्यावहारिक डिज़ाइन, PCB और ऑसिलेटर से पावर सप्लाई और सेंसर तक।"
outcomes:
  - en: "Analyse standard electronic subsystems quantitatively"
    zh: "定量分析常见电子子系统"
    zh-TW: "定量分析常見電子子系統"
    ja: "標準的な電子サブシステムを定量的に解析する"
    ko: "표준 전자 서브시스템을 정량적으로 해석하기"
    vi: "Phân tích định lượng các hệ thống con điện tử tiêu chuẩn"
    ms: "Menganalisis subsistem elektronik piawai secara kuantitatif"
    id: "Menganalisis subsistem elektronik standar secara kuantitatif"
    hi: "मानक इलेक्ट्रॉनिक उप-प्रणालियों का मात्रात्मक विश्लेषण"
  - en: "Design, build and test electronic subsystems and integrate them"
    zh: "设计、制作、测试电子子系统并将其集成"
    zh-TW: "設計、製作、測試電子子系統並加以整合"
    ja: "電子サブシステムを設計・製作・試験し統合する"
    ko: "전자 서브시스템을 설계·제작·시험하고 통합하기"
    vi: "Thiết kế, chế tạo, kiểm thử và tích hợp hệ thống con điện tử"
    ms: "Mereka bentuk, membina, menguji dan menyepadukan subsistem elektronik"
    id: "Merancang, membuat, menguji dan mengintegrasikan subsistem elektronik"
    hi: "इलेक्ट्रॉनिक उप-प्रणालियाँ डिज़ाइन करना, बनाना, जाँचना और जोड़ना"
