code: FLTV20017
year: 2026
learn:
  en: "Genre writing: sci-fi, romance, thriller, fantasy and horror conventions, ending in a 30-page genre screenplay."
  zh: "类型片写作：科幻、爱情、惊悚、奇幻与恐怖，最后写30页剧本。"
  zh-TW: "類型片寫作：科幻、愛情、驚悚、奇幻與恐怖，最後寫 30 頁劇本。"
  ja: "ジャンル脚本：SF・恋愛・スリラー・ファンタジー・ホラーの型を学び30ページを書く。"
  ko: "장르 각본: SF·로맨스·스릴러·판타지·호러의 관습, 30쪽 각본으로 마무리."
  vi: "Viết theo thể loại: khoa học viễn tưởng, lãng mạn, giật gân, giả tưởng, kinh dị."
  ms: "Penulisan genre: fiksyen sains, romantik, thriller, fantasi, seram, dan skrip 30 halaman."
  id: "Menulis genre: fiksi ilmiah, roman, thriller, fantasi, horor, lalu naskah 30 halaman."
  hi: "जॉनर लेखन: साइ-फ़ाई, रोमांस, थ्रिलर, फ़ैंटेसी और हॉरर, अंत में 30 पेज की पटकथा।"
outcomes:
  - en: "Use the conventions of a chosen genre"
    zh: "运用所选类型的惯例"
    zh-TW: "運用所選類型的慣例"
    ja: "選んだジャンルの型を使う"
    ko: "선택한 장르의 관습 활용하기"
    vi: "Dùng quy ước của thể loại đã chọn"
    ms: "Guna konvensi genre pilihan"
    id: "Memakai konvensi genre pilihan"
    hi: "चुने जॉनर की परंपराएँ अपनाना"
  - en: "Work through story exercises in a team"
    zh: "在故事小组中完成练习"
    zh-TW: "在故事小組中完成練習"
    ja: "ストーリーチームで演習をこなす"
    ko: "스토리 팀에서 연습 과제 하기"
    vi: "Làm bài tập câu chuyện theo nhóm"
    ms: "Buat latihan cerita dalam pasukan"
    id: "Mengerjakan latihan cerita dalam tim"
    hi: "टीम में कहानी अभ्यास करना"
  - en: "Write a 30-page genre screenplay"
    zh: "写一部30页类型片剧本"
    zh-TW: "寫一部 30 頁類型片劇本"
    ja: "30ページのジャンル脚本を書く"
    ko: "30쪽 장르 각본 쓰기"
    vi: "Viết kịch bản thể loại 30 trang"
    ms: "Tulis skrip genre 30 halaman"
    id: "Menulis naskah genre 30 halaman"
    hi: "30 पेज की जॉनर पटकथा लिखना"
