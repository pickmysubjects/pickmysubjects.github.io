code: POLS20034
year: 2026
learn:
  en: "How political and social research is designed and done, mainly with qualitative methods, and how to judge whether research is good."
  zh: "政治和社会研究如何设计和开展（以质性方法为主），以及如何判断研究质量。"
  zh-TW: "政治和社會研究如何設計和進行（以質性方法為主），以及如何判斷研究品質。"
  ja: "政治・社会研究をどう設計し実施するか（主に質的方法）、そして研究の良し悪しをどう判断するかを学ぶ。"
  ko: "정치·사회 연구를 어떻게 설계하고 수행하는지(주로 질적 방법), 연구의 질을 어떻게 판단하는지 배운다."
  vi: "Nghiên cứu chính trị và xã hội được thiết kế và thực hiện ra sao, chủ yếu bằng phương pháp định tính, và cách đánh giá chất lượng nghiên cứu."
  ms: "Bagaimana kajian politik dan sosial direka dan dijalankan, terutamanya dengan kaedah kualitatif, dan cara menilai mutu kajian."
  id: "Bagaimana riset politik dan sosial dirancang dan dijalankan, terutama dengan metode kualitatif, serta cara menilai kualitas riset."
  hi: "राजनीतिक और सामाजिक शोध कैसे डिज़ाइन और किया जाता है, ज़्यादातर गुणात्मक तरीकों से, और किसी शोध की गुणवत्ता कैसे परखें।"
outcomes:
  - en: "Explain different ways of knowing in social science"
    zh: "说明社会科学中不同的认识方式"
    zh-TW: "說明社會科學中不同的認識方式"
    ja: "社会科学におけるさまざまな知り方を説明する"
    ko: "사회과학의 다양한 앎의 방식 설명하기"
    vi: "Giải thích các cách hiểu biết khác nhau trong khoa học xã hội"
    ms: "Terangkan cara mengetahui yang berbeza dalam sains sosial"
    id: "Menjelaskan berbagai cara mengetahui dalam ilmu sosial"
    hi: "सामाजिक विज्ञान में जानने के अलग-अलग तरीके समझाना"
  - en: "Compare research methods and their limits"
    zh: "比较各种研究方法及其局限"
    zh-TW: "比較各種研究方法及其侷限"
    ja: "研究手法とその限界を比べる"
    ko: "연구 방법과 그 한계 비교하기"
    vi: "So sánh các phương pháp nghiên cứu và hạn chế của chúng"
    ms: "Bandingkan kaedah kajian dan hadnya"
    id: "Membandingkan metode riset dan batasannya"
    hi: "शोध के तरीकों और उनकी सीमाओं की तुलना करना"
  - en: "Judge the quality and ethics of a study"
    zh: "评判一项研究的质量和伦理"
    zh-TW: "評判一項研究的品質和倫理"
    ja: "研究の質と倫理を判断する"
    ko: "연구의 질과 윤리 판단하기"
    vi: "Đánh giá chất lượng và đạo đức của một nghiên cứu"
    ms: "Nilai mutu dan etika sesuatu kajian"
    id: "Menilai kualitas dan etika suatu penelitian"
    hi: "किसी शोध की गुणवत्ता और नैतिकता परखना"
