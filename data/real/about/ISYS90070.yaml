code: ISYS90070
year: 2027
learn:
  en: "Information security consulting: risk assessment, incident response, disaster recovery, knowledge leakage and policy."
  zh: "信息安全咨询：风险评估、事件响应、灾难恢复、知识泄露与安全政策。"
  zh-TW: "資訊安全顧問：風險評估、事件應變、災難復原、知識外洩與安全政策。"
  ja: "情報セキュリティコンサルティング：リスク評価、インシデント対応、災害復旧、情報漏えい、ポリシー。"
  ko: "정보보안 컨설팅: 위험 평가, 사고 대응, 재해 복구, 지식 유출, 보안 정책."
  vi: "Tư vấn an ninh thông tin: đánh giá rủi ro, ứng phó sự cố, khôi phục thảm họa, rò rỉ tri thức, chính sách."
  ms: "Perundingan keselamatan maklumat: penilaian risiko, tindak balas insiden, pemulihan bencana, kebocoran pengetahuan dan dasar."
  id: "Konsultasi keamanan informasi: penilaian risiko, respons insiden, pemulihan bencana, kebocoran pengetahuan, kebijakan."
  hi: "सूचना सुरक्षा कंसल्टिंग: जोखिम आकलन, घटना प्रतिक्रिया, आपदा रिकवरी, ज्ञान रिसाव, नीति।"
outcomes:
  - en: "Assess an organisation's security risks"
    zh: "评估一个机构的安全风险"
    zh-TW: "評估一個組織的安全風險"
    ja: "組織のセキュリティリスクを評価する"
    ko: "조직의 보안 위험 평가하기"
    vi: "Đánh giá rủi ro an ninh của một tổ chức"
    ms: "Menilai risiko keselamatan sesebuah organisasi"
    id: "Menilai risiko keamanan sebuah organisasi"
    hi: "किसी संगठन के सुरक्षा जोखिम आँकना"
  - en: "Write a security consulting proposal for a client"
    zh: "为客户撰写安全咨询方案"
    zh-TW: "為客戶撰寫資安顧問提案"
    ja: "顧客向けのセキュリティ提案書を書く"
    ko: "고객을 위한 보안 컨설팅 제안서 작성하기"
    vi: "Viết đề xuất tư vấn bảo mật cho khách hàng"
    ms: "Menulis cadangan perundingan keselamatan untuk pelanggan"
    id: "Menulis proposal konsultasi keamanan untuk klien"
    hi: "क्लाइंट के लिए सुरक्षा कंसल्टिंग प्रस्ताव लिखना"
