code: ABPL30071
year: 2026
learn:
  en: "Project management basics for design work: stakeholders, changing briefs, leadership styles and industry case studies."
  zh: "面向设计工作的项目管理基础：利益相关方、需求变化、领导方式与行业案例。"
  zh-TW: "針對設計工作的專案管理基礎：利害關係人、需求變更、領導風格與產業案例。"
  ja: "デザイン業務のためのプロジェクト管理の基本：関係者、要件の変化、リーダーシップ、業界事例。"
  ko: "디자인 업무를 위한 프로젝트 관리 기초: 이해관계자, 요구 변화, 리더십, 업계 사례."
  vi: "Cơ bản quản lý dự án cho thiết kế: các bên liên quan, yêu cầu thay đổi, lãnh đạo, ví dụ ngành."
  ms: "Asas pengurusan projek untuk reka bentuk: pihak berkepentingan, perubahan, kepimpinan, kes industri."
  id: "Dasar manajemen proyek untuk desain: pemangku kepentingan, perubahan, kepemimpinan, kasus industri."
  hi: "डिज़ाइन काम के लिए प्रोजेक्ट मैनेजमेंट की बुनियाद: हितधारक, बदलती ज़रूरतें, नेतृत्व, केस स्टडी।"
outcomes:
  - en: "Plan and run a design project"
    zh: "规划并推进设计项目"
    zh-TW: "規劃並推動設計專案"
    ja: "設計プロジェクトを計画し運営する"
    ko: "디자인 프로젝트 계획·운영하기"
    vi: "Lập kế hoạch và điều hành dự án thiết kế"
    ms: "Rancang dan urus projek reka bentuk"
    id: "Merencanakan dan menjalankan proyek desain"
    hi: "डिज़ाइन प्रोजेक्ट की योजना बनाना और चलाना"
  - en: "Manage stakeholders and changing requirements"
    zh: "管理利益相关方与需求变化"
    zh-TW: "管理利害關係人與需求變更"
    ja: "関係者と要件の変化に対応する"
    ko: "이해관계자와 요구 변화 관리하기"
    vi: "Quản lý các bên liên quan và yêu cầu thay đổi"
    ms: "Urus pihak berkepentingan dan perubahan keperluan"
    id: "Mengelola pemangku kepentingan dan perubahan"
    hi: "हितधारकों और बदलती ज़रूरतों को संभालना"
  - en: "Choose a leadership style that fits the team"
    zh: "选择适合团队的领导方式"
    zh-TW: "選擇適合團隊的領導風格"
    ja: "チームに合うリーダーシップを選ぶ"
    ko: "팀에 맞는 리더십 방식 고르기"
    vi: "Chọn cách lãnh đạo hợp với nhóm"
    ms: "Pilih gaya kepimpinan yang sesuai pasukan"
    id: "Memilih gaya kepemimpinan yang cocok"
    hi: "टीम के अनुकूल नेतृत्व शैली चुनना"
