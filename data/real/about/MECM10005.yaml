code: MECM10005
year: 2026
learn:
  en: "Starting uni well: a one-week intensive on study skills, then a semester of academic writing and communication practice."
  zh: "顺利开启大学生活：一周的学习技能密集课，之后一个学期练习学术写作与沟通。"
  zh-TW: "順利開啟大學生活：一週的學習技能密集課，之後一個學期練習學術寫作與溝通。"
  ja: "大学生活の良いスタート。1週間の学習スキル集中講座のあと、学期を通して学術的な書き方と伝え方を練習する。"
  ko: "대학 생활의 좋은 시작. 일주일간 학습 기술 집중 과정 후 한 학기 동안 학술 글쓰기와 소통을 연습한다."
  vi: "Khởi đầu đại học suôn sẻ: một tuần học kỹ năng học tập, rồi cả học kỳ luyện viết học thuật và giao tiếp."
  ms: "Memulakan universiti dengan baik: seminggu intensif kemahiran belajar, kemudian satu semester latihan penulisan akademik."
  id: "Memulai kuliah dengan baik: seminggu intensif keterampilan belajar, lalu satu semester latihan menulis akademik dan komunikasi."
  hi: "विश्वविद्यालय की अच्छी शुरुआत: एक हफ़्ते का अध्ययन-कौशल इंटेंसिव, फिर पूरे सेमेस्टर अकादमिक लेखन और संवाद का अभ्यास।"
outcomes:
  - en: "Write clear, well-structured academic essays"
    zh: "写出清晰、结构合理的学术论文"
    zh-TW: "寫出清晰、結構合理的學術論文"
    ja: "分かりやすく構成の整ったレポートを書く"
    ko: "명확하고 짜임새 있는 학술 에세이 쓰기"
    vi: "Viết bài luận học thuật rõ ràng, có cấu trúc"
    ms: "Tulis esei akademik yang jelas dan tersusun"
    id: "Menulis esai akademik yang jelas dan terstruktur"
    hi: "साफ़ और सुगठित अकादमिक निबंध लिखना"
  - en: "Understand what university study expects of you"
    zh: "了解大学学习的要求"
    zh-TW: "了解大學學習的要求"
    ja: "大学での学びに求められることを理解する"
    ko: "대학 공부에서 요구되는 것 이해하기"
    vi: "Hiểu yêu cầu của việc học đại học"
    ms: "Fahami apa yang dijangka dalam pengajian universiti"
    id: "Memahami tuntutan belajar di universitas"
    hi: "विश्वविद्यालय की पढ़ाई की अपेक्षाएँ समझना"
  - en: "Present ideas confidently to a group"
    zh: "自信地向小组展示观点"
    zh-TW: "自信地向小組展示觀點"
    ja: "グループの前で自信を持って発表する"
    ko: "그룹 앞에서 자신 있게 발표하기"
    vi: "Tự tin trình bày ý tưởng trước nhóm"
    ms: "Bentangkan idea dengan yakin kepada kumpulan"
    id: "Menyampaikan gagasan dengan percaya diri di depan kelompok"
    hi: "समूह के सामने आत्मविश्वास से विचार रखना"
