code: CHIN30029
year: 2026
learn:
  en: "The Chinese Studies capstone: how traditional culture lives on in modern Chinese life."
  zh: "中国研究专业的毕业课：传统文化如何延续到现代中国生活中。"
  zh-TW: "中國研究專業的畢業課：傳統文化如何延續到現代中國生活中。"
  ja: "中国研究専攻の総仕上げ科目。伝統文化が現代中国の暮らしにどう生きているか。"
  ko: "중국학 전공 캡스톤. 전통문화가 현대 중국 생활에 어떻게 이어지는지."
  vi: "Môn tổng kết ngành Trung Quốc học: văn hóa truyền thống tồn tại thế nào trong đời sống Trung Quốc hiện đại."
  ms: "Subjek puncak Pengajian Cina: bagaimana budaya tradisional hidup dalam kehidupan China moden."
  id: "Mata kuliah puncak Studi Tiongkok: bagaimana budaya tradisional bertahan dalam kehidupan Tiongkok modern."
  hi: "चीनी अध्ययन का कैपस्टोन: पारंपरिक संस्कृति आधुनिक चीनी जीवन में कैसे जीवित है।"
outcomes:
  - en: "Trace traditional ideas in modern China"
    zh: "追溯传统观念在现代中国的体现"
    zh-TW: "追溯傳統觀念在現代中國的體現"
    ja: "現代中国に残る伝統的な考えをたどる"
    ko: "현대 중국 속 전통 사상 추적하기"
    vi: "Lần theo các tư tưởng truyền thống trong Trung Quốc hiện đại"
    ms: "Jejaki idea tradisional dalam China moden"
    id: "Menelusuri gagasan tradisional di Tiongkok modern"
    hi: "आधुनिक चीन में पारंपरिक विचारों को खोजना"
  - en: "Use Chinese and English sources together"
    zh: "结合使用中英文资料"
    zh-TW: "結合使用中英文資料"
    ja: "中国語と英語の資料を併せて使う"
    ko: "중국어와 영어 자료 함께 활용하기"
    vi: "Kết hợp nguồn tiếng Trung và tiếng Anh"
    ms: "Guna sumber bahasa Cina dan Inggeris bersama"
    id: "Memakai sumber bahasa Mandarin dan Inggris bersama"
    hi: "चीनी और अंग्रेज़ी स्रोत साथ इस्तेमाल करना"
  - en: "Present and write up an independent project"
    zh: "展示并撰写独立研究项目"
    zh-TW: "展示並撰寫獨立研究項目"
    ja: "独自の課題を発表し文章にまとめる"
    ko: "독립 프로젝트 발표하고 글로 정리하기"
    vi: "Trình bày và viết một dự án độc lập"
    ms: "Bentang dan tulis projek bebas"
    id: "Mempresentasikan dan menulis proyek mandiri"
    hi: "एक स्वतंत्र प्रोजेक्ट प्रस्तुत करना और लिखना"
