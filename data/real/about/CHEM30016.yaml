code: CHEM30016
year: 2026
learn:
  en: "Why and how chemical reactions happen, covering organic and metal reactions, catalysis and short-lived intermediates."
  zh: "化学反应为什么发生、怎样发生：有机和金属反应以及催化。"
  zh-TW: "化學反應為什麼發生、如何發生：有機和金屬反應以及催化。"
  ja: "化学反応が起こる理由と仕組み。有機・金属の反応、触媒、短寿命の中間体。"
  ko: "화학 반응이 왜, 어떻게 일어나는지. 유기·금속 반응, 촉매, 단수명 중간체."
  vi: "Vì sao và thế nào phản ứng hóa học xảy ra: phản ứng hữu cơ, kim loại, xúc tác và chất trung gian ngắn."
  ms: "Mengapa dan bagaimana tindak balas berlaku: tindak balas organik dan logam, pemangkinan dan perantaraan singkat."
  id: "Mengapa dan bagaimana reaksi terjadi: reaksi organik dan logam, katalisis, dan intermediat berumur pendek."
  hi: "रासायनिक रिएक्शन क्यों और कैसे होते हैं: ऑर्गेनिक व धातु रिएक्शन, कैटेलिसिस और अल्पजीवी इंटरमीडिएट।"
outcomes:
  - en: "Explain chemical reactivity in different systems"
    zh: "解释不同体系的化学反应性"
    zh-TW: "解釋不同體系的化學反應性"
    ja: "さまざまな系での化学反応性を説明する"
    ko: "여러 계에서의 화학 반응성 설명하기"
    vi: "Giải thích khả năng phản ứng ở các hệ khác nhau"
    ms: "Terangkan kereaktifan kimia dalam sistem berbeza"
    id: "Menjelaskan reaktivitas kimia di berbagai sistem"
    hi: "अलग-अलग सिस्टम में रासायनिक क्रियाशीलता समझाना"
  - en: "Explain catalysis by transition metal complexes"
    zh: "解释过渡金属配合物的催化"
    zh-TW: "解釋過渡金屬錯合物的催化"
    ja: "遷移金属錯体による触媒作用を説明する"
    ko: "전이 금속 착물의 촉매 작용 설명하기"
    vi: "Giải thích xúc tác bằng phức kim loại chuyển tiếp"
    ms: "Terangkan pemangkinan oleh kompleks logam peralihan"
    id: "Menjelaskan katalisis oleh kompleks logam transisi"
    hi: "ट्रांज़िशन धातु कॉम्प्लेक्स से कैटेलिसिस समझाना"
  - en: "Describe key spectroscopy methods used in research"
    zh: "说明研究常用的光谱方法"
    zh-TW: "說明研究常用的光譜方法"
    ja: "研究で使う主な分光法を説明する"
    ko: "연구에 쓰이는 주요 분광법 설명하기"
    vi: "Mô tả các phương pháp quang phổ chính trong nghiên cứu"
    ms: "Huraikan kaedah spektroskopi utama dalam kajian"
    id: "Menjelaskan metode spektroskopi utama dalam riset"
    hi: "रिसर्च में इस्तेमाल मुख्य स्पेक्ट्रोस्कोपी तरीके बताना"
