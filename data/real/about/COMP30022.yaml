code: COMP30022
year: 2026
learn:
  en: "A team project where you build a working IT system for a real client problem."
  zh: "团队项目：为真实客户的需求做一个能用的IT系统。"
  zh-TW: "團隊專題：為真實客戶的需求做一個能用的IT系統。"
  ja: "実際のクライアントの課題に向けて、動くITシステムを作るチームプロジェクト。"
  ko: "실제 고객의 문제를 위해 작동하는 IT 시스템을 만드는 팀 프로젝트."
  vi: "Dự án nhóm xây dựng hệ thống IT chạy được cho vấn đề của khách hàng thật."
  ms: "Projek berkumpulan membina sistem IT yang berfungsi untuk masalah klien sebenar."
  id: "Proyek tim membangun sistem IT yang berfungsi untuk masalah klien nyata."
  hi: "टीम प्रोजेक्ट जिसमें असली क्लाइंट की समस्या के लिए काम करता IT सिस्टम बनाते हैं।"
outcomes:
  - en: "Analyse, design, build and test an IT system"
    zh: "分析、设计、开发和测试系统"
    zh-TW: "分析、設計、開發和測試IT系統"
    ja: "ITシステムを分析・設計・構築・テストする"
    ko: "IT 시스템 분석·설계·구축·테스트"
    vi: "Phân tích, thiết kế, xây dựng và kiểm thử hệ thống IT"
    ms: "Analisis, reka, bina dan uji sistem IT"
    id: "Menganalisis, merancang, membangun, dan menguji sistem IT"
    hi: "IT सिस्टम का विश्लेषण, डिज़ाइन, निर्माण और टेस्ट"
  - en: "Work with clients and teammates on a project"
    zh: "和客户、组员沟通推进项目"
    zh-TW: "和客戶、組員溝通推進專案"
    ja: "クライアントやチームと協力してプロジェクトを進める"
    ko: "고객·팀원과 함께 프로젝트 진행"
    vi: "Làm việc với khách hàng và đồng đội trong dự án"
    ms: "Bekerja dengan klien dan rakan sepasukan"
    id: "Bekerja sama dengan klien dan tim dalam proyek"
    hi: "प्रोजेक्ट पर क्लाइंट और टीम के साथ काम करना"
  - en: "Plan and manage a software project"
    zh: "规划和管理一个软件项目"
    zh-TW: "規劃和管理一個軟體專案"
    ja: "ソフトウェアプロジェクトを計画・管理する"
    ko: "소프트웨어 프로젝트 계획 및 관리"
    vi: "Lập kế hoạch và quản lý dự án phần mềm"
    ms: "Rancang dan urus projek perisian"
    id: "Merencanakan dan mengelola proyek software"
    hi: "सॉफ़्टवेयर प्रोजेक्ट प्लान और मैनेज करना"
