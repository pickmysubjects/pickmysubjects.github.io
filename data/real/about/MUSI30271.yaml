code: MUSI30271
year: 2026
learn:
  en: "One big research topic in popular music studies, such as the music industry or hip-hop, through case studies."
  zh: "流行音乐研究的一个重大专题，如音乐产业或嘻哈，以案例研究。"
  zh-TW: "流行音樂研究的一個重大專題，如音樂產業或嘻哈，以案例研究。"
  ja: "音楽産業やヒップホップなど、ポピュラー音楽研究の大きなテーマを事例で学ぶ。"
  ko: "음악 산업·힙합 등 대중음악 연구의 큰 주제 하나를 사례로 공부."
  vi: "Một chủ đề lớn về nhạc đại chúng, như ngành âm nhạc hay hip-hop, qua ca nghiên cứu."
  ms: "Satu topik besar kajian muzik popular, seperti industri muzik atau hip-hop."
  id: "Satu topik besar studi musik populer, seperti industri musik atau hip-hop."
  hi: "लोकप्रिय संगीत अध्ययन का एक बड़ा विषय, जैसे म्यूज़िक इंडस्ट्री या हिप-हॉप, केस स्टडी से।"
outcomes:
  - en: "Compare research across cultures and eras"
    zh: "比较不同文化和时代的研究"
    zh-TW: "比較不同文化與時代的研究"
    ja: "文化や時代をまたいで研究を比べる"
    ko: "문화와 시대를 넘어 연구 비교하기"
    vi: "So sánh nghiên cứu qua các nền văn hóa"
    ms: "Banding kajian merentas budaya dan zaman"
    id: "Membandingkan riset lintas budaya"
    hi: "संस्कृतियों और दौर में शोध की तुलना"
  - en: "Find and judge the research literature"
    zh: "查找并评估研究文献"
    zh-TW: "查找並評估研究文獻"
    ja: "研究文献を探して評価する"
    ko: "연구 문헌 찾고 평가하기"
    vi: "Tìm và đánh giá tài liệu nghiên cứu"
    ms: "Cari dan nilai literatur kajian"
    id: "Mencari dan menilai literatur riset"
    hi: "शोध साहित्य खोजना और परखना"
  - en: "Carry out a small research project"
    zh: "完成一个小型研究项目"
    zh-TW: "完成一個小型研究專案"
    ja: "小さな研究プロジェクトを行う"
    ko: "작은 연구 프로젝트 수행하기"
    vi: "Thực hiện một dự án nghiên cứu nhỏ"
    ms: "Jalankan projek kajian kecil"
    id: "Melakukan proyek riset kecil"
    hi: "एक छोटा शोध प्रोजेक्ट करना"
