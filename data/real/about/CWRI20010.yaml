code: CWRI20010
year: 2026
learn:
  en: "How to write scripts for theatre, studying plays in many styles and workshopping your own original script."
  zh: "学习戏剧剧本写作，研读多种风格的剧作，并在工作坊中打磨自己的原创剧本。"
  zh-TW: "學習戲劇劇本寫作，研讀多種風格的劇作，並在工作坊中打磨自己的原創劇本。"
  ja: "演劇の脚本の書き方を学び、様々な戯曲を読み、自分のオリジナル脚本をワークショップで磨く。"
  ko: "연극 대본 쓰는 법을 배우고, 여러 양식의 희곡을 읽으며 자신의 창작 대본을 워크숍으로 다듬는다."
  vi: "Cách viết kịch bản sân khấu, nghiên cứu các vở kịch nhiều phong cách và workshop kịch bản nguyên tác của riêng bạn."
  ms: "Cara menulis skrip teater, mengkaji drama pelbagai gaya dan membengkelkan skrip asli anda sendiri."
  id: "Cara menulis naskah teater, mempelajari lakon berbagai gaya dan melokakaryakan naskah orisinal sendiri."
  hi: "रंगमंच के लिए स्क्रिप्ट लिखना, कई शैलियों के नाटक पढ़ना और अपनी मौलिक स्क्रिप्ट पर वर्कशॉप करना।"
outcomes:
  - en: "Use core techniques of writing for the stage"
    zh: "运用舞台剧写作的核心技巧"
    zh-TW: "運用舞台劇寫作的核心技巧"
    ja: "舞台向けの脚本の基本技法を使う"
    ko: "무대 대본 쓰기의 핵심 기법 활용하기"
    vi: "Sử dụng các kỹ thuật cốt lõi của viết cho sân khấu"
    ms: "Guna teknik teras penulisan untuk pentas"
    id: "Memakai teknik inti menulis untuk panggung"
    hi: "मंच के लिए लेखन की मूल तकनीकें इस्तेमाल करना"
  - en: "Review a live theatre production"
    zh: "评论一部现场戏剧演出"
    zh-TW: "評論一部現場戲劇演出"
    ja: "実際の舞台を批評する"
    ko: "실제 연극 공연 리뷰하기"
    vi: "Viết nhận xét về một vở diễn trực tiếp"
    ms: "Ulas persembahan teater secara langsung"
    id: "Mengulas pertunjukan teater langsung"
    hi: "किसी लाइव नाटक की समीक्षा करना"
  - en: "Write and workshop an original play script"
    zh: "写作并在工作坊打磨原创剧本"
    zh-TW: "寫作並在工作坊打磨原創劇本"
    ja: "オリジナル脚本を書きワークショップで磨く"
    ko: "창작 희곡을 쓰고 워크숍으로 다듬기"
    vi: "Viết và workshop một kịch bản nguyên tác"
    ms: "Tulis dan bengkelkan skrip drama asli"
    id: "Menulis dan melokakaryakan naskah lakon orisinal"
    hi: "मौलिक नाटक स्क्रिप्ट लिखना और उस पर वर्कशॉप करना"
