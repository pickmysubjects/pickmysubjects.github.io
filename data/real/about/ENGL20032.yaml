code: ENGL20032
year: 2026
learn:
  en: "A step-by-step way to read poems closely and write your own interpretations, using love and death poems."
  zh: "以爱与死亡主题的诗为例，循序渐进地学习细读诗歌并写出自己的解读。"
  zh-TW: "以愛與死亡主題的詩為例，循序漸進地學習細讀詩歌並寫出自己的解讀。"
  ja: "愛と死の詩を題材に、詩を丁寧に読み自分の解釈を書く方法を段階的に学ぶ。"
  ko: "사랑과 죽음의 시를 통해 시를 꼼꼼히 읽고 자기 해석을 쓰는 법을 단계별로 배운다."
  vi: "Cách đọc kỹ thơ và viết lời diễn giải của riêng mình theo từng bước, qua các bài thơ về tình yêu và cái chết."
  ms: "Cara langkah demi langkah membaca puisi dengan teliti dan menulis tafsiran sendiri, melalui puisi cinta dan kematian."
  id: "Cara bertahap membaca puisi dengan cermat dan menulis tafsiran sendiri, lewat puisi tentang cinta dan kematian."
  hi: "प्रेम और मृत्यु की कविताओं के सहारे कविता को बारीकी से पढ़ने और अपनी व्याख्या लिखने का चरणबद्ध तरीका।"
outcomes:
  - en: "Use the tools of poetic analysis"
    zh: "运用诗歌分析的方法"
    zh-TW: "運用詩歌分析的方法"
    ja: "詩の分析の道具を使う"
    ko: "시 분석 도구 활용하기"
    vi: "Dùng các công cụ phân tích thơ"
    ms: "Guna alat analisis puisi"
    id: "Memakai alat analisis puisi"
    hi: "काव्य विश्लेषण के औज़ार इस्तेमाल करना"
  - en: "Build an interpretation from close reading"
    zh: "从细读中形成解读"
    zh-TW: "從細讀中形成解讀"
    ja: "精読から解釈を組み立てる"
    ko: "꼼꼼한 읽기에서 해석 세우기"
    vi: "Xây dựng diễn giải từ việc đọc kỹ"
    ms: "Bina tafsiran daripada bacaan rapi"
    id: "Membangun tafsiran dari pembacaan cermat"
    hi: "बारीक पढ़त से व्याख्या बनाना"
  - en: "Write clear essays about poems"
    zh: "就诗歌写出清晰的论文"
    zh-TW: "就詩歌寫出清晰的論文"
    ja: "詩について明快なエッセイを書く"
    ko: "시에 관한 명확한 에세이 쓰기"
    vi: "Viết bài luận rõ ràng về thơ"
    ms: "Tulis esei yang jelas tentang puisi"
    id: "Menulis esai yang jelas tentang puisi"
    hi: "कविताओं पर साफ़ निबंध लिखना"
