code: LAWS10011
year: 2027
learn:
  en: "How law shapes health, illness and disability, from reproduction and end-of-life choices to AI and climate risks."
  zh: "法律如何影响健康、疾病和残障：从生育、临终决定到AI和气候风险。"
  zh-TW: "法律如何影響健康、疾病和身心障礙：從生育、臨終決定到AI和氣候風險。"
  ja: "法が健康・病気・障害にどう関わるか：生殖や終末期の選択からAI、気候リスクまで。"
  ko: "법이 건강·질병·장애에 어떤 영향을 주는지: 출산과 임종 결정부터 AI, 기후 위험까지."
  vi: "Pháp luật định hình sức khỏe, bệnh tật và khuyết tật ra sao, từ sinh sản, quyết định cuối đời đến AI và rủi ro khí hậu."
  ms: "Cara undang-undang membentuk kesihatan, penyakit dan kecacatan, daripada pilihan reproduktif dan akhir hayat hingga AI dan risiko iklim."
  id: "Cara hukum membentuk kesehatan, penyakit, dan disabilitas, dari pilihan reproduksi dan akhir hayat hingga AI dan risiko iklim."
  hi: "कानून स्वास्थ्य, बीमारी और विकलांगता को कैसे आकार देता है: प्रजनन और जीवन के अंत के फैसलों से AI और जलवायु जोखिमों तक।"
outcomes:
  - en: "Apply legal and policy frameworks to health cases"
    zh: "把法律和政策框架用到实际健康案例"
    zh-TW: "把法律和政策框架用到實際健康案例"
    ja: "法や政策の枠組みを健康の事例に当てはめる"
    ko: "법·정책 틀을 건강 사례에 적용하기"
    vi: "Áp dụng khung pháp lý và chính sách vào tình huống sức khỏe"
    ms: "Gunakan rangka undang-undang dan dasar pada kes kesihatan"
    id: "Menerapkan kerangka hukum dan kebijakan pada kasus kesehatan"
    hi: "स्वास्थ्य मामलों पर कानूनी व नीतिगत ढाँचे लागू करना"
  - en: "Analyse health laws through ethics and human rights"
    zh: "从伦理和人权角度分析健康法律"
    zh-TW: "從倫理和人權角度分析健康法律"
    ja: "倫理と人権の視点から健康に関する法を分析する"
    ko: "윤리와 인권 관점에서 보건 법 분석하기"
    vi: "Phân tích luật sức khỏe qua lăng kính đạo đức và nhân quyền"
    ms: "Analisis undang-undang kesihatan dari sudut etika dan hak asasi"
    id: "Menganalisis hukum kesehatan dari sudut etika dan HAM"
    hi: "नैतिकता और मानवाधिकार के नज़रिए से स्वास्थ्य कानूनों का विश्लेषण"
  - en: "Propose legal and policy responses to health issues"
    zh: "为健康问题提出法律和政策对策"
    zh-TW: "為健康問題提出法律和政策對策"
    ja: "健康問題への法・政策上の対応を考える"
    ko: "건강 문제에 대한 법·정책 대응 제시하기"
    vi: "Đề xuất giải pháp pháp lý và chính sách cho vấn đề sức khỏe"
    ms: "Cadangkan respons undang-undang dan dasar untuk isu kesihatan"
    id: "Mengusulkan respons hukum dan kebijakan untuk isu kesehatan"
    hi: "स्वास्थ्य मुद्दों के लिए कानूनी व नीतिगत जवाब सुझाना"
