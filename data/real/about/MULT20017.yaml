code: MULT20017
year: 2027
learn:
  en: "Meditation and mindfulness from history, philosophy, science and psychology, with hands-on practice and a look at the evidence."
  zh: "从历史、哲学、科学和心理学看冥想与正念，结合亲身练习和证据分析。"
  zh-TW: "從歷史、哲學、科學和心理學看冥想與正念，結合親身練習和證據分析。"
  ja: "歴史・哲学・科学・心理学から瞑想とマインドフルネスを学び、実践とエビデンスの検討も行う。"
  ko: "역사·철학·과학·심리학으로 명상과 마음챙김을 살펴보고, 직접 실습하며 근거도 따져봄."
  vi: "Thiền và chánh niệm qua lịch sử, triết học, khoa học và tâm lý học, kèm thực hành trực tiếp và xem xét bằng chứng."
  ms: "Meditasi dan kesedaran penuh dari sudut sejarah, falsafah, sains dan psikologi, dengan latihan sendiri dan penilaian bukti."
  id: "Meditasi dan mindfulness dari sudut sejarah, filsafat, sains, dan psikologi, dengan praktik langsung dan telaah bukti."
  hi: "इतिहास, दर्शन, विज्ञान और मनोविज्ञान से ध्यान और माइंडफुलनेस, खुद अभ्यास और सबूतों की पड़ताल के साथ।"
outcomes:
  - en: "Interpret research on meditation and mindfulness"
    zh: "解读关于冥想和正念的实证研究"
    zh-TW: "解讀關於冥想和正念的實證研究"
    ja: "瞑想やマインドフルネスの研究を読み解く"
    ko: "명상과 마음챙김 연구 해석하기"
    vi: "Đọc hiểu nghiên cứu về thiền và chánh niệm"
    ms: "Tafsir kajian tentang meditasi dan kesedaran penuh"
    id: "Menafsirkan riset tentang meditasi dan mindfulness"
    hi: "ध्यान और माइंडफुलनेस पर शोध को समझना"
  - en: "Judge what meditation can and can't do for people and society"
    zh: "判断冥想对个人和社会能做什么、不能做什么"
    zh-TW: "判斷冥想對個人和社會能做什麼、不能做什麼"
    ja: "瞑想が個人や社会にできること・できないことを見極める"
    ko: "명상이 개인과 사회에 할 수 있는 것과 없는 것 판단하기"
    vi: "Đánh giá thiền giúp được gì và không giúp được gì cho cá nhân, xã hội"
    ms: "Nilai apa yang meditasi boleh dan tidak boleh buat untuk individu dan masyarakat"
    id: "Menilai apa yang bisa dan tidak bisa diberikan meditasi bagi individu dan masyarakat"
    hi: "आँकना कि ध्यान व्यक्ति और समाज के लिए क्या कर सकता है, क्या नहीं"
  - en: "Reflect on meditation through your own practice"
    zh: "通过亲身练习反思冥想体验"
    zh-TW: "透過親身練習反思冥想體驗"
    ja: "自分の実践を通して瞑想体験を振り返る"
    ko: "직접 실습하며 명상 경험 성찰하기"
    vi: "Suy ngẫm về thiền qua chính trải nghiệm thực hành"
    ms: "Renungkan meditasi melalui amalan sendiri"
    id: "Merefleksikan meditasi lewat praktik sendiri"
    hi: "अपने अभ्यास से ध्यान के अनुभव पर विचार करना"
