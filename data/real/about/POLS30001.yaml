code: POLS30001
year: 2026
learn:
  en: "A placement with a member of the Victorian Parliament, doing a research project on an issue they care about."
  zh: "到维多利亚州议会议员身边实习，就议员关心的议题完成一个研究项目。"
  zh-TW: "到維多利亞州議會議員身邊實習，就議員關心的議題完成一個研究專案。"
  ja: "ビクトリア州議会の議員のもとで実習し、議員が関心を持つ課題について調査プロジェクトを行う。"
  ko: "빅토리아주 의회 의원 곁에서 실습하며 그 의원이 관심 있는 문제로 연구 프로젝트를 한다."
  vi: "Thực tập cùng một nghị sĩ Quốc hội bang Victoria, làm dự án nghiên cứu về vấn đề họ quan tâm."
  ms: "Penempatan bersama ahli Parlimen Victoria, menjalankan projek penyelidikan tentang isu yang mereka pedulikan."
  id: "Magang bersama anggota Parlemen Victoria, mengerjakan proyek riset tentang isu yang mereka pedulikan."
  hi: "विक्टोरिया संसद के किसी सदस्य के साथ प्लेसमेंट, उनकी रुचि के मुद्दे पर एक शोध प्रोजेक्ट करना।"
outcomes:
  - en: "Research a policy question for a member of parliament"
    zh: "为议员研究一个政策问题"
    zh-TW: "為議員研究一個政策問題"
    ja: "議員のために政策課題を調べる"
    ko: "의원을 위해 정책 문제 조사하기"
    vi: "Nghiên cứu một vấn đề chính sách cho nghị sĩ"
    ms: "Kaji persoalan dasar untuk ahli parlimen"
    id: "Meneliti persoalan kebijakan untuk anggota parlemen"
    hi: "किसी सांसद के लिए नीति से जुड़े सवाल पर शोध करना"
  - en: "Explain how parliament and members do their work"
    zh: "说明议会和议员如何开展工作"
    zh-TW: "說明議會和議員如何進行工作"
    ja: "議会と議員の仕事の進め方を説明する"
    ko: "의회와 의원이 일하는 방식 설명하기"
    vi: "Giải thích quốc hội và nghị sĩ làm việc ra sao"
    ms: "Terangkan cara parlimen dan ahlinya bekerja"
    id: "Menjelaskan cara kerja parlemen dan anggotanya"
    hi: "समझाना कि संसद और सांसद कैसे काम करते हैं"
  - en: "Work professionally in a political office"
    zh: "在政治机构中专业地工作"
    zh-TW: "在政治機構中專業地工作"
    ja: "政治の現場でプロとして働く"
    ko: "정치 현장에서 전문적으로 일하기"
    vi: "Làm việc chuyên nghiệp trong văn phòng chính trị"
    ms: "Bekerja secara profesional di pejabat politik"
    id: "Bekerja secara profesional di kantor politik"
    hi: "राजनीतिक दफ़्तर में पेशेवर ढंग से काम करना"
