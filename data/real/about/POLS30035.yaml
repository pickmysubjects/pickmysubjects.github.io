code: POLS30035
year: 2026
learn:
  en: "How public policy gets made: the main theories of the policy process, design thinking, governance systems and using data in policy."
  zh: "公共政策如何制定：政策过程的主要理论、设计思维、治理体系，以及在政策中使用数据。"
  zh-TW: "公共政策如何制定：政策過程的主要理論、設計思維、治理體系，以及在政策中使用資料。"
  ja: "公共政策はどう作られるか。政策過程の主な理論、デザイン思考、ガバナンスの仕組み、政策でのデータ活用。"
  ko: "공공정책은 어떻게 만들어지나. 정책 과정의 주요 이론, 디자인 씽킹, 거버넌스 체계, 정책에서의 데이터 활용."
  vi: "Chính sách công được làm ra sao: các lý thuyết chính về quy trình chính sách, tư duy thiết kế, hệ thống quản trị và dùng dữ liệu."
  ms: "Cara dasar awam dibuat: teori utama proses dasar, pemikiran reka bentuk, sistem tadbir urus dan penggunaan data dalam dasar."
  id: "Cara kebijakan publik dibuat: teori utama proses kebijakan, design thinking, sistem tata kelola dan pemakaian data dalam kebijakan."
  hi: "सार्वजनिक नीति कैसे बनती है: नीति-प्रक्रिया के मुख्य सिद्धांत, डिज़ाइन थिंकिंग, शासन व्यवस्थाएँ और नीति में डेटा का उपयोग।"
outcomes:
  - en: "Compare theories of the policy process"
    zh: "比较政策过程的不同理论"
    zh-TW: "比較政策過程的不同理論"
    ja: "政策過程の諸理論を比べる"
    ko: "정책 과정 이론 비교하기"
    vi: "So sánh các lý thuyết về quy trình chính sách"
    ms: "Bandingkan teori proses dasar"
    id: "Membandingkan teori proses kebijakan"
    hi: "नीति-प्रक्रिया के सिद्धांतों की तुलना करना"
  - en: "Apply design thinking to a policy problem"
    zh: "把设计思维用于政策问题"
    zh-TW: "把設計思維用於政策問題"
    ja: "政策課題にデザイン思考を使う"
    ko: "정책 문제에 디자인 씽킹 적용하기"
    vi: "Áp dụng tư duy thiết kế vào vấn đề chính sách"
    ms: "Gunakan pemikiran reka bentuk pada masalah dasar"
    id: "Menerapkan design thinking pada masalah kebijakan"
    hi: "किसी नीति समस्या पर डिज़ाइन थिंकिंग लगाना"
  - en: "Link policy theory to real practice"
    zh: "把政策理论与实际做法联系起来"
    zh-TW: "把政策理論與實際做法聯繫起來"
    ja: "政策理論を実務と結びつける"
    ko: "정책 이론을 실제와 연결하기"
    vi: "Liên hệ lý thuyết chính sách với thực tiễn"
    ms: "Kaitkan teori dasar dengan amalan sebenar"
    id: "Mengaitkan teori kebijakan dengan praktik nyata"
    hi: "नीति सिद्धांत को असल व्यवहार से जोड़ना"
