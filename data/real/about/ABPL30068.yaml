code: ABPL30068
year: 2026
learn:
  en: "A work placement of at least 10 days with a design-related organisation, plus seminars on careers and employability."
  zh: "在设计相关机构完成至少10天的实习，并参加职业与就业能力研讨。"
  zh-TW: "在設計相關機構完成至少10天的實習，並參加職涯與就業力研討。"
  ja: "設計関連の組織で10日以上の実習を行い、キャリアと就業力のセミナーも受ける。"
  ko: "디자인 관련 기관에서 10일 이상 실습하고 진로·취업 역량 세미나에 참여한다."
  vi: "Thực tập ít nhất 10 ngày tại tổ chức liên quan thiết kế, kèm hội thảo nghề nghiệp."
  ms: "Penempatan kerja sekurang-kurangnya 10 hari di organisasi reka bentuk, serta seminar kerjaya."
  id: "Magang minimal 10 hari di organisasi terkait desain, ditambah seminar karier."
  hi: "डिज़ाइन से जुड़ी संस्था में कम से कम 10 दिन की इंटर्नशिप, साथ में करियर सेमिनार।"
outcomes:
  - en: "Complete and report on a real workplace project"
    zh: "完成真实工作项目并撰写报告"
    zh-TW: "完成真實工作專案並撰寫報告"
    ja: "実際の職場プロジェクトを行い報告する"
    ko: "실제 직장 프로젝트 수행·보고하기"
    vi: "Hoàn thành và báo cáo một dự án thực tế"
    ms: "Siapkan dan lapor projek tempat kerja sebenar"
    id: "Menyelesaikan dan melaporkan proyek kerja nyata"
    hi: "असली कार्यस्थल प्रोजेक्ट पूरा कर रिपोर्ट करना"
  - en: "Name and show your employability skills"
    zh: "识别并展示自己的就业能力"
    zh-TW: "辨識並展現自己的就業力"
    ja: "自分の就業スキルを言葉にして示す"
    ko: "자신의 취업 역량 파악·제시하기"
    vi: "Nhận ra và thể hiện kỹ năng làm việc"
    ms: "Kenal pasti dan tunjuk kemahiran kebolehpasaran"
    id: "Mengenali dan menunjukkan keterampilan kerja"
    hi: "अपने रोज़गार कौशल पहचानना और दिखाना"
  - en: "Reflect on design careers and workplace culture"
    zh: "反思设计职业与职场文化"
    zh-TW: "反思設計職涯與職場文化"
    ja: "デザインの仕事と職場文化を振り返る"
    ko: "디자인 진로와 직장 문화 성찰하기"
    vi: "Suy ngẫm về nghề thiết kế và văn hóa công sở"
    ms: "Renungkan kerjaya reka bentuk dan budaya kerja"
    id: "Merenungkan karier desain dan budaya kerja"
    hi: "डिज़ाइन करियर व कार्यस्थल संस्कृति पर सोचना"
