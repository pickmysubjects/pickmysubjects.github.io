  vi: "Thực hành công nghệ nghiên cứu chuyển hóa: đo đường huyết, khối phổ, liệu pháp gen/protein."
  ms: "Praktikal teknologi kajian metabolisme: ukuran glisemia, spektrometri jisim, terapi gen/protein."
  id: "Praktik teknologi riset metabolisme: ukur glikemia, spektrometri massa, terapi gen/protein."
  hi: "मेटाबॉलिज़्म शोध की नई तकनीकें व्यवहार में: ग्लाइसीमिया माप, मास स्पेक्ट्रोमेट्री, जीन/प्रोटीन थेरेपी।"
