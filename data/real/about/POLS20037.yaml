code: POLS20037
year: 2027
learn:
  en: "Why violent conflicts start and how they are resolved, studied through current case studies of conflict and peacebuilding."
  zh: "暴力冲突为何爆发、如何化解，通过当代冲突与建设和平的案例来学习。"
  zh-TW: "暴力衝突為何爆發、如何化解，透過當代衝突與建設和平的案例來學習。"
  ja: "暴力的な紛争はなぜ起こり、どう解決されるのか。現代の紛争と平和構築の事例から学ぶ。"
  ko: "폭력적 갈등이 왜 일어나고 어떻게 해결되는지, 현대의 갈등과 평화 구축 사례로 배우기."
  vi: "Vì sao xung đột bạo lực bùng phát và được giải quyết thế nào, học qua các tình huống xung đột và kiến tạo hòa bình hiện nay."
  ms: "Mengapa konflik ganas berlaku dan bagaimana ia diselesaikan, melalui kajian kes konflik dan pembinaan keamanan semasa."
  id: "Mengapa konflik kekerasan terjadi dan bagaimana diselesaikan, lewat studi kasus konflik dan pembangunan perdamaian masa kini."
  hi: "हिंसक संघर्ष क्यों शुरू होते हैं और कैसे सुलझते हैं, आज के संघर्ष और शांति-निर्माण के उदाहरणों से।"
outcomes:
  - en: "Analyse the causes and impacts of violent conflicts"
    zh: "分析暴力冲突的成因与影响"
    zh-TW: "分析暴力衝突的成因與影響"
    ja: "暴力的な紛争の原因と影響を分析する"
    ko: "폭력적 갈등의 원인과 영향 분석하기"
    vi: "Phân tích nguyên nhân và tác động của xung đột bạo lực"
    ms: "Analisis punca dan kesan konflik ganas"
    id: "Menganalisis penyebab dan dampak konflik kekerasan"
    hi: "हिंसक संघर्षों के कारण और असर का विश्लेषण करना"
  - en: "Judge the strengths and limits of ways to make peace"
    zh: "评判各种调解与建设和平方法的优劣"
    zh-TW: "評判各種調解與建設和平方法的優劣"
    ja: "紛争解決と平和構築の手法の長所と限界を評価する"
    ko: "갈등 해결과 평화 구축 방식의 장단점 평가하기"
    vi: "Đánh giá điểm mạnh và hạn chế của các cách kiến tạo hòa bình"
    ms: "Nilai kekuatan dan had cara-cara membina keamanan"
    id: "Menilai kelebihan dan batas cara-cara membangun perdamaian"
    hi: "शांति लाने के तरीकों की ताकत और सीमाएँ परखना"
