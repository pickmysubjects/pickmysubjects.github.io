code: MKTG90007
year: 2027
learn:
  en: "Designing and managing customer experience across the journey, from staff and chatbots to recovering from service failures."
  zh: "在整个客户旅程中设计和管理客户体验，从员工、聊天机器人到服务失误后的补救。"
  zh-TW: "在整個顧客旅程中設計與管理顧客體驗，從員工、聊天機器人到服務失誤後的補救。"
  ja: "顧客体験をカスタマージャーニー全体で設計・管理する：スタッフ、チャットボット、失敗時の挽回。"
  ko: "고객 여정 전반의 경험 설계·관리: 직원, 챗봇, 서비스 실패 후 회복까지."
  vi: "Thiết kế và quản lý trải nghiệm khách hàng suốt hành trình, từ nhân viên, chatbot đến khắc phục sự cố dịch vụ."
  ms: "Mereka dan mengurus pengalaman pelanggan sepanjang perjalanan, dari kakitangan dan chatbot hingga pemulihan kegagalan."
  id: "Merancang dan mengelola pengalaman pelanggan sepanjang perjalanan, dari staf dan chatbot hingga pemulihan layanan."
  hi: "पूरी ग्राहक यात्रा में अनुभव बनाना और संभालना, स्टाफ़ व चैटबॉट से लेकर सेवा चूक के बाद सुधार तक।"
outcomes:
  - en: "Map customer journeys and find pain points"
    zh: "绘制客户旅程并找出痛点"
    zh-TW: "繪製顧客旅程並找出痛點"
    ja: "カスタマージャーニーを描き課題を見つける"
    ko: "고객 여정 지도 그리고 불편 지점 찾기"
    vi: "Vẽ hành trình khách hàng, tìm điểm đau"
    ms: "Memetakan perjalanan pelanggan dan titik masalah"
    id: "Memetakan perjalanan pelanggan dan titik masalah"
    hi: "ग्राहक यात्रा का नक्शा बनाना और दिक्कतें ढूँढना"
  - en: "Measure and manage CX metrics"
    zh: "衡量并管理客户体验指标"
    zh-TW: "衡量並管理顧客體驗指標"
    ja: "顧客体験の指標を測り管理する"
    ko: "고객 경험 지표 측정·관리하기"
    vi: "Đo lường và quản lý chỉ số CX"
    ms: "Mengukur dan mengurus metrik CX"
    id: "Mengukur dan mengelola metrik CX"
    hi: "CX मेट्रिक्स मापना और संभालना"
