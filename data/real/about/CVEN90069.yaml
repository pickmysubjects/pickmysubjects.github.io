code: CVEN90069
year: 2027
learn:
  en: "Dredging techniques, sediment, disposal, environmental effects and contracts, taught with port authority lecturers."
  zh: "疏浚技术、泥沙、弃土处置、环境影响和合同，并有港务部门讲师参与授课。"
  zh-TW: "疏浚技術、泥沙、棄土處置、環境影響與合約，並有港務單位講師參與授課。"
  ja: "浚渫の工法・土砂・処分・環境影響・契約を、港湾管理者の講師とともに学ぶ。"
  ko: "준설 공법, 퇴적물, 투기, 환경 영향, 계약을 항만 당국 강사와 함께 배운다."
  vi: "Kỹ thuật nạo vét, bùn cát, đổ thải, tác động môi trường và hợp đồng, có giảng viên từ cơ quan cảng."
  ms: "Teknik pengorekan, sedimen, pelupusan, kesan alam sekitar dan kontrak, bersama pensyarah dari pihak berkuasa pelabuhan."
  id: "Teknik pengerukan, sedimen, pembuangan, dampak lingkungan dan kontrak, bersama pengajar dari otoritas pelabuhan."
  hi: "ड्रेजिंग तकनीकें, तलछट, निपटान, पर्यावरणीय प्रभाव और अनुबंध, बंदरगाह प्राधिकरण के व्याख्याताओं के साथ।"
outcomes:
  - en: "Explain how dredgers work and how to choose one"
    zh: "解释挖泥船的工作方式和选型"
    zh-TW: "解釋挖泥船的運作方式與選型"
    ja: "浚渫船の仕組みと選び方を説明する"
    ko: "준설선의 작동 원리와 선정 방법 설명하기"
    vi: "Giải thích cách tàu nạo vét hoạt động và cách chọn"
    ms: "Menerangkan cara kapal korek berfungsi dan cara memilihnya"
    id: "Menjelaskan cara kerja kapal keruk dan cara memilihnya"
    hi: "ड्रेजर कैसे काम करते हैं और उन्हें कैसे चुनें, समझाना"
  - en: "Respond to the environmental issues of dredging"
    zh: "应对疏浚带来的环境问题"
    zh-TW: "因應疏浚帶來的環境問題"
    ja: "浚渫に伴う環境問題に対応する"
    ko: "준설에 따른 환경 문제에 대응하기"
    vi: "Xử lý các vấn đề môi trường của nạo vét"
    ms: "Menangani isu alam sekitar akibat pengorekan"
    id: "Menangani isu lingkungan dari pengerukan"
    hi: "ड्रेजिंग से जुड़ी पर्यावरणीय समस्याओं से निपटना"
