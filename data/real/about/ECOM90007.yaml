code: ECOM90007
year: 2027
learn:
  en: "Modern macroeconometrics in R: forecasting and nowcasting, monetary policy effects, trend inflation and CO2 emissions."
  zh: "用 R 做现代宏观计量：预测与即时预测、货币政策效应、趋势通胀、碳排放。"
  zh-TW: "用 R 做現代總體計量：預測與即時預測、貨幣政策效果、趨勢通膨、碳排放。"
  ja: "Rで学ぶマクロ計量：予測・ナウキャスト、金融政策の効果、トレンドインフレ、CO2排出。"
  ko: "R로 하는 거시계량: 예측·나우캐스팅, 통화정책 효과, 추세 인플레이션, CO2 배출."
  vi: "Kinh tế lượng vĩ mô bằng R: dự báo, dự báo tức thời, tác động chính sách tiền tệ, lạm phát xu hướng và CO2."
  ms: "Makroekonometrik dalam R: ramalan dan nowcasting, kesan dasar monetari, inflasi trend dan pelepasan CO2."
  id: "Makroekonometrika dengan R: peramalan dan nowcasting, efek kebijakan moneter, inflasi tren, dan emisi CO2."
  hi: "R में मैक्रोइकोनोमेट्रिक्स: पूर्वानुमान व नाउकास्टिंग, मौद्रिक नीति के प्रभाव, ट्रेंड महंगाई और CO2 उत्सर्जन।"
outcomes:
  - en: "Forecast key macroeconomic variables"
    zh: "预测关键宏观经济变量"
    zh-TW: "預測關鍵總體經濟變數"
    ja: "主要なマクロ経済変数を予測する"
    ko: "주요 거시경제 변수 예측하기"
    vi: "Dự báo các biến kinh tế vĩ mô chính"
    ms: "Meramal pemboleh ubah makroekonomi utama"
    id: "Meramalkan variabel makroekonomi utama"
    hi: "मुख्य मैक्रोइकोनॉमिक चरों का पूर्वानुमान"
  - en: "Program estimation algorithms in R"
    zh: "用 R 编写估计算法"
    zh-TW: "用 R 撰寫估計演算法"
    ja: "Rで推定アルゴリズムを実装する"
    ko: "R로 추정 알고리즘 구현하기"
    vi: "Lập trình thuật toán ước lượng bằng R"
