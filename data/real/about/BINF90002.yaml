code: BINF90002
year: 2027
learn:
  en: "What bioinformatics is, the data and tools it uses, and its role in research and medicine."
  zh: "生物信息学是什么、用哪些数据和工具，以及在科研和医学中的作用。"
  zh-TW: "生物資訊學是什麼、用哪些資料與工具，以及在研究和醫學中的角色。"
  ja: "バイオインフォとは何か、使うデータとツール、研究と医療での役割。"
  ko: "생물정보학이 무엇인지, 쓰는 데이터와 도구, 연구·의료에서의 역할."
  vi: "Tin sinh học là gì, dữ liệu và công cụ nó dùng, vai trò trong nghiên cứu và y học."
  ms: "Apa itu bioinformatik, data dan alatnya, serta peranannya dalam kajian dan perubatan."
  id: "Apa itu bioinformatika, data dan alatnya, serta perannya di riset dan kedokteran."
  hi: "बायोइन्फ़ॉर्मेटिक्स क्या है, इसके डेटा और टूल, और शोध व चिकित्सा में भूमिका।"
outcomes:
  - en: "Describe bioinformatics data types and how they're made"
    zh: "说明生物信息学的数据类型及来源"
    zh-TW: "說明生物資訊學的資料類型及來源"
    ja: "データの種類と生成方法を説明する"
    ko: "데이터 유형과 생성 방식 설명하기"
    vi: "Mô tả các loại dữ liệu và cách tạo ra"
    ms: "Menerangkan jenis data dan cara ia dihasilkan"
    id: "Menjelaskan jenis data dan cara pembuatannya"
    hi: "डेटा के प्रकार और उनका स्रोत बताना"
  - en: "Pick suitable software and analysis pipelines"
    zh: "选择合适的软件和分析流程"
    zh-TW: "選擇合適的軟體與分析流程"
    ja: "適切なソフトと解析パイプラインを選ぶ"
    ko: "적합한 소프트웨어·분석 파이프라인 고르기"
    vi: "Chọn phần mềm và quy trình phân tích phù hợp"
    ms: "Memilih perisian dan saluran analisis sesuai"
    id: "Memilih perangkat lunak dan pipeline yang tepat"
    hi: "सही सॉफ़्टवेयर और विश्लेषण पाइपलाइन चुनना"
  - en: "Critique bioinformatics papers"
    zh: "评析生物信息学文献"
    zh-TW: "評析生物資訊學文獻"
    ja: "バイオインフォ論文を批判的に読む"
    ko: "생물정보학 논문 비평하기"
    vi: "Phê bình các bài báo tin sinh học"
    ms: "Mengkritik kertas kajian bioinformatik"
    id: "Mengkritisi makalah bioinformatika"
    hi: "बायोइन्फ़ॉर्मेटिक्स शोधपत्रों की समीक्षा"
