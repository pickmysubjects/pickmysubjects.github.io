code: MULT20016
year: 2026
learn:
  en: "Case studies of drug classes, medical and recreational: how they work, their history, and how society regulates their risks."
  zh: "以案例学习各类药物（医用与娱乐用）：作用机制、历史，以及社会如何管控其风险。"
  zh-TW: "以案例學習各類藥物（醫用與娛樂用）：作用機制、歷史，以及社會如何管控其風險。"
  ja: "医療用・娯楽用の薬物を事例で学ぶ。作用の仕組み、歴史、社会がそのリスクをどう規制してきたか。"
  ko: "의료용·기호용 약물을 사례로 배운다. 작용 원리, 역사, 사회가 그 위험을 어떻게 규제하는지."
  vi: "Tìm hiểu các nhóm thuốc y tế và giải trí qua tình huống: cơ chế, lịch sử và cách xã hội quản lý rủi ro."
  ms: "Kajian kes kelas dadah, perubatan dan rekreasi: cara ia berfungsi, sejarahnya dan cara masyarakat mengawal risikonya."
  id: "Studi kasus golongan obat, medis dan rekreasi: cara kerjanya, sejarahnya, dan cara masyarakat mengatur risikonya."
  hi: "चिकित्सा और नशे वाली दवाओं के केस स्टडी: वे कैसे काम करती हैं, उनका इतिहास, और समाज उनके जोखिम कैसे नियंत्रित करता है।"
outcomes:
  - en: "Explain in simple terms how major drugs act"
    zh: "用浅显的语言说明主要药物的作用"
    zh-TW: "用淺顯的語言說明主要藥物的作用"
    ja: "主な薬物の作用をわかりやすく説明する"
    ko: "주요 약물의 작용을 쉽게 설명하기"
    vi: "Giải thích đơn giản cách các loại thuốc chính tác động"
    ms: "Terangkan secara mudah cara dadah utama bertindak"
    id: "Menjelaskan secara sederhana cara kerja obat utama"
    hi: "मुख्य दवाओं का असर आसान शब्दों में समझाना"
  - en: "Weigh the medical, social and ethical risks of drug use"
    zh: "权衡用药的医学、社会和伦理风险"
    zh-TW: "權衡用藥的醫學、社會和倫理風險"
    ja: "薬物使用の医学的・社会的・倫理的リスクを比べる"
    ko: "약물 사용의 의학적·사회적·윤리적 위험 따져보기"
    vi: "Cân nhắc rủi ro y tế, xã hội và đạo đức của việc dùng thuốc"
    ms: "Timbang risiko perubatan, sosial dan etika penggunaan dadah"
    id: "Menimbang risiko medis, sosial dan etis penggunaan obat"
    hi: "दवा के इस्तेमाल के चिकित्सीय, सामाजिक और नैतिक जोखिम तौलना"
  - en: "Debate who should manage drug risk and how"
    zh: "讨论应由谁、如何管控药物风险"
    zh-TW: "討論應由誰、如何管控藥物風險"
    ja: "薬物リスクを誰がどう管理すべきか議論する"
    ko: "약물 위험을 누가 어떻게 관리해야 할지 토론하기"
    vi: "Tranh luận ai nên quản lý rủi ro thuốc và bằng cách nào"
    ms: "Bahaskan siapa patut mengurus risiko dadah dan bagaimana"
    id: "Memperdebatkan siapa yang harus mengelola risiko obat dan caranya"
    hi: "बहस करना कि दवा का जोखिम कौन और कैसे संभाले"
