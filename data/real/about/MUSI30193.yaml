code: MUSI30193
year: 2026
learn:
  en: "Piano duo (two pianos) and duet (one piano, four hands) repertoire from the 1700s to now. Audition entry, pass/fail."
  zh: "18世纪至今的双钢琴与四手联弹曲目。需试音，及格制。"
  zh-TW: "18世紀至今的雙鋼琴與四手聯彈曲目。需試音，及格制。"
  ja: "18世紀から現代までの2台ピアノと連弾の曲。オーディション制・合否判定。"
  ko: "18세기부터 현재까지 두 대 피아노와 연탄곡. 오디션, 합격/불합격."
  vi: "Tiết mục song tấu hai đàn và bốn tay từ thế kỷ 18. Thử giọng, đạt/không đạt."
  ms: "Repertoir duo dua piano dan duet empat tangan sejak abad ke-18. Lulus/gagal."
  id: "Repertoar duo dua piano dan duet empat tangan sejak abad 18. Lulus/gagal."
  hi: "1700 से आज तक दो पियानो और चार हाथों की रचनाएँ। ऑडिशन, पास/फ़ेल।"
outcomes:
  - en: "Coordinate timing and balance with a partner pianist"
    zh: "与搭档钢琴家协调节奏与平衡"
    zh-TW: "與搭檔鋼琴家協調節奏與平衡"
    ja: "相手のピアニストとタイミングと音量を合わせる"
    ko: "파트너 피아니스트와 타이밍·균형 맞추기"
    vi: "Phối hợp nhịp và cân bằng với bạn đàn"
    ms: "Selaraskan masa dan imbangan dengan rakan"
    id: "Menyelaraskan waktu dan keseimbangan dengan rekan"
    hi: "साथी पियानोवादक के साथ ताल और संतुलन मिलाना"
  - en: "Learn duo and duet repertoire"
    zh: "学习双钢琴与四手联弹曲目"
    zh-TW: "學習雙鋼琴與四手聯彈曲目"
    ja: "2台ピアノと連弾の曲を学ぶ"
    ko: "두 대 피아노와 연탄 레퍼토리 익히기"
    vi: "Học tiết mục song tấu và bốn tay"
    ms: "Pelajari repertoir duo dan duet"
    id: "Mempelajari repertoar duo dan duet"
    hi: "डुओ और डुएट रचनाएँ सीखना"
  - en: "Perform as part of a piano partnership"
    zh: "以钢琴搭档形式演出"
    zh-TW: "以鋼琴搭檔形式演出"
    ja: "ピアノのペアとして演奏する"
    ko: "피아노 듀오로 공연하기"
    vi: "Biểu diễn trong cặp đôi piano"
    ms: "Membuat persembahan sebagai pasangan piano"
    id: "Tampil sebagai pasangan piano"
    hi: "पियानो जोड़ी के रूप में प्रस्तुति देना"
