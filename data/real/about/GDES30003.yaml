code: GDES30003
year: 2026
learn:
  en: "Graphic Design capstone: book, catalogue and web projects, ending in a professional portfolio."
  zh: "平面设计方向毕业设计课：书籍、画册和网页项目，最终完成专业作品集。"
  zh-TW: "平面設計方向畢業設計課：書籍、型錄和網頁專案，最後完成專業作品集。"
  ja: "グラフィックデザインの総仕上げ。本・カタログ・ウェブの課題を経てプロ向けポートフォリオを作る。"
  ko: "그래픽디자인 캡스톤. 책·카탈로그·웹 프로젝트를 거쳐 전문 포트폴리오를 완성한다."
  vi: "Môn tốt nghiệp Thiết kế đồ họa: dự án sách, catalogue và web, kết thúc bằng portfolio chuyên nghiệp."
  ms: "Kemuncak Reka Bentuk Grafik: projek buku, katalog dan web, berakhir dengan portfolio profesional."
  id: "Capstone Desain Grafis: proyek buku, katalog, dan web, diakhiri portofolio profesional."
  hi: "ग्राफ़िक डिज़ाइन कैपस्टोन: किताब, कैटलॉग और वेब प्रोजेक्ट, अंत में प्रोफ़ेशनल पोर्टफ़ोलियो।"
outcomes:
