    vi: "Thiết kế sách và catalogue triển lãm"
    ms: "Reka buku dan katalog pameran"
    id: "Mendesain buku dan katalog pameran"
    hi: "किताबें और प्रदर्शनी कैटलॉग डिज़ाइन करना"
  - en: "Create web-based design collateral"
