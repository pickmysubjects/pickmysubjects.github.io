code: ENGL20036
year: 2026
learn:
  en: "Key moments in theatre history, from ancient Greece, Egypt and India to colonial-era encounters around the world."
  zh: "戏剧史上的关键时刻，从古希腊、埃及和印度到世界各地的殖民时期交流。"
  zh-TW: "戲劇史上的關鍵時刻，從古希臘、埃及和印度到世界各地的殖民時期交流。"
  ja: "古代ギリシャ・エジプト・インドから世界各地の植民地期の出会いまで、演劇史の重要な場面を学ぶ。"
  ko: "고대 그리스·이집트·인도부터 세계 곳곳의 식민 시대 만남까지 연극사의 중요한 순간을 배운다."
  vi: "Những khoảnh khắc then chốt của lịch sử sân khấu, từ Hy Lạp, Ai Cập, Ấn Độ cổ đại đến các cuộc gặp gỡ thời thuộc địa."
  ms: "Detik penting sejarah teater, dari Yunani, Mesir dan India purba hingga pertembungan era kolonial di serata dunia."
  id: "Momen penting sejarah teater, dari Yunani, Mesir dan India kuno sampai perjumpaan era kolonial di berbagai belahan dunia."
  hi: "रंगमंच इतिहास के अहम पल, प्राचीन यूनान, मिस्र और भारत से लेकर दुनिया भर के औपनिवेशिक दौर के मेलजोल तक।"
outcomes:
  - en: "Describe theatre practices across cultures"
    zh: "描述不同文化中的戏剧实践"
    zh-TW: "描述不同文化中的戲劇實踐"
    ja: "文化ごとの演劇の営みを説明する"
    ko: "여러 문화의 연극 관습 설명하기"
    vi: "Mô tả thực hành sân khấu ở nhiều nền văn hóa"
    ms: "Huraikan amalan teater merentas budaya"
    id: "Menguraikan praktik teater lintas budaya"
    hi: "अलग-अलग संस्कृतियों की रंगमंच परंपराओं का वर्णन करना"
  - en: "Compare themes across times and places"
    zh: "比较不同时代和地区的主题"
    zh-TW: "比較不同時代和地區的主題"
    ja: "時代や地域をこえてテーマを比べる"
    ko: "시대와 지역을 넘어 주제 비교하기"
    vi: "So sánh chủ đề qua các thời đại và nơi chốn"
    ms: "Bandingkan tema merentas zaman dan tempat"
    id: "Membandingkan tema lintas zaman dan tempat"
    hi: "समय और जगहों के पार विषयों की तुलना करना"
  - en: "Use historical sources to discuss performance"
    zh: "运用史料讨论表演"
    zh-TW: "運用史料討論表演"
    ja: "史料を使って上演について論じる"
    ko: "사료를 활용해 공연 논의하기"
    vi: "Dùng nguồn sử liệu để bàn về trình diễn"
    ms: "Guna sumber sejarah untuk membincangkan persembahan"
    id: "Memakai sumber sejarah untuk membahas pertunjukan"
    hi: "ऐतिहासिक स्रोतों से प्रदर्शन पर चर्चा करना"
