code: MECM20014
year: 2026
learn:
  en: "How photos, film and video change once they go digital and spread online, and what that means for truth, news and activism."
  zh: "照片、电影和视频数字化并在网上传播后发生了什么变化，这对真实性、新闻和社会运动意味着什么。"
  zh-TW: "照片、電影和影片數位化並在網路上傳播後發生了什麼變化，這對真實性、新聞和社會運動意味著什麼。"
  ja: "写真・映画・映像がデジタル化しネットで広まると何が変わるのか、それが真実性、報道、社会運動にとって何を意味するかを学ぶ。"
  ko: "사진, 영화, 영상이 디지털화되어 온라인에 퍼지면 무엇이 달라지는지, 그것이 진실성, 뉴스, 사회 운동에 어떤 의미인지 배운다."
  vi: "Ảnh, phim và video thay đổi ra sao khi số hóa và lan truyền trực tuyến, và điều đó có ý nghĩa gì với sự thật, tin tức và hoạt động xã hội."
  ms: "Bagaimana foto, filem dan video berubah apabila menjadi digital dan tersebar dalam talian, dan apa maknanya bagi kebenaran, berita dan aktivisme."
  id: "Bagaimana foto, film, dan video berubah saat menjadi digital dan tersebar daring, serta artinya bagi kebenaran, berita, dan aktivisme."
  hi: "फ़ोटो, फ़िल्म और वीडियो डिजिटल होकर ऑनलाइन फैलने पर कैसे बदलते हैं, और इसका सच, खबरों और एक्टिविज़्म के लिए क्या मतलब है।"
outcomes:
  - en: "Use key ideas and methods of visual analysis"
    zh: "运用视觉分析的核心概念和方法"
    zh-TW: "運用視覺分析的核心概念和方法"
    ja: "視覚分析の主要な概念と方法を使う"
    ko: "시각 분석의 핵심 개념과 방법 활용하기"
    vi: "Dùng các khái niệm và phương pháp chính của phân tích hình ảnh"
    ms: "Guna konsep dan kaedah utama analisis visual"
    id: "Memakai konsep dan metode utama analisis visual"
    hi: "विज़ुअल विश्लेषण के मुख्य विचार और तरीके इस्तेमाल करना"
  - en: "Analyse images through real case studies"
    zh: "通过真实案例分析图像"
    zh-TW: "透過真實案例分析影像"
    ja: "実際の事例を通して画像を分析する"
    ko: "실제 사례로 이미지 분석하기"
    vi: "Phân tích hình ảnh qua các trường hợp thực tế"
    ms: "Analisis imej melalui kajian kes sebenar"
    id: "Menganalisis gambar lewat studi kasus nyata"
    hi: "असली केस स्टडी के ज़रिए तस्वीरों का विश्लेषण करना"
  - en: "Link new tech to new ways of visual communication"
    zh: "把技术变化和新的视觉传播方式联系起来"
    zh-TW: "把技術變化和新的視覺傳播方式連結起來"
    ja: "技術の変化と新しい視覚表現のつながりを考える"
    ko: "기술 변화와 새로운 시각 소통 방식 연결하기"
    vi: "Liên hệ công nghệ mới với cách giao tiếp hình ảnh mới"
    ms: "Kaitkan teknologi baharu dengan cara komunikasi visual baharu"
    id: "Menghubungkan teknologi baru dengan cara komunikasi visual baru"
    hi: "नई तकनीक को विज़ुअल संचार के नए तरीकों से जोड़ना"
