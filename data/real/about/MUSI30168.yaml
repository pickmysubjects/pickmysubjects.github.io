code: MUSI30168
year: 2026
learn:
  en: "Another semester in the large brass ensemble, with fresh repertoire and concerts. Audition entry, pass/fail."
  zh: "再一学期的大型铜管合奏，新曲目与新演出。需试音，及格制。"
  zh-TW: "再一學期的大型銅管合奏，新曲目與新演出。需試音，及格制。"
  ja: "大編成金管アンサンブルの後期。新曲目と演奏会。オーディション制・合否判定。"
  ko: "대규모 금관 앙상블 2학기. 새 곡과 공연. 오디션, 합격/불합격."
  vi: "Thêm một kỳ với dàn kèn đồng lớn, tiết mục và buổi diễn mới. Đạt/không đạt."
  ms: "Satu semester lagi ensembel brass, repertoir dan konsert baharu. Lulus/gagal."
  id: "Satu semester lagi ansambel brass, repertoar dan konser baru. Lulus/gagal."
  hi: "बड़े ब्रास समूह का एक और सत्र, नई रचनाएँ और कॉन्सर्ट। पास/फ़ेल।"
outcomes:
  - en: "Build stamina and control for ensemble playing"
    zh: "增强合奏所需的耐力与控制"
    zh-TW: "增強合奏所需的耐力與控制"
    ja: "合奏に必要な持久力と制御を養う"
    ko: "합주에 필요한 지구력과 조절력 기르기"
    vi: "Rèn sức bền và kiểm soát khi hòa tấu"
    ms: "Bina stamina dan kawalan untuk ensembel"
    id: "Membangun stamina dan kontrol bermain ansambel"
    hi: "समूह वादन के लिए दम और नियंत्रण बढ़ाना"
  - en: "Learn new brass repertoire quickly"
    zh: "快速掌握新的铜管曲目"
    zh-TW: "快速掌握新的銅管曲目"
    ja: "新しい金管曲を素早く覚える"
    ko: "새 금관 레퍼토리 빠르게 익히기"
    vi: "Học nhanh tiết mục kèn đồng mới"
    ms: "Kuasai repertoir brass baharu dengan cepat"
    id: "Cepat menguasai repertoar brass baru"
    hi: "नई ब्रास रचनाएँ जल्दी सीखना"
  - en: "Perform in brass ensemble concerts"
    zh: "参加铜管合奏音乐会演出"
    zh-TW: "參加銅管合奏音樂會演出"
    ja: "金管アンサンブルの演奏会に出る"
    ko: "금관 앙상블 공연에 서기"
    vi: "Biểu diễn trong hòa nhạc kèn đồng"
    ms: "Membuat persembahan dalam konsert brass"
    id: "Tampil dalam konser ansambel brass"
    hi: "ब्रास समूह कॉन्सर्ट में प्रस्तुति देना"
