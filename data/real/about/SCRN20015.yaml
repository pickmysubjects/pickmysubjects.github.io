code: SCRN20015
year: 2026
learn:
  en: "Horror on screen, from classics to new twists: how the genre's style evolved and how it uses fear to explore race, gender and identity."
  zh: "银幕恐怖片，从经典到新变化：这一类型的风格如何演变，以及如何借恐惧探讨种族、性别与身份。"
  zh-TW: "銀幕恐怖片，從經典到新變化：這一類型的風格如何演變，以及如何藉恐懼探討種族、性別與身分。"
  ja: "古典から新しい試みまでのホラー映像。ジャンルの様式の変化と、恐怖を通じて人種、ジェンダー、アイデンティティを描く方法。"
  ko: "고전부터 새로운 시도까지 스크린 속 공포. 장르 양식의 변화와 공포로 인종, 젠더, 정체성을 다루는 방식."
  vi: "Phim kinh dị từ kinh điển đến cách tân: phong cách thể loại thay đổi ra sao và dùng nỗi sợ để bàn về chủng tộc, giới, bản sắc."
  ms: "Seram di skrin, dari klasik hingga pembaharuan: evolusi gaya genre dan cara ia guna ketakutan untuk meneroka kaum, gender dan identiti."
  id: "Horor di layar, dari klasik hingga inovasi baru: evolusi gaya genre dan cara memakai rasa takut untuk menjelajah ras, gender dan identitas."
  hi: "परदे पर हॉरर, क्लासिक से नए प्रयोगों तक: विधा की शैली कैसे बदली और वह डर से नस्ल, जेंडर और पहचान को कैसे टटोलती है।"
outcomes:
  - en: "Trace how horror's style has changed"
    zh: "追踪恐怖片风格的演变"
    zh-TW: "追蹤恐怖片風格的演變"
    ja: "ホラーの様式の変化をたどる"
    ko: "공포 장르 양식의 변화 추적하기"
    vi: "Lần theo sự thay đổi phong cách phim kinh dị"
    ms: "Jejaki perubahan gaya filem seram"
    id: "Menelusuri perubahan gaya film horor"
    hi: "हॉरर की शैली में बदलाव समझना"
  - en: "Analyse how horror uses fear and emotion"
    zh: "分析恐怖片如何运用恐惧与情绪"
    zh-TW: "分析恐怖片如何運用恐懼與情緒"
    ja: "ホラーが恐怖と感情をどう使うか分析する"
    ko: "공포물이 두려움과 감정을 쓰는 방식 분석하기"
    vi: "Phân tích cách phim kinh dị dùng nỗi sợ và cảm xúc"
    ms: "Analisis cara filem seram guna ketakutan dan emosi"
    id: "Menganalisis cara horor memakai rasa takut dan emosi"
    hi: "हॉरर डर और भावना का कैसे उपयोग करता है, विश्लेषण करना"
  - en: "Read horror films for social meaning"
    zh: "解读恐怖片中的社会意涵"
    zh-TW: "解讀恐怖片中的社會意涵"
    ja: "ホラー映画の社会的な意味を読む"
    ko: "공포 영화의 사회적 의미 읽기"
    vi: "Đọc ý nghĩa xã hội trong phim kinh dị"
    ms: "Tafsir makna sosial filem seram"
    id: "Membaca makna sosial film horor"
    hi: "हॉरर फ़िल्मों में सामाजिक अर्थ पढ़ना"
