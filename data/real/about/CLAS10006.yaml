code: CLAS10006
year: 2026
learn:
  en: "Classical Latin from scratch: grammar, word forms and translating simple texts, with Roman culture along the way."
  zh: "零基础古典拉丁语：语法、词形变化和简单文本翻译，穿插罗马文化。"
  zh-TW: "零基礎古典拉丁語：文法、詞形變化和簡單文本翻譯，穿插羅馬文化。"
  ja: "ゼロから学ぶ古典ラテン語。文法、語形変化、やさしい文の翻訳、ローマ文化も合わせて。"
  ko: "처음 배우는 고전 라틴어. 문법, 어형 변화, 쉬운 글 번역과 로마 문화."
  vi: "Tiếng Latinh cổ điển từ đầu: ngữ pháp, biến đổi từ, dịch văn bản đơn giản, kèm văn hóa La Mã."
  ms: "Bahasa Latin klasik dari asas: tatabahasa, bentuk kata dan terjemahan teks mudah, bersama budaya Rom."
  id: "Bahasa Latin klasik dari nol: tata bahasa, bentuk kata dan menerjemahkan teks sederhana, sambil mengenal budaya Romawi."
  hi: "शून्य से शास्त्रीय लैटिन: व्याकरण, शब्द-रूप और आसान पाठों का अनुवाद, साथ में रोमन संस्कृति।"
outcomes:
  - en: "Learn the core grammar and vocabulary of Latin"
    zh: "掌握拉丁语的核心语法和词汇"
    zh-TW: "掌握拉丁語的核心文法和詞彙"
    ja: "ラテン語の基本文法と語彙を身につける"
    ko: "라틴어의 핵심 문법과 어휘 익히기"
    vi: "Nắm ngữ pháp và từ vựng cốt lõi của tiếng Latinh"
    ms: "Kuasai tatabahasa dan kosa kata teras bahasa Latin"
    id: "Menguasai tata bahasa dan kosakata inti bahasa Latin"
    hi: "लैटिन का मूल व्याकरण और शब्दावली सीखना"
  - en: "Read simple Latin sentences and texts"
    zh: "阅读简单的拉丁语句子和文本"
    zh-TW: "閱讀簡單的拉丁語句子和文本"
    ja: "やさしいラテン語の文や文章を読む"
    ko: "쉬운 라틴어 문장과 글 읽기"
    vi: "Đọc câu và văn bản tiếng Latinh đơn giản"
    ms: "Baca ayat dan teks bahasa Latin yang mudah"
    id: "Membaca kalimat dan teks bahasa Latin sederhana"
    hi: "सरल लैटिन वाक्य और पाठ पढ़ना"
  - en: "Translate short Latin passages into English"
    zh: "把简短的拉丁语段落译成英语"
    zh-TW: "把簡短的拉丁語段落譯成英語"
    ja: "短いラテン語の文章を英語に訳す"
    ko: "짧은 라틴어 글을 영어로 번역하기"
    vi: "Dịch đoạn tiếng Latinh ngắn sang tiếng Anh"
    ms: "Terjemah petikan bahasa Latin pendek ke bahasa Inggeris"
    id: "Menerjemahkan bagian bahasa Latin pendek ke bahasa Inggris"
    hi: "छोटे लैटिन अंशों का अंग्रेज़ी में अनुवाद करना"
