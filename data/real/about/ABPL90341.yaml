code: ABPL90341
year: 2027
learn:
  en: "How urban environmental policy and planning respond to climate change, heat, flooding and biodiversity loss in cities."
  zh: "城市环境政策与规划如何应对气候变化、高温、洪水和生物多样性丧失。"
  zh-TW: "城市環境政策與規劃如何因應氣候變遷、高溫、洪水和生物多樣性喪失。"
  ja: "都市の環境政策と計画が気候変動・暑熱・洪水・生物多様性損失にどう対応するか。"
  ko: "도시 환경 정책과 계획이 기후변화, 폭염, 홍수, 생물다양성 손실에 대응하는 법."
  vi: "Chính sách và quy hoạch môi trường đô thị ứng phó biến đổi khí hậu, nắng nóng, lũ lụt và mất đa dạng sinh học."
  ms: "Cara dasar dan perancangan alam sekitar bandar menangani perubahan iklim, haba, banjir dan kehilangan biodiversiti."
  id: "Cara kebijakan dan perencanaan lingkungan kota menangani perubahan iklim, panas, banjir, dan hilangnya keanekaragaman hayati."
  hi: "शहरी पर्यावरण नीति व योजना कैसे जलवायु परिवर्तन, गर्मी, बाढ़ और जैव-विविधता हानि से निपटती है।"
outcomes:
  - en: "Assess how well urban policies work"
    zh: "评估城市环境政策的效果"
    zh-TW: "評估城市環境政策的成效"
    ja: "都市環境政策の効果を評価する"
    ko: "도시 환경 정책의 효과 평가하기"
    vi: "Đánh giá hiệu quả chính sách đô thị"
    ms: "Menilai keberkesanan dasar bandar"
    id: "Menilai efektivitas kebijakan kota"
    hi: "शहरी नीतियों की प्रभावशीलता आँकना"
  - en: "Design an urban environmental plan"
    zh: "设计一项城市环境规划"
    zh-TW: "設計一項城市環境規劃"
    ja: "都市環境計画を立案する"
    ko: "도시 환경 계획 설계하기"
    vi: "Xây dựng kế hoạch môi trường đô thị"
    ms: "Mereka pelan alam sekitar bandar"
    id: "Merancang rencana lingkungan kota"
    hi: "शहरी पर्यावरण योजना बनाना"
