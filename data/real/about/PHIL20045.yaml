code: PHIL20045
year: 2026
learn:
  en: "The ethics of borders and migration: open borders, national culture, family reunion and how refugees should be treated."
  zh: "边界与移民的伦理：开放边界、国家文化、家庭团聚以及难民应受何种对待。"
  zh-TW: "邊界與移民的倫理：開放邊界、國家文化、家庭團聚以及難民應受何種對待。"
  ja: "国境と移民の倫理。開かれた国境、国の文化、家族の再会、難民の扱いを考える。"
  ko: "국경과 이주의 윤리. 열린 국경, 국가 문화, 가족 재결합, 난민 대우를 다룬다."
  vi: "Đạo đức về biên giới và di cư: biên giới mở, văn hóa quốc gia, đoàn tụ gia đình và cách đối xử với người tị nạn."
  ms: "Etika sempadan dan migrasi: sempadan terbuka, budaya nasional, penyatuan keluarga dan layanan terhadap pelarian."
  id: "Etika perbatasan dan migrasi: perbatasan terbuka, budaya nasional, reunifikasi keluarga dan perlakuan terhadap pengungsi."
  hi: "सीमाओं और प्रवास की नैतिकता: खुली सीमाएं, राष्ट्रीय संस्कृति, परिवार का मिलन और शरणार्थियों से बर्ताव।"
outcomes:
  - en: "Explain key positions on immigration ethics"
    zh: "说明移民伦理的主要立场"
    zh-TW: "說明移民倫理的主要立場"
    ja: "移民倫理の主な立場を説明する"
    ko: "이민 윤리의 주요 입장 설명하기"
    vi: "Giải thích các lập trường chính về đạo đức nhập cư"
    ms: "Terangkan pendirian utama etika imigresen"
    id: "Menjelaskan posisi utama etika imigrasi"
    hi: "आप्रवासन नैतिकता के मुख्य मत समझाना"
  - en: "Evaluate arguments for and against open borders"
    zh: "评估支持与反对开放边界的论证"
    zh-TW: "評估支持與反對開放邊界的論證"
    ja: "開かれた国境への賛否の議論を評価する"
    ko: "열린 국경 찬반 논증 평가하기"
    vi: "Đánh giá lập luận ủng hộ và phản đối biên giới mở"
    ms: "Nilai hujah menyokong dan menentang sempadan terbuka"
    id: "Menilai argumen pro dan kontra perbatasan terbuka"
    hi: "खुली सीमाओं के पक्ष और विपक्ष के तर्क परखना"
  - en: "Apply ethics to real refugee and migration policy"
    zh: "把伦理学用于真实的难民和移民政策"
    zh-TW: "把倫理學用於真實的難民和移民政策"
    ja: "倫理を実際の難民・移民政策に当てはめる"
    ko: "윤리를 실제 난민·이민 정책에 적용하기"
    vi: "Áp dụng đạo đức vào chính sách tị nạn, di cư thực tế"
    ms: "Gunakan etika pada dasar pelarian dan migrasi sebenar"
    id: "Menerapkan etika pada kebijakan pengungsi dan migrasi nyata"
    hi: "असली शरणार्थी और प्रवास नीति पर नैतिकता लागू करना"
