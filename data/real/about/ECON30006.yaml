code: ECON30006
year: 2026
learn:
  en: "How the job market works: wages, education, unions, discrimination, inequality and unemployment."
  zh: "劳动市场如何运作：工资、教育、工会、歧视、不平等和失业。"
  zh-TW: "勞動市場如何運作：薪資、教育、工會、歧視、不平等和失業。"
  ja: "労働市場の仕組み：賃金、教育、労働組合、差別、格差、失業。"
  ko: "노동시장의 작동: 임금, 교육, 노조, 차별, 불평등, 실업."
  vi: "Thị trường lao động vận hành ra sao: lương, giáo dục, công đoàn, phân biệt, bất bình đẳng và thất nghiệp."
  ms: "Cara pasaran buruh berfungsi: gaji, pendidikan, kesatuan, diskriminasi, ketaksamaan dan pengangguran."
  id: "Cara pasar tenaga kerja bekerja: upah, pendidikan, serikat, diskriminasi, ketimpangan, dan pengangguran."
  hi: "रोज़गार बाज़ार कैसे काम करता है: वेतन, शिक्षा, यूनियन, भेदभाव, असमानता और बेरोज़गारी।"
outcomes:
  - en: "Explain labour market outcomes through incentives"
    zh: "用激励解释劳动市场结果"
    zh-TW: "用誘因解釋勞動市場結果"
    ja: "インセンティブで労働市場の結果を説明する"
    ko: "인센티브로 노동시장 결과 설명"
    vi: "Giải thích kết quả thị trường lao động qua động cơ"
    ms: "Terangkan hasil pasaran buruh melalui insentif"
    id: "Menjelaskan hasil pasar kerja lewat insentif"
    hi: "प्रोत्साहनों से रोज़गार बाज़ार के नतीजे समझाना"
  - en: "Evaluate labour policies of governments and unions"
    zh: "评估政府和工会的劳动政策"
    zh-TW: "評估政府和工會的勞動政策"
    ja: "政府や労組の労働政策を評価する"
    ko: "정부와 노조의 노동정책 평가"
    vi: "Đánh giá chính sách lao động của chính phủ và công đoàn"
    ms: "Nilai dasar buruh kerajaan dan kesatuan"
    id: "Menilai kebijakan kerja pemerintah dan serikat"
    hi: "सरकार और यूनियनों की श्रम नीतियाँ परखना"
  - en: "Read labour market research critically"
    zh: "批判性地阅读劳动市场研究"
    zh-TW: "批判性地閱讀勞動市場研究"
    ja: "労働市場の研究を批判的に読む"
    ko: "노동시장 연구를 비판적으로 읽기"
    vi: "Đọc nghiên cứu thị trường lao động một cách phê phán"
    ms: "Baca kajian pasaran buruh secara kritis"
    id: "Membaca riset pasar kerja secara kritis"
    hi: "रोज़गार बाज़ार की रिसर्च आलोचनात्मक ढंग से पढ़ना"
