code: FLTV20009
year: 2026
learn:
  en: "Write, direct and produce a longer short film with more pre-production and directing of actors, and crew on peers' films."
  zh: "编剧、导演并制作一部更长的短片，加强前期与演员指导，并为同学的片子做剧组。"
  zh-TW: "編劇、導演並製作一部更長的短片，加強前期與演員指導，並為同學的片子做劇組。"
  ja: "より長い短編を脚本・監督・製作し、準備と演出を深め、仲間の作品でスタッフを務める。"
  ko: "더 긴 단편을 쓰고 연출·제작하며 프리프로덕션과 배우 연출을 심화하고 동료 작품 스태프를 한다."
  vi: "Viết, đạo diễn, sản xuất phim ngắn dài hơn, kỹ hơn ở tiền kỳ và chỉ đạo diễn viên; làm ê-kíp cho bạn."
  ms: "Tulis, arah dan hasilkan filem pendek lebih panjang, dengan praproduksi lebih mendalam dan kru untuk rakan."
  id: "Menulis, menyutradarai dan memproduksi film pendek lebih panjang, plus jadi kru untuk teman."
  hi: "लंबी शॉर्ट फ़िल्म लिखना, निर्देशित और प्रोड्यूस करना, गहरी तैयारी और अभिनेता-निर्देशन, साथियों के लिए क्रू।"
outcomes:
  - en: "Take a short film from script to screen"
    zh: "把短片从剧本带到银幕"
    zh-TW: "把短片從劇本帶到銀幕"
    ja: "短編を脚本から完成まで仕上げる"
    ko: "단편을 대본에서 스크린까지 완성하기"
    vi: "Đưa phim ngắn từ kịch bản lên màn ảnh"
    ms: "Bawa filem pendek dari skrip ke skrin"
    id: "Membawa film pendek dari naskah ke layar"
    hi: "शॉर्ट फ़िल्म को स्क्रिप्ट से स्क्रीन तक ले जाना"
  - en: "Write a director's statement for your film"
    zh: "为自己的片子写导演阐述"
    zh-TW: "為自己的片子寫導演闡述"
    ja: "作品の演出意図を書く"
    ko: "자기 영화의 연출 의도 쓰기"
    vi: "Viết tuyên bố đạo diễn cho phim của mình"
    ms: "Tulis kenyataan pengarah untuk filem anda"
    id: "Menulis pernyataan sutradara untuk film"
    hi: "अपनी फ़िल्म के लिए निर्देशक वक्तव्य लिखना"
  - en: "Crew in key roles on two other films"
    zh: "在另外两部片子担任关键剧组职位"
    zh-TW: "在另外兩部片子擔任關鍵劇組職位"
    ja: "他の2作品で主要スタッフを務める"
    ko: "다른 두 작품에서 주요 스태프 맡기"
    vi: "Giữ vị trí chính trong ê-kíp hai phim khác"
    ms: "Jadi kru utama untuk dua filem lain"
    id: "Menjadi kru utama di dua film lain"
    hi: "दो अन्य फ़िल्मों में मुख्य क्रू भूमिका"
