code: UNIB20026
year: 2026
learn:
  en: "Melancholy from antiquity to today, through psychology, art and literature, and museum objects."
  zh: "从古至今的忧郁，透过心理学、艺术、文学和博物馆藏品来理解。"
  zh-TW: "從古至今的憂鬱，透過心理學、藝術、文學和博物館藏品來理解。"
  ja: "古代から現代までのメランコリーを、心理学・芸術・文学・博物館の資料から考える。"
  ko: "고대부터 오늘까지의 멜랑콜리를 심리학·예술·문학·박물관 소장품으로 살펴보기."
  vi: "Nỗi u sầu từ thời cổ đại đến nay, qua tâm lý học, nghệ thuật, văn học và hiện vật bảo tàng."
  ms: "Melankolia dari zaman purba hingga kini, melalui psikologi, seni, sastera dan objek muzium."
  id: "Melankolia dari zaman kuno hingga kini, lewat psikologi, seni, sastra, dan benda museum."
  hi: "प्राचीन काल से आज तक उदासी (मेलनकोली), मनोविज्ञान, कला, साहित्य और संग्रहालय वस्तुओं के ज़रिए।"
outcomes:
  - en: "Compare ideas of melancholy across history"
    zh: "比较不同历史时期对忧郁的理解"
    zh-TW: "比較不同歷史時期對憂鬱的理解"
    ja: "歴史上のメランコリー観を比べる"
    ko: "시대별 멜랑콜리 개념 비교하기"
    vi: "So sánh quan niệm về u sầu qua các thời kỳ"
    ms: "Banding idea melankolia sepanjang sejarah"
    id: "Membandingkan gagasan melankolia sepanjang sejarah"
    hi: "इतिहास में उदासी की धारणाओं की तुलना करना"
  - en: "Interpret objects and artworks"
    zh: "解读文物与艺术作品"
    zh-TW: "解讀文物與藝術作品"
    ja: "資料や美術作品を解釈する"
    ko: "유물과 예술 작품 해석하기"
    vi: "Diễn giải hiện vật và tác phẩm nghệ thuật"
    ms: "Tafsir objek dan karya seni"
    id: "Menafsirkan benda dan karya seni"
    hi: "वस्तुओं और कलाकृतियों की व्याख्या करना"
  - en: "Link psychology with the humanities"
    zh: "把心理学与人文学科联系起来"
    zh-TW: "把心理學與人文學科聯繫起來"
    ja: "心理学と人文学を結びつける"
    ko: "심리학과 인문학 연결하기"
    vi: "Kết nối tâm lý học với khoa học nhân văn"
    ms: "Kaitkan psikologi dengan kemanusiaan"
    id: "Menghubungkan psikologi dengan humaniora"
    hi: "मनोविज्ञान को मानविकी से जोड़ना"
