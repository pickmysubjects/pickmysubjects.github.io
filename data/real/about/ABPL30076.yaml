code: ABPL30076
year: 2026
learn:
  en: "A game design studio themed on solarpunk: level design, mechanics, narrative and art direction for a whole game world."
  zh: "以太阳朋克为主题的游戏设计课：为完整游戏世界做关卡、机制、叙事和美术指导。"
  zh-TW: "以太陽龐克為主題的遊戲設計課：為完整遊戲世界做關卡、機制、敘事與美術指導。"
  ja: "ソーラーパンクがテーマのゲームデザインスタジオ。ゲーム世界全体のレベル、仕組み、物語、アートを設計。"
  ko: "솔라펑크 주제의 게임 디자인 스튜디오. 게임 세계 전체의 레벨·메커닉·내러티브·아트 디렉션."
  vi: "Studio thiết kế game chủ đề solarpunk: thiết kế màn chơi, cơ chế, cốt truyện và mỹ thuật cho cả thế giới game."
  ms: "Studio reka bentuk permainan bertema solarpunk: reka aras, mekanik, naratif dan arahan seni untuk dunia permainan."
  id: "Studio desain gim bertema solarpunk: level, mekanik, narasi, dan art direction untuk seluruh dunia gim."
  hi: "सोलरपंक थीम पर गेम डिज़ाइन स्टूडियो: पूरे गेम वर्ल्ड के लिए लेवल, मैकेनिक्स, कहानी और आर्ट डायरेक्शन।"
outcomes:
  - en: "Design levels, mechanics and interface for a game"
    zh: "为游戏设计关卡、机制和界面"
    zh-TW: "為遊戲設計關卡、機制與介面"
    ja: "ゲームのレベル・仕組み・UIを設計する"
    ko: "게임의 레벨·메커닉·인터페이스 설계하기"
    vi: "Thiết kế màn chơi, cơ chế và giao diện game"
    ms: "Reka aras, mekanik dan antara muka permainan"
    id: "Mendesain level, mekanik, dan antarmuka gim"
    hi: "गेम के लेवल, मैकेनिक्स और इंटरफ़ेस डिज़ाइन करना"
  - en: "Shape narrative and art direction around a theme"
    zh: "围绕主题塑造叙事和美术风格"
    zh-TW: "圍繞主題形塑敘事與美術風格"
    ja: "テーマに沿って物語とアートを組み立てる"
    ko: "주제에 맞춰 내러티브와 아트 디렉션 만들기"
    vi: "Xây cốt truyện và mỹ thuật quanh một chủ đề"
    ms: "Bentuk naratif dan arahan seni ikut tema"
    id: "Membentuk narasi dan art direction sesuai tema"
    hi: "थीम के इर्द-गिर्द कहानी और आर्ट डायरेक्शन"
  - en: "Produce design docs, a game build and a pitch"
    zh: "完成设计文档、可玩版本和提案"
    zh-TW: "完成設計文件、可玩版本與提案"
    ja: "設計書、ゲームビルド、ピッチ資料を作る"
    ko: "기획서·게임 빌드·피치 자료 만들기"
    vi: "Làm tài liệu thiết kế, bản build và bài pitch"
    ms: "Hasilkan dokumen reka bentuk, binaan dan pitch"
    id: "Membuat dokumen desain, build gim, dan pitch"
    hi: "डिज़ाइन दस्तावेज़, गेम बिल्ड और पिच तैयार करना"
