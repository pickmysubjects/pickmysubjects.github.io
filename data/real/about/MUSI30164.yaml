code: MUSI30164
year: 2026
learn:
  en: "A second semester of Baroque ensemble on period instruments, with new repertoire and another concert."
  zh: "第二学期的古乐器巴洛克合奏，新曲目，再办一场演出。"
  zh-TW: "第二學期的古樂器巴洛克合奏，新曲目，再辦一場演出。"
  ja: "ピリオド楽器によるバロック合奏の後期。新しい曲目で再び演奏会へ。"
  ko: "시대 악기 바로크 합주 2학기. 새 레퍼토리로 또 한 번 공연."
  vi: "Học kỳ hai hòa tấu Baroque nhạc cụ cổ, tiết mục mới và buổi diễn mới."
  ms: "Semester kedua ensembel Barok, repertoir baharu dan konsert lagi."
  id: "Semester kedua ansambel Barok, repertoar baru dan konser lagi."
  hi: "बारोक समूह का दूसरा सत्र, नया संग्रह और एक और कॉन्सर्ट।"
outcomes:
  - en: "Deepen your historical performance style"
    zh: "深化历史演奏风格"
    zh-TW: "深化歷史演奏風格"
    ja: "歴史的演奏様式を深める"
    ko: "역사적 연주 양식 심화하기"
    vi: "Đào sâu phong cách biểu diễn lịch sử"
    ms: "Dalami gaya persembahan bersejarah"
    id: "Memperdalam gaya permainan historis"
    hi: "ऐतिहासिक वादन शैली को गहरा करना"
  - en: "Work as part of a period-instrument group"
    zh: "在古乐器团体中协作"
    zh-TW: "在古樂器團體中協作"
    ja: "古楽器グループの一員として動く"
    ko: "시대 악기 그룹의 일원으로 협업하기"
    vi: "Phối hợp trong nhóm nhạc cụ cổ"
    ms: "Bekerja dalam kumpulan alat zaman"
    id: "Bekerja dalam kelompok alat periode"
    hi: "पुराने वाद्यों के समूह में साथ काम करना"
  - en: "Pass an individual part test"
    zh: "通过个人声部测试"
    zh-TW: "通過個人聲部測試"
    ja: "個人パートテストに合格する"
    ko: "개인 파트 테스트 통과하기"
    vi: "Vượt qua bài kiểm tra bè cá nhân"
    ms: "Lulus ujian bahagian individu"
    id: "Lulus tes partisi individu"
    hi: "व्यक्तिगत भाग परीक्षा पास करना"
