code: ABPL90325
year: 2027
learn:
  en: "Prefabrication in construction, from panels to modular systems, through case studies, site visits and a scale model."
  zh: "通过案例、工地参观和比例模型，学习从板式到模块化的建筑预制。"
  zh-TW: "透過案例、工地參觀和比例模型，學習從板式到模組化的建築預製。"
  ja: "事例・現場見学・縮尺模型を通して、パネルからモジュールまでのプレハブ建築を学ぶ。"
  ko: "사례, 현장 견학, 축척 모형으로 패널부터 모듈러까지 프리패브 건축을 배웁니다."
  vi: "Tiền chế trong xây dựng, từ tấm panel đến mô-đun, qua tình huống, tham quan công trường và mô hình."
  ms: "Pembinaan pasang siap, dari panel hingga modular, melalui kajian kes, lawatan tapak dan model berskala."
  id: "Prefabrikasi konstruksi, dari panel hingga modular, lewat studi kasus, kunjungan lapangan, dan model skala."
  hi: "केस स्टडी, साइट विज़िट और स्केल मॉडल से पैनल से मॉड्यूलर तक प्रीफ़ैब्रिकेशन।"
outcomes:
  - en: "Design a prefabricated building"
    zh: "设计一座预制建筑"
    zh-TW: "設計一座預製建築"
    ja: "プレハブ建築を設計する"
    ko: "프리패브 건물 설계하기"
    vi: "Thiết kế một tòa nhà tiền chế"
    ms: "Mereka bangunan pasang siap"
    id: "Mendesain bangunan prefabrikasi"
    hi: "प्रीफ़ैब इमारत डिज़ाइन करना"
  - en: "Compare off-site and on-site building"
    zh: "比较场外预制与现场施工"
    zh-TW: "比較場外預製與現場施工"
    ja: "工場生産と現場施工を比べる"
    ko: "공장 생산과 현장 시공 비교하기"
    vi: "So sánh thi công ngoài và tại công trường"
    ms: "Membandingkan binaan luar tapak dan di tapak"
    id: "Membandingkan konstruksi off-site dan on-site"
    hi: "ऑफ़-साइट और ऑन-साइट निर्माण की तुलना"
