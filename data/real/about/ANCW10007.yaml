code: ANCW10007
year: 2026
learn:
  en: "The second ancient Egyptian course: more complex grammar and reading harder hieroglyphic texts with some help."
  zh: "古埃及语第二阶段：更复杂的语法，借助词汇表阅读较难的象形文字文本。"
  zh-TW: "古埃及語第二階段：更複雜的語法，借助詞彙表閱讀較難的象形文字文本。"
  ja: "古代エジプト語の第2段階。より複雑な文法と、語彙の助けを借りて難しめの文章を読む。"
  ko: "고대 이집트어 2단계: 더 복잡한 문법과 어휘 도움을 받아 어려운 상형문자 글 읽기를 배운다."
  vi: "Khóa tiếng Ai Cập cổ thứ hai: ngữ pháp phức tạp hơn và đọc văn bản tượng hình khó hơn với hỗ trợ từ vựng."
  ms: "Kursus kedua bahasa Mesir kuno: tatabahasa lebih kompleks dan membaca teks hieroglif lebih sukar dengan bantuan."
  id: "Kursus kedua bahasa Mesir kuno: tata bahasa lebih kompleks dan membaca teks hieroglif lebih sulit dengan bantuan."
  hi: "प्राचीन मिस्री का दूसरा कोर्स: अधिक जटिल व्याकरण और कुछ मदद से कठिन चित्रलिपि पाठ पढ़ना।"
outcomes:
  - en: "Use more complex Egyptian grammar"
    zh: "运用更复杂的古埃及语语法"
    zh-TW: "運用更複雜的古埃及語語法"
    ja: "より複雑なエジプト語文法を使う"
    ko: "더 복잡한 이집트어 문법 사용하기"
    vi: "Sử dụng ngữ pháp tiếng Ai Cập phức tạp hơn"
    ms: "Gunakan tatabahasa Mesir yang lebih kompleks"
    id: "Memakai tata bahasa Mesir yang lebih kompleks"
    hi: "अधिक जटिल मिस्री व्याकरण का उपयोग करना"
  - en: "Read moderately difficult hieroglyphic texts"
    zh: "阅读中等难度的象形文字文本"
    zh-TW: "閱讀中等難度的象形文字文本"
    ja: "中程度の難しさのヒエログリフを読む"
    ko: "중간 난이도 상형문자 글 읽기"
    vi: "Đọc văn bản tượng hình độ khó trung bình"
    ms: "Baca teks hieroglif tahap sederhana"
    id: "Membaca teks hieroglif tingkat menengah"
    hi: "मध्यम कठिनाई के चित्रलिपि पाठ पढ़ना"
  - en: "Discuss problems in reading an ancient language"
    zh: "讨论解读古代语言的难点"
    zh-TW: "討論解讀古代語言的難點"
    ja: "古代語を読む際の問題を論じる"
    ko: "고대 언어 해석의 문제 논의하기"
    vi: "Thảo luận khó khăn khi đọc một ngôn ngữ cổ"
    ms: "Bincangkan masalah membaca bahasa kuno"
    id: "Membahas kesulitan membaca bahasa kuno"
    hi: "प्राचीन भाषा पढ़ने की कठिनाइयों पर चर्चा करना"
