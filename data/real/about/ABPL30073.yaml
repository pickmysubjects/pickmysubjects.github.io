code: ABPL30073
year: 2026
learn:
  en: "Getting ready for design practice: client work, ethics and project management, ending with a professional portfolio."
  zh: "为进入设计行业做准备：客户沟通、职业伦理和项目管理，最终完成专业作品集。"
  zh-TW: "為進入設計業界做準備：客戶溝通、職業倫理與專案管理，最後完成專業作品集。"
  ja: "設計実務への準備。顧客対応、職業倫理、プロジェクト管理を学び、プロ向けポートフォリオを仕上げる。"
  ko: "디자인 실무 준비: 고객 응대, 직업 윤리, 프로젝트 관리를 배우고 전문 포트폴리오를 완성."
  vi: "Chuẩn bị hành nghề thiết kế: làm việc với khách, đạo đức nghề, quản lý dự án, kết thúc bằng portfolio chuyên nghiệp."
  ms: "Bersedia untuk amalan reka bentuk: kerja klien, etika dan pengurusan projek, berakhir dengan portfolio profesional."
  id: "Bersiap ke dunia kerja desain: klien, etika, dan manajemen proyek, diakhiri portofolio profesional."
  hi: "डिज़ाइन पेशे की तैयारी: क्लाइंट के साथ काम, नैतिकता और प्रोजेक्ट मैनेजमेंट, अंत में प्रोफ़ेशनल पोर्टफ़ोलियो।"
outcomes:
  - en: "Work with clients professionally"
    zh: "专业地与客户合作"
    zh-TW: "專業地與客戶合作"
    ja: "顧客とプロとして仕事をする"
    ko: "고객과 전문적으로 일하기"
    vi: "Làm việc chuyên nghiệp với khách hàng"
    ms: "Bekerja dengan klien secara profesional"
    id: "Bekerja dengan klien secara profesional"
    hi: "क्लाइंट के साथ पेशेवर ढंग से काम करना"
  - en: "Apply ethics and project management in design"
    zh: "在设计中运用职业伦理和项目管理"
    zh-TW: "在設計中運用職業倫理與專案管理"
    ja: "設計に職業倫理とプロジェクト管理を生かす"
    ko: "디자인에 직업 윤리와 프로젝트 관리 적용하기"
    vi: "Áp dụng đạo đức và quản lý dự án trong thiết kế"
    ms: "Guna etika dan pengurusan projek dalam reka bentuk"
    id: "Menerapkan etika dan manajemen proyek dalam desain"
    hi: "डिज़ाइन में नैतिकता और प्रोजेक्ट मैनेजमेंट लागू करना"
  - en: "Create an industry-standard design portfolio"
    zh: "制作符合行业标准的作品集"
    zh-TW: "製作符合業界標準的作品集"
    ja: "業界水準のポートフォリオを作る"
    ko: "업계 표준 포트폴리오 만들기"
    vi: "Làm portfolio thiết kế đạt chuẩn ngành"
    ms: "Hasilkan portfolio reka bentuk standard industri"
    id: "Membuat portofolio desain standar industri"
    hi: "इंडस्ट्री-मानक डिज़ाइन पोर्टफ़ोलियो बनाना"
