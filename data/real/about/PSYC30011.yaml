code: PSYC30011
year: 2027
learn:
  en: "Using maths to model how people perceive, remember, decide and act, with deep dives into a few specific models."
  zh: "用数学模型描述人的感知、记忆、决策和行为，并深入几个具体模型。"
  zh-TW: "用數學模型描述人的知覺、記憶、決策和行為，並深入幾個具體模型。"
  ja: "知覚・記憶・意思決定・行動を数学でモデル化する方法を学び、いくつかのモデルを詳しく扱う。"
  ko: "지각, 기억, 의사결정, 행동을 수학으로 모델링하는 법을 배우고 몇몇 모델을 깊이 다룬다."
  vi: "Dùng toán học để mô hình hóa cách con người cảm nhận, ghi nhớ, ra quyết định và hành động, đi sâu vào một số mô hình cụ thể."
  ms: "Menggunakan matematik untuk memodelkan cara manusia mengamati, mengingat, membuat keputusan dan bertindak, dengan kajian mendalam beberapa model."
  id: "Memakai matematika untuk memodelkan cara orang mempersepsi, mengingat, memutuskan, dan bertindak, dengan pembahasan mendalam beberapa model."
  hi: "लोग कैसे महसूस करते, याद रखते, फ़ैसले लेते और काम करते हैं, इसे गणित से मॉडल करना, कुछ मॉडलों को गहराई से देखते हुए।"
outcomes:
  - en: "Describe the main mathematical approaches used in psychology"
    zh: "说明心理学中主要的数学建模方法"
    zh-TW: "說明心理學中主要的數學建模方法"
    ja: "心理学で使われる主な数理的アプローチを説明する"
    ko: "심리학에서 쓰이는 주요 수학적 접근 설명하기"
    vi: "Mô tả các cách tiếp cận toán học chính trong tâm lý học"
    ms: "Terangkan pendekatan matematik utama dalam psikologi"
    id: "Menjelaskan pendekatan matematis utama dalam psikologi"
    hi: "मनोविज्ञान में इस्तेमाल होने वाले मुख्य गणितीय तरीके बताना"
  - en: "Work through models of things like memory and response times"
    zh: "分析记忆、反应时间等现象的模型"
    zh-TW: "分析記憶、反應時間等現象的模型"
    ja: "記憶や反応時間などのモデルを読み解く"
    ko: "기억, 반응 시간 등의 모델 다루기"
    vi: "Phân tích các mô hình về trí nhớ, thời gian phản ứng và tương tự"
    ms: "Kaji model bagi perkara seperti ingatan dan masa tindak balas"
    id: "Membahas model untuk hal seperti memori dan waktu respons"
    hi: "याददाश्त और प्रतिक्रिया समय जैसी चीज़ों के मॉडल समझना"
