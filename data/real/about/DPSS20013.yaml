code: DPSS20013
year: 2026
learn:
  en: "Continue your two production specialisms at a higher level, preparing to lead them on real shows."
  zh: "在更高水平上继续两个制作方向，为在真实演出中负责做准备。"
  zh-TW: "在更高水準上繼續兩個製作方向，為在真實演出中負責做準備。"
  ja: "2つの制作分野をさらに上のレベルで続け、実際の公演で担当できるよう備える。"
  ko: "두 제작 분야를 더 높은 수준으로 이어가 실제 공연을 이끌 준비를 한다."
  vi: "Tiếp tục hai chuyên ngành ở mức cao hơn, chuẩn bị đảm nhận vở thật."
  ms: "Teruskan dua bidang produksi di tahap lebih tinggi untuk memimpin persembahan."
  id: "Melanjutkan dua bidang produksi ke tingkat lebih tinggi untuk memimpin pentas."
  hi: "दोनों प्रोडक्शन विषय आगे के स्तर पर, असली शो संभालने की तैयारी।"
outcomes:
  - en: "Apply advanced technique in two specialisms"
    zh: "在两个方向上运用进阶技术"
    zh-TW: "在兩個方向上運用進階技術"
    ja: "2分野で高度な技術を使う"
    ko: "두 분야에서 고급 기술 쓰기"
    vi: "Áp dụng kỹ thuật nâng cao"
    ms: "Guna teknik lanjutan dalam dua bidang"
    id: "Menerapkan teknik lanjutan"
    hi: "दो विषयों में उन्नत तकनीक लगाना"
  - en: "Solve technical problems in the studio"
    zh: "在工作室中解决技术问题"
    zh-TW: "在工作室中解決技術問題"
    ja: "スタジオで技術的な問題を解決する"
    ko: "스튜디오에서 기술 문제 해결하기"
    vi: "Giải quyết vấn đề kỹ thuật"
    ms: "Selesaikan masalah teknikal di studio"
    id: "Memecahkan masalah teknis di studio"
    hi: "स्टूडियो में तकनीकी समस्याएँ हल करना"
  - en: "Prepare to work independently in industry"
    zh: "为独立从业做准备"
    zh-TW: "為獨立從業做準備"
    ja: "独立して業界で働く準備をする"
    ko: "업계에서 독립적으로 일할 준비하기"
    vi: "Chuẩn bị làm việc độc lập"
    ms: "Bersedia bekerja sendiri dalam industri"
    id: "Bersiap bekerja mandiri di industri"
    hi: "उद्योग में स्वतंत्र काम की तैयारी"
