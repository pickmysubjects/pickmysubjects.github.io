code: GEOG20003
year: 2026
learn:
  en: "Who shapes climate, energy and resource politics in Australia and abroad, and the theories behind it."
  zh: "澳洲内外气候、能源与资源政治由谁主导，以及背后的理论。"
  zh-TW: "澳洲內外氣候、能源與資源政治由誰主導，以及背後的理論。"
  ja: "国内外の気候・エネルギー・資源の政治を誰が動かすか、その背景理論。"
  ko: "호주 안팎의 기후·에너지·자원 정치를 누가 움직이는지와 그 이론."
  vi: "Ai định hình chính trị khí hậu, năng lượng, tài nguyên ở Úc và thế giới, cùng lý thuyết phía sau."
  ms: "Siapa membentuk politik iklim, tenaga dan sumber di Australia dan luar negara, serta teorinya."
  id: "Siapa yang membentuk politik iklim, energi, dan sumber daya di Australia dan dunia, serta teorinya."
  hi: "ऑस्ट्रेलिया और दुनिया में जलवायु, ऊर्जा और संसाधन राजनीति कौन चलाता है, और इसके सिद्धांत।"
outcomes:
  - en: "Analyse actors and institutions in environmental politics"
    zh: "分析环境政治中的参与者与机构"
    zh-TW: "分析環境政治中的行動者與機構"
    ja: "環境政治の主体と制度を分析する"
    ko: "환경정치의 행위자와 제도 분석하기"
    vi: "Phân tích các bên và thể chế trong chính trị môi trường"
    ms: "Analisis pelaku dan institusi politik alam sekitar"
    id: "Menganalisis aktor dan institusi politik lingkungan"
    hi: "पर्यावरण राजनीति के पक्षों और संस्थाओं का विश्लेषण"
  - en: "Debate environmental issues in writing and speech"
    zh: "以书面和口头辩论环境议题"
    zh-TW: "以書面與口頭辯論環境議題"
    ja: "環境問題を文章と口頭で議論する"
    ko: "환경 문제를 글과 말로 토론하기"
    vi: "Tranh luận vấn đề môi trường bằng viết và nói"
    ms: "Bahas isu alam sekitar secara bertulis dan lisan"
    id: "Memperdebatkan isu lingkungan lisan dan tulisan"
    hi: "पर्यावरण मुद्दों पर लिखित और मौखिक बहस करना"
