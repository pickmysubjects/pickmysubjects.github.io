code: ACCT90008
year: 2027
learn:
  en: "Valuing companies from their financial statements with residual earnings, discounted cash flow and dividend models."
  zh: "用剩余收益、现金流折现和股利模型，根据财务报表给公司估值。"
  zh-TW: "用剩餘盈餘、現金流量折現與股利模型，根據財務報表評價公司。"
  ja: "残余利益・DCF・配当割引モデルで財務諸表から企業を評価する。"
  ko: "잔여이익, 현금흐름할인, 배당할인 모형으로 재무제표 기반 기업가치 평가."
  vi: "Định giá công ty từ báo cáo tài chính bằng thu nhập thặng dư, chiết khấu dòng tiền và mô hình cổ tức."
  ms: "Menilai syarikat daripada penyata kewangan dengan pendapatan baki, aliran tunai terdiskaun dan model dividen."
  id: "Menilai perusahaan dari laporan keuangan dengan residual earnings, arus kas terdiskonto, dan model dividen."
  hi: "रेज़िडुअल अर्निंग, डिस्काउंटेड कैश फ्लो और डिविडेंड मॉडल से वित्तीय विवरणों के आधार पर कंपनी मूल्यांकन।"
outcomes:
  - en: "Forecast a firm's future performance"
    zh: "预测企业未来业绩"
    zh-TW: "預測企業未來績效"
    ja: "企業の将来業績を予測する"
    ko: "기업의 미래 실적 예측하기"
    vi: "Dự báo kết quả hoạt động tương lai của doanh nghiệp"
    ms: "Meramal prestasi masa depan firma"
    id: "Meramalkan kinerja perusahaan di masa depan"
    hi: "कंपनी के भविष्य के प्रदर्शन का पूर्वानुमान"
  - en: "Value a listed company using accounting data"
    zh: "用会计数据给上市公司估值"
    zh-TW: "用會計資料評價上市公司"
    ja: "会計データで上場企業を評価する"
    ko: "회계 데이터로 상장기업 가치평가하기"
    vi: "Định giá công ty niêm yết bằng dữ liệu kế toán"
    ms: "Menilai syarikat tersenarai dengan data perakaunan"
    id: "Menilai perusahaan terbuka dengan data akuntansi"
    hi: "लेखा डेटा से सूचीबद्ध कंपनी का मूल्यांकन"
