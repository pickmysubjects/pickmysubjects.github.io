code: FINA30023
year: 2026
learn:
  en: "How stage sets and scenic devices shape space in performance, plus theatre spaces from different periods and found sites."
  zh: "布景和舞台装置如何在演出中塑造空间，并研究不同时期的剧场和非传统演出场地。"
  zh-TW: "布景與舞台裝置如何在演出中形塑空間，並研究不同時期的劇場與非傳統演出場地。"
  ja: "舞台装置が上演の空間をどう形づくるか。時代ごとの劇場や既存空間での上演も扱う。"
  ko: "무대 장치가 공연 공간을 어떻게 만드는지, 시대별 극장과 비전통 공연 공간도 다룬다."
  vi: "Cảnh trí và thiết bị sân khấu định hình không gian biểu diễn ra sao, cùng nhà hát các thời kỳ và địa điểm phi truyền thống."
  ms: "Cara set pentas dan peranti babak membentuk ruang persembahan, serta ruang teater pelbagai zaman dan tapak bukan tradisional."
  id: "Cara set panggung dan perangkat skenik membentuk ruang pertunjukan, plus teater berbagai zaman dan ruang nontradisional."
  hi: "स्टेज सेट और दृश्य उपकरण प्रदर्शन में स्पेस कैसे गढ़ते हैं, अलग युगों के थिएटर और गैर-पारंपरिक जगहें भी।"
outcomes:
  - en: "Use scenery to change and shape stage space"
    zh: "用布景改变和塑造舞台空间"
    zh-TW: "用布景改變並形塑舞台空間"
    ja: "舞台装置で空間を変化させる"
    ko: "무대 장치로 공간 바꾸고 만들기"
    vi: "Dùng cảnh trí để biến đổi không gian sân khấu"
    ms: "Guna set pentas untuk membentuk ruang"
    id: "Memakai set untuk membentuk ruang panggung"
    hi: "दृश्य-सज्जा से मंच स्पेस बदलना और गढ़ना"
  - en: "Compare theatre spaces across history"
    zh: "比较历史上不同的剧场空间"
    zh-TW: "比較歷史上不同的劇場空間"
    ja: "歴史上の劇場空間を比較する"
    ko: "역사 속 극장 공간 비교하기"
    vi: "So sánh không gian nhà hát qua các thời kỳ"
    ms: "Banding ruang teater sepanjang sejarah"
    id: "Membandingkan ruang teater dalam sejarah"
    hi: "इतिहास के अलग थिएटर स्पेस की तुलना"
  - en: "Design for site-specific and found spaces"
    zh: "为特定场地和非传统空间做设计"
    zh-TW: "為特定場域與非傳統空間做設計"
    ja: "特定の場所や既存空間のために設計する"
    ko: "장소 특정적·비전통 공간을 위해 디자인하기"
    vi: "Thiết kế cho không gian đặc thù và có sẵn"
    ms: "Reka untuk ruang khusus tapak dan sedia ada"
    id: "Mendesain untuk ruang site-specific"
    hi: "साइट-विशेष और मिली हुई जगहों के लिए डिज़ाइन"
