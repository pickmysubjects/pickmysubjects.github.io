code: GEND20010
year: 2026
learn:
  en: "How science and technology have shaped ideas of sex and gender, studied through feminist, queer and decolonial views of science."
  zh: "科学技术如何塑造对性与性别的观念，从女性主义、酷儿和去殖民科学观来看。"
  zh-TW: "科學技術如何塑造對性與性別的觀念，從女性主義、酷兒和去殖民科學觀來看。"
  ja: "科学技術が性とジェンダーの考え方をどう形づくってきたかを、フェミニズム・クィア・脱植民地の視点で学ぶ。"
  ko: "과학기술이 성과 젠더 관념을 어떻게 만들어 왔는지 페미니즘·퀴어·탈식민 과학관으로 배운다."
  vi: "Khoa học và công nghệ định hình quan niệm về giới tính và giới ra sao, qua góc nhìn nữ quyền, queer và giải thực dân."
  ms: "Cara sains dan teknologi membentuk idea tentang seks dan gender, melalui pandangan sains feminis, queer dan dekolonial."
  id: "Cara sains dan teknologi membentuk gagasan seks dan gender, lewat pandangan sains feminis, queer, dan dekolonial."
  hi: "विज्ञान और तकनीक ने लिंग और जेंडर की धारणाओं को कैसे गढ़ा, नारीवादी, क्वीयर और विऔपनिवेशिक नज़र से।"
outcomes:
  - en: "Explain feminist and queer views of science"
    zh: "解释女性主义与酷儿的科学观"
    zh-TW: "解釋女性主義與酷兒的科學觀"
    ja: "フェミニズムとクィアの科学観を説明する"
    ko: "페미니즘·퀴어 과학관 설명하기"
    vi: "Giải thích quan điểm nữ quyền và queer về khoa học"
    ms: "Terangkan pandangan feminis dan queer tentang sains"
    id: "Menjelaskan pandangan feminis dan queer tentang sains"
    hi: "विज्ञान पर नारीवादी और क्वीयर दृष्टि समझाना"
  - en: "Assess scientific claims about binary sex"
    zh: "评估关于二元性别的科学主张"
    zh-TW: "評估關於二元性別的科學主張"
    ja: "二元的な性をめぐる科学的主張を評価する"
    ko: "이분법적 성에 관한 과학적 주장 평가하기"
    vi: "Đánh giá các tuyên bố khoa học về giới tính nhị phân"
    ms: "Nilai dakwaan saintifik tentang seks binari"
    id: "Menilai klaim ilmiah tentang seks biner"
    hi: "द्विआधारी लिंग पर वैज्ञानिक दावों का आकलन करना"
  - en: "Discuss how technology can serve social goals"
    zh: "讨论技术如何服务于社会目标"
    zh-TW: "討論技術如何服務於社會目標"
    ja: "技術が社会的な目標にどう役立つか論じる"
    ko: "기술이 사회적 목표에 기여하는 방식 논의하기"
    vi: "Thảo luận công nghệ có thể phục vụ mục tiêu xã hội ra sao"
    ms: "Bincangkan cara teknologi boleh menyokong matlamat sosial"
    id: "Membahas cara teknologi dapat melayani tujuan sosial"
    hi: "तकनीक सामाजिक लक्ष्यों में कैसे काम आ सकती है, चर्चा करना"
