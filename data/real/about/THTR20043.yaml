code: THTR20043
year: 2026
learn:
  en: "Production design for film: how colour, composition and visual language add meaning and emotion to a story."
  zh: "电影美术设计：色彩、构图与视觉语言如何为故事增添意义与情感。"
  zh-TW: "電影美術設計：色彩、構圖與視覺語言如何為故事增添意義與情感。"
  ja: "映画の美術デザイン：色・構図・視覚言語が物語に意味と感情を加える方法。"
  ko: "영화 미술 디자인: 색·구도·시각 언어가 이야기에 의미와 감정을 더하는 방식."
  vi: "Thiết kế mỹ thuật phim: màu, bố cục và ngôn ngữ hình ảnh thêm ý nghĩa, cảm xúc cho câu chuyện."
  ms: "Reka bentuk produksi filem: cara warna, komposisi dan bahasa visual menambah makna dan emosi pada cerita."
  id: "Desain produksi film: cara warna, komposisi, dan bahasa visual menambah makna dan emosi pada cerita."
  hi: "फ़िल्म का प्रोडक्शन डिज़ाइन: रंग, कंपोज़िशन और दृश्य भाषा कहानी में अर्थ और भावना कैसे जोड़ते हैं।"
outcomes:
  - en: "Analyse design choices in films"
    zh: "分析电影中的设计选择"
    zh-TW: "分析電影中的設計選擇"
    ja: "映画の美術の選択を分析する"
    ko: "영화 속 디자인 선택 분석하기"
    vi: "Phân tích lựa chọn thiết kế trong phim"
    ms: "Analisis pilihan reka bentuk dalam filem"
    id: "Menganalisis pilihan desain dalam film"
    hi: "फ़िल्मों में डिज़ाइन के चुनाव का विश्लेषण"
  - en: "Explain the production designer's role"
    zh: "说明美术指导的职责"
    zh-TW: "說明美術指導的職責"
    ja: "美術監督の役割を説明する"
    ko: "프로덕션 디자이너의 역할 설명하기"
    vi: "Giải thích vai trò nhà thiết kế mỹ thuật"
    ms: "Jelaskan peranan pereka produksi"
    id: "Menjelaskan peran desainer produksi"
    hi: "प्रोडक्शन डिज़ाइनर की भूमिका समझाना"
  - en: "Develop a design concept for a script"
    zh: "为剧本发展设计概念"
    zh-TW: "為劇本發展設計概念"
    ja: "脚本のためのデザイン構想を練る"
    ko: "대본을 위한 디자인 콘셉트 발전시키기"
    vi: "Phát triển ý tưởng thiết kế cho kịch bản"
    ms: "Kembangkan konsep reka bentuk untuk skrip"
    id: "Mengembangkan konsep desain untuk naskah"
    hi: "किसी स्क्रिप्ट के लिए डिज़ाइन कॉन्सेप्ट बनाना"
