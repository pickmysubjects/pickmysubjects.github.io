code: CVEN90058
year: 2027
learn:
  en: "Planning how a project actually gets built: methods, temporary works, safety, cost, schedule and carbon."
  zh: "规划工程如何实际建成：施工方法、临时工程、安全、成本、工期和碳排放。"
  zh-TW: "規劃工程如何實際建成：施工方法、假設工程、安全、成本、工期與碳排放。"
  ja: "工事を実際にどう進めるかの計画：工法・仮設・安全・コスト・工程・炭素。"
  ko: "공사를 실제로 어떻게 진행할지 계획: 공법, 가설 공사, 안전, 원가, 공정, 탄소."
  vi: "Lập kế hoạch thi công thực tế: biện pháp, công trình tạm, an toàn, chi phí, tiến độ và carbon."
  ms: "Merancang cara projek dibina: kaedah, kerja sementara, keselamatan, kos, jadual dan karbon."
  id: "Merencanakan cara proyek dibangun: metode, pekerjaan sementara, keselamatan, biaya, jadwal dan karbon."
  hi: "परियोजना असल में कैसे बनेगी, इसकी योजना: तरीके, अस्थायी कार्य, सुरक्षा, लागत, समय-सारणी और कार्बन।"
outcomes:
  - en: "Compare construction methods on safety, cost, time and sustainability"
    zh: "从安全、成本、工期和可持续性比较施工方法"
    zh-TW: "從安全、成本、工期與永續性比較施工方法"
    ja: "工法を安全・コスト・工期・持続可能性で比較する"
    ko: "공법을 안전·원가·공기·지속가능성으로 비교하기"
    vi: "So sánh biện pháp thi công về an toàn, chi phí, thời gian và bền vững"
    ms: "Membandingkan kaedah pembinaan dari segi keselamatan, kos, masa dan kelestarian"
    id: "Membandingkan metode konstruksi dari sisi keselamatan, biaya, waktu dan keberlanjutan"
    hi: "निर्माण विधियों की सुरक्षा, लागत, समय और स्थिरता के आधार पर तुलना"
  - en: "Plan construction sequence, temporary works and equipment"
    zh: "规划施工顺序、临时工程和设备"
    zh-TW: "規劃施工順序、假設工程與機具"
    ja: "施工順序・仮設工事・機械を計画する"
    ko: "시공 순서, 가설 공사, 장비 계획하기"
    vi: "Lập trình tự thi công, công trình tạm và thiết bị"
    ms: "Merancang urutan pembinaan, kerja sementara dan peralatan"
    id: "Merencanakan urutan konstruksi, pekerjaan sementara dan peralatan"
    hi: "निर्माण क्रम, अस्थायी कार्य और उपकरणों की योजना"
  - en: "Justify recommendations with drawings, reports and talks"
    zh: "用图纸、报告和口头汇报论证建议"
    zh-TW: "以圖說、報告與口頭簡報論證建議"
    ja: "図面・報告書・発表で提案の根拠を示す"
    ko: "도면·보고서·발표로 제안 근거 제시하기"
    vi: "Bảo vệ đề xuất bằng bản vẽ, báo cáo và thuyết trình"
    ms: "Mewajarkan cadangan dengan lukisan, laporan dan pembentangan"
    id: "Membenarkan rekomendasi dengan gambar, laporan dan presentasi"
    hi: "ड्रॉइंग, रिपोर्ट और प्रस्तुति से सिफ़ारिशों को सही ठहराना"
