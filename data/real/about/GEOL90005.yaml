code: GEOL90005
year: 2027
learn:
  en: "Groundwater flow and chemistry, aquifers and water-rock reactions, with a one-week field trip and lab methods."
  zh: "地下水流动与化学、含水层和水岩反应，含一周野外考察和实验方法。"
  zh-TW: "地下水流動與化學、含水層和水岩反應，含一週野外考察和實驗方法。"
  ja: "地下水の流れと化学、帯水層、水と岩の反応。1週間の野外調査と実験手法を含む。"
  ko: "지하수 흐름과 화학, 대수층, 물-암석 반응, 1주 야외 답사와 실험 방법 포함."
  vi: "Dòng chảy và hóa học nước ngầm, tầng chứa nước, phản ứng nước-đá, kèm một tuần thực địa và phương pháp thí nghiệm."
  ms: "Aliran dan kimia air bawah tanah, akuifer dan tindak balas air-batuan, dengan lawatan lapangan seminggu dan kaedah makmal."
  id: "Aliran dan kimia air tanah, akuifer, dan reaksi air-batuan, dengan kunjungan lapangan seminggu dan metode lab."
  hi: "भूजल प्रवाह और रसायन, जलभृत और जल-चट्टान अभिक्रियाएँ, एक सप्ताह की फ़ील्ड यात्रा और प्रयोगशाला विधियों के साथ।"
outcomes:
  - en: "Sample water bores and analyse water in the field"
    zh: "在野外采集井水样并分析水质"
    zh-TW: "在野外採集井水樣並分析水質"
    ja: "野外で井戸水を採取・分析する"
    ko: "현장에서 관정 시료 채취·수질 분석하기"
    vi: "Lấy mẫu giếng và phân tích nước tại thực địa"
    ms: "Mengambil sampel telaga dan menganalisis air di lapangan"
    id: "Mengambil sampel sumur dan menganalisis air di lapangan"
    hi: "फ़ील्ड में बोरवेल नमूने लेना और पानी का विश्लेषण"
  - en: "Predict how water composition changes underground"
    zh: "预测地下水成分的变化"
    zh-TW: "預測地下水成分的變化"
    ja: "地下で水質がどう変わるか予測する"
    ko: "지하에서 수질 변화 예측하기"
    vi: "Dự đoán thay đổi thành phần nước dưới đất"
    ms: "Meramal perubahan komposisi air bawah tanah"
    id: "Memprediksi perubahan komposisi air di bawah tanah"
    hi: "भूमिगत पानी की संरचना में बदलाव का अनुमान"
