code: IBUS90003
year: 2027
learn:
  en: "Why multinationals exist, how they balance global integration with local needs, and global value chains."
  zh: "跨国企业为何存在、如何平衡全球整合与本地需求，以及全球价值链。"
  zh-TW: "跨國企業為何存在、如何平衡全球整合與在地需求，以及全球價值鏈。"
  ja: "多国籍企業が存在する理由、グローバル統合と現地適応の両立、グローバル・バリューチェーン。"
  ko: "다국적기업이 존재하는 이유, 글로벌 통합과 현지 대응의 균형, 글로벌 가치사슬."
  vi: "Vì sao có công ty đa quốc gia, cách cân bằng hội nhập toàn cầu với nhu cầu địa phương, chuỗi giá trị toàn cầu."
  ms: "Mengapa syarikat multinasional wujud, cara mengimbangi integrasi global dengan keperluan tempatan, dan rantaian nilai global."
  id: "Mengapa perusahaan multinasional ada, cara menyeimbangkan integrasi global dan kebutuhan lokal, serta rantai nilai global."
  hi: "बहुराष्ट्रीय कंपनियाँ क्यों होती हैं, वैश्विक एकीकरण और स्थानीय ज़रूरतों का संतुलन, और वैश्विक मूल्य शृंखलाएँ।"
outcomes:
  - en: "Explain the main issues multinationals face"
    zh: "解释跨国企业面临的主要问题"
    zh-TW: "解釋跨國企業面臨的主要問題"
    ja: "多国籍企業が直面する主な課題を説明する"
    ko: "다국적기업이 직면한 주요 쟁점 설명하기"
    vi: "Giải thích các vấn đề chính của công ty đa quốc gia"
    ms: "Menerangkan isu utama syarikat multinasional"
    id: "Menjelaskan isu utama perusahaan multinasional"
    hi: "बहुराष्ट्रीय कंपनियों के मुख्य मुद्दे समझाना"
  - en: "Analyse a multinational's global strategy"
    zh: "分析跨国企业的全球战略"
    zh-TW: "分析跨國企業的全球策略"
    ja: "多国籍企業のグローバル戦略を分析する"
    ko: "다국적기업의 글로벌 전략 분석하기"
    vi: "Phân tích chiến lược toàn cầu của công ty đa quốc gia"
    ms: "Menganalisis strategi global syarikat multinasional"
    id: "Menganalisis strategi global perusahaan multinasional"
    hi: "बहुराष्ट्रीय कंपनी की वैश्विक रणनीति का विश्लेषण"
