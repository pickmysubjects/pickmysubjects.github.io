code: KORE10004
year: 2026
learn:
  en: "After Korean 3: Korean history, economic growth, careers and gender, through news, media, short essays and discussion."
  zh: "学完韩语 3 后：通过新闻、媒体、短文写作和讨论了解韩国历史、经济发展、职业与性别议题。"
  zh-TW: "學完韓語 3 後：透過新聞、媒體、短文寫作和討論了解韓國歷史、經濟發展、職業與性別議題。"
  ja: "韓国語3の続き。ニュース、メディア、短い論説文、討論で韓国の歴史、経済発展、仕事、ジェンダーを扱う。"
  ko: "한국어 3 다음 단계. 뉴스, 미디어, 짧은 비평문, 토론으로 한국 역사, 경제 발전, 진로, 젠더를 다룬다."
  vi: "Sau Korean 3: lịch sử, phát triển kinh tế, nghề nghiệp và giới ở Hàn Quốc qua tin tức, truyền thông, bài luận ngắn, thảo luận."
  ms: "Selepas Korean 3: sejarah, pembangunan ekonomi, kerjaya dan gender Korea melalui berita, media, esei pendek dan perbincangan."
  id: "Setelah Korean 3: sejarah, pembangunan ekonomi, karier dan gender Korea lewat berita, media, esai pendek dan diskusi."
  hi: "Korean 3 के बाद: ख़बरों, मीडिया, छोटे निबंधों और चर्चा से कोरिया का इतिहास, आर्थिक विकास, करियर और जेंडर।"
outcomes:
  - en: "Talk about familiar topics in Korean with more confidence"
    zh: "更自信地用韩语谈论熟悉的话题"
    zh-TW: "更自信地用韓語談論熟悉的話題"
    ja: "身近な話題を韓国語でより自信を持って話す"
    ko: "익숙한 주제를 한국어로 더 자신 있게 말하기"
    vi: "Nói về chủ đề quen thuộc bằng tiếng Hàn tự tin hơn"
    ms: "Bercakap tentang topik biasa dalam bahasa Korea dengan lebih yakin"
    id: "Membicarakan topik akrab dalam bahasa Korea dengan lebih percaya diri"
    hi: "परिचित विषयों पर कोरियाई में ज़्यादा आत्मविश्वास से बात करना"
  - en: "Read and write short Korean texts"
    zh: "读写简短的韩语文章"
    zh-TW: "讀寫簡短的韓語文章"
    ja: "短い韓国語の文章を読み書きする"
    ko: "짧은 한국어 글 읽고 쓰기"
    vi: "Đọc và viết đoạn văn tiếng Hàn ngắn"
    ms: "Baca dan tulis teks pendek bahasa Korea"
    id: "Membaca dan menulis teks pendek bahasa Korea"
    hi: "छोटे कोरियाई पाठ पढ़ना-लिखना"
  - en: "Use new grammar and vocabulary correctly"
    zh: "正确运用新语法和词汇"
    zh-TW: "正確運用新文法和詞彙"
    ja: "新しい文法と語彙を正しく使う"
    ko: "새 문법과 어휘를 정확히 쓰기"
    vi: "Dùng đúng ngữ pháp và từ vựng mới"
    ms: "Guna tatabahasa dan kosa kata baharu dengan betul"
    id: "Memakai tata bahasa dan kosakata baru dengan benar"
    hi: "नया व्याकरण और शब्दावली सही इस्तेमाल करना"
