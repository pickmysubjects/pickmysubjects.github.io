code: CHEN90007
year: 2027
learn:
  en: "The laws of thermodynamics applied to phases, mixtures, chemical reactions and interfaces."
  zh: "把热力学定律用于相、混合物、化学反应和界面。"
  zh-TW: "把熱力學定律用於相、混合物、化學反應與界面。"
  ja: "熱力学の法則を相・混合物・化学反応・界面に使う。"
  ko: "열역학 법칙을 상, 혼합물, 화학 반응, 계면에 적용하기."
  vi: "Áp dụng các định luật nhiệt động lực học cho pha, hỗn hợp, phản ứng và bề mặt phân cách."
  ms: "Hukum termodinamik untuk fasa, campuran, tindak balas kimia dan antara muka."
  id: "Hukum termodinamika untuk fase, campuran, reaksi kimia, dan antarmuka."
  hi: "प्रावस्थाओं, मिश्रणों, रासायनिक अभिक्रियाओं और इंटरफ़ेस पर ऊष्मागतिकी के नियम।"
outcomes:
  - en: "Apply the laws of thermodynamics to open and closed systems"
    zh: "把热力学定律用于开放和封闭系统"
    zh-TW: "把熱力學定律用於開放與封閉系統"
    ja: "開いた系と閉じた系に熱力学の法則を使う"
    ko: "열린계와 닫힌계에 열역학 법칙 적용하기"
    vi: "Áp dụng định luật nhiệt động cho hệ mở và hệ kín"
    ms: "Menggunakan hukum termodinamik pada sistem terbuka dan tertutup"
    id: "Menerapkan hukum termodinamika pada sistem terbuka dan tertutup"
    hi: "खुले और बंद तंत्रों पर ऊष्मागतिकी के नियम लागू करना"
  - en: "Estimate properties of non-ideal mixtures"
    zh: "估算非理想混合物的性质"
    zh-TW: "估算非理想混合物的性質"
    ja: "非理想混合物の物性を推算する"
    ko: "비이상 혼합물의 물성 추정하기"
    vi: "Ước tính tính chất của hỗn hợp không lý tưởng"
    ms: "Menganggar sifat campuran tidak unggul"
    id: "Memperkirakan sifat campuran non-ideal"
    hi: "अनादर्श मिश्रणों के गुणों का अनुमान"
  - en: "Predict phase and reaction equilibria"
    zh: "预测相平衡和反应平衡"
    zh-TW: "預測相平衡與反應平衡"
    ja: "相平衡と反応平衡を予測する"
    ko: "상평형과 반응 평형 예측하기"
    vi: "Dự đoán cân bằng pha và cân bằng phản ứng"
    ms: "Meramal keseimbangan fasa dan tindak balas"
    id: "Memprediksi kesetimbangan fase dan reaksi"
    hi: "प्रावस्था और अभिक्रिया साम्य का अनुमान"
