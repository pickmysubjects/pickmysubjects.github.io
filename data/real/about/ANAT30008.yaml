code: ANAT30008
year: 2026
learn:
  en: "Anatomy of the internal organs in the head and neck, chest, abdomen and pelvis, including cadaver dissection."
  zh: "头颈、胸、腹和盆腔内脏的解剖，包括尸体解剖。"
  zh-TW: "頭頸、胸、腹和骨盆腔內臟的解剖，包括大體解剖。"
  ja: "頭頸部・胸部・腹部・骨盤の内臓の解剖。献体の解剖実習を含む。"
  ko: "머리·목, 가슴, 배, 골반 내장의 해부. 카데바 해부 포함."
  vi: "Giải phẫu nội tạng vùng đầu cổ, ngực, bụng và chậu, có phẫu tích tử thi."
  ms: "Anatomi organ dalaman kepala dan leher, dada, abdomen dan pelvis, termasuk pembedahan kadaver."
  id: "Anatomi organ dalam kepala-leher, dada, perut, dan panggul, termasuk diseksi kadaver."
  hi: "सिर-गर्दन, छाती, पेट और पेल्विस के अंदरूनी अंगों की एनाटॉमी, कैडेवर डिसेक्शन समेत।"
outcomes:
  - en: "Dissect a cadaver to expose internal organs"
    zh: "解剖尸体，暴露内脏"
    zh-TW: "解剖大體，暴露內臟"
    ja: "献体を解剖して内臓を出す"
    ko: "카데바를 해부해 내장 드러내기"
    vi: "Phẫu tích tử thi để bộc lộ nội tạng"
    ms: "Bedah kadaver untuk mendedahkan organ dalaman"
    id: "Membedah kadaver untuk membuka organ dalam"
    hi: "अंदरूनी अंग दिखाने के लिए कैडेवर डिसेक्ट करना"
  - en: "Identify organs on specimens and medical images"
    zh: "在标本和影像上认出器官"
    zh-TW: "在標本和影像上認出器官"
    ja: "標本と医用画像で臓器を見分ける"
    ko: "표본과 의료 영상에서 장기 식별하기"
    vi: "Nhận diện cơ quan trên mẫu và ảnh y khoa"
    ms: "Kenal pasti organ pada spesimen dan imej perubatan"
    id: "Mengenali organ pada spesimen dan citra medis"
    hi: "नमूनों और मेडिकल इमेज में अंग पहचानना"
  - en: "Explain the clinical relevance of body regions"
    zh: "说明各部位的临床意义"
    zh-TW: "說明各部位的臨床意義"
    ja: "各部位の臨床的な意味を説明する"
    ko: "신체 부위의 임상적 의미 설명하기"
    vi: "Giải thích ý nghĩa lâm sàng của các vùng cơ thể"
    ms: "Terangkan kaitan klinikal bahagian badan"
    id: "Menjelaskan relevansi klinis bagian tubuh"
    hi: "शरीर के हिस्सों का क्लिनिकल महत्व समझाना"
