code: PLAN20002
year: 2026
learn:
  en: "Urban design for public life: how a city's form and spaces shape, and are shaped by, the people who use them."
  zh: "面向公共生活的城市设计：城市形态与空间如何影响使用者，又被使用者塑造。"
  zh-TW: "面向公共生活的都市設計：城市形態與空間如何影響使用者，又被使用者塑造。"
  ja: "公共の暮らしのための都市デザイン：都市の形と空間が人をどう形づくり、人にどう形づくられるか。"
  ko: "공공 생활을 위한 도시설계: 도시의 형태와 공간이 사람을 만들고 또 사람에 의해 만들어지는 방식."
  vi: "Thiết kế đô thị cho đời sống công cộng: hình thái và không gian thành phố tác động qua lại với người dùng."
  ms: "Reka bentuk bandar untuk kehidupan awam: cara bentuk dan ruang bandar membentuk, dan dibentuk oleh, penggunanya."
  id: "Desain kota untuk kehidupan publik: cara bentuk dan ruang kota membentuk, dan dibentuk oleh, penggunanya."
  hi: "सार्वजनिक जीवन के लिए अर्बन डिज़ाइन: शहर का रूप और स्पेस लोगों को कैसे गढ़ते और उनसे गढ़े जाते हैं।"
outcomes:
  - en: "Analyse how people use a public space"
    zh: "分析人们如何使用公共空间"
    zh-TW: "分析人們如何使用公共空間"
    ja: "人々の公共空間の使い方を分析する"
    ko: "사람들이 공공공간을 쓰는 방식 분석하기"
    vi: "Phân tích cách người dân dùng không gian công cộng"
    ms: "Analisis cara orang guna ruang awam"
    id: "Menganalisis cara orang memakai ruang publik"
    hi: "लोग सार्वजनिक स्पेस कैसे इस्तेमाल करते हैं, विश्लेषण"
  - en: "Propose an urban design for a site"
    zh: "为场地提出城市设计方案"
    zh-TW: "為基地提出都市設計方案"
    ja: "敷地の都市デザイン案を出す"
    ko: "부지에 대한 도시설계안 제안하기"
    vi: "Đề xuất thiết kế đô thị cho một khu đất"
    ms: "Cadang reka bentuk bandar untuk satu tapak"
    id: "Mengusulkan desain kota untuk suatu tapak"
    hi: "किसी साइट के लिए अर्बन डिज़ाइन प्रस्ताव देना"
  - en: "Work with others on a shared design"
    zh: "与他人合作完成共同设计"
    zh-TW: "與他人合作完成共同設計"
    ja: "共同で設計に取り組む"
    ko: "다른 사람과 함께 설계하기"
    vi: "Hợp tác với người khác trong thiết kế chung"
    ms: "Bekerjasama dalam reka bentuk bersama"
    id: "Bekerja sama dalam desain bersama"
    hi: "दूसरों के साथ मिलकर डिज़ाइन करना"
