code: CVEN90076
year: 2027
learn:
  en: "Python, data processing, numerical methods and machine learning applied to geotechnical and civil engineering problems."
  zh: "用 Python、数据处理、数值方法和机器学习解决岩土与土木工程问题。"
  zh-TW: "用 Python、資料處理、數值方法和機器學習解決大地與土木工程問題。"
  ja: "Python、データ処理、数値解析、機械学習を地盤・土木工学の問題に応用する。"
  ko: "Python, 데이터 처리, 수치해석, 머신러닝을 지반·토목 공학 문제에 적용."
  vi: "Python, xử lý dữ liệu, phương pháp số và học máy cho các bài toán địa kỹ thuật và xây dựng."
  ms: "Python, pemprosesan data, kaedah berangka dan pembelajaran mesin untuk masalah geoteknik dan kejuruteraan awam."
  id: "Python, pengolahan data, metode numerik, dan machine learning untuk masalah geoteknik dan teknik sipil."
  hi: "भू-तकनीकी और सिविल इंजीनियरिंग समस्याओं के लिए Python, डेटा प्रोसेसिंग, संख्यात्मक विधियाँ और मशीन लर्निंग।"
outcomes:
  - en: "Write computational programs in Python"
    zh: "用 Python 编写计算程序"
    zh-TW: "用 Python 撰寫計算程式"
    ja: "Python で計算プログラムを書く"
    ko: "Python으로 계산 프로그램 작성하기"
    vi: "Viết chương trình tính toán bằng Python"
    ms: "Menulis program pengiraan dalam Python"
    id: "Menulis program komputasi dengan Python"
    hi: "Python में गणनात्मक प्रोग्राम लिखना"
  - en: "Process, visualise and statistically analyse data"
    zh: "处理、可视化和统计分析数据"
    zh-TW: "處理、視覺化和統計分析資料"
    ja: "データを処理・可視化・統計分析する"
    ko: "데이터 처리, 시각화, 통계 분석하기"
    vi: "Xử lý, trực quan hóa và phân tích thống kê dữ liệu"
    ms: "Memproses, menggambarkan dan menganalisis data secara statistik"
    id: "Mengolah, memvisualkan, dan menganalisis data secara statistik"
    hi: "डेटा को प्रोसेस, विज़ुअलाइज़ और सांख्यिकीय विश्लेषण करना"
  - en: "Build ML models for classification and prediction"
    zh: "构建用于分类和预测的机器学习模型"
    zh-TW: "建立用於分類和預測的機器學習模型"
    ja: "分類・予測の機械学習モデルを作る"
    ko: "분류·예측용 머신러닝 모델 만들기"
    vi: "Xây dựng mô hình học máy để phân loại và dự đoán"
    ms: "Membina model ML untuk pengelasan dan ramalan"
    id: "Membangun model ML untuk klasifikasi dan prediksi"
    hi: "वर्गीकरण और पूर्वानुमान के लिए ML मॉडल बनाना"
