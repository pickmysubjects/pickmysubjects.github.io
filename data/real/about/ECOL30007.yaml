code: ECOL30007
year: 2026
learn:
  en: "The diversity of ocean life, where it lives, and how ecology and evolution shape marine ecosystems."
  zh: "海洋生物的多样性与分布，以及生态与进化如何塑造海洋生态系统。"
  zh-TW: "海洋生物的多樣性與分布，以及生態與演化如何塑造海洋生態系。"
  ja: "海の生物多様性と分布、そして生態と進化が海洋生態系をどう形づくるか。"
  ko: "바다 생물의 다양성과 분포, 생태와 진화가 해양 생태계를 만드는 방식."
  vi: "Sự đa dạng sinh vật biển, nơi chúng sống, và cách sinh thái, tiến hóa định hình hệ sinh thái biển."
  ms: "Kepelbagaian hidupan laut, taburannya, dan cara ekologi serta evolusi membentuk ekosistem marin."
  id: "Keragaman kehidupan laut, sebarannya, dan bagaimana ekologi serta evolusi membentuk ekosistem laut."
  hi: "समुद्री जीवन की विविधता, उसका फैलाव, और इकोलॉजी व विकास समुद्री इकोसिस्टम को कैसे आकार देते हैं।"
outcomes:
  - en: "Identify major groups of marine organisms"
    zh: "识别主要海洋生物类群"
    zh-TW: "辨識主要海洋生物類群"
    ja: "主な海洋生物群を同定する"
    ko: "주요 해양 생물군 식별하기"
    vi: "Nhận dạng các nhóm sinh vật biển chính"
    ms: "Mengenal pasti kumpulan utama organisma laut"
    id: "Mengenali kelompok utama organisme laut"
    hi: "मुख्य समुद्री जीव समूह पहचानना"
  - en: "Design a marine biology experiment"
    zh: "设计海洋生物学实验"
    zh-TW: "設計海洋生物學實驗"
    ja: "海洋生物学の実験を設計する"
    ko: "해양생물학 실험 설계하기"
    vi: "Thiết kế thí nghiệm sinh học biển"
    ms: "Mereka bentuk eksperimen biologi marin"
    id: "Merancang eksperimen biologi laut"
    hi: "समुद्री जीवविज्ञान प्रयोग डिज़ाइन करना"
  - en: "Find gaps in marine research literature"
    zh: "找出海洋研究文献的空白"
    zh-TW: "找出海洋研究文獻的缺口"
    ja: "海洋研究の未解明点を見つける"
    ko: "해양 연구 문헌의 공백 찾기"
    vi: "Tìm khoảng trống trong tài liệu nghiên cứu biển"
    ms: "Mencari jurang dalam literatur kajian marin"
    id: "Menemukan celah dalam literatur riset laut"
    hi: "समुद्री शोध साहित्य में कमियाँ खोजना"
