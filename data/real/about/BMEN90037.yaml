code: BMEN90037
year: 2027
learn:
  en: "Probability, hypothesis tests, regression and classification applied to biomedical data."
  zh: "把概率、假设检验、回归和分类方法用于生物医学数据。"
  zh-TW: "把機率、假設檢定、迴歸與分類方法用於生醫資料。"
  ja: "確率、仮説検定、回帰、分類を生体医工学データに使う。"
  ko: "확률, 가설 검정, 회귀, 분류를 의공학 데이터에 적용하기."
  vi: "Xác suất, kiểm định giả thuyết, hồi quy và phân loại áp dụng cho dữ liệu y sinh."
  ms: "Kebarangkalian, ujian hipotesis, regresi dan pengelasan untuk data bioperubatan."
  id: "Probabilitas, uji hipotesis, regresi, dan klasifikasi untuk data biomedis."
  hi: "बायोमेडिकल डेटा पर प्रायिकता, परिकल्पना परीक्षण, रिग्रेशन और वर्गीकरण।"
outcomes:
  - en: "Run hypothesis tests on biomedical datasets"
    zh: "对生物医学数据集做假设检验"
    zh-TW: "對生醫資料集做假設檢定"
    ja: "生体医工学データで仮説検定を行う"
    ko: "의공학 데이터셋으로 가설 검정하기"
    vi: "Thực hiện kiểm định giả thuyết trên dữ liệu y sinh"
    ms: "Menjalankan ujian hipotesis pada set data bioperubatan"
    id: "Melakukan uji hipotesis pada data biomedis"
    hi: "बायोमेडिकल डेटासेट पर परिकल्पना परीक्षण करना"
  - en: "Fit linear and nonlinear models to data"
    zh: "用线性和非线性模型拟合数据"
    zh-TW: "用線性與非線性模型擬合資料"
    ja: "線形・非線形モデルをデータに当てはめる"
    ko: "선형·비선형 모델로 데이터 적합하기"
    vi: "Khớp mô hình tuyến tính và phi tuyến với dữ liệu"
    ms: "Memadankan model linear dan tak linear pada data"
    id: "Mencocokkan model linear dan nonlinear ke data"
    hi: "डेटा पर रैखिक और अरैखिक मॉडल फ़िट करना"
  - en: "Apply classifiers and PCA to datasets"
    zh: "对数据集应用分类器和主成分分析"
    zh-TW: "對資料集應用分類器與主成分分析"
    ja: "データに分類器と PCA を使う"
    ko: "데이터에 분류기와 PCA 적용하기"
    vi: "Áp dụng bộ phân loại và PCA cho dữ liệu"
    ms: "Menggunakan pengelas dan PCA pada data"
    id: "Menerapkan classifier dan PCA ke data"
    hi: "डेटासेट पर क्लासिफ़ायर और PCA लागू करना"
