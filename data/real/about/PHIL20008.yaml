code: PHIL20008
year: 2026
learn:
  en: "The three main families of ethical theory, starting with utilitarianism, and what makes actions right or wrong."
  zh: "伦理学的三大理论流派，从功利主义开始，探讨行为对错的依据。"
  zh-TW: "倫理學的三大理論流派，從效益主義開始，探討行為對錯的依據。"
  ja: "功利主義から始めて倫理学の三つの主要理論と、行為の正しさ・誤りの根拠を学ぶ。"
  ko: "공리주의부터 시작해 윤리학의 세 가지 주요 이론과 행위의 옳고 그름을 배운다."
  vi: "Ba nhóm lý thuyết đạo đức chính, bắt đầu từ chủ nghĩa vị lợi, và điều gì làm hành động đúng hay sai."
  ms: "Tiga keluarga utama teori etika, bermula dengan utilitarianisme, dan apa yang menjadikan tindakan betul atau salah."
  id: "Tiga keluarga utama teori etika, dimulai dari utilitarianisme, dan apa yang membuat tindakan benar atau salah."
  hi: "नैतिक सिद्धांत के तीन मुख्य परिवार, उपयोगितावाद से शुरू करके, और कोई काम सही या गलत क्यों होता है।"
outcomes:
  - en: "Explain the three main types of ethical theory"
    zh: "说明三种主要的伦理学理论"
    zh-TW: "說明三種主要的倫理學理論"
    ja: "三つの主な倫理理論を説明する"
    ko: "세 가지 주요 윤리 이론 설명하기"
    vi: "Giải thích ba loại lý thuyết đạo đức chính"
    ms: "Terangkan tiga jenis utama teori etika"
    id: "Menjelaskan tiga jenis utama teori etika"
    hi: "नैतिक सिद्धांत के तीन मुख्य प्रकार समझाना"
  - en: "Assess objections to each theory"
    zh: "评估针对每种理论的反驳"
    zh-TW: "評估針對每種理論的反駁"
    ja: "各理論への反論を評価する"
    ko: "각 이론에 대한 반론 평가하기"
    vi: "Đánh giá các phản bác với từng lý thuyết"
    ms: "Nilai bantahan terhadap setiap teori"
    id: "Menilai keberatan terhadap tiap teori"
    hi: "हर सिद्धांत पर आपत्तियों को परखना"
  - en: "Write clear arguments on moral questions"
    zh: "就道德问题写出清晰的论证"
    zh-TW: "就道德問題寫出清晰的論證"
    ja: "道徳的な問いについて明快な議論を書く"
    ko: "도덕 문제에 관한 명확한 논증 쓰기"
    vi: "Viết lập luận rõ ràng về các câu hỏi đạo đức"
    ms: "Tulis hujah jelas tentang persoalan moral"
    id: "Menulis argumen yang jelas tentang soal moral"
    hi: "नैतिक सवालों पर साफ़ तर्क लिखना"
