code: PATH20001
year: 2026
learn:
  en: "Where disease comes from: injury, inflammation, infection, immunity, blood vessel disease and cancer."
  zh: "疾病从哪来：损伤、炎症、感染、免疫、血管病和癌症。"
  zh-TW: "疾病從哪來：損傷、發炎、感染、免疫、血管疾病和癌症。"
  ja: "病気の原因：損傷、炎症、感染、免疫、血管の病気、がん。"
  ko: "질병의 원인: 손상, 염증, 감염, 면역, 혈관 질환, 암."
  vi: "Bệnh từ đâu ra: tổn thương, viêm, nhiễm trùng, miễn dịch, bệnh mạch máu và ung thư."
  ms: "Punca penyakit: kecederaan, keradangan, jangkitan, imuniti, penyakit salur darah dan kanser."
  id: "Asal penyakit: cedera, peradangan, infeksi, imunitas, penyakit pembuluh darah, dan kanker."
  hi: "बीमारी कहाँ से आती है: चोट, सूजन, संक्रमण, इम्यूनिटी, रक्त वाहिका रोग और कैंसर।"
outcomes:
  - en: "Describe how a disease starts, develops and resolves"
    zh: "说清疾病怎么开始、发展和好转"
    zh-TW: "說清楚疾病怎麼開始、發展和好轉"
    ja: "病気の始まり・進行・回復を説明する"
    ko: "질병이 시작되고 진행되고 회복되는 과정 설명하기"
    vi: "Mô tả bệnh bắt đầu, tiến triển và khỏi ra sao"
    ms: "Menghuraikan cara penyakit bermula, berkembang dan pulih"
    id: "Menjelaskan cara penyakit mulai, berkembang, dan sembuh"
    hi: "बीमारी कैसे शुरू होती, बढ़ती और ठीक होती है"
  - en: "Explain how damaged cells lead to disease"
    zh: "解释细胞受损怎么导致疾病"
    zh-TW: "解釋細胞受損怎麼導致疾病"
    ja: "細胞の損傷が病気につながる仕組みを説明する"
    ko: "손상된 세포가 질병으로 이어지는 방식 설명하기"
    vi: "Giải thích tế bào tổn thương dẫn đến bệnh ra sao"
    ms: "Menerangkan cara sel rosak membawa kepada penyakit"
    id: "Menjelaskan cara sel rusak menyebabkan penyakit"
    hi: "क्षतिग्रस्त कोशिकाएँ बीमारी तक कैसे ले जाती हैं"
  - en: "Use the right scientific terms to talk about disease"
    zh: "用准确的术语讨论疾病"
    zh-TW: "用正確的術語討論疾病"
    ja: "正しい科学用語で病気について話す"
    ko: "올바른 과학 용어로 질병 이야기하기"
    vi: "Dùng đúng thuật ngữ khoa học khi nói về bệnh"
    ms: "Menggunakan istilah saintifik yang betul tentang penyakit"
    id: "Memakai istilah ilmiah yang tepat untuk membahas penyakit"
    hi: "बीमारी पर सही वैज्ञानिक शब्दों में बात करना"
