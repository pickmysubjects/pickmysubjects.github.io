code: PATH20001
year: 2026
learn:
  en: "Where disease comes from: injury, inflammation, infection, immunity, blood vessel disease and cancer."
  zh: "疾病从哪来：损伤、炎症、感染、免疫、血管病和癌症。"
outcomes:
  - en: "Describe how a disease starts, develops and resolves"
    zh: "说清疾病怎么开始、发展和好转"
  - en: "Explain how damaged cells lead to disease"
    zh: "解释细胞受损怎么导致疾病"
  - en: "Use the right scientific terms to talk about disease"
    zh: "用准确的术语讨论疾病"
