code: SCIE10010
year: 2026
learn:
  en: "Hands-on science skills: lab and field safety, writing short reports, ethics, and a practical exam to finish."
  zh: "动手的科学技能：实验室与野外安全、写简短报告、科研伦理，最后有实操考试。"
  zh-TW: "動手的科學技能：實驗室與野外安全、寫簡短報告、科研倫理，最後有實作考試。"
  ja: "実践的な科学スキル：実験・野外の安全、短いレポート、倫理、最後に実技試験。"
  ko: "실습 과학 기술: 실험실·현장 안전, 짧은 보고서, 윤리, 마지막 실기 시험."
  vi: "Kỹ năng khoa học thực hành: an toàn lab và thực địa, viết báo cáo, đạo đức, thi thực hành."
  ms: "Kemahiran sains praktikal: keselamatan makmal, laporan ringkas, etika dan peperiksaan amali."
  id: "Keterampilan sains praktis: keselamatan lab, laporan singkat, etika, ujian praktik."
  hi: "व्यावहारिक विज्ञान कौशल: लैब सुरक्षा, छोटी रिपोर्ट, नैतिकता और प्रैक्टिकल परीक्षा।"
outcomes:
  - en: "Work safely in the lab and the field"
    zh: "在实验室和野外安全操作"
    zh-TW: "在實驗室與野外安全操作"
    ja: "実験室と野外で安全に作業する"
    ko: "실험실과 현장에서 안전하게 작업하기"
    vi: "Làm việc an toàn trong lab và thực địa"
    ms: "Bekerja dengan selamat di makmal dan lapangan"
    id: "Bekerja aman di lab dan lapangan"
    hi: "लैब और फ़ील्ड में सुरक्षित काम करना"
  - en: "Write clear short scientific reports"
    zh: "写清楚简短的科学报告"
    zh-TW: "寫出清楚簡短的科學報告"
    ja: "短く明確な科学レポートを書く"
    ko: "짧고 명확한 과학 보고서 쓰기"
    vi: "Viết báo cáo khoa học ngắn, rõ ràng"
    ms: "Tulis laporan saintifik ringkas yang jelas"
    id: "Menulis laporan ilmiah singkat yang jelas"
    hi: "साफ़ और छोटी वैज्ञानिक रिपोर्ट लिखना"
  - en: "Discuss ethical issues in science"
    zh: "讨论科学中的伦理问题"
    zh-TW: "討論科學中的倫理議題"
    ja: "科学の倫理的問題を議論する"
    ko: "과학의 윤리 문제 토론하기"
    vi: "Thảo luận vấn đề đạo đức trong khoa học"
    ms: "Bincang isu etika dalam sains"
    id: "Membahas isu etika dalam sains"
    hi: "विज्ञान के नैतिक मुद्दों पर चर्चा करना"
