code: CHIN30018
year: 2026
learn:
  en: "Chinese film and fiction since 1978, and what they show about a fast-changing society."
  zh: "1978年以来的中国电影和小说，以及它们反映的社会变化。"
  zh-TW: "1978年以來的中國電影和小說，以及它們反映的社會變化。"
  ja: "1978年以降の中国の映画と小説、そこに映る社会の変化。"
  ko: "1978년 이후 중국 영화와 소설, 그리고 그 속에 드러난 사회 변화."
  vi: "Phim và tiểu thuyết Trung Quốc từ 1978, và những gì chúng cho thấy về xã hội đổi thay."
  ms: "Filem dan fiksyen Cina sejak 1978, dan apa yang ditunjukkan tentang masyarakat yang berubah."
  id: "Film dan fiksi Tiongkok sejak 1978, dan apa yang ditunjukkan tentang masyarakat yang berubah."
  hi: "1978 के बाद की चीनी फ़िल्में और कथा-साहित्य, और बदलते समाज के बारे में वे क्या दिखाते हैं।"
outcomes:
  - en: "Analyse Chinese films and stories closely"
    zh: "细致分析中国电影和小说"
    zh-TW: "細緻分析中國電影和小說"
    ja: "中国の映画と小説を詳しく分析する"
    ko: "중국 영화와 소설을 꼼꼼히 분석하기"
    vi: "Phân tích kỹ phim và truyện Trung Quốc"
    ms: "Analisis filem dan cerita Cina dengan teliti"
    id: "Menganalisis film dan cerita Tiongkok dengan cermat"
    hi: "चीनी फ़िल्मों और कहानियों का बारीकी से विश्लेषण करना"
  - en: "Link works to social change in China"
    zh: "把作品和中国社会变化联系起来"
    zh-TW: "把作品和中國社會變化聯繫起來"
    ja: "作品を中国の社会変化と結びつける"
    ko: "작품을 중국 사회 변화와 연결하기"
    vi: "Liên hệ tác phẩm với biến đổi xã hội Trung Quốc"
    ms: "Kaitkan karya dengan perubahan sosial di China"
    id: "Mengaitkan karya dengan perubahan sosial di Tiongkok"
    hi: "रचनाओं को चीन के सामाजिक बदलाव से जोड़ना"
  - en: "Write clear essays on film and fiction"
    zh: "撰写关于电影和小说的清晰论文"
    zh-TW: "撰寫關於電影和小說的清晰論文"
    ja: "映画と小説について明快なレポートを書く"
    ko: "영화와 소설에 대해 명확한 글 쓰기"
    vi: "Viết tiểu luận rõ ràng về phim và truyện"
    ms: "Tulis esei yang jelas tentang filem dan fiksyen"
    id: "Menulis esai yang jelas tentang film dan fiksi"
    hi: "फ़िल्म और कथा पर स्पष्ट निबंध लिखना"
