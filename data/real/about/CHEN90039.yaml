code: CHEN90039
year: 2027
learn:
  en: "How medicines, vaccines and other biochemical products are made at scale, from cell growth to purification."
  zh: "药品、疫苗等生化产品如何规模化生产，从细胞培养到分离纯化。"
  zh-TW: "藥品、疫苗等生化產品如何規模化生產，從細胞培養到分離純化。"
  ja: "医薬品・ワクチンなどの生化学製品を、細胞培養から精製まで大規模に作る方法。"
  ko: "의약품·백신 등 생화학 제품을 세포 배양부터 정제까지 대량 생산하는 방법."
  vi: "Cách sản xuất quy mô lớn thuốc, vắc-xin và sản phẩm hóa sinh, từ nuôi cấy tế bào đến tinh chế."
  ms: "Cara ubat, vaksin dan produk biokimia lain dihasilkan secara besar-besaran, dari pengkulturan sel hingga penulenan."
  id: "Cara obat, vaksin dan produk biokimia lain dibuat dalam skala besar, dari kultur sel hingga pemurnian."
  hi: "दवाएँ, टीके और अन्य जैव-रासायनिक उत्पाद बड़े पैमाने पर कैसे बनते हैं, कोशिका वृद्धि से शुद्धिकरण तक।"
outcomes:
  - en: "Describe typical production processes for common medicines"
    zh: "描述常见药品的典型生产流程"
    zh-TW: "描述常見藥品的典型生產流程"
    ja: "一般的な医薬品の典型的な製造工程を説明する"
    ko: "일반 의약품의 대표적 생산 공정 설명하기"
    vi: "Mô tả quy trình sản xuất điển hình của các loại thuốc phổ biến"
    ms: "Menerangkan proses pengeluaran biasa bagi ubat-ubatan lazim"
    id: "Menjelaskan proses produksi umum untuk obat-obatan biasa"
    hi: "आम दवाओं की सामान्य उत्पादन प्रक्रियाएँ बताना"
  - en: "Discuss regulations and business drivers in drug development"
    zh: "讨论药物开发中的监管标准和商业因素"
    zh-TW: "討論藥物開發中的法規標準與商業因素"
    ja: "医薬品開発における規制と事業上の要因を論じる"
    ko: "의약품 개발의 규제와 사업적 요인 논의하기"
    vi: "Thảo luận quy định và động lực kinh doanh trong phát triển thuốc"
    ms: "Membincangkan peraturan dan faktor perniagaan dalam pembangunan ubat"
    id: "Membahas regulasi dan pendorong bisnis dalam pengembangan obat"
    hi: "दवा विकास में नियमों और व्यावसायिक कारकों पर चर्चा करना"
  - en: "Plan how to produce and purify a biochemical product"
    zh: "规划如何生产并纯化一种生化产品"
    zh-TW: "規劃如何生產並純化一種生化產品"
    ja: "生化学製品の生産と精製の方法を計画する"
    ko: "생화학 제품의 생산·정제 방법 계획하기"
    vi: "Lập kế hoạch sản xuất và tinh chế một sản phẩm hóa sinh"
    ms: "Merancang cara menghasil dan menulenkan produk biokimia"
    id: "Merencanakan cara memproduksi dan memurnikan produk biokimia"
    hi: "किसी जैव-रासायनिक उत्पाद के उत्पादन और शुद्धिकरण की योजना बनाना"
