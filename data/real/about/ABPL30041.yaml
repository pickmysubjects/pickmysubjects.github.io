code: ABPL30041
year: 2026
learn:
  en: "Treats construction as a set of technical and cultural choices: weigh up ways to actually build an architectural idea."
  zh: "把建造看作技术与文化的选择：评估把建筑构想真正建出来的不同方式。"
  zh-TW: "把營造看作技術與文化的選擇：評估把建築構想真正蓋出來的不同方式。"
  ja: "建設を技術と文化の選択として捉え、建築のアイデアを実際に建てる方法を比較検討する。"
  ko: "시공을 기술·문화적 선택으로 보고, 건축 아이디어를 실제로 짓는 방법들을 비교·평가한다."
  vi: "Xem xây dựng là lựa chọn kỹ thuật và văn hóa: cân nhắc các cách hiện thực hóa ý tưởng kiến trúc."
  ms: "Melihat pembinaan sebagai pilihan teknikal dan budaya: menilai cara membina idea seni bina."
  id: "Memandang konstruksi sebagai pilihan teknis dan budaya: menimbang cara mewujudkan ide arsitektur."
  hi: "निर्माण को तकनीकी और सांस्कृतिक चुनाव मानकर किसी आर्किटेक्चरल विचार को बनाने के तरीक़े परखना।"
outcomes:
  - en: "Identify the technology behind built examples"
    zh: "识别建成案例背后的技术"
    zh-TW: "辨識已建成案例背後的技術"
    ja: "実例の背後にある技術を読み取る"
    ko: "실제 건축 사례의 기술 파악하기"
    vi: "Nhận ra công nghệ đằng sau công trình thực tế"
    ms: "Kenal pasti teknologi di sebalik contoh binaan"
    id: "Mengenali teknologi di balik contoh bangunan"
    hi: "बनी इमारतों के पीछे की तकनीक पहचानना"
  - en: "Compare and choose construction options for a design"
    zh: "比较并选择设计的建造方案"
    zh-TW: "比較並選擇設計的營造方案"
    ja: "設計に合う施工方法を比較・選択する"
    ko: "설계에 맞는 시공 대안 비교·선택하기"
    vi: "So sánh và chọn phương án thi công cho thiết kế"
    ms: "Banding dan pilih pilihan pembinaan untuk reka bentuk"
    id: "Membandingkan dan memilih opsi konstruksi"
    hi: "डिज़ाइन के लिए निर्माण विकल्पों की तुलना और चयन"
  - en: "Explain how construction choices affect the design"
    zh: "说明建造选择如何影响设计"
    zh-TW: "說明營造選擇如何影響設計"
    ja: "施工の選択が設計に与える影響を説明する"
    ko: "시공 선택이 설계에 주는 영향 설명하기"
    vi: "Giải thích lựa chọn thi công ảnh hưởng thiết kế ra sao"
    ms: "Jelaskan kesan pilihan pembinaan pada reka bentuk"
    id: "Menjelaskan pengaruh pilihan konstruksi pada desain"
    hi: "निर्माण के चुनाव डिज़ाइन पर कैसे असर डालते हैं, समझाना"
