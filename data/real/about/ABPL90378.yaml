code: ABPL90378
year: 2027
learn:
  en: "A digital fabrication elective: rapid prototyping with tools such as Grasshopper and Arduino to make a final design."
  zh: "数字制造选修课：用Grasshopper、Arduino等工具快速做原型并完成设计作品。"
  zh-TW: "數位製造選修課：用Grasshopper、Arduino等工具快速做原型並完成設計作品。"
  ja: "デジタル制作の選択科目：GrasshopperやArduinoで素早く試作し作品をつくる。"
  ko: "디지털 제작 선택과목: Grasshopper, Arduino 등으로 빠르게 프로토타입을 만들어 작품을 완성합니다."
  vi: "Môn chế tác số: tạo mẫu nhanh bằng Grasshopper, Arduino để làm sản phẩm thiết kế."
  ms: "Elektif fabrikasi digital: prototaip pantas dengan Grasshopper dan Arduino untuk hasil reka bentuk."
  id: "Elektif fabrikasi digital: prototipe cepat dengan Grasshopper dan Arduino untuk karya desain."
  hi: "डिजिटल फ़ैब्रिकेशन ऐच्छिक: Grasshopper और Arduino से तेज़ प्रोटोटाइप बनाकर अंतिम डिज़ाइन।"
outcomes:
  - en: "Develop ideas by rapid prototyping"
