    ja: "ラピッドプロトタイピングで案を練る"
    ko: "신속 프로토타이핑으로 아이디어 발전시키기"
    vi: "Phát triển ý tưởng bằng tạo mẫu nhanh"
    ms: "Membangunkan idea melalui prototaip pantas"
    id: "Mengembangkan ide lewat prototipe cepat"
    hi: "तेज़ प्रोटोटाइपिंग से विचार विकसित करना"
  - en: "Use Grasshopper and Arduino in a design"
    zh: "在设计中使用Grasshopper和Arduino"
    zh-TW: "在設計中使用Grasshopper和Arduino"
    ja: "設計にGrasshopperとArduinoを使う"
    ko: "설계에 Grasshopper와 Arduino 활용하기"
    vi: "Dùng Grasshopper và Arduino trong thiết kế"
    ms: "Menggunakan Grasshopper dan Arduino dalam reka bentuk"
