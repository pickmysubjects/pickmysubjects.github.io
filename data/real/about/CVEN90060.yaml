code: CVEN90060
year: 2027
learn:
  en: "A team design project on a real civil system, such as an apartment building, covering structure, geotechnics and energy."
  zh: "围绕真实土木系统（如公寓楼）的团队设计项目，涵盖结构、岩土和能源。"
  zh-TW: "圍繞真實土木系統（如公寓大樓）的團隊設計專案，涵蓋結構、大地與能源。"
  ja: "集合住宅などの実際の土木システムを題材に、構造・地盤・エネルギーを扱うチーム設計プロジェクト。"
  ko: "아파트 같은 실제 토목 시스템을 대상으로 구조·지반·에너지를 다루는 팀 설계 프로젝트."
  vi: "Dự án thiết kế nhóm về một hệ thống xây dựng thực tế như chung cư, gồm kết cấu, địa kỹ thuật và năng lượng."
  ms: "Projek reka bentuk berkumpulan untuk sistem sivil sebenar seperti bangunan pangsapuri, merangkumi struktur, geoteknik dan tenaga."
  id: "Proyek desain tim untuk sistem sipil nyata seperti gedung apartemen, meliputi struktur, geoteknik dan energi."
  hi: "किसी वास्तविक सिविल प्रणाली (जैसे अपार्टमेंट भवन) पर टीम डिज़ाइन प्रोजेक्ट, जिसमें संरचना, भू-तकनीक और ऊर्जा शामिल हैं।"
outcomes:
  - en: "Define a complex civil design problem for a given site"
    zh: "针对具体场地界定复杂的土木设计问题"
    zh-TW: "針對特定基地界定複雜的土木設計問題"
    ja: "与えられた敷地で複雑な土木設計課題を定義する"
    ko: "주어진 부지의 복잡한 토목 설계 문제 정의하기"
    vi: "Xác định bài toán thiết kế xây dựng phức tạp cho một địa điểm"
    ms: "Mentakrifkan masalah reka bentuk sivil yang kompleks untuk tapak tertentu"
    id: "Merumuskan masalah desain sipil kompleks untuk lokasi tertentu"
    hi: "दी गई साइट के लिए जटिल सिविल डिज़ाइन समस्या परिभाषित करना"
  - en: "Develop and compare integrated design options"
    zh: "提出并比较多专业综合设计方案"
    zh-TW: "提出並比較跨領域整合設計方案"
    ja: "統合的な設計案を作り比較する"
    ko: "통합 설계안을 만들고 비교하기"
    vi: "Phát triển và so sánh các phương án thiết kế tích hợp"
    ms: "Membangunkan dan membandingkan pilihan reka bentuk bersepadu"
    id: "Menyusun dan membandingkan opsi desain terpadu"
    hi: "एकीकृत डिज़ाइन विकल्प बनाना और उनकी तुलना करना"
  - en: "Deliver a project as a team, on schedule"
    zh: "作为团队按期完成项目"
    zh-TW: "以團隊方式如期完成專案"
    ja: "チームで期限どおりにプロジェクトを仕上げる"
    ko: "팀으로 일정에 맞춰 프로젝트 완수하기"
    vi: "Làm việc nhóm để hoàn thành dự án đúng hạn"
    ms: "Menyiapkan projek secara berkumpulan mengikut jadual"
    id: "Menyelesaikan proyek bersama tim tepat waktu"
    hi: "टीम के रूप में समय पर परियोजना पूरी करना"
