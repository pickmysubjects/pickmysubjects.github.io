code: PHYS20009
year: 2026
learn:
  en: "How to design physiology experiments, plus a research project over several weeks."
  zh: "学怎么设计生理实验，并做一个几周的研究项目。"
  zh-TW: "學怎麼設計生理實驗，並做一個幾週的研究專題。"
  ja: "生理学実験の設計方法と、数週間にわたる研究プロジェクト。"
  ko: "생리학 실험 설계 방법과 몇 주간의 연구 프로젝트."
  vi: "Cách thiết kế thí nghiệm sinh lý, cùng một dự án nghiên cứu kéo dài vài tuần."
  ms: "Cara mereka bentuk eksperimen fisiologi, serta projek penyelidikan beberapa minggu."
  id: "Cara merancang eksperimen fisiologi, plus proyek riset beberapa minggu."
  hi: "फ़िज़ियोलॉजी प्रयोग कैसे डिज़ाइन करें, साथ में कुछ हफ़्तों का रिसर्च प्रोजेक्ट।"
outcomes:
  - en: "Design an experiment to test a hypothesis"
    zh: "设计实验来验证假设"
    zh-TW: "設計實驗來驗證假設"
    ja: "仮説を検証する実験を設計する"
    ko: "가설을 검증할 실험 설계"
    vi: "Thiết kế thí nghiệm để kiểm chứng giả thuyết"
    ms: "Reka eksperimen untuk menguji hipotesis"
    id: "Merancang eksperimen untuk menguji hipotesis"
    hi: "परिकल्पना जाँचने के लिए प्रयोग डिज़ाइन करना"
  - en: "Run physiology experiments and analyse data"
    zh: "做生理实验并分析数据"
    zh-TW: "做生理實驗並分析數據"
    ja: "生理学実験を行いデータを分析する"
    ko: "생리학 실험을 하고 데이터 분석"
    vi: "Làm thí nghiệm sinh lý và phân tích dữ liệu"
    ms: "Jalankan eksperimen fisiologi dan analisis data"
    id: "Menjalankan eksperimen fisiologi dan menganalisis data"
    hi: "फ़िज़ियोलॉजी प्रयोग करना और डेटा का विश्लेषण"
  - en: "Write a scientific report"
    zh: "写一份科学报告"
    zh-TW: "寫一份科學報告"
    ja: "科学レポートを書く"
    ko: "과학 보고서 작성"
    vi: "Viết báo cáo khoa học"
    ms: "Tulis laporan saintifik"
    id: "Menulis laporan ilmiah"
    hi: "वैज्ञानिक रिपोर्ट लिखना"
