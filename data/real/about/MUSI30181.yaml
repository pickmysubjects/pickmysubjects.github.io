code: MUSI30181
year: 2026
learn:
  en: "Guitar ensemble from duets to large groups across many styles; good sight-reading needed, nylon-string preferred."
  zh: "从二重奏到大编制的多风格吉他合奏；需良好视奏，首选尼龙弦吉他。"
  zh-TW: "從二重奏到大編制的多風格吉他合奏；需良好視奏，首選尼龍弦吉他。"
  ja: "二重奏から大編成まで多様なギター合奏。初見力が必要、ナイロン弦推奨。"
  ko: "이중주부터 대편성까지 다양한 기타 합주. 초견 필요, 나일론 줄 권장."
  vi: "Hòa tấu guitar từ song tấu tới nhóm lớn; cần đọc nhạc tốt, ưu tiên dây nylon."
  ms: "Ensembel gitar dari duet hingga kumpulan besar; perlu baca not baik, gitar nilon."
  id: "Ansambel gitar dari duet hingga grup besar; perlu baca not baik, gitar nilon."
  hi: "डुएट से बड़े समूह तक गिटार वादन; अच्छी साइट-रीडिंग चाहिए, नायलॉन तार बेहतर।"
outcomes:
  - en: "Sight-read and prepare ensemble guitar parts"
    zh: "视奏并准备吉他合奏声部"
    zh-TW: "視奏並準備吉他合奏聲部"
    ja: "ギター合奏のパートを初見・準備する"
    ko: "기타 합주 파트 초견하고 준비하기"
    vi: "Đọc và chuẩn bị bè guitar hòa tấu"
    ms: "Baca dan sediakan bahagian gitar"
    id: "Membaca dan menyiapkan partisi gitar"
    hi: "गिटार समूह के भाग पढ़ना और तैयार करना"
  - en: "Play in duos, trios and larger groups"
    zh: "在二重奏、三重奏及更大编制中演奏"
    zh-TW: "在二重奏、三重奏及更大編制中演奏"
    ja: "二重奏・三重奏や大編成で演奏する"
    ko: "이중주·삼중주·대편성으로 연주하기"
    vi: "Chơi song tấu, tam tấu và nhóm lớn hơn"
    ms: "Bermain duo, trio dan kumpulan besar"
    id: "Bermain duo, trio dan grup lebih besar"
    hi: "जोड़ी, तिकड़ी और बड़े समूह में बजाना"
  - en: "Pass individual part tests"
    zh: "通过个人声部测试"
    zh-TW: "通過個人聲部測試"
    ja: "個人パートテストに合格する"
    ko: "개인 파트 테스트 통과하기"
    vi: "Vượt qua các bài kiểm tra bè cá nhân"
    ms: "Lulus ujian bahagian individu"
    id: "Lulus tes partisi individu"
    hi: "व्यक्तिगत भाग परीक्षाएँ पास करना"
