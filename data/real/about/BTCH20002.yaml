code: BTCH20002
year: 2026
learn:
  en: "The science behind biotechnology and how it's used in industry, farming and medicine."
  zh: "生物技术背后的科学，以及它在工业、农业和医学里的应用。"
  zh-TW: "生物技術背後的科學，以及它在工業、農業和醫學上的應用。"
  ja: "バイオテクノロジーの科学的背景と、産業・農業・医療での使われ方。"
  ko: "생명공학의 과학적 원리와 산업·농업·의학에서의 활용."
  vi: "Khoa học đằng sau công nghệ sinh học và ứng dụng trong công nghiệp, nông nghiệp, y học."
  ms: "Sains di sebalik bioteknologi dan penggunaannya dalam industri, pertanian dan perubatan."
  id: "Sains di balik bioteknologi dan penggunaannya di industri, pertanian, dan kedokteran."
  hi: "बायोटेक्नोलॉजी के पीछे का विज्ञान और उद्योग, खेती व चिकित्सा में इसका उपयोग।"
outcomes:
  - en: "Explain how microbes, plants and animals are modified"
    zh: "解释怎样改造微生物和动植物"
    zh-TW: "解釋如何改造微生物和動植物"
    ja: "微生物・植物・動物がどう改変されるか説明する"
    ko: "미생물, 식물, 동물이 어떻게 변형되는지 설명하기"
    vi: "Giải thích cách biến đổi vi sinh vật, thực vật, động vật"
    ms: "Terangkan cara mikrob, tumbuhan dan haiwan diubah suai"
    id: "Menjelaskan cara mikroba, tumbuhan, dan hewan dimodifikasi"
    hi: "समझाना कि सूक्ष्मजीव, पौधे और जानवर कैसे बदले जाते हैं"
  - en: "Discuss biotech issues for health, environment, farming"
    zh: "讨论生物技术对健康、环境和农业的影响"
    zh-TW: "討論生物技術對健康、環境和農業的影響"
    ja: "健康・環境・農業に関するバイオテクの課題を議論する"
    ko: "건강·환경·농업 관련 생명공학 쟁점 논의하기"
    vi: "Thảo luận vấn đề công nghệ sinh học với sức khỏe, môi trường, nông nghiệp"
    ms: "Bincang isu biotek untuk kesihatan, alam sekitar, pertanian"
    id: "Membahas isu bioteknologi bagi kesehatan, lingkungan, pertanian"
    hi: "सेहत, पर्यावरण, खेती से जुड़े बायोटेक मुद्दों पर चर्चा"
