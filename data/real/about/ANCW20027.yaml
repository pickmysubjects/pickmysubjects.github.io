code: ANCW20027
year: 2026
learn:
  en: "Key sites, temples, sculpture and pottery of ancient Greece, Bronze Age to Classical, with hands-on work on real artefacts."
  zh: "古希腊从青铜时代到古典时期的重要遗址、神庙、雕塑和陶器，并亲手研究真实文物。"
  zh-TW: "古希臘從青銅時代到古典時期的重要遺址、神廟、雕塑和陶器，並親手研究真實文物。"
  ja: "青銅器時代から古典期までの古代ギリシャの遺跡、神殿、彫刻、陶器。本物の出土品にも触れて分析する。"
  ko: "청동기부터 고전기까지 고대 그리스의 주요 유적, 신전, 조각, 도자기. 실제 유물을 직접 다뤄 본다."
  vi: "Di chỉ, đền thờ, điêu khắc và gốm Hy Lạp cổ từ thời Đồ đồng đến Cổ điển, có thực hành với hiện vật thật."
  ms: "Tapak, kuil, arca dan tembikar Yunani kuno dari Zaman Gangsa hingga Klasik, dengan kerja langsung pada artifak sebenar."
  id: "Situs, kuil, patung dan tembikar Yunani kuno dari Zaman Perunggu hingga Klasik, dengan praktik langsung pada artefak asli."
  hi: "कांस्य युग से क्लासिकल काल तक प्राचीन यूनान के स्थल, मंदिर, मूर्तियाँ और बर्तन, असली कलाकृतियों के साथ अभ्यास।"
outcomes:
  - en: "Identify major Greek sites and art styles"
    zh: "识别重要的希腊遗址和艺术风格"
    zh-TW: "辨識重要的希臘遺址和藝術風格"
    ja: "主なギリシャの遺跡と美術様式を見分ける"
    ko: "주요 그리스 유적과 미술 양식 알아보기"
    vi: "Nhận biết các di chỉ và phong cách nghệ thuật Hy Lạp chính"
    ms: "Kenal pasti tapak dan gaya seni utama Yunani"
    id: "Mengenali situs dan gaya seni utama Yunani"
    hi: "मुख्य यूनानी स्थलों और कला शैलियों को पहचानना"
  - en: "Analyse objects and buildings as historical evidence"
    zh: "把器物和建筑当作历史证据分析"
    zh-TW: "把器物和建築當作歷史證據分析"
    ja: "器物や建築物を歴史の証拠として分析する"
    ko: "유물과 건축물을 역사적 증거로 분석하기"
    vi: "Phân tích đồ vật và công trình như bằng chứng lịch sử"
    ms: "Analisis objek dan bangunan sebagai bukti sejarah"
    id: "Menganalisis benda dan bangunan sebagai bukti sejarah"
    hi: "वस्तुओं और इमारतों का ऐतिहासिक साक्ष्य के रूप में विश्लेषण करना"
  - en: "Link material culture to Greek daily life"
    zh: "把物质文化与希腊人的日常生活联系起来"
    zh-TW: "把物質文化與希臘人的日常生活聯繫起來"
    ja: "物質文化をギリシャ人の日常生活と結びつける"
    ko: "물질문화를 그리스인의 일상과 연결하기"
    vi: "Liên hệ văn hóa vật chất với đời sống người Hy Lạp"
    ms: "Kaitkan budaya material dengan kehidupan harian Yunani"
    id: "Mengaitkan budaya material dengan kehidupan sehari-hari Yunani"
    hi: "भौतिक संस्कृति को यूनानी दैनिक जीवन से जोड़ना"
