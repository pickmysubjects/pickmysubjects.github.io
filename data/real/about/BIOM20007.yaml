code: BIOM20007
year: 2027
learn:
  en: "How muscles, bones, joints and nerves work together for movement and posture, and how drugs and disease affect them."
  zh: "肌肉、骨骼、关节和神经如何协作完成运动和维持姿势，以及药物和疾病对它们的影响。"
  zh-TW: "肌肉、骨骼、關節和神經如何協作完成運動和維持姿勢，以及藥物和疾病對它們的影響。"
  ja: "筋肉・骨・関節・神経が協力して運動と姿勢を生み出すしくみと、薬や病気の影響。"
  ko: "근육·뼈·관절·신경이 함께 움직임과 자세를 만드는 방식, 그리고 약물과 질병의 영향."
  vi: "Cơ, xương, khớp và dây thần kinh phối hợp tạo ra vận động và tư thế ra sao, và thuốc cùng bệnh tật ảnh hưởng chúng thế nào."
  ms: "Bagaimana otot, tulang, sendi dan saraf bekerjasama untuk pergerakan dan postur, serta kesan ubat dan penyakit."
  id: "Bagaimana otot, tulang, sendi, dan saraf bekerja sama untuk gerak dan postur, serta pengaruh obat dan penyakit."
  hi: "मांसपेशियाँ, हड्डियाँ, जोड़ और नसें मिलकर गति व मुद्रा कैसे बनाती हैं, और दवाओं व बीमारी का उन पर असर।"
outcomes:
  - en: "Explain how dysfunction leads to injury and disease"
    zh: "解释功能失调如何导致损伤和疾病"
    zh-TW: "解釋功能失調如何導致損傷和疾病"
    ja: "機能不全がけがや病気につながるしくみを説明する"
    ko: "기능 이상이 부상과 질병으로 이어지는 과정 설명하기"
    vi: "Giải thích rối loạn chức năng dẫn đến chấn thương và bệnh"
    ms: "Terangkan bagaimana disfungsi membawa kepada kecederaan"
    id: "Menjelaskan disfungsi yang memicu cedera dan penyakit"
    hi: "गड़बड़ी से चोट और बीमारी कैसे होती है, समझाना"
  - en: "Evaluate how drugs act on muscles and nerves"
    zh: "评估药物如何作用于肌肉和神经"
    zh-TW: "評估藥物如何作用於肌肉和神經"
    ja: "薬が筋肉や神経にどう作用するか評価する"
    ko: "약물이 근육과 신경에 작용하는 방식 평가하기"
    vi: "Đánh giá thuốc tác động lên cơ và thần kinh ra sao"
    ms: "Nilai tindakan ubat pada otot dan saraf"
    id: "Menilai kerja obat pada otot dan saraf"
    hi: "दवाएँ मांसपेशियों और नसों पर कैसे असर करती हैं, आँकना"
  - en: "Identify body structures using cadavers and imaging"
    zh: "借助遗体标本和影像辨认人体结构"
    zh-TW: "藉助大體標本和影像辨認人體結構"
    ja: "献体標本や画像で人体の構造を見分ける"
    ko: "카데바와 영상으로 인체 구조 식별하기"
    vi: "Nhận diện cấu trúc cơ thể qua tử thi và hình ảnh y khoa"
    ms: "Kenal pasti struktur badan melalui kadaver dan pengimejan"
    id: "Mengenali struktur tubuh lewat kadaver dan pencitraan"
    hi: "शव-नमूनों और इमेजिंग से शरीर की संरचनाएँ पहचानना"
