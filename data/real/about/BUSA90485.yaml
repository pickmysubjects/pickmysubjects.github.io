code: BUSA90485
year: 2027
learn:
  en: "A team project, taught off campus, solving a business planning problem in an international setting."
  zh: "校外进行的小组项目，解决国际环境下的商业规划问题。"
  zh-TW: "校外進行的小組專題，解決國際環境下的商業規劃問題。"
  ja: "学外で行うチーム課題で、国際的な事業計画の問題に取り組む。"
  ko: "교외에서 진행하는 팀 프로젝트로 국제 환경의 사업 계획 문제 해결."
  vi: "Dự án nhóm ngoài trường, giải bài toán kế hoạch kinh doanh trong bối cảnh quốc tế."
  ms: "Projek berkumpulan luar kampus untuk masalah perancangan perniagaan antarabangsa."
  id: "Proyek tim di luar kampus untuk masalah perencanaan bisnis internasional."
  hi: "कैंपस के बाहर टीम प्रोजेक्ट, अंतरराष्ट्रीय बिज़नेस प्लानिंग समस्या पर।"
outcomes:
  - en: "Research a business problem in another country's context"
    zh: "在他国背景下调研商业问题"
    zh-TW: "在他國背景下研究商業問題"
    ja: "他国の状況でビジネス課題を調べる"
    ko: "해외 상황에서 비즈니스 문제 조사하기"
    vi: "Nghiên cứu vấn đề kinh doanh trong bối cảnh nước khác"
    ms: "Kaji masalah perniagaan dalam konteks negara lain"
    id: "Meneliti masalah bisnis dalam konteks negara lain"
    hi: "दूसरे देश के संदर्भ में बिज़नेस समस्या पर रिसर्च"
  - en: "Work in a team to write practical recommendations"
    zh: "与团队合作撰写可行建议"
    zh-TW: "與團隊合作撰寫可行建議"
    ja: "チームで実践的な提案をまとめる"
    ko: "팀으로 실용적 제안 작성하기"
    vi: "Làm việc nhóm để viết đề xuất thực tế"
    ms: "Bekerja dalam pasukan menulis cadangan praktikal"
    id: "Bekerja dalam tim menyusun rekomendasi praktis"
    hi: "टीम में व्यावहारिक सुझाव लिखना"
