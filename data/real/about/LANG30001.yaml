code: LANG30001
year: 2026
learn:
  en: "Work in a team with a real industry partner from a language community in Australia, on a project they need."
  zh: "与澳大利亚某语言社区的真实合作机构组队，完成对方需要的项目。"
  zh-TW: "與澳洲某語言社群的真實合作機構組隊，完成對方需要的專案。"
  ja: "オーストラリアの言語コミュニティの実在の企業・団体とチームで、相手が必要とするプロジェクトに取り組む。"
  ko: "호주 내 언어 공동체의 실제 산업 파트너와 팀을 이뤄 그들이 필요로 하는 프로젝트를 한다."
  vi: "Làm việc nhóm với một đối tác thật trong cộng đồng ngôn ngữ ở Úc, thực hiện dự án họ cần."
  ms: "Bekerja dalam pasukan dengan rakan industri sebenar dari komuniti bahasa di Australia, untuk projek yang mereka perlukan."
  id: "Bekerja dalam tim dengan mitra industri nyata dari komunitas bahasa di Australia, pada proyek yang mereka butuhkan."
  hi: "ऑस्ट्रेलिया के किसी भाषा-समुदाय के असली उद्योग साझेदार के साथ टीम में, उनकी ज़रूरत की परियोजना पर काम।"
outcomes:
  - en: "Use your language with a real industry partner"
    zh: "与真实合作机构用外语沟通"
    zh-TW: "與真實合作機構用外語溝通"
    ja: "実在のパートナーと外国語でやり取りする"
    ko: "실제 산업 파트너와 외국어로 소통하기"
    vi: "Dùng ngoại ngữ với một đối tác thật"
    ms: "Guna bahasa anda bersama rakan industri sebenar"
    id: "Memakai bahasa Anda bersama mitra industri nyata"
    hi: "असली उद्योग साझेदार के साथ अपनी भाषा इस्तेमाल करना"
  - en: "Develop a project as a team, the way workplaces do"
    zh: "像职场一样以团队方式推进项目"
    zh-TW: "像職場一樣以團隊方式推進專案"
    ja: "職場と同じやり方でチームでプロジェクトを進める"
    ko: "직장처럼 팀으로 프로젝트 진행하기"
    vi: "Làm dự án theo nhóm như ở nơi làm việc"
    ms: "Bangunkan projek secara berpasukan seperti di tempat kerja"
    id: "Mengembangkan proyek dalam tim seperti di tempat kerja"
    hi: "कार्यस्थल की तरह टीम में परियोजना आगे बढ़ाना"
  - en: "Name the intercultural skills employers value"
    zh: "认清雇主看重的跨文化能力"
    zh-TW: "認清雇主看重的跨文化能力"
    ja: "雇用者が重視する異文化対応力を自覚する"
    ko: "고용주가 중시하는 다문화 역량 파악하기"
    vi: "Nhận ra kỹ năng liên văn hóa nhà tuyển dụng cần"
    ms: "Kenal pasti kemahiran antara budaya yang dihargai majikan"
    id: "Mengenali keterampilan antarbudaya yang dihargai pemberi kerja"
    hi: "नियोक्ताओं को प्रिय अंतरसांस्कृतिक कौशल पहचानना"
