code: LANG30001
year: 2026
learn:
  en: "Putting your language skills to use in a real workplace or community project, and reflecting on what you learn."
  zh: "在真实的工作或社区项目中运用你的外语能力，并反思收获。"
  zh-TW: "在真實的工作或社區專案中運用你的外語能力，並反思收穫。"
  ja: "実際の職場や地域のプロジェクトで外国語の力を使い、学んだことを振り返る。"
  ko: "실제 직장이나 지역 프로젝트에서 외국어 실력을 쓰고 배운 점을 돌아본다."
  vi: "Dùng kỹ năng ngoại ngữ trong một dự án thật ở nơi làm việc hoặc cộng đồng, rồi suy ngẫm điều đã học."
  ms: "Menggunakan kemahiran bahasa dalam projek sebenar di tempat kerja atau komuniti, dan merenung pembelajaran."
  id: "Memakai kemampuan bahasa dalam proyek nyata di tempat kerja atau komunitas, lalu merefleksikan hasilnya."
  hi: "किसी असली कार्यस्थल या सामुदायिक परियोजना में अपनी भाषा-क्षमता इस्तेमाल करना और सीख पर विचार करना।"
outcomes:
  - en: "Use a second language in a real work setting"
    zh: "在真实工作环境中使用外语"
    zh-TW: "在真實工作環境中使用外語"
    ja: "実際の仕事の場で外国語を使う"
    ko: "실제 업무 환경에서 외국어 쓰기"
    vi: "Dùng ngoại ngữ trong môi trường làm việc thật"
    ms: "Guna bahasa kedua dalam suasana kerja sebenar"
    id: "Memakai bahasa kedua di lingkungan kerja nyata"
    hi: "असली काम के माहौल में दूसरी भाषा इस्तेमाल करना"
  - en: "Plan and carry out a language-based project"
    zh: "策划并完成一个以语言为基础的项目"
    zh-TW: "規劃並完成一個以語言為基礎的專案"
    ja: "言語を使うプロジェクトを計画し実行する"
    ko: "언어 기반 프로젝트 계획하고 실행하기"
    vi: "Lên kế hoạch và thực hiện dự án dùng ngôn ngữ"
    ms: "Rancang dan laksanakan projek berasaskan bahasa"
    id: "Merencanakan dan menjalankan proyek berbasis bahasa"
    hi: "भाषा पर आधारित परियोजना की योजना बनाकर पूरा करना"
  - en: "Reflect on your skills and career options"
    zh: "反思自己的能力和职业方向"
    zh-TW: "反思自己的能力和職涯方向"
    ja: "自分の力と進路を振り返る"
    ko: "자신의 역량과 진로 돌아보기"
    vi: "Nhìn lại kỹ năng và hướng nghề nghiệp"
    ms: "Renungkan kemahiran dan pilihan kerjaya anda"
    id: "Merefleksikan kemampuan dan pilihan karier"
    hi: "अपनी क्षमताओं और करियर विकल्पों पर विचार करना"
