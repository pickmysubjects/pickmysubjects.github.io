code: DPSS20011
year: 2026
learn:
  en: "Go deeper into two production specialisms you passed in Studio 2, such as lighting, sound, set or stage management."
  zh: "深入学习你在工作室2中通过的两个制作方向，例如灯光、音响、布景或舞台管理。"
  zh-TW: "深入學習你在工作室2通過的兩個製作方向，例如燈光、音響、佈景或舞台管理。"
  ja: "スタジオ2で合格した2分野（照明・音響・美術・舞台監督など）をさらに深める。"
  ko: "스튜디오 2에서 통과한 두 분야(조명·음향·무대·무대감독 등)를 더 깊이 배운다."
  vi: "Học sâu hai chuyên ngành đã qua ở Studio 2, như ánh sáng, âm thanh, cảnh, quản lý sân khấu."
  ms: "Dalami dua bidang produksi dari Studio 2, seperti lampu, bunyi, set atau pengurusan pentas."
  id: "Mendalami dua bidang produksi dari Studio 2, seperti cahaya, suara, set, manajemen panggung."
  hi: "स्टूडियो 2 के दो विषयों में गहराई: लाइटिंग, साउंड, सेट या स्टेज मैनेजमेंट।"
outcomes:
  - en: "Build skills in two production specialisms"
    zh: "在两个制作方向上提升技能"
    zh-TW: "在兩個製作方向上提升技能"
    ja: "2つの制作分野の技能を高める"
    ko: "두 제작 분야의 기술 키우기"
    vi: "Nâng kỹ năng ở hai chuyên ngành"
    ms: "Bina kemahiran dalam dua bidang"
    id: "Membangun keterampilan di dua bidang"
    hi: "दो प्रोडक्शन विषयों में कौशल बढ़ाना"
  - en: "Work safely in a technical theatre setting"
    zh: "在剧场技术环境中安全工作"
    zh-TW: "在劇場技術環境中安全工作"
    ja: "舞台技術の現場で安全に作業する"
    ko: "무대 기술 현장에서 안전하게 일하기"
    vi: "Làm việc an toàn trong sân khấu kỹ thuật"
    ms: "Bekerja dengan selamat di teater teknikal"
    id: "Bekerja aman di panggung teknis"
    hi: "तकनीकी थिएटर में सुरक्षित काम करना"
  - en: "Collaborate with performance makers"
    zh: "与表演创作者合作"
    zh-TW: "與表演創作者合作"
    ja: "舞台の作り手と協働する"
    ko: "공연 제작자와 협업하기"
    vi: "Hợp tác với người làm biểu diễn"
    ms: "Bekerjasama dengan pembikin persembahan"
    id: "Berkolaborasi dengan pembuat pertunjukan"
    hi: "प्रदर्शन बनाने वालों के साथ काम करना"
