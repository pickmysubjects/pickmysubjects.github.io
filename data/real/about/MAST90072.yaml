code: MAST90072
year: 2027
learn:
  en: "Collecting and analysing data to make reliable decisions in biotechnology, with experimental design and a statistics package."
  zh: "在生物技术中收集和分析数据以做出可靠决策，包括实验设计和统计软件。"
  zh-TW: "在生物科技中蒐集與分析資料以做出可靠決策，包括實驗設計與統計軟體。"
  ja: "バイオテクノロジーで信頼できる判断をするためのデータ収集・分析、実験計画と統計ソフト。"
  ko: "생명공학에서 신뢰할 수 있는 결정을 위한 데이터 수집·분석, 실험 설계와 통계 패키지."
  vi: "Thu thập và phân tích dữ liệu để ra quyết định tin cậy trong công nghệ sinh học, gồm thiết kế thí nghiệm và phần mềm thống kê."
  ms: "Mengumpul dan menganalisis data untuk keputusan yang boleh dipercayai dalam bioteknologi, dengan reka bentuk eksperimen dan pakej statistik."
  id: "Mengumpulkan dan menganalisis data untuk keputusan andal di bioteknologi, dengan desain eksperimen dan paket statistik."
  hi: "जैव-प्रौद्योगिकी में भरोसेमंद निर्णय के लिए डेटा संग्रह और विश्लेषण, प्रयोग डिज़ाइन और सांख्यिकी पैकेज के साथ।"
outcomes:
  - en: "Design experiments and collect data well"
    zh: "设计实验并有效收集数据"
    zh-TW: "設計實驗並有效蒐集資料"
    ja: "実験を計画し、効率よくデータを集める"
    ko: "실험을 설계하고 데이터를 잘 수집하기"
    vi: "Thiết kế thí nghiệm và thu dữ liệu hiệu quả"
    ms: "Mereka bentuk eksperimen dan mengumpul data dengan baik"
    id: "Merancang eksperimen dan mengumpulkan data dengan baik"
    hi: "प्रयोग डिज़ाइन करना और डेटा ठीक से जुटाना"
  - en: "Apply statistical methods used in biotechnology"
    zh: "运用生物技术中常用的统计方法"
    zh-TW: "運用生物科技中常用的統計方法"
    ja: "バイオテクノロジーの統計手法を使う"
    ko: "생명공학 통계 기법 적용하기"
    vi: "Áp dụng phương pháp thống kê trong công nghệ sinh học"
    ms: "Mengguna kaedah statistik dalam bioteknologi"
    id: "Menerapkan metode statistik di bioteknologi"
    hi: "जैव-प्रौद्योगिकी की सांख्यिकीय विधियाँ लागू करना"
  - en: "Report results to a non-specialist audience"
    zh: "向非专业人士报告结果"
    zh-TW: "向非專業人士報告結果"
    ja: "専門外の人に結果を報告する"
    ko: "비전문가에게 결과 보고하기"
    vi: "Báo cáo kết quả cho người không chuyên"
    ms: "Melaporkan hasil kepada khalayak bukan pakar"
    id: "Melaporkan hasil kepada audiens awam"
    hi: "गैर-विशेषज्ञ श्रोताओं को परिणाम बताना"
