code: ELEN90051
year: 2027
learn:
  en: "How digital communication systems and wireless networks are analysed and designed, from coding to MIMO and cellular networks."
  zh: "数字通信系统和无线网络的分析与设计，从编码到 MIMO 和蜂窝网络。"
  zh-TW: "數位通訊系統與無線網路的分析與設計，從編碼到 MIMO 與蜂巢式網路。"
  ja: "符号化からMIMO・セルラー網まで、デジタル通信システムと無線ネットワークの解析と設計。"
  ko: "부호화부터 MIMO, 셀룰러 네트워크까지 디지털 통신 시스템과 무선망의 분석과 설계."
  vi: "Phân tích và thiết kế hệ thống truyền thông số và mạng không dây, từ mã hóa đến MIMO và mạng di động."
  ms: "Analisis dan reka bentuk sistem komunikasi digital dan rangkaian tanpa wayar, dari pengekodan hingga MIMO dan rangkaian selular."
  id: "Analisis dan desain sistem komunikasi digital dan jaringan nirkabel, dari pengodean hingga MIMO dan jaringan seluler."
  hi: "डिजिटल संचार प्रणालियों और वायरलेस नेटवर्क का विश्लेषण और डिज़ाइन, कोडिंग से MIMO और सेल्युलर नेटवर्क तक।"
outcomes:
  - en: "Model noise, interference and fading in channels"
    zh: "建模信道中的噪声、干扰和衰落"
    zh-TW: "建立通道中雜訊、干擾與衰落的模型"
    ja: "チャネルの雑音・干渉・フェージングをモデル化する"
    ko: "채널의 잡음·간섭·페이딩 모델링하기"
    vi: "Mô hình nhiễu, can nhiễu và pha-đinh trong kênh"
    ms: "Memodelkan hingar, gangguan dan pemudaran dalam saluran"
    id: "Memodelkan derau, interferensi dan fading pada kanal"
    hi: "चैनलों में शोर, व्यतिकरण और फ़ेडिंग का मॉडल बनाना"
  - en: "Explain techniques that keep communication reliable"
    zh: "说明保证可靠通信的技术"
    zh-TW: "說明確保可靠通訊的技術"
    ja: "通信の信頼性を保つ技術を説明する"
    ko: "신뢰성 있는 통신을 위한 기법 설명하기"
    vi: "Giải thích các kỹ thuật giữ truyền thông tin cậy"
    ms: "Menerangkan teknik yang memastikan komunikasi boleh dipercayai"
    id: "Menjelaskan teknik yang menjaga komunikasi tetap andal"
    hi: "विश्वसनीय संचार बनाए रखने वाली तकनीकें समझाना"
  - en: "Turn system requirements into modulation and coding choices"
    zh: "把系统要求转化为调制和编码方案"
    zh-TW: "把系統需求轉化為調變與編碼方案"
    ja: "システム要件を変調・符号化方式に落とし込む"
    ko: "시스템 요구사항을 변조·부호화 방식으로 정하기"
    vi: "Chuyển yêu cầu hệ thống thành lựa chọn điều chế và mã hóa"
    ms: "Menukar keperluan sistem kepada pilihan modulasi dan pengekodan"
    id: "Mengubah kebutuhan sistem menjadi pilihan modulasi dan pengodean"
    hi: "सिस्टम की ज़रूरतों को मॉड्यूलेशन और कोडिंग विकल्पों में बदलना"
