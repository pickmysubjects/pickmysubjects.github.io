code: ACTL30002
year: 2026
learn:
  en: "Estimating death rates from data, smoothing them, forecasting future mortality, and a first look at machine learning."
  zh: "从数据估计死亡率、修匀、预测未来死亡率，并初识机器学习。"
  zh-TW: "從資料估計死亡率、修勻、預測未來死亡率，並初探機器學習。"
  ja: "データから死亡率を推定・補整し、将来を予測する。機械学習の入門も含む。"
  ko: "데이터로 사망률을 추정·보정하고 미래 사망률을 예측하며 머신러닝을 처음 접한다."
  vi: "Ước lượng tỷ lệ tử vong từ dữ liệu, làm trơn, dự báo tử vong tương lai và làm quen với học máy."
  ms: "Menganggar kadar kematian dari data, melicinkannya, meramal kematian masa depan, dan pengenalan pembelajaran mesin."
  id: "Menaksir angka kematian dari data, menghaluskannya, meramal mortalitas ke depan, dan pengenalan machine learning."
  hi: "डेटा से मृत्यु दर का अनुमान, उसे स्मूद करना, भविष्य की मृत्यु दर का पूर्वानुमान, और मशीन लर्निंग की शुरुआत।"
outcomes:
  - en: "Estimate mortality rates from exposure data"
    zh: "根据暴露数据估计死亡率"
    zh-TW: "根據暴露資料估計死亡率"
    ja: "エクスポージャーデータから死亡率を推定する"
    ko: "노출 데이터로 사망률 추정"
    vi: "Ước lượng tỷ lệ tử vong từ dữ liệu phơi nhiễm"
    ms: "Anggar kadar kematian daripada data pendedahan"
    id: "Menaksir angka kematian dari data eksposur"
    hi: "एक्सपोज़र डेटा से मृत्यु दर का अनुमान"
  - en: "Test and smooth (graduate) crude estimates"
    zh: "检验并修匀粗死亡率"
    zh-TW: "檢定並修勻粗死亡率"
    ja: "粗い推定値を検定し補整する"
    ko: "거친 추정치 검정 및 보정"
    vi: "Kiểm định và làm trơn ước lượng thô"
    ms: "Uji dan licinkan anggaran kasar"
    id: "Menguji dan menghaluskan taksiran kasar"
    hi: "कच्चे अनुमानों की जाँच और स्मूदिंग"
  - en: "Forecast mortality with models like Lee-Carter"
    zh: "用Lee-Carter等模型预测死亡率"
    zh-TW: "用Lee-Carter等模型預測死亡率"
    ja: "Lee-Carterなどのモデルで死亡率を予測する"
    ko: "Lee-Carter 등 모형으로 사망률 예측"
    vi: "Dự báo tử vong bằng mô hình như Lee-Carter"
    ms: "Ramal kematian dengan model seperti Lee-Carter"
    id: "Meramal mortalitas dengan model seperti Lee-Carter"
    hi: "ली-कार्टर जैसे मॉडल से मृत्यु दर का पूर्वानुमान"
