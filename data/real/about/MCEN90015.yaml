code: MCEN90015
year: 2027
learn:
  en: "Heat transfer and power and refrigeration cycles, applied to real devices."
  zh: "传热以及动力和制冷循环，并用于实际设备。"
  zh-TW: "熱傳以及動力與冷凍循環，並應用於實際設備。"
  ja: "伝熱と動力・冷凍サイクルを実際の機器に当てはめる。"
  ko: "열전달과 동력·냉동 사이클을 실제 장치에 적용."
  vi: "Truyền nhiệt, chu trình động lực và làm lạnh áp dụng cho thiết bị thực."
  ms: "Pemindahan haba serta kitaran kuasa dan penyejukan pada peranti sebenar."
  id: "Perpindahan panas serta siklus daya dan refrigerasi pada perangkat nyata."
  hi: "ऊष्मा स्थानांतरण और पावर व रेफ्रिजरेशन चक्र, असली उपकरणों पर।"
outcomes:
  - en: "Apply thermodynamics and heat transfer to engineering devices"
    zh: "把热力学和传热原理用于工程设备"
    zh-TW: "把熱力學與熱傳原理用於工程設備"
    ja: "熱力学と伝熱を工学機器に適用する"
    ko: "열역학과 열전달을 공학 장치에 적용하기"
    vi: "Áp dụng nhiệt động lực học và truyền nhiệt cho thiết bị"
    ms: "Menggunakan termodinamik dan pemindahan haba pada peranti"
    id: "Menerapkan termodinamika dan perpindahan panas pada perangkat"
    hi: "उपकरणों पर ऊष्मागतिकी और ऊष्मा स्थानांतरण लागू करना"
  - en: "Analyse the performance of turbines, refrigerators and heat exchangers"
    zh: "分析涡轮、制冷机和换热器的性能"
    zh-TW: "分析渦輪、冷凍機與熱交換器的性能"
    ja: "タービン・冷凍機・熱交換器の性能を分析する"
    ko: "터빈·냉동기·열교환기 성능 분석하기"
    vi: "Phân tích hiệu suất tua-bin, máy lạnh và bộ trao đổi nhiệt"
    ms: "Menganalisis prestasi turbin, penyejuk dan penukar haba"
    id: "Menganalisis kinerja turbin, mesin pendingin, dan penukar panas"
    hi: "टर्बाइन, रेफ्रिजरेटर और हीट एक्सचेंजर का प्रदर्शन विश्लेषण"
