code: MECM30015
year: 2026
learn:
  en: "A guided independent research project on a media topic of your choice, ending in a written report and a poster presentation."
  zh: "在指导下就自选的媒体课题做独立研究，最后写成报告并做海报展示。"
  zh-TW: "在指導下就自選的媒體題目做獨立研究，最後寫成報告並做海報展示。"
  ja: "自分で選んだメディアのテーマについて指導を受けながら独自に研究し、レポートとポスター発表にまとめる。"
  ko: "스스로 고른 미디어 주제로 지도를 받으며 독립 연구를 하고, 보고서와 포스터 발표로 마무리한다."
  vi: "Dự án nghiên cứu độc lập có hướng dẫn về một chủ đề truyền thông tự chọn, kết thúc bằng báo cáo viết và trình bày poster."
  ms: "Projek penyelidikan bebas berpandu tentang topik media pilihan sendiri, diakhiri dengan laporan bertulis dan pembentangan poster."
  id: "Proyek riset mandiri dengan bimbingan tentang topik media pilihanmu, diakhiri laporan tertulis dan presentasi poster."
  hi: "अपनी पसंद के मीडिया विषय पर मार्गदर्शन के साथ स्वतंत्र शोध प्रोजेक्ट, जो एक लिखित रिपोर्ट और पोस्टर प्रेज़ेंटेशन पर खत्म होता है।"
outcomes:
  - en: "Design and carry out your own research study"
    zh: "设计并完成自己的研究"
    zh-TW: "設計並完成自己的研究"
    ja: "自分の研究を設計し実行する"
    ko: "자신의 연구 설계하고 수행하기"
    vi: "Thiết kế và thực hiện nghiên cứu của riêng mình"
    ms: "Reka dan jalankan kajian sendiri"
    id: "Merancang dan menjalankan penelitian sendiri"
    hi: "अपना शोध खुद डिज़ाइन करके पूरा करना"
  - en: "Find and use the key literature on your topic"
    zh: "查找并运用课题相关的重要文献"
    zh-TW: "查找並運用題目相關的重要文獻"
    ja: "テーマに関する主要な文献を探して使う"
    ko: "주제에 관한 핵심 문헌 찾아 활용하기"
    vi: "Tìm và dùng tài liệu quan trọng về chủ đề của mình"
    ms: "Cari dan guna literatur utama tentang topik anda"
    id: "Mencari dan memakai literatur utama tentang topikmu"
    hi: "अपने विषय से जुड़ा मुख्य साहित्य ढूँढना और इस्तेमाल करना"
  - en: "Present findings in a report and a poster"
    zh: "用报告和海报展示研究结果"
    zh-TW: "用報告和海報展示研究結果"
    ja: "研究結果をレポートとポスターで発表する"
    ko: "보고서와 포스터로 결과 발표하기"
    vi: "Trình bày kết quả bằng báo cáo và poster"
    ms: "Bentangkan dapatan dalam laporan dan poster"
    id: "Menyajikan temuan lewat laporan dan poster"
    hi: "नतीजों को रिपोर्ट और पोस्टर में प्रस्तुत करना"
