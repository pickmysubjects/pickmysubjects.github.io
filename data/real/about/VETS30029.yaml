code: VETS30029
year: 2026
learn:
  en: "Cells, tissues and body systems of domestic animals: anatomy, physiology, pharmacology, pathology and immunology."
  zh: "家养动物的细胞、组织与身体系统：解剖、生理、药理、病理与免疫。"
  zh-TW: "家畜的細胞、組織與身體系統：解剖、生理、藥理、病理與免疫。"
  ja: "家畜の細胞・組織・器官系：解剖、生理、薬理、病理、免疫。"
  ko: "가축의 세포·조직·신체 계통: 해부, 생리, 약리, 병리, 면역."
  vi: "Tế bào, mô và hệ cơ quan động vật nuôi: giải phẫu, sinh lý, dược lý, bệnh học, miễn dịch."
  ms: "Sel, tisu dan sistem badan haiwan domestik: anatomi, fisiologi, farmakologi, patologi, imunologi."
  id: "Sel, jaringan, dan sistem tubuh hewan domestik: anatomi, fisiologi, farmakologi, patologi, imunologi."
  hi: "घरेलू पशुओं की कोशिकाएँ, ऊतक और अंग तंत्र: शरीर रचना, शरीर क्रिया, औषध, रोग और प्रतिरक्षा।"
outcomes:
  - en: "Explain how body systems maintain homeostasis"
    zh: "解释身体系统如何维持稳态"
    zh-TW: "解釋身體系統如何維持恆定"
    ja: "器官系が恒常性を保つ仕組みを説明する"
    ko: "신체 계통의 항상성 유지를 설명한다"
    vi: "Giải thích cách các hệ cơ quan giữ cân bằng nội môi"
    ms: "Menerangkan cara sistem badan mengekalkan homeostasis"
    id: "Menjelaskan cara sistem tubuh menjaga homeostasis"
    hi: "शरीर तंत्र होमियोस्टेसिस कैसे बनाए रखते हैं, समझाना"
  - en: "Describe the immune system and immune responses"
    zh: "描述免疫系统及免疫反应"
    zh-TW: "描述免疫系統及免疫反應"
    ja: "免疫系と免疫応答を説明する"
    ko: "면역계와 면역 반응을 기술한다"
    vi: "Mô tả hệ miễn dịch và đáp ứng miễn dịch"
    ms: "Menghuraikan sistem dan tindak balas imun"
    id: "Mendeskripsikan sistem dan respons imun"
    hi: "प्रतिरक्षा तंत्र और प्रतिक्रिया का वर्णन करना"
  - en: "Apply pathology principles to clinical cases"
    zh: "将病理学原理用于临床病例"
    zh-TW: "將病理學原理應用於臨床案例"
    ja: "病理学の原理を臨床症例に応用する"
    ko: "병리학 원리를 임상 사례에 적용한다"
    vi: "Áp dụng nguyên lý bệnh học vào ca lâm sàng"
    ms: "Mengaplikasi prinsip patologi pada kes klinikal"
    id: "Menerapkan prinsip patologi pada kasus klinis"
    hi: "क्लिनिकल केसों पर रोगविज्ञान के सिद्धांत लागू करना"
