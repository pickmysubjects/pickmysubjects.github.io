code: DRAM30031
year: 2026
learn:
  en: "Final actor training: original solo work, heightened scenes with physical conflict, and settling your own training method."
  zh: "最后阶段的演员训练：原创独角戏、带肢体冲突的高强度场景，确立自己的训练方法。"
  zh-TW: "最後階段的演員訓練：原創獨角戲、帶肢體衝突的高強度場景，確立自己的訓練方法。"
  ja: "最後の俳優訓練：オリジナルの一人芝居、身体的な対立のある高強度の場面、自分の訓練法を確立。"
  ko: "마지막 배우 훈련: 창작 1인극, 신체 충돌이 있는 강도 높은 장면, 자신만의 훈련법 정립."
  vi: "Đào tạo diễn viên cuối cùng: tác phẩm độc diễn tự viết, cảnh xung đột hình thể và phương pháp tập riêng."
  ms: "Latihan pelakon akhir: karya solo asli, babak konflik fizikal dan kaedah latihan sendiri."
  id: "Latihan aktor akhir: karya solo orisinal, adegan konflik fisik dan metode latihan sendiri."
  hi: "अंतिम अभिनेता ट्रेनिंग: मौलिक सोलो काम, शारीरिक टकराव वाले दृश्य और अपनी ट्रेनिंग पद्धति तय करना।"
outcomes:
  - en: "Create and perform an original solo piece"
    zh: "创作并表演原创独角戏"
    zh-TW: "創作並表演原創獨角戲"
    ja: "オリジナルの一人芝居を作り演じる"
    ko: "창작 1인극 만들고 공연하기"
    vi: "Sáng tác và diễn một tiết mục độc diễn"
    ms: "Cipta dan persembahkan karya solo asli"
    id: "Membuat dan mementaskan karya solo"
    hi: "मौलिक सोलो पीस बनाकर प्रस्तुत करना"
  - en: "Handle heavy vocal and physical demands safely"
    zh: "安全应对高强度的声音与肢体要求"
    zh-TW: "安全應對高強度的聲音與肢體要求"
    ja: "声と身体の高い負荷に安全に対応する"
    ko: "높은 발성·신체 요구를 안전하게 다루기"
    vi: "Xử lý an toàn yêu cầu cao về giọng và thể chất"
    ms: "Hadapi tuntutan suara dan fizikal berat dengan selamat"
    id: "Menangani tuntutan suara dan fisik berat dengan aman"
    hi: "भारी आवाज़ी और शारीरिक माँग को सुरक्षित संभालना"
  - en: "Set your own long-term training method"
    zh: "建立长期的个人训练方法"
    zh-TW: "建立長期的個人訓練方法"
    ja: "長く使える自分の訓練法を作る"
    ko: "장기적인 자기 훈련법 세우기"
    vi: "Xây dựng phương pháp tập lâu dài của riêng bạn"
    ms: "Tetapkan kaedah latihan jangka panjang"
    id: "Menetapkan metode latihan jangka panjang"
    hi: "अपनी दीर्घकालिक ट्रेनिंग पद्धति तय करना"
