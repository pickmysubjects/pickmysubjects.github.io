code: GERM20010
year: 2026
learn:
  en: "High-level German on nature and identity in Germany, Austria and Switzerland, with the Alps as the main example."
  zh: "高级德语：德奥瑞三国的自然与身份认同，以阿尔卑斯山为主要例子。"
  zh-TW: "高級德語：德奧瑞三國的自然與身分認同，以阿爾卑斯山為主要例子。"
  ja: "上級ドイツ語で、ドイツ・オーストリア・スイスの自然とアイデンティティをアルプスを例に考える。"
  ko: "고급 독일어로 독일·오스트리아·스위스의 자연과 정체성을 알프스를 중심으로 다룬다."
  vi: "Tiếng Đức trình độ cao về thiên nhiên và bản sắc ở Đức, Áo, Thụy Sĩ, lấy dãy Alps làm ví dụ chính."
  ms: "Bahasa Jerman tahap tinggi tentang alam dan identiti di Jerman, Austria dan Switzerland, dengan Alps sebagai contoh utama."
  id: "Bahasa Jerman tingkat tinggi tentang alam dan identitas di Jerman, Austria dan Swiss, dengan Pegunungan Alpen sebagai contoh."
  hi: "जर्मनी, ऑस्ट्रिया और स्विट्ज़रलैंड में प्रकृति और पहचान पर उच्च-स्तरीय जर्मन, आल्प्स को मुख्य उदाहरण मानकर।"
outcomes:
  - en: "Discuss social and cultural topics in German"
    zh: "用德语讨论社会和文化话题"
    zh-TW: "用德語討論社會和文化話題"
    ja: "社会や文化の話題をドイツ語で話し合う"
    ko: "사회·문화 주제를 독일어로 토론하기"
    vi: "Thảo luận chủ đề xã hội, văn hóa bằng tiếng Đức"
    ms: "Bincangkan topik sosial dan budaya dalam bahasa Jerman"
    id: "Membahas topik sosial dan budaya dalam bahasa Jerman"
    hi: "सामाजिक और सांस्कृतिक विषयों पर जर्मन में चर्चा करना"
  - en: "Read and write longer German texts"
    zh: "读写较长的德语文章"
    zh-TW: "讀寫較長的德語文章"
    ja: "長めのドイツ語の文章を読み書きする"
    ko: "긴 독일어 글 읽고 쓰기"
    vi: "Đọc và viết văn bản tiếng Đức dài hơn"
    ms: "Baca dan tulis teks bahasa Jerman yang lebih panjang"
    id: "Membaca dan menulis teks bahasa Jerman yang lebih panjang"
    hi: "लंबे जर्मन पाठ पढ़ना-लिखना"
  - en: "Give a clear presentation in German"
    zh: "用德语做清楚的口头报告"
    zh-TW: "用德語做清楚的口頭報告"
    ja: "ドイツ語で分かりやすく発表する"
    ko: "독일어로 명확하게 발표하기"
    vi: "Thuyết trình rõ ràng bằng tiếng Đức"
    ms: "Buat pembentangan yang jelas dalam bahasa Jerman"
    id: "Melakukan presentasi yang jelas dalam bahasa Jerman"
    hi: "जर्मन में स्पष्ट प्रस्तुति देना"
