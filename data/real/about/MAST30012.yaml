code: MAST30012
year: 2026
learn:
  en: "Counting and building finite objects, like permutations and designs, often with efficient algorithms."
  zh: "有限对象的计数和构造，比如排列和设计，常配合高效算法。"
  zh-TW: "有限物件的計數和構造，比如排列和設計，常搭配高效演算法。"
  ja: "順列やデザインなど有限な対象の数え上げと構成。効率的なアルゴリズムも多用。"
  ko: "순열, 디자인 같은 유한 대상을 세고 만드는 법. 효율적인 알고리즘과 함께."
  vi: "Đếm và xây dựng đối tượng hữu hạn như hoán vị và thiết kế, thường kèm thuật toán hiệu quả."
  ms: "Mengira dan membina objek terhingga seperti pilih atur dan reka bentuk, selalunya dengan algoritma cekap."
  id: "Menghitung dan membangun objek hingga seperti permutasi dan desain, sering dengan algoritma efisien."
  hi: "क्रमचय और डिज़ाइन जैसी सीमित चीज़ों को गिनना और बनाना, अक्सर कुशल एल्गोरिद्म के साथ।"
outcomes:
  - en: "Solve counting and combinatorics problems"
    zh: "解计数和组合问题"
    zh-TW: "解計數和組合問題"
    ja: "数え上げと組合せの問題を解く"
    ko: "경우의 수와 조합 문제 풀기"
    vi: "Giải bài toán đếm và tổ hợp"
    ms: "Menyelesaikan masalah pengiraan dan kombinatorik"
    id: "Menyelesaikan soal pencacahan dan kombinatorika"
    hi: "गिनती और कॉम्बिनेटोरिक्स की समस्याएँ हल करना"
  - en: "Recognise links between discrete maths and other areas"
    zh: "看出离散数学和其他领域的联系"
    zh-TW: "看出離散數學和其他領域的關聯"
    ja: "離散数学と他分野のつながりを理解する"
    ko: "이산수학과 다른 분야의 연결 알아보기"
    vi: "Nhận ra mối liên hệ giữa toán rời rạc và lĩnh vực khác"
    ms: "Mengenal pasti kaitan matematik diskret dengan bidang lain"
    id: "Melihat kaitan matematika diskrit dengan bidang lain"
    hi: "डिस्क्रीट गणित और दूसरे क्षेत्रों का संबंध पहचानना"
