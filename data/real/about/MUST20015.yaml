code: MUST20015
year: 2026
learn:
  en: "Advanced acting, singing and dance shaped to style and character, with repertoire and audition classes."
  zh: "进阶的表演、演唱与舞蹈，配合风格与角色，并上曲目与试镜课。"
  zh-TW: "進階的表演、演唱與舞蹈，配合風格與角色，並上曲目與試鏡課。"
  ja: "様式と役に合わせた上級の演技・歌・ダンスに、レパートリーとオーディション授業。"
  ko: "양식과 인물에 맞춘 고급 연기·노래·춤, 레퍼토리와 오디션 수업."
  vi: "Diễn, hát, múa nâng cao theo phong cách và nhân vật, cùng lớp tiết mục và thử vai."
  ms: "Lakonan, nyanyian dan tarian lanjutan ikut gaya dan watak, dengan kelas repertoir dan uji bakat."
  id: "Akting, nyanyi dan tari lanjutan sesuai gaya dan tokoh, plus kelas repertoar dan audisi."
  hi: "शैली और किरदार के अनुसार उन्नत अभिनय, गायन और नृत्य, रेपर्टरी और ऑडिशन कक्षाएँ।"
outcomes:
  - en: "Build a performance repertoire"
    zh: "建立自己的演出曲目"
    zh-TW: "建立自己的演出曲目"
    ja: "自分のレパートリーを作る"
    ko: "공연 레퍼토리 만들기"
    vi: "Xây dựng danh mục tiết mục biểu diễn"
    ms: "Bina repertoir persembahan"
    id: "Membangun repertoar penampilan"
    hi: "प्रदर्शन रेपर्टरी बनाना"
  - en: "Perform choreography and solo singing"
    zh: "表演编舞与独唱"
    zh-TW: "表演編舞與獨唱"
    ja: "振付とソロ歌唱を上演する"
    ko: "안무와 솔로 노래 공연하기"
    vi: "Trình diễn vũ đạo và hát đơn"
    ms: "Persembah koreografi dan nyanyian solo"
    id: "Membawakan koreografi dan nyanyian solo"
    hi: "कोरियोग्राफ़ी और सोलो गायन प्रस्तुत करना"
  - en: "Reflect on your progress as a performer"
    zh: "反思自己作为演员的进步"
    zh-TW: "反思自己作為演員的進步"
    ja: "演者としての成長を振り返る"
    ko: "공연자로서의 성장 돌아보기"
    vi: "Suy ngẫm sự tiến bộ của mình khi biểu diễn"
    ms: "Renung kemajuan sebagai pelaku seni"
    id: "Merefleksikan kemajuan sebagai pemain"
    hi: "कलाकार के रूप में अपनी प्रगति पर विचार"
