code: PHIL20033
year: 2026
learn:
  en: "Old questions about mind and consciousness made urgent by AI: could a machine think or be conscious?"
  zh: "人工智能让关于心灵和意识的老问题变得紧迫：机器能思考或有意识吗？"
  zh-TW: "人工智慧讓關於心靈和意識的老問題變得緊迫：機器能思考或有意識嗎？"
  ja: "AIによって切実になった心と意識の古い問い。機械は考えたり意識を持ったりできるのか。"
  ko: "AI로 절실해진 마음과 의식에 관한 오래된 질문. 기계가 생각하거나 의식을 가질 수 있을까?"
  vi: "Những câu hỏi cũ về tâm trí và ý thức trở nên cấp bách nhờ AI: máy có thể suy nghĩ hay có ý thức không?"
  ms: "Soalan lama tentang minda dan kesedaran yang kini mendesak kerana AI: bolehkah mesin berfikir atau sedar?"
  id: "Pertanyaan lama tentang pikiran dan kesadaran yang kini mendesak karena AI: bisakah mesin berpikir atau sadar?"
  hi: "मन और चेतना के पुराने सवाल, जिन्हें AI ने ज़रूरी बना दिया है: क्या मशीन सोच सकती है या सचेत हो सकती है?"
outcomes:
  - en: "Explain major theories of the mind"
    zh: "说明主要的心灵理论"
    zh-TW: "說明主要的心靈理論"
    ja: "心についての主な理論を説明する"
    ko: "마음에 관한 주요 이론 설명하기"
    vi: "Giải thích các lý thuyết chính về tâm trí"
    ms: "Terangkan teori utama tentang minda"
    id: "Menjelaskan teori utama tentang pikiran"
    hi: "मन के मुख्य सिद्धांत समझाना"
  - en: "Assess arguments about machine consciousness"
    zh: "评估关于机器意识的论证"
    zh-TW: "評估關於機器意識的論證"
    ja: "機械の意識をめぐる議論を評価する"
    ko: "기계 의식에 관한 논증 평가하기"
    vi: "Đánh giá lập luận về ý thức của máy"
    ms: "Nilai hujah tentang kesedaran mesin"
    id: "Menilai argumen tentang kesadaran mesin"
    hi: "मशीन चेतना पर तर्कों को परखना"
  - en: "Write clear philosophical essays"
    zh: "写出清晰的哲学论文"
    zh-TW: "寫出清晰的哲學論文"
    ja: "明快な哲学エッセイを書く"
    ko: "명확한 철학 에세이 쓰기"
    vi: "Viết bài luận triết học rõ ràng"
    ms: "Tulis esei falsafah yang jelas"
    id: "Menulis esai filsafat yang jelas"
    hi: "साफ़ दार्शनिक निबंध लिखना"
