code: CVEN90067
year: 2027
learn:
  en: "Designing port structures such as wharves, jetties, fenders and breakwaters, taught with industry lecturers."
  zh: "设计码头、栈桥、护舷和防波堤等港口结构，并有业界讲师参与授课。"
  zh-TW: "設計碼頭、棧橋、碰墊與防波堤等港口結構，並有業界講師參與授課。"
  ja: "岸壁・桟橋・防舷材・防波堤などの港湾構造物の設計を、業界講師とともに学ぶ。"
  ko: "안벽·잔교·방충재·방파제 같은 항만 구조물 설계를 업계 강사와 함께 배운다."
  vi: "Thiết kế kết cấu cảng như bến, cầu tàu, đệm va và đê chắn sóng, có giảng viên từ ngành."
  ms: "Mereka bentuk struktur pelabuhan seperti dermaga, jeti, pelindung dan pemecah ombak, diajar bersama pensyarah industri."
  id: "Merancang struktur pelabuhan seperti dermaga, jeti, fender dan pemecah gelombang, diajar bersama pengajar industri."
  hi: "घाट, जेटी, फ़ेंडर और ब्रेकवॉटर जैसी बंदरगाह संरचनाओं का डिज़ाइन, उद्योग के व्याख्याताओं के साथ।"
outcomes:
  - en: "Analyse basic port structures"
    zh: "分析基本港口结构"
    zh-TW: "分析基本港口結構"
    ja: "基本的な港湾構造物を解析する"
    ko: "기본 항만 구조물 해석하기"
    vi: "Phân tích kết cấu cảng cơ bản"
    ms: "Menganalisis struktur pelabuhan asas"
    id: "Menganalisis struktur pelabuhan dasar"
    hi: "बुनियादी बंदरगाह संरचनाओं का विश्लेषण"
  - en: "Use the relevant codes and guidelines in port design"
    zh: "在港口设计中运用相关规范和指南"
    zh-TW: "在港口設計中運用相關規範與指引"
    ja: "港湾設計で関連の基準と指針を使う"
    ko: "항만 설계에 관련 기준과 지침 적용하기"
    vi: "Áp dụng tiêu chuẩn và hướng dẫn liên quan trong thiết kế cảng"
    ms: "Menggunakan kod dan garis panduan berkaitan dalam reka bentuk pelabuhan"
    id: "Memakai kode dan pedoman terkait dalam desain pelabuhan"
    hi: "बंदरगाह डिज़ाइन में संबंधित कोड और दिशानिर्देश लागू करना"
