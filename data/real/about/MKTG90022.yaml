code: MKTG90022
year: 2027
learn:
  en: "Turning scientific discoveries into businesses: intellectual property, commercial plans and finance."
  zh: "把科学发现变成生意：知识产权、商业计划和融资。"
  zh-TW: "把科學發現變成生意：智慧財產、商業計畫與融資。"
  ja: "科学的発見を事業にする：知的財産、事業計画、資金調達。"
  ko: "과학적 발견의 사업화: 지식재산, 사업 계획, 자금 조달."
  vi: "Biến phát minh khoa học thành kinh doanh: sở hữu trí tuệ, kế hoạch thương mại và tài chính."
  ms: "Mengkomersialkan penemuan sains: harta intelek, pelan komersial dan pembiayaan."
  id: "Mengubah penemuan ilmiah menjadi bisnis: kekayaan intelektual, rencana komersial, dan pendanaan."
  hi: "वैज्ञानिक खोजों को व्यवसाय बनाना: बौद्धिक संपदा, व्यावसायिक योजना और वित्त।"
outcomes:
  - en: "Assess the commercial value of a discovery"
    zh: "评估一项发现的商业价值"
    zh-TW: "評估一項發現的商業價值"
    ja: "発見の商業的価値を評価する"
    ko: "발견의 상업적 가치 평가하기"
    vi: "Đánh giá giá trị thương mại của phát minh"
    ms: "Menilai nilai komersial sesuatu penemuan"
    id: "Menilai nilai komersial suatu penemuan"
    hi: "किसी खोज का व्यावसायिक मूल्य आँकना"
  - en: "Protect and manage intellectual property"
    zh: "保护和管理知识产权"
    zh-TW: "保護與管理智慧財產"
    ja: "知的財産を保護・管理する"
    ko: "지식재산 보호·관리하기"
    vi: "Bảo hộ và quản lý sở hữu trí tuệ"
    ms: "Melindungi dan mengurus harta intelek"
    id: "Melindungi dan mengelola kekayaan intelektual"
    hi: "बौद्धिक संपदा की सुरक्षा और प्रबंधन"
  - en: "Plan the steps to commercialise a discovery"
    zh: "规划一项发现商业化的步骤"
    zh-TW: "規劃一項發現商業化的步驟"
    ja: "発見を事業化する手順を計画する"
    ko: "발견의 사업화 단계 계획하기"
    vi: "Lập các bước thương mại hóa phát minh"
    ms: "Merancang langkah mengkomersialkan penemuan"
    id: "Merencanakan langkah komersialisasi penemuan"
    hi: "किसी खोज के व्यवसायीकरण के चरण तय करना"
