code: AGRI20027
year: 2026
learn:
  en: "A five-day Dookie intensive following grapes from vineyard to finished wine, with practicals and a field trip."
  zh: "Dookie五天密集课，从葡萄园一路跟到成酒，有实践课和实地考察。"
  zh-TW: "Dookie五天密集課，從葡萄園一路跟到成酒，有實作課與實地考察。"
  ja: "Dookieでの5日間集中講義。畑からワインになるまでを実習と見学で追う。"
  ko: "Dookie 5일 집중 과정. 포도밭에서 완성 와인까지 실습과 현장 학습으로 따라간다."
  vi: "Khóa 5 ngày ở Dookie theo nho từ vườn đến chai vang, có thực hành và đi thực địa."
  ms: "Intensif lima hari di Dookie mengikut anggur dari ladang ke wain, dengan amali dan lawatan."
  id: "Intensif lima hari di Dookie mengikuti anggur dari kebun ke botol, dengan praktikum dan kunjungan."
  hi: "Dookie में पाँच दिन: अंगूर के बाग़ से तैयार वाइन तक, प्रैक्टिकल और फ़ील्ड ट्रिप के साथ।"
outcomes:
  - en: "Explain how vineyard choices shape grape quality"
    zh: "说明葡萄园管理如何影响葡萄品质"
    zh-TW: "說明葡萄園管理如何影響葡萄品質"
    ja: "畑の管理がブドウの品質にどう影響するか説明する"
    ko: "포도밭 관리가 포도 품질에 주는 영향 설명하기"
    vi: "Giải thích cách quản lý vườn ảnh hưởng chất lượng nho"
    ms: "Jelaskan kesan pengurusan ladang pada mutu anggur"
    id: "Menjelaskan pengaruh pengelolaan kebun pada mutu anggur"
    hi: "बाग़ के फ़ैसले अंगूर की गुणवत्ता पर कैसे असर डालते हैं"
  - en: "Describe the main winemaking steps"
    zh: "描述酿酒的主要步骤"
    zh-TW: "描述釀酒的主要步驟"
    ja: "醸造の主な工程を説明する"
    ko: "주요 양조 단계 설명하기"
    vi: "Mô tả các bước làm vang chính"
    ms: "Huraikan langkah utama pembuatan wain"
    id: "Menjelaskan tahapan utama pembuatan anggur"
    hi: "वाइन बनाने के मुख्य चरण बताना"
  - en: "Judge how process affects the finished wine"
    zh: "判断工艺如何影响成酒"
    zh-TW: "判斷工藝如何影響成酒"
    ja: "工程が完成したワインに与える影響を判断する"
    ko: "공정이 완성 와인에 주는 영향 판단하기"
    vi: "Đánh giá quy trình ảnh hưởng vang thành phẩm"
    ms: "Nilai kesan proses pada wain siap"
    id: "Menilai pengaruh proses pada anggur jadi"
    hi: "प्रक्रिया का तैयार वाइन पर असर परखना"
