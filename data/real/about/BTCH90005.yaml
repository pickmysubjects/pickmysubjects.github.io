code: BTCH90005
year: 2027
learn:
  en: "Advanced molecular techniques for studying gene and protein function, with practicals and talks."
  zh: "研究基因和蛋白质功能的高级分子技术，含实验课和报告。"
  zh-TW: "研究基因與蛋白質功能的進階分子技術，含實驗課與報告。"
  ja: "遺伝子・タンパク質機能を調べる高度な分子技術。実習と発表あり。"
  ko: "유전자·단백질 기능 연구를 위한 고급 분자 기법, 실습과 발표 포함."
  vi: "Kỹ thuật phân tử nâng cao để nghiên cứu chức năng gen và protein, có thực hành và thuyết trình."
  ms: "Teknik molekul lanjutan untuk mengkaji fungsi gen dan protein, dengan amali dan pembentangan."
  id: "Teknik molekuler lanjut untuk mempelajari fungsi gen dan protein, dengan praktikum dan presentasi."
  hi: "जीन और प्रोटीन कार्य समझने की उन्नत आणविक तकनीकें, प्रैक्टिकल और प्रस्तुति के साथ।"
outcomes:
  - en: "Understand advanced molecular biology tools"
    zh: "理解高级分子生物学工具"
    zh-TW: "理解進階分子生物學工具"
    ja: "高度な分子生物学ツールを理解する"
    ko: "고급 분자생물학 도구 이해하기"
    vi: "Hiểu các công cụ sinh học phân tử nâng cao"
    ms: "Memahami alat biologi molekul lanjutan"
    id: "Memahami alat biologi molekuler lanjut"
    hi: "उन्नत आणविक जीवविज्ञान टूल समझना"
  - en: "Use techniques to study genes and proteins"
    zh: "运用技术研究基因和蛋白质"
    zh-TW: "運用技術研究基因與蛋白質"
    ja: "遺伝子とタンパク質を調べる手法を使う"
    ko: "유전자·단백질 연구 기법 활용하기"
    vi: "Dùng kỹ thuật nghiên cứu gen và protein"
    ms: "Menggunakan teknik mengkaji gen dan protein"
    id: "Memakai teknik untuk meneliti gen dan protein"
    hi: "जीन और प्रोटीन अध्ययन की तकनीक लगाना"
  - en: "Critically appraise new data from these methods"
    zh: "批判性评估这些方法产生的新数据"
    zh-TW: "批判性評估這些方法產生的新資料"
    ja: "これらの手法の新データを批判的に評価する"
    ko: "이 기법들의 새 데이터 비판적으로 평가하기"
    vi: "Đánh giá phản biện dữ liệu mới từ các phương pháp"
    ms: "Menilai data baharu secara kritis"
    id: "Menilai data baru secara kritis"
    hi: "इन विधियों के नए डेटा का आलोचनात्मक आकलन"
