code: BLAW10001
year: 2026
learn:
  en: "An introduction to law for business: contracts, consumer protection, property, negligence and agency."
  zh: "面向各专业的商法入门：合同、消费者保护、财产、过失和代理。"
  zh-TW: "面向各科系的商法入門：契約、消費者保護、財產、過失和代理。"
  ja: "ビジネスのための法律入門：契約、消費者保護、財産、過失、代理。"
  ko: "비즈니스를 위한 법 입문: 계약, 소비자 보호, 재산, 과실, 대리."
  vi: "Nhập môn luật cho kinh doanh: hợp đồng, bảo vệ người tiêu dùng, tài sản, sơ suất và đại lý."
  ms: "Pengenalan undang-undang perniagaan: kontrak, perlindungan pengguna, harta, kecuaian dan agensi."
  id: "Pengantar hukum bisnis: kontrak, perlindungan konsumen, properti, kelalaian, dan keagenan."
  hi: "बिज़नेस के लिए कानून का परिचय: कॉन्ट्रैक्ट, उपभोक्ता सुरक्षा, संपत्ति, लापरवाही और एजेंसी।"
outcomes:
  - en: "Read and apply legislation and case law"
    zh: "读懂并运用法律条文和判例"
    zh-TW: "讀懂並運用法律條文和判例"
    ja: "法令と判例を読んで適用する"
    ko: "법령과 판례를 읽고 적용하기"
    vi: "Đọc và áp dụng luật thành văn và án lệ"
    ms: "Baca dan guna perundangan dan undang-undang kes"
    id: "Membaca dan menerapkan undang-undang dan yurisprudensi"
    hi: "कानून और केस लॉ पढ़ना व लागू करना"
  - en: "Work out if a contract was formed or broken"
    zh: "判断合同是否成立或违约"
    zh-TW: "判斷契約是否成立或違約"
    ja: "契約が成立したか、違反されたかを判断する"
    ko: "계약이 성립했는지, 위반됐는지 판단하기"
    vi: "Xác định hợp đồng đã hình thành hay bị vi phạm"
    ms: "Tentukan sama ada kontrak terbentuk atau dilanggar"
    id: "Menentukan apakah kontrak terbentuk atau dilanggar"
    hi: "तय करना कि कॉन्ट्रैक्ट बना या टूटा"
  - en: "Spot legal risks in everyday business"
    zh: "发现日常商业中的法律风险"
    zh-TW: "發現日常商業中的法律風險"
    ja: "日常のビジネスに潜む法的リスクに気づく"
    ko: "일상 업무 속 법적 위험 찾기"
    vi: "Nhận ra rủi ro pháp lý trong kinh doanh hằng ngày"
    ms: "Kesan risiko undang-undang dalam perniagaan harian"
    id: "Mengenali risiko hukum dalam bisnis sehari-hari"
    hi: "रोज़ के बिज़नेस में कानूनी जोखिम पहचानना"
