code: ENGR10006
year: 2026
learn:
  en: "Taking a real engineering project from idea to finished design in a small team, using modelling and computer tools."
  zh: "以小组形式用建模和计算机工具，把真实工程项目从构想做到成品设计。"
  zh-TW: "以小組形式用建模和電腦工具，把真實工程專案從構想做到完成設計。"
  ja: "小チームでモデル化とコンピュータツールを使い、実際の工学プロジェクトを構想から設計まで進める。"
  ko: "소규모 팀으로 모델링과 컴퓨터 도구를 써서 실제 공학 프로젝트를 구상부터 설계까지 진행한다."
  vi: "Làm việc nhóm nhỏ, dùng mô hình và công cụ máy tính đưa một dự án kỹ thuật thật từ ý tưởng đến thiết kế."
  ms: "Bawa projek kejuruteraan sebenar dari idea ke reka bentuk siap dalam pasukan kecil, guna pemodelan dan alat komputer."
  id: "Membawa proyek teknik nyata dari ide ke desain jadi dalam tim kecil, dengan pemodelan dan alat komputer."
  hi: "छोटी टीम में मॉडलिंग और कंप्यूटर टूल से असली इंजीनियरिंग प्रोजेक्ट को आइडिया से डिज़ाइन तक ले जाना।"
outcomes:
  - en: "Build models to analyse and design systems"
    zh: "建立模型来分析和设计系统"
    zh-TW: "建立模型來分析和設計系統"
    ja: "モデルを作りシステムを分析・設計する"
    ko: "모델을 만들어 시스템을 분석·설계한다"
    vi: "Xây mô hình để phân tích và thiết kế hệ thống"
    ms: "Bina model untuk analisis dan reka sistem"
    id: "Membangun model untuk analisis dan desain"
    hi: "मॉडल बनाकर सिस्टम का विश्लेषण और डिज़ाइन करना"
  - en: "Plan and manage an engineering project"
    zh: "规划并管理工程项目"
    zh-TW: "規劃並管理工程專案"
    ja: "工学プロジェクトを計画・管理する"
    ko: "공학 프로젝트를 계획·관리한다"
    vi: "Lập kế hoạch và quản lý dự án kỹ thuật"
    ms: "Rancang dan urus projek kejuruteraan"
    id: "Merencanakan dan mengelola proyek teknik"
    hi: "इंजीनियरिंग प्रोजेक्ट की योजना और प्रबंधन करना"
  - en: "Use computer tools for design and analysis"
    zh: "用计算机工具做设计和分析"
    zh-TW: "用電腦工具做設計和分析"
    ja: "コンピュータツールで設計と解析をする"
    ko: "컴퓨터 도구로 설계와 분석하기"
    vi: "Dùng công cụ máy tính để thiết kế và phân tích"
    ms: "Guna alat komputer untuk reka bentuk dan analisis"
    id: "Memakai perangkat komputer untuk desain dan analisis"
    hi: "डिज़ाइन और विश्लेषण के लिए कंप्यूटर टूल्स इस्तेमाल करना"
