code: FINA20032
year: 2026
learn:
  en: "Art and culture in the 21st century: describe and interpret recent works, with group work and an oral assessment."
  zh: "21世纪的艺术与文化：描述和解读近期作品，含小组展示与口头考核。"
  zh-TW: "21世紀的藝術與文化：描述和解讀近期作品，含小組報告與口頭評量。"
  ja: "21世紀の美術と文化：近年の作品を記述・解釈し、グループ発表と口頭評価も。"
  ko: "21세기 미술과 문화: 최근 작품을 서술·해석하고 그룹 발표와 구술 평가."
  vi: "Nghệ thuật và văn hóa thế kỷ 21: mô tả, diễn giải tác phẩm gần đây, có thuyết trình nhóm."
  ms: "Seni dan budaya abad ke-21: huraikan dan tafsir karya terkini, dengan kerja kumpulan."
  id: "Seni dan budaya abad ke-21: menjelaskan dan menafsirkan karya terkini, ada kerja kelompok."
  hi: "21वीं सदी की कला और संस्कृति: हाल की कृतियों का वर्णन और व्याख्या, समूह कार्य सहित।"
outcomes:
  - en: "Interpret recent artworks in context"
    zh: "结合背景解读近期艺术作品"
    zh-TW: "結合背景解讀近期藝術作品"
    ja: "近年の作品を文脈の中で解釈する"
    ko: "최근 작품을 맥락 속에서 해석하기"
    vi: "Diễn giải tác phẩm gần đây theo bối cảnh"
    ms: "Tafsir karya seni terkini dalam konteks"
    id: "Menafsirkan karya terkini dalam konteks"
    hi: "हाल की कृतियों की संदर्भ में व्याख्या"
  - en: "Give a group presentation"
    zh: "完成小组展示"
    zh-TW: "完成小組報告"
    ja: "グループ発表を行う"
    ko: "그룹 발표하기"
    vi: "Thuyết trình theo nhóm"
    ms: "Buat pembentangan kumpulan"
    id: "Melakukan presentasi kelompok"
    hi: "समूह प्रस्तुति देना"
  - en: "Defend your ideas in an oral assessment"
    zh: "在口头考核中阐述观点"
    zh-TW: "在口頭評量中闡述觀點"
    ja: "口頭評価で自分の考えを説明する"
    ko: "구술 평가에서 생각 설명하기"
    vi: "Bảo vệ ý kiến trong bài vấn đáp"
    ms: "Pertahankan idea dalam penilaian lisan"
    id: "Mempertahankan gagasan dalam asesmen lisan"
    hi: "मौखिक मूल्यांकन में अपने विचार रखना"
