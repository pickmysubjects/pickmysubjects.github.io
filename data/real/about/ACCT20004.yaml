code: ACCT20004
year: 2026
learn:
  en: "Tricky financial accounting topics such as share options, intangibles, financial instruments and derivatives."
  zh: "较难的财务会计主题，如股票期权、无形资产、金融工具和衍生品。"
  zh-TW: "較難的財務會計主題，如股票選擇權、無形資產、金融工具和衍生性商品。"
  ja: "ストックオプション、無形資産、金融商品、デリバティブなど難しい財務会計。"
  ko: "스톡옵션, 무형자산, 금융상품, 파생상품 같은 까다로운 재무회계 주제."
  vi: "Các chủ đề kế toán tài chính khó như quyền chọn cổ phiếu, tài sản vô hình, công cụ tài chính và phái sinh."
  ms: "Topik perakaunan kewangan sukar seperti opsyen saham, aset tak ketara, instrumen kewangan dan derivatif."
  id: "Topik akuntansi keuangan yang sulit seperti opsi saham, aset tak berwujud, instrumen keuangan, dan derivatif."
  hi: "वित्तीय लेखांकन के कठिन विषय, जैसे शेयर ऑप्शन, अमूर्त संपत्ति, वित्तीय साधन और डेरिवेटिव।"
outcomes:
  - en: "Pull the key accounting facts from an unfamiliar case"
    zh: "从陌生案例中提取关键会计信息"
    zh-TW: "從陌生案例中擷取關鍵會計資訊"
    ja: "初見の事例から重要な会計情報を引き出す"
    ko: "낯선 사례에서 핵심 회계 정보 뽑아내기"
    vi: "Rút thông tin kế toán chính từ tình huống lạ"
    ms: "Ambil fakta perakaunan utama daripada kes asing"
    id: "Mengambil informasi akuntansi kunci dari kasus baru"
    hi: "अनजान केस से ज़रूरी अकाउंटिंग जानकारी निकालना"
  - en: "Apply Accounting Standards to complex issues"
    zh: "把会计准则用于复杂问题"
    zh-TW: "把會計準則用於複雜問題"
    ja: "複雑な論点に会計基準を当てはめる"
    ko: "복잡한 문제에 회계기준 적용"
    vi: "Áp dụng chuẩn mực kế toán cho vấn đề phức tạp"
    ms: "Guna piawaian perakaunan pada isu kompleks"
    id: "Menerapkan standar akuntansi pada masalah rumit"
    hi: "जटिल मुद्दों पर अकाउंटिंग स्टैंडर्ड लागू करना"
  - en: "Compare results from different allowed accounting methods"
    zh: "比较不同可选会计方法的结果"
    zh-TW: "比較不同可選會計方法的結果"
    ja: "認められた会計処理ごとの結果を比べる"
    ko: "허용된 여러 회계 방법의 결과 비교"
    vi: "So sánh kết quả của các phương pháp kế toán được phép"
    ms: "Banding hasil kaedah perakaunan berbeza yang dibenarkan"
    id: "Membandingkan hasil berbagai metode akuntansi yang diizinkan"
    hi: "अनुमत अलग-अलग अकाउंटिंग तरीक़ों के नतीजों की तुलना"
