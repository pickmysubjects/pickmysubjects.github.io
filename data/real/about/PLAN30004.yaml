code: PLAN30004
year: 2026
learn:
  en: "Plan city transport beyond the car: public transport, walking, cycling and micromobility, for fair and green access."
  zh: "超越汽车的城市交通规划：公共交通、步行、骑行与微出行，追求公平与绿色。"
  zh-TW: "超越汽車的城市交通規劃：大眾運輸、步行、自行車與微型移動，追求公平與綠色。"
  ja: "車に頼らない都市交通計画：公共交通、徒歩、自転車、マイクロモビリティで公平で環境に優しく。"
  ko: "자동차를 넘어선 도시 교통 계획: 대중교통·보행·자전거·마이크로모빌리티로 공정하고 친환경적으로."
  vi: "Quy hoạch giao thông ngoài ô tô: công cộng, đi bộ, xe đạp, phương tiện nhỏ, công bằng và xanh."
  ms: "Rancang pengangkutan bandar selain kereta: awam, berjalan, berbasikal, mikromobiliti, adil dan hijau."
  id: "Merencanakan transportasi kota selain mobil: umum, jalan kaki, sepeda, mikromobilitas, adil dan hijau."
  hi: "कार से आगे शहरी परिवहन योजना: सार्वजनिक परिवहन, पैदल, साइकिल, माइक्रोमोबिलिटी, न्यायसंगत और हरित।"
outcomes:
  - en: "Link transport systems to urban form"
    zh: "把交通系统与城市形态联系起来"
    zh-TW: "把交通系統與城市形態連結起來"
    ja: "交通体系と都市形態を結びつける"
    ko: "교통 체계와 도시 형태 연결하기"
    vi: "Gắn hệ thống giao thông với hình thái đô thị"
    ms: "Kaitkan sistem pengangkutan dengan bentuk bandar"
    id: "Mengaitkan sistem transportasi dengan bentuk kota"
    hi: "परिवहन व्यवस्था को शहरी रूप से जोड़ना"
  - en: "Weigh equity and sustainability in mobility"
    zh: "权衡出行中的公平与可持续"
    zh-TW: "權衡移動中的公平與永續"
    ja: "移動の公平性と持続可能性を比較検討する"
    ko: "이동의 형평성과 지속가능성 따져보기"
    vi: "Cân nhắc công bằng và bền vững trong di chuyển"
    ms: "Timbang ekuiti dan kelestarian mobiliti"
    id: "Menimbang keadilan dan keberlanjutan mobilitas"
    hi: "आवाजाही में समानता और टिकाऊपन तौलना"
  - en: "Propose strategies to improve access"
    zh: "提出改善可达性的策略"
    zh-TW: "提出改善可及性的策略"
    ja: "アクセス改善の戦略を提案する"
    ko: "접근성 개선 전략 제안하기"
    vi: "Đề xuất chiến lược cải thiện khả năng tiếp cận"
    ms: "Cadangkan strategi meningkatkan akses"
    id: "Mengusulkan strategi peningkatan akses"
    hi: "पहुँच सुधारने की रणनीतियाँ सुझाना"
