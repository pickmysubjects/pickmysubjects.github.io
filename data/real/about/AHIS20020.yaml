code: AHIS20020
year: 2026
learn:
  en: "Avant-garde art of the 20th century, mainly in Europe and North America, and its links to politics and utopian ideas."
  zh: "20世纪的先锋艺术，以欧洲和北美为主，以及它与政治和乌托邦理想的关联。"
  zh-TW: "20世紀的前衛藝術，以歐洲和北美為主，以及它與政治和烏托邦理想的關聯。"
  ja: "主に欧米を中心とする20世紀の前衛美術と、政治やユートピア思想とのつながりを学ぶ。"
  ko: "주로 유럽과 북미의 20세기 아방가르드 미술과 정치·유토피아 사상과의 관계를 배운다."
  vi: "Nghệ thuật tiên phong thế kỷ 20, chủ yếu ở châu Âu và Bắc Mỹ, và mối liên hệ với chính trị, lý tưởng không tưởng."
  ms: "Seni avant-garde abad ke-20, terutama di Eropah dan Amerika Utara, serta kaitannya dengan politik dan idea utopia."
  id: "Seni avant-garde abad ke-20, terutama di Eropa dan Amerika Utara, serta kaitannya dengan politik dan gagasan utopia."
  hi: "20वीं सदी की अवांगार्द कला, मुख्यतः यूरोप और उत्तरी अमेरिका में, और राजनीति व आदर्शलोकी विचारों से उसके संबंध।"
outcomes:
  - en: "Describe key avant-garde movements"
    zh: "描述主要的先锋派运动"
    zh-TW: "描述主要的前衛派運動"
    ja: "主な前衛運動を説明する"
    ko: "주요 아방가르드 운동 설명하기"
    vi: "Mô tả các trào lưu tiên phong chính"
    ms: "Huraikan gerakan avant-garde utama"
    id: "Menguraikan gerakan avant-garde utama"
    hi: "मुख्य अवांगार्द आंदोलनों का वर्णन करना"
  - en: "Read artists' manifestos in context"
    zh: "结合背景阅读艺术家宣言"
    zh-TW: "結合背景閱讀藝術家宣言"
    ja: "芸術家の宣言を文脈の中で読む"
    ko: "맥락 속에서 예술가 선언문 읽기"
    vi: "Đọc các tuyên ngôn nghệ sĩ trong bối cảnh"
    ms: "Baca manifesto artis dalam konteksnya"
    id: "Membaca manifesto seniman dalam konteksnya"
    hi: "कलाकारों के घोषणापत्र संदर्भ में पढ़ना"
  - en: "Discuss the links between art and politics"
    zh: "讨论艺术与政治的关联"
    zh-TW: "討論藝術與政治的關聯"
    ja: "芸術と政治のつながりを論じる"
    ko: "예술과 정치의 관계 논의하기"
    vi: "Thảo luận mối liên hệ giữa nghệ thuật và chính trị"
    ms: "Bincangkan kaitan antara seni dan politik"
    id: "Membahas kaitan antara seni dan politik"
    hi: "कला और राजनीति के संबंधों पर चर्चा करना"
