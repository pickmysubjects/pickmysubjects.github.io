code: SCIE90011
year: 2027
learn:
  en: "Taking a scientific idea from the lab to a real product, using design thinking, IP strategy and feasibility checks."
  zh: "用设计思维、知识产权策略和可行性评估，把科学想法从实验室带成真实产品。"
  zh-TW: "用設計思維、智慧財產策略與可行性評估，把科學想法從實驗室帶成真實產品。"
  ja: "デザイン思考、知財戦略、実現可能性の評価で、研究のアイデアを製品にする。"
  ko: "디자인 사고, 지식재산 전략, 타당성 평가로 연구 아이디어를 실제 제품으로."
  vi: "Đưa ý tưởng khoa học từ phòng thí nghiệm thành sản phẩm bằng tư duy thiết kế, chiến lược sở hữu trí tuệ và đánh giá khả thi."
  ms: "Membawa idea sains dari makmal kepada produk sebenar dengan pemikiran reka bentuk, strategi IP dan semakan kebolehlaksanaan."
  id: "Membawa ide ilmiah dari lab menjadi produk nyata dengan design thinking, strategi HKI, dan uji kelayakan."
  hi: "डिज़ाइन थिंकिंग, IP रणनीति और व्यवहार्यता जाँच से वैज्ञानिक विचार को लैब से असली उत्पाद तक ले जाना।"
outcomes:
  - en: "Apply design thinking to product development"
    zh: "把设计思维用于产品开发"
    zh-TW: "把設計思維用於產品開發"
    ja: "製品開発にデザイン思考を使う"
    ko: "제품 개발에 디자인 사고 적용하기"
    vi: "Áp dụng tư duy thiết kế vào phát triển sản phẩm"
    ms: "Menggunakan pemikiran reka bentuk dalam pembangunan produk"
    id: "Menerapkan design thinking dalam pengembangan produk"
    hi: "उत्पाद विकास में डिज़ाइन थिंकिंग लागू करना"
  - en: "Assess feasibility with techno-economic and life cycle analysis"
    zh: "用技术经济分析和生命周期评价评估可行性"
    zh-TW: "用技術經濟分析與生命週期評估評估可行性"
    ja: "技術経済分析とLCAで実現可能性を評価する"
    ko: "기술경제성 분석과 전과정평가로 타당성 평가하기"
    vi: "Đánh giá khả thi bằng phân tích kinh tế - kỹ thuật và vòng đời"
    ms: "Menilai kebolehlaksanaan dengan analisis tekno-ekonomi dan kitaran hayat"
    id: "Menilai kelayakan dengan analisis tekno-ekonomi dan siklus hidup"
    hi: "टेक्नो-इकोनॉमिक और जीवन चक्र विश्लेषण से व्यवहार्यता आँकना"
