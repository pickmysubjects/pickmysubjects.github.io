code: MUSI20160
year: 2026
learn:
  en: "Ear training on modal and chromatic music and tricky meters, using sight-singing, rhythm and dictation."
  zh: "针对调式、半音音乐和复杂节拍的练耳：视唱、节奏和听写。"
  zh-TW: "針對調式、半音音樂和複雜節拍的練耳：視唱、節奏和聽寫。"
  ja: "旋法・半音階や変拍子の聴音訓練。視唱、リズム、書き取り。"
  ko: "선법·반음계 음악과 복잡한 박자 청음 훈련: 시창, 리듬, 받아쓰기."
  vi: "Luyện tai cho nhạc điệu thức, bán cung và nhịp khó: xướng âm, tiết tấu, ký âm."
  ms: "Latihan pendengaran muzik mod, kromatik dan meter sukar: nyanyian, ritma, imlak."
  id: "Latihan pendengaran musik modal, kromatik dan birama rumit: solfeggio, ritme, dikte."
  hi: "मोडल, क्रोमैटिक संगीत और कठिन ताल पर कान की ट्रेनिंग: गायन, लय, डिक्टेशन।"
outcomes:
  - en: "Sight-sing harder melodies and bass lines"
    zh: "视唱较难的旋律和低音线"
    zh-TW: "視唱較難的旋律和低音線"
    ja: "難しい旋律とベースを視唱する"
    ko: "어려운 선율과 베이스 시창하기"
    vi: "Xướng âm giai điệu và bè trầm khó"
    ms: "Nyanyi lihat melodi dan bes lebih sukar"
    id: "Menyanyikan melodi dan bas yang lebih sulit"
    hi: "कठिन धुन और बेस लाइन देखकर गाना"
  - en: "Perform complex rhythms and changing meters"
    zh: "演奏复杂节奏和变换拍子"
    zh-TW: "演奏複雜節奏和變換拍子"
    ja: "複雑なリズムと変拍子をこなす"
    ko: "복잡한 리듬과 변박 연주하기"
    vi: "Thể hiện nhịp phức tạp và đổi nhịp"
    ms: "Persembah ritma kompleks dan meter berubah"
    id: "Membawakan ritme kompleks dan birama berubah"
    hi: "जटिल लय और बदलती ताल बजाना"
  - en: "Transcribe melodies and chord progressions"
    zh: "听写旋律与和弦进行"
    zh-TW: "聽寫旋律與和弦進行"
    ja: "旋律とコード進行を書き取る"
    ko: "선율과 화성 진행 받아쓰기"
    vi: "Ký âm giai điệu và vòng hợp âm"
    ms: "Transkripsi melodi dan progresi kord"
    id: "Mentranskripsi melodi dan progresi akor"
    hi: "धुन और कॉर्ड प्रोग्रेशन लिखना"
