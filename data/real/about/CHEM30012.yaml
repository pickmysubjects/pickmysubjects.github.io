code: CHEM30012
year: 2026
learn:
  en: "Pollutants in water and soil, and the lab instruments used to detect and measure them."
  zh: "水和土壤里的污染物，以及检测它们的分析仪器。"
  zh-TW: "水和土壤裡的汙染物，以及檢測它們的分析儀器。"
  ja: "水と土壌の汚染物質と、それを検出・測定する実験機器。"
  ko: "물과 토양의 오염물질, 그리고 이를 검출·측정하는 실험 기기."
  vi: "Chất ô nhiễm trong nước và đất, cùng thiết bị phát hiện và đo chúng."
  ms: "Bahan cemar dalam air dan tanah, serta alat makmal untuk mengesan dan mengukurnya."
  id: "Polutan di air dan tanah, serta alat lab untuk mendeteksi dan mengukurnya."
  hi: "पानी और मिट्टी के प्रदूषक, और उन्हें पकड़ने व मापने के लैब उपकरण।"
outcomes:
  - en: "Measure contaminants in real environmental samples"
    zh: "测定真实环境样品中的污染物"
    zh-TW: "測定真實環境樣品中的汙染物"
    ja: "実際の環境試料に含まれる汚染物質を測る"
    ko: "실제 환경 시료의 오염물질 측정하기"
    vi: "Đo chất ô nhiễm trong mẫu môi trường thật"
    ms: "Ukur bahan cemar dalam sampel alam sekitar sebenar"
    id: "Mengukur kontaminan pada sampel lingkungan nyata"
    hi: "असली पर्यावरण सैंपल में प्रदूषक मापना"
  - en: "Operate advanced analytical instruments safely"
    zh: "安全操作高级分析仪器"
    zh-TW: "安全操作高階分析儀器"
    ja: "高度な分析機器を安全に操作する"
    ko: "고급 분석 기기를 안전하게 다루기"
    vi: "Vận hành an toàn thiết bị phân tích hiện đại"
    ms: "Kendali alat analisis canggih dengan selamat"
    id: "Mengoperasikan alat analisis canggih dengan aman"
    hi: "एडवांस्ड विश्लेषण उपकरण सुरक्षित चलाना"
  - en: "Draw sound conclusions from analytical data"
    zh: "从分析数据得出可靠结论"
    zh-TW: "從分析資料得出可靠結論"
    ja: "分析データから妥当な結論を出す"
    ko: "분석 데이터에서 타당한 결론 내리기"
    vi: "Rút ra kết luận chắc chắn từ dữ liệu phân tích"
    ms: "Buat kesimpulan kukuh daripada data analisis"
    id: "Menarik kesimpulan yang tepat dari data analisis"
    hi: "विश्लेषण डेटा से ठोस निष्कर्ष निकालना"
