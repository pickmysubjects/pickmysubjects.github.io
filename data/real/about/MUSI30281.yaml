code: MUSI30281
year: 2026
learn:
  en: "Advanced jazz harmony for improvisers: hearing and playing through highly chromatic and atonal sounds via transcription."
  zh: "面向即兴乐手的高级爵士和声：通过扒谱应对高度半音化与无调性的声音。"
  zh-TW: "面向即興樂手的高級爵士和聲：透過扒譜應對高度半音化與無調性的聲音。"
  ja: "即興奏者のための上級ジャズ和声。採譜で高度な半音階・無調の響きに挑む。"
  ko: "즉흥 연주자를 위한 고급 재즈 화성. 채보로 반음계·무조 사운드 익히기."
  vi: "Hòa âm jazz nâng cao cho người ứng tác: chép nhạc để xử lý âm sắc chromatic, phi điệu tính."
  ms: "Harmoni jaz lanjutan: transkripsi untuk bunyi kromatik dan atonal."
  id: "Harmoni jazz lanjut: transkripsi untuk bunyi sangat kromatik dan atonal."
  hi: "तात्कालिक वादकों के लिए उन्नत जैज़ हार्मनी: ट्रांसक्रिप्शन से क्रोमैटिक व अतानवाली ध्वनियाँ।"
outcomes:
  - en: "Use advanced harmonic ideas when improvising"
    zh: "即兴时运用高级和声概念"
    zh-TW: "即興時運用高級和聲概念"
    ja: "即興で高度な和声を使う"
    ko: "즉흥 연주에서 고급 화성 활용하기"
    vi: "Dùng ý tưởng hòa âm nâng cao khi ứng tác"
    ms: "Guna idea harmoni lanjutan semasa improvisasi"
    id: "Memakai ide harmoni lanjut saat improvisasi"
    hi: "तात्कालिक वादन में उन्नत हार्मनी लगाना"
  - en: "Transcribe and analyse a short piece by ear"
    zh: "凭听觉扒写并分析一首短曲"
    zh-TW: "憑聽覺扒寫並分析一首短曲"
    ja: "短い曲を耳で採譜し分析する"
    ko: "짧은 곡을 귀로 채보하고 분석하기"
    vi: "Chép và phân tích bản nhạc ngắn bằng tai"
    ms: "Transkrip dan analisis karya pendek"
    id: "Mentranskripsi dan menganalisis karya pendek"
    hi: "छोटी रचना कान से लिखना और विश्लेषण करना"
  - en: "Perform a transcription with the original recording"
    zh: "随原录音演奏自己的扒谱"
    zh-TW: "隨原錄音演奏自己的扒譜"
    ja: "原曲録音に合わせて採譜を演奏する"
    ko: "원곡 녹음에 맞춰 채보 연주하기"
    vi: "Chơi bản chép cùng bản thu gốc"
    ms: "Persembahkan transkripsi bersama rakaman asal"
    id: "Memainkan transkripsi bersama rekaman asli"
    hi: "मूल रिकॉर्डिंग के साथ ट्रांसक्रिप्शन बजाना"
