code: ANTH30003
year: 2026
learn:
  en: "What religion is and does across cultures, and why old and new faiths are thriving in today's uncertain world."
  zh: "宗教在不同文化中是什么、起什么作用，以及新旧信仰为何在当今兴盛。"
  zh-TW: "宗教在不同文化中是什麼、起什麼作用，以及新舊信仰為何在當今興盛。"
  ja: "文化を越えて宗教とは何で何をするのか、そしてなぜ新旧の信仰が今栄えているのかを学ぶ。"
  ko: "여러 문화에서 종교가 무엇이고 어떤 역할을 하는지, 왜 오래된 신앙과 새 신앙이 오늘날 번성하는지 배운다."
  vi: "Tôn giáo là gì và làm gì trong các nền văn hóa, và vì sao các đức tin cũ lẫn mới đang phát triển ngày nay."
  ms: "Apa itu agama dan peranannya merentas budaya, serta mengapa kepercayaan lama dan baharu berkembang hari ini."
  id: "Apa itu agama dan perannya lintas budaya, serta mengapa kepercayaan lama dan baru berkembang saat ini."
  hi: "संस्कृतियों में धर्म क्या है और क्या करता है, और आज पुरानी व नई आस्थाएँ क्यों फल-फूल रही हैं।"
outcomes:
  - en: "Compare anthropological theories of religion"
    zh: "比较人类学的宗教理论"
    zh-TW: "比較人類學的宗教理論"
    ja: "宗教についての人類学理論を比べる"
    ko: "종교에 관한 인류학 이론 비교하기"
    vi: "So sánh các lý thuyết nhân học về tôn giáo"
    ms: "Bandingkan teori antropologi tentang agama"
    id: "Membandingkan teori antropologi tentang agama"
    hi: "धर्म के मानवशास्त्रीय सिद्धांतों की तुलना करना"
  - en: "Analyse ritual and symbols in social life"
    zh: "分析社会生活中的仪式与象征"
    zh-TW: "分析社會生活中的儀式與象徵"
    ja: "社会生活の中の儀礼と象徴を分析する"
    ko: "사회생활 속 의례와 상징 분석하기"
    vi: "Phân tích nghi lễ và biểu tượng trong đời sống xã hội"
    ms: "Analisis ritual dan simbol dalam kehidupan sosial"
    id: "Menganalisis ritual dan simbol dalam kehidupan sosial"
    hi: "सामाजिक जीवन में अनुष्ठान और प्रतीकों का विश्लेषण करना"
  - en: "Discuss why religion is growing in many places"
    zh: "讨论宗教为何在许多地方增长"
    zh-TW: "討論宗教為何在許多地方增長"
    ja: "多くの地域で宗教が広がる理由を論じる"
    ko: "여러 곳에서 종교가 성장하는 이유 논의하기"
    vi: "Thảo luận vì sao tôn giáo đang tăng ở nhiều nơi"
    ms: "Bincangkan mengapa agama berkembang di banyak tempat"
    id: "Membahas mengapa agama tumbuh di banyak tempat"
    hi: "कई जगहों पर धर्म क्यों बढ़ रहा है, चर्चा करना"
