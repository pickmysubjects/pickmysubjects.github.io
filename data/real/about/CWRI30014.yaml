code: CWRI30014
year: 2026
learn:
  en: "Writing for film and TV at an advanced level, taking your own project from pitch to screenplay in workshops."
  zh: "进阶的电影和电视编剧，在工作坊中把自己的项目从提案发展到剧本。"
  zh-TW: "進階的電影和電視編劇，在工作坊中把自己的專案從提案發展到劇本。"
  ja: "映画・テレビ脚本の上級編。ワークショップで自分の企画を売り込みから脚本まで仕上げる。"
  ko: "영화·TV 각본 심화. 워크숍에서 자기 프로젝트를 피칭부터 각본까지 발전시킨다."
  vi: "Viết cho điện ảnh và truyền hình ở mức nâng cao, phát triển dự án của bạn từ ý tưởng chào bán đến kịch bản qua workshop."
  ms: "Penulisan filem dan TV peringkat lanjutan, membawa projek sendiri dari pitch ke lakon layar dalam bengkel."
  id: "Menulis untuk film dan TV tingkat lanjut, membawa proyek sendiri dari pitch ke skenario lewat lokakarya."
  hi: "फ़िल्म और टीवी के लिए उन्नत लेखन, वर्कशॉप में अपने प्रोजेक्ट को पिच से पटकथा तक ले जाना।"
outcomes:
  - en: "Pitch a screen project clearly"
    zh: "清晰地提案一个影视项目"
    zh-TW: "清晰地提案一個影視專案"
    ja: "映像企画を明快に売り込む"
    ko: "영상 프로젝트를 명확히 피칭하기"
    vi: "Trình bày ý tưởng dự án màn ảnh rõ ràng"
    ms: "Buat pitch projek skrin dengan jelas"
    id: "Mempresentasikan pitch proyek layar dengan jelas"
    hi: "स्क्रीन प्रोजेक्ट को साफ़ तरीके से पिच करना"
  - en: "Write for film and TV series formats"
    zh: "按电影和剧集格式写作"
    zh-TW: "按電影和劇集格式寫作"
    ja: "映画とテレビシリーズの形式で書く"
    ko: "영화와 TV 시리즈 형식으로 쓰기"
    vi: "Viết theo định dạng phim điện ảnh và phim bộ"
    ms: "Tulis untuk format filem dan siri TV"
    id: "Menulis untuk format film dan serial TV"
    hi: "फ़िल्म और टीवी सीरीज़ के प्रारूप में लिखना"
  - en: "Revise a screenplay through workshop feedback"
    zh: "根据工作坊反馈修改剧本"
    zh-TW: "根據工作坊回饋修改劇本"
    ja: "ワークショップの意見で脚本を直す"
    ko: "워크숍 피드백으로 각본 고치기"
    vi: "Sửa kịch bản qua góp ý workshop"
    ms: "Semak lakon layar melalui maklum balas bengkel"
    id: "Merevisi skenario lewat masukan lokakarya"
    hi: "वर्कशॉप फ़ीडबैक से पटकथा सुधारना"
