code: ENGL30016
year: 2026
learn:
  en: "Decadent literature of the 1800s and early 1900s: dandies, femmes fatales, art for art's sake, taste, gender and sexuality."
  zh: "19 世纪至 20 世纪初的颓废派文学：纨绔子弟、蛇蝎美人、为艺术而艺术，以及品味、性别与性。"
  zh-TW: "19 世紀至 20 世紀初的頹廢派文學：紈褲子弟、蛇蠍美人、為藝術而藝術，以及品味、性別與性。"
  ja: "19世紀から20世紀初めのデカダン文学。ダンディ、ファム・ファタル、芸術のための芸術、趣味、ジェンダーと性。"
  ko: "19세기~20세기 초 데카당스 문학. 댄디, 팜파탈, 예술을 위한 예술, 취향, 젠더와 섹슈얼리티."
  vi: "Văn học suy đồi thế kỷ 19 và đầu 20: công tử bột, người đàn bà nguy hiểm, nghệ thuật vị nghệ thuật, thị hiếu, giới và tính dục."
  ms: "Sastera dekaden abad ke-19 dan awal ke-20: dandi, femme fatale, seni untuk seni, cita rasa, gender dan seksualiti."
  id: "Sastra dekaden abad ke-19 dan awal ke-20: dandi, femme fatale, seni untuk seni, selera, gender dan seksualitas."
  hi: "1800 के दशक और 1900 की शुरुआत का पतनशील साहित्य: बाँके, घातक स्त्री, कला के लिए कला, रुचि, जेंडर और कामुकता।"
outcomes:
  - en: "Describe the key figures of decadent writing"
    zh: "描述颓废派文学中的典型人物"
    zh-TW: "描述頹廢派文學中的典型人物"
    ja: "デカダン文学の典型的人物像を説明する"
    ko: "데카당스 문학의 핵심 인물상 설명하기"
    vi: "Mô tả các hình tượng chính của văn học suy đồi"
    ms: "Huraikan watak utama penulisan dekaden"
    id: "Menggambarkan tokoh kunci sastra dekaden"
    hi: "पतनशील लेखन के मुख्य पात्रों का वर्णन करना"
  - en: "Link aesthetics to class, gender and sexuality"
    zh: "把美学与阶级、性别和性联系起来"
    zh-TW: "把美學與階級、性別和性聯繫起來"
    ja: "美学を階級、ジェンダー、性と結びつける"
    ko: "미학을 계급, 젠더, 섹슈얼리티와 연결하기"
    vi: "Liên hệ mỹ học với giai cấp, giới và tính dục"
    ms: "Kaitkan estetika dengan kelas, gender dan seksualiti"
    id: "Mengaitkan estetika dengan kelas, gender dan seksualitas"
    hi: "सौंदर्यशास्त्र को वर्ग, जेंडर और कामुकता से जोड़ना"
  - en: "Compare British and European decadence"
    zh: "比较英国与欧陆的颓废派"
    zh-TW: "比較英國與歐陸的頹廢派"
    ja: "イギリスと大陸のデカダンスを比べる"
    ko: "영국과 유럽 대륙의 데카당스 비교하기"
    vi: "So sánh trào lưu suy đồi ở Anh và châu Âu"
    ms: "Bandingkan dekadens British dan Eropah"
    id: "Membandingkan dekadensi Inggris dan Eropa"
    hi: "ब्रिटिश और यूरोपीय पतनशीलता की तुलना करना"
