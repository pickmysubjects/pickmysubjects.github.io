code: MUSI20220
year: 2026
learn:
  en: "Deeper study of sound: critical listening, perception and sound technology, ending in a mixed-media composition folio."
  zh: 深入研究声音：批判性聆听、听觉感知与声音技术，最后完成多媒体作品集。
  zh-TW: 深入研究聲音：批判性聆聽、聽覺感知與聲音技術，最後完成多媒體作品集。
  ja: 音をさらに深く学ぶ。批判的リスニング、知覚、音響技術を扱い、ミクストメディア作品集で締めくくる。
  ko: "소리를 더 깊이 공부: 비판적 듣기, 지각, 음향 기술, 그리고 멀티미디어 작곡 포트폴리오."
  vi: "Học sâu về âm thanh: nghe phản biện, cảm nhận và công nghệ âm thanh, cuối kỳ nộp bộ tác phẩm đa phương tiện."
  ms: "Kajian bunyi lebih mendalam: mendengar kritis, persepsi dan teknologi bunyi, diakhiri folio media campuran."
  id: "Studi bunyi lebih dalam: mendengar kritis, persepsi dan teknologi suara, diakhiri portofolio media campuran."
  hi: "ध्वनि का गहरा अध्ययन: आलोचनात्मक श्रवण, बोध और साउंड तकनीक, अंत में मिक्स्ड-मीडिया फ़ोलियो।"
outcomes:
  - en: Listen to sound critically
    zh: 批判性地聆听声音
    zh-TW: 批判性地聆聽聲音
    ja: 音を批判的に聴く
    ko: 소리를 비판적으로 듣기
    vi: Nghe âm thanh một cách phản biện
    ms: Dengar bunyi secara kritis
    id: Mendengarkan suara secara kritis
    hi: ध्वनि को आलोचनात्मक ढंग से सुनना
  - en: Apply sound technology
    zh: 应用声音技术
    zh-TW: 應用聲音技術
    ja: 音響技術を活用する
    ko: 음향 기술 활용하기
    vi: Ứng dụng công nghệ âm thanh
    ms: Gunakan teknologi bunyi
    id: Menerapkan teknologi suara
    hi: साउंड तकनीक लागू करना
  - en: Create a mixed-media sound work
    zh: 创作多媒体声音作品
    zh-TW: 創作多媒體聲音作品
    ja: ミクストメディアの音作品を作る
    ko: 멀티미디어 사운드 작품 만들기
    vi: Sáng tác tác phẩm âm thanh đa phương tiện
    ms: Cipta karya bunyi media campuran
    id: Membuat karya suara media campuran
    hi: मिक्स्ड-मीडिया ध्वनि रचना बनाना
