code: BMEN90002
year: 2027
learn:
  en: "How the nervous system processes information, using mathematical and computer models of neurons."
  zh: "用数学和计算模型研究神经系统如何处理信息。"
  zh-TW: "用數學與計算模型研究神經系統如何處理資訊。"
  ja: "神経系が情報をどう処理するかを、ニューロンの数理・計算モデルで学ぶ。"
  ko: "뉴런의 수학·계산 모델로 신경계의 정보 처리 방식 배우기."
  vi: "Hệ thần kinh xử lý thông tin ra sao, qua các mô hình toán và máy tính của nơ-ron."
  ms: "Cara sistem saraf memproses maklumat, menggunakan model matematik dan komputer neuron."
  id: "Cara sistem saraf memproses informasi, dengan model matematika dan komputer dari neuron."
  hi: "न्यूरॉन के गणितीय और कंप्यूटर मॉडल से तंत्रिका तंत्र की सूचना प्रोसेसिंग समझना।"
outcomes:
  - en: "Explain how action potentials are generated"
    zh: "解释动作电位是如何产生的"
    zh-TW: "解釋動作電位如何產生"
    ja: "活動電位がどう生じるか説明する"
    ko: "활동 전위가 생기는 원리 설명하기"
    vi: "Giải thích điện thế hoạt động được tạo ra thế nào"
    ms: "Menerangkan bagaimana potensi tindakan terhasil"
    id: "Menjelaskan bagaimana potensial aksi terbentuk"
    hi: "एक्शन पोटेंशियल कैसे बनता है, समझाना"
  - en: "Build and compare simple and detailed neuron models"
    zh: "构建并比较简化和精细的神经元模型"
    zh-TW: "建立並比較簡化與精細的神經元模型"
    ja: "単純なモデルと詳細なニューロンモデルを作って比べる"
    ko: "단순·정밀 뉴런 모델 만들고 비교하기"
    vi: "Xây dựng và so sánh mô hình nơ-ron đơn giản và chi tiết"
    ms: "Membina dan membandingkan model neuron ringkas dan terperinci"
    id: "Membangun dan membandingkan model neuron sederhana dan rinci"
    hi: "सरल और विस्तृत न्यूरॉन मॉडल बनाना और तुलना करना"
  - en: "Explain how the brain learns through synapses"
    zh: "解释大脑如何通过突触学习"
    zh-TW: "解釋大腦如何透過突觸學習"
    ja: "脳がシナプスを通してどう学ぶか説明する"
    ko: "뇌가 시냅스로 학습하는 방식 설명하기"
    vi: "Giải thích não học qua khớp thần kinh thế nào"
    ms: "Menerangkan cara otak belajar melalui sinaps"
    id: "Menjelaskan cara otak belajar lewat sinapsis"
    hi: "मस्तिष्क सिनैप्स के ज़रिए कैसे सीखता है, समझाना"
