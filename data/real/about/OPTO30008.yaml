code: OPTO30008
year: 2026
learn:
  en: "The structure and function of the eye, from cornea and lens to retina and optic nerve, with clinical examples."
  zh: "眼睛的结构与功能，从角膜、晶状体到视网膜和视神经，结合临床实例。"
  zh-TW: "眼睛的結構與功能，從角膜、水晶體到視網膜和視神經，結合臨床實例。"
  ja: "角膜・水晶体から網膜・視神経まで、目の構造と働きを臨床例とともに学ぶ。"
  ko: "각막·수정체부터 망막·시신경까지 눈의 구조와 기능을 임상 사례로 배우기."
  vi: "Cấu trúc và chức năng của mắt, từ giác mạc, thủy tinh thể đến võng mạc, thần kinh thị giác."
  ms: "Struktur dan fungsi mata, dari kornea dan kanta hingga retina dan saraf optik, dengan contoh klinikal."
  id: "Struktur dan fungsi mata, dari kornea dan lensa hingga retina dan saraf optik, dengan contoh klinis."
  hi: "आँख की संरचना और कार्य, कॉर्निया-लेंस से रेटिना और ऑप्टिक नर्व तक, क्लिनिकल उदाहरणों के साथ।"
outcomes:
  - en: "Describe the anatomy of the eye and orbit"
    zh: "描述眼球和眼眶的解剖结构"
    zh-TW: "描述眼球和眼眶的解剖結構"
    ja: "眼球と眼窩の解剖を説明する"
    ko: "눈과 안와의 해부 구조 설명하기"
    vi: "Mô tả giải phẫu mắt và hốc mắt"
    ms: "Huraikan anatomi mata dan orbit"
    id: "Menjelaskan anatomi mata dan rongga mata"
    hi: "आँख और ऑर्बिट की शारीरिक संरचना बताना"
  - en: "Explain how eye structures support vision"
    zh: "解释眼部结构如何支持视觉"
    zh-TW: "解釋眼部結構如何支持視覺"
    ja: "目の各部が視覚をどう支えるか説明する"
    ko: "눈 구조가 시각을 어떻게 돕는지 설명하기"
    vi: "Giải thích các cấu trúc mắt giúp nhìn thế nào"
    ms: "Terangkan cara struktur mata menyokong penglihatan"
    id: "Menjelaskan cara struktur mata mendukung penglihatan"
    hi: "आँख की संरचनाएँ देखने में कैसे मदद करती हैं, समझाना"
  - en: "Connect structural changes to eye disease"
    zh: "把结构变化与眼病联系起来"
    zh-TW: "把結構變化與眼病聯繫起來"
    ja: "構造の変化を目の病気と結びつける"
    ko: "구조 변화와 눈 질환 연결하기"
    vi: "Liên hệ thay đổi cấu trúc với bệnh mắt"
    ms: "Kaitkan perubahan struktur dengan penyakit mata"
    id: "Mengaitkan perubahan struktur dengan penyakit mata"
    hi: "संरचना में बदलाव को आँखों के रोग से जोड़ना"
