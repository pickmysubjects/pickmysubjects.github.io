code: MUSI10219
year: 2026
learn:
  en: "Rock from its American roots through punk, metal and grunge: listen, analyse the culture, and write an essay."
  zh: "从美国根源到朋克、金属和垃圾摇滚的摇滚史：聆听、分析文化并写论文。"
  zh-TW: "從美國根源到龐克、金屬與油漬搖滾的搖滾史：聆聽、分析文化並寫論文。"
  ja: "アメリカのルーツからパンク、メタル、グランジまでのロックを聴き、文化を分析し論文を書く。"
  ko: "미국 뿌리부터 펑크·메탈·그런지까지 록을 듣고 문화를 분석하며 에세이를 쓴다."
  vi: "Rock từ gốc Mỹ đến punk, metal, grunge: nghe, phân tích văn hóa và viết tiểu luận."
  ms: "Rock dari akar Amerika hingga punk, metal, grunge: dengar, analisis budaya dan tulis esei."
  id: "Rock dari akar Amerika hingga punk, metal, grunge: dengar, analisis budaya, dan tulis esai."
  hi: "अमेरिकी जड़ों से पंक, मेटल, ग्रंज तक रॉक: सुनना, संस्कृति का विश्लेषण, निबंध लिखना।"
outcomes:
  - en: "Recognise rock styles by ear"
    zh: "凭耳朵辨认摇滚风格"
    zh-TW: "憑耳朵辨認搖滾風格"
    ja: "ロックのスタイルを聴き分ける"
    ko: "록 스타일을 귀로 구별하기"
    vi: "Nhận ra phong cách rock qua tai"
    ms: "Kenal gaya rock dengan telinga"
    id: "Mengenali gaya rock lewat pendengaran"
    hi: "कान से रॉक शैलियाँ पहचानना"
  - en: "Discuss how rock was made and consumed"
    zh: "讨论摇滚的创作与消费"
    zh-TW: "討論搖滾的創作與消費"
    ja: "ロックの制作と消費を論じる"
    ko: "록의 제작과 소비 논의하기"
    vi: "Bàn về cách rock được tạo và tiêu thụ"
    ms: "Bincang cara rock dicipta dan digunakan"
    id: "Membahas cara rock dibuat dan dikonsumsi"
    hi: "रॉक के बनने और सुने जाने पर चर्चा"
  - en: "Write a researched essay"
    zh: "撰写有文献支持的论文"
    zh-TW: "撰寫有文獻支持的論文"
    ja: "文献に基づく論文を書く"
    ko: "자료 기반 에세이 쓰기"
    vi: "Viết tiểu luận có nghiên cứu"
    ms: "Tulis esei berasaskan kajian"
    id: "Menulis esai berbasis riset"
    hi: "शोध आधारित निबंध लिखना"
