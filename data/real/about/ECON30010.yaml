code: ECON30010
year: 2026
learn:
  en: "Intermediate-to-advanced micro: game theory, oligopoly, uncertainty, information problems and general equilibrium."
  zh: "进阶微观：博弈论、寡头、不确定性、信息问题和一般均衡。"
  zh-TW: "進階個體經濟：賽局理論、寡占、不確定性、資訊問題和一般均衡。"
  ja: "上級ミクロ経済：ゲーム理論、寡占、不確実性、情報の問題、一般均衡。"
  ko: "고급 미시경제: 게임이론, 과점, 불확실성, 정보 문제, 일반균형."
  vi: "Kinh tế vi mô nâng cao: lý thuyết trò chơi, độc quyền nhóm, bất định, vấn đề thông tin và cân bằng tổng thể."
  ms: "Mikroekonomi lanjutan: teori permainan, oligopoli, ketidakpastian, masalah maklumat dan keseimbangan umum."
  id: "Mikroekonomi lanjutan: teori permainan, oligopoli, ketidakpastian, masalah informasi, dan keseimbangan umum."
  hi: "एडवांस्ड माइक्रोइकोनॉमिक्स: गेम थ्योरी, ऑलिगोपॉली, अनिश्चितता, सूचना की समस्याएँ और जनरल इक्विलिब्रियम।"
outcomes:
  - en: "Use game theory to analyse strategic choices"
    zh: "用博弈论分析策略性决策"
    zh-TW: "用賽局理論分析策略性決策"
    ja: "ゲーム理論で戦略的な選択を分析する"
    ko: "게임이론으로 전략적 선택 분석하기"
    vi: "Dùng lý thuyết trò chơi phân tích lựa chọn chiến lược"
    ms: "Guna teori permainan untuk analisis pilihan strategik"
    id: "Memakai teori permainan untuk menganalisis pilihan strategis"
    hi: "गेम थ्योरी से रणनीतिक फ़ैसलों का विश्लेषण करना"
  - en: "Spot adverse selection and principal-agent problems"
    zh: "识别逆向选择和委托代理问题"
    zh-TW: "辨識逆選擇和委託代理問題"
    ja: "逆選択やプリンシパル・エージェント問題を見抜く"
    ko: "역선택과 주인-대리인 문제 파악하기"
    vi: "Nhận diện lựa chọn bất lợi và vấn đề người ủy quyền–đại diện"
    ms: "Kenal pasti pemilihan bertentangan dan masalah prinsipal-ejen"
    id: "Mengenali seleksi merugikan dan masalah prinsipal-agen"
    hi: "एडवर्स सिलेक्शन और प्रिंसिपल-एजेंट समस्याएँ पहचानना"
  - en: "Judge when markets work well and when they fail"
    zh: "判断市场何时有效、何时失灵"
    zh-TW: "判斷市場何時有效、何時失靈"
    ja: "市場がうまく機能する時と失敗する時を判断する"
    ko: "시장이 잘 작동할 때와 실패할 때 판단하기"
    vi: "Đánh giá khi nào thị trường hiệu quả và khi nào thất bại"
    ms: "Nilai bila pasaran berfungsi dan bila ia gagal"
    id: "Menilai kapan pasar berjalan baik dan kapan gagal"
    hi: "तय करना कि बाज़ार कब ठीक चलते हैं और कब विफल होते हैं"
