code: ISYS90043
year: 2027
learn:
  en: "Enterprise architecture: how processes, information, structure and technology fit together, and how to put an architecture in place."
  zh: "企业架构：流程、信息、组织结构和技术如何配合，以及如何落地一套架构。"
  zh-TW: "企業架構：流程、資訊、組織結構與技術如何搭配，以及如何落實一套架構。"
  ja: "エンタープライズアーキテクチャ：プロセス・情報・組織・技術の関係と、その導入方法。"
  ko: "엔터프라이즈 아키텍처: 프로세스·정보·조직·기술의 관계와 아키텍처를 도입하는 방법."
  vi: "Kiến trúc doanh nghiệp: quy trình, thông tin, cơ cấu, công nghệ khớp nhau thế nào và cách triển khai."
  ms: "Seni bina perusahaan: cara proses, maklumat, struktur dan teknologi berpadu, serta cara melaksanakannya."
  id: "Arsitektur perusahaan: cara proses, informasi, struktur, dan teknologi berpadu, serta cara menerapkannya."
  hi: "एंटरप्राइज़ आर्किटेक्चर: प्रक्रियाएँ, जानकारी, ढाँचा और तकनीक कैसे जुड़ते हैं, और इसे लागू कैसे करें।"
outcomes:
  - en: "Apply enterprise architecture frameworks to a firm"
    zh: "将企业架构框架应用到企业"
    zh-TW: "將企業架構框架應用於企業"
    ja: "EAフレームワークを企業に当てはめる"
    ko: "EA 프레임워크를 기업에 적용하기"
    vi: "Áp dụng khung kiến trúc doanh nghiệp vào tổ chức"
    ms: "Menggunakan rangka seni bina perusahaan pada firma"
    id: "Menerapkan kerangka arsitektur perusahaan pada organisasi"
    hi: "किसी कंपनी पर एंटरप्राइज़ आर्किटेक्चर फ़्रेमवर्क लागू करना"
  - en: "Weigh the benefits and risks of an architecture"
    zh: "权衡一套架构的收益与风险"
    zh-TW: "權衡一套架構的效益與風險"
    ja: "アーキテクチャの利点とリスクを比較する"
    ko: "아키텍처의 이점과 위험 따져 보기"
    vi: "Cân nhắc lợi ích và rủi ro của một kiến trúc"
    ms: "Menimbang manfaat dan risiko sesuatu seni bina"
    id: "Menimbang manfaat dan risiko suatu arsitektur"
    hi: "किसी आर्किटेक्चर के फ़ायदे और जोखिम तौलना"
