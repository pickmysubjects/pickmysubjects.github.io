code: MUSI10243
year: 2027
learn:
  en: "Play in the Big Band, covering styles from the 1930s to today, including student pieces and improvisation."
  zh: "参加大乐队演出，曲目从20世纪30年代至今，也包括学生作品和即兴。"
  zh-TW: "參加大樂團演出，曲目從1930年代至今，也包括學生作品和即興。"
  ja: "ビッグバンドで演奏。1930年代から現在までのスタイルに加え、学生の作品や即興も。"
  ko: "빅밴드에서 연주: 1930년대부터 현재까지의 스타일, 학생 작품과 즉흥연주 포함."
  vi: "Chơi trong Big Band với các phong cách từ thập niên 1930 đến nay, gồm cả tác phẩm của sinh viên và ứng tác."
  ms: "Bermain dalam Big Band, merangkumi gaya dari 1930-an hingga kini, termasuk karya pelajar dan improvisasi."
  id: "Bermain dalam Big Band dengan gaya dari 1930-an hingga kini, termasuk karya mahasiswa dan improvisasi."
  hi: "बिग बैंड में बजाना: 1930 के दशक से आज तक की शैलियाँ, छात्रों की रचनाएँ और इम्प्रोवाइज़ेशन भी।"
outcomes:
  - en: "Grow as an ensemble musician"
    zh: "提升合奏乐手的技术与音乐素养"
    zh-TW: "提升合奏樂手的技術與音樂素養"
    ja: "アンサンブル奏者として成長する"
    ko: "앙상블 연주자로 성장하기"
    vi: "Phát triển với vai trò nhạc công hòa tấu"
    ms: "Berkembang sebagai pemuzik ensembel"
    id: "Berkembang sebagai musisi ensambel"
    hi: "समूह संगीतकार के रूप में निखरना"
  - en: "Perform selected pieces to concert standard"
    zh: "以音乐会水准演奏选定曲目"
    zh-TW: "以音樂會水準演奏選定曲目"
    ja: "選んだ曲を演奏会レベルで演奏する"
    ko: "선정곡을 연주회 수준으로 연주하기"
    vi: "Biểu diễn tác phẩm chọn lọc ở chuẩn hòa nhạc"
    ms: "Persembahkan karya pilihan pada tahap konsert"
    id: "Membawakan karya pilihan setara konser"
    hi: "चुनी हुई रचनाएँ कॉन्सर्ट स्तर पर बजाना"
  - en: "Work confidently as part of a performing group"
    zh: "自信地作为乐团一员参与演出"
    zh-TW: "自信地作為樂團一員參與演出"
    ja: "演奏グループの一員として自信を持って参加する"
    ko: "연주 그룹의 일원으로 자신 있게 참여하기"
    vi: "Tự tin tham gia như thành viên nhóm biểu diễn"
    ms: "Bermain dengan yakin sebagai ahli kumpulan"
    id: "Tampil percaya diri sebagai anggota grup"
    hi: "प्रदर्शन समूह के सदस्य के रूप में आत्मविश्वास से भाग लेना"
