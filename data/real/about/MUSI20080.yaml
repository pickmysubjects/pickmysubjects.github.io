code: MUSI20080
year: 2026
learn:
  en: "A small chamber choir of 12 to 20 singing medieval, Renaissance and Baroque music, a cappella and with early instruments."
  zh: "12至20人小型室内合唱团，演唱中世纪、文艺复兴与巴洛克音乐。"
  zh-TW: "12至20人小型室內合唱團，演唱中世紀、文藝復興與巴洛克音樂。"
  ja: "12〜20人の室内合唱団。中世・ルネサンス・バロック音楽を歌う。"
  ko: "12~20명 실내 합창단. 중세·르네상스·바로크 음악을 노래."
  vi: "Hợp xướng thính phòng 12–20 người hát nhạc trung cổ, Phục Hưng và Baroque."
  ms: "Koir kamar 12–20 orang menyanyikan muzik zaman pertengahan, Renaissance dan Barok."
  id: "Paduan suara kamar 12–20 orang menyanyikan musik abad pertengahan, Renaisans, dan Barok."
  hi: "12–20 लोगों का छोटा कॉयर: मध्यकालीन, रेनेसां और बारोक संगीत।"
outcomes:
  - en: "Play or sing early music in a historically informed style"
    zh: "以历史风格演奏或演唱早期音乐"
    zh-TW: "以歷史風格演奏或演唱早期音樂"
    ja: "時代様式に沿って古楽を演奏・歌唱する"
    ko: "시대 양식에 맞게 고음악 연주·노래하기"
    vi: "Chơi hoặc hát nhạc cổ theo phong cách lịch sử"
    ms: "Main atau nyanyi muzik awal mengikut gaya sejarah"
    id: "Memainkan atau menyanyikan musik awal sesuai gaya sejarahnya"
    hi: "पुराने संगीत को ऐतिहासिक शैली में बजाना या गाना"
  - en: "Prepare your part and pass an individual part test"
    zh: "准备声部并通过个人声部测验"
    zh-TW: "準備聲部並通過個人聲部測驗"
    ja: "パートを準備し個人テストに合格する"
    ko: "파트를 준비해 개인 파트 테스트 통과하기"
    vi: "Chuẩn bị bè và vượt qua bài kiểm tra cá nhân"
    ms: "Sediakan bahagian dan lulus ujian individu"
    id: "Menyiapkan bagian dan lulus tes individu"
    hi: "अपना पार्ट तैयार कर व्यक्तिगत टेस्ट पास करना"
  - en: "Perform with the ensemble at the end of semester"
    zh: "学期末随乐团演出"
    zh-TW: "學期末隨樂團演出"
    ja: "学期末にアンサンブルで演奏する"
    ko: "학기 말 앙상블 공연에 참여하기"
    vi: "Biểu diễn cùng nhóm cuối học kỳ"
    ms: "Membuat persembahan bersama ensembel di hujung semester"
    id: "Tampil bersama ansambel di akhir semester"
    hi: "सेमेस्टर के अंत में समूह के साथ प्रस्तुति"
