code: GEOG20010
year: 2026
learn:
  en: "China's social, economic, environmental and political change, seen from inside and place by place."
  zh: "从内部视角、分地区看中国的社会、经济、环境与政治变迁。"
  zh-TW: "從內部視角、分地區看中國的社會、經濟、環境與政治變遷。"
  ja: "中国の社会・経済・環境・政治の変化を、内側から地域ごとに見る。"
  ko: "중국의 사회·경제·환경·정치 변화를 내부 시각에서 지역별로 살핀다."
  vi: "Biến đổi xã hội, kinh tế, môi trường và chính trị của Trung Quốc, nhìn từ bên trong theo từng vùng."
  ms: "Perubahan sosial, ekonomi, alam sekitar dan politik China, dilihat dari dalam mengikut tempat."
  id: "Perubahan sosial, ekonomi, lingkungan dan politik Tiongkok, dilihat dari dalam per wilayah."
  hi: "चीन के सामाजिक, आर्थिक, पर्यावरणीय और राजनीतिक बदलाव, भीतर से और जगह-जगह के नज़रिए से।"
outcomes:
  - en: "Appraise China's socioeconomic change"
    zh: "评估中国的社会经济转型"
    zh-TW: "評估中國的社會經濟轉型"
    ja: "中国の社会経済的変化を評価する"
    ko: "중국의 사회경제적 변화를 평가한다"
    vi: "Đánh giá chuyển đổi kinh tế - xã hội Trung Quốc"
    ms: "Nilai perubahan sosioekonomi China"
    id: "Menilai perubahan sosial ekonomi Tiongkok"
    hi: "चीन के सामाजिक-आर्थिक बदलाव का मूल्यांकन करें"
  - en: "Evaluate environments under rapid change"
    zh: "评价快速变化中的环境状况"
    zh-TW: "評價快速變化中的環境狀況"
    ja: "急速な変化の中の環境を評価する"
    ko: "급변하는 사회의 환경을 평가한다"
    vi: "Đánh giá môi trường trong bối cảnh thay đổi nhanh"
    ms: "Nilai keadaan alam sekitar dalam perubahan pesat"
    id: "Mengevaluasi lingkungan di tengah perubahan cepat"
    hi: "तेज़ बदलाव में पर्यावरणीय स्थितियों का मूल्यांकन करें"
  - en: "Write an NGO proposal for a development gap"
    zh: "针对发展缺口撰写NGO提案"
    zh-TW: "針對發展缺口撰寫NGO提案"
    ja: "開発課題に向けたNGO提案書を書く"
    ko: "개발 격차에 대한 NGO 제안서를 쓴다"
    vi: "Viết đề xuất NGO cho một khoảng trống phát triển"
    ms: "Tulis cadangan NGO untuk jurang pembangunan"
    id: "Menulis proposal LSM untuk kesenjangan pembangunan"
    hi: "विकास अंतर के लिए NGO प्रस्ताव लिखें"
