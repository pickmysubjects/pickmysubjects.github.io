code: ENGL30006
year: 2026
learn:
  en: "How colonisation, decolonisation and migration shaped literature since the late 1800s, and why some books go global and others don't."
  zh: "殖民、去殖民和移民如何塑造 19 世纪末以来的文学，以及为何有的作品走向全球、有的没有。"
  zh-TW: "殖民、去殖民和移民如何塑造 19 世紀末以來的文學，以及為何有的作品走向全球、有的沒有。"
  ja: "植民地化、脱植民地化、移民が19世紀末以降の文学をどう形作ったか。なぜ世界に広まる作品とそうでない作品があるのか。"
  ko: "식민화, 탈식민화, 이주가 19세기 말 이후 문학을 어떻게 만들었는가. 왜 어떤 책은 세계로 퍼지고 어떤 책은 아닌가."
  vi: "Thực dân, giải thực dân và di cư định hình văn học từ cuối thế kỷ 19 ra sao, và vì sao có sách vươn ra toàn cầu, có sách không."
  ms: "Cara penjajahan, dekolonisasi dan migrasi membentuk sastera sejak akhir 1800-an, dan mengapa sesetengah buku mendunia."
  id: "Cara kolonisasi, dekolonisasi dan migrasi membentuk sastra sejak akhir 1800-an, dan mengapa sebagian buku mendunia."
  hi: "1800 के दशक के अंत से उपनिवेशवाद, विउपनिवेशीकरण और प्रवास ने साहित्य को कैसे गढ़ा, और कुछ किताबें वैश्विक क्यों बनती हैं।"
outcomes:
  - en: "Trace empire and migration in modern literature"
    zh: "追溯现代文学中的帝国与移民"
    zh-TW: "追溯現代文學中的帝國與移民"
    ja: "近代文学における帝国と移民の影響をたどる"
    ko: "현대 문학 속 제국과 이주의 흔적 추적하기"
    vi: "Lần theo dấu ấn đế quốc và di cư trong văn học hiện đại"
    ms: "Jejaki empayar dan migrasi dalam sastera moden"
    id: "Menelusuri jejak imperium dan migrasi dalam sastra modern"
    hi: "आधुनिक साहित्य में साम्राज्य और प्रवास के निशान खोजना"
  - en: "Explain why some works reach world readers"
    zh: "解释为何有的作品能赢得全球读者"
    zh-TW: "解釋為何有的作品能贏得全球讀者"
    ja: "作品が世界の読者に届く理由を説明する"
    ko: "어떤 작품이 세계 독자에게 닿는 이유 설명하기"
    vi: "Giải thích vì sao có tác phẩm đến được độc giả thế giới"
    ms: "Terangkan mengapa sesetengah karya sampai ke pembaca dunia"
    id: "Menjelaskan mengapa sebagian karya menjangkau pembaca dunia"
    hi: "समझाना कि कुछ रचनाएँ दुनिया भर के पाठकों तक क्यों पहुँचती हैं"
  - en: "Consider what changes when books are translated"
    zh: "思考作品被翻译时会发生什么变化"
    zh-TW: "思考作品被翻譯時會發生什麼變化"
    ja: "翻訳されると作品の何が変わるか考える"
    ko: "책이 번역될 때 무엇이 달라지는지 생각하기"
    vi: "Xem xét điều gì thay đổi khi sách được dịch"
    ms: "Fikirkan apa yang berubah apabila buku diterjemah"
    id: "Memikirkan apa yang berubah saat buku diterjemahkan"
    hi: "किताब के अनुवाद में क्या बदलता है, इस पर सोचना"
