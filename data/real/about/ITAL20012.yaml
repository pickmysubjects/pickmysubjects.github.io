code: ITAL20012
year: 2026
learn:
  en: "Italian for students who finished Italian 8: close reading of literary and other texts to master different registers and styles."
  zh: "适合学完意大利语 8 的学生：细读文学和非文学文本，掌握不同语域和文体。"
  zh-TW: "適合學完義大利語 8 的學生：細讀文學和非文學文本，掌握不同語域和文體。"
  ja: "イタリア語8を終えた学生向け。文学・非文学の文章を精読し、さまざまな文体と使い分けを身につける。"
  ko: "이탈리아어 8을 마친 학생 대상. 문학·비문학 글을 정독하며 다양한 어투와 문체를 익힌다."
  vi: "Tiếng Ý cho ai đã học xong Italian 8: đọc kỹ văn bản văn học và phi văn học để nắm các văn phong."
  ms: "Bahasa Itali untuk yang tamat Italian 8: bacaan teliti teks sastera dan bukan sastera untuk menguasai pelbagai gaya."
  id: "Bahasa Italia untuk yang lulus Italian 8: membaca cermat teks sastra dan nonsastra untuk menguasai ragam gaya."
  hi: "इतालवी 8 पूरा कर चुके छात्रों के लिए: साहित्यिक और अन्य पाठों को ध्यान से पढ़कर अलग-अलग शैलियाँ सीखना।"
outcomes:
  - en: "Discuss social and cultural topics in Italian"
    zh: "用意大利语讨论社会和文化话题"
    zh-TW: "用義大利語討論社會和文化話題"
    ja: "社会や文化の話題をイタリア語で話し合う"
    ko: "사회·문화 주제를 이탈리아어로 토론하기"
    vi: "Thảo luận chủ đề xã hội, văn hóa bằng tiếng Ý"
    ms: "Bincangkan topik sosial dan budaya dalam bahasa Itali"
    id: "Membahas topik sosial dan budaya dalam bahasa Italia"
    hi: "सामाजिक और सांस्कृतिक विषयों पर इतालवी में चर्चा करना"
  - en: "Read and write longer Italian texts"
    zh: "读写较长的意大利语文章"
    zh-TW: "讀寫較長的義大利語文章"
    ja: "長めのイタリア語の文章を読み書きする"
    ko: "긴 이탈리아어 글 읽고 쓰기"
    vi: "Đọc và viết văn bản tiếng Ý dài hơn"
    ms: "Baca dan tulis teks bahasa Itali yang lebih panjang"
    id: "Membaca dan menulis teks bahasa Italia yang lebih panjang"
    hi: "लंबे इतालवी पाठ पढ़ना-लिखना"
  - en: "Give a clear presentation in Italian"
    zh: "用意大利语做清楚的口头报告"
    zh-TW: "用義大利語做清楚的口頭報告"
    ja: "イタリア語で分かりやすく発表する"
    ko: "이탈리아어로 명확하게 발표하기"
    vi: "Thuyết trình rõ ràng bằng tiếng Ý"
    ms: "Buat pembentangan yang jelas dalam bahasa Itali"
    id: "Melakukan presentasi yang jelas dalam bahasa Italia"
    hi: "इतालवी में स्पष्ट प्रस्तुति देना"
