code: GEOM90008
year: 2027
learn:
  en: "How to store, model and query data about where and when things happen, at large scale."
  zh: "如何大规模存储、建模和查询关于地点与时间的数据。"
  zh-TW: "如何大規模儲存、建模和查詢關於地點與時間的資料。"
  ja: "「どこで・いつ」のデータを大規模に保存・モデル化・検索する方法。"
  ko: "'어디서·언제' 데이터를 대규모로 저장·모델링·조회하는 방법."
  vi: "Cách lưu trữ, mô hình hóa và truy vấn dữ liệu về địa điểm và thời gian ở quy mô lớn."
  ms: "Cara menyimpan, memodelkan dan menyoal data tentang lokasi dan masa pada skala besar."
  id: "Cara menyimpan, memodelkan, dan mengkueri data lokasi dan waktu dalam skala besar."
  hi: "कहाँ और कब से जुड़े डेटा को बड़े पैमाने पर स्टोर, मॉडल और क्वेरी करना।"
outcomes:
  - en: "Represent spatial and time-based data in a database"
    zh: "在数据库中表示空间与时间数据"
    zh-TW: "在資料庫中表示空間與時間資料"
    ja: "空間・時間データをデータベースで表現する"
    ko: "공간·시간 데이터를 데이터베이스에 표현하기"
    vi: "Biểu diễn dữ liệu không gian và thời gian trong cơ sở dữ liệu"
    ms: "Mewakili data ruang dan masa dalam pangkalan data"
    id: "Merepresentasikan data spasial dan waktu di basis data"
    hi: "स्थानिक और समय-आधारित डेटा को डेटाबेस में दर्शाना"
  - en: "Write efficient queries over location data"
    zh: "对位置数据编写高效查询"
    zh-TW: "對位置資料撰寫高效查詢"
    ja: "位置データに効率的なクエリを書く"
    ko: "위치 데이터에 효율적인 쿼리 작성하기"
    vi: "Viết truy vấn hiệu quả trên dữ liệu vị trí"
    ms: "Menulis soalan yang cekap ke atas data lokasi"
    id: "Menulis kueri yang efisien atas data lokasi"
    hi: "लोकेशन डेटा पर कुशल क्वेरी लिखना"
