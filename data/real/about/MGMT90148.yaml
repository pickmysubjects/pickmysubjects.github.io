code: MGMT90148
year: 2027
learn:
  en: "Management consulting as a profession: the engagement cycle, client relationships, business models and ethics."
  zh: "管理咨询这一职业：项目周期、客户关系、商业模式与职业伦理。"
  zh-TW: "管理顧問這門專業：專案週期、客戶關係、商業模式與職業倫理。"
  ja: "職業としての経営コンサルティング：案件サイクル、顧客関係、ビジネスモデル、倫理。"
  ko: "직업으로서의 경영 컨설팅: 프로젝트 주기, 고객 관계, 비즈니스 모델, 윤리."
  vi: "Tư vấn quản lý như một nghề: chu trình dự án, quan hệ khách hàng, mô hình kinh doanh, đạo đức."
  ms: "Perundingan pengurusan sebagai profesion: kitaran tugasan, hubungan pelanggan, model perniagaan dan etika."
  id: "Konsultasi manajemen sebagai profesi: siklus penugasan, hubungan klien, model bisnis dan etika."
  hi: "पेशे के रूप में मैनेजमेंट कंसल्टिंग: एंगेजमेंट चक्र, क्लाइंट संबंध, बिज़नेस मॉडल और नैतिकता।"
outcomes:
  - en: "Solve organisational problems with evidence"
    zh: "用证据解决组织问题"
    zh-TW: "以證據解決組織問題"
    ja: "根拠に基づき組織の問題を解く"
    ko: "근거에 기반해 조직 문제 해결하기"
    vi: "Giải quyết vấn đề tổ chức dựa trên bằng chứng"
    ms: "Menyelesaikan masalah organisasi dengan bukti"
    id: "Menyelesaikan masalah organisasi dengan bukti"
    hi: "सबूतों के आधार पर संगठन की समस्याएँ सुलझाना"
  - en: "Judge consulting impact, including ESG"
    zh: "评估咨询的影响，包括 ESG"
    zh-TW: "評估顧問服務的影響，包括 ESG"
    ja: "ESGも含めコンサルの影響を評価する"
    ko: "ESG를 포함한 컨설팅 영향 평가하기"
    vi: "Đánh giá tác động tư vấn, gồm cả ESG"
    ms: "Menilai impak perundingan, termasuk ESG"
    id: "Menilai dampak konsultasi, termasuk ESG"
    hi: "ESG सहित कंसल्टिंग के असर का आकलन करना"
