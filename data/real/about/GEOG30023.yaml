code: GEOG30023
year: 2026
learn:
  en: "How Earth's climate changed over the last 2.7 million years, read from field archives, to put warming in context."
  zh: "从野外档案解读近270万年气候变化，把当今变暖放进长远背景。"
  zh-TW: "從野外檔案解讀近270萬年氣候變化，將當今暖化放入長遠脈絡。"
  ja: "野外の記録から過去270万年の気候変化を読み、温暖化を長い視点で見る。"
  ko: "현장 기록으로 지난 270만 년 기후 변화를 읽고 온난화를 장기적으로 봄."
  vi: "Khí hậu Trái Đất đổi thế nào trong 2,7 triệu năm qua, đọc từ tư liệu thực địa, để hiểu ấm lên toàn cầu."
  ms: "Perubahan iklim Bumi 2.7 juta tahun lalu dari arkib lapangan, untuk memahami pemanasan kini."
  id: "Perubahan iklim Bumi 2,7 juta tahun terakhir dari arsip lapangan, untuk memahami pemanasan kini."
  hi: "पिछले 27 लाख वर्षों में पृथ्वी की जलवायु का बदलाव, फ़ील्ड अभिलेखों से, ताकि आज की गर्मी को संदर्भ मिले।"
outcomes:
  - en: "Sample and analyse palaeoclimate archives"
    zh: "采样并分析古气候档案"
    zh-TW: "採樣並分析古氣候檔案"
    ja: "古気候アーカイブを採取・分析する"
    ko: "고기후 기록 채취·분석하기"
    vi: "Lấy mẫu và phân tích tư liệu cổ khí hậu"
    ms: "Ambil sampel dan analisis arkib paleoiklim"
    id: "Mengambil sampel dan menganalisis arsip paleoiklim"
    hi: "पुरा-जलवायु अभिलेखों का नमूना और विश्लेषण"
  - en: "Interpret palaeoclimate data"
    zh: "解读古气候数据"
    zh-TW: "解讀古氣候資料"
    ja: "古気候データを解釈する"
    ko: "고기후 데이터 해석하기"
    vi: "Diễn giải dữ liệu cổ khí hậu"
    ms: "Tafsir data paleoiklim"
    id: "Menafsirkan data paleoiklim"
    hi: "पुरा-जलवायु डेटा की व्याख्या करना"
