code: ELEN90057
year: 2027
learn:
  en: "The physical layer of digital communication: sampling, noise, modulation, detection, equalisation and synchronisation."
  zh: "数字通信的物理层：采样、噪声、调制、检测、均衡和同步。"
  zh-TW: "數位通訊的實體層：取樣、雜訊、調變、偵測、等化與同步。"
  ja: "デジタル通信の物理層：標本化・雑音・変調・検出・等化・同期。"
  ko: "디지털 통신의 물리 계층: 샘플링, 잡음, 변조, 검출, 등화, 동기화."
  vi: "Lớp vật lý của truyền thông số: lấy mẫu, nhiễu, điều chế, tách sóng, cân bằng và đồng bộ."
  ms: "Lapisan fizikal komunikasi digital: pensampelan, hingar, modulasi, pengesanan, penyamaan dan penyegerakan."
  id: "Lapisan fisik komunikasi digital: sampling, derau, modulasi, deteksi, ekualisasi dan sinkronisasi."
  hi: "डिजिटल संचार की फ़िज़िकल लेयर: सैंपलिंग, शोर, मॉड्यूलेशन, डिटेक्शन, इक्वलाइज़ेशन और सिंक्रोनाइज़ेशन।"
outcomes:
  - en: "Describe the building blocks of a digital communication system"
    zh: "描述数字通信系统的基本组成"
    zh-TW: "描述數位通訊系統的基本組成"
    ja: "デジタル通信システムの構成要素を説明する"
    ko: "디지털 통신 시스템의 구성 요소 설명하기"
    vi: "Mô tả các khối cơ bản của hệ thống truyền thông số"
    ms: "Menerangkan blok asas sistem komunikasi digital"
    id: "Menjelaskan blok dasar sistem komunikasi digital"
    hi: "डिजिटल संचार प्रणाली के मूल हिस्सों का वर्णन"
  - en: "Analyse error rates, signal-to-noise ratio and bandwidth"
    zh: "分析误码率、信噪比和带宽"
    zh-TW: "分析錯誤率、訊雜比與頻寬"
    ja: "誤り率・SN比・帯域幅を解析する"
    ko: "오류율, 신호 대 잡음비, 대역폭 분석하기"
    vi: "Phân tích tỷ lệ lỗi, tỷ số tín hiệu trên nhiễu và băng thông"
    ms: "Menganalisis kadar ralat, nisbah isyarat-hingar dan lebar jalur"
    id: "Menganalisis laju galat, rasio sinyal-derau dan bandwidth"
    hi: "त्रुटि दर, सिग्नल-टू-नॉइज़ अनुपात और बैंडविड्थ का विश्लेषण"
  - en: "Compare modulation and detection methods and choose between them"
    zh: "比较调制与检测方法并做出选择"
    zh-TW: "比較調變與偵測方法並做出選擇"
    ja: "変調・検出方式を比べて選ぶ"
    ko: "변조·검출 방식을 비교하고 선택하기"
    vi: "So sánh và lựa chọn phương pháp điều chế, tách sóng"
    ms: "Membanding dan memilih kaedah modulasi dan pengesanan"
    id: "Membandingkan dan memilih metode modulasi dan deteksi"
    hi: "मॉड्यूलेशन और डिटेक्शन विधियों की तुलना कर चुनना"
