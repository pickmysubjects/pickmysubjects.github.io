code: BMEN90040
year: 2027
learn:
  en: "How heat and mass move through the body and through medical processes like dialysis and drug production."
  zh: "热量和物质如何在人体及透析、制药等医疗过程中传递。"
  zh-TW: "熱與質量如何在人體及透析、製藥等醫療程序中傳遞。"
  ja: "熱と物質が体内や透析・医薬品製造などのプロセスでどう移動するか。"
  ko: "열과 물질이 인체와 투석·의약품 생산 같은 공정에서 이동하는 원리."
  vi: "Nhiệt và chất di chuyển thế nào trong cơ thể và các quy trình như lọc máu, sản xuất thuốc."
  ms: "Bagaimana haba dan jisim bergerak dalam badan dan proses seperti dialisis serta pengeluaran ubat."
  id: "Bagaimana panas dan massa berpindah di tubuh dan proses seperti dialisis serta produksi obat."
  hi: "शरीर और डायलिसिस, दवा निर्माण जैसी प्रक्रियाओं में ऊष्मा और द्रव्यमान कैसे चलते हैं।"
outcomes:
  - en: "Analyse transport processes in cells, tissues and organs"
    zh: "分析细胞、组织和器官中的传递过程"
    zh-TW: "分析細胞、組織與器官中的傳遞現象"
    ja: "細胞・組織・臓器の輸送現象を分析する"
    ko: "세포, 조직, 장기의 수송 현상 분석하기"
    vi: "Phân tích quá trình vận chuyển trong tế bào, mô và cơ quan"
    ms: "Menganalisis proses pengangkutan dalam sel, tisu dan organ"
    id: "Menganalisis proses transpor di sel, jaringan, dan organ"
    hi: "कोशिकाओं, ऊतकों और अंगों में परिवहन प्रक्रियाओं का विश्लेषण"
  - en: "Apply transport principles to biomedical process problems"
    zh: "用传递原理解决生物医学过程问题"
    zh-TW: "用傳遞原理解決生醫程序問題"
    ja: "輸送の原理を生体医用プロセスの問題に使う"
    ko: "수송 원리로 의공학 공정 문제 풀기"
    vi: "Áp dụng nguyên lý vận chuyển cho bài toán quy trình y sinh"
    ms: "Menggunakan prinsip pengangkutan untuk masalah proses bioperubatan"
    id: "Menerapkan prinsip transpor pada masalah proses biomedis"
    hi: "बायोमेडिकल प्रक्रिया समस्याओं में परिवहन सिद्धांत लागू करना"
