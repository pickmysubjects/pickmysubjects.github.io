code: AIND10005
year: 2026
learn:
  en: "A creative studio led by First Nations artists on centring Indigenous knowledge in art and place."
  zh: "由原住民艺术家带领的创作工作室，以原住民知识为中心创作。"
  zh-TW: "由原住民藝術家帶領的創作工作室，以原住民知識為中心創作。"
  ja: "先住民アーティストが率いる、先住民の知を中心に据えた創作スタジオ。"
  ko: "원주민 예술가가 이끄는, 원주민 지식을 중심에 둔 창작 스튜디오."
  vi: "Xưởng sáng tác do nghệ sĩ bản địa dẫn dắt, đặt tri thức bản địa vào trung tâm."
  ms: "Studio kreatif dipimpin artis Orang Asal, meletakkan ilmu Orang Asal di tengah."
  id: "Studio kreatif dipimpin seniman Pribumi, menempatkan pengetahuan Pribumi di pusat."
  hi: "फ़र्स्ट नेशंस कलाकारों के नेतृत्व में स्टूडियो, जो आदिवासी ज्ञान को केंद्र में रखता है।"
outcomes:
  - en: "Work with respect around Indigenous cultural practice"
    zh: "尊重地对待原住民文化实践"
    zh-TW: "尊重地對待原住民文化實踐"
    ja: "先住民の文化実践に敬意をもって関わる"
    ko: "원주민 문화 실천을 존중하며 작업하기"
    vi: "Làm việc tôn trọng với thực hành văn hóa bản địa"
    ms: "Bekerja dengan hormat terhadap amalan budaya Orang Asal"
    id: "Bekerja dengan hormat pada praktik budaya Pribumi"
    hi: "आदिवासी सांस्कृतिक प्रथाओं के साथ सम्मान से काम करना"
  - en: "Make your own artwork in response to shared knowledge"
    zh: "回应所学知识创作自己的作品"
    zh-TW: "回應所學知識創作自己的作品"
    ja: "共有された知に応えて自分の作品を作る"
    ko: "공유된 지식에 응답해 자기 작품 만들기"
    vi: "Sáng tác tác phẩm riêng đáp lại tri thức được chia sẻ"
    ms: "Hasilkan karya sendiri sebagai respons kepada ilmu dikongsi"
    id: "Membuat karya sendiri sebagai respons atas pengetahuan bersama"
    hi: "साझा ज्ञान के जवाब में अपनी कलाकृति बनाना"
  - en: "Explore practice and place in small groups"
    zh: "在小组中探讨创作与地方的关系"
    zh-TW: "在小組中探討創作與地方的關係"
    ja: "少人数で実践と場所の関係を探る"
    ko: "소그룹으로 실천과 장소의 관계 탐구하기"
    vi: "Cùng nhóm nhỏ khám phá thực hành và nơi chốn"
    ms: "Teroka amalan dan tempat dalam kumpulan kecil"
    id: "Menjelajahi praktik dan tempat dalam kelompok kecil"
    hi: "छोटे समूहों में कला-अभ्यास और स्थान को समझना"
