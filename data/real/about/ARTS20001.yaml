code: ARTS20001
year: 2026
learn:
  en: "Python for humanities and social science research: getting, cleaning, analysing and visualising data, ending in your own project."
  zh: "面向人文社科研究的 Python：获取、清洗、分析和可视化数据，最后完成自己的项目。"
  zh-TW: "面向人文社科研究的 Python：取得、清理、分析和視覺化資料，最後完成自己的專案。"
  ja: "人文・社会科学研究のためのPython。データの取得、整理、分析、可視化を学び、最後に自分の課題を仕上げる。"
  ko: "인문·사회과학 연구를 위한 Python. 데이터 수집, 정제, 분석, 시각화를 배우고 자신의 프로젝트로 마무리한다."
  vi: "Python cho nghiên cứu nhân văn, xã hội: thu thập, làm sạch, phân tích, trực quan hóa dữ liệu, kết thúc bằng dự án riêng."
  ms: "Python untuk penyelidikan kemanusiaan dan sains sosial: dapatkan, bersihkan, analisis dan visualkan data, diakhiri projek sendiri."
  id: "Python untuk riset humaniora dan ilmu sosial: mengambil, membersihkan, menganalisis dan memvisualkan data, diakhiri proyek sendiri."
  hi: "मानविकी व सामाजिक विज्ञान शोध के लिए Python: डेटा जुटाना, साफ़ करना, विश्लेषण और विज़ुअलाइज़ करना, अंत में अपना प्रोजेक्ट।"
outcomes:
  - en: "Write basic Python to work with research data"
    zh: "编写基础 Python 处理研究数据"
    zh-TW: "編寫基礎 Python 處理研究資料"
    ja: "基本的なPythonで研究データを扱う"
    ko: "기초 Python으로 연구 데이터 다루기"
    vi: "Viết Python cơ bản để xử lý dữ liệu nghiên cứu"
    ms: "Tulis Python asas untuk mengendalikan data kajian"
    id: "Menulis Python dasar untuk mengolah data riset"
    hi: "शोध डेटा के लिए बुनियादी Python लिखना"
  - en: "Clean, analyse and visualise data from the web"
    zh: "清洗、分析并可视化网络数据"
    zh-TW: "清理、分析並視覺化網路資料"
    ja: "ウェブ上のデータを整理・分析・可視化する"
    ko: "웹 데이터를 정제·분석·시각화하기"
    vi: "Làm sạch, phân tích, trực quan hóa dữ liệu web"
    ms: "Bersihkan, analisis dan visualkan data dari web"
    id: "Membersihkan, menganalisis, memvisualkan data web"
    hi: "वेब के डेटा को साफ़, विश्लेषित और विज़ुअलाइज़ करना"
  - en: "Judge what digital methods can and can't show"
    zh: "判断数字方法能说明什么、不能说明什么"
    zh-TW: "判斷數位方法能說明什麼、不能說明什麼"
    ja: "デジタル手法で分かることと分からないことを見極める"
    ko: "디지털 방법으로 알 수 있는 것과 없는 것 판단하기"
    vi: "Đánh giá phương pháp số cho thấy gì, không cho thấy gì"
    ms: "Nilai apa yang boleh dan tidak boleh ditunjukkan kaedah digital"
    id: "Menilai apa yang bisa dan tak bisa ditunjukkan metode digital"
    hi: "डिजिटल तरीक़े क्या दिखा सकते हैं और क्या नहीं, यह परखना"
