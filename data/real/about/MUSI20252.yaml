code: MUSI20252
year: 2027
learn:
  en: "Continued solo and ensemble jazz training: improvisation, harmony, rhythm and building a performance repertoire."
  zh: "继续爵士独奏和合奏训练：即兴、和声、节奏和积累演出曲目。"
  zh-TW: "繼續爵士獨奏和合奏訓練：即興、和聲、節奏和累積演出曲目。"
  ja: "ジャズのソロとアンサンブルの継続トレーニング：即興、和声、リズム、レパートリー作り。"
  ko: "재즈 솔로·앙상블 심화 훈련: 즉흥연주, 화성, 리듬, 공연 레퍼토리 쌓기."
  vi: "Tiếp tục luyện jazz độc tấu và hòa tấu: ứng tác, hòa âm, tiết tấu và xây dựng tiết mục biểu diễn."
  ms: "Latihan jazz solo dan ensembel lanjutan: improvisasi, harmoni, ritma dan bina repertoir persembahan."
  id: "Lanjutan latihan jazz solo dan ansambel: improvisasi, harmoni, ritme, dan membangun repertoar."
  hi: "जैज़ सोलो व एंसेम्बल का आगे का प्रशिक्षण: इम्प्रोवाइज़ेशन, हार्मनी, रिदम और रिपर्टॉयर बनाना।"
outcomes:
  - en: "Improvise across a wide range of music"
    zh: "在多种音乐中即兴演奏"
    zh-TW: "在多種音樂中即興演奏"
    ja: "幅広い音楽で即興演奏する"
    ko: "폭넓은 음악에서 즉흥 연주하기"
    vi: "Ứng tác trên nhiều thể loại nhạc"
    ms: "Berimprovisasi dalam pelbagai jenis muzik"
    id: "Berimprovisasi di berbagai jenis musik"
    hi: "कई तरह के संगीत में इम्प्रोवाइज़ करना"
  - en: "Perform a short jazz program with confidence"
    zh: "自信地演出一段简短的爵士曲目"
    zh-TW: "自信地演出一段簡短的爵士曲目"
    ja: "短いジャズのプログラムを自信をもって演奏する"
    ko: "짧은 재즈 프로그램을 자신 있게 공연하기"
    vi: "Tự tin biểu diễn một chương trình jazz ngắn"
    ms: "Persembahkan program jazz pendek dengan yakin"
    id: "Membawakan program jazz singkat dengan percaya diri"
    hi: "आत्मविश्वास से छोटा जैज़ कार्यक्रम प्रस्तुत करना"
  - en: "Play as an active member of a jazz ensemble"
    zh: "作为积极成员参与爵士乐队"
    zh-TW: "作為積極成員參與爵士樂團"
    ja: "ジャズアンサンブルの一員として積極的に演奏する"
    ko: "재즈 앙상블의 적극적 멤버로 연주하기"
    vi: "Tham gia tích cực trong ban nhạc jazz"
    ms: "Bermain secara aktif dalam ensembel jazz"
    id: "Bermain aktif sebagai anggota ansambel jazz"
    hi: "जैज़ एंसेम्बल के सक्रिय सदस्य के रूप में बजाना"
