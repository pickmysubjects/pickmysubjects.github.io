code: MUSI30232
year: 2026
learn:
  en: "Lead and realise a new cross-media group work in a mentor-led lab, keeping a logbook and presenting the result."
  zh: "在导师带领的实验课中主导并完成跨媒介集体新作，写实验日志并展示成果。"
  zh-TW: "在導師帶領的實驗課中主導並完成跨媒介集體新作，撰寫實驗日誌並展示成果。"
  ja: "メンター主導のラボで分野横断の新しいグループ作品を指揮・実現し、記録をつけて発表。"
  ko: "멘토 주도 실험 수업에서 매체 간 그룹 신작을 이끌고 완성, 기록을 남기고 발표."
  vi: "Dẫn dắt và hoàn thành tác phẩm nhóm đa phương tiện mới, ghi nhật ký và trình bày kết quả."
  ms: "Pimpin dan hasilkan karya kumpulan rentas media baharu, simpan log dan bentang hasil."
  id: "Memimpin dan mewujudkan karya kelompok lintas media baru, menulis log dan mempresentasikannya."
  hi: "मेंटर-आधारित लैब में नया क्रॉस-मीडिया समूह कार्य बनाना, लॉगबुक रखना और प्रस्तुत करना।"
outcomes:
  - en: "Direct a large group music project"
    zh: "指导大型集体音乐项目"
    zh-TW: "指導大型集體音樂專案"
    ja: "大人数の音楽プロジェクトを指揮する"
    ko: "대규모 그룹 음악 프로젝트 이끌기"
    vi: "Chỉ đạo dự án âm nhạc nhóm lớn"
    ms: "Arah projek muzik kumpulan besar"
    id: "Mengarahkan proyek musik kelompok besar"
    hi: "बड़े समूह संगीत प्रोजेक्ट का निर्देशन"
  - en: "Create work across media and genres"
    zh: "跨媒介、跨风格进行创作"
    zh-TW: "跨媒介、跨風格進行創作"
    ja: "メディアやジャンルを越えて創作する"
    ko: "매체와 장르를 넘나들며 창작하기"
    vi: "Sáng tác xuyên phương tiện và thể loại"
    ms: "Berkarya merentas media dan genre"
    id: "Berkarya lintas media dan genre"
    hi: "मीडिया और शैलियों के पार रचना"
  - en: "Critique your own experiments"
    zh: "反思评析自己的实验过程"
    zh-TW: "反思評析自己的實驗過程"
    ja: "自分の試みを批評的に振り返る"
    ko: "자신의 실험을 비평적으로 돌아보기"
    vi: "Phê bình các thử nghiệm của mình"
    ms: "Kritik eksperimen sendiri"
    id: "Mengkritisi eksperimen sendiri"
    hi: "अपने प्रयोगों की समीक्षा"
