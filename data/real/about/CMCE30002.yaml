code: CMCE30002
year: 2026
learn:
  en: "How businesses should govern data: privacy, security, risk, algorithm bias and the ethics of AI."
  zh: "企业该如何治理数据：隐私、安全、风险、算法偏见和AI伦理。"
  zh-TW: "企業該如何治理資料：隱私、資安、風險、演算法偏誤和AI倫理。"
  ja: "企業はデータをどう統治すべきか：プライバシー、セキュリティ、リスク、アルゴリズムの偏り、AI倫理。"
  ko: "기업의 데이터 거버넌스: 개인정보, 보안, 위험, 알고리즘 편향, AI 윤리."
  vi: "Doanh nghiệp nên quản trị dữ liệu thế nào: quyền riêng tư, bảo mật, rủi ro, thiên lệch thuật toán và đạo đức AI."
  ms: "Cara perniagaan urus tadbir data: privasi, keselamatan, risiko, bias algoritma dan etika AI."
  id: "Cara bisnis mengatur data: privasi, keamanan, risiko, bias algoritma, dan etika AI."
  hi: "कंपनियों को डेटा कैसे संभालना चाहिए: प्राइवेसी, सुरक्षा, जोखिम, एल्गोरिदम का पक्षपात और AI नैतिकता।"
outcomes:
  - en: "Follow the main ethical and legal debates about business data"
    zh: "理解商业数据的主要伦理与法规争论"
    zh-TW: "理解商業資料的主要倫理與法規爭議"
    ja: "ビジネスデータをめぐる倫理・規制の議論を理解する"
    ko: "비즈니스 데이터에 관한 윤리·규제 논쟁 이해"
    vi: "Nắm các tranh luận đạo đức và pháp lý chính về dữ liệu kinh doanh"
    ms: "Fahami perdebatan etika dan undang-undang utama tentang data perniagaan"
    id: "Memahami perdebatan etika dan hukum utama soal data bisnis"
    hi: "बिज़नेस डेटा पर मुख्य नैतिक और कानूनी बहस समझना"
  - en: "Design rules for how a company collects and uses data"
    zh: "为公司设计收集和使用数据的规则"
    zh-TW: "為公司設計蒐集和使用資料的規則"
    ja: "企業のデータ収集・利用ルールを設計する"
    ko: "회사의 데이터 수집·활용 규칙 설계"
    vi: "Thiết kế quy tắc thu thập và dùng dữ liệu cho công ty"
    ms: "Reka peraturan cara syarikat kumpul dan guna data"
    id: "Merancang aturan cara perusahaan mengumpulkan dan memakai data"
    hi: "कंपनी के डेटा जुटाने और इस्तेमाल के नियम बनाना"
  - en: "Weigh the trade-offs of using different kinds of data"
    zh: "权衡使用不同类型数据的利弊"
    zh-TW: "權衡使用不同類型資料的利弊"
    ja: "さまざまなデータを使う利点と欠点を比べる"
    ko: "여러 종류의 데이터 사용의 장단점 비교"
    vi: "Cân nhắc được mất khi dùng các loại dữ liệu khác nhau"
    ms: "Timbang untung rugi guna pelbagai jenis data"
    id: "Menimbang untung-rugi memakai berbagai jenis data"
    hi: "अलग-अलग तरह के डेटा के फ़ायदे-नुकसान तौलना"
