code: BMEN90030
year: 2027
learn:
  en: "Working in a mixed team to find a clinical need and design a new medical device, with a business plan."
  zh: "与跨学科团队合作，找出临床需求、设计新的医疗器械，并制定商业计划。"
  zh-TW: "與跨領域團隊合作，找出臨床需求、設計新的醫療器材，並擬定商業計畫。"
  ja: "異分野チームで臨床ニーズを見つけ、新しい医療機器とビジネスプランを考える。"
  ko: "다학제 팀으로 임상 수요를 찾고 새 의료기기와 사업 계획 만들기."
  vi: "Làm việc nhóm liên ngành để tìm nhu cầu lâm sàng, thiết kế thiết bị y tế mới và lập kế hoạch kinh doanh."
  ms: "Bekerja dalam pasukan pelbagai bidang untuk mencari keperluan klinikal, mereka peranti perubatan baharu dan pelan perniagaan."
  id: "Bekerja dalam tim lintas bidang untuk menemukan kebutuhan klinis, merancang alat medis baru, dan rencana bisnis."
  hi: "मिश्रित टीम में क्लिनिकल ज़रूरत खोजकर नया मेडिकल उपकरण और बिज़नेस प्लान बनाना।"
outcomes:
  - en: "Build a device or software that meets a clinical need"
    zh: "制作满足临床需求的器械或软件"
    zh-TW: "製作滿足臨床需求的器材或軟體"
    ja: "臨床ニーズに応える機器やソフトを作る"
    ko: "임상 수요에 맞는 기기나 소프트웨어 만들기"
    vi: "Làm thiết bị hoặc phần mềm đáp ứng nhu cầu lâm sàng"
    ms: "Membina peranti atau perisian untuk keperluan klinikal"
    id: "Membuat alat atau perangkat lunak untuk kebutuhan klinis"
    hi: "क्लिनिकल ज़रूरत पूरी करने वाला उपकरण या सॉफ़्टवेयर बनाना"
  - en: "Write a business plan covering market, regulation and IP"
    zh: "撰写涵盖市场、监管和知识产权的商业计划"
    zh-TW: "撰寫涵蓋市場、法規與智慧財產的商業計畫"
    ja: "市場・規制・知的財産を含むビジネスプランを書く"
    ko: "시장, 규제, 지식재산을 담은 사업 계획 쓰기"
    vi: "Viết kế hoạch kinh doanh gồm thị trường, quy định và sở hữu trí tuệ"
    ms: "Menulis pelan perniagaan merangkumi pasaran, peraturan dan IP"
    id: "Menulis rencana bisnis tentang pasar, regulasi, dan HKI"
    hi: "बाज़ार, नियमन और IP वाली बिज़नेस प्लान लिखना"
  - en: "Present findings to expert and general audiences"
    zh: "向专业和非专业听众汇报成果"
    zh-TW: "向專業與非專業聽眾發表成果"
    ja: "専門家と一般の聞き手に成果を発表する"
    ko: "전문가와 일반 청중에게 결과 발표하기"
    vi: "Trình bày kết quả cho người chuyên môn và đại chúng"
    ms: "Membentangkan dapatan kepada khalayak pakar dan umum"
    id: "Mempresentasikan temuan ke audiens ahli dan umum"
    hi: "विशेषज्ञ और आम श्रोताओं के सामने निष्कर्ष प्रस्तुत करना"
