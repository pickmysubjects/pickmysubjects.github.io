code: ECON90032
year: 2027
learn:
  en: "Jobs, consumption, investment, inflation, exchange rates and the balance of payments, and the role of economic policy."
  zh: "就业、消费、投资、通胀、汇率和国际收支，以及经济政策的作用。"
  zh-TW: "就業、消費、投資、通膨、匯率與國際收支，以及經濟政策的角色。"
  ja: "雇用、消費、投資、インフレ、為替、国際収支と経済政策の役割。"
  ko: "고용, 소비, 투자, 인플레이션, 환율, 국제수지와 경제정책의 역할."
  vi: "Việc làm, tiêu dùng, đầu tư, lạm phát, tỷ giá, cán cân thanh toán và vai trò của chính sách kinh tế."
  ms: "Pekerjaan, penggunaan, pelaburan, inflasi, kadar pertukaran, imbangan pembayaran dan peranan dasar ekonomi."
  id: "Lapangan kerja, konsumsi, investasi, inflasi, kurs, neraca pembayaran, dan peran kebijakan ekonomi."
  hi: "रोज़गार, उपभोग, निवेश, मुद्रास्फीति, विनिमय दर, भुगतान संतुलन और आर्थिक नीति की भूमिका।"
outcomes:
  - en: "Compare Classical and Keynesian views"
    zh: "比较古典学派与凯恩斯学派观点"
    zh-TW: "比較古典學派與凱因斯學派觀點"
    ja: "古典派とケインズ派の見方を比べる"
    ko: "고전학파와 케인스학파 관점 비교하기"
    vi: "So sánh quan điểm cổ điển và Keynes"
    ms: "Membandingkan pandangan Klasik dan Keynesian"
    id: "Membandingkan pandangan Klasik dan Keynesian"
    hi: "क्लासिकल और कीनेसियन विचारों की तुलना"
  - en: "Explain causes and effects of exchange rate moves"
    zh: "解释汇率变动的原因和后果"
    zh-TW: "解釋匯率變動的原因與後果"
    ja: "為替変動の原因と影響を説明する"
    ko: "환율 변동의 원인과 결과 설명하기"
    vi: "Giải thích nguyên nhân và hệ quả của biến động tỷ giá"
    ms: "Menerangkan punca dan kesan perubahan kadar pertukaran"
    id: "Menjelaskan sebab dan akibat pergerakan kurs"
    hi: "विनिमय दर में बदलाव के कारण और प्रभाव समझाना"
