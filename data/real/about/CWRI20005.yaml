code: CWRI20005
year: 2026
learn:
  en: "Reading and writing creative nonfiction on topics like music, science, sport, family and politics, plus its ethics."
  zh: "阅读和写作关于音乐、科学、体育、家庭和政治等主题的创意非虚构作品，并探讨其伦理。"
  zh-TW: "閱讀和寫作關於音樂、科學、運動、家庭和政治等主題的創意非虛構作品，並探討其倫理。"
  ja: "音楽・科学・スポーツ・家族・政治などを題材に創作ノンフィクションを読み書きし、その倫理も考える。"
  ko: "음악·과학·스포츠·가족·정치 같은 주제로 창작 논픽션을 읽고 쓰며 그 윤리도 다룬다."
  vi: "Đọc và viết phi hư cấu sáng tạo về âm nhạc, khoa học, thể thao, gia đình, chính trị, cùng vấn đề đạo đức của nó."
  ms: "Membaca dan menulis bukan fiksyen kreatif tentang muzik, sains, sukan, keluarga dan politik, serta etikanya."
  id: "Membaca dan menulis nonfiksi kreatif tentang musik, sains, olahraga, keluarga dan politik, beserta etikanya."
  hi: "संगीत, विज्ञान, खेल, परिवार और राजनीति जैसे विषयों पर रचनात्मक नॉन-फ़िक्शन पढ़ना और लिखना, साथ में उसकी नैतिकता।"
outcomes:
  - en: "Use research and narrative in nonfiction writing"
    zh: "在非虚构写作中运用调研与叙事"
    zh-TW: "在非虛構寫作中運用調查與敘事"
    ja: "ノンフィクションで調査と語りを活かす"
    ko: "논픽션에 조사와 서사 활용하기"
    vi: "Dùng nghiên cứu và kể chuyện trong viết phi hư cấu"
    ms: "Guna penyelidikan dan naratif dalam penulisan bukan fiksyen"
    id: "Memakai riset dan narasi dalam tulisan nonfiksi"
    hi: "नॉन-फ़िक्शन लेखन में शोध और कथा का उपयोग करना"
  - en: "Discuss the ethics of writing about real people"
    zh: "讨论书写真实人物的伦理"
    zh-TW: "討論書寫真實人物的倫理"
    ja: "実在の人を書く倫理を論じる"
    ko: "실존 인물에 대해 쓰는 윤리 논의하기"
    vi: "Thảo luận đạo đức khi viết về người thật"
    ms: "Bincangkan etika menulis tentang orang sebenar"
    id: "Membahas etika menulis tentang orang nyata"
    hi: "असली लोगों के बारे में लिखने की नैतिकता पर चर्चा करना"
  - en: "Workshop and polish your own pieces"
    zh: "在工作坊中打磨自己的作品"
    zh-TW: "在工作坊中打磨自己的作品"
    ja: "ワークショップで自分の作品を磨く"
    ko: "워크숍으로 자기 작품 다듬기"
    vi: "Workshop và trau chuốt tác phẩm của mình"
    ms: "Bengkelkan dan gilap karya sendiri"
    id: "Melokakaryakan dan memoles karya sendiri"
    hi: "वर्कशॉप में अपनी रचनाएं निखारना"
