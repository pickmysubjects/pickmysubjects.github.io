code: EDUC20068
year: 2026
learn:
  en: "Sport in Australia as social education: school and community sport, commercial sport, and how the media shapes it."
  zh: "体育作为澳大利亚的社会教育：校园与社区体育、商业体育和媒体影响。"
  zh-TW: "運動作為澳洲的社會教育：校園與社區運動、商業運動和媒體影響。"
  ja: "オーストラリアの社会教育としてのスポーツ。学校・地域スポーツ、商業スポーツ、メディアの影響。"
  ko: "호주의 사회 교육으로서의 스포츠: 학교·지역 스포츠, 상업 스포츠, 미디어의 영향."
  vi: "Thể thao như giáo dục xã hội ở Úc: thể thao học đường, cộng đồng, thương mại và vai trò truyền thông."
  ms: "Sukan sebagai pendidikan sosial di Australia: sukan sekolah dan komuniti, sukan komersial dan pengaruh media."
  id: "Olahraga sebagai pendidikan sosial di Australia: olahraga sekolah dan komunitas, komersial, dan peran media."
  hi: "ऑस्ट्रेलिया में सामाजिक शिक्षा के रूप में खेल: स्कूल व सामुदायिक खेल, व्यावसायिक खेल और मीडिया की भूमिका।"
outcomes:
  - en: "Explain why sport matters to young Australians"
    zh: "解释体育为何对澳洲年轻人很重要"
    zh-TW: "解釋運動為何對澳洲年輕人很重要"
    ja: "スポーツが若いオーストラリア人に重要な理由を説明する"
    ko: "스포츠가 호주 청년에게 중요한 이유 설명하기"
    vi: "Giải thích vì sao thể thao quan trọng với giới trẻ Úc"
    ms: "Menerangkan mengapa sukan penting bagi belia Australia"
    id: "Menjelaskan mengapa olahraga penting bagi anak muda Australia"
    hi: "युवा ऑस्ट्रेलियाई लोगों के लिए खेल क्यों अहम है, समझाना"
  - en: "Discuss tensions between school sport and commercial sport"
    zh: "讨论校园体育与商业体育之间的矛盾"
    zh-TW: "討論校園運動與商業運動之間的矛盾"
    ja: "学校スポーツと商業スポーツの対立を論じる"
    ko: "학교 스포츠와 상업 스포츠 사이의 긴장 논의하기"
    vi: "Bàn về mâu thuẫn giữa thể thao học đường và thương mại"
    ms: "Membincangkan ketegangan antara sukan sekolah dan komersial"
    id: "Membahas ketegangan antara olahraga sekolah dan komersial"
    hi: "स्कूली खेल और व्यावसायिक खेल के बीच तनाव पर चर्चा"
  - en: "Analyse how the media reports sport and social issues"
    zh: "分析媒体如何报道体育和社会议题"
    zh-TW: "分析媒體如何報導運動和社會議題"
    ja: "メディアのスポーツ・社会問題報道を分析する"
    ko: "미디어의 스포츠·사회 문제 보도 분석하기"
    vi: "Phân tích cách truyền thông đưa tin thể thao và vấn đề xã hội"
    ms: "Menganalisis cara media melaporkan sukan dan isu sosial"
    id: "Menganalisis cara media memberitakan olahraga dan isu sosial"
    hi: "मीडिया खेल और सामाजिक मुद्दों की रिपोर्टिंग कैसे करता है, विश्लेषण"
