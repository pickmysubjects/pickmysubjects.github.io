code: SPAN10007
year: 2026
learn:
  en: "Spanish for students who finished Spanish 4: first-person testimonies, short films and news from Spain and Latin America."
  zh: "适合学完西班牙语 4 的学生：通过亲历叙述、短片和新闻学习。"
  zh-TW: "適合學完西班牙語 4 的學生：透過親歷敘述、短片和新聞學習。"
  ja: "スペイン語4を終えた学生向け。スペインと中南米の証言文学・短編映画・ニュースで学ぶ。"
  ko: "스페인어 4를 마친 학생 대상. 스페인·중남미의 증언 서사, 단편 영화, 뉴스로 배운다."
  vi: "Tiếng Tây Ban Nha cho ai đã học xong Spanish 4: lời chứng, phim ngắn và tin tức từ Tây Ban Nha, Mỹ Latinh."
  ms: "Bahasa Sepanyol untuk yang tamat Spanish 4: kisah kesaksian, filem pendek dan berita dari Sepanyol dan Amerika Latin."
  id: "Bahasa Spanyol untuk yang lulus Spanish 4: kisah kesaksian, film pendek dan berita dari Spanyol dan Amerika Latin."
  hi: "स्पेनिश 4 पूरा कर चुके छात्रों के लिए: स्पेन और लैटिन अमेरिका की आपबीती, लघु फ़िल्में और ख़बरें।"
outcomes:
  - en: "Discuss social and cultural topics in Spanish"
    zh: "用西班牙语讨论社会和文化话题"
    zh-TW: "用西班牙語討論社會和文化話題"
    ja: "社会や文化の話題をスペイン語で話し合う"
    ko: "사회·문화 주제를 스페인어로 토론하기"
    vi: "Thảo luận chủ đề xã hội, văn hóa bằng tiếng Tây Ban Nha"
    ms: "Bincangkan topik sosial dan budaya dalam bahasa Sepanyol"
    id: "Membahas topik sosial dan budaya dalam bahasa Spanyol"
    hi: "सामाजिक और सांस्कृतिक विषयों पर स्पेनिश में चर्चा करना"
  - en: "Read and write longer Spanish texts"
    zh: "读写较长的西班牙语文章"
    zh-TW: "讀寫較長的西班牙語文章"
    ja: "長めのスペイン語の文章を読み書きする"
    ko: "긴 스페인어 글 읽고 쓰기"
    vi: "Đọc và viết văn bản tiếng Tây Ban Nha dài hơn"
    ms: "Baca dan tulis teks bahasa Sepanyol yang lebih panjang"
    id: "Membaca dan menulis teks bahasa Spanyol yang lebih panjang"
    hi: "लंबे स्पेनिश पाठ पढ़ना-लिखना"
  - en: "Give a clear presentation in Spanish"
    zh: "用西班牙语做清楚的口头报告"
    zh-TW: "用西班牙語做清楚的口頭報告"
    ja: "スペイン語で分かりやすく発表する"
    ko: "스페인어로 명확하게 발표하기"
    vi: "Thuyết trình rõ ràng bằng tiếng Tây Ban Nha"
    ms: "Buat pembentangan yang jelas dalam bahasa Sepanyol"
    id: "Melakukan presentasi yang jelas dalam bahasa Spanyol"
    hi: "स्पेनिश में स्पष्ट प्रस्तुति देना"
