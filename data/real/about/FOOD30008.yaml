code: FOOD30008
year: 2026
learn:
  en: "Lab methods for testing food, like chromatography, spectroscopy, mass spec, ELISA, rheology and sensory tests."
  zh: "食品检测的实验方法：色谱、光谱、质谱、ELISA、流变学和感官评价。"
  zh-TW: "食品檢測的實驗方法：層析、光譜、質譜、ELISA、流變學與感官品評。"
  ja: "食品分析の手法：クロマトグラフィー、分光、質量分析、ELISA、レオロジー、官能評価。"
  ko: "식품 분석 실험법: 크로마토그래피, 분광, 질량분석, ELISA, 유변학, 관능 평가."
  vi: "Phương pháp phân tích thực phẩm: sắc ký, quang phổ, khối phổ, ELISA, lưu biến, cảm quan."
  ms: "Kaedah makmal menguji makanan: kromatografi, spektroskopi, spektrometri jisim, ELISA, reologi, deria."
  id: "Metode lab menguji pangan: kromatografi, spektroskopi, spektrometri massa, ELISA, reologi, uji sensori."
  hi: "भोजन की जाँच की लैब विधियाँ: क्रोमैटोग्राफ़ी, स्पेक्ट्रोस्कोपी, मास स्पेक, ELISA, संवेदी परीक्षण।"
outcomes:
  - en: "Choose the right method for a food analysis"
    zh: "为食品分析选合适的方法"
    zh-TW: "為食品分析選擇合適的方法"
    ja: "食品分析に適した手法を選ぶ"
    ko: "식품 분석에 맞는 방법 고르기"
    vi: "Chọn phương pháp phù hợp để phân tích"
    ms: "Pilih kaedah sesuai untuk analisis makanan"
    id: "Memilih metode yang tepat untuk analisis pangan"
    hi: "खाद्य विश्लेषण के लिए सही विधि चुनना"
  - en: "Weigh methods on reliability, cost and effort"
    zh: "从可靠性、成本和人力比较方法"
    zh-TW: "從可靠性、成本與人力比較方法"
    ja: "信頼性・費用・手間で手法を比べる"
    ko: "신뢰성·비용·노력으로 방법 비교하기"
    vi: "So sánh phương pháp về độ tin cậy, chi phí"
    ms: "Banding kaedah dari segi kebolehpercayaan dan kos"
    id: "Membandingkan metode dari keandalan dan biaya"
    hi: "विश्वसनीयता, लागत और मेहनत से विधियाँ तौलना"
