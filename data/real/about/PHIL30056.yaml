code: PHIL30056
year: 2027
learn:
  en: "The philosophy behind immigration debates: borders, refugees, family reunification, temporary migration and more."
  zh: "移民争论背后的哲学问题：边境、难民、家庭团聚、临时移民等。"
  zh-TW: "移民爭論背後的哲學問題：邊境、難民、家庭團聚、臨時移民等。"
  ja: "移民をめぐる議論の背後にある哲学：国境、難民、家族の呼び寄せ、一時的移住など。"
  ko: "이민 논쟁 뒤의 철학: 국경, 난민, 가족 재결합, 임시 이주 등."
  vi: "Triết học đằng sau các tranh luận về nhập cư: biên giới, người tị nạn, đoàn tụ gia đình, di cư tạm thời và hơn thế."
  ms: "Falsafah di sebalik perdebatan imigresen: sempadan, pelarian, penyatuan keluarga, migrasi sementara dan lain-lain."
  id: "Filsafat di balik perdebatan imigrasi: perbatasan, pengungsi, reunifikasi keluarga, migrasi sementara, dan lainnya."
  hi: "आप्रवासन बहसों के पीछे का दर्शन: सीमाएँ, शरणार्थी, परिवार पुनर्मिलन, अस्थायी प्रवास और बहुत कुछ।"
outcomes:
  - en: "Discuss recent ethical thinking on immigration"
    zh: "讨论移民问题上的最新伦理思考"
    zh-TW: "討論移民議題上的最新倫理思考"
    ja: "移民についての最近の倫理的議論を論じる"
    ko: "이민에 관한 최근 윤리 사상 논의하기"
    vi: "Thảo luận các tư tưởng đạo đức gần đây về nhập cư"
    ms: "Bincang pemikiran etika terkini tentang imigresen"
    id: "Membahas pemikiran etis terbaru tentang imigrasi"
    hi: "आप्रवासन पर हाल के नैतिक विचारों पर चर्चा"
  - en: "Analyse arguments and build your own"
    zh: "分析论证并提出自己的论点"
    zh-TW: "分析論證並提出自己的論點"
    ja: "議論を分析し自分の議論を組み立てる"
    ko: "논증을 분석하고 자신의 논증 세우기"
    vi: "Phân tích lập luận và xây dựng lập luận riêng"
    ms: "Analisis hujah dan bina hujah sendiri"
    id: "Menganalisis argumen dan menyusun argumen sendiri"
    hi: "तर्कों का विश्लेषण कर अपने तर्क गढ़ना"
