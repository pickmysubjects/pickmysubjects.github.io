code: FNCE30008
year: 2026
learn:
  en: "Finance students prepare and teach finance lessons, such as budgeting, at Melbourne high schools. Places are limited."
  zh: "金融学生备课并到墨尔本中学讲授预算等理财课，名额有限。"
  zh-TW: "財金學生備課並到墨爾本高中講授預算等理財課，名額有限。"
  ja: "金融専攻の学生がメルボルンの高校で予算管理などの授業を準備し教える。定員あり。"
  ko: "금융 전공 학생이 멜버른 고등학교에서 예산 관리 등 금융 수업을 준비해 가르침. 정원 제한."
  vi: "Sinh viên tài chính soạn và dạy các bài học tài chính như lập ngân sách tại trường trung học ở Melbourne. Số chỗ có hạn."
  ms: "Pelajar kewangan menyedia dan mengajar pelajaran kewangan, seperti belanjawan, di sekolah menengah Melbourne. Tempat terhad."
  id: "Mahasiswa keuangan menyiapkan dan mengajar materi keuangan, seperti penganggaran, di SMA Melbourne. Kuota terbatas."
  hi: "फ़ाइनेंस के छात्र मेलबर्न के हाई स्कूलों में बजटिंग जैसे वित्त पाठ तैयार कर पढ़ाते हैं। सीटें सीमित हैं।"
outcomes:
  - en: "Explain finance clearly to non-experts"
    zh: "向非专业人士讲清金融概念"
    zh-TW: "向非專業人士講清楚金融概念"
    ja: "専門外の人に金融をわかりやすく説明する"
    ko: "비전문가에게 금융을 쉽게 설명하기"
    vi: "Giải thích tài chính rõ ràng cho người không chuyên"
    ms: "Terangkan kewangan dengan jelas kepada orang awam"
    id: "Menjelaskan keuangan dengan jelas ke orang awam"
    hi: "गैर-विशेषज्ञों को वित्त साफ़-साफ़ समझाना"
  - en: "Plan and deliver lessons for a real class"
    zh: "为真实课堂备课并授课"
    zh-TW: "為真實課堂備課並授課"
    ja: "実際のクラス向けに授業を計画し実施する"
    ko: "실제 수업 계획하고 진행하기"
    vi: "Lên kế hoạch và dạy bài cho một lớp học thật"
    ms: "Rancang dan sampaikan pelajaran untuk kelas sebenar"
    id: "Merancang dan membawakan pelajaran untuk kelas nyata"
    hi: "असली कक्षा के लिए पाठ की योजना बनाना और पढ़ाना"
  - en: "Understand financial literacy issues young people face"
    zh: "了解年轻人面临的理财素养问题"
    zh-TW: "了解年輕人面臨的理財素養問題"
    ja: "若者が直面する金融リテラシーの課題を理解する"
    ko: "청소년이 겪는 금융 이해력 문제 이해하기"
    vi: "Hiểu các vấn đề hiểu biết tài chính của người trẻ"
    ms: "Faham isu celik kewangan yang dihadapi orang muda"
    id: "Memahami masalah literasi keuangan anak muda"
    hi: "युवाओं की वित्तीय साक्षरता से जुड़ी चुनौतियाँ समझना"
