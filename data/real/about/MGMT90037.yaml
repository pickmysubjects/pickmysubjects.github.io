code: MGMT90037
year: 2027
learn:
  en: "Workplace conflict and how to handle it through influence and negotiation, practised in cases and simulations."
  zh: "职场冲突及如何通过影响和谈判来处理，并在案例和模拟中练习。"
  zh-TW: "職場衝突及如何透過影響與談判處理，並在個案與模擬中練習。"
  ja: "職場の対立と、影響力や交渉による対処法。ケースや模擬交渉で練習する。"
  ko: "직장 갈등과 영향력·협상으로 다루는 법을 사례와 시뮬레이션으로 연습한다."
  vi: "Xung đột nơi làm việc và cách xử lý bằng gây ảnh hưởng, đàm phán, luyện qua tình huống và mô phỏng."
  ms: "Konflik di tempat kerja dan cara menanganinya melalui pengaruh dan rundingan, dilatih dalam kes dan simulasi."
  id: "Konflik di tempat kerja dan cara menanganinya lewat pengaruh dan negosiasi, dilatih dalam kasus dan simulasi."
  hi: "कार्यस्थल का टकराव और प्रभाव व बातचीत से उसे संभालना, केस और सिमुलेशन में अभ्यास के साथ।"
outcomes:
  - en: "Tell different types of conflict apart"
    zh: "区分不同类型的冲突"
    zh-TW: "區分不同類型的衝突"
    ja: "対立の種類を見分ける"
    ko: "갈등 유형 구분하기"
    vi: "Phân biệt các loại xung đột"
    ms: "Membezakan jenis konflik"
    id: "Membedakan jenis konflik"
    hi: "अलग-अलग तरह के टकराव पहचानना"
  - en: "Plan and carry out a negotiation strategy"
    zh: "制定并执行谈判策略"
    zh-TW: "制定並執行談判策略"
    ja: "交渉戦略を立てて実行する"
    ko: "협상 전략 수립·실행하기"
    vi: "Lập và thực hiện chiến lược đàm phán"
    ms: "Merancang dan melaksana strategi rundingan"
    id: "Menyusun dan menjalankan strategi negosiasi"
    hi: "बातचीत की रणनीति बनाना और लागू करना"
