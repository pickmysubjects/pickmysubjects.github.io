code: ENGL30013
year: 2026
learn:
  en: "Gothic fiction from its 18th-century start to today: horror, terror, monsters, and what they say about power and the self."
  zh: "哥特小说从 18 世纪兴起至今：恐怖、惊悚与怪物，以及它们如何映照权力与自我。"
  zh-TW: "哥德小說從 18 世紀興起至今：恐怖、驚悚與怪物，以及它們如何映照權力與自我。"
  ja: "18世紀の誕生から現代までのゴシック小説。恐怖、戦慄、怪物が権力と自己について何を語るか。"
  ko: "18세기 탄생부터 오늘날까지의 고딕 소설. 공포, 전율, 괴물이 권력과 자아에 대해 말하는 것."
  vi: "Tiểu thuyết Gothic từ thế kỷ 18 đến nay: kinh dị, khiếp sợ, quái vật, và điều chúng nói về quyền lực và cái tôi."
  ms: "Fiksyen Gotik dari abad ke-18 hingga kini: seram, ngeri, raksasa, dan apa yang ia katakan tentang kuasa dan diri."
  id: "Fiksi Gotik sejak abad ke-18 hingga kini: horor, teror, monster, dan apa artinya bagi kekuasaan dan diri."
  hi: "18वीं सदी से आज तक गॉथिक कथा: डर, आतंक, राक्षस, और वे सत्ता व 'स्व' के बारे में क्या कहते हैं।"
outcomes:
  - en: "Recognise the conventions of Gothic fiction"
    zh: "辨识哥特小说的常见手法"
    zh-TW: "辨識哥德小說的常見手法"
    ja: "ゴシック小説のお約束を見分ける"
    ko: "고딕 소설의 관습 알아보기"
    vi: "Nhận ra các quy ước của tiểu thuyết Gothic"
    ms: "Kenal pasti konvensi fiksyen Gotik"
    id: "Mengenali konvensi fiksi Gotik"
    hi: "गॉथिक कथा की परिपाटियाँ पहचानना"
  - en: "Connect horror to its historical context"
    zh: "把恐怖元素与历史背景联系起来"
    zh-TW: "把恐怖元素與歷史背景聯繫起來"
    ja: "恐怖の表現を歴史的背景と結びつける"
    ko: "공포 표현을 역사적 맥락과 연결하기"
    vi: "Liên hệ yếu tố kinh dị với bối cảnh lịch sử"
    ms: "Kaitkan unsur seram dengan konteks sejarah"
    id: "Mengaitkan horor dengan konteks sejarahnya"
    hi: "डर को उसके ऐतिहासिक संदर्भ से जोड़ना"
  - en: "Trace how the genre changes over time"
    zh: "追踪这一文类随时间的演变"
    zh-TW: "追蹤這一文類隨時間的演變"
    ja: "ジャンルの時代による変化をたどる"
    ko: "장르가 시대에 따라 바뀌는 과정 추적하기"
    vi: "Lần theo sự biến đổi của thể loại qua thời gian"
    ms: "Jejaki perubahan genre dari masa ke masa"
    id: "Menelusuri perubahan genre dari masa ke masa"
    hi: "समय के साथ इस विधा का बदलाव देखना"
