code: ITAL30015
year: 2026
learn:
  en: "Today's Italy in its own language: films, music, media and books, with regular conversation to make your Italian more fluent."
  zh: "用意大利语认识当代意大利：电影、音乐、媒体和书籍，并通过定期会话提升流利度。"
  zh-TW: "用義大利語認識當代義大利：電影、音樂、媒體和書籍，並透過定期會話提升流利度。"
  ja: "映画・音楽・メディア・本で今のイタリアを知り、定期的な会話練習でイタリア語を流暢にする。"
  ko: "영화·음악·미디어·책으로 오늘의 이탈리아를 알고, 꾸준한 회화로 이탈리아어를 유창하게."
  vi: "Nước Ý ngày nay bằng chính tiếng Ý: phim, nhạc, truyền thông, sách, cùng luyện hội thoại đều đặn để nói trôi chảy."
  ms: "Itali masa kini dalam bahasanya sendiri: filem, muzik, media dan buku, dengan perbualan kerap untuk lebih fasih."
  id: "Italia masa kini dalam bahasanya sendiri: film, musik, media dan buku, dengan latihan percakapan rutin agar lebih lancar."
  hi: "आज का इटली उसकी अपनी भाषा में: फ़िल्में, संगीत, मीडिया और किताबें, नियमित बातचीत से इतालवी ज़्यादा धाराप्रवाह।"
outcomes:
  - en: "Discuss social and cultural topics in Italian"
    zh: "用意大利语讨论社会和文化话题"
    zh-TW: "用義大利語討論社會和文化話題"
    ja: "社会や文化の話題をイタリア語で話し合う"
    ko: "사회·문화 주제를 이탈리아어로 토론하기"
    vi: "Thảo luận chủ đề xã hội, văn hóa bằng tiếng Ý"
    ms: "Bincangkan topik sosial dan budaya dalam bahasa Itali"
    id: "Membahas topik sosial dan budaya dalam bahasa Italia"
    hi: "सामाजिक और सांस्कृतिक विषयों पर इतालवी में चर्चा करना"
  - en: "Read and write longer Italian texts"
    zh: "读写较长的意大利语文章"
    zh-TW: "讀寫較長的義大利語文章"
    ja: "長めのイタリア語の文章を読み書きする"
    ko: "긴 이탈리아어 글 읽고 쓰기"
    vi: "Đọc và viết văn bản tiếng Ý dài hơn"
    ms: "Baca dan tulis teks bahasa Itali yang lebih panjang"
    id: "Membaca dan menulis teks bahasa Italia yang lebih panjang"
    hi: "लंबे इतालवी पाठ पढ़ना-लिखना"
  - en: "Give a clear presentation in Italian"
    zh: "用意大利语做清楚的口头报告"
    zh-TW: "用義大利語做清楚的口頭報告"
    ja: "イタリア語で分かりやすく発表する"
    ko: "이탈리아어로 명확하게 발표하기"
    vi: "Thuyết trình rõ ràng bằng tiếng Ý"
    ms: "Buat pembentangan yang jelas dalam bahasa Itali"
    id: "Melakukan presentasi yang jelas dalam bahasa Italia"
    hi: "इतालवी में स्पष्ट प्रस्तुति देना"
