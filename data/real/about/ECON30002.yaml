code: ECON30002
year: 2026
learn:
  en: "Why some countries grow rich and others don't, and which policies actually help development."
  zh: "为什么有的国家富起来、有的没有，哪些政策真正有助于发展。"
  zh-TW: "為什麼有的國家富起來、有的沒有，哪些政策真正有助於發展。"
  ja: "豊かになる国とならない国があるのはなぜか、どんな政策が発展に本当に役立つか。"
  ko: "어떤 나라는 부유해지고 어떤 나라는 그렇지 못한 이유, 실제로 발전에 도움 되는 정책."
  vi: "Vì sao có nước giàu lên còn nước khác thì không, và chính sách nào thực sự giúp phát triển."
  ms: "Mengapa sesetengah negara jadi kaya dan yang lain tidak, dan dasar mana benar-benar bantu pembangunan."
  id: "Mengapa sebagian negara jadi kaya dan yang lain tidak, dan kebijakan mana yang benar-benar membantu pembangunan."
  hi: "कुछ देश अमीर क्यों बनते हैं और कुछ नहीं, और कौन-सी नीतियाँ विकास में सच में मदद करती हैं।"
outcomes:
  - en: "Explain how development is defined and measured"
    zh: "解释发展的定义和衡量方式"
    zh-TW: "解釋發展的定義和衡量方式"
    ja: "発展の定義と測り方を説明する"
    ko: "발전의 정의와 측정 방법 설명"
    vi: "Giải thích cách định nghĩa và đo lường phát triển"
    ms: "Terangkan cara pembangunan ditakrif dan diukur"
    id: "Menjelaskan cara pembangunan didefinisikan dan diukur"
    hi: "विकास की परिभाषा और माप समझाना"
  - en: "Use theory and data to analyse development issues"
    zh: "用理论和数据分析发展问题"
    zh-TW: "用理論和資料分析發展議題"
    ja: "理論とデータで開発の課題を分析する"
    ko: "이론과 데이터로 개발 문제 분석"
    vi: "Dùng lý thuyết và dữ liệu phân tích vấn đề phát triển"
    ms: "Guna teori dan data untuk analisis isu pembangunan"
    id: "Memakai teori dan data untuk menganalisis isu pembangunan"
    hi: "सिद्धांत और डेटा से विकास के मुद्दे परखना"
  - en: "Critically assess development policy advice"
    zh: "批判性地评估发展政策建议"
    zh-TW: "批判性地評估發展政策建議"
    ja: "開発政策の提言を批判的に評価する"
    ko: "개발 정책 제안을 비판적으로 평가"
    vi: "Đánh giá có phê phán các khuyến nghị chính sách phát triển"
    ms: "Nilai secara kritis cadangan dasar pembangunan"
    id: "Menilai secara kritis saran kebijakan pembangunan"
    hi: "विकास नीति की सलाह को आलोचनात्मक ढंग से परखना"
