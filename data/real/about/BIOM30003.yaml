code: BIOM30003
year: 2026
learn:
  en: "An individual supervised research project where you help design, carry out and present the research."
  zh: "在导师指导下做个人研究项目，参与设计、执行和展示。"
  zh-TW: "在導師指導下做個人研究專題，參與設計、執行和展示。"
  ja: "指導教員のもとで行う個人研究プロジェクト。研究の計画・実施・発表に関わる。"
  ko: "지도 아래 하는 개인 연구 프로젝트로, 연구 설계·수행·발표에 참여."
  vi: "Dự án nghiên cứu cá nhân có hướng dẫn, bạn tham gia thiết kế, thực hiện và trình bày."
  ms: "Projek penyelidikan individu berpenyelia; anda bantu reka, jalankan dan bentangkan kajian."
  id: "Proyek riset individu dengan pembimbing; kamu ikut merancang, menjalankan, dan mempresentasikannya."
  hi: "सुपरवाइज़र के साथ व्यक्तिगत रिसर्च प्रोजेक्ट, जिसमें आप रिसर्च डिज़ाइन, करने और पेश करने में हिस्सा लेते हैं।"
outcomes:
  - en: "Design a project to answer a research question"
    zh: "设计项目回答研究问题"
    zh-TW: "設計專題回答研究問題"
    ja: "研究課題に答えるプロジェクトを計画する"
    ko: "연구 질문에 답할 프로젝트 설계하기"
    vi: "Thiết kế dự án để trả lời câu hỏi nghiên cứu"
    ms: "Reka projek untuk menjawab soalan kajian"
    id: "Merancang proyek untuk menjawab pertanyaan riset"
    hi: "रिसर्च सवाल का जवाब देने के लिए प्रोजेक्ट डिज़ाइन करना"
  - en: "Collect data and analyse it with statistics"
    zh: "收集数据并做统计分析"
    zh-TW: "收集資料並做統計分析"
    ja: "データを集めて統計で分析する"
    ko: "데이터를 모아 통계로 분석하기"
    vi: "Thu thập dữ liệu và phân tích bằng thống kê"
    ms: "Kumpul data dan analisis dengan statistik"
    id: "Mengumpulkan data dan menganalisisnya dengan statistik"
    hi: "डेटा इकट्ठा करके स्टैटिस्टिक्स से विश्लेषण"
  - en: "Present results in writing and a talk or poster"
    zh: "用论文和报告或海报展示结果"
    zh-TW: "用論文和報告或海報展示結果"
    ja: "結果を文章と口頭発表またはポスターで示す"
    ko: "결과를 글과 발표 또는 포스터로 제시하기"
    vi: "Trình bày kết quả bằng bài viết và thuyết trình hoặc poster"
    ms: "Bentang keputusan secara bertulis dan ceramah atau poster"
    id: "Menyajikan hasil secara tertulis dan presentasi atau poster"
    hi: "नतीजे लिखकर और टॉक या पोस्टर से पेश करना"
