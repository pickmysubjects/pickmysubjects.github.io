code: BIOM30003
year: 2026
learn:
  en: "An individual supervised research project where you help design, carry out and present the research."
  zh: "在导师指导下做个人研究项目，参与设计、执行和展示。"
outcomes:
  - en: "Design a project to answer a research question"
    zh: "设计项目回答研究问题"
  - en: "Collect data and analyse it with statistics"
    zh: "收集数据并做统计分析"
  - en: "Present results in writing and a talk or poster"
    zh: "用论文和报告或海报展示结果"
