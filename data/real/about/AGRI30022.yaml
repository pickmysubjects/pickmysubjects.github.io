code: AGRI30022
year: 2026
learn:
  en: "A supervised research project on an agriculture or land management topic you pick yourself."
  zh: "在导师指导下，自选农业或土地管理课题做研究。"
  zh-TW: "在導師指導下，自選農業或土地管理課題做研究。"
  ja: "農業や土地管理から自分で選んだテーマを指導のもとで研究する。"
  ko: "직접 고른 농업·토지관리 주제를 지도교수와 함께 연구."
  vi: "Dự án nghiên cứu có hướng dẫn về chủ đề nông nghiệp hoặc quản lý đất do bạn chọn."
  ms: "Projek penyelidikan diselia tentang topik pertanian atau pengurusan tanah pilihan anda."
  id: "Proyek riset terbimbing tentang topik pertanian atau pengelolaan lahan pilihanmu."
  hi: "अपने चुने कृषि या भूमि प्रबंधन विषय पर पर्यवेक्षित शोध परियोजना।"
outcomes:
  - en: "Plan and run your own research"
    zh: "自己规划并开展研究"
    zh-TW: "自己規劃並進行研究"
    ja: "自分で研究を計画し進める"
    ko: "스스로 연구 계획하고 수행하기"
    vi: "Tự lên kế hoạch và thực hiện nghiên cứu"
    ms: "Rancang dan jalankan penyelidikan sendiri"
    id: "Merencanakan dan menjalankan riset sendiri"
    hi: "अपना शोध खुद योजना बनाकर करना"
  - en: "Gather, analyse and interpret data on a topic"
    zh: "收集、分析并解读课题数据"
    zh-TW: "蒐集、分析並解讀課題資料"
    ja: "テーマのデータを集め分析し解釈する"
    ko: "주제 관련 데이터 수집·분석·해석하기"
    vi: "Thu thập, phân tích và diễn giải dữ liệu"
    ms: "Kumpul, analisis dan tafsir data sesuatu topik"
    id: "Mengumpulkan, menganalisis, dan menafsirkan data"
    hi: "विषय पर डेटा इकट्ठा, विश्लेषण और व्याख्या करना"
  - en: "Write a clear report backed by argument"
    zh: "写出论证清晰的报告"
    zh-TW: "寫出論證清晰的報告"
    ja: "論拠のある分かりやすい報告を書く"
    ko: "논거가 탄탄한 보고서 쓰기"
    vi: "Viết báo cáo rõ ràng, có lập luận"
    ms: "Tulis laporan jelas yang disokong hujah"
    id: "Menulis laporan jelas dengan argumen kuat"
    hi: "तर्क के साथ स्पष्ट रिपोर्ट लिखना"
