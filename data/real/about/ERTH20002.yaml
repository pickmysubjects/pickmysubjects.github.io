code: ERTH20002
year: 2026
learn:
  en: "How mining, CO2 and gas extraction disturb groundwater, oceans and surface chemistry, and how to measure it."
  zh: "采矿、二氧化碳和天然气开采如何扰动地下水、海洋和地表化学，以及如何量化。"
  zh-TW: "採礦、二氧化碳和天然氣開採如何擾動地下水、海洋和地表化學，以及如何量化。"
  ja: "採掘・CO2・ガス開発が地下水・海洋・地表の化学をどう乱すか、その定量方法。"
  ko: "채굴·CO2·가스 개발이 지하수·해양·지표 화학을 어떻게 교란하는지와 측정법."
  vi: "Khai mỏ, CO2 và khai thác khí làm xáo trộn nước ngầm, đại dương, hóa học bề mặt ra sao và cách đo."
  ms: "Bagaimana perlombongan, CO2 dan pengeluaran gas mengganggu air bawah tanah, lautan dan kimia permukaan, serta cara mengukurnya."
  id: "Bagaimana tambang, CO2, dan ekstraksi gas mengganggu air tanah, laut, dan kimia permukaan, serta cara mengukurnya."
  hi: "खनन, CO2 और गैस निष्कर्षण भूजल, महासागर और सतही रसायन को कैसे बिगाड़ते हैं, और इसे कैसे मापें।"
outcomes:
  - en: "Identify human impacts on Earth-surface processes"
    zh: "识别人类对地表过程的扰动"
    zh-TW: "辨識人類對地表過程的擾動"
    ja: "地表プロセスへの人為的影響を見つける"
    ko: "지표 과정에 대한 인간 영향을 찾는다"
    vi: "Nhận diện tác động của con người lên bề mặt"
    ms: "Kenal pasti kesan manusia pada proses permukaan"
    id: "Mengenali dampak manusia pada proses permukaan"
    hi: "पृथ्वी की सतह पर मानवीय प्रभाव पहचानना"
  - en: "Assess cumulative subsurface impacts"
    zh: "评估地下扰动的累积影响"
    zh-TW: "評估地下擾動的累積影響"
    ja: "地下の累積的影響を評価する"
    ko: "지하 교란의 누적 영향을 평가한다"
    vi: "Đánh giá tác động tích lũy dưới lòng đất"
    ms: "Nilai kesan kumulatif bawah permukaan"
    id: "Menilai dampak kumulatif bawah permukaan"
    hi: "भूमिगत संचयी प्रभावों का आकलन"
