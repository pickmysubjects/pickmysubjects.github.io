code: BTCH90009
year: 2027
learn:
  en: "How genomes are sequenced and annotated, and using public databases to find biological information."
  zh: "基因组如何测序和注释，以及如何用公共数据库获取生物信息。"
  zh-TW: "基因體如何定序與註解，以及如何用公共資料庫取得生物資訊。"
  ja: "ゲノムの解読と注釈、公開データベースでの生物情報の検索。"
  ko: "유전체 시퀀싱과 주석, 공개 데이터베이스로 생물 정보 찾기."
  vi: "Cách giải trình tự và chú giải bộ gen, dùng cơ sở dữ liệu công khai."
  ms: "Cara genom dijujuk dan dianotasi, serta guna pangkalan data awam."
  id: "Cara genom disekuensing dan dianotasi, serta memakai basis data publik."
  hi: "जीनोम की सीक्वेंसिंग व एनोटेशन, और सार्वजनिक डेटाबेस से जैविक जानकारी पाना।"
outcomes:
  - en: "Explain genome sequencing and analysis"
    zh: "解释基因组测序与分析"
    zh-TW: "解釋基因體定序與分析"
    ja: "ゲノム解読と解析を説明する"
    ko: "유전체 시퀀싱·분석 설명하기"
    vi: "Giải thích giải trình tự và phân tích bộ gen"
    ms: "Menerangkan penjujukan dan analisis genom"
    id: "Menjelaskan sekuensing dan analisis genom"
    hi: "जीनोम सीक्वेंसिंग और विश्लेषण समझाना"
  - en: "Critically read new genomics datasets"
    zh: "批判性解读新的基因组数据"
    zh-TW: "批判性解讀新的基因體資料"
    ja: "新しいゲノムデータを批判的に読む"
    ko: "새 유전체 데이터 비판적으로 읽기"
    vi: "Đọc phản biện dữ liệu hệ gen mới"
    ms: "Membaca data genomik baharu secara kritis"
    id: "Membaca data genomik baru secara kritis"
    hi: "नए जीनोमिक्स डेटा को आलोचनात्मक ढंग से पढ़ना"
  - en: "Retrieve information from public databases"
    zh: "从公共数据库检索信息"
    zh-TW: "從公共資料庫檢索資訊"
    ja: "公開データベースから情報を取り出す"
    ko: "공개 데이터베이스에서 정보 찾기"
    vi: "Truy xuất thông tin từ cơ sở dữ liệu công khai"
    ms: "Mendapatkan maklumat dari pangkalan data awam"
    id: "Mengambil informasi dari basis data publik"
    hi: "सार्वजनिक डेटाबेस से जानकारी निकालना"
