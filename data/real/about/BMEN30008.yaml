code: BMEN30008
year: 2026
learn:
  en: "A team capstone where you design and test a biomedical system, using biosensors and signal processing."
  zh: "团队毕业项目：用生物传感器和信号处理设计并测试生物医学系统。"
  zh-TW: "團隊畢業專題：用生物感測器與訊號處理設計並測試生醫系統。"
  ja: "チームでの総まとめ：バイオセンサーと信号処理で医療システムを設計・試験する。"
  ko: "팀 캡스톤: 바이오센서와 신호처리로 생체의료 시스템을 설계·시험한다."
  vi: "Dự án nhóm tổng kết: thiết kế và thử nghiệm hệ thống y sinh bằng cảm biến sinh học và xử lý tín hiệu."
  ms: "Projek puncak berpasukan: reka dan uji sistem bioperubatan dengan biosensor dan pemprosesan isyarat."
  id: "Capstone tim: merancang dan menguji sistem biomedis dengan biosensor dan pemrosesan sinyal."
  hi: "टीम कैपस्टोन: बायोसेंसर और सिग्नल प्रोसेसिंग से बायोमेडिकल सिस्टम डिज़ाइन व टेस्ट करें।"
outcomes:
  - en: "Design a system to a performance spec"
    zh: "按性能指标设计系统"
    zh-TW: "依效能規格設計系統"
    ja: "性能仕様に沿ってシステムを設計する"
    ko: "성능 사양에 맞춰 시스템 설계하기"
    vi: "Thiết kế hệ thống theo chỉ tiêu hiệu năng"
    ms: "Reka sistem mengikut spesifikasi prestasi"
    id: "Merancang sistem sesuai spesifikasi kinerja"
    hi: "प्रदर्शन मानकों के अनुसार सिस्टम डिज़ाइन करें"
  - en: "Test a biomedical prototype"
    zh: "测试生物医学原型"
    zh-TW: "測試生醫原型"
    ja: "医療用試作品を試験する"
    ko: "생체의료 시제품 시험하기"
    vi: "Thử nghiệm nguyên mẫu y sinh"
    ms: "Uji prototaip bioperubatan"
    id: "Menguji prototipe biomedis"
    hi: "बायोमेडिकल प्रोटोटाइप का परीक्षण करें"
  - en: "Weigh ethics, safety and regulation in design"
    zh: "设计中兼顾伦理、安全与法规"
    zh-TW: "設計中兼顧倫理、安全與法規"
    ja: "設計で倫理・安全・規制を考慮する"
    ko: "설계에서 윤리·안전·규제 고려하기"
    vi: "Cân nhắc đạo đức, an toàn và quy định khi thiết kế"
    ms: "Ambil kira etika, keselamatan dan peraturan"
    id: "Mempertimbangkan etika, keamanan, dan regulasi"
    hi: "डिज़ाइन में नैतिकता, सुरक्षा और नियम देखें"
