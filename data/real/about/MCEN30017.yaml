code: MCEN30017
year: 2026
learn:
  en: "Why materials bend, break and fail, and how to work out stress and strain, including with finite elements."
  zh: "材料为何变形和断裂，以及如何算应力应变和有限元。"
  zh-TW: "材料為何變形和斷裂，以及如何算應力應變與有限元素。"
  ja: "材料が曲がり壊れる理由と、有限要素法を含む応力・ひずみの求め方。"
  ko: "재료가 휘고 부서지는 이유와 유한요소법을 포함한 응력·변형률 계산."
  vi: "Vì sao vật liệu biến dạng, gãy và cách tính ứng suất, biến dạng, kể cả phần tử hữu hạn."
  ms: "Mengapa bahan bengkok dan patah, serta cara mengira tegasan dan terikan, termasuk unsur terhingga."
  id: "Mengapa material melentur dan patah, serta cara menghitung tegangan dan regangan, termasuk elemen hingga."
  hi: "मटीरियल क्यों मुड़ते-टूटते हैं, और फ़ाइनाइट एलिमेंट समेत स्ट्रेस-स्ट्रेन कैसे निकालें।"
outcomes:
  - en: "Do basic stress and strain analysis"
    zh: "做基本的应力应变分析"
    zh-TW: "做基本的應力應變分析"
    ja: "基本的な応力・ひずみ解析を行う"
    ko: "기본 응력·변형률 해석하기"
    vi: "Phân tích ứng suất và biến dạng cơ bản"
    ms: "Membuat analisis tegasan dan terikan asas"
    id: "Melakukan analisis tegangan dan regangan dasar"
    hi: "बेसिक स्ट्रेस और स्ट्रेन एनालिसिस करना"
  - en: "Run a finite element stress analysis"
    zh: "用有限元做应力分析"
    zh-TW: "用有限元素做應力分析"
    ja: "有限要素法で応力解析を行う"
    ko: "유한요소법으로 응력 해석하기"
    vi: "Phân tích ứng suất bằng phần tử hữu hạn"
    ms: "Menjalankan analisis tegasan unsur terhingga"
    id: "Menjalankan analisis tegangan elemen hingga"
    hi: "फ़ाइनाइट एलिमेंट से स्ट्रेस एनालिसिस करना"
