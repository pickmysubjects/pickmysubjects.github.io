code: CHIN10002
year: 2026
learn:
  en: "Continues Chinese 9 for heritage and advanced learners, building reading, writing and discussion on Chinese society."
  zh: "中文9的延续，面向华裔背景和高级学习者，提升阅读、写作和对中国社会的讨论能力。"
  zh-TW: "中文9的延續，面向華裔背景和高級學習者，提升閱讀、寫作和對中國社會的討論能力。"
  ja: "中国語9の続き。継承語・上級の学習者向けに、中国社会についての読解・作文・討論力を伸ばす。"
  ko: "중국어 9에 이어 계승어·고급 학습자를 위해 중국 사회에 관한 읽기, 쓰기, 토론 능력을 키운다."
  vi: "Tiếp nối Tiếng Trung 9 cho người học gốc Hoa và trình độ cao, nâng kỹ năng đọc, viết, thảo luận về xã hội Trung Quốc."
  ms: "Sambungan Bahasa Cina 9 untuk pelajar berlatar warisan dan lanjutan, membina bacaan, penulisan dan perbincangan tentang masyarakat China."
  id: "Lanjutan Mandarin 9 bagi pelajar berlatar warisan dan tingkat lanjut, membangun membaca, menulis, dan diskusi soal masyarakat Tiongkok."
  hi: "चीनी 9 का अगला भाग, विरासत और उन्नत सीखने वालों के लिए, चीनी समाज पर पढ़ने, लिखने और चर्चा की क्षमता बढ़ाना।"
outcomes:
  - en: "Read longer authentic Chinese texts"
    zh: "阅读更长的原文中文材料"
    zh-TW: "閱讀更長的原文中文材料"
    ja: "より長い本物の中国語の文章を読む"
    ko: "더 긴 실제 중국어 글 읽기"
    vi: "Đọc các văn bản tiếng Trung thực tế dài hơn"
    ms: "Baca teks Cina asli yang lebih panjang"
    id: "Membaca teks Mandarin asli yang lebih panjang"
    hi: "लंबे मूल चीनी पाठ पढ़ना"
  - en: "Present and discuss ideas in Chinese"
    zh: "用中文展示和讨论观点"
    zh-TW: "用中文展示和討論觀點"
    ja: "中国語で考えを発表し議論する"
    ko: "중국어로 생각을 발표하고 토론하기"
    vi: "Trình bày và thảo luận ý tưởng bằng tiếng Trung"
    ms: "Bentang dan bincangkan idea dalam bahasa Cina"
    id: "Menyajikan dan membahas gagasan dalam bahasa Mandarin"
    hi: "चीनी में विचार प्रस्तुत करना और चर्चा करना"
  - en: "Analyse social issues in Chinese texts"
    zh: "分析中文文本中的社会议题"
    zh-TW: "分析中文文本中的社會議題"
    ja: "中国語の文章に出る社会問題を分析する"
    ko: "중국어 글 속 사회 문제 분석하기"
    vi: "Phân tích các vấn đề xã hội trong văn bản tiếng Trung"
    ms: "Analisis isu sosial dalam teks Cina"
    id: "Menganalisis isu sosial dalam teks Mandarin"
    hi: "चीनी पाठों में सामाजिक मुद्दों का विश्लेषण करना"
