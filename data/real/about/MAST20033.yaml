code: MAST20033
year: 2026
learn:
  en: "Rigorous proofs about real numbers, limits, series and integrals, with extra advanced topics."
  zh: "严格证明实数、极限、级数和积分，比普通版多一些进阶内容。"
  zh-TW: "嚴格證明實數、極限、級數和積分，比普通版多一些進階內容。"
  ja: "実数・極限・級数・積分の厳密な証明。発展的なトピックも追加。"
  ko: "실수, 극한, 급수, 적분에 대한 엄밀한 증명과 추가 심화 주제."
  vi: "Chứng minh chặt chẽ về số thực, giới hạn, chuỗi và tích phân, thêm chủ đề nâng cao."
  ms: "Bukti rapi tentang nombor nyata, had, siri dan kamiran, dengan topik lanjutan tambahan."
  id: "Bukti ketat tentang bilangan real, limit, deret, dan integral, plus topik lanjutan."
  hi: "वास्तविक संख्या, सीमा, श्रेणी और इंटीग्रल के सख्त प्रमाण, कुछ उन्नत विषयों के साथ।"
outcomes:
  - en: "Write proofs by induction, contradiction and epsilon-delta"
    zh: "会用归纳、反证和 ε-δ 写证明"
    zh-TW: "會用歸納、反證和 ε-δ 寫證明"
    ja: "帰納法・背理法・ε-δ論法で証明を書く"
    ko: "귀납법, 귀류법, 엡실론-델타로 증명 쓰기"
    vi: "Chứng minh bằng quy nạp, phản chứng và epsilon-delta"
    ms: "Menulis bukti secara aruhan, percanggahan dan epsilon-delta"
    id: "Menulis bukti dengan induksi, kontradiksi, dan epsilon-delta"
    hi: "आगमन, विरोधाभास और एप्सिलॉन-डेल्टा से प्रमाण लिखना"
  - en: "Analyse whether sequences converge"
    zh: "分析数列是否收敛"
    zh-TW: "分析數列是否收斂"
    ja: "数列が収束するか調べる"
    ko: "수열의 수렴 여부 분석하기"
    vi: "Phân tích dãy có hội tụ không"
    ms: "Menganalisis sama ada jujukan menumpu"
    id: "Menganalisis apakah barisan konvergen"
    hi: "अनुक्रम अभिसारी है या नहीं, जाँचना"
  - en: "Use power series and Taylor approximations"
    zh: "会用幂级数和泰勒近似"
    zh-TW: "會用冪級數和泰勒近似"
    ja: "べき級数とテイラー近似を使う"
    ko: "멱급수와 테일러 근사 사용하기"
    vi: "Dùng chuỗi lũy thừa và xấp xỉ Taylor"
    ms: "Menggunakan siri kuasa dan penghampiran Taylor"
    id: "Memakai deret pangkat dan aproksimasi Taylor"
    hi: "घात श्रेणी और टेलर सन्निकटन का उपयोग"
