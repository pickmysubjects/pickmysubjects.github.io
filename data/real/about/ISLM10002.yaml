code: ISLM10002
year: 2026
learn:
  en: "How Muslims around the world engage with modern life and reinterpret Islam, beyond the idea of one fixed tradition."
  zh: "全球穆斯林如何面对现代生活、重新诠释伊斯兰，而非一成不变的传统。"
  zh-TW: "全球穆斯林如何面對現代生活、重新詮釋伊斯蘭，而非一成不變的傳統。"
  ja: "世界のムスリムが現代の暮らしにどう向き合い、イスラムを解釈し直しているかを、固定した伝統という見方を越えて学ぶ。"
  ko: "전 세계 무슬림이 현대 생활과 어떻게 마주하고 이슬람을 재해석하는지, 고정된 전통이라는 시각을 넘어 배운다."
  vi: "Người Hồi giáo khắp thế giới đối diện đời sống hiện đại và diễn giải lại Hồi giáo ra sao, vượt khỏi ý niệm một truyền thống bất biến."
  ms: "Cara umat Islam di seluruh dunia berdepan kehidupan moden dan mentafsir semula Islam, melangkaui idea tradisi yang tetap."
  id: "Cara Muslim di seluruh dunia menghadapi kehidupan modern dan menafsirkan ulang Islam, melampaui anggapan tradisi yang statis."
  hi: "दुनिया भर के मुसलमान आधुनिक जीवन से कैसे जुड़ते और इस्लाम की नई व्याख्या करते हैं, एक जड़ परंपरा की धारणा से आगे।"
outcomes:
  - en: "Challenge common stereotypes about Islam"
    zh: "反思关于伊斯兰的常见刻板印象"
    zh-TW: "反思關於伊斯蘭的常見刻板印象"
    ja: "イスラムについてのよくある固定観念を問い直す"
    ko: "이슬람에 대한 흔한 고정관념 따져보기"
    vi: "Phản biện các định kiến phổ biến về Hồi giáo"
    ms: "Cabar stereotaip biasa tentang Islam"
    id: "Mempertanyakan stereotip umum tentang Islam"
    hi: "इस्लाम के बारे में आम रूढ़ियों पर सवाल उठाना"
  - en: "Explain how Muslims respond to modernity"
    zh: "解释穆斯林如何回应现代性"
    zh-TW: "解釋穆斯林如何回應現代性"
    ja: "ムスリムが近代にどう応じてきたか説明する"
    ko: "무슬림이 근대성에 대응하는 방식 설명하기"
    vi: "Giải thích người Hồi giáo phản ứng với hiện đại ra sao"
    ms: "Terangkan cara umat Islam bertindak balas terhadap kemodenan"
    id: "Menjelaskan cara Muslim menanggapi modernitas"
    hi: "मुसलमान आधुनिकता पर कैसे प्रतिक्रिया देते हैं, समझाना"
  - en: "Compare Muslim societies around the world"
    zh: "比较世界各地的穆斯林社会"
    zh-TW: "比較世界各地的穆斯林社會"
    ja: "世界各地のムスリム社会を比べる"
    ko: "세계 각지의 무슬림 사회 비교하기"
    vi: "So sánh các xã hội Hồi giáo trên thế giới"
    ms: "Bandingkan masyarakat Islam di seluruh dunia"
    id: "Membandingkan masyarakat Muslim di berbagai negara"
    hi: "दुनिया भर के मुस्लिम समाजों की तुलना करना"
