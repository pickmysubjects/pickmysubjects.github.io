code: BOTA20002
year: 2026
learn:
  en: "The variety of land plants and fungi, from mosses and ferns to flowering plants, and how to identify them."
  zh: "陆地植物和真菌的多样性：从苔藓、蕨类到开花植物及其识别。"
  zh-TW: "陸地植物與真菌的多樣性：從苔蘚、蕨類到開花植物及其辨識。"
  ja: "陸上植物と菌類の多様性：コケ・シダから被子植物まで、その同定法。"
  ko: "육상 식물과 균류의 다양성: 이끼·고사리부터 꽃식물까지와 동정법."
  vi: "Sự đa dạng của thực vật trên cạn và nấm, từ rêu, dương xỉ đến cây có hoa, và cách nhận biết."
  ms: "Kepelbagaian tumbuhan darat dan kulat, dari lumut, paku pakis hingga tumbuhan berbunga, dan cara mengenalinya."
  id: "Keragaman tumbuhan darat dan jamur, dari lumut, paku hingga tumbuhan berbunga, dan cara mengenalinya."
  hi: "ज़मीनी पौधों और कवकों की विविधता, मॉस-फ़र्न से फूलदार पौधों तक, और उनकी पहचान।"
outcomes:
  - en: "Classify the main groups of plants and fungi"
    zh: "对植物和真菌主要类群进行分类"
    zh-TW: "對植物與真菌主要類群分類"
    ja: "植物と菌類の主要群を分類する"
    ko: "식물·균류 주요 분류군 분류하기"
    vi: "Phân loại các nhóm thực vật và nấm chính"
    ms: "Kelaskan kumpulan utama tumbuhan dan kulat"
    id: "Mengklasifikasi kelompok utama tumbuhan dan jamur"
    hi: "पौधों और कवकों के मुख्य समूह वर्गीकृत करें"
  - en: "Identify plants, especially Australian flora"
    zh: "识别植物，尤其是澳大利亚植物"
    zh-TW: "辨識植物，尤其是澳洲植物"
    ja: "植物、特に豪州植物を同定する"
    ko: "식물, 특히 호주 식물 동정하기"
    vi: "Nhận diện cây, nhất là thực vật Úc"
    ms: "Kenal pasti tumbuhan, terutama flora Australia"
    id: "Mengidentifikasi tumbuhan, terutama flora Australia"
    hi: "पौधों, ख़ासकर ऑस्ट्रेलियाई वनस्पति, की पहचान करें"
