code: ACTL30010
year: 2027
learn:
  en: "More advanced analytics for actuaries, like GLMs, LASSO, random forests and neural nets, tied to real business decisions."
  zh: "面向精算的进阶数据分析：GLM、LASSO、随机森林和神经网络等，并联系实际业务决策。"
  zh-TW: "面向精算的進階資料分析：GLM、LASSO、隨機森林和神經網路等，並連結實際業務決策。"
  ja: "アクチュアリー向けの発展的データ分析：GLM、LASSO、ランダムフォレスト、ニューラルネットなどを実務の意思決定と結びつける。"
  ko: "보험계리를 위한 심화 데이터 분석: GLM, LASSO, 랜덤 포레스트, 신경망 등을 실제 비즈니스 결정과 연결."
  vi: "Phân tích dữ liệu nâng cao cho ngành định phí bảo hiểm như GLM, LASSO, rừng ngẫu nhiên, mạng nơ-ron, gắn với quyết định kinh doanh thực tế."
  ms: "Analitik lanjutan untuk aktuari seperti GLM, LASSO, hutan rawak dan rangkaian neural, dikaitkan dengan keputusan perniagaan sebenar."
  id: "Analitik lanjutan untuk aktuaria seperti GLM, LASSO, random forest, dan jaringan saraf, dikaitkan dengan keputusan bisnis nyata."
  hi: "एक्चुअरी के लिए उन्नत एनालिटिक्स जैसे GLM, LASSO, रैंडम फ़ॉरेस्ट और न्यूरल नेट, असली कारोबारी फ़ैसलों से जुड़े।"
outcomes:
  - en: "Prepare data and pick a suitable predictive method"
    zh: "准备数据并选择合适的预测方法"
    zh-TW: "準備資料並選擇合適的預測方法"
    ja: "データを準備し、適切な予測手法を選ぶ"
    ko: "데이터를 준비하고 알맞은 예측 기법 고르기"
    vi: "Chuẩn bị dữ liệu và chọn phương pháp dự đoán phù hợp"
    ms: "Sediakan data dan pilih kaedah ramalan yang sesuai"
    id: "Menyiapkan data dan memilih metode prediksi yang cocok"
    hi: "डेटा तैयार करना और सही प्रेडिक्टिव तरीका चुनना"
  - en: "Compare models using standard performance measures"
    zh: "用常见指标比较模型表现"
    zh-TW: "用常見指標比較模型表現"
    ja: "標準的な指標でモデルを比較する"
    ko: "표준 성능 지표로 모델 비교하기"
    vi: "So sánh mô hình bằng các chỉ số hiệu suất chuẩn"
    ms: "Bandingkan model dengan ukuran prestasi standard"
    id: "Membandingkan model dengan ukuran kinerja standar"
    hi: "मानक मापदंडों से मॉडलों की तुलना करना"
  - en: "Present findings clearly to a given audience"
    zh: "向特定受众清楚地呈现分析结果"
    zh-TW: "向特定受眾清楚地呈現分析結果"
    ja: "対象に合わせて分析結果を分かりやすく伝える"
    ko: "대상에 맞게 분석 결과를 명확히 전달하기"
    vi: "Trình bày kết quả rõ ràng cho đối tượng cụ thể"
    ms: "Bentangkan dapatan dengan jelas kepada audiens tertentu"
    id: "Menyajikan temuan dengan jelas untuk audiens tertentu"
    hi: "किसी तय दर्शक के लिए निष्कर्ष साफ़-साफ़ पेश करना"
