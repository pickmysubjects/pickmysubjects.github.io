code: ABPL90321
year: 2027
learn:
  en: "How to write design briefs for buildings like schools and hospitals by consulting users and using evidence-based design."
  zh: "如何通过咨询使用者和循证设计，为学校、医院等建筑编写设计任务书。"
  zh-TW: "如何透過諮詢使用者和實證設計，為學校、醫院等建築撰寫設計任務書。"
  ja: "利用者への聞き取りとエビデンスに基づく設計で、学校や病院の設計要件書をまとめる。"
  ko: "사용자 협의와 근거 기반 설계로 학교·병원 등의 설계 지침서를 작성합니다."
  vi: "Cách viết đề bài thiết kế cho trường học, bệnh viện bằng tham vấn người dùng và thiết kế dựa trên bằng chứng."
  ms: "Cara menulis taklimat reka bentuk untuk sekolah dan hospital melalui rundingan pengguna dan reka bentuk berasaskan bukti."
  id: "Cara menyusun brief desain untuk sekolah dan rumah sakit lewat konsultasi pengguna dan desain berbasis bukti."
  hi: "उपयोगकर्ताओं से परामर्श और साक्ष्य-आधारित डिज़ाइन से स्कूल-अस्पताल जैसी इमारतों का डिज़ाइन ब्रीफ़ बनाना।"
outcomes:
  - en: "Consult building users and stakeholders"
    zh: "咨询建筑使用者和相关方"
    zh-TW: "諮詢建築使用者和相關方"
    ja: "建物の利用者や関係者に聞き取りする"
    ko: "건물 사용자와 이해관계자 협의하기"
    vi: "Tham vấn người dùng và các bên liên quan"
    ms: "Berunding dengan pengguna dan pihak berkepentingan"
    id: "Berkonsultasi dengan pengguna dan pemangku kepentingan"
    hi: "भवन उपयोगकर्ताओं और हितधारकों से परामर्श"
  - en: "Write a strategic design brief"
    zh: "撰写战略性设计任务书"
    zh-TW: "撰寫策略性設計任務書"
    ja: "戦略的な設計要件書を書く"
    ko: "전략적 설계 지침서 작성하기"
    vi: "Viết đề bài thiết kế chiến lược"
    ms: "Menulis taklimat reka bentuk strategik"
    id: "Menulis brief desain strategis"
    hi: "रणनीतिक डिज़ाइन ब्रीफ़ लिखना"
