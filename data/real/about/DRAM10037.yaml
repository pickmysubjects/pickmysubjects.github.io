code: DRAM10037
year: 2026
learn:
  en: "More ensemble devising and physical work on space, rhythm and impulse, ending in short devised shows."
  zh: "更多集体编创与形体训练，探索空间、节奏与冲动，做出短剧。"
  zh-TW: "更多集體編創與形體訓練，探索空間、節奏與衝動，做出短劇。"
  ja: "集団創作と身体訓練を深め、空間・リズム・衝動を探って短編を作る。"
  ko: "앙상블 창작과 신체 훈련으로 공간·리듬·충동을 탐구해 짧은 공연을 만든다."
  vi: "Thêm dựng tác phẩm tập thể và luyện hình thể về không gian, nhịp, xung lực."
  ms: "Lebih banyak cipta ensembel dan latihan fizikal tentang ruang, rentak dan impuls."
  id: "Lebih banyak kreasi ensambel dan latihan fisik soal ruang, ritme dan impuls."
  hi: "सामूहिक रचना और शरीर पर अभ्यास: स्थान, लय और आवेग, फिर छोटे शो।"
outcomes:
  - en: "Build and play a character"
    zh: "塑造并演出一个角色"
    zh-TW: "塑造並演出一個角色"
    ja: "人物を作り演じる"
    ko: "인물을 만들고 연기하기"
    vi: "Xây dựng và diễn một nhân vật"
    ms: "Bina dan lakonkan watak"
    id: "Membangun dan memerankan tokoh"
    hi: "किरदार गढ़ना और निभाना"
  - en: "Make two short devised performances"
    zh: "完成两部短篇编创演出"
    zh-TW: "完成兩部短篇編創演出"
    ja: "短い創作公演を2本作る"
    ko: "짧은 창작 공연 두 편 만들기"
    vi: "Làm hai tiết mục tự dựng ngắn"
    ms: "Hasilkan dua persembahan ciptaan pendek"
    id: "Membuat dua pertunjukan kreasi pendek"
    hi: "दो छोटे स्वरचित प्रदर्शन बनाना"
  - en: "Offer and build on ideas in a team"
    zh: "在团队中提出并发展想法"
    zh-TW: "在團隊中提出並發展想法"
    ja: "チームでアイデアを出し合い発展させる"
    ko: "팀에서 아이디어 내고 발전시키기"
    vi: "Đưa và phát triển ý tưởng trong nhóm"
    ms: "Beri dan kembangkan idea dalam pasukan"
    id: "Memberi dan mengembangkan ide dalam tim"
    hi: "टीम में विचार देना और आगे बढ़ाना"
