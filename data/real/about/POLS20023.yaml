code: POLS20023
year: 2026
learn:
  en: "How politics works inside different countries, and how to use the comparative method to study elections, parties and institutions."
  zh: "不同国家内部的政治如何运作，以及如何用比较方法研究选举、政党和政治制度。"
  zh-TW: "不同國家內部的政治如何運作，以及如何用比較方法研究選舉、政黨和政治制度。"
  ja: "国ごとに内政がどう動くのか、そして比較の手法で選挙、政党、制度をどう研究するかを学ぶ。"
  ko: "나라마다 국내 정치가 어떻게 돌아가는지, 비교 방법으로 선거, 정당, 제도를 연구하는 법을 배운다."
  vi: "Chính trị bên trong các nước vận hành ra sao, và cách dùng phương pháp so sánh để nghiên cứu bầu cử, đảng phái, thể chế."
  ms: "Cara politik berfungsi dalam negara berbeza, dan cara guna kaedah perbandingan untuk mengkaji pilihan raya, parti dan institusi."
  id: "Cara kerja politik di dalam berbagai negara, dan cara memakai metode perbandingan untuk meneliti pemilu, partai, dan lembaga."
  hi: "अलग-अलग देशों के भीतर राजनीति कैसे चलती है, और चुनाव, पार्टियों व संस्थाओं को समझने के लिए तुलनात्मक तरीका कैसे इस्तेमाल करें।"
outcomes:
  - en: "Use the comparative method to study politics"
    zh: "用比较方法研究政治"
    zh-TW: "用比較方法研究政治"
    ja: "比較の手法で政治を研究する"
    ko: "비교 방법으로 정치 연구하기"
    vi: "Dùng phương pháp so sánh để nghiên cứu chính trị"
    ms: "Guna kaedah perbandingan untuk mengkaji politik"
    id: "Memakai metode perbandingan untuk meneliti politik"
    hi: "राजनीति समझने के लिए तुलनात्मक तरीका अपनाना"
  - en: "Compare political systems across countries"
    zh: "比较不同国家的政治体制"
    zh-TW: "比較不同國家的政治體制"
    ja: "国ごとの政治制度を比較する"
    ko: "나라별 정치 체제 비교하기"
    vi: "So sánh hệ thống chính trị giữa các nước"
    ms: "Bandingkan sistem politik antara negara"
    id: "Membandingkan sistem politik antarnegara"
    hi: "अलग देशों की राजनीतिक व्यवस्थाओं की तुलना करना"
  - en: "Build an argument from well-chosen cases"
    zh: "用恰当的案例构建论证"
    zh-TW: "用恰當的案例建構論證"
    ja: "適切な事例から議論を組み立てる"
    ko: "적절한 사례로 논증 세우기"
    vi: "Xây dựng lập luận từ các trường hợp được chọn kỹ"
    ms: "Bina hujah daripada kes yang dipilih dengan baik"
    id: "Menyusun argumen dari kasus yang dipilih dengan cermat"
    hi: "सोच-समझकर चुने गए मामलों से तर्क खड़ा करना"
