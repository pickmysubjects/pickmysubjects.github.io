code: AHIS30020
year: 2026
learn:
  en: "International contemporary art across painting, installation, performance, photo and video, and the theories behind it."
  zh: "国际当代艺术，涵盖绘画、装置、行为、摄影和影像，以及背后的理论。"
  zh-TW: "國際當代藝術，涵蓋繪畫、裝置、行為、攝影和影像，以及背後的理論。"
  ja: "絵画・インスタレーション・パフォーマンス・写真・映像にわたる国際的な現代美術と、その理論を学ぶ。"
  ko: "회화·설치·퍼포먼스·사진·영상에 걸친 국제 현대 미술과 그 이론을 배운다."
  vi: "Nghệ thuật đương đại quốc tế qua hội họa, sắp đặt, trình diễn, nhiếp ảnh, video và các lý thuyết đằng sau."
  ms: "Seni kontemporari antarabangsa merangkumi lukisan, instalasi, persembahan, foto dan video, serta teori di sebaliknya."
  id: "Seni kontemporer internasional mencakup lukisan, instalasi, pertunjukan, foto dan video, serta teori di baliknya."
  hi: "अंतरराष्ट्रीय समकालीन कला, पेंटिंग, इंस्टॉलेशन, परफ़ॉर्मेंस, फ़ोटो और वीडियो में, और उसके पीछे के सिद्धांत।"
outcomes:
  - en: "Describe key trends in contemporary art"
    zh: "描述当代艺术的主要趋势"
    zh-TW: "描述當代藝術的主要趨勢"
    ja: "現代美術の主な傾向を説明する"
    ko: "현대 미술의 주요 흐름 설명하기"
    vi: "Mô tả các xu hướng chính của nghệ thuật đương đại"
    ms: "Huraikan trend utama seni kontemporari"
    id: "Menguraikan tren utama seni kontemporer"
    hi: "समकालीन कला के मुख्य रुझानों का वर्णन करना"
  - en: "Apply critical theory to recent artworks"
    zh: "把批评理论用于近期艺术作品"
    zh-TW: "把批評理論用於近期藝術作品"
    ja: "批評理論を最近の作品に当てはめる"
    ko: "비평 이론을 최근 작품에 적용하기"
    vi: "Áp dụng lý thuyết phê bình vào tác phẩm gần đây"
    ms: "Gunakan teori kritikan pada karya seni terkini"
    id: "Menerapkan teori kritis pada karya seni terbaru"
    hi: "हाल की कलाकृतियों पर आलोचनात्मक सिद्धांत लागू करना"
  - en: "Discuss identity and global culture in art"
    zh: "讨论艺术中的身份与全球文化"
    zh-TW: "討論藝術中的身分與全球文化"
    ja: "美術におけるアイデンティティとグローバル文化を論じる"
    ko: "미술 속 정체성과 세계 문화 논의하기"
    vi: "Thảo luận bản sắc và văn hóa toàn cầu trong nghệ thuật"
    ms: "Bincangkan identiti dan budaya global dalam seni"
    id: "Membahas identitas dan budaya global dalam seni"
    hi: "कला में पहचान और वैश्विक संस्कृति पर चर्चा करना"
