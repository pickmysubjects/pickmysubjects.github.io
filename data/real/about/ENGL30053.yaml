code: ENGL30053
year: 2026
learn:
  en: "Plays by Shakespeare and his rivals across many genres, read as art and as products of a competitive London theatre trade."
  zh: "莎士比亚及同时代剧作家的多种剧作，既作为艺术，也作为伦敦剧场竞争市场的产物来读。"
  zh-TW: "莎士比亞及同時代劇作家的多種劇作，既作為藝術，也作為倫敦劇場競爭市場的產物來讀。"
  ja: "シェイクスピアと同時代の劇作家の様々な劇を、芸術として、またロンドン劇場の競争市場の産物として読む。"
  ko: "셰익스피어와 동시대 극작가의 여러 장르 희곡을 예술이자 런던 극장 시장의 산물로 읽는다."
  vi: "Các vở kịch của Shakespeare và đối thủ ở nhiều thể loại, đọc như nghệ thuật và như sản phẩm của thị trường sân khấu London."
  ms: "Drama Shakespeare dan pesaingnya dalam pelbagai genre, dibaca sebagai seni dan hasil pasaran teater London yang bersaing."
  id: "Lakon Shakespeare dan para pesaingnya di berbagai genre, dibaca sebagai seni dan produk pasar teater London yang kompetitif."
  hi: "शेक्सपियर और उनके प्रतिद्वंद्वियों के कई विधाओं के नाटक, कला के रूप में और लंदन के प्रतिस्पर्धी रंगमंच बाज़ार की उपज के रूप में।"
outcomes:
  - en: "Describe the main genres of Renaissance drama"
    zh: "描述文艺复兴戏剧的主要类型"
    zh-TW: "描述文藝復興戲劇的主要類型"
    ja: "ルネサンス演劇の主なジャンルを説明する"
    ko: "르네상스 연극의 주요 장르 설명하기"
    vi: "Mô tả các thể loại chính của kịch Phục hưng"
    ms: "Huraikan genre utama drama Renaissance"
    id: "Menguraikan genre utama drama Renaisans"
    hi: "पुनर्जागरण नाटक की मुख्य विधाओं का वर्णन करना"
  - en: "Place plays in the early modern theatre market"
    zh: "把剧作放在近代早期剧场市场中理解"
    zh-TW: "把劇作放在近代早期劇場市場中理解"
    ja: "戯曲を近世の劇場市場の中に位置づける"
    ko: "희곡을 근대 초기 극장 시장 속에서 이해하기"
    vi: "Đặt vở kịch vào thị trường sân khấu đầu thời cận đại"
    ms: "Letakkan drama dalam pasaran teater awal moden"
    id: "Menempatkan lakon dalam pasar teater awal modern"
    hi: "नाटकों को आरंभिक आधुनिक रंगमंच बाज़ार में रखना"
  - en: "Analyse themes like religion, politics and home"
    zh: "分析宗教、政治和家庭等主题"
    zh-TW: "分析宗教、政治和家庭等主題"
    ja: "宗教・政治・家庭などのテーマを分析する"
    ko: "종교·정치·가정 같은 주제 분석하기"
    vi: "Phân tích các chủ đề như tôn giáo, chính trị và gia đình"
    ms: "Analisis tema seperti agama, politik dan rumah tangga"
    id: "Menganalisis tema seperti agama, politik dan rumah tangga"
    hi: "धर्म, राजनीति और घर जैसे विषयों का विश्लेषण करना"
