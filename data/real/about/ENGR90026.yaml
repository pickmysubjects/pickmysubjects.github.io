code: ENGR90026
year: 2027
learn:
  en: "Turning engineering ideas into ventures: customer discovery, IP, business models, funding and pitching."
  zh: "把工程想法变成创业项目：用户调研、知识产权、商业模式、融资与路演。"
  zh-TW: "把工程點子變成創業專案：使用者探索、智慧財產、商業模式、募資與簡報。"
  ja: "技術アイデアを事業にする：顧客探索、知的財産、ビジネスモデル、資金調達、ピッチ。"
  ko: "공학 아이디어를 사업으로: 고객 탐색, 지식재산, 비즈니스 모델, 투자 유치, 피칭."
  vi: "Biến ý tưởng kỹ thuật thành khởi nghiệp: khám phá khách hàng, sở hữu trí tuệ, mô hình kinh doanh, gọi vốn, thuyết trình."
  ms: "Menjadikan idea kejuruteraan usaha niaga: penemuan pelanggan, harta intelek, model perniagaan, dana dan pitching."
  id: "Mengubah ide teknik menjadi usaha: riset pelanggan, kekayaan intelektual, model bisnis, pendanaan, pitching."
  hi: "इंजीनियरिंग विचारों को उद्यम बनाना: ग्राहक खोज, बौद्धिक संपदा, बिज़नेस मॉडल, फंडिंग, पिचिंग।"
outcomes:
  - en: "Test whether an idea meets a real customer need"
    zh: "检验一个想法是否满足真实用户需求"
    zh-TW: "檢驗一個點子是否符合真實使用者需求"
    ja: "アイデアが本当の顧客ニーズに合うか確かめる"
    ko: "아이디어가 실제 고객 요구에 맞는지 검증하기"
    vi: "Kiểm chứng ý tưởng có đáp ứng nhu cầu thật của khách hàng"
    ms: "Menguji sama ada idea memenuhi keperluan sebenar pelanggan"
    id: "Menguji apakah ide memenuhi kebutuhan nyata pelanggan"
    hi: "जाँचना कि कोई विचार असली ग्राहक ज़रूरत पूरी करता है या नहीं"
  - en: "Build a business model and pitch it"
    zh: "设计商业模式并进行路演"
    zh-TW: "設計商業模式並進行簡報"
    ja: "ビジネスモデルを作りピッチする"
    ko: "비즈니스 모델을 만들고 피칭하기"
    vi: "Xây dựng mô hình kinh doanh và thuyết trình gọi vốn"
    ms: "Membina model perniagaan dan membuat pitching"
    id: "Menyusun model bisnis dan mempresentasikannya"
    hi: "बिज़नेस मॉडल बनाना और उसे पिच करना"
