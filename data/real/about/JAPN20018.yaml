code: JAPN20018
year: 2026
learn:
  en: "Japanese news and TV on issues like ageing, gender equality and disasters, compared with Australian coverage."
  zh: "通过日本新闻和电视了解老龄化、性别平等和灾害等议题，并与澳洲报道比较。"
  zh-TW: "透過日本新聞和電視了解高齡化、性別平等和災害等議題，並與澳洲報導比較。"
  ja: "高齢化、男女平等、災害などを日本のニュースやテレビで扱い、オーストラリアの報道と比べる。"
  ko: "고령화, 성평등, 재난 등을 일본 뉴스와 TV로 살펴보고 호주 보도와 비교한다."
  vi: "Tin tức và truyền hình Nhật về già hóa, bình đẳng giới, thiên tai…, so sánh với cách đưa tin ở Úc."
  ms: "Berita dan TV Jepun tentang isu seperti penuaan, kesaksamaan gender dan bencana, dibandingkan dengan liputan Australia."
  id: "Berita dan TV Jepang tentang isu seperti penuaan, kesetaraan gender dan bencana, dibandingkan dengan liputan Australia."
  hi: "बढ़ती उम्र, लैंगिक समानता और आपदाओं जैसे मुद्दों पर जापानी ख़बरें व टीवी, ऑस्ट्रेलियाई कवरेज से तुलना के साथ।"
outcomes:
  - en: "Understand Japanese news on social issues"
    zh: "看懂有关社会议题的日语新闻"
    zh-TW: "看懂有關社會議題的日語新聞"
    ja: "社会問題を扱う日本語ニュースを理解する"
    ko: "사회 문제를 다룬 일본어 뉴스 이해하기"
    vi: "Hiểu tin tức tiếng Nhật về vấn đề xã hội"
    ms: "Fahami berita Jepun tentang isu sosial"
    id: "Memahami berita Jepang tentang isu sosial"
    hi: "सामाजिक मुद्दों पर जापानी ख़बरें समझना"
  - en: "Compare media coverage in Japan and Australia"
    zh: "比较日本和澳洲的媒体报道"
    zh-TW: "比較日本和澳洲的媒體報導"
    ja: "日本とオーストラリアの報道を比べる"
    ko: "일본과 호주의 언론 보도 비교하기"
    vi: "So sánh cách đưa tin ở Nhật và Úc"
    ms: "Banding liputan media di Jepun dan Australia"
    id: "Membandingkan liputan media di Jepang dan Australia"
    hi: "जापान और ऑस्ट्रेलिया के मीडिया कवरेज की तुलना करना"
  - en: "Use media idioms and expressions in Japanese"
    zh: "运用日语媒体中的惯用表达"
    zh-TW: "運用日語媒體中的慣用表達"
    ja: "メディア特有の日本語表現を使う"
    ko: "일본어 미디어 관용 표현 쓰기"
    vi: "Dùng thành ngữ, cách nói của báo chí Nhật"
    ms: "Guna ungkapan media dalam bahasa Jepun"
    id: "Memakai ungkapan media dalam bahasa Jepang"
    hi: "जापानी मीडिया के मुहावरे और अभिव्यक्तियाँ इस्तेमाल करना"
