code: ELEN90075
year: 2027
learn:
  en: "How power electronic parts like rectifiers, converters and inverters work, and how to model them."
  zh: "整流器、变换器和逆变器等电力电子元件如何工作，以及如何建模。"
  zh-TW: "整流器、轉換器與逆變器等電力電子元件如何運作，以及如何建模。"
  ja: "整流器・コンバータ・インバータなどパワーエレクトロニクス部品の仕組みとモデル化。"
  ko: "정류기, 컨버터, 인버터 같은 전력전자 부품의 동작과 모델링."
  vi: "Cách các linh kiện điện tử công suất như bộ chỉnh lưu, bộ biến đổi và nghịch lưu hoạt động và cách mô hình hóa."
  ms: "Cara komponen elektronik kuasa seperti penerus, penukar dan penyongsang berfungsi serta cara memodelkannya."
  id: "Cara kerja komponen elektronika daya seperti penyearah, konverter, dan inverter, serta cara memodelkannya."
  hi: "रेक्टिफ़ायर, कन्वर्टर और इन्वर्टर जैसे पावर इलेक्ट्रॉनिक पुर्ज़े कैसे काम करते हैं और उनका मॉडल कैसे बनाएँ।"
outcomes:
  - en: "Model power semiconductor devices and circuits"
    zh: "为功率半导体器件和电路建模"
    zh-TW: "為功率半導體元件與電路建模"
    ja: "パワー半導体素子と回路をモデル化する"
    ko: "전력 반도체 소자와 회로 모델링하기"
    vi: "Mô hình hóa linh kiện bán dẫn công suất và mạch"
    ms: "Memodelkan peranti semikonduktor kuasa dan litar"
    id: "Memodelkan perangkat semikonduktor daya dan rangkaian"
    hi: "पावर सेमीकंडक्टर डिवाइस और सर्किट का मॉडल बनाना"
  - en: "Simulate converters and compare with theory"
    zh: "仿真变换器并与理论对比"
    zh-TW: "模擬轉換器並與理論比較"
    ja: "コンバータをシミュレーションし理論と比べる"
    ko: "컨버터를 시뮬레이션하고 이론과 비교하기"
    vi: "Mô phỏng bộ biến đổi và so sánh với lý thuyết"
    ms: "Mensimulasi penukar dan membandingkan dengan teori"
    id: "Menyimulasikan konverter dan membandingkan dengan teori"
    hi: "कन्वर्टर का सिमुलेशन और सिद्धांत से तुलना"
