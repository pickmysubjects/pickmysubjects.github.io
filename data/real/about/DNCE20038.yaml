code: DNCE20038
year: 2026
learn:
  en: "An overseas dance studio: workshops with artists abroad, a group showing, and a journal on what you learned."
  zh: "海外舞蹈工作室：与国外艺术家一起工作坊，做小组展演，并写学习日志。"
  zh-TW: "海外舞蹈工作室：與國外藝術家一起工作坊，做小組展演，並寫學習日誌。"
  ja: "海外でのダンススタジオ。現地アーティストとのワークショップ、グループ発表、記録日誌。"
  ko: "해외 무용 스튜디오. 현지 예술가와 워크숍, 그룹 발표, 학습 일지."
  vi: "Studio múa ở nước ngoài: học với nghệ sĩ, trình diễn nhóm và viết nhật ký."
  ms: "Studio tari di luar negara: bengkel bersama artis, persembahan kumpulan dan jurnal."
  id: "Studio tari di luar negeri: lokakarya dengan seniman, pentas kelompok, dan jurnal."
  hi: "विदेश में डांस स्टूडियो: कलाकारों के साथ वर्कशॉप, समूह प्रस्तुति और जर्नल।"
outcomes:
  - en: "Work with dance artists in another culture"
    zh: "与其他文化的舞蹈艺术家合作"
    zh-TW: "與其他文化的舞蹈藝術家合作"
    ja: "異文化のダンサーと共に創作する"
    ko: "다른 문화의 무용가와 작업하기"
    vi: "Làm việc với nghệ sĩ múa nước khác"
    ms: "Bekerja dengan artis tari budaya lain"
    id: "Bekerja dengan penari dari budaya lain"
    hi: "दूसरी संस्कृति के नर्तकों के साथ काम करना"
  - en: "Make and show work as a group"
    zh: "以小组形式创作并展演"
    zh-TW: "以小組形式創作並展演"
    ja: "グループで作品を作り発表する"
    ko: "그룹으로 작품 만들고 발표하기"
    vi: "Sáng tác và trình diễn theo nhóm"
    ms: "Cipta dan persembah karya berkumpulan"
    id: "Berkarya dan tampil dalam kelompok"
    hi: "समूह में रचना बनाकर दिखाना"
  - en: "Document and reflect on your practice"
    zh: "记录并反思自己的创作"
    zh-TW: "記錄並反思自己的創作"
    ja: "自分の実践を記録し振り返る"
    ko: "자신의 작업을 기록·성찰하기"
    vi: "Ghi lại và suy ngẫm về thực hành"
    ms: "Dokumen dan renung amalan sendiri"
    id: "Mendokumentasikan dan merefleksikan praktik"
    hi: "अपने अभ्यास का दस्तावेज़ और चिंतन"
