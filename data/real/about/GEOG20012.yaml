code: GEOG20012
year: 2026
learn:
  en: "Critical development geography of post-conflict East Timor and Cambodia: nation-building, aid, memory, justice."
  zh: "东帝汶与柬埔寨冲突后发展的批判性地理：国家建设、援助、记忆与正义。"
  zh-TW: "東帝汶與柬埔寨衝突後發展的批判性地理：國家建設、援助、記憶與正義。"
  ja: "紛争後の東ティモールとカンボジアの批判的開発地理学：国家建設、援助、記憶、正義。"
  ko: "분쟁 후 동티모르와 캄보디아의 비판적 개발지리학: 국가 건설, 원조, 기억, 정의."
  vi: "Địa lý phát triển phê phán ở Đông Timor và Campuchia hậu xung đột: xây dựng quốc gia, viện trợ, công lý."
  ms: "Geografi pembangunan kritis Timor Timur dan Kemboja pasca konflik: pembinaan negara, bantuan, keadilan."
  id: "Geografi pembangunan kritis Timor Leste dan Kamboja pascakonflik: pembangunan bangsa, bantuan, keadilan."
  hi: "संघर्ष के बाद पूर्वी तिमोर और कंबोडिया का आलोचनात्मक विकास भूगोल: राष्ट्र-निर्माण, सहायता, स्मृति, न्याय।"
outcomes:
  - en: "Use key concepts of development geography"
    zh: "运用发展地理学的核心概念"
    zh-TW: "運用發展地理學的核心概念"
    ja: "開発地理学の主要概念を使う"
    ko: "개발지리학의 핵심 개념을 활용한다"
    vi: "Vận dụng khái niệm chính của địa lý phát triển"
    ms: "Gunakan konsep utama geografi pembangunan"
    id: "Menggunakan konsep utama geografi pembangunan"
    hi: "विकास भूगोल की मुख्य अवधारणाओं का उपयोग करें"
  - en: "Research post-conflict development problems"
    zh: "研究冲突后发展问题"
    zh-TW: "研究衝突後發展問題"
    ja: "紛争後の開発課題を調査する"
    ko: "분쟁 후 개발 문제를 연구한다"
    vi: "Nghiên cứu vấn đề phát triển hậu xung đột"
    ms: "Kaji masalah pembangunan pasca konflik"
    id: "Meneliti masalah pembangunan pascakonflik"
    hi: "संघर्ष-पश्चात विकास समस्याओं पर शोध करें"
