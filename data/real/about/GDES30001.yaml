    ja: "複雑な情報を明快な図にする"
    ko: "복잡한 정보를 명확한 그래픽으로 만들기"
    vi: "Biến thông tin phức tạp thành đồ họa rõ ràng"
    ms: "Ubah maklumat kompleks jadi grafik jelas"
    id: "Mengubah informasi rumit jadi grafis jelas"
    hi: "जटिल जानकारी को स्पष्ट ग्राफ़िक में बदलना"
  - en: "Design print and animated infographics"
    zh: "设计印刷和动态信息图"
    zh-TW: "設計印刷與動態資訊圖表"
    ja: "印刷用とアニメーションの図解を作る"
    ko: "인쇄용·애니메이션 인포그래픽 디자인하기"
    vi: "Thiết kế infographic in và chuyển động"
    ms: "Reka infografik cetak dan animasi"
