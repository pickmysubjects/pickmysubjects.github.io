code: GDES30001
year: 2026
learn:
  en: "Turning complex data into clear, inventive graphics: print and animated infographics, signage and wayfinding."
  zh: "把复杂数据变成清晰有创意的图形：印刷和动态信息图、标识与导视系统。"
  zh-TW: "把複雜資料變成清楚有創意的圖像：印刷與動態資訊圖表、標示與導視系統。"
  ja: "複雑なデータを明快で独創的な図にする。印刷・アニメーションのインフォグラフィック、サイン計画。"
  ko: "복잡한 데이터를 명확하고 창의적인 그래픽으로: 인쇄·애니메이션 인포그래픽, 사인·길찾기."
  vi: "Biến dữ liệu phức tạp thành đồ họa rõ ràng, sáng tạo: infographic in và động, biển báo, chỉ dẫn."
  ms: "Menukar data kompleks kepada grafik jelas dan kreatif: infografik cetak dan animasi, papan tanda dan penunjuk arah."
  id: "Mengubah data rumit jadi grafis jelas dan kreatif: infografis cetak dan animasi, signage dan penunjuk arah."
  hi: "जटिल डेटा को साफ़, रचनात्मक ग्राफ़िक्स में बदलना: प्रिंट व एनिमेटेड इन्फ़ोग्राफ़िक, साइनेज।"
outcomes:
