code: ECON30001
year: 2026
learn:
  en: "Why countries trade, what they trade, and how tariffs and trade deals affect who wins and loses."
  zh: "国家为什么贸易、贸易什么，以及关税和贸易协定如何影响得失。"
  zh-TW: "國家為什麼貿易、貿易什麼，以及關稅和貿易協定如何影響得失。"
  ja: "国はなぜ何を貿易するのか、関税や貿易協定が誰の得と損になるのか。"
  ko: "나라들이 왜, 무엇을 교역하는지, 관세와 무역협정이 누구에게 득실인지."
  vi: "Vì sao các nước buôn bán, buôn bán gì, và thuế quan, hiệp định thương mại ảnh hưởng ai được ai mất."
  ms: "Mengapa negara berdagang, apa yang didagangkan, dan siapa untung rugi akibat tarif dan perjanjian dagang."
  id: "Mengapa negara berdagang, apa yang diperdagangkan, dan siapa untung-rugi akibat tarif dan perjanjian dagang."
  hi: "देश व्यापार क्यों और क्या करते हैं, और टैरिफ व व्यापार समझौतों से किसे फ़ायदा या नुकसान होता है।"
outcomes:
  - en: "Explain trade patterns with general equilibrium models"
    zh: "用一般均衡模型解释贸易模式"
    zh-TW: "用一般均衡模型解釋貿易型態"
    ja: "一般均衡モデルで貿易パターンを説明する"
    ko: "일반균형 모형으로 무역 패턴 설명"
    vi: "Giải thích mô hình thương mại bằng cân bằng tổng thể"
    ms: "Terangkan corak perdagangan dengan model keseimbangan umum"
    id: "Menjelaskan pola perdagangan dengan model keseimbangan umum"
    hi: "जनरल इक्विलिब्रियम मॉडल से व्यापार पैटर्न समझाना"
  - en: "Judge who gains and loses from a trade policy"
    zh: "判断贸易政策让谁得益、谁受损"
    zh-TW: "判斷貿易政策讓誰得利、誰受損"
    ja: "貿易政策で誰が得をし損をするか判断する"
    ko: "무역정책으로 누가 이득·손해인지 판단"
    vi: "Đánh giá ai được ai mất từ một chính sách thương mại"
    ms: "Nilai siapa untung dan rugi daripada dasar perdagangan"
    id: "Menilai siapa untung dan rugi dari kebijakan perdagangan"
    hi: "व्यापार नीति से किसे फ़ायदा-नुकसान, यह आँकना"
  - en: "Apply trade theory to current world trade issues"
    zh: "把贸易理论用于当前国际贸易议题"
    zh-TW: "把貿易理論用於當前國際貿易議題"
    ja: "貿易理論を今の世界の貿易問題に当てはめる"
    ko: "무역 이론을 현재 세계 무역 이슈에 적용"
    vi: "Áp dụng lý thuyết vào vấn đề thương mại thế giới hiện nay"
    ms: "Guna teori perdagangan pada isu dagangan dunia semasa"
    id: "Menerapkan teori perdagangan pada isu dagang dunia terkini"
    hi: "व्यापार सिद्धांत को आज के वैश्विक मुद्दों पर लगाना"
