code: MUSI20244
year: 2026
learn:
  en: "Reading figured bass and turning it into stylish 17th–18th century accompaniment, at your instrument or on paper."
  zh: "读懂数字低音，并在乐器上或纸上写成17至18世纪风格的伴奏。"
  zh-TW: "讀懂數字低音，並在樂器上或紙上寫成17至18世紀風格的伴奏。"
  ja: "数字付き低音を読み、楽器か紙上で17〜18世紀様式の伴奏にする。"
  ko: "숫자저음을 읽고 악기나 악보로 17~18세기 양식의 반주를 만든다."
  vi: "Đọc bè trầm số hóa và biến thành phần đệm phong cách thế kỷ 17–18."
  ms: "Baca bes berangka dan jadikan iringan gaya abad ke-17–18."
  id: "Membaca bas berangka dan mengubahnya jadi iringan gaya abad 17–18."
  hi: "फ़िगर्ड बास पढ़कर 17वीं–18वीं सदी शैली की संगत बनाना, वाद्य पर या लिखकर।"
outcomes:
  - en: "Realise figured bass with correct voice-leading"
    zh: "以正确声部进行实现数字低音"
    zh-TW: "以正確聲部進行實現數字低音"
    ja: "正しい声部進行で通奏低音を実施する"
    ko: "올바른 성부 진행으로 숫자저음 실현하기"
    vi: "Hiện thực bè trầm số với dẫn giọng đúng"
    ms: "Realisasikan bes berangka dengan pimpinan suara betul"
    id: "Merealisasikan bas berangka dengan voice-leading benar"
    hi: "सही स्वर-संचालन से फ़िगर्ड बास बजाना"
  - en: "Improvise simple harmony and melody in Baroque style"
    zh: "即兴演奏巴洛克风格的和声与旋律"
    zh-TW: "即興演奏巴洛克風格的和聲與旋律"
    ja: "バロック様式で和声と旋律を即興する"
    ko: "바로크 양식으로 화성과 선율 즉흥하기"
    vi: "Ứng tác hòa âm và giai điệu kiểu Baroque"
    ms: "Improvisasi harmoni dan melodi gaya Barok"
    id: "Improvisasi harmoni dan melodi gaya Barok"
    hi: "बारोक शैली में सरल हार्मनी और धुन रचना"
  - en: "Explain your choices in a written commentary"
    zh: "用书面评述说明自己的处理"
    zh-TW: "用書面評述說明自己的處理"
    ja: "自分の判断を文章で説明する"
    ko: "선택 이유를 글로 설명하기"
    vi: "Giải thích lựa chọn bằng bài bình luận"
    ms: "Terangkan pilihan dalam ulasan bertulis"
    id: "Menjelaskan pilihan lewat komentar tertulis"
    hi: "लिखित टिप्पणी में अपने निर्णय समझाना"
