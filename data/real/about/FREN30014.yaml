code: FREN30014
year: 2026
learn:
  en: "French travel writing, from explorers to comics and blogs, read in French and practised yourself."
  zh: "法语旅行文学，从探险记录到漫画和博客，用法语阅读并亲自练习写作。"
  zh-TW: "法語旅行文學，從探險紀錄到漫畫和部落格，用法語閱讀並親自練習寫作。"
  ja: "探検記から漫画やブログまで、フランス語の旅行記を読み、自分でも書いてみる。"
  ko: "탐험기부터 만화·블로그까지 프랑스어 여행 글을 읽고 직접 써 본다."
  vi: "Văn du ký tiếng Pháp, từ ghi chép thám hiểm đến truyện tranh và blog, đọc và tự viết bằng tiếng Pháp."
  ms: "Penulisan kembara Perancis, daripada catatan penjelajah hingga komik dan blog, dibaca dan dicuba sendiri."
  id: "Tulisan perjalanan Prancis, dari catatan penjelajah hingga komik dan blog, dibaca dan dicoba sendiri."
  hi: "फ़्रेंच यात्रा-लेखन, खोजकर्ताओं से कॉमिक्स और ब्लॉग तक, फ़्रेंच में पढ़ना और ख़ुद लिखना।"
outcomes:
  - en: "Read French travel texts of many kinds"
    zh: "阅读多种法语旅行文本"
    zh-TW: "閱讀多種法語旅行文本"
    ja: "さまざまなフランス語の旅行記を読む"
    ko: "다양한 프랑스어 여행 글 읽기"
    vi: "Đọc nhiều loại văn bản du ký tiếng Pháp"
    ms: "Baca pelbagai jenis teks kembara Perancis"
    id: "Membaca berbagai jenis teks perjalanan Prancis"
    hi: "कई तरह के फ़्रेंच यात्रा-पाठ पढ़ना"
  - en: "Discuss how travel texts portray other cultures"
    zh: "讨论旅行文本如何描绘其他文化"
    zh-TW: "討論旅行文本如何描繪其他文化"
    ja: "旅行記が異文化をどう描くかを論じる"
    ko: "여행 글이 다른 문화를 그리는 방식 논의하기"
    vi: "Thảo luận cách du ký khắc họa văn hóa khác"
    ms: "Bincangkan cara teks kembara menggambarkan budaya lain"
    id: "Membahas cara teks perjalanan menggambarkan budaya lain"
    hi: "यात्रा-पाठ दूसरी संस्कृतियों को कैसे दिखाते हैं, चर्चा करना"
  - en: "Write your own travel piece in French"
    zh: "用法语写自己的旅行文章"
    zh-TW: "用法語寫自己的旅行文章"
    ja: "フランス語で自分の旅行記を書く"
    ko: "프랑스어로 자신만의 여행 글 쓰기"
    vi: "Viết bài du ký của riêng mình bằng tiếng Pháp"
    ms: "Tulis karya kembara sendiri dalam bahasa Perancis"
    id: "Menulis tulisan perjalanan sendiri dalam bahasa Prancis"
    hi: "फ़्रेंच में अपना यात्रा-लेख लिखना"
