code: POLS30028
year: 2026
learn:
  en: "An off-campus intensive on Yorta Yorta Country, studying their long struggle for land, water, heritage and self-determination."
  zh: "在约塔约塔族的土地上进行的校外密集课程，了解他们为土地、水、文化遗产和自决权进行的长期斗争。"
  zh-TW: "在約塔約塔族的土地上進行的校外密集課程，了解他們為土地、水、文化遺產和自決權進行的長期抗爭。"
  ja: "ヨータヨータの土地で行う学外集中科目で、土地、水、文化遺産、自己決定を求める長い闘いを学ぶ。"
  ko: "요타요타 부족의 땅에서 진행하는 교외 집중 과목으로, 토지, 물, 유산, 자결권을 위한 오랜 투쟁을 배운다."
  vi: "Môn học tập trung ngoài trường trên vùng đất của người Yorta Yorta, tìm hiểu cuộc đấu tranh lâu dài vì đất, nước, di sản và quyền tự quyết."
  ms: "Kursus intensif luar kampus di tanah Yorta Yorta, mengkaji perjuangan panjang mereka untuk tanah, air, warisan dan penentuan nasib sendiri."
  id: "Mata kuliah intensif di luar kampus di tanah Yorta Yorta, mempelajari perjuangan panjang mereka atas tanah, air, warisan, dan penentuan nasib sendiri."
  hi: "योर्टा योर्टा लोगों की ज़मीन पर कैंपस से बाहर एक इंटेंसिव कोर्स, ज़मीन, पानी, विरासत और आत्मनिर्णय के लिए उनके लंबे संघर्ष को समझना।"
outcomes:
  - en: "Explain Indigenous ties to Country over time"
    zh: "解释原住民与土地之间长久的联系"
    zh-TW: "解釋原住民與土地之間長久的連結"
    ja: "先住民と土地との長いつながりを説明する"
    ko: "원주민과 땅의 오랜 관계 설명하기"
    vi: "Giải thích mối gắn bó lâu đời của người bản địa với đất"
    ms: "Terangkan hubungan lama Orang Asli dengan tanah"
    id: "Menjelaskan ikatan panjang masyarakat Pribumi dengan tanahnya"
    hi: "आदिवासियों के अपनी ज़मीन से लंबे रिश्ते को समझाना"
  - en: "Trace the effects of colonisation and government policy"
    zh: "梳理殖民和政府政策带来的影响"
    zh-TW: "梳理殖民和政府政策帶來的影響"
    ja: "植民地化と政府の政策が及ぼした影響をたどる"
    ko: "식민화와 정부 정책의 영향 짚어 보기"
    vi: "Lần theo tác động của thực dân hóa và chính sách nhà nước"
    ms: "Jejaki kesan penjajahan dan dasar kerajaan"
    id: "Menelusuri dampak kolonisasi dan kebijakan pemerintah"
    hi: "उपनिवेशवाद और सरकारी नीतियों के असर को समझना"
  - en: "Analyse a real fight for land and water rights"
    zh: "分析一场争取土地和水权的真实斗争"
    zh-TW: "分析一場爭取土地和水權的真實抗爭"
    ja: "土地と水の権利を求める実際の闘いを分析する"
    ko: "토지와 물 권리를 위한 실제 투쟁 분석하기"
    vi: "Phân tích một cuộc đấu tranh thực tế vì quyền đất và nước"
    ms: "Analisis perjuangan sebenar untuk hak tanah dan air"
    id: "Menganalisis perjuangan nyata atas hak tanah dan air"
    hi: "ज़मीन और पानी के अधिकार की एक असली लड़ाई का विश्लेषण करना"
