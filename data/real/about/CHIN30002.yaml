code: CHIN30002
year: 2026
learn:
  en: "Migration and settlement in Chinese cultural history, with Taiwan as the main case alongside Singapore and Southeast Asia."
  zh: "中国文化史中的移民与定居，以台湾为主要案例，兼及新加坡和东南亚。"
  zh-TW: "中國文化史中的移民與定居，以台灣為主要案例，兼及新加坡和東南亞。"
  ja: "中国文化史における移住と定住を、台湾を中心にシンガポールや東南アジアとあわせて学ぶ。"
  ko: "중국 문화사 속 이주와 정착을 대만을 중심으로 싱가포르, 동남아와 함께 배운다."
  vi: "Di cư và định cư trong lịch sử văn hóa Trung Hoa, lấy Đài Loan làm ca chính cùng Singapore và Đông Nam Á."
  ms: "Migrasi dan penempatan dalam sejarah budaya Cina, dengan Taiwan sebagai kes utama bersama Singapura dan Asia Tenggara."
  id: "Migrasi dan permukiman dalam sejarah budaya Tionghoa, dengan Taiwan sebagai kasus utama bersama Singapura dan Asia Tenggara."
  hi: "चीनी सांस्कृतिक इतिहास में प्रवास और बसावट, ताइवान को मुख्य उदाहरण मानकर, सिंगापुर और दक्षिण-पूर्व एशिया के साथ।"
outcomes:
  - en: "Explain migration's role in Chinese history"
    zh: "解释移民在中国历史中的作用"
    zh-TW: "解釋移民在中國歷史中的作用"
    ja: "中国史における移住の役割を説明する"
    ko: "중국사에서 이주의 역할 설명하기"
    vi: "Giải thích vai trò của di cư trong lịch sử Trung Hoa"
    ms: "Terangkan peranan migrasi dalam sejarah Cina"
    id: "Menjelaskan peran migrasi dalam sejarah Tionghoa"
    hi: "चीनी इतिहास में प्रवास की भूमिका समझाना"
  - en: "Analyse the history of Taiwanese society"
    zh: "分析台湾社会的历史"
    zh-TW: "分析台灣社會的歷史"
    ja: "台湾社会の歴史を分析する"
    ko: "대만 사회의 역사 분석하기"
    vi: "Phân tích lịch sử xã hội Đài Loan"
    ms: "Analisis sejarah masyarakat Taiwan"
    id: "Menganalisis sejarah masyarakat Taiwan"
    hi: "ताइवानी समाज के इतिहास का विश्लेषण करना"
  - en: "Compare Chinese settler cultures in Asia"
    zh: "比较亚洲各地的华人定居文化"
    zh-TW: "比較亞洲各地的華人定居文化"
    ja: "アジア各地の華人定住文化を比べる"
    ko: "아시아 각지의 화교 정착 문화 비교하기"
    vi: "So sánh văn hóa định cư của người Hoa ở châu Á"
    ms: "Bandingkan budaya peneroka Cina di Asia"
    id: "Membandingkan budaya pemukim Tionghoa di Asia"
    hi: "एशिया में चीनी बसावट संस्कृतियों की तुलना करना"
