code: BMEN90039
year: 2027
learn:
  en: "Engineering management and the rules for bringing medical devices and therapeutic goods to market."
  zh: "工程管理，以及医疗器械和治疗用品上市所需遵守的法规。"
  zh-TW: "工程管理，以及醫療器材與治療用品上市所需遵守的法規。"
  ja: "工学マネジメントと、医療機器・治療用製品を市場に出すための規制。"
  ko: "공학 관리와 의료기기·치료제품 출시에 필요한 규제."
  vi: "Quản lý kỹ thuật và các quy định đưa thiết bị y tế, sản phẩm điều trị ra thị trường."
  ms: "Pengurusan kejuruteraan dan peraturan membawa peranti perubatan serta barangan terapeutik ke pasaran."
  id: "Manajemen teknik dan aturan untuk memasarkan alat medis serta produk terapeutik."
  hi: "इंजीनियरिंग प्रबंधन और मेडिकल डिवाइस व चिकित्सीय उत्पाद बाज़ार में लाने के नियम।"
outcomes:
  - en: "Explain the steps and rules to take a device to market"
    zh: "说明医疗器械上市的流程和法规"
    zh-TW: "說明醫療器材上市的流程與法規"
    ja: "機器を市場に出す手順と規制を説明する"
    ko: "기기 출시 절차와 규제 설명하기"
    vi: "Giải thích quy trình và quy định đưa thiết bị ra thị trường"
    ms: "Menerangkan langkah dan peraturan membawa peranti ke pasaran"
    id: "Menjelaskan langkah dan aturan memasarkan alat"
    hi: "डिवाइस बाज़ार में लाने के चरण और नियम समझाना"
  - en: "Run a profitability analysis of an engineering project"
    zh: "对工程项目做盈利分析"
    zh-TW: "對工程專案做獲利分析"
    ja: "工学プロジェクトの収益性を分析する"
    ko: "공학 프로젝트의 수익성 분석하기"
    vi: "Phân tích khả năng sinh lời của dự án kỹ thuật"
    ms: "Membuat analisis keuntungan projek kejuruteraan"
    id: "Membuat analisis profitabilitas proyek teknik"
    hi: "इंजीनियरिंग परियोजना का लाभप्रदता विश्लेषण"
  - en: "Weigh an engineer's professional and ethical duties"
    zh: "评估工程师的职业和伦理责任"
    zh-TW: "評估工程師的專業與倫理責任"
    ja: "技術者の職業上・倫理上の責任を考える"
    ko: "엔지니어의 직업·윤리적 책임 평가하기"
    vi: "Đánh giá trách nhiệm nghề nghiệp và đạo đức của kỹ sư"
    ms: "Menilai tanggungjawab profesional dan etika jurutera"
    id: "Menilai tanggung jawab profesional dan etis insinyur"
    hi: "इंजीनियर के पेशेवर और नैतिक दायित्वों का आकलन"
