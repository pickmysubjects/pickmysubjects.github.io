code: INFO90008
year: 2027
learn:
  en: "A supervised research project on a Human-Computer Interaction problem, written up as a thesis and presented."
  zh: "在导师指导下完成人机交互研究项目，撰写论文并公开报告。"
  zh-TW: "在指導教授帶領下完成人機互動研究，撰寫論文並公開發表。"
  ja: "指導教員のもとHCIの研究を行い、論文と発表にまとめる。"
  ko: "지도교수와 함께 HCI 연구를 수행하고 논문과 발표로 정리."
  vi: "Dự án nghiên cứu có hướng dẫn về tương tác người–máy, viết luận văn và thuyết trình."
  ms: "Projek penyelidikan berpenyelia tentang interaksi manusia-komputer, ditulis sebagai tesis dan dibentangkan."
  id: "Proyek riset terbimbing tentang interaksi manusia-komputer, ditulis sebagai tesis dan dipresentasikan."
  hi: "मार्गदर्शन में HCI पर रिसर्च प्रोजेक्ट, थीसिस लिखना और प्रस्तुत करना।"
outcomes:
  - en: "Plan and run a research study, from literature review to analysis"
    zh: "规划并完成研究，从文献综述到数据分析"
    zh-TW: "規劃並完成研究，從文獻回顧到資料分析"
    ja: "文献調査から分析まで研究を計画・実施する"
    ko: "문헌 조사부터 분석까지 연구 계획·수행하기"
    vi: "Lập kế hoạch và thực hiện nghiên cứu, từ tổng quan tài liệu đến phân tích"
    ms: "Merancang dan menjalankan kajian, dari sorotan literatur hingga analisis"
    id: "Merencanakan dan menjalankan riset, dari tinjauan pustaka sampai analisis"
    hi: "साहित्य समीक्षा से विश्लेषण तक रिसर्च की योजना बनाना और करना"
  - en: "Report findings in a thesis and a talk"
    zh: "用论文和报告呈现研究结果"
    zh-TW: "以論文與口頭報告呈現成果"
    ja: "研究成果を論文と発表で伝える"
    ko: "논문과 발표로 연구 결과 전달하기"
    vi: "Trình bày kết quả bằng luận văn và bài nói"
    ms: "Melaporkan dapatan dalam tesis dan pembentangan"
    id: "Melaporkan temuan dalam tesis dan presentasi"
    hi: "नतीजे थीसिस और प्रेज़ेंटेशन में रखना"
