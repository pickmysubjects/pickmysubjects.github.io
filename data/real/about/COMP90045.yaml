code: COMP90045
year: 2027
learn:
  en: "How compilers work, from analysing source code to generating machine code, and why that helps programmers."
  zh: "编译器如何工作：从分析源代码到生成机器码，以及它对编程的帮助。"
  zh-TW: "編譯器如何運作：從分析原始碼到產生機器碼，以及它對寫程式的幫助。"
  ja: "コンパイラの仕組み：ソース解析から機械語生成まで、そしてその実用性。"
  ko: "컴파일러 작동 원리: 소스 분석부터 기계어 생성까지, 그리고 그 쓸모."
  vi: "Trình biên dịch hoạt động ra sao: từ phân tích mã nguồn đến sinh mã máy."
  ms: "Cara pengkompil berfungsi: daripada analisis kod sumber hingga penjanaan kod mesin."
  id: "Cara kerja compiler: dari analisis kode sumber hingga pembuatan kode mesin."
  hi: "कंपाइलर कैसे काम करते हैं: सोर्स कोड विश्लेषण से मशीन कोड बनाने तक।"
outcomes:
  - en: "Explain the phases of a compiler"
    zh: "说明编译器的各个阶段"
    zh-TW: "說明編譯器的各個階段"
    ja: "コンパイラの各段階を説明する"
    ko: "컴파일러 단계 설명하기"
    vi: "Giải thích các giai đoạn của trình biên dịch"
    ms: "Terangkan fasa pengkompil"
    id: "Menjelaskan tahapan compiler"
    hi: "कंपाइलर के चरण समझाना"
  - en: "Build parts of a compiler for a small language"
    zh: "为小型语言实现编译器部件"
    zh-TW: "為小型語言實作編譯器元件"
    ja: "小さな言語のコンパイラ部品を作る"
    ko: "작은 언어용 컴파일러 일부 구현하기"
    vi: "Xây một phần trình biên dịch cho ngôn ngữ nhỏ"
    ms: "Bina bahagian pengkompil untuk bahasa kecil"
    id: "Membangun bagian compiler untuk bahasa kecil"
    hi: "छोटी भाषा के लिए कंपाइलर के हिस्से बनाना"
