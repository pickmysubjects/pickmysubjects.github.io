code: ANSC30003
year: 2026
learn:
  en: "Why farm, pet and lab animals behave as they do: learning, motivation, social life, hormones and genes."
  zh: "农场、宠物和实验动物为何这样行为：学习、动机、社群、激素与基因。"
  zh-TW: "農場、寵物和實驗動物為何如此行為：學習、動機、社群、荷爾蒙與基因。"
  ja: "家畜・ペット・実験動物の行動の理由：学習、動機、社会性、ホルモン、遺伝。"
  ko: "농장·반려·실험동물의 행동 이유: 학습, 동기, 사회성, 호르몬, 유전."
  vi: "Vì sao vật nuôi, thú cưng, động vật thí nghiệm hành xử vậy: học tập, động cơ, xã hội, hormone, gen."
  ms: "Mengapa haiwan ladang, peliharaan dan makmal berkelakuan begitu: pembelajaran, motivasi, hormon, gen."
  id: "Mengapa hewan ternak, peliharaan, dan lab berperilaku begitu: belajar, motivasi, sosial, hormon, gen."
  hi: "फ़ार्म, पालतू और लैब जानवर ऐसा व्यवहार क्यों करते हैं: सीखना, प्रेरणा, हार्मोन, जीन।"
outcomes:
  - en: "Describe and record animal behaviour"
    zh: "描述并记录动物行为"
    zh-TW: "描述並記錄動物行為"
    ja: "動物の行動を記述し記録する"
    ko: "동물 행동을 기술하고 기록하기"
    vi: "Mô tả và ghi lại hành vi động vật"
    ms: "Huraikan dan rekod tingkah laku haiwan"
    id: "Mendeskripsikan dan mencatat perilaku hewan"
    hi: "जानवरों के व्यवहार का वर्णन और रिकॉर्ड करना"
  - en: "Identify behaviour factors in humane animal care"
    zh: "找出影响人道饲养的行为因素"
    zh-TW: "找出影響人道飼養的行為因素"
    ja: "人道的な飼育に関わる行動要因を見極める"
    ko: "인도적 사육에 중요한 행동 요인 찾기"
    vi: "Nhận ra yếu tố hành vi trong chăm sóc nhân đạo"
    ms: "Kenal pasti faktor tingkah laku dalam penjagaan berperikemanusiaan"
    id: "Mengenali faktor perilaku untuk perawatan yang manusiawi"
    hi: "मानवीय देखभाल के लिए व्यवहार कारक पहचानना"
