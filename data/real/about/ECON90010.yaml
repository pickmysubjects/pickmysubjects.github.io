code: ECON90010
year: 2027
learn:
  en: "Estimating nonlinear finance models (volatility, latent factors, extreme values, copulas) by maximum likelihood in R."
  zh: "用 R 以最大似然法估计非线性金融模型：波动率、潜在因子、极值与 copula。"
  zh-TW: "用 R 以最大概似法估計非線性金融模型：波動率、潛在因子、極值與 copula。"
  ja: "R で最尤法により非線形金融モデル（ボラティリティ・潜在因子・極値・コピュラ）を推定する。"
  ko: "R로 최우추정법을 써 비선형 금융모형(변동성, 잠재요인, 극단값, 코퓰러)을 추정한다."
  vi: "Ước lượng mô hình tài chính phi tuyến (biến động, nhân tố ẩn, giá trị cực trị, copula) bằng hợp lý cực đại trong R."
  ms: "Menganggar model kewangan tak linear (volatiliti, faktor pendam, nilai ekstrem, copula) dengan kebolehjadian maksimum dalam R."
  id: "Mengestimasi model keuangan nonlinier (volatilitas, faktor laten, nilai ekstrem, copula) dengan maximum likelihood di R."
  hi: "R में अधिकतम संभाविता से गैर-रेखीय वित्त मॉडल (अस्थिरता, छिपे कारक, चरम मान, कोपुला) का अनुमान।"
outcomes:
  - en: "Reproduce published results using R and Excel"
    zh: "用 R 和 Excel 复现已发表结果"
    zh-TW: "用 R 與 Excel 重現已發表結果"
    ja: "R と Excel で既存の研究結果を再現する"
    ko: "R과 Excel로 기존 연구 결과 재현하기"
    vi: "Tái tạo kết quả đã công bố bằng R và Excel"
    ms: "Menghasilkan semula keputusan terbitan dengan R dan Excel"
    id: "Mereproduksi hasil terbitan dengan R dan Excel"
    hi: "R और Excel से प्रकाशित परिणाम दोहराना"
  - en: "Carry out a research project in applied econometrics"
    zh: "完成一项应用计量经济学研究项目"
    zh-TW: "完成一項應用計量經濟學研究專題"
    ja: "応用計量経済学の研究プロジェクトを行う"
    ko: "응용계량경제학 연구 프로젝트 수행하기"
    vi: "Thực hiện dự án nghiên cứu kinh tế lượng ứng dụng"
    ms: "Menjalankan projek penyelidikan ekonometrik gunaan"
    id: "Melakukan proyek riset ekonometrika terapan"
    hi: "अनुप्रयुक्त अर्थमिति में शोध परियोजना करना"
