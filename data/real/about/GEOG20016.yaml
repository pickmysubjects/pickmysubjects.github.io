code: GEOG20016
year: 2026
learn:
  en: "Intro to demography: how births, deaths and migration change populations and link to social change."
  zh: "人口学入门：生育、死亡和迁移如何改变人口并关联社会变迁。"
  zh-TW: "人口學入門：生育、死亡與遷移如何改變人口並連動社會變遷。"
  ja: "人口学入門：出生・死亡・移動が人口と社会変化にどう関わるか。"
  ko: "인구학 입문: 출생·사망·이주가 인구와 사회 변화에 미치는 영향."
  vi: "Nhập môn nhân khẩu học: sinh, tử, di cư thay đổi dân số và gắn với biến đổi xã hội ra sao."
  ms: "Pengenalan demografi: kelahiran, kematian dan migrasi mengubah penduduk dan masyarakat."
  id: "Pengantar demografi: kelahiran, kematian, dan migrasi mengubah penduduk dan masyarakat."
  hi: "जनसांख्यिकी परिचय: जन्म, मृत्यु और प्रवास आबादी व सामाजिक बदलाव को कैसे बदलते हैं।"
outcomes:
  - en: "Find and interpret population data"
    zh: "查找并解读人口数据"
    zh-TW: "查找並解讀人口資料"
    ja: "人口データを探して読み解く"
    ko: "인구 데이터 찾고 해석하기"
    vi: "Tìm và diễn giải dữ liệu dân số"
    ms: "Cari dan tafsir data penduduk"
    id: "Mencari dan menafsirkan data penduduk"
    hi: "जनसंख्या डेटा खोजना और समझना"
  - en: "Argue about population and development issues"
    zh: "就人口与发展问题进行论证"
    zh-TW: "就人口與發展議題進行論證"
    ja: "人口と開発の問題を論じる"
    ko: "인구·개발 문제 논증하기"
    vi: "Lập luận về vấn đề dân số và phát triển"
    ms: "Berhujah tentang isu penduduk dan pembangunan"
    id: "Berargumen tentang isu penduduk dan pembangunan"
    hi: "जनसंख्या और विकास मुद्दों पर तर्क करना"
  - en: "Explain how births, deaths and migration shift populations"
    zh: "解释出生、死亡和迁移如何改变人口"
    zh-TW: "解釋出生、死亡和遷移如何改變人口"
    ja: "出生・死亡・移住が人口をどう変えるか説明する"
    ko: "출생·사망·이주가 인구를 바꾸는 방식 설명하기"
    vi: "Giải thích sinh, tử và di cư làm thay đổi dân số thế nào"
    ms: "Terangkan cara kelahiran, kematian dan migrasi mengubah populasi"
    id: "Menjelaskan cara kelahiran, kematian dan migrasi mengubah populasi"
    hi: "समझाना कि जन्म, मृत्यु और प्रवास आबादी को कैसे बदलते हैं"
