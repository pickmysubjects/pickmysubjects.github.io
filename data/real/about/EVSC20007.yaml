code: EVSC20007
year: 2026
learn:
  en: "Turning real-world systems like disease spread or pollution into maths models and computer simulations."
  zh: "把疾病传播、污染扩散等现实系统变成数学模型和计算机模拟。"
  zh-TW: "把疾病傳播、污染擴散等真實系統變成數學模型和電腦模擬。"
  ja: "感染拡大や汚染拡散など現実のシステムを数理モデルとシミュレーションにする。"
  ko: "질병 확산·오염 확산 같은 현실 시스템을 수학 모델과 컴퓨터 시뮬레이션으로 만든다."
  vi: "Biến hệ thống thực như lây lan dịch bệnh hay ô nhiễm thành mô hình toán và mô phỏng máy tính."
  ms: "Menukar sistem dunia sebenar seperti penyebaran penyakit atau pencemaran kepada model matematik dan simulasi komputer."
  id: "Mengubah sistem nyata seperti penyebaran penyakit atau polusi menjadi model matematika dan simulasi komputer."
  hi: "बीमारी फैलाव या प्रदूषण जैसे असली सिस्टम को गणितीय मॉडल और कंप्यूटर सिमुलेशन में बदलना।"
outcomes:
  - en: "Turn a concept into a mathematical model"
    zh: "把概念模型转成数学模型"
    zh-TW: "把概念模型轉成數學模型"
    ja: "概念モデルを数理モデルにする"
    ko: "개념 모델을 수학 모델로 바꾼다"
    vi: "Chuyển mô hình khái niệm thành mô hình toán"
    ms: "Tukar model konsep kepada model matematik"
    id: "Mengubah konsep menjadi model matematika"
    hi: "अवधारणा को गणितीय मॉडल में बदलना"
  - en: "Simulate and visualise a system in software"
    zh: "用软件模拟并可视化系统"
    zh-TW: "用軟體模擬並視覺化系統"
    ja: "ソフトでシステムを模擬・可視化する"
    ko: "소프트웨어로 시스템을 시뮬레이션·시각화한다"
    vi: "Mô phỏng và trực quan hóa hệ thống bằng phần mềm"
    ms: "Simulasi dan visualkan sistem dengan perisian"
    id: "Mensimulasikan dan memvisualkan sistem"
    hi: "सॉफ़्टवेयर में सिस्टम सिमुलेट और विज़ुअलाइज़ करना"
