code: ABPL90364
year: 2027
learn:
  en: "A research project set by a property firm, done with the firm and your coordinator, with up to 12 days on site."
  zh: "与房地产公司合作完成其指定的研究课题，最多在公司工作12天。"
  zh-TW: "與房地產公司合作完成其指定的研究課題，最多在公司工作12天。"
  ja: "不動産会社が出す研究課題に取り組み、最大12日間社内で作業する。"
  ko: "부동산 회사가 정한 연구 과제를 수행하며 최대 12일 회사에서 일합니다."
  vi: "Dự án nghiên cứu do công ty bất động sản đề ra, làm tại công ty tối đa 12 ngày."
  ms: "Projek kajian yang ditetapkan firma hartanah, dengan sehingga 12 hari di firma."
  id: "Proyek riset dari perusahaan properti, dengan maksimal 12 hari di perusahaan."
  hi: "प्रॉपर्टी फ़र्म द्वारा दिया शोध प्रोजेक्ट, फ़र्म में अधिकतम 12 दिन।"
outcomes:
  - en: "Manage research in an industry setting"
    zh: "在行业环境中管理研究"
    zh-TW: "在產業環境中管理研究"
    ja: "業界の現場で研究を進める"
    ko: "산업 현장에서 연구 관리하기"
    vi: "Quản lý nghiên cứu trong môi trường doanh nghiệp"
    ms: "Mengurus kajian dalam persekitaran industri"
    id: "Mengelola riset di lingkungan industri"
    hi: "उद्योग में शोध का प्रबंधन"
  - en: "Produce a practice-based research thesis"
    zh: "完成一篇基于实践的研究论文"
    zh-TW: "完成一篇基於實務的研究論文"
    ja: "実務に基づく研究論文を仕上げる"
    ko: "실무 기반 연구 논문 완성하기"
    vi: "Hoàn thành luận văn dựa trên thực tiễn"
    ms: "Menghasilkan tesis kajian berasaskan amalan"
    id: "Menghasilkan tesis riset berbasis praktik"
