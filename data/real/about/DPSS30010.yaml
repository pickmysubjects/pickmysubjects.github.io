code: DPSS30010
year: 2026
learn:
  en: "A year-long subject built around a 120-hour industry internship, plus a CV, artist bio and writing on your career path."
  zh: "全年课程，核心是120小时行业实习，另有简历、艺术家简介和职业规划写作。"
  zh-TW: "全年課程，核心是120小時產業實習，另有履歷、藝術家簡介與職涯規劃寫作。"
  ja: "120時間の業界インターンを軸にした通年科目。履歴書、アーティスト紹介、キャリアの文章も。"
  ko: "120시간 업계 인턴십 중심의 연간 과목. 이력서, 작가 소개, 진로 글쓰기 포함."
  vi: "Môn cả năm xoay quanh 120 giờ thực tập, kèm CV, tiểu sử nghệ sĩ và bài viết nghề nghiệp."
  ms: "Subjek setahun berteraskan latihan industri 120 jam, serta CV, bio artis dan penulisan kerjaya."
  id: "Mata kuliah setahun berpusat pada magang 120 jam, plus CV, bio seniman, dan tulisan karier."
  hi: "120 घंटे की इंडस्ट्री इंटर्नशिप पर आधारित सालभर का विषय, साथ में CV, बायो और करियर लेखन।"
outcomes:
  - en: "Complete a supervised industry internship"
    zh: "完成有督导的行业实习"
    zh-TW: "完成有督導的產業實習"
    ja: "指導付きの業界インターンを修了する"
    ko: "지도받는 업계 인턴십 마치기"
    vi: "Hoàn thành thực tập có giám sát"
    ms: "Lengkapkan latihan industri berpenyelia"
    id: "Menyelesaikan magang terbimbing"
    hi: "निगरानी में इंटर्नशिप पूरी करना"
  - en: "Prepare a professional CV and bio"
    zh: "准备专业简历和个人简介"
    zh-TW: "準備專業履歷與個人簡介"
    ja: "プロ向けの履歴書と経歴を用意する"
    ko: "전문 이력서와 소개글 준비하기"
    vi: "Chuẩn bị CV và tiểu sử chuyên nghiệp"
    ms: "Sediakan CV dan bio profesional"
    id: "Menyiapkan CV dan bio profesional"
    hi: "पेशेवर CV और बायो तैयार करना"
  - en: "Plan your next steps in the industry"
    zh: "规划在行业中的下一步"
    zh-TW: "規劃在產業中的下一步"
    ja: "業界での次の一歩を計画する"
    ko: "업계에서의 다음 단계 계획하기"
    vi: "Lên kế hoạch bước tiếp trong ngành"
    ms: "Rancang langkah seterusnya dalam industri"
    id: "Merencanakan langkah berikut di industri"
    hi: "उद्योग में अगले कदम की योजना"
