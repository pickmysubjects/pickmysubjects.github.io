code: EDUC20085
year: 2027
learn:
  en: "Hands-on songwriting and singing: writing and recording songs, and studying songs that pushed for social change."
  zh: "动手唱歌和写歌：创作并录制歌曲，并研究推动社会变革的歌曲。"
  zh-TW: "動手唱歌和寫歌：創作並錄製歌曲，並研究推動社會變革的歌曲。"
  ja: "実践的な歌と作詞作曲：曲を作って録音し、社会変革を後押しした歌を学ぶ。"
  ko: "실습 중심 노래·작곡: 노래를 만들어 녹음하고 사회 변화를 이끈 노래를 공부한다."
  vi: "Thực hành hát và sáng tác: viết và thu âm bài hát, tìm hiểu những bài hát thúc đẩy thay đổi xã hội."
  ms: "Menyanyi dan mencipta lagu secara praktikal: tulis dan rakam lagu, serta kaji lagu yang mendorong perubahan sosial."
  id: "Praktik bernyanyi dan menulis lagu: membuat dan merekam lagu, serta mempelajari lagu yang mendorong perubahan sosial."
  hi: "गाना और गीत लिखना सीखें: गाने बनाकर रिकॉर्ड करना, और सामाजिक बदलाव लाने वाले गीतों को समझना।"
outcomes:
  - en: "See how groups used songs to express identity and values"
    zh: "了解不同群体如何用歌曲表达身份和价值观"
    zh-TW: "了解不同群體如何用歌曲表達身分和價值觀"
    ja: "人々が歌でアイデンティティや価値観を表してきた方法を知る"
    ko: "여러 집단이 노래로 정체성과 가치를 표현한 방식 이해하기"
    vi: "Hiểu các nhóm người dùng bài hát để thể hiện bản sắc và giá trị"
    ms: "Fahami cara kumpulan guna lagu untuk luahkan identiti dan nilai"
    id: "Memahami cara kelompok memakai lagu untuk menyuarakan identitas dan nilai"
    hi: "समूहों ने गीतों से पहचान और मूल्य कैसे व्यक्त किए, यह समझना"
  - en: "Make music together in informal groups"
    zh: "在非正式小组中一起做音乐"
    zh-TW: "在非正式小組中一起做音樂"
    ja: "気軽なグループで一緒に音楽を作る"
    ko: "비공식 그룹에서 함께 음악 만들기"
    vi: "Cùng làm nhạc trong nhóm không chính thức"
    ms: "Bermain muzik bersama dalam kumpulan tidak formal"
    id: "Bermusik bersama dalam kelompok informal"
    hi: "अनौपचारिक समूहों में मिलकर संगीत बनाना"
  - en: "Record and produce music with digital tools"
    zh: "用数字工具录制和制作音乐"
    zh-TW: "用數位工具錄製和製作音樂"
    ja: "デジタルツールで音楽を録音・制作する"
    ko: "디지털 도구로 음악 녹음·제작하기"
    vi: "Thu âm và sản xuất nhạc bằng công cụ số"
    ms: "Rakam dan hasilkan muzik dengan alat digital"
    id: "Merekam dan memproduksi musik dengan alat digital"
    hi: "डिजिटल टूल से संगीत रिकॉर्ड और प्रोड्यूस करना"
