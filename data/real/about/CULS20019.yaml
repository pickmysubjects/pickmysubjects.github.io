code: CULS20019
year: 2026
learn:
  en: "Leisure, play and video games as culture, and how race, gender and money shape the ways we play."
  zh: "把休闲、游戏和电子游戏作为文化来研究，以及种族、性别和金钱如何影响我们的玩法。"
  zh-TW: "把休閒、遊戲和電玩作為文化來研究，以及種族、性別和金錢如何影響我們的玩法。"
  ja: "余暇・遊び・ビデオゲームを文化として捉え、人種・ジェンダー・お金が遊び方にどう影響するかを学ぶ。"
  ko: "여가·놀이·비디오 게임을 문화로 보고, 인종·젠더·돈이 노는 방식에 어떻게 영향을 주는지 배운다."
  vi: "Giải trí, vui chơi và trò chơi điện tử như văn hóa, và chủng tộc, giới, tiền bạc định hình cách ta chơi ra sao."
  ms: "Riadah, permainan dan permainan video sebagai budaya, serta cara kaum, gender dan wang membentuk cara kita bermain."
  id: "Waktu luang, bermain dan gim video sebagai budaya, serta cara ras, gender dan uang membentuk cara kita bermain."
  hi: "फ़ुर्सत, खेल और वीडियो गेम को संस्कृति के रूप में पढ़ना, और नस्ल, जेंडर व पैसा हमारे खेलने को कैसे आकार देते हैं।"
outcomes:
  - en: "Explain key ideas from game studies"
    zh: "说明游戏研究的核心观念"
    zh-TW: "說明遊戲研究的核心觀念"
    ja: "ゲーム研究の主な考えを説明する"
    ko: "게임 연구의 핵심 개념 설명하기"
    vi: "Giải thích các ý tưởng chính của nghiên cứu trò chơi"
    ms: "Terangkan idea utama kajian permainan"
    id: "Menjelaskan gagasan utama kajian gim"
    hi: "गेम स्टडीज़ के मुख्य विचार समझाना"
  - en: "Analyse games and play as social practices"
    zh: "把游戏和玩耍作为社会实践来分析"
    zh-TW: "把遊戲和玩耍作為社會實踐來分析"
    ja: "ゲームと遊びを社会的実践として分析する"
    ko: "게임과 놀이를 사회적 실천으로 분석하기"
    vi: "Phân tích trò chơi và vui chơi như thực hành xã hội"
    ms: "Analisis permainan dan bermain sebagai amalan sosial"
    id: "Menganalisis gim dan bermain sebagai praktik sosial"
    hi: "गेम और खेल का सामाजिक प्रथाओं के रूप में विश्लेषण करना"
  - en: "Discuss race, gender and labour in gaming"
    zh: "讨论游戏中的种族、性别与劳动"
    zh-TW: "討論遊戲中的種族、性別與勞動"
    ja: "ゲームにおける人種・ジェンダー・労働を論じる"
    ko: "게임 속 인종·젠더·노동 논의하기"
    vi: "Thảo luận chủng tộc, giới và lao động trong trò chơi"
    ms: "Bincangkan kaum, gender dan buruh dalam permainan"
    id: "Membahas ras, gender dan kerja dalam gim"
    hi: "गेमिंग में नस्ल, जेंडर और श्रम पर चर्चा करना"
