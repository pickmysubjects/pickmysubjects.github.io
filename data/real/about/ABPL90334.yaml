code: ABPL90334
year: 2027
learn:
  en: "Construction plant and temporary works, the pros and cons of different construction methods, and how methods have changed."
  zh: "施工机械和临时工程、各种施工方法的优缺点，以及施工方法的演变。"
  zh-TW: "施工機具與臨時工程、各種施工方法的優缺點，以及施工方法的演變。"
  ja: "建設機械と仮設工事、各工法の長所短所、工法の変遷。"
  ko: "건설장비와 가설공사, 공법별 장단점, 공법의 변화."
  vi: "Máy móc thi công và công trình tạm, ưu nhược điểm các phương pháp và sự phát triển của chúng."
  ms: "Loji pembinaan dan kerja sementara, kebaikan dan keburukan kaedah, serta perkembangannya."
  id: "Alat berat dan pekerjaan sementara, kelebihan dan kekurangan metode, serta perkembangannya."
  hi: "निर्माण मशीनरी और अस्थायी कार्य, विभिन्न तरीकों के फ़ायदे-नुकसान और उनका विकास।"
outcomes:
  - en: "Describe construction plant and temporary works"
    zh: "描述施工机械和临时工程"
    zh-TW: "描述施工機具與臨時工程"
    ja: "建設機械と仮設工事を説明する"
    ko: "건설장비와 가설공사 설명하기"
    vi: "Mô tả máy móc thi công và công trình tạm"
    ms: "Menghuraikan loji pembinaan dan kerja sementara"
    id: "Mendeskripsikan alat berat dan pekerjaan sementara"
    hi: "निर्माण मशीनरी और अस्थायी कार्यों का वर्णन"
  - en: "Weigh construction methods to choose the right one"
    zh: "权衡各施工方法并作出选择"
    zh-TW: "權衡各施工方法並作出選擇"
    ja: "工法を比べて適切なものを選ぶ"
    ko: "공법을 비교해 알맞은 것 고르기"
    vi: "Cân nhắc để chọn phương pháp thi công"
    ms: "Menimbang kaedah untuk memilih yang sesuai"
    id: "Menimbang metode untuk memilih yang tepat"
    hi: "सही निर्माण तरीका चुनने के लिए तुलना करना"
