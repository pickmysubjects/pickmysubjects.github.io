code: ABPL20056
year: 2027
learn:
  en: "An intro to GIS for planning and landscape: working with spatial data, basic analysis and making clear maps."
  zh: "规划与景观的 GIS 入门：处理空间数据、基础分析和制作清晰的地图。"
  zh-TW: "規劃與景觀的 GIS 入門：處理空間資料、基礎分析和製作清楚的地圖。"
  ja: "計画・ランドスケープのための GIS 入門：空間データの扱い、基本分析、分かりやすい地図作り。"
  ko: "계획·조경을 위한 GIS 입문: 공간 데이터 다루기, 기초 분석, 명확한 지도 제작."
  vi: "Nhập môn GIS cho quy hoạch và cảnh quan: xử lý dữ liệu không gian, phân tích cơ bản và làm bản đồ rõ ràng."
  ms: "Pengenalan GIS untuk perancangan dan landskap: data ruangan, analisis asas dan peta yang jelas."
  id: "Pengantar GIS untuk perencanaan dan lanskap: data spasial, analisis dasar, dan membuat peta yang jelas."
  hi: "प्लानिंग और लैंडस्केप के लिए GIS परिचय: स्थानिक डेटा, बुनियादी विश्लेषण और साफ़ नक्शे बनाना।"
outcomes:
  - en: "Use basic GIS operations on urban and landscape issues"
    zh: "用基本 GIS 操作分析城市和景观问题"
    zh-TW: "用基本 GIS 操作分析城市和景觀問題"
    ja: "基本的な GIS 操作で都市・景観の課題を調べる"
    ko: "기본 GIS 작업으로 도시·경관 문제 살펴보기"
    vi: "Dùng thao tác GIS cơ bản cho vấn đề đô thị và cảnh quan"
    ms: "Guna operasi GIS asas untuk isu bandar dan landskap"
    id: "Memakai operasi GIS dasar untuk isu kota dan lanskap"
    hi: "शहरी और लैंडस्केप मुद्दों पर बुनियादी GIS ऑपरेशन लगाना"
  - en: "Make thematic maps that communicate clearly"
    zh: "制作表达清楚的专题地图"
    zh-TW: "製作表達清楚的主題地圖"
    ja: "分かりやすい主題図を作る"
    ko: "명확히 전달되는 주제도 만들기"
    vi: "Làm bản đồ chuyên đề truyền đạt rõ ràng"
    ms: "Hasilkan peta tematik yang jelas"
    id: "Membuat peta tematik yang komunikatif"
    hi: "साफ़ संदेश देने वाले थीमैटिक नक्शे बनाना"
  - en: "Use spatial evidence in site analysis and decisions"
    zh: "用空间证据支持场地分析和决策"
    zh-TW: "用空間證據支持基地分析和決策"
    ja: "空間的根拠を敷地分析や判断に使う"
    ko: "공간 근거를 대지 분석과 의사결정에 활용하기"
    vi: "Dùng bằng chứng không gian để phân tích khu đất và ra quyết định"
    ms: "Guna bukti ruangan dalam analisis tapak dan keputusan"
    id: "Memakai bukti spasial untuk analisis tapak dan keputusan"
    hi: "साइट विश्लेषण और फ़ैसलों में स्थानिक साक्ष्य का उपयोग"
