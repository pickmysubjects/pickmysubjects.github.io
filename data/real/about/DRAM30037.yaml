code: DRAM30037
year: 2026
learn:
  en: "Final voice, movement, text and dramaturgy classes, shaping your own creative process for life after graduation."
  zh: "最后一轮声音、形体、文本与戏剧构作课，找到自己的创作方法。"
  zh-TW: "最後一輪聲音、形體、文本與戲劇構作課，找到自己的創作方法。"
  ja: "最後の声・身体・テキスト・ドラマトゥルギー授業で、自分の創作過程を固める。"
  ko: "마지막 목소리·움직임·텍스트·드라마투르기 수업으로 자기 창작 과정을 다진다."
  vi: "Lớp cuối về giọng, hình thể, văn bản, biên kịch; định hình cách sáng tạo riêng."
  ms: "Kelas akhir suara, gerak, teks dan dramaturgi untuk membentuk proses kreatif sendiri."
  id: "Kelas terakhir suara, gerak, teks dan dramaturgi untuk proses kreatif sendiri."
  hi: "आवाज़, गति, टेक्स्ट और ड्रामाटर्जी की अंतिम कक्षाएँ, अपनी रचना-प्रक्रिया गढ़ना।"
outcomes:
  - en: "Perform a 7 to 10-minute piece"
    zh: "表演7到10分钟的作品"
    zh-TW: "表演 7 到 10 分鐘的作品"
    ja: "7〜10分の作品を上演する"
    ko: "7~10분 작품 공연하기"
    vi: "Diễn một tiết mục 7–10 phút"
    ms: "Persembah karya 7 hingga 10 minit"
    id: "Membawakan karya 7–10 menit"
    hi: "7 से 10 मिनट का पीस प्रस्तुत करना"
  - en: "Design and lead a workshop"
    zh: "设计并带领一场工作坊"
    zh-TW: "設計並帶領一場工作坊"
    ja: "ワークショップを企画し進行する"
    ko: "워크숍 설계하고 이끌기"
    vi: "Thiết kế và dẫn một buổi workshop"
    ms: "Reka dan kendalikan bengkel"
    id: "Merancang dan memandu lokakarya"
    hi: "वर्कशॉप डिज़ाइन करना और चलाना"
  - en: "Name your own creative process"
    zh: "说清自己的创作过程"
    zh-TW: "說清自己的創作過程"
    ja: "自分の創作過程を言葉にする"
    ko: "자신의 창작 과정 정리하기"
    vi: "Gọi tên quá trình sáng tạo của mình"
    ms: "Jelaskan proses kreatif sendiri"
    id: "Merumuskan proses kreatif sendiri"
    hi: "अपनी रचना-प्रक्रिया को शब्द देना"
