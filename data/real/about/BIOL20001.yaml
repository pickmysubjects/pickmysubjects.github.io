code: BIOL20001
year: 2026
learn:
  en: "How evolution works through selection, drift and migration, and why it matters for problems like drug resistance."
  zh: "演化怎样通过选择、漂变和迁移发生，以及它对抗药性等问题的意义。"
  zh-TW: "演化如何透過天擇、漂變和遷移發生，以及它對抗藥性等問題的意義。"
  ja: "選択・浮動・移住による進化の仕組みと、薬剤耐性などの問題との関わり。"
  ko: "선택, 부동, 이주를 통한 진화의 원리와 약물 내성 같은 문제에서의 중요성."
  vi: "Tiến hóa diễn ra qua chọn lọc, phiêu bạt và di cư ra sao, và vì sao quan trọng với vấn đề như kháng thuốc."
  ms: "Cara evolusi berlaku melalui pemilihan, hanyutan dan migrasi, serta kepentingannya untuk isu seperti rintangan ubat."
  id: "Cara evolusi terjadi lewat seleksi, drift, dan migrasi, serta pentingnya untuk masalah seperti resistansi obat."
  hi: "सेलेक्शन, ड्रिफ़्ट और माइग्रेशन से विकास कैसे होता है, और ड्रग रेज़िस्टेंस जैसी समस्याओं में यह क्यों मायने रखता है।"
outcomes:
  - en: "Build and read evolutionary trees"
    zh: "构建和解读进化树"
    zh-TW: "建構和解讀演化樹"
    ja: "系統樹を作って読む"
    ko: "진화 계통수 만들고 읽기"
    vi: "Dựng và đọc cây tiến hóa"
    ms: "Bina dan baca pokok evolusi"
    id: "Membuat dan membaca pohon evolusi"
    hi: "इवोल्यूशनरी ट्री बनाना और पढ़ना"
  - en: "Explain heritability, adaptation and speciation"
    zh: "解释遗传力、适应和物种形成"
    zh-TW: "解釋遺傳力、適應和物種形成"
    ja: "遺伝率・適応・種分化を説明する"
    ko: "유전율, 적응, 종 분화 설명하기"
    vi: "Giải thích hệ số di truyền, thích nghi và hình thành loài"
    ms: "Terangkan keterwarisan, adaptasi dan spesiasi"
    id: "Menjelaskan heritabilitas, adaptasi, dan spesiasi"
    hi: "हेरिटेबिलिटी, अनुकूलन और प्रजाति-निर्माण समझाना"
  - en: "Describe how scientists study evolution"
    zh: "说明研究演化的科学方法"
    zh-TW: "說明研究演化的科學方法"
    ja: "科学者が進化をどう研究するか説明する"
    ko: "과학자들이 진화를 연구하는 방법 설명하기"
    vi: "Mô tả cách các nhà khoa học nghiên cứu tiến hóa"
    ms: "Huraikan cara saintis mengkaji evolusi"
    id: "Menjelaskan cara ilmuwan meneliti evolusi"
    hi: "बताना कि वैज्ञानिक विकास का अध्ययन कैसे करते हैं"
