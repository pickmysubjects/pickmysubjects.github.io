code: CHEN20011
year: 2026
learn:
  en: "Numerical methods and process simulation software for solving chemical engineering problems, from molecules to plants."
  zh: "用数值方法和流程模拟软件解决从分子到工厂的化工问题。"
  zh-TW: "用數值方法與製程模擬軟體解決從分子到工廠的化工問題。"
  ja: "数値計算とプロセスシミュレーターで、分子から工場まで化学工学の問題を解く。"
  ko: "수치해석과 공정 시뮬레이션 소프트웨어로 분자부터 공장까지 화공 문제 풀기."
  vi: "Phương pháp số và phần mềm mô phỏng để giải bài toán kỹ thuật hóa học, từ phân tử đến cả nhà máy."
  ms: "Kaedah berangka dan perisian simulasi proses untuk masalah kejuruteraan kimia, dari molekul hingga loji."
  id: "Metode numerik dan software simulasi proses untuk soal teknik kimia, dari molekul hingga pabrik."
  hi: "अणु से प्लांट तक, केमिकल इंजीनियरिंग समस्याएँ न्यूमेरिकल मेथड और प्रोसेस सिमुलेशन सॉफ़्टवेयर से हल करना।"
outcomes:
  - en: "Turn a process problem into a maths model"
    zh: "把化工问题建成数学模型"
    zh-TW: "把化工問題建成數學模型"
    ja: "化工の問題を数理モデルにする"
    ko: "공정 문제를 수학 모델로 만들기"
    vi: "Chuyển bài toán quy trình thành mô hình toán"
    ms: "Menukar masalah proses kepada model matematik"
    id: "Mengubah soal proses menjadi model matematika"
    hi: "प्रोसेस समस्या को गणितीय मॉडल में बदलना"
  - en: "Simulate processes with industry software"
    zh: "用行业软件模拟化工流程"
    zh-TW: "用業界軟體模擬化工流程"
    ja: "業界ソフトでプロセスを模擬する"
    ko: "산업용 소프트웨어로 공정 시뮬레이션하기"
    vi: "Mô phỏng quy trình bằng phần mềm công nghiệp"
    ms: "Mensimulasi proses dengan perisian industri"
    id: "Mensimulasikan proses dengan software industri"
    hi: "इंडस्ट्री सॉफ़्टवेयर से प्रक्रियाएँ सिमुलेट करना"
  - en: "Solve design problems using cost analysis"
    zh: "结合经济分析解决设计问题"
    zh-TW: "結合經濟分析解決設計問題"
    ja: "経済性分析で設計問題を解く"
    ko: "경제성 분석으로 설계 문제 풀기"
    vi: "Giải bài toán thiết kế dựa trên phân tích chi phí"
    ms: "Menyelesaikan masalah reka bentuk dengan analisis kos"
    id: "Menyelesaikan soal desain dengan analisis biaya"
    hi: "लागत विश्लेषण से डिज़ाइन समस्याएँ हल करना"
