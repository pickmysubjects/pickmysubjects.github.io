code: ABPL90089
year: 2027
learn:
  en: "Australian architecture and cities from Indigenous and colonial times to today, with Melbourne as the case study and archive research."
  zh: "从原住民与殖民时期到今天的澳大利亚建筑与城市，以墨尔本为案例并做档案研究。"
  zh-TW: "從原住民與殖民時期到今天的澳洲建築與城市，以墨爾本為個案並做檔案研究。"
  ja: "先住民・植民地時代から現代までの豪州建築と都市。メルボルンを事例に資料調査。"
  ko: "원주민·식민 시대부터 현재까지 호주 건축과 도시. 멜버른 사례와 기록물 연구."
  vi: "Kiến trúc và đô thị Úc từ thời bản địa, thuộc địa đến nay, lấy Melbourne làm ví dụ."
  ms: "Seni bina dan bandar Australia dari zaman Orang Asli hingga kini, dengan Melbourne sebagai kajian kes."
  id: "Arsitektur dan kota Australia dari masa Pribumi hingga kini, dengan Melbourne sebagai studi kasus."
  hi: "आदिवासी और औपनिवेशिक काल से आज तक ऑस्ट्रेलियाई वास्तुकला, मेलबर्न को केस मानकर।"
outcomes:
  - en: "Discuss what has shaped Australian architecture"
    zh: "讨论塑造澳大利亚建筑的因素"
    zh-TW: "討論塑造澳洲建築的因素"
    ja: "豪州建築を形作った要因を論じる"
    ko: "호주 건축을 형성한 요인 논하기"
    vi: "Thảo luận các yếu tố định hình kiến trúc Úc"
    ms: "Membincang faktor yang membentuk seni bina Australia"
    id: "Membahas faktor pembentuk arsitektur Australia"
    hi: "ऑस्ट्रेलियाई वास्तुकला को गढ़ने वाले कारकों पर चर्चा"
  - en: "Research buildings using primary and archive sources"
    zh: "利用一手和档案资料研究建筑"
    zh-TW: "利用一手與檔案資料研究建築"
    ja: "一次資料やアーカイブで建物を調べる"
    ko: "1차·기록 자료로 건물 연구하기"
    vi: "Nghiên cứu công trình bằng tư liệu gốc và lưu trữ"
    ms: "Mengkaji bangunan menggunakan sumber primer dan arkib"
    id: "Meneliti bangunan dengan sumber primer dan arsip"
    hi: "प्राथमिक और अभिलेखीय स्रोतों से इमारतों पर शोध"
