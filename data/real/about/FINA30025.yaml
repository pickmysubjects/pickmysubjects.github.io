code: FINA30025
year: 2026
learn:
  en: "A studio option in your chosen medium, assessed on a semester folio showing experiments, research and finished work."
  zh: "选定媒介的工作室选修课，以展示实验、研究和成品的学期作品集评分。"
  zh-TW: "選定媒材的工作室選修課，以呈現實驗、研究與成品的學期作品集評分。"
  ja: "選んだ媒体でのスタジオ科目。実験・リサーチ・完成作品を示す学期末の作品集で評価。"
  ko: "선택한 매체의 스튜디오 과목. 실험·리서치·완성작을 담은 학기 포트폴리오로 평가."
  vi: "Môn studio theo chất liệu bạn chọn, chấm bằng hồ sơ học kỳ gồm thử nghiệm và tác phẩm."
  ms: "Pilihan studio dalam medium pilihan, dinilai melalui folio semester."
  id: "Pilihan studio dalam medium pilihan, dinilai lewat folio semester."
  hi: "चुने माध्यम में स्टूडियो विकल्प, सेमेस्टर के फ़ोलियो से मूल्यांकन।"
outcomes:
  - en: "Experiment with materials and ideas"
    zh: "尝试不同材料和想法"
    zh-TW: "嘗試不同材料與想法"
    ja: "素材とアイデアを試す"
    ko: "재료와 아이디어 실험하기"
    vi: "Thử nghiệm chất liệu và ý tưởng"
    ms: "Bereksperimen dengan bahan dan idea"
    id: "Bereksperimen dengan bahan dan ide"
    hi: "सामग्री और विचारों के साथ प्रयोग"
  - en: "Connect your work to contemporary art"
    zh: "把作品与当代艺术联系起来"
    zh-TW: "把作品與當代藝術連結"
    ja: "作品を現代美術と結びつける"
    ko: "작품을 현대 미술과 연결하기"
    vi: "Liên hệ tác phẩm với nghệ thuật đương đại"
    ms: "Kaitkan karya dengan seni kontemporari"
    id: "Mengaitkan karya dengan seni kontemporer"
    hi: "अपने काम को समकालीन कला से जोड़ना"
  - en: "Present a coherent body of work"
    zh: "呈现一组完整的作品"
    zh-TW: "呈現一組完整的作品"
    ja: "まとまりのある作品群を提示する"
    ko: "일관된 작품군 제시하기"
    vi: "Trình bày một loạt tác phẩm thống nhất"
    ms: "Persembah himpunan karya yang padu"
    id: "Menyajikan kumpulan karya yang utuh"
    hi: "एक सुसंगत कार्य-संग्रह प्रस्तुत करना"
