code: COMP90046
year: 2027
learn:
  en: "Modelling and solving combinatorial optimisation problems, like scheduling and packing, in MiniZinc."
  zh: "用 MiniZinc 建模并求解排程、装箱等组合优化问题。"
  zh-TW: "用 MiniZinc 建模並求解排程、裝箱等組合最佳化問題。"
  ja: "MiniZinc でスケジューリングや詰め込みなどの組合せ最適化を解く。"
  ko: "MiniZinc로 스케줄링·패킹 같은 조합 최적화 문제 모델링·해결."
  vi: "Mô hình hóa và giải bài toán tối ưu tổ hợp như lập lịch, xếp hàng bằng MiniZinc."
  ms: "Memodel dan menyelesaikan masalah pengoptimuman kombinatorik seperti penjadualan dalam MiniZinc."
  id: "Memodelkan dan menyelesaikan optimisasi kombinatorial seperti penjadwalan dengan MiniZinc."
  hi: "MiniZinc में शेड्यूलिंग और पैकिंग जैसी कॉम्बिनेटोरियल ऑप्टिमाइज़ेशन समस्याएँ हल करना।"
outcomes:
  - en: "Model optimisation problems in MiniZinc"
    zh: "用 MiniZinc 为优化问题建模"
    zh-TW: "用 MiniZinc 為最佳化問題建模"
    ja: "MiniZinc で最適化問題をモデル化する"
    ko: "MiniZinc로 최적화 문제 모델링하기"
    vi: "Mô hình hóa bài toán tối ưu bằng MiniZinc"
    ms: "Model masalah pengoptimuman dalam MiniZinc"
    id: "Memodelkan masalah optimisasi di MiniZinc"
    hi: "MiniZinc में ऑप्टिमाइज़ेशन समस्याएँ मॉडल करना"
  - en: "Compare solving methods such as constraint and integer programming"
    zh: "比较约束求解与整数规划等方法"
    zh-TW: "比較限制求解與整數規劃等方法"
    ja: "制約解法や整数計画などを比べる"
    ko: "제약 해법·정수 계획법 등 비교하기"
    vi: "So sánh phương pháp giải như ràng buộc và quy hoạch nguyên"
    ms: "Bandingkan kaedah seperti kekangan dan pengaturcaraan integer"
    id: "Membandingkan metode seperti kendala dan pemrograman integer"
    hi: "कंस्ट्रेंट और इंटीजर प्रोग्रामिंग जैसी विधियों की तुलना"
