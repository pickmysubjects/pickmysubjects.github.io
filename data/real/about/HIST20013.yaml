code: HIST20013
year: 2026
learn:
  en: "The Holocaust within a global history of genocide, with cases from Europe, Africa and Asia-Pacific and hands-on archival work."
  zh: "在全球种族灭绝史中理解大屠杀，涵盖欧洲、非洲和亚太的案例，并动手研读档案。"
  zh-TW: "在全球種族滅絕史中理解大屠殺，涵蓋歐洲、非洲和亞太的案例，並動手研讀檔案。"
  ja: "ジェノサイドの世界史の中でホロコーストを学ぶ。ヨーロッパ、アフリカ、アジア太平洋の事例と、史料に触れる演習。"
  ko: "세계 집단학살사 속에서 홀로코스트를 배운다. 유럽, 아프리카, 아시아태평양 사례와 직접 다루는 기록물 실습."
  vi: "Holocaust trong lịch sử diệt chủng toàn cầu, với các trường hợp ở châu Âu, châu Phi, châu Á–Thái Bình Dương và làm việc với tư liệu lưu trữ."
  ms: "Holocaust dalam sejarah genosid global, dengan kes dari Eropah, Afrika dan Asia Pasifik serta kerja langsung dengan bahan arkib."
  id: "Holocaust dalam sejarah genosida global, dengan kasus dari Eropa, Afrika dan Asia Pasifik serta praktik langsung dengan arsip."
  hi: "नरसंहार के वैश्विक इतिहास में होलोकॉस्ट, यूरोप, अफ़्रीका और एशिया-प्रशांत के मामलों और अभिलेखों के साथ अभ्यास से।"
outcomes:
  - en: "Explain how genocides happen and are remembered"
    zh: "解释种族灭绝如何发生、如何被铭记"
    zh-TW: "解釋種族滅絕如何發生、如何被銘記"
    ja: "ジェノサイドの起こり方と記憶のされ方を説明する"
    ko: "집단학살이 일어나고 기억되는 방식 설명하기"
    vi: "Giải thích diệt chủng xảy ra và được tưởng nhớ ra sao"
    ms: "Terangkan cara genosid berlaku dan diingati"
    id: "Menjelaskan cara genosida terjadi dan dikenang"
    hi: "नरसंहार कैसे होते हैं और याद किए जाते हैं, समझाना"
  - en: "Analyse primary sources and archives"
    zh: "分析一手史料和档案"
    zh-TW: "分析一手史料和檔案"
    ja: "一次史料とアーカイブを分析する"
    ko: "1차 사료와 기록물 분석하기"
    vi: "Phân tích nguồn sử liệu gốc và tư liệu lưu trữ"
    ms: "Analisis sumber primer dan arkib"
    id: "Menganalisis sumber primer dan arsip"
    hi: "प्राथमिक स्रोतों और अभिलेखों का विश्लेषण करना"
  - en: "Compare cases from different regions"
    zh: "比较不同地区的案例"
    zh-TW: "比較不同地區的案例"
    ja: "地域ごとの事例を比べる"
    ko: "여러 지역의 사례 비교하기"
    vi: "So sánh các trường hợp ở nhiều khu vực"
    ms: "Bandingkan kes dari pelbagai rantau"
    id: "Membandingkan kasus dari berbagai wilayah"
    hi: "अलग-अलग क्षेत्रों के मामलों की तुलना करना"
