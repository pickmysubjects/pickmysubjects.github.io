code: MUSI30174
year: 2026
learn:
  en: "A large choir singing sacred and secular Western music from the 1600s on, ending in a public concert. Pass/fail."
  zh: "大型合唱团，演唱17世纪以来的宗教与世俗西方作品，期末公开演出。及格制。"
  zh-TW: "大型合唱團，演唱17世紀以來的宗教與世俗西方作品，期末公開演出。及格制。"
  ja: "17世紀以降の宗教・世俗合唱曲を歌う大合唱団。学期末に公演。合否判定。"
  ko: "17세기 이후 서양 종교·세속 합창곡을 부르는 대합창단. 학기말 공연. 합격/불합격."
  vi: "Dàn hợp xướng lớn hát nhạc phương Tây từ thế kỷ 17, diễn cuối kỳ. Đạt/không đạt."
  ms: "Koir besar menyanyikan muzik Barat sejak abad ke-17, konsert akhir. Lulus/gagal."
  id: "Paduan suara besar menyanyikan musik Barat sejak abad 17, konser akhir. Lulus/gagal."
  hi: "बड़ा कोरस, 1600 के बाद का धार्मिक व लौकिक पश्चिमी संगीत, अंत में कॉन्सर्ट। पास/फ़ेल।"
outcomes:
  - en: "Improve your choral singing technique"
    zh: "提升合唱演唱技巧"
    zh-TW: "提升合唱演唱技巧"
    ja: "合唱の歌唱技術を高める"
    ko: "합창 발성 기술 향상하기"
    vi: "Nâng cao kỹ thuật hát hợp xướng"
    ms: "Tingkatkan teknik nyanyian koir"
    id: "Meningkatkan teknik bernyanyi paduan suara"
    hi: "कोरस गायन तकनीक सुधारना"
  - en: "Sing texts in several languages"
    zh: "用多种语言演唱歌词"
    zh-TW: "用多種語言演唱歌詞"
    ja: "複数の言語で歌詞を歌う"
    ko: "여러 언어로 가사 부르기"
    vi: "Hát lời bằng nhiều ngôn ngữ"
    ms: "Nyanyikan lirik dalam beberapa bahasa"
    id: "Menyanyikan lirik dalam beberapa bahasa"
    hi: "कई भाषाओं में बोल गाना"
  - en: "Perform in a large public choral concert"
    zh: "参加大型公开合唱音乐会"
    zh-TW: "參加大型公開合唱音樂會"
    ja: "大規模な合唱演奏会で歌う"
    ko: "대규모 공개 합창 공연에 서기"
    vi: "Biểu diễn trong buổi hợp xướng lớn"
    ms: "Membuat persembahan konsert koir besar"
    id: "Tampil dalam konser paduan suara besar"
    hi: "बड़े सार्वजनिक कोरस कॉन्सर्ट में गाना"
