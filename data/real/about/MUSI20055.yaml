code: MUSI20055
year: 2026
learn:
  en: "Write a 15-minute folio of original music for soloists and small groups, and hear it played in concert."
  zh: "为独奏和小型组合写15分钟原创作品集，并在音乐会上演出。"
  zh-TW: "為獨奏和小型組合寫15分鐘原創作品集，並在音樂會上演出。"
  ja: "独奏や小編成向けに15分の作品集を作曲し、コンサートで演奏してもらう。"
  ko: "독주와 소규모 편성을 위한 15분 작품집을 작곡하고 공연에서 들어봄."
  vi: "Sáng tác tập 15 phút cho độc tấu và nhóm nhỏ, rồi nghe biểu diễn trong hòa nhạc."
  ms: "Gubah folio 15 minit untuk pemain solo dan kumpulan kecil, dipersembahkan dalam konsert."
  id: "Menggubah folio 15 menit untuk solo dan grup kecil, lalu dipentaskan dalam konser."
  hi: "एकल और छोटे समूहों के लिए 15 मिनट की रचनाएँ लिखना और कॉन्सर्ट में सुनना।"
outcomes:
  - en: "Develop your own way of composing"
    zh: "形成自己的作曲方法"
    zh-TW: "形成自己的作曲方法"
    ja: "自分なりの作曲方法を築く"
    ko: "나만의 작곡 방식 만들기"
    vi: "Xây dựng cách sáng tác riêng"
    ms: "Bina cara menggubah sendiri"
    id: "Membangun cara menggubah sendiri"
    hi: "अपनी रचना-शैली विकसित करना"
  - en: "Write clear notation for performers"
    zh: "为演奏者写清晰的乐谱"
    zh-TW: "為演奏者寫清晰的樂譜"
    ja: "演奏者に伝わる楽譜を書く"
    ko: "연주자를 위해 명확한 악보 쓰기"
    vi: "Viết ký âm rõ ràng cho người chơi"
    ms: "Tulis notasi jelas untuk pemain"
    id: "Menulis notasi jelas untuk pemain"
    hi: "कलाकारों के लिए साफ़ नोटेशन लिखना"
  - en: "Work with performers on your pieces"
    zh: "与演奏者合作呈现作品"
    zh-TW: "與演奏者合作呈現作品"
    ja: "演奏者と協力して作品を仕上げる"
    ko: "연주자와 함께 작품 완성하기"
    vi: "Làm việc với người chơi về tác phẩm"
    ms: "Bekerja dengan pemain atas karya anda"
    id: "Bekerja sama dengan pemain"
    hi: "अपनी रचनाओं पर कलाकारों के साथ काम"
