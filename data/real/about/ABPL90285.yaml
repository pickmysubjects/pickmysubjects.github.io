code: ABPL90285
year: 2027
learn:
  en: "Resolving medium-sized building designs by bringing together concept, space, program, context and technology."
  zh: "整合概念、空间、功能、环境和技术，深化中型建筑设计。"
  zh-TW: "整合概念、空間、機能、環境和技術，深化中型建築設計。"
  ja: "コンセプト・空間・プログラム・文脈・技術を統合し、中規模建築の設計をまとめる。"
  ko: "개념, 공간, 프로그램, 맥락, 기술을 통합해 중규모 건물 설계 완성."
  vi: "Hoàn thiện thiết kế công trình cỡ vừa, kết hợp ý tưởng, không gian, công năng, bối cảnh và công nghệ."
  ms: "Menyelesaikan reka bentuk bangunan sederhana dengan menggabungkan konsep, ruang, program, konteks dan teknologi."
  id: "Menyelesaikan desain bangunan menengah dengan memadukan konsep, ruang, program, konteks, dan teknologi."
  hi: "अवधारणा, स्थान, प्रोग्राम, संदर्भ और तकनीक को जोड़कर मध्यम आकार के भवनों का डिज़ाइन।"
outcomes:
  - en: "Develop and resolve designs for medium-sized buildings"
    zh: "构思并完成中型建筑设计"
    zh-TW: "構思並完成中型建築設計"
    ja: "中規模建築の設計を練り上げる"
    ko: "중규모 건물 설계 발전·완성하기"
    vi: "Phát triển và hoàn thiện thiết kế công trình cỡ vừa"
    ms: "Membangun dan menyelesaikan reka bentuk bangunan sederhana"
    id: "Mengembangkan dan menyelesaikan desain bangunan menengah"
    hi: "मध्यम आकार के भवनों का डिज़ाइन विकसित करना"
  - en: "Present your designs clearly and professionally"
    zh: "清晰专业地展示设计"
    zh-TW: "清晰專業地展示設計"
    ja: "設計を明快かつプロらしく発表する"
    ko: "설계를 명확하고 전문적으로 발표하기"
    vi: "Trình bày thiết kế rõ ràng, chuyên nghiệp"
    ms: "Membentangkan reka bentuk dengan jelas dan profesional"
    id: "Mempresentasikan desain secara jelas dan profesional"
    hi: "अपने डिज़ाइन स्पष्ट और पेशेवर ढंग से प्रस्तुत करना"
