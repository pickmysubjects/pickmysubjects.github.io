code: CHEN90018
year: 2027
learn:
  en: "Handling powders and slurries: particle size, milling, separation, hoppers, fluidisation and particle modelling."
  zh: "粉体与浆料处理：粒度、粉碎、分离、料仓、流态化和颗粒建模。"
  zh-TW: "粉體與漿料處理：粒徑、粉碎、分離、料倉、流體化與顆粒建模。"
  ja: "粉体とスラリーの扱い：粒子径、粉砕、分離、ホッパー、流動化、粒子モデル。"
  ko: "분체와 슬러리 처리: 입도, 분쇄, 분리, 호퍼, 유동화, 입자 모델링."
  vi: "Xử lý bột và huyền phù: cỡ hạt, nghiền, tách, phễu chứa, tầng sôi và mô hình hạt."
  ms: "Mengendalikan serbuk dan buburan: saiz zarah, pengisaran, pemisahan, corong, pembendaliran dan pemodelan zarah."
  id: "Menangani serbuk dan slurry: ukuran partikel, penggilingan, pemisahan, hopper, fluidisasi, dan pemodelan partikel."
  hi: "पाउडर और स्लरी: कण आकार, पिसाई, पृथक्करण, हॉपर, फ़्लुइडाइज़ेशन और कण मॉडलिंग।"
outcomes:
  - en: "Describe particles by size, shape and distribution"
    zh: "按粒度、形状和分布描述颗粒"
    zh-TW: "以粒徑、形狀與分布描述顆粒"
    ja: "粒子を大きさ・形・分布で表す"
    ko: "크기, 모양, 분포로 입자 설명하기"
    vi: "Mô tả hạt theo kích thước, hình dạng và phân bố"
    ms: "Menerangkan zarah mengikut saiz, bentuk dan taburan"
    id: "Menjelaskan partikel menurut ukuran, bentuk, dan sebaran"
    hi: "आकार, बनावट और वितरण से कणों का वर्णन"
  - en: "Design unit operations for powders and slurries"
    zh: "设计粉体和浆料的单元操作"
    zh-TW: "設計粉體與漿料的單元操作"
    ja: "粉体とスラリーの単位操作を設計する"
    ko: "분체와 슬러리 단위 조작 설계하기"
    vi: "Thiết kế các quá trình đơn vị cho bột và huyền phù"
    ms: "Mereka operasi unit untuk serbuk dan buburan"
    id: "Merancang operasi satuan untuk serbuk dan slurry"
    hi: "पाउडर और स्लरी के यूनिट ऑपरेशन डिज़ाइन करना"
  - en: "Use discrete element modelling of particle systems"
    zh: "用离散元方法模拟颗粒系统"
    zh-TW: "用離散元素法模擬顆粒系統"
    ja: "個別要素法で粒子系をモデル化する"
    ko: "이산요소법으로 입자계 모델링하기"
    vi: "Dùng mô hình phần tử rời rạc cho hệ hạt"
    ms: "Menggunakan pemodelan unsur diskret untuk sistem zarah"
    id: "Memakai pemodelan elemen diskrit untuk sistem partikel"
    hi: "कण प्रणालियों के लिए डिस्क्रीट एलिमेंट मॉडलिंग"
