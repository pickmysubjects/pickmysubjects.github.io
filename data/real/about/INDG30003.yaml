code: INDG30003
year: 2026
learn:
  en: "An intensive on Wurundjeri Country around Parkville, learning through on-Country visits and respectful, place-based relationships."
  zh: "围绕Parkville所在的Wurundjeri土地的密集课程，通过实地探访和尊重地方的关系来学习。"
  zh-TW: "圍繞Parkville所在的Wurundjeri土地的密集課程，透過實地探訪和尊重地方的關係來學習。"
  ja: "パークビル周辺のウルンジェリの土地についての集中科目。現地訪問と土地に根ざした敬意ある関係を通して学ぶ。"
  ko: "파크빌 주변 우룬제리 땅에 관한 집중 과목으로, 현장 방문과 존중하는 관계 맺기로 배운다."
  vi: "Môn học tập trung về vùng đất Wurundjeri quanh Parkville, học qua các chuyến thăm thực địa và mối quan hệ tôn trọng."
  ms: "Kursus intensif tentang tanah Wurundjeri sekitar Parkville, belajar melalui lawatan ke tanah dan hubungan berasaskan tempat yang hormat."
  id: "Kuliah intensif tentang tanah Wurundjeri di sekitar Parkville, belajar lewat kunjungan langsung dan hubungan yang menghormati tempat."
  hi: "पार्कविल के आसपास वुरुंडजेरी भूमि पर इंटेंसिव विषय, स्थल-भ्रमण और सम्मानजनक, स्थान-आधारित रिश्तों के ज़रिए।"
outcomes:
  - en: "Describe Wurundjeri Country and values"
    zh: "描述Wurundjeri的土地与价值观"
    zh-TW: "描述Wurundjeri的土地與價值觀"
    ja: "ウルンジェリの土地と価値観を説明する"
    ko: "우룬제리의 땅과 가치 설명하기"
    vi: "Mô tả vùng đất và giá trị của người Wurundjeri"
    ms: "Huraikan tanah dan nilai Wurundjeri"
    id: "Mendeskripsikan tanah dan nilai Wurundjeri"
    hi: "वुरुंडजेरी भूमि और मूल्यों का वर्णन करना"
  - en: "Reflect on learning gained on Country"
    zh: "反思在土地上获得的学习"
    zh-TW: "反思在土地上獲得的學習"
    ja: "土地での学びを振り返る"
    ko: "현장에서 얻은 배움 성찰하기"
    vi: "Suy ngẫm về những gì học được tại vùng đất"
    ms: "Renungkan pembelajaran di atas tanah"
    id: "Merefleksikan pembelajaran di atas Country"
    hi: "भूमि पर मिली सीख पर विचार करना"
  - en: "Build respectful ties with traditional owners"
    zh: "与传统土地所有者建立尊重的关系"
    zh-TW: "與傳統土地所有者建立尊重的關係"
    ja: "伝統的な土地所有者と敬意ある関係を築く"
    ko: "전통 소유자와 존중하는 관계 맺기"
    vi: "Xây dựng quan hệ tôn trọng với chủ đất truyền thống"
    ms: "Bina hubungan hormat dengan pemilik tradisional"
    id: "Membangun hubungan yang menghormati pemilik tradisional"
    hi: "पारंपरिक स्वामियों से सम्मानजनक संबंध बनाना"
