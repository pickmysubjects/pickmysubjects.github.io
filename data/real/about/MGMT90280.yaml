code: MGMT90280
year: 2027
learn:
  en: "Predictive and prescriptive analytics tools for business decisions in marketing, supply chain and strategy."
  zh: "用于营销、供应链和战略决策的预测性与规范性分析工具。"
  zh-TW: "用於行銷、供應鏈與策略決策的預測性與規範性分析工具。"
  ja: "マーケティング・SCM・戦略の意思決定に使う予測的・処方的分析の手法。"
  ko: "마케팅·공급망·전략 의사결정을 위한 예측·처방 분석 도구."
  vi: "Công cụ phân tích dự báo và đề xuất cho quyết định marketing, chuỗi cung ứng, chiến lược."
  ms: "Alat analitik ramalan dan preskriptif untuk keputusan pemasaran, rantaian bekalan dan strategi."
  id: "Alat analitik prediktif dan preskriptif untuk keputusan pemasaran, rantai pasok, dan strategi."
  hi: "मार्केटिंग, सप्लाई चेन और रणनीति के फ़ैसलों के लिए प्रेडिक्टिव और प्रिस्क्रिप्टिव एनालिटिक्स।"
outcomes:
  - en: "Frame a business problem as an analytics problem"
    zh: "将商业问题转化为分析问题"
    zh-TW: "將商業問題轉化為分析問題"
    ja: "業務課題を分析の問題に置き換える"
    ko: "비즈니스 문제를 분석 문제로 바꾸기"
    vi: "Chuyển bài toán kinh doanh thành bài toán phân tích"
    ms: "Merangka masalah perniagaan sebagai masalah analitik"
    id: "Merumuskan masalah bisnis sebagai masalah analitik"
    hi: "व्यावसायिक समस्या को एनालिटिक्स समस्या में बदलना"
  - en: "Know the limits of optimisation and data methods"
    zh: "了解优化和数据分析方法的局限"
    zh-TW: "了解最佳化與資料分析方法的侷限"
    ja: "最適化やデータ手法の限界を知る"
    ko: "최적화와 데이터 기법의 한계 알기"
    vi: "Hiểu giới hạn của tối ưu hóa và phương pháp dữ liệu"
    ms: "Memahami had pengoptimuman dan kaedah data"
    id: "Memahami batas optimasi dan metode data"
    hi: "ऑप्टिमाइज़ेशन और डेटा तरीक़ों की सीमाएँ जानना"
