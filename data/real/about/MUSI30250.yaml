code: MUSI30250
year: 2026
learn:
  en: "Weekly lessons and instrument or voice classes to refine technique and repertoire, ending in a 15-minute performance exam."
  zh: "每周个别课和乐器/声乐课，打磨技巧与曲目，最后进行15分钟演奏考核。"
  zh-TW: "每週個別課與樂器／聲樂課，打磨技巧與曲目，最後進行15分鐘演奏考核。"
  ja: "毎週の個人レッスンと楽器・声楽クラスで技術と曲目を磨き、最後に15分の実技試験。"
  ko: "주간 개인 레슨과 악기·성악 수업으로 기술과 레퍼토리를 다듬고 15분 실기 시험으로 마무리."
  vi: "Học cá nhân và lớp nhạc cụ/thanh nhạc hằng tuần để trau dồi kỹ thuật, kết thúc bằng bài thi diễn 15 phút."
  ms: "Kelas individu dan kelas alat muzik/vokal mingguan untuk memperhalus teknik, diakhiri ujian persembahan 15 minit."
  id: "Les privat dan kelas instrumen/vokal mingguan untuk mengasah teknik, diakhiri ujian pertunjukan 15 menit."
  hi: "साप्ताहिक निजी पाठ और वाद्य/गायन कक्षाएँ, तकनीक निखारना, अंत में 15 मिनट की प्रस्तुति परीक्षा।"
outcomes:
  - en: "Control technique with consistency"
    zh: "稳定地掌控演奏技巧"
    zh-TW: "穩定地掌控演奏技巧"
    ja: "安定して技術をコントロールする"
    ko: "기술을 일관되게 다루기"
    vi: "Kiểm soát kỹ thuật ổn định"
    ms: "Kawal teknik dengan konsisten"
    id: "Mengendalikan teknik secara konsisten"
    hi: "तकनीक पर लगातार नियंत्रण"
  - en: "Project an expressive, varied sound"
    zh: "奏出富有表现力、多变的声音"
    zh-TW: "奏出富有表現力、多變的聲音"
    ja: "表情豊かで多彩な音を出す"
    ko: "표현력 있고 다채로운 소리 내기"
    vi: "Tạo âm thanh biểu cảm, đa dạng"
    ms: "Hasilkan bunyi ekspresif dan pelbagai"
    id: "Menghasilkan suara ekspresif dan beragam"
    hi: "भावपूर्ण, विविध ध्वनि निकालना"
  - en: "Perform with confidence and professionalism"
    zh: "自信而专业地演出"
    zh-TW: "自信而專業地演出"
    ja: "自信を持ってプロらしく演奏する"
    ko: "자신감 있고 프로답게 연주하기"
    vi: "Biểu diễn tự tin, chuyên nghiệp"
    ms: "Membuat persembahan dengan yakin dan profesional"
    id: "Tampil percaya diri dan profesional"
    hi: "आत्मविश्वास और पेशेवर ढंग से प्रस्तुति"
