code: MUSI10223
year: 2026
learn:
  en: "How sound and music shape performance in theatre, opera, dance and film, and work with other design elements."
  zh: "声音与音乐如何塑造戏剧、歌剧、舞蹈和电影演出，并与其他设计元素配合。"
  zh-TW: "聲音與音樂如何塑造戲劇、歌劇、舞蹈和電影演出，並與其他設計元素配合。"
  ja: "音と音楽が演劇・オペラ・ダンス・映画の上演をどう形づくり、他の要素と組み合うか。"
  ko: "소리와 음악이 연극·오페라·무용·영화 공연을 어떻게 만들고 다른 디자인 요소와 어우러지는지."
  vi: "Âm thanh và âm nhạc định hình biểu diễn kịch, opera, múa, phim và kết hợp với yếu tố thiết kế khác ra sao."
  ms: "Cara bunyi dan muzik membentuk persembahan teater, opera, tarian dan filem bersama elemen reka bentuk lain."
  id: "Cara suara dan musik membentuk pertunjukan teater, opera, tari, dan film bersama elemen desain lain."
  hi: "थिएटर, ओपेरा, डांस और फ़िल्म में ध्वनि-संगीत प्रस्तुति को कैसे गढ़ते हैं, बाकी डिज़ाइन के साथ।"
outcomes:
  - en: "Explain how sound carries meaning on stage"
    zh: "说明声音如何在舞台上传达意义"
    zh-TW: "說明聲音如何在舞台上傳達意義"
    ja: "舞台で音が意味を伝える仕組みを説明する"
    ko: "무대에서 소리가 의미를 전하는 방식 설명하기"
    vi: "Giải thích âm thanh truyền tải ý nghĩa trên sân khấu"
    ms: "Jelaskan cara bunyi membawa makna di pentas"
    id: "Menjelaskan cara suara membawa makna di panggung"
    hi: "मंच पर ध्वनि अर्थ कैसे पहुँचाती है, समझाना"
  - en: "Relate sound to light, space and costume"
    zh: "把声音与灯光、空间和服装联系起来"
    zh-TW: "把聲音與燈光、空間和服裝連結起來"
    ja: "音を照明・空間・衣装と関連づける"
    ko: "소리를 조명·공간·의상과 연결하기"
    vi: "Liên hệ âm thanh với ánh sáng, không gian, trang phục"
    ms: "Kaitkan bunyi dengan cahaya, ruang dan kostum"
    id: "Mengaitkan suara dengan cahaya, ruang, dan kostum"
    hi: "ध्वनि को रोशनी, स्पेस और कॉस्ट्यूम से जोड़ना"
  - en: "Propose a sound idea for a performance"
    zh: "为一场演出提出声音构想"
    zh-TW: "為一場演出提出聲音構想"
    ja: "上演のための音の案を出す"
    ko: "공연을 위한 사운드 아이디어 제안하기"
    vi: "Đề xuất ý tưởng âm thanh cho một buổi diễn"
    ms: "Cadangkan idea bunyi untuk persembahan"
    id: "Mengusulkan ide suara untuk pertunjukan"
    hi: "किसी प्रस्तुति के लिए ध्वनि का विचार देना"
