code: ARTS30001
year: 2026
learn:
  en: "A hands-on project with a real organisation where you apply what you learnt in your Arts degree."
  zh: "和真实机构合作做项目，把文科学位里学到的东西用起来。"
  zh-TW: "和真實機構合作做專案，把文科學位裡學到的東西用起來。"
  ja: "実際の組織と取り組むプロジェクトで、文学部で学んだことを実践する。"
  ko: "실제 기관과 함께하는 프로젝트에서 인문학 학위로 배운 것을 적용한다."
  vi: "Dự án thực tế với một tổ chức thật, nơi bạn áp dụng những gì đã học trong ngành Arts."
  ms: "Projek praktikal bersama organisasi sebenar untuk menggunakan apa yang dipelajari dalam ijazah Sastera."
  id: "Proyek langsung bersama organisasi nyata untuk menerapkan apa yang dipelajari di gelar Arts."
  hi: "किसी असली संस्था के साथ व्यावहारिक प्रोजेक्ट, जिसमें आप आर्ट्स डिग्री में सीखी बातें लागू करते हैं।"
outcomes:
  - en: "Research a problem and write a clear report"
    zh: "调研一个问题并写出清楚的报告"
    zh-TW: "調研一個問題並寫出清楚的報告"
    ja: "課題を調べ、わかりやすい報告書を書く"
    ko: "문제를 조사하고 명확한 보고서 쓰기"
    vi: "Nghiên cứu một vấn đề và viết báo cáo rõ ràng"
    ms: "Kaji sesuatu masalah dan tulis laporan yang jelas"
    id: "Meneliti masalah dan menulis laporan yang jelas"
    hi: "किसी समस्या पर रिसर्च करके साफ़ रिपोर्ट लिखना"
  - en: "Understand how decisions get made at work"
    zh: "了解工作中决策是怎么做出的"
    zh-TW: "了解工作中決策是怎麼做出的"
    ja: "職場で意思決定がどう行われるか理解する"
    ko: "직장에서 결정이 어떻게 내려지는지 이해하기"
    vi: "Hiểu cách các quyết định được đưa ra ở nơi làm việc"
    ms: "Fahami cara keputusan dibuat di tempat kerja"
    id: "Memahami cara keputusan dibuat di tempat kerja"
    hi: "समझना कि काम पर फ़ैसले कैसे लिए जाते हैं"
  - en: "Present your findings to a real client"
    zh: "向真实客户汇报你的成果"
    zh-TW: "向真實客戶報告你的成果"
    ja: "成果を実際のクライアントに発表する"
    ko: "실제 고객에게 결과 발표하기"
    vi: "Trình bày kết quả cho khách hàng thật"
    ms: "Bentangkan dapatan kepada pelanggan sebenar"
    id: "Mempresentasikan temuan ke klien sungguhan"
    hi: "अपने नतीजे असली क्लाइंट के सामने पेश करना"
