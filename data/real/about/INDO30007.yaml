code: INDO30007
year: 2026
learn:
  en: "Current issues in Indonesia, from democracy to religion and history, read in real texts and discussed in more subtle Indonesian."
  zh: "用更细腻的印尼语阅读和讨论印尼时事，从民主、宗教到历史。"
  zh-TW: "用更細膩的印尼語閱讀和討論印尼時事，從民主、宗教到歷史。"
  ja: "民主主義・宗教・歴史などインドネシアの時事を、本物の文章で読み、より繊細なインドネシア語で議論する。"
  ko: "민주주의·종교·역사 등 인도네시아의 현안을 실제 글로 읽고 더 섬세한 인도네시아어로 토론한다."
  vi: "Các vấn đề thời sự Indonesia, từ dân chủ đến tôn giáo và lịch sử, đọc tư liệu thật và thảo luận tinh tế hơn."
  ms: "Isu semasa Indonesia, dari demokrasi hingga agama dan sejarah, dibaca dalam teks sebenar dan dibincang dengan lebih halus."
  id: "Isu terkini Indonesia, dari demokrasi hingga agama dan sejarah, dibaca dari teks asli dan dibahas dengan bahasa lebih halus."
  hi: "लोकतंत्र से धर्म और इतिहास तक इंडोनेशिया के मौजूदा मुद्दे, असली पाठों से, ज़्यादा बारीक इंडोनेशियाई में चर्चा।"
outcomes:
  - en: "Discuss social and cultural topics in Indonesian"
    zh: "用印尼语讨论社会和文化话题"
    zh-TW: "用印尼語討論社會和文化話題"
    ja: "社会や文化の話題をインドネシア語で話し合う"
    ko: "사회·문화 주제를 인도네시아어로 토론하기"
    vi: "Thảo luận chủ đề xã hội, văn hóa bằng tiếng Indonesia"
    ms: "Bincangkan topik sosial dan budaya dalam bahasa Indonesia"
    id: "Membahas topik sosial dan budaya dalam bahasa Indonesia"
    hi: "सामाजिक और सांस्कृतिक विषयों पर इंडोनेशियाई में चर्चा करना"
  - en: "Read and write longer Indonesian texts"
    zh: "读写较长的印尼语文章"
    zh-TW: "讀寫較長的印尼語文章"
    ja: "長めのインドネシア語の文章を読み書きする"
    ko: "긴 인도네시아어 글 읽고 쓰기"
    vi: "Đọc và viết văn bản tiếng Indonesia dài hơn"
    ms: "Baca dan tulis teks bahasa Indonesia yang lebih panjang"
    id: "Membaca dan menulis teks bahasa Indonesia yang lebih panjang"
    hi: "लंबे इंडोनेशियाई पाठ पढ़ना-लिखना"
  - en: "Give a clear presentation in Indonesian"
    zh: "用印尼语做清楚的口头报告"
    zh-TW: "用印尼語做清楚的口頭報告"
    ja: "インドネシア語で分かりやすく発表する"
    ko: "인도네시아어로 명확하게 발표하기"
    vi: "Thuyết trình rõ ràng bằng tiếng Indonesia"
    ms: "Buat pembentangan yang jelas dalam bahasa Indonesia"
    id: "Melakukan presentasi yang jelas dalam bahasa Indonesia"
    hi: "इंडोनेशियाई में स्पष्ट प्रस्तुति देना"
