code: FINA30027
year: 2026
learn:
  en: "A travelling art studio focused on land and place, with cultural safety training before you go and an exhibition piece after."
  zh: "以土地与地方为主题的旅行艺术工作室，出发前接受文化安全培训，之后完成展览作品。"
  zh-TW: "以土地與地方為主題的旅行藝術工作室，出發前接受文化安全訓練，之後完成展覽作品。"
  ja: "土地と場所をテーマにした旅するスタジオ。出発前に文化安全研修、後に展示作品。"
  ko: "땅과 장소를 주제로 한 여행 스튜디오. 출발 전 문화 안전 교육, 이후 전시 작품."
  vi: "Studio lưu động về đất và nơi chốn, có tập huấn an toàn văn hóa và tác phẩm triển lãm."
  ms: "Studio kembara bertema tanah dan tempat, dengan latihan keselamatan budaya dan karya pameran."
  id: "Studio keliling bertema tanah dan tempat, dengan pelatihan keamanan budaya dan karya pameran."
  hi: "ज़मीन और स्थान पर यात्रा स्टूडियो, जाने से पहले सांस्कृतिक सुरक्षा प्रशिक्षण, बाद में प्रदर्शनी।"
outcomes:
  - en: "Work respectfully on Country and with communities"
    zh: "尊重地在土地上与社区合作"
    zh-TW: "尊重地在土地上與社群合作"
    ja: "土地と地域社会に敬意を持って関わる"
    ko: "땅과 공동체를 존중하며 작업하기"
    vi: "Làm việc tôn trọng đất và cộng đồng"
    ms: "Bekerja dengan hormat di tanah dan komuniti"
    id: "Bekerja dengan hormat bersama komunitas"
    hi: "ज़मीन और समुदायों के साथ सम्मान से काम"
  - en: "Turn field research into art"
    zh: "把实地研究转化为作品"
    zh-TW: "把實地研究轉化為作品"
    ja: "現地調査を作品にする"
    ko: "현장 조사를 작품으로 만들기"
    vi: "Biến khảo sát thực địa thành tác phẩm"
    ms: "Jadikan kajian lapangan sebagai seni"
    id: "Mengubah riset lapangan jadi karya"
    hi: "फ़ील्ड शोध को कला में बदलना"
  - en: "Make a finished piece for exhibition"
    zh: "完成一件展览作品"
    zh-TW: "完成一件展覽作品"
    ja: "展示用の完成作品を作る"
    ko: "전시용 완성작 만들기"
    vi: "Hoàn thành tác phẩm triển lãm"
    ms: "Siapkan karya untuk pameran"
    id: "Menyelesaikan karya untuk pameran"
    hi: "प्रदर्शनी के लिए पूरा काम बनाना"
