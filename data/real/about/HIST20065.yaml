code: HIST20065
year: 2026
learn:
  en: "The modern history of rebellion over 200 years, told through famous rebels, their methods and their influence."
  zh: "两百多年来的近现代反叛史，通过著名反叛者、他们的手段和影响来讲述。"
  zh-TW: "兩百多年來的近現代反叛史，透過著名反叛者、他們的手段和影響來講述。"
  ja: "200年以上にわたる近現代の反乱の歴史を、有名な反逆者とその手法、影響を通して学ぶ。"
  ko: "200년 넘는 근현대 반란의 역사를 유명한 반란자들과 그들의 방법, 영향력을 통해 배운다."
  vi: "Lịch sử nổi dậy hiện đại hơn 200 năm, qua những nhà nổi dậy nổi tiếng, cách họ làm và ảnh hưởng của họ."
  ms: "Sejarah pemberontakan moden lebih 200 tahun, melalui pemberontak terkenal, kaedah dan pengaruh mereka."
  id: "Sejarah pemberontakan modern lebih dari 200 tahun, lewat para pemberontak terkenal, cara, dan pengaruh mereka."
  hi: "200 से ज़्यादा सालों का आधुनिक विद्रोह का इतिहास, मशहूर विद्रोहियों, उनके तरीकों और असर के ज़रिए।"
outcomes:
  - en: "Describe the history of modern rebellion"
    zh: "描述近现代反叛与革命的历史"
    zh-TW: "描述近現代反叛與革命的歷史"
    ja: "近現代の反乱と革命の歴史を説明する"
    ko: "근현대 반란과 혁명의 역사 설명하기"
    vi: "Mô tả lịch sử nổi dậy và cách mạng hiện đại"
    ms: "Huraikan sejarah pemberontakan moden"
    id: "Menguraikan sejarah pemberontakan modern"
    hi: "आधुनिक विद्रोह और क्रांति के इतिहास का वर्णन करना"
  - en: "Analyse how protest methods changed over time"
    zh: "分析抗争手段如何随时间变化"
    zh-TW: "分析抗爭手段如何隨時間變化"
    ja: "抗議の手法が時代とともにどう変わったか分析する"
    ko: "저항 방식이 시간에 따라 어떻게 변했는지 분석하기"
    vi: "Phân tích cách các phương thức phản kháng thay đổi theo thời gian"
    ms: "Analisis perubahan kaedah bantahan dari masa ke masa"
    id: "Menganalisis perubahan cara protes dari waktu ke waktu"
    hi: "विरोध के तरीके समय के साथ कैसे बदले, विश्लेषण करना"
  - en: "Research one aspect of political rebellion"
    zh: "研究政治反叛的某个方面"
    zh-TW: "研究政治反叛的某個面向"
    ja: "政治的反乱の一側面を調べる"
    ko: "정치적 반란의 한 측면 연구하기"
    vi: "Nghiên cứu một khía cạnh của nổi dậy chính trị"
    ms: "Kaji satu aspek pemberontakan politik"
    id: "Meneliti satu aspek pemberontakan politik"
    hi: "राजनीतिक विद्रोह के किसी एक पहलू पर शोध करना"
