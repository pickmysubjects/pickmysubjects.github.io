code: FOOD20006
year: 2026
learn:
  en: "Microbes in food: spoilage, food poisoning, fermentation, growth modelling and food safety risk."
  zh: "食品中的微生物：腐败、食物中毒、发酵、生长模型与食品安全风险。"
  zh-TW: "食品中的微生物：腐敗、食物中毒、發酵、生長模型與食品安全風險。"
  ja: "食品の微生物：腐敗、食中毒、発酵、増殖モデル、食品安全リスク。"
  ko: "식품 속 미생물: 부패, 식중독, 발효, 증식 모델, 식품 안전 위험."
  vi: "Vi sinh vật trong thực phẩm: hư hỏng, ngộ độc, lên men, mô hình tăng trưởng, an toàn thực phẩm."
  ms: "Mikrob dalam makanan: kerosakan, keracunan makanan, penapaian, model pertumbuhan, keselamatan makanan."
  id: "Mikroba dalam pangan: pembusukan, keracunan, fermentasi, pemodelan pertumbuhan, risiko keamanan pangan."
  hi: "भोजन में सूक्ष्मजीव: खराबी, फ़ूड पॉइज़निंग, किण्वन, वृद्धि मॉडल और खाद्य सुरक्षा।"
outcomes:
  - en: "Identify microbes with a light microscope"
    zh: "用光学显微镜鉴定微生物"
    zh-TW: "用光學顯微鏡鑑定微生物"
    ja: "光学顕微鏡で微生物を同定する"
    ko: "광학 현미경으로 미생물 식별하기"
    vi: "Nhận dạng vi sinh vật bằng kính hiển vi"
    ms: "Kenal pasti mikrob dengan mikroskop cahaya"
    id: "Mengidentifikasi mikroba dengan mikroskop cahaya"
    hi: "माइक्रोस्कोप से सूक्ष्मजीव पहचानना"
  - en: "Handle and count microbes in food samples"
    zh: "处理食品样本并计数微生物"
    zh-TW: "處理食品樣本並計數微生物"
    ja: "食品試料の微生物を扱い数える"
    ko: "식품 시료의 미생물 다루고 세기"
    vi: "Xử lý và đếm vi sinh vật trong mẫu thực phẩm"
    ms: "Kendali dan kira mikrob dalam sampel makanan"
    id: "Menangani dan menghitung mikroba di sampel pangan"
    hi: "खाद्य नमूनों में सूक्ष्मजीव संभालना और गिनना"
