code: ENGR90028
year: 2027
learn:
  en: "An overview of the world energy system: its history, resources, costs, emissions and options for cutting greenhouse gases."
  zh: "全球能源系统概览：历史、资源、成本、排放以及减少温室气体的途径。"
  zh-TW: "全球能源系統概覽：歷史、資源、成本、排放以及減少溫室氣體的途徑。"
  ja: "世界のエネルギーシステムの全体像：歴史・資源・コスト・排出・温室効果ガス削減策。"
  ko: "세계 에너지 시스템 개관: 역사, 자원, 비용, 배출, 온실가스 감축 방안."
  vi: "Tổng quan hệ thống năng lượng thế giới: lịch sử, tài nguyên, chi phí, phát thải và cách giảm khí nhà kính."
  ms: "Gambaran sistem tenaga dunia: sejarah, sumber, kos, pelepasan dan cara mengurangkan gas rumah hijau."
  id: "Gambaran sistem energi dunia: sejarah, sumber daya, biaya, emisi, dan cara mengurangi gas rumah kaca."
  hi: "विश्व ऊर्जा प्रणाली का परिचय: इतिहास, संसाधन, लागत, उत्सर्जन और ग्रीनहाउस गैस घटाने के विकल्प।"
outcomes:
  - en: "Explain how today's energy system came about"
    zh: "解释当今能源系统的形成过程"
    zh-TW: "解釋當今能源系統的形成過程"
    ja: "今のエネルギーシステムがどう形づくられたか説明する"
    ko: "오늘날 에너지 시스템이 어떻게 형성됐는지 설명하기"
    vi: "Giải thích hệ thống năng lượng ngày nay hình thành thế nào"
    ms: "Menerangkan bagaimana sistem tenaga hari ini terbentuk"
    id: "Menjelaskan bagaimana sistem energi saat ini terbentuk"
    hi: "आज की ऊर्जा प्रणाली कैसे बनी, समझाना"
  - en: "Weigh the costs and benefits of different energy technologies"
    zh: "权衡不同能源技术的成本与收益"
    zh-TW: "權衡不同能源技術的成本與效益"
    ja: "さまざまなエネルギー技術の費用と便益を比べる"
    ko: "여러 에너지 기술의 비용과 편익 따져보기"
    vi: "Cân nhắc chi phí và lợi ích của các công nghệ năng lượng"
    ms: "Menimbang kos dan faedah pelbagai teknologi tenaga"
    id: "Menimbang biaya dan manfaat berbagai teknologi energi"
    hi: "अलग-अलग ऊर्जा तकनीकों की लागत और लाभ तौलना"
