code: MGMT90140
year: 2027
learn:
  en: "Hands-on practice of core manager skills: communication, decisions, motivating teams, conflict and change."
  zh: "动手练习核心管理技能：沟通、决策、激励团队、处理冲突和变革。"
  zh-TW: "實作練習核心管理技能：溝通、決策、激勵團隊、處理衝突與變革。"
  ja: "管理者の基本スキルを実践で鍛える：コミュニケーション、意思決定、動機づけ、対立と変化。"
  ko: "관리자 핵심 역량 실습: 소통, 의사결정, 팀 동기부여, 갈등과 변화 대응."
  vi: "Thực hành kỹ năng quản lý cốt lõi: giao tiếp, ra quyết định, tạo động lực nhóm, xung đột và thay đổi."
  ms: "Latihan praktikal kemahiran pengurus: komunikasi, keputusan, memotivasi pasukan, konflik dan perubahan."
  id: "Praktik langsung keterampilan manajer: komunikasi, keputusan, memotivasi tim, konflik dan perubahan."
  hi: "प्रबंधक के मुख्य कौशलों का अभ्यास: संवाद, निर्णय, टीम को प्रेरित करना, टकराव और बदलाव।"
outcomes:
  - en: "Assess and build your own manager skills"
    zh: "评估并提升自己的管理能力"
    zh-TW: "評估並提升自己的管理職能"
    ja: "自分の管理スキルを評価し伸ばす"
    ko: "자신의 관리 역량 평가·개발하기"
    vi: "Đánh giá và phát triển kỹ năng quản lý của bạn"
    ms: "Menilai dan membina kemahiran pengurusan sendiri"
    id: "Menilai dan membangun keterampilan manajerial sendiri"
    hi: "अपने प्रबंधन कौशल आँकना और बढ़ाना"
  - en: "Solve common manager challenges"
    zh: "解决常见的管理难题"
    zh-TW: "解決常見的管理難題"
    ja: "よくある管理上の課題を解決する"
    ko: "흔한 관리 과제 해결하기"
    vi: "Giải quyết thách thức quản lý thường gặp"
    ms: "Menyelesaikan cabaran pengurusan biasa"
    id: "Menyelesaikan tantangan manajerial umum"
    hi: "आम प्रबंधन चुनौतियाँ सुलझाना"
