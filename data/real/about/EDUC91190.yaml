code: EDUC91190
year: 2027
learn:
  en: "Theory and practice of teaching science in Years 7 to 8 under the Victorian Curriculum."
  zh: "按维州课程学习7至8年级科学教学的理论与实践。"
  zh-TW: "依維州課程學習7至8年級科學教學的理論與實務。"
  ja: "ビクトリア州カリキュラムに沿った7〜8年生の理科指導の理論と実践。"
  ko: "빅토리아 교육과정에 따른 7~8학년 과학 교수의 이론과 실제."
  vi: "Lý thuyết và thực hành dạy khoa học lớp 7–8 theo chương trình Victoria."
  ms: "Teori dan amalan mengajar sains Tahun 7 hingga 8 mengikut Kurikulum Victoria."
  id: "Teori dan praktik mengajar sains kelas 7–8 sesuai Kurikulum Victoria."
  hi: "विक्टोरियाई पाठ्यक्रम के तहत कक्षा 7–8 में विज्ञान पढ़ाने का सिद्धांत और अभ्यास।"
outcomes:
  - en: "Teach key science concepts for Years 7 to 8"
    zh: "讲授7至8年级的核心科学概念"
    zh-TW: "講授7至8年級的核心科學概念"
    ja: "7〜8年生の主要な理科概念を教える"
    ko: "7~8학년 핵심 과학 개념 가르치기"
    vi: "Dạy các khái niệm khoa học cốt lõi lớp 7–8"
    ms: "Mengajar konsep sains utama Tahun 7 hingga 8"
    id: "Mengajarkan konsep sains utama kelas 7–8"
    hi: "कक्षा 7–8 की मुख्य विज्ञान अवधारणाएँ पढ़ाना"
  - en: "Plan and sequence science lessons with assessment"
    zh: "规划并编排带评估的科学课"
    zh-TW: "規劃並編排含評量的科學課"
    ja: "評価を含む理科の授業を計画・構成する"
    ko: "평가를 포함한 과학 수업 계획·구성하기"
    vi: "Lên kế hoạch và sắp xếp bài học khoa học có đánh giá"
    ms: "Merancang dan menyusun pelajaran sains bersama pentaksiran"
    id: "Merencanakan dan mengurutkan pelajaran sains beserta penilaian"
    hi: "मूल्यांकन सहित विज्ञान पाठों की योजना बनाना"
  - en: "Choose strategies and ICT for diverse students"
    zh: "为不同背景的学生选择教学策略和ICT"
    zh-TW: "為不同背景的學生選擇教學策略和ICT"
    ja: "多様な生徒に合う教え方とICTを選ぶ"
    ko: "다양한 학생에 맞는 전략과 ICT 선택하기"
    vi: "Chọn phương pháp và ICT cho học sinh đa dạng"
    ms: "Memilih strategi dan ICT untuk pelajar pelbagai latar"
    id: "Memilih strategi dan TIK untuk siswa beragam"
    hi: "विविध छात्रों के लिए रणनीति और ICT चुनना"
