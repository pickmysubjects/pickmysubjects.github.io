code: ELEN90097
year: 2027
learn:
  en: "Modelling and simulating dynamical systems for AI, with probability, Python (numpy, scipy) and team projects such as smart grids."
  zh: "为人工智能建模和仿真动态系统，涉及概率、Python 和智能电网等团队项目。"
  zh-TW: "為人工智慧建模和模擬動態系統，涉及機率、Python 和智慧電網等團隊專題。"
  ja: "AI のための動的システムのモデル化とシミュレーション。確率、Python（numpy、scipy）、スマートグリッドなどのチームプロジェクト。"
  ko: "AI를 위한 동적 시스템 모델링과 시뮬레이션. 확률, Python(numpy, scipy), 스마트 그리드 같은 팀 프로젝트."
  vi: "Mô hình hóa và mô phỏng hệ động lực cho AI, gồm xác suất, Python (numpy, scipy) và dự án nhóm như lưới điện thông minh."
  ms: "Memodel dan mensimulasi sistem dinamik untuk AI, dengan kebarangkalian, Python (numpy, scipy) dan projek pasukan seperti grid pintar."
  id: "Memodelkan dan menyimulasikan sistem dinamis untuk AI, dengan probabilitas, Python (numpy, scipy), dan proyek tim seperti smart grid."
  hi: "AI के लिए डायनेमिकल सिस्टम की मॉडलिंग और सिमुलेशन, प्रायिकता, Python (numpy, scipy) और स्मार्ट ग्रिड जैसे टीम प्रोजेक्ट के साथ।"
outcomes:
  - en: "Use software tools to simulate dynamical systems"
    zh: "用软件工具仿真动态系统"
    zh-TW: "用軟體工具模擬動態系統"
    ja: "ソフトウェアで動的システムをシミュレーションする"
    ko: "소프트웨어로 동적 시스템 시뮬레이션하기"
    vi: "Dùng phần mềm để mô phỏng hệ động lực"
    ms: "Mensimulasi sistem dinamik dengan perisian"
    id: "Menyimulasikan sistem dinamis dengan perangkat lunak"
    hi: "सॉफ़्टवेयर से डायनेमिकल सिस्टम का सिमुलेशन"
  - en: "Apply probability, Bayes' rule and entropy to engineering problems"
    zh: "用概率、贝叶斯法则和熵解决工程问题"
    zh-TW: "用機率、貝氏定理和熵解決工程問題"
    ja: "確率、ベイズの定理、エントロピーを工学の問題に使う"
    ko: "확률, 베이즈 정리, 엔트로피를 공학 문제에 적용하기"
    vi: "Áp dụng xác suất, định lý Bayes và entropy vào bài toán kỹ thuật"
    ms: "Menggunakan kebarangkalian, peraturan Bayes dan entropi untuk masalah kejuruteraan"
    id: "Menerapkan probabilitas, aturan Bayes, dan entropi pada soal teknik"
    hi: "इंजीनियरिंग समस्याओं में प्रायिकता, बेज़ नियम और एंट्रॉपी लागू करना"
  - en: "Write programs and algorithms to solve real problems"
    zh: "编写程序和算法解决实际问题"
    zh-TW: "撰寫程式和演算法解決實際問題"
    ja: "プログラムとアルゴリズムで実際の問題を解く"
    ko: "프로그램과 알고리즘으로 실제 문제 해결하기"
    vi: "Viết chương trình và thuật toán giải bài toán thực tế"
    ms: "Menulis program dan algoritma untuk masalah sebenar"
    id: "Menulis program dan algoritma untuk masalah nyata"
    hi: "असल समस्याएँ हल करने के लिए प्रोग्राम और एल्गोरिदम लिखना"
