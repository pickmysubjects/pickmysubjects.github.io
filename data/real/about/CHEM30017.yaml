code: CHEM30017
year: 2026
learn:
  en: "Pick three specialised chemistry modules, such as polymers, metal chemistry or identifying molecules by spectra."
  zh: "从高分子、金属化学、光谱鉴定等专题里选三个模块学。"
  zh-TW: "從高分子、金屬化學、光譜鑑定等專題裡選三個模組學。"
  ja: "高分子、金属化学、スペクトルによる分子同定などから専門モジュールを3つ選ぶ。"
  ko: "고분자, 금속화학, 스펙트럼 분자 식별 등 전문 화학 모듈 3개 선택."
  vi: "Chọn ba học phần hóa chuyên sâu, như polyme, hóa kim loại hay nhận diện phân tử qua phổ."
  ms: "Pilih tiga modul kimia khusus, seperti polimer, kimia logam atau mengenal molekul melalui spektrum."
  id: "Pilih tiga modul kimia khusus, seperti polimer, kimia logam, atau identifikasi molekul lewat spektrum."
  hi: "तीन स्पेशलाइज़्ड केमिस्ट्री मॉड्यूल चुनें, जैसे पॉलिमर, धातु केमिस्ट्री या स्पेक्ट्रा से अणु पहचान।"
outcomes:
  - en: "Solve problems in applied chemistry"
    zh: "解决应用化学问题"
    zh-TW: "解決應用化學問題"
    ja: "応用化学の問題を解く"
    ko: "응용화학 문제 해결하기"
    vi: "Giải quyết bài toán hóa ứng dụng"
    ms: "Selesaikan masalah kimia gunaan"
    id: "Memecahkan masalah kimia terapan"
    hi: "एप्लाइड केमिस्ट्री की समस्याएँ हल करना"
  - en: "Prepare for honours or masters chemistry study"
    zh: "为荣誉或硕士课程打基础"
    zh-TW: "為榮譽學位或碩士課程打基礎"
    ja: "化学の優等学位や修士課程に備える"
    ko: "화학 아너스나 석사 과정 준비하기"
    vi: "Chuẩn bị cho học honours hoặc thạc sĩ hóa"
    ms: "Bersedia untuk pengajian kimia honours atau sarjana"
    id: "Bersiap untuk studi kimia honours atau magister"
    hi: "केमिस्ट्री ऑनर्स या मास्टर्स की तैयारी"
