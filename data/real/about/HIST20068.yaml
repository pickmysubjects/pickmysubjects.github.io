code: HIST20068
year: 2026
learn:
  en: "The French Revolution from its origins to 1795, why it turned violent, and what it meant for minorities, women and slaves."
  zh: "法国大革命从起源到1795年，它为何走向暴力，对少数族群、女性和奴隶意味着什么。"
  zh-TW: "法國大革命從起源到1795年，它為何走向暴力，對少數族群、女性和奴隸意味著什麼。"
  ja: "起源から1795年までのフランス革命、なぜ暴力化したのか、少数派・女性・奴隷にとって何を意味したかを学ぶ。"
  ko: "기원부터 1795년까지의 프랑스 혁명, 왜 폭력으로 치달았는지, 소수자·여성·노예에게 어떤 의미였는지 배운다."
  vi: "Cách mạng Pháp từ khởi nguồn đến 1795, vì sao trở nên bạo lực và ý nghĩa với thiểu số, phụ nữ, nô lệ."
  ms: "Revolusi Perancis dari asalnya hingga 1795, sebab ia menjadi ganas, dan maknanya bagi minoriti, wanita dan hamba."
  id: "Revolusi Prancis dari awal hingga 1795, mengapa menjadi keras, dan artinya bagi minoritas, perempuan, dan budak."
  hi: "फ़्रांसीसी क्रांति, शुरुआत से 1795 तक, यह हिंसक क्यों हुई और अल्पसंख्यकों, महिलाओं व गुलामों के लिए इसका क्या मतलब था।"
outcomes:
  - en: "Explain the origins and nature of the Revolution"
    zh: "说明大革命的起源和性质"
    zh-TW: "說明大革命的起源和性質"
    ja: "革命の起源と性格を説明する"
    ko: "혁명의 기원과 성격 설명하기"
    vi: "Giải thích nguồn gốc và bản chất của cuộc Cách mạng"
    ms: "Terangkan asal usul dan sifat Revolusi"
    id: "Menjelaskan asal usul dan sifat Revolusi"
    hi: "क्रांति की उत्पत्ति और स्वरूप समझाना"
  - en: "Assess why the Revolution grew more violent"
    zh: "评估大革命为何越来越暴力"
    zh-TW: "評估大革命為何越來越暴力"
    ja: "革命が暴力化していった理由を評価する"
    ko: "혁명이 점점 폭력적으로 변한 이유 평가하기"
    vi: "Đánh giá vì sao cuộc Cách mạng ngày càng bạo lực"
    ms: "Nilai sebab Revolusi menjadi semakin ganas"
    id: "Menilai mengapa Revolusi makin keras"
    hi: "क्रांति ज़्यादा हिंसक क्यों होती गई, आकलन करना"
  - en: "Judge its international significance"
    zh: "判断它的国际意义"
    zh-TW: "判斷它的國際意義"
    ja: "その国際的な意義を判断する"
    ko: "그 국제적 의미 판단하기"
    vi: "Nhận định ý nghĩa quốc tế của nó"
    ms: "Nilai kepentingannya di peringkat antarabangsa"
    id: "Menilai arti pentingnya secara internasional"
    hi: "इसके अंतरराष्ट्रीय महत्व का आकलन करना"
