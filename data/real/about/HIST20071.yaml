code: HIST20071
year: 2026
learn:
  en: "US history since 1945 through its social movements, from civil rights to Black Lives Matter, and the presidents in between."
  zh: "1945年以来的美国史，从民权运动到“黑命攸关”的社会运动，以及其间的历任总统。"
  zh-TW: "1945年以來的美國史，從民權運動到「黑人的命也是命」的社會運動，以及其間的歷任總統。"
  ja: "公民権運動からブラック・ライヴズ・マターまでの社会運動と歴代大統領を通して、1945年以降のアメリカ史を学ぶ。"
  ko: "민권 운동부터 블랙 라이브스 매터까지의 사회 운동과 역대 대통령을 통해 1945년 이후 미국사를 배운다."
  vi: "Lịch sử Mỹ từ 1945 qua các phong trào xã hội, từ dân quyền đến Black Lives Matter, và các đời tổng thống."
  ms: "Sejarah AS sejak 1945 melalui gerakan sosialnya, daripada hak sivil hingga Black Lives Matter, serta para presiden."
  id: "Sejarah AS sejak 1945 lewat gerakan sosialnya, dari hak sipil hingga Black Lives Matter, serta para presidennya."
  hi: "1945 के बाद का अमेरिकी इतिहास, नागरिक अधिकार से ब्लैक लाइव्स मैटर तक के आंदोलनों और बीच के राष्ट्रपतियों के ज़रिए।"
outcomes:
  - en: "Compare key people and events in US history since 1945"
    zh: "比较1945年以来美国史的关键人物和事件"
    zh-TW: "比較1945年以來美國史的關鍵人物和事件"
    ja: "1945年以降のアメリカ史の主要人物と出来事を比べる"
    ko: "1945년 이후 미국사의 주요 인물과 사건 비교하기"
    vi: "So sánh nhân vật và sự kiện chính của lịch sử Mỹ từ 1945"
    ms: "Bandingkan tokoh dan peristiwa utama sejarah AS sejak 1945"
    id: "Membandingkan tokoh dan peristiwa utama sejarah AS sejak 1945"
    hi: "1945 के बाद के अमेरिकी इतिहास के मुख्य लोगों और घटनाओं की तुलना करना"
  - en: "Engage with major debates among historians"
    zh: "参与历史学界的主要争论"
    zh-TW: "參與歷史學界的主要爭論"
    ja: "歴史家の主な論争に取り組む"
    ko: "역사가들의 주요 논쟁 다루기"
    vi: "Tham gia các tranh luận lớn giữa các sử gia"
    ms: "Libatkan diri dalam perdebatan utama ahli sejarah"
    id: "Terlibat dalam perdebatan utama para sejarawan"
    hi: "इतिहासकारों की बड़ी बहसों से जुड़ना"
  - en: "Use sources to evaluate historical arguments"
    zh: "用史料评估历史论点"
    zh-TW: "用史料評估歷史論點"
    ja: "史料を使って歴史的な議論を評価する"
    ko: "사료로 역사적 논증 평가하기"
    vi: "Dùng nguồn sử liệu để đánh giá lập luận lịch sử"
    ms: "Guna sumber untuk menilai hujah sejarah"
    id: "Memakai sumber untuk menilai argumen sejarah"
    hi: "स्रोतों से ऐतिहासिक तर्कों को परखना"
