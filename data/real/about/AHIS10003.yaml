code: AHIS10003
year: 2026
learn:
  en: "Art history through one great artwork per lecture, from altarpieces to photos, as a window onto times, places and peoples."
  zh: "每讲聚焦一件重要艺术品，从祭坛画到摄影，借此了解不同时代、地域和人群。"
  zh-TW: "每講聚焦一件重要藝術品，從祭壇畫到攝影，藉此了解不同時代、地域和人群。"
  ja: "祭壇画から写真まで、毎回一つの名作を通して時代・場所・人々を見る美術史。"
  ko: "제단화부터 사진까지 매 강의 한 작품으로 시대·장소·사람을 들여다보는 미술사."
  vi: "Lịch sử nghệ thuật qua mỗi bài giảng một tác phẩm lớn, từ tranh thờ đến ảnh, như cửa sổ nhìn vào các thời đại, vùng đất và con người."
  ms: "Sejarah seni melalui satu karya hebat setiap kuliah, dari lukisan altar hingga foto, sebagai tingkap ke zaman, tempat dan masyarakat."
  id: "Sejarah seni lewat satu karya besar tiap kuliah, dari lukisan altar sampai foto, sebagai jendela ke zaman, tempat dan masyarakat."
  hi: "हर लेक्चर में एक महान कलाकृति के ज़रिए कला इतिहास, वेदी-चित्रों से तस्वीरों तक, अलग युगों, जगहों और लोगों की झलक के रूप में।"
outcomes:
  - en: "Describe artworks across many media and periods"
    zh: "描述不同媒介和时期的艺术品"
    zh-TW: "描述不同媒介和時期的藝術品"
    ja: "様々な媒体と時代の作品を説明する"
    ko: "여러 매체와 시대의 작품 설명하기"
    vi: "Mô tả tác phẩm thuộc nhiều chất liệu và thời kỳ"
    ms: "Huraikan karya seni merentas media dan zaman"
    id: "Menguraikan karya seni lintas media dan zaman"
    hi: "कई माध्यमों और कालों की कलाकृतियों का वर्णन करना"
  - en: "Link artworks to their historical context"
    zh: "把艺术品与其历史背景联系起来"
    zh-TW: "把藝術品與其歷史背景聯繫起來"
    ja: "作品を歴史的背景と結びつける"
    ko: "작품을 역사적 맥락과 연결하기"
    vi: "Liên hệ tác phẩm với bối cảnh lịch sử"
    ms: "Kaitkan karya seni dengan konteks sejarah"
    id: "Mengaitkan karya seni dengan konteks sejarahnya"
    hi: "कलाकृतियों को उनके ऐतिहासिक संदर्भ से जोड़ना"
  - en: "Write a clear visual analysis"
    zh: "写出清晰的视觉分析"
    zh-TW: "寫出清晰的視覺分析"
    ja: "明快な作品分析を書く"
    ko: "명확한 시각 분석 쓰기"
    vi: "Viết bài phân tích thị giác rõ ràng"
    ms: "Tulis analisis visual yang jelas"
    id: "Menulis analisis visual yang jelas"
    hi: "साफ़ दृश्य विश्लेषण लिखना"
