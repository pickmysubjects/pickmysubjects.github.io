code: EVSC90022
year: 2027
learn:
  en: "How land use planning in Victoria can reduce the risk to settlements in bushfire-prone areas."
  zh: "维州的土地利用规划如何降低山火易发地区聚落的风险。"
  zh-TW: "維州的土地利用規劃如何降低山火易發地區聚落的風險。"
  ja: "ビクトリア州の土地利用計画で、山火事の起きやすい地域の居住地リスクを下げる方法。"
  ko: "빅토리아주 토지이용계획으로 산불 위험 지역 정주지의 위험을 줄이는 법."
  vi: "Quy hoạch sử dụng đất ở Victoria giảm rủi ro cho khu dân cư ở vùng dễ cháy rừng."
  ms: "Cara perancangan guna tanah di Victoria mengurangkan risiko kebakaran semak pada penempatan."
  id: "Cara perencanaan tata guna lahan di Victoria mengurangi risiko kebakaran hutan bagi permukiman."
  hi: "विक्टोरिया में भूमि-उपयोग योजना से बुशफ़ायर-प्रवण क्षेत्रों में बस्तियों का जोखिम घटाना।"
outcomes:
  - en: "Explain how bushfire and settlements interact"
    zh: "解释山火与聚落的相互作用"
    zh-TW: "解釋山火與聚落的相互作用"
    ja: "山火事と居住地の関係を説明する"
    ko: "산불과 정주지의 상호작용 설명하기"
    vi: "Giải thích tương tác giữa cháy rừng và khu dân cư"
    ms: "Menerangkan interaksi kebakaran semak dan penempatan"
    id: "Menjelaskan interaksi kebakaran hutan dan permukiman"
    hi: "बुशफ़ायर और बस्तियों का संबंध समझाना"
  - en: "Use Victorian planning tools to cut risk"
    zh: "用维州规划工具降低风险"
    zh-TW: "用維州規劃工具降低風險"
    ja: "州の計画制度でリスクを下げる"
    ko: "빅토리아 계획 제도로 위험 줄이기"
    vi: "Dùng công cụ quy hoạch Victoria để giảm rủi ro"
    ms: "Menggunakan sistem perancangan Victoria"
    id: "Memakai sistem perencanaan Victoria"
    hi: "विक्टोरियन योजना प्रणाली से जोखिम घटाना"
