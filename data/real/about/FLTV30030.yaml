code: FLTV30030
year: 2026
learn:
  en: "The capstone: rewrite your major script into a second draft and pitch it to a professional standard."
  zh: "毕业项目：把主要剧本改成第二稿，并做专业水准的推介。"
  zh-TW: "畢業專案：把主要劇本改成第二稿，並做專業水準的提案。"
  ja: "卒業制作：主要脚本を第2稿に改稿し、プロ水準でピッチする。"
  ko: "캡스톤: 주요 각본을 2고로 고쳐 쓰고 전문가 수준으로 피칭한다."
  vi: "Đồ án cuối: viết lại kịch bản chính thành bản nháp hai và pitch chuyên nghiệp."
  ms: "Projek akhir: tulis semula skrip utama ke draf kedua dan bentang secara profesional."
  id: "Proyek akhir: menulis ulang naskah utama ke draf kedua dan pitch profesional."
  hi: "कैपस्टोन: मुख्य स्क्रिप्ट को दूसरे ड्राफ़्ट में दोबारा लिखना और पेशेवर पिच करना।"
outcomes:
  - en: "Rewrite a script into a second draft"
    zh: "把剧本改写成第二稿"
    zh-TW: "把劇本改寫成第二稿"
    ja: "脚本を第2稿に書き直す"
    ko: "대본을 2고로 고쳐 쓰기"
    vi: "Viết lại kịch bản thành bản nháp hai"
    ms: "Tulis semula skrip ke draf kedua"
    id: "Menulis ulang naskah ke draf kedua"
    hi: "स्क्रिप्ट को दूसरे ड्राफ़्ट में लिखना"
  - en: "Write a synopsis, bio and sell sheet"
    zh: "写梗概、个人简介和推介单"
    zh-TW: "寫梗概、個人簡介和提案單"
    ja: "あらすじ・経歴・セールスシートを書く"
    ko: "시놉시스·약력·셀 시트 쓰기"
    vi: "Viết tóm tắt, tiểu sử và tờ giới thiệu"
    ms: "Tulis sinopsis, bio dan helaian jualan"
    id: "Menulis sinopsis, bio dan lembar jual"
    hi: "सारांश, परिचय और सेल शीट लिखना"
  - en: "Pitch your project like a professional"
    zh: "像专业人士一样推介项目"
    zh-TW: "像專業人士一樣提案專案"
    ja: "プロのように企画をピッチする"
    ko: "전문가처럼 기획 피칭하기"
    vi: "Pitch dự án như người chuyên nghiệp"
    ms: "Bentang projek secara profesional"
    id: "Mem-pitch proyek secara profesional"
    hi: "पेशेवर की तरह प्रोजेक्ट पिच करना"
