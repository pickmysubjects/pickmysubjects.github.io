code: ORAL10003
year: 2026
learn:
  en: "The science behind oral health: anatomy, physiology and disease of the mouth and teeth, with practical classes."
  zh: "口腔健康背后的科学：口腔和牙齿的解剖、生理与疾病，配有实践课。"
  zh-TW: "口腔健康背後的科學：口腔與牙齒的解剖、生理與疾病，配有實作課。"
  ja: "口腔の健康を支える科学。口と歯の解剖・生理・疾患を実習とともに学ぶ。"
  ko: "구강 건강의 과학: 입과 치아의 해부·생리·질환을 실습과 함께 배운다."
  vi: "Khoa học về sức khỏe răng miệng: giải phẫu, sinh lý và bệnh của miệng, răng, có thực hành."
  ms: "Sains kesihatan mulut: anatomi, fisiologi dan penyakit mulut serta gigi, dengan amali."
  id: "Sains kesehatan mulut: anatomi, fisiologi, dan penyakit mulut serta gigi, dengan praktikum."
  hi: "मुख-स्वास्थ्य का विज्ञान: मुँह और दाँतों की संरचना, क्रिया और रोग, प्रैक्टिकल के साथ।"
outcomes:
  - en: "Describe the structure of teeth and mouth"
    zh: "描述牙齿和口腔的结构"
    zh-TW: "描述牙齒與口腔的結構"
    ja: "歯と口の構造を説明する"
    ko: "치아와 입의 구조 설명하기"
    vi: "Mô tả cấu trúc răng và miệng"
    ms: "Huraikan struktur gigi dan mulut"
    id: "Menjelaskan struktur gigi dan mulut"
    hi: "दाँत और मुँह की संरचना बताना"
  - en: "Explain how oral diseases develop"
    zh: "说明口腔疾病如何发展"
    zh-TW: "說明口腔疾病如何發展"
    ja: "口腔疾患の進み方を説明する"
    ko: "구강 질환의 진행 설명하기"
    vi: "Giải thích bệnh răng miệng hình thành"
    ms: "Jelaskan cara penyakit mulut berkembang"
    id: "Menjelaskan perkembangan penyakit mulut"
    hi: "मुख रोग कैसे बनते हैं, समझाना"
  - en: "Link science to clinical care"
    zh: "把科学知识与临床护理联系起来"
    zh-TW: "把科學知識與臨床照護連結"
    ja: "科学を臨床につなげる"
    ko: "과학을 임상 진료에 연결하기"
    vi: "Liên hệ khoa học với lâm sàng"
    ms: "Kaitkan sains dengan rawatan klinikal"
    id: "Mengaitkan sains dengan perawatan klinis"
    hi: "विज्ञान को क्लिनिकल देखभाल से जोड़ना"
