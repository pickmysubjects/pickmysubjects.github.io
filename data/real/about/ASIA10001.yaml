code: ASIA10001
year: 2026
learn:
  en: "How language ties to power, nationalism and social hierarchy in East Asia, Southeast Asia and the Arabic world."
  zh: "语言如何与东亚、东南亚和阿拉伯世界的权力、民族主义和社会等级相连。"
  zh-TW: "語言如何與東亞、東南亞和阿拉伯世界的權力、民族主義和社會階層相連。"
  ja: "東アジア、東南アジア、アラブ世界で言語が権力・ナショナリズム・社会階層とどう結びつくかを学ぶ。"
  ko: "동아시아, 동남아시아, 아랍 세계에서 언어가 권력, 민족주의, 사회 위계와 어떻게 연결되는지 배운다."
  vi: "Ngôn ngữ gắn với quyền lực, chủ nghĩa dân tộc và thứ bậc xã hội ra sao ở Đông Á, Đông Nam Á và thế giới Ả Rập."
  ms: "Cara bahasa berkait dengan kuasa, nasionalisme dan hierarki sosial di Asia Timur, Asia Tenggara dan dunia Arab."
  id: "Cara bahasa terkait dengan kekuasaan, nasionalisme, dan hierarki sosial di Asia Timur, Asia Tenggara, dan dunia Arab."
  hi: "पूर्वी एशिया, दक्षिण-पूर्व एशिया और अरब दुनिया में भाषा का सत्ता, राष्ट्रवाद और सामाजिक पदानुक्रम से संबंध।"
outcomes:
  - en: "Explain how language links to power and status"
    zh: "解释语言如何与权力和地位相关"
    zh-TW: "解釋語言如何與權力和地位相關"
    ja: "言語が権力や地位とどう結びつくか説明する"
    ko: "언어가 권력·지위와 연결되는 방식 설명하기"
    vi: "Giải thích ngôn ngữ gắn với quyền lực và địa vị ra sao"
    ms: "Terangkan kaitan bahasa dengan kuasa dan status"
    id: "Menjelaskan kaitan bahasa dengan kekuasaan dan status"
    hi: "भाषा का सत्ता और हैसियत से संबंध समझाना"
  - en: "Compare minority and majority language issues"
    zh: "比较少数与多数语言的问题"
    zh-TW: "比較少數與多數語言的問題"
    ja: "少数言語と多数言語の問題を比べる"
    ko: "소수 언어와 다수 언어 문제 비교하기"
    vi: "So sánh vấn đề ngôn ngữ thiểu số và đa số"
    ms: "Bandingkan isu bahasa minoriti dan majoriti"
    id: "Membandingkan isu bahasa minoritas dan mayoritas"
    hi: "अल्पसंख्यक और बहुसंख्यक भाषा मुद्दों की तुलना करना"
  - en: "Analyse the role of media in language change"
    zh: "分析媒体在语言变化中的作用"
    zh-TW: "分析媒體在語言變化中的作用"
    ja: "言語変化におけるメディアの役割を分析する"
    ko: "언어 변화에서 미디어의 역할 분석하기"
    vi: "Phân tích vai trò truyền thông trong biến đổi ngôn ngữ"
    ms: "Analisis peranan media dalam perubahan bahasa"
    id: "Menganalisis peran media dalam perubahan bahasa"
    hi: "भाषा बदलाव में मीडिया की भूमिका का विश्लेषण करना"
