code: MUSI30020
year: 2026
learn:
  en: "The last step of the chamber music sequence: more independence as a group, aiming for a top-level concert."
  zh: "室内乐系列的最后一步：小组更加独立，目标是高水准音乐会。"
  zh-TW: "室內樂系列的最後一步：小組更加獨立，目標是高水準音樂會。"
  ja: "室内楽シリーズの仕上げ。グループの自立度を高め、高水準の演奏会を目指す。"
  ko: "실내악 과정의 마지막 단계. 그룹 자립도를 높여 최고 수준 공연을 목표로."
  vi: "Bước cuối của chuỗi thính phòng: nhóm tự chủ hơn, hướng tới buổi diễn đỉnh cao."
  ms: "Peringkat akhir muzik kamar: kumpulan lebih berdikari, sasar konsert terbaik."
  id: "Tahap akhir musik kamar: kelompok lebih mandiri, mengejar konser terbaik."
  hi: "चैम्बर संगीत श्रृंखला का अंतिम चरण: समूह अधिक स्वतंत्र, उच्च स्तरीय कॉन्सर्ट का लक्ष्य।"
outcomes:
  - en: "Lead your group's musical decisions independently"
    zh: "独立主导小组的音乐决定"
    zh-TW: "獨立主導小組的音樂決定"
    ja: "グループの音楽的判断を自ら主導する"
    ko: "그룹의 음악적 결정을 스스로 이끌기"
    vi: "Tự dẫn dắt quyết định âm nhạc của nhóm"
    ms: "Pimpin keputusan muzik kumpulan secara bebas"
    id: "Memimpin keputusan musik kelompok secara mandiri"
    hi: "समूह के संगीत निर्णय स्वयं लेना"
  - en: "Refine balance, timing and interpretation together"
    zh: "共同打磨平衡、节奏与诠释"
    zh-TW: "共同打磨平衡、節奏與詮釋"
    ja: "バランス・タイミング・解釈を共に磨く"
    ko: "균형·타이밍·해석을 함께 다듬기"
    vi: "Cùng trau chuốt cân bằng, nhịp và cách diễn giải"
    ms: "Halusi imbangan, masa dan tafsiran bersama"
    id: "Menyempurnakan keseimbangan, ketepatan, interpretasi"
    hi: "संतुलन, लय और व्याख्या साथ में निखारना"
  - en: "Perform chamber music at a high public standard"
    zh: "以高水准公开演出室内乐"
    zh-TW: "以高水準公開演出室內樂"
    ja: "高い水準で室内楽を公開演奏する"
    ko: "높은 수준으로 실내악 공개 연주하기"
    vi: "Biểu diễn thính phòng công khai ở trình độ cao"
    ms: "Persembahkan muzik kamar bertaraf tinggi"
    id: "Menampilkan musik kamar berstandar tinggi"
    hi: "ऊँचे स्तर पर सार्वजनिक चैम्बर प्रस्तुति देना"
