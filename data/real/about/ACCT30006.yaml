code: ACCT30006
year: 2026
learn:
  en: "Digging into a firm's strategy and financial statements to forecast its results and estimate what its shares are worth."
  zh: "深入分析公司战略和财报，预测业绩并估算股票价值。"
  zh-TW: "深入分析公司策略和財報，預測績效並估算股票價值。"
  ja: "企業の戦略と財務諸表を分析し、業績を予測して株式価値を見積もる。"
  ko: "기업 전략과 재무제표를 분석해 실적을 예측하고 주식 가치를 추정하는 방법."
  vi: "Phân tích chiến lược và báo cáo tài chính của công ty để dự báo kết quả và ước tính giá trị cổ phiếu."
  ms: "Mengkaji strategi dan penyata kewangan firma untuk meramal hasil dan menganggar nilai sahamnya."
  id: "Mendalami strategi dan laporan keuangan perusahaan untuk meramal kinerja dan menaksir nilai sahamnya."
  hi: "कंपनी की रणनीति और वित्तीय विवरणों का गहराई से विश्लेषण कर नतीजों का अनुमान और शेयर की कीमत आँकना।"
outcomes:
  - en: "Judge the quality of financial information and adjust it"
    zh: "判断财务信息的质量并做调整"
    zh-TW: "判斷財務資訊的品質並加以調整"
    ja: "財務情報の質を判断し、必要に応じて修正する"
    ko: "재무 정보의 질을 판단하고 조정하기"
    vi: "Đánh giá chất lượng thông tin tài chính và điều chỉnh"
    ms: "Nilai kualiti maklumat kewangan dan laraskannya"
    id: "Menilai kualitas informasi keuangan dan menyesuaikannya"
    hi: "वित्तीय जानकारी की गुणवत्ता परखना और उसे सुधारना"
  - en: "Build forecasts of a firm's future results"
    zh: "预测公司未来的财务表现"
    zh-TW: "預測公司未來的財務表現"
    ja: "企業の将来業績を予測する"
    ko: "기업의 미래 실적 예측하기"
    vi: "Lập dự báo kết quả tương lai của công ty"
    ms: "Bina ramalan prestasi masa depan firma"
    id: "Menyusun proyeksi kinerja masa depan perusahaan"
    hi: "कंपनी के भविष्य के नतीजों का पूर्वानुमान बनाना"
  - en: "Value shares with dividend, cash flow and income models"
    zh: "用股利、现金流和剩余收益模型估值"
    zh-TW: "用股利、現金流量和剩餘收益模型估值"
    ja: "配当・キャッシュフロー・残余利益モデルで株価を評価する"
    ko: "배당·현금흐름·잔여이익 모형으로 주식 가치 평가"
    vi: "Định giá cổ phiếu bằng mô hình cổ tức, dòng tiền, thu nhập"
    ms: "Nilai saham dengan model dividen, aliran tunai dan pendapatan"
    id: "Menilai saham dengan model dividen, arus kas, dan laba"
    hi: "डिविडेंड, कैश फ़्लो और इनकम मॉडल से शेयर का मूल्य आँकना"
