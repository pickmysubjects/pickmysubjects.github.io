code: MUSI10179
year: 2026
learn:
  en: "An online introduction to scoring film and animation: how music shapes a scene, with short tasks and an original score."
  zh: "网上学习为电影和动画配乐的基础：音乐如何塑造画面，完成小练习和一首原创配乐。"
  zh-TW: "線上學習為電影與動畫配樂的基礎：音樂如何塑造畫面，完成小練習與一首原創配樂。"
  ja: "映画やアニメの音楽づくりをオンラインで学ぶ入門。音楽が場面をどう形づくるかを学び、課題とオリジナル曲を作る。"
  ko: "영화·애니메이션 음악을 온라인으로 배우는 입문. 음악이 장면을 만드는 방식을 배우고 과제와 창작곡을 완성."
  vi: "Nhập môn trực tuyến về nhạc phim và hoạt hình: âm nhạc tạo nên cảnh ra sao, kèm bài tập và một bản nhạc gốc."
  ms: "Pengenalan dalam talian muzik filem dan animasi: cara muzik membentuk adegan, tugasan dan karya asli."
  id: "Pengantar daring musik film dan animasi: cara musik membentuk adegan, dengan tugas dan satu karya orisinal."
  hi: "फ़िल्म और एनिमेशन संगीत का ऑनलाइन परिचय: संगीत दृश्य को कैसे गढ़ता है, छोटे काम और एक मौलिक रचना।"
outcomes:
  - en: "Explain how music works on screen"
    zh: "解释音乐在画面中的作用"
    zh-TW: "解釋音樂在畫面中的作用"
    ja: "映像における音楽の働きを説明する"
    ko: "화면 속 음악의 역할 설명하기"
    vi: "Giải thích vai trò của nhạc trên màn ảnh"
    ms: "Terangkan fungsi muzik pada skrin"
    id: "Menjelaskan fungsi musik di layar"
    hi: "परदे पर संगीत की भूमिका समझाना"
  - en: "Compose an original cue for a scene"
    zh: "为一段画面创作原创配乐"
    zh-TW: "為一段畫面創作原創配樂"
    ja: "場面に合うオリジナル曲を作る"
    ko: "장면에 맞는 창작 음악 만들기"
    vi: "Sáng tác nhạc gốc cho một cảnh"
    ms: "Gubah muzik asli untuk satu adegan"
    id: "Menggubah musik orisinal untuk adegan"
    hi: "किसी दृश्य के लिए मौलिक संगीत रचना"
  - en: "Keep a logbook of your practice"
    zh: "用日志记录自己的练习"
    zh-TW: "用日誌記錄自己的練習"
    ja: "練習の記録をログブックにまとめる"
    ko: "연습 과정을 일지로 기록하기"
    vi: "Ghi nhật ký quá trình luyện tập"
    ms: "Catat amalan dalam buku log"
    id: "Mencatat latihan dalam buku log"
    hi: "अपने अभ्यास की लॉगबुक रखना"
