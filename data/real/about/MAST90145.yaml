code: MAST90145
year: 2027
learn:
  en: "The Data Science capstone in one subject: a team applies its skills to a real problem, with a report and talk."
  zh: "数据科学毕业项目（单科）：小组用所学解决实际问题，提交报告并口头汇报。"
  zh-TW: "資料科學畢業專題（單科）：小組運用所學解決實際問題，繳交報告並口頭報告。"
  ja: "1科目のデータサイエンス修了プロジェクト：チームで実課題に取り組み報告・発表。"
  ko: "한 과목짜리 데이터 과학 캡스톤: 팀이 실제 문제를 풀고 보고서와 발표."
  vi: "Dự án tốt nghiệp Khoa học Dữ liệu một môn: nhóm giải bài toán thực tế, viết báo cáo và thuyết trình."
  ms: "Projek akhir Sains Data dalam satu subjek: pasukan selesaikan masalah sebenar, laporan dan pembentangan."
  id: "Capstone Sains Data dalam satu mata kuliah: tim menangani masalah nyata, laporan dan presentasi."
  hi: "एक विषय में डेटा साइंस कैपस्टोन: टीम असली समस्या पर काम कर रिपोर्ट और प्रस्तुति देती है।"
outcomes:
  - en: "Apply data science methods to a real problem"
    zh: "将数据科学方法用于实际问题"
    zh-TW: "將資料科學方法用於實際問題"
    ja: "データ科学の手法を実問題に使う"
    ko: "데이터 과학 방법을 실제 문제에 적용하기"
    vi: "Áp dụng phương pháp khoa học dữ liệu vào bài toán thật"
    ms: "Mengaplikasi kaedah sains data pada masalah sebenar"
    id: "Menerapkan metode sains data pada masalah nyata"
    hi: "डेटा साइंस विधियाँ असली समस्या पर लगाना"
  - en: "Manage a team project from plan to final report"
    zh: "从规划到最终报告管理团队项目"
    zh-TW: "從規劃到期末報告管理團隊專案"
    ja: "計画から最終報告までチームで管理する"
    ko: "계획부터 최종 보고까지 팀 프로젝트 관리하기"
    vi: "Quản lý dự án nhóm từ kế hoạch đến báo cáo cuối"
    ms: "Mengurus projek pasukan dari rancangan ke laporan akhir"
    id: "Mengelola proyek tim dari rencana hingga laporan akhir"
    hi: "योजना से अंतिम रिपोर्ट तक टीम प्रोजेक्ट संभालना"
