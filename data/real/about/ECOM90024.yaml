code: ECOM90024
year: 2027
learn:
  en: "Time series forecasting for business, finance and economics: trends, seasons, cycles, ARIMA and forecast evaluation."
  zh: "面向商业、金融和经济的时间序列预测：趋势、季节、周期、ARIMA 与预测评估。"
  zh-TW: "面向商業、金融與經濟的時間序列預測：趨勢、季節、循環、ARIMA 與預測評估。"
  ja: "ビジネス・金融・経済の時系列予測：トレンド、季節性、循環、ARIMA、予測評価。"
  ko: "경영·금융·경제 시계열 예측: 추세, 계절성, 순환, ARIMA, 예측 평가."
  vi: "Dự báo chuỗi thời gian cho kinh doanh, tài chính, kinh tế: xu hướng, mùa vụ, chu kỳ, ARIMA, đánh giá dự báo."
  ms: "Ramalan siri masa untuk perniagaan, kewangan dan ekonomi: trend, musim, kitaran, ARIMA dan penilaian ramalan."
  id: "Peramalan deret waktu untuk bisnis, keuangan, dan ekonomi: tren, musiman, siklus, ARIMA, evaluasi ramalan."
  hi: "व्यवसाय, वित्त व अर्थशास्त्र के लिए टाइम सीरीज़ पूर्वानुमान: ट्रेंड, मौसमी पैटर्न, चक्र, ARIMA, मूल्यांकन।"
outcomes:
  - en: "Forecast trends, seasons and cycles"
    zh: "预测趋势、季节性和周期"
    zh-TW: "預測趨勢、季節性與循環"
    ja: "トレンド・季節性・循環を予測する"
    ko: "추세·계절성·순환 예측하기"
    vi: "Dự báo xu hướng, mùa vụ và chu kỳ"
    ms: "Meramal trend, musim dan kitaran"
    id: "Meramalkan tren, musiman, dan siklus"
    hi: "ट्रेंड, मौसम व चक्र का पूर्वानुमान"
  - en: "Evaluate point and interval forecasts"
    zh: "评估点预测和区间预测"
    zh-TW: "評估點預測與區間預測"
    ja: "点予測と区間予測を評価する"
    ko: "점·구간 예측 평가하기"
    vi: "Đánh giá dự báo điểm và khoảng"
    ms: "Menilai ramalan titik dan selang"
    id: "Mengevaluasi ramalan titik dan interval"
    hi: "बिंदु व अंतराल पूर्वानुमान का मूल्यांकन"
