code: FNCE30015
year: 2026
learn:
  en: "Why people often don't make the 'rational' money choices models predict, using ideas from psychology and experiments."
  zh: "为什么人们做财务决定时常常不像模型说的那么“理性”，结合心理学和实验来看。"
  zh-TW: "為什麼人們做財務決定時常常不像模型說的那麼「理性」，結合心理學和實驗來看。"
  ja: "人はなぜモデルが予測するほど「合理的」にお金の判断をしないのか、心理学と実験から考える。"
  ko: "사람들이 왜 모델의 예측만큼 '합리적'으로 돈 결정을 하지 않는지 심리학과 실험으로 살펴본다."
  vi: "Vì sao con người thường không ra quyết định tài chính 'hợp lý' như mô hình dự đoán, qua tâm lý học và thí nghiệm."
  ms: "Mengapa orang selalunya tidak membuat pilihan kewangan 'rasional' seperti diramal model, melalui psikologi dan eksperimen."
  id: "Mengapa orang sering tidak membuat keputusan keuangan 'rasional' seperti prediksi model, lewat psikologi dan eksperimen."
  hi: "लोग पैसों के फ़ैसले मॉडल के मुताबिक 'तर्कसंगत' क्यों नहीं लेते, मनोविज्ञान और प्रयोगों के सहारे।"
outcomes:
  - en: "Explain formal models of financial decision-making"
    zh: "解释金融决策的正式模型"
    zh-TW: "解釋金融決策的正式模型"
    ja: "金融における意思決定の理論モデルを説明する"
    ko: "금융 의사결정의 공식 모델 설명하기"
    vi: "Giải thích các mô hình ra quyết định tài chính"
    ms: "Terangkan model formal membuat keputusan kewangan"
    id: "Menjelaskan model formal pengambilan keputusan keuangan"
    hi: "फ़ाइनेंशियल फ़ैसलों के औपचारिक मॉडल समझाना"
  - en: "Understand how experiments are used in behavioural finance"
    zh: "了解行为金融学中如何使用实验"
    zh-TW: "了解行為財務學中如何運用實驗"
    ja: "行動ファイナンスで実験がどう使われるか理解する"
    ko: "행동재무학에서 실험이 쓰이는 방식 이해하기"
    vi: "Hiểu cách dùng thí nghiệm trong tài chính hành vi"
    ms: "Faham cara eksperimen digunakan dalam kewangan tingkah laku"
    id: "Memahami pemakaian eksperimen di keuangan perilaku"
    hi: "बिहेवियरल फ़ाइनेंस में प्रयोगों का इस्तेमाल समझना"
  - en: "Weigh up competing explanations of money behaviour"
    zh: "评估对理财行为的不同解释"
    zh-TW: "評估對理財行為的不同解釋"
    ja: "お金に関する行動の諸説明を比較評価する"
    ko: "돈과 관련된 행동에 대한 여러 설명 평가하기"
    vi: "Đánh giá các cách giải thích hành vi tài chính"
    ms: "Nilai pelbagai penjelasan tentang tingkah laku kewangan"
    id: "Menimbang berbagai penjelasan perilaku keuangan"
    hi: "पैसों से जुड़े व्यवहार की अलग-अलग व्याख्याएँ परखना"
