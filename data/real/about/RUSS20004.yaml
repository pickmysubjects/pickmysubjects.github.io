code: RUSS20004
year: 2026
learn:
  en: "Intermediate Russian on food, polite forms of address, holidays, climate and writers, building cultural know-how."
  zh: "中级俄语：饮食、称呼礼节、节日、气候和作家，积累文化知识。"
  zh-TW: "中級俄語：飲食、稱呼禮節、節日、氣候和作家，累積文化知識。"
  ja: "中級ロシア語。食べ物、呼びかけの礼儀、祝日、気候、作家を通じて文化を学ぶ。"
  ko: "중급 러시아어. 음식, 호칭 예절, 명절, 기후, 작가를 통해 문화 지식을 쌓는다."
  vi: "Tiếng Nga trung cấp về ẩm thực, cách xưng hô lịch sự, ngày lễ, khí hậu và nhà văn, tích lũy hiểu biết văn hóa."
  ms: "Bahasa Rusia pertengahan tentang makanan, cara memanggil orang dengan sopan, cuti, iklim dan penulis."
  id: "Bahasa Rusia menengah tentang makanan, cara menyapa yang sopan, hari raya, iklim dan penulis."
  hi: "मध्य स्तर की रूसी: खाना, संबोधन के शिष्टाचार, त्योहार, मौसम और लेखक, सांस्कृतिक समझ के साथ।"
outcomes:
  - en: "Talk about familiar topics in Russian with more confidence"
    zh: "更自信地用俄语谈论熟悉的话题"
    zh-TW: "更自信地用俄語談論熟悉的話題"
    ja: "身近な話題をロシア語でより自信を持って話す"
    ko: "익숙한 주제를 러시아어로 더 자신 있게 말하기"
    vi: "Nói về chủ đề quen thuộc bằng tiếng Nga tự tin hơn"
    ms: "Bercakap tentang topik biasa dalam bahasa Rusia dengan lebih yakin"
    id: "Membicarakan topik akrab dalam bahasa Rusia dengan lebih percaya diri"
    hi: "परिचित विषयों पर रूसी में ज़्यादा आत्मविश्वास से बात करना"
  - en: "Read and write short Russian texts"
    zh: "读写简短的俄语文章"
    zh-TW: "讀寫簡短的俄語文章"
    ja: "短いロシア語の文章を読み書きする"
    ko: "짧은 러시아어 글 읽고 쓰기"
    vi: "Đọc và viết đoạn văn tiếng Nga ngắn"
    ms: "Baca dan tulis teks pendek bahasa Rusia"
    id: "Membaca dan menulis teks pendek bahasa Rusia"
    hi: "छोटे रूसी पाठ पढ़ना-लिखना"
  - en: "Use new grammar and vocabulary correctly"
    zh: "正确运用新语法和词汇"
    zh-TW: "正確運用新文法和詞彙"
    ja: "新しい文法と語彙を正しく使う"
    ko: "새 문법과 어휘를 정확히 쓰기"
    vi: "Dùng đúng ngữ pháp và từ vựng mới"
    ms: "Guna tatabahasa dan kosa kata baharu dengan betul"
    id: "Memakai tata bahasa dan kosakata baru dengan benar"
    hi: "नया व्याकरण और शब्दावली सही इस्तेमाल करना"
