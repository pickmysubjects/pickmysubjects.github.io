code: PHYC30022
year: 2026
learn:
  en: "Classical field theory, symmetries and conservation laws, plus fluid flow, turbulence and aerodynamics."
  zh: "经典场论、对称性与守恒律，以及流体、湍流和空气动力学。"
  zh-TW: "古典場論、對稱性與守恆律，以及流體、湍流和空氣動力學。"
  ja: "古典場の理論、対称性と保存則、流体・乱流・空気力学。"
  ko: "고전장론, 대칭성과 보존법칙, 유체 흐름, 난류, 공기역학."
  vi: "Lý thuyết trường cổ điển, đối xứng và định luật bảo toàn, cùng dòng chảy, rối và khí động học."
  ms: "Teori medan klasik, simetri dan hukum keabadian, serta aliran bendalir, gelora dan aerodinamik."
  id: "Teori medan klasik, simetri dan hukum kekekalan, serta aliran fluida, turbulensi, dan aerodinamika."
  hi: "क्लासिकल फ़ील्ड थ्योरी, सिमेट्री और संरक्षण नियम, साथ में फ़्लूइड फ़्लो, टर्बुलेंस और एयरोडायनामिक्स।"
outcomes:
  - en: "Apply action principles to fields"
    zh: "把作用量原理用于场"
    zh-TW: "把作用量原理用於場"
    ja: "作用原理を場に適用する"
    ko: "작용 원리를 장에 적용하기"
    vi: "Áp dụng nguyên lý tác dụng cho trường"
    ms: "Mengguna prinsip tindakan pada medan"
    id: "Menerapkan prinsip aksi pada medan"
    hi: "फ़ील्ड पर एक्शन प्रिंसिपल लागू करना"
  - en: "Solve basic fluid flow equations"
    zh: "求解基本流体方程"
    zh-TW: "求解基本流體方程"
    ja: "流体の基本方程式を解く"
    ko: "기본 유체 방정식 풀기"
    vi: "Giải phương trình dòng chảy cơ bản"
    ms: "Menyelesaikan persamaan aliran bendalir asas"
    id: "Memecahkan persamaan aliran fluida dasar"
    hi: "बेसिक फ़्लूइड फ़्लो समीकरण हल करना"
