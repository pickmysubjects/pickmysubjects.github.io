code: MUSI30175
year: 2026
learn:
  en: "A second semester in the large Conservatorium choir, with new choral works and another concert. Pass/fail."
  zh: "音乐学院大型合唱团第二学期，新合唱作品，再办一场音乐会。及格制。"
  zh-TW: "音樂學院大型合唱團第二學期，新合唱作品，再辦一場音樂會。及格制。"
  ja: "大合唱団の後期。新しい合唱曲で再び演奏会へ。合否判定。"
  ko: "대합창단 2학기. 새 합창곡으로 또 한 번 공연. 합격/불합격."
  vi: "Học kỳ hai dàn hợp xướng lớn, tác phẩm mới và buổi diễn mới. Đạt/không đạt."
  ms: "Semester kedua koir besar, karya koir baharu dan konsert lagi. Lulus/gagal."
  id: "Semester kedua paduan suara besar, karya baru dan konser lagi. Lulus/gagal."
  hi: "बड़े कोरस का दूसरा सत्र, नई रचनाएँ और एक और कॉन्सर्ट। पास/फ़ेल।"
outcomes:
  - en: "Learn choral parts accurately and quickly"
    zh: "准确快速地学会合唱声部"
    zh-TW: "準確快速地學會合唱聲部"
    ja: "合唱パートを正確に速く覚える"
    ko: "합창 파트를 정확하고 빠르게 익히기"
    vi: "Học bè hợp xướng chính xác và nhanh"
    ms: "Kuasai bahagian koir dengan tepat dan cepat"
    id: "Menguasai partisi paduan suara dengan cepat"
    hi: "कोरस भाग सही और जल्दी सीखना"
  - en: "Understand choral traditions through singing them"
    zh: "通过演唱了解合唱传统"
    zh-TW: "透過演唱了解合唱傳統"
    ja: "歌って合唱の伝統を理解する"
    ko: "노래하며 합창 전통 이해하기"
    vi: "Hiểu truyền thống hợp xướng qua việc hát"
    ms: "Fahami tradisi koir melalui nyanyian"
    id: "Memahami tradisi paduan suara lewat bernyanyi"
    hi: "गाकर कोरस परंपराओं को समझना"
  - en: "Perform in a large public choral concert"
    zh: "参加大型公开合唱音乐会"
    zh-TW: "參加大型公開合唱音樂會"
    ja: "大規模な合唱演奏会で歌う"
    ko: "대규모 공개 합창 공연에 서기"
    vi: "Biểu diễn trong buổi hợp xướng lớn"
    ms: "Membuat persembahan konsert koir besar"
    id: "Tampil dalam konser paduan suara besar"
    hi: "बड़े सार्वजनिक कोरस कॉन्सर्ट में गाना"
