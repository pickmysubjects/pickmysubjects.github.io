code: EVSC10001
year: 2026
learn:
  en: "Intro to how Earth's rocks, oceans, atmosphere, life and climate work and change together."
  zh: "入门：地球的岩石、海洋、大气、生命和气候如何共同运作与演变。"
  zh-TW: "入門：地球的岩石、海洋、大氣、生命和氣候如何共同運作與演變。"
  ja: "入門：地球の岩石・海洋・大気・生命・気候がどう連動し変化するか。"
  ko: "입문: 지구의 암석·해양·대기·생명·기후가 어떻게 함께 작동하고 변하는지."
  vi: "Nhập môn về cách đá, đại dương, khí quyển, sự sống và khí hậu Trái Đất vận hành và thay đổi cùng nhau."
  ms: "Pengenalan cara batuan, lautan, atmosfera, hidupan dan iklim Bumi berfungsi dan berubah bersama."
  id: "Pengantar cara batuan, laut, atmosfer, kehidupan, dan iklim Bumi bekerja dan berubah bersama."
  hi: "परिचय: पृथ्वी की चट्टानें, महासागर, वायुमंडल, जीवन और जलवायु साथ मिलकर कैसे काम करते और बदलते हैं।"
outcomes:
  - en: "Evaluate what drives Earth's climate"
    zh: "评估地球气候的驱动因素"
    zh-TW: "評估地球氣候的驅動因素"
    ja: "地球の気候を動かす要因を評価する"
    ko: "지구 기후의 동인을 평가한다"
    vi: "Đánh giá các yếu tố chi phối khí hậu"
    ms: "Nilai pemacu iklim Bumi"
    id: "Mengevaluasi pendorong iklim Bumi"
    hi: "पृथ्वी की जलवायु के कारकों का मूल्यांकन"
  - en: "Gather data in the field and lab"
    zh: "在野外和实验室收集数据"
    zh-TW: "在野外和實驗室收集數據"
    ja: "野外と実験室でデータを集める"
    ko: "야외와 실험실에서 데이터를 모은다"
    vi: "Thu thập dữ liệu thực địa và phòng thí nghiệm"
    ms: "Kumpul data di lapangan dan makmal"
    id: "Mengumpulkan data di lapangan dan lab"
    hi: "फ़ील्ड और लैब में डेटा जुटाना"
