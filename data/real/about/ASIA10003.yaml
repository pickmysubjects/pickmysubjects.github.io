code: ASIA10003
year: 2026
learn:
  en: "Identity and belonging in Asia and its diasporas, looked at through gender, religion, race and popular culture like K-pop and Bollywood."
  zh: "亚洲及海外华人等离散群体的身份与归属，从性别、宗教、种族以及K-pop、宝莱坞等流行文化来看。"
  zh-TW: "亞洲及海外離散群體的身分與歸屬，從性別、宗教、種族以及K-pop、寶萊塢等流行文化來看。"
  ja: "アジアとそのディアスポラにおけるアイデンティティと帰属意識を、ジェンダー・宗教・人種、K-POPやボリウッドなどの大衆文化から考える。"
  ko: "아시아와 디아스포라의 정체성과 소속감을 젠더, 종교, 인종, 그리고 K-pop·발리우드 같은 대중문화를 통해 살핀다."
  vi: "Bản sắc và cảm giác thuộc về ở châu Á và cộng đồng di cư, nhìn qua giới, tôn giáo, chủng tộc và văn hóa đại chúng như K-pop, Bollywood."
  ms: "Identiti dan rasa kepunyaan di Asia dan diasporanya, dilihat melalui jantina, agama, kaum dan budaya popular seperti K-pop dan Bollywood."
  id: "Identitas dan rasa memiliki di Asia dan diasporanya, dilihat dari gender, agama, ras, dan budaya pop seperti K-pop dan Bollywood."
  hi: "एशिया और उसके प्रवासी समुदायों में पहचान और अपनापन, जेंडर, धर्म, नस्ल और के-पॉप व बॉलीवुड जैसी पॉप संस्कृति के ज़रिए।"
outcomes:
  - en: "Explain how identities overlap and shape each other"
    zh: "说明不同身份如何交织、相互影响"
    zh-TW: "說明不同身分如何交織、相互影響"
    ja: "複数のアイデンティティがどう重なり影響し合うか説明する"
    ko: "여러 정체성이 어떻게 겹치고 서로 영향을 주는지 설명하기"
    vi: "Giải thích các bản sắc đan xen và ảnh hưởng lẫn nhau thế nào"
    ms: "Terangkan bagaimana identiti bertindih dan saling membentuk"
    id: "Menjelaskan bagaimana identitas saling tumpang tindih dan memengaruhi"
    hi: "समझाना कि अलग-अलग पहचानें कैसे आपस में जुड़ती और एक-दूसरे को गढ़ती हैं"
  - en: "Analyse pop culture and online activism from Asia"
    zh: "分析来自亚洲的流行文化和网络社会运动"
    zh-TW: "分析來自亞洲的流行文化和網路社會運動"
    ja: "アジア発の大衆文化やネット上の社会運動を分析する"
    ko: "아시아의 대중문화와 온라인 사회운동 분석하기"
    vi: "Phân tích văn hóa đại chúng và hoạt động mạng xã hội từ châu Á"
    ms: "Analisis budaya popular dan aktivisme dalam talian dari Asia"
    id: "Menganalisis budaya pop dan aktivisme daring dari Asia"
    hi: "एशिया की पॉप संस्कृति और ऑनलाइन आंदोलनों का विश्लेषण करना"
  - en: "Use basic methods from Asian studies"
    zh: "运用亚洲研究的基本方法"
    zh-TW: "運用亞洲研究的基本方法"
    ja: "アジア研究の基本的な方法を使う"
    ko: "아시아학의 기본 연구 방법 활용하기"
    vi: "Dùng các phương pháp cơ bản của ngành châu Á học"
    ms: "Guna kaedah asas pengajian Asia"
    id: "Memakai metode dasar studi Asia"
    hi: "एशियाई अध्ययन के बुनियादी तरीके इस्तेमाल करना"
