code: PHYC30018
year: 2026
learn:
  en: "The core rules of quantum mechanics, from the Schrödinger equation and spin to atoms, solids and particles."
  zh: "量子力学的核心规则，从薛定谔方程、自旋到原子和固体。"
  zh-TW: "量子力學的核心規則，從薛丁格方程、自旋到原子和固體。"
  ja: "シュレーディンガー方程式とスピンから原子・固体・素粒子まで、量子力学の基本。"
  ko: "슈뢰딩거 방정식과 스핀부터 원자, 고체, 입자까지 양자역학의 핵심 규칙."
  vi: "Nguyên lý cốt lõi của cơ học lượng tử, từ phương trình Schrödinger, spin đến nguyên tử, chất rắn."
  ms: "Peraturan asas mekanik kuantum, dari persamaan Schrödinger dan spin hingga atom dan pepejal."
  id: "Aturan inti mekanika kuantum, dari persamaan Schrödinger dan spin hingga atom dan zat padat."
  hi: "क्वांटम मैकेनिक्स के मूल नियम, श्रोडिंगर समीकरण और स्पिन से एटम, सॉलिड और कणों तक।"
outcomes:
  - en: "Solve problems involving spin"
    zh: "解决涉及自旋的问题"
    zh-TW: "解決涉及自旋的問題"
    ja: "スピンに関する問題を解く"
    ko: "스핀 관련 문제 풀기"
    vi: "Giải bài toán về spin"
    ms: "Menyelesaikan masalah melibatkan spin"
    id: "Memecahkan soal tentang spin"
    hi: "स्पिन से जुड़े सवाल हल करना"
  - en: "Apply quantum theory to atoms and solids"
    zh: "把量子理论用于原子和固体"
    zh-TW: "把量子理論用於原子和固體"
    ja: "量子論を原子や固体に適用する"
    ko: "양자 이론을 원자와 고체에 적용하기"
    vi: "Áp dụng lý thuyết lượng tử cho nguyên tử, chất rắn"
    ms: "Mengguna teori kuantum pada atom dan pepejal"
    id: "Menerapkan teori kuantum pada atom dan zat padat"
    hi: "एटम और सॉलिड पर क्वांटम थ्योरी लागू करना"
