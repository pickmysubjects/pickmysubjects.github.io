code: ELEN90064
year: 2027
learn:
  en: "Designing feedback controllers with state-space methods, optimal control and model predictive control."
  zh: "用状态空间方法、最优控制和模型预测控制设计反馈控制器。"
  zh-TW: "用狀態空間方法、最佳控制和模型預測控制設計回授控制器。"
  ja: "状態空間法・最適制御・モデル予測制御でフィードバック制御器を設計する。"
  ko: "상태공간 방법, 최적 제어, 모델 예측 제어로 피드백 제어기 설계."
  vi: "Thiết kế bộ điều khiển phản hồi bằng phương pháp không gian trạng thái, điều khiển tối ưu và MPC."
  ms: "Mereka bentuk pengawal suap balik dengan kaedah ruang keadaan, kawalan optimum dan kawalan ramalan model."
  id: "Merancang pengendali umpan balik dengan metode ruang keadaan, kendali optimal, dan kendali prediktif model."
  hi: "स्टेट-स्पेस विधियों, ऑप्टिमल कंट्रोल और मॉडल प्रेडिक्टिव कंट्रोल से फ़ीडबैक कंट्रोलर डिज़ाइन करना।"
outcomes:
  - en: "Design state feedback and observers"
    zh: "设计状态反馈和观测器"
    zh-TW: "設計狀態回授與觀測器"
    ja: "状態フィードバックとオブザーバを設計する"
    ko: "상태 피드백과 관측기 설계하기"
    vi: "Thiết kế phản hồi trạng thái và bộ quan sát"
    ms: "Mereka bentuk suap balik keadaan dan pemerhati"
    id: "Merancang umpan balik keadaan dan observer"
    hi: "स्टेट फ़ीडबैक और ऑब्ज़र्वर डिज़ाइन करना"
  - en: "Solve constrained optimisation problems for control"
    zh: "求解控制中的约束优化问题"
    zh-TW: "求解控制中的約束最佳化問題"
    ja: "制御のための制約付き最適化問題を解く"
    ko: "제어를 위한 제약 최적화 문제 풀기"
    vi: "Giải bài toán tối ưu có ràng buộc cho điều khiển"
    ms: "Menyelesaikan masalah pengoptimuman berkekangan untuk kawalan"
    id: "Menyelesaikan masalah optimisasi berkendala untuk kendali"
    hi: "नियंत्रण के लिए बाधित ऑप्टिमाइज़ेशन समस्याएँ हल करना"
  - en: "Simulate control systems with software"
    zh: "用软件仿真控制系统"
    zh-TW: "用軟體模擬控制系統"
    ja: "ソフトで制御系をシミュレーションする"
    ko: "소프트웨어로 제어 시스템 시뮬레이션하기"
    vi: "Mô phỏng hệ điều khiển bằng phần mềm"
    ms: "Mensimulasi sistem kawalan dengan perisian"
    id: "Menyimulasikan sistem kendali dengan perangkat lunak"
    hi: "सॉफ़्टवेयर से कंट्रोल सिस्टम का सिमुलेशन"
