code: ATOC30003
year: 2026
learn:
  en: "Tropical weather and climate extremes like cyclones, ENSO and monsoons, driven by ocean–air interaction."
  zh: "热带天气与气候极端事件：气旋、ENSO和季风，以及海气相互作用。"
  zh-TW: "熱帶天氣與氣候極端事件：氣旋、ENSO與季風，以及海氣交互作用。"
  ja: "熱帯の極端気象：サイクロン、ENSO、モンスーンと大気海洋相互作用。"
  ko: "열대 기상·기후 극한: 사이클론, ENSO, 몬순과 해양-대기 상호작용."
  vi: "Thời tiết cực đoan vùng nhiệt đới như bão, ENSO, gió mùa, do tương tác biển – khí quyển."
  ms: "Cuaca ekstrem tropika seperti siklon, ENSO dan monsun, hasil interaksi laut–udara."
  id: "Cuaca ekstrem tropis seperti siklon, ENSO, dan monsun akibat interaksi laut–udara."
  hi: "उष्णकटिबंधीय चरम मौसम जैसे चक्रवात, ENSO और मानसून, समुद्र–वायु संपर्क से।"
outcomes:
  - en: "Solve equations for ocean and air waves"
    zh: "求解海洋与大气波动方程"
    zh-TW: "求解海洋與大氣波動方程"
    ja: "海洋・大気の波の方程式を解く"
    ko: "해양·대기 파동 방정식 풀기"
    vi: "Giải phương trình sóng đại dương và khí quyển"
    ms: "Selesaikan persamaan gelombang laut dan udara"
    id: "Menyelesaikan persamaan gelombang laut dan udara"
    hi: "समुद्र और वायु तरंगों के समीकरण हल करें"
  - en: "Quantify upper-ocean mixing processes"
    zh: "定量分析上层海洋混合"
    zh-TW: "定量分析上層海洋混合"
    ja: "表層海洋の混合を定量化する"
    ko: "상층 해양 혼합 정량화하기"
    vi: "Định lượng quá trình xáo trộn tầng biển trên"
    ms: "Kuantifikasi proses percampuran laut atas"
    id: "Mengkuantifikasi pencampuran laut atas"
    hi: "ऊपरी समुद्र के मिश्रण का मात्रात्मक आकलन करें"
  - en: "Code to analyse real weather datasets"
    zh: "编程分析真实天气数据"
    zh-TW: "寫程式分析真實天氣數據"
    ja: "実際の気象データをコードで解析する"
    ko: "실제 기상 데이터 코딩으로 분석하기"
    vi: "Lập trình phân tích dữ liệu thời tiết thực"
    ms: "Tulis kod analisis data cuaca sebenar"
    id: "Menulis kode untuk analisis data cuaca nyata"
    hi: "असली मौसम डेटा का कोड से विश्लेषण करें"
