code: MECM30019
year: 2026
learn:
  en: "Videogames as a medium and a global industry: how they are made and sold, and what they mean for culture, identity and communities."
  zh: "把电子游戏当作一种媒介和全球产业来看：它们怎么被制作和销售，又对文化、身份认同和社群意味着什么。"
  zh-TW: "把電子遊戲當作一種媒介和全球產業來看：它們怎麼被製作和銷售，又對文化、身分認同和社群意味著什麼。"
  ja: "ビデオゲームをメディアと世界的産業として捉え、どう作られ売られるのか、文化やアイデンティティ、コミュニティにとって何を意味するかを考える。"
  ko: "비디오 게임을 매체이자 글로벌 산업으로 보고, 어떻게 만들어지고 팔리는지, 문화와 정체성, 공동체에 어떤 의미인지 살펴본다."
  vi: "Trò chơi điện tử như một phương tiện và ngành công nghiệp toàn cầu: được làm và bán ra sao, và có ý nghĩa gì với văn hóa, bản sắc, cộng đồng."
  ms: "Permainan video sebagai medium dan industri global: cara ia dibuat dan dijual, serta maknanya bagi budaya, identiti dan komuniti."
  id: "Gim video sebagai medium dan industri global: cara dibuat dan dijual, serta artinya bagi budaya, identitas, dan komunitas."
  hi: "वीडियो गेम एक माध्यम और वैश्विक उद्योग के रूप में: ये कैसे बनते और बिकते हैं, और संस्कृति, पहचान व समुदायों के लिए इनका क्या मतलब है।"
outcomes:
  - en: "Explain what makes videogames a distinct medium"
    zh: "说明电子游戏为何是一种独特的媒介"
    zh-TW: "說明電子遊戲為何是一種獨特的媒介"
    ja: "ビデオゲームが独自のメディアである理由を説明する"
    ko: "비디오 게임이 독자적인 매체인 이유 설명하기"
    vi: "Giải thích vì sao trò chơi điện tử là một phương tiện riêng"
    ms: "Terangkan kenapa permainan video ialah medium tersendiri"
    id: "Menjelaskan kenapa gim video adalah medium tersendiri"
    hi: "समझाना कि वीडियो गेम एक अलग माध्यम क्यों हैं"
  - en: "Analyse how game production and monetisation work"
    zh: "分析游戏的制作方式和变现模式"
    zh-TW: "分析遊戲的製作方式和變現模式"
    ja: "ゲーム制作と収益化の仕組みを分析する"
    ko: "게임 제작과 수익화 방식 분석하기"
    vi: "Phân tích cách sản xuất và kiếm tiền từ trò chơi"
    ms: "Analisis cara pengeluaran dan pengewangan permainan"
    id: "Menganalisis cara produksi dan monetisasi gim"
    hi: "गेम बनाने और उससे कमाई के तरीकों का विश्लेषण करना"
  - en: "Discuss the impact of games on society"
    zh: "讨论游戏对社会的影响"
    zh-TW: "討論遊戲對社會的影響"
    ja: "ゲームが社会に与える影響を論じる"
    ko: "게임이 사회에 미치는 영향 논의하기"
    vi: "Thảo luận tác động của trò chơi đến xã hội"
    ms: "Bincangkan kesan permainan kepada masyarakat"
    id: "Membahas dampak gim bagi masyarakat"
    hi: "समाज पर गेम्स के असर पर चर्चा करना"
