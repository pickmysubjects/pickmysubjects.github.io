code: MUSI30227
year: 2026
learn:
  en: "One-to-one lessons on your instrument plus group improvisation classes, ending in a technical exam you must pass."
  zh: "乐器一对一课加集体即兴课，最后是必须通过的技术考核。"
  zh-TW: "樂器一對一課加團體即興課，最後是必須通過的技術考核。"
  ja: "楽器の個人レッスンと集団即興クラス。最後に合格必須の技術試験。"
  ko: "악기 개인 레슨과 그룹 즉흥 수업, 마지막에 반드시 통과해야 할 실기 시험."
  vi: "Học riêng nhạc cụ và lớp ứng tác nhóm, kết thúc bằng bài thi kỹ thuật bắt buộc đậu."
  ms: "Kelas individu alat muzik dan improvisasi berkumpulan, diakhiri ujian teknikal wajib lulus."
  id: "Les privat instrumen dan kelas improvisasi grup, diakhiri ujian teknik yang wajib lulus."
  hi: "वाद्य के एक-से-एक पाठ और समूह इम्प्रोवाइज़ेशन, अंत में ज़रूरी तकनीकी परीक्षा।"
outcomes:
  - en: "Use advanced jazz harmony and rhythm"
    zh: "运用高级爵士和声与节奏"
    zh-TW: "運用進階爵士和聲與節奏"
    ja: "高度なジャズの和声とリズムを使う"
    ko: "고급 재즈 화성과 리듬 활용"
    vi: "Dùng hòa âm, tiết tấu jazz nâng cao"
    ms: "Guna harmoni dan ritma jaz lanjutan"
    id: "Memakai harmoni dan ritme jazz lanjut"
    hi: "उन्नत जैज़ हार्मनी और लय का प्रयोग"
  - en: "Improvise as real-time composing"
    zh: "把即兴当作实时作曲"
    zh-TW: "把即興當作即時作曲"
    ja: "即興をリアルタイム作曲として行う"
    ko: "즉흥을 실시간 작곡으로 하기"
    vi: "Ứng tác như sáng tác tức thời"
    ms: "Berimprovisasi sebagai gubahan masa nyata"
    id: "Berimprovisasi sebagai komposisi langsung"
    hi: "इम्प्रोवाइज़ेशन को लाइव रचना की तरह करना"
  - en: "Plan and review your own practice"
    zh: "规划并检讨自己的练习"
    zh-TW: "規劃並檢討自己的練習"
    ja: "自分の練習を計画し見直す"
    ko: "자신의 연습 계획·점검하기"
    vi: "Lập kế hoạch và tự đánh giá luyện tập"
    ms: "Rancang dan nilai latihan sendiri"
    id: "Merencanakan dan menilai latihan sendiri"
    hi: "अपने अभ्यास की योजना और समीक्षा"
