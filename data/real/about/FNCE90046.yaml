code: FNCE90046
year: 2027
learn:
  en: "How company and bank treasuries manage funding, currency, interest rate and liquidity risk, with practitioner seminars."
  zh: "企业和银行资金部门如何管理融资、汇率、利率和流动性风险，含业界讲座。"
  zh-TW: "企業與銀行資金部門如何管理融資、匯率、利率與流動性風險，含業界講座。"
  ja: "企業・銀行の財務部門が資金調達・為替・金利・流動性リスクを管理する方法。実務家セミナー付き。"
  ko: "기업·은행 자금부서의 조달, 환율, 금리, 유동성 위험 관리. 실무자 세미나 포함."
  vi: "Cách bộ phận ngân quỹ của công ty, ngân hàng quản lý vốn, rủi ro tỷ giá, lãi suất, thanh khoản."
  ms: "Cara perbendaharaan syarikat dan bank mengurus pembiayaan, risiko mata wang, kadar faedah dan kecairan."
  id: "Cara treasury perusahaan dan bank mengelola pendanaan, risiko kurs, suku bunga dan likuiditas."
  hi: "कंपनी और बैंक ट्रेज़री फंडिंग, मुद्रा, ब्याज दर और तरलता जोखिम कैसे संभालते हैं।"
outcomes:
  - en: "Describe what a treasury function does"
    zh: "说明资金管理部门的职能"
    zh-TW: "說明資金管理部門的職能"
    ja: "財務（トレジャリー）部門の役割を説明する"
    ko: "자금(트레저리) 부서의 역할 설명하기"
    vi: "Mô tả chức năng của bộ phận ngân quỹ"
    ms: "Menerangkan fungsi perbendaharaan"
    id: "Menjelaskan fungsi treasury"
    hi: "ट्रेज़री विभाग क्या करता है, बताना"
  - en: "Evaluate a framework for managing financial risks"
    zh: "评估管理金融风险的框架"
    zh-TW: "評估管理金融風險的框架"
    ja: "金融リスク管理の枠組みを評価する"
    ko: "금융위험 관리 체계 평가하기"
    vi: "Đánh giá khung quản lý rủi ro tài chính"
    ms: "Menilai rangka kerja pengurusan risiko kewangan"
    id: "Mengevaluasi kerangka manajemen risiko keuangan"
    hi: "वित्तीय जोखिम प्रबंधन ढांचे का मूल्यांकन"
