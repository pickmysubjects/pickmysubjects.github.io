code: PROP20003
year: 2026
learn:
  en: "How the property industry links planning, design, construction and feasibility to what the market wants."
  zh: "物业行业如何把规划、设计、施工与可行性分析和市场需求联系起来。"
  zh-TW: "不動產產業如何把規劃、設計、營造與可行性分析和市場需求連結起來。"
  ja: "不動産業界が計画・設計・施工・事業性を市場の需要とどう結びつけるか。"
  ko: "부동산 산업이 계획·설계·시공·사업성을 시장 수요와 연결하는 방식."
  vi: "Ngành BĐS gắn quy hoạch, thiết kế, thi công và tính khả thi với nhu cầu thị trường ra sao."
  ms: "Cara industri hartanah mengaitkan perancangan, reka bentuk, pembinaan dan kebolehlaksanaan dengan kehendak pasaran."
  id: "Cara industri properti mengaitkan perencanaan, desain, konstruksi, dan kelayakan dengan kebutuhan pasar."
  hi: "प्रॉपर्टी उद्योग प्लानिंग, डिज़ाइन, निर्माण और व्यवहार्यता को बाज़ार की माँग से कैसे जोड़ता है।"
outcomes:
  - en: "Describe the roles in a property project"
    zh: "描述物业项目中的各方角色"
    zh-TW: "描述不動產專案中的各方角色"
    ja: "不動産プロジェクトの役割を説明する"
    ko: "부동산 프로젝트의 역할 설명하기"
    vi: "Mô tả các vai trò trong dự án BĐS"
    ms: "Huraikan peranan dalam projek hartanah"
    id: "Menjelaskan peran dalam proyek properti"
    hi: "प्रॉपर्टी प्रोजेक्ट की भूमिकाएँ बताना"
  - en: "Run a simple feasibility check"
    zh: "做简单的可行性分析"
    zh-TW: "做簡單的可行性分析"
    ja: "簡単な事業性検討を行う"
    ko: "간단한 사업성 검토하기"
    vi: "Làm phân tích khả thi đơn giản"
    ms: "Jalankan semakan kebolehlaksanaan ringkas"
    id: "Melakukan cek kelayakan sederhana"
    hi: "सरल व्यवहार्यता जाँच करना"
  - en: "Weigh market demand against design and impact"
    zh: "权衡市场需求与设计和环境影响"
    zh-TW: "權衡市場需求與設計和環境影響"
    ja: "市場の需要と設計・影響を比べる"
    ko: "시장 수요와 설계·영향 저울질하기"
    vi: "Cân nhắc nhu cầu thị trường với thiết kế, tác động"
    ms: "Timbang permintaan pasaran dengan reka bentuk dan kesan"
    id: "Menimbang permintaan pasar dengan desain dan dampak"
    hi: "बाज़ार की माँग को डिज़ाइन और असर से तौलना"
