code: ABPL90403
year: 2027
learn:
  en: "Key theories and debates in architecture and spatial practice from the post-war period to today."
  zh: "二战后至今建筑与空间实践的重要理论和争论。"
  zh-TW: "二戰後至今建築與空間實踐的重要理論和爭論。"
  ja: "戦後から現在までの建築と空間実践の主要な理論と論争。"
  ko: "전후부터 오늘날까지 건축과 공간 실천의 주요 이론과 논쟁."
  vi: "Các lý thuyết và tranh luận chính về kiến trúc và thực hành không gian từ sau chiến tranh đến nay."
  ms: "Teori dan perdebatan utama seni bina dan amalan ruang dari pasca perang hingga kini."
  id: "Teori dan perdebatan utama arsitektur dan praktik ruang sejak pascaperang hingga kini."
  hi: "युद्धोत्तर काल से आज तक वास्तुकला और स्थानिक व्यवहार के प्रमुख सिद्धांत व बहसें।"
outcomes:
  - en: "Explain major design theories since 1945"
    zh: "解释1945年以来的主要设计理论"
    zh-TW: "解釋1945年以來的主要設計理論"
    ja: "1945年以降の主要な設計理論を説明する"
    ko: "1945년 이후 주요 설계 이론 설명하기"
    vi: "Giải thích lý thuyết thiết kế chính từ 1945"
    ms: "Menerangkan teori reka bentuk utama sejak 1945"
    id: "Menjelaskan teori desain utama sejak 1945"
    hi: "1945 के बाद के प्रमुख डिज़ाइन सिद्धांत समझाना"
  - en: "Write a research proposal on architecture"
    zh: "撰写建筑方向的研究提案"
    zh-TW: "撰寫建築方向的研究提案"
    ja: "建築の研究計画を書く"
    ko: "건축 연구 제안서 쓰기"
    vi: "Viết đề xuất nghiên cứu về kiến trúc"
    ms: "Menulis cadangan kajian seni bina"
    id: "Menulis proposal riset arsitektur"
    hi: "वास्तुकला पर शोध प्रस्ताव लिखना"
