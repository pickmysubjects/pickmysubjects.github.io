code: INDO10011
year: 2026
learn:
  en: "Ethnic, religious, class, gender and sexual identities in Indonesia, and how minorities face exclusion. Taught in Indonesian."
  zh: "印尼的民族、宗教、阶级、性别和性向认同，以及少数群体如何遭受边缘化。用印尼语授课。"
  zh-TW: "印尼的民族、宗教、階級、性別和性向認同，以及少數群體如何遭受邊緣化。用印尼語授課。"
  ja: "インドネシアの民族・宗教・階級・ジェンダー・性的アイデンティティと少数者の周縁化。授業はインドネシア語。"
  ko: "인도네시아의 민족·종교·계급·젠더·성적 정체성과 소수자의 소외. 인도네시아어 수업."
  vi: "Bản sắc dân tộc, tôn giáo, giai cấp, giới và tính dục ở Indonesia, và sự gạt ra lề của nhóm thiểu số. Dạy bằng tiếng Indonesia."
  ms: "Identiti etnik, agama, kelas, gender dan seksual di Indonesia, serta peminggiran golongan minoriti. Diajar dalam bahasa Indonesia."
  id: "Identitas etnis, agama, kelas, gender dan seksual di Indonesia, serta peminggiran kelompok minoritas. Diajarkan dalam bahasa Indonesia."
  hi: "इंडोनेशिया में जातीय, धार्मिक, वर्ग, जेंडर और यौन पहचान, और अल्पसंख्यकों का हाशियाकरण। इंडोनेशियाई में पढ़ाया जाता है।"
outcomes:
  - en: "Explain how identities are formed in Indonesia"
    zh: "解释印尼的身份认同如何形成"
    zh-TW: "解釋印尼的身分認同如何形成"
    ja: "インドネシアでアイデンティティがどう形づくられるか説明する"
    ko: "인도네시아에서 정체성이 형성되는 과정 설명하기"
    vi: "Giải thích bản sắc được hình thành ra sao ở Indonesia"
    ms: "Terangkan cara identiti terbentuk di Indonesia"
    id: "Menjelaskan bagaimana identitas terbentuk di Indonesia"
    hi: "इंडोनेशिया में पहचान कैसे बनती है, समझाना"
  - en: "Analyse cases of minority groups and solidarity"
    zh: "分析少数群体与团结互助的案例"
    zh-TW: "分析少數群體與團結互助的案例"
    ja: "少数者と連帯の事例を分析する"
    ko: "소수자 집단과 연대의 사례 분석하기"
    vi: "Phân tích các ca về nhóm thiểu số và tình đoàn kết"
    ms: "Analisis kes kumpulan minoriti dan solidariti"
    id: "Menganalisis kasus kelompok minoritas dan solidaritas"
    hi: "अल्पसंख्यक समूहों और एकजुटता के उदाहरणों का विश्लेषण करना"
  - en: "Read and discuss academic texts in Indonesian"
    zh: "用印尼语阅读和讨论学术文章"
    zh-TW: "用印尼語閱讀和討論學術文章"
    ja: "インドネシア語の学術文献を読み議論する"
    ko: "인도네시아어 학술 글 읽고 토론하기"
    vi: "Đọc và thảo luận văn bản học thuật bằng tiếng Indonesia"
    ms: "Baca dan bincang teks akademik dalam bahasa Indonesia"
    id: "Membaca dan membahas teks akademik berbahasa Indonesia"
    hi: "इंडोनेशियाई में अकादमिक पाठ पढ़ना और उन पर चर्चा करना"
