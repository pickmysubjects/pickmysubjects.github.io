code: ENGR20003
year: 2026
learn:
  en: "What engineering materials like steel, concrete and timber are made of, how they fail, and basic statics."
  zh: "钢、混凝土、木材等工程材料的构成、失效方式，以及基础静力学。"
  zh-TW: "鋼、混凝土、木材等工程材料的構成、破壞方式，以及基礎靜力學。"
  ja: "鋼・コンクリート・木材など工学材料の構造と破壊の仕方、そして静力学の基礎。"
  ko: "강철·콘크리트·목재 등 공학 재료의 구조와 파손 방식, 기초 정역학."
  vi: "Vật liệu kỹ thuật như thép, bê tông, gỗ được cấu tạo, hỏng ra sao, cùng tĩnh học cơ bản."
  ms: "Bahan kejuruteraan seperti keluli, konkrit dan kayu: strukturnya, cara ia gagal, dan statik asas."
  id: "Bahan teknik seperti baja, beton, dan kayu: strukturnya, cara rusaknya, dan statika dasar."
  hi: "स्टील, कंक्रीट, लकड़ी जैसे मटीरियल किससे बने हैं, कैसे टूटते हैं, और बुनियादी स्टैटिक्स।"
outcomes:
  - en: "Explain strength, fracture and fatigue"
    zh: "解释强度、断裂和疲劳"
    zh-TW: "解釋強度、斷裂和疲勞"
    ja: "強度・破壊・疲労を説明する"
    ko: "강도·파괴·피로를 설명한다"
    vi: "Giải thích độ bền, nứt gãy và mỏi"
    ms: "Terangkan kekuatan, patah dan lesu"
    id: "Menjelaskan kekuatan, patahan, dan kelelahan"
    hi: "मजबूती, फ्रैक्चर और थकान समझाना"
  - en: "Solve forces in beams and trusses"
    zh: "求解梁和桁架中的力"
    zh-TW: "求解梁和桁架中的力"
    ja: "梁やトラスの力を解く"
    ko: "보와 트러스의 힘을 푼다"
    vi: "Tính lực trong dầm và giàn"
    ms: "Selesaikan daya dalam rasuk dan kekuda"
    id: "Menghitung gaya pada balok dan rangka"
    hi: "बीम और ट्रस में बल निकालना"
