code: MUSI10182
year: 2026
learn:
  en: "One-to-one lessons on your instrument plus group classes in improvisation, ending in a technical exam."
  zh: "乐器一对一课程加即兴小组课，期末进行技术考核。"
  zh-TW: "樂器一對一課程加即興小組課，期末進行技術考核。"
  ja: "楽器の個人レッスンと即興のグループ授業。最後に実技試験。"
  ko: "악기 개인 레슨과 즉흥 그룹 수업, 마지막에 실기 시험."
  vi: "Học riêng nhạc cụ cùng lớp nhóm về ứng tấu, kết thúc bằng bài thi kỹ thuật."
  ms: "Kelas individu alat muzik dan kelas kumpulan improvisasi, diakhiri ujian teknikal."
  id: "Les privat instrumen plus kelas grup improvisasi, diakhiri ujian teknik."
  hi: "वाद्य की व्यक्तिगत कक्षाएँ और इम्प्रोवाइज़ेशन की समूह कक्षाएँ, अंत में तकनीकी परीक्षा।"
outcomes:
  - en: "Build technique on your main instrument"
    zh: "提高主修乐器的技术"
    zh-TW: "提升主修樂器的技術"
    ja: "専攻楽器の技術を高める"
    ko: "주전공 악기 기술 키우기"
    vi: "Nâng kỹ thuật nhạc cụ chính"
    ms: "Bina teknik alat muzik utama"
    id: "Membangun teknik instrumen utama"
    hi: "मुख्य वाद्य की तकनीक बढ़ाना"
  - en: "Improvise over jazz chord changes"
    zh: "在爵士和弦进行上即兴"
    zh-TW: "在爵士和弦進行上即興"
    ja: "ジャズのコード進行で即興する"
    ko: "재즈 코드 진행 위에서 즉흥하기"
    vi: "Ứng tấu trên vòng hợp âm jazz"
    ms: "Berimprovisasi atas kord jaz"
    id: "Berimprovisasi di atas akor jazz"
    hi: "जैज़ कॉर्ड पर इम्प्रोवाइज़ करना"
  - en: "Plan practice that actually works"
    zh: "制定真正有效的练习计划"
    zh-TW: "制定真正有效的練習計畫"
    ja: "効果のある練習計画を立てる"
    ko: "효과적인 연습 계획 세우기"
    vi: "Lập kế hoạch luyện tập hiệu quả"
    ms: "Rancang latihan yang berkesan"
    id: "Menyusun latihan yang efektif"
    hi: "असरदार अभ्यास की योजना बनाना"
