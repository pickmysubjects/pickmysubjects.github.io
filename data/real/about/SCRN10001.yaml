code: SCRN10001
year: 2026
learn:
  en: "An intro to film: how films are made to mean through editing, sound and camera, plus film history and key theories."
  zh: "电影入门：剪辑、声音和摄影如何构成意义，以及电影史和主要理论。"
  zh-TW: "電影入門：剪輯、聲音和攝影如何構成意義，以及電影史和主要理論。"
  ja: "映画入門。編集・音・撮影が意味をどう作るか、映画史と主な理論を学ぶ。"
  ko: "영화 입문. 편집·사운드·촬영이 의미를 만드는 방식과 영화사, 주요 이론을 배운다."
  vi: "Nhập môn điện ảnh: dựng phim, âm thanh và máy quay tạo nghĩa ra sao, cùng lịch sử điện ảnh và các lý thuyết chính."
  ms: "Pengenalan filem: cara suntingan, bunyi dan kamera mencipta makna, serta sejarah filem dan teori utama."
  id: "Pengantar film: cara penyuntingan, suara dan kamera membangun makna, serta sejarah film dan teori utama."
  hi: "फ़िल्म का परिचय: एडिटिंग, ध्वनि और कैमरा अर्थ कैसे बनाते हैं, साथ में फ़िल्म इतिहास और मुख्य सिद्धांत।"
outcomes:
  - en: "Use film language to analyse scenes"
    zh: "运用电影语言分析镜头段落"
    zh-TW: "運用電影語言分析鏡頭段落"
    ja: "映画の文法を使ってシーンを分析する"
    ko: "영화 언어로 장면 분석하기"
    vi: "Dùng ngôn ngữ điện ảnh để phân tích cảnh phim"
    ms: "Guna bahasa filem untuk menganalisis babak"
    id: "Memakai bahasa film untuk menganalisis adegan"
    hi: "फ़िल्म भाषा से दृश्यों का विश्लेषण करना"
  - en: "Describe key periods of film history"
    zh: "描述电影史的主要时期"
    zh-TW: "描述電影史的主要時期"
    ja: "映画史の主な時代を説明する"
    ko: "영화사의 주요 시기 설명하기"
    vi: "Mô tả các giai đoạn chính của lịch sử điện ảnh"
    ms: "Huraikan zaman utama sejarah filem"
    id: "Menguraikan periode utama sejarah film"
    hi: "फ़िल्म इतिहास के मुख्य दौर बताना"
  - en: "Explain major film theories"
    zh: "说明主要的电影理论"
    zh-TW: "說明主要的電影理論"
    ja: "主な映画理論を説明する"
    ko: "주요 영화 이론 설명하기"
    vi: "Giải thích các lý thuyết điện ảnh chính"
    ms: "Terangkan teori filem utama"
    id: "Menjelaskan teori film utama"
    hi: "मुख्य फ़िल्म सिद्धांत समझाना"
