code: GEND30008
year: 2027
learn:
  en: "An internship with an organisation working on gender and sexuality, doing a research project or portfolio for them."
  zh: "在关注性别与性议题的机构实习，为其完成研究项目或作品集。"
  zh-TW: "在關注性別與性議題的機構實習，為其完成研究專案或作品集。"
  ja: "ジェンダーとセクシュアリティに取り組む団体でインターンをし、調査プロジェクトかポートフォリオを作る。"
  ko: "젠더와 섹슈얼리티를 다루는 기관에서 인턴십을 하며 연구 프로젝트나 포트폴리오를 수행한다."
  vi: "Thực tập tại tổ chức về giới và tính dục, làm dự án nghiên cứu hoặc hồ sơ công việc cho họ."
  ms: "Latihan industri di organisasi yang berkaitan dengan gender dan seksualiti, menjalankan projek penyelidikan atau portfolio untuk mereka."
  id: "Magang di organisasi yang menangani isu gender dan seksualitas, mengerjakan proyek riset atau portofolio untuk mereka."
  hi: "जेंडर और सेक्शुअलिटी पर काम करने वाली संस्था में इंटर्नशिप, उनके लिए रिसर्च प्रोजेक्ट या पोर्टफ़ोलियो बनाना।"
outcomes:
  - en: "Use research and writing skills at work"
    zh: "在工作中运用研究和写作能力"
    zh-TW: "在工作中運用研究和寫作能力"
    ja: "職場で調査・執筆スキルを使う"
    ko: "직장에서 연구·글쓰기 능력 활용하기"
    vi: "Vận dụng kỹ năng nghiên cứu và viết trong công việc"
    ms: "Guna kemahiran penyelidikan dan penulisan di tempat kerja"
    id: "Memakai keterampilan riset dan menulis di tempat kerja"
    hi: "काम में रिसर्च और लेखन कौशल इस्तेमाल करना"
  - en: "Work with a range of stakeholders professionally"
    zh: "与各方相关人员专业地合作"
    zh-TW: "與各方利害關係人專業地合作"
    ja: "さまざまな関係者とプロとして働く"
    ko: "다양한 이해관계자와 전문적으로 협업하기"
    vi: "Làm việc chuyên nghiệp với nhiều bên liên quan"
    ms: "Bekerja secara profesional dengan pelbagai pihak berkepentingan"
    id: "Bekerja secara profesional dengan berbagai pemangku kepentingan"
    hi: "अलग-अलग हितधारकों के साथ पेशेवर ढंग से काम करना"
  - en: "Reflect critically on your internship"
    zh: "批判性地反思实习经历"
    zh-TW: "批判性地反思實習經驗"
    ja: "インターン経験を批判的に振り返る"
    ko: "인턴십 경험을 비판적으로 성찰하기"
    vi: "Suy ngẫm có phản biện về kỳ thực tập"
    ms: "Renung secara kritis tentang latihan industri anda"
    id: "Merefleksikan pengalaman magang secara kritis"
    hi: "अपनी इंटर्नशिप पर आलोचनात्मक विचार करना"
