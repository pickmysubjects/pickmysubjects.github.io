code: MGMT90141
year: 2027
learn:
  en: "How business decisions are made from information, across finance, marketing, HR and supply chain, using case studies."
  zh: "通过案例学习如何基于信息做商业决策，涵盖金融、营销、人力资源和供应链。"
  zh-TW: "透過案例學習如何根據資訊做商業決策，涵蓋金融、行銷、人力資源與供應鏈。"
  ja: "情報をもとにした経営判断を、財務・マーケティング・人事・SCMの事例で学ぶ。"
  ko: "재무·마케팅·인사·공급망 사례로 정보에 기반한 경영 의사결정 배우기."
  vi: "Cách ra quyết định kinh doanh từ thông tin trong tài chính, marketing, nhân sự, chuỗi cung ứng qua tình huống."
  ms: "Cara keputusan perniagaan dibuat daripada maklumat dalam kewangan, pemasaran, HR, rantaian bekalan, melalui kes."
  id: "Cara keputusan bisnis dibuat dari informasi di keuangan, pemasaran, SDM, dan rantai pasok, lewat studi kasus."
  hi: "जानकारी से व्यावसायिक फ़ैसले कैसे लिए जाते हैं: वित्त, मार्केटिंग, HR और सप्लाई चेन के केस स्टडी के साथ।"
outcomes:
  - en: "Compare different approaches to decision making"
    zh: "比较不同的决策方法"
    zh-TW: "比較不同的決策方法"
    ja: "さまざまな意思決定の方法を比べる"
    ko: "여러 의사결정 방식 비교하기"
    vi: "So sánh các cách tiếp cận ra quyết định"
    ms: "Membandingkan pendekatan membuat keputusan"
    id: "Membandingkan berbagai pendekatan pengambilan keputusan"
    hi: "फ़ैसले लेने के अलग-अलग तरीक़ों की तुलना करना"
  - en: "Weigh costs, benefits and risks of analysis methods"
    zh: "权衡各种分析方法的成本、收益和风险"
    zh-TW: "權衡各種分析方法的成本、效益與風險"
    ja: "分析手法のコスト・利点・リスクを比べる"
    ko: "분석 방법의 비용·이점·위험 따져 보기"
    vi: "Cân nhắc chi phí, lợi ích, rủi ro của các phương pháp"
    ms: "Menimbang kos, manfaat dan risiko kaedah analisis"
    id: "Menimbang biaya, manfaat, dan risiko metode analisis"
    hi: "विश्लेषण तरीक़ों की लागत, फ़ायदे और जोखिम तौलना"
