code: ELEN90011
year: 2027
learn:
  en: "A supervised research study or placement with an electrical engineering research group, on topics such as telecom networks."
  zh: "在电气工程研究组接受指导做研究或实习，课题如电信网络。"
  zh-TW: "在電機工程研究組接受指導做研究或實習，課題如電信網路。"
  ja: "電気電子工学の研究グループで指導を受けながら行う研究や実習。テーマは通信ネットワークなど。"
  ko: "전기전자공학 연구실에서 지도를 받으며 하는 연구 또는 실습. 통신 네트워크 같은 주제."
  vi: "Nghiên cứu hoặc thực tập có hướng dẫn tại nhóm nghiên cứu kỹ thuật điện, với các đề tài như mạng viễn thông."
  ms: "Kajian atau penempatan berpenyelia dalam kumpulan penyelidikan kejuruteraan elektrik, dengan topik seperti rangkaian telekom."
  id: "Riset atau magang dengan bimbingan di kelompok riset teknik elektro, dengan topik seperti jaringan telekomunikasi."
  hi: "इलेक्ट्रिकल इंजीनियरिंग रिसर्च ग्रुप में निगरानी में शोध या प्लेसमेंट, जैसे टेलीकॉम नेटवर्क के विषय।"
outcomes:
  - en: "Keep up with current trends in the telecom industry"
    zh: "了解电信行业的最新趋势"
    zh-TW: "了解電信產業的最新趨勢"
    ja: "通信業界の最新動向を追う"
    ko: "통신 산업의 최신 동향 파악하기"
    vi: "Nắm bắt xu hướng mới trong ngành viễn thông"
    ms: "Mengikuti trend terkini industri telekom"
    id: "Mengikuti tren terbaru industri telekomunikasi"
    hi: "टेलीकॉम उद्योग के मौजूदा रुझानों से अपडेट रहना"
  - en: "Get first-hand experience of basic telecom industry practice"
    zh: "亲身体验电信行业的基本做法"
    zh-TW: "親身體驗電信產業的基本做法"
    ja: "通信業界の基本的な実務を直接経験する"
    ko: "통신 산업의 기본 실무 직접 경험하기"
    vi: "Trải nghiệm trực tiếp các thực hành cơ bản của ngành viễn thông"
    ms: "Mendapat pengalaman langsung amalan asas industri telekom"
    id: "Mendapat pengalaman langsung praktik dasar industri telekomunikasi"
    hi: "टेलीकॉम उद्योग के बुनियादी कामकाज का सीधा अनुभव"
