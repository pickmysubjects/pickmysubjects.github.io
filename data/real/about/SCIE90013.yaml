code: SCIE90013
year: 2027
learn:
  en: "Writing and presenting your own research effectively, with repeated practice and feedback. You must be doing research."
  zh: "有效地写作和展示自己的研究，反复练习并获得反馈。须正在做研究才能选。"
  zh-TW: "有效地寫作與發表自己的研究，反覆練習並獲得回饋。須正在做研究才能選。"
  ja: "自分の研究を効果的に書き、発表する。練習とフィードバックを重ねる。研究中であることが条件。"
  ko: "자신의 연구를 효과적으로 쓰고 발표하기, 반복 연습과 피드백. 연구 중이어야 수강 가능."
  vi: "Viết và trình bày nghiên cứu của bạn hiệu quả, luyện tập và nhận phản hồi. Phải đang làm nghiên cứu."
  ms: "Menulis dan membentang penyelidikan anda dengan berkesan, dengan latihan dan maklum balas. Mesti sedang menyelidik."
  id: "Menulis dan mempresentasikan riset sendiri secara efektif, dengan latihan dan umpan balik. Wajib sedang meneliti."
  hi: "अपने शोध को प्रभावी ढंग से लिखना और प्रस्तुत करना, अभ्यास और प्रतिक्रिया के साथ। शोध करना ज़रूरी।"
outcomes:
  - en: "Describe how scientists share their research"
    zh: "描述科学家分享研究的各种方式"
    zh-TW: "描述科學家分享研究的各種方式"
    ja: "研究者が成果を伝える方法を説明する"
    ko: "과학자가 연구를 공유하는 방식 설명하기"
    vi: "Mô tả cách nhà khoa học chia sẻ nghiên cứu"
    ms: "Menerangkan cara saintis berkongsi penyelidikan"
    id: "Menjelaskan cara ilmuwan membagikan riset"
    hi: "वैज्ञानिक अपना शोध कैसे साझा करते हैं, बताना"
  - en: "Write about your research clearly"
    zh: "清晰地撰写自己的研究"
    zh-TW: "清楚地撰寫自己的研究"
    ja: "自分の研究をわかりやすく書く"
    ko: "자신의 연구를 명확하게 쓰기"
    vi: "Viết về nghiên cứu của mình rõ ràng"
    ms: "Menulis tentang penyelidikan anda dengan jelas"
    id: "Menulis tentang riset sendiri dengan jelas"
    hi: "अपने शोध के बारे में स्पष्ट लिखना"
  - en: "Give an effective research talk"
    zh: "做有效的研究报告"
    zh-TW: "做有效的研究報告"
    ja: "効果的な研究発表をする"
    ko: "효과적인 연구 발표하기"
    vi: "Thuyết trình nghiên cứu hiệu quả"
    ms: "Menyampaikan pembentangan penyelidikan yang berkesan"
    id: "Menyampaikan presentasi riset yang efektif"
    hi: "प्रभावी शोध प्रस्तुति देना"
