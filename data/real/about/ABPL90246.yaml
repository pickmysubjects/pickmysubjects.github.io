code: ABPL90246
year: 2027
learn:
  en: "How goods, services and jobs shape cities and regions, and how planning can balance economic growth with social needs."
  zh: "商品、服务和就业如何塑造城市与区域，以及规划如何平衡经济发展与社会需求。"
  zh-TW: "商品、服務與就業如何形塑城市與區域，以及規劃如何平衡經濟發展與社會需求。"
  ja: "財・サービス・雇用が都市と地域をどう形づくり、計画が経済と社会的ニーズをどう両立させるか。"
  ko: "재화·서비스·일자리가 도시와 지역을 어떻게 형성하고, 계획이 경제와 사회적 필요를 어떻게 조율하는지."
  vi: "Hàng hóa, dịch vụ và việc làm định hình đô thị, vùng ra sao, và quy hoạch cân bằng kinh tế với xã hội."
  ms: "Bagaimana barangan, perkhidmatan dan pekerjaan membentuk bandar dan wilayah, serta peranan perancangan."
  id: "Bagaimana barang, jasa, dan pekerjaan membentuk kota dan wilayah, serta peran perencanaan."
  hi: "वस्तुएं, सेवाएं और नौकरियां शहरों-क्षेत्रों को कैसे आकार देती हैं, और नियोजन संतुलन कैसे बनाता है।"
outcomes:
  - en: "Describe how urban economic thinking developed"
    zh: "描述城市经济理论的发展"
    zh-TW: "描述城市經濟理論的發展"
    ja: "都市経済の考え方の発展を説明する"
    ko: "도시 경제 사고의 발전 설명하기"
    vi: "Mô tả sự phát triển của kinh tế đô thị"
    ms: "Menerangkan perkembangan pemikiran ekonomi bandar"
    id: "Menjelaskan perkembangan pemikiran ekonomi kota"
    hi: "शहरी आर्थिक चिंतन का विकास बताना"
  - en: "Compare economic development across cities and regions"
    zh: "比较不同城市和区域的经济发展"
    zh-TW: "比較不同城市與區域的經濟發展"
    ja: "都市・地域の経済発展を比較する"
    ko: "도시와 지역의 경제 발전 비교하기"
    vi: "So sánh phát triển kinh tế giữa các vùng"
    ms: "Membandingkan pembangunan ekonomi antara bandar"
    id: "Membandingkan pembangunan ekonomi antarkota"
    hi: "शहरों-क्षेत्रों के आर्थिक विकास की तुलना"
