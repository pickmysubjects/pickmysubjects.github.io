code: PHIL30053
year: 2026
learn:
  en: "How language represents the world and helps people coordinate, from classic theories of meaning to social uses of words."
  zh: "语言如何表征世界、帮助人们协作，从经典意义理论到词语的社会用途。"
  zh-TW: "語言如何表徵世界、幫助人們協作，從經典意義理論到詞語的社會用途。"
  ja: "言語が世界をどう表し人々の協調を助けるか、古典的な意味論から言葉の社会的な使い方まで学ぶ。"
  ko: "언어가 세상을 어떻게 표상하고 사람들의 협력을 돕는지, 고전 의미론부터 말의 사회적 쓰임까지 배운다."
  vi: "Ngôn ngữ biểu đạt thế giới và giúp con người phối hợp ra sao, từ lý thuyết ý nghĩa kinh điển đến cách dùng từ trong xã hội."
  ms: "Cara bahasa mewakili dunia dan membantu orang berkoordinasi, dari teori makna klasik hingga penggunaan sosial kata."
  id: "Cara bahasa merepresentasikan dunia dan membantu orang berkoordinasi, dari teori makna klasik sampai penggunaan sosial kata."
  hi: "भाषा दुनिया को कैसे दर्शाती है और लोगों के तालमेल में कैसे मदद करती है, अर्थ के क्लासिक सिद्धांतों से शब्दों के सामाजिक उपयोग तक।"
outcomes:
  - en: "Explain classic theories of meaning and reference"
    zh: "说明关于意义和指称的经典理论"
    zh-TW: "說明關於意義和指稱的經典理論"
    ja: "意味と指示の古典的理論を説明する"
    ko: "의미와 지시에 관한 고전 이론 설명하기"
    vi: "Giải thích các lý thuyết kinh điển về ý nghĩa và quy chiếu"
    ms: "Terangkan teori klasik makna dan rujukan"
    id: "Menjelaskan teori klasik makna dan referensi"
    hi: "अर्थ और संदर्भ के क्लासिक सिद्धांत समझाना"
  - en: "Analyse how language works in social life"
    zh: "分析语言在社会生活中如何运作"
    zh-TW: "分析語言在社會生活中如何運作"
    ja: "社会生活で言語がどう働くか分析する"
    ko: "사회생활에서 언어가 작동하는 방식 분석하기"
    vi: "Phân tích ngôn ngữ vận hành thế nào trong đời sống xã hội"
    ms: "Analisis cara bahasa berfungsi dalam kehidupan sosial"
    id: "Menganalisis cara bahasa bekerja dalam kehidupan sosial"
    hi: "सामाजिक जीवन में भाषा कैसे काम करती है, विश्लेषण करना"
  - en: "Assess competing views in philosophy of language"
    zh: "评估语言哲学中相互竞争的观点"
    zh-TW: "評估語言哲學中相互競爭的觀點"
    ja: "言語哲学の対立する見解を評価する"
    ko: "언어철학의 경쟁하는 견해 평가하기"
    vi: "Đánh giá các quan điểm đối lập trong triết học ngôn ngữ"
    ms: "Nilai pandangan bersaing dalam falsafah bahasa"
    id: "Menilai pandangan yang bersaing dalam filsafat bahasa"
    hi: "भाषा-दर्शन के प्रतिस्पर्धी मतों को परखना"
