code: MGMT90032
year: 2027
learn:
  en: "How organisations turn inputs into goods and services, and how better processes improve cost, quality and delivery."
  zh: "组织如何把投入转化为产品和服务，以及改进流程如何提升成本、质量和交付。"
  zh-TW: "組織如何將投入轉化為產品與服務，以及改善流程如何提升成本、品質與交貨。"
  ja: "組織が投入を製品・サービスに変える仕組みと、プロセス改善でコスト・品質・納期を良くする方法。"
  ko: "조직이 투입물을 제품·서비스로 바꾸는 방식과 프로세스 개선으로 비용·품질·납기를 높이는 법."
  vi: "Tổ chức biến đầu vào thành hàng hóa, dịch vụ thế nào, và quy trình tốt hơn cải thiện chi phí, chất lượng, giao hàng."
  ms: "Cara organisasi menukar input kepada barang dan perkhidmatan, dan proses lebih baik memperbaiki kos, kualiti, penghantaran."
  id: "Cara organisasi mengubah input menjadi barang dan jasa, dan proses yang lebih baik memperbaiki biaya, mutu, pengiriman."
  hi: "संगठन इनपुट को माल और सेवाओं में कैसे बदलते हैं, और बेहतर प्रक्रियाएँ लागत, गुणवत्ता व डिलीवरी कैसे सुधारती हैं।"
outcomes:
  - en: "Use tools to analyse how processes behave"
    zh: "用分析工具理解流程运作"
    zh-TW: "用分析工具理解流程運作"
    ja: "分析手法でプロセスの動きを理解する"
    ko: "분석 도구로 프로세스 작동 이해하기"
    vi: "Dùng công cụ phân tích cách quy trình vận hành"
    ms: "Guna alat untuk menganalisis kelakuan proses"
    id: "Memakai alat untuk menganalisis perilaku proses"
    hi: "प्रक्रियाओं के व्यवहार का विश्लेषण करने के साधन अपनाना"
  - en: "Link operations to strategy and results"
    zh: "把运营与战略和绩效联系起来"
    zh-TW: "將營運與策略和績效連結起來"
    ja: "オペレーションを戦略と成果に結びつける"
    ko: "운영을 전략·성과와 연결하기"
    vi: "Gắn vận hành với chiến lược và kết quả"
    ms: "Mengaitkan operasi dengan strategi dan hasil"
    id: "Mengaitkan operasi dengan strategi dan hasil"
    hi: "संचालन को रणनीति और नतीजों से जोड़ना"
