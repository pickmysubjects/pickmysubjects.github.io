code: ACCT30014
year: 2026
learn:
  en: "Business fraud from an accountant's view: how it happens, how to prevent and detect it, and investigating it."
  zh: "从会计角度看商业舞弊：如何发生、如何预防和发现，以及如何调查。"
  zh-TW: "從會計角度看企業舞弊：如何發生、如何預防與偵測，以及如何調查。"
  ja: "会計の視点で見る企業不正：起こり方、防止と発見、調査の方法。"
  ko: "회계사 관점의 기업 부정: 어떻게 일어나고, 어떻게 막고 찾아내며 조사하는지."
  vi: "Gian lận kinh doanh dưới góc nhìn kế toán: cách xảy ra, cách phòng ngừa, phát hiện và điều tra."
  ms: "Penipuan perniagaan dari kaca mata akauntan: cara ia berlaku, cara cegah, kesan dan siasat."
  id: "Kecurangan bisnis dari sudut akuntan: bagaimana terjadi, cara mencegah, mendeteksi, dan menyelidikinya."
  hi: "अकाउंटेंट की नज़र से बिज़नेस फ़्रॉड: यह कैसे होता है, इसे कैसे रोकें, पकड़ें और जाँचें।"
outcomes:
  - en: "Tell apart common types of fraud and fraud schemes"
    zh: "区分常见的舞弊类型和手法"
    zh-TW: "分辨常見的舞弊類型與手法"
    ja: "よくある不正の種類と手口を見分ける"
    ko: "흔한 부정 유형과 수법 구별"
    vi: "Phân biệt các loại và thủ đoạn gian lận phổ biến"
    ms: "Bezakan jenis dan skim penipuan yang biasa"
    id: "Membedakan jenis dan skema kecurangan yang umum"
    hi: "आम तरह के फ़्रॉड और उनकी तरकीबें पहचानना"
  - en: "Recommend controls that help prevent fraud"
    zh: "提出防范舞弊的治理和控制措施"
    zh-TW: "提出防範舞弊的治理與控制措施"
    ja: "不正を防ぐ統制の仕組みを提案する"
    ko: "부정 예방에 도움이 되는 통제 제안"
    vi: "Đề xuất biện pháp kiểm soát giúp ngăn gian lận"
    ms: "Cadangkan kawalan untuk mencegah penipuan"
    id: "Merekomendasikan kontrol untuk mencegah kecurangan"
    hi: "फ़्रॉड रोकने वाले कंट्रोल सुझाना"
  - en: "Apply methods for detecting fraud"
    zh: "运用舞弊侦测方法"
    zh-TW: "運用舞弊偵測方法"
    ja: "不正を見つける手法を使う"
    ko: "부정 적발 방법 적용"
    vi: "Áp dụng phương pháp phát hiện gian lận"
    ms: "Guna kaedah mengesan penipuan"
    id: "Menerapkan metode pendeteksian kecurangan"
    hi: "फ़्रॉड पकड़ने के तरीके लागू करना"
