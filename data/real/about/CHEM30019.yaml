code: CHEM30019
year: 2027
learn:
  en: "Computer and data methods in chemical biology: analysing omics data, predicting protein structures and designing drugs."
  zh: "化学生物学中的计算与数据方法：分析组学数据、预测蛋白质结构和药物设计。"
  zh-TW: "化學生物學中的計算與資料方法：分析體學資料、預測蛋白質結構和藥物設計。"
  ja: "化学生物学の計算・データ手法：オミクスデータ解析、タンパク質構造予測、創薬設計。"
  ko: "화학생물학의 계산·데이터 방법: 오믹스 데이터 분석, 단백질 구조 예측, 약물 설계."
  vi: "Phương pháp tính toán và dữ liệu trong hóa sinh học: phân tích dữ liệu omics, dự đoán cấu trúc protein và thiết kế thuốc."
  ms: "Kaedah komputer dan data dalam biologi kimia: analisis data omik, ramal struktur protein dan reka bentuk ubat."
  id: "Metode komputasi dan data dalam biologi kimia: analisis data omik, prediksi struktur protein, dan desain obat."
  hi: "केमिकल बायोलॉजी में कंप्यूटर व डेटा तरीके: ओमिक्स डेटा का विश्लेषण, प्रोटीन संरचना का अनुमान और दवा डिज़ाइन।"
outcomes:
  - en: "Analyse large omics datasets"
    zh: "分析大规模组学数据"
    zh-TW: "分析大規模體學資料"
    ja: "大規模なオミクスデータを解析する"
    ko: "대규모 오믹스 데이터 분석하기"
    vi: "Phân tích bộ dữ liệu omics lớn"
    ms: "Analisis set data omik yang besar"
    id: "Menganalisis data omik berskala besar"
    hi: "बड़े ओमिक्स डेटासेट का विश्लेषण करना"
  - en: "Predict and design protein structures"
    zh: "预测和设计蛋白质结构"
    zh-TW: "預測和設計蛋白質結構"
    ja: "タンパク質構造を予測・設計する"
    ko: "단백질 구조 예측·설계하기"
    vi: "Dự đoán và thiết kế cấu trúc protein"
    ms: "Ramal dan reka struktur protein"
    id: "Memprediksi dan merancang struktur protein"
    hi: "प्रोटीन संरचना का अनुमान और डिज़ाइन करना"
  - en: "Use docking to design and improve drug molecules"
    zh: "用分子对接设计和优化药物分子"
    zh-TW: "用分子對接設計和最佳化藥物分子"
    ja: "ドッキングで薬の分子を設計・改良する"
    ko: "도킹으로 약물 분자 설계·개선하기"
    vi: "Dùng docking để thiết kế và cải thiện phân tử thuốc"
    ms: "Guna docking untuk reka dan baiki molekul ubat"
    id: "Memakai docking untuk merancang dan memperbaiki molekul obat"
    hi: "डॉकिंग से दवा अणु डिज़ाइन और बेहतर करना"
