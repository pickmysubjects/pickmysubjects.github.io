code: ABPL90430
year: 2027
learn:
  en: "A design studio co-led with Indigenous partners on climate-resilient landscape and architecture for a real site."
  zh: "与原住民伙伴共同主导的设计工作室，为真实场地做应对气候的景观与建筑设计。"
  zh-TW: "與原住民夥伴共同主導的設計工作室，為真實場地做因應氣候的景觀與建築設計。"
  ja: "先住民と共同で率いるスタジオで、実際の敷地に気候に強い景観と建築を設計する。"
  ko: "원주민 파트너와 함께 이끄는 스튜디오로, 실제 부지의 기후 회복력 있는 조경·건축을 설계합니다."
  vi: "Studio đồng dẫn dắt với người bản địa, thiết kế cảnh quan và kiến trúc chống chịu khí hậu cho khu đất thật."
  ms: "Studio dipimpin bersama Orang Asli untuk landskap dan seni bina tahan iklim di tapak sebenar."
  id: "Studio yang dipimpin bersama mitra Pribumi untuk lanskap dan arsitektur tahan iklim di lokasi nyata."
  hi: "मूल निवासी साझेदारों के साथ स्टूडियो, असली साइट के लिए जलवायु-सहनशील लैंडस्केप और वास्तुकला।"
outcomes:
  - en: "Map climate risks and trade-offs on urban land"
    zh: "绘制城市用地的气候风险与取舍"
    zh-TW: "繪製城市用地的氣候風險與取捨"
    ja: "都市の土地の気候リスクを図示する"
    ko: "도시 토지의 기후 위험과 상충관계 도면화하기"
    vi: "Lập bản đồ rủi ro khí hậu trên đất đô thị"
    ms: "Memetakan risiko iklim tanah bandar"
    id: "Memetakan risiko iklim lahan kota"
    hi: "शहरी भूमि पर जलवायु जोखिम का मानचित्र"
  - en: "Design with Country and community"
    zh: "与原住民的土地（Country）和社区共同设计"
    zh-TW: "與原住民的土地（Country）和社區共同設計"
    ja: "先住民の土地（Country）と地域とともに設計する"
    ko: "원주민의 땅(Country)·지역사회와 함께 설계하기"
    vi: "Thiết kế cùng vùng đất bản địa (Country) và cộng đồng"
    ms: "Mereka bersama tanah Orang Asli (Country) dan komuniti"
    id: "Mendesain bersama tanah adat (Country) dan komunitas"
    hi: "आदिवासी भूमि (Country) और समुदाय के साथ डिज़ाइन"
