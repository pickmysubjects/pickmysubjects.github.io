code: AGRI30042
year: 2026
learn:
  en: "Plant diseases: identifying pathogens, how disease spreads and hurts crops, and how to control it."
  zh: "植物病害：识别病原体、病害传播及对作物的影响与防治。"
  zh-TW: "植物病害：辨識病原體、病害傳播與對作物的影響及防治。"
  ja: "植物病害：病原体の同定、広がり方、作物への影響と防除。"
  ko: "식물 병해: 병원체 동정, 병의 확산과 작물 피해, 방제."
  vi: "Bệnh cây: nhận diện mầm bệnh, cách bệnh lây lan, gây hại và cách phòng trừ."
  ms: "Penyakit tumbuhan: kenal pasti patogen, cara ia merebak, kesannya dan kawalan."
  id: "Penyakit tanaman: mengenali patogen, cara menyebar, dampaknya, dan pengendaliannya."
  hi: "पौधों के रोग: रोगजनकों की पहचान, फैलाव, फसल पर असर और नियंत्रण।"
outcomes:
  - en: "Identify plant pathogens with lab and DNA tools"
    zh: "用实验和DNA工具鉴定病原体"
    zh-TW: "用實驗與DNA工具鑑定病原體"
    ja: "実験とDNA手法で病原体を同定する"
    ko: "실험·DNA 도구로 병원체 동정하기"
    vi: "Nhận diện mầm bệnh bằng thí nghiệm và DNA"
    ms: "Kenal pasti patogen dengan alat makmal dan DNA"
    id: "Mengidentifikasi patogen dengan lab dan DNA"
    hi: "लैब और DNA तरीकों से रोगजनक पहचानें"
  - en: "Explain how disease epidemics develop"
    zh: "解释病害流行如何发展"
    zh-TW: "解釋病害流行如何發展"
    ja: "病害の流行の仕組みを説明する"
    ko: "병해 유행 과정 설명하기"
    vi: "Giải thích dịch bệnh cây phát triển ra sao"
    ms: "Terangkan perkembangan wabak penyakit"
    id: "Menjelaskan perkembangan epidemi penyakit"
    hi: "रोग महामारी कैसे बढ़ती है, समझाएँ"
  - en: "Plan integrated disease control"
    zh: "制定综合病害防治方案"
    zh-TW: "制定綜合病害防治方案"
    ja: "総合的な病害防除を計画する"
    ko: "종합 병해 방제 계획하기"
    vi: "Lập kế hoạch phòng trừ bệnh tổng hợp"
    ms: "Rancang kawalan penyakit bersepadu"
    id: "Merencanakan pengendalian penyakit terpadu"
    hi: "एकीकृत रोग नियंत्रण की योजना बनाएँ"
