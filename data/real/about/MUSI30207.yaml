code: MUSI30207
year: 2026
learn:
  en: "A second semester of small vocal ensembles, going deeper into chamber repertoire and opera ensembles. Pass/fail."
  zh: "声乐重唱第二学期，深入室内声乐与歌剧重唱曲目。及格制。"
  zh-TW: "聲樂重唱第二學期，深入室內聲樂與歌劇重唱曲目。及格制。"
  ja: "重唱の後期。室内声楽とオペラ重唱をさらに深める。合否判定。"
  ko: "성악 중창 2학기. 실내 성악과 오페라 중창을 더 깊이. 합격/불합격."
  vi: "Học kỳ hai hát nhóm nhỏ, đi sâu tiết mục thính phòng và opera. Đạt/không đạt."
  ms: "Semester kedua ensembel vokal, mendalami repertoir kamar dan opera. Lulus/gagal."
  id: "Semester kedua ansambel vokal, mendalami repertoar kamar dan opera. Lulus/gagal."
  hi: "गायन समूह का दूसरा सत्र, चैम्बर और ओपेरा रचनाओं में गहराई। पास/फ़ेल।"
outcomes:
  - en: "Shape character and relationships in ensemble singing"
    zh: "在重唱中塑造角色与关系"
    zh-TW: "在重唱中塑造角色與關係"
    ja: "重唱で役柄と関係性を表す"
    ko: "중창에서 인물과 관계 표현하기"
    vi: "Thể hiện nhân vật và mối quan hệ khi hát nhóm"
    ms: "Bentuk watak dan hubungan dalam nyanyian"
    id: "Membangun karakter dan relasi dalam bernyanyi"
    hi: "समूह गायन में चरित्र और संबंध गढ़ना"
  - en: "Learn new vocal ensemble repertoire"
    zh: "学习新的重唱曲目"
    zh-TW: "學習新的重唱曲目"
    ja: "新しい重唱曲を学ぶ"
    ko: "새 중창 레퍼토리 익히기"
    vi: "Học tiết mục hát nhóm mới"
    ms: "Pelajari repertoir ensembel vokal baharu"
    id: "Mempelajari repertoar ansambel vokal baru"
    hi: "नई गायन समूह रचनाएँ सीखना"
  - en: "Perform with a polished, unified group sound"
    zh: "以统一而精致的整体声音演出"
    zh-TW: "以統一而精緻的整體聲音演出"
    ja: "まとまった洗練された響きで演奏する"
    ko: "통일되고 다듬어진 소리로 공연하기"
    vi: "Biểu diễn với âm thanh nhóm hòa quyện"
    ms: "Persembahan dengan bunyi kumpulan yang padu"
    id: "Tampil dengan suara grup yang padu"
    hi: "एकसार, निखरी समूह ध्वनि के साथ प्रस्तुति"
