code: MULT90063
year: 2027
learn:
  en: "Basics of quantum computing: quantum logic, error correction and algorithms, with lab work on real programming tools."
  zh: "量子计算基础：量子逻辑操作、纠错与量子算法，并在实验课中使用编程工具。"
  zh-TW: "量子計算基礎：量子邏輯操作、錯誤更正與量子演算法，並在實驗課使用程式工具。"
  ja: "量子計算の基礎：量子論理、誤り訂正、量子アルゴリズム。実習でプログラミング環境を使う。"
  ko: "양자컴퓨팅 기초: 양자 논리 연산, 오류 정정, 양자 알고리즘, 실습에서 프로그래밍 도구 사용."
  vi: "Cơ bản về điện toán lượng tử: cổng logic, sửa lỗi, thuật toán, thực hành với công cụ lập trình."
  ms: "Asas pengkomputeran kuantum: logik kuantum, pembetulan ralat, algoritma, dengan amali alat pengaturcaraan."
  id: "Dasar komputasi kuantum: logika kuantum, koreksi galat, algoritma, praktikum dengan alat pemrograman."
  hi: "क्वांटम कंप्यूटिंग की बुनियाद: क्वांटम लॉजिक, एरर करेक्शन, एल्गोरिदम, लैब में प्रोग्रामिंग टूल।"
outcomes:
  - en: "Explain how quantum logic operations work"
    zh: "解释量子逻辑操作的原理"
    zh-TW: "解釋量子邏輯操作的原理"
    ja: "量子論理演算の仕組みを説明する"
    ko: "양자 논리 연산 원리 설명하기"
    vi: "Giải thích cách hoạt động của phép toán logic lượng tử"
    ms: "Menerangkan cara operasi logik kuantum berfungsi"
    id: "Menjelaskan cara kerja operasi logika kuantum"
    hi: "क्वांटम लॉजिक ऑपरेशन कैसे काम करते हैं, समझाना"
  - en: "Program and simulate quantum algorithms"
    zh: "编程并模拟量子算法"
    zh-TW: "撰寫並模擬量子演算法"
    ja: "量子アルゴリズムをプログラムし試す"
    ko: "양자 알고리즘 프로그래밍·시뮬레이션하기"
    vi: "Lập trình và mô phỏng thuật toán lượng tử"
    ms: "Memprogram dan mensimulasi algoritma kuantum"
    id: "Memprogram dan menyimulasikan algoritma kuantum"
    hi: "क्वांटम एल्गोरिदम प्रोग्राम और सिमुलेट करना"
