code: LAWS30029
year: 2027
learn:
  en: "Abuse at work in Australia, from harassment and bullying to surveillance and wage theft, and what the law can do about it."
  zh: "澳大利亚职场中的不当行为：从骚扰、霸凌到监控和克扣工资，以及法律能怎么应对。"
  zh-TW: "澳洲職場中的不當行為：從騷擾、霸凌到監控和剋扣薪資，以及法律能怎麼應對。"
  ja: "オーストラリアの職場での加害行為：ハラスメントやいじめから監視・賃金未払いまで、法に何ができるか。"
  ko: "호주 직장 내 학대 행위: 괴롭힘·따돌림부터 감시·임금 체불까지, 그리고 법이 할 수 있는 일."
  vi: "Hành vi lạm dụng nơi làm việc ở Úc, từ quấy rối, bắt nạt đến giám sát và quỵt lương, và pháp luật có thể làm gì."
  ms: "Penderaan di tempat kerja di Australia, daripada gangguan dan buli hingga pengawasan dan kecurian gaji, serta apa yang boleh dibuat oleh undang-undang."
  id: "Perilaku kasar di tempat kerja di Australia, dari pelecehan dan perundungan hingga pengawasan dan pencurian upah, serta apa yang bisa dilakukan hukum."
  hi: "ऑस्ट्रेलिया में कार्यस्थल पर दुर्व्यवहार: उत्पीड़न और बुलिंग से निगरानी और वेतन चोरी तक, और कानून इसमें क्या कर सकता है।"
outcomes:
  - en: "Apply legal rules to workplace abuse scenarios"
    zh: "把法律规则用到职场不当行为情境中"
    zh-TW: "把法律規則用到職場不當行為情境中"
    ja: "職場での加害行為の事例に法を当てはめる"
    ko: "직장 내 학대 사례에 법 규칙 적용하기"
    vi: "Áp dụng quy định pháp luật vào tình huống lạm dụng nơi làm việc"
    ms: "Gunakan peraturan undang-undang pada senario penderaan di tempat kerja"
    id: "Menerapkan aturan hukum pada skenario kekerasan di tempat kerja"
    hi: "कार्यस्थल दुर्व्यवहार के मामलों पर कानूनी नियम लागू करना"
  - en: "Explain workers' rights and where to seek redress"
    zh: "说明劳动者的权利和维权途径"
    zh-TW: "說明勞工的權利和救濟途徑"
    ja: "労働者の権利と救済の窓口を説明する"
    ko: "노동자의 권리와 구제 경로 설명하기"
    vi: "Giải thích quyền của người lao động và nơi khiếu nại"
    ms: "Terangkan hak pekerja dan saluran mendapatkan pembelaan"
    id: "Menjelaskan hak pekerja dan jalur mencari pemulihan"
    hi: "कर्मचारियों के अधिकार और शिकायत के रास्ते समझाना"
  - en: "Weigh how well current laws and remedies work"
    zh: "评估现有法律和补救措施的效果"
    zh-TW: "評估現有法律和救濟措施的效果"
    ja: "今の法律や救済策がどれだけ機能するかを評価する"
    ko: "현행 법과 구제 수단의 효과 평가하기"
    vi: "Đánh giá luật và biện pháp khắc phục hiện nay hiệu quả đến đâu"
    ms: "Nilai keberkesanan undang-undang dan remedi sedia ada"
    id: "Menilai efektivitas hukum dan upaya pemulihan saat ini"
    hi: "मौजूदा कानून और उपाय कितने कारगर हैं, आँकना"
