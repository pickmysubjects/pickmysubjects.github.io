code: INDO30020
year: 2026
learn:
  en: "How Indonesia was built into one nation: nationalism, Islam, the military, development, democracy and pop culture, in Indonesian."
  zh: "印尼如何凝聚成一个国家：民族主义、伊斯兰、军队、发展、民主与流行文化，用印尼语授课。"
  zh-TW: "印尼如何凝聚成一個國家：民族主義、伊斯蘭、軍隊、發展、民主與流行文化，用印尼語授課。"
  ja: "インドネシアはどう一つの国になったか。民族主義、イスラム、軍、開発、民主化、大衆文化。授業はインドネシア語。"
  ko: "인도네시아는 어떻게 한 나라가 되었나. 민족주의, 이슬람, 군, 개발, 민주화, 대중문화. 인도네시아어 수업."
  vi: "Indonesia trở thành một quốc gia thống nhất ra sao: chủ nghĩa dân tộc, Hồi giáo, quân đội, phát triển, dân chủ, văn hóa đại chúng."
  ms: "Bagaimana Indonesia dibina sebagai satu negara: nasionalisme, Islam, tentera, pembangunan, demokrasi dan budaya pop, dalam bahasa Indonesia."
  id: "Bagaimana Indonesia dibangun menjadi satu bangsa: nasionalisme, Islam, militer, pembangunan, demokrasi dan budaya pop, dalam bahasa Indonesia."
  hi: "इंडोनेशिया एक राष्ट्र कैसे बना: राष्ट्रवाद, इस्लाम, सेना, विकास, लोकतंत्र और लोकप्रिय संस्कृति, इंडोनेशियाई में।"
outcomes:
  - en: "Explain the ideas used to unite Indonesia"
    zh: "解释用来统一印尼的各种思想"
    zh-TW: "解釋用來統一印尼的各種思想"
    ja: "インドネシア統一に使われた思想を説明する"
    ko: "인도네시아 통합에 쓰인 사상 설명하기"
    vi: "Giải thích các tư tưởng dùng để thống nhất Indonesia"
    ms: "Terangkan idea yang digunakan untuk menyatukan Indonesia"
    id: "Menjelaskan gagasan yang dipakai untuk menyatukan Indonesia"
    hi: "इंडोनेशिया को एक करने वाले विचारों को समझाना"
  - en: "Analyse regionalism and separatist movements"
    zh: "分析地方主义和分离运动"
    zh-TW: "分析地方主義和分離運動"
    ja: "地域主義と分離独立運動を分析する"
    ko: "지역주의와 분리주의 운동 분석하기"
    vi: "Phân tích chủ nghĩa địa phương và phong trào ly khai"
    ms: "Analisis kedaerahan dan gerakan pemisah"
    id: "Menganalisis kedaerahan dan gerakan separatis"
    hi: "क्षेत्रवाद और अलगाववादी आंदोलनों का विश्लेषण करना"
  - en: "Discuss Indonesian politics and history in Indonesian"
    zh: "用印尼语讨论印尼政治与历史"
    zh-TW: "用印尼語討論印尼政治與歷史"
    ja: "インドネシアの政治と歴史をインドネシア語で論じる"
    ko: "인도네시아 정치와 역사를 인도네시아어로 토론하기"
    vi: "Thảo luận chính trị, lịch sử Indonesia bằng tiếng Indonesia"
    ms: "Bincangkan politik dan sejarah Indonesia dalam bahasa Indonesia"
    id: "Membahas politik dan sejarah Indonesia dalam bahasa Indonesia"
    hi: "इंडोनेशियाई में इंडोनेशिया की राजनीति और इतिहास पर चर्चा करना"
