code: ARTS10006
year: 2027
learn:
  en: "An intro to the major world religions, including Hinduism, Buddhism, Judaism, Christianity and Islam, and life's big questions."
  zh: "世界主要宗教入门：印度教、佛教、犹太教、基督教和伊斯兰教，以及人生的重大问题。"
  zh-TW: "世界主要宗教入門：印度教、佛教、猶太教、基督教和伊斯蘭教，以及人生的重大問題。"
  ja: "世界の主要宗教入門：ヒンドゥー教、仏教、ユダヤ教、キリスト教、イスラム教、そして人生の大きな問い。"
  ko: "세계 주요 종교 입문: 힌두교, 불교, 유대교, 기독교, 이슬람교, 그리고 삶의 큰 질문들."
  vi: "Nhập môn các tôn giáo lớn trên thế giới: Ấn Độ giáo, Phật giáo, Do Thái giáo, Kitô giáo, Hồi giáo và những câu hỏi lớn của đời người."
  ms: "Pengenalan agama utama dunia: Hindu, Buddha, Yahudi, Kristian dan Islam, serta persoalan besar kehidupan."
  id: "Pengantar agama-agama besar dunia: Hindu, Buddha, Yahudi, Kristen, dan Islam, serta pertanyaan besar tentang hidup."
  hi: "दुनिया के प्रमुख धर्मों का परिचय: हिंदू, बौद्ध, यहूदी, ईसाई और इस्लाम धर्म, और जीवन के बड़े सवाल।"
outcomes:
  - en: "Read religious texts with suitable methods"
    zh: "用合适的方法研读宗教经典"
    zh-TW: "用合適的方法研讀宗教經典"
    ja: "適切な方法で宗教の原典を読む"
    ko: "알맞은 방법으로 종교 경전 읽기"
    vi: "Đọc kinh văn tôn giáo bằng phương pháp phù hợp"
    ms: "Baca teks agama dengan kaedah yang sesuai"
    id: "Membaca teks keagamaan dengan metode yang tepat"
    hi: "उचित तरीकों से धार्मिक ग्रंथ पढ़ना"
  - en: "Compare teachings and practices of world religions"
    zh: "比较各大宗教的教义和实践"
    zh-TW: "比較各大宗教的教義和實踐"
    ja: "世界宗教の教えと実践を比較する"
    ko: "세계 종교의 가르침과 실천 비교하기"
    vi: "So sánh giáo lý và thực hành của các tôn giáo"
    ms: "Bandingkan ajaran dan amalan agama dunia"
    id: "Membandingkan ajaran dan praktik agama dunia"
    hi: "विश्व धर्मों की शिक्षाओं और प्रथाओं की तुलना"
  - en: "Argue about religion in today's world"
    zh: "就当代世界中的宗教问题进行论证"
    zh-TW: "就當代世界中的宗教議題進行論證"
    ja: "現代世界の宗教について根拠をもって論じる"
    ko: "오늘날 세계의 종교에 대해 근거 있게 논하기"
    vi: "Lập luận về tôn giáo trong thế giới ngày nay"
    ms: "Berhujah tentang agama dalam dunia hari ini"
    id: "Berargumen tentang agama di dunia masa kini"
    hi: "आज की दुनिया में धर्म पर तर्क देना"
