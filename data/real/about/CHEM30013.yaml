code: CHEM30013
year: 2026
learn:
  en: "A short chemistry research project supervised by a staff member, written up and presented."
  zh: "在老师指导下做一个短期化学研究，写报告并做汇报。"
  zh-TW: "在老師指導下做一個短期化學研究，寫報告並做簡報。"
  ja: "教員の指導のもとで行う短い化学研究プロジェクト。まとめて発表する。"
  ko: "교수진 지도 아래 하는 짧은 화학 연구 프로젝트로, 보고서 작성과 발표 포함."
  vi: "Dự án nghiên cứu hóa ngắn có giảng viên hướng dẫn, viết báo cáo và trình bày."
  ms: "Projek kajian kimia pendek diselia staf, ditulis dan dibentangkan."
  id: "Proyek riset kimia singkat dibimbing dosen, ditulis dan dipresentasikan."
  hi: "स्टाफ़ की देखरेख में छोटा केमिस्ट्री रिसर्च प्रोजेक्ट, लिखकर पेश किया जाता है।"
outcomes:
  - en: "Review published work before starting research"
    zh: "动手前先查阅已有文献"
    zh-TW: "動手前先查閱已有文獻"
    ja: "研究を始める前に既存の文献を調べる"
    ko: "연구 시작 전 기존 문헌 검토하기"
    vi: "Xem lại công trình đã công bố trước khi nghiên cứu"
    ms: "Semak kerja terbitan sebelum mula kajian"
    id: "Meninjau karya terbit sebelum mulai riset"
    hi: "रिसर्च शुरू करने से पहले प्रकाशित काम पढ़ना"
  - en: "Plan research work carefully"
    zh: "仔细规划研究工作"
    zh-TW: "仔細規劃研究工作"
    ja: "研究作業を慎重に計画する"
    ko: "연구를 꼼꼼히 계획하기"
    vi: "Lên kế hoạch nghiên cứu cẩn thận"
    ms: "Rancang kerja kajian dengan teliti"
    id: "Merencanakan riset dengan cermat"
    hi: "रिसर्च का काम ध्यान से प्लान करना"
  - en: "Record observations and data accurately"
    zh: "准确记录观察和数据"
    zh-TW: "準確記錄觀察和資料"
    ja: "観察とデータを正確に記録する"
    ko: "관찰과 데이터를 정확히 기록하기"
    vi: "Ghi chép quan sát và dữ liệu chính xác"
    ms: "Rekod pemerhatian dan data dengan tepat"
    id: "Mencatat pengamatan dan data dengan akurat"
    hi: "अवलोकन और डेटा सही-सही दर्ज करना"
