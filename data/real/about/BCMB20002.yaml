code: BCMB20002
year: 2026
learn:
  en: "How proteins, DNA, lipids and sugars are built and work, and how cells get energy through metabolism."
  zh: "蛋白质、DNA、脂类和糖的结构与功能，以及细胞怎样代谢产能。"
  zh-TW: "蛋白質、DNA、脂質和醣的結構與功能，以及細胞如何代謝產能。"
  ja: "タンパク質・DNA・脂質・糖の構造と働き、細胞が代謝でエネルギーを得る仕組み。"
  ko: "단백질, DNA, 지질, 당의 구조와 기능, 세포가 대사로 에너지를 얻는 방식."
  vi: "Cấu trúc và chức năng của protein, DNA, lipid, đường, và cách tế bào lấy năng lượng qua trao đổi chất."
  ms: "Struktur dan fungsi protein, DNA, lipid dan gula, serta cara sel dapat tenaga melalui metabolisme."
  id: "Struktur dan fungsi protein, DNA, lipid, dan gula, serta cara sel mendapat energi lewat metabolisme."
  hi: "प्रोटीन, DNA, लिपिड और शुगर की बनावट व काम, और सेल मेटाबॉलिज़्म से ऊर्जा कैसे पाते हैं।"
outcomes:
  - en: "Use maths models to analyse enzyme activity"
    zh: "用数学模型分析酶的活性"
    zh-TW: "用數學模型分析酵素的活性"
    ja: "数理モデルで酵素活性を分析する"
    ko: "수학 모델로 효소 활성 분석하기"
    vi: "Dùng mô hình toán để phân tích hoạt tính enzyme"
    ms: "Guna model matematik untuk analisis aktiviti enzim"
    id: "Memakai model matematika untuk analisis aktivitas enzim"
    hi: "मैथ्स मॉडल से एंज़ाइम गतिविधि का विश्लेषण"
  - en: "Analyse DNA and protein sequences"
    zh: "分析DNA和蛋白质序列"
    zh-TW: "分析DNA和蛋白質序列"
    ja: "DNAとタンパク質の配列を解析する"
    ko: "DNA와 단백질 서열 분석하기"
    vi: "Phân tích trình tự DNA và protein"
    ms: "Analisis jujukan DNA dan protein"
    id: "Menganalisis sekuens DNA dan protein"
    hi: "DNA और प्रोटीन सीक्वेंस का विश्लेषण"
  - en: "Compare energy metabolism with and without oxygen"
    zh: "比较有氧和无氧代谢"
    zh-TW: "比較有氧和無氧代謝"
    ja: "酸素ありと酸素なしのエネルギー代謝を比べる"
    ko: "산소 유무에 따른 에너지 대사 비교하기"
    vi: "So sánh chuyển hóa năng lượng có và không có oxy"
    ms: "Banding metabolisme tenaga dengan dan tanpa oksigen"
    id: "Membandingkan metabolisme energi dengan dan tanpa oksigen"
    hi: "ऑक्सीजन के साथ और बिना ऊर्जा मेटाबॉलिज़्म की तुलना"
