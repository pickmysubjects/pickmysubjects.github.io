code: EDUC30070
year: 2026
learn:
  en: "The theory and practice of sports coaching: teaching methods, sports science and athlete wellbeing."
  zh: "运动教练的理论与实践：教学方法、运动科学和运动员身心健康。"
  zh-TW: "運動教練的理論與實務：教學方法、運動科學和運動員身心健康。"
  ja: "スポーツコーチングの理論と実践：指導法、スポーツ科学、選手の心身の健康。"
  ko: "스포츠 코칭의 이론과 실제: 지도 방법, 스포츠 과학, 선수 웰빙."
  vi: "Lý thuyết và thực hành huấn luyện thể thao: phương pháp dạy, khoa học thể thao và sức khỏe vận động viên."
  ms: "Teori dan amalan kejurulatihan sukan: kaedah mengajar, sains sukan dan kesejahteraan atlet."
  id: "Teori dan praktik melatih olahraga: metode mengajar, ilmu olahraga dan kesejahteraan atlet."
  hi: "स्पोर्ट्स कोचिंग का सिद्धांत और अभ्यास: शिक्षण तरीके, खेल विज्ञान और खिलाड़ी की सेहत।"
outcomes:
  - en: "Compare teaching and coaching methods in sport"
    zh: "比较体育中的教学和执教方法"
    zh-TW: "比較體育中的教學和執教方法"
    ja: "スポーツの指導法・コーチング法を比べる"
    ko: "스포츠의 교수법과 코칭법 비교하기"
    vi: "So sánh các phương pháp dạy và huấn luyện thể thao"
    ms: "Bandingkan kaedah mengajar dan melatih dalam sukan"
    id: "Membandingkan metode mengajar dan melatih olahraga"
    hi: "खेल में शिक्षण और कोचिंग तरीकों की तुलना करना"
  - en: "Use sports science to plan better coaching"
    zh: "运用运动科学改进训练计划"
    zh-TW: "運用運動科學改進訓練計畫"
    ja: "スポーツ科学を使ってより良い指導を計画する"
    ko: "스포츠 과학으로 더 나은 코칭 계획하기"
    vi: "Dùng khoa học thể thao để lên kế hoạch huấn luyện tốt hơn"
    ms: "Guna sains sukan untuk merancang latihan lebih baik"
    id: "Memakai ilmu olahraga untuk merancang latihan"
    hi: "बेहतर कोचिंग योजना के लिए खेल विज्ञान का उपयोग करना"
  - en: "Put athletes' physical and mental wellbeing first"
    zh: "把运动员的身心健康放在首位"
    zh-TW: "把運動員的身心健康放在首位"
    ja: "選手の心身の健康を最優先にする"
    ko: "선수의 신체·정신 건강을 우선하기"
    vi: "Đặt sức khỏe thể chất và tinh thần của vận động viên lên đầu"
    ms: "Utamakan kesejahteraan fizikal dan mental atlet"
    id: "Mengutamakan kesehatan fisik dan mental atlet"
    hi: "खिलाड़ियों की शारीरिक और मानसिक सेहत को प्राथमिकता देना"
