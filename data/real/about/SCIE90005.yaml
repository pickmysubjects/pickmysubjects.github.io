code: SCIE90005
year: 2027
learn:
  en: "Ethical issues scientists face, from conflicts of interest and fraud to animal ethics and handling research data."
  zh: "科学家面对的伦理问题，从利益冲突、学术造假到动物伦理和研究数据处理。"
  zh-TW: "科學家面對的倫理問題，從利益衝突、學術造假到動物倫理與研究資料處理。"
  ja: "利益相反や不正から動物倫理、研究データの扱いまで、科学者の倫理問題。"
  ko: "이해 충돌·연구 부정부터 동물 윤리·연구 데이터 관리까지 과학자의 윤리 문제."
  vi: "Vấn đề đạo đức của nhà khoa học, từ xung đột lợi ích, gian lận đến đạo đức động vật và xử lý dữ liệu."
  ms: "Isu etika saintis, dari konflik kepentingan dan penipuan hingga etika haiwan dan pengurusan data penyelidikan."
  id: "Isu etika ilmuwan, dari konflik kepentingan dan kecurangan hingga etika hewan dan pengelolaan data riset."
  hi: "वैज्ञानिकों के नैतिक मुद्दे, हितों के टकराव और धोखाधड़ी से पशु नैतिकता और शोध डेटा तक।"
outcomes:
  - en: "Know ethical duties in scientific workplaces"
    zh: "了解科学工作场所中的伦理责任"
    zh-TW: "了解科學工作場所中的倫理責任"
    ja: "科学の職場での倫理的責任を知る"
    ko: "과학 직장에서의 윤리적 책임 알기"
    vi: "Hiểu trách nhiệm đạo đức nơi làm khoa học"
    ms: "Memahami tanggungjawab etika di tempat kerja sains"
    id: "Memahami tanggung jawab etis di tempat kerja sains"
    hi: "वैज्ञानिक कार्यस्थल के नैतिक कर्तव्य जानना"
  - en: "Handle and report research data ethically"
    zh: "合乎伦理地记录和报告研究数据"
    zh-TW: "合乎倫理地記錄與報告研究資料"
    ja: "研究データを倫理的に扱い報告する"
    ko: "연구 데이터를 윤리적으로 다루고 보고하기"
    vi: "Xử lý và báo cáo dữ liệu nghiên cứu có đạo đức"
    ms: "Mengurus dan melaporkan data penyelidikan secara beretika"
    id: "Mengelola dan melaporkan data riset secara etis"
    hi: "शोध डेटा को नैतिक रूप से संभालना और रिपोर्ट करना"
