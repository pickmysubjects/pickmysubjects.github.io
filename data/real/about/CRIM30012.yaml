code: CRIM30012
year: 2026
learn:
  en: "Theories of what law does in society, including feminist, postcolonial and Indigenous views, tested on real cases."
  zh: "关于法律在社会中作用的理论，包括女性主义、后殖民和原住民视角，并用真实案例检验。"
  zh-TW: "關於法律在社會中作用的理論，包括女性主義、後殖民和原住民觀點，並用真實案例檢驗。"
  ja: "フェミニズム・ポストコロニアル・先住民の視点を含め、社会における法の役割の理論を実例で検討する。"
  ko: "페미니즘, 탈식민, 원주민 관점을 포함해 사회 속 법의 역할에 관한 이론을 실제 사례로 검토한다."
  vi: "Các lý thuyết về vai trò của luật trong xã hội, gồm góc nhìn nữ quyền, hậu thuộc địa và bản địa, kiểm chứng qua tình huống thực."
  ms: "Teori tentang peranan undang-undang dalam masyarakat, termasuk pandangan feminis, pascakolonial dan Orang Asal, diuji pada kes sebenar."
  id: "Teori tentang peran hukum di masyarakat, termasuk pandangan feminis, pascakolonial, dan Pribumi, diuji pada kasus nyata."
  hi: "समाज में कानून की भूमिका के सिद्धांत, जिनमें नारीवादी, उत्तर-औपनिवेशिक और आदिवासी नज़रिए हैं, असली मामलों पर परखे गए।"
outcomes:
  - en: "Describe major social theories of law"
    zh: "描述主要的法律社会理论"
    zh-TW: "描述主要的法律社會理論"
    ja: "法に関する主な社会理論を説明する"
    ko: "법에 관한 주요 사회 이론 설명하기"
    vi: "Mô tả các lý thuyết xã hội chính về luật"
    ms: "Huraikan teori sosial utama tentang undang-undang"
    id: "Menguraikan teori sosial utama tentang hukum"
    hi: "कानून के मुख्य सामाजिक सिद्धांतों का वर्णन करना"
  - en: "Weigh what each theory explains and misses"
    zh: "权衡每种理论能解释什么、遗漏了什么"
    zh-TW: "權衡每種理論能解釋什麼、遺漏了什麼"
    ja: "各理論が説明できる点と見落とす点を比べる"
    ko: "각 이론이 설명하는 것과 놓치는 것 따져 보기"
    vi: "Cân nhắc mỗi lý thuyết giải thích được gì và bỏ sót gì"
    ms: "Timbang apa yang dijelaskan dan terlepas oleh setiap teori"
    id: "Menimbang apa yang dijelaskan dan dilewatkan tiap teori"
    hi: "हर सिद्धांत क्या समझाता और क्या छोड़ देता है, परखना"
  - en: "Apply theory to current justice and crime issues"
    zh: "把理论应用到当前的司法与犯罪问题上"
    zh-TW: "把理論應用到當前的司法與犯罪問題上"
    ja: "理論を今の司法や犯罪の問題に当てはめる"
    ko: "이론을 현재의 사법·범죄 문제에 적용하기"
    vi: "Áp dụng lý thuyết vào vấn đề tư pháp và tội phạm hiện nay"
    ms: "Aplikasikan teori pada isu keadilan dan jenayah semasa"
    id: "Menerapkan teori pada isu peradilan dan kejahatan terkini"
    hi: "सिद्धांत को आज के न्याय और अपराध के मुद्दों पर लागू करना"
