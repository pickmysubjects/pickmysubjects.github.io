code: INFO90002
year: 2027
learn:
  en: "Relational databases: designing data models, normalisation, writing SQL, transactions and data warehouses."
  zh: "关系型数据库：数据建模、规范化、SQL、事务与数据仓库。"
  zh-TW: "關聯式資料庫：資料建模、正規化、SQL、交易與資料倉儲。"
  ja: "リレーショナルDB：データモデル設計、正規化、SQL、トランザクション、DWH。"
  ko: "관계형 데이터베이스: 데이터 모델링, 정규화, SQL, 트랜잭션, 데이터 웨어하우스."
  vi: "Cơ sở dữ liệu quan hệ: mô hình dữ liệu, chuẩn hóa, SQL, giao dịch và kho dữ liệu."
  ms: "Pangkalan data hubungan: model data, penormalan, SQL, transaksi dan gudang data."
  id: "Basis data relasional: model data, normalisasi, SQL, transaksi, dan gudang data."
  hi: "रिलेशनल डेटाबेस: डेटा मॉडलिंग, नॉर्मलाइज़ेशन, SQL, ट्रांज़ैक्शन और डेटा वेयरहाउस।"
outcomes:
  - en: "Design a database from a set of requirements"
    zh: "根据需求设计数据库"
    zh-TW: "依需求設計資料庫"
    ja: "要件からデータベースを設計する"
    ko: "요구사항으로 데이터베이스 설계하기"
    vi: "Thiết kế cơ sở dữ liệu từ yêu cầu"
    ms: "Mereka bentuk pangkalan data daripada keperluan"
    id: "Merancang basis data dari kebutuhan"
    hi: "ज़रूरतों से डेटाबेस डिज़ाइन करना"
  - en: "Write SQL queries to get and change data"
    zh: "编写SQL查询和修改数据"
    zh-TW: "撰寫SQL查詢與修改資料"
    ja: "SQLでデータを取得・更新する"
    ko: "SQL로 데이터 조회·수정하기"
    vi: "Viết truy vấn SQL để lấy và sửa dữ liệu"
    ms: "Menulis SQL untuk mendapat dan mengubah data"
    id: "Menulis SQL untuk mengambil dan mengubah data"
    hi: "डेटा पाने और बदलने के लिए SQL लिखना"
