code: MUSI20202
year: 2026
learn:
  en: "Builds on Performance 3: you join technique with musical shape and present a 30-minute recital program for assessment."
  zh: 在演奏3基础上，把技巧与音乐表达结合，最后考核30分钟独奏会曲目。
  zh-TW: 在演奏3基礎上，把技巧與音樂表達結合，最後考核30分鐘獨奏會曲目。
  ja: 演奏3の続き。技術と音楽的なまとまりを統合し、30分のリサイタル曲目で評価。
  ko: 연주 3에 이어 기술과 음악적 흐름을 결합하고 30분 리사이틀 프로그램으로 평가.
  vi: "Tiếp nối Biểu diễn 3: kết hợp kỹ thuật với cấu trúc âm nhạc, thi chương trình 30 phút."
  ms: "Lanjutan Persembahan 3: gabungkan teknik dengan bentuk muzik, dinilai melalui program resital 30 minit."
  id: "Lanjutan Pertunjukan 3: memadukan teknik dengan bentuk musik, dinilai lewat program resital 30 menit."
  hi: "परफ़ॉर्मेंस 3 के आगे: तकनीक को संगीत की बनावट से जोड़ना, 30 मिनट के रिसाइटल से आकलन।"
outcomes:
  - en: Join technique with musical coherence
    zh: 将技巧与音乐连贯性结合
    zh-TW: 將技巧與音樂連貫性結合
    ja: 技術と音楽的一貫性を結びつける
    ko: 기술과 음악적 일관성 결합하기
    vi: Kết hợp kỹ thuật và mạch nhạc
    ms: Gabungkan teknik dengan kesatuan muzik
    id: Memadukan teknik dan koherensi musik
    hi: तकनीक को संगीत की एकरूपता से जोड़ना
  - en: Prepare a full recital program
    zh: 准备完整的独奏会曲目
    zh-TW: 準備完整的獨奏會曲目
    ja: リサイタルの曲目を仕上げる
    ko: 리사이틀 프로그램 준비하기
    vi: Chuẩn bị trọn chương trình độc tấu
    ms: Sediakan program resital lengkap
    id: Menyiapkan program resital lengkap
    hi: पूरा रिसाइटल कार्यक्रम तैयार करना
  - en: Judge your own playing critically
    zh: 批判性地评估自己的演奏
    zh-TW: 批判性地評估自己的演奏
    ja: 自分の演奏を批判的に評価する
    ko: 자신의 연주를 비판적으로 평가하기
    vi: Tự đánh giá phần chơi của mình
    ms: Menilai permainan sendiri secara kritis
    id: Menilai permainan sendiri secara kritis
    hi: अपने वादन का आलोचनात्मक आकलन
