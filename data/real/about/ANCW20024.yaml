code: ANCW20024
year: 2026
learn:
  en: "The fourth ancient Egyptian course, finishing the grammar with participles and clauses and reading longer texts alone."
  zh: "古埃及语第四阶段，以分词和从句完成语法学习，独立阅读较长文本。"
  zh-TW: "古埃及語第四階段，以分詞和子句完成語法學習，獨立閱讀較長文本。"
  ja: "古代エジプト語の第4段階。分詞と節で文法を仕上げ、長めの文章を自力で読む。"
  ko: "고대 이집트어 4단계: 분사와 절로 문법을 마무리하고 긴 글을 혼자 읽는다."
  vi: "Khóa tiếng Ai Cập cổ thứ tư, hoàn thiện ngữ pháp với phân từ và mệnh đề, tự đọc văn bản dài hơn."
  ms: "Kursus keempat bahasa Mesir kuno, melengkapkan tatabahasa dengan partisipel dan klausa serta membaca teks panjang sendiri."
  id: "Kursus keempat bahasa Mesir kuno, menuntaskan tata bahasa dengan partisip dan klausa serta membaca teks panjang sendiri."
  hi: "प्राचीन मिस्री का चौथा कोर्स, कृदंत और उपवाक्यों से व्याकरण पूरा करना और लंबे पाठ खुद पढ़ना।"
outcomes:
  - en: "Use participles and clauses correctly"
    zh: "正确运用分词和从句"
    zh-TW: "正確運用分詞和子句"
    ja: "分詞と節を正しく使う"
    ko: "분사와 절을 정확히 사용하기"
    vi: "Sử dụng đúng phân từ và mệnh đề"
    ms: "Gunakan partisipel dan klausa dengan betul"
    id: "Memakai partisip dan klausa dengan benar"
    hi: "कृदंत और उपवाक्यों का सही उपयोग करना"
  - en: "Translate longer hieroglyphic texts"
    zh: "翻译较长的象形文字文本"
    zh-TW: "翻譯較長的象形文字文本"
    ja: "長めのヒエログリフの文章を訳す"
    ko: "더 긴 상형문자 글 번역하기"
    vi: "Dịch các văn bản tượng hình dài hơn"
    ms: "Terjemah teks hieroglif yang lebih panjang"
    id: "Menerjemahkan teks hieroglif yang lebih panjang"
    hi: "लंबे चित्रलिपि पाठों का अनुवाद करना"
  - en: "Work independently with original sources"
    zh: "独立处理原始文献"
    zh-TW: "獨立處理原始文獻"
    ja: "原典を自力で扱う"
    ko: "원전 자료를 독립적으로 다루기"
    vi: "Làm việc độc lập với nguồn gốc"
    ms: "Bekerja sendiri dengan sumber asal"
    id: "Bekerja mandiri dengan sumber asli"
    hi: "मूल स्रोतों के साथ स्वतंत्र रूप से काम करना"
