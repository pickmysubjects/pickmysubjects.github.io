code: ECOM90022
year: 2027
learn:
  en: "How applied econometrics research is done: choosing methods, finding data and literature, and presenting findings."
  zh: "应用计量研究怎么做：选方法、找数据和文献、呈现结果。"
  zh-TW: "應用計量研究怎麼做：選方法、找資料與文獻、呈現成果。"
  ja: "応用計量研究の進め方：手法選び、データと文献探し、結果の発表。"
  ko: "응용계량 연구 방법: 기법 선택, 데이터·문헌 찾기, 결과 발표."
  vi: "Cách làm nghiên cứu kinh tế lượng ứng dụng: chọn phương pháp, tìm dữ liệu, tài liệu và trình bày kết quả."
  ms: "Cara menjalankan penyelidikan ekonometrik gunaan: pilih kaedah, cari data dan literatur, bentang dapatan."
  id: "Cara meneliti ekonometrika terapan: memilih metode, mencari data dan literatur, menyajikan temuan."
  hi: "एप्लाइड इकोनोमेट्रिक्स शोध कैसे करें: तरीका चुनना, डेटा व साहित्य खोजना, नतीजे प्रस्तुत करना।"
outcomes:
  - en: "Find data and literature for a research question"
    zh: "为研究问题查找数据与文献"
    zh-TW: "為研究問題查找資料與文獻"
    ja: "研究課題のデータと文献を探す"
    ko: "연구 질문에 맞는 데이터·문헌 찾기"
    vi: "Tìm dữ liệu và tài liệu cho câu hỏi nghiên cứu"
    ms: "Mencari data dan literatur untuk soalan kajian"
    id: "Mencari data dan literatur untuk pertanyaan riset"
    hi: "शोध प्रश्न के लिए डेटा व साहित्य खोजना"
  - en: "Communicate research findings clearly"
    zh: "清楚地传达研究发现"
    zh-TW: "清楚傳達研究發現"
    ja: "研究結果をわかりやすく伝える"
    ko: "연구 결과를 명확히 전달하기"
    vi: "Truyền đạt kết quả nghiên cứu rõ ràng"
    ms: "Menyampaikan dapatan kajian dengan jelas"
    id: "Menyampaikan temuan riset dengan jelas"
    hi: "शोध नतीजे स्पष्ट रूप से बताना"
