code: ACCT90005
year: 2027
learn:
  en: "How weak legal systems, politics and poor transparency affect the valuation of firms in emerging markets."
  zh: "法律薄弱、政治力量和透明度低如何影响新兴市场企业的估值。"
  zh-TW: "法律薄弱、政治力量與透明度低如何影響新興市場企業的評價。"
  ja: "弱い法制度や政治、不透明さが新興市場企業の評価に与える影響。"
  ko: "취약한 법제도, 정치, 낮은 투명성이 신흥시장 기업 가치평가에 미치는 영향."
  vi: "Hệ thống pháp lý yếu, chính trị và thiếu minh bạch ảnh hưởng thế nào đến định giá doanh nghiệp ở thị trường mới nổi."
  ms: "Bagaimana sistem undang-undang lemah, politik dan kurang ketelusan menjejaskan penilaian firma pasaran baru muncul."
  id: "Bagaimana hukum yang lemah, politik, dan kurangnya transparansi memengaruhi valuasi perusahaan di pasar berkembang."
  hi: "कमज़ोर कानून, राजनीति और कम पारदर्शिता उभरते बाज़ारों की कंपनियों के मूल्यांकन को कैसे प्रभावित करते हैं।"
outcomes:
  - en: "Assess firm fundamentals and governance risk"
    zh: "评估企业基本面和公司治理风险"
    zh-TW: "評估企業基本面與公司治理風險"
    ja: "企業のファンダメンタルズとガバナンスリスクを評価する"
    ko: "기업 펀더멘털과 지배구조 위험 평가하기"
    vi: "Đánh giá nền tảng doanh nghiệp và rủi ro quản trị"
    ms: "Menilai asas firma dan risiko tadbir urus"
    id: "Menilai fundamental perusahaan dan risiko tata kelola"
    hi: "कंपनी के मूल आधार और गवर्नेंस जोखिम का आकलन"
  - en: "Analyse and value a real emerging-market firm"
    zh: "分析并估值一家真实的新兴市场企业"
    zh-TW: "分析並評價一家真實的新興市場企業"
    ja: "実在の新興市場企業を分析・評価する"
    ko: "실제 신흥시장 기업 분석 및 가치평가하기"
    vi: "Phân tích và định giá một doanh nghiệp thật ở thị trường mới nổi"
    ms: "Menganalisis dan menilai firma sebenar pasaran baru muncul"
    id: "Menganalisis dan menilai perusahaan nyata di pasar berkembang"
    hi: "किसी वास्तविक उभरते बाज़ार की कंपनी का विश्लेषण व मूल्यांकन"
