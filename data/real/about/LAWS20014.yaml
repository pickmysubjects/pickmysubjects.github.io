code: LAWS20014
year: 2026
learn:
  en: "Intellectual property for non-lawyers: copyright for art, music and film, patents for inventions, and trade marks for brands."
  zh: "给非法律专业的知识产权课：艺术、音乐和电影的版权，发明专利，以及品牌商标"
  zh-TW: "給非法律主修的智慧財產權課：藝術、音樂和電影的著作權，發明專利，以及品牌商標"
  ja: "法学以外の人向けの知的財産。芸術・音楽・映画の著作権、発明の特許、ブランドの商標。"
  ko: "비법학도를 위한 지식재산권: 예술·음악·영화 저작권, 발명 특허, 브랜드 상표."
  vi: "Sở hữu trí tuệ cho người không học luật: bản quyền nghệ thuật, âm nhạc, phim; bằng sáng chế; nhãn hiệu."
  ms: "Harta intelek untuk bukan peguam: hak cipta seni, muzik dan filem, paten ciptaan, serta cap dagangan jenama."
  id: "Kekayaan intelektual untuk non-hukum: hak cipta seni, musik dan film, paten penemuan, serta merek dagang."
  hi: "गैर-वकीलों के लिए बौद्धिक संपदा: कला, संगीत, फ़िल्म का कॉपीराइट, आविष्कारों के पेटेंट, ब्रांड के ट्रेडमार्क।"
outcomes:
  - en: "Explain why the law protects creations and brands"
    zh: "解释法律为何保护创作和品牌"
    zh-TW: "解釋法律為何保護創作和品牌"
    ja: "法が創作物とブランドを守る理由を説明する"
    ko: "법이 창작물과 브랜드를 보호하는 이유 설명하기"
    vi: "Giải thích vì sao luật bảo vệ sáng tạo và thương hiệu"
    ms: "Menerangkan sebab undang-undang melindungi ciptaan"
    id: "Menjelaskan alasan hukum melindungi karya dan merek"
    hi: "समझाना कि कानून रचनाओं और ब्रांडों की रक्षा क्यों करता है"
  - en: "Tell which works copyright, patents and trade marks cover"
    zh: "分清版权、专利和商标各保护什么"
    zh-TW: "分清著作權、專利和商標各保護什麼"
    ja: "著作権・特許・商標の対象を見分ける"
    ko: "저작권, 특허, 상표가 각각 무엇을 보호하는지 구분하기"
    vi: "Phân biệt bản quyền, sáng chế, nhãn hiệu bảo vệ gì"
    ms: "Membezakan perkara dilindungi hak cipta, paten, cap dagangan"
    id: "Membedakan cakupan hak cipta, paten, dan merek"
    hi: "कॉपीराइट, पेटेंट और ट्रेडमार्क किसे कवर करते हैं पहचानना"
  - en: "Spot when others may lawfully use someone's IP"
    zh: "判断何时可以合法使用他人的知识产权"
    zh-TW: "判斷何時可以合法使用他人的智慧財產"
    ja: "他人の知的財産を合法に使える場合を見極める"
    ko: "타인의 지식재산을 합법적으로 쓸 수 있는 경우 판단하기"
    vi: "Nhận ra khi nào được dùng hợp pháp tài sản trí tuệ người khác"
    ms: "Mengenal pasti bila IP orang lain boleh digunakan"
    id: "Mengenali kapan IP orang lain boleh dipakai secara sah"
    hi: "पहचानना कि दूसरे की बौद्धिक संपदा कब वैध रूप से इस्तेमाल हो सकती है"
