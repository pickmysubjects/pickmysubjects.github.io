code: MUSI20223
year: 2026
learn:
  en: "Research on how musicians listen, practise, memorise, improvise and handle nerves, studied fully online."
  zh: "研究音乐家如何聆听、练习、背谱、即兴和应对紧张，全程网课。"
  zh-TW: "研究音樂家如何聆聽、練習、背譜、即興和應對緊張，全程線上。"
  ja: "演奏家の聴き方・練習・暗譜・即興・緊張対策の研究。完全オンライン。"
  ko: "음악가의 듣기·연습·암보·즉흥·긴장 대처 연구, 전면 온라인."
  vi: "Nghiên cứu cách nhạc sĩ nghe, luyện tập, ghi nhớ, ứng tác và xử lý run; học online."
  ms: "Kajian cara pemuzik mendengar, berlatih, menghafal dan mengurus gemuruh; dalam talian."
  id: "Riset cara musisi mendengar, berlatih, menghafal, berimprovisasi dan atasi gugup; daring."
  hi: "संगीतकार कैसे सुनते, अभ्यास, याद, तात्कालिक रचना करते और घबराहट संभालते हैं; पूरी तरह ऑनलाइन।"
outcomes:
  - en: "Judge research on performing and creating music"
    zh: "评判关于演奏与创作音乐的研究"
    zh-TW: "評判關於演奏與創作音樂的研究"
    ja: "演奏・創作に関する研究を評価する"
    ko: "연주·창작에 관한 연구 평가하기"
    vi: "Đánh giá nghiên cứu về biểu diễn và sáng tác"
    ms: "Nilai kajian tentang persembahan dan ciptaan muzik"
    id: "Menilai riset tentang memainkan dan mencipta musik"
    hi: "संगीत प्रदर्शन और रचना पर शोध परखना"
  - en: "Apply performance science to your own practice"
    zh: "把表演科学应用到自己的练习中"
    zh-TW: "把表演科學應用到自己的練習中"
    ja: "演奏科学を自分の練習に生かす"
    ko: "연주 과학을 자기 연습에 적용하기"
    vi: "Áp dụng khoa học biểu diễn vào luyện tập"
    ms: "Guna sains persembahan dalam latihan sendiri"
    id: "Menerapkan ilmu performa ke latihan sendiri"
    hi: "प्रदर्शन विज्ञान को अपने अभ्यास में लगाना"
  - en: "Weigh methods used in music research"
    zh: "权衡音乐研究的方法问题"
    zh-TW: "權衡音樂研究的方法問題"
    ja: "音楽研究の方法論を比較検討する"
    ko: "음악 연구 방법 따져보기"
    vi: "Cân nhắc các phương pháp nghiên cứu âm nhạc"
    ms: "Timbang kaedah dalam kajian muzik"
    id: "Menimbang metode dalam riset musik"
    hi: "संगीत शोध की विधियों को परखना"
