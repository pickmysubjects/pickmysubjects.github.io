code: MKTG30007
year: 2026
learn:
  en: "Marketing's wider effect on society, both its benefits and criticisms, and how marketers can act responsibly."
  zh: "营销对社会的更广泛影响，好处与批评，以及营销人员如何负责任地行事。"
  zh-TW: "行銷對社會的廣泛影響，好處與批評，以及行銷人員如何負責任地行事。"
  ja: "マーケティングが社会に与える影響の良い面と批判、責任ある行動のあり方。"
  ko: "마케팅이 사회에 미치는 영향의 장점과 비판, 책임 있게 행동하는 법."
  vi: "Tác động rộng của marketing lên xã hội, cả lợi ích lẫn chỉ trích, và cách marketer hành xử có trách nhiệm."
  ms: "Kesan pemasaran yang lebih luas pada masyarakat, faedah dan kritikan, serta cara pemasar bertindak bertanggungjawab."
  id: "Dampak pemasaran yang lebih luas bagi masyarakat, manfaat dan kritiknya, serta cara pemasar bertindak bertanggung jawab."
  hi: "समाज पर मार्केटिंग का व्यापक असर, फ़ायदे और आलोचनाएँ, और मार्केटर ज़िम्मेदारी से कैसे काम करें।"
outcomes:
  - en: "Analyse issues like advertising to children and junk food"
    zh: "分析面向儿童的广告、垃圾食品等议题"
    zh-TW: "分析針對兒童的廣告、垃圾食物等議題"
    ja: "子ども向け広告やジャンクフードなどの問題を分析する"
    ko: "아동 대상 광고, 정크푸드 같은 문제 분석하기"
    vi: "Phân tích vấn đề như quảng cáo cho trẻ em, đồ ăn vặt"
    ms: "Analisis isu seperti iklan untuk kanak-kanak dan makanan ringan"
    id: "Menganalisis isu seperti iklan untuk anak dan junk food"
    hi: "बच्चों को विज्ञापन और जंक फ़ूड जैसे मुद्दों का विश्लेषण"
  - en: "Use ethical frameworks to judge marketing debates"
    zh: "用伦理框架评判营销争议"
    zh-TW: "用倫理架構評斷行銷爭議"
    ja: "倫理の枠組みでマーケティングの論争を評価する"
    ko: "윤리 프레임워크로 마케팅 논쟁 판단하기"
    vi: "Dùng khung đạo đức để đánh giá tranh luận marketing"
    ms: "Guna rangka etika untuk menilai perdebatan pemasaran"
    id: "Memakai kerangka etika untuk menilai debat pemasaran"
    hi: "नैतिक फ़्रेमवर्क से मार्केटिंग की बहसें परखना"
