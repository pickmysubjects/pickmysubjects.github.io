code: MECM30004
year: 2026
learn:
  en: "How new technology reshapes media industries such as music, TV, film, photography and games, and where each sector may go next."
  zh: "新技术如何重塑音乐、电视、电影、摄影和游戏等媒体产业，以及各行业接下来可能的走向。"
  zh-TW: "新技術如何重塑音樂、電視、電影、攝影和遊戲等媒體產業，以及各產業接下來可能的走向。"
  ja: "新しい技術が音楽、テレビ、映画、写真、ゲームなどのメディア産業をどう変えるか、各分野がこの先どうなりうるかを学ぶ。"
  ko: "새 기술이 음악, TV, 영화, 사진, 게임 같은 미디어 산업을 어떻게 바꾸는지, 각 분야가 앞으로 어디로 갈지 살펴본다."
  vi: "Công nghệ mới định hình lại các ngành truyền thông như âm nhạc, truyền hình, điện ảnh, nhiếp ảnh, trò chơi ra sao, và mỗi ngành sẽ đi về đâu."
  ms: "Bagaimana teknologi baharu mengubah industri media seperti muzik, TV, filem, fotografi dan permainan, dan hala tuju setiap sektor."
  id: "Bagaimana teknologi baru mengubah industri media seperti musik, TV, film, fotografi, dan gim, serta ke mana arah tiap sektor."
  hi: "नई तकनीक संगीत, टीवी, फ़िल्म, फ़ोटोग्राफ़ी और गेम जैसे मीडिया उद्योगों को कैसे बदलती है, और हर क्षेत्र आगे कहाँ जा सकता है।"
outcomes:
  - en: "Explain analogue versus digital media with examples"
    zh: "结合案例说明模拟媒体与数字媒体的区别"
    zh-TW: "結合案例說明類比媒體與數位媒體的區別"
    ja: "事例を使ってアナログとデジタルのメディアの違いを説明する"
    ko: "사례로 아날로그와 디지털 미디어의 차이 설명하기"
    vi: "Giải thích khác biệt giữa truyền thông analog và số qua ví dụ"
    ms: "Terangkan beza media analog dan digital dengan contoh"
    id: "Menjelaskan beda media analog dan digital dengan contoh"
    hi: "उदाहरणों से एनालॉग और डिजिटल मीडिया का फ़र्क समझाना"
  - en: "Identify the main trends changing media industries"
    zh: "识别改变媒体产业的主要趋势"
    zh-TW: "辨識改變媒體產業的主要趨勢"
    ja: "メディア産業を変える主な流れを見極める"
    ko: "미디어 산업을 바꾸는 주요 흐름 파악하기"
    vi: "Nhận ra các xu hướng chính đang thay đổi ngành truyền thông"
    ms: "Kenal pasti trend utama yang mengubah industri media"
    id: "Mengenali tren utama yang mengubah industri media"
    hi: "मीडिया उद्योगों को बदलने वाले मुख्य रुझान पहचानना"
  - en: "Assess possible futures for media sectors"
    zh: "评估各媒体行业可能的未来"
    zh-TW: "評估各媒體產業可能的未來"
    ja: "メディア各分野の将来像を評価する"
    ko: "미디어 각 분야의 미래 가능성 평가하기"
    vi: "Đánh giá tương lai có thể có của các ngành truyền thông"
    ms: "Nilai masa depan yang mungkin bagi sektor media"
    id: "Menilai kemungkinan masa depan sektor media"
    hi: "मीडिया क्षेत्रों के संभावित भविष्य का आकलन करना"
