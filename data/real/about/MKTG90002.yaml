code: MKTG90002
year: 2027
learn:
  en: "Managing the risky process of creating new products, and when to launch or drop products from a portfolio."
  zh: "管理充满风险的新产品开发过程，以及何时推出或淘汰产品。"
  zh-TW: "管理充滿風險的新產品開發流程，以及何時推出或淘汰產品。"
  ja: "リスクの高い新製品開発の管理と、製品をいつ投入・撤退させるかを学ぶ。"
  ko: "위험이 큰 신제품 개발 과정 관리와 제품의 출시·철수 시점을 배운다."
  vi: "Quản lý quá trình tạo sản phẩm mới đầy rủi ro, và khi nào ra mắt hoặc loại bỏ sản phẩm."
  ms: "Mengurus proses berisiko mencipta produk baharu, dan bila melancar atau menggugurkan produk."
  id: "Mengelola proses berisiko menciptakan produk baru, dan kapan meluncurkan atau menghentikan produk."
  hi: "नए उत्पाद बनाने की जोखिम भरी प्रक्रिया संभालना, और कब उत्पाद लॉन्च करें या हटाएँ।"
outcomes:
  - en: "Use basic new product development tools"
    zh: "运用新产品开发的基本工具"
    zh-TW: "運用新產品開發的基本工具"
    ja: "新製品開発の基本ツールを使う"
    ko: "신제품 개발 기본 도구 사용하기"
    vi: "Dùng công cụ cơ bản phát triển sản phẩm mới"
    ms: "Menggunakan alat asas pembangunan produk baharu"
    id: "Memakai alat dasar pengembangan produk baru"
    hi: "नए उत्पाद विकास के बुनियादी साधन अपनाना"
  - en: "See how new products drive growth and profit"
    zh: "理解新产品如何带动增长与利润"
    zh-TW: "理解新產品如何帶動成長與獲利"
    ja: "新製品が成長と利益をどう生むか理解する"
    ko: "신제품이 성장과 이익에 주는 영향 이해하기"
    vi: "Thấy sản phẩm mới thúc đẩy tăng trưởng, lợi nhuận"
    ms: "Melihat produk baharu memacu pertumbuhan dan untung"
    id: "Melihat produk baru mendorong pertumbuhan dan laba"
    hi: "नए उत्पाद वृद्धि और मुनाफ़ा कैसे बढ़ाते हैं, समझना"
