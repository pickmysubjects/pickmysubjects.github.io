code: ENGL20025
year: 2026
learn:
  en: "The realist novel of home and everyday life, from 19th-century country-house fiction to graphic and global novels today."
  zh: "描写家庭与日常的现实主义小说，从19世纪乡村庄园小说到今天的图像小说和全球小说。"
  zh-TW: "描寫家庭與日常的寫實主義小說，從19世紀鄉村莊園小說到今天的圖像小說和全球小說。"
  ja: "家庭と日常を描く写実主義小説を、19世紀のカントリーハウス小説から現代のグラフィックノベルまで読む。"
  ko: "가정과 일상을 다루는 사실주의 소설을 19세기 저택 소설부터 오늘날 그래픽 노블까지 읽는다."
  vi: "Tiểu thuyết hiện thực về gia đình và đời thường, từ tiểu thuyết điền trang thế kỷ 19 đến tiểu thuyết đồ họa và toàn cầu ngày nay."
  ms: "Novel realis tentang rumah dan kehidupan harian, dari fiksyen rumah desa abad ke-19 hingga novel grafik dan global kini."
  id: "Novel realis tentang rumah dan keseharian, dari novel rumah pedesaan abad ke-19 sampai novel grafis dan global masa kini."
  hi: "घर और रोज़मर्रा की ज़िंदगी पर यथार्थवादी उपन्यास, 19वीं सदी के कंट्री-हाउस उपन्यास से आज के ग्राफ़िक और वैश्विक उपन्यास तक।"
outcomes:
  - en: "Explain what makes a novel realist"
    zh: "说明现实主义小说的特征"
    zh-TW: "說明寫實主義小說的特徵"
    ja: "写実主義小説の特徴を説明する"
    ko: "사실주의 소설의 특징 설명하기"
    vi: "Giải thích điều gì làm nên tiểu thuyết hiện thực"
    ms: "Terangkan ciri novel realis"
    id: "Menjelaskan ciri novel realis"
    hi: "किसी उपन्यास को यथार्थवादी क्या बनाता है, समझाना"
  - en: "Use theory of the novel to read fiction"
    zh: "运用小说理论阅读作品"
    zh-TW: "運用小說理論閱讀作品"
    ja: "小説論を使って作品を読む"
    ko: "소설 이론으로 작품 읽기"
    vi: "Dùng lý thuyết tiểu thuyết để đọc tác phẩm"
    ms: "Guna teori novel untuk membaca fiksyen"
    id: "Memakai teori novel untuk membaca fiksi"
    hi: "उपन्यास-सिद्धांत से कथा पढ़ना"
  - en: "Trace how the realist novel has changed"
    zh: "梳理现实主义小说的演变"
    zh-TW: "梳理寫實主義小說的演變"
    ja: "写実主義小説の変化をたどる"
    ko: "사실주의 소설의 변화 짚어 보기"
    vi: "Lần theo sự thay đổi của tiểu thuyết hiện thực"
    ms: "Jejaki perubahan novel realis"
    id: "Menelusuri perubahan novel realis"
    hi: "यथार्थवादी उपन्यास कैसे बदला, खोजना"
