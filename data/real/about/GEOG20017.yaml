code: GEOG20017
year: 2026
learn:
  en: "How to work with and map spatial data in weekly computer labs, and use it to inform decisions."
  zh: "在每周电脑实践课中处理和制图空间数据，并用于决策。"
  zh-TW: "在每週電腦實作課中處理與製圖空間資料，並用於決策。"
  ja: "毎週のPC演習で空間データを扱い地図化し、意思決定に生かす。"
  ko: "매주 컴퓨터 실습으로 공간 데이터를 다루고 지도로 만들어 의사결정에 활용."
  vi: "Xử lý và lập bản đồ dữ liệu không gian trong giờ thực hành máy tính hằng tuần, dùng để ra quyết định."
  ms: "Mengurus dan memetakan data ruang dalam amali komputer mingguan untuk bantu keputusan."
  id: "Mengolah dan memetakan data spasial lewat praktikum komputer mingguan untuk mendukung keputusan."
  hi: "साप्ताहिक कंप्यूटर प्रैक्टिकल में स्थानिक डेटा संभालना, नक्शे बनाना और निर्णयों में उपयोग करना।"
outcomes:
  - en: "Process geospatial data to solve geography problems"
    zh: "处理地理空间数据解决地理问题"
    zh-TW: "處理地理空間資料解決地理問題"
    ja: "地理空間データを処理して課題を解く"
    ko: "지리공간 데이터 처리로 문제 풀기"
    vi: "Xử lý dữ liệu không gian địa lý để giải bài toán"
    ms: "Proses data geospatial untuk masalah geografi"
    id: "Mengolah data geospasial untuk soal geografi"
    hi: "भू-स्थानिक डेटा प्रोसेस कर समस्याएँ हल करना"
  - en: "Visualise and communicate spatial analyses"
    zh: "可视化并展示空间分析结果"
    zh-TW: "視覺化並呈現空間分析結果"
    ja: "空間分析を可視化して伝える"
    ko: "공간 분석 시각화·전달하기"
    vi: "Trực quan hóa và trình bày phân tích không gian"
    ms: "Visualkan dan sampaikan analisis ruang"
    id: "Memvisualkan dan menyampaikan analisis spasial"
    hi: "स्थानिक विश्लेषण को दृश्य रूप में प्रस्तुत करना"
  - en: "Evaluate ethics of collecting and using data"
    zh: "评估数据收集与使用的伦理"
    zh-TW: "評估資料蒐集與使用的倫理"
    ja: "データ収集・利用の倫理を評価する"
    ko: "데이터 수집·이용 윤리 평가하기"
    vi: "Đánh giá đạo đức thu thập và dùng dữ liệu"
    ms: "Nilai etika pengumpulan dan penggunaan data"
    id: "Menilai etika pengumpulan dan penggunaan data"
    hi: "डेटा संग्रह और उपयोग की नैतिकता परखना"
