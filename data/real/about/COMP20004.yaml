code: COMP20004
year: 2026
learn:
  en: "The theory of what computers can and can't solve, and which problems can be solved efficiently."
  zh: "计算理论：哪些问题电脑能解决，哪些能高效地解决。"
  zh-TW: "計算理論：哪些問題電腦能解決，哪些能有效率地解決。"
  ja: "コンピュータに解ける問題・解けない問題、効率よく解ける問題の理論。"
  ko: "컴퓨터가 풀 수 있는 문제와 없는 문제, 효율적으로 풀 수 있는 문제에 대한 이론."
  vi: "Lý thuyết về những gì máy tính giải được và không, và bài nào giải hiệu quả được."
  ms: "Teori tentang apa yang komputer boleh dan tak boleh selesaikan, dan masalah mana yang cekap diselesaikan."
  id: "Teori tentang apa yang bisa dan tidak bisa diselesaikan komputer, serta masalah mana yang bisa diselesaikan efisien."
  hi: "कंप्यूटर क्या हल कर सकता है और क्या नहीं, और कौन सी समस्याएँ कुशलता से हल हो सकती हैं, इसका सिद्धांत।"
outcomes:
  - en: "Design and reason about Turing machines"
    zh: "设计和分析图灵机"
    zh-TW: "設計和分析圖靈機"
    ja: "チューリングマシンを設計し分析する"
    ko: "튜링 기계 설계 및 분석"
    vi: "Thiết kế và phân tích máy Turing"
    ms: "Reka dan analisis mesin Turing"
    id: "Merancang dan menganalisis mesin Turing"
    hi: "ट्यूरिंग मशीन डिज़ाइन और विश्लेषण करना"
  - en: "Prove a problem is hard using reductions"
    zh: "用归约证明问题很难"
    zh-TW: "用歸約證明問題很難"
    ja: "帰着を使って問題の困難さを証明する"
    ko: "환원으로 문제가 어려움을 증명"
    vi: "Dùng phép quy dẫn chứng minh bài toán khó"
    ms: "Buktikan masalah sukar melalui penurunan"
    id: "Membuktikan masalah sulit dengan reduksi"
    hi: "रिडक्शन से साबित करना कि समस्या कठिन है"
  - en: "Design approximate solutions for hard problems"
    zh: "为难题设计近似算法"
    zh-TW: "為難題設計近似演算法"
    ja: "難しい問題の近似解法を設計する"
    ko: "어려운 문제의 근사 해법 설계"
    vi: "Thiết kế lời giải gần đúng cho bài khó"
    ms: "Reka penyelesaian anggaran untuk masalah sukar"
    id: "Merancang solusi aproksimasi untuk masalah sulit"
    hi: "कठिन समस्याओं के लिए अनुमानित हल बनाना"
