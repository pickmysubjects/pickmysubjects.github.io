code: EDUC30067
year: 2026
learn:
  en: "How children and young people build their identities through pop culture, media, brands and the internet."
  zh: "儿童和年轻人如何借助流行文化、媒体、品牌和网络塑造自我认同。"
  zh-TW: "兒童和年輕人如何借助流行文化、媒體、品牌和網路塑造自我認同。"
  ja: "子どもや若者がポップカルチャー、メディア、ブランド、ネットを通じて自分を形づくる過程。"
  ko: "아이와 청년이 대중문화, 미디어, 브랜드, 인터넷으로 정체성을 만드는 방식."
  vi: "Trẻ em và người trẻ hình thành bản sắc qua văn hóa đại chúng, truyền thông, thương hiệu và internet."
  ms: "Cara kanak-kanak dan belia membina identiti melalui budaya popular, media, jenama dan internet."
  id: "Cara anak dan anak muda membangun identitas lewat budaya pop, media, merek dan internet."
  hi: "बच्चे और युवा पॉप कल्चर, मीडिया, ब्रांड और इंटरनेट से अपनी पहचान कैसे बनाते हैं।"
outcomes:
  - en: "Explain how pop culture shapes youth identity"
    zh: "解释流行文化如何影响青年认同"
    zh-TW: "解釋流行文化如何影響青年認同"
    ja: "ポップカルチャーが若者のアイデンティティに与える影響を説明する"
    ko: "대중문화가 청년 정체성에 미치는 영향 설명하기"
    vi: "Giải thích văn hóa đại chúng định hình bản sắc người trẻ ra sao"
    ms: "Terangkan cara budaya popular membentuk identiti belia"
    id: "Menjelaskan pengaruh budaya pop pada identitas anak muda"
    hi: "समझाना कि पॉप कल्चर युवाओं की पहचान कैसे गढ़ता है"
  - en: "Critique theories of childhood and youth culture"
    zh: "批判性评价童年与青年文化理论"
    zh-TW: "批判性評價童年與青年文化理論"
    ja: "子ども・若者文化の理論を批判的に検討する"
    ko: "아동·청년 문화 이론 비판적으로 검토하기"
    vi: "Phản biện các lý thuyết về văn hóa tuổi thơ và tuổi trẻ"
    ms: "Kritik teori budaya kanak-kanak dan belia"
    id: "Mengkritisi teori budaya anak dan remaja"
    hi: "बचपन और युवा संस्कृति के सिद्धांतों की समीक्षा करना"
  - en: "See how global media is reworked by young people locally"
    zh: "了解年轻人如何在本地改造全球媒体文化"
    zh-TW: "了解年輕人如何在在地改造全球媒體文化"
    ja: "若者がグローバルなメディアを地元流に作り変える様子を知る"
    ko: "청년이 글로벌 미디어를 지역에 맞게 바꾸는 방식 이해하기"
    vi: "Hiểu người trẻ biến tấu văn hóa toàn cầu thành văn hóa địa phương"
    ms: "Fahami cara belia menyesuaikan media global secara tempatan"
    id: "Memahami cara anak muda mengolah media global secara lokal"
    hi: "समझना कि युवा वैश्विक मीडिया को स्थानीय रूप कैसे देते हैं"
