code: MAST30035
year: 2026
learn:
  en: "The number theory behind cryptography: modular arithmetic, elliptic curves, RSA and lattice-based schemes."
  zh: "密码学背后的数论：模运算、椭圆曲线、RSA和格密码"
  zh-TW: "密碼學背後的數論：模運算、橢圓曲線、RSA和格密碼"
  ja: "暗号を支える整数論：合同算術、楕円曲線、RSA、格子暗号。"
  ko: "암호학의 바탕이 되는 정수론: 모듈러 연산, 타원곡선, RSA, 격자 암호."
  vi: "Lý thuyết số đằng sau mật mã: số học mô-đun, đường cong elliptic, RSA và mật mã lưới."
  ms: "Teori nombor di sebalik kriptografi: aritmetik modular, lengkung eliptik, RSA dan skema kekisi."
  id: "Teori bilangan di balik kriptografi: aritmetika modular, kurva eliptik, RSA, dan skema lattice."
  hi: "क्रिप्टोग्राफ़ी के पीछे का संख्या सिद्धांत: मॉड्यूलर अंकगणित, दीर्घवृत्तीय वक्र, RSA और लैटिस योजनाएँ।"
outcomes:
  - en: "Prove results on modular arithmetic and lattices"
    zh: "证明模运算和格的基本结论"
    zh-TW: "證明模運算和格的基本結論"
    ja: "合同算術と格子の結果を証明する"
    ko: "모듈러 연산·격자 관련 결과 증명하기"
    vi: "Chứng minh kết quả về số học mô-đun và lưới"
    ms: "Membuktikan hasil aritmetik modular dan kekisi"
    id: "Membuktikan hasil aritmetika modular dan lattice"
    hi: "मॉड्यूलर अंकगणित और लैटिस के परिणाम सिद्ध करना"
  - en: "Analyse RSA and elliptic-curve cryptosystems"
    zh: "分析RSA和椭圆曲线密码系统"
    zh-TW: "分析RSA和橢圓曲線密碼系統"
    ja: "RSAと楕円曲線暗号を分析する"
    ko: "RSA와 타원곡선 암호 분석하기"
    vi: "Phân tích hệ mật RSA và đường cong elliptic"
    ms: "Menganalisis sistem kripto RSA dan lengkung eliptik"
    id: "Menganalisis kriptosistem RSA dan kurva eliptik"
    hi: "RSA और दीर्घवृत्तीय वक्र क्रिप्टो का विश्लेषण"
  - en: "Explore examples with a computer algebra system"
    zh: "用计算机代数系统探索例子"
    zh-TW: "用電腦代數系統探索例子"
    ja: "数式処理システムで例を調べる"
    ko: "컴퓨터 대수 시스템으로 예제 탐구하기"
    vi: "Khám phá ví dụ bằng hệ đại số máy tính"
    ms: "Meneroka contoh dengan sistem algebra komputer"
    id: "Menjelajahi contoh dengan sistem aljabar komputer"
    hi: "कंप्यूटर बीजगणित प्रणाली से उदाहरण जाँचना"
