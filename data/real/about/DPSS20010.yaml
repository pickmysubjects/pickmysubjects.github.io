code: DPSS20010
year: 2026
learn:
  en: "Take a real crew role on a VCA production in your chosen specialty, then write up and reflect on it."
  zh: "在VCA的真实演出中担任你专业方向的岗位，并写报告与反思。"
  zh-TW: "在 VCA 的真實演出中擔任你專業方向的崗位，並寫報告與反思。"
  ja: "VCAの実公演で専門分野の役割を担い、報告と振り返りを書く。"
  ko: "VCA 실제 공연에서 전공 분야 역할을 맡고 보고·성찰을 쓴다."
  vi: "Nhận một vai trò thật trong vở diễn của VCA, rồi viết báo cáo và suy ngẫm."
  ms: "Pegang peranan sebenar dalam produksi VCA, kemudian tulis laporan dan refleksi."
  id: "Memegang peran nyata di produksi VCA, lalu menulis laporan dan refleksi."
  hi: "VCA प्रोडक्शन में अपनी विशेषज्ञता की असली भूमिका निभाना और उस पर लिखना।"
outcomes:
  - en: "Pitch for a production role"
    zh: "为一个制作岗位写申请"
    zh-TW: "為一個製作崗位寫申請"
    ja: "制作の役割に応募する提案を書く"
    ko: "제작 역할 지원서 작성하기"
    vi: "Viết đề xuất xin vai trò sản xuất"
    ms: "Tulis cadangan untuk peranan produksi"
    id: "Menulis usulan untuk peran produksi"
    hi: "प्रोडक्शन भूमिका के लिए प्रस्ताव लिखना"
  - en: "Do the role through to closing night"
    zh: "把岗位一直做到演出结束"
    zh-TW: "把崗位一直做到演出結束"
    ja: "最終公演まで役割を務め上げる"
    ko: "마지막 공연까지 역할 해내기"
    vi: "Hoàn thành vai trò đến buổi diễn cuối"
    ms: "Jalankan peranan hingga persembahan akhir"
    id: "Menjalankan peran sampai pertunjukan usai"
    hi: "आख़िरी शो तक भूमिका निभाना"
  - en: "Reflect on your own work as a professional"
    zh: "以专业角度反思自己的工作"
    zh-TW: "以專業角度反思自己的工作"
    ja: "プロの視点で自分の仕事を振り返る"
    ko: "전문가 관점에서 자기 작업 돌아보기"
    vi: "Tự đánh giá công việc như người làm nghề"
    ms: "Renung kerja sendiri secara profesional"
    id: "Merefleksikan kerja sendiri secara profesional"
    hi: "पेशेवर नज़र से अपने काम पर विचार करना"
