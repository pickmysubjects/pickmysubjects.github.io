code: CONS30002
year: 2026
learn:
  en: "How teams run BIM on real projects: execution plans, model sharing, standards, Open BIM and effects on contracts."
  zh: "团队如何在真实项目中推行BIM：执行计划、模型共享、标准、Open BIM及对合同的影响。"
  zh-TW: "團隊如何在真實專案中推行BIM：執行計畫、模型共享、標準、Open BIM及對合約的影響。"
  ja: "実案件でのBIM運用：実行計画、モデル共有、標準、Open BIM、契約への影響。"
  ko: "실제 프로젝트에서 팀이 BIM을 운영하는 법: 실행 계획, 모델 공유, 표준, Open BIM, 계약 영향."
  vi: "Nhóm áp dụng BIM trong dự án thật: kế hoạch, chia sẻ mô hình, tiêu chuẩn, Open BIM, hợp đồng."
  ms: "Cara pasukan guna BIM dalam projek sebenar: pelan, perkongsian model, piawai, Open BIM, kontrak."
  id: "Cara tim memakai BIM di proyek nyata: rencana, berbagi model, standar, Open BIM, kontrak."
  hi: "असली प्रोजेक्ट में टीमें BIM कैसे चलाती हैं: प्लान, मॉडल शेयरिंग, मानक, Open BIM, अनुबंध।"
outcomes:
  - en: "Write a BIM execution plan"
    zh: "编写BIM执行计划"
    zh-TW: "撰寫BIM執行計畫"
    ja: "BIM実行計画を作成する"
    ko: "BIM 실행 계획 작성하기"
    vi: "Viết kế hoạch thực hiện BIM"
    ms: "Tulis pelan pelaksanaan BIM"
    id: "Menyusun rencana pelaksanaan BIM"
    hi: "BIM एक्ज़ीक्यूशन प्लान लिखना"
  - en: "Apply BIM standards and Open BIM sharing"
    zh: "应用BIM标准与Open BIM共享"
    zh-TW: "應用BIM標準與Open BIM共享"
    ja: "BIM標準とOpen BIMの共有を使う"
    ko: "BIM 표준과 Open BIM 공유 적용하기"
    vi: "Áp dụng tiêu chuẩn BIM và chia sẻ Open BIM"
    ms: "Guna piawai BIM dan perkongsian Open BIM"
    id: "Menerapkan standar BIM dan Open BIM"
    hi: "BIM मानक और Open BIM शेयरिंग लागू करना"
  - en: "Explain how BIM changes contracts and delivery"
    zh: "说明BIM如何改变合同与交付"
    zh-TW: "說明BIM如何改變合約與交付"
    ja: "BIMが契約と納品をどう変えるか説明する"
    ko: "BIM이 계약·발주를 어떻게 바꾸는지 설명하기"
    vi: "Giải thích BIM thay đổi hợp đồng, bàn giao ra sao"
    ms: "Jelaskan kesan BIM pada kontrak dan penyampaian"
    id: "Menjelaskan dampak BIM pada kontrak"
    hi: "BIM अनुबंध और डिलीवरी कैसे बदलता है, समझाना"
