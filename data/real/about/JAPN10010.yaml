code: JAPN10010
year: 2026
learn:
  en: "Advanced Japanese beyond the textbook: dialects, casual speech, and how language shifts with gender, age and formality."
  zh: "超越课本的高级日语：方言、口语，以及语言如何随性别、年龄和正式程度变化。"
  zh-TW: "超越課本的高級日語：方言、口語，以及語言如何隨性別、年齡和正式程度變化。"
  ja: "教科書を超えた上級日本語。方言、くだけた話し方、性別・年齢・場面による言葉の違い。"
  ko: "교과서를 넘어서는 고급 일본어. 방언, 구어, 성별·나이·격식에 따른 말의 차이."
  vi: "Tiếng Nhật nâng cao ngoài sách giáo khoa: phương ngữ, khẩu ngữ, và ngôn ngữ thay đổi theo giới, tuổi, mức trang trọng."
  ms: "Bahasa Jepun lanjutan di luar buku teks: dialek, bahasa santai, dan perubahan bahasa mengikut gender, umur dan formaliti."
  id: "Bahasa Jepang lanjut di luar buku teks: dialek, bahasa santai, dan perubahan bahasa menurut gender, usia dan tingkat formalitas."
  hi: "पाठ्यपुस्तक से आगे की उन्नत जापानी: बोलियाँ, अनौपचारिक बोली, और जेंडर, उम्र व औपचारिकता के साथ भाषा कैसे बदलती है।"
outcomes:
  - en: "Recognise regional dialects and casual Japanese"
    zh: "识别日本各地方言和口语"
    zh-TW: "識別日本各地方言和口語"
    ja: "地方の方言やくだけた日本語を聞き分ける"
    ko: "지역 방언과 구어체 일본어 알아듣기"
    vi: "Nhận ra phương ngữ và tiếng Nhật thân mật"
    ms: "Kenal pasti dialek daerah dan bahasa Jepun santai"
    id: "Mengenali dialek daerah dan bahasa Jepang santai"
    hi: "क्षेत्रीय बोलियाँ और अनौपचारिक जापानी पहचानना"
  - en: "Analyse real conversations at different formality levels"
    zh: "分析不同正式程度的真实对话"
    zh-TW: "分析不同正式程度的真實對話"
    ja: "さまざまな丁寧さの実際の会話を分析する"
    ko: "격식 수준이 다른 실제 대화 분석하기"
    vi: "Phân tích hội thoại thật ở các mức trang trọng khác nhau"
    ms: "Analisis perbualan sebenar pada tahap formaliti berbeza"
    id: "Menganalisis percakapan nyata dengan formalitas berbeda"
    hi: "अलग-अलग औपचारिकता वाली असली बातचीत का विश्लेषण करना"
  - en: "Choose the right style when you speak Japanese"
    zh: "说日语时选择恰当的语体"
    zh-TW: "說日語時選擇恰當的語體"
    ja: "話すときに場面に合った言葉づかいを選ぶ"
    ko: "일본어로 말할 때 알맞은 말투 고르기"
    vi: "Chọn đúng văn phong khi nói tiếng Nhật"
    ms: "Pilih gaya yang sesuai ketika bertutur bahasa Jepun"
    id: "Memilih gaya yang tepat saat berbicara bahasa Jepang"
    hi: "जापानी बोलते समय सही शैली चुनना"
