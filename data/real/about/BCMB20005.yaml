code: BCMB20005
year: 2026
learn:
  en: "Hands-on lab techniques for studying proteins, DNA and cells in biochemistry and molecular biology."
  zh: "生化和分子生物学的实验技术，用来研究蛋白质、DNA和细胞。"
  zh-TW: "生化和分子生物學的實驗技術，用來研究蛋白質、DNA和細胞。"
  ja: "生化学・分子生物学でタンパク質・DNA・細胞を調べる実践的な実験技術。"
  ko: "생화학·분자생물학에서 단백질, DNA, 세포를 연구하는 실습 실험 기법."
  vi: "Kỹ thuật thí nghiệm thực hành để nghiên cứu protein, DNA và tế bào trong hóa sinh, sinh học phân tử."
  ms: "Teknik makmal praktikal untuk mengkaji protein, DNA dan sel dalam biokimia dan biologi molekul."
  id: "Teknik lab praktik untuk mempelajari protein, DNA, dan sel dalam biokimia dan biologi molekuler."
  hi: "बायोकेमिस्ट्री और मॉलिक्यूलर बायोलॉजी में प्रोटीन, DNA व सेल पढ़ने की प्रैक्टिकल लैब तकनीकें।"
outcomes:
  - en: "Run standard lab protocols with proteins and DNA"
    zh: "做蛋白质和DNA的标准实验"
    zh-TW: "做蛋白質和DNA的標準實驗"
    ja: "タンパク質とDNAで標準的な実験手順を行う"
    ko: "단백질·DNA 표준 실험 프로토콜 수행하기"
    vi: "Làm các quy trình thí nghiệm chuẩn với protein và DNA"
    ms: "Jalankan protokol makmal standard dengan protein dan DNA"
    id: "Menjalankan protokol lab standar dengan protein dan DNA"
    hi: "प्रोटीन और DNA के साथ स्टैंडर्ड लैब प्रोटोकॉल चलाना"
  - en: "Do biochemical calculations for lab work"
    zh: "做实验相关的生化计算"
    zh-TW: "做實驗相關的生化計算"
    ja: "実験に必要な生化学の計算をする"
    ko: "실험에 필요한 생화학 계산하기"
    vi: "Làm các phép tính hóa sinh cho thí nghiệm"
    ms: "Buat pengiraan biokimia untuk kerja makmal"
    id: "Melakukan perhitungan biokimia untuk kerja lab"
    hi: "लैब के लिए बायोकेमिकल कैलकुलेशन करना"
  - en: "Write up experiments in scientific style"
    zh: "按科学规范写实验报告"
    zh-TW: "按科學規範寫實驗報告"
    ja: "実験を科学的な形式でまとめる"
    ko: "실험을 과학적 형식으로 작성하기"
    vi: "Viết báo cáo thí nghiệm theo văn phong khoa học"
    ms: "Tulis laporan eksperimen gaya saintifik"
    id: "Menulis laporan eksperimen dengan gaya ilmiah"
    hi: "प्रयोगों को वैज्ञानिक शैली में लिखना"
