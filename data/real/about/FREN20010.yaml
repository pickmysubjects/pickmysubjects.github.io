code: FREN20010
year: 2026
learn:
  en: "How the French novel changed from the Middle Ages to today, read and discussed in French."
  zh: "法语小说从中世纪到今天的演变，用法语阅读和讨论。"
  zh-TW: "法語小說從中世紀到今天的演變，用法語閱讀和討論。"
  ja: "中世から現代までのフランス小説の変化を、フランス語で読み論じる。"
  ko: "중세부터 오늘날까지 프랑스 소설의 변화를 프랑스어로 읽고 논의한다."
  vi: "Tiểu thuyết Pháp thay đổi thế nào từ Trung Cổ đến nay, đọc và thảo luận bằng tiếng Pháp."
  ms: "Perubahan novel Perancis dari Zaman Pertengahan hingga kini, dibaca dan dibincang dalam bahasa Perancis."
  id: "Perubahan novel Prancis dari Abad Pertengahan hingga kini, dibaca dan dibahas dalam bahasa Prancis."
  hi: "मध्य युग से आज तक फ़्रेंच उपन्यास कैसे बदला, फ़्रेंच में पढ़ना और चर्चा करना।"
outcomes:
  - en: "Read French novels from different periods"
    zh: "阅读不同时期的法语小说"
    zh-TW: "閱讀不同時期的法語小說"
    ja: "さまざまな時代のフランス小説を読む"
    ko: "여러 시대의 프랑스 소설 읽기"
    vi: "Đọc tiểu thuyết Pháp của nhiều thời kỳ"
    ms: "Baca novel Perancis dari pelbagai zaman"
    id: "Membaca novel Prancis dari berbagai zaman"
    hi: "अलग-अलग दौर के फ़्रेंच उपन्यास पढ़ना"
  - en: "Analyse narrative structure and context"
    zh: "分析叙事结构和时代背景"
    zh-TW: "分析敘事結構和時代背景"
    ja: "語りの構造と時代背景を分析する"
    ko: "서사 구조와 시대적 맥락 분석하기"
    vi: "Phân tích cấu trúc tự sự và bối cảnh"
    ms: "Analisis struktur naratif dan konteks"
    id: "Menganalisis struktur naratif dan konteks"
    hi: "कथा की बनावट और संदर्भ का विश्लेषण करना"
  - en: "Write literary analysis in French"
    zh: "用法语写文学分析"
    zh-TW: "用法語寫文學分析"
    ja: "フランス語で文学分析を書く"
    ko: "프랑스어로 문학 분석 쓰기"
    vi: "Viết phân tích văn học bằng tiếng Pháp"
    ms: "Tulis analisis sastera dalam bahasa Perancis"
    id: "Menulis analisis sastra dalam bahasa Prancis"
    hi: "फ़्रेंच में साहित्यिक विश्लेषण लिखना"
