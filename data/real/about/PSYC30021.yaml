code: PSYC30021
year: 2026
learn:
  en: "Applying psychology to real issues and ethics, plus a supervised group research project ending in a poster."
  zh: "把心理学用到现实问题和伦理上，并做小组研究和海报展示。"
  zh-TW: "把心理學用到現實問題和倫理上，並做有指導的小組研究和海報展示。"
  ja: "心理学を現実の問題や倫理に応用し、指導付きのグループ研究をポスターでまとめる。"
  ko: "심리학을 실제 문제와 윤리에 적용하고, 지도받는 그룹 연구를 포스터로 마무리."
  vi: "Áp dụng tâm lý học vào vấn đề thực tế và đạo đức, cùng dự án nhóm có hướng dẫn kết thúc bằng poster."
  ms: "Mengaplikasi psikologi pada isu sebenar dan etika, serta projek kumpulan berpenyelia diakhiri poster."
  id: "Menerapkan psikologi pada isu nyata dan etika, plus proyek riset kelompok terbimbing diakhiri poster."
  hi: "साइकोलॉजी को असल मुद्दों और नैतिकता पर लागू करना, साथ में गाइडेड ग्रुप रिसर्च जो पोस्टर पर खत्म होती है।"
outcomes:
  - en: "Design and run a research project in a group"
    zh: "和小组设计并完成研究项目"
    zh-TW: "和小組設計並完成研究專題"
    ja: "グループで研究プロジェクトを設計・実施する"
    ko: "그룹으로 연구 프로젝트 설계·수행"
    vi: "Thiết kế và thực hiện dự án nghiên cứu theo nhóm"
    ms: "Reka dan jalankan projek kajian dalam kumpulan"
    id: "Merancang dan menjalankan proyek riset dalam kelompok"
    hi: "ग्रुप में रिसर्च प्रोजेक्ट डिज़ाइन करना और चलाना"
  - en: "Apply psychology to behaviour change problems"
    zh: "用心理学解决行为改变问题"
    zh-TW: "用心理學解決行為改變問題"
    ja: "行動変容の問題に心理学を応用する"
    ko: "행동 변화 문제에 심리학 적용"
    vi: "Áp dụng tâm lý học vào vấn đề thay đổi hành vi"
    ms: "Gunakan psikologi pada masalah perubahan tingkah laku"
    id: "Menerapkan psikologi pada masalah perubahan perilaku"
    hi: "व्यवहार बदलने की समस्याओं पर साइकोलॉजी लागू करना"
  - en: "Present findings in talks and writing"
    zh: "用口头和书面汇报研究结果"
    zh-TW: "用口頭和書面報告研究結果"
    ja: "発表と文章で結果を伝える"
    ko: "발표와 글로 결과 제시"
    vi: "Trình bày kết quả bằng bài nói và bài viết"
    ms: "Bentang dapatan secara lisan dan bertulis"
    id: "Menyajikan temuan lewat presentasi dan tulisan"
    hi: "टॉक और लेखन में नतीजे पेश करना"
