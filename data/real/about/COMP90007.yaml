code: COMP90007
year: 2027
learn:
  en: "How computer networks work, layer by layer: from data links and wireless/LAN up to Internet applications."
  zh: "计算机网络的分层原理：从数据链路、无线和局域网到互联网应用。"
  zh-TW: "電腦網路的分層原理：從資料鏈結、無線與區域網路到網際網路應用。"
  ja: "コンピュータネットワークを層ごとに：データリンク、無線・LANからインターネットアプリまで。"
  ko: "컴퓨터 네트워크를 계층별로: 데이터 링크, 무선·LAN부터 인터넷 응용까지."
  vi: "Mạng máy tính hoạt động theo từng tầng: từ liên kết dữ liệu, không dây/LAN đến ứng dụng Internet."
  ms: "Cara rangkaian komputer berfungsi lapisan demi lapisan: pautan data, wayarles/LAN hingga aplikasi Internet."
  id: "Cara jaringan komputer bekerja per lapisan: tautan data, nirkabel/LAN hingga aplikasi Internet."
  hi: "कंप्यूटर नेटवर्क परत दर परत: डेटा लिंक, वायरलेस/LAN से इंटरनेट ऐप्स तक।"
outcomes:
  - en: "Explain the layers of the OSI and TCP/IP models"
    zh: "解释 OSI 与 TCP/IP 分层模型"
    zh-TW: "解釋 OSI 與 TCP/IP 分層模型"
    ja: "OSI と TCP/IP の階層を説明する"
    ko: "OSI·TCP/IP 계층 모델 설명하기"
    vi: "Giải thích các tầng của mô hình OSI và TCP/IP"
    ms: "Terangkan lapisan model OSI dan TCP/IP"
    id: "Menjelaskan lapisan model OSI dan TCP/IP"
    hi: "OSI और TCP/IP मॉडल की परतें समझाना"
  - en: "Describe how common network technologies and protocols work"
    zh: "说明常见网络技术与协议的原理"
    zh-TW: "說明常見網路技術與協定的原理"
    ja: "主なネットワーク技術とプロトコルを説明する"
    ko: "주요 네트워크 기술과 프로토콜 설명하기"
    vi: "Mô tả cách các công nghệ và giao thức mạng phổ biến hoạt động"
    ms: "Huraikan cara teknologi dan protokol rangkaian biasa berfungsi"
    id: "Menjelaskan cara kerja teknologi dan protokol jaringan umum"
    hi: "आम नेटवर्क तकनीकें और प्रोटोकॉल कैसे काम करते हैं, बताना"
