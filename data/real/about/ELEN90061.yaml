code: ELEN90061
year: 2027
learn:
  en: "How the Internet's layers and protocols work, analysed with queueing and graph theory."
  zh: "互联网的分层结构和各类协议如何运作，并用排队论和图论来分析。"
  zh-TW: "網際網路的分層架構與各類協定如何運作，並用排隊理論和圖論來分析。"
  ja: "インターネットの階層構造とプロトコルの仕組みを、待ち行列理論とグラフ理論で分析する。"
  ko: "인터넷의 계층 구조와 프로토콜의 작동 방식을 대기행렬 이론과 그래프 이론으로 분석합니다."
  vi: "Cách các tầng và giao thức của Internet hoạt động, phân tích bằng lý thuyết hàng đợi và đồ thị."
  ms: "Cara lapisan dan protokol Internet berfungsi, dianalisis dengan teori giliran dan teori graf."
  id: "Cara kerja lapisan dan protokol Internet, dianalisis dengan teori antrean dan teori graf."
  hi: "इंटरनेट की परतें और प्रोटोकॉल कैसे काम करते हैं, क्यूइंग और ग्राफ़ सिद्धांत से विश्लेषण।"
outcomes:
  - en: "Explain routing, TCP/IP and other network protocols"
    zh: "讲解路由、TCP/IP 等网络协议"
    zh-TW: "講解路由、TCP/IP 等網路協定"
    ja: "ルーティングや TCP/IP などのプロトコルを説明する"
    ko: "라우팅, TCP/IP 등 네트워크 프로토콜 설명하기"
    vi: "Giải thích định tuyến, TCP/IP và các giao thức mạng"
    ms: "Menerangkan penghalaan, TCP/IP dan protokol rangkaian lain"
    id: "Menjelaskan routing, TCP/IP, dan protokol jaringan lain"
    hi: "रूटिंग, TCP/IP और अन्य नेटवर्क प्रोटोकॉल समझाना"
  - en: "Model network delay with queueing theory"
    zh: "用排队论建模网络时延"
    zh-TW: "用排隊理論建模網路延遲"
    ja: "待ち行列理論でネットワーク遅延をモデル化する"
    ko: "대기행렬 이론으로 네트워크 지연 모델링하기"
    vi: "Mô hình hóa độ trễ mạng bằng lý thuyết hàng đợi"
    ms: "Memodelkan kelewatan rangkaian dengan teori giliran"
    id: "Memodelkan latensi jaringan dengan teori antrean"
    hi: "क्यूइंग सिद्धांत से नेटवर्क देरी का मॉडल बनाना"
  - en: "Simulate networks and report in a small team"
    zh: "以小组形式仿真网络并撰写报告"
    zh-TW: "以小組形式模擬網路並撰寫報告"
    ja: "少人数チームでネットワークをシミュレーションし報告する"
    ko: "소규모 팀으로 네트워크 시뮬레이션 및 보고하기"
    vi: "Mô phỏng mạng và báo cáo theo nhóm nhỏ"
    ms: "Mensimulasikan rangkaian dan melapor dalam pasukan kecil"
    id: "Menyimulasikan jaringan dan melapor dalam tim kecil"
    hi: "छोटी टीम में नेटवर्क का सिमुलेशन और रिपोर्ट करना"
