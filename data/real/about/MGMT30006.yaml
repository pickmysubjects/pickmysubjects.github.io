code: MGMT30006
year: 2026
learn:
  en: "How new ventures and established firms come up with new ideas and turn them into value."
  zh: "新创企业和成熟公司如何产生新想法并转化为价值。"
  zh-TW: "新創公司和成熟企業如何產生新點子並轉化為價值。"
  ja: "新興企業と既存企業が新しいアイデアを生み、価値に変える方法。"
  ko: "신생 기업과 기존 기업이 새 아이디어를 만들고 가치로 바꾸는 방법."
  vi: "Doanh nghiệp mới và công ty lâu năm tạo ra ý tưởng mới và biến chúng thành giá trị như thế nào."
  ms: "Cara syarikat baharu dan firma mapan menjana idea baharu dan menukarnya menjadi nilai."
  id: "Cara usaha rintisan dan perusahaan mapan memunculkan ide baru lalu mengubahnya jadi nilai."
  hi: "नए वेंचर और पुरानी कंपनियाँ नए आइडिया कैसे लाती हैं और उन्हें वैल्यू में कैसे बदलती हैं।"
outcomes:
  - en: "Compare ways of managing innovation in startups and big firms"
    zh: "比较初创和大公司管理创新的方式"
    zh-TW: "比較新創和大公司管理創新的方式"
    ja: "スタートアップと大企業のイノベーション管理を比べる"
    ko: "스타트업과 대기업의 혁신 관리 방식 비교하기"
    vi: "So sánh cách quản lý đổi mới ở startup và công ty lớn"
    ms: "Banding cara urus inovasi di syarikat baharu dan firma besar"
    id: "Membandingkan cara mengelola inovasi di startup dan perusahaan besar"
    hi: "स्टार्टअप और बड़ी कंपनियों में इनोवेशन मैनेज करने के तरीके तुलना करना"
  - en: "Use entrepreneurship theories to analyse cases"
    zh: "用创业理论分析案例"
    zh-TW: "用創業理論分析案例"
    ja: "起業の理論を使って事例を分析する"
    ko: "창업 이론으로 사례 분석하기"
    vi: "Dùng lý thuyết khởi nghiệp để phân tích tình huống"
    ms: "Guna teori keusahawanan untuk analisis kes"
    id: "Memakai teori kewirausahaan untuk menganalisis kasus"
    hi: "उद्यमिता के सिद्धांतों से केस का विश्लेषण करना"
  - en: "Sketch an entrepreneurial strategy for a business"
    zh: "为企业制定创业型战略"
    zh-TW: "為企業擬定創業型策略"
    ja: "企業のための起業家的な戦略を描く"
    ko: "기업을 위한 기업가적 전략 세우기"
    vi: "Phác thảo chiến lược khởi nghiệp cho doanh nghiệp"
    ms: "Rangka strategi keusahawanan untuk perniagaan"
    id: "Menyusun strategi kewirausahaan untuk bisnis"
    hi: "किसी बिज़नेस के लिए उद्यमी रणनीति बनाना"
