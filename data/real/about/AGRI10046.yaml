code: AGRI10046
year: 2026
learn:
  en: "Physics and chemistry behind farming: fluids, heat, solubility, redox, acids, salinity in soils and cells."
  zh: "农业背后的物理与化学：流体、热、溶解度、氧化还原、酸碱、土壤与细胞中的盐分。"
  zh-TW: "農業背後的物理與化學：流體、熱、溶解度、氧化還原、酸鹼、土壤與細胞中的鹽分。"
  ja: "農業を支える物理と化学：流体、熱、溶解度、酸化還元、酸塩基、土壌と細胞の塩類。"
  ko: "농업의 바탕이 되는 물리·화학: 유체, 열, 용해도, 산화환원, 산·염기, 토양과 세포의 염분."
  vi: "Vật lý và hóa học trong nông nghiệp: chất lỏng, nhiệt, độ tan, oxi hóa khử, axit, độ mặn trong đất và tế bào."
  ms: "Fizik dan kimia di sebalik pertanian: bendalir, haba, keterlarutan, redoks, asid, kemasinan tanah dan sel."
  id: "Fisika dan kimia di balik pertanian: fluida, panas, kelarutan, redoks, asam, salinitas tanah dan sel."
  hi: "खेती के पीछे का भौतिकी और रसायन: तरल, ऊष्मा, विलेयता, रेडॉक्स, अम्ल, मिट्टी और कोशिकाओं में लवणता।"
outcomes:
  - en: "Apply physics and chemistry to soil and water"
    zh: "将物理化学用于土壤与水"
    zh-TW: "將物理化學用於土壤與水"
    ja: "物理と化学を土壌と水に応用する"
    ko: "물리·화학을 토양과 물에 적용한다"
    vi: "Áp dụng vật lý và hóa học vào đất và nước"
    ms: "Gunakan fizik dan kimia pada tanah dan air"
    id: "Menerapkan fisika dan kimia pada tanah dan air"
    hi: "मिट्टी और पानी पर भौतिकी और रसायन लागू करें"
  - en: "Explain fluids and thermal physics"
    zh: "解释流体与热物理"
    zh-TW: "解釋流體與熱物理"
    ja: "流体と熱物理を説明する"
    ko: "유체와 열물리를 설명한다"
    vi: "Giải thích chất lưu và vật lý nhiệt"
    ms: "Terangkan bendalir dan fizik terma"
    id: "Menjelaskan fluida dan fisika termal"
    hi: "तरल और ऊष्मीय भौतिकी समझाएँ"
  - en: "Analyse data with graphs and basic statistics"
    zh: "用图表和基础统计分析数据"
    zh-TW: "用圖表和基礎統計分析資料"
    ja: "グラフと基礎統計でデータを分析する"
    ko: "그래프와 기초 통계로 데이터를 분석한다"
    vi: "Phân tích dữ liệu bằng đồ thị và thống kê cơ bản"
    ms: "Analisis data dengan graf dan statistik asas"
    id: "Menganalisis data dengan grafik dan statistik dasar"
    hi: "ग्राफ़ और बुनियादी सांख्यिकी से डेटा का विश्लेषण करें"
