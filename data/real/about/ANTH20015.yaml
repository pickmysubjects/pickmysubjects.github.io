code: ANTH20015
year: 2026
learn:
  en: "Doing ethnographic research in Melbourne to see how different groups live in, shape and fight over the city."
  zh: "在墨尔本做民族志调查，看不同群体如何生活于、塑造并争夺这座城市。"
  zh-TW: "在墨爾本做民族誌調查，看不同群體如何生活於、塑造並爭奪這座城市。"
  ja: "メルボルンで民族誌調査を行い、さまざまな人々が都市でどう暮らし、形づくり、争うかを見る。"
  ko: "멜버른에서 민족지 조사를 하며 여러 집단이 도시에서 살고, 도시를 만들고, 다투는 방식을 본다."
  vi: "Nghiên cứu dân tộc chí tại Melbourne để thấy các nhóm người sống, định hình và tranh giành thành phố ra sao."
  ms: "Membuat kajian etnografi di Melbourne untuk melihat cara pelbagai kumpulan hidup, membentuk dan berebut bandar."
  id: "Melakukan riset etnografi di Melbourne untuk melihat cara berbagai kelompok hidup, membentuk, dan memperebutkan kota."
  hi: "मेलबर्न में एथ्नोग्राफिक रिसर्च करके देखना कि अलग-अलग समूह शहर में कैसे रहते, उसे गढ़ते और उस पर टकराते हैं।"
outcomes:
  - en: "Explain key ideas in urban anthropology"
    zh: "解释城市人类学的核心概念"
    zh-TW: "解釋城市人類學的核心概念"
    ja: "都市人類学の主要な考えを説明する"
    ko: "도시 인류학의 핵심 개념 설명하기"
    vi: "Giải thích các khái niệm chính của nhân học đô thị"
    ms: "Terangkan idea utama antropologi bandar"
    id: "Menjelaskan gagasan utama antropologi perkotaan"
    hi: "शहरी मानवशास्त्र के मुख्य विचार समझाना"
  - en: "Plan and carry out fieldwork in the city"
    zh: "规划并开展城市田野调查"
    zh-TW: "規劃並開展城市田野調查"
    ja: "都市でのフィールド調査を計画し実施する"
    ko: "도시 현장 조사를 계획하고 수행하기"
    vi: "Lên kế hoạch và thực hiện nghiên cứu thực địa trong thành phố"
    ms: "Rancang dan jalankan kerja lapangan di bandar"
    id: "Merencanakan dan melakukan kerja lapangan di kota"
    hi: "शहर में फील्डवर्क की योजना बनाना और करना"
  - en: "Present findings on place, migration and inequality"
    zh: "就地方、迁移和不平等呈现研究发现"
    zh-TW: "就地方、遷移和不平等呈現研究發現"
    ja: "場所・移住・格差についての発見を発表する"
    ko: "장소, 이주, 불평등에 관한 결과 발표하기"
    vi: "Trình bày kết quả về nơi chốn, di cư và bất bình đẳng"
    ms: "Bentangkan dapatan tentang tempat, migrasi dan ketaksamaan"
    id: "Menyajikan temuan tentang tempat, migrasi, dan ketimpangan"
    hi: "स्थान, प्रवास और असमानता पर निष्कर्ष प्रस्तुत करना"
