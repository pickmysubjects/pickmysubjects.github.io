code: SOTH20002
year: 2026
learn:
  en: "The founding ideas of sociology, read through thinkers like Marx, Durkheim, Weber, Simmel and Freud."
  zh: "通过马克思、涂尔干、韦伯、齐美尔和弗洛伊德等人，学习社会学的奠基思想。"
  zh-TW: "透過馬克思、涂爾幹、韋伯、齊美爾和佛洛伊德等人，學習社會學的奠基思想。"
  ja: "マルクス、デュルケーム、ウェーバー、ジンメル、フロイトらを通して社会学の基礎となる考えを学ぶ。"
  ko: "마르크스, 뒤르켐, 베버, 짐멜, 프로이트 등을 통해 사회학의 기초 사상을 배운다."
  vi: "Những tư tưởng nền tảng của xã hội học qua các nhà tư tưởng như Marx, Durkheim, Weber, Simmel và Freud."
  ms: "Idea asas sosiologi melalui pemikir seperti Marx, Durkheim, Weber, Simmel dan Freud."
  id: "Gagasan dasar sosiologi lewat pemikir seperti Marx, Durkheim, Weber, Simmel dan Freud."
  hi: "मार्क्स, दुर्खीम, वेबर, ज़िमेल और फ्रायड जैसे विचारकों के ज़रिए समाजशास्त्र के बुनियादी विचार।"
outcomes:
  - en: "Explain the main ideas of classical social theorists"
    zh: "说明古典社会理论家的主要观点"
    zh-TW: "說明古典社會理論家的主要觀點"
    ja: "古典的な社会理論家の主な考えを説明する"
    ko: "고전 사회 이론가들의 주요 사상 설명하기"
    vi: "Giải thích ý tưởng chính của các nhà lý thuyết xã hội cổ điển"
    ms: "Terangkan idea utama ahli teori sosial klasik"
    id: "Menjelaskan gagasan utama para teoretikus sosial klasik"
    hi: "शास्त्रीय सामाजिक सिद्धांतकारों के मुख्य विचार समझाना"
  - en: "Compare their views on power, culture and the self"
    zh: "比较他们对权力、文化和自我的看法"
    zh-TW: "比較他們對權力、文化和自我的看法"
    ja: "権力・文化・自己についての見方を比べる"
    ko: "권력·문화·자아에 대한 관점 비교하기"
    vi: "So sánh quan điểm của họ về quyền lực, văn hóa và cái tôi"
    ms: "Bandingkan pandangan mereka tentang kuasa, budaya dan diri"
    id: "Membandingkan pandangan mereka soal kekuasaan, budaya dan diri"
    hi: "सत्ता, संस्कृति और स्व पर उनके विचारों की तुलना करना"
  - en: "Critically assess classical theory today"
    zh: "批判性评估古典理论在今天的意义"
    zh-TW: "批判性評估古典理論在今天的意義"
    ja: "古典理論の今日的な意味を批判的に評価する"
    ko: "오늘날 고전 이론을 비판적으로 평가하기"
    vi: "Đánh giá có phê phán lý thuyết cổ điển ngày nay"
    ms: "Nilai secara kritis teori klasik masa kini"
    id: "Menilai secara kritis teori klasik di masa kini"
    hi: "आज के संदर्भ में शास्त्रीय सिद्धांत का आलोचनात्मक आकलन करना"
