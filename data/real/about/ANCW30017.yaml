code: ANCW30017
year: 2026
learn:
  en: "The Ancient World major capstone: the place of ancient cultures and heritage today and how to explain them to an audience."
  zh: "古代世界专业总结课：古代文化与遗产在今天的地位，以及如何向大众讲述。"
  zh-TW: "古代世界主修總結課：古代文化與遺產在今天的地位，以及如何向大眾講述。"
  ja: "古代世界専攻のキャップストーン。古代文化と遺産の今日の意味と、それを人に伝える方法を学ぶ。"
  ko: "고대 세계 전공 캡스톤: 고대 문화와 유산의 오늘날 의미와 이를 청중에게 전하는 법을 배운다."
  vi: "Môn tổng kết chuyên ngành Thế giới cổ đại: vị trí của văn hóa, di sản cổ ngày nay và cách giới thiệu chúng."
  ms: "Subjek akhir major Dunia Kuno: tempat budaya dan warisan kuno hari ini dan cara menerangkannya kepada khalayak."
  id: "Mata kuliah penutup jurusan Dunia Kuno: tempat budaya dan warisan kuno kini dan cara menjelaskannya ke khalayak."
  hi: "प्राचीन विश्व मेजर का कैपस्टोन: आज प्राचीन संस्कृतियों और विरासत का स्थान, और उन्हें लोगों तक कैसे पहुँचाएँ।"
outcomes:
  - en: "Reflect on the role of the ancient past today"
    zh: "反思古代在今天的意义"
    zh-TW: "反思古代在今天的意義"
    ja: "古代が今日持つ意味を振り返る"
    ko: "고대가 오늘날 갖는 의미 성찰하기"
    vi: "Suy ngẫm vai trò của quá khứ cổ đại ngày nay"
    ms: "Renungkan peranan masa lampau kuno hari ini"
    id: "Merefleksikan peran masa kuno saat ini"
    hi: "आज प्राचीन अतीत की भूमिका पर विचार करना"
  - en: "Communicate the ancient world to an audience"
    zh: "向大众讲述古代世界"
    zh-TW: "向大眾講述古代世界"
    ja: "古代世界を人々に伝える"
    ko: "청중에게 고대 세계 전달하기"
    vi: "Truyền đạt về thế giới cổ đại tới công chúng"
    ms: "Sampaikan dunia kuno kepada khalayak"
    id: "Menyampaikan dunia kuno kepada khalayak"
    hi: "प्राचीन विश्व को दर्शकों तक पहुँचाना"
  - en: "Complete a project drawing on the major"
    zh: "完成一个整合专业所学的项目"
    zh-TW: "完成一個整合主修所學的專案"
    ja: "専攻の学びを生かしたプロジェクトを仕上げる"
    ko: "전공 지식을 활용한 프로젝트 완성하기"
    vi: "Hoàn thành một dự án dựa trên kiến thức chuyên ngành"
    ms: "Siapkan projek berdasarkan major"
    id: "Menyelesaikan proyek berdasarkan jurusan"
    hi: "मेजर पर आधारित एक प्रोजेक्ट पूरा करना"
