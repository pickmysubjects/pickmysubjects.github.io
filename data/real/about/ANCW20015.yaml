code: ANCW20015
year: 2026
learn:
  en: "Greek and Roman myths: their main themes, how they appear in texts and art, and their place in everyday ancient life."
  zh: "希腊罗马神话：主要主题、在文本和艺术中的呈现，以及在古代日常生活中的地位。"
  zh-TW: "希臘羅馬神話：主要主題、在文本和藝術中的呈現，以及在古代日常生活中的地位。"
  ja: "ギリシャ・ローマ神話の主なテーマ、文献と美術での現れ方、古代の日常での役割を学ぶ。"
  ko: "그리스·로마 신화의 주요 주제, 문헌과 예술 속 모습, 고대 일상에서의 자리를 배운다."
  vi: "Thần thoại Hy Lạp, La Mã: chủ đề chính, sự xuất hiện trong văn bản, nghệ thuật và vai trò trong đời sống cổ đại."
  ms: "Mitos Yunani dan Rom: tema utama, kemunculannya dalam teks dan seni, dan tempatnya dalam kehidupan harian kuno."
  id: "Mitos Yunani dan Romawi: tema utamanya, kemunculannya dalam teks dan seni, serta tempatnya dalam hidup sehari-hari."
  hi: "यूनानी और रोमन मिथक: मुख्य विषय, ग्रंथों और कला में उनका रूप, और प्राचीन रोज़मर्रा जीवन में उनकी जगह।"
outcomes:
  - en: "Identify major themes in classical myth"
    zh: "辨识古典神话的主要主题"
    zh-TW: "辨識古典神話的主要主題"
    ja: "古典神話の主なテーマを見分ける"
    ko: "고전 신화의 주요 주제 파악하기"
    vi: "Nhận diện các chủ đề chính trong thần thoại cổ điển"
    ms: "Kenal pasti tema utama mitos klasik"
    id: "Mengenali tema utama mitos klasik"
    hi: "शास्त्रीय मिथकों के मुख्य विषय पहचानना"
  - en: "Analyse myths in texts and in art"
    zh: "分析文本和艺术中的神话"
    zh-TW: "分析文本和藝術中的神話"
    ja: "文献と美術の中の神話を分析する"
    ko: "문헌과 예술 속 신화 분석하기"
    vi: "Phân tích thần thoại trong văn bản và nghệ thuật"
    ms: "Analisis mitos dalam teks dan seni"
    id: "Menganalisis mitos dalam teks dan seni"
    hi: "ग्रंथों और कला में मिथकों का विश्लेषण करना"
  - en: "Link myths to gender, power and daily life"
    zh: "把神话与性别、权力和日常生活联系起来"
    zh-TW: "把神話與性別、權力和日常生活聯繫起來"
    ja: "神話をジェンダー・権力・日常生活と結びつける"
    ko: "신화를 젠더, 권력, 일상과 연결하기"
    vi: "Liên hệ thần thoại với giới, quyền lực và đời sống"
    ms: "Kaitkan mitos dengan gender, kuasa dan kehidupan harian"
    id: "Mengaitkan mitos dengan gender, kekuasaan, dan hidup sehari-hari"
    hi: "मिथकों को जेंडर, सत्ता और दैनिक जीवन से जोड़ना"
