code: CRIM20006
year: 2026
learn:
  en: "Why and how society punishes: sentencing, prison life including for women and Indigenous prisoners, and key critical theorists."
  zh: "社会为何以及如何惩罚：量刑、监狱生活（包括女性和原住民囚犯），以及重要的批判理论家。"
  zh-TW: "社會為何以及如何懲罰：量刑、監獄生活（包括女性和原住民囚犯），以及重要的批判理論家。"
  ja: "社会はなぜ、どう罰するのか。量刑、女性や先住民を含む刑務所生活、主要な批判理論家。"
  ko: "사회는 왜, 어떻게 처벌하는가. 양형, 여성·원주민 수감자를 포함한 수감 생활, 주요 비판 이론가."
  vi: "Xã hội trừng phạt vì sao và thế nào: tuyên án, đời sống trong tù kể cả tù nhân nữ và bản địa, các nhà lý thuyết phê phán."
  ms: "Mengapa dan bagaimana masyarakat menghukum: hukuman, kehidupan penjara termasuk banduan wanita dan Orang Asli, serta ahli teori kritis."
  id: "Mengapa dan bagaimana masyarakat menghukum: vonis, kehidupan penjara termasuk tahanan perempuan dan Pribumi, serta teoretikus kritis."
  hi: "समाज क्यों और कैसे सज़ा देता है: सज़ा सुनाना, महिला व आदिवासी कैदियों समेत जेल जीवन, और प्रमुख आलोचनात्मक सिद्धांतकार।"
outcomes:
  - en: "Explain the main justifications for punishment"
    zh: "说明惩罚的主要理由"
    zh-TW: "說明懲罰的主要理由"
    ja: "刑罰の主な正当化理由を説明する"
    ko: "처벌의 주요 정당화 근거 설명하기"
    vi: "Giải thích các lý do chính biện minh cho hình phạt"
    ms: "Terangkan justifikasi utama hukuman"
    id: "Menjelaskan alasan utama pembenaran hukuman"
    hi: "सज़ा के मुख्य औचित्य समझाना"
  - en: "Describe how the correctional system works"
    zh: "描述惩教体系如何运作"
    zh-TW: "描述懲教體系如何運作"
    ja: "矯正制度の仕組みを説明する"
    ko: "교정 제도가 작동하는 방식 설명하기"
    vi: "Mô tả cách hệ thống cải huấn vận hành"
    ms: "Huraikan cara sistem pemulihan berfungsi"
    id: "Menggambarkan cara kerja sistem pemasyarakatan"
    hi: "सुधार व्यवस्था कैसे काम करती है, बताना"
  - en: "Apply critical theory to punishment"
    zh: "用批判理论分析惩罚"
    zh-TW: "用批判理論分析懲罰"
    ja: "批判理論を刑罰に当てはめる"
    ko: "비판 이론으로 처벌 분석하기"
    vi: "Áp dụng lý thuyết phê phán vào hình phạt"
    ms: "Gunakan teori kritis terhadap hukuman"
    id: "Menerapkan teori kritis pada hukuman"
    hi: "सज़ा पर आलोचनात्मक सिद्धांत लागू करना"
