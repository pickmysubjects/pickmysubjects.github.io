code: SOCI20019
year: 2026
learn:
  en: "A hands-on course in qualitative interviews: planning, running and analysing your own small interview study."
  zh: "动手学习质性访谈：自己设计、进行并分析一项小型访谈研究。"
  zh-TW: "動手學習質性訪談：自己設計、進行並分析一項小型訪談研究。"
  ja: "質的インタビューの実践。小さな調査を自分で計画・実施・分析する。"
  ko: "질적 인터뷰 실습. 작은 인터뷰 연구를 직접 계획하고 진행하고 분석한다."
  vi: "Học thực hành phỏng vấn định tính: tự lên kế hoạch, thực hiện và phân tích một nghiên cứu phỏng vấn nhỏ."
  ms: "Kursus amali temu bual kualitatif: merancang, menjalankan dan menganalisis kajian temu bual kecil sendiri."
  id: "Kuliah praktik wawancara kualitatif: merancang, menjalankan dan menganalisis studi wawancara kecil sendiri."
  hi: "गुणात्मक इंटरव्यू का व्यावहारिक कोर्स: अपना छोटा इंटरव्यू अध्ययन खुद योजना बनाकर करना और उसका विश्लेषण करना।"
outcomes:
  - en: "Design an interview study and its questions"
    zh: "设计访谈研究及访谈问题"
    zh-TW: "設計訪談研究及訪談問題"
    ja: "インタビュー調査と質問を設計する"
    ko: "인터뷰 연구와 질문 설계하기"
    vi: "Thiết kế nghiên cứu phỏng vấn và bộ câu hỏi"
    ms: "Reka bentuk kajian temu bual dan soalannya"
    id: "Merancang studi wawancara dan pertanyaannya"
    hi: "इंटरव्यू अध्ययन और उसके सवाल तैयार करना"
  - en: "Conduct interviews ethically and carefully"
    zh: "合乎伦理、认真地进行访谈"
    zh-TW: "合乎倫理、認真地進行訪談"
    ja: "倫理に配慮して丁寧に聞き取りを行う"
    ko: "윤리적이고 신중하게 인터뷰 진행하기"
    vi: "Thực hiện phỏng vấn cẩn thận và đúng đạo đức"
    ms: "Jalankan temu bual dengan beretika dan teliti"
    id: "Melakukan wawancara secara etis dan cermat"
    hi: "नैतिक और सावधान तरीके से इंटरव्यू करना"
  - en: "Analyse interview data and report findings"
    zh: "分析访谈资料并撰写研究发现"
    zh-TW: "分析訪談資料並撰寫研究發現"
    ja: "インタビューのデータを分析し結果をまとめる"
    ko: "인터뷰 자료를 분석하고 결과 보고하기"
    vi: "Phân tích dữ liệu phỏng vấn và trình bày kết quả"
    ms: "Analisis data temu bual dan laporkan dapatan"
    id: "Menganalisis data wawancara dan melaporkan temuan"
    hi: "इंटरव्यू डेटा का विश्लेषण कर नतीजे लिखना"
