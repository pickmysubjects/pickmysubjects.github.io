code: CWRI30013
year: 2026
learn:
  en: "Writing about real lives, including your own, with a focus on experimental forms and voices often left out."
  zh: "书写真实人生（包括自己的），重点关注实验性形式和常被忽视的声音。"
  zh-TW: "書寫真實人生（包括自己的），重點關注實驗性形式和常被忽視的聲音。"
  ja: "自分を含む実在の人生を書く。実験的な形式や見過ごされがちな声に注目する。"
  ko: "자신을 포함한 실제 삶에 대해 쓴다. 실험적 형식과 흔히 소외되는 목소리에 주목한다."
  vi: "Viết về đời thật, kể cả đời mình, chú trọng hình thức thử nghiệm và những tiếng nói thường bị bỏ qua."
  ms: "Menulis tentang kehidupan sebenar, termasuk diri sendiri, berfokus pada bentuk eksperimen dan suara yang sering terpinggir."
  id: "Menulis tentang kehidupan nyata, termasuk diri sendiri, dengan fokus pada bentuk eksperimental dan suara yang sering terpinggirkan."
  hi: "असली ज़िंदगियों के बारे में लिखना, अपनी भी, प्रयोगात्मक रूपों और अक्सर छूट जाने वाली आवाज़ों पर ध्यान के साथ।"
outcomes:
  - en: "Read memoir and other forms of life writing"
    zh: "阅读回忆录等各种生命书写"
    zh-TW: "閱讀回憶錄等各種生命書寫"
    ja: "回想録など様々なライフライティングを読む"
    ko: "회고록 등 다양한 생애 글쓰기 읽기"
    vi: "Đọc hồi ký và các hình thức viết về đời sống khác"
    ms: "Baca memoir dan bentuk penulisan kehidupan lain"
    id: "Membaca memoar dan bentuk tulisan kehidupan lain"
    hi: "संस्मरण और जीवन-लेखन के दूसरे रूप पढ़ना"
  - en: "Discuss ethics and voice in writing real lives"
    zh: "讨论书写真实人生时的伦理与声音"
    zh-TW: "討論書寫真實人生時的倫理與聲音"
    ja: "実在の人生を書くときの倫理と声を論じる"
    ko: "실제 삶을 쓸 때의 윤리와 목소리 논의하기"
    vi: "Thảo luận đạo đức và giọng điệu khi viết về đời thật"
    ms: "Bincangkan etika dan suara dalam menulis kehidupan sebenar"
    id: "Membahas etika dan suara dalam menulis kehidupan nyata"
    hi: "असली ज़िंदगियां लिखने में नैतिकता और आवाज़ पर चर्चा करना"
  - en: "Write and revise your own life writing"
    zh: "创作并修改自己的生命书写"
    zh-TW: "創作並修改自己的生命書寫"
    ja: "自分のライフライティングを書き推敲する"
    ko: "자신의 생애 글 쓰고 고치기"
    vi: "Viết và sửa tác phẩm viết về đời mình"
    ms: "Tulis dan semak penulisan kehidupan sendiri"
    id: "Menulis dan merevisi tulisan kehidupan sendiri"
    hi: "अपना जीवन-लेखन लिखना और सुधारना"
