code: MUSI20074
year: 2026
learn:
  en: "Large brass ensemble playing original works and transcriptions in many styles. Audition needed; graded pass/fail."
  zh: "大型铜管乐团，演奏原创与改编作品；需试音，只评通过/不通过。"
  zh-TW: "大型銅管樂團，演奏原創與改編作品；需試音，只評通過/不通過。"
  ja: "大編成金管アンサンブル。オリジナルと編曲作品。要オーディション、合否評価。"
  ko: "대편성 금관 앙상블. 오리지널과 편곡 작품. 오디션 필요, 통과/불통과."
  vi: "Dàn kèn đồng lớn, chơi tác phẩm gốc và chuyển soạn. Cần thử giọng; chấm đạt/không đạt."
  ms: "Ensembel brass besar, karya asal dan transkripsi. Perlu uji bakat; gred lulus/gagal."
  id: "Ansambel brass besar, karya asli dan transkripsi. Perlu audisi; dinilai lulus/tidak."
  hi: "बड़ा ब्रास समूह, मूल रचनाएँ और ट्रांसक्रिप्शन। ऑडिशन ज़रूरी; पास/फ़ेल ग्रेड।"
outcomes:
  - en: "Prepare your part and play it accurately in rehearsal"
    zh: "认真准备声部，排练中准确演奏"
    zh-TW: "認真準備聲部，排練中準確演奏"
    ja: "自分のパートを準備し、合奏で正確に演奏する"
    ko: "자기 파트를 준비해 리허설에서 정확히 연주하기"
    vi: "Chuẩn bị bè của mình và chơi chính xác khi tập"
    ms: "Sediakan bahagian sendiri dan mainkan dengan tepat semasa latihan"
    id: "Menyiapkan bagian sendiri dan memainkannya dengan tepat saat latihan"
    hi: "अपना पार्ट तैयार कर रिहर्सल में सही बजाना"
  - en: "Listen and blend with the group: tuning, balance, timing"
    zh: "倾听并融入集体：音准、平衡与节奏"
    zh-TW: "傾聽並融入團體：音準、平衡與節奏"
    ja: "周りを聴いて合わせる：音程・バランス・タイミング"
    ko: "앙상블과 어울리기: 음정, 균형, 타이밍"
    vi: "Lắng nghe và hòa với nhóm: cao độ, cân bằng, nhịp"
    ms: "Dengar dan sebati dengan kumpulan: nada, imbangan, masa"
    id: "Mendengar dan menyatu dengan grup: intonasi, keseimbangan, tempo"
    hi: "समूह को सुनकर घुलना-मिलना: सुर, संतुलन, टाइमिंग"
  - en: "Perform in public concerts as part of the ensemble"
    zh: "随乐团参加公开演出"
    zh-TW: "隨樂團參加公開演出"
    ja: "アンサンブルの一員として公演に出る"
    ko: "앙상블 일원으로 공개 공연하기"
    vi: "Biểu diễn trước khán giả cùng dàn nhạc"
    ms: "Membuat persembahan awam bersama ensembel"
    id: "Tampil di konser publik bersama ansambel"
    hi: "समूह के साथ सार्वजनिक कॉन्सर्ट में प्रस्तुति देना"
