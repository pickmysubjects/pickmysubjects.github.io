  vi: "Hệ bê tông cốt thép và dự ứng lực cho nhà thương mại, cao tầng, từ bản vẽ đến biện pháp thi công."
  ms: "Sistem konkrit bertetulang dan prategasan untuk bangunan komersial dan tinggi."
