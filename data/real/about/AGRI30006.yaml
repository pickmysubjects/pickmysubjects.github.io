code: AGRI30006
year: 2026
learn:
  en: "A semester-long research project at Dookie on a real problem from the farming industry, from proposal to final report."
  zh: "在Dookie做一学期研究项目，解决农业行业的真实问题，从提案到最终报告。"
  zh-TW: "在Dookie做一學期研究專題，處理農業產業的真實問題，從提案到期末報告。"
  ja: "Dookieで1学期、農業界の実課題に取り組む研究プロジェクト。提案から最終報告まで。"
  ko: "Dookie에서 한 학기 동안 농업계 실제 문제를 다루는 연구 프로젝트. 제안서부터 보고서까지."
  vi: "Dự án nghiên cứu một kỳ ở Dookie về vấn đề thật của ngành nông nghiệp."
  ms: "Projek penyelidikan satu semester di Dookie tentang masalah sebenar industri pertanian."
  id: "Proyek riset satu semester di Dookie tentang masalah nyata industri pertanian."
  hi: "Dookie में एक सेमेस्टर का शोध प्रोजेक्ट, कृषि उद्योग की असली समस्या पर, प्रस्ताव से रिपोर्ट तक।"
outcomes:
  - en: "Review the literature on an industry problem"
    zh: "梳理某个行业问题的文献"
    zh-TW: "梳理某個產業問題的文獻"
    ja: "業界課題の文献を整理する"
    ko: "산업 문제 관련 문헌 검토하기"
    vi: "Tổng quan tài liệu về vấn đề ngành"
    ms: "Kaji literatur masalah industri"
    id: "Mengkaji literatur masalah industri"
    hi: "उद्योग की समस्या पर साहित्य समीक्षा"
  - en: "Plan and carry out a research project"
    zh: "规划并完成研究项目"
    zh-TW: "規劃並完成研究專題"
    ja: "研究計画を立てて実行する"
    ko: "연구 계획 세우고 수행하기"
    vi: "Lên kế hoạch và thực hiện nghiên cứu"
    ms: "Rancang dan laksana projek penyelidikan"
    id: "Merancang dan menjalankan riset"
    hi: "शोध प्रोजेक्ट की योजना बनाकर पूरा करना"
  - en: "Report findings in writing and in a talk"
    zh: "用报告和演讲呈现成果"
    zh-TW: "以報告和簡報呈現成果"
    ja: "成果を報告書と発表で伝える"
    ko: "결과를 보고서와 발표로 전달하기"
    vi: "Trình bày kết quả bằng báo cáo và thuyết trình"
    ms: "Lapor dapatan secara bertulis dan lisan"
    id: "Menyampaikan temuan tertulis dan lisan"
    hi: "नतीजे लिखकर और बोलकर बताना"
