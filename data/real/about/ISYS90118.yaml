code: ISYS90118
year: 2027
learn:
  en: "Research skills for IS: literature reviews, research questions, and choosing qualitative or quantitative methods."
  zh: "信息系统研究技能：文献综述、研究问题设计，以及定性或定量方法的选择。"
  zh-TW: "資訊系統研究技能：文獻回顧、研究問題設計，以及質性或量化方法的選擇。"
  ja: "IS研究のスキル：文献レビュー、研究課題の設定、質的・量的手法の選び方。"
  ko: "IS 연구 역량: 문헌 검토, 연구 질문 설계, 질적·양적 방법 선택."
  vi: "Kỹ năng nghiên cứu IS: tổng quan tài liệu, câu hỏi nghiên cứu, chọn phương pháp định tính hay định lượng."
  ms: "Kemahiran penyelidikan IS: kajian literatur, soalan kajian, memilih kaedah kualitatif atau kuantitatif."
  id: "Keterampilan riset SI: tinjauan pustaka, pertanyaan riset, memilih metode kualitatif atau kuantitatif."
  hi: "IS के लिए शोध कौशल: साहित्य समीक्षा, शोध प्रश्न और गुणात्मक या मात्रात्मक तरीक़ा चुनना।"
outcomes:
  - en: "Write a critical literature review"
    zh: "撰写批判性的文献综述"
    zh-TW: "撰寫批判性的文獻回顧"
    ja: "批判的な文献レビューを書く"
    ko: "비판적 문헌 검토 쓰기"
    vi: "Viết tổng quan tài liệu có phân tích"
    ms: "Menulis kajian literatur yang kritis"
    id: "Menulis tinjauan pustaka yang kritis"
    hi: "आलोचनात्मक साहित्य समीक्षा लिखना"
  - en: "Design a study with a suitable research method"
    zh: "选择合适的研究方法并设计研究"
    zh-TW: "選擇合適的研究方法並設計研究"
    ja: "適切な手法を選んで研究を設計する"
    ko: "알맞은 연구 방법으로 연구 설계하기"
    vi: "Thiết kế nghiên cứu với phương pháp phù hợp"
    ms: "Mereka kajian dengan kaedah yang sesuai"
    id: "Merancang studi dengan metode yang sesuai"
    hi: "सही शोध तरीक़े से अध्ययन डिज़ाइन करना"
