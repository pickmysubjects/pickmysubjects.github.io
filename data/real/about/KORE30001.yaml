code: KORE30001
year: 2026
learn:
  en: "A final-year project on issues facing the Korean peninsula, such as division, defectors and migrant workers, with experts in Korea."
  zh: "毕业年级项目课，探讨朝鲜半岛面临的问题，如分裂、脱北者和外籍劳工，并与韩国专家合作。"
  zh-TW: "畢業年級專案課，探討朝鮮半島面臨的問題，如分裂、脫北者和外籍勞工，並與韓國專家合作。"
  ja: "最終学年のプロジェクト科目。分断、脱北者、移住労働者など朝鮮半島の課題に、韓国の専門家と取り組む。"
  ko: "졸업반 프로젝트 과목. 분단, 탈북민, 이주노동자 등 한반도의 과제를 한국의 전문가와 함께 다룬다."
  vi: "Dự án năm cuối về các vấn đề của bán đảo Triều Tiên như chia cắt, người đào tẩu, lao động nhập cư, cùng chuyên gia ở Hàn Quốc."
  ms: "Projek tahun akhir tentang isu Semenanjung Korea seperti perpecahan, pembelot dan pekerja migran, bersama pakar di Korea."
  id: "Proyek tahun akhir tentang isu Semenanjung Korea seperti perpecahan, pembelot dan pekerja migran, bersama para ahli di Korea."
  hi: "अंतिम वर्ष का प्रोजेक्ट: कोरियाई प्रायद्वीप के मुद्दे जैसे बँटवारा, भगोड़े और प्रवासी मज़दूर, कोरिया के विशेषज्ञों के साथ।"
outcomes:
  - en: "Research a current issue in Korean society"
    zh: "研究韩国社会的一个现实问题"
    zh-TW: "研究韓國社會的一個現實問題"
    ja: "韓国社会の今の課題を調べる"
    ko: "한국 사회의 현안 연구하기"
    vi: "Nghiên cứu một vấn đề hiện nay của xã hội Hàn Quốc"
    ms: "Kaji satu isu semasa masyarakat Korea"
    id: "Meneliti satu isu terkini masyarakat Korea"
    hi: "कोरियाई समाज के किसी मौजूदा मुद्दे पर शोध करना"
  - en: "Use Korean-language sources in research"
    zh: "在研究中使用韩语资料"
    zh-TW: "在研究中使用韓語資料"
    ja: "調査で韓国語の資料を使う"
    ko: "연구에 한국어 자료 활용하기"
    vi: "Dùng tài liệu tiếng Hàn trong nghiên cứu"
    ms: "Guna sumber bahasa Korea dalam penyelidikan"
    id: "Memakai sumber berbahasa Korea dalam riset"
    hi: "शोध में कोरियाई भाषा के स्रोत इस्तेमाल करना"
  - en: "Present project findings to experts"
    zh: "向专家展示项目成果"
    zh-TW: "向專家展示專案成果"
    ja: "専門家にプロジェクトの成果を発表する"
    ko: "전문가에게 프로젝트 결과 발표하기"
    vi: "Trình bày kết quả dự án trước chuyên gia"
    ms: "Bentangkan dapatan projek kepada pakar"
    id: "Mempresentasikan hasil proyek kepada para ahli"
    hi: "विशेषज्ञों के सामने प्रोजेक्ट के नतीजे रखना"
