code: MAST30022
year: 2026
learn:
  en: "Maths models for decisions: games between two players, multiple goals, uncertainty and group choice."
  zh: "决策的数学模型：双人博弈、多目标、不确定性和群体选择。"
  zh-TW: "決策的數學模型：雙人賽局、多目標、不確定性和群體選擇。"
  ja: "意思決定の数理モデル：2人ゲーム、多目的、不確実性、集団での選択。"
  ko: "의사결정의 수학 모델: 2인 게임, 다중 목표, 불확실성, 집단 선택."
  vi: "Mô hình toán cho quyết định: trò chơi hai người, đa mục tiêu, bất định và lựa chọn tập thể."
  ms: "Model matematik untuk keputusan: permainan dua pemain, pelbagai matlamat, ketidakpastian, pilihan kumpulan."
  id: "Model matematika untuk keputusan: permainan dua pemain, banyak tujuan, ketidakpastian, pilihan kelompok."
  hi: "निर्णयों के गणितीय मॉडल: दो खिलाड़ियों के खेल, कई लक्ष्य, अनिश्चितता और समूह चुनाव।"
outcomes:
  - en: "Solve two-person games with linear programming"
    zh: "用线性规划解双人博弈"
    zh-TW: "用線性規劃解雙人賽局"
    ja: "線形計画法で2人ゲームを解く"
    ko: "선형계획법으로 2인 게임 풀기"
    vi: "Giải trò chơi hai người bằng quy hoạch tuyến tính"
    ms: "Menyelesaikan permainan dua orang dengan pengaturcaraan linear"
    id: "Menyelesaikan permainan dua orang dengan pemrograman linear"
    hi: "रैखिक प्रोग्रामिंग से दो-खिलाड़ी खेल हल करना"
  - en: "Use decision trees and dynamic programming"
    zh: "用决策树和动态规划"
    zh-TW: "用決策樹和動態規劃"
    ja: "決定木と動的計画法を使う"
    ko: "의사결정 나무와 동적계획법 사용하기"
    vi: "Dùng cây quyết định và quy hoạch động"
    ms: "Menggunakan pepohon keputusan dan pengaturcaraan dinamik"
    id: "Memakai pohon keputusan dan pemrograman dinamis"
    hi: "डिसीज़न ट्री और डायनेमिक प्रोग्रामिंग का उपयोग"
  - en: "Solve decision problems under uncertainty"
    zh: "解不确定情况下的决策问题"
    zh-TW: "解不確定情況下的決策問題"
    ja: "不確実性のもとで意思決定問題を解く"
    ko: "불확실한 상황의 의사결정 문제 풀기"
    vi: "Giải bài toán quyết định khi có bất định"
    ms: "Menyelesaikan masalah keputusan di bawah ketidakpastian"
    id: "Menyelesaikan masalah keputusan dalam ketidakpastian"
    hi: "अनिश्चितता में निर्णय समस्याएँ हल करना"
