code: ACTL30001
year: 2026
learn:
  en: "Maths and statistics models used in life insurance, such as survival models and models of moving between states."
  zh: "寿险精算用的数学和统计模型，比如生存模型和状态转移模型。"
  zh-TW: "壽險精算用的數學和統計模型，例如存活模型和狀態轉移模型。"
  ja: "生命保険で使う数学・統計モデル。生存モデルや状態間の遷移モデルなど。"
  ko: "생명보험에 쓰이는 수학·통계 모델. 생존 모델, 상태 전이 모델 등."
  vi: "Mô hình toán và thống kê dùng trong bảo hiểm nhân thọ, như mô hình sống sót và chuyển trạng thái."
  ms: "Model matematik dan statistik dalam insurans hayat, seperti model kemandirian dan perpindahan antara keadaan."
  id: "Model matematika dan statistika di asuransi jiwa, seperti model survival dan perpindahan antar-status."
  hi: "लाइफ़ इंश्योरेंस में इस्तेमाल मैथ्स-स्टैटिस्टिक्स मॉडल, जैसे सर्वाइवल और स्टेट-ट्रांज़िशन मॉडल।"
outcomes:
  - en: "Build models of people moving between states"
    zh: "建立多状态转移模型"
    zh-TW: "建立多狀態轉移模型"
    ja: "状態間を移る人のモデルを作る"
    ko: "상태 간 이동 모델 만들기"
    vi: "Xây dựng mô hình chuyển giữa các trạng thái"
    ms: "Bina model perpindahan antara keadaan"
    id: "Membangun model perpindahan antar-status"
    hi: "लोगों के स्टेट बदलने के मॉडल बनाना"
  - en: "Estimate death and transition rates from data"
    zh: "用数据估计死亡率和转移率"
    zh-TW: "用資料估計死亡率和轉移率"
    ja: "データから死亡率と遷移率を推定する"
    ko: "데이터로 사망률과 전이율 추정하기"
    vi: "Ước tính tỷ lệ tử vong và chuyển trạng thái từ dữ liệu"
    ms: "Anggar kadar kematian dan peralihan daripada data"
    id: "Menaksir tingkat kematian dan transisi dari data"
    hi: "डेटा से मृत्यु दर और ट्रांज़िशन दर का अनुमान"
  - en: "Apply Markov chains to insurance problems"
    zh: "用马尔可夫链解决精算问题"
    zh-TW: "用馬可夫鏈解決精算問題"
    ja: "マルコフ連鎖を保険の問題に応用する"
    ko: "마르코프 연쇄를 보험 문제에 적용하기"
    vi: "Áp dụng xích Markov vào bài toán bảo hiểm"
    ms: "Guna rantai Markov untuk masalah insurans"
    id: "Menerapkan rantai Markov pada masalah asuransi"
    hi: "इंश्योरेंस समस्याओं पर मार्कोव चेन लागू करना"
