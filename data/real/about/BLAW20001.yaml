code: BLAW20001
year: 2026
learn:
  en: "The Australian law on companies: how they are set up, run, funded and wound up, and what directors owe."
  zh: "澳大利亚公司法：公司如何设立、运营、融资和清算，以及董事的义务。"
  zh-TW: "澳洲公司法：公司如何設立、經營、募資和清算，以及董事的義務。"
  ja: "オーストラリアの会社法：会社の設立・運営・資金調達・清算と、取締役の義務。"
  ko: "호주 회사법: 회사의 설립·운영·자금 조달·청산과 이사의 의무."
  vi: "Luật công ty Úc: công ty được lập, vận hành, huy động vốn và giải thể ra sao, và nghĩa vụ của giám đốc."
  ms: "Undang-undang syarikat Australia: cara syarikat ditubuh, diurus, dibiayai dan dibubar, serta tanggungjawab pengarah."
  id: "Hukum perusahaan Australia: cara perusahaan didirikan, dijalankan, didanai, dan dibubarkan, serta kewajiban direktur."
  hi: "ऑस्ट्रेलिया का कंपनी कानून: कंपनियाँ कैसे बनती, चलती, पैसा जुटाती और बंद होती हैं, और डायरेक्टरों की ज़िम्मेदारियाँ।"
outcomes:
  - en: "Explain a company's legal status and structure"
    zh: "解释公司的法律地位和结构"
    zh-TW: "說明公司的法律地位與結構"
    ja: "会社の法的な地位と構造を説明する"
    ko: "회사의 법적 지위와 구조 설명"
    vi: "Giải thích tư cách pháp lý và cấu trúc của công ty"
    ms: "Terangkan status undang-undang dan struktur syarikat"
    id: "Menjelaskan status hukum dan struktur perusahaan"
    hi: "कंपनी की कानूनी हैसियत और ढाँचा समझाना"
  - en: "Identify directors' duties and when they are breached"
    zh: "识别董事义务及其违反情形"
    zh-TW: "辨識董事義務及違反的情形"
    ja: "取締役の義務と、その違反にあたる場合を見分ける"
    ko: "이사의 의무와 위반 사례 파악"
    vi: "Nhận biết nghĩa vụ của giám đốc và khi nào bị vi phạm"
    ms: "Kenal pasti tugas pengarah dan bila ia dilanggar"
    id: "Mengenali kewajiban direktur dan kapan dilanggar"
    hi: "डायरेक्टरों के कर्तव्य और उनके उल्लंघन को पहचानना"
  - en: "Apply company law rules to practical problems"
    zh: "把公司法规则用于实际问题"
    zh-TW: "把公司法規則應用到實際問題"
    ja: "会社法のルールを実際の問題に当てはめる"
    ko: "회사법 규칙을 실제 문제에 적용"
    vi: "Áp dụng luật công ty vào tình huống thực tế"
    ms: "Guna peraturan undang-undang syarikat pada masalah sebenar"
    id: "Menerapkan aturan hukum perusahaan pada kasus nyata"
    hi: "कंपनी कानून के नियम असली मामलों पर लागू करना"
