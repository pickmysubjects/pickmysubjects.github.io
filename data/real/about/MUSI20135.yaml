code: MUSI20135
year: 2026
learn:
  en: "Learn a Chinese instrument such as dizi, sheng or erhu, read traditional notation and play in a silk-and-bamboo ensemble."
  zh: "学一件中国乐器（如笛子、笙、二胡），读传统乐谱，参加丝竹合奏。"
  zh-TW: "學一件中國樂器（如笛子、笙、二胡），讀傳統樂譜，參加絲竹合奏。"
  ja: "笛子・笙・二胡など中国楽器を学び、伝統譜を読み、絲竹合奏で演奏。"
  ko: "디즈·생·얼후 등 중국 악기를 배우고 전통 악보로 사죽 합주."
  vi: "Học nhạc cụ Trung Hoa như sáo dizi, sênh, nhị; đọc ký âm truyền thống và hòa tấu ti trúc."
  ms: "Belajar alat muzik Cina seperti dizi, sheng, erhu; baca notasi tradisional, main ensembel sutera-buluh."
  id: "Belajar alat musik Tiongkok seperti dizi, sheng, erhu; membaca notasi tradisional, main ansambel sutra-bambu."
  hi: "डिज़ी, शेंग या अरहू जैसा चीनी वाद्य सीखना, पारंपरिक नोटेशन पढ़ना और सिल्क-बाँस समूह में बजाना।"
outcomes:
  - en: "Play a traditional instrument with sound basic technique"
    zh: "掌握一件传统乐器的基本技巧"
    zh-TW: "掌握一件傳統樂器的基本技巧"
    ja: "伝統楽器の基本奏法を身につける"
    ko: "전통 악기의 기본 주법 익히기"
    vi: "Chơi một nhạc cụ truyền thống với kỹ thuật cơ bản"
    ms: "Main alat muzik tradisional dengan teknik asas"
    id: "Memainkan alat musik tradisional dengan teknik dasar"
    hi: "एक पारंपरिक वाद्य को बुनियादी तकनीक से बजाना"
  - en: "Read traditional Chinese music notation"
    zh: "读懂中国传统乐谱"
    zh-TW: "讀懂中國傳統樂譜"
    ja: "中国の伝統的な楽譜を読む"
    ko: "중국 전통 악보 읽기"
    vi: "Đọc ký âm nhạc truyền thống Trung Hoa"
    ms: "Baca notasi muzik tradisional Cina"
    id: "Membaca notasi musik tradisional Tiongkok"
    hi: "पारंपरिक चीनी संगीत नोटेशन पढ़ना"
  - en: "Understand the culture behind the music"
    zh: "理解音乐背后的文化"
    zh-TW: "理解音樂背後的文化"
    ja: "音楽の背景にある文化を理解する"
    ko: "음악 뒤의 문화 이해하기"
    vi: "Hiểu văn hóa đứng sau âm nhạc"
    ms: "Fahami budaya di sebalik muzik"
    id: "Memahami budaya di balik musiknya"
    hi: "संगीत के पीछे की संस्कृति समझना"
