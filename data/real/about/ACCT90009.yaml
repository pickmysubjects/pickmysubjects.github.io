code: ACCT90009
year: 2027
learn:
  en: "How cost accounting systems work and how cost information supports managers' decisions and creates value."
  zh: "成本会计系统如何运作，以及成本信息如何支持管理决策、创造价值。"
  zh-TW: "成本會計系統如何運作，以及成本資訊如何支援管理決策、創造價值。"
  ja: "原価計算システムの仕組みと、原価情報が経営判断と価値創造をどう支えるか。"
  ko: "원가회계 시스템의 작동 방식과 원가 정보가 경영 의사결정과 가치 창출을 돕는 방법."
  vi: "Hệ thống kế toán chi phí vận hành ra sao và thông tin chi phí hỗ trợ quyết định quản lý thế nào."
  ms: "Cara sistem perakaunan kos berfungsi dan bagaimana maklumat kos menyokong keputusan pengurus."
  id: "Cara kerja sistem akuntansi biaya dan bagaimana informasi biaya mendukung keputusan manajer."
  hi: "लागत लेखा प्रणालियाँ कैसे काम करती हैं और लागत जानकारी प्रबंधकों के निर्णयों में कैसे मदद करती है।"
outcomes:
  - en: "Classify costs and analyse cost behaviour"
    zh: "对成本分类并分析成本习性"
    zh-TW: "對成本分類並分析成本習性"
    ja: "原価を分類し原価態様を分析する"
    ko: "원가를 분류하고 원가행태 분석하기"
    vi: "Phân loại chi phí và phân tích ứng xử chi phí"
    ms: "Mengelaskan kos dan menganalisis kelakuan kos"
    id: "Mengklasifikasikan biaya dan menganalisis perilaku biaya"
    hi: "लागत का वर्गीकरण और लागत व्यवहार का विश्लेषण"
  - en: "Use cost information in management decisions"
    zh: "在管理决策中运用成本信息"
    zh-TW: "在管理決策中運用成本資訊"
    ja: "経営判断に原価情報を使う"
    ko: "경영 의사결정에 원가 정보 활용하기"
    vi: "Dùng thông tin chi phí cho quyết định quản lý"
    ms: "Menggunakan maklumat kos dalam keputusan pengurusan"
    id: "Memakai informasi biaya dalam keputusan manajemen"
    hi: "प्रबंधन निर्णयों में लागत जानकारी का उपयोग"
