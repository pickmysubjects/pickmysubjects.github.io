code: ITAL30010
year: 2026
learn:
  en: "How Italy is pictured in film and other visual stories, set against its social and political issues. Taught and assessed in Italian."
  zh: "意大利如何在电影和其他视觉叙事中被呈现，并结合其社会政治议题，用意大利语授课和考核。"
  zh-TW: "義大利如何在電影和其他視覺敘事中被呈現，並結合其社會政治議題，用義大利語授課和考核。"
  ja: "映画などの視覚的な物語でイタリアがどう描かれるかを、社会・政治の課題と合わせて学ぶ。授業と評価はイタリア語。"
  ko: "영화 등 시각적 이야기에서 이탈리아가 어떻게 그려지는지 사회·정치 문제와 함께 본다. 이탈리아어로 수업·평가."
  vi: "Nước Ý được khắc họa ra sao trong phim và kể chuyện bằng hình ảnh, gắn với vấn đề xã hội, chính trị. Dạy và đánh giá bằng tiếng Ý."
  ms: "Cara Itali digambarkan dalam filem dan naratif visual lain, berlatarkan isu sosial dan politiknya. Diajar dan dinilai dalam bahasa Itali."
  id: "Cara Italia digambarkan dalam film dan narasi visual lain, dengan latar isu sosial dan politiknya. Diajar dan dinilai dalam bahasa Italia."
  hi: "फ़िल्म और दूसरी दृश्य कहानियों में इटली की छवि, उसके सामाजिक-राजनीतिक मुद्दों के साथ। इतालवी में पढ़ाई और मूल्यांकन।"
outcomes:
  - en: "Analyse Italian films and visual texts"
    zh: "分析意大利电影和视觉文本"
    zh-TW: "分析義大利電影和視覺文本"
    ja: "イタリアの映画や視覚テクストを分析する"
    ko: "이탈리아 영화와 시각 텍스트 분석하기"
    vi: "Phân tích phim và văn bản hình ảnh của Ý"
    ms: "Analisis filem dan teks visual Itali"
    id: "Menganalisis film dan teks visual Italia"
    hi: "इतालवी फ़िल्मों और दृश्य पाठों का विश्लेषण करना"
  - en: "Link images of Italy to cultural debates"
    zh: "把意大利的形象与文化议题联系起来"
    zh-TW: "把義大利的形象與文化議題聯繫起來"
    ja: "イタリア像を文化的な論点と結びつける"
    ko: "이탈리아의 이미지를 문화 논쟁과 연결하기"
    vi: "Liên hệ hình ảnh nước Ý với các tranh luận văn hóa"
    ms: "Kaitkan imej Itali dengan perdebatan budaya"
    id: "Mengaitkan citra Italia dengan debat budaya"
    hi: "इटली की छवियों को सांस्कृतिक बहसों से जोड़ना"
  - en: "Discuss and write about films in Italian"
    zh: "用意大利语讨论和撰写影评"
    zh-TW: "用義大利語討論和撰寫影評"
    ja: "映画についてイタリア語で話し書く"
    ko: "이탈리아어로 영화에 대해 토론하고 쓰기"
    vi: "Thảo luận và viết về phim bằng tiếng Ý"
    ms: "Bincang dan tulis tentang filem dalam bahasa Itali"
    id: "Membahas dan menulis tentang film dalam bahasa Italia"
    hi: "इतालवी में फ़िल्मों पर चर्चा और लेखन करना"
