code: SWEN90017
year: 2027
learn:
  en: "First half of a large-team agile project for a real client: requirements, modelling, design and early builds."
  zh: "大型团队为真实客户做的敏捷项目上半部分：需求、建模、设计与早期开发。"
  zh-TW: "大型團隊為真實客戶做的敏捷專案上半部：需求、建模、設計與早期開發。"
  ja: "実際の顧客向け大規模チームのアジャイル開発・前半：要求、モデリング、設計、初期実装。"
  ko: "실제 고객을 위한 대규모 팀 애자일 프로젝트 전반부: 요구사항, 모델링, 설계, 초기 구현."
  vi: "Nửa đầu dự án agile nhóm lớn cho khách hàng thật: yêu cầu, mô hình hóa, thiết kế, bản dựng đầu."
  ms: "Separuh pertama projek agile pasukan besar untuk pelanggan sebenar: keperluan, pemodelan, reka bentuk dan binaan awal."
  id: "Paruh pertama proyek agile tim besar untuk klien nyata: kebutuhan, pemodelan, desain, versi awal."
  hi: "असली क्लाइंट के लिए बड़ी टीम का एजाइल प्रोजेक्ट, पहला भाग: आवश्यकताएँ, मॉडलिंग, डिज़ाइन, शुरुआती निर्माण।"
outcomes:
  - en: "Work out what a client needs and plan the product"
    zh: "弄清客户需求并规划产品"
    zh-TW: "釐清客戶需求並規劃產品"
    ja: "顧客の要望を整理し製品を計画する"
    ko: "고객 요구를 파악하고 제품 계획하기"
    vi: "Xác định nhu cầu khách hàng và lập kế hoạch sản phẩm"
    ms: "Memahami keperluan pelanggan dan merancang produk"
    id: "Memahami kebutuhan klien dan merencanakan produk"
    hi: "क्लाइंट की ज़रूरत समझना और प्रोडक्ट की योजना बनाना"
  - en: "Use agile methods in a large development team"
    zh: "在大型开发团队中使用敏捷方法"
    zh-TW: "在大型開發團隊中使用敏捷方法"
    ja: "大規模チームでアジャイル手法を使う"
    ko: "대규모 개발 팀에서 애자일 방법 사용하기"
    vi: "Áp dụng phương pháp agile trong nhóm phát triển lớn"
    ms: "Menggunakan kaedah agile dalam pasukan pembangunan besar"
    id: "Menerapkan metode agile dalam tim pengembang besar"
    hi: "बड़ी डेवलपमेंट टीम में एजाइल तरीके अपनाना"
