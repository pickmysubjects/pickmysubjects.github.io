code: CHEN90028
year: 2027
learn:
  en: "A project or work placement with an industry partner, applying engineering methods to real problems."
  zh: "在合作企业完成项目或实习，把工程方法用于实际问题。"
  zh-TW: "在合作企業完成專案或實習，把工程方法用於實際問題。"
  ja: "企業パートナーでのプロジェクトや就業体験で、工学の手法を実際の課題に使う。"
  ko: "산업체 파트너와 프로젝트나 현장 실습으로 실제 문제에 공학 방법 적용하기."
  vi: "Dự án hoặc thực tập với doanh nghiệp đối tác, áp dụng phương pháp kỹ thuật vào vấn đề thật."
  ms: "Projek atau penempatan kerja dengan rakan industri, menggunakan kaedah kejuruteraan pada masalah sebenar."
  id: "Proyek atau magang dengan mitra industri, menerapkan metode teknik pada masalah nyata."
  hi: "उद्योग साझेदार के साथ प्रोजेक्ट या कार्य अनुभव, असली समस्याओं पर इंजीनियरिंग तरीके लगाना।"
outcomes:
  - en: "Apply engineering methods to real problems at work"
    zh: "在工作中把工程方法用于实际问题"
    zh-TW: "在工作中把工程方法用於實際問題"
    ja: "職場で実際の問題に工学の手法を使う"
    ko: "현장에서 실제 문제에 공학 방법 적용하기"
    vi: "Áp dụng phương pháp kỹ thuật vào vấn đề thực tế tại nơi làm"
    ms: "Menggunakan kaedah kejuruteraan pada masalah sebenar di tempat kerja"
    id: "Menerapkan metode teknik pada masalah nyata di tempat kerja"
    hi: "कार्यस्थल पर असली समस्याओं में इंजीनियरिंग तरीके लगाना"
  - en: "Communicate in a way that suits the host organisation"
    zh: "以适合合作单位的方式沟通"
    zh-TW: "以適合合作單位的方式溝通"
    ja: "受け入れ先に合ったやり方で伝える"
    ko: "실습 기관에 맞게 소통하기"
    vi: "Giao tiếp phù hợp với tổ chức tiếp nhận"
    ms: "Berkomunikasi mengikut kesesuaian organisasi tuan rumah"
    id: "Berkomunikasi sesuai organisasi tempat magang"
    hi: "मेज़बान संस्था के अनुकूल संवाद करना"
