code: ITAL30016
year: 2026
learn:
  en: "Follows Italian 7: more films, music, media and books from today's Italy, and conversation aiming for fluent, natural Italian."
  zh: "接续意大利语 7：更多当代意大利的电影、音乐、媒体和书籍，会话目标是流利自然。"
  zh-TW: "接續義大利語 7：更多當代義大利的電影、音樂、媒體和書籍，會話目標是流利自然。"
  ja: "イタリア語7の続き。今のイタリアの映画・音楽・メディア・本をさらに扱い、自然で流暢な会話を目指す。"
  ko: "이탈리아어 7에 이어 오늘의 이탈리아 영화·음악·미디어·책을 더 다루고, 자연스럽고 유창한 회화를 목표로 한다."
  vi: "Tiếp nối Italian 7: thêm phim, nhạc, truyền thông và sách Ý hiện đại, hướng tới tiếng Ý trôi chảy, tự nhiên."
  ms: "Sambungan Italian 7: lebih banyak filem, muzik, media dan buku Itali kini, dengan perbualan ke arah fasih dan semula jadi."
  id: "Lanjutan Italian 7: lebih banyak film, musik, media dan buku Italia kini, dengan percakapan menuju lancar dan alami."
  hi: "इतालवी 7 के आगे: आज के इटली की और फ़िल्में, संगीत, मीडिया व किताबें, सहज और धाराप्रवाह बातचीत की ओर।"
outcomes:
  - en: "Discuss social and cultural topics in Italian"
    zh: "用意大利语讨论社会和文化话题"
    zh-TW: "用義大利語討論社會和文化話題"
    ja: "社会や文化の話題をイタリア語で話し合う"
    ko: "사회·문화 주제를 이탈리아어로 토론하기"
    vi: "Thảo luận chủ đề xã hội, văn hóa bằng tiếng Ý"
    ms: "Bincangkan topik sosial dan budaya dalam bahasa Itali"
    id: "Membahas topik sosial dan budaya dalam bahasa Italia"
    hi: "सामाजिक और सांस्कृतिक विषयों पर इतालवी में चर्चा करना"
  - en: "Read and write longer Italian texts"
    zh: "读写较长的意大利语文章"
    zh-TW: "讀寫較長的義大利語文章"
    ja: "長めのイタリア語の文章を読み書きする"
    ko: "긴 이탈리아어 글 읽고 쓰기"
    vi: "Đọc và viết văn bản tiếng Ý dài hơn"
    ms: "Baca dan tulis teks bahasa Itali yang lebih panjang"
    id: "Membaca dan menulis teks bahasa Italia yang lebih panjang"
    hi: "लंबे इतालवी पाठ पढ़ना-लिखना"
  - en: "Give a clear presentation in Italian"
    zh: "用意大利语做清楚的口头报告"
    zh-TW: "用義大利語做清楚的口頭報告"
    ja: "イタリア語で分かりやすく発表する"
    ko: "이탈리아어로 명확하게 발표하기"
    vi: "Thuyết trình rõ ràng bằng tiếng Ý"
    ms: "Buat pembentangan yang jelas dalam bahasa Itali"
    id: "Melakukan presentasi yang jelas dalam bahasa Italia"
    hi: "इतालवी में स्पष्ट प्रस्तुति देना"
