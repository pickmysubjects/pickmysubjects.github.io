code: COMP90084
year: 2027
learn:
  en: "Writing quantum programs and simple quantum algorithms like Grover's and Shor's, run on real cloud quantum computers."
  zh: "编写量子程序与 Grover、Shor 等简单量子算法，并在云端量子计算机上运行。"
  zh-TW: "撰寫量子程式與 Grover、Shor 等簡單量子演算法，並在雲端量子電腦上執行。"
  ja: "量子プログラムと Grover・Shor などの量子アルゴリズムを書き、クラウドの量子コンピュータで動かす。"
  ko: "양자 프로그램과 Grover·Shor 같은 양자 알고리즘을 작성해 클라우드 양자컴퓨터에서 실행."
  vi: "Viết chương trình lượng tử, thuật toán Grover, Shor và chạy trên máy lượng tử qua đám mây."
  ms: "Menulis program kuantum dan algoritma seperti Grover dan Shor, dijalankan pada komputer kuantum awan."
  id: "Menulis program kuantum dan algoritma seperti Grover dan Shor, dijalankan di komputer kuantum cloud."
  hi: "क्वांटम प्रोग्राम और Grover, Shor जैसे एल्गोरिद्म लिखना, क्लाउड क्वांटम कंप्यूटर पर चलाना।"
outcomes:
  - en: "Write and run programs on a quantum computer"
    zh: "编写并在量子计算机上运行程序"
    zh-TW: "撰寫並在量子電腦上執行程式"
    ja: "量子コンピュータでプログラムを書いて動かす"
    ko: "양자컴퓨터에서 프로그램 작성·실행하기"
    vi: "Viết và chạy chương trình trên máy tính lượng tử"
    ms: "Tulis dan jalankan program pada komputer kuantum"
    id: "Menulis dan menjalankan program di komputer kuantum"
    hi: "क्वांटम कंप्यूटर पर प्रोग्राम लिखना और चलाना"
  - en: "Implement simple quantum algorithms"
    zh: "实现简单的量子算法"
    zh-TW: "實作簡單的量子演算法"
    ja: "簡単な量子アルゴリズムを実装する"
    ko: "간단한 양자 알고리즘 구현하기"
    vi: "Cài đặt thuật toán lượng tử đơn giản"
    ms: "Laksana algoritma kuantum mudah"
    id: "Mengimplementasikan algoritma kuantum sederhana"
    hi: "सरल क्वांटम एल्गोरिद्म बनाना"
