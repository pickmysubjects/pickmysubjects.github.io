code: DPSS10005
year: 2026
learn:
  en: "Plays and art objects from 1900 to now, read in their own time and today, through lectures and group discussion."
  zh: "1900年至今的剧作与艺术品，放回当时与今天来解读。"
  zh-TW: "1900年至今的劇作與藝術品，放回當時與今天來解讀。"
  ja: "1900年から現在までの戯曲と美術品を、当時と今の文脈で読み解く。"
  ko: "1900년부터 지금까지의 희곡과 미술품을 당시와 오늘의 맥락에서 읽는다."
  vi: "Kịch bản và tác phẩm nghệ thuật từ 1900 đến nay, đọc trong bối cảnh xưa và nay."
  ms: "Teks persembahan dan objek seni dari 1900 hingga kini, dibaca dalam konteks dulu dan sekarang."
  id: "Naskah pertunjukan dan karya seni sejak 1900, dibaca dalam konteks dulu dan kini."
  hi: "1900 से आज तक के नाटक और कला-वस्तुएँ, उस समय और आज के संदर्भ में पढ़ना।"
outcomes:
  - en: "Analyse a play alongside a related artwork"
    zh: "结合相关艺术品分析一部剧作"
    zh-TW: "結合相關藝術品分析一部劇作"
    ja: "戯曲を関連する美術品と合わせて分析する"
    ko: "희곡을 관련 미술품과 함께 분석하기"
    vi: "Phân tích vở kịch cùng một tác phẩm liên quan"
    ms: "Analisis teks persembahan bersama karya seni berkaitan"
    id: "Menganalisis naskah bersama karya seni terkait"
    hi: "नाटक को संबंधित कलाकृति के साथ विश्लेषित करना"
  - en: "Place modern works in their historical context"
    zh: "把现代作品放回历史背景"
    zh-TW: "把現代作品放回歷史背景"
    ja: "近現代の作品を歴史的文脈に位置づける"
    ko: "현대 작품을 역사적 맥락에 놓기"
    vi: "Đặt tác phẩm hiện đại vào bối cảnh lịch sử"
    ms: "Letakkan karya moden dalam konteks sejarah"
    id: "Menempatkan karya modern dalam konteks sejarah"
    hi: "आधुनिक कृतियों को ऐतिहासिक संदर्भ में रखना"
  - en: "Present and write a researched argument"
    zh: "做展示并写出有研究支撑的论述"
    zh-TW: "做報告並寫出有研究支撐的論述"
    ja: "調べた内容をもとに発表し論述する"
    ko: "조사에 기반해 발표하고 글로 논증하기"
    vi: "Thuyết trình và viết lập luận có nghiên cứu"
    ms: "Membentang dan menulis hujah berasaskan kajian"
    id: "Presentasi dan menulis argumen berbasis riset"
    hi: "शोध के आधार पर प्रस्तुति और लेखन"
