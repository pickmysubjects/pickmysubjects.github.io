code: SOCI20021
year: 2026
learn:
  en: "How digital technology changes everyday life, and how society in turn shapes the tech we build and use."
  zh: "数字技术如何改变日常生活，社会又如何反过来塑造我们开发和使用的技术。"
  zh-TW: "數位科技如何改變日常生活，社會又如何反過來塑造我們開發和使用的科技。"
  ja: "デジタル技術が日常をどう変え、社会が技術の作り方・使い方をどう形づくるかを学ぶ。"
  ko: "디지털 기술이 일상을 어떻게 바꾸고, 사회가 다시 기술을 어떻게 만드는지 배운다."
  vi: "Công nghệ số thay đổi đời sống thường ngày ra sao, và xã hội ngược lại định hình công nghệ ta tạo và dùng thế nào."
  ms: "Bagaimana teknologi digital mengubah kehidupan harian, dan bagaimana masyarakat pula membentuk teknologi yang kita bina dan guna."
  id: "Bagaimana teknologi digital mengubah kehidupan sehari-hari, dan bagaimana masyarakat membentuk teknologi yang kita buat dan pakai."
  hi: "डिजिटल तकनीक रोज़मर्रा के जीवन को कैसे बदलती है, और समाज बदले में हमारी बनाई और इस्तेमाल की जाने वाली तकनीक को कैसे गढ़ता है।"
outcomes:
  - en: "Explain key ideas from the sociology of technology"
    zh: "说明技术社会学的核心概念"
    zh-TW: "說明科技社會學的核心概念"
    ja: "技術社会学の主要な考え方を説明する"
    ko: "기술사회학의 핵심 개념 설명하기"
    vi: "Giải thích các ý tưởng chính của xã hội học công nghệ"
    ms: "Terangkan idea utama sosiologi teknologi"
    id: "Menjelaskan gagasan utama sosiologi teknologi"
    hi: "तकनीक के समाजशास्त्र के मुख्य विचार समझाना"
  - en: "Weigh the social benefits and harms of digital tech"
    zh: "权衡数字技术的社会利弊"
    zh-TW: "權衡數位科技的社會利弊"
    ja: "デジタル技術の社会的な利点と害を比べる"
    ko: "디지털 기술의 사회적 이익과 해악 따져 보기"
    vi: "Cân nhắc lợi ích và tác hại xã hội của công nghệ số"
    ms: "Timbang manfaat dan mudarat sosial teknologi digital"
    id: "Menimbang manfaat dan dampak buruk sosial teknologi digital"
    hi: "डिजिटल तकनीक के सामाजिक फायदे और नुकसान तौलना"
  - en: "Analyse issues like privacy and the digital divide"
    zh: "分析隐私和数字鸿沟等问题"
    zh-TW: "分析隱私和數位落差等問題"
    ja: "プライバシーやデジタル格差などを分析する"
    ko: "프라이버시와 디지털 격차 같은 문제 분석하기"
    vi: "Phân tích các vấn đề như quyền riêng tư và khoảng cách số"
    ms: "Analisis isu seperti privasi dan jurang digital"
    id: "Menganalisis isu seperti privasi dan kesenjangan digital"
    hi: "निजता और डिजिटल खाई जैसे मुद्दों का विश्लेषण करना"
