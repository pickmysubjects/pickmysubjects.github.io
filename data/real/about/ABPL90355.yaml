code: ABPL90355
year: 2027
learn:
  en: "Global heritage through case studies: UNESCO listings, international charters, war, tourism and twentieth-century heritage."
  zh: "通过案例学习全球遗产：联合国教科文组织名录、国际宪章、战争、旅游和二十世纪遗产。"
  zh-TW: "透過案例學習全球遺產：聯合國教科文組織名錄、國際憲章、戰爭、觀光與二十世紀遺產。"
  ja: "事例で学ぶ世界の遺産：ユネスコ登録、国際憲章、戦争、観光、20世紀遺産。"
  ko: "사례로 배우는 세계 유산: 유네스코 등재, 국제 헌장, 전쟁, 관광, 20세기 유산."
  vi: "Di sản toàn cầu qua tình huống: danh sách UNESCO, hiến chương quốc tế, chiến tranh, du lịch."
  ms: "Warisan global melalui kajian kes: senarai UNESCO, piagam antarabangsa, perang dan pelancongan."
  id: "Warisan global lewat studi kasus: daftar UNESCO, piagam internasional, perang, dan pariwisata."
  hi: "केस स्टडी से वैश्विक धरोहर: यूनेस्को सूची, अंतरराष्ट्रीय चार्टर, युद्ध, पर्यटन और 20वीं सदी की धरोहर।"
outcomes:
  - en: "Compare international heritage charters and bodies"
    zh: "比较国际遗产宪章和机构"
    zh-TW: "比較國際遺產憲章與機構"
    ja: "国際的な遺産憲章と機関を比較する"
    ko: "국제 유산 헌장과 기관 비교하기"
    vi: "So sánh hiến chương và tổ chức di sản quốc tế"
    ms: "Membandingkan piagam dan badan warisan antarabangsa"
    id: "Membandingkan piagam dan lembaga warisan dunia"
    hi: "अंतरराष्ट्रीय धरोहर चार्टर व संस्थाओं की तुलना"
  - en: "Analyse heritage projects at different scales"
    zh: "分析不同尺度的遗产项目"
    zh-TW: "分析不同尺度的遺產專案"
    ja: "さまざまな規模の遺産事例を分析する"
    ko: "다양한 규모의 유산 사업 분석하기"
    vi: "Phân tích dự án di sản ở nhiều quy mô"
    ms: "Menganalisis projek warisan pelbagai skala"
    id: "Menganalisis proyek warisan berbagai skala"
    hi: "विभिन्न स्तरों की धरोहर परियोजनाओं का विश्लेषण"
