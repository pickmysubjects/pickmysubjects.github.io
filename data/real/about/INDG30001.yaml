code: INDG30001
year: 2026
learn:
  en: "The Indigenous Studies capstone: what it means to be Indigenous today, through rights, self-determination and community-led work."
  zh: "原住民研究总结课：从权利、自决和社群主导的工作看今天作为原住民意味着什么。"
  zh-TW: "原住民研究總結課：從權利、自決和社群主導的工作看今天作為原住民意味著什麼。"
  ja: "先住民研究のキャップストーン。権利・自己決定・地域主導の取り組みから、今先住民であることの意味を考える。"
  ko: "원주민학 캡스톤: 권리, 자기결정, 공동체 주도 활동으로 오늘날 원주민으로 산다는 의미를 살펴본다."
  vi: "Môn tổng kết ngành Nghiên cứu bản địa: là người bản địa ngày nay nghĩa là gì, qua quyền, tự quyết và sáng kiến cộng đồng."
  ms: "Subjek akhir Kajian Orang Asal: maksud menjadi Orang Asal kini, melalui hak, penentuan nasib sendiri dan usaha komuniti."
  id: "Mata kuliah penutup Studi Adat: arti menjadi masyarakat adat kini, lewat hak, penentuan nasib sendiri, dan inisiatif komunitas."
  hi: "इंडिजिनस स्टडीज़ कैपस्टोन: आज मूलनिवासी होने का अर्थ, अधिकारों, आत्मनिर्णय और समुदाय-आधारित कामों के ज़रिए।"
outcomes:
  - en: "Draw together learning from the major"
    zh: "整合专业所学"
    zh-TW: "整合主修所學"
    ja: "専攻での学びをまとめる"
    ko: "전공에서 배운 것 종합하기"
    vi: "Tổng hợp kiến thức từ chuyên ngành"
    ms: "Gabungkan pembelajaran daripada major"
    id: "Menyatukan pembelajaran dari jurusan"
    hi: "मेजर से सीखी बातों को जोड़ना"
  - en: "Analyse Indigenous rights and governance"
    zh: "分析原住民权利与治理"
    zh-TW: "分析原住民權利與治理"
    ja: "先住民の権利と統治を分析する"
    ko: "원주민 권리와 거버넌스 분석하기"
    vi: "Phân tích quyền và quản trị của người bản địa"
    ms: "Analisis hak dan tadbir urus Orang Asal"
    id: "Menganalisis hak dan tata kelola masyarakat adat"
    hi: "मूलनिवासी अधिकारों और शासन का विश्लेषण करना"
  - en: "Discuss stories of Indigenous resilience"
    zh: "讨论原住民坚韧生存的故事"
    zh-TW: "討論原住民堅韌生存的故事"
    ja: "先住民の粘り強さの物語を論じる"
    ko: "원주민의 회복력 이야기 논의하기"
    vi: "Thảo luận những câu chuyện về sức bền của người bản địa"
    ms: "Bincangkan kisah ketahanan Orang Asal"
    id: "Membahas kisah ketangguhan masyarakat adat"
    hi: "मूलनिवासी लचीलेपन की कहानियों पर चर्चा करना"
