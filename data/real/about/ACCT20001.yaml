code: ACCT20001
year: 2026
learn:
  en: "How firms work out what products and services cost, and use those numbers to make better business decisions."
  zh: "企业如何算出产品和服务的成本，并用这些数字做更好的决策。"
  zh-TW: "企業如何算出產品和服務的成本，並用這些數字做出更好的決策。"
  ja: "企業が製品やサービスのコストをどう算出し、その数字で意思決定するか。"
  ko: "기업이 제품과 서비스 원가를 계산하고 그 숫자로 더 나은 결정을 내리는 방법."
  vi: "Doanh nghiệp tính chi phí sản phẩm, dịch vụ ra sao và dùng số liệu đó để ra quyết định tốt hơn."
  ms: "Cara firma mengira kos produk dan perkhidmatan, dan guna angka itu untuk buat keputusan lebih baik."
  id: "Cara perusahaan menghitung biaya produk dan jasa, lalu memakai angka itu untuk keputusan yang lebih baik."
  hi: "कंपनियाँ प्रोडक्ट और सर्विस की लागत कैसे निकालती हैं और उन आँकड़ों से बेहतर फ़ैसले कैसे लेती हैं।"
outcomes:
  - en: "Estimate how costs change with activity"
    zh: "估计成本如何随业务量变化"
    zh-TW: "估計成本如何隨業務量變化"
    ja: "活動量に応じたコストの変化を見積もる"
    ko: "활동량에 따른 원가 변화 추정"
    vi: "Ước tính chi phí thay đổi theo mức hoạt động"
    ms: "Anggar perubahan kos mengikut tahap aktiviti"
    id: "Memperkirakan perubahan biaya sesuai tingkat aktivitas"
    hi: "गतिविधि के साथ लागत कैसे बदलती है, इसका अनुमान लगाना"
  - en: "Cost products and services with different costing systems"
    zh: "用不同的成本核算方法计算产品和服务成本"
    zh-TW: "用不同的成本計算方法算出產品和服務成本"
    ja: "さまざまな原価計算方法で製品・サービスの原価を出す"
    ko: "여러 원가계산 방식으로 제품·서비스 원가 산정"
    vi: "Tính giá thành sản phẩm, dịch vụ bằng nhiều hệ thống khác nhau"
    ms: "Kira kos produk dan perkhidmatan dengan pelbagai sistem kos"
    id: "Menghitung biaya produk dan jasa dengan berbagai sistem biaya"
    hi: "अलग-अलग कॉस्टिंग सिस्टम से प्रोडक्ट और सर्विस की लागत निकालना"
  - en: "Use cost information to make value-based decisions"
    zh: "用成本信息做以价值为导向的决策"
    zh-TW: "用成本資訊做以價值為導向的決策"
    ja: "コスト情報を使って価値を高める判断をする"
    ko: "원가 정보를 활용해 가치 중심 결정 내리기"
    vi: "Dùng thông tin chi phí để ra quyết định tạo giá trị"
    ms: "Guna maklumat kos untuk keputusan berasaskan nilai"
    id: "Memakai informasi biaya untuk keputusan berbasis nilai"
    hi: "लागत की जानकारी से वैल्यू-आधारित फ़ैसले लेना"
