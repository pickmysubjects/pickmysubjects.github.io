code: HPSC20023
year: 2026
learn:
  en: "Debates on the science of sex and gender, like 'male and female brains' and women's sport, seen through history and philosophy of science."
  zh: "围绕性与性别科学的激烈争论，如“男脑与女脑”、女子体育，从科学史与科学哲学角度审视。"
  zh-TW: "圍繞性與性別科學的激烈爭論，如「男腦與女腦」、女子體育，從科學史與科學哲學角度審視。"
  ja: "「男性脳・女性脳」や女子スポーツなど、性とジェンダーの科学をめぐる論争を科学史・科学哲学から考える。"
  ko: "'남성 뇌·여성 뇌', 여성 스포츠 등 성과 젠더 과학을 둘러싼 논쟁을 과학사·과학철학으로 살펴본다."
  vi: "Tranh luận về khoa học giới tính và giới như 'não nam, não nữ' hay thể thao nữ, nhìn qua lịch sử và triết học khoa học."
  ms: "Perdebatan tentang sains seks dan gender, seperti 'otak lelaki dan wanita' dan sukan wanita, melalui sejarah dan falsafah sains."
  id: "Perdebatan tentang sains seks dan gender, seperti 'otak laki-laki dan perempuan' dan olahraga perempuan, lewat sejarah dan filsafat sains."
  hi: "सेक्स और जेंडर के विज्ञान पर बहसें, जैसे 'पुरुष और स्त्री मस्तिष्क' और महिला खेल, विज्ञान के इतिहास व दर्शन की नज़र से।"
outcomes:
  - en: "Spot how cultural bias can enter science"
    zh: "识别文化偏见如何渗入科学"
    zh-TW: "辨識文化偏見如何滲入科學"
    ja: "文化的な偏りが科学に入り込む仕組みを見抜く"
    ko: "문화적 편견이 과학에 스며드는 방식 알아차리기"
    vi: "Nhận ra định kiến văn hóa len vào khoa học ra sao"
    ms: "Kenal pasti cara bias budaya masuk ke dalam sains"
    id: "Mengenali cara bias budaya masuk ke sains"
    hi: "सांस्कृतिक पूर्वाग्रह विज्ञान में कैसे घुसता है, पहचानना"
  - en: "Weigh evidence in contested science debates"
    zh: "在有争议的科学辩论中权衡证据"
    zh-TW: "在有爭議的科學辯論中權衡證據"
    ja: "論争のある科学の議論で証拠を吟味する"
    ko: "논쟁적인 과학 토론에서 증거 따져보기"
    vi: "Cân nhắc bằng chứng trong các tranh luận khoa học"
    ms: "Timbang bukti dalam perdebatan sains yang dipertikai"
    id: "Menimbang bukti dalam debat sains yang diperdebatkan"
    hi: "विवादित वैज्ञानिक बहसों में सबूत तौलना"
  - en: "Argue your view clearly and fairly"
    zh: "清晰、公正地论证自己的观点"
    zh-TW: "清晰、公正地論證自己的觀點"
    ja: "自分の考えを明快かつ公正に論じる"
    ko: "자신의 견해를 명확하고 공정하게 논증하기"
    vi: "Lập luận quan điểm rõ ràng và công bằng"
    ms: "Berhujah dengan jelas dan adil"
    id: "Berargumen dengan jelas dan adil"
    hi: "अपनी राय साफ़ और निष्पक्ष रखना"
