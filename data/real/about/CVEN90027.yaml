code: CVEN90027
year: 2027
learn:
  en: "Pile foundations, basic rock mechanics, rock slopes, site investigation, tunnels and earth dams."
  zh: "桩基础、岩石力学基础、岩质边坡、场地勘察、隧道和土石坝。"
  zh-TW: "樁基礎、岩石力學基礎、岩坡、基地調查、隧道與土石壩。"
  ja: "杭基礎、岩盤力学の基礎、岩盤斜面、地盤調査、トンネル、アースダム。"
  ko: "말뚝 기초, 암반역학 기초, 암반 사면, 현장 조사, 터널과 흙댐."
  vi: "Móng cọc, cơ học đá cơ bản, mái dốc đá, khảo sát hiện trường, hầm và đập đất."
  ms: "Asas cerucuk, asas mekanik batuan, cerun batuan, penyiasatan tapak, terowong dan empangan tanah."
  id: "Fondasi tiang, dasar mekanika batuan, lereng batuan, penyelidikan lokasi, terowongan dan bendungan urugan."
  hi: "पाइल नींव, बुनियादी रॉक मैकेनिक्स, चट्टानी ढलान, साइट जाँच, सुरंगें और मिट्टी के बाँध।"
outcomes:
  - en: "Design single piles and pile groups"
    zh: "设计单桩和群桩"
    zh-TW: "設計單樁與群樁"
    ja: "単杭と群杭を設計する"
    ko: "단일 말뚝과 무리 말뚝 설계하기"
    vi: "Thiết kế cọc đơn và nhóm cọc"
    ms: "Mereka bentuk cerucuk tunggal dan kumpulan cerucuk"
    id: "Merancang tiang tunggal dan kelompok tiang"
    hi: "एकल पाइल और पाइल समूह डिज़ाइन करना"
  - en: "Use rock mechanics to assess slope stability"
    zh: "用岩石力学评估边坡稳定性"
    zh-TW: "以岩石力學評估邊坡穩定性"
    ja: "岩盤力学で斜面安定を評価する"
    ko: "암반역학으로 사면 안정성 평가하기"
    vi: "Dùng cơ học đá để đánh giá ổn định mái dốc"
    ms: "Menggunakan mekanik batuan untuk menilai kestabilan cerun"
    id: "Memakai mekanika batuan untuk menilai stabilitas lereng"
    hi: "ढलान की स्थिरता आँकने के लिए रॉक मैकेनिक्स का उपयोग"
  - en: "Evaluate key issues in earth dam and tunnel projects"
    zh: "评估土石坝和隧道工程的关键问题"
    zh-TW: "評估土石壩與隧道工程的關鍵問題"
    ja: "アースダムとトンネル事業の重要課題を評価する"
    ko: "흙댐과 터널 사업의 핵심 쟁점 평가하기"
    vi: "Đánh giá vấn đề chính trong dự án đập đất và hầm"
    ms: "Menilai isu utama dalam projek empangan tanah dan terowong"
    id: "Menilai isu utama proyek bendungan urugan dan terowongan"
    hi: "मिट्टी के बाँध और सुरंग परियोजनाओं के मुख्य मुद्दों का आकलन"
