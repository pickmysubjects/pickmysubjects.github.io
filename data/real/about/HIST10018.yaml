code: HIST10018
year: 2027
learn:
  en: "Australian history told through 20 objects, from deep time to today, with workshops at museums and archives."
  zh: "通过20件物品讲述澳大利亚历史，从远古到今天，并在博物馆和档案馆上实践课。"
  zh-TW: "透過20件物品講述澳洲歷史，從遠古到今天，並在博物館和檔案館上實作課。"
  ja: "20の物を通して太古から現在までのオーストラリア史をたどり、博物館や資料館でワークショップを行う。"
  ko: "20개의 물건으로 태고부터 오늘까지의 호주 역사를 살피고, 박물관과 기록관에서 워크숍을 한다."
  vi: "Lịch sử Úc qua 20 hiện vật, từ thời xa xưa đến nay, với các buổi thực hành tại bảo tàng và lưu trữ."
  ms: "Sejarah Australia melalui 20 objek, dari zaman purba hingga kini, dengan bengkel di muzium dan arkib."
  id: "Sejarah Australia lewat 20 benda, dari masa purba hingga kini, dengan lokakarya di museum dan arsip."
  hi: "20 वस्तुओं के ज़रिये प्राचीन काल से आज तक ऑस्ट्रेलिया का इतिहास, संग्रहालयों और अभिलेखागारों में वर्कशॉप के साथ।"
outcomes:
  - en: "Use objects as historical evidence"
    zh: "把物品当作历史证据来分析"
    zh-TW: "把物品當作歷史證據來分析"
    ja: "物を歴史的証拠として使う"
    ko: "물건을 역사적 증거로 활용하기"
    vi: "Dùng hiện vật làm bằng chứng lịch sử"
    ms: "Guna objek sebagai bukti sejarah"
    id: "Memakai benda sebagai bukti sejarah"
    hi: "वस्तुओं को ऐतिहासिक साक्ष्य के रूप में इस्तेमाल करना"
  - en: "Explain key turning points in Australian history"
    zh: "解释澳大利亚历史的重要转折点"
    zh-TW: "解釋澳洲歷史的重要轉折點"
    ja: "オーストラリア史の重要な転換点を説明する"
    ko: "호주 역사의 주요 전환점 설명하기"
    vi: "Giải thích các bước ngoặt chính của lịch sử Úc"
    ms: "Terangkan titik perubahan utama dalam sejarah Australia"
    id: "Menjelaskan titik balik penting sejarah Australia"
    hi: "ऑस्ट्रेलियाई इतिहास के बड़े मोड़ समझाना"
  - en: "Build well-supported historical arguments"
    zh: "构建有理有据的历史论证"
    zh-TW: "建構有理有據的歷史論證"
    ja: "根拠のある歴史的議論を組み立てる"
    ko: "근거 있는 역사적 논증 세우기"
    vi: "Xây dựng lập luận lịch sử có căn cứ"
    ms: "Bina hujah sejarah yang berasas"
    id: "Menyusun argumen sejarah yang berdasar"
    hi: "ठोस प्रमाणों वाले ऐतिहासिक तर्क बनाना"
