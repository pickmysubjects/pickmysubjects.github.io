    ms: "Jejaki sejarah politik Indonesia"
    id: "Menelusuri sejarah politik Indonesia"
    hi: "इंडोनेशिया के राजनीतिक इतिहास का क्रम समझना"
  - en: "Analyse tensions in Indonesian public life"
    zh: "分析印尼公共生活中的矛盾"
