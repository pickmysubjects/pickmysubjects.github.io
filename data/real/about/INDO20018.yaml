    ja: "インドネシアの公共生活の緊張を分析する"
    ko: "인도네시아 공공 생활의 긴장 분석하기"
    vi: "Phân tích những căng thẳng trong đời sống công cộng Indonesia"
    ms: "Analisis ketegangan dalam kehidupan awam Indonesia"
    id: "Menganalisis ketegangan dalam kehidupan publik Indonesia"
    hi: "इंडोनेशियाई सार्वजनिक जीवन के तनावों का विश्लेषण करना"
  - en: "Discuss key social issues in Indonesia today"
