code: INDO20018
year: 2026
learn:
  en: "Cultural and political change in Indonesia from late colonial rule through the New Order to today's democracy."
  zh: "印尼从殖民后期、新秩序时期到如今民主时代的文化和政治变迁。"
  zh-TW: "印尼從殖民後期、新秩序時期到如今民主時代的文化和政治變遷。"
  ja: "植民地末期から新秩序体制を経て今の民主化時代まで、インドネシアの文化と政治の変化を学ぶ。"
  ko: "식민 말기부터 신질서 체제를 거쳐 오늘날 민주 시대까지 인도네시아의 문화·정치 변화를 배운다."
  vi: "Biến đổi văn hóa và chính trị ở Indonesia từ cuối thời thuộc địa qua Trật tự Mới đến nền dân chủ ngày nay."
  ms: "Perubahan budaya dan politik Indonesia dari akhir zaman penjajahan melalui Orde Baru hingga demokrasi hari ini."
  id: "Perubahan budaya dan politik Indonesia dari akhir masa kolonial, melewati Orde Baru, hingga era demokrasi kini."
  hi: "देर औपनिवेशिक दौर से न्यू ऑर्डर होते हुए आज के लोकतंत्र तक इंडोनेशिया में सांस्कृतिक और राजनीतिक बदलाव।"
outcomes:
