code: FINA20033
year: 2026
learn:
  en: "Hands-on printmaking with monotype and relief techniques, plus a short history of how printmaking developed."
  zh: "动手学版画：单刷版画与凸版技法，并了解版画发展简史。"
  zh-TW: "動手學版畫：單刷版畫與凸版技法，並了解版畫發展簡史。"
  ja: "モノタイプと凸版の技法で版画を実践し、版画の歩みを簡単に学ぶ。"
  ko: "모노타이프와 볼록판 기법으로 판화를 실습하고 판화 발전사를 간단히 배운다."
  vi: "Thực hành in tranh với kỹ thuật monotype và khắc nổi, cùng lược sử nghề in tranh."
  ms: "Seni cetak secara amali dengan teknik monotaip dan timbul, serta sejarah ringkas seni cetak."
  id: "Praktik seni grafis dengan teknik monotipe dan cetak tinggi, plus sejarah singkat seni cetak."
  hi: "मोनोटाइप और रिलीफ़ तकनीक से प्रिंटमेकिंग का अभ्यास, और इसके इतिहास की झलक।"
outcomes:
  - en: "Make prints with monotype and relief methods"
    zh: "用单刷与凸版方法制作版画"
    zh-TW: "用單刷與凸版方法製作版畫"
    ja: "モノタイプと凸版で刷る"
    ko: "모노타이프·볼록판으로 판화 찍기"
    vi: "In tranh bằng monotype và khắc nổi"
    ms: "Hasilkan cetakan dengan kaedah monotaip dan timbul"
    id: "Membuat cetakan monotipe dan cetak tinggi"
    hi: "मोनोटाइप और रिलीफ़ से प्रिंट बनाना"
  - en: "Work safely in a print workshop"
    zh: "在版画工作室安全操作"
    zh-TW: "在版畫工作室安全操作"
    ja: "版画工房で安全に作業する"
    ko: "판화 작업실에서 안전하게 작업하기"
    vi: "Làm việc an toàn trong xưởng in"
    ms: "Bekerja dengan selamat di bengkel cetak"
    id: "Bekerja aman di studio cetak"
    hi: "प्रिंट वर्कशॉप में सुरक्षित काम करना"
  - en: "Place your prints in printmaking history"
    zh: "把作品放入版画史中理解"
    zh-TW: "把作品放入版畫史中理解"
    ja: "自作を版画史の中に位置づける"
    ko: "작품을 판화사 속에 위치시키기"
    vi: "Đặt tác phẩm vào lịch sử in tranh"
    ms: "Letak cetakan anda dalam sejarah seni cetak"
    id: "Menempatkan karya dalam sejarah seni cetak"
    hi: "अपने प्रिंट को प्रिंटमेकिंग इतिहास से जोड़ना"
