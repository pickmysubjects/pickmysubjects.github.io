code: EDUC20082
year: 2026
learn:
  en: "How Aboriginal and Torres Strait Islander communities shape education, learned through visits to schools and community groups."
  zh: "走访学校和社区，了解原住民社区如何塑造教育。"
  zh-TW: "走訪學校和社區，了解原住民社區如何形塑教育。"
  ja: "学校や地域団体を訪ね、先住民コミュニティが教育をどう形作るかを学ぶ。"
  ko: "학교와 지역 단체를 방문하며 원주민 공동체가 교육을 어떻게 만드는지 배우기."
  vi: "Đến thăm trường và tổ chức cộng đồng để hiểu người bản địa định hình giáo dục ra sao."
  ms: "Lawatan ke sekolah dan komuniti untuk melihat cara masyarakat Orang Asli membentuk pendidikan."
  id: "Kunjungan ke sekolah dan komunitas untuk melihat cara masyarakat Pribumi membentuk pendidikan."
  hi: "स्कूलों और सामुदायिक संगठनों की यात्रा से जानना कि आदिवासी समुदाय शिक्षा को कैसे आकार देते हैं।"
outcomes:
  - en: "Explain the role of Indigenous communities in education"
    zh: "解释原住民社区在教育中的作用"
    zh-TW: "解釋原住民社區在教育中的角色"
    ja: "教育における先住民コミュニティの役割を説明する"
    ko: "교육에서 원주민 공동체의 역할 설명하기"
    vi: "Giải thích vai trò cộng đồng bản địa trong giáo dục"
    ms: "Terangkan peranan komuniti Orang Asli dalam pendidikan"
    id: "Menjelaskan peran komunitas Pribumi dalam pendidikan"
    hi: "शिक्षा में आदिवासी समुदायों की भूमिका समझाना"
  - en: "Build links with community education groups"
    zh: "与社区教育机构建立联系"
    zh-TW: "與社區教育機構建立聯繫"
    ja: "地域の教育団体とつながりを作る"
    ko: "지역 교육 단체와 관계 맺기"
    vi: "Kết nối với các tổ chức giáo dục cộng đồng"
    ms: "Bina hubungan dengan kumpulan pendidikan komuniti"
    id: "Membangun hubungan dengan lembaga pendidikan komunitas"
    hi: "सामुदायिक शिक्षा संगठनों से संबंध बनाना"
  - en: "Communicate respectfully in Indigenous contexts"
    zh: "在原住民相关场合中尊重地沟通"
    zh-TW: "在原住民相關場合中尊重地溝通"
    ja: "先住民の文脈で敬意をもって対話する"
    ko: "원주민 맥락에서 존중하며 소통하기"
    vi: "Giao tiếp tôn trọng trong bối cảnh bản địa"
    ms: "Berkomunikasi dengan hormat dalam konteks Orang Asli"
    id: "Berkomunikasi dengan hormat dalam konteks Pribumi"
    hi: "आदिवासी संदर्भों में सम्मान से संवाद करना"
