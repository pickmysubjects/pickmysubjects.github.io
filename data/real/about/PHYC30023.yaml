code: PHYC30023
year: 2026
learn:
  en: "Modern optics from rays and beams to interference, lasers and super-resolution microscopes."
  zh: "现代光学：从光线、光束到干涉、激光和超分辨显微镜。"
  zh-TW: "現代光學：從光線、光束到干涉、雷射和超解析顯微鏡。"
  ja: "光線・ビームから干渉、レーザー、超解像顕微鏡までの現代光学。"
  ko: "광선·빔에서 간섭, 레이저, 초해상도 현미경까지 현대 광학."
  vi: "Quang học hiện đại từ tia, chùm sáng đến giao thoa, laser và kính hiển vi siêu phân giải."
  ms: "Optik moden dari sinar dan alur hingga interferens, laser dan mikroskop resolusi super."
  id: "Optika modern dari sinar dan berkas hingga interferensi, laser, dan mikroskop super-resolusi."
  hi: "आधुनिक ऑप्टिक्स, किरणों और बीम से इंटरफ़ेरेंस, लेज़र और सुपर-रिज़ॉल्यूशन माइक्रोस्कोप तक।"
outcomes:
  - en: "Predict how optical instruments behave"
    zh: "预测光学仪器的表现"
    zh-TW: "預測光學儀器的表現"
    ja: "光学機器のふるまいを予測する"
    ko: "광학 기기의 동작 예측하기"
    vi: "Dự đoán hoạt động của dụng cụ quang học"
    ms: "Meramal kelakuan alat optik"
    id: "Memprediksi perilaku alat optik"
    hi: "ऑप्टिकल उपकरणों का व्यवहार अनुमानित करना"
  - en: "Explain how lasers work"
    zh: "解释激光的工作原理"
    zh-TW: "解釋雷射的運作原理"
    ja: "レーザーのしくみを説明する"
    ko: "레이저 작동 원리 설명하기"
    vi: "Giải thích cách laser hoạt động"
    ms: "Menerangkan cara laser berfungsi"
    id: "Menjelaskan cara kerja laser"
    hi: "लेज़र कैसे काम करता है समझाना"
