code: EDUC20075
year: 2026
learn:
  en: "Young people as change-makers in the Asia-Pacific, through real case studies and different styles of leadership."
  zh: "以亚太地区真实案例，看年轻人如何推动社会变革与领导。"
  zh-TW: "以亞太地區真實案例，看年輕人如何推動社會變革與領導。"
  ja: "アジア太平洋の実例から、若者が変化を起こす担い手としてどう動くかを学ぶ。"
  ko: "아시아태평양 실제 사례로 보는 변화를 이끄는 청년과 리더십."
  vi: "Người trẻ tạo thay đổi ở châu Á - Thái Bình Dương qua các tình huống thực tế và phong cách lãnh đạo."
  ms: "Belia sebagai pembawa perubahan di Asia Pasifik melalui kajian kes sebenar dan gaya kepimpinan."
  id: "Anak muda sebagai pembawa perubahan di Asia-Pasifik lewat studi kasus nyata dan gaya kepemimpinan."
  hi: "एशिया-प्रशांत में बदलाव लाने वाले युवा, असली केस स्टडी और नेतृत्व शैलियों के ज़रिए।"
outcomes:
  - en: "Explain how young people take part in social change"
    zh: "解释年轻人如何参与社会变革"
    zh-TW: "解釋年輕人如何參與社會變革"
    ja: "若者が社会変化にどう関わるか説明する"
    ko: "청년이 사회 변화에 참여하는 방식 설명하기"
    vi: "Giải thích người trẻ tham gia thay đổi xã hội ra sao"
    ms: "Terangkan cara belia terlibat dalam perubahan sosial"
    id: "Menjelaskan cara anak muda terlibat dalam perubahan sosial"
    hi: "युवा सामाजिक बदलाव में कैसे भाग लेते हैं, समझाना"
  - en: "Analyse real cases of youth-led change in the region"
    zh: "分析该地区青年推动变革的真实案例"
    zh-TW: "分析該地區青年推動變革的真實案例"
    ja: "地域の若者主導の変化の実例を分析する"
    ko: "지역 내 청년 주도 변화 사례 분석하기"
    vi: "Phân tích các ca thực tế do người trẻ dẫn dắt"
    ms: "Analisis kes sebenar perubahan dipimpin belia"
    id: "Menganalisis kasus nyata perubahan yang dipimpin anak muda"
    hi: "क्षेत्र में युवाओं के नेतृत्व वाले बदलाव के मामलों का विश्लेषण"
  - en: "Reflect on your own role as a leader or educator"
    zh: "反思自己作为领导者或教育者的角色"
    zh-TW: "反思自己作為領導者或教育者的角色"
    ja: "リーダーや教育者としての自分の役割を振り返る"
    ko: "리더나 교육자로서의 내 역할 성찰하기"
    vi: "Suy ngẫm vai trò lãnh đạo hoặc nhà giáo của bản thân"
    ms: "Renungkan peranan sendiri sebagai pemimpin atau pendidik"
    id: "Merefleksikan peran diri sebagai pemimpin atau pendidik"
    hi: "नेता या शिक्षक के रूप में अपनी भूमिका पर विचार करना"
