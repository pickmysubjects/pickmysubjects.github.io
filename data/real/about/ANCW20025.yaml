code: ANCW20025
year: 2026
learn:
  en: "How Rome grew from a village into an empire, seen through art and archaeology at sites like Rome, Pompeii and Ostia."
  zh: "罗马如何从村庄成长为帝国，通过罗马、庞贝和奥斯蒂亚等遗址的艺术与考古来看。"
  zh-TW: "羅馬如何從村莊成長為帝國，透過羅馬、龐貝和奧斯蒂亞等遺址的藝術與考古來看。"
  ja: "ローマが村から帝国へとどう成長したかを、ローマ・ポンペイ・オスティアなどの美術と考古学から見る。"
  ko: "로마가 마을에서 제국으로 성장한 과정을 로마, 폼페이, 오스티아 등의 예술과 고고학으로 본다."
  vi: "La Mã phát triển từ làng thành đế chế ra sao, qua nghệ thuật và khảo cổ ở Rome, Pompeii và Ostia."
  ms: "Cara Rom berkembang daripada kampung menjadi empayar, melalui seni dan arkeologi di Rom, Pompeii dan Ostia."
  id: "Cara Roma tumbuh dari desa menjadi kekaisaran, lewat seni dan arkeologi di situs seperti Roma, Pompeii, dan Ostia."
  hi: "रोम गाँव से साम्राज्य कैसे बना, रोम, पोम्पेई और ओस्टिया जैसे स्थलों की कला और पुरातत्व से।"
outcomes:
  - en: "Describe key Roman sites and buildings"
    zh: "描述重要的罗马遗址与建筑"
    zh-TW: "描述重要的羅馬遺址與建築"
    ja: "主要なローマの遺跡と建物を説明する"
    ko: "주요 로마 유적과 건축 설명하기"
    vi: "Mô tả các di chỉ và công trình La Mã quan trọng"
    ms: "Huraikan tapak dan bangunan Rom utama"
    id: "Mendeskripsikan situs dan bangunan Romawi utama"
    hi: "प्रमुख रोमन स्थलों और इमारतों का वर्णन करना"
  - en: "Use pottery, coins and art as evidence"
    zh: "把陶器、钱币和艺术作为证据"
    zh-TW: "把陶器、錢幣和藝術作為證據"
    ja: "土器・貨幣・美術を資料として使う"
    ko: "도기, 주화, 예술을 증거로 활용하기"
    vi: "Dùng gốm, tiền xu và nghệ thuật làm bằng chứng"
    ms: "Gunakan tembikar, syiling dan seni sebagai bukti"
    id: "Memakai tembikar, koin, dan seni sebagai bukti"
    hi: "मिट्टी के बर्तन, सिक्के और कला को साक्ष्य के रूप में उपयोग करना"
  - en: "Compare life across Roman society"
    zh: "比较罗马社会不同阶层的生活"
    zh-TW: "比較羅馬社會不同階層的生活"
    ja: "ローマ社会の各層の暮らしを比べる"
    ko: "로마 사회 여러 계층의 삶 비교하기"
    vi: "So sánh đời sống các tầng lớp trong xã hội La Mã"
    ms: "Bandingkan kehidupan dalam masyarakat Rom"
    id: "Membandingkan kehidupan lapisan masyarakat Romawi"
    hi: "रोमन समाज में अलग-अलग वर्गों के जीवन की तुलना करना"
