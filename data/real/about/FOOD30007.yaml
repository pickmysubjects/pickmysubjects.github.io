code: FOOD30007
year: 2026
learn:
  en: "How raw plant and animal materials become food, and how heat, drying, cooling, additives and packaging preserve it."
  zh: "动植物原料如何加工成食品，以及加热、干燥、冷却、添加剂和包装如何保鲜。"
  zh-TW: "動植物原料如何加工成食品，以及加熱、乾燥、冷卻、添加物和包裝如何保鮮。"
  ja: "動植物の原料が食品になる過程と、加熱・乾燥・冷却・添加物・包装による保存。"
  ko: "동식물 원료가 식품이 되는 과정과 가열·건조·냉각·첨가물·포장으로 보존하기."
  vi: "Nguyên liệu động thực vật thành thực phẩm ra sao và cách bảo quản bằng nhiệt, sấy, làm lạnh, bao bì."
  ms: "Cara bahan tumbuhan dan haiwan diproses jadi makanan, dan diawet dengan haba, pengeringan, penyejukan, pembungkusan."
  id: "Cara bahan nabati dan hewani diolah jadi pangan, dan diawetkan dengan panas, pengeringan, pendinginan, kemasan."
  hi: "पौधे व पशु कच्चा माल भोजन कैसे बनता है, और गर्मी, सुखाने, ठंडा करने व पैकेजिंग से संरक्षण।"
outcomes:
  - en: "Explain common food preservation technologies"
    zh: "解释常见的食品保鲜技术"
    zh-TW: "解釋常見的食品保存技術"
    ja: "一般的な食品保存技術を説明する"
    ko: "일반적인 식품 보존 기술 설명하기"
    vi: "Giải thích các công nghệ bảo quản phổ biến"
    ms: "Terangkan teknologi pengawetan makanan biasa"
    id: "Menjelaskan teknologi pengawetan pangan umum"
    hi: "आम खाद्य संरक्षण तकनीकें समझाना"
  - en: "Judge how processing changes food quality"
    zh: "判断加工如何影响食品品质"
    zh-TW: "判斷加工如何影響食品品質"
    ja: "加工が食品の品質に与える影響を判断する"
    ko: "가공이 식품 품질에 주는 영향 판단하기"
    vi: "Đánh giá chế biến làm đổi chất lượng ra sao"
    ms: "Nilai kesan pemprosesan pada kualiti makanan"
    id: "Menilai dampak pengolahan pada mutu pangan"
    hi: "प्रसंस्करण से भोजन की गुणवत्ता पर असर आँकना"
