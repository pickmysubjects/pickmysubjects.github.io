code: MUSI30228
year: 2026
learn:
  en: "Capstone performance study: lessons and improvisation classes build to a 45-minute solo recital you must pass."
  zh: "演奏总结课：个别课和即兴课，最终举行必须通过的45分钟独奏会。"
  zh-TW: "演奏總結課：個別課與即興課，最終舉行必須通過的45分鐘獨奏會。"
  ja: "演奏の総仕上げ。レッスンと即興クラスを経て、合格必須の45分リサイタル。"
  ko: "연주 마무리 과목: 레슨과 즉흥 수업 후 반드시 통과해야 할 45분 리사이틀."
  vi: "Môn tổng kết biểu diễn: học riêng, lớp ứng tác và buổi độc tấu 45 phút bắt buộc đậu."
  ms: "Kemuncak persembahan: kelas dan improvisasi menuju resital 45 minit yang wajib lulus."
  id: "Puncak studi pertunjukan: les dan improvisasi menuju resital 45 menit yang wajib lulus."
  hi: "अंतिम प्रदर्शन विषय: पाठ और इम्प्रोवाइज़ेशन के बाद 45 मिनट का ज़रूरी एकल रिसाइटल।"
outcomes:
  - en: "Perform a full recital with confidence"
    zh: "自信地完成一场独奏会"
    zh-TW: "自信地完成一場獨奏會"
    ja: "自信を持ってリサイタルを行う"
    ko: "자신 있게 리사이틀 하기"
    vi: "Tự tin biểu diễn trọn buổi độc tấu"
    ms: "Persembahkan resital penuh dengan yakin"
    id: "Membawakan resital penuh dengan percaya diri"
    hi: "आत्मविश्वास से पूरा रिसाइटल करना"
  - en: "Use advanced jazz harmony and rhythm"
    zh: "运用高级爵士和声与节奏"
    zh-TW: "運用進階爵士和聲與節奏"
    ja: "高度なジャズの和声とリズムを使う"
    ko: "고급 재즈 화성과 리듬 활용"
    vi: "Dùng hòa âm, tiết tấu jazz nâng cao"
    ms: "Guna harmoni dan ritma jaz lanjutan"
    id: "Memakai harmoni dan ritme jazz lanjut"
    hi: "उन्नत जैज़ हार्मनी और लय का प्रयोग"
  - en: "Improvise as real-time composing"
    zh: "把即兴当作实时作曲"
    zh-TW: "把即興當作即時作曲"
    ja: "即興をリアルタイム作曲として行う"
    ko: "즉흥을 실시간 작곡으로 하기"
    vi: "Ứng tác như sáng tác tức thời"
    ms: "Berimprovisasi sebagai gubahan masa nyata"
    id: "Berimprovisasi sebagai komposisi langsung"
    hi: "इम्प्रोवाइज़ेशन को लाइव रचना की तरह करना"
