code: PHRM20001
year: 2026
learn:
  en: "How drugs act on the body, their good and bad effects, and how new drugs are found and tested."
  zh: "药物怎么在体内起作用、有什么好坏影响，新药怎么研发。"
  zh-TW: "藥物怎麼在體內起作用、有什麼好壞影響，新藥怎麼研發。"
  ja: "薬が体にどう作用するか、良い効果と悪い効果、新薬の発見と試験の方法。"
  ko: "약물이 몸에 어떻게 작용하는지, 좋은 효과와 나쁜 효과, 신약을 찾고 시험하는 방법."
  vi: "Thuốc tác động lên cơ thể ra sao, tác dụng tốt xấu, và cách tìm, thử thuốc mới."
  ms: "Cara ubat bertindak pada badan, kesan baik dan buruknya, serta cara ubat baharu ditemui dan diuji."
  id: "Cara obat bekerja di tubuh, efek baik dan buruknya, serta cara obat baru ditemukan dan diuji."
  hi: "दवाएँ शरीर पर कैसे असर करती हैं, उनके अच्छे-बुरे असर, और नई दवाएँ कैसे खोजी और टेस्ट होती हैं।"
outcomes:
  - en: "Explain how drugs act on the body and how it handles them"
    zh: "解释药物对身体的作用和代谢"
    zh-TW: "解釋藥物對身體的作用和代謝"
    ja: "薬の体への作用と体内での処理を説明する"
    ko: "약물의 작용과 몸이 약을 처리하는 방식 설명"
    vi: "Giải thích thuốc tác động lên cơ thể và cơ thể xử lý thuốc ra sao"
    ms: "Terangkan tindakan ubat pada badan dan cara badan memprosesnya"
    id: "Menjelaskan kerja obat di tubuh dan cara tubuh mengolahnya"
    hi: "दवा का शरीर पर असर और शरीर उसे कैसे संभालता है, समझाना"
  - en: "Discuss the benefits and side effects of common drugs"
    zh: "讨论常用药的疗效和副作用"
    zh-TW: "討論常用藥的療效和副作用"
    ja: "よく使われる薬の効果と副作用を論じる"
    ko: "흔한 약의 효과와 부작용 논의"
    vi: "Thảo luận lợi ích và tác dụng phụ của thuốc thông dụng"
    ms: "Bincang manfaat dan kesan sampingan ubat biasa"
    id: "Membahas manfaat dan efek samping obat umum"
    hi: "आम दवाओं के फायदे और साइड इफेक्ट पर चर्चा"
  - en: "Describe how drugs are developed and approved"
    zh: "说清新药怎么研发和审批"
    zh-TW: "說清新藥怎麼研發和審核"
    ja: "薬の開発と承認の流れを説明する"
    ko: "약물 개발과 승인 과정 설명"
    vi: "Mô tả thuốc được phát triển và phê duyệt ra sao"
    ms: "Huraikan cara ubat dibangunkan dan diluluskan"
    id: "Menjelaskan cara obat dikembangkan dan disetujui"
    hi: "दवाएँ कैसे विकसित और मंज़ूर होती हैं, बताना"
