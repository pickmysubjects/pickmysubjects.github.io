code: PSYC20008
year: 2026
learn:
  en: "How people's thinking, feelings and social lives change from infancy to young adulthood."
  zh: "人从婴儿到青年，思维、情绪和社交怎么变化。"
  zh-TW: "人從嬰兒到青年，思維、情緒和社交怎麼變化。"
  ja: "乳児期から青年期までに、考え方、感情、人間関係がどう変わるか。"
  ko: "영아기부터 청년기까지 사고, 감정, 사회생활이 어떻게 변하는지."
  vi: "Suy nghĩ, cảm xúc và đời sống xã hội thay đổi ra sao từ sơ sinh đến tuổi trưởng thành sớm."
  ms: "Cara pemikiran, perasaan dan kehidupan sosial berubah dari bayi hingga dewasa muda."
  id: "Cara pikiran, perasaan, dan kehidupan sosial berubah dari bayi hingga dewasa muda."
  hi: "शिशु से युवा होने तक लोगों की सोच, भावनाएँ और सामाजिक जीवन कैसे बदलते हैं।"
outcomes:
  - en: "Explain what shapes a child's development"
    zh: "解释哪些因素影响孩子成长"
    zh-TW: "解釋哪些因素影響孩子的發展"
    ja: "子どもの発達に何が影響するか説明する"
    ko: "아이의 발달에 영향을 주는 요인 설명"
    vi: "Giải thích điều gì định hình sự phát triển của trẻ"
    ms: "Terangkan apa yang membentuk perkembangan kanak-kanak"
    id: "Menjelaskan apa yang membentuk perkembangan anak"
    hi: "बच्चे के विकास को क्या आकार देता है, समझाना"
  - en: "Run a chi-squared test on research data"
    zh: "用卡方检验分析研究数据"
    zh-TW: "用卡方檢定分析研究數據"
    ja: "研究データにカイ二乗検定を行う"
    ko: "연구 데이터로 카이제곱 검정 수행"
    vi: "Làm kiểm định chi bình phương trên dữ liệu"
    ms: "Jalankan ujian khi kuasa dua pada data kajian"
    id: "Menjalankan uji chi-kuadrat pada data riset"
    hi: "रिसर्च डेटा पर काई-स्क्वेयर टेस्ट चलाना"
  - en: "Give useful peer review on academic writing"
    zh: "给同学的论文提有用的意见"
    zh-TW: "對同學的論文給出有用的回饋"
    ja: "学術的な文章に役立つピアレビューをする"
    ko: "학술 글에 유용한 동료 피드백 주기"
    vi: "Góp ý hữu ích cho bài viết học thuật của bạn học"
    ms: "Beri ulasan rakan yang berguna pada penulisan akademik"
    id: "Memberi tinjauan sejawat yang berguna untuk tulisan akademik"
    hi: "अकादमिक लेखन पर उपयोगी पीयर रिव्यू देना"
