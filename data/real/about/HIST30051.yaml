code: HIST30051
year: 2026
learn:
  en: "Three weeks studying in Venice: Renaissance trade in luxury goods, how Venetians bought and sold, and how the city regulated it."
  zh: "在威尼斯学习三周：文艺复兴时期的奢侈品贸易、威尼斯人的买卖方式，以及城市如何加以管制。"
  zh-TW: "在威尼斯學習三週：文藝復興時期的奢侈品貿易、威尼斯人的買賣方式，以及城市如何加以管制。"
  ja: "ヴェネツィアで3週間学ぶ。ルネサンス期の贅沢品交易、人々の売買、そして都市による規制。"
  ko: "베네치아에서 3주간 공부한다. 르네상스 시대 사치품 교역, 베네치아인의 매매, 도시의 규제 방식."
  vi: "Ba tuần học tại Venice: thương mại hàng xa xỉ thời Phục hưng, cách người Venice mua bán và thành phố quản lý ra sao."
  ms: "Tiga minggu belajar di Venice: perdagangan barangan mewah zaman Renaissance, cara jual beli dan cara bandar mengawalnya."
  id: "Tiga minggu belajar di Venesia: perdagangan barang mewah era Renaisans, cara warga berjual beli, dan cara kota mengaturnya."
  hi: "वेनिस में तीन हफ़्ते की पढ़ाई: पुनर्जागरण के दौर का विलासिता व्यापार, लोग कैसे ख़रीदते-बेचते थे, और शहर कैसे उसे नियंत्रित करता था।"
outcomes:
  - en: "Explain Venice's role as a trading empire"
    zh: "说明威尼斯作为贸易帝国的地位"
    zh-TW: "說明威尼斯作為貿易帝國的地位"
    ja: "交易帝国としてのヴェネツィアの役割を説明する"
    ko: "무역 제국으로서 베네치아의 역할 설명하기"
    vi: "Giải thích vai trò của Venice như một đế chế thương mại"
    ms: "Terangkan peranan Venice sebagai empayar perdagangan"
    id: "Menjelaskan peran Venesia sebagai kekaisaran dagang"
    hi: "एक व्यापारिक साम्राज्य के रूप में वेनिस की भूमिका समझाना"
  - en: "Read historic sites and objects on location"
    zh: "在现场解读历史遗迹和物品"
    zh-TW: "在現場解讀歷史遺跡和物品"
    ja: "現地で史跡や品物を読み解く"
    ko: "현장에서 사적과 물건 읽어내기"
    vi: "Đọc hiểu di tích và đồ vật lịch sử tại chỗ"
    ms: "Tafsir tapak dan objek bersejarah di lokasi"
    id: "Membaca situs dan benda bersejarah di lokasi"
    hi: "मौके पर ऐतिहासिक स्थलों और वस्तुओं को समझना"
  - en: "Link luxury trade to modern consumer culture"
    zh: "把奢侈品贸易与现代消费文化联系起来"
    zh-TW: "把奢侈品貿易與現代消費文化聯繫起來"
    ja: "贅沢品交易を現代の消費文化と結びつける"
    ko: "사치품 교역을 현대 소비문화와 연결하기"
    vi: "Liên hệ thương mại xa xỉ với văn hóa tiêu dùng hiện đại"
    ms: "Kaitkan perdagangan mewah dengan budaya pengguna moden"
    id: "Mengaitkan perdagangan mewah dengan budaya konsumsi modern"
    hi: "विलासिता व्यापार को आधुनिक उपभोक्ता संस्कृति से जोड़ना"
