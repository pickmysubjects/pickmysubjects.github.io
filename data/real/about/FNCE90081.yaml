code: FNCE90081
year: 2027
learn:
  en: "A semester-long independent research project, either on a real industry problem or an academic question."
  zh: "为期一学期的独立研究项目，可选业界真实课题或学术研究。"
  zh-TW: "為期一學期的獨立研究專題，可選業界真實課題或學術研究。"
  ja: "1学期の個人研究プロジェクト。実務課題か学術研究を選ぶ。"
  ko: "한 학기 동안의 개인 연구 프로젝트. 실무 과제나 학술 연구 중 선택."
  vi: "Dự án nghiên cứu độc lập kéo dài một học kỳ, về vấn đề thực tế ngành hoặc câu hỏi học thuật."
  ms: "Projek penyelidikan bebas satu semester, sama ada masalah industri sebenar atau soalan akademik."
  id: "Proyek riset mandiri satu semester, tentang masalah industri nyata atau pertanyaan akademik."
  hi: "एक सेमेस्टर का स्वतंत्र शोध प्रोजेक्ट, उद्योग की असली समस्या या अकादमिक प्रश्न पर।"
outcomes:
  - en: "Plan and carry out an independent finance project"
    zh: "规划并完成独立的金融研究项目"
    zh-TW: "規劃並完成獨立的金融研究專題"
    ja: "金融の個人研究を計画し実行する"
    ko: "독립적인 금융 연구 계획·수행하기"
    vi: "Lập kế hoạch và thực hiện dự án tài chính độc lập"
    ms: "Merancang dan melaksana projek kewangan bebas"
    id: "Merencanakan dan menjalankan proyek keuangan mandiri"
    hi: "स्वतंत्र वित्त परियोजना की योजना बनाकर पूरा करना"
  - en: "Report findings in writing"
    zh: "以书面形式报告研究结果"
    zh-TW: "以書面形式報告研究結果"
    ja: "研究結果を文章で報告する"
    ko: "연구 결과를 글로 보고하기"
    vi: "Trình bày kết quả bằng văn bản"
    ms: "Melaporkan dapatan secara bertulis"
    id: "Melaporkan temuan secara tertulis"
    hi: "निष्कर्ष लिखित रूप में प्रस्तुत करना"
