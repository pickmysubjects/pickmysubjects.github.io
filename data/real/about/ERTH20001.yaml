code: ERTH20001
year: 2026
learn:
  en: "Earthquakes, floods, bushfires, cyclones and other natural hazards, and how to assess and reduce their risk."
  zh: "地震、洪水、山火、气旋等自然灾害，以及如何评估和降低风险。"
  zh-TW: "地震、洪水、野火、氣旋等自然災害，以及如何評估和降低風險。"
  ja: "地震・洪水・森林火災・サイクロンなどの自然災害と、そのリスクの評価と軽減。"
  ko: "지진·홍수·산불·사이클론 등 자연재해와 위험 평가 및 저감 방법."
  vi: "Động đất, lũ, cháy rừng, bão và các thiên tai khác, cùng cách đánh giá và giảm rủi ro."
  ms: "Gempa bumi, banjir, kebakaran hutan, siklon dan bencana lain, serta cara menilai dan mengurangkan risikonya."
  id: "Gempa, banjir, kebakaran hutan, siklon, dan bencana alam lain, serta cara menilai dan mengurangi risikonya."
  hi: "भूकंप, बाढ़, जंगल की आग, चक्रवात जैसी आपदाएँ, और उनके जोखिम को आँकना व घटाना।"
outcomes:
  - en: "Run a quantitative risk assessment in Excel"
    zh: "用Excel做定量风险评估"
    zh-TW: "用Excel做定量風險評估"
    ja: "Excelで定量的リスク評価を行う"
    ko: "Excel로 정량적 위험 평가를 한다"
    vi: "Đánh giá rủi ro định lượng bằng Excel"
    ms: "Jalankan penilaian risiko kuantitatif dalam Excel"
    id: "Melakukan penilaian risiko kuantitatif di Excel"
    hi: "Excel में मात्रात्मक जोखिम आकलन करना"
  - en: "Characterise a natural hazard"
    zh: "描述并刻画一种自然灾害"
    zh-TW: "描述並刻畫一種自然災害"
    ja: "自然災害の特徴を整理する"
    ko: "자연재해의 특성을 규명한다"
    vi: "Mô tả đặc trưng một thiên tai"
    ms: "Cirikan sesuatu bahaya semula jadi"
    id: "Mengkarakterisasi bahaya alam"
    hi: "किसी प्राकृतिक आपदा का चरित्र-चित्रण करना"
