code: AHIS30022
year: 2026
learn:
  en: "Renaissance art in a global frame: encounters between Europe and other cultures from 1300 to 1650 through objects and ideas."
  zh: "全球视野下的文艺复兴艺术：1300至1650年间欧洲与其他文化通过器物和观念的交流。"
  zh-TW: "全球視野下的文藝復興藝術：1300至1650年間歐洲與其他文化透過器物和觀念的交流。"
  ja: "世界の中のルネサンス美術。1300〜1650年のヨーロッパと他文化の、モノや考えを通した出会いを学ぶ。"
  ko: "세계적 시야의 르네상스 미술. 1300~1650년 유럽과 다른 문화가 사물과 사상으로 만난 순간을 배운다."
  vi: "Nghệ thuật Phục hưng trong khung toàn cầu: các cuộc gặp gỡ giữa châu Âu và nền văn hóa khác từ 1300 đến 1650 qua đồ vật và ý tưởng."
  ms: "Seni Renaissance dalam kerangka global: pertemuan Eropah dengan budaya lain dari 1300 hingga 1650 melalui objek dan idea."
  id: "Seni Renaisans dalam bingkai global: perjumpaan Eropa dengan budaya lain dari 1300 sampai 1650 lewat benda dan gagasan."
  hi: "वैश्विक नज़रिए से पुनर्जागरण कला: 1300 से 1650 के बीच यूरोप और दूसरी संस्कृतियों का वस्तुओं और विचारों के ज़रिए मेल।"
outcomes:
  - en: "Describe exchanges between Europe and other cultures"
    zh: "描述欧洲与其他文化之间的交流"
    zh-TW: "描述歐洲與其他文化之間的交流"
    ja: "ヨーロッパと他文化の交流を説明する"
    ko: "유럽과 다른 문화의 교류 설명하기"
    vi: "Mô tả trao đổi giữa châu Âu và các nền văn hóa khác"
    ms: "Huraikan pertukaran Eropah dengan budaya lain"
    id: "Menguraikan pertukaran Eropa dengan budaya lain"
    hi: "यूरोप और दूसरी संस्कृतियों के आदान-प्रदान का वर्णन करना"
  - en: "Analyse objects using period and modern sources"
    zh: "运用当时和现代的资料分析器物"
    zh-TW: "運用當時和現代的資料分析器物"
    ja: "当時と現代の資料で作品を分析する"
    ko: "당대와 현대 자료로 사물 분석하기"
    vi: "Phân tích đồ vật bằng nguồn đương thời và hiện đại"
    ms: "Analisis objek menggunakan sumber zaman itu dan moden"
    id: "Menganalisis benda memakai sumber sezaman dan modern"
    hi: "उस दौर और आधुनिक स्रोतों से वस्तुओं का विश्लेषण करना"
  - en: "Place European art in a global setting"
    zh: "把欧洲艺术放在全球背景中理解"
    zh-TW: "把歐洲藝術放在全球背景中理解"
    ja: "ヨーロッパ美術を世界的な文脈に位置づける"
    ko: "유럽 미술을 세계적 맥락에 놓기"
    vi: "Đặt nghệ thuật châu Âu vào bối cảnh toàn cầu"
    ms: "Letakkan seni Eropah dalam latar global"
    id: "Menempatkan seni Eropa dalam latar global"
    hi: "यूरोपीय कला को वैश्विक संदर्भ में रखना"
