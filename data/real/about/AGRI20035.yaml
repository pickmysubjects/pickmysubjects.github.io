code: AGRI20035
year: 2026
learn:
  en: "Crop and horticulture production at Dookie: genetics, nutrients, rotations, protection and measuring yield."
  zh: "在Dookie校区学习大田与园艺生产：遗传、养分、轮作、植保与测产。"
  zh-TW: "在Dookie校區學習大田與園藝生產：遺傳、養分、輪作、植保與測產。"
  ja: "Dookieでの畑作・園芸生産：遺伝、養分、輪作、作物保護、収量測定。"
  ko: "Dookie에서 배우는 작물·원예 생산: 유전, 양분, 윤작, 작물 보호, 수확량 측정."
  vi: "Sản xuất cây trồng và làm vườn tại Dookie: di truyền, dinh dưỡng, luân canh, bảo vệ, đo năng suất."
  ms: "Pengeluaran tanaman dan hortikultur di Dookie: genetik, nutrien, giliran tanaman, perlindungan, hasil."
  id: "Produksi tanaman dan hortikultura di Dookie: genetika, hara, rotasi, proteksi dan pengukuran hasil."
  hi: "Dookie में फसल और बागवानी उत्पादन: आनुवंशिकी, पोषक तत्व, फसल चक्र, सुरक्षा और उपज मापन।"
outcomes:
  - en: "Link plant growth to crop management"
    zh: "将植物生长与作物管理联系起来"
    zh-TW: "將植物生長與作物管理連結"
    ja: "植物の生育と作物管理を結びつける"
    ko: "식물 생장과 작물 관리를 연결한다"
    vi: "Liên hệ sinh trưởng cây với quản lý cây trồng"
    ms: "Kaitkan tumbesaran tumbuhan dengan pengurusan tanaman"
    id: "Menghubungkan pertumbuhan tanaman dengan pengelolaan"
    hi: "पौधों की वृद्धि को फसल प्रबंधन से जोड़ें"
  - en: "Predict economic and environmental outcomes"
    zh: "预测经济与环境结果"
    zh-TW: "預測經濟與環境結果"
    ja: "経済・環境面の結果を予測する"
    ko: "경제·환경적 결과를 예측한다"
    vi: "Dự đoán kết quả kinh tế và môi trường"
    ms: "Ramal hasil ekonomi dan alam sekitar"
    id: "Memprediksi hasil ekonomi dan lingkungan"
    hi: "आर्थिक और पर्यावरणीय परिणामों का अनुमान लगाएँ"
