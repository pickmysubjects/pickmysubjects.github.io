code: POLS20011
year: 2026
learn:
  en: "Feminist ideas about how society and politics shape the body, gender and sexuality, applied to issues like sex work and sexual violence."
  zh: "女性主义理论如何看待社会和政治对身体、性别和性的塑造，并应用于性工作、性暴力等议题。"
  zh-TW: "女性主義理論如何看待社會和政治對身體、性別和性的形塑，並應用於性工作、性暴力等議題。"
  ja: "社会や政治が身体、ジェンダー、セクシュアリティをどう形づくるかについてのフェミニズム理論を、性労働や性暴力などの問題に当てはめる。"
  ko: "사회와 정치가 몸, 젠더, 섹슈얼리티를 어떻게 만드는지에 관한 페미니즘 이론을 성노동, 성폭력 같은 문제에 적용한다."
  vi: "Các quan điểm nữ quyền về cách xã hội và chính trị định hình cơ thể, giới và tình dục, áp dụng vào các vấn đề như mại dâm và bạo lực tình dục."
  ms: "Idea feminis tentang cara masyarakat dan politik membentuk tubuh, gender dan seksualiti, diguna pada isu seperti kerja seks dan keganasan seksual."
  id: "Gagasan feminis tentang cara masyarakat dan politik membentuk tubuh, gender, dan seksualitas, diterapkan pada isu seperti kerja seks dan kekerasan seksual."
  hi: "समाज और राजनीति शरीर, जेंडर और यौनिकता को कैसे आकार देते हैं, इस पर नारीवादी विचार, और सेक्स वर्क व यौन हिंसा जैसे मुद्दों पर उनका इस्तेमाल।"
outcomes:
  - en: "Explain key ideas in feminist theory"
    zh: "解释女性主义理论的核心概念"
    zh-TW: "解釋女性主義理論的核心概念"
    ja: "フェミニズム理論の主要な考え方を説明する"
    ko: "페미니즘 이론의 핵심 개념 설명하기"
    vi: "Giải thích các ý chính của lý thuyết nữ quyền"
    ms: "Terangkan idea utama teori feminis"
    id: "Menjelaskan gagasan kunci teori feminis"
    hi: "नारीवादी सिद्धांत के मुख्य विचार समझाना"
  - en: "Show how gender and sexuality are shaped socially"
    zh: "说明性别和性是如何被社会塑造的"
    zh-TW: "說明性別和性是如何被社會形塑的"
    ja: "ジェンダーとセクシュアリティが社会的に作られる仕組みを示す"
    ko: "젠더와 섹슈얼리티가 사회적으로 만들어지는 방식 보여 주기"
    vi: "Cho thấy giới và tình dục được xã hội định hình ra sao"
    ms: "Tunjukkan cara gender dan seksualiti dibentuk masyarakat"
    id: "Menunjukkan cara gender dan seksualitas dibentuk secara sosial"
    hi: "दिखाना कि जेंडर और यौनिकता समाज में कैसे गढ़े जाते हैं"
  - en: "Apply feminist approaches to real issues"
    zh: "用女性主义视角分析现实议题"
    zh-TW: "用女性主義視角分析現實議題"
    ja: "フェミニズムの視点を現実の問題に当てはめる"
    ko: "페미니즘 관점을 실제 문제에 적용하기"
    vi: "Áp dụng góc nhìn nữ quyền vào vấn đề thực tế"
    ms: "Guna pendekatan feminis pada isu sebenar"
    id: "Menerapkan pendekatan feminis pada isu nyata"
    hi: "असली मुद्दों पर नारीवादी नज़रिया लागू करना"
