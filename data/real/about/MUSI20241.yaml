code: MUSI20241
year: 2026
learn:
  en: "West African music and dance: drum, bell and body rhythms plus traditional dance steps, taught weekly by tradition bearers."
  zh: "西非音乐与舞蹈：鼓、铃与身体节奏及传统舞步，每周由传统艺人授课。"
  zh-TW: "西非音樂與舞蹈：鼓、鈴與身體節奏及傳統舞步，每週由傳統藝人授課。"
  ja: "西アフリカの音楽と踊り：太鼓・ベル・体のリズムと伝統舞踊を毎週学ぶ。"
  ko: "서아프리카 음악과 춤: 북·벨·몸 리듬과 전통 춤, 매주 전통 예술가에게."
  vi: "Nhạc và múa Tây Phi: nhịp trống, chuông, cơ thể và bước múa truyền thống, học hằng tuần."
  ms: "Muzik dan tarian Afrika Barat: ritma gendang, loceng, badan dan langkah tarian tradisional."
  id: "Musik dan tari Afrika Barat: ritme drum, lonceng, tubuh, dan langkah tari tradisional."
  hi: "पश्चिम अफ़्रीकी संगीत-नृत्य: ढोल, घंटी और शरीर की लय तथा पारंपरिक नृत्य कदम।"
outcomes:
  - en: "Play West African rhythms on drums and bells"
    zh: "用鼓与铃演奏西非节奏"
    zh-TW: "用鼓與鈴演奏西非節奏"
    ja: "太鼓とベルで西アフリカのリズムを奏でる"
    ko: "북과 벨로 서아프리카 리듬 연주하기"
    vi: "Chơi nhịp Tây Phi bằng trống và chuông"
    ms: "Main ritma Afrika Barat dengan gendang dan loceng"
    id: "Memainkan ritme Afrika Barat dengan drum dan lonceng"
    hi: "ढोल-घंटी पर पश्चिम अफ़्रीकी लय बजाना"
  - en: "Dance traditional steps in time with the music"
    zh: "随音乐跳传统舞步"
    zh-TW: "隨音樂跳傳統舞步"
    ja: "音楽に合わせて伝統の踊りを踊る"
    ko: "음악에 맞춰 전통 춤추기"
    vi: "Múa bước truyền thống theo nhạc"
    ms: "Menari langkah tradisional mengikut muzik"
    id: "Menari langkah tradisional mengikuti musik"
    hi: "संगीत के साथ पारंपरिक नृत्य करना"
  - en: "Understand the culture behind the music"
    zh: "理解音乐背后的文化"
    zh-TW: "理解音樂背後的文化"
    ja: "音楽の背景にある文化を理解する"
    ko: "음악 뒤의 문화 이해하기"
    vi: "Hiểu văn hóa đứng sau âm nhạc"
    ms: "Fahami budaya di sebalik muzik"
    id: "Memahami budaya di balik musiknya"
    hi: "संगीत के पीछे की संस्कृति समझना"
