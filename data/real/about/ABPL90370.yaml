code: ABPL90370
year: 2027
learn:
  en: "The design manager's role in coordinating architects, engineers and builders on construction projects."
  zh: "设计经理在建设项目中协调建筑师、工程师和施工方的角色。"
  zh-TW: "設計經理在建設專案中協調建築師、工程師和施工方的角色。"
  ja: "建設プロジェクトで建築家・技術者・施工者を調整するデザインマネージャーの役割。"
  ko: "건설 프로젝트에서 건축가·엔지니어·시공사를 조율하는 디자인 매니저의 역할."
  vi: "Vai trò quản lý thiết kế trong điều phối kiến trúc sư, kỹ sư và nhà thầu."
  ms: "Peranan pengurus reka bentuk menyelaras arkitek, jurutera dan pembina dalam projek."
  id: "Peran manajer desain dalam mengoordinasikan arsitek, insinyur, dan kontraktor."
  hi: "निर्माण प्रोजेक्ट में आर्किटेक्ट, इंजीनियर और बिल्डर के बीच तालमेल में डिज़ाइन मैनेजर की भूमिका।"
outcomes:
  - en: "Explain design management in the AEC industry"
    zh: "解释建筑工程行业中的设计管理"
    zh-TW: "解釋建築工程產業中的設計管理"
    ja: "建設業界のデザインマネジメントを説明する"
    ko: "건설 산업의 디자인 관리 설명하기"
    vi: "Giải thích quản lý thiết kế trong ngành xây dựng"
    ms: "Menerangkan pengurusan reka bentuk dalam industri AEC"
    id: "Menjelaskan manajemen desain di industri AEC"
    hi: "AEC उद्योग में डिज़ाइन प्रबंधन समझाना"
  - en: "Write a design management plan"
    zh: "编写设计管理计划"
    zh-TW: "撰寫設計管理計畫"
    ja: "デザインマネジメント計画を作る"
    ko: "디자인 관리 계획 작성하기"
    vi: "Lập kế hoạch quản lý thiết kế"
    ms: "Menulis pelan pengurusan reka bentuk"
    id: "Menyusun rencana manajemen desain"
