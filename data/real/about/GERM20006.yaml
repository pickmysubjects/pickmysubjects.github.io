code: GERM20006
year: 2026
learn:
  en: "Research skills for the German major: finding and using sources, site visits, and first steps in essays and debate in German."
  zh: "德语专业的研究技能：查找和使用资料、实地参观，以及用德语写论文和辩论的起步。"
  zh-TW: "德語主修的研究技能：查找和使用資料、實地參訪，以及用德語寫論文和辯論的起步。"
  ja: "ドイツ語専攻のための研究スキル。資料探しと活用、施設訪問、ドイツ語での論文と議論の第一歩。"
  ko: "독일어 전공을 위한 연구 기술. 자료 찾기와 활용, 현장 방문, 독일어 에세이와 토론의 첫걸음."
  vi: "Kỹ năng nghiên cứu cho chuyên ngành tiếng Đức: tìm và dùng tài liệu, tham quan thực tế, bước đầu viết luận và tranh luận."
  ms: "Kemahiran penyelidikan untuk major Jerman: mencari dan guna sumber, lawatan tapak, dan langkah awal esei serta debat."
  id: "Keterampilan riset untuk major Jerman: mencari dan memakai sumber, kunjungan lapangan, dan awal menulis esai serta berdebat."
  hi: "जर्मन मेजर के लिए शोध कौशल: स्रोत ढूँढना और इस्तेमाल करना, स्थल-भ्रमण, और जर्मन में निबंध व बहस की शुरुआत।"
outcomes:
  - en: "Find and combine information from scholarly sources"
    zh: "查找并综合学术资料"
    zh-TW: "查找並綜合學術資料"
    ja: "学術資料を探してまとめる"
    ko: "학술 자료 찾아 종합하기"
    vi: "Tìm và tổng hợp thông tin từ nguồn học thuật"
    ms: "Cari dan gabungkan maklumat dari sumber ilmiah"
    id: "Mencari dan memadukan informasi dari sumber ilmiah"
    hi: "विद्वत स्रोतों से जानकारी ढूँढकर जोड़ना"
  - en: "Present different points of view in German"
    zh: "用德语陈述不同观点"
    zh-TW: "用德語陳述不同觀點"
    ja: "ドイツ語で異なる見方を示す"
    ko: "독일어로 여러 관점 제시하기"
    vi: "Trình bày các quan điểm khác nhau bằng tiếng Đức"
    ms: "Bentangkan pelbagai sudut pandang dalam bahasa Jerman"
    id: "Menyampaikan berbagai sudut pandang dalam bahasa Jerman"
    hi: "जर्मन में अलग-अलग नज़रिए रखना"
  - en: "Write an analytical essay and a literature review"
    zh: "撰写分析性论文和文献综述"
    zh-TW: "撰寫分析性論文和文獻回顧"
    ja: "分析的な論文と文献レビューを書く"
    ko: "분석 에세이와 문헌 검토 쓰기"
    vi: "Viết bài luận phân tích và tổng quan tài liệu"
    ms: "Tulis esei analitikal dan sorotan literatur"
    id: "Menulis esai analitis dan tinjauan pustaka"
    hi: "विश्लेषणात्मक निबंध और साहित्य समीक्षा लिखना"
