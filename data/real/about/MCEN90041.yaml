  vi: "Cơ học giải tích: tọa độ suy rộng, phương pháp Lagrange, Hamilton và ổn định."
  ms: "Mekanik analitik: koordinat teritlak, kaedah Lagrange dan Hamilton, serta kestabilan."
  id: "Mekanika analitik: koordinat umum, metode Lagrange dan Hamilton, serta kestabilan."
  hi: "विश्लेषणात्मक यांत्रिकी: सामान्यीकृत निर्देशांक, लैग्रांज व हैमिल्टन विधियाँ और स्थिरता।"
outcomes:
