    zh-TW: "用拉格朗日方法推導運動方程"
    ja: "ラグランジュ法で運動方程式を導く"
    ko: "라그랑주 방법으로 운동 방정식 유도하기"
    vi: "Lập phương trình chuyển động bằng phương pháp Lagrange"
    ms: "Menerbitkan persamaan gerakan dengan kaedah Lagrange"
    id: "Menurunkan persamaan gerak dengan metode Lagrange"
    hi: "लैग्रांज विधि से गति समीकरण निकालना"
  - en: "Solve the models analytically and numerically"
    zh: "用解析和数值方法求解模型"
    zh-TW: "用解析與數值方法求解模型"
    ja: "モデルを解析的・数値的に解く"
    ko: "모델을 해석적·수치적으로 풀기"
    vi: "Giải mô hình bằng giải tích và phương pháp số"
    ms: "Menyelesaikan model secara analitik dan berangka"
    id: "Menyelesaikan model secara analitik dan numerik"
    hi: "मॉडल को विश्लेषणात्मक व संख्यात्मक रूप से हल करना"
