code: ABPL90290
year: 2027
learn:
  en: "The law behind built environment work: common law, torts, contracts, construction contracts, land and property ownership."
  zh: "建成环境行业相关法律：普通法、侵权、合同、建筑合同、土地与产权。"
  zh-TW: "建成環境產業相關法律：普通法、侵權、契約、營建契約、土地與產權。"
  ja: "建築環境の仕事に関わる法：コモンロー、不法行為、契約、建設契約、土地と所有権。"
  ko: "건조환경 분야의 법: 보통법, 불법행위, 계약, 건설 계약, 토지와 소유권."
  vi: "Luật cho ngành môi trường xây dựng: thông luật, bồi thường, hợp đồng, xây dựng, đất đai."
  ms: "Undang-undang alam bina: common law, tort, kontrak, kontrak pembinaan, tanah dan pemilikan."
  id: "Hukum lingkungan binaan: common law, perbuatan melawan hukum, kontrak, konstruksi, tanah."
  hi: "निर्मित पर्यावरण का क़ानून: कॉमन लॉ, टॉर्ट, अनुबंध, निर्माण अनुबंध, भूमि और स्वामित्व।"
outcomes:
  - en: "Understand common law and tort principles"
    zh: "理解普通法和侵权法原则"
    zh-TW: "理解普通法與侵權法原則"
    ja: "コモンローと不法行為の原則を理解する"
    ko: "보통법과 불법행위 원칙 이해하기"
    vi: "Hiểu nguyên tắc thông luật và bồi thường"
    ms: "Memahami prinsip common law dan tort"
    id: "Memahami prinsip common law dan tort"
    hi: "कॉमन लॉ और टॉर्ट सिद्धांत समझना"
  - en: "Compare forms of construction contract"
    zh: "比较不同形式的建筑合同"
    zh-TW: "比較不同形式的營建契約"
    ja: "建設契約の形式を比較する"
    ko: "건설 계약 형태 비교하기"
    vi: "So sánh các loại hợp đồng xây dựng"
    ms: "Membandingkan bentuk kontrak pembinaan"
    id: "Membandingkan bentuk kontrak konstruksi"
    hi: "निर्माण अनुबंधों के प्रकारों की तुलना"
