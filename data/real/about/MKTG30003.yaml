code: MKTG30003
year: 2026
learn:
  en: "Marketing services, which are intangible and depend on staff, and how to create better customer experiences."
  zh: "服务营销：服务无形且依赖员工，以及如何打造更好的顾客体验。"
  zh-TW: "服務行銷：服務無形且仰賴員工，以及如何打造更好的顧客體驗。"
  ja: "形がなく従業員に左右されるサービスのマーケティングと、より良い顧客体験の作り方。"
  ko: "무형이고 직원에게 좌우되는 서비스의 마케팅과 더 나은 고객 경험 만들기."
  vi: "Marketing dịch vụ, vốn vô hình và phụ thuộc nhân viên, và cách tạo trải nghiệm khách hàng tốt hơn."
  ms: "Pemasaran perkhidmatan yang tidak ketara dan bergantung pada kakitangan, serta cara cipta pengalaman pelanggan lebih baik."
  id: "Pemasaran jasa yang tak berwujud dan bergantung pada staf, serta cara menciptakan pengalaman pelanggan yang lebih baik."
  hi: "सर्विस की मार्केटिंग, जो अमूर्त होती है और स्टाफ़ पर टिकी होती है, और बेहतर ग्राहक अनुभव कैसे बनाएँ।"
outcomes:
  - en: "Apply service marketing frameworks to real problems"
    zh: "用服务营销框架解决实际问题"
    zh-TW: "用服務行銷架構解決實際問題"
    ja: "サービスマーケティングの枠組みを実際の問題に使う"
    ko: "서비스 마케팅 프레임워크를 실제 문제에 적용하기"
    vi: "Áp dụng khung marketing dịch vụ cho vấn đề thực tế"
    ms: "Guna rangka kerja pemasaran perkhidmatan pada masalah sebenar"
    id: "Menerapkan kerangka pemasaran jasa pada masalah nyata"
    hi: "सर्विस मार्केटिंग फ़्रेमवर्क असली समस्याओं पर लगाना"
  - en: "Critique measures like satisfaction and NPS"
    zh: "评判满意度、NPS等指标"
    zh-TW: "評析滿意度、NPS等指標"
    ja: "顧客満足度やNPSなどの指標を批判的に見る"
    ko: "만족도, NPS 같은 지표 비판적으로 보기"
    vi: "Phê bình các chỉ số như mức hài lòng, NPS"
    ms: "Kritik ukuran seperti kepuasan dan NPS"
    id: "Mengkritisi ukuran seperti kepuasan dan NPS"
    hi: "संतुष्टि और NPS जैसे पैमानों की समीक्षा करना"
  - en: "Reduce role stress for front-line staff"
    zh: "减轻一线员工的角色压力"
    zh-TW: "減輕第一線員工的角色壓力"
    ja: "現場スタッフの役割ストレスを減らす"
    ko: "현장 직원의 역할 스트레스 줄이기"
    vi: "Giảm căng thẳng vai trò cho nhân viên tuyến đầu"
    ms: "Kurangkan tekanan peranan kakitangan barisan hadapan"
    id: "Mengurangi stres peran staf garis depan"
    hi: "फ़्रंटलाइन स्टाफ़ का काम का तनाव घटाना"
