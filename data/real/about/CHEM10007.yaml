code: CHEM10007
year: 2026
learn:
  en: "Basic chemistry: matter, solutions, gases, reactions, equilibrium, acids and bases, and organic molecules."
  zh: "化学基础：物质、溶液、气体、反应、平衡、酸碱和有机分子。"
  zh-TW: "化學基礎：物質、溶液、氣體、反應、平衡、酸鹼和有機分子。"
  ja: "化学の基礎：物質、溶液、気体、反応、平衡、酸と塩基、有機分子。"
  ko: "기초 화학: 물질, 용액, 기체, 반응, 평형, 산과 염기, 유기 분자."
  vi: "Hóa cơ bản: vật chất, dung dịch, khí, phản ứng, cân bằng, axit-bazơ và phân tử hữu cơ."
  ms: "Kimia asas: jirim, larutan, gas, tindak balas, keseimbangan, asid dan bes, serta molekul organik."
  id: "Kimia dasar: materi, larutan, gas, reaksi, kesetimbangan, asam-basa, dan molekul organik."
  hi: "बेसिक केमिस्ट्री: पदार्थ, विलयन, गैसें, रिएक्शन, साम्य, अम्ल-क्षार और ऑर्गेनिक अणु।"
outcomes:
  - en: "Explain how matter, solutions and gases behave"
    zh: "解释物质、溶液和气体的性质"
    zh-TW: "解釋物質、溶液和氣體的性質"
    ja: "物質・溶液・気体のふるまいを説明する"
    ko: "물질, 용액, 기체의 성질 설명하기"
    vi: "Giải thích tính chất của vật chất, dung dịch và khí"
    ms: "Terangkan sifat jirim, larutan dan gas"
    id: "Menjelaskan perilaku materi, larutan, dan gas"
    hi: "पदार्थ, विलयन और गैसों का व्यवहार समझाना"
  - en: "Recognise structures and groups in organic molecules"
    zh: "认出有机分子的结构和官能团"
    zh-TW: "認出有機分子的結構和官能基"
    ja: "有機分子の構造と官能基を見分ける"
    ko: "유기 분자의 구조와 작용기 알아보기"
    vi: "Nhận ra cấu trúc và nhóm chức trong phân tử hữu cơ"
    ms: "Kenal struktur dan kumpulan dalam molekul organik"
    id: "Mengenali struktur dan gugus pada molekul organik"
    hi: "ऑर्गेनिक अणुओं में संरचना और ग्रुप पहचानना"
  - en: "Do basic lab work safely and write reports"
    zh: "安全做基础实验并写报告"
    zh-TW: "安全做基礎實驗並寫報告"
    ja: "基本的な実験を安全に行いレポートを書く"
    ko: "기초 실험을 안전하게 하고 보고서 쓰기"
    vi: "Làm thí nghiệm cơ bản an toàn và viết báo cáo"
    ms: "Buat kerja makmal asas dengan selamat dan tulis laporan"
    id: "Melakukan kerja lab dasar dengan aman dan menulis laporan"
    hi: "बेसिक लैब काम सुरक्षित करना और रिपोर्ट लिखना"
