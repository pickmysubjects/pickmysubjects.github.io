code: CMCE10002
year: 2026
learn:
  en: "Why businesses invest in data analytics, how they manage data, and the ethical issues that come with it."
  zh: "企业为什么投资数据分析、怎么管理数据，以及随之而来的伦理问题。"
  zh-TW: "企業為什麼投資資料分析、怎麼管理資料，以及隨之而來的倫理議題。"
  ja: "企業がデータ分析に投資する理由、データの管理方法、それに伴う倫理的な問題。"
  ko: "기업이 데이터 분석에 투자하는 이유, 데이터 관리 방법, 그에 따른 윤리 문제."
  vi: "Vì sao doanh nghiệp đầu tư vào phân tích dữ liệu, cách quản lý dữ liệu và các vấn đề đạo đức đi kèm."
  ms: "Mengapa perniagaan melabur dalam analitik data, cara urus data dan isu etika yang timbul."
  id: "Mengapa bisnis berinvestasi di analitik data, cara mengelola data, dan masalah etika yang menyertainya."
  hi: "कंपनियाँ डेटा एनालिटिक्स में निवेश क्यों करती हैं, डेटा कैसे संभालती हैं और इससे जुड़े नैतिक मुद्दे।"
outcomes:
  - en: "See how analytics is used across marketing, finance, HR and operations"
    zh: "了解分析在营销、金融、人力和运营中的用法"
    zh-TW: "了解分析在行銷、金融、人資和營運中的用法"
    ja: "マーケティング・財務・人事・業務での分析の使い方を知る"
    ko: "마케팅, 재무, 인사, 운영에서 분석이 쓰이는 방식 이해"
    vi: "Hiểu cách dùng phân tích trong marketing, tài chính, nhân sự và vận hành"
    ms: "Faham kegunaan analitik dalam pemasaran, kewangan, HR dan operasi"
    id: "Memahami pemakaian analitik di pemasaran, keuangan, SDM, dan operasional"
    hi: "मार्केटिंग, फ़ाइनेंस, HR और ऑपरेशंस में एनालिटिक्स का इस्तेमाल समझना"
  - en: "Choose a sensible way to collect and analyse business data"
    zh: "选择合适的方法收集和分析业务数据"
    zh-TW: "選擇合適的方法蒐集和分析業務資料"
    ja: "業務データの集め方と分析方法を適切に選ぶ"
    ko: "비즈니스 데이터 수집·분석 방법을 알맞게 선택"
    vi: "Chọn cách thu thập và phân tích dữ liệu kinh doanh phù hợp"
    ms: "Pilih cara wajar untuk kumpul dan analisis data perniagaan"
    id: "Memilih cara yang tepat untuk mengumpulkan dan menganalisis data bisnis"
    hi: "बिज़नेस डेटा जुटाने और विश्लेषण का सही तरीका चुनना"
  - en: "Spot the social and ethical risks of using data"
    zh: "识别使用数据的社会和伦理风险"
    zh-TW: "辨識使用資料的社會與倫理風險"
    ja: "データ利用の社会的・倫理的リスクに気づく"
    ko: "데이터 활용의 사회적·윤리적 위험 파악"
    vi: "Nhận ra rủi ro xã hội và đạo đức khi dùng dữ liệu"
    ms: "Kenal pasti risiko sosial dan etika penggunaan data"
    id: "Mengenali risiko sosial dan etika pemakaian data"
    hi: "डेटा इस्तेमाल के सामाजिक और नैतिक जोखिम पहचानना"
