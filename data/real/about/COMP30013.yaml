code: COMP30013
year: 2026
learn:
  en: "Advanced computing topics not taught elsewhere; content depends on the project and may involve building a system."
  zh: "其他科目没有的进阶计算机内容，具体看项目，可能要做系统开发。"
  zh-TW: "其他科目沒有的進階資訊內容，依專題而定，可能要做系統開發。"
  ja: "他の科目にない発展的な情報科学トピック。内容はプロジェクト次第で、システム開発を含むこともある。"
  ko: "다른 과목에서 다루지 않는 심화 컴퓨팅 주제. 내용은 프로젝트에 따라 다르며 시스템 개발이 포함될 수 있다."
  vi: "Chủ đề máy tính nâng cao không dạy ở môn học khác; nội dung tùy dự án, có thể phải xây dựng hệ thống."
  ms: "Topik pengkomputeran lanjutan yang tiada di subjek lain; kandungan ikut projek dan mungkin perlu bina sistem."
  id: "Topik komputasi lanjut yang tidak ada di mata kuliah lain; isinya tergantung proyek dan bisa termasuk membangun sistem."
  hi: "एडवांस कंप्यूटिंग विषय जो कहीं और नहीं पढ़ाए जाते; कंटेंट प्रोजेक्ट पर निर्भर है और सिस्टम बनाना भी हो सकता है।"
outcomes:
  - en: "Apply advanced techniques to computing problems"
    zh: "用进阶方法解决计算问题"
    zh-TW: "用進階方法解決計算問題"
    ja: "高度な手法を計算問題に応用する"
    ko: "컴퓨팅 문제에 고급 기법 적용"
    vi: "Áp dụng kỹ thuật nâng cao vào bài toán máy tính"
    ms: "Guna teknik lanjutan pada masalah pengkomputeran"
    id: "Menerapkan teknik lanjut pada masalah komputasi"
    hi: "कंप्यूटिंग समस्याओं पर एडवांस तकनीकें लगाना"
  - en: "Explain and discuss technical solutions"
    zh: "讲解和讨论技术方案"
    zh-TW: "講解和討論技術方案"
    ja: "技術的な解決策を説明し議論する"
    ko: "기술적 해법 설명 및 토론"
    vi: "Giải thích và thảo luận giải pháp kỹ thuật"
    ms: "Terang dan bincang penyelesaian teknikal"
    id: "Menjelaskan dan mendiskusikan solusi teknis"
    hi: "तकनीकी समाधान समझाना और चर्चा करना"
