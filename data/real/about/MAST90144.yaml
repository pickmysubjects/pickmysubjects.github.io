code: MAST90144
year: 2027
learn:
  en: "Making a sequence of decisions under uncertainty: control, reinforcement learning, bandits and simulation optimisation."
  zh: "不确定性下的序贯决策：控制、强化学习、多臂老虎机与仿真优化。"
  zh-TW: "不確定性下的序列決策：控制、強化學習、多臂吃角子老虎機與模擬最佳化。"
  ja: "不確実性下の逐次意思決定：制御、強化学習、多腕バンディット、シミュレーション最適化。"
  ko: "불확실성 속 순차적 의사결정: 제어, 강화학습, 멀티암드 밴딧, 시뮬레이션 최적화."
  vi: "Ra quyết định tuần tự khi bất định: điều khiển, học tăng cường, bandit, tối ưu mô phỏng."
  ms: "Membuat keputusan berturutan dalam ketidakpastian: kawalan, pembelajaran pengukuhan, bandit, simulasi."
  id: "Keputusan berurutan di bawah ketidakpastian: kontrol, reinforcement learning, bandit, optimasi simulasi."
  hi: "अनिश्चितता में क्रमिक निर्णय: कंट्रोल, रीइन्फ़ोर्समेंट लर्निंग, बैंडिट, सिमुलेशन ऑप्टिमाइज़ेशन।"
outcomes:
  - en: "Model a problem as sequential decisions over stages"
    zh: "把问题建模为多阶段序贯决策"
    zh-TW: "把問題建模為多階段序列決策"
    ja: "問題を多段階の逐次決定としてモデル化する"
    ko: "문제를 단계별 순차 결정으로 모델링하기"
    vi: "Mô hình bài toán thành chuỗi quyết định theo giai đoạn"
    ms: "Memodelkan masalah sebagai keputusan berperingkat"
    id: "Memodelkan masalah sebagai keputusan bertahap"
    hi: "समस्या को चरणबद्ध निर्णयों के रूप में मॉडल करना"
  - en: "Find good policies for decisions under uncertainty"
    zh: "为不确定性下的决策找出好的策略"
    zh-TW: "為不確定性下的決策找出好的策略"
    ja: "不確実性下で良い方策を見つける"
    ko: "불확실성 속 좋은 정책 찾기"
    vi: "Tìm chính sách tốt cho quyết định khi bất định"
    ms: "Mencari polisi baik untuk keputusan dalam ketidakpastian"
    id: "Menemukan kebijakan yang baik saat tidak pasti"
    hi: "अनिश्चितता में अच्छी नीति खोजना"
