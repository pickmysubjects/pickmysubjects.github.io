code: POPH30004
year: 2026
learn:
  en: "The ethics of health care and why some groups get worse health, studied through real cases."
  zh: "医疗中的伦理问题，以及为什么有些人群健康状况更差，通过真实案例来学习。"
  zh-TW: "醫療中的倫理問題，以及為什麼有些族群健康狀況更差，透過真實案例來學習。"
  ja: "医療の倫理と、なぜ一部の人々の健康状態が悪くなるのかを、実際の事例を通して学ぶ。"
  ko: "의료 윤리와 왜 어떤 집단의 건강이 더 나쁜지를 실제 사례로 공부한다."
  vi: "Đạo đức trong chăm sóc sức khỏe và lý do một số nhóm người có sức khỏe kém hơn, học qua các ca thực tế."
  ms: "Etika penjagaan kesihatan dan sebab sesetengah kumpulan mempunyai kesihatan lebih buruk, dipelajari melalui kes sebenar."
  id: "Etika layanan kesehatan dan alasan sebagian kelompok punya kesehatan lebih buruk, dipelajari lewat kasus nyata."
  hi: "स्वास्थ्य सेवा की नैतिकता और कुछ समूहों की सेहत ज़्यादा खराब क्यों होती है, असली मामलों के ज़रिए।"
outcomes:
  - en: "Spot ethical problems in health care and weigh them with medical ethics"
    zh: "发现医疗中的伦理问题，并用医学伦理四原则来分析"
    zh-TW: "發現醫療中的倫理問題，並用醫學倫理四原則來分析"
    ja: "医療の倫理的な問題に気づき、医療倫理の四原則で考える"
    ko: "의료 속 윤리 문제를 찾아 의료 윤리 4원칙으로 분석하기"
    vi: "Nhận ra vấn đề đạo đức trong y tế và phân tích bằng bốn nguyên tắc đạo đức y khoa"
    ms: "Mengenal pasti masalah etika dalam penjagaan kesihatan dan menganalisisnya dengan empat prinsip etika perubatan"
    id: "Mengenali masalah etika dalam layanan kesehatan dan menganalisisnya dengan empat prinsip etika kedokteran"
    hi: "स्वास्थ्य सेवा में नैतिक समस्याएँ पहचानना और मेडिकल एथिक्स के चार सिद्धांतों से उन्हें सुलझाना"
  - en: "Explain how social, structural and commercial factors create health inequalities"
    zh: "解释社会、结构和商业因素如何造成健康不平等"
    zh-TW: "解釋社會、結構和商業因素如何造成健康不平等"
    ja: "社会的・構造的・商業的な要因が健康格差を生む仕組みを説明する"
    ko: "사회적·구조적·상업적 요인이 건강 불평등을 만드는 방식 설명하기"
    vi: "Giải thích các yếu tố xã hội, cấu trúc và thương mại tạo ra bất bình đẳng sức khỏe ra sao"
    ms: "Menerangkan bagaimana faktor sosial, struktur dan komersial mewujudkan ketidaksamaan kesihatan"
    id: "Menjelaskan bagaimana faktor sosial, struktural, dan komersial menciptakan ketimpangan kesehatan"
    hi: "समझाना कि सामाजिक, ढाँचागत और व्यावसायिक कारण स्वास्थ्य में असमानता कैसे पैदा करते हैं"
  - en: "Reflect on your own position and power as a future health worker"
    zh: "反思自己作为未来医疗工作者的位置和影响力"
    zh-TW: "反思自己作為未來醫療工作者的位置和影響力"
    ja: "将来の医療従事者としての自分の立場と影響力を振り返る"
    ko: "미래의 보건의료인으로서 자신의 위치와 영향력 돌아보기"
    vi: "Suy ngẫm về vị trí và ảnh hưởng của bản thân với tư cách nhân viên y tế tương lai"
    ms: "Merenung kedudukan dan pengaruh diri sebagai bakal pekerja kesihatan"
    id: "Merefleksikan posisi dan pengaruh diri sebagai calon tenaga kesehatan"
    hi: "भविष्य के स्वास्थ्यकर्मी के रूप में अपनी स्थिति और ताक़त पर सोचना"
