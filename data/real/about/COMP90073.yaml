code: COMP90073
year: 2027
learn:
  en: "Making machine learning private, secure, robust, fair and explainable, including defending against attacks."
  zh: "让机器学习更隐私、安全、稳健、公平、可解释，并防御攻击。"
  zh-TW: "讓機器學習更具隱私、安全、穩健、公平、可解釋，並防禦攻擊。"
  ja: "機械学習をプライバシー・安全・頑健・公平・説明可能にし、攻撃を防ぐ。"
  ko: "기계학습의 프라이버시·보안·견고성·공정성·설명 가능성과 공격 방어."
  vi: "Làm học máy riêng tư, an toàn, bền vững, công bằng, dễ giải thích, chống tấn công."
  ms: "Menjadikan pembelajaran mesin peribadi, selamat, teguh, adil dan boleh dijelaskan, serta tahan serangan."
  id: "Membuat pembelajaran mesin privat, aman, tangguh, adil, dapat dijelaskan, dan tahan serangan."
  hi: "मशीन लर्निंग को निजी, सुरक्षित, मज़बूत, निष्पक्ष और समझने योग्य बनाना, हमलों से बचाव सहित।"
outcomes:
  - en: "Recognise attacks like adversarial examples and data poisoning"
    zh: "识别对抗样本、数据投毒等攻击"
    zh-TW: "辨識對抗樣本、資料投毒等攻擊"
    ja: "敵対的サンプルやデータ汚染などの攻撃を見分ける"
    ko: "적대적 예제·데이터 오염 같은 공격 식별하기"
    vi: "Nhận biết tấn công như mẫu đối kháng, đầu độc dữ liệu"
    ms: "Kenal pasti serangan seperti contoh adversari dan peracunan data"
    id: "Mengenali serangan seperti contoh adversarial dan peracunan data"
    hi: "एडवर्सेरियल उदाहरण और डेटा पॉइज़निंग जैसे हमले पहचानना"
  - en: "Apply techniques that make models safer and fairer"
    zh: "应用让模型更安全公平的技术"
    zh-TW: "應用讓模型更安全公平的技術"
    ja: "モデルをより安全で公平にする手法を使う"
    ko: "모델을 더 안전·공정하게 하는 기법 적용하기"
    vi: "Áp dụng kỹ thuật làm mô hình an toàn, công bằng hơn"
    ms: "Guna teknik menjadikan model lebih selamat dan adil"
    id: "Menerapkan teknik agar model lebih aman dan adil"
    hi: "मॉडल को सुरक्षित और निष्पक्ष बनाने की तकनीकें लागू करना"
