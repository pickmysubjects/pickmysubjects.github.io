code: ZOOL30006
year: 2026
learn:
  en: "Why animals behave as they do: mating, parenting, cooperation and more, shaped by selection."
  zh: "动物为何这样行事：择偶、育幼、合作等如何被选择塑造。"
  zh-TW: "動物為何這樣行事：擇偶、育幼、合作等如何被選擇塑造。"
  ja: "求愛・子育て・協力など、動物の行動が選択でどう形づくられたか。"
  ko: "짝짓기, 양육, 협력 등 동물 행동이 선택으로 어떻게 형성됐는지."
  vi: "Vì sao động vật cư xử như vậy: giao phối, nuôi con, hợp tác, do chọn lọc định hình."
  ms: "Mengapa haiwan berkelakuan begitu: mengawan, menjaga anak, bekerjasama, dibentuk pemilihan."
  id: "Mengapa hewan berperilaku begitu: kawin, mengasuh, bekerja sama, dibentuk seleksi."
  hi: "जानवर ऐसा व्यवहार क्यों करते हैं: संभोग, पालन-पोषण, सहयोग, जो चयन से बने।"
outcomes:
  - en: "Explain behaviour from mechanistic and evolutionary views"
    zh: "从机制和进化角度解释行为"
    zh-TW: "從機制與演化角度解釋行為"
    ja: "行動を至近要因と究極要因で説明する"
    ko: "기작과 진화 관점에서 행동 설명하기"
    vi: "Giải thích hành vi theo cơ chế và tiến hóa"
    ms: "Menerangkan tingkah laku dari sudut mekanisme dan evolusi"
    id: "Menjelaskan perilaku dari sisi mekanisme dan evolusi"
    hi: "व्यवहार को मैकेनिज़्म और विकास से समझाना"
  - en: "Choose a fitting study method"
    zh: "选择合适的研究方法"
    zh-TW: "選擇合適的研究方法"
    ja: "適切な研究手法を選ぶ"
    ko: "알맞은 연구 방법 고르기"
    vi: "Chọn phương pháp nghiên cứu phù hợp"
    ms: "Memilih kaedah kajian yang sesuai"
    id: "Memilih metode studi yang tepat"
    hi: "सही अध्ययन तरीका चुनना"
