code: GEND10002
year: 2026
learn:
  en: "How gender, race and class connect in global issues like migration, refugees, climate and aid, seen through a feminist lens."
  zh: "从女性主义视角看性别、种族和阶级如何在移民、难民、气候和援助等全球议题中交织。"
  zh-TW: "從女性主義視角看性別、種族和階級如何在移民、難民、氣候和援助等全球議題中交織。"
  ja: "移民・難民・気候・援助などの世界的課題で、ジェンダー・人種・階級がどう結びつくかをフェミニズムの視点で見る。"
  ko: "이주, 난민, 기후, 원조 같은 세계 문제에서 젠더·인종·계급이 어떻게 얽히는지 페미니즘 관점으로 본다."
  vi: "Giới, chủng tộc và giai cấp gắn với nhau thế nào trong di cư, tị nạn, khí hậu và viện trợ, qua lăng kính nữ quyền."
  ms: "Cara gender, kaum dan kelas berkait dalam isu global seperti migrasi, pelarian, iklim dan bantuan, melalui lensa feminis."
  id: "Cara gender, ras, dan kelas saling terkait dalam isu global seperti migrasi, pengungsi, iklim, dan bantuan, lewat lensa feminis."
  hi: "प्रवास, शरणार्थी, जलवायु और सहायता जैसे वैश्विक मुद्दों में जेंडर, नस्ल और वर्ग कैसे जुड़ते हैं, नारीवादी नज़र से।"
outcomes:
  - en: "Explain intersectionality with real examples"
    zh: "结合实例解释交叉性"
    zh-TW: "結合實例解釋交織性"
    ja: "実例を使い交差性を説明する"
    ko: "실제 예로 교차성 설명하기"
    vi: "Giải thích tính giao thoa bằng ví dụ thực tế"
    ms: "Terangkan interseksionaliti dengan contoh sebenar"
    id: "Menjelaskan interseksionalitas dengan contoh nyata"
    hi: "असल उदाहरणों से इंटरसेक्शनैलिटी समझाना"
  - en: "Analyse how globalisation shapes identity"
    zh: "分析全球化如何塑造身份"
    zh-TW: "分析全球化如何塑造身分"
    ja: "グローバル化がアイデンティティをどう形づくるか分析する"
    ko: "세계화가 정체성을 만드는 방식 분석하기"
    vi: "Phân tích toàn cầu hóa định hình bản sắc ra sao"
    ms: "Analisis cara globalisasi membentuk identiti"
    id: "Menganalisis cara globalisasi membentuk identitas"
    hi: "वैश्वीकरण पहचान को कैसे गढ़ता है, विश्लेषण करना"
  - en: "Discuss feminist and decolonial social movements"
    zh: "讨论女性主义与去殖民社会运动"
    zh-TW: "討論女性主義與去殖民社會運動"
    ja: "フェミニズムと脱植民地の社会運動を論じる"
    ko: "페미니즘·탈식민 사회운동 논의하기"
    vi: "Thảo luận các phong trào nữ quyền và giải thực dân"
    ms: "Bincangkan gerakan sosial feminis dan dekolonial"
    id: "Membahas gerakan sosial feminis dan dekolonial"
    hi: "नारीवादी और विऔपनिवेशिक सामाजिक आंदोलनों पर चर्चा करना"
