code: MAST20036
year: 2026
learn:
  en: "Counting, graphs and finite structures: proofs, combinatorics, graph algorithms, groups and fields."
  zh: "计数、图和有限结构：证明、组合、图算法、群与域"
  zh-TW: "計數、圖和有限結構：證明、組合、圖演算法、群與體"
  ja: "数え上げ、グラフ、有限構造：証明、組合せ論、グラフアルゴリズム、群と体。"
  ko: "세기, 그래프, 유한 구조: 증명, 조합론, 그래프 알고리즘, 군과 체."
  vi: "Đếm, đồ thị và cấu trúc hữu hạn: chứng minh, tổ hợp, thuật toán đồ thị, nhóm và trường."
  ms: "Pembilangan, graf dan struktur terhingga: bukti, kombinatorik, algoritma graf, kumpulan dan medan."
  id: "Pencacahan, graf, dan struktur hingga: bukti, kombinatorika, algoritma graf, grup dan medan."
  hi: "गिनती, ग्राफ़ और परिमित संरचनाएँ: प्रमाण, संयोजिकी, ग्राफ़ एल्गोरिद्म, समूह और क्षेत्र।"
outcomes:
  - en: "Solve counting problems with combinatorial tools"
    zh: "用组合方法解决计数问题"
    zh-TW: "用組合方法解決計數問題"
    ja: "組合せの手法で数え上げ問題を解く"
    ko: "조합 기법으로 세기 문제 풀기"
    vi: "Giải bài toán đếm bằng công cụ tổ hợp"
    ms: "Menyelesaikan masalah pembilangan secara kombinatorik"
    id: "Menyelesaikan soal pencacahan dengan kombinatorika"
    hi: "संयोजिकी से गिनती की समस्याएँ हल करना"
  - en: "Write and check combinatorial proofs"
    zh: "写出并检验组合证明"
    zh-TW: "寫出並檢驗組合證明"
    ja: "組合せ的な証明を書いて検証する"
    ko: "조합적 증명 작성·검토하기"
    vi: "Viết và kiểm tra chứng minh tổ hợp"
    ms: "Menulis dan menyemak bukti kombinatorik"
    id: "Menulis dan memeriksa bukti kombinatorika"
    hi: "संयोजी प्रमाण लिखना और जाँचना"
  - en: "Apply graph search and shortest-path algorithms"
    zh: "运用图搜索和最短路径算法"
    zh-TW: "運用圖搜尋和最短路徑演算法"
    ja: "グラフ探索と最短経路アルゴリズムを使う"
    ko: "그래프 탐색·최단경로 알고리즘 적용하기"
    vi: "Áp dụng thuật toán tìm kiếm và đường ngắn nhất"
    ms: "Menggunakan algoritma carian graf dan laluan terpendek"
    id: "Menerapkan algoritma pencarian graf dan jalur terpendek"
    hi: "ग्राफ़ सर्च और सबसे छोटा पथ एल्गोरिद्म लगाना"
