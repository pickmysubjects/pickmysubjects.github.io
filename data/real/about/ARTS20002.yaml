code: ARTS20002
year: 2026
learn:
  en: "How to get more out of travel or exchange: researching places, handling culture shock and recording what you see."
  zh: "怎样让旅行或交换更有收获：提前了解目的地、应对文化冲击、记录你的见闻。"
  zh-TW: "怎樣讓旅行或交換更有收穫：事先了解目的地、應對文化衝擊、記錄你的見聞。"
  ja: "旅行や交換留学をもっと実りあるものに：行き先を調べ、カルチャーショックに対処し、見たことを記録する。"
  ko: "여행이나 교환학생을 더 알차게: 목적지를 조사하고, 문화 충격에 대처하고, 본 것을 기록하는 법."
  vi: "Làm sao để chuyến đi hay kỳ trao đổi đáng giá hơn: tìm hiểu nơi đến, xử lý sốc văn hóa và ghi lại những gì thấy."
  ms: "Cara mendapat lebih banyak daripada perjalanan atau pertukaran pelajar: kaji tempat, hadapi kejutan budaya dan rekod apa yang dilihat."
  id: "Cara dapat lebih banyak dari perjalanan atau pertukaran pelajar: riset tempat, hadapi gegar budaya, dan catat apa yang dilihat."
  hi: "यात्रा या एक्सचेंज से ज़्यादा कैसे सीखें: जगह के बारे में रिसर्च, कल्चर शॉक से निपटना और जो देखा उसे दर्ज करना।"
outcomes:
  - en: "Research a destination with digital tools before you go"
    zh: "出发前用数字工具调研目的地"
    zh-TW: "出發前用數位工具調研目的地"
    ja: "出発前にデジタルツールで行き先を調べる"
    ko: "떠나기 전에 디지털 도구로 목적지 조사하기"
    vi: "Tìm hiểu nơi đến bằng công cụ số trước khi đi"
    ms: "Kaji destinasi dengan alat digital sebelum berangkat"
    id: "Meriset tujuan dengan alat digital sebelum berangkat"
    hi: "जाने से पहले डिजिटल टूल से जगह के बारे में रिसर्च करना"
  - en: "Deal with culture shock and travel risks"
    zh: "应对文化冲击和旅行风险"
    zh-TW: "應對文化衝擊和旅行風險"
    ja: "カルチャーショックや旅のリスクに対処する"
    ko: "문화 충격과 여행 위험에 대처하기"
    vi: "Xử lý sốc văn hóa và rủi ro khi đi xa"
    ms: "Hadapi kejutan budaya dan risiko perjalanan"
    id: "Menghadapi gegar budaya dan risiko perjalanan"
    hi: "कल्चर शॉक और यात्रा के जोखिमों से निपटना"
  - en: "Record and share your travel experiences in words and images"
    zh: "用文字和图片记录并分享旅行经历"
    zh-TW: "用文字和圖片記錄並分享旅行經歷"
    ja: "旅の経験を文章と画像で記録し、共有する"
    ko: "여행 경험을 글과 이미지로 기록하고 공유하기"
    vi: "Ghi lại và chia sẻ trải nghiệm bằng chữ và hình ảnh"
    ms: "Rekod dan kongsi pengalaman perjalanan dengan tulisan dan gambar"
    id: "Mencatat dan berbagi pengalaman perjalanan lewat tulisan dan gambar"
    hi: "यात्रा के अनुभव शब्दों और तस्वीरों में दर्ज करना और साझा करना"
