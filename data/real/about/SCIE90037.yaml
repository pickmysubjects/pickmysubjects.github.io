code: SCIE90037
year: 2027
learn:
  en: "Methods for screening and identifying invasive species and biosecurity risks, from plants and fungi to pathogens and animals."
  zh: "筛查和鉴定入侵物种与生物安全风险的方法，涵盖植物、真菌、病原体和动物。"
  zh-TW: "篩檢與鑑定入侵物種及生物安全風險的方法，涵蓋植物、真菌、病原體與動物。"
  ja: "植物・菌類・病原体・動物まで、外来種やバイオセキュリティ上のリスクを調べ特定する方法。"
  ko: "식물·균류·병원체·동물까지 침입종과 생물보안 위험을 선별·식별하는 방법."
  vi: "Phương pháp sàng lọc và định danh loài xâm lấn và rủi ro an toàn sinh học, từ thực vật, nấm đến mầm bệnh và động vật."
  ms: "Kaedah menyaring dan mengenal pasti spesies invasif dan risiko biosekuriti, dari tumbuhan dan kulat hingga patogen dan haiwan."
  id: "Metode menyaring dan mengidentifikasi spesies invasif dan risiko biosekuriti, dari tumbuhan dan jamur hingga patogen dan hewan."
  hi: "आक्रामक प्रजातियों और जैव-सुरक्षा जोखिमों की जाँच व पहचान की विधियाँ, पौधों, कवक से रोगजनकों और जानवरों तक।"
outcomes:
  - en: "Identify organisms by morphology and molecular traits"
    zh: "通过形态和分子特征鉴定生物"
    zh-TW: "透過形態與分子特徵鑑定生物"
    ja: "形態と分子の特徴で生物を同定する"
    ko: "형태와 분자 특징으로 생물 식별하기"
    vi: "Định danh sinh vật theo hình thái và đặc điểm phân tử"
    ms: "Mengenal pasti organisma melalui morfologi dan ciri molekul"
    id: "Mengidentifikasi organisme dari morfologi dan ciri molekuler"
    hi: "आकृति और आणविक गुणों से जीव पहचानना"
  - en: "Design a diagnostic protocol for a risk organism"
    zh: "为风险生物设计诊断方案"
    zh-TW: "為風險生物設計診斷方案"
    ja: "リスク生物の診断手順を設計する"
    ko: "위험 생물 진단 프로토콜 설계하기"
    vi: "Thiết kế quy trình chẩn đoán cho sinh vật nguy cơ"
    ms: "Mereka bentuk protokol diagnostik untuk organisma berisiko"
    id: "Merancang protokol diagnostik untuk organisme berisiko"
    hi: "जोखिम वाले जीव के लिए निदान प्रोटोकॉल बनाना"
  - en: "Review past pest incursions"
    zh: "回顾过去的有害生物入侵事件"
    zh-TW: "回顧過去的有害生物入侵事件"
    ja: "過去の害虫侵入事例を検討する"
    ko: "과거 해충 유입 사례 검토하기"
    vi: "Xem xét các đợt xâm nhập dịch hại trước đây"
    ms: "Mengkaji pencerobohan perosak lalu"
    id: "Meninjau serangan hama di masa lalu"
    hi: "पिछले कीट घुसपैठ मामलों की समीक्षा"
