code: ACCT30004
year: 2026
learn:
  en: "How auditors check a company's accounts and controls, and the rules and ethics they work under."
  zh: "审计师如何检查公司账目和内控，以及他们遵守的规则和职业道德。"
  zh-TW: "查核人員如何查核公司帳目與內控，以及他們遵守的規範和職業倫理。"
  ja: "監査人が会社の帳簿と内部統制をどう確かめるか、従うべき規則と倫理。"
  ko: "감사인이 회사 장부와 내부통제를 점검하는 방법, 그리고 지켜야 할 규칙과 윤리."
  vi: "Kiểm toán viên kiểm tra sổ sách và kiểm soát của công ty ra sao, cùng các quy định và đạo đức nghề nghiệp."
  ms: "Cara juruaudit menyemak akaun dan kawalan syarikat, serta peraturan dan etika yang mereka patuhi."
  id: "Cara auditor memeriksa pembukuan dan pengendalian perusahaan, serta aturan dan etika yang mereka ikuti."
  hi: "ऑडिटर कंपनी के खातों और कंट्रोल की जाँच कैसे करते हैं, और उन पर लागू नियम व नैतिकता।"
outcomes:
  - en: "Assess a client's risks before an audit"
    zh: "在审计前评估客户的风险"
    zh-TW: "在查核前評估客戶的風險"
    ja: "監査の前にクライアントのリスクを評価する"
    ko: "감사 전에 고객의 위험 평가"
    vi: "Đánh giá rủi ro của khách hàng trước khi kiểm toán"
    ms: "Nilai risiko pelanggan sebelum audit"
    id: "Menilai risiko klien sebelum audit"
    hi: "ऑडिट से पहले क्लाइंट के जोखिम आँकना"
  - en: "Gather audit evidence and form a judgement"
    zh: "收集审计证据并做出判断"
    zh-TW: "蒐集查核證據並做出判斷"
    ja: "監査証拠を集めて判断を下す"
    ko: "감사 증거를 모으고 판단 내리기"
    vi: "Thu thập bằng chứng kiểm toán và đưa ra nhận định"
    ms: "Kumpul bukti audit dan buat pertimbangan"
    id: "Mengumpulkan bukti audit dan membuat penilaian"
    hi: "ऑडिट सबूत जुटाना और निष्कर्ष निकालना"
  - en: "Explain the different audit reports and who they serve"
    zh: "解释各类审计报告及其读者"
    zh-TW: "說明各類查核報告及其讀者"
    ja: "各種監査報告とその読み手を説明する"
    ko: "여러 감사보고서와 그 이용자 설명"
    vi: "Giải thích các loại báo cáo kiểm toán và người dùng chúng"
    ms: "Terangkan pelbagai laporan audit dan penggunanya"
    id: "Menjelaskan jenis laporan audit dan siapa penggunanya"
    hi: "अलग-अलग ऑडिट रिपोर्ट और उनके पाठकों को समझाना"
