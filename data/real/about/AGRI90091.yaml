code: AGRI90091
year: 2027
learn:
  en: "How new crop varieties go from lab and breeding trials to release, with a small research project."
  zh: "新作物品种如何从实验室和育种试验走向推广，并做一个小型研究项目。"
  zh-TW: "新作物品種如何從實驗室與育種試驗走向推廣，並做一個小型研究專題。"
  ja: "新しい作物品種が実験室・育種試験から普及に至る流れを学び、小さな研究も行う。"
  ko: "새 작물 품종이 실험실·육종 시험에서 보급까지 가는 과정과 소규모 연구 프로젝트."
  vi: "Giống cây trồng mới đi từ phòng thí nghiệm, thử nghiệm đến phát hành, kèm dự án nhỏ."
  ms: "Bagaimana varieti tanaman baharu bergerak dari makmal ke pasaran, dengan projek kajian kecil."
  id: "Bagaimana varietas tanaman baru dari lab dan uji pemuliaan sampai dirilis, plus proyek riset kecil."
  hi: "नई फ़सल किस्में लैब और प्रजनन परीक्षण से रिलीज़ तक कैसे पहुँचती हैं, एक छोटे शोध प्रोजेक्ट के साथ।"
outcomes:
  - en: "Design breeding strategies to improve crops"
    zh: "设计改良作物的育种策略"
    zh-TW: "設計改良作物的育種策略"
    ja: "作物改良の育種戦略を立てる"
    ko: "작물 개량을 위한 육종 전략 설계하기"
    vi: "Thiết kế chiến lược chọn giống cải tiến cây trồng"
    ms: "Mereka strategi pembiakbakaan untuk tanaman"
    id: "Merancang strategi pemuliaan tanaman"
    hi: "फ़सल सुधार के लिए प्रजनन रणनीति बनाना"
  - en: "Compare conventional breeding and genetic modification"
    zh: "比较传统育种与转基因技术"
    zh-TW: "比較傳統育種與基因改造技術"
    ja: "従来育種と遺伝子組換えを比べる"
    ko: "전통 육종과 유전자 변형 비교하기"
    vi: "So sánh chọn giống truyền thống và biến đổi gen"
    ms: "Membandingkan pembiakbakaan konvensional dan GM"
    id: "Membandingkan pemuliaan konvensional dan rekayasa genetika"
    hi: "पारंपरिक प्रजनन और जीन संशोधन की तुलना"
  - en: "Explain how GM food crops get approved and marketed"
    zh: "解释转基因作物的审批与上市流程"
    zh-TW: "解釋基改作物的審批與上市流程"
    ja: "GM作物の承認と市場化の流れを説明する"
    ko: "GM 작물의 승인·상업화 과정 설명하기"
    vi: "Giải thích quy trình phê duyệt và đưa cây GM ra thị trường"
    ms: "Menerangkan kelulusan dan pemasaran tanaman GM"
    id: "Menjelaskan persetujuan dan pemasaran tanaman GM"
    hi: "GM फ़सलों की मंज़ूरी और बाज़ार प्रक्रिया समझाना"
