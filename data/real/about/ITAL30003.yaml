code: ITAL30003
year: 2026
learn:
  en: "Applying your Italian to major Italian works read against today's world, ending in a group research project."
  zh: "把意大利语用于阅读意大利重要作品，并联系当今世界，最后完成小组研究项目。"
  zh-TW: "把義大利語用於閱讀義大利重要作品，並聯繫當今世界，最後完成小組研究專題。"
  ja: "イタリアの主要作品を現代の視点から読み、最後にグループ研究をまとめる。"
  ko: "이탈리아 주요 작품을 오늘의 시각으로 읽고 마지막에 그룹 연구 프로젝트를 한다."
  vi: "Dùng tiếng Ý để đọc các tác phẩm lớn của Ý trong bối cảnh hôm nay, kết thúc bằng dự án nghiên cứu nhóm."
  ms: "Menggunakan bahasa Itali untuk membaca karya utama Itali dalam konteks kini, diakhiri projek penyelidikan berkumpulan."
  id: "Memakai bahasa Italia untuk membaca karya penting Italia dalam konteks masa kini, diakhiri proyek riset kelompok."
  hi: "इतालवी की बड़ी रचनाओं को आज की दुनिया के संदर्भ में पढ़ना, अंत में समूह शोध परियोजना।"
outcomes:
  - en: "Use the right register in spoken and written Italian"
    zh: "在口语和书面意大利语中使用恰当语域"
    zh-TW: "在口語和書面義大利語中使用恰當語域"
    ja: "話し言葉と書き言葉で適切な文体を使う"
    ko: "말과 글에서 알맞은 이탈리아어 문체 쓰기"
    vi: "Dùng đúng văn phong khi nói và viết tiếng Ý"
    ms: "Guna laras yang betul dalam bahasa Itali lisan dan tulisan"
    id: "Memakai ragam yang tepat dalam bahasa Italia lisan dan tulis"
    hi: "बोली और लिखित इतालवी में सही शैली इस्तेमाल करना"
  - en: "Discuss longer Italian texts in depth"
    zh: "深入讨论较长的意大利语文本"
    zh-TW: "深入討論較長的義大利語文本"
    ja: "長めのイタリア語の文章を深く論じる"
    ko: "긴 이탈리아어 글을 깊이 토론하기"
    vi: "Thảo luận sâu các văn bản tiếng Ý dài"
    ms: "Bincang teks Itali yang panjang secara mendalam"
    id: "Membahas teks Italia yang panjang secara mendalam"
    hi: "लंबे इतालवी पाठों पर गहराई से चर्चा करना"
  - en: "Complete and present a group research project"
    zh: "完成并展示小组研究项目"
    zh-TW: "完成並展示小組研究專題"
    ja: "グループ研究をまとめて発表する"
    ko: "그룹 연구 프로젝트 완성하고 발표하기"
    vi: "Hoàn thành và trình bày dự án nghiên cứu nhóm"
    ms: "Siapkan dan bentangkan projek penyelidikan berkumpulan"
    id: "Menyelesaikan dan mempresentasikan proyek riset kelompok"
    hi: "समूह शोध परियोजना पूरी कर प्रस्तुत करना"
