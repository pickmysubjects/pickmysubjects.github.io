code: INDO30011
year: 2026
learn:
  en: "Discussing bigger ideas in Indonesian through stories and news on youth, migrant workers, nationalism and the environment."
  zh: "通过小说和新闻用印尼语讨论更深的议题：青年、外劳、民族主义和环境。"
  zh-TW: "透過小說和新聞用印尼語討論更深的議題：青年、移工、民族主義和環境。"
  ja: "短編やニュースを通じ、若者・出稼ぎ労働者・ナショナリズム・環境をインドネシア語で議論する。"
  ko: "단편과 뉴스로 청년, 이주 노동자, 민족주의, 환경을 인도네시아어로 토론한다."
  vi: "Thảo luận ý tưởng lớn hơn bằng tiếng Indonesia qua truyện và tin tức về giới trẻ, lao động di cư, chủ nghĩa dân tộc, môi trường."
  ms: "Membincangkan idea lebih besar dalam bahasa Indonesia melalui cerita dan berita tentang belia, pekerja migran dan alam sekitar."
  id: "Membahas gagasan lebih besar dalam bahasa Indonesia lewat cerpen dan berita tentang anak muda, pekerja migran dan lingkungan."
  hi: "कहानियों और ख़बरों से इंडोनेशियाई में बड़े मुद्दों पर चर्चा: युवा, प्रवासी मज़दूर, राष्ट्रवाद, पर्यावरण।"
outcomes:
  - en: "Discuss social and cultural topics in Indonesian"
    zh: "用印尼语讨论社会和文化话题"
    zh-TW: "用印尼語討論社會和文化話題"
    ja: "社会や文化の話題をインドネシア語で話し合う"
    ko: "사회·문화 주제를 인도네시아어로 토론하기"
    vi: "Thảo luận chủ đề xã hội, văn hóa bằng tiếng Indonesia"
    ms: "Bincangkan topik sosial dan budaya dalam bahasa Indonesia"
    id: "Membahas topik sosial dan budaya dalam bahasa Indonesia"
    hi: "सामाजिक और सांस्कृतिक विषयों पर इंडोनेशियाई में चर्चा करना"
  - en: "Read and write longer Indonesian texts"
    zh: "读写较长的印尼语文章"
    zh-TW: "讀寫較長的印尼語文章"
    ja: "長めのインドネシア語の文章を読み書きする"
    ko: "긴 인도네시아어 글 읽고 쓰기"
    vi: "Đọc và viết văn bản tiếng Indonesia dài hơn"
    ms: "Baca dan tulis teks bahasa Indonesia yang lebih panjang"
    id: "Membaca dan menulis teks bahasa Indonesia yang lebih panjang"
    hi: "लंबे इंडोनेशियाई पाठ पढ़ना-लिखना"
  - en: "Give a clear presentation in Indonesian"
    zh: "用印尼语做清楚的口头报告"
    zh-TW: "用印尼語做清楚的口頭報告"
    ja: "インドネシア語で分かりやすく発表する"
    ko: "인도네시아어로 명확하게 발표하기"
    vi: "Thuyết trình rõ ràng bằng tiếng Indonesia"
    ms: "Buat pembentangan yang jelas dalam bahasa Indonesia"
    id: "Melakukan presentasi yang jelas dalam bahasa Indonesia"
    hi: "इंडोनेशियाई में स्पष्ट प्रस्तुति देना"
