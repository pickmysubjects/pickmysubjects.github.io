code: ABPL90319
year: 2027
learn:
  en: "Geographic Information Systems for planning and design: spatial data, overlay and spatial analysis, and thematic maps."
  zh: "面向规划与设计的地理信息系统：空间数据、叠加与空间分析、专题地图。"
  zh-TW: "面向規劃與設計的地理資訊系統：空間資料、疊加與空間分析、主題地圖。"
  ja: "計画・設計のためのGIS：空間データ、オーバーレイ・空間分析、主題図。"
  ko: "계획·설계를 위한 GIS: 공간 데이터, 중첩·공간 분석, 주제도."
  vi: "GIS cho quy hoạch và thiết kế: dữ liệu không gian, phân tích chồng lớp, phân tích không gian và bản đồ chuyên đề."
  ms: "GIS untuk perancangan dan reka bentuk: data ruang, analisis tindanan dan ruang, serta peta tematik."
  id: "GIS untuk perencanaan dan desain: data spasial, analisis overlay dan spasial, serta peta tematik."
  hi: "योजना व डिज़ाइन के लिए GIS: स्थानिक डेटा, ओवरले व स्थानिक विश्लेषण और थीमैटिक मैप।"
outcomes:
  - en: "Model cities and landscapes spatially"
    zh: "对城市和景观做空间建模"
    zh-TW: "對城市和景觀做空間建模"
    ja: "都市と景観を空間モデル化する"
    ko: "도시와 경관 공간 모델링하기"
    vi: "Mô hình hóa không gian đô thị và cảnh quan"
    ms: "Memodelkan bandar dan landskap secara ruang"
    id: "Memodelkan kota dan lanskap secara spasial"
    hi: "शहरों और लैंडस्केप का स्थानिक मॉडल बनाना"
  - en: "Explain spatial patterns with GIS maps"
    zh: "用GIS地图解读空间格局"
    zh-TW: "用GIS地圖解讀空間格局"
    ja: "GIS地図で空間パターンを説明する"
    ko: "GIS 지도로 공간 패턴 설명하기"
    vi: "Giải thích mô hình không gian bằng bản đồ GIS"
    ms: "Menerangkan corak ruang dengan peta GIS"
    id: "Menjelaskan pola spasial dengan peta GIS"
    hi: "GIS मैप से स्थानिक पैटर्न समझाना"
