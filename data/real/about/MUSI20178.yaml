code: MUSI20178
year: 2026
learn:
  en: "Weekly principal-study lessons building to a 30-minute recital, plus improvisation performances and performance-skills classes."
  zh: "主修乐器课，最终举行30分钟独奏会，另有即兴演奏和表演技能课。"
  zh-TW: "主修樂器課，最終舉行30分鐘獨奏會，另有即興演奏與表演技能課。"
  ja: "主専攻のレッスンで30分のリサイタルを準備し、即興演奏と演奏スキル授業も行う。"
  ko: "전공 실기 레슨으로 30분 리사이틀을 준비하고 즉흥 연주와 연주 기술 수업도 함께."
  vi: "Học nhạc cụ chính hướng tới buổi độc tấu 30 phút, cùng biểu diễn ngẫu hứng và lớp kỹ năng."
  ms: "Pelajaran pengajian utama menuju resital 30 minit, serta persembahan improvisasi dan kelas kemahiran."
  id: "Pelajaran studi utama menuju resital 30 menit, plus pertunjukan improvisasi dan kelas keterampilan."
  hi: "मुख्य वाद्य के पाठ, 30 मिनट का रिसाइटल, साथ में इम्प्रोवाइज़ेशन और प्रदर्शन-कौशल कक्षाएँ।"
outcomes:
  - en: "Give a 30-minute solo recital"
    zh: "举办30分钟独奏会"
    zh-TW: "舉辦30分鐘獨奏會"
    ja: "30分のソロリサイタルを行う"
    ko: "30분 독주회 하기"
    vi: "Biểu diễn độc tấu 30 phút"
    ms: "Beri resital solo 30 minit"
    id: "Membawakan resital solo 30 menit"
    hi: "30 मिनट का एकल रिसाइटल"
  - en: "Improvise confidently in performance"
    zh: "在演出中自信即兴"
    zh-TW: "在演出中自信即興"
    ja: "本番で自信を持って即興する"
    ko: "공연에서 자신 있게 즉흥 연주하기"
    vi: "Ứng tấu tự tin khi biểu diễn"
    ms: "Berimprovisasi dengan yakin"
    id: "Berimprovisasi dengan percaya diri"
    hi: "प्रदर्शन में आत्मविश्वास से इम्प्रोवाइज़ करना"
  - en: "Build professional performance habits"
    zh: "养成专业的演出习惯"
    zh-TW: "養成專業的演出習慣"
    ja: "プロの演奏習慣を身につける"
    ko: "전문 연주 습관 기르기"
    vi: "Rèn thói quen biểu diễn chuyên nghiệp"
    ms: "Bina tabiat persembahan profesional"
    id: "Membangun kebiasaan tampil profesional"
    hi: "पेशेवर प्रदर्शन की आदतें बनाना"
