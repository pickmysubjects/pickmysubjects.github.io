code: MAST90106
year: 2027
learn:
  en: "First half of the Data Science capstone: in teams, review the literature and plan a project on a real problem."
  zh: "数据科学毕业项目上半部分：小组针对实际问题做文献综述和项目规划。"
  zh-TW: "資料科學畢業專題上半：小組針對實際問題做文獻回顧與專案規劃。"
  ja: "データサイエンス修了プロジェクト前半：チームで文献調査と計画を行う。"
  ko: "데이터 과학 캡스톤 전반부: 팀으로 실제 문제의 문헌 조사와 계획 수립."
  vi: "Nửa đầu dự án tốt nghiệp Khoa học Dữ liệu: theo nhóm, tổng quan tài liệu và lập kế hoạch."
  ms: "Separuh pertama projek akhir Sains Data: secara berkumpulan, buat sorotan literatur dan rancangan projek."
  id: "Paruh pertama capstone Sains Data: berkelompok menyusun tinjauan pustaka dan rencana proyek."
  hi: "डेटा साइंस कैपस्टोन का पहला भाग: टीम में साहित्य समीक्षा और प्रोजेक्ट योजना।"
outcomes:
  - en: "Write a literature review for a data science problem"
    zh: "为数据科学问题撰写文献综述"
    zh-TW: "為資料科學問題撰寫文獻回顧"
    ja: "データ科学の課題の文献レビューを書く"
    ko: "데이터 과학 문제의 문헌 검토 쓰기"
    vi: "Viết tổng quan tài liệu cho bài toán dữ liệu"
    ms: "Menulis sorotan literatur untuk masalah sains data"
    id: "Menulis tinjauan pustaka masalah sains data"
    hi: "डेटा साइंस समस्या पर साहित्य समीक्षा लिखना"
  - en: "Plan a team project and log your work"
    zh: "规划团队项目并记录工作"
    zh-TW: "規劃團隊專案並記錄工作"
    ja: "チームの計画を立て作業を記録する"
    ko: "팀 프로젝트 계획과 작업 기록하기"
    vi: "Lập kế hoạch dự án nhóm và ghi nhật ký công việc"
    ms: "Merancang projek pasukan dan merekod kerja"
    id: "Merencanakan proyek tim dan mencatat pekerjaan"
    hi: "टीम प्रोजेक्ट की योजना बनाना और काम का लॉग रखना"
