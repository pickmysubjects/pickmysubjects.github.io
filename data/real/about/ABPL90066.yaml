code: ABPL90066
year: 2027
learn:
  en: "An independent 5,000-word research project on a topic you choose, with regular supervisor meetings."
  zh: "自选题目的独立研究项目，约 5000 字，定期与导师会面。"
  zh-TW: "自選題目的獨立研究專案，約 5000 字，定期與指導老師會面。"
  ja: "自分で選んだテーマの約5000語の個人研究。指導教員と定期面談。"
  ko: "직접 고른 주제로 5,000단어 개인 연구. 지도교수와 정기 면담."
  vi: "Dự án nghiên cứu độc lập 5.000 từ về chủ đề tự chọn, gặp giáo viên hướng dẫn định kỳ."
  ms: "Projek penyelidikan bebas 5,000 patah perkataan atas topik pilihan, dengan penyelia."
  id: "Proyek riset mandiri 5.000 kata dengan topik pilihan, bertemu pembimbing rutin."
  hi: "अपने चुने विषय पर 5,000 शब्दों की स्वतंत्र शोध परियोजना, पर्यवेक्षक के साथ।"
outcomes:
  - en: "Find and evaluate information with suitable research methods"
    zh: "用合适的研究方法查找和评估资料"
    zh-TW: "用合適的研究方法查找與評估資料"
    ja: "適切な研究方法で情報を集め評価する"
    ko: "알맞은 연구 방법으로 정보 찾고 평가하기"
    vi: "Tìm và đánh giá thông tin bằng phương pháp phù hợp"
    ms: "Mencari dan menilai maklumat dengan kaedah sesuai"
    id: "Mencari dan menilai informasi dengan metode tepat"
    hi: "सही शोध विधियों से जानकारी खोजना और आँकना"
  - en: "Write a clear, critical research report"
    zh: "撰写清晰、有批判性的研究报告"
    zh-TW: "撰寫清晰、具批判性的研究報告"
    ja: "明快で批判的な研究報告を書く"
    ko: "명확하고 비판적인 연구 보고서 쓰기"
    vi: "Viết báo cáo nghiên cứu rõ ràng, có phản biện"
    ms: "Menulis laporan penyelidikan yang jelas dan kritis"
    id: "Menulis laporan riset yang jelas dan kritis"
    hi: "स्पष्ट, आलोचनात्मक शोध रिपोर्ट लिखना"
