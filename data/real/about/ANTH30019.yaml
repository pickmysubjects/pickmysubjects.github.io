code: ANTH30019
year: 2026
learn:
  en: "Field research with real innovators on how new tech like robots or apps fits into people's lives, then design-thinking advice."
  zh: "与真实创新团队合作做田野研究，了解机器人、应用等新技术如何融入生活，再用设计思维提出建议。"
  zh-TW: "與真實創新團隊合作做田野研究，了解機器人、應用程式等新技術如何融入生活，再用設計思維提出建議。"
  ja: "実際の革新的な組織と組み、ロボットやアプリなどの新技術が暮らしにどう入るかを調査し、デザイン思考で提案する。"
  ko: "실제 혁신 조직과 함께 로봇·앱 같은 신기술이 삶에 어떻게 자리 잡는지 현장 연구하고 디자인 씽킹으로 제안한다."
  vi: "Nghiên cứu thực địa cùng đơn vị đổi mới thật về cách công nghệ mới như robot, ứng dụng đi vào đời sống, rồi đề xuất bằng tư duy thiết kế."
  ms: "Penyelidikan lapangan bersama inovator sebenar tentang cara teknologi baharu seperti robot atau aplikasi masuk ke kehidupan, lalu cadangan reka bentuk."
  id: "Riset lapangan bersama inovator nyata tentang cara teknologi baru seperti robot atau aplikasi masuk ke hidup orang, lalu saran design thinking."
  hi: "असली इनोवेटर्स के साथ फ़ील्ड रिसर्च कि रोबोट या ऐप जैसी नई तकनीक लोगों की ज़िंदगी में कैसे बैठती है, फिर डिज़ाइन-थिंकिंग सुझाव।"
outcomes:
  - en: "Research how people use new technology"
    zh: "研究人们如何使用新技术"
    zh-TW: "研究人們如何使用新技術"
    ja: "人々が新技術をどう使うか調査する"
    ko: "사람들이 신기술을 쓰는 방식 연구하기"
    vi: "Nghiên cứu cách con người dùng công nghệ mới"
    ms: "Kaji cara orang menggunakan teknologi baharu"
    id: "Meneliti cara orang memakai teknologi baru"
    hi: "लोग नई तकनीक कैसे इस्तेमाल करते हैं, इस पर शोध करना"
  - en: "Weigh the social costs of innovation"
    zh: "权衡创新的社会代价"
    zh-TW: "權衡創新的社會代價"
    ja: "イノベーションの社会的コストを考える"
    ko: "혁신의 사회적 비용 따져보기"
    vi: "Cân nhắc cái giá xã hội của đổi mới"
    ms: "Timbang kos sosial inovasi"
    id: "Menimbang biaya sosial inovasi"
    hi: "नवाचार की सामाजिक कीमत तौलना"
  - en: "Turn findings into design suggestions"
    zh: "把研究发现转化为设计建议"
    zh-TW: "把研究發現轉化為設計建議"
    ja: "調査結果をデザインの提案につなげる"
    ko: "연구 결과를 디자인 제안으로 바꾸기"
    vi: "Biến kết quả nghiên cứu thành đề xuất thiết kế"
    ms: "Jadikan dapatan sebagai cadangan reka bentuk"
    id: "Mengubah temuan menjadi saran desain"
    hi: "निष्कर्षों को डिज़ाइन सुझावों में बदलना"
