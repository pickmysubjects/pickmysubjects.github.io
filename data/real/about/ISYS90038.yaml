code: ISYS90038
year: 2027
learn:
  en: "Aligning IT with business strategy: operating models, IT governance frameworks and planning how IT decisions get made."
  zh: "让 IT 与业务战略保持一致：运营模式、IT 治理框架，以及如何规划 IT 决策。"
  zh-TW: "讓 IT 與業務策略一致：營運模式、IT 治理架構，以及如何規劃 IT 決策。"
  ja: "ITを事業戦略に合わせる：オペレーティングモデル、ITガバナンスの枠組み、IT意思決定の設計。"
  ko: "IT를 사업 전략에 맞추기: 운영 모델, IT 거버넌스 체계, IT 의사결정 방식 설계."
  vi: "Gắn IT với chiến lược kinh doanh: mô hình vận hành, khung quản trị IT và cách ra quyết định về IT."
  ms: "Menyelaraskan IT dengan strategi perniagaan: model operasi, rangka tadbir urus IT dan cara keputusan IT dibuat."
  id: "Menyelaraskan TI dengan strategi bisnis: model operasi, kerangka tata kelola TI, dan cara keputusan TI dibuat."
  hi: "IT को व्यावसायिक रणनीति से जोड़ना: ऑपरेटिंग मॉडल, IT गवर्नेंस फ़्रेमवर्क और IT फ़ैसले कैसे हों।"
outcomes:
  - en: "Analyse an organisation's operating model"
    zh: "分析一个组织的运营模式"
    zh-TW: "分析組織的營運模式"
    ja: "組織のオペレーティングモデルを分析する"
    ko: "조직의 운영 모델 분석하기"
    vi: "Phân tích mô hình vận hành của một tổ chức"
    ms: "Menganalisis model operasi sesebuah organisasi"
    id: "Menganalisis model operasi suatu organisasi"
    hi: "किसी संगठन के ऑपरेटिंग मॉडल का विश्लेषण करना"
  - en: "Draft an IT strategy and governance plan"
    zh: "起草 IT 战略与治理计划"
    zh-TW: "擬定 IT 策略與治理計畫"
    ja: "IT戦略とガバナンス計画を作成する"
    ko: "IT 전략·거버넌스 계획 작성하기"
    vi: "Soạn kế hoạch chiến lược và quản trị IT"
    ms: "Merangka pelan strategi dan tadbir urus IT"
    id: "Menyusun rencana strategi dan tata kelola TI"
    hi: "IT रणनीति और गवर्नेंस योजना का मसौदा बनाना"
