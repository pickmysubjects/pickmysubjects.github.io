code: AIND20011
year: 2026
learn:
  en: "A fully online subject on First Nations art in south-east Australia and how artists have shaped the nation's politics."
  zh: "全在线课程：澳大利亚东南部的原住民艺术，以及艺术家如何影响国家政治。"
  zh-TW: "全線上課程：澳洲東南部的原住民藝術，以及藝術家如何影響國家政治。"
  ja: "完全オンライン科目。オーストラリア南東部の先住民アートと、アーティストが国の政治をどう動かしたかを学ぶ。"
  ko: "완전 온라인 과목: 호주 남동부 원주민 예술과 예술가들이 국가 정치에 끼친 영향을 배운다."
  vi: "Môn học hoàn toàn trực tuyến về nghệ thuật Thổ dân ở đông nam Úc và cách nghệ sĩ định hình chính trị quốc gia."
  ms: "Subjek dalam talian sepenuhnya tentang seni Orang Asal di tenggara Australia dan cara artis membentuk politik negara."
  id: "Mata kuliah daring penuh tentang seni First Nations di tenggara Australia dan cara seniman membentuk politik negara."
  hi: "पूरी तरह ऑनलाइन विषय: दक्षिण-पूर्व ऑस्ट्रेलिया की फ़र्स्ट नेशंस कला और कलाकारों ने देश की राजनीति को कैसे गढ़ा।"
outcomes:
  - en: "Describe Indigenous art practices in the south-east"
    zh: "描述东南部的原住民艺术实践"
    zh-TW: "描述東南部的原住民藝術實踐"
    ja: "南東部の先住民アートの実践を説明する"
    ko: "남동부 원주민 예술 활동 설명하기"
    vi: "Mô tả các thực hành nghệ thuật bản địa ở đông nam Úc"
    ms: "Huraikan amalan seni Orang Asal di tenggara"
    id: "Mendeskripsikan praktik seni adat di wilayah tenggara"
    hi: "दक्षिण-पूर्व में मूलनिवासी कला प्रथाओं का वर्णन करना"
  - en: "Explain art's role in Indigenous politics"
    zh: "解释艺术在原住民政治中的作用"
    zh-TW: "解釋藝術在原住民政治中的作用"
    ja: "先住民の政治における芸術の役割を説明する"
    ko: "원주민 정치에서 예술의 역할 설명하기"
    vi: "Giải thích vai trò của nghệ thuật trong chính trị bản địa"
    ms: "Terangkan peranan seni dalam politik Orang Asal"
    id: "Menjelaskan peran seni dalam politik masyarakat adat"
    hi: "मूलनिवासी राजनीति में कला की भूमिका समझाना"
  - en: "Reflect on your own position and privilege"
    zh: "反思自己的立场与特权"
    zh-TW: "反思自己的立場與特權"
    ja: "自分の立場と特権を振り返る"
    ko: "자신의 위치와 특권 성찰하기"
    vi: "Suy ngẫm về vị trí và đặc quyền của bản thân"
    ms: "Renungkan kedudukan dan keistimewaan diri"
    id: "Merefleksikan posisi dan privilese diri"
    hi: "अपनी स्थिति और विशेषाधिकार पर विचार करना"
