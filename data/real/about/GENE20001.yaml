code: GENE20001
year: 2026
learn:
  en: "What a genome is, how genes are expressed and passed on, and why individuals differ genetically."
  zh: "基因组是什么、基因怎么表达和遗传、个体为什么有差异。"
  zh-TW: "基因體是什麼、基因怎麼表現和遺傳、個體為什麼有差異。"
  ja: "ゲノムとは何か、遺伝子の発現と遺伝の仕組み、個体間の遺伝的な違いの理由。"
  ko: "유전체란 무엇인지, 유전자가 어떻게 발현·전달되는지, 개체 간 유전적 차이의 이유."
  vi: "Bộ gen là gì, gen biểu hiện và di truyền ra sao, vì sao các cá thể khác nhau về di truyền."
  ms: "Apa itu genom, cara gen diekspres dan diwarisi, dan kenapa individu berbeza secara genetik."
  id: "Apa itu genom, bagaimana gen diekspresikan dan diwariskan, dan kenapa individu berbeda secara genetik."
  hi: "जीनोम क्या है, जीन कैसे व्यक्त और आगे पहुँचते हैं, और लोग आनुवंशिक रूप से अलग क्यों होते हैं।"
outcomes:
  - en: "Explain how genes affect an organism's traits"
    zh: "解释基因如何影响性状"
    zh-TW: "解釋基因如何影響性狀"
    ja: "遺伝子が生物の形質に与える影響を説明する"
    ko: "유전자가 생물의 형질에 미치는 영향 설명"
    vi: "Giải thích gen ảnh hưởng tính trạng sinh vật ra sao"
    ms: "Terangkan cara gen mempengaruhi ciri organisma"
    id: "Menjelaskan pengaruh gen pada sifat organisme"
    hi: "जीन किसी जीव के लक्षणों को कैसे प्रभावित करते हैं"
  - en: "Describe how genetic variation is passed on"
    zh: "描述遗传变异怎么传下去"
    zh-TW: "描述遺傳變異怎麼傳下去"
    ja: "遺伝的変異が受け継がれる仕組みを説明する"
    ko: "유전 변이가 전달되는 방식 설명"
    vi: "Mô tả biến dị di truyền được truyền lại ra sao"
    ms: "Huraikan cara variasi genetik diwarisi"
    id: "Menjelaskan cara variasi genetik diwariskan"
    hi: "आनुवंशिक विविधता आगे कैसे पहुँचती है, बताना"
  - en: "Analyse data from genetics experiments"
    zh: "分析遗传学实验数据"
    zh-TW: "分析遺傳學實驗資料"
    ja: "遺伝学実験のデータを分析する"
    ko: "유전학 실험 데이터 분석"
    vi: "Phân tích dữ liệu thí nghiệm di truyền"
    ms: "Analisis data eksperimen genetik"
    id: "Menganalisis data eksperimen genetika"
    hi: "जेनेटिक्स प्रयोगों के डेटा का विश्लेषण"
