code: COMP90059
year: 2026
learn:
  en: "A beginner's first programming subject: solving simple problems in code, with a focus on handling and plotting data."
  zh: "零基础编程入门：用代码解决简单问题，重点是处理和可视化数据。"
  zh-TW: "零基礎程式入門：用程式解決簡單問題，重點是處理和視覺化資料。"
  ja: "初心者向けプログラミング入門：簡単な問題をコードで解き、データの処理と可視化を重視。"
  ko: "초보자 첫 프로그래밍 과목: 간단한 문제를 코드로 풀며 데이터 처리와 시각화에 중점."
  vi: "Môn lập trình đầu tiên cho người mới: giải bài toán đơn giản bằng mã, tập trung xử lý và trực quan hóa dữ liệu."
  ms: "Subjek pengaturcaraan pertama untuk pemula: selesaikan masalah mudah dengan kod, fokus pada data dan visualisasi."
  id: "Mata kuliah pemrograman pertama untuk pemula: memecahkan masalah sederhana dengan kode, fokus olah dan visualisasi data."
  hi: "शुरुआती लोगों का पहला प्रोग्रामिंग सब्जेक्ट: कोड से सरल समस्याएँ हल करना, डेटा संभालने व विज़ुअलाइज़ करने पर ज़ोर।"
outcomes:
  - en: "Write and debug small programs from scratch"
    zh: "从零编写和调试小程序"
    zh-TW: "從零撰寫和除錯小程式"
    ja: "小さなプログラムを一から書き、デバッグする"
    ko: "작은 프로그램을 처음부터 작성하고 디버그하기"
    vi: "Tự viết và gỡ lỗi chương trình nhỏ từ đầu"
    ms: "Tulis dan nyahpepijat program kecil dari awal"
    id: "Menulis dan men-debug program kecil dari nol"
    hi: "छोटे प्रोग्राम शुरू से लिखना और डिबग करना"
  - en: "Clean, transform and plot data with code"
    zh: "用代码清理、转换和绘制数据"
    zh-TW: "用程式清理、轉換和繪製資料"
    ja: "コードでデータを整え、変換し、グラフにする"
    ko: "코드로 데이터 정리, 변환, 시각화하기"
    vi: "Làm sạch, biến đổi và vẽ dữ liệu bằng mã"
    ms: "Bersihkan, ubah dan plot data dengan kod"
    id: "Membersihkan, mengubah, dan memplot data dengan kode"
    hi: "कोड से डेटा साफ़ करना, बदलना और प्लॉट करना"
  - en: "Use modules and basic data structures"
    zh: "会用模块和基本数据结构"
    zh-TW: "會用模組和基本資料結構"
    ja: "モジュールと基本的なデータ構造を使う"
    ko: "모듈과 기본 자료구조 사용하기"
    vi: "Dùng module và cấu trúc dữ liệu cơ bản"
    ms: "Guna modul dan struktur data asas"
    id: "Memakai modul dan struktur data dasar"
    hi: "मॉड्यूल और बेसिक डेटा स्ट्रक्चर इस्तेमाल करना"
