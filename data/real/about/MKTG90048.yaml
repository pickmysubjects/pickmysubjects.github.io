code: MKTG90048
year: 2027
learn:
  en: "Marketing between businesses: purchasing, sales, negotiation and value propositions, taught through cases and executives."
  zh: "企业对企业营销：采购、销售、谈判和价值主张，通过案例和业界高管授课。"
  zh-TW: "企業對企業行銷：採購、銷售、談判與價值主張，透過個案與業界高階主管授課。"
  ja: "企業間マーケティング：購買、営業、交渉、価値提案。ケースと企業幹部の話で学ぶ。"
  ko: "기업 간 마케팅: 구매, 영업, 협상, 가치 제안을 사례와 업계 임원을 통해 배운다."
  vi: "Marketing giữa doanh nghiệp: mua hàng, bán hàng, đàm phán, đề xuất giá trị, học qua tình huống và lãnh đạo ngành."
  ms: "Pemasaran antara perniagaan: pembelian, jualan, rundingan dan cadangan nilai, melalui kes dan eksekutif industri."
  id: "Pemasaran antarbisnis: pembelian, penjualan, negosiasi dan proposisi nilai, lewat kasus dan eksekutif industri."
  hi: "कारोबारों के बीच मार्केटिंग: खरीद, बिक्री, बातचीत और वैल्यू प्रपोज़िशन, केस और उद्योग के अधिकारियों के ज़रिए।"
outcomes:
  - en: "Explain how B2B markets work"
    zh: "解释 B2B 市场如何运作"
    zh-TW: "說明 B2B 市場如何運作"
    ja: "B2B市場の仕組みを説明する"
    ko: "B2B 시장 작동 방식 설명하기"
    vi: "Giải thích thị trường B2B vận hành thế nào"
    ms: "Menerangkan cara pasaran B2B berfungsi"
    id: "Menjelaskan cara pasar B2B bekerja"
    hi: "B2B बाज़ार कैसे काम करते हैं, समझाना"
  - en: "Solve B2B problems with relevant models"
    zh: "用相关模型解决 B2B 问题"
    zh-TW: "以相關模型解決 B2B 問題"
    ja: "モデルを使ってB2Bの課題を解く"
    ko: "관련 모델로 B2B 문제 해결하기"
    vi: "Giải quyết vấn đề B2B bằng mô hình phù hợp"
    ms: "Menyelesaikan masalah B2B dengan model berkaitan"
    id: "Menyelesaikan masalah B2B dengan model terkait"
    hi: "उपयुक्त मॉडलों से B2B समस्याएँ सुलझाना"
