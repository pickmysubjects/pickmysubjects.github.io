code: ABPL90011
year: 2027
learn:
  en: "Valuing specialist properties like shopping centres and rural land, advanced financial analysis, and how property lending works."
  zh: "评估购物中心、农地等特殊物业，高级财务分析，以及物业贷款市场如何运作。"
  zh-TW: "評估購物中心、農地等特殊不動產，進階財務分析，以及不動產借貸市場如何運作。"
  ja: "商業施設や農地など特殊物件の評価、高度な財務分析、不動産融資市場の仕組み。"
  ko: "쇼핑센터·농지 등 특수 부동산 평가, 고급 재무 분석, 부동산 대출 시장."
  vi: "Định giá bất động sản đặc thù, phân tích tài chính nâng cao và thị trường cho vay bất động sản."
  ms: "Penilaian hartanah khusus, analisis kewangan lanjutan dan cara pasaran pinjaman hartanah berfungsi."
  id: "Penilaian properti khusus, analisis keuangan lanjutan dan cara pasar kredit properti bekerja."
  hi: "शॉपिंग सेंटर जैसी विशेष संपत्तियों का मूल्यांकन, उन्नत वित्तीय विश्लेषण और संपत्ति ऋण बाज़ार।"
outcomes:
  - en: "Value non-standard property types"
    zh: "评估非常规类型的物业"
    zh-TW: "評估非典型的不動產"
    ja: "特殊な不動産を評価する"
    ko: "비전형 부동산 평가하기"
    vi: "Định giá bất động sản không điển hình"
    ms: "Menilai hartanah bukan konvensional"
    id: "Menilai properti nonkonvensional"
    hi: "गैर-पारंपरिक संपत्तियों का मूल्यांकन"
  - en: "Apply financial analysis to property and lending"
    zh: "把财务分析用于物业和贷款"
    zh-TW: "把財務分析用於不動產與借貸"
    ja: "財務分析を不動産と融資に使う"
    ko: "재무 분석을 부동산·대출에 적용하기"
    vi: "Áp dụng phân tích tài chính vào bất động sản"
    ms: "Menggunakan analisis kewangan untuk hartanah"
    id: "Menerapkan analisis keuangan pada properti"
    hi: "संपत्ति और ऋण पर वित्तीय विश्लेषण लागू करना"
