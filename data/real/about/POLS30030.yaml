code: POLS30030
year: 2026
learn:
  en: "How US politics works: the constitution, president, Congress, courts, parties and elections, plus big debates like polarisation."
  zh: "美国政治如何运作：宪法、总统、国会、法院、政党和选举，以及政治极化等重大争论。"
  zh-TW: "美國政治如何運作：憲法、總統、國會、法院、政黨和選舉，以及政治極化等重大爭論。"
  ja: "アメリカ政治の仕組みを、憲法、大統領、議会、裁判所、政党、選挙から学び、分極化などの大きな論点も考える。"
  ko: "미국 정치가 어떻게 작동하는지 헌법, 대통령, 의회, 법원, 정당, 선거로 배우고 양극화 같은 큰 논쟁도 다룬다."
  vi: "Chính trị Mỹ vận hành ra sao: hiến pháp, tổng thống, Quốc hội, tòa án, đảng phái, bầu cử, cùng các tranh luận lớn như phân cực."
  ms: "Cara politik AS berfungsi: perlembagaan, presiden, Kongres, mahkamah, parti dan pilihan raya, serta perdebatan besar seperti polarisasi."
  id: "Cara kerja politik AS: konstitusi, presiden, Kongres, pengadilan, partai, dan pemilu, serta perdebatan besar seperti polarisasi."
  hi: "अमेरिकी राजनीति कैसे चलती है: संविधान, राष्ट्रपति, कांग्रेस, अदालतें, पार्टियाँ और चुनाव, साथ में ध्रुवीकरण जैसी बड़ी बहसें।"
outcomes:
  - en: "Explain the institutions of the US political system"
    zh: "说明美国政治体制的主要机构"
    zh-TW: "說明美國政治體制的主要機構"
    ja: "アメリカの政治制度の仕組みを説明する"
    ko: "미국 정치 체제의 제도 설명하기"
    vi: "Giải thích các thể chế của hệ thống chính trị Mỹ"
    ms: "Terangkan institusi sistem politik AS"
    id: "Menjelaskan lembaga dalam sistem politik AS"
    hi: "अमेरिकी राजनीतिक व्यवस्था की संस्थाएँ समझाना"
  - en: "Discuss key moments in US political history"
    zh: "讨论美国政治史上的关键时刻"
    zh-TW: "討論美國政治史上的關鍵時刻"
    ja: "アメリカ政治史の重要な出来事を論じる"
    ko: "미국 정치사의 주요 순간 논의하기"
    vi: "Thảo luận các thời điểm then chốt trong lịch sử chính trị Mỹ"
    ms: "Bincangkan detik penting sejarah politik AS"
    id: "Membahas momen penting sejarah politik AS"
    hi: "अमेरिकी राजनीतिक इतिहास के अहम मोड़ों पर चर्चा करना"
  - en: "Analyse current debates such as polarisation"
    zh: "分析政治极化等当下争论"
    zh-TW: "分析政治極化等當下爭論"
    ja: "分極化など今の論争を分析する"
    ko: "양극화 같은 현재 논쟁 분석하기"
    vi: "Phân tích các tranh luận hiện nay như sự phân cực"
    ms: "Analisis perdebatan semasa seperti polarisasi"
    id: "Menganalisis perdebatan terkini seperti polarisasi"
    hi: "ध्रुवीकरण जैसी मौजूदा बहसों का विश्लेषण करना"
