code: SOCI20016
year: 2026
learn:
  en: "How culture such as art, sport, food, music and social media reflects and shapes social values and structures."
  zh: "艺术、体育、饮食、音乐和社交媒体等文化如何反映并塑造社会价值和结构。"
  zh-TW: "藝術、運動、飲食、音樂和社群媒體等文化如何反映並塑造社會價值和結構。"
  ja: "芸術、スポーツ、食、音楽、SNSなどの文化が社会の価値や構造をどう映し、形づくるかを学ぶ。"
  ko: "예술·스포츠·음식·음악·소셜 미디어 같은 문화가 사회의 가치와 구조를 어떻게 반영하고 만드는지 배운다."
  vi: "Văn hóa như nghệ thuật, thể thao, ẩm thực, âm nhạc và mạng xã hội phản ánh và định hình giá trị, cấu trúc xã hội ra sao."
  ms: "Bagaimana budaya seperti seni, sukan, makanan, muzik dan media sosial mencerminkan dan membentuk nilai serta struktur sosial."
  id: "Bagaimana budaya seperti seni, olahraga, makanan, musik dan media sosial mencerminkan dan membentuk nilai serta struktur sosial."
  hi: "कला, खेल, भोजन, संगीत और सोशल मीडिया जैसी संस्कृति सामाजिक मूल्यों और ढांचों को कैसे दिखाती और गढ़ती है।"
outcomes:
  - en: "Explain key ideas in cultural sociology"
    zh: "说明文化社会学的核心概念"
    zh-TW: "說明文化社會學的核心概念"
    ja: "文化社会学の主要な考え方を説明する"
    ko: "문화사회학의 핵심 개념 설명하기"
    vi: "Giải thích các ý tưởng chính của xã hội học văn hóa"
    ms: "Terangkan idea utama sosiologi budaya"
    id: "Menjelaskan gagasan utama sosiologi budaya"
    hi: "सांस्कृतिक समाजशास्त्र के मुख्य विचार समझाना"
  - en: "Analyse an everyday cultural practice sociologically"
    zh: "用社会学视角分析一种日常文化现象"
    zh-TW: "用社會學視角分析一種日常文化現象"
    ja: "身近な文化を社会学的に分析する"
    ko: "일상의 문화 현상을 사회학적으로 분석하기"
    vi: "Phân tích một thực hành văn hóa thường ngày theo góc nhìn xã hội học"
    ms: "Analisis amalan budaya harian secara sosiologi"
    id: "Menganalisis praktik budaya sehari-hari secara sosiologis"
    hi: "किसी रोज़मर्रा की सांस्कृतिक प्रथा का समाजशास्त्रीय विश्लेषण करना"
  - en: "Discuss how culture can reinforce or challenge power"
    zh: "讨论文化如何巩固或挑战权力"
    zh-TW: "討論文化如何鞏固或挑戰權力"
    ja: "文化が権力を支えたり揺さぶったりする仕組みを論じる"
    ko: "문화가 권력을 강화하거나 흔드는 방식 논의하기"
    vi: "Thảo luận văn hóa củng cố hay thách thức quyền lực ra sao"
    ms: "Bincangkan cara budaya mengukuh atau mencabar kuasa"
    id: "Membahas cara budaya memperkuat atau menantang kekuasaan"
    hi: "संस्कृति सत्ता को कैसे मज़बूत या चुनौती देती है, चर्चा करना"
