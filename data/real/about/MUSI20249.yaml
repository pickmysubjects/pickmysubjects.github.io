code: MUSI20249
year: 2027
learn:
  en: "An introduction to conducting: posture, baton technique, gesture and studying scores, with lots of practice in class."
  zh: "指挥入门：姿势、指挥棒技巧、手势和读总谱，课上大量实践。"
  zh-TW: "指揮入門：姿勢、指揮棒技巧、手勢和讀總譜，課堂上大量實作。"
  ja: "指揮の入門：姿勢、指揮棒の技術、ジェスチャー、スコア研究を授業で実践的に学ぶ。"
  ko: "지휘 입문: 자세, 지휘봉 기술, 제스처, 악보 연구를 수업에서 많이 실습."
  vi: "Nhập môn chỉ huy dàn nhạc: tư thế, kỹ thuật đũa chỉ huy, cử chỉ và đọc tổng phổ, thực hành nhiều trên lớp."
  ms: "Pengenalan kepada pemimpin muzik: postur, teknik baton, gerak isyarat dan kajian skor, banyak latihan di kelas."
  id: "Pengantar dirigen: postur, teknik baton, gestur, dan studi partitur, dengan banyak praktik di kelas."
  hi: "कंडक्टिंग का परिचय: मुद्रा, बैटन तकनीक, इशारे और स्कोर अध्ययन, कक्षा में खूब अभ्यास।"
outcomes:
  - en: "Show basic posture, baton and gesture technique"
    zh: "掌握基本姿势、指挥棒和手势技巧"
    zh-TW: "掌握基本姿勢、指揮棒和手勢技巧"
    ja: "基本の姿勢・指揮棒・ジェスチャーを身につける"
    ko: "기본 자세, 지휘봉, 제스처 기술 보여주기"
    vi: "Thể hiện tư thế, kỹ thuật đũa và cử chỉ cơ bản"
    ms: "Tunjukkan teknik asas postur, baton dan isyarat"
    id: "Menunjukkan teknik dasar postur, baton, dan gestur"
    hi: "बुनियादी मुद्रा, बैटन व इशारों की तकनीक दिखाना"
  - en: "Turn score study into clear conducting gestures"
    zh: "把读谱心得转化为清晰的指挥手势"
    zh-TW: "把讀譜心得轉化為清晰的指揮手勢"
    ja: "スコア研究を明確な指揮の動きに変える"
    ko: "악보 분석을 명확한 지휘 동작으로 옮기기"
    vi: "Biến việc phân tích tổng phổ thành cử chỉ chỉ huy rõ ràng"
    ms: "Terjemah kajian skor kepada isyarat pimpinan yang jelas"
    id: "Mengubah analisis partitur menjadi gestur dirigen yang jelas"
    hi: "स्कोर अध्ययन को स्पष्ट कंडक्टिंग इशारों में बदलना"
  - en: "Review your conducting through video and reflection"
    zh: "通过录像和反思评估自己的指挥"
    zh-TW: "透過錄影和反思評估自己的指揮"
    ja: "動画と振り返りで自分の指揮を評価する"
    ko: "영상과 성찰로 자신의 지휘 평가하기"
    vi: "Đánh giá cách chỉ huy của mình qua video và tự nhìn lại"
    ms: "Nilai pimpinan sendiri melalui video dan refleksi"
    id: "Menilai cara memimpin sendiri lewat video dan refleksi"
    hi: "वीडियो और चिंतन से अपनी कंडक्टिंग परखना"
