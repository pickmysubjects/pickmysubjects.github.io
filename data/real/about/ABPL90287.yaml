code: ABPL90287
year: 2027
learn:
  en: "Linking design intent with building materials, systems and codes to produce sustainable, buildable architecture."
  zh: "把设计意图与建筑材料、系统和规范结合，做出可持续、可建造的建筑。"
  zh-TW: "把設計意圖與建築材料、系統和規範結合，做出永續、可建造的建築。"
  ja: "設計意図を材料・システム・法規と結びつけ、持続可能で建てられる建築にする。"
  ko: "설계 의도를 재료, 시스템, 규정과 연결해 지속 가능하고 시공 가능한 건축 만들기."
  vi: "Gắn ý đồ thiết kế với vật liệu, hệ thống và quy chuẩn để tạo kiến trúc bền vững, khả thi."
  ms: "Menghubungkan niat reka bentuk dengan bahan, sistem dan kod untuk seni bina mampan yang boleh dibina."
  id: "Menghubungkan maksud desain dengan material, sistem, dan regulasi untuk arsitektur berkelanjutan yang bisa dibangun."
  hi: "डिज़ाइन उद्देश्य को सामग्री, प्रणालियों और कोड से जोड़कर टिकाऊ, बनने योग्य वास्तुकला।"
outcomes:
  - en: "Apply the National Construction Code in design"
    zh: "在设计中运用国家建筑规范"
    zh-TW: "在設計中運用國家建築規範"
    ja: "設計に国家建設規準を反映する"
    ko: "설계에 국가 건축 법규 적용하기"
    vi: "Áp dụng Quy chuẩn Xây dựng Quốc gia trong thiết kế"
    ms: "Menggunakan Kod Pembinaan Kebangsaan dalam reka bentuk"
    id: "Menerapkan Kode Konstruksi Nasional dalam desain"
    hi: "डिज़ाइन में राष्ट्रीय निर्माण संहिता लागू करना"
  - en: "Communicate with technical drawings and details"
    zh: "用技术图纸和节点详图表达设计"
    zh-TW: "用技術圖紙和節點詳圖表達設計"
    ja: "技術図面と詳細図で伝える"
    ko: "기술 도면과 상세도로 소통하기"
    vi: "Truyền đạt bằng bản vẽ kỹ thuật và chi tiết"
    ms: "Berkomunikasi melalui lukisan teknikal dan perincian"
    id: "Berkomunikasi lewat gambar teknik dan detail"
    hi: "तकनीकी ड्रॉइंग और विवरण से संवाद करना"
