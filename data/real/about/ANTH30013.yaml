code: ANTH30013
year: 2026
learn:
  en: "The Anthropology major capstone: looking back on the discipline through real research projects and a group project."
  zh: "人类学专业的总结课：通过真实研究项目和小组项目回顾这门学科。"
  zh-TW: "人類學主修的總結課：透過真實研究計畫和小組專案回顧這門學科。"
  ja: "人類学専攻のキャップストーン。実際の研究プロジェクトとグループ課題で学問を振り返る。"
  ko: "인류학 전공 캡스톤: 실제 연구 프로젝트와 그룹 과제로 학문을 돌아본다."
  vi: "Môn tổng kết chuyên ngành Nhân học: nhìn lại ngành qua các dự án nghiên cứu thật và một dự án nhóm."
  ms: "Subjek akhir major Antropologi: menilai semula disiplin melalui projek penyelidikan sebenar dan projek berkumpulan."
  id: "Mata kuliah penutup jurusan Antropologi: meninjau disiplin lewat proyek riset nyata dan proyek kelompok."
  hi: "मानवशास्त्र मेजर का कैपस्टोन: असली शोध परियोजनाओं और एक समूह प्रोजेक्ट से इस विषय पर पीछे मुड़कर देखना।"
outcomes:
  - en: "Reflect on what anthropology offers as a discipline"
    zh: "反思人类学作为学科的价值"
    zh-TW: "反思人類學作為學科的價值"
    ja: "学問としての人類学の意義を振り返る"
    ko: "학문으로서 인류학의 가치 성찰하기"
    vi: "Suy ngẫm về giá trị của nhân học như một ngành"
    ms: "Renungkan sumbangan antropologi sebagai disiplin"
    id: "Merefleksikan nilai antropologi sebagai disiplin"
    hi: "एक विषय के रूप में मानवशास्त्र के योगदान पर विचार करना"
  - en: "Show how theory and ethnography shape research"
    zh: "说明理论与民族志如何塑造研究"
    zh-TW: "說明理論與民族誌如何塑造研究"
    ja: "理論と民族誌が研究をどう形づくるか示す"
    ko: "이론과 민족지가 연구를 만드는 방식 보여주기"
    vi: "Chỉ ra cách lý thuyết và dân tộc chí định hình nghiên cứu"
    ms: "Tunjukkan cara teori dan etnografi membentuk penyelidikan"
    id: "Menunjukkan cara teori dan etnografi membentuk riset"
    hi: "सिद्धांत और एथ्नोग्राफी शोध को कैसे आकार देते हैं, दिखाना"
  - en: "Work in a group to analyse a research case"
    zh: "以小组形式分析一个研究案例"
    zh-TW: "以小組形式分析一個研究案例"
    ja: "グループで研究事例を分析する"
    ko: "그룹으로 연구 사례 분석하기"
    vi: "Làm việc nhóm để phân tích một ca nghiên cứu"
    ms: "Bekerja dalam kumpulan untuk menganalisis kes kajian"
    id: "Bekerja dalam kelompok menganalisis kasus riset"
    hi: "समूह में एक शोध केस का विश्लेषण करना"
