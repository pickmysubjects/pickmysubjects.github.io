code: CWRI30015
year: 2026
learn:
  en: "Writing for video games and live performance: you study key works since the 1980s and write scripts of your own."
  zh: "为电子游戏和现场表演写作：研究20世纪80年代以来的重要作品，并创作自己的脚本。"
  zh-TW: "為電玩和現場表演寫作：研究1980年代以來的重要作品，並創作自己的腳本。"
  ja: "ビデオゲームとライブパフォーマンスのための執筆。1980年代以降の重要作を学び、自分の脚本を書く。"
  ko: "비디오 게임과 라이브 공연을 위한 글쓰기. 1980년대 이후 주요 작품을 배우고 직접 대본을 쓴다."
  vi: "Viết cho trò chơi điện tử và biểu diễn trực tiếp: nghiên cứu tác phẩm tiêu biểu từ thập niên 1980 và tự viết kịch bản."
  ms: "Menulis untuk permainan video dan persembahan langsung: mengkaji karya penting sejak 1980-an dan menulis skrip sendiri."
  id: "Menulis untuk gim video dan pertunjukan langsung: mempelajari karya penting sejak 1980-an dan menulis naskah sendiri."
  hi: "वीडियो गेम और लाइव प्रदर्शन के लिए लेखन: 1980 के दशक से अहम कामों का अध्ययन और अपनी स्क्रिप्ट लिखना।"
outcomes:
  - en: "Develop concepts for a game or performance"
    zh: "为游戏或表演构思概念"
    zh-TW: "為遊戲或表演構思概念"
    ja: "ゲームやパフォーマンスの構想を練る"
    ko: "게임이나 공연 콘셉트 개발하기"
    vi: "Phát triển ý tưởng cho trò chơi hoặc buổi diễn"
    ms: "Bangunkan konsep untuk permainan atau persembahan"
    id: "Mengembangkan konsep untuk gim atau pertunjukan"
    hi: "गेम या प्रदर्शन के लिए कॉन्सेप्ट बनाना"
  - en: "Write a monologue and a game or stage script"
    zh: "写一段独白和一份游戏或舞台脚本"
    zh-TW: "寫一段獨白和一份遊戲或舞台腳本"
    ja: "独白とゲームまたは舞台の脚本を書く"
    ko: "독백과 게임 또는 무대 대본 쓰기"
    vi: "Viết một độc thoại và kịch bản trò chơi hoặc sân khấu"
    ms: "Tulis monolog dan skrip permainan atau pentas"
    id: "Menulis monolog dan naskah gim atau panggung"
    hi: "एक एकालाप और गेम या मंच स्क्रिप्ट लिखना"
  - en: "Write a critical essay on interactive writing"
    zh: "就互动写作写一篇评论文章"
    zh-TW: "就互動寫作寫一篇評論文章"
    ja: "インタラクティブな創作について批評エッセイを書く"
    ko: "인터랙티브 글쓰기에 관한 비평 에세이 쓰기"
    vi: "Viết bài luận phê bình về viết tương tác"
    ms: "Tulis esei kritis tentang penulisan interaktif"
    id: "Menulis esai kritis tentang tulisan interaktif"
    hi: "इंटरैक्टिव लेखन पर आलोचनात्मक निबंध लिखना"
