code: MUSI30163
year: 2026
learn:
  en: "Historical performance on period instruments at A415: Baroque style in weekly rehearsals and an end-of-semester concert."
  zh: "用古乐器以A415音高演奏巴洛克作品，每周排练，学期末演出。"
  zh-TW: "用古樂器以A415音高演奏巴洛克作品，每週排練，學期末演出。"
  ja: "ピリオド楽器でA415のバロック様式を毎週練習し、学期末に演奏。"
  ko: "시대 악기로 A415 바로크 양식을 매주 연습하고 학기말 공연."
  vi: "Biểu diễn Baroque trên nhạc cụ cổ (A415), tập hằng tuần, diễn cuối kỳ."
  ms: "Persembahan Barok dengan alat zaman (A415), latihan mingguan dan konsert akhir."
  id: "Musik Barok dengan alat periode (A415), latihan mingguan dan konser akhir."
  hi: "पुराने वाद्यों पर A415 बारोक शैली, साप्ताहिक रिहर्सल और सत्रांत कॉन्सर्ट।"
outcomes:
  - en: "Play in Baroque style on a period instrument"
    zh: "用古乐器以巴洛克风格演奏"
    zh-TW: "用古樂器以巴洛克風格演奏"
    ja: "ピリオド楽器でバロック様式を演奏する"
    ko: "시대 악기로 바로크 양식 연주하기"
    vi: "Chơi phong cách Baroque trên nhạc cụ cổ"
    ms: "Bermain gaya Barok dengan alat zaman"
    id: "Bermain gaya Barok dengan alat periode"
    hi: "पुराने वाद्य पर बारोक शैली में बजाना"
  - en: "Prepare your part for group rehearsals"
    zh: "为合奏排练准备好自己的声部"
    zh-TW: "為合奏排練準備好自己的聲部"
    ja: "合奏練習に向け自分のパートを仕上げる"
    ko: "합주 연습을 위해 파트 준비하기"
    vi: "Chuẩn bị bè của mình cho buổi tập"
    ms: "Sediakan bahagian sendiri untuk latihan"
    id: "Menyiapkan partisi sendiri untuk latihan"
    hi: "समूह रिहर्सल के लिए अपना भाग तैयार करना"
  - en: "Pass an individual part test"
    zh: "通过个人声部测试"
    zh-TW: "通過個人聲部測試"
    ja: "個人パートテストに合格する"
    ko: "개인 파트 테스트 통과하기"
    vi: "Vượt qua bài kiểm tra bè cá nhân"
    ms: "Lulus ujian bahagian individu"
    id: "Lulus tes partisi individu"
    hi: "व्यक्तिगत भाग परीक्षा पास करना"
