code: MIIM30011
year: 2026
learn:
  en: "How bacteria cause disease, how infections are diagnosed, and how antibiotics and resistance work."
  zh: "细菌怎么致病、感染怎么诊断，以及抗生素和耐药性。"
  zh-TW: "細菌怎麼致病、感染怎麼診斷，以及抗生素和抗藥性。"
  ja: "細菌が病気を起こす仕組み、感染の診断、抗生物質と耐性の仕組み。"
  ko: "세균이 병을 일으키는 방식, 감염 진단법, 항생제와 내성의 원리."
  vi: "Vi khuẩn gây bệnh ra sao, chẩn đoán nhiễm trùng thế nào, và kháng sinh, kháng thuốc hoạt động ra sao."
  ms: "Cara bakteria menyebabkan penyakit, cara jangkitan didiagnosis, dan cara antibiotik serta rintangan berfungsi."
  id: "Cara bakteri menyebabkan penyakit, cara infeksi didiagnosis, dan cara kerja antibiotik serta resistansi."
  hi: "बैक्टीरिया बीमारी कैसे करते हैं, संक्रमण का निदान कैसे होता है, और एंटीबायोटिक व प्रतिरोध कैसे काम करते हैं।"
outcomes:
  - en: "Explain how bacteria survive and cause infection"
    zh: "解释细菌怎么存活和致病"
    zh-TW: "解釋細菌怎麼存活和致病"
    ja: "細菌が生き延び感染を起こす仕組みを説明する"
    ko: "세균이 살아남고 감염을 일으키는 방식 설명하기"
    vi: "Giải thích vi khuẩn tồn tại và gây nhiễm trùng ra sao"
    ms: "Menerangkan cara bakteria hidup dan menyebabkan jangkitan"
    id: "Menjelaskan cara bakteri bertahan dan menyebabkan infeksi"
    hi: "बैक्टीरिया कैसे जीवित रहते और संक्रमण करते हैं"
  - en: "Read research papers on disease-causing bacteria"
    zh: "读懂致病细菌的研究论文"
    zh-TW: "讀懂致病細菌的研究論文"
    ja: "病原細菌の研究論文を読む"
    ko: "병원성 세균에 관한 연구 논문 읽기"
    vi: "Đọc bài báo nghiên cứu về vi khuẩn gây bệnh"
    ms: "Membaca kertas penyelidikan tentang bakteria penyebab penyakit"
    id: "Membaca makalah riset tentang bakteri penyebab penyakit"
    hi: "रोग पैदा करने वाले बैक्टीरिया पर रिसर्च पेपर पढ़ना"
  - en: "Propose ways to diagnose, treat or prevent infections"
    zh: "提出诊断、治疗或预防感染的方案"
    zh-TW: "提出診斷、治療或預防感染的方案"
    ja: "感染の診断・治療・予防の方法を提案する"
    ko: "감염의 진단, 치료, 예방 방법 제안하기"
    vi: "Đề xuất cách chẩn đoán, điều trị hoặc phòng nhiễm trùng"
    ms: "Mencadangkan cara mendiagnosis, merawat atau mencegah jangkitan"
    id: "Mengusulkan cara mendiagnosis, mengobati, atau mencegah infeksi"
    hi: "संक्रमण के निदान, इलाज या रोकथाम के तरीके सुझाना"
