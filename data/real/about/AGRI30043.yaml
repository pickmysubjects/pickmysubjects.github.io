code: AGRI30043
year: 2026
learn:
  en: "Economic tools for managing water, land, fisheries and other natural resources, taught as a two-week summer intensive."
  zh: "用经济学工具管理水、土地、渔业等自然资源，两周夏季密集课。"
  zh-TW: "用經濟學工具管理水、土地、漁業等自然資源，兩週夏季密集課。"
  ja: "水・土地・漁業などの資源管理に経済学を使う。夏の2週間集中講義。"
  ko: "물·토지·어업 등 자연자원 관리를 위한 경제학 도구. 여름 2주 집중 과정."
  vi: "Công cụ kinh tế quản lý nước, đất, thủy sản. Học tập trung hai tuần mùa hè."
  ms: "Alat ekonomi untuk mengurus air, tanah dan perikanan. Intensif musim panas dua minggu."
  id: "Alat ekonomi untuk mengelola air, lahan, perikanan. Intensif musim panas dua minggu."
  hi: "पानी, ज़मीन, मछली जैसे संसाधनों के प्रबंधन के आर्थिक औज़ार। दो हफ़्ते का समर इंटेंसिव।"
outcomes:
  - en: "Apply economic models to resource use"
    zh: "用经济模型分析资源利用"
    zh-TW: "用經濟模型分析資源利用"
    ja: "資源利用に経済モデルを当てはめる"
    ko: "자원 이용에 경제 모형 적용하기"
    vi: "Áp dụng mô hình kinh tế cho tài nguyên"
    ms: "Guna model ekonomi pada sumber"
    id: "Menerapkan model ekonomi pada sumber daya"
    hi: "संसाधन उपयोग पर आर्थिक मॉडल लगाना"
  - en: "Assess policies for renewable resources"
    zh: "评估可再生资源的政策"
    zh-TW: "評估可再生資源的政策"
    ja: "再生可能資源の政策を評価する"
    ko: "재생 가능 자원 정책 평가하기"
    vi: "Đánh giá chính sách tài nguyên tái tạo"
    ms: "Nilai dasar sumber boleh diperbaharui"
    id: "Menilai kebijakan sumber daya terbarukan"
    hi: "नवीकरणीय संसाधन नीतियाँ परखना"
  - en: "Weigh costs and benefits over time"
    zh: "权衡长期的成本与收益"
    zh-TW: "權衡長期的成本與效益"
    ja: "時間をまたいで費用と便益を比べる"
    ko: "시간에 걸친 비용·편익 따지기"
    vi: "Cân nhắc chi phí và lợi ích theo thời gian"
    ms: "Timbang kos dan faedah dari masa ke masa"
    id: "Menimbang biaya dan manfaat jangka panjang"
    hi: "समय के साथ लागत और लाभ तौलना"
