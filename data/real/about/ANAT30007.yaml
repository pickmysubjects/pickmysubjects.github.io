code: ANAT30007
year: 2026
learn:
  en: "Anatomy of the back, neck and limbs, how we walk and move, and how artificial joints are designed."
  zh: "背、颈和四肢的解剖，人怎么走路运动，以及人工关节的设计。"
  zh-TW: "背、頸和四肢的解剖，人如何走路運動，以及人工關節的設計。"
  ja: "背中・首・手足の解剖、歩き方や動き方、人工関節の設計。"
  ko: "등·목·팔다리의 해부, 걷고 움직이는 원리, 인공관절 설계."
  vi: "Giải phẫu lưng, cổ và tay chân, cách ta đi lại, vận động và cách thiết kế khớp nhân tạo."
  ms: "Anatomi belakang, leher dan anggota, cara kita berjalan dan bergerak, serta reka bentuk sendi tiruan."
  id: "Anatomi punggung, leher, dan anggota gerak, cara berjalan dan bergerak, serta desain sendi buatan."
  hi: "पीठ, गर्दन और हाथ-पैरों की एनाटॉमी, हम कैसे चलते-हिलते हैं, और कृत्रिम जोड़ कैसे डिज़ाइन होते हैं।"
outcomes:
  - en: "Locate major muscles, joints, nerves and vessels"
    zh: "找出主要肌肉、关节、神经和血管"
    zh-TW: "找出主要肌肉、關節、神經和血管"
    ja: "主な筋・関節・神経・血管の位置を特定する"
    ko: "주요 근육, 관절, 신경, 혈관 찾기"
    vi: "Xác định cơ, khớp, dây thần kinh và mạch máu chính"
    ms: "Kesan otot, sendi, saraf dan salur darah utama"
    id: "Menemukan otot, sendi, saraf, dan pembuluh utama"
    hi: "मुख्य मांसपेशियाँ, जोड़, नसें और वाहिकाएँ ढूँढना"
  - en: "Interpret structures in dissected specimens"
    zh: "看懂解剖标本里的结构"
    zh-TW: "看懂解剖標本裡的結構"
    ja: "解剖標本の構造を読み取る"
    ko: "해부 표본의 구조 해석하기"
    vi: "Hiểu các cấu trúc trên mẫu đã phẫu tích"
    ms: "Tafsir struktur dalam spesimen yang dibedah"
    id: "Menafsirkan struktur pada spesimen bedah"
    hi: "डिसेक्ट किए नमूनों में संरचनाएँ समझना"
  - en: "Describe normal and injured locomotor anatomy"
    zh: "描述正常和受损的运动系统"
    zh-TW: "描述正常和受損的運動系統"
    ja: "正常な運動器と損傷した運動器を説明する"
    ko: "정상 및 손상된 운동계 해부 설명하기"
    vi: "Mô tả hệ vận động bình thường và bị chấn thương"
    ms: "Huraikan anatomi lokomotor normal dan cedera"
    id: "Menjelaskan anatomi gerak normal dan cedera"
    hi: "सामान्य और चोटिल लोकोमोटर एनाटॉमी बताना"
