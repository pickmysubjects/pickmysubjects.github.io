code: PHYC10001
year: 2026
learn:
  en: "Calculus-based physics for strong students: motion, waves and sound, optics, gravity and special relativity."
  zh: "给基础好的学生：力学、波和声、光学、引力和狭义相对论。"
  zh-TW: "給基礎好的學生：力學、波和聲、光學、重力和狹義相對論。"
  ja: "上級者向けの微積分を使う物理：運動、波と音、光学、重力、特殊相対性理論。"
  ko: "실력 있는 학생을 위한 미적분 기반 물리: 운동, 파동과 소리, 광학, 중력, 특수상대성이론."
  vi: "Vật lý dùng giải tích cho SV giỏi: chuyển động, sóng và âm, quang học, hấp dẫn, thuyết tương đối hẹp."
  ms: "Fizik berasaskan kalkulus untuk pelajar cemerlang: gerakan, gelombang dan bunyi, optik, graviti, relativiti khas."
  id: "Fisika berbasis kalkulus untuk mahasiswa kuat: gerak, gelombang dan bunyi, optika, gravitasi, relativitas khusus."
  hi: "मज़बूत छात्रों के लिए कैलकुलस-आधारित फ़िज़िक्स: गति, तरंगें व ध्वनि, ऑप्टिक्स, गुरुत्व, विशेष सापेक्षता।"
outcomes:
  - en: "Solve physics problems using maths"
    zh: "用数学解物理题"
    zh-TW: "用數學解物理題"
    ja: "数学を使って物理の問題を解く"
    ko: "수학으로 물리 문제 풀기"
    vi: "Giải bài vật lý bằng toán"
    ms: "Selesaikan masalah fizik dengan matematik"
    id: "Menyelesaikan soal fisika dengan matematika"
    hi: "मैथ्स से फ़िज़िक्स के सवाल हल करना"
  - en: "Predict what happens in a physical situation"
    zh: "预测一个物理情境的结果"
    zh-TW: "預測一個物理情境的結果"
    ja: "物理的な状況で何が起こるか予測する"
    ko: "물리적 상황에서 일어날 일 예측"
    vi: "Dự đoán điều xảy ra trong một tình huống vật lý"
    ms: "Ramal apa yang berlaku dalam situasi fizikal"
    id: "Memprediksi yang terjadi dalam situasi fisik"
    hi: "किसी भौतिक स्थिति में क्या होगा, अनुमान लगाना"
  - en: "Take measurements in the lab and interpret them"
    zh: "在实验室测量并解读数据"
    zh-TW: "在實驗室測量並解讀數據"
    ja: "実験室で測定し、結果を解釈する"
    ko: "실험실에서 측정하고 해석"
    vi: "Đo đạc trong lab và giải thích kết quả"
    ms: "Buat pengukuran di makmal dan tafsirkannya"
    id: "Melakukan pengukuran di lab dan menafsirkannya"
    hi: "लैब में माप लेना और उन्हें समझना"
