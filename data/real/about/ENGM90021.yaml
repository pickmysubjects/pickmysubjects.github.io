code: ENGM90021
year: 2027
learn:
  en: "An 80–100 hour engineering management internship you source yourself, with logbook, report and oral reflection."
  zh: "自行寻找的80–100小时工程管理实习，需提交日志、报告并进行口头反思。"
  zh-TW: "自行尋找的80–100小時工程管理實習，需提交日誌、報告並進行口頭反思。"
  ja: "自分で探す80〜100時間の工学マネジメント実習。記録簿、レポート、口頭での振り返りがある。"
  ko: "직접 구하는 80~100시간 공학관리 인턴십으로, 업무일지·보고서·구술 성찰이 있음."
  vi: "Thực tập quản lý kỹ thuật 80–100 giờ do bạn tự tìm, kèm nhật ký, báo cáo và phần tự đánh giá vấn đáp."
  ms: "Latihan industri pengurusan kejuruteraan 80–100 jam yang dicari sendiri, dengan buku log, laporan dan refleksi lisan."
  id: "Magang manajemen rekayasa 80–100 jam yang dicari sendiri, dengan logbook, laporan, dan refleksi lisan."
  hi: "स्वयं खोजी गई 80–100 घंटे की इंजीनियरिंग मैनेजमेंट इंटर्नशिप, लॉगबुक, रिपोर्ट और मौखिक चिंतन के साथ।"
outcomes:
  - en: "Apply engineering management and business ideas in a real workplace"
    zh: "在真实职场运用工程管理与商业知识"
    zh-TW: "在真實職場運用工程管理與商業知識"
    ja: "実際の職場で工学マネジメントとビジネスの考え方を使う"
    ko: "실제 직장에서 공학관리와 비즈니스 개념 적용하기"
    vi: "Áp dụng kiến thức quản lý kỹ thuật và kinh doanh tại nơi làm việc thực tế"
    ms: "Mengaplikasi konsep pengurusan kejuruteraan dan perniagaan di tempat kerja sebenar"
    id: "Menerapkan konsep manajemen rekayasa dan bisnis di tempat kerja nyata"
    hi: "वास्तविक कार्यस्थल में इंजीनियरिंग मैनेजमेंट और व्यावसायिक अवधारणाएँ लागू करना"
  - en: "Analyse workplace practice in quality, procurement, safety and risk"
    zh: "分析质量、采购、安全与风险方面的实践"
    zh-TW: "分析品質、採購、安全與風險方面的實務"
    ja: "品質・調達・安全・リスクの職場実務を分析する"
    ko: "품질, 조달, 안전, 위험 관련 현장 실무 분석하기"
    vi: "Phân tích thực tiễn về chất lượng, mua sắm, an toàn và rủi ro"
    ms: "Menganalisis amalan kualiti, perolehan, keselamatan dan risiko"
    id: "Menganalisis praktik mutu, pengadaan, keselamatan, dan risiko"
    hi: "गुणवत्ता, खरीद, सुरक्षा और जोखिम की कार्यप्रथाओं का विश्लेषण"
  - en: "Report what you learned in a logbook, report and oral talk"
    zh: "通过日志、报告和口头陈述总结所学"
    zh-TW: "透過日誌、報告與口頭陳述總結所學"
    ja: "記録簿・レポート・口頭発表で学びを伝える"
    ko: "업무일지, 보고서, 구두 발표로 배운 점 전달하기"
    vi: "Trình bày điều đã học qua nhật ký, báo cáo và phần nói"
    ms: "Melaporkan pembelajaran melalui buku log, laporan dan pembentangan lisan"
    id: "Menyampaikan hasil belajar lewat logbook, laporan, dan presentasi lisan"
    hi: "लॉगबुक, रिपोर्ट और मौखिक प्रस्तुति से सीख बताना"
