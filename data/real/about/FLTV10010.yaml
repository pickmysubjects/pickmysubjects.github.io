code: FLTV10010
year: 2026
learn:
  en: "Online intro to filmmaking from working professionals: directing, writing, shooting, editing, sound and how a crew fits together."
  zh: "由业内人士在线讲授的电影入门：导演、编剧、拍摄、剪辑、声音和剧组分工"
  zh-TW: "由業界人士線上講授的電影入門：導演、編劇、拍攝、剪輯、聲音和劇組分工"
  ja: "現役の映画人によるオンライン映画制作入門。監督、脚本、撮影、編集、音響、スタッフ編成。"
  ko: "현업 영화인이 가르치는 온라인 영화 입문: 연출, 각본, 촬영, 편집, 사운드, 제작진 구성."
  vi: "Nhập môn làm phim trực tuyến do người trong nghề dạy: đạo diễn, biên kịch, quay, dựng, âm thanh, đoàn phim."
  ms: "Pengenalan pembikinan filem dalam talian oleh profesional: arahan, penulisan, rakaman, suntingan, bunyi, kru."
  id: "Pengantar pembuatan film daring dari para profesional: penyutradaraan, penulisan, syuting, penyuntingan, suara."
  hi: "पेशेवरों से ऑनलाइन फ़िल्ममेकिंग परिचय: निर्देशन, लेखन, शूटिंग, एडिटिंग, साउंड और फ़िल्म क्रू का काम।"
outcomes:
  - en: "Name the key creative roles in making a film"
    zh: "说出拍电影中的主要创作岗位"
    zh-TW: "說出拍電影中的主要創作職位"
    ja: "映画制作の主な創作職を説明する"
    ko: "영화 제작의 핵심 창작 역할 알기"
    vi: "Nêu các vai trò sáng tạo chính khi làm phim"
    ms: "Mengenal pasti peranan kreatif utama dalam filem"
    id: "Menyebut peran kreatif utama dalam pembuatan film"
    hi: "फ़िल्म बनाने की मुख्य रचनात्मक भूमिकाएँ पहचानना"
  - en: "Tell a short story in a sequence of images"
    zh: "用一组图像讲一个短故事"
    zh-TW: "用一組圖像講一個短故事"
    ja: "連続した画像で短い物語を語る"
    ko: "연속된 이미지로 짧은 이야기 전달하기"
    vi: "Kể một câu chuyện ngắn bằng chuỗi hình ảnh"
    ms: "Menceritakan kisah pendek melalui siri imej"
    id: "Menceritakan kisah pendek lewat rangkaian gambar"
    hi: "चित्रों के क्रम से एक छोटी कहानी कहना"
  - en: "Write a director's vision for your own film idea"
    zh: "为自己的电影构想写导演阐述"
    zh-TW: "為自己的電影構想寫導演闡述"
    ja: "自分の企画の監督ビジョンを書く"
    ko: "자신의 영화 아이디어에 대한 연출 의도 쓰기"
    vi: "Viết tầm nhìn đạo diễn cho ý tưởng phim của mình"
    ms: "Menulis visi pengarah untuk idea filem sendiri"
    id: "Menulis visi sutradara untuk ide film sendiri"
    hi: "अपने फ़िल्म आइडिया के लिए निर्देशक का विज़न लिखना"
