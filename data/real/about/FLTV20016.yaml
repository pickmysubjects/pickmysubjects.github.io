code: FLTV20016
year: 2026
learn:
  en: "Make a 1-to-3-minute animated short through every production stage, ready for professional screening."
  zh: "经历全部制作阶段，完成一部可公开放映的 1-3 分钟动画短片。"
  zh-TW: "經歷全部製作階段，完成一部可公開放映的 1-3 分鐘動畫短片。"
  ja: "全工程を経て、上映できる1〜3分の短編アニメを作る。"
  ko: "모든 제작 단계를 거쳐 상영 가능한 1~3분 단편 애니메이션을 만든다."
  vi: "Làm phim hoạt hình 1-3 phút qua mọi khâu, sẵn sàng để chiếu chuyên nghiệp."
  ms: "Hasilkan animasi pendek 1-3 minit melalui setiap peringkat, sedia untuk tayangan."
  id: "Membuat animasi pendek 1-3 menit melalui semua tahap, siap diputar profesional."
  hi: "हर चरण से गुज़रकर 1-3 मिनट की एनिमेटेड शॉर्ट बनाना, पेशेवर स्क्रीनिंग के लिए तैयार।"
outcomes:
  - en: "Run an animation from pre- to post-production"
    zh: "主导动画从前期到后期的流程"
    zh-TW: "主導動畫從前期到後期的流程"
    ja: "プリプロからポスプロまで進める"
    ko: "프리부터 포스트까지 애니메이션 진행하기"
    vi: "Điều phối hoạt hình từ tiền kỳ đến hậu kỳ"
    ms: "Urus animasi dari pra hingga pascaproduksi"
    id: "Menjalankan animasi dari pra hingga pascaproduksi"
    hi: "प्री से पोस्ट-प्रोडक्शन तक एनिमेशन चलाना"
  - en: "Report on how the production is going"
    zh: "汇报制作进度"
    zh-TW: "匯報製作進度"
    ja: "制作の進み具合を報告する"
    ko: "제작 진행 상황 보고하기"
    vi: "Báo cáo tiến độ sản xuất"
    ms: "Laporkan kemajuan produksi"
    id: "Melaporkan kemajuan produksi"
    hi: "प्रोडक्शन की प्रगति पर रिपोर्ट"
  - en: "Finish a film ready for exhibition"
    zh: "完成可参展的作品"
    zh-TW: "完成可參展的作品"
    ja: "上映可能な作品を完成させる"
    ko: "상영 가능한 작품 완성하기"
    vi: "Hoàn thiện phim sẵn sàng trình chiếu"
    ms: "Siapkan filem sedia untuk pameran"
    id: "Menyelesaikan film siap tayang"
    hi: "प्रदर्शन-योग्य फ़िल्म पूरी करना"
