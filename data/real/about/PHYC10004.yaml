code: PHYC10004
year: 2026
learn:
  en: "Fluids, electricity and magnetism, quantum and nuclear physics, aimed at science, tech and engineering."
  zh: "流体、电磁、量子和核物理，偏向理工和工程应用。"
  zh-TW: "流體、電磁、量子和核物理，偏向理工和工程應用。"
  ja: "流体、電磁気、量子、原子核物理。理系・技術・工学向け。"
  ko: "유체, 전자기, 양자, 핵물리. 과학·기술·공학 전공 대상."
  vi: "Chất lưu, điện từ, lượng tử và vật lý hạt nhân, hướng tới khoa học, công nghệ, kỹ thuật."
  ms: "Bendalir, elektrik dan magnet, fizik kuantum dan nuklear, untuk sains, teknologi dan kejuruteraan."
  id: "Fluida, listrik dan magnet, fisika kuantum dan nuklir, untuk sains, teknologi, dan teknik."
  hi: "तरल, बिजली-चुंबकत्व, क्वांटम व न्यूक्लियर फ़िज़िक्स, साइंस, टेक और इंजीनियरिंग के लिए।"
outcomes:
  - en: "Apply physics to tech and engineering problems"
    zh: "用物理解决技术和工程问题"
    zh-TW: "用物理解決技術和工程問題"
    ja: "物理を技術や工学の問題に応用する"
    ko: "물리를 기술·공학 문제에 적용"
    vi: "Áp dụng vật lý vào bài toán công nghệ và kỹ thuật"
    ms: "Gunakan fizik pada masalah teknologi dan kejuruteraan"
    id: "Menerapkan fisika pada masalah teknologi dan teknik"
    hi: "फ़िज़िक्स को टेक और इंजीनियरिंग समस्याओं पर लागू करना"
  - en: "Predict what happens in a physical situation"
    zh: "预测一个物理情境的结果"
    zh-TW: "預測一個物理情境的結果"
    ja: "物理的な状況で何が起こるか予測する"
    ko: "물리적 상황에서 일어날 일 예측"
    vi: "Dự đoán điều xảy ra trong một tình huống vật lý"
    ms: "Ramal apa yang berlaku dalam situasi fizikal"
    id: "Memprediksi yang terjadi dalam situasi fisik"
    hi: "किसी भौतिक स्थिति में क्या होगा, अनुमान लगाना"
  - en: "Take measurements in the lab and interpret them"
    zh: "在实验室测量并解读数据"
    zh-TW: "在實驗室測量並解讀數據"
    ja: "実験室で測定し、結果を解釈する"
    ko: "실험실에서 측정하고 해석"
    vi: "Đo đạc trong lab và giải thích kết quả"
    ms: "Buat pengukuran di makmal dan tafsirkannya"
    id: "Melakukan pengukuran di lab dan menafsirkannya"
    hi: "लैब में माप लेना और उन्हें समझना"
