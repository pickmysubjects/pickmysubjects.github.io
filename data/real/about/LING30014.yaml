code: LING30014
year: 2026
learn:
  en: "The sounds, grammar and meaning systems of Australia's Indigenous languages, and what they add to linguistic theory."
  zh: "澳大利亚原住民语言的语音、语法和语义系统，以及它们对语言学理论的贡献。"
  zh-TW: "澳洲原住民語言的語音、語法和語意系統，以及它們對語言學理論的貢獻。"
  ja: "オーストラリア先住民の言語の音・文法・意味の体系と、それが言語学の理論にもたらすものを学ぶ。"
  ko: "호주 원주민 언어의 소리, 문법, 의미 체계와 그것이 언어학 이론에 더하는 것을 배운다."
  vi: "Hệ thống âm, ngữ pháp và ngữ nghĩa của các ngôn ngữ bản địa Úc, và đóng góp của chúng cho lý thuyết ngôn ngữ học."
  ms: "Sistem bunyi, tatabahasa dan makna bahasa Orang Asal Australia, serta sumbangannya kepada teori linguistik."
  id: "Sistem bunyi, tata bahasa, dan makna bahasa-bahasa Pribumi Australia, serta sumbangannya bagi teori linguistik."
  hi: "ऑस्ट्रेलिया की आदिवासी भाषाओं की ध्वनि, व्याकरण और अर्थ प्रणालियाँ, और भाषाविज्ञान के सिद्धांत में उनका योगदान।"
outcomes:
  - en: "Analyse key features of Australian Indigenous languages"
    zh: "分析澳洲原住民语言的主要特征"
    zh-TW: "分析澳洲原住民語言的主要特徵"
    ja: "オーストラリア先住民の言語の主な特徴を分析する"
    ko: "호주 원주민 언어의 핵심 특징 분석하기"
    vi: "Phân tích các đặc điểm chính của ngôn ngữ bản địa Úc"
    ms: "Analisis ciri utama bahasa Orang Asal Australia"
    id: "Menganalisis ciri utama bahasa Pribumi Australia"
    hi: "ऑस्ट्रेलियाई आदिवासी भाषाओं की मुख्य विशेषताओं का विश्लेषण करना"
  - en: "Argue why these languages matter for diversity"
    zh: "论证这些语言对语言多样性为何重要"
    zh-TW: "論證這些語言對語言多樣性為何重要"
    ja: "これらの言語が多様性の理解に重要な理由を論じる"
    ko: "이 언어들이 다양성 이해에 중요한 이유 논증하기"
    vi: "Lập luận vì sao các ngôn ngữ này quan trọng với sự đa dạng"
    ms: "Hujahkan kepentingan bahasa ini bagi kepelbagaian"
    id: "Menguraikan pentingnya bahasa ini bagi keragaman"
    hi: "ये भाषाएँ विविधता के लिए क्यों अहम हैं, तर्क देना"
  - en: "Relate their features to typology and theory"
    zh: "把它们的特征与类型学和理论联系起来"
    zh-TW: "把它們的特徵與類型學和理論連結起來"
    ja: "その特徴を類型論や理論と結びつける"
    ko: "그 특징을 유형론과 이론에 연결하기"
    vi: "Liên hệ đặc điểm của chúng với loại hình học và lý thuyết"
    ms: "Kaitkan cirinya dengan tipologi dan teori"
    id: "Mengaitkan cirinya dengan tipologi dan teori"
    hi: "उनकी विशेषताओं को टाइपोलॉजी और सिद्धांत से जोड़ना"
