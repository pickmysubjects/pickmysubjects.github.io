code: EDUC20083
year: 2026
learn:
  en: "How children make meaning through stories and the arts, and making your own stories for young audiences."
  zh: "儿童如何通过故事和艺术理解世界，并为孩子创作故事。"
  zh-TW: "兒童如何透過故事和藝術理解世界，並為孩子創作故事。"
  ja: "子どもが物語や芸術から意味をつくる仕組みと、子ども向けの物語づくり。"
  ko: "아이들이 이야기와 예술로 의미를 만드는 방식, 그리고 어린 관객을 위한 이야기 만들기."
  vi: "Trẻ em hiểu thế giới qua truyện và nghệ thuật ra sao, và tự sáng tác truyện cho trẻ."
  ms: "Cara kanak-kanak memberi makna melalui cerita dan seni, serta mencipta cerita untuk mereka."
  id: "Cara anak memaknai dunia lewat cerita dan seni, serta membuat cerita sendiri untuk anak."
  hi: "बच्चे कहानियों और कलाओं से अर्थ कैसे बनाते हैं, और बच्चों के लिए अपनी कहानियाँ बनाना।"
outcomes:
  - en: "Explain how children make meaning from texts"
    zh: "解释儿童如何从文本中获得意义"
    zh-TW: "解釋兒童如何從文本中獲得意義"
    ja: "子どもがテキストから意味をつくる過程を説明する"
    ko: "아이들이 텍스트에서 의미를 만드는 방식 설명하기"
    vi: "Giải thích trẻ hiểu ý nghĩa từ văn bản ra sao"
    ms: "Terangkan cara kanak-kanak memahami teks"
    id: "Menjelaskan cara anak memaknai teks"
    hi: "बच्चे पाठों से अर्थ कैसे निकालते हैं, समझाना"
  - en: "Create a visual, sound or written story for an audience"
    zh: "为特定观众创作视觉、声音或文字故事"
    zh-TW: "為特定觀眾創作視覺、聲音或文字故事"
    ja: "特定の観客向けに視覚・音・文字の物語を作る"
    ko: "특정 관객을 위한 시각·소리·글 이야기 만들기"
    vi: "Sáng tác truyện bằng hình, âm thanh hoặc chữ cho khán giả"
    ms: "Cipta cerita visual, bunyi atau tulisan untuk penonton"
    id: "Membuat cerita visual, suara, atau tulisan untuk penonton"
    hi: "किसी दर्शक के लिए दृश्य, ध्वनि या लिखित कहानी बनाना"
  - en: "Reflect on your own creative process"
    zh: "反思自己的创作过程"
    zh-TW: "反思自己的創作過程"
    ja: "自分の創作過程を振り返る"
    ko: "내 창작 과정 성찰하기"
    vi: "Suy ngẫm quá trình sáng tạo của bản thân"
    ms: "Renungkan proses kreatif sendiri"
    id: "Merefleksikan proses kreatif sendiri"
    hi: "अपनी रचनात्मक प्रक्रिया पर विचार करना"
