code: MUSI10207
year: 2026
learn:
  en: "Sing or play Renaissance music in a 12–20 member ensemble, using instruments from the University's collection."
  zh: "在12至20人的合奏团中演唱或演奏文艺复兴音乐，乐器由大学提供。"
  zh-TW: "在12至20人的合奏團中演唱或演奏文藝復興音樂，樂器由大學提供。"
  ja: "12〜20人のアンサンブルでルネサンス音楽を歌い奏でる。楽器は大学の所蔵品を使用。"
  ko: "12~20명 앙상블에서 르네상스 음악을 노래·연주한다. 악기는 대학 소장품 사용."
  vi: "Hát hoặc chơi nhạc Phục Hưng trong nhóm 12–20 người, dùng nhạc cụ của trường."
  ms: "Nyanyi atau main muzik Renaissance dalam ensembel 12–20 orang dengan alat universiti."
  id: "Menyanyi atau memainkan musik Renaisans dalam ansambel 12–20 orang dengan alat milik kampus."
  hi: "12–20 सदस्यों के समूह में रेनेसां संगीत गाना-बजाना, वाद्य यूनिवर्सिटी देती है।"
outcomes:
  - en: "Perform repertoire to concert standard"
    zh: "以音乐会水准演出曲目"
    zh-TW: "以音樂會水準演出曲目"
    ja: "演奏会レベルで曲を演奏する"
    ko: "연주회 수준으로 레퍼토리 공연"
    vi: "Biểu diễn đạt chuẩn hòa nhạc"
    ms: "Persembahkan repertoir tahap konsert"
    id: "Menampilkan repertoar setara konser"
    hi: "कॉन्सर्ट स्तर पर प्रस्तुति देना"
  - en: "Work as a reliable ensemble member"
    zh: "成为可靠的合奏成员"
    zh-TW: "成為可靠的合奏成員"
    ja: "信頼できるアンサンブル員になる"
    ko: "믿을 만한 앙상블 단원 되기"
    vi: "Làm thành viên nhóm đáng tin cậy"
    ms: "Jadi ahli ensembel yang boleh diharap"
    id: "Menjadi anggota ansambel yang andal"
    hi: "भरोसेमंद समूह सदस्य बनना"
  - en: "Know a range of ensemble repertoire"
    zh: "熟悉各类合奏曲目"
    zh-TW: "熟悉各類合奏曲目"
    ja: "幅広いアンサンブル曲を知る"
    ko: "다양한 앙상블 레퍼토리 알기"
    vi: "Hiểu nhiều tiết mục hòa tấu"
    ms: "Kenal pelbagai repertoir ensembel"
    id: "Mengenal beragam repertoar ansambel"
    hi: "कई तरह की समूह रचनाएँ जानना"
