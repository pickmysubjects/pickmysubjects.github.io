code: CHEN30015
year: 2026
learn:
  en: "Open-ended process engineering case studies on safety and sustainability, ending in a team plant design project."
  zh: "围绕安全与可持续的开放式化工案例，最后完成团队工厂设计项目。"
  zh-TW: "圍繞安全與永續的開放式化工案例，最後完成團隊工廠設計專題。"
  ja: "安全と持続可能性に関する化工ケーススタディと、最後はチームでのプラント設計。"
  ko: "안전·지속가능성 중심의 공정 사례 연구, 마지막은 팀 단위 플랜트 설계 프로젝트."
  vi: "Tình huống kỹ thuật quy trình mở về an toàn và bền vững, kết thúc bằng dự án nhóm thiết kế nhà máy."
  ms: "Kajian kes kejuruteraan proses tentang keselamatan dan kelestarian, diakhiri projek reka bentuk loji berkumpulan."
  id: "Studi kasus teknik proses soal keselamatan dan keberlanjutan, ditutup proyek tim desain pabrik."
  hi: "सेफ़्टी और सस्टेनेबिलिटी पर प्रोसेस इंजीनियरिंग केस स्टडी, अंत में टीम का प्लांट डिज़ाइन प्रोजेक्ट।"
outcomes:
  - en: "Run HAZOP and QRA safety analyses"
    zh: "进行HAZOP和QRA安全分析"
    zh-TW: "進行HAZOP與QRA安全分析"
    ja: "HAZOPとQRAの安全解析を行う"
    ko: "HAZOP·QRA 안전 분석 수행하기"
    vi: "Thực hiện phân tích an toàn HAZOP và QRA"
    ms: "Menjalankan analisis keselamatan HAZOP dan QRA"
    id: "Melakukan analisis keselamatan HAZOP dan QRA"
    hi: "HAZOP और QRA सेफ़्टी विश्लेषण करना"
  - en: "Lay out a process plant and its P&IDs"
    zh: "布置化工厂及其P&ID"
    zh-TW: "配置化工廠及其P&ID"
    ja: "プラント配置とP&IDを設計する"
    ko: "공정 플랜트와 P&ID 배치하기"
    vi: "Bố trí nhà máy quy trình và P&ID"
    ms: "Merancang susun atur loji dan P&ID"
    id: "Menata tata letak pabrik dan P&ID"
    hi: "प्रोसेस प्लांट और उसके P&ID का लेआउट बनाना"
  - en: "Write an environmental impact assessment"
    zh: "撰写环境影响评估"
    zh-TW: "撰寫環境影響評估"
    ja: "環境影響評価書を作る"
    ko: "환경영향평가서 작성하기"
    vi: "Viết báo cáo đánh giá tác động môi trường"
    ms: "Menulis penilaian kesan alam sekitar"
    id: "Menulis analisis dampak lingkungan"
    hi: "पर्यावरण प्रभाव आकलन लिखना"
