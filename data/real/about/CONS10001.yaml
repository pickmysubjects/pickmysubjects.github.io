code: CONS10001
year: 2026
learn:
  en: "How buildings stand up and perform: loads, beams, columns and trusses, plus concrete, steel, timber and masonry."
  zh: "建筑如何立得住、表现如何：荷载、梁柱桁架，以及混凝土、钢、木与砌体。"
  zh-TW: "建築如何立得住、表現如何：載重、梁柱桁架，以及混凝土、鋼、木與砌體。"
  ja: "建物が立ち性能を保つ仕組み：荷重、梁・柱・トラス、コンクリート・鋼・木・組積。"
  ko: "건물이 서고 성능을 내는 원리: 하중, 보·기둥·트러스, 콘크리트·강철·목재·조적."
  vi: "Công trình đứng vững thế nào: tải trọng, dầm, cột, giàn, cùng bê tông, thép, gỗ và gạch đá."
  ms: "Cara bangunan berdiri dan berfungsi: beban, rasuk, tiang, kekuda, serta konkrit, keluli, kayu dan batu."
  id: "Cara bangunan berdiri dan bekerja: beban, balok, kolom, rangka, serta beton, baja, kayu, dan bata."
  hi: "इमारतें कैसे टिकती हैं: लोड, बीम, कॉलम, ट्रस और कंक्रीट, स्टील, लकड़ी, चिनाई।"
outcomes:
  - en: "Trace how loads move through a structure"
    zh: "追踪荷载在结构中的传递"
    zh-TW: "追蹤載重在結構中的傳遞"
    ja: "構造内の荷重の流れをたどる"
    ko: "구조에서 하중 흐름 추적하기"
    vi: "Lần theo đường truyền tải trọng trong kết cấu"
    ms: "Jejak aliran beban melalui struktur"
    id: "Menelusuri aliran beban dalam struktur"
    hi: "संरचना में लोड कैसे चलता है, समझना"
  - en: "Calculate forces in simple members"
    zh: "计算简单构件的受力"
    zh-TW: "計算簡單構件的受力"
    ja: "簡単な部材の力を計算する"
    ko: "간단한 부재의 힘 계산하기"
    vi: "Tính lực trong các cấu kiện đơn giản"
    ms: "Kira daya dalam anggota mudah"
    id: "Menghitung gaya pada elemen sederhana"
    hi: "सरल हिस्सों में बल की गणना करना"
  - en: "Compare common building materials"
    zh: "比较常见建筑材料"
    zh-TW: "比較常見建築材料"
    ja: "主な建築材料を比較する"
    ko: "주요 건축 재료 비교하기"
    vi: "So sánh các vật liệu xây dựng phổ biến"
    ms: "Banding bahan binaan biasa"
    id: "Membandingkan material bangunan umum"
    hi: "आम निर्माण सामग्रियों की तुलना करना"
