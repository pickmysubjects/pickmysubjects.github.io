code: CLAS10012
year: 2026
learn:
  en: "For students with some Latin: reading a Roman speech, such as one by Cicero, and how oratory worked in Roman politics."
  zh: "适合有拉丁语基础的学生：阅读罗马演说（如西塞罗），了解演说在罗马政治中的作用。"
  zh-TW: "適合有拉丁語基礎的學生：閱讀羅馬演說（如西塞羅），了解演說在羅馬政治中的作用。"
  ja: "ラテン語経験者向け。キケロなどのローマの演説を読み、弁論がローマ政治で果たした役割を知る。"
  ko: "라틴어를 배운 학생용. 키케로 등의 로마 연설을 읽고 웅변이 로마 정치에서 한 역할을 본다."
  vi: "Cho người đã biết Latinh: đọc một bài diễn văn La Mã, như của Cicero, và vai trò hùng biện trong chính trị La Mã."
  ms: "Untuk yang tahu sedikit Latin: membaca ucapan Rom, seperti oleh Cicero, dan peranan pidato dalam politik Rom."
  id: "Untuk yang sudah belajar Latin: membaca pidato Romawi, misalnya karya Cicero, dan peran retorika dalam politik Romawi."
  hi: "थोड़ी लैटिन जानने वालों के लिए: सिसरो जैसे किसी रोमन भाषण का पाठ, और रोमन राजनीति में वक्तृता की भूमिका।"
outcomes:
  - en: "Read original Latin texts with some dictionary help"
    zh: "借助词典阅读拉丁语原文"
    zh-TW: "藉助詞典閱讀拉丁語原文"
    ja: "辞書を使ってラテン語の原典を読む"
    ko: "사전을 활용해 라틴어 원문 읽기"
    vi: "Đọc nguyên bản tiếng Latinh với sự hỗ trợ của từ điển"
    ms: "Baca teks asal bahasa Latin dengan bantuan kamus"
    id: "Membaca teks asli bahasa Latin dengan bantuan kamus"
    hi: "शब्दकोश की मदद से मूल लैटिन पाठ पढ़ना"
  - en: "Analyse complex Latin grammar and sentence structure"
    zh: "分析复杂的拉丁语语法和句子结构"
    zh-TW: "分析複雜的拉丁語文法和句子結構"
    ja: "ラテン語の複雑な文法と構文を分析する"
    ko: "복잡한 라틴어 문법과 문장 구조 분석하기"
    vi: "Phân tích ngữ pháp và cấu trúc câu tiếng Latinh phức tạp"
    ms: "Analisis tatabahasa dan struktur ayat bahasa Latin yang kompleks"
    id: "Menganalisis tata bahasa dan struktur kalimat bahasa Latin yang rumit"
    hi: "जटिल लैटिन व्याकरण और वाक्य-रचना का विश्लेषण करना"
  - en: "Translate and interpret ancient literature"
    zh: "翻译并解读古代文学作品"
    zh-TW: "翻譯並解讀古代文學作品"
    ja: "古代の文学作品を訳し解釈する"
    ko: "고대 문학 작품 번역하고 해석하기"
    vi: "Dịch và diễn giải văn học cổ đại"
    ms: "Terjemah dan tafsir karya sastera kuno"
    id: "Menerjemahkan dan menafsirkan karya sastra kuno"
    hi: "प्राचीन साहित्य का अनुवाद और व्याख्या करना"
