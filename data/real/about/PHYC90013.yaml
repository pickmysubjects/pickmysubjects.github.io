code: PHYC90013
year: 2027
learn:
  en: "Advanced condensed matter physics: imaging matter with electrons and X-rays, and the quantum model of solids."
  zh: "高等凝聚态物理：用电子和 X 射线表征物质，以及固体的量子模型。"
  zh-TW: "進階凝體物理：用電子與 X 光表徵物質，以及固體的量子模型。"
  ja: "上級物性物理：電子線とX線による物質の評価、固体の量子モデル。"
  ko: "고급 응집물질물리: 전자·X선으로 물질 분석, 고체의 양자 모형."
  vi: "Vật lý chất ngưng tụ nâng cao: khảo sát vật chất bằng electron, tia X và mô hình lượng tử của chất rắn."
  ms: "Fizik jirim terkondensasi lanjutan: mencirikan jirim dengan elektron dan sinar-X, serta model kuantum pepejal."
  id: "Fisika materi terkondensasi lanjut: karakterisasi materi dengan elektron dan sinar-X, serta model kuantum zat padat."
  hi: "उन्नत संघनित पदार्थ भौतिकी: इलेक्ट्रॉन व एक्स-रे से पदार्थ का अध्ययन और ठोसों का क्वांटम मॉडल।"
outcomes:
  - en: "Explain how matter is characterised at the atomic scale"
    zh: "解释如何在原子尺度表征物质"
    zh-TW: "解釋如何在原子尺度表徵物質"
    ja: "原子スケールで物質を評価する方法を説明する"
    ko: "원자 규모에서 물질을 분석하는 방법 설명하기"
    vi: "Giải thích cách khảo sát vật chất ở cấp nguyên tử"
    ms: "Menerangkan cara jirim dicirikan pada skala atom"
    id: "Menjelaskan cara karakterisasi materi pada skala atom"
    hi: "परमाणु स्तर पर पदार्थ के अध्ययन का तरीका समझाना"
  - en: "Understand quantum effects in micro- and mesoscopic systems"
    zh: "理解微观和介观系统中的量子效应"
    zh-TW: "理解微觀與介觀系統中的量子效應"
    ja: "ミクロ・メゾスコピック系の量子効果を理解する"
    ko: "미시·중시 시스템의 양자 효과 이해하기"
    vi: "Hiểu hiệu ứng lượng tử trong hệ vi mô và trung mô"
    ms: "Memahami kesan kuantum dalam sistem mikro dan mesoskopik"
    id: "Memahami efek kuantum pada sistem mikro dan mesoskopik"
    hi: "सूक्ष्म और मेसोस्कोपिक प्रणालियों में क्वांटम प्रभाव समझना"
