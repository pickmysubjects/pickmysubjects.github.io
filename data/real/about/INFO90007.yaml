code: INFO90007
year: 2027
learn:
  en: "How computing systems like social networks and crowdsourcing support and shape people's social behaviour."
  zh: "社交网络、众包等计算系统如何支持并影响人们的社会行为。"
  zh-TW: "社群網路、群眾外包等運算系統如何支持並影響人們的社會行為。"
  ja: "SNSやクラウドソーシングなどが人の社会的行動をどう支え、変えるか。"
  ko: "SNS·크라우드소싱 등 컴퓨팅 시스템이 사회적 행동을 어떻게 돕고 바꾸는지."
  vi: "Các hệ thống như mạng xã hội, crowdsourcing hỗ trợ và định hình hành vi xã hội ra sao."
  ms: "Bagaimana sistem seperti rangkaian sosial dan sumber ramai menyokong dan membentuk tingkah laku sosial."
  id: "Bagaimana sistem seperti jejaring sosial dan crowdsourcing mendukung dan membentuk perilaku sosial."
  hi: "सोशल नेटवर्क, क्राउडसोर्सिंग जैसे सिस्टम लोगों के सामाजिक व्यवहार को कैसे आकार देते हैं।"
outcomes:
  - en: "Explain key ideas behind social computing systems"
    zh: "解释社会计算系统的核心概念"
    zh-TW: "解釋社會運算系統的核心概念"
    ja: "ソーシャルコンピューティングの基本概念を説明する"
    ko: "소셜 컴퓨팅 시스템의 핵심 개념 설명하기"
    vi: "Giải thích ý tưởng chính của điện toán xã hội"
    ms: "Menerangkan idea utama sistem pengkomputeran sosial"
    id: "Menjelaskan konsep utama komputasi sosial"
    hi: "सोशल कंप्यूटिंग के मुख्य विचार समझाना"
  - en: "Study how these systems change behaviour and suggest fixes"
    zh: "研究这些系统如何影响行为并提出改进"
    zh-TW: "研究這些系統如何影響行為並提出改進"
    ja: "システムが行動に与える影響を調べ改善を提案する"
    ko: "시스템이 행동에 주는 영향 분석과 개선안 제시"
    vi: "Nghiên cứu tác động đến hành vi và đề xuất cải tiến"
    ms: "Mengkaji kesan sistem ke atas tingkah laku dan cadang penambahbaikan"
    id: "Meneliti dampaknya pada perilaku dan mengusulkan perbaikan"
    hi: "ये सिस्टम व्यवहार कैसे बदलते हैं, जाँचना और सुधार सुझाना"
