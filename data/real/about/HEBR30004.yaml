code: HEBR30004
year: 2026
learn:
  en: "Continues Hebrew 5: harder modern literature, everyday idiom and articles, so you can express complex views in Hebrew."
  zh: "接续希伯来语 5：更难的现代文学、日常习语和文章，用希伯来语表达复杂观点。"
  zh-TW: "接續希伯來語 5：更難的現代文學、日常習語和文章，用希伯來語表達複雜觀點。"
  ja: "ヘブライ語5の続き。より難しい現代文学、口語表現、記事を読み、複雑な考えを表現する。"
  ko: "히브리어 5에 이어 더 어려운 현대 문학, 관용 표현, 기사를 읽고 복잡한 생각을 표현한다."
  vi: "Tiếp nối Hebrew 5: văn học hiện đại khó hơn, thành ngữ và bài báo, để diễn đạt ý phức tạp bằng tiếng Do Thái."
  ms: "Sambungan Hebrew 5: sastera moden lebih sukar, simpulan bahasa dan artikel, untuk meluahkan pandangan kompleks."
  id: "Lanjutan Hebrew 5: sastra modern lebih sulit, idiom dan artikel, agar bisa menyampaikan pandangan rumit dalam bahasa Ibrani."
  hi: "हिब्रू 5 के आगे: कठिन आधुनिक साहित्य, मुहावरे और लेख, ताकि हिब्रू में जटिल विचार रख सकें।"
outcomes:
  - en: "Discuss social and cultural topics in Hebrew"
    zh: "用希伯来语讨论社会和文化话题"
    zh-TW: "用希伯來語討論社會和文化話題"
    ja: "社会や文化の話題をヘブライ語で話し合う"
    ko: "사회·문화 주제를 히브리어로 토론하기"
    vi: "Thảo luận chủ đề xã hội, văn hóa bằng tiếng Do Thái"
    ms: "Bincangkan topik sosial dan budaya dalam bahasa Ibrani"
    id: "Membahas topik sosial dan budaya dalam bahasa Ibrani"
    hi: "सामाजिक और सांस्कृतिक विषयों पर हिब्रू में चर्चा करना"
  - en: "Read and write longer Hebrew texts"
    zh: "读写较长的希伯来语文章"
    zh-TW: "讀寫較長的希伯來語文章"
    ja: "長めのヘブライ語の文章を読み書きする"
    ko: "긴 히브리어 글 읽고 쓰기"
    vi: "Đọc và viết văn bản tiếng Do Thái dài hơn"
    ms: "Baca dan tulis teks bahasa Ibrani yang lebih panjang"
    id: "Membaca dan menulis teks bahasa Ibrani yang lebih panjang"
    hi: "लंबे हिब्रू पाठ पढ़ना-लिखना"
  - en: "Give a clear presentation in Hebrew"
    zh: "用希伯来语做清楚的口头报告"
    zh-TW: "用希伯來語做清楚的口頭報告"
    ja: "ヘブライ語で分かりやすく発表する"
    ko: "히브리어로 명확하게 발표하기"
    vi: "Thuyết trình rõ ràng bằng tiếng Do Thái"
    ms: "Buat pembentangan yang jelas dalam bahasa Ibrani"
    id: "Melakukan presentasi yang jelas dalam bahasa Ibrani"
    hi: "हिब्रू में स्पष्ट प्रस्तुति देना"
