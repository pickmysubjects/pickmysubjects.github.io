code: ECOM90003
year: 2027
learn:
  en: "Microeconometric models for cross-section and panel data, with labour, demand and finance examples in Stata."
  zh: "截面与面板数据的微观计量模型，用 Stata 做劳动、需求和金融案例。"
  zh-TW: "橫斷面與追蹤資料的個體計量模型，用 Stata 做勞動、需求與金融案例。"
  ja: "クロスセクション・パネルデータの計量モデル。労働・需要・金融の例をStataで扱う。"
  ko: "횡단면·패널 자료의 미시계량 모형, Stata로 노동·수요·금융 사례 분석."
  vi: "Mô hình vi lượng cho dữ liệu chéo và dữ liệu bảng, ví dụ lao động, cầu và tài chính bằng Stata."
  ms: "Model mikroekonometrik untuk data keratan rentas dan panel, contoh buruh, permintaan dan kewangan dalam Stata."
  id: "Model mikroekonometrika untuk data cross-section dan panel, contoh tenaga kerja, permintaan, dan keuangan di Stata."
  hi: "क्रॉस-सेक्शन व पैनल डेटा के माइक्रोइकोनोमेट्रिक मॉडल, Stata में श्रम, मांग और वित्त के उदाहरण।"
outcomes:
  - en: "Choose models for cross-section and panel data"
    zh: "为截面和面板数据选择模型"
    zh-TW: "為橫斷面與追蹤資料選擇模型"
    ja: "クロスセクション・パネルのモデルを選ぶ"
    ko: "횡단면·패널 자료 모형 선택하기"
    vi: "Chọn mô hình cho dữ liệu chéo và dữ liệu bảng"
    ms: "Memilih model untuk data keratan rentas dan panel"
    id: "Memilih model untuk data cross-section dan panel"
    hi: "क्रॉस-सेक्शन व पैनल डेटा के लिए मॉडल चुनना"
  - en: "Run and read output in an econometrics package"
    zh: "用计量软件运行并解读结果"
    zh-TW: "用計量軟體執行並解讀結果"
    ja: "計量ソフトで推定し出力を読む"
    ko: "계량 소프트웨어로 분석하고 결과 해석하기"
    vi: "Chạy và đọc kết quả bằng phần mềm kinh tế lượng"
    ms: "Menjalankan dan membaca output perisian ekonometrik"
    id: "Menjalankan dan membaca output perangkat lunak ekonometrika"
    hi: "इकोनोमेट्रिक्स सॉफ़्टवेयर चलाना व आउटपुट पढ़ना"
