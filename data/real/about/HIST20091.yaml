code: HIST20091
year: 2026
learn:
  en: "Australia as a migrant nation: immigration and refugee history, multicultural policy, and the debates around them."
  zh: "作为移民国家的澳大利亚：移民与难民史、多元文化政策及相关争论。"
  zh-TW: "作為移民國家的澳洲：移民與難民史、多元文化政策及相關爭論。"
  ja: "移民国家としてのオーストラリア。移民と難民の歴史、多文化政策とそれをめぐる議論。"
  ko: "이민 국가로서의 호주, 이민과 난민의 역사, 다문화 정책과 그를 둘러싼 논쟁을 다룬다."
  vi: "Úc như một quốc gia di dân: lịch sử nhập cư và tị nạn, chính sách đa văn hóa và các tranh luận xung quanh."
  ms: "Australia sebagai negara migran: sejarah imigresen dan pelarian, dasar pelbagai budaya dan perdebatan berkaitan."
  id: "Australia sebagai negara migran: sejarah imigrasi dan pengungsi, kebijakan multikultural, dan perdebatannya."
  hi: "प्रवासी राष्ट्र के रूप में ऑस्ट्रेलिया: आप्रवासन और शरणार्थी इतिहास, बहुसांस्कृतिक नीति और उन पर बहसें।"
outcomes:
  - en: "Examine key periods and policies in immigration"
    zh: "考察移民史上的关键时期和政策"
    zh-TW: "考察移民史上的關鍵時期和政策"
    ja: "移民史の重要な時期と政策を考察する"
    ko: "이민사의 주요 시기와 정책 살펴보기"
    vi: "Xem xét các giai đoạn và chính sách nhập cư quan trọng"
    ms: "Teliti tempoh dan dasar penting imigresen"
    id: "Mengkaji periode dan kebijakan penting imigrasi"
    hi: "आप्रवासन के अहम दौर और नीतियों की जाँच करना"
  - en: "Analyse documents and voices in migration history"
    zh: "分析移民史中的文献和声音"
    zh-TW: "分析移民史中的文獻和聲音"
    ja: "移民史の文書や当事者の声を分析する"
    ko: "이민사 속 문서와 목소리 분석하기"
    vi: "Phân tích tư liệu và tiếng nói trong lịch sử di cư"
    ms: "Analisis dokumen dan suara dalam sejarah migrasi"
    id: "Menganalisis dokumen dan suara dalam sejarah migrasi"
    hi: "प्रवासन इतिहास के दस्तावेज़ों और आवाज़ों का विश्लेषण करना"
  - en: "Link migration history to today's policy debates"
    zh: "把移民史与当今的政策争论联系起来"
    zh-TW: "把移民史與當今的政策爭論連結起來"
    ja: "移民史を今の政策論議と結びつける"
    ko: "이민사를 오늘날의 정책 논쟁과 연결하기"
    vi: "Liên hệ lịch sử di cư với tranh luận chính sách hiện nay"
    ms: "Kaitkan sejarah migrasi dengan perdebatan dasar hari ini"
    id: "Mengaitkan sejarah migrasi dengan perdebatan kebijakan kini"
    hi: "प्रवासन इतिहास को आज की नीति बहसों से जोड़ना"
