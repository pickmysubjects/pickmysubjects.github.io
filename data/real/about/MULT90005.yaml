code: MULT90005
year: 2027
learn:
  en: "How organisations, communities and Indigenous knowledge holders work together on environmental sustainability."
  zh: "各类机构、社区和原住民知识持有者如何在环境可持续上合作。"
  zh-TW: "各類機構、社區和原住民知識持有者如何在環境永續上合作。"
  ja: "組織・地域・先住民の知の担い手が環境の持続可能性で協働する方法。"
  ko: "기관, 지역사회, 원주민 지식 보유자가 환경 지속가능성을 위해 협력하는 법."
  vi: "Cách tổ chức, cộng đồng và người giữ tri thức bản địa hợp tác vì môi trường bền vững."
  ms: "Cara organisasi, komuniti dan pemegang ilmu Orang Asli bekerjasama untuk kelestarian."
  id: "Cara organisasi, komunitas, dan pemegang pengetahuan Pribumi bekerja sama untuk keberlanjutan."
  hi: "संस्थाएँ, समुदाय और मूल निवासी ज्ञान-धारक पर्यावरणीय स्थिरता पर कैसे साथ काम करते हैं।"
outcomes:
  - en: "Evaluate environmental partnerships"
    zh: "评估环境合作伙伴关系"
    zh-TW: "評估環境合作夥伴關係"
    ja: "環境パートナーシップを評価する"
    ko: "환경 파트너십 평가하기"
    vi: "Đánh giá quan hệ đối tác môi trường"
    ms: "Menilai perkongsian alam sekitar"
    id: "Mengevaluasi kemitraan lingkungan"
    hi: "पर्यावरणीय साझेदारियों का मूल्यांकन"
  - en: "Collaborate on a group project"
    zh: "参与小组合作项目"
    zh-TW: "參與小組合作專案"
    ja: "グループで協働する"
    ko: "팀 프로젝트로 협업하기"
    vi: "Hợp tác trong dự án nhóm"
    ms: "Bekerjasama dalam projek berkumpulan"
    id: "Berkolaborasi dalam proyek kelompok"
    hi: "समूह प्रोजेक्ट में सहयोग"
