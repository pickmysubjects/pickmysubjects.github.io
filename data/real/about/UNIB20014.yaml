code: UNIB20014
year: 2026
learn:
  en: "How diet, health and the planet connect, from nutrition and food safety to food economics and sustainable supply."
  zh: "饮食、健康与地球的关联，从营养、食品安全到食品经济与可持续供应。"
  zh-TW: "飲食、健康與地球的關聯，從營養、食品安全到食品經濟與永續供應。"
  ja: "食・健康・地球のつながりを、栄養や食品安全から食料経済、持続可能な供給まで学ぶ。"
  ko: "식단·건강·지구의 연결을 영양·식품 안전부터 식량 경제와 지속가능한 공급까지 배우기."
  vi: "Mối liên hệ giữa ăn uống, sức khỏe và hành tinh, từ dinh dưỡng, an toàn thực phẩm đến kinh tế lương thực."
  ms: "Kaitan diet, kesihatan dan planet, dari pemakanan dan keselamatan makanan hingga ekonomi makanan."
  id: "Kaitan pola makan, kesehatan, dan planet, dari gizi dan keamanan pangan hingga ekonomi pangan."
  hi: "आहार, स्वास्थ्य और पृथ्वी का संबंध, पोषण और खाद्य सुरक्षा से खाद्य अर्थशास्त्र और टिकाऊ आपूर्ति तक।"
outcomes:
  - en: "Explain links between diet and chronic disease"
    zh: "解释饮食与慢性病的关系"
    zh-TW: "解釋飲食與慢性病的關係"
    ja: "食生活と慢性疾患の関係を説明する"
    ko: "식단과 만성질환의 관계 설명하기"
    vi: "Giải thích liên hệ giữa ăn uống và bệnh mạn tính"
    ms: "Terangkan kaitan diet dan penyakit kronik"
    id: "Menjelaskan kaitan pola makan dan penyakit kronis"
    hi: "आहार और पुरानी बीमारियों का संबंध समझाना"
  - en: "Weigh the trade-offs in feeding the world"
    zh: "权衡养活全球人口时的取舍"
    zh-TW: "權衡養活全球人口時的取捨"
    ja: "世界を養う上でのトレードオフを比べる"
    ko: "세계 식량 공급의 득실 따져보기"
    vi: "Cân nhắc đánh đổi khi nuôi sống thế giới"
    ms: "Timbang keseimbangan dalam memberi makan dunia"
    id: "Menimbang untung-rugi memberi makan dunia"
    hi: "दुनिया को खिलाने में होने वाले समझौते तौलना"
  - en: "Write a short research essay on food"
    zh: "撰写一篇关于食物的研究短文"
    zh-TW: "撰寫一篇關於食物的研究短文"
    ja: "食に関する短い研究エッセイを書く"
    ko: "식품에 관한 짧은 연구 에세이 쓰기"
    vi: "Viết bài luận nghiên cứu ngắn về thực phẩm"
    ms: "Tulis esei kajian pendek tentang makanan"
    id: "Menulis esai riset singkat tentang pangan"
    hi: "भोजन पर एक छोटा शोध निबंध लिखना"
