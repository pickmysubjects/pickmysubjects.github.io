code: PLAN30005
year: 2026
learn:
  en: "Urban planning capstone: plan a precinct-scale site, from site analysis and vision to a structure plan or framework."
  zh: "城市规划毕业设计课：规划一个片区尺度的场地，从场地分析、愿景到结构规划或框架。"
  zh-TW: "都市規劃畢業設計課：規劃一個街區尺度的基地，從基地分析、願景到結構計畫或框架。"
  ja: "都市計画の総仕上げ。地区規模の敷地を、敷地分析とビジョンから構造計画までまとめる。"
  ko: "도시계획 캡스톤. 지구 규모 대지를 대지 분석·비전부터 구조 계획이나 프레임워크까지 계획한다."
  vi: "Môn tốt nghiệp quy hoạch: quy hoạch một khu vực, từ phân tích khu đất, tầm nhìn đến quy hoạch cấu trúc."
  ms: "Kemuncak perancangan bandar: rancang tapak berskala presint, dari analisis tapak dan visi ke pelan struktur."
  id: "Capstone perencanaan kota: merencanakan kawasan skala distrik, dari analisis tapak dan visi hingga rencana struktur."
  hi: "शहरी योजना कैपस्टोन: एक प्रिसिंक्ट-स्तर की साइट की योजना, साइट विश्लेषण और विज़न से स्ट्रक्चर प्लान तक।"
outcomes:
  - en: "Analyse a real urban site and its constraints"
    zh: "分析真实城市场地及其限制"
    zh-TW: "分析真實都市基地及其限制"
    ja: "実在の都市敷地と制約を分析する"
    ko: "실제 도시 대지와 제약 분석하기"
    vi: "Phân tích khu đất đô thị thật và các ràng buộc"
    ms: "Analisis tapak bandar sebenar dan kekangannya"
    id: "Menganalisis tapak kota nyata dan kendalanya"
    hi: "असली शहरी साइट और उसकी सीमाएँ समझना"
  - en: "Prepare a precinct structure plan"
    zh: "编制片区结构规划"
    zh-TW: "編制街區結構計畫"
    ja: "地区の構造計画をつくる"
    ko: "지구 구조 계획 작성하기"
    vi: "Lập quy hoạch cấu trúc cho khu vực"
    ms: "Sediakan pelan struktur presint"
    id: "Menyusun rencana struktur kawasan"
    hi: "प्रिसिंक्ट स्ट्रक्चर प्लान तैयार करना"
  - en: "Present plans clearly in talks, visuals and writing"
    zh: "通过汇报、图像和文字清楚展示规划"
    zh-TW: "透過簡報、圖像和文字清楚展示規劃"
    ja: "発表・ビジュアル・文章で計画を伝える"
    ko: "발표·시각자료·글로 계획 명확히 전달하기"
    vi: "Trình bày quy hoạch rõ ràng bằng lời, hình, chữ"
    ms: "Bentang pelan dengan jelas secara lisan, visual, bertulis"
    id: "Menyajikan rencana lewat presentasi, visual, tulisan"
    hi: "बोलकर, चित्रों और लेखन से योजना स्पष्ट दिखाना"
