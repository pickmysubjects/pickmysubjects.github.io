code: ARCH30004
year: 2026
learn:
  en: "Sustainable design for houses and apartments, checked with NatHERS and other tools the housing industry uses."
  zh: "住宅与公寓的可持续设计，并用NatHERS等行业工具评估。"
  zh-TW: "住宅與公寓的永續設計，並用NatHERS等產業工具評估。"
  ja: "戸建てや集合住宅のサステナブル設計を、NatHERSなど業界のツールで評価する。"
  ko: "단독주택과 아파트의 지속가능 설계를 NatHERS 등 업계 도구로 평가한다."
  vi: "Thiết kế bền vững cho nhà ở và căn hộ, đánh giá bằng NatHERS và công cụ ngành."
  ms: "Reka bentuk lestari untuk rumah dan pangsapuri, dinilai dengan NatHERS dan alat industri."
  id: "Desain berkelanjutan untuk rumah dan apartemen, dinilai dengan NatHERS dan alat industri."
  hi: "घरों और अपार्टमेंट का टिकाऊ डिज़ाइन, NatHERS जैसे उद्योग टूल से जाँच।"
outcomes:
  - en: "Assess energy, water and comfort in housing"
    zh: "评估住宅的能耗、用水与舒适度"
    zh-TW: "評估住宅的能耗、用水與舒適度"
    ja: "住宅のエネルギー・水・快適性を評価する"
    ko: "주택의 에너지·물·쾌적성 평가하기"
    vi: "Đánh giá năng lượng, nước, tiện nghi nhà ở"
    ms: "Nilai tenaga, air dan keselesaan perumahan"
    id: "Menilai energi, air dan kenyamanan hunian"
    hi: "आवास में ऊर्जा, पानी और आराम का आकलन"
  - en: "Use NatHERS and other housing rating tools"
    zh: "使用NatHERS等住宅评级工具"
    zh-TW: "使用NatHERS等住宅評級工具"
    ja: "NatHERSなど住宅評価ツールを使う"
    ko: "NatHERS 등 주택 평가 도구 사용하기"
    vi: "Dùng NatHERS và công cụ đánh giá nhà ở"
    ms: "Guna NatHERS dan alat penarafan perumahan"
    id: "Memakai NatHERS dan alat penilaian hunian"
    hi: "NatHERS जैसे आवास रेटिंग टूल इस्तेमाल करना"
  - en: "Improve a home design to perform better"
    zh: "改进住宅设计以提升性能"
    zh-TW: "改進住宅設計以提升性能"
    ja: "住宅設計の性能を高める"
    ko: "주택 설계 성능 개선하기"
    vi: "Cải thiện thiết kế nhà cho hiệu quả hơn"
    ms: "Tambah baik prestasi reka bentuk rumah"
    id: "Meningkatkan kinerja desain rumah"
    hi: "घर के डिज़ाइन का प्रदर्शन बेहतर करना"
