code: NEUR30010
year: 2027
learn:
  en: "Explore big discoveries and debates in neuroscience and create an exhibit that explains them to the public."
  zh: "探索神经科学中的重大发现和争议，并制作展品向公众讲解。"
  zh-TW: "探索神經科學中的重大發現和爭議，並製作展品向大眾講解。"
  ja: "神経科学の大きな発見や論争を探り、一般向けに説明する展示物を作る。"
  ko: "신경과학의 주요 발견과 논쟁을 탐구하고 대중에게 설명하는 전시물을 만듦."
  vi: "Tìm hiểu các phát hiện và tranh luận lớn trong thần kinh học, rồi làm một tác phẩm triển lãm giải thích cho công chúng."
  ms: "Teroka penemuan dan perdebatan besar dalam neurosains dan hasilkan bahan pameran untuk menerangkannya kepada umum."
  id: "Menjelajahi penemuan dan perdebatan besar di neurosains lalu membuat karya pameran untuk menjelaskannya ke publik."
  hi: "न्यूरोसाइंस की बड़ी खोजों व बहसों को जानना और जनता को समझाने वाली प्रदर्शनी कृति बनाना।"
outcomes:
  - en: "Design and run a neuroscience communication project"
    zh: "设计并完成一个神经科学传播项目"
    zh-TW: "設計並完成一個神經科學傳播專案"
    ja: "神経科学を伝えるプロジェクトを企画・実行する"
    ko: "신경과학 커뮤니케이션 프로젝트 설계·실행하기"
    vi: "Thiết kế và thực hiện dự án truyền thông thần kinh học"
    ms: "Reka dan laksanakan projek komunikasi neurosains"
    id: "Merancang dan menjalankan proyek komunikasi neurosains"
    hi: "न्यूरोसाइंस संचार प्रोजेक्ट बनाना और चलाना"
  - en: "Explain technical neuroscience to a broad audience"
    zh: "向大众讲清专业的神经科学内容"
    zh-TW: "向大眾講清專業的神經科學內容"
    ja: "専門的な神経科学を幅広い人に伝える"
    ko: "전문적인 신경과학을 일반 대중에게 설명하기"
    vi: "Giải thích kiến thức thần kinh học chuyên sâu cho đại chúng"
    ms: "Terangkan neurosains teknikal kepada khalayak luas"
    id: "Menjelaskan neurosains teknis kepada khalayak luas"
    hi: "तकनीकी न्यूरोसाइंस आम लोगों को समझाना"
  - en: "Document the project from idea to impact"
    zh: "记录项目从构思到成效的全过程"
    zh-TW: "記錄專案從構想到成效的全過程"
    ja: "企画から成果までプロジェクトを記録する"
    ko: "아이디어부터 성과까지 프로젝트 기록하기"
    vi: "Ghi lại dự án từ ý tưởng đến kết quả"
    ms: "Dokumentasikan projek dari idea hingga impak"
    id: "Mendokumentasikan proyek dari ide hingga dampak"
    hi: "विचार से प्रभाव तक प्रोजेक्ट का दस्तावेज़ बनाना"
