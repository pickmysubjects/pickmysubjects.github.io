code: GEOM90045
year: 2027
learn:
  en: "How residential land is subdivided in Victoria, from planning permits to a formal plan of subdivision."
  zh: "维多利亚州住宅用地如何分割，从规划许可到正式的分割图。"
  zh-TW: "維多利亞州住宅用地如何分割，從規劃許可到正式的分割圖。"
  ja: "ビクトリア州での住宅用地の分筆、計画許可から正式な分筆図まで。"
  ko: "빅토리아주 주거용지 분할 과정, 계획 허가부터 공식 분할도까지."
  vi: "Cách chia lô đất ở tại Victoria, từ giấy phép quy hoạch đến bản đồ chia lô chính thức."
  ms: "Cara tanah kediaman dipecah bahagi di Victoria, daripada permit perancangan hingga pelan pecah bahagian rasmi."
  id: "Cara lahan hunian dipecah di Victoria, dari izin perencanaan hingga rencana pemecahan resmi."
  hi: "विक्टोरिया में आवासीय भूमि का उपविभाजन, प्लानिंग परमिट से औपचारिक उपविभाजन योजना तक।"
outcomes:
  - en: "Explain the permit and certification process for a subdivision"
    zh: "解释分割项目的许可与认证流程"
    zh-TW: "解釋分割案的許可與認證流程"
    ja: "分筆の許可・認証手続きを説明する"
    ko: "분할 사업의 허가·인증 절차 설명하기"
    vi: "Giải thích quy trình cấp phép và chứng nhận chia lô"
    ms: "Menerangkan proses permit dan pensijilan pecah bahagian"
    id: "Menjelaskan proses izin dan sertifikasi pemecahan lahan"
    hi: "उपविभाजन की परमिट और प्रमाणन प्रक्रिया समझाना"
  - en: "Design a subdivision that meets planning controls"
    zh: "设计符合规划管控要求的分割方案"
    zh-TW: "設計符合規劃管制要求的分割方案"
    ja: "計画規制に沿った分筆を設計する"
    ko: "계획 규제에 맞는 분할안 설계하기"
    vi: "Thiết kế phương án chia lô đáp ứng quy định quy hoạch"
    ms: "Mereka bentuk pecah bahagian yang mematuhi kawalan perancangan"
    id: "Merancang pemecahan lahan sesuai aturan perencanaan"
    hi: "योजना नियंत्रणों के अनुरूप उपविभाजन डिज़ाइन करना"
  - en: "Prepare a formal plan of subdivision"
    zh: "编制正式的分割图"
    zh-TW: "編製正式的分割圖"
    ja: "正式な分筆図を作成する"
    ko: "공식 분할도 작성하기"
    vi: "Lập bản đồ chia lô chính thức"
    ms: "Menyediakan pelan pecah bahagian rasmi"
    id: "Menyiapkan rencana pemecahan resmi"
    hi: "औपचारिक उपविभाजन योजना तैयार करना"
