code: CHIN30003
year: 2026
learn:
  en: "Reading and analysing Chinese newspapers on politics, world affairs and public debate."
  zh: "阅读和分析中文报纸上的政治、国际事务和公共讨论。"
  zh-TW: "閱讀和分析中文報紙上的政治、國際事務和公共討論。"
  ja: "政治・国際問題・論争を扱う中国語の新聞を読み、分析する。"
  ko: "정치·국제 문제·공론을 다룬 중국어 신문을 읽고 분석한다."
  vi: "Đọc và phân tích báo tiếng Trung về chính trị, thời sự quốc tế và tranh luận công khai."
  ms: "Membaca dan menganalisis akhbar Cina tentang politik, hal ehwal dunia dan perdebatan awam."
  id: "Membaca dan menganalisis koran berbahasa Mandarin tentang politik, urusan dunia dan debat publik."
  hi: "राजनीति, विश्व मामलों और सार्वजनिक बहस पर चीनी अख़बार पढ़ना और उनका विश्लेषण करना।"
outcomes:
  - en: "Read Chinese news reports quickly and accurately"
    zh: "快速准确地阅读中文新闻"
    zh-TW: "快速準確地閱讀中文新聞"
    ja: "中国語のニュースを速く正確に読む"
    ko: "중국어 뉴스를 빠르고 정확하게 읽기"
    vi: "Đọc tin tiếng Trung nhanh và chính xác"
    ms: "Baca berita bahasa Cina dengan cepat dan tepat"
    id: "Membaca berita berbahasa Mandarin dengan cepat dan tepat"
    hi: "चीनी समाचार तेज़ी और सटीकता से पढ़ना"
  - en: "Spot viewpoint and framing in news stories"
    zh: "识别新闻中的立场和框架"
    zh-TW: "辨識新聞中的立場和框架"
    ja: "ニュースの立場や切り取り方を見抜く"
    ko: "뉴스의 관점과 프레임 파악하기"
    vi: "Nhận ra quan điểm và cách đóng khung tin tức"
    ms: "Kenal pasti sudut pandangan dan pembingkaian berita"
    id: "Mengenali sudut pandang dan pembingkaian berita"
    hi: "समाचारों में दृष्टिकोण और प्रस्तुति पहचानना"
  - en: "Write a short analysis of a news topic"
    zh: "就新闻话题写简短分析"
    zh-TW: "就新聞話題寫簡短分析"
    ja: "ニュースの話題について短い分析を書く"
    ko: "뉴스 주제에 대한 짧은 분석 쓰기"
    vi: "Viết phân tích ngắn về một chủ đề thời sự"
    ms: "Tulis analisis ringkas tentang topik berita"
    id: "Menulis analisis singkat tentang topik berita"
    hi: "किसी समाचार विषय पर छोटा विश्लेषण लिखना"
