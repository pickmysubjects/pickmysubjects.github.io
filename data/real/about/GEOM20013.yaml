code: GEOM20013
year: 2026
learn:
  en: "How location data and GIS support planning, disaster response, health and the environment."
  zh: "位置数据和GIS如何用于规划、救灾、卫生和环保。"
  zh-TW: "位置資料與GIS如何用於規劃、救災、衛生和環保。"
  ja: "位置データとGISが都市計画・防災・保健・環境にどう役立つか。"
  ko: "위치 데이터와 GIS가 계획, 재난 대응, 보건, 환경에 쓰이는 방식."
  vi: "Dữ liệu vị trí và GIS hỗ trợ quy hoạch, ứng phó thảm họa, y tế và môi trường."
  ms: "Cara data lokasi dan GIS menyokong perancangan, bencana, kesihatan dan alam sekitar."
  id: "Cara data lokasi dan GIS mendukung perencanaan, bencana, kesehatan, dan lingkungan."
  hi: "लोकेशन डेटा और GIS से प्लानिंग, आपदा राहत, स्वास्थ्य और पर्यावरण में मदद।"
outcomes:
  - en: "Explain the basic principles of GIS"
    zh: "解释GIS的基本原理"
    zh-TW: "解釋GIS的基本原理"
    ja: "GISの基本原理を説明する"
    ko: "GIS의 기본 원리 설명하기"
    vi: "Giải thích nguyên lý cơ bản của GIS"
    ms: "Menerangkan prinsip asas GIS"
    id: "Menjelaskan prinsip dasar GIS"
    hi: "GIS के बुनियादी सिद्धांत समझाना"
  - en: "Do basic spatial analysis in GIS software"
    zh: "用GIS软件做基础空间分析"
    zh-TW: "用GIS軟體做基礎空間分析"
    ja: "GISソフトで基本的な空間分析を行う"
    ko: "GIS 소프트웨어로 기초 공간 분석하기"
    vi: "Phân tích không gian cơ bản bằng phần mềm GIS"
    ms: "Membuat analisis ruang asas dengan perisian GIS"
    id: "Melakukan analisis spasial dasar dengan software GIS"
    hi: "GIS सॉफ़्टवेयर में बेसिक स्पेशियल एनालिसिस करना"
