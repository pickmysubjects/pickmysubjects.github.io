code: PHYS30012
year: 2026
learn:
  en: "How the body adapts to change and challenge across life stages, lifestyles and environments."
  zh: "身体在不同年龄、生活方式和环境下怎么适应变化。"
  zh-TW: "身體在不同年齡、生活方式和環境下怎麼適應變化和挑戰。"
  ja: "人生の段階、生活習慣、環境の違いの中で、体が変化や負荷にどう適応するか。"
  ko: "생애 단계, 생활 방식, 환경에 따라 몸이 변화와 도전에 적응하는 방식."
  vi: "Cơ thể thích nghi với thay đổi và thử thách qua các giai đoạn đời, lối sống và môi trường."
  ms: "Cara badan menyesuaikan diri dengan perubahan dan cabaran merentas peringkat hidup, gaya hidup dan persekitaran."
  id: "Cara tubuh beradaptasi dengan perubahan dan tantangan di berbagai tahap hidup, gaya hidup, dan lingkungan."
  hi: "ज़िंदगी के पड़ावों, जीवनशैली और माहौल में बदलाव व चुनौतियों के प्रति शरीर कैसे ढलता है।"
outcomes:
  - en: "Critically read physiology papers and data"
    zh: "批判性地读生理学论文和数据"
    zh-TW: "批判性地讀生理學論文和數據"
    ja: "生理学の論文とデータを批判的に読む"
    ko: "생리학 논문과 데이터를 비판적으로 읽기"
    vi: "Đọc có phản biện bài báo và dữ liệu sinh lý"
    ms: "Baca kertas dan data fisiologi secara kritis"
    id: "Membaca makalah dan data fisiologi secara kritis"
    hi: "फ़िज़ियोलॉजी पेपर और डेटा आलोचनात्मक ढंग से पढ़ना"
  - en: "Explain physiology to both experts and the public"
    zh: "给专业和非专业的人讲生理学"
    zh-TW: "給專業和非專業的人講生理學"
    ja: "専門家にも一般の人にも生理学を説明する"
    ko: "전문가와 일반인 모두에게 생리학 설명"
    vi: "Giải thích sinh lý cho cả chuyên gia và công chúng"
    ms: "Terangkan fisiologi kepada pakar dan orang awam"
    id: "Menjelaskan fisiologi ke pakar dan masyarakat umum"
    hi: "विशेषज्ञों और आम लोगों दोनों को फ़िज़ियोलॉजी समझाना"
  - en: "Work in a team on a research project"
    zh: "和小组一起做研究项目"
    zh-TW: "和小組一起做研究專題"
    ja: "チームで研究プロジェクトに取り組む"
    ko: "팀으로 연구 프로젝트 수행"
    vi: "Làm dự án nghiên cứu theo nhóm"
    ms: "Bekerja dalam pasukan untuk projek penyelidikan"
    id: "Bekerja dalam tim untuk proyek riset"
    hi: "टीम में रिसर्च प्रोजेक्ट पर काम करना"
