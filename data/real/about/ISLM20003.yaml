code: ISLM20003
year: 2026
learn:
  en: "An introduction to the Qur'an in English: its origins, structure, themes, ways of reading it and its place in Muslim life."
  zh: "以英文译本认识《古兰经》：起源、结构、主题、诠释方式及其在穆斯林生活中的地位。"
  zh-TW: "以英文譯本認識《古蘭經》：起源、結構、主題、詮釋方式及其在穆斯林生活中的地位。"
  ja: "英訳でクルアーンを学ぶ入門。成り立ち、構成、テーマ、解釈の仕方、ムスリムの生活での位置を学ぶ。"
  ko: "영어 번역으로 꾸란을 배우는 입문: 기원, 구조, 주제, 해석 방식, 무슬림 삶에서의 위치를 다룬다."
  vi: "Nhập môn kinh Qur'an qua bản tiếng Anh: nguồn gốc, cấu trúc, chủ đề, cách diễn giải và vị trí trong đời sống Hồi giáo."
  ms: "Pengenalan al-Quran dalam terjemahan Inggeris: asal usul, struktur, tema, cara tafsiran dan tempatnya dalam hidup Muslim."
  id: "Pengantar Al-Qur'an lewat terjemahan Inggris: asal-usul, struktur, tema, cara menafsirkan, dan tempatnya dalam hidup Muslim."
  hi: "अंग्रेज़ी अनुवाद में क़ुरआन का परिचय: उत्पत्ति, संरचना, विषय, व्याख्या के तरीके और मुस्लिम जीवन में इसकी जगह।"
outcomes:
  - en: "Explain the origins and structure of the Qur'an"
    zh: "解释《古兰经》的起源与结构"
    zh-TW: "解釋《古蘭經》的起源與結構"
    ja: "クルアーンの成り立ちと構成を説明する"
    ko: "꾸란의 기원과 구조 설명하기"
    vi: "Giải thích nguồn gốc và cấu trúc kinh Qur'an"
    ms: "Terangkan asal usul dan struktur al-Quran"
    id: "Menjelaskan asal-usul dan struktur Al-Qur'an"
    hi: "क़ुरआन की उत्पत्ति और संरचना समझाना"
  - en: "Compare approaches to interpreting the text"
    zh: "比较不同的经文诠释方法"
    zh-TW: "比較不同的經文詮釋方法"
    ja: "テキスト解釈のアプローチを比べる"
    ko: "경전 해석 방식 비교하기"
    vi: "So sánh các cách diễn giải văn bản"
    ms: "Bandingkan pendekatan mentafsir teks"
    id: "Membandingkan pendekatan penafsiran teks"
    hi: "पाठ की व्याख्या के तरीकों की तुलना करना"
  - en: "Analyse key themes across Meccan and Medinan parts"
    zh: "分析麦加章与麦地那章的主要主题"
    zh-TW: "分析麥加章與麥地那章的主要主題"
    ja: "メッカ期とメディナ期の主なテーマを分析する"
    ko: "메카 시기와 메디나 시기의 주요 주제 분석하기"
    vi: "Phân tích chủ đề chính của phần Mecca và Medina"
    ms: "Analisis tema utama surah Makkiyah dan Madaniyah"
    id: "Menganalisis tema utama surah Makkiyah dan Madaniyah"
    hi: "मक्की और मदनी हिस्सों के मुख्य विषयों का विश्लेषण करना"
