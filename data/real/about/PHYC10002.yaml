code: PHYC10002
year: 2026
learn:
  en: "Calculus-based physics for strong students: fluids, electricity and magnetism, quantum, atomic and nuclear physics."
  zh: "给基础好的学生：流体、电磁、量子、原子和核物理。"
  zh-TW: "給基礎好的學生：流體、電磁、量子、原子和核物理。"
  ja: "上級者向けの微積分を使う物理：流体、電磁気、量子、原子・原子核物理。"
  ko: "실력 있는 학생을 위한 미적분 기반 물리: 유체, 전자기, 양자, 원자·핵물리."
  vi: "Vật lý dùng giải tích cho SV giỏi: chất lưu, điện từ, lượng tử, vật lý nguyên tử và hạt nhân."
  ms: "Fizik berasaskan kalkulus untuk pelajar cemerlang: bendalir, elektrik dan magnet, kuantum, fizik atom dan nuklear."
  id: "Fisika berbasis kalkulus untuk mahasiswa kuat: fluida, listrik dan magnet, kuantum, fisika atom dan nuklir."
  hi: "मज़बूत छात्रों के लिए कैलकुलस-आधारित फ़िज़िक्स: तरल, बिजली-चुंबकत्व, क्वांटम, परमाणु व न्यूक्लियर।"
outcomes:
  - en: "Solve physics problems using calculus"
    zh: "用微积分解物理题"
    zh-TW: "用微積分解物理題"
    ja: "微積分を使って物理の問題を解く"
    ko: "미적분으로 물리 문제 풀기"
    vi: "Giải bài vật lý bằng giải tích"
    ms: "Selesaikan masalah fizik dengan kalkulus"
    id: "Menyelesaikan soal fisika dengan kalkulus"
    hi: "कैलकुलस से फ़िज़िक्स के सवाल हल करना"
  - en: "Predict what happens in a physical situation"
    zh: "预测一个物理情境的结果"
    zh-TW: "預測一個物理情境的結果"
    ja: "物理的な状況で何が起こるか予測する"
    ko: "물리적 상황에서 일어날 일 예측"
    vi: "Dự đoán điều xảy ra trong một tình huống vật lý"
    ms: "Ramal apa yang berlaku dalam situasi fizikal"
    id: "Memprediksi yang terjadi dalam situasi fisik"
    hi: "किसी भौतिक स्थिति में क्या होगा, अनुमान लगाना"
  - en: "Take measurements in the lab and interpret them"
    zh: "在实验室测量并解读数据"
    zh-TW: "在實驗室測量並解讀數據"
    ja: "実験室で測定し、結果を解釈する"
    ko: "실험실에서 측정하고 해석"
    vi: "Đo đạc trong lab và giải thích kết quả"
    ms: "Buat pengukuran di makmal dan tafsirkannya"
    id: "Melakukan pengukuran di lab dan menafsirkannya"
    hi: "लैब में माप लेना और उन्हें समझना"
