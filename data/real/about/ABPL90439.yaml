code: ABPL90439
year: 2027
learn:
  en: "A studio on small buildings resolved in fine material detail, weighing construction and environmental impact."
  zh: "设计课：把小型建筑的材料与构造做到细部，并考虑环境影响。"
  zh-TW: "設計課：把小型建築的材料與構造做到細部，並考慮環境影響。"
  ja: "小さな建物を材料と構法の細部まで詰め、環境への影響も考えるスタジオ。"
  ko: "소규모 건물을 재료·구법 디테일까지 완성하고 환경 영향도 고려하는 스튜디오."
  vi: "Studio thiết kế công trình nhỏ đến từng chi tiết vật liệu, cân nhắc cấu tạo và tác động môi trường."
  ms: "Studio bangunan kecil hingga perincian bahan, menimbang pembinaan dan kesan alam sekitar."
  id: "Studio bangunan kecil hingga detail material, mempertimbangkan konstruksi dan dampak lingkungan."
  hi: "छोटे भवनों को सामग्री के बारीक विवरण तक हल करने वाला स्टूडियो, निर्माण और पर्यावरण प्रभाव के साथ।"
outcomes:
  - en: "Explore material options with drawings, models and prototypes"
    zh: "用图纸、模型和样件推敲材料方案"
    zh-TW: "用圖紙、模型和樣件推敲材料方案"
    ja: "図面・模型・試作で材料案を検討する"
    ko: "도면, 모형, 프로토타입으로 재료 대안 탐구하기"
    vi: "Thử phương án vật liệu bằng bản vẽ, mô hình và mẫu thử"
    ms: "Meneroka pilihan bahan dengan lukisan, model dan prototaip"
    id: "Menjelajahi opsi material lewat gambar, maket, dan prototipe"
    hi: "ड्रॉइंग, मॉडल और प्रोटोटाइप से सामग्री विकल्प खोजना"
  - en: "Resolve a small building to a high level of detail"
    zh: "把小型建筑设计深化到细部"
    zh-TW: "把小型建築設計深化到細部"
    ja: "小さな建物を細部まで設計する"
    ko: "소규모 건물을 상세 수준까지 설계하기"
    vi: "Hoàn thiện công trình nhỏ đến mức chi tiết cao"
    ms: "Menyelesaikan bangunan kecil hingga perincian tinggi"
    id: "Menyelesaikan bangunan kecil hingga detail tinggi"
    hi: "छोटे भवन को उच्च विवरण तक हल करना"
