code: FLTV20021
year: 2026
learn:
  en: "Spend the Melbourne International Film Festival in screenings and industry talks, then write a journal and make a creative response."
  zh: "在墨尔本国际电影节期间观影、听行业讲座，然后写日志并做一份创意回应。"
  zh-TW: "在墨爾本國際影展期間觀影、聽產業講座，然後寫日誌並做一份創意回應。"
  ja: "メルボルン国際映画祭で上映と業界トークに参加し、日誌と創作レスポンスを作る。"
  ko: "멜버른 국제영화제 동안 상영·업계 토크에 참여하고 일지와 창작 응답을 만든다."
  vi: "Dự LHP Quốc tế Melbourne, xem phim, nghe tọa đàm, rồi viết nhật ký và sáng tác."
  ms: "Ikuti Festival Filem Antarabangsa Melbourne, kemudian jurnal dan respons kreatif."
  id: "Mengikuti Festival Film Internasional Melbourne, lalu jurnal dan respons kreatif."
  hi: "मेलबर्न अंतरराष्ट्रीय फ़िल्म फ़ेस्टिवल में स्क्रीनिंग और चर्चाएँ, फिर जर्नल और रचनात्मक जवाब।"
outcomes:
  - en: "Watch and discuss festival films critically"
    zh: "批判性地观看和讨论影片"
    zh-TW: "批判性地觀看與討論影片"
    ja: "映画祭の作品を批評的に見て論じる"
    ko: "영화제 작품을 비판적으로 보고 논하기"
    vi: "Xem và bàn luận phim có phản biện"
    ms: "Tonton dan bincang filem secara kritis"
    id: "Menonton dan membahas film secara kritis"
    hi: "फ़िल्में देखकर आलोचनात्मक चर्चा"
  - en: "Learn how the festival industry works"
    zh: "了解电影节行业的运作"
    zh-TW: "了解影展產業的運作"
    ja: "映画祭の業界の仕組みを知る"
    ko: "영화제 산업 구조 알기"
    vi: "Hiểu cách ngành liên hoan vận hành"
    ms: "Fahami cara industri festival berjalan"
    id: "Memahami cara kerja industri festival"
    hi: "फ़ेस्टिवल उद्योग कैसे चलता है"
  - en: "Make a creative response to what you saw"
    zh: "对所见做出创意回应"
    zh-TW: "對所見做出創意回應"
    ja: "見たものに創作で応える"
    ko: "본 것에 창작으로 응답하기"
    vi: "Sáng tác đáp lại điều đã xem"
    ms: "Hasilkan respons kreatif"
    id: "Membuat respons kreatif"
    hi: "देखी चीज़ों पर रचनात्मक जवाब बनाना"
