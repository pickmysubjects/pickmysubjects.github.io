code: MUSI30165
year: 2026
learn:
  en: "Auditioned jazz big band playing styles from the 1930s to today, with improvising and gigs at outside venues."
  zh: "需试音的爵士大乐队，演奏1930年代至今的风格，含即兴并外出演出。"
  zh-TW: "需試音的爵士大樂隊，演奏1930年代至今的風格，含即興並外出演出。"
  ja: "オーディション制のジャズ・ビッグバンド。30年代から現代まで、即興や外部公演も。"
  ko: "오디션으로 뽑는 재즈 빅밴드. 1930년대부터 현재까지, 즉흥과 외부 공연."
  vi: "Big band jazz qua thử giọng, phong cách từ thập niên 1930 tới nay, có ứng tác và diễn ngoài."
  ms: "Big band jaz melalui uji bakat, gaya 1930-an hingga kini, improvisasi dan persembahan luar."
  id: "Big band jazz lewat audisi, gaya 1930-an hingga kini, improvisasi dan pentas luar."
  hi: "ऑडिशन वाला जैज़ बिग बैंड, 1930 से आज तक की शैलियाँ, तात्कालिक वादन और बाहरी शो।"
outcomes:
  - en: "Play your section part tightly in a big band"
    zh: "在大乐队中精准演奏声部"
    zh-TW: "在大樂隊中精準演奏聲部"
    ja: "ビッグバンドでセクションを正確に演奏する"
    ko: "빅밴드에서 섹션 파트 정확히 연주하기"
    vi: "Chơi chính xác bè của mình trong big band"
    ms: "Mainkan bahagian seksyen dengan kemas"
    id: "Memainkan partisi seksi dengan rapi"
    hi: "बिग बैंड में अपना भाग सटीक बजाना"
  - en: "Improvise within big band arrangements"
    zh: "在大乐队编曲中即兴"
    zh-TW: "在大樂隊編曲中即興"
    ja: "ビッグバンド編曲の中で即興する"
    ko: "빅밴드 편곡 안에서 즉흥 연주하기"
    vi: "Ứng tác trong bản phối big band"
    ms: "Improvisasi dalam susunan big band"
    id: "Berimprovisasi dalam aransemen big band"
    hi: "बिग बैंड व्यवस्था में तात्कालिक वादन"
  - en: "Pass an individual part test"
    zh: "通过个人声部测试"
    zh-TW: "通過個人聲部測試"
    ja: "個人パートテストに合格する"
    ko: "개인 파트 테스트 통과하기"
    vi: "Vượt qua bài kiểm tra bè cá nhân"
    ms: "Lulus ujian bahagian individu"
    id: "Lulus tes partisi individu"
    hi: "व्यक्तिगत भाग परीक्षा पास करना"
