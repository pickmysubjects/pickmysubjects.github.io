code: PHYS30011
year: 2026
learn:
  en: "Working through clinical cases to explain what has gone wrong in the body and how research could find out more."
  zh: "通过临床病例分析身体哪里出了问题，以及怎么研究。"
  zh-TW: "透過臨床病例分析身體哪裡出了問題，以及研究怎麼深入了解。"
  ja: "臨床症例を通して、体で何がうまくいっていないか、研究でどう解明できるかを考える。"
  ko: "임상 사례를 통해 몸에 무엇이 잘못됐는지, 연구로 어떻게 더 알아낼지 설명."
  vi: "Phân tích ca lâm sàng để giải thích cơ thể gặp vấn đề gì và nghiên cứu có thể tìm hiểu thêm ra sao."
  ms: "Mengkaji kes klinikal untuk terangkan apa yang tidak kena dalam badan dan cara kajian boleh mengetahui lebih."
  id: "Membahas kasus klinis untuk menjelaskan apa yang salah di tubuh dan cara riset bisa menggali lebih jauh."
  hi: "क्लिनिकल केस के ज़रिए समझना कि शरीर में क्या गड़बड़ है और रिसर्च से और कैसे पता चले।"
outcomes:
  - en: "Form a hypothesis from a patient's symptoms"
    zh: "根据症状提出发病机制假设"
    zh-TW: "根據病人症狀提出假設"
    ja: "患者の症状から仮説を立てる"
    ko: "환자의 증상으로 가설 세우기"
    vi: "Đưa ra giả thuyết từ triệu chứng của bệnh nhân"
    ms: "Bentuk hipotesis daripada simptom pesakit"
    id: "Menyusun hipotesis dari gejala pasien"
    hi: "मरीज़ के लक्षणों से परिकल्पना बनाना"
  - en: "Review current research on a disease"
    zh: "梳理一种疾病的最新研究"
    zh-TW: "梳理一種疾病的最新研究"
    ja: "ある病気の最新研究をレビューする"
    ko: "질병에 대한 최신 연구 검토"
    vi: "Tổng quan nghiên cứu hiện nay về một bệnh"
    ms: "Kaji semula kajian semasa tentang penyakit"
    id: "Meninjau riset terkini tentang suatu penyakit"
    hi: "किसी बीमारी पर मौजूदा रिसर्च की समीक्षा"
  - en: "Write your own research proposal"
    zh: "写出自己的研究计划"
    zh-TW: "寫出自己的研究計畫"
    ja: "自分の研究計画書を書く"
    ko: "자신의 연구 계획서 작성"
    vi: "Viết đề cương nghiên cứu của riêng bạn"
    ms: "Tulis cadangan penyelidikan sendiri"
    id: "Menulis proposal riset sendiri"
    hi: "अपना रिसर्च प्रस्ताव लिखना"
