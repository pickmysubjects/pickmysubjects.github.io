code: PHYS30011
year: 2026
learn:
  en: "Working through clinical cases to explain what has gone wrong in the body and how research could find out more."
  zh: "通过临床病例分析身体哪里出了问题，以及怎么研究。"
outcomes:
  - en: "Form a hypothesis from a patient's symptoms"
    zh: "根据症状提出发病机制假设"
  - en: "Review current research on a disease"
    zh: "梳理一种疾病的最新研究"
  - en: "Write your own research proposal"
    zh: "写出自己的研究计划"
