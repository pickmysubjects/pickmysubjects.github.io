code: NEUR30008
year: 2027
learn:
  en: "How the brain turns sensory input like sight, sound and touch into perception, and how it picks and drives the right actions."
  zh: "大脑如何把视觉、听觉、触觉等感官信息变成感知，以及如何选择并执行合适的动作。"
  zh-TW: "大腦如何把視覺、聽覺、觸覺等感官資訊變成知覺，以及如何選擇並執行合適的動作。"
  ja: "脳が視覚・聴覚・触覚などの感覚を知覚に変え、適切な行動を選んで実行する仕組み。"
  ko: "뇌가 시각·청각·촉각 같은 감각 정보를 지각으로 바꾸고 알맞은 행동을 고르고 실행하는 방식."
  vi: "Cách não biến thông tin giác quan như thị giác, thính giác, xúc giác thành tri giác, và chọn, điều khiển hành động phù hợp."
  ms: "Bagaimana otak menukar input deria seperti penglihatan, bunyi dan sentuhan kepada persepsi, serta memilih dan menggerakkan tindakan yang betul."
  id: "Bagaimana otak mengubah input indra seperti penglihatan, pendengaran, dan sentuhan menjadi persepsi, lalu memilih dan menjalankan tindakan yang tepat."
  hi: "दिमाग देखने, सुनने, छूने जैसी संवेदनाओं को धारणा में कैसे बदलता है और सही क्रिया कैसे चुनता व चलाता है।"
outcomes:
  - en: "Explain how sensory systems work"
    zh: "解释感觉系统如何运作"
    zh-TW: "解釋感覺系統如何運作"
    ja: "感覚系の仕組みを説明する"
    ko: "감각 시스템의 작동 방식 설명하기"
    vi: "Giải thích cách các hệ giác quan hoạt động"
    ms: "Terangkan cara sistem deria berfungsi"
    id: "Menjelaskan cara kerja sistem sensorik"
    hi: "संवेदी तंत्र कैसे काम करते हैं, समझाना"
  - en: "Explain how the motor system plans and runs movement"
    zh: "解释运动系统如何计划和执行动作"
    zh-TW: "解釋運動系統如何規劃和執行動作"
    ja: "運動系が動きを計画・実行する仕組みを説明する"
    ko: "운동 시스템이 움직임을 계획·실행하는 방식 설명하기"
    vi: "Giải thích hệ vận động lên kế hoạch và thực hiện cử động"
    ms: "Terangkan cara sistem motor merancang dan melaksanakan gerakan"
    id: "Menjelaskan cara sistem motorik merencanakan dan menjalankan gerakan"
    hi: "मोटर तंत्र गति की योजना व अमल कैसे करता है, समझाना"
  - en: "Critically read neuroscience research papers"
    zh: "批判性阅读神经科学研究论文"
    zh-TW: "批判性閱讀神經科學研究論文"
    ja: "神経科学の研究論文を批判的に読む"
    ko: "신경과학 연구 논문 비판적으로 읽기"
    vi: "Đọc có phê phán các bài nghiên cứu thần kinh học"
    ms: "Baca kertas penyelidikan neurosains secara kritis"
    id: "Membaca makalah riset neurosains secara kritis"
    hi: "न्यूरोसाइंस शोध पत्रों को आलोचनात्मक ढंग से पढ़ना"
