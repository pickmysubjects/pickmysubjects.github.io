code: MUSI20180
year: 2026
learn:
  en: "Jazz and improvisation language: harmonic and rhythmic devices in practical tests, plus composition and a written exam."
  zh: "爵士与即兴的音乐语言：和声与节奏手法的实践测验，外加作曲和笔试。"
  zh-TW: "爵士與即興的音樂語言：和聲與節奏手法的實作測驗，另有作曲與筆試。"
  ja: "ジャズと即興の語法。和声・リズムの実技テスト、作曲、筆記試験。"
  ko: "재즈·즉흥 음악 언어: 화성·리듬 기법 실기 테스트, 작곡, 필기 시험."
  vi: "Ngôn ngữ jazz và ngẫu hứng: kiểm tra thực hành hòa âm, tiết tấu, sáng tác và thi viết."
  ms: "Bahasa jaz dan improvisasi: ujian amali harmoni dan ritma, gubahan serta peperiksaan bertulis."
  id: "Bahasa jazz dan improvisasi: tes praktik harmoni dan ritme, komposisi, serta ujian tulis."
  hi: "जैज़ और इम्प्रोवाइज़ेशन की भाषा: हार्मनी-रिदम के प्रैक्टिकल टेस्ट, कंपोज़िशन और लिखित परीक्षा।"
outcomes:
  - en: "Use advanced harmonic devices"
    zh: "运用进阶和声手法"
    zh-TW: "運用進階和聲手法"
    ja: "高度な和声技法を使う"
    ko: "고급 화성 기법 활용하기"
    vi: "Dùng thủ pháp hòa âm nâng cao"
    ms: "Guna teknik harmoni lanjutan"
    id: "Memakai teknik harmoni lanjutan"
    hi: "उन्नत हार्मनी तकनीकें उपयोग करना"
  - en: "Apply complex rhythmic ideas"
    zh: "运用复杂的节奏构思"
    zh-TW: "運用複雜的節奏構思"
    ja: "複雑なリズムを応用する"
    ko: "복잡한 리듬 아이디어 적용하기"
    vi: "Áp dụng ý tưởng tiết tấu phức tạp"
    ms: "Gunakan idea ritma kompleks"
    id: "Menerapkan ide ritme kompleks"
    hi: "जटिल रिदम विचार लागू करना"
  - en: "Compose using these techniques"
    zh: "用这些技巧作曲"
    zh-TW: "用這些技巧作曲"
    ja: "これらの技法で作曲する"
    ko: "이 기법들로 작곡하기"
    vi: "Sáng tác bằng các kỹ thuật này"
    ms: "Menggubah dengan teknik ini"
    id: "Mengarang dengan teknik ini"
    hi: "इन तकनीकों से कंपोज़ करना"
