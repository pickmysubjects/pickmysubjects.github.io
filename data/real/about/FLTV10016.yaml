code: FLTV10016
year: 2026
learn:
  en: "Animation from the ground up: stop-motion, 2D, key-frame and straight-ahead methods, drawing, sound recording and software."
  zh: "从零学动画：定格、2D、关键帧与逐帧法，加上绘画、录音和软件。"
  zh-TW: "從零學動畫：定格、2D、關鍵影格與逐格法，加上繪畫、錄音和軟體。"
  ja: "アニメーションの基本：ストップモーション、2D、キーフレームと逐次法、デッサン、録音、ソフト。"
  ko: "애니메이션 기초: 스톱모션, 2D, 키프레임과 연속 기법, 드로잉, 녹음, 소프트웨어."
  vi: "Hoạt hình từ đầu: stop-motion, 2D, khung hình chính và vẽ liên tục, vẽ tay, thu âm, phần mềm."
  ms: "Animasi dari asas: stop-motion, 2D, kaedah bingkai utama, lukisan, rakaman bunyi dan perisian."
  id: "Animasi dari dasar: stop-motion, 2D, metode key-frame, menggambar, rekaman suara dan perangkat lunak."
  hi: "शुरुआत से एनिमेशन: स्टॉप-मोशन, 2D, की-फ़्रेम और स्ट्रेट-अहेड, ड्रॉइंग, साउंड रिकॉर्डिंग और सॉफ़्टवेयर।"
outcomes:
  - en: "Try out the main animation techniques"
    zh: "尝试主要的动画技法"
    zh-TW: "嘗試主要的動畫技法"
    ja: "主なアニメーション技法を試す"
    ko: "주요 애니메이션 기법 시도하기"
    vi: "Thử các kỹ thuật hoạt hình chính"
    ms: "Cuba teknik animasi utama"
    id: "Mencoba teknik animasi utama"
    hi: "मुख्य एनिमेशन तकनीकें आज़माना"
  - en: "Draw for animation"
    zh: "为动画绘画"
    zh-TW: "為動畫繪畫"
    ja: "アニメーションのために描く"
    ko: "애니메이션을 위한 드로잉"
    vi: "Vẽ cho hoạt hình"
    ms: "Melukis untuk animasi"
    id: "Menggambar untuk animasi"
    hi: "एनिमेशन के लिए ड्रॉइंग"
  - en: "Build a folio of animation experiments"
    zh: "整理一份动画实验作品集"
    zh-TW: "整理一份動畫實驗作品集"
    ja: "アニメーション実験の作品集を作る"
    ko: "애니메이션 실험 포트폴리오 만들기"
    vi: "Làm tập hồ sơ thử nghiệm hoạt hình"
    ms: "Bina folio eksperimen animasi"
    id: "Menyusun folio eksperimen animasi"
    hi: "एनिमेशन प्रयोगों का फ़ोलियो बनाना"
