code: ACCT20006
year: 2026
learn:
  en: "Business fraud from an accountant's view: types of fraud, how to prevent and detect it, and investigating for court."
  zh: "会计视角看商业欺诈：类型、预防与发现，以及为法庭调查取证。"
  zh-TW: "會計視角看商業詐欺：類型、預防與發現，以及為法庭調查取證。"
  ja: "会計の視点で見る企業不正：種類、防止と発見、法廷向けの調査。"
  ko: "회계 관점의 기업 사기: 유형, 예방과 적발, 법정용 조사."
  vi: "Gian lận doanh nghiệp từ góc nhìn kế toán: các loại gian lận, phòng ngừa, phát hiện và điều tra để ra tòa."
  ms: "Penipuan perniagaan dari sudut akauntan: jenis, cara cegah dan kesan, serta siasatan untuk mahkamah."
  id: "Kecurangan bisnis dari sudut akuntan: jenisnya, cara mencegah dan mendeteksi, serta investigasi untuk pengadilan."
  hi: "अकाउंटेंट की नज़र से बिज़नेस धोखाधड़ी: इसके प्रकार, रोकथाम, पकड़ना और अदालत के लिए जाँच।"
outcomes:
  - en: "Describe types of fraud and recent trends"
    zh: "描述欺诈类型和最新趋势"
    zh-TW: "描述詐欺類型和最新趨勢"
    ja: "不正の種類と最近の傾向を説明する"
    ko: "사기 유형과 최근 동향 설명"
    vi: "Mô tả các loại gian lận và xu hướng gần đây"
    ms: "Huraikan jenis penipuan dan trend terkini"
    id: "Menjelaskan jenis kecurangan dan tren terbaru"
    hi: "धोखाधड़ी के प्रकार और हाल के रुझान बताना"
  - en: "Recommend controls that help prevent fraud"
    zh: "提出有助预防欺诈的管控措施"
    zh-TW: "提出有助預防詐欺的管控措施"
    ja: "不正防止に役立つ統制を提案する"
    ko: "사기 예방에 도움 되는 통제 방안 제안"
    vi: "Đề xuất biện pháp kiểm soát giúp ngăn gian lận"
    ms: "Cadang kawalan untuk mencegah penipuan"
    id: "Merekomendasikan kontrol untuk mencegah kecurangan"
    hi: "धोखाधड़ी रोकने वाले नियंत्रण सुझाना"
  - en: "Use detection methods and explain the rules of evidence"
    zh: "运用侦测方法并解释证据规则"
    zh-TW: "運用偵測方法並說明證據規則"
    ja: "発見の手法を使い証拠のルールを説明する"
    ko: "적발 방법을 쓰고 증거 규칙 설명"
    vi: "Dùng cách phát hiện và giải thích quy tắc chứng cứ"
    ms: "Guna kaedah pengesanan dan terangkan peraturan keterangan"
    id: "Memakai metode deteksi dan menjelaskan aturan pembuktian"
    hi: "पकड़ने के तरीक़े अपनाना और सबूत के नियम समझाना"
