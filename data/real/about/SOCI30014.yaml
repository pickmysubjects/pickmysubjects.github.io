code: SOCI30014
year: 2026
learn:
  en: "How race and racism work in Australia today, from First Nations justice to anti-migrant racism, and efforts against it."
  zh: "种族和种族主义在当今澳大利亚如何运作，从原住民正义到反移民歧视，以及反种族主义努力。"
  zh-TW: "種族和種族主義在當今澳洲如何運作，從原住民正義到反移民歧視，以及反種族主義的努力。"
  ja: "先住民の正義から移民への差別まで、今のオーストラリアで人種と人種主義がどう働き、どう対抗されているかを学ぶ。"
  ko: "원주민의 정의 문제부터 반이민 인종주의까지, 오늘날 호주에서 인종과 인종주의가 어떻게 작동하고 어떻게 맞서는지 배운다."
  vi: "Chủng tộc và phân biệt chủng tộc vận hành ra sao ở Úc ngày nay, từ công lý cho người bản địa đến kỳ thị người nhập cư."
  ms: "Cara kaum dan perkauman berlaku di Australia hari ini, daripada keadilan Orang Asal hingga perkauman terhadap migran."
  id: "Cara ras dan rasisme bekerja di Australia kini, dari keadilan bagi First Nations hingga rasisme terhadap migran."
  hi: "आज के ऑस्ट्रेलिया में नस्ल और नस्लवाद कैसे काम करते हैं, फ़र्स्ट नेशंस के न्याय से प्रवासी-विरोधी नस्लवाद तक।"
outcomes:
  - en: "Define race and racism from a sociology view"
    zh: "从社会学角度界定种族与种族主义"
    zh-TW: "從社會學角度界定種族與種族主義"
    ja: "社会学の視点で人種と人種主義を定義する"
    ko: "사회학 관점에서 인종과 인종주의 정의하기"
    vi: "Định nghĩa chủng tộc và phân biệt chủng tộc theo xã hội học"
    ms: "Takrifkan kaum dan perkauman dari sudut sosiologi"
    id: "Mendefinisikan ras dan rasisme dari sudut sosiologi"
    hi: "समाजशास्त्र के नज़रिए से नस्ल और नस्लवाद को परिभाषित करना"
  - en: "Explain the social processes behind racism in Australia"
    zh: "说明澳大利亚种族主义背后的社会过程"
    zh-TW: "說明澳洲種族主義背後的社會過程"
    ja: "オーストラリアの人種主義を支える社会過程を説明する"
    ko: "호주 인종주의 뒤의 사회적 과정 설명하기"
    vi: "Giải thích các quá trình xã hội đằng sau phân biệt chủng tộc ở Úc"
    ms: "Terangkan proses sosial di sebalik perkauman di Australia"
    id: "Menjelaskan proses sosial di balik rasisme di Australia"
    hi: "ऑस्ट्रेलिया में नस्लवाद के पीछे की सामाजिक प्रक्रियाएँ समझाना"
  - en: "Argue how racism works at different levels"
    zh: "论证种族主义在不同层面上如何运作"
    zh-TW: "論證種族主義在不同層面上如何運作"
    ja: "人種主義がさまざまなレベルでどう働くかを論じる"
    ko: "인종주의가 여러 층위에서 작동하는 방식 논증하기"
    vi: "Lập luận về cách phân biệt chủng tộc vận hành ở nhiều cấp độ"
    ms: "Hujahkan cara perkauman berlaku pada pelbagai peringkat"
    id: "Menguraikan cara rasisme bekerja di berbagai tingkat"
    hi: "नस्लवाद अलग-अलग स्तरों पर कैसे काम करता है, तर्क देना"
