code: FNCE90062
year: 2027
learn:
  en: "A group capstone writing analyst reports on valuation, capital structure, mergers and governance, then presenting them."
  zh: "小组完成分析师报告并展示，涵盖估值、资本结构、并购和公司治理。"
  zh-TW: "小組完成分析師報告並簡報，涵蓋評價、資本結構、併購與公司治理。"
  ja: "グループで評価・資本構成・M&A・ガバナンスのアナリストレポートを書き発表する総仕上げ科目。"
  ko: "팀으로 가치평가, 자본구조, M&A, 지배구조 분석 보고서를 쓰고 발표하는 캡스톤."
  vi: "Môn tổng kết theo nhóm: viết và thuyết trình báo cáo phân tích về định giá, cơ cấu vốn, M&A và quản trị."
  ms: "Projek akhir berkumpulan: laporan penganalisis tentang penilaian, struktur modal, penggabungan dan tadbir urus, serta pembentangan."
  id: "Capstone kelompok: menulis dan mempresentasikan laporan analis tentang valuasi, struktur modal, merger, dan tata kelola."
  hi: "समूह कैपस्टोन: मूल्यांकन, पूंजी संरचना, विलय और गवर्नेंस पर विश्लेषक रिपोर्ट लिखना और प्रस्तुत करना।"
outcomes:
  - en: "Apply analyst tools to corporate finance problems"
    zh: "运用分析师工具解决公司金融问题"
    zh-TW: "運用分析師工具解決公司理財問題"
    ja: "アナリストの手法を企業財務の問題に使う"
    ko: "애널리스트 도구를 기업재무 문제에 적용하기"
    vi: "Dùng công cụ phân tích cho vấn đề tài chính doanh nghiệp"
    ms: "Menggunakan alat penganalisis untuk masalah kewangan korporat"
    id: "Menerapkan alat analis pada masalah keuangan perusahaan"
    hi: "कॉर्पोरेट वित्त समस्याओं पर विश्लेषक उपकरण लागू करना"
  - en: "Write and present an analyst report"
    zh: "撰写并展示分析师报告"
    zh-TW: "撰寫並簡報分析師報告"
    ja: "アナリストレポートを書いて発表する"
    ko: "애널리스트 보고서 작성 및 발표하기"
    vi: "Viết và trình bày báo cáo phân tích"
    ms: "Menulis dan membentang laporan penganalisis"
    id: "Menulis dan mempresentasikan laporan analis"
    hi: "विश्लेषक रिपोर्ट लिखना और प्रस्तुत करना"
