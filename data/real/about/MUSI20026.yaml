code: MUSI20026
year: 2026
learn:
  en: "The next step on your second instrument or voice: prepare a 20-minute program and play 10 minutes of it in a recital exam."
  zh: "第二件乐器或声乐进阶：准备20分钟曲目，考试时演奏其中10分钟。"
  zh-TW: "第二件樂器或聲樂進階：準備20分鐘曲目，考試時演奏其中10分鐘。"
  ja: "第二楽器・声楽の続編。20分の曲目を準備し、試験で10分演奏する。"
  ko: "제2악기·성악 심화. 20분 프로그램을 준비해 시험에서 10분 연주한다."
  vi: "Bước tiếp với nhạc cụ thứ hai: chuẩn bị 20 phút nhạc, thi trình diễn 10 phút."
  ms: "Langkah seterusnya: sediakan program 20 minit dan persembahkan 10 minit dalam ujian."
  id: "Lanjutan instrumen kedua: siapkan program 20 menit, mainkan 10 menit saat ujian."
  hi: "दूसरे वाद्य का अगला चरण: 20 मिनट का कार्यक्रम तैयार, परीक्षा में 10 मिनट बजाना।"
outcomes:
  - en: "Give a short recital exam on a second instrument"
    zh: "在第二件乐器上完成简短独奏考试"
    zh-TW: "在第二件樂器上完成簡短獨奏考試"
    ja: "第二楽器で短いリサイタル試験を行う"
    ko: "제2악기로 짧은 리사이틀 시험 보기"
    vi: "Thi độc tấu ngắn trên nhạc cụ thứ hai"
    ms: "Persembahkan resital ringkas dengan alat kedua"
    id: "Memberi resital ujian singkat di instrumen kedua"
    hi: "दूसरे वाद्य पर छोटी गायन/वादन परीक्षा देना"
  - en: "Prepare a varied program to performance standard"
    zh: "把多样曲目准备到演出水准"
    zh-TW: "把多樣曲目準備到演出水準"
    ja: "多様な曲目を本番水準まで仕上げる"
    ko: "다양한 곡을 공연 수준으로 준비하기"
    vi: "Chuẩn bị chương trình đa dạng đạt chuẩn biểu diễn"
    ms: "Sediakan program pelbagai ke tahap persembahan"
    id: "Menyiapkan program beragam sampai siap tampil"
    hi: "विविध कार्यक्रम को प्रदर्शन स्तर तक तैयार करना"
  - en: "Critically assess your playing in a new area"
    zh: "批判性地评估自己在新领域的演奏"
    zh-TW: "批判性地評估自己在新領域的演奏"
    ja: "新しい分野での自分の演奏を批判的に評価する"
    ko: "새 영역에서 자신의 연주를 비판적으로 평가하기"
    vi: "Tự đánh giá có phê phán phần trình diễn của mình"
    ms: "Nilai persembahan sendiri secara kritis"
    id: "Menilai permainan sendiri secara kritis"
    hi: "अपने वादन का आलोचनात्मक मूल्यांकन करना"
