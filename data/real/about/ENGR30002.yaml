code: ENGR30002
year: 2026
learn:
  en: "How fluids behave at rest and in motion, and using that for pipes, pumps, dams and open channels."
  zh: "流体静止和流动时的规律，以及在管道、泵、大坝和明渠中的应用。"
  zh-TW: "流體靜止和流動時的規律，以及在管道、泵、水壩和明渠中的應用。"
  ja: "静止・運動する流体のふるまいと、配管・ポンプ・ダム・開水路への応用。"
  ko: "정지·운동하는 유체의 성질과 배관·펌프·댐·개수로에의 응용."
  vi: "Chất lưu khi đứng yên và chuyển động, áp dụng cho ống, bơm, đập và kênh hở."
  ms: "Kelakuan bendalir ketika pegun dan bergerak, serta kegunaannya untuk paip, pam, empangan dan saluran terbuka."
  id: "Perilaku fluida diam dan bergerak, serta penerapannya pada pipa, pompa, bendungan, dan saluran terbuka."
  hi: "तरल पदार्थ स्थिर और बहते हुए कैसे व्यवहार करते हैं, और पाइप, पंप, बाँध व खुली नहरों में उपयोग।"
outcomes:
  - en: "Solve energy balances in pipe flow"
    zh: "求解管流的能量平衡"
    zh-TW: "求解管流的能量平衡"
    ja: "管内流れのエネルギー収支を解く"
    ko: "관 유동의 에너지 수지를 푼다"
    vi: "Giải cân bằng năng lượng dòng chảy ống"
    ms: "Selesaikan imbangan tenaga aliran paip"
    id: "Menyelesaikan neraca energi aliran pipa"
    hi: "पाइप फ़्लो में एनर्जी बैलेंस हल करना"
  - en: "Use Navier-Stokes to find velocity profiles"
    zh: "用纳维-斯托克斯方程求速度分布"
    zh-TW: "用納維-斯托克斯方程求速度分布"
    ja: "ナビエ・ストークス式で速度分布を求める"
    ko: "나비에-스토크스로 속도 분포를 구한다"
    vi: "Dùng Navier-Stokes tìm phân bố vận tốc"
    ms: "Guna Navier-Stokes untuk profil halaju"
    id: "Memakai Navier-Stokes untuk profil kecepatan"
    hi: "Navier-Stokes से वेग प्रोफ़ाइल निकालना"
