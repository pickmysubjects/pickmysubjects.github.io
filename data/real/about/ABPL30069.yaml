code: ABPL30069
year: 2026
learn:
  en: "How pop-up parks, street art and temporary installations can make people see and use public space differently."
  zh: "研究快闪公园、街头艺术和临时装置如何改变人们看待和使用公共空间的方式。"
  zh-TW: "研究快閃公園、街頭藝術和臨時裝置如何改變人們看待和使用公共空間的方式。"
  ja: "ポップアップ公園やストリートアート、仮設インスタレーションが公共空間をどう変えるかを学ぶ。"
  ko: "팝업 공원, 거리 예술, 임시 설치물이 공공 공간을 어떻게 바꾸는지 배운다."
  vi: "Công viên tạm, nghệ thuật đường phố, sắp đặt tạm thời thay đổi không gian công cộng ra sao."
  ms: "Bagaimana taman pop-up, seni jalanan dan instalasi sementara mengubah ruang awam."
  id: "Bagaimana taman pop-up, seni jalanan dan instalasi sementara mengubah ruang publik."
  hi: "पॉप-अप पार्क, स्ट्रीट आर्ट और अस्थायी इंस्टॉलेशन सार्वजनिक जगह को कैसे बदलते हैं।"
outcomes:
  - en: "Analyse temporary interventions in public space"
    zh: "分析公共空间中的临时介入"
    zh-TW: "分析公共空間中的臨時介入"
    ja: "公共空間での仮設的な介入を分析する"
    ko: "공공 공간의 임시 개입 분석하기"
    vi: "Phân tích can thiệp tạm thời ở không gian công cộng"
    ms: "Analisis campur tangan sementara di ruang awam"
    id: "Menganalisis intervensi sementara di ruang publik"
    hi: "सार्वजनिक जगह में अस्थायी हस्तक्षेप का विश्लेषण"
  - en: "Research a real site and its users"
    zh: "研究真实场地及其使用者"
    zh-TW: "研究真實場地及其使用者"
    ja: "実際の場所と利用者を調べる"
    ko: "실제 장소와 이용자 조사하기"
    vi: "Nghiên cứu địa điểm thật và người sử dụng"
    ms: "Kaji tapak sebenar dan penggunanya"
    id: "Meneliti lokasi nyata dan penggunanya"
    hi: "असली जगह और उसके उपयोगकर्ताओं पर शोध"
  - en: "Propose your own installation or event"
    zh: "提出自己的装置或活动方案"
    zh-TW: "提出自己的裝置或活動方案"
    ja: "自分のインスタレーションやイベントを提案する"
    ko: "자신의 설치물이나 이벤트 제안하기"
    vi: "Đề xuất sắp đặt hoặc sự kiện của riêng mình"
    ms: "Cadangkan instalasi atau acara sendiri"
    id: "Mengusulkan instalasi atau acara sendiri"
    hi: "अपना इंस्टॉलेशन या इवेंट प्रस्तावित करना"
