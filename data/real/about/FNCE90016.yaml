code: FNCE90016
year: 2027
learn:
  en: "Finance across borders: foreign exchange markets, currency exposure, international investing and capital budgeting."
  zh: "跨国金融：外汇市场、汇率风险敞口、国际投资和资本预算。"
  zh-TW: "跨國金融：外匯市場、匯率風險暴露、國際投資與資本預算。"
  ja: "国境を越えるファイナンス：外国為替市場、為替エクスポージャー、国際投資、資本予算。"
  ko: "국경을 넘는 재무: 외환시장, 환위험 노출, 국제투자, 자본예산."
  vi: "Tài chính xuyên biên giới: thị trường ngoại hối, rủi ro tỷ giá, đầu tư quốc tế, hoạch định vốn."
  ms: "Kewangan rentas sempadan: pasaran pertukaran asing, pendedahan mata wang, pelaburan antarabangsa, belanjawan modal."
  id: "Keuangan lintas negara: pasar valas, eksposur mata uang, investasi internasional dan penganggaran modal."
  hi: "सीमा पार वित्त: विदेशी मुद्रा बाज़ार, मुद्रा जोखिम, अंतरराष्ट्रीय निवेश और पूंजी बजटिंग।"
outcomes:
  - en: "Explain how foreign exchange markets work"
    zh: "解释外汇市场如何运作"
    zh-TW: "解釋外匯市場如何運作"
    ja: "外国為替市場の仕組みを説明する"
    ko: "외환시장의 작동 방식 설명하기"
    vi: "Giải thích cách thị trường ngoại hối vận hành"
    ms: "Menerangkan cara pasaran pertukaran asing berfungsi"
    id: "Menjelaskan cara kerja pasar valuta asing"
    hi: "विदेशी मुद्रा बाज़ार कैसे काम करता है, समझाना"
  - en: "Solve international capital budgeting problems"
    zh: "解决国际资本预算问题"
    zh-TW: "解決國際資本預算問題"
    ja: "国際的な資本予算の問題を解く"
    ko: "국제 자본예산 문제 풀기"
    vi: "Giải bài toán hoạch định vốn quốc tế"
    ms: "Menyelesaikan masalah belanjawan modal antarabangsa"
    id: "Menyelesaikan soal penganggaran modal internasional"
    hi: "अंतरराष्ट्रीय पूंजी बजटिंग की समस्याएं हल करना"
