code: PHRM30003
year: 2026
learn:
  en: "Drugs used to treat cancer, immune problems, heart and blood vessel disease, and lung disease."
  zh: "治疗癌症、免疫病、心血管病和肺病的药物。"
  zh-TW: "治療癌症、免疫疾病、心血管疾病和肺病的藥物。"
  ja: "がん、免疫の問題、心臓・血管の病気、肺の病気の治療に使う薬。"
  ko: "암, 면역 질환, 심혈관 질환, 폐 질환 치료에 쓰는 약."
  vi: "Thuốc chữa ung thư, bệnh miễn dịch, bệnh tim mạch và bệnh phổi."
  ms: "Ubat untuk merawat kanser, masalah imun, penyakit jantung dan salur darah, serta penyakit paru-paru."
  id: "Obat untuk kanker, gangguan imun, penyakit jantung dan pembuluh darah, serta penyakit paru."
  hi: "कैंसर, इम्यून समस्याओं, दिल व खून की नसों और फेफड़ों की बीमारी की दवाएँ।"
outcomes:
  - en: "Explain how major drug classes work"
    zh: "解释主要几类药物怎么起作用"
    zh-TW: "解釋主要幾類藥物怎麼起作用"
    ja: "主な薬のグループの仕組みを説明する"
    ko: "주요 약물군의 작용 원리 설명"
    vi: "Giải thích cơ chế của các nhóm thuốc chính"
    ms: "Terangkan cara kelas ubat utama berfungsi"
    id: "Menjelaskan cara kerja golongan obat utama"
    hi: "मुख्य दवा वर्ग कैसे काम करते हैं, समझाना"
  - en: "Weigh the benefits and risks of a treatment"
    zh: "权衡一种治疗的好处和风险"
    zh-TW: "權衡一種治療的好處和風險"
    ja: "治療の利点とリスクを比べて判断する"
    ko: "치료의 이점과 위험 따져보기"
    vi: "Cân nhắc lợi ích và rủi ro của một cách điều trị"
    ms: "Timbang manfaat dan risiko sesuatu rawatan"
    id: "Menimbang manfaat dan risiko suatu pengobatan"
    hi: "किसी इलाज के फायदे और जोखिम तौलना"
  - en: "Link disease processes to how new drugs are designed"
    zh: "把病理和新药设计联系起来"
    zh-TW: "把病理和新藥設計連結起來"
    ja: "病気の過程と新薬の設計を結びつける"
    ko: "질병 과정과 신약 설계 연결"
    vi: "Liên hệ quá trình bệnh với cách thiết kế thuốc mới"
    ms: "Kaitkan proses penyakit dengan reka bentuk ubat baharu"
    id: "Menghubungkan proses penyakit dengan desain obat baru"
    hi: "बीमारी की प्रक्रिया को नई दवा के डिज़ाइन से जोड़ना"
