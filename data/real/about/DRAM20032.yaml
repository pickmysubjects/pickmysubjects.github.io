code: DRAM20032
year: 2026
learn:
  en: "Devise new theatre from life stories, sites and immersive forms, ending in a public ensemble season."
  zh: "从个人经历、场地与沉浸式形式出发编创新戏，最后公开演出。"
  zh-TW: "從個人經歷、場地與沉浸式形式出發編創新戲，最後公開演出。"
  ja: "自伝・場所・没入型から新作を創り、最後に一般公演を行う。"
  ko: "자전·장소·몰입형 형식으로 새 연극을 만들고 공개 공연한다."
  vi: "Dựng kịch mới từ chuyện đời, địa điểm và dạng nhập vai, kết thúc bằng mùa diễn."
  ms: "Cipta teater baharu daripada kisah hidup, lokasi dan bentuk imersif, lalu pentas awam."
  id: "Membuat teater baru dari kisah hidup, lokasi dan bentuk imersif, lalu pentas publik."
  hi: "जीवन-कथाओं, स्थानों और इमर्सिव रूपों से नया थिएटर रचना, फिर सार्वजनिक शो।"
outcomes:
  - en: "Write and perform a solo piece"
    zh: "创作并表演个人独角戏"
    zh-TW: "創作並表演個人獨角戲"
    ja: "自作のソロ作品を演じる"
    ko: "직접 쓴 솔로 작품 공연하기"
    vi: "Viết và diễn một tiết mục đơn"
    ms: "Tulis dan persembahkan karya solo"
    id: "Menulis dan membawakan karya solo"
    hi: "अपना सोलो पीस लिखना और प्रस्तुत करना"
  - en: "Rehearse an ensemble show with a director"
    zh: "与导演一起排练集体作品"
    zh-TW: "與導演一起排練集體作品"
    ja: "演出家と集団作品を稽古する"
    ko: "연출가와 앙상블 작품 리허설하기"
    vi: "Tập vở tập thể cùng đạo diễn"
    ms: "Berlatih karya ensembel bersama pengarah"
    id: "Berlatih karya ensambel dengan sutradara"
    hi: "निर्देशक के साथ सामूहिक शो की रिहर्सल"
  - en: "Describe your own devising method"
    zh: "说出自己的编创方法"
    zh-TW: "說出自己的編創方法"
    ja: "自分の創作方法を言葉にする"
    ko: "자신의 창작 방식 설명하기"
    vi: "Mô tả cách dựng tác phẩm của mình"
    ms: "Huraikan kaedah cipta sendiri"
    id: "Menjelaskan metode kreasi sendiri"
    hi: "अपनी रचना-पद्धति बताना"
