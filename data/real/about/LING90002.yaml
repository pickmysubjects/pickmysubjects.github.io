code: LING90002
year: 2027
learn:
  en: "Advanced academic English for graduate study: reading, writing a literature review and giving a seminar."
  zh: "研究生阶段的高级学术英语：阅读、写文献综述和做研讨会报告。"
  zh-TW: "研究生階段的進階學術英語：閱讀、寫文獻回顧與做研討會報告。"
  ja: "大学院向けの上級学術英語。読解、文献レビューの執筆、セミナー発表。"
  ko: "대학원 공부를 위한 고급 학술 영어: 읽기, 문헌 검토 작성, 세미나 발표."
  vi: "Tiếng Anh học thuật nâng cao cho sau đại học: đọc, viết tổng quan tài liệu và thuyết trình seminar."
  ms: "Bahasa Inggeris akademik lanjutan untuk pengajian siswazah: membaca, menulis ulasan literatur dan seminar."
  id: "Bahasa Inggris akademik lanjutan untuk studi pascasarjana: membaca, menulis tinjauan pustaka, dan seminar."
  hi: "स्नातकोत्तर पढ़ाई के लिए उन्नत अकादमिक अंग्रेज़ी: पढ़ना, साहित्य समीक्षा लिखना और सेमिनार देना।"
outcomes:
  - en: "Read academic texts in your field more effectively"
    zh: "更有效地阅读本专业的学术文章"
    zh-TW: "更有效地閱讀本科系的學術文章"
    ja: "専門分野の学術文献を効率よく読む"
    ko: "전공 학술 글을 더 효과적으로 읽기"
    vi: "Đọc tài liệu học thuật chuyên ngành hiệu quả hơn"
    ms: "Membaca teks akademik bidang anda dengan lebih berkesan"
    id: "Membaca teks akademik bidang sendiri lebih efektif"
    hi: "अपने क्षेत्र के अकादमिक पाठ बेहतर पढ़ना"
  - en: "Write a clear, accurate literature review"
    zh: "写出清晰准确的文献综述"
    zh-TW: "寫出清楚準確的文獻回顧"
    ja: "明確で正確な文献レビューを書く"
    ko: "명확하고 정확한 문헌 검토 쓰기"
    vi: "Viết tổng quan tài liệu rõ ràng, chính xác"
    ms: "Menulis ulasan literatur yang jelas dan tepat"
    id: "Menulis tinjauan pustaka yang jelas dan akurat"
    hi: "स्पष्ट और सही साहित्य समीक्षा लिखना"
  - en: "Give a seminar and lead the discussion"
    zh: "做研讨会报告并主持讨论"
    zh-TW: "做研討會報告並主持討論"
    ja: "セミナー発表をして議論を進める"
    ko: "세미나 발표하고 토론 이끌기"
    vi: "Thuyết trình seminar và dẫn dắt thảo luận"
    ms: "Menyampaikan seminar dan mengendali perbincangan"
    id: "Menyampaikan seminar dan memandu diskusi"
    hi: "सेमिनार देना और चर्चा संभालना"
