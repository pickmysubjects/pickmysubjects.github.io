code: ECON30023
year: 2026
learn:
  en: "Economics applied to health and health care: market failures, government's role and Australia's system."
  zh: "把经济学用于医疗：市场失灵、政府角色和澳洲医疗体系。"
  zh-TW: "把經濟學用於醫療：市場失靈、政府角色和澳洲醫療體系。"
  ja: "医療への経済学の応用：市場の失敗、政府の役割、豪州の制度。"
  ko: "보건의료에 적용한 경제학: 시장실패, 정부 역할, 호주 제도."
  vi: "Kinh tế học áp dụng cho y tế: thất bại thị trường, vai trò chính phủ và hệ thống của Úc."
  ms: "Ekonomi untuk kesihatan dan penjagaan kesihatan: kegagalan pasaran, peranan kerajaan dan sistem Australia."
  id: "Ekonomi untuk kesehatan dan layanan kesehatan: kegagalan pasar, peran pemerintah, dan sistem Australia."
  hi: "स्वास्थ्य और हेल्थ केयर पर अर्थशास्त्र: बाज़ार विफलता, सरकार की भूमिका और ऑस्ट्रेलिया की व्यवस्था।"
outcomes:
  - en: "Analyse patients, doctors and insurers with economic tools"
    zh: "用经济工具分析患者、医生和保险方"
    zh-TW: "用經濟工具分析病患、醫師和保險方"
    ja: "経済の道具で患者・医師・保険者を分析する"
    ko: "경제 도구로 환자·의사·보험자 분석하기"
    vi: "Dùng công cụ kinh tế phân tích bệnh nhân, bác sĩ, bảo hiểm"
    ms: "Analisis pesakit, doktor dan penanggung insurans dengan alat ekonomi"
    id: "Menganalisis pasien, dokter, dan asuransi dengan alat ekonomi"
    hi: "मरीज़, डॉक्टर और बीमा कंपनियों का आर्थिक विश्लेषण करना"
  - en: "Discuss Australia's main health programs and debates"
    zh: "讨论澳洲主要医疗项目和争议"
    zh-TW: "討論澳洲主要醫療計畫和爭議"
    ja: "豪州の主な医療制度と論点を論じる"
    ko: "호주 주요 보건 프로그램과 쟁점 논의하기"
    vi: "Thảo luận các chương trình y tế chính và tranh luận ở Úc"
    ms: "Bincang program kesihatan utama Australia dan perdebatannya"
    id: "Membahas program kesehatan utama Australia dan perdebatannya"
    hi: "ऑस्ट्रेलिया के मुख्य स्वास्थ्य कार्यक्रमों और बहसों पर चर्चा करना"
  - en: "Know the main empirical methods in the field"
    zh: "了解该领域主要的实证方法"
    zh-TW: "了解該領域主要的實證方法"
    ja: "この分野の主な実証手法を知る"
    ko: "이 분야의 주요 실증 방법 알기"
    vi: "Biết các phương pháp thực nghiệm chính trong lĩnh vực"
    ms: "Tahu kaedah empirikal utama dalam bidang ini"
    id: "Memahami metode empiris utama di bidang ini"
    hi: "इस क्षेत्र की मुख्य एम्पिरिकल विधियाँ जानना"
