code: VETS30018
year: 2026
learn:
  en: "Structure, function and disease of the respiratory system in domestic animals, taught through clinical cases."
  zh: "通过临床病例学习家养动物呼吸系统的结构、功能与疾病。"
  zh-TW: "透過臨床案例學習家畜呼吸系統的結構、功能與疾病。"
  ja: "臨床症例を通して、家畜の呼吸器系の構造・機能・疾患を学ぶ。"
  ko: "임상 사례를 통해 가축 호흡기계의 구조, 기능, 질병을 배웁니다."
  vi: "Cấu trúc, chức năng và bệnh của hệ hô hấp ở động vật nuôi, qua các ca lâm sàng."
  ms: "Struktur, fungsi dan penyakit sistem pernafasan haiwan domestik melalui kes klinikal."
  id: "Struktur, fungsi, dan penyakit sistem pernapasan hewan domestik melalui kasus klinis."
  hi: "क्लिनिकल केसों के ज़रिए घरेलू पशुओं के श्वसन तंत्र की संरचना, कार्य और रोग।"
outcomes:
  - en: "Compare respiratory systems across species"
    zh: "比较不同物种的呼吸系统"
    zh-TW: "比較不同物種的呼吸系統"
    ja: "動物種間で呼吸器系を比較する"
    ko: "종별 호흡기계를 비교한다"
    vi: "So sánh hệ hô hấp giữa các loài"
    ms: "Membandingkan sistem pernafasan antara spesies"
    id: "Membandingkan sistem pernapasan antarspesies"
    hi: "प्रजातियों के श्वसन तंत्र की तुलना करना"
  - en: "Interpret clinical and diagnostic respiratory data"
    zh: "解读呼吸系统临床与诊断数据"
    zh-TW: "判讀呼吸系統臨床與診斷資料"
    ja: "呼吸器の臨床・診断データを解釈する"
    ko: "호흡기 임상·진단 자료를 해석한다"
    vi: "Diễn giải dữ liệu lâm sàng và chẩn đoán hô hấp"
    ms: "Mentafsir data klinikal dan diagnostik pernafasan"
    id: "Menafsirkan data klinis dan diagnostik pernapasan"
    hi: "श्वसन के क्लिनिकल व नैदानिक डेटा की व्याख्या करना"
  - en: "Perform a clinical respiratory examination"
    zh: "进行呼吸系统临床检查"
    zh-TW: "執行呼吸系統臨床檢查"
    ja: "呼吸器の臨床検査を行う"
    ko: "호흡기 임상 검사를 수행한다"
    vi: "Thực hiện khám lâm sàng hệ hô hấp"
    ms: "Menjalankan pemeriksaan klinikal pernafasan"
    id: "Melakukan pemeriksaan klinis pernapasan"
    hi: "श्वसन तंत्र की क्लिनिकल जाँच करना"
