code: MUSI20199
year: 2026
learn:
  en: "Weekly lessons and instrumental or vocal class, a progress video, and a 15-minute exam on set syllabus repertoire."
  zh: "每周个别课和器乐或声乐课，交进度视频，最后15分钟考试演奏指定曲目。"
  zh-TW: "每週個別課與器樂或聲樂課，交進度影片，最後15分鐘考試演奏指定曲目。"
  ja: "週1回の個人レッスンと楽器・声楽クラス、進捗動画、指定曲の15分試験。"
  ko: "주간 개인 레슨과 기악·성악 수업, 진도 영상, 지정곡 15분 시험."
  vi: "Học cá nhân hằng tuần, lớp nhạc cụ hoặc thanh nhạc, video tiến độ và thi 15 phút."
  ms: "Pelajaran mingguan dan kelas instrumen atau vokal, video kemajuan, dan ujian 15 minit."
  id: "Pelajaran mingguan dan kelas instrumen atau vokal, video kemajuan, serta ujian 15 menit."
  hi: "साप्ताहिक पाठ और वाद्य/गायन कक्षा, प्रगति वीडियो, और तय सिलेबस पर 15 मिनट की परीक्षा।"
outcomes:
  - en: "Perform a prepared exam program"
    zh: "演奏准备好的考试曲目"
    zh-TW: "演奏準備好的考試曲目"
    ja: "準備した試験曲を演奏する"
    ko: "준비한 시험 프로그램 연주하기"
    vi: "Biểu diễn chương trình thi đã chuẩn bị"
    ms: "Persembahkan program peperiksaan"
    id: "Membawakan program ujian"
    hi: "तैयार परीक्षा कार्यक्रम प्रस्तुत करना"
  - en: "Improve technique on your instrument"
    zh: "提升乐器或声乐技巧"
    zh-TW: "提升樂器或聲樂技巧"
    ja: "楽器や声の技術を高める"
    ko: "악기·성악 기술 향상하기"
    vi: "Nâng cao kỹ thuật nhạc cụ"
    ms: "Tingkatkan teknik alat muzik"
    id: "Meningkatkan teknik instrumen"
    hi: "अपने वाद्य की तकनीक सुधारना"
  - en: "Track progress through recordings"
    zh: "通过录像跟踪进步"
    zh-TW: "透過錄影追蹤進步"
    ja: "録画で上達を確かめる"
    ko: "녹화로 진도 점검하기"
    vi: "Theo dõi tiến bộ qua video"
    ms: "Jejak kemajuan melalui rakaman"
    id: "Memantau kemajuan lewat rekaman"
    hi: "रिकॉर्डिंग से प्रगति देखना"
