code: CVEN90045
year: 2027
learn:
  en: "Project management tools for engineering: planning, scheduling, cost control, safety and digital tools like BIM."
  zh: "工程项目管理工具：计划、进度、成本控制、安全以及 BIM 等数字工具。"
  zh-TW: "工程專案管理工具：規劃、排程、成本控制、安全以及 BIM 等數位工具。"
  ja: "エンジニアリングのプロジェクト管理：計画・工程・コスト管理・安全、BIMなどのデジタルツール。"
  ko: "엔지니어링 프로젝트 관리 도구: 계획, 일정, 원가 관리, 안전, BIM 같은 디지털 도구."
  vi: "Công cụ quản lý dự án kỹ thuật: lập kế hoạch, tiến độ, kiểm soát chi phí, an toàn và công cụ số như BIM."
  ms: "Alat pengurusan projek kejuruteraan: perancangan, penjadualan, kawalan kos, keselamatan dan alat digital seperti BIM."
  id: "Alat manajemen proyek teknik: perencanaan, penjadwalan, pengendalian biaya, keselamatan dan alat digital seperti BIM."
  hi: "इंजीनियरिंग प्रोजेक्ट प्रबंधन के साधन: योजना, समय-सारणी, लागत नियंत्रण, सुरक्षा और BIM जैसे डिजिटल टूल।"
outcomes:
  - en: "Use critical path, earned value and resource levelling"
    zh: "运用关键路径法、挣值法和资源平衡"
    zh-TW: "運用要徑法、實獲值與資源撫平"
    ja: "クリティカルパス法・アーンドバリュー・資源平準化を使う"
    ko: "주공정법, 획득가치, 자원 평준화 활용하기"
    vi: "Dùng đường găng, giá trị thu được và cân bằng nguồn lực"
    ms: "Menggunakan laluan kritikal, nilai perolehan dan perataan sumber"
    id: "Memakai jalur kritis, nilai hasil dan perataan sumber daya"
    hi: "क्रिटिकल पाथ, अर्न्ड वैल्यू और संसाधन समतलीकरण का उपयोग"
  - en: "Explain project organisation, ethics and workplace safety"
    zh: "说明项目组织、职业道德和职业健康安全"
    zh-TW: "說明專案組織、專業倫理與職業安全衛生"
    ja: "プロジェクト組織・職業倫理・労働安全を説明する"
    ko: "프로젝트 조직, 직업 윤리, 산업 안전 설명하기"
    vi: "Giải thích tổ chức dự án, đạo đức nghề nghiệp và an toàn lao động"
    ms: "Menerangkan organisasi projek, etika dan keselamatan pekerjaan"
    id: "Menjelaskan organisasi proyek, etika dan K3"
    hi: "प्रोजेक्ट संगठन, पेशेवर नैतिकता और कार्यस्थल सुरक्षा समझाना"
  - en: "Apply digital tools such as BIM and sensors to projects"
    zh: "把 BIM 和传感器等数字工具用于项目"
    zh-TW: "將 BIM 與感測器等數位工具用於專案"
    ja: "BIMやセンサーなどのデジタル技術を事業に使う"
    ko: "BIM과 센서 같은 디지털 도구를 프로젝트에 적용하기"
    vi: "Áp dụng công cụ số như BIM và cảm biến vào dự án"
    ms: "Menggunakan alat digital seperti BIM dan sensor dalam projek"
    id: "Menerapkan alat digital seperti BIM dan sensor pada proyek"
    hi: "परियोजनाओं में BIM और सेंसर जैसे डिजिटल टूल लागू करना"
