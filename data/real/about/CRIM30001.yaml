code: CRIM30001
year: 2026
learn:
  en: "How crime and justice policy gets made in Australia and elsewhere, and how to turn research into policy advice."
  zh: "澳大利亚等地的犯罪与司法政策如何制定，以及如何把研究变成政策建议。"
  zh-TW: "澳洲等地的犯罪與司法政策如何制定，以及如何把研究變成政策建議。"
  ja: "オーストラリアなどで犯罪・司法政策がどう作られ、研究をどう政策提言にするかを学ぶ。"
  ko: "호주 등지에서 범죄·사법 정책이 어떻게 만들어지는지, 연구를 어떻게 정책 제언으로 바꾸는지 배운다."
  vi: "Chính sách tội phạm và tư pháp được hình thành ra sao ở Úc và nơi khác, và cách biến nghiên cứu thành khuyến nghị chính sách."
  ms: "Cara dasar jenayah dan keadilan dibuat di Australia dan tempat lain, serta cara menukar kajian menjadi nasihat dasar."
  id: "Cara kebijakan kejahatan dan peradilan dibuat di Australia dan negara lain, serta mengubah riset jadi saran kebijakan."
  hi: "ऑस्ट्रेलिया और दूसरी जगहों पर अपराध व न्याय नीति कैसे बनती है, और शोध को नीति सलाह में कैसे बदलें।"
outcomes:
  - en: "Explain the theory behind public policy in Australia"
    zh: "说明澳大利亚公共政策背后的理论"
    zh-TW: "說明澳洲公共政策背後的理論"
    ja: "オーストラリアの公共政策の理論的な基礎を説明する"
    ko: "호주 공공 정책의 이론적 바탕 설명하기"
    vi: "Giải thích nền tảng lý thuyết của chính sách công ở Úc"
    ms: "Terangkan teori di sebalik dasar awam di Australia"
    id: "Menjelaskan teori di balik kebijakan publik Australia"
    hi: "ऑस्ट्रेलिया में सार्वजनिक नीति के पीछे का सिद्धांत समझाना"
  - en: "Identify challenges in making and reforming policy"
    zh: "找出制定和改革政策时的难点"
    zh-TW: "找出制定和改革政策時的難點"
    ja: "政策づくりと改革の難しさを見極める"
    ko: "정책 수립과 개혁의 어려움 파악하기"
    vi: "Nhận ra khó khăn khi xây dựng và cải cách chính sách"
    ms: "Kenal pasti cabaran membuat dan mereformasi dasar"
    id: "Mengenali tantangan menyusun dan mereformasi kebijakan"
    hi: "नीति बनाने और सुधारने की चुनौतियाँ पहचानना"
  - en: "Prepare a policy brief based on research"
    zh: "根据研究撰写一份政策简报"
    zh-TW: "根據研究撰寫一份政策簡報"
    ja: "研究に基づいて政策ブリーフを書く"
    ko: "연구를 바탕으로 정책 브리프 작성하기"
    vi: "Soạn bản tóm tắt chính sách dựa trên nghiên cứu"
    ms: "Sediakan ringkasan dasar berdasarkan kajian"
    id: "Menyusun ringkasan kebijakan berbasis riset"
    hi: "शोध के आधार पर एक पॉलिसी ब्रीफ़ तैयार करना"
