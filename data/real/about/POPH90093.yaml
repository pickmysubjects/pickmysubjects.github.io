code: POPH90093
year: 2027
learn:
  en: "Principles and methods of economic evaluation in health care and how it guides spending decisions."
  zh: "医疗卫生领域经济评价的原理和方法，以及它如何指导资源分配。"
  zh-TW: "醫療衛生領域經濟評估的原理與方法，以及它如何指導資源分配。"
  ja: "医療における経済評価の原理と方法、資源配分への活用。"
  ko: "보건의료 경제성 평가의 원리와 방법, 자원 배분에 활용하는 법."
  vi: "Nguyên lý và phương pháp đánh giá kinh tế trong y tế và cách nó định hướng phân bổ nguồn lực."
  ms: "Prinsip dan kaedah penilaian ekonomi dalam penjagaan kesihatan serta peranannya dalam peruntukan sumber."
  id: "Prinsip dan metode evaluasi ekonomi di layanan kesehatan serta perannya dalam alokasi sumber daya."
  hi: "स्वास्थ्य सेवा में आर्थिक मूल्यांकन के सिद्धांत और विधियाँ, और संसाधन आवंटन में उनकी भूमिका।"
outcomes:
  - en: "Critically review an economic evaluation study"
    zh: "批判性评阅经济评价研究"
    zh-TW: "批判性評閱經濟評估研究"
    ja: "経済評価の研究を批判的に読む"
    ko: "경제성 평가 연구 비판적으로 검토하기"
    vi: "Phản biện một nghiên cứu đánh giá kinh tế"
    ms: "Mengkritik kajian penilaian ekonomi"
    id: "Menelaah kritis studi evaluasi ekonomi"
    hi: "आर्थिक मूल्यांकन अध्ययन की आलोचनात्मक समीक्षा"
  - en: "Describe the main evaluation methods and steps"
    zh: "描述主要评价方法和步骤"
    zh-TW: "描述主要評估方法與步驟"
    ja: "主な評価手法と手順を説明する"
    ko: "주요 평가 방법과 단계 설명하기"
    vi: "Mô tả các phương pháp và bước đánh giá chính"
    ms: "Menerangkan kaedah dan langkah penilaian utama"
    id: "Menjelaskan metode dan langkah evaluasi utama"
    hi: "मुख्य मूल्यांकन विधियाँ और चरण बताना"
  - en: "Use evidence to set health priorities"
    zh: "用证据确定卫生优先事项"
    zh-TW: "用證據確定衛生優先事項"
    ja: "エビデンスで医療の優先順位を決める"
    ko: "근거로 보건 우선순위 정하기"
    vi: "Dùng bằng chứng để đặt ưu tiên y tế"
    ms: "Mengguna bukti untuk menetapkan keutamaan kesihatan"
    id: "Memakai bukti untuk menetapkan prioritas kesehatan"
    hi: "साक्ष्य से स्वास्थ्य प्राथमिकताएँ तय करना"
