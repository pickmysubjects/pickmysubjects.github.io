code: MKTG30008
year: 2026
learn:
  en: "What brain science and psychology can tell marketers, and the neuroscience tools used in marketing research."
  zh: "脑科学和心理学能给营销带来什么，以及营销研究中用的神经科学工具。"
  zh-TW: "腦科學和心理學能為行銷帶來什麼，以及行銷研究中用到的神經科學工具。"
  ja: "脳科学と心理学がマーケティングに教えること、市場調査で使う神経科学の手法。"
  ko: "뇌과학과 심리학이 마케팅에 주는 통찰과 마케팅 연구에 쓰는 신경과학 도구."
  vi: "Khoa học não bộ và tâm lý học cho marketer biết gì, và công cụ thần kinh học dùng trong nghiên cứu marketing."
  ms: "Apa yang sains otak dan psikologi beritahu pemasar, dan alat neurosains dalam kajian pemasaran."
  id: "Apa yang ilmu otak dan psikologi sampaikan ke pemasar, serta alat neurosains dalam riset pemasaran."
  hi: "ब्रेन साइंस और मनोविज्ञान मार्केटर को क्या बताते हैं, और मार्केटिंग रिसर्च के न्यूरोसाइंस टूल।"
outcomes:
  - en: "Judge the strengths and limits of neuromarketing tools"
    zh: "评判神经营销工具的优缺点"
    zh-TW: "評斷神經行銷工具的優缺點"
    ja: "ニューロマーケティング手法の長所と限界を見極める"
    ko: "뉴로마케팅 도구의 장단점 판단하기"
    vi: "Đánh giá ưu, nhược điểm của công cụ neuromarketing"
    ms: "Nilai kekuatan dan had alat neuropemasaran"
    id: "Menilai kelebihan dan batas alat neuromarketing"
    hi: "न्यूरोमार्केटिंग टूल की ताकत और सीमाएँ परखना"
  - en: "Apply brain research insights to marketing"
    zh: "把脑科学研究洞见用于营销"
    zh-TW: "把腦科學研究洞見用在行銷"
    ja: "脳研究の知見をマーケティングに活かす"
    ko: "뇌 연구 통찰을 마케팅에 적용하기"
    vi: "Áp dụng hiểu biết từ nghiên cứu não vào marketing"
    ms: "Guna dapatan kajian otak dalam pemasaran"
    id: "Menerapkan temuan riset otak ke pemasaran"
    hi: "ब्रेन रिसर्च की सीख मार्केटिंग में लगाना"
  - en: "Discuss ethical issues in brain-imaging research"
    zh: "讨论脑成像研究中的伦理问题"
    zh-TW: "討論腦成像研究中的倫理問題"
    ja: "脳画像研究の倫理的な問題を論じる"
    ko: "뇌 영상 연구의 윤리 문제 토론하기"
    vi: "Thảo luận vấn đề đạo đức trong nghiên cứu hình ảnh não"
    ms: "Bincangkan isu etika dalam penyelidikan pengimejan otak"
    id: "Membahas isu etika dalam riset pencitraan otak"
    hi: "ब्रेन-इमेजिंग रिसर्च के नैतिक मुद्दों पर चर्चा करना"
