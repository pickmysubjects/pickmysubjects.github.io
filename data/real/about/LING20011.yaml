code: LING20011
year: 2026
learn:
  en: "A close look at English grammar using linguistic analysis: word classes, tense, clauses and how sentences connect."
  zh: "用语言学分析细看英语语法：词类、时态、从句以及句子之间如何衔接。"
  zh-TW: "用語言學分析細看英語語法：詞類、時態、子句以及句子之間如何銜接。"
  ja: "言語学的な分析で英語の文法を詳しく見る。品詞、時制、節、文どうしのつながり。"
  ko: "언어학적 분석으로 영어 문법을 자세히 본다. 품사, 시제, 절, 문장 간 연결을 다룬다."
  vi: "Xem kỹ ngữ pháp tiếng Anh bằng phân tích ngôn ngữ học: từ loại, thì, mệnh đề và cách các câu liên kết."
  ms: "Melihat tatabahasa Inggeris secara dekat dengan analisis linguistik: golongan kata, kala, klausa dan pertautan ayat."
  id: "Melihat tata bahasa Inggris secara rinci dengan analisis linguistik: kelas kata, kala, klausa, dan pertautan kalimat."
  hi: "भाषावैज्ञानिक विश्लेषण से अंग्रेज़ी व्याकरण को बारीकी से देखना: शब्द-भेद, काल, उपवाक्य और वाक्यों का जुड़ाव।"
outcomes:
  - en: "Describe the major elements of English grammar"
    zh: "描述英语语法的主要成分"
    zh-TW: "描述英語語法的主要成分"
    ja: "英文法の主な要素を説明する"
    ko: "영어 문법의 주요 요소 설명하기"
    vi: "Mô tả các thành phần chính của ngữ pháp tiếng Anh"
    ms: "Huraikan unsur utama tatabahasa Inggeris"
    id: "Menguraikan unsur utama tata bahasa Inggris"
    hi: "अंग्रेज़ी व्याकरण के मुख्य तत्वों का वर्णन करना"
  - en: "Analyse grammar in different kinds of text"
    zh: "分析不同类型文本中的语法"
    zh-TW: "分析不同類型文本中的語法"
    ja: "さまざまな種類の文章の文法を分析する"
    ko: "여러 종류의 텍스트에서 문법 분석하기"
    vi: "Phân tích ngữ pháp trong nhiều loại văn bản"
    ms: "Analisis tatabahasa dalam pelbagai jenis teks"
    id: "Menganalisis tata bahasa dalam berbagai jenis teks"
    hi: "अलग-अलग तरह के पाठों में व्याकरण का विश्लेषण करना"
  - en: "Improve your own writing across text types"
    zh: "提升自己在不同文体中的写作"
    zh-TW: "提升自己在不同文體中的寫作"
    ja: "さまざまな文章で自分の書く力を高める"
    ko: "여러 글 유형에서 자신의 글쓰기 향상하기"
    vi: "Nâng cao kỹ năng viết của bản thân ở nhiều thể loại"
    ms: "Tingkatkan penulisan sendiri dalam pelbagai jenis teks"
    id: "Meningkatkan tulisan sendiri di berbagai jenis teks"
    hi: "अलग-अलग तरह के पाठों में अपना लेखन सुधारना"
