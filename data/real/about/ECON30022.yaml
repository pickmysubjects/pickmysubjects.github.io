code: ECON30022
year: 2026
learn:
  en: "Using controlled lab and field experiments to test economic theories and policies, often by playing them in class."
  zh: "用实验室和实地实验检验经济理论和政策，课上常亲自参与。"
  zh-TW: "用實驗室和田野實驗檢驗經濟理論和政策，課堂上常親自參與。"
  ja: "実験室・フィールド実験で経済理論や政策を検証。授業で実験に参加することも多い。"
  ko: "실험실·현장 실험으로 경제 이론과 정책을 검증하며, 수업에서 직접 참여하기도 함."
  vi: "Dùng thí nghiệm trong phòng lab và thực địa để kiểm định lý thuyết, chính sách kinh tế, thường tham gia ngay trên lớp."
  ms: "Guna eksperimen makmal dan lapangan untuk uji teori dan dasar ekonomi, selalunya dimainkan dalam kelas."
  id: "Memakai eksperimen lab dan lapangan untuk menguji teori dan kebijakan ekonomi, sering dimainkan di kelas."
  hi: "लैब और फ़ील्ड प्रयोगों से आर्थिक सिद्धांत और नीतियाँ जाँचना, अक्सर क्लास में खुद हिस्सा लेकर।"
outcomes:
  - en: "Use lab experiments as a research method"
    zh: "把实验室实验当作研究方法"
    zh-TW: "把實驗室實驗當作研究方法"
    ja: "実験室実験を研究手法として使う"
    ko: "실험실 실험을 연구 방법으로 활용하기"
    vi: "Dùng thí nghiệm lab làm phương pháp nghiên cứu"
    ms: "Guna eksperimen makmal sebagai kaedah kajian"
    id: "Memakai eksperimen lab sebagai metode riset"
    hi: "लैब प्रयोगों को रिसर्च तरीके के रूप में इस्तेमाल करना"
  - en: "Test how well different theories predict behaviour"
    zh: "检验不同理论预测行为的能力"
    zh-TW: "檢驗不同理論預測行為的能力"
    ja: "理論ごとの予測力を検証する"
    ko: "이론별 행동 예측력 검증하기"
    vi: "Kiểm tra mức dự đoán hành vi của các lý thuyết"
    ms: "Uji sejauh mana teori meramal tingkah laku"
    id: "Menguji seberapa baik teori memprediksi perilaku"
    hi: "अलग सिद्धांत व्यवहार का कितना सही अनुमान लगाते हैं, जाँचना"
  - en: "Explain risk, time and social preferences"
    zh: "解释风险、时间和社会偏好"
    zh-TW: "解釋風險、時間和社會偏好"
    ja: "リスク・時間・社会的選好を説明する"
    ko: "위험·시간·사회적 선호 설명하기"
    vi: "Giải thích sở thích về rủi ro, thời gian và xã hội"
    ms: "Terangkan keutamaan risiko, masa dan sosial"
    id: "Menjelaskan preferensi risiko, waktu dan sosial"
    hi: "जोखिम, समय और सामाजिक पसंदों को समझाना"
