code: ACTL30011
year: 2027
learn:
  en: "Actuarial practice: insurance markets and products, underwriting, policy design, modelling, assumptions and reserving."
  zh: "精算实务：保险市场与产品、核保、保单设计、建模、假设和准备金。"
  zh-TW: "精算實務：保險市場與產品、核保、保單設計、建模、假設和準備金。"
  ja: "アクチュアリー実務：保険市場と商品、引受、契約設計、モデル化、前提、責任準備金。"
  ko: "보험계리 실무: 보험 시장과 상품, 언더라이팅, 보험 설계, 모델링, 가정, 준비금."
  vi: "Thực hành định phí: thị trường và sản phẩm bảo hiểm, thẩm định, thiết kế hợp đồng, mô hình, giả định và dự phòng."
  ms: "Amalan aktuari: pasaran dan produk insurans, pengunderaitan, reka bentuk polisi, pemodelan, andaian dan rizab."
  id: "Praktik aktuaria: pasar dan produk asuransi, underwriting, desain polis, pemodelan, asumsi, dan cadangan."
  hi: "एक्चुअरियल प्रैक्टिस: बीमा बाज़ार व उत्पाद, अंडरराइटिंग, पॉलिसी डिज़ाइन, मॉडलिंग, धारणाएँ और रिज़र्विंग।"
outcomes:
  - en: "Apply the actuarial control cycle in business cases"
    zh: "在商业情境中运用精算控制循环"
    zh-TW: "在商業情境中運用精算控制循環"
    ja: "ビジネスの場面でアクチュアリアル・コントロール・サイクルを使う"
    ko: "비즈니스 상황에 계리 통제 순환 적용하기"
    vi: "Áp dụng chu trình kiểm soát định phí vào tình huống kinh doanh"
    ms: "Guna kitaran kawalan aktuari dalam kes perniagaan"
    id: "Menerapkan siklus kontrol aktuaria dalam kasus bisnis"
    hi: "कारोबारी मामलों में एक्चुअरियल कंट्रोल साइकल लागू करना"
  - en: "Identify and assess risks with a risk framework"
    zh: "用风险框架识别和评估风险"
    zh-TW: "用風險框架辨識和評估風險"
    ja: "リスクの枠組みでリスクを特定・評価する"
    ko: "리스크 프레임워크로 위험 파악·평가하기"
    vi: "Nhận diện và đánh giá rủi ro bằng khung quản trị rủi ro"
    ms: "Kenal pasti dan nilai risiko dengan rangka kerja risiko"
    id: "Mengidentifikasi dan menilai risiko dengan kerangka risiko"
    hi: "जोखिम फ़्रेमवर्क से जोखिम पहचानना और आँकना"
  - en: "Design products and model client problems"
    zh: "设计产品并为客户问题建模"
    zh-TW: "設計產品並為客戶問題建模"
    ja: "商品を設計し、顧客の課題をモデル化する"
    ko: "상품을 설계하고 고객 문제를 모델링하기"
    vi: "Thiết kế sản phẩm và lập mô hình cho vấn đề khách hàng"
    ms: "Reka produk dan modelkan masalah pelanggan"
    id: "Merancang produk dan memodelkan masalah klien"
    hi: "उत्पाद डिज़ाइन करना और क्लाइंट की समस्याओं का मॉडल बनाना"
