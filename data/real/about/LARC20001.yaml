code: LARC20001
year: 2026
learn:
  en: "Designing with plants, soil and animals as living materials, and how ecosystems work from wild land to cities."
  zh: "以植物、土壤和动物为活体材料进行设计，理解从自然到城市的生态系统。"
  zh-TW: "以植物、土壤和動物為活體材料進行設計，理解從自然到城市的生態系統。"
  ja: "植物・土・動物を生きた素材として設計し、自然から都市までの生態系を理解する。"
  ko: "식물·흙·동물을 살아 있는 재료로 설계하고 자연에서 도시까지 생태계를 이해한다."
  vi: "Thiết kế với cây, đất, động vật như vật liệu sống, và hiểu hệ sinh thái từ tự nhiên đến đô thị."
  ms: "Mereka bentuk dengan tumbuhan, tanah dan haiwan sebagai bahan hidup, dan faham ekosistem dari alam ke bandar."
  id: "Merancang dengan tanaman, tanah, dan hewan sebagai material hidup, serta memahami ekosistem alam hingga kota."
  hi: "पौधों, मिट्टी और जानवरों को जीवित सामग्री मानकर डिज़ाइन, जंगल से शहर तक इकोसिस्टम समझना।"
outcomes:
  - en: "Explain how plants and soils function"
    zh: "说明植物和土壤如何运作"
    zh-TW: "說明植物和土壤如何運作"
    ja: "植物と土の働きを説明する"
    ko: "식물과 흙의 작동 방식 설명하기"
    vi: "Giải thích cây và đất hoạt động ra sao"
    ms: "Jelaskan fungsi tumbuhan dan tanah"
    id: "Menjelaskan fungsi tanaman dan tanah"
    hi: "पौधे और मिट्टी कैसे काम करते हैं, समझाना"
  - en: "Use plants to shape space in a design"
    zh: "用植物在设计中塑造空间"
    zh-TW: "用植物在設計中塑造空間"
    ja: "植物で空間をつくる"
    ko: "식물로 공간 만들기"
    vi: "Dùng cây xanh để tạo không gian"
    ms: "Guna tumbuhan untuk membentuk ruang"
    id: "Memakai tanaman untuk membentuk ruang"
    hi: "डिज़ाइन में पौधों से स्पेस गढ़ना"
  - en: "Design for both people and ecology"
    zh: "兼顾人与生态进行设计"
    zh-TW: "兼顧人與生態進行設計"
    ja: "人と生態の両方のために設計する"
    ko: "사람과 생태 모두를 위한 설계하기"
    vi: "Thiết kế cho cả con người và sinh thái"
    ms: "Reka untuk manusia dan ekologi"
    id: "Merancang untuk manusia dan ekologi"
    hi: "लोगों और पारिस्थितिकी दोनों के लिए डिज़ाइन"
