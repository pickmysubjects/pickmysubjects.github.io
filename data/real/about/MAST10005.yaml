code: MAST10005
year: 2026
learn:
  en: "More functions and calculus, plus an introduction to vectors and complex numbers."
  zh: "进一步学函数和微积分，并入门向量和复数。"
  zh-TW: "進一步學函數和微積分，並入門向量和複數。"
  ja: "関数と微積分をさらに学び、ベクトルと複素数の入門も。"
  ko: "함수와 미적분 심화, 벡터와 복소수 입문."
  vi: "Học thêm hàm số và giải tích, kèm nhập môn vectơ và số phức."
  ms: "Lebih banyak fungsi dan kalkulus, serta pengenalan vektor dan nombor kompleks."
  id: "Lebih dalam tentang fungsi dan kalkulus, plus pengantar vektor dan bilangan kompleks."
  hi: "फ़ंक्शन और कैलकुलस आगे, साथ में वेक्टर और कॉम्प्लेक्स नंबर का परिचय।"
outcomes:
  - en: "Differentiate and sketch more types of functions"
    zh: "对更多函数求导和画图"
    zh-TW: "對更多函數求導和畫圖"
    ja: "より多くの関数を微分しグラフを描く"
    ko: "더 다양한 함수의 미분과 그래프 그리기"
    vi: "Đạo hàm và vẽ đồ thị nhiều loại hàm hơn"
    ms: "Bezakan dan lakar lebih banyak jenis fungsi"
    id: "Menurunkan dan menggambar lebih banyak jenis fungsi"
    hi: "और प्रकार के फ़ंक्शन का अवकलन और ग्राफ़ बनाना"
  - en: "Solve integrals and simple differential equations"
    zh: "解积分和简单微分方程"
    zh-TW: "解積分和簡單微分方程"
    ja: "積分と簡単な微分方程式を解く"
    ko: "적분과 간단한 미분방정식 풀기"
    vi: "Giải tích phân và phương trình vi phân đơn giản"
    ms: "Selesaikan kamiran dan persamaan pembezaan mudah"
    id: "Menyelesaikan integral dan persamaan diferensial sederhana"
    hi: "इंटीग्रल और सरल अवकल समीकरण हल करना"
  - en: "Calculate with vectors and complex numbers"
    zh: "计算向量和复数"
    zh-TW: "計算向量和複數"
    ja: "ベクトルと複素数の計算をする"
    ko: "벡터와 복소수 계산"
    vi: "Tính toán với vectơ và số phức"
    ms: "Kira dengan vektor dan nombor kompleks"
    id: "Menghitung dengan vektor dan bilangan kompleks"
    hi: "वेक्टर और कॉम्प्लेक्स नंबर से गणना"
