code: ACCT90015
year: 2027
learn:
  en: "Contract law, negligence and Australian company law as they apply to running a business."
  zh: "适用于企业经营的合同法、过失侵权法和澳大利亚公司法。"
  zh-TW: "適用於企業經營的契約法、過失侵權法與澳洲公司法。"
  ja: "事業運営に関わる契約法、過失責任、オーストラリア会社法。"
  ko: "기업 운영에 적용되는 계약법, 과실책임, 호주 회사법."
  vi: "Luật hợp đồng, sơ suất và luật công ty Úc áp dụng trong kinh doanh."
  ms: "Undang-undang kontrak, kecuaian dan undang-undang syarikat Australia dalam menjalankan perniagaan."
  id: "Hukum kontrak, kelalaian, dan hukum perusahaan Australia dalam menjalankan bisnis."
  hi: "व्यवसाय चलाने पर लागू अनुबंध कानून, लापरवाही और ऑस्ट्रेलियाई कंपनी कानून।"
outcomes:
  - en: "Identify common legal issues in business"
    zh: "识别企业经营中常见的法律问题"
    zh-TW: "辨識企業經營中常見的法律問題"
    ja: "事業でよくある法的問題を見つける"
    ko: "기업 운영의 흔한 법적 문제 파악하기"
    vi: "Nhận diện vấn đề pháp lý thường gặp trong kinh doanh"
    ms: "Mengenal pasti isu undang-undang biasa dalam perniagaan"
    id: "Mengenali masalah hukum umum dalam bisnis"
    hi: "व्यवसाय में आम कानूनी मुद्दों की पहचान"
  - en: "Apply contract and company law to cases"
    zh: "将合同法和公司法应用于案例"
    zh-TW: "將契約法與公司法應用於案例"
    ja: "契約法と会社法を事例に適用する"
    ko: "계약법과 회사법을 사례에 적용하기"
    vi: "Áp dụng luật hợp đồng và luật công ty vào tình huống"
    ms: "Menggunakan undang-undang kontrak dan syarikat dalam kes"
    id: "Menerapkan hukum kontrak dan perusahaan pada kasus"
    hi: "मामलों पर अनुबंध और कंपनी कानून लागू करना"
