code: AGRI10044
year: 2026
learn:
  en: "How crops and pastures grow: roots, water, nutrients, growth stages, yield and the limits on production."
  zh: "作物和牧草如何生长：根系、水分、养分、生长阶段、产量及生产限制。"
  zh-TW: "作物和牧草如何生長：根系、水分、養分、生長階段、產量及生產限制。"
  ja: "作物と牧草の生育：根、水、養分、生育段階、収量、生産の制約。"
  ko: "작물과 목초의 생장: 뿌리, 물, 양분, 생육 단계, 수확량과 생산 제약."
  vi: "Cây trồng và đồng cỏ phát triển thế nào: rễ, nước, dinh dưỡng, giai đoạn sinh trưởng, năng suất."
  ms: "Cara tanaman dan padang ragut tumbuh: akar, air, nutrien, peringkat tumbesaran, hasil dan kekangan."
  id: "Cara tanaman dan padang rumput tumbuh: akar, air, hara, fase tumbuh, hasil dan kendala produksi."
  hi: "फसलें और चारागाह कैसे बढ़ते हैं: जड़ें, पानी, पोषक तत्व, वृद्धि चरण, उपज और उत्पादन की सीमाएँ।"
outcomes:
  - en: "Monitor and measure crop growth stages"
    zh: "监测并测量作物生长阶段"
    zh-TW: "監測並測量作物生長階段"
    ja: "作物の生育段階を観察・測定する"
    ko: "작물 생육 단계를 관찰·측정한다"
    vi: "Theo dõi và đo các giai đoạn sinh trưởng"
    ms: "Pantau dan ukur peringkat tumbesaran tanaman"
    id: "Memantau dan mengukur fase pertumbuhan tanaman"
    hi: "फसल वृद्धि चरणों की निगरानी और माप करें"
  - en: "Plan a crop season and forecast yield"
    zh: "制定作物季计划并预测产量"
    zh-TW: "擬定作物季計畫並預測產量"
    ja: "作付け計画を立て収量を予測する"
    ko: "작기 계획을 세우고 수확량을 예측한다"
    vi: "Lập kế hoạch mùa vụ và dự báo năng suất"
    ms: "Rancang musim tanaman dan ramal hasil"
    id: "Merencanakan musim tanam dan memprediksi hasil"
    hi: "फसल सीज़न की योजना बनाएँ और उपज का अनुमान लगाएँ"
  - en: "Explain plant water and nutrient uptake"
    zh: "解释植物对水和养分的吸收"
    zh-TW: "解釋植物對水和養分的吸收"
    ja: "植物の水と養分の吸収を説明する"
    ko: "식물의 물·양분 흡수를 설명한다"
    vi: "Giải thích sự hấp thụ nước và dinh dưỡng"
    ms: "Terangkan penyerapan air dan nutrien tumbuhan"
    id: "Menjelaskan penyerapan air dan hara tanaman"
    hi: "पौधों द्वारा पानी और पोषक तत्व ग्रहण समझाएँ"
