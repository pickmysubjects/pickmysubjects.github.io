code: MUSI30287
year: 2026
learn:
  en: "Arranging for big band: ranges, voicings, blend, rhythm section writing and preparing scores and parts in notation software."
  zh: "为大乐队编曲：音域、配声、融合、节奏组写法，以及用打谱软件制作总谱和分谱。"
  zh-TW: "為大樂隊編曲：音域、配聲、融合、節奏組寫法，以及用打譜軟體製作總譜和分譜。"
  ja: "ビッグバンド編曲。音域・ヴォイシング・ブレンド・リズム隊の書法、譜面ソフトでの総譜とパート譜。"
  ko: "빅밴드 편곡: 음역·보이싱·블렌드·리듬 섹션, 악보 프로그램으로 총보와 파트보."
  vi: "Phối khí cho big band: âm vực, voicing, độ hòa, bè nhịp, làm tổng phổ bằng phần mềm."
  ms: "Susunan untuk big band: julat, voicing, seksyen ritma dan skor dengan perisian notasi."
  id: "Aransemen big band: jangkauan, voicing, seksi ritme, dan partitur dengan perangkat lunak."
  hi: "बिग बैंड के लिए अरेंजिंग: रेंज, वॉइसिंग, मेल, रिदम सेक्शन और सॉफ़्टवेयर में स्कोर।"
outcomes:
  - en: "Voice and blend horns for a jazz big band"
    zh: "为爵士大乐队管乐配声并融合"
    zh-TW: "為爵士大樂隊管樂配聲並融合"
    ja: "ビッグバンドの管楽器をヴォイシングし調和させる"
    ko: "빅밴드 관악기 보이싱과 블렌드하기"
    vi: "Phối giọng và hòa âm kèn cho big band"
    ms: "Susun suara dan selaras alat tiup big band"
    id: "Menyusun voicing dan paduan tiup big band"
    hi: "बिग बैंड के वाद्यों की वॉइसिंग और मेल बनाना"
  - en: "Write effective rhythm section parts"
    zh: "写出有效的节奏组声部"
    zh-TW: "寫出有效的節奏組聲部"
    ja: "効果的なリズム隊パートを書く"
    ko: "효과적인 리듬 섹션 파트 쓰기"
    vi: "Viết bè nhịp hiệu quả"
    ms: "Tulis bahagian seksyen ritma yang berkesan"
    id: "Menulis partisi seksi ritme yang efektif"
    hi: "असरदार रिदम सेक्शन भाग लिखना"
  - en: "Produce a full score and parts in notation software"
    zh: "用打谱软件制作完整总谱与分谱"
    zh-TW: "用打譜軟體製作完整總譜與分譜"
    ja: "譜面ソフトで総譜とパート譜を作る"
    ko: "악보 프로그램으로 총보와 파트보 만들기"
    vi: "Làm tổng phổ và bè bằng phần mềm ký âm"
    ms: "Hasilkan skor penuh dengan perisian notasi"
    id: "Membuat partitur lengkap dengan perangkat lunak"
    hi: "नोटेशन सॉफ़्टवेयर में पूरा स्कोर और भाग बनाना"
