code: ENGL20037
year: 2026
learn:
  en: "How modern cities shaped new kinds of writing, and how writers have imagined cities from Dublin to Melbourne."
  zh: "现代城市如何催生新的写作方式，作家又如何想象从都柏林到墨尔本的城市。"
  zh-TW: "現代城市如何催生新的寫作方式，作家又如何想像從都柏林到墨爾本的城市。"
  ja: "近代都市が新しい書き方をどう生み、作家がダブリンからメルボルンまで都市をどう描いたかを学ぶ。"
  ko: "현대 도시가 새로운 글쓰기를 어떻게 낳았고, 작가들이 더블린부터 멜버른까지 도시를 어떻게 그렸는지 배운다."
  vi: "Thành phố hiện đại tạo ra lối viết mới ra sao, và nhà văn hình dung các thành phố từ Dublin đến Melbourne thế nào."
  ms: "Bagaimana bandar moden melahirkan bentuk penulisan baharu, dan cara penulis membayangkan bandar dari Dublin hingga Melbourne."
  id: "Bagaimana kota modern melahirkan bentuk tulisan baru, dan cara penulis membayangkan kota dari Dublin sampai Melbourne."
  hi: "आधुनिक शहरों ने नए तरह के लेखन को कैसे जन्म दिया, और लेखकों ने डबलिन से मेलबर्न तक शहरों की कल्पना कैसे की।"
outcomes:
  - en: "Analyse how literature represents city life"
    zh: "分析文学如何表现城市生活"
    zh-TW: "分析文學如何表現城市生活"
    ja: "文学が都市生活をどう描くか分析する"
    ko: "문학이 도시 생활을 그리는 방식 분석하기"
    vi: "Phân tích cách văn học thể hiện đời sống đô thị"
    ms: "Analisis cara sastera menggambarkan kehidupan bandar"
    id: "Menganalisis cara sastra menggambarkan kehidupan kota"
    hi: "साहित्य शहरी जीवन को कैसे दिखाता है, विश्लेषण करना"
  - en: "Link urban writing to social and economic change"
    zh: "把城市写作与社会经济变化联系起来"
    zh-TW: "把城市寫作與社會經濟變化聯繫起來"
    ja: "都市文学を社会・経済の変化と結びつける"
    ko: "도시 문학을 사회·경제 변화와 연결하기"
    vi: "Liên hệ văn chương đô thị với biến đổi kinh tế xã hội"
    ms: "Kaitkan penulisan bandar dengan perubahan sosial dan ekonomi"
    id: "Mengaitkan tulisan kota dengan perubahan sosial dan ekonomi"
    hi: "शहरी लेखन को सामाजिक-आर्थिक बदलाव से जोड़ना"
  - en: "Compare cities across different texts"
    zh: "比较不同作品中的城市"
    zh-TW: "比較不同作品中的城市"
    ja: "作品ごとの都市を比べる"
    ko: "여러 작품 속 도시 비교하기"
    vi: "So sánh các thành phố trong những văn bản khác nhau"
    ms: "Bandingkan bandar dalam teks berbeza"
    id: "Membandingkan kota dalam berbagai teks"
    hi: "अलग-अलग पाठों में शहरों की तुलना करना"
