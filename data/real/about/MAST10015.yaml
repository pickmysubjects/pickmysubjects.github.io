code: MAST10015
year: 2026
learn:
  en: "VCE-level calculus, statistics and probability, preparing you for a Science or Commerce degree."
  zh: "高中水平的微积分、统计和概率，为理科或商科学位打基础。"
  zh-TW: "高中程度的微積分、統計和機率，為理科或商科學位打基礎。"
  ja: "VCEレベルの微積分・統計・確率で、理系や商学系の学位に備える。"
  ko: "VCE 수준의 미적분, 통계, 확률로 이학·상경 학위를 준비한다."
  vi: "Giải tích, thống kê và xác suất trình độ VCE, chuẩn bị cho bằng Khoa học hoặc Thương mại."
  ms: "Kalkulus, statistik dan kebarangkalian tahap VCE, sebagai persediaan ijazah Sains atau Perdagangan."
  id: "Kalkulus, statistika, dan peluang setingkat VCE, sebagai persiapan gelar Sains atau Bisnis."
  hi: "VCE स्तर का कैलकुलस, स्टैटिस्टिक्स और प्रायिकता, साइंस या कॉमर्स डिग्री की तैयारी के लिए।"
outcomes:
  - en: "Use derivatives to find maximums and minimums"
    zh: "用导数求最大值和最小值"
    zh-TW: "用導數求最大值和最小值"
    ja: "導関数で最大値と最小値を求める"
    ko: "도함수로 최댓값과 최솟값 구하기"
    vi: "Dùng đạo hàm tìm giá trị lớn nhất, nhỏ nhất"
    ms: "Guna terbitan untuk cari nilai maksimum dan minimum"
    id: "Memakai turunan untuk mencari maksimum dan minimum"
    hi: "अवकलज से अधिकतम और न्यूनतम मान निकालना"
  - en: "Find areas under curves by integration"
    zh: "用积分求曲线下面积"
    zh-TW: "用積分求曲線下面積"
    ja: "積分で曲線の下の面積を求める"
    ko: "적분으로 곡선 아래 넓이 구하기"
    vi: "Tính diện tích dưới đường cong bằng tích phân"
    ms: "Cari luas bawah lengkung dengan kamiran"
    id: "Mencari luas di bawah kurva dengan integral"
    hi: "इंटीग्रेशन से कर्व के नीचे का क्षेत्रफल निकालना"
  - en: "Summarise and chart data in Excel"
    zh: "用Excel总结数据并画图"
    zh-TW: "用Excel彙整資料並畫圖"
    ja: "Excelでデータを要約しグラフにする"
    ko: "Excel로 데이터 요약 및 차트 작성"
    vi: "Tóm tắt và vẽ biểu đồ dữ liệu bằng Excel"
    ms: "Ringkas dan carta data dalam Excel"
    id: "Meringkas dan membuat grafik data di Excel"
    hi: "Excel में डेटा का सारांश और चार्ट बनाना"
