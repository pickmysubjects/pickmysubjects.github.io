code: DRAM20028
year: 2026
learn:
  en: "Classical texts such as Shakespeare and Chekhov: rehearse and perform in an ensemble, serving the play's style and the writer's voice."
  zh: "莎士比亚、契诃夫等经典剧作：以剧团形式排演，贴合作品风格与作者声音。"
  zh-TW: "莎士比亞、契訶夫等經典劇作：以劇團形式排演，貼合作品風格與作者聲音。"
  ja: "シェイクスピアやチェーホフなどの古典：アンサンブルで稽古・上演し、作品の様式に寄り添う。"
  ko: "셰익스피어, 체호프 같은 고전: 앙상블로 연습·공연하며 작품의 양식과 작가의 목소리를 살린다."
  vi: "Kịch kinh điển như Shakespeare, Chekhov: tập và diễn theo đoàn, phục vụ phong cách vở và giọng tác giả."
  ms: "Teks klasik seperti Shakespeare dan Chekhov: berlatih dan beraksi secara ensembel mengikut gaya karya."
  id: "Naskah klasik seperti Shakespeare dan Chekhov: berlatih dan pentas secara ansambel sesuai gaya lakon."
  hi: "शेक्सपियर और चेखव जैसे क्लासिक पाठ: समूह में रिहर्सल और मंचन, नाटक की शैली के अनुरूप।"
outcomes:
  - en: "Prepare and speak classical text"
    zh: "准备并念好经典台词"
    zh-TW: "準備並念好經典台詞"
    ja: "古典のせりふを準備し語る"
    ko: "고전 대사를 준비하고 말하기"
    vi: "Chuẩn bị và nói lời thoại kinh điển"
    ms: "Sedia dan tuturkan teks klasik"
    id: "Menyiapkan dan mengucapkan teks klasik"
    hi: "क्लासिक पाठ की तैयारी और बोलना"
  - en: "Work as part of an acting ensemble"
    zh: "作为剧团一员合作"
    zh-TW: "作為劇團一員合作"
    ja: "アンサンブルの一員として演じる"
    ko: "앙상블의 일원으로 연기하기"
    vi: "Làm việc như một thành viên của đoàn diễn"
    ms: "Bekerja sebagai sebahagian ensembel"
    id: "Bekerja sebagai bagian ansambel"
    hi: "अभिनय समूह के सदस्य के रूप में काम"
  - en: "Join voice, body and character in performance"
    zh: "在演出中融合声音、身体与角色"
    zh-TW: "在演出中融合聲音、身體與角色"
    ja: "声・身体・役を上演で統合する"
    ko: "공연에서 목소리, 몸, 인물 통합하기"
    vi: "Hòa quyện giọng, thân thể và nhân vật khi diễn"
    ms: "Satukan suara, tubuh dan watak"
    id: "Memadukan suara, tubuh dan tokoh"
    hi: "प्रस्तुति में आवाज़, शरीर और किरदार को जोड़ना"
