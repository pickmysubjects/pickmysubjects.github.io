code: FINA20044
year: 2026
learn:
  en: "Botanical drawing in pencil and watercolour from live plants and herbarium specimens, plus how artists have shown plants."
  zh: "用铅笔和水彩画植物，对象是活植物和标本馆标本，并了解艺术中的植物"
  zh-TW: "用鉛筆和水彩畫植物，對象是活植物和標本館標本，並了解藝術中的植物"
  ja: "鉛筆と水彩で生きた植物や標本を描くボタニカルアート。美術における植物表現も学ぶ。"
  ko: "연필과 수채화로 살아 있는 식물과 표본을 그리는 보태니컬 드로잉, 미술 속 식물 표현도 학습."
  vi: "Vẽ thực vật bằng chì và màu nước từ cây sống và tiêu bản, cùng cách nghệ thuật thể hiện thực vật."
  ms: "Lukisan botani dengan pensel dan cat air daripada tumbuhan hidup dan spesimen, serta tumbuhan dalam seni."
  id: "Gambar botani dengan pensil dan cat air dari tanaman hidup dan spesimen, serta tumbuhan dalam seni."
  hi: "जीवित पौधों और हर्बेरियम नमूनों से पेंसिल व वॉटरकलर में बॉटैनिकल ड्रॉइंग, और कला में पौधों का चित्रण।"
outcomes:
  - en: "Draw living and preserved plants from observation"
    zh: "通过观察画出活植物和保存标本"
    zh-TW: "透過觀察畫出活植物和保存標本"
    ja: "生きた植物と標本を観察して描く"
    ko: "살아 있는 식물과 표본을 관찰해 그리기"
    vi: "Vẽ cây sống và tiêu bản từ quan sát"
    ms: "Melukis tumbuhan hidup dan spesimen melalui pemerhatian"
    id: "Menggambar tanaman hidup dan spesimen dari pengamatan"
    hi: "देखकर जीवित और संरक्षित पौधे बनाना"
  - en: "Handle pencil and watercolour with growing control"
    zh: "越来越熟练地使用铅笔和水彩"
    zh-TW: "越來越熟練地使用鉛筆和水彩"
    ja: "鉛筆と水彩をより自在に扱う"
    ko: "연필과 수채화를 점점 능숙하게 다루기"
    vi: "Dùng bút chì và màu nước ngày càng thành thạo"
    ms: "Mengawal pensel dan cat air dengan lebih mahir"
    id: "Menguasai pensil dan cat air dengan makin baik"
    hi: "पेंसिल और वॉटरकलर पर बेहतर नियंत्रण पाना"
  - en: "Write about plants in historical and modern art"
    zh: "撰文讨论古今艺术中的植物"
    zh-TW: "撰文討論古今藝術中的植物"
    ja: "古今の美術における植物について書く"
    ko: "과거와 현대 미술 속 식물에 대해 글쓰기"
    vi: "Viết về thực vật trong nghệ thuật xưa và nay"
    ms: "Menulis tentang tumbuhan dalam seni dahulu dan kini"
    id: "Menulis tentang tumbuhan dalam seni dulu dan kini"
    hi: "ऐतिहासिक और आधुनिक कला में पौधों पर लिखना"
