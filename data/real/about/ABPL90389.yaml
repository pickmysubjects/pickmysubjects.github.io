code: ABPL90389
year: 2027
learn:
  en: "An urban design studio using urban analytics, big data and parametric urbanism to build a major design proposal."
  zh: "城市设计工作室，运用城市分析、大数据和参数化城市主义完成大型设计方案。"
  zh-TW: "城市設計工作室，運用城市分析、大數據和參數化城市主義完成大型設計方案。"
  ja: "都市分析・ビッグデータ・パラメトリック都市論を使い大きな設計案をつくるスタジオ。"
  ko: "도시 분석, 빅데이터, 파라메트릭 어바니즘으로 대형 설계안을 만드는 스튜디오."
  vi: "Studio thiết kế đô thị dùng phân tích đô thị, dữ liệu lớn và đô thị tham số cho một đề xuất lớn."
  ms: "Studio reka bentuk bandar dengan analitik bandar, data raya dan urbanisme parametrik."
  id: "Studio desain kota dengan analitik kota, big data, dan urbanisme parametrik untuk usulan besar."
  hi: "अर्बन एनालिटिक्स, बिग डेटा और पैरामीट्रिक अर्बनिज़्म से बड़ा डिज़ाइन प्रस्ताव बनाने वाला स्टूडियो।"
outcomes:
  - en: "Use large data sets to inform design"
    zh: "用大数据支撑设计"
    zh-TW: "用大數據支撐設計"
    ja: "大規模データを設計に生かす"
    ko: "대규모 데이터를 설계에 활용하기"
    vi: "Dùng dữ liệu lớn cho thiết kế"
    ms: "Menggunakan data besar untuk reka bentuk"
    id: "Memakai data besar untuk desain"
    hi: "बड़े डेटा से डिज़ाइन को दिशा देना"
  - en: "Map and present urban analysis at many scales"
    zh: "在多种尺度上绘制并展示城市分析"
    zh-TW: "在多種尺度上繪製並展示城市分析"
    ja: "複数スケールで都市分析を図示する"
    ko: "여러 스케일로 도시 분석 표현하기"
    vi: "Thể hiện phân tích đô thị ở nhiều tỷ lệ"
    ms: "Memetakan analisis bandar pada pelbagai skala"
    id: "Memetakan analisis kota di berbagai skala"
    hi: "कई पैमानों पर शहरी विश्लेषण दिखाना"
