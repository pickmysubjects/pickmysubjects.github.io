code: FNCE30009
year: 2026
learn:
  en: "Ethics in finance and investing, and why it matters for trust in markets. Self-paced online, exam on campus."
  zh: "金融与投资伦理及其对市场信任的意义。线上自学，校内考试。"
  zh-TW: "金融與投資倫理及其對市場信任的意義。線上自學，校內考試。"
  ja: "金融・投資の倫理と市場の信頼にとっての意味。オンライン自習、試験はキャンパス。"
  ko: "금융·투자 윤리와 시장 신뢰에서의 의미. 온라인 자율 학습, 시험은 캠퍼스."
  vi: "Đạo đức trong tài chính và đầu tư, vì sao quan trọng cho niềm tin thị trường. Tự học online, thi tại trường."
  ms: "Etika dalam kewangan dan pelaburan, dan kepentingannya untuk kepercayaan pasaran. Kendiri dalam talian, peperiksaan di kampus."
  id: "Etika dalam keuangan dan investasi, dan pentingnya bagi kepercayaan pasar. Belajar mandiri online, ujian di kampus."
  hi: "वित्त और निवेश में नैतिकता, और बाज़ार के भरोसे के लिए इसका महत्व। ऑनलाइन सेल्फ़-पेस्ड, परीक्षा कैंपस में।"
outcomes:
  - en: "Use ethical theories to work through finance dilemmas"
    zh: "用伦理理论分析金融难题"
    zh-TW: "用倫理理論分析金融難題"
    ja: "倫理理論で金融のジレンマを考える"
    ko: "윤리 이론으로 금융 딜레마 풀어 보기"
    vi: "Dùng lý thuyết đạo đức giải quyết tình huống khó trong tài chính"
    ms: "Guna teori etika untuk dilema kewangan"
    id: "Memakai teori etika untuk dilema keuangan"
    hi: "नैतिक सिद्धांतों से वित्तीय दुविधाएँ सुलझाना"
  - en: "Spot questionable conduct and suggest safeguards"
    zh: "识别不当行为并提出防范措施"
    zh-TW: "辨識不當行為並提出防範措施"
    ja: "不適切な行為を見抜き防止策を示す"
    ko: "부적절한 행위 찾고 예방책 제안하기"
    vi: "Nhận diện hành vi đáng ngờ và đề xuất biện pháp phòng ngừa"
    ms: "Kenal pasti kelakuan meragukan dan cadangkan langkah kawalan"
    id: "Mengenali perilaku meragukan dan mengusulkan pengaman"
    hi: "संदिग्ध आचरण पहचानना और बचाव के उपाय सुझाना"
  - en: "Apply the CFA Code of Ethics and Standards"
    zh: "应用CFA职业道德准则和执业标准"
    zh-TW: "應用CFA職業道德準則和執業標準"
    ja: "CFA倫理規範と職業行為基準を当てはめる"
    ko: "CFA 윤리강령과 직업행위기준 적용하기"
    vi: "Áp dụng Bộ quy tắc đạo đức và Chuẩn mực của CFA"
    ms: "Gunakan Kod Etika dan Piawaian CFA"
    id: "Menerapkan Kode Etik dan Standar CFA"
    hi: "CFA कोड ऑफ़ एथिक्स और स्टैंडर्ड्स लागू करना"
