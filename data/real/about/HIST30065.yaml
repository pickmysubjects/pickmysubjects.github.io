code: HIST30065
year: 2026
learn:
  en: "How the US went from a minor power in 1898 to a global superpower by 2001, through war, money, media and culture."
  zh: "美国如何从1898年的次要大国，借助战争、经济、媒体和文化在2001年前成为全球超级大国。"
  zh-TW: "美國如何從1898年的次要強國，藉助戰爭、經濟、媒體和文化在2001年前成為全球超級強權。"
  ja: "1898年には小さな大国だったアメリカが、戦争・経済・メディア・文化を通じて2001年までに超大国になった過程を学ぶ。"
  ko: "1898년 약소 강국이던 미국이 전쟁, 경제, 미디어, 문화를 통해 2001년까지 초강대국이 된 과정을 배운다."
  vi: "Mỹ đi từ một cường quốc hạng ba năm 1898 thành siêu cường toàn cầu vào 2001 ra sao, qua chiến tranh, tiền bạc, truyền thông, văn hóa."
  ms: "Cara AS berubah daripada kuasa kecil pada 1898 menjadi kuasa besar dunia menjelang 2001, melalui perang, wang, media dan budaya."
  id: "Cara AS berubah dari kekuatan kecil pada 1898 menjadi negara adidaya pada 2001, lewat perang, uang, media, dan budaya."
  hi: "अमेरिका 1898 की एक छोटी ताकत से 2001 तक वैश्विक महाशक्ति कैसे बना, युद्ध, पैसे, मीडिया और संस्कृति के ज़रिए।"
outcomes:
  - en: "Analyse key events in US foreign relations"
    zh: "分析美国对外关系中的关键事件"
    zh-TW: "分析美國對外關係中的關鍵事件"
    ja: "アメリカの対外関係の主な出来事を分析する"
    ko: "미국 대외 관계의 주요 사건 분석하기"
    vi: "Phân tích các sự kiện chính trong quan hệ đối ngoại của Mỹ"
    ms: "Analisis peristiwa utama hubungan luar AS"
    id: "Menganalisis peristiwa utama hubungan luar negeri AS"
    hi: "अमेरिकी विदेश संबंधों की मुख्य घटनाओं का विश्लेषण करना"
  - en: "Engage with debates on whether the US is an empire"
    zh: "参与关于美国是否是帝国的争论"
    zh-TW: "參與關於美國是否為帝國的爭論"
    ja: "アメリカは帝国かという議論に取り組む"
    ko: "미국이 제국인가에 관한 논쟁 다루기"
    vi: "Tham gia tranh luận về việc Mỹ có phải đế quốc hay không"
    ms: "Libatkan diri dalam perdebatan sama ada AS sebuah empayar"
    id: "Terlibat dalam perdebatan apakah AS sebuah kekaisaran"
    hi: "क्या अमेरिका एक साम्राज्य है, इस बहस से जुड़ना"
  - en: "Use sources to evaluate historical arguments"
    zh: "用史料评估历史论点"
    zh-TW: "用史料評估歷史論點"
    ja: "史料を使って歴史的な議論を評価する"
    ko: "사료로 역사적 논증 평가하기"
    vi: "Dùng nguồn sử liệu để đánh giá lập luận lịch sử"
    ms: "Guna sumber untuk menilai hujah sejarah"
    id: "Memakai sumber untuk menilai argumen sejarah"
    hi: "स्रोतों से ऐतिहासिक तर्कों को परखना"
