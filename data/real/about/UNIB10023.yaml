code: UNIB10023
year: 2026
learn:
  en: "How Melbourne grew from its volcanic landscape and Kulin Country into today's city, with field work around town."
  zh: "墨尔本如何从火山地貌和库林族土地发展为今天的城市，含城内实地考察。"
  zh-TW: "墨爾本如何從火山地貌和庫林族土地發展為今天的城市，含城內實地考察。"
  ja: "火山の地形とクリン族の土地から今の都市へ、メルボルンの成り立ちを街歩きで学ぶ。"
  ko: "화산 지형과 쿨린 부족의 땅에서 오늘의 도시로, 멜버른의 성장 과정을 현장 답사로 배우기."
  vi: "Melbourne phát triển từ địa hình núi lửa và đất Kulin thành thành phố ngày nay, kèm thực địa trong thành phố."
  ms: "Cara Melbourne berkembang dari landskap gunung berapi dan tanah Kulin menjadi bandar hari ini."
  id: "Cara Melbourne tumbuh dari bentang vulkanik dan tanah Kulin menjadi kota sekarang, dengan kerja lapangan."
  hi: "मेलबर्न ज्वालामुखी भू-दृश्य और कुलिन भूमि से आज के शहर तक कैसे बढ़ा, शहर में फ़ील्ड वर्क के साथ।"
outcomes:
  - en: "Explain how geography shaped Melbourne"
    zh: "解释地理环境如何塑造墨尔本"
    zh-TW: "解釋地理環境如何塑造墨爾本"
    ja: "地理がメルボルンをどう形づくったか説明する"
    ko: "지리가 멜버른을 어떻게 만들었는지 설명하기"
    vi: "Giải thích địa lý định hình Melbourne ra sao"
    ms: "Terangkan cara geografi membentuk Melbourne"
    id: "Menjelaskan cara geografi membentuk Melbourne"
    hi: "भूगोल ने मेलबर्न को कैसे आकार दिया, समझाना"
  - en: "Trace the city's history from First Peoples on"
    zh: "追溯从原住民时期开始的城市历史"
    zh-TW: "追溯從原住民時期開始的城市歷史"
    ja: "先住民の時代からの都市の歴史をたどる"
    ko: "원주민 시대부터 도시 역사 따라가기"
    vi: "Lần theo lịch sử thành phố từ thời người bản địa"
    ms: "Jejak sejarah bandar sejak Orang Asal"
    id: "Menelusuri sejarah kota sejak masyarakat adat"
    hi: "मूल निवासियों से शुरू कर शहर का इतिहास जानना"
  - en: "Assess the city's strengths and challenges"
    zh: "评估这座城市的优势与挑战"
    zh-TW: "評估這座城市的優勢與挑戰"
    ja: "都市の強みと課題を評価する"
    ko: "도시의 강점과 과제 평가하기"
    vi: "Đánh giá điểm mạnh và thách thức của thành phố"
    ms: "Nilai kekuatan dan cabaran bandar"
    id: "Menilai kekuatan dan tantangan kota"
    hi: "शहर की ताकत और चुनौतियाँ परखना"
