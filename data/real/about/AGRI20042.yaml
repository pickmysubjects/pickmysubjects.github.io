code: AGRI20042
year: 2026
learn:
  en: "Economics of farming and agribusiness: markets, supply and demand, prices, production economics and trade."
  zh: "农业与农商经济学：市场、供需、价格、生产经济学与国际贸易。"
  zh-TW: "農業與農企業經濟學：市場、供需、價格、生產經濟學與國際貿易。"
  ja: "農業とアグリビジネスの経済学：市場、需給、価格、生産経済学、貿易。"
  ko: "농업·농기업 경제학: 시장, 수요와 공급, 가격, 생산경제학, 무역."
  vi: "Kinh tế nông nghiệp và kinh doanh nông sản: thị trường, cung cầu, giá, kinh tế sản xuất, thương mại."
  ms: "Ekonomi pertanian dan agroperniagaan: pasaran, penawaran dan permintaan, harga, pengeluaran, perdagangan."
  id: "Ekonomi pertanian dan agribisnis: pasar, penawaran dan permintaan, harga, ekonomi produksi, perdagangan."
  hi: "खेती और कृषि-व्यवसाय का अर्थशास्त्र: बाज़ार, माँग-आपूर्ति, कीमतें, उत्पादन अर्थशास्त्र और व्यापार।"
outcomes:
  - en: "Explain farm producer and consumer behaviour"
    zh: "解释农业生产者与消费者行为"
    zh-TW: "解釋農業生產者與消費者行為"
    ja: "農業の生産者と消費者の行動を説明する"
    ko: "농업 생산자와 소비자 행동을 설명한다"
    vi: "Giải thích hành vi người sản xuất và tiêu dùng nông sản"
    ms: "Terangkan tingkah laku pengeluar dan pengguna"
    id: "Menjelaskan perilaku produsen dan konsumen pertanian"
    hi: "कृषि उत्पादकों और उपभोक्ताओं का व्यवहार समझाएँ"
  - en: "Analyse economic forces on farms and agribusiness"
    zh: "分析影响农场与农企的经济因素"
    zh-TW: "分析影響農場與農企業的經濟因素"
    ja: "農場と農業企業への経済的要因を分析する"
    ko: "농장과 농기업에 작용하는 경제적 요인을 분석한다"
    vi: "Phân tích tác động kinh tế lên trang trại, doanh nghiệp"
    ms: "Analisis daya ekonomi pada ladang dan agroperniagaan"
    id: "Menganalisis faktor ekonomi pada pertanian dan agribisnis"
    hi: "खेतों और कृषि-व्यवसाय पर आर्थिक शक्तियों का विश्लेषण करें"
