code: MECM30017
year: 2026
learn:
  en: "Making news on a phone: shooting video, recording audio, writing and editing stories for digital platforms, with media ethics in mind."
  zh: "用手机做新闻：拍视频、录音、为数字平台撰写和剪辑报道，同时兼顾媒体伦理。"
  zh-TW: "用手機做新聞：拍影片、錄音、為數位平台撰寫和剪輯報導，同時兼顧媒體倫理。"
  ja: "スマホでニュースを作る：動画撮影、録音、デジタル向けの記事の執筆と編集を、メディア倫理を踏まえて学ぶ。"
  ko: "휴대폰으로 뉴스 만들기: 영상 촬영, 녹음, 디지털 플랫폼용 기사 작성과 편집을 미디어 윤리와 함께 배운다."
  vi: "Làm tin bằng điện thoại: quay video, ghi âm, viết và biên tập bài cho nền tảng số, có tính đến đạo đức truyền thông."
  ms: "Menghasilkan berita dengan telefon: merakam video dan audio, menulis serta menyunting cerita untuk platform digital, dengan etika media."
  id: "Membuat berita lewat ponsel: merekam video dan audio, menulis serta menyunting cerita untuk platform digital, dengan memperhatikan etika media."
  hi: "फ़ोन से खबर बनाना: वीडियो शूट करना, ऑडियो रिकॉर्ड करना, डिजिटल प्लेटफ़ॉर्म के लिए स्टोरी लिखना और एडिट करना, मीडिया नैतिकता के साथ।"
outcomes:
  - en: "Shoot video and record audio to a professional standard"
    zh: "按专业标准拍摄视频和录制音频"
    zh-TW: "按專業標準拍攝影片和錄製音訊"
    ja: "プロ水準で動画を撮り音声を録る"
    ko: "전문가 수준으로 영상 촬영하고 녹음하기"
    vi: "Quay video và ghi âm đạt chuẩn chuyên nghiệp"
    ms: "Rakam video dan audio pada tahap profesional"
    id: "Merekam video dan audio sesuai standar profesional"
    hi: "प्रोफ़ेशनल स्तर पर वीडियो शूट और ऑडियो रिकॉर्ड करना"
  - en: "Write and edit breaking news and longer stories"
    zh: "撰写和编辑突发新闻与深度报道"
    zh-TW: "撰寫和編輯突發新聞與深度報導"
    ja: "速報と長めの記事を書いて編集する"
    ko: "속보와 긴 기사 쓰고 편집하기"
    vi: "Viết và biên tập tin nóng lẫn bài dài"
    ms: "Tulis dan sunting berita terkini serta cerita panjang"
    id: "Menulis dan menyunting berita terkini dan cerita panjang"
    hi: "ब्रेकिंग न्यूज़ और लंबी स्टोरी लिखना व एडिट करना"
  - en: "Apply media ethics to digital journalism"
    zh: "在数字新闻中遵守媒体伦理"
    zh-TW: "在數位新聞中遵守媒體倫理"
    ja: "デジタル報道にメディア倫理を当てはめる"
    ko: "디지털 저널리즘에 미디어 윤리 적용하기"
    vi: "Áp dụng đạo đức truyền thông vào báo chí số"
    ms: "Guna etika media dalam kewartawanan digital"
    id: "Menerapkan etika media dalam jurnalisme digital"
    hi: "डिजिटल पत्रकारिता में मीडिया नैतिकता लागू करना"
