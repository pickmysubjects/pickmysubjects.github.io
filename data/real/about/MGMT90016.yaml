code: MGMT90016
year: 2027
learn:
  en: "How organisations assess staff performance and use it to pay and reward people, and whether that is fair and works."
  zh: "组织如何评估员工绩效并据此发放薪酬奖励，以及这样做是否公平有效。"
  zh-TW: "組織如何評估員工績效並據此發放薪酬獎勵，以及這樣做是否公平有效。"
  ja: "組織が社員の業績をどう評価し報酬に結びつけるか、それが公平で有効かを学ぶ。"
  ko: "조직이 직원 성과를 어떻게 평가해 보상에 반영하는지, 그것이 공정하고 효과적인지 배운다."
  vi: "Tổ chức đánh giá hiệu suất nhân viên và dùng nó để trả lương, thưởng ra sao, và liệu có công bằng, hiệu quả."
  ms: "Cara organisasi menilai prestasi pekerja dan menggunakannya untuk gaji dan ganjaran, serta sama ada ia adil dan berkesan."
  id: "Cara organisasi menilai kinerja karyawan dan memakainya untuk gaji dan imbalan, serta apakah itu adil dan efektif."
  hi: "संगठन कर्मचारियों का प्रदर्शन कैसे आँकते हैं और उससे वेतन-पुरस्कार कैसे देते हैं, और क्या यह न्यायसंगत व असरदार है।"
outcomes:
  - en: "Evaluate performance and reward systems"
    zh: "评价绩效与薪酬体系"
    zh-TW: "評價績效與薪酬制度"
    ja: "業績・報酬制度を評価する"
    ko: "성과·보상 제도 평가하기"
    vi: "Đánh giá hệ thống hiệu suất và lương thưởng"
    ms: "Menilai sistem prestasi dan ganjaran"
    id: "Menilai sistem kinerja dan imbalan"
    hi: "प्रदर्शन और पुरस्कार प्रणालियों का मूल्यांकन करना"
  - en: "See them from employee and manager views"
    zh: "从员工和管理者角度看待这些体系"
    zh-TW: "從員工與主管角度看待這些制度"
    ja: "社員と上司の立場から見る"
    ko: "직원과 관리자 관점에서 보기"
    vi: "Nhìn từ góc độ nhân viên và quản lý"
    ms: "Melihatnya dari sudut pekerja dan pengurus"
    id: "Melihatnya dari sudut karyawan dan manajer"
    hi: "कर्मचारी और प्रबंधक के नज़रिए से देखना"
