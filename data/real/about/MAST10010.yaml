code: MAST10010
year: 2026
learn:
  en: "Probability and statistics through real data in R: graphs, confidence intervals, hypothesis tests, regression."
  zh: "用R分析真实数据，学概率统计、置信区间、假设检验和回归"
  zh-TW: "用R分析真實資料，學機率統計、信賴區間、假設檢定和迴歸"
  ja: "Rで実データを分析し、確率・統計、信頼区間、仮説検定、回帰を学ぶ。"
  ko: "R로 실제 데이터를 분석하며 확률·통계, 신뢰구간, 가설검정, 회귀를 배운다."
  vi: "Xác suất và thống kê qua dữ liệu thực bằng R: biểu đồ, khoảng tin cậy, kiểm định, hồi quy."
  ms: "Kebarangkalian dan statistik dengan data sebenar dalam R: graf, selang keyakinan, ujian hipotesis, regresi."
  id: "Probabilitas dan statistik dengan data nyata di R: grafik, selang kepercayaan, uji hipotesis, regresi."
  hi: "R में असली डेटा से प्रायिकता और सांख्यिकी: ग्राफ़, विश्वास अंतराल, परिकल्पना परीक्षण, रिग्रेशन।"
outcomes:
  - en: "Run hypothesis tests and confidence intervals"
    zh: "做假设检验和置信区间"
    zh-TW: "做假設檢定和信賴區間"
    ja: "仮説検定と信頼区間を行う"
    ko: "가설검정과 신뢰구간 계산하기"
    vi: "Thực hiện kiểm định và khoảng tin cậy"
    ms: "Menjalankan ujian hipotesis dan selang keyakinan"
    id: "Melakukan uji hipotesis dan selang kepercayaan"
    hi: "परिकल्पना परीक्षण और विश्वास अंतराल निकालना"
  - en: "Clean, plot and analyse data in R"
    zh: "用R整理、画图和分析数据"
    zh-TW: "用R整理、繪圖和分析資料"
    ja: "Rでデータを整理・可視化・分析する"
    ko: "R로 데이터 정리·시각화·분석하기"
    vi: "Xử lý, vẽ và phân tích dữ liệu bằng R"
    ms: "Mengurus, memplot dan menganalisis data dalam R"
    id: "Mengolah, memplot, dan menganalisis data di R"
    hi: "R में डेटा साफ़ करना, प्लॉट और विश्लेषण करना"
  - en: "Spot bias in sampling and study design"
    zh: "识别抽样和实验设计中的偏差"
    zh-TW: "辨識抽樣和實驗設計中的偏誤"
    ja: "標本抽出や研究デザインの偏りを見抜く"
    ko: "표본추출·연구설계의 편향 찾기"
    vi: "Nhận ra sai lệch trong lấy mẫu và thiết kế"
    ms: "Mengenal pasti bias dalam persampelan dan reka bentuk"
    id: "Mengenali bias dalam sampling dan desain studi"
    hi: "सैंपलिंग और अध्ययन डिज़ाइन में पक्षपात पहचानना"
