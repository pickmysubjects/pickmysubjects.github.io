code: ORAL30002
year: 2026
learn:
  en: "The final clinical year: full patient care across clinics and a rural placement, ending with a clinical assessment for practice."
  zh: "最后一年临床：在多个诊所和乡村实习中全面照护病人，最后进行执业前临床考核。"
  zh-TW: "最後一年臨床：在多個診所與鄉村實習中全面照護病人，最後進行執業前臨床考核。"
  ja: "最終の臨床学年。複数の診療所と地方実習で患者を総合的に診て、最後に臨床評価。"
  ko: "마지막 임상 학년. 여러 진료소와 지방 실습에서 환자를 전반적으로 진료하고 임상 평가로 마무리."
  vi: "Năm lâm sàng cuối: chăm sóc toàn diện ở phòng khám và thực tập vùng quê, kết thúc bằng đánh giá."
  ms: "Tahun klinikal akhir: rawatan penuh di klinik dan penempatan luar bandar, diakhiri penilaian."
  id: "Tahun klinis akhir: perawatan penuh di klinik dan penempatan pedesaan, diakhiri penilaian."
  hi: "अंतिम क्लिनिकल वर्ष: क्लिनिक और ग्रामीण प्लेसमेंट में पूरी देखभाल, अंत में क्लिनिकल आकलन।"
outcomes:
  - en: "Provide comprehensive patient care"
    zh: "提供全面的病人护理"
    zh-TW: "提供全面的病人照護"
    ja: "包括的な患者ケアを行う"
    ko: "포괄적 환자 진료 제공하기"
    vi: "Chăm sóc bệnh nhân toàn diện"
    ms: "Beri rawatan pesakit menyeluruh"
    id: "Memberi perawatan pasien menyeluruh"
    hi: "मरीज़ की संपूर्ण देखभाल"
  - en: "Work in rural and community settings"
    zh: "在乡村和社区环境中工作"
    zh-TW: "在鄉村與社區環境中工作"
    ja: "地方や地域の現場で働く"
    ko: "지방·지역사회 현장에서 일하기"
    vi: "Làm việc ở nông thôn và cộng đồng"
    ms: "Bekerja di luar bandar dan komuniti"
    id: "Bekerja di pedesaan dan komunitas"
    hi: "ग्रामीण और सामुदायिक माहौल में काम"
  - en: "Show readiness to practise"
    zh: "展示独立执业的准备"
    zh-TW: "展現獨立執業的準備"
    ja: "開業できる準備を示す"
    ko: "진료 준비가 되었음을 보이기"
    vi: "Thể hiện sẵn sàng hành nghề"
    ms: "Tunjuk kesediaan untuk berpraktik"
    id: "Menunjukkan kesiapan praktik"
    hi: "प्रैक्टिस की तैयारी दिखाना"
