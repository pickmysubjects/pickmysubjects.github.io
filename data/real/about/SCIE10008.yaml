code: SCIE10008
year: 2026
learn:
  en: "Core physics for the Extended science degree: motion, forces, energy and the maths behind them, in small seminars."
  zh: "扩展理学学位的物理基础：运动、力、能量及其背后的数学，小班研讨授课。"
  zh-TW: "延長理學學位的物理基礎：運動、力、能量及其背後的數學，小班研討授課。"
  ja: "理学延長課程の物理基礎：運動、力、エネルギーとその数学を少人数で学ぶ。"
  ko: "확장 이학 학위의 물리 기초: 운동, 힘, 에너지와 그 수학을 소규모 세미나로."
  vi: "Vật lý nền tảng cho cử nhân Khoa học mở rộng: chuyển động, lực, năng lượng."
  ms: "Asas fizik untuk ijazah Sains Lanjutan: gerakan, daya, tenaga dan matematiknya."
  id: "Fisika dasar untuk gelar Sains Diperluas: gerak, gaya, energi dan matematikanya."
  hi: "एक्सटेंडेड साइंस डिग्री की बुनियादी फ़िज़िक्स: गति, बल, ऊर्जा और उनका गणित।"
outcomes:
  - en: "Use maths to describe motion and forces"
    zh: "用数学描述运动和力"
    zh-TW: "用數學描述運動與力"
    ja: "数学で運動と力を表す"
    ko: "수학으로 운동과 힘 설명하기"
    vi: "Dùng toán mô tả chuyển động và lực"
    ms: "Guna matematik untuk huraikan gerakan dan daya"
    id: "Memakai matematika untuk gerak dan gaya"
    hi: "गणित से गति और बल का वर्णन करना"
  - en: "Explain energy and how it is conserved"
    zh: "说明能量及能量守恒"
    zh-TW: "說明能量及能量守恆"
    ja: "エネルギーと保存則を説明する"
    ko: "에너지와 보존 법칙 설명하기"
    vi: "Giải thích năng lượng và bảo toàn"
    ms: "Jelaskan tenaga dan keabadiannya"
    id: "Menjelaskan energi dan kekekalannya"
    hi: "ऊर्जा और उसका संरक्षण समझाना"
  - en: "Build a base for first-year physics"
    zh: "为一年级物理打好基础"
    zh-TW: "為一年級物理打好基礎"
    ja: "1年次の物理学への土台を作る"
    ko: "1학년 물리학의 기초 다지기"
    vi: "Xây nền cho vật lý năm nhất"
    ms: "Bina asas untuk fizik tahun pertama"
    id: "Membangun dasar fisika tahun pertama"
    hi: "पहले साल की फ़िज़िक्स की नींव बनाना"
