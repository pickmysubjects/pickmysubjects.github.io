code: RUSS10004
year: 2026
learn:
  en: "Russian learned through texts rather than grammar lists: narrating, comparing and giving opinions on public topics."
  zh: "以文本而非语法清单学俄语：叙述、比较，并就公共话题表达观点。"
  zh-TW: "以文本而非文法清單學俄語：敘述、比較，並就公共話題表達觀點。"
  ja: "文法の一覧ではなく文章で学ぶロシア語。語る、比べる、社会的な話題に意見を述べる。"
  ko: "문법 목록 대신 글로 배우는 러시아어. 서술하고 비교하며 공적 주제에 의견을 말한다."
  vi: "Học tiếng Nga qua văn bản thay vì danh sách ngữ pháp: kể, so sánh và nêu ý kiến về chủ đề xã hội."
  ms: "Bahasa Rusia melalui teks, bukan senarai tatabahasa: bercerita, membanding dan memberi pendapat tentang isu awam."
  id: "Bahasa Rusia lewat teks, bukan daftar tata bahasa: bercerita, membandingkan dan berpendapat tentang isu publik."
  hi: "व्याकरण-सूचियों की जगह पाठों से रूसी: वर्णन, तुलना और सार्वजनिक विषयों पर राय देना।"
outcomes:
  - en: "Talk about familiar topics in Russian with more confidence"
    zh: "更自信地用俄语谈论熟悉的话题"
    zh-TW: "更自信地用俄語談論熟悉的話題"
    ja: "身近な話題をロシア語でより自信を持って話す"
    ko: "익숙한 주제를 러시아어로 더 자신 있게 말하기"
    vi: "Nói về chủ đề quen thuộc bằng tiếng Nga tự tin hơn"
    ms: "Bercakap tentang topik biasa dalam bahasa Rusia dengan lebih yakin"
    id: "Membicarakan topik akrab dalam bahasa Rusia dengan lebih percaya diri"
    hi: "परिचित विषयों पर रूसी में ज़्यादा आत्मविश्वास से बात करना"
  - en: "Read and write short Russian texts"
    zh: "读写简短的俄语文章"
    zh-TW: "讀寫簡短的俄語文章"
    ja: "短いロシア語の文章を読み書きする"
    ko: "짧은 러시아어 글 읽고 쓰기"
    vi: "Đọc và viết đoạn văn tiếng Nga ngắn"
    ms: "Baca dan tulis teks pendek bahasa Rusia"
    id: "Membaca dan menulis teks pendek bahasa Rusia"
    hi: "छोटे रूसी पाठ पढ़ना-लिखना"
  - en: "Use new grammar and vocabulary correctly"
    zh: "正确运用新语法和词汇"
    zh-TW: "正確運用新文法和詞彙"
    ja: "新しい文法と語彙を正しく使う"
    ko: "새 문법과 어휘를 정확히 쓰기"
    vi: "Dùng đúng ngữ pháp và từ vựng mới"
    ms: "Guna tatabahasa dan kosa kata baharu dengan betul"
    id: "Memakai tata bahasa dan kosakata baru dengan benar"
    hi: "नया व्याकरण और शब्दावली सही इस्तेमाल करना"
