code: ORAL10001
year: 2026
learn:
  en: "How social factors shape oral and general health, and what that means for working with patients and communities."
  zh: "社会因素如何影响口腔与全身健康，以及这对面对病人和社区意味着什么。"
  zh-TW: "社會因素如何影響口腔與全身健康，以及這對面對病人與社區意味著什麼。"
  ja: "社会的要因が口腔と全身の健康にどう影響し、患者や地域との関わりにどう関係するか。"
  ko: "사회적 요인이 구강·전신 건강에 미치는 영향과 환자·지역사회와 일할 때의 의미."
  vi: "Yếu tố xã hội ảnh hưởng sức khỏe răng miệng ra sao và ý nghĩa khi làm việc với bệnh nhân."
  ms: "Cara faktor sosial membentuk kesihatan mulut dan umum, dan kesannya pada kerja dengan pesakit."
  id: "Cara faktor sosial membentuk kesehatan mulut dan umum, serta artinya bagi kerja dengan pasien."
  hi: "सामाजिक कारक मुँह और सामान्य सेहत को कैसे प्रभावित करते हैं, और मरीज़ों के साथ काम में इसका अर्थ।"
outcomes:
  - en: "Explain social causes of poor oral health"
    zh: "说明口腔健康不佳的社会原因"
    zh-TW: "說明口腔健康不佳的社會原因"
    ja: "口腔の健康を損なう社会的要因を説明する"
    ko: "구강 건강 악화의 사회적 원인 설명하기"
    vi: "Giải thích nguyên nhân xã hội gây bệnh răng miệng"
    ms: "Jelaskan punca sosial kesihatan mulut lemah"
    id: "Menjelaskan penyebab sosial kesehatan mulut buruk"
    hi: "ख़राब मुख-स्वास्थ्य के सामाजिक कारण समझाना"
  - en: "Communicate well with diverse patients"
    zh: "与不同背景的病人良好沟通"
    zh-TW: "與不同背景的病人良好溝通"
    ja: "多様な患者とうまく意思疎通する"
    ko: "다양한 환자와 잘 소통하기"
    vi: "Giao tiếp tốt với bệnh nhân đa dạng"
    ms: "Berkomunikasi baik dengan pesakit pelbagai"
    id: "Berkomunikasi baik dengan pasien beragam"
    hi: "विविध मरीज़ों से अच्छा संवाद"
  - en: "Build a portfolio of reflective work"
    zh: "建立反思作品集"
    zh-TW: "建立反思作品集"
    ja: "振り返りのポートフォリオを作る"
    ko: "성찰 포트폴리오 만들기"
    vi: "Xây dựng hồ sơ suy ngẫm"
    ms: "Bina portfolio kerja reflektif"
    id: "Membangun portofolio reflektif"
    hi: "चिंतनशील पोर्टफ़ोलियो बनाना"
