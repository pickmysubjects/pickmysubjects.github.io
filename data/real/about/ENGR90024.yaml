code: ENGR90024
year: 2027
learn:
  en: "Solving fluid flow and heat transfer problems with CFD, from MATLAB basics to ANSYS Fluent, ending in a capstone project."
  zh: "用 CFD 求解流动和传热问题，从 MATLAB 到 ANSYS Fluent，最后做综合项目。"
  zh-TW: "用 CFD 求解流動與熱傳問題，從 MATLAB 到 ANSYS Fluent，最後做總結專題。"
  ja: "CFD で流れと伝熱の問題を解く。MATLAB の基礎から ANSYS Fluent まで学び、最後に総合プロジェクトに取り組む。"
  ko: "CFD로 유동과 열전달 문제를 풉니다. MATLAB 기초부터 ANSYS Fluent까지, 마지막은 종합 프로젝트."
  vi: "Giải bài toán dòng chảy và truyền nhiệt bằng CFD, từ MATLAB cơ bản đến ANSYS Fluent, kết thúc bằng dự án lớn."
  ms: "Menyelesaikan masalah aliran bendalir dan pemindahan haba dengan CFD, daripada asas MATLAB hingga ANSYS Fluent, diakhiri projek utama."
  id: "Menyelesaikan masalah aliran fluida dan perpindahan panas dengan CFD, dari dasar MATLAB hingga ANSYS Fluent, diakhiri proyek besar."
  hi: "CFD से द्रव प्रवाह और ऊष्मा स्थानांतरण की समस्याएँ हल करना, MATLAB की बुनियाद से ANSYS Fluent तक, अंत में एक बड़ा प्रोजेक्ट।"
outcomes:
  - en: "Write simple programs to solve flow equations numerically"
    zh: "编写简单程序数值求解流动方程"
    zh-TW: "撰寫簡單程式以數值方式求解流動方程式"
    ja: "流れの方程式を数値的に解く簡単なプログラムを書く"
    ko: "유동 방정식을 수치적으로 푸는 간단한 프로그램 작성하기"
    vi: "Viết chương trình đơn giản giải số phương trình dòng chảy"
    ms: "Menulis atur cara ringkas untuk menyelesaikan persamaan aliran secara berangka"
    id: "Menulis program sederhana untuk menyelesaikan persamaan aliran secara numerik"
    hi: "प्रवाह समीकरणों को संख्यात्मक रूप से हल करने के सरल प्रोग्राम लिखना"
  - en: "Run simulations in a commercial CFD package"
    zh: "使用商业 CFD 软件进行仿真"
    zh-TW: "使用商用 CFD 軟體進行模擬"
    ja: "市販の CFD ソフトでシミュレーションする"
    ko: "상용 CFD 소프트웨어로 시뮬레이션하기"
    vi: "Chạy mô phỏng bằng phần mềm CFD thương mại"
    ms: "Menjalankan simulasi dalam pakej CFD komersial"
    id: "Menjalankan simulasi dengan paket CFD komersial"
    hi: "व्यावसायिक CFD सॉफ़्टवेयर में सिमुलेशन चलाना"
  - en: "Judge the numerical errors in a solution"
    zh: "评估数值解中的误差"
    zh-TW: "評估數值解中的誤差"
    ja: "解に含まれる数値誤差を評価する"
    ko: "해의 수치 오차 평가하기"
    vi: "Đánh giá sai số số trong lời giải"
    ms: "Menilai ralat berangka dalam penyelesaian"
    id: "Menilai galat numerik dalam solusi"
    hi: "समाधान में संख्यात्मक त्रुटियाँ परखना"
