code: CVEN90050
year: 2027
learn:
  en: "Soil strength and settlement, shallow foundations and retaining walls."
  zh: "土的强度与沉降、浅基础和挡土结构。"
  zh-TW: "土壤強度與沉陷、淺基礎與擋土結構。"
  ja: "土の強度と沈下、直接基礎と擁壁。"
  ko: "흙의 강도와 침하, 얕은 기초와 옹벽."
  vi: "Cường độ và độ lún của đất, móng nông và tường chắn."
  ms: "Kekuatan dan enapan tanah, asas cetek dan dinding penahan."
  id: "Kekuatan dan penurunan tanah, fondasi dangkal dan dinding penahan."
  hi: "मिट्टी की मज़बूती और धँसाव, उथली नींव और रिटेनिंग दीवारें।"
outcomes:
  - en: "Work out soil strength and deformation properties"
    zh: "确定土的强度和变形特性"
    zh-TW: "確定土壤強度與變形特性"
    ja: "土の強度・変形特性を求める"
    ko: "흙의 강도와 변형 특성 구하기"
    vi: "Xác định đặc trưng cường độ và biến dạng của đất"
    ms: "Menentukan sifat kekuatan dan ubah bentuk tanah"
    id: "Menentukan sifat kekuatan dan deformasi tanah"
    hi: "मिट्टी की मज़बूती और विरूपण गुण निकालना"
  - en: "Check bearing capacity and settlement of shallow foundations"
    zh: "验算浅基础的承载力和沉降"
    zh-TW: "檢核淺基礎的承載力與沉陷"
    ja: "直接基礎の支持力と沈下を検討する"
    ko: "얕은 기초의 지지력과 침하 검토하기"
    vi: "Kiểm tra sức chịu tải và độ lún của móng nông"
    ms: "Menyemak keupayaan galas dan enapan asas cetek"
    id: "Memeriksa daya dukung dan penurunan fondasi dangkal"
    hi: "उथली नींव की धारण क्षमता और धँसाव की जाँच"
  - en: "Assess the stability of retaining structures"
    zh: "评估挡土结构的稳定性"
    zh-TW: "評估擋土結構的穩定性"
    ja: "擁壁の安定性を評価する"
    ko: "옹벽의 안정성 평가하기"
    vi: "Đánh giá ổn định của kết cấu chắn đất"
    ms: "Menilai kestabilan struktur penahan"
    id: "Menilai stabilitas struktur penahan tanah"
    hi: "रिटेनिंग संरचनाओं की स्थिरता का आकलन"
