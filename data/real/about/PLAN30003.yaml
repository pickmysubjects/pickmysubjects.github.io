code: PLAN30003
year: 2026
learn:
  en: "How to design, run and critique social research for urban planning, including ethics and choosing methods."
  zh: "如何为城市规划设计、开展和评判社会研究，包括研究伦理和方法选择。"
  zh-TW: "如何為都市規劃設計、執行與評析社會研究，包括研究倫理與方法選擇。"
  ja: "都市計画のための社会調査を設計・実施・批評する方法。倫理と手法選びも含む。"
  ko: "도시계획을 위한 사회 조사를 설계·수행·비평하는 법. 연구 윤리와 방법 선택 포함."
  vi: "Cách thiết kế, thực hiện và đánh giá nghiên cứu xã hội cho quy hoạch, gồm đạo đức và chọn phương pháp."
  ms: "Cara mereka, menjalankan dan menilai kajian sosial untuk perancangan bandar, termasuk etika dan pilihan kaedah."
  id: "Cara merancang, menjalankan, dan mengkritik riset sosial untuk perencanaan kota, termasuk etika dan metode."
  hi: "शहरी योजना के लिए सामाजिक शोध डिज़ाइन, संचालन और समीक्षा करना, नैतिकता और विधि-चयन सहित।"
outcomes:
  - en: "Design a planning research project"
    zh: "设计一个规划研究项目"
    zh-TW: "設計一個規劃研究專案"
    ja: "計画分野の研究を設計する"
    ko: "도시계획 연구 프로젝트 설계하기"
    vi: "Thiết kế một dự án nghiên cứu quy hoạch"
    ms: "Reka projek kajian perancangan"
    id: "Merancang proyek riset perencanaan"
    hi: "योजना शोध प्रोजेक्ट डिज़ाइन करना"
  - en: "Choose fitting social research methods"
    zh: "选择合适的社会研究方法"
    zh-TW: "選擇合適的社會研究方法"
    ja: "適切な社会調査手法を選ぶ"
    ko: "알맞은 사회 조사 방법 고르기"
    vi: "Chọn phương pháp nghiên cứu xã hội phù hợp"
    ms: "Pilih kaedah kajian sosial yang sesuai"
    id: "Memilih metode riset sosial yang tepat"
    hi: "उपयुक्त सामाजिक शोध विधियाँ चुनना"
  - en: "Critique research and handle ethics issues"
    zh: "评判研究质量并处理伦理问题"
    zh-TW: "評析研究品質並處理倫理問題"
    ja: "研究を批評し倫理面に対応する"
    ko: "연구를 비평하고 윤리 문제 다루기"
    vi: "Đánh giá nghiên cứu và xử lý vấn đề đạo đức"
    ms: "Kritik kajian dan urus isu etika"
    id: "Mengkritik riset dan menangani isu etika"
    hi: "शोध की समीक्षा और नैतिक मुद्दे संभालना"
