code: ZOOL20006
year: 2026
learn:
  en: "How animal bodies work and adapt to deserts and oceans, from hormones and hearts to temperature control."
  zh: "动物身体如何运作并适应沙漠和海洋，从激素到体温调节。"
  zh-TW: "動物身體如何運作並適應沙漠和海洋，從激素到體溫調節。"
  ja: "ホルモンや心臓から体温調節まで、動物の体が砂漠や海に適応するしくみ。"
  ko: "호르몬, 심장, 체온 조절까지 동물 몸이 사막과 바다에 적응하는 방식."
  vi: "Cơ thể động vật hoạt động và thích nghi với sa mạc, biển, từ hormone, tim đến điều nhiệt."
  ms: "Cara tubuh haiwan berfungsi dan menyesuai di gurun dan laut, dari hormon hingga suhu badan."
  id: "Cara tubuh hewan bekerja dan beradaptasi di gurun dan laut, dari hormon hingga suhu tubuh."
  hi: "जानवरों का शरीर रेगिस्तान और समुद्र में कैसे काम और ढलता है, हार्मोन से तापमान तक।"
outcomes:
  - en: "Compare body systems across animal groups"
    zh: "比较不同动物的生理系统"
    zh-TW: "比較不同動物的生理系統"
    ja: "動物群ごとに生理系を比較する"
    ko: "동물군별 생리 기관 비교하기"
    vi: "So sánh hệ cơ quan giữa các nhóm động vật"
    ms: "Membanding sistem tubuh antara kumpulan haiwan"
    id: "Membandingkan sistem tubuh antarkelompok hewan"
    hi: "अलग जानवर समूहों के शारीरिक सिस्टम की तुलना करना"
  - en: "Use data to support a hypothesis"
    zh: "用数据支持假说"
    zh-TW: "用數據支持假說"
    ja: "データで仮説を裏づける"
    ko: "데이터로 가설 뒷받침하기"
    vi: "Dùng dữ liệu để củng cố giả thuyết"
    ms: "Guna data untuk menyokong hipotesis"
    id: "Memakai data untuk mendukung hipotesis"
    hi: "डेटा से परिकल्पना का समर्थन करना"
