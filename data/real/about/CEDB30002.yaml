code: CEDB30002
year: 2026
learn:
  en: "The molecular machinery behind how cells organise, move, signal and control genes, and why it matters in medicine."
  zh: "细胞组织、迁移、信号和基因调控背后的分子机制，及其医学意义。"
  zh-TW: "細胞組織、遷移、訊號與基因調控背後的分子機制，及其醫學意義。"
  ja: "細胞の組織化・移動・シグナル・遺伝子制御の分子機構と、その医学的意義。"
  ko: "세포의 조직화·이동·신호·유전자 조절 뒤의 분자 기전과 그 의학적 의미."
  vi: "Cơ chế phân tử giúp tế bào tổ chức, di chuyển, truyền tín hiệu, điều hòa gen, và ý nghĩa y học."
  ms: "Mekanisme molekul di sebalik organisasi, pergerakan, isyarat dan kawalan gen sel, serta kepentingannya dalam perubatan."
  id: "Mekanisme molekuler di balik organisasi, gerak, sinyal, dan kontrol gen sel, serta artinya bagi kedokteran."
  hi: "कोशिकाओं के संगठन, गति, सिग्नलिंग और जीन नियंत्रण की आणविक मशीनरी, और चिकित्सा में इसका महत्व।"
outcomes:
  - en: "Explain gene regulation and cell signalling"
    zh: "解释基因调控与细胞信号"
    zh-TW: "解釋基因調控與細胞訊號"
    ja: "遺伝子制御と細胞シグナルを説明する"
    ko: "유전자 조절과 세포 신호 설명하기"
    vi: "Giải thích điều hòa gen và tín hiệu tế bào"
    ms: "Menerangkan kawalan gen dan isyarat sel"
    id: "Menjelaskan regulasi gen dan sinyal sel"
    hi: "जीन नियमन और कोशिका सिग्नलिंग समझाना"
  - en: "Analyse imaging data with software"
    zh: "用软件分析成像数据"
    zh-TW: "用軟體分析影像數據"
    ja: "ソフトで画像データを分析する"
    ko: "소프트웨어로 이미징 데이터 분석하기"
    vi: "Phân tích dữ liệu hình ảnh bằng phần mềm"
    ms: "Menganalisis data imej dengan perisian"
    id: "Menganalisis data pencitraan dengan perangkat lunak"
    hi: "सॉफ़्टवेयर से इमेजिंग डेटा का विश्लेषण करना"
  - en: "Design experiments on cell function"
    zh: "设计研究细胞功能的实验"
    zh-TW: "設計研究細胞功能的實驗"
    ja: "細胞機能を調べる実験を設計する"
    ko: "세포 기능 연구 실험 설계하기"
    vi: "Thiết kế thí nghiệm về chức năng tế bào"
    ms: "Mereka bentuk eksperimen fungsi sel"
    id: "Merancang eksperimen fungsi sel"
    hi: "कोशिका कार्य पर प्रयोग डिज़ाइन करना"
