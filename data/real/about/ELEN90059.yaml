code: ELEN90059
year: 2027
learn:
  en: "The physics and design of optical systems: lasers, fibres, modulation, amplification and detection, with lab work."
  zh: "光学系统的物理原理与设计：激光、光纤、调制、放大和探测，并有实验。"
  zh-TW: "光學系統的物理原理與設計：雷射、光纖、調變、放大與偵測，並有實驗。"
  ja: "光システムの物理と設計：レーザー・光ファイバー・変調・増幅・検出。実験あり。"
  ko: "광 시스템의 물리와 설계: 레이저, 광섬유, 변조, 증폭, 검출. 실험 포함."
  vi: "Vật lý và thiết kế hệ thống quang: laser, sợi quang, điều chế, khuếch đại và tách sóng, có thí nghiệm."
  ms: "Fizik dan reka bentuk sistem optik: laser, gentian, modulasi, penguatan dan pengesanan, dengan kerja makmal."
  id: "Fisika dan desain sistem optik: laser, serat, modulasi, penguatan dan deteksi, dengan praktikum."
  hi: "ऑप्टिकल प्रणालियों का भौतिकी और डिज़ाइन: लेज़र, फ़ाइबर, मॉड्यूलेशन, प्रवर्धन और डिटेक्शन, लैब कार्य के साथ।"
outcomes:
  - en: "Explain how lightwave systems work from the physics up"
    zh: "从物理原理解释光波系统如何工作"
    zh-TW: "從物理原理解釋光波系統如何運作"
    ja: "光波システムの仕組みを物理から説明する"
    ko: "광파 시스템의 작동을 물리 원리부터 설명하기"
    vi: "Giải thích hệ thống sóng ánh sáng hoạt động từ nguyên lý vật lý"
    ms: "Menerangkan cara sistem gelombang cahaya berfungsi dari asas fizik"
    id: "Menjelaskan cara kerja sistem gelombang cahaya dari prinsip fisika"
    hi: "भौतिक सिद्धांतों से लाइटवेव सिस्टम का काम समझाना"
  - en: "Design, model and simulate simple optical systems"
    zh: "设计、建模和仿真简单的光学系统"
    zh-TW: "設計、建模與模擬簡單的光學系統"
    ja: "簡単な光システムを設計・モデル化・シミュレーションする"
    ko: "간단한 광 시스템 설계·모델링·시뮬레이션하기"
    vi: "Thiết kế, mô hình và mô phỏng hệ thống quang đơn giản"
    ms: "Mereka bentuk, memodel dan mensimulasikan sistem optik mudah"
    id: "Merancang, memodelkan dan mensimulasikan sistem optik sederhana"
    hi: "सरल ऑप्टिकल प्रणालियाँ डिज़ाइन, मॉडल और सिमुलेट करना"
  - en: "Run lab experiments with optical devices"
    zh: "用光学器件开展实验"
    zh-TW: "以光學元件進行實驗"
    ja: "光デバイスで実験を行う"
    ko: "광 소자로 실험 수행하기"
    vi: "Thực hiện thí nghiệm với linh kiện quang"
    ms: "Menjalankan eksperimen makmal dengan peranti optik"
    id: "Melakukan eksperimen dengan perangkat optik"
    hi: "ऑप्टिकल उपकरणों के साथ लैब प्रयोग करना"
