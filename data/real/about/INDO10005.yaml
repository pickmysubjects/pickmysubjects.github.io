code: INDO10005
year: 2026
learn:
  en: "Indonesian from scratch: basic grammar, greetings and polite address, and talking about daily life, family and Indonesia."
  zh: "零基础印尼语：基础语法、问候和称呼，以及谈论日常生活、家庭和印尼。"
  zh-TW: "零基礎印尼語：基礎文法、問候和稱呼，以及談論日常生活、家庭和印尼。"
  ja: "ゼロから学ぶインドネシア語。基礎文法、あいさつと呼びかけ方、日常生活・家族・インドネシアの話。"
  ko: "처음 배우는 인도네시아어. 기초 문법, 인사와 호칭, 일상·가족·인도네시아에 대해 말하기."
  vi: "Tiếng Indonesia từ đầu: ngữ pháp cơ bản, chào hỏi và cách xưng hô, nói về đời sống, gia đình và Indonesia."
  ms: "Bahasa Indonesia dari asas: tatabahasa asas, salam dan panggilan hormat, serta bercakap tentang kehidupan harian dan keluarga."
  id: "Bahasa Indonesia dari nol: tata bahasa dasar, salam dan sapaan, serta berbicara tentang kehidupan sehari-hari dan keluarga."
  hi: "शून्य से इंडोनेशियाई: बुनियादी व्याकरण, अभिवादन और संबोधन, और रोज़ की ज़िंदगी, परिवार व इंडोनेशिया पर बात।"
outcomes:
  - en: "Hold simple everyday conversations in Indonesian"
    zh: "用印尼语进行简单的日常对话"
    zh-TW: "用印尼語進行簡單的日常對話"
    ja: "インドネシア語で簡単な日常会話をする"
    ko: "인도네시아어로 간단한 일상 대화하기"
    vi: "Trò chuyện đơn giản hằng ngày bằng tiếng Indonesia"
    ms: "Berbual ringkas harian dalam bahasa Indonesia"
    id: "Bercakap sederhana sehari-hari dalam bahasa Indonesia"
    hi: "इंडोनेशियाई में सरल रोज़मर्रा की बातचीत करना"
  - en: "Read and write basic Indonesian words and sentences"
    zh: "读写基础印尼语词句"
    zh-TW: "讀寫基礎印尼語詞句"
    ja: "インドネシア語の基本的な語や文を読み書きする"
    ko: "기초 인도네시아어 단어와 문장 읽고 쓰기"
    vi: "Đọc và viết từ, câu tiếng Indonesia cơ bản"
    ms: "Baca dan tulis perkataan serta ayat asas bahasa Indonesia"
    id: "Membaca dan menulis kata serta kalimat dasar bahasa Indonesia"
    hi: "इंडोनेशियाई के बुनियादी शब्द और वाक्य पढ़ना-लिखना"
  - en: "Understand everyday customs where Indonesian is spoken"
    zh: "了解使用印尼语地区的日常习俗"
    zh-TW: "了解使用印尼語地區的日常習俗"
    ja: "インドネシア語が話される地域の日常の習慣を知る"
    ko: "인도네시아어 사용 지역의 일상 관습 이해하기"
    vi: "Hiểu phong tục hằng ngày nơi nói tiếng Indonesia"
    ms: "Fahami adat harian di tempat bahasa Indonesia dituturkan"
    id: "Memahami kebiasaan sehari-hari di tempat bahasa Indonesia dipakai"
    hi: "इंडोनेशियाई बोलने वाली जगहों के रोज़मर्रा के रीति-रिवाज समझना"
