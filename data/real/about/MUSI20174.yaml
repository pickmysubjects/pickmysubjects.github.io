code: MUSI20174
year: 2026
learn:
  en: "Online intro to recording on a laptop: microphones, setting up a session, editing and producing a short track of your own."
  zh: "线上课：用笔记本电脑录音，学麦克风、录音设置、剪辑与制作短曲。"
  zh-TW: "線上課：用筆電錄音，學麥克風、錄音設定、剪輯與製作短曲。"
  ja: "オンライン授業：ノートPCでの録音入門。マイク、セッティング、編集、短い曲の制作。"
  ko: "온라인 강의: 노트북 녹음 입문. 마이크, 세팅, 편집, 짧은 곡 제작."
  vi: "Học trực tuyến thu âm trên laptop: micro, thiết lập, chỉnh sửa và làm một bản nhạc ngắn."
  ms: "Pengenalan dalam talian rakaman komputer riba: mikrofon, persediaan, suntingan dan trek pendek."
  id: "Pengantar daring rekaman di laptop: mikrofon, penyiapan, editing, dan membuat lagu pendek."
  hi: "ऑनलाइन: लैपटॉप पर रिकॉर्डिंग, माइक, सेटअप, एडिटिंग और छोटा ट्रैक बनाना।"
outcomes:
  - en: "Set up microphones for a simple recording"
    zh: "为简单录音架设麦克风"
    zh-TW: "為簡單錄音架設麥克風"
    ja: "簡単な録音用にマイクを設置する"
    ko: "간단한 녹음용 마이크 세팅하기"
    vi: "Đặt micro cho buổi thu đơn giản"
    ms: "Pasang mikrofon untuk rakaman ringkas"
    id: "Memasang mikrofon untuk rekaman sederhana"
    hi: "सादी रिकॉर्डिंग के लिए माइक लगाना"
  - en: "Record, edit and mix audio in a DAW"
    zh: "在数字音频工作站中录音、剪辑与混音"
    zh-TW: "在數位音訊工作站中錄音、剪輯與混音"
    ja: "DAWで録音・編集・ミックスする"
    ko: "DAW에서 녹음·편집·믹싱하기"
    vi: "Thu, chỉnh sửa và mix âm thanh trên DAW"
    ms: "Rakam, sunting dan campur audio dalam DAW"
    id: "Merekam, mengedit, dan mixing audio di DAW"
    hi: "DAW में ऑडियो रिकॉर्ड, एडिट और मिक्स करना"
  - en: "Explain the choices behind your finished tracks"
    zh: "说明作品背后的制作思路"
    zh-TW: "說明作品背後的製作思路"
    ja: "完成した曲の制作意図を説明する"
    ko: "완성곡의 제작 의도 설명하기"
    vi: "Giải thích lựa chọn trong bản nhạc đã hoàn thành"
    ms: "Terangkan pilihan di sebalik trek siap anda"
    id: "Menjelaskan alasan di balik lagu yang selesai"
    hi: "तैयार ट्रैक के पीछे के फ़ैसले समझाना"
