code: PHIL20047
year: 2026
learn:
  en: "What knowledge and justified belief are, how they relate to truth and reality, and the role of intuition in philosophy."
  zh: "知识和有理由的信念是什么、它们与真理和实在的关系，以及直觉在哲学中的作用。"
  zh-TW: "知識和有理由的信念是什麼、它們與真理和實在的關係，以及直覺在哲學中的作用。"
  ja: "知識と正当化された信念とは何か、真理や実在との関係、哲学における直観の役割を学ぶ。"
  ko: "지식과 정당화된 믿음이란 무엇인지, 진리·실재와의 관계, 철학에서 직관의 역할을 배운다."
  vi: "Tri thức và niềm tin có biện minh là gì, quan hệ với chân lý và thực tại ra sao, và vai trò của trực giác trong triết học."
  ms: "Apa itu pengetahuan dan kepercayaan berjustifikasi, kaitannya dengan kebenaran dan realiti, dan peranan intuisi dalam falsafah."
  id: "Apa itu pengetahuan dan keyakinan terjustifikasi, kaitannya dengan kebenaran dan realitas, serta peran intuisi dalam filsafat."
  hi: "ज्ञान और न्यायोचित विश्वास क्या हैं, सत्य और यथार्थ से उनका संबंध, और दर्शन में अंतर्ज्ञान की भूमिका।"
outcomes:
  - en: "Explain major theories of knowledge"
    zh: "说明主要的知识理论"
    zh-TW: "說明主要的知識理論"
    ja: "主な知識の理論を説明する"
    ko: "주요 지식 이론 설명하기"
    vi: "Giải thích các lý thuyết chính về tri thức"
    ms: "Terangkan teori utama pengetahuan"
    id: "Menjelaskan teori utama pengetahuan"
    hi: "ज्ञान के मुख्य सिद्धांत समझाना"
  - en: "Link questions of knowledge to truth and reality"
    zh: "把知识问题与真理和实在联系起来"
    zh-TW: "把知識問題與真理和實在聯繫起來"
    ja: "知識の問いを真理や実在と結びつける"
    ko: "지식 문제를 진리·실재와 연결하기"
    vi: "Liên hệ câu hỏi về tri thức với chân lý và thực tại"
    ms: "Kaitkan persoalan pengetahuan dengan kebenaran dan realiti"
    id: "Mengaitkan soal pengetahuan dengan kebenaran dan realitas"
    hi: "ज्ञान के सवालों को सत्य और यथार्थ से जोड़ना"
  - en: "Assess the role of intuitions in philosophy"
    zh: "评估直觉在哲学中的作用"
    zh-TW: "評估直覺在哲學中的作用"
    ja: "哲学における直観の役割を評価する"
    ko: "철학에서 직관의 역할 평가하기"
    vi: "Đánh giá vai trò của trực giác trong triết học"
    ms: "Nilai peranan intuisi dalam falsafah"
    id: "Menilai peran intuisi dalam filsafat"
    hi: "दर्शन में अंतर्ज्ञान की भूमिका परखना"
