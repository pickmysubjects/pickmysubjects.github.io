code: HIST10012
year: 2026
learn:
  en: "World history from 1945 to now: the Cold War, civil rights, decolonisation, migration and political extremism."
  zh: "1945年至今的世界史：冷战、民权、去殖民化、移民和政治极端主义。"
  zh-TW: "1945年至今的世界史：冷戰、民權、去殖民化、移民和政治極端主義。"
  ja: "1945年から現在までの世界史。冷戦、公民権、脱植民地化、移民、政治的過激主義を扱う。"
  ko: "1945년부터 현재까지의 세계사, 냉전, 민권, 탈식민화, 이주, 정치적 극단주의를 다룬다."
  vi: "Lịch sử thế giới từ 1945 đến nay: Chiến tranh Lạnh, dân quyền, phi thực dân hóa, di cư và chủ nghĩa cực đoan chính trị."
  ms: "Sejarah dunia dari 1945 hingga kini: Perang Dingin, hak sivil, dekolonisasi, migrasi dan ekstremisme politik."
  id: "Sejarah dunia sejak 1945: Perang Dingin, hak sipil, dekolonisasi, migrasi, dan ekstremisme politik."
  hi: "1945 से अब तक का विश्व इतिहास: शीत युद्ध, नागरिक अधिकार, उपनिवेशवाद का अंत, प्रवासन और राजनीतिक अतिवाद।"
outcomes:
  - en: "Examine major world changes since 1945"
    zh: "考察1945年以来世界的重大变化"
    zh-TW: "考察1945年以來世界的重大變化"
    ja: "1945年以降の世界の大きな変化を考察する"
    ko: "1945년 이후 세계의 큰 변화 살펴보기"
    vi: "Xem xét những thay đổi lớn của thế giới từ 1945"
    ms: "Teliti perubahan besar dunia sejak 1945"
    id: "Mengkaji perubahan besar dunia sejak 1945"
    hi: "1945 के बाद दुनिया के बड़े बदलावों की जाँच करना"
  - en: "Analyse primary and secondary sources"
    zh: "分析一手和二手史料"
    zh-TW: "分析一手和二手史料"
    ja: "一次史料と二次文献を分析する"
    ko: "1차·2차 사료 분석하기"
    vi: "Phân tích nguồn sử liệu sơ cấp và thứ cấp"
    ms: "Analisis sumber primer dan sekunder"
    id: "Menganalisis sumber primer dan sekunder"
    hi: "प्राथमिक और द्वितीयक स्रोतों का विश्लेषण करना"
  - en: "Assess the impact of global conflicts and migration"
    zh: "评估全球冲突和移民的影响"
    zh-TW: "評估全球衝突和移民的影響"
    ja: "世界的な紛争と移動の影響を評価する"
    ko: "세계적 분쟁과 이주의 영향 평가하기"
    vi: "Đánh giá tác động của xung đột toàn cầu và di cư"
    ms: "Nilai kesan konflik global dan migrasi"
    id: "Menilai dampak konflik global dan migrasi"
    hi: "वैश्विक संघर्षों और प्रवासन के असर का आकलन करना"
