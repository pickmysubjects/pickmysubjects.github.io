code: ABPL90433
year: 2027
learn:
  en: "How BIM works across teams and projects: execution planning, model sharing, standards, Open BIM and procurement."
  zh: "BIM在团队和项目中的应用：执行计划、模型共享、标准、Open BIM和采购。"
  zh-TW: "BIM在團隊與專案中的應用：執行計畫、模型共享、標準、Open BIM與採購。"
  ja: "チームとプロジェクトでのBIM：実行計画、モデル共有、標準、Open BIM、調達。"
  ko: "팀과 프로젝트에서의 BIM: 실행 계획, 모델 공유, 표준, Open BIM, 조달."
  vi: "BIM trong nhóm và dự án: kế hoạch thực hiện, chia sẻ mô hình, tiêu chuẩn, Open BIM, mua sắm."
  ms: "BIM merentas pasukan dan projek: pelan pelaksanaan, perkongsian model, piawaian, Open BIM dan perolehan."
  id: "BIM lintas tim dan proyek: rencana eksekusi, berbagi model, standar, Open BIM, dan pengadaan."
  hi: "टीमों और परियोजनाओं में BIM: निष्पादन योजना, मॉडल साझा करना, मानक, Open BIM और खरीद।"
