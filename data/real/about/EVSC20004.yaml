code: EVSC20004
year: 2026
learn:
  en: "Marine life on rocky shores, reefs and the Southern Ocean, with field trips and science report writing."
  zh: "岩岸、珊瑚礁和南大洋的海洋生物，含野外考察和科学报告写作。"
  zh-TW: "岩岸、珊瑚礁和南大洋的海洋生物，含野外考察和科學報告寫作。"
  ja: "岩礁海岸・サンゴ礁・南極海の海洋生物。野外実習と科学レポート作成つき。"
  ko: "암반 해안·산호초·남극해의 해양 생물, 야외 답사와 과학 보고서 작성 포함."
  vi: "Sinh vật biển ở bờ đá, rạn san hô và Nam Đại Dương, kèm thực địa và viết báo cáo khoa học."
  ms: "Hidupan laut di pantai berbatu, terumbu dan Lautan Selatan, dengan lawatan lapangan dan penulisan laporan sains."
  id: "Kehidupan laut di pantai berbatu, terumbu, dan Samudra Selatan, dengan kunjungan lapangan dan penulisan laporan ilmiah."
  hi: "चट्टानी तटों, रीफ़ और दक्षिणी महासागर का समुद्री जीवन, फ़ील्ड ट्रिप और साइंस रिपोर्ट लेखन के साथ।"
outcomes:
  - en: "Run field work to answer a biology question"
    zh: "通过野外工作回答生物学问题"
    zh-TW: "透過野外工作回答生物學問題"
    ja: "野外調査で生物学の問いに答える"
    ko: "야외 조사로 생물학 질문에 답한다"
    vi: "Làm thực địa để trả lời câu hỏi sinh học"
    ms: "Jalankan kerja lapangan untuk jawab soalan biologi"
    id: "Melakukan kerja lapangan untuk pertanyaan biologi"
    hi: "फ़ील्ड वर्क से जीवविज्ञान का सवाल हल करना"
  - en: "Analyse data with basic statistics"
    zh: "用基础统计分析数据"
    zh-TW: "用基礎統計分析數據"
    ja: "基本的な統計でデータを分析する"
    ko: "기초 통계로 데이터를 분석한다"
    vi: "Phân tích dữ liệu bằng thống kê cơ bản"
    ms: "Analisis data dengan statistik asas"
    id: "Menganalisis data dengan statistik dasar"
    hi: "बेसिक स्टैटिस्टिक्स से डेटा विश्लेषण"
