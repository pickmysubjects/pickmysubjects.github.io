code: ENEN30001
year: 2026
learn:
  en: "Design, build and monitor a small stormwater biofilter, then test your model against real data."
  zh: "设计、搭建并监测小型雨水生物过滤系统，用数据检验模型。"
  zh-TW: "設計、搭建並監測小型雨水生物過濾系統，用數據檢驗模型。"
  ja: "小型の雨水バイオフィルターを設計・製作・観測し、実データでモデルを検証する。"
  ko: "소형 빗물 바이오필터를 설계·제작·관측하고 실제 데이터로 모델을 검증한다."
  vi: "Thiết kế, xây và theo dõi một bộ lọc sinh học nước mưa nhỏ, rồi kiểm chứng mô hình bằng dữ liệu."
  ms: "Reka, bina dan pantau biofilter air ribut kecil, kemudian uji model dengan data sebenar."
  id: "Merancang, membangun, dan memantau biofilter air hujan kecil, lalu menguji model dengan data nyata."
  hi: "छोटे स्टॉर्मवॉटर बायोफ़िल्टर को डिज़ाइन, बनाना और मॉनिटर करना, फिर असली डेटा से मॉडल जाँचना।"
outcomes:
  - en: "Model, build and monitor an engineering system"
    zh: "建模、搭建并监测工程系统"
    zh-TW: "建模、搭建並監測工程系統"
    ja: "工学システムをモデル化・製作・観測する"
    ko: "공학 시스템을 모델링·제작·관측한다"
    vi: "Mô hình hóa, xây dựng và giám sát hệ thống"
    ms: "Model, bina dan pantau sistem kejuruteraan"
    id: "Memodelkan, membangun, dan memantau sistem"
    hi: "इंजीनियरिंग सिस्टम का मॉडल बनाना और मॉनिटर करना"
  - en: "Assess a project's sustainability"
    zh: "评估项目的可持续性"
    zh-TW: "評估專案的永續性"
    ja: "プロジェクトの持続可能性を評価する"
    ko: "프로젝트의 지속가능성을 평가한다"
    vi: "Đánh giá tính bền vững của dự án"
    ms: "Nilai kelestarian sesuatu projek"
    id: "Menilai keberlanjutan proyek"
    hi: "प्रोजेक्ट की सस्टेनेबिलिटी आँकना"
  - en: "Test a model's predictions against real data"
    zh: "用真实数据检验模型预测"
    zh-TW: "用真實資料檢驗模型預測"
    ja: "モデルの予測を実データで検証する"
    ko: "실제 데이터로 모델 예측 검증하기"
    vi: "Kiểm tra dự đoán của mô hình bằng dữ liệu thực"
    ms: "Uji ramalan model dengan data sebenar"
    id: "Menguji prediksi model dengan data nyata"
    hi: "मॉडल की भविष्यवाणियों को असली डेटा से जांचना"
