code: AHIS30002
year: 2026
learn:
  en: "Taught on location in Indonesia and Singapore: museums, galleries, biennales and art scenes, and how art is shown and consumed."
  zh: "在印尼和新加坡实地授课：走访博物馆、画廊、双年展等艺术现场，了解艺术如何被展示和消费。"
  zh-TW: "在印尼和新加坡實地授課：走訪博物館、畫廊、雙年展等藝術現場，了解藝術如何被展示和消費。"
  ja: "インドネシアとシンガポールで現地授業。美術館、ギャラリー、ビエンナーレを訪ね、芸術の展示と受容を学ぶ。"
  ko: "인도네시아와 싱가포르 현지 수업. 미술관, 갤러리, 비엔날레를 찾아 예술이 전시·소비되는 방식을 배운다."
  vi: "Học tại chỗ ở Indonesia và Singapore: bảo tàng, phòng tranh, biennale và cách nghệ thuật được trưng bày, tiêu thụ."
  ms: "Diajar di lokasi di Indonesia dan Singapura: muzium, galeri, biennale dan cara seni dipamer serta dinikmati."
  id: "Diajarkan langsung di Indonesia dan Singapura: museum, galeri, biennale, serta cara seni dipamerkan dan dinikmati."
  hi: "इंडोनेशिया और सिंगापुर में मौके पर पढ़ाई: संग्रहालय, गैलरी, बिएनाले, और कला कैसे दिखाई व अपनाई जाती है।"
outcomes:
  - en: "Read artworks in their social and political setting"
    zh: "结合社会政治背景解读艺术作品"
    zh-TW: "結合社會政治背景解讀藝術作品"
    ja: "社会・政治的な背景の中で作品を読み解く"
    ko: "사회·정치적 맥락 속에서 작품 읽기"
    vi: "Đọc tác phẩm trong bối cảnh xã hội và chính trị"
    ms: "Tafsir karya seni dalam konteks sosial dan politik"
    id: "Membaca karya seni dalam konteks sosial dan politik"
    hi: "कलाकृतियों को सामाजिक-राजनीतिक संदर्भ में समझना"
  - en: "Understand how museums and curators shape art"
    zh: "理解博物馆和策展人如何塑造艺术"
    zh-TW: "理解博物館和策展人如何塑造藝術"
    ja: "美術館とキュレーターが芸術をどう形作るか理解する"
    ko: "미술관과 큐레이터가 예술을 형성하는 방식 이해하기"
    vi: "Hiểu bảo tàng và người giám tuyển định hình nghệ thuật ra sao"
    ms: "Fahami cara muzium dan kurator membentuk seni"
    id: "Memahami cara museum dan kurator membentuk seni"
    hi: "समझना कि संग्रहालय और क्यूरेटर कला को कैसे गढ़ते हैं"
  - en: "Write up what you observe at art sites"
    zh: "把在艺术现场的观察写成文章"
    zh-TW: "把在藝術現場的觀察寫成文章"
    ja: "現地で見たことを文章にまとめる"
    ko: "현장에서 관찰한 것을 글로 정리하기"
    vi: "Viết lại những gì quan sát được tại các địa điểm nghệ thuật"
    ms: "Tulis pemerhatian di lokasi seni"
    id: "Menuliskan hasil pengamatan di lokasi seni"
    hi: "कला स्थलों पर देखी बातें लिखना"
