code: GDES20004
year: 2027
learn:
  en: "The history and theory of Latin letterforms, put into practice through hands-on typography studio work."
  zh: "拉丁字母字形的历史与理论，并在字体排印工作室中动手实践。"
  zh-TW: "拉丁字母字形的歷史與理論，並在字體排印工作室中動手實作。"
  ja: "ラテン文字の字形の歴史と理論を学び、タイポグラフィのスタジオ制作で実践する。"
  ko: "라틴 문자 글자꼴의 역사와 이론을 배우고 타이포그래피 스튜디오 작업으로 실습한다."
  vi: "Lịch sử và lý thuyết về mặt chữ Latinh, được thực hành qua các buổi studio thiết kế chữ."
  ms: "Sejarah dan teori bentuk huruf Latin, dipraktikkan melalui kerja studio tipografi."
  id: "Sejarah dan teori bentuk huruf Latin, dipraktikkan lewat kerja studio tipografi."
  hi: "लैटिन अक्षर-रूपों का इतिहास और सिद्धांत, टाइपोग्राफ़ी स्टूडियो में हाथ से अभ्यास के साथ।"
outcomes:
  - en: "Research typography in its historical and cultural context"
    zh: "在历史和文化背景中研究字体排印"
    zh-TW: "在歷史和文化脈絡中研究字體排印"
    ja: "歴史的・文化的文脈でタイポグラフィを調べる"
    ko: "역사·문화적 맥락에서 타이포그래피 연구하기"
    vi: "Nghiên cứu thiết kế chữ trong bối cảnh lịch sử và văn hóa"
    ms: "Kaji tipografi dalam konteks sejarah dan budaya"
    id: "Meneliti tipografi dalam konteks sejarah dan budaya"
    hi: "ऐतिहासिक व सांस्कृतिक संदर्भ में टाइपोग्राफ़ी पर शोध करना"
  - en: "Set precise layouts: hierarchy, spacing, alignment"
    zh: "精确排版：层级、间距和对齐"
    zh-TW: "精確排版：層級、間距和對齊"
    ja: "階層・間隔・揃えを正確に組む"
    ko: "위계, 간격, 정렬을 정확히 조판하기"
    vi: "Dàn trang chính xác: thứ bậc, khoảng cách, căn lề"
    ms: "Susun atur tepat: hierarki, jarak, penjajaran"
    id: "Menata letak dengan presisi: hierarki, spasi, perataan"
    hi: "सटीक लेआउट बनाना: पदानुक्रम, स्पेसिंग, अलाइनमेंट"
  - en: "Refine type craft through experiment and making"
    zh: "通过实验和制作打磨字体技艺"
    zh-TW: "透過實驗和製作打磨字體技藝"
    ja: "試作と制作を通して文字の技術を磨く"
    ko: "실험과 제작으로 글자 다루는 솜씨 다듬기"
    vi: "Trau dồi kỹ năng chữ qua thử nghiệm và thực hành"
    ms: "Perhalus kemahiran tipografi melalui eksperimen dan pembuatan"
    id: "Mengasah keterampilan tipografi lewat eksperimen dan praktik"
    hi: "प्रयोग और निर्माण से टाइपोग्राफ़ी कौशल निखारना"
