code: BMEN90035
year: 2027
learn:
  en: "Signal processing for biomedical signals: sampling, frequency analysis, digital filters and Kalman filtering."
  zh: "生物医学信号处理：采样、频域分析、数字滤波器和卡尔曼滤波。"
  zh-TW: "生醫訊號處理：取樣、頻域分析、數位濾波器與卡爾曼濾波。"
  ja: "生体信号の信号処理：サンプリング、周波数解析、デジタルフィルタ、カルマンフィルタ。"
  ko: "생체 신호 처리: 샘플링, 주파수 분석, 디지털 필터, 칼만 필터."
  vi: "Xử lý tín hiệu y sinh: lấy mẫu, phân tích tần số, bộ lọc số và lọc Kalman."
  ms: "Pemprosesan isyarat bioperubatan: pensampelan, analisis frekuensi, penapis digital dan penapisan Kalman."
  id: "Pemrosesan sinyal biomedis: sampling, analisis frekuensi, filter digital, dan filter Kalman."
  hi: "बायोमेडिकल संकेतों की प्रोसेसिंग: सैंपलिंग, आवृत्ति विश्लेषण, डिजिटल फ़िल्टर और कालमन फ़िल्टर।"
outcomes:
  - en: "Design digital sampling and filtering systems"
    zh: "设计数字采样和滤波系统"
    zh-TW: "設計數位取樣與濾波系統"
    ja: "デジタルのサンプリングとフィルタ処理を設計する"
    ko: "디지털 샘플링·필터링 시스템 설계하기"
    vi: "Thiết kế hệ thống lấy mẫu và lọc số"
    ms: "Mereka sistem pensampelan dan penapisan digital"
    id: "Merancang sistem sampling dan filter digital"
    hi: "डिजिटल सैंपलिंग और फ़िल्टरिंग सिस्टम डिज़ाइन करना"
  - en: "Write and test algorithms for estimation problems"
    zh: "编写并检验估计问题的算法"
    zh-TW: "撰寫並檢驗估計問題的演算法"
    ja: "推定問題のアルゴリズムを実装し評価する"
    ko: "추정 문제용 알고리즘 구현과 분석하기"
    vi: "Viết và kiểm tra thuật toán cho bài toán ước lượng"
    ms: "Menulis dan menguji algoritma untuk masalah anggaran"
    id: "Menulis dan menguji algoritma untuk masalah estimasi"
    hi: "अनुमान समस्याओं के लिए एल्गोरिदम लिखना और जाँचना"
