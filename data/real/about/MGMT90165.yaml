code: MGMT90165
year: 2027
learn:
  en: "Enterprises that tackle social or environmental problems; you develop a startup idea into a business plan."
  zh: "以解决社会或环境问题为目标的企业；你会把一个创业想法发展成商业计划书。"
  zh-TW: "以解決社會或環境問題為目標的企業；你會把一個創業構想發展成營運計畫書。"
  ja: "社会・環境問題に取り組む企業を学び、起業アイデアを事業計画書にまとめる。"
  ko: "사회·환경 문제를 해결하는 기업을 배우고 창업 아이디어를 사업계획서로 발전시킨다."
  vi: "Doanh nghiệp giải quyết vấn đề xã hội, môi trường; bạn phát triển ý tưởng khởi nghiệp thành kế hoạch kinh doanh."
  ms: "Perusahaan yang menangani masalah sosial atau alam sekitar; anda membangunkan idea permulaan menjadi pelan perniagaan."
  id: "Usaha yang menangani masalah sosial atau lingkungan; Anda mengembangkan ide startup menjadi rencana bisnis."
  hi: "सामाजिक या पर्यावरणीय समस्याएँ सुलझाने वाले उद्यम; आप एक स्टार्टअप विचार को बिज़नेस प्लान में बदलते हैं।"
outcomes:
  - en: "Balance social goals with profit"
    zh: "在社会目标与盈利之间取得平衡"
    zh-TW: "在社會目標與獲利之間取得平衡"
    ja: "社会的目標と利益を両立させる"
    ko: "사회적 목표와 수익 균형 잡기"
    vi: "Cân bằng mục tiêu xã hội và lợi nhuận"
    ms: "Mengimbangi matlamat sosial dengan keuntungan"
    id: "Menyeimbangkan tujuan sosial dan laba"
    hi: "सामाजिक लक्ष्यों और मुनाफ़े में संतुलन बनाना"
  - en: "Write a social enterprise business plan"
    zh: "撰写社会企业商业计划书"
    zh-TW: "撰寫社會企業營運計畫書"
    ja: "社会的企業の事業計画を書く"
    ko: "사회적 기업 사업계획서 작성하기"
    vi: "Viết kế hoạch kinh doanh doanh nghiệp xã hội"
    ms: "Menulis pelan perniagaan perusahaan sosial"
    id: "Menulis rencana bisnis usaha sosial"
    hi: "सामाजिक उद्यम का बिज़नेस प्लान लिखना"
