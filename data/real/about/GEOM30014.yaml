code: GEOM30014
year: 2026
learn:
  en: "How to connect separate data systems into one working digital infrastructure, securely and with standards."
  zh: "如何用标准把分散的系统安全地连成数字基础设施。"
  zh-TW: "如何用標準把分散的系統安全地串成數位基礎設施。"
  ja: "標準を使い、ばらばらのシステムを安全にデジタル基盤へつなぐ方法。"
  ko: "표준을 써서 흩어진 시스템을 안전하게 하나의 디지털 인프라로 잇는 법."
  vi: "Cách nối các hệ thống rời rạc thành hạ tầng số an toàn, theo chuẩn."
  ms: "Cara menyambung sistem berasingan menjadi infrastruktur digital yang selamat dan standard."
  id: "Cara menyatukan sistem terpisah menjadi infrastruktur digital yang aman dan berstandar."
  hi: "अलग-अलग सिस्टम को स्टैंडर्ड से सुरक्षित डिजिटल इंफ्रास्ट्रक्चर में जोड़ना।"
outcomes:
  - en: "Explain interoperability standards for data"
    zh: "解释数据互操作标准"
    zh-TW: "解釋資料互通標準"
    ja: "データ相互運用の標準を説明する"
    ko: "데이터 상호운용 표준 설명하기"
    vi: "Giải thích chuẩn liên thông dữ liệu"
    ms: "Menerangkan piawaian kebolehoperasian data"
    id: "Menjelaskan standar interoperabilitas data"
    hi: "डेटा इंटरऑपरेबिलिटी स्टैंडर्ड समझाना"
  - en: "Plan how to integrate legacy systems"
    zh: "规划旧系统的整合方案"
    zh-TW: "規劃舊系統的整合方案"
    ja: "レガシーシステムの統合を計画する"
    ko: "레거시 시스템 통합 계획 세우기"
    vi: "Lập kế hoạch tích hợp hệ thống cũ"
    ms: "Merancang integrasi sistem lama"
    id: "Merencanakan integrasi sistem lama"
    hi: "पुराने सिस्टम को जोड़ने की योजना बनाना"
