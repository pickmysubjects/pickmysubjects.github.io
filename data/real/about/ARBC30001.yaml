code: ARBC30001
year: 2026
learn:
  en: "Arabic major capstone: in teams, design and run your own research on current issues in Southwest Asia and North Africa."
  zh: "阿拉伯语专业毕业课：分组自主设计并完成关于西南亚与北非时事的研究。"
  zh-TW: "阿拉伯語主修畢業課：分組自主設計並完成關於西南亞與北非時事的研究。"
  ja: "アラビア語専攻の総まとめ科目。チームで西アジア・北アフリカの現代的課題を自ら研究する。"
  ko: "아랍어 전공 캡스톤. 팀으로 서남아시아·북아프리카의 현안에 대한 연구를 직접 설계하고 수행한다."
  vi: "Môn tổng kết chuyên ngành tiếng Ả Rập: theo nhóm, tự thiết kế và thực hiện nghiên cứu về vấn đề Tây Nam Á và Bắc Phi."
  ms: "Subjek puncak major Arab: secara berkumpulan, reka dan jalankan kajian sendiri tentang isu semasa Asia Barat Daya dan Afrika Utara."
  id: "Mata kuliah puncak jurusan Arab: berkelompok, rancang dan jalankan riset sendiri tentang isu terkini Asia Barat Daya dan Afrika Utara."
  hi: "अरबी मेजर का कैपस्टोन: टीम में दक्षिण-पश्चिम एशिया और उत्तरी अफ़्रीका के मौजूदा मुद्दों पर अपना शोध बनाना और करना।"
outcomes:
  - en: "Plan and run a team research project"
    zh: "策划并完成团队研究项目"
    zh-TW: "策劃並完成團隊研究專題"
    ja: "チームで研究プロジェクトを計画し実行する"
    ko: "팀 연구 프로젝트 기획하고 수행하기"
    vi: "Lập kế hoạch và thực hiện dự án nghiên cứu nhóm"
    ms: "Rancang dan laksana projek penyelidikan berpasukan"
    id: "Merencanakan dan menjalankan proyek riset tim"
    hi: "टीम शोध प्रोजेक्ट की योजना बनाना और पूरा करना"
  - en: "Critically examine issues in the SWANA region"
    zh: "批判性地审视西南亚与北非的议题"
    zh-TW: "批判性地審視西南亞與北非的議題"
    ja: "西アジア・北アフリカの問題を批判的に検討する"
    ko: "서남아시아·북아프리카 문제를 비판적으로 살피기"
    vi: "Xem xét có phê phán các vấn đề khu vực Tây Nam Á, Bắc Phi"
    ms: "Teliti secara kritis isu rantau Asia Barat Daya dan Afrika Utara"
    id: "Mengkaji secara kritis isu kawasan Asia Barat Daya dan Afrika Utara"
    hi: "दक्षिण-पश्चिम एशिया व उत्तरी अफ़्रीका के मुद्दों की आलोचनात्मक जाँच करना"
  - en: "Combine Arabic skills with regional knowledge"
    zh: "把阿拉伯语能力与地区知识结合起来"
    zh-TW: "把阿拉伯語能力與地區知識結合起來"
    ja: "アラビア語力と地域の知識を組み合わせる"
    ko: "아랍어 실력과 지역 지식 결합하기"
    vi: "Kết hợp tiếng Ả Rập với hiểu biết về khu vực"
    ms: "Gabungkan kemahiran bahasa Arab dengan pengetahuan serantau"
    id: "Menggabungkan kemampuan bahasa Arab dengan pengetahuan kawasan"
    hi: "अरबी भाषा कौशल को क्षेत्रीय ज्ञान से जोड़ना"
