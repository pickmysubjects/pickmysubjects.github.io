code: CHEM20011
year: 2026
learn:
  en: "The chemistry of water, air and soil, how pollution affects them, and how to measure it in the lab."
  zh: "水、空气和土壤的化学，污染的影响，以及怎样在实验室检测。"
  zh-TW: "水、空氣和土壤的化學，汙染的影響，以及如何在實驗室檢測。"
  ja: "水・空気・土壌の化学、汚染の影響、実験室での測定方法。"
  ko: "물·공기·토양의 화학, 오염의 영향, 실험실에서 측정하는 법."
  vi: "Hóa học của nước, không khí, đất, tác động của ô nhiễm và cách đo trong phòng thí nghiệm."
  ms: "Kimia air, udara dan tanah, kesan pencemaran ke atasnya, dan cara mengukurnya di makmal."
  id: "Kimia air, udara, dan tanah, dampak polusi terhadapnya, dan cara mengukurnya di lab."
  hi: "पानी, हवा और मिट्टी की केमिस्ट्री, प्रदूषण का असर, और लैब में इसे कैसे मापें।"
outcomes:
  - en: "Use lab instruments to analyse environmental samples"
    zh: "用仪器分析环境样品"
    zh-TW: "用儀器分析環境樣品"
    ja: "実験機器で環境試料を分析する"
    ko: "실험 기기로 환경 시료 분석하기"
    vi: "Dùng thiết bị thí nghiệm phân tích mẫu môi trường"
    ms: "Guna alat makmal untuk analisis sampel alam sekitar"
    id: "Memakai alat lab untuk menganalisis sampel lingkungan"
    hi: "लैब उपकरणों से पर्यावरण सैंपल का विश्लेषण"
  - en: "Interpret environmental data and trends"
    zh: "解读环境数据和趋势"
    zh-TW: "解讀環境資料和趨勢"
    ja: "環境データと傾向を読み解く"
    ko: "환경 데이터와 추세 해석하기"
    vi: "Phân tích dữ liệu và xu hướng môi trường"
    ms: "Tafsir data dan trend alam sekitar"
    id: "Menafsirkan data dan tren lingkungan"
    hi: "पर्यावरण डेटा और ट्रेंड समझना"
  - en: "Explain chemical causes of environmental problems"
    zh: "解释环境问题的化学原因"
    zh-TW: "解釋環境問題的化學原因"
    ja: "環境問題の化学的な原因を説明する"
    ko: "환경 문제의 화학적 원인 설명하기"
    vi: "Giải thích nguyên nhân hóa học của vấn đề môi trường"
    ms: "Terangkan punca kimia masalah alam sekitar"
    id: "Menjelaskan penyebab kimia masalah lingkungan"
    hi: "पर्यावरण समस्याओं के रासायनिक कारण समझाना"
