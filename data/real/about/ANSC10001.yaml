code: ANSC10001
year: 2026
learn:
  en: "How people live with animals, from farms and pets to wildlife and pests, and the ethics behind how we treat them."
  zh: "人类如何与动物共处，从农场、宠物到野生动物和害兽，以及背后的伦理。"
  zh-TW: "人類如何與動物共處，從農場、寵物到野生動物與害獸，以及背後的倫理。"
  ja: "家畜・ペット・野生動物・害獣まで、人と動物の関わりとその倫理。"
  ko: "가축·반려동물·야생동물·해로운 동물까지 사람과 동물의 관계와 그 윤리."
  vi: "Con người sống cùng động vật ra sao, từ vật nuôi đến hoang dã, và đạo đức đằng sau."
  ms: "Cara manusia hidup bersama haiwan, dari ladang hingga hidupan liar, dan etikanya."
  id: "Cara manusia hidup dengan hewan, dari ternak hingga satwa liar, dan etikanya."
  hi: "इंसान और जानवर: खेत, पालतू, वन्यजीव और कीट, और उनके साथ व्यवहार की नैतिकता।"
outcomes:
  - en: "Describe the roles animals play in society"
    zh: "描述动物在社会中的角色"
    zh-TW: "描述動物在社會中的角色"
    ja: "社会で動物が果たす役割を説明する"
    ko: "사회에서 동물의 역할 설명하기"
    vi: "Mô tả vai trò của động vật trong xã hội"
    ms: "Huraikan peranan haiwan dalam masyarakat"
    id: "Menjelaskan peran hewan di masyarakat"
    hi: "समाज में जानवरों की भूमिकाएँ बताना"
  - en: "Compare views on animal welfare"
    zh: "比较对动物福利的不同看法"
    zh-TW: "比較對動物福利的不同看法"
    ja: "動物福祉への考え方を比べる"
    ko: "동물 복지에 대한 관점 비교하기"
    vi: "So sánh quan điểm về phúc lợi động vật"
    ms: "Banding pandangan kebajikan haiwan"
    id: "Membandingkan pandangan kesejahteraan hewan"
    hi: "पशु कल्याण पर विचारों की तुलना"
  - en: "Present a researched animal topic"
    zh: "就动物话题做研究并展示"
    zh-TW: "就動物主題做研究並發表"
    ja: "動物に関するテーマを調べて発表する"
    ko: "동물 주제를 조사해 발표하기"
    vi: "Trình bày một chủ đề động vật đã tìm hiểu"
    ms: "Bentang topik haiwan yang dikaji"
    id: "Mempresentasikan topik hewan hasil riset"
    hi: "किसी पशु विषय पर शोध कर प्रस्तुति"
