code: CHEN30016
year: 2026
learn:
  en: "How momentum, heat and mass move in fluids and materials, and how that shapes process equipment design."
  zh: "动量、热量和质量在流体和材料中的传递，及其对设备设计的影响。"
  zh-TW: "動量、熱量與質量在流體和材料中的傳遞，及其對設備設計的影響。"
  ja: "流体や材料中の運動量・熱・物質の移動と、それが装置設計に与える影響。"
  ko: "유체와 재료 속 운동량·열·물질의 이동과 그것이 장치 설계에 미치는 영향."
  vi: "Động lượng, nhiệt và khối lượng truyền trong chất lưu, vật liệu ra sao, và ảnh hưởng tới thiết kế thiết bị."
  ms: "Bagaimana momentum, haba dan jisim bergerak dalam bendalir dan bahan, serta kesannya pada reka bentuk peralatan."
  id: "Bagaimana momentum, panas, dan massa berpindah dalam fluida dan bahan, serta pengaruhnya pada desain alat."
  hi: "द्रव और पदार्थों में संवेग, ऊष्मा और द्रव्यमान कैसे चलते हैं, और इससे उपकरण डिज़ाइन कैसे तय होता है।"
outcomes:
  - en: "Derive equations for transport problems"
    zh: "推导传递过程的方程"
    zh-TW: "推導傳遞過程的方程式"
    ja: "輸送現象の方程式を導く"
    ko: "전달 현상 방정식 유도하기"
    vi: "Thiết lập phương trình cho bài toán truyền"
    ms: "Menerbitkan persamaan masalah pemindahan"
    id: "Menurunkan persamaan masalah perpindahan"
    hi: "ट्रांसपोर्ट समस्याओं के समीकरण निकालना"
  - en: "Apply transport ideas to equipment design"
    zh: "将传递原理用于设备设计"
    zh-TW: "將傳遞原理用於設備設計"
    ja: "輸送現象を装置設計に応用する"
    ko: "전달 원리를 장치 설계에 적용하기"
    vi: "Áp dụng nguyên lý truyền vào thiết kế thiết bị"
    ms: "Mengaplikasi konsep pemindahan pada reka bentuk alat"
    id: "Menerapkan konsep perpindahan pada desain alat"
    hi: "ट्रांसपोर्ट सिद्धांत उपकरण डिज़ाइन में लगाना"
  - en: "Run lab experiments on transfer processes"
    zh: "进行传递过程实验"
    zh-TW: "進行傳遞過程實驗"
    ja: "移動現象の実験を行う"
    ko: "전달 현상 실험 수행하기"
    vi: "Làm thí nghiệm về quá trình truyền"
    ms: "Menjalankan eksperimen proses pemindahan"
    id: "Melakukan eksperimen proses perpindahan"
    hi: "ट्रांसफ़र प्रक्रियाओं पर लैब प्रयोग करना"
