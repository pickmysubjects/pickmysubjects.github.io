code: LAWS70185
year: 2027
learn:
  en: "International and Australian water law: water rights, Murray-Darling laws, trading, pollution and Indigenous rights."
  zh: "国际与澳洲水法：水权、墨累-达令法规、水交易、污染与原住民权利。"
  zh-TW: "國際與澳洲水法：水權、墨累-達令法規、水交易、汙染與原住民權利。"
  ja: "国際・豪州の水法：水利権、マレー・ダーリング法、水取引、汚染、先住民の権利。"
  ko: "국제 및 호주 물법: 수리권, 머리-달링 법률, 물 거래, 오염, 원주민 권리."
  vi: "Luật nước quốc tế và Úc: quyền về nước, luật Murray-Darling, mua bán nước, ô nhiễm, quyền bản địa."
  ms: "Undang-undang air antarabangsa dan Australia: hak air, Murray-Darling, dagangan air, pencemaran, hak Orang Asal."
  id: "Hukum air internasional dan Australia: hak air, Murray-Darling, perdagangan air, polusi, hak masyarakat adat."
  hi: "अंतरराष्ट्रीय व ऑस्ट्रेलियाई जल कानून: जल अधिकार, मरे-डार्लिंग, जल व्यापार, प्रदूषण, आदिवासी अधिकार।"
outcomes:
  - en: "Analyse international water treaties and case law"
    zh: "分析国际水条约与判例"
    zh-TW: "分析國際水條約與判例"
    ja: "国際的な水条約と判例を分析する"
    ko: "국제 물 조약과 판례 분석하기"
    vi: "Phân tích các điều ước và án lệ quốc tế về nước"
    ms: "Menganalisis perjanjian dan kes undang-undang air antarabangsa"
    id: "Menganalisis perjanjian dan putusan hukum air internasional"
    hi: "अंतरराष्ट्रीय जल संधियों और केस कानून का विश्लेषण"
  - en: "Explain Victorian and federal water law and markets"
    zh: "解释维州与联邦水法及水市场"
    zh-TW: "解釋維州與聯邦水法及水市場"
    ja: "ビクトリア州・連邦の水法と水市場を説明する"
    ko: "빅토리아주·연방 물법과 물 시장 설명하기"
    vi: "Giải thích luật nước Victoria, liên bang và thị trường nước"
    ms: "Menerangkan undang-undang air Victoria, persekutuan dan pasaran air"
    id: "Menjelaskan hukum air Victoria, federal, dan pasar air"
    hi: "विक्टोरिया व संघीय जल कानून और जल बाज़ार समझाना"
  - en: "Evaluate Indigenous rights and cultural values in water"
    zh: "评估原住民水权与文化价值"
    zh-TW: "評估原住民水權與文化價值"
    ja: "水に関する先住民の権利と文化的価値を評価する"
    ko: "물에 대한 원주민 권리와 문화적 가치 평가하기"
    vi: "Đánh giá quyền bản địa và giá trị văn hóa về nước"
    ms: "Menilai hak Orang Asal dan nilai budaya berkaitan air"
    id: "Menilai hak adat dan nilai budaya terkait air"
    hi: "जल में आदिवासी अधिकार और सांस्कृतिक मूल्यों का मूल्यांकन"
