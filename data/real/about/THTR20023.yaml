code: THTR20023
year: 2027
learn:
  en: "Online workshops on the arts management skills to describe, pitch and run your own project idea from start to finish."
  zh: "线上工作坊，学习艺术管理技能，把自己的项目点子讲清楚、推销出去并落地。"
  zh-TW: "線上工作坊，學習藝術管理技能，把自己的計畫點子講清楚、提案出去並落實。"
  ja: "オンラインのワークショップで、自分の企画を説明し、売り込み、最後まで運営するためのアートマネジメントの技能を学ぶ。"
  ko: "온라인 워크숍에서 자기 프로젝트 아이디어를 설명하고, 피칭하고, 끝까지 운영하는 예술경영 기술을 배운다."
  vi: "Các buổi workshop trực tuyến về kỹ năng quản lý nghệ thuật để mô tả, thuyết phục và thực hiện ý tưởng dự án của bạn từ đầu đến cuối."
  ms: "Bengkel dalam talian tentang kemahiran pengurusan seni untuk menerangkan, mempromosi dan melaksanakan idea projek anda dari awal hingga akhir."
  id: "Lokakarya daring tentang keterampilan manajemen seni untuk menjelaskan, mempresentasikan, dan menjalankan ide proyekmu dari awal sampai selesai."
  hi: "ऑनलाइन वर्कशॉप, जिनमें अपने प्रोजेक्ट आइडिया को समझाने, पिच करने और शुरू से अंत तक चलाने के आर्ट्स मैनेजमेंट कौशल सीखते हैं।"
outcomes:
  - en: "Spot the agendas behind commissioned work and their effects"
    zh: "识别委托作品背后的各方意图及其影响"
    zh-TW: "辨識委託作品背後的各方意圖及其影響"
    ja: "委託制作の背後にある思惑とその影響を見抜く"
    ko: "의뢰 작품 뒤의 여러 의도와 그 영향 파악하기"
    vi: "Nhận ra các mục đích đằng sau tác phẩm đặt hàng và tác động của chúng"
    ms: "Kenal pasti agenda di sebalik karya yang ditauliahkan dan kesannya"
    id: "Mengenali agenda di balik karya pesanan dan dampaknya"
    hi: "कमीशन किए गए काम के पीछे के मकसद और उनका असर पहचानना"
  - en: "Use arts management methods to pitch and run a project"
    zh: "用艺术管理方法提案并执行项目"
    zh-TW: "用藝術管理方法提案並執行計畫"
    ja: "アートマネジメントの手法で企画を売り込み実行する"
    ko: "예술경영 방법으로 프로젝트를 피칭하고 실행하기"
    vi: "Dùng phương pháp quản lý nghệ thuật để thuyết trình và triển khai dự án"
    ms: "Guna kaedah pengurusan seni untuk mempromosi dan menjalankan projek"
    id: "Memakai metode manajemen seni untuk mempresentasikan dan menjalankan proyek"
    hi: "आर्ट्स मैनेजमेंट तरीकों से प्रोजेक्ट पिच करना और चलाना"
  - en: "Create and present your own response to a given brief"
    zh: "针对给定题目提出并展示自己的方案"
    zh-TW: "針對給定題目提出並發表自己的方案"
    ja: "与えられたお題に対し自分なりの案を作って発表する"
    ko: "주어진 과제에 대한 자신만의 답을 만들어 발표하기"
    vi: "Tạo và trình bày phản hồi riêng cho một đề bài cho trước"
    ms: "Hasilkan dan bentangkan respons sendiri terhadap tugasan yang diberi"
    id: "Membuat dan mempresentasikan tanggapan sendiri atas tugas yang diberikan"
    hi: "दिए गए विषय पर अपना जवाब बनाकर पेश करना"
