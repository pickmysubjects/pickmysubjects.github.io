code: ABPL90312
year: 2027
learn:
  en: "Measuring building works with the Australian standard method, preparing Bills of Quantities and building up unit rates in CostX."
  zh: "按澳大利亚标准计量方法计量建筑工程，编制工程量清单，并在CostX中组价。"
  zh-TW: "依澳洲標準計量方法計量建築工程，編製工程數量清單，並在CostX中組價。"
  ja: "オーストラリア標準積算法で工事を積算し、数量明細書を作り、CostXで単価を組み立てる。"
  ko: "호주 표준 적산법으로 공사를 적산하고 물량내역서를 작성하며 CostX로 단가를 구성합니다."
  vi: "Đo bóc công trình theo chuẩn Úc, lập bảng khối lượng và xây dựng đơn giá trong CostX."
  ms: "Mengukur kerja bangunan mengikut kaedah standard Australia, menyediakan senarai kuantiti dan kadar dalam CostX."
  id: "Mengukur pekerjaan bangunan dengan metode standar Australia, menyusun daftar kuantitas dan harga di CostX."
  hi: "ऑस्ट्रेलियाई मानक विधि से भवन कार्य मापना, बिल ऑफ़ क्वांटिटी बनाना और CostX में यूनिट रेट तय करना।"
outcomes:
  - en: "Use formulae and trigonometry to measure works"
    zh: "用公式和三角学计量工程"
    zh-TW: "用公式與三角學計量工程"
    ja: "公式と三角法で工事を積算する"
    ko: "공식과 삼각법으로 공사 적산하기"
    vi: "Dùng công thức và lượng giác để đo bóc"
    ms: "Menggunakan formula dan trigonometri untuk mengukur"
    id: "Memakai rumus dan trigonometri untuk mengukur"
    hi: "सूत्रों व त्रिकोणमिति से कार्य मापना"
  - en: "Prepare a Bill of Quantities"
    zh: "编制工程量清单"
    zh-TW: "編製工程數量清單"
    ja: "数量明細書を作成する"
    ko: "물량내역서 작성하기"
    vi: "Lập bảng khối lượng"
    ms: "Menyediakan senarai kuantiti"
    id: "Menyusun daftar kuantitas"
    hi: "बिल ऑफ़ क्वांटिटी तैयार करना"
