code: AGRI20041
year: 2026
learn:
  en: "Why farmers adopt new practices or don't, and how advisers can support real change on the farm."
  zh: "农民为什么采用或拒绝新做法，以及顾问如何帮助农场真正改变。"
  zh-TW: "農民為什麼採用或拒絕新做法，以及顧問如何協助農場真正改變。"
  ja: "農家が新しい方法を取り入れる理由とそうしない理由、助言者の支え方。"
  ko: "농민이 새 방식을 받아들이거나 거부하는 이유와 조언자가 변화를 돕는 법."
  vi: "Vì sao nông dân áp dụng hay từ chối cách làm mới, và cách tư vấn giúp họ thay đổi."
  ms: "Mengapa petani menerima atau menolak amalan baharu, dan cara penasihat membantu."
  id: "Mengapa petani menerima atau menolak praktik baru, dan cara penyuluh membantu."
  hi: "किसान नए तरीक़े क्यों अपनाते या छोड़ते हैं, और सलाहकार बदलाव में कैसे मदद करें।"
outcomes:
  - en: "Explain what drives farmers to change practice"
    zh: "说明推动农民改变做法的因素"
    zh-TW: "說明推動農民改變做法的因素"
    ja: "農家の行動変化を促す要因を説明する"
    ko: "농민 변화를 이끄는 요인 설명하기"
    vi: "Giải thích điều thúc đẩy nông dân thay đổi"
    ms: "Jelaskan pendorong perubahan amalan petani"
    id: "Menjelaskan pendorong perubahan praktik petani"
    hi: "किसानों को बदलाव के लिए क्या प्रेरित करता है"
  - en: "Plan a one-on-one advisory approach"
    zh: "制定一对一咨询方案"
    zh-TW: "制定一對一諮詢方案"
    ja: "個別の助言計画を立てる"
    ko: "1:1 자문 계획 세우기"
    vi: "Lập kế hoạch tư vấn một-một"
    ms: "Rancang pendekatan nasihat individu"
    id: "Merancang pendampingan satu-satu"
    hi: "एक-से-एक सलाह योजना बनाना"
  - en: "Talk with farm owners about a practice issue"
    zh: "与农场主讨论实际问题"
    zh-TW: "與農場主討論實際問題"
    ja: "農場主と実際の課題について話し合う"
    ko: "농장주와 실제 문제 논의하기"
    vi: "Trao đổi với chủ trại về một vấn đề"
    ms: "Berbincang dengan pemilik ladang"
    id: "Berdiskusi dengan pemilik lahan"
    hi: "फ़ार्म मालिकों से समस्या पर बात करना"
