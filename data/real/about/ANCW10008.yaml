code: ANCW10008
year: 2026
learn:
  en: "A beginners' course in Akkadian, the language of ancient Babylonia and Assyria, and its cuneiform script."
  zh: "阿卡德语初级课程：古巴比伦和亚述的语言及其楔形文字。"
  zh-TW: "阿卡德語初級課程：古巴比倫和亞述的語言及其楔形文字。"
  ja: "古代バビロニアとアッシリアの言語、アッカド語と楔形文字の初級。"
  ko: "고대 바빌로니아와 아시리아의 언어인 아카드어와 쐐기문자 초급."
  vi: "Khóa nhập môn tiếng Akkad, ngôn ngữ của Babylon và Assyria cổ, cùng chữ hình nêm."
  ms: "Kursus permulaan bahasa Akkadia, bahasa Babylonia dan Assyria kuno, serta tulisan pakunya."
  id: "Kursus pemula bahasa Akkadia, bahasa Babilonia dan Asyur kuno, serta aksara pakunya."
  hi: "अक्कादी भाषा का शुरुआती कोर्स, प्राचीन बेबीलोनिया और असीरिया की भाषा, और इसकी कीलाक्षर लिपि।"
outcomes:
  - en: "Read basic cuneiform signs"
    zh: "读懂基础楔形文字符号"
    zh-TW: "讀懂基礎楔形文字符號"
    ja: "基本的な楔形文字を読む"
    ko: "기초 쐐기문자 읽기"
    vi: "Đọc các ký hiệu hình nêm cơ bản"
    ms: "Baca simbol tulisan paku asas"
    id: "Membaca tanda aksara paku dasar"
    hi: "बुनियादी कीलाक्षर चिह्न पढ़ना"
  - en: "Use basic Akkadian grammar"
    zh: "运用基础阿卡德语语法"
    zh-TW: "運用基礎阿卡德語語法"
    ja: "基本的なアッカド語文法を使う"
    ko: "기초 아카드어 문법 사용하기"
    vi: "Sử dụng ngữ pháp tiếng Akkad cơ bản"
    ms: "Gunakan tatabahasa asas Akkadia"
    id: "Memakai tata bahasa Akkadia dasar"
    hi: "बुनियादी अक्कादी व्याकरण का उपयोग करना"
  - en: "Translate simple Akkadian texts"
    zh: "翻译简单的阿卡德语文本"
    zh-TW: "翻譯簡單的阿卡德語文本"
    ja: "簡単なアッカド語の文を訳す"
    ko: "간단한 아카드어 글 번역하기"
    vi: "Dịch các văn bản tiếng Akkad đơn giản"
    ms: "Terjemah teks Akkadia mudah"
    id: "Menerjemahkan teks Akkadia sederhana"
    hi: "सरल अक्कादी पाठों का अनुवाद करना"
