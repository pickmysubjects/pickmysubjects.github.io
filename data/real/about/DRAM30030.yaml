code: DRAM30030
year: 2026
learn:
  en: "Capstone acting season: a screen project and a play in different genres and styles, closely linked to the profession."
  zh: "表演毕业季：完成一个影视项目和一部戏，涵盖不同类型与风格。"
  zh-TW: "表演畢業季：完成一個影視專案和一齣戲，涵蓋不同類型與風格。"
  ja: "総仕上げの公演期：映像作品と戯曲を異なるジャンル・様式で演じる。"
  ko: "졸업 연기 시즌: 다양한 장르와 양식의 영상 프로젝트와 연극을 한다."
  vi: "Mùa diễn tốt nghiệp: một dự án màn ảnh và một vở kịch ở nhiều thể loại, phong cách."
  ms: "Musim lakonan akhir: projek skrin dan drama dalam genre dan gaya berbeza."
  id: "Musim akting akhir: proyek layar dan lakon dalam berbagai genre dan gaya."
  hi: "अंतिम अभिनय सीज़न: अलग शैलियों में एक स्क्रीन प्रोजेक्ट और एक नाटक।"
outcomes:
  - en: "Find truth in a role across genres"
    zh: "在不同类型中演出真实的角色"
    zh-TW: "在不同類型中演出真實的角色"
    ja: "ジャンルを超えて役の真実を見つける"
    ko: "장르를 넘어 배역의 진실 찾기"
    vi: "Tìm sự chân thật của vai qua nhiều thể loại"
    ms: "Cari kebenaran watak merentas genre"
    id: "Menemukan kebenaran peran lintas genre"
    hi: "अलग शैलियों में किरदार की सच्चाई ढूँढना"
  - en: "Act in a screen project"
    zh: "参演影视项目"
    zh-TW: "參演影視專案"
    ja: "映像作品に出演する"
    ko: "영상 프로젝트에 출연하기"
    vi: "Diễn trong dự án màn ảnh"
    ms: "Berlakon dalam projek skrin"
    id: "Berakting dalam proyek layar"
    hi: "स्क्रीन प्रोजेक्ट में अभिनय"
  - en: "Perform a full play to a high standard"
    zh: "高水准地演出整部戏"
    zh-TW: "高水準地演出整齣戲"
    ja: "戯曲全体を高い水準で上演する"
    ko: "연극 한 편을 높은 수준으로 공연하기"
    vi: "Diễn trọn một vở kịch ở chuẩn cao"
    ms: "Persembahkan drama penuh dengan standard tinggi"
    id: "Mementaskan lakon utuh dengan standar tinggi"
    hi: "पूरा नाटक ऊँचे स्तर पर प्रस्तुत करना"
