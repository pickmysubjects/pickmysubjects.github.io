code: PSYC30017
year: 2026
learn:
  en: "Classic and modern experiments on perception, memory and decisions, and how theories get tested and revised."
  zh: "感知、记忆和决策的经典与现代实验，理论怎么被检验和修正。"
  zh-TW: "感知、記憶和決策的經典與現代實驗，理論怎麼被檢驗和修正。"
  ja: "知覚、記憶、意思決定に関する古典的・現代的な実験と、理論の検証・修正のされ方。"
  ko: "지각, 기억, 결정에 관한 고전·현대 실험과 이론이 검증되고 수정되는 방식."
  vi: "Thí nghiệm kinh điển và hiện đại về tri giác, trí nhớ, quyết định, và cách lý thuyết được kiểm chứng, sửa đổi."
  ms: "Eksperimen klasik dan moden tentang persepsi, ingatan dan keputusan, serta cara teori diuji dan disemak."
  id: "Eksperimen klasik dan modern tentang persepsi, memori, dan keputusan, serta cara teori diuji dan direvisi."
  hi: "धारणा, याददाश्त और फ़ैसलों पर क्लासिक व आधुनिक प्रयोग, और सिद्धांत कैसे परखे व सुधारे जाते हैं।"
outcomes:
  - en: "Design an experiment to test a theory"
    zh: "设计实验检验理论"
    zh-TW: "設計實驗來檢驗理論"
    ja: "理論を検証する実験を設計する"
    ko: "이론을 검증할 실험 설계"
    vi: "Thiết kế thí nghiệm kiểm chứng lý thuyết"
    ms: "Reka eksperimen untuk menguji teori"
    id: "Merancang eksperimen untuk menguji teori"
    hi: "सिद्धांत परखने के लिए प्रयोग डिज़ाइन करना"
  - en: "Analyse behaviour data with statistics"
    zh: "用统计分析行为数据"
    zh-TW: "用統計分析行為數據"
    ja: "統計で行動データを分析する"
    ko: "통계로 행동 데이터 분석"
    vi: "Phân tích dữ liệu hành vi bằng thống kê"
    ms: "Analisis data tingkah laku dengan statistik"
    id: "Menganalisis data perilaku dengan statistik"
    hi: "स्टैटिस्टिक्स से व्यवहार डेटा का विश्लेषण"
  - en: "Make charts to show your results"
    zh: "做图表展示分析结果"
    zh-TW: "做圖表展示結果"
    ja: "結果を示すグラフを作る"
    ko: "결과를 보여줄 차트 만들기"
    vi: "Vẽ biểu đồ thể hiện kết quả"
    ms: "Buat carta untuk tunjukkan hasil"
    id: "Membuat grafik untuk menampilkan hasil"
    hi: "नतीजे दिखाने के लिए चार्ट बनाना"
