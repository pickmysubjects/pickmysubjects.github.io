code: MGMT20002
year: 2026
learn:
  en: "How organisations run the processes and projects that produce goods and services, with lean and six sigma."
  zh: "组织如何管理生产商品和服务的流程与项目，包括精益和六西格玛。"
  zh-TW: "組織如何管理生產商品和服務的流程與專案，包括精實和六標準差。"
  ja: "組織が製品やサービスを生むプロセスとプロジェクトをどう管理するか。リーンやシックスシグマも。"
  ko: "조직이 제품·서비스를 만드는 프로세스와 프로젝트를 관리하는 법, 린과 식스시그마 포함."
  vi: "Tổ chức quản lý quy trình và dự án tạo ra hàng hóa, dịch vụ ra sao, gồm lean và six sigma."
  ms: "Cara organisasi urus proses dan projek yang hasilkan barang dan perkhidmatan, termasuk lean dan six sigma."
  id: "Cara organisasi mengelola proses dan proyek yang menghasilkan barang dan jasa, termasuk lean dan six sigma."
  hi: "संगठन सामान और सेवाएँ बनाने वाली प्रक्रियाएँ और प्रोजेक्ट कैसे चलाते हैं, लीन और सिक्स सिग्मा सहित।"
outcomes:
  - en: "Analyse and improve a business process"
    zh: "分析并改进业务流程"
    zh-TW: "分析並改善業務流程"
    ja: "業務プロセスを分析し改善する"
    ko: "업무 프로세스 분석·개선"
    vi: "Phân tích và cải tiến một quy trình kinh doanh"
    ms: "Analisis dan tambah baik proses perniagaan"
    id: "Menganalisis dan memperbaiki proses bisnis"
    hi: "बिज़नेस प्रक्रिया परखना और सुधारना"
  - en: "Plan and manage a project through each phase"
    zh: "规划并管理项目的各个阶段"
    zh-TW: "規劃並管理專案的各個階段"
    ja: "プロジェクトを各段階で計画・管理する"
    ko: "프로젝트를 단계별로 계획·관리"
    vi: "Lập kế hoạch và quản lý dự án qua từng giai đoạn"
    ms: "Rancang dan urus projek melalui setiap fasa"
    id: "Merencanakan dan mengelola proyek di setiap fase"
    hi: "हर चरण में प्रोजेक्ट प्लान और मैनेज करना"
  - en: "Apply these tools to manufacturing and service cases"
    zh: "把这些工具用于制造业和服务业案例"
    zh-TW: "把這些工具用於製造業和服務業個案"
    ja: "製造業・サービス業のケースに道具を使う"
    ko: "제조·서비스 사례에 도구 적용"
    vi: "Áp dụng công cụ vào tình huống sản xuất và dịch vụ"
    ms: "Guna alat ini pada kes pembuatan dan perkhidmatan"
    id: "Menerapkan alat ini pada kasus manufaktur dan jasa"
    hi: "इन टूल्स को मैन्युफ़ैक्चरिंग और सर्विस केस पर लगाना"
