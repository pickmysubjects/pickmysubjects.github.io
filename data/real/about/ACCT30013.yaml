code: ACCT30013
year: 2026
learn:
  en: "Current debates in financial reporting: who sets the rules, who is affected, and applying the standards."
  zh: "财务报告的当前争议：谁定规则、影响谁，以及如何应用准则。"
  zh-TW: "財務報導的當前爭議：誰訂規則、影響誰，以及如何適用準則。"
  ja: "財務報告をめぐる今の議論：誰がルールを作り、誰に影響し、基準をどう使うか。"
  ko: "재무보고의 현안: 누가 규칙을 정하고 누가 영향을 받으며 기준을 어떻게 적용하는지."
  vi: "Các tranh luận hiện nay về báo cáo tài chính: ai đặt quy tắc, ai bị ảnh hưởng và cách áp dụng chuẩn mực."
  ms: "Perdebatan semasa dalam pelaporan kewangan: siapa tetapkan peraturan, siapa terkesan, dan cara guna piawaian."
  id: "Perdebatan terkini soal pelaporan keuangan: siapa pembuat aturan, siapa terdampak, dan cara menerapkan standar."
  hi: "फ़ाइनेंशियल रिपोर्टिंग की मौजूदा बहसें: नियम कौन बनाता है, असर किस पर पड़ता है, और स्टैंडर्ड कैसे लागू हों।"
outcomes:
  - en: "Describe the bodies that shape financial reporting"
    zh: "描述影响财务报告的各类机构"
    zh-TW: "描述影響財務報導的各類機構"
    ja: "財務報告を形づくる機関を説明する"
    ko: "재무보고를 만드는 기관들 설명"
    vi: "Mô tả các tổ chức định hình báo cáo tài chính"
    ms: "Huraikan badan yang membentuk pelaporan kewangan"
    id: "Menjelaskan lembaga yang membentuk pelaporan keuangan"
    hi: "फ़ाइनेंशियल रिपोर्टिंग को आकार देने वाली संस्थाओं का वर्णन"
  - en: "Assess proposed changes from different users' views"
    zh: "从不同使用者角度评估准则改革"
    zh-TW: "從不同使用者角度評估準則變革"
    ja: "提案された変更を利用者ごとの視点で評価する"
    ko: "제안된 변경을 이용자별 관점에서 평가"
    vi: "Đánh giá thay đổi đề xuất từ góc nhìn người dùng khác nhau"
    ms: "Nilai cadangan perubahan dari sudut pengguna berbeza"
    id: "Menilai usulan perubahan dari sudut pandang pengguna berbeda"
    hi: "अलग-अलग उपयोगकर्ताओं की नज़र से प्रस्तावित बदलाव परखना"
  - en: "Debate current issues in financial reporting"
    zh: "就财务报告热点问题展开辩论"
    zh-TW: "就財務報導熱門議題進行辯論"
    ja: "財務報告の今の論点について議論する"
    ko: "재무보고 현안에 대해 토론하기"
    vi: "Tranh luận về các vấn đề báo cáo tài chính hiện nay"
    ms: "Berdebat tentang isu semasa pelaporan kewangan"
    id: "Berdebat tentang isu terkini pelaporan keuangan"
    hi: "फ़ाइनेंशियल रिपोर्टिंग के मौजूदा मुद्दों पर बहस करना"
