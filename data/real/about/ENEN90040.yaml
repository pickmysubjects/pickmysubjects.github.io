code: ENEN90040
year: 2027
learn:
  en: "Managing water supply and demand when climate change makes the future uncertain, using decision theory."
  zh: "用决策理论，在气候变化带来的不确定下管理供水与用水。"
  zh-TW: "用決策理論，在氣候變遷帶來的不確定下管理供水與用水。"
  ja: "気候変動で先が読めない中、意思決定理論を使って水の供給と需要を管理する。"
  ko: "기후변화로 불확실한 미래에서 의사결정 이론으로 물 공급과 수요를 관리하기."
  vi: "Quản lý cung và cầu nước khi biến đổi khí hậu khiến tương lai bất định, dùng lý thuyết ra quyết định."
  ms: "Mengurus bekalan dan permintaan air dalam masa depan yang tidak pasti akibat perubahan iklim, guna teori keputusan."
  id: "Mengelola pasokan dan kebutuhan air saat perubahan iklim membuat masa depan tak pasti, dengan teori keputusan."
  hi: "जलवायु परिवर्तन से अनिश्चित भविष्य में निर्णय सिद्धांत से जल आपूर्ति और मांग का प्रबंधन।"
outcomes:
  - en: "Identify the main sources of future uncertainty for water decisions"
    zh: "找出水资源决策中未来不确定性的主要来源"
    zh-TW: "找出水資源決策中未來不確定性的主要來源"
    ja: "水の意思決定における将来の不確実性の主な要因を特定する"
    ko: "물 관련 결정의 주요 미래 불확실성 요인 파악하기"
    vi: "Xác định các nguồn bất định chính cho quyết định về nước"
    ms: "Mengenal pasti punca utama ketidakpastian bagi keputusan air"
    id: "Mengenali sumber utama ketidakpastian dalam keputusan air"
    hi: "जल निर्णयों में भविष्य की अनिश्चितता के मुख्य स्रोत पहचानना"
  - en: "Critique water policy using current science and decision theory"
    zh: "用现有科学和决策理论评析水政策"
    zh-TW: "用現有科學和決策理論評析水政策"
    ja: "最新の科学と意思決定理論で水政策を批評する"
    ko: "최신 과학과 의사결정 이론으로 물 정책 비평하기"
    vi: "Phản biện chính sách nước dựa trên khoa học và lý thuyết quyết định"
    ms: "Mengkritik dasar air menggunakan sains dan teori keputusan"
    id: "Mengkritisi kebijakan air dengan sains dan teori keputusan"
    hi: "विज्ञान और निर्णय सिद्धांत से जल नीति की समीक्षा"
  - en: "Plan how to assess climate impacts on a water system"
    zh: "制定评估气候对水系统影响的方法"
    zh-TW: "制定評估氣候對水系統影響的方法"
    ja: "水システムへの気候影響の評価方法を組み立てる"
    ko: "수자원 시스템의 기후 영향 평가 방법 세우기"
    vi: "Lập cách đánh giá tác động khí hậu lên hệ thống nước"
    ms: "Merancang cara menilai kesan iklim pada sistem air"
    id: "Menyusun cara menilai dampak iklim pada sistem air"
    hi: "जल प्रणाली पर जलवायु प्रभाव आंकने की योजना बनाना"
