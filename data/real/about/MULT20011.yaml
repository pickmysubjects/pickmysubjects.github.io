code: MULT20011
year: 2026
learn:
  en: "Explaining science to different audiences in writing, talks and media, plus CVs, cover letters and interviews for science graduates."
  zh: "面向不同受众讲解科学：写作、演讲和媒体传播，并练习理科毕业生的简历、求职信和面试。"
  zh-TW: "面向不同受眾講解科學：寫作、演講和媒體傳播，並練習理科畢業生的履歷、求職信和面試。"
  ja: "文章・講演・メディアで科学を様々な相手に伝える。理系卒業生向けの履歴書、カバーレター、面接対策も。"
  ko: "글, 발표, 미디어로 다양한 청중에게 과학을 전달한다. 이공계 졸업생을 위한 이력서, 자기소개서, 면접도 다룬다."
  vi: "Giải thích khoa học cho nhiều đối tượng qua bài viết, bài nói và truyền thông, cùng CV, thư xin việc và phỏng vấn."
  ms: "Menerangkan sains kepada pelbagai khalayak melalui tulisan, ceramah dan media, serta CV, surat iringan dan temu duga."
  id: "Menjelaskan sains ke berbagai audiens lewat tulisan, presentasi dan media, plus CV, surat lamaran dan wawancara kerja."
  hi: "लेखन, भाषण और मीडिया से अलग-अलग श्रोताओं को विज्ञान समझाना, साथ में विज्ञान स्नातकों के लिए CV, कवर लेटर और इंटरव्यू।"
outcomes:
  - en: "Adapt science messages for non-expert audiences"
    zh: "针对非专业受众调整科学信息"
    zh-TW: "針對非專業受眾調整科學訊息"
    ja: "専門外の相手に合わせて科学の話を伝える"
    ko: "비전문가 청중에 맞춰 과학 메시지 전달하기"
    vi: "Điều chỉnh thông điệp khoa học cho người không chuyên"
    ms: "Sesuaikan mesej sains untuk khalayak bukan pakar"
    id: "Menyesuaikan pesan sains untuk audiens awam"
    hi: "गैर-विशेषज्ञ श्रोताओं के लिए विज्ञान की बात ढालना"
  - en: "Judge what makes science communication work"
    zh: "判断怎样的科学传播更有效"
    zh-TW: "判斷怎樣的科學傳播更有效"
    ja: "効果的な科学コミュニケーションの条件を見極める"
    ko: "효과적인 과학 커뮤니케이션의 조건 판단하기"
    vi: "Đánh giá điều gì làm truyền thông khoa học hiệu quả"
    ms: "Nilai apa yang menjadikan komunikasi sains berkesan"
    id: "Menilai apa yang membuat komunikasi sains efektif"
    hi: "यह परखना कि विज्ञान संचार कब असरदार होता है"
  - en: "Present yourself well in job applications"
    zh: "在求职申请中更好地展示自己"
    zh-TW: "在求職申請中更好地展現自己"
    ja: "就職応募で自分をうまくアピールする"
    ko: "입사 지원에서 자신을 잘 드러내기"
    vi: "Thể hiện bản thân tốt khi nộp đơn xin việc"
    ms: "Tonjolkan diri dengan baik dalam permohonan kerja"
    id: "Menampilkan diri dengan baik saat melamar kerja"
    hi: "नौकरी के आवेदन में खुद को अच्छे से पेश करना"
