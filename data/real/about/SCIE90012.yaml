code: SCIE90012
year: 2027
learn:
  en: "Communicating science to different audiences in writing and speech, with feedback and small team projects."
  zh: "用书面和口头方式向不同受众传播科学，并获得反馈、完成小组项目。"
  zh-TW: "用書面與口頭方式向不同受眾傳播科學，並獲得回饋、完成小組專題。"
  ja: "さまざまな相手に科学を文章と口頭で伝える。フィードバックと少人数チームの課題あり。"
  ko: "다양한 청중에게 글과 말로 과학 전달하기, 피드백과 소규모 팀 프로젝트 포함."
  vi: "Truyền đạt khoa học cho nhiều đối tượng bằng văn bản và lời nói, có phản hồi và dự án nhóm nhỏ."
  ms: "Menyampaikan sains kepada pelbagai khalayak secara bertulis dan lisan, dengan maklum balas dan projek pasukan kecil."
  id: "Mengomunikasikan sains ke berbagai audiens secara tertulis dan lisan, dengan umpan balik dan proyek tim kecil."
  hi: "अलग-अलग श्रोताओं को लिखकर और बोलकर विज्ञान बताना, प्रतिक्रिया और छोटी टीम परियोजनाओं के साथ।"
outcomes:
  - en: "Explain why scientists need to communicate"
    zh: "解释科学家为何需要做传播"
    zh-TW: "解釋科學家為何需要做傳播"
    ja: "科学者が発信すべき理由を説明する"
    ko: "과학자가 소통해야 하는 이유 설명하기"
    vi: "Giải thích vì sao nhà khoa học cần truyền đạt"
    ms: "Menerangkan mengapa saintis perlu berkomunikasi"
    id: "Menjelaskan mengapa ilmuwan perlu berkomunikasi"
    hi: "वैज्ञानिकों को संवाद क्यों करना चाहिए, समझाना"
  - en: "Spot what makes communication effective"
    zh: "找出有效传播的共同特点"
    zh-TW: "找出有效傳播的共同特點"
    ja: "効果的な伝え方の特徴を見つける"
    ko: "효과적인 소통의 특징 찾기"
    vi: "Nhận ra điều làm truyền đạt hiệu quả"
    ms: "Mengenal pasti ciri komunikasi berkesan"
    id: "Mengenali ciri komunikasi yang efektif"
    hi: "प्रभावी संवाद की विशेषताएँ पहचानना"
  - en: "Tailor science messages to an audience"
    zh: "根据受众调整科学信息"
    zh-TW: "依受眾調整科學訊息"
    ja: "相手に合わせて科学の伝え方を変える"
    ko: "청중에 맞게 과학 메시지 조정하기"
    vi: "Điều chỉnh thông điệp khoa học theo đối tượng"
    ms: "Menyesuaikan mesej sains mengikut khalayak"
    id: "Menyesuaikan pesan sains dengan audiens"
    hi: "श्रोताओं के अनुसार वैज्ञानिक संदेश ढालना"
