code: MUSI10194
year: 2026
learn:
  en: "Builds on Interactive Composition 1: more media work, a creative brief and your own live audio-visual event."
  zh: "在互动作曲1的基础上：更多跨媒介创作、完成创作任务书，并呈现个人视听活动。"
  zh-TW: "在互動作曲1的基礎上：更多跨媒介創作、完成創作任務書，並呈現個人視聽活動。"
  ja: "Interactive Composition 1の続き。メディア作品、課題に沿った制作、自分のオーディオビジュアル公演。"
  ko: "Interactive Composition 1 심화. 매체 작업, 창작 과제, 개인 오디오비주얼 행사."
  vi: "Nối tiếp phần 1: thêm tác phẩm đa phương tiện, một đề bài sáng tác và sự kiện nghe nhìn riêng."
  ms: "Lanjutan bahagian 1: lebih banyak karya media, taklimat kreatif dan acara audio-visual sendiri."
  id: "Lanjutan bagian 1: lebih banyak karya media, brief kreatif, dan acara audio-visual pribadi."
  hi: "भाग 1 का अगला चरण: और मीडिया काम, एक क्रिएटिव ब्रीफ़ और अपना ऑडियो-विज़ुअल कार्यक्रम।"
outcomes:
  - en: "Draw on varied artistic references"
    zh: "借鉴多样的艺术参照"
    zh-TW: "借鑑多樣的藝術參照"
    ja: "多様な芸術的参照を取り入れる"
    ko: "다양한 예술적 참고 활용하기"
    vi: "Vận dụng nhiều nguồn nghệ thuật"
    ms: "Guna pelbagai rujukan seni"
    id: "Memakai beragam rujukan seni"
    hi: "विविध कलात्मक संदर्भ अपनाना"
  - en: "Meet a creative brief in your own style"
    zh: "以个人风格完成创作任务"
    zh-TW: "以個人風格完成創作任務"
    ja: "自分の作風で課題に応える"
    ko: "자신의 스타일로 창작 과제 해내기"
    vi: "Làm đề bài sáng tác theo phong cách riêng"
    ms: "Penuhi taklimat kreatif gaya sendiri"
    id: "Memenuhi brief kreatif dengan gaya sendiri"
    hi: "अपनी शैली में क्रिएटिव ब्रीफ़ पूरा करना"
  - en: "Stage an audio-visual event"
    zh: "策划并呈现一场视听活动"
    zh-TW: "策劃並呈現一場視聽活動"
    ja: "オーディオビジュアル公演を行う"
    ko: "오디오비주얼 행사 열기"
    vi: "Tổ chức một sự kiện nghe nhìn"
    ms: "Anjurkan acara audio-visual"
    id: "Menggelar acara audio-visual"
    hi: "ऑडियो-विज़ुअल कार्यक्रम प्रस्तुत करना"
