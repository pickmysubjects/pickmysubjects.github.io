code: ABPL90409
year: 2027
learn:
  en: "Cities built around knowledge industries, and what this means for property, housing, infrastructure and planning."
  zh: "以知识产业为核心的城市发展，以及它对房地产、住房、基础设施和规划的影响。"
  zh-TW: "以知識產業為核心的城市發展，以及它對房地產、住房、基礎設施和規劃的影響。"
  ja: "知識産業を軸にした都市開発と、不動産・住宅・インフラ・計画への影響。"
  ko: "지식 산업 중심의 도시 발전과 부동산·주택·인프라·계획에 미치는 영향."
  vi: "Phát triển đô thị dựa vào ngành tri thức và tác động tới bất động sản, nhà ở, hạ tầng, quy hoạch."
  ms: "Pembangunan bandar berasaskan industri ilmu dan kesannya pada hartanah, perumahan dan infrastruktur."
  id: "Pembangunan kota berbasis industri pengetahuan dan dampaknya pada properti, perumahan, dan infrastruktur."
  hi: "ज्ञान उद्योगों पर आधारित शहरी विकास और संपत्ति, आवास, बुनियादी ढाँचे व योजना पर उसका असर।"
outcomes:
  - en: "Explain knowledge-based urban development"
    zh: "解释知识型城市发展"
    zh-TW: "解釋知識型城市發展"
    ja: "知識基盤型の都市開発を説明する"
    ko: "지식 기반 도시 발전 설명하기"
    vi: "Giải thích phát triển đô thị dựa trên tri thức"
    ms: "Menerangkan pembangunan bandar berasaskan ilmu"
    id: "Menjelaskan pembangunan kota berbasis pengetahuan"
    hi: "ज्ञान-आधारित शहरी विकास समझाना"
  - en: "Evaluate policy and investment practice"
    zh: "评估政策与投资实践"
    zh-TW: "評估政策與投資實務"
    ja: "政策と投資の実務を評価する"
    ko: "정책과 투자 실무 평가하기"
    vi: "Đánh giá chính sách và đầu tư"
    ms: "Menilai amalan dasar dan pelaburan"
    id: "Mengevaluasi kebijakan dan praktik investasi"
    hi: "नीति और निवेश व्यवहार का मूल्यांकन"
