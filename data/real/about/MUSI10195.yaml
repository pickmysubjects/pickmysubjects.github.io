code: MUSI10195
year: 2026
learn:
  en: "Composers work as a group in a hands-on lab, making new cross-media pieces together and keeping a logbook."
  zh: "作曲学生在实践工作坊中合作，用多种媒介共同创作新作品并记录日志。"
  zh-TW: "作曲學生在實作工作坊中合作，用多種媒介共同創作新作品並記錄日誌。"
  ja: "作曲を学ぶ学生がラボ形式で協働し、複数メディアの新作を作り記録をつける。"
  ko: "작곡 학생들이 실습 랩에서 함께 여러 매체의 새 작품을 만들고 기록장을 쓴다."
  vi: "Sinh viên sáng tác cùng làm việc trong phòng lab, tạo tác phẩm đa phương tiện và ghi nhật ký."
  ms: "Pelajar komposisi bekerja dalam makmal praktikal, mencipta karya pelbagai media dan menulis log."
  id: "Mahasiswa komposisi bekerja di lab praktik, membuat karya lintas media bersama dan menulis log."
  hi: "संगीत रचनाकार लैब में साथ मिलकर कई माध्यमों की नई रचनाएँ बनाते हैं और लॉगबुक रखते हैं।"
outcomes:
  - en: "Make music together in a group"
    zh: "在小组中共同创作音乐"
    zh-TW: "在小組中共同創作音樂"
    ja: "グループで音楽を作る"
    ko: "그룹으로 함께 음악 만들기"
    vi: "Cùng nhóm sáng tác âm nhạc"
    ms: "Cipta muzik bersama dalam kumpulan"
    id: "Membuat musik bersama dalam kelompok"
    hi: "समूह में मिलकर संगीत बनाना"
  - en: "Combine music with other art forms and media"
    zh: "将音乐与其他艺术形式和媒介结合"
    zh-TW: "將音樂與其他藝術形式和媒介結合"
    ja: "音楽を他の芸術やメディアと組み合わせる"
    ko: "음악을 다른 예술·매체와 결합하기"
    vi: "Kết hợp âm nhạc với nghệ thuật và phương tiện khác"
    ms: "Gabung muzik dengan seni dan media lain"
    id: "Menggabungkan musik dengan seni dan media lain"
    hi: "संगीत को अन्य कलाओं व माध्यमों से जोड़ना"
  - en: "Reflect on your own experiments in a logbook"
    zh: "在日志中反思自己的实验"
    zh-TW: "在日誌中反思自己的實驗"
    ja: "ログブックで自分の実験を振り返る"
    ko: "기록장에 자신의 실험 돌아보기"
    vi: "Suy ngẫm thử nghiệm của mình trong nhật ký"
    ms: "Renung eksperimen sendiri dalam log"
    id: "Merefleksikan eksperimen sendiri di log"
    hi: "लॉगबुक में अपने प्रयोगों पर विचार"
