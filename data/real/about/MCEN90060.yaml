code: MCEN90060
year: 2027
learn:
  en: "Engineering a product's whole life cycle sustainably, from raw materials to disposal, including the circular economy."
  zh: "从原材料到废弃，以可持续方式规划产品的整个生命周期，包括生命周期评价和循环经济。"
  zh-TW: "從原料到廢棄，以永續方式規劃產品的整個生命週期，包括生命週期評估與循環經濟。"
  ja: "原材料から廃棄まで、製品のライフサイクル全体を持続可能に設計する。LCAや循環経済も扱う。"
  ko: "원료부터 폐기까지 제품 전 생애주기를 지속가능하게 설계, 전과정평가와 순환경제 포함."
  vi: "Thiết kế bền vững toàn vòng đời sản phẩm, từ nguyên liệu đến thải bỏ, gồm đánh giá vòng đời và kinh tế tuần hoàn."
  ms: "Kejuruteraan kitaran hayat produk secara mampan, daripada bahan mentah hingga pelupusan, termasuk penilaian kitaran hayat dan ekonomi kitaran."
  id: "Merekayasa seluruh siklus hidup produk secara berkelanjutan, dari bahan baku hingga pembuangan, termasuk LCA dan ekonomi sirkular."
  hi: "कच्चे माल से निपटान तक उत्पाद के पूरे जीवन चक्र की टिकाऊ इंजीनियरिंग, LCA और सर्कुलर इकॉनमी सहित।"
outcomes:
  - en: "Analyse the triple bottom line of an engineering project"
    zh: "分析工程项目的三重底线"
    zh-TW: "分析工程專案的三重底線"
    ja: "工学プロジェクトのトリプルボトムラインを分析する"
    ko: "공학 프로젝트의 트리플 바텀 라인 분석하기"
    vi: "Phân tích ba trụ cột bền vững của dự án kỹ thuật"
    ms: "Menganalisis garis dasar tiga serangkai projek kejuruteraan"
    id: "Menganalisis triple bottom line proyek teknik"
    hi: "इंजीनियरिंग परियोजना की ट्रिपल बॉटम लाइन का विश्लेषण"
  - en: "Use life cycle analysis tools"
    zh: "使用生命周期分析工具"
    zh-TW: "使用生命週期分析工具"
    ja: "ライフサイクル分析ツールを使う"
    ko: "전과정 분석 도구 사용하기"
    vi: "Dùng công cụ phân tích vòng đời"
    ms: "Menggunakan alat analisis kitaran hayat"
    id: "Memakai alat analisis siklus hidup"
    hi: "जीवन चक्र विश्लेषण उपकरणों का उपयोग"
