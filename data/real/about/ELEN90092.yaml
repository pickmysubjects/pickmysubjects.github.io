code: ELEN90092
year: 2027
learn:
  en: "How to run a power system and electricity market securely and cheaply with lots of renewables."
  zh: "在大量可再生能源接入下，如何安全、经济地运行电力系统和电力市场。"
  zh-TW: "在大量再生能源併網下，如何安全、經濟地運轉電力系統與電力市場。"
  ja: "再エネが多い中で、電力系統と電力市場を安全かつ経済的に運用する方法。"
  ko: "재생에너지 비중이 높을 때 전력 시스템과 전력시장을 안전하고 경제적으로 운영하는 법."
  vi: "Cách vận hành hệ thống điện và thị trường điện an toàn, tiết kiệm khi có nhiều năng lượng tái tạo."
  ms: "Cara mengendalikan sistem kuasa dan pasaran elektrik dengan selamat dan murah apabila banyak tenaga boleh baharu."
  id: "Cara mengoperasikan sistem tenaga dan pasar listrik secara aman dan hemat dengan banyak energi terbarukan."
  hi: "बहुत सारी नवीकरणीय ऊर्जा के साथ बिजली प्रणाली और बिजली बाज़ार को सुरक्षित व किफ़ायती ढंग से चलाना।"
outcomes:
  - en: "Use optimisation tools for power system and market problems"
    zh: "用优化工具解决电力系统和市场问题"
    zh-TW: "用最佳化工具解決電力系統與市場問題"
    ja: "最適化ツールで電力系統・市場の問題を解く"
    ko: "최적화 도구로 전력 시스템·시장 문제 풀기"
    vi: "Dùng công cụ tối ưu cho bài toán hệ thống điện và thị trường"
    ms: "Menggunakan alat pengoptimuman untuk masalah sistem kuasa dan pasaran"
    id: "Memakai alat optimisasi untuk masalah sistem tenaga dan pasar"
    hi: "बिजली प्रणाली और बाज़ार की समस्याओं के लिए ऑप्टिमाइज़ेशन टूल"
  - en: "Explain the difference between security and reliability"
    zh: "解释安全性与可靠性的区别"
    zh-TW: "解釋安全性與可靠性的差異"
    ja: "セキュリティと信頼度の違いを説明する"
    ko: "안전도와 신뢰도의 차이 설명하기"
    vi: "Giải thích khác biệt giữa an ninh và độ tin cậy"
    ms: "Menerangkan beza antara keselamatan dan kebolehpercayaan"
    id: "Menjelaskan beda keamanan dan keandalan"
    hi: "सुरक्षा और विश्वसनीयता का अंतर समझाना"
  - en: "Build bidding strategies under price uncertainty"
    zh: "在价格不确定下制定竞价策略"
    zh-TW: "在價格不確定下制定競價策略"
    ja: "価格の不確実性の下で入札戦略を立てる"
    ko: "가격 불확실성 아래 입찰 전략 세우기"
    vi: "Xây dựng chiến lược chào giá khi giá không chắc chắn"
    ms: "Membina strategi bidaan di bawah ketidakpastian harga"
    id: "Menyusun strategi penawaran di bawah ketidakpastian harga"
    hi: "क़ीमत की अनिश्चितता में बोली रणनीति बनाना"
