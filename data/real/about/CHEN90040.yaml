code: CHEN90040
year: 2027
learn:
  en: "Applying chemical engineering to food processing and packaging while cutting water, energy, salt and waste."
  zh: "把化学工程用于食品加工和包装，同时减少水、能源、钠盐和浪费。"
  zh-TW: "將化學工程應用於食品加工與包裝，同時減少水、能源、鈉鹽與浪費。"
  ja: "化学工学を食品加工と包装に応用し、水・エネルギー・塩分・廃棄物を減らす。"
  ko: "화학공학을 식품 가공과 포장에 적용하면서 물·에너지·나트륨·폐기물을 줄이기."
  vi: "Áp dụng kỹ thuật hóa học vào chế biến và đóng gói thực phẩm, đồng thời giảm nước, năng lượng, muối và rác thải."
  ms: "Menggunakan kejuruteraan kimia dalam pemprosesan dan pembungkusan makanan sambil mengurangkan air, tenaga, garam dan sisa."
  id: "Menerapkan teknik kimia pada pengolahan dan pengemasan pangan sambil mengurangi air, energi, garam dan limbah."
  hi: "पानी, ऊर्जा, नमक और कचरा घटाते हुए खाद्य प्रसंस्करण और पैकेजिंग में रासायनिक इंजीनियरिंग का उपयोग।"
outcomes:
  - en: "Design food processes and equipment from chemical and biological principles"
    zh: "依据化学和生物原理设计食品工艺与设备"
    zh-TW: "依據化學與生物原理設計食品製程與設備"
    ja: "化学・生物の原理から食品プロセスと装置を設計する"
    ko: "화학·생물 원리로 식품 공정과 설비 설계하기"
    vi: "Thiết kế quy trình và thiết bị thực phẩm từ nguyên lý hóa học, sinh học"
    ms: "Mereka bentuk proses dan peralatan makanan berdasarkan prinsip kimia dan biologi"
    id: "Merancang proses dan peralatan pangan dari prinsip kimia dan biologi"
    hi: "रासायनिक और जैविक सिद्धांतों से खाद्य प्रक्रियाएँ और उपकरण डिज़ाइन करना"
  - en: "Reduce the sodium, water and energy footprint of food making"
    zh: "降低食品生产的钠、水和能源足迹"
    zh-TW: "降低食品生產的鈉、水與能源足跡"
    ja: "食品製造のナトリウム・水・エネルギー負荷を減らす"
    ko: "식품 제조의 나트륨·물·에너지 발자국 줄이기"
    vi: "Giảm dấu chân natri, nước và năng lượng trong sản xuất thực phẩm"
    ms: "Mengurangkan jejak natrium, air dan tenaga dalam pembuatan makanan"
    id: "Mengurangi jejak natrium, air dan energi dalam produksi pangan"
    hi: "खाद्य निर्माण में सोडियम, पानी और ऊर्जा की खपत घटाना"
  - en: "Run lab-scale food and beverage experiments"
    zh: "开展实验室规模的食品饮料实验"
    zh-TW: "進行實驗室規模的食品飲料實驗"
    ja: "実験室規模の食品・飲料実験を行う"
    ko: "실험실 규모의 식품·음료 실험 수행하기"
    vi: "Thực hiện thí nghiệm thực phẩm và đồ uống quy mô phòng thí nghiệm"
    ms: "Menjalankan eksperimen makanan dan minuman berskala makmal"
    id: "Melakukan eksperimen pangan dan minuman skala laboratorium"
    hi: "प्रयोगशाला स्तर पर खाद्य और पेय प्रयोग करना"
