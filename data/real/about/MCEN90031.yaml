code: MCEN90031
year: 2027
learn:
  en: "Writing scientific simulation software that uses modern parallel hardware well, tying maths to the machine."
  zh: "编写能充分利用现代并行硬件的科学仿真软件，把数学与硬件结合起来。"
  zh-TW: "撰寫能善用現代平行硬體的科學模擬軟體，將數學與硬體結合。"
  ja: "最新の並列ハードを活かす科学シミュレーションソフトの作り方、数学とハードの結び付け。"
  ko: "최신 병렬 하드웨어를 잘 쓰는 과학 시뮬레이션 소프트웨어 작성, 수학과 하드웨어 연결."
  vi: "Viết phần mềm mô phỏng khoa học tận dụng phần cứng song song hiện đại, gắn toán với máy."
  ms: "Menulis perisian simulasi saintifik yang memanfaatkan perkakasan selari moden."
  id: "Menulis perangkat lunak simulasi ilmiah yang memanfaatkan perangkat keras paralel modern."
  hi: "आधुनिक पैरेलल हार्डवेयर का अच्छा उपयोग करने वाला वैज्ञानिक सिमुलेशन सॉफ़्टवेयर लिखना।"
outcomes:
  - en: "Write parallel code for physics-based simulations"
    zh: "为物理仿真编写并行代码"
    zh-TW: "為物理模擬撰寫平行程式"
    ja: "物理シミュレーションの並列コードを書く"
    ko: "물리 기반 시뮬레이션용 병렬 코드 작성하기"
    vi: "Viết mã song song cho mô phỏng vật lý"
    ms: "Menulis kod selari untuk simulasi berasaskan fizik"
    id: "Menulis kode paralel untuk simulasi fisika"
    hi: "भौतिकी सिमुलेशन के लिए पैरेलल कोड लिखना"
  - en: "Tune scientific software for HPC hardware"
    zh: "针对高性能计算硬件优化科学软件"
    zh-TW: "針對高效能運算硬體調校科學軟體"
    ja: "HPC向けに科学ソフトを最適化する"
    ko: "HPC 하드웨어에 맞게 과학 소프트웨어 튜닝하기"
    vi: "Tinh chỉnh phần mềm khoa học cho phần cứng HPC"
    ms: "Menala perisian saintifik untuk perkakasan HPC"
    id: "Menyetel perangkat lunak ilmiah untuk perangkat keras HPC"
    hi: "HPC हार्डवेयर के लिए वैज्ञानिक सॉफ़्टवेयर ट्यून करना"
