code: CRIM30015
year: 2026
learn:
  en: "What terrorism is, how states both fight and help create it, through cases from Northern Ireland to the Middle East."
  zh: "什么是恐怖主义，国家如何既打击又促成它，案例从北爱尔兰到中东。"
  zh-TW: "什麼是恐怖主義，國家如何既打擊又促成它，案例從北愛爾蘭到中東。"
  ja: "テロリズムとは何か、国家がそれをどう抑え、また生み出しもするのかを、北アイルランドから中東までの事例で学ぶ。"
  ko: "테러리즘이란 무엇인지, 국가가 이를 어떻게 막으면서도 만들어 내는지 북아일랜드부터 중동까지의 사례로 배운다."
  vi: "Khủng bố là gì, nhà nước vừa chống vừa góp phần tạo ra nó ra sao, qua các trường hợp từ Bắc Ireland đến Trung Đông."
  ms: "Apa itu keganasan, cara negara melawan dan turut mewujudkannya, melalui kes dari Ireland Utara hingga Timur Tengah."
  id: "Apa itu terorisme, cara negara melawan sekaligus ikut menciptakannya, lewat kasus dari Irlandia Utara hingga Timur Tengah."
  hi: "आतंकवाद क्या है, राज्य इससे कैसे लड़ते हैं और इसे पैदा करने में कैसे हाथ बँटाते हैं, उत्तरी आयरलैंड से मध्य पूर्व तक के उदाहरणों से।"
outcomes:
  - en: "Analyse how terrorist movements rise and fall"
    zh: "分析恐怖主义运动的兴起与衰落"
    zh-TW: "分析恐怖主義運動的興起與衰落"
    ja: "テロ運動の盛衰を分析する"
    ko: "테러 운동의 성장과 쇠퇴 분석하기"
    vi: "Phân tích sự trỗi dậy và suy tàn của các phong trào khủng bố"
    ms: "Analisis kebangkitan dan kejatuhan gerakan pengganas"
    id: "Menganalisis bangkit dan runtuhnya gerakan teroris"
    hi: "आतंकी आंदोलनों के उभार और पतन का विश्लेषण करना"
  - en: "Link terrorism to wider social and political change"
    zh: "把恐怖主义与更广泛的社会政治变化联系起来"
    zh-TW: "把恐怖主義與更廣泛的社會政治變化連結起來"
    ja: "テロを広い社会・政治の変化と結びつける"
    ko: "테러리즘을 더 넓은 사회·정치 변화와 연결하기"
    vi: "Liên hệ khủng bố với các thay đổi xã hội, chính trị rộng hơn"
    ms: "Kaitkan keganasan dengan perubahan sosial dan politik yang lebih luas"
    id: "Mengaitkan terorisme dengan perubahan sosial dan politik yang lebih luas"
    hi: "आतंकवाद को बड़े सामाजिक और राजनीतिक बदलावों से जोड़ना"
  - en: "Examine the state's role in counter-terrorism"
    zh: "审视国家在反恐中的角色"
    zh-TW: "審視國家在反恐中的角色"
    ja: "テロ対策における国家の役割を検討する"
    ko: "대테러에서 국가의 역할 살펴보기"
    vi: "Xem xét vai trò của nhà nước trong chống khủng bố"
    ms: "Teliti peranan negara dalam pencegahan keganasan"
    id: "Mengkaji peran negara dalam kontraterorisme"
    hi: "आतंकवाद-रोधी कार्रवाई में राज्य की भूमिका की जाँच करना"
