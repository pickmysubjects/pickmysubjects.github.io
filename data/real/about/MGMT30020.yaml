code: MGMT30020
year: 2026
learn:
  en: "Using data and quantitative models to make supply chain and operations decisions, like forecasting and ordering."
  zh: "用数据和量化模型做供应链与运营决策，如预测和订货。"
  zh-TW: "用資料和量化模型做供應鏈與營運決策，如預測和訂貨。"
  ja: "データと数理モデルでサプライチェーンや業務の判断をする（需要予測や発注など）。"
  ko: "데이터와 정량 모델로 공급망·운영 결정 내리기(수요 예측, 발주 등)."
  vi: "Dùng dữ liệu và mô hình định lượng để ra quyết định chuỗi cung ứng, vận hành như dự báo, đặt hàng."
  ms: "Guna data dan model kuantitatif untuk keputusan rantaian bekalan dan operasi, seperti ramalan dan pesanan."
  id: "Memakai data dan model kuantitatif untuk keputusan rantai pasok dan operasi, seperti peramalan dan pemesanan."
  hi: "डेटा और मात्रात्मक मॉडल से सप्लाई चेन और ऑपरेशंस के फ़ैसले, जैसे पूर्वानुमान और ऑर्डरिंग।"
outcomes:
  - en: "Build forecasting and optimisation models"
    zh: "建立预测和优化模型"
    zh-TW: "建立預測和最佳化模型"
    ja: "予測と最適化のモデルを作る"
    ko: "예측·최적화 모델 만들기"
    vi: "Xây dựng mô hình dự báo và tối ưu hóa"
    ms: "Bina model ramalan dan pengoptimuman"
    id: "Membangun model peramalan dan optimasi"
    hi: "पूर्वानुमान और ऑप्टिमाइज़ेशन मॉडल बनाना"
  - en: "Use large datasets to find where operations can improve"
    zh: "用大数据找出运营可改进之处"
    zh-TW: "用大量資料找出營運可改善之處"
    ja: "大量のデータから業務の改善点を見つける"
    ko: "대규모 데이터로 운영 개선점 찾기"
    vi: "Dùng dữ liệu lớn để tìm điểm cải thiện vận hành"
    ms: "Guna set data besar untuk cari ruang penambahbaikan"
    id: "Memakai data besar untuk menemukan perbaikan operasi"
    hi: "बड़े डेटा से ऑपरेशंस में सुधार की जगह ढूँढना"
  - en: "Explain analytics results to non-experts"
    zh: "向非专业人士解释分析结果"
    zh-TW: "向非專業人士解釋分析結果"
    ja: "分析結果を専門外の人に説明する"
    ko: "분석 결과를 비전문가에게 설명하기"
    vi: "Giải thích kết quả phân tích cho người không chuyên"
    ms: "Terangkan hasil analitik kepada bukan pakar"
    id: "Menjelaskan hasil analitik kepada orang awam"
    hi: "एनालिटिक्स के नतीजे गैर-विशेषज्ञों को समझाना"
