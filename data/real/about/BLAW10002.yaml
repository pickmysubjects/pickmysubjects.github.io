code: BLAW10002
year: 2026
learn:
  en: "How law protects and limits free speech, from newspapers and TV to social media, influencers and online platforms."
  zh: "法律如何保护和限制言论自由，从报纸电视到社交媒体和网络平台。"
  zh-TW: "法律如何保護和限制言論自由，從報紙電視到社群媒體和網路平台。"
  ja: "新聞やテレビからSNSやネット上のプラットフォームまで、法が言論の自由をどう守り制限するか。"
  ko: "신문·TV부터 SNS와 온라인 플랫폼까지, 법이 표현의 자유를 어떻게 보호하고 제한하는지."
  vi: "Pháp luật bảo vệ và giới hạn tự do ngôn luận ra sao, từ báo chí, truyền hình đến mạng xã hội và nền tảng số."
  ms: "Cara undang-undang melindungi dan mengehadkan kebebasan bersuara, dari akhbar dan TV hingga media sosial."
  id: "Cara hukum melindungi dan membatasi kebebasan berpendapat, dari koran dan TV sampai media sosial dan platform."
  hi: "अख़बार-टीवी से लेकर सोशल मीडिया तक, क़ानून अभिव्यक्ति की आज़ादी को कैसे बचाता और सीमित करता है।"
outcomes:
  - en: "Spot where media and the law meet"
    zh: "找出媒体与法律的交汇点"
    zh-TW: "找出媒體與法律的交會點"
    ja: "メディアと法が交わる場面を見つける"
    ko: "미디어와 법이 만나는 지점 찾기"
    vi: "Nhận ra nơi truyền thông và pháp luật giao nhau"
    ms: "Kenal pasti titik pertemuan media dan undang-undang"
    id: "Mengenali titik temu media dan hukum"
    hi: "मीडिया और क़ानून कहाँ मिलते हैं, यह पहचानना"
  - en: "Explain how speech is both protected and restricted in different legal settings"
    zh: "解释不同法律情境下言论如何既受保护又受限制"
    zh-TW: "說明不同法律情境下言論如何既受保護又受限制"
    ja: "さまざまな法的場面で言論が守られ制限される仕組みを説明する"
    ko: "여러 법적 상황에서 표현이 보호되고 제한되는 방식 설명"
    vi: "Giải thích ngôn luận vừa được bảo vệ vừa bị giới hạn ra sao"
    ms: "Terangkan cara ucapan dilindungi dan dihadkan dalam konteks undang-undang"
    id: "Menjelaskan cara ucapan dilindungi sekaligus dibatasi dalam berbagai konteks hukum"
    hi: "अलग-अलग क़ानूनी हालात में बोलने की आज़ादी की सुरक्षा और सीमा समझाना"
  - en: "Analyse how the law reacts to new technology and changing social norms"
    zh: "分析法律如何应对新技术和社会观念变化"
    zh-TW: "分析法律如何因應新科技和社會觀念變化"
    ja: "新しい技術や社会規範の変化に法がどう対応するか分析する"
    ko: "법이 신기술과 사회 규범 변화에 어떻게 대응하는지 분석"
    vi: "Phân tích luật phản ứng với công nghệ mới và chuẩn mực xã hội"
    ms: "Analisis cara undang-undang bertindak balas terhadap teknologi baharu"
    id: "Menganalisis respons hukum terhadap teknologi baru dan norma sosial"
    hi: "नई तकनीक और बदलते सामाजिक नियमों पर क़ानून की प्रतिक्रिया का विश्लेषण"
