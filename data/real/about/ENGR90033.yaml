code: ENGR90033
year: 2027
learn:
  en: "Professional work experience at a host organisation, supported by an academic mentor and structured reflection."
  zh: "在接收单位进行专业工作实习，由学术导师指导并做结构化反思。"
  zh-TW: "在合作單位進行專業實習，由學術導師指導並做結構化反思。"
  ja: "受け入れ先での実務経験。学内メンターの支援と振り返りを伴う。"
  ko: "기관에서 전문 실무 경험, 학내 멘토 지도와 체계적 성찰 포함."
  vi: "Kinh nghiệm làm việc chuyên nghiệp tại tổ chức tiếp nhận, có cố vấn học thuật và suy ngẫm có cấu trúc."
  ms: "Pengalaman kerja profesional di organisasi tuan rumah, dengan mentor akademik dan refleksi berstruktur."
  id: "Pengalaman kerja profesional di organisasi mitra, didampingi mentor akademik dan refleksi terstruktur."
  hi: "होस्ट संगठन में प्रोफ़ेशनल कार्य अनुभव, अकादमिक मेंटर और व्यवस्थित चिंतन के साथ।"
outcomes:
  - en: "Reflect on your work to build professional skills"
    zh: "通过反思工作提升职业能力"
    zh-TW: "透過反思工作提升專業能力"
    ja: "仕事を振り返り職業スキルを伸ばす"
    ko: "업무 성찰로 직업 역량 키우기"
    vi: "Suy ngẫm công việc để phát triển kỹ năng nghề"
    ms: "Renung kerja untuk bina kemahiran profesional"
    id: "Merefleksikan kerja untuk membangun keterampilan profesional"
    hi: "काम पर विचार कर प्रोफ़ेशनल कौशल बढ़ाना"
  - en: "Use your experience when applying for jobs"
    zh: "在求职时运用实习经历"
    zh-TW: "在求職時運用實習經驗"
    ja: "就職活動で経験を活かす"
    ko: "취업 지원 시 경험 활용하기"
    vi: "Dùng kinh nghiệm khi xin việc"
    ms: "Guna pengalaman ketika memohon kerja"
    id: "Memakai pengalaman saat melamar kerja"
    hi: "नौकरी के आवेदन में अनुभव का उपयोग करना"
