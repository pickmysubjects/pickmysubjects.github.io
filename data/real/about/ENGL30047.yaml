code: ENGL30047
year: 2026
learn:
  en: "How literature has thought about nature, from early ideas to today's ecocriticism and the climate crisis."
  zh: "文学如何思考自然，从早期观念到今天的生态批评和气候危机。"
  zh-TW: "文學如何思考自然，從早期觀念到今天的生態批評和氣候危機。"
  ja: "文学が自然をどう考えてきたか、古い自然観から今日のエコクリティシズムと気候危機まで学ぶ。"
  ko: "문학이 자연을 어떻게 생각해 왔는지, 초기 관념부터 오늘날 생태 비평과 기후 위기까지 배운다."
  vi: "Văn học đã nghĩ về thiên nhiên ra sao, từ quan niệm xưa đến phê bình sinh thái và khủng hoảng khí hậu ngày nay."
  ms: "Cara sastera memikirkan alam, daripada idea awal hingga ekokritik dan krisis iklim kini."
  id: "Cara sastra memikirkan alam, dari gagasan awal sampai ekokritik dan krisis iklim sekarang."
  hi: "साहित्य ने प्रकृति के बारे में कैसे सोचा है, शुरुआती विचारों से आज की इकोक्रिटिसिज़्म और जलवायु संकट तक।"
outcomes:
  - en: "Explain main approaches in ecocriticism"
    zh: "说明生态批评的主要方法"
    zh-TW: "說明生態批評的主要方法"
    ja: "エコクリティシズムの主な方法を説明する"
    ko: "생태 비평의 주요 접근 설명하기"
    vi: "Giải thích các hướng chính của phê bình sinh thái"
    ms: "Terangkan pendekatan utama ekokritik"
    id: "Menjelaskan pendekatan utama ekokritik"
    hi: "इकोक्रिटिसिज़्म के मुख्य तरीके समझाना"
  - en: "Analyse how texts represent nature and crisis"
    zh: "分析作品如何表现自然与危机"
    zh-TW: "分析作品如何表現自然與危機"
    ja: "作品が自然と危機をどう描くか分析する"
    ko: "작품이 자연과 위기를 그리는 방식 분석하기"
    vi: "Phân tích cách văn bản thể hiện thiên nhiên và khủng hoảng"
    ms: "Analisis cara teks menggambarkan alam dan krisis"
    id: "Menganalisis cara teks menggambarkan alam dan krisis"
    hi: "पाठ प्रकृति और संकट को कैसे दिखाते हैं, विश्लेषण करना"
  - en: "Write an argued essay on literature and environment"
    zh: "就文学与环境写一篇论证性论文"
    zh-TW: "就文學與環境寫一篇論證性論文"
    ja: "文学と環境について論証的なエッセイを書く"
    ko: "문학과 환경에 관한 논증 에세이 쓰기"
    vi: "Viết bài luận có lập luận về văn học và môi trường"
    ms: "Tulis esei berhujah tentang sastera dan alam sekitar"
    id: "Menulis esai argumentatif tentang sastra dan lingkungan"
    hi: "साहित्य और पर्यावरण पर तर्कपूर्ण निबंध लिखना"
