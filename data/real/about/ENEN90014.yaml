code: ENEN90014
year: 2027
learn:
  en: "Fitting rooftop solar, batteries and flexible loads into buildings and suburbs, including virtual power plants."
  zh: "把屋顶光伏、电池和可调负荷融入建筑和社区，包括虚拟电厂。"
  zh-TW: "把屋頂太陽光電、電池與可調負載融入建築與社區，包括虛擬電廠。"
  ja: "屋根置き太陽光・蓄電池・柔軟な負荷を建物や地域に組み込む。仮想発電所も扱う。"
  ko: "옥상 태양광, 배터리, 유연한 부하를 건물과 지역에 통합하는 법, 가상발전소 포함."
  vi: "Đưa điện mặt trời mái nhà, pin và phụ tải linh hoạt vào tòa nhà và khu dân cư, gồm nhà máy điện ảo."
  ms: "Memasukkan solar bumbung, bateri dan beban fleksibel ke dalam bangunan dan kawasan, termasuk loji kuasa maya."
  id: "Memadukan PLTS atap, baterai, dan beban fleksibel ke gedung dan permukiman, termasuk pembangkit listrik virtual."
  hi: "छत के सोलर, बैटरी और लचीले लोड को इमारतों और उपनगरों में जोड़ना, वर्चुअल पावर प्लांट सहित।"
outcomes:
  - en: "Analyse demand profiles to find load flexibility"
    zh: "分析用电曲线，找出负荷调节空间"
    zh-TW: "分析用電曲線，找出負載調節空間"
    ja: "需要プロファイルを分析し負荷の柔軟性を見つける"
    ko: "수요 프로필을 분석해 부하 유연성 찾기"
    vi: "Phân tích biểu đồ phụ tải để tìm khả năng linh hoạt"
    ms: "Menganalisis profil permintaan untuk mencari fleksibiliti beban"
    id: "Menganalisis profil permintaan untuk menemukan fleksibilitas beban"
    hi: "माँग प्रोफ़ाइल का विश्लेषण कर लोड लचीलापन खोजना"
  - en: "Design solar and battery systems for buildings and communities"
    zh: "为建筑和社区设计光伏与储能系统"
    zh-TW: "為建築與社區設計太陽光電與儲能系統"
    ja: "建物や地域向けに太陽光と蓄電池を設計する"
    ko: "건물과 지역을 위한 태양광·배터리 시스템 설계하기"
    vi: "Thiết kế hệ thống điện mặt trời và pin cho tòa nhà, cộng đồng"
    ms: "Mereka bentuk sistem solar dan bateri untuk bangunan dan komuniti"
    id: "Merancang sistem surya dan baterai untuk gedung dan komunitas"
    hi: "इमारतों और समुदायों के लिए सोलर व बैटरी सिस्टम डिज़ाइन करना"
  - en: "Assess whether these projects pay off"
    zh: "评估这些项目的技术经济可行性"
    zh-TW: "評估這些專案的技術經濟可行性"
    ja: "これらの事業が採算に合うか評価する"
    ko: "이런 사업의 경제성 평가하기"
    vi: "Đánh giá các dự án này có đáng đầu tư không"
    ms: "Menilai sama ada projek ini berbaloi"
    id: "Menilai apakah proyek ini layak secara ekonomi"
    hi: "आकलन करना कि ये परियोजनाएँ फ़ायदेमंद हैं या नहीं"
