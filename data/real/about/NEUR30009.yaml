code: NEUR30009
year: 2027
learn:
  en: "The neuroscience of the brain's regulatory systems and how they shape behaviour, with modern research methods and clinical topics."
  zh: "研究大脑调节系统的神经科学及其对行为的影响，涉及现代研究方法和临床相关话题。"
  zh-TW: "研究大腦調節系統的神經科學及其對行為的影響，涵蓋現代研究方法和臨床相關議題。"
  ja: "脳の調節システムの神経科学と行動への影響を、現代の研究手法や臨床的なテーマとともに学ぶ。"
  ko: "뇌 조절 시스템의 신경과학과 행동에 미치는 영향을 현대 연구 방법과 임상 주제와 함께 배움."
  vi: "Thần kinh học về các hệ điều hòa của não và ảnh hưởng tới hành vi, kèm phương pháp nghiên cứu hiện đại và chủ đề lâm sàng."
  ms: "Neurosains sistem pengawalaturan otak dan kesannya pada tingkah laku, dengan kaedah penyelidikan moden dan topik klinikal."
  id: "Neurosains sistem regulasi otak dan pengaruhnya pada perilaku, dengan metode riset modern dan topik klinis."
  hi: "दिमाग की नियामक प्रणालियों का तंत्रिका विज्ञान और व्यवहार पर असर, आधुनिक शोध विधियों व क्लिनिकल विषयों के साथ।"
outcomes:
  - en: "Describe how the brain regulates mind and behaviour"
    zh: "描述大脑如何调节心理和行为"
    zh-TW: "描述大腦如何調節心理和行為"
    ja: "脳が心と行動を調節する仕組みを説明する"
    ko: "뇌가 심리와 행동을 조절하는 방식 설명하기"
    vi: "Mô tả cách não điều hòa tâm lý và hành vi"
    ms: "Huraikan cara otak mengawal minda dan tingkah laku"
    id: "Menjelaskan cara otak mengatur pikiran dan perilaku"
    hi: "दिमाग मन और व्यवहार को कैसे नियंत्रित करता है, बताना"
  - en: "Describe tools and current research on the brain"
    zh: "介绍研究大脑的技术和最新研究"
    zh-TW: "介紹研究大腦的技術和最新研究"
    ja: "脳を調べる技術と最新の研究を説明する"
    ko: "뇌 연구 기술과 최신 연구 설명하기"
    vi: "Mô tả công nghệ và nghiên cứu hiện nay về não"
    ms: "Huraikan teknologi dan kajian semasa tentang otak"
    id: "Menjelaskan teknologi dan riset terkini tentang otak"
    hi: "दिमाग पर शोध की तकनीकें और ताज़ा शोध बताना"
  - en: "Interpret brain connectome data with atlas tools"
    zh: "用脑图谱工具解读脑连接组数据"
    zh-TW: "用腦圖譜工具解讀腦連接體資料"
    ja: "脳アトラスでコネクトームデータを読み解く"
    ko: "뇌 아틀라스로 커넥톰 데이터 해석하기"
    vi: "Đọc dữ liệu connectome não bằng công cụ bản đồ não"
    ms: "Tafsir data konektom otak dengan alat atlas otak"
    id: "Menafsirkan data konektom otak dengan atlas otak"
    hi: "ब्रेन एटलस से कनेक्टोम डेटा की व्याख्या करना"
