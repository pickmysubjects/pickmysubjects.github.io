code: MECM20011
year: 2026
learn:
  en: "The main qualitative ways to study media texts, audiences and platforms, as groundwork for designing your own research."
  zh: "研究媒体文本、受众和平台的主要质性方法，为设计你自己的研究打基础。"
  zh-TW: "研究媒體文本、閱聽人和平台的主要質性方法，為設計你自己的研究打基礎。"
  ja: "メディアのテキスト、受け手、プラットフォームを調べる主な質的方法を学び、自分の研究を設計する土台をつくる。"
  ko: "미디어 텍스트, 수용자, 플랫폼을 연구하는 주요 질적 방법을 배우고 자신의 연구를 설계할 기초를 다진다."
  vi: "Các cách nghiên cứu định tính chính về văn bản, khán giả và nền tảng truyền thông, làm nền để tự thiết kế nghiên cứu."
  ms: "Kaedah kualitatif utama untuk mengkaji teks, khalayak dan platform media, sebagai asas mereka bentuk kajian sendiri."
  id: "Metode kualitatif utama untuk meneliti teks, khalayak, dan platform media, sebagai bekal merancang penelitian sendiri."
  hi: "मीडिया सामग्री, दर्शकों और प्लेटफ़ॉर्म को समझने के मुख्य गुणात्मक तरीके, ताकि आप अपना शोध खुद डिज़ाइन कर सकें।"
outcomes:
  - en: "Discuss different approaches to media research"
    zh: "讨论媒体研究的不同路径"
    zh-TW: "討論媒體研究的不同取徑"
    ja: "メディア研究のさまざまなアプローチを論じる"
    ko: "미디어 연구의 여러 접근법 논의하기"
    vi: "Thảo luận các hướng tiếp cận khác nhau trong nghiên cứu truyền thông"
    ms: "Bincangkan pendekatan berbeza dalam kajian media"
    id: "Membahas berbagai pendekatan riset media"
    hi: "मीडिया शोध के अलग-अलग तरीकों पर चर्चा करना"
  - en: "Weigh the strengths and limits of each method"
    zh: "权衡各种方法的优点和局限"
    zh-TW: "權衡各種方法的優點和侷限"
    ja: "各手法の長所と限界を比べる"
    ko: "각 방법의 장점과 한계 따져 보기"
    vi: "Cân nhắc điểm mạnh và hạn chế của từng phương pháp"
    ms: "Timbang kekuatan dan had setiap kaedah"
    id: "Menimbang kelebihan dan keterbatasan tiap metode"
    hi: "हर तरीके की ताकत और सीमाएँ परखना"
  - en: "Design a workable media research project"
    zh: "设计一个可行的媒体研究项目"
    zh-TW: "設計一個可行的媒體研究計畫"
    ja: "実現可能なメディア研究を設計する"
    ko: "실현 가능한 미디어 연구 설계하기"
    vi: "Thiết kế một dự án nghiên cứu truyền thông khả thi"
    ms: "Reka projek kajian media yang boleh dilaksanakan"
    id: "Merancang proyek riset media yang layak"
    hi: "एक व्यावहारिक मीडिया शोध प्रोजेक्ट डिज़ाइन करना"
