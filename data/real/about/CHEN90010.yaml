code: CHEN90010
year: 2027
learn:
  en: "Processing minerals into metals and products, and designing recycling to recover materials."
  zh: "把矿石加工成金属和产品，并设计回收流程来回收材料。"
  zh-TW: "把礦石加工成金屬與產品，並設計回收流程以回收材料。"
  ja: "鉱物を金属や製品に加工し、材料を回収するリサイクルを設計する。"
  ko: "광물을 금속과 제품으로 가공하고 재료 회수용 재활용 공정 설계하기."
  vi: "Chế biến khoáng sản thành kim loại, sản phẩm và thiết kế quy trình tái chế để thu hồi vật liệu."
  ms: "Memproses mineral menjadi logam dan produk, serta mereka kitar semula untuk mendapatkan semula bahan."
  id: "Mengolah mineral menjadi logam dan produk, serta merancang daur ulang untuk memulihkan bahan."
  hi: "खनिजों को धातु और उत्पादों में बदलना, और सामग्री वापस पाने के लिए रीसाइक्लिंग डिज़ाइन करना।"
outcomes:
  - en: "Design mineral processing equipment"
    zh: "设计矿物加工设备"
    zh-TW: "設計礦物加工設備"
    ja: "鉱物処理の装置を設計する"
    ko: "광물 처리 장비 설계하기"
    vi: "Thiết kế thiết bị chế biến khoáng sản"
    ms: "Mereka peralatan pemprosesan mineral"
    id: "Merancang peralatan pengolahan mineral"
    hi: "खनिज प्रसंस्करण उपकरण डिज़ाइन करना"
  - en: "Design tailings dewatering and recycling processes"
    zh: "设计尾矿脱水和回收流程"
    zh-TW: "設計尾礦脫水與回收流程"
    ja: "尾鉱の脱水とリサイクル工程を設計する"
    ko: "광미 탈수와 재활용 공정 설계하기"
    vi: "Thiết kế quy trình khử nước bùn thải và tái chế"
    ms: "Mereka proses penyahairan tailing dan kitar semula"
    id: "Merancang proses dewatering tailing dan daur ulang"
    hi: "टेलिंग डीवॉटरिंग और रीसाइक्लिंग प्रक्रियाएँ डिज़ाइन करना"
