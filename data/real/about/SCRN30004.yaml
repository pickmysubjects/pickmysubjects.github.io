code: SCRN30004
year: 2026
learn:
  en: "Film noir from silent cinema to digital, and how its pictures of gender and sexuality pushed against censorship."
  zh: "从默片到数字时代的黑色电影，以及其中的性别与性描写如何挑战审查。"
  zh-TW: "從默片到數位時代的黑色電影，以及其中的性別與性描寫如何挑戰審查。"
  ja: "サイレントからデジタルまでのフィルム・ノワールと、そのジェンダーと性の描写が検閲にどう挑んだかを学ぶ。"
  ko: "무성 영화부터 디지털까지의 필름 누아르와 그 젠더·섹슈얼리티 묘사가 검열에 어떻게 맞섰는지 배운다."
  vi: "Phim noir từ thời phim câm đến kỹ thuật số, và cách hình ảnh về giới và tính dục trong đó thách thức kiểm duyệt."
  ms: "Filem noir dari zaman filem bisu hingga digital, dan cara gambaran gender serta seksualitinya menentang penapisan."
  id: "Film noir dari era film bisu sampai digital, dan cara gambaran gender serta seksualitasnya menantang sensor."
  hi: "मूक सिनेमा से डिजिटल तक फ़िल्म न्वार, और उसमें जेंडर व यौनिकता के चित्रण ने सेंसरशिप को कैसे चुनौती दी।"
outcomes:
  - en: "Trace film noir across its main periods"
    zh: "梳理黑色电影的主要发展阶段"
    zh-TW: "梳理黑色電影的主要發展階段"
    ja: "フィルム・ノワールの主な時代をたどる"
    ko: "필름 누아르의 주요 시기 짚어 보기"
    vi: "Lần theo phim noir qua các giai đoạn chính"
    ms: "Jejaki filem noir merentas zaman utamanya"
    id: "Menelusuri film noir melintasi periode utamanya"
    hi: "फ़िल्म न्वार को उसके मुख्य दौरों में खोजना"
  - en: "Analyse noir style and storytelling"
    zh: "分析黑色电影的风格与叙事"
    zh-TW: "分析黑色電影的風格與敘事"
    ja: "ノワールの様式と語りを分析する"
    ko: "누아르의 스타일과 서사 분석하기"
    vi: "Phân tích phong cách và cách kể chuyện noir"
    ms: "Analisis gaya dan penceritaan noir"
    id: "Menganalisis gaya dan penuturan noir"
    hi: "न्वार की शैली और कथा-कथन का विश्लेषण करना"
  - en: "Discuss gender, sexuality and censorship in film"
    zh: "讨论电影中的性别、性与审查"
    zh-TW: "討論電影中的性別、性與審查"
    ja: "映画のジェンダー・性・検閲を論じる"
    ko: "영화 속 젠더·섹슈얼리티·검열 논의하기"
    vi: "Thảo luận giới, tính dục và kiểm duyệt trong phim"
    ms: "Bincangkan gender, seksualiti dan penapisan dalam filem"
    id: "Membahas gender, seksualitas dan sensor dalam film"
    hi: "फ़िल्म में जेंडर, यौनिकता और सेंसरशिप पर चर्चा करना"
