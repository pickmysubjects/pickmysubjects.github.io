code: PATH30002
year: 2026
learn:
  en: "Lab classes on how disease is studied today: tissue slides, organ samples, molecular and computer methods."
  zh: "实验课：用组织切片、标本、分子和电脑方法研究疾病。"
  zh-TW: "實驗課：用組織切片、標本、分子和電腦方法研究疾病。"
  ja: "現在の病気の研究法を学ぶ実験授業：組織標本、臓器サンプル、分子・コンピュータ手法。"
  ko: "오늘날 질병 연구 방법을 배우는 실험 수업: 조직 슬라이드, 장기 샘플, 분자·컴퓨터 방법."
  vi: "Buổi thí nghiệm về cách nghiên cứu bệnh ngày nay: tiêu bản mô, mẫu cơ quan, phương pháp phân tử và máy tính."
  ms: "Kelas makmal tentang cara penyakit dikaji kini: slaid tisu, sampel organ, kaedah molekul dan komputer."
  id: "Kelas lab tentang cara penyakit diteliti kini: preparat jaringan, sampel organ, metode molekuler dan komputer."
  hi: "आज बीमारी कैसे पढ़ी जाती है, इस पर लैब क्लास: ऊतक स्लाइड, अंग सैंपल, आणविक और कंप्यूटर तरीके।"
outcomes:
  - en: "Examine patient specimens to explain a disease"
    zh: "通过病人标本解释疾病成因"
    zh-TW: "透過病人標本解釋疾病成因"
    ja: "患者の検体を調べて病気を説明する"
    ko: "환자 검체를 검사해 질병 설명하기"
    vi: "Xem xét mẫu bệnh phẩm để giải thích bệnh"
    ms: "Memeriksa spesimen pesakit untuk menerangkan penyakit"
    id: "Memeriksa spesimen pasien untuk menjelaskan penyakit"
    hi: "मरीज़ के सैंपल जाँचकर बीमारी समझाना"
  - en: "Perform lab techniques used to diagnose disease"
    zh: "做诊断疾病用的实验技术"
    zh-TW: "做診斷疾病用的實驗技術"
    ja: "病気の診断に使う実験手技を行う"
    ko: "질병 진단에 쓰이는 실험 기법 수행하기"
    vi: "Thực hiện kỹ thuật xét nghiệm dùng để chẩn đoán bệnh"
    ms: "Melakukan teknik makmal untuk mendiagnosis penyakit"
    id: "Melakukan teknik lab untuk mendiagnosis penyakit"
    hi: "बीमारी के निदान वाली लैब तकनीकें करना"
  - en: "Write lab reports and give presentations"
    zh: "写实验报告并做展示"
    zh-TW: "寫實驗報告並做簡報"
    ja: "実験レポートを書き発表する"
    ko: "실험 보고서 쓰고 발표하기"
    vi: "Viết báo cáo thí nghiệm và thuyết trình"
    ms: "Menulis laporan makmal dan membuat pembentangan"
    id: "Menulis laporan lab dan melakukan presentasi"
    hi: "लैब रिपोर्ट लिखना और प्रेज़ेंटेशन देना"
