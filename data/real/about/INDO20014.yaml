code: INDO20014
year: 2026
learn:
  en: "Who counts as a minority in Indonesia: ethnic, religious, class, gender and sexual identities, studied in Indonesian."
  zh: "用印尼语探讨印尼的少数群体：民族、宗教、阶层、性别和性身份。"
  zh-TW: "用印尼語探討印尼的少數群體：民族、宗教、階層、性別和性身分。"
  ja: "インドネシアの少数派とは誰か。民族・宗教・階層・ジェンダー・性的アイデンティティをインドネシア語で学ぶ。"
  ko: "인도네시아의 소수자는 누구인가. 민족·종교·계층·젠더·성 정체성을 인도네시아어로 배운다."
  vi: "Ai là thiểu số ở Indonesia: bản sắc dân tộc, tôn giáo, giai cấp, giới và tính dục, học bằng tiếng Indonesia."
  ms: "Siapa golongan minoriti di Indonesia: identiti etnik, agama, kelas, gender dan seksual, dipelajari dalam bahasa Indonesia."
  id: "Siapa kelompok minoritas di Indonesia: identitas etnis, agama, kelas, gender dan seksual, dipelajari dalam bahasa Indonesia."
  hi: "इंडोनेशिया में अल्पसंख्यक कौन: जातीय, धार्मिक, वर्ग, जेंडर और यौन पहचानें, इंडोनेशियाई में अध्ययन।"
outcomes:
  - en: "Explain how identities are shaped in Indonesia"
    zh: "解释印尼的身份认同如何形成"
    zh-TW: "解釋印尼的身分認同如何形成"
    ja: "インドネシアでアイデンティティがどう作られるか説明する"
    ko: "인도네시아에서 정체성이 형성되는 방식 설명하기"
    vi: "Giải thích bản sắc được hình thành ra sao ở Indonesia"
    ms: "Terangkan cara identiti dibentuk di Indonesia"
    id: "Menjelaskan bagaimana identitas terbentuk di Indonesia"
    hi: "समझाना कि इंडोनेशिया में पहचानें कैसे बनती हैं"
  - en: "Analyse readings and media in Indonesian"
    zh: "分析印尼语读物和媒体"
    zh-TW: "分析印尼語讀物和媒體"
    ja: "インドネシア語の文献やメディアを分析する"
    ko: "인도네시아어 읽기 자료와 미디어 분석하기"
    vi: "Phân tích bài đọc và truyền thông tiếng Indonesia"
    ms: "Analisis bacaan dan media dalam bahasa Indonesia"
    id: "Menganalisis bacaan dan media berbahasa Indonesia"
    hi: "इंडोनेशियाई पाठों और मीडिया का विश्लेषण करना"
  - en: "Discuss case studies of minority groups"
    zh: "讨论少数群体的案例"
    zh-TW: "討論少數群體的案例"
    ja: "少数派の事例について議論する"
    ko: "소수자 사례 토론하기"
    vi: "Thảo luận các trường hợp nhóm thiểu số"
    ms: "Bincang kajian kes kumpulan minoriti"
    id: "Membahas studi kasus kelompok minoritas"
    hi: "अल्पसंख्यक समूहों के उदाहरणों पर चर्चा करना"
