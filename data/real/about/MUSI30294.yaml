code: MUSI30294
year: 2026
learn:
  en: "Advanced hand percussion in Afro-Cuban and Afro-Brazilian styles, played and improvised as a band."
  zh: "非裔古巴与巴西风格的进阶手鼓，以乐队演奏和即兴。"
  zh-TW: "非裔古巴與巴西風格的進階手鼓，以樂隊演奏與即興。"
  ja: "アフロ・キューバン、ブラジル系の上級ハンドパーカッションをバンドで演奏・即興。"
  ko: "아프로쿠바·브라질 스타일 고급 핸드 퍼커션을 밴드로 연주·즉흥."
  vi: "Bộ gõ tay nâng cao phong cách Afro-Cuba và Brazil, chơi và ứng tác theo ban."
  ms: "Perkusi tangan lanjutan gaya Afro-Cuba dan Brazil, dimain dan diimprovisasi berkumpulan."
  id: "Perkusi tangan lanjutan gaya Afro-Kuba dan Brasil, dimainkan dan diimprovisasi."
  hi: "एफ़्रो-क्यूबन और ब्राज़ीली शैली का उन्नत हैंड पर्कशन, बैंड में बजाना और इम्प्रोवाइज़ करना।"
outcomes:
  - en: "Play congas, surdo and other percussion"
    zh: "演奏康加鼓、苏尔多鼓等打击乐"
    zh-TW: "演奏康加鼓、蘇爾多鼓等打擊樂"
    ja: "コンガやスルドなどを演奏する"
    ko: "콩가·수르두 등 타악기 연주하기"
    vi: "Chơi conga, surdo và bộ gõ khác"
    ms: "Main konga, surdo dan perkusi lain"
    id: "Memainkan konga, surdo dan perkusi lain"
    hi: "कोंगा, सुर्दो और अन्य पर्कशन बजाना"
  - en: "Know each instrument's role in the band"
    zh: "了解每件乐器在乐队中的角色"
    zh-TW: "了解每件樂器在樂隊中的角色"
    ja: "バンド内の各楽器の役割を知る"
    ko: "밴드 속 각 악기의 역할 알기"
    vi: "Hiểu vai trò từng nhạc cụ trong ban"
    ms: "Faham peranan setiap alat dalam band"
    id: "Memahami peran tiap instrumen di band"
    hi: "बैंड में हर वाद्य की भूमिका समझना"
  - en: "Improvise and perform as a group"
    zh: "集体即兴和演出"
    zh-TW: "集體即興與演出"
    ja: "グループで即興し演奏する"
    ko: "그룹으로 즉흥하고 공연하기"
    vi: "Ứng tác và biểu diễn theo nhóm"
    ms: "Berimprovisasi dan beraksi berkumpulan"
    id: "Berimprovisasi dan tampil bersama"
    hi: "समूह में इम्प्रोवाइज़ और प्रस्तुति"
