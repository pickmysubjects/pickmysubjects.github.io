code: MUST20013
year: 2026
learn:
  en: "Adapt voice and body to style and character, with Shakespeare, scene study, tap, ballet, jazz and singing."
  zh: "让声音与身体适应风格和角色，学莎剧、场景、踢踏、芭蕾、爵士与演唱。"
  zh-TW: "讓聲音與身體適應風格和角色，學莎劇、場景、踢踏、芭蕾、爵士與演唱。"
  ja: "声と身体を様式と役に合わせ、シェイクスピア、場面研究、タップ、バレエ、ジャズ、歌を学ぶ。"
  ko: "목소리와 몸을 양식·인물에 맞추며 셰익스피어, 장면 연구, 탭, 발레, 재즈, 노래를 배운다."
  vi: "Điều chỉnh giọng và cơ thể theo phong cách, nhân vật: Shakespeare, tap, ballet, jazz, hát."
  ms: "Sesuaikan suara dan tubuh dengan gaya dan watak: Shakespeare, tap, balet, jaz, nyanyian."
  id: "Menyesuaikan suara dan tubuh dengan gaya dan tokoh: Shakespeare, tap, balet, jazz, nyanyi."
  hi: "आवाज़ और शरीर को शैली और किरदार के अनुसार ढालना: शेक्सपियर, टैप, बैले, जैज़, गायन।"
outcomes:
  - en: "Adjust voice and body to a character"
    zh: "根据角色调整声音与身体"
    zh-TW: "根據角色調整聲音與身體"
    ja: "役に合わせて声と身体を変える"
    ko: "인물에 맞게 목소리와 몸 조절하기"
    vi: "Điều chỉnh giọng và cơ thể theo nhân vật"
    ms: "Laras suara dan tubuh mengikut watak"
    id: "Menyesuaikan suara dan tubuh dengan tokoh"
    hi: "किरदार के अनुसार आवाज़ और शरीर बदलना"
  - en: "Perform dance technique in a group"
    zh: "在群体中展示舞蹈技巧"
    zh-TW: "在群體中展示舞蹈技巧"
    ja: "グループでダンス技術を見せる"
    ko: "그룹으로 춤 기술 선보이기"
    vi: "Trình diễn kỹ thuật múa theo nhóm"
    ms: "Persembah teknik tari berkumpulan"
    id: "Menampilkan teknik tari berkelompok"
    hi: "समूह में नृत्य तकनीक प्रस्तुत करना"
  - en: "Reflect on your skills at intermediate level"
    zh: "反思中级阶段的技能"
    zh-TW: "反思中級階段的技能"
    ja: "中級レベルの技能を振り返る"
    ko: "중급 수준의 기량 돌아보기"
    vi: "Suy ngẫm về kỹ năng ở mức trung cấp"
    ms: "Renung kemahiran pada tahap pertengahan"
    id: "Merefleksikan keterampilan tingkat menengah"
    hi: "मध्य स्तर के कौशल पर विचार करना"
