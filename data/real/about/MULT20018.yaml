code: MULT20018
year: 2027
learn:
  en: "A non-technical intro to using AI tools well for study, with prompting skills, critical checking and ethics."
  zh: "面向所有专业的AI入门：学会用AI辅助学习，包括提示词技巧、批判核查和伦理。"
  zh-TW: "給所有科系的AI入門：學會用AI輔助學習，包括提示詞技巧、批判查核和倫理。"
  ja: "専門知識不要のAI入門：学習にAIツールを上手に使う。プロンプト、批判的な確認、倫理も。"
  ko: "비전공자를 위한 AI 입문: 학습에 AI 도구를 잘 쓰는 법, 프롬프트 기법, 비판적 검토, 윤리."
  vi: "Nhập môn AI không cần nền kỹ thuật: dùng công cụ AI hiệu quả cho việc học, kỹ năng viết prompt, kiểm chứng và đạo đức."
  ms: "Pengenalan AI tanpa latar teknikal: guna alat AI dengan baik untuk belajar, kemahiran prompt, semakan kritis dan etika."
  id: "Pengantar AI tanpa latar teknis: memakai alat AI dengan baik untuk belajar, teknik prompt, pemeriksaan kritis, dan etika."
  hi: "बिना तकनीकी पृष्ठभूमि के AI की शुरुआत: पढ़ाई में AI टूल्स का सही इस्तेमाल, प्रॉम्प्ट कौशल, आलोचनात्मक जाँच और नैतिकता।"
outcomes:
  - en: "Understand what current AI models can and can't do"
    zh: "了解当前AI模型的能力和局限"
    zh-TW: "了解目前AI模型的能力和侷限"
    ja: "今のAIモデルにできること・できないことを理解する"
    ko: "현재 AI 모델의 능력과 한계 이해하기"
    vi: "Hiểu mô hình AI hiện nay làm được gì và không làm được gì"
    ms: "Faham keupayaan dan had model AI semasa"
    id: "Memahami kemampuan dan batas model AI saat ini"
    hi: "मौजूदा AI मॉडल क्या कर सकते हैं और क्या नहीं, समझना"
  - en: "Use prompting techniques to work well with AI tools"
    zh: "用提示词技巧高效使用AI工具"
    zh-TW: "用提示詞技巧有效使用AI工具"
    ja: "プロンプトの工夫でAIツールをうまく使う"
    ko: "프롬프트 기법으로 AI 도구 잘 활용하기"
    vi: "Dùng kỹ thuật prompt để làm việc hiệu quả với AI"
    ms: "Guna teknik prompt untuk bekerja dengan alat AI"
    id: "Memakai teknik prompt untuk bekerja dengan alat AI"
    hi: "प्रॉम्प्ट तकनीकों से AI टूल्स का अच्छा इस्तेमाल"
  - en: "Check AI output critically and avoid over-reliance"
    zh: "批判性核查AI输出，避免过度依赖"
    zh-TW: "批判性查核AI輸出，避免過度依賴"
    ja: "AIの出力を批判的に確かめ、頼りすぎを避ける"
    ko: "AI 결과를 비판적으로 검토하고 과의존 피하기"
    vi: "Kiểm chứng kết quả AI và tránh phụ thuộc quá mức"
    ms: "Semak hasil AI secara kritis dan elak terlalu bergantung"
    id: "Memeriksa hasil AI secara kritis dan tidak terlalu bergantung"
    hi: "AI के नतीजों को परखना और ज़्यादा निर्भरता से बचना"
