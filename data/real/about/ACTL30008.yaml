code: ACTL30008
year: 2026
learn:
  en: "Data analytics for insurance claims: regression, splines, classification, GAMs and support vector machines."
  zh: "保险理赔的数据分析：回归、样条、分类、广义可加模型和支持向量机。"
  zh-TW: "保險理賠的資料分析：迴歸、樣條、分類、廣義加性模型與支持向量機。"
  ja: "保険請求のデータ分析：回帰、スプライン、分類、GAM、サポートベクターマシン。"
  ko: "보험 청구 데이터 분석: 회귀, 스플라인, 분류, GAM, 서포트 벡터 머신."
  vi: "Phân tích dữ liệu bồi thường bảo hiểm: hồi quy, spline, phân loại, GAM và SVM."
  ms: "Analitik data tuntutan insurans: regresi, spline, klasifikasi, GAM dan mesin vektor sokongan."
  id: "Analitik data klaim asuransi: regresi, spline, klasifikasi, GAM dan support vector machine."
  hi: "बीमा क्लेम का डेटा विश्लेषण: रिग्रेशन, स्प्लाइन, क्लासिफ़िकेशन, GAM और सपोर्ट वेक्टर मशीन।"
outcomes:
  - en: "Fit statistical learning models in software"
    zh: "用软件拟合统计学习模型"
    zh-TW: "用軟體配適統計學習模型"
    ja: "ソフトで統計的学習モデルを当てはめる"
    ko: "소프트웨어로 통계 학습 모델 적합"
    vi: "Dùng phần mềm khớp mô hình học thống kê"
    ms: "Guna perisian untuk model pembelajaran statistik"
    id: "Memakai software untuk model statistical learning"
    hi: "सॉफ़्टवेयर में स्टैटिस्टिकल लर्निंग मॉडल लगाना"
  - en: "Use model selection and regularisation"
    zh: "运用模型选择与正则化"
    zh-TW: "運用模型選擇與正則化"
    ja: "モデル選択と正則化を使う"
    ko: "모델 선택과 정규화 적용"
    vi: "Áp dụng chọn mô hình và điều chuẩn"
    ms: "Guna pemilihan model dan regularisasi"
    id: "Menerapkan seleksi model dan regularisasi"
    hi: "मॉडल चयन और रेगुलराइज़ेशन लागू करना"
  - en: "Interpret results on real insurance data"
    zh: "解读真实保险数据的分析结果"
    zh-TW: "解讀真實保險資料的分析結果"
    ja: "実際の保険データの結果を解釈する"
    ko: "실제 보험 데이터 결과 해석"
    vi: "Diễn giải kết quả trên dữ liệu bảo hiểm thật"
    ms: "Tafsir hasil data insurans sebenar"
    id: "Menafsirkan hasil pada data asuransi nyata"
    hi: "असली बीमा डेटा के नतीजे समझना"
