code: ELEN30012
year: 2026
learn:
  en: "The maths of signals and systems: Fourier, Laplace and Z transforms, convolution and stability, using MATLAB."
  zh: "信号与系统的数学：傅里叶、拉普拉斯、Z变换、卷积与稳定性，用MATLAB。"
  zh-TW: "訊號與系統的數學：傅立葉、拉普拉斯、Z轉換、摺積與穩定性，用MATLAB。"
  ja: "信号とシステムの数学：フーリエ・ラプラス・Z変換、畳み込み、安定性をMATLABで。"
  ko: "신호와 시스템의 수학: 푸리에·라플라스·Z 변환, 컨볼루션, 안정성을 MATLAB으로."
  vi: "Toán của tín hiệu và hệ thống: biến đổi Fourier, Laplace, Z, tích chập và ổn định, dùng MATLAB."
  ms: "Matematik isyarat dan sistem: jelmaan Fourier, Laplace dan Z, konvolusi dan kestabilan, dengan MATLAB."
  id: "Matematika sinyal dan sistem: transformasi Fourier, Laplace, dan Z, konvolusi, stabilitas, dengan MATLAB."
  hi: "सिग्नल और सिस्टम का गणित: फ़ूरियर, लाप्लास और Z ट्रांसफ़ॉर्म, कन्वोल्यूशन और स्थिरता, MATLAB के साथ।"
outcomes:
  - en: "Analyse signals in time and frequency"
    zh: "在时域和频域分析信号"
    zh-TW: "在時域與頻域分析訊號"
    ja: "時間・周波数領域で信号を解析する"
    ko: "시간·주파수 영역에서 신호 분석하기"
    vi: "Phân tích tín hiệu theo thời gian và tần số"
    ms: "Menganalisis isyarat dalam masa dan frekuensi"
    id: "Menganalisis sinyal dalam waktu dan frekuensi"
    hi: "टाइम और फ़्रीक्वेंसी में सिग्नल विश्लेषण करना"
  - en: "Compare continuous and discrete-time tools"
    zh: "比较连续与离散时间的方法"
    zh-TW: "比較連續與離散時間的方法"
    ja: "連続時間と離散時間の手法を比べる"
    ko: "연속·이산 시간 기법 비교하기"
    vi: "So sánh công cụ thời gian liên tục và rời rạc"
    ms: "Membandingkan alat masa selanjar dan diskret"
    id: "Membandingkan alat waktu kontinu dan diskret"
    hi: "सतत और असतत समय के तरीकों की तुलना करना"
  - en: "Simulate systems in MATLAB"
    zh: "用MATLAB仿真系统"
    zh-TW: "用MATLAB模擬系統"
    ja: "MATLABでシステムを模擬する"
    ko: "MATLAB으로 시스템 시뮬레이션하기"
    vi: "Mô phỏng hệ thống bằng MATLAB"
    ms: "Mensimulasi sistem dalam MATLAB"
    id: "Mensimulasikan sistem di MATLAB"
    hi: "MATLAB में सिस्टम सिमुलेट करना"
