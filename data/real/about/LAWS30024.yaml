code: LAWS30024
year: 2026
learn:
  en: "What famous trials, from Mabo to Eichmann, reveal about law, politics and the communities that stage them."
  zh: "从Mabo到艾希曼，著名审判揭示了法律、政治和社会的什么。"
  zh-TW: "從 Mabo 到艾希曼，著名審判揭示了法律、政治和社會的什麼。"
  ja: "マボ判決からアイヒマン裁判まで、有名な裁判が法・政治・社会について何を示すかを学ぶ。"
  ko: "Mabo부터 아이히만까지 유명한 재판이 법, 정치, 사회에 대해 무엇을 드러내는지 배운다."
  vi: "Các phiên tòa nổi tiếng, từ Mabo đến Eichmann, cho thấy gì về luật, chính trị và cộng đồng nơi chúng diễn ra."
  ms: "Apa yang didedahkan oleh perbicaraan terkenal, dari Mabo hingga Eichmann, tentang undang-undang, politik dan masyarakat."
  id: "Apa yang diungkap pengadilan terkenal, dari Mabo hingga Eichmann, tentang hukum, politik dan masyarakatnya."
  hi: "Mabo से Eichmann तक, मशहूर मुक़दमे क़ानून, राजनीति और समाज के बारे में क्या बताते हैं।"
outcomes:
  - en: "Analyse trials as political stories and turning points"
    zh: "把审判当作政治叙事和历史转折点来分析"
    zh-TW: "把審判當作政治敘事和歷史轉折點來分析"
    ja: "裁判を政治的な物語や転換点として分析する"
    ko: "재판을 정치적 서사이자 전환점으로 분석하기"
    vi: "Phân tích phiên tòa như câu chuyện chính trị và bước ngoặt"
    ms: "Analisis perbicaraan sebagai cerita politik dan titik perubahan"
    id: "Menganalisis pengadilan sebagai kisah politik dan titik balik"
    hi: "मुक़दमों को राजनीतिक कहानी और मोड़ के रूप में विश्लेषित करना"
  - en: "Explain how courts work, including across countries"
    zh: "说明法院的程序和作用，包括跨国比较"
    zh-TW: "說明法院的程序和作用，包括跨國比較"
    ja: "裁判所の手続きと役割を国際比較も含めて説明する"
    ko: "국가 간 비교를 포함해 법원의 절차와 역할 설명하기"
    vi: "Giải thích cách tòa án vận hành, kể cả so sánh giữa các nước"
    ms: "Terangkan cara mahkamah berfungsi, termasuk antara negara"
    id: "Menjelaskan cara kerja pengadilan, termasuk antarnegara"
    hi: "समझाना कि अदालतें कैसे काम करती हैं, देशों के बीच तुलना सहित"
  - en: "Research one major trial in depth on your own"
    zh: "独立深入研究一场重大审判"
    zh-TW: "獨立深入研究一場重大審判"
    ja: "一つの大きな裁判を自分で深く調べる"
    ko: "주요 재판 하나를 스스로 깊이 조사하기"
    vi: "Tự nghiên cứu sâu một phiên tòa lớn"
    ms: "Kaji satu perbicaraan besar secara mendalam sendiri"
    id: "Meneliti satu pengadilan besar secara mendalam sendiri"
    hi: "किसी एक बड़े मुक़दमे पर खुद गहराई से शोध करना"
