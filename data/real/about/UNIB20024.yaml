code: UNIB20024
year: 2026
learn:
  en: "New biomedical technologies that could reshape humans, examined through ethics, history, philosophy and social science."
  zh: "可能重塑人类的新兴生物医学技术，从伦理、历史、哲学和社会科学角度审视。"
  zh-TW: "可能重塑人類的新興生物醫學技術，從倫理、歷史、哲學和社會科學角度審視。"
  ja: "人間を作り変えうる新しい生物医学技術を、倫理・歴史・哲学・社会科学から考える。"
  ko: "인간을 바꿀 수 있는 새 생명의학 기술을 윤리·역사·철학·사회과학으로 살펴보기."
  vi: "Công nghệ y sinh mới có thể thay đổi con người, nhìn qua đạo đức, lịch sử, triết học và khoa học xã hội."
  ms: "Teknologi bioperubatan baharu yang boleh mengubah manusia, dilihat dari etika, sejarah, falsafah dan sains sosial."
  id: "Teknologi biomedis baru yang bisa mengubah manusia, dikaji lewat etika, sejarah, filsafat, dan ilmu sosial."
  hi: "इंसान को बदल सकने वाली नई बायोमेडिकल तकनीकें, नैतिकता, इतिहास, दर्शन और समाज विज्ञान से जाँची गईं।"
outcomes:
  - en: "Explain what new biomedical tools can do"
    zh: "解释新兴生物医学技术的能力"
    zh-TW: "解釋新興生物醫學技術的能力"
    ja: "新しい生物医学技術にできることを説明する"
    ko: "새 생명의학 기술이 할 수 있는 일 설명하기"
    vi: "Giải thích công nghệ y sinh mới làm được gì"
    ms: "Terangkan keupayaan alat bioperubatan baharu"
    id: "Menjelaskan kemampuan teknologi biomedis baru"
    hi: "नई बायोमेडिकल तकनीकें क्या कर सकती हैं, समझाना"
  - en: "Weigh their ethical and social risks"
    zh: "权衡其伦理与社会风险"
    zh-TW: "權衡其倫理與社會風險"
    ja: "倫理的・社会的リスクを比べる"
    ko: "윤리적·사회적 위험 따져보기"
    vi: "Cân nhắc rủi ro đạo đức và xã hội"
    ms: "Timbang risiko etika dan sosialnya"
    id: "Menimbang risiko etis dan sosialnya"
    hi: "इनके नैतिक और सामाजिक जोखिम तौलना"
  - en: "Argue a view across several disciplines"
    zh: "结合多个学科论证观点"
    zh-TW: "結合多個學科論證觀點"
    ja: "複数の分野をまたいで主張を論じる"
    ko: "여러 학문을 아울러 견해 논증하기"
    vi: "Lập luận một quan điểm qua nhiều ngành"
    ms: "Hujahkan pandangan merentas pelbagai bidang"
    id: "Memperdebatkan pandangan lintas disiplin"
    hi: "कई विषयों के सहारे अपना मत रखना"
