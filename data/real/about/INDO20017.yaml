code: INDO20017
year: 2026
learn:
  en: "How Indonesia has tried to build national unity, through nationalism, political Islam, the military, democracy and consumer culture."
  zh: "印尼如何通过民族主义、政治伊斯兰、军方、民主和消费文化来建立国家统一。"
  zh-TW: "印尼如何透過民族主義、政治伊斯蘭、軍方、民主和消費文化來建立國家統一。"
  ja: "ナショナリズム、政治的イスラム、軍、民主化、消費文化を通じて、インドネシアが国家統一をどう築こうとしたかを学ぶ。"
  ko: "민족주의, 정치적 이슬람, 군부, 민주화, 소비문화를 통해 인도네시아가 국가 통합을 어떻게 이루려 했는지 배운다."
  vi: "Indonesia đã cố xây dựng thống nhất quốc gia ra sao, qua chủ nghĩa dân tộc, Hồi giáo chính trị, quân đội, dân chủ và văn hóa tiêu dùng."
  ms: "Cara Indonesia cuba membina perpaduan negara melalui nasionalisme, Islam politik, tentera, demokrasi dan budaya pengguna."
  id: "Cara Indonesia berusaha membangun persatuan nasional lewat nasionalisme, Islam politik, militer, demokrasi, dan budaya konsumsi."
  hi: "इंडोनेशिया ने राष्ट्रवाद, राजनीतिक इस्लाम, सेना, लोकतंत्र और उपभोक्ता संस्कृति से राष्ट्रीय एकता कैसे बनानी चाही।"
outcomes:
  - en: "Compare ideologies used to unify Indonesia"
    zh: "比较用来统一印尼的意识形态"
    zh-TW: "比較用來統一印尼的意識形態"
    ja: "インドネシア統一に使われたイデオロギーを比べる"
    ko: "인도네시아 통합에 쓰인 이데올로기 비교하기"
    vi: "So sánh các ý thức hệ dùng để thống nhất Indonesia"
    ms: "Bandingkan ideologi untuk menyatukan Indonesia"
    id: "Membandingkan ideologi pemersatu Indonesia"
    hi: "इंडोनेशिया को जोड़ने में प्रयुक्त विचारधाराओं की तुलना करना"
  - en: "Explain Indonesia's colonial and post-colonial path"
    zh: "解释印尼的殖民与后殖民历程"
    zh-TW: "解釋印尼的殖民與後殖民歷程"
    ja: "インドネシアの植民地期と独立後の歩みを説明する"
    ko: "인도네시아의 식민·탈식민 경로 설명하기"
    vi: "Giải thích chặng đường thuộc địa và hậu thuộc địa của Indonesia"
    ms: "Terangkan laluan penjajahan dan pascapenjajahan Indonesia"
    id: "Menjelaskan perjalanan kolonial dan pascakolonial Indonesia"
    hi: "इंडोनेशिया के औपनिवेशिक और उत्तर-औपनिवेशिक सफ़र को समझाना"
  - en: "Analyse Indonesia's place in the region"
    zh: "分析印尼在地区中的地位"
    zh-TW: "分析印尼在區域中的地位"
    ja: "地域におけるインドネシアの位置を分析する"
    ko: "지역에서 인도네시아의 위치 분석하기"
    vi: "Phân tích vị thế của Indonesia trong khu vực"
    ms: "Analisis kedudukan Indonesia di rantau ini"
    id: "Menganalisis posisi Indonesia di kawasan"
    hi: "क्षेत्र में इंडोनेशिया की स्थिति का विश्लेषण करना"
