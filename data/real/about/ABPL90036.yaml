code: ABPL90036
year: 2027
learn:
  en: "Analysing property investments and financing: cash flows, risk and return, tax effects and financial modelling, using real cases."
  zh: "分析房地产投资与融资：现金流、风险与回报、税务影响和财务建模，用真实案例。"
  zh-TW: "分析不動產投資與融資：現金流、風險與報酬、稅務影響與財務建模，用真實個案。"
  ja: "不動産の投資と資金調達の分析：キャッシュフロー、リスクとリターン、税、財務モデル。"
  ko: "부동산 투자·금융 분석: 현금흐름, 위험과 수익, 세금 효과, 재무 모델링."
  vi: "Phân tích đầu tư và tài trợ bất động sản: dòng tiền, rủi ro, lợi nhuận, thuế và mô hình tài chính."
  ms: "Menganalisis pelaburan dan pembiayaan hartanah: aliran tunai, risiko, cukai dan model kewangan."
  id: "Menganalisis investasi dan pembiayaan properti: arus kas, risiko, pajak dan model keuangan."
  hi: "संपत्ति निवेश और वित्तपोषण का विश्लेषण: कैश फ़्लो, जोखिम-रिटर्न, कर और वित्तीय मॉडल।"
outcomes:
  - en: "Evaluate property cash flows to value an asset"
    zh: "评估物业现金流以确定资产价值"
    zh-TW: "評估不動產現金流以決定資產價值"
    ja: "キャッシュフローから資産価値を評価する"
    ko: "현금흐름으로 자산 가치 평가하기"
    vi: "Đánh giá dòng tiền để định giá tài sản"
    ms: "Menilai aliran tunai untuk menilai aset"
    id: "Mengevaluasi arus kas untuk menilai aset"
    hi: "कैश फ़्लो से परिसंपत्ति का मूल्य आँकना"
  - en: "Compare investment and financing strategies"
    zh: "比较投资和融资策略"
    zh-TW: "比較投資與融資策略"
    ja: "投資と資金調達の戦略を比べる"
    ko: "투자·금융 전략 비교하기"
    vi: "So sánh chiến lược đầu tư và tài trợ"
    ms: "Membanding strategi pelaburan dan pembiayaan"
    id: "Membandingkan strategi investasi dan pembiayaan"
    hi: "निवेश और वित्तपोषण रणनीतियों की तुलना"
