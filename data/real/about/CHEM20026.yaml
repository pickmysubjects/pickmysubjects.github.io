code: CHEM20026
year: 2026
learn:
  en: "The chemistry behind processes in living cells, and the chemical tools used to study them."
  zh: "细胞里生命过程背后的化学，以及研究它们的化学工具。"
  zh-TW: "細胞中生命過程背後的化學，以及研究它們的化學工具。"
  ja: "生きた細胞内の過程を支える化学と、それを調べる化学的ツール。"
  ko: "살아 있는 세포 속 과정의 화학과 이를 연구하는 화학 도구."
  vi: "Hóa học đằng sau các quá trình trong tế bào sống và công cụ hóa học để nghiên cứu."
  ms: "Kimia di sebalik proses dalam sel hidup, dan alat kimia untuk mengkajinya."
  id: "Kimia di balik proses dalam sel hidup, dan alat kimia untuk mempelajarinya."
  hi: "जीवित सेल की प्रक्रियाओं के पीछे की केमिस्ट्री और उन्हें पढ़ने के रासायनिक टूल।"
outcomes:
  - en: "Explain biological processes at the molecular level"
    zh: "从分子层面解释生物过程"
    zh-TW: "從分子層面解釋生物過程"
    ja: "生物学的過程を分子レベルで説明する"
    ko: "생물학적 과정을 분자 수준에서 설명하기"
    vi: "Giải thích quá trình sinh học ở cấp phân tử"
    ms: "Terangkan proses biologi pada aras molekul"
    id: "Menjelaskan proses biologis di tingkat molekul"
    hi: "जैविक प्रक्रियाओं को अणु स्तर पर समझाना"
  - en: "Interpret biological data using chemistry"
    zh: "用化学原理解读生物数据"
    zh-TW: "用化學原理解讀生物資料"
    ja: "化学を使って生物学データを読み解く"
    ko: "화학으로 생물학 데이터 해석하기"
    vi: "Dùng hóa học để phân tích dữ liệu sinh học"
    ms: "Tafsir data biologi menggunakan kimia"
    id: "Menafsirkan data biologis dengan kimia"
    hi: "केमिस्ट्री से जैविक डेटा समझना"
  - en: "Explain key analysis methods in chemical biology"
    zh: "说明化学生物学的主要分析方法"
    zh-TW: "說明化學生物學的主要分析方法"
    ja: "ケミカルバイオロジーの主な分析法を説明する"
    ko: "화학생물학의 주요 분석법 설명하기"
    vi: "Giải thích phương pháp phân tích chính trong hóa sinh học"
    ms: "Terangkan kaedah analisis utama biologi kimia"
    id: "Menjelaskan metode analisis utama biologi kimia"
    hi: "केमिकल बायोलॉजी के मुख्य विश्लेषण तरीके समझाना"
