code: SCRN20013
year: 2026
learn:
  en: "Australian film and TV since the war, from road movies and comedy to sitcoms and news, and the debate over what a national screen is."
  zh: "战后至今的澳洲电影与电视，从公路片、喜剧到情景喜剧和新闻，以及关于“国家影视”的争论。"
  zh-TW: "戰後至今的澳洲電影與電視，從公路片、喜劇到情境喜劇和新聞，以及關於「國家影視」的爭論。"
  ja: "戦後のオーストラリア映画とテレビ。ロードムービー、コメディからシットコム、ニュースまで、「国の映像」とは何かという議論。"
  ko: "전후 호주 영화와 TV. 로드무비, 코미디부터 시트콤, 뉴스까지, 그리고 '국가 영상'이란 무엇인가에 대한 논쟁."
  vi: "Phim và truyền hình Úc sau chiến tranh, từ phim hành trình, hài đến sitcom, tin tức, và tranh luận về điện ảnh quốc gia."
  ms: "Filem dan TV Australia selepas perang, dari filem perjalanan dan komedi hingga sitkom dan berita, serta perdebatan tentang skrin nasional."
  id: "Film dan TV Australia pascaperang, dari film perjalanan dan komedi hingga sitkom dan berita, serta debat soal layar nasional."
  hi: "युद्ध के बाद की ऑस्ट्रेलियाई फ़िल्में और टीवी, रोड मूवी और कॉमेडी से सिटकॉम और समाचार तक, और 'राष्ट्रीय परदे' पर बहस।"
outcomes:
  - en: "Analyse Australian films and TV shows"
    zh: "分析澳洲电影和电视节目"
    zh-TW: "分析澳洲電影和電視節目"
    ja: "オーストラリアの映画とテレビ番組を分析する"
    ko: "호주 영화와 TV 프로그램 분석하기"
    vi: "Phân tích phim và chương trình truyền hình Úc"
    ms: "Analisis filem dan rancangan TV Australia"
    id: "Menganalisis film dan acara TV Australia"
    hi: "ऑस्ट्रेलियाई फ़िल्मों और टीवी शो का विश्लेषण करना"
  - en: "Place screen works in local and global context"
    zh: "把影视作品放在本土与全球背景中"
    zh-TW: "把影視作品放在本土與全球背景中"
    ja: "映像作品を国内と世界の文脈に置く"
    ko: "영상 작품을 국내·세계 맥락에 놓기"
    vi: "Đặt tác phẩm vào bối cảnh trong nước và toàn cầu"
    ms: "Letakkan karya skrin dalam konteks tempatan dan global"
    id: "Menempatkan karya layar dalam konteks lokal dan global"
    hi: "परदे की रचनाओं को स्थानीय और वैश्विक संदर्भ में रखना"
  - en: "Discuss what makes a national cinema"
    zh: "讨论何为国家电影"
    zh-TW: "討論何為國家電影"
    ja: "「国の映画」とは何かを議論する"
    ko: "무엇이 국가 영화를 만드는지 토론하기"
    vi: "Thảo luận điều gì làm nên điện ảnh quốc gia"
    ms: "Bincangkan apa yang menjadikan sinema nasional"
    id: "Membahas apa yang membentuk sinema nasional"
    hi: "राष्ट्रीय सिनेमा किससे बनता है, चर्चा करना"
