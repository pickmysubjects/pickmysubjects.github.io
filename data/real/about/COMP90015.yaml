code: COMP90015
year: 2027
learn:
  en: "The ideas behind systems like the Web, email and DNS: communication, remote calls, naming, files and security."
  zh: "Web、邮件、DNS 等系统背后的原理：通信、远程调用、命名、文件与安全。"
  zh-TW: "Web、電子郵件、DNS 等系統背後的原理：通訊、遠端呼叫、命名、檔案與安全。"
  ja: "Web・メール・DNS などを支える仕組み：通信、リモート呼び出し、名前解決、ファイル、セキュリティ。"
  ko: "웹·이메일·DNS 같은 시스템의 원리: 통신, 원격 호출, 네이밍, 파일, 보안."
  vi: "Nguyên lý sau Web, email, DNS: giao tiếp, gọi từ xa, đặt tên, tệp và bảo mật."
  ms: "Prinsip di sebalik Web, e-mel dan DNS: komunikasi, panggilan jauh, penamaan, fail dan keselamatan."
  id: "Prinsip di balik Web, email, DNS: komunikasi, pemanggilan jarak jauh, penamaan, berkas, keamanan."
  hi: "वेब, ईमेल, DNS जैसे सिस्टम के सिद्धांत: संचार, रिमोट कॉल, नामकरण, फ़ाइलें, सुरक्षा।"
outcomes:
  - en: "Explain how distributed systems are designed"
    zh: "解释分布式系统的设计方式"
    zh-TW: "解釋分散式系統的設計方式"
    ja: "分散システムの設計を説明する"
    ko: "분산 시스템 설계 방식 설명하기"
    vi: "Giải thích cách thiết kế hệ phân tán"
    ms: "Terangkan reka bentuk sistem teragih"
    id: "Menjelaskan desain sistem terdistribusi"
    hi: "डिस्ट्रिब्यूटेड सिस्टम का डिज़ाइन समझाना"
  - en: "Build programs whose parts talk over a network"
    zh: "编写通过网络通信的程序"
    zh-TW: "撰寫透過網路通訊的程式"
    ja: "ネットワーク越しに通信するプログラムを作る"
    ko: "네트워크로 통신하는 프로그램 만들기"
    vi: "Viết chương trình giao tiếp qua mạng"
    ms: "Bina program yang berhubung melalui rangkaian"
    id: "Membuat program yang berkomunikasi lewat jaringan"
    hi: "नेटवर्क पर बात करने वाले प्रोग्राम बनाना"
