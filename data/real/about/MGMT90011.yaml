code: MGMT90011
year: 2027
learn:
  en: "Business partnering skills for HR: consulting, influencing, building relationships, office politics and projects."
  zh: "人力资源的业务伙伴能力：咨询、影响他人、建立关系、组织政治和项目管理。"
  zh-TW: "人力資源的業務夥伴能力：顧問、影響他人、建立關係、組織政治與專案管理。"
  ja: "人事のビジネスパートナー力：コンサルティング、影響力、関係構築、組織政治、プロジェクト管理。"
  ko: "HR 비즈니스 파트너 역량: 컨설팅, 영향력, 관계 구축, 조직 정치, 프로젝트 관리."
  vi: "Kỹ năng đối tác kinh doanh cho nhân sự: tư vấn, gây ảnh hưởng, xây dựng quan hệ, chính trị tổ chức, dự án."
  ms: "Kemahiran rakan niaga untuk HR: perundingan, mempengaruhi, membina hubungan, politik organisasi dan projek."
  id: "Keterampilan mitra bisnis untuk SDM: konsultasi, memengaruhi, membangun relasi, politik organisasi, dan proyek."
  hi: "HR के लिए बिज़नेस पार्टनर कौशल: परामर्श, प्रभावित करना, संबंध बनाना, संगठनात्मक राजनीति और प्रोजेक्ट।"
outcomes:
  - en: "Explain why HR needs to engage stakeholders"
    zh: "解释人力资源为何需要与利益相关者合作"
    zh-TW: "解釋人力資源為何需要與利害關係人合作"
    ja: "人事が利害関係者と関わる必要性を説明する"
    ko: "HR이 이해관계자와 협력해야 하는 이유 설명하기"
    vi: "Giải thích vì sao nhân sự cần gắn kết các bên liên quan"
    ms: "Menerangkan mengapa HR perlu melibatkan pihak berkepentingan"
    id: "Menjelaskan mengapa SDM perlu melibatkan pemangku kepentingan"
    hi: "HR को हितधारकों से जुड़ने की ज़रूरत क्यों है, समझाना"
  - en: "Use consulting and influencing skills"
    zh: "运用咨询和影响力技巧"
    zh-TW: "運用顧問與影響力技巧"
    ja: "コンサルティングと影響力のスキルを使う"
    ko: "컨설팅과 영향력 기술 활용하기"
    vi: "Vận dụng kỹ năng tư vấn và gây ảnh hưởng"
    ms: "Menggunakan kemahiran perundingan dan mempengaruhi"
    id: "Memakai keterampilan konsultasi dan memengaruhi"
    hi: "परामर्श और प्रभाव कौशल का उपयोग"
