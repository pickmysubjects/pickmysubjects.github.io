code: CVEN90061
year: 2027
learn:
  en: "How freight moves through road, rail and port networks, and how to make it more efficient and sustainable."
  zh: "货物如何在道路、铁路和港口网络中流动，以及如何让货运更高效、更可持续。"
  zh-TW: "貨物如何在道路、鐵路與港口網路中流動，以及如何讓貨運更有效率、更永續。"
  ja: "貨物が道路・鉄道・港湾のネットワークをどう動くか、そして効率と持続可能性を高める方法。"
  ko: "화물이 도로·철도·항만 네트워크를 어떻게 이동하는지, 더 효율적이고 지속가능하게 만드는 방법."
  vi: "Hàng hóa di chuyển qua mạng lưới đường bộ, đường sắt và cảng ra sao, và cách làm cho vận tải hiệu quả, bền vững hơn."
  ms: "Bagaimana barangan bergerak melalui rangkaian jalan, rel dan pelabuhan, dan cara menjadikannya lebih cekap dan lestari."
  id: "Bagaimana barang bergerak lewat jaringan jalan, rel dan pelabuhan, dan cara membuatnya lebih efisien dan berkelanjutan."
  hi: "माल सड़क, रेल और बंदरगाह नेटवर्क में कैसे चलता है, और इसे अधिक कुशल व टिकाऊ कैसे बनाएँ।"
outcomes:
  - en: "Analyse freight issues for carriers, shippers and residents"
    zh: "分析承运人、货主和居民面对的货运问题"
    zh-TW: "分析承運人、貨主與居民面對的貨運問題"
    ja: "運送事業者・荷主・住民にとっての貨物輸送の課題を分析する"
    ko: "운송사·화주·주민 관점의 화물 문제 분석하기"
    vi: "Phân tích vấn đề vận tải hàng hóa cho nhà vận chuyển, chủ hàng và cư dân"
    ms: "Menganalisis isu pengangkutan barang bagi pengangkut, pengirim dan penduduk"
    id: "Menganalisis isu angkutan barang bagi pengangkut, pengirim dan warga"
    hi: "वाहकों, शिपरों और निवासियों के लिए माल परिवहन के मुद्दों का विश्लेषण"
  - en: "Use data analysis to study freight impacts"
    zh: "用数据分析研究货运的影响"
    zh-TW: "以資料分析研究貨運的影響"
    ja: "データ分析で貨物輸送の影響を調べる"
    ko: "데이터 분석으로 화물 운송의 영향 조사하기"
    vi: "Dùng phân tích dữ liệu để nghiên cứu tác động của vận tải hàng hóa"
    ms: "Menggunakan analisis data untuk mengkaji kesan pengangkutan barang"
    id: "Memakai analisis data untuk meneliti dampak angkutan barang"
    hi: "माल परिवहन के प्रभावों का डेटा विश्लेषण से अध्ययन"
  - en: "Optimise distribution networks, fleets and depot locations"
    zh: "优化配送网络、车队和场站选址"
    zh-TW: "最佳化配送網路、車隊與場站選址"
    ja: "配送網・車両計画・拠点配置を最適化する"
    ko: "배송망·차량 운영·거점 위치 최적화하기"
    vi: "Tối ưu mạng lưới phân phối, đội xe và vị trí kho bãi"
    ms: "Mengoptimumkan rangkaian pengedaran, armada dan lokasi depot"
    id: "Mengoptimalkan jaringan distribusi, armada dan lokasi depo"
    hi: "वितरण नेटवर्क, वाहन बेड़े और डिपो स्थान का अनुकूलन"
