code: ECON30031
year: 2026
learn:
  en: "Applied economics of farming, forests and water: land use, property rights, water markets and policy."
  zh: "农业、林业和水资源的应用经济学：土地、产权、水市场和政策。"
  zh-TW: "農業、林業和水資源的應用經濟學：土地、財產權、水市場和政策。"
  ja: "農業・森林・水の応用経済学：土地利用、財産権、水市場、政策。"
  ko: "농업·산림·물의 응용경제학: 토지 이용, 재산권, 물 시장, 정책."
  vi: "Kinh tế học ứng dụng cho nông nghiệp, rừng và nước: sử dụng đất, quyền tài sản, thị trường nước và chính sách."
  ms: "Ekonomi gunaan pertanian, hutan dan air: guna tanah, hak harta, pasaran air dan dasar."
  id: "Ekonomi terapan pertanian, hutan, dan air: tata guna lahan, hak milik, pasar air, dan kebijakan."
  hi: "खेती, जंगल और पानी का एप्लाइड अर्थशास्त्र: ज़मीन का उपयोग, संपत्ति अधिकार, जल बाज़ार और नीति।"
outcomes:
  - en: "Explain the economics of farm, forest and water systems"
    zh: "解释农、林、水系统的经济原理"
    zh-TW: "解釋農、林、水系統的經濟原理"
    ja: "農業・森林・水の仕組みを経済的に説明する"
    ko: "농업·산림·물 체계의 경제 원리 설명하기"
    vi: "Giải thích kinh tế của hệ thống nông nghiệp, rừng và nước"
    ms: "Terangkan ekonomi sistem pertanian, hutan dan air"
    id: "Menjelaskan ekonomi sistem pertanian, hutan, dan air"
    hi: "खेती, जंगल और जल व्यवस्था का अर्थशास्त्र समझाना"
  - en: "Assess subsidies and regulation in these sectors"
    zh: "评估这些领域的补贴和监管"
    zh-TW: "評估這些領域的補貼和監管"
    ja: "これらの分野の補助金と規制を評価する"
    ko: "이 분야의 보조금과 규제 평가하기"
    vi: "Đánh giá trợ cấp và quy định trong các ngành này"
    ms: "Nilai subsidi dan peraturan dalam sektor ini"
    id: "Menilai subsidi dan regulasi di sektor ini"
    hi: "इन क्षेत्रों में सब्सिडी और नियमन का आकलन करना"
