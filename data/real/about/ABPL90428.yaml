code: ABPL90428
year: 2027
learn:
  en: "Evidence-based planning and design for health and wellbeing, informed by the WELL Building Standard."
  zh: "以WELL建筑标准为参考，学习促进健康与福祉的循证规划和设计。"
  zh-TW: "以WELL建築標準為參考，學習促進健康與福祉的實證規劃和設計。"
  ja: "WELL認証を参考に、健康とウェルビーイングのためのエビデンスに基づく計画・設計。"
  ko: "WELL 건축 기준을 바탕으로 건강과 웰빙을 위한 근거 기반 계획·설계."
  vi: "Quy hoạch và thiết kế dựa trên bằng chứng vì sức khỏe, theo tiêu chuẩn WELL."
  ms: "Perancangan dan reka bentuk berasaskan bukti untuk kesihatan, berpandukan piawai WELL."
  id: "Perencanaan dan desain berbasis bukti untuk kesehatan, mengacu standar WELL."
  hi: "WELL मानक के आधार पर स्वास्थ्य व कल्याण के लिए साक्ष्य-आधारित योजना और डिज़ाइन।"
outcomes:
  - en: "Review research on design for health"
    zh: "综述健康设计相关研究"
    zh-TW: "回顧健康設計相關研究"
    ja: "健康のための設計研究をレビューする"
    ko: "건강 설계 연구 검토하기"
    vi: "Tổng quan nghiên cứu thiết kế vì sức khỏe"
    ms: "Mengkaji penyelidikan reka bentuk kesihatan"
    id: "Meninjau riset desain untuk kesehatan"
    hi: "स्वास्थ्य हेतु डिज़ाइन पर शोध की समीक्षा"
  - en: "Evaluate a building or precinct for wellbeing"
    zh: "从福祉角度评估建筑或街区"
    zh-TW: "從福祉角度評估建築或街區"
    ja: "ウェルビーイングの観点で建物や地区を評価する"
    ko: "웰빙 관점에서 건물·지구 평가하기"
    vi: "Đánh giá tòa nhà hoặc khu vực về sức khỏe"
    ms: "Menilai bangunan atau kawasan untuk kesejahteraan"
    id: "Mengevaluasi bangunan atau kawasan untuk kesejahteraan"
    hi: "कल्याण के लिए भवन या क्षेत्र का मूल्यांकन"
