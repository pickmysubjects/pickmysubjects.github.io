code: ITAL30001
year: 2026
learn:
  en: "Close reading of Italian literary and everyday texts to master different styles and registers, and discuss texts in Italian."
  zh: "细读意大利文学与非文学文本，掌握不同文体和语域，并用意大利语讨论。"
  zh-TW: "細讀義大利文學與非文學文本，掌握不同文體和語域，並用義大利語討論。"
  ja: "イタリア語の文学作品と一般の文章を精読し、文体や言葉の使い分けを身につけ、イタリア語で議論する。"
  ko: "이탈리아 문학·비문학 글을 정독해 여러 문체와 말투를 익히고 이탈리아어로 토론한다."
  vi: "Đọc kỹ văn bản văn học và thông thường tiếng Ý để nắm các văn phong, sắc thái và thảo luận bằng tiếng Ý."
  ms: "Bacaan rapi teks sastera dan bukan sastera Itali untuk menguasai gaya dan laras, serta berbincang dalam bahasa Itali."
  id: "Membaca cermat teks sastra dan nonsastra Italia untuk menguasai gaya dan ragam bahasa, serta berdiskusi dalam bahasa Italia."
  hi: "इतालवी साहित्यिक और आम पाठों को ध्यान से पढ़कर अलग-अलग शैलियाँ सीखना और इतालवी में चर्चा करना।"
outcomes:
  - en: "Discuss social and cultural topics in Italian"
    zh: "用意大利语讨论社会和文化话题"
    zh-TW: "用義大利語討論社會和文化話題"
    ja: "社会や文化の話題をイタリア語で話し合う"
    ko: "사회·문화 주제를 이탈리아어로 토론하기"
    vi: "Thảo luận chủ đề xã hội, văn hóa bằng tiếng Ý"
    ms: "Bincangkan topik sosial dan budaya dalam bahasa Itali"
    id: "Membahas topik sosial dan budaya dalam bahasa Italia"
    hi: "सामाजिक और सांस्कृतिक विषयों पर इतालवी में चर्चा करना"
  - en: "Read and write longer Italian texts"
    zh: "读写较长的意大利语文章"
    zh-TW: "讀寫較長的義大利語文章"
    ja: "長めのイタリア語の文章を読み書きする"
    ko: "긴 이탈리아어 글 읽고 쓰기"
    vi: "Đọc và viết văn bản tiếng Ý dài hơn"
    ms: "Baca dan tulis teks bahasa Itali yang lebih panjang"
    id: "Membaca dan menulis teks bahasa Italia yang lebih panjang"
    hi: "लंबे इतालवी पाठ पढ़ना-लिखना"
  - en: "Give a clear presentation in Italian"
    zh: "用意大利语做清楚的口头报告"
    zh-TW: "用義大利語做清楚的口頭報告"
    ja: "イタリア語で分かりやすく発表する"
    ko: "이탈리아어로 명확하게 발표하기"
    vi: "Thuyết trình rõ ràng bằng tiếng Ý"
    ms: "Buat pembentangan yang jelas dalam bahasa Itali"
    id: "Melakukan presentasi yang jelas dalam bahasa Italia"
    hi: "इतालवी में स्पष्ट प्रस्तुति देना"
