code: BMEN90038
year: 2027
learn:
  en: "Mechanics of bones, joints and muscles in human movement, sport, injury and implants."
  zh: "人体运动中骨骼、关节和肌肉的力学，涉及运动、损伤和植入物。"
  zh-TW: "人體運動中骨骼、關節與肌肉的力學，涉及運動、傷害與植入物。"
  ja: "人の動きにおける骨・関節・筋の力学。スポーツ、けが、インプラントも扱う。"
  ko: "인체 움직임 속 뼈·관절·근육의 역학, 스포츠·부상·임플란트 포함."
  vi: "Cơ học của xương, khớp và cơ khi vận động, thể thao, chấn thương và cấy ghép."
  ms: "Mekanik tulang, sendi dan otot dalam pergerakan, sukan, kecederaan dan implan."
  id: "Mekanika tulang, sendi, dan otot dalam gerak, olahraga, cedera, dan implan."
  hi: "मानव गति, खेल, चोट और इम्प्लांट में हड्डियों, जोड़ों और मांसपेशियों की यांत्रिकी।"
outcomes:
  - en: "Model musculoskeletal mechanics in human movement"
    zh: "为人体运动中的肌肉骨骼力学建模"
    zh-TW: "為人體運動中的肌肉骨骼力學建模"
    ja: "人の動きの筋骨格力学をモデル化する"
    ko: "인체 움직임의 근골격 역학 모델링하기"
    vi: "Mô hình hóa cơ học cơ-xương khi vận động"
    ms: "Memodelkan mekanik otot rangka dalam pergerakan"
    id: "Memodelkan mekanika muskuloskeletal dalam gerak"
    hi: "मानव गति में मस्कुलोस्केलेटल यांत्रिकी का मॉडल बनाना"
  - en: "Assess how ageing and injury affect movement"
    zh: "评估衰老和损伤对运动的影响"
    zh-TW: "評估老化與傷害對運動的影響"
    ja: "加齢とけがが動きに与える影響を評価する"
    ko: "노화와 부상이 움직임에 주는 영향 평가하기"
    vi: "Đánh giá ảnh hưởng của lão hóa và chấn thương lên vận động"
    ms: "Menilai kesan penuaan dan kecederaan pada pergerakan"
    id: "Menilai dampak penuaan dan cedera pada gerak"
    hi: "उम्र और चोट का गति पर असर आँकना"
