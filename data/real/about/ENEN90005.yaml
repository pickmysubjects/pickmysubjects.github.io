code: ENEN90005
year: 2027
learn:
  en: "Running environmental management systems under ISO 14000, including risk checks and internal audits."
  zh: "按照 ISO 14000 运行环境管理体系，包括风险评估和内部审核。"
  zh-TW: "依照 ISO 14000 運作環境管理系統，包括風險評估與內部稽核。"
  ja: "ISO 14000 に沿った環境マネジメントシステムの運用、リスク評価と内部監査。"
  ko: "ISO 14000에 따른 환경경영시스템 운영, 위험 평가와 내부 심사."
  vi: "Vận hành hệ thống quản lý môi trường theo ISO 14000, gồm đánh giá rủi ro và đánh giá nội bộ."
  ms: "Mengendalikan sistem pengurusan alam sekitar mengikut ISO 14000, termasuk penilaian risiko dan audit dalaman."
  id: "Menjalankan sistem manajemen lingkungan sesuai ISO 14000, termasuk penilaian risiko dan audit internal."
  hi: "ISO 14000 के तहत पर्यावरण प्रबंधन प्रणाली चलाना, जोखिम जाँच और आंतरिक ऑडिट सहित।"
outcomes:
  - en: "Apply the ISO 14001 and ISO 14004 standards"
    zh: "应用 ISO 14001 和 ISO 14004 标准"
    zh-TW: "應用 ISO 14001 與 ISO 14004 標準"
    ja: "ISO 14001 と ISO 14004 を適用する"
    ko: "ISO 14001과 ISO 14004 표준 적용하기"
    vi: "Áp dụng tiêu chuẩn ISO 14001 và ISO 14004"
    ms: "Menggunakan piawaian ISO 14001 dan ISO 14004"
    id: "Menerapkan standar ISO 14001 dan ISO 14004"
    hi: "ISO 14001 और ISO 14004 मानक लागू करना"
  - en: "Rank the environmental risks of a facility"
    zh: "对设施的环境风险进行排序"
    zh-TW: "為設施的環境風險排序"
    ja: "施設の環境リスクに優先順位をつける"
    ko: "시설의 환경 위험 우선순위 정하기"
    vi: "Xếp hạng rủi ro môi trường của một cơ sở"
    ms: "Menyusun keutamaan risiko alam sekitar sesebuah kemudahan"
    id: "Memprioritaskan risiko lingkungan suatu fasilitas"
    hi: "किसी सुविधा के पर्यावरणीय जोखिमों को प्राथमिकता देना"
  - en: "Carry out an EMS audit of a business"
    zh: "对企业开展环境管理体系审核"
    zh-TW: "對企業進行環境管理系統稽核"
    ja: "企業の EMS 監査を行う"
    ko: "기업의 환경경영시스템 심사하기"
    vi: "Đánh giá hệ thống EMS của một doanh nghiệp"
    ms: "Menjalankan audit EMS bagi sesebuah perniagaan"
    id: "Melakukan audit EMS pada sebuah usaha"
    hi: "किसी व्यवसाय का EMS ऑडिट करना"
