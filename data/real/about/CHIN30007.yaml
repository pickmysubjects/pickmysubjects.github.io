code: CHIN30007
year: 2026
learn:
  en: "Reading Chinese-language academic research on society and culture, and writing your own study."
  zh: "阅读社会与文化领域的中文学术研究，并完成自己的研究。"
  zh-TW: "閱讀社會與文化領域的中文學術研究，並完成自己的研究。"
  ja: "社会・文化に関する中国語の学術研究を読み、自分の研究をまとめる。"
  ko: "사회·문화에 관한 중국어 학술 연구를 읽고 자신의 연구를 쓴다."
  vi: "Đọc nghiên cứu học thuật tiếng Trung về xã hội, văn hóa và viết nghiên cứu của riêng mình."
  ms: "Membaca kajian akademik berbahasa Cina tentang masyarakat dan budaya, dan menulis kajian sendiri."
  id: "Membaca penelitian akademik berbahasa Mandarin tentang masyarakat dan budaya, lalu menulis kajian sendiri."
  hi: "समाज और संस्कृति पर चीनी भाषा का अकादमिक शोध पढ़ना और अपना अध्ययन लिखना।"
outcomes:
  - en: "Read academic articles written in Chinese"
    zh: "阅读中文学术论文"
    zh-TW: "閱讀中文學術論文"
    ja: "中国語の学術論文を読む"
    ko: "중국어 학술 논문 읽기"
    vi: "Đọc bài báo học thuật viết bằng tiếng Trung"
    ms: "Baca artikel akademik dalam bahasa Cina"
    id: "Membaca artikel akademik berbahasa Mandarin"
    hi: "चीनी में लिखे अकादमिक लेख पढ़ना"
  - en: "Present research findings in Chinese"
    zh: "用中文汇报研究成果"
    zh-TW: "用中文匯報研究成果"
    ja: "研究結果を中国語で発表する"
    ko: "연구 결과를 중국어로 발표하기"
    vi: "Trình bày kết quả nghiên cứu bằng tiếng Trung"
    ms: "Bentangkan dapatan kajian dalam bahasa Cina"
    id: "Mempresentasikan temuan penelitian dalam bahasa Mandarin"
    hi: "शोध के नतीजे चीनी में प्रस्तुत करना"
  - en: "Write a research paper on a cultural topic"
    zh: "就文化话题写研究论文"
    zh-TW: "就文化話題寫研究論文"
    ja: "文化的テーマで研究論文を書く"
    ko: "문화 주제로 연구 논문 쓰기"
    vi: "Viết bài nghiên cứu về một chủ đề văn hóa"
    ms: "Tulis kertas kajian tentang topik budaya"
    id: "Menulis makalah penelitian tentang topik budaya"
    hi: "किसी सांस्कृतिक विषय पर शोध पत्र लिखना"
