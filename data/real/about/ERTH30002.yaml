code: ERTH30002
year: 2026
learn:
  en: "Applied geoscience for careers: mineral exploration, geophysics, engineering geology and water resources."
  zh: "面向就业的应用地学：矿产勘探、地球物理、工程地质和水资源。"
  zh-TW: "面向就業的應用地球科學：礦產探勘、地球物理、工程地質和水資源。"
  ja: "仕事で使う応用地球科学：鉱物探査、物理探査、地質工学、水資源。"
  ko: "실무 응용 지구과학: 광물 탐사, 지구물리, 공학지질, 수자원."
  vi: "Địa chất ứng dụng cho nghề nghiệp: thăm dò khoáng sản, địa vật lý, địa chất công trình, tài nguyên nước."
  ms: "Geosains gunaan untuk kerjaya: penerokaan mineral, geofizik, geologi kejuruteraan dan sumber air."
  id: "Geosains terapan untuk karier: eksplorasi mineral, geofisika, geologi teknik, dan sumber daya air."
  hi: "करियर के लिए एप्लाइड जियोसाइंस: खनिज खोज, जियोफ़िज़िक्स, इंजीनियरिंग जियोलॉजी और जल संसाधन।"
outcomes:
  - en: "Collect and interpret geoscience data"
    zh: "采集并解读地学数据"
    zh-TW: "採集並解讀地科數據"
    ja: "地球科学データを取得・解釈する"
    ko: "지구과학 데이터를 수집·해석한다"
    vi: "Thu thập và diễn giải dữ liệu địa chất"
    ms: "Kumpul dan tafsir data geosains"
    id: "Mengumpulkan dan menafsirkan data geosains"
    hi: "जियोसाइंस डेटा जुटाना और समझना"
  - en: "Explain geoscience to non-specialists"
    zh: "向非专业人士讲解地学"
    zh-TW: "向非專業人士講解地科"
    ja: "専門外の人に地球科学を説明する"
    ko: "비전문가에게 지구과학을 설명한다"
    vi: "Giải thích địa chất cho người ngoài ngành"
    ms: "Terangkan geosains kepada bukan pakar"
    id: "Menjelaskan geosains kepada orang awam"
    hi: "गैर-विशेषज्ञों को जियोसाइंस समझाना"
