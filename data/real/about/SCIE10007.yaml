code: SCIE10007
year: 2026
learn:
  en: "Apply first-semester science to real cases on field trips around Melbourne, then reflect in a learning journal."
  zh: "把第一学期的科学知识用到墨尔本各地实地考察的真实案例中，并写学习日志反思。"
  zh-TW: "把第一學期的科學知識用到墨爾本各地實地考察的真實案例，並寫學習日誌反思。"
  ja: "1学期目の科学をメルボルン各地の現地学習で実例に応用し、学習日誌で振り返る。"
  ko: "1학기 과학을 멜버른 현장 학습의 실제 사례에 적용하고 학습 일지로 성찰."
  vi: "Áp dụng kiến thức học kỳ 1 vào ca thực tế qua chuyến đi quanh Melbourne, viết nhật ký học tập."
  ms: "Guna sains semester pertama pada kes sebenar semasa lawatan di Melbourne, dan tulis jurnal."
  id: "Terapkan sains semester satu pada kasus nyata lewat kunjungan di Melbourne, lalu tulis jurnal."
  hi: "पहले सेमेस्टर का विज्ञान मेलबर्न में फ़ील्ड ट्रिप के असली केस पर लगाना, फिर जर्नल में सोचना।"
outcomes:
  - en: "Apply science to real-world case studies"
    zh: "把科学知识用到真实案例中"
    zh-TW: "把科學知識用到真實案例中"
    ja: "科学を実際の事例に応用する"
    ko: "과학을 실제 사례에 적용하기"
    vi: "Áp dụng khoa học vào ca thực tế"
    ms: "Guna sains pada kajian kes sebenar"
    id: "Menerapkan sains pada studi kasus nyata"
    hi: "विज्ञान को असली केस स्टडी पर लागू करना"
  - en: "Explain science to different audiences"
    zh: "向不同受众讲解科学"
    zh-TW: "向不同受眾講解科學"
    ja: "さまざまな相手に科学を伝える"
    ko: "다양한 청중에게 과학 설명하기"
    vi: "Giải thích khoa học cho nhiều đối tượng"
    ms: "Terangkan sains kepada pelbagai khalayak"
    id: "Menjelaskan sains ke berbagai audiens"
    hi: "अलग-अलग लोगों को विज्ञान समझाना"
  - en: "Work safely and well in a team"
    zh: "在团队中安全高效地合作"
    zh-TW: "在團隊中安全有效地合作"
    ja: "チームで安全にうまく協力する"
    ko: "팀에서 안전하고 원활하게 협력하기"
    vi: "Làm việc nhóm an toàn và hiệu quả"
    ms: "Bekerja dengan selamat dan baik dalam pasukan"
    id: "Bekerja aman dan baik dalam tim"
    hi: "टीम में सुरक्षित और अच्छे से काम करना"
