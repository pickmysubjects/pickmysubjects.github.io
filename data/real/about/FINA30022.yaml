code: FINA30022
year: 2026
learn:
  en: "A performance design studio on space: treat space, scale and light as storytelling tools across a series of projects."
  zh: "以空间为主题的表演设计工作室：在一系列项目中把空间、尺度和灯光当作叙事工具。"
  zh-TW: "以空間為主題的表演設計工作室：在一系列專案中把空間、尺度與燈光當作敘事工具。"
  ja: "空間をテーマにした舞台デザインのスタジオ。一連の課題で空間・スケール・光を物語の道具として扱う。"
  ko: "공간을 주제로 한 퍼포먼스 디자인 스튜디오. 여러 프로젝트에서 공간·스케일·빛을 서사 도구로 다룬다."
  vi: "Studio thiết kế biểu diễn về không gian: dùng không gian, tỉ lệ và ánh sáng để kể chuyện qua nhiều dự án."
  ms: "Studio reka bentuk persembahan tentang ruang: guna ruang, skala dan cahaya sebagai alat bercerita."
  id: "Studio desain pertunjukan tentang ruang: memakai ruang, skala, dan cahaya sebagai alat bercerita."
  hi: "स्पेस पर परफ़ॉर्मेंस डिज़ाइन स्टूडियो: कई प्रोजेक्ट में स्पेस, स्केल और रोशनी को कहानी का औज़ार बनाना।"
outcomes:
  - en: "Generate and develop design ideas for a space"
    zh: "为空间提出并深化设计构想"
    zh-TW: "為空間提出並深化設計構想"
    ja: "空間の設計アイデアを生み育てる"
    ko: "공간을 위한 디자인 아이디어 내고 발전시키기"
    vi: "Nảy sinh và phát triển ý tưởng cho không gian"
    ms: "Jana dan kembangkan idea reka bentuk ruang"
    id: "Memunculkan dan mengembangkan ide desain ruang"
    hi: "किसी स्पेस के लिए डिज़ाइन विचार बनाना और बढ़ाना"
  - en: "Use scale and light to shape a performance space"
    zh: "用尺度和灯光塑造演出空间"
    zh-TW: "用尺度與燈光形塑演出空間"
    ja: "スケールと光で上演空間をつくる"
    ko: "스케일과 빛으로 공연 공간 만들기"
    vi: "Dùng tỉ lệ và ánh sáng tạo không gian biểu diễn"
    ms: "Guna skala dan cahaya untuk ruang persembahan"
    id: "Memakai skala dan cahaya untuk ruang pertunjukan"
    hi: "स्केल और रोशनी से प्रदर्शन स्पेस गढ़ना"
  - en: "Treat space as a storytelling tool"
    zh: "把空间当作叙事工具"
    zh-TW: "把空間當作敘事工具"
    ja: "空間を物語の道具として使う"
    ko: "공간을 이야기 도구로 다루기"
    vi: "Xem không gian là công cụ kể chuyện"
    ms: "Jadikan ruang alat bercerita"
    id: "Menjadikan ruang alat bercerita"
    hi: "स्पेस को कहानी कहने का औज़ार बनाना"
