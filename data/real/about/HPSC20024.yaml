code: HPSC20024
year: 2026
learn:
  en: "Hearing both sides of current science debates each week, and learning to judge and make arguments on science and society."
  zh: "每周听当下科学争论的正反两方，学会评判并提出关于科学与社会的论证。"
  zh-TW: "每週聽當下科學爭論的正反兩方，學會評判並提出關於科學與社會的論證。"
  ja: "毎週、今の科学論争の両側の主張を聞き、科学と社会について論を評価し組み立てる力を身につける。"
  ko: "매주 현재 과학 논쟁의 양쪽 주장을 듣고 과학과 사회에 관한 논증을 판단하고 세우는 법을 배운다."
  vi: "Mỗi tuần nghe hai phía của một tranh luận khoa học, học cách đánh giá và lập luận về khoa học và xã hội."
  ms: "Mendengar kedua-dua pihak perdebatan sains setiap minggu, dan belajar menilai serta membina hujah tentang sains dan masyarakat."
  id: "Mendengar dua sisi perdebatan sains tiap minggu, dan belajar menilai serta menyusun argumen soal sains dan masyarakat."
  hi: "हर हफ़्ते विज्ञान की मौजूदा बहस के दोनों पक्ष सुनना, और विज्ञान व समाज पर तर्कों को परखना और बनाना सीखना।"
outcomes:
  - en: "Weigh opposing arguments on science issues"
    zh: "权衡科学议题上的对立论点"
    zh-TW: "權衡科學議題上的對立論點"
    ja: "科学の問題で対立する議論を比べて評価する"
    ko: "과학 쟁점의 상반된 주장 따져보기"
    vi: "Cân nhắc các lập luận trái chiều về vấn đề khoa học"
    ms: "Timbang hujah bertentangan tentang isu sains"
    id: "Menimbang argumen yang berlawanan soal sains"
    hi: "विज्ञान के मुद्दों पर विरोधी तर्कों को तौलना"
  - en: "Explain how society shapes scientific debate"
    zh: "解释社会如何影响科学争论"
    zh-TW: "解釋社會如何影響科學爭論"
    ja: "社会が科学論争をどう形づくるか説明する"
    ko: "사회가 과학 논쟁을 만드는 방식 설명하기"
    vi: "Giải thích xã hội định hình tranh luận khoa học ra sao"
    ms: "Terangkan cara masyarakat membentuk perdebatan sains"
    id: "Menjelaskan cara masyarakat membentuk perdebatan sains"
    hi: "समाज वैज्ञानिक बहस को कैसे गढ़ता है, समझाना"
  - en: "Build and present your own argument"
    zh: "构建并展示自己的论证"
    zh-TW: "建構並展示自己的論證"
    ja: "自分の主張を組み立て発表する"
    ko: "자신의 논증을 세우고 발표하기"
    vi: "Xây dựng và trình bày lập luận của riêng bạn"
    ms: "Bina dan bentangkan hujah sendiri"
    id: "Menyusun dan menyajikan argumen sendiri"
    hi: "अपना तर्क बनाना और प्रस्तुत करना"
