code: UNIB10011
year: 2027
learn:
  en: "The human body seen through arts, science, medicine, philosophy and more, and how these fields connect."
  zh: "从艺术、科学、医学、哲学等角度看人体，以及这些领域如何相互联系。"
  zh-TW: "從藝術、科學、醫學、哲學等角度看人體，以及這些領域如何相互連結。"
  ja: "芸術・科学・医学・哲学などから人の体を見つめ、それぞれの分野がどうつながるかを探る。"
  ko: "예술, 과학, 의학, 철학 등 여러 관점에서 인체를 보고 이 분야들이 어떻게 연결되는지 살펴본다."
  vi: "Nhìn cơ thể con người qua nghệ thuật, khoa học, y học, triết học và hơn thế, cùng mối liên hệ giữa các lĩnh vực đó."
  ms: "Tubuh manusia dilihat melalui seni, sains, perubatan, falsafah dan lain-lain, serta kaitan antara bidang-bidang ini."
  id: "Tubuh manusia dilihat lewat seni, sains, kedokteran, filsafat, dan lainnya, serta keterkaitan antarbidang tersebut."
  hi: "कला, विज्ञान, चिकित्सा, दर्शन और अन्य क्षेत्रों से मानव शरीर को देखना, और ये क्षेत्र आपस में कैसे जुड़ते हैं।"
outcomes:
  - en: "Explain the body's role across different fields"
    zh: "说明人体在不同学科中的角色"
    zh-TW: "說明人體在不同學科中的角色"
    ja: "さまざまな分野における体の役割を説明する"
    ko: "여러 분야에서 몸이 가지는 역할 설명하기"
    vi: "Giải thích vai trò của cơ thể trong các lĩnh vực khác nhau"
    ms: "Terangkan peranan tubuh dalam pelbagai bidang"
    id: "Menjelaskan peran tubuh di berbagai bidang"
    hi: "अलग-अलग क्षेत्रों में शरीर की भूमिका समझाना"
  - en: "Share ideas about the body in talks and writing"
    zh: "通过口头和书面表达对人体的看法"
    zh-TW: "透過口頭和書面表達對人體的看法"
    ja: "体についての考えを口頭と文章で伝える"
    ko: "몸에 대한 생각을 말과 글로 전달하기"
    vi: "Trình bày ý tưởng về cơ thể bằng lời nói và bài viết"
    ms: "Kongsi idea tentang tubuh secara lisan dan bertulis"
    id: "Menyampaikan gagasan tentang tubuh secara lisan dan tulisan"
    hi: "शरीर के बारे में विचार बोलकर और लिखकर रखना"
  - en: "Work in a team on cross-discipline projects"
    zh: "在跨学科项目中进行团队合作"
    zh-TW: "在跨領域專案中進行團隊合作"
    ja: "分野横断のプロジェクトでチームとして動く"
    ko: "학제 간 프로젝트에서 팀으로 협업하기"
    vi: "Làm việc nhóm trong các dự án liên ngành"
    ms: "Bekerja dalam pasukan bagi projek rentas disiplin"
    id: "Bekerja dalam tim pada proyek lintas disiplin"
    hi: "अंतर-विषयी प्रोजेक्ट में टीम के रूप में काम करना"
