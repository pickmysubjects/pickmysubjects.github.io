code: ELEN90098
year: 2027
learn:
  en: "Reinforcement learning for engineering systems: Bellman equation, Q-learning, deep RL, and model-based vs model-free methods."
  zh: "工程系统中的强化学习：贝尔曼方程、Q 学习、深度强化学习等方法。"
  zh-TW: "工程系統中的強化學習：貝爾曼方程、Q 學習、深度強化學習等方法。"
  ja: "工学システムのための強化学習。ベルマン方程式、Q 学習、深層強化学習、モデルベースとモデルフリーの手法。"
  ko: "공학 시스템을 위한 강화학습. 벨만 방정식, Q-러닝, 딥 RL, 모델 기반과 모델 프리 방법."
  vi: "Học tăng cường cho hệ thống kỹ thuật: phương trình Bellman, Q-learning, deep RL, phương pháp có mô hình và không mô hình."
  ms: "Pembelajaran peneguhan untuk sistem kejuruteraan: persamaan Bellman, Q-learning, deep RL, kaedah berasaskan model dan bebas model."
  id: "Reinforcement learning untuk sistem teknik: persamaan Bellman, Q-learning, deep RL, metode berbasis model dan bebas model."
  hi: "इंजीनियरिंग सिस्टम के लिए रीइन्फ़ोर्समेंट लर्निंग: बेलमैन समीकरण, Q-लर्निंग, डीप RL, मॉडल-आधारित और मॉडल-मुक्त तरीके।"
outcomes:
  - en: "Implement RL methods such as Q-learning and deep Q-networks"
    zh: "实现 Q 学习、深度 Q 网络等方法"
    zh-TW: "實作 Q 學習、深度 Q 網路等方法"
    ja: "Q 学習や深層 Q ネットワークを実装する"
    ko: "Q-러닝, 딥 Q-네트워크 같은 RL 방법 구현하기"
    vi: "Triển khai Q-learning, mạng Q sâu và các phương pháp RL khác"
    ms: "Melaksanakan kaedah RL seperti Q-learning dan rangkaian Q dalam"
    id: "Menerapkan metode RL seperti Q-learning dan deep Q-network"
    hi: "Q-लर्निंग और डीप Q-नेटवर्क जैसे RL तरीके लागू करना"
  - en: "Link feedback control, optimisation and reinforcement learning"
    zh: "理解反馈控制、优化与强化学习的联系"
    zh-TW: "理解回饋控制、最佳化與強化學習的關聯"
    ja: "フィードバック制御、最適化、強化学習のつながりを説明する"
    ko: "피드백 제어, 최적화, 강화학습의 연결 설명하기"
    vi: "Liên hệ điều khiển phản hồi, tối ưu hóa và học tăng cường"
    ms: "Mengaitkan kawalan suap balik, pengoptimuman dan pembelajaran peneguhan"
    id: "Menghubungkan kendali umpan balik, optimasi, dan reinforcement learning"
    hi: "फ़ीडबैक कंट्रोल, ऑप्टिमाइज़ेशन और रीइन्फ़ोर्समेंट लर्निंग को जोड़ना"
  - en: "Explain the challenges of learning algorithms on real systems"
    zh: "说明学习算法用在真实系统中的难点"
    zh-TW: "說明學習演算法用在真實系統中的難處"
    ja: "実システムで学習アルゴリズムを使う難しさを説明する"
    ko: "실제 시스템에 학습 알고리즘을 적용할 때의 어려움 설명하기"
    vi: "Giải thích khó khăn khi dùng thuật toán học trên hệ thống thực"
    ms: "Menerangkan cabaran algoritma pembelajaran pada sistem sebenar"
    id: "Menjelaskan tantangan algoritma pembelajaran pada sistem nyata"
    hi: "असली सिस्टम पर लर्निंग एल्गोरिदम की चुनौतियाँ समझाना"
