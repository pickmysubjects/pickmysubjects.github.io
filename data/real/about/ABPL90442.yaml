code: ABPL90442
year: 2027
learn:
  en: "Delivering culturally appropriate, sustainable infrastructure in international development, with industry guests and group work."
  zh: "在国际发展领域交付符合当地文化、可持续的基础设施，有行业嘉宾和小组活动。"
  zh-TW: "在國際發展領域交付符合當地文化、永續的基礎設施，有業界講者與小組活動。"
  ja: "国際開発で文化に合った持続可能なインフラを届ける。業界ゲストとグループ活動。"
  ko: "국제개발에서 문화에 맞고 지속가능한 인프라 제공. 업계 연사와 그룹 활동."
  vi: "Xây dựng hạ tầng bền vững, phù hợp văn hóa trong phát triển quốc tế, có khách mời và làm nhóm."
  ms: "Menyampaikan infrastruktur mampan dan sesuai budaya dalam pembangunan antarabangsa."
  id: "Menghadirkan infrastruktur berkelanjutan dan sesuai budaya dalam pembangunan internasional."
  hi: "अंतरराष्ट्रीय विकास में संस्कृति-अनुकूल, टिकाऊ ढाँचा बनाना, उद्योग अतिथियों के साथ।"
outcomes:
  - en: "Explain the politics and policy of development aid"
    zh: "解释发展援助中的政策与政治"
    zh-TW: "解釋發展援助中的政策與政治"
    ja: "開発援助の政策と政治を説明する"
    ko: "개발 원조의 정책과 정치 설명하기"
    vi: "Giải thích chính sách và chính trị viện trợ"
    ms: "Menerangkan dasar dan politik bantuan pembangunan"
    id: "Menjelaskan kebijakan dan politik bantuan pembangunan"
    hi: "विकास सहायता की नीति और राजनीति समझाना"
  - en: "Plan infrastructure that fits the local context"
    zh: "规划适合当地情况的基础设施"
    zh-TW: "規劃適合當地情況的基礎設施"
    ja: "現地に合ったインフラを計画する"
    ko: "현지 상황에 맞는 인프라 계획하기"
    vi: "Lập kế hoạch hạ tầng phù hợp địa phương"
    ms: "Merancang infrastruktur sesuai konteks setempat"
    id: "Merencanakan infrastruktur sesuai konteks lokal"
    hi: "स्थानीय संदर्भ के अनुकूल ढाँचे की योजना"
