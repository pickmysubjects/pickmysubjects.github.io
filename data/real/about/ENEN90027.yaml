code: ENEN90027
year: 2027
learn:
  en: "Judging energy sources and technologies for sustainability, through a team project on a chosen place."
  zh: "通过针对某一地区的小组项目，判断能源和技术是否可持续。"
  zh-TW: "透過針對某地區的小組專題，判斷能源與技術是否永續。"
  ja: "特定地域を対象にしたチーム課題で、エネルギー源と技術の持続可能性を見極める。"
  ko: "특정 지역에 대한 팀 프로젝트로 에너지원과 기술의 지속가능성을 판단합니다."
  vi: "Đánh giá tính bền vững của nguồn và công nghệ năng lượng qua dự án nhóm cho một địa điểm cụ thể."
  ms: "Menilai kelestarian sumber dan teknologi tenaga melalui projek berkumpulan untuk sesuatu tempat."
  id: "Menilai keberlanjutan sumber dan teknologi energi lewat proyek tim untuk lokasi tertentu."
  hi: "किसी चुनी हुई जगह पर टीम प्रोजेक्ट के ज़रिए ऊर्जा स्रोतों और तकनीकों की स्थिरता परखना।"
outcomes:
  - en: "Critique energy systems for their sustainability"
    zh: "评判能源系统的可持续性"
    zh-TW: "評判能源系統的永續性"
    ja: "エネルギーシステムの持続可能性を評価する"
    ko: "에너지 시스템의 지속가능성 평가하기"
    vi: "Đánh giá tính bền vững của hệ thống năng lượng"
    ms: "Mengkritik kelestarian sistem tenaga"
    id: "Mengkritisi keberlanjutan sistem energi"
    hi: "ऊर्जा प्रणालियों की स्थिरता की समीक्षा करना"
  - en: "Compare carbon, nuclear and renewable options"
    zh: "比较化石、核能和可再生能源方案"
    zh-TW: "比較化石、核能與再生能源方案"
    ja: "化石・原子力・再エネの選択肢を比べる"
    ko: "화석, 원자력, 재생에너지 대안 비교하기"
    vi: "So sánh phương án than/dầu, hạt nhân và tái tạo"
    ms: "Membandingkan pilihan karbon, nuklear dan boleh baharu"
    id: "Membandingkan opsi karbon, nuklir, dan terbarukan"
    hi: "कार्बन, परमाणु और नवीकरणीय विकल्पों की तुलना"
