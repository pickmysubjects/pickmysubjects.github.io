code: CREA20001
year: 2026
learn:
  en: "Good practice, ethics and protocols for working with Indigenous artists, music, dance, stories and cultural heritage."
  zh: "与原住民艺术家、音乐、舞蹈、故事和文化遗产合作的规范、伦理与准则。"
  zh-TW: "與原住民藝術家、音樂、舞蹈、故事和文化資產合作的規範、倫理與準則。"
  ja: "先住民の芸術家・音楽・舞踊・物語・文化遺産と関わる際の倫理と作法。"
  ko: "원주민 예술가, 음악, 춤, 이야기, 문화유산과 함께 일할 때의 윤리와 원칙."
  vi: "Chuẩn mực, đạo đức và quy tắc khi làm việc với nghệ sĩ, âm nhạc, múa và di sản văn hóa bản địa."
  ms: "Amalan baik, etika dan protokol bekerja dengan artis, muzik, tarian dan warisan budaya Orang Asli."
  id: "Praktik baik, etika dan protokol bekerja dengan seniman, musik, tari dan warisan budaya Pribumi."
  hi: "आदिवासी कलाकारों, संगीत, नृत्य, कथाओं और सांस्कृतिक विरासत के साथ काम करने की नैतिकता और नियम।"
outcomes:
  - en: "Summarise protocols for working with Indigenous arts"
    zh: "总结与原住民艺术合作的准则"
    zh-TW: "總結與原住民藝術合作的準則"
    ja: "先住民芸術と関わる際の作法をまとめる"
    ko: "원주민 예술과 협업하는 원칙 요약하기"
    vi: "Tóm tắt quy tắc làm việc với nghệ thuật bản địa"
    ms: "Ringkaskan protokol bekerja dengan seni Orang Asli"
    id: "Merangkum protokol bekerja dengan seni Pribumi"
    hi: "आदिवासी कला के साथ काम के नियमों का सार देना"
  - en: "Discuss the arts in light of colonisation and decolonisation"
    zh: "从殖民与去殖民角度讨论艺术"
    zh-TW: "從殖民與去殖民角度討論藝術"
    ja: "植民地化と脱植民地化の視点から芸術を論じる"
    ko: "식민화와 탈식민화 관점에서 예술 논의하기"
    vi: "Thảo luận nghệ thuật dưới góc độ thuộc địa và phi thuộc địa hóa"
    ms: "Bincang seni dari sudut penjajahan dan nyahpenjajahan"
    id: "Membahas seni dari sudut kolonisasi dan dekolonisasi"
    hi: "उपनिवेशवाद और विउपनिवेशीकरण के संदर्भ में कला पर चर्चा"
  - en: "Design, propose and critique your own project"
    zh: "设计、提出并评析自己的项目"
    zh-TW: "設計、提出並評析自己的專案"
    ja: "自分のプロジェクトを設計・提案・批評する"
    ko: "자기 프로젝트를 설계·제안·비평하기"
    vi: "Thiết kế, đề xuất và phản biện dự án của mình"
    ms: "Reka, cadang dan kritik projek sendiri"
    id: "Merancang, mengusulkan dan mengkritisi proyek sendiri"
    hi: "अपना प्रोजेक्ट डिज़ाइन, प्रस्तावित और समीक्षा करना"
