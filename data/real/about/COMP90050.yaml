code: COMP90050
year: 2027
learn:
  en: "How large databases stay reliable and fast: transactions, concurrency control, recovery and data management."
  zh: "大型数据库如何保持可靠与高效：事务、并发控制、恢复与数据管理。"
  zh-TW: "大型資料庫如何保持可靠與高效：交易、並行控制、復原與資料管理。"
  ja: "大規模データベースの信頼性と速度：トランザクション、並行制御、復旧、データ管理。"
  ko: "대형 데이터베이스의 신뢰성과 속도: 트랜잭션, 동시성 제어, 복구, 데이터 관리."
  vi: "Cơ sở dữ liệu lớn giữ tin cậy và nhanh: giao dịch, kiểm soát đồng thời, phục hồi."
  ms: "Cara pangkalan data besar kekal boleh dipercayai: transaksi, kawalan serentak, pemulihan."
  id: "Cara basis data besar tetap andal dan cepat: transaksi, kontrol konkurensi, pemulihan."
  hi: "बड़े डेटाबेस भरोसेमंद और तेज़ कैसे रहते हैं: ट्रांज़ैक्शन, कंकरेंसी कंट्रोल, रिकवरी।"
outcomes:
  - en: "Explain transactions and concurrency control"
    zh: "解释事务与并发控制"
    zh-TW: "解釋交易與並行控制"
    ja: "トランザクションと並行制御を説明する"
    ko: "트랜잭션과 동시성 제어 설명하기"
    vi: "Giải thích giao dịch và kiểm soát đồng thời"
    ms: "Terangkan transaksi dan kawalan serentak"
    id: "Menjelaskan transaksi dan kontrol konkurensi"
    hi: "ट्रांज़ैक्शन और कंकरेंसी कंट्रोल समझाना"
  - en: "Judge how a database copes with failures and many users"
    zh: "评估数据库应对故障与多用户的能力"
    zh-TW: "評估資料庫應對故障與多使用者的能力"
    ja: "障害や多人数利用への耐性を評価する"
    ko: "장애·다중 사용자 대응 능력 평가하기"
    vi: "Đánh giá cơ sở dữ liệu xử lý lỗi và nhiều người dùng"
    ms: "Nilai cara pangkalan data hadapi kegagalan dan ramai pengguna"
    id: "Menilai ketahanan basis data terhadap gangguan dan banyak pengguna"
    hi: "डेटाबेस विफलताओं और कई यूज़र्स को कैसे संभालता है, आंकना"
