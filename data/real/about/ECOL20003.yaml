code: ECOL20003
year: 2026
learn:
  en: "What controls where species live, how populations grow, and how energy flows through ecosystems."
  zh: "物种分布、种群增长以及生态系统能量流动由什么决定。"
  zh-TW: "物種分布、族群成長以及生態系能量流動由什麼決定。"
  ja: "種の分布、個体群の増え方、生態系のエネルギーの流れを決めるもの。"
  ko: "종의 분포, 개체군 성장, 생태계 에너지 흐름을 결정하는 요인."
  vi: "Điều gì quyết định nơi loài sống, quần thể tăng trưởng và năng lượng chảy qua hệ sinh thái."
  ms: "Apa yang menentukan taburan spesies, pertumbuhan populasi dan aliran tenaga dalam ekosistem."
  id: "Apa yang menentukan sebaran spesies, pertumbuhan populasi, dan aliran energi dalam ekosistem."
  hi: "प्रजातियाँ कहाँ रहती हैं, आबादी कैसे बढ़ती है और इकोसिस्टम में ऊर्जा कैसे बहती है, यह क्या तय करता है।"
outcomes:
  - en: "Collect and interpret ecological data"
    zh: "收集并解读生态数据"
    zh-TW: "收集並解讀生態數據"
    ja: "生態データを集めて解釈する"
    ko: "생태 데이터 수집·해석하기"
    vi: "Thu thập và diễn giải dữ liệu sinh thái"
    ms: "Mengumpul dan mentafsir data ekologi"
    id: "Mengumpulkan dan menafsirkan data ekologi"
    hi: "पारिस्थितिक डेटा इकट्ठा करना और समझना"
  - en: "Apply ecological reasoning to new cases"
    zh: "把生态学思路用于新情境"
    zh-TW: "把生態學思路用於新情境"
    ja: "生態学の考え方を新しい事例に使う"
    ko: "생태학적 사고를 새 사례에 적용하기"
    vi: "Áp dụng tư duy sinh thái vào tình huống mới"
    ms: "Mengaplikasi penaakulan ekologi pada kes baharu"
    id: "Menerapkan nalar ekologi pada kasus baru"
    hi: "नई स्थितियों में पारिस्थितिक तर्क लगाना"
  - en: "Write up results as a science report"
    zh: "将结果写成科学报告"
    zh-TW: "將結果寫成科學報告"
    ja: "結果を科学レポートにまとめる"
    ko: "결과를 과학 보고서로 작성하기"
    vi: "Viết kết quả thành báo cáo khoa học"
    ms: "Menulis hasil sebagai laporan sains"
    id: "Menulis hasil sebagai laporan ilmiah"
    hi: "नतीजों को वैज्ञानिक रिपोर्ट में लिखना"
