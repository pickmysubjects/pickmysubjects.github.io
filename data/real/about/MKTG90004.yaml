code: MKTG90004
year: 2027
learn:
  en: "The basics of marketing: research, target markets, brands, advertising, distribution, pricing and buyer behaviour."
  zh: "营销基础：市场调研、目标市场、品牌、广告、分销、定价和购买者行为。"
  zh-TW: "行銷基礎：市場調查、目標市場、品牌、廣告、通路、定價與購買者行為。"
  ja: "マーケティングの基本：市場調査、ターゲット市場、ブランド、広告、流通、価格、購買行動。"
  ko: "마케팅 기초: 시장조사, 표적시장, 브랜드, 광고, 유통, 가격, 구매자 행동."
  vi: "Kiến thức nền marketing: nghiên cứu, thị trường mục tiêu, thương hiệu, quảng cáo, phân phối, giá, hành vi người mua."
  ms: "Asas pemasaran: penyelidikan, pasaran sasaran, jenama, pengiklanan, pengedaran, harga dan tingkah laku pembeli."
  id: "Dasar pemasaran: riset, pasar sasaran, merek, iklan, distribusi, harga dan perilaku pembeli."
  hi: "मार्केटिंग की बुनियाद: रिसर्च, लक्षित बाज़ार, ब्रांड, विज्ञापन, वितरण, कीमत और खरीदार का व्यवहार।"
outcomes:
  - en: "Apply marketing concepts to real problems"
    zh: "将营销概念用于实际问题"
    zh-TW: "將行銷概念應用於實際問題"
    ja: "マーケティングの概念を実際の課題に使う"
    ko: "마케팅 개념을 실제 문제에 적용하기"
    vi: "Áp dụng khái niệm marketing vào vấn đề thực"
    ms: "Menggunakan konsep pemasaran pada masalah sebenar"
    id: "Menerapkan konsep pemasaran pada masalah nyata"
    hi: "मार्केटिंग की अवधारणाएँ असली समस्याओं पर लगाना"
  - en: "Weigh ethics in marketing decisions"
    zh: "权衡营销决策中的伦理问题"
    zh-TW: "權衡行銷決策中的倫理問題"
    ja: "マーケティング判断の倫理を考える"
    ko: "마케팅 결정의 윤리 따져보기"
    vi: "Cân nhắc đạo đức trong quyết định marketing"
    ms: "Menimbang etika dalam keputusan pemasaran"
    id: "Menimbang etika dalam keputusan pemasaran"
    hi: "मार्केटिंग फ़ैसलों में नैतिकता तौलना"
