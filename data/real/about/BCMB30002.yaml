code: BCMB30002
year: 2026
learn:
  en: "How genomes are organised and controlled, and the tools used to study and edit genes."
  zh: "基因组怎样组织和调控，以及研究和编辑基因的工具。"
  zh-TW: "基因組如何組織和調控，以及研究和編輯基因的工具。"
  ja: "ゲノムの構成と制御の仕組み、遺伝子を調べ編集するツール。"
  ko: "유전체가 조직되고 조절되는 방식, 유전자를 연구·편집하는 도구."
  vi: "Bộ gen được tổ chức và điều hòa thế nào, cùng công cụ nghiên cứu và chỉnh sửa gen."
  ms: "Cara genom disusun dan dikawal, serta alat untuk mengkaji dan menyunting gen."
  id: "Cara genom tersusun dan diatur, serta alat untuk mempelajari dan menyunting gen."
  hi: "जीनोम कैसे व्यवस्थित और नियंत्रित होते हैं, और जीन पढ़ने व एडिट करने के टूल।"
outcomes:
  - en: "Analyse genomic data with bioinformatics tools"
    zh: "用生物信息工具分析基因组数据"
    zh-TW: "用生物資訊工具分析基因組資料"
    ja: "バイオインフォマティクスのツールでゲノムデータを解析する"
    ko: "생물정보학 도구로 유전체 데이터 분석하기"
    vi: "Phân tích dữ liệu gen bằng công cụ tin sinh học"
    ms: "Analisis data genom dengan alat bioinformatik"
    id: "Menganalisis data genom dengan alat bioinformatika"
    hi: "बायोइन्फ़ॉर्मेटिक्स टूल से जीनोमिक डेटा का विश्लेषण"
  - en: "Write scripts to work with genomic data"
    zh: "写脚本处理基因组数据"
    zh-TW: "寫腳本處理基因組資料"
    ja: "ゲノムデータを扱うスクリプトを書く"
    ko: "유전체 데이터 처리 스크립트 작성하기"
    vi: "Viết script xử lý dữ liệu gen"
    ms: "Tulis skrip untuk data genom"
    id: "Menulis skrip untuk mengolah data genom"
    hi: "जीनोमिक डेटा के लिए स्क्रिप्ट लिखना"
  - en: "Plan gene editing experiments with CRISPR"
    zh: "用CRISPR设计基因编辑实验"
    zh-TW: "用CRISPR設計基因編輯實驗"
    ja: "CRISPRで遺伝子編集実験を計画する"
    ko: "CRISPR로 유전자 편집 실험 설계하기"
    vi: "Lên kế hoạch thí nghiệm chỉnh sửa gen bằng CRISPR"
    ms: "Rancang eksperimen suntingan gen dengan CRISPR"
    id: "Merancang eksperimen penyuntingan gen dengan CRISPR"
    hi: "CRISPR से जीन एडिटिंग प्रयोग प्लान करना"
