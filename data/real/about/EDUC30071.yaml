code: EDUC30071
year: 2026
learn:
  en: "How knowledge and expertise work in professions, and what that means for planning your own career."
  zh: "专业领域中的知识和专长如何运作，以及对你职业规划的意义。"
  zh-TW: "專業領域中的知識和專長如何運作，以及對你職涯規劃的意義。"
  ja: "専門職における知識と熟達のしくみ、そして自分のキャリアへの意味。"
  ko: "전문직에서 지식과 전문성이 작동하는 방식과 내 커리어에 주는 의미."
  vi: "Tri thức và chuyên môn vận hành thế nào trong các nghề, và ý nghĩa với sự nghiệp của bạn."
  ms: "Cara ilmu dan kepakaran berfungsi dalam profesion, dan maknanya untuk kerjaya anda."
  id: "Cara pengetahuan dan keahlian bekerja dalam profesi, dan artinya bagi karier Anda."
  hi: "पेशों में ज्ञान और विशेषज्ञता कैसे काम करती है, और आपके करियर के लिए इसका मतलब।"
outcomes:
  - en: "Tell professional knowledge apart from everyday knowledge"
    zh: "区分专业知识和日常知识"
    zh-TW: "區分專業知識和日常知識"
    ja: "専門知識と日常知識を区別する"
    ko: "전문 지식과 일상 지식 구분하기"
    vi: "Phân biệt tri thức nghề nghiệp với hiểu biết thường ngày"
    ms: "Bezakan ilmu profesional daripada pengetahuan harian"
    id: "Membedakan pengetahuan profesional dan sehari-hari"
    hi: "पेशेवर ज्ञान और रोज़मर्रा के ज्ञान में फ़र्क करना"
  - en: "Compare theories of how experts learn"
    zh: "比较关于专家如何学习的理论"
    zh-TW: "比較關於專家如何學習的理論"
    ja: "専門家の学び方に関する理論を比べる"
    ko: "전문가가 배우는 방식에 대한 이론 비교하기"
    vi: "So sánh các lý thuyết về cách chuyên gia học hỏi"
    ms: "Bandingkan teori tentang cara pakar belajar"
    id: "Membandingkan teori cara ahli belajar"
    hi: "विशेषज्ञ कैसे सीखते हैं, इसके सिद्धांतों की तुलना करना"
  - en: "Apply these debates to your own career plans"
    zh: "把这些讨论用于自己的职业规划"
    zh-TW: "把這些討論用於自己的職涯規劃"
    ja: "議論を自分のキャリア計画に生かす"
    ko: "이 논의를 내 커리어 계획에 적용하기"
    vi: "Áp dụng các tranh luận này vào kế hoạch nghề nghiệp"
    ms: "Guna perbahasan ini untuk rancangan kerjaya sendiri"
    id: "Menerapkan debat ini pada rencana karier sendiri"
    hi: "इन बहसों को अपनी करियर योजना पर लागू करना"
