code: MUSI30046
year: 2026
learn:
  en: "Western composition from 1900 to now: analyse set works, then write short pieces in those styles for your tutorial to play."
  zh: "1900年至今的西方作曲：分析指定作品，再用这些风格写短曲在辅导课演奏。"
  zh-TW: "1900年至今的西方作曲：分析指定作品，再用這些風格寫短曲在輔導課演奏。"
  ja: "1900年以降の西洋作曲。指定作品を分析し、その技法で短い曲を書いてチュートリアルで演奏。"
  ko: "1900년 이후 서양 작곡. 지정 작품을 분석하고 그 기법으로 짧은 곡을 써서 튜토리얼에서 연주."
  vi: "Sáng tác phương Tây từ 1900 đến nay: phân tích tác phẩm rồi viết bản ngắn theo phong cách đó."
  ms: "Gubahan Barat sejak 1900: analisis karya terpilih, kemudian tulis karya pendek dalam gaya itu."
  id: "Komposisi Barat sejak 1900: analisis karya pilihan, lalu tulis karya pendek dengan gaya itu."
  hi: "1900 से अब तक की पश्चिमी रचना: चुनी कृतियों का विश्लेषण, फिर उन शैलियों में छोटी रचनाएँ।"
outcomes:
  - en: "Know the main 20th-century techniques"
    zh: "掌握20世纪主要作曲技法"
    zh-TW: "掌握20世紀主要作曲技法"
    ja: "20世紀の主要技法を知る"
    ko: "20세기 주요 기법 알기"
    vi: "Nắm kỹ thuật chính thế kỷ 20"
    ms: "Kenal teknik utama abad ke-20"
    id: "Mengenal teknik utama abad ke-20"
    hi: "20वीं सदी की मुख्य तकनीकें जानना"
  - en: "Spot techniques in real scores"
    zh: "在乐谱中识别技法"
    zh-TW: "在樂譜中辨識技法"
    ja: "楽譜の中で技法を見分ける"
    ko: "악보에서 기법 찾아내기"
    vi: "Nhận ra kỹ thuật trong bản nhạc"
    ms: "Kenal pasti teknik dalam skor"
    id: "Mengenali teknik dalam partitur"
    hi: "स्कोर में तकनीकें पहचानना"
  - en: "Compose short pieces in modern styles"
    zh: "用现代风格创作短曲"
    zh-TW: "用現代風格創作短曲"
    ja: "現代的な様式で短い曲を作る"
    ko: "현대 양식으로 짧은 곡 작곡"
    vi: "Viết bản ngắn theo phong cách hiện đại"
    ms: "Gubah karya pendek gaya moden"
    id: "Menggubah karya pendek gaya modern"
    hi: "आधुनिक शैली में छोटी रचनाएँ"
