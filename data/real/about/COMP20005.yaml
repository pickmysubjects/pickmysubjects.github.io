code: COMP20005
year: 2026
learn:
  en: "Learning to program in C, then using it to solve number-based problems from science and engineering."
  zh: "学C语言编程，再用它解决理工科里的数值计算问题。"
  zh-TW: "學C語言程式設計，再用它解決理工科的數值計算問題。"
  ja: "C言語でプログラミングを学び、理工系の数値計算問題を解く。"
  ko: "C 프로그래밍을 배우고, 이를 이용해 과학·공학의 수치 문제를 푼다."
  vi: "Học lập trình C, rồi dùng nó giải các bài toán số trong khoa học và kỹ thuật."
  ms: "Belajar pengaturcaraan C, kemudian guna untuk selesaikan masalah berangka sains dan kejuruteraan."
  id: "Belajar pemrograman C, lalu memakainya untuk soal numerik dari sains dan teknik."
  hi: "C में प्रोग्रामिंग सीखना, फिर उससे साइंस और इंजीनियरिंग की संख्यात्मक समस्याएँ हल करना।"
outcomes:
  - en: "Write and test small numerical programs"
    zh: "编写并测试小型数值程序"
    zh-TW: "撰寫並測試小型數值程式"
    ja: "小さな数値計算プログラムを書いてテストする"
    ko: "작은 수치 프로그램 작성 및 테스트"
    vi: "Viết và kiểm thử chương trình tính toán nhỏ"
    ms: "Tulis dan uji program berangka kecil"
    id: "Menulis dan menguji program numerik kecil"
    hi: "छोटे संख्यात्मक प्रोग्राम लिखना और टेस्ट करना"
  - en: "Solve equations, fit curves and integrate numerically"
    zh: "数值解方程、拟合曲线和积分"
    zh-TW: "以數值方法解方程、擬合曲線和積分"
    ja: "方程式の求解・曲線近似・数値積分を行う"
    ko: "방정식 풀이, 곡선 피팅, 수치 적분"
    vi: "Giải phương trình, khớp đường cong và tích phân số"
    ms: "Selesaikan persamaan, padan lengkung dan kamiran berangka"
    id: "Menyelesaikan persamaan, curve fitting, dan integrasi numerik"
    hi: "समीकरण हल करना, कर्व फ़िट करना और न्यूमेरिकल इंटीग्रेशन"
  - en: "Explain rounding errors in computer arithmetic"
    zh: "解释电脑计算中的误差"
    zh-TW: "解釋電腦計算中的捨入誤差"
    ja: "コンピュータ計算の丸め誤差を説明する"
    ko: "컴퓨터 연산의 반올림 오차 설명"
    vi: "Giải thích sai số làm tròn khi máy tính tính toán"
    ms: "Terangkan ralat pembundaran dalam aritmetik komputer"
    id: "Menjelaskan galat pembulatan pada aritmetika komputer"
    hi: "कंप्यूटर गणना में राउंडिंग एरर समझाना"
