code: PROP30002
year: 2026
learn:
  en: "Managing investment property over its working life: leases, maintenance, service contracts and sustainability risk."
  zh: "管理投资物业的整个使用期：租约、维护、服务合同和可持续性风险。"
  zh-TW: "管理投資型不動產的整個使用期：租約、維護、服務合約與永續風險。"
  ja: "投資用不動産を使用期間全体で管理する。賃貸借、保守、サービス契約、サステナビリティリスク。"
  ko: "투자 부동산을 사용 기간 내내 관리하기: 임대차, 유지보수, 용역 계약, 지속가능성 위험."
  vi: "Quản lý bất động sản đầu tư suốt vòng đời: hợp đồng thuê, bảo trì, hợp đồng dịch vụ, rủi ro bền vững."
  ms: "Mengurus hartanah pelaburan sepanjang hayatnya: pajakan, penyelenggaraan, kontrak servis dan risiko kelestarian."
  id: "Mengelola properti investasi sepanjang masa pakainya: sewa, perawatan, kontrak layanan, risiko keberlanjutan."
  hi: "निवेश संपत्ति को उसके पूरे जीवनकाल में संभालना: लीज़, रखरखाव, सेवा अनुबंध और स्थिरता जोखिम।"
outcomes:
  - en: "Plan inspections and planned maintenance"
    zh: "规划物业检查和计划性维护"
    zh-TW: "規劃物業檢查與計畫性維護"
    ja: "点検と計画保全を立てる"
    ko: "점검과 계획 정비 수립하기"
    vi: "Lập kế hoạch kiểm tra và bảo trì định kỳ"
    ms: "Rancang pemeriksaan dan penyelenggaraan berjadual"
    id: "Merencanakan inspeksi dan perawatan terjadwal"
    hi: "निरीक्षण और नियोजित रखरखाव की योजना"
  - en: "Manage leases and service contracts"
    zh: "管理租约和服务合同"
    zh-TW: "管理租約與服務合約"
    ja: "賃貸借とサービス契約を管理する"
    ko: "임대차와 용역 계약 관리하기"
    vi: "Quản lý hợp đồng thuê và dịch vụ"
    ms: "Urus pajakan dan kontrak servis"
    id: "Mengelola sewa dan kontrak layanan"
    hi: "लीज़ और सेवा अनुबंध संभालना"
  - en: "Weigh sustainability risks to a property's value"
    zh: "评估可持续性风险对物业价值的影响"
    zh-TW: "評估永續風險對不動產價值的影響"
    ja: "サステナビリティリスクが価値に与える影響を考える"
    ko: "지속가능성 위험이 자산 가치에 주는 영향 평가"
    vi: "Đánh giá rủi ro bền vững với giá trị tài sản"
    ms: "Nilai risiko kelestarian terhadap nilai hartanah"
    id: "Menilai risiko keberlanjutan bagi nilai properti"
    hi: "संपत्ति मूल्य पर स्थिरता जोखिम आँकना"
