code: PHYC30017
year: 2026
learn:
  en: "How the behaviour of huge numbers of particles explains the laws of thermodynamics."
  zh: "大量粒子的统计行为如何解释热力学定律。"
  zh-TW: "大量粒子的統計行為如何解釋熱力學定律。"
  ja: "膨大な粒子のふるまいから熱力学の法則を説明する方法。"
  ko: "엄청난 수의 입자 행동으로 열역학 법칙을 설명하는 법."
  vi: "Hành vi của vô số hạt giải thích các định luật nhiệt động ra sao."
  ms: "Cara kelakuan zarah yang sangat banyak menjelaskan hukum termodinamik."
  id: "Cara perilaku partikel dalam jumlah besar menjelaskan hukum termodinamika."
  hi: "बहुत सारे कणों का व्यवहार थर्मोडायनामिक्स के नियम कैसे समझाता है।"
outcomes:
  - en: "Calculate quantities with statistical ensembles"
    zh: "用统计系综计算热力学量"
    zh-TW: "用統計系綜計算熱力學量"
    ja: "統計集団で熱力学量を計算する"
    ko: "통계 앙상블로 열역학량 계산하기"
    vi: "Tính đại lượng bằng các tập hợp thống kê"
    ms: "Mengira kuantiti dengan ensembel statistik"
    id: "Menghitung besaran dengan ensemble statistik"
    hi: "स्टैटिस्टिकल एन्सेम्बल से मात्राएँ निकालना"
  - en: "Explain the statistical basis of thermodynamics"
    zh: "解释热力学的统计基础"
    zh-TW: "解釋熱力學的統計基礎"
    ja: "熱力学の統計的基礎を説明する"
    ko: "열역학의 통계적 기초 설명하기"
    vi: "Giải thích cơ sở thống kê của nhiệt động học"
    ms: "Menerangkan asas statistik termodinamik"
    id: "Menjelaskan dasar statistik termodinamika"
    hi: "थर्मोडायनामिक्स का सांख्यिकीय आधार समझाना"
