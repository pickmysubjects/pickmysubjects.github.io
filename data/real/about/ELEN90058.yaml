code: ELEN90058
year: 2027
learn:
  en: "Digital signal processing basics: sampling, Fourier transforms and FIR/IIR filter design, using MATLAB and DSP boards."
  zh: "数字信号处理基础：采样、傅里叶变换和 FIR/IIR 滤波器设计，用 MATLAB 和 DSP 板。"
  zh-TW: "數位訊號處理基礎：取樣、傅立葉轉換與 FIR/IIR 濾波器設計，使用 MATLAB 與 DSP 開發板。"
  ja: "デジタル信号処理の基礎：標本化・フーリエ変換・FIR/IIRフィルタ設計。MATLABとDSPボードを使う。"
  ko: "디지털 신호처리 기초: 샘플링, 푸리에 변환, FIR/IIR 필터 설계. MATLAB과 DSP 보드 사용."
  vi: "Cơ bản xử lý tín hiệu số: lấy mẫu, biến đổi Fourier và thiết kế bộ lọc FIR/IIR, dùng MATLAB và bo DSP."
  ms: "Asas pemprosesan isyarat digital: pensampelan, jelmaan Fourier dan reka bentuk penapis FIR/IIR, dengan MATLAB dan papan DSP."
  id: "Dasar pengolahan sinyal digital: sampling, transformasi Fourier dan desain filter FIR/IIR, dengan MATLAB dan papan DSP."
  hi: "डिजिटल सिग्नल प्रोसेसिंग की मूल बातें: सैंपलिंग, फ़ूरियर ट्रांसफ़ॉर्म और FIR/IIR फ़िल्टर डिज़ाइन, MATLAB और DSP बोर्ड के साथ।"
outcomes:
  - en: "Use frequency-domain tools to analyse signals and systems"
    zh: "用频域方法分析信号与系统"
    zh-TW: "以頻域方法分析訊號與系統"
    ja: "周波数領域の手法で信号とシステムを解析する"
    ko: "주파수 영역 기법으로 신호와 시스템 분석하기"
    vi: "Dùng công cụ miền tần số để phân tích tín hiệu và hệ thống"
    ms: "Menggunakan alat domain frekuensi untuk menganalisis isyarat dan sistem"
    id: "Memakai alat domain frekuensi untuk menganalisis sinyal dan sistem"
    hi: "सिग्नल और सिस्टम के विश्लेषण के लिए फ़्रीक्वेंसी-डोमेन साधनों का उपयोग"
  - en: "Design and test digital filters to a specification"
    zh: "按指标设计并测试数字滤波器"
    zh-TW: "依規格設計並測試數位濾波器"
    ja: "仕様どおりにデジタルフィルタを設計・試験する"
    ko: "사양에 맞춰 디지털 필터 설계·시험하기"
    vi: "Thiết kế và kiểm thử bộ lọc số theo yêu cầu"
    ms: "Mereka bentuk dan menguji penapis digital mengikut spesifikasi"
    id: "Merancang dan menguji filter digital sesuai spesifikasi"
    hi: "विनिर्देश के अनुसार डिजिटल फ़िल्टर डिज़ाइन और परीक्षण"
  - en: "Implement signal processing on DSP boards"
    zh: "在 DSP 开发板上实现信号处理算法"
    zh-TW: "在 DSP 開發板上實作訊號處理演算法"
    ja: "DSPボードに信号処理を実装する"
    ko: "DSP 보드에 신호처리 구현하기"
    vi: "Cài đặt xử lý tín hiệu trên bo DSP"
    ms: "Melaksanakan pemprosesan isyarat pada papan DSP"
    id: "Mengimplementasikan pengolahan sinyal pada papan DSP"
    hi: "DSP बोर्ड पर सिग्नल प्रोसेसिंग लागू करना"
