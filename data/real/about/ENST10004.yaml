code: ENST10004
year: 2026
learn:
  en: "What drives climate change, how it affects food, water, health and nature, and how we adapt and respond."
  zh: "气候变化的成因，它对粮食、水、健康和自然的影响，以及应对方式。"
  zh-TW: "氣候變遷的成因，它對糧食、水、健康和自然的影響，以及因應方式。"
  ja: "気候変動の原因、食料・水・健康・自然への影響、そして適応と対策。"
  ko: "기후변화의 원인, 식량·물·건강·자연에 미치는 영향, 적응과 대응."
  vi: "Nguyên nhân biến đổi khí hậu, tác động đến lương thực, nước, sức khỏe, tự nhiên, và cách ứng phó."
  ms: "Punca perubahan iklim, kesannya pada makanan, air, kesihatan dan alam, serta cara menyesuaikan diri."
  id: "Penyebab perubahan iklim, dampaknya pada pangan, air, kesehatan dan alam, serta cara menanggapinya."
  hi: "जलवायु परिवर्तन के कारण, भोजन, पानी, सेहत और प्रकृति पर असर, और इससे निपटने के तरीके।"
outcomes:
  - en: "Explain the causes of climate change, including human ones"
    zh: "解释气候变化的成因，包括人为因素"
    zh-TW: "解釋氣候變遷的成因，包括人為因素"
    ja: "人為的要因を含め、気候変動の原因を説明する"
    ko: "인간 요인을 포함한 기후변화 원인 설명하기"
    vi: "Giải thích nguyên nhân biến đổi khí hậu, kể cả do con người"
    ms: "Terangkan punca perubahan iklim, termasuk akibat manusia"
    id: "Menjelaskan penyebab perubahan iklim, termasuk ulah manusia"
    hi: "मानवजनित सहित जलवायु परिवर्तन के कारण समझाना"
  - en: "Summarise impacts on food, water, health and ecosystems"
    zh: "总结对粮食、水、健康和生态系统的影响"
    zh-TW: "總結對糧食、水、健康和生態系統的影響"
    ja: "食料・水・健康・生態系への影響をまとめる"
    ko: "식량·물·건강·생태계에 대한 영향 요약하기"
    vi: "Tóm tắt tác động đến lương thực, nước, sức khỏe, hệ sinh thái"
    ms: "Ringkaskan kesan pada makanan, air, kesihatan dan ekosistem"
    id: "Merangkum dampak pada pangan, air, kesehatan dan ekosistem"
    hi: "भोजन, पानी, सेहत और पारिस्थितिकी पर असर का सार देना"
  - en: "Tell adaptation apart from mitigation"
    zh: "区分适应和减缓"
    zh-TW: "區分調適和減緩"
    ja: "適応と緩和の違いを説明する"
    ko: "적응과 완화 구분하기"
    vi: "Phân biệt thích ứng và giảm thiểu"
    ms: "Bezakan penyesuaian dan mitigasi"
    id: "Membedakan adaptasi dan mitigasi"
    hi: "अनुकूलन और शमन में फ़र्क करना"
