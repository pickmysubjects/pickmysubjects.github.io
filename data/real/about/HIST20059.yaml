code: HIST20059
year: 2026
learn:
  en: "US history from the Revolution to 1945, centred on the clash between the promise of freedom and slavery."
  zh: "从独立战争到1945年的美国史，围绕自由的承诺与奴隶制之间的冲突。"
  zh-TW: "從獨立戰爭到1945年的美國史，圍繞自由的承諾與奴隸制之間的衝突。"
  ja: "独立革命から1945年までのアメリカ史を、自由の約束と奴隷制の対立を軸に学ぶ。"
  ko: "독립혁명부터 1945년까지의 미국사를 자유의 약속과 노예제의 충돌을 중심으로 배운다."
  vi: "Lịch sử Mỹ từ Cách mạng đến 1945, xoay quanh mâu thuẫn giữa lời hứa tự do và chế độ nô lệ."
  ms: "Sejarah AS dari Revolusi hingga 1945, berpusat pada pertembungan antara janji kebebasan dan perhambaan."
  id: "Sejarah AS dari Revolusi hingga 1945, berpusat pada benturan antara janji kebebasan dan perbudakan."
  hi: "क्रांति से 1945 तक का अमेरिकी इतिहास, आज़ादी के वादे और गुलामी के टकराव पर केंद्रित।"
outcomes:
  - en: "Discuss major issues in US history to 1945"
    zh: "讨论1945年前美国史的重大问题"
    zh-TW: "討論1945年前美國史的重大問題"
    ja: "1945年までのアメリカ史の主な論点を論じる"
    ko: "1945년까지 미국사의 주요 쟁점 토론하기"
    vi: "Thảo luận các vấn đề lớn của lịch sử Mỹ đến 1945"
    ms: "Bincangkan isu utama sejarah AS hingga 1945"
    id: "Membahas isu utama sejarah AS hingga 1945"
    hi: "1945 तक के अमेरिकी इतिहास के बड़े मुद्दों पर चर्चा करना"
  - en: "Research a US history topic with primary sources"
    zh: "用一手史料研究一个美国史题目"
    zh-TW: "用一手史料研究一個美國史題目"
    ja: "一次史料でアメリカ史のテーマを調べる"
    ko: "1차 사료로 미국사 주제 연구하기"
    vi: "Nghiên cứu một chủ đề lịch sử Mỹ bằng nguồn sơ cấp"
    ms: "Kaji topik sejarah AS dengan sumber primer"
    id: "Meneliti topik sejarah AS dengan sumber primer"
    hi: "प्राथमिक स्रोतों से अमेरिकी इतिहास के किसी विषय पर शोध करना"
  - en: "Evaluate how historians interpret this period"
    zh: "评价历史学家对这一时期的解读"
    zh-TW: "評價歷史學家對這一時期的詮釋"
    ja: "この時代についての歴史家の解釈を評価する"
    ko: "이 시기에 대한 역사가들의 해석 평가하기"
    vi: "Đánh giá cách các sử gia diễn giải giai đoạn này"
    ms: "Nilai tafsiran ahli sejarah tentang zaman ini"
    id: "Menilai tafsiran sejarawan tentang periode ini"
    hi: "इतिहासकार इस दौर की व्याख्या कैसे करते हैं, परखना"
