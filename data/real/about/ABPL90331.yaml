code: ABPL90331
year: 2027
learn:
  en: "Choosing and using AI tools across the construction lifecycle, from design to asset management."
  zh: "在从设计到资产管理的整个建筑生命周期中选择和应用 AI 技术。"
  zh-TW: "在從設計到資產管理的整個營建生命週期中選擇與應用 AI 技術。"
  ja: "設計から資産管理まで、建設のライフサイクル全体で AI を選び活用する。"
  ko: "설계부터 자산 관리까지 건설 전 과정에서 AI 기술을 고르고 활용하기."
  vi: "Chọn và dùng AI trong toàn bộ vòng đời xây dựng, từ thiết kế đến quản lý tài sản."
  ms: "Memilih dan menggunakan AI sepanjang kitaran hayat pembinaan, dari reka bentuk hingga pengurusan aset."
  id: "Memilih dan memakai AI di seluruh siklus konstruksi, dari desain hingga manajemen aset."
  hi: "डिज़ाइन से एसेट मैनेजमेंट तक निर्माण के पूरे चक्र में AI चुनना और उपयोग करना।"
outcomes:
  - en: "Assess and recommend AI solutions for construction"
    zh: "评估并推荐建筑领域的 AI 方案"
    zh-TW: "評估並推薦營建領域的 AI 方案"
    ja: "建設向けの AI ソリューションを評価・提案する"
    ko: "건설 분야 AI 솔루션 평가와 추천하기"
    vi: "Đánh giá và đề xuất giải pháp AI cho xây dựng"
    ms: "Menilai dan mencadangkan penyelesaian AI untuk pembinaan"
    id: "Menilai dan merekomendasikan solusi AI untuk konstruksi"
    hi: "निर्माण के लिए AI समाधानों का आकलन और सुझाव"
  - en: "Explain how AI is changing the construction industry"
    zh: "解释 AI 如何改变建筑行业"
    zh-TW: "解釋 AI 如何改變營建產業"
    ja: "AI が建設業界をどう変えているか説明する"
    ko: "AI가 건설 산업을 어떻게 바꾸는지 설명하기"
    vi: "Giải thích AI đang thay đổi ngành xây dựng thế nào"
    ms: "Menerangkan bagaimana AI mengubah industri pembinaan"
    id: "Menjelaskan bagaimana AI mengubah industri konstruksi"
    hi: "AI निर्माण उद्योग को कैसे बदल रहा है, यह समझाना"
