code: MUSI30032
year: 2026
learn:
  en: "The tools of musicology: libraries, archives, bibliographies, editions, and how to write a research thesis."
  zh: "音乐学研究工具：图书馆、档案、书目、乐谱版本，以及如何写研究论文。"
  zh-TW: "音樂學研究工具：圖書館、檔案、書目、樂譜版本，以及如何寫研究論文。"
  ja: "音楽学の道具：図書館・資料館・文献目録・校訂、研究論文の書き方。"
  ko: "음악학 연구 도구: 도서관·기록보관소·서지·판본, 연구 논문 쓰는 법."
  vi: "Công cụ âm nhạc học: thư viện, lưu trữ, thư mục, ấn bản, cách viết luận văn."
  ms: "Alat muzikologi: perpustakaan, arkib, bibliografi, edisi dan cara menulis tesis."
  id: "Perangkat musikologi: perpustakaan, arsip, bibliografi, edisi, dan cara menulis tesis."
  hi: "संगीतशास्त्र के साधन: पुस्तकालय, अभिलेखागार, ग्रंथसूची, संस्करण, और शोध प्रबंध लिखना।"
outcomes:
  - en: "Find and use music research resources"
    zh: "查找并使用音乐研究资源"
    zh-TW: "查找並使用音樂研究資源"
    ja: "音楽研究の資料を探し使う"
    ko: "음악 연구 자료 찾고 활용하기"
    vi: "Tìm và dùng tài liệu nghiên cứu âm nhạc"
    ms: "Cari dan guna sumber kajian muzik"
    id: "Menemukan dan memakai sumber riset musik"
    hi: "संगीत शोध संसाधन खोजना और उपयोग करना"
  - en: "Build an accurate music bibliography"
    zh: "编写准确的音乐文献目录"
    zh-TW: "編寫準確的音樂文獻目錄"
    ja: "正確な音楽文献目録を作る"
    ko: "정확한 음악 참고문헌 목록 만들기"
    vi: "Lập thư mục âm nhạc chính xác"
    ms: "Bina bibliografi muzik yang tepat"
    id: "Menyusun bibliografi musik yang akurat"
    hi: "सटीक संगीत ग्रंथसूची बनाना"
  - en: "Review current debates in musicology"
    zh: "评述音乐学当前的争论"
    zh-TW: "評述音樂學當前的爭論"
    ja: "音楽学の現在の論点を検討する"
    ko: "음악학의 현재 쟁점 검토하기"
    vi: "Điểm lại các tranh luận hiện nay trong âm nhạc học"
    ms: "Ulas perdebatan semasa dalam muzikologi"
    id: "Meninjau perdebatan terkini musikologi"
    hi: "संगीतशास्त्र की मौजूदा बहसों की समीक्षा करना"
