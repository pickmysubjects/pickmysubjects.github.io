code: ABPL90358
year: 2027
learn:
  en: "Research methods in construction: picking a topic, reviewing literature and designing your own research proposal."
  zh: "建筑领域的研究方法：选题、文献综述和设计自己的研究方案。"
  zh-TW: "建築領域的研究方法：選題、文獻回顧和設計自己的研究方案。"
  ja: "建設分野の研究方法：テーマ選び、文献レビュー、研究計画の作成。"
  ko: "건설 분야 연구 방법: 주제 선정, 문헌 검토, 연구 계획 설계."
  vi: "Phương pháp nghiên cứu xây dựng: chọn đề tài, tổng quan tài liệu và thiết kế đề cương."
  ms: "Kaedah penyelidikan pembinaan: memilih topik, mengkaji literatur dan mereka cadangan kajian."
  id: "Metode riset konstruksi: memilih topik, tinjauan pustaka, dan menyusun proposal riset."
  hi: "निर्माण में शोध पद्धति: विषय चुनना, साहित्य समीक्षा और अपना शोध प्रस्ताव बनाना।"
outcomes:
  - en: "Form research questions and hypotheses"
    zh: "提出研究问题和假设"
    zh-TW: "提出研究問題和假設"
    ja: "研究課題と仮説を立てる"
    ko: "연구 질문과 가설 세우기"
    vi: "Đặt câu hỏi và giả thuyết nghiên cứu"
    ms: "Membentuk soalan kajian dan hipotesis"
    id: "Merumuskan pertanyaan riset dan hipotesis"
    hi: "शोध प्रश्न और परिकल्पना बनाना"
  - en: "Write a literature review"
    zh: "撰写文献综述"
    zh-TW: "撰寫文獻回顧"
    ja: "文献レビューを書く"
    ko: "문헌 검토 쓰기"
    vi: "Viết tổng quan tài liệu"
    ms: "Menulis kajian literatur"
    id: "Menulis tinjauan pustaka"
    hi: "साहित्य समीक्षा लिखना"
