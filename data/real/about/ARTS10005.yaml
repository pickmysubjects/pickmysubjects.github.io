code: ARTS10005
year: 2026
learn:
  en: "How Buddhism grew from a small movement in ancient India into a world religion, with hands-on work on real historical objects."
  zh: "佛教如何从古印度的小运动发展成世界性宗教，还会亲手接触真实的历史文物。"
  zh-TW: "佛教如何從古印度的小運動發展成世界性宗教，還會親手接觸真實的歷史文物。"
  ja: "古代インドの小さな運動だった仏教が世界宗教になるまでを、実際の歴史資料に触れながら学ぶ。"
  ko: "고대 인도의 작은 운동이던 불교가 세계 종교로 성장한 과정을, 실제 유물을 직접 다루며 배운다."
  vi: "Phật giáo phát triển từ một phong trào nhỏ ở Ấn Độ cổ thành tôn giáo thế giới, có thực hành với hiện vật lịch sử thật."
  ms: "Bagaimana agama Buddha berkembang daripada gerakan kecil di India purba menjadi agama dunia, dengan sesi mengendali artifak sebenar."
  id: "Bagaimana agama Buddha tumbuh dari gerakan kecil di India kuno menjadi agama dunia, sambil praktik langsung dengan benda bersejarah asli."
  hi: "बौद्ध धर्म प्राचीन भारत के छोटे आंदोलन से विश्व धर्म कैसे बना, असली ऐतिहासिक वस्तुओं के साथ व्यावहारिक काम के साथ।"
outcomes:
  - en: "Explain the main ideas and history of Buddhism"
    zh: "说明佛教的主要思想和历史"
    zh-TW: "說明佛教的主要思想和歷史"
    ja: "仏教の主な考え方と歴史を説明する"
    ko: "불교의 핵심 사상과 역사 설명하기"
    vi: "Giải thích tư tưởng chính và lịch sử Phật giáo"
    ms: "Terangkan idea utama dan sejarah agama Buddha"
    id: "Menjelaskan ajaran pokok dan sejarah agama Buddha"
    hi: "बौद्ध धर्म के मुख्य विचार और इतिहास समझाना"
  - en: "Discuss the role religion plays in the past and today"
    zh: "讨论宗教在过去和现在的作用"
    zh-TW: "討論宗教在過去和現在的作用"
    ja: "宗教が昔と今の社会で果たす役割を論じる"
    ko: "과거와 현재에 종교가 하는 역할 토론하기"
    vi: "Bàn về vai trò của tôn giáo xưa và nay"
    ms: "Bincangkan peranan agama dahulu dan kini"
    id: "Membahas peran agama di masa lalu dan sekarang"
    hi: "धर्म की भूमिका पर अतीत और आज के संदर्भ में चर्चा करना"
  - en: "Handle and describe historical objects with care"
    zh: "小心地处理和描述历史文物"
    zh-TW: "小心地處理和描述歷史文物"
    ja: "歴史資料を丁寧に扱い、記述する"
    ko: "역사 유물을 조심스럽게 다루고 기술하기"
    vi: "Cầm nắm và mô tả hiện vật lịch sử cẩn thận"
    ms: "Kendali dan huraikan artifak sejarah dengan cermat"
    id: "Menangani dan mendeskripsikan benda bersejarah dengan hati-hati"
    hi: "ऐतिहासिक वस्तुओं को सावधानी से संभालना और उनका वर्णन करना"
