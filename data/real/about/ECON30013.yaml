code: ECON30013
year: 2026
learn:
  en: "Using microeconomics to analyse real government policy, including health, education, tax-transfer and families."
  zh: "用微观经济学分析真实政策：医疗、教育、税收转移和家庭。"
  zh-TW: "用個體經濟學分析真實政策：醫療、教育、稅收移轉和家庭。"
  ja: "ミクロ経済学で実際の政策を分析：医療、教育、税と給付、家族。"
  ko: "미시경제학으로 실제 정책 분석: 보건, 교육, 조세·이전, 가족."
  vi: "Dùng kinh tế vi mô phân tích chính sách thực tế: y tế, giáo dục, thuế–trợ cấp và gia đình."
  ms: "Guna mikroekonomi untuk analisis dasar kerajaan sebenar: kesihatan, pendidikan, cukai-pindahan dan keluarga."
  id: "Memakai mikroekonomi untuk menganalisis kebijakan nyata: kesehatan, pendidikan, pajak-transfer, dan keluarga."
  hi: "असली सरकारी नीतियों का माइक्रोइकोनॉमिक्स से विश्लेषण: स्वास्थ्य, शिक्षा, टैक्स-ट्रांसफ़र और परिवार।"
outcomes:
  - en: "Apply micro principles to policy design"
    zh: "把微观原理用于政策设计"
    zh-TW: "把個體經濟原理用於政策設計"
    ja: "ミクロの原理を政策設計に応用する"
    ko: "미시 원리를 정책 설계에 적용하기"
    vi: "Áp dụng nguyên lý vi mô vào thiết kế chính sách"
    ms: "Guna prinsip mikro dalam reka bentuk dasar"
    id: "Menerapkan prinsip mikro dalam desain kebijakan"
    hi: "नीति बनाने में माइक्रो सिद्धांत लागू करना"
  - en: "Measure inequality and poverty, and judge redistribution"
    zh: "衡量不平等和贫困，评估再分配"
    zh-TW: "衡量不平等和貧窮，評估重分配"
    ja: "不平等と貧困を測り、再分配を評価する"
    ko: "불평등과 빈곤을 측정하고 재분배 평가하기"
    vi: "Đo lường bất bình đẳng, nghèo đói và đánh giá tái phân phối"
    ms: "Ukur ketaksamaan dan kemiskinan, serta nilai pengagihan semula"
    id: "Mengukur ketimpangan dan kemiskinan, serta menilai redistribusi"
    hi: "असमानता और गरीबी मापना, पुनर्वितरण का आकलन करना"
  - en: "Critique current debates on health, schooling and family"
    zh: "评析医疗、教育和家庭政策的辩论"
    zh-TW: "評析醫療、教育和家庭政策的論辯"
    ja: "医療・教育・家族をめぐる議論を批判的に検討する"
    ko: "보건·교육·가족 정책 논쟁 비판적으로 검토하기"
    vi: "Phân tích phản biện các tranh luận về y tế, giáo dục và gia đình"
    ms: "Kritik perdebatan semasa tentang kesihatan, sekolah dan keluarga"
    id: "Mengkritisi perdebatan soal kesehatan, sekolah, dan keluarga"
    hi: "स्वास्थ्य, शिक्षा और परिवार पर चल रही बहसों की समीक्षा करना"
