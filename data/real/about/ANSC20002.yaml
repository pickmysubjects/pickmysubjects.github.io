code: ANSC20002
year: 2026
learn:
  en: "What different mammals need to eat, how they digest it, and how to build a balanced diet for them."
  zh: "不同哺乳动物的营养需求、消化方式，以及如何配平衡饲料。"
  zh-TW: "不同哺乳動物的營養需求、消化方式，以及如何調配均衡飼料。"
  ja: "哺乳類ごとの栄養の必要量と消化、バランスのよい餌の組み方。"
  ko: "여러 포유류에게 필요한 영양과 소화, 균형 잡힌 사료 짜는 법."
  vi: "Các loài thú cần ăn gì, tiêu hóa ra sao và cách lập khẩu phần cân bằng."
  ms: "Keperluan pemakanan pelbagai mamalia, cara ia dicerna dan cara menyusun diet seimbang."
  id: "Kebutuhan gizi berbagai mamalia, cara mencernanya, dan cara menyusun pakan seimbang."
  hi: "अलग-अलग स्तनधारियों का पोषण, पाचन और उनके लिए संतुलित आहार कैसे बनाएँ।"
outcomes:
  - en: "Formulate a balanced ration for an animal"
    zh: "为动物配制平衡日粮"
    zh-TW: "為動物調配均衡日糧"
    ja: "動物向けにバランスのよい飼料を設計する"
    ko: "동물용 균형 사료 배합하기"
    vi: "Lập khẩu phần cân bằng cho vật nuôi"
    ms: "Rumus catuan seimbang untuk haiwan"
    id: "Menyusun ransum seimbang untuk hewan"
    hi: "जानवर के लिए संतुलित राशन बनाना"
  - en: "Spot and diagnose nutritional imbalances"
    zh: "识别并诊断营养失衡"
    zh-TW: "辨識並診斷營養失衡"
    ja: "栄養の偏りを見つけて診断する"
    ko: "영양 불균형 찾아내고 진단하기"
    vi: "Nhận biết và chẩn đoán mất cân bằng dinh dưỡng"
    ms: "Kenal pasti dan diagnos ketidakseimbangan nutrisi"
    id: "Mengenali dan mendiagnosis ketidakseimbangan gizi"
    hi: "पोषण असंतुलन पहचानना और जाँचना"
  - en: "Use computer models to solve nutrition problems"
    zh: "用电脑模型解决营养问题"
    zh-TW: "用電腦模型解決營養問題"
    ja: "コンピュータモデルで栄養の問題を解く"
    ko: "컴퓨터 모델로 영양 문제 풀기"
    vi: "Dùng mô hình máy tính giải bài toán dinh dưỡng"
    ms: "Guna model komputer untuk selesaikan masalah nutrisi"
    id: "Memakai model komputer untuk masalah gizi"
    hi: "कंप्यूटर मॉडल से पोषण की समस्याएँ हल करना"
