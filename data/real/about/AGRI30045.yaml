code: AGRI30045
year: 2026
learn:
  en: "Using tech and data to manage each paddock, crop or animal precisely, in cropping, horticulture and livestock."
  zh: "用技术和数据精准管理每块田、作物或牲畜。"
  zh-TW: "用科技和數據精準管理每塊田、作物或牲畜。"
  ja: "技術とデータで圃場・作物・家畜ごとに精密管理する。"
  ko: "기술과 데이터로 필지·작물·가축별 정밀 관리하기."
  vi: "Dùng công nghệ và dữ liệu để quản lý chính xác từng ô ruộng, cây trồng hay vật nuôi."
  ms: "Guna teknologi dan data untuk urus setiap petak, tanaman atau haiwan dengan tepat."
  id: "Memakai teknologi dan data untuk mengelola tiap lahan, tanaman, atau ternak secara presisi."
  hi: "तकनीक और डेटा से हर खेत, फसल या पशु का सटीक प्रबंधन।"
outcomes:
  - en: "Use software to apply precision agriculture"
    zh: "用软件实践精准农业"
    zh-TW: "用軟體實踐精準農業"
    ja: "ソフトで精密農業を実践する"
    ko: "소프트웨어로 정밀농업 적용하기"
    vi: "Dùng phần mềm áp dụng nông nghiệp chính xác"
    ms: "Guna perisian untuk pertanian tepat"
    id: "Memakai software untuk pertanian presisi"
    hi: "सॉफ़्टवेयर से प्रिसिजन खेती लागू करें"
  - en: "Explain precision ag in crops and livestock"
    zh: "解释精准农业在种植和畜牧中的应用"
    zh-TW: "解釋精準農業在種植與畜牧的應用"
    ja: "作物・畜産での精密農業を説明する"
    ko: "작물·축산의 정밀농업 설명하기"
    vi: "Giải thích nông nghiệp chính xác trong trồng trọt, chăn nuôi"
    ms: "Terangkan pertanian tepat dalam tanaman dan ternakan"
    id: "Menjelaskan pertanian presisi di tanaman dan ternak"
    hi: "फसल और पशुपालन में प्रिसिजन खेती समझाएँ"
  - en: "Discuss what drives farmers to adopt new tech"
    zh: "讨论影响农户采用新技术的因素"
    zh-TW: "討論影響農民採用新技術的因素"
    ja: "新技術導入を左右する要因を論じる"
    ko: "새 기술 도입 요인 논의하기"
    vi: "Thảo luận yếu tố khiến nông dân dùng công nghệ mới"
    ms: "Bincang faktor petani guna teknologi baharu"
    id: "Membahas faktor adopsi teknologi baru oleh petani"
    hi: "किसान नई तकनीक क्यों अपनाते हैं, चर्चा करें"
