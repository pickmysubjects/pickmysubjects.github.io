code: SOCI30016
year: 2026
learn:
  en: "Using sociology to ask what makes societies sustainable, through a group project shared with a public audience."
  zh: "用社会学探讨怎样的社会才可持续，并通过小组项目向公众展示。"
  zh-TW: "用社會學探討怎樣的社會才能永續，並透過小組專題向大眾展示。"
  ja: "社会学を使って持続可能な社会とは何かを考え、グループ課題で一般向けに発信する。"
  ko: "사회학으로 지속 가능한 사회의 조건을 묻고, 팀 프로젝트로 대중에게 전달한다."
  vi: "Dùng xã hội học để hỏi điều gì làm xã hội bền vững, qua một dự án nhóm chia sẻ với công chúng."
  ms: "Menggunakan sosiologi untuk bertanya apa yang menjadikan masyarakat lestari, melalui projek kumpulan untuk khalayak umum."
  id: "Memakai sosiologi untuk bertanya apa yang membuat masyarakat berkelanjutan, lewat proyek kelompok untuk publik."
  hi: "समाजशास्त्र से यह पूछना कि समाज टिकाऊ कैसे बनते हैं, एक समूह प्रोजेक्ट के ज़रिए जिसे आम लोगों से साझा किया जाता है।"
outcomes:
  - en: "Apply sociological theory to sustainability"
    zh: "把社会学理论用于可持续议题"
    zh-TW: "把社會學理論用於永續議題"
    ja: "社会学理論を持続可能性に当てはめる"
    ko: "사회학 이론을 지속가능성에 적용하기"
    vi: "Áp dụng lý thuyết xã hội học vào tính bền vững"
    ms: "Gunakan teori sosiologi pada kelestarian"
    id: "Menerapkan teori sosiologi pada keberlanjutan"
    hi: "टिकाऊपन पर समाजशास्त्रीय सिद्धांत लागू करना"
  - en: "Co-design a group project on sustainable futures"
    zh: "共同设计关于可持续未来的小组项目"
    zh-TW: "共同設計關於永續未來的小組專題"
    ja: "持続可能な未来についてのグループ課題を共に作る"
    ko: "지속 가능한 미래에 관한 팀 프로젝트 함께 설계하기"
    vi: "Cùng thiết kế dự án nhóm về tương lai bền vững"
    ms: "Reka bersama projek kumpulan tentang masa depan lestari"
    id: "Merancang bersama proyek kelompok tentang masa depan berkelanjutan"
    hi: "टिकाऊ भविष्य पर समूह प्रोजेक्ट मिलकर बनाना"
  - en: "Explain sociological ideas to a general audience"
    zh: "向普通大众解释社会学观点"
    zh-TW: "向一般大眾解釋社會學觀點"
    ja: "社会学の考えを一般の人に伝える"
    ko: "사회학 개념을 일반 대중에게 설명하기"
    vi: "Giải thích ý tưởng xã hội học cho công chúng"
    ms: "Terangkan idea sosiologi kepada orang awam"
    id: "Menjelaskan gagasan sosiologi kepada masyarakat umum"
    hi: "समाजशास्त्रीय विचार आम लोगों को समझाना"
