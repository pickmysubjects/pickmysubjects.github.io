code: ELEN20005
year: 2026
learn:
  en: "Analysing DC and AC circuits, power systems and op-amps, with hands-on breadboard labs and simulation."
  zh: "分析直流/交流电路、电力系统和运放，配合面包板实验与仿真。"
  zh-TW: "分析直流/交流電路、電力系統與運算放大器，搭配麵包板實驗與模擬。"
  ja: "直流・交流回路、電力系統、オペアンプの解析を、ブレッドボード実習とシミュレーションで。"
  ko: "직류·교류 회로, 전력 시스템, 연산증폭기 해석을 브레드보드 실습과 시뮬레이션으로."
  vi: "Phân tích mạch DC, AC, hệ thống điện và op-amp, có thực hành breadboard và mô phỏng."
  ms: "Menganalisis litar AT dan AU, sistem kuasa dan op-amp, dengan amali papan roti dan simulasi."
  id: "Menganalisis rangkaian DC dan AC, sistem tenaga listrik, dan op-amp, dengan praktikum breadboard dan simulasi."
  hi: "DC और AC सर्किट, पावर सिस्टम और ऑप-एम्प का विश्लेषण, ब्रेडबोर्ड लैब और सिमुलेशन के साथ।"
outcomes:
  - en: "Analyse electrical circuits from first principles"
    zh: "从基本原理分析电路"
    zh-TW: "從基本原理分析電路"
    ja: "基本原理から回路を解析する"
    ko: "기본 원리로 회로 분석하기"
    vi: "Phân tích mạch điện từ nguyên lý cơ bản"
    ms: "Menganalisis litar elektrik dari prinsip asas"
    id: "Menganalisis rangkaian listrik dari prinsip dasar"
    hi: "मूल सिद्धांतों से विद्युत सर्किट का विश्लेषण करना"
  - en: "Build and debug circuits on a breadboard"
    zh: "在面包板上搭建并调试电路"
    zh-TW: "在麵包板上搭建並除錯電路"
    ja: "ブレッドボードで回路を組みデバッグする"
    ko: "브레드보드로 회로 만들고 디버그하기"
    vi: "Lắp và gỡ lỗi mạch trên breadboard"
    ms: "Membina dan nyahpepijat litar di papan roti"
    id: "Merakit dan men-debug rangkaian di breadboard"
    hi: "ब्रेडबोर्ड पर सर्किट बनाना और डिबग करना"
  - en: "Compare lab results with simulations"
    zh: "比较实测结果与仿真"
    zh-TW: "比較實測結果與模擬"
    ja: "実測とシミュレーションを比較する"
    ko: "실측 결과와 시뮬레이션 비교하기"
    vi: "So sánh kết quả thí nghiệm với mô phỏng"
    ms: "Membandingkan keputusan makmal dengan simulasi"
    id: "Membandingkan hasil lab dengan simulasi"
    hi: "लैब परिणामों की सिमुलेशन से तुलना करना"
