code: MUSI30297
year: 2027
learn:
  en: "Builds on Conducting 1 with harder scores, clearer expressive gesture and leading rehearsals."
  zh: "在指挥 1 的基础上，处理更难的总谱，手势更有表现力，并学习带排练。"
  zh-TW: "在指揮 1 的基礎上，處理更難的總譜，手勢更有表現力，並學習帶排練。"
  ja: "指揮1を発展させ、より難しいスコア、表現力ある動き、リハーサルの進行を学ぶ。"
  ko: "지휘 1을 바탕으로 더 어려운 악보, 표현력 있는 제스처, 리허설 이끌기를 배움."
  vi: "Nâng cao từ Chỉ huy 1: tổng phổ khó hơn, cử chỉ biểu cảm rõ hơn và dẫn dắt buổi tập."
  ms: "Lanjutan Conducting 1: skor lebih sukar, isyarat lebih ekspresif dan memimpin latihan."
  id: "Lanjutan Conducting 1: partitur lebih sulit, gestur lebih ekspresif, dan memimpin latihan."
  hi: "कंडक्टिंग 1 के आगे: कठिन स्कोर, अधिक भावपूर्ण इशारे और रिहर्सल का नेतृत्व।"
outcomes:
  - en: "Conduct with expressive, efficient gesture"
    zh: "用有表现力且高效的手势指挥"
    zh-TW: "用有表現力且有效率的手勢指揮"
    ja: "表現豊かで無駄のない動きで指揮する"
    ko: "표현력 있고 효율적인 제스처로 지휘하기"
    vi: "Chỉ huy bằng cử chỉ biểu cảm, hiệu quả"
    ms: "Pimpin dengan isyarat ekspresif dan cekap"
    id: "Memimpin dengan gestur ekspresif dan efisien"
    hi: "भावपूर्ण व सटीक इशारों से कंडक्ट करना"
  - en: "Analyse complex scores to guide interpretation"
    zh: "分析复杂总谱来指导诠释"
    zh-TW: "分析複雜總譜來引導詮釋"
    ja: "複雑なスコアを分析して解釈に生かす"
    ko: "복잡한 악보 분석으로 해석 이끌기"
    vi: "Phân tích tổng phổ phức tạp để định hướng diễn giải"
    ms: "Analisis skor kompleks untuk panduan tafsiran"
    id: "Menganalisis partitur kompleks untuk interpretasi"
    hi: "जटिल स्कोर का विश्लेषण कर व्याख्या तय करना"
  - en: "Plan, lead and review rehearsals"
    zh: "规划、带领和评估排练"
    zh-TW: "規劃、帶領和評估排練"
    ja: "リハーサルを計画・進行・評価する"
    ko: "리허설 계획, 진행, 평가하기"
    vi: "Lên kế hoạch, dẫn dắt và đánh giá buổi tập"
    ms: "Rancang, pimpin dan nilai latihan"
    id: "Merencanakan, memimpin, dan mengevaluasi latihan"
    hi: "रिहर्सल की योजना, नेतृत्व और समीक्षा"
