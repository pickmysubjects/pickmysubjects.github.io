code: ENEN30002
year: 2026
learn:
  en: "How to share scarce water between farms, cities, industry and nature across a whole river basin."
  zh: "如何在整个流域里把稀缺的水分给农业、城市、工业和生态。"
  zh-TW: "如何在整個流域裡把稀缺的水分給農業、城市、工業和生態。"
  ja: "流域全体で限られた水を農業・都市・産業・自然にどう配分するか。"
  ko: "유역 전체에서 부족한 물을 농업·도시·산업·자연에 어떻게 나눌지."
  vi: "Cách chia nguồn nước khan hiếm cho nông nghiệp, đô thị, công nghiệp và tự nhiên trong cả lưu vực."
  ms: "Cara membahagi air yang terhad antara ladang, bandar, industri dan alam di seluruh lembangan sungai."
  id: "Cara membagi air yang langka untuk pertanian, kota, industri, dan alam di seluruh daerah aliran sungai."
  hi: "पूरे नदी बेसिन में कम पानी को खेती, शहर, उद्योग और प्रकृति में कैसे बाँटें।"
outcomes:
  - en: "Allocate water between uses when it's scarce"
    zh: "缺水时在不同用途间分配水"
    zh-TW: "缺水時在不同用途間分配水"
    ja: "水不足時に用途間で水を配分する"
    ko: "물이 부족할 때 용도별로 배분한다"
    vi: "Phân bổ nước giữa các nhu cầu khi khan hiếm"
    ms: "Agihkan air antara kegunaan ketika terhad"
    id: "Mengalokasikan air antarkebutuhan saat langka"
    hi: "कमी में पानी को अलग उपयोगों में बाँटना"
  - en: "Weigh economic growth against ecological health"
    zh: "权衡经济发展与生态健康"
    zh-TW: "權衡經濟發展與生態健康"
    ja: "経済発展と生態系の健全さを比較検討する"
    ko: "경제 발전과 생태 건강을 저울질한다"
    vi: "Cân nhắc phát triển kinh tế với sinh thái"
    ms: "Timbang pembangunan ekonomi dan kesihatan ekologi"
    id: "Menimbang pembangunan ekonomi dan kesehatan ekologi"
    hi: "आर्थिक विकास और पारिस्थितिक सेहत में संतुलन बनाना"
