code: EDUC20086
year: 2026
learn:
  en: "How drama and theatre activities support young people's wellbeing, through hands-on workshops and current research."
  zh: "通过实践工作坊和研究，了解戏剧如何促进青少年身心健康。"
  zh-TW: "透過實作工作坊和研究，了解戲劇如何促進青少年身心健康。"
  ja: "実践ワークショップと研究から、演劇が若者のウェルビーイングをどう支えるかを学ぶ。"
  ko: "실습 워크숍과 연구를 통해 연극이 청소년 웰빙을 돕는 방법 배우기."
  vi: "Kịch và sân khấu hỗ trợ sức khỏe tinh thần người trẻ ra sao, qua thực hành và nghiên cứu."
  ms: "Cara aktiviti drama menyokong kesejahteraan belia, melalui bengkel amali dan kajian terkini."
  id: "Cara kegiatan drama mendukung kesejahteraan anak muda, lewat lokakarya praktik dan riset terkini."
  hi: "ड्रामा और थिएटर गतिविधियाँ युवाओं की भलाई में कैसे मदद करती हैं, वर्कशॉप और शोध के ज़रिए।"
outcomes:
  - en: "Evaluate drama programs with a wellbeing focus"
    zh: "评估以身心健康为重点的戏剧项目"
    zh-TW: "評估以身心健康為重點的戲劇方案"
    ja: "ウェルビーイング重視の演劇プログラムを評価する"
    ko: "웰빙 중심 연극 프로그램 평가하기"
    vi: "Đánh giá chương trình kịch hướng tới sức khỏe tinh thần"
    ms: "Nilai program drama berfokus kesejahteraan"
    id: "Mengevaluasi program drama berfokus kesejahteraan"
    hi: "वेलबीइंग पर केंद्रित ड्रामा कार्यक्रमों का मूल्यांकन"
  - en: "Present how drama teaching can promote wellbeing"
    zh: "展示戏剧教学如何促进身心健康"
    zh-TW: "展示戲劇教學如何促進身心健康"
    ja: "演劇教育がウェルビーイングを高める方法を発表する"
    ko: "연극 교육이 웰빙을 높이는 방법 발표하기"
    vi: "Trình bày cách dạy kịch thúc đẩy sức khỏe tinh thần"
    ms: "Bentangkan cara pengajaran drama memupuk kesejahteraan"
    id: "Mempresentasikan cara pengajaran drama mendukung kesejahteraan"
    hi: "ड्रामा शिक्षण से वेलबीइंग कैसे बढ़ती है, प्रस्तुत करना"
  - en: "Reflect on how drama supports your own wellbeing"
    zh: "反思戏剧如何帮助自己的身心健康"
    zh-TW: "反思戲劇如何幫助自己的身心健康"
    ja: "演劇が自分のウェルビーイングをどう支えるか振り返る"
    ko: "연극이 내 웰빙에 주는 도움 성찰하기"
    vi: "Suy ngẫm kịch giúp sức khỏe tinh thần bản thân ra sao"
    ms: "Renungkan cara drama menyokong kesejahteraan sendiri"
    id: "Merefleksikan cara drama mendukung kesejahteraan sendiri"
    hi: "ड्रामा आपकी अपनी भलाई में कैसे मदद करता है, विचार करना"
