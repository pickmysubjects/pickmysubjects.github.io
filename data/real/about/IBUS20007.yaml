code: IBUS20007
year: 2026
learn:
  en: "Two-week business study tour overseas: lectures at a partner university, company visits and cultural activities, then a group pitch."
  zh: "为期两周的海外商务游学：在合作大学听课、参观企业、参加文化活动，回来做小组展示"
  zh-TW: "為期兩週的海外商務遊學：在合作大學聽課、參訪企業、參加文化活動，回來做小組簡報"
  ja: "2週間の海外ビジネス研修。提携大学での講義、企業訪問、文化体験のあと、グループ発表を行う。"
  ko: "2주간 해외 비즈니스 연수: 협력 대학 강의, 기업 방문, 문화 활동 후 그룹 발표."
  vi: "Chuyến học kinh doanh 2 tuần ở nước ngoài: học ở trường đối tác, thăm doanh nghiệp, hoạt động văn hóa, thuyết trình nhóm."
  ms: "Lawatan sambil belajar perniagaan 2 minggu: kuliah di universiti rakan, lawatan syarikat, aktiviti budaya, pembentangan."
  id: "Tur studi bisnis 2 minggu di luar negeri: kuliah di kampus mitra, kunjungan perusahaan, budaya, lalu presentasi kelompok."
  hi: "दो हफ़्ते का विदेशी बिज़नेस स्टडी टूर: साझेदार विश्वविद्यालय में लेक्चर, कंपनी विज़िट, सांस्कृतिक गतिविधियाँ, फिर ग्रुप प्रस्तुति।"
outcomes:
  - en: "Understand how business works in the region you visit"
    zh: "了解所到地区的商业运作方式"
    zh-TW: "了解所到地區的商業運作方式"
    ja: "訪問地域でのビジネスの仕組みを理解する"
    ko: "방문 지역의 비즈니스 방식 이해하기"
    vi: "Hiểu cách kinh doanh vận hành ở nơi đến"
    ms: "Memahami cara perniagaan berjalan di rantau dilawati"
    id: "Memahami cara bisnis berjalan di wilayah yang dikunjungi"
    hi: "जिस क्षेत्र में जाएँ वहाँ व्यापार कैसे चलता है समझना"
  - en: "See how culture shapes the way organisations work"
    zh: "看到文化如何影响组织的运作"
    zh-TW: "看到文化如何影響組織的運作"
    ja: "文化が組織のあり方に与える影響を知る"
    ko: "문화가 조직 운영에 미치는 영향 이해하기"
    vi: "Thấy văn hóa ảnh hưởng thế nào đến tổ chức"
    ms: "Melihat cara budaya membentuk organisasi"
    id: "Melihat bagaimana budaya membentuk cara kerja organisasi"
    hi: "देखना कि संस्कृति संगठनों के काम को कैसे प्रभावित करती है"
  - en: "Research, reflect and present what you learned"
    zh: "调研、反思并展示所学"
    zh-TW: "調研、反思並發表所學"
    ja: "調べ、振り返り、学んだことを発表する"
    ko: "조사하고 성찰하며 배운 것 발표하기"
    vi: "Nghiên cứu, suy ngẫm và trình bày điều đã học"
    ms: "Membuat kajian, refleksi dan membentang apa dipelajari"
    id: "Meneliti, merefleksikan, dan mempresentasikan hasil belajar"
    hi: "शोध, चिंतन और सीखी बातों की प्रस्तुति करना"
