code: CVEN90047
year: 2027
learn:
  en: "A one-semester infrastructure research capstone, solo or in a group: research training, then a project shown as a paper, poster and talk."
  zh: "一学期的基础设施工程研究毕业项目，可单人或分组：先学研究方法，再做项目并写论文、做海报和演讲。"
  zh-TW: "一學期的基礎設施工程研究畢業專題，可個人或分組：先學研究方法，再做專題並寫論文、做海報與簡報。"
  ja: "1学期のインフラ工学研究キャップストーン。個人またはグループで、研究手法を学んだ後に課題を進め、論文・ポスター・発表で示す。"
  ko: "한 학기 인프라 공학 연구 캡스톤(개인 또는 팀): 연구 방법을 익힌 뒤 프로젝트를 논문, 포스터, 발표로 정리."
  vi: "Đồ án nghiên cứu tốt nghiệp kỹ thuật hạ tầng trong một học kỳ, cá nhân hoặc nhóm: học phương pháp rồi làm dự án, trình bày bằng bài báo, poster và thuyết trình."
  ms: "Projek akhir penyelidikan kejuruteraan infrastruktur satu semester, individu atau berkumpulan: latihan penyelidikan, kemudian projek dibentang melalui kertas, poster dan ceramah."
  id: "Capstone riset teknik infrastruktur satu semester, sendiri atau berkelompok: pelatihan riset, lalu proyek yang disajikan lewat makalah, poster, dan presentasi."
  hi: "एक सेमेस्टर का इंफ्रास्ट्रक्चर इंजीनियरिंग रिसर्च कैपस्टोन, अकेले या समूह में: पहले रिसर्च प्रशिक्षण, फिर पेपर, पोस्टर और प्रस्तुति के साथ प्रोजेक्ट।"
outcomes:
  - en: "Form a hypothesis and plan how to test it"
    zh: "提出假设并设计检验方法"
    zh-TW: "提出假設並設計檢驗方法"
    ja: "仮説を立て、検証方法を計画する"
    ko: "가설을 세우고 검증 방법 설계하기"
    vi: "Đặt giả thuyết và lên cách kiểm chứng"
    ms: "Membina hipotesis dan merancang cara mengujinya"
    id: "Menyusun hipotesis dan merancang cara mengujinya"
    hi: "परिकल्पना बनाना और उसे जांचने की योजना"
  - en: "Analyse data or run computer models"
    zh: "分析数据或做计算机建模"
    zh-TW: "分析資料或進行電腦建模"
    ja: "データ分析やコンピュータモデリングを行う"
    ko: "데이터 분석이나 컴퓨터 모델링 수행하기"
    vi: "Phân tích dữ liệu hoặc chạy mô hình máy tính"
    ms: "Menganalisis data atau menjalankan model komputer"
    id: "Menganalisis data atau menjalankan model komputer"
    hi: "डेटा विश्लेषण या कंप्यूटर मॉडलिंग करना"
  - en: "Present findings as a paper, poster and talk"
    zh: "以论文、海报和演讲呈现成果"
    zh-TW: "以論文、海報與簡報呈現成果"
    ja: "論文・ポスター・口頭発表で成果を示す"
    ko: "논문, 포스터, 발표로 결과 전달하기"
    vi: "Trình bày kết quả bằng bài báo, poster và thuyết trình"
    ms: "Membentangkan dapatan melalui kertas, poster dan ceramah"
    id: "Menyajikan temuan lewat makalah, poster, dan presentasi"
    hi: "नतीजे पेपर, पोस्टर और प्रस्तुति में रखना"
