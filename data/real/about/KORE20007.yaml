code: KORE20007
year: 2026
learn:
  en: "The Korean wave, K-pop, K-dramas and fandom, and the politics, policy and business behind Korean pop culture."
  zh: "韩流、K-pop、韩剧和粉丝文化，以及韩国流行文化背后的政治、政策和产业。"
  zh-TW: "韓流、K-pop、韓劇和粉絲文化，以及韓國流行文化背後的政治、政策和產業。"
  ja: "韓流、K-POP、韓国ドラマ、ファン文化と、その裏にある政治・政策・産業を学ぶ。"
  ko: "한류, K팝, K드라마, 팬덤과 한국 대중문화 뒤의 정치·정책·산업을 배운다."
  vi: "Làn sóng Hàn Quốc, K-pop, phim Hàn, văn hóa fan và chính trị, chính sách, ngành nghề đằng sau văn hóa đại chúng Hàn."
  ms: "Gelombang Korea, K-pop, drama Korea dan peminat, serta politik, dasar dan industri di sebalik budaya pop Korea."
  id: "Gelombang Korea, K-pop, drama Korea, dan fandom, serta politik, kebijakan, dan industri di balik budaya pop Korea."
  hi: "कोरियाई लहर, K-pop, K-ड्रामा और फैनडम, और कोरियाई पॉप संस्कृति के पीछे की राजनीति, नीति और उद्योग।"
outcomes:
  - en: "Explain how the Korean wave spread globally"
    zh: "解释韩流如何传播到全球"
    zh-TW: "解釋韓流如何傳播到全球"
    ja: "韓流が世界にどう広がったか説明する"
    ko: "한류가 세계로 퍼진 과정 설명하기"
    vi: "Giải thích làn sóng Hàn lan ra toàn cầu thế nào"
    ms: "Terangkan cara gelombang Korea tersebar ke seluruh dunia"
    id: "Menjelaskan cara gelombang Korea menyebar ke dunia"
    hi: "कोरियाई लहर दुनिया भर में कैसे फैली, समझाना"
  - en: "Analyse fandom and celebrity culture"
    zh: "分析粉丝与明星文化"
    zh-TW: "分析粉絲與明星文化"
    ja: "ファンとセレブの文化を分析する"
    ko: "팬덤과 스타 문화 분석하기"
    vi: "Phân tích văn hóa fan và người nổi tiếng"
    ms: "Analisis budaya peminat dan selebriti"
    id: "Menganalisis budaya fandom dan selebritas"
    hi: "फैनडम और सेलिब्रिटी संस्कृति का विश्लेषण करना"
  - en: "Link pop culture to policy and politics"
    zh: "把流行文化与政策和政治联系起来"
    zh-TW: "把流行文化與政策和政治聯繫起來"
    ja: "ポップカルチャーを政策や政治と結びつける"
    ko: "대중문화를 정책·정치와 연결하기"
    vi: "Liên hệ văn hóa đại chúng với chính sách và chính trị"
    ms: "Kaitkan budaya pop dengan dasar dan politik"
    id: "Mengaitkan budaya pop dengan kebijakan dan politik"
    hi: "पॉप संस्कृति को नीति और राजनीति से जोड़ना"
