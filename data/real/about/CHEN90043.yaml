code: CHEN90043
year: 2027
learn:
  en: "How atomic structure and processing shape material properties, covering metals, polymers and ceramics such as zirconia."
  zh: "原子结构和加工如何决定材料性能，涵盖金属、聚合物和氧化锆等陶瓷。"
  zh-TW: "原子結構和加工如何決定材料性能，涵蓋金屬、聚合物和氧化鋯等陶瓷。"
  ja: "原子構造と加工が材料特性をどう決めるか。金属、高分子、ジルコニアなどのセラミックス。"
  ko: "원자 구조와 가공이 재료 특성을 좌우하는 방식, 금속·고분자·지르코니아 등 세라믹."
  vi: "Cấu trúc nguyên tử và gia công quyết định tính chất vật liệu, gồm kim loại, polyme và gốm như zirconia."
  ms: "Bagaimana struktur atom dan pemprosesan membentuk sifat bahan, meliputi logam, polimer dan seramik seperti zirkonia."
  id: "Bagaimana struktur atom dan pemrosesan membentuk sifat material: logam, polimer, dan keramik seperti zirkonia."
  hi: "परमाणु संरचना और प्रसंस्करण से पदार्थ गुण कैसे बनते हैं, धातु, पॉलिमर और ज़िरकोनिया जैसे सिरेमिक सहित।"
outcomes:
  - en: "Predict material properties from structure and processing"
    zh: "根据结构和加工预测材料性能"
    zh-TW: "根據結構和加工預測材料性能"
    ja: "構造と加工から材料特性を予測する"
    ko: "구조와 가공으로 재료 특성 예측하기"
    vi: "Dự đoán tính chất vật liệu từ cấu trúc và gia công"
    ms: "Meramal sifat bahan daripada struktur dan pemprosesan"
    id: "Memprediksi sifat material dari struktur dan pemrosesan"
    hi: "संरचना और प्रसंस्करण से पदार्थ गुणों का अनुमान"
  - en: "Select materials for engineering design"
    zh: "为工程设计选择合适材料"
    zh-TW: "為工程設計選擇合適材料"
    ja: "工学設計に合う材料を選ぶ"
    ko: "공학 설계에 맞는 재료 선택하기"
    vi: "Chọn vật liệu cho thiết kế kỹ thuật"
    ms: "Memilih bahan untuk reka bentuk kejuruteraan"
    id: "Memilih material untuk desain teknik"
    hi: "इंजीनियरिंग डिज़ाइन के लिए सामग्री चुनना"
