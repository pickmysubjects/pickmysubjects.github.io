code: COMP90089
year: 2027
learn:
  en: "Applying machine learning to clinical data such as electronic health records, and the challenges that brings."
  zh: "将机器学习应用于电子病历等临床数据，以及其中的挑战。"
  zh-TW: "將機器學習應用於電子病歷等臨床資料，以及其中的挑戰。"
  ja: "電子カルテなどの臨床データへの機械学習の応用とその課題。"
  ko: "전자의무기록 같은 임상 데이터에 기계학습 적용과 그 과제."
  vi: "Áp dụng học máy cho dữ liệu lâm sàng như hồ sơ sức khỏe điện tử, và các thách thức."
  ms: "Menggunakan pembelajaran mesin pada data klinikal seperti rekod kesihatan elektronik, serta cabarannya."
  id: "Menerapkan pembelajaran mesin pada data klinis seperti rekam medis elektronik, dan tantangannya."
  hi: "इलेक्ट्रॉनिक हेल्थ रिकॉर्ड जैसे क्लिनिकल डेटा पर मशीन लर्निंग और उसकी चुनौतियाँ।"
outcomes:
  - en: "Apply learning methods to clinical data"
    zh: "将学习方法用于临床数据"
    zh-TW: "將學習方法用於臨床資料"
    ja: "臨床データに学習手法を使う"
    ko: "임상 데이터에 학습 방법 적용하기"
    vi: "Áp dụng phương pháp học cho dữ liệu lâm sàng"
    ms: "Guna kaedah pembelajaran pada data klinikal"
    id: "Menerapkan metode pembelajaran pada data klinis"
    hi: "क्लिनिकल डेटा पर लर्निंग विधियाँ लागू करना"
  - en: "Explain the quirks and limits of health data"
    zh: "说明医疗数据的特点与局限"
    zh-TW: "說明醫療資料的特性與限制"
    ja: "医療データの癖と限界を説明する"
    ko: "의료 데이터의 특성과 한계 설명하기"
    vi: "Giải thích đặc điểm và giới hạn của dữ liệu y tế"
    ms: "Terangkan ciri dan had data kesihatan"
    id: "Menjelaskan kekhasan dan batas data kesehatan"
    hi: "हेल्थ डेटा की खासियतें और सीमाएँ समझाना"
