code: GEOG20013
year: 2026
learn:
  en: "How where people live, from neighbourhoods to natural settings, affects their health."
  zh: "居住环境（从社区到自然环境）如何影响人们的健康。"
  zh-TW: "居住環境（從社區到自然環境）如何影響人們的健康。"
  ja: "住む場所（地域から自然環境まで）が健康にどう影響するか。"
  ko: "동네부터 자연환경까지, 사는 곳이 건강에 미치는 영향."
  vi: "Nơi sống, từ khu phố đến môi trường tự nhiên, ảnh hưởng sức khỏe ra sao."
  ms: "Bagaimana tempat tinggal, dari kejiranan hingga alam, mempengaruhi kesihatan."
  id: "Bagaimana tempat tinggal, dari lingkungan sekitar hingga alam, memengaruhi kesehatan."
  hi: "मोहल्ले से प्राकृतिक माहौल तक, रहने की जगह सेहत पर कैसे असर डालती है।"
outcomes:
  - en: "Explain place-based drivers of population health"
    zh: "解释影响人群健康的地方因素"
    zh-TW: "解釋影響人群健康的地方因素"
    ja: "集団の健康を左右する地域要因を説明する"
    ko: "인구 건강의 장소 요인 설명하기"
    vi: "Giải thích yếu tố nơi chốn ảnh hưởng sức khỏe"
    ms: "Terangkan faktor tempat bagi kesihatan penduduk"
    id: "Menjelaskan faktor tempat bagi kesehatan penduduk"
    hi: "जनस्वास्थ्य के स्थान-आधारित कारण समझाना"
  - en: "Weigh evidence and debates in health geography"
    zh: "权衡健康地理学的证据与争论"
    zh-TW: "權衡健康地理學的證據與爭論"
    ja: "健康地理学の証拠と議論を整理する"
    ko: "건강지리학의 근거와 논쟁 종합하기"
    vi: "Tổng hợp bằng chứng và tranh luận địa lý sức khỏe"
    ms: "Timbang bukti dan perdebatan geografi kesihatan"
    id: "Menimbang bukti dan debat geografi kesehatan"
    hi: "स्वास्थ्य भूगोल के साक्ष्य और बहसें परखना"
