code: GENE30004
year: 2026
learn:
  en: "The capstone for the Genetics major: designing experiments and analysing genetic data in lab classes."
  zh: "遗传学专业毕业课：在实验课上设计实验、分析遗传数据。"
  zh-TW: "遺傳學主修總結課：在實驗課上設計實驗、分析遺傳資料。"
  ja: "遺伝学専攻の総仕上げ科目：実験授業で実験を設計し、遺伝データを分析する。"
  ko: "유전학 전공 캡스톤: 실험 수업에서 실험을 설계하고 유전 데이터를 분석한다."
  vi: "Môn học capstone của chuyên ngành Di truyền: thiết kế thí nghiệm và phân tích dữ liệu di truyền trên lớp lab."
  ms: "Subjek capstone major Genetik: reka eksperimen dan analisis data genetik dalam kelas makmal."
  id: "Mata kuliah capstone jurusan Genetika: merancang eksperimen dan menganalisis data genetik di kelas lab."
  hi: "जेनेटिक्स मेजर का कैपस्टोन: लैब क्लास में प्रयोग डिज़ाइन करना और जेनेटिक डेटा का विश्लेषण।"
outcomes:
  - en: "Design and run genetics lab experiments"
    zh: "设计并完成遗传学实验"
    zh-TW: "設計並完成遺傳學實驗"
    ja: "遺伝学の実験を設計し実施する"
    ko: "유전학 실험 설계 및 수행"
    vi: "Thiết kế và làm thí nghiệm di truyền"
    ms: "Reka dan jalankan eksperimen makmal genetik"
    id: "Merancang dan menjalankan eksperimen lab genetika"
    hi: "जेनेटिक्स लैब प्रयोग डिज़ाइन करना और चलाना"
  - en: "Analyse and interpret experimental data"
    zh: "分析和解读实验数据"
    zh-TW: "分析和解讀實驗資料"
    ja: "実験データを分析し解釈する"
    ko: "실험 데이터 분석 및 해석"
    vi: "Phân tích và diễn giải dữ liệu thí nghiệm"
    ms: "Analisis dan tafsir data eksperimen"
    id: "Menganalisis dan menafsirkan data eksperimen"
    hi: "प्रयोग के डेटा का विश्लेषण और व्याख्या"
  - en: "Critique scientific papers"
    zh: "批判性阅读科学论文"
    zh-TW: "批判性閱讀科學論文"
    ja: "科学論文を批判的に読む"
    ko: "과학 논문 비평"
    vi: "Phản biện bài báo khoa học"
    ms: "Kritik kertas saintifik"
    id: "Mengkritisi paper ilmiah"
    hi: "वैज्ञानिक पेपर की समीक्षा करना"
