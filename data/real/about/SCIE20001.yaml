code: SCIE20001
year: 2026
learn:
  en: "How science works across fields: scientific methods, building arguments, and writing science for different readers."
  zh: "科学如何运作：科学方法、论证和面向不同读者的写作"
  zh-TW: "科學如何運作：科學方法、論證和面向不同讀者的寫作"
  ja: "分野を越えた科学のしくみ：科学的方法、論証、読者に合わせた科学の書き方。"
  ko: "분야를 넘는 과학의 작동 방식: 과학적 방법, 논증, 독자별 과학 글쓰기."
  vi: "Khoa học vận hành thế nào: phương pháp khoa học, lập luận và viết về khoa học cho nhiều đối tượng."
  ms: "Cara sains berfungsi merentas bidang: kaedah saintifik, membina hujah, dan menulis sains untuk pelbagai pembaca."
  id: "Cara sains bekerja lintas bidang: metode ilmiah, menyusun argumen, dan menulis sains untuk beragam pembaca."
  hi: "विज्ञान कैसे काम करता है: वैज्ञानिक पद्धतियाँ, तर्क गढ़ना और अलग पाठकों के लिए विज्ञान लेखन।"
outcomes:
  - en: "Construct a scientific argument"
    zh: "构建科学论证"
    zh-TW: "建構科學論證"
    ja: "科学的な論証を組み立てる"
    ko: "과학적 논증 구성하기"
    vi: "Xây dựng lập luận khoa học"
    ms: "Membina hujah saintifik"
    id: "Menyusun argumen ilmiah"
    hi: "वैज्ञानिक तर्क बनाना"
  - en: "Write about science in different styles"
    zh: "用不同方式撰写科学文章"
    zh-TW: "用不同方式撰寫科學文章"
    ja: "さまざまな形式で科学を書く"
    ko: "여러 방식으로 과학 글쓰기"
    vi: "Viết về khoa học theo nhiều phong cách"
    ms: "Menulis tentang sains dalam pelbagai gaya"
    id: "Menulis sains dalam berbagai gaya"
    hi: "अलग-अलग शैलियों में विज्ञान लिखना"
  - en: "Analyse current issues scientifically"
    zh: "从科学角度分析时事"
    zh-TW: "從科學角度分析時事"
    ja: "時事問題を科学的に分析する"
    ko: "시사 문제를 과학적으로 분석하기"
    vi: "Phân tích vấn đề thời sự theo khoa học"
    ms: "Menganalisis isu semasa secara saintifik"
    id: "Menganalisis isu terkini secara ilmiah"
    hi: "वर्तमान मुद्दों का वैज्ञानिक विश्लेषण"
