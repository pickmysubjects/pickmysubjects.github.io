code: FNCE20002
year: 2026
learn:
  en: "How banks and other financial institutions work: their products, pricing, risks, risk management and regulation."
  zh: "银行等金融机构如何运作：产品、定价、风险、风控和监管。"
  zh-TW: "銀行等金融機構如何運作：商品、定價、風險、風控和監理。"
  ja: "銀行など金融機関の仕組み：商品、価格設定、リスク、リスク管理、規制。"
  ko: "은행 등 금융기관의 작동 방식: 상품, 가격, 위험, 위험관리, 규제."
  vi: "Ngân hàng và tổ chức tài chính vận hành ra sao: sản phẩm, định giá, rủi ro, quản trị rủi ro và quy định."
  ms: "Cara bank dan institusi kewangan beroperasi: produk, harga, risiko, pengurusan risiko dan peraturan."
  id: "Cara bank dan lembaga keuangan bekerja: produk, harga, risiko, manajemen risiko, dan regulasi."
  hi: "बैंक और दूसरे वित्तीय संस्थान कैसे चलते हैं: उत्पाद, क़ीमत, जोखिम, जोखिम प्रबंधन और नियम।"
outcomes:
  - en: "Explain what makes financial intermediaries special"
    zh: "解释金融中介的特殊之处"
    zh-TW: "說明金融中介的特殊之處"
    ja: "金融仲介機関の特殊性を説明する"
    ko: "금융중개기관의 특수성 설명"
    vi: "Giải thích điểm đặc biệt của trung gian tài chính"
    ms: "Terangkan keistimewaan perantara kewangan"
    id: "Menjelaskan kekhasan perantara keuangan"
    hi: "वित्तीय मध्यस्थ ख़ास क्यों हैं, समझाना"
  - en: "Identify the main risks banks face and how they manage them"
    zh: "识别银行面临的主要风险及管理方法"
    zh-TW: "辨識銀行面臨的主要風險及管理方法"
    ja: "銀行の主なリスクとその管理法を見極める"
    ko: "은행의 주요 위험과 관리 방법 파악"
    vi: "Nhận diện rủi ro chính của ngân hàng và cách quản lý"
    ms: "Kenal pasti risiko utama bank dan cara mengurusnya"
    id: "Mengenali risiko utama bank dan cara mengelolanya"
    hi: "बैंकों के मुख्य जोखिम और उनके प्रबंधन को पहचानना"
  - en: "Apply capital adequacy rules in banking regulation"
    zh: "运用银行监管中的资本充足率规则"
    zh-TW: "運用銀行監理中的資本適足率規則"
    ja: "銀行規制の自己資本比率ルールを当てはめる"
    ko: "은행 규제의 자본적정성 규칙 적용"
    vi: "Áp dụng quy định an toàn vốn trong ngân hàng"
    ms: "Guna peraturan kecukupan modal dalam perbankan"
    id: "Menerapkan aturan kecukupan modal perbankan"
    hi: "बैंकिंग नियमों में कैपिटल एडिक्वेसी लागू करना"
