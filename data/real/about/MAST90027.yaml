code: MAST90027
year: 2027
learn:
  en: "Statistics in practice: framing real problems, helping design studies, handling data and statistical consulting."
  zh: "实践中的统计：梳理实际问题、参与研究设计、处理数据和统计咨询。"
  zh-TW: "實務中的統計：釐清實際問題、參與研究設計、處理資料與統計諮詢。"
  ja: "実践の統計：問題の整理、研究デザイン、データ処理、統計コンサルティング。"
  ko: "실무 통계: 문제 구조화, 연구 설계 참여, 데이터 처리, 통계 컨설팅."
  vi: "Thống kê thực hành: định hình bài toán, thiết kế nghiên cứu, xử lý dữ liệu, tư vấn thống kê."
  ms: "Statistik amalan: membingkai masalah, reka bentuk kajian, mengendali data dan perundingan statistik."
  id: "Statistika praktik: merumuskan masalah, desain studi, mengolah data, konsultasi statistik."
  hi: "व्यवहार में सांख्यिकी: समस्या ढाँचा बनाना, स्टडी डिज़ाइन, डेटा संभालना, सांख्यिकीय सलाह।"
outcomes:
  - en: "Structure a real-world statistical problem"
    zh: "梳理实际统计问题的结构"
    zh-TW: "釐清實際統計問題的結構"
    ja: "実際の統計問題を整理する"
    ko: "실제 통계 문제 구조화하기"
    vi: "Định hình một bài toán thống kê thực tế"
    ms: "Menyusun masalah statistik dunia sebenar"
    id: "Menyusun masalah statistik dunia nyata"
    hi: "असली सांख्यिकीय समस्या को व्यवस्थित करना"
  - en: "Advise clients as a statistical consultant"
    zh: "以统计顾问身份为客户提供建议"
    zh-TW: "以統計顧問身分為客戶提供建議"
    ja: "統計コンサルタントとして助言する"
    ko: "통계 컨설턴트로서 조언하기"
    vi: "Tư vấn khách hàng như chuyên gia thống kê"
    ms: "Memberi nasihat sebagai perunding statistik"
    id: "Memberi saran sebagai konsultan statistik"
    hi: "सांख्यिकीय सलाहकार के रूप में सलाह देना"
