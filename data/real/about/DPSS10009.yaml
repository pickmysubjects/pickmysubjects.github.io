code: DPSS10009
year: 2026
learn:
  en: "A tour of how live shows get made: design, stage management, sets, costume, lighting, sound and projection."
  zh: "现场演出怎么做出来：设计、舞台监督、布景、服装、灯光、音响与投影。"
  zh-TW: "現場演出怎麼做出來：設計、舞台監督、布景、服裝、燈光、音響與投影。"
  ja: "舞台公演の作り方を一通り：デザイン、舞台監督、装置、衣装、照明、音響、映像。"
  ko: "공연 제작 전반: 디자인, 무대감독, 세트, 의상, 조명, 음향, 영상."
  vi: "Cách làm một buổi diễn: thiết kế, quản lý sân khấu, cảnh, phục trang, ánh sáng, âm thanh."
  ms: "Cara persembahan dihasilkan: reka bentuk, pengurusan pentas, set, kostum, cahaya, bunyi."
  id: "Cara pertunjukan dibuat: desain, manajemen panggung, set, kostum, cahaya, suara."
  hi: "लाइव शो कैसे बनता है: डिज़ाइन, स्टेज मैनेजमेंट, सेट, कॉस्ट्यूम, लाइट, साउंड।"
outcomes:
  - en: "Draw, build models and draft with CAD"
    zh: "手绘、做模型、用CAD制图"
    zh-TW: "手繪、做模型、用 CAD 製圖"
    ja: "手描き・模型・CAD製図ができる"
    ko: "손 그림, 모형, CAD 도면 작업하기"
    vi: "Vẽ tay, làm mô hình và vẽ CAD"
    ms: "Melukis, buat model dan lukisan CAD"
    id: "Menggambar, membuat model dan CAD"
    hi: "हाथ से ड्रॉइंग, मॉडल और CAD ड्राफ़्टिंग"
  - en: "Know what each production department does"
    zh: "了解各制作部门的职责"
    zh-TW: "了解各製作部門的職責"
    ja: "各制作部門の役割を理解する"
    ko: "제작 부서별 역할 이해하기"
    vi: "Hiểu việc của từng bộ phận sản xuất"
    ms: "Faham tugas setiap jabatan produksi"
    id: "Memahami peran tiap departemen produksi"
    hi: "हर प्रोडक्शन विभाग का काम समझना"
  - en: "Work with performers as part of a team"
    zh: "作为团队一员与表演者合作"
    zh-TW: "作為團隊一員與表演者合作"
    ja: "チームの一員として出演者と協働する"
    ko: "팀의 일원으로 공연자와 협업하기"
    vi: "Làm việc cùng diễn viên trong một nhóm"
    ms: "Bekerja dengan pelakon dalam pasukan"
    id: "Bekerja sama dengan pemain dalam tim"
    hi: "टीम के रूप में कलाकारों के साथ काम करना"
