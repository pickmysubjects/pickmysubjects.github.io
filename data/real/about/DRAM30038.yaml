code: DRAM30038
year: 2026
learn:
  en: "The business side of independent theatre: pitching, budgets, marketing, tax, and an e-portfolio of your work."
  zh: "独立戏剧的商业面：提案、预算、营销、税务，并做作品电子集。"
  zh-TW: "獨立劇場的商業面：提案、預算、行銷、稅務，並做作品電子集。"
  ja: "独立系演劇のビジネス面：ピッチ、予算、宣伝、税務、作品のeポートフォリオ。"
  ko: "독립 연극의 사업 측면: 피칭, 예산, 마케팅, 세금, 작품 e포트폴리오."
  vi: "Mặt kinh doanh của kịch độc lập: pitch, ngân sách, quảng bá, thuế, hồ sơ số."
  ms: "Sisi perniagaan teater bebas: pitch, bajet, pemasaran, cukai dan e-portfolio."
  id: "Sisi bisnis teater independen: pitching, anggaran, pemasaran, pajak, e-portofolio."
  hi: "स्वतंत्र थिएटर का व्यवसाय पक्ष: पिच, बजट, मार्केटिंग, टैक्स और ई-पोर्टफ़ोलियो।"
outcomes:
  - en: "Pitch a project to presenters"
    zh: "向演出方推介项目"
    zh-TW: "向演出方推介專案"
    ja: "主催者に企画をピッチする"
    ko: "기획을 공연 주최측에 피칭하기"
    vi: "Pitch dự án cho đơn vị tổ chức"
    ms: "Bentang projek kepada penganjur"
    id: "Mempresentasikan proyek ke penyelenggara"
    hi: "प्रस्तुतकर्ताओं को प्रोजेक्ट पिच करना"
  - en: "Write a budget and media release"
    zh: "写预算和新闻稿"
    zh-TW: "寫預算和新聞稿"
    ja: "予算書とプレスリリースを書く"
    ko: "예산서와 보도자료 쓰기"
    vi: "Viết ngân sách và thông cáo báo chí"
    ms: "Tulis bajet dan kenyataan media"
    id: "Menyusun anggaran dan rilis media"
    hi: "बजट और प्रेस विज्ञप्ति लिखना"
  - en: "Build an e-portfolio for your work"
    zh: "为自己的作品做电子作品集"
    zh-TW: "為自己的作品做電子作品集"
    ja: "作品のeポートフォリオを作る"
    ko: "작품 e포트폴리오 만들기"
    vi: "Làm hồ sơ số cho tác phẩm"
    ms: "Bina e-portfolio untuk karya anda"
    id: "Membuat e-portofolio karya"
    hi: "अपने काम का ई-पोर्टफ़ोलियो बनाना"
