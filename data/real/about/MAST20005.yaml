code: MAST20005
year: 2026
learn:
  en: "The basics of statistics: fitting models to data, estimating values and testing hypotheses."
  zh: "统计入门：用模型拟合数据、估计参数、做假设检验。"
  zh-TW: "統計入門：用模型擬合資料、估計參數、做假設檢定。"
  ja: "統計の基礎：データへのモデル当てはめ、推定、仮説検定。"
  ko: "통계 기초: 데이터에 모델 적합, 값 추정, 가설 검정."
  vi: "Thống kê cơ bản: khớp mô hình với dữ liệu, ước lượng và kiểm định giả thuyết."
  ms: "Asas statistik: memadankan model dengan data, menganggar nilai dan menguji hipotesis."
  id: "Dasar statistik: mencocokkan model dengan data, mengestimasi nilai, dan menguji hipotesis."
  hi: "सांख्यिकी की बुनियादी बातें: डेटा पर मॉडल फिट करना, मान अनुमान लगाना और परिकल्पना परीक्षण।"
outcomes:
  - en: "Estimate parameters and build confidence intervals"
    zh: "估计参数并算置信区间"
    zh-TW: "估計參數並算出信賴區間"
    ja: "パラメータを推定し信頼区間を作る"
    ko: "모수를 추정하고 신뢰구간 구하기"
    vi: "Ước lượng tham số và lập khoảng tin cậy"
    ms: "Menganggar parameter dan membina selang keyakinan"
    id: "Mengestimasi parameter dan membuat selang kepercayaan"
    hi: "पैरामीटर का अनुमान और कॉन्फिडेंस इंटरवल बनाना"
  - en: "Test hypotheses, both classical and Bayesian"
    zh: "用经典和贝叶斯方法做假设检验"
    zh-TW: "用古典和貝氏方法做假設檢定"
    ja: "古典的・ベイズ的な仮説検定を行う"
    ko: "고전적·베이즈 방식으로 가설 검정하기"
    vi: "Kiểm định giả thuyết theo cổ điển và Bayes"
    ms: "Menguji hipotesis secara klasik dan Bayesian"
    id: "Menguji hipotesis secara klasik dan Bayesian"
    hi: "क्लासिकल और बायेसियन दोनों तरह से परिकल्पना परीक्षण"
  - en: "Run standard analyses in statistical software"
    zh: "用统计软件做常规分析"
    zh-TW: "用統計軟體做常規分析"
    ja: "統計ソフトで標準的な分析を行う"
    ko: "통계 소프트웨어로 기본 분석하기"
    vi: "Chạy các phân tích cơ bản bằng phần mềm thống kê"
    ms: "Menjalankan analisis standard dalam perisian statistik"
    id: "Menjalankan analisis standar di software statistik"
    hi: "स्टैटिस्टिकल सॉफ्टवेयर में सामान्य विश्लेषण करना"
