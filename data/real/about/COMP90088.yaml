code: COMP90088
year: 2027
learn:
  en: "How cryptocurrencies like Bitcoin and Ethereum work, using cryptography and blockchains, and how to program with them."
  zh: "比特币、以太坊等加密货币如何借助密码学和区块链运作，以及如何编程。"
  zh-TW: "比特幣、以太坊等加密貨幣如何藉密碼學與區塊鏈運作，以及如何撰寫程式。"
  ja: "ビットコインやイーサリアムが暗号とブロックチェーンでどう動くか、その上でのプログラミング。"
  ko: "비트코인·이더리움이 암호와 블록체인으로 작동하는 원리와 프로그래밍."
  vi: "Tiền mã hóa như Bitcoin, Ethereum vận hành nhờ mật mã và blockchain, và cách lập trình."
  ms: "Cara mata wang kripto seperti Bitcoin dan Ethereum berfungsi dengan kriptografi dan rantaian blok."
  id: "Cara kripto seperti Bitcoin dan Ethereum bekerja dengan kriptografi dan blockchain, serta pemrogramannya."
  hi: "Bitcoin, Ethereum जैसी क्रिप्टोकरेंसी क्रिप्टोग्राफ़ी और ब्लॉकचेन से कैसे चलती हैं, और प्रोग्रामिंग।"
outcomes:
  - en: "Explain how a blockchain records who owns what"
    zh: "解释区块链如何记录所有权"
    zh-TW: "解釋區塊鏈如何記錄所有權"
    ja: "ブロックチェーンが所有を記録する仕組みを説明する"
    ko: "블록체인이 소유를 기록하는 방식 설명하기"
    vi: "Giải thích blockchain ghi nhận quyền sở hữu thế nào"
    ms: "Terangkan cara rantaian blok merekod pemilikan"
    id: "Menjelaskan cara blockchain mencatat kepemilikan"
    hi: "ब्लॉकचेन स्वामित्व कैसे दर्ज करता है, समझाना"
  - en: "Write programs that interact with a ledger"
    zh: "编写与账本交互的程序"
    zh-TW: "撰寫與帳本互動的程式"
    ja: "台帳とやり取りするプログラムを書く"
    ko: "원장과 상호작용하는 프로그램 작성하기"
    vi: "Viết chương trình tương tác với sổ cái"
    ms: "Tulis program yang berinteraksi dengan lejar"
    id: "Menulis program yang berinteraksi dengan ledger"
    hi: "लेजर से जुड़ने वाले प्रोग्राम लिखना"
