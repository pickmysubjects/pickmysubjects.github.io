code: MUSI20227
year: 2026
learn:
  en: "Key ideas in popular music studies: genre, audiences, gender, race, technology and media. Not offered in 2026."
  zh: "流行音乐研究的核心概念：类型、听众、性别、种族、技术与媒体。2026年不开。"
  zh-TW: "流行音樂研究的核心概念：類型、聽眾、性別、種族、技術與媒體。2026年不開。"
  ja: "ポピュラー音楽研究の主要概念：ジャンル、聴衆、ジェンダー、人種、技術、メディア。2026年休講。"
  ko: "대중음악 연구의 핵심: 장르, 청중, 젠더, 인종, 기술, 미디어. 2026년 미개설."
  vi: "Khái niệm chính về nghiên cứu nhạc pop: thể loại, khán giả, giới, chủng tộc, công nghệ. Không mở 2026."
  ms: "Idea utama kajian muzik popular: genre, khalayak, gender, kaum, teknologi, media. Tiada 2026."
  id: "Gagasan utama kajian musik populer: genre, audiens, gender, ras, teknologi, media. Tidak dibuka 2026."
  hi: "पॉपुलर म्यूज़िक स्टडीज़ के मुख्य विचार: शैली, श्रोता, जेंडर, नस्ल, तकनीक, मीडिया। 2026 में नहीं।"
outcomes:
  - en: "Compile an annotated bibliography on a topic"
    zh: "就一个主题整理注释书目"
    zh-TW: "就一個主題整理註釋書目"
    ja: "テーマに沿って注釈付き文献目録をつくる"
    ko: "주제별 주석 참고문헌 작성하기"
    vi: "Lập thư mục có chú giải cho một chủ đề"
    ms: "Susun bibliografi beranotasi untuk satu topik"
    id: "Menyusun bibliografi beranotasi suatu topik"
    hi: "किसी विषय पर एनोटेटेड बिब्लियोग्राफ़ी बनाना"
