code: GEOG30027
year: 2026
learn:
  en: "How places around Melbourne connect to global processes, studied through local fieldwork and research design."
  zh: "通过本地实地研究，看墨尔本各地如何与全球过程相连。"
  zh-TW: "透過在地實地研究，看墨爾本各地如何與全球過程相連。"
  ja: "メルボルン周辺の場所が世界とどうつながるかを、地元の野外調査で学ぶ。"
  ko: "멜버른 주변 장소가 세계와 어떻게 연결되는지 지역 현장조사로 배움."
  vi: "Các địa điểm quanh Melbourne gắn với quá trình toàn cầu ra sao, qua nghiên cứu thực địa tại chỗ."
  ms: "Cara tempat di sekitar Melbourne berkait dengan proses global, melalui kerja lapangan tempatan."
  id: "Cara tempat di sekitar Melbourne terhubung dengan proses global, lewat riset lapangan lokal."
  hi: "मेलबर्न के आसपास की जगहें वैश्विक प्रक्रियाओं से कैसे जुड़ी हैं, स्थानीय फ़ील्डवर्क से।"
outcomes:
  - en: "Investigate local-global links through fieldwork"
    zh: "通过实地调查研究地方与全球的联系"
    zh-TW: "透過實地調查研究在地與全球的連結"
    ja: "野外調査でローカルとグローバルのつながりを調べる"
    ko: "현장조사로 지역-세계 연결 탐구하기"
    vi: "Tìm hiểu liên kết địa phương-toàn cầu qua thực địa"
    ms: "Siasat kaitan tempatan-global melalui kerja lapangan"
    id: "Menyelidiki kaitan lokal-global lewat lapangan"
    hi: "फ़ील्डवर्क से स्थानीय-वैश्विक संबंध जाँचना"
  - en: "Design an ethical research method"
    zh: "设计符合伦理的研究方法"
    zh-TW: "設計符合倫理的研究方法"
    ja: "倫理的な研究方法を設計する"
    ko: "윤리적 연구 방법 설계하기"
    vi: "Thiết kế phương pháp nghiên cứu có đạo đức"
    ms: "Reka kaedah kajian beretika"
    id: "Merancang metode riset yang etis"
    hi: "नैतिक शोध पद्धति तैयार करना"
