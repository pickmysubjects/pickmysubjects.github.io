code: ANSC20005
year: 2026
learn:
  en: "Caring for pets like dogs, cats, horses and exotics: housing, nutrition, health, behaviour and welfare."
  zh: "照顾猫狗马和异宠：饲养环境、营养、健康、行为与福利。"
  zh-TW: "照顧貓狗馬與特寵：飼養環境、營養、健康、行為與福利。"
  ja: "犬・猫・馬やエキゾチックペットの飼育：住環境、栄養、健康、行動、福祉。"
  ko: "개·고양이·말과 이색 반려동물 돌보기: 사육 환경, 영양, 건강, 행동, 복지."
  vi: "Chăm sóc chó, mèo, ngựa và thú cưng lạ: chuồng trại, dinh dưỡng, sức khỏe, hành vi, phúc lợi."
  ms: "Menjaga anjing, kucing, kuda dan haiwan eksotik: kandang, pemakanan, kesihatan, tingkah laku."
  id: "Merawat anjing, kucing, kuda, dan hewan eksotis: kandang, pakan, kesehatan, perilaku, kesejahteraan."
  hi: "कुत्ते, बिल्ली, घोड़े और विदेशी पालतू जानवरों की देखभाल: आवास, पोषण, स्वास्थ्य, व्यवहार।"
outcomes:
  - en: "Check pet food claims against real needs"
    zh: "对照宠物真实需求评估宠物食品宣传"
    zh-TW: "對照寵物真實需求評估飼料宣稱"
    ja: "ペットフードの表示を本当の必要量と比べる"
    ko: "반려동물 사료 광고를 실제 필요와 비교하기"
    vi: "Đối chiếu quảng cáo thức ăn với nhu cầu thật"
    ms: "Nilai dakwaan makanan haiwan dengan keperluan sebenar"
    id: "Menilai klaim pakan hewan dengan kebutuhan nyata"
    hi: "पालतू भोजन के दावों को असली ज़रूरत से परखना"
  - en: "Link behaviour theory to animal training"
    zh: "把行为理论用于动物训练"
    zh-TW: "把行為理論用於動物訓練"
    ja: "行動理論を動物のしつけに結びつける"
    ko: "행동 이론을 동물 훈련에 연결하기"
    vi: "Gắn lý thuyết hành vi với huấn luyện thú"
    ms: "Kaitkan teori tingkah laku dengan latihan haiwan"
    id: "Mengaitkan teori perilaku dengan pelatihan hewan"
    hi: "व्यवहार सिद्धांत को पशु प्रशिक्षण से जोड़ना"
