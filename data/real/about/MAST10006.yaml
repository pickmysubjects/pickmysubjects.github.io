code: MAST10006
year: 2026
learn:
  en: "More calculus: series, differential equations and functions of two variables, with real-world uses."
  zh: "深入微积分：级数、微分方程和二元函数，以及实际应用。"
  zh-TW: "深入微積分：級數、微分方程和雙變數函數，以及實際應用。"
  ja: "微積分の発展：級数、微分方程式、2変数関数と、その実際の応用。"
  ko: "미적분 심화: 급수, 미분방정식, 이변수 함수와 실제 활용."
  vi: "Giải tích nâng cao: chuỗi, phương trình vi phân và hàm hai biến, kèm ứng dụng thực tế."
  ms: "Kalkulus lanjutan: siri, persamaan pembezaan dan fungsi dua pemboleh ubah, dengan kegunaan sebenar."
  id: "Kalkulus lanjut: deret, persamaan diferensial, dan fungsi dua variabel, beserta penerapannya."
  hi: "आगे का कैलकुलस: सीरीज़, अवकल समीकरण और दो चर वाले फ़ंक्शन, असली उपयोगों के साथ।"
outcomes:
  - en: "Solve first and second order differential equations"
    zh: "解一阶和二阶微分方程"
    zh-TW: "解一階和二階微分方程"
    ja: "1階・2階の微分方程式を解く"
    ko: "1계·2계 미분방정식 풀기"
    vi: "Giải phương trình vi phân cấp một và cấp hai"
    ms: "Selesaikan persamaan pembezaan peringkat pertama dan kedua"
    id: "Menyelesaikan persamaan diferensial orde satu dan dua"
    hi: "प्रथम और द्वितीय कोटि के अवकल समीकरण हल करना"
  - en: "Model real situations using calculus"
    zh: "用微积分为实际问题建模"
    zh-TW: "用微積分為實際問題建模"
    ja: "微積分で現実の状況をモデル化する"
    ko: "미적분으로 실제 상황 모델링"
    vi: "Mô hình hóa tình huống thực tế bằng giải tích"
    ms: "Modelkan situasi sebenar dengan kalkulus"
    id: "Memodelkan situasi nyata dengan kalkulus"
    hi: "कैलकुलस से असली स्थितियों का मॉडल बनाना"
  - en: "Write maths solutions clearly and logically"
    zh: "清楚有条理地写数学解答"
    zh-TW: "清楚有條理地寫數學解答"
    ja: "数学の解答を明確かつ論理的に書く"
    ko: "수학 풀이를 명확하고 논리적으로 쓰기"
    vi: "Viết lời giải toán rõ ràng, logic"
    ms: "Tulis penyelesaian matematik dengan jelas dan logik"
    id: "Menulis jawaban matematika dengan jelas dan logis"
    hi: "गणित के हल साफ़ और तार्किक ढंग से लिखना"
