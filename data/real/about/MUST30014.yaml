code: MUST30014
year: 2026
learn:
  en: "Get industry-ready: acting for camera, audition technique, spoken voice, dance and a repertoire folio."
  zh: "为入行做准备：镜头表演、试镜技巧、语音、舞蹈与曲目集。"
  zh-TW: "為入行做準備：鏡頭表演、試鏡技巧、語音、舞蹈與曲目集。"
  ja: "業界に向けて：カメラ演技、オーディション、発声、ダンス、レパートリー集。"
  ko: "업계 준비: 카메라 연기, 오디션 기법, 발성, 춤, 레퍼토리 폴리오."
  vi: "Sẵn sàng vào nghề: diễn trước máy quay, kỹ thuật thử vai, giọng nói, múa, tiết mục."
  ms: "Sedia untuk industri: lakonan kamera, teknik uji bakat, suara, tarian dan folio repertoir."
  id: "Siap industri: akting kamera, teknik audisi, vokal bicara, tari dan portofolio repertoar."
  hi: "इंडस्ट्री के लिए तैयारी: कैमरा अभिनय, ऑडिशन तकनीक, आवाज़, नृत्य और रेपर्टरी फ़ोलियो।"
outcomes:
  - en: "Act for the camera"
    zh: "面对镜头表演"
    zh-TW: "面對鏡頭表演"
    ja: "カメラの前で演じる"
    ko: "카메라 앞에서 연기하기"
    vi: "Diễn trước máy quay"
    ms: "Berlakon di depan kamera"
    id: "Berakting di depan kamera"
    hi: "कैमरे के सामने अभिनय करना"
  - en: "Prepare and run a strong audition"
    zh: "准备并完成一次出色的试镜"
    zh-TW: "準備並完成一次出色的試鏡"
    ja: "良いオーディションを準備し臨む"
    ko: "탄탄한 오디션 준비하고 해내기"
    vi: "Chuẩn bị và thử vai thật tốt"
    ms: "Sedia dan jalani uji bakat yang mantap"
    id: "Menyiapkan dan menjalani audisi yang kuat"
    hi: "मज़बूत ऑडिशन की तैयारी और प्रस्तुति"
  - en: "Put together a repertoire portfolio"
    zh: "整理一份曲目作品集"
    zh-TW: "整理一份曲目作品集"
    ja: "レパートリーのポートフォリオをまとめる"
    ko: "레퍼토리 포트폴리오 정리하기"
    vi: "Tập hợp hồ sơ tiết mục"
    ms: "Susun portfolio repertoir"
    id: "Menyusun portofolio repertoar"
    hi: "रेपर्टरी पोर्टफ़ोलियो तैयार करना"
