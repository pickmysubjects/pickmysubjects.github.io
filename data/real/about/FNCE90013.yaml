code: FNCE90013
year: 2027
learn:
  en: "Capstone working through real cases in valuation, investment, derivatives, M&A and raising capital."
  zh: "毕业综合课，分析估值、投资、衍生品、并购和融资的真实案例。"
  zh-TW: "畢業總整課，分析估值、投資、衍生性商品、併購與籌資的真實個案。"
  ja: "評価・投資・デリバティブ・M&A・資金調達の実例を扱う総仕上げ科目。"
  ko: "가치평가, 투자, 파생상품, M&A, 자본조달 실제 사례를 다루는 캡스톤."
  vi: "Môn tổng kết phân tích tình huống thật về định giá, đầu tư, phái sinh, M&A và huy động vốn."
  ms: "Subjek puncak yang mengkaji kes sebenar penilaian, pelaburan, derivatif, M&A dan peningkatan modal."
  id: "Mata kuliah capstone yang membahas kasus nyata valuasi, investasi, derivatif, M&A dan penggalangan modal."
  hi: "कैपस्टोन विषय: मूल्यांकन, निवेश, डेरिवेटिव, M&A और पूंजी जुटाने के असली केस।"
outcomes:
  - en: "Link financial statements and use ratios in valuation"
    zh: "理解报表间联系并用比率估值"
    zh-TW: "理解報表間關聯並用比率估值"
    ja: "財務諸表のつながりを理解し比率で評価する"
    ko: "재무제표 연결 이해와 비율로 가치평가하기"
    vi: "Liên kết báo cáo tài chính và dùng tỷ số để định giá"
    ms: "Menghubungkan penyata kewangan dan guna nisbah dalam penilaian"
    id: "Menghubungkan laporan keuangan dan memakai rasio untuk valuasi"
    hi: "वित्तीय विवरण जोड़ना और मूल्यांकन में अनुपात लगाना"
  - en: "Make decisions on real financial management cases"
    zh: "就真实财务管理案例作出决策"
    zh-TW: "就真實財務管理個案做出決策"
    ja: "実際の財務管理ケースで意思決定する"
    ko: "실제 재무관리 사례에서 의사결정하기"
    vi: "Ra quyết định cho các tình huống quản trị tài chính thật"
    ms: "Membuat keputusan bagi kes pengurusan kewangan sebenar"
    id: "Mengambil keputusan pada kasus manajemen keuangan nyata"
    hi: "असली वित्तीय प्रबंधन मामलों में निर्णय लेना"
