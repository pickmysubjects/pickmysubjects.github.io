code: MUSI30051
year: 2026
learn:
  en: "Keep building your second instrument or voice and give a short recital chosen from a 20-minute program."
  zh: "继续提高第二乐器或声乐，从20分钟曲目中演奏短场独奏。"
  zh-TW: "繼續提升第二樂器或聲樂，從20分鐘曲目中演奏短場獨奏。"
  ja: "第二楽器・声楽を伸ばし、20分のプログラムから短いリサイタルを行う。"
  ko: "제2악기·성악을 키우고 20분 프로그램 중 짧은 리사이틀 연주."
  vi: "Tiếp tục nâng nhạc cụ thứ hai, biểu diễn ngắn chọn từ chương trình 20 phút."
  ms: "Teruskan alat kedua atau vokal dan beri resital pendek dari program 20 minit."
  id: "Lanjutkan instrumen kedua atau vokal, resital singkat dari program 20 menit."
  hi: "दूसरे वाद्य या गायन को आगे बढ़ाना, 20 मिनट के कार्यक्रम से छोटा रिसाइटल।"
outcomes:
  - en: "Give a short recital on a second instrument"
    zh: "用第二乐器完成短场独奏"
    zh-TW: "用第二樂器完成短場獨奏"
    ja: "第二楽器で短いリサイタルをする"
    ko: "제2악기로 짧은 리사이틀 하기"
    vi: "Biểu diễn ngắn bằng nhạc cụ thứ hai"
    ms: "Beri resital pendek dengan alat kedua"
    id: "Memberi resital singkat di instrumen kedua"
    hi: "दूसरे वाद्य पर छोटा रिसाइटल देना"
  - en: "Prepare a varied program of pieces"
    zh: "准备多样的演奏曲目"
    zh-TW: "準備多樣的演奏曲目"
    ja: "変化のある曲目を準備する"
    ko: "다양한 곡 프로그램 준비하기"
    vi: "Chuẩn bị chương trình bài đa dạng"
    ms: "Sediakan program karya yang pelbagai"
    id: "Menyiapkan program karya yang beragam"
    hi: "विविध रचनाओं का कार्यक्रम तैयार करना"
  - en: "Reach a solid level of craft on the instrument"
    zh: "在该乐器上达到扎实水平"
    zh-TW: "在該樂器上達到紮實水準"
    ja: "その楽器で確かな技量に達する"
    ko: "해당 악기에서 탄탄한 실력 갖추기"
    vi: "Đạt trình độ vững trên nhạc cụ đó"
    ms: "Capai tahap kemahiran kukuh pada alat"
    id: "Mencapai keterampilan solid di instrumen"
    hi: "उस वाद्य पर मज़बूत कौशल पाना"
