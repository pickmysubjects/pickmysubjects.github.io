code: GDES30002
year: 2026
learn:
  en: "How brands work, and how to build one: logo, type, naming, copy and art direction across print, screen and video."
  zh: "品牌如何运作以及如何打造品牌：标志、字体、命名、文案和艺术指导，覆盖印刷、屏幕和视频。"
  zh-TW: "品牌如何運作以及如何打造品牌：標誌、字體、命名、文案與藝術指導，涵蓋印刷、螢幕和影片。"
  ja: "ブランドの仕組みと作り方。ロゴ、書体、ネーミング、コピー、アートディレクションを紙・画面・映像で。"
  ko: "브랜드의 작동 원리와 만드는 법: 로고, 서체, 네이밍, 카피, 아트 디렉션을 인쇄·화면·영상에 적용."
  vi: "Thương hiệu vận hành ra sao và cách xây dựng: logo, chữ, đặt tên, nội dung, chỉ đạo nghệ thuật trên in ấn, màn hình, video."
  ms: "Cara jenama berfungsi dan cara membinanya: logo, tipografi, penamaan, salinan dan arahan seni untuk cetak, skrin dan video."
  id: "Cara kerja merek dan cara membangunnya: logo, tipografi, penamaan, copy, dan art direction di cetak, layar, video."
  hi: "ब्रांड कैसे काम करते हैं और कैसे बनते हैं: लोगो, टाइपोग्राफ़ी, नाम, कॉपी और आर्ट डायरेक्शन, प्रिंट-स्क्रीन-वीडियो में।"
outcomes:
  - en: "Explain how brands work strategically and emotionally"
    zh: "解释品牌在策略和情感上如何起作用"
    zh-TW: "解釋品牌在策略與情感上如何發揮作用"
    ja: "ブランドが戦略と感情の両面でどう働くか説明する"
    ko: "브랜드가 전략적·감성적으로 작동하는 방식 설명하기"
    vi: "Giải thích thương hiệu tác động chiến lược và cảm xúc"
    ms: "Jelaskan cara jenama berfungsi secara strategik dan emosi"
    id: "Menjelaskan cara merek bekerja secara strategis dan emosional"
    hi: "ब्रांड रणनीतिक और भावनात्मक रूप से कैसे काम करते हैं"
  - en: "Design a logo and visual identity"
    zh: "设计标志和视觉识别"
    zh-TW: "設計標誌與視覺識別"
    ja: "ロゴとビジュアルアイデンティティを作る"
    ko: "로고와 비주얼 아이덴티티 디자인하기"
    vi: "Thiết kế logo và nhận diện thị giác"
    ms: "Reka logo dan identiti visual"
    id: "Mendesain logo dan identitas visual"
    hi: "लोगो और विज़ुअल पहचान डिज़ाइन करना"
  - en: "Plan a brand campaign across media"
    zh: "策划跨媒体的品牌推广活动"
    zh-TW: "策劃跨媒體的品牌活動"
    ja: "複数メディアのブランドキャンペーンを組む"
    ko: "여러 매체에 걸친 브랜드 캠페인 기획하기"
    vi: "Lên chiến dịch thương hiệu đa phương tiện"
    ms: "Rancang kempen jenama merentas media"
    id: "Merancang kampanye merek lintas media"
    hi: "कई माध्यमों में ब्रांड अभियान की योजना"
