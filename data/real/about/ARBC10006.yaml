code: ARBC10006
year: 2026
learn:
  en: "For those with a little Arabic: key grammar, family and social life, and first steps into Arab countries and traditions."
  zh: "适合有少量基础的学生：核心语法、家庭与社交生活，初步了解阿拉伯国家和传统。"
  zh-TW: "適合有少量基礎的學生：核心文法、家庭與社交生活，初步了解阿拉伯國家和傳統。"
  ja: "少し学んだ人向け。主要な文法、家族や人づきあい、アラブの国々と伝統への入門。"
  ko: "아랍어를 조금 아는 학생용. 핵심 문법, 가족과 사회생활, 아랍 국가와 전통 입문."
  vi: "Cho người đã biết chút tiếng Ả Rập: ngữ pháp chính, gia đình và đời sống xã hội, bước đầu về các nước và truyền thống Ả Rập."
  ms: "Untuk yang tahu sedikit bahasa Arab: tatabahasa utama, keluarga dan kehidupan sosial, serta pengenalan negara dan tradisi Arab."
  id: "Untuk yang sedikit tahu bahasa Arab: tata bahasa utama, keluarga dan kehidupan sosial, serta pengenalan negara dan tradisi Arab."
  hi: "थोड़ी अरबी जानने वालों के लिए: मुख्य व्याकरण, परिवार और सामाजिक जीवन, और अरब देशों व परंपराओं की शुरुआत।"
outcomes:
  - en: "Talk about familiar topics in Arabic with more confidence"
    zh: "更自信地用阿拉伯语谈论熟悉的话题"
    zh-TW: "更自信地用阿拉伯語談論熟悉的話題"
    ja: "身近な話題をアラビア語でより自信を持って話す"
    ko: "익숙한 주제를 아랍어로 더 자신 있게 말하기"
    vi: "Nói về chủ đề quen thuộc bằng tiếng Ả Rập tự tin hơn"
    ms: "Bercakap tentang topik biasa dalam bahasa Arab dengan lebih yakin"
    id: "Membicarakan topik akrab dalam bahasa Arab dengan lebih percaya diri"
    hi: "परिचित विषयों पर अरबी में ज़्यादा आत्मविश्वास से बात करना"
  - en: "Read and write short Arabic texts"
    zh: "读写简短的阿拉伯语文章"
    zh-TW: "讀寫簡短的阿拉伯語文章"
    ja: "短いアラビア語の文章を読み書きする"
    ko: "짧은 아랍어 글 읽고 쓰기"
    vi: "Đọc và viết đoạn văn tiếng Ả Rập ngắn"
    ms: "Baca dan tulis teks pendek bahasa Arab"
    id: "Membaca dan menulis teks pendek bahasa Arab"
    hi: "छोटे अरबी पाठ पढ़ना-लिखना"
  - en: "Use new grammar and vocabulary correctly"
    zh: "正确运用新语法和词汇"
    zh-TW: "正確運用新文法和詞彙"
    ja: "新しい文法と語彙を正しく使う"
    ko: "새 문법과 어휘를 정확히 쓰기"
    vi: "Dùng đúng ngữ pháp và từ vựng mới"
    ms: "Guna tatabahasa dan kosa kata baharu dengan betul"
    id: "Memakai tata bahasa dan kosakata baru dengan benar"
    hi: "नया व्याकरण और शब्दावली सही इस्तेमाल करना"
