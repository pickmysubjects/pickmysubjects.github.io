code: ANCW20003
year: 2026
learn:
  en: "A survey of dynastic Egypt from the Old Kingdom to the Ptolemies, with hands-on study of real ancient objects."
  zh: "从古王国到托勒密王朝的埃及概览，并亲手研究真实的古代文物。"
  zh-TW: "從古王國到托勒密王朝的埃及概覽，並親手研究真實的古代文物。"
  ja: "古王国からプトレマイオス朝までの王朝時代エジプトを概観し、本物の古代遺物を手に取って学ぶ。"
  ko: "고왕국부터 프톨레마이오스 왕조까지 왕조 시대 이집트를 개관하고 실제 유물을 직접 다루며 배운다."
  vi: "Tổng quan Ai Cập thời các triều đại từ Cổ Vương quốc đến nhà Ptolemy, có thực hành với hiện vật cổ thật."
  ms: "Tinjauan Mesir zaman dinasti dari Kerajaan Lama hingga Ptolemy, dengan kajian langsung artifak kuno sebenar."
  id: "Tinjauan Mesir era dinasti dari Kerajaan Lama hingga Ptolemeus, dengan mempelajari langsung benda kuno asli."
  hi: "पुराने साम्राज्य से टॉलेमी तक राजवंशीय मिस्र का सर्वेक्षण, असली प्राचीन वस्तुओं के साथ व्यावहारिक अध्ययन।"
outcomes:
  - en: "Outline the main periods of Egyptian history"
    zh: "概述埃及历史的主要时期"
    zh-TW: "概述埃及歷史的主要時期"
    ja: "エジプト史の主な時代をまとめる"
    ko: "이집트 역사의 주요 시기 정리하기"
    vi: "Tóm tắt các thời kỳ chính của lịch sử Ai Cập"
    ms: "Ringkaskan zaman utama sejarah Mesir"
    id: "Merangkum periode utama sejarah Mesir"
    hi: "मिस्र के इतिहास के मुख्य कालों की रूपरेखा देना"
  - en: "Analyse ancient objects as historical evidence"
    zh: "把古代文物作为历史证据分析"
    zh-TW: "把古代文物作為歷史證據分析"
    ja: "古代の遺物を歴史資料として分析する"
    ko: "고대 유물을 역사적 증거로 분석하기"
    vi: "Phân tích hiện vật cổ như bằng chứng lịch sử"
    ms: "Analisis artifak kuno sebagai bukti sejarah"
    id: "Menganalisis benda kuno sebagai bukti sejarah"
    hi: "प्राचीन वस्तुओं का ऐतिहासिक साक्ष्य के रूप में विश्लेषण करना"
  - en: "Use monuments and texts to explain Egyptian life"
    zh: "用遗迹和文本说明埃及人的生活"
    zh-TW: "用遺跡和文本說明埃及人的生活"
    ja: "遺跡と文書から古代エジプトの暮らしを説明する"
    ko: "유적과 문헌으로 이집트인의 삶 설명하기"
    vi: "Dùng di tích và văn bản để giải thích đời sống Ai Cập"
    ms: "Gunakan monumen dan teks untuk menerangkan hidup Mesir"
    id: "Memakai monumen dan teks untuk menjelaskan hidup Mesir"
    hi: "स्मारकों और ग्रंथों से मिस्री जीवन समझाना"
