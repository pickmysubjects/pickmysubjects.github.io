code: CHEN20012
year: 2026
learn:
  en: "What chemical engineers do: flow diagrams, reactors and thermodynamics, and building your own small flow rig."
  zh: "化学工程师做什么：流程图、反应器、热力学，并亲手搭建小型流动装置。"
  zh-TW: "化學工程師做什麼：流程圖、反應器、熱力學，並親手搭建小型流動裝置。"
  ja: "化学工学の仕事：フロー図、反応器、熱力学、そして小型の流動装置を自作する。"
  ko: "화학공학자의 일: 공정 흐름도, 반응기, 열역학, 그리고 소형 유동 장치 직접 만들기."
  vi: "Kỹ sư hóa làm gì: sơ đồ dòng, thiết bị phản ứng, nhiệt động học, và tự lắp một hệ dòng chảy nhỏ."
  ms: "Apa kerja jurutera kimia: gambar rajah aliran, reaktor, termodinamik, dan membina rig aliran kecil sendiri."
  id: "Apa kerja insinyur kimia: diagram alir, reaktor, termodinamika, dan merakit rig aliran kecil sendiri."
  hi: "केमिकल इंजीनियर क्या करते हैं: फ़्लो डायग्राम, रिएक्टर, थर्मोडायनामिक्स, और अपना छोटा फ़्लो रिग बनाना।"
outcomes:
  - en: "Draw and read process and P&ID diagrams"
    zh: "绘制和读懂流程图及P&ID"
    zh-TW: "繪製並讀懂流程圖及P&ID"
    ja: "プロセス図とP&IDを描き読む"
    ko: "공정도·P&ID 작성하고 읽기"
    vi: "Vẽ và đọc sơ đồ quy trình, P&ID"
    ms: "Melukis dan membaca rajah proses dan P&ID"
    id: "Menggambar dan membaca diagram proses dan P&ID"
    hi: "प्रोसेस और P&ID डायग्राम बनाना व पढ़ना"
  - en: "Apply basic thermodynamics to real problems"
    zh: "用基础热力学解决实际问题"
    zh-TW: "用基礎熱力學解決實際問題"
    ja: "基礎熱力学を実問題に使う"
    ko: "기초 열역학을 실제 문제에 적용하기"
    vi: "Áp dụng nhiệt động học cơ bản vào thực tế"
    ms: "Mengaplikasi termodinamik asas pada masalah sebenar"
    id: "Menerapkan termodinamika dasar ke soal nyata"
    hi: "बुनियादी थर्मोडायनामिक्स असली समस्याओं पर लगाना"
  - en: "Tell safe from unsafe industrial practice"
    zh: "分辨安全与不安全的工业做法"
    zh-TW: "分辨安全與不安全的工業做法"
    ja: "安全・危険な現場慣行を見分ける"
    ko: "안전·위험한 산업 관행 구분하기"
    vi: "Phân biệt cách làm an toàn và không an toàn"
    ms: "Membezakan amalan industri selamat dan tidak"
    id: "Membedakan praktik industri aman dan tidak"
    hi: "सुरक्षित और असुरक्षित औद्योगिक तरीकों में फ़र्क करना"
