code: ABPL90454
year: 2027
learn:
  en: "A travelling studio on fairer informal settlements through placemaking, with community engagement in Southeast Asia."
  zh: "东南亚游学工作室，通过场所营造和社区参与，让非正规聚落更公平。"
  zh-TW: "東南亞遊學工作室，透過場所營造和社區參與，讓非正規聚落更公平。"
  ja: "東南アジアを訪れ、住民参加のプレイスメイキングでインフォーマル居住地の公正を考える。"
  ko: "동남아 답사 스튜디오로, 주민 참여 플레이스메이킹으로 비공식 정착지의 형평성을 다룹니다."
  vi: "Studio thực địa Đông Nam Á: kiến tạo nơi chốn cùng cộng đồng vì khu định cư công bằng hơn."
  ms: "Studio kembara Asia Tenggara tentang penempatan tidak formal yang adil melalui pembinaan tempat."
  id: "Studio perjalanan Asia Tenggara tentang permukiman informal yang adil lewat placemaking."
  hi: "दक्षिण-पूर्व एशिया में यात्रा स्टूडियो: सामुदायिक भागीदारी और प्लेसमेकिंग से अनौपचारिक बस्तियों में न्याय।"
outcomes:
  - en: "Compare causes of informal settlements"
    zh: "比较非正规聚落形成的原因"
    zh-TW: "比較非正規聚落形成的原因"
    ja: "インフォーマル居住地の成因を比べる"
    ko: "비공식 정착지의 원인 비교하기"
    vi: "So sánh nguyên nhân hình thành định cư phi chính thức"
    ms: "Membandingkan punca penempatan tidak formal"
    id: "Membandingkan penyebab permukiman informal"
    hi: "अनौपचारिक बस्तियों के कारणों की तुलना"
  - en: "Present to a local community as a team"
    zh: "以团队形式向当地社区汇报"
    zh-TW: "以團隊形式向在地社區簡報"
    ja: "チームで地域住民に発表する"
    ko: "팀으로 지역 주민에게 발표하기"
    vi: "Cùng nhóm trình bày với cộng đồng địa phương"
    ms: "Membentang kepada komuniti tempatan secara berpasukan"
    id: "Presentasi tim kepada komunitas lokal"
    hi: "टीम के रूप में स्थानीय समुदाय को प्रस्तुति"
