code: GEOG30033
year: 2026
learn:
  en: "Past climates and landscapes of arid Australia over 2-3 million years, on a 10-day outback field trip plus lab work."
  zh: "通过10天内陆考察和实验，了解澳洲干旱区200-300万年来的气候与地貌。"
  zh-TW: "透過10天內陸考察與實驗，了解澳洲乾旱區200-300萬年來的氣候與地景。"
  ja: "10日間の内陸調査と実験で、乾燥オーストラリアの過去200〜300万年の気候と地形を学ぶ。"
  ko: "10일 내륙 답사와 실험으로 호주 건조지대의 200~300만 년 기후·지형을 배움."
  vi: "Khí hậu và cảnh quan vùng khô hạn Úc trong 2-3 triệu năm, qua 10 ngày thực địa nội địa và lab."
  ms: "Iklim dan landskap kawasan gersang Australia 2-3 juta tahun lalu, melalui lawatan 10 hari dan makmal."
  id: "Iklim dan lanskap kawasan kering Australia 2-3 juta tahun lalu, lewat kunjungan 10 hari dan lab."
  hi: "शुष्क ऑस्ट्रेलिया की 2-3 मिलियन वर्षों की जलवायु और परिदृश्य, 10 दिन की आउटबैक ट्रिप और लैब के साथ।"
outcomes:
  - en: "Apply field and lab methods to rebuild past environments"
    zh: "用野外和实验方法重建古环境"
    zh-TW: "用野外與實驗方法重建古環境"
    ja: "野外・実験手法で過去の環境を復元する"
    ko: "현장·실험 기법으로 과거 환경 복원하기"
    vi: "Dùng phương pháp thực địa và lab tái dựng môi trường cổ"
    ms: "Guna kaedah lapangan dan makmal bina semula alam purba"
    id: "Memakai metode lapangan dan lab merekonstruksi masa lalu"
    hi: "फ़ील्ड और लैब विधियों से पुराना पर्यावरण बनाना"
  - en: "Explain long- and short-term climate change"
    zh: "解释长期与短期气候变化"
    zh-TW: "解釋長期與短期氣候變化"
    ja: "長期・短期の気候変化を説明する"
    ko: "장단기 기후 변화 설명하기"
    vi: "Giải thích biến đổi khí hậu dài và ngắn hạn"
    ms: "Terangkan perubahan iklim jangka panjang dan pendek"
    id: "Menjelaskan perubahan iklim jangka panjang dan pendek"
    hi: "लंबी और छोटी अवधि का जलवायु बदलाव समझाना"
