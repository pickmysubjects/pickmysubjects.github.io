code: ENGR90039
year: 2027
learn:
  en: "Working out which problem is worth solving, through an industry-sponsored team innovation challenge and a second project."
  zh: "通过行业赞助的团队创新挑战和另一个项目，学会判断哪个问题值得解决。"
  zh-TW: "透過業界贊助的團隊創新挑戰與另一個專題，學會判斷哪個問題值得解決。"
  ja: "企業提供のチーム課題ともう1つのプロジェクトで、解くべき問題を見極める。"
  ko: "산업체 후원 팀 혁신 과제와 다른 프로젝트로 풀 가치 있는 문제 판단하기."
  vi: "Qua thử thách đổi mới do doanh nghiệp tài trợ và một dự án khác, học chọn vấn đề đáng giải."
  ms: "Melalui cabaran inovasi berpasukan tajaan industri dan projek kedua, tentukan masalah yang patut diselesaikan."
  id: "Lewat tantangan inovasi tim dari industri dan proyek kedua, menentukan masalah yang layak diselesaikan."
  hi: "उद्योग-प्रायोजित टीम इनोवेशन चुनौती और दूसरे प्रोजेक्ट से तय करना कि कौन-सी समस्या हल करने लायक है।"
outcomes:
  - en: "Choose the right problem to work on"
    zh: "选出值得解决的问题"
    zh-TW: "選出值得解決的問題"
    ja: "取り組むべき問題を選ぶ"
    ko: "다룰 올바른 문제 고르기"
    vi: "Chọn đúng vấn đề để giải"
    ms: "Pilih masalah yang betul untuk diusahakan"
    id: "Memilih masalah yang tepat untuk dikerjakan"
    hi: "काम के लिए सही समस्या चुनना"
  - en: "Deliver an innovation project in a multi-disciplinary team"
    zh: "在跨学科团队中完成创新项目"
    zh-TW: "在跨領域團隊中完成創新專題"
    ja: "分野横断チームで革新プロジェクトを進める"
    ko: "다학제 팀으로 혁신 프로젝트 수행하기"
    vi: "Thực hiện dự án đổi mới trong nhóm liên ngành"
    ms: "Laksana projek inovasi dalam pasukan pelbagai disiplin"
    id: "Menjalankan proyek inovasi dalam tim multidisiplin"
    hi: "बहु-विषयी टीम में इनोवेशन प्रोजेक्ट पूरा करना"
