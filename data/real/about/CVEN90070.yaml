code: CVEN90070
year: 2027
learn:
  en: "Planning and designing ports: port business, ships and berthing, harbour hydrodynamics, surveying and corrosion protection."
  zh: "港口的规划与设计：港口业务、船舶与靠泊、港池水动力、水道测量和防腐。"
  zh-TW: "港口的規劃與設計：港口業務、船舶與靠泊、港池水動力、水道測量與防蝕。"
  ja: "港湾の計画と設計：港の事業、船舶と着岸、港内水理、水路測量、防食。"
  ko: "항만 계획과 설계: 항만 사업, 선박과 접안, 항내 수리, 수로 측량, 방식."
  vi: "Quy hoạch và thiết kế cảng: kinh doanh cảng, tàu và cập bến, thủy động lực bến cảng, khảo sát thủy văn và chống ăn mòn."
  ms: "Perancangan dan reka bentuk pelabuhan: perniagaan pelabuhan, kapal dan tambatan, hidrodinamik pelabuhan, ukur hidrografi dan perlindungan karat."
  id: "Perencanaan dan desain pelabuhan: bisnis pelabuhan, kapal dan sandar, hidrodinamika kolam pelabuhan, survei hidrografi dan perlindungan korosi."
  hi: "बंदरगाहों की योजना और डिज़ाइन: बंदरगाह व्यवसाय, जहाज़ और बर्थिंग, बंदरगाह हाइड्रोडायनामिक्स, सर्वेक्षण और जंग से बचाव।"
outcomes:
  - en: "Explain the core topics of port and harbour engineering"
    zh: "解释港口与海港工程的核心内容"
    zh-TW: "解釋港口與港灣工程的核心內容"
    ja: "港湾工学の主要テーマを説明する"
    ko: "항만 공학의 핵심 주제 설명하기"
    vi: "Giải thích các chủ đề cốt lõi của kỹ thuật cảng"
    ms: "Menerangkan topik teras kejuruteraan pelabuhan"
    id: "Menjelaskan topik inti teknik pelabuhan"
    hi: "बंदरगाह इंजीनियरिंग के मुख्य विषय समझाना"
  - en: "Take a systems approach to port projects"
    zh: "以系统思路处理港口项目"
    zh-TW: "以系統思維處理港口專案"
    ja: "港湾事業にシステム的に取り組む"
    ko: "항만 사업에 시스템적으로 접근하기"
    vi: "Tiếp cận dự án cảng theo hướng hệ thống"
    ms: "Menggunakan pendekatan sistem dalam projek pelabuhan"
    id: "Memakai pendekatan sistem pada proyek pelabuhan"
    hi: "बंदरगाह परियोजनाओं में सिस्टम दृष्टिकोण अपनाना"
