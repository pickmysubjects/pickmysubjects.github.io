code: PSYC30020
year: 2026
learn:
  en: "How brain networks work together: brain chemicals and emotion, sleep, movement and the ethics of brain tech."
  zh: "大脑网络怎么协同：神经递质与情绪、睡眠、运动和脑科技伦理。"
  zh-TW: "大腦網路怎麼協同：神經傳導物質與情緒、睡眠、運動和腦科技倫理。"
  ja: "脳のネットワークの連携：脳内物質と感情、睡眠、運動、脳テクノロジーの倫理。"
  ko: "뇌 네트워크의 협동: 뇌 화학물질과 감정, 수면, 운동, 뇌 기술의 윤리."
  vi: "Các mạng lưới não phối hợp ra sao: hóa chất não và cảm xúc, giấc ngủ, vận động, đạo đức công nghệ não."
  ms: "Cara rangkaian otak bekerjasama: bahan kimia otak dan emosi, tidur, pergerakan dan etika teknologi otak."
  id: "Cara jaringan otak bekerja sama: zat kimia otak dan emosi, tidur, gerak, serta etika teknologi otak."
  hi: "दिमाग के नेटवर्क मिलकर कैसे काम करते हैं: ब्रेन केमिकल्स व भावनाएँ, नींद, गति और ब्रेन टेक की नैतिकता।"
outcomes:
  - en: "Analyse and interpret experimental data"
    zh: "分析和解读实验数据"
    zh-TW: "分析和解讀實驗數據"
    ja: "実験データを分析・解釈する"
    ko: "실험 데이터 분석·해석"
    vi: "Phân tích và giải thích dữ liệu thí nghiệm"
    ms: "Analisis dan tafsir data eksperimen"
    id: "Menganalisis dan menafsirkan data eksperimen"
    hi: "प्रयोग के डेटा का विश्लेषण व व्याख्या"
  - en: "Critically read neuroscience papers"
    zh: "批判性地读神经科学论文"
    zh-TW: "批判性地讀神經科學論文"
    ja: "神経科学の論文を批判的に読む"
    ko: "신경과학 논문을 비판적으로 읽기"
    vi: "Đọc có phản biện bài báo khoa học thần kinh"
    ms: "Baca kertas neurosains secara kritis"
    id: "Membaca makalah neurosains secara kritis"
    hi: "न्यूरोसाइंस पेपर आलोचनात्मक ढंग से पढ़ना"
  - en: "Discuss ethical issues of new brain technologies"
    zh: "讨论新脑科技带来的伦理问题"
    zh-TW: "討論新腦科技帶來的倫理問題"
    ja: "新しい脳テクノロジーの倫理的問題を論じる"
    ko: "새로운 뇌 기술의 윤리 문제 논의"
    vi: "Thảo luận vấn đề đạo đức của công nghệ não mới"
    ms: "Bincang isu etika teknologi otak baharu"
    id: "Membahas isu etika teknologi otak baru"
    hi: "नई ब्रेन तकनीकों के नैतिक मुद्दों पर चर्चा"
