code: CHEN90011
year: 2027
learn:
  en: "How domestic, industrial and farm wastes are treated, and how to design a wastewater plant."
  zh: "生活、工业和农业废物如何处理，以及如何设计污水处理厂。"
  zh-TW: "生活、工業與農業廢棄物如何處理，以及如何設計污水處理廠。"
  ja: "家庭・産業・農業の廃棄物処理と、排水処理施設の設計。"
  ko: "생활·산업·농업 폐기물 처리와 하수처리장 설계."
  vi: "Cách xử lý chất thải sinh hoạt, công nghiệp, nông nghiệp và thiết kế nhà máy xử lý nước thải."
  ms: "Cara sisa domestik, industri dan pertanian dirawat, serta mereka loji rawatan air sisa."
  id: "Cara limbah rumah tangga, industri, dan pertanian diolah, serta merancang IPAL."
  hi: "घरेलू, औद्योगिक और कृषि कचरे का उपचार और अपशिष्ट जल संयंत्र का डिज़ाइन।"
outcomes:
  - en: "Design key parts of a wastewater treatment plant"
    zh: "设计污水处理厂的关键部分"
    zh-TW: "設計污水處理廠的關鍵部分"
    ja: "排水処理施設の主要部分を設計する"
    ko: "하수처리장의 핵심 부분 설계하기"
    vi: "Thiết kế các phần chính của nhà máy xử lý nước thải"
    ms: "Mereka bahagian utama loji rawatan air sisa"
    id: "Merancang bagian utama IPAL"
    hi: "अपशिष्ट जल संयंत्र के मुख्य हिस्से डिज़ाइन करना"
  - en: "Test a bench-scale activated sludge unit in the lab"
    zh: "在实验室分析小型活性污泥装置"
    zh-TW: "在實驗室分析小型活性污泥裝置"
    ja: "実験室で小型の活性汚泥装置を分析する"
    ko: "실험실에서 소형 활성슬러지 장치 분석하기"
    vi: "Phân tích bể bùn hoạt tính quy mô nhỏ trong phòng thí nghiệm"
    ms: "Menganalisis unit enap cemar teraktif berskala kecil di makmal"
    id: "Menganalisis unit lumpur aktif skala kecil di lab"
    hi: "लैब में छोटे एक्टिवेटेड स्लज यूनिट का विश्लेषण"
