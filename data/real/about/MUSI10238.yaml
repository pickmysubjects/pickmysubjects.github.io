code: MUSI10238
year: 2026
learn:
  en: "An auditioned percussion ensemble for experienced players, rehearsing landmark works and new pieces on the full range of percussion."
  zh: "面向有经验演奏者的选拔制打击乐团，用全套打击乐器排练经典曲目和新作。"
  zh-TW: "面向有經驗演奏者的甄選制打擊樂團，用全套打擊樂器排練經典曲目與新作。"
  ja: "経験者向けのオーディション制打楽器アンサンブル。全種の打楽器で名作と新作を練習。"
  ko: "숙련자를 위한 오디션제 타악 앙상블. 모든 타악기로 명작과 신작을 연습."
  vi: "Nhóm bộ gõ tuyển chọn cho người có kinh nghiệm, tập tác phẩm kinh điển và mới với đủ loại bộ gõ."
  ms: "Ensembel perkusi beruji bakat untuk pemain berpengalaman, berlatih karya agung dan baharu dengan pelbagai perkusi."
  id: "Ansambel perkusi lewat audisi bagi pemain berpengalaman, berlatih karya penting dan baru dengan beragam perkusi."
  hi: "अनुभवी वादकों के लिए ऑडिशन वाला पर्कशन समूह, सभी तालवाद्यों पर प्रसिद्ध और नई रचनाएँ।"
outcomes:
  - en: "Play many percussion instruments in ensemble"
    zh: "在合奏中演奏多种打击乐器"
    zh-TW: "在合奏中演奏多種打擊樂器"
    ja: "合奏で多くの打楽器を演奏する"
    ko: "합주에서 여러 타악기 연주하기"
    vi: "Chơi nhiều loại bộ gõ trong nhóm"
    ms: "Main pelbagai alat perkusi dalam ensembel"
    id: "Memainkan banyak alat perkusi dalam ansambel"
    hi: "समूह में कई तालवाद्य बजाना"
  - en: "Learn parts across different styles"
    zh: "掌握不同风格的声部"
    zh-TW: "掌握不同風格的聲部"
    ja: "さまざまな様式のパートを習得する"
    ko: "다양한 양식의 파트 익히기"
    vi: "Học bè ở nhiều phong cách"
    ms: "Kuasai bahagian pelbagai gaya"
    id: "Menguasai partai berbagai gaya"
    hi: "अलग-अलग शैलियों के हिस्से सीखना"
  - en: "Perform in public concerts"
    zh: "在公开音乐会中演出"
    zh-TW: "在公開音樂會中演出"
    ja: "公開演奏会で演奏する"
    ko: "공개 연주회에서 공연하기"
    vi: "Biểu diễn trong buổi hòa nhạc công khai"
    ms: "Beraksi dalam konsert awam"
    id: "Tampil dalam konser publik"
    hi: "सार्वजनिक कॉन्सर्ट में प्रस्तुति"
