code: GEND20012
year: 2026
learn:
  en: "Feminist, queer and trans ideas of care for self, others and the world, through cases like yoga, meditation and dance."
  zh: "女性主义、酷儿和跨性别视角下对自我、他人和世界的照护，以瑜伽、冥想、舞蹈等为案例。"
  zh-TW: "女性主義、酷兒和跨性別視角下對自我、他人和世界的照護，以瑜伽、冥想、舞蹈等為案例。"
  ja: "自分、他者、世界へのケアを、フェミニズム、クィア、トランスの視点から。ヨガ、瞑想、ダンスなどを事例に。"
  ko: "자기, 타인, 세상을 돌보는 일을 페미니즘·퀴어·트랜스 관점에서. 요가, 명상, 춤 등을 사례로."
  vi: "Quan niệm nữ quyền, queer và chuyển giới về chăm sóc bản thân, người khác và thế giới, qua yoga, thiền, khiêu vũ."
  ms: "Idea feminis, queer dan trans tentang penjagaan diri, orang lain dan dunia, melalui kes seperti yoga, meditasi dan tarian."
  id: "Gagasan feminis, queer dan trans tentang merawat diri, orang lain dan dunia, lewat kasus seperti yoga, meditasi dan tari."
  hi: "खुद, दूसरों और दुनिया की देखभाल पर नारीवादी, क्वीयर और ट्रांस विचार, योग, ध्यान और नृत्य जैसे उदाहरणों से।"
outcomes:
  - en: "Explain how gender and power shape care"
    zh: "解释性别与权力如何影响照护"
    zh-TW: "解釋性別與權力如何影響照護"
    ja: "ジェンダーと権力がケアをどう形作るか説明する"
    ko: "젠더와 권력이 돌봄을 만드는 방식 설명하기"
    vi: "Giải thích giới và quyền lực định hình việc chăm sóc ra sao"
    ms: "Terangkan cara gender dan kuasa membentuk penjagaan"
    id: "Menjelaskan cara gender dan kuasa membentuk perawatan"
    hi: "जेंडर और सत्ता देखभाल को कैसे गढ़ते हैं, समझाना"
  - en: "Analyse everyday practices of care"
    zh: "分析日常的照护实践"
    zh-TW: "分析日常的照護實踐"
    ja: "日常のケアの実践を分析する"
    ko: "일상의 돌봄 실천 분석하기"
    vi: "Phân tích các thực hành chăm sóc thường ngày"
    ms: "Analisis amalan penjagaan harian"
    id: "Menganalisis praktik perawatan sehari-hari"
    hi: "रोज़मर्रा की देखभाल प्रथाओं का विश्लेषण करना"
  - en: "Reflect on the limits and failures of care"
    zh: "反思照护的局限与失败"
    zh-TW: "反思照護的侷限與失敗"
    ja: "ケアの限界と失敗を考える"
    ko: "돌봄의 한계와 실패 성찰하기"
    vi: "Suy ngẫm về giới hạn và thất bại của chăm sóc"
    ms: "Renungkan had dan kegagalan penjagaan"
    id: "Merefleksikan batas dan kegagalan perawatan"
    hi: "देखभाल की सीमाओं और विफलताओं पर विचार करना"
