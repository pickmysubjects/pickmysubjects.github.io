code: KORE30002
year: 2026
learn:
  en: "The foreign relations of South and North Korea since 1948, with Japan, China, the US, Russia and Australia."
  zh: "1948年以来韩国和朝鲜的对外关系，涉及日本、中国、美国、俄罗斯和澳大利亚。"
  zh-TW: "1948年以來南韓和北韓的對外關係，涉及日本、中國、美國、俄羅斯和澳洲。"
  ja: "1948年以降の韓国と北朝鮮の対外関係を、日本・中国・米国・ロシア・豪州との関係から学ぶ。"
  ko: "1948년 이후 남북한의 대외 관계를 일본, 중국, 미국, 러시아, 호주와의 관계로 배운다."
  vi: "Quan hệ đối ngoại của Hàn Quốc và Triều Tiên từ 1948 với Nhật, Trung Quốc, Mỹ, Nga và Úc."
  ms: "Hubungan luar Korea Selatan dan Utara sejak 1948 dengan Jepun, China, AS, Rusia dan Australia."
  id: "Hubungan luar negeri Korea Selatan dan Utara sejak 1948 dengan Jepang, Tiongkok, AS, Rusia, dan Australia."
  hi: "1948 से दक्षिण और उत्तर कोरिया के विदेश संबंध, जापान, चीन, अमेरिका, रूस और ऑस्ट्रेलिया के साथ।"
outcomes:
  - en: "Trace how the two Koreas grew apart"
    zh: "梳理两个朝鲜如何走向分化"
    zh-TW: "梳理兩韓如何走向分化"
    ja: "二つの朝鮮がどう分かれていったかたどる"
    ko: "남북한이 갈라진 과정 따라가기"
    vi: "Lần theo quá trình hai miền Triều Tiên tách xa nhau"
    ms: "Jejaki bagaimana dua Korea berpisah"
    id: "Menelusuri bagaimana dua Korea berpisah"
    hi: "दोनों कोरिया कैसे अलग हुए, क्रम समझना"
  - en: "Compare their relations with major powers"
    zh: "比较两国与大国的关系"
    zh-TW: "比較兩國與大國的關係"
    ja: "両国と大国との関係を比べる"
    ko: "두 나라와 강대국의 관계 비교하기"
    vi: "So sánh quan hệ của hai nước với các cường quốc"
    ms: "Bandingkan hubungan mereka dengan kuasa besar"
    id: "Membandingkan hubungan keduanya dengan negara besar"
    hi: "बड़ी शक्तियों से दोनों के संबंधों की तुलना करना"
  - en: "Analyse Korea's ties with Australia"
    zh: "分析朝鲜半岛与澳大利亚的关系"
    zh-TW: "分析朝鮮半島與澳洲的關係"
    ja: "朝鮮半島とオーストラリアの関係を分析する"
    ko: "한반도와 호주의 관계 분석하기"
    vi: "Phân tích quan hệ giữa Triều Tiên, Hàn Quốc và Úc"
    ms: "Analisis hubungan Korea dengan Australia"
    id: "Menganalisis hubungan Korea dengan Australia"
    hi: "कोरिया और ऑस्ट्रेलिया के संबंधों का विश्लेषण करना"
