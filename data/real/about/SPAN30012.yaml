code: SPAN30012
year: 2026
learn:
  en: "How music, film, art and street culture in Latin America have been used to protest and push for change."
  zh: "拉丁美洲的音乐、电影、艺术和街头文化如何被用来抗议和推动变革。"
  zh-TW: "拉丁美洲的音樂、電影、藝術和街頭文化如何被用來抗議和推動變革。"
  ja: "ラテンアメリカの音楽・映画・芸術・ストリート文化が抗議や変革にどう使われてきたか。"
  ko: "라틴아메리카의 음악·영화·예술·거리 문화가 저항과 변화에 어떻게 쓰였는지."
  vi: "Âm nhạc, phim, nghệ thuật và văn hóa đường phố Mỹ Latinh được dùng để phản kháng và đòi thay đổi ra sao."
  ms: "Cara muzik, filem, seni dan budaya jalanan di Amerika Latin digunakan untuk membantah dan menuntut perubahan."
  id: "Cara musik, film, seni dan budaya jalanan di Amerika Latin dipakai untuk protes dan mendorong perubahan."
  hi: "लैटिन अमेरिका में संगीत, फ़िल्म, कला और सड़क-संस्कृति का विरोध और बदलाव के लिए कैसे इस्तेमाल हुआ।"
outcomes:
  - en: "Analyse Latin American pop culture critically"
    zh: "批判性地分析拉美流行文化"
    zh-TW: "批判性地分析拉美流行文化"
    ja: "ラテンアメリカの大衆文化を批判的に分析する"
    ko: "라틴아메리카 대중문화 비판적으로 분석하기"
    vi: "Phân tích có phê phán văn hóa đại chúng Mỹ Latinh"
    ms: "Analisis budaya popular Amerika Latin secara kritis"
    id: "Menganalisis budaya pop Amerika Latin secara kritis"
    hi: "लैटिन अमेरिकी लोकप्रिय संस्कृति का आलोचनात्मक विश्लेषण करना"
  - en: "Link cultural works to protest movements"
    zh: "把文化作品和抗议运动联系起来"
    zh-TW: "把文化作品和抗議運動聯繫起來"
    ja: "文化作品を抗議運動と結びつける"
    ko: "문화 작품을 저항 운동과 연결하기"
    vi: "Liên hệ tác phẩm văn hóa với phong trào phản kháng"
    ms: "Kaitkan karya budaya dengan gerakan bantahan"
    id: "Mengaitkan karya budaya dengan gerakan protes"
    hi: "सांस्कृतिक रचनाओं को विरोध आंदोलनों से जोड़ना"
  - en: "Present group work in Spanish"
    zh: "用西班牙语展示小组成果"
    zh-TW: "用西班牙語展示小組成果"
    ja: "グループの成果をスペイン語で発表する"
    ko: "그룹 작업을 스페인어로 발표하기"
    vi: "Trình bày bài nhóm bằng tiếng Tây Ban Nha"
    ms: "Bentangkan kerja kumpulan dalam bahasa Sepanyol"
    id: "Mempresentasikan kerja kelompok dalam bahasa Spanyol"
    hi: "समूह कार्य स्पेनिश में प्रस्तुत करना"
