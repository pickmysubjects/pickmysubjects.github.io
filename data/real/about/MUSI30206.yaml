code: MUSI30206
year: 2026
learn:
  en: "Small vocal ensembles and opera scenes: tuning, breathing together, matching vowels and building stage roles. Pass/fail."
  zh: "小型声乐重唱与歌剧片段：音准、同步呼吸、统一元音与舞台角色。及格制。"
  zh-TW: "小型聲樂重唱與歌劇片段：音準、同步呼吸、統一母音與舞台角色。及格制。"
  ja: "小編成の重唱とオペラ場面。音程、呼吸、母音を合わせ役を作る。合否判定。"
  ko: "소규모 성악 중창과 오페라 장면: 음정·호흡·모음 맞추기와 역할. 합격/불합격."
  vi: "Hát nhóm nhỏ và cảnh opera: cao độ, thở cùng nhau, khớp nguyên âm, vai diễn. Đạt/không đạt."
  ms: "Ensembel vokal kecil dan babak opera: intonasi, pernafasan, vokal dan watak. Lulus/gagal."
  id: "Ansambel vokal kecil dan adegan opera: intonasi, napas, vokal dan peran. Lulus/gagal."
  hi: "छोटे गायन समूह और ओपेरा दृश्य: सुर, साथ साँस, स्वर मिलाना और भूमिका। पास/फ़ेल।"
outcomes:
  - en: "Tune and breathe together as a vocal group"
    zh: "作为重唱组统一音准与呼吸"
    zh-TW: "作為重唱組統一音準與呼吸"
    ja: "重唱として音程と呼吸をそろえる"
    ko: "중창으로 음정과 호흡 맞추기"
    vi: "Đồng bộ cao độ và hơi thở trong nhóm"
    ms: "Selaras nada dan pernafasan sebagai kumpulan"
    id: "Menyelaraskan nada dan napas sebagai grup"
    hi: "समूह के रूप में सुर और साँस मिलाना"
  - en: "Match pronunciation across voices"
    zh: "在各声部间统一发音"
    zh-TW: "在各聲部間統一發音"
    ja: "声部間で発音をそろえる"
    ko: "성부 간 발음 맞추기"
    vi: "Khớp phát âm giữa các bè"
    ms: "Seragamkan sebutan antara suara"
    id: "Menyamakan pelafalan antar suara"
    hi: "सभी आवाज़ों में उच्चारण मिलाना"
  - en: "Perform chamber vocal and opera ensemble scenes"
    zh: "演出室内声乐与歌剧重唱片段"
    zh-TW: "演出室內聲樂與歌劇重唱片段"
    ja: "室内声楽とオペラの重唱場面を演じる"
    ko: "실내 성악과 오페라 중창 장면 공연하기"
    vi: "Biểu diễn cảnh hát nhóm thính phòng và opera"
    ms: "Persembahkan babak vokal kamar dan opera"
    id: "Menampilkan adegan vokal kamar dan opera"
    hi: "चैम्बर गायन और ओपेरा समूह दृश्य प्रस्तुत करना"
