code: ARTS20003
year: 2026
learn:
  en: "How religions, philosophies and societies have made sense of death and dying, from Buddhist teaching to Australian practice today."
  zh: "宗教、哲学和社会如何理解死亡与临终，从佛教教义到当今澳大利亚的做法。"
  zh-TW: "宗教、哲學和社會如何理解死亡與臨終，從佛教教義到當今澳洲的做法。"
  ja: "仏教の教えから今のオーストラリアの慣習まで、宗教・哲学・社会が死と死にゆくことをどう理解してきたかを学ぶ。"
  ko: "불교 가르침부터 오늘날 호주의 관행까지 종교, 철학, 사회가 죽음과 임종을 어떻게 이해해 왔는지 배운다."
  vi: "Tôn giáo, triết học và xã hội hiểu về cái chết ra sao, từ giáo lý Phật giáo đến thực hành ở Úc ngày nay."
  ms: "Cara agama, falsafah dan masyarakat memahami kematian, daripada ajaran Buddha hingga amalan di Australia hari ini."
  id: "Cara agama, filsafat, dan masyarakat memaknai kematian, dari ajaran Buddha hingga praktik di Australia saat ini."
  hi: "धर्मों, दर्शनों और समाजों ने मृत्यु और मरने को कैसे समझा, बौद्ध शिक्षा से आज के ऑस्ट्रेलियाई तौर-तरीकों तक।"
outcomes:
  - en: "Compare religious views of death and afterlife"
    zh: "比较不同宗教对死亡与来世的看法"
    zh-TW: "比較不同宗教對死亡與來世的看法"
    ja: "死と来世についての宗教的見方を比べる"
    ko: "죽음과 내세에 대한 종교적 관점 비교하기"
    vi: "So sánh quan niệm tôn giáo về cái chết và thế giới bên kia"
    ms: "Bandingkan pandangan agama tentang kematian dan akhirat"
    id: "Membandingkan pandangan agama tentang kematian dan akhirat"
    hi: "मृत्यु और परलोक पर धार्मिक दृष्टियों की तुलना करना"
  - en: "Discuss ethical questions about dying"
    zh: "讨论关于临终的伦理问题"
    zh-TW: "討論關於臨終的倫理問題"
    ja: "死にゆくことをめぐる倫理的問題を論じる"
    ko: "임종에 관한 윤리적 질문 논의하기"
    vi: "Thảo luận các câu hỏi đạo đức về việc qua đời"
    ms: "Bincangkan persoalan etika tentang kematian"
    id: "Membahas pertanyaan etis seputar kematian"
    hi: "मरने से जुड़े नैतिक प्रश्नों पर चर्चा करना"
  - en: "Analyse death practices in Australia today"
    zh: "分析当今澳大利亚的丧葬与临终做法"
    zh-TW: "分析當今澳洲的喪葬與臨終做法"
    ja: "今のオーストラリアの死をめぐる慣習を分析する"
    ko: "오늘날 호주의 죽음 관련 관행 분석하기"
    vi: "Phân tích tập quán liên quan đến cái chết ở Úc ngày nay"
    ms: "Analisis amalan berkaitan kematian di Australia kini"
    id: "Menganalisis praktik seputar kematian di Australia kini"
    hi: "आज ऑस्ट्रेलिया में मृत्यु से जुड़ी प्रथाओं का विश्लेषण करना"
