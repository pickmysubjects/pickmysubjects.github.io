code: CVEN90066
year: 2027
learn:
  en: "Measuring, analysing and predicting ocean waves and tides, with an introduction to numerical wave modelling."
  zh: "海浪和潮汐的观测、分析与预测，并入门数值波浪模拟。"
  zh-TW: "海浪與潮汐的觀測、分析與預測，並入門數值波浪模擬。"
  ja: "波浪と潮汐の観測・解析・予測と、数値波浪モデルの入門。"
  ko: "파랑과 조석의 관측·분석·예측, 그리고 수치 파랑 모델링 입문."
  vi: "Đo đạc, phân tích và dự báo sóng biển, thủy triều, cùng nhập môn mô hình sóng số."
  ms: "Mengukur, menganalisis dan meramal ombak serta pasang surut, dengan pengenalan pemodelan ombak berangka."
  id: "Mengukur, menganalisis dan memprediksi gelombang laut serta pasang surut, dengan pengantar pemodelan gelombang numerik."
  hi: "समुद्री लहरों और ज्वार का मापन, विश्लेषण और पूर्वानुमान, साथ में न्यूमेरिकल वेव मॉडलिंग का परिचय।"
outcomes:
  - en: "Explain the basics of marine hydrodynamics"
    zh: "解释海洋水动力学的基础"
    zh-TW: "解釋海洋水動力學的基礎"
    ja: "海洋水理学の基礎を説明する"
    ko: "해양 수리역학의 기초 설명하기"
    vi: "Giải thích cơ bản về thủy động lực học biển"
    ms: "Menerangkan asas hidrodinamik marin"
    id: "Menjelaskan dasar hidrodinamika laut"
    hi: "समुद्री हाइड्रोडायनामिक्स की मूल बातें समझाना"
  - en: "Analyse field and lab wave data"
    zh: "分析现场和实验室的波浪数据"
    zh-TW: "分析現場與實驗室的波浪資料"
    ja: "現地・実験の波浪データを解析する"
    ko: "현장·실험 파랑 데이터 분석하기"
    vi: "Phân tích dữ liệu sóng hiện trường và phòng thí nghiệm"
    ms: "Menganalisis data ombak lapangan dan makmal"
    id: "Menganalisis data gelombang lapangan dan laboratorium"
    hi: "फ़ील्ड और लैब की लहर डेटा का विश्लेषण"
  - en: "Model sea conditions for coastal and maritime work"
    zh: "为海岸和海事工程模拟海况"
    zh-TW: "為海岸與海事工程模擬海況"
    ja: "沿岸・海洋工事のための海象をモデル化する"
    ko: "연안·해양 공사를 위한 해상 조건 모델링하기"
    vi: "Mô hình điều kiện biển cho công trình ven biển và hàng hải"
    ms: "Memodelkan keadaan laut untuk kerja pantai dan maritim"
    id: "Memodelkan kondisi laut untuk pekerjaan pantai dan maritim"
    hi: "तटीय और समुद्री कार्य के लिए समुद्री स्थितियों का मॉडल बनाना"
