code: MAST90051
year: 2027
learn:
  en: "The maths of financial market risk: loss distributions, risk measures, copulas, dependence and extreme values."
  zh: "金融市场风险的数学：损失分布、风险度量、Copula、相依性与极值理论。"
  zh-TW: "金融市場風險的數學：損失分布、風險測度、Copula、相依性與極值理論。"
  ja: "市場リスクの数学：損失分布、リスク尺度、コピュラ、依存性、極値理論。"
  ko: "시장 위험의 수학: 손실분포, 위험척도, 코퓰라, 의존성, 극단값 이론."
  vi: "Toán rủi ro thị trường: phân phối tổn thất, thước đo rủi ro, copula, phụ thuộc, giá trị cực trị."
  ms: "Matematik risiko pasaran: taburan kerugian, ukuran risiko, kopula, kebergantungan dan nilai ekstrem."
  id: "Matematika risiko pasar: distribusi kerugian, ukuran risiko, kopula, dependensi, nilai ekstrem."
  hi: "बाज़ार जोखिम का गणित: लॉस वितरण, जोखिम माप, कोपुला, निर्भरता और एक्सट्रीम वैल्यू।"
outcomes:
  - en: "Calculate and compare measures of financial risk"
    zh: "计算并比较金融风险度量"
    zh-TW: "計算並比較金融風險測度"
    ja: "金融リスク尺度を計算・比較する"
    ko: "금융 위험 척도 계산·비교하기"
    vi: "Tính và so sánh các thước đo rủi ro tài chính"
    ms: "Mengira dan membanding ukuran risiko kewangan"
    id: "Menghitung dan membandingkan ukuran risiko keuangan"
    hi: "वित्तीय जोखिम माप निकालना और तुलना करना"
  - en: "Model dependence and extreme losses"
    zh: "为相依性和极端损失建模"
    zh-TW: "為相依性與極端損失建模"
    ja: "依存関係と極端な損失をモデル化する"
    ko: "의존성과 극단적 손실 모델링하기"
    vi: "Mô hình hóa sự phụ thuộc và tổn thất cực đoan"
    ms: "Memodelkan kebergantungan dan kerugian ekstrem"
    id: "Memodelkan dependensi dan kerugian ekstrem"
    hi: "निर्भरता और चरम नुकसान का मॉडल बनाना"
