code: MCEN90048
year: 2027
learn:
  en: "Deep learning, reinforcement learning and generative AI, applied to engineering problems."
  zh: "深度学习、强化学习和生成式 AI 在工程中的应用。"
  zh-TW: "深度學習、強化學習與生成式 AI 在工程中的應用。"
  ja: "深層学習、強化学習、生成AIの工学への応用。"
  ko: "딥러닝, 강화학습, 생성형 AI의 공학 응용."
  vi: "Học sâu, học tăng cường và AI tạo sinh cho bài toán kỹ thuật."
  ms: "Pembelajaran mendalam, pembelajaran pengukuhan dan AI generatif untuk kejuruteraan."
  id: "Deep learning, reinforcement learning, dan AI generatif untuk masalah teknik."
  hi: "डीप लर्निंग, रिइन्फ़ोर्समेंट लर्निंग और जनरेटिव AI का इंजीनियरिंग में उपयोग।"
outcomes:
  - en: "Explain neural networks and learning algorithms"
    zh: "解释神经网络和各类学习算法"
    zh-TW: "解釋神經網路與各類學習演算法"
    ja: "ニューラルネットと学習アルゴリズムを説明する"
    ko: "신경망과 학습 알고리즘 설명하기"
    vi: "Giải thích mạng nơ-ron và thuật toán học"
    ms: "Menerangkan rangkaian neural dan algoritma pembelajaran"
    id: "Menjelaskan jaringan saraf dan algoritma pembelajaran"
    hi: "न्यूरल नेटवर्क और लर्निंग एल्गोरिद्म समझाना"
  - en: "Apply AI methods to real and synthetic data"
    zh: "把 AI 方法用于真实和合成数据"
    zh-TW: "把 AI 方法用於真實與合成資料"
    ja: "実データと合成データにAI手法を使う"
    ko: "실제·합성 데이터에 AI 기법 적용하기"
    vi: "Áp dụng AI cho dữ liệu thật và tổng hợp"
    ms: "Menggunakan kaedah AI pada data sebenar dan sintetik"
    id: "Menerapkan metode AI pada data nyata dan sintetis"
    hi: "असली और सिंथेटिक डेटा पर AI विधियाँ लागू करना"
