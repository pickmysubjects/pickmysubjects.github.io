code: POLS30019
year: 2026
learn:
  en: "Australia's foreign policy: the US alliance, ties with Asia, and issues like trade, aid, climate talks and asylum seekers."
  zh: "澳大利亚外交政策的国内外背景：澳美同盟、与亚洲的关系，以及贸易、援助、气候谈判和寻求庇护者等议题。"
  zh-TW: "澳洲外交政策的國內外背景：澳美同盟、與亞洲的關係，以及貿易、援助、氣候談判和尋求庇護者等議題。"
  ja: "オーストラリア外交の国内外の背景、米国との同盟、アジアとの関係、そして貿易、援助、気候交渉、庇護希望者などの課題を学ぶ。"
  ko: "호주 외교 정책의 국내외 배경, 미국과의 동맹, 아시아와의 관계, 무역, 원조, 기후 협상, 망명 신청자 같은 문제를 다룬다."
  vi: "Chính sách đối ngoại Úc trong và ngoài nước: liên minh với Mỹ, quan hệ với châu Á, và các vấn đề như thương mại, viện trợ, đàm phán khí hậu, người xin tị nạn."
  ms: "Dasar luar Australia di dalam dan luar negara: pakatan dengan AS, hubungan dengan Asia, dan isu seperti perdagangan, bantuan, rundingan iklim dan pencari suaka."
  id: "Kebijakan luar negeri Australia di dalam dan luar negeri: aliansi dengan AS, hubungan dengan Asia, serta isu perdagangan, bantuan, perundingan iklim, dan pencari suaka."
  hi: "ऑस्ट्रेलिया की विदेश नीति देश और दुनिया के संदर्भ में: अमेरिका से गठबंधन, एशिया से रिश्ते, और व्यापार, सहायता, जलवायु वार्ता व शरण चाहने वालों जैसे मुद्दे।"
outcomes:
  - en: "Explain the main drivers of Australian foreign policy"
    zh: "说明澳大利亚外交政策的主要驱动因素"
    zh-TW: "說明澳洲外交政策的主要驅動因素"
    ja: "オーストラリア外交を動かす主な要因を説明する"
    ko: "호주 외교 정책의 주요 동인 설명하기"
    vi: "Giải thích các động lực chính của chính sách đối ngoại Úc"
    ms: "Terangkan pendorong utama dasar luar Australia"
    id: "Menjelaskan pendorong utama kebijakan luar negeri Australia"
    hi: "ऑस्ट्रेलियाई विदेश नीति के मुख्य कारण समझाना"
  - en: "Assess Australia's key relationships, including the US"
    zh: "评估澳大利亚的重要外交关系，包括与美国的关系"
    zh-TW: "評估澳洲的重要外交關係，包括與美國的關係"
    ja: "米国を含むオーストラリアの重要な関係を評価する"
    ko: "미국을 포함한 호주의 주요 관계 평가하기"
    vi: "Đánh giá các mối quan hệ chính của Úc, gồm cả với Mỹ"
    ms: "Nilai hubungan utama Australia, termasuk dengan AS"
    id: "Menilai hubungan penting Australia, termasuk dengan AS"
    hi: "अमेरिका समेत ऑस्ट्रेलिया के अहम रिश्तों का आकलन करना"
  - en: "Debate current foreign policy issues"
    zh: "讨论当前的外交政策议题"
    zh-TW: "討論當前的外交政策議題"
    ja: "今の外交政策の課題を議論する"
    ko: "현재 외교 정책 쟁점 토론하기"
    vi: "Tranh luận về các vấn đề đối ngoại hiện nay"
    ms: "Bahaskan isu dasar luar semasa"
    id: "Memperdebatkan isu kebijakan luar negeri terkini"
    hi: "विदेश नीति के मौजूदा मुद्दों पर बहस करना"
