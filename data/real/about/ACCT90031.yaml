code: ACCT90031
year: 2027
learn:
  en: "Producing, reporting and using social and environmental information when organisations make decisions."
  zh: "组织决策中社会与环境信息的生成、报告和使用。"
  zh-TW: "組織決策中社會與環境資訊的產生、報導與運用。"
  ja: "組織の意思決定における社会・環境情報の作成、報告、活用。"
  ko: "조직 의사결정에서 사회·환경 정보의 생산, 보고, 활용."
  vi: "Tạo lập, báo cáo và sử dụng thông tin xã hội, môi trường khi tổ chức ra quyết định."
  ms: "Menghasilkan, melapor dan menggunakan maklumat sosial dan alam sekitar dalam keputusan organisasi."
  id: "Menyusun, melaporkan, dan memakai informasi sosial dan lingkungan dalam keputusan organisasi."
  hi: "संगठनों के निर्णयों में सामाजिक और पर्यावरणीय जानकारी तैयार करना, रिपोर्ट करना और उपयोग करना।"
outcomes:
  - en: "Evaluate stakeholders' demands for sustainability data"
    zh: "评价利益相关者对可持续信息的需求"
    zh-TW: "評價利害關係人對永續資訊的需求"
    ja: "サステナビリティ情報への利害関係者の要求を評価する"
    ko: "지속가능성 정보에 대한 이해관계자 요구 평가하기"
    vi: "Đánh giá nhu cầu thông tin bền vững của các bên liên quan"
    ms: "Menilai permintaan pihak berkepentingan terhadap data kelestarian"
    id: "Mengevaluasi tuntutan pemangku kepentingan atas data keberlanjutan"
    hi: "स्थिरता डेटा के लिए हितधारकों की माँग का मूल्यांकन"
  - en: "Use non-financial information in decisions"
    zh: "在决策中运用非财务信息"
    zh-TW: "在決策中運用非財務資訊"
    ja: "非財務情報を意思決定に使う"
    ko: "의사결정에 비재무 정보 활용하기"
    vi: "Dùng thông tin phi tài chính khi ra quyết định"
    ms: "Menggunakan maklumat bukan kewangan dalam keputusan"
    id: "Memakai informasi nonkeuangan dalam keputusan"
    hi: "निर्णयों में गैर-वित्तीय जानकारी का उपयोग"
