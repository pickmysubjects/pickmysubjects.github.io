code: SOCI30015
year: 2026
learn:
  en: "How work and jobs are organised and changing, and how they can reproduce social inequality."
  zh: "工作与职业如何组织和变化，以及它们如何再生产社会不平等。"
  zh-TW: "工作與職業如何組織和變化，以及它們如何再生產社會不平等。"
  ja: "仕事や職業がどう組み立てられ変わっていくか、それが社会的不平等をどう再生産するかを学ぶ。"
  ko: "일과 직업이 어떻게 조직되고 변하는지, 그리고 사회 불평등을 어떻게 재생산하는지 배운다."
  vi: "Công việc và nghề nghiệp được tổ chức và thay đổi thế nào, và chúng tái tạo bất bình đẳng xã hội ra sao."
  ms: "Cara kerja dan pekerjaan disusun serta berubah, dan bagaimana ia boleh mengekalkan ketaksamaan sosial."
  id: "Cara kerja dan pekerjaan diatur serta berubah, dan bagaimana keduanya bisa melanggengkan ketimpangan sosial."
  hi: "काम और नौकरियां कैसे संगठित होती और बदलती हैं, और वे सामाजिक असमानता को कैसे दोहरा सकती हैं।"
outcomes:
  - en: "Explain sociological views on work and occupations"
    zh: "说明社会学对工作与职业的看法"
    zh-TW: "說明社會學對工作與職業的看法"
    ja: "仕事と職業についての社会学的見方を説明する"
    ko: "일과 직업에 대한 사회학적 관점 설명하기"
    vi: "Giải thích quan điểm xã hội học về công việc và nghề nghiệp"
    ms: "Terangkan pandangan sosiologi tentang kerja dan pekerjaan"
    id: "Menjelaskan pandangan sosiologis tentang kerja dan profesi"
    hi: "काम और पेशों पर समाजशास्त्रीय नज़रिए समझाना"
  - en: "Analyse how work reproduces inequality"
    zh: "分析工作如何再生产不平等"
    zh-TW: "分析工作如何再生產不平等"
    ja: "仕事が不平等をどう再生産するか分析する"
    ko: "일이 불평등을 재생산하는 방식 분석하기"
    vi: "Phân tích công việc tái tạo bất bình đẳng ra sao"
    ms: "Analisis cara kerja mengekalkan ketaksamaan"
    id: "Menganalisis cara kerja melanggengkan ketimpangan"
    hi: "काम असमानता को कैसे दोहराता है, विश्लेषण करना"
  - en: "Discuss current changes in the world of work"
    zh: "讨论当今职场正在发生的变化"
    zh-TW: "討論當今職場正在發生的變化"
    ja: "いま起きている働き方の変化を論じる"
    ko: "오늘날 일의 세계에서 일어나는 변화 논의하기"
    vi: "Thảo luận những thay đổi hiện nay trong thế giới việc làm"
    ms: "Bincangkan perubahan semasa dalam dunia kerja"
    id: "Membahas perubahan terkini di dunia kerja"
    hi: "काम की दुनिया में मौजूदा बदलावों पर चर्चा करना"
