code: ABPL90330
year: 2027
learn:
  en: "Construction industry economics: its place in the national economy, how firms work, and statistics on construction data."
  zh: "建筑业经济学：在国民经济中的地位、企业如何运作，以及建筑数据的统计分析。"
  zh-TW: "營建業經濟學：在國民經濟中的地位、企業如何運作，以及營建數據的統計分析。"
  ja: "建設業の経済学：国民経済での位置、企業の動き、建設データの統計分析。"
  ko: "건설산업 경제학: 국민경제 내 위치, 기업 운영, 건설 데이터 통계 분석."
  vi: "Kinh tế ngành xây dựng: vị trí trong nền kinh tế, cách doanh nghiệp vận hành, phân tích thống kê."
  ms: "Ekonomi industri pembinaan: peranan dalam ekonomi negara, operasi firma dan analisis statistik."
  id: "Ekonomi industri konstruksi: peran dalam ekonomi nasional, operasi perusahaan dan analisis statistik."
  hi: "निर्माण उद्योग का अर्थशास्त्र: राष्ट्रीय अर्थव्यवस्था में भूमिका, फ़र्में और सांख्यिकीय विश्लेषण।"
outcomes:
  - en: "Explain economic roles within the construction industry"
    zh: "解释建筑业内部的经济关系"
    zh-TW: "解釋營建業內部的經濟關係"
    ja: "建設業内の経済的な役割を説明する"
    ko: "건설산업 내 경제적 역할 설명하기"
    vi: "Giải thích vai trò kinh tế trong ngành xây dựng"
    ms: "Menerangkan peranan ekonomi dalam industri pembinaan"
    id: "Menjelaskan peran ekonomi di industri konstruksi"
    hi: "निर्माण उद्योग में आर्थिक भूमिकाएँ समझाना"
  - en: "Apply the multiplier and accelerator to construction"
    zh: "把乘数和加速数概念用于建筑业"
    zh-TW: "把乘數與加速數概念用於營建業"
    ja: "乗数と加速度原理を建設に当てはめる"
    ko: "승수와 가속도 원리를 건설에 적용하기"
    vi: "Áp dụng số nhân và gia tốc vào xây dựng"
    ms: "Menggunakan konsep pengganda dan pemecut"
    id: "Menerapkan konsep pengganda dan akselerator"
    hi: "गुणक और त्वरक सिद्धांत निर्माण पर लागू करना"
