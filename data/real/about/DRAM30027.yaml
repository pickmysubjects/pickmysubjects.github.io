code: DRAM30027
year: 2026
learn:
  en: "Work with professional directors on a public play season and a screen project, applying character and script analysis."
  zh: "与专业导演合作，完成公开的舞台演出季和一个影视项目。"
  zh-TW: "與專業導演合作，完成公開的舞台演出季和一個影視專案。"
  ja: "プロの演出家と公開公演と映像作品に取り組み、役と台本の分析を生かす。"
  ko: "전문 연출가와 공개 공연 시즌과 영상 프로젝트를 함께하며 인물·대본 분석을 적용한다."
  vi: "Làm việc với đạo diễn chuyên nghiệp trong mùa diễn công khai và một dự án màn ảnh."
  ms: "Bekerja dengan pengarah profesional dalam musim pementasan awam dan projek skrin."
  id: "Bekerja dengan sutradara profesional untuk musim pentas publik dan proyek layar."
  hi: "पेशेवर निर्देशकों के साथ सार्वजनिक नाटक सीज़न और स्क्रीन प्रोजेक्ट, किरदार और स्क्रिप्ट विश्लेषण के साथ।"
outcomes:
  - en: "Act for the camera as well as the stage"
    zh: "既能演舞台也能演镜头"
    zh-TW: "既能演舞台也能演鏡頭"
    ja: "舞台だけでなくカメラの前でも演じる"
    ko: "무대뿐 아니라 카메라 앞에서도 연기하기"
    vi: "Diễn trước ống kính lẫn trên sân khấu"
    ms: "Berlakon untuk kamera dan pentas"
    id: "Berakting untuk kamera dan panggung"
    hi: "मंच के साथ कैमरे के लिए भी अभिनय"
  - en: "Sustain a role across a public season"
    zh: "在公开演出季中保持角色质量"
    zh-TW: "在公開演出季中維持角色品質"
    ja: "公開公演の期間中、役を保ち続ける"
    ko: "공개 시즌 내내 배역 유지하기"
    vi: "Giữ vững vai diễn suốt mùa diễn công khai"
    ms: "Kekalkan watak sepanjang musim awam"
    id: "Menjaga peran sepanjang musim publik"
    hi: "सार्वजनिक सीज़न भर किरदार को बनाए रखना"
  - en: "Work professionally with a director"
    zh: "与导演专业地合作"
    zh-TW: "與導演專業地合作"
    ja: "演出家とプロとして協働する"
    ko: "연출가와 전문적으로 협업하기"
    vi: "Làm việc chuyên nghiệp với đạo diễn"
    ms: "Bekerja secara profesional dengan pengarah"
    id: "Bekerja profesional dengan sutradara"
    hi: "निर्देशक के साथ पेशेवर ढंग से काम"
