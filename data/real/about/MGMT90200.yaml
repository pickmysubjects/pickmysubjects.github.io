code: MGMT90200
year: 2027
learn:
  en: "Advanced strategic management: where competitive advantage comes from and how firms sustain it."
  zh: "战略管理进阶：竞争优势从何而来，企业如何保持它。"
  zh-TW: "策略管理進階：競爭優勢從何而來，企業如何維持它。"
  ja: "戦略経営の発展：競争優位の源泉と、それを維持する方法。"
  ko: "전략경영 심화: 경쟁우위의 원천과 기업이 이를 유지하는 방법."
  vi: "Quản trị chiến lược nâng cao: lợi thế cạnh tranh đến từ đâu và cách duy trì."
  ms: "Pengurusan strategik lanjutan: punca kelebihan daya saing dan cara mengekalkannya."
  id: "Manajemen strategis lanjutan: sumber keunggulan bersaing dan cara mempertahankannya."
  hi: "उन्नत रणनीतिक प्रबंधन: प्रतिस्पर्धी बढ़त कहाँ से आती है और कैसे बनी रहती है।"
outcomes:
  - en: "Explain how strategy builds competitive advantage"
    zh: "解释战略如何建立竞争优势"
    zh-TW: "解釋策略如何建立競爭優勢"
    ja: "戦略が競争優位を生む仕組みを説明する"
    ko: "전략이 경쟁우위를 만드는 방식 설명하기"
    vi: "Giải thích chiến lược tạo lợi thế cạnh tranh ra sao"
    ms: "Menerangkan cara strategi membina kelebihan daya saing"
    id: "Menjelaskan cara strategi membangun keunggulan bersaing"
    hi: "रणनीति से प्रतिस्पर्धी बढ़त बनाना समझाना"
  - en: "Analyse complex management decisions with theory"
    zh: "用理论工具分析复杂的管理决策"
    zh-TW: "用理論工具分析複雜的管理決策"
    ja: "理論を使って複雑な経営判断を分析する"
    ko: "이론으로 복잡한 경영 결정 분석하기"
    vi: "Phân tích quyết định quản trị phức tạp bằng lý thuyết"
    ms: "Menganalisis keputusan pengurusan kompleks dengan teori"
    id: "Menganalisis keputusan manajemen rumit dengan teori"
    hi: "सिद्धांत से जटिल प्रबंधन निर्णयों का विश्लेषण"
  - en: "Evaluate trends in the competitive environment"
    zh: "评估竞争环境中的趋势"
    zh-TW: "評估競爭環境中的趨勢"
    ja: "競争環境の動向を評価する"
    ko: "경쟁 환경의 추세 평가하기"
    vi: "Đánh giá xu hướng của môi trường cạnh tranh"
    ms: "Menilai trend persekitaran persaingan"
    id: "Menilai tren lingkungan persaingan"
    hi: "प्रतिस्पर्धी माहौल के रुझानों का आकलन"
