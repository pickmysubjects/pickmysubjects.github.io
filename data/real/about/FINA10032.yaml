code: FINA10032
year: 2026
learn:
  en: "Art and modernity from the late 1800s through the 1900s: the avant-gardes, modernism and how to read them."
  zh: "19世纪末至20世纪的艺术与现代性：先锋派、现代主义及其解读方法。"
  zh-TW: "19世紀末至20世紀的藝術與現代性：前衛派、現代主義及其解讀方法。"
  ja: "19世紀末から20世紀の美術と近代性：前衛、モダニズム、その読み解き方。"
  ko: "19세기 말~20세기의 미술과 근대성: 아방가르드, 모더니즘과 그 해석법."
  vi: "Nghệ thuật và hiện đại từ cuối thế kỷ 19 qua thế kỷ 20: tiên phong, chủ nghĩa hiện đại và cách đọc chúng."
  ms: "Seni dan kemodenan dari akhir 1800-an hingga 1900-an: avant-garde, modenisme dan cara membacanya."
  id: "Seni dan modernitas dari akhir 1800-an hingga 1900-an: avant-garde, modernisme, dan cara membacanya."
  hi: "1800 के अंत से 1900 तक कला और आधुनिकता: अवाँ-गार्द, मॉडर्निज़्म और उन्हें पढ़ना।"
outcomes:
  - en: "Explain what modernism meant for art"
    zh: "说明现代主义对艺术的意义"
    zh-TW: "說明現代主義對藝術的意義"
    ja: "モダニズムが美術に意味したことを説明する"
    ko: "모더니즘이 미술에 갖는 의미 설명하기"
    vi: "Giải thích chủ nghĩa hiện đại có ý nghĩa gì với nghệ thuật"
    ms: "Jelaskan makna modenisme bagi seni"
    id: "Menjelaskan arti modernisme bagi seni"
    hi: "कला के लिए मॉडर्निज़्म का अर्थ समझाना"
  - en: "Interpret modern artworks in context"
    zh: "结合背景解读现代艺术作品"
    zh-TW: "結合背景解讀現代藝術作品"
    ja: "近代の作品を文脈の中で解釈する"
    ko: "근대 작품을 맥락 속에서 해석하기"
    vi: "Diễn giải tác phẩm hiện đại trong bối cảnh"
    ms: "Tafsir karya moden dalam konteksnya"
    id: "Menafsirkan karya modern sesuai konteks"
    hi: "आधुनिक कलाकृतियों की संदर्भ में व्याख्या करना"
  - en: "Write a researched argument about art"
    zh: "撰写有研究支撑的艺术论述"
    zh-TW: "撰寫有研究支撐的藝術論述"
    ja: "調査に基づく美術の論考を書く"
    ko: "조사에 근거한 미술 논증 쓰기"
    vi: "Viết lập luận có nghiên cứu về nghệ thuật"
    ms: "Tulis hujah berasaskan kajian tentang seni"
    id: "Menulis argumen seni berbasis riset"
    hi: "कला पर रिसर्च आधारित तर्क लिखना"
