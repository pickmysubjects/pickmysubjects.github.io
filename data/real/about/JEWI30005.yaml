code: JEWI30005
year: 2026
learn:
  en: "Hebrew and Jewish Studies capstone: plan and carry out your own research on Jewish culture, history, literature or thought."
  zh: "希伯来与犹太研究专业毕业课：自主策划并完成关于犹太文化、历史、文学或思想的研究。"
  zh-TW: "希伯來與猶太研究主修畢業課：自主策劃並完成關於猶太文化、歷史、文學或思想的研究。"
  ja: "ヘブライ・ユダヤ研究専攻の総まとめ科目。ユダヤの文化、歴史、文学、思想について自分の研究を行う。"
  ko: "히브리·유대학 전공 캡스톤. 유대 문화, 역사, 문학, 사상에 대한 자신의 연구를 계획하고 수행한다."
  vi: "Môn tổng kết ngành Hebrew và Do Thái học: tự lên kế hoạch và nghiên cứu về văn hóa, lịch sử, văn học hay tư tưởng Do Thái."
  ms: "Subjek puncak Pengajian Ibrani dan Yahudi: rancang dan jalankan kajian sendiri tentang budaya, sejarah, sastera atau pemikiran Yahudi."
  id: "Mata kuliah puncak Studi Ibrani dan Yahudi: rancang dan jalankan riset sendiri tentang budaya, sejarah, sastra atau pemikiran Yahudi."
  hi: "हिब्रू व यहूदी अध्ययन का कैपस्टोन: यहूदी संस्कृति, इतिहास, साहित्य या चिंतन पर अपना शोध बनाना और करना।"
outcomes:
  - en: "Plan and complete an independent research project"
    zh: "策划并完成独立研究项目"
    zh-TW: "策劃並完成獨立研究專題"
    ja: "独自の研究プロジェクトを計画し完成させる"
    ko: "독립 연구 프로젝트 기획하고 완성하기"
    vi: "Lập kế hoạch và hoàn thành dự án nghiên cứu độc lập"
    ms: "Rancang dan siapkan projek penyelidikan sendiri"
    id: "Merencanakan dan menyelesaikan proyek riset mandiri"
    hi: "स्वतंत्र शोध प्रोजेक्ट की योजना बनाना और पूरा करना"
  - en: "Critically assess sources and scholarship"
    zh: "批判性地评估史料和学术文献"
    zh-TW: "批判性地評估史料和學術文獻"
    ja: "資料と先行研究を批判的に評価する"
    ko: "자료와 선행 연구를 비판적으로 평가하기"
    vi: "Đánh giá có phê phán nguồn tư liệu và nghiên cứu"
    ms: "Nilai sumber dan kajian ilmiah secara kritis"
    id: "Menilai sumber dan kajian ilmiah secara kritis"
    hi: "स्रोतों और विद्वत्तापूर्ण लेखन का आलोचनात्मक आकलन करना"
  - en: "Reflect on Jewish contributions to culture and thought"
    zh: "思考犹太人对文化和思想的贡献"
    zh-TW: "思考猶太人對文化和思想的貢獻"
    ja: "文化と思想へのユダヤの貢献を考察する"
    ko: "문화와 사상에 대한 유대인의 기여 성찰하기"
    vi: "Suy ngẫm về đóng góp của người Do Thái cho văn hóa, tư tưởng"
    ms: "Renungkan sumbangan Yahudi kepada budaya dan pemikiran"
    id: "Merenungkan kontribusi Yahudi bagi budaya dan pemikiran"
    hi: "संस्कृति और चिंतन में यहूदी योगदान पर विचार करना"
