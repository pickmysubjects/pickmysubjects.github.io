code: ANTH30027
year: 2026
learn:
  en: "A cross-cultural look at gender and sexuality, using ethnographic cases on kinship, masculinity, third genders and more."
  zh: "跨文化看性别与性，借助亲属关系、男性气质、第三性别等民族志案例。"
  zh-TW: "跨文化看性別與性，借助親屬關係、男性氣質、第三性別等民族誌案例。"
  ja: "親族、男らしさ、第三の性などの民族誌事例を使い、ジェンダーとセクシュアリティを文化横断的に見る。"
  ko: "친족, 남성성, 제3의 성 등의 민족지 사례로 젠더와 섹슈얼리티를 문화 간에 살펴본다."
  vi: "Nhìn giới và tính dục giữa các nền văn hóa, qua các ca dân tộc chí về thân tộc, nam tính, giới thứ ba và hơn thế."
  ms: "Pandangan rentas budaya tentang gender dan seksualiti, melalui kes etnografi tentang kekeluargaan, maskuliniti, gender ketiga dan lain-lain."
  id: "Tinjauan lintas budaya atas gender dan seksualitas, lewat kasus etnografi tentang kekerabatan, maskulinitas, gender ketiga, dan lainnya."
  hi: "जेंडर और यौनिकता पर अंतर-सांस्कृतिक नज़र, रिश्तेदारी, पुरुषत्व, तीसरे जेंडर आदि के एथ्नोग्राफिक उदाहरणों से।"
outcomes:
  - en: "Compare gender and sexuality across cultures"
    zh: "跨文化比较性别与性"
    zh-TW: "跨文化比較性別與性"
    ja: "文化を越えてジェンダーと性を比べる"
    ko: "문화 간 젠더와 섹슈얼리티 비교하기"
    vi: "So sánh giới và tính dục giữa các nền văn hóa"
    ms: "Bandingkan gender dan seksualiti merentas budaya"
    id: "Membandingkan gender dan seksualitas lintas budaya"
    hi: "संस्कृतियों में जेंडर और यौनिकता की तुलना करना"
  - en: "Assess how fieldwork shapes our picture of gender"
    zh: "评估田野调查如何影响我们对性别的认识"
    zh-TW: "評估田野調查如何影響我們對性別的認識"
    ja: "フィールド調査がジェンダー像をどう形づくるか評価する"
    ko: "현장 연구가 젠더 인식을 만드는 방식 평가하기"
    vi: "Đánh giá cách điền dã định hình hiểu biết về giới"
    ms: "Nilai cara kerja lapangan membentuk gambaran gender"
    id: "Menilai cara kerja lapangan membentuk gambaran gender"
    hi: "फील्डवर्क जेंडर की हमारी समझ को कैसे बनाता है, आकलन करना"
  - en: "Apply theory to ethnographic case studies"
    zh: "把理论用于民族志案例"
    zh-TW: "把理論用於民族誌案例"
    ja: "理論を民族誌の事例に当てはめる"
    ko: "이론을 민족지 사례에 적용하기"
    vi: "Áp dụng lý thuyết vào các ca dân tộc chí"
    ms: "Gunakan teori pada kajian kes etnografi"
    id: "Menerapkan teori pada studi kasus etnografi"
    hi: "सिद्धांत को एथ्नोग्राफिक केस स्टडी पर लागू करना"
