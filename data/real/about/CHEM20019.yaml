code: CHEM20019
year: 2026
learn:
  en: "Second-year lab chemistry: making compounds, analysing samples and running modern instruments."
  zh: "二年级化学实验：合成化合物、分析样品和使用现代仪器。"
  zh-TW: "二年級化學實驗：合成化合物、分析樣品和使用現代儀器。"
  ja: "2年次の化学実験：化合物の合成、試料の分析、最新機器の操作。"
  ko: "2학년 화학 실험: 화합물 합성, 시료 분석, 최신 기기 운용."
  vi: "Thí nghiệm hóa năm hai: tổng hợp hợp chất, phân tích mẫu và vận hành thiết bị hiện đại."
  ms: "Kimia makmal tahun kedua: hasilkan sebatian, analisis sampel dan kendali alat moden."
  id: "Kimia lab tahun kedua: membuat senyawa, menganalisis sampel, dan mengoperasikan alat modern."
  hi: "सेकंड-ईयर लैब केमिस्ट्री: यौगिक बनाना, सैंपल विश्लेषण और आधुनिक उपकरण चलाना।"
outcomes:
  - en: "Make and characterise organic and inorganic compounds"
    zh: "合成并表征有机和无机化合物"
    zh-TW: "合成並鑑定有機和無機化合物"
    ja: "有機・無機化合物を合成しキャラクタリゼーションする"
    ko: "유기·무기 화합물 합성하고 특성 분석하기"
    vi: "Tổng hợp và xác định đặc tính hợp chất hữu cơ, vô cơ"
    ms: "Hasil dan cirikan sebatian organik dan bukan organik"
    id: "Membuat dan mengkarakterisasi senyawa organik dan anorganik"
    hi: "ऑर्गेनिक-इनऑर्गेनिक यौगिक बनाना और उनकी पहचान"
  - en: "Operate common lab instruments and read results"
    zh: "操作常用仪器并解读结果"
    zh-TW: "操作常用儀器並解讀結果"
    ja: "一般的な実験機器を操作し結果を読む"
    ko: "일반 실험 기기를 다루고 결과 읽기"
    vi: "Vận hành thiết bị thông dụng và đọc kết quả"
    ms: "Kendali alat makmal biasa dan baca hasil"
    id: "Mengoperasikan alat lab umum dan membaca hasil"
    hi: "आम लैब उपकरण चलाना और नतीजे पढ़ना"
  - en: "Analyse data and errors in lab reports"
    zh: "在实验报告里分析数据和误差"
    zh-TW: "在實驗報告裡分析資料和誤差"
    ja: "実験レポートでデータと誤差を分析する"
    ko: "실험 보고서에서 데이터와 오차 분석하기"
    vi: "Phân tích dữ liệu và sai số trong báo cáo thí nghiệm"
    ms: "Analisis data dan ralat dalam laporan makmal"
    id: "Menganalisis data dan galat dalam laporan lab"
    hi: "लैब रिपोर्ट में डेटा और त्रुटियों का विश्लेषण"
