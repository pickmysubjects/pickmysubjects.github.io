code: MUSI40012
year: 2026
learn:
  en: "Write a 15-minute folio of new music in individual lessons and seminars, shaping your own craft and style."
  zh: "通过个别课和研讨课创作15分钟作品集，打磨技法与个人风格。"
  zh-TW: "透過個別課和研討課創作15分鐘作品集，打磨技法與個人風格。"
  ja: "個人レッスンとセミナーで15分の作品集を書き、技法と自分の作風を磨く。"
  ko: "개인 레슨과 세미나에서 15분 분량 작품집을 쓰며 기법과 개성 다듬기."
  vi: "Sáng tác tuyển tập 15 phút qua các buổi học riêng và seminar, rèn kỹ thuật và phong cách riêng."
  ms: "Tulis folio muzik baharu 15 minit melalui kelas individu dan seminar, membentuk teknik dan gaya sendiri."
  id: "Menulis folio musik baru 15 menit lewat les privat dan seminar, mengasah teknik dan gaya sendiri."
  hi: "व्यक्तिगत पाठों और सेमिनारों में 15 मिनट का नया संगीत संग्रह लिखना, अपनी शैली निखारना।"
outcomes:
  - en: "Compose a substantial folio of new work"
    zh: "完成一部有分量的原创作品集"
    zh-TW: "完成一部有份量的原創作品集"
    ja: "まとまった量の新作を作曲する"
    ko: "분량 있는 신작 작품집 작곡하기"
    vi: "Sáng tác một tuyển tập tác phẩm mới đáng kể"
    ms: "Gubah folio karya baharu yang besar"
    id: "Menggubah folio karya baru yang substansial"
    hi: "नए काम का एक ठोस संग्रह रचना"
  - en: "Analyse and reflect on your own composing"
    zh: "分析并反思自己的创作"
    zh-TW: "分析並反思自己的創作"
    ja: "自分の作曲を分析し振り返る"
    ko: "자신의 작곡을 분석하고 성찰하기"
    vi: "Phân tích và suy ngẫm về việc sáng tác của mình"
    ms: "Analisis dan renungkan gubahan sendiri"
    id: "Menganalisis dan merefleksikan gubahan sendiri"
    hi: "अपनी रचना-प्रक्रिया का विश्लेषण और चिंतन करना"
  - en: "Develop a clear compositional voice"
    zh: "形成清晰的个人创作风格"
    zh-TW: "形成清晰的個人創作風格"
    ja: "はっきりした作曲上の個性を育てる"
    ko: "뚜렷한 작곡 개성 키우기"
    vi: "Hình thành giọng sáng tác rõ ràng"
    ms: "Bina suara gubahan yang jelas"
    id: "Mengembangkan suara komposisi yang jelas"
    hi: "स्पष्ट रचनात्मक पहचान विकसित करना"
