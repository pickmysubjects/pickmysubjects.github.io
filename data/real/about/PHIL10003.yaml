code: PHIL10003
year: 2026
learn:
  en: "Big questions about the self, truth and goodness, explored through great thinkers from different times and cultures."
  zh: "通过不同时代和文化的伟大思想家，探讨关于自我、真理和善的根本问题。"
  zh-TW: "透過不同時代和文化的偉大思想家，探討關於自我、真理和善的根本問題。"
  ja: "時代も文化も異なる偉大な思想家を通して、自己・真理・善という大きな問いを考える。"
  ko: "다양한 시대와 문화의 위대한 사상가를 통해 자아·진리·선에 관한 큰 질문을 탐구한다."
  vi: "Những câu hỏi lớn về bản thân, chân lý và cái thiện qua các nhà tư tưởng lớn thuộc nhiều thời đại và nền văn hóa."
  ms: "Soalan besar tentang diri, kebenaran dan kebaikan, melalui pemikir agung dari pelbagai zaman dan budaya."
  id: "Pertanyaan besar tentang diri, kebenaran dan kebaikan, lewat pemikir besar dari berbagai zaman dan budaya."
  hi: "स्व, सत्य और अच्छाई के बड़े सवाल, अलग-अलग युगों और संस्कृतियों के महान विचारकों के ज़रिए।"
outcomes:
  - en: "Explain classic positions on core philosophical questions"
    zh: "说明核心哲学问题上的经典立场"
    zh-TW: "說明核心哲學問題上的經典立場"
    ja: "哲学の根本問題についての古典的立場を説明する"
    ko: "핵심 철학 질문에 대한 고전적 입장 설명하기"
    vi: "Giải thích các lập trường kinh điển về câu hỏi triết học cốt lõi"
    ms: "Terangkan pendirian klasik tentang soalan falsafah teras"
    id: "Menjelaskan posisi klasik atas pertanyaan filsafat inti"
    hi: "मूल दार्शनिक सवालों पर क्लासिक मत समझाना"
  - en: "Read and interpret historical philosophy texts"
    zh: "阅读并解读历史上的哲学文本"
    zh-TW: "閱讀並解讀歷史上的哲學文本"
    ja: "歴史的な哲学書を読み解く"
    ko: "역사적 철학 텍스트 읽고 해석하기"
    vi: "Đọc và diễn giải các văn bản triết học lịch sử"
    ms: "Baca dan tafsir teks falsafah bersejarah"
    id: "Membaca dan menafsirkan teks filsafat historis"
    hi: "ऐतिहासिक दार्शनिक पाठ पढ़ना और समझना"
  - en: "Build and assess philosophical arguments"
    zh: "构建并评估哲学论证"
    zh-TW: "建構並評估哲學論證"
    ja: "哲学的な議論を組み立て評価する"
    ko: "철학적 논증 세우고 평가하기"
    vi: "Xây dựng và đánh giá lập luận triết học"
    ms: "Bina dan nilai hujah falsafah"
    id: "Menyusun dan menilai argumen filsafat"
    hi: "दार्शनिक तर्क बनाना और परखना"
