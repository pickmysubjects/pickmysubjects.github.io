code: DPSS30011
year: 2026
learn:
  en: "An intensive for Production and Design students: talks and demos, a portfolio, and a recorded piece made with peers on a topical issue."
  zh: "面向制作和设计学生的密集课：讲座与示范、作品集，以及与同伴合作录制的时事作品。"
  zh-TW: "面向製作與設計學生的密集課：講座與示範、作品集，以及與同伴合作錄製的時事作品。"
  ja: "制作・デザインの学生向け集中講義。講義と実演、ポートフォリオ、仲間と作る時事テーマの録音作品。"
  ko: "제작·디자인 학생 대상 집중 과정. 강연과 시연, 포트폴리오, 동료와 만든 시사 녹음 작품."
  vi: "Khóa tập trung cho SV sản xuất và thiết kế: bài giảng, hồ sơ và sản phẩm ghi âm nhóm."
  ms: "Intensif untuk pelajar Produksi dan Reka: ceramah, portfolio dan rakaman berkumpulan."
  id: "Intensif bagi mahasiswa Produksi dan Desain: ceramah, portofolio, dan rekaman kelompok."
  hi: "प्रोडक्शन और डिज़ाइन छात्रों के लिए इंटेंसिव: व्याख्यान, पोर्टफ़ोलियो और साथियों के साथ रिकॉर्डेड काम।"
outcomes:
  - en: "Engage with local and global design practice"
    zh: "了解本地与全球的设计实践"
    zh-TW: "了解在地與全球的設計實務"
    ja: "地域と世界のデザイン実践に触れる"
    ko: "지역·세계 디자인 실천 접하기"
    vi: "Tiếp cận thực hành thiết kế trong nước và quốc tế"
    ms: "Terokai amalan reka tempatan dan global"
    id: "Mengenal praktik desain lokal dan global"
    hi: "स्थानीय और वैश्विक डिज़ाइन से जुड़ना"
  - en: "Make a collaborative recorded work"
    zh: "合作完成录制作品"
    zh-TW: "合作完成錄製作品"
    ja: "共同で録音作品を作る"
    ko: "협업 녹음 작품 만들기"
    vi: "Làm sản phẩm ghi âm hợp tác"
    ms: "Hasilkan karya rakaman bersama"
    id: "Membuat karya rekaman kolaboratif"
    hi: "मिलकर रिकॉर्डेड काम बनाना"
  - en: "Reflect on working across disciplines"
    zh: "反思跨学科合作"
    zh-TW: "反思跨領域合作"
    ja: "分野横断の協働を振り返る"
    ko: "학제 간 협업 성찰하기"
    vi: "Suy ngẫm về làm việc liên ngành"
    ms: "Renung kerja merentas bidang"
    id: "Merefleksikan kerja lintas bidang"
    hi: "अंतर्विषयी काम पर चिंतन"
