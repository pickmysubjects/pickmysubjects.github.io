code: LAWS90125
year: 2027
learn:
  en: "An overview of Australian intellectual property law: patents, designs, copyright, trade marks and unfair competition."
  zh: "澳大利亚知识产权法概览：专利、外观设计、版权、商标和不正当竞争。"
  zh-TW: "澳洲智慧財產權法概覽：專利、設計、著作權、商標與不公平競爭。"
  ja: "豪州知的財産法の概要：特許、意匠、著作権、商標、不正競争。"
  ko: "호주 지식재산권법 개관: 특허, 디자인, 저작권, 상표, 부정경쟁."
  vi: "Tổng quan luật sở hữu trí tuệ Úc: bằng sáng chế, kiểu dáng, bản quyền, nhãn hiệu và cạnh tranh không lành mạnh."
  ms: "Gambaran undang-undang harta intelek Australia: paten, reka bentuk, hak cipta, cap dagangan dan persaingan tidak adil."
  id: "Gambaran hukum kekayaan intelektual Australia: paten, desain, hak cipta, merek, dan persaingan tidak sehat."
  hi: "ऑस्ट्रेलियाई बौद्धिक संपदा कानून का परिचय: पेटेंट, डिज़ाइन, कॉपीराइट, ट्रेडमार्क और अनुचित प्रतिस्पर्धा।"
outcomes:
  - en: "Explain the main types of IP protection"
    zh: "解释主要的知识产权保护类型"
    zh-TW: "解釋主要的智慧財產權保護類型"
    ja: "主な知的財産の保護の種類を説明する"
    ko: "주요 지식재산권 보호 유형 설명하기"
    vi: "Giải thích các loại bảo hộ sở hữu trí tuệ chính"
    ms: "Menerangkan jenis utama perlindungan harta intelek"
    id: "Menjelaskan jenis utama perlindungan kekayaan intelektual"
    hi: "बौद्धिक संपदा सुरक्षा के मुख्य प्रकार समझाना"
  - en: "Apply IP law to commercial situations"
    zh: "将知识产权法应用于商业情境"
    zh-TW: "將智慧財產權法應用於商業情境"
    ja: "知的財産法をビジネスの場面に適用する"
    ko: "지식재산권법을 상업 상황에 적용하기"
    vi: "Áp dụng luật sở hữu trí tuệ vào tình huống thương mại"
    ms: "Menggunakan undang-undang harta intelek dalam situasi komersial"
    id: "Menerapkan hukum kekayaan intelektual pada situasi bisnis"
    hi: "वाणिज्यिक स्थितियों पर बौद्धिक संपदा कानून लागू करना"
