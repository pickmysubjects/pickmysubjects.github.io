code: GDES20002
year: 2026
learn:
  en: "A studio on colour in design: how colour is seen and felt, colour theory, and using it on purpose in your work."
  zh: "设计中的色彩工作室：色彩的视觉与感受、色彩理论，以及有意识地运用色彩。"
  zh-TW: "設計中的色彩工作室：色彩的視覺與感受、色彩理論，以及有意識地運用色彩。"
  ja: "デザインの色彩スタジオ：色の見え方と感じ方、色彩理論、意図的な色使い。"
  ko: "디자인 색채 스튜디오: 색이 보이고 느껴지는 방식, 색채 이론, 의도적인 색 사용."
  vi: "Studio về màu trong thiết kế: màu được nhìn và cảm nhận ra sao, lý thuyết màu và dùng màu có chủ đích."
  ms: "Studio warna dalam reka bentuk: cara warna dilihat dan dirasa, teori warna dan penggunaannya dengan tujuan."
  id: "Studio warna dalam desain: cara warna dilihat dan dirasakan, teori warna, dan memakainya dengan sengaja."
  hi: "डिज़ाइन में रंग पर स्टूडियो: रंग कैसे दिखते-महसूस होते हैं, रंग सिद्धांत और सोच-समझकर इस्तेमाल।"
outcomes:
  - en: "Apply colour theory in design work"
    zh: "在设计中运用色彩理论"
    zh-TW: "在設計中運用色彩理論"
    ja: "色彩理論を制作に使う"
    ko: "디자인에 색채 이론 적용하기"
    vi: "Áp dụng lý thuyết màu vào thiết kế"
    ms: "Guna teori warna dalam reka bentuk"
    id: "Menerapkan teori warna dalam desain"
    hi: "डिज़ाइन में रंग सिद्धांत लागू करना"
  - en: "Mix and test colours by hand and screen"
    zh: "手工与屏幕上调色和测试"
    zh-TW: "手工與螢幕上調色和測試"
    ja: "手作業と画面で色を混ぜ試す"
    ko: "손과 화면으로 색 섞고 시험하기"
    vi: "Pha và thử màu bằng tay và trên màn hình"
    ms: "Campur dan uji warna secara manual dan skrin"
    id: "Mencampur dan menguji warna manual dan di layar"
    hi: "हाथ से और स्क्रीन पर रंग मिलाकर परखना"
  - en: "Explain the colour choices in your work"
    zh: "说明作品中的用色选择"
    zh-TW: "說明作品中的用色選擇"
    ja: "作品の色選びを説明する"
    ko: "작품의 색 선택 설명하기"
    vi: "Giải thích lựa chọn màu trong tác phẩm"
    ms: "Jelaskan pilihan warna dalam karya"
    id: "Menjelaskan pilihan warna dalam karya"
    hi: "अपने काम में रंगों के चुनाव समझाना"
