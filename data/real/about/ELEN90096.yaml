code: ELEN90096
year: 2027
learn:
  en: "Designing FPGA hardware to speed up demanding algorithms, and judging which algorithms are worth accelerating."
  zh: "设计 FPGA 硬件来加速高负载算法，并判断哪些算法值得加速。"
  zh-TW: "設計 FPGA 硬體來加速高負載演算法，並判斷哪些演算法值得加速。"
  ja: "FPGA で重いアルゴリズムを高速化する設計と、加速に向くかの判断。"
  ko: "FPGA로 무거운 알고리즘을 가속하는 설계와 가속 적합성 판단."
  vi: "Thiết kế phần cứng FPGA để tăng tốc thuật toán nặng, và đánh giá thuật toán nào đáng tăng tốc."
  ms: "Mereka perkakasan FPGA untuk mempercepat algoritma berat, dan menilai yang patut dipercepat."
  id: "Merancang perangkat keras FPGA untuk mempercepat algoritma berat, dan menilai mana yang layak."
  hi: "भारी एल्गोरिद्म तेज़ करने के लिए FPGA हार्डवेयर डिज़ाइन, और कौन-से तेज़ करने लायक हैं, यह आंकना।"
outcomes:
  - en: "Design basic hardware for an FPGA"
    zh: "为 FPGA 设计基本硬件"
    zh-TW: "為 FPGA 設計基本硬體"
    ja: "FPGA 向けの基本回路を設計する"
    ko: "FPGA용 기본 하드웨어 설계하기"
    vi: "Thiết kế phần cứng cơ bản cho FPGA"
    ms: "Reka perkakasan asas untuk FPGA"
    id: "Merancang perangkat keras dasar untuk FPGA"
    hi: "FPGA के लिए बुनियादी हार्डवेयर डिज़ाइन करना"
  - en: "Judge whether an algorithm suits hardware acceleration"
    zh: "判断算法是否适合硬件加速"
    zh-TW: "判斷演算法是否適合硬體加速"
    ja: "アルゴリズムが加速に向くか判断する"
    ko: "알고리즘의 하드웨어 가속 적합성 판단하기"
    vi: "Đánh giá thuật toán có hợp tăng tốc phần cứng không"
    ms: "Nilai sama ada algoritma sesuai dipercepat perkakasan"
    id: "Menilai apakah algoritma cocok dipercepat perangkat keras"
    hi: "आंकना कि एल्गोरिद्म हार्डवेयर एक्सेलरेशन के लायक है या नहीं"
