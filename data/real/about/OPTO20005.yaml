code: OPTO20005
year: 2026
learn:
  en: "The science of how we see: eye movements, focusing, depth, colour and adapting to light and dark."
  zh: "视觉科学：眼动、调节、深度、颜色及明暗适应。"
  zh-TW: "視覺科學：眼動、調節、深度、顏色及明暗適應。"
  ja: "見る仕組みの科学：眼球運動、ピント調節、奥行き、色、明暗順応。"
  ko: "보는 원리의 과학: 안구 운동, 초점 조절, 깊이, 색, 명암 순응."
  vi: "Khoa học về cách ta nhìn: chuyển động mắt, điều tiết, chiều sâu, màu sắc, thích nghi sáng tối."
  ms: "Sains penglihatan: pergerakan mata, fokus, kedalaman, warna dan penyesuaian cahaya."
  id: "Sains penglihatan: gerak mata, fokus, kedalaman, warna, serta adaptasi terang dan gelap."
  hi: "देखने का विज्ञान: आँखों की गति, फ़ोकस, गहराई, रंग और रोशनी-अँधेरे में ढलना।"
outcomes:
  - en: "Explain the main processes of visual function"
    zh: "解释视觉功能的主要过程"
    zh-TW: "解釋視覺功能的主要過程"
    ja: "視覚機能の主な仕組みを説明する"
    ko: "시각 기능의 주요 과정 설명하기"
    vi: "Giải thích các quá trình chính của thị giác"
    ms: "Terangkan proses utama fungsi penglihatan"
    id: "Menjelaskan proses utama fungsi penglihatan"
    hi: "दृष्टि के मुख्य कार्यों को समझाना"
  - en: "Run and report on vision experiments"
    zh: "进行视觉实验并撰写报告"
    zh-TW: "進行視覺實驗並撰寫報告"
    ja: "視覚の実験を行い報告する"
    ko: "시각 실험을 하고 보고서 쓰기"
    vi: "Làm và báo cáo thí nghiệm thị giác"
    ms: "Jalankan dan laporkan eksperimen penglihatan"
    id: "Melakukan dan melaporkan eksperimen penglihatan"
    hi: "दृष्टि प्रयोग करना और रिपोर्ट लिखना"
  - en: "Link vision science to eye disorders"
    zh: "把视觉科学和眼疾联系起来"
    zh-TW: "把視覺科學和眼疾聯繫起來"
    ja: "視覚科学を目の疾患と結びつける"
    ko: "시각 과학을 눈 질환과 연결하기"
    vi: "Liên hệ khoa học thị giác với bệnh về mắt"
    ms: "Kaitkan sains penglihatan dengan gangguan mata"
    id: "Mengaitkan sains penglihatan dengan gangguan mata"
    hi: "दृष्टि विज्ञान को आँखों के रोगों से जोड़ना"
