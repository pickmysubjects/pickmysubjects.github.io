code: HEBR10002
year: 2026
learn:
  en: "Follows Hebrew 1: more complex grammar, reading simple modern texts, short writing and everyday conversation."
  zh: "接续希伯来语 1：更复杂的语法，阅读简单现代文本，短篇写作和日常对话。"
  zh-TW: "接續希伯來語 1：更複雜的文法，閱讀簡單現代文本，短篇寫作和日常對話。"
  ja: "ヘブライ語1の続き。より複雑な文法、やさしい現代文の読解、短い作文と日常会話。"
  ko: "히브리어 1에 이어 더 복잡한 문법, 쉬운 현대 글 읽기, 짧은 글쓰기와 일상 대화."
  vi: "Tiếp nối Hebrew 1: ngữ pháp phức tạp hơn, đọc văn bản hiện đại đơn giản, viết ngắn và hội thoại hằng ngày."
  ms: "Sambungan Hebrew 1: tatabahasa lebih kompleks, membaca teks moden mudah, penulisan pendek dan perbualan harian."
  id: "Lanjutan Hebrew 1: tata bahasa lebih rumit, membaca teks modern sederhana, tulisan pendek dan percakapan sehari-hari."
  hi: "हिब्रू 1 के आगे: ज़्यादा जटिल व्याकरण, आसान आधुनिक पाठ पढ़ना, छोटा लेखन और रोज़ की बातचीत।"
outcomes:
  - en: "Talk about familiar topics in Hebrew with more confidence"
    zh: "更自信地用希伯来语谈论熟悉的话题"
    zh-TW: "更自信地用希伯來語談論熟悉的話題"
    ja: "身近な話題をヘブライ語でより自信を持って話す"
    ko: "익숙한 주제를 히브리어로 더 자신 있게 말하기"
    vi: "Nói về chủ đề quen thuộc bằng tiếng Do Thái tự tin hơn"
    ms: "Bercakap tentang topik biasa dalam bahasa Ibrani dengan lebih yakin"
    id: "Membicarakan topik akrab dalam bahasa Ibrani dengan lebih percaya diri"
    hi: "परिचित विषयों पर हिब्रू में ज़्यादा आत्मविश्वास से बात करना"
  - en: "Read and write short Hebrew texts"
    zh: "读写简短的希伯来语文章"
    zh-TW: "讀寫簡短的希伯來語文章"
    ja: "短いヘブライ語の文章を読み書きする"
    ko: "짧은 히브리어 글 읽고 쓰기"
    vi: "Đọc và viết đoạn văn tiếng Do Thái ngắn"
    ms: "Baca dan tulis teks pendek bahasa Ibrani"
    id: "Membaca dan menulis teks pendek bahasa Ibrani"
    hi: "छोटे हिब्रू पाठ पढ़ना-लिखना"
  - en: "Use new grammar and vocabulary correctly"
    zh: "正确运用新语法和词汇"
    zh-TW: "正確運用新文法和詞彙"
    ja: "新しい文法と語彙を正しく使う"
    ko: "새 문법과 어휘를 정확히 쓰기"
    vi: "Dùng đúng ngữ pháp và từ vựng mới"
    ms: "Guna tatabahasa dan kosa kata baharu dengan betul"
    id: "Memakai tata bahasa dan kosakata baru dengan benar"
    hi: "नया व्याकरण और शब्दावली सही इस्तेमाल करना"
