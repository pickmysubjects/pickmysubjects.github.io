code: FLTV20012
year: 2026
learn:
  en: "Write for television: how a story room works, a 24 to 26-page TV script and the pitch documents to go with it."
  zh: "为电视写作：编剧室如何运作，写24到26页电视剧本及推介文件。"
  zh-TW: "為電視寫作：編劇室如何運作，寫 24 到 26 頁電視劇本及提案文件。"
  ja: "テレビ脚本：脚本会議の進め方、24〜26ページの脚本と企画書。"
  ko: "TV 글쓰기: 작가실 운영, 24~26쪽 TV 대본과 기획 문서."
  vi: "Viết cho truyền hình: phòng biên kịch, kịch bản 24–26 trang và tài liệu pitch."
  ms: "Menulis untuk TV: cara bilik cerita berfungsi, skrip 24–26 halaman dan dokumen pitch."
  id: "Menulis untuk TV: cara ruang cerita bekerja, naskah 24–26 halaman dan dokumen pitch."
  hi: "टीवी के लिए लेखन: स्टोरी रूम, 24–26 पेज की टीवी स्क्रिप्ट और पिच दस्तावेज़।"
outcomes:
  - en: "Develop a TV series idea as a group"
    zh: "以小组开发电视剧构想"
    zh-TW: "以小組開發電視劇構想"
    ja: "グループでドラマ企画を作る"
    ko: "그룹으로 TV 시리즈 기획 만들기"
    vi: "Cùng nhóm phát triển ý tưởng phim bộ"
    ms: "Bangunkan idea siri TV berkumpulan"
    id: "Mengembangkan ide serial TV berkelompok"
    hi: "समूह में टीवी सीरीज़ का विचार बनाना"
  - en: "Write a half-hour TV script"
    zh: "写一集半小时电视剧本"
    zh-TW: "寫一集半小時電視劇本"
    ja: "30分ドラマの脚本を書く"
    ko: "30분 TV 대본 쓰기"
    vi: "Viết kịch bản truyền hình nửa tiếng"
    ms: "Tulis skrip TV setengah jam"
    id: "Menulis naskah TV setengah jam"
    hi: "आधे घंटे की टीवी स्क्रिप्ट लिखना"
  - en: "Learn how the TV industry works"
    zh: "了解电视行业如何运作"
    zh-TW: "了解電視產業如何運作"
    ja: "テレビ業界の仕組みを知る"
    ko: "TV 업계 구조 알기"
    vi: "Hiểu ngành truyền hình vận hành ra sao"
    ms: "Faham cara industri TV berfungsi"
    id: "Memahami cara industri TV bekerja"
    hi: "टीवी इंडस्ट्री कैसे चलती है, समझना"
