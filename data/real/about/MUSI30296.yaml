code: MUSI30296
year: 2026
learn:
  en: "A second semester of the auditioned percussion ensemble, with new styles, transcriptions and a concert. Pass/fail."
  zh: "需试音的打击乐合奏第二学期，新风格、改编曲与音乐会。及格制。"
  zh-TW: "需試音的打擊樂合奏第二學期，新風格、改編曲與音樂會。及格制。"
  ja: "打楽器アンサンブルの後期。新しい様式や編曲で演奏会へ。合否判定。"
  ko: "타악 앙상블 2학기. 새 양식과 편곡, 공연. 합격/불합격."
  vi: "Học kỳ hai hòa tấu bộ gõ, phong cách mới, chuyển soạn và buổi diễn. Đạt/không đạt."
  ms: "Semester kedua ensembel perkusi, gaya baharu, transkripsi dan konsert. Lulus/gagal."
  id: "Semester kedua ansambel perkusi, gaya baru, transkripsi dan konser. Lulus/gagal."
  hi: "ताल समूह का दूसरा सत्र, नई शैलियाँ, रूपांतरण और कॉन्सर्ट। पास/फ़ेल।"
outcomes:
  - en: "Adapt your playing to new styles and transcriptions"
    zh: "让演奏适应新风格与改编曲"
    zh-TW: "讓演奏適應新風格與改編曲"
    ja: "新しい様式や編曲に演奏を合わせる"
    ko: "새 양식과 편곡에 맞춰 연주하기"
    vi: "Điều chỉnh lối chơi theo phong cách mới"
    ms: "Sesuaikan permainan dengan gaya baharu"
    id: "Menyesuaikan permainan dengan gaya baru"
    hi: "नई शैलियों और रूपांतरणों के अनुसार बजाना"
  - en: "Prepare parts on a range of percussion instruments"
    zh: "在多种打击乐器上准备声部"
    zh-TW: "在多種打擊樂器上準備聲部"
    ja: "様々な打楽器でパートを準備する"
    ko: "여러 타악기로 파트 준비하기"
    vi: "Chuẩn bị bè trên nhiều nhạc cụ gõ"
    ms: "Sediakan bahagian pada pelbagai alat perkusi"
    id: "Menyiapkan partisi di beragam alat perkusi"
    hi: "कई ताल वाद्यों पर भाग तैयार करना"
  - en: "Perform in percussion ensemble concerts"
    zh: "参加打击乐合奏音乐会"
    zh-TW: "參加打擊樂合奏音樂會"
    ja: "打楽器アンサンブルの演奏会に出る"
    ko: "타악 앙상블 공연에 서기"
    vi: "Biểu diễn trong hòa nhạc bộ gõ"
    ms: "Membuat persembahan konsert perkusi"
    id: "Tampil dalam konser ansambel perkusi"
    hi: "ताल समूह कॉन्सर्ट में प्रस्तुति देना"
