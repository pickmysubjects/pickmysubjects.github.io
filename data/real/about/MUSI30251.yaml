code: MUSI30251
year: 2026
learn:
  en: "Plan and polish a coherent recital program for a set context, ending in a 25-minute performance exam."
  zh: "为特定场合策划并打磨连贯的独奏会曲目，最后进行25分钟演奏考核。"
  zh-TW: "為特定場合策劃並打磨連貫的獨奏會曲目，最後進行25分鐘演奏考核。"
  ja: "特定の場に合わせた一貫性のあるリサイタル曲目を組み、仕上げる。最後に25分の実技試験。"
  ko: "특정 무대에 맞춘 일관된 리사이틀 프로그램을 구성·완성하고 25분 실기 시험으로 마무리."
  vi: "Lên và hoàn thiện chương trình độc tấu mạch lạc cho một bối cảnh, kết thúc bằng bài thi 25 phút."
  ms: "Rancang dan gilap program resital yang padu untuk konteks tertentu, diakhiri ujian 25 minit."
  id: "Menyusun dan memoles program resital yang utuh untuk konteks tertentu, diakhiri ujian 25 menit."
  hi: "किसी खास मंच के लिए सुसंगत रिसाइटल तैयार करना, अंत में 25 मिनट की परीक्षा।"
outcomes:
  - en: "Design and present a balanced recital"
    zh: "设计并呈现结构均衡的独奏会"
    zh-TW: "設計並呈現結構均衡的獨奏會"
    ja: "バランスの取れたリサイタルを構成し演奏する"
    ko: "균형 잡힌 리사이틀 구성·연주하기"
    vi: "Thiết kế và trình diễn buổi độc tấu cân đối"
    ms: "Reka dan persembahkan resital seimbang"
    id: "Merancang dan menampilkan resital seimbang"
    hi: "संतुलित रिसाइटल तैयार और प्रस्तुत करना"
  - en: "Project an expressive, varied sound"
    zh: "奏出富有表现力、多变的声音"
    zh-TW: "奏出富有表現力、多變的聲音"
    ja: "表情豊かで多彩な音を出す"
    ko: "표현력 있고 다채로운 소리 내기"
    vi: "Tạo âm thanh biểu cảm, đa dạng"
    ms: "Hasilkan bunyi ekspresif dan pelbagai"
    id: "Menghasilkan suara ekspresif dan beragam"
    hi: "भावपूर्ण, विविध ध्वनि निकालना"
  - en: "Perform with confidence and professionalism"
    zh: "自信而专业地演出"
    zh-TW: "自信而專業地演出"
    ja: "自信を持ってプロらしく演奏する"
    ko: "자신감 있고 프로답게 연주하기"
    vi: "Biểu diễn tự tin, chuyên nghiệp"
    ms: "Membuat persembahan dengan yakin dan profesional"
    id: "Tampil percaya diri dan profesional"
    hi: "आत्मविश्वास और पेशेवर ढंग से प्रस्तुति"
