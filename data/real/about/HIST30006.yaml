code: HIST30006
year: 2026
learn:
  en: "The Renaissance in Italian cities, especially Florence and Venice: politics, art, religion, family and everyday life."
  zh: "意大利城市的文艺复兴，尤其是佛罗伦萨和威尼斯：政治、艺术、宗教、家庭与日常生活。"
  zh-TW: "義大利城市的文藝復興，尤其是佛羅倫斯和威尼斯：政治、藝術、宗教、家庭與日常生活。"
  ja: "フィレンツェとヴェネツィアを中心に、イタリア諸都市のルネサンスを政治・芸術・宗教・家族・日常から学ぶ。"
  ko: "피렌체와 베네치아를 중심으로 이탈리아 도시들의 르네상스를 정치, 예술, 종교, 가족, 일상으로 배운다."
  vi: "Thời Phục hưng ở các thành phố Ý, nhất là Florence và Venice: chính trị, nghệ thuật, tôn giáo, gia đình và đời thường."
  ms: "Zaman Renaissance di bandar Itali, terutamanya Florence dan Venice: politik, seni, agama, keluarga dan kehidupan harian."
  id: "Renaisans di kota-kota Italia, terutama Firenze dan Venesia: politik, seni, agama, keluarga, dan kehidupan sehari-hari."
  hi: "इटली के शहरों में पुनर्जागरण, ख़ासकर फ़्लोरेंस और वेनिस: राजनीति, कला, धर्म, परिवार और रोज़मर्रा का जीवन।"
outcomes:
  - en: "Discuss the social, political and cultural Renaissance"
    zh: "讨论文艺复兴的社会、政治与文化面向"
    zh-TW: "討論文藝復興的社會、政治與文化面向"
    ja: "ルネサンスの社会・政治・文化の側面を論じる"
    ko: "르네상스의 사회·정치·문화적 측면 토론하기"
    vi: "Thảo luận các khía cạnh xã hội, chính trị, văn hóa của Phục hưng"
    ms: "Bincangkan aspek sosial, politik dan budaya Renaissance"
    id: "Membahas sisi sosial, politik, dan budaya Renaisans"
    hi: "पुनर्जागरण के सामाजिक, राजनीतिक और सांस्कृतिक पहलुओं पर चर्चा करना"
  - en: "Evaluate the roles of Florence and Venice"
    zh: "评价佛罗伦萨和威尼斯的作用"
    zh-TW: "評價佛羅倫斯和威尼斯的角色"
    ja: "フィレンツェとヴェネツィアの役割を評価する"
    ko: "피렌체와 베네치아의 역할 평가하기"
    vi: "Đánh giá vai trò của Florence và Venice"
    ms: "Nilai peranan Florence dan Venice"
    id: "Menilai peran Firenze dan Venesia"
    hi: "फ़्लोरेंस और वेनिस की भूमिका का आकलन करना"
  - en: "Question 'Renaissance' as a historical label"
    zh: "反思“文艺复兴”这一历史标签"
    zh-TW: "反思「文藝復興」這一歷史標籤"
    ja: "「ルネサンス」という歴史的な呼び名を問い直す"
    ko: "'르네상스'라는 역사적 명칭 되짚어 보기"
    vi: "Đặt câu hỏi về 'Phục hưng' như một nhãn lịch sử"
    ms: "Persoalkan 'Renaissance' sebagai label sejarah"
    id: "Mempertanyakan 'Renaisans' sebagai label sejarah"
    hi: "'पुनर्जागरण' को ऐतिहासिक लेबल के रूप में परखना"
