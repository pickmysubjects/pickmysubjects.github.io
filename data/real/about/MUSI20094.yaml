code: MUSI20094
year: 2026
learn:
  en: "Play in the Conservatorium's orchestras and large bands, up to about six hours a week of rehearsal and concerts. Audition; pass/fail."
  zh: "加入音乐学院管弦乐团或大型管乐团，每周排练演出最多约6小时；需试音，通过/不通过。"
  zh-TW: "加入音樂學院管弦樂團或大型管樂團，每週排練演出最多約6小時；需試音，通過/不通過。"
  ja: "音楽院のオーケストラや吹奏楽団で演奏。週最大約6時間。要オーディション、合否評価。"
  ko: "음악원 오케스트라·대형 밴드 연주, 주 최대 약 6시간. 오디션, 통과/불통과."
  vi: "Chơi trong dàn nhạc giao hưởng và dàn kèn lớn, tối đa khoảng 6 giờ/tuần. Thử giọng; đạt/không."
  ms: "Bermain dalam orkestra dan band besar, sehingga kira-kira 6 jam seminggu. Uji bakat; lulus/gagal."
  id: "Bermain di orkestra dan band besar, hingga sekitar 6 jam per minggu. Audisi; lulus/tidak."
  hi: "कंज़र्वेटोरियम के ऑर्केस्ट्रा और बड़े बैंड में बजाना, हफ़्ते में लगभग 6 घंटे तक। ऑडिशन; पास/फ़ेल।"
outcomes:
  - en: "Prepare your part and play it accurately in rehearsal"
    zh: "认真准备声部，排练中准确演奏"
    zh-TW: "認真準備聲部，排練中準確演奏"
    ja: "自分のパートを準備し、合奏で正確に演奏する"
    ko: "자기 파트를 준비해 리허설에서 정확히 연주하기"
    vi: "Chuẩn bị bè của mình và chơi chính xác khi tập"
    ms: "Sediakan bahagian sendiri dan mainkan dengan tepat semasa latihan"
    id: "Menyiapkan bagian sendiri dan memainkannya dengan tepat saat latihan"
    hi: "अपना पार्ट तैयार कर रिहर्सल में सही बजाना"
  - en: "Follow a conductor in a large orchestra or band"
    zh: "在大型乐团中跟随指挥演奏"
    zh-TW: "在大型樂團中跟隨指揮演奏"
    ja: "大編成で指揮者に従って演奏する"
    ko: "대편성에서 지휘자를 따라 연주하기"
    vi: "Theo chỉ huy trong dàn nhạc lớn"
    ms: "Ikut konduktor dalam orkestra atau band besar"
    id: "Mengikuti dirigen di orkestra atau band besar"
    hi: "बड़े ऑर्केस्ट्रा में कंडक्टर का अनुसरण करना"
  - en: "Perform in public concerts as part of the ensemble"
    zh: "随乐团参加公开演出"
    zh-TW: "隨樂團參加公開演出"
    ja: "アンサンブルの一員として公演に出る"
    ko: "앙상블 일원으로 공개 공연하기"
    vi: "Biểu diễn trước khán giả cùng dàn nhạc"
    ms: "Membuat persembahan awam bersama ensembel"
    id: "Tampil di konser publik bersama ansambel"
    hi: "समूह के साथ सार्वजनिक कॉन्सर्ट में प्रस्तुति देना"
