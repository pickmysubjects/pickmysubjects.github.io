code: FREN30023
year: 2026
learn:
  en: "How French is used and lived around the world, through texts, films and the cultures of French-speaking places."
  zh: "法语在世界各地的使用和生活，通过文本、电影和法语地区文化来了解。"
  zh-TW: "法語在世界各地的使用和生活，透過文本、電影和法語地區文化來了解。"
  ja: "世界各地でフランス語がどう使われ生きられているかを、文章・映画・文化から学ぶ。"
  ko: "세계 곳곳에서 프랑스어가 어떻게 쓰이고 살아 있는지 글·영화·문화로 살펴본다."
  vi: "Tiếng Pháp được dùng và sống ra sao khắp thế giới, qua văn bản, phim và văn hóa các vùng nói tiếng Pháp."
  ms: "Cara bahasa Perancis digunakan di seluruh dunia, melalui teks, filem dan budaya tempat berbahasa Perancis."
  id: "Cara bahasa Prancis dipakai di seluruh dunia, melalui teks, film dan budaya wilayah berbahasa Prancis."
  hi: "दुनिया भर में फ़्रेंच कैसे इस्तेमाल और जी जाती है, पाठों, फ़िल्मों और फ़्रेंच-भाषी जगहों की संस्कृति से।"
outcomes:
  - en: "Compare French-speaking cultures around the world"
    zh: "比较世界各地的法语文化"
    zh-TW: "比較世界各地的法語文化"
    ja: "世界のフランス語圏の文化を比べる"
    ko: "세계 프랑스어권 문화 비교하기"
    vi: "So sánh các nền văn hóa nói tiếng Pháp"
    ms: "Bandingkan budaya berbahasa Perancis di dunia"
    id: "Membandingkan budaya berbahasa Prancis di dunia"
    hi: "दुनिया की फ़्रेंच-भाषी संस्कृतियों की तुलना करना"
  - en: "Analyse French texts and films in context"
    zh: "结合背景分析法语文本和电影"
    zh-TW: "結合背景分析法語文本和電影"
    ja: "フランス語の文章や映画を背景とともに分析する"
    ko: "프랑스어 글과 영화를 맥락 속에서 분석하기"
    vi: "Phân tích văn bản và phim tiếng Pháp theo bối cảnh"
    ms: "Analisis teks dan filem Perancis mengikut konteks"
    id: "Menganalisis teks dan film Prancis sesuai konteks"
    hi: "फ़्रेंच पाठों और फ़िल्मों का संदर्भ में विश्लेषण करना"
  - en: "Work on a research project with classmates in French"
    zh: "和同学用法语合作完成研究项目"
    zh-TW: "和同學用法語合作完成研究專題"
    ja: "仲間とフランス語で研究プロジェクトに取り組む"
    ko: "동료와 프랑스어로 연구 프로젝트 하기"
    vi: "Làm dự án nghiên cứu nhóm bằng tiếng Pháp"
    ms: "Jalankan projek penyelidikan berkumpulan dalam bahasa Perancis"
    id: "Mengerjakan proyek riset kelompok dalam bahasa Prancis"
    hi: "सहपाठियों के साथ फ़्रेंच में शोध परियोजना करना"
