code: COMP90055
year: 2027
learn:
  en: "An in-depth, supervised research project on a computing problem; needs a WAM of 75+ and can lead to a PhD."
  zh: "在导师指导下深入研究一个计算问题；需 WAM 75 以上，可通往博士。"
  zh-TW: "在指導老師下深入研究一個計算問題；需 WAM 75 以上，可銜接博士。"
  ja: "指導教員のもとで計算分野の課題を深く研究。WAM 75 以上が必要で博士への道にもなる。"
  ko: "지도 하에 컴퓨팅 문제를 깊이 연구; WAM 75 이상 필요, 박사 진학 경로."
  vi: "Dự án nghiên cứu sâu có hướng dẫn về một vấn đề tin học; cần WAM 75+, có thể dẫn tới PhD."
  ms: "Projek penyelidikan mendalam berpenyelia tentang masalah pengkomputeran; perlu WAM 75+, laluan ke PhD."
  id: "Proyek riset mendalam dengan pembimbing tentang masalah komputasi; perlu WAM 75+, jalur ke PhD."
  hi: "कंप्यूटिंग समस्या पर गहन, सुपरवाइज़्ड रिसर्च प्रोजेक्ट; WAM 75+ ज़रूरी, PhD की राह।"
outcomes:
  - en: "Plan and carry out a research project"
    zh: "规划并完成一个研究项目"
    zh-TW: "規劃並完成一個研究專題"
    ja: "研究プロジェクトを計画・実行する"
    ko: "연구 프로젝트 계획·수행하기"
    vi: "Lập kế hoạch và thực hiện dự án nghiên cứu"
    ms: "Rancang dan laksana projek penyelidikan"
    id: "Merencanakan dan menjalankan proyek riset"
    hi: "रिसर्च प्रोजेक्ट की योजना बनाना और पूरा करना"
  - en: "Report findings in writing and in a talk"
    zh: "以书面和口头形式汇报成果"
    zh-TW: "以書面與口頭形式報告成果"
    ja: "結果を文章と発表で伝える"
    ko: "결과를 글과 발표로 전달하기"
    vi: "Trình bày kết quả bằng bài viết và thuyết trình"
    ms: "Laporkan dapatan secara bertulis dan lisan"
    id: "Melaporkan temuan secara tertulis dan lisan"
    hi: "नतीजे लिखकर और प्रस्तुति में बताना"
