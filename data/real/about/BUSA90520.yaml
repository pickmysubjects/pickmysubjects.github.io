code: BUSA90520
year: 2027
learn:
  en: "Gathering, cleaning and shaping business data from many sources, then presenting it clearly for decisions."
  zh: "从多个来源收集、清洗和整理业务数据，并清楚地呈现以支持决策。"
  zh-TW: "從多個來源蒐集、清理與整理業務資料，並清楚呈現以支援決策。"
  ja: "複数のソースから業務データを集め、整え、意思決定のためにわかりやすく示す。"
  ko: "여러 출처의 업무 데이터를 모으고 정리해 의사결정에 맞게 명확히 보여주기."
  vi: "Thu thập, làm sạch, định hình dữ liệu kinh doanh từ nhiều nguồn và trình bày rõ ràng để ra quyết định."
  ms: "Mengumpul, membersih dan menyusun data perniagaan dari banyak sumber, lalu membentangkannya dengan jelas."
  id: "Mengumpulkan, membersihkan, dan menata data bisnis dari banyak sumber, lalu menyajikannya dengan jelas."
  hi: "कई स्रोतों से व्यावसायिक डेटा जुटाना, साफ़ करना और ढालना, फिर फ़ैसलों के लिए उसे साफ़ दिखाना।"
outcomes:
  - en: "Handle messy data such as dates and free text"
    zh: "处理日期、文本等杂乱数据"
    zh-TW: "處理日期、文字等雜亂資料"
    ja: "日付やテキストなど扱いにくいデータを処理する"
    ko: "날짜·텍스트 같은 지저분한 데이터 다루기"
    vi: "Xử lý dữ liệu lộn xộn như ngày giờ, văn bản"
    ms: "Mengendalikan data bersepah seperti tarikh dan teks"
    id: "Menangani data berantakan seperti tanggal dan teks"
    hi: "तारीख़ और टेक्स्ट जैसे बिखरे डेटा को संभालना"
  - en: "Choose useful metrics and show data well for decisions"
    zh: "选定合适的指标，并为决策清楚展示数据"
    zh-TW: "選定合適的指標，並為決策清楚呈現資料"
    ja: "適切な指標を選び、意思決定向けにデータを見せる"
    ko: "알맞은 지표를 정하고 의사결정용으로 데이터 보여주기"
    vi: "Chọn chỉ số phù hợp và trình bày dữ liệu tốt cho quyết định"
    ms: "Memilih metrik sesuai dan memaparkan data untuk keputusan"
    id: "Memilih metrik yang tepat dan menyajikan data untuk keputusan"
    hi: "उपयोगी मीट्रिक चुनना और फ़ैसलों के लिए डेटा अच्छे से दिखाना"
