code: EDUC20074
year: 2026
learn:
  en: "How schools, workplaces and communities put wellbeing research into practice, and how nations measure it."
  zh: "学校、职场和社区如何运用幸福感研究，以及国家如何衡量幸福。"
  zh-TW: "學校、職場和社區如何運用幸福感研究，以及國家如何衡量幸福。"
  ja: "学校・職場・地域がウェルビーイング研究をどう活かし、国がそれをどう測るか。"
  ko: "학교·직장·지역사회가 웰빙 연구를 어떻게 적용하고 국가가 이를 어떻게 측정하는지."
  vi: "Trường học, nơi làm việc và cộng đồng áp dụng nghiên cứu về hạnh phúc ra sao, và các nước đo lường nó thế nào."
  ms: "Cara sekolah, tempat kerja dan komuniti menggunakan kajian kesejahteraan, dan cara negara mengukurnya."
  id: "Cara sekolah, tempat kerja, dan komunitas menerapkan riset kesejahteraan, serta cara negara mengukurnya."
  hi: "स्कूल, कार्यस्थल और समुदाय वेलबीइंग शोध को कैसे लागू करते हैं, और देश इसे कैसे मापते हैं।"
outcomes:
  - en: "Explain how wellbeing shapes health and social outcomes"
    zh: "解释幸福感如何影响健康和社会结果"
    zh-TW: "解釋幸福感如何影響健康和社會結果"
    ja: "ウェルビーイングが健康や社会に与える影響を説明する"
    ko: "웰빙이 건강과 사회적 결과에 미치는 영향 설명하기"
    vi: "Giải thích hạnh phúc ảnh hưởng sức khỏe và xã hội ra sao"
    ms: "Terangkan kesan kesejahteraan pada kesihatan dan sosial"
    id: "Menjelaskan pengaruh kesejahteraan pada kesehatan dan sosial"
    hi: "वेलबीइंग स्वास्थ्य और सामाजिक परिणामों को कैसे प्रभावित करता है, समझाना"
  - en: "Describe how wellbeing skills can be taught"
    zh: "说明如何教授幸福感技能"
    zh-TW: "說明如何教授幸福感技能"
    ja: "ウェルビーイングのスキルの教え方を説明する"
    ko: "웰빙 기술을 가르치는 방법 설명하기"
    vi: "Mô tả cách dạy các kỹ năng hạnh phúc"
    ms: "Huraikan cara mengajar kemahiran kesejahteraan"
    id: "Menjelaskan cara mengajarkan keterampilan kesejahteraan"
    hi: "वेलबीइंग कौशल कैसे सिखाए जा सकते हैं, बताना"
  - en: "Compare strengths-based and deficit-based approaches"
    zh: "比较优势导向与缺陷导向的方法"
    zh-TW: "比較優勢導向與缺陷導向的方法"
    ja: "強みベースと欠点ベースの手法を比べる"
    ko: "강점 기반과 결핍 기반 접근 비교하기"
    vi: "So sánh cách tiếp cận dựa trên điểm mạnh và điểm yếu"
    ms: "Bandingkan pendekatan berasaskan kekuatan dan kekurangan"
    id: "Membandingkan pendekatan berbasis kekuatan dan kekurangan"
    hi: "ताकत-आधारित और कमी-आधारित तरीकों की तुलना करना"
