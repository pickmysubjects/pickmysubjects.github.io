code: ELEN90026
year: 2027
learn:
  en: "Theory and numerical methods for nonlinear and convex optimisation, with and without constraints."
  zh: "非线性与凸优化的理论和数值方法，包括有约束和无约束问题。"
  zh-TW: "非線性與凸最佳化的理論與數值方法，包括有約束與無約束問題。"
  ja: "制約あり・なしの非線形最適化と凸最適化の理論と数値解法。"
  ko: "제약이 있거나 없는 비선형·볼록 최적화의 이론과 수치 해법."
  vi: "Lý thuyết và phương pháp số cho tối ưu phi tuyến và tối ưu lồi, có và không có ràng buộc."
  ms: "Teori dan kaedah berangka untuk pengoptimuman tak linear dan cembung, dengan dan tanpa kekangan."
  id: "Teori dan metode numerik untuk optimisasi nonlinier dan konveks, dengan dan tanpa kendala."
  hi: "बाधाओं सहित और बिना, नॉनलीनियर और कॉन्वेक्स ऑप्टिमाइज़ेशन का सिद्धांत और संख्यात्मक विधियाँ।"
outcomes:
  - en: "Use linear algebra and analysis in optimisation problems"
    zh: "在优化问题中运用线性代数和分析"
    zh-TW: "在最佳化問題中運用線性代數與分析"
    ja: "最適化問題に線形代数と解析学を使う"
    ko: "최적화 문제에 선형대수와 해석학 활용하기"
    vi: "Dùng đại số tuyến tính và giải tích trong bài toán tối ưu"
    ms: "Menggunakan aljabar linear dan analisis dalam masalah pengoptimuman"
    id: "Memakai aljabar linear dan analisis dalam masalah optimisasi"
    hi: "ऑप्टिमाइज़ेशन समस्याओं में रैखिक बीजगणित और विश्लेषण का उपयोग"
  - en: "Formulate engineering problems as optimisation problems"
    zh: "把工程问题表述为优化问题"
    zh-TW: "把工程問題表述為最佳化問題"
    ja: "工学の問題を最適化問題として定式化する"
    ko: "공학 문제를 최적화 문제로 정식화하기"
    vi: "Phát biểu bài toán kỹ thuật thành bài toán tối ưu"
    ms: "Merumuskan masalah kejuruteraan sebagai masalah pengoptimuman"
    id: "Merumuskan masalah teknik sebagai masalah optimisasi"
    hi: "इंजीनियरिंग समस्याओं को ऑप्टिमाइज़ेशन समस्याओं के रूप में लिखना"
  - en: "Solve constrained and unconstrained problems with computational tools"
    zh: "用计算工具求解有约束和无约束问题"
    zh-TW: "以計算工具求解有約束與無約束問題"
    ja: "計算ツールで制約あり・なしの問題を解く"
    ko: "계산 도구로 제약·무제약 문제 풀기"
    vi: "Giải bài toán có và không có ràng buộc bằng công cụ tính toán"
    ms: "Menyelesaikan masalah berkekangan dan tanpa kekangan dengan alat pengkomputeran"
    id: "Menyelesaikan masalah berkendala dan tanpa kendala dengan alat komputasi"
    hi: "कम्प्यूटेशनल टूल से बाधित और अबाधित समस्याएँ हल करना"
