code: MGMT30023
year: 2026
learn:
  en: "How the relationship between managers and workers is regulated: pay, unions, disputes and a say at work."
  zh: "管理者与员工关系如何被规范：薪酬、工会、纠纷和参与决策。"
  zh-TW: "管理者與員工關係如何受規範：薪資、工會、勞資爭議和參與決策。"
  ja: "経営者と労働者の関係がどう規制されるか：賃金、労働組合、紛争、経営参加。"
  ko: "경영자와 노동자 관계의 규율: 임금, 노조, 분쟁, 의사결정 참여."
  vi: "Quan hệ giữa quản lý và người lao động được điều chỉnh ra sao: lương, công đoàn, tranh chấp, quyền tham gia."
  ms: "Cara hubungan pengurus dan pekerja dikawal: gaji, kesatuan, pertikaian dan suara di tempat kerja."
  id: "Cara hubungan manajer dan pekerja diatur: upah, serikat pekerja, perselisihan, dan suara di tempat kerja."
  hi: "मैनेजर और कर्मचारियों के रिश्ते का नियमन: वेतन, यूनियन, विवाद और काम में भागीदारी।"
outcomes:
  - en: "Describe the main players and rules in employment"
    zh: "描述劳动关系中的主要角色和规则"
    zh-TW: "描述勞動關係中的主要角色和規則"
    ja: "雇用関係の主な当事者とルールを説明する"
    ko: "고용 관계의 주요 주체와 규칙 설명하기"
    vi: "Mô tả các bên chính và quy định trong lao động"
    ms: "Huraikan pihak utama dan peraturan dalam pekerjaan"
    id: "Menjelaskan pihak utama dan aturan ketenagakerjaan"
    hi: "रोज़गार के मुख्य पक्ष और नियम बताना"
  - en: "Weigh up competing views on workplace issues"
    zh: "评估对职场议题的不同观点"
    zh-TW: "評估對職場議題的不同觀點"
    ja: "職場の論点について対立する見方を評価する"
    ko: "직장 쟁점에 대한 상반된 관점 평가하기"
    vi: "Đánh giá các quan điểm trái chiều về vấn đề lao động"
    ms: "Nilai pandangan berbeza tentang isu tempat kerja"
    id: "Menimbang pandangan berbeda soal isu tempat kerja"
    hi: "कार्यस्थल के मुद्दों पर अलग-अलग नज़रिए परखना"
  - en: "Devise strategies for employee relations problems"
    zh: "为劳资关系问题制定对策"
    zh-TW: "為勞資關係問題擬定對策"
    ja: "労使関係の課題への対策を考える"
    ko: "노사관계 문제 해결 전략 세우기"
    vi: "Đề ra chiến lược cho vấn đề quan hệ lao động"
    ms: "Rangka strategi untuk masalah hubungan pekerja"
    id: "Menyusun strategi untuk masalah hubungan kerja"
    hi: "कर्मचारी संबंधों की समस्याओं के लिए रणनीति बनाना"
