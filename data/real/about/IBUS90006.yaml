code: IBUS90006
year: 2027
learn:
  en: "Research-level study of international business theory, multinational firms and how to develop new research ideas."
  zh: "研究层面的国际商务理论、跨国企业，以及如何提出新的研究想法。"
  zh-TW: "研究層面的國際商務理論、跨國企業，以及如何提出新的研究構想。"
  ja: "国際ビジネス理論と多国籍企業を研究レベルで学び、新しい研究テーマを考える。"
  ko: "국제경영 이론과 다국적 기업을 연구 수준에서 다루고 새 연구 아이디어를 개발."
  vi: "Nghiên cứu lý thuyết kinh doanh quốc tế, doanh nghiệp đa quốc gia và cách phát triển ý tưởng nghiên cứu mới."
  ms: "Kajian peringkat penyelidikan tentang teori perniagaan antarabangsa, syarikat multinasional dan idea penyelidikan baharu."
  id: "Kajian tingkat riset tentang teori bisnis internasional, perusahaan multinasional, dan ide riset baru."
  hi: "अंतरराष्ट्रीय व्यापार सिद्धांत, बहुराष्ट्रीय कंपनियों और नए शोध विचारों का शोध-स्तरीय अध्ययन।"
outcomes:
  - en: "Critically evaluate international business theory and research"
    zh: "批判地评估国际商务理论与研究"
    zh-TW: "批判地評估國際商務理論與研究"
    ja: "国際ビジネスの理論と研究を批判的に評価する"
    ko: "국제경영 이론과 연구 비판적으로 평가하기"
    vi: "Đánh giá phản biện lý thuyết và nghiên cứu kinh doanh quốc tế"
    ms: "Menilai teori dan kajian perniagaan antarabangsa secara kritis"
    id: "Menilai teori dan riset bisnis internasional secara kritis"
    hi: "अंतरराष्ट्रीय व्यापार सिद्धांत व शोध का आलोचनात्मक मूल्यांकन"
  - en: "Develop new research ideas in international business"
    zh: "提出国际商务领域的新研究想法"
    zh-TW: "提出國際商務領域的新研究構想"
    ja: "国際ビジネスの新しい研究アイデアを練る"
    ko: "국제경영 분야의 새 연구 아이디어 개발하기"
    vi: "Phát triển ý tưởng nghiên cứu mới về kinh doanh quốc tế"
    ms: "Membangunkan idea penyelidikan baharu"
    id: "Mengembangkan ide riset baru di bisnis internasional"
    hi: "अंतरराष्ट्रीय व्यापार में नए शोध विचार विकसित करना"
