code: ORAL20002
year: 2026
learn:
  en: "Ethics, law and regulation in dental practice, plus planning health education for schools with field visits."
  zh: "口腔执业中的伦理、法规与监管，并通过实地走访规划学校健康教育。"
  zh-TW: "口腔執業中的倫理、法規與監管，並透過實地走訪規劃學校健康教育。"
  ja: "歯科診療の倫理・法・規制と、現地訪問を通じた学校向け健康教育の計画。"
  ko: "치과 진료의 윤리·법·규제와 현장 방문을 통한 학교 보건교육 기획."
  vi: "Đạo đức, luật và quy định trong nha khoa, cùng lập kế hoạch giáo dục sức khỏe ở trường qua thực địa."
  ms: "Etika, undang-undang dan peraturan amalan pergigian, serta merancang pendidikan kesihatan sekolah."
  id: "Etika, hukum, dan regulasi praktik gigi, plus merancang edukasi kesehatan sekolah lewat kunjungan lapangan."
  hi: "दंत चिकित्सा में नैतिकता, कानून और नियमन, साथ में फ़ील्ड विज़िट से स्कूल स्वास्थ्य शिक्षा की योजना।"
outcomes:
  - en: "Apply ethics to health care and research"
    zh: "将伦理原则用于医疗和研究"
    zh-TW: "將倫理原則用於醫療和研究"
    ja: "医療と研究に倫理を当てはめる"
    ko: "의료와 연구에 윤리 적용하기"
    vi: "Áp dụng đạo đức vào chăm sóc sức khỏe và nghiên cứu"
    ms: "Gunakan etika dalam penjagaan kesihatan dan kajian"
    id: "Menerapkan etika pada layanan kesehatan dan riset"
    hi: "स्वास्थ्य सेवा और शोध में नैतिकता लागू करना"
  - en: "Explain the rules that govern dental practice"
    zh: "解释规范口腔执业的法规"
    zh-TW: "解釋規範口腔執業的法規"
    ja: "歯科診療を律する規則を説明する"
    ko: "치과 진료를 규율하는 규정 설명하기"
    vi: "Giải thích các quy định quản lý hành nghề nha khoa"
    ms: "Terangkan peraturan yang mengawal amalan pergigian"
    id: "Menjelaskan aturan yang mengatur praktik gigi"
    hi: "दंत चिकित्सा को नियंत्रित करने वाले नियम समझाना"
  - en: "Plan and deliver oral health education"
    zh: "策划并开展口腔健康教育"
    zh-TW: "策劃並開展口腔健康教育"
    ja: "口腔健康教育を計画し実施する"
    ko: "구강 보건교육 기획하고 진행하기"
    vi: "Lập kế hoạch và thực hiện giáo dục sức khỏe răng miệng"
    ms: "Rancang dan sampaikan pendidikan kesihatan mulut"
    id: "Merancang dan memberikan edukasi kesehatan mulut"
    hi: "मौखिक स्वास्थ्य शिक्षा की योजना बनाकर देना"
