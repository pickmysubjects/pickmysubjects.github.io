code: ACTL10001
year: 2026
learn:
  en: "What actuaries do, plus the basic maths they use: interest, life tables and pricing simple life insurance."
  zh: "精算师做什么，以及基础工具：利息、生命表和简单寿险定价。"
  zh-TW: "精算師做什麼，以及基礎工具：利息、生命表和簡單壽險定價。"
  ja: "アクチュアリーの仕事と基本の数学：利息、生命表、簡単な生命保険の価格付け。"
  ko: "보험계리사가 하는 일과 기본 수학: 이자, 생명표, 간단한 생명보험 가격 결정."
  vi: "Chuyên gia tính toán bảo hiểm làm gì, cùng toán cơ bản: lãi suất, bảng sống và định giá bảo hiểm nhân thọ đơn giản."
  ms: "Apa kerja aktuari, serta matematik asasnya: faedah, jadual hayat dan penentuan harga insurans hayat mudah."
  id: "Apa yang dikerjakan aktuaris, plus matematika dasarnya: bunga, tabel mortalitas, dan harga asuransi jiwa sederhana."
  hi: "एक्चुअरी क्या करते हैं, और उनका बुनियादी गणित: ब्याज, लाइफ़ टेबल और सरल जीवन बीमा की कीमत तय करना।"
outcomes:
  - en: "Work with compound interest, annuities and loans"
    zh: "计算复利、年金和贷款"
    zh-TW: "計算複利、年金和貸款"
    ja: "複利・年金・ローンを計算する"
    ko: "복리, 연금, 대출 계산하기"
    vi: "Tính lãi kép, niên kim và khoản vay"
    ms: "Kira faedah kompaun, anuiti dan pinjaman"
    id: "Menghitung bunga majemuk, anuitas, dan pinjaman"
    hi: "चक्रवृद्धि ब्याज, एन्युइटी और लोन की गणना"
  - en: "Build and use a life table"
    zh: "构建和使用生命表"
    zh-TW: "建立和使用生命表"
    ja: "生命表を作って使う"
    ko: "생명표 만들고 활용하기"
    vi: "Lập và sử dụng bảng sống"
    ms: "Bina dan guna jadual hayat"
    id: "Menyusun dan memakai tabel mortalitas"
    hi: "लाइफ़ टेबल बनाना और इस्तेमाल करना"
  - en: "Price simple life insurance contracts"
    zh: "给简单的寿险合同定价"
    zh-TW: "替簡單的壽險契約定價"
    ja: "簡単な生命保険の保険料を計算する"
    ko: "간단한 생명보험 계약 가격 산정"
    vi: "Định giá hợp đồng bảo hiểm nhân thọ đơn giản"
    ms: "Tentukan harga kontrak insurans hayat mudah"
    id: "Menentukan harga kontrak asuransi jiwa sederhana"
    hi: "सरल जीवन बीमा अनुबंधों की कीमत तय करना"
