code: PATH30004
year: 2026
learn:
  en: "A research project on a human disease, done in a lab or library within a research group."
  zh: "在研究组里做一个关于人类疾病的实验或文献项目。"
  zh-TW: "在研究小組裡做一個關於人類疾病的實驗或文獻專題。"
  ja: "研究グループで、ヒトの病気について実験または文献調査の研究プロジェクトを行う。"
  ko: "연구팀 안에서 실험실 또는 문헌으로 진행하는 인간 질병 연구 프로젝트."
  vi: "Dự án nghiên cứu về một bệnh ở người, làm trong phòng lab hoặc thư viện cùng nhóm nghiên cứu."
  ms: "Projek penyelidikan tentang penyakit manusia, di makmal atau perpustakaan dalam kumpulan penyelidikan."
  id: "Proyek riset tentang penyakit manusia, di lab atau perpustakaan dalam kelompok riset."
  hi: "किसी मानव बीमारी पर रिसर्च प्रोजेक्ट, रिसर्च ग्रुप में लैब या लाइब्रेरी में।"
outcomes:
  - en: "Plan and run your own research project"
    zh: "计划并完成自己的研究项目"
    zh-TW: "規劃並完成自己的研究專題"
    ja: "自分の研究プロジェクトを計画し実行する"
    ko: "자신의 연구 프로젝트를 계획하고 수행"
    vi: "Lên kế hoạch và thực hiện dự án nghiên cứu riêng"
    ms: "Rancang dan jalankan projek penyelidikan sendiri"
    id: "Merencanakan dan menjalankan proyek riset sendiri"
    hi: "अपना रिसर्च प्रोजेक्ट प्लान करना और चलाना"
  - en: "Find and assess recent papers on a disease"
    zh: "查找并评估相关的最新论文"
    zh-TW: "查找並評估相關的最新論文"
    ja: "病気に関する最近の論文を探して評価する"
    ko: "질병에 관한 최신 논문을 찾고 평가"
    vi: "Tìm và đánh giá bài báo mới về một bệnh"
    ms: "Cari dan nilai kertas kajian terkini tentang penyakit"
    id: "Mencari dan menilai makalah terbaru tentang suatu penyakit"
    hi: "किसी बीमारी पर नए पेपर ढूँढना और परखना"
  - en: "Present and defend your results in a talk and report"
    zh: "用报告和展示讲清并捍卫结果"
    zh-TW: "用報告和簡報講清並捍衛結果"
    ja: "発表とレポートで結果を説明し、根拠を示す"
    ko: "발표와 보고서로 결과를 제시하고 방어"
    vi: "Trình bày và bảo vệ kết quả qua bài nói và báo cáo"
    ms: "Bentang dan pertahankan hasil dalam pembentangan dan laporan"
    id: "Mempresentasikan dan mempertahankan hasil lewat presentasi dan laporan"
    hi: "टॉक और रिपोर्ट में नतीजे पेश करना और उनका बचाव करना"
