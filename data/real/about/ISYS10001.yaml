code: ISYS10001
year: 2026
learn:
  en: "How people, organisations and IT fit together: systems thinking, business processes, outsourcing, ethics and security."
  zh: "人、组织与信息技术如何结合：系统思维、业务流程、外包、伦理与安全。"
  zh-TW: "人、組織與資訊科技如何結合：系統思維、業務流程、外包、倫理與安全。"
  ja: "人・組織・ITの関係：システム思考、業務プロセス、外部委託、倫理、セキュリティ。"
  ko: "사람·조직·IT의 관계: 시스템 사고, 업무 프로세스, 아웃소싱, 윤리, 보안."
  vi: "Con người, tổ chức và CNTT gắn kết thế nào: tư duy hệ thống, quy trình, thuê ngoài, đạo đức."
  ms: "Hubungan manusia, organisasi dan IT: pemikiran sistem, proses perniagaan, etika, keselamatan."
  id: "Hubungan orang, organisasi, dan TI: berpikir sistem, proses bisnis, alih daya, etika."
  hi: "लोग, संगठन और IT कैसे जुड़ते हैं: सिस्टम सोच, बिज़नेस प्रक्रियाएँ, आउटसोर्सिंग, नैतिकता।"
outcomes:
  - en: "Explain what information systems do in a business"
    zh: "说明信息系统在企业中的作用"
    zh-TW: "說明資訊系統在企業中的作用"
    ja: "企業での情報システムの役割を説明する"
    ko: "기업에서 정보 시스템의 역할 설명하기"
    vi: "Giải thích vai trò hệ thống thông tin"
    ms: "Jelaskan peranan sistem maklumat dalam perniagaan"
    id: "Menjelaskan peran sistem informasi di bisnis"
    hi: "बिज़नेस में इन्फ़ॉर्मेशन सिस्टम की भूमिका समझाना"
  - en: "Map and improve business processes"
    zh: "梳理并改进业务流程"
    zh-TW: "梳理並改進業務流程"
    ja: "業務プロセスを整理し改善する"
    ko: "업무 프로세스 정리하고 개선하기"
    vi: "Mô tả và cải tiến quy trình kinh doanh"
    ms: "Peta dan perbaiki proses perniagaan"
    id: "Memetakan dan memperbaiki proses bisnis"
    hi: "बिज़नेस प्रक्रियाओं को समझना और सुधारना"
  - en: "Weigh legal, ethical and security risks of IT"
    zh: "权衡信息技术的法律、伦理与安全风险"
    zh-TW: "權衡資訊科技的法律、倫理與安全風險"
    ja: "ITの法的・倫理的・安全上のリスクを考える"
    ko: "IT의 법·윤리·보안 위험 따져보기"
    vi: "Cân nhắc rủi ro pháp lý, đạo đức, bảo mật"
    ms: "Nilai risiko undang-undang, etika dan keselamatan IT"
    id: "Menimbang risiko hukum, etika, keamanan TI"
    hi: "IT के क़ानूनी, नैतिक और सुरक्षा जोखिम परखना"
