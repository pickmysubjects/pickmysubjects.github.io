code: ENGM90015
year: 2027
learn:
  en: "Leadership and management theory for engineers, applied to real professional roles and running solutions."
  zh: "面向工程师的领导与管理理论，并应用于真实职业角色和方案实施。"
  zh-TW: "面向工程師的領導與管理理論，並應用於真實職業角色和方案實施。"
  ja: "エンジニアのためのリーダーシップと管理の理論を、実際の職務と解決策の実行に生かす。"
  ko: "엔지니어를 위한 리더십·관리 이론을 실제 직무와 해결책 실행에 적용."
  vi: "Lý thuyết lãnh đạo và quản lý cho kỹ sư, áp dụng vào vai trò nghề nghiệp thực tế và triển khai giải pháp."
  ms: "Teori kepimpinan dan pengurusan untuk jurutera, digunakan dalam peranan profesional sebenar dan pelaksanaan penyelesaian."
  id: "Teori kepemimpinan dan manajemen untuk insinyur, diterapkan pada peran profesional nyata dan pelaksanaan solusi."
  hi: "इंजीनियरों के लिए नेतृत्व और प्रबंधन सिद्धांत, वास्तविक पेशेवर भूमिकाओं और समाधान लागू करने में।"
outcomes:
  - en: "Manage the delivery of engineering solutions"
    zh: "管理工程方案的实施"
    zh-TW: "管理工程方案的實施"
    ja: "工学的な解決策の実行を管理する"
    ko: "공학 해결책 실행 관리하기"
    vi: "Quản lý việc triển khai giải pháp kỹ thuật"
    ms: "Mengurus pelaksanaan penyelesaian kejuruteraan"
    id: "Mengelola pelaksanaan solusi teknik"
    hi: "इंजीनियरिंग समाधानों का कार्यान्वयन प्रबंधित करना"
  - en: "Use negotiation, motivation and performance management"
    zh: "运用谈判、激励和绩效管理"
    zh-TW: "運用談判、激勵和績效管理"
    ja: "交渉・動機づけ・業績管理を使う"
    ko: "협상, 동기부여, 성과 관리 활용하기"
    vi: "Vận dụng đàm phán, tạo động lực và quản lý hiệu suất"
    ms: "Menggunakan rundingan, motivasi dan pengurusan prestasi"
    id: "Menerapkan negosiasi, motivasi, dan manajemen kinerja"
    hi: "बातचीत, प्रेरणा और प्रदर्शन प्रबंधन का उपयोग"
