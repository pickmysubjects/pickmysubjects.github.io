code: DRAM30033
year: 2026
learn:
  en: "Work as an independent theatre-maker: a residency with a local company, a solo show and a mini festival."
  zh: "以独立戏剧人身份工作：在本地剧团驻留、做独角戏和小型艺术节。"
  zh-TW: "以獨立劇場人身分工作：在本地劇團駐留、做獨角戲和小型藝術節。"
  ja: "独立した作り手として：地元劇団での滞在制作、ソロ作品、ミニフェス。"
  ko: "독립 창작자로: 지역 극단 레지던시, 솔로 공연, 미니 축제."
  vi: "Làm nghệ sĩ độc lập: lưu trú ở đoàn kịch địa phương, diễn đơn, lễ hội nhỏ."
  ms: "Bekerja sebagai pembikin teater bebas: residensi, karya solo dan festival mini."
  id: "Bekerja sebagai pembuat teater mandiri: residensi, karya solo dan festival mini."
  hi: "स्वतंत्र थिएटर-मेकर के रूप में: स्थानीय कंपनी में रेज़िडेंसी, सोलो शो, मिनी फ़ेस्टिवल।"
outcomes:
  - en: "Complete a 50-hour industry residency"
    zh: "完成50小时的行业驻留"
    zh-TW: "完成 50 小時的業界駐留"
    ja: "50時間の業界滞在研修を修了する"
    ko: "50시간 업계 레지던시 마치기"
    vi: "Hoàn thành 50 giờ lưu trú ngành"
    ms: "Siapkan residensi industri 50 jam"
    id: "Menyelesaikan residensi industri 50 jam"
    hi: "50 घंटे की इंडस्ट्री रेज़िडेंसी पूरी करना"
  - en: "Create and stage your own solo work"
    zh: "创作并上演个人作品"
    zh-TW: "創作並上演個人作品"
    ja: "自分のソロ作品を作り上演する"
    ko: "자신의 솔로 작품 만들어 올리기"
    vi: "Tạo và dựng tiết mục đơn của mình"
    ms: "Cipta dan pentaskan karya solo sendiri"
    id: "Membuat dan mementaskan karya solo"
    hi: "अपना सोलो काम बनाना और मंचित करना"
  - en: "Build contacts in the local theatre scene"
    zh: "在本地戏剧圈建立人脉"
    zh-TW: "在本地劇場圈建立人脈"
    ja: "地元の演劇界で人脈を作る"
    ko: "지역 연극계 인맥 쌓기"
    vi: "Tạo quan hệ trong giới kịch địa phương"
    ms: "Bina rangkaian dalam dunia teater tempatan"
    id: "Membangun jejaring di dunia teater lokal"
    hi: "स्थानीय थिएटर जगत में संपर्क बनाना"
