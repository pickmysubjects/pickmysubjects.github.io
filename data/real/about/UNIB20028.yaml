code: UNIB20028
year: 2026
learn:
  en: "Coffee from farm to cup: trade and economics, growing and processing, health and taste, history and culture."
  zh: "从农场到杯中的咖啡：贸易与经济、种植与加工、健康与风味、历史与文化。"
  zh-TW: "從農場到杯中的咖啡：貿易與經濟、種植與加工、健康與風味、歷史與文化。"
  ja: "農園からカップまでのコーヒー：貿易と経済、栽培と加工、健康と味、歴史と文化。"
  ko: "농장에서 컵까지의 커피: 무역과 경제, 재배와 가공, 건강과 맛, 역사와 문화."
  vi: "Cà phê từ nông trại đến tách: thương mại, kinh tế, trồng và chế biến, sức khỏe, hương vị, lịch sử, văn hóa."
  ms: "Kopi dari ladang ke cawan: perdagangan dan ekonomi, penanaman dan pemprosesan, kesihatan, rasa dan budaya."
  id: "Kopi dari kebun ke cangkir: perdagangan dan ekonomi, budidaya dan olahan, kesehatan, rasa, sejarah, budaya."
  hi: "खेत से कप तक कॉफ़ी: व्यापार और अर्थशास्त्र, खेती और प्रसंस्करण, स्वास्थ्य और स्वाद, इतिहास और संस्कृति।"
outcomes:
  - en: "Explain how the global coffee trade works"
    zh: "解释全球咖啡贸易如何运作"
    zh-TW: "解釋全球咖啡貿易如何運作"
    ja: "世界のコーヒー貿易の仕組みを説明する"
    ko: "세계 커피 무역의 작동 방식 설명하기"
    vi: "Giải thích thương mại cà phê toàn cầu vận hành ra sao"
    ms: "Terangkan cara perdagangan kopi global berfungsi"
    id: "Menjelaskan cara kerja perdagangan kopi global"
    hi: "वैश्विक कॉफ़ी व्यापार कैसे चलता है, समझाना"
  - en: "Weigh coffee's environmental footprint"
    zh: "评估咖啡的环境足迹"
    zh-TW: "評估咖啡的環境足跡"
    ja: "コーヒーの環境負荷を評価する"
    ko: "커피의 환경 발자국 따져보기"
    vi: "Đánh giá dấu chân môi trường của cà phê"
    ms: "Nilai jejak alam sekitar kopi"
    id: "Menilai jejak lingkungan kopi"
    hi: "कॉफ़ी के पर्यावरणीय असर का आकलन करना"
  - en: "Present findings in group media projects"
    zh: "通过小组媒体项目展示发现"
    zh-TW: "透過小組媒體專案展示發現"
    ja: "グループのメディア制作で成果を発表する"
    ko: "그룹 미디어 프로젝트로 결과 발표하기"
    vi: "Trình bày kết quả qua dự án truyền thông nhóm"
    ms: "Bentang dapatan melalui projek media kumpulan"
    id: "Menyajikan temuan lewat proyek media kelompok"
    hi: "समूह मीडिया परियोजनाओं में निष्कर्ष प्रस्तुत करना"
