code: MUSI30226
year: 2026
learn:
  en: "The final ensemble subject: lead small and large groups, workshop performances and write songs for a folio."
  zh: "最后一门合奏课：带领大小乐团、工作坊演出，并为作品集写歌。"
  zh-TW: "最後一門合奏課：帶領大小樂團、工作坊演出，並為作品集寫歌。"
  ja: "最後のアンサンブル科目。大小の編成を率い、ワークショップで演奏し、作品集用に曲を書く。"
  ko: "마지막 앙상블 과목: 소·대편성 이끌기, 워크숍 공연, 작품집용 작곡."
  vi: "Môn hòa tấu cuối: dẫn nhóm nhỏ và lớn, biểu diễn workshop, viết bài cho tập tác phẩm."
  ms: "Subjek ensembel terakhir: pimpin kumpulan kecil dan besar, persembahan bengkel, tulis lagu."
  id: "Mata kuliah ansambel terakhir: pimpin grup kecil dan besar, tampil di lokakarya, tulis lagu."
  hi: "अंतिम एन्सेम्बल विषय: छोटे-बड़े समूह चलाना, वर्कशॉप प्रस्तुति और फ़ोलियो के लिए गीत।"
outcomes:
  - en: "Lead and contribute in an ensemble"
    zh: "在乐团中担任领导并贡献"
    zh-TW: "在樂團中擔任領導並貢獻"
    ja: "アンサンブルを率い、貢献する"
    ko: "앙상블을 이끌고 기여하기"
    vi: "Dẫn dắt và đóng góp trong ban nhạc"
    ms: "Memimpin dan menyumbang dalam ensembel"
    id: "Memimpin dan berkontribusi di ansambel"
    hi: "एन्सेम्बल में नेतृत्व और योगदान"
  - en: "Bring a personal style to group playing"
    zh: "在合奏中展现个人风格"
    zh-TW: "在合奏中展現個人風格"
    ja: "合奏に自分の個性を出す"
    ko: "합주에 개인 스타일 더하기"
    vi: "Đưa phong cách riêng vào hòa tấu"
    ms: "Bawa gaya peribadi dalam permainan kumpulan"
    id: "Membawa gaya pribadi ke permainan grup"
    hi: "समूह वादन में अपनी शैली लाना"
  - en: "Give useful critical feedback"
    zh: "给出有建设性的评价"
    zh-TW: "給出有建設性的評價"
    ja: "建設的な批評をする"
    ko: "건설적인 비평하기"
    vi: "Góp ý phê bình xây dựng"
    ms: "Beri maklum balas kritis berguna"
    id: "Memberi masukan kritis yang berguna"
    hi: "उपयोगी आलोचनात्मक प्रतिक्रिया देना"
