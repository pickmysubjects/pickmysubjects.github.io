code: HIST20084
year: 2026
learn:
  en: "How the Russian Empire became the Soviet Union through revolution, war and terror, and how Soviet society changed after."
  zh: "俄罗斯帝国如何经由革命、战争和恐怖成为苏联，以及之后苏联社会的变化。"
  zh-TW: "俄羅斯帝國如何經由革命、戰爭和恐怖成為蘇聯，以及之後蘇聯社會的變化。"
  ja: "ロシア帝国が革命・戦争・テロルを経てソ連となった過程と、その後のソ連社会の変化を学ぶ。"
  ko: "러시아 제국이 혁명, 전쟁, 테러를 거쳐 소련이 된 과정과 그 뒤 소련 사회의 변화를 배운다."
  vi: "Đế quốc Nga trở thành Liên Xô qua cách mạng, chiến tranh và khủng bố ra sao, và xã hội Xô viết thay đổi thế nào sau đó."
  ms: "Cara Empayar Rusia menjadi Kesatuan Soviet melalui revolusi, perang dan keganasan, serta perubahan masyarakat Soviet selepasnya."
  id: "Cara Kekaisaran Rusia menjadi Uni Soviet lewat revolusi, perang, dan teror, serta perubahan masyarakat Soviet sesudahnya."
  hi: "रूसी साम्राज्य क्रांति, युद्ध और आतंक से सोवियत संघ कैसे बना, और उसके बाद सोवियत समाज कैसे बदला।"
outcomes:
  - en: "Discuss the challenges of reading Soviet history"
    zh: "讨论解读苏联历史的难点"
    zh-TW: "討論解讀蘇聯歷史的難點"
    ja: "ソ連史を読み解く難しさを論じる"
    ko: "소련사 해석의 어려움 토론하기"
    vi: "Thảo luận khó khăn khi diễn giải lịch sử Xô viết"
    ms: "Bincangkan cabaran mentafsir sejarah Soviet"
    id: "Membahas tantangan menafsirkan sejarah Soviet"
    hi: "सोवियत इतिहास को समझने की चुनौतियों पर चर्चा करना"
  - en: "Analyse a range of Soviet primary sources"
    zh: "分析多种苏联一手史料"
    zh-TW: "分析多種蘇聯一手史料"
    ja: "さまざまなソ連の一次史料を分析する"
    ko: "다양한 소련 1차 사료 분석하기"
    vi: "Phân tích nhiều nguồn sơ cấp về Liên Xô"
    ms: "Analisis pelbagai sumber primer Soviet"
    id: "Menganalisis beragam sumber primer Soviet"
    hi: "कई तरह के सोवियत प्राथमिक स्रोतों का विश्लेषण करना"
  - en: "Build an argument about the Soviet past"
    zh: "就苏联历史构建论点"
    zh-TW: "就蘇聯歷史建構論點"
    ja: "ソ連の過去について議論を組み立てる"
    ko: "소련의 과거에 대한 논증 세우기"
    vi: "Xây dựng lập luận về quá khứ Xô viết"
    ms: "Bina hujah tentang masa lalu Soviet"
    id: "Menyusun argumen tentang masa lalu Soviet"
    hi: "सोवियत अतीत पर तर्क तैयार करना"
