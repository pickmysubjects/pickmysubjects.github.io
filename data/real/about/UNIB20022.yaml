code: UNIB20022
year: 2026
learn:
  en: "Masterclasses from experts and knowledge holders on First Nations knowledge in language, land care, music, health and more."
  zh: "一系列大师课，由专家和知识传承人讲授原住民和托雷斯海峡岛民在语言、土地照护、音乐、健康等方面的知识。"
  zh-TW: "一系列大師課，由專家和知識傳承人講授原住民和托雷斯海峽島民在語言、土地照護、音樂、健康等方面的知識。"
  ja: "専門家や知識の継承者によるマスタークラス。言語、土地の管理、音楽、健康などにおけるアボリジナルとトレス海峡諸島民の知。"
  ko: "전문가와 지식 보유자의 마스터클래스. 언어, 땅 돌봄, 음악, 건강 등에 담긴 애버리지니·토레스 해협 섬 주민의 지식."
  vi: "Các lớp chuyên đề về tri thức thổ dân và người đảo Torres Strait trong ngôn ngữ, chăm sóc đất, âm nhạc, sức khỏe, do chuyên gia giảng."
  ms: "Kelas induk tentang ilmu Orang Asli dan Torres Strait dalam bahasa, penjagaan tanah, muzik, kesihatan dan lain-lain, oleh pakar dan pemegang ilmu."
  id: "Kelas master tentang pengetahuan Aborigin dan Torres Strait dalam bahasa, perawatan lahan, musik, kesehatan dan lainnya, oleh pakar dan pemegang ilmu."
  hi: "विशेषज्ञों और ज्ञान-धारकों की मास्टरक्लास: भाषा, ज़मीन की देखभाल, संगीत, स्वास्थ्य आदि में आदिवासी और टॉरेस स्ट्रेट द्वीपवासी ज्ञान।"
outcomes:
  - en: "Describe the diversity of Indigenous cultures"
    zh: "描述原住民文化的多样性"
    zh-TW: "描述原住民文化的多樣性"
    ja: "先住民文化の多様性を説明する"
    ko: "원주민 문화의 다양성 설명하기"
    vi: "Mô tả sự đa dạng của văn hóa bản địa"
    ms: "Huraikan kepelbagaian budaya Orang Asli"
    id: "Menggambarkan keragaman budaya Pribumi"
    hi: "आदिवासी संस्कृतियों की विविधता बताना"
  - en: "Explain Indigenous knowledge across fields"
    zh: "说明原住民知识在各领域的体现"
    zh-TW: "說明原住民知識在各領域的體現"
    ja: "さまざまな分野の先住民の知を説明する"
    ko: "여러 분야의 원주민 지식 설명하기"
    vi: "Giải thích tri thức bản địa trong nhiều lĩnh vực"
    ms: "Terangkan ilmu Orang Asli merentas bidang"
    id: "Menjelaskan pengetahuan Pribumi lintas bidang"
    hi: "अलग-अलग क्षेत्रों में आदिवासी ज्ञान समझाना"
  - en: "Reflect on respectful knowledge exchange"
    zh: "反思尊重的知识交流"
    zh-TW: "反思尊重的知識交流"
    ja: "敬意ある知の交流について考える"
    ko: "존중하는 지식 교류 성찰하기"
    vi: "Suy ngẫm về trao đổi tri thức tôn trọng"
    ms: "Renungkan pertukaran ilmu secara hormat"
    id: "Merefleksikan pertukaran pengetahuan yang saling menghormati"
    hi: "सम्मानजनक ज्ञान-आदान-प्रदान पर विचार करना"
