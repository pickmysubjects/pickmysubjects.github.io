code: MUSI10196
year: 2026
learn:
  en: "Builds on Lab 1: more group experiments across art forms, ending with a new collaborative work you present."
  zh: "在实验室1基础上，继续跨艺术形式的小组实验，最后展示一部合作新作。"
  zh-TW: "在實驗室1基礎上，繼續跨藝術形式的小組實驗，最後發表一部合作新作。"
  ja: "ラボ1の続き。分野横断のグループ実験を重ね、最後に共同新作を発表する。"
  ko: "랩 1에 이어 여러 예술 형식의 그룹 실험을 하고 마지막에 공동 신작을 발표한다."
  vi: "Tiếp nối Lab 1: thêm thử nghiệm nhóm liên ngành, kết thúc bằng trình diễn một tác phẩm chung mới."
  ms: "Lanjutan Makmal 1: lebih banyak eksperimen kumpulan rentas seni, diakhiri persembahan karya bersama."
  id: "Lanjutan Lab 1: lebih banyak eksperimen kelompok lintas seni, diakhiri presentasi karya bersama baru."
  hi: "लैब 1 के आगे: कला रूपों में और समूह प्रयोग, अंत में एक नई साझा रचना की प्रस्तुति।"
outcomes:
  - en: "Make music together in a group"
    zh: "在小组中共同创作音乐"
    zh-TW: "在小組中共同創作音樂"
    ja: "グループで音楽を作る"
    ko: "그룹으로 함께 음악 만들기"
    vi: "Cùng nhóm sáng tác âm nhạc"
    ms: "Cipta muzik bersama dalam kumpulan"
    id: "Membuat musik bersama dalam kelompok"
    hi: "समूह में मिलकर संगीत बनाना"
  - en: "Combine music with other art forms and media"
    zh: "将音乐与其他艺术形式和媒介结合"
    zh-TW: "將音樂與其他藝術形式和媒介結合"
    ja: "音楽を他の芸術やメディアと組み合わせる"
    ko: "음악을 다른 예술·매체와 결합하기"
    vi: "Kết hợp âm nhạc với nghệ thuật và phương tiện khác"
    ms: "Gabung muzik dengan seni dan media lain"
    id: "Menggabungkan musik dengan seni dan media lain"
    hi: "संगीत को अन्य कलाओं व माध्यमों से जोड़ना"
  - en: "Reflect on your own experiments in a logbook"
    zh: "在日志中反思自己的实验"
    zh-TW: "在日誌中反思自己的實驗"
    ja: "ログブックで自分の実験を振り返る"
    ko: "기록장에 자신의 실험 돌아보기"
    vi: "Suy ngẫm thử nghiệm của mình trong nhật ký"
    ms: "Renung eksperimen sendiri dalam log"
    id: "Merefleksikan eksperimen sendiri di log"
    hi: "लॉगबुक में अपने प्रयोगों पर विचार"
