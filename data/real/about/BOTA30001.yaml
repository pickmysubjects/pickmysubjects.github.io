code: BOTA30001
year: 2026
learn:
  en: "Seaweeds, seagrasses and phytoplankton: their biology, diversity and ecology, with fieldwork on Australian coasts."
  zh: "海藻、海草和浮游植物的生物学、多样性与生态，含野外考察。"
  zh-TW: "海藻、海草與浮游植物的生物學、多樣性與生態，含野外調查。"
  ja: "海藻・海草・植物プランクトンの生物学と生態、野外調査あり。"
  ko: "해조류·해초·식물플랑크톤의 생물학과 생태, 현장 조사 포함."
  vi: "Rong biển, cỏ biển và thực vật phù du: sinh học, đa dạng, sinh thái, có đi thực địa."
  ms: "Rumpai laut, rumput laut dan fitoplankton: biologi, kepelbagaian dan ekologi, dengan kerja lapangan."
  id: "Rumput laut, lamun, dan fitoplankton: biologi, keragaman, dan ekologi, dengan kerja lapangan."
  hi: "समुद्री शैवाल, सी-ग्रास और फ़ाइटोप्लांकटन: जीवविज्ञान, विविधता, पारिस्थितिकी, फ़ील्डवर्क सहित।"
outcomes:
