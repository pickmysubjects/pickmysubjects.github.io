code: CWRI20002
year: 2026
learn:
  en: "The craft of short fiction: plot, conflict, character, point of view and style, reading stories from modernism to now."
  zh: "短篇小说的写作技巧：情节、冲突、人物、视角和风格，阅读从现代主义至今的作品。"
  zh-TW: "短篇小說的寫作技巧：情節、衝突、人物、視角和風格，閱讀從現代主義至今的作品。"
  ja: "短編小説の技法。筋・葛藤・人物・視点・文体を、モダニズムから現代までの作品を読みながら学ぶ。"
  ko: "단편 소설의 기법. 플롯·갈등·인물·시점·문체를 모더니즘부터 현재까지의 작품을 읽으며 배운다."
  vi: "Kỹ thuật viết truyện ngắn: cốt truyện, xung đột, nhân vật, điểm nhìn và văn phong, đọc truyện từ chủ nghĩa hiện đại đến nay."
  ms: "Kemahiran cerpen: plot, konflik, watak, sudut pandangan dan gaya, membaca cerita dari era modenis hingga kini."
  id: "Teknik cerpen: plot, konflik, tokoh, sudut pandang dan gaya, sambil membaca cerita dari era modernis hingga kini."
  hi: "लघु कथा की कारीगरी: कथानक, टकराव, पात्र, दृष्टिकोण और शैली, आधुनिकतावाद से अब तक की कहानियां पढ़ते हुए।"
outcomes:
  - en: "Use core techniques of short fiction"
    zh: "运用短篇小说的核心技巧"
    zh-TW: "運用短篇小說的核心技巧"
    ja: "短編小説の基本技法を使う"
    ko: "단편 소설의 핵심 기법 활용하기"
    vi: "Sử dụng các kỹ thuật cốt lõi của truyện ngắn"
    ms: "Guna teknik teras cerpen"
    id: "Memakai teknik inti cerpen"
    hi: "लघु कथा की मूल तकनीकें इस्तेमाल करना"
  - en: "Analyse how published stories are built"
    zh: "分析已出版小说的结构"
    zh-TW: "分析已出版小說的結構"
    ja: "出版された短編の組み立てを分析する"
    ko: "출간된 단편의 구성 분석하기"
    vi: "Phân tích cấu trúc của các truyện đã xuất bản"
    ms: "Analisis binaan cerita yang diterbitkan"
    id: "Menganalisis susunan cerita yang sudah terbit"
    hi: "प्रकाशित कहानियों की बनावट का विश्लेषण करना"
  - en: "Write and revise your own short stories"
    zh: "创作并修改自己的短篇小说"
    zh-TW: "創作並修改自己的短篇小說"
    ja: "自分の短編を書き推敲する"
    ko: "자신의 단편 쓰고 고치기"
    vi: "Viết và sửa truyện ngắn của mình"
    ms: "Tulis dan semak cerpen sendiri"
    id: "Menulis dan merevisi cerpen sendiri"
    hi: "अपनी लघु कथाएं लिखना और सुधारना"
