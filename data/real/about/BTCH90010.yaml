code: BTCH90010
year: 2027
learn:
  en: "Why biotech like GMOs and gene editing meets public distrust, and how to deploy it successfully."
  zh: "为什么转基因和基因编辑等生物技术遭到公众不信任，以及如何成功推广。"
  zh-TW: "為什麼基改和基因編輯等生物技術遭到大眾不信任，以及如何成功推廣。"
  ja: "GMOやゲノム編集が社会に不信を持たれる理由と、普及のための戦略。"
  ko: "GMO·유전자 편집 같은 생명공학이 불신받는 이유와 성공적 도입 전략."
  vi: "Vì sao công nghệ sinh học như GMO bị nghi ngại và cách triển khai thành công."
  ms: "Mengapa bioteknologi seperti GMO tidak dipercayai awam dan cara melaksanakannya."
  id: "Mengapa bioteknologi seperti GMO tak dipercaya publik dan cara menerapkannya."
  hi: "GMO और जीन एडिटिंग जैसी बायोटेक पर जन अविश्वास क्यों है और इसे सफल कैसे बनाएँ।"
outcomes:
  - en: "Assess the science, risks and benefits of biotech"
    zh: "评估生物技术的科学依据、风险与收益"
    zh-TW: "評估生物技術的科學依據、風險與效益"
    ja: "バイオ技術の科学・リスク・利点を評価する"
    ko: "생명공학의 과학·위험·이점 평가하기"
    vi: "Đánh giá khoa học, rủi ro và lợi ích"
    ms: "Menilai sains, risiko dan manfaat bioteknologi"
    id: "Menilai sains, risiko, dan manfaat bioteknologi"
    hi: "बायोटेक के विज्ञान, जोखिम और लाभ आँकना"
  - en: "Explain why people reject viable innovations"
    zh: "解释人们为何拒绝可行的创新"
    zh-TW: "解釋人們為何拒絕可行的創新"
    ja: "実用的な技術が拒まれる理由を説明する"
    ko: "실현 가능한 혁신이 거부되는 이유 설명하기"
    vi: "Giải thích vì sao xã hội từ chối đổi mới khả thi"
    ms: "Menerangkan mengapa inovasi ditolak"
    id: "Menjelaskan mengapa inovasi ditolak"
    hi: "व्यवहार्य नवाचारों के अस्वीकार के कारण बताना"
  - en: "Write clearly about biotech issues"
    zh: "清楚地撰写生物技术议题"
    zh-TW: "清楚地撰寫生物技術議題"
    ja: "バイオ技術の問題を分かりやすく書く"
    ko: "생명공학 이슈를 명확히 글로 쓰기"
    vi: "Viết rõ ràng về vấn đề công nghệ sinh học"
    ms: "Menulis dengan jelas tentang isu bioteknologi"
    id: "Menulis jelas tentang isu bioteknologi"
    hi: "बायोटेक मुद्दों पर स्पष्ट लेखन"
