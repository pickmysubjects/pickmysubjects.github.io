code: GEND10001
year: 2026
learn:
  en: "An introduction to gender studies: what gender is, where norms and stereotypes come from, and how they shape our lives."
  zh: "性别研究入门：性别是什么，规范与刻板印象从何而来，又如何影响生活。"
  zh-TW: "性別研究入門：性別是什麼，規範與刻板印象從何而來，又如何影響生活。"
  ja: "ジェンダー研究入門。ジェンダーとは何か、規範や固定観念はどこから来て、生活にどう影響するかを学ぶ。"
  ko: "젠더 연구 입문: 젠더란 무엇이며 규범과 고정관념은 어디서 와서 삶에 어떤 영향을 주는지 배운다."
  vi: "Nhập môn nghiên cứu giới: giới là gì, chuẩn mực và định kiến từ đâu ra và ảnh hưởng đời sống ra sao."
  ms: "Pengenalan kajian gender: apa itu gender, dari mana norma dan stereotaip datang, dan kesannya pada hidup kita."
  id: "Pengantar studi gender: apa itu gender, dari mana norma dan stereotip berasal, dan bagaimana pengaruhnya pada hidup kita."
  hi: "जेंडर स्टडीज़ का परिचय: जेंडर क्या है, मानदंड और रूढ़ियाँ कहाँ से आती हैं, और जीवन पर उनका असर।"
outcomes:
  - en: "Explain the core concepts of gender studies"
    zh: "解释性别研究的核心概念"
    zh-TW: "解釋性別研究的核心概念"
    ja: "ジェンダー研究の基本概念を説明する"
    ko: "젠더 연구의 핵심 개념 설명하기"
    vi: "Giải thích các khái niệm cốt lõi của nghiên cứu giới"
    ms: "Terangkan konsep teras kajian gender"
    id: "Menjelaskan konsep inti studi gender"
    hi: "जेंडर स्टडीज़ की मुख्य अवधारणाएँ समझाना"
  - en: "Analyse gender in media and everyday life"
    zh: "分析媒体和日常生活中的性别"
    zh-TW: "分析媒體和日常生活中的性別"
    ja: "メディアや日常生活の中のジェンダーを分析する"
    ko: "미디어와 일상 속 젠더 분석하기"
    vi: "Phân tích giới trong truyền thông và đời sống hằng ngày"
    ms: "Analisis gender dalam media dan kehidupan harian"
    id: "Menganalisis gender di media dan kehidupan sehari-hari"
    hi: "मीडिया और रोज़मर्रा जीवन में जेंडर का विश्लेषण करना"
  - en: "Write clear arguments using gender theory"
    zh: "运用性别理论写出清晰论证"
    zh-TW: "運用性別理論寫出清晰論證"
    ja: "ジェンダー理論を使って明確に論じる"
    ko: "젠더 이론으로 명확한 논증 쓰기"
    vi: "Viết lập luận rõ ràng dựa trên lý thuyết giới"
    ms: "Tulis hujah jelas menggunakan teori gender"
    id: "Menulis argumen jelas memakai teori gender"
    hi: "जेंडर सिद्धांत से स्पष्ट तर्क लिखना"
