code: COMP30019
year: 2026
learn:
  en: "How 2D and 3D graphics are made and how people interact with them, for games, VR and AR."
  zh: "2D/3D图形怎么生成、人怎么和它互动，用于游戏和VR/AR。"
  zh-TW: "2D/3D圖形怎麼產生、人怎麼和它互動，用於遊戲和VR/AR。"
  ja: "ゲームやVR・AR向けに、2D/3Dグラフィックスの作り方と操作のされ方を学ぶ。"
  ko: "게임, VR, AR을 위한 2D·3D 그래픽 제작 방법과 사람과의 상호작용."
  vi: "Cách tạo đồ họa 2D, 3D và cách người dùng tương tác với chúng, cho game, VR và AR."
  ms: "Cara grafik 2D dan 3D dihasilkan dan cara orang berinteraksi dengannya, untuk permainan, VR dan AR."
  id: "Cara grafis 2D dan 3D dibuat dan cara orang berinteraksi dengannya, untuk game, VR, dan AR."
  hi: "गेम, VR और AR के लिए 2D और 3D ग्राफ़िक्स कैसे बनते हैं और लोग उनसे कैसे इंटरैक्ट करते हैं।"
outcomes:
  - en: "Build interactive 3D graphics apps"
    zh: "做可交互的3D图形应用"
    zh-TW: "做可互動的3D圖形應用程式"
    ja: "インタラクティブな3Dグラフィックスアプリを作る"
    ko: "인터랙티브 3D 그래픽 앱 제작"
    vi: "Làm ứng dụng đồ họa 3D tương tác"
    ms: "Bina aplikasi grafik 3D interaktif"
    id: "Membuat aplikasi grafis 3D interaktif"
    hi: "इंटरैक्टिव 3D ग्राफ़िक्स ऐप बनाना"
  - en: "Use lighting, rendering and animation methods"
    zh: "用光照、渲染和动画技术"
    zh-TW: "運用光照、算圖和動畫技術"
    ja: "ライティング・レンダリング・アニメーション手法を使う"
    ko: "조명·렌더링·애니메이션 기법 활용"
    vi: "Dùng kỹ thuật ánh sáng, render và hoạt ảnh"
    ms: "Guna kaedah pencahayaan, rendering dan animasi"
    id: "Memakai teknik pencahayaan, rendering, dan animasi"
    hi: "लाइटिंग, रेंडरिंग और एनिमेशन तरीके इस्तेमाल करना"
  - en: "Test how easy an app is to use"
    zh: "评估应用好不好用"
    zh-TW: "評估應用程式好不好用"
    ja: "アプリの使いやすさをテストする"
    ko: "앱의 사용 편의성 테스트"
    vi: "Kiểm tra ứng dụng có dễ dùng không"
    ms: "Uji betapa mudah aplikasi digunakan"
    id: "Menguji seberapa mudah aplikasi dipakai"
    hi: "ऐप कितना आसान है, यह टेस्ट करना"
