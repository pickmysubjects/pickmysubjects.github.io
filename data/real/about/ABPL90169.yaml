code: ABPL90169
year: 2027
learn:
  en: "The final Master of Architecture studio: a self-directed, research-based design project resolved to a full architectural design."
  zh: "建筑硕士的毕业设计工作室：自主、以研究为基础的设计项目，做到完整建筑方案。"
  zh-TW: "建築碩士的畢業設計工作室：自主、以研究為基礎的設計專案，完成完整建築方案。"
  ja: "建築修士の卒業設計スタジオ：研究に基づく自主設計を完成した建築案まで仕上げる。"
  ko: "건축 석사 졸업 설계 스튜디오: 연구 기반 자율 프로젝트를 완성된 설계로."
  vi: "Studio tốt nghiệp thạc sĩ kiến trúc: dự án thiết kế tự định hướng dựa trên nghiên cứu, hoàn chỉnh."
  ms: "Studio akhir Sarjana Seni Bina: projek reka bentuk berasaskan penyelidikan hingga lengkap."
  id: "Studio akhir Magister Arsitektur: proyek desain berbasis riset hingga tuntas."
  hi: "आर्किटेक्चर मास्टर्स का अंतिम स्टूडियो: शोध-आधारित स्व-निर्देशित डिज़ाइन, पूरा समाधान।"
outcomes:
  - en: "Resolve an original architectural design in full"
    zh: "完整深化一个原创建筑设计"
    zh-TW: "完整深化一個原創建築設計"
    ja: "独自の建築設計を完成させる"
    ko: "독창적 건축 설계를 완성하기"
    vi: "Hoàn thiện một thiết kế kiến trúc độc đáo"
    ms: "Menyelesaikan reka bentuk seni bina asli"
    id: "Menuntaskan desain arsitektur orisinal"
    hi: "मौलिक वास्तु डिज़ाइन पूरा करना"
  - en: "Use design as a form of research"
    zh: "把设计作为一种研究方式"
    zh-TW: "把設計作為一種研究方式"
    ja: "設計を研究の手段として使う"
    ko: "설계를 연구 방식으로 활용하기"
    vi: "Dùng thiết kế như một cách nghiên cứu"
    ms: "Menggunakan reka bentuk sebagai penyelidikan"
    id: "Memakai desain sebagai bentuk riset"
    hi: "डिज़ाइन को शोध के रूप में अपनाना"
