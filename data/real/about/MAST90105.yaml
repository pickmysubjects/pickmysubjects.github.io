code: MAST90105
year: 2027
learn:
  en: "Probability and the theory behind statistical inference, both classical and Bayesian: likelihood, estimation and tests."
  zh: "概率及统计推断的理论基础（经典与贝叶斯）：似然、估计与检验。"
  zh-TW: "機率及統計推論的理論基礎（古典與貝氏）：概似、估計與檢定。"
  ja: "確率と統計的推論の理論（古典・ベイズ）：尤度、推定、検定。"
  ko: "확률과 통계적 추론 이론(고전·베이즈): 가능도, 추정, 검정."
  vi: "Xác suất và lý thuyết suy luận thống kê cổ điển và Bayes: hợp lý cực đại, ước lượng, kiểm định."
  ms: "Kebarangkalian dan teori inferens statistik klasik dan Bayes: kebolehjadian, anggaran, ujian."
  id: "Probabilitas dan teori inferensi statistik klasik dan Bayes: likelihood, estimasi, uji."
  hi: "प्रायिकता और सांख्यिकीय अनुमान का सिद्धांत (क्लासिकल व बेज़ियन): लाइकलीहुड, अनुमान, परीक्षण।"
outcomes:
  - en: "Work with random variables and their distributions"
    zh: "处理随机变量及其分布"
    zh-TW: "處理隨機變數及其分布"
    ja: "確率変数と分布を扱う"
    ko: "확률변수와 분포 다루기"
    vi: "Làm việc với biến ngẫu nhiên và phân phối"
    ms: "Bekerja dengan pemboleh ubah rawak dan taburannya"
    id: "Bekerja dengan variabel acak dan distribusinya"
    hi: "रैंडम वेरिएबल और उनके वितरण पर काम करना"
  - en: "Use likelihood to estimate and test"
    zh: "用似然方法进行估计与检验"
    zh-TW: "用概似方法進行估計與檢定"
    ja: "尤度で推定と検定を行う"
    ko: "가능도로 추정과 검정하기"
    vi: "Dùng hợp lý để ước lượng và kiểm định"
    ms: "Menggunakan kebolehjadian untuk anggaran dan ujian"
    id: "Memakai likelihood untuk estimasi dan uji"
    hi: "लाइकलीहुड से अनुमान और परीक्षण करना"
