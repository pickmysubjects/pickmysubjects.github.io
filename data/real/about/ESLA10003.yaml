code: ESLA10003
year: 2026
learn:
  en: "Build your academic English writing and speaking skills while exploring multicultural Australia."
  zh: "在了解多元文化澳大利亚的同时，提升学术英语写作和口语。"
  zh-TW: "在了解多元文化澳洲的同時，提升學術英文寫作和口說。"
  ja: "多文化社会オーストラリアを題材に、アカデミック英語の書く・話す力を伸ばす。"
  ko: "다문화 호주를 탐구하며 학술 영어 쓰기와 말하기 실력 키우기."
  vi: "Rèn kỹ năng viết và nói tiếng Anh học thuật qua chủ đề nước Úc đa văn hóa."
  ms: "Bina kemahiran menulis dan bertutur bahasa Inggeris akademik sambil meneroka Australia berbilang budaya."
  id: "Melatih menulis dan berbicara bahasa Inggris akademik sambil mengenal Australia yang multikultural."
  hi: "बहुसांस्कृतिक ऑस्ट्रेलिया को जानते हुए अकादमिक अंग्रेज़ी लिखना और बोलना सुधारना।"
outcomes:
  - en: "Write clear, well-structured academic essays"
    zh: "写出清晰、结构完整的学术论文"
    zh-TW: "寫出清晰、結構完整的學術論文"
    ja: "明確で構成のしっかりした学術レポートを書く"
    ko: "명확하고 구조가 잡힌 학술 에세이 쓰기"
    vi: "Viết bài luận học thuật rõ ràng, có cấu trúc"
    ms: "Tulis esei akademik yang jelas dan tersusun"
    id: "Menulis esai akademik yang jelas dan terstruktur"
    hi: "साफ़ और सुव्यवस्थित अकादमिक निबंध लिखना"
  - en: "Judge and cite academic sources properly"
    zh: "正确评估和引用学术资料"
    zh-TW: "正確評估和引用學術資料"
    ja: "学術資料を評価し正しく引用する"
    ko: "학술 자료를 평가하고 올바르게 인용하기"
    vi: "Đánh giá và trích dẫn nguồn học thuật đúng cách"
    ms: "Nilai dan petik sumber akademik dengan betul"
    id: "Menilai dan mengutip sumber akademik dengan benar"
    hi: "अकादमिक स्रोतों को परखना और सही ढंग से उद्धृत करना"
  - en: "Speak confidently in class discussions and presentations"
    zh: "在课堂讨论和展示中自信发言"
    zh-TW: "在課堂討論和報告中自信發言"
    ja: "授業の議論や発表で自信を持って話す"
    ko: "수업 토론과 발표에서 자신 있게 말하기"
    vi: "Tự tin phát biểu khi thảo luận và thuyết trình"
    ms: "Bercakap dengan yakin dalam perbincangan dan pembentangan"
    id: "Berbicara percaya diri dalam diskusi dan presentasi"
    hi: "कक्षा चर्चा और प्रस्तुति में आत्मविश्वास से बोलना"
