code: MKTG30009
year: 2026
learn:
  en: "Marketing on the internet: online consumer behaviour, web business models, website design and search marketing."
  zh: "互联网营销：线上消费者行为、网络商业模式、网站设计和搜索营销。"
  zh-TW: "網路行銷：線上消費者行為、網路商業模式、網站設計和搜尋行銷。"
  ja: "インターネットのマーケティング：オンライン消費者行動、ビジネスモデル、サイト設計、検索マーケ。"
  ko: "인터넷 마케팅: 온라인 소비자 행동, 웹 비즈니스 모델, 웹사이트 디자인, 검색 마케팅."
  vi: "Marketing trên internet: hành vi khách hàng online, mô hình kinh doanh web, thiết kế website và marketing tìm kiếm."
  ms: "Pemasaran internet: tingkah laku pengguna dalam talian, model perniagaan web, reka laman dan pemasaran carian."
  id: "Pemasaran internet: perilaku konsumen online, model bisnis web, desain situs, dan pemasaran mesin pencari."
  hi: "इंटरनेट मार्केटिंग: ऑनलाइन ग्राहक व्यवहार, वेब बिज़नेस मॉडल, वेबसाइट डिज़ाइन और सर्च मार्केटिंग।"
outcomes:
  - en: "Recommend and carry out online marketing strategies"
    zh: "提出并执行网络营销策略"
    zh-TW: "提出並執行網路行銷策略"
    ja: "ネットマーケティング戦略を提案し実行する"
    ko: "온라인 마케팅 전략 제안하고 실행하기"
    vi: "Đề xuất và triển khai chiến lược marketing online"
    ms: "Cadang dan laksana strategi pemasaran dalam talian"
    id: "Mengusulkan dan menjalankan strategi pemasaran online"
    hi: "ऑनलाइन मार्केटिंग रणनीति सुझाना और लागू करना"
  - en: "Analyse web data to guide marketing choices"
    zh: "分析网络数据来指导营销决策"
    zh-TW: "分析網路資料來引導行銷決策"
    ja: "ウェブのデータを分析して判断に活かす"
    ko: "웹 데이터를 분석해 마케팅 결정에 활용하기"
    vi: "Phân tích dữ liệu web để định hướng marketing"
    ms: "Analisis data web untuk panduan keputusan pemasaran"
    id: "Menganalisis data web untuk arah pemasaran"
    hi: "वेब डेटा का विश्लेषण कर मार्केटिंग फ़ैसले लेना"
  - en: "Run paid and organic search marketing"
    zh: "做付费和自然搜索营销"
    zh-TW: "做付費和自然搜尋行銷"
    ja: "有料・自然検索のマーケティングを行う"
    ko: "유료·자연 검색 마케팅 실행하기"
    vi: "Thực hiện marketing tìm kiếm trả phí và tự nhiên"
    ms: "Jalankan pemasaran carian berbayar dan organik"
    id: "Menjalankan pemasaran pencarian berbayar dan organik"
    hi: "पेड और ऑर्गेनिक सर्च मार्केटिंग चलाना"
