  areas: [BMEN, CHEN, COMP, CVEN, ELEN, ENEN, ENGR, GEOM, INFO, ISYS, MCEN, SWEN]
  subjects: [EDUC20071, MULT20018, MULT30022, MULT30023, MULT30024]
