id: des-architecture
course: B-DES
year: 2026
kind: major
title: Architecture
points: 125
# From 2027 a B-DES major counts its level-2 subjects too (2027 Handbook).
requirements:
  # Level 2 Major Core
  - all: [ARCH20001, ARCH20002, ARCH20003, ARCH20004, ABPL20033, ABPL20055]
  # Level 3 Major Core
  - all: [ABPL30041, ARCH30001]
  # Capstone
  - all: [ARCH30002]
# 2027 Handbook: no subjects taught by the Faculty of Architecture, Building and Planning (ABP) as breadth. Its subject areas
# are read from the Handbook search by faculty; the other codes are that faculty's subjects in mixed areas.
non_allowed_breadth:
  areas: [ABPL, ARCH, CONS, LARC, PLAN, PROP]
handbook: https://handbook.unimelb.edu.au/2027/components/b-des-major-1
