id: des-digital-infrastructure-engineering-systems
course: B-DES
year: 2026
kind: major
title: Digital Infrastructure Engineering Systems
points: 100
# From 2027 a B-DES major counts its level-2 subjects too (2027 Handbook).
requirements:
  # Level 2 Major Core
  - all: [GEOM20013, GEOM20015, CVEN20001]
  # Level 2 Major Elective
  - choose: { points: 12.5, from: [COMP20005, ENGR20005] }
  # Level 3 Major Core
  - all: [GEOM30009, CVEN30008, GEOM30014]
  # Capstone
  - all: [GEOM30012]
# 2027 Handbook: no subjects taught by the Faculty of Engineering and IT (FEIT) as breadth. Its subject areas
# are read from the Handbook search by faculty; the other codes are that faculty's subjects in mixed areas.
non_allowed_breadth:
  areas: [BMEN, CHEN, COMP, CVEN, ELEN, ENEN, ENGR, GEOM, INFO, ISYS, MCEN, SWEN]
  subjects: [EDUC20071, MULT20018, MULT30022, MULT30023, MULT30024]
handbook: https://handbook.unimelb.edu.au/2027/components/b-des-major-13
