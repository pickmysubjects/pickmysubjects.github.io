id: spanish-and-latin-american-studies-minor
course: B-ARTS
year: 2026
kind: minor
title: Spanish and Latin American Studies
points: 50
# Entry points by prior knowledge of the language. The page lists one "Spanish minor electives" table (under Entry Point 5); its Level 3 part serves Entry Point 3 too.
routes:
  - title: Entry Point 1
    requirements:
      # Level 2 core: SPAN20002 and SPAN20003, or SPAN20027 alone.
      - choose: { points: 25, from: [SPAN20002, SPAN20003, SPAN20027] }
      # Level 3 core.
      - all: [SPAN30014, SPAN30015]
  - title: Entry Point 3
    requirements:
      # Level 2 core.
      - all: [SPAN20018, SPAN20019]
      # Level 3 core.
      - all: [SPAN30016]
      # Level 3 elective.
      - choose: { points: 12.5, from: [LANG30001, SPAN30001, SPAN30012, SPAN30020, SPAN30021, SPAN30024] }
  - title: Entry Point 5
    requirements:
      # Level 2 core.
      - all: [SPAN20022]
      # Level 2 elective.
      - choose: { points: 12.5, from: [SPAN20016, SPAN20025, SPAN20028] }
      # 25 points of Level 3 minor electives.
      - choose: { points: 25, from: [LANG30001, SPAN30001, SPAN30012, SPAN30020, SPAN30021, SPAN30024] }
handbook: https://handbook.unimelb.edu.au/2026/courses/b-arts/majors-minors-specialisations
verified_on: 2026-10-19 # structure; source: 2026 Handbook minor page
