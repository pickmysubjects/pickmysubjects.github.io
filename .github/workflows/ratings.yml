name: Aggregate ratings
on:
  schedule:
    - cron: '17 18 * * *' # daily, early morning Melbourne time
  workflow_dispatch:
permissions:
  contents: write
jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fetch and aggregate (skips if secrets are not set)
        run: npx tsx scripts/ratings/fetch.ts
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          RATINGS_SHEET_ID: ${{ secrets.RATINGS_SHEET_ID }}
      - name: Validate data
        run: npm run data
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain data/real/ratings.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/real/ratings.json
            git commit -m "data: update aggregated ratings"
            git push
          fi
