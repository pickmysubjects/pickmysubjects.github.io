name: IndexNow
# Weekly, so Bing (and ChatGPT search, Copilot) learn about new and changed pages without waiting
# for a crawl. Not on every deploy: several deploys a day would read as spam. Run it by hand
# after a big data change.
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/indexnow.ts
