name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Pushes made with GITHUB_TOKEN (the weekly ratings commit) don't trigger workflows, so redeploy after it.
  workflow_run:
    workflows: [Aggregate ratings]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history: the sitemap dates each subject page from when its data last changed.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
  # Tell Bing and other IndexNow engines about the pages, once the new version is live. At most
  # once a day (a cache entry named after the UTC date marks the day as done), since several full
  # submissions a day would read as spam. A failure here never fails the deploy, and the next
  # deploy that day tries again.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - id: day
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - id: done
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .indexnow-sent
          key: indexnow-${{ steps.day.outputs.date }}
          lookup-only: true
      - if: steps.done.outputs.cache-hit != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - if: steps.done.outputs.cache-hit != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      # No dependencies to install: the script runs on plain Node.
      - if: steps.done.outputs.cache-hit != 'true'
        run: node scripts/indexnow.ts && echo "${{ steps.day.outputs.date }}" > .indexnow-sent
      - if: steps.done.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .indexnow-sent
          key: indexnow-${{ steps.day.outputs.date }}
