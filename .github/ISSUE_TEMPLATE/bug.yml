name: Something is broken
description: The app does something wrong or crashes.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: 1. Open Plan  2. Choose …  3. Click …
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome on Mac / Safari on iPhone
