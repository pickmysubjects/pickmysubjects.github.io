<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbeaf3" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d0d0f" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="PickMySubjects" />
    <meta name="description" content="Free, unofficial subject guide and degree planner for University of Melbourne students: subject reviews and difficulty, suggestions for your marks and interests, and a checked plan for your whole degree. In 9 languages. Not affiliated with the University." />
    <title>PickMySubjects</title>
    <!-- While the app starts, hide the build-time plain text (kept for search engines and no-JS
         readers) behind a quiet loader, so the page never flashes unstyled. If the app hasn't
         drawn after 8 s, show the plain text after all. -->
    <script src="/boot.js"></script>
    <!-- Anonymous visit counts (GoatCounter, no cookies). The app counts pages and a few actions itself. -->
    <script defer data-goatcounter="https://pickmysubjects.goatcounter.com/count" data-goatcounter-settings='{"no_onload":true}' src="/count.js"></script>
    <style>
      html.booting, html.booting body { background: #fbeaf3; }
      @media (prefers-color-scheme: dark) { html.booting, html.booting body { background: #0d0d0f; } }
      html.booting #app > .prerender { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
      html.booting #app:has(> .prerender)::before {
        content: ''; position: fixed; inset: 50% auto auto 50%; width: 28px; height: 28px; margin: -14px 0 0 -14px;
        border: 3px solid rgb(194 34 122 / 20%); border-top-color: #c2227a; border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { html.booting #app:has(> .prerender)::before { animation-duration: 2.4s; } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
